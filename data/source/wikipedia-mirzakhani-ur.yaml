summary:
  ar: "مقالة ويكيبيديا الأردية عن مریم میرزاخانی؛ تُستخدم لوقائع الكيان فقط. تعطي حياتها 3 أيار 1977 – 15 تموز 2017، وتصفها في متنها بأنها أول إيرانية وأول شخصية مسلمة تنال ميدالية فيلدز، وهو الوصف العام الوحيد لدينها في أي طبعة."
  en: "Urdu Wikipedia article on Maryam Mirzakhani; used for entity facts only. It gives her life as 3 May 1977 – 15 July 2017 and describes her in its text as the first Iranian and first Muslim personality to win the Fields Medal — the only generic description of her religion in any edition."
  es: "Artículo de Wikipedia en urdu sobre Maryam Mirzakhani; utilizado únicamente para datos biográficos. Indica que su vida transcurrió entre el 3 de mayo de 1977 y el 15 de julio de 2017, y la describe como la primera personalidad iraní y musulmana en ganar la Medalla Fields; esta es la única mención genérica de su religión en cualquier edición."
  fr: "Article de Wikipédia en ourdou sur Maryam Mirzakhani; utilisé uniquement à titre informatif. Il indique ses dates de naissance et de décès: 3 mai 1977 – 15 juillet 2017. Il la décrit comme la première Iranienne et la première personnalité musulmane à recevoir la médaille Fields – la seule mention de sa religion dans toutes les éditions."
  ur: "مریم مرزاخانی پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اس کی زندگی 3 مئی 1977 - 15 جولائی 2017 کے طور پر بیان کرتا ہے اور اسے اپنے متن میں فیلڈز میڈل جیتنے والی پہلی ایرانی اور پہلی مسلم شخصیت کے طور پر بیان کرتا ہے - کسی بھی ایڈیشن میں اس کے مذہب کی واحد عمومی وضاحت۔"
