summary:
  ar: "مقالة ويكيبيديا العربية عن ألطاف حسين حالي؛ تُستخدم لوقائع الكيان فقط. تؤكد مولده في بانيبات سنة 1837 ووفاته فيها في 31 ديسمبر 1914، وتفاصيل نشأته ودراسته ومسيرته ومؤلفاته كما في المقالة الإنجليزية."
  en: "Arabic Wikipedia article on Altaf Hussain Hali; used for entity facts only. It confirms his birth at Panipat in 1837 and his death there on 31 December 1914, with the same life narrative as the English article."
  es: "Artículo en árabe de la Wikipedia sobre Altaf Hussain Hali; se utiliza únicamente para datos biográficos. Confirma su nacimiento en Panipat en 1837 y su fallecimiento allí el 31 de diciembre de 1914, con la misma biografía que el artículo en inglés."
  fr: "Article de Wikipédia en arabe sur Altaf Hussain Hali; utilisé uniquement pour les informations relatives à l’entité. Il confirme sa naissance à Panipat en 1837 et son décès dans cette même ville le 31 décembre 1914, reprenant le même récit biographique que l’article en anglais."
  ur: "الطاف حسین حالی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1837 میں پانی پت میں اس کی پیدائش اور 31 دسمبر 1914 کو ان کی موت کی تصدیق کرتا ہے، اسی زندگی کی داستان کے ساتھ انگریزی مضمون۔"
  tr: "Altaf Hüseyin Hali hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1837'de Panipat'ta doğduğunu ve 31 Aralık 1914'te orada öldüğünü, yetiştirilme tarzı, eğitimi, kariyeri ve yazılarıyla ilgili İngilizce makalede olduğu gibi doğrulamakta."
  id: "Artikel Wikipedia berbahasa Arab tentang Altaf Hussein Hali; digunakan hanya untuk fakta entitas. Artikel ini mengonfirmasi kelahirannya di Panipat pada tahun 1837 dan kematiannya di sana pada 31 Desember 1914, beserta rincian tentang masa kecilnya, pendidikan, karier, dan tulisannya seperti dalam artikel bahasa Inggris."
