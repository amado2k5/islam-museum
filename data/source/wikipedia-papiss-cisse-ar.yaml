  ar: "مقالة ويكيبيديا العربية عن بابيس سيسيه؛ تُستخدم لوقائع الكيان فقط. مقالة قصيرة تغطي ميلاده سنة 1985 في داكار ومسيرته مع الأندية، ولا يذكر نصها ديانته؛ ورد اسمه فقط في تصنيف «مسلمون سنغاليون»."
  en: "Arabic Wikipedia article on Papiss Cissé; used for entity facts only. A short article covering his 1985 Dakar birth and club career; its text makes no statement of his religion, filing him only under the category “Senegalese Muslims”."
  es: "Artículo de Wikipedia en árabe sobre Papiss Cissé; utilizado únicamente para datos sobre la persona. Un breve artículo que abarca su nacimiento en Dakar en 1985 y su trayectoria en clubes; su texto no menciona su religión, sino que lo clasifica simplemente como «musulmán senegalés»."
  fr: "Article Wikipédia en arabe sur Papiss Cissé; utilisé uniquement à des fins d’information sur l’individu. Ce court article retrace sa naissance à Dakar en 1985 et sa carrière en club; il ne mentionne pas sa religion et le classe uniquement dans la catégorie « Musulmans sénégalais »."
  ur: "Papiss Cissé پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ ان کے 1985 ڈاکار کی پیدائش اور کلب کیریئر کا احاطہ کرنے والا ایک مختصر مضمون۔ اس کے متن میں اس کے مذہب کا کوئی بیان نہیں ہے، اسے صرف \"سینیگالی مسلمان\" کے زمرے میں درج کیا گیا ہے۔"
  tr: "Babis Cissé hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1985'te Dakar'da doğduğu ve kulüplerdeki kariyerini konu alan kısa bir makale, dini belirtilmemiştir; adı sadece \"Senegal Müslümanları\" kategorisinde geçer."
  id: "Artikel Wikipedia Arab tentang Babis Cissé; hanya digunakan untuk fakta entitas. Artikel singkat yang membahas kelahirannya pada tahun 1985 di Dakar dan kariernya di klub, tanpa menyebutkan agamanya; namanya hanya muncul dalam kategori \"Muslim Senegal.\""
