summary:
  ar: "مقالة ويكيبيديا الألمانية عن باوا محيي الدين، تصفه في صدرها بأنه وليّ صوفي من سريلانكا وُلد نحو سنة 1900 وتوفي في 8 ديسمبر 1986 في فيلادلفيا، وتذكر تأسيسه الزمالة في فيلادلفيا وقبره في كواتسفيل."
  en: "The German Wikipedia article on Bawa Muhaiyaddeen, whose lead calls him a Sufi saint from Sri Lanka, born c. 1900 and died 8 December 1986 in Philadelphia; it records his founding of the Fellowship in Philadelphia and his grave at Coatesville, resting on Renard’s A to Z of Sufism."
  es: "El artículo de la Wikipedia en alemán sobre Bawa Muhaiyaddeen, cuyo titular lo describe como un santo sufí de Sri Lanka, nacido alrededor de 1900 y fallecido el 8 de diciembre de 1986 en Filadelfia, recoge la fundación de su congregación en Filadelfia y su tumba en Coatesville, y se basa en el libro \"De la A a la Z del sufismo\" de Renard."
  fr: "L'article de Wikipédia en allemand sur Bawa Muhaiyaddeen, qui le décrit comme un saint soufi du Sri Lanka, né vers 1900 et décédé le 8 décembre 1986 à Philadelphie, mentionne la fondation de sa communauté à Philadelphie et sa tombe à Coatesville, figurant dans l'ouvrage de Renard intitulé « A à Z du soufisme »."
  ur: "باوا محی الدین پر جرمن ویکیپیڈیا کا مضمون، جس کی قیادت انہیں سری لنکا سے ایک صوفی بزرگ کہتی ہے، پیدائش c. 1900 اور وفات 8 دسمبر 1986 کو فلاڈیلفیا میں۔ اس میں فلاڈیلفیا میں اس کی فیلوشپ کی بنیاد اور کوٹس ول میں اس کی قبر کو ریکارڈ کیا گیا ہے، جو تصوف کے رینارڈ کے A سے Z تک ہے۔"
  tr: "Almanca Wikipedia makalesi, Bawa Muhyiddin hakkında en üst sıralarda Sri Lanka'dan bir Sufi azizi olarak tanımlanır; yaklaşık 1900 doğumlu ve 8 Aralık 1986'da Philadelphia'da ölmüştür. Topluluğun Philadelphia'da kurulmasından ve Coatesville'deki mezarından bahsedilir."
  id: "Artikel Wikipedia Jerman tentang Bawa Muhyiddin menggambarkannya di puncak sebagai wali Sufi dari Sri Lanka, lahir sekitar tahun 1900 dan meninggal pada 8 Desember 1986 di Philadelphia. Artikel tersebut menyebutkan pendirian persekutuan di Philadelphia dan makamnya di Coatesville."
