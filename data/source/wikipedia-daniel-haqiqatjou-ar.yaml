summary:
  ar: "مقالة ويكيبيديا العربية عن دانيال حقيقتجو؛ تُستخدم لوقائع الكيان فقط. تصفه بأنه مجادل مسلم شيعي أمريكي وكاتب ومتحدث، من مؤيدي الوحدة الإسلامية بين المذاهب ومن منتقدي الوهابية وتكفيرها لبقية المذاهب، وتذكر ميلاده في هيوستن سنة 1985/1986 ودراسته الفيزياء في هارفارد والماجستير في تافتس."
  en: "Arabic Wikipedia article on Daniel Haqiqatjou; used for entity facts only. It describes him as an American Shia Muslim debater, writer and public speaker, a supporter of Islamic unity across the schools and a critic of Wahhabism and its takfir of other schools, and gives his birth in Houston in 1985/1986, his physics studies at Harvard and his master's at Tufts."
  es: "Artículo de Wikipedia en árabe sobre Daniel Haqiqatjou; utilizado únicamente para datos sobre la persona. Lo describe como un orador, escritor y defensor de la unidad islámica entre las distintas escuelas, musulmán chiíta estadounidense y crítico del wahabismo y su takfir (excomunión) de otras escuelas. Asimismo, indica que nació en Houston en 1985/1986, estudió física en Harvard y obtuvo su maestría en Tufts."
  fr: "Article de Wikipédia en arabe sur Daniel Haqiqatjou; utilisé uniquement à des fins d'information sur l'entité. Il le décrit comme un débatteur, écrivain et orateur public chiite américain, partisan de l'unité islamique entre les différentes écoles et critique du wahhabisme et de son rejet des autres écoles. L'article indique également sa naissance à Houston en 1985 ou 1986, ses études de physique à Harvard et son master à Tufts."
  ur: "عربی ویکیپیڈیا مضمون دانیال حقیقاتجو پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اسے ایک امریکی شیعہ مسلمان مباحثہ کرنے والے، مصنف اور عوامی مقرر، تمام اسکولوں میں اسلامی اتحاد کے حامی اور وہابیت اور دوسرے مکاتب کی تکفیر کے ناقد کے طور پر بیان کیا گیا ہے، اور اس کی پیدائش ہیوسٹن میں 1985/1986 میں ہوئی، اس نے ہارورڈ میں فزکس کی تعلیم حاصل کی اور ٹفٹس میں ماسٹرز کیا۔"
  tr: "Daniel Haqiqatjo hakkında Arapça Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılmıştır. Onu Şii Amerikalı Müslüman polemikçi, yazar ve konuşmacı, mezhepler arasında İslami birliğin destekçisi ve Vahhabiliğin ve diğer mezheplerin kafir ilan edilmesinin eleştirmeni olarak tanımlar. 1985/1986 yıllarında Houston'da doğduğu, Harvard'da fizik okuduğu, Tufts'ta yüksek lisans derecesi aldığı belirtilir."
  id: "Artikel Wikipedia berbahasa Arab tentang Daniel Haqiqatjo hanya digunakan untuk fakta entitas tersebut. Ia menggambarkannya sebagai seorang polemis, penulis, dan pembicara Muslim Syiah Amerika, pendukung persatuan Islam antar sekte, serta kritikus Wahhabisme dan deklarasi sekte lain sebagai kafir. Disebutkan bahwa ia lahir di Houston pada tahun 1985/1986, belajar fisika di Harvard, dan meraih gelar magister di Tufts."
