  ar: "تقرير ألفريد هاكنسبرغر في موقع قنطرة في 23 أبريل 2010 عن أزمة إسلام أون لاين: اعتصام نحو 350 موظفًا في القاهرة منذ 15 مارس 2010، وخلاف هيئة التحرير مع جمعية البلاغ في قطر، وإقصاء القرضاوي من رئاسة الجمعية، ومطالب التعويض."
  en: "Alfred Hackensberger's report in Qantara.de of 23 April 2010 on the IslamOnline crisis: the sit-in of about 350 staff in Cairo from 15 March 2010, the editors' dispute with the Al-Balagh society in Qatar, al-Qaradawi's removal as the society's chairman, and the severance claims."
