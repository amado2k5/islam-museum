summary:
  ar: "مقالة ويكيبيديا الأردية عن لعل شہباز قلندر؛ تعطي سنواته 1177–1274 وتصفه بأنه صوفي بزرگ وقلندر، وتذكر في صندوقها سلسلتي القلندرية والقادرية وتحسب 673 هـ سنة 1275؛ تُستخدم لوقائع الكيان فقط مع هذه التنبيهات."
  en: "Urdu Wikipedia article on Lal Shahbaz Qalandar; it gives his years as 1177-1274 and describes him as a Sufi elder and Qalandar, while its infobox names the Qalandari and Qadiri orders and converts 673 AH to 1275; used for entity facts only, with those cautions."
  es: "Artículo de Wikipedia en urdu sobre Lal Shahbaz Qalandar; da sus años como 1177-1274 y lo describe como un anciano sufí y Qalandar, mientras que su cuadro de información nombra las órdenes Qalandari y Qadiri y convierte 673 AH en 1275; Se utiliza únicamente para hechos de entidades, con esas precauciones."
  fr: "Article Wikipédia en ourdou sur Lal Shahbaz Qalandar; il donne ses années comme 1177-1274 et le décrit comme un ancien soufi et Qalandar, tandis que sa boîte d'information nomme les ordres Qalandari et Qadiri et convertit 673 AH en 1275; utilisé uniquement pour les faits d’entité, avec ces mises en garde."
  ur: "لعل شہباز قلندر پر اردو ویکیپیڈیا مضمون؛ یہ ان کے سال 1177-1274 بتاتا ہے اور اسے ایک صوفی بزرگ اور قلندر کے طور پر بیان کرتا ہے، جبکہ اس کے معلوماتی خانے کو قلندری اور قادری احکامات کا نام دیا جاتا ہے اور 673 ہجری کو 1275 میں تبدیل کیا جاتا ہے۔ ان احتیاطوں کے ساتھ، صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔"
  tr: "Urduca Vikipedi makalesi 'Belki Şahbaz Qalandar' yıllarını 1177–1274 olarak verir ve onu büyük bir Sufi ve Kalandar olarak tanımlar, kutusunda Qalandariya ve Kadiriye tarikatlarından bahseder ve 673 Hicri ile 1275 yılları arasında sayılır; bu notlar yalnızca varlığın olayları için kullanılır."
  id: "Artikel Wikipedia Urdu tentang 'Mungkin Shahbaz Qalandar' menyebutkan tahun-tahunnya 1177–1274 dan menggambarkannya sebagai seorang Sufi dan Qalandar besar, menyebutkan dalam kotaknya ordo Qalandariya dan Qadiriya, dan menghitung 673 H hingga 1275; hanya digunakan untuk peristiwa entitas tersebut dengan catatan tersebut."
