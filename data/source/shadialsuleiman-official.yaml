summary:
  ar: "الموقع الرسمي لشادي السليمان؛ مصدر أولي لعرضه الذاتي. تذكر سيرته إجازته في القرآن وماجستير الدراسات الشرعية الإسلامية، والشيوخ الذين درس عليهم، ومؤسساته ورئاسته المجلس الوطني للأئمة في أستراليا. لا يذكر الموقع مدرسة فقهية له."
  en: "Shady Alsuleiman's official website; a primary source for his self-presentation. Its biography records his ijazah in the Qur'an and a Master of Sharia Islamic Studies, the imams and scholars he studied under, and his foundations and his presidency of the Australian National Imams Council. The site names no legal school for him."
  es: "El sitio web oficial de Shady Alsuleiman es una fuente principal para su autoimagen. Su biografía registra su ijazah (certificación para la enseñanza del Corán) y su maestría en Estudios Islámicos Sharia, los imanes y eruditos con quienes estudió, así como sus fundaciones y su presidencia del Consejo Nacional de Imanes de Australia. El sitio no menciona ninguna escuela jurídica a la que pertenezca."
  fr: "Le site web officiel de Shady Alsuleiman, source principale de sa présentation personnelle, mentionne son ijazah (autorisation d'étudier le Coran) et son master en études islamiques (charia), les imams et les érudits auprès desquels il a étudié, ainsi que ses fondations et sa présidence du Conseil national des imams australiens. Aucune école juridique n'est mentionnée pour cet établissement."
  ur: "شیڈی السلیمان کی سرکاری ویب سائٹ؛ اس کی خود کو پیش کرنے کا ایک بنیادی ذریعہ۔ اس کی سوانح عمری میں قرآن میں اس کے اعجاز اور شریعہ اسلامیات کے ماسٹر، ائمہ اور اسکالرز کو درج کیا گیا ہے جن کے تحت اس نے تعلیم حاصل کی، اور اس کی بنیادیں اور آسٹریلیائی قومی امامس کونسل کی ان کی صدارت۔ سائٹ میں اس کے لیے کسی قانونی اسکول کا نام نہیں ہے۔"
  tr: "Shadi Al-Suleiman'ın resmi web sitesi; kişisel sunumu için birincil kaynaktır. Biyografisinde Kur'an sertifikasından, İslami Şeriat alanında yüksek lisans derecesinden, birlikte çalıştığı şeyhlerden, kurumlarından ve Avustralya Ulusal İmamlar Konseyi başkanlığından bahsedilmektedir. Site, onun herhangi bir fıkıh fakültesinden bahsetmemektedir."
  id: "Situs resmi Shadi Al-Suleiman; sumber utama untuk presentasi pribadinya. Biografinya menyebutkan sertifikasi Al-Quran, gelar magister studi Syariah Islam, para sheikh yang ia pelajari, institusinya, dan kepemimpinannya di Dewan Nasional Imam di Australia. Situs tersebut tidak menyebutkan aliran hukum mana pun miliknya."
