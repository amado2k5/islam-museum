summary:
  ar: "الموقع الرسمي لشادي السليمان؛ مصدر أولي لعرضه الذاتي. تذكر سيرته إجازته في القرآن وماجستير الدراسات الشرعية الإسلامية، والشيوخ الذين درس عليهم، ومؤسساته ورئاسته المجلس الوطني للأئمة في أستراليا. لا يذكر الموقع مدرسة فقهية له."
  en: "Shady Alsuleiman's official website; a primary source for his self-presentation. Its biography records his ijazah in the Qur'an and a Master of Sharia Islamic Studies, the imams and scholars he studied under, and his foundations and his presidency of the Australian National Imams Council. The site names no legal school for him."
