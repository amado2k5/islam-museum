  ar: "مقالة ويكيبيديا الإنجليزية عن داغ دهلوي؛ تُستخدم لوقائع الكيان فقط. تروي حياته من ولادته في دلهي سنة 1831 إلى وفاته في حيدر آباد سنة 1905، وتلمذته على ذوق وغالب، وخدمته في رامبور ثم بلاط نظام حيدر آباد، ولا تذكر دينه أو مذهبه في نصها."
  en: "English Wikipedia article on Dagh Dehlvi; used for entity facts only. It recounts his life from his birth in Delhi in 1831 to his death in Hyderabad in 1905, his tutelage under Zauq and Ghalib, his Rampur service and his appointment as court poet to the Nizam of Hyderabad; its text makes no statement of his religion or school."
