reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 at the recorded revision, fetched by revision id and asserted equal before any claim was drawn. It gives his birth as Nawab Mirza Khan on 25 May 1831 at Kucha Ustad Dagh, Chandni Chowk, Delhi, son of Nawab Shamsuddin Ahmed Khan of Loharu and Ferozepur Jhirka and Wazir Khanum; his Red Fort upbringing after his mother's remarriage to the crown prince Mirza Fakhru; his training under the poet laureate Zauq and his taking advice from Ghalib; twenty-four years of service at Rampur; his appointment in 1891 as court poet and mentor to the sixth Nizam, Mahbub Ali Khan; and his death on 17 March 1905 at Hyderabad after a paralytic stroke, buried at Dargah Yousufain. The birth and death dates rest on a Goodreads profile citation, which is weak; the Urdu article and Wikidata agree on them. Its text makes no statement of his religion; its categories file him under 19th-century Indian Muslims, a filing and not an attestation."
