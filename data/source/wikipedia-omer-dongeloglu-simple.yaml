summary:
  ar: "مقالة ويكيبيديا الإنجليزية المبسطة عن عمر دونغل أوغلو؛ تُستخدم لوقائع الكيان فقط. تؤكد أنه عالم دين وكاتب ومنتج ومقدّم تلفزيوني تركي عُرف ببرامجه الدينية على قناة كنال 7، وأنه وُلد في زيله وتوفي بكوفيد-19 في إسطنبول في 3 مايو 2020."
  en: "Simple English Wikipedia article on Ömer Döngeloğlu; used for entity facts only. It confirms that he was a Turkish theologian, writer, producer and television presenter known for his religious programmes on Kanal 7, that he was born in Zile, and that he died from COVID-19 in Istanbul on 3 May 2020."
  es: "Artículo de Wikipedia en inglés sencillo sobre Ömer Döngeloğlu; utilizado únicamente para datos sobre la persona. Confirma que fue un teólogo, escritor, productor y presentador de televisión turco conocido por sus programas religiosos en Kanal 7, que nació en Zile y que falleció a causa de la COVID-19 en Estambul el 3 de mayo de 2020."
  fr: "Article Wikipédia en anglais simplifié sur Ömer Döngeloğlu; utilisé uniquement à des fins d’information sur la personne. Il confirme qu’il était un théologien, écrivain, producteur et présentateur de télévision turc, connu pour ses émissions religieuses sur Kanal 7, qu’il est né à Zile et qu’il est décédé de la COVID-19 à Istanbul le 3 mai 2020."
  ur: "Ömer Döngeloğlu پر سادہ انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس سے اس بات کی تصدیق ہوتی ہے کہ وہ ایک ترک ماہر الٰہیات، مصنف، پروڈیوسر اور ٹیلی ویژن پیش کنندہ تھا جو کنال 7 پر اپنے مذہبی پروگراموں کے لیے جانا جاتا تھا، کہ وہ زیل میں پیدا ہوا تھا، اور وہ 3 مئی 2020 کو استنبول میں COVID-19 سے انتقال کر گیا تھا۔"
  tr: "Omar Dongılüğlu hakkında basitleştirilmiş İngilizce Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılmıştır. Bu makale, onun Canal 7'deki dini programlarıyla tanınan Türk dini alim, yazar, yapımcı ve TV sunucusu olduğunu, Zeile'de doğduğunu ve 3 Mayıs 2020'de İstanbul'da COVID-19'dan öldüğünü doğrulamaktadır."
  id: "Artikel Wikipedia bahasa Inggris yang disederhanakan tentang Omar Dongılüğlu hanya digunakan untuk fakta entitas tersebut. Artikel ini mengonfirmasi bahwa ia adalah seorang cendekiawan agama, penulis, produser, dan pembawa acara TV Turki yang dikenal lewat program keagamaannya di Canal 7, dan bahwa ia lahir di Zeile dan meninggal karena COVID-19 di Istanbul pada 3 Mei 2020."
