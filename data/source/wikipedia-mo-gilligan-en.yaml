reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision via the MediaWiki API on 1 November 2026; a fact is used only where the article cites a source for it (Wikipedia broad rule). Used for his birth name Mosiah Bikila Gilligan and his birth on 19 February 1988 in Lambeth, London (cited to Companies House records via Company Check), his Jamaican and St Lucian parentage, his upbringing in Camberwell and schooling at Pimlico, and his career: social-media comedy clips, co-hosting The Big Narstie Show from 2018, hosting The Lateish Show with Mo Gilligan from 2019, and judging The Masked Singer UK from 2020. The personal-life sentence 'He is a Christian, and attends Hillsong Church in Golders Green' is cited only to a BBC iPlayer programme page (Live at the Apollo); no second independent text attesting his Christianity was found, so the sentence is preserved in the record's faith note but settles nothing under the founder's rulings of 1 November 2026."
