summary:
  ar: "طبعة دار المعرفة في مجلد ضخم، بمقدمة للمحقق خليل بن مأمون شيحا فيها ترجمة أبي يعلى منقولة في أكثرها عن الذهبي مع زيادات (ص 4-12)، وفصل في صحة نسبة المسند إليه (ص 13-15)، وكلام في منزلته في الجرح والتعديل وفي درجة أحاديث المسند (ص 16-18)، ثم المتن."
  en: "The Dar al-Ma'rifa edition in one large volume, with an introduction by the editor Khalil ibn Ma'mun Shiha containing a biography of Abu Ya'la taken mostly from al-Dhahabi with additions (pp. 4-12), a section on the authenticity of the Musnad's attribution (pp. 13-15), and remarks on his standing in narrator criticism and the grades of the Musnad's hadiths (pp. 16-18), followed by the text."
