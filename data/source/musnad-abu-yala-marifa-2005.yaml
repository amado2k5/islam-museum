label:
  ar: "مسند أبي يعلى الموصلي — حقق أصوله وخرّج أحاديثه خليل بن مأمون شيحا، دار المعرفة، بيروت، ط1 1426هـ/2005م"
  en: "Musnad Abi Ya'la al-Mawsili — ed. Khalil ibn Ma'mun Shiha, Dar al-Ma'rifa, Beirut, 1st ed. 1426/2005"
summary:
  ar: "طبعة دار المعرفة في مجلد ضخم، بمقدمة للمحقق خليل بن مأمون شيحا فيها ترجمة أبي يعلى منقولة في أكثرها عن الذهبي مع زيادات ⁦(ص 4-12)⁩، وفصل في صحة نسبة المسند إليه ⁦(ص 13-15)⁩، وكلام في منزلته في الجرح والتعديل وفي درجة أحاديث المسند ⁦(ص 16-18)⁩، ثم المتن."
  en: "The Dar al-Ma'rifa edition in one large volume, with an introduction by the editor Khalil ibn Ma'mun Shiha containing a biography of Abu Ya'la taken mostly from al-Dhahabi with additions (pp. 4-12), a section on the authenticity of the Musnad's attribution (pp. 13-15), and remarks on his standing in narrator criticism and the grades of the Musnad's hadiths (pp. 16-18), followed by the text."
  es: "La edición de Dar al-Ma'rifa consta de un solo volumen grande, con una introducción del editor Khalil ibn Ma'mun Shiha que contiene una biografía de Abu Ya'la tomada principalmente de al-Dhahabi con añadidos (págs. 4-12), una sección sobre la autenticidad de la atribución del Musnad (págs. 13-15) y comentarios sobre su posición en la crítica de narradores y los grados de los hadices del Musnad (págs. 16-18), seguidos del texto."
  fr: "L'édition Dar al-Ma'rifa en un seul grand volume, avec une introduction de l'éditeur Khalil ibn Ma'mun Shiha contenant une biographie d'Abu Ya'la tirée principalement d'al-Dhahabi avec des ajouts (pp. 4-12), une section sur l'authenticité de l'attribution du Musnad (pp. 13-15), et des remarques sur sa position dans la critique des narrateurs et les degrés des hadiths du Musnad (pp. 16-18), suivie du texte."
  ur: "دار المعرفہ ایڈیشن ایک بڑی جلد میں، جس میں ایڈیٹر خلیل بن مامون شیحہ کا تعارف ہے جس میں ابو یعلٰی کی سوانح عمری ہے جو زیادہ تر الذہبی سے اضافت کے ساتھ لی گئی ہے ⁦(صفحہ 4-12)⁩، مسند کے انتساب کی صداقت پر ایک سیکشن ⁦(صفحہ 13-15)⁩، اور اس کے نقاد پر 13-15 پر۔ مسند کی احادیث کے درجات ⁦(صفحہ 16-18)⁩، اس کے بعد متن۔"
  tr: "Dar al-Ma'rifa baskısı, editör Halil bin Ma'mun Şiha'nın önsözüyle birlikte, çoğunlukla el-Dhahabi'den alıntılanmış Ebu Ya'la'nın biyografisini (s. 4-12), Musned'in ona atfedilmesinin doğruluğu üzerine bir bölüm (s. 13-15), eleştiri ve doğrulamadaki statüsü üzerine tartışmalar ve Musnad hadislerinin derecesi (s. 16-18) içerir, ardından metni içerir."
  id: "Edisi Dar al-Ma'rifa dalam volume besar, dengan pengantar oleh editor Khalil ibn Ma'mun Shiha, yang memuat biografi Abu Ya'la, sebagian besar kutipan dari al-Dhahabi dengan tambahan (hlm. 4-12), bagian tentang keaslian atribusi Musnad kepadanya (hlm. 13-15), diskusi tentang statusnya dalam kritik dan autentikasi, serta tingkat hadis Musnad (hlm. 16-18), kemudian teksnya."
