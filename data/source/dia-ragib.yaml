reliability_note: "Read in the museum's session on 20 November 2026. It gives his birth in early Rajab 343 (November 954) at Isfahan on the evidence of a note in a manuscript of al-Mufradat dated 409 (1018), and says that his date of death is very uncertain: most classical sources give none or say it is unknown, later ones give dates from 322 (934) to 690 (1291), and Katib Celebi's 502 (1108) is not consistent with other evidence the article cites. The museum therefore does not state a death date for him as fact. Used for entity facts only."
