  fr: "Article de la TDV İslâm Ansiklopedisi sur al-Raghib al-Isfahani (édition en ligne), consulté le 20 novembre 2026 ; utilisé pour les données de l'entité : sa naissance et l'incertitude sur sa date de décès."
  ur: "TDV İslâm Ansiklopedisi ⁦(آن لائن ایڈیشن)⁩ میں al-Raghib al-Isfahani پر اندراج، 20 نومبر 2026 کو پڑھا؛ ہستی کے حقائق کے لیے استعمال: پیدائش اور وفات کی تاریخ میں اختلاف."
