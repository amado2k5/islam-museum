summary:
  ar: "مدخل «موسوعة الإسلام» لمؤسسة الشؤون الدينية التركية TDV عن الراغب الأصفهاني، اطُّلع عليه في ٢٠ نوفمبر ٢٠٢٦؛ يُستخدم لوقائع الكيان: مولده والخلاف في تاريخ وفاته."
  en: "The TDV İslâm Ansiklopedisi entry on al-Raghib al-Isfahani (online edition), read on 20 November 2026; used for entity facts: birth and the uncertainty about his date of death."
