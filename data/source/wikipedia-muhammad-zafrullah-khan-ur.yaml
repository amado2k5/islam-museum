summary:
  ar: "مقالہ ویکیپیڈیا اردو مضمون محمد ظفر اللہ خان (1893ء–1985ء) کے بارے میں؛ پیدائش 6 فروری 1893ء اور وفات 1 ستمبر 1985ء لاہور دیتا ہے؛ اس کا مذہب کا حصہ بیان کرتا ہے کہ وہ احمدیہ جماعت سے تعلق رکھتے تھے، خود مرزا غلام احمد کے ہاتھ پر بیعت کی تھی اور احمدی خلفاء کے معتمد رہے، اور یہ کہ 1953ء کے فسادات میں ان کے استعفے کا مطالبہ اسی بنیاد پر ہوا؛ تدفین بہشتی مقبرہ ربوہ میں درج ہے۔"
  en: "The Urdu Wikipedia article on Muhammad Zafrullah Khan (1893–1985); it gives his birth on 6 February 1893 and his death on 1 September 1985 at Lahore; its religion section states that he belonged to the Ahmadiyya community, himself took bay'ah at the hand of Mirza Ghulam Ahmad and was a confidant of the Ahmadi caliphs, and that the 1953 riots demanded his resignation on that ground; it records his burial at Bahishti Maqbara, Rabwah."
