summary:
  ar: "مقالة موقع أنا السلفي بتاريخ 13 أبريل 2015 تعرض مناظرات إسلام بحيري مع ممثلي الأزهر من وجهة نظر منتقديه السلفيين، ضمن أدبيات الردود عليه التي تتهمه بتحريف النصوص وتقطيعها ومهاجمة الأئمة الأربعة والبخاري ومسلم."
  en: "An Ana al-Salafi article of 13 April 2015 giving the Salafi critics' account of Behery's debates with Al-Azhar's representatives, part of the rebuttal literature accusing him of fabricating and truncating texts and of attacking the four imams, al-Bukhari and Muslim."
  es: "Un artículo de Ana al-Salafi del 13 de abril de 2015 que recoge la versión de los críticos salafistas sobre los debates de Behery con los representantes de Al-Azhar, parte de la literatura de refutación que lo acusa de fabricar y truncar textos y de atacar a los cuatro imanes, al-Bukhari y Muslim."
  fr: "Un article d'Ana al-Salafi du 13 avril 2015 donnant le point de vue des critiques salafistes sur les débats de Behery avec les représentants d'Al-Azhar, faisant partie de la littérature de réfutation l'accusant de fabriquer et de tronquer des textes et d'attaquer les quatre imams, al-Bukhari et Muslim."
