  ar: "مقالة ويكيبيديا الفارسية عن سلطان رستم بيك، خامس سلاطين الآق قوينلو؛ أخرجه أيبه سلطان من سجن نخجوان، فهزم بايسنقر وقتله وتُوّج في تبريز، وعُرف بكرمه وبمقرراته للفقراء، ثم هزمه أحمد گوده سنة 902هـ وقتله في تبريز ودُفن في إمامزاده چهارمنار."
  en: "Persian Wikipedia article on Sultan Rustam Beg, fifth sultan of the Aq Qoyunlu; freed from prison at Nakhchivan by Ayba-Sultan, he defeated and killed Baysunghur and was crowned at Tabriz, was known for generosity and for stipends to the poor, and in 902 AH was defeated by Ahmad Göde, killed at Tabriz and buried at the Imamzadeh Chaharmanar there."
