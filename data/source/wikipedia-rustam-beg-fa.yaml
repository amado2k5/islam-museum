reliability_note: "Read in full on 1 November 2026. The Persian edition cites the Encyclopaedia Iranica entry on the Aq Qoyunlu and the contemporary court chronicle Tarikh-e Alam-ara-ye Amini (pages 59, 62–65, 68–69). It is the only edition read that places his death at Tabriz in 902 AH and names his burial place, the Imamzadeh Chaharmanar at Tabriz; both details are single-sourced to it and are carried as its readings, the burial as a written edge and the death place in prose because the English and Russian editions give conflicting accounts of his end. Its infobox likewise carries 'Sunni Islam'; like the English infobox it is an editor's summary over a source base that overlaps the English article's (the Iranica entry is common to both), so the two infoboxes are one attestation family, not two. It gives no birth date."
