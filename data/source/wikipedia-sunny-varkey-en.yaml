summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ساني فايركي: وُلد في 9 نيسان 1957 في راني بولاية كيرالا، مؤسس جيمس للتعليم ومؤسسة فايركي؛ تذكر أن والديه كانا من مسيحيي كيرالا السريان ومعلمين، وأنه درس في مدارس كاثوليكية في كولام ودبي."
  en: "English Wikipedia article on Sunny Varkey, born 9 April 1957 at Ranni, Kerala, founder of GEMS Education and the Varkey Foundation; it records that his parents were Kerala Syrian Christians and educators, and his own schooling at Catholic schools in Kollam and Dubai."
  es: "Artículo de la Wikipedia en inglés sobre Sunny Varkey, nacido el 9 de abril de 1957 en Ranni, Kerala, fundador de GEMS Education y la Fundación Varkey; en él se indica que sus padres eran cristianos sirios de Kerala y educadores, y que él mismo cursó sus estudios en escuelas católicas de Kollam y Dubái."
  fr: "L'article de Wikipédia en anglais sur Sunny Varkey, né le 9 avril 1957 à Ranni, au Kerala, fondateur de GEMS Education et de la Fondation Varkey, indique que ses parents étaient des chrétiens syriens du Kerala et des éducateurs, et qu'il a lui-même été scolarisé dans des écoles catholiques à Kollam et à Dubaï."
  ur: "سنی ورکی پر انگریزی ویکیپیڈیا کا مضمون، 9 اپریل 1957 کو رنی، کیرالہ میں پیدا ہوا، جی ای ایم ایس ایجوکیشن اور ورکی فاؤنڈیشن کے بانی؛ یہ ریکارڈ کرتا ہے کہ اس کے والدین کیرالہ کے شامی عیسائی اور معلم تھے، اور اس کی اپنی تعلیم کولم اور دبئی کے کیتھولک اسکولوں میں ہوئی۔"
