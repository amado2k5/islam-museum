reliability_note: "Structured-data item, retrieved via the MediaWiki API on 1 November 2026 and its revision re-asserted against a second live query (identical). Registered for the identifier and the death date. Its birthplace value (Bursa) is not followed: the TDV entry and the English and Arabic articles place his birth at Edirne, and Bursa enters his story only as the city where his 'döne döne' ghazel reached Ahmed Pasha. Its 1444 birth year matches the opening year of the TDV estimate (1444–1446). The item was grounded from the Turkish article's own page property after the English title 'Necati' proved to belong to the given-name item Q20470230."
