reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md). Read in full on 26 October 2026 and checked against the recorded revision. An independent Arabic text tradition, shorter than the English article: it gives his birth about 1762 at Timbo in Guinea (against the English article's Timbuktu, a divergence recorded in the person record), his traditional Islamic education at Timbuktu, his command of a 2,000-man regiment, his capture about 1788, his sale to Thomas Foster, his meeting with Dr John Coates Cox, his release after the Sultan of Morocco's intervention, and his death from fever at Monrovia in 1829 aged 67. Its lead calls him a Muslim prince; it names no madhhab or order for him."
