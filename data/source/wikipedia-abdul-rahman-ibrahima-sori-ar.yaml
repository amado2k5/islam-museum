summary:
  ar: "مقالة ويكيبيديا العربية عن عبد الرحمن بن إبراهيم سوري؛ تُستخدم لوقائع الكيان فقط. تصفه بأمير مسلم من الفولاني في غينيا، وتروي أسره وعبوديته في أمريكا وتحريره بأمر الرئيس آدامز ووفاته سنة 1829."
  en: "Arabic Wikipedia article on Abdul Rahman ibn Ibrahim Sori; used for entity facts only. It describes him as a Muslim prince of the Fulani in Guinea and recounts his capture, his enslavement in America, his freeing by order of President Adams, and his death in 1829."
  es: "Artículo en árabe de la Wikipedia sobre Abdul Rahman ibn Ibrahim Sori; se utiliza únicamente para obtener información sobre la persona. Lo describe como un príncipe musulmán de los fulani en Guinea y relata su captura, su esclavitud en América, su liberación por orden del presidente Adams y su muerte en 1829."
  fr: "Article de Wikipédia en arabe sur Abdul Rahman ibn Ibrahim Sori; utilisé uniquement à des fins d’information sur l’entité. Il le décrit comme un prince musulman peul de Guinée et relate sa capture, son esclavage en Amérique, sa libération sur ordre du président Adams et sa mort en 1829."
  ur: "عبدالرحمن بن ابراہیم سوری پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اسے گنی میں فلانی کے مسلمان شہزادے کے طور پر بیان کیا گیا ہے اور اس کی گرفتاری، امریکہ میں اس کی غلامی، صدر ایڈمز کے حکم سے اس کی آزادی اور 1829 میں اس کی موت کا ذکر کیا گیا ہے۔"
  tr: "Abdul Rahman bin İbrahim Suri hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Onu Gine'deki Fulani'den bir Müslüman prens olarak tanımlar; esaretini, Amerika'daki köleliğini, Başkan Adams'ın emriyle özgürlüğünü ve 1829'daki ölümünü anlatır."
  id: "Artikel Wikipedia Arab tentang Abdul Rahman bin Ibrahim Suri; digunakan hanya untuk fakta entitas. Artikel ini menggambarkannya sebagai pangeran Muslim dari suku Fulani di Guinea, menceritakan masa penahanannya, perbudakan di Amerika, pembebasannya atas perintah Presiden Adams, dan kematiannya pada tahun 1829."
