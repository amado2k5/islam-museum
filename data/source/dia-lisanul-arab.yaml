reliability_note: "Read in the museum's session on 20 November 2026. It dates the completion to 22 Dhu al-Hijja 689 (26 December 1290); reports that the author's preface names the Tahdhib of al-Azhari, the Muhkam of Ibn Sida, the Sihah of al-Jawhari, Ibn Barri's al-Tanbih wa-l-idah and Ibn al-Athir's al-Nihaya as the main sources, and gives his stated aim as preserving Arabic as the language of the Qur'an and the Sunna; and describes the arrangement on the Sihah system (last radical as the chapter, first radical as the section, the middle letters also alphabetical). Used for entity facts only; the museum's wording is its own."
