summary:
  ar: "مدخل خواجة سليم الله في بنغلابيديا، الموسوعة الوطنية لبنغلاديش، بقلم محمد عالمغير؛ تُستخدم لوقائع الكيان فقط. تؤكد مولده في منزل إحسان في 7 يونيو 1871 ووفاته في كلكتا في 16 يناير 1915 ودفنه في مقبرة الأسرة في بيغوم بازار، وتفصّل مؤتمر دكا 1906 ومطالبته بجامعة دكا."
  en: "Entry 'Salimullah, Khwaja' in Banglapedia, the national encyclopedia of Bangladesh, by Mohammad Alamgir; used for entity facts only. It confirms his birth at Ahsan Manzil on 7 June 1871, his death at Calcutta on 16 January 1915 and burial in the family graveyard at Begum Bazar, and details the 1906 Dhaka conference and his campaign for a Dhaka university."
