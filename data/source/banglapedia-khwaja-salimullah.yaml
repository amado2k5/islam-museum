reliability_note: "A scholarly national encyclopedia entry, independent of Wikipedia. Read in full on 25 October 2026. It styles him 'nawab of Dhaka, Muslim nationalist, an architect of the Muslim League, patron of education', son of Khwaja Ahsanullah and grandson of Khwaja Abdul Ghani. It adds detail the English article lacks: his hosting of Viceroy Curzon at Ahsan Manzil on 18–19 February 1904 and the changes to the partition plan that followed; the cost of the December 1906 conference (over six lakh rupees) borne by Salimullah; the All Bengal Muslim League founded in 1906 with him as president (the English article dates his presidency 1907); his 19 August 1911 demand at Curzon Hall for a university and a high court for Dhaka; his eight-point demands to Viceroy Hardinge of 20 December 1911 and the pledge of 31 January 1912; his payment in 1902 of the Rs 112,000 his father had promised for the Dhaka Engineering School; his membership of the Women's Education Committee (1908) and the 1909 education reform committee behind the 1915 madrasa-education plan; his heavy debts from public spending; and his burial, after a state-honoured return to Dhaka, in the family graveyard at Begum Bazar. Its honours list differs from the English article's (CSI 1902, Nawab Bahadur 1903, KCSI 1909, 'GCSI' 1911, against CSI 1906 and GCIE 1911); both are recorded. It names no school for him."
