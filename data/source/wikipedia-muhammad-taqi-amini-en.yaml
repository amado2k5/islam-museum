summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد تقي الأميني؛ تُستخدم لوقائع الكيان فقط. تسمّيه في متنها «عالما إسلاميا سنيا هنديا»، وتذكر دراسته على كفاية الله الدهلوي في المدرسة الأمينية، وتدريسه في ندوة العلماء، وعمادته لكلية اللاهوت في جامعة عليكرة الإسلامية."
  en: "English Wikipedia article on Muhammad Taqi Amini; used for entity facts only. Its text calls him an 'Indian Sunni Islamic scholar', records his studies under Kifayatullah Dihlawi at Madrasa Aminia, his teaching at Nadwatul Ulama and his deanship of the Faculty of Theology at Aligarh Muslim University."
  es: "Artículo de la Wikipedia en inglés sobre Muhammad Taqi Amini; utilizado únicamente para obtener información sobre la persona. Su texto lo describe como un \"erudito islámico sunita indio\", y registra sus estudios con Kifayatullah Dihlawi en la Madrasa Aminia, su labor docente en Nadwatul Ulama y su decanato de la Facultad de Teología de la Universidad Musulmana de Aligarh."
  fr: "Article de Wikipédia en anglais sur Muhammad Taqi Amini; utilisé uniquement à des fins d’information sur l’entité. Son texte le décrit comme un « érudit islamique sunnite indien », et relate ses études auprès de Kifayatullah Dihlawi à la Madrasa Aminia, son enseignement à Nadwatul Ulama et son décanat de la faculté de théologie de l’université musulmane d’Aligarh."
  ur: "محمد تقی امینی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا متن انہیں ایک 'ہندوستانی سنی اسلامی اسکالر' کہتا ہے، مدرسہ امینیہ میں کفایت اللہ دہلوی کے تحت ان کی تعلیم، ندوۃ العلماء میں ان کی تدریس اور علی گڑھ مسلم یونیورسٹی میں تھیالوجی کی فیکلٹی کے ڈین شپ کو ریکارڈ کرتا ہے۔"
  tr: "Muhammed Taqi el-Amini hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılır. Metinde ona 'Sünni Hintli İslam âlimi' denir, Aminiya Okulu'nda Kifayatullah al-Dihlawi ile yaptığı çalışmalar, alimler seminerindeki ders vermesi ve Aligarh İslam Üniversitesi İlahiyat Fakültesi dekanı olarak anılmaktadır."
  id: "Artikel Wikipedia bahasa Inggris tentang Muhammad Taqi al-Amini; hanya digunakan untuk fakta entitas. Dalam teks menyebutnya sebagai 'ulama Islam Sunni India,' menyebutkan studinya di bawah Kifayatullah al-Dihlawi di Sekolah Aminiya, pengajarannya di seminar ulama, dan dekan Fakultas Teologi di Universitas Islam Aligarh."
