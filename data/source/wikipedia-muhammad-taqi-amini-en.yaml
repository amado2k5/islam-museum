reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 at the recorded revision, fetched by revision id with the returned id asserted equal. It gives him born 5 May 1926 at Subeha, Barabanki, and died 21 January 1991 at Aligarh; alumnus of Jami'ul Ulum Kanpur and Madrasa Aminia, where he completed the dars-e-nizami under Kifayatullah Dihlawi; teacher at Nadwatul Ulama and principal of Darul Uloom Muiniya, Ajmer; dean of AMU's Faculty of Theology, retired 1986. Its lead calls him a Sunni scholar in text; its religious-biography infobox module gives denomination Sunni, jurisprudence Hanafi and creed Maturidi — the only place the school is named. Its categories file him among Deobandis."
