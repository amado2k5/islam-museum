summary:
  ar: "مقالة ويكيبيديا العربية عن محمد أكبر خان ⁦(وزير أكبر خان)⁩؛ تُستخدم لوقائع الكيان فقط. تعطي مولده سنة 1816 ووفاته في صندوق المعلومات سنة 1845 بجلال آباد بينما يقول متنها إنه توفي سنة 1847 بالكوليرا، ودفنه في المسجد الأزرق، ودينه في صندوق المعلومات «الإسلام» دون تسمية مذهب."
  en: "Arabic Wikipedia article on Mohammad Akbar Khan (Wazir Akbar Khan); used for entity facts only. It gives his birth in 1816 and, in its infobox, his death in 1845 at Jalalabad, while its text says he died in 1847 of cholera; it gives his burial at the Blue Mosque and his religion in the infobox as Islam, generically, naming no school."
  es: "Artículo de Wikipedia en árabe sobre Mohammad Akbar Khan (Wazir Akbar Khan); utilizado únicamente para datos sobre la entidad. Indica que nació en 1816 y, en su ficha informativa, que falleció en 1845 en Jalalabad, mientras que el texto afirma que murió en 1847 de cólera; menciona su entierro en la Mezquita Azul y su religión, en la ficha informativa, como Islam, de forma genérica, sin especificar ninguna escuela."
  fr: "Article de Wikipédia en arabe sur Mohammad Akbar Khan (Wazir Akbar Khan); utilisé uniquement pour les informations sur l’entité. Il indique sa naissance en 1816 et, dans son infobox, sa mort en 1845 à Jalalabad, tandis que son texte mentionne un décès en 1847 des suites du choléra; il précise son inhumation à la Mosquée Bleue et sa religion dans l’infobox comme étant l’islam, sans mention d’école."
  ur: "محمد اکبر خان ⁦(وزیر اکبر خان)⁩ پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1816 میں اس کی پیدائش اور اس کے معلوماتی خانے میں اس کی موت 1845 میں جلال آباد میں بتائی گئی ہے، جب کہ اس کے متن کے مطابق اس کی موت 1847 میں ہیضے سے ہوئی۔ یہ نیلی مسجد میں ان کی تدفین اور انفو باکس میں ان کے مذہب کو اسلام کے طور پر دیتا ہے، عام طور پر، کسی اسکول کا نام نہیں دیا جاتا ہے۔"
  tr: "Muhammed Ekber Han (Bakan Akbar Han) hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1816'da doğduğunu ve 1845'te Celalabad'da infobox'ta öldüğünü belirtirken, metinde 1847'de koleradan öldüğü, Mavi Camii'ye gömüldüğü ve bilgi kutusundaki dininin 'İslam' olduğu belirtildiği ancak bir mezhep belirtilmediği belirtilmektedir."
  id: "Artikel Wikipedia Arab tentang Muhammad Akbar Khan (Menteri Akbar Khan); digunakan hanya untuk fakta entitas. Artikel tersebut mencantumkan kelahirannya pada tahun 1816 dan kematiannya pada tahun 1845 di Jalalabad, sementara teksnya menyatakan bahwa ia meninggal karena kolera pada tahun 1847, dimakamkan di Masjid Biru, dan agamanya dalam infobox adalah 'Islam' tanpa menyebutkan sekte."
