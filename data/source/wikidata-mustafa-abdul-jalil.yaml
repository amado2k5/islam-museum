summary:
  ar: "عنصر ويكي بيانات Q274769 لمصطفى عبد الجليل، ثُبّت عبر خصائص صفحة المقالة الإنجليزية؛ يُستخدم لوقائع الكيان فقط. يعطي سنة ولادته 1952 ومكانها البيضاء في ليبيا، وقيمة دين «الإسلام السني» — وهي قيمة بيانات مهيكلة وحيدة لا يؤيدها أي متن بمذهب."
  en: "Wikidata item Q274769 for Mustafa Abdul Jalil, grounded through the English article's pageprops; used for entity facts only. It gives his birth year as 1952, his birthplace as Al Bayda in Libya, and a religion value of Sunni Islam — a single structured-data value that no article text corroborates with a school."
  es: "El elemento de Wikidata Q274769 para Mustafa Abdul Jalil, basado en los pageprops del artículo en inglés, se utiliza únicamente para datos de la entidad. Indica que nació en 1952, en Al Bayda (Libia) y que su religión es el islam sunita; este es un único valor de datos estructurados que ningún texto del artículo corrobora con una escuela."
  fr: "L'élément Wikidata Q274769 concernant Mustafa Abdul Jalil, basé sur les propriétés de page de l'article en anglais, est utilisé uniquement pour les informations relatives à l'entité. Il indique que son année de naissance est 1952, son lieu de naissance est Al Bayda en Libye, et sa religion est l'islam sunnite — une donnée structurée unique qu'aucun texte d'article ne rattache à une école de pensée."
  ur: "مصطفی عبدالجلیل کے لیے Wikidata آئٹم Q274769، انگریزی مضمون کے صفحہ پروپس کے ذریعے۔ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی پیدائش کا سال 1952، لیبیا میں البیدہ کے طور پر ان کی جائے پیدائش، اور سنی اسلام کی ایک مذہبی قدر بتائی گئی ہے۔"
  tr: "Mustafa Abdul Jalil tarafından Q274769 bir Wikidata öğesi, İngilizce makale sayfasının özellikleri aracılığıyla düzeltilmiştir; yalnızca varlığın gerçekleri için kullanılır. Doğum yılını 1952 olarak ve Libya'daki Al-Bayda olarak yerini ve 'Sünni İslam' dininin değerini verir—ki bu din, herhangi bir mezhepçi metinle desteklenmeyen tek bir yapılandırılmış veri değeridir."
  id: "Elemen Wikidata Q274769 oleh Mustafa Abdul Jalil, diperbaiki melalui properti halaman artikel berbahasa Inggris; digunakan hanya untuk fakta entitas. Elemen ini mencantumkan tahun kelahirannya sebagai 1952 dan posisinya sebagai Al-Bayda di Libya, serta nilai agama 'Islam Sunni'—yang merupakan nilai data terstruktur tunggal yang tidak didukung oleh teks sektarian manapun."
