  ar: "دراسة أولين نوها ومجيب الرحمن في مجلة ضياء الأفكار لدراسات القرآن والحديث (المجلد 14، العدد 1، حزيران 2026، ص 32-49) عن تفسير محمد شعروني أحمدي الشفهي لسورة الكافرون وخطاب الانسجام الديني في كودوس؛ تذكر في وصفها لمجتمع كودوس المتعدد أن قائد شركة جاروم روبرت بودي هارتونو إندونيسي من أصل صيني وكاثوليكي."
  en: "Ulin Nuha and Mujiburohman's study in Diya al-Afkar: Jurnal Studi al-Qur'an dan al-Hadis (vol. 14, no. 1, June 2026, pp. 32–49) of Muhammad Sya'roni Ahmadi's oral tafsir of Surat al-Kafirun and the discourse of religious harmony in Kudus; in its account of Kudus's plural society it states that Djarum's leader Robert Budi Hartono is an Indonesian of Chinese descent and a Catholic."
