label:
  ar: "مصطفى محمود، الإسلام في خندق ⁦(كتاب اليوم، دار أخبار اليوم، القاهرة، 1994)⁩"
  en: "Mostafa Mahmoud, al-Islam fi Khandaq (Kitab al-Yawm, Dar Akhbar al-Yawm, Cairo, 1994)"
  ur: "مصطفیٰ محمود، الاسلام فی خندق ⁦(کتاب الیوم، دار اخبار الیوم، قاہرہ، 1994)⁩"
summary:
  ar: "كتاب مصطفى محمود «الإسلام في خندق» في سلسلة «كتاب اليوم» الشهرية عن دار أخبار اليوم، في فصول عن روح الدين، والحدود، والعلمانية، والغرب، وإسرائيل، ومستقبل المسلمين."
  en: "Mostafa Mahmoud's al-Islam fi Khandaq in the monthly Kitab al-Yawm series of Dar Akhbar al-Yawm, in chapters on the spirit of religion, the hudud penalties, secularism, the West, Israel and the Muslims' future."
  ur: "مصطفیٰ محمود کی «الاسلام فی خندق» دار اخبار الیوم کے ماہانہ سلسلے «کتاب الیوم» میں، دین کی روح، حدود، سیکولرزم، مغرب، اسرائیل اور مسلمانوں کے مستقبل پر ابواب۔"
  es: "La obra de Mostafa Mahmoud, al-Islam fi Khandaq, se publica en la serie mensual Kitab al-Yawm de Dar Akhbar al-Yawm, con capítulos sobre el espíritu de la religión, las penas hudud, el secularismo, Occidente, Israel y el futuro de los musulmanes."
  fr: "L'ouvrage de Mostafa Mahmoud, al-Islam fi Khandaq, dans la série mensuelle Kitab al-Yawm de Dar Akhbar al-Yawm, comporte des chapitres sur l'esprit de la religion, les peines hudud, la laïcité, l'Occident, Israël et l'avenir des musulmans."
  tr: "Mustafa Mahmoud'un \"İslam Bir Siperde\" adlı kitabı, Akhbar Al-Youm'un aylık \"Kitab Al-Youm\" serisinde yer alıyor; dinin ruhu, sınırlar, laiklik, Batı, İsrail ve Müslümanların geleceği üzerine bölümler içeriyor."
  id: "Buku Mustafa Mahmoud \"Islam di Parit\" dalam seri bulanan \"Kitab Al-Youm\" oleh Akhbar Al-Youm, menampilkan bab-bab tentang semangat agama, perbatasan, sekularisme, Barat, Israel, dan masa depan umat Muslim."
