summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد زكريا الكاندهلوي (2 شباط 1898 – 24 أيار 1982)؛ تصفه في صدرها بأنه عالم حديث سني حنفي من المدرسة الديوبندية وعمّه محمد إلياس مؤسس جماعة التبليغ، وتذكر مولده بـ11 رمضان 1315هـ في كاندهلة ودراسته في مظاهر علوم سهارانبور، وأن بيعته سنة 1333هـ كانت على يد خليل أحمد السهارنبوري وأن شيخه منحه الخلافة في أربع سلاسل (الجشتية والسهروردية والقادرية والنقشبندية)، ووفاته في المدينة المنورة ودفنه في البقيع."
  en: "The English Wikipedia article on Muhammad Zakariya Kandhlawi (2 February 1898 – 24 May 1982); its lead calls him a Sunni Hanafi hadith scholar of the Deobandi school whose uncle Muhammad Ilyas founded the Tablighi Jamaat, it gives his birth as 11 Ramadan 1315 AH at Kandhla and his studies at Mazahir Uloom Saharanpur, states that his bay'ah in 1333 AH was at the hand of Khalil Ahmad Saharanpuri and that his shaykh conferred khilafah on him in four silsilas (Chishtiyya, Suhrawardiyya, Qadiriyya, Naqshbandiyya), and records his death at Medina and burial in al-Baqi."
