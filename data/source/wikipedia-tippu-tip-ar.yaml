summary:
  ar: "مقالة ويكيبيديا العربية «تيبوتيب»؛ تؤرخ ميلاده بسنة 1837 ⁦(1248 هـ في متن سيرتها)⁩ ووفاته في 14 يونيو 1905 بمدينة زنجبار، وتروي سيرته من مجلة الهلال (1906) ومن فيرانت: تعليمه المبكر، وتجارته الأولى بالملح، وحملاته إلى تابورة ونهر الكونغو، ومقتل ابنه سيف واستيلاء البلجيك على أمواله."
  en: "Arabic Wikipedia article 'Tippu Tip'; it dates his birth to 1837 (1248 AH in its biographical text) and his death to 14 June 1905 at Zanzibar City, and narrates his life from Al-Hilal magazine (1906) and Farrant: his early schooling, his first salt trading, his expeditions to Tabora and the Congo River, and the killing of his son Saif and the Belgian seizure of his property."
  es: "El artículo de Wikipedia en árabe titulado \"Tippu Tip\" fecha su nacimiento en 1837 (1248 AH en su texto biográfico) y su muerte el 14 de junio de 1905 en la ciudad de Zanzíbar, y narra su vida a partir de la revista Al-Hilal (1906) y Farrant: su educación temprana, su primer comercio de sal, sus expediciones a Tabora y al río Congo, y el asesinato de su hijo Saif y la confiscación de sus propiedades por parte de los belgas."
  fr: "L'article de Wikipédia en arabe « Tippu Tip » date sa naissance de 1837 (1248 AH dans son texte biographique) et sa mort du 14 juin 1905 à Zanzibar, et relate sa vie à partir du magazine Al-Hilal (1906) et de Farrant: ses premières études, son premier commerce de sel, ses expéditions à Tabora et sur le fleuve Congo, et le meurtre de son fils Saif et la saisie de ses biens par les Belges."
  ur: "عربی ویکیپیڈیا مضمون 'ٹیپو ٹپ'؛ اس کی تاریخ پیدائش 1837 ⁦(1248 ہجری اس کے سوانحی متن میں)⁩ ہے اور اس کی موت 14 جون 1905 کو زنجبار شہر میں ہے، اور الہلال میگزین (1906) اور فارانٹ سے اس کی زندگی بیان کرتی ہے: اس کی ابتدائی تعلیم، اس کی پہلی نمک کی تجارت، اس کی تبورا کی مہمات اور دریائے کانگو کے سیف کو مارنے اور اس کے بیٹے سیف کو مارنا۔ جائیداد"
