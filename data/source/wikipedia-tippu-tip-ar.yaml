  ar: "مقالة ويكيبيديا العربية «تيبوتيب»؛ تؤرخ ميلاده بسنة 1837 (1248 هـ في متن سيرتها) ووفاته في 14 يونيو 1905 بمدينة زنجبار، وتروي سيرته من مجلة الهلال (1906) ومن فيرانت: تعليمه المبكر، وتجارته الأولى بالملح، وحملاته إلى تابورة ونهر الكونغو، ومقتل ابنه سيف واستيلاء البلجيك على أمواله."
  en: "Arabic Wikipedia article 'Tippu Tip'; it dates his birth to 1837 (1248 AH in its biographical text) and his death to 14 June 1905 at Zanzibar City, and narrates his life from Al-Hilal magazine (1906) and Farrant: his early schooling, his first salt trading, his expeditions to Tabora and the Congo River, and the killing of his son Saif and the Belgian seizure of his property."
