reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Its infobox gives born 1837 at Zanzibar, died 14 June 1905 at Zanzibar City, son Sefu bin Hamid, occupations slave trader, ivory trader, explorer and governor, and calls him a Swahili-Zanzibari slave trader who gathered slaves for Zanzibar's plantations; its biographical narrative, drawn from Al-Hilal magazine of 1906 and from Farrant (1972), gives his birth year as 1248 AH, his childhood instruction in reading, writing and the Qur'an, his first trading venture at twelve with borrowed money, his campaigns from Tabora to the Congo, his return to Zanzibar in 1300 AH, the later Arab-Belgian fighting, and the killing of his son Saif in 1311 AH with the Belgian seizure of property estimated at 100,000 pounds. Its 1248 AH birth year sits uneasily beside its own infobox's 1837; the conflict is recorded in the person record. It names no school for him. Read in full on 24 October 2026."
