summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد جمال العالم الثاني؛ تُستخدم لوقائع الكيان فقط. تجعله السلطان السادس والعشرين لبروناي (1906–1924)، وُلد سنة 1889 لهاشم جليل العالم أقام الدين، وتُوّج في 15 أيار 1918، وهو أول سلطان بروناي يتكلم الإنجليزية، وشجّع الزراعة والطب والتعليم والتعليم الإسلامي، وتوفي — بحسبها — في 19 أيلول 1924 وخلفه ابنه الأكبر أحمد تاج الدين؛ ويعطي صندوقها دينه الإسلام السنّي."
  en: "English Wikipedia article on Muhammad Jamalul Alam II; used for entity facts only. It gives him as the 26th Sultan of Brunei (1906–1924), born in 1889 to Hashim Jalilul Alam Aqamaddin, crowned on 15 May 1918, the first Bruneian sultan to speak English, a promoter of agriculture, medicine, education and Islamic learning, who died — it says — on 19 September 1924 and was succeeded by his eldest son Ahmad Tajuddin; its infobox gives his religion as Sunni Islam."
