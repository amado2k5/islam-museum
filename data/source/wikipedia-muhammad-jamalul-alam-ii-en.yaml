summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد جمال العالم الثاني؛ تُستخدم لوقائع الكيان فقط. تجعله السلطان السادس والعشرين لبروناي (1906–1924)، وُلد سنة 1889 لهاشم جليل العالم أقام الدين، وتُوّج في 15 أيار 1918، وهو أول سلطان بروناي يتكلم الإنجليزية، وشجّع الزراعة والطب والتعليم والتعليم الإسلامي، وتوفي — بحسبها — في 19 أيلول 1924 وخلفه ابنه الأكبر أحمد تاج الدين؛ ويعطي صندوقها دينه الإسلام السنّي."
  en: "English Wikipedia article on Muhammad Jamalul Alam II; used for entity facts only. It gives him as the 26th Sultan of Brunei (1906–1924), born in 1889 to Hashim Jalilul Alam Aqamaddin, crowned on 15 May 1918, the first Bruneian sultan to speak English, a promoter of agriculture, medicine, education and Islamic learning, who died — it says — on 19 September 1924 and was succeeded by his eldest son Ahmad Tajuddin; its infobox gives his religion as Sunni Islam."
  es: "Artículo de la Wikipedia en inglés sobre Muhammad Jamalul Alam II; utilizado únicamente para datos sobre la persona. Lo describe como el 26.º sultán de Brunéi (1906-1924), nacido en 1889, hijo de Hashim Jalilul Alam Aqamaddin, coronado el 15 de mayo de 1918, el primer sultán de Brunéi en hablar inglés, promotor de la agricultura, la medicina, la educación y el aprendizaje islámico, quien falleció —según el artículo— el 19 de septiembre de 1924 y fue sucedido por su hijo mayor, Ahmad Tajuddin; su ficha informativa indica que su religión era el islam sunita."
  fr: "Article de Wikipédia en anglais sur Muhammad Jamalul Alam II; utilisé uniquement pour les informations sur l'entité. Il le présente comme le 26e sultan de Brunei (1906-1924), né en 1889 de Hashim Jalilul Alam Aqamaddin, couronné le 15 mai 1918, premier sultan brunéien à parler anglais, promoteur de l'agriculture, de la médecine, de l'éducation et des études islamiques, décédé – selon l'article – le 19 septembre 1924 et remplacé par son fils aîné Ahmad Tajuddin; son infobox indique qu'il était de confession sunnite."
  ur: "محمد جمال العالم ثانی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اسے برونائی کے 26ویں سلطان (1906–1924) کے طور پر دیتا ہے، جو 1889 میں ہاشم جلیل العالم اقام الدین کے ہاں پیدا ہوا، 15 مئی 1918 کو تاج پوشی کیا گیا، انگریزی بولنے والے پہلے برونائی سلطان تھے، جو زراعت، طب، تعلیم اور اسلامی تعلیم کے فروغ دینے والے تھے- جو کہ 19 ستمبر کو اس کا انتقال ہوا اور 19 ستمبر کو اس کا انتقال ہوا۔ بڑا بیٹا احمد تاج الدین؛ اس کا انفو باکس اس کا مذہب بطور سنی اسلام دیتا ہے۔"
