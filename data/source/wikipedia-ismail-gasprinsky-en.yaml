summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن إسماعيل غسبرينسكي؛ تُستخدم لوقائع الكيان فقط. تؤرخ له من 20 مارس [بالتقويم القديم 8 مارس] 1851 إلى 24 سبتمبر [بالتقويم القديم 11 سبتمبر] 1914، وتتناول صحيفة «ترجمان» التي أسسها سنة 1883، وأسلوبه الجديد (أصول جديد) في تعليم القراءة، ودعوته إلى لغة أدبية تركية مشتركة، وكتابه «مسلمو روسيا» (1881)، ومجلة النساء «عالم نسوان» ومجلة الأطفال «عالم صبيان»، ومشاركته في تأسيس «اتفاق المسلمين» سنة 1906، ودوره ملهمًا لحركة الجديد. ولا يسمي متنها مدرسة إسلامية له."
  en: "English Wikipedia article on Ismail Gasprinsky; used for entity facts only. It dates him 20 March [O.S. 8 March] 1851 – 24 September [O.S. 11 September] 1914, and covers the newspaper Terciman, founded in 1883, his new method (usul-ü cedit) of teaching reading, his campaign for a common Turkic literary language, his 1881 book Russian Muslims, the women's journal Alem-i Nisvan and children's journal Alem-i Subyan, his part in founding the Union of Muslims (Ittifaq al-Muslimin) in 1906, and his role as the inspiration of Jadidism. Its text names no school of Islam for him."
