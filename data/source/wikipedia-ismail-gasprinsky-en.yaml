summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن إسماعيل غسبرينسكي؛ تُستخدم لوقائع الكيان فقط. تؤرخ له من 20 مارس [بالتقويم القديم 8 مارس] 1851 إلى 24 سبتمبر [بالتقويم القديم 11 سبتمبر] 1914، وتتناول صحيفة «ترجمان» التي أسسها سنة 1883، وأسلوبه الجديد ⁦(أصول جديد)⁩ في تعليم القراءة، ودعوته إلى لغة أدبية تركية مشتركة، وكتابه «مسلمو روسيا» (1881)، ومجلة النساء «عالم نسوان» ومجلة الأطفال «عالم صبيان»، ومشاركته في تأسيس «اتفاق المسلمين» سنة 1906، ودوره ملهمًا لحركة الجديد. ولا يسمي متنها مدرسة إسلامية له."
  en: "English Wikipedia article on Ismail Gasprinsky; used for entity facts only. It dates him 20 March [O.S. 8 March] 1851 – 24 September [O.S. 11 September] 1914, and covers the newspaper Terciman, founded in 1883, his new method (usul-ü cedit) of teaching reading, his campaign for a common Turkic literary language, his 1881 book Russian Muslims, the women's journal Alem-i Nisvan and children's journal Alem-i Subyan, his part in founding the Union of Muslims (Ittifaq al-Muslimin) in 1906, and his role as the inspiration of Jadidism. Its text names no school of Islam for him."
  es: "Artículo de la Wikipedia en inglés sobre Ismail Gasprinsky; utilizado únicamente para datos sobre la persona. Lo fecha entre el 20 de marzo [8 de marzo según el calendario antiguo] de 1851 y el 24 de septiembre [11 de septiembre según el calendario antiguo] de 1914, y abarca el periódico Terciman, fundado en 1883, su nuevo método (usul-ü cedit) de enseñanza de la lectura, su campaña por una lengua literaria turca común, su libro de 1881, Russian Muslims, la revista femenina Alem-i Nisvan y la revista infantil Alem-i Subyan, su participación en la fundación de la Unión de Musulmanes (Ittifaq al-Muslimin) en 1906, y su papel como inspiración del jadidismo. El texto no menciona ninguna escuela del islam a la que pertenezca."
  fr: "Article de Wikipédia en anglais sur Ismail Gasprinsky; utilisé uniquement pour les informations factuelles. Il date sa vie du 20 mars [8 mars du calendrier julien] 1851 au 24 septembre [11 septembre du calendrier julien] 1914 et aborde le journal Terciman, fondé en 1883, sa nouvelle méthode (usul-ü cedit) d'apprentissage de la lecture, sa campagne pour une langue littéraire turque commune, son ouvrage de 1881, Les Musulmans russes, le journal féminin Alem-i Nisvan et le journal pour enfants Alem-i Subyan, son rôle dans la fondation de l'Union des musulmans (Ittifaq al-Muslimin) en 1906 et son influence sur le jadidisme. Le texte ne mentionne aucune école de l'islam à son nom."
