summary:
  ar: "كتاب الأستاذ الدكتور سليمان سليمان خميس (أستاذ الفلسفة بكلية أصول الدين بالأزهر) عن تاريخ الفلسفة من الشرق القديم واليونان إلى الفلسفة الإسلامية وفلسفة ابن سينا والغزالي وابن رشد، ثم الفلسفة الحديثة عند بيكون وديكارت؛ طبعه مجمع البحوث الإسلامية بالقاهرة طبعة أولى سنة 1447ه/2025م في 383 صفحة، بتصدير الأمين العام للمجمع."
  en: "Sulayman Sulayman Khamis's book (professor of philosophy at the faculty of Usul al-Din, al-Azhar) on the history of philosophy, from the ancient East and Greece through Islamic philosophy (Ibn Sina, al-Ghazali, Ibn Rushd) to modern thought (Bacon, Descartes); published by the Islamic Research Academy in Cairo, first edition 1447 AH / 2025 CE, 383 pages, with a preface by the Academy's Secretary-General."
