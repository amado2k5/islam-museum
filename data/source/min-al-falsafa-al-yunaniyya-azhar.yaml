label:
  ar: من الفلسفة اليونانية إلى الفلسفة الحديثة — سليمان سليمان خميس
  en: From Greek Philosophy to Modern Philosophy — Sulayman Sulayman Khamis
summary:
  ar: "كتاب الأستاذ الدكتور سليمان سليمان خميس ⁦(أستاذ الفلسفة بكلية أصول الدين بالأزهر)⁩ عن تاريخ الفلسفة من الشرق القديم واليونان إلى الفلسفة الإسلامية وفلسفة ابن سينا والغزالي وابن رشد، ثم الفلسفة الحديثة عند بيكون وديكارت؛ طبعه مجمع البحوث الإسلامية بالقاهرة طبعة أولى سنة 1447ه/2025م في 383 صفحة، بتصدير الأمين العام للمجمع."
  en: "Sulayman Sulayman Khamis's book (professor of philosophy at the faculty of Usul al-Din, al-Azhar) on the history of philosophy, from the ancient East and Greece through Islamic philosophy (Ibn Sina, al-Ghazali, Ibn Rushd) to modern thought (Bacon, Descartes); published by the Islamic Research Academy in Cairo, first edition 1447 AH / 2025 CE, 383 pages, with a preface by the Academy's Secretary-General."
  es: "Libro de Sulayman Khamis (profesor de filosofía en la facultad de Usul al-Din, al-Azhar) sobre la historia de la filosofía, desde el antiguo Oriente y Grecia, pasando por la filosofía islámica (Ibn Sina, al-Ghazali, Ibn Rushd) hasta el pensamiento moderno (Bacon, Descartes); publicado por la Academia de Investigación Islámica de El Cairo, primera edición 1447 AH / 2025 CE, 383 páginas, con un prefacio del Secretario General de la Academia."
  fr: "Ouvrage de Sulayman Sulayman Khamis (professeur de philosophie à la faculté d'Usul al-Din, al-Azhar) sur l'histoire de la philosophie, de l'Orient ancien et de la Grèce à la pensée moderne (Bacon, Descartes) en passant par la philosophie islamique (Ibn Sina, al-Ghazali, Ibn Rushd); publié par l'Académie de recherche islamique du Caire, première édition 1447 AH / 2025 CE, 383 pages, avec une préface du secrétaire général de l'Académie."
  ur: "قدیم مشرق اور یونان سے اسلامی فلسفہ ⁦(ابن سینا، الغزالی، ابن رشد)⁩ سے لے کر جدید فکر ⁦(بیکن، ڈی)⁩ تک، فلسفہ کی تاریخ پر سلیمان سلیمان خامس کی کتاب ⁦(اصول الدین، الازہر کی فیکلٹی میں فلسفے کے پروفیسر)⁩؛ قاہرہ میں اسلامک ریسرچ اکیڈمی کی طرف سے شائع کیا گیا، پہلا ایڈیشن 1447 ہجری / 2025 عیسوی، 383 صفحات پر مشتمل، اکیڈمی کے سیکرٹری جنرل کی طرف سے دیباچہ کے ساتھ۔"
