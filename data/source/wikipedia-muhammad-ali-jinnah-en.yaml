summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد علي جناح (1876–1948)، مؤسس باكستان وأول حاكم عام لها؛ تُستخدم لوقائع الكيان فقط. يعطي متنها ميلاده في كراتشي في 25 ديسمبر 1876 ووفاته فيها في 11 سبتمبر 1948 وتدريبه محاميًا في لينكولن إن وقيادته عصبة مسلمي عموم الهند منذ 1913، ويحمل قسم ما بعد الوفاة فيها كامل مادة الجدل حول انتمائه الديني: إسماعيلي بالولادة واثنا عشري بالاعتقاد عند ولي نصر، وشهادة بيرزاده بتحوله إلى السنة سنة 1901، وأقوال المحكمة المتعاقبة ⁦(1970 و1976 و1984)⁩."
  en: "English Wikipedia article on Muhammad Ali Jinnah (1876–1948), founder of Pakistan and its first Governor-General; used for entity facts only. Its text gives his birth at Karachi on 25 December 1876, his death there on 11 September 1948, his training as a barrister at Lincoln's Inn and his leadership of the All-India Muslim League from 1913, and its Aftermath section carries the whole documented contest over his religious affiliation: Vali Nasr's 'Ismaili by birth and a Twelver Shia by confession', Pirzada's court testimony of a 1901 conversion to Sunni Islam, and the successive court rulings of 1970, 1976 and 1984."
  es: "Artículo de la Wikipedia en inglés sobre Muhammad Ali Jinnah (1876-1948), fundador de Pakistán y su primer Gobernador General; utilizado únicamente para datos sobre la persona. Su texto indica su nacimiento en Karachi el 25 de diciembre de 1876, su muerte allí el 11 de septiembre de 1948, su formación como abogado en Lincoln's Inn y su liderazgo de la Liga Musulmana de la India desde 1913. Su sección \"Consecuencias\" recoge toda la controversia documentada sobre su afiliación religiosa: la declaración de Vali Nasr de que era \"ismaelita de nacimiento y chiíta duodecimano por confesión\", el testimonio judicial de Pirzada sobre su conversión al islam sunita en 1901 y las sucesivas sentencias judiciales de 1970, 1976 y 1984."
  fr: "L'article de Wikipédia en anglais consacré à Muhammad Ali Jinnah (1876-1948), fondateur du Pakistan et son premier gouverneur général, est utilisé uniquement à des fins d'information sur l'entité. Son texte indique sa naissance à Karachi le 25 décembre 1876, son décès dans cette même ville le 11 septembre 1948, sa formation d'avocat à Lincoln's Inn et son rôle de chef de la Ligue musulmane panindienne à partir de 1913. La section « Conséquences » relate l'ensemble des controverses documentées concernant son appartenance religieuse: la déclaration de Vali Nasr, « ismaélien de naissance et chiite duodécimain par confession », le témoignage de Pirzada devant le tribunal concernant sa conversion à l'islam sunnite en 1901, et les décisions de justice successives de 1970, 1976 et 1984."
  ur: "پاکستان کے بانی اور اس کے پہلے گورنر جنرل محمد علی جناح (1876–1948) پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا متن 25 دسمبر 1876 کو کراچی میں ان کی پیدائش، 11 ستمبر 1948 کو وہیں ان کی موت، لنکنز ان میں بیرسٹر کی تربیت اور 1913 سے آل انڈیا مسلم لیگ کی قیادت، اور اس کے بعد کے حصے میں ان کی مذہبی وابستگی پر مکمل دستاویزی مقابلہ شامل ہے: ولی نصر کی پیدائش اور شیعوں کے ذریعے۔ پیرزادہ کی 1901 میں سنی اسلام میں تبدیلی کی عدالتی گواہی، اور 1970، 1976 اور 1984 کے یکے بعد دیگرے عدالتی فیصلے۔"
