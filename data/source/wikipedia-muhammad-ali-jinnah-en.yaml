summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد علي جناح (1876–1948)، مؤسس باكستان وأول حاكم عام لها؛ تُستخدم لوقائع الكيان فقط. يعطي متنها ميلاده في كراتشي في 25 ديسمبر 1876 ووفاته فيها في 11 سبتمبر 1948 وتدريبه محاميًا في لينكولن إن وقيادته عصبة مسلمي عموم الهند منذ 1913، ويحمل قسم ما بعد الوفاة فيها كامل مادة الجدل حول انتمائه الديني: إسماعيلي بالولادة واثنا عشري بالاعتقاد عند ولي نصر، وشهادة بيرزاده بتحوله إلى السنة سنة 1901، وأقوال المحكمة المتعاقبة ⁦(1970 و1976 و1984)⁩."
  en: "English Wikipedia article on Muhammad Ali Jinnah (1876–1948), founder of Pakistan and its first Governor-General; used for entity facts only. Its text gives his birth at Karachi on 25 December 1876, his death there on 11 September 1948, his training as a barrister at Lincoln's Inn and his leadership of the All-India Muslim League from 1913, and its Aftermath section carries the whole documented contest over his religious affiliation: Vali Nasr's 'Ismaili by birth and a Twelver Shia by confession', Pirzada's court testimony of a 1901 conversion to Sunni Islam, and the successive court rulings of 1970, 1976 and 1984."
