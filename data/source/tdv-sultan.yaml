  ar: "مدخل «سلطان» في موسوعة TDV الإسلامية: تطور اللقب من معنى السلطة المجردة إلى لقب الحكّام منذ القرن الخامس الهجري في الغزنويين والسلاجقة، وانتشاره في الأيوبيين والمماليك والإيلخانيين والعثمانيين وعلاقته بالخليفة."
  en: "The TDV İslâm Ansiklopedisi entry on the title sultan: its growth from an abstract word for power into the standard ruler's title from the eleventh century under the Ghaznavids and Seljuks, its spread to the Ayyubids, Mamluks, Ilkhanids and Ottomans, and its relation to the caliph."
