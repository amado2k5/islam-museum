summary:
  ar: "مدخل «سلطان» في موسوعة TDV الإسلامية: تطور اللقب من معنى السلطة المجردة إلى لقب الحكّام منذ القرن الخامس الهجري في الغزنويين والسلاجقة، وانتشاره في الأيوبيين والمماليك والإيلخانيين والعثمانيين وعلاقته بالخليفة."
  en: "The TDV İslâm Ansiklopedisi entry on the title sultan: its growth from an abstract word for power into the standard ruler's title from the eleventh century under the Ghaznavids and Seljuks, its spread to the Ayyubids, Mamluks, Ilkhanids and Ottomans, and its relation to the caliph."
  ur: "TDV اسلامی انسائیکلوپیڈیا کی مادہ «سلطان»: قوت کے محض اصطلاحی مفہوم سے گیارہویں صدی میں غزنوی و سلجوقی دور سے حکمرانوں کے لقب تک ارتقاء، ایوبی، مملوک، ایلخانی اور عثمانی دور میں پھیلاؤ اور خلیفہ سے تعلق۔"
  es: "La entrada de la TDV İslâm Ansiklopedisi sobre el título de sultán: su evolución desde una palabra abstracta que significaba poder hasta convertirse en el título estándar de gobernante a partir del siglo XI bajo los gaznávidas y los selyúcidas, su difusión a los ayubíes, mamelucos, iljánidas y otomanos, y su relación con el califa."
  fr: "L'article de TDV İslâm Ansiklopedisi sur le titre de sultan: son évolution d'un mot abstrait désignant le pouvoir en titre standard de souverain à partir du XIe siècle sous les Ghaznévides et les Seldjoukides, sa diffusion chez les Ayyoubides, les Mamelouks, les Ilkhanides et les Ottomans, et sa relation avec le calife."
  tr: "TDV İslami Ansiklopedisi'nde 'Sultan'a Giriş: Beşinci yüzyıldan itibaren Gazneliler ve Selçuklular arasında unvanın saf otorite anlamından hükümdarlara geçişi, Eyyubiler, Memlükler, İlhanlılar ve Osmanlılar arasında yayılması ve halife ile ilişkisi."
  id: "Pengantar 'Sultan' dalam Ensiklopedia Islam TDV: Evolusi gelar dari makna otoritas murni menjadi gelar penguasa sejak abad kelima H di kalangan Ghaznavid dan Seljuk, penyebarannya di kalangan Ayyubid, Mamluk, Ilkhanid, dan Ottoman, serta hubungannya dengan khalifah."
