summary:
  ar: "صفحة وردت في ملخص بحثي قُدِّم إلى المتحف واعتمده المؤسس في 21 نوفمبر 2026؛ لم تُفتح الصفحة، وأرقام الصفحات المذكورة هي ما في الملخص ولم يُتحقق منها. ناشرها: Wikipedia (Portuguese). يُستند إليها في: ترجمات القرآن إلى الإنجليزية؛ ترجمات القرآن إلى الفرنسية؛ ترجمات القرآن إلى الإسبانية."
  en: "A page listed in a research summary supplied to the museum and approved by the founder on 21 November 2026; the page was not opened, and any page numbers are the summary's and unchecked. Publisher: Wikipedia (Portuguese). Used for: English translations of the Qur'an; French translations of the Qur'an; Spanish translations of the Qur'an."
  ur: "ایک صفحہ جو عجائب گھر کو دیے گئے تحقیقی خلاصے میں مذکور ہے اور جسے بانی نے 21 نومبر 2026 کو منظور کیا؛ صفحہ کھولا نہیں گیا، اور صفحات کے نمبر خلاصے کے ہیں اور جانچے نہیں گئے۔ ناشر: Wikipedia (Portuguese)۔ اس سے استناد ان امور کے لیے ہے: قرآن کے انگریزی تراجم؛ قرآن کے فرانسیسی تراجم؛ قرآن کے ہسپانوی تراجم۔"
  fr: "Page citée dans un résumé de recherche remis au musée et approuvé par le fondateur le 21 novembre 2026 ; la page n'a pas été ouverte, et les numéros de page sont ceux du résumé, non vérifiés. Éditeur : Wikipedia (Portuguese). Utilisée pour : les traductions anglaises du Coran; les traductions françaises du Coran; les traductions espagnoles du Coran."
  es: "Página citada en un resumen de investigación entregado al museo y aprobado por el fundador el 21 de noviembre de 2026; la página no se abrió, y los números de página son los del resumen, sin comprobar. Editor: Wikipedia (Portuguese). Usada para: las traducciones inglesas del Corán; las traducciones francesas del Corán; las traducciones españolas del Corán."
  tr: "21 Kasım 2026'da müzeye sunulan ve kurucu tarafından onaylanan bir araştırma özetinde bahsedilen bir sayfa; sayfa açılmadı ve belirtilen sayfa numaraları özetteki numaralarla doğrulanmadı. Yayınevi: Wikipedia (Portekizce). Temel alanları şunlardır: Kur'an'ın İngilizceye çevirisi; Kur'an'ın Fransızcaya çevirisi; Kur'an'ın İspanyolcaya çevirileri."
  id: "Halaman yang disebutkan dalam abstrak penelitian yang diajukan ke museum dan disetujui oleh pendiri pada 21 November 2026; halaman tersebut tidak dibuka, dan nomor halaman yang disebutkan adalah yang ada dalam abstrak dan tidak diverifikasi. Penerbit: Wikipedia (Portugis). Halaman ini berbasis pada: Terjemahan Al-Qur'an ke dalam bahasa Inggris; Terjemahan Al-Qur'an ke dalam bahasa Prancis; Terjemahan Al-Qur'an ke dalam bahasa Spanyol."
