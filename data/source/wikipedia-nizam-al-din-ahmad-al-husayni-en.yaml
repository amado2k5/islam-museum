reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). A compact article resting entirely on one scholarly monograph, James White's Persian and Arabic Literary Communities in the Seventeenth Century (I.B. Tauris, 2023), cited page by page. It gives his birth at Taif on 7 July 1618, his education, his two marriages, his premiership of Golconda (1656–1672) with the title Ayn al-Mulk, and his killing in May 1674, likely by poisoning. It names no confession for the man himself; the person record's faith is unknown on it and on the Arabic article, which is its rendering — one source family. Checked 1 November 2026."
