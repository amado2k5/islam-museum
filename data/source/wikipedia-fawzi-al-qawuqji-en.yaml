reliability_note: "Pointer for entity facts only. Read at the recorded revision and checked against it on 26 October 2026. Born 19 January 1890 at Tripoli, died 5 June 1977 at Beirut; a Turkmen family, his father an Ottoman officer. Istanbul military academy 1912, First World War service, the Syrian Legion and the Hama revolt of 1925, the 1936 Palestine revolt, a Wehrmacht colonelcy in the Second World War, and command of the Arab Liberation Army 1948-49. The article states no religion for him."
