  ar: "طبعة محققة لشرح النووي على صحيح مسلم تورد متن مسلم بأرقام عبد الباقي ⁦(مثل 2880 و2881 و2942)⁩ وبين معقوفتين رقم الطبعة نفسها، ثم شرح النووي تحته مع حواشي المحقق؛ المقروء منها كتاب الفتن وأشراط الساعة."
  en: "A critical edition of al-Nawawi's commentary on Sahih Muslim that prints Muslim's text with the Abd al-Baqi numbers (such as 2880, 2881 and 2942) beside the edition's own numbering, followed by al-Nawawi's comment and the editor's notes; the part read is the Book of Trials and Signs of the Hour."
  ur: "صحیح مسلم پر نووی کی شرح کی تحقیقی طباعت جس میں مسلم کا متن عبد الباقی کے نمبروں ⁦(مثلاً 2880، 2881، 2942)⁩ کے ساتھ چھپا ہے اور نووی کی شرح اور محقق کے حواشی ہیں؛ زیرِ مطالعہ حصہ کتاب الفتن و اشراط الساعہ ہے۔"
  es: "Una edición crítica del comentario de al-Nawawi sobre Sahih Muslim que imprime el texto de Muslim con los números de Abd al-Baqi (como 2880, 2881 y 2942) junto a la numeración de la propia edición, seguido del comentario de al-Nawawi y las notas del editor; la parte leída es el Libro de las Pruebas y los Signos de la Hora."
  fr: "Une édition critique du commentaire d'al-Nawawi sur le Sahih Muslim qui imprime le texte de Muslim avec les numéros d'Abd al-Baqi (tels que 2880, 2881 et 2942) à côté de la propre numérotation de l'édition, suivis du commentaire d'al-Nawawi et des notes de l'éditeur; la partie lue est le Livre des Épreuves et des Signes de l'Heure."
