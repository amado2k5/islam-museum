reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. Drawing on Austin (1997), Diouf (1998) and Turner (2000), it gives his birth in 1762 at Timbuktu (its infobox likewise), the family's move to Timbo, his madrasa studies at Djenné and Timbuktu, his capture in 1788, his sale to Thomas Foster at Natchez, his manumission in 1828 and his death at Monrovia on 6 July 1829. On religion its text calls him a Torodbe Fulani Muslim prince, reports his objections to the Trinity as contradicting the Islamic faith of his upbringing, his fundraising through the pretense of having fully adopted Christianity, and his return to the full practice of Islam on reaching Africa; it names no madhhab or order for him."
