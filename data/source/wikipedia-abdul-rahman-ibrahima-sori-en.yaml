  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الرحمن بن إبراهيم سوري؛ تُستخدم لوقائع الكيان فقط. تروي نشأته أميرا فولانيا متعلما في تمبكتو، وأسره سنة 1788، وأربعين عاما من العبودية في الميسيسيبي، وتحريره سنة 1828، ووفاته في مونروفيا في 6 يوليو 1829."
  en: "English Wikipedia article on Abdul Rahman Ibrahima Sori; used for entity facts only. It recounts his upbringing as an educated Fula prince, his capture in 1788, forty years of enslavement in Mississippi, his freeing in 1828, and his death at Monrovia on 6 July 1829."
