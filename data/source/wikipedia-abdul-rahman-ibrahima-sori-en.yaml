summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الرحمن بن إبراهيم سوري؛ تُستخدم لوقائع الكيان فقط. تروي نشأته أميرا فولانيا متعلما في تمبكتو، وأسره سنة 1788، وأربعين عاما من العبودية في الميسيسيبي، وتحريره سنة 1828، ووفاته في مونروفيا في 6 يوليو 1829."
  en: "English Wikipedia article on Abdul Rahman Ibrahima Sori; used for entity facts only. It recounts his upbringing as an educated Fula prince, his capture in 1788, forty years of enslavement in Mississippi, his freeing in 1828, and his death at Monrovia on 6 July 1829."
  es: "Artículo de la Wikipedia en inglés sobre Abdul Rahman Ibrahima Sori; utilizado únicamente para obtener información sobre la persona. Relata su infancia como príncipe fulani culto, su captura en 1788, sus cuarenta años de esclavitud en Misisipi, su liberación en 1828 y su muerte en Monrovia el 6 de julio de 1829."
  fr: "Article de Wikipédia en anglais sur Abdul Rahman Ibrahima Sori; utilisé uniquement à des fins d’information sur l’entité. Il relate son éducation en tant que prince peul instruit, sa capture en 1788, quarante années d’esclavage dans le Mississippi, sa libération en 1828 et sa mort à Monrovia le 6 juillet 1829."
  ur: "عبدالرحمن ابراہیم سوری پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ایک تعلیم یافتہ فولا شہزادے کے طور پر اس کی پرورش، 1788 میں اس کی گرفتاری، مسیسیپی میں چالیس سال کی غلامی، 1828 میں اس کی آزادی، اور 6 جولائی 1829 کو منروویا میں اس کی موت کا ذکر ہے۔"
