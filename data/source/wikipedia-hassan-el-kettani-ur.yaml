  ar: "مقالة ويكيبيديا الأردية عن حسن کتانی؛ ترجمة للمقالة العربية تحمل مراجعها نفسها. تثبت ميلاده في سلا سنة 1392 هـ ⁦(16 أغسطس 1972)⁩ واعتقاله سنة 2003 وإطلاقه سنة 2012 وتدريسه وخطابته في سلا والرباط."
  en: "Urdu Wikipedia article on Hassan Kettani; a translation of the Arabic article carrying the same references. It gives his birth at Salé in 1392 AH (16 August 1972), his arrest in 2003 and release in 2012, and his teaching and preaching at Salé and Rabat."
