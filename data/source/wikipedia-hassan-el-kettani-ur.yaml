  fr: "Article de Wikipédia en ourdou sur Hassan Kettani; traduction de l’article arabe contenant les mêmes références. On y apprend sa naissance à Salé en 1392 AH (16 août 1972), son arrestation en 2003 et sa libération en 2012, ainsi que son enseignement et ses prédications à Salé et à Rabat."
  ur: "حسن کیتانی پر اردو ویکیپیڈیا مضمون؛ عربی مضمون کا ترجمہ جس میں وہی حوالہ جات ہیں۔ یہ 1392 ہجری ⁦(16 اگست 1972)⁩ میں سالے میں ان کی ولادت، 2003 میں ان کی گرفتاری اور 2012 میں رہائی، اور سالے اور رباط میں ان کی تعلیم و تبلیغ کا ذکر کرتا ہے۔"
