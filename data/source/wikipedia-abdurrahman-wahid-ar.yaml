summary:
  ar: "مقالة ويكيبيديا العربية عن عبد الرحمن وحيد؛ تُستخدم لوقائع الكيان فقط. سيرة مختصرة تذكر مولده في جومبانغ سنة 1940 وأسرته وترؤسه نهضة العلماء ورئاسته ووفاته في جاكرتا سنة 2009."
  en: "Arabic Wikipedia article on Abdurrahman Wahid; used for entity facts only. A shorter biography giving his birth at Jombang in 1940, his family, his NU chairmanship, his presidency and his death at Jakarta in 2009."
  es: "Artículo en árabe de la Wikipedia sobre Abdurrahman Wahid; utilizado únicamente para datos sobre la persona. Una biografía más breve que detalla su nacimiento en Jombang en 1940, su familia, su presidencia de la NU, su presidencia y su fallecimiento en Yakarta en 2009."
  fr: "Article Wikipédia en arabe sur Abdurrahman Wahid; utilisé uniquement à des fins d’information sur l’entité. Une biographie plus courte retrace sa naissance à Jombang en 1940, sa famille, sa présidence de la Nahdlatul Ulama, sa présidence et son décès à Jakarta en 2009."
  ur: "عبدالرحمن واحد پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ 1940 میں جومبنگ میں ان کی پیدائش، ان کا خاندان، ان کی NU کی چیئرمین شپ، ان کی صدارت اور 2009 میں جکارتہ میں ان کی موت کے بارے میں ایک مختصر سوانح حیات۔"
  tr: "Abdul Rahman Wahid hakkında Arapça Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1940'ta Jumbang'da doğumundan, ailesinden, Nahdlat al-Ulama'nın liderliğinden, cumhurbaşkanlığından ve 2009'da Jakarta'daki ölümünden bahseden kısa bir biyografi."
  id: "Artikel Wikipedia bahasa Arab tentang Abdul Rahman Wahid; hanya digunakan untuk fakta entitas. Biografi singkat yang menyebutkan kelahirannya di Jumbang pada tahun 1940, keluarganya, kepemimpinannya di Nahdlat al-Ulama, kepresidenannya, dan kematiannya di Jakarta pada tahun 2009."
