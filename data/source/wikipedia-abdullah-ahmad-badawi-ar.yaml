summary:
  ar: "مقالة ويكيبيديا العربية عن عبد الله أحمد بدوي (1939–2025)؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 26 نوفمبر 1939 ووفاته في 14 أبريل 2025، ورئاسته الخامسة لوزراء ماليزيا (2003–2009)، ولقبه «باك لاه»."
  en: "Arabic Wikipedia article on Abdullah Ahmad Badawi (1939–2025); used for entity facts only. It gives his birth on 26 November 1939, his death on 14 April 2025, his tenure as Malaysia's fifth prime minister (2003–2009), and his nickname Pak Lah."
  es: "Artículo en árabe de la Wikipedia sobre Abdullah Ahmad Badawi (1939-2025); utilizado únicamente para datos biográficos. Indica su fecha de nacimiento (26 de noviembre de 1939), su fallecimiento (14 de abril de 2025), su mandato como quinto primer ministro de Malasia (2003-2009) y su apodo, Pak Lah."
  fr: "Article de Wikipédia en arabe sur Abdullah Ahmad Badawi (1939-2025); utilisé uniquement à des fins d'information sur l'entité. Il indique sa date de naissance, le 26 novembre 1939, sa date de décès, le 14 avril 2025, son mandat de cinquième Premier ministre de Malaisie (2003-2009) et son surnom, Pak Lah."
  ur: "عبداللہ احمد بدوی (1939-2025) پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 26 نومبر 1939 کو ان کی پیدائش، 14 اپریل 2025 کو ان کی موت، ملائیشیا کے پانچویں وزیر اعظم (2003–2009) کے طور پر ان کا دور اور ان کا عرفی نام پاک لہ بتاتا ہے۔"
  tr: "Abdullah Ahmed Badawi (1939–2025) hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Doğumunu 26 Kasım 1939'da, 14 Nisan 2025'teki ölümünü, beşinci Malezya bakanlığı dönemini (2003–2009) ve 'Pak Lah' lakabını anmaktadır."
  id: "Artikel Wikipedia berbahasa Arab tentang Abdullah Ahmed Badawi (1939–2025); hanya digunakan untuk fakta entitas tersebut. Artikel tersebut menyebutkan kelahirannya pada 26 November 1939, kematiannya pada 14 April 2025, masa kepresidenannya yang kelima, sebagai menteri Malaysia (2003–2009), dan julukannya 'Pak Lah'."
