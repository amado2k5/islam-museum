  ar: "مقالة ويكيبيديا الإنجليزية عن سوهارتو؛ تُستخدم لوقائع الكيان فقط. تروي مولده في 8 يونيو 1921 في بانتول لأبوين مسلمين جاويين، ومسيرته العسكرية ووصوله إلى السلطة بين 1965 و1967 ورئاسته حتى استقالته سنة 1998، وحجه سنة 1991 وتلقيبه باسم «محمد» من الملك فهد، ووفاته في جاكرتا في 27 يناير 2008."
  en: "English Wikipedia article on Suharto; used for entity facts only. It recounts his birth on 8 June 1921 at Bantul to Javanese Muslim parents, his army career and rise to power in 1965–1967, his presidency until his resignation in 1998, his Hajj in 1991 and the name 'Mohammad' given him by King Fahd, and his death at Jakarta on 27 January 2008."
