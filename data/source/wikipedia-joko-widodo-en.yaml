summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن جوكو ويدودو ⁦(وُلد 1961)⁩؛ تُستخدم لوقائع الكيان فقط. تروي مولده في سوراكارتا في 21 يونيو 1961 باسم موليونو، وعمله في الأثاث، وعمادته سوراكارتا، وحكمه جاكرتا، وولايتيه الرئاسيتين (2014–2024)."
  en: "English Wikipedia article on Joko Widodo (born 1961); used for entity facts only. It recounts his birth at Surakarta on 21 June 1961 under the name Mulyono, his furniture business, his Surakarta mayoralty, his Jakarta governorship, and his two presidential terms (2014–2024)."
  es: "Artículo de la Wikipedia en inglés sobre Joko Widodo (nacido en 1961); utilizado únicamente para datos sobre la persona. Relata su nacimiento en Surakarta el 21 de junio de 1961 con el nombre de Mulyono, su negocio de muebles, su alcaldía de Surakarta, su gobernación de Yakarta y sus dos mandatos presidenciales (2014-2024)."
  fr: "Article de Wikipédia en anglais sur Joko Widodo (né en 1961); utilisé uniquement à des fins d’information sur l’entité. Il relate sa naissance à Surakarta le 21 juin 1961 sous le nom de Mulyono, son entreprise de meubles, son mandat de maire de Surakarta, son mandat de gouverneur de Jakarta et ses deux mandats présidentiels (2014-2024)."
  ur: "جوکو وڈوڈو ⁦(پیدائش 1961)⁩ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 21 جون 1961 کو سوراکارتا میں ان کی پیدائش ملونو کے نام سے، اس کے فرنیچر کے کاروبار، سوراکارتا کی میئرلٹی، اس کی جکارتہ کی گورنری، اور ان کی دو صدارتی مدتوں (2014-2024) کے نام سے یاد کیا گیا ہے۔"
