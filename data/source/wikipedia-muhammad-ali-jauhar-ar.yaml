  ar: "مقالة ويكيبيديا العربية عن محمد علي جوهر (1878–1931)؛ تُستخدم لوقائع الكيان فقط. تصفه بأنه قائد وسياسي وصحفي وشاعر مسلم هندي من أبرز قادة حركة الخلافة، وتروي تعليمه في عليكرة وكلية لينكولن بأكسفورد، وعمله مديرًا للتعليم في رامبور، ورئاسته العصبة الإسلامية سنة 1918 والمؤتمر الوطني سنة 1923."
  en: "Arabic Wikipedia article on Muhammad Ali Jauhar (1878–1931); used for entity facts only. It presents him as an Indian Muslim leader, politician, journalist and poet and a leading figure of the Khilafat movement, and recounts his education at Aligarh and Lincoln College, Oxford, his post as education director of Rampur, his 1918 presidency of the Muslim League and his 1923 presidency of the Indian National Congress."
