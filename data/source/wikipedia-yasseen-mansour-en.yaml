summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ياسين منصور: الابن الأصغر للطفي منصور، شريك في ملكية مجموعة منصور ورئيس بالم هيلز؛ تذكر ميلاده سنة 1961 أو 1962 وتبرئته من تهم فساد سنة 2011 بعد دفع 250 مليون جنيه وحساباته في كريدي سويس ضمن تسريبات أسرار سويسرا."
  en: "English Wikipedia article on Yasseen Mansour, youngest son of Loutfy Mansour, part owner of the Mansour Group and chairman of Palm Hills Developments; it gives his birth as 1961/1962, his clearance of corruption charges in 2011 after a payment of 250 million Egyptian pounds, and his Credit Suisse accounts in the Suisse Secrets leaks."
  es: "Artículo de la Wikipedia en inglés sobre Yasseen Mansour, hijo menor de Loutfy Mansour, copropietario del Grupo Mansour y presidente de Palm Hills Developments; en él se indica que nació en 1961/1962, que fue absuelto de los cargos de corrupción en 2011 tras el pago de 250 millones de libras egipcias y que sus cuentas en Credit Suisse aparecieron en las filtraciones de Suisse Secrets."
  fr: "L'article de Wikipédia en anglais sur Yasseen Mansour, le plus jeune fils de Loutfy Mansour, copropriétaire du groupe Mansour et président de Palm Hills Developments, indique sa naissance en 1961/1962, son acquittement pour corruption en 2011 après le versement de 250 millions de livres égyptiennes, et ses comptes Credit Suisse dans les fuites Suisse Secrets."
  ur: "یاسین منصور پر انگریزی ویکیپیڈیا کا مضمون، لطفی منصور کے سب سے چھوٹے بیٹے، منصور گروپ کے حصہ کے مالک اور پام ہلز ڈویلپمنٹ کے چیئرمین؛ یہ اس کی پیدائش 1961/1962 کے طور پر کرتا ہے، 250 ملین مصری پاؤنڈز کی ادائیگی کے بعد 2011 میں اس کی بدعنوانی کے الزامات کی کلیئرنس، اور سوئس سیکرٹس میں اس کے کریڈٹ سوئس اکاؤنٹس لیک ہوئے۔"
