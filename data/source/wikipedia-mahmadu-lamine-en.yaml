summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الحاج محمد الأمين درامي (ممدو لامين)، المرابط التيجاني السوننكي الذي قاد تمردات ضد الحكم الاستعماري الفرنسي في السنغال الحالي؛ تروي ولادته بين 1835 و1840 في غونديورو قرب كايس بمالي، وتعليمه وحجه وسجنه على يد أحمدو تال، وانتفاضاته في 1886-1887 وحصار باكل ومعركة توباكوتا ووفاته في ديسمبر 1887."
  en: "English Wikipedia article on al-Hajj Mahmadu Lamine Drame, the Soninke marabout who led rebellions against the French colonial government in present-day Senegal; it recounts his birth between 1835 and 1840 at Goundiourou near Kayes in Mali, his education, hajj and imprisonment by Ahmadu Tall, his uprisings of 1886–1887, the siege of Bakel, the fall of Toubakouta and his death in December 1887."
