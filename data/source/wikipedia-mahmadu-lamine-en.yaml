summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الحاج محمد الأمين درامي ⁦(ممدو لامين)⁩، المرابط التيجاني السوننكي الذي قاد تمردات ضد الحكم الاستعماري الفرنسي في السنغال الحالي؛ تروي ولادته بين 1835 و1840 في غونديورو قرب كايس بمالي، وتعليمه وحجه وسجنه على يد أحمدو تال، وانتفاضاته في 1886-1887 وحصار باكل ومعركة توباكوتا ووفاته في ديسمبر 1887."
  en: "English Wikipedia article on al-Hajj Mahmadu Lamine Drame, the Soninke marabout who led rebellions against the French colonial government in present-day Senegal; it recounts his birth between 1835 and 1840 at Goundiourou near Kayes in Mali, his education, hajj and imprisonment by Ahmadu Tall, his uprisings of 1886–1887, the siege of Bakel, the fall of Toubakouta and his death in December 1887."
  es: "Artículo de la Wikipedia en inglés sobre al-Hajj Mahmadu Lamine Drame, el marabú soninke que lideró rebeliones contra el gobierno colonial francés en el actual Senegal; relata su nacimiento entre 1835 y 1840 en Goundiourou, cerca de Kayes, en Mali, su educación, su peregrinación a La Meca y su encarcelamiento por Ahmadu Tall, sus levantamientos de 1886-1887, el asedio de Bakel, la caída de Toubakouta y su muerte en diciembre de 1887."
  fr: "L'article de Wikipédia en anglais sur al-Hajj Mahmadu Lamine Drame, le marabout soninké qui mena des rébellions contre le gouvernement colonial français dans l'actuel Sénégal; il relate sa naissance entre 1835 et 1840 à Goundiourou près de Kayes au Mali, son éducation, son hajj et son emprisonnement par Ahmadu Tall, ses soulèvements de 1886-1887, le siège de Bakel, la chute de Toubakouta et sa mort en décembre 1887."
  ur: "الحاج محمود لامین ڈرام پر انگریزی ویکیپیڈیا کا مضمون، سونینکے ماراباؤٹ جس نے موجودہ سینیگال میں فرانسیسی نوآبادیاتی حکومت کے خلاف بغاوت کی قیادت کی۔ اس میں 1835 اور 1840 کے درمیان مالی میں کائیس کے قریب گونڈیورو میں اس کی پیدائش، احمدو ٹل کی تعلیم، حج اور قید، 1886-1887 کی اس کی بغاوت، باکیل کا محاصرہ، توباکوٹا کا زوال اور دسمبر 1887 میں اس کی موت کا ذکر ہے۔"
