summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مكتبة قطر الرقمية، المراجعة 1376152857؛ لوقائع الكيان فقط: مكتبة ثنائية اللغة أطلقتها مؤسسة قطر ومكتبة قطر الوطنية والمكتبة البريطانية في أكتوبر 2014، ومحتواها من سجلات مكتب الهند والمخطوطات العلمية العربية، وأعداد صفحاتها."
  en: "English Wikipedia article on the Qatar Digital Library, revision 1376152857; entity facts only: a bilingual library launched by Qatar Foundation, Qatar National Library and the British Library in October 2014, its India Office Records and Arabic scientific manuscripts, and its page counts."
  ur: "قطر ڈیجیٹل لائبریری پر انگریزی ویکیپیڈیا کا مضمون، نظرِ ثانی 1376152857؛ صرف حقائق: قطر فاؤنڈیشن، قطر نیشنل لائبریری اور برٹش لائبریری کی اکتوبر 2014 میں شروع کی گئی دو لسانی لائبریری، انڈیا آفس ریکارڈز اور عربی سائنسی مخطوطات، اور صفحات کی تعداد۔"
  es: "Artículo de la Wikipedia en inglés sobre la Biblioteca Digital de Qatar, revisión 1376152857; solo datos sobre la entidad: una biblioteca bilingüe lanzada por la Fundación Qatar, la Biblioteca Nacional de Qatar y la Biblioteca Británica en octubre de 2014, sus registros de la Oficina de la India y manuscritos científicos en árabe, y su número de páginas."
  fr: "Article de Wikipédia en anglais sur la bibliothèque numérique du Qatar, révision 1376152857; informations sur l’entité uniquement: une bibliothèque bilingue lancée par la Fondation du Qatar, la Bibliothèque nationale du Qatar et la British Library en octobre 2014, ses archives de l’India Office et ses manuscrits scientifiques arabes, ainsi que le nombre de pages qu’elle contient."
  tr: "Katar Dijital Kütüphanesi hakkında İngilizce Wikipedia makalesi, revizyon 1376152857; yalnızca varlık kayıtları için: Katar Vakfı, Katar Ulusal Kütüphanesi ve British Library tarafından Ekim 2014'te başlatılan iki dilli bir kütüphane, içeriği Hindistan Ofisi kayıtları ve Arapça bilimsel el yazmalarından ve sayfa sayısından oluşmaktadır."
  id: "Artikel Wikipedia bahasa Inggris tentang Perpustakaan Digital Qatar, revisi 1376152857; hanya untuk catatan entitas: perpustakaan dwibahasa yang diluncurkan oleh Qatar Foundation, Perpustakaan Nasional Qatar, dan Perpustakaan Inggris pada Oktober 2014, dengan isi dari arsip Kantor India dan manuskrip ilmiah Arab, serta jumlah halamannya."
