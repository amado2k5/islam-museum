  ar: "مقالة ويكيبيديا العربية عن المختار ولد داداه؛ تُستخدم لوقائع الكيان فقط. تروي تأسيسه الدولة الموريتانية الحديثة ورئاسته الجمهورية الإسلامية الموريتانية منذ الاستقلال سنة 1960 ومواجهته المطالب المغربية. يسمّي صندوق معلوماتها دينه «مسلم سني»، ولا يذكر نصّها مذهبا شخصيا له؛ وتصنّفه في «الاشتراكيين المسلمين»."
  en: "Arabic Wikipedia article on Moktar Ould Daddah; used for entity facts only. It recounts his founding of the modern Mauritanian state, his presidency of the Islamic Republic of Mauritania from independence in 1960, and his stand against Morocco's claim to Mauritania. Its infobox names his religion 'Sunni Muslim'; its text names no personal school of his, and it files him under Muslim socialists."
