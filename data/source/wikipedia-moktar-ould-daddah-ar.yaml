summary:
  ar: "مقالة ويكيبيديا العربية عن المختار ولد داداه؛ تُستخدم لوقائع الكيان فقط. تروي تأسيسه الدولة الموريتانية الحديثة ورئاسته الجمهورية الإسلامية الموريتانية منذ الاستقلال سنة 1960 ومواجهته المطالب المغربية. يسمّي صندوق معلوماتها دينه «مسلم سني»، ولا يذكر نصّها مذهبا شخصيا له؛ وتصنّفه في «الاشتراكيين المسلمين»."
  en: "Arabic Wikipedia article on Moktar Ould Daddah; used for entity facts only. It recounts his founding of the modern Mauritanian state, his presidency of the Islamic Republic of Mauritania from independence in 1960, and his stand against Morocco's claim to Mauritania. Its infobox names his religion 'Sunni Muslim'; its text names no personal school of his, and it files him under Muslim socialists."
  es: "Artículo en árabe de la Wikipedia sobre Moktar Ould Daddah; utilizado únicamente para datos sobre la persona. Relata la fundación del Estado mauritano moderno, su presidencia de la República Islámica de Mauritania desde su independencia en 1960 y su oposición a la reivindicación marroquí sobre Mauritania. Su ficha informativa indica que su religión es «musulmán sunita»; el texto no menciona ninguna escuela religiosa a la que perteneciera y lo clasifica dentro del socialismo musulmán."
  fr: "L'article de Wikipédia en arabe consacré à Moktar Ould Daddah est utilisé uniquement à des fins d'information sur l'entité. Il relate la fondation de l'État mauritanien moderne, sa présidence de la République islamique de Mauritanie à partir de l'indépendance en 1960 et son opposition aux revendications du Maroc sur la Mauritanie. L'infobox indique qu'il est musulman sunnite; le texte ne mentionne aucune école personnelle à son encontre et le classe parmi les socialistes musulmans."
title: "المختار ولد داداه"
