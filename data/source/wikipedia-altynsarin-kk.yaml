summary:
  ar: "مقالة ويكيبيديا الكازاخية عن إبراي ألتينسارين؛ تُستخدم لوقائع الكيان فقط. أوسع مقالاته: مدارسه في أقاليم تورغاي الأربعة، و«المختارات الكازاخية» (1879)، ويعطي قالبها دينه «الإسلام السني»."
  en: "Kazakh Wikipedia article on Ybyrai Altynsarin; used for entity facts only. The fullest of his articles: his schools in the four districts of Turgay region, the Kazakh Chrestomathy of 1879, and an infobox whose religion field gives 'Sunni Islam'."
  es: "Artículo de Wikipedia en kazajo sobre Ybyrai Altynsarin; utilizado únicamente para datos sobre la entidad. Los artículos más completos sobre él incluyen: sus escuelas en los cuatro distritos de la región de Turgay, la Crestomatía kazaja de 1879 y un recuadro informativo cuyo campo de religión indica «Islam sunita»."
  fr: "Article de Wikipédia en kazakh sur Ybyrai Altynsarin; utilisé uniquement pour des informations sur l'entité. Cet article, le plus complet, mentionne ses écoles dans les quatre districts de la région de Turgay, la Chrestomathie kazakhe de 1879 et une infobox dont le champ « religion » indique « Islam sunnite »."
  ur: "Ybyrai Altynsarin پر قازق ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ ان کے تمام مضامین: ترگے کے علاقے کے چار اضلاع میں ان کے اسکول، 1879 کی قازق کرسٹو میتھی، اور ایک معلوماتی باکس جس کا مذہب 'سنی اسلام' دیتا ہے۔"
  tr: "İbri Altinsarin hakkında Kazak Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. En geniş makaleleri: dört Torgay vilayetindeki okulları ve dini \"Sünni İslam\"a atfettiği \"Kazak Seçimleri\" (1879)."
  id: "Artikel Wikipedia Kazakh tentang Ibri Altinsarin; digunakan hanya untuk fakta entitas. Artikel terluasnya: sekolahnya di empat provinsi Torgay, dan \"Kazakh Selections\" (1879), yang ia atribusikan sebagai \"Islam Sunni.\""
