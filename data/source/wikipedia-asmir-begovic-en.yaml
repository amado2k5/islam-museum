  ar: "مقالة ويكيبيديا الإنجليزية عن أسمير بيغوفيتش؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في تريبينيي وهجرة أسرته هربًا من حرب البوسنة، ومسيرته من بورتسموث إلى ستوك سيتي — حيث سجل سنة 2013 هدفًا من منطقته دخل موسوعة غينيس كأطول هدف — ثم تشيلسي وبورنموث وإيفرتون، وتمثيله البوسنة والهرسك في كأس العالم 2014."
  en: "English Wikipedia article on Asmir Begović; used for entity facts only. It recounts his Trebinje childhood and his family's flight from the Bosnian War, his path from Portsmouth to Stoke City — where in 2013 he scored from his own area, a Guinness world record for the longest goal — then Chelsea, Bournemouth and Everton, and his part in Bosnia and Herzegovina's 2014 World Cup campaign."
