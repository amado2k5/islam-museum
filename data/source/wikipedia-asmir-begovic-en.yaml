summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أسمير بيغوفيتش؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في تريبينيي وهجرة أسرته هربًا من حرب البوسنة، ومسيرته من بورتسموث إلى ستوك سيتي — حيث سجل سنة 2013 هدفًا من منطقته دخل موسوعة غينيس كأطول هدف — ثم تشيلسي وبورنموث وإيفرتون، وتمثيله البوسنة والهرسك في كأس العالم 2014."
  en: "English Wikipedia article on Asmir Begović; used for entity facts only. It recounts his Trebinje childhood and his family's flight from the Bosnian War, his path from Portsmouth to Stoke City — where in 2013 he scored from his own area, a Guinness world record for the longest goal — then Chelsea, Bournemouth and Everton, and his part in Bosnia and Herzegovina's 2014 World Cup campaign."
  es: "Artículo de la Wikipedia en inglés sobre Asmir Begović; utilizado únicamente para datos sobre la persona. Narra su infancia en Trebinje y la huida de su familia de la guerra de Bosnia, su trayectoria desde Portsmouth hasta Stoke City —donde en 2013 marcó desde su propia área, un récord mundial Guinness por el gol más lejano—, luego Chelsea, Bournemouth y Everton, y su participación en la campaña de Bosnia y Herzegovina para la Copa Mundial de 2014."
  fr: "Article de Wikipédia en anglais sur Asmir Begović; utilisé uniquement à des fins d'information sur l'entité. Il relate son enfance à Trebinje et la fuite de sa famille pendant la guerre de Bosnie, son parcours de Portsmouth à Stoke City — où, en 2013, il a marqué depuis sa propre surface de réparation, un record du monde Guinness pour le but le plus long — puis Chelsea, Bournemouth et Everton, et sa participation à la campagne de la Bosnie-Herzégovine lors de la Coupe du monde 2014."
  ur: "Asmir Begović پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں بوسنیا کی جنگ سے اس کے ٹریبینجے کے بچپن اور اس کے خاندان کی پرواز، پورٹسماؤتھ سے اسٹوک سٹی تک کا راستہ بتایا گیا ہے - جہاں 2013 میں اس نے اپنے ہی علاقے سے اسکور کیا، سب سے طویل گول کرنے کا گنیز ورلڈ ریکارڈ — پھر چیلسی، بورن ماؤتھ اور ایورٹن، اور بوسنیا اور ہرزیگووینا کی ورلڈ کپ 2014 کی مہم میں اس کا حصہ۔"
  tr: "Asmir Begović hakkında İngilizce Wikipedia makalesi; sadece varlığın gerçekleri için kullanılmıştır. Trebinje'deki yetiştirilme tarzını, ailesinin Bosna Savaşı'ndan kaçmak için göçü, Portsmouth'tan Stoke City'ye yaptığı yolculuğu — 2013'te kendi bölgesinden attığı golü Guinness Dünya Rekorları'na en uzun gol olarak girdiği — ardından Chelsea, Bournemouth ve Everton'a yaptığı yolculuğu ve 2014 Dünya Kupası'nda Bosna-Hersek'i temsil etmesini anlatıyor."
  id: "Artikel Wikipedia bahasa Inggris tentang Asmir Begović; digunakan hanya untuk fakta entitas. Artikel ini menceritakan masa kecilnya di Trebinje, migrasi keluarganya untuk melarikan diri dari Perang Bosnia, perjalanannya dari Portsmouth ke Stoke City — di mana pada 2013 dia mencetak gol dari wilayahnya yang masuk Guinness World Records sebagai gol terpanjang — lalu Chelsea, Bournemouth, dan Everton, serta mewakili Bosnia dan Herzegovina di Piala Dunia 2014."
