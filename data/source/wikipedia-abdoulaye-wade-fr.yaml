  ar: "مقالة ويكيبيديا الفرنسية عن عبد الله واد؛ سيرة طويلة تُستخدم لوقائع الكيان فقط. صندوقها يذكر «الإسلام المريدي»، ومتنها يسمي المريدية «طريقته الدينية» عند رواية نقد محاباته لها، ويذكر قربه الشديد منها وتبرعه بأرض لمسجدها الكبير في داكار."
  en: "French Wikipedia article on Abdoulaye Wade; a long biography used for entity facts only. Its infobox gives his religion as 'Islam mouride' (citing Jeune Afrique). Its text, recounting criticism of his rule, calls the Mourides 'sa confrérie religieuse' — his religious brotherhood — and adds that he is very close to the brotherhood and donated the land for Dakar's great Massalikul Jinaan Mouride mosque."
