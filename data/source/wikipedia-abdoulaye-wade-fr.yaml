summary:
  ar: "مقالة ويكيبيديا الفرنسية عن عبد الله واد؛ سيرة طويلة تُستخدم لوقائع الكيان فقط. صندوقها يذكر «الإسلام المريدي»، ومتنها يسمي المريدية «طريقته الدينية» عند رواية نقد محاباته لها، ويذكر قربه الشديد منها وتبرعه بأرض لمسجدها الكبير في داكار."
  en: "French Wikipedia article on Abdoulaye Wade; a long biography used for entity facts only. Its infobox gives his religion as 'Islam mouride' (citing Jeune Afrique). Its text, recounting criticism of his rule, calls the Mourides 'sa confrérie religieuse' — his religious brotherhood — and adds that he is very close to the brotherhood and donated the land for Dakar's great Massalikul Jinaan Mouride mosque."
  es: "Artículo de la Wikipedia en francés sobre Abdoulaye Wade; una biografía extensa utilizada únicamente para datos sobre la persona. Su ficha informativa indica que su religión es «Islam mouride» (citando a Jeune Afrique). El texto, que recoge las críticas a su gobierno, se refiere a los mourides como «su hermandad religiosa» y añade que es muy cercano a la hermandad y que donó el terreno para la gran mezquita Massalikul Jinaan Mouride de Dakar."
  fr: "L'article Wikipédia français sur Abdoulaye Wade contient une longue biographie, uniquement consacrée aux faits relatifs à l'individu. Son infobox indique qu'il est de confession « islam mouride » (d'après Jeune Afrique). Le texte, qui relate les critiques formulées à l'encontre de son régime, qualifie les Mourides de « sa confrérie religieuse » et précise qu'il est très proche de cette confrérie et qu'il a fait don du terrain pour la grande mosquée mouride Massalikul Jinaan de Dakar."
