  ar: "مقالة ويكيبيديا الفارسية عن نادر انقطاع؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 16 مهر 1334 ⁦(= 8 تشرين الأول 1955)⁩ في طهران، ودراسته في جامعة طهران وكالتك وأستاذيته في جامعة بنسلفانيا."
  en: "Persian Wikipedia article on Nader Engheta; used for entity facts only. It gives his birth on 16 Mehr 1334 (= 8 October 1955) in Tehran, his studies at the University of Tehran and Caltech, and his professorship at the University of Pennsylvania."
  es: "Artículo de la Wikipedia en persa sobre Nader Engheta; se utiliza únicamente para obtener información sobre la persona. Indica que nació el 16 de Mehr de 1334 (8 de octubre de 1955) en Teherán, que estudió en la Universidad de Teherán y en Caltech, y que fue profesor en la Universidad de Pensilvania."
  fr: "Article Wikipédia en persan sur Nader Engheta; utilisé uniquement pour les informations le concernant. Il indique sa naissance le 16 Mehr 1334 (soit le 8 octobre 1955) à Téhéran, ses études à l’Université de Téhéran et au Caltech, et son poste de professeur à l’Université de Pennsylvanie."
  ur: "نادر اینگھیٹا پر فارسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ تہران میں 16 مہر 1334 ⁦(= 8 اکتوبر 1955)⁩ کو پیدا ہوا، اس نے تہران یونیورسٹی اور کیلٹیک میں تعلیم حاصل کی، اور پنسلوانیا یونیورسٹی میں اس کی پروفیسری کی۔"
