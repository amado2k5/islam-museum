language: en
reliability_note: "Read in full on 26 October 2026 (DOI 10.51276/edu.v4i1.311; received 19 November 2022, published online 27 December 2022, issue dated January 2023). It states: 'In 2016, the Australian company One4Kids launched a cartoon channel for Muslim children' and 'The producer and director of One4Kids, Subhi Alshaik, created the animated film One4Kids as an alternative to the animated movie Peppa Pig', and its method section again describes its subject as 'the One4kids nasyid song by Subhi Alshaik, the producer and director of One4Kids'."
