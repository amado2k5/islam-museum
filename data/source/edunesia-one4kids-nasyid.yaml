summary:
  ar: "مقالة في مجلة إندونيسية محكّمة (إدونيسيا: مجلة علمية في التربية، 2023) تدرس قيم التربية الإسلامية في أناشيد «ون فور كيدز» لصبحي الشيخ؛ تسمّيه منتج «ون فور كيدز» ومخرجها، وتذكر أن الشركة الأسترالية أطلقت قناتها للرسوم المتحركة لأطفال المسلمين سنة 2016."
  en: "Peer-reviewed Indonesian journal article (Edunesia: Jurnal Ilmiah Pendidikan, 2023) studying the Islamic-education values in Subhi Alshaik's One4Kids nasyid songs; it names him as the producer and director of One4Kids and records that the Australian company launched its cartoon channel for Muslim children in 2016."
title: "The Values of Islamic Education in Nasyid Songs on the Indonesian Language Edition of One4kids Youtube Channel by Subhi Alshaik"
author: [{ family: "Suheri", given: "" }, { family: "Yansyah", given: "Dedy" }, { family: "Zaenuri", given: "" }, { family: "Anshori", given: "Irfan" }, { family: "Mutmainah", given: "Rodiatul" }]
