summary:
  ar: "مقالة في مجلة إندونيسية محكّمة ⁦(إدونيسيا: مجلة علمية في التربية، 2023)⁩ تدرس قيم التربية الإسلامية في أناشيد «ون فور كيدز» لصبحي الشيخ؛ تسمّيه منتج «ون فور كيدز» ومخرجها، وتذكر أن الشركة الأسترالية أطلقت قناتها للرسوم المتحركة لأطفال المسلمين سنة 2016."
  en: "Peer-reviewed Indonesian journal article (Edunesia: Jurnal Ilmiah Pendidikan, 2023) studying the Islamic-education values in Subhi Alshaik's One4Kids nasyid songs; it names him as the producer and director of One4Kids and records that the Australian company launched its cartoon channel for Muslim children in 2016."
  es: "Artículo de una revista indonesia revisada por pares (Edunesia: Jurnal Ilmiah Pendidikan, 2023) que estudia los valores de la educación islámica en las canciones nasyid de One4Kids de Subhi Alshaik; lo nombra como productor y director de One4Kids y registra que la compañía australiana lanzó su canal de dibujos animados para niños musulmanes en 2016."
  fr: "Article de revue indonésienne à comité de lecture (Edunesia: Jurnal Ilmiah Pendidikan, 2023) étudiant les valeurs de l'éducation islamique dans les chansons nasyid One4Kids de Subhi Alshaik; il le nomme producteur et réalisateur de One4Kids et indique que la société australienne a lancé sa chaîne de dessins animés pour enfants musulmans en 2016."
  ur: "پیر کا جائزہ لیا گیا انڈونیشی جریدے کا مضمون ⁦(ایڈونیشیا: جرنل علمیہ پینڈیڈیکن، 2023)⁩ سبی الشائک کے One4Kids nasyid گانے میں اسلامی تعلیم کی اقدار کا مطالعہ؛ اس نے اسے One4Kids کے پروڈیوسر اور ڈائریکٹر کے طور پر نامزد کیا اور ریکارڈ کیا کہ آسٹریلوی کمپنی نے 2016 میں مسلمان بچوں کے لیے اپنا کارٹون چینل شروع کیا۔"
  tr: "Endonezya'da hakemli bir dergide (Indonesia: A Scientific Journal in Education, 2023) yayımlanan bir makale, Subhi Al-Sheikh'in 'One for Kids' şarkısının marşlarındaki İslami eğitimin değerlerini inceliyor; onu 'One for Kids'in yapımcısı ve yönetmeni olarak nitelendiriyor ve Avustralyalı şirketin 2016'da Müslüman çocuklar için animasyon kanalını başlattığını belirtiyor."
  id: "Sebuah artikel di jurnal peer-review Indonesia (Indonesia: A Scientific Journal in Education, 2023) mengkaji nilai-nilai pendidikan Islam dalam lagu kebangsaan 'One for Kids' karya Subhi Al-Sheikh; ia menyebutnya sebagai produser dan sutradara 'One for Kids,' dan menyebutkan bahwa perusahaan Australia tersebut meluncurkan saluran animasi untuk anak-anak Muslim pada tahun 2016."
title: "The Values of Islamic Education in Nasyid Songs on the Indonesian Language Edition of One4kids Youtube Channel by Subhi Alshaik"
