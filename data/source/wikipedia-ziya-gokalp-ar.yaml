reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. The article largely translates the Turkish article. Its lead gives his birth year as 1875 and his death as 25 November 1924, against its own infobox and every other source (23 March 1876 – 25 October 1924); those lead dates are not used. A closing 'influence' passage attributes sweeping unbelief to him without any citation; it is not used either. What is used: the infobox dates and Diyarbakır birthplace, the family and schooling narrative shared with the Turkish article, the works list with its (partly posthumous) publication years, and his party, the Committee of Union and Progress. It names no madhhab for him. Read in full on 24 October 2026."
