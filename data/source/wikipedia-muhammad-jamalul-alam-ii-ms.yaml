summary:
  ar: "مقالة ويكيبيديا الملايوية عن السلطان محمد جمال العالم الثاني؛ تُستخدم لوقائع الكيان فقط. تؤرّخ حكمه من 10 أيار 1906 إلى 11 أيلول 1924، وتجعل والده هاشم ووالدته فنغيران أنق سيتي فاطمة، وتذكر مجلس الوصاية الذي حكم حتى 1918 ومدارس الملايو سنة 1911 وقوة الشرطة سنة 1921 وزيارة أمير ويلز في 10 أيار 1922 ووفاته في قصر مجالس في 11 أيلول 1924 ودفنه في الضريح الملكي، ودينه الإسلام إجمالًا."
  en: "Malay Wikipedia article on Sultan Muhammad Jamalul Alam II; used for entity facts only. It dates his reign 10 May 1906 – 11 September 1924, gives his father Hashim and his mother Pengiran Anak Siti Fatimah, the regency council that governed until 1918, the Malay schools of 1911, the police force of 1921, the Prince of Wales’s visit of 10 May 1922, his death at Istana Majalis on 11 September 1924 with burial at the Royal Mausoleum, and his religion as Islam in general."
