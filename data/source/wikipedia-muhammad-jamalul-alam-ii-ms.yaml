summary:
  ar: "مقالة ويكيبيديا الملايوية عن السلطان محمد جمال العالم الثاني؛ تُستخدم لوقائع الكيان فقط. تؤرّخ حكمه من 10 أيار 1906 إلى 11 أيلول 1924، وتجعل والده هاشم ووالدته فنغيران أنق سيتي فاطمة، وتذكر مجلس الوصاية الذي حكم حتى 1918 ومدارس الملايو سنة 1911 وقوة الشرطة سنة 1921 وزيارة أمير ويلز في 10 أيار 1922 ووفاته في قصر مجالس في 11 أيلول 1924 ودفنه في الضريح الملكي، ودينه الإسلام إجمالًا."
  en: "Malay Wikipedia article on Sultan Muhammad Jamalul Alam II; used for entity facts only. It dates his reign 10 May 1906 – 11 September 1924, gives his father Hashim and his mother Pengiran Anak Siti Fatimah, the regency council that governed until 1918, the Malay schools of 1911, the police force of 1921, the Prince of Wales’s visit of 10 May 1922, his death at Istana Majalis on 11 September 1924 with burial at the Royal Mausoleum, and his religion as Islam in general."
  es: "Artículo de Wikipedia en malayo sobre el sultán Muhammad Jamalul Alam II; utilizado únicamente para datos sobre la entidad. Fecha su reinado del 10 de mayo de 1906 al 11 de septiembre de 1924, menciona a su padre Hashim y a su madre Pengiran Anak Siti Fatimah, el consejo de regencia que gobernó hasta 1918, las escuelas malayas de 1911, la fuerza policial de 1921, la visita del Príncipe de Gales el 10 de mayo de 1922, su muerte en Istana Majalis el 11 de septiembre de 1924 con entierro en el Mausoleo Real, y su religión como el Islam en general."
  fr: "Article de Wikipédia en malais sur le sultan Muhammad Jamalul Alam II; utilisé uniquement pour les informations factuelles. Il date son règne du 10 mai 1906 au 11 septembre 1924, mentionne son père Hashim et sa mère Pengiran Anak Siti Fatimah, le conseil de régence qui a gouverné jusqu'en 1918, les écoles malaises de 1911, la police de 1921, la visite du prince de Galles le 10 mai 1922, son décès à l'Istana Majalis le 11 septembre 1924 et son inhumation au mausolée royal, ainsi que sa religion, l'islam."
  ur: "سلطان محمد جمال العالم ثانی پر مالے ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اس کے دور حکومت کی تاریخ 10 مئی 1906 - 11 ستمبر 1924 ہے، اس کے والد ہاشم اور اس کی والدہ پینگیران اناک سیتی فاطمہ، 1918 تک حکومت کرنے والی ریجنسی کونسل، 1911 کے ملائی اسکول، 1921 کی پولیس فورس، 10 ستمبر 21 کو ان کی وفات کے موقع پر پرنس آف ویلز کا دورہ۔ 1924 شاہی مقبرہ میں تدفین کے ساتھ، اور عام طور پر اس کا مذہب اسلام۔"
  tr: "Sultan Muhammad Jamal Al-Alam II hakkındaki Malay Vikipedi makalesi yalnızca varlığın gerçekleri için kullanılmıştır. Saltanatını 10 Mayıs 1906'dan 11 Eylül 1924'e tarihlendirir ve babası Haşim ile annesi Fengiran Fatima şehri olarak belirtilir, 1918'e kadar yöneten Naiplik Konseyi, 1911'de Malay okulları, 1921'de polis teşkilatı, 10 Mayıs 1922'de Galler Prensi'nin ziyareti, 11 Eylül 1924'te Majlis Sarayı'ndaki ölümü, kraliyet türbesine defnedilmesi ve genel İslam dinini belirtir."
  id: "Artikel Wikipedia Melayu tentang Sultan Muhammad Jamal Al-Alam II hanya digunakan untuk fakta entitas tersebut. Artikel ini mencatat masa pemerintahannya dari 10 Mei 1906 hingga 11 September 1924, dan menempatkan ayahnya Hashim serta ibunya Fengiran sebagai kota Fatima, menyebutkan Dewan Kabupaten yang memerintah hingga 1918, sekolah-sekolah Melayu pada 1911, kepolisian pada 1921, kunjungan Pangeran Wales pada 10 Mei 1922, kematiannya di Istana Majlis pada 11 September 1924, pemakamannya di mausoleum kerajaan, dan agamanya secara umum dalam Islam."
