reliability_note: "A book-platform author profile reproducing her publisher biography ⁦(her books are published by عصير الكتب)⁩. Its text agrees with the author biography carried by books-library.com, so the two were treated as one biography family; her current university post is independently confirmed by Al-Qasemi College's own news item. It names her field (tafsir) and institutions but never a legal school for her personally."
