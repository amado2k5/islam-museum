label:
  ar: "«منصة معارف: مؤلفات كفاح أبو هنود»"
  en: "Maaref platform: works of Kifah Abu Hanoud"
  ur: "«معارف پلیٹ فارم: کفاح ابو ہنود کی تصانیف»"
summary:
  ar: «صفحة مؤلفات كفاح أبو هنود في منصة معارف ⁦(رُوجعت في أكتوبر 2026)⁩. المصدر الرئيسي لاسمها الكامل ودراستها في الجامعة الأردنية ودكتوراه التفسير 2010 من الجامعة الإسلامية العالمية في ماليزيا ومناصبها الجامعية وتأسيسها مبادرة مشكاة سنة 2019 وكتبها.»
  en: "The author page for Kifah Abu Hanoud on the Maaref book platform (consulted October 2026). The principal source for her full name, her University of Jordan bachelor's degree, her 2010 tafsir doctorate from the International Islamic University Malaysia, her university posts, her 2019 founding of the Mishkah initiative and her books."
  ur: «معارف پلیٹ فارم پر کفاح ابو ہنود کا مصنف صفحہ ⁦(اکتوبر 2026 میں رجوع کیا گیا)⁩۔»
  es: "Página de la autora Kifah Abu Hanoud en la plataforma de libros Maaref (consultada en octubre de 2026). Fuente principal de su nombre completo, su licenciatura por la Universidad de Jordania, su doctorado en tafsir (exégesis coránica) de la Universidad Islámica Internacional de Malasia (2010), sus cargos universitarios, la fundación de la iniciativa Mishkah en 2019 y sus libros."
  fr: "La page auteur de Kifah Abu Hanoud sur la plateforme Maaref (consultée en octobre 2026). Cette page est la principale source d'information concernant son nom complet, son diplôme de licence de l'Université de Jordanie, son doctorat en tafsir (exégèse islamique) obtenu en 2010 à l'Université islamique internationale de Malaisie, ses postes universitaires, la création de l'initiative Mishkah en 2019 et ses ouvrages."
  tr: "\"Kifah Abu Hanood'un Ma'arif platformundaki eserlerinin sayfası (Ekim 2026'da incelenmiştir). Ana kaynak tam adı, Ürdün Üniversitesi'ndeki eğitimi, Malezya Uluslararası İslam Üniversitesi'nden Tafsir doktorası (2010), üniversite pozisyonları, 2019'da Mishkat Girişimi'nin kuruluşu ve kitaplarıdır.\""
  id: "\"Halaman untuk karya Kifah Abu Hamew di platform Ma'arif (diulas pada Oktober 2026). Sumber utama adalah nama lengkapnya, studinya di Universitas Yordania, PhD dalam Tafsir (2010) dari International Islamic University di Malaysia, posisi universitasnya, pendirian Mishkat Initiative pada 2019, dan buku-bukunya.\""
