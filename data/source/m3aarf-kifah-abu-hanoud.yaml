summary:
  ar: «صفحة مؤلفات كفاح أبو هنود في منصة معارف (رُوجعت في أكتوبر 2026). المصدر الرئيسي لاسمها الكامل ودراستها في الجامعة الأردنية ودكتوراه التفسير 2010 من الجامعة الإسلامية العالمية في ماليزيا ومناصبها الجامعية وتأسيسها مبادرة مشكاة سنة 2019 وكتبها.»
  en: "The author page for Kifah Abu Hanoud on the Maaref book platform (consulted October 2026). The principal source for her full name, her University of Jordan bachelor's degree, her 2010 tafsir doctorate from the International Islamic University Malaysia, her university posts, her 2019 founding of the Mishkah initiative and her books."
  ur: «معارف پلیٹ فارم پر کفاح ابو ہنود کا مصنف صفحہ (اکتوبر 2026 میں رجوع کیا گیا)۔»
