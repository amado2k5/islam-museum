  en: "Edward William Lane's account of Egyptian manners and customs observed in Cairo in 1833-35: the trades of the market streets, the sakkas who carry Nile water to houses, the barber's role in circumcision festivities, and the ceremony by which a boy is admitted into a craft guild."
