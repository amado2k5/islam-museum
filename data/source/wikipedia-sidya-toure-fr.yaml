summary:
  ar: "مقالة ويكيبيديا الفرنسية عن سيديا توري؛ أوفى المقالات، تُستخدم لوقائع الكيان فقط. تذكر ولادته في 15 أغسطس 1945 في ديمبوكرو ووفاته في 25 سبتمبر 2026 في باريس ودفنه في مقبرة ويليامزفيل بساحل العاج، وتروي مسيرته رئيس وزراء وقائد معارضة؛ وتشير إلى أن مدخله في القاموس التاريخي لغينيا يعطي سنة ولادته 1946. لا يذكر نصّها دينه؛ وصندوق معلوماتها يسمّي الإسلام."
  en: "French Wikipedia article on Sidya Touré; the fullest of the articles, used for entity facts only. It gives his birth on 15 August 1945 at Dimbokro, his death on 25 September 2026 at Paris and his burial at the Williamsville cemetery in Côte d'Ivoire, and recounts his career as prime minister and opposition leader; it notes that his entry in the Historical Dictionary of Guinea gives his birth year as 1946. Its text says nothing about his religion; its infobox names Islam."
  es: "Artículo de la Wikipedia en francés sobre Sidya Touré; el más completo de los artículos, utilizado únicamente para datos sobre la persona. Indica su nacimiento el 15 de agosto de 1945 en Dimbokro, su fallecimiento el 25 de septiembre de 2026 en París y su entierro en el cementerio de Williamsville en Costa de Marfil, y relata su trayectoria como primer ministro y líder de la oposición. Señala que su entrada en el Diccionario Histórico de Guinea indica que nació en 1946. El texto no menciona su religión; su ficha informativa la identifica como islamista."
  fr: "Article de Wikipédia en français sur Sidya Touré; l’article le plus complet, utilisé uniquement pour les informations le concernant. Il indique sa naissance le 15 août 1945 à Dimbokro, son décès le 25 septembre 2026 à Paris et son inhumation au cimetière de Williamsville en Côte d’Ivoire. Il retrace également sa carrière de Premier ministre et de chef de l’opposition. Il précise que son entrée dans le Dictionnaire historique de Guinée mentionne l’année 1946 comme année de naissance. Le texte ne dit rien de sa religion; son infobox mentionne l’islam."
  ur: "Sidya Touré پر فرانسیسی ویکیپیڈیا مضمون؛ مضامین کا مکمل، صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 15 اگست 1945 کو ڈمبوکرو میں ان کی پیدائش، 25 ستمبر 2026 کو پیرس میں ان کی موت اور کوٹ ڈی آئیوری کے ولیمز ویل قبرستان میں ان کی تدفین، اور وزیر اعظم اور اپوزیشن لیڈر کے طور پر ان کے کیریئر کا ذکر کرتا ہے۔ یہ نوٹ کرتا ہے کہ گنی کی تاریخی لغت میں اس کا اندراج اس کا سال پیدائش 1946 بتاتا ہے۔ اس کے متن میں اس کے مذہب کے بارے میں کچھ نہیں کہا گیا ہے۔ اس کے انفو باکس کا نام اسلام ہے۔"
