summary:
  ar: "مقالة ويكيبيديا الفرنسية عن سيديا توري؛ أوفى المقالات، تُستخدم لوقائع الكيان فقط. تذكر ولادته في 15 أغسطس 1945 في ديمبوكرو ووفاته في 25 سبتمبر 2026 في باريس ودفنه في مقبرة ويليامزفيل بساحل العاج، وتروي مسيرته رئيس وزراء وقائد معارضة؛ وتشير إلى أن مدخله في القاموس التاريخي لغينيا يعطي سنة ولادته 1946. لا يذكر نصّها دينه؛ وصندوق معلوماتها يسمّي الإسلام."
  en: "French Wikipedia article on Sidya Touré; the fullest of the articles, used for entity facts only. It gives his birth on 15 August 1945 at Dimbokro, his death on 25 September 2026 at Paris and his burial at the Williamsville cemetery in Côte d'Ivoire, and recounts his career as prime minister and opposition leader; it notes that his entry in the Historical Dictionary of Guinea gives his birth year as 1946. Its text says nothing about his religion; its infobox names Islam."
