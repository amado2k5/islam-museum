summary:
  ar: "مقالة ويكيبيديا العربية «أحمد الريسوني (فقيه)»؛ تُستخدم لوقائع الكيان فقط. تثبت اسمه الكامل أحمد بن عبد السلام بن محمد الريسوني وميلاده سنة 1953، وتعليمه بالقصر الكبير والقرويين وجامعة محمد الخامس، وعمله بوزارة العدل والتدريس، وانتخابه رئيسًا للاتحاد العالمي لعلماء المسلمين في 7 نوفمبر 2018، وقائمة مؤلفاته."
  en: "Arabic Wikipedia article 'Ahmed Raissouni (jurist)'; used for entity facts only. It gives his full name as Ahmed ibn Abdelsalam ibn Mohamed Raissouni and his birth in 1953, his schooling at Ksar el-Kebir, al-Qarawiyyin and Mohammed V University, his work at the Ministry of Justice and in teaching, his election as president of the International Union of Muslim Scholars on 7 November 2018, and a list of his works."
