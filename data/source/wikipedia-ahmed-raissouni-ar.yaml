reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md). Read in full on 26 October 2026; the article was fetched by revision id through the MediaWiki API and the returned revid asserted equal to 76667524 before any claim was drawn. The plain title «أحمد الريسوني» is a redirect to this disambiguated article. It gives his birth in 1953 near Ksar el-Kebir, his licence in Sharia from the University of al-Qarawiyyin at Fez (1978), his postgraduate degrees at Mohammed V University (1986, 1989, doctorate 1992), his years at the Ministry of Justice (1973–1978) and teaching usul al-fiqh and maqasid at Mohammed V University and Dar al-Hadith al-Hassania (1986–2006), his presidency of the Islamic Future League in Morocco (1994–1996) and of the Movement of Unity and Reform (1996–2003), his responsible editorship of the daily Attajdid (2000–2004), and his election on 7 November 2018 as president of the International Union of Muslim Scholars, succeeding Yusuf al-Qaradawi. It names no madhhab or creed for him in its text; its categories file him among Moroccan Sunni religious scholars, a category filing, not a text attestation."
