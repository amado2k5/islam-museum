summary:
  ar: "مقالة ويكيبيديا الفارسية «ميرزا ملكم‌خان»؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده سنة 1248 قمرية ⁦(1833م)⁩ في قصبة جلفا بأصفهان ووفاته سنة 1326 قمرية ⁦(1908م)⁩، وأباه ميرزا يعقوب حفّارَ الحجر من أرمن جلفا «الذي مال إلى الإسلام» ومترجم السفارة الروسية، وتدريسه في دار الفنون، وتأسيسه فراموش‌خانه، وصحيفته «قانون»، وسفارته في روما حتى وفاته فيها."
  en: "Persian Wikipedia article 'Mirza Malkam Khan'; used for entity facts only. It gives his birth in 1248 AH (1833 CE) in the town of Julfa at Isfahan and his death in 1326 AH (1908 CE), his father Mirza Ya'qub the stone-cutter, one of the Armenians of Julfa 'who turned to Islam' and translator at the Russian embassy, his teaching at the Dar ol-Fonun, his founding of the Faramushkhaneh, his newspaper Qanun, and his embassy to Rome until his death there."
  es: "Artículo de Wikipedia en persa titulado \"Mirza Malkam Khan\"; utilizado únicamente para datos biográficos. En él se indica su nacimiento en 1248 AH (1833 d. C.) en la ciudad de Julfa, en Isfahán, y su fallecimiento en 1326 AH (1908 d. C.). Menciona a su padre, Mirza Ya'qub, el cantero, uno de los armenios de Julfa que se convirtieron al islam y fue traductor en la embajada rusa. También habla de su labor docente en el Dar ol-Fonun, la fundación del Faramushkhaneh, su periódico Qanun y su embajada a Roma, donde residió hasta su muerte."
  fr: "L'article Wikipédia persan « Mirza Malkam Khan » est utilisé uniquement à des fins descriptives. Il indique sa naissance en 1248 AH (1833 ap. J.-C.) à Djoulfa, près d'Ispahan, et sa mort en 1326 AH (1908 ap. J.-C.). On y trouve également des informations sur son père, Mirza Ya'qub, tailleur de pierre, un Arménien de Djoulfa converti à l'islam et traducteur à l'ambassade de Russie, son enseignement au Dar ol-Fonun, la fondation du Faramushkhaneh, son journal Qanun et son ambassade à Rome jusqu'à sa mort dans cette ville."
