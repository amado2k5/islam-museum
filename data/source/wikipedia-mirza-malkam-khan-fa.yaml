reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It makes no statement of Malkam Khan's own religion: its one religion sentence concerns his father, an Armenian of Julfa 'who turned to Islam' — so the father's Islam, not a Christianity, is what this article attests, and for the son himself the question is left to the English article, Wikidata and the scholarship, which conflict, as the record's faith note sets out."
