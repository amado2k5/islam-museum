summary:
  ar: "مقالة ويكيبيديا الفارسية «ميرزا ملكم‌خان»؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده سنة 1248 قمرية (1833م) في قصبة جلفا بأصفهان ووفاته سنة 1326 قمرية (1908م)، وأباه ميرزا يعقوب حفّارَ الحجر من أرمن جلفا «الذي مال إلى الإسلام» ومترجم السفارة الروسية، وتدريسه في دار الفنون، وتأسيسه فراموش‌خانه، وصحيفته «قانون»، وسفارته في روما حتى وفاته فيها."
  en: "Persian Wikipedia article 'Mirza Malkam Khan'; used for entity facts only. It gives his birth in 1248 AH (1833 CE) in the town of Julfa at Isfahan and his death in 1326 AH (1908 CE), his father Mirza Ya'qub the stone-cutter, one of the Armenians of Julfa 'who turned to Islam' and translator at the Russian embassy, his teaching at the Dar ol-Fonun, his founding of the Faramushkhaneh, his newspaper Qanun, and his embassy to Rome until his death there."
