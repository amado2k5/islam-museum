summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن باي بوريه ⁦(15 فبراير 1840 – 24 أغسطس 1908)⁩، الحاكم السيراليوني والاستراتيجي العسكري ورجل الدين المسلم الذي قاد انتفاضة التمني واللوكو ضد الحكم البريطاني سنة 1898 في شمال سيراليون؛ تروي نشأته في كاسيه قرب بورت لوكو ابنًا لرجل دين مسلم وزعيم لوكو وأم تمنية، وتدريبه في گبندمبو ولقبه كبَالاي، وحروبه في ستينيات القرن التاسع عشر وسبعينياته لإقامة الممارسات الإسلامية الصحيحة، وصدّه السوسو سنة 1882، ورفضه ضريبة الأكواخ وقيادته حرب ضريبة الأكواخ سنة 1898، واستسلامه في 11 نوفمبر 1898 ونفيه إلى ساحل الذهب وعودته سنة 1905 وإعادته زعيمًا على كاسيه ووفاته سنة 1908، وإرثه في سيراليون."
  en: "English Wikipedia article on Bai Bureh (15 February 1840 – 24 August 1908), the Sierra Leonean ruler, military strategist and Muslim cleric who led the Temne and Loko uprising against British rule in 1898 in northern Sierra Leone; it recounts his upbringing at Kasseh near Port Loko as son of a Muslim cleric and Loko chief and a Temne mother, his training at Gbendembu and nickname Kebalai, his wars of the 1860s and 1870s to establish correct Islamic practices, his defeat of the Susu in 1882, his refusal of the hut tax and leadership of the Hut Tax War of 1898, his surrender on 11 November 1898, exile to the Gold Coast, return in 1905, reinstatement as chief of Kasseh, death in 1908, and his legacy in Sierra Leone."
  es: "Artículo de la Wikipedia en inglés sobre Bai Bureh (15 de febrero de 1840 - 24 de agosto de 1908), gobernante de Sierra Leona, estratega militar y clérigo musulmán que lideró el levantamiento de Temne y Loko contra el dominio británico en 1898 en el norte de Sierra Leona; relata su crianza en Kasseh, cerca de Port Loko, como hijo de un clérigo musulmán y jefe de Loko y una madre Temne, su formación en Gbendembu y su apodo Kebalai, sus guerras de las décadas de 1860 y 1870 para establecer prácticas islámicas correctas, su derrota de los Susu en 1882, su negativa al impuesto sobre las chozas y su liderazgo en la Guerra del Impuesto sobre las Chozas de 1898, su rendición el 11 de noviembre de 1898, su exilio a la Costa de Oro, su regreso en 1905, su restitución como jefe de Kasseh, su muerte en 1908 y su legado en Sierra Leona."
  fr: "L'article de Wikipédia en anglais sur Bai Bureh (15 février 1840 – 24 août 1908), souverain sierra-léonais, stratège militaire et religieux musulman qui mena le soulèvement des Temne et des Loko contre la domination britannique en 1898 dans le nord de la Sierra Leone, relate son enfance à Kasseh, près de Port Loko, fils d'un religieux musulman et chef Loko et d'une mère Temne, sa formation à Gbendembu et son surnom de Kebalai, ses guerres des années 1860 et 1870 pour établir des pratiques islamiques correctes, sa victoire sur les Susu en 1882, son refus de la taxe sur les huttes et son rôle de chef de la guerre contre cette taxe en 1898, sa reddition le 11 novembre 1898, son exil sur la Côte-de-l'Or, son retour en 1905, sa réintégration comme chef de Kasseh, sa mort en 1908 et son héritage en Sierra Leone."
  ur: "بائی بورہ ⁦(15 فروری 1840 - 24 اگست 1908)⁩ پر انگریزی ویکیپیڈیا کا مضمون، سیرا لیون کے حکمران، فوجی حکمت عملی اور مسلمان عالم جنہوں نے 1898 میں شمالی سیرا لیون میں برطانوی حکومت کے خلاف ٹیمنے اور لوکو کی بغاوت کی قیادت کی۔ اس میں پورٹ لوکو کے قریب کیسیہ میں ایک مسلمان عالم اور لوکو کے سربراہ اور ٹیمنے کی ماں کے بیٹے کے طور پر اس کی پرورش، گبینڈیمبو اور عرفی نام کبلائی میں اس کی تربیت، صحیح اسلامی طریقوں کو قائم کرنے کے لیے اس کی 1860 اور 1870 کی جنگیں، 1882 میں سوسو کی شکست، اس کی ٹیکس سے انکار اور اس کی قیادت سے انکار کا ذکر ہے۔ 11 نومبر 1898 کو اس کا ہتھیار ڈالنا، گولڈ کوسٹ میں جلاوطنی، 1905 میں واپسی، کسے کے سربراہ کے طور پر بحال، 1908 میں موت، اور سیرا لیون میں اس کی میراث۔"
  tr: "1898'de kuzey Sierra Leone'de İngiliz yönetimine karşı Tamni ve Loko ayaklanmasına liderlik eden Sierra Leone hükümdarı, askeri stratejist ve Müslüman din adamı Bay Burre hakkında İngilizce Wikipedia makalesi; Port Loko yakınlarındaki Kasse'de büyürken, Müslüman bir din adamı, Loko lideri ve Tamni'nin annesinin oğlu, Gbandembo'da eğitimi ve lakabı Kabalai, 1860'lar ve 1770'lerde uygun İslami uygulamaları kurmak için verdiği savaşlar, 1882'de Soso'yu püskürtmesi, kulübe vergisini reddetmesi ve kulübe vergisi savaşına liderlik etmesi anlatılır 1898'de teslimiyeti, 11 Kasım 1898'de Gold Coast'a sürgün, 1905'te dönüşü, Casse lideri olarak dönüşü, 1908'de ölümü ve Sierra Leone'deki mirası."
  id: "Artikel Wikipedia bahasa Inggris tentang Bay Burre (15 Februari 1840 – 24 Agustus 1908), penguasa Sierra Leone, ahli strategi militer, dan ulama Muslim yang memimpin pemberontakan Tamni dan Loko melawan pemerintahan Inggris di Sierra Leone utara pada tahun 1898; artikel ini menceritakan masa kecilnya di Kasse dekat Port Loko, putra seorang ulama Muslim, pemimpin Loko, dan ibu Tamni, pelatihannya di Gbandembo dan julukannya Kabalai, perang-perangnya pada tahun 1860-an dan 1770-an untuk menetapkan praktik Islam yang benar, penolakannya terhadap Soso pada tahun 1882, penolakannya terhadap pajak pondok, dan kepemimpinannya dalam perang pajak pondok Pada tahun 1898, penyerahan dirinya pada 11 November 1898, pengasingan ke Gold Coast, kembalinya pada tahun 1905, kembali sebagai pemimpin Casse, kematiannya pada tahun 1908, dan warisannya di Sierra Leone."
