summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن باي بوريه (15 فبراير 1840 – 24 أغسطس 1908)، الحاكم السيراليوني والاستراتيجي العسكري ورجل الدين المسلم الذي قاد انتفاضة التمني واللوكو ضد الحكم البريطاني سنة 1898 في شمال سيراليون؛ تروي نشأته في كاسيه قرب بورت لوكو ابنًا لرجل دين مسلم وزعيم لوكو وأم تمنية، وتدريبه في گبندمبو ولقبه كبَالاي، وحروبه في ستينيات القرن التاسع عشر وسبعينياته لإقامة الممارسات الإسلامية الصحيحة، وصدّه السوسو سنة 1882، ورفضه ضريبة الأكواخ وقيادته حرب ضريبة الأكواخ سنة 1898، واستسلامه في 11 نوفمبر 1898 ونفيه إلى ساحل الذهب وعودته سنة 1905 وإعادته زعيمًا على كاسيه ووفاته سنة 1908، وإرثه في سيراليون."
  en: "English Wikipedia article on Bai Bureh (15 February 1840 – 24 August 1908), the Sierra Leonean ruler, military strategist and Muslim cleric who led the Temne and Loko uprising against British rule in 1898 in northern Sierra Leone; it recounts his upbringing at Kasseh near Port Loko as son of a Muslim cleric and Loko chief and a Temne mother, his training at Gbendembu and nickname Kebalai, his wars of the 1860s and 1870s to establish correct Islamic practices, his defeat of the Susu in 1882, his refusal of the hut tax and leadership of the Hut Tax War of 1898, his surrender on 11 November 1898, exile to the Gold Coast, return in 1905, reinstatement as chief of Kasseh, death in 1908, and his legacy in Sierra Leone."
