summary:
  ar: "كتاب الدكتور محمد غلاب، أستاذ الفلسفة بجامعة الأزهر، ضمن السلسلة العلمية لمجمع البحوث الإسلامية. يعرض آراء مستشرقين أوروبيين في الإسلام والنبي والقرآن، ويناقش بعضها، ويفرّق بين الكتابات القديمة التي وصفها بالتحامل والكتابات الحديثة التي وصفها بالجدية. يتضمن مناقشة لأطروحة كازانوفا في تبديل القرآن ولرأي رينان في الإسلام والعلم؛ 126 صفحة، مع تقديم لمحمد رجب البيومي وإشراف الأمين العام للمجمع."
  en: "Muhammad Ghallab, professor of philosophy at al-Azhar, in the Scientific Series of the Islamic Research Academy. He reviews what European writers said about Islam, the Prophet and the Qur'an, separates older polemic from later scholarship, and discusses Casanova's thesis on alteration of the Qur'an and Renan's view of Islam and science. 126 pages, with a tribute by Muhammad Rajab al-Bayumi and supervised by the Academy's Secretary-General."
