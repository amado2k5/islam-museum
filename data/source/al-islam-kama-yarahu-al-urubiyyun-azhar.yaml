label:
  ar: الإسلام كما يراه الأوروبيون — محمد غلاب
  en: "Islam as Seen by the Europeans — Muhammad Ghallab"
summary:
  ar: "كتاب الدكتور محمد غلاب، أستاذ الفلسفة بجامعة الأزهر، ضمن السلسلة العلمية لمجمع البحوث الإسلامية. يعرض آراء مستشرقين أوروبيين في الإسلام والنبي والقرآن، ويناقش بعضها، ويفرّق بين الكتابات القديمة التي وصفها بالتحامل والكتابات الحديثة التي وصفها بالجدية. يتضمن مناقشة لأطروحة كازانوفا في تبديل القرآن ولرأي رينان في الإسلام والعلم؛ 126 صفحة، مع تقديم لمحمد رجب البيومي وإشراف الأمين العام للمجمع."
  en: "Muhammad Ghallab, professor of philosophy at al-Azhar, in the Scientific Series of the Islamic Research Academy. He reviews what European writers said about Islam, the Prophet and the Qur'an, separates older polemic from later scholarship, and discusses Casanova's thesis on alteration of the Qur'an and Renan's view of Islam and science. 126 pages, with a tribute by Muhammad Rajab al-Bayumi and supervised by the Academy's Secretary-General."
  es: "Muhammad Ghallab, profesor de filosofía en Al-Azhar, publica este artículo en la Serie Científica de la Academia de Investigación Islámica. En él, repasa las afirmaciones de autores europeos sobre el islam, el Profeta y el Corán, distingue entre la polémica antigua y la erudición posterior, y analiza la tesis de Casanova sobre la alteración del Corán y la visión de Renan sobre el islam y la ciencia. El libro consta de 126 páginas, incluye un homenaje de Muhammad Rajab al-Bayumi y fue supervisado por el Secretario General de la Academia."
  fr: "Dans la collection « Sciences » de l’Académie de recherche islamique, Muhammad Ghallab, professeur de philosophie à Al-Azhar, passe en revue les écrits des auteurs européens sur l’islam, le Prophète et le Coran. Il distingue les polémiques anciennes des travaux plus récents et examine la thèse de Casanova sur l’altération du Coran ainsi que la conception de Renan sur l’islam et la science. Cet ouvrage de 126 pages, préfacé par Muhammad Rajab al-Bayumi et publié sous la direction du secrétaire général de l’Académie, comprend un hommage."
  ur: "اسلامک ریسرچ اکیڈمی کی سائنسی سیریز میں الازہر میں فلسفہ کے پروفیسر محمد ذلاب۔ وہ اس بات کا جائزہ لیتا ہے کہ یورپی مصنفین نے اسلام، پیغمبر اور قرآن کے بارے میں کیا کہا، پرانے مباحث کو بعد کے اسکالرشپ سے الگ کرتا ہے، اور قرآن کی تبدیلی اور اسلام اور سائنس کے بارے میں رینان کے نظریہ پر کاسانووا کے مقالے پر بحث کرتا ہے۔ 126 صفحات، محمد رجب البیومی کے خراج تحسین کے ساتھ اور اکیڈمی کے سیکرٹری جنرل کی نگرانی میں۔"
  tr: "El-Ezher Üniversitesi Felsefe Profesörü Dr. Mohamed Ghallab'ın kitabı, İslami Araştırmalar Akademisi'nin bilimsel serisinin bir parçasıdır. Avrupalı oryantalistlerin İslam, Peygamber ve Kur'an hakkındaki görüşlerini sunar, bazılarını tartışır ve önyargılı olarak tanımladığı eski yazılar ile ciddi olarak nitelendirdiği modern yazılar arasında ayrım yapar. Kitapta, Casanova'nın Kur'an'ın yerine geçme konusundaki tezi ve Renan'ın İslam ve bilim hakkındaki görüşü tartışılır; 126 sayfa, Muhammed Recep El-Bayoumi tarafından bir önsözüyle ve Akademi Genel Sekreteri tarafından denetlenmektedir."
  id: "Buku karya Dr. Mohamed Ghallab, Profesor Filsafat di Universitas Al-Azhar, merupakan bagian dari seri ilmiah Akademi Riset Islam. Buku ini menyajikan pandangan orientalis Eropa tentang Islam, Nabi, dan Al-Qur'an, membahas beberapa di antaranya, serta membedakan antara tulisan kuno yang ia sebut bias dan tulisan modern yang ia gambarkan sebagai serius. Buku ini mencakup pembahasan tesis Casanova tentang penggantian Al-Qur'an dan pandangan Renan tentang Islam dan ilmu pengetahuan; 126 halaman, dengan pengantar oleh Muhammad Rajab Al-Bayoumi dan diawasi oleh Sekretaris Jenderal Akademi."
