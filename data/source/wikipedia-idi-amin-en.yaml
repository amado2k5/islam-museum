summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عيدي أمين؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في كامبالا بحسب تقليد الأسرة في 30 مايو 1928 (بينما تعطي السجلات البريطانية سنة 1925)، ونشأته في أسرة مسلمة وحفظه القرآن صبيا، وانقلاب 1971 وحكمه حتى 1979، ومنفاه في ليبيا ثم السعودية ووفاته في جدة سنة 2003. لا تحمل المقالة حقلا للدين ولا تسمي له مدرسة."
  en: "English Wikipedia article on Idi Amin; used for entity facts only. It gives his birth at Kampala by family tradition on 30 May 1928 (British records give the year 1925), his upbringing in a Muslim family and boyhood memorisation of the Quran, the 1971 coup and his rule to 1979, his exile in Libya and then Saudi Arabia, and his death at Jeddah in 2003. The article has no religion field and names no school for him."
