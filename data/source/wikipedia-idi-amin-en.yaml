summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عيدي أمين؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في كامبالا بحسب تقليد الأسرة في 30 مايو 1928 ⁦(بينما تعطي السجلات البريطانية سنة 1925)⁩، ونشأته في أسرة مسلمة وحفظه القرآن صبيا، وانقلاب 1971 وحكمه حتى 1979، ومنفاه في ليبيا ثم السعودية ووفاته في جدة سنة 2003. لا تحمل المقالة حقلا للدين ولا تسمي له مدرسة."
  en: "English Wikipedia article on Idi Amin; used for entity facts only. It gives his birth at Kampala by family tradition on 30 May 1928 (British records give the year 1925), his upbringing in a Muslim family and boyhood memorisation of the Quran, the 1971 coup and his rule to 1979, his exile in Libya and then Saudi Arabia, and his death at Jeddah in 2003. The article has no religion field and names no school for him."
  es: "Artículo de la Wikipedia en inglés sobre Idi Amin; utilizado únicamente para datos sobre la persona. Indica su nacimiento en Kampala, según la tradición familiar, el 30 de mayo de 1928 (los registros británicos indican el año 1925), su crianza en una familia musulmana y la memorización del Corán durante su infancia, el golpe de Estado de 1971 y su gobierno hasta 1979, su exilio en Libia y posteriormente en Arabia Saudita, y su muerte en Yeda en 2003. El artículo no incluye información sobre su religión ni menciona ninguna escuela a la que haya asistido."
  fr: "Article de Wikipédia en anglais sur Idi Amin; utilisé uniquement pour les informations biographiques. Il indique sa naissance à Kampala, selon la tradition familiale, le 30 mai 1928 (les archives britanniques mentionnent l’année 1925), son éducation dans une famille musulmane et la mémorisation du Coran dès son enfance, le coup d’État de 1971 et son règne jusqu’en 1979, son exil en Libye puis en Arabie saoudite, et sa mort à Djeddah en 2003. L’article ne comporte pas de champ « religion » et ne mentionne aucun établissement scolaire."
  ur: "ایدی امین پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی پیدائش خاندانی روایت کے مطابق 30 مئی 1928 کو کمپالا میں ہوئی ⁦(برطانوی ریکارڈ 1925 کا سال بتاتا ہے)⁩، اس کی پرورش ایک مسلم خاندان میں ہوئی اور بچپن میں قرآن کا حفظ، 1971 کی بغاوت اور اس کی حکمرانی 1979 تک، لیبیا اور پھر سعودی عرب میں اس کی جلاوطنی، اور جدہ میں اس کی موت کے بارے میں اس کا کوئی مذہب اور مضمون 20 میں کوئی مضمون نہیں ہے۔"
  tr: "Eidi Amin hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Aile geleneğine göre 30 Mayıs 1928'de Kampala'da doğduğu (İngiliz kayıtları 1925'i verirken), Müslüman bir ailede yetiştirilme şeklini, çocukken Kur'an'ı ezberlemesini, 1971 darbesini ve 1979'a kadar yönetimini, Libya'ya sürgün edilmesini ve ardından Suudi Arabistan'a sürgününü ve 2003'te Cidde'de vefatını anlatır. Makalede bir din alanından bahsedilmez ve okul olarak da adlandırılmaz."
  id: "Artikel Wikipedia bahasa Inggris tentang Eidi Amin; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya di Kampala menurut tradisi keluarga pada 30 Mei 1928 (sementara catatan Inggris menyebutkan 1925), masa kecilnya dalam keluarga Muslim, hafalan Al-Qur'an saat masih anak-anak, kudeta 1971 dan pemerintahannya hingga 1979, pengasingannya di Libya dan kemudian Arab Saudi, serta kematiannya di Jeddah pada 2003. Artikel ini tidak menyebutkan bidang agama maupun menyebutnya sekolah."
