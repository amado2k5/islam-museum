reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision, fetched by its revision id. It states that his father, born a Catholic Christian, converted to Islam in 1910; that Amin was born on the Muslim holiday of Eid al-Adha and memorised the Quran as a boy at Semuto and Bombo; and that he carried the title Al-Hajji. It nowhere names a school or branch of Islam for Amin himself."
