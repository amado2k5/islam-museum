summary:
  ar: "مدخل «اجتهاد» في موسوعة TDV الإسلامية ⁦(المجلد 21، إسطنبول 2000، ص 432–445)⁩ بقلم يونس أبايدين، يتناول فكرة الاجتهاد وتطورها، وشروط المجتهد، والمجتهد المطلق والمقيد، وطبقات المجتهدين، وحكم الاجتهاد، وقضية إغلاق باب الاجتهاد، والعلاقة بين الاجتهاد والإفتاء والقضاء."
  en: "The TDV İslâm Ansiklopedisi entry 'İCTİHAD' (vol. 21, Istanbul 2000, pp. 432–445) by H. Yunus Apaydın. It covers the idea of ijtihad and its development, the conditions for a mujtahid, absolute and restricted mujtahids, the tiers of mujtahids, the legal status of ijtihad, the question of the closing of the gate, and the relation of ijtihad to fatwa and judgement."
  es: "La entrada «İCTİHAD» de la TDV İslâm Ansiklopedisi (vol. 21, Estambul 2000, págs. 432-445), de H. Yunus Apaydın, abarca la idea del ijtihad y su desarrollo, las condiciones para ser un mujtahid, los mujtahids absolutos y restringidos, los niveles de mujtahids, el estatus legal del ijtihad, la cuestión del cierre de la puerta y la relación del ijtihad con la fatwa y el juicio."
  fr: "L'article « İCTİHAD » de H. Yunus Apaydın dans la TDV İslâm Ansiklopedisi (vol. 21, Istanbul 2000, pp. 432–445) traite de la notion d'ijtihad et de son évolution, des conditions requises pour être mujtahid, des mujtahids absolus et restreints, des différents niveaux de mujtahids, du statut juridique de l'ijtihad, de la question de la fermeture de la porte et du lien entre l'ijtihad, la fatwa et le jugement."
  ur: "TDV İslâm Ansiklopedisi entry 'İCTİHAD' ⁦(جلد 21، استنبول 2000، صفحہ 432–445)⁩ از ایچ یونس اپیڈین۔ اس میں اجتہاد کے تصور اور اس کی نشوونما، مجتہد، مطلق اور محدود مجتہد کے لیے شرائط، مجتہد کے درجات، اجتہاد کی شرعی حیثیت، دروازے کے بند ہونے کا سوال، اور اجتہاد کا فتویٰ اور فیصلہ سے تعلق کا احاطہ کیا گیا ہے۔"
  tr: "TDV İslami Ansiklopedisi'ndeki \"İctihad\" maddesi (21. cilt, İstanbul 2000, s. 432–445) Yunus Abaydin'in incelendiği bölüm, ijtihadın kavramı ve gelişimi, müjtahid koşulları, mutlak ve sınırlı müjtahid, müctahid sınıfları, ijtihad üzerindeki karar, ijtihadın kapısının kapatılması meselesi ve ijtihad, fetva ile yargı arasındaki ilişkiyi ele almaktadır."
  id: "Entri \"Ijtihad\" dalam Ensiklopedia Islam TDV (Volume 21, Istanbul 2000, hlm. 432–445) oleh Yunus Abaydin, membahas konsep dan perkembangan ijtihad, kondisi mujtahid, mujtahid mutlak dan terbatas, kelas-kelas mujtahid, putusan tentang ijtihad, isu penutupan pintu ijtihad, dan hubungan antara ijtihad, fatwa, dan peradilan."
