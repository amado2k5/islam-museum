reliability_note: "Read on 1 November 2026 in the web edition, printed pages 432–445 (the entry's own line). Read in full: the sections on the relation of ijtihad to fatwa and judgement, the mujtahid tiers (absolute and restricted, the Hanafi and the Shafi'i and Hanbali scales), the legal status of ijtihad, the closing-of-the-gate question, and the modern calls for renewed ijtihad. Read in part: the sections on the sources and tools of the mujtahid and on the difference of the mujtahids (the first sentences of each). Not read: the bibliography, cited by name only where the entry's text names the work."
