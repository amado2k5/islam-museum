summary:
  ar: "مدخل «اجتهاد» في موسوعة TDV الإسلامية (المجلد 21، إسطنبول 2000، ص 432–445) بقلم يونس أبايدين، يتناول فكرة الاجتهاد وتطورها، وشروط المجتهد، والمجتهد المطلق والمقيد، وطبقات المجتهدين، وحكم الاجتهاد، وقضية إغلاق باب الاجتهاد، والعلاقة بين الاجتهاد والإفتاء والقضاء."
  en: "The TDV İslâm Ansiklopedisi entry 'İCTİHAD' (vol. 21, Istanbul 2000, pp. 432–445) by H. Yunus Apaydın. It covers the idea of ijtihad and its development, the conditions for a mujtahid, absolute and restricted mujtahids, the tiers of mujtahids, the legal status of ijtihad, the question of the closing of the gate, and the relation of ijtihad to fatwa and judgement."
