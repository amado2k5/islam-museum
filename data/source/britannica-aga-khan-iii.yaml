summary:
  ar: "مادة في موسوعة بريطانيكا عن آغا خان الثالث ⁦(وُلد في 2 نوفمبر 1877 في كراتشي، وتوفي في 11 يوليو 1957 في فيرسوا بسويسرا)⁩؛ تذكر أنه خلف والده إماما للطائفة النزارية الإسماعيلية سنة 1885، وقاد وفد المسلمين إلى نائب الملك سنة 1906، ورأس الرابطة الإسلامية لعموم الهند في سنواتها الأولى، ومثّل الهند في عصبة الأمم ورأس جمعيتها سنة 1937."
  en: "Encyclopaedia Britannica entry on Aga Khan III (born 2 November 1877 at Karachi, died 11 July 1957 at Versoix, Switzerland); it states that he succeeded his father as imam of the Nizari Ismaili sect in 1885, headed the Muslim deputation to the Viceroy in 1906, served as president of the All-India Muslim League in its early years, represented India at the League of Nations and was appointed president of the League in 1937."
  es: "Entrada de la Enciclopedia Británica sobre Aga Khan III (nacido el 2 de noviembre de 1877 en Karachi, fallecido el 11 de julio de 1957 en Versoix, Suiza); en ella se afirma que sucedió a su padre como imán de la secta ismaelita nizarí en 1885, encabezó la delegación musulmana ante el virrey en 1906, fue presidente de la Liga Musulmana de la India en sus primeros años, representó a la India en la Sociedad de Naciones y fue nombrado presidente de la Liga en 1937."
  fr: "L'article de l'Encyclopædia Britannica sur Aga Khan III (né le 2 novembre 1877 à Karachi, décédé le 11 juillet 1957 à Versoix, en Suisse) indique qu'il a succédé à son père comme imam de la secte ismaélienne Nizari en 1885, a dirigé la délégation musulmane auprès du vice-roi en 1906, a été président de la Ligue musulmane panindienne à ses débuts, a représenté l'Inde à la Société des Nations et a été nommé président de la Ligue en 1937."
  ur: "آغا خان III پر انسائیکلوپیڈیا برٹانیکا کا اندراج ⁦(پیدائش 2 نومبر 1877 کراچی، انتقال 11 جولائی 1957 کو ورسوکس، سوئٹزرلینڈ میں)⁩؛ اس میں کہا گیا ہے کہ وہ 1885 میں نظری اسماعیلی فرقے کے امام کے طور پر اپنے والد کی جانشین ہوئے، 1906 میں وائسرائے کے لیے مسلم وفد کی سربراہی کی، اس کے ابتدائی سالوں میں آل انڈیا مسلم لیگ کے صدر کے طور پر خدمات انجام دیں، لیگ آف نیشنز میں ہندوستان کی نمائندگی کی اور 1937 میں لیگ کا صدر مقرر ہوا۔"
