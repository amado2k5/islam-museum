summary:
  ar: "مادة في موسوعة بريطانيكا عن آغا خان الثالث (وُلد في 2 نوفمبر 1877 في كراتشي، وتوفي في 11 يوليو 1957 في فيرسوا بسويسرا)؛ تذكر أنه خلف والده إماما للطائفة النزارية الإسماعيلية سنة 1885، وقاد وفد المسلمين إلى نائب الملك سنة 1906، ورأس الرابطة الإسلامية لعموم الهند في سنواتها الأولى، ومثّل الهند في عصبة الأمم ورأس جمعيتها سنة 1937."
  en: "Encyclopaedia Britannica entry on Aga Khan III (born 2 November 1877 at Karachi, died 11 July 1957 at Versoix, Switzerland); it states that he succeeded his father as imam of the Nizari Ismaili sect in 1885, headed the Muslim deputation to the Viceroy in 1906, served as president of the All-India Muslim League in its early years, represented India at the League of Nations and was appointed president of the League in 1937."
