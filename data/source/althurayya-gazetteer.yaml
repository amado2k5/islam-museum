reliability_note: "A scholarly gazetteer of places in the Islamic world of the ninth and tenth centuries CE, georeferenced from Georgette Cornu's Atlas du monde arabo-islamique à l'époque classique: IXe-Xe siècles (Leiden: Brill, 1983) and matched to the Arabic geographical literature. Licence: DATA-LICENSE.md in the project repository states that the project's original datasets, 'such as curated place records, route records, coordinates, identifiers, transliterations, and project-created metadata', are Creative Commons Attribution 4.0 (CC BY 4.0), and that source-derived material, third-party data and software are not automatically covered; the code is Apache-2.0 (repository README and DATA-LICENSE.md, read 12 Nov 2026). The recommended attribution is 'al-Ṯurayyā Gazetteer Project, https://github.com/althurayya/althurayya.github.io, licensed under CC BY 4.0'; the museum's {cite:althurayya-gazetteer <file-stem>} with that credit is the attribution. Anchor: the place file in the repository's places/ folder, named by toponym and coordinate code and repeated in the record as cornu_URI (for example ABADHA_526E311N_S, the file places/ABADHA_526E311N_S.geojson). This is a repository path, not an authority identifier, so a citation also records the Arabic toponym and the date it was read. Harvest channel: the public repository only (raw.githubusercontent.com, single files, one request at a time with a pause); the project's own web domain did not answer on 12 Nov 2026 and is not used. Limits the museum honours: the cornuData block comes from a copyrighted printed atlas and the matches to Shamela titles come from other works, so the museum takes place identity, Arabic name, region and type, restated in its own words, and treats coordinates as the project's georeferencing of the atlas, approximate, never overriding GeoNames or iDAI.gazetteer where those hold the place; no source-derived text is copied. The project calls itself a working version (v.1.0), the last push read was 22 Sep 2026, and a record may be superseded, so a citation names the file and the reading date. Posture: open for the project's original data, with attribution; facts-only in practice, since the museum republishes only facts. Pilot scope: ten place records. Registration records the anchor decision: the file stem is the anchor. Tier 2. Assessment: web-sources lane, 12 Nov 2026; registered on the founder's approval of four pilot sources, 12 Nov 2026."
