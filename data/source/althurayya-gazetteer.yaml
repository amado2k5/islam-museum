summary:
  ar: "مشروع جغرافي رقمي بدأ في جامعة تفتس ويتولاه اليوم فريق في جامعة لايبزيغ بإشراف ماكسيم رومانوف. يضم أكثر من ألفي موضع من العالم الإسلامي في القرنين الثالث والرابع الهجريين، لكل موضع ملف جيو-جسون باسمه العربي ونقحرته وإقليمه ونوعه وإحداثياته وقرائن من كتب البلدان. بيانات المشروع الأصلية منشورة برخصة المشاع الإبداعي «نسبة المصنف ٤٫٠»، وما استُخلص من مصادر أخرى مستثنى منها."
  en: "A digital gazetteer begun at Tufts University and now run by a team at Leipzig University under Maxim Romanov. It holds more than two thousand places of the Islamic world of the ninth and tenth centuries CE, each as a GeoJSON file with its Arabic name, transliteration, region, type and coordinates, and matches in works of geography. The project's original data is published under a Creative Commons Attribution 4.0 licence; material derived from other sources is excluded from that grant."
  ur: "ایک ڈیجیٹل جغرافیائی اشاریہ جو ٹفٹس یونیورسٹی میں شروع ہوا اور اب لائپزگ یونیورسٹی کی ٹیم چلاتی ہے، جس کی نگرانی ماکسم رومانوف کرتے ہیں۔ اس میں نویں اور دسویں صدی عیسوی کی اسلامی دنیا کے دو ہزار سے زیادہ مقامات ہیں۔ ہر مقام ایک جیو جے سن فائل ہے جس میں عربی نام، رومن حروف میں نقل، علاقہ، قسم اور نقاط ہیں، اور جغرافیہ کی کتابوں میں اس کے حوالے۔ منصوبے کا اپنا اصل ڈیٹا کری ایٹو کامنز انتساب ۴٫۰ اجازت نامے کے تحت شائع ہے، اور دوسرے مآخذ سے اخذ کردہ مواد اس سے مستثنیٰ ہے۔"
