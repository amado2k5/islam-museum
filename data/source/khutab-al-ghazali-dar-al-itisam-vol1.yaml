label:
  ar: "خطب الشيخ محمد الغزالي في شؤون الدين والحياة — إعداد قطب عبد الحميد قطب، مراجعة محمد عاشور، المجلد الأول، دار الاعتصام، القاهرة ⁦(رقم الإيداع 1988/2267)⁩"
  en: "Khutab al-Shaykh Muhammad al-Ghazali fi Shu'un al-Din wa-al-Hayat — compiled by Qutb 'Abd al-Hamid Qutb, revised by Muhammad 'Ashur, vol. 1, Dar al-I'tisam, Cairo (legal deposit no. 1988/2267)"
summary:
  ar: "المجلد الأول من خطب الشيخ محمد الغزالي، فرّغها من الأشرطة المسجلة قطب عبد الحميد قطب وراجعها محمد عاشور؛ فيه تصدير عبد الصبور شاهين، ومقدمة المعد ⁦(رمضان 1407هـ/مايو 1987م)⁩، و«الشيخ محمد الغزالي بقلمه»، وتوجيهاته في «الخطبة الناجحة»، ثم خطب الجمعة بجامع عمرو بن العاص بالقاهرة مؤرخة، أولها في 23/2/1972."
  en: "Volume 1 of Shaykh Muhammad al-Ghazali's sermons, transcribed from recordings by Qutb 'Abd al-Hamid Qutb and revised by Muhammad 'Ashur. It has a foreword by 'Abd al-Sabur Shahin, the compiler's preface (Ramadan 1407 AH/May 1987), 'Shaykh Muhammad al-Ghazali in his own words', his guidance on 'the successful sermon', then dated Friday sermons at the Mosque of 'Amr ibn al-'As in Cairo, the first on 23/2/1972."
  es: "Volumen 1 de los sermones del Shaykh Muhammad al-Ghazali, transcritos de grabaciones de Qutb 'Abd al-Hamid Qutb y revisados por Muhammad 'Ashur. Incluye un prólogo de 'Abd al-Sabur Shahin, el prefacio del compilador (Ramadán 1407 AH/mayo de 1987), 'El Shaykh Muhammad al-Ghazali en sus propias palabras', su guía sobre 'el sermón exitoso' y sermones de los viernes, entonces fechados, pronunciados en la Mezquita de 'Amr ibn al-'As en El Cairo, el primero el 23/2/1972."
  fr: "Premier volume des sermons du cheikh Muhammad al-Ghazali, transcrits à partir d'enregistrements de Qutb 'Abd al-Hamid Qutb et révisés par Muhammad 'Ashur. Il comprend une préface d'Abd al-Sabur Shahin, la préface du compilateur (Ramadan 1407 AH/mai 1987), « Le cheikh Muhammad al-Ghazali s'exprime de sa propre bouche », ses conseils sur « le sermon réussi », ainsi que les sermons du vendredi prononcés à la mosquée d'Amr ibn al-'As au Caire, le premier datant du 23 février 1972."
  ur: "شیخ محمد الغزالی کے خطبات کی جلد 1، قطب عبد الحامد قطب کی ریکارڈنگ سے نقل اور محمد عاشور کے ذریعے نظر ثانی شدہ۔ اس کا پیش لفظ 'عبدالصبور شاہین'، مرتب کا دیباچہ ⁦(رمضان 1407ھ/مئی 1987)⁩، 'شیخ محمد الغزالی اپنے الفاظ میں'، 'کامیاب خطبہ' کے بارے میں ان کی رہنمائی، پھر جامع مسجد عمرو بن العاص میں جمعہ کے خطبات۔ 23/2/1972۔"
  tr: "Şeyh Muhammed el-Gazali'nin vaazlarının ilk cildi, Qutb Abdul Hamid Qutb'un kayıtlı kayıtlarından tamamlanmış ve Muhammed Aşur tarafından gözden geçirilmiştir; bu cilt, Abd al-Sabour Shaheen'in girişini, derleyicinin girişini (Ramazan 1407 Hicri / Mayıs 1987 M.S.), 'Şeyh Muhammed el-Gazali'yi kaleminde' ve rehberliğini içeren 'Başarılı Vaaz' ile ardından 23/2/1972 tarihli Kahire'deki Amr ibn al-As-Camii'nde Cuma vaazı içerir."
  id: "Volume pertama khotbah Sheikh Muhammad al-Ghazali, diselesaikan dari rekaman Qutb Abdul Hamid Qutb, yang ditinjau oleh Muhammad Ashour; mencakup pengantar oleh Abd al-Sabour Shaheen, pengantar penyusun (Ramadan 1407 H / Mei 1987 M), 'Sheikh Muhammad al-Ghazali dalam penanya,' dan bimbingannya dalam 'Khotbah Sukses,' kemudian khotbah Jumat di Masjid Amr ibn al-As di Kairo, bertanggal 23/2/1972."
