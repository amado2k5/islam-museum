summary:
  ar: "المجلد الأول من خطب الشيخ محمد الغزالي، فرّغها من الأشرطة المسجلة قطب عبد الحميد قطب وراجعها محمد عاشور؛ فيه تصدير عبد الصبور شاهين، ومقدمة المعد ⁦(رمضان 1407هـ/مايو 1987م)⁩، و«الشيخ محمد الغزالي بقلمه»، وتوجيهاته في «الخطبة الناجحة»، ثم خطب الجمعة بجامع عمرو بن العاص بالقاهرة مؤرخة، أولها في 23/2/1972."
  en: "Volume 1 of Shaykh Muhammad al-Ghazali's sermons, transcribed from recordings by Qutb 'Abd al-Hamid Qutb and revised by Muhammad 'Ashur. It has a foreword by 'Abd al-Sabur Shahin, the compiler's preface (Ramadan 1407 AH/May 1987), 'Shaykh Muhammad al-Ghazali in his own words', his guidance on 'the successful sermon', then dated Friday sermons at the Mosque of 'Amr ibn al-'As in Cairo, the first on 23/2/1972."
