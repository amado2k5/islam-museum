summary:
  ar: "نسخة ممسوحة من تفسير ابن كثير بطبعة تصفها صفحة عنوانها بأنها مقابلة على أوثق النسخ الخطية والمطبوعة، محققة الأحاديث والآثار، مخرجة القراءات؛ في هوامشها أحكام المحققين على الأحاديث وأرقام الصحيحين، وهي التي يقتبس منها هذا السجل أحكام التصحيح والتضعيف منسوبة إلى المحققين لا إلى ابن كثير."
  en: "A scanned copy of Ibn Kathir's commentary in an edition whose title page describes it as collated on the most reliable manuscripts and printings, with the hadith and reports verified and the readings traced. Its footnotes carry the editors' gradings and the numbers in the two Sahihs; where this museum cites a grading from it, the grading is the editors', not Ibn Kathir's."
  ur: "ابن کثیر کی تفسیر کی ایک سکین شدہ طباعت جس کے صفحۂ عنوان کے مطابق اسے معتبر ترین قلمی اور مطبوعہ نسخوں سے ملایا گیا، احادیث و آثار کی تخریج اور قراءات کی تخریج کی گئی ہے؛ حواشی میں محققین کے احکام اور صحیحین کے نمبر ہیں۔ جہاں ان کا حوالہ دیا جائے وہ حکم محققین کا ہے، ابن کثیر کا نہیں۔"
  es: "Una copia escaneada del comentario de Ibn Kathir en una edición cuya portada la describe como una recopilación de los manuscritos e impresiones más fiables, con los hadices e informes verificados y las lecturas trazadas. Sus notas a pie de página incluyen las calificaciones de los editores y los números en los dos Sahihs; cuando este museo cita una calificación, se trata de la de los editores, no de la de Ibn Kathir."
  fr: "Une copie numérisée du commentaire d'Ibn Kathir, dans une édition dont la page de titre précise qu'elle a été compilée à partir des manuscrits et imprimés les plus fiables, avec vérification des hadiths et des récits et reconstitution des lectures. Ses notes de bas de page indiquent la classification des éditeurs et les numéros des deux recueils authentiques (Sahihs); lorsque ce musée cite une classification, il s'agit de celle des éditeurs, et non de celle d'Ibn Kathir."
  tr: "İbn Kathir'in Tafsir'inin taranmış bir kopyası, başlığı en güvenilir el yazısı ve basılı kopyalarla karşılaştırma olarak tanımlanan, hadisleri ve gelenekleri doğrulayan ve okumaları çıkaran bir sayfa ile tanımlanmıştır; kenar boşluklarında, bu kaydın düzeltme ve zayıflatma kararlarını türettiği iki sahihin sayıları yer almaktadır; bu kayıt, doğrulayıcılara atfedilir, İbn Kathir'e değil."
  id: "Salinan hasil scan Tafsir Ibn Kathir dalam edisi yang digambarkan oleh halaman dengan judulnya sebagai perbandingan dengan salinan tulisan tangan dan cetak yang paling dapat diandalkan, memverifikasi hadis dan tradisi, serta mengekstrak bacaan; di pinggirnya, terdapat putusan para verifikasi hadis dan nomor dua Sahih, dari mana catatan ini mengambil keputusan koreksi dan pelemahan, yang dikaitkan dengan para verifikasi, bukan Ibn Kathir."
reliability_note: "Harvest item tafsir/tafsir-ibn-kathir/0012994 (5,688 scanned pages, Apple Vision OCR). The publisher, city and year are not legible in the title-page OCR; cite by sura and the printed page number of the sura (for example Surat al-Kahf pp. 707-716). Distinct from source/tafsir-ibn-kathir (Dar al-Andalus) and source/tafsir-ibn-kathir-alexandria-024188 (Dar al-Fikr). The editors' footnotes are modern and carry their own judgments."
