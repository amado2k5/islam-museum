summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن المدني الكلاوي ⁦(1860 – يوليو 1918)⁩، رجل الدولة المغربي الذي أسس نفوذ أسرة الكلاوي، وكان الصدر الأعظم في عهد عبد الحفيظ قبل إقالته سنة 1911؛ تلقبه بالفقيه، ولا تنص على مدرسته الدينية."
  en: "The English Wikipedia article on Madani El Glaoui (1860 – July 1918), the Moroccan statesman who established the Glaoui family's power and served as Grand Vizier under Abd al-Hafid before his dismissal in 1911; it gives his nickname 'the Faqih' and names no religious school for him."
  es: "El artículo de la Wikipedia en inglés sobre Madani El Glaoui (1860 – julio de 1918), el estadista marroquí que estableció el poder de la familia Glaoui y se desempeñó como Gran Visir bajo Abd al-Hafid antes de su destitución en 1911; le da el apodo de 'el Faqih' y no menciona ninguna escuela religiosa para él."
  fr: "L'article de Wikipédia en anglais sur Madani El Glaoui (1860 – juillet 1918), l'homme d'État marocain qui a établi le pouvoir de la famille Glaoui et a servi comme grand vizir sous Abd al-Hafid avant sa destitution en 1911; il donne son surnom « le Faqih » et ne cite aucune école religieuse à son sujet."
