summary:
  ar: "الموقع الرسمي للدكتورة فريدة زمرد (faridazomorod.org)، وفيه سيرتها الذاتية بصيغة PDF: أستاذة التفسير وعلوم القرآن بمؤسسة دار الحديث الحسنية، جامعة القرويين بالرباط، منذ 2001، تخصصها الدقيق الدراسات المصطلحية للقرآن الكريم، مع قائمة مؤلفاتها ومقالاتها ومهامها العلمية."
  en: "The official website of Dr Farida Zomorod (faridazomorod.org), hosting her CV as a PDF: professor of tafsir and Qur'anic sciences at Dar al-Hadith al-Hassaniyya, University of al-Qarawiyyin, Rabat, since 2001, her precise specialisation being the terminological studies of the Qur'an, with lists of her books, articles and academic roles."
  es: "El sitio web oficial de la Dra. Farida Zomorod (faridazomorod.org), que aloja su CV en formato PDF: profesora de tafsir y ciencias coránicas en Dar al-Hadith al-Hassaniyya, Universidad de al-Qarawiyyin, Rabat, desde 2001, su especialización precisa son los estudios terminológicos del Corán, con listas de sus libros, artículos y cargos académicos."
  fr: "Le site officiel du Dr Farida Zomorod (faridazomorod.org), hébergeant son CV au format PDF: professeure de tafsir et de sciences coraniques à Dar al-Hadith al-Hassaniyya, Université al-Qarawiyyin, Rabat, depuis 2001, sa spécialisation précise étant les études terminologiques du Coran, avec des listes de ses livres, articles et rôles académiques."
  ur: "ڈاکٹر فریدہ زومرود کی آفیشل ویب سائٹ (faridazomorod.org)، ان کی سی وی کو بطور PDF میزبانی کر رہی ہے: دارالحدیث الحسنیہ، جامعہ القرویین، رباط میں تفسیر اور قرآنی علوم کی پروفیسر، 2001 سے، ان کی قطعی تخصص، اصطلاحی مطالعہ، قرآنی کتابوں کی فہرست اور ان کے مضامین کی فہرست۔"
