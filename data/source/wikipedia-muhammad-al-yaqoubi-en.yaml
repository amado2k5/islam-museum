summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد اليعقوبي؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في دمشق سنة 1963 وتتلمذه على والده، وطريقته الشاذلية واتباعه المذهبين المالكي والحنفي، ومنصب مفتي السويد سنة 1999، وخروجه من سوريا سنة 2011 إلى المغرب، ومبادرته «المعرفة المقدسة» وكتابه «دحض داعش»."
  en: "English Wikipedia article on Muhammad al-Yaqoubi; used for entity facts only. It records his birth in Damascus in 1963 and his training under his father, his Shadhili tariqa and his following of the Maliki and Hanafi schools, his post as mufti of Sweden in 1999, his departure from Syria in 2011 to Morocco, his Sacred Knowledge initiative and his book Refuting ISIS."
  es: "Artículo de la Wikipedia en inglés sobre Muhammad al-Yaqoubi; utilizado únicamente para datos sobre la persona. En él se recogen su nacimiento en Damasco en 1963 y su formación con su padre, su tariqa Shadhili y su adhesión a las escuelas Maliki y Hanafi, su nombramiento como muftí de Suecia en 1999, su partida de Siria a Marruecos en 2011, su iniciativa Conocimiento Sagrado y su libro Refutando al ISIS."
  fr: "Article de Wikipédia en anglais sur Muhammad al-Yaqoubi; utilisé uniquement pour les informations sur l’entité. Il relate sa naissance à Damas en 1963 et sa formation auprès de son père, sa confrérie Shadhili et son appartenance aux écoles malikite et hanafite, son poste de mufti de Suède en 1999, son départ de Syrie pour le Maroc en 2011, son initiative « Savoir sacré » et son livre « Réfuter Daech »."
  ur: "محمد الیعقوبی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1963 میں دمشق میں اس کی پیدائش اور اس کے والد کے تحت اس کی تربیت، اس کی شادھیلی طریقت اور مالکی اور حنفی مکاتب کی پیروی، 1999 میں سویڈن کے مفتی کے طور پر ان کا عہدہ، 2011 میں شام سے مراکش روانگی، اس کے مقدس علمی اقدام اور اس کی کتاب Refuting ISIS کو درج کیا گیا ہے۔"
  tr: "Muhammed el-Ya'kubi hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1963'te Şam'da doğmasından, babasının yanında aldığı rehberlikten, Şadhili tarikatından, Maliki ve Hanefi mezhebinden takipçilerinden, 1999'da İsveç Müftüsü pozisyonundan, 2011'de Suriye'den Fas'a ayrılışından, \"Kutsal Bilgi\" girişiminden ve \"IŞİD'i Reddetmek\" adlı kitabından bahseder."
  id: "Artikel Wikipedia bahasa Inggris tentang Muhammad al-Ya'qubi; hanya digunakan untuk fakta entitas. Artikel tersebut menyebutkan kelahirannya di Damaskus pada tahun 1963, bimbingan ayahnya, ordo Shadhili-nya, para pengikutnya dari aliran Maliki dan Hanafi, posisi Mufti Swedia pada tahun 1999, kepergiannya dari Suriah pada tahun 2011 ke Maroko, inisiatifnya \"Sacred Knowledge,\" dan bukunya \"Refuting ISIS.\""
