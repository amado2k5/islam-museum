reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full and checked against the recorded revision; the revision id and the article's Wikidata identifier (Q6932828) were re-verified through the Wikipedia API in this run. Its infobox gives his denomination as Sunni, his jurisprudence as Maliki and Hanafi, his tariqa as Shadhili and his creed as Ash'ari; its text describes his training in Sufism under his father until he qualified as a murshid of the Shadhili order, his ijazahs, his post as mufti of Sweden in 1999, his exile from Syria in 2011 to Morocco, and his YouTube channel under his own name, active since 2019. The jurisprudence and denomination values rest on this one source family and are therefore not recorded as faith values in his person record."
