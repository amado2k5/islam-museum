  ar: "مقالة ويكيبيديا الإنجليزية عن محمد اليعقوبي؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في دمشق سنة 1963 وتتلمذه على والده، وطريقته الشاذلية واتباعه المذهبين المالكي والحنفي، ومنصب مفتي السويد سنة 1999، وخروجه من سوريا سنة 2011 إلى المغرب، ومبادرته «المعرفة المقدسة» وكتابه «دحض داعش»."
  en: "English Wikipedia article on Muhammad al-Yaqoubi; used for entity facts only. It records his birth in Damascus in 1963 and his training under his father, his Shadhili tariqa and his following of the Maliki and Hanafi schools, his post as mufti of Sweden in 1999, his departure from Syria in 2011 to Morocco, his Sacred Knowledge initiative and his book Refuting ISIS."
