summary:
  ar: "الجزء الرابع من «موسوعة الحضارة الإسلامية» للدكتور أحمد شلبي، أستاذ التاريخ الإسلامي والحضارة الإسلامية بكلية دار العلوم بجامعة القاهرة، الطبعة العاشرة سنة 1993، مكتبة النهضة المصرية، القاهرة. في أبواب: الإسلام والمسلمون في مواجهة المشكلة الاقتصادية، ومبادئ الإسلام الاقتصادية، والإسلام والقضايا الاقتصادية الحديثة ⁦(الربا والبنوك وشهادات الاستثمار والتأمين والبورصة)⁩، ومن تاريخ الاقتصاد في الإسلام ⁦(بيت المال وموارده)⁩، والنظم الاقتصادية الأخرى."
  en: "Volume 4 of Mawsu'at al-Hadara al-Islamiyya by Dr Ahmad Shalabi, professor of Islamic history and civilisation at Dar al-Ulum, Cairo University, 10th edition, 1993, Maktabat al-Nahda al-Misriyya, Cairo. Its parts: Islam and Muslims facing the economic problem; Islam's economic principles; Islam and modern economic questions (riba, banks, investment certificates, insurance, the stock exchange); the history of economics in Islam (the treasury and its revenues); and other economic systems."
