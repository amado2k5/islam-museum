summary:
  ar: "الجزء 2 من «أعلام النساء في عالمي العرب والإسلام» لعمر رضا كحالة، طبعة مزيدة وفيها مستدرك، مؤسسة الرسالة ببيروت، الطبعة الخامسة 1984م؛ تراجم مرتبة على الحروف ⁦(ز–ض)⁩، تُذيَّل كل ترجمة بمصادرها."
  en: "Volume 2 of Umar Rida Kahhala's A'lam al-Nisa' fi Alamay al-Arab wa-al-Islam, enlarged edition with a supplement, Mu'assasat al-Risala, Beirut, 5th ed. 1984: alphabetical biographies (za–dad), each followed by its sources."
  es: "Volumen 2 de A'lam al-Nisa' fi Alamay al-Arab wa-al-Islam de Umar Rida Kahhala, edición ampliada con un suplemento, Mu'assasat al-Risala, Beirut, 5.ª ed. 1984: biografías alfabéticas (za–dad), cada una seguida de sus fuentes."
  fr: "Volume 2 de A'lam al-Nisa' fi Alamay al-Arab wa-al-Islam d'Umar Rida Kahhala, édition augmentée avec un supplément, Mu'assasat al-Risala, Beyrouth, 5e éd. 1984: biographies alphabétiques (za–dad), chacune suivie de ses sources."
  ur: "عمررضا کحلہ کی جلد 2 اعلام النساء فی العلمی العرب و الاسلام، ضمیمہ کے ساتھ توسیع شدہ ایڈیشن، معاصص الرسالہ، بیروت، 5 واں ایڈیشن۔ 1984: حروف تہجی کی سوانح حیات (za-dad)، ہر ایک کے بعد اس کے ماخذ ہیں۔"
  tr: "Omar Reda Kahhala'nın \"Araplar ve İslam Dünyalarında Önemli Kadınlar\" adlı eserinin 2. bölümü, ek baskı ve ek, Beyrut'taki Al-Risala Vakfı, beşinci baskı 1984; biyografiler harfler altında (Z–D) düzenlenmiş, her biyografi kaynaklarıyla birlikte eklenmiştir."
  id: "Bagian 2 dari \"Perempuan Terkenal di Dunia Arab dan Islam\" oleh Omar Reda Kahhala, edisi tambahan dengan suplemen, Yayasan Al-Risala di Beirut, edisi kelima 1984; biografi disusun berdasarkan huruf (Z–D), dengan setiap biografi dilampirkan sumbernya."
