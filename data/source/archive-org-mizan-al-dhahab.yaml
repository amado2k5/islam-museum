summary:
  ar: "الصفحة «Mizan al-Dhahab fi Sinaat Shir al-Arab» — Internet Archive؛ لخّصها ملخص بحثي قدّمه المؤسس إلى المتحف في 21 نوفمبر 2026؛ لم يفتح المتحف الصفحة، ووافق المؤسس على استعمال الملخص دون إعادة تحقق. استُعملت في: كتاب «Mizan al-Dhahab fi Sinaat Shir al-Arab» ومؤلفه وتاريخه."
  en: "The page «Mizan al-Dhahab fi Sinaat Shir al-Arab» — Internet Archive; summarised in a research file supplied to the museum by the founder on 21 November 2026; the museum did not open the page, and the founder approved using the summary without re-verification. Used for: the book «Mizan al-Dhahab fi Sinaat Shir al-Arab»: its author and date."
  ur: "صفحہ «Mizan al-Dhahab fi Sinaat Shir al-Arab» — Internet Archive؛ اسے ایک تحقیقی فائل نے خلاصہ کیا جو بانی نے 21 نومبر 2026 کو میوزیم کو دی؛ میوزیم نے صفحہ نہیں کھولا اور بانی نے دوبارہ جانچ کے بغیر خلاصہ استعمال کرنے کی منظوری دی۔ استعمال: کتاب «Mizan al-Dhahab fi Sinaat Shir al-Arab»، اس کے مصنف اور تاریخ کا بیان۔"
  fr: "La page «Mizan al-Dhahab fi Sinaat Shir al-Arab» — Internet Archive ; résumée dans un fichier de recherche remis au musée par le fondateur le 21 novembre 2026 ; le musée n'a pas ouvert la page, et le fondateur a approuvé l'usage de la synthèse sans nouvelle vérification. Utilisée pour : le livre « Mizan al-Dhahab fi Sinaat Shir al-Arab » : son auteur et sa date."
  es: "La página «Mizan al-Dhahab fi Sinaat Shir al-Arab» — Internet Archive; resumida en un archivo de investigación entregado al museo por el fundador el 21 de noviembre de 2026; el museo no abrió la página, y el fundador aprobó usar el resumen sin volver a verificar. Usada para: el libro «Mizan al-Dhahab fi Sinaat Shir al-Arab»: su autor y su fecha."
