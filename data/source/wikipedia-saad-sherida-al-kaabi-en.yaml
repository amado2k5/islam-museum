  ar: "مقالة ويكيبيديا الإنجليزية عن سعد شريدة الكعبي، وزير الدولة لشؤون الطاقة في قطر والرئيس والمدير التنفيذي لقطر للطاقة؛ تذكر دراسته هندسة البترول في جامعة ولاية بنسلفانيا (تخرج 1991)، وانضمامه إلى قطر للطاقة سنة 1986، وتعيينه وزيرًا سنة 2018، ودوره في محادثات إمدادات الغاز مع أوروبا سنة 2022. لا تذكر سنة مولده."
  en: "English Wikipedia article on Saad Sherida al-Kaabi, Qatar's Minister of State for Energy Affairs and the president and CEO of QatarEnergy; it gives his petroleum engineering studies at Pennsylvania State University (graduated 1991), his joining QatarEnergy in 1986, his 2018 ministerial appointment, and his role in the 2022 European gas-supply talks. It gives no birth year."
