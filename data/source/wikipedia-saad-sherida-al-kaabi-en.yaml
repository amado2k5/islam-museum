summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سعد شريدة الكعبي، وزير الدولة لشؤون الطاقة في قطر والرئيس والمدير التنفيذي لقطر للطاقة؛ تذكر دراسته هندسة البترول في جامعة ولاية بنسلفانيا ⁦(تخرج 1991)⁩، وانضمامه إلى قطر للطاقة سنة 1986، وتعيينه وزيرًا سنة 2018، ودوره في محادثات إمدادات الغاز مع أوروبا سنة 2022. لا تذكر سنة مولده."
  en: "English Wikipedia article on Saad Sherida al-Kaabi, Qatar's Minister of State for Energy Affairs and the president and CEO of QatarEnergy; it gives his petroleum engineering studies at Pennsylvania State University (graduated 1991), his joining QatarEnergy in 1986, his 2018 ministerial appointment, and his role in the 2022 European gas-supply talks. It gives no birth year."
  es: "Artículo de Wikipedia en inglés sobre Saad Sherida al-Kaabi, Ministro de Estado de Asuntos Energéticos de Qatar y presidente y director ejecutivo de QatarEnergy. En él se detallan sus estudios de ingeniería petrolera en la Universidad Estatal de Pensilvania (graduado en 1991), su incorporación a QatarEnergy en 1986, su nombramiento ministerial en 2018 y su papel en las negociaciones europeas sobre el suministro de gas de 2022. No se indica el año de nacimiento."
  fr: "L'article de Wikipédia en anglais consacré à Saad Sherida al-Kaabi, ministre d'État qatari aux Affaires énergétiques et président-directeur général de QatarEnergy, mentionne ses études d'ingénieur pétrolier à l'Université d'État de Pennsylvanie (diplômé en 1991), son entrée chez QatarEnergy en 1986, sa nomination ministérielle en 2018 et son rôle dans les négociations européennes sur l'approvisionnement en gaz de 2022. L'article ne précise pas son année de naissance."
  ur: "قطر کے وزیر مملکت برائے توانائی امور اور قطر توانائی کے صدر اور سی ای او سعد شیریدہ الکعبی پر انگریزی ویکیپیڈیا کا مضمون؛ یہ پنسلوانیا اسٹیٹ یونیورسٹی میں ان کی پیٹرولیم انجینئرنگ کی تعلیم ⁦(گریجویٹ 1991)⁩، 1986 میں قطر انرجی میں شمولیت، 2018 میں ان کی وزارتی تقرری، اور 2022 کے یورپی گیس سپلائی مذاکرات میں ان کے کردار کے بارے میں بتاتا ہے۔ یہ کوئی سال پیدائش نہیں دیتا۔"
  tr: "Katar Enerji İşleri Devlet Bakanı ve Katar Enerji Başkanı ve CEO'su Saad Shreida Al Kaabi hakkında İngilizce Wikipedia makalesi; Pennsylvania Eyalet Üniversitesi'nde petrol mühendisliği eğitimi aldığı (1991 mezunu), 1986'da Katar Enerji'ye katılan, 2018'de bakan olarak atanması ve 2022'de Avrupa ile gaz tedarik görüşmelerindeki rolü belirtilmektedir. Doğum yılı belirtilmemiştir."
  id: "Artikel Wikipedia bahasa Inggris tentang Saad Shreida Al Kaabi, Menteri Negara Qatar untuk Urusan Energi dan Presiden serta CEO Qatar Energy; menyebutkan studinya di bidang teknik perminyakan di Pennsylvania State University (lulus 1991), bergabung dengan Qatar Energy pada 1986, pengangkatannya sebagai menteri pada 2018, dan perannya dalam pembicaraan pasokan gas dengan Eropa pada 2022. Tahun kelahirannya tidak disebutkan."
