summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أولوباطلي حسن؛ تعطي مولده نحو 1428 في أولوباط ووفاته في 29 مايو 1453 على أسوار القسطنطينية ودفنه في حي إسكندر باشا بالفاتح، وكل وقائعها تقريبًا مسندة إلى دراسة حاقان يلماز 2019 عن قبره المكتشف وهويته التاريخية."
  en: "English Wikipedia article on Ulubatli Hasan; it gives his birth about 1428 at Ulubat, his death on 29 May 1453 on the walls of Constantinople and his burial in the Iskenderpasa quarter of Fatih, resting almost entirely on Hakan Yilmaz's 2019 study of his discovered grave and historical identity."
  es: "Artículo de la Wikipedia en inglés sobre Ulubatli Hasan; indica que nació alrededor de 1428 en Ulubat, murió el 29 de mayo de 1453 en las murallas de Constantinopla y fue enterrado en el barrio de Iskenderpasa de Fatih, basándose casi por completo en el estudio de Hakan Yilmaz de 2019 sobre su tumba descubierta y su identidad histórica."
  fr: "L'article de Wikipédia en anglais sur Ulubatli Hasan indique sa naissance vers 1428 à Ulubat, sa mort le 29 mai 1453 sur les murs de Constantinople et son enterrement dans le quartier d'Iskenderpasa à Fatih, reposant presque entièrement sur l'étude de Hakan Yilmaz en 2019 sur sa tombe découverte et son identité historique."
  ur: "الوبتلی حسن پر انگریزی ویکیپیڈیا مضمون؛ یہ تقریباً 1428 میں الوبات میں اس کی پیدائش، قسطنطنیہ کی دیواروں پر 29 مئی 1453 کو اس کی موت اور فتح کے اسکندر پاسا کوارٹر میں اس کی تدفین، تقریباً مکمل طور پر ہاکان یلماز کے 2019 میں اس کی دریافت شدہ قبر اور تاریخی شناخت کے مطالعہ پر منحصر ہے۔"
  tr: "Ulubatlı Hasan hakkında İngilizce Wikipedia makalesi; onun yaklaşık 1428 yılında Ulubat'ta doğduğunu, 29 Mayıs 1453'te İstanbul surlarında öldüğünü ve Fatih'teki İskender Paşa bölgesinde defnedilmesini anlatmaktadır. Olayların neredeyse tamamı, Hakan Yılmaz'ın 2019'da keşfettiği mezarı ve tarihsel kimliği üzerine yaptığı çalışmaya atfedilir."
  id: "Artikel Wikipedia bahasa Inggris tentang Ulubatli Hasan; menceritakan kelahirannya sekitar tahun 1428 di Ulubat, kematiannya pada 29 Mei 1453 di tembok Konstantinopel, dan pemakamannya di distrik Iskander Pasha di Fatih. Hampir semua peristiwa di sini dikaitkan dengan studi Hakan Yılmaz tahun 2019 tentang makam yang ditemukannya dan identitas historisnya."
