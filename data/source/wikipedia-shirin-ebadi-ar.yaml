reliability_note: "Pointer for entity facts only. Corroborates her birth in Hamadan on 21 June 1947, the family's move to Tehran when she was one, the Tehran law degree (1969), the doctorate with honours from the University of Tehran (1971), the court presidency from 1975, the law licence obtained in 1992, the Forouhar, Arian Golshani, Leila and Zahra Kazemi cases, the 2002 anti-child-abuse draft law, and the 2003 Nobel Peace Prize and the Iranian reactions to it. Its infobox gives her religion as مسلمة شيعية (a Shia Muslim) without naming a branch; the same infobox's ethnicity field is unreliable and is not used. The article's lead also dates a bachelor's degree to 1971, which conflicts with its own education section (doctorate, 1971) and is not used. Opened on 24 Oct 2026."
