summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن بينغو وا موثاريكا؛ تُستخدم لوقائع الكيان فقط. تروي ولادته باسم برايتسون وبستر رايسون ثوم في 24 فبراير 1934 في كاموتو بمنطقة ثيولو، وتعليمه في دلهي والولايات المتحدة، وعمله في الخدمة المدنية والبنك الدولي ولجنة الأمم المتحدة الاقتصادية لأفريقيا والسوق المشتركة لشرق أفريقيا وجنوبها، وخلافته المختارة لباكيلي مولوزي وفوزه بانتخابات 2004، وتأسيسه الحزب الديمقراطي التقدمي، وبرنامج إعانة الأسمدة والأمن الغذائي، ورئاسته الاتحاد الأفريقي، وولايته الثانية المضطربة واحتجاجات 2011، ووفاته في ليلونغوي في 5 أبريل 2012. ويذكر قسم حياته الشخصية أنه وُلد وعُمّد مشيخيًا ثم تحوّل لاحقًا إلى الكاثوليكية الرومانية، مستشهدًا بملف لهيئة الإذاعة البريطانية."
  en: "English Wikipedia article on Bingu wa Mutharika; used for entity facts only. It recounts his birth as Brightson Webster Ryson Thom on 24 February 1934 at Kamoto in Thyolo District, his Delhi and United States education, his civil-service, World Bank, UNECA and COMESA career, his handpicked succession of Bakili Muluzi and 2004 election victory, the founding of the DPP, the fertiliser-subsidy and food-security programme, his African Union chairmanship, the troubled second term and the 2011 protests, and his death in Lilongwe on 5 April 2012. Its personal-life section states he was born and baptised Presbyterian and later converted to Roman Catholicism, citing a BBC profile."
  es: "Artículo de la Wikipedia en inglés sobre Bingu wa Mutharika; utilizado únicamente para datos sobre la entidad. Relata su nacimiento como Brightson Webster Ryson Thom el 24 de febrero de 1934 en Kamoto, en el distrito de Thyolo, su educación en Delhi y Estados Unidos, su carrera en la administración pública, el Banco Mundial, la UNECA y la COMESA, su sucesión de Bakili Muluzi, elegida a dedo, y su victoria en las elecciones de 2004, la fundación del DPP, el programa de subsidios a los fertilizantes y seguridad alimentaria, su presidencia de la Unión Africana, su problemático segundo mandato y las protestas de 2011, y su muerte en Lilongwe el 5 de abril de 2012. En la sección sobre su vida personal se indica que nació y fue bautizado presbiteriano y que posteriormente se convirtió al catolicismo romano, citando un perfil de la BBC."
  fr: "Article de Wikipédia en anglais sur Bingu wa Mutharika; utilisé uniquement pour les informations le concernant. Il relate sa naissance sous le nom de Brightson Webster Ryson Thom le 24 février 1934 à Kamoto, dans le district de Thyolo, ses études à Delhi et aux États-Unis, sa carrière dans la fonction publique, à la Banque mondiale, à la CEA et au COMESA, sa désignation comme successeur de Bakili Muluzi et sa victoire aux élections de 2004, la fondation du DPP, le programme de subventions aux engrais et de sécurité alimentaire, sa présidence de l'Union africaine, son second mandat tumultueux et les manifestations de 2011, ainsi que son décès à Lilongwe le 5 avril 2012. La section consacrée à sa vie personnelle indique qu'il est né et a été baptisé presbytérien, puis s'est converti au catholicisme, citant un portrait de la BBC."
