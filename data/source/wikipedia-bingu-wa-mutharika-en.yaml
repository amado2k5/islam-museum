summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن بينغو وا موثاريكا؛ تُستخدم لوقائع الكيان فقط. تروي ولادته باسم برايتسون وبستر رايسون ثوم في 24 فبراير 1934 في كاموتو بمنطقة ثيولو، وتعليمه في دلهي والولايات المتحدة، وعمله في الخدمة المدنية والبنك الدولي ولجنة الأمم المتحدة الاقتصادية لأفريقيا والسوق المشتركة لشرق أفريقيا وجنوبها، وخلافته المختارة لباكيلي مولوزي وفوزه بانتخابات 2004، وتأسيسه الحزب الديمقراطي التقدمي، وبرنامج إعانة الأسمدة والأمن الغذائي، ورئاسته الاتحاد الأفريقي، وولايته الثانية المضطربة واحتجاجات 2011، ووفاته في ليلونغوي في 5 أبريل 2012. ويذكر قسم حياته الشخصية أنه وُلد وعُمّد مشيخيًا ثم تحوّل لاحقًا إلى الكاثوليكية الرومانية، مستشهدًا بملف لهيئة الإذاعة البريطانية."
  en: "English Wikipedia article on Bingu wa Mutharika; used for entity facts only. It recounts his birth as Brightson Webster Ryson Thom on 24 February 1934 at Kamoto in Thyolo District, his Delhi and United States education, his civil-service, World Bank, UNECA and COMESA career, his handpicked succession of Bakili Muluzi and 2004 election victory, the founding of the DPP, the fertiliser-subsidy and food-security programme, his African Union chairmanship, the troubled second term and the 2011 protests, and his death in Lilongwe on 5 April 2012. Its personal-life section states he was born and baptised Presbyterian and later converted to Roman Catholicism, citing a BBC profile."
