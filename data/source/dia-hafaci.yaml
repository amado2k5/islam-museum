reliability_note: "Read in the museum's session on 20 November 2026. It gives his birth in 977 (1569-70) at Siryaqus near Cairo and his teacher, his maternal uncle Abu Bakr al-Shanawani; describes Shifa' al-ghalil fima fi kalam al-Arab min al-dakhil as an alphabetical dictionary of Arabic words of foreign origin printed at Cairo (1282, and two printings in 1325); and his Sharh Durrat al-ghawwas, a critical commentary on al-Hariri's work on the mistakes of the common people, written for Murad IV (Istanbul 1299). Used for entity facts only."
