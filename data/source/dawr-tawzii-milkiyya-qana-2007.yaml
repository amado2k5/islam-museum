label:
  ar: "الطاهر قانة، الدور التوزيعي للملكية في الاقتصاد الإسلامي: دراسة مقارنة ⁦(مذكرة ماجستير، جامعة الحاج لخضر باتنة، 2006–2007)⁩"
  en: "al-Tahir Qana, al-Dawr al-Tawzi'i li-l-Milkiyya fi al-Iqtisad al-Islami: Dirasa Muqarana (MA dissertation, University of El Hadj Lakhdar, Batna, 2006-2007)"
  ur: "الطاہر قانہ، الدور التوزیعی للملکیہ فی الاقتصاد الاسلامی: دراسہ مقارنہ ⁦(ایم اے مقالہ، جامعہ الحاج لخضر باتنہ، 2006–2007)⁩"
summary:
  ar: "مذكرة مقدمة لنيل درجة الماجستير في الاقتصاد الإسلامي، قسم الشريعة، كلية العلوم الاجتماعية والعلوم الإسلامية، جامعة الحاج لخضر باتنة ⁦(الجزائر)⁩، السنة الجامعية 1427–1428هـ / 2006–2007م، إعداد الطالب الطاهر قانة، إشراف الدكتور جمال لعمارة؛ نوقشت يوم الأربعاء 27 فبراير 2008م. في أربعة فصول: الملكية والتوزيع في الاقتصادين الرأسمالي والاشتراكي، والملكية في الاقتصاد الإسلامي، والتوزيع في الاقتصاد الإسلامي، ودور الملكية في التوزيع."
  en: "A dissertation for the MA in Islamic economics, Department of Shari'a, Faculty of Social Sciences and Islamic Sciences, University of El Hadj Lakhdar, Batna (Algeria), academic year 1427-1428 AH / 2006-2007, by the student al-Tahir Qana, supervised by Dr Jamal Laamara, defended on Wednesday 27 February 2008. Four chapters: property and distribution in the capitalist and socialist economies, property in the Islamic economy, distribution in the Islamic economy, and the role of property in distribution."
  es: "Tesis de maestría en economía islámica, Departamento de Sharia, Facultad de Ciencias Sociales y Ciencias Islámicas, Universidad de El Hadj Lakhdar, Batna (Argelia), año académico 1427-1428 AH / 2006-2007, del estudiante al-Tahir Qana, bajo la supervisión del Dr. Jamal Laamara, defendida el miércoles 27 de febrero de 2008. Cuatro capítulos: propiedad y distribución en las economías capitalista y socialista, propiedad en la economía islámica, distribución en la economía islámica y el papel de la propiedad en la distribución."
  fr: "Mémoire de maîtrise en économie islamique, Département de charia, Faculté des sciences sociales et islamiques, Université El Hadj Lakhdar, Batna (Algérie), année universitaire 1427-1428 AH / 2006-2007, par l'étudiant al-Tahir Qana, sous la direction du Dr Jamal Laamara, soutenu le mercredi 27 février 2008. Quatre chapitres: propriété et distribution dans les économies capitaliste et socialiste, la propriété dans l'économie islamique, la distribution dans l'économie islamique et le rôle de la propriété dans la distribution."
  ur: "اسلامی معاشیات میں ایم اے کے لیے ایک مقالہ، شعبہ شریعہ، فیکلٹی آف سوشل سائنسز اینڈ اسلامک سائنسز، جامعہ الحج لخدر، بطنہ ⁦(الجزائر)⁩، تعلیمی سال 1427-1428 ہجری / 2006-2007، طالب علم الطاہر قنا، زیر نگرانی، بدھ 02 فروری 2018 کو، ڈاکٹر جمال لافان۔ ابواب: سرمایہ دارانہ اور سوشلسٹ معیشتوں میں جائیداد اور تقسیم، اسلامی معیشت میں جائیداد، اسلامی معیشت میں تقسیم، اور تقسیم میں جائیداد کا کردار۔"
