  ar: "الطاهر قانة، الدور التوزيعي للملكية في الاقتصاد الإسلامي: دراسة مقارنة ⁦(مذكرة ماجستير، جامعة الحاج لخضر باتنة، 2006–2007)⁩"
  en: "al-Tahir Qana, al-Dawr al-Tawzi'i li-l-Milkiyya fi al-Iqtisad al-Islami: Dirasa Muqarana (MA dissertation, University of El Hadj Lakhdar, Batna, 2006-2007)"
  ur: "الطاہر قانہ، الدور التوزیعی للملکیہ فی الاقتصاد الاسلامی: دراسہ مقارنہ ⁦(ایم اے مقالہ، جامعہ الحاج لخضر باتنہ، 2006–2007)⁩"
summary:
  ar: "مذكرة مقدمة لنيل درجة الماجستير في الاقتصاد الإسلامي، قسم الشريعة، كلية العلوم الاجتماعية والعلوم الإسلامية، جامعة الحاج لخضر باتنة ⁦(الجزائر)⁩، السنة الجامعية 1427–1428هـ / 2006–2007م، إعداد الطالب الطاهر قانة، إشراف الدكتور جمال لعمارة؛ نوقشت يوم الأربعاء 27 فبراير 2008م. في أربعة فصول: الملكية والتوزيع في الاقتصادين الرأسمالي والاشتراكي، والملكية في الاقتصاد الإسلامي، والتوزيع في الاقتصاد الإسلامي، ودور الملكية في التوزيع."
  en: "A dissertation for the MA in Islamic economics, Department of Shari'a, Faculty of Social Sciences and Islamic Sciences, University of El Hadj Lakhdar, Batna (Algeria), academic year 1427-1428 AH / 2006-2007, by the student al-Tahir Qana, supervised by Dr Jamal Laamara, defended on Wednesday 27 February 2008. Four chapters: property and distribution in the capitalist and socialist economies, property in the Islamic economy, distribution in the Islamic economy, and the role of property in distribution."
