  ar: "مقالة ويكيبيديا الإنجليزية عن حمزة يوسف؛ تُستخدم لوقائع الكيان فقط. توثّق ميلاده باسم مارك هانسون سنة 1958 في والا والا، وإسلامه سنة 1977، ودراسته في الإمارات وشمال أفريقيا وموريتانيا، وتأسيسه معهد زيتونة سنة 1996 وكلية الزيتونة، ودكتوراه سنة 2020، ومواقفه والجدل حولها."
  en: "English Wikipedia article on Hamza Yusuf; used for entity facts only. It records his birth as Mark Hanson in 1958 in Walla Walla, his conversion to Islam in 1977, his studies in the Emirates, North Africa and Mauritania, the founding of the Zaytuna Institute in 1996 and of Zaytuna College, his 2020 doctorate, and his views and the controversies around them."
