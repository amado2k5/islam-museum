reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Covers his birth as Mark Hanson in 1958 in Walla Walla, Washington, to two academics at Whitman College — his father a Catholic of Irish descent, his mother Greek Orthodox — and his upbringing in northern California in his mother's faith; his conversion to Islam in 1977 after a near-death car accident and reading the Qur'an; his study under Abdalqadir as-Sufi in Norwich, his four years at the Islamic Studies Institute in Al Ain studying sharia sciences including Maliki jurisprudence and theology one-to-one, his formal disassociation from as-Sufi in 1984, and his studies in Algeria, Morocco, Spain and Mauritania, above all under Murabit al-Hajj; his nursing associate degree, his San José State bachelor's in religious studies and his 2020 PhD from the Graduate Theological Union, with a dissertation on Ibn Ashir's Maliki manual Al-Murshid al-Mu'in; the Zaytuna Institute (1996, with Zaid Shakir and Hatem Bazian) and Zaytuna College (opened fall 2010, later the first accredited Muslim college campus in the United States); his advisory roles at Stanford and the Graduate Theological Union, his vice-presidency of bin Bayyah's Forum for Promoting Peace in Muslim Societies, and the controversy that role has drawn; his place in The 500 Most Influential Muslims; his condemnation of the 9/11 attacks, his signature of A Common Word and of the open letter to Abu Bakr al-Baghdadi; and the attributed controversies (monarchy over democracy, Syria 2019, the 2016 Black Lives Matter remarks and Zaid Shakir's defence of him). The article's infobox gives his denomination as Sunni, his jurisprudence as Maliki and his creed as Ash'ari — one of the two attestations on which the person record's faith segment rests, the other being the Arabic article's explicit statement. Read in full on 24 October 2026."
