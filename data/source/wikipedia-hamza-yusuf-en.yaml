summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حمزة يوسف؛ تُستخدم لوقائع الكيان فقط. توثّق ميلاده باسم مارك هانسون سنة 1958 في والا والا، وإسلامه سنة 1977، ودراسته في الإمارات وشمال أفريقيا وموريتانيا، وتأسيسه معهد زيتونة سنة 1996 وكلية الزيتونة، ودكتوراه سنة 2020، ومواقفه والجدل حولها."
  en: "English Wikipedia article on Hamza Yusuf; used for entity facts only. It records his birth as Mark Hanson in 1958 in Walla Walla, his conversion to Islam in 1977, his studies in the Emirates, North Africa and Mauritania, the founding of the Zaytuna Institute in 1996 and of Zaytuna College, his 2020 doctorate, and his views and the controversies around them."
  es: "Artículo de la Wikipedia en inglés sobre Hamza Yusuf; utilizado únicamente para datos sobre la persona. En él se recoge su nacimiento como Mark Hanson en 1958 en Walla Walla, su conversión al islam en 1977, sus estudios en los Emiratos Árabes Unidos, el norte de África y Mauritania, la fundación del Instituto Zaytuna en 1996 y del Colegio Zaytuna, su doctorado en 2020, sus opiniones y las controversias que las rodean."
  fr: "Article de Wikipédia en anglais sur Hamza Yusuf; utilisé uniquement pour les informations sur l’entité. Il relate sa naissance sous le nom de Mark Hanson en 1958 à Walla Walla, sa conversion à l’islam en 1977, ses études aux Émirats arabes unis, en Afrique du Nord et en Mauritanie, la fondation de l’Institut Zaytuna en 1996 et du Collège Zaytuna, son doctorat obtenu en 2020, ainsi que ses opinions et les controverses qu’elles ont suscitées."
  ur: "حمزہ یوسف پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں مارک ہینسن کے طور پر 1958 میں والہ والا میں اس کی پیدائش، 1977 میں اسلام قبول کرنے، امارات، شمالی افریقہ اور موریطانیہ میں اس کی تعلیم، 1996 میں زیتونا انسٹی ٹیوٹ کی بنیاد اور زیتونا کالج، اس کی 2020 میں ڈاکٹریٹ، اور ان کے خیالات اور ان کے ارد گرد کے تنازعات درج ہیں۔"
  tr: "Hamza Youssef hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Doğumu 1958'de Walla Walla'da Mark Hanson, 1977'de İslam'a geçişi, BAE, Kuzey Afrika ve Moritanya'daki çalışmaları, 1996'da Zaytuna Enstitüsü'nün ve Zaytuna Koleji'nin kuruluşu, 2020'de doktora derecesi, pozisyonları ve bu konularla ilgili tartışmalar olarak belgelenmiştir."
  id: "Artikel Wikipedia bahasa Inggris tentang Hamza Youssef; digunakan hanya untuk fakta entitas. Kelahirannya didokumentasikan sebagai Mark Hanson pada tahun 1958 di Walla Walla, konversi ke Islam pada tahun 1977, studinya di UEA, Afrika Utara, dan Mauritania, pendirian Zaytuna Institute pada tahun 1996 dan Zaytuna College, gelar PhD pada tahun 2020, posisinya dan kontroversi yang mengelilinginya."
