summary:
  ar: "مدخل «نجاتي بك» في موسوعة الإسلام التركية (TDV) بقلم بيرم علي قايا (المجلد 32، إسطنبول 2006، ص 477–478)؛ يقدّر مولده في أدرنة في سنوات سلطنة محمد الثاني الأولى (1444–1446)، ويذكر أنه أُخذ عبدًا صغيرًا وتبنّته امرأة أدرنية، وأنه خدم كاتبًا للديوان ثم نيشانجيًا عند الأمير محمود، ومات في إسطنبول في 25 ذي القعدة 914هـ (17 آذار 1509)."
  en: "The TDV İslâm Ansiklopedisi (Turkish encyclopedia of Islam) entry 'NECÂTÎ BEY' by Bayram Ali Kaya (vol. 32, Istanbul 2006, pp. 477–478); it estimates his birth at Edirne in the first reign years of Mehmed II (1444–1446), records that he was taken as a slave child and adopted by an elderly woman of Edirne, follows his service as divan secretary and then nişancı to Prince Mahmud, and gives his death at Istanbul on 25 Zilkade 914 (17 March 1509)."
title: "NECÂTÎ BEY"
