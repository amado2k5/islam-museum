reliability_note: "Scholarly encyclopedia entry, read in full on 1 November 2026, and the anchor source for this record. It works directly from the tezkire tradition (Sehî — Necati's own pupil — Latîfî, Âşık Çelebi, Kınalızâde) and gives the birth only as an estimate tied to Mehmed II's first reign (1444–1446), the death with its Hijri pairing (25 Zilkade 914) and the tomb chronogram, and the detail that his Divan opens with tevhid, na't and mi'raciye poems. It names no legal school for him."
