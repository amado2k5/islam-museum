reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and fetched by the recorded revision id, with the returned revision asserted equal before any claim was drawn. It gives him as born 1 October 1966 in Monrovia, Liberia, birth name George Manneh Oppong Weah; the only African winner of both the Ballon d'Or and FIFA World Player of the Year (both 1995, at AC Milan); senator, then 25th president of Liberia (2018–2024). Its personal-life text states, citing BBC Sport (18 September 2001), that 'Weah practiced Islam for ten years before converting to Christianity', and notes his October 2017 visit to the church of the Nigerian pastor T. B. Joshua. Its categories file him under Converts to Christianity from Islam, Liberian Christians and Liberian former Muslims. It also records that he was raised largely by his devoutly Christian paternal grandmother — family background, not his own attestation."
