reliability_note: "Read in the museum's session on 20 November 2026. It gives his birth in 1145/1732 at Bilgram in northern India, his descent from the Husayni sayyids of Wasit (hence the nisbas Wasiti, Husayni, Alawi, Zaydi), and cites Abd al-Hayy al-Kattani (Fihris al-fahaaris, I, 527) for his school: Hanafi in law, Ashari in creed, Qadiri by affiliation and Naqshbandi in the Sufi path; and divides his life into India, Yemen (Zabid) and Egypt. Used for entity facts only."
