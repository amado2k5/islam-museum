summary:
  ar: "صفحة المؤلف لعبد الحي محمد سيف الله في مكتبة «Alada Boi» البنغلاديشية؛ تعرض سيرته: نشأته في ناوغاون، ودراساته في الحديث بجامعة كوشتيا الإسلامية وميداليته الذهبية الرئاسية، وأستاذه الدكتور خاندكار عبد الله جهانغير، وخطابته في مجمع مسجد الجمعة، وكتبه."
  en: "The Bangladeshi bookseller Alada Boi's author page for Abdul Hai Muhammad Saifullah, carrying his biography: upbringing in Naogaon, his Al-Hadith studies at Islamic University, Kushtia and his President's Gold Medal, his teacher Dr Khandaker Abdullah Jahangir, his khatib post at Masjidul Juma Complex, and his books."
  ur: "بنگلہ دیشی کتب فروش «Alada Boi» کا عبد الحی محمد سیف اللہ کے لیے مصنف صفحہ؛ اس میں ان کی سوانح درج ہے: ناؤگاؤں میں پرورش، اسلامی یونیورسٹی کشتیا میں الحدیث کی تعلیم اور صدارتی طلائی تمغہ، ان کے استاد ڈاکٹر خندکار عبد اللہ جہانگیر، مسجد الجمعہ کمپلیکس میں ان کی خطابت، اور ان کی کتابیں۔"
  es: "La página del autor del librero bangladesí Alada Boi para Abdul Hai Muhammad Saifullah, que incluye su biografía: su educación en Naogaon, sus estudios de Al-Hadith en la Universidad Islámica de Kushtia y su Medalla de Oro del Presidente, su maestro, el Dr. Khandaker Abdullah Jahangir, su puesto de khatib en el Complejo Masjidul Juma y sus libros."
  fr: "La page d'auteur du libraire bangladais Alada Boi pour Abdul Hai Muhammad Saifullah, contenant sa biographie: son éducation à Naogaon, ses études Al-Hadith à l'Université islamique de Kushtia et sa médaille d'or du président, son professeur Dr Khandaker Abdullah Jahangir, son poste de khatib au complexe Masjidul Juma et ses livres."
  tr: "Bangladeş'teki 'Alada Boi' Kütüphanesi'nde Abdul Hayy Muhammad Saifullah için yazar sayfası; biyografisini sunar: Naugaon'daki yetiştirilme yılı, Kushtia İslam Üniversitesi'nde hadis çalışmaları ve Cumhurbaşkanlığı Altın Madalyası, profesörü Dr. Khandkar Abdullah Jahangir, Cuma Camii Kompleksi'ndeki vaazı ve kitapları."
  id: "Halaman penulis untuk Abdul Hayy Muhammad Saifullah di Perpustakaan 'Alada Boi' di Bangladesh; mempresentasikan biografinya: masa kecilnya di Naugaon, studi Hadis di Universitas Islam Kushtia dan Medali Emas Presidennya, profesornya Dr. Khandkar Abdullah Jahangir, khotbahnya di Kompleks Masjid Jumat, dan buku-bukunya."
