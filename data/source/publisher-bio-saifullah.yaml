summary:
  ar: "صفحة المؤلف لعبد الحي محمد سيف الله في مكتبة «Alada Boi» البنغلاديشية؛ تعرض سيرته: نشأته في ناوغاون، ودراساته في الحديث بجامعة كوشتيا الإسلامية وميداليته الذهبية الرئاسية، وأستاذه الدكتور خاندكار عبد الله جهانغير، وخطابته في مجمع مسجد الجمعة، وكتبه."
  en: "The Bangladeshi bookseller Alada Boi's author page for Abdul Hai Muhammad Saifullah, carrying his biography: upbringing in Naogaon, his Al-Hadith studies at Islamic University, Kushtia and his President's Gold Medal, his teacher Dr Khandaker Abdullah Jahangir, his khatib post at Masjidul Juma Complex, and his books."
  ur: "بنگلہ دیشی کتب فروش «Alada Boi» کا عبد الحی محمد سیف اللہ کے لیے مصنف صفحہ؛ اس میں ان کی سوانح درج ہے: ناؤگاؤں میں پرورش، اسلامی یونیورسٹی کشتیا میں الحدیث کی تعلیم اور صدارتی طلائی تمغہ، ان کے استاد ڈاکٹر خندکار عبد اللہ جہانگیر، مسجد الجمعہ کمپلیکس میں ان کی خطابت، اور ان کی کتابیں۔"
