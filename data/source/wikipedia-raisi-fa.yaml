summary:
  ar: "مقالة ويكيبيديا الفارسية عن سيد إبراهيم رئيسي؛ تُستخدم لوقائع الكيان فقط. يصفه مطلعها بأنه «فقيه شيعه» ⁦(فقيه شيعي)⁩ وسياسي، الرئيس الثامن لإيران من 1400 حتى وفاته في 1403."
  en: "Persian Wikipedia article on Seyyed Ebrahim Raisi; used for entity facts only. Its lead calls him a 'Shia jurist' (faqih-e Shi'a) and politician, the eighth president of Iran from 1400 until his death in 1403 (2021–2024)."
  es: "Artículo de Wikipedia en persa sobre Seyyed Ebrahim Raisi; utilizado únicamente para datos sobre la persona. Su introducción lo describe como un «jurista chiíta» (faqih-e Shi'a) y político, octavo presidente de Irán desde 1400 hasta su muerte en 1403 (2021-2024)."
  fr: "Article Wikipédia en persan sur Seyyed Ebrahim Raisi; utilisé uniquement pour les informations sur l'entité. Son introduction le décrit comme un « juriste chiite » (faqih-e Shi'a) et un homme politique, le huitième président de l'Iran de 1400 jusqu'à sa mort en 1403 (2021–2024)."
  ur: "سید ابراہیم رئیسی پر فارسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی قیادت انہیں 'شیعہ فقیہ' ⁦(فقیہہ شیعہ)⁩ اور سیاست دان کہتی ہے، جو 1400 سے 1403 (2021-2024) میں اپنی موت تک ایران کے آٹھویں صدر تھے۔"
  tr: "Seyyid İbrahim Reisi hakkında Farsça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılır. Girişinde onu 'Şii hukukçu' (Şii hukukçu) ve siyasetçi olarak tanımlar; 1400'den ölümüne kadar İran'ın sekizinci cumhurbaşkanıydı."
  id: "Artikel Wikipedia Persia tentang Seyyed Ebrahim Raisi; digunakan hanya untuk fakta entitas. Pendahuluannya menggambarkannya sebagai 'ahli hukum Syiah' (ahli hukum Syiah) dan politisi, presiden Iran kedelapan dari tahun 1400 hingga kematiannya pada tahun 1403."
