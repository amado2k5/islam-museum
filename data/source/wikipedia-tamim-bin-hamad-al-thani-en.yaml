summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن تميم بن حمد آل ثاني؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في الدوحة في 3 يونيو 1980، وتعليمه في بريطانيا وتخرّجه في ساندهيرست سنة 1998، وصيرورته وليًا للعهد سنة 2003 بعد تنازل أخيه جاسم، وتولّيه الإمارة في 25 يونيو 2013 بتنازل والده، وكأس العالم 2022 والأزمة الدبلوماسية 2017–2021 وانتخابات مجلس الشورى الأولى سنة 2021. لا يرد في نصها ولا في صندوق معلوماتها أي ذكر لدينه أو مذهبه."
  en: "English Wikipedia article on Tamim bin Hamad Al Thani; used for entity facts only. It recounts his birth in Doha on 3 June 1980, his British schooling and 1998 graduation from Sandhurst, his becoming heir apparent in 2003 after his brother Jassim renounced the claim, his accession on 25 June 2013 by his father's abdication, the 2022 FIFA World Cup, the 2017–2021 diplomatic crisis, and the first Shura Council elections of 2021. Neither its text nor its infobox makes any statement of his religion or school."
