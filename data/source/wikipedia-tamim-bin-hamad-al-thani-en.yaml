summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن تميم بن حمد آل ثاني؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في الدوحة في 3 يونيو 1980، وتعليمه في بريطانيا وتخرّجه في ساندهيرست سنة 1998، وصيرورته وليًا للعهد سنة 2003 بعد تنازل أخيه جاسم، وتولّيه الإمارة في 25 يونيو 2013 بتنازل والده، وكأس العالم 2022 والأزمة الدبلوماسية 2017–2021 وانتخابات مجلس الشورى الأولى سنة 2021. لا يرد في نصها ولا في صندوق معلوماتها أي ذكر لدينه أو مذهبه."
  en: "English Wikipedia article on Tamim bin Hamad Al Thani; used for entity facts only. It recounts his birth in Doha on 3 June 1980, his British schooling and 1998 graduation from Sandhurst, his becoming heir apparent in 2003 after his brother Jassim renounced the claim, his accession on 25 June 2013 by his father's abdication, the 2022 FIFA World Cup, the 2017–2021 diplomatic crisis, and the first Shura Council elections of 2021. Neither its text nor its infobox makes any statement of his religion or school."
  es: "Artículo de la Wikipedia en inglés sobre Tamim bin Hamad Al Thani; utilizado únicamente para datos sobre la persona. Relata su nacimiento en Doha el 3 de junio de 1980, su educación en Gran Bretaña y su graduación en Sandhurst en 1998, su designación como heredero al trono en 2003 tras la renuncia de su hermano Jassim, su ascenso al trono el 25 de junio de 2013 por la abdicación de su padre, la Copa Mundial de la FIFA 2022, la crisis diplomática de 2017-2021 y las primeras elecciones al Consejo de la Shura de 2021. Ni el texto ni el recuadro informativo mencionan su religión ni su escuela."
  fr: "Article de Wikipédia en anglais sur Tamim bin Hamad Al Thani; utilisé uniquement pour les informations relatives à l'entité. Il relate sa naissance à Doha le 3 juin 1980, sa scolarité au Royaume-Uni et son diplôme de Sandhurst en 1998, sa désignation comme héritier présomptif en 2003 après la renonciation de son frère Jassim, son accession au trône le 25 juin 2013 suite à l'abdication de son père, la Coupe du monde de la FIFA 2022, la crise diplomatique de 2017-2021 et les premières élections du Conseil de la Choura en 2021. Ni le texte ni l'infobox ne font mention de sa religion ou de son école."
  ur: "تمیم بن حمد الثانی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 3 جون 1980 کو دوحہ میں ان کی پیدائش، اس کی برطانوی اسکولنگ اور سینڈہرسٹ سے 1998 میں گریجویشن، 2003 میں اس کے بھائی جاسم کے دعوے سے دستبردار ہونے کے بعد اس کے وارث بننے کا ذکر ہے، 25 جون 2013 کو اس کا الحاق اس کے والد کے دستبردار ہونے، 2022-2022، FIFA، 2022-2013 ورلڈ کپ، 2013، 2013 کے عالمی بحران کے بعد ہوا تھا۔ 2021 کے پہلے شوریٰ کونسل کے انتخابات۔ نہ تو اس کا متن اور نہ ہی اس کا انفو باکس اس کے مذہب یا مکتب کا کوئی بیان دیتا ہے۔"
