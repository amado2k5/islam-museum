reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It gives him as born on 1 January 1969 at house no. 39, Mazugal quarter, Dala Local Government Area, Kano State; a Kano Islamic scholar teaching across Nigeria; chairman of the Kano State Hisbah board; and presenter of the radio teaching programme 'Tambaya Mabudin Ilimi'. It repeats, in the same terms as the English article, that he is under the First Aid Group of Jama'atu Izalatil Bidi'a Wa'ikamatis Sunnah (Izala) and that he founded the Hisbah Corps in Kano — the same tradition as the English text, not an independent attestation. The article has no infobox and names no denomination, school or creed anywhere."
