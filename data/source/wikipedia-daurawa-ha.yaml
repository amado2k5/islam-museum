  ar: "مقالة ويكيبيديا الهوسا عن أمينو إبراهيم دوراوا؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في 1 يناير 1969 في مازوغال بدلَا في كانو، ورئاسته هيئة الحسبة، وبرنامجه الإذاعي «سؤال مفتاح العلم»، وتكرر عبارة انتمائه إلى فريق الإسعاف الأول في جماعة إزالة وتأسيسه الحسبة."
  en: "Hausa Wikipedia article on Aminu Ibrahim Daurawa; used for entity facts only. It gives his birth on 1 January 1969 at Mazugal, Dala, Kano, his chairmanship of the Hisbah board and his radio programme 'Tambaya Mabudin Ilimi', and repeats the statement placing him under the Izala First Aid Group and crediting him with founding the Hisbah Corps."
