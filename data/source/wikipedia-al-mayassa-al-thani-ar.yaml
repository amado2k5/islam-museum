  ar: "مقالة ويكيبيديا العربية عن المياسة بنت حمد بن خليفة آل ثاني؛ تذكر مولدها في 29 سبتمبر 1983 (وتذكر الدوحة مكانًا للولادة في صندوق المعلومات)، ودراستها في جامعة ديوك وباريس، وتأسيسها منظمة أيادي الخير نحو آسيا، ورئاستها هيئة متاحف قطر وشراءها لوحة غوغان سنة 2015."
