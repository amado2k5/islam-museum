summary:
  ar: "سيرة الأستاذة عفت رفيق كما نشرتها مؤسسة خدمة وأعادت إسلاموبيديا نشرها في مايو 2015؛ تقول إنها أتمّت دورة العالمية الكلاسيكية في المملكة المتحدة متفوقة على الطلاب والطالبات في كل امتحان، ودرست عند الشيخ عطابك شوكوروف النسفي والشيخ برهان، وعُيّنت معلمة ومستشارة روحية للمسلمات الجدد، ونالت منحة للأزهر في القاهرة فدرست النحو العربي المكثف، ثم درّست العقيدة في كلية حسنات بمدينة ليستر وتابعت الدراسة في معهد السيوطي عند الشيخ زين الأقطاب الصديقي، وشاركت في تأسيس منظمة «من غبار إلى ألماس» للدعوة والإرشاد."
  en: "The biography of Ustadha Iffet Rafeeq published by the Khidma organisation and republished by Islamopedia in May 2015. It says she completed the classical 'Aalimah course in the UK, topping male and female students in every exam; studied under Shaykh Atabek Shukurov Nasafi and Shaykh Burhan; was appointed a teacher and spiritual counsellor for reverts by her teacher; was one of three students gifted a scholarship to Al-Azhar in Cairo, where she completed an intensive Arabic grammar course; then taught Islamic theology at City Hasanat College while studying at the Suyuti Institute under Shaykh Zain ul Aqtab Siddiqui; and co-founded Dust To Diamonds, a dawah and counselling organisation."
