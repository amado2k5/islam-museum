summary:
  ar: "سيرة الأستاذة عفت رفيق كما نشرتها مؤسسة خدمة وأعادت إسلاموبيديا نشرها في مايو 2015؛ تقول إنها أتمّت دورة العالمية الكلاسيكية في المملكة المتحدة متفوقة على الطلاب والطالبات في كل امتحان، ودرست عند الشيخ عطابك شوكوروف النسفي والشيخ برهان، وعُيّنت معلمة ومستشارة روحية للمسلمات الجدد، ونالت منحة للأزهر في القاهرة فدرست النحو العربي المكثف، ثم درّست العقيدة في كلية حسنات بمدينة ليستر وتابعت الدراسة في معهد السيوطي عند الشيخ زين الأقطاب الصديقي، وشاركت في تأسيس منظمة «من غبار إلى ألماس» للدعوة والإرشاد."
  en: "The biography of Ustadha Iffet Rafeeq published by the Khidma organisation and republished by Islamopedia in May 2015. It says she completed the classical 'Aalimah course in the UK, topping male and female students in every exam; studied under Shaykh Atabek Shukurov Nasafi and Shaykh Burhan; was appointed a teacher and spiritual counsellor for reverts by her teacher; was one of three students gifted a scholarship to Al-Azhar in Cairo, where she completed an intensive Arabic grammar course; then taught Islamic theology at City Hasanat College while studying at the Suyuti Institute under Shaykh Zain ul Aqtab Siddiqui; and co-founded Dust To Diamonds, a dawah and counselling organisation."
  es: "La biografía de Ustadha Iffet Rafeeq, publicada por la organización Khidma y republicada por Islamopedia en mayo de 2015, indica que completó el curso clásico de 'Aalimah en el Reino Unido, obteniendo las mejores calificaciones tanto para hombres como para mujeres en todos los exámenes; estudió con Shaykh Atabek Shukurov Nasafi y Shaykh Burhan; fue nombrada maestra y consejera espiritual para conversos por su maestro; fue una de las tres estudiantes que recibieron una beca para Al-Azhar en El Cairo, donde completó un curso intensivo de gramática árabe; luego enseñó teología islámica en City Hasanat College mientras estudiaba en el Instituto Suyuti con Shaykh Zain ul Aqtab Siddiqui; y cofundó Dust To Diamonds, una organización de dawah y consejería."
  fr: "La biographie d'Ustadha Iffet Rafeeq, publiée par l'organisation Khidma et republiée par Islamopedia en mai 2015, indique qu'elle a suivi le cursus classique d'Aalimah au Royaume-Uni, se classant première parmi les étudiants, hommes et femmes confondus, à chaque examen; qu'elle a étudié sous la direction des cheikhs Atabek Shukurov Nasafi et Burhan; qu'elle a été nommée enseignante et conseillère spirituelle pour les convertis par son maître; qu'elle a été l'une des trois étudiantes à recevoir une bourse pour Al-Azhar au Caire, où elle a suivi un cours intensif de grammaire arabe; qu'elle a ensuite enseigné la théologie islamique au City Hasanat College tout en étudiant à l'Institut Suyuti sous la direction du cheikh Zain ul Aqtab Siddiqui; et qu'elle a cofondé Dust To Diamonds, une organisation de da'wa et de conseil."
  ur: "استاد عفت رفیق کی سوانح عمری جسے خدمت تنظیم نے شائع کیا اور مئی 2015 میں اسلاموپیڈیا نے دوبارہ شائع کیا۔ اس میں کہا گیا ہے کہ اس نے برطانیہ میں کلاسیکل علیمہ کورس مکمل کیا، ہر امتحان میں مرد اور خواتین طالب علموں کو ٹاپ کیا؛ شیخ اتابیک شکروف نسفی اور شیخ برہان سے تعلیم حاصل کی۔ اس کے استاد کے ذریعہ واپسی کے لئے ایک استاد اور روحانی مشیر مقرر کیا گیا تھا؛ قاہرہ میں الازہر کو اسکالرشپ تحفے میں دینے والی تین طالبات میں سے ایک تھی، جہاں اس نے عربی گرامر کا ایک گہرا کورس مکمل کیا۔ پھر شیخ زین الاقطاب صدیقی کے ماتحت سیوطی انسٹی ٹیوٹ میں تعلیم حاصل کرتے ہوئے سٹی حسنات کالج میں اسلامی الہیات پڑھایا۔ اور ڈسٹ ٹو ڈائمنڈز، ایک دعوتی اور مشاورتی تنظیم کی مشترکہ بنیاد رکھی۔"
  tr: "Profesör Effat Rafiq'in biyografisi, Khidmat Vakfı tarafından yayımlandı ve Mayıs 2015'te Islamopedia tarafından yeniden yayımlandı; Birleşik Krallık'ta klasik uluslararası kursu tamamladığını, her sınavda erkek ve kadın öğrencileri geride bıraktığını, Şeyh Atabek Shokurov Al-Nasafi ve Sheikh Burhan'ın yanında eğitim aldığını, yeni Müslüman kadınlar için öğretmen ve manevi danışman olarak atandığını, Kahire'deki Al-Azhar'da yoğun Arapça dilbilgisi eğitimi aldığını, ardından Leicester'daki Hasanat Koleji'nde mezhep eğitimi aldığını, Al-Suyuti Enstitüsü'nde Sheikh Zain Al-Aqtab Al-Siddiqi'nin yanında çalışmalarına devam ettiğini ve Da'wah ve rehberlik için 'Tozdan Elmas'a kuruluşun kurulmasına katıldığını söylüyor."
  id: "Biografi Profesor Effat Rafiq yang diterbitkan oleh Khidmat Foundation dan diterbitkan ulang oleh Islamopedia pada Mei 2015; ia mengatakan telah menyelesaikan kursus internasional klasik di Inggris, unggul di setiap ujian, belajar di bawah bimbingan Sheikh Atabek Shokurov Al-Nasafi dan Sheikh Burhan, diangkat sebagai guru dan penasihat spiritual bagi perempuan Muslim baru, menerima beasiswa ke Al-Azhar di Kairo, di mana ia belajar tata bahasa Arab intensif, kemudian belajar kredo di Hasanat College di Leicester, melanjutkan studinya di Al-Suyuti Institute di bawah Sheikh Zain Al-Aqtab Al-Siddiqi, dan berpartisipasi dalam mendirikan organisasi 'From Dust to Diamonds' untuk Da'wah dan Bimbingan."
