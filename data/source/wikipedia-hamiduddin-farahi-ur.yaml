summary:
  ar: "مقالة ويكيبيديا الأردية عن حميد الدين الفراهي؛ أوسع سيرته، تعطي مولده في فريها في 6 جمادى الثانية ⁦(يُطبع عامها الهجري في متنها 1230 سهوًا عن 1280هـ)⁩ الموافق 18 تشرين الثاني 1863 ودراسته عند شبلي النعماني وفي لكنؤ ولاهور، وتنقل وصف تقي الدين الهلالي له شاهدَ عيان بأنه كان لا يحب النسبة إلى أي مذهب فقهي وإن صلى على الطريقة الحنفية التي نشأ عليها."
  en: "The Urdu Wikipedia article on Hamiduddin Farahi; the fullest biography, giving his birth at Phariha on 6 Jumada al-thani (its text misprints the Hijri year as 1230 for 1280 AH) corresponding to 18 November 1863, his studies under Shibli Nomani and at Lucknow and Lahore, and quoting Taqi al-Din al-Hilali's eyewitness description that Farahi disliked attribution to any fiqh school though he prayed in the Hanafi manner in which he was raised."
  es: "El artículo de Wikipedia en urdu sobre Hamiduddin Farahi; la biografía más completa, que indica su nacimiento en Phariha el 6 de Jumada al-thani (su texto imprime erróneamente el año Hijri como 1230 en lugar de 1280 AH) correspondiente al 18 de noviembre de 1863, sus estudios con Shibli Nomani y en Lucknow y Lahore, y cita la descripción de Taqi al-Din al-Hilali, testigo presencial, de que a Farahi no le gustaba que se le atribuyera a ninguna escuela de fiqh, aunque rezaba de la manera Hanafi en la que fue criado."
  fr: "L'article de Wikipédia en ourdou sur Hamiduddin Farahi; la biographie la plus complète, indiquant sa naissance à Phariha le 6 Jumada al-thani (le texte comporte une erreur d'impression concernant l'année hégirienne, 1230 au lieu de 1280 AH), correspondant au 18 novembre 1863, ses études auprès de Shibli Nomani et à Lucknow et Lahore, et citant le témoignage oculaire de Taqi al-Din al-Hilali selon lequel Farahi n'appréciait pas d'être rattaché à une école de fiqh, bien qu'il priât à la manière hanafite dans laquelle il avait été élevé."
  ur: "حمید الدین فراہی پر اردو ویکیپیڈیا مضمون؛ مکمل سوانح عمری، 6 جمادی الثانی کو فریحہ میں ان کی ولادت ⁦(اس کے متن میں 18 نومبر 1863 کے مطابق ہجری سال 1230 ہجری کو غلط لکھا گیا ہے)⁩، شبلی نعمانی کے زیرِ تعلیم اور لکھنؤ اور لاہور میں، اور تقی الدین کے حوالے سے نقل کیا گیا ہے کہ فضیلت الہی کی تفصیل کسی بھی فقہی مکتب میں اگرچہ اس نے حنفی طریقے سے نماز پڑھی جس میں اس کی پرورش ہوئی۔"
  tr: "Hamid al-Din al-Farahi hakkında Urduca Wikipedia makalesi; biyografisi en geniş olup, Fariha'da 6 Cumeded-Thani'de doğduğunu (Hicri yılı 1230 olarak yanlış basılmış, 1280 Hicri ile karşılaştırıldığında) ve Lucknow ile Lahor'da Şibli al-Numani yanında çalıştığını anlatır. Taqi al-Din al-Hilali, kendi tanımını, yetiştirildiği Hanefi okuluna göre namaz kılmasına rağmen herhangi bir fıkıh okuluna atfedilmekten hoşlanmadığına dair net bir görüşü olmadığını anlatır."
  id: "Artikel Urdu Wikipedia tentang Hamid al-Din al-Farahi; biografinya paling luas, menyebutkan kelahirannya di Fariha pada 6 Jumada al-Thani (tahun Hijriyahnya dicetak sebagai 1230 secara keliru dibandingkan 1280 H), yang bertepatan dengan 18 November 1863, dan studinya di bawah Shibli al-Numani di Lucknow dan Lahore. Taqi al-Din al-Hilali menceritakan deskripsinya sendiri sebagai tidak memiliki pendapat jelas bahwa ia tidak suka dikaitkan dengan aliran hukum manapun meskipun ia berdoa sesuai aliran Hanafi tempat ia dibesarkan."
