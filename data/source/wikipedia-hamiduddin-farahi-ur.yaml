summary:
  ar: "مقالة ويكيبيديا الأردية عن حميد الدين الفراهي؛ أوسع سيرته، تعطي مولده في فريها في 6 جمادى الثانية (يُطبع عامها الهجري في متنها 1230 سهوًا عن 1280هـ) الموافق 18 تشرين الثاني 1863 ودراسته عند شبلي النعماني وفي لكنؤ ولاهور، وتنقل وصف تقي الدين الهلالي له شاهدَ عيان بأنه كان لا يحب النسبة إلى أي مذهب فقهي وإن صلى على الطريقة الحنفية التي نشأ عليها."
  en: "The Urdu Wikipedia article on Hamiduddin Farahi; the fullest biography, giving his birth at Phariha on 6 Jumada al-thani (its text misprints the Hijri year as 1230 for 1280 AH) corresponding to 18 November 1863, his studies under Shibli Nomani and at Lucknow and Lahore, and quoting Taqi al-Din al-Hilali's eyewitness description that Farahi disliked attribution to any fiqh school though he prayed in the Hanafi manner in which he was raised."
