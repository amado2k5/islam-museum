summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مارون النقاش؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في صيدا في 9 فبراير 1817 في أسرة مارونية، وعمله رئيسًا لكُتّاب جمارك بيروت وعضوًا في غرفتها التجارية، وسفره إلى إيطاليا سنة 1846، واقتباسه مسرحية موليير «البخيل» (نُشرت 1847 وعُرضت 1848) بوصفها أول عرض مسرحي معروف بالعربية، ومسرحيتيه اللاحقتين، ووفاته بالحمى في طرسوس في 1 يونيو 1855؛ وتصفه في صدرها بأنه «تاجر ماروني»، وتسمي أخاه نقولا وابن أخيه سليم من أهل المسرح."
  en: "English Wikipedia article on Marun al-Naqqash; used for entity facts only. It gives his birth at Sidon on 9 February 1817 into a Maronite family, his work as chief clerk of the Beirut customs and member of its chamber of commerce, his 1846 journey to Italy, his Arabic adaptation of Molière's Miser as Al-bakhil (published 1847, staged 1848), the first known theatre performance in Arabic, his two later plays, and his death of fever at Tarsus on 1 June 1855. Its lead calls him personally a 'Maronite merchant', and it names his brother Nicolas and his nephew Salim as fellow men of the theatre."
