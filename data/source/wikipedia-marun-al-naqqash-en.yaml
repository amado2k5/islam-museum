summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مارون النقاش؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في صيدا في 9 فبراير 1817 في أسرة مارونية، وعمله رئيسًا لكُتّاب جمارك بيروت وعضوًا في غرفتها التجارية، وسفره إلى إيطاليا سنة 1846، واقتباسه مسرحية موليير «البخيل» ⁦(نُشرت 1847 وعُرضت 1848)⁩ بوصفها أول عرض مسرحي معروف بالعربية، ومسرحيتيه اللاحقتين، ووفاته بالحمى في طرسوس في 1 يونيو 1855؛ وتصفه في صدرها بأنه «تاجر ماروني»، وتسمي أخاه نقولا وابن أخيه سليم من أهل المسرح."
  en: "English Wikipedia article on Marun al-Naqqash; used for entity facts only. It gives his birth at Sidon on 9 February 1817 into a Maronite family, his work as chief clerk of the Beirut customs and member of its chamber of commerce, his 1846 journey to Italy, his Arabic adaptation of Molière's Miser as Al-bakhil (published 1847, staged 1848), the first known theatre performance in Arabic, his two later plays, and his death of fever at Tarsus on 1 June 1855. Its lead calls him personally a 'Maronite merchant', and it names his brother Nicolas and his nephew Salim as fellow men of the theatre."
  es: "Artículo de la Wikipedia en inglés sobre Marun al-Naqqash; utilizado únicamente para datos biográficos. Describe su nacimiento en Sidón el 9 de febrero de 1817 en el seno de una familia maronita, su trabajo como jefe de aduanas de Beirut y miembro de su cámara de comercio, su viaje a Italia en 1846, su adaptación al árabe de El avaro de Molière como Al-bakhil (publicada en 1847, estrenada en 1848), la primera representación teatral conocida en árabe, sus dos obras posteriores y su muerte por fiebre en Tarso el 1 de junio de 1855. En la introducción se le describe personalmente como un «comerciante maronita» y se menciona a su hermano Nicolás y a su sobrino Salim como compañeros de teatro."
  fr: "L'article de Wikipédia en anglais consacré à Marun al-Naqqash, utilisé uniquement pour les informations le concernant, relate sa naissance à Sidon le 9 février 1817 dans une famille maronite, son travail de chef de bureau des douanes de Beyrouth et de membre de sa chambre de commerce, son voyage en Italie en 1846, son adaptation arabe de L'Avare de Molière sous le titre Al-Bakhil (publiée en 1847, jouée en 1848), la première représentation théâtrale connue en arabe, ses deux pièces ultérieures et sa mort de la fièvre à Tarse le 1er juin 1855. L'article le décrit personnellement comme un « marchand maronite » et mentionne son frère Nicolas et son neveu Salim comme des hommes de théâtre."
