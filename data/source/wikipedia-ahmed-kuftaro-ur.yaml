  ar: "مقالة ويكيبيديا الأردية عن أحمد كفتارو؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في ديسمبر 1915 ووفاته في 1 سبتمبر 2004، وتصفه بأنه سني مسلم من الطريقة النقشبندية الصوفية، وتوثّق أصول أسرته الكردية من قضاء عمرلي بولاية ماردين وانتقالها إلى دمشق سنة 1878."
  en: "Urdu Wikipedia article on Ahmed Kuftaro; used for entity facts only. It gives his birth in December 1915 and his death on 1 September 2004, describes him as a Sunni Muslim of the Naqshbandi Sufi order, and documents his family's Kurdish origins in the Ömerli district of Mardin and its move to Damascus in 1878."
