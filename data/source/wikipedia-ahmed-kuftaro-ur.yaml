summary:
  ar: "مقالة ويكيبيديا الأردية عن أحمد كفتارو؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في ديسمبر 1915 ووفاته في 1 سبتمبر 2004، وتصفه بأنه سني مسلم من الطريقة النقشبندية الصوفية، وتوثّق أصول أسرته الكردية من قضاء عمرلي بولاية ماردين وانتقالها إلى دمشق سنة 1878."
  en: "Urdu Wikipedia article on Ahmed Kuftaro; used for entity facts only. It gives his birth in December 1915 and his death on 1 September 2004, describes him as a Sunni Muslim of the Naqshbandi Sufi order, and documents his family's Kurdish origins in the Ömerli district of Mardin and its move to Damascus in 1878."
  es: "Artículo de Wikipedia en urdu sobre Ahmed Kuftaro; utilizado únicamente para datos biográficos. Indica su nacimiento en diciembre de 1915 y su fallecimiento el 1 de septiembre de 2004, lo describe como un musulmán sunita de la orden sufí Naqshbandi y documenta los orígenes kurdos de su familia en el distrito de Ömerli, en Mardin, y su traslado a Damasco en 1878."
  fr: "Article de Wikipédia en ourdou sur Ahmed Kuftaro; utilisé uniquement pour les informations le concernant. Il indique sa naissance en décembre 1915 et son décès le 1er septembre 2004, le décrit comme un musulman sunnite de l’ordre soufi Naqshbandi et documente les origines kurdes de sa famille dans le district d’Ömerli à Mardin et son installation à Damas en 1878."
  ur: "احمد کفتارو پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ دسمبر 1915 میں اس کی پیدائش اور 1 ستمبر 2004 کو اس کی موت کا ذکر کرتا ہے، اسے نقشبندی صوفی حکم کے ایک سنی مسلمان کے طور پر بیان کرتا ہے، اور اس کے خاندان کی کرد نژاد ماردین کے ضلع عمرلی میں اور 1878 میں دمشق منتقل ہونے کی دستاویز کرتا ہے۔"
  tr: "Ahmed Kaftaro hakkında Urduca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Doğumunu Aralık 1915'te ve 1 Eylül 2004'te vefat ettiğini belirtir, onu Nakşibendi Sufi tarikatından Sünni Müslüman olarak tanımlar ve Mardin vilayetinin Amrali ilçesinden Kürt ailesinin kökenlerini ve 1878'de Şam'a taşınmalarını belgelemektedir."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang Ahmad Kaftaro; hanya digunakan untuk fakta entitas tersebut. Artikel tersebut menyebutkan kelahirannya pada Desember 1915 dan kematiannya pada 1 September 2004, menggambarkan dia sebagai Muslim Sunni dari tarekat Sufi Naqshbandi, serta mendokumentasikan asal-usul keluarga Kurdinya dari distrik Amrali di provinsi Mardin dan kepindahan mereka ke Damaskus pada tahun 1878."
