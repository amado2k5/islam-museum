summary:
  ar: "المجلد الأول من طبعة دار ابن حزم ببيروت لكتاب «المحلى» لأبي محمد علي بن أحمد بن حزم الأندلسي ⁦(384–456هـ)⁩، الطبعة الأولى 1437هـ/2016م، أشرف عليها خالد الرباط وشارك في تحقيقها فريق من المحققين، عن بضعة وستين مجلداً من النسخ الخطية. فيه مقدمة تحقيق في أربعة فصول: ترجمة ابن حزم، ونشأة المذهب الظاهري وأعلامه وأصوله، ودراسة موجزة عن «المحلى» ⁦(التعريف به، وأهميته، ومنهجه، وعناية العلماء به، وطبعاته)⁩، ومنهج التحقيق ووصف النسخ."
  en: "Volume 1 of the Dar Ibn Hazm (Beirut) edition of al-Muhalla by Abu Muhammad Ali ibn Ahmad ibn Hazm of al-Andalus (384–456 AH), 1st ed. 1437/2016, supervised by Khalid al-Rabbat with a team of editors, from some sixty-odd manuscript volumes. It opens with an editorial introduction in four chapters: the life of Ibn Hazm; the rise of the Zahiri school, its figures and principles; a short study of al-Muhalla (its identity, importance, method, scholarly reception and printings); and the editorial method and manuscripts."
  es: "Volumen 1 de la edición de Dar Ibn Hazm (Beirut) de al-Muhalla de Abu Muhammad Ali ibn Ahmad ibn Hazm de al-Ándalus (384–456 AH), 1.ª ed. 1437/2016, supervisada por Khalid al-Rabbat con un equipo de editores, a partir de unos sesenta volúmenes manuscritos. Comienza con una introducción editorial en cuatro capítulos: la vida de Ibn Hazm; el surgimiento de la escuela Zahiri, sus figuras y principios; un breve estudio de al-Muhalla (su identidad, importancia, método, recepción académica e impresiones); y el método editorial y los manuscritos."
  fr: "Le premier volume de l'édition Dar Ibn Hazm (Beyrouth) d'al-Muhalla d'Abu Muhammad Ali ibn Ahmad ibn Hazm d'al-Andalus (384-456 AH), 1re éd. 1437/2016, supervisée par Khalid al-Rabbat et une équipe d'éditeurs, à partir d'une soixantaine de volumes manuscrits, s'ouvre sur une introduction éditoriale divisée en quatre chapitres: la vie d'Ibn Hazm; l'essor de l'école zahirite, ses figures et ses principes; une brève étude d'al-Muhalla (son identité, son importance, sa méthode, sa réception par les savants et ses éditions imprimées); et la méthode éditoriale et les manuscrits."
  ur: "دار ابن حزم ⁦(بیروت)⁩ کے شمارہ المحلہ کی جلد 1 ابو محمد علی ابن احمد بن حزم الاندلس ⁦(384-456ھ)⁩، 1st ایڈیشن۔ 1437/2016، خالد الرباط کی نگرانی میں ایڈیٹرز کی ایک ٹیم کے ساتھ، تقریباً ساٹھ مخطوطہ جلدوں سے۔ اس کا آغاز چار ابواب میں ادارتی تعارف کے ساتھ ہوتا ہے: ابن حزم کی زندگی؛ ظاہری مکتب کا عروج، اس کے اعداد و شمار اور اصول؛ المحلہ کا مختصر مطالعہ ⁦(اس کی شناخت، اہمیت، طریقہ، علمی استقبال اور طباعت)⁩؛ اور ادارتی طریقہ اور مخطوطات۔"
  tr: "Beyrut'ta Dar İbn Hazm tarafından Ebu Muhammed Ali bin Ahmed ibn Hazm el-Endülüs'ün (384–456 Ahmedül) \"El-Muhalla\" adlı kitabının ilk cildi, ilk baskı 1437 H / 2016 M.S. olup, Halid el-Rabat tarafından denetlenmiş ve yaklaşık altmış cilt el yazmasını kapsayan bir editör ekibi tarafından düzenlenmiştir. Dört bölümde doğrulamaya giriş içerir: İbn Hazm'ın biyografisi, Zahiri okulunun ortaya çıkışı, önemli figürleri ve ilkeleri, \"El-Muhalla\"nın kısa bir incelemesi (girişi, önemi, metodolojisi, alimlerin ilgisi ve baskıları), doğrulama metodolojisi ve metin tanımı."
  id: "Volume pertama edisi oleh Dar Ibn Hazm di Beirut dari buku \"Al-Muhalla\" karya Abu Muhammad Ali ibn Ahmad ibn Hazm al-Andalusi (384–456 H), edisi pertama 1437 H/2016 M, diawasi oleh Khalid al-Rabat dan diedit oleh tim editor yang mencakup sekitar enam puluh jilid manuskrip. Buku ini memuat pengantar verifikasi dalam empat bab: biografi Ibn Hazm, kemunculan mazhab Zahiri, tokoh-tokoh terkenalnya, dan prinsip-prinsipnya, studi singkat tentang \"Al-Muhalla\" (pendahuluan, pentingnya, metodologi, perhatian para sarjana, dan edisi), metodologi verifikasi, dan deskripsi naskah."
