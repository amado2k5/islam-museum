  en: "Ibn Hazm, al-Muhalla bi-l-Athar fi Sharh al-Mujalla bi-l-Ikhtisar, vol. 1 (Dar Ibn Hazm, Beirut, 1st ed., 1437/2016)"
  ur: "ابن حزم، المحلی بالآثار فی شرح المجلی بالاختصار، جلد اول (دار ابن حزم، بیروت، طبع اول، 1437ھ/2016ء)"
summary:
  ar: "المجلد الأول من طبعة دار ابن حزم ببيروت لكتاب «المحلى» لأبي محمد علي بن أحمد بن حزم الأندلسي (384–456هـ)، الطبعة الأولى 1437هـ/2016م، أشرف عليها خالد الرباط وشارك في تحقيقها فريق من المحققين، عن بضعة وستين مجلداً من النسخ الخطية. فيه مقدمة تحقيق في أربعة فصول: ترجمة ابن حزم، ونشأة المذهب الظاهري وأعلامه وأصوله، ودراسة موجزة عن «المحلى» (التعريف به، وأهميته، ومنهجه، وعناية العلماء به، وطبعاته)، ومنهج التحقيق ووصف النسخ."
  en: "Volume 1 of the Dar Ibn Hazm (Beirut) edition of al-Muhalla by Abu Muhammad Ali ibn Ahmad ibn Hazm of al-Andalus (384–456 AH), 1st ed. 1437/2016, supervised by Khalid al-Rabbat with a team of editors, from some sixty-odd manuscript volumes. It opens with an editorial introduction in four chapters: the life of Ibn Hazm; the rise of the Zahiri school, its figures and principles; a short study of al-Muhalla (its identity, importance, method, scholarly reception and printings); and the editorial method and manuscripts."
title: "المحلى بالآثار في شرح المجلى بالاختصار"
