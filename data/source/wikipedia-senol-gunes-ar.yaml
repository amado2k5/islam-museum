reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md). Read in full on 26 October 2026 and checked against the recorded revision. It gives his birth on 1 June 1952, his goalkeeping career at Trabzonspor with a clean-sheet record it states as 1,112 minutes (the English article gives 1,110; the English figure is followed), his 31 caps for Turkey and his 2002 World Cup bronze medal as Turkey's coach. It still describes Beşiktaş as his current club, which the English article shows to be out of date (he returned to Trabzonspor in September 2024); the English article is followed for currency. It makes no statement of his religion anywhere in its text."
