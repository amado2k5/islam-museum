reliability_note: "A translation of the English article, hence the same source family, not an independent witness. Read on 27 October 2026 at the recorded revision. It gives her born 27 January 1952 at Lahore and died 11 February 2018 at Lahore, educated at the Convent of Jesus and Mary and Kinnaird College, LLB from Punjab University Law College in 1978, and repeats the English article's account of her career. Like the English article it makes no statement of her own religion; the religion content is her UN rapporteurship on freedom of religion or belief, an office."
