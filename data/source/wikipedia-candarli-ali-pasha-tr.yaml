reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision, resting on İsmail Hakkı Uzunçarşılı, Çandarlı Vezir Ailesi (Türk Tarih Kurumu, 1974), pp. 31–45, and Mehmet Yılmaz, Osmanlılar Ansiklopedisi, vol. 1, p. 224 (1999). It calls him the eldest son of Çandarlı Kara Halil Hayreddin Pasha, records his medrese formation and membership of the ilmiye class, his kazasker post before 1386 and his succession to the vizierate on his father's death on 22 January 1387, his campaigns of 1388, Kosovo and Nicopolis, his service to Süleyman Çelebi through the Interregnum, and his death at Ankara on 18 December 1406 and burial in his father's tomb at Iznik. It gives no birth date at all — in line with the DİA tradition that his birth date and place are unknown."
