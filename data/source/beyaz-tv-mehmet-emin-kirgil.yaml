reliability_note: "A broadcaster's own programme material, used only for what it plainly shows: that Mehmet Emin Kırgil has appeared over years as the dream-interpretation guest of Beyaz TV's Hayatta Her Şey Var, presented by Nur Viral, interpreting viewers' dreams live on air (segments dated from March 2019 to October 2026 were read), and that programme listings describe a regular weekly dream-interpretation slot for him. The programmes' promotional superlatives about him are not used. This source makes no claim about the truth of any interpretation, and the museum records his broadcasting career, not the interpretations themselves. The broadcaster's spelling is 'Kırgil'; the spelling 'Kırgıl' also circulates, and both are recorded in his names. No birth date, birthplace or schooling for him was found in any source read, and none is recorded. Read on 16 November 2026."
