summary:
  ar: "مقالة ويكيبيديا الأردية الموجزة عن أحمد غلام علي تشاغلا؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 31 أيار 1902 ووفاته في 5 شباط 1953 وتصفه بأنه موسيقار باكستاني مشهور رتّب موسيقى النشيد الوطني سنة 1949."
  en: "Urdu Wikipedia stub article on Ahmed Ghulamali Chagla; used for entity facts only. It gives his birth on 31 May 1902 and his death on 5 February 1953 and describes him as a renowned Pakistani musician who arranged the music of the national anthem in 1949."
  es: "Artículo incompleto de la Wikipedia en urdu sobre Ahmed Ghulamali Chagla; se utiliza únicamente para datos biográficos. Indica su fecha de nacimiento (31 de mayo de 1902) y su fallecimiento (5 de febrero de 1953), y lo describe como un reconocido músico pakistaní que compuso la música del himno nacional en 1949."
  fr: "Ébauche d'article Wikipédia en ourdou sur Ahmed Ghulamali Chagla; utilisé uniquement à des fins d'information. Il indique sa date de naissance: 31 mai 1902; sa date de décès: 5 février 1953; et le décrit comme un musicien pakistanais de renom, compositeur de l'hymne national en 1949."
  ur: "احمد غلام علی چھاگلا پر اردو ویکیپیڈیا کا نامکمل مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 31 مئی 1902 کو ان کی پیدائش اور 5 فروری 1953 کو ان کی موت کا ذکر کرتا ہے اور انہیں ایک مشہور پاکستانی موسیقار کے طور پر بیان کرتا ہے جس نے 1949 میں قومی ترانے کی موسیقی ترتیب دی۔"
  tr: "Ahmad Ghulam Ali hakkında Urduca Wikipedia makalesi özdür; yalnızca varlığın gerçekleri için kullanılır. Doğumunu 31 Mayıs 1902'de ve ölümünü 5 Şubat 1953'te belirtir ve 1949'da milli marşı bestelemiş ünlü bir Pakistanlı müzisyen olarak tanımlar."
  id: "Artikel Wikipedia Urdu tentang Ahmad Ghulam Ali adalah artikel singkat; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya pada 31 Mei 1902, dan kematiannya pada 5 Februari 1953, serta menggambarkannya sebagai musisi Pakistan terkenal yang menggubah lagu kebangsaan pada tahun 1949."
