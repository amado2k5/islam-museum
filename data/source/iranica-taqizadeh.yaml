summary:
  ar: "مدخل موسوعة إيرانيكا «تقي زاده، سيد حسن» الجزء الأول بقلم إيرج أفشار؛ يُستخدم لوقائع الكيان. يعطي ميلاده في تبريز في 30 رمضان 1295 (27 سبتمبر 1878) ووفاته في طهران في 28 يناير 1970، وأباه السيد تقي رجلَ الدين تلميذ الأنصاري في النجف، وتعليم تقي زاده المبكر ودراسته كتب الشيخ أحمد الأحسائي عند عالم شيخي، ومسيرته حتى نهاية الثورة الدستورية."
  en: "Encyclopaedia Iranica entry 'Taqizadeh, Sayyed Hasan', part i, by Iraj Afshar; used for entity facts. It gives his birth at Tabriz on 30 Ramadan 1295 (27 September 1878) and his death at Tehran on 28 January 1970, his father Sayyed Taqi, a cleric who had studied under Ansari at Najaf, Taqizadeh's early education including his study of Shaikh Ahmad Ahsai's books under a Shaikhi scholar, and his career to the end of the Constitutional Revolution."
