reliability_note: "Scholarly encyclopedia entry by Iraj Afshar, read in full on 26 October 2026. Its dates are Hijri-anchored and exact for both birth (30 Ramadan 1295) and death (8 Bahman 1348 Solar Hijri = 28 January 1970). Of religion it attests his father's world, not the son's school: the father was 'a Hosayni sayyed (a descendant of the 3rd Shiʿite Imam)' and a noted cleric formed at Najaf; the son studied Ahsai's books under a Shaikhi scholar and reached the point of not needing taqlid, and a decree from 'the Shiʿite seminary at Najaf' later pronounced him 'politically corrupt' — lineage, education and conflict, none of it an attestation of the son's own school."
