summary:
  ar: "مقالة ويكيبيديا الروسية عن جعفر سيدامت؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 1 سبتمبر 1889 في قرية قيزيل طاش بقضاء يالطا ووفاته في 3 أبريل 1960 في إسطنبول، وتفصّل نشاطه السياسي ومؤلفاته واتخاذه لقب قريمر سنة 1934؛ ولا تتضمن أي محتوى ديني عنه."
  en: "Russian Wikipedia article on Djafer Seydamet; used for entity facts only. It gives his birth on 1 September 1889 at Kiziltash village in the Yalta district and his death on 3 April 1960 in Istanbul, and details his political activity, his works and his adoption of the surname Kırımer in 1934; it contains no religion content about him."
  es: "Artículo de la Wikipedia en ruso sobre Djafer Seydamet; utilizado únicamente para datos biográficos. Indica su nacimiento el 1 de septiembre de 1889 en la aldea de Kiziltash, en el distrito de Yalta, y su fallecimiento el 3 de abril de 1960 en Estambul. Asimismo, detalla su actividad política, sus obras y la adopción del apellido Kırımer en 1934; no contiene información sobre su religión."
  fr: "Article de Wikipédia en russe sur Djafer Seydamet; utilisé uniquement pour des informations biographiques. Il indique sa naissance le 1er septembre 1889 au village de Kiziltash, dans le district de Yalta, et son décès le 3 avril 1960 à Istanbul, et détaille son activité politique, ses œuvres et son adoption du nom de famille Kırımer en 1934; il ne contient aucune information religieuse à son sujet."
  ur: "Djafer Seydamet پر روسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ یکم ستمبر 1889 کو یالٹا ضلع کے گاؤں کِزلتاش میں ان کی پیدائش اور 3 اپریل 1960 کو استنبول میں ان کی موت، اور ان کی سیاسی سرگرمیوں، ان کے کاموں اور 1934 میں اس کے کنیت Kırımer کو اپنانے کی تفصیلات بیان کرتا ہے۔ اس میں اس کے بارے میں کوئی مذہبی مواد نہیں ہے۔"
