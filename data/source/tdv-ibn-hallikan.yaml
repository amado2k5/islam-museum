summary:
  ar: "مقالة «İbn Hallikân» لعبد الكريم أوزايدن في موسوعة TDV الإسلامية (1999)؛ ذُكرت في ملف بحث قُدّم إلى المتحف في 21 نوفمبر 2026، ولم يفتح المتحف المقالة، ووافق المؤسس على استعمال الملف دون إعادة تحقق. تُستعمل في: اسم ابن خلكان الكامل."
  en: "The article \"İbn Hallikân\" by Abdülkerim Özaydın in the TDV İslâm Ansiklopedisi (1999), named in a research file supplied to the museum on 21 November 2026; the museum did not open the article, and the founder approved using the file without re-verification. Used for: the full name of Ibn Khallikan."
  ur: "مضمون «İbn Hallikân» از عبدالکریم اوزایدن، TDV اسلامی انسائیکلوپیڈیا ⁦(1999ء)⁩؛ یہ عجائب گھر کو 21 نومبر 2026ء کو دی گئی تحقیقی فائل میں مذکور ہے، عجائب گھر نے مضمون نہیں کھولا اور بانی نے دوبارہ تصدیق کے بغیر فائل کے استعمال کی منظوری دی۔ استعمال: ابن خلکان کا مکمل نام۔"
  fr: "L'article « İbn Hallikân » d'Abdülkerim Özaydın dans la TDV İslâm Ansiklopedisi (1999), cité dans un fichier de recherche remis au musée le 21 novembre 2026 ; le musée n'a pas ouvert l'article, et le fondateur a approuvé l'usage du fichier sans nouvelle vérification. Utilisé pour : le nom complet d'Ibn Khallikan."
  es: "El artículo «İbn Hallikân» de Abdülkerim Özaydın en la TDV İslâm Ansiklopedisi (1999), citado en un archivo de investigación entregado al museo el 21 de noviembre de 2026; el museo no abrió el artículo, y el fundador aprobó usar el archivo sin volver a verificar. Usado para: el nombre completo de Ibn Khallikan."
