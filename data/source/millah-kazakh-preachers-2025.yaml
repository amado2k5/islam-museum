reliability_note: "A peer-reviewed journal article (received March 2025, published 30 August 2025), read in full on 4 November 2026. Its Table 1 ('Primary data') gives Instagram followers as of 31 January 2025: Kabylbek Alipbek (kabylbek.ustaz) 986 thousand; Nurlan Baizhigitov (nurlanimam.kz) 927 thousand; Nursultan Rysmaganbet (nursultan_rysmaganbet) 864 thousand; Arman Kuanyshbaev (armanustaz.kz) 814 thousand; Yersin Amre (yersin_amre) 429 thousand. The counts are the researchers' own dated measurements. The authors note the five are imams of the sanctioned clergy with advanced theological credentials, three of them connected with the Council of Islamic Scholars; their characterisations of each preacher's style are the researchers' analysis and are cited as such. The study names no legal school or Sufi order for any of the five personally. Its body text spells two names inconsistently ('Kabylbay Alipbek', 'Nursultan Rysmambetov'); the Table 1 spellings are followed and the variants preserved in the person records."
