  ar: "سيرة نعيم فراشري بقلم روبرت إلسي في موقع «الأدب الألباني»؛ تصف البكتاشية بأنها «دينه» هو، وتذكر تعلّقه بمعتقداتها منذ طفولته في فراشر، وتؤرخ «دفتر البكتاشية» بسنة 1896."
  en: "Robert Elsie's biography of Naim Frashëri on the Albanian Literature website; it calls Bektashism 'his pantheistic Bektashi religion', records his attachment to its beliefs since his childhood in Frashër, and dates the Bektashi Notebook to 1896."
