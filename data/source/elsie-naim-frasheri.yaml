reliability_note: "A scholarly biography by Robert Elsie (1950–2017), the standard Western historian of Albanian literature; read in full on 25 October 2026 and used for entity facts and for the faith attestation stated here. It gives: his childhood at Frashër, learning Turkish, Persian and Arabic and imbued at the Bektashi monastery 'with the spiritual traditions of the Orient'; at Ioannina 'his affinity for his pantheistic Bektashi religion' grew; his post as director of the board of censorship of the Turkish Ministry of Education, in which he could sometimes circumvent the ban on Albanian books, and his use of the initials N.H., N.H.F. and N.F. on sensitive publications; the Fletore e Bektashinjet (Bucharest 1896 — the English Wikipedia works list gives 1895, recorded as a variant) 'contains an introductory profession of Bektashi faith and ten spiritual poems', and 'Frashëri hoped that liberal Bektashi beliefs to which he had been attached since his childhood in Frashër would one day take hold as the new religion of all Albania'; Qerbelaja (Bucharest 1898) is 'a Shi'ite religious epic in twenty-five cantos'; Istori' e Skënderbeut (1898) runs to 11,500 verses. The statements about his own Bektashi religion are one of the record's three independent attestations of the affiliation itself."
