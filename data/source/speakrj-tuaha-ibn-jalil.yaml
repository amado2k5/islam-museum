  ar: "صفحة تدقيق SPEAKRJ لقناة طٰحہ ابن جلیل على يوتيوب؛ 1,910,000 مشترك في بيانات 3 نوفمبر 2026، وتنقل وصف القناة الذاتي: مرشد شباب ومدرب حياة ألقى محاضرات في TEDx وفي جامعات باكستانية."
  en: "SPEAKRJ audit page for Tuaha Ibn Jalil's YouTube channel: 1,910,000 subscribers in its data of 3 November 2026; it quotes the channel's own description — a youth mentor and life coach who has delivered talks at TEDx and at Pakistani institutes including LUMS, GIKI, NUST and BNU."
  es: "Página de auditoría de SPEAKRJ para el canal de YouTube de Tuaha Ibn Jalil: 1.910.000 suscriptores en sus datos del 3 de noviembre de 2026; cita la propia descripción del canal: un mentor juvenil y entrenador de vida que ha dado charlas en TEDx y en institutos pakistaníes como LUMS, GIKI, NUST y BNU."
  fr: "Page d'audit SPEAKRJ pour la chaîne YouTube de Tuaha Ibn Jalil: 1 910 000 abonnés selon ses données du 3 novembre 2026; elle cite la propre description de la chaîne: un mentor de jeunes et coach de vie qui a donné des conférences à TEDx et dans des instituts pakistanais, notamment LUMS, GIKI, NUST et BNU."
  ur: "طحہ ابن جلیل کے یوٹیوب چینل کے لیے سپیک آر جے آڈٹ صفحہ: 3 نومبر 2026 کے ڈیٹا میں 1,910,000 سبسکرائبرز؛ اس میں چینل کی اپنی تفصیل کا حوالہ دیا گیا ہے — ایک نوجوان رہنما اور لائف کوچ جس نے TEDx اور LUMS، GIKI، NUST اور BNU سمیت پاکستانی اداروں میں بات چیت کی ہے۔"
  tr: "SPEAKRJ Kanalı Denetim Sayfası, Taha İbn Jalil için YouTube'da; 3 Kasım 2026 verilerine 1.910.000 abone ve kanalın kendi tanımını aktarıyor: TEDx dersleri ve Pakistan üniversitelerinde vermiş genç mentor ve yaşam koçu."
  id: "Halaman Audit Saluran SPEAKRJ untuk Taha Ibn Jalil di YouTube; 1.910.000 pelanggan data 3 November 2026, dan ini menyampaikan deskripsi diri saluran tersebut: Mentor pemuda dan pelatih kehidupan yang telah memberikan kuliah TEDx dan di universitas-universitas Pakistan."
