label:
  ar: "المكتبة الافتراضية لمكتبة هيل للمخطوطات ⁦(vHMML)⁩: غرفة القراءة وبوابة البيانات"
  en: "vHMML Reading Room and Data Portal (Hill Museum & Manuscript Library)"
  ur: "وی ایچ ایم ایم ایل ریڈنگ روم اور ڈیٹا پورٹل ⁦(ہل میوزیم اینڈ مینوسکرپٹ لائبریری)⁩"
summary:
  ar: "المنصة الرقمية لمكتبة هيل للمخطوطات في جامعة القديس يوحنا بولاية مينيسوتا. تضم غرفة القراءة سجلات وصفية لمخطوطات ومطبوعات من مكتبات في العالم كله، بأرقام الحفظ وأرقام مشاريع المكتبة وروابط دائمة لكل سجل. والبيانات الوصفية فيها منشورة برخصة المشاع الإبداعي «نسبة المصنف ٤٫٠»، أما الصور فتحتفظ المكتبات الشريكة بحقوقها. هذا المصدر غير فهرس هيل المسجل باسم hmml، وهو يضيف بوابة البيانات المفتوحة."
  en: "The digital platform of the Hill Museum & Manuscript Library at Saint John's University, Minnesota. Its Reading Room holds descriptive records of manuscripts and printed books from libraries worldwide, each with a shelfmark, an HMML project number and a persistent URL. The metadata is published under a Creative Commons Attribution 4.0 licence; the images are not, because partner libraries keep their rights. This is a separate entry from the HMML catalogue registered as hmml, and it adds the open Data Portal."
  ur: "ہل میوزیم اینڈ مینوسکرپٹ لائبریری کا ڈیجیٹل پلیٹ فارم، جو سینٹ جانز یونیورسٹی، مینیسوٹا میں ہے۔ اس کے ریڈنگ روم میں دنیا بھر کی لائبریریوں کے مخطوطات اور مطبوعات کے وضاحتی ریکارڈ ہیں۔ ہر ریکارڈ کے ساتھ شیلف مارک، ایچ ایم ایم ایل پراجیکٹ نمبر اور مستقل لنک ہوتا ہے۔ میٹا ڈیٹا کری ایٹو کامنز انتساب ۴٫۰ اجازت نامے کے تحت شائع ہے۔ تصاویر اس کے تحت نہیں، کیونکہ ان کے حقوق شراکت دار لائبریریوں کے پاس ہیں۔ یہ اندراج ایچ ایم ایم ایل فہرست سے الگ ہے جو hmml کے نام سے درج ہے، اور اس میں کھلا ڈیٹا پورٹل شامل ہے۔"
title: "vHMML Reading Room and Data Portal"
publisher: "Hill Museum & Manuscript Library (HMML), Saint John's University, Collegeville, Minnesota"
URL: "https://www.vhmml.org"
language: multilingual
reliability_note: "Descriptive records of manuscripts and printed books made by a long-established specialist library (HMML), with shelfmark, repository, place of origin, language, script, colophon, provenance and date fields at the object, part and contents levels (schema: vhmml.org/dataPortal/schema, read 12 Nov 2026). Licence: the Terms of Use and the Data Portal dataset page state that the manuscript metadata in Reading Room and in Museum is available for reuse under Creative Commons Attribution 4.0 (vhmml.org/terms and vhmml.org/dataPortal/dataset, read 12 Nov 2026); the museum's {cite:vhmml <HMML project number>} is the attribution. Images are not open: partner libraries (Beinecke, the Vatican Library, the Bodleian, the British Library, Laon and others) keep their rights, and the images HMML owns are CC BY-NC 4.0; the museum fetches and republishes no image, and vhmml.org/robots.txt (read 12 Nov 2026) disallows /image/. Anchor: the HMML project number, with repository and shelfmark; the record's own PURL field gives the persistent link. Harvest channel: public record pages and the Data Portal search at a polite pace; the weekly bulk datasets (JSON 48 MB, a 3 MB listing in JSON and CSV, updated 9 Nov 2026) are documented but have NOT been downloaded, because a download needs the founder's separate permission; nothing from login-gated Reading Room content is used and no account is made. Posture: open for metadata, restated in the museum's own words as facts. Citable for what a manuscript is, where it is kept, how it is dated and described; a colophon's information is reported as the cataloguer's description, never as text republished. Coverage for the Islamic gap is not yet measured: the collection leans toward Christian manuscripts (Syriac, Ethiopic, Greek, Latin), and the Arabic-Islamic share is unverified until a listing is read. A separate entry from source/hmml (the hmml.org catalogue); the same institution, a different platform and licence statement. Tier 2. Assessment: web-sources lane, 12 Nov 2026; registered on the founder's approval of four pilot sources, 12 Nov 2026."
