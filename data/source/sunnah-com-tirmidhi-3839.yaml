  id: "Halaman «Jami al-Tirmidhi, hadis 3839» pada tahun Sunnah.com; disebutkan dalam berkas penelitian yang diajukan ke museum pada 21 November 2026, tetapi museum tidak membuka halaman tersebut, dan pendiri setuju menggunakan berkas tersebut tanpa verifikasi ulang. Digunakan dalam: hadis yang disebutkan dalam berkas mengenai nama dan kunya."
