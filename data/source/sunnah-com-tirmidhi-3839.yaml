  es: "La página «Jami al-Tirmidhi, hadith 3839» (Sunnah.com), citada en un archivo de investigación entregado al museo el 21 de noviembre de 2026; el museo no abrió la página, y el fundador aprobó usar el archivo sin volver a verificar. Usada para: el hadiz que el archivo da sobre nombres y kunyas."
