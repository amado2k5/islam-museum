reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026, and its content checked against the recorded revision. It gives his birth at Dakar on 1 October 1959, Rolling Stone's 2004 description of him, his start at the age of 12 and his years with the Star Band and then Étoile de Dakar — whose 1979 date in this article sits a year later than the English article's account (1978, with the split into Super Étoile following) — his mother's griot connection and his self-description as a modern griot, his role in Amazing Grace (2006), and a list of albums. The article states no religion for him; the record's faith segment rests on the English and French articles."
