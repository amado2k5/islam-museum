summary:
  ar: "مدخل «كشيش» في موسوعة TDV الإسلامية: كلمة فارسية سريانية الأصل تعني الشيخ والعابد عند النصارى، تقابلها العربية قسّ وقسّيس؛ ونمطا الرهبنة: المنزوي وحده والجماعي في الدير، ومراسم الدخول والزي والتقشف والفقر والعزوبة والطاعة، ونظام الدير وعمل الرهبان في نسخ الكتب والتعليم والتبشير، ونشأة الرهبنة في مصر مع أنطونيوس وباخوميوس وانتشارها في سيناء وفلسطين وسورية وشمال بلاد ما بين النهرين والأناضول."
  en: "The TDV İslâm Ansiklopedisi entry on the keşiş: a Persian word from Syriac keshshîshâ for the Christian elder and ascetic, Arabic qass and qissîs; the two forms of monastic life, the solitary hermit and the cenobite of the monastery; the entry rite, distinctive dress and tonsure, poverty, celibacy and obedience; the regulated monastery day and the monks' work of copying, teaching and mission; and the rise of monasticism in Egypt with Antony and Pachomius and its spread to Sinai, Palestine, Syria, northern Mesopotamia and Anatolia."
  es: "La entrada de la TDV İslâm Ansiklopedisi sobre el keşiş: una palabra persa del siríaco keshshîshâ para el anciano cristiano y asceta, del árabe qass y qissîs; las dos formas de vida monástica, el ermitaño solitario y el cenobita del monasterio; el rito de entrada, la vestimenta y tonsura distintivas, la pobreza, el celibato y la obediencia; el día monástico regulado y el trabajo de los monjes de copiar, enseñar y realizar misiones; y el surgimiento del monacato en Egipto con Antonio y Pacomio y su expansión al Sinaí, Palestina, Siria, el norte de Mesopotamia y Anatolia."
  fr: "L'article de TDV İslâm Ansiklopedisi sur le keşiş: un mot persan issu du syriaque keshshîshâ désignant l'ancien et l'ascète chrétien, et des termes arabes qass et qissîs; les deux formes de vie monastique, l'ermite solitaire et le cénobite du monastère; le rite d'entrée, le vêtement et la tonsure distinctifs, la pauvreté, le célibat et l'obéissance; la journée monastique réglementée et le travail des moines, à savoir la copie, l'enseignement et la mission; et l'essor du monachisme en Égypte avec Antoine et Pachôme et sa diffusion au Sinaï, en Palestine, en Syrie, en Mésopotamie septentrionale et en Anatolie."
