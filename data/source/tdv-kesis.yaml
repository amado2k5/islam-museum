summary:
  ar: "مدخل «كشيش» في موسوعة TDV الإسلامية: كلمة فارسية سريانية الأصل تعني الشيخ والعابد عند النصارى، تقابلها العربية قسّ وقسّيس؛ ونمطا الرهبنة: المنزوي وحده والجماعي في الدير، ومراسم الدخول والزي والتقشف والفقر والعزوبة والطاعة، ونظام الدير وعمل الرهبان في نسخ الكتب والتعليم والتبشير، ونشأة الرهبنة في مصر مع أنطونيوس وباخوميوس وانتشارها في سيناء وفلسطين وسورية وشمال بلاد ما بين النهرين والأناضول."
  en: "The TDV İslâm Ansiklopedisi entry on the keşiş: a Persian word from Syriac keshshîshâ for the Christian elder and ascetic, Arabic qass and qissîs; the two forms of monastic life, the solitary hermit and the cenobite of the monastery; the entry rite, distinctive dress and tonsure, poverty, celibacy and obedience; the regulated monastery day and the monks' work of copying, teaching and mission; and the rise of monasticism in Egypt with Antony and Pachomius and its spread to Sinai, Palestine, Syria, northern Mesopotamia and Anatolia."
