summary:
  ar: "مدخل «جام» في موسوعة TDV الإسلامية: تاريخ صناعة الزجاج وتقنياتها من العصور القديمة إلى الزجاج المملوكي المذهّب والمينائي وورش بايقوز العثمانية وزجاج الروزن المنقوش."
  en: "The TDV İslâm Ansiklopedisi entry on glass: the history and techniques of glassmaking from antiquity to Mamluk gilded and enamelled mosque lamps, the Ottoman Beykoz workshops, and revzen-i menkūş stained glass."
  es: "La entrada de TDV İslâm Ansiklopedisi sobre el vidrio: la historia y las técnicas de la fabricación de vidrio desde la antigüedad hasta las lámparas de mezquita mamelucas doradas y esmaltadas, los talleres otomanos de Beykoz y las vidrieras revzen-i menkūş."
  fr: "L'article de TDV İslâm Ansiklopedisi sur le verre: l'histoire et les techniques de fabrication du verre de l'Antiquité aux lampes de mosquée dorées et émaillées mameloukes, aux ateliers ottomans de Beykoz et aux vitraux revzen-i menkūş."
  ur: "شیشے پر TDV İslâm Ansiklopedisi اندراج: قدیم دور سے لے کر مملوک تک شیشہ سازی کی تاریخ اور تکنیکوں کو گلڈڈ اور اینامیلڈ مسجد کے لیمپ، عثمانی بیکوز ورکشاپس، اور ریوزن-i menkūş داغدار شیشے۔"
  tr: "TDV İslami Ansiklopedisi'nde \"Reçel\" maddesi: Cam yapımının tarihi ve teknikleri, antik çağlardan Memlük yaldızlı ve portlu cam, Osmanlı Baykuz atölyeleri ve desenli reçine camına kadar."
  id: "Entri \"Jam\" dalam Ensiklopedia Islam TDV: Sejarah pembuatan kaca dan tekniknya dari zaman kuno hingga kaca berlapis emas dan port Mamluk, bengkel Baykuz Ottoman, dan kaca rosin bermotif."
