label: { en: "Fulcrum (ISEAS) 2026 — Wadi Annuar's 'Ride Dakwah Anak Muda' and follower counts" }
summary:
  ar: "تعليق تحليلي في مجلة Fulcrum ⁦(معهد ISEAS)⁩ بقلم شريفة أفرا ألاتاس، 1 أكتوبر 2026، عن مبادرة وادي أنوار «ركوب دعوة الشباب» في ألور ستار بولاية قدح؛ يسجل 1.3 مليون متابع له على إنستغرام و3.4 مليون على تيك توك وحضورا بلغ 40 ألفا في فعالية 19 سبتمبر 2026."
  en: "ISEAS Fulcrum commentary by Sharifah Afra Alatas, 1 October 2026, on Wadi Annuar's 'Ride Dakwah Anak Muda' initiative in Alor Setar, Kedah; it records his 1.3 million Instagram and 3.4 million TikTok followers and the 40,000 attendees at the 19 September 2026 gathering."
  es: "Comentario de ISEAS Fulcrum, escrito por Sharifah Afra Alatas el 1 de octubre de 2026, sobre la iniciativa 'Ride Dakwah Anak Muda' de Wadi Annuar en Alor Setar, Kedah; recoge sus 1,3 millones de seguidores en Instagram y 3,4 millones en TikTok, así como los 40.000 asistentes a la reunión del 19 de septiembre de 2026."
  fr: "Commentaire ISEAS Fulcrum de Sharifah Afra Alatas, 1er octobre 2026, sur l'initiative « Ride Dakwah Anak Muda » de Wadi Annuar à Alor Setar, Kedah; il fait état de ses 1,3 million d'abonnés sur Instagram et de ses 3,4 millions d'abonnés sur TikTok, ainsi que des 40 000 participants au rassemblement du 19 septembre 2026."
  ur: "ISEAS Fulcrum commentary by Sharifah Afra Alatas, 1 اکتوبر 2026, Alor Setar, Kedah میں Wadi Annuar کے 'Ride Dakwah Anak Muda' پہل پر؛ یہ 19 ستمبر 2026 کے اجتماع میں اس کے 1.3 ملین انسٹاگرام اور 3.4 ملین TikTok فالوورز اور 40,000 حاضرین کو ریکارڈ کرتا ہے۔"
