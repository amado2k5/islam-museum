reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 24 October 2026; created and edited by German academics (a MENA-history professor among them) and resting on the standard research literature (Malika Zeghal; Rainer Brunner, 2001/2004; Florence Costet-Tardieu; Martin Kramer; Elie Kedourie). It gives: family of large landowners in al-Maragha, Sohag; 'alimiyya 1904; Grand Qadi of the Sudan August 1908 – May 1919 (Kedourie: 'an ardent supporter of British rule' up to the First World War); president of Cairo's Supreme Sharia Court 1923; member of the 1924 caliphate committee, where his letter to Wingate argued the caliph need not be of Quraysh and that the caliphate was a largely worldly office; the secret July–August 1925 mission to Mecca and Medina on Fu'ad's caliphate ambitions; main organiser of the 1926 Cairo Caliphate Congress; first appointment as Sheikh al-Azhar on 22 May 1928; his August 1928 reform memorandum; his dismissal amid the king's wish to control Azhar appointments and the ensuing ulama revolt (70 dismissed); his 1932 treatise on the permissibility of translating the Qur'an, in which he invoked a Hanafi argument (a school position he used, not an affiliation he claimed); reappointment in April 1935; the 1936 law; the Corps of Senior Scholars reform; his close dialogue with the Twelver Shia scholar Abd al-Karim al-Zanjani of Najaf; his February 1938 proposal, after meeting the Aga Khan III, of a Cairo Supreme Islamic Council for Sunni–Shia rapprochement, which met scepticism from Shia scholars and failed; and his support for Faruq's caliphate ambitions, with Lampson's attributed suspicion of his motives. It nowhere assigns him a madhhab — a silence the record's faith note relies on; what it documents is a reformer who worked across the schools."
