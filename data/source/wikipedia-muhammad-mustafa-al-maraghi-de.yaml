  ar: "مقالة ويكيبيديا الألمانية عن محمد مصطفى المراغي؛ تُستخدم لوقائع الكيان فقط. أنشأها أكاديميون ألمان وتستند إلى زغال وبرونر وكوستيه-تارديو، وتوثّق إصلاحاته ومهمته السرية إلى الحجاز سنة 1925 ومقترحه سنة 1938 مجلسا إسلاميا أعلى للتقريب بين المذاهب، ولا تسمّي له مذهبا."
