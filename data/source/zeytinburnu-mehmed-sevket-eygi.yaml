label:
  en: "Müslüman Bir Münevverin Portresi: Mehmed Şevket Eygi — Zeytinburnu Belediyesi memorial volume"
summary:
  ar: "كتاب تذكاري أصدرته بلدية زيتين بورنو في إسطنبول عن محمد شوكت أيغي: قسم أول كتبه مَن عرفوه، وقسم ثانٍ من أحاديثه في مركز زيتين بورنو الثقافي (2018–2019). يصف الكتاب الرجل بأنه «يتمسّك بأهل السنة والجماعة، فرقة الناجية، ويدعمها» ويرفض إسلامًا «خفيفًا» أو مُصلَحًا."
  en: "Memorial volume published by Istanbul's Zeytinburnu Municipality on Mehmed Şevket Eygi: a first part written by people who knew him, and a second part from his talks at the Zeytinburnu Cultural Centre (2018–2019). Of the man himself it says he 'holds to and supports the Ahl al-Sunnah wa'l-Jama'a, the saved sect' (Fırka-ı Nâciye olan Ehli Sünnet vel Cemaati tutuyor, destekliyor) and rejected reformist or 'light' Islam."
  es: "Volumen conmemorativo publicado por el municipio de Zeytinburnu de Estambul sobre Mehmed Şevket Eygi: una primera parte escrita por personas que lo conocieron y una segunda parte con sus charlas en el Centro Cultural de Zeytinburnu (2018-2019). Sobre él mismo se dice que \"se adhiere y apoya a Ahl al-Sunnah wa'l-Jama'a, la secta salvada\" (Fırka-ı Nâciye olan Ehli Sünnet vel Cemaati tutuyor, destekliyor) y rechaza el islam reformista o \"ligero\"."
  fr: "Un ouvrage commémoratif publié par la municipalité de Zeytinburnu à Istanbul en hommage à Mehmed Şevket Eygi se compose d'une première partie rédigée par des personnes qui l'ont connu, et d'une seconde partie reprenant ses interventions au Centre culturel de Zeytinburnu (2018-2019). Il y est dit de lui qu'il « adhère et soutient l'Ahl al-Sunnah wa'l-Jama'a, la secte sauvée » (Fırka-ı Nâciye olan Ehli Sünnet vel Cemaati tutuyor, destekliyor) et rejette l'islam réformiste ou « léger »."
  ur: "استنبول کی زیتن برنو میونسپلٹی کی جانب سے محمد Şevket Eygi پر شائع کردہ یادگاری جلد: پہلا حصہ ان لوگوں کی طرف سے لکھا گیا جو اسے جانتے تھے، اور دوسرا حصہ زیٹن برنو ثقافتی مرکز (2018–2019) میں ان کی گفتگو سے۔ خود اس شخص کے بارے میں یہ کہتا ہے کہ وہ 'اہل السنۃ والجماعۃ، محفوظ شدہ فرقہ' (Fırka-ı Nâciye olan Ehli Sünnet vel Cemaati tutuyor, destekliyor) اور مسترد شدہ اصلاح پسند یا 'روشنی' اسلام کا حامل اور حمایت کرتا ہے۔"
  tr: "İstanbul Zeytinburnu Belediyesi tarafından yayımlanan Mehmet Şevkat Ayğı hakkında yayımlanan bir anma kitabı: kitaplarının ilk kısmı onu tanıyanlara, ikinci kısmı ise Zeytinburnu Kültür Merkezi'ndeki konuşmalarına (2018–2019) aittir. Kitap, adamı \"Ehl-sünnet vel-Cema'ah'a, Najiya mezhebine bağlı ve destekçi\" olarak tanımlar ve \"ışık\" ya da reformcu İslam'ı reddeder."
  id: "Sebuah buku peringatan yang diterbitkan oleh Pemerintah Kota Zeytinburnu di Istanbul tentang Mehmet Şevkat Ayğı: bagian pertama dari bukunya adalah mereka yang mengenalnya, dan bagian kedua adalah ceramahnya di Pusat Kebudayaan Zeytinburnu (2018–2019). Buku tersebut menggambarkan pria tersebut sebagai \"menganut Ahl al-Sunnah wal-Jama'ah, sekte Najiya, dan mendukungnya\" serta menolak Islam \"cahaya\" atau reformis."
