summary:
  ar: "كتاب تذكاري أصدرته بلدية زيتين بورنو في إسطنبول عن محمد شوكت أيغي: قسم أول كتبه مَن عرفوه، وقسم ثانٍ من أحاديثه في مركز زيتين بورنو الثقافي (2018–2019). يصف الكتاب الرجل بأنه «يتمسّك بأهل السنة والجماعة، فرقة الناجية، ويدعمها» ويرفض إسلامًا «خفيفًا» أو مُصلَحًا."
  en: "Memorial volume published by Istanbul's Zeytinburnu Municipality on Mehmed Şevket Eygi: a first part written by people who knew him, and a second part from his talks at the Zeytinburnu Cultural Centre (2018–2019). Of the man himself it says he 'holds to and supports the Ahl al-Sunnah wa'l-Jama'a, the saved sect' (Fırka-ı Nâciye olan Ehli Sünnet vel Cemaati tutuyor, destekliyor) and rejected reformist or 'light' Islam."
