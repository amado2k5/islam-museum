reliability_note: "Municipal memorial volume read as a PDF on 3 November 2026; the text layer is partly garbled by the book's two-column layout, but the passage attesting Eygi's own adherence to the Ahl al-Sunnah wa'l-Jama'a was read in a clean, continuous passage and is quoted verbatim in the person record. A commemorative volume by his own municipality and circle is a sympathetic source; it is used for his professed affiliation and self-presentation, and the critical record is taken from the encyclopedia articles and the scholarship they cite."
