summary:
  ar: "مقال ريتشارد كوفينغتون في مجلة سعودي أرامكو ورلد سنة 2004 عن عبد الستار إيدهي ومؤسسته؛ يُستخدم لوقائع الكيان فقط. يروي المقال عمل فيصل إيدهي الشاب مسؤولًا عن خدمة الإسعاف في المؤسسة ويعطي عمره 26 سنة، وطفولته مرافقًا أباه في استرجاع الجثث وركوب سيارات الإسعاف، واجتماعات الأسرة الأسبوعية لإدارة المؤسسة."
  en: "Richard Covington's 2004 Saudi Aramco World feature on Abdul Sattar Edhi and his foundation; used for entity facts only. It shows the young Faisal Edhi in charge of the foundation's ambulance service, gives his age as 26, and recounts his childhood accompanying his father on corpse recoveries and ambulance calls and the family's Sunday meetings running the foundation."
