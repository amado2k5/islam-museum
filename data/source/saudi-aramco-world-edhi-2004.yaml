summary:
  ar: "مقال ريتشارد كوفينغتون في مجلة سعودي أرامكو ورلد سنة 2004 عن عبد الستار إيدهي ومؤسسته؛ يُستخدم لوقائع الكيان فقط. يروي المقال عمل فيصل إيدهي الشاب مسؤولًا عن خدمة الإسعاف في المؤسسة ويعطي عمره 26 سنة، وطفولته مرافقًا أباه في استرجاع الجثث وركوب سيارات الإسعاف، واجتماعات الأسرة الأسبوعية لإدارة المؤسسة."
  en: "Richard Covington's 2004 Saudi Aramco World feature on Abdul Sattar Edhi and his foundation; used for entity facts only. It shows the young Faisal Edhi in charge of the foundation's ambulance service, gives his age as 26, and recounts his childhood accompanying his father on corpse recoveries and ambulance calls and the family's Sunday meetings running the foundation."
  es: "El reportaje de Richard Covington para Saudi Aramco World de 2004 sobre Abdul Sattar Edhi y su fundación se utiliza únicamente para obtener información sobre la entidad. Muestra al joven Faisal Edhi a cargo del servicio de ambulancias de la fundación, indica que tiene 26 años y relata su infancia acompañando a su padre en recuperaciones de cadáveres y llamadas de ambulancia, así como las reuniones familiares de los domingos para dirigir la fundación."
  fr: "L'article de Richard Covington paru en 2004 dans Saudi Aramco World, consacré à Abdul Sattar Edhi et à sa fondation, est utilisé à titre informatif uniquement. On y voit le jeune Faisal Edhi à la tête du service d'ambulances de la fondation, son âge (26 ans) est indiqué, et le texte relate son enfance passée à accompagner son père lors des interventions d'urgence et des récupérations de corps, ainsi que les réunions familiales du dimanche consacrées à la gestion de la fondation."
