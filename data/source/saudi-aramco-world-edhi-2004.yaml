reliability_note: "Read in full on 27 October 2026 in its republication on Shahidul Alam's news site (Alam was the feature's photographer; the page states it was originally published in Saudi Aramco World, 2004). Its internal dates agree with 2004: Edhi is 'now 76 years old' (born February 1928) and the clinics described were set up for victims of the 2001 Afghan war. The age it gives for Faisal — 26 — implies a birth year of c. 1977–78 and is the only age evidence in any serious source; it conflicts with the century queue's 1975, and no source anywhere gives Faisal Edhi a birth date, so no born block is written in his record. The piece names Faisal as Edhi's son and shows Bilquis as the children's mother in the family it portrays."
