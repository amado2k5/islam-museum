  en: "German Wikipedia article on Ma al-'Aynayn al-Qalqami; used for entity facts only. It describes him as the son of the leader of the Qadiriyya Fadiliyya brotherhood and says that after his father's death in 1869 he founded a new brotherhood, and attributes to him an influence from Wahhabi and Sanusi teachings."
