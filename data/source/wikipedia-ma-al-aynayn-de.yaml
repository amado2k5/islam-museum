reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. A short article: twelfth son of Muhammad Fadil, 'Anführers der Qādirīya-Bruderorden Fādilīya' (leader of the Qadiriyya brotherhood-order Fadiliyya); after his father's death in 1869 (a year the other articles do not give) he withdrew to study theology and mysticism and asceticism and 'gründete einen neuen Bruderschaftsorden' — founded a new brotherhood order (his own continuation of the Fadili line, which the Arabic article names a tariqa Ma'ayniyya after him); the article adds that he was influenced by Wahhabi and Sanusi teachings, a claim carried only as this article's attributed statement; he had the zawiya of Smara built in 1898 and in 1905 called for jihad against the French and Spanish in the Sahara and Morocco; his brotherhood's branches are given as including Marrakesh and Fes; died at Tiznit in 1910. The father's Qadiriyya headship here is context; the record's sufi segment rests on the English article's investiture of Ma al-'Aynayn himself with the Arabic and French articles, as the faith note states."
