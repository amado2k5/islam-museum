summary:
  ar: "صفحة نجوم قناة هدى الرسمية للدكتور محمد صلاح: حاصل على الدكتوراه في الفقه المقارن، وماجستير إدارة الأعمال في الدراسات الإسلامية من كلية كلوفرديل بالولايات المتحدة، وبكالوريوس الشريعة والقانون الإسلامي من جامعة الأزهر وبكالوريوس الصيدلة؛ وهو المشرف الديني للقناة ومقدّم برامجها «اسأل هدى» و«صحّح تلاوتك» و«رياض الصالحين»."
  en: "Huda TV's official 'Huda Stars' profile of Dr. Muhammad Salah: PhD holder in Comparative Fiqh, MBA in Islamic Studies from Cloverdale College, USA, BA in Shari'ah and Islamic Law from Al-Azhar University in Egypt and a BA in pharmacology; the channel's religious supervisor and presenter of its programmes Ask Huda, Correct Your Recitation and Gardens of the Pious."
  es: "Perfil oficial de Huda TV en 'Huda Stars' del Dr. Muhammad Salah: Doctor en Fiqh Comparado, MBA en Estudios Islámicos por el Cloverdale College de EE. UU., Licenciado en Sharia y Derecho Islámico por la Universidad de Al-Azhar en Egipto y Licenciado en Farmacología; supervisor religioso del canal y presentador de sus programas Ask Huda, Corrige Your Recitation y Gardens of the Pious."
  fr: "Profil officiel « Huda Stars » du Dr Muhammad Salah sur Huda TV: titulaire d’un doctorat en fiqh comparé, d’un MBA en études islamiques du Cloverdale College (États-Unis), d’une licence en charia et droit islamique de l’université Al-Azhar (Égypte) et d’une licence en pharmacologie; superviseur religieux de la chaîne et présentateur des émissions Ask Huda, Correct Your Recitation et Gardens of the Pious."
  ur: "ہڈا ٹی وی کا آفیشل 'ہڈا اسٹارز' ڈاکٹر محمد صلاح کا پروفائل: تقابلی فقہ میں پی ایچ ڈی ہولڈر، کلورڈیل کالج، یو ایس اے سے اسلامک اسٹڈیز میں ایم بی اے، مصر کی الازہر یونیورسٹی سے شریعت اور اسلامی قانون میں بی اے اور فارماکولوجی میں بی اے؛ چینل کے مذہبی سپروائزر اور اس کے پروگرام پیش کرنے والے ہدہ سے پوچھیں، اپنی تلاوت کو درست کریں اور پرہیزگاروں کے باغات۔"
  tr: "Dr. Mohamed Salah için resmi Huda Channel Stars sayfası: Karşılaştırmalı Hukuk alanında doktora, Amerika Birleşik Devletleri'ndeki Cloverdale College'dan İslami Bilimler alanında MBA, El-Ezher Üniversitesi'nden Şeriat ve İslam Hukuku lisans derecesi ve Eczacılık lisans derecesine sahiptir; kanalın dini süpervizörü ve \"Huda'ya Sor,\" \"Okumanı Düzelt\" ve \"Riyad El-Salihin\" programlarının sunucusudur."
  id: "Halaman resmi Huda Channel Stars untuk Dr. Mohamed Salah: Ia memiliki gelar PhD dalam Hukum Komparatif, MBA dalam Studi Islam dari Cloverdale College di Amerika Serikat, gelar Sarjana Syariah dan Hukum Islam dari Universitas Al-Azhar, serta Sarjana Farmasi; ia adalah pembimbing agama saluran tersebut dan pembawa acara program \"Ask Huda,\" \"Correct Your Recitation,\" dan \"Riyadh Al-Salihin.\""
