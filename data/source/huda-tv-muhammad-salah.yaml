  ar: "صفحة نجوم قناة هدى الرسمية للدكتور محمد صلاح: حاصل على الدكتوراه في الفقه المقارن، وماجستير إدارة الأعمال في الدراسات الإسلامية من كلية كلوفرديل بالولايات المتحدة، وبكالوريوس الشريعة والقانون الإسلامي من جامعة الأزهر وبكالوريوس الصيدلة؛ وهو المشرف الديني للقناة ومقدّم برامجها «اسأل هدى» و«صحّح تلاوتك» و«رياض الصالحين»."
  en: "Huda TV's official 'Huda Stars' profile of Dr. Muhammad Salah: PhD holder in Comparative Fiqh, MBA in Islamic Studies from Cloverdale College, USA, BA in Shari'ah and Islamic Law from Al-Azhar University in Egypt and a BA in pharmacology; the channel's religious supervisor and presenter of its programmes Ask Huda, Correct Your Recitation and Gardens of the Pious."
