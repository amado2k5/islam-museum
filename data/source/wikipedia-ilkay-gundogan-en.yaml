summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن إيلكاي غوندوغان؛ تُستخدم لوقائع الكيان فقط. تروي فوزه بثنائية الدوري والكأس مع بوروسيا دورتموند، وقيادته مانشستر سيتي إلى ثلاثية 2022–23، وفترته مع برشلونة وانتقاله إلى غلطة سراي، ودولياته مع ألمانيا، وتذكر في حياته الشخصية أنه مسلم."
  en: "English Wikipedia article on İlkay Gündoğan; used for entity facts only. It recounts his league-and-cup double with Borussia Dortmund, his captaincy of Manchester City's 2022–23 treble, his season at Barcelona and move to Galatasaray, and his Germany career; its Personal life section states that he is a Muslim."
  es: "Artículo de la Wikipedia en inglés sobre İlkay Gündoğan; utilizado únicamente para obtener información sobre él. Relata su doblete de liga y copa con el Borussia Dortmund, su capitanía en el triplete del Manchester City en la temporada 2022-23, su temporada en el Barcelona y su fichaje por el Galatasaray, y su trayectoria en Alemania; en la sección de Vida personal se indica que es musulmán."
  fr: "Article Wikipédia en anglais consacré à İlkay Gündoğan; utilisé uniquement pour les informations relatives à l'entité. Il relate son doublé championnat-coupe avec le Borussia Dortmund, son capitanat lors du triplé de Manchester City en 2022-2023, sa saison à Barcelone et son transfert à Galatasaray, ainsi que sa carrière en équipe d'Allemagne; la section « Vie personnelle » précise qu'il est musulman."
  ur: "İlkay Gündoğan پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں بورسیا ڈورٹمنڈ کے ساتھ اس کے لیگ اور کپ ڈبل، مانچسٹر سٹی کے 2022-23 ٹریبل کی اس کی کپتانی، بارسلونا میں اس کا سیزن اور گالاتاسرے منتقل ہونے، اور اس کے جرمنی کیرئیر کا ذکر ہے۔ اس کے ذاتی زندگی کے حصے میں کہا گیا ہے کہ وہ مسلمان ہے۔"
  tr: "İlkay Gündoğan hakkında İngilizce Wikipedia makalesi; yalnızca kurumun gerçekleri için kullanılmıştır. Borussia Dortmund ile lig ve kupa çift zaferlerini, Manchester City'yi 2022–23 sezonunda üçlüğe taşıdığını, Barcelona'daki dönemini ve Galatasaray'a transferini, Almanya ile oynadığı uluslararası maçları ve kişisel hayatında Müslüman olduğunu anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang İlkay Gündoğan; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kemenangan ganda liga dan piala bersama Borussia Dortmund, membawa Manchester City meraih treble pada musim 2022–23, waktunya bersama Barcelona dan transfer ke Galatasaray, pertandingan internasionalnya melawan Jerman, dan menyebutkan dalam kehidupan pribadinya bahwa dia seorang Muslim."
