reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 — the career and personal life in full; the reading route did not expose a revision id, so the consultation date is recorded in place of a revision. It gives Gündoğan as born on 24 October 1990 in Gelsenkirchen, North Rhine-Westphalia, to Turkish parents, his paternal grandfather a guest worker from Balıkesir; a midfielder for Borussia Dortmund (Bundesliga and DFB-Pokal 2011–12), Manchester City (five league titles; captain of the 2022–23 continental treble), Barcelona, Manchester City again and Galatasaray from September 2025; a Germany international with 82 caps who captained Germany at Euro 2024. Its Personal life section states in the article's own voice 'Gündoğan is a Muslim', citing Arab News of 16 June 2018 and The Independent of 28 November 2022 — a generic identification of Islam for him personally; no school is named anywhere in the article."
