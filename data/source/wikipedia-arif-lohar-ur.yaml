  es: "Artículo de enciclopedia editado por la comunidad en urdu, recuperado íntegramente en la revisión indicada; en él se menciona su nacimiento el 18 de abril de 1966 y se le nombra como hijo de Alam Lohar, pero se sitúa su nacimiento en Lalamusa, mientras que la biografía en inglés menciona el pueblo de Achh; esta variante se conserva en el registro de la persona."
  fr: "Article encyclopédique édité par la communauté en ourdou, récupéré intégralement à la révision indiquée; il donne sa naissance le 18 avril 1966 et le nomme fils d'Alam Lohar, mais situe sa naissance à Lalamusa alors que la biographie anglaise donne le village d'Achh — la variante est conservée dans la fiche de la personne."
