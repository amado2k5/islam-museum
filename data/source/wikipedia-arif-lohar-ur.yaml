  en: "Community-edited encyclopedia article in Urdu, retrieved in full at the stated revision; it gives his birth on 18 April 1966 and names him as Alam Lohar's son, but places his birth at Lalamusa where the English biography gives the village of Achh — the variant is preserved in the person record."
