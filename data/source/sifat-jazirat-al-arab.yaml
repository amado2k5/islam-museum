  fr: "Le Sifat Jazirat al-Arab d'Al-Hamdani dans l'édition de David Heinrich Müller de Leiden de 1884 — la géographie la plus complète de la péninsule arabique qui nous soit parvenue; numérisé et traité par OCR Apple-Vision à la bibliothèque locale Harvest."
