  ar: "صفة جزيرة العرب للحسن بن أحمد بن يعقوب الهمداني ⁦(ت 334هـ)⁩ بتحقيق ديفيد هاينريش مولر ⁦(ليدن 1884م)⁩ — أتمّ جغرافيا باقية لشبه الجزيرة العربية قبل الإسلام وبعده؛ نسخة رقمية ممسوحة في مكتبة الحصاد المحلية أُجريت عليها قراءة آلية بآبل فيجن."
  en: "Al-Hamdani's Sifat Jazirat al-Arab in David Heinrich Müller's Leiden 1884 edition — the fullest surviving geography of the Arabian peninsula; scanned and Apple-Vision OCR'd in the local harvest library."
