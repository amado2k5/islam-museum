summary:
  ar: "مقالة ويكيبيديا التركية عن نهاد خطيب أوغلو ⁦(المولود 1955)⁩، عالم الحديث التركي ورئيس جامعة غازي عنتاب للإسلام والعلوم والتقنية الأسبق ومقدّم برامج رمضان؛ تُستخدم لوقائع الكيان فقط، وتُستشهد بكل واقعة بمصدرها كما ذكرته المقالة."
  en: "Turkish Wikipedia article on Nihat Hatipoğlu (born 1955), the Turkish hadith scholar, founding rector of Gaziantep Islam Science and Technology University and Ramadan television presenter; used for entity facts only, each cited where the article gives its own source."
  es: "Artículo de la Wikipedia en turco sobre Nihat Hatipoğlu (nacido en 1955), erudito turco de hadices, rector fundador de la Universidad Islámica de Ciencia y Tecnología de Gaziantep y presentador de televisión durante el Ramadán; se utiliza únicamente para datos de la entidad, citados donde el artículo proporciona su propia fuente."
  fr: "Article de Wikipédia en turc sur Nihat Hatipoğlu (né en 1955), érudit turc en hadiths, recteur fondateur de l'Université islamique des sciences et technologies de Gaziantep et présentateur de télévision du Ramadan; utilisé uniquement pour les faits concernant l'entité, chacun étant cité lorsque l'article donne sa propre source."
  ur: "ترکی ویکیپیڈیا مضمون نہات ہاتیپوگلو ⁦(پیدائش 1955)⁩ پر، ترک حدیث کے اسکالر، غازیانتپ اسلام سائنس اینڈ ٹیکنالوجی یونیورسٹی کے بانی ریکٹر اور رمضان ٹیلی ویژن کے پیش کنندہ؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے، ہر ایک کا حوالہ دیا جاتا ہے جہاں مضمون اپنا ماخذ دیتا ہے۔"
  tr: "Türk hadis âlimi, Gaziantep İslam, Bilim ve Teknoloji Üniversitesi'nin eski başkanı ve Ramazan programı sunucusu Nihat Hatiboğlu (d. 1955) hakkında Türkçe Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılır ve her olay makalede belirtilen kaynağıyla birlikte belirtilir."
  id: "Artikel Wikipedia Turki tentang Nihat Hatiboğlu (lahir 1955), seorang ulama hadis Turki, mantan presiden Universitas Gaziantep Islam, Ilmu Pengetahuan dan Teknologi, serta pembawa acara program Ramadan; artikel ini hanya digunakan untuk fakta entitas, dan mengutip setiap insiden dengan sumbernya seperti yang disebutkan dalam artikel."
