reliability_note: "Read in the museum's session on 20 November 2026. It calls Kitab al-Ayn the first Arabic dictionary arranged by roots, covering all Arabic roots used and unused; says its preface is the first lexicographic document in the Arab tradition and sets out three principles (the letters are finite and can be ordered; a root has between two and five consonants; permutation of the roots); says the attribution to al-Khalil is disputed, that the preface itself gives strong proof that al-Khalil wrote it, that the extent of his share in the body of the book is an unresolved dispute, though there is (almost) consensus that the plan is his; and that al-Khalil arranged roots by articulation point beginning with ayn, the deepest letter in the throat, which influenced many later dictionaries. It also reports the debate on foreign influence: some scholars see Indian influence, others Greek; the entry reports Vivian Lowe's argument that the concepts of makhraj and hayyiz are static but flexible in application while the Indian sthana and karana are dynamic but rigid, and John Haywood's remark that al-Khalil's phonetic views were unlikely to be his own and probably came from the Sanskrit tradition, which the entry says rests on no scholarly evidence. Used for entity facts only."
