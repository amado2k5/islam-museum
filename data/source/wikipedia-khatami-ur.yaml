summary:
  ar: "مقالة ويكيبيديا الأردية عن محمد خاتمي؛ تُستخدم لوقائع الكيان فقط. تصفه بأنه عالم دين وسياسي إصلاحي ورئيس إيران الخامس، لكنها تخطئ في تاريخ ولادته فتعطيه 12 تشرين الأول 1931."
  en: "Urdu Wikipedia article on Mohammad Khatami; used for entity facts only. It calls him a religious scholar, cleric and reformist politician, the fifth president of Iran, but gives his birth erroneously as 12 October 1931."
  es: "Artículo de Wikipedia en urdu sobre Mohammad Khatami; utilizado únicamente para datos biográficos. Lo describe como un erudito religioso, clérigo y político reformista, el quinto presidente de Irán, pero erróneamente indica que nació el 12 de octubre de 1931."
  fr: "Article de Wikipédia en ourdou sur Mohammad Khatami; utilisé uniquement à titre informatif. Il le décrit comme un érudit religieux, un religieux et un homme politique réformateur, le cinquième président de l’Iran, mais indique par erreur sa date de naissance, le 12 octobre 1931."
  ur: "محمد خاتمی پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ انہیں ایک مذہبی اسکالر، عالم اور اصلاح پسند سیاست دان، ایران کا پانچواں صدر کہتا ہے، لیکن اس کی پیدائش غلطی سے 12 اکتوبر 1931 کو ہوئی۔"
  tr: "Muhammed Hatemi hakkında Urduca Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılır. Onu dini bir bilgin, reformcu politikacı ve İran'ın beşinci cumhurbaşkanı olarak tanımlar, ancak doğum tarihini 12 Ekim 1931 olarak yanlış vermektedir."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang Mohammad Khatami; hanya digunakan untuk fakta entitas tersebut. Artikel tersebut menggambarkannya sebagai seorang ulama agama, politisi reformis, dan presiden kelima Iran, tetapi salah tanggal lahirnya dengan mencantumkannya sebagai 12 Oktober 1931."
