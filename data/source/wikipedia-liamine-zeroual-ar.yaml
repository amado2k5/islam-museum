summary:
  ar: "مقالة ويكيبيديا العربية عن اليمين زروال؛ تُستخدم لوقائع الكيان فقط. تؤكد أنه خلف علي كافي رئيس المجلس الأعلى للدولة في رئاسة الدولة سنة 1994 ثم انتُخب رئيسا سنة 1995، وتروي وفاته في الجزائر العاصمة في 28 مارس 2026 ⁦(9 شوال 1447)⁩ ودفنه في المقبرة المركزية ببوزوران في باتنة."
  en: "Arabic Wikipedia article on Liamine Zéroual; used for entity facts only. It confirms that he succeeded Ali Kafi, chairman of the High Council of State, as head of state in 1994 and was elected president in 1995, and recounts his death in Algiers on 28 March 2026 (9 Shawwal 1447) and his burial in the central cemetery at Bouzourane, Batna."
  es: "Artículo en árabe de la Wikipedia sobre Liamine Zéroual; utilizado únicamente para datos sobre la persona. Confirma que sucedió a Ali Kafi, presidente del Alto Consejo de Estado, como jefe de Estado en 1994 y fue elegido presidente en 1995. Asimismo, relata su fallecimiento en Argel el 28 de marzo de 2026 (9 de Shawwal de 1447) y su entierro en el cementerio central de Bouzourane, Batna."
  fr: "Article de Wikipédia en arabe sur Liamine Zéroual; utilisé uniquement à des fins d’information sur l’entité. Il confirme qu’il a succédé à Ali Kafi, président du Haut Conseil d’État, à la tête de l’État en 1994 et a été élu président en 1995, et relate son décès à Alger le 28 mars 2026 (9 Shawwal 1447) et son inhumation au cimetière central de Bouzourane, à Batna."
  ur: "Liamine Zéroual پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اس بات کی تصدیق کرتا ہے کہ وہ 1994 میں ریاست کے سربراہ کے طور پر ہائی کونسل آف سٹیٹ کے چیئرمین علی کیفی کی جگہ لے گئے اور 1995 میں صدر منتخب ہوئے، اور 28 مارچ 2026 ⁦(9 شوال 1447)⁩ کو الجزائر میں ان کی موت اور بوزورین، بٹنا کے مرکزی قبرستان میں ان کی تدفین کا ذکر ہے۔"
