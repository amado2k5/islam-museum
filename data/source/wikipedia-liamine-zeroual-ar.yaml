  ar: "مقالة ويكيبيديا العربية عن اليمين زروال؛ تُستخدم لوقائع الكيان فقط. تؤكد أنه خلف علي كافي رئيس المجلس الأعلى للدولة في رئاسة الدولة سنة 1994 ثم انتُخب رئيسا سنة 1995، وتروي وفاته في الجزائر العاصمة في 28 مارس 2026 (9 شوال 1447) ودفنه في المقبرة المركزية ببوزوران في باتنة."
  en: "Arabic Wikipedia article on Liamine Zéroual; used for entity facts only. It confirms that he succeeded Ali Kafi, chairman of the High Council of State, as head of state in 1994 and was elected president in 1995, and recounts his death in Algiers on 28 March 2026 (9 Shawwal 1447) and his burial in the central cemetery at Bouzourane, Batna."
