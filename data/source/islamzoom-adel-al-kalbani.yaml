summary:
  ar: "صفحة تعريفية بعادل الكلباني في موقع إسلام زوم، الذي يستضيف تلاوته المرتلة الكاملة للقرآن برواية حفص عن عاصم؛ تُستخدم لتفاصيل مسيرته في المساجد والتلفزيون المتسقة مع مقالتي ويكيبيديا."
  en: "Biographical profile of Adel Al Kalbani on IslamZoom, which hosts his complete murattal Quran recitation in the narration of Hafs from Asim; used for the Saudi career detail (mosques served, television programme, newspaper column, competition supervision) consistent with the two Wikipedia articles."
  es: "Perfil biográfico de Adel Al Kalbani en IslamZoom, que aloja su recitación completa del Corán en la narración de Hafs de Asim; utilizado para los detalles de su carrera en Arabia Saudí (mezquitas donde sirvió, programa de televisión, columna periodística, supervisión de competiciones) en consonancia con los dos artículos de Wikipedia."
  fr: "Profil biographique d'Adel Al Kalbani sur IslamZoom, qui héberge sa récitation complète du Coran (murattal) selon la narration de Hafs d'après Asim; utilisé pour les détails de sa carrière saoudienne (mosquées desservies, émission de télévision, chronique de journal, supervision de compétitions) en accord avec les deux articles Wikipédia."
  ur: "اسلام زوم پر عادل الکلبانی کی سوانح عمری، جس میں عاصم سے حفص کی روایت میں ان کی مکمل مراتل قرآن کی تلاوت کی گئی ہے۔ ویکیپیڈیا کے دو مضامین کے مطابق سعودی کیریئر کی تفصیل کے لیے استعمال کیا جاتا ہے ⁦(مسجدیں، ٹیلی ویژن پروگرام، اخباری کالم، مقابلے کی نگرانی)⁩۔"
  tr: "Adel Al-Kalbani'nin İslam Zoom'daki tanıtım sayfası; burada Asim'den Hafs'ın rivayetine göre Kur'an'ın tam okuyuyla yer alıyor; camilerde ve televizyonda yolculuğunu Wikipedia makalelerimle tutarlı olarak detaylandırmak için kullanıldı."
  id: "Halaman pengantar untuk Adel Al-Kalbani di Islam Zoom, yang memuat pembacaan lengkap Al-Quran sesuai dengan narasi Hafs dari Asim; digunakan untuk merinci perjalanannya di masjid dan televisi sesuai dengan artikel Wikipedia saya."
