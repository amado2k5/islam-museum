summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ناز شاه ⁦(نسيم شاه)⁩: سياسية عمالية بريطانية وُلدت في برادفورد سنة 1973، وهي عضوة البرلمان عن دائرة برادفورد الغربية منذ 2015. تروي المقالة طفولتها الصعبة وقضية والدتها، ومسيرتها البرلمانية وإيقافها المؤقت عن الحزب سنة 2016."
  en: "English Wikipedia article on Naz Shah (Naseem Shah), the British Labour politician born in Bradford in 1973 who has been MP for Bradford West since 2015. It recounts her difficult childhood and her mother's case, her parliamentary career and her 2016 suspension from the party."
  es: "Artículo de la Wikipedia en inglés sobre Naz Shah (Naseem Shah), la política laborista británica nacida en Bradford en 1973 que ha sido diputada por Bradford West desde 2015. En él se narra su difícil infancia y el caso de su madre, su carrera parlamentaria y su suspensión del partido en 2016."
  fr: "Article de Wikipédia en anglais sur Naz Shah (Naseem Shah), la femme politique travailliste britannique née à Bradford en 1973 et députée de Bradford West depuis 2015. Il relate son enfance difficile et l'affaire de sa mère, sa carrière parlementaire et sa suspension du parti en 2016."
  ur: "ناز شاہ ⁦(نسیم شاہ)⁩ پر انگریزی ویکیپیڈیا کا مضمون، بریڈ فورڈ میں 1973 میں پیدا ہونے والی برطانوی لیبر سیاستدان جو 2015 سے بریڈ فورڈ ویسٹ کی ایم پی ہیں۔ اس میں اس کے مشکل بچپن اور اس کی والدہ کے کیس، اس کے پارلیمانی کیرئیر اور 2016 میں پارٹی سے اس کی معطلی کا ذکر ہے۔"
  tr: "Naz Shah (Naseem Shah) hakkında İngilizce Wikipedia makalesi: 1973 yılında Bradford'da doğmuş bir İngiliz İşçi Partili politikacı ve 2015'ten beri West Bradford seçim bölgesinin milletvekilidir. Makale, zor çocukluğunu, annesinin davasını, parlamento kariyerini ve 2016'da partiden geçici olarak uzaklaştırılmasını anlatmaktadır."
  id: "Artikel Wikipedia bahasa Inggris tentang Naz Shah (Naseem Shah): Seorang politisi Partai Buruh Inggris yang lahir di Bradford pada tahun 1973, dan telah menjadi Anggota Parlemen untuk konstituensi West Bradford sejak 2015. Artikel tersebut menceritakan masa kecilnya yang sulit, kasus ibunya, karier parlemennya, dan penangguhan sementara dari partai pada tahun 2016."
