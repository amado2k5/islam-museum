  ar: "مقالة ويكيبيديا الإنجليزية عن ناز شاه (نسيم شاه): سياسية عمالية بريطانية وُلدت في برادفورد سنة 1973، وهي عضوة البرلمان عن دائرة برادفورد الغربية منذ 2015. تروي المقالة طفولتها الصعبة وقضية والدتها، ومسيرتها البرلمانية وإيقافها المؤقت عن الحزب سنة 2016."
