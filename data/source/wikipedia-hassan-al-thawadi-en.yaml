summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حسن الذوادي، المحامي القطري والأمين العام للجنة العليا للمشاريع والإرث لكأس العالم 2022؛ تذكر دراسته للقانون في جامعة شيفيلد، وقيادته ملف استضافة قطر للمونديال، ومزاعم الرشوة المتعلقة بالملف التي نفاها، ولا تذكر سنة مولده."
  en: "English Wikipedia article on Hassan Al-Thawadi, the Qatari lawyer who was Secretary General of the Supreme Committee for Delivery and Legacy for the 2022 FIFA World Cup; it gives his law degree from the University of Sheffield, his leadership of Qatar's World Cup bid and delivery, and the bid bribery allegations, which he denied. It gives no birth year."
  es: "Artículo de la Wikipedia en inglés sobre Hassan Al-Thawadi, el abogado catarí que fue secretario general del Comité Supremo para la Organización y el Legado de la Copa Mundial de la FIFA 2022. En él se menciona su título de abogado por la Universidad de Sheffield, su liderazgo en la candidatura y organización de la Copa Mundial de Qatar, y las acusaciones de soborno relacionadas con la candidatura, que él negó. No se indica su año de nacimiento."
  fr: "L'article de Wikipédia en anglais consacré à Hassan Al-Thawadi, avocat qatari et secrétaire général du Comité suprême pour l'organisation et l'héritage de la Coupe du monde de la FIFA 2022, mentionne son diplôme de droit de l'Université de Sheffield, son rôle à la tête de la candidature du Qatar pour la Coupe du monde et les allégations de corruption liées à cette candidature, qu'il a niées. L'article ne précise pas sa date de naissance."
  ur: "انگریزی ویکیپیڈیا کا مضمون حسن التھوادی پر، قطری وکیل جو 2022 فیفا ورلڈ کپ کے لیے سپریم کمیٹی برائے ترسیل اور میراث کے سیکرٹری جنرل تھے۔ اس نے اسے یونیورسٹی آف شیفیلڈ سے قانون کی ڈگری، قطر کے ورلڈ کپ کی بولی اور ترسیل کی اس کی قیادت، اور بولی رشوت کے الزامات کی، جس کی اس نے تردید کی۔ یہ کوئی سال پیدائش نہیں دیتا۔"
  tr: "2022 Dünya Kupası Yüksek Teslimat ve Miras Komitesi Genel Sekreteri Katarlı avukat Hassan Al-Thawadi hakkında İngilizce Wikipedia makalesi; Sheffield Üniversitesi'ndeki hukuk eğitiminden, Katar'ın Dünya Kupası'na ev sahipliği yapma girişiminde liderliğinden ve davaya ilişkin rüşvet iddialarından bahsediyor; kendisi bunu reddetti ancak doğum yılından bahsetmiyor."
  id: "Artikel Wikipedia bahasa Inggris tentang Hassan Al-Thawadi, pengacara Qatar dan Sekretaris Jenderal Komite Tertinggi untuk Pengiriman & Warisan untuk Piala Dunia 2022; menyebutkan studi hukumnya di University of Sheffield, kepemimpinannya dalam upaya Qatar menjadi tuan rumah Piala Dunia, serta tuduhan suap terkait kasus tersebut, yang ia bantah, namun tidak menyebutkan tahun kelahirannya."
