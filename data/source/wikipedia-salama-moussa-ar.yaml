reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md). Fetched by recorded revision 77020281 and the returned revision asserted equal before any claim was drawn. It states he was born to two Coptic parents and that his father was a Christian government employee — family background. Summarising his own books, it records his doctrine that religion is a human product and that nothing in it is sacred, his 1912 book on the origin of the idea of God written from a material basis, and also his preaching of a natural unity of God and the universe and his rejection of Nietzsche's 'death of God'. Its infobox has no religion field."
