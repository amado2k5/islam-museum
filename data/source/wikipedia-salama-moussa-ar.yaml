summary:
  ar: "مقالة ويكيبيديا العربية عن سلامة موسى؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في بهنباي قرب الزقازيق سنة 1887 لأبوين قبطيين، وأسفاره إلى فرنسا وإنجلترا، ومذهبه الفكري كما يعرضه من كتبه، ووفاته بالقاهرة سنة 1958."
  en: "Arabic Wikipedia article on Salama Moussa; used for entity facts only. It gives his birth at Bahnaba'i near Zagazig in 1887 to Coptic parents, his travels to France and England, his doctrine as set out from his own books, and his death at Cairo in 1958."
  es: "Artículo de Wikipedia en árabe sobre Salama Moussa; se utiliza únicamente para obtener información sobre la persona. Describe su nacimiento en Bahnaba'i, cerca de Zagazig, en 1887, de padres coptos; sus viajes a Francia e Inglaterra; su doctrina, tal como la expone en sus propios libros; y su fallecimiento en El Cairo en 1958."
  fr: "Article de Wikipédia en arabe sur Salama Moussa; utilisé uniquement pour les informations sur l’entité. Il indique sa naissance à Bahnaba’i, près de Zagazig, en 1887, de parents coptes, ses voyages en France et en Angleterre, sa doctrine telle qu’exposée dans ses propres ouvrages, et sa mort au Caire en 1958."
  ur: "سلامہ موسیٰ پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1887 میں زگازگ کے قریب بہنابائی میں قبطی والدین کے ہاں اس کی پیدائش، فرانس اور انگلینڈ کے سفر، اس کی اپنی کتابوں سے بیان کردہ اس کا نظریہ، اور 1958 میں قاہرہ میں اس کی موت۔"
