  ar: "مقالة ويكيبيديا العربية عن سلامة موسى؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في بهنباي قرب الزقازيق سنة 1887 لأبوين قبطيين، وأسفاره إلى فرنسا وإنجلترا، ومذهبه الفكري كما يعرضه من كتبه، ووفاته بالقاهرة سنة 1958."
