  ar: "مقالة ويكيبيديا البوسنية عن حسين دوزو؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته سنة 1912 في قرية باري قرب غورازده ووفاته في سراييفو في 30 مايو 1982، وتوافق المقالة الإنجليزية في التعليم والأزهر والخدمة الحربية والسجن والعمل المؤسسي والتدريس ورئاسة جمعية العلماء وصحيفة «بريپورود»."
  en: "Bosnian Wikipedia article on Husein Đozo; used for entity facts only. It gives his birth in 1912 in the village of Bare near Goražde and his death at Sarajevo on 30 May 1982, and agrees with the English article on his schooling, al-Azhar, the wartime imamate and prison sentence, his institutional work, teaching, the Ulema Association presidency and the Preporod newspaper."
