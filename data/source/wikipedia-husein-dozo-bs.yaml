reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md), read in full on 1 November 2026 at the recorded revision, fetched via the MediaWiki API. It is an independent Bosnian-language biography, not a translation of the English article. Points drawn from it: birth in the village of Bare near Goražde in 1912 (the English article gives no birthplace); death at Sarajevo on 30 May 1982 in his 70th year; the same education sequence (Foča, Sarajevo, Sharia Judicial School 1928–1933, al-Azhar Sharia faculty 1939); the Handžar Division imamate, the letter to Himmler and the five-year sentence; the post-war employments, the Supreme Islamic Eldership from 1960 until his death, the Gazi Husrev-beg Madrasa teaching (adding rhetoric and usul al-fiqh to the subjects), the Ilmija presidency from 1964, the Preporod editorships, and the 1977 professorship of Qur'an interpretation. Like the English article, it names no legal school for the man himself."
