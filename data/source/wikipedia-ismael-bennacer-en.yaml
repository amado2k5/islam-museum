summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن إسماعيل بن ناصر؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته من آرل وأرسنال وإمبولي إلى ميلان ولقب الدوري الإيطالي 2022، وبطولة الأمم الأفريقية 2019 مع الجزائر وجائزة أفضل لاعب فيها، وتذكر في حياته الشخصية أنه مسلم يصوم رمضان."
  en: "English Wikipedia article on Ismaël Bennacer; used for entity facts only. It recounts his career from Arles, Arsenal and Empoli to AC Milan and the 2022 Serie A title, the 2019 Africa Cup of Nations with Algeria and his Player of the Tournament award, and states in its personal-life section that he is a Muslim who observes Ramadan."
  es: "Artículo de la Wikipedia en inglés sobre Ismaël Bennacer; utilizado únicamente para obtener información sobre la persona. Narra su trayectoria desde Arles, Arsenal y Empoli hasta el AC Milan y el título de la Serie A de 2022, la Copa Africana de Naciones de 2019 con Argelia y su premio al Jugador del Torneo, y afirma en su sección de vida personal que es musulmán y observa el Ramadán."
  fr: "Article de Wikipédia en anglais sur Ismaël Bennacer; utilisé uniquement pour les informations relatives à l’entité. Il retrace sa carrière, d’Arles à Arsenal et Empoli, jusqu’à l’AC Milan et le titre de champion de Serie A en 2022, la Coupe d’Afrique des Nations 2019 avec l’Algérie et son titre de meilleur joueur du tournoi. La section consacrée à sa vie personnelle précise qu’il est musulman et observe le ramadan."
  ur: "Ismaël Bennacer پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ارلس، آرسنل اور ایمپولی سے لے کر AC میلان اور 2022 سیری اے ٹائٹل، الجزائر کے ساتھ 2019 افریقہ کپ آف نیشنز اور اس کے پلیئر آف دی ٹورنامنٹ کے ایوارڈ کا ذکر کیا گیا ہے، اور اس کے ذاتی زندگی کے حصے میں کہا گیا ہے کہ وہ ایک مسلمان ہے جو رمضان کا اہتمام کرتا ہے۔"
