summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أمان الله خان؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 1 يونيو 1892 في بغمان، وإمارته من 1919 ثم ملكيته من 1926 حتى تنازله في 14 يناير 1929، وحرب الاستقلال 1919 ودستوره الأول وإصلاحاته في التعليم وحقوق المرأة، وجولته الأوروبية 1927-1928، ووفاته في زيورخ في 26 أبريل 1960 ودفنه في جلال أباد. لا يحمل صندوق معلوماتها أي قيمة للديانة."
  en: "English Wikipedia article on Amanullah Khan; used for entity facts only. It gives his birth on 1 June 1892 at Paghman, his emirate from 1919 and kingship from 1926 until his abdication on 14 January 1929, the 1919 war of independence, his first constitution and his education and women's-rights reforms, his European tour of 1927–1928, and his death at Zurich on 26 April 1960 with burial at Jalalabad. Its infobox carries no religion value."
  es: "Artículo de la Wikipedia en inglés sobre Amanullah Khan; utilizado únicamente para datos sobre la persona. Describe su nacimiento el 1 de junio de 1892 en Paghman, su emirato desde 1919 y su reinado desde 1926 hasta su abdicación el 14 de enero de 1929, la guerra de independencia de 1919, su primera constitución y sus reformas en materia de educación y derechos de la mujer, su gira europea de 1927-1928 y su fallecimiento en Zúrich el 26 de abril de 1960, con sepultura en Jalalabad. Su ficha informativa no tiene valor religioso."
  fr: "Article de Wikipédia en anglais sur Amanullah Khan; utilisé uniquement pour les informations biographiques. Il indique sa naissance le 1er juin 1892 à Paghman, son émirat à partir de 1919 et son règne de 1926 jusqu'à son abdication le 14 janvier 1929, la guerre d'indépendance de 1919, sa première constitution et ses réformes en matière d'éducation et de droits des femmes, son voyage en Europe de 1927-1928 et sa mort à Zurich le 26 avril 1960, suivie de son inhumation à Jalalabad. Son infobox ne mentionne pas la religion."
