  ar: "مقالة ويكيبيديا الإنجليزية عن أمان الله خان؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 1 يونيو 1892 في بغمان، وإمارته من 1919 ثم ملكيته من 1926 حتى تنازله في 14 يناير 1929، وحرب الاستقلال 1919 ودستوره الأول وإصلاحاته في التعليم وحقوق المرأة، وجولته الأوروبية 1927-1928، ووفاته في زيورخ في 26 أبريل 1960 ودفنه في جلال أباد. لا يحمل صندوق معلوماتها أي قيمة للديانة."
  en: "English Wikipedia article on Amanullah Khan; used for entity facts only. It gives his birth on 1 June 1892 at Paghman, his emirate from 1919 and kingship from 1926 until his abdication on 14 January 1929, the 1919 war of independence, his first constitution and his education and women's-rights reforms, his European tour of 1927–1928, and his death at Zurich on 26 April 1960 with burial at Jalalabad. Its infobox carries no religion value."
