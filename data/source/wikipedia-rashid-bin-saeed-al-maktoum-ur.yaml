summary:
  ar: "مقالة ويكيبيديا الأردية عن راشد بن سعيد آل مكتوم؛ مختصر يُستخدم لوقائع الكيان فقط. يذكر أنه كان نائب رئيس دولة الإمارات ورئيس وزرائها وحاكم دبي من 1958 حتى وفاته سنة 1990، وتذكر خانات التعاقب فيه أن والده سعيد بن مكتوم سبقه في حكم دبي وأن ابنه مكتوم خلفه. ولا يرد فيه أي قيمة للدين، وتصنّف فئاته مقالَه تحت مواليد 1909 ومواليد 1912 معًا."
  en: "Urdu Wikipedia stub on Rashid bin Saeed Al Maktoum; used for entity facts only. It gives him as vice president and prime minister of the UAE and ruler of Dubai from 1958 until his death in 1990, and its succession boxes name his father Saeed bin Maktoum before him in Dubai and his son Maktoum after him. It carries no religion value anywhere, and its categories file the article under both 1909 and 1912 births."
