summary:
  ar: "مقالة ويكيبيديا الأردية عن راشد بن سعيد آل مكتوم؛ مختصر يُستخدم لوقائع الكيان فقط. يذكر أنه كان نائب رئيس دولة الإمارات ورئيس وزرائها وحاكم دبي من 1958 حتى وفاته سنة 1990، وتذكر خانات التعاقب فيه أن والده سعيد بن مكتوم سبقه في حكم دبي وأن ابنه مكتوم خلفه. ولا يرد فيه أي قيمة للدين، وتصنّف فئاته مقالَه تحت مواليد 1909 ومواليد 1912 معًا."
  en: "Urdu Wikipedia stub on Rashid bin Saeed Al Maktoum; used for entity facts only. It gives him as vice president and prime minister of the UAE and ruler of Dubai from 1958 until his death in 1990, and its succession boxes name his father Saeed bin Maktoum before him in Dubai and his son Maktoum after him. It carries no religion value anywhere, and its categories file the article under both 1909 and 1912 births."
  es: "Fragmento de la Wikipedia en urdu sobre Rashid bin Saeed Al Maktoum; se utiliza únicamente para datos sobre la persona. Lo presenta como vicepresidente y primer ministro de los Emiratos Árabes Unidos y gobernante de Dubái desde 1958 hasta su muerte en 1990. En sus recuadros de sucesión, se menciona a su padre, Saeed bin Maktoum, antes que él en Dubái, y a su hijo, Maktoum, después de él. No contiene ninguna referencia religiosa y sus categorías clasifican el artículo bajo nacimientos de 1909 y 1912."
  fr: "Ébauche de l'article Wikipédia en ourdou sur Rashid bin Saeed Al Maktoum; utilisée uniquement pour les informations relatives à l'entité. Elle le présente comme vice-président et Premier ministre des Émirats arabes unis, ainsi que souverain de Dubaï de 1958 à sa mort en 1990. Les rubriques de succession mentionnent son père, Saeed bin Maktoum, avant lui à Dubaï, et son fils, Maktoum, après lui. Aucune information religieuse n'est fournie, et l'article est classé à la fois sous les dates de naissance de 1909 et 1912."
  ur: "راشد بن سعید المکتوم پر اردو ویکیپیڈیا اسٹب؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ انہیں متحدہ عرب امارات کا نائب صدر اور وزیر اعظم اور 1958 سے لے کر 1990 میں ان کی موت تک دبئی کا حکمران دیتا ہے، اور اس کے جانشینی خانوں میں ان کے والد سعید بن مکتوم کا نام دبئی میں ان سے پہلے اور ان کے بعد ان کے بیٹے مکتوم کا ہے۔ اس میں کہیں بھی مذہب کی کوئی اہمیت نہیں ہے، اور اس کے زمرے 1909 اور 1912 دونوں پیدائشوں کے تحت مضمون درج کرتے ہیں۔"
  tr: "Rashid bin Saeed Al Maktoum hakkında Urduca Vikipedi makalesi; yalnızca varlığın olayları için kullanılan kısa bir özet. 1958'den 1990'daki ölümüne kadar BAE Başkan Yardımcısı, Başbakan ve Dubai Hükümdarı olduğu belirtilmektedir. Ardışık hanlıklar, babası Saeed bin Maktoum'un Dubai'yi kendisinden önce yönettiğini ve oğlunun Maktoum'un onun yerine geçtiğini belirtir. Herhangi bir dini değerden bahsetmez ve kategorileri 1909 doğumları ve 1912 doğumları olarak birlikte sınıflandırılır."
  id: "Artikel Wikipedia Urdu tentang Rashid bin Saeed Al Maktoum; ringkasan singkat yang hanya digunakan untuk peristiwa entitas tersebut. Disebutkan bahwa ia adalah Wakil Presiden UEA, Perdana Menteri, dan Penguasa Dubai dari tahun 1958 hingga wafat pada tahun 1990. Khanate berikutnya menyebutkan bahwa ayahnya Saeed bin Maktoum mendahuluinya dalam memerintah Dubai dan bahwa putranya Maktoum menggantikannya. Artikel tersebut tidak menyebutkan nilai keagamaan apapun, dan kategorinya diklasifikasikan berdasarkan kelahiran tahun 1909 dan lahir tahun 1912 bersama."
