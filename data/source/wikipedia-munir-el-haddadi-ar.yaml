summary:
  ar: "مقالة ويكيبيديا العربية عن منير الحدادي؛ تُستخدم لوقائع الكيان فقط. تذكر اسمه الكامل ومولده في سان لورنزو بمدريد من أصول مغربية ريفية من الحسيمة، ومسيرته من أتلتيكو مدريد وبرشلونة إلى أندية إسبانية أخرى، دون أي ذكر لديانته في النص أو صندوق المعلومات."
  en: "Arabic Wikipedia article on Munir El Haddadi; used for entity facts only. It gives his full name, his birth in San Lorenzo, Madrid, of Moroccan Riffian origins from Al Hoceima, and his career from Atlético Madrid and Barcelona to other Spanish clubs, with no mention of his religion in its text or infobox."
  es: "Artículo de Wikipedia en árabe sobre Munir El Haddadi; utilizado únicamente para obtener información sobre la persona. Menciona su nombre completo, su lugar de nacimiento en San Lorenzo, Madrid, sus orígenes marroquíes rifeños de Al Hoceima y su trayectoria profesional desde el Atlético de Madrid y el Barcelona hasta otros clubes españoles, sin hacer referencia a su religión ni en el texto ni en la ficha informativa."
  fr: "Article Wikipédia en arabe sur Munir El Haddadi; utilisé uniquement pour les informations le concernant. Il mentionne son nom complet, sa naissance à San Lorenzo (Madrid), ses origines marocaines rifaines (membre du clan Al Hoceima), et sa carrière, de l’Atlético Madrid et du FC Barcelone à d’autres clubs espagnols. Sa religion n’est pas mentionnée dans le texte ni dans l’infobox."
