summary:
  ar: "مقالة ويكيبيديا العربية عن دوست محمد خان؛ مقالة قصيرة تُستخدم لوقائع الكيان فقط. تعطي مولده في قندهار في 23 ديسمبر 1793 ووفاته في هراة في 9 يونيو 1863، وفترتي حكمه، وأبناءه ومنهم شير علي خان ومحمد أكبر خان، ودينه في صندوق المعلومات «أهل السنة والجماعة»."
  en: "Arabic Wikipedia article on Dost Mohammad Khan; a short article used for entity facts only. It gives his birth at Kandahar on 23 December 1793 and his death at Herat on 9 June 1863, his two periods of rule, his sons including Sher Ali Khan and Mohammad Akbar Khan, and his religion in the infobox as Ahl al-Sunna wa'l-Jama'a."
  es: "Artículo en árabe de la Wikipedia sobre Dost Mohammad Khan; un artículo breve que se utiliza únicamente para datos sobre la persona. Indica su nacimiento en Kandahar el 23 de diciembre de 1793 y su muerte en Herat el 9 de junio de 1863, sus dos períodos de gobierno, sus hijos, entre ellos Sher Ali Khan y Mohammad Akbar Khan, y su religión, según el recuadro informativo, como Ahl al-Sunna wa'l-Jama'a."
  fr: "Article Wikipédia en arabe sur Dost Mohammad Khan; un article court contenant uniquement des informations factuelles. Il indique sa naissance à Kandahar le 23 décembre 1793 et sa mort à Hérat le 9 juin 1863, ses deux périodes de règne, ses fils, notamment Sher Ali Khan et Mohammad Akbar Khan, et son appartenance religieuse (Ahl al-Sunna wa'l-Jama'a) dans l'infobox."
  ur: "دوست محمد خان پر عربی ویکیپیڈیا مضمون؛ ایک مختصر مضمون جو صرف ہستی کے حقائق کے لیے استعمال ہوتا ہے۔ یہ 23 دسمبر 1793 کو قندھار میں ان کی پیدائش اور 9 جون 1863 کو ہرات میں ان کی موت، ان کے دو ادوار حکومت، ان کے بیٹوں بشمول شیر علی خان اور محمد اکبر خان، اور معلومات کے خانے میں ان کا مذہب بطور اہل السنۃ والجماعت ہے۔"
