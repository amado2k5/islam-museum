summary:
  ar: "مقالة ويكيبيديا العربية عن زين العابدين بن علي؛ تُستخدم لوقائع الكيان فقط. تؤكد خلافته لبورقيبة سنة 1987 ورئاسته لتونس حتى 2011 ودفنه في البقيع، ويذكر صندوق معلوماتها دينه «الإسلام» بصورة عامة."
  en: "Arabic Wikipedia article on Zine El Abidine Ben Ali; used for entity facts only. It confirms his succession to Bourguiba in 1987, his presidency of Tunisia until 2011 and his burial at al-Baqi; its infobox gives his religion as Islam in general."
  es: "Artículo en árabe de la Wikipedia sobre Zine El Abidine Ben Ali; utilizado únicamente para datos sobre la persona. Confirma su sucesión a Bourguiba en 1987, su presidencia de Túnez hasta 2011 y su entierro en al-Baqi; su ficha informativa indica que profesaba el islam en general."
  fr: "Article de Wikipédia en arabe sur Zine El Abidine Ben Ali; utilisé uniquement pour les informations le concernant. Il confirme sa succession à Bourguiba en 1987, sa présidence de la Tunisie jusqu’en 2011 et son inhumation à al-Baqi; son infobox indique qu’il était musulman."
  ur: "زین العابدین بن علی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1987 میں بورگویبا کی جانشینی، 2011 تک تیونس کی صدارت اور البقی میں ان کی تدفین کی تصدیق کرتا ہے۔ اس کا انفو باکس اس کا مذہب عام طور پر اسلام کے طور پر دیتا ہے۔"
  tr: "Zine El Abidine Ben Ali hakkında Arapça Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1987'de Bourguiba'ya tahta geçmesini, 2011'e kadar Tunus başkanlığını ve Al-Baqi'de defnedilmesini doğrularken, bilgi kutusu genel olarak dinini \"İslam\" olarak belirtmektedir."
  id: "Artikel Wikipedia berbahasa Arab tentang Zine El Abidine Ben Ali; digunakan hanya untuk fakta entitas. Artikel ini mengonfirmasi suksesinya ke Bourguiba pada tahun 1987, masa kepresidenannya di Tunisia hingga 2011, dan pemakamannya di Al-Baqi', sementara infobox menyebutkan agamanya sebagai \"Islam\" secara umum."
