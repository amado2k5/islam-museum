summary:
  ar: "السيرة المهنية للدكتورة رانيا عواد في موقع ستانفورد للرعاية الصحية: مناصبها السريرية والأكاديمية، ومديرة تنفيذية لـ«مارستان» منذ 2021، ومديرة سريرية مؤسِّسة لفرع مركز خليل في منطقة الخليج، وأول أستاذة للشريعة الإسلامية في كلية زيتونة، وتدريبها الطبي في ستانفورد وجامعة رايت ستيت."
  en: "Dr. Rania Awaad's professional biography at Stanford Health Care: her clinical and academic posts, Executive Director of Maristan from 2021, founding Clinical Director of the Khalil Center's Bay Area branch, first female Professor of Islamic Law at Zaytuna College, and her medical training at Stanford and Wright State University."
  es: "La biografía profesional de la Dra. Rania Awaad en Stanford Health Care: sus cargos clínicos y académicos, Directora Ejecutiva de Maristan desde 2021, Directora Clínica fundadora de la sucursal del Centro Khalil en el Área de la Bahía, primera mujer Profesora de Derecho Islámico en Zaytuna College y su formación médica en Stanford y la Universidad Estatal de Wright."
  fr: "Biographie professionnelle du Dr Rania Awaad chez Stanford Health Care: ses postes cliniques et universitaires, directrice générale de Maristan depuis 2021, directrice clinique fondatrice de la branche de la baie du Khalil Center, première femme professeure de droit islamique au Zaytuna College, et sa formation médicale à Stanford et à l’université Wright State."
  ur: "اسٹینفورڈ ہیلتھ کیئر میں ڈاکٹر رانیہ عواد کی پیشہ ورانہ سوانح عمری: ان کی طبی اور تعلیمی پوسٹس، 2021 سے مارستان کی ایگزیکٹو ڈائریکٹر، خلیل سینٹر کی بے ایریا برانچ کی بانی کلینیکل ڈائریکٹر، زیتونا کالج میں اسلامی قانون کی پہلی خاتون پروفیسر، اور اسٹینفورڈ اور رائٹ اسٹیٹ یونیورسٹی میں ان کی طبی تربیت۔"
