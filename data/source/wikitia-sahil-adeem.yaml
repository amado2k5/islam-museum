reliability_note: "A low-authority wiki mirror (the article states it derives from a Wikipedia draft namespace article); read in full on 5 November 2026 and used only where its claims are the circulating biographical account, flagged as such. It gives: born 10 October 1984 (a date repeated by profile sites such as Hamariweb but confirmed by no stronger source — so no born block is written); son of the poet Adeem Hashmi (no relation is written: no person record for his father exists and the tie rests on this stratum of sources); a psychology graduate of Ryerson University, Toronto; head psychologist for the Toronto Maple Leafs youth squad; work with Pakistani cricketers for the Pakistan Cricket Board since 2017; ten years as Zong's chief strategy officer; CEO coaching in Denmark, Canada and Pakistan; an October 2022 ban on speaking at public universities, imposed, it says, because of the content of his speeches, which he declined to apologise to lift; and a controversial podcast discussion of Dajjal and Gog and Magog. It names no school or order for him."
