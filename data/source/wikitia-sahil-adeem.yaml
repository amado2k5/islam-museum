summary:
  ar: "مقالة ويكيتيا عن ساحل عديم؛ معلق ديني وخطيب تحفيزي باكستاني، عالم نفس تخرج في جامعة رايرسون بتورونتو، وعمل مع مجلس الكريكيت الباكستاني منذ 2017، ومُنع من الخطابة في الجامعات العامة في أكتوبر 2022."
  en: "The Wikitia article on Sahil Adeem: a Pakistani religious commentator and motivational speaker, a psychologist who graduated from Ryerson University in Toronto, who has worked with the Pakistan Cricket Board since 2017 and was banned from speaking at public universities in October 2022."
  es: "El artículo de Wikitia sobre Sahil Adeem: un comentarista religioso y orador motivacional pakistaní, psicólogo graduado de la Universidad Ryerson de Toronto, que ha trabajado con la Junta de Críquet de Pakistán desde 2017 y al que se le prohibió hablar en universidades públicas en octubre de 2022."
  fr: "L'article de Wikitia sur Sahil Adeem: commentateur religieux et conférencier motivateur pakistanais, psychologue diplômé de l'Université Ryerson de Toronto, qui a travaillé avec la Fédération pakistanaise de cricket depuis 2017 et qui a été interdit de parole dans les universités publiques en octobre 2022."
  ur: "ساحل عدیم پر وکیٹیا کا مضمون: ایک پاکستانی مذہبی مبصر اور موٹیویشنل اسپیکر، ایک ماہر نفسیات جس نے ٹورنٹو کی رائرسن یونیورسٹی سے گریجویشن کیا، جس نے 2017 سے پاکستان کرکٹ بورڈ کے ساتھ کام کیا اور اکتوبر 2022 میں سرکاری یونیورسٹیوں میں تقریر کرنے پر پابندی لگا دی گئی۔"
