reliability_note: "Actual article page read 2026-11-15. Reports the name-chain variants in Ibn al-Nadim, Ibn Abi Usaybi'a and Ibn al-Qifti; service under al-Ma'mun, al-Mu'tasim, al-Wathiq and al-Mutawakkil; engineering work including responsibility for the nilometer al-Mikyas al-jadid at Fustat completed in 247/861; death after 247/861; the treatise Cevami'u 'ilmi'n-nujum in thirty chapters as a summary of Ptolemy's Almagest with objections to Ptolemy; Ibn al-Nadim's title Kitab al-Fusul ikhtiyar al-Majisti; the 1669 Golius Arabic-Latin edition and Sezgin facsimile 1986; Latin translations attributed to Johannes Hispalensis (1134) and Gerardus Cremonensis (1175); a Hebrew translation by J. Anatoli in the mid-thirteenth century; influence on European astronomy from the twelfth to the end of the fifteenth century with references to Grosseteste, Ristoro d'Arezzo and Dante; and a single known commentary by Ebu's-Sakr al-Kabisi. Dates and attributions are the article's, not independently checked against the manuscripts."
