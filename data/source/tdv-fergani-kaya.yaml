summary:
  ar: "مقالة معجمية تعرض حياة الفرغاني في خدمة خلفاء بني العباس ومهندسته في القياس بالمقياس النيلوي بفسطاط، وكتابه «جوامع علم النجوم» في ثلاثين فصلاً بوصفه تلخيصاً للمجسطي، وترجماته اللاتينية والعبرية وانتشاره في فلك أوروبا حتى القرن الخامس عشر."
  en: "An encyclopaedia entry on al-Farghani's life in the service of the Abbasid caliphs, his engineering work on Cairo's nilometer, his thirty-chapter treatise as a summary of the Almagest, and its Latin and Hebrew translations and European reception through the fifteenth century."
  ur: "ایک دائرۃ المعارف مضمون جو فرغانی کی عباسی خلفاء کی خدمت، فسطاط میں نیلمیٹر کی تعمیر، مجسطی کا خلاصہ تیس ابواب پر مشتمل ان کی کتاب، اور اس کے لاطینی و عبرانی تراجم اور پندرہویں صدی تک یورپی قبولیت بیان کرتا ہے۔"
  es: "Una entrada enciclopédica sobre la vida de al-Farghani al servicio de los califas abasíes, su trabajo de ingeniería en el nilómetro de El Cairo, su tratado de treinta capítulos como resumen del Almagesto, sus traducciones al latín y al hebreo y su recepción europea hasta el siglo XV."
