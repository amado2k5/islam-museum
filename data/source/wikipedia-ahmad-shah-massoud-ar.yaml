summary:
  ar: "مقالة ويكيبيديا العربية عن أحمد شاه مسعود؛ تُستخدم لوقائع الكيان فقط. تروي مولده في بنجشير — يعطي صدرها وصندوق معلوماتها 2 يناير 1953 بينما يقول متنها 1953 أو 1954 — ومقاومته للاحتلال السوفيتي ووزارته للدفاع وقيادته لتحالف الشمال واغتياله سنة 2001. يعطي صندوق معلوماتها دينه «الإسلام السني»."
  en: "Arabic Wikipedia article on Ahmad Shah Massoud; used for entity facts only. It recounts his birth in the Panjshir — its lead and infobox give 2 January 1953 while its body text says 1953 or 1954 — his resistance to the Soviet occupation, his defence ministry, his leadership of the Northern Alliance and his assassination in 2001. Its infobox gives his religion as Sunni Islam."
  ur: "احمد شاہ مسعود پر عربی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے مستعمل۔ اس میں پنجشیر میں ان کی پیدائش — اس کے آغاز اور معلوماتی خانے میں 2 جنوری 1953ء درج ہے جبکہ اس کا متن 1953ء یا 1954ء کہتا ہے — سوویت قبضے کے خلاف ان کی مزاحمت، ان کی وزارت دفاع، شمالی اتحاد کی قیادت اور 2001ء میں ان کا قتل بیان ہوا ہے۔ اس کے معلوماتی خانے میں ان کا مذہب اسلام سنی درج ہے۔"
