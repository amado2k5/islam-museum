summary:
  ar: "سيرة أندريه كارسون في الدليل البيوغرافي للكونغرس الأمريكي عبر موقع تاريخ مجلس النواب؛ تذكر ولادته في إنديانابوليس في 16 أكتوبر 1974 وتعليمه وخدمته في مجلس مدينة إنديانابوليس ثم في الكونغرس منذ الانتخاب الخاص في 11 مارس 2008."
  en: "House History / Biographical Directory of the United States Congress entry for Andre Carson; it gives his birth in Indianapolis on 16 October 1974, his education, his Indianapolis City-County Council service and his service in Congress since the special election of 11 March 2008."
  es: "Entrada en el directorio biográfico/historial de la Cámara de Representantes del Congreso de los Estados Unidos correspondiente a Andre Carson; en ella se indica su nacimiento en Indianápolis el 16 de octubre de 1974, su formación académica, su servicio en el Consejo Municipal de Indianápolis y su servicio en el Congreso desde las elecciones especiales del 11 de marzo de 2008."
  fr: "L'article consacré à Andre Carson dans la section « Histoire de la Chambre / Répertoire biographique du Congrès des États-Unis » mentionne sa naissance à Indianapolis le 16 octobre 1974, son éducation, son mandat au conseil municipal et du comté d'Indianapolis et son mandat au Congrès depuis l'élection partielle du 11 mars 2008."
  ur: "آندرے کارسن کے لیے امریکی کانگریس کے اندراج کی ہاؤس ہسٹری / بائیوگرافیکل ڈائرکٹری؛ یہ ان کی پیدائش 16 اکتوبر 1974 کو انڈیانا پولس میں ہوئی، اس کی تعلیم، ان کی انڈیانا پولس سٹی-کاؤنٹی کونسل کی خدمت اور 11 مارچ 2008 کے خصوصی انتخابات کے بعد کانگریس میں ان کی خدمات۔"
