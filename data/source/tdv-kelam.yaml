  ar: "مدخل «كلام» في موسوعة TDV الإسلامية ليوسف شوقي يافوز: تعريف علم الكلام ونشأته على يد الجهمية والمعتزلة، وتكوّن المدرستين السنّيتين الأشعرية والماتريدية، والمتكلمون المتقدمون والمتأخرون، وحركة «العلم الجديد للكلام» في العصر الحديث."
