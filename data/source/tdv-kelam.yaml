summary:
  ar: "مدخل «كلام» في موسوعة TDV الإسلامية ليوسف شوقي يافوز: تعريف علم الكلام ونشأته على يد الجهمية والمعتزلة، وتكوّن المدرستين السنّيتين الأشعرية والماتريدية، والمتكلمون المتقدمون والمتأخرون، وحركة «العلم الجديد للكلام» في العصر الحديث."
  en: "The TDV İslâm Ansiklopedisi entry on kalam by Yusuf Şevki Yavuz: the science's definitions, its birth with the Jahmiyya and Mu'tazila, the formation of the Sunni Ash'ari and Maturidi schools, the early and later mutakallimun, and the 'new ilm-i kelam' movement of the modern age."
  ur: "TDV اسلام دائرۃ المعارف کا مضمون «کلام» یوسف شوکی یاووز کی تحریر: علم کی تعریفات، جہمیہ اور معتزلہ کے ہاتھوں اس کا آغاز، اشاعرہ اور ماتریدیہ سنی مسلکوں کا قیام، متقدمین و متاخرین متکلمین، اور جدید «نئے علم کلام» کی تحریک۔"
  es: "La entrada de Yusuf Şevki Yavuz en la TDV İslâm Ansiklopedisi sobre kalam: las definiciones de la ciencia, su nacimiento con los Jahmiyya y Mu'tazila, la formación de las escuelas sunitas Ash'ari y Maturidi, los primeros y posteriores mutakallimun, y el movimiento 'new ilm-i kelam' de la era moderna."
  fr: "L'article de la TDV İslâm Ansiklopedisi sur le kalam par Yusuf Şevki Yavuz: les définitions de la science, sa naissance avec les Jahmiyya et les Mu'tazila, la formation des écoles sunnites Ash'ari et Maturidi, les premiers et derniers mutakallimun, et le mouvement « nouvel ilm-i kelam » de l'ère moderne."
  tr: "TDV İslami Ansiklopedisi'nde Yusuf Shawqi Yafuz'un \"Kalam\"a Girişi: Kalam'ın tanımı ve kökeni, Ash'ari ve Maturidis'in iki Sünni okulunu oluşturan Ash'ari ve Maturidis'in ellerinde, erken ve sonraki teologlar ile modern çağda \"Kalam'ın Yeni Bilimi\" hareketi."
  id: "Pengantar \"Kalam\" dalam Ensiklopedia Islam TDV oleh Yusuf Shawqi Yafuz: Definisi Kalam dan asal-usulnya dari tangan Jahmiyyah dan Mu'tazilite, membentuk dua aliran Sunni Ash'ari dan Maturidi, teolog awal dan kemudian, serta gerakan \"Ilmu Baru Kalam\" di era modern."
