  ar: "مقالة ويكيبيديا العربية عن الملا خسرو، مراجعة 3 آب 2026؛ مقالة وجيزة تصرّح في متنها بأنه «فقيه حنفي رومي الأصل»، واسمه محمد بن فرامرز بن علي، وتذكر ولايته قضاء القسطنطينية ووفاته بها سنة 885هـ/1480م ونقل جثمانه إلى بروسة، وتنقل عن ابن العماد في «شذرات الذهب»."
  en: "Arabic Wikipedia article on Molla Hüsrev, revision of 3 August 2026; a short article whose lead states in text that he was 'a Hanafi jurist of Rumi origin', names him Muhammad b. Faramurz b. Ali, records his judgeship of Constantinople, his death there in 885/1480 and the transfer of his body to Bursa, and quotes Ibn al-Imad's Shadharat al-Dhahab."
