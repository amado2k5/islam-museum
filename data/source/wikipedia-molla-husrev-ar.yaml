summary:
  ar: "مقالة ويكيبيديا العربية عن الملا خسرو، مراجعة 3 آب 2026؛ مقالة وجيزة تصرّح في متنها بأنه «فقيه حنفي رومي الأصل»، واسمه محمد بن فرامرز بن علي، وتذكر ولايته قضاء القسطنطينية ووفاته بها سنة 885هـ/1480م ونقل جثمانه إلى بروسة، وتنقل عن ابن العماد في «شذرات الذهب»."
  en: "Arabic Wikipedia article on Molla Hüsrev, revision of 3 August 2026; a short article whose lead states in text that he was 'a Hanafi jurist of Rumi origin', names him Muhammad b. Faramurz b. Ali, records his judgeship of Constantinople, his death there in 885/1480 and the transfer of his body to Bursa, and quotes Ibn al-Imad's Shadharat al-Dhahab."
  es: "Artículo en árabe de la Wikipedia sobre Molla Hüsrev, revisión del 3 de agosto de 2026; un artículo breve cuyo texto inicial afirma que era \"un jurista hanafí de origen rumiense\", lo nombra Muhammad b. Faramurz b. Ali, registra su cargo como juez en Constantinopla, su muerte allí en 885/1480 y el traslado de su cuerpo a Bursa, y cita el Shadharat al-Dhahab de Ibn al-Imad."
  fr: "Article de Wikipédia en arabe sur Molla Hüsrev, révision du 3 août 2026; un court article dont l'introduction indique qu'il était « un juriste hanafite d'origine rumime », le nomme Muhammad b. Faramurz b. Ali, relate son mandat de juge à Constantinople, sa mort dans cette ville en 885/1480 et le transfert de sa dépouille à Bursa, et cite le Shadharat al-Dhahab d'Ibn al-Imad."
