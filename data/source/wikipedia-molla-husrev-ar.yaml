reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). A stub-length article, but its lead sentence is one of the two attestations on which this record's faith settlement rests: the Hanafi school is stated of the man himself in the article's text ('a Hanafi jurist'), not in an infobox or a structured value. Its death pairing (885 AH / 1480 CE) agrees with the TDV encyclopedia against the Shadharat tradition's 886 AH. Its reference for the biography is a citation into a printed biographical dictionary (vol. 2, p. 601) and al-Zirikli's al-A'lam for the works list. Read live on 1 November 2026; the article's own page property grounds Wikidata item Q12244864."
