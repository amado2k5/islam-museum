  ar: "مقالة ويكيبيديا الفرنسية عن الشيخ محمدو فالو مباكي (1888–1968)، الخليفة الثاني للمريدية؛ تُستخدم لوقائع الكيان فقط. تروي تعليمه على يد عمه ثم والده أحمدو بمبا في موريتانيا، وخلافته لأخيه الأكبر سنة 1945، وبناءه الجامع الكبير في طوبى."
  en: "French Wikipedia article on Cheikh Mouhamadou Fallou Mbacké (1888-1968), second caliph of the Mourides; used for entity facts only. It recounts his education under his uncle and then his father Amadou Bamba in Mauritania, his succession to his elder brother in 1945, and his completion of the Great Mosque of Touba."
