reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md). Read in full on 26 October 2026 at the recorded revision, fetched by revision id via the MediaWiki API and the returned id asserted equal. It gives his birth on 27 June 1888 at Darou Salam and his death on 6 August 1968 at Touba. Its infobox carries a 'religious order' field naming the Mouridisme for him — a personal-affiliation field, but an infobox value, one attestation family; its text otherwise describes him by office and descent (second son of Ahmadou Bamba, second caliph of the Mourides from 13 July 1945) and by his formation, completed under his father's direction in Mauritania. No sentence states his own initiation or bay'a."
