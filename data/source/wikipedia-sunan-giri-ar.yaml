summary:
  ar: "مقالة ويكيبيديا العربية عن سونن قيري ⁦(محمد عين اليقين)⁩؛ تعطي ولادته 846هـ/1442م ووفاته 912هـ/1506م، وصندوقها يعطي عقيدته أهل السنة والجماعة ومذهبه الشافعي، مع سلسلة نسب باعلوية تجعله ابن إسحاق."
  en: "Arabic Wikipedia article on Sunan Giri (Muhammad Ainul Yaqin); it gives his birth in 846 AH/1442 and death in 912 AH/1506, and its infobox gives his creed as Sunni and his madhhab as Shafi'i, with a Ba'alawi genealogical chain making him a son of Ishaq."
  es: "Artículo de Wikipedia en árabe sobre Sunan Giri (Muhammad Ainul Yaqin); indica que nació en el año 846 AH/1442 y murió en el año 912 AH/1506, y su ficha informativa señala que su credo era sunita y su madhhab shafi'i, con una cadena genealógica ba'alawi que lo convierte en hijo de Ishaq."
  fr: "L'article de Wikipédia en arabe sur Sunan Giri (Muhammad Ainul Yaqin) indique sa naissance en 846 AH/1442 et sa mort en 912 AH/1506, et son infobox indique sa croyance comme sunnite et son madhhab comme shafi'i, avec une chaîne généalogique ba'alawi faisant de lui un fils d'Ishaq."
  ur: "سنن گری ⁦(محمد عین الیقین)⁩ پر عربی ویکیپیڈیا مضمون؛ اس کی ولادت 846ھ/1442ء میں ہوئی اور وفات 912ھ/1506ء میں ہوئی، اور اس کا معلومات خانہ اس کا عقیدہ سنی اور اس کے مذہب کو شافعی بتاتا ہے، جس میں بعلوی نسباتی سلسلہ اسے اسحاق کا بیٹا بناتا ہے۔"
  tr: "Arapça Wikipedia'daki Sunan Qiri (Muhammed Ayn el-Yaqin) hakkındaki makale, onun 846 Hicri/1442 yılında doğduğunu ve 912 Hicri/1506 yılında öldüğünü belirtir; kutusunda ise Ehl-sünnet vel-Cema'ah inancı ve Şafii okulu ile birlikte İbn İshaq olarak gösterilen bir Alevi soy zinciri yer alır."
  id: "Artikel Wikipedia bahasa Arab tentang Sunan Qiri (Muhammad Ayn al-Yaqin); menyebutkan kelahirannya pada tahun 846 H/1442 M dan kematiannya pada tahun 912 H/1506 M, dan kotaknya memuat kredonya sebagai Ahl al-Sunnah wal-Jama'ah serta aliran pemikiran Syafi'i, bersama dengan rangkaian garis keturunan Alawit yang menempatkannya sebagai Ibn Ishaq."
