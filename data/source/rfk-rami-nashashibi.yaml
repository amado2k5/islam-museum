reliability_note: "Profile text read via the Center's site listing on 25 October 2026. It states: 'Rami Nashashibi was born in Amman, Jordan, lived in Spain, Saudi Arabia, and Italy during his teenage years, and moved to Chicago at age 19. There he earned a B.A. from DePaul University in 1995 and a Ph.D. in sociology from the University of Chicago in 2010.' The PhD year there (2010) conflicts with the University of Chicago's own 2011, which the record follows. The Amman birthplace is corroborated at country level by On Being's programme transcript, in which Nashashibi confirms he was born in Jordan, and by the Presbyterian Outlook's 2023 profile."
