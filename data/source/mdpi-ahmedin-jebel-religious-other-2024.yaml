label: { en: "The Ethiopian Orthodox Tewahedo Church as Religious Other in Contemporary Ethiopia — Religions (2024), section on Ahmedin Jebel" }
summary:
  ar: "مقالة سيليشيه سيماهاني كوملاتشيو في مجلة Religions سنة 2024؛ يصف قسمها المخصص لأحمدين جبل عمله أستاذًا وناشطًا ومستشارًا للشؤون الاجتماعية لرئيس المجلس الأعلى للشؤون الإسلامية في إثيوبيا، ويذكر أنه كتب خمسة كتب."
  en: "Sileshie Semahagne Kumlachew's 2024 article in Religions; its section on Ahmedin Jebel describes his work as an ustaz (teacher) and activist and as social affairs advisor to the president of the Ethiopian Islamic Affairs Supreme Council, and records that he wrote five books."
  es: "El artículo de Sileshie Semahagne Kumlachew de 2024 en la revista Religions, en su sección sobre Ahmedin Jebel, describe su trabajo como ustaz (maestro) y activista, así como asesor de asuntos sociales del presidente del Consejo Supremo de Asuntos Islámicos de Etiopía, y recoge que escribió cinco libros."
  fr: "L'article de Sileshie Semahagne Kumlachew paru en 2024 dans la revue Religions; sa section sur Ahmedin Jebel décrit son travail en tant qu'ustaz (enseignant) et militant, ainsi que son rôle de conseiller aux affaires sociales auprès du président du Conseil suprême des affaires islamiques éthiopien, et indique qu'il a écrit cinq livres."
  ur: "Sileshie Semahagne Kumlachew کا 2024 کا مضمون مذاہب میں؛ احمدین جیبل پر اس کا سیکشن ایک استاد ⁦(استاد)⁩ اور کارکن کے طور پر اور ایتھوپیا کی اسلامک افیئر سپریم کونسل کے صدر کے سماجی امور کے مشیر کے طور پر ان کے کام کو بیان کرتا ہے، اور ریکارڈ کرتا ہے کہ اس نے پانچ کتابیں لکھیں۔"
  tr: "Seleshie Semahani Komlachio'nun 2024 yılında Religions dergisindeki makalesi; Ahmadine Jabal'a adanmış bölümde, Etiyopya İslami İşler Yüksek Konseyi Başkanı'na profesör, aktivist ve sosyal işler danışmanı olarak yaptığı çalışmalar anlatılıyor ve beş kitap yazdığını belirtiyor."
  id: "Artikel Seleshie Semahani Komlachio di majalah Religions tahun 2024; bagian yang didedikasikan untuk Ahmadine Jabal menggambarkan pekerjaannya sebagai profesor, aktivis, dan penasihat urusan sosial untuk Presiden Dewan Tertinggi Urusan Islam di Ethiopia, menyebutkan bahwa ia menulis lima buku."
title: "The Ethiopian Orthodox Tewahedo Church as Religious Other in Contemporary Ethiopia: Discursive Practices of Three Selected Religious Authorities"
