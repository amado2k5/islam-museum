reliability_note: "Open-access peer-reviewed article, read in full (section 5.3) on 7 November 2026. It describes the 16-and-a-half-minute video speech Ahmedin Jebel delivered on 3 June 2023 and states verbatim: 'In addition to his position as an advisor, Ahmedin currently works as an Ustaz (teacher) and activist. He wrote three books critical of the history of Ethiopian Muslims and their relationship with Christian kings and two other books on Islam and contemporary issues.' The advisor position is specified as social affairs advisor to the president of the Ethiopian Islamic Affairs Supreme Council (EIASC). The article also records that the speech 'was streamed live from his own official Facebook page and has so far attracted over half a million viewers, 47,000 reactions (likes and loves), and 6100 comments'. It gives no birth date and names no school of law or order for him. Read on 7 November 2026."
