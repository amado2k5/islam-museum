  id: "Artikel Wikipedia bahasa Inggris tentang Thanaullah Al-Amritsari (1868-1948); infobox menyebutkan bahwa sekolahnya adalah Islam Sunni, yurisprudensinya Salafi, dan gerakannya adalah Ahl al-Hadith. Artikel tersebut mencantumkan biografi, ajaran, debat, dan tulisannya."
