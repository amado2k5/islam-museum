summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أشرف غني؛ تُستخدم لوقائع الكيان فقط. تروي مولده في 19 مايو 1949 في لوكر، وتعليمه في كابل وبيروت وكولومبيا، وأستاذيته وعمله في البنك الدولي، ووزارته للمالية (2002–2004) ورئاسته لجامعة كابل (2004–2008)، ورئاسته لأفغانستان (2014–2021) ومغادرته البلاد في 15 أغسطس 2021. لا يرد فيها أي محتوى ديني على الإطلاق."
  en: "English Wikipedia article on Ashraf Ghani; used for entity facts only. It recounts his birth on 19 May 1949 in Logar, his education at Kabul, Beirut and Columbia, his teaching and his World Bank years, his finance ministry (2002–2004) and chancellorship of Kabul University (2004–2008), his presidency of Afghanistan (2014–2021) and his departure from the country on 15 August 2021. It carries no religion content at all."
  ur: "اشرف غنی پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے مستعمل۔ اس میں 19 مئی 1949ء کو لوگر میں ان کی پیدائش، کابل، بیروت اور کولمبیا میں ان کی تعلیم، ان کی تدریس اور عالمی بنک کے برس، ان کی وزارت خزانہ ⁦(2002ء–2004ء)⁩ اور جامعہ کابل کی چانسلری ⁦(2004ء–2008ء)⁩، افغانستان کی صدارت ⁦(2014ء–2021ء)⁩ اور 15 اگست 2021ء کو ملک چھوڑنا بیان ہوا ہے۔ اس میں کوئی مذہبی مواد بالکل نہیں۔"
  es: "Artículo de la Wikipedia en inglés sobre Ashraf Ghani; utilizado únicamente para datos biográficos. Relata su nacimiento el 19 de mayo de 1949 en Logar, su formación académica en Kabul, Beirut y Colombia, su trayectoria docente y sus años en el Banco Mundial, su ministerio de finanzas (2002-2004) y su rectorado de la Universidad de Kabul (2004-2008), su presidencia de Afganistán (2014-2021) y su salida del país el 15 de agosto de 2021. No contiene ningún contenido religioso."
  fr: "Article Wikipédia en anglais sur Ashraf Ghani; utilisé uniquement à des fins factuelles. Il relate sa naissance le 19 mai 1949 à Logar, ses études à Kaboul, Beyrouth et en Colombie, sa carrière d’enseignant et ses années à la Banque mondiale, son ministère des Finances (2002-2004) et sa fonction de chancelier de l’université de Kaboul (2004-2008), sa présidence de l’Afghanistan (2014-2021) et son départ du pays le 15 août 2021. Il ne contient aucun élément religieux."
  tr: "Ashraf Ghani hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 19 Mayıs 1949'da Loker'de doğmasını, Kabil, Beyrut ve Kolombiya'daki eğitimini, Dünya Bankası'ndaki profesörlük ve çalışmalarını, Maliye Bakanlığını (2002–2004), Kabil Üniversitesi başkanlığını (2004–2008), Afganistan başkanlığını (2014–2021) ve 15 Ağustos 2021'de ülkeden ayrılışını anlatır. Hiçbir dini içerik içermez."
  id: "Artikel Wikipedia bahasa Inggris tentang Ashraf Ghani; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya pada 19 Mei 1949 di Loker, pendidikannya di Kabul, Beirut, dan Kolombia, jabatan profesor dan pekerjaannya di Bank Dunia, Kementerian Keuangan (2002–2004), kepresidenannya di Universitas Kabul (2004–2008), kepresidenannya di Afghanistan (2014–2021), dan kepergiannya dari negara tersebut pada 15 Agustus 2021. Artikel ini sama sekali tidak memuat konten keagamaan."
