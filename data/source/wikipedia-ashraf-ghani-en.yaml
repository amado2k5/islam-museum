summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أشرف غني؛ تُستخدم لوقائع الكيان فقط. تروي مولده في 19 مايو 1949 في لوكر، وتعليمه في كابل وبيروت وكولومبيا، وأستاذيته وعمله في البنك الدولي، ووزارته للمالية (2002–2004) ورئاسته لجامعة كابل (2004–2008)، ورئاسته لأفغانستان (2014–2021) ومغادرته البلاد في 15 أغسطس 2021. لا يرد فيها أي محتوى ديني على الإطلاق."
  en: "English Wikipedia article on Ashraf Ghani; used for entity facts only. It recounts his birth on 19 May 1949 in Logar, his education at Kabul, Beirut and Columbia, his teaching and his World Bank years, his finance ministry (2002–2004) and chancellorship of Kabul University (2004–2008), his presidency of Afghanistan (2014–2021) and his departure from the country on 15 August 2021. It carries no religion content at all."
  ur: "اشرف غنی پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے مستعمل۔ اس میں 19 مئی 1949ء کو لوگر میں ان کی پیدائش، کابل، بیروت اور کولمبیا میں ان کی تعلیم، ان کی تدریس اور عالمی بنک کے برس، ان کی وزارت خزانہ (2002ء–2004ء) اور جامعہ کابل کی چانسلری (2004ء–2008ء)، افغانستان کی صدارت (2014ء–2021ء) اور 15 اگست 2021ء کو ملک چھوڑنا بیان ہوا ہے۔ اس میں کوئی مذہبی مواد بالکل نہیں۔"
