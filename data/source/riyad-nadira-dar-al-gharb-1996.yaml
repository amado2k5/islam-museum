  ar: "تحقيق ودراسة للقسم الخاص بمناقب أبي بكر الصديق من الرياض النضرة للمحب الطبري الشافعي ⁦(ت 694هـ)⁩، مع دراسة مطولة لعصر المؤلف وحياته وكتابه ومنهجه ونسخه الخطية؛ دار الغرب الإسلامي، بيروت، الطبعة الأولى 1996م. أصله رسالة ماجستير كما يذكر المحقق."
  en: "A critical edition and study of the section of al-Muhibb al-Tabari's (d. 694 AH) al-Riyad al-Nadira on Abu Bakr al-Siddiq, with a long study of the author's age, life, book, method and manuscripts; Dar al-Gharb al-Islami, Beirut, 1st edition 1996. The editor says it began as a master's thesis."
