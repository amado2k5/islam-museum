  fr: "Le lien de Alfiyya of Ibn Malik (al-Khulasa al-Alfiyya) dans la bibliothèque Shamela, tel que le liste un résumé de recherche remis au musée ; le musée n'a pas ouvert la page, et le fondateur a approuvé l'usage du résumé sans nouvelle vérification le 21 novembre 2026, pour la présence de l'ouvrage dans la bibliothèque Shamela."
  es: "El enlace de Alfiyya of Ibn Malik (al-Khulasa al-Alfiyya) en la biblioteca Shamela, tal como lo lista un resumen de investigación entregado al museo; el museo no abrió la página, y el fundador aprobó usar el resumen sin nueva verificación el 21 de noviembre de 2026, para la presencia de la obra en la biblioteca Shamela."
