summary:
  ar: "دراسة أكاديمية لكيارا بيليغرينو في مجلة «أواسيس» عن الداعيات السعوديات؛ تذكر نوال العيد ضمن أبرزهن بأكثر من أربعة ملايين ونصف متابع على تويتر، وتأسيسها وقف إثراء المعرفة في الرياض سنة 2012، وتهديدها سنة 2014 بمقاضاة من اتهموها بالانتماء إلى الإخوان، وتصنيف الأدبيات لهؤلاء الداعيات ضمن «الداعيات المثقفات»."
  en: "Chiara Pellegrino's academic article in Oasis on Saudi women preachers; it names Nawal al-'Id among the leading figures, with over four and a half million followers on Twitter, records her opening of the Ithra' al-Ma'rifa endowment in Riyadh in 2012 and her 2014 threat to sue those who accused her of belonging to the Ikhwan movement, and reports the academic literature's category of 'intellectual preachers' (da'iyat muthaqqafat) for these women."
  es: "El artículo académico de Chiara Pellegrino en Oasis sobre las predicadoras saudíes menciona a Nawal al-'Id entre las figuras más destacadas, con más de cuatro millones y medio de seguidores en Twitter, recoge la inauguración de la fundación Ithra' al-Ma'rifa en Riad en 2012 y su amenaza en 2014 de demandar a quienes la acusaban de pertenecer al movimiento Ikhwan, e informa sobre la categoría de \"predicadoras intelectuales\" (da'iyat muthaqqafat) que la literatura académica asigna a estas mujeres."
  fr: "L'article universitaire de Chiara Pellegrino dans Oasis sur les femmes prédicatrices saoudiennes; il cite Nawal al-'Id parmi les figures de proue, avec plus de quatre millions et demi d'abonnés sur Twitter, relate son inauguration de la fondation Ithra' al-Ma'rifa à Riyad en 2012 et sa menace en 2014 de poursuivre en justice ceux qui l'accusaient d'appartenir au mouvement des Frères musulmans, et mentionne la catégorie de « prédicatrices intellectuelles » (da'iyat muthaqqafat) utilisée dans la littérature académique pour désigner ces femmes."
title: "Women Preachers at the Service of the Reason of State"
