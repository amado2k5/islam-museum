summary:
  ar: "دراسة أكاديمية لكيارا بيليغرينو في مجلة «أواسيس» عن الداعيات السعوديات؛ تذكر نوال العيد ضمن أبرزهن بأكثر من أربعة ملايين ونصف متابع على تويتر، وتأسيسها وقف إثراء المعرفة في الرياض سنة 2012، وتهديدها سنة 2014 بمقاضاة من اتهموها بالانتماء إلى الإخوان، وتصنيف الأدبيات لهؤلاء الداعيات ضمن «الداعيات المثقفات»."
  en: "Chiara Pellegrino's academic article in Oasis on Saudi women preachers; it names Nawal al-'Id among the leading figures, with over four and a half million followers on Twitter, records her opening of the Ithra' al-Ma'rifa endowment in Riyadh in 2012 and her 2014 threat to sue those who accused her of belonging to the Ikhwan movement, and reports the academic literature's category of 'intellectual preachers' (da'iyat muthaqqafat) for these women."
title: "Women Preachers at the Service of the Reason of State"
