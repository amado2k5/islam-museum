reliability_note: "Academic article, read in full on 26 October 2026. Of Nawal al-'Id it states: that she is a preacher with over four and a half million followers on Twitter; that in 2012 she opened Ithra' al-Ma'rifa, a pious endowment (waqf) in Riyadh offering programmes for women's cultural and social progress and courses in memorising the Qur'an and preserving the Prophet's legacy; that in 2014 she threatened to sue those who accused her of being part of the Ikhwani movement, associating her with the Muslim Brotherhood; and it summarises her 2012 article 'Al-kadhba al-kubra' (The Great Lie) on equality and difference between men and women. It places the Saudi women 'intellectual preachers' as a group, 'in general', within the Wahhabi tradition — a characterisation of the category, expressly noting that the women in question do not identify with the categories the debate assigns them; it is not an attestation of her own legal school, and it is used in the person record only as a reported characterisation."
