summary:
  ar: "مقالة ويكيبيديا العربية عن نصر الله خان؛ تُستخدم لوقائع الكيان فقط. تعطي مولده سنة 1874 ووفاته سنة 1920 بكابل، ومتنها يذكر مولده في سمرقند أثناء نفي أبيه عبد الرحمن خان، وأخويه حبيب الله خان ومحمد عمر خان، وإمارته لأسبوع واحد سنة 1919 وسجنه واغتياله. يعطي صندوق معلوماتها دينه «الإسلام» دون تسمية مذهب."
  en: "Arabic Wikipedia article on Nasrullah Khan; used for entity facts only. It gives his birth in 1874 and his death in 1920 at Kabul; its text places his birth at Samarkand during his father Abdur Rahman Khan's exile, names his brothers Habibullah Khan and Mohammad Omar Khan, and recounts his one week as Emir in 1919, his imprisonment and his assassination. Its infobox gives his religion as Islam, generically, naming no school."
  es: "Artículo de Wikipedia en árabe sobre Nasrullah Khan; utilizado únicamente para datos sobre la persona. Indica su nacimiento en 1874 y su muerte en 1920 en Kabul; su texto sitúa su nacimiento en Samarcanda durante el exilio de su padre, Abdur Rahman Khan, menciona a sus hermanos Habibullah Khan y Mohammad Omar Khan, y relata su semana como emir en 1919, su encarcelamiento y su asesinato. Su ficha informativa indica que su religión era el islam, de forma genérica, sin mencionar ninguna escuela."
  fr: "Article de Wikipédia en arabe sur Nasrullah Khan; utilisé uniquement pour les informations factuelles. Il indique sa naissance en 1874 et sa mort en 1920 à Kaboul; le texte situe sa naissance à Samarcande pendant l’exil de son père, Abdur Rahman Khan, mentionne ses frères, Habibullah Khan et Mohammad Omar Khan, et relate sa semaine en tant qu’émir en 1919, son emprisonnement et son assassinat. Son infobox indique qu’il était musulman, sans préciser d’école."
