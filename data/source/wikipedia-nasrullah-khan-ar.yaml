  ar: "مقالة ويكيبيديا العربية عن نصر الله خان؛ تُستخدم لوقائع الكيان فقط. تعطي مولده سنة 1874 ووفاته سنة 1920 بكابل، ومتنها يذكر مولده في سمرقند أثناء نفي أبيه عبد الرحمن خان، وأخويه حبيب الله خان ومحمد عمر خان، وإمارته لأسبوع واحد سنة 1919 وسجنه واغتياله. يعطي صندوق معلوماتها دينه «الإسلام» دون تسمية مذهب."
  en: "Arabic Wikipedia article on Nasrullah Khan; used for entity facts only. It gives his birth in 1874 and his death in 1920 at Kabul; its text places his birth at Samarkand during his father Abdur Rahman Khan's exile, names his brothers Habibullah Khan and Mohammad Omar Khan, and recounts his one week as Emir in 1919, his imprisonment and his assassination. Its infobox gives his religion as Islam, generically, naming no school."
