summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن نادر انقطاع؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في طهران سنة 1955، ودكتوراه كالتك 1982، وأستاذيته في جامعة بنسلفانيا وريادته في المواد الخارقة والبصريات النانوية، وجوائزه ومنها ميدالية إسحاق نيوتن 2020 وميدالية فرانكلين 2023."
  en: "English Wikipedia article on Nader Engheta; used for entity facts only. It recounts his birth in Tehran in 1955, his 1982 Caltech doctorate, his professorship at the University of Pennsylvania and his pioneering work in metamaterials and nanophotonics, and his awards including the 2020 Isaac Newton Medal and the 2023 Franklin Medal."
  es: "Artículo de la Wikipedia en inglés sobre Nader Engheta; utilizado únicamente para datos sobre la persona. Relata su nacimiento en Teherán en 1955, su doctorado en Caltech en 1982, su cátedra en la Universidad de Pensilvania y su trabajo pionero en metamateriales y nanofotónica, así como sus premios, entre los que se incluyen la Medalla Isaac Newton de 2020 y la Medalla Franklin de 2023."
  fr: "Article de Wikipédia en anglais sur Nader Engheta; utilisé uniquement à des fins d’information sur l’entité. Il relate sa naissance à Téhéran en 1955, son doctorat obtenu au Caltech en 1982, son poste de professeur à l’Université de Pennsylvanie et ses travaux pionniers dans le domaine des métamatériaux et de la nanophotonique, ainsi que les distinctions qu’il a reçues, notamment la médaille Isaac Newton en 2020 et la médaille Franklin en 2023."
