label: { en: "Abd al-Salam al-Shuwair — author biography, Al-Maktaba al-Shamela" }
summary:
  ar: "صفحة ترجمة عبد السلام بن محمد الشويعر في المكتبة الشاملة مع قائمة مؤلفاته: أستاذ مشارك بقسم العلوم الشرعية والقانونية في كلية الملك فهد الأمنية، من طلاب الشيخ ابن باز، ووالده محمد بن سعد الشويعر جامع فتاوى ابن باز ومدير مكتبه."
  en: "The Al-Maktaba al-Shamela author page for Abd al-Salam ibn Muhammad al-Shuwair, with his works: associate professor in the Department of Sharia and Legal Sciences at King Fahd Security College, a student of Ibn Baz, and his father Muhammad ibn Sa'd al-Shuwair was the compiler of Ibn Baz's fatwas and the manager of his office."
  es: "La página del autor de Al-Maktaba al-Shamela para Abd al-Salam ibn Muhammad al-Shuwair, con sus obras: profesor asociado en el Departamento de Sharia y Ciencias Jurídicas en el King Fahd Security College, un estudiante de Ibn Baz, y su padre Muhammad ibn Sa'd al-Shuwair fue el compilador de las fatwas de Ibn Baz y el gerente de su oficina."
  fr: "La page d'auteur d'Al-Maktaba al-Shamela pour Abd al-Salam ibn Muhammad al-Shuwair, avec ses œuvres: professeur associé au département de charia et de sciences juridiques du King Fahd Security College, élève d'Ibn Baz, et son père Muhammad ibn Sa'd al-Shuwair était le compilateur des fatwas d'Ibn Baz et le directeur de son bureau."
  ur: "عبدالسلام بن محمد الشویر کے لیے المکتبہ الشمیلہ کا مصنف صفحہ، ان کے کاموں کے ساتھ: کنگ فہد سیکیورٹی کالج کے شعبہ شریعہ اور قانونی علوم میں ایسوسی ایٹ پروفیسر، ابن باز کے طالب علم، اور ان کے والد محمد بن سعد الشویر ابن باز کے دفتر اور ان کے فتویٰ کے مرتب کرنے والے تھے۔"
  tr: "Abdul Salam bin Muhammed El-Şuvaier'in biyografisinin sayfası, Al-Maktaba Al-Shamela'da eserlerinin listesiyle: Kral Fahd Güvenlik Koleji Şeriat ve Hukuk Bilimleri Bölümü'nde Doçent, Şeyh İbn Baz'ın öğrencisi ve babası Muhammed bin Saad Al-Shuwaier, İbn Baz'ın fetvalarının toplayıcısı ve ofisinin müdürü."
  id: "Halaman biografi Abdul Salam bin Muhammad Al-Shuwaier di Al-Maktaba Al-Shamela dengan daftar karyanya: Associate Professor di Departemen Syariah dan Ilmu Hukum di King Fahd Security College, murid Sheikh Ibn Baz, dan ayahnya Muhammad bin Saad Al-Shuwaier, seorang kolektor fatwa Ibn Baz dan direktur kantornya."
