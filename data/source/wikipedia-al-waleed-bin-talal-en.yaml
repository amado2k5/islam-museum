summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الأمير الوليد بن طلال بن عبد العزيز آل سعود ⁦(وُلد في ٧ آذار ١٩٥٥ في جدة)⁩، رجل الأعمال والمستثمر السعودي مؤسس شركة المملكة القابضة؛ تذكر نسبه ودراسته في لبنان والولايات المتحدة واستثماراته المصرفية والإعلامية واحتجازه سنة ٢٠١٧ وإطلاق سراحه وأعماله الخيرية، ولا يسمي نثرها مذهبًا أو انتماءً للرجل نفسه."
  en: "English Wikipedia article on Prince Al Waleed bin Talal Al Saud (born 7 March 1955 in Jeddah), Saudi businessman, investor and royal, founder of Kingdom Holding Company; it records his parentage, his education in Lebanon and the United States, his banking and media investments, his 2017 detention and release, and his philanthropy, and its prose names no school or affiliation for the man himself."
  es: "Artículo de la Wikipedia en inglés sobre el príncipe Al Waleed bin Talal Al Saud (nacido el 7 de marzo de 1955 en Jeddah), empresario, inversor y miembro de la realeza saudí, fundador de Kingdom Holding Company; en él se recogen sus antecedentes familiares, su educación en el Líbano y los Estados Unidos, sus inversiones bancarias y en medios de comunicación, su detención y liberación en 2017 y su filantropía, y en su prosa no se menciona ninguna escuela ni afiliación del propio hombre."
  fr: "L'article de Wikipédia en anglais sur le prince Al Waleed bin Talal Al Saud (né le 7 mars 1955 à Djeddah), homme d'affaires, investisseur et membre de la famille royale saoudienne, fondateur de Kingdom Holding Company, relate ses origines, ses études au Liban et aux États-Unis, ses investissements dans les secteurs bancaire et médiatique, sa détention et sa libération en 2017, ainsi que ses actions philanthropiques. Le texte ne mentionne aucune école ni affiliation pour l'homme lui-même."
  ur: "پرنس الولید بن طلال آل سعود ⁦(پیدائش 7 مارچ 1955 جدہ)⁩ پر انگریزی ویکیپیڈیا مضمون، سعودی تاجر، سرمایہ کار اور شاہی، کنگڈم ہولڈنگ کمپنی کے بانی؛ اس میں اس کی ولدیت، اس کی لبنان اور ریاستہائے متحدہ میں تعلیم، اس کی بینکنگ اور میڈیا کی سرمایہ کاری، اس کی 2017 کی حراست اور رہائی، اور اس کی انسان دوستی کو ریکارڈ کیا گیا ہے، اور اس کے نثر میں اس شخص کے لیے کوئی اسکول یا وابستگی نہیں ہے۔"
  tr: "İngilizce Wikipedia'daki makale, Suudi iş insanı ve yatırımcı, Kingdom Holding Company'nin kurucusu Prens Alwaleed bin Talal bin Abdulaziz Al Saud (7 Mart 1955 doğumlu), Kingdom Holding Company'nin kurucusu ve soyundan, Lübnan ve Amerika Birleşik Devletleri'ndeki eğitimlerinden, bankacılık ve medya yatırımlarından, 2017'de tutuklanışından, tahliyesinden ve hayır işlerinden bahsediyor. Metninde adamın kendisiyle bir tarikat veya bağlantı belirtilmemektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Pangeran Alwaleed bin Talal bin Abdulaziz Al Saud (lahir 7 Maret 1955 di Jeddah), pengusaha dan investor Saudi, pendiri Kingdom Holding Company; artikel tersebut menyebutkan garis keturunannya, studi di Lebanon dan Amerika Serikat, investasi perbankan dan media, penahanannya pada 2017, pembebasannya, dan kerja amalnya. Prosa di dalamnya tidak mengidentifikasi sekte atau afiliasi dengan pria itu sendiri."
