  ar: "مقالة ويكيبيديا الإنجليزية عن الأمير الوليد بن طلال بن عبد العزيز آل سعود ⁦(وُلد في ٧ آذار ١٩٥٥ في جدة)⁩، رجل الأعمال والمستثمر السعودي مؤسس شركة المملكة القابضة؛ تذكر نسبه ودراسته في لبنان والولايات المتحدة واستثماراته المصرفية والإعلامية واحتجازه سنة ٢٠١٧ وإطلاق سراحه وأعماله الخيرية، ولا يسمي نثرها مذهبًا أو انتماءً للرجل نفسه."
  en: "English Wikipedia article on Prince Al Waleed bin Talal Al Saud (born 7 March 1955 in Jeddah), Saudi businessman, investor and royal, founder of Kingdom Holding Company; it records his parentage, his education in Lebanon and the United States, his banking and media investments, his 2017 detention and release, and his philanthropy, and its prose names no school or affiliation for the man himself."
