summary:
  ar: "مقالة ويكيبيديا الفرنسية عن محمد البشير الإبراهيمي؛ تُستخدم لوقائع الكيان فقط. تعطي مولده بأولاد إبراهم في 13 يونيو 1889 ووفاته بسطيف في 20 مايو 1965، ودراسته متون الفقه المالكي صبيًا و«الموطأ» والفقه المالكي بالمدينة، ونشاطه الإصلاحي وسطيف ورئاسته جمعية العلماء ووفاته رهن الإقامة الجبرية. لا تسمّي مذهبًا شخصيًا له."
  en: "French Wikipedia article on Mohamed Bachir El Ibrahimi; used for entity facts only. It gives his birth at Ouled Brahem on 13 June 1889 and death at Setif on 20 May 1965, his boyhood study of Maliki fiqh texts and his study of the Muwatta and Maliki jurisprudence in Medina, and his reform work at Setif, presidency of the Association of Ulama and death under house arrest. It names no personal school for him."
  es: "Artículo de la Wikipedia en francés sobre Mohamed Bachir El Ibrahimi; utilizado únicamente para datos biográficos. Indica su nacimiento en Ouled Brahem el 13 de junio de 1889 y su fallecimiento en Setif el 20 de mayo de 1965, sus estudios de textos de fiqh malikí durante su infancia y su estudio del Muwatta y la jurisprudencia malikí en Medina, así como su labor reformista en Setif, su presidencia de la Asociación de Ulemas y su muerte bajo arresto domiciliario. No menciona ninguna escuela a la que perteneciera."
  fr: "L'article de Wikipédia en français consacré à Mohamed Bachir El Ibrahimi, utilisé uniquement pour les informations relatives à l'entité, indique sa naissance à Ouled Brahem le 13 juin 1889 et son décès à Sétif le 20 mai 1965. Il mentionne également ses études, durant son enfance, des textes de fiqh malikites, ainsi que celles de la jurisprudence Muwatta et malikite à Médine. L'article relate son œuvre de réforme à Sétif, sa présidence de l'Association des oulémas et sa mort en résidence surveillée. Aucune école personnelle n'est mentionnée."
  ur: "محمد بچیر ال ابراہیمی پر فرانسیسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 13 جون 1889 کو اولید برہم میں ان کی پیدائش اور 20 مئی 1965 کو سیٹف میں وفات، مالکی فقہ کے متن کا ان کا لڑکپن کا مطالعہ اور مدینہ میں ان کے موطا اور مالکی فقہ کا مطالعہ، اور سیف میں ان کے اصلاحی کام، انجمن علماء کی صدارت اور نظر بندی میں موت۔ اس میں اس کے لیے کسی ذاتی اسکول کا نام نہیں ہے۔"
  tr: "Mohamed Al-Bashir Al-Ibrahimi hakkında Fransızca Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 13 Haziran 1889'da Oulad İbrahim'de doğdu, 20 Mayıs 1965'te Setif'te öldü ve çocukken Maliki fıkıhı üzerine yaptığı çalışmalar, şehirdeki 'Muwatta', Maliki hukuku, reformist faaliyetleri, Âlimler Derneği başkanlığı ve ev hapsinde ölümü üzerine çalışmaları yer aldı. Kişisel düşünce okulunun adı verilmemektedir."
  id: "Artikel Wikipedia Prancis tentang Mohamed Al-Bashir Al-Ibrahimi; hanya digunakan untuk fakta entitas. Ia lahir di Oulad Ibrahim pada 13 Juni 1889, meninggal di Setif pada 20 Mei 1965, dan studinya tentang hukum Maliki saat masih kecil, 'Muwatta', yurisprudensi Maliki di kota, aktivitas reformisnya, kepresidenan Asosiasi Cendekiwan, dan kematiannya di bawah tahanan rumah. Artikel tersebut tidak menyebutkan aliran pemikiran pribadinya."
