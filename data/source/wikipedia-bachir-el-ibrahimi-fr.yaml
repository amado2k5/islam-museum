summary:
  ar: "مقالة ويكيبيديا الفرنسية عن محمد البشير الإبراهيمي؛ تُستخدم لوقائع الكيان فقط. تعطي مولده بأولاد إبراهم في 13 يونيو 1889 ووفاته بسطيف في 20 مايو 1965، ودراسته متون الفقه المالكي صبيًا و«الموطأ» والفقه المالكي بالمدينة، ونشاطه الإصلاحي وسطيف ورئاسته جمعية العلماء ووفاته رهن الإقامة الجبرية. لا تسمّي مذهبًا شخصيًا له."
  en: "French Wikipedia article on Mohamed Bachir El Ibrahimi; used for entity facts only. It gives his birth at Ouled Brahem on 13 June 1889 and death at Setif on 20 May 1965, his boyhood study of Maliki fiqh texts and his study of the Muwatta and Maliki jurisprudence in Medina, and his reform work at Setif, presidency of the Association of Ulama and death under house arrest. It names no personal school for him."
