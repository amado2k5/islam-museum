summary:
  en: "Volume 1 of al-Abshihi's anthology of entertaining knowledge, as a scan on archive.org (item mustatraf_01). Its chapters gather proverbs, morals, histories, anecdotes and witty sayings; the chapters on misers and on joking are the part read so far."
  ar: "الجزء الأول من مجموع الأبشيهي في الأدب والطرائف، نسخة ممسوحة على الأرشيف ⁦(المعرّف mustatraf_01)⁩. تجمع أبوابه الأمثال والمواعظ والتواريخ والحكايات والنوادر، وقد قُرئ منها حتى الآن باب البخل وباب المزاح."
  es: "Volumen 1 de la antología de conocimientos entretenidos de al-Abshihi, disponible en archive.org (elemento mustatraf_01). Sus capítulos recopilan proverbios, moralejas, historias, anécdotas y dichos ingeniosos; los capítulos sobre los avaros y el humor son los que he leído hasta ahora."
  fr: "Le premier volume de l'anthologie de savoir divertissant d'al-Abshihi, disponible en version numérisée sur archive.org (référence mustatraf_01), rassemble proverbes, morales, récits historiques, anecdotes et bons mots; les chapitres consacrés aux avares et à l'art de plaisanter sont ceux que j'ai lus jusqu'à présent."
  ur: "archive.org پر اسکین کے طور پر العبشیحی کے اینتھالوجی آف انٹرٹیننگ علم کا جلد 1 اس کے ابواب میں کہاوتیں، اخلاقیات، تاریخیں، کہانیاں اور دلچسپ اقوال جمع ہیں۔ کنجوس اور مذاق کے باب اب تک پڑھے گئے حصے ہیں۔"
