summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن رفيع أحمد قدوائي (1894–1954)؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في مسولي بمنطقة بارابانكي، ودراسته في الكلية المحمدية الأنجلو-شرقية، ونشاطه في حركة الخلافة وعدم التعاون، ووزارتيه للاتصالات (1947–1952) ثم للغذاء والزراعة (1952–1954) في حكومة الهند المستقلة، ووفاته في دلهي في 24 أكتوبر 1954."
  en: "English Wikipedia article on Rafi Ahmed Kidwai (1894–1954); used for entity facts only. It recounts his upbringing at Masauli in Barabanki district, his studies at the Muhammadan Anglo-Oriental College, his Khilafat and non-cooperation activism, his ministries of Communications (1947–1952) and then Food and Agriculture (1952–1954) in independent India's government, and his death at Delhi on 24 October 1954."
  es: "Artículo de la Wikipedia en inglés sobre Rafi Ahmed Kidwai (1894-1954); utilizado únicamente para datos sobre la persona. Relata su infancia en Masauli, en el distrito de Barabanki, sus estudios en el Muhammadan Anglo-Oriental College, su activismo en favor del Khilafat y la no cooperación, sus ministerios de Comunicaciones (1947-1952) y posteriormente de Alimentación y Agricultura (1952-1954) en el gobierno de la India independiente, y su fallecimiento en Delhi el 24 de octubre de 1954."
  fr: "Article de Wikipédia en anglais sur Rafi Ahmed Kidwai (1894-1954); utilisé uniquement à des fins d'information sur l'entité. Il relate son enfance à Masauli, dans le district de Barabanki, ses études au Muhammadan Anglo-Oriental College, son activisme pour le Califat et la non-coopération, ses ministères des Communications (1947-1952) puis de l'Alimentation et de l'Agriculture (1952-1954) au sein du gouvernement de l'Inde indépendante, et sa mort à Delhi le 24 octobre 1954."
  ur: "رفیع احمد قدوائی (1894–1954) پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں بارہ بنکی ضلع کے مسولی میں ان کی پرورش، محمڈن اینگلو اورینٹل کالج میں ان کی تعلیم، خلافت اور عدم تعاون کی سرگرمی، ان کی وزارت مواصلات (1947-1952) اور پھر خوراک اور زراعت (1952-1954)، آزاد ہندوستان اور 24 اکتوبر کو دہلی کی آزاد حکومت میں ان کی موت کا ذکر ہے۔"
  tr: "Rafi Ahmed Qadwaei (1894–1954) hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılır. Kitap, Barabanki bölgesindeki Masuli'de yetiştirilme sürecini, Anglo-Doğu Muhammadiyah Koleji'ndeki eğitimlerini, Hilafe Hareketi ve İşbirliği Yapmama faaliyetlerini, Hindistan'ın bağımsız hükümetinde iletişim bakanlıklarını (1947–1952) ve ardından gıda ve tarım bakanlıklarını (1952–1954) ve 24 Ekim 1954'te Delhi'de vefatını anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Rafi Ahmed Qadwaei (1894–1954); hanya digunakan untuk fakta entitas. Artikel ini menceritakan masa kecilnya di Masuli di wilayah Barabanki, studinya di Anglo-Eastern Muhammadiyah College, aktivitasnya dalam Gerakan Khilafa dan Non-Kerjasama, kementerian komunikasi (1947–1952) dan kemudian pangan dan pertanian (1952–1954) dalam pemerintahan merdeka India, serta kematiannya di Delhi pada 24 Oktober 1954."
