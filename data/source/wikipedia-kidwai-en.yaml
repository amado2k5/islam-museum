  ar: "مقالة ويكيبيديا الإنجليزية عن رفيع أحمد قدوائي (1894–1954)؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في مسولي بمنطقة بارابانكي، ودراسته في الكلية المحمدية الأنجلو-شرقية، ونشاطه في حركة الخلافة وعدم التعاون، ووزارتيه للاتصالات (1947–1952) ثم للغذاء والزراعة (1952–1954) في حكومة الهند المستقلة، ووفاته في دلهي في 24 أكتوبر 1954."
  en: "English Wikipedia article on Rafi Ahmed Kidwai (1894–1954); used for entity facts only. It recounts his upbringing at Masauli in Barabanki district, his studies at the Muhammadan Anglo-Oriental College, his Khilafat and non-cooperation activism, his ministries of Communications (1947–1952) and then Food and Agriculture (1952–1954) in independent India's government, and his death at Delhi on 24 October 1954."
