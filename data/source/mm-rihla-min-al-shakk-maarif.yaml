label:
  ar: "مصطفى محمود، رحلتي من الشك إلى الإيمان ⁦(دار المعارف، القاهرة)⁩"
  en: "Mostafa Mahmoud, Rihlati min al-Shakk ila al-Iman (Dar al-Ma'arif, Cairo)"
  ur: "مصطفیٰ محمود، رحلتی من الشک الی الایمان ⁦(دار المعارف، قاہرہ)⁩"
summary:
  ar: "طبعة دار المعارف بمصر من كتاب مصطفى محمود عن رحلته الفكرية من الشك إلى الإيمان، في فصول: الله، والجسد، والروح، والعدل الأزلي، ولماذا العذاب، وماذا قالت لي الخلوة، والتوازن العظيم، والمسيخ الدجال، وفي آخرها قائمة بمؤلفاته."
  en: "Dar al-Ma'arif's edition of Mostafa Mahmoud's account of his intellectual journey from doubt to faith, in chapters on God, the body, the soul, eternal justice, why suffering, what solitude told me, the great balance and the false messiah, with a list of his works at the end."
  ur: "دار المعارف مصر کا مصطفیٰ محمود کی کتاب کا ایڈیشن، جو شک سے ایمان تک ان کے فکری سفر پر ہے، ابواب: اللہ، جسم، روح، عدلِ ازلی، عذاب کیوں، تنہائی نے مجھ سے کیا کہا، توازنِ عظیم اور مسیح دجال؛ آخر میں ان کی تصانیف کی فہرست۔"
  es: "Edición de Dar al-Ma'arif del relato de Mostafa Mahmoud sobre su viaje intelectual desde la duda hasta la fe, con capítulos sobre Dios, el cuerpo, el alma, la justicia eterna, el porqué del sufrimiento, lo que la soledad me enseñó, el gran equilibrio y el falso mesías, con una lista de sus obras al final."
  fr: "L'édition de Dar al-Ma'arif du récit de Mostafa Mahmoud sur son parcours intellectuel du doute à la foi, en chapitres sur Dieu, le corps, l'âme, la justice éternelle, pourquoi la souffrance, ce que la solitude m'a appris, le grand équilibre et le faux messie, avec une liste de ses œuvres à la fin."
  tr: "Mustafa Mahmoud'un şüpheden inanca entelektüel yolculuğunu anlatan kitabının Mısır baskısı Dar Al-Maaref, Tanrı, Beden, Ruh, Ebedi Adalet, Neden İşkence, Yalnızlık Bana Söyledik, Büyük Denge, Deccal ve sonunda eserlerinin listesi yer alır."
  id: "Edisi Dar Al-Maaref di Mesir dari buku Mustafa Mahmoud tentang perjalanan intelektualnya dari keraguan menuju iman, dalam bab-bab: Tuhan, Tubuh, Roh, Keadilan Abadi, Mengapa Siksaan, Apa yang Dikatakan Kesendirian kepada Saya, Keseimbangan Besar, Antikristus, dan di akhir daftar karyanya."
