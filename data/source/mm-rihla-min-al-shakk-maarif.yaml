label:
  ar: "مصطفى محمود، رحلتي من الشك إلى الإيمان ⁦(دار المعارف، القاهرة)⁩"
  en: "Mostafa Mahmoud, Rihlati min al-Shakk ila al-Iman (Dar al-Ma'arif, Cairo)"
  ur: "مصطفیٰ محمود، رحلتی من الشک الی الایمان ⁦(دار المعارف، قاہرہ)⁩"
summary:
  ar: "طبعة دار المعارف بمصر من كتاب مصطفى محمود عن رحلته الفكرية من الشك إلى الإيمان، في فصول: الله، والجسد، والروح، والعدل الأزلي، ولماذا العذاب، وماذا قالت لي الخلوة، والتوازن العظيم، والمسيخ الدجال، وفي آخرها قائمة بمؤلفاته."
  en: "Dar al-Ma'arif's edition of Mostafa Mahmoud's account of his intellectual journey from doubt to faith, in chapters on God, the body, the soul, eternal justice, why suffering, what solitude told me, the great balance and the false messiah, with a list of his works at the end."
  ur: "دار المعارف مصر کا مصطفیٰ محمود کی کتاب کا ایڈیشن، جو شک سے ایمان تک ان کے فکری سفر پر ہے، ابواب: اللہ، جسم، روح، عدلِ ازلی، عذاب کیوں، تنہائی نے مجھ سے کیا کہا، توازنِ عظیم اور مسیح دجال؛ آخر میں ان کی تصانیف کی فہرست۔"
