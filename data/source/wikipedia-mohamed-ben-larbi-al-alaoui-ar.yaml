reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision, resting on Ma'lamat al-Maghrib (18/6164), Muhammad Abid al-Jabri, and the Markaz al-Jounaid study of the Mudghariyya Darqawiyya. It dates his birth to 7 Dhu al-Hijja 1301 or 1302 AH (1884) at al-Qasr al-Jadid in Midghara, and his death to the evening of Thursday 23 Muharram 1384 AH at Fez. Its narrative of his youthful initiation into the Darqawiyya contains a passage whose Hijri years (1260–1275) are arithmetically impossible for a man born in 1884 and are treated in the record as a copying error, not as chronology; the Darqawi affiliation itself is separately sourced within the article to the Jounaid study. Its category filings place him among Moroccan Sunni scholars and jurists, and among Moroccan Sufis; no article text names a school of law for him."
