  ar: "مقالة ويكيبيديا العربية عن القاضي نذر الإسلام؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في 24 مايو 1899 ووفاته في 29 أغسطس 1976، ودراسته الأولى في الكُتّاب، وخدمته في الجيش، وقصيدته «التمرد»، ومرضه من سنة 1942 ودفنه بجوار مسجد جامعة دكا، ولا تسمّي له مذهبًا."
  en: "Arabic Wikipedia article on Kazi Nazrul Islam; used for entity facts only. It gives his birth on 24 May 1899 and death on 29 August 1976, his early study in a kuttab, his army service, his poem 'The Rebel', his illness from 1942 and his burial beside the Dhaka University mosque. It names no school for him."
