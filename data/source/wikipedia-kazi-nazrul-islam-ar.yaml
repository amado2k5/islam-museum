summary:
  ar: "مقالة ويكيبيديا العربية عن القاضي نذر الإسلام؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في 24 مايو 1899 ووفاته في 29 أغسطس 1976، ودراسته الأولى في الكُتّاب، وخدمته في الجيش، وقصيدته «التمرد»، ومرضه من سنة 1942 ودفنه بجوار مسجد جامعة دكا، ولا تسمّي له مذهبًا."
  en: "Arabic Wikipedia article on Kazi Nazrul Islam; used for entity facts only. It gives his birth on 24 May 1899 and death on 29 August 1976, his early study in a kuttab, his army service, his poem 'The Rebel', his illness from 1942 and his burial beside the Dhaka University mosque. It names no school for him."
  es: "Artículo de Wikipedia en árabe sobre Kazi Nazrul Islam; utilizado únicamente para datos biográficos. Indica su fecha de nacimiento (24 de mayo de 1899) y su fallecimiento (29 de agosto de 1976), sus estudios iniciales en un kuttab, su servicio militar, su poema «El Rebelde», su enfermedad desde 1942 y su entierro junto a la mezquita de la Universidad de Dhaka. No menciona ninguna escuela a la que pertenezca."
  fr: "Article Wikipédia en arabe sur Kazi Nazrul Islam; utilisé uniquement pour les informations biographiques. Il indique sa naissance le 24 mai 1899 et sa mort le 29 août 1976, ses premières études dans un kuttab, son service militaire, son poème « Le Rebelle », sa maladie à partir de 1942 et son inhumation près de la mosquée de l’université de Dhaka. Aucune école n’est mentionnée."
  ur: "قاضی نذر اسلام پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 24 مئی 1899 کو ان کی پیدائش اور 29 اگست 1976 کو موت، ایک کتب میں ان کی ابتدائی تعلیم، ان کی آرمی سروس، ان کی نظم 'دی ریبل'، 1942 سے ان کی بیماری اور ڈھاکہ یونیورسٹی کی مسجد کے پاس ان کی تدفین کا ذکر کرتی ہے۔ اس کے لیے کسی اسکول کا نام نہیں ہے۔"
