summary:
  ar: "مدخل «قُيُمجُلُق» ⁦(الصياغة)⁩ في موسوعة TDV الإسلامية لنبي بوزكورت: تاريخ الصياغة من مصر القديمة إلى العثمانيين، مصطلحاتها ⁦(صائغ، زرگر)⁩، تقنياتها، حضورها في النصوص الدينية والحديث، وأرقام قصر إستانبول وإحصاء أوليا جلبي للنقابة."
  en: "The TDV İslâm Ansiklopedisi entry on goldsmithing by Nebi Bozkurt: the craft's history from ancient Egypt to the Ottomans, its terminology (sâigh, zerger), techniques, its place in scripture and hadith, the Topkapı workshop registers and Evliya Çelebi's guild census and festival."
  es: "La entrada de Nebi Bozkurt en la enciclopedia TDV İslâm Ansiklopedisi sobre orfebrería: la historia del oficio desde el antiguo Egipto hasta los otomanos, su terminología (sâigh, zerger), técnicas, su lugar en las escrituras y los hadices, los registros de los talleres de Topkapı y el censo y festival del gremio de Evliya Çelebi."
  fr: "L'article de TDV İslâm Ansiklopedisi sur l'orfèvrerie par Nebi Bozkurt: l'histoire de cet artisanat depuis l'Égypte ancienne jusqu'aux Ottomans, sa terminologie (sâigh, zerger), ses techniques, sa place dans les écritures et les hadiths, les registres de l'atelier de Topkapı et le recensement et le festival de la guilde d'Evliya Çelebi."
  ur: "سنار سازی پر TDV İslâm Ansiklopedisi اندراج از نبی بوزکرٹ: قدیم مصر سے لے کر عثمانیوں تک دستکاری کی تاریخ، اس کی اصطلاحات ⁦(sâigh، zerger)⁩، تکنیک، صحیفے اور حدیث میں اس کا مقام، Topkapı ورکشاپ کے رجسٹر اور Evliya & Celebrates فیسٹیول۔"
  tr: "TDV Peygamber Bozkurt İslami Ansiklopedisi'nde \"Kımcelk\" (Taslak) maddesi: Antik Mısır'dan Osmanlılara Zanaat Tarihi, Terimleri (Kuyumcu, Kuyumculuk), Teknikleri, Dini ve Modern Metinlerdeki Varlığı, İstanbul Sarayı Numaraları ve Ulya Çelebi'nin Sendikanın İstatistikleri."
  id: "Entri tentang \"Qimjalq\" (Penyusunan Perasaan) dalam Ensiklopedia Islam TDV Nabi Bozkurt: Sejarah Kerajinan dari Mesir Kuno hingga Ottoman, Istilahnya (Tukang Emas, Pandai Emas), Tekniknya, Kehadirannya dalam Teks Keagamaan dan Modern, Nomor Istana Istanbul, dan Statistik Sindikat karya Ulya Çelebi."
