summary:
  ar: "تقرير مركز أمينة لموارد المرأة المسلمة في غلاسكو عن جلسة «الفصول الداخلية» التي قدمتها عفت رفيق ضمن فعاليات صحة الدورة الشهرية؛ يصفها مؤسسة تطبيق «الفانوس الأزرق» ومعلمة في صحة المرأة المسلمة ولا سيما الدورة الشهرية، ويعرض خلاصة تعليمها في فهم الدورة والعناية بالنفس عبر فصولها."
  en: "The Amina Muslim Women's Resource Centre (Glasgow) report on 'The Seasons Within', a menstrual-wellbeing session led by Ustadha Iffet Rafeeq. It describes her as the founder of the Blue Lantern App and an educator on Muslim women's health, in particular menstruation, and summarises her teaching on understanding the menstrual cycle and self-care across its seasons."
  es: "El Centro de Recursos para Mujeres Musulmanas Amina (Glasgow) publica un informe sobre \"Las Estaciones Interiores\", una sesión sobre bienestar menstrual impartida por la Ustadha Iffet Rafeeq. En él se la describe como la fundadora de la aplicación Blue Lantern y educadora en salud femenina musulmana, en particular sobre la menstruación, y se resume su enseñanza sobre la comprensión del ciclo menstrual y el autocuidado a lo largo de sus diferentes etapas."
  fr: "Le Centre de ressources pour femmes musulmanes Amina (Glasgow) présente « Les saisons intérieures », une session sur le bien-être menstruel animée par Ustadha Iffet Rafeeq. Elle y est décrite comme la fondatrice de l'application Blue Lantern et une formatrice en santé des femmes musulmanes, notamment en ce qui concerne les menstruations. Le rapport résume également son enseignement sur la compréhension du cycle menstruel et les soins personnels à adopter tout au long de ce cycle."
  ur: "امینہ مسلم ویمن ریسورس سینٹر ⁦(گلاسگو)⁩ کی رپورٹ 'دی سیزنز ودِن' پر، ایک ماہواری سے متعلق سیشن جس کی سربراہی استاد عفت رفیق کر رہے تھے۔ یہ اسے بلیو لینٹرن ایپ کی بانی اور مسلم خواتین کی صحت، خاص طور پر ماہواری کے بارے میں ایک معلم کے طور پر بیان کرتا ہے، اور ماہواری کو سمجھنے اور اس کے موسموں میں خود کی دیکھ بھال کے بارے میں اس کی تعلیم کا خلاصہ کرتا ہے۔"
