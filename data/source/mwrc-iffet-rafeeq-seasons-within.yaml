summary:
  ar: "تقرير مركز أمينة لموارد المرأة المسلمة في غلاسكو عن جلسة «الفصول الداخلية» التي قدمتها عفت رفيق ضمن فعاليات صحة الدورة الشهرية؛ يصفها مؤسسة تطبيق «الفانوس الأزرق» ومعلمة في صحة المرأة المسلمة ولا سيما الدورة الشهرية، ويعرض خلاصة تعليمها في فهم الدورة والعناية بالنفس عبر فصولها."
  en: "The Amina Muslim Women's Resource Centre (Glasgow) report on 'The Seasons Within', a menstrual-wellbeing session led by Ustadha Iffet Rafeeq. It describes her as the founder of the Blue Lantern App and an educator on Muslim women's health, in particular menstruation, and summarises her teaching on understanding the menstrual cycle and self-care across its seasons."
