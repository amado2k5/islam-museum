summary:
  ar: "مدخل مهر داد شكوهي في الموسوعة الإيرانية عن غياث الدين محمد الطهراني (غياث بك) الملقب باعتماد الدولة، وزير جهانغير الأعظم ووالد نور جهان: يؤرخ وفاته قرب كانغرا بسنة 1031هـ/1622م، ويروي مولده في طهران وهجرته إلى الهند وخدمته ديوانًا لكابل ثم وكيلًا للمملكة 1611–1621 ودفنه في أغرا على ضفة يمنا."
  en: "Mehrdad Shokoohy's Encyclopaedia Iranica entry on Ghiyath al-Din Muhammad Tehrani (Ghiyas Beg), titled I'timad-ud-Daulah, Jahangir's prime minister and father of Nur Jahan: it dates his death near Kangra to 1031/1622 and recounts his Tehran birth, the emigration to India, his service as diwan of Kabul and then Vakil of the empire 1611-1621, and his burial at Agra on the bank of the Yamuna."
  ur: "مہرداد شکوہی کا ایرانیکا مدخل غیاث الدین محمد طہرانی (غیاث بیگ) اعتماد الدولہ پر، جہانگیر کے وزیر اعظم اور نور جہاں کے والد: وفات کانگڑہ کے قریب 1031ھ/1622ء درج ہے؛ تہران میں پیدائش، ہندوستان ہجرت، کابل کی دیوانی، 1611ء–1621ء وکالت اور آگرہ میں تدفین کا بیان ہے۔"
