summary:
  ar: "مدخل مهر داد شكوهي في الموسوعة الإيرانية عن غياث الدين محمد الطهراني ⁦(غياث بك)⁩ الملقب باعتماد الدولة، وزير جهانغير الأعظم ووالد نور جهان: يؤرخ وفاته قرب كانغرا بسنة 1031هـ/1622م، ويروي مولده في طهران وهجرته إلى الهند وخدمته ديوانًا لكابل ثم وكيلًا للمملكة 1611–1621 ودفنه في أغرا على ضفة يمنا."
  en: "Mehrdad Shokoohy's Encyclopaedia Iranica entry on Ghiyath al-Din Muhammad Tehrani (Ghiyas Beg), titled I'timad-ud-Daulah, Jahangir's prime minister and father of Nur Jahan: it dates his death near Kangra to 1031/1622 and recounts his Tehran birth, the emigration to India, his service as diwan of Kabul and then Vakil of the empire 1611-1621, and his burial at Agra on the bank of the Yamuna."
  ur: "مہرداد شکوہی کا ایرانیکا مدخل غیاث الدین محمد طہرانی ⁦(غیاث بیگ)⁩ اعتماد الدولہ پر، جہانگیر کے وزیر اعظم اور نور جہاں کے والد: وفات کانگڑہ کے قریب 1031ھ/1622ء درج ہے؛ تہران میں پیدائش، ہندوستان ہجرت، کابل کی دیوانی، 1611ء–1621ء وکالت اور آگرہ میں تدفین کا بیان ہے۔"
  es: "La entrada de Mehrdad Shokoohy en la Encyclopaedia Iranica sobre Ghiyath al-Din Muhammad Tehrani (Ghiyas Beg), titulado I'timad-ud-Daulah, primer ministro de Jahangir y padre de Nur Jahan, fecha su muerte cerca de Kangra en 1031/1622 y relata su nacimiento en Teherán, la emigración a la India, su servicio como diwan de Kabul y luego como Vakil del imperio entre 1611 y 1621, y su entierro en Agra, a orillas del Yamuna."
  fr: "L'article de Mehrdad Shokoohy dans l'Encyclopaedia Iranica consacré à Ghiyath al-Din Muhammad Tehrani (Ghiyas Beg), intitulé I'timad-ud-Daulah, premier ministre de Jahangir et père de Nur Jahan: il date sa mort près de Kangra de 1031/1622 et relate sa naissance à Téhéran, son émigration en Inde, son service en tant que diwan de Kaboul puis Vakil de l'empire de 1611 à 1621, et son enterrement à Agra sur les rives de la Yamuna."
  tr: "Mehrdad Shokohi'nin İran Ansiklopedisi'ndeki girişi, Jahangir al-Azam'ın veziri ve Nur Jahan'ın babası olarak bilinen Etimad al-Dowla olarak bilinen Ghiyath al-Din Muhammed el-Tehrani (Ghiyath Beg) hakkında: Kangra yakınlarında ölümü 1031 Hicri / 1622 yılına tarihlenir ve Tahran'daki doğumunu, Hindistan'a göçünü, 1611-1621 yılları arasında Kabil valisi ve ardından krallığın vekili olarak hizmet vermesini ve sağ kıyıdaki Agra'da defnedilmesini anlatır."
  id: "Entri Mehrdad Shokohi dalam Ensiklopedia Iran tentang Ghiyath al-Din Muhammad al-Tehrani (Ghiyath Beg), yang dikenal sebagai Etimad al-Dowla, wazir Jahangir al-Azam dan ayah Nur Jahan: kematiannya di dekat Kangra berasal dari tahun 1031 H / 1622 M, dan menceritakan kelahirannya di Teheran, migrasinya ke India, pengabdiannya sebagai gubernur Kabul dan kemudian sebagai wakil kerajaan dari tahun 1611 hingga 1621, serta pemakamannya di Agra di tepi kanan."
