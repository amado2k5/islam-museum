summary:
  ar: "مقالة ويكيبيديا العربية عن خالدة ضياء؛ تُستخدم لوقائع الكيان فقط. تتفق مع الإنجليزية في زواجها من ضياء الرحمن ومناصبها ووفاتها في 30 ديسمبر 2025، لكن استهلالها يعطي مولدها في 15 أغسطس 1945 في ديناجبور — وهي القراءة المغايرة الموثّقة في ملاحظة تاريخ المولد بالسجل."
  en: "Arabic Wikipedia article on Khaleda Zia; used for entity facts only. It agrees with the English article on her marriage to Ziaur Rahman, her offices and her death on 30 December 2025, but its lead gives her birth as 15 August 1945 at Dinajpur — the variant reading documented in the record's birth-date note."
  es: "Artículo de Wikipedia en árabe sobre Khaleda Zia; utilizado únicamente para datos sobre la persona. Coincide con el artículo en inglés sobre su matrimonio con Ziaur Rahman, sus cargos y su fallecimiento el 30 de diciembre de 2025, pero su introducción indica que nació el 15 de agosto de 1945 en Dinajpur, la variante documentada en la nota sobre la fecha de nacimiento."
  fr: "Article de Wikipédia en arabe sur Khaleda Zia; utilisé uniquement pour les informations la concernant. Il concorde avec l’article en anglais sur son mariage avec Ziaur Rahman, ses fonctions et son décès le 30 décembre 2025, mais son introduction indique sa naissance le 15 août 1945 à Dinajpur — la variante mentionnée dans la note relative à la date de naissance de son acte de naissance."
  ur: "خالدہ ضیا پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ضیاء الرحمن کے ساتھ اس کی شادی، اس کے دفاتر اور 30 دسمبر 2025 کو اس کی موت سے متعلق انگریزی مضمون سے متفق ہے، لیکن اس کی برتری نے اس کی پیدائش 15 اگست 1945 کو دیناج پور میں کی ہے - ریکارڈ کی تاریخ پیدائش کے نوٹ میں دستاویزی شکل میں پڑھنے کا متن۔"
  tr: "Khalida Diya hakkında Arapça Vikipedi makalesi; sadece varlık gerçekleri için kullanılmıştır. Diya-your-Rahman ile evliliği, pozisyonları ve 30 Aralık 2025'teki ölümü konusunda İngilizlerle aynı fikirdedir, ancak baş harfleri 15 Ağustos 1945, Dinajpur'da yer alır—bu farklı okuma kayıttaki doğum tarihi notunda belgelenmiştir."
  id: "Artikel Wikipedia bahasa Arab tentang Khalida Diya; digunakan hanya untuk fakta entitas. Dia setuju dengan orang Inggris mengenai pernikahannya dengan Diya-your-Rahman, posisinya, dan kematiannya pada 30 Desember 2025, tetapi inisialnya adalah 15 Agustus 1945 di Dinajpur—pembacaan berbeda yang tercatat dalam catatan tanggal lahir dalam catatan."
