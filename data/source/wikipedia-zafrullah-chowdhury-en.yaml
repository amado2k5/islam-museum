summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ظفر الله شودري؛ تُستخدم لوقائع الكيان فقط. يعطي صندوق معلوماتها مولده في 27 ديسمبر 1941 بروزان ووفاته في 11 أبريل 2023 بدكا، ويروي نصها مشاركته في حرب الاستقلال 1971 والمستشفى الميداني، وتأسيسه غونوشاستايا كندرا سنة 1972، ودوره في السياسة الوطنية للأدوية سنة 1982، وجوائزه. لا يرد في المقال أي محتوى عن دينه."
  en: "English Wikipedia article on Zafrullah Chowdhury; used for entity facts only. Its infobox gives his birth as 27 December 1941 at Raozan and his death as 11 April 2023 at Dhaka; its text covers his 1971 Liberation War service and the field hospital, his founding of Gonoshasthaya Kendra in 1972, his role in the 1982 National Drug Policy, and his awards. The article contains no religion content."
  es: "Artículo de la Wikipedia en inglés sobre Zafrullah Chowdhury; utilizado únicamente para datos biográficos. Su ficha informativa indica que nació el 27 de diciembre de 1941 en Raozan y falleció el 11 de abril de 2023 en Dhaka. El texto abarca su servicio en la Guerra de Liberación de 1971 y el hospital de campaña, la fundación de Gonoshasthaya Kendra en 1972, su papel en la Política Nacional de Drogas de 1982 y sus condecoraciones. El artículo no contiene contenido religioso."
  fr: "Article de Wikipédia en anglais sur Zafrullah Chowdhury; utilisé uniquement pour les informations le concernant. Son infobox indique sa naissance le 27 décembre 1941 à Raozan et son décès le 11 avril 2023 à Dhaka; son texte aborde son engagement pendant la guerre de libération de 1971 et son rôle dans l’hôpital de campagne, la fondation du Gonoshasthaya Kendra en 1972, son implication dans la politique nationale de lutte contre la drogue de 1982 et les distinctions qu’il a reçues. L’article ne contient aucun élément religieux."
