  ar: "مقالة ويكيبيديا الإنجليزية عن ظفر الله شودري؛ تُستخدم لوقائع الكيان فقط. يعطي صندوق معلوماتها مولده في 27 ديسمبر 1941 بروزان ووفاته في 11 أبريل 2023 بدكا، ويروي نصها مشاركته في حرب الاستقلال 1971 والمستشفى الميداني، وتأسيسه غونوشاستايا كندرا سنة 1972، ودوره في السياسة الوطنية للأدوية سنة 1982، وجوائزه. لا يرد في المقال أي محتوى عن دينه."
  en: "English Wikipedia article on Zafrullah Chowdhury; used for entity facts only. Its infobox gives his birth as 27 December 1941 at Raozan and his death as 11 April 2023 at Dhaka; its text covers his 1971 Liberation War service and the field hospital, his founding of Gonoshasthaya Kendra in 1972, his role in the 1982 National Drug Policy, and his awards. The article contains no religion content."
