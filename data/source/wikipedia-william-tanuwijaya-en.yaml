  ar: "مقالة ويكيبيديا الإنجليزية عن ويليام تانوجايا (وُلد في 11 تشرين الثاني 1981 في بيماتانغسيانتار بشمال سومطرة)، رائد أعمال إندونيسي شارك في تأسيس شركة التجارة الإلكترونية توكوبيديا؛ تذكر عمله الليلي في مقهى إنترنت لتمويل دراسته في جامعة بينوس بعد مرض أبيه، وإطلاق توكوبيديا في 6 شباط 2009، ووسام ساتيالانكا ويرا كاريا سنة 2019."
  en: "English Wikipedia article on William Tanuwijaya (born 11 November 1981 in Pematangsiantar, North Sumatra), Indonesian entrepreneur and co-founder of the e-commerce company Tokopedia; it records his night work in an internet cafe to pay for his BINUS University studies after his father fell ill, Tokopedia's launch on 6 February 2009, and his 2019 Satyalancana Wira Karya medal."
