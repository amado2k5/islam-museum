summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ويليام تانوجايا ⁦(وُلد في 11 تشرين الثاني 1981 في بيماتانغسيانتار بشمال سومطرة)⁩، رائد أعمال إندونيسي شارك في تأسيس شركة التجارة الإلكترونية توكوبيديا؛ تذكر عمله الليلي في مقهى إنترنت لتمويل دراسته في جامعة بينوس بعد مرض أبيه، وإطلاق توكوبيديا في 6 شباط 2009، ووسام ساتيالانكا ويرا كاريا سنة 2019."
  en: "English Wikipedia article on William Tanuwijaya (born 11 November 1981 in Pematangsiantar, North Sumatra), Indonesian entrepreneur and co-founder of the e-commerce company Tokopedia; it records his night work in an internet cafe to pay for his BINUS University studies after his father fell ill, Tokopedia's launch on 6 February 2009, and his 2019 Satyalancana Wira Karya medal."
  es: "Artículo de la Wikipedia en inglés sobre William Tanuwijaya (nacido el 11 de noviembre de 1981 en Pematangsiantar, Sumatra del Norte), empresario indonesio y cofundador de la empresa de comercio electrónico Tokopedia; en él se relata su trabajo nocturno en un cibercafé para pagar sus estudios en la Universidad BINUS después de que su padre enfermara, el lanzamiento de Tokopedia el 6 de febrero de 2009 y su medalla Satyalancana Wira Karya de 2019."
  fr: "Article de Wikipédia en anglais sur William Tanuwijaya (né le 11 novembre 1981 à Pematangsiantar, Sumatra du Nord), entrepreneur indonésien et cofondateur de la société de commerce électronique Tokopedia; il relate son travail de nuit dans un cybercafé pour payer ses études à l'université BINUS après la maladie de son père, le lancement de Tokopedia le 6 février 2009 et sa médaille Satyalancana Wira Karya de 2019."
  ur: "انگریزی ویکیپیڈیا مضمون ولیم تنوویجایا پر ⁦(پیدائش 11 نومبر 1981 پیماٹانگسیانٹر، شمالی سماٹرا میں)⁩، انڈونیشین کاروباری اور ای کامرس کمپنی ٹوکوپیڈیا کے شریک بانی؛ اس میں ان کے والد کے بیمار ہونے کے بعد، BINUS یونیورسٹی کی پڑھائی کی ادائیگی کے لیے ایک انٹرنیٹ کیفے میں ان کے رات کے کام کو ریکارڈ کیا گیا، 6 فروری 2009 کو ٹوکوپیڈیا کا آغاز، اور اس کا 2019 کا ستیلانکانا ویرا کریا میڈل۔"
  tr: "William Tanujaya (11 Kasım 1981, Bimatangsiantar, Kuzey Sumatra doğumlu) hakkında İngilizce Wikipedia makalesi; Tokopedia adlı e-ticaret şirketinin kurucularından olan Endonezyalı girişimci; babasının hastalığından sonra Pinos Üniversitesi'nde eğitimini finanse etmek için gece internet kafede çalıştığı, 6 Şubat 2009'da Tokopedia'nın lansmanı ve 2019'daki Satyalanka Weera Karia Madalyası'nı hatırlıyor."
  id: "Artikel Wikipedia bahasa Inggris tentang William Tanujaya (lahir 11 November 1981, di Bimatangsiantar, Sumatera Utara), seorang pengusaha Indonesia yang ikut mendirikan perusahaan e-commerce Tokopedia; ia mengenang pekerjaan malamnya di warnet untuk membiayai studinya di Universitas Pinos setelah ayahnya sakit, peluncuran Tokopedia pada 6 Februari 2009, dan Medali Satyalanka Weera Karia pada 2019."
