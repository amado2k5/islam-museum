summary:
  ar: "نص كتاب التوحيد لابن خزيمة (ت 311هـ) في تحقيق عبد العزيز الشهوان عن خمس نسخ خطية والطبعة المنيرية، مع ترقيم الأحاديث وتراجم رجال الأسانيد وتخريج الأحاديث وحواشي المحقق، ثم الفهارس: الآيات والأحاديث والفرق والأعلام والمراجع والموضوعات."
  en: "The text of Ibn Khuzayma's (d. 311 AH) Kitab al-Tawhid as edited by 'Abd al-'Aziz al-Shahwan from five manuscripts and the Muniriyya printing, with numbered reports, notes on the transmitters of each chain, takhrij and the editor's notes, followed by indexes of verses, reports, sects, names, references and subjects."
