reliability_note: "Classical Sunni creed text (author d. 311 AH, public domain); the 1988 apparatus (notes, takhrij, transmitter notes, indexes) is copyrighted and only facts and short attributed quotations are taken. Copy used: harvest item aqeedah/kitab-tawhid-ibn-khuzayma/xboxgamer-4583-01 (1,013 PDF pages, OCR text). Title page PDF p. 5, imprint p. 6 (Dar al-Rushd, Riyadh, 1st ed. 1408/1988), the author's introduction from p. 7, text with numbered chapters and reports to about p. 909, indexes from p. 910 (verses p. 911, reports p. 927, sects p. 948), errata at the end. The scan holds the text in one continuous pagination. PRINTED PAGE = PDF PAGE (checked on pp. 83, 437, 477, 479, 508, 519, 520). The editor's study and manuscript description are in a separate item, recorded as source/kitab-al-tawhid-ibn-khuzayma-shahwan-1988-study. The editor's footnotes often disagree with the author (on the hadith of the form, on the Prophet's vision of his Lord); his judgements are reported as his."
