summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أبي أسامة الذهبي؛ تُستخدم لوقائع الكيان فقط. تروي إمامته في مسجد غرين لين في برمنغهام، واعتناقه الإسلام ودراسته في الجامعة الإسلامية بالمدينة المنورة، وقضية برنامج «المسجد المتخفي» على القناة الرابعة سنة 2007 وما تلاها من حكم أوفكوم واعتذار شرطة وست ميدلاندز وتعويضها."
  en: "English Wikipedia article on Abu Usamah at-Thahabi; used for entity facts only. It covers his imamate at Green Lane Masjid in Birmingham, his conversion to Islam and study at the Islamic University of Madinah, and the 2007 Channel 4 Dispatches 'Undercover Mosque' affair — the Ofcom ruling for Channel 4 and the West Midlands Police apology and payment that followed."
  es: "Artículo de la Wikipedia en inglés sobre Abu Usamah at-Thahabi; utilizado únicamente para datos sobre la persona. Abarca su imamato en la mezquita de Green Lane en Birmingham, su conversión al islam y sus estudios en la Universidad Islámica de Medina, y el caso de la \"Mezquita Encubierta\" del programa Dispatches de Channel 4 en 2007: la resolución de Ofcom a favor de Channel 4 y la posterior disculpa y compensación de la policía de West Midlands."
  fr: "Article de Wikipédia en anglais sur Abu Usamah at-Thahabi; utilisé uniquement à titre informatif. Il relate son imamat à la mosquée Green Lane de Birmingham, sa conversion à l’islam et ses études à l’université islamique de Médine, ainsi que l’affaire de l’émission « Undercover Mosque » de Channel 4 en 2007: la décision de l’Ofcom en faveur de Channel 4 et les excuses et le versement d’indemnités par la police des West Midlands qui ont suivi."
  ur: "ابو اسامہ الثہبی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں برمنگھم کی گرین لین مسجد میں ان کی امامت، اسلام میں ان کی تبدیلی اور مدینہ کی اسلامی یونیورسٹی میں تعلیم، اور 2007 کے چینل 4 ڈسپیچز 'انڈر کور مسجد' کے معاملے - چینل 4 کے لیے آف کام کا حکم اور ویسٹ مڈلینڈز پولیس کی معافی اور اس کے بعد ادائیگی کا احاطہ کرتا ہے۔"
