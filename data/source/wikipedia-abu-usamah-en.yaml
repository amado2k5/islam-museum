  ar: "مقالة ويكيبيديا الإنجليزية عن أبي أسامة الذهبي؛ تُستخدم لوقائع الكيان فقط. تروي إمامته في مسجد غرين لين في برمنغهام، واعتناقه الإسلام ودراسته في الجامعة الإسلامية بالمدينة المنورة، وقضية برنامج «المسجد المتخفي» على القناة الرابعة سنة 2007 وما تلاها من حكم أوفكوم واعتذار شرطة وست ميدلاندز وتعويضها."
  en: "English Wikipedia article on Abu Usamah at-Thahabi; used for entity facts only. It covers his imamate at Green Lane Masjid in Birmingham, his conversion to Islam and study at the Islamic University of Madinah, and the 2007 Channel 4 Dispatches 'Undercover Mosque' affair — the Ofcom ruling for Channel 4 and the West Midlands Police apology and payment that followed."
