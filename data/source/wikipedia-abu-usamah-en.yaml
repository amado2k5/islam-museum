reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 by its recorded revision (oldid=1372667156; revision equality asserted). It gives: imam at Green Lane Masjid in Birmingham, England; an American national; converted to Islam; studied at the Islamic University of Madinah, which the article calls 'Salafi-oriented'; the Dispatches programme Undercover Mosque, first aired 15 January 2007, filmed at Green Lane during his tenure; 364 viewer complaints to Ofcom, which ruled in favour of Channel 4; the West Midlands Police apology for their initial complaint and the £100,000 paid to Channel 4 in 2008; later cancelled university talks. The article publishes no birth date and no civil name; its categories include '1964 births' and 'Converts to Islam'. It names no legal school for him."
