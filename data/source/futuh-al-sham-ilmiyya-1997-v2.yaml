summary:
  ar: "الجزء الثاني من «فتوح الشام» المطبوع باسم الواقدي، ضبط عبد اللطيف عبد الرحمن، دار الكتب العلمية، بيروت 1417هـ/1997م: من غزوة مرج القبائل داخل الدروب وفتح قيسارية وسواحل الشام، إلى فتوح مصر والجزيرة وديار بكر وأرمينية والعراق، ثم الخبر الطويل في فتح البهنسا وفضائل جبانتها، وهو خاتمة الكتاب."
  en: "Vol. 2 of the Futuh al-Sham printed under al-Waqidi's name, ed. Abd al-Latif Abd al-Rahman, Dar al-Kutub al-Ilmiyya, Beirut 1417/1997: from the raid of Marj al-Qaba'il beyond the passes and the conquest of Caesarea and the Syrian coast, through the conquests of Egypt, the Jazira, Diyar Bakr, Armenia and Iraq, to the long account of the conquest of al-Bahnasa and the merits of its cemetery, which closes the book."
