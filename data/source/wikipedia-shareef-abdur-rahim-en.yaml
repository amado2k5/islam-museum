summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شريف عبد الرحيم: مولده في ماريتا سنة 1976، ومسيرته في فانكوفر وأتلانتا وبورتلاند وسكرامنتو، وذهبية أولمبياد سيدني 2000، ومناصبه الإدارية حتى رئاسة دوري «جي ليغ» سنة 2018؛ لا يذكر متنها دينه."
  en: "The English Wikipedia article on Shareef Abdur-Rahim: his birth in Marietta in 1976, his career with Vancouver, Atlanta, Portland and Sacramento, the Sydney 2000 Olympic gold medal, and his front-office posts up to the NBA G League presidency in 2018; its text does not state his religion."
  es: "El artículo de la Wikipedia en inglés sobre Shareef Abdur-Rahim: su nacimiento en Marietta en 1976, su carrera con Vancouver, Atlanta, Portland y Sacramento, la medalla de oro olímpica de Sídney 2000 y sus cargos directivos hasta la presidencia de la NBA G League en 2018; su texto no indica su religión."
  fr: "L'article de Wikipédia en anglais sur Shareef Abdur-Rahim: sa naissance à Marietta en 1976, sa carrière à Vancouver, Atlanta, Portland et Sacramento, sa médaille d'or aux Jeux olympiques de Sydney en 2000 et ses postes de direction jusqu'à la présidence de la NBA G League en 2018; son texte ne mentionne pas sa religion."
  ur: "شریف عبدالرحیم پر انگریزی ویکیپیڈیا کا مضمون: اس کی پیدائش 1976 میں ماریٹا میں، وینکوور، اٹلانٹا، پورٹ لینڈ اور سیکرامنٹو کے ساتھ ان کا کیریئر، سڈنی 2000 اولمپک گولڈ میڈل، اور 2018 میں NBA G لیگ کی صدارت تک ان کی فرنٹ آفس پوسٹیں؛ اس کے متن میں اس کا مذہب نہیں بتایا گیا ہے۔"
  tr: "Şerif Abdel Rahim hakkında İngilizce Wikipedia makalesi: 1976'da Marietta'da doğdu, Vancouver, Atlanta, Portland ve Sacramento'daki kariyeri, 2000 Sydney Olimpiyatları'ndaki altın madalya ve 2018'de G League başkanlığına kadar idari görevleri; dini bu makalede belirtilmemiştir."
  id: "Artikel Wikipedia bahasa Inggris tentang Sherif Abdel Rahim: Lahir di Marietta pada tahun 1976, kariernya di Vancouver, Atlanta, Portland, dan Sacramento, medali emas di Olimpiade Sydney 2000, serta posisi administratifnya hingga menjadi presiden G League pada 2018; agamanya tidak disebutkan di dalamnya."
