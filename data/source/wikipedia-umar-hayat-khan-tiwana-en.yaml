summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن اللواء الفخري سر عمر حياة خان تيوانا؛ تُستخدم لوقائع الكيان فقط. تروي أنه وُلد في 5 تشرين الأول 1874 في ميگها قرب جهاوڑیاں وتوفي في 24 آذار 1944 في ضيعة كلرا، وأنه من أكبر ملّاك البنجاب، خدم في حملات الصومال والتبت والحرب العالمية الأولى والحرب الأفغانية الثالثة، وجلس في مجالس الهند والبنجاب ودولة الهند، وأنه والد ملک خضر حياة تيوانا."
  en: "English Wikipedia article on Major General Sir Umar Hayat Khan Tiwana; used for entity facts only. It recounts that he was born on 5 October 1874 at Megha near Jhawarian and died on 24 March 1944 at the Kalra Estate, that he was one of the largest landholders in the Punjab, served in the Somaliland, Tibet, First World War and Third Anglo-Afghan War campaigns, sat on the Councils of India and State and the Punjab Legislative Council, and was the father of Malik Khizar Hayat Tiwana."
  es: "Artículo de la Wikipedia en inglés sobre el mayor general Sir Umar Hayat Khan Tiwana; utilizado únicamente para datos biográficos. Relata que nació el 5 de octubre de 1874 en Megha, cerca de Jhawarian, y falleció el 24 de marzo de 1944 en la finca Kalra; que fue uno de los mayores terratenientes del Punjab; que participó en las campañas de Somalilandia, el Tíbet, la Primera Guerra Mundial y la Tercera Guerra Anglo-Afgana; que formó parte de los Consejos de la India y del Estado y del Consejo Legislativo del Punjab; y que fue padre de Malik Khizar Hayat Tiwana."
  fr: "Article de Wikipédia en anglais sur le major-général Sir Umar Hayat Khan Tiwana; utilisé uniquement à des fins d’information sur l’entité. Il y est indiqué qu’il est né le 5 octobre 1874 à Megha, près de Jhawarian, et décédé le 24 mars 1944 au domaine de Kalra. On y apprend qu’il était l’un des plus grands propriétaires terriens du Pendjab, qu’il a servi au Somaliland, au Tibet, lors de la Première Guerre mondiale et de la troisième guerre anglo-afghane, qu’il a siégé aux conseils de l’Inde et de l’État ainsi qu’au Conseil législatif du Pendjab, et qu’il était le père de Malik Khizar Hayat Tiwana."
  ur: "میجر جنرل سر عمر حیات خان ٹوانہ پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں بتایا گیا ہے کہ وہ 5 اکتوبر 1874 کو جھاواڑیاں کے قریب میگھا میں پیدا ہوئے اور 24 مارچ 1944 کو کالرا اسٹیٹ میں ان کا انتقال ہوا، وہ پنجاب کے سب سے بڑے زمینداروں میں سے ایک تھے، وہ صومالی لینڈ، تبت، پہلی جنگ عظیم اور تیسری اینگلو افغان جنگ کی مہم میں خدمات انجام دیتے رہے، اور پنجاب کی ریاستی کونسل اور ملک کی ریاستی کونسل اور لیجی کونسل کے سربراہ رہے۔ خضر حیات ٹوانہ۔"
