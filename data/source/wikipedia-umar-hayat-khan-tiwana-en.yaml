summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن اللواء الفخري سر عمر حياة خان تيوانا؛ تُستخدم لوقائع الكيان فقط. تروي أنه وُلد في 5 تشرين الأول 1874 في ميگها قرب جهاوڑیاں وتوفي في 24 آذار 1944 في ضيعة كلرا، وأنه من أكبر ملّاك البنجاب، خدم في حملات الصومال والتبت والحرب العالمية الأولى والحرب الأفغانية الثالثة، وجلس في مجالس الهند والبنجاب ودولة الهند، وأنه والد ملک خضر حياة تيوانا."
  en: "English Wikipedia article on Major General Sir Umar Hayat Khan Tiwana; used for entity facts only. It recounts that he was born on 5 October 1874 at Megha near Jhawarian and died on 24 March 1944 at the Kalra Estate, that he was one of the largest landholders in the Punjab, served in the Somaliland, Tibet, First World War and Third Anglo-Afghan War campaigns, sat on the Councils of India and State and the Punjab Legislative Council, and was the father of Malik Khizar Hayat Tiwana."
