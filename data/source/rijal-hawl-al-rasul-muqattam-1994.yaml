label:
  ar: "رجال حول الرسول — خالد محمد خالد ⁦(دار المقطم للنشر والتوزيع، القاهرة، ط1 للدار 1415هـ/1994م)⁩"
  en: "Rijal Hawl al-Rasul — Khalid Muhammad Khalid (Dar al-Muqattam, Cairo, 1st ed. of this house 1415/1994)"
summary:
  ar: "الطبعة الموحدة المتكاملة من «رجال حول الرسول» لخالد محمد خالد في مجلد واحد، الطبعة الأولى لدار المقطم بالقاهرة ربيع الثاني 1415هـ/سبتمبر 1994م؛ وقد ظهرت الطبعة الأولى للكتاب بالقاهرة في ربيع الثاني 1384هـ/سبتمبر 1964م، ثم في خمسة أجزاء متفرقة."
  en: "The unified one-volume edition of Khalid Muhammad Khalid's Rijal Hawl al-Rasul, first edition of Dar al-Muqattam, Cairo, Rabi' II 1415 / September 1994; the book first appeared in Cairo in Rabi' II 1384 / September 1964, and earlier in five separate parts."
  es: "Edición unificada en un solo volumen de Rijal Hawl al-Rasul de Khalid Muhammad Khalid, primera edición de Dar al-Muqattam, El Cairo, Rabi' II 1415 / septiembre de 1994; el libro apareció por primera vez en El Cairo en Rabi' II 1384 / septiembre de 1964, y anteriormente en cinco partes separadas."
  fr: "L'édition unifiée en un seul volume du Rijal Hawl al-Rasul de Khalid Muhammad Khalid, première édition de Dar al-Muqattam, Le Caire, Rabi' II 1415 / septembre 1994; le livre est paru pour la première fois au Caire en Rabi' II 1384 / septembre 1964, et auparavant en cinq parties séparées."
  ur: "خالد محمد خالد کے رجال حول الرسول کا متفقہ ایک جلد ایڈیشن، دار المقطم کا پہلا ایڈیشن، قاہرہ، ربیع دوم 1415/ ستمبر 1994؛ یہ کتاب پہلی بار قاہرہ میں ربیع الثانی 1384/ستمبر 1964 میں شائع ہوئی اور اس سے پہلے پانچ الگ الگ حصوں میں شائع ہوئی۔"
