  ar: "مقالة ويكيبيديا الإنجليزية عن عمر عبد الرحمن؛ تُستخدم لوقائع الكيان فقط. تعطي اسمه الكامل وميلاده في 20 سبتمبر 1991 في الرياض، ومسيرته مع العين، وجائزته لاعب العام في آسيا سنة 2016، ومبارياته الـ74 مع الإمارات، ولقبه «عموري». ولا تذكر ديانته."
  en: "English Wikipedia article on Omar Abdulrahman; used for entity facts only. It gives his full name, his birth on 20 September 1991 in Riyadh, his Al Ain career, his 2016 Asian Footballer of the Year award, his 74 UAE caps, and his nickname Amoory. It makes no statement about his religion."
