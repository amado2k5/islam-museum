summary:
  ar: "مقالة ويكيبيديا الأردية عن محمد جمال عالم دوم؛ تُستخدم لوقائع الكيان فقط. تروي الحياة نفسها التي ترويها المقالة العربية: السلطان السادس والعشرون، ابن هاشم جليل عالم وابنه الأكبر، وُلد 1889 وحكم من 1906 إلى وفاته 1924 تحت وصاية حتى 1918، وشجّع الزراعة والطب والتعليم؛ وتصنّف تصانيفها وفاته بين وفيات الملاريا أيضًا. ولا تسمّي مذهبًا."
  en: "Urdu Wikipedia article on Muhammad Jamalul Alam II; used for entity facts only. It gives the same life as the Arabic article: the 26th sultan, son and eldest son of Hashim Jalilul Alam, born in 1889, who reigned from 1906 until his death in 1924 under a regency until 1918 and encouraged agriculture, medicine and education; its categories likewise file his death under malaria. It names no school."
