reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it, here chiefly Hamadou Boly's Strasbourg doctoral thesis on Sufism in Mali (2013) for the Qadiriyya initiation, and Bâ and Daget's L'empire peul du Macina and Sanankoua's Un empire peul au XIXe siècle in its bibliography. Read in full on 25 October 2026. The article calls him in its lead a Fulbe marabout and adherent of the Qadiriyya ('adepte de la Qadiriyya') and names Kabara Farma, not al-Kunti, as his initiator — a difference from the English article that the record states openly. Its infobox gives his birth as 1775 or 1776 and his death as 1844 or 1845."
