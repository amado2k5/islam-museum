summary:
  ar: "مقالة ويكيبيديا الفرنسية عن سيكو أحمدو ⁦(شيخو أحمدو)⁩، المرابط الفولاني المنتمي إلى القادرية ومؤسس إمبراطورية ماسينا الفولانية؛ تذكر ولادته سنة 1776 في مالانغال قرب موبتي ووفاته سنة 1844 أو 1845، وابتداءه في القادرية على يد الصوفي كابارا فارما، وجهاده وتأسيسه حمد الله، وخلف ابنه أحمدو سيكو ثم حفيده له."
  en: "French Wikipedia article on Sékou Amadou (Cheikhou Amadou), the Fulbe marabout and adherent of the Qadiriyya who founded the Fulbe empire of Macina; it gives his birth in 1776 at Malangal near Mopti and his death in 1844 or 1845, his initiation into the Qadiriyya by the Sufi Kabara Farma, his jihad and the founding of Hamdallaye, and the succession of his son Amadou Sékou and then his grandson."
  es: "Artículo de Wikipedia en francés sobre Sekou Amadou (Cheikhou Amadou), el morabito fulbe y partidario de Qadiriyya que fundó el imperio fulbe de Macina; da su nacimiento en 1776 en Malangal, cerca de Mopti, y su muerte en 1844 o 1845, su iniciación en la Qadiriyya por el sufí Kabara Farma, su yihad y la fundación de Hamdallaye, y la sucesión de su hijo Amadou Sékou y luego de su nieto."
  fr: "Article Wikipédia en français sur Sekou Amadou (Cheikhou Amadou), le marabout peulbé et adepte de la Qadiriyya qui a fondé l'empire peul du Macina; il donne sa naissance en 1776 à Malangal près de Mopti et sa mort en 1844 ou 1845, son initiation à la Qadiriyya par le soufi Kabara Farma, son jihad et la fondation de Hamdallaye, et la succession de son fils Amadou Sékou puis de son petit-fils."
  ur: "Sekou Amadou (Cheikhou Amadou) پر فرانسیسی ویکیپیڈیا کا مضمون، فلبے مارابوٹ اور قادریہ کا پیروکار جس نے میکینا کی فلبی سلطنت کی بنیاد رکھی۔ یہ 1776 میں موپتی کے قریب ملنگل میں ان کی پیدائش اور 1844 یا 1845 میں اس کی موت، صوفی کبارا فارما کے ذریعہ قادریہ میں اس کی شروعات، اس کا جہاد اور حمدللے کی بنیاد، اور اس کے بیٹے عمادو سیکو اور پھر اس کے پوتے کی جانشینی۔"
  tr: "Fulani Mürabit ve Fulani Masina İmparatorluğu'nun kurucusu olan Kadiriyya'ya mensup Fulani Murabit Seku Ahmadu (Şeyho Ahmadu) hakkında Fransızca Wikipedia makalesi; 1776'da Mopti yakınlarındaki Malangal'da doğduğu ve 1844 veya 1845'teki ölümünden bahsediliyor. Kadiriye'de Sufi Kabara Farma'nın yönetiminde başladı ve cihadı ile kuruluşu Hamdullah oldu. Yerine oğlu Ahmadu Seku ve ardından torunu geçti."
  id: "Artikel Wikipedia Prancis tentang Seku Ahmadu (Sheikho Ahmadu), Fulani Murabit yang termasuk dalam Qadiriyya dan pendiri Kekaisaran Fulani Masina; disebutkan kelahirannya pada tahun 1776 di Malangal dekat Mopti dan kematiannya pada tahun 1844 atau 1845. Ia memulai di Qadiriya di bawah Sufi Kabara Farma, dan jihad serta pendiriannya adalah Hamdullah. Ia digantikan oleh putranya Ahmadu Seku dan kemudian cucunya."
