summary:
  ar: "مقالة ويكيبيديا الفرنسية عن سيكو أحمدو (شيخو أحمدو)، المرابط الفولاني المنتمي إلى القادرية ومؤسس إمبراطورية ماسينا الفولانية؛ تذكر ولادته سنة 1776 في مالانغال قرب موبتي ووفاته سنة 1844 أو 1845، وابتداءه في القادرية على يد الصوفي كابارا فارما، وجهاده وتأسيسه حمد الله، وخلف ابنه أحمدو سيكو ثم حفيده له."
  en: "French Wikipedia article on Sékou Amadou (Cheikhou Amadou), the Fulbe marabout and adherent of the Qadiriyya who founded the Fulbe empire of Macina; it gives his birth in 1776 at Malangal near Mopti and his death in 1844 or 1845, his initiation into the Qadiriyya by the Sufi Kabara Farma, his jihad and the founding of Hamdallaye, and the succession of his son Amadou Sékou and then his grandson."
