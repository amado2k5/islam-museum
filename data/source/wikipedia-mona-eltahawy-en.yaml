summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن منى الطحاوي؛ تُستخدم لوقائع الكيان فقط. توثّق ولادتها في 1 أغسطس 1967 في بورسعيد، وعملها في رويترز والصحافة، وكتابيها، ووصفها لنفسها بأنها مسلمة نسوية راديكالية علمانية، ولا تسمّي لها مذهبًا."
  en: "English Wikipedia article on Mona Eltahawy; used for entity facts only. It records her birth on 1 August 1967 in Port Said, her Reuters and journalism career, her two books, and her self-description as a secular, radical feminist Muslim, and names no school for her."
  es: "Artículo de la Wikipedia en inglés sobre Mona Eltahawy; utilizado únicamente para obtener información sobre la persona. En él se registra su nacimiento el 1 de agosto de 1967 en Port Said, su trayectoria en Reuters y en el periodismo, sus dos libros y su autodescripción como musulmana laica, feminista radical, pero no se menciona ninguna escuela a la que haya asistido."
  fr: "Article de Wikipédia en anglais sur Mona Eltahawy; utilisé uniquement pour les informations la concernant. Il mentionne sa naissance le 1er août 1967 à Port-Saïd, sa carrière chez Reuters et dans le journalisme, ses deux livres et sa description d'elle-même comme musulmane laïque, féministe radicale, sans toutefois préciser son établissement scolaire."
  ur: "مونا التہاوی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں یکم اگست 1967 کو پورٹ سید میں اس کی پیدائش، اس کے رائٹرز اور صحافتی کیریئر، اس کی دو کتابیں، اور ایک سیکولر، بنیاد پرست فیمنسٹ مسلمان کے طور پر اس کی خود کی وضاحت، اور اس کے لیے کسی اسکول کا نام نہیں لیا گیا ہے۔"
  tr: "Mona El-Tahawy hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1 Ağustos 1967'de Port Said'de doğumunu, Reuters'taki çalışmalarını, basındaki, iki kitabını belgeleyen ve kendisini bir mezhep (seküler okul) olarak adlandırmadan radikal seküler bir Müslüman feminist olarak tanımlamaktadır."
  id: "Artikel Wikipedia bahasa Inggris tentang Mona El-Tahawy; digunakan hanya untuk fakta entitas. Artikel ini mendokumentasikan kelahirannya pada 1 Agustus 1967 di Port Said, karyanya di Reuters, penerbit, dua bukunya, dan menggambarkan dirinya sebagai feminis Muslim sekuler radikal tanpa menyebut sekte (sekolah sekuler)."
