label:
  ar: مكانة السنة في بيان الأحكام الإسلامية والرد على ما أثير من شبهات حول حجيتها وروايتها — علي الخفيف
  en: The Standing of the Sunna in Explaining the Legal Rulings — Ali al-Khafif
summary:
  ar: "كتاب الشيخ علي الخفيف، عضو مجمع البحوث الإسلامية ⁦(سابقًا)⁩، ضمن السلسلة العلمية للمجمع: يبيّن معنى السنة عند المحدثين والأصوليين، ومكانتها في بيان أحكام القرآن، ووجوب العمل بها، ثم يرد ما أُثير حول روايتها وحجيتها: كتابتها، والرواية بالمعنى، وخبر الآحاد؛ 86 صفحة، إشراف الأمين العام للمجمع."
  en: "Ali al-Khafif's book in the Scientific Series of the Islamic Research Academy of al-Azhar: the meaning of the Sunna for the muhaddithun and the usulis, its role in explaining the rulings of the Qur'an, the duty to act on it, and replies to objections about its writing down, its transmission by meaning and single reports; 86 pages, supervised by the Academy's Secretary-General."
  es: "El libro de Ali al-Khafif, perteneciente a la Serie Científica de la Academia de Investigación Islámica de al-Azhar, trata sobre el significado de la Sunna para los muhaddithun y los usulis, su papel en la explicación de las normas del Corán, el deber de actuar conforme a ella y las respuestas a las objeciones sobre su transcripción, su transmisión por significado y los relatos aislados; 86 páginas, supervisado por el Secretario General de la Academia."
  fr: "Le livre d'Ali al-Khafif dans la série scientifique de l'Académie de recherche islamique d'al-Azhar: la signification de la Sunna pour les muhaddithun et les usulis, son rôle dans l'explication des règles du Coran, le devoir d'agir en conséquence et les réponses aux objections concernant sa mise par écrit, sa transmission par le sens et les rapports isolés; 86 pages, supervisé par le secrétaire général de l'Académie."
