  ar: مكانة السنة في بيان الأحكام الإسلامية والرد على ما أثير من شبهات حول حجيتها وروايتها — علي الخفيف
  en: The Standing of the Sunna in Explaining the Legal Rulings — Ali al-Khafif
summary:
  ar: "كتاب الشيخ علي الخفيف، عضو مجمع البحوث الإسلامية (سابقًا)، ضمن السلسلة العلمية للمجمع: يبيّن معنى السنة عند المحدثين والأصوليين، ومكانتها في بيان أحكام القرآن، ووجوب العمل بها، ثم يرد ما أُثير حول روايتها وحجيتها: كتابتها، والرواية بالمعنى، وخبر الآحاد؛ 86 صفحة، إشراف الأمين العام للمجمع."
  en: "Ali al-Khafif's book in the Scientific Series of the Islamic Research Academy of al-Azhar: the meaning of the Sunna for the muhaddithun and the usulis, its role in explaining the rulings of the Qur'an, the duty to act on it, and replies to objections about its writing down, its transmission by meaning and single reports; 86 pages, supervised by the Academy's Secretary-General."
