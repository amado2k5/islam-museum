summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن هشام قباني ⁦(28 يناير 1945 – 4 ديسمبر 2024)⁩، تصفه في صدرها بأنه عالم مسلم سني صوفي لبناني أمريكي ينتمي إلى الطريقة النقشبندية الحقانية، وتسرد انتقاله إلى الولايات المتحدة سنة 1990 وفتاويه وجدله سنة 1999 وكتبه ووفاته في فنتون بميشيغان."
  en: "The English Wikipedia article on Hisham Kabbani (28 January 1945 – 4 December 2024), whose lead calls him a Lebanese-American Sunni Sufi Muslim scholar belonging to the Naqshbandi Haqqani Sufi order; it covers his 1990 move to the United States, his fatwas, the 1999 controversy, his books, and his death at Fenton, Michigan."
  es: "El artículo de Wikipedia en inglés sobre Hisham Kabbani (28 de enero de 1945 - 4 de diciembre de 2024), cuyo líder lo llama un erudito musulmán sufí sunita libanés-estadounidense perteneciente a la orden sufí Naqshbandi Haqqani; cubre su traslado a los Estados Unidos en 1990, sus fatwas, la controversia de 1999, sus libros y su muerte en Fenton, Michigan."
  fr: "L'article de Wikipédia en anglais sur Hisham Kabbani (28 janvier 1945 - 4 décembre 2024), dont le responsable le qualifie d'érudit musulman soufi sunnite libano-américain appartenant à l'ordre soufi Naqshbandi Haqqani; il couvre son déménagement aux États-Unis en 1990, ses fatwas, la controverse de 1999, ses livres et sa mort à Fenton, Michigan."
  ur: "ہشام کبانی ⁦(28 جنوری 1945 - 4 دسمبر 2024)⁩ پر انگریزی ویکیپیڈیا کا مضمون، جس کی قیادت نے انہیں نقشبندی حقانی صوفی حکم سے تعلق رکھنے والے لبنانی-امریکی سنی صوفی مسلم اسکالر کہا ہے۔ اس میں ان کے 1990 کے ریاستہائے متحدہ جانے، ان کے فتوے، 1999 کے تنازعات، ان کی کتابیں اور فینٹن، مشی گن میں ان کی موت کا احاطہ کیا گیا ہے۔"
  tr: "Hisham Qabbani hakkında İngilizce Wikipedia makalesi (28 Ocak 1945 – 4 Aralık 2024), onu başlangıçta Haqqani Nakşibendi tarikatına mensup Sünni Müslüman Sufi Lübnanlı-Amerikalı bir âlim olarak tanımlar; 1990'da Amerika Birleşik Devletleri'ne taşınmasını, 1999'daki fetvalarını ve tartışmalarını, kitaplarını ve Michigan, Fenton'daki ölümünü listeler."
  id: "Artikel Wikipedia bahasa Inggris tentang Hisham Qabbani (28 Januari 1945 – 4 Desember 2024) menggambarkannya pada awal sebagai seorang ulama Muslim Sunni Sufi Lebanon-Amerika yang berasal dari ordo Haqqani Naqshbandi, serta mencantumkan kepindahannya ke Amerika Serikat pada tahun 1990, fatwa dan debatnya pada tahun 1999, buku-bukunya, serta kematiannya di Fenton, Michigan."
