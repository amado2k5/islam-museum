  ar: "مقالة ويكيبيديا الإنجليزية عن هشام قباني (28 يناير 1945 – 4 ديسمبر 2024)، تصفه في صدرها بأنه عالم مسلم سني صوفي لبناني أمريكي ينتمي إلى الطريقة النقشبندية الحقانية، وتسرد انتقاله إلى الولايات المتحدة سنة 1990 وفتاويه وجدله سنة 1999 وكتبه ووفاته في فنتون بميشيغان."
  en: "The English Wikipedia article on Hisham Kabbani (28 January 1945 – 4 December 2024), whose lead calls him a Lebanese-American Sunni Sufi Muslim scholar belonging to the Naqshbandi Haqqani Sufi order; it covers his 1990 move to the United States, his fatwas, the 1999 controversy, his books, and his death at Fenton, Michigan."
