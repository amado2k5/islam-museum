summary:
  ar: "مقالة ويكيبيديا العربية عن حسن شيخ محمود؛ تُستخدم لوقائع الكيان فقط. تروي ولادته سنة 1955 ومسيرته الأكاديمية ورئاسته للصومال في فترتين. لا تذكر دينه شخصيا ولا مدرسته؛ وتصنيفها الوحيد المتصل بالدين هو «مسلمون صوماليون»."
  en: "Arabic Wikipedia article on Hassan Sheikh Mohamud; used for entity facts only. It recounts his birth in 1955, his academic career and his two presidencies of Somalia. It does not discuss his own religion or school; its only religion content is a category filing (Somali Muslims)."
  es: "Artículo de Wikipedia en árabe sobre Hassan Sheikh Mohamud; se utiliza únicamente para obtener información sobre la persona. Relata su nacimiento en 1955, su trayectoria académica y sus dos presidencias de Somalia. No aborda su religión ni su escuela; su único contenido religioso se limita a una categoría (musulmanes somalíes)."
  fr: "Article Wikipédia en arabe consacré à Hassan Sheikh Mohamud; utilisé uniquement à des fins d’information sur l’individu. Il relate sa naissance en 1955, son parcours universitaire et ses deux présidences de la Somalie. Il n’aborde ni sa religion ni son école; sa seule mention de la religion est une catégorie (Musulmans somaliens)."
  ur: "حسن شیخ محمد پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1955 میں ان کی پیدائش، ان کے تعلیمی کیریئر اور صومالیہ کی دو صدارتوں کا ذکر کرتا ہے۔ یہ اس کے اپنے مذہب یا مکتب پر بحث نہیں کرتا۔ اس کا واحد مذہبی مواد زمرہ بندی ⁦(صومالی مسلمان)⁩ ہے۔"
  tr: "Hassan Sheikh Mahmoud hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1955'teki doğumunu, akademik kariyerini ve iki dönemde Somali başkanlığını anlatır. Dini veya okulundan bahsetmez; dinle ilgili tek sınıflandırması \"Somali Müslümanları\"dır."
  id: "Artikel Wikipedia Arab tentang Hassan Sheikh Mahmoud; digunakan hanya untuk fakta entitas tersebut. Artikel ini menceritakan kelahirannya pada tahun 1955, karier akademisnya, dan masa kepresidenannya di Somalia selama dua periode. Artikel ini tidak menyebutkan agama atau sekolahnya; satu-satunya klasifikasi yang terkait dengan agama adalah \"Muslim Somalia.\""
