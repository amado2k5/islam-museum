summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبادي بانو بيغوم ⁦(بي أما)⁩؛ تُستخدم لوقائع الكيان فقط. تذكر ولادتها سنة 1850 ووفاتها في 13 تشرين الثاني 1924، وزواجها من عبد العلي خان وأبناءها ومنهم محمد علي جوهر وشوكت علي، ونشاطها في لجنة الخلافة وجمع التبرعات وخطابها سنة 1917، وتصفها بأنها من أوائل المسلمات مشاركة في السياسة."
  en: "English Wikipedia article on Abadi Bano Begum (Bi Amma); used for entity facts only. It gives her birth in 1850 and her death on 13 November 1924, her marriage to Abdul Ali Khan and her children including Muhammad Ali Jauhar and Shaukat Ali, her Khilafat committee work, fundraising and 1917 speech, and describes her as one of the first Muslim women to take an active part in politics."
  es: "Artículo de la Wikipedia en inglés sobre Abadi Bano Begum (Bi Amma); utilizado únicamente para datos biográficos. Indica su nacimiento en 1850 y su fallecimiento el 13 de noviembre de 1924, su matrimonio con Abdul Ali Khan y sus hijos, entre ellos Muhammad Ali Jauhar y Shaukat Ali, su labor en el comité del Califato, su recaudación de fondos y su discurso de 1917, y la describe como una de las primeras mujeres musulmanas en participar activamente en la política."
  fr: "L'article de Wikipédia en anglais sur Abadi Bano Begum (Bi Amma) est utilisé uniquement à titre informatif. Il indique sa naissance en 1850 et son décès le 13 novembre 1924, son mariage avec Abdul Ali Khan et ses enfants, notamment Muhammad Ali Jauhar et Shaukat Ali, son travail au sein du comité du Califat, ses collectes de fonds et son discours de 1917, et la décrit comme l'une des premières femmes musulmanes à s'engager activement en politique."
  ur: "انگریزی ویکیپیڈیا مضمون آبادی بانو بیگم ⁦(بی اماں)⁩ پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1850 میں اس کی پیدائش اور 13 نومبر 1924 کو اس کی موت، عبدالعلی خان سے اس کی شادی اور محمد علی جوہر اور شوکت علی سمیت اس کے بچے، اس کی خلافت کمیٹی کے کام، فنڈ ریزنگ اور 1917 کی تقریر، اور اسے سیاست میں فعال حصہ لینے والی پہلی مسلم خواتین میں سے ایک کے طور پر بیان کرتی ہے۔"
  tr: "Abadi Bano Begum (BMA) hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1850'deki doğumunu ve 13 Kasım 1924'teki ölümünü, Abdul Ali Khan ile evliliğini ve oğulları arasında Muhammad Ali Johar ve Shaukat Ali ile evliliğini, Hilafe Komitesi'ndeki faaliyetlerini, bağış toplama faaliyetlerini ve 1917'de siyasete katılan ilk Müslüman kadınlardan biri olarak tanımladığı konuşmasını anmaktadır."
  id: "Artikel Wikipedia bahasa Inggris tentang Abadi Bano Begum (BMA); digunakan hanya untuk fakta entitas. Ia menyebutkan kelahirannya pada tahun 1850 dan kematiannya pada 13 November 1924, pernikahannya dengan Abdul Ali Khan dan putra-putranya termasuk Muhammad Ali Johar dan Shaukat Ali, aktivitasnya di Komite Khilafa, penggalangan dana, serta pidatonya pada tahun 1917, yang menggambarkannya sebagai salah satu perempuan Muslim pertama yang berpartisipasi dalam politik."
