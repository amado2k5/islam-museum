reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. The article is internally inconsistent on her birth: its lead and infobox give 1850, its Early life section says 'Born in 1839 in Amroha' (the Urdu article's body says 1839 at Rampur instead), and Wikidata gives 1853; the death date in its lead, infobox and text is 13 November 1924, against 12 November in the Urdu article and Wikidata. Its statements about her rest chiefly on a 2003 cybercity profile and on Rajmohan Gandhi's studies. No school is named for her anywhere in it."
