  ar: "مقالة ويكيبيديا الإنجليزية عن عبادي بانو بيغوم (بي أما)؛ تُستخدم لوقائع الكيان فقط. تذكر ولادتها سنة 1850 ووفاتها في 13 تشرين الثاني 1924، وزواجها من عبد العلي خان وأبناءها ومنهم محمد علي جوهر وشوكت علي، ونشاطها في لجنة الخلافة وجمع التبرعات وخطابها سنة 1917، وتصفها بأنها من أوائل المسلمات مشاركة في السياسة."
  en: "English Wikipedia article on Abadi Bano Begum (Bi Amma); used for entity facts only. It gives her birth in 1850 and her death on 13 November 1924, her marriage to Abdul Ali Khan and her children including Muhammad Ali Jauhar and Shaukat Ali, her Khilafat committee work, fundraising and 1917 speech, and describes her as one of the first Muslim women to take an active part in politics."
