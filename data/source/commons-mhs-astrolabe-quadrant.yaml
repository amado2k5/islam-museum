  ar: "بيانات ملف ويكيميديا كومنز لصورة «Astrolabe Quadrant» رقم 54673 في مجموعة متحف تاريخ العلوم بجامعة أكسفورد: آلة نحاسية بحجر من المغرب مؤرخة 1804، منسوبة في البيانات إلى عبد الله أحمد بن علي الأندلسي؛ ترخيص CC BY-SA 4.0؛ استُخدمت صورة سياقية لعائلة أدوات الرصد والاتجاه لا كبديل عن الآلة الموصوفة."
