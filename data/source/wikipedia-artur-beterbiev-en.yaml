  fr: "Article Wikipédia en anglais sur Artur Beterbiev; utilisé uniquement pour les informations relatives à l’entité. Il relate ses titres amateurs, ses 20 premières victoires professionnelles toutes par KO, son accession au titre de champion incontesté des mi-lourds en 2024 et sa défaite lors du match revanche en 2025, et précise qu’il est musulman."
  ur: "Artur Beterbiev پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کے شوقیہ ٹائٹلز کا ذکر کیا گیا ہے، اس کے پہلے 20 پروفیشنل نے ناک آؤٹ کے ذریعے جیتے، 2024 میں اس کا غیر متنازعہ لائٹ ہیوی ویٹ چیمپئن بننا اور 2025 میں دوبارہ میچ ہارنا، اور کہا کہ وہ ایک مسلمان ہے۔"
