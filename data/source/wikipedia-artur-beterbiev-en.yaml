reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It gives Beterbiev as born on 21 January 1985 in Khasavyurt, Dagestan, of Chechen descent; amateur gold at the 2006 and 2010 European Championships, the 2008 World Cup and the 2009 World Championships; a professional from 2013 whose first 20 wins all came by knockout; IBF, WBC and WBA light-heavyweight champion who beat Dmitry Bivol by majority decision in October 2024 to become undisputed champion and lost the rematch, also by majority decision, in February 2025. Its personal-life section states: 'Beterbiev is a Muslim', records that he resides in Montreal and is a Canadian citizen, is married with four children, and that title defences were scheduled around his observance of Ramadan. It names no school for him."
