  ar: "مقالة ويكيبيديا الإنجليزية عن أرتور بيتربييف؛ تُستخدم لوقائع الكيان فقط. تروي ألقابه للهواة، وفوزه بنزالاته الاحترافية العشرين الأولى بالضربة القاضية، وتتويجه بطلا بلا منازع لخفيف الثقيل سنة 2024 وخسارته نزال الإعادة سنة 2025، وتذكر أنه مسلم."
  en: "English Wikipedia article on Artur Beterbiev; used for entity facts only. It recounts his amateur titles, his first 20 professional wins all by knockout, his becoming undisputed light-heavyweight champion in 2024 and losing the rematch in 2025, and states that he is a Muslim."
