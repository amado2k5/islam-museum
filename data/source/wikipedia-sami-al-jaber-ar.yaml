summary:
  ar: "مقالة ويكيبيديا العربية عن سامي الجابر؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 11 ديسمبر 1972 في الرياض ومسيرته مع الهلال والمنتخب وتدريبه، وتذكر تقديمه برنامج «ذات» الحواري على قناة السعودية في رمضان 2022 ورمضان 2023."
  en: "Arabic Wikipedia article on Sami Al-Jaber; used for entity facts only. It gives his birth on 11 December 1972 in Riyadh, his Al-Hilal and national-team career and his coaching, and notes that he presented the talk show That on the Saudi channel during Ramadan 2022 and Ramadan 2023."
  es: "Artículo de Wikipedia en árabe sobre Sami Al-Jaber; utilizado únicamente para datos sobre la persona. Indica su fecha de nacimiento, el 11 de diciembre de 1972 en Riad, su trayectoria en el Al-Hilal y en la selección nacional, su labor como entrenador, y señala que presentó el programa de entrevistas That en el canal saudí durante el Ramadán de 2022 y el Ramadán de 2023."
  fr: "Article Wikipédia en arabe sur Sami Al-Jaber; utilisé uniquement à des fins d’information sur l’entité. Il mentionne sa naissance le 11 décembre 1972 à Riyad, sa carrière à Al-Hilal et en équipe nationale, ainsi que son expérience d’entraîneur, et précise qu’il a animé l’émission de débat « That » sur la chaîne saoudienne pendant le Ramadan 2022 et le Ramadan 2023."
  ur: "سمیع الجابر پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 11 دسمبر 1972 کو ریاض میں ان کی پیدائش، اس کے الہلال اور قومی ٹیم کے کیریئر اور اس کی کوچنگ کے بارے میں بتاتا ہے، اور نوٹ کرتا ہے کہ اس نے رمضان 2022 اور رمضان 2023 کے دوران سعودی چینل پر ٹاک شو پیش کیا۔"
  tr: "Sami Al-Jaber hakkında Arapça Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılmıştır. 11 Aralık 1972'de Riyad'da doğduğu, Al-Hilal ve milli takımdaki kariyeri ve antrenörlüğü ve Ramazan 2022 sırasında Suudi Kanalı'nda \"That\" adlı talk show'u sunduğu yer alıyor."
  id: "Artikel Wikipedia berbahasa Arab tentang Sami Al-Jaber hanya digunakan untuk fakta entitas tersebut. Artikel tersebut menyebutkan kelahirannya pada 11 Desember 1972 di Riyadh, kariernya bersama Al-Hilal dan tim nasional, serta pelatihannya, dan menyebutkan bahwa dia menjadi pembawa acara talk show \"That\" di Saudi Channel selama Ramadan 2022 dan Ramadan 2023."
