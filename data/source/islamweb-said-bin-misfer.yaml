summary:
  ar: "صفحات فهرس المكتبة الصوتية في موقع إسلام ويب لدروس الشيخ سعيد بن مسفر ومحاضراته، ومنها سلاسل أسباب الهداية ومن أسباب عذاب القبر ووسائل الثبات على دين الله."
  en: "Index pages of the IslamWeb audio library for Sheikh Said bin Misfer's lessons and lectures, including the series Asbab al-Hidaya, Min Asbab 'Adhab al-Qabr and Wasa'il al-Thabat 'ala Din Allah."
  es: "Páginas de índice de la biblioteca de audio de IslamWeb para las lecciones y conferencias del jeque Said bin Misfer, incluidas las series Asbab al-Hidaya, Min Asbab 'Adhab al-Qabr y Wasa'il al-Thabat 'ala Din Allah."
  fr: "Pages d'index de la bibliothèque audio IslamWeb pour les leçons et conférences de Cheikh Said bin Misfer, y compris les séries Asbab al-Hidaya, Min Asbab 'Adhab al-Qabr et Wasa'il al-Thabat 'ala Din Allah."
  ur: "شیخ سعید بن مسفر کے اسباق اور لیکچرز کے لیے اسلام ویب آڈیو لائبریری کے انڈیکس صفحات، جن میں سلسلہ اصبغۃ الہدایہ، من اصبغۃ الذہب القبر اور وصائل الثبت العلٰی دین اللہ شامل ہیں۔"
  tr: "IslamWeb web sitesindeki sesli kütüphane katalog sayfaları, Şeyh Saeed bin Misfer'in dersleri ve dersleri, rehberliğin nedenleri, mezar işkencesinin nedenleri ve Tanrı'nın dini üzerine kararlılık yolları üzerine seriler içerir."
  id: "Halaman katalog perpustakaan audio di situs web Islam dari pelajaran dan kuliah Sheikh Saeed bin Misfer, termasuk seri tentang penyebab bimbingan, penyebab penderitaan kubur, dan cara-cara keteguhan dalam agama Allah."
