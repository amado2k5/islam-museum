reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision. It gives his birth as 1285 AH / 1848 CE in al-Hawd al-Sharqi, his formation under his father Muhammad Fadil and his brothers, his father's dispatch of him to spread the Fadiliyya, eleven of his works of fiqh and tasawwuf by title, and his death in 1335 AH / 1917. It also presents him as having taken part in jihad campaigns beside his brother Ma al-'Aynayn — a framing the English and French articles, resting on contemporary and scholarly sources (Marty; Robinson; Boubrik), contradict: they document his counsel against the jihad and his mediation with the French. The record carries both strands, attributed."
