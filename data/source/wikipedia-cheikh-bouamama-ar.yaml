summary:
  ar: "مقالة ويكيبيديا العربية عن بوعمامة. ينص متنها على انتمائه عقائديًا إلى الطريقة الطيبية ويسميه صندوق معلوماتها شيخ تلك الطريقة."
  en: "The Arabic Wikipedia article on Bouamama. Its text states that he belonged doctrinally to the Tayyibiyya order and its infobox names him shaykh of that order."
  es: "El artículo de Wikipedia en árabe sobre Bouamama. Su texto afirma que pertenecía doctrinalmente a la orden Tayyibiyya y su ficha informativa lo nombra jeque de dicha orden."
  fr: "L'article de Wikipédia en arabe sur Bouamama. Son texte indique qu'il appartenait doctrinalement à l'ordre Tayyibiyya et son infobox le désigne comme cheikh de cet ordre."
  ur: "بواماما پر عربی ویکیپیڈیا کا مضمون۔ اس کے متن میں کہا گیا ہے کہ وہ نظریاتی طور پر طیبیہ کے حکم سے تعلق رکھتے تھے اور اس کا انفو باکس انہیں اس حکم کے شیخ کا نام دیتا ہے۔"
  tr: "Bouamama hakkında Arapça Vikipedi makalesi. İçeriğinde Tayyibi tarikatıyla ideolojik bağlılığı belirtilir ve bilgi kutusunda kendisi o tarikatın Şeyhi olarak anılmaktadır."
  id: "Artikel Wikipedia bahasa Arab tentang Bouamama. Isinya menyatakan afiliasi ideologisnya dengan ordo Tayyibi, dan infobox menyebutnya Sheikh dari ordo tersebut."
