summary:
  ar: "مقالة ويكيبيديا العربية «البشير الإبراهيمي» عن محمد البشير بن محمد السعدي الإبراهيمي؛ تُستخدم لوقائع الكيان فقط. تعطي مولده يوم الخميس 14 شوال 1306هـ الموافق 13 يونيو 1889 بأولاد إبراهم ووفاته في 20 مايو 1965 وهو رهن الإقامة الجبرية، ومساره في المدينة ودمشق وسطيف ورئاسته جمعية العلماء بعد ابن باديس. لا تسمّي مذهبًا له."
  en: "Arabic Wikipedia article 'Al-Bachir El Ibrahimi' on Muhammad al-Bashir ibn Muhammad al-Sa'di al-Ibrahimi; used for entity facts only. It gives his birth on Thursday 14 Shawwal 1306 AH, corresponding to 13 June 1889, at Ouled Brahim, and his death on 20 May 1965 while under house arrest, with his career in Medina, Damascus and Setif and his presidency of the Association of Ulama after Ben Badis. It names no school for him."
