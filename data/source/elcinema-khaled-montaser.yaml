summary:
  ar: "صفحة خالد منتصر في قاعدة بيانات السينما.كوم؛ توثّق كتابته قصة وسيناريو وحوار مسلسل «صنايع صنايع» (2002) ومشاركته في إعداد المسلسل الإذاعي «الكلام المباح»."
  en: "Khaled Montaser's page in the elCinema database; it documents his story, screenplay and dialogue for the TV series Sanaye' Sanaye' (2002) and his co-preparation of the radio series Al-Kalam Al-Mubah."
  es: "La página de Khaled Montaser en la base de datos de elCinema documenta su historia, guion y diálogos para la serie de televisión Sanaye' Sanaye' (2002) y su participación en la producción de la serie de radio Al-Kalam Al-Mubah."
  fr: "La page de Khaled Montaser dans la base de données elCinema; elle documente son histoire, son scénario et ses dialogues pour la série télévisée Sanaye' Sanaye' (2002) et sa co-préparation de la série radiophonique Al-Kalam Al-Mubah."
  ur: "ال سینیما ڈیٹا بیس میں خالد مونتاسر کا صفحہ؛ اس میں ٹی وی سیریز سنائے سنائے (2002) کے لیے اس کی کہانی، اسکرین پلے اور مکالمے اور ریڈیو سیریز الکلام المبہ کی اس کی مشترکہ تیاری کو دستاویز کیا گیا ہے۔"
  tr: "Khaled Montaser'in Cinema.com veritabanındaki sayfası, \"Sana'i' Sana'i\" (2002) dizisinin hikaye, senaryo ve diyaloglarını yazmasını ve \"Al-Kalam Al-Mubah\" radyo dizisinin hazırlanmasındaki katılımını belgelemektedir."
  id: "Halaman Khaled Montaser di basis data Cinema.com mendokumentasikan penulisannya atas cerita, skenario, dan dialog serial \"Sana'i' Sana'i\" (2002), serta partisipasinya dalam persiapan serial radio \"Al-Kalam Al-Mubah\"."
