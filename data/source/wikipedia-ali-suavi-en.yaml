  ar: "مقالة ويكيبيديا الإنجليزية عن الصحفي والمصلح العثماني علي سعاوي (1839–1878)؛ تُستخدم لوقائع الكيان فقط. تصفه بأنه ناشط سياسي وصحفي ومربٍّ ولاهوتي ومصلح، وتروي نفيه إلى قسطموني وهربه إلى باريس مع نامق كمال وضيا باشا ومحاولته الانقلابية المعروفة بحادثة جراغان سنة 1878 التي قُتل فيها."
  en: "English Wikipedia article on the Ottoman journalist and reformer Ali Suavi (1839-1878); used for entity facts only. It describes him as a political activist, journalist, educator, theologian and reformer, and recounts his exile to Kastamonu, his flight to Paris with Namik Kemal and Ziya Pasha, and the failed 1878 Ciragan coup attempt in which he was killed."
