reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md). Read in full on 26 October 2026 and checked against the recorded revision; the article is short and flagged as needing more references. It gives his birth at Istanbul on 8 December 1839 and his death there on 20 May 1878, notes that he preached at the Sehzade Mosque, taught at Bursa, and contributed to the pan-Islamist newspaper Basiret, and lists his works, among them a translation of Ghazali and his 'Nesayih-i Ebu Hanife' (Counsels of Abu Hanifa). It names no madhhab or school for Suavi himself."
