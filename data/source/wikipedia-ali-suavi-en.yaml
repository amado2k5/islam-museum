summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الصحفي والمصلح العثماني علي سعاوي (1839–1878)؛ تُستخدم لوقائع الكيان فقط. تصفه بأنه ناشط سياسي وصحفي ومربٍّ ولاهوتي ومصلح، وتروي نفيه إلى قسطموني وهربه إلى باريس مع نامق كمال وضيا باشا ومحاولته الانقلابية المعروفة بحادثة جراغان سنة 1878 التي قُتل فيها."
  en: "English Wikipedia article on the Ottoman journalist and reformer Ali Suavi (1839-1878); used for entity facts only. It describes him as a political activist, journalist, educator, theologian and reformer, and recounts his exile to Kastamonu, his flight to Paris with Namik Kemal and Ziya Pasha, and the failed 1878 Ciragan coup attempt in which he was killed."
  es: "Artículo de la Wikipedia en inglés sobre el periodista y reformador otomano Ali Suavi (1839-1878); utilizado únicamente para datos sobre la persona. Lo describe como activista político, periodista, educador, teólogo y reformador, y relata su exilio a Kastamonu, su huida a París con Namik Kemal y Ziya Pasha, y el fallido intento de golpe de Estado de Ciragan en 1878, en el que fue asesinado."
  fr: "Article de Wikipédia en anglais sur le journaliste et réformateur ottoman Ali Suavi (1839-1878); utilisé uniquement à des fins d’information. Il le décrit comme un militant politique, journaliste, éducateur, théologien et réformateur, et relate son exil à Kastamonu, sa fuite à Paris avec Namik Kemal et Ziya Pacha, et la tentative de coup d’État manquée de 1878 à Çırağan, au cours de laquelle il trouva la mort."
  ur: "عثمانی صحافی اور مصلح علی سووی (1839-1878) پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اسے ایک سیاسی کارکن، صحافی، ماہر تعلیم، ماہر الہیات اور مصلح کے طور پر بیان کیا گیا ہے، اور کستامونو میں اس کی جلاوطنی، نامک کمال اور ضیا پاشا کے ساتھ پیرس کے لیے اس کی پرواز، اور 1878 کی سیراگن بغاوت کی ناکام کوشش کا ذکر ہے جس میں وہ مارا گیا تھا۔"
