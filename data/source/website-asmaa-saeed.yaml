reliability_note: "Her own website — a primary source for her name, her field and her own presentation of her work, not independent corroboration. The course page read on 26 October 2026 presents her as a mental-health consultant with 'more than ten years of experience', states '1.47 million subscribers on YouTube' and 'more than 1,400 free videos' as her own announced figures, lists her as accredited by 'New York International University', certified by the Egyptian foreign ministry, a member of the Arab board and a practitioner of TLT and NLP techniques, and offers her recorded four-hour course 'From Darkness to Light' at 400 dollars. These credentials and figures are her self-description and are recorded as such. It gives no birth date and names no school of law for her. Checked 26 October 2026."
