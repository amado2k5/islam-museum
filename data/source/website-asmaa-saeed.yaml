summary:
  ar: "الموقع الرسمي للدكتورة أسماء سعيد وأكاديميتها «نفس مطمئنة» (asmaasaied.net): يقدّمها استشاريةَ صحة نفسية تجمع منهجها بين الصحة النفسية وتعميق الصلة بالله، ويعرض دوراتها المسجلة ومنها «من الظلمات إلى النور»، ويذكر أرقام قناتها على يوتيوب كما تعلنها هي."
  en: "The official website of Dr Asmaa Saeed and her 'Nafs Mutma'inna' (Tranquil Soul) Academy (asmaasaied.net): it presents her as a mental-health consultant whose method combines mental health with deepening the connection with God, offers her recorded courses, among them 'From Darkness to Light', and states her YouTube channel's figures as she announces them."
  es: "El sitio web oficial de la Dra. Asmaa Saeed y su Academia 'Nafs Mutma'inna' (Alma Tranquila) (asmaasaied.net): la presenta como una consultora de salud mental cuyo método combina la salud mental con una conexión más profunda con Dios, ofrece sus cursos grabados, entre ellos 'De la oscuridad a la luz', y muestra las cifras de su canal de YouTube a medida que las anuncia."
  fr: "Le site officiel du Dr Asmaa Saeed et de son académie « Nafs Mutma'inna » (Âme Tranquille) (asmaasaied.net): il la présente comme une consultante en santé mentale dont la méthode combine santé mentale et approfondissement du lien avec Dieu, propose ses cours enregistrés, parmi lesquels « De l'obscurité à la lumière », et affiche les chiffres de sa chaîne YouTube au fur et à mesure qu'elle les annonce."
  ur: "ڈاکٹر اسماء سعید اور ان کی 'نفس مطمئنہ' (Tranquil Soul) اکیڈمی (asmaasaied.net) کی آفیشل ویب سائٹ: یہ انہیں ذہنی صحت کے مشیر کے طور پر پیش کرتی ہے جس کا طریقہ دماغی صحت کو خدا کے ساتھ تعلق کو گہرا کرنے کے ساتھ جوڑتا ہے، اس کے ریکارڈ شدہ کورسز پیش کرتا ہے، ان میں سے 'اندھیرے سے روشنی تک'، اور وہ اپنے یوٹیوب چینل کو بیان کرتی ہے۔"
  tr: "Dr. Asma Saeed ve akademisinin resmi web sitesi \"Sakin Bir Ruh\" (asmaasaied.net): Ruh sağlığı ile Tanrı ile bağı derinleştirmeyi birleştiren bir ruh sağlığı danışmanı tarafından sunulan bu site, \"Karanlıktan Işığa\" dahil olmak üzere kaydedilmiş kurslarını sunuyor ve YouTube kanal numaralarını duyururken belirtiyor."
  id: "Situs resmi Dr. Asma Saeed dan akademinya, \"A Calm Soul\" (asmaasaied.net): Dipresentasikan oleh konsultan kesehatan mental yang pendekatannya menggabungkan kesehatan mental dengan memperdalam hubungan dengan Tuhan, situs ini menyajikan kursus rekamannya, termasuk \"From Darkness to Light,\" dan menyebutkan nomor saluran YouTube-nya saat mengumumkannya."
