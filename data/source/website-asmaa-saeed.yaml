  ar: "الموقع الرسمي للدكتورة أسماء سعيد وأكاديميتها «نفس مطمئنة» (asmaasaied.net): يقدّمها استشاريةَ صحة نفسية تجمع منهجها بين الصحة النفسية وتعميق الصلة بالله، ويعرض دوراتها المسجلة ومنها «من الظلمات إلى النور»، ويذكر أرقام قناتها على يوتيوب كما تعلنها هي."
  en: "The official website of Dr Asmaa Saeed and her 'Nafs Mutma'inna' (Tranquil Soul) Academy (asmaasaied.net): it presents her as a mental-health consultant whose method combines mental health with deepening the connection with God, offers her recorded courses, among them 'From Darkness to Light', and states her YouTube channel's figures as she announces them."
