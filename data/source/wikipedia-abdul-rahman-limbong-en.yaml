summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حاجي عبد الرحمن ليمبونغ؛ تُستخدم لوقائع الكيان فقط. تجعله عالمًا ملايويًا وُلد سنة 1868 في تيليمونغ بترنغانو، ولُقّب بليمبونغ من تعليمه وتجارته في ليمبونغ بكيمامان، وقاد مقاومة قوانين الأراضي البريطانية منذ 1922، ومثّل 43 مزارعًا في المحكمة، وجمع نحو ألف مناصر سنة 1928 وهاجم مركز شرطة كوالا بيرانغ، ونُفي إلى مكة وتوفي فيها سنة 1929. ولا تسمّي له مذهبًا ولا طريقة صوفية."
  en: "English Wikipedia article on Haji Abdul Rahman Limbong; used for entity facts only. It gives him as a Malay ulama born in 1868 at Telemong, Terengganu, nicknamed Limbong from his teaching and trading at Limbong, Kemaman; a resistance leader against British land laws from 1922 who represented 43 farmers on trial, assembled about 1,000 followers in 1928, attacked the Kuala Berang police station, was exiled to Mecca and died there in 1929. It names no school and no Sufi order for him."
  es: "Artículo de la Wikipedia en inglés sobre Haji Abdul Rahman Limbong; utilizado únicamente para datos sobre la persona. Lo describe como un ulema malayo nacido en 1868 en Telemong, Terengganu, apodado Limbong por su labor docente y comercial en Limbong, Kemaman; líder de la resistencia contra las leyes británicas de tierras desde 1922, quien representó a 43 agricultores en un juicio, reunió a unos 1000 seguidores en 1928, atacó la comisaría de policía de Kuala Berang, fue exiliado a La Meca y murió allí en 1929. No menciona ninguna escuela ni orden sufí a la que perteneciera."
  fr: "L'article de Wikipédia en anglais sur Haji Abdul Rahman Limbong, utilisé uniquement pour les informations le concernant, le présente comme un ouléma malais né en 1868 à Telemong, Terengganu, surnommé Limbong en raison de son activité d'enseignement et de commerce à Limbong, Kemaman. Chef de la résistance contre les lois foncières britanniques à partir de 1922, il défendit 43 agriculteurs lors de leur procès, rassembla environ 1 000 partisans en 1928, attaqua le poste de police de Kuala Berang, fut exilé à La Mecque où il mourut en 1929. L'article ne mentionne ni école ni ordre soufi auquel il aurait appartenu."
  ur: "حاجی عبدالرحمن لمبونگ پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اسے 1868 میں Telemong، Terengganu میں پیدا ہونے والے ایک ملائی علما کے طور پر دیتا ہے، جسے Limbong، Kemaman میں اس کی تعلیم اور تجارت سے لمبونگ کا عرفی نام دیا گیا تھا۔ 1922 سے برطانوی زمینی قوانین کے خلاف مزاحمتی رہنما جس نے مقدمے میں 43 کسانوں کی نمائندگی کی، 1928 میں تقریباً 1,000 پیروکاروں کو جمع کیا، کوالا بیرنگ پولیس سٹیشن پر حملہ کیا، مکہ جلاوطن کر دیا گیا اور 1929 میں وہیں انتقال کر گئے۔ اس کے لیے نہ کوئی اسکول ہے اور نہ ہی کوئی صوفی حکم ہے۔"
  tr: "Hacı Abdul Rahman Limbong hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Bu onu 1868'de Tleemung, Terengganu'da doğmuş bir Malay bilgini yapar; Kimaman, Limbong'daki eğitim ve mesleği nedeniyle Limbong lakabını almıştır. 1922'den beri İngiliz toprak yasalarına karşı direnişe liderlik etti, mahkemede 43 çiftçiyi temsil etti, 1928'de yaklaşık bin destekçi topladı, Kuala Perang polis karakoluna saldırdı, Mekke'ye sürgün edildi ve 1929'da orada öldü. Hiçbir tarikat veya Sufi tarikatı onun adına adlandırılmamıştır."
  id: "Artikel Wikipedia bahasa Inggris tentang Haji Abdul Rahman Limbong; digunakan hanya untuk fakta entitas. Ini menjadikannya seorang ulama Melayu yang lahir pada tahun 1868 di Tleemung, Terengganu, dijuluki Limbong karena pendidikan dan perdagangannya di Limbong, Kimaman. Ia memimpin perlawanan terhadap undang-undang tanah Inggris sejak 1922, mewakili 43 petani di pengadilan, mengumpulkan sekitar seribu pendukung pada tahun 1928, menyerang kantor polisi Kuala Perang, diasingkan ke Mekah, dan meninggal di sana pada tahun 1929. Tidak ada sekte atau ordo Sufi yang dinamai menurut namanya."
