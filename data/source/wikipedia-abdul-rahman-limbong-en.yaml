summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حاجي عبد الرحمن ليمبونغ؛ تُستخدم لوقائع الكيان فقط. تجعله عالمًا ملايويًا وُلد سنة 1868 في تيليمونغ بترنغانو، ولُقّب بليمبونغ من تعليمه وتجارته في ليمبونغ بكيمامان، وقاد مقاومة قوانين الأراضي البريطانية منذ 1922، ومثّل 43 مزارعًا في المحكمة، وجمع نحو ألف مناصر سنة 1928 وهاجم مركز شرطة كوالا بيرانغ، ونُفي إلى مكة وتوفي فيها سنة 1929. ولا تسمّي له مذهبًا ولا طريقة صوفية."
  en: "English Wikipedia article on Haji Abdul Rahman Limbong; used for entity facts only. It gives him as a Malay ulama born in 1868 at Telemong, Terengganu, nicknamed Limbong from his teaching and trading at Limbong, Kemaman; a resistance leader against British land laws from 1922 who represented 43 farmers on trial, assembled about 1,000 followers in 1928, attacked the Kuala Berang police station, was exiled to Mecca and died there in 1929. It names no school and no Sufi order for him."
