reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026, and its content checked against the recorded revision. It gives Aliaune Damala Bouga Time Puru Nacka Lu Lu Lu Badara Akon Thiam, born 16 April 1973 at St. Louis, Missouri, to dancer Kine Gueye Thiam and the Senegalese percussionist Mor Thiam, and the family's move to New Jersey when he was seven; the debut album Trouble (2004) and the labels Konvict Muzik (2004) and KonLive Distribution (2007) and their signings; his production and songwriting for others; the Guinness master-ringtone record; the Akon Lighting Africa initiative (2014) and the Akon City project in Senegal, agreed in 2020, stalled, and officially abandoned in July 2025; and the finding that his claimed three-year prison term was fictionalised, his only conviction being a 1998 gun charge with probation. For his faith, the early-life section says he was born to a Muslim family (citing Biography.com), and the personal-life section says 'Akon is a Muslim', citing a 2009 New York magazine piece; no school is named anywhere."
