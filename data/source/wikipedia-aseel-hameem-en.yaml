summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أصيل هميم؛ تُستخدم لوقائع الكيان فقط. تذكر مولدها في الأعظمية ببغداد في 6 أكتوبر 1984، وأن والدها الموسيقار كريم هميم، ومشاركتها في برنامج «نجوم العرب» على إم بي سي 1، وأغنيتها المنفردة الأولى «بلاني زماني»، وقائمة أغانيها وشارات المسلسلات التي غنّتها، وأن أغنية «سر الحياة» (2019) هي الأكثر استماعًا لفنانة عربية على يوتيوب."
  en: "English Wikipedia article on Aseel Hameem; used for entity facts only. It gives her birth in Adhamiyah, Baghdad, on 6 October 1984, her father the musician Karim Hameem, her appearance on the Arab Stars programme on MBC 1, her first solo song 'Balani Zemani', her discography and television theme songs, and her 2019 song 'Ser Alhayah' as the most streamed song on YouTube by a female Arab artist."
  es: "Artículo de la Wikipedia en inglés sobre Aseel Hameem; utilizado únicamente para datos biográficos. En él se menciona su nacimiento en Adhamiyah, Bagdad, el 6 de octubre de 1984, su padre, el músico Karim Hameem, su aparición en el programa Arab Stars de MBC 1, su primera canción en solitario, 'Balani Zemani', su discografía y las canciones que ha compuesto para programas de televisión, y que su canción de 2019, 'Ser Alhayah', fue la más reproducida en YouTube por una artista árabe."
  fr: "Article Wikipédia en anglais sur Aseel Hameem; utilisé uniquement pour des informations sur l'artiste. On y apprend sa naissance à Adhamiyah, Bagdad, le 6 octobre 1984, le nom de son père, le musicien Karim Hameem, son passage dans l'émission Arab Stars sur MBC 1, la sortie de son premier titre solo, « Balani Zemani », sa discographie et ses génériques télévisés, ainsi que le fait que sa chanson « Ser Alhayah » (2019) soit la chanson d'une artiste arabe féminine la plus écoutée sur YouTube."
  ur: "اصیل حمیم پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس نے 6 اکتوبر 1984 کو بغداد کے ادھمیہ میں جنم لیا، اس کے والد موسیقار کریم حمیم، ایم بی سی 1 پر عرب اسٹارز کے پروگرام میں اس کی پیشی، اس کا پہلا سولو گانا 'بالانی زمانی'، اس کی ڈسکوگرافی اور ٹیلی ویژن کے تھیم گانے، اور اس کا 2019 کا گانا 'سر الہایہ' یوٹیوب پر سب سے زیادہ اسٹریم کیے جانے والے گانے والی خاتون آرٹسٹ کے طور پر۔"
