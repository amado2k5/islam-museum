reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026. This writer's text-fetch route does not expose revision ids, so — on the consultation-date pattern used for Salah Bukhatir (Batch 67) and Hasim Rahman — no revision id is recorded and none has been invented. The article states that Aseel Karim Hameem was born on 6 October 1984 in Adhamiyah, Baghdad, that she is an Iraqi singer active since 2007, that her father Karim Hameem is a musician, that she competed in the Arab Stars (نجوم العرب) programme on MBC 1 with the Arab Mashreq team and released her first solo song 'Balani Zemani' shortly afterwards, and that as of August 2020 her song 'Ser Alhayah' was the most streamed song on YouTube by a female Arab artist, with more than 255 million views (citing Arabsounds). It makes no statement of her religion anywhere in its text or infobox."
