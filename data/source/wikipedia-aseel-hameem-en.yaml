summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أصيل هميم؛ تُستخدم لوقائع الكيان فقط. تذكر مولدها في الأعظمية ببغداد في 6 أكتوبر 1984، وأن والدها الموسيقار كريم هميم، ومشاركتها في برنامج «نجوم العرب» على إم بي سي 1، وأغنيتها المنفردة الأولى «بلاني زماني»، وقائمة أغانيها وشارات المسلسلات التي غنّتها، وأن أغنية «سر الحياة» (2019) هي الأكثر استماعًا لفنانة عربية على يوتيوب."
  en: "English Wikipedia article on Aseel Hameem; used for entity facts only. It gives her birth in Adhamiyah, Baghdad, on 6 October 1984, her father the musician Karim Hameem, her appearance on the Arab Stars programme on MBC 1, her first solo song 'Balani Zemani', her discography and television theme songs, and her 2019 song 'Ser Alhayah' as the most streamed song on YouTube by a female Arab artist."
