summary:
  ar: "مقال موسوعي عن حمزة عبد الله ⁦(مواليد 1983)⁩، لاعب السلامة في دوري NFL الذي نشأ مسلماً متديناً وتخلّف مع أخيه حسين عن موسم 2012 لأداء الحج."
  en: "Community-edited encyclopedia article, retrieved in full at the stated revision; it gives his birth on 20 August 1983, his drafting by Tampa Bay in 2005, his seasons with Denver, Cleveland and Arizona, that he was raised a devout Muslim, and that he and his brother Husain took the 2012 season off to make the pilgrimage to Mecca."
  es: "Artículo de enciclopedia editado por la comunidad, recuperado íntegramente en la revisión indicada; en él se menciona su nacimiento el 20 de agosto de 1983, su selección por Tampa Bay en 2005, sus temporadas con Denver, Cleveland y Arizona, que fue criado como un musulmán devoto y que él y su hermano Husain se tomaron la temporada 2012 libre para realizar la peregrinación a La Meca."
  fr: "Article encyclopédique édité par la communauté, récupéré intégralement à la version indiquée; il indique sa naissance le 20 août 1983, son repêchage par Tampa Bay en 2005, ses saisons avec Denver, Cleveland et Arizona, qu’il a été élevé dans la foi musulmane et que lui et son frère Husain ont pris une pause lors de la saison 2012 pour effectuer le pèlerinage à La Mecque."
  ur: "کمیونٹی میں ترمیم شدہ انسائیکلوپیڈیا مضمون، بیان کردہ نظرثانی پر مکمل طور پر بازیافت کیا گیا؛ یہ 20 اگست 1983 کو اس کی پیدائش، 2005 میں ٹمپا بے کے ذریعہ اس کی ڈرافٹنگ، ڈینور، کلیولینڈ اور ایریزونا کے ساتھ اس کے سیزن، کہ اس کی پرورش ایک دیندار مسلمان ہوئی تھی، اور یہ کہ اس نے اور اس کے بھائی حسین نے 2012 کے سیزن کو مکہ کی زیارت کرنے کے لیے رخصت کیا۔"
  tr: "Hamza Abdullah (1983 doğumlu) hakkında ansiklopedik bir makale; o, dindar bir Müslüman olarak büyümüş ve kardeşi Hüseyin ile birlikte 2012 Hac sezonunu kaçırmıştır."
  id: "Sebuah artikel ensiklopedis tentang Hamza Abdullah (lahir 1983), pemain safety NFL yang tumbuh sebagai Muslim taat dan melewatkan musim Haji 2012 bersama saudaranya Hussein."
