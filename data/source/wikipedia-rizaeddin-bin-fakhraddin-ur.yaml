  id: "Artikel Wikipedia Urdu tentang Ridauddin Fakhruddin; biografi rinci tentang kelahirannya pada 13 Januari 1859 di Kiguchet dan kematiannya di Ufa pada 12 April 1936, menceritakan studinya di Gestopol dan Kazan, pertemuannya dengan Marjani dan orang Afghani, serta masa peradilan dan mufti sejak 1923."
