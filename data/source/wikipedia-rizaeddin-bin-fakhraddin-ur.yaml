reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. The fullest of the three articles on his early life: it places his schooling at Chistopol and Nizhniye Chershily, his 1886 Kazan journey and meeting with Shihab al-Din al-Marjani, his 1888 meeting with Jamal al-Din al-Afghani in St Petersburg, his qadi elections from 1891, the move to Orenburg and Shura (1908–1918), and his formal election as mufti on 10 July 1923 after Barudi's death on 6 December 1921. One sentence misprints his death as a birth ('born at Ufa on 12 April 1936'); the date itself agrees with the Arabic article. It names no school for him."
