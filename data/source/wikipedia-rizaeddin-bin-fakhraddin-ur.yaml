summary:
  ar: "مقالة ويكيبيديا الأردية عن رضاء الدين فخر الدين؛ سيرة مفصلة تعطي ميلاده في 13 يناير 1859 في كيچوچٹ ووفاته في أوفا في 12 أبريل 1936، وتروي دراسته في جستوپول وقازان، ولقاءه مرجاني والأفغاني، وقضاءه ومفتيته من 1923."
  en: "Urdu Wikipedia article on Rizaeddin bin Fakhreddin; a detailed biography giving his birth on 13 January 1859 at Kichuchat and his death at Ufa on 12 April 1936, and recounting his studies at Chistopol and Kazan, his meetings with Marjani and al-Afghani, his qadi service and his muftiate from 1923."
  es: "Artículo en urdu de la Wikipedia sobre Rizaeddin bin Fakhreddin; una biografía detallada que indica su nacimiento el 13 de enero de 1859 en Kichuchat y su muerte en Ufa el 12 de abril de 1936, y que relata sus estudios en Chistopol y Kazán, sus encuentros con Marjani y al-Afghani, su servicio como cadí y su muftiato desde 1923."
  fr: "Article de Wikipédia en ourdou sur Rizaeddin bin Fakhreddin; une biographie détaillée indiquant sa naissance le 13 janvier 1859 à Kichuchat et sa mort à Oufa le 12 avril 1936, et relatant ses études à Tchistopol et Kazan, ses rencontres avec Marjani et al-Afghani, son service de cadi et son muftiat à partir de 1923."
