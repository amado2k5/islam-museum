  ar: "مقالة ويكيبيديا الإنجليزية عن ماشود أبيولا؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته في الأعمال والنشر، وفوزه المرجّح في انتخابات 12 يونيو 1993 التي ألغاها إبراهيم بابانغيدا، وإعلانه نفسه رئيسًا، واعتقاله ووفاته في الاحتجاز في 7 يوليو 1998، ومنحه بعد وفاته وسام القائد الأعظم سنة 2018."
  en: "English Wikipedia article on Moshood Abiola; used for entity facts only. It recounts his business and publishing career, his presumed victory in the 12 June 1993 election annulled by Ibrahim Babangida, his self-declaration as president, his detention and death in custody on 7 July 1998, and his posthumous GCFR award in 2018."
