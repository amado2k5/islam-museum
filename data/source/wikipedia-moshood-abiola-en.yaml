reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It gives Abiola as born on 24 August 1937 in Abeokuta and died on 7 July 1998 in Abuja. In its election narrative the text calls him personally 'a Southern Muslim'; it records his membership of the Ansar-Ud-Deen society, his support through the National Concord for Islamic causes (a Sharia Court of Appeal in the south-west, Nigeria's entry into the Organisation of Islamic Cooperation), the clerical title Baba Adinni of Yorubaland conferred on him in 1984, and the Qur'an training centre he built in Abeokuta. Its categories file him under 'Nigerian Muslims'. No school or madhhab is named anywhere."
