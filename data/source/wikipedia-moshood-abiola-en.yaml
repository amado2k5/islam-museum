summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ماشود أبيولا؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته في الأعمال والنشر، وفوزه المرجّح في انتخابات 12 يونيو 1993 التي ألغاها إبراهيم بابانغيدا، وإعلانه نفسه رئيسًا، واعتقاله ووفاته في الاحتجاز في 7 يوليو 1998، ومنحه بعد وفاته وسام القائد الأعظم سنة 2018."
  en: "English Wikipedia article on Moshood Abiola; used for entity facts only. It recounts his business and publishing career, his presumed victory in the 12 June 1993 election annulled by Ibrahim Babangida, his self-declaration as president, his detention and death in custody on 7 July 1998, and his posthumous GCFR award in 2018."
  es: "Artículo de la Wikipedia en inglés sobre Moshood Abiola; utilizado únicamente para datos sobre la persona. Relata su trayectoria empresarial y editorial, su presunta victoria en las elecciones del 12 de junio de 1993, anuladas por Ibrahim Babangida, su autoproclamación como presidente, su detención y muerte bajo custodia el 7 de julio de 1998, y su condecoración póstuma GCFR en 2018."
  fr: "Article de Wikipédia en anglais sur Moshood Abiola; utilisé uniquement à des fins d’information sur l’entité. Il relate sa carrière dans les affaires et l’édition, sa victoire présumée à l’élection du 12 juin 1993 annulée par Ibrahim Babangida, son autoproclamation président, sa détention et sa mort en détention le 7 juillet 1998, ainsi que sa distinction posthume de Grand-père royal de France en 2018."
  ur: "موسود ابیولا پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کے کاروبار اور اشاعتی کیرئیر، ابراہیم بابانگیڈا کے ذریعہ 12 جون 1993 کے انتخابات میں ان کی متوقع فتح، صدر کے طور پر ان کا خود ساختہ اعلان، 7 جولائی 1998 کو حراست میں ان کی حراست اور موت، اور 2018 میں ان کے بعد از مرگ GCFR ایوارڈ کا ذکر ہے۔"
