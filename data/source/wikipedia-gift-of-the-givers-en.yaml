summary:
  ar: مقالة ويكيبيديا الإنجليزية عن منظمة «غيفت أوف ذا غيفرز»؛ تُستخدم لوقائع الكيان فقط، ومنها قسم «المؤسس» عن امتياز سليمان. تعطي اسمه الكامل امتياز إسماعيل سليمان، وميلاده في 7 مارس 1962 في بوتشيفستروم، وبكالوريوس الطب من جامعة ناتال، وممارسته الطب في بيترماريتزبرغ حتى 1986، وتأسيس المنظمة في 6 أغسطس 1992 بأمر من معلّمه الروحي الشيخ الصوفي الجراحي محمد صافر دال أفندي في إسطنبول، وترشّحه سنة 1994 عن حزب مسلمي أفريقيا، وأوسمته. وتقول عنه في جملة بقسم المؤسس إنه «من أهل الإيمان الإسلامي» بصيغة عامة.
  en: English Wikipedia article on Gift of the Givers; used for entity facts only, including its 'Founder' section on Imtiaz Sooliman. It gives his full name, Imtiaz Ismail Sooliman, his birth on 7 March 1962 in Potchefstroom, his MBChB at the University of Natal, his medical practice in Pietermaritzburg until 1986, the founding of the organisation on 6 August 1992 on the instruction of his spiritual teacher, the Jerrahi Sufi sheikh Muhammed Safer Dal Effendi in Istanbul, his 1994 Africa Muslim Party candidacy, and his honours. Of Sooliman himself it says, in a sentence in the founder section, 'He is from Islam belief'.
