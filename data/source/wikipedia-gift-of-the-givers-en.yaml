summary:
  ar: مقالة ويكيبيديا الإنجليزية عن منظمة «غيفت أوف ذا غيفرز»؛ تُستخدم لوقائع الكيان فقط، ومنها قسم «المؤسس» عن امتياز سليمان. تعطي اسمه الكامل امتياز إسماعيل سليمان، وميلاده في 7 مارس 1962 في بوتشيفستروم، وبكالوريوس الطب من جامعة ناتال، وممارسته الطب في بيترماريتزبرغ حتى 1986، وتأسيس المنظمة في 6 أغسطس 1992 بأمر من معلّمه الروحي الشيخ الصوفي الجراحي محمد صافر دال أفندي في إسطنبول، وترشّحه سنة 1994 عن حزب مسلمي أفريقيا، وأوسمته. وتقول عنه في جملة بقسم المؤسس إنه «من أهل الإيمان الإسلامي» بصيغة عامة.
  en: English Wikipedia article on Gift of the Givers; used for entity facts only, including its 'Founder' section on Imtiaz Sooliman. It gives his full name, Imtiaz Ismail Sooliman, his birth on 7 March 1962 in Potchefstroom, his MBChB at the University of Natal, his medical practice in Pietermaritzburg until 1986, the founding of the organisation on 6 August 1992 on the instruction of his spiritual teacher, the Jerrahi Sufi sheikh Muhammed Safer Dal Effendi in Istanbul, his 1994 Africa Muslim Party candidacy, and his honours. Of Sooliman himself it says, in a sentence in the founder section, 'He is from Islam belief'.
  es: "Artículo de la Wikipedia en inglés sobre Gift of the Givers; utilizado únicamente para datos sobre la entidad, incluyendo su sección «Fundador» sobre Imtiaz Sooliman. En él se indica su nombre completo, Imtiaz Ismail Sooliman, su nacimiento el 7 de marzo de 1962 en Potchefstroom, su licenciatura en Medicina y Cirugía (MBChB) por la Universidad de Natal, su práctica médica en Pietermaritzburg hasta 1986, la fundación de la organización el 6 de agosto de 1992 por instrucción de su maestro espiritual, el jeque sufí Jerrahi Muhammed Safer Dal Effendi en Estambul, su candidatura al Partido Musulmán Africano en 1994 y sus condecoraciones. Sobre el propio Sooliman, en una frase de la sección del fundador, se afirma: «Es de fe islámica»."
  fr: "L'article de Wikipédia en anglais sur Gift of the Givers est utilisé uniquement pour les informations relatives à l'organisation, notamment la section « Fondateur » consacrée à Imtiaz Sooliman. On y trouve son nom complet, Imtiaz Ismail Sooliman, sa date de naissance le 7 mars 1962 à Potchefstroom, son diplôme de médecine (MBChB) à l'Université du Natal, son exercice de la médecine à Pietermaritzburg jusqu'en 1986, la fondation de l'organisation le 6 août 1992 sur les instructions de son maître spirituel, le cheikh soufi jerrahi Muhammed Safer Dal Effendi à Istanbul, sa candidature pour le Parti musulman africain en 1994 et les distinctions qu'il a reçues. À propos de Sooliman lui-même, on peut lire, dans la section consacrée au fondateur: « Il est de confession musulmane. »"
  ur: "تحفہ دینے والوں پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے، بشمول امتیاز سلیمان پر اس کے 'بانی' سیکشن۔ اس میں ان کا پورا نام، امتیاز اسماعیل سلیمان، ان کی پیدائش 7 مارچ 1962 کو پوٹچفسٹروم میں، ان کا ایم بی سی ایچ بی نٹال یونیورسٹی میں، 1986 تک پیٹرمیرٹزبرگ میں ان کی طبی مشق، 6 اگست 1992 کو اپنے روحانی استاد، جیراحی دال محمد صفی میں اپنے روحانی استاد کی ہدایت پر تنظیم کی بنیاد رکھی گئی۔ 1994 افریقہ مسلم پارٹی کی امیدواری، اور ان کے اعزازات۔ خود سلیمان کے بارے میں، بانی حصے کے ایک جملے میں کہتا ہے، 'وہ اسلام کے عقیدے سے ہے'۔"
  tr: "Kuruluşun İngilizce Wikipedia makalesi \"Gift of the Givers\" yalnızca varlığın gerçekleri için, Süleyman franchise'ı ile ilgili \"Kurucu\" bölümü dahil olmak üzere kullanılmıştır. Tam adı, 7 Mart 1962'de Potchefstroom'da doğan ve Natal Üniversitesi'nden tıp lisansı olan ve 1986'ya kadar Pietermaritzburg'da tıp pratiği yapan İsmail Süleyman'ın ayrıcalığını vermektedir. Örgüt, 6 Ağustos 1992'de İstanbul'da manevi akıl hocası Sufi cerrah Şeyh Muhammad Safer Dal Efendi'nin emriyle kurulmuş ve 1994'te Afrika Müslüman Partisi'ne aday gösterilerek madalyalarını takdim etmiştir. Kurucu bölümünde genel olarak \"İslami inançlı bir adam\" olduğu belirtilmektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang organisasi \"Gift of the Givers\" hanya digunakan untuk fakta entitas, termasuk bagian \"Pendiri\" tentang waralaba Suleiman. Nama lengkapnya memberikan hak istimewa kepada Ismail Suleiman, lahir pada 7 Maret 1962 di Potchefstroom, meraih gelar Sarjana Kedokteran dari Universitas Natal, dan praktik medisnya di Pietermaritzburg hingga tahun 1986. Organisasi ini didirikan pada 6 Agustus 1992 atas perintah mentor spiritualnya, ahli bedah Sufi Sheikh Muhammad Safer Dal Efendi di Istanbul, dan ia dinominasikan pada tahun 1994 untuk Partai Muslim Afrika serta menerima medali. Dalam sebuah kalimat di bagian pendiri, tertulis bahwa ia adalah \"seorang pria beriman Islam\" dalam bentuk umum."
