summary:
  ar: "مقالة ويكيبيديا الأردية عن بطرس بطرس غالي؛ مقالة قصيرة جدًا تُستخدم لوقائع الكيان فقط. تكتفي بتعريفه سياسيًا ودبلوماسيًا مصريًا وأمينًا عامًا سادسًا للأمم المتحدة، وتصنّفه في زمر قبطية تصنيفًا لا شهادة فيه."
  en: "Urdu Wikipedia article on Boutros Boutros-Ghali; a very short stub used for entity facts only. It confines itself to identifying him as an Egyptian politician and diplomat and the sixth UN Secretary-General, and files him under Coptic categories — filings, not attestations."
  es: "Artículo en urdu de Wikipedia sobre Boutros Boutros-Ghali; un breve esbozo que solo incluye datos sobre la persona. Se limita a identificarlo como político y diplomático egipcio y sexto Secretario General de la ONU, y lo clasifica dentro de las categorías coptas (registros, no declaraciones)."
  fr: "Article Wikipédia en ourdou sur Boutros Boutros-Ghali; une ébauche très brève servant uniquement à fournir des informations factuelles. Elle se limite à le présenter comme homme politique et diplomate égyptien, sixième secrétaire général de l’ONU, et le classe dans les catégories coptes – des classements, et non des attestations."
  ur: "Boutros Boutros-Ghali پر اردو ویکیپیڈیا مضمون؛ ایک بہت ہی مختصر اسٹب جو صرف ہستی کے حقائق کے لیے استعمال ہوتا ہے۔ یہ خود کو ایک مصری سیاست دان اور سفارت کار اور اقوام متحدہ کے چھٹے سیکرٹری جنرل کے طور پر شناخت کرنے تک محدود رکھتا ہے، اور اسے قبطی زمروں کے تحت فائل کرتا ہے — فائلنگ، تصدیق نہیں۔"
  tr: "Boutros Boutros Ghali hakkında Urduca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılan çok kısa bir makale. Onu sadece siyasi ve diplomatik olarak Mısırlı, Birleşmiş Milletler'in altıncı Genel Sekreteri olarak tanımlar ve herhangi bir koşulsuzca Kıpti gruplarına sınıflandırır."
  id: "Artikel Wikipedia Urdu tentang Boutros Boutros Ghali; artikel yang sangat singkat hanya digunakan untuk fakta entitas. Artikel itu hanya mendefinisikan dia secara politik dan diplomatik sebagai orang Mesir, Sekretaris Jenderal keenam Perserikatan Bangsa-Bangsa, dan mengklasifikasikannya dalam kelompok Koptik tanpa syarat apapun."
