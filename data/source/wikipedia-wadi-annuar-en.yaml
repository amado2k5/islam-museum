summary:
  ar: "مقالة ويكيبيديا الإنجليزية القصيرة عن وادي أنوار؛ تؤكد تاريخ الميلاد ومكانه والتعليم الدمشقي وتأسيس أكاديمية دار العلمي وإدارة شركة دعوة غلوبال؛ وفي صندوقها مذهب «سنّي» وعقيدة «أشعري» بوصفهما بيانات منظمة لم تُستخدم."
  en: "Short English Wikipedia article on Wadi Annuar, confirming the birth date and place, the Damascus education, the founding of Akademi Darul Ilmi and the Dakwah Global chief-executive role; its infobox denomination (Sunni) and creed (Ash'ari) entries are structured data and were not used."
  es: "Breve artículo en inglés de la Wikipedia sobre Wadi Annuar, que confirma la fecha y el lugar de nacimiento, la educación en Damasco, la fundación de Akademi Darul Ilmi y el papel de director ejecutivo de Dakwah Global; las entradas de su ficha informativa sobre denominación (suní) y credo (ash'ari) son datos estructurados y no se utilizaron."
  fr: "Court article de Wikipédia en anglais sur Wadi Annuar, confirmant la date et le lieu de naissance, l'éducation à Damas, la fondation de l'Akademi Darul Ilmi et le rôle de directeur général de Dakwah Global; ses entrées d'infobox sur la dénomination (sunnite) et la croyance (ash'ari) sont des données structurées et n'ont pas été utilisées."
  ur: "وادی سالانہ پر مختصر انگریزی ویکیپیڈیا مضمون، تاریخ پیدائش اور مقام کی تصدیق کرتا ہے، دمشق کی تعلیم، اکادمی دارالعلمی کا قیام اور ڈاکو گلوبل کے چیف ایگزیکٹو کردار؛ اس کے انفو باکس فرقہ ⁦(سنی)⁩ اور عقیدہ ⁦(اشعری)⁩ کے اندراجات ساختی ڈیٹا ہیں اور استعمال نہیں کیے گئے۔"
  tr: "Wadi Anwar hakkında kısa İngilizce Wikipedia makalesi, doğum tarihini ve yerini, Şam eğitimini, Dar Al-İlmi Akademisi'nin kuruluşunu ve Dawah Global'in yönetimini doğrular; kutusunda Sünni okul ve Ash'ari mezhebi, kullanılmayan organize veriler olarak kabul edilir."
  id: "Artikel singkat Wikipedia bahasa Inggris tentang Wadi Anwar mengonfirmasi tanggal dan tempat lahir, pendidikan Damaskus, pendirian Akademi Dar Al-Ilmi, dan pengelolaan Dawah Global; dalam kotaknya, aliran Sunni dan ajaran Ash'ari dianggap sebagai data terorganisir yang tidak digunakan."
