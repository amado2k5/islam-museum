summary:
  ar: "مدخل إبراهيم إسماعيل جندريكار في بنغلابيديا، الموسوعة الوطنية لبنغلاديش؛ يُستخدم لوقائع الكيان فقط. يعطي مولده في 15 أبريل 1898 في أحمد آباد ووفاته سنة 1968، ورئاسته للوزراء بعد استقالة سهروردي في أكتوبر 1957، ويختلف جذريًا مع تواريخ ويكيبيديا الإنجليزية، ولا يذكر له مذهبًا."
  en: "Entry 'Chundrigar, Ibrahim Ismail' in Banglapedia, the national encyclopedia of Bangladesh; used for entity facts only. It gives his birth on 15 April 1898 at Ahmedabad and his death in 1968, and his prime ministership following Suhrawardy's resignation in October 1957 — a tradition wholly at odds with the English Wikipedia dates — and names no school for him."
