reliability_note: "A scholarly national encyclopedia entry, independent of Wikipedia. Read on 27 October 2026. Its dates conflict wholesale with the English article and Wikidata (1898 Ahmedabad–1968 against 1897 Godhra–1960 London); the person record follows the English article's cited dating, with this variant disclosed in full. Its biographical thread agrees on the man — Ahmedabad lawyer, Bombay Legislative Assembly 1937, trade minister 1947, provincial governor, interim prime minister after Suhrawardy — so identity is pinned despite the date conflict."
