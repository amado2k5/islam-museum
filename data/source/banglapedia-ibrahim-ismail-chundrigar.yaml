summary:
  ar: "مدخل إبراهيم إسماعيل جندريكار في بنغلابيديا، الموسوعة الوطنية لبنغلاديش؛ يُستخدم لوقائع الكيان فقط. يعطي مولده في 15 أبريل 1898 في أحمد آباد ووفاته سنة 1968، ورئاسته للوزراء بعد استقالة سهروردي في أكتوبر 1957، ويختلف جذريًا مع تواريخ ويكيبيديا الإنجليزية، ولا يذكر له مذهبًا."
  en: "Entry 'Chundrigar, Ibrahim Ismail' in Banglapedia, the national encyclopedia of Bangladesh; used for entity facts only. It gives his birth on 15 April 1898 at Ahmedabad and his death in 1968, and his prime ministership following Suhrawardy's resignation in October 1957 — a tradition wholly at odds with the English Wikipedia dates — and names no school for him."
  es: "Entrada 'Chundrigar, Ibrahim Ismail' en Banglapedia, la enciclopedia nacional de Bangladesh; utilizada únicamente para datos sobre la entidad. Indica su nacimiento el 15 de abril de 1898 en Ahmedabad y su muerte en 1968, así como su mandato como primer ministro tras la dimisión de Suhrawardy en octubre de 1957 —una tradición totalmente contradictoria con las fechas de la Wikipedia en inglés— y no menciona ninguna escuela a la que haya asistido."
  fr: "L'article « Chundrigar, Ibrahim Ismail » de Banglapedia, l'encyclopédie nationale du Bangladesh, est utilisé uniquement à des fins d'information sur l'entité. Il indique sa naissance le 15 avril 1898 à Ahmedabad et son décès en 1968, ainsi que sa nomination comme Premier ministre après la démission de Suhrawardy en octobre 1957 – une tradition totalement en contradiction avec les dates de Wikipédia en anglais – et ne mentionne aucune école à son nom."
  ur: "بنگلہ پیڈیا، بنگلہ دیش کے قومی انسائیکلوپیڈیا میں 'چندریگر، ابراہیم اسماعیل' کا اندراج؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 15 اپریل 1898 کو احمد آباد میں ان کی پیدائش اور 1968 میں ان کی موت، اور اکتوبر 1957 میں سہروردی کے استعفیٰ کے بعد ان کی وزارت عظمیٰ - ایک روایت جو انگریزی ویکیپیڈیا کی تاریخوں سے بالکل متصادم ہے - اور اس کے لیے کسی اسکول کا نام نہیں رکھتی۔"
  tr: "Bangladeş'e Ibrahim Ismail Jindrekar'ın kaydı, Bangladeş Ulusal Ansiklopedisi; yalnızca varlığın gerçekleri için kullanılmıştır. 15 Nisan 1898'de Ahmedabad'da doğdu, 1968'de öldü ve Suhrawardy'nin Ekim 1957'deki istifasından sonra Başbakan oldu; İngilizce Vikipedi'nin tarihlerinden temelde farklıdır, herhangi bir düşünce okulundan bahsedilmemektedir."
  id: "Entri Ibrahim Ismail Jindrekar di Bangladesh, Ensiklopedia Nasional Bangladesh; hanya digunakan untuk fakta entitas. Ia lahir pada 15 April 1898 di Ahmedabad, meninggal pada 1968, dan menjadi Perdana Menteri setelah Suhrawardy mengundurkan diri pada Oktober 1957, dan secara fundamental berbeda dari tanggal Wikipedia bahasa Inggris, tanpa menyebutkan aliran pemikiran apapun."
