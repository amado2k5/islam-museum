  ar: "مقالة ويكيبيديا الإنجليزية عن وقار يونس (مواليد 1971)؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في وهري بالبنجاب في 16 نوفمبر 1971، ومسيرته مع باكستان (373 ويكيت اختبار و416 ويكيت ليوم واحد بين 1989 و2003)، وشراكته مع وسيم أكرم، ولعبه لسري وغلامورغان، وقيادته باكستان، وعمله مدربا للمنتخب."
  en: "English Wikipedia article on Waqar Younis (born 1971); used for entity facts only. It records his birth in Vehari, Punjab, on 16 November 1971, his Pakistan career (373 Test wickets and 416 ODI wickets, 1989–2003), his bowling partnership with Wasim Akram, his Surrey and Glamorgan careers, his Pakistan captaincy and his later work as Pakistan head coach and bowling coach."
