summary:
  ar: "مقالة ويكيبيديا الروسية عن غمزت بك؛ تُستخدم لوقائع الكيان فقط. تعطي اسمه الكامل غمزت بك بن إسكندر بك الخوزادي، ومولده سنة 1789 في غوتساتل، ووفاته في 19 سبتمبر 1834 ⁦(بالتقويم اليولياني)⁩ في خونزاخ، وتفصّل سيرته قائدا عند غازي محمد ثم إماما ثانيا لداغستان؛ ولا تدّعي له انتماء إلى الطريقة النقشبندية."
  en: "Russian Wikipedia article on Gamzat-bek; used for entity facts only. It gives his full name Gamzat-bek bin Iskandar-bek al-Khuzadi, his birth in 1789 at Gotsatl, his death on 19 September 1834 (Julian) at Khunzakh, and a detailed biography as Ghazi Muhammad's commander and then second Imam of Dagestan; it claims no Naqshbandi membership for him."
  es: "Artículo de la Wikipedia rusa sobre Gamzat-bek; utilizado únicamente para datos sobre la persona. Indica su nombre completo, Gamzat-bek bin Iskandar-bek al-Khuzadi, su nacimiento en 1789 en Gotsatl, su fallecimiento el 19 de septiembre de 1834 (juliano) en Khunzakh, y una biografía detallada como comandante de Ghazi Muhammad y posteriormente segundo imán de Daguestán; no afirma que perteneciera a la Naqshbandi."
  fr: "Article de Wikipédia en russe sur Gamzat-bek; utilisé uniquement pour des informations factuelles. Il indique son nom complet Gamzat-bek bin Iskandar-bek al-Khuzadi, sa naissance en 1789 à Gotsatl, sa mort le 19 septembre 1834 (calendrier julien) à Khunzakh, et une biographie détaillée le présentant comme commandant de Ghazi Muhammad puis deuxième imam du Daghestan; il ne mentionne pas son appartenance au mouvement Naqshbandi."
  ur: "Gamzat-bek پر روسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کا پورا نام غمزت بیک بن اسکندر بیک الخزادی، ان کی پیدائش 1789 میں گوتسل میں، ان کی وفات 19 ستمبر 1834 ⁦(جولین)⁩ کو خنزخ میں، اور غازی محمد کے کمانڈر اور داغستان کے دوسرے امام کے طور پر تفصیلی سوانح حیات بیان کی گئی ہے۔ یہ اس کے لیے نقشبندی کی رکنیت کا دعویٰ نہیں کرتا۔"
