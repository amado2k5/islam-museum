  ar: "مقالة ويكيبيديا الروسية عن غمزت بك؛ تُستخدم لوقائع الكيان فقط. تعطي اسمه الكامل غمزت بك بن إسكندر بك الخوزادي، ومولده سنة 1789 في غوتساتل، ووفاته في 19 سبتمبر 1834 (بالتقويم اليولياني) في خونزاخ، وتفصّل سيرته قائدا عند غازي محمد ثم إماما ثانيا لداغستان؛ ولا تدّعي له انتماء إلى الطريقة النقشبندية."
  en: "Russian Wikipedia article on Gamzat-bek; used for entity facts only. It gives his full name Gamzat-bek bin Iskandar-bek al-Khuzadi, his birth in 1789 at Gotsatl, his death on 19 September 1834 (Julian) at Khunzakh, and a detailed biography as Ghazi Muhammad's commander and then second Imam of Dagestan; it claims no Naqshbandi membership for him."
