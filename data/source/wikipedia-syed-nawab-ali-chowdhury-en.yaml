reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. The article rests chiefly on the Banglapedia entry by Muhammad Abdus Salam and on Salam's 2015 memorial article in The News Today. It gives his birthplace as Dhanbari, Tangail; Banglapedia instead says he was born at his maternal grandfather's house at Natore — both are recorded in the person record. It covers his schooling (Rajshahi Collegiate School, then St Xavier's College, Calcutta), his ownership of the combined newspaper Mihir-Shudhakar from 1895 and the press he installed at his Calcutta house, his patronage of Muhammad Shahidullah, Reazuddin Ahmed al-Mashhadi and the poet Mozammel Haque, his books (Eid ul Azha 1890, Vernacular Education in Bengal 1900, Maulud Sharif 1903, Primary Education in Rural Areas 1906, and a 1920 work on Imam al-Ghazali's teachings), his politics after the 1905 Partition of Bengal, the 29 August 1911 demand with Khwaja Salimullah for a Dhaka university, his membership of the Nathan Committee, his renewal of the proposal in 1917, the Dhaka University Act of 1920 and classes from 1921, his gifts of 16,000 taka for scholarships and 35,000 taka raised by mortgaging part of his zamindari, his ministry of education held until his death, his help to 38 educational institutions and his founding of the Nawab Institute high school at Dhanbari in 1910, the naming of the university senate building for him on 9 June 2003, and his death at Eden Castle, Darjeeling. Its infobox records him as Nawab of Dhanbari 1911 to 17 April 1929, preceded by Syed Jonab Ali Chowdhury and succeeded by Altaf Ali Chowdhury, with children Altaf Ali Chowdhury and Hasan Ali Chowdhury and grandson Muhammad Ali Bogra. It names no religion or school for him."
