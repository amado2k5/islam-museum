  ar: "مقالة ويكيبيديا الإنجليزية عن سيد نواب علي تشودري، نواب دانباري وأول وزير مسلم في البنغال الموحدة؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في دانباري في 29 ديسمبر 1863 ووفاته في دارجيلنغ في 17 أبريل 1929، ودوره في تأسيس جامعة دكا وكتبه وألقابه."
  en: "English Wikipedia article on Syed Nawab Ali Chowdhury, Nawab of Dhanbari and the first Muslim minister of united Bengal; used for entity facts only. It records his birth at Dhanbari on 29 December 1863 and his death at Darjeeling on 17 April 1929, his part in founding the University of Dhaka, his books and his titles."
