summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سيد نواب علي تشودري، نواب دانباري وأول وزير مسلم في البنغال الموحدة؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في دانباري في 29 ديسمبر 1863 ووفاته في دارجيلنغ في 17 أبريل 1929، ودوره في تأسيس جامعة دكا وكتبه وألقابه."
  en: "English Wikipedia article on Syed Nawab Ali Chowdhury, Nawab of Dhanbari and the first Muslim minister of united Bengal; used for entity facts only. It records his birth at Dhanbari on 29 December 1863 and his death at Darjeeling on 17 April 1929, his part in founding the University of Dhaka, his books and his titles."
  es: "Artículo de la Wikipedia en inglés sobre Syed Nawab Ali Chowdhury, Nawab de Dhanbari y primer ministro musulmán de la Bengala unificada; utilizado únicamente para datos sobre la persona. En él se registra su nacimiento en Dhanbari el 29 de diciembre de 1863 y su fallecimiento en Darjeeling el 17 de abril de 1929, su participación en la fundación de la Universidad de Dhaka, sus libros y sus títulos."
  fr: "Article de Wikipédia en anglais sur Syed Nawab Ali Chowdhury, Nawab de Dhanbari et premier ministre musulman du Bengale unifié; utilisé uniquement à des fins d’information sur l’entité. Il relate sa naissance à Dhanbari le 29 décembre 1863 et sa mort à Darjeeling le 17 avril 1929, son rôle dans la fondation de l’université de Dhaka, ses ouvrages et ses titres."
  ur: "سید نواب علی چودھری، نواب آف دھنباری اور متحدہ بنگال کے پہلے مسلمان وزیر پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 29 دسمبر 1863 کو دھنباری میں ان کی پیدائش اور 17 اپریل 1929 کو دارجلنگ میں ان کی موت، ڈھاکہ یونیورسٹی کے قیام میں ان کا حصہ، ان کی کتابیں اور ان کے عنوانات درج ہیں۔"
  tr: "Danbari Nawabı ve birleşik Bengal'deki ilk Müslüman bakan Syed Nawab Ali Chowdhury hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılır. 29 Aralık 1863'te Danbari'de doğduğu ve 17 Nisan 1929'da Darjeeling'de öldüğü, ayrıca Dakka Üniversitesi'nin kuruluşundaki rolü, kitapları ve unvanları ile birlikte anılmaktadır."
  id: "Artikel Wikipedia bahasa Inggris tentang Syed Nawab Ali Chowdhury, Nawab Danbari dan menteri Muslim pertama di Bengal yang bersatu; hanya digunakan untuk fakta entitas tersebut. Ia disebutkan lahir di Danbari pada 29 Desember 1863, dan meninggal di Darjeeling pada 17 April 1929, serta perannya dalam mendirikan Universitas Dhaka, buku-bukunya, dan gelarnya."
