summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن العرضي؛ لوقائع الكيان فقط: ولد نحو 1200 في عرض بين تدمر والرصافة، مهندس ومعلم هندسة بدمشق قبل 1239، صنع آلات للملك المنصور بحمص، انتقل إلى مراغة سنة 1259 بدعوة الطوسي، أعماله رسالة الرصد وكتاب الهيئة، أثره على بار هبراوس وقطب الدين الشيرازي ونقله ابن الشاطر، وقضية العرضي التي توسع نظرية أبلونيوس وتستبدل بمميزة بطلميوس فلك تدوير حول مركز منتصف المسافة، وحجج ساليبا ونيوجباور في أثرها على كوبرنيك."
  en: "English Wikipedia article on Mu'ayyad al-Din al-Urdi; entity facts only: born c. 1200 at Urd between Palmyra and Resafa, engineer and geometry teacher at Damascus before 1239, instrument builder for al-Malik al-Mansur of Hims, moved to Maragha in 1259 at al-Tusi's call, author of Risalat al-Rasd and Kitab al-Haya, influencing Bar Hebraeus and Qutb al-Din al-Shirazi and quoted by Ibn al-Shatir, and the Urdi lemma extending Apollonius theorem to replace the equant with an epicycle about a centre at half the equant distance, with the Saliba and Neugebauer arguments for its influence on Copernicus."
