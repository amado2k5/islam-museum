summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن العرضي؛ لوقائع الكيان فقط: ولد نحو 1200 في عرض بين تدمر والرصافة، مهندس ومعلم هندسة بدمشق قبل 1239، صنع آلات للملك المنصور بحمص، انتقل إلى مراغة سنة 1259 بدعوة الطوسي، أعماله رسالة الرصد وكتاب الهيئة، أثره على بار هبراوس وقطب الدين الشيرازي ونقله ابن الشاطر، وقضية العرضي التي توسع نظرية أبلونيوس وتستبدل بمميزة بطلميوس فلك تدوير حول مركز منتصف المسافة، وحجج ساليبا ونيوجباور في أثرها على كوبرنيك."
  en: "English Wikipedia article on Mu'ayyad al-Din al-Urdi; entity facts only: born c. 1200 at Urd between Palmyra and Resafa, engineer and geometry teacher at Damascus before 1239, instrument builder for al-Malik al-Mansur of Hims, moved to Maragha in 1259 at al-Tusi's call, author of Risalat al-Rasd and Kitab al-Haya, influencing Bar Hebraeus and Qutb al-Din al-Shirazi and quoted by Ibn al-Shatir, and the Urdi lemma extending Apollonius theorem to replace the equant with an epicycle about a centre at half the equant distance, with the Saliba and Neugebauer arguments for its influence on Copernicus."
  es: "Artículo de la Wikipedia en inglés sobre Mu'ayyad al-Din al-Urdi; solo datos de la entidad: nació alrededor de 1200 en Urd entre Palmira y Resafa, ingeniero y profesor de geometría en Damasco antes de 1239, constructor de instrumentos para al-Malik al-Mansur de Hims, se mudó a Maragha en 1259 a petición de al-Tusi, autor de Risalat al-Rasd y Kitab al-Haya, que influyó en Bar Hebraeus y Qutb al-Din al-Shirazi y fue citado por Ibn al-Shatir, y el lema de Urdi que extiende el teorema de Apolonio para reemplazar el ecuante con un epiciclo alrededor de un centro a la mitad de la distancia del ecuante, con los argumentos de Saliba y Neugebauer sobre su influencia en Copérnico."
  fr: "Article de Wikipédia en anglais sur Mu'ayyad al-Din al-Urdi; faits concernant l'entité uniquement: né vers 1200 à Urd, entre Palmyre et Resafa, ingénieur et professeur de géométrie à Damas avant 1239, facteur d'instruments pour al-Malik al-Mansur de Hims, s'installe à Maragha en 1259 à l'appel d'al-Tusi, auteur de Risalat al-Rasd et Kitab al-Haya, influençant Bar Hebraeus et Qutb al-Din al-Shirazi et cité par Ibn al-Shatir, et le lemme d'Urdi étendant le théorème d'Apollonius pour remplacer l'équant par un épicycle autour d'un centre à la moitié de la distance de l'équant, avec les arguments de Saliba et Neugebauer pour son influence sur Copernic."
  ur: "معایۃ الدین الاردی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق: پیدائشی سی۔ پالمیرا اور رسافہ کے درمیان اردو میں 1200، دمشق میں 1239 سے پہلے انجینیئر اور جیومیٹری کے استاد، حمز کے المالک المنصور کے لیے ساز ساز، الطوسی کے بلانے پر 1259 میں مراثہ منتقل ہوئے، رسالت الراسد اور کتاب الحیاۃ البراء البرطین کے مصنف۔ الشیرازی اور ابن الشاطر کے حوالے سے نقل کیا گیا ہے، اور اردو لیمما نے اپولونیئس تھیوریم کو توسیع دی ہے تاکہ مساوی کو نصف مساوی فاصلے پر ایک مرکز کے بارے میں ایپی سائیکل سے تبدیل کیا جا سکے، کوپرنیکس پر اس کے اثر و رسوخ کے لیے سلیبا اور نیوجیباؤر کے دلائل کے ساتھ۔"
  tr: "Al-Ardi hakkında İngilizce Wikipedia makalesi; sadece varlık hakkında bilgi için: yaklaşık 1200 yılında Palmyra ile Rusafa arasında bir bölgede doğmuş, 1239'dan önce Şam'da mühendis ve mühendislik öğretmeni olmuş, Homs'ta Kral Al-Mansur için makineler yapmış, 1259'da Al-Tusi'nin davetiyle Maragha'ya taşınmıştır; eserleri 'Risalat Al-Rasad' ve 'Otorite Kitabı'dır; Bar Habraus ve Qutb al-Din Shirazi üzerindeki etkisi ve İbn al-Shatir tarafından aktarılmıştır; Al-Ardi vakası ise Apollonius'un teorisini genişletir ve bunu Ptolemaik Astronomi'nin remedianın merkezi etrafında dönmesini konu alır; ayrıca Saliba ve Neugebauer'in Kopernik üzerindeki etkisi üzerine argümanları vardır."
  id: "Artikel Wikipedia bahasa Inggris tentang Al-Ardi; hanya untuk fakta entitas: lahir sekitar tahun 1200 di daerah antara Palmyra dan Rusafa, insinyur dan guru teknik di Damaskus sebelum 1239, membuat mesin untuk Raja Al-Mansur di Homs, pindah ke Maragha pada 1259 atas undangan Al-Tusi, karya-karyanya adalah 'Risalat Al-Rasad' dan 'Buku Otoritas,' pengaruhnya pada Bar Habraus dan Qutb al-Din Shirazi yang diteruskan oleh Ibn al-Shatir, dan kasus Al-Ardi, yang memperluas teori Apollonius dan menggantinya dengan Astronomi Ptolemaik tentang rotasi di sekitar pusat median, serta argumen Saliba dan Neugebauer dalam dampaknya pada Copernicus."
