reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. The fullest chronology of the three: Medina studies with an ijaza, qadi at Ufa from 1891, the Ülfet and Tilmiz journals, the 1906 Muslim congresses, Ottoman citizenship in 1912, the Tripolitanian and Balkan wars, residence at Böğrüdelik from 1925, and the return to Japan on 12 October 1933. Its death day, 17 August 1944, conflicts with Wikidata's 31 August 1944; the split is recorded in his data record, not resolved here. It names no school for him."
