summary:
  ar: "مقالة ويكيبيديا التركية عن عبد الرشيد إبراهيم؛ تعطي ميلاده في 23 أبريل 1857 في تارا ووفاته في 17 أغسطس 1944 في طوكيو، وتفصّل دراسته وقضاءه في أوفا ونشره ورحلاته الكبرى الثلاث وعودته الأخيرة إلى اليابان."
  en: "Turkish Wikipedia article on Abdurreshid Ibrahim; it gives his birth on 23 April 1857 at Tara and his death on 17 August 1944 at Tokyo, and details his studies, his qadi post at Ufa, his publishing, his three great journeys and his final return to Japan."
  es: "Artículo de la Wikipedia en turco sobre Abdurreshid Ibrahim; en él se indica que nació el 23 de abril de 1857 en Tara y falleció el 17 de agosto de 1944 en Tokio, y se detallan sus estudios, su cargo como cadí en Ufa, sus publicaciones, sus tres grandes viajes y su regreso final a Japón."
  fr: "L'article de Wikipédia en turc sur Abdurreshid Ibrahim indique sa naissance le 23 avril 1857 à Tara et sa mort le 17 août 1944 à Tokyo, et détaille ses études, son poste de cadi à Oufa, ses publications, ses trois grands voyages et son retour final au Japon."
  ur: "عبدالرشید ابراہیم پر ترک ویکیپیڈیا مضمون؛ اس میں ان کی پیدائش 23 اپریل 1857 کو تارا میں ہوئی اور اس کی موت 17 اگست 1944 کو ٹوکیو میں ہوئی، اور اس کی تعلیم، اوفا میں ان کی قاضی پوسٹ، اس کی اشاعت، اس کے تین عظیم سفر اور جاپان میں ان کی آخری واپسی کی تفصیلات درج ہیں۔"
