reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md). A short article, largely mirroring the English one: born 20 August 1888 (12 Dhu al-Hijja 1305 AH) at Mansoura, died 8 December 1956 (5 Jumada al-awwal 1376 AH) at Cairo, law at the Khedivial school (1909), Sorbonne doctorate in law (1912), ten years a lawyer, influenced by Ahmad Lutfi al-Sayyid, education minister 1940–42, and a works list whose dates mostly follow the English article's (Hayat Muhammad 1933, Fi Manzil al-Wahy 1939, Uthman 1968). Used as a third attestation of the life dates. It names no religion or school for him. Read in full on 24 October 2026."
