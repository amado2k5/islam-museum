  ar: "وثيقة «How to Say It in Colloquial Arabic?»، Ghalib Al-Hakkak and students of Universite Paris 1 Pantheon-Sorbonne. لم يفتح المتحف هذا المرجع بنفسه؛ عُرف ما قيل عنه من ملخص بحثي قدّمه المؤسس إلى المتحف ووافق على استعماله في 21 نوفمبر 2026. يُستشهد به في: عبارات شائعة في العامية الشامية."
  en: "The document \"How to Say It in Colloquial Arabic?\" (Ghalib Al-Hakkak and students of Universite Paris 1 Pantheon-Sorbonne). The museum did not open it itself: what is known of it comes from a research summary supplied to the museum by the founder, who approved its use on 21 November 2026. Cited for: common phrases in Levantine Arabic."
  ur: "دستاویز «How to Say It in Colloquial Arabic?»، Ghalib Al-Hakkak and students of Universite Paris 1 Pantheon-Sorbonne۔ عجائب گھر نے اسے خود نہیں کھولا؛ اس کے بارے میں جو معلوم ہے وہ بانی کے فراہم کردہ تحقیقی خلاصے سے ہے، جس کے استعمال کی منظوری بانی نے 21 نومبر 2026 کو دی۔ اس کا حوالہ ان کے لیے دیا گیا: شامی عربی کے عام جملے۔"
  fr: "Le document « How to Say It in Colloquial Arabic? » (Ghalib Al-Hakkak and students of Universite Paris 1 Pantheon-Sorbonne). Le musée ne l'a pas ouvert lui-même : ce qu'on en sait vient d'un résumé de recherche fourni au musée par le fondateur, qui en a approuvé l'usage le 21 novembre 2026. Cité pour : les expressions courantes de l'arabe levantin."
  es: "El documento «How to Say It in Colloquial Arabic?» (Ghalib Al-Hakkak and students of Universite Paris 1 Pantheon-Sorbonne). El museo no lo abrió por sí mismo: lo que se sabe de él procede de un resumen de investigación entregado al museo por el fundador, que aprobó su uso el 21 de noviembre de 2026. Citado para: las expresiones comunes del árabe levantino."
