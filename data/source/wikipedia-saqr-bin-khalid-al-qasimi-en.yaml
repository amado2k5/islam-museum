summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الشيخ صقر بن خالد القاسمي (حكم 1883–1914)، حاكم الشارقة ورأس الخيمة من 1900؛ تروي استيلاءه على الحكم أثناء غياب عمه سالم بن سلطان، وتسوية المعاش سنة 1884، ومحاولات حميرية الانفصالية، واسترداد شعم سنة 1885، وضم رأس الخيمة سنة 1900، وبقاءه حاكمًا اسميًا لها بعد أن أحكم سالم قبضته عليها سنة 1910، مستندة إلى لوريمر (1915) وهيرد-بي (2005)."
  en: "English Wikipedia article on Sheikh Saqr bin Khalid Al Qasimi (reigned 1883–1914), ruler of Sharjah and, from 1900, of Ras Al Khaimah; it recounts his seizure of power during his uncle Salim bin Sultan's absence, the pension settlement of 1884, Hamriyah's secession attempts, the retaking of Sha'am in 1885, the annexation of Ras Al Khaimah in 1900, and his nominal rule there after Salim consolidated power in 1910, drawing on Lorimer (1915) and Heard-Bey (2005)."
