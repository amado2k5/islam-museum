summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الشيخ صقر بن خالد القاسمي ⁦(حكم 1883–1914)⁩، حاكم الشارقة ورأس الخيمة من 1900؛ تروي استيلاءه على الحكم أثناء غياب عمه سالم بن سلطان، وتسوية المعاش سنة 1884، ومحاولات حميرية الانفصالية، واسترداد شعم سنة 1885، وضم رأس الخيمة سنة 1900، وبقاءه حاكمًا اسميًا لها بعد أن أحكم سالم قبضته عليها سنة 1910، مستندة إلى لوريمر (1915) وهيرد-بي (2005)."
  en: "English Wikipedia article on Sheikh Saqr bin Khalid Al Qasimi (reigned 1883–1914), ruler of Sharjah and, from 1900, of Ras Al Khaimah; it recounts his seizure of power during his uncle Salim bin Sultan's absence, the pension settlement of 1884, Hamriyah's secession attempts, the retaking of Sha'am in 1885, the annexation of Ras Al Khaimah in 1900, and his nominal rule there after Salim consolidated power in 1910, drawing on Lorimer (1915) and Heard-Bey (2005)."
  es: "Artículo de la Wikipedia en inglés sobre el jeque Saqr bin Khalid Al Qasimi (reinó entre 1883 y 1914), gobernante de Sharjah y, desde 1900, de Ras Al Khaimah; relata su toma del poder durante la ausencia de su tío Salim bin Sultan, el acuerdo de pensiones de 1884, los intentos de secesión de Hamriyah, la reconquista de Sha'am en 1885, la anexión de Ras Al Khaimah en 1900 y su gobierno nominal allí después de que Salim consolidara el poder en 1910, basándose en Lorimer (1915) y Heard-Bey (2005)."
  fr: "Article de Wikipédia en anglais sur le cheikh Saqr bin Khalid Al Qasimi (règne 1883-1914), souverain de Sharjah et, à partir de 1900, de Ras Al Khaimah; il relate sa prise de pouvoir pendant l'absence de son oncle Salim bin Sultan, le règlement des pensions de 1884, les tentatives de sécession de Hamriyah, la reprise de Sha'am en 1885, l'annexion de Ras Al Khaimah en 1900 et son règne nominal sur place après que Salim a consolidé son pouvoir en 1910, s'appuyant sur Lorimer (1915) et Heard-Bey (2005)."
  ur: "انگریزی ویکیپیڈیا مضمون شیخ صقر بن خالد القاسمی ⁦(حکومت 1883–1914)⁩، شارجہ کے حکمران اور 1900 سے راس الخیمہ کے؛ اس میں ان کے چچا سلیم بن سلطان کی غیر موجودگی کے دوران اقتدار پر قبضے، 1884 کی پنشن کی تصفیہ، حمریہ کی علیحدگی کی کوششیں، 1885 میں شام کی واپسی، 1900 میں راس الخیمہ کا الحاق، اور سلیمری کے اقتدار سنبھالنے کے بعد وہاں اس کی برائے نام حکمرانی کا ذکر ہے۔ (1915) اور ہرڈ-بی (2005)۔"
  tr: "1900'den itibaren Sharjah ve Ras Al Khaimah'ın hükümdarı olan Şeyh Saqr bin Khalid Al Qasimi (1883–1914 yılları arasında hüküm sürdü) hakkında İngilizce Wikipedia makalesi; amcası Salem bin Sultan'ın yokluğunda iktidarı ele geçirmesini, 1884'te emekli maaşlarının anlaşmasını, Himyarite ayrılıkçılık girişimlerini, 1885'te Shaam'ın geri alınmasını, 1900'de Ras Al Khaimah'ın ilhakını ve Salem 1910'da kontrolü ele aldıktan sonra Lorimer (1915) ve Heard-Bee (2005) temelinde onun nominal yönetimini sürdürmesini anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Sheikh Saqr bin Khalid Al Qasimi (memerintah 1883–1914), penguasa Sharjah dan Ras Al Khaimah sejak 1900; artikel ini menceritakan perebutan kekuasaannya selama pamannya Salem bin Sultan tidak ada, penyelesaian pensiun pada tahun 1884, upaya separatisme Himyarite, pemulihan Shaam pada tahun 1885, aneksasi Ras Al Khaimah pada tahun 1900, dan kekuasaannya secara nominal setelah Salem mengambil alih kekuasaan tersebut pada tahun 1910, berdasarkan Lorimer (1915) dan Heard-Bee (2005)."
