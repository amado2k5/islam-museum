summary:
  ar: "قرار اللجنة الحكومية الدولية لصون التراث الثقافي غير المادي (الدورة 16، 2021) بإدراج «الخط العربي: المعارف والمهارات والممارسات» (رقم العنصر 01718) في القائمة التمثيلية للتراث الثقافي غير المادي للإنسانية، ويتضمن وصف العنصر وأسماء الدول الست عشرة الناقلة له ومعايير الإدراج الخمسة."
  en: "The decision of the Intergovernmental Committee for the Safeguarding of the Intangible Cultural Heritage (16th session, 2021) inscribing 'Arabic calligraphy: knowledge, skills and practices' (element no. 01718) on the Representative List of the Intangible Cultural Heritage of Humanity. It gives the element's description, the sixteen nominating States and the five criteria assessed."
