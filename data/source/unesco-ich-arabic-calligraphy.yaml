summary:
  ar: "قرار اللجنة الحكومية الدولية لصون التراث الثقافي غير المادي ⁦(الدورة 16، 2021)⁩ بإدراج «الخط العربي: المعارف والمهارات والممارسات» ⁦(رقم العنصر 01718)⁩ في القائمة التمثيلية للتراث الثقافي غير المادي للإنسانية، ويتضمن وصف العنصر وأسماء الدول الست عشرة الناقلة له ومعايير الإدراج الخمسة."
  en: "The decision of the Intergovernmental Committee for the Safeguarding of the Intangible Cultural Heritage (16th session, 2021) inscribing 'Arabic calligraphy: knowledge, skills and practices' (element no. 01718) on the Representative List of the Intangible Cultural Heritage of Humanity. It gives the element's description, the sixteen nominating States and the five criteria assessed."
  es: "Decisión del Comité Intergubernamental para la Salvaguardia del Patrimonio Cultural Inmaterial (16.º período de sesiones, 2021) por la que se inscribe la «Caligrafía árabe: conocimientos, habilidades y prácticas» (elemento n.º 01718) en la Lista Representativa del Patrimonio Cultural Inmaterial de la Humanidad. En ella se describe el elemento, se mencionan los dieciséis Estados que lo propusieron y se exponen los cinco criterios evaluados."
  fr: "Décision du Comité intergouvernemental de sauvegarde du patrimoine culturel immatériel (16e session, 2021) inscrivant « La calligraphie arabe: savoir-faire, savoir-faire et pratiques » (élément n° 01718) sur la Liste représentative du patrimoine culturel immatériel de l’humanité. Elle présente la description de l’élément, les seize États proposants et les cinq critères d’évaluation."
  ur: "غیر سرکاری ثقافتی ورثے کے تحفظ کے لیے بین الحکومتی کمیٹی کا فیصلہ ⁦(16 ویں سیشن، 2021)⁩ جس میں 'عربی خطاطی: علم، مہارت اور طرز عمل' ⁦(عنصر نمبر 01718)⁩ کو غیر محسوس ثقافتی ورثے کی نمائندہ فہرست میں شامل کیا گیا ہے۔ یہ عنصر کی تفصیل، نامزد کرنے والی سولہ ریاستیں اور پانچ معیارات بتاتا ہے۔"
