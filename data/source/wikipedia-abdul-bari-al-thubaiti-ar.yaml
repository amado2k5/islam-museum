  ar: "مقالة ويكيبيديا العربية عن عبد الباري الثبيتي؛ تُستخدم لوقائع الكيان فقط. تذكر مولده سنة 1380هـ/1960 بمكة، وشهاداته، وإمامتيه للحرم والمسجد النبوي، وتوقفه عن الصلوات الجهرية من صفر 1429هـ لمرض في الحبال الصوتية، وتسجيله المصحف كاملاً لإذاعة المملكة سنة 1399هـ/1978؛ وصندوقها يعطي الدين الإسلام ويترك خانة العقيدة فارغة، وتصنّفه فئاتها في الحنابلة."
  en: "Arabic Wikipedia article on Abdul Bari Al-Thubaiti; used for entity facts only. It gives his birth in 1380 AH/1960 at Mecca, his degrees, his Haram and Prophet's Mosque imamates, his withdrawal from the audible prayers from Safar 1429 AH because of a vocal-cord illness, and his complete Qur'an recording for Saudi radio in 1399 AH/1978; its infobox gives religion Islam and leaves the creed field empty, and its categories file him among Hanbalis."
