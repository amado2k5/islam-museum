summary:
  ar: "مقالة ويكيبيديا العربية عن عبد الباري الثبيتي؛ تُستخدم لوقائع الكيان فقط. تذكر مولده سنة 1380هـ/1960 بمكة، وشهاداته، وإمامتيه للحرم والمسجد النبوي، وتوقفه عن الصلوات الجهرية من صفر 1429هـ لمرض في الحبال الصوتية، وتسجيله المصحف كاملاً لإذاعة المملكة سنة 1399هـ/1978؛ وصندوقها يعطي الدين الإسلام ويترك خانة العقيدة فارغة، وتصنّفه فئاتها في الحنابلة."
  en: "Arabic Wikipedia article on Abdul Bari Al-Thubaiti; used for entity facts only. It gives his birth in 1380 AH/1960 at Mecca, his degrees, his Haram and Prophet's Mosque imamates, his withdrawal from the audible prayers from Safar 1429 AH because of a vocal-cord illness, and his complete Qur'an recording for Saudi radio in 1399 AH/1978; its infobox gives religion Islam and leaves the creed field empty, and its categories file him among Hanbalis."
  es: "Artículo de Wikipedia en árabe sobre Abdul Bari Al-Thubaiti; utilizado únicamente para datos sobre la persona. Indica su nacimiento en 1380 AH/1960 en La Meca, sus títulos académicos, sus imamatos en el Haram y la Mezquita del Profeta, su retirada de las oraciones audibles desde Safar 1429 AH debido a una enfermedad de las cuerdas vocales, y su grabación completa del Corán para la radio saudí en 1399 AH/1978; su ficha informativa indica que su religión es el Islam y deja el campo de credo vacío, y sus categorías lo clasifican entre los hanbalíes."
  fr: "Article Wikipédia en arabe sur Abdul Bari Al-Thubaiti; utilisé uniquement pour les informations biographiques. Il mentionne sa naissance en 1380 AH/1960 à La Mecque, ses diplômes, ses imamats au Haram et à la Mosquée du Prophète, son retrait des prières audibles à partir de Safar 1429 AH en raison d'une maladie des cordes vocales, et son enregistrement complet du Coran pour la radio saoudienne en 1399 AH/1978; son infobox indique l'islam comme religion et laisse le champ « croyance » vide, et ses catégories le classent parmi les Hanbalites."
  ur: "عبدالباری الثبیتی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ مکہ میں 1380ھ/1960 میں ان کی پیدائش، ان کے درجات، ان کے حرم اور مسجد نبوی کے اماموں، صفر 1429 ہجری کو آواز کی بیماری کی وجہ سے ان کی نماز کی سماعت سے دستبرداری، اور 1399 ہجری/1978 میں سعودی ریڈیو کے لیے اس کی مکمل قرآن کی ریکارڈنگ؛ اس کا معلوماتی خانہ مذہب اسلام دیتا ہے اور عقیدہ کا میدان خالی چھوڑ دیتا ہے، اور اس کے زمرے اسے حنبلیوں میں درج کرتے ہیں۔"
