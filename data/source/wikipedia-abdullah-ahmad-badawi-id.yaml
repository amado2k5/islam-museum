summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن عبد الله أحمد بدوي (1939–2025)؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 26 نوفمبر 1939 ووفاته في 14 أبريل 2025، ورئاسته لوزراء ماليزيا (2003–2009) ولقبه «باك لاه» ومفهومه «إسلام حضاري»، وأنه توفي في المعهد الوطني للقلب بكوالالمبور عن 85 عاما."
  en: "Indonesian Wikipedia article on Abdullah Ahmad Badawi (1939–2025); used for entity facts only. It gives his birth on 26 November 1939 and death on 14 April 2025, his Malaysian premiership (2003–2009), his Pak Lah nickname and Islam Hadhari concept, and records that he died at the National Heart Institute, Kuala Lumpur, aged 85."
  es: "Artículo de la Wikipedia en indonesio sobre Abdullah Ahmad Badawi (1939-2025); utilizado únicamente para datos sobre la persona. Indica su fecha de nacimiento, el 26 de noviembre de 1939, y su fallecimiento, el 14 de abril de 2025, su mandato como primer ministro de Malasia (2003-2009), su apodo Pak Lah y el concepto de Islam Hadhari, y registra que falleció en el Instituto Nacional del Corazón de Kuala Lumpur a los 85 años."
  fr: "Article de Wikipédia indonésien sur Abdullah Ahmad Badawi (1939-2025); utilisé uniquement à des fins d’information sur l’entité. Il indique sa date de naissance, le 26 novembre 1939, et sa date de décès, le 14 avril 2025, son mandat de Premier ministre de Malaisie (2003-2009), son surnom de Pak Lah et le concept d’Islam Hadhari, et précise qu’il est décédé à l’Institut national de cardiologie de Kuala Lumpur à l’âge de 85 ans."
  ur: "عبداللہ احمد بدوی (1939-2025) پر انڈونیشیائی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 26 نومبر 1939 کو ان کی پیدائش اور 14 اپریل 2025 کو موت، ان کی ملائیشیا کی پریمیئر شپ (2003–2009)، ان کا پاک لہ عرفی نام اور اسلام ہدھری کا تصور، اور ریکارڈ کرتا ہے کہ ان کا انتقال نیشنل ہارٹ انسٹی ٹیوٹ، کوالالمپور میں 85 سال کی عمر میں ہوا۔"
  tr: "Abdullah Ahmed Badawi (1939–2025) hakkında Endonezya Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 26 Kasım 1939'da doğduğu, 14 Nisan 2025'te Malezya Başbakanı olarak (2003–2009) öldüğü, \"Pak Lah\" unvanı ve \"medeniyetsel İslam\" kavramıyla vefat ettiği ve Kuala Lumpur'daki Ulusal Kalp Enstitüsü'nde 85 yaşında öldüğü belirtilmektedir."
  id: "Artikel Wikipedia Indonesia tentang Abdullah Ahmed Badawi (1939–2025); hanya digunakan untuk fakta entitas. Ia disebutkan lahir pada 26 November 1939, meninggal pada 14 April 2025 sebagai Perdana Menteri Malaysia (2003–2009), dengan gelar \"Pak Lah\" dan konsepnya sebagai \"Islam peradaban,\" serta meninggal di Institut Jantung Nasional di Kuala Lumpur pada usia 85 tahun."
