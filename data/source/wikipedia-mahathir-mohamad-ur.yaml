  ar: "مقالة ويكيبيديا الأردية عن مهاتير محمد، مراجعة 29 سبتمبر 2026؛ تُستخدم لوقائع الكيان فقط. تذكر ميلاده في ألور ستار في 10 يوليو 1925 وانتخابه نائبًا سنة 1964 وكتابه «معضلة الملايو» سنة 1970 وتوليه رئاسة الوزراء في 16 يوليو 1981."
