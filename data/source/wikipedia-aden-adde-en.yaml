summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن آدم عدي ⁦(آدم عبد الله عثمان دار)⁩؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في بلد وين في 9 ديسمبر 1908، وقيادته رابطة الشباب الصومالية، ورئاسته الأولى للصومال (1960–1967) وتسليمه السلطة سلميا بعد خسارته انتخابات 1967 — أول رئيس أفريقي يفعل ذلك — واستضافة الصومال مؤتمر العالم الإسلامي في 1966 في عهده، ووفاته في نيروبي في 8 يونيو 2007؛ ولا تذكر دينه شخصيا."
  en: "English Wikipedia article on Aden Adde (Aden Abdulle Osman Daar); used for entity facts only. It recounts his birth at Beledweyne on 9 December 1908, his leadership of the Somali Youth League, his first presidency of Somalia (1960–1967) and peaceful handover after losing the 1967 election — the first African president to do so — Somalia's hosting of the World Muslim Congress in 1966 under his presidency, and his death in Nairobi on 8 June 2007. It does not discuss his own religion."
  es: "Artículo de la Wikipedia en inglés sobre Aden Adde (Aden Abdulle Osman Daar); utilizado únicamente para datos sobre la persona. Relata su nacimiento en Beledweyne el 9 de diciembre de 1908, su liderazgo de la Liga Juvenil Somalí, su primera presidencia de Somalia (1960-1967) y la transferencia pacífica del poder tras perder las elecciones de 1967 —el primer presidente africano en hacerlo—, la celebración del Congreso Mundial Musulmán en Somalia en 1966 durante su presidencia y su fallecimiento en Nairobi el 8 de junio de 2007. No aborda su religión."
  fr: "Article de Wikipédia en anglais sur Aden Adde (Aden Abdulle Osman Daar); utilisé uniquement pour les informations factuelles. Il relate sa naissance à Beledweyne le 9 décembre 1908, son rôle à la tête de la Ligue de la jeunesse somalienne, sa première présidence de la Somalie (1960-1967) et la transition pacifique du pouvoir après sa défaite aux élections de 1967 – une première pour un président africain –, l’organisation par la Somalie du Congrès mondial musulman de 1966 sous sa présidence, et son décès à Nairobi le 8 juin 2007. Sa religion n’y est pas abordée."
