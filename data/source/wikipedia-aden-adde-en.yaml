summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن آدم عدي (آدم عبد الله عثمان دار)؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في بلد وين في 9 ديسمبر 1908، وقيادته رابطة الشباب الصومالية، ورئاسته الأولى للصومال (1960–1967) وتسليمه السلطة سلميا بعد خسارته انتخابات 1967 — أول رئيس أفريقي يفعل ذلك — واستضافة الصومال مؤتمر العالم الإسلامي في 1966 في عهده، ووفاته في نيروبي في 8 يونيو 2007؛ ولا تذكر دينه شخصيا."
  en: "English Wikipedia article on Aden Adde (Aden Abdulle Osman Daar); used for entity facts only. It recounts his birth at Beledweyne on 9 December 1908, his leadership of the Somali Youth League, his first presidency of Somalia (1960–1967) and peaceful handover after losing the 1967 election — the first African president to do so — Somalia's hosting of the World Muslim Congress in 1966 under his presidency, and his death in Nairobi on 8 June 2007. It does not discuss his own religion."
