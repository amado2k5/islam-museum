  ar: "مقالة ويكيبيديا الألبانية عن نعيم فراشري؛ تُستخدم لوقائع الكيان فقط. تصفه بأنه بدأ تعلُّم اللغات في تكية فراشر «كمُحِبّ بكتاشي»، وتذكر مناصبه العثمانية العالية في إسطنبول ودفنه سنة 1900 في تكية بكتاشية ونقل رفاته إلى ألبانيا سنة 1937."
  en: "Albanian Wikipedia article on Naim Frashëri; used for entity facts only. It says he began learning languages at the Frashër tekke 'as a Bektashi muhib (adherent)', records his high Ottoman posts in Istanbul, his burial in 1900 at a Bektashi tekke, and the transfer of his remains to Albania in 1937."
