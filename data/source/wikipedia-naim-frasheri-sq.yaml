reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It gives: the fourth child of Halit Bey Frashëri (1797–1859) and Emine (1814–1861); first lessons and the start of Ottoman Turkish, Arabic and Persian at the Tekke of Frashër 'si myhib bektashi' — as a Bektashi muhib, an adherent of the order; the family moved to Ioannina in 1865 and he attended the Greek gymnasium Zosimea (the article dates his attendance from 1869; the English article implies enrolment in 1865); graduated 1870, eight months in Istanbul in 1871, then two years in Ioannina; clerk at Berat, customs director at Saranda 1874–1877, six months' cure at Baden; tithe director at Berat for eight months in 1878; settled in Istanbul in 1882, member and then chairman of the Inspection and Censorship Commission at the Ministry of Education; with Sami obtained the permit for the Albanian school at Korçë in 1887; the first selective translations of Qur'an passages into Albanian appear in his textbooks (a fact about his translation work; no Qur'an text is reproduced in the museum record); Fletore e Bektashinjet and Qerbelaja are 'the first works of Albanian Bektashism'; died in the small hours of 20 October 1900 at his home in Kızıl Toprak, Kadıköy, and was buried on 21 October 1900 at the Merdivenköy Bektashi tekke beside his brother Abdyl's grave; his remains were brought to Albania on 2 June 1937 and placed in the Tirana Bektashi tekke (the English article's '1950s' permission is recorded against this as a conflict). The muhib statement is one of the record's three independent attestations of his Bektashi affiliation."
