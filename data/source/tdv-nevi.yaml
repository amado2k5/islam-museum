summary:
  ar: "مدخل «نوعي» في موسوعة الإسلام التركية (TDV) بقلم م. نجات سفرجي أوغلو ⁦(المجلد 33، إسطنبول 2007، ص 52–54)⁩؛ أوفى ترجمة علمية له: مولده في مالقرة سنة 940هـ ⁦(1533–34م)⁩، وتعليمه ومناصبه التدريسية وتعليمه أبناء مراد الثالث ومؤلفاته ووفاته في 30 ذي القعدة 1007هـ ⁦(24 يونيو 1599م)⁩ ودفنه بجامع الشيخ وفا في إسطنبول."
  en: "The TDV İslâm Ansiklopedisi (Turkish encyclopedia of Islam) entry 'NEV'Î' by M. Nejat Sefercioğlu (vol. 33, Istanbul 2007, pp. 52–54); the fullest scholarly biography — his birth at Malkara in 940 (1533–34), his education, medrese posts, tutorship of Murad III's sons, his works, his death on 30 Zilkade 1007 (24 June 1599) and his burial at the Şeyh Vefâ mosque in Istanbul."
  es: "La entrada 'NEV'Î' de la TDV İslâm Ansiklopedisi (enciclopedia turca del Islam) de M. Nejat Sefercioğlu (vol. 33, Estambul 2007, págs. 52-54); la biografía académica más completa: su nacimiento en Malkara en 940 (1533-34), su educación, cargos en madrasas, tutela de los hijos de Murad III, sus obras, su muerte el 30 de Zilkade de 1007 (24 de junio de 1599) y su entierro en la mezquita Şeyh Vefâ en Estambul."
  fr: "L'entrée « NEV'Î » de M. Nejat Sefercioğlu (vol. 33, Istanbul 2007, pp. 52-54) de la TDV İslâm Ansiklopedisi (encyclopédie turque de l'Islam); la biographie savante la plus complète — sa naissance à Malkara en 940 (1533-34), son éducation, ses postes dans les medreses, son tutorat des fils de Murad III, ses œuvres, sa mort le 30 Zilkade 1007 (24 juin 1599) et son enterrement à la mosquée Şeyh Vefâ à Istanbul."
