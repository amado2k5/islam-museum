  ar: "مدخل «نوعي» في موسوعة الإسلام التركية (TDV) بقلم م. نجات سفرجي أوغلو (المجلد 33، إسطنبول 2007، ص 52–54)؛ أوفى ترجمة علمية له: مولده في مالقرة سنة 940هـ (1533–34م)، وتعليمه ومناصبه التدريسية وتعليمه أبناء مراد الثالث ومؤلفاته ووفاته في 30 ذي القعدة 1007هـ (24 يونيو 1599م) ودفنه بجامع الشيخ وفا في إسطنبول."
  en: "The TDV İslâm Ansiklopedisi (Turkish encyclopedia of Islam) entry 'NEV'Î' by M. Nejat Sefercioğlu (vol. 33, Istanbul 2007, pp. 52–54); the fullest scholarly biography — his birth at Malkara in 940 (1533–34), his education, medrese posts, tutorship of Murad III's sons, his works, his death on 30 Zilkade 1007 (24 June 1599) and his burial at the Şeyh Vefâ mosque in Istanbul."
