reliability_note: "Scholarly encyclopedia entry, read in full on 1 November 2026; the web text was checked against the print PDF, which confirms vol. 33, pp. 52–54 and the author's byline (Sefercioğlu, the scholar of Nev'î's Divan). An independent source beyond Wikipedia, and the anchor for the biography, dates and works. It details his Sufi training and discipleship — to Sarhoş Bâlî Efendi, then as mürid of Kurd Mehmed Efendi, with further training under Şeyh Şâban Efendi — and his translation of Ibn Arabi's Fusûs al-hikam, but it names no legal school or creed for him, so it is not counted toward a faith settlement."
