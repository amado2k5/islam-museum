summary:
  ar: "مقالة ويكيبيديا الملايوية عن الحاج وان محمد بن الحاج عبد الصمد؛ تُستخدم لوقائع الكيان فقط. توثّق ميلاده في نهاية سبتمبر 1870 بصفته الابن الأكبر لتوان تابال، وتعيينه مفتيًا لكلنتن في 21 أغسطس 1916 خلفًا لأخيه وان موسى، ووفاته سنة 1920."
  en: "Malay Wikipedia article on Haji Wan Muhammad bin Haji Abdul Samad; used for entity facts only. It records his birth at the end of September 1870 as the eldest son of Tuan Tabal, his appointment as Mufti of Kelantan on 21 August 1916 succeeding his brother Wan Musa, and his death in 1920."
  es: "Artículo de Wikipedia en malayo sobre Haji Wan Muhammad bin Haji Abdul Samad; utilizado únicamente para datos sobre la persona. En él se registra su nacimiento a finales de septiembre de 1870 como hijo mayor de Tuan Tabal, su nombramiento como Mufti de Kelantan el 21 de agosto de 1916, sucediendo a su hermano Wan Musa, y su fallecimiento en 1920."
  fr: "Article de Wikipédia en malais sur Haji Wan Muhammad bin Haji Abdul Samad; utilisé uniquement à des fins d’information sur l’entité. Il relate sa naissance fin septembre 1870, fils aîné de Tuan Tabal, sa nomination comme mufti de Kelantan le 21 août 1916, succédant à son frère Wan Musa, et son décès en 1920."
  ur: "حاجی وان محمد بن حاجی عبدالصمد پر مالائی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ستمبر 1870 کے آخر میں توان تبل کے بڑے بیٹے کے طور پر ان کی پیدائش، 21 اگست 1916 کو کیلانتان کے مفتی کے طور پر ان کی تقرری اپنے بھائی وان موسی کے بعد، اور 1920 میں ان کی موت درج ہے۔"
  tr: "Hacı Wan Muhammed bin El-Hac Abdul Samad hakkında Malay Vikipedi makalesi yalnızca varlığın gerçekleri için kullanılmaktadır. Doğumu, Eylül 1870 sonunda Tuan Tabal'ın en büyük oğlu olarak kaydedilmiştir; 21 Ağustos 1916'da kardeşi Wan Musa'nın yerine Clinton Müftüsü olarak atanması ve 1920'de ölümü belgelenmiştir."
  id: "Artikel Wikipedia Bahasa Melayu tentang Haj Wan Muhammad bin Al-Hajj Abdul Samad hanya digunakan untuk fakta-fakta entitas tersebut. Kelahirannya didokumentasikan pada akhir September 1870 sebagai putra sulung Tuan Tabal, dan pengangkatannya sebagai Mufti Clinton pada 21 Agustus 1916, menggantikan saudaranya Wan Musa, dan kematiannya pada tahun 1920."
