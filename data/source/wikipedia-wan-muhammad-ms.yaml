  ar: "مقالة ويكيبيديا الملايوية عن الحاج وان محمد بن الحاج عبد الصمد؛ تُستخدم لوقائع الكيان فقط. توثّق ميلاده في نهاية سبتمبر 1870 بصفته الابن الأكبر لتوان تابال، وتعيينه مفتيًا لكلنتن في 21 أغسطس 1916 خلفًا لأخيه وان موسى، ووفاته سنة 1920."
  en: "Malay Wikipedia article on Haji Wan Muhammad bin Haji Abdul Samad; used for entity facts only. It records his birth at the end of September 1870 as the eldest son of Tuan Tabal, his appointment as Mufti of Kelantan on 21 August 1916 succeeding his brother Wan Musa, and his death in 1920."
