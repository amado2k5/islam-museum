reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md). A short article, read in full on 1 November 2026. Its lead states that Mufti Haji Wan Muhammad bin Haji Abdul Samad (1870–1920) was appointed Mufti of Kelantan to replace his younger brother Haji Wan Musa (the third mufti), who had resigned, and that he was appointed on 21 August 1916; its background section states that he was the eldest son of Tuan Tabal, born at the end of September 1870. It links out to the Kelantan Islamic Religious Council's (MAIK) scholar biography page for further information. It names no legal school for him personally."
