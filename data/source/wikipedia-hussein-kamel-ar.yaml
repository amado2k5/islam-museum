summary:
  ar: "مقالة ويكيبيديا العربية عن السلطان حسين كامل؛ توافق الإنجليزية في تاريخي المولد والوفاة، وتصنيفاتها تعطي سنتي 1270 و1335 هـ."
  en: "Arabic Wikipedia article on Sultan Hussein Kamel; used for entity facts only. It agrees with the English article on birth on 21 November 1853 and death on 9 October 1917, both at Cairo, and its categories give his birth year as 1270 AH and death year as 1335 AH."
  es: "Artículo de Wikipedia en árabe sobre el sultán Hussein Kamel; utilizado únicamente para datos sobre la persona. Coincide con el artículo en inglés sobre su nacimiento el 21 de noviembre de 1853 y su fallecimiento el 9 de octubre de 1917, ambos en El Cairo, y sus categorías indican que nació en el año 1270 de la Hégira y falleció en el año 1335 de la Hégira."
  fr: "L'article de Wikipédia en arabe sur le sultan Hussein Kamel, utilisé uniquement pour les informations le concernant, concorde avec l'article en anglais: naissance le 21 novembre 1853 et décès le 9 octobre 1917, tous deux au Caire. Ses catégories indiquent l'année de naissance 1270 AH et l'année de décès 1335 AH."
  ur: "سلطان حسین کامل پر عربی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 21 نومبر 1853 کو پیدائش اور وفات 9 اکتوبر 1917 کو قاہرہ کے انگریزی مضمون سے متفق ہے، اور اس کے زمرے اس کا سال پیدائش 1270 ہجری اور سال وفات 1335 ہجری بتاتے ہیں۔"
