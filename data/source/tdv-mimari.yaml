summary:
  ar: "مدخل «مِيمارِي» ⁦(العمارة)⁩ في موسوعة TDV الإسلامية التركية بقلم سلجوق مولايم ⁦(المجلد 30، أنقرة 2020، ص 91–95)⁩، ويتناول أصل الكلمة وموقعها بين العلوم، والعمارة الإسلامية وأقاليمها، وديوان المعماريين العثمانيين وتصاريحهم، وتقسيم العمل بين المعمار والبنّاء والنجّار، والرسوم والنماذج، وحسابات بناء السليمانية."
  en: "The TDV İslâm Ansiklopedisi entry 'MİMARİ' (architecture) by Selçuk Mülâyim (vol. 30, Ankara 2020, pp. 91–95). It covers the word and its root, the place of building in the classical sciences, Islamic architecture and its regions, the Ottoman architects' office and licence, the division of labour among architects, masons and carpenters, drawings and models, and the Süleymaniye building accounts."
  es: "La entrada «MİMARİ» (arquitectura) de la TDV İslâm Ansiklopedisi, de Selçuk Mülâyim (vol. 30, Ankara 2020, pp. 91-95), abarca la palabra y su raíz, el lugar de la construcción en las ciencias clásicas, la arquitectura islámica y sus regiones, el oficio y la licencia de los arquitectos otomanos, la división del trabajo entre arquitectos, albañiles y carpinteros, los dibujos y maquetas, y las cuentas de construcción de Süleymaniye."
  fr: "L’article « MİMARİ » (architecture) de Selçuk Mülâyim (vol. 30, Ankara 2020, p. 91-95) dans la TDV İslâm Ansiklopedisi traite du mot et de son étymologie, de la place de la construction dans les sciences classiques, de l’architecture islamique et de ses régions, du bureau et de l’agrément des architectes ottomans, de la division du travail entre architectes, maçons et charpentiers, des dessins et maquettes, ainsi que des comptes de construction de Süleymaniye."
  ur: "TDV İslâm Ansiklopedisi اندراج 'MİMARİ' ⁦(فن تعمیر)⁩ از Selçuk Mülâyim ⁦(جلد 30، انقرہ 2020، صفحہ 91-95)⁩۔ اس میں لفظ اور اس کی جڑ، کلاسیکی علوم میں عمارت کا مقام، اسلامی فن تعمیر اور اس کے علاقوں، عثمانی معماروں کا دفتر اور لائسنس، معماروں، معماروں اور بڑھئیوں کے درمیان محنت کی تقسیم، ڈرائنگ اور ماڈلز، اور سلیمانی عمارت کے اکاؤنٹس کا احاطہ کیا گیا ہے۔"
