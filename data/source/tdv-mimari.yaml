summary:
  ar: "مدخل «مِيمارِي» (العمارة) في موسوعة TDV الإسلامية التركية بقلم سلجوق مولايم (المجلد 30، أنقرة 2020، ص 91–95)، ويتناول أصل الكلمة وموقعها بين العلوم، والعمارة الإسلامية وأقاليمها، وديوان المعماريين العثمانيين وتصاريحهم، وتقسيم العمل بين المعمار والبنّاء والنجّار، والرسوم والنماذج، وحسابات بناء السليمانية."
  en: "The TDV İslâm Ansiklopedisi entry 'MİMARİ' (architecture) by Selçuk Mülâyim (vol. 30, Ankara 2020, pp. 91–95). It covers the word and its root, the place of building in the classical sciences, Islamic architecture and its regions, the Ottoman architects' office and licence, the division of labour among architects, masons and carpenters, drawings and models, and the Süleymaniye building accounts."
