reliability_note: "Read on 1 November 2026 in the web edition at islamansiklopedisi.org.tr/mimari. The body's passages on the word and its root, the classical sciences, the four-caliphs period, the building trades, the Ottoman architects' office and licence, drawings and models, the Süleymaniye accounts and the economics of building were read in full. The passages on the regional forms of mosques, domes and vaults were checked by keyword only. The web page gives no page for each paragraph, so citations use the printed range of the whole entry. The bibliography (Câfer Efendi's Risâle-i Mi'mâriyye, Sâî Mustafa Çelebi, Barkan, Afyoncu, Ayvansarayî and others) was not opened."
