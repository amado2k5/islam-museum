  ar: "مقالة ويكيبيديا الإنجليزية عن إدوارد ميندي؛ تُستخدم لوقائع الكيان فقط. تروي بدايته في لوهافر وتشيربورغ وعامه بلا نادٍ، ثم صعوده مع ريمس ورين وتشيلسي — حيث فاز بدوري الأبطال وجائزة فيفا لأفضل حارس — وانتقاله إلى الأهلي، ولقبيه في كأس أمم أفريقيا مع السنغال."
  en: "English Wikipedia article on Édouard Mendy; used for entity facts only. It recounts his start at Le Havre and Cherbourg and his year without a club, his rise at Reims, Rennes and Chelsea — where he won the Champions League and The Best FIFA Goalkeeper award — his move to Al-Ahli, and his two Africa Cup of Nations titles with Senegal."
