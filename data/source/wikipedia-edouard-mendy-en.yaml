reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026; the reading route did not expose a revision id, so the consultation date is recorded in place of a revision. It gives Mendy (full name Édouard Osoque Mendy) as born on 1 March 1992 in Montivilliers, France, to a Senegalese mother and a Bissau-Guinean father, a cousin of Ferland Mendy; released by Cherbourg in 2014 and without a club for a year, during which he registered for unemployment; Marseille's reserve goalkeeper in 2015-16; Reims from 2016 (Ligue 2 title 2017-18); Rennes from August 2019; Chelsea from September 2020 (Champions League 2021, with a record-equalling nine clean sheets in the campaign; UEFA Goalkeeper of the Year and The Best FIFA Goalkeeper for 2021, the first African goalkeeper to win both); Al-Ahli from June 2023 (AFC Champions League Elite 2024-25, as the competition's best goalkeeper); Senegal debut in November 2018, Africa Cup of Nations winner 2021 (named the tournament's best goalkeeper) and 2025. The article makes no statement of his religion anywhere in its text or infobox."
