  ar: "مقالة ويكيبيديا العربية عن محمد صديق المنشاوي؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في المنشاة سنة 1338هـ/1920، وأسرته القرآنية، ومسيرته الإذاعية وتسجيلاته ورحلاته، ووفاته يوم الجمعة 5 ربيع الثاني 1389هـ الموافق 20 يونيو 1969؛ وصندوق معلوماتها يعطي طائفته أهل السنة والجماعة."
  en: "Arabic Wikipedia article on Muhammad Siddiq al-Minshawi; used for entity facts only. It gives his birth at al-Munsha'ah in 1338 AH/1920, his family of reciters, his radio career, recordings and travels, and his death on Friday 5 Rabi' al-Thani 1389 AH (20 June 1969); its infobox gives his sect as Ahl al-Sunna wa-l-Jama'a."
