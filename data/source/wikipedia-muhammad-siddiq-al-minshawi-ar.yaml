summary:
  ar: "مقالة ويكيبيديا العربية عن محمد صديق المنشاوي؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في المنشاة سنة 1338هـ/1920، وأسرته القرآنية، ومسيرته الإذاعية وتسجيلاته ورحلاته، ووفاته يوم الجمعة 5 ربيع الثاني 1389هـ الموافق 20 يونيو 1969؛ وصندوق معلوماتها يعطي طائفته أهل السنة والجماعة."
  en: "Arabic Wikipedia article on Muhammad Siddiq al-Minshawi; used for entity facts only. It gives his birth at al-Munsha'ah in 1338 AH/1920, his family of reciters, his radio career, recordings and travels, and his death on Friday 5 Rabi' al-Thani 1389 AH (20 June 1969); its infobox gives his sect as Ahl al-Sunna wa-l-Jama'a."
  es: "Artículo de Wikipedia en árabe sobre Muhammad Siddiq al-Minshawi; utilizado únicamente para datos sobre la persona. Indica su nacimiento en al-Munsha'ah en 1338 AH/1920, su familia de recitadores, su carrera radiofónica, grabaciones y viajes, y su muerte el viernes 5 de Rabi' al-Thani de 1389 AH (20 de junio de 1969); su ficha informativa indica que pertenecía a la secta Ahl al-Sunna wa-l-Jama'a."
  fr: "Article de Wikipédia en arabe sur Muhammad Siddiq al-Minshawi; utilisé uniquement pour les informations le concernant. Il indique sa naissance à al-Munsha'ah en 1338 AH/1920, sa famille de récitants, sa carrière radiophonique, ses enregistrements et ses voyages, ainsi que sa mort le vendredi 5 Rabi' al-Thani 1389 AH (20 juin 1969); son infobox précise qu'il appartenait à la secte Ahl al-Sunna wa-l-Jama'a."
  ur: "محمد صدیق المنشاوی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی ولادت المنشاہ میں 1338ھ/1920 میں ہوئی، ان کے قراء کا خاندان، ان کا ریڈیو کیریئر، ریکارڈنگ اور سفر، اور ان کی وفات جمعہ 5 ربیع الثانی 1389ھ ⁦(20 جون 1969)⁩ کو ہوئی؛ اس کا معلوماتی خانہ اس کا فرقہ اہل السنۃ والجماعۃ دیتا ہے۔"
