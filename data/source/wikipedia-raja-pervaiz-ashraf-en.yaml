summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن راجا برويز أشرف؛ تُستخدم لوقائع الكيان فقط. تروي مولده في 26 ديسمبر 1950 في سنغهر بالسند في أسرة مسلمة بنجابية، وتخرجه في جامعة السند سنة 1970، وعضويته في الجمعية الوطنية عن غوجر خان، ووزارته للمياه والطاقة (2008–2011)، ورئاسته الوزراء من يونيو 2012 إلى مارس 2013، ورئاسته للجمعية الوطنية (2022–2024)، واتهامات مشاريع الطاقة المؤجرة وما آلت إليه كما تذكرها المقالة. ولا تسمّي مذهبا له."
  en: "English Wikipedia article on Raja Pervez Ashraf; used for entity facts only. It recounts his birth on 26 December 1950 at Sanghar, Sindh, to a Punjabi Muslim family, his graduation from the University of Sindh in 1970, his National Assembly membership from Gujar Khan, his water and power ministry (2008–2011), his premiership from June 2012 to March 2013, his speakership of the National Assembly (2022–2024), and the rental-power allegations and their state as the article reports them. It names no school for him."
  es: "Artículo de la Wikipedia en inglés sobre Raja Pervez Ashraf; utilizado únicamente para datos sobre la persona. Relata su nacimiento el 26 de diciembre de 1950 en Sanghar, Sindh, en el seno de una familia musulmana punjabí; su graduación de la Universidad de Sindh en 1970; su escaño en la Asamblea Nacional por Gujar Khan; su ministerio de agua y energía (2008-2011); su mandato como primer ministro desde junio de 2012 hasta marzo de 2013; su presidencia de la Asamblea Nacional (2022-2024); y las acusaciones de alquiler de centrales eléctricas y su estado actual, según lo que informa el artículo. No menciona ninguna escuela a la que haya asistido."
  fr: "Article de Wikipédia en anglais sur Raja Pervez Ashraf; utilisé uniquement à des fins d'information sur l'entité. Il relate sa naissance le 26 décembre 1950 à Sanghar, dans le Sindh, au sein d'une famille musulmane punjabie, son diplôme de l'Université du Sindh en 1970, son mandat de député de Gujar Khan à l'Assemblée nationale, son ministère de l'Eau et de l'Énergie (2008-2011), son mandat de Premier ministre de juin 2012 à mars 2013, sa présidence de l'Assemblée nationale (2022-2024), ainsi que les allégations de corruption liées à l'électricité et leur état actuel, tels que présentés dans l'article. Aucune école n'est mentionnée."
  ur: "راجہ پرویز اشرف پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی پیدائش 26 دسمبر 1950 کو سانگھڑ، سندھ میں ایک پنجابی مسلمان گھرانے میں ہوئی، 1970 میں سندھ یونیورسٹی سے ان کی گریجویشن، گوجر خان سے ان کی قومی اسمبلی کی رکنیت، ان کی وزارت پانی و بجلی (2008-2011)، جون 2012 سے مارچ 2013 تک ان کی وزارت عظمیٰ، اور قومی اسمبلی کے اسپیکر (2020-2013) رینٹل پاور کے الزامات اور ان کی حالت جیسا کہ مضمون ان کی رپورٹ کرتا ہے۔ اس کے لیے کسی اسکول کا نام نہیں ہے۔"
  tr: "Raja Pervez Ashraf hakkında İngilizce Wikipedia makalesi; yalnızca kurumun gerçekleri için kullanılmıştır. 26 Aralık 1950'de Sindh, Singhar'da Pencaplı bir Müslüman ailede doğmasını, 1970'te Sindh Üniversitesi'nden mezuniyetini, Gujar Khan için Ulusal Meclis üyeliğini, Su ve Enerji Bakanlığı'nı (2008–2011), Haziran 2012'den Mart 2013'e kadar başbakanlığını, Ulusal Meclis başkanlığını (2022–2024) ve makalede belirtilen kiralık enerji projeleri ile sonuçlarına yönelik suçlamaları anlatır. Düşünce tarzının adı verilmemektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Raja Pervez Ashraf; digunakan hanya untuk fakta entitas tersebut. Artikel ini menceritakan kelahirannya pada 26 Desember 1950 di Singhar, Sindh, dalam keluarga Muslim Punjabi, kelulusannya dari Universitas Sindh pada tahun 1970, keanggotaannya di Majelis Nasional untuk Gujar Khan, Kementerian Air dan Energi (2008–2011), masa jabatannya sebagai perdana menteri dari Juni 2012 hingga Maret 2013, kepresidenannya di Majelis Nasional (2022–2024), serta tuduhan terhadap proyek energi sewaan dan hasilnya seperti yang disebutkan dalam artikel tersebut. Artikel tersebut tidak menyebutkan aliran pemikirannya."
