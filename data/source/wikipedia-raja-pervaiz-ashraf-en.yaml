summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن راجا برويز أشرف؛ تُستخدم لوقائع الكيان فقط. تروي مولده في 26 ديسمبر 1950 في سنغهر بالسند في أسرة مسلمة بنجابية، وتخرجه في جامعة السند سنة 1970، وعضويته في الجمعية الوطنية عن غوجر خان، ووزارته للمياه والطاقة (2008–2011)، ورئاسته الوزراء من يونيو 2012 إلى مارس 2013، ورئاسته للجمعية الوطنية (2022–2024)، واتهامات مشاريع الطاقة المؤجرة وما آلت إليه كما تذكرها المقالة. ولا تسمّي مذهبا له."
  en: "English Wikipedia article on Raja Pervez Ashraf; used for entity facts only. It recounts his birth on 26 December 1950 at Sanghar, Sindh, to a Punjabi Muslim family, his graduation from the University of Sindh in 1970, his National Assembly membership from Gujar Khan, his water and power ministry (2008–2011), his premiership from June 2012 to March 2013, his speakership of the National Assembly (2022–2024), and the rental-power allegations and their state as the article reports them. It names no school for him."
