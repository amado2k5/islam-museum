summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ماجيت غفوري؛ تُستخدم لوقائع الكيان فقط. تعطي مولده مزدوج التأريخ 20 يوليو ⁦(بالقديم 8 يوليو)⁩ 1880 في زيليم كارانوفو بمحافظة أوفا، ووفاته في 28 أكتوبر 1934 بأوفا ودفنه في حديقة لينين بها، ونشأته في أسرة معلّم تتارية اللسان، ودراسته في مدارس طرويسك وقازان وأوفا، ولقب شاعر الشعب في باشكيريا سنة 1923؛ ولا تسمي له دينا ولا مذهبا."
  en: "English Wikipedia article on Majit Gafuri; used for entity facts only. It dual-dates his birth 20 July [O.S. 8 July] 1880 at Zilim-Karanovo in Ufa Governorate, gives his death on 28 October 1934 at Ufa and his resting place in the Lenin Garden there, his upbringing in a Tatar-speaking teacher's family, his madrasa study at Troitsk, Kazan and Ufa, and the People's Poet of Bashkortostan title of 1923; it names no religion or school for him."
  es: "Artículo de la Wikipedia en inglés sobre Majit Gafuri; utilizado únicamente para datos sobre la persona. Indica su nacimiento el 20 de julio [8 de julio según el calendario antiguo] de 1880 en Zilim-Karanovo, en la gobernación de Ufa; su muerte el 28 de octubre de 1934 en Ufa, donde descansa en el Jardín Lenin; su crianza en una familia de maestros de habla tártara; sus estudios en madrasas de Troitsk, Kazán y Ufa; y el título de Poeta del Pueblo de Bashkortostán de 1923; no menciona ninguna religión ni escuela a la que perteneciera."
  fr: "L'article de Wikipédia en anglais sur Majit Gafuri, utilisé uniquement pour les informations biographiques, mentionne sa naissance le 20 juillet [8 juillet du calendrier julien] 1880 à Zilim-Karanovo, dans le gouvernement d'Oufa, son décès le 28 octobre 1934 à Oufa, ainsi que son lieu de sépulture dans le jardin Lénine. Il y est également question de son enfance dans une famille d'enseignants tatarophone, de ses études à la madrasa de Troïtsk, Kazan et Oufa, et de son titre de poète du peuple du Bachkortostan en 1923. L'article ne précise ni sa religion ni son école."
  ur: "مجیت غفوری پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ دوہری تاریخیں ان کی پیدائش 20 جولائی [OS 8 جولائی] 1880 کو اوفا گورنریٹ میں زیلم کارانوو میں، 28 اکتوبر 1934 کو اوفا میں اس کی موت اور وہاں کے لینن گارڈن میں اس کی آرام گاہ، تاتار بولنے والے استاد کے خاندان میں اس کی پرورش، اس کے مدرسے میں پڑھائی اور ٹروئٹسک، پیپلز، کازفاس، کا مدرسہ۔ 1923 کا باشکورتوستان ٹائٹل؛ اس کے لیے کسی مذہب یا اسکول کا نام نہیں ہے۔"
