summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ماجيت غفوري؛ تُستخدم لوقائع الكيان فقط. تعطي مولده مزدوج التأريخ 20 يوليو (بالقديم 8 يوليو) 1880 في زيليم كارانوفو بمحافظة أوفا، ووفاته في 28 أكتوبر 1934 بأوفا ودفنه في حديقة لينين بها، ونشأته في أسرة معلّم تتارية اللسان، ودراسته في مدارس طرويسك وقازان وأوفا، ولقب شاعر الشعب في باشكيريا سنة 1923؛ ولا تسمي له دينا ولا مذهبا."
  en: "English Wikipedia article on Majit Gafuri; used for entity facts only. It dual-dates his birth 20 July [O.S. 8 July] 1880 at Zilim-Karanovo in Ufa Governorate, gives his death on 28 October 1934 at Ufa and his resting place in the Lenin Garden there, his upbringing in a Tatar-speaking teacher's family, his madrasa study at Troitsk, Kazan and Ufa, and the People's Poet of Bashkortostan title of 1923; it names no religion or school for him."
