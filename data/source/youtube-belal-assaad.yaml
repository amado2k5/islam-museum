reliability_note: "The person's own channel: a primary source for identity, work and reach, not independent corroboration (founder's sourcing ladder, 24 Oct 2026). Its About text reads: 'Official YouTube channel of Sheikh Belal Assaad. He has been in the field of Da'wah delivering regular khutbas and an international public speaker on topics of religion, mental health and socio-cultural dynamics, with a focus on youth for over 27 years.' Channel analytics mirrors give about 493,000 subscribers and 294 videos in October 2026 and a channel start of 5 April 2023; platform figures change constantly. His official podcast pages carry his own biography and link this channel: a degree in Shari'ah and Da'wah from the Ad-Da'wah Wal-Irshad University Institute, Tripoli, Lebanon (1995); studies in biomedical science at Victoria University, a postgraduate degree in teaching science and student welfare there, and a postgraduate degree in migration law and practice from the Australian National University; registered Minister of Religion (title: Imam) and marriage celebrant with the Australian Federation of Islamic Councils; born in Melbourne and resident there. Checked 26 October 2026."
