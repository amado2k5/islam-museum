summary:
  en: "Volume 4 of al-Nuwayri's encyclopaedia of adab, as a scan on archive.org (item nefa04). Its humour chapter, under the second art, third section, third chapter, gathers the jokes and rare anecdotes of jesters, fools, judges, grammarians, singers and others. Read so far: the chapter's contents list and the section on Ash'ab."
  ar: "الجزء الرابع من موسوعة النويري في الأدب، نسخة ممسوحة على الأرشيف ⁦(المعرّف nefa04)⁩. يجمع باب المجون والنوادر فيه طرائف الظرفاء والمغفلين والقضاة والنحاة والمغنين وغيرهم. قُرئ حتى الآن فهرس الباب وقسم أشعب."
  es: "Volumen 4 de la enciclopedia de adab de al-Nuwayri, escaneado en archive.org (elemento nefa04). Su capítulo sobre humor, en el segundo arte, tercera sección, tercer capítulo, recopila chistes y anécdotas insólitas de bufones, tontos, jueces, gramáticos, cantantes y otros. Hasta el momento: índice del capítulo y sección sobre Ash'ab."
  fr: "Le volume 4 de l'encyclopédie d'adab d'al-Nuwayri, numérisé et disponible sur archive.org (référence nefa04), contient un chapitre consacré à l'humour, dans la section 3, chapitre 2, qui rassemble des plaisanteries et des anecdotes rares de bouffons, fous, juges, grammairiens, chanteurs et autres. Lectures effectuées: la table des matières du chapitre et la section sur Ash'ab."
  ur: "النویری کے انسائیکلوپیڈیا آف ادب کا جلد 4، بطور اسکین آرکائیو ڈاٹ آرگ ⁦(آئٹم nefa04)⁩۔ اس کا مزاحیہ باب، دوسرے آرٹ کے تحت، تیسرا حصہ، تیسرا باب، مذاق کرنے والوں، احمقوں، ججوں، گرامر، گلوکاروں اور دیگر لوگوں کے لطیفے اور نایاب کہانیوں کو جمع کرتا ہے۔ اب تک پڑھیں: باب کے مندرجات کی فہرست اور اشعاب کا حصہ۔"
  tr: "Al-Nuwayri'nin Edebiyat Ansiklopedisi'nin dördüncü bölümü, arşivde taranmış bir kopya (tanımlayıcı nefa04). Sefahat ve anekdotlar üzerine bölüm, esprili ve aptalca şakaları, yargıçları, dilbilgicilerini, şarkıcıları ve diğerlerini bir araya getiriyor. Şimdiye kadar bölümün dizini ve Ash'ab bölümü okundu."
  id: "Bagian keempat dari Ensiklopedia Sastra Al-Nuwayri, salinan hasil scan di arsip (identifier nefa04). Bab tentang kebejatan dan anekdot mengumpulkan lelucon lucu dan bodoh, hakim, ahli tata bahasa, penyanyi, dan lainnya. Sejauh ini, indeks bab dan bagian Ash'ab telah dibaca."
