reliability_note: "Read in full. The lead calls him a jurist, traditionist, exegete, theologian and philosopher, 'Shi'i Imami' — the second of the two independent prose attestations behind the shia-twelver settlement. Its text gives his birth at Kashan on 14 Safar 1007 and his death there on 22 Rabi' II 1091, buried in the cemetery he himself had bought and endowed, and it names Qadi Sa'id al-Qummi among his students, confirming from this side the student_of edge the Qummi record already carries. Its infobox contradicts its own text (24 Safar 1007; Qom as the birthplace) and was not followed. It puts his works at close to 200 against the English article's documented count of 122; both counts are preserved in the prose. Its controversy notices (wahdat al-wujud, the eternity of hell, the permissibility of ghina', the obligation of Friday prayer, his Akhbari method) are reflected in the prose."
