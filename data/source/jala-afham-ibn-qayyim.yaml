  ur: "ابن قیم الجوزیہ کی کتاب نبی پر درود بھیجنے پر۔ اس کا افتتاحی حصہ خدا کے ننانوے خوبصورت ترین ناموں کی حدیث کو منتقل کرتا ہے اور اس پر تبصرہ کرتا ہے۔ Apple Vision OCR کے ذریعے کاشت کی گئی۔"
  tr: "İbn el-Kayyim'in Peygamber'e bereket gönderme üzerine kitabı ve başında doksan dokuz Güzel İsmin hadisi ve açıklaması yer alır; Apple Vision görselleriyle elde edilen kitaplardan alınmıştır."
  id: "Buku Ibn al-Qayyim tentang mengirimkan berkat kepada Nabi, dan di pembukaannya terdapat hadits sembilan puluh sembilan Nama Indah beserta penjelasannya; dari buku-buku yang diperoleh dengan gambar Apple Vision."
