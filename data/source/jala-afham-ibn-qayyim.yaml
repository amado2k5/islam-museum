  en: "Ibn Qayyim al-Jawziyya's book on invoking blessings on the Prophet; its opening section transmits and comments on the hadith of the ninety-nine most beautiful names of God. Harvested via Apple Vision OCR."
  es: "El libro de Ibn Qayyim al-Jawziyya sobre la invocación de bendiciones al Profeta; su sección inicial transmite y comenta el hadiz de los noventa y nueve nombres más bellos de Dios. Extraído mediante Apple Vision OCR."
