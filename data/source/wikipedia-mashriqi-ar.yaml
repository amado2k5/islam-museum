summary:
  ar: "مقالة ويكيبيديا العربية عن عناية الله المشرقي (1888–1963)؛ تُستخدم لوقائع الكيان فقط. تصفه بأنه رياضياتي وباحث مسلم هندي، مؤسس حركة الخاكسار، وتذكر ولادته في أمريتسار في 25 أغسطس 1888 ووفاته في 27 أغسطس 1963 ودراسته."
  en: "Arabic Wikipedia article on Inayatullah Khan Mashriqi (1888–1963); used for entity facts only. It describes him as an Indian Muslim mathematician and scholar, founder of the Khaksar movement, and gives his birth at Amritsar on 25 August 1888, his death on 27 August 1963, and his education."
  es: "Artículo en árabe de la Wikipedia sobre Inayatullah Khan Mashriqi (1888-1963); utilizado únicamente para datos biográficos. Lo describe como un matemático y erudito musulmán indio, fundador del movimiento Khaksar, y menciona su nacimiento en Amritsar el 25 de agosto de 1888, su fallecimiento el 27 de agosto de 1963 y su formación académica."
  fr: "Article de Wikipédia en arabe sur Inayatullah Khan Mashriqi (1888-1963); utilisé uniquement pour les informations factuelles. Il le décrit comme un mathématicien et érudit musulman indien, fondateur du mouvement Khaksar, et indique sa naissance à Amritsar le 25 août 1888, sa mort le 27 août 1963, ainsi que son parcours scolaire."
  ur: "عنایت اللہ خان مشرقی (1888-1963) پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں انہیں ایک ہندوستانی مسلمان ریاضی دان اور عالم، خاکسار تحریک کے بانی کے طور پر بیان کیا گیا ہے، اور 25 اگست 1888 کو امرتسر میں ان کی پیدائش، 27 اگست 1963 کو ان کی موت، اور ان کی تعلیم۔"
  tr: "İnayatullah El-Meşriqi (1888–1963) hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Hintli bir Müslüman matematikçi ve araştırmacı, Khaksar hareketinin kurucusu olarak tanımlanır ve 25 Ağustos 1888'de Amritsar'da doğduğunu, 27 Ağustos 1963'teki ölümünü ve çalışmalarını anlatır."
  id: "Artikel Wikipedia bahasa Arab tentang Inayatullah Al-Mashriqi (1888–1963); digunakan hanya untuk fakta entitas tersebut. Ia digambarkan sebagai matematikawan dan peneliti Muslim India, pendiri gerakan Khaksar, dan menyebutkan kelahirannya di Amritsar pada 25 Agustus 1888, kematiannya pada 27 Agustus 1963, serta studinya."
