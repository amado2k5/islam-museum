reliability_note: "Contemporary Malaysian newspaper reporting, read in full in a faithful press-archive republication because the original Malay Mail page could not be opened from this session. Its facts used here are the subject's own statements to the paper (founding MRM in 2010; the December 2014 peninsula-wide tract distribution; his estimate of 15,000–20,000 reached) and are attributed to him; the founding is independently consistent with the NECF Malaysia statement of 9 February 2015 ('Multi-racial Reverted Muslims founded in 2010 by Firdaus Wong Wai Hung'), which quotes the same figures. Registered because the MRM founding date and the 2014 campaign appear in no other source this writer could open."
