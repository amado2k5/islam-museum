summary:
  ar: "تقرير صحيفة Malay Mail في 24 يناير 2015 بقلم بو سو لين عن الدعوة الميدانية في ماليزيا؛ فيه أن فردوس وونغ أسس منظمة «مسلمون عائدون متعددو الأعراق» (MRM) سنة 2010 وأن نحو ألف متطوع وزعوا المنشورات في ديسمبر 2014 وقدّر هو الواصلين بما بين 15 و20 ألف شخص."
  en: "Malay Mail report of 24 January 2015 by Boo Su-Lyn on street dawah in Malaysia; it records that Firdaus Wong founded Multiracial Reverted Muslims (MRM) in 2010 and that some thousand volunteers distributed tracts in December 2014, with his estimate of 15,000 to 20,000 people reached."
title: "With pamphlets, Muslim missionaries reach out to 'enemies of Islam'"
