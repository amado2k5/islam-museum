summary:
  ar: "مقالة ويكيبيديا العربية عن خالد بن علي بن عبد الله الحميدان ⁦(وُلد في حائل عام 1374هـ)⁩، رئيس الاستخبارات العامة السعودية بمرتبة وزير منذ 29 كانون الثاني 2015؛ تذكر أسرته في عنيزة والتحاقه بكلية الملك فهد الأمنية سنة 1402هـ ودراسته في ميشيغان ونائبيته لمدير عام المباحث العامة."
  en: "Arabic Wikipedia article on Khalid bin Ali bin Abdullah Al Humaidan (born in Ha'il in 1374 AH), president of Saudi General Intelligence with ministerial rank since 29 January 2015; it records his family's origin in Unaizah, his entry into King Fahd Security College in 1402 AH, his studies in Michigan and his deputy headship of the General Investigations Directorate."
  es: "Artículo en árabe de la Wikipedia sobre Khalid bin Ali bin Abdullah Al Humaidan (nacido en Ha'il en 1374 AH), presidente de la Inteligencia General Saudí con rango ministerial desde el 29 de enero de 2015; en él se recoge el origen de su familia en Unaizah, su ingreso en la Escuela Superior de Seguridad Rey Fahd en 1402 AH, sus estudios en Michigan y su cargo como subdirector de la Dirección General de Investigaciones."
  fr: "Article de Wikipédia en arabe sur Khalid bin Ali bin Abdullah Al Humaidan (né à Ha'il en 1374 AH), président du renseignement général saoudien avec rang ministériel depuis le 29 janvier 2015; il relate l'origine de sa famille à Unaizah, son entrée au King Fahd Security College en 1402 AH, ses études dans le Michigan et son poste de directeur adjoint de la Direction générale des enquêtes."
