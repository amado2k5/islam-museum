summary:
  ar: "مدخل موسوعة إيرانيكا «ستار خان» بقلم أنيا بيستور-هاتم؛ يُستخدم لوقائع الكيان. يعطي ميلاده في قرية جنالي بأذربيجان سنة 1868 ووفاته في طهران في 9 نوفمبر 1914، ويروي حجّه إلى العتبات في 1894-95 ودفاعه عن الزوار الشيعة في سامراء ولقاءه ميرزا حسن الشيرازي، وقيادته دفاع تبريز ومنحه لقب «سردار ملي»."
  en: "Encyclopaedia Iranica entry 'SATTAR KHAN' by Anja Pistor-Hatam; used for entity facts. It gives his birth at Janali village, Azerbaijan, in 1868 and his death at Tehran on 9 November 1914, and recounts his 1894-95 pilgrimage to the Atabat, his defence of the Shi'ite pilgrims at Samarra and meeting with Mirza Hasan Shirazi, his leadership of the defence of Tabriz, and the award of the title Sardar-e Melli."
  es: "Entrada de la Enciclopedia Iranica 'SATTAR KHAN' de Anja Pistor-Hatam; utilizada para datos sobre la persona. Indica su nacimiento en la aldea de Janali, Azerbaiyán, en 1868 y su muerte en Teherán el 9 de noviembre de 1914, y relata su peregrinación a Atabat en 1894-95, su defensa de los peregrinos chiítas en Samarra y su encuentro con Mirza Hasan Shirazi, su liderazgo en la defensa de Tabriz y la concesión del título de Sardar-e Melli."
  fr: "L'article « SATTAR KHAN » de l'Encyclopaedia Iranica, rédigé par Anja Pistor-Hatam, est utilisé pour les informations biographiques. Il indique sa naissance au village de Janali, en Azerbaïdjan, en 1868 et sa mort à Téhéran le 9 novembre 1914. L'article relate également son pèlerinage à Atabat en 1894-1895, sa défense des pèlerins chiites à Samarra et sa rencontre avec Mirza Hasan Shirazi, son rôle dans la défense de Tabriz et l'obtention du titre de Sardar-e Melli."
  ur: "انسائیکلو پیڈیا ایرانیکا اندراج 'ستار خان' از انجا پستور حاتم؛ ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1868 میں جنالی گاؤں، آذربائیجان میں ان کی پیدائش اور 9 نومبر 1914 کو تہران میں ان کی موت کا ذکر کرتا ہے، اور 1894-95 میں اتبات کی زیارت، سامرا میں ان کی شیعہ زائرین کے دفاع اور مرزا حسن شیرازی سے ملاقات کا ذکر کرتا ہے، ان کی قیادت اور طبری کے اعزاز کا دفاع۔"
