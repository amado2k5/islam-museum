reliability_note: "Scholarly encyclopedia entry by Anja Pistor-Hatam, read on 26 October 2026; with the English Wikipedia article, one of the record's two text sources for Sattar Khan, and the anchor for his recorded dates (born 1868; died 9 November 1914) against the English article's infobox readings. It names no school for him; it records his pilgrimage to the holy shrines in Iraq in 1894-95, his anger at the treatment of 'the Shi'ite pilgrims' at Samarra, and his meeting with the marja' Mirza Hasan Shirazi — practice and context, not an attestation of school, and the record treats it as such."
