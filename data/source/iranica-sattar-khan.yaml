summary:
  ar: "مدخل موسوعة إيرانيكا «ستار خان» بقلم أنيا بيستور-هاتم؛ يُستخدم لوقائع الكيان. يعطي ميلاده في قرية جنالي بأذربيجان سنة 1868 ووفاته في طهران في 9 نوفمبر 1914، ويروي حجّه إلى العتبات في 1894-95 ودفاعه عن الزوار الشيعة في سامراء ولقاءه ميرزا حسن الشيرازي، وقيادته دفاع تبريز ومنحه لقب «سردار ملي»."
  en: "Encyclopaedia Iranica entry 'SATTAR KHAN' by Anja Pistor-Hatam; used for entity facts. It gives his birth at Janali village, Azerbaijan, in 1868 and his death at Tehran on 9 November 1914, and recounts his 1894-95 pilgrimage to the Atabat, his defence of the Shi'ite pilgrims at Samarra and meeting with Mirza Hasan Shirazi, his leadership of the defence of Tabriz, and the award of the title Sardar-e Melli."
