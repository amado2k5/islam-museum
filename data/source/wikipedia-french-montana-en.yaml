reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and its content checked against the recorded revision. It gives Karim Kharbouch, born 9 November 1984 in Casablanca, Morocco; his immigration to New York at 13; the Cocaine City DVD series; the 2012 Bad Boy / Maybach Music / Interscope signing; Excuse My French (2013); the diamond-certified \"Unforgettable\" (2017) and Jungle Rules (2017); and his Uganda health philanthropy. Its personal-life section states: \"He is a practicing Sunni Muslim\", citing an artist-biography page (TheVogue, which returned only a page shell when fetched on 26 October 2026, so its exact wording could not be verified), a Vibe report of 21 April 2023 on his Arab-American heritage and Ramadan observance — checked directly: it speaks of his identifying as a Muslim, of Islamic values, of fasting and reading the Qur’an in Ramadan, and names no school — and a Power 105.1 piece of 23 September 2019 on his \"Muslim roots\" on an album cover. The word \"Sunni\" thus rests on the article’s own wording; none of the verifiable cited pieces names a school for him."
