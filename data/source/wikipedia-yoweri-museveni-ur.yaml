summary:
  ar: "مقالة ويكيبيديا الأردية عن يوويري موسيفيني؛ تُستخدم لوقائع الكيان فقط. مقالة شديدة الإيجاز تذكر أنه سياسي أوغندي ورئيس أوغندا منذ 1986. تصنيفاتها تضعه في «أنجليكان أوغنديون» — تصنيف ملفي لا نص فيه."
  en: "Urdu Wikipedia article on Yoweri Museveni; used for entity facts only. A very short stub stating that he is a Ugandan politician and president of Uganda since 1986. Its categories file him under Ugandan Anglicans — a category filing, not a text statement."
  es: "Artículo de Wikipedia en urdu sobre Yoweri Museveni; utilizado únicamente para datos sobre la persona. Breve descripción que indica que es un político ugandés y presidente de Uganda desde 1986. Sus categorías lo clasifican dentro de los anglicanos ugandeses (una clasificación, no una declaración textual)."
  fr: "Article de Wikipédia en ourdou sur Yoweri Museveni; utilisé uniquement pour des informations factuelles. Ce bref résumé indique qu'il est un homme politique ougandais et président de l'Ouganda depuis 1986. Il est catégorisé comme appartenant à la communauté anglicane ougandaise – une catégorisation, et non une description textuelle."
  ur: "اردو ویکیپیڈیا مضمون یووری موسیوینی پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ ایک بہت ہی مختصر اسٹب جس میں کہا گیا ہے کہ وہ 1986 سے یوگنڈا کے سیاست دان اور یوگنڈا کے صدر ہیں۔ اس کے زمرے اسے یوگنڈا اینگلیکنز کے تحت فائل کرتے ہیں - ایک زمرہ فائلنگ، ٹیکسٹ اسٹیٹمنٹ نہیں۔"
  tr: "Yoweri Museveni hakkında Urduca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Çok özlü bir makale, onun 1986'dan beri Uganda Cumhurbaşkanı ve Uganda'nın bir politikacı olduğunu belirtir. Kategorileri onu metin içermeyen 'Uganda Anglikanları' adlı dosya sınıflandırmasına yerleştirir."
  id: "Artikel Wikipedia Urdu tentang Yoweri Museveni; digunakan hanya untuk fakta entitas. Artikel yang sangat ringkas menyebutkan bahwa ia adalah politisi Uganda dan Presiden Uganda sejak 1986. Kategorinya menempatkannya dalam 'Anglikan Uganda' — klasifikasi berkas tanpa teks."
