summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أسيسات أوشوالا؛ تُستخدم لوقائع الكيان فقط. توثّق ولادتها في إيكورودو في 9 أكتوبر 1994، ومسيرتها من ليفربول وأرسنال إلى برشلونة وباي إف سي والهلال، وألقابها الأفريقية الستة وأوّلياتها الأوروبية، وتذكر في جملة واحدة أنها مسلمة دون تسمية أي مذهب لها."
  en: "English Wikipedia article on Asisat Oshoala; used for entity facts only. It records her birth in Ikorodu on 9 October 1994, her career from Liverpool and Arsenal to Barcelona, Bay FC and Al Hilal, her six African Women's Footballer of the Year awards and her European firsts, and states in one sentence that she is a Muslim, naming no school for her."
  es: "Artículo de la Wikipedia en inglés sobre Asisat Oshoala; utilizado únicamente para datos sobre la persona. Registra su nacimiento en Ikorodu el 9 de octubre de 1994, su carrera desde el Liverpool y el Arsenal hasta el Barcelona, el Bay FC y el Al Hilal, sus seis premios a la Futbolista Africana del Año y sus logros europeos, y afirma en una sola frase que es musulmana, sin mencionar ninguna escuela a la que haya asistido."
  fr: "L'article de Wikipédia en anglais consacré à Asisat Oshoala, utilisé uniquement pour ses informations personnelles, mentionne sa naissance à Ikorodu le 9 octobre 1994, sa carrière de Liverpool et Arsenal à Barcelone, Bay FC et Al Hilal, ses six titres de Joueuse africaine de l'année et ses premières européennes. Il indique en une phrase qu'elle est musulmane, sans préciser son école."
  ur: "Asisat Oshoala پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 9 اکتوبر 1994 کو آئیکوروڈو میں اس کی پیدائش، لیورپول اور آرسنل سے بارسلونا، بے ایف سی اور الہلال تک اس کا کیریئر، اس کے چھ افریقی ویمنز فٹبالر آف دی ایئر ایوارڈز اور اس کے یورپی اولڈز، اور ایک جملے میں بیان کیا گیا ہے کہ وہ ایک مسلمان ہے، اس کے لیے کسی اسکول کا نام نہیں رکھا۔"
  tr: "Assessat Oswala hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 9 Ekim 1994'te Ikorodo'daki doğumunu, Liverpool ve Arsenal'den Barselona, BFC ve Al Hilal'a yolculuğunu, altı Afrika unvanını ve Avrupa'daki ilk çıkışlarını belgelemiş, tek cümlede Müslüman olduğunu belirterek hiçbir mezhep belirtmemiştir."
  id: "Artikel Wikipedia bahasa Inggris tentang Assessat Oswala; hanya digunakan untuk fakta-fakta entitas. Artikel ini mendokumentasikan kelahirannya di Ikorodo pada 9 Oktober 1994, perjalanannya dari Liverpool dan Arsenal ke Barcelona, BFC, dan Al Hilal, enam gelar Afrika-nya, serta debut Eropa-nya, menyatakan dalam satu kalimat bahwa dia Muslim tanpa menyebutkan sekte manapun."
