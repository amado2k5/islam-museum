  ar: "مقالة ويكيبيديا الإنجليزية عن أسيسات أوشوالا؛ تُستخدم لوقائع الكيان فقط. توثّق ولادتها في إيكورودو في 9 أكتوبر 1994، ومسيرتها من ليفربول وأرسنال إلى برشلونة وباي إف سي والهلال، وألقابها الأفريقية الستة وأوّلياتها الأوروبية، وتذكر في جملة واحدة أنها مسلمة دون تسمية أي مذهب لها."
  en: "English Wikipedia article on Asisat Oshoala; used for entity facts only. It records her birth in Ikorodu on 9 October 1994, her career from Liverpool and Arsenal to Barcelona, Bay FC and Al Hilal, her six African Women's Footballer of the Year awards and her European firsts, and states in one sentence that she is a Muslim, naming no school for her."
