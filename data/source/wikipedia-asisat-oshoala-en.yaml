reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. Its infobox gives Asisat Lamina Oshoala, born 9 October 1994 in Ikorodu, Nigeria, a forward now with Al Hilal; its lead records the record six African Women's Footballer of the Year awards, the 2019 first African goal in a Women's Champions League final and the 2021 first African woman to win the competition. Its early-life section says her parents were not supportive when she dropped out of school for football, and states 'Oshoala is a Muslim' — a generic identity with no school named anywhere in the article, which is why her person record's faith segment is unknown."
