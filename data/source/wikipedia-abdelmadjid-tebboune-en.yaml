summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد المجيد تبون؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 17 نوفمبر 1945 في المشرية، ورئاسته للجزائر منذ 19 ديسمبر 2019 بعد الرئيس المؤقت عبد القادر بن صالح، ورئاسته للحكومة بين مايو وأغسطس 2017 ووزارته للإسكان."
  en: "English Wikipedia article on Abdelmadjid Tebboune; used for entity facts only. It gives his birth on 17 November 1945 at Mécheria, his presidency of Algeria from 19 December 2019 after the acting president Abdelkader Bensalah, his premiership of May to August 2017 and his housing ministries."
  es: "Artículo de la Wikipedia en inglés sobre Abdelmadjid Tebboune; utilizado únicamente para datos sobre la persona. Indica su fecha de nacimiento, el 17 de noviembre de 1945 en Mécheria, su presidencia de Argelia desde el 19 de diciembre de 2019 tras el presidente interino Abdelkader Bensalah, su mandato como primer ministro de mayo a agosto de 2017 y sus ministerios de vivienda."
  fr: "Article de Wikipédia en anglais sur Abdelmadjid Tebboune; utilisé uniquement pour les informations relatives à l’entité. Il indique sa naissance le 17 novembre 1945 à Mécheria, sa présidence de l’Algérie à partir du 19 décembre 2019 après le président par intérim Abdelkader Bensalah, son poste de Premier ministre de mai à août 2017 et ses ministères du Logement."
  ur: "عبدالمجید ٹیبوون پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ان کی پیدائش 17 نومبر 1945 کو میکیریا میں ہوئی، جو 19 دسمبر 2019 سے الجزائر کی ان کی صدارت، قائم مقام صدر عبدالقادر بن صلاح، مئی سے اگست 2017 تک ان کی وزارت عظمیٰ اور ان کی ہاؤسنگ وزارتوں کے بعد۔"
  tr: "Abdelmadjid Tebboune hakkında İngilizce Wikipedia makalesi; yalnızca kurumun gerçekleri için kullanılmıştır. 17 Kasım 1945'te M'Ishria'da doğdu ve geçici Cumhurbaşkanı Abdelkader Bensalah'dan sonra 19 Aralık 2019'dan beri Cezayir cumhurbaşkanı olarak görev yapmış ve Mayıs-Ağustos 2017 arasında Konut Bakanı olarak başbakanlık yapmıştır."
  id: "Artikel Wikipedia bahasa Inggris tentang Abdelmadjid Tebboune; digunakan hanya untuk fakta entitas. Ia lahir pada 17 November 1945 di M'Ishria, dan telah menjabat sebagai presiden Aljazair sejak 19 Desember 2019, setelah Presiden sementara Abdelkader Bensalah, serta menjabat sebagai perdana menteri antara Mei dan Agustus 2017 sebagai Menteri Perumahan."
