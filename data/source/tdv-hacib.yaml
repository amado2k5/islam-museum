summary:
  ar: "مدخل «حاجب» في موسوعة TDV الإسلامية التركية، ويتناول أصل الحجابة في الدولة الساسانية، وحجابة صدر الإسلام والدولة الأموية والعباسية، ثم الحجابة في الأندلس الأموية والدول المتفرعة عنها والفاطمية والسامانية والغزنوية والسلجوقية والقراخانية والخوارزمية والمملوكية والمغرب والهند."
  en: "The TDV İslâm Ansiklopedisi entry 'Hâcib' (chamberlain). It covers the office's possible Sasanian origin, its early and Umayyad forms, the Abbasid chamberlains and their rivalry with the vizier, the Andalusian Umayyads and their successors, the Fatimids, Samanids, Ghaznavids, Seljuks, Karakhanids, Khwarazmshahs, Mamluks, the Maghrib and the Indian states. The entry is by Aydın Taneri."
