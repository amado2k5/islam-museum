reliability_note: "Read in full in the web edition on 2 November 2026. The entry's bibliography was not read for this record. Facts are rewritten in the museum's own words and cited by the article's printed page range, which the web edition gives for the whole entry. The Ottoman hajib, the modern successors and the Umayyad founder are not covered by this entry."
