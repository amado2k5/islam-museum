reliability_note: "A standard scholarly history resting on the Persian court sources, independent of Banglapedia and of Wikipedia. Page 216, read in full on 1 November 2026, opens the Mir Jumla passage: 'Muhammad Said, known to history as Mir Jumla, was a Syed of Ardstan in Persia... Leaving his native country in youth, he like other Shiah adventurers, sought his fortune at the Courts of the Deccani Sultans who belonged to his sect, (1630).' That sentence is one of the two independent texts on which Mir Jumla II's shia-twelver settlement rests; the passage's own footnote grounds the account in Tavernier, Bernier, Gribble and the Maasir-ul-Umara life of Mir Jumla. Not to be confused with Jagadish Narayan Sarkar, the editor of The Life of Mir Jumla (2nd ed., 1979) cited in the English article's infobox — a different author."
