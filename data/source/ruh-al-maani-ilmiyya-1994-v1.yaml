summary:
  ar: "المجلد الأول ⁦(الجزءان 1–2، من أول الفاتحة إلى الآية 252 من البقرة)⁩ من طبعة دار الكتب العلمية لروح المعاني، ضبطه وصححه علي عبد الباري عطية، الطبعة الأولى 1415هـ/1994م؛ وفي أوله خطبة المفسر التي يذكر فيها سبب التأليف وتاريخ الشروع فيه وتسمية الكتاب."
  en: "Volume 1 (parts 1–2, from the start of al-Fatiha to al-Baqara 252) of Dar al-Kutub al-Ilmiyya's printing of Ruh al-Ma'ani, edited by Ali Abd al-Bari Atiyya, 1st edition 1415 AH / 1994; it opens with the author's preface giving the reason for writing, the date he began and how the book was named."
  ur: "دار الکتب العلمیہ کے روح المعانی ایڈیشن کی پہلی جلد ⁦(اجزا 1–2، سورۂ فاتحہ کے آغاز سے سورۂ بقرہ کی آیت 252 تک)⁩، تصحیح علی عبد الباری عطیہ، پہلا ایڈیشن 1415ھ / 1994ء؛ اس کے آغاز میں مفسر کا خطبہ ہے جس میں سببِ تالیف، آغاز کی تاریخ اور کتاب کا نام رکھنے کا ذکر ہے۔"
