summary:
  ar: "عنصر ويكي بيانات Q5221979 لدارا خسروشاهي، ثُبّت عبر خصائص صفحة المقالة الإنجليزية؛ يُستخدم لوقائع الكيان فقط. يعطي ولادته 28 مايو 1969 في طهران وجنسيتيه الإيرانية والأمريكية، ولا يحمل أي قيمة للدين."
  en: "Wikidata item Q5221979 for Dara Khosrowshahi, grounded through the English article's pageprops; used for entity facts only. It gives his birth as 28 May 1969 at Tehran and his citizenships as Iran and the United States, and carries no religion value at all."
  es: "El elemento de Wikidata Q5221979 para Dara Khosrowshahi, basado en los atributos de página del artículo en inglés, se utiliza únicamente para datos sobre la entidad. Indica que nació el 28 de mayo de 1969 en Teherán y que tiene ciudadanía iraní y estadounidense, sin aportar ninguna información religiosa."
  fr: "L'élément Wikidata Q5221979 concernant Dara Khosrowshahi, basé sur les propriétés de la page de l'article en anglais, est utilisé uniquement pour les informations relatives à l'entité. Il indique sa date de naissance (28 mai 1969) à Téhéran, sa double nationalité iranienne et américaine, et ne mentionne aucune religion."
  ur: "وکی ڈیٹا آئٹم Q5221979 دارا خسروشاہی کے لیے، انگریزی مضمون کے صفحہ پراپس کے ذریعے۔ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 28 مئی 1969 کو تہران میں اس کی پیدائش اور ایران اور امریکہ کے طور پر اس کی شہریت رکھتا ہے، اور اس میں مذہب کی کوئی اہمیت نہیں ہے۔"
  tr: "Dara Khosrowshahi tarafından İngilizce makale sayfası properties aracılığıyla kurulan bir Wikidata öğesi Q5221979; yalnızca varlığın gerçekleri için kullanılmıştır. Doğum tarihini 28 Mayıs 1969'da Tahran'da vermiştir, hem İran hem de Amerikan vatandaşlığına sahiptir ve dini bir önemi yoktur."
  id: "Elemen Wikidata Q5221979 oleh Dara Khosrowshahi, didirikan melalui properti halaman artikel berbahasa Inggris; digunakan hanya untuk fakta entitas. Ia mencantumkan tanggal lahirnya pada 28 Mei 1969 di Teheran, dan memiliki kewarganegaraan Iran serta Amerika, serta tidak memiliki makna religius."
