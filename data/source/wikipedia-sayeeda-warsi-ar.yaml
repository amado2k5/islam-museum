  ar: "مقالة ويكيبيديا العربية عن سعيدة وارسي: محامية وسياسية بريطانية من أصل باكستاني، وُلدت في 28 آذار 1971. كانت أول مسلم يخدم في مجلس الوزراء البريطاني، واستقالت من الحكومة في 5 آب 2014 واصفة سياستها تجاه غزة بأنها لا يمكن الدفاع عنها أخلاقيًا."
  en: "Arabic Wikipedia article on Sayeeda Warsi, the British lawyer and politician of Pakistani origin born on 28 March 1971. She was the first Muslim to serve in the British Cabinet and resigned from the government on 5 August 2014, calling its Gaza policy morally indefensible."
