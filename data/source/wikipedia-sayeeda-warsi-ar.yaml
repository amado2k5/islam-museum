summary:
  ar: "مقالة ويكيبيديا العربية عن سعيدة وارسي: محامية وسياسية بريطانية من أصل باكستاني، وُلدت في 28 آذار 1971. كانت أول مسلم يخدم في مجلس الوزراء البريطاني، واستقالت من الحكومة في 5 آب 2014 واصفة سياستها تجاه غزة بأنها لا يمكن الدفاع عنها أخلاقيًا."
  en: "Arabic Wikipedia article on Sayeeda Warsi, the British lawyer and politician of Pakistani origin born on 28 March 1971. She was the first Muslim to serve in the British Cabinet and resigned from the government on 5 August 2014, calling its Gaza policy morally indefensible."
  es: "Artículo en árabe de la Wikipedia sobre Sayeeda Warsi, la abogada y política británica de origen pakistaní nacida el 28 de marzo de 1971. Fue la primera musulmana en formar parte del Gabinete británico y dimitió del gobierno el 5 de agosto de 2014, calificando su política respecto a Gaza de moralmente indefendible."
  fr: "Article de Wikipédia en arabe sur Sayeeda Warsi, avocate et femme politique britannique d'origine pakistanaise née le 28 mars 1971. Elle fut la première musulmane à siéger au sein du cabinet britannique et démissionna du gouvernement le 5 août 2014, qualifiant sa politique à Gaza d'indéfendable sur le plan moral."
