summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سفيان أمرابط؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في هاوزن لأبوين من أصل مغربي ريفي، ومسيرته من أوترخت وفينورد وكلوب بروج وهيلاس فيرونا وفيورنتينا إلى مانشستر يونايتد وفنربخشة وأياكس، ودولياته مع المغرب في ثلاث كؤوس عالم ولقب كأس أمم أفريقيا 2025."
  en: "English Wikipedia article on Sofyan Amrabat; used for entity facts only. It recounts his upbringing in Huizen to parents of Moroccan-Riffian descent, his career from Utrecht, Feyenoord, Club Brugge, Hellas Verona and Fiorentina to Manchester United, Fenerbahçe and Ajax, and his Morocco career at three World Cups and the 2025 Africa Cup of Nations title."
  es: "Artículo de la Wikipedia en inglés sobre Sofyan Amrabat; utilizado únicamente para obtener información sobre la persona. Narra su infancia en Huizen, con padres de ascendencia marroquí-rifeña, su trayectoria profesional desde el Utrecht, Feyenoord, Club Brugge, Hellas Verona y Fiorentina hasta el Manchester United, Fenerbahçe y Ajax, y su participación con la selección de Marruecos en tres Mundiales y la Copa Africana de Naciones de 2025."
  fr: "Article Wikipédia en anglais sur Sofyan Amrabat; utilisé uniquement à des fins d'information sur l'entité. Il retrace son enfance à Huizen, au sein d'une famille d'origine marocaine et riffonne, sa carrière à Utrecht, Feyenoord, Club Brugge, Hellas Verona et Fiorentina, puis à Manchester United, Fenerbahçe et Ajax, ainsi que sa carrière internationale avec le Maroc, marquée par trois Coupes du monde et le titre de champion d'Afrique des Nations 2025."
  ur: "صوفیان امربت پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ہوزین میں اس کی پرورش مراکشی-رفیان نسل کے والدین سے، اس کا کیریئر یوٹریچٹ، فیینورڈ، کلب بروگ، ہیلس ویرونا اور فیورینٹینا سے مانچسٹر یونائیٹڈ، فینرباہی اور ایجیکس تک، اور تین ورلڈ کپ اور 2025 کے افریقہ ٹائٹل کپ میں اس کے مراکش کیریئر کا ذکر ہے۔"
