  ar: "مقالة ويكيبيديا الإنجليزية عن سفيان أمرابط؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في هاوزن لأبوين من أصل مغربي ريفي، ومسيرته من أوترخت وفينورد وكلوب بروج وهيلاس فيرونا وفيورنتينا إلى مانشستر يونايتد وفنربخشة وأياكس، ودولياته مع المغرب في ثلاث كؤوس عالم ولقب كأس أمم أفريقيا 2025."
  en: "English Wikipedia article on Sofyan Amrabat; used for entity facts only. It recounts his upbringing in Huizen to parents of Moroccan-Riffian descent, his career from Utrecht, Feyenoord, Club Brugge, Hellas Verona and Fiorentina to Manchester United, Fenerbahçe and Ajax, and his Morocco career at three World Cups and the 2025 Africa Cup of Nations title."
