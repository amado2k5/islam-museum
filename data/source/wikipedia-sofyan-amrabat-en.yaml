reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026; the reading route did not expose a revision id, so the consultation date is recorded in place of a revision. It gives Amrabat as born on 21 August 1996 in Huizen to parents of Moroccan-Riffian descent; a defensive midfielder who came through Utrecht, then Feyenoord, Club Brugge, Hellas Verona and Fiorentina, a loan at Manchester United (FA Cup winner 2024), Fenerbahçe, a loan at Real Betis, and Ajax from August 2026; a Morocco international since 2017, at the 2018, 2022 and 2026 World Cups and a winner of the 2025 Africa Cup of Nations. Its personal-life section makes no statement of his religion: it records only his parents' descent and that his elder brother is the footballer Nordin Amrabat."
