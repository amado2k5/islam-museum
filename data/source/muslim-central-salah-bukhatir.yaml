summary:
  ar: "سيرة صلاح بخاطر في قناة مسلم سنترال الصوتية كما تعرضها صفحة البودكاست على Listen Notes؛ تُستخدم لوقائع الكيان فقط لأنه لا توجد له مقالة ويكيبيديا ولا عنصر ويكيداتا. تصفه بأنه قارئ قرآن وداعية من الإمارات، إمام مسجد الشيخ سعود القاسمي، وقد أمّ المصلين في المسجد النبوي بالمدينة."
  en: "Muslim Central's podcast biography of Salah Bukhatir, as carried on its Listen Notes podcast page; used for entity facts only, as he has no Wikipedia article and no Wikidata item. It describes him as a Qur'an reciter and preacher native to the United Arab Emirates, imam of the Sheikh Saoud Al Qassimi Mosque, who has also led prayers at the Prophet's Mosque in Medina."
  es: "La biografía de Salah Bukhatir, publicada en el podcast de Muslim Central y disponible en su página de Listen Notes, se utiliza únicamente para obtener información sobre su persona, ya que no tiene artículo en Wikipedia ni entrada en Wikidata. En ella se le describe como un recitador del Corán y predicador originario de los Emiratos Árabes Unidos, imán de la Mezquita Sheikh Saoud Al Qassimi, quien también ha dirigido oraciones en la Mezquita del Profeta en Medina."
  fr: "La biographie de Salah Bukhatir par Muslim Central, disponible sur sa page « Listen Notes », est présentée ici à titre informatif uniquement, car il ne possède ni article Wikipédia ni fiche Wikidata. Elle le décrit comme un récitateur du Coran et prédicateur originaire des Émirats arabes unis, imam de la mosquée Cheikh Saoud Al Qassimi, et ayant également dirigé la prière à la mosquée du Prophète à Médine."
  ur: "مسلم سنٹرل کی صلاح بخاتیر کی پوڈ کاسٹ سوانح عمری، جیسا کہ اس کے سننے کے نوٹس کے پوڈ کاسٹ صفحہ پر ہے؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے، کیونکہ اس کے پاس کوئی ویکیپیڈیا مضمون نہیں ہے اور نہ ہی کوئی وکی ڈیٹا آئٹم ہے۔ اس میں اسے متحدہ عرب امارات کے رہنے والے ایک قرآنی قاری اور مبلغ کے طور پر بیان کیا گیا ہے، شیخ سعود القاسمی مسجد کے امام، جنہوں نے مدینہ میں مسجد نبوی میں نماز کی امامت بھی کی ہے۔"
