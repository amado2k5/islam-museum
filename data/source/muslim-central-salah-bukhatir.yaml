reliability_note: "Read in full on 26 October 2026. No Wikipedia article exists for him in English, Arabic, Urdu, Indonesian, Malay, Persian or Turkish, and no Wikidata item (title checks and a Wikidata search on 26 October 2026 all empty), so this biography is recorded on the consultation-date pattern: no revision id exists to cite. The text is Muslim Central's own channel biography, syndicated identically across podcast platforms (Castbox, Podbay, Listen Notes, iHeart); syndicated copies are one source family, not independent attestations. It states that he is native to the United Arab Emirates, a Qur'an reciter and preacher whose voice is compared to Sheikh Sudais, that he serves as imam at the Sheikh Saoud Al Qassimi Mosque, and that he has led prayers at the Prophet's Mosque in Medina. It gives no birth date and names no school, madhhab or creed for him. The channel's episode list carries his complete recorded recitation of the Qur'an, published from December 2013."
