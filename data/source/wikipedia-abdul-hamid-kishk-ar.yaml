reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026), read at revision 73636009 on 1 November 2026. The fuller biography: born at Shubrakhit (Beheira) on 13 Dhu al-Qa'da 1351 / 10 March 1933; the religious institute of Alexandria and the faculty of Usul al-Din at al-Azhar; teaching assistant there in 1957; imam of the al-Tahhan and Manufi mosques in al-Sharabiyya, then of the 'Ain al-Hayat mosque from 1962 for about twenty years; detained 1965 for two and a half years; arrested in the September 1981 decisions and released 1982; 108 books including the ten-volume Fi Rihab al-Tafsir; died 25 Rajab 1417 / 6 December 1996. Its infobox gives his school as Ahl al-Sunna wa-l-Jama'a. Recorded in docs/authenticity-ledger/pages/wikipedia-abdul-hamid-kishk-ar.yaml."
