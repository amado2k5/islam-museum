reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. A short article. It gives: born 5 February 1887 at Gjirokastra, died 26 May 1954; antifascist theorist in the Second World War; chairman of the 118-member Anti-Fascist Council of National Liberation elected at the Congress of Përmet in May 1944, and so de facto president of liberated Albania; foreign minister 1944–1946; chairman of the Presidium of the Constituent Assembly in 1946 and then, 1946–1953, first head of state of the People's Republic of Albania; represented Albania at a 1947 Allied consultation in Paris; succeeded by Haxhi Lleshi; '1954 beging er Suizid' (in 1954 he committed suicide). It states nothing about his religion."
