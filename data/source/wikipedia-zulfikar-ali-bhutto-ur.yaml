  ar: "مقالة ويكيبيديا الأردية عن ذو الفقار علي بوتو؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 5 يناير 1928 في لاركانا وإعدامه في 4 أبريل 1979، وتعليمه في بيركلي وأكسفورد، ووزاراته، وتأسيسه حزب الشعب سنة 1967 ورئاسته ورئاسته للوزراء. ولا يحمل صندوق معلوماتها حقل دين؛ وإنما تضعه في تصنيفات شيعية فقط."
  en: "Urdu Wikipedia article on Zulfikar Ali Bhutto; used for entity facts only. It gives his birth on 5 January 1928 at Larkana and execution on 4 April 1979, his education at Berkeley and Oxford, his ministries, his founding of the PPP in 1967 and his presidency and premiership. Its infobox carries no religion field; it files him in Shia categories only."
