summary:
  ar: "مقالة ويكيبيديا الأردية عن ذو الفقار علي بوتو؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 5 يناير 1928 في لاركانا وإعدامه في 4 أبريل 1979، وتعليمه في بيركلي وأكسفورد، ووزاراته، وتأسيسه حزب الشعب سنة 1967 ورئاسته ورئاسته للوزراء. ولا يحمل صندوق معلوماتها حقل دين؛ وإنما تضعه في تصنيفات شيعية فقط."
  en: "Urdu Wikipedia article on Zulfikar Ali Bhutto; used for entity facts only. It gives his birth on 5 January 1928 at Larkana and execution on 4 April 1979, his education at Berkeley and Oxford, his ministries, his founding of the PPP in 1967 and his presidency and premiership. Its infobox carries no religion field; it files him in Shia categories only."
  es: "Artículo de Wikipedia en urdu sobre Zulfikar Ali Bhutto; utilizado únicamente para datos biográficos. Indica su nacimiento el 5 de enero de 1928 en Larkana y su ejecución el 4 de abril de 1979, su educación en Berkeley y Oxford, sus ministerios, la fundación del PPP en 1967 y su presidencia y mandato como primer ministro. Su ficha informativa no incluye información sobre religión; lo clasifica únicamente dentro de la categoría chiíta."
  fr: "L'article de Wikipédia en ourdou consacré à Zulfikar Ali Bhutto, utilisé uniquement pour les informations le concernant, indique sa naissance le 5 janvier 1928 à Larkana, son exécution le 4 avril 1979, ses études à Berkeley et Oxford, ses ministères, la fondation du Parti du peuple pakistanais (PPP) en 1967, ainsi que sa présidence et son poste de Premier ministre. L'infobox ne comporte pas de champ relatif à la religion; il est classé uniquement dans la catégorie chiite."
