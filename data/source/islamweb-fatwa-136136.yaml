label:
  ar: "تعلم اللغة العربية من الدين ومعرفتها فرض واجب، فتوى إسلام ويب 136136"
  en: "Learning Arabic is part of religion and knowing it is an obligation, Islamweb fatwa 136136"
  ur: "عربی سیکھنا دین میں سے ہے اور اس کی معرفت فرض ہے، اسلام ویب فتویٰ 136136"
  fr: "Apprendre l'arabe fait partie de la religion et le connaître est une obligation, fatwa Islamweb 136136"
  es: "Aprender árabe es parte de la religión y conocerlo es una obligación, fatwa de Islamweb 136136"
summary:
  ar: "فتوى إسلام ويب رقم 136136، وهي بحسب الملخص البحثي تنقل قول عمر في تعلم العربية والفرائض عن اقتضاء الصراط المستقيم لابن تيمية (1/528). ذُكرت هذه الصفحة في ملخص بحثي قُدّم إلى المتحف وأجاز المؤسس استعماله في 21 نوفمبر 2026؛ ولم يفتح المتحف الصفحة نفسها."
  en: "Islamweb fatwa 136136, which, according to the research summary, quotes the saying of Umar on learning Arabic and the fara'id from Ibn Taymiyya's Iqtida' al-Sirat al-Mustaqim (1/528). The page was named in a research summary supplied to the museum and approved for use by the founder on 21 November 2026; the museum did not open it."
  ur: "اسلام ویب کا فتویٰ نمبر 136136، جو تحقیقی خلاصے کے مطابق عربی اور فرائض سیکھنے کے بارے میں عمر کا قول ابن تیمیہ کی اقتضاء الصراط المستقیم (1/528) سے نقل کرتا ہے۔ اس صفحے کا ذکر عجائب گھر کو دیے گئے ایک تحقیقی خلاصے میں تھا جس کے استعمال کی منظوری بانی نے 21 نومبر 2026 کو دی؛ عجائب گھر نے یہ صفحہ خود نہیں کھولا۔"
  fr: "La fatwa 136136 d'Islamweb qui, selon le résumé de recherche, cite la parole d'Umar sur l'apprentissage de l'arabe et des fara'id d'après l'Iqtida' al-Sirat al-Mustaqim d'Ibn Taymiyya (1/528). La page est nommée dans un résumé de recherche remis au musée et approuvé pour usage par le fondateur le 21 novembre 2026 ; le musée ne l'a pas ouverte."
  es: "La fatwa 136136 de Islamweb que, según el resumen de investigación, cita el dicho de Umar sobre aprender árabe y los fara'id según el Iqtida' al-Sirat al-Mustaqim de Ibn Taymiyya (1/528). La página figura en un resumen de investigación entregado al museo y aprobado para su uso por el fundador el 21 de noviembre de 2026; el museo no la abrió."
