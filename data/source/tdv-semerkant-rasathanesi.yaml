summary:
  ar: "مدخل «رصدخانة سمرقند» في موسوعة TDV الإسلامية بقلم حسن أومُت (المجلد 36، إسطنبول 2009، ص 486–487)، والنسخة الرقمية الجديدة المنشورة في 23 فبراير 2026. يصف المرصد الذي أنشأه أولوغ بك، وأرصاده، وأعضاءه، والزيج الذي خرج منه، وأثره اللاحق."
  en: "The TDV İslâm Ansiklopedisi entry 'SEMERKANT RASATHÂNESİ' by Hasan Umut (vol. 36, Istanbul 2009, pp. 486–487), with its digital version of 23 February 2026. It describes the observatory founded by Ulugh Beg, its observations, its staff, the zij it produced and its later influence."
