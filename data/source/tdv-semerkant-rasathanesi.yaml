summary:
  ar: "مدخل «رصدخانة سمرقند» في موسوعة TDV الإسلامية بقلم حسن أومُت ⁦(المجلد 36، إسطنبول 2009، ص 486–487)⁩، والنسخة الرقمية الجديدة المنشورة في 23 فبراير 2026. يصف المرصد الذي أنشأه أولوغ بك، وأرصاده، وأعضاءه، والزيج الذي خرج منه، وأثره اللاحق."
  en: "The TDV İslâm Ansiklopedisi entry 'SEMERKANT RASATHÂNESİ' by Hasan Umut (vol. 36, Istanbul 2009, pp. 486–487), with its digital version of 23 February 2026. It describes the observatory founded by Ulugh Beg, its observations, its staff, the zij it produced and its later influence."
  es: "La entrada «SEMERKANT RASATHÂNESİ» de la TDV İslâm Ansiklopedisi, de Hasan Umut (vol. 36, Estambul 2009, pp. 486–487), con su versión digital del 23 de febrero de 2026, describe el observatorio fundado por Ulugh Beg, sus observaciones, su personal, el zij que produjo y su influencia posterior."
  fr: "L'entrée TDV İslâm Ansiklopedisi 'SEMERKANT RASATHÂNESİ' par Hasan Umut (vol. 36, Istanbul 2009, pp. 486–487), avec sa version numérique du 23 février 2026. Elle décrit l'observatoire fondé par Ulugh Beg, ses observations, son personnel, le zij qu'il a produit et son influence ultérieure."
  ur: "TDV İslâm Ansiklopedisi اندراج 'SEMERKANT RASATHÂNESİ' از حسن امت ⁦(جلد 36، استنبول 2009، صفحہ 486–487)⁩، اس کے 23 فروری 2026 کے ڈیجیٹل ورژن کے ساتھ۔ یہ اس رصد گاہ کی وضاحت کرتا ہے جس کی بنیاد رکھی گئی تھی، اس کے بعد میں اس کے عملے نے الغضی اور اس کے عملے کی تخلیق کی تھی۔ اثر و رسوخ"
  tr: "TDV İslami Ansiklopedisi'nde Hasan Ümet tarafından \"Semerkant Gözlemevi\" hakkında madde (Cilt 36, İstanbul 2009, ss. 486–487) ve yeni dijital versiyonu 23 Şubat 2026'da yayımlanmıştır. Uluğ Bey tarafından kurulan gözlemevini, gözlemlerini, üyelerini, ortaya çıktığı burçu ve sonraki etkisini anlatmaktadır."
  id: "Entri tentang \"Observatorium Samarkand\" dalam Ensiklopedia Islam TDV oleh Hasan Ümet (Vol. 36, Istanbul 2009, hlm. 486–487), dan versi digital baru yang diterbitkan pada 23 Februari 2026. Artikel ini menjelaskan observatorium yang didirikan oleh Uluğ Bey, pengamatannya, anggotanya, zodiak tempat observatorium itu muncul, dan dampak selanjutnya."
