reliability_note: "Read on 1 November 2026 in the web edition: the historical account, the building, the staff, the zij and the later influence in full. The printed range 486–487 is taken from the page's own line. The bibliography was listed but none of its works was read. Where the entry's dates for the observatory's founding differ from the Takiyyüddin entry, both are recorded in the job file. Facts are rewritten in the museum's own words."
