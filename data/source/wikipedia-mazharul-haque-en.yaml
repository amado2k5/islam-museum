summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مولانا مظهر الحق؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 22 ديسمبر 1866 في بهبورة قرب باتنا ووفاته في 2 يناير 1930، وتعليمه القانوني في لندن، ودوره في معاهدة الكونغرس والرابطة 1916 وفي تشامباران والخلافة، وتأسيسه «صداقت آشرم» ومجلة «الوطن الأم» (Motherland)."
  en: "English Wikipedia article on Maulana Mazharul Haque; used for entity facts only. It gives his birth on 22 December 1866 at Bahpura near Patna and death on 2 January 1930, his legal education in London, his part in the 1916 Congress–League pact, Champaran and the Khilafat movement, and his founding of the Sadaqat Ashram and the Motherland magazine."
  es: "Artículo de la Wikipedia en inglés sobre Maulana Mazharul Haque; utilizado únicamente para datos sobre la persona. En él se indica su nacimiento el 22 de diciembre de 1866 en Bahpura, cerca de Patna, y su fallecimiento el 2 de enero de 1930, su formación jurídica en Londres, su participación en el pacto Congreso-Liga de 1916, Champaran y el movimiento Khilafat, así como la fundación del Sadaqat Ashram y la revista Motherland."
  fr: "Article de Wikipédia en anglais sur Maulana Mazharul Haque; utilisé uniquement pour les informations sur l’entité. Il indique sa naissance le 22 décembre 1866 à Bahpura, près de Patna, et son décès le 2 janvier 1930, ses études de droit à Londres, son rôle dans le pacte Congrès-Ligue de 1916, Champaran et le mouvement Khilafat, ainsi que la fondation de l’ashram Sadaqat et du magazine Motherland."
  ur: "مولانا مظہر الحق پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 22 دسمبر 1866 کو پٹنہ کے قریب بہپورہ میں ان کی پیدائش اور 2 جنوری 1930 کو موت، لندن میں ان کی قانونی تعلیم، 1916 کے کانگریس-لیگ معاہدے، چمپارن اور خلافت تحریک میں ان کا حصہ، اور صداقت آشرم اور مادر وطن میگزین کی بنیاد۔"
