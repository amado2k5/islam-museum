  ar: "مقالة ويكيبيديا الإنجليزية عن مولانا مظهر الحق؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 22 ديسمبر 1866 في بهبورة قرب باتنا ووفاته في 2 يناير 1930، وتعليمه القانوني في لندن، ودوره في معاهدة الكونغرس والرابطة 1916 وفي تشامباران والخلافة، وتأسيسه «صداقت آشرم» ومجلة «الوطن الأم» (Motherland)."
  en: "English Wikipedia article on Maulana Mazharul Haque; used for entity facts only. It gives his birth on 22 December 1866 at Bahpura near Patna and death on 2 January 1930, his legal education in London, his part in the 1916 Congress–League pact, Champaran and the Khilafat movement, and his founding of the Sadaqat Ashram and the Motherland magazine."
