label:
  ar: "الفتح الكبير في ضم الزيادة إلى الجامع الصغير — يوسف النبهاني، طبع بمطبعة دار الكتب العربية الكبرى على نفقة مصطفى البابي الحلبي وأخويه، مصر، الجزء الأول"
  en: "al-Fath al-Kabir fi Damm al-Ziyada ila al-Jami' al-Saghir — Yusuf al-Nabhani, printed at Dar al-Kutub al-'Arabiyya al-Kubra at the expense of Mustafa al-Babi al-Halabi and his brothers, Egypt, vol. 1"
summary:
  ar: "طبعة مصرية قديمة من «الفتح الكبير» للنبهاني، في أولها مقدمته في ضم الزيادة إلى الجامع الصغير، ثم «مقدمة تشتمل على ست فوائد مهمة» في طريقة السيوطي في الحكم على الأحاديث، وكتب جمع الجوامع، وعدد أحاديث الكتابين، وترجمة السيوطي، وإسناد النبهاني إليه."
  en: "An old Egyptian printing of al-Nabhani's al-Fath al-Kabir, opening with his preface on merging the Ziyada into al-Jami' al-Saghir, then 'an introduction of six important points' on al-Suyuti's method of grading, the books used for Jam' al-Jawami', the number of hadiths in the two books, a life of al-Suyuti, and al-Nabhani's chains to him."
