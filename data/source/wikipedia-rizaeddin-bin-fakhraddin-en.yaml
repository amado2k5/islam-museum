summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن رضاء الدين بن فخر الدين؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في كيجوتشات في 12 يناير 1858، وقضاءه في الإدارة الدينية بأوفا، وتحريره صحيفة «وقت» ومجلة «شورى»، ومفتيته لروسيا الأوروبية من 1921 حتى وفاته 1936."
  en: "English Wikipedia article on Rizaeddin bin Fakhreddin; used for entity facts only. It gives his birth at Kichuchat on 12 January 1858, his qadi service in the Muslim religious administration at Ufa, his editorship of the newspaper Waqt and the journal Shura, and his muftiate of European Russia from 1921 until his death in 1936."
  es: "Artículo de la Wikipedia en inglés sobre Rizaeddin bin Fakhreddin; utilizado únicamente para datos sobre la persona. En él se indica su nacimiento en Kichuchat el 12 de enero de 1858, su servicio como cadí en la administración religiosa musulmana de Ufa, su dirección del periódico Waqt y de la revista Shura, y su muftiato de la Rusia europea desde 1921 hasta su muerte en 1936."
  fr: "Article de Wikipédia en anglais sur Rizaeddin bin Fakhreddin; utilisé uniquement pour les informations sur l’entité. Il indique sa naissance à Kichuchat le 12 janvier 1858, son service de cadi dans l’administration religieuse musulmane à Oufa, sa direction du journal Waqt et de la revue Shura, et son muftiat de Russie européenne de 1921 jusqu’à sa mort en 1936."
