reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It gives his birth in its lead as 12 January 1858 at Kichuchat in Samara gouvernement — one year earlier than the Arabic and Urdu articles (13 January 1859) and than Wikidata (4 January 1859) give; the split is recorded in his data record, not resolved here. It dates his qadi election to 1891, his retirement and Waqt editorship to 1906, the founding of Shura to 1908, and his return to religious office as mufti of European Russia in 1921. It makes no statement of a school for him."
