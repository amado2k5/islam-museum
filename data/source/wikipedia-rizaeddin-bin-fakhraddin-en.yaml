  ar: "مقالة ويكيبيديا الإنجليزية عن رضاء الدين بن فخر الدين؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في كيجوتشات في 12 يناير 1858، وقضاءه في الإدارة الدينية بأوفا، وتحريره صحيفة «وقت» ومجلة «شورى»، ومفتيته لروسيا الأوروبية من 1921 حتى وفاته 1936."
  en: "English Wikipedia article on Rizaeddin bin Fakhreddin; used for entity facts only. It gives his birth at Kichuchat on 12 January 1858, his qadi service in the Muslim religious administration at Ufa, his editorship of the newspaper Waqt and the journal Shura, and his muftiate of European Russia from 1921 until his death in 1936."
