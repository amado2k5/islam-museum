summary:
  ar: "مقالہ ویکیپیڈیا اردو مضمون ملک فیروز خان نون ⁦(1893ء–1970ء)⁩ کے بارے میں؛ پیدائش 7 مئی 1893ء اور وفات 9 دسمبر 1970ء دیتا ہے اور ان کے سیاسی عہدے درج کرتا ہے؛ اس میں کوئی مذہبی بیان نہیں ملتا۔"
  en: "The Urdu Wikipedia article on Malik Firoz Khan Noon (1893–1970); it gives his birth on 7 May 1893 and his death on 9 December 1970 and lists his political offices; it makes no statement of his religion."
  es: "El artículo de Wikipedia en urdu sobre Malik Firoz Khan Noon (1893-1970) indica que nació el 7 de mayo de 1893 y murió el 9 de diciembre de 1970, y enumera sus cargos políticos; no menciona su religión."
  fr: "L'article de Wikipédia en ourdou sur Malik Firoz Khan Noon (1893-1970); il indique sa naissance le 7 mai 1893 et sa mort le 9 décembre 1970 et énumère ses fonctions politiques; il ne fait aucune déclaration sur sa religion."
  ur: "ملک فیروز خان نون (1893-1970) پر اردو ویکیپیڈیا کا مضمون؛ یہ 7 مئی 1893 کو ان کی پیدائش اور 9 دسمبر 1970 کو ان کی موت اور ان کے سیاسی دفاتر کی فہرست دیتا ہے۔ اس کے مذہب کا کوئی بیان نہیں ہے۔"
  tr: "Wikipedia Urduca makalesi, 7 Mayıs 1893 doğumlu ve 9 Aralık 1970'te vefat eden Malik Feroz Khan Noon (1893–1970) hakkındadır ve onun siyasi tutumlarını kaydeder; herhangi bir dini ifade içermez."
  id: "Artikel Wikipedia dalam bahasa Urdu membahas tentang Malik Feroz Khan Noon (1893–1970); lahir 7 Mei 1893, dan meninggal 9 Desember 1970, serta mencatat posisi politiknya; tidak memuat pernyataan keagamaan apapun."
