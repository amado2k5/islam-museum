summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن غالياسكار كمال ⁦(تحت الصيغة اللاتينية التترية «Ğaliäsğar Kamal»)⁩؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في قازان سنة 1879 في أسرة حرفي فرّاء، ودراسته في مدرستي غوسمانيا ومحمدية بقازان 1889–1897، ومسرحيته الأولى سنة 1900، وعمله في فرقة سيار ممثلا ومؤلفا؛ ولا تسمي له دينا ولا مذهبا."
  en: "English Wikipedia article on Ğaliäsğar Kamal (under the Tatar Latin form of his name); used for entity facts only. It gives his birth at Kazan in 1879 into a furrier craftsman's family, his study at the Ğosmaniyä and Möxämmädiyä madrasas of Kazan in 1889–1897, his first play of 1900, and his work in the Säyyär troupe as actor and playwright; it names no religion or school for him."
  es: "Artículo de la Wikipedia en inglés sobre Ğaliäsğar Kamal (bajo la forma latina tártara de su nombre); utilizado únicamente para datos sobre la persona. Indica su nacimiento en Kazán en 1879 en el seno de una familia de peleteros, sus estudios en las madrasas Ğosmaniyä y Möxämmädiyä de Kazán entre 1889 y 1897, su primera obra de teatro de 1900 y su trabajo en la compañía Säyyär como actor y dramaturgo; no menciona su religión ni su escuela."
  fr: "L'article de Wikipédia en anglais consacré à Ğaliäsğar Kamal (sous la forme latine tatare de son nom) est utilisé uniquement à titre informatif. Il indique sa naissance à Kazan en 1879 dans une famille d'artisans fourreurs, ses études aux madrasas Ğosmaniyä et Möxämmädiyä de Kazan de 1889 à 1897, sa première pièce de théâtre en 1900 et son travail au sein de la troupe Säyyär comme acteur et dramaturge; il ne mentionne ni sa religion ni son école."
  ur: "انگریزی ویکیپیڈیا مضمون Ğaliäsğar Kamal ⁦(ان کے نام کی تاتار لاطینی شکل کے تحت)⁩؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس نے 1879 میں کازان میں ایک فریئر کاریگر کے خاندان میں جنم لیا، 1889-1897 میں قازان کے Ğosmanyä اور Möxämmädiya مدرسوں میں اس کا مطالعہ، 1900 کا اس کا پہلا ڈرامہ، اور بطور اداکار اور ڈرامے کے Säyyär گروپ میں اس کا کام؛ اس کے لیے کسی مذہب یا اسکول کا نام نہیں ہے۔"
