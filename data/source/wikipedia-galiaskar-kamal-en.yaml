summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن غالياسكار كمال (تحت الصيغة اللاتينية التترية «Ğaliäsğar Kamal»)؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في قازان سنة 1879 في أسرة حرفي فرّاء، ودراسته في مدرستي غوسمانيا ومحمدية بقازان 1889–1897، ومسرحيته الأولى سنة 1900، وعمله في فرقة سيار ممثلا ومؤلفا؛ ولا تسمي له دينا ولا مذهبا."
  en: "English Wikipedia article on Ğaliäsğar Kamal (under the Tatar Latin form of his name); used for entity facts only. It gives his birth at Kazan in 1879 into a furrier craftsman's family, his study at the Ğosmaniyä and Möxämmädiyä madrasas of Kazan in 1889–1897, his first play of 1900, and his work in the Säyyär troupe as actor and playwright; it names no religion or school for him."
