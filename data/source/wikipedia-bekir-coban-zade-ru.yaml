summary:
  ar: "مقالة ويكيبيديا الروسية عن بكير جوبان زاده؛ تُستخدم لوقائع الكيان فقط. تعطي مولده مزدوج التأريخ 15 مايو ⁦(27 مايو بالأسلوب الجديد)⁩ 1893 في قره سوبازار في أسرة راع، وتعليمه في المدرسة الرشدية الجديدة وفي ليسيه غلطة سراي بإسطنبول ثم في بودابست، واعتقاله في 28 يناير 1937 وإعدامه في 13 أكتوبر 1937؛ ولا تسمي له دينا ولا مذهبا."
  en: "Russian Wikipedia article on Bekir Çoban-zade; used for entity facts only. It dual-dates his birth 15 May (27 May new style) 1893 at Karasubazar, to a shepherd's family, and details his schooling at the new-method rushdie and the Galatasaray Lyceum in Istanbul, then Budapest, his professorships in Crimea and Baku, his arrest on 28 January 1937 and execution on 13 October 1937; it names no religion or school for him."
  es: "Artículo de la Wikipedia rusa sobre Bekir Çoban-zade; utilizado únicamente para datos sobre la persona. Indica su nacimiento el 15 de mayo (27 de mayo según el calendario gregoriano) de 1893 en Karasubazar, en el seno de una familia de pastores, y detalla su educación en el nuevo método Rushdie y en el Liceo Galatasaray de Estambul, y posteriormente en Budapest, sus cátedras en Crimea y Bakú, su arresto el 28 de enero de 1937 y su ejecución el 13 de octubre de 1937; no menciona su religión ni su escuela."
  fr: "L'article de Wikipédia en russe sur Bekir Çoban-zade, utilisé uniquement pour des informations factuelles, mentionne sa naissance le 15 mai (27 mai selon le nouveau style) 1893 à Karasubazar, dans une famille de bergers. Il détaille sa scolarité à l'école Rushdie (école de la nouvelle méthode) et au lycée Galatasaray d'Istanbul, puis à Budapest, ses postes de professeur en Crimée et à Bakou, son arrestation le 28 janvier 1937 et son exécution le 13 octobre 1937. L'article ne mentionne ni sa religion ni son école."
  ur: "Bekir Çoban-zade پر روسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ دوہری تاریخیں اس کی پیدائش 15 مئی ⁦(27 مئی نئے انداز)⁩ 1893 کو کارسو بازار میں ایک چرواہے کے خاندان میں ہے، اور استنبول میں نئے طریقہ کار رشدی اور گالاتاسرے لائسیم میں اس کی اسکولنگ کی تفصیلات، پھر بوڈاپیسٹ، کریمیا اور باکو میں اس کی پروفیسر شپ، اس کی گرفتاری 28 اور 13 جنوری کو 313 جنوری کو ہوئی تھی۔ اس کے لیے کسی مذہب یا اسکول کا نام نہیں ہے۔"
  tr: "Bakir Jubanzadeh hakkında Rusça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 15 Mayıs (yeni tarzda 27 Mayıs) olarak Kara Subazar'da çoban ailesinde doğduğunu, İstanbul'daki Yeni Rushdieh Okulu ve Galatasaray Lisesi'nde eğitimini, ardından Budapeşte'de 28 Ocak 1937'de tutuklandığını ve 13 Ekim 1937'de idam edildiğini belirtir; dini veya mezhebi belirtilmez."
  id: "Artikel Wikipedia Rusia tentang Bakir Jubanzadeh; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya pada 15 Mei (27 Mei dengan gaya baru) 1893 di Kara Subazar dalam keluarga gembala, pendidikannya di Sekolah Rushdieh Baru dan Lycée Galatasaray di Istanbul dan kemudian di Budapest, penangkapannya pada 28 Januari 1937, dan eksekusinya pada 13 Oktober 1937; tidak menyebutkan agama atau denominasinya."
