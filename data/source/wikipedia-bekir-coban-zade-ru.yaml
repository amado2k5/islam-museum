summary:
  ar: "مقالة ويكيبيديا الروسية عن بكير جوبان زاده؛ تُستخدم لوقائع الكيان فقط. تعطي مولده مزدوج التأريخ 15 مايو (27 مايو بالأسلوب الجديد) 1893 في قره سوبازار في أسرة راع، وتعليمه في المدرسة الرشدية الجديدة وفي ليسيه غلطة سراي بإسطنبول ثم في بودابست، واعتقاله في 28 يناير 1937 وإعدامه في 13 أكتوبر 1937؛ ولا تسمي له دينا ولا مذهبا."
  en: "Russian Wikipedia article on Bekir Çoban-zade; used for entity facts only. It dual-dates his birth 15 May (27 May new style) 1893 at Karasubazar, to a shepherd's family, and details his schooling at the new-method rushdie and the Galatasaray Lyceum in Istanbul, then Budapest, his professorships in Crimea and Baku, his arrest on 28 January 1937 and execution on 13 October 1937; it names no religion or school for him."
