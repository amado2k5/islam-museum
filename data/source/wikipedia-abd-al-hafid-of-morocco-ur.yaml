summary:
  ar: "مقالة ويكيبيديا الأردية الموجزة عن عبد الحفيظ بن الحسن؛ تعطي ميلاده في 24 فبراير 1875 مع التنبيه إلى عدم اليقين ⁦(بعض المصادر تعطي 1875 أو 1880)⁩ ووفاته في 4 أبريل 1937، وسلطنته من 1908 إلى 1912."
  en: "The short Urdu Wikipedia article on Abd al-Hafid of Morocco; it gives his birth as 24 February 1875 while noting the uncertainty (some sources give 1875 or 1880), his death on 4 April 1937, and his sultanate from 1908 to 1912."
  es: "El breve artículo de Wikipedia en urdu sobre Abd al-Hafid de Marruecos indica que nació el 24 de febrero de 1875, aunque señala la incertidumbre (algunas fuentes dan 1875 o 1880), que murió el 4 de abril de 1937 y que gobernó el sultanato desde 1908 hasta 1912."
  fr: "Le court article de Wikipédia en ourdou sur Abd al-Hafid du Maroc; il indique sa naissance le 24 février 1875 tout en notant l'incertitude (certaines sources donnent 1875 ou 1880), sa mort le 4 avril 1937 et son sultanat de 1908 à 1912."
  ur: "مراکش کے عبد الحفید پر مختصر اردو ویکیپیڈیا مضمون؛ اس نے ان کی پیدائش 24 فروری 1875 کی ہے جب کہ غیر یقینی صورتحال ⁦(بعض ذرائع 1875 یا 1880 بتاتے ہیں)⁩، اس کی موت 4 اپریل 1937 کو، اور اس کی سلطنت 1908 سے 1912 تک ہوئی تھی۔"
  tr: "Urduca Vikipedi makalesi, Abdul Hafiz bin Al-Hasan hakkında özetlidir; 24 Şubat 1875'te doğmuş, belirsizlik notu (bazı kaynaklar 1875 veya 1880 vermektedir), 4 Nisan 1937'deki ölümünü ve 1908-1912 yılları arasındaki saltanatı hakkında."
  id: "Artikel Wikipedia berbahasa Urdu singkat tentang Abdul Hafiz bin Al-Hasan; menceritakan kelahirannya pada 24 Februari 1875, dengan catatan ketidakpastian (beberapa sumber menyebutkan 1875 atau 1880), kematiannya pada 4 April 1937, dan masa pemerintahannya dari 1908 hingga 1912."
