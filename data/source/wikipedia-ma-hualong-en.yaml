reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026, fetched through the MediaWiki API by its recorded revision id with the returned id asserted equal. The text rests chiefly on Michael Dillon, China's Muslim Hui Community (1999), pp. 124–126 and 66–68, and Jonathan N. Lipman, Familiar Strangers (1998); the birth (c. 1810, at Lingzhou) and the infobox's Sunni, Hanafi and Maturidi values rest on Wlodzimierz Cieciura's Encyclopaedia of Islam Three entry 'Ma Hualong' (2020), cited for those fields — one source family for the infobox values. The text states that he became leader of the Jahriyya about 1849 succeeding Ma Yide, his father and teacher, and calls his occupation Sufi shaykh. Its categories file him under the Naqshbandi order and Chinese Sufis; categories are filings, not attestation."
