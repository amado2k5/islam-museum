summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ما هوالونغ؛ تُستخدم لوقائع الكيان فقط. تجعله خامس شيوخ الطريقة الجهرية النقشبندية في شمال غرب الصين، خلفًا لوالده وأستاذه ما ييده نحو سنة 1849، وقائدًا رئيسًا في ثورة المسلمين ضد أسرة تشينغ حتى استسلامه وإعدامه في جينجيبو في 2 آذار 1871؛ ويعطي صندوق معلوماتها مولده نحو سنة 1810 في لينغتشو، وانتماءه إجمالًا إلى الإسلام، ومذهبه السني الحنفي الماتريدي وطريقته الجهرية."
  en: "English Wikipedia article on Ma Hualong; used for entity facts only. It makes him the fifth shaykh of the Jahriyya, a Naqshbandi Sufi menhuan in northwest China, succeeding his father and teacher Ma Yide about 1849, and a main leader of the Muslim rebellion against the Qing until his surrender and execution at Jinjipu on 2 March 1871; its infobox gives his birth about 1810 at Lingzhou, his religion as Islam, his denomination as Sunni, his jurisprudence as Hanafi, his creed as Maturidi and his order as the Jahriyya."
