summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ما هوالونغ؛ تُستخدم لوقائع الكيان فقط. تجعله خامس شيوخ الطريقة الجهرية النقشبندية في شمال غرب الصين، خلفًا لوالده وأستاذه ما ييده نحو سنة 1849، وقائدًا رئيسًا في ثورة المسلمين ضد أسرة تشينغ حتى استسلامه وإعدامه في جينجيبو في 2 آذار 1871؛ ويعطي صندوق معلوماتها مولده نحو سنة 1810 في لينغتشو، وانتماءه إجمالًا إلى الإسلام، ومذهبه السني الحنفي الماتريدي وطريقته الجهرية."
  en: "English Wikipedia article on Ma Hualong; used for entity facts only. It makes him the fifth shaykh of the Jahriyya, a Naqshbandi Sufi menhuan in northwest China, succeeding his father and teacher Ma Yide about 1849, and a main leader of the Muslim rebellion against the Qing until his surrender and execution at Jinjipu on 2 March 1871; its infobox gives his birth about 1810 at Lingzhou, his religion as Islam, his denomination as Sunni, his jurisprudence as Hanafi, his creed as Maturidi and his order as the Jahriyya."
  es: "Artículo de la Wikipedia en inglés sobre Ma Hualong; utilizado únicamente para datos sobre la entidad. Lo describe como el quinto shaykh de la Jahriyya, un menhuan sufí Naqshbandi del noroeste de China, que sucedió a su padre y maestro Ma Yide alrededor de 1849, y fue uno de los principales líderes de la rebelión musulmana contra la dinastía Qing hasta su rendición y ejecución en Jinjipu el 2 de marzo de 1871. Su ficha informativa indica que nació alrededor de 1810 en Lingzhou, que su religión era el Islam, su denominación sunita, su jurisprudencia hanafi, su credo maturidi y su orden la Jahriyya."
  fr: "L'article de Wikipédia en anglais sur Ma Hualong, utilisé uniquement pour les informations le concernant, le présente comme le cinquième cheikh de la Jahriyya, un menhuan soufi naqshbandi du nord-ouest de la Chine, succédant à son père et maître Ma Yide vers 1849, et un chef important de la rébellion musulmane contre les Qing jusqu'à sa reddition et son exécution à Jinjipu le 2 mars 1871. Son infobox indique qu'il est né vers 1810 à Lingzhou, qu'il est musulman, sunnite, hanafite, maturidi et membre de l'ordre Jahriyya."
  ur: "ما ہوالونگ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اسے جہریہ کا پانچواں شیخ بناتا ہے، جو شمال مغربی چین میں ایک نقشبندی صوفی مینہون ہے، جو 1849 کے قریب اپنے والد اور استاد ما یدے کا جانشین بنا، اور 2 مارچ 1871 کو جنجیپو میں ہتھیار ڈالنے اور پھانسی دینے تک چنگ کے خلاف مسلم بغاوت کا ایک اہم رہنما بنا۔ اس کا معلوماتی خانہ 1810 میں لنگزو میں اس کی پیدائش، اس کا مذہب اسلام، اس کا فرقہ سنی، اس کا فقہ حنفی، اس کا عقیدہ ماتوریدی اور اس کا حکم جہریہ ہے۔"
