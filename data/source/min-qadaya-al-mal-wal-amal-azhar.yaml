label:
  ar: من قضايا العمل والمال في الإسلام — أبو الوفا المراغي
  en: Issues of Work and Wealth in Islam — Abu al-Wafa al-Maraghi
summary:
  ar: "رسالة لفضيلة الشيخ أبو الوفا مصطفى المراغي ⁦(من كبار علماء الأزهر، الأمين المساعد الأسبق لمجمع البحوث الإسلامية)⁩ ضمن السلسلة العلمية للمجمع، بإشراف الأمين العام أ.د محيي الدين عفيفي أحمد، ومعها تقديم للدكتور محمد عبد الرحمن بيصار؛ تبحث في العمل وأنواعه ومحظوره، والمرأة والعمل، وعلاقة العامل بصاحب العمل، والمال ووظائفه: الإنفاق والزكاة والضرائب والإنفاق في المصالح العامة، وتذيّلها بقرارات مؤتمر مجمع البحوث الإسلامية في دورته الثانية ⁦(1965م)⁩."
  en: "A booklet by Abu al-Wafa al-Maraghi, former Assistant Secretary-General of the Islamic Research Academy, in the Academy's Scientific Series, supervised by its Secretary-General Muhyi al-Din Afifi Ahmad, with a foreword by Muhammad Abd al-Rahman Bisar. It covers work and its kinds, forbidden work, women's work, the relation of worker and employer, and the functions of wealth (spending, zakat, taxes, public interest), closing with resolutions of the Academy's second conference (1965)."
  es: "Un folleto de Abu al-Wafa al-Maraghi, ex subsecretario general de la Academia de Investigación Islámica, perteneciente a la Serie Científica de la Academia, supervisada por su secretario general, Muhyi al-Din Afifi Ahmad, con prólogo de Muhammad Abd al-Rahman Bisar. Trata sobre el trabajo y sus diferentes tipos, el trabajo prohibido, el trabajo de la mujer, la relación entre trabajador y empleador, y las funciones de la riqueza (gasto, zakat, impuestos, interés público), y concluye con las resoluciones de la segunda conferencia de la Academia (1965)."
  fr: "Ce livret d'Abu al-Wafa al-Maraghi, ancien secrétaire général adjoint de l'Académie de recherche islamique, fait partie de la collection scientifique de l'Académie, sous la direction de son secrétaire général, Muhyi al-Din Afifi Ahmad, et préfacé par Muhammad Abd al-Rahman Bisar. Il traite du travail et de ses différentes formes, du travail interdit, du travail des femmes, des relations entre employeur et employé, et des fonctions de la richesse (dépenses, zakat, impôts, intérêt public), et se conclut par les résolutions de la deuxième conférence de l'Académie (1965)."
  ur: "اکیڈمی کی سائنسی سیریز میں اسلامک ریسرچ اکیڈمی کے سابق اسسٹنٹ سکریٹری جنرل ابو الوفاء المراغی کا ایک کتابچہ، جس کی نگرانی اس کے سیکرٹری جنرل محی الدین عفیفی احمد کر رہے ہیں، جس کا پیش لفظ محمد عبدالرحمٰن بسار نے لکھا ہے۔ اس میں کام اور اس کی اقسام، حرام کام، خواتین کا کام، کارکن اور آجر کا رشتہ، اور دولت کے افعال ⁦(خرچ، زکوٰۃ، ٹیکس، مفاد عامہ)⁩ کا احاطہ کیا گیا ہے، اکیڈمی کی دوسری کانفرنس (1965) کی قراردادوں کے ساتھ اختتام پذیر ہوا۔"
  tr: "Akademi'nin bilimsel serisinin bir parçası olarak, Genel Sekreter Prof. Dr. Mohieddin Afifi Ahmed tarafından yapılan bir mektup, Dr. Muhammad Abdul Rahman Besar'ın girişiyle birlikte çalışma, türleri ve yasakları, kadınlar ve iş, işçi ile işveren arasındaki ilişki, para ve işlevleri: harcamalar, zekat, vergiler ve kamu yararına harcamalar gibi konuları ele almaktadır; ardından İslami Araştırma Akademisi Konferansı'nın (1965) ikinci oturumunun kararları ele alınmaktadır."
  id: "Surat dari Yang Mulia Sheikh Abu Al-Wafa Mustafa Al-Maraghi (salah satu ulama senior Al-Azhar, mantan Asisten Sekretaris Akademi Riset Islam) sebagai bagian dari seri ilmiah Akademi, diawasi oleh Sekretaris Jenderal Prof. Dr. Mohieddin Afifi Ahmed, disertai pengantar oleh Dr. Muhammad Abdul Rahman Besar; surat ini membahas pekerjaan, jenis dan larangannya, perempuan dan pekerjaan, hubungan antara pekerja dan majikan, uang dan fungsinya: pengeluaran, zakat, pajak, dan pengeluaran untuk kepentingan publik, diikuti oleh keputusan sesi kedua Konferensi Akademi Riset Islam (1965)."
