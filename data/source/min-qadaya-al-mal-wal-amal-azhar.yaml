summary:
  ar: "رسالة لفضيلة الشيخ أبو الوفا مصطفى المراغي (من كبار علماء الأزهر، الأمين المساعد الأسبق لمجمع البحوث الإسلامية) ضمن السلسلة العلمية للمجمع، بإشراف الأمين العام أ.د محيي الدين عفيفي أحمد، ومعها تقديم للدكتور محمد عبد الرحمن بيصار؛ تبحث في العمل وأنواعه ومحظوره، والمرأة والعمل، وعلاقة العامل بصاحب العمل، والمال ووظائفه: الإنفاق والزكاة والضرائب والإنفاق في المصالح العامة، وتذيّلها بقرارات مؤتمر مجمع البحوث الإسلامية في دورته الثانية (1965م)."
  en: "A booklet by Abu al-Wafa al-Maraghi, former Assistant Secretary-General of the Islamic Research Academy, in the Academy's Scientific Series, supervised by its Secretary-General Muhyi al-Din Afifi Ahmad, with a foreword by Muhammad Abd al-Rahman Bisar. It covers work and its kinds, forbidden work, women's work, the relation of worker and employer, and the functions of wealth (spending, zakat, taxes, public interest), closing with resolutions of the Academy's second conference (1965)."
