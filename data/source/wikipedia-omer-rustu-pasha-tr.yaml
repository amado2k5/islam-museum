  ar: "المقالة التركية الوحيدة في ويكيبيديا عن عمر رشدي باشا؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده سنة 1843 في كوتاهية ووفاته في 23 يوليو 1922 في إسطنبول ودفنه في مقبرة ماتشكا، وأنه أول وزير للحربية بعد إنشاء النظارة."
  en: "The only Wikipedia article on Ömer Rüşdü Paşa, in Turkish; used for entity facts only. It gives his birth in 1843 at Kütahya, his death on 23 July 1922 at Istanbul and burial in Maçka Cemetery, and his standing as the first Minister of War after the ministry was created."
  es: "El único artículo de Wikipedia sobre Ömer Rüşdü Paşa, en turco, se utiliza únicamente para datos biográficos. Indica su nacimiento en 1843 en Kütahya, su fallecimiento el 23 de julio de 1922 en Estambul y su entierro en el cementerio de Maçka, así como su cargo como primer Ministro de Guerra tras la creación del ministerio."
  fr: "Le seul article Wikipédia consacré à Ömer Rüşdü Paşa, en turc, est utilisé uniquement à des fins documentaires. Il indique sa naissance en 1843 à Kütahya, son décès le 23 juillet 1922 à Istanbul et son inhumation au cimetière de Maçka, ainsi que son rôle de premier ministre de la Guerre après la création de ce ministère."
