reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md). Read in full on 26 October 2026 and re-fetched by revision id with content verified identical. No English Wikipedia article exists (the item’s only sitelink is trwiki). The article names no religion or school for him personally and its infobox carries no religion field; it records his family’s nickname Mekkelizâde, from an ancestor’s long stay in Mecca — family history, not an attestation of his own affiliation. It gives the birth in 1843 at Kütahya, citing the Osmanlılar Ansiklopedisi, and the death on 23 July 1922 at Istanbul, with burial in Maçka Cemetery."
