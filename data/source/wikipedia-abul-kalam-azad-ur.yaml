summary:
  ar: "مقالة ويكيبيديا الأردية عن أبي الكلام آزاد (1888–1958)؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في مكة في 11 نوفمبر 1888 ووفاته في 22 فبراير 1958، ونشأته وطفولته في مكة والمدينة، ومجلته «الہلال» الصادرة من كلکتہ سنة 1912، وكتبه ومنها «غبار خاطر» — خطوط كتبها في أسر أحمد نگر 1942–1945 — و«ترجمان القرآن»، ووزارته الأولى للتعليم في الهند."
  en: "Urdu Wikipedia article on Abul Kalam Azad (1888–1958); used for entity facts only. It gives his birth in Mecca on 11 November 1888 and his death on 22 February 1958, his childhood in Mecca and Medina, his journal Al-Hilal launched from Calcutta in 1912, his books including Ghubar-e-Khatir — letters written in Ahmednagar fort imprisonment, 1942–1945 — and Tarjuman-ul-Quran, and his tenure as India's first Minister of Education."
