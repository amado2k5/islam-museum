summary:
  ar: "تقرير مطهر خان في صحيفة «دون» الباكستانية في 24 نوفمبر 2019 عن تطبيق «إسلام 360»: محرك بحث في القرآن والحديث من كراتشي، بدأ برنامجًا حاسوبيًا باسم «Search Quran» سنة 2009، وتنزيلاته وتمويله وفريقه وخططه كما رواها مؤسسه زاهد حسين چھیپا."
  en: "Mutaher Khan's report in Dawn (Pakistan), 24 November 2019, on the Islam360 app: a Qur'an and hadith search engine from Karachi that began as a desktop program, 'Search Quran', in 2009, with its downloads, funding, team and plans as its founder Zahid Hussain Chhipa told them."
  ur: "روزنامہ ڈان میں مطہر خان کی 24 نومبر 2019 کی رپورٹ: کراچی کی ایپ «اسلام 360»، قرآن و حدیث کا سرچ انجن جو 2009 میں «Search Quran» کے نام سے ڈیسک ٹاپ پروگرام کے طور پر شروع ہوا؛ ڈاؤن لوڈ، مالی وسائل، ٹیم اور منصوبے، بانی زاہد حسین چھیپا کی زبانی۔"
  es: "El reportaje de Mutaher Khan en Dawn (Pakistán), del 24 de noviembre de 2019, sobre la aplicación Islam360: un motor de búsqueda del Corán y los hadices de Karachi que comenzó como un programa de escritorio, 'Search Quran', en 2009, con sus descargas, financiación, equipo y planes, tal como los contó su fundador, Zahid Hussain Chhipa."
  fr: "Le reportage de Mutaher Khan dans Dawn (Pakistan), le 24 novembre 2019, sur l'application Islam360: un moteur de recherche du Coran et des hadiths de Karachi qui a débuté comme un programme de bureau, « Search Quran », en 2009, avec ses téléchargements, son financement, son équipe et ses projets tels que son fondateur Zahid Hussain Chhipa les leur a expliqués."
  tr: "Mutahar Khan'ın 24 Kasım 2019'da Pakistan gazetesi 'Dawn'da yayımlanan haberi, Karaçi'den Kur'an ve Hadisler için bir arama motoru olan 'Islam 360' uygulaması hakkında; bu uygulama 2009'da 'Search Quran' adlı bir bilgisayar programı başlatmış, indirmeleri, finansmanı, ekibi ve kurucusu Zahid Hussain Chhipa'nın anlattığı planlarla birlikte yer almaktadır."
  id: "Laporan Mutahar Khan di surat kabar Pakistan 'Dawn' pada 24 November 2019, tentang aplikasi 'Islam 360': mesin pencari untuk Al-Qur'an dan Hadis dari Karachi, yang memulai program komputer bernama 'Search Quran' pada tahun 2009, beserta unduhan, pendanaan, tim, dan rencananya yang dinarasikan oleh pendirinya Zahid Hussain Chhipa."
