  ar: "مقالة ويكيبيديا الإنجليزية عن محمد شياع السوداني؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 4 آذار 1970 ببغداد ورئاسته للوزراء من 27 تشرين الأول 2022 إلى 14 أيار 2026 خلفًا لمصطفى الكاظمي، وتقول إنه وُلد لأسرة عربية شيعية وهي خلفية أسرية، وتذكر عضويته في حزب الدعوة 2003–2019 وهي انتماء حزبي."
