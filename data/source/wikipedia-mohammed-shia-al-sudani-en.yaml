summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد شياع السوداني؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 4 آذار 1970 ببغداد ورئاسته للوزراء من 27 تشرين الأول 2022 إلى 14 أيار 2026 خلفًا لمصطفى الكاظمي، وتقول إنه وُلد لأسرة عربية شيعية وهي خلفية أسرية، وتذكر عضويته في حزب الدعوة 2003–2019 وهي انتماء حزبي."
  en: "English Wikipedia article on Mohammed Shia' al-Sudani; used for entity facts only. It gives his birth on 4 March 1970 at Baghdad and his premiership from 27 October 2022 to 14 May 2026 in succession to Mustafa Al-Kadhimi. It says he was born to a Shia Arab family — family background, citing his official embassy biography — and records his Islamic Dawa Party membership 2003–2019, a party affiliation; neither is a personal attestation of a school."
  es: "Artículo de la Wikipedia en inglés sobre Mohammed Shia' al-Sudani; utilizado únicamente para datos sobre la persona. Indica que nació el 4 de marzo de 1970 en Bagdad y que fue primer ministro desde el 27 de octubre de 2022 hasta el 14 de mayo de 2026, sucediendo a Mustafa Al-Kadhimi. Menciona que nació en una familia árabe chiíta —antecedentes familiares, según su biografía oficial de la embajada— y registra su afiliación al Partido Islámico Dawa entre 2003 y 2019; ninguna de estas afirmaciones constituye una constancia personal de su escuela."
  fr: "Article de Wikipédia en anglais sur Mohammed Shia' al-Sudani; utilisé uniquement à titre informatif. Il indique sa naissance le 4 mars 1970 à Bagdad et son mandat de Premier ministre du 27 octobre 2022 au 14 mai 2026, succédant à Mustafa Al-Kadhimi. Il précise qu'il est né dans une famille arabe chiite (informations issues de sa biographie officielle à l'ambassade) et mentionne son appartenance au Parti islamique Dawa de 2003 à 2019; il ne s'agit pas d'une attestation d'appartenance scolaire."
  ur: "محمد شیعہ السوڈانی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 4 مارچ 1970 کو بغداد میں ان کی پیدائش اور مصطفیٰ الکاظمی کے بعد 27 اکتوبر 2022 سے 14 مئی 2026 تک اس کی وزارت عظمیٰ پر فائز ہے۔ اس میں کہا گیا ہے کہ وہ ایک شیعہ عرب خاندان میں پیدا ہوا تھا - خاندانی پس منظر، اپنے سفارت خانے کی باضابطہ سوانح عمری کا حوالہ دیتے ہوئے - اور اس نے اپنی اسلامی دعوۃ پارٹی کی رکنیت 2003-2019 کو ریکارڈ کیا، جو کہ ایک جماعت سے وابستہ ہے۔ نہ ہی کسی اسکول کی ذاتی تصدیق ہے۔"
