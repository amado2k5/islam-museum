reliability_note: "A polemical source: the encyclopedia is written from an opposing standpoint and files him under 'al-Haddadiyya al-jadida' (the neo-Haddadiyya), a label applied by opponents, and its judgements are reported in the museum's prose as its own claims, never as fact. Its bare biographical data — birth at Deir ez-Zor in 1988 (1408 AH), with its own variant of about 1989; residence in Germany; the former name Muhammad al-Sulayman; his work as a YouTube channel owner — are used as single-source entity facts with the conflict stated. Checked 26 October 2026."
