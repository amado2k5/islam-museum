  en: "The biography of Muhammad Bin Shams El-Din in the Al-Siyar encyclopedia of contemporary figures (alsiyar.com), an encyclopedia written by his critics; it gives his birth at Deir ez-Zor in 1988 (1408 AH), with a variant of about 1989, his residence in Germany, and his former name Muhammad al-Sulayman."
