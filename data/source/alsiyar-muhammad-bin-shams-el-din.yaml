summary:
  ar: "ترجمة محمد بن شمس الدين في موسوعة سير أعلام المعاصرين (alsiyar.com)، وهي موسوعة يكتبها نقاد له؛ تذكر ميلاده في دير الزور سنة 1988م ⁦(1408هـ)⁩ مع قول آخر بقرب 1989م، وإقامته في ألمانيا، واسمه القديم محمد السليمان."
  en: "The biography of Muhammad Bin Shams El-Din in the Al-Siyar encyclopedia of contemporary figures (alsiyar.com), an encyclopedia written by his critics; it gives his birth at Deir ez-Zor in 1988 (1408 AH), with a variant of about 1989, his residence in Germany, and his former name Muhammad al-Sulayman."
  es: "La biografía de Muhammad Bin Shams El-Din en la enciclopedia Al-Siyar de figuras contemporáneas (alsiyar.com), una enciclopedia escrita por sus críticos, indica que nació en Deir ez-Zor en 1988 (1408 AH), con una variante que indica alrededor de 1989, su residencia en Alemania y su nombre anterior, Muhammad al-Sulayman."
  fr: "La biographie de Muhammad Bin Shams El-Din dans l'encyclopédie Al-Siyar des personnalités contemporaines (alsiyar.com), une encyclopédie écrite par ses critiques; elle donne sa naissance à Deir ez-Zor en 1988 (1408 AH), avec une variante vers 1989, sa résidence en Allemagne et son ancien nom Muhammad al-Sulayman."
  ur: "ہم عصر شخصیات کے السیار انسائیکلو پیڈیا میں محمد بن شمس الدین کی سوانح عمری (alsiyar.com)، ایک انسائیکلوپیڈیا جسے ان کے ناقدین نے لکھا ہے۔ اس کی پیدائش 1988 ⁦(1408 ہجری)⁩ میں دیر الزور میں ہوئی، تقریباً 1989 میں اس کی رہائش جرمنی میں، اور اس کا سابقہ نام محمد السلیمان تھا۔"
