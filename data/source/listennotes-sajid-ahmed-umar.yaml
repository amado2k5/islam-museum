summary:
  ar: "صفحة بودكاست مسلم سنترال لساجد أحمد عمر مع سيرته القياسية: وُلد في ليستر ودرس في هراري، حفظ القرآن في الثامنة عشرة، درس في جامعة الإمام بالرياض ⁦(دبلوم اللغة العربية والعلوم الإسلامية، بكالوريوس الشريعة، ماجستير القضاء)⁩، ومحاضر أقدم في جامعة المعرفة الدولية، ومدير التطوير الإسلامي في «مرسي ميشن وورلد» ومحاضر في الكوثر."
  en: "Muslim Central's podcast page for Sajid Ahmed Umar with his standard biography: born in Leicester and schooled in Harare, memorised the Qur'an at eighteen, studied at al-Imam University in Riyadh (diploma in Arabic and Islamic sciences, bachelor's in Shariah, master's in judiciary), senior lecturer at Knowledge International University, Director of Islamic Development for Mercy Mission World and an AlKauthar lecturer."
  es: "Página de podcasts de Muslim Central sobre Sajid Ahmed Umar con su biografía habitual: nació en Leicester y se educó en Harare, memorizó el Corán a los dieciocho años, estudió en la Universidad al-Imam de Riad (diploma en árabe y ciencias islámicas, licenciatura en sharia, maestría en derecho judicial), profesor titular en la Universidad Knowledge International, director de desarrollo islámico de Mercy Mission World y profesor de AlKauthar."
  fr: "La page du podcast Muslim Central consacrée à Sajid Ahmed Umar présente sa biographie habituelle: né à Leicester et scolarisé à Harare, il a mémorisé le Coran à dix-huit ans, étudié à l’université al-Imam de Riyad (diplôme en arabe et sciences islamiques, licence en charia, master en droit), maître de conférences à la Knowledge International University, directeur du développement islamique pour Mercy Mission World et conférencier à AlKauthar."
