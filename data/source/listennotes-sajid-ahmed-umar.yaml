summary:
  ar: "صفحة بودكاست مسلم سنترال لساجد أحمد عمر مع سيرته القياسية: وُلد في ليستر ودرس في هراري، حفظ القرآن في الثامنة عشرة، درس في جامعة الإمام بالرياض (دبلوم اللغة العربية والعلوم الإسلامية، بكالوريوس الشريعة، ماجستير القضاء)، ومحاضر أقدم في جامعة المعرفة الدولية، ومدير التطوير الإسلامي في «مرسي ميشن وورلد» ومحاضر في الكوثر."
  en: "Muslim Central's podcast page for Sajid Ahmed Umar with his standard biography: born in Leicester and schooled in Harare, memorised the Qur'an at eighteen, studied at al-Imam University in Riyadh (diploma in Arabic and Islamic sciences, bachelor's in Shariah, master's in judiciary), senior lecturer at Knowledge International University, Director of Islamic Development for Mercy Mission World and an AlKauthar lecturer."
