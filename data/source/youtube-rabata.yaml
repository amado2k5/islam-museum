summary:
  ar: "قناة منظمة رابطة على يوتيوب، المنظمة النسائية التعليمية التي أسستها تمارا غراي وترأسها في مينيسوتا؛ مصدر أولي لمحاضراتها وسلاسلها الرمضانية ودروسها، إذ تنشر المنظمة تسجيلات برامجها ومحاضرات مؤسستها على القناة."
  en: "The YouTube channel of Rabata, the women's educational nonprofit Tamara Gray founded and leads in Minnesota; a primary source for her lectures, Ramadan series and classes, as the organisation uploads recordings of its programmes and its founder's talks to the channel."
  es: "El canal de YouTube de Rabata, la organización educativa sin ánimo de lucro para mujeres que Tamara Gray fundó y dirige en Minnesota, es una fuente principal para sus conferencias, series y clases de Ramadán, ya que la organización sube al canal grabaciones de sus programas y las charlas de su fundadora."
  fr: "La chaîne YouTube de Rabata, l'organisation à but non lucratif d'éducation pour femmes fondée et dirigée par Tamara Gray dans le Minnesota, est une source essentielle pour ses conférences, ses séries sur le Ramadan et ses cours, car l'organisation y télécharge les enregistrements de ses programmes et les interventions de sa fondatrice."
  ur: "Rabata کا YouTube چینل، مینیسوٹا میں خواتین کی تعلیمی غیر منفعتی تمارا گرے کی بنیاد رکھی اور اس کی قیادت کرتی ہے۔ اس کے لیکچرز، رمضان سیریز اور کلاسز کا ایک بنیادی ذریعہ، کیونکہ یہ تنظیم اپنے پروگراموں اور اپنے بانی کی گفتگو کی ریکارڈنگ چینل پر اپ لوڈ کرتی ہے۔"
