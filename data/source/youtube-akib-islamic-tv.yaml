reliability_note: "The creator's own channel: a primary source for his identity, his self-presentation and his output, not independent corroboration of biography. Its About text, read on 9 November 2026, opens 'Assalamu Alaikum, I'm Akib Ahmed, a content creator and influencer' — a marketing self-description — and its keywords name 'islamic natok' and 'Islamic short film'. His own videos' descriptions (2025–2026) credit the productions to Creative Media and repeat a credit pattern: on 'Vikkhar Babsa' (2025), 'Chacha M.P.' (2025) and 'Onnayer Poton' (2025) he is named Cast, Director and Script Writer / Playwright; on some titles ('Kormocharir Koshto'; 'Jora Kobor', 2026) another man directs while he remains script writer and cast, so the credits vary by title and no single title should be generalised. The descriptions pin his own social links: Instagram @akib_ahemed, a Facebook Page named 'Stunt Akib Ahemed' and a Facebook profile named 'Akib Ahmed'; no dated follower count for either could be read in this run, so none is carried. Recent uploads read on 9 November 2026 include 'Jora Kobor' (about two weeks earlier, about 2.3 million views), so the channel is active. It gives no birth date and names no school of law for him. Read on 9 November 2026."
