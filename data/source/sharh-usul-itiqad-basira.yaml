label: { ar: "شرح أصول اعتقاد أهل السنة والجماعة للالكائي، تخريج نشأت بن كمال المصري ⁦(دار البصيرة)⁩", en: "Al-Lalaka'i, Sharh Usul I'tiqad Ahl al-Sunna wa-al-Jama'a, ed. Nash'at ibn Kamal al-Misri (Dar al-Basira)" }
summary:
  ar: "نسخة كاملة من «شرح أصول اعتقاد أهل السنة والجماعة من الكتاب والسنة وإجماع الصحابة والتابعين ومن بعدهم» لأبي القاسم هبة الله بن الحسن بن منصور الطبري اللالكائي ⁦(ت 418هـ)⁩، خرّج أحاديثه وعلّق عليه أبو يعقوب نشأت بن كمال المصري، بإشراف مكتب دار البصيرة بالإسكندرية، ومعها دار الآثار بصنعاء؛ وفي آخرها كرامات أولياء الله؛ وفي أولها مقدمة المعتني مؤرخة بالقاهرة 14 جمادى الآخرة 1422هـ / 2 سبتمبر 2001م وترجمة للمؤلف."
  en: "A complete text of Sharh Usul I'tiqad Ahl al-Sunna wa-al-Jama'a by Abu al-Qasim Hibat Allah ibn al-Hasan ibn Mansur al-Tabari al-Lalaka'i (d. 418 AH), with hadith references and notes by Abu Ya'qub Nash'at ibn Kamal al-Misri, prepared under the Dar al-Basira office in Alexandria with Dar al-Athar, Sana'a; it ends with the Karamat Awliya' Allah, and opens with the editor's introduction dated Cairo, 14 Jumada II 1422 AH / 2 September 2001, and a life of the author."
title: "شرح أصول اعتقاد أهل السنة والجماعة من الكتاب والسنة وإجماع الصحابة والتابعين ومن بعدهم"
