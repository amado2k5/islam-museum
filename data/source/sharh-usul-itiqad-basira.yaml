label: { ar: "شرح أصول اعتقاد أهل السنة والجماعة للالكائي، تخريج نشأت بن كمال المصري ⁦(دار البصيرة)⁩", en: "Al-Lalaka'i, Sharh Usul I'tiqad Ahl al-Sunna wa-al-Jama'a, ed. Nash'at ibn Kamal al-Misri (Dar al-Basira)" }
summary:
  ar: "نسخة كاملة من «شرح أصول اعتقاد أهل السنة والجماعة من الكتاب والسنة وإجماع الصحابة والتابعين ومن بعدهم» لأبي القاسم هبة الله بن الحسن بن منصور الطبري اللالكائي ⁦(ت 418هـ)⁩، خرّج أحاديثه وعلّق عليه أبو يعقوب نشأت بن كمال المصري، بإشراف مكتب دار البصيرة بالإسكندرية، ومعها دار الآثار بصنعاء؛ وفي آخرها كرامات أولياء الله؛ وفي أولها مقدمة المعتني مؤرخة بالقاهرة 14 جمادى الآخرة 1422هـ / 2 سبتمبر 2001م وترجمة للمؤلف."
  en: "A complete text of Sharh Usul I'tiqad Ahl al-Sunna wa-al-Jama'a by Abu al-Qasim Hibat Allah ibn al-Hasan ibn Mansur al-Tabari al-Lalaka'i (d. 418 AH), with hadith references and notes by Abu Ya'qub Nash'at ibn Kamal al-Misri, prepared under the Dar al-Basira office in Alexandria with Dar al-Athar, Sana'a; it ends with the Karamat Awliya' Allah, and opens with the editor's introduction dated Cairo, 14 Jumada II 1422 AH / 2 September 2001, and a life of the author."
  es: "Texto completo de Sharh Usul I'tiqad Ahl al-Sunna wa-al-Jama'a de Abu al-Qasim Hibat Allah ibn al-Hasan ibn Mansur al-Tabari al-Lalaka'i (m. 418 AH), con referencias a hadices y notas de Abu Ya'qub Nash'at ibn Kamal al-Misri, preparado bajo la oficina de Dar al-Basira en Alejandría con Dar al-Athar, Sana'a; termina con Karamat Awliya' Allah y comienza con la introducción del editor fechada en El Cairo, 14 de Jumada II de 1422 AH / 2 de septiembre de 2001, y una biografía del autor."
  fr: "Texte intégral de Sharh Usul I'tiqad Ahl al-Sunna wa-al-Jama'a par Abu al-Qasim Hibat Allah ibn al-Hasan ibn Mansur al-Tabari al-Lalaka'i (mort en 418 AH), avec références aux hadiths et notes d'Abu Ya'qub Nash'at ibn Kamal al-Misri, préparé sous l'égide du bureau Dar al-Basira à Alexandrie avec Dar al-Athar, Sana'a; il se termine par les Karamat Awliya' Allah et s'ouvre sur l'introduction de l'éditeur datée du Caire, le 14 Jumada II 1422 AH / 2 septembre 2001, et une biographie de l'auteur."
  ur: "شرح اصول اعتقاد اہل السنۃ والجماعۃ کا مکمل متن از ابو القاسم ہیبت اللہ ابن الحسن بن منصور الطبری اللاکاعی ⁦(متوفی 418 ہجری)⁩، احادیث کے حوالہ جات کے ساتھ اور ابو یعقوب ناشتہ الباری، دفتر کامل الدارمصیرہ کے تحت تیار کردہ۔ دار الاطہر کے ساتھ اسکندریہ، صنعاء؛ اس کا اختتام کرامت اولیاء اللہ پر ہوتا ہے، اور اس کا آغاز قاہرہ، 14 جمادی الثانی 1422ھ / 2 ستمبر 2001، اور مصنف کی زندگی کے مدیر کے تعارف کے ساتھ ہوتا ہے۔"
title: "شرح أصول اعتقاد أهل السنة والجماعة من الكتاب والسنة وإجماع الصحابة والتابعين ومن بعدهم"
