summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن تاج الدين أحمد؛ تُستخدم لوقائع الكيان فقط. تروي مولده في دردريا بكاباسيا في 23 يوليو 1925، وعمله الشبابي في رابطة المسلمين ثم رابطة عوامي، وصياغته مسودة النقاط الست، وترؤسه حكومة بنغلاديش المؤقتة أثناء حرب التحرير سنة 1971، ووزارة المالية والتخطيط من 1972 إلى 1974، واستقالته، واعتقاله واغتياله داخل سجن دكا المركزي في 3 نوفمبر 1975. لا يحمل صندوق معلوماتها الحالي حقلًا للديانة."
  en: "English Wikipedia article on Tajuddin Ahmad; used for entity facts only. It recounts his birth at Dardaria, Kapasia, on 23 July 1925, his Muslim League youth work and Awami League career, his drafting of the Six Points, his leadership of the Provisional Government of Bangladesh during the 1971 Liberation War, his finance and planning ministry of 1972–1974, his resignation, and his arrest and assassination inside Dhaka Central Jail on 3 November 1975. Its current infobox carries no religion field."
  es: "Artículo de la Wikipedia en inglés sobre Tajuddin Ahmad; utilizado únicamente para datos sobre la persona. Relata su nacimiento en Dardaria, Kapasia, el 23 de julio de 1925, su labor en la Liga Musulmana y su trayectoria en la Liga Awami, la redacción de los Seis Puntos, su liderazgo del Gobierno Provisional de Bangladesh durante la Guerra de Liberación de 1971, su ministerio de finanzas y planificación entre 1972 y 1974, su dimisión y su arresto y asesinato en la cárcel central de Dhaka el 3 de noviembre de 1975. Su ficha informativa actual no incluye información sobre religión."
  fr: "Article de Wikipédia en anglais sur Tajuddin Ahmad; utilisé uniquement pour les informations sur l'entité. Il relate sa naissance à Dardaria, Kapasia, le 23 juillet 1925, son engagement au sein de la Ligue musulmane et de la Ligue Awami, la rédaction des Six Points, son rôle à la tête du gouvernement provisoire du Bangladesh pendant la guerre de libération de 1971, son ministère des Finances et de la Planification de 1972 à 1974, sa démission, ainsi que son arrestation et son assassinat à la prison centrale de Dhaka le 3 novembre 1975. Son infobox actuelle ne comporte pas de champ relatif à la religion."
  ur: "تاج الدین احمد پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 23 جولائی 1925 کو دردریا، کپاسیا میں ان کی پیدائش، مسلم لیگ کے نوجوانوں کے کام اور عوامی لیگ کے کیریئر، چھ نکات کا مسودہ، 1971 کی جنگ آزادی کے دوران بنگلہ دیش کی عارضی حکومت کی قیادت، 1972-1974 کی ان کی وزارت خزانہ اور منصوبہ بندی، ڈھاکہ کے اندر ان کی گرفتاری اور جیل کے اندر ان کی گرفتاری کے بارے میں بتایا گیا ہے۔ نومبر 1975۔ اس کے موجودہ انفو باکس میں کوئی مذہب نہیں ہے۔"
