summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن تاج الدين أحمد؛ تُستخدم لوقائع الكيان فقط. تروي مولده في دردريا بكاباسيا في 23 يوليو 1925، وعمله الشبابي في رابطة المسلمين ثم رابطة عوامي، وصياغته مسودة النقاط الست، وترؤسه حكومة بنغلاديش المؤقتة أثناء حرب التحرير سنة 1971، ووزارة المالية والتخطيط من 1972 إلى 1974، واستقالته، واعتقاله واغتياله داخل سجن دكا المركزي في 3 نوفمبر 1975. لا يحمل صندوق معلوماتها الحالي حقلًا للديانة."
  en: "English Wikipedia article on Tajuddin Ahmad; used for entity facts only. It recounts his birth at Dardaria, Kapasia, on 23 July 1925, his Muslim League youth work and Awami League career, his drafting of the Six Points, his leadership of the Provisional Government of Bangladesh during the 1971 Liberation War, his finance and planning ministry of 1972–1974, his resignation, and his arrest and assassination inside Dhaka Central Jail on 3 November 1975. Its current infobox carries no religion field."
