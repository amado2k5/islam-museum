reliability_note: >-
  Newspaper history column by I. A. Rehman summarising Dr Shah
  Mohammad Marri's scholarly history of the Baloch; read in full on
  31 October 2026. It is the record's source for Magsi as 'a poet,
  short-story writer, agitator' and first president of the
  Anjuman, for the party's 1931 objectives, and for his death in
  the Quetta earthquake of May 1935. Its 'Islamic society' objective
  is a party platform, not an attestation of Magsi's own school,
  and the record treats it as such.
