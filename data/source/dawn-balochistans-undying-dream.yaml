summary:
  ar: "مقال آي أ رحمن في صحيفة «دون» (6 فبراير 2020) عرضا للمجلد الرابع من تاريخ شاه محمد مري للبلوش: الصحوة السياسية البلوشية، وانتخاب يوسف عزيز مگسي رئيسا لأنجمن اتحاد البلوشان، ومؤتمرا جيكب آباد (1932) وحيدر آباد (1933)، وأهداف الحزب ومنها إقامة مجتمع إسلامي، ووفاة مگسي في زلزال كويته في مايو 1935 عن 27 عاما."
  en: "I. A. Rehman's Dawn column (6 February 2020) reviewing the fourth volume of Dr Shah Mohammad Marri's history of the Baloch: the Baloch political awakening, Yusuf Aziz Magsi's election as president of the Anjuman Ittehad-i-Balochan, the Jacobabad (1932) and Hyderabad (1933) conferences, the party's objectives including an Islamic society on non-exploitative ideals, and Magsi's death in the May 1935 Quetta earthquake aged twenty-seven."
title: "Balochistan's undying dream"
