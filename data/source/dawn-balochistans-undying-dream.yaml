label: { en: "Balochistan's undying dream — Dawn" }
summary:
  ar: "مقال آي أ رحمن في صحيفة «دون» ⁦(6 فبراير 2020)⁩ عرضا للمجلد الرابع من تاريخ شاه محمد مري للبلوش: الصحوة السياسية البلوشية، وانتخاب يوسف عزيز مگسي رئيسا لأنجمن اتحاد البلوشان، ومؤتمرا جيكب آباد (1932) وحيدر آباد (1933)، وأهداف الحزب ومنها إقامة مجتمع إسلامي، ووفاة مگسي في زلزال كويته في مايو 1935 عن 27 عاما."
  en: "I. A. Rehman's Dawn column (6 February 2020) reviewing the fourth volume of Dr Shah Mohammad Marri's history of the Baloch: the Baloch political awakening, Yusuf Aziz Magsi's election as president of the Anjuman Ittehad-i-Balochan, the Jacobabad (1932) and Hyderabad (1933) conferences, the party's objectives including an Islamic society on non-exploitative ideals, and Magsi's death in the May 1935 Quetta earthquake aged twenty-seven."
  es: "Columna de IA Rehman en Dawn (6 de febrero de 2020) que reseña el cuarto volumen de la historia de los baluchis del Dr. Shah Mohammad Marri: el despertar político baluchi, la elección de Yusuf Aziz Magsi como presidente de la Anjuman Ittehad-i-Balochan, las conferencias de Jacobabad (1932) y Hyderabad (1933), los objetivos del partido, incluyendo una sociedad islámica basada en ideales no explotadores, y la muerte de Magsi en el terremoto de Quetta de mayo de 1935 a la edad de veintisiete años."
  fr: "Chronique de IA Rehman dans Dawn (6 février 2020) analysant le quatrième volume de l'histoire du Baloutchistan par le Dr Shah Mohammad Marri: l'éveil politique baloutche, l'élection de Yusuf Aziz Magsi à la présidence de l'Anjuman Ittehad-i-Balochan, les conférences de Jacobabad (1932) et d'Hyderabad (1933), les objectifs du parti, notamment une société islamique fondée sur des idéaux non exploiteurs, et la mort de Magsi lors du tremblement de terre de Quetta en mai 1935, à l'âge de vingt-sept ans."
  ur: "آئی اے رحمان کا ڈان کالم ⁦(6 فروری 2020)⁩ ڈاکٹر شاہ محمد مری کی بلوچوں کی تاریخ کی چوتھی جلد کا جائزہ: بلوچ سیاسی بیداری، انجمن اتحاد بلوچان کے صدر یوسف عزیز مگسی کا انتخاب، جیکب آباد (1932) اور حیدر آباد ⁦(1933 میں ایک غیر جماعتی اجتماعی کانفرنس سمیت)⁩ آدرش، اور مئی 1935 کے کوئٹہ کے زلزلے میں مگسی کی موت، جس کی عمر ستائیس سال تھی۔"
  tr: "Aya Rahman'ın 'Dawn' gazetesinde (6 Şubat 2020) yayımlanan bir makalesi; Şah Muhammed Marri'nin Belucların Tarihi: Balochi Siyasi Uyanışı'nın dördüncü cildini, Yusuf Aziz Magsi'nin Belucen Birlik Konseyi başkanı seçilmesini, Jacobabad (1932) ve Haydarabad (1933) konferanslarını, partinin hedeflerini içeren İslami bir toplumun kurulması ve Magsi'nin Mayıs 1935'te 27 yaşında Kuveyt depreminden ölümü gibi konularda yer almaktadır."
  id: "Sebuah artikel oleh Aya Rahman di surat kabar 'Dawn' (6 Februari 2020) yang menyajikan volume keempat Sejarah Baloch karya Shah Muhammad Marri: Kebangkitan Politik Balochi, pemilihan Yusuf Aziz Magsi sebagai presiden Dewan Persatuan Balocha, konferensi Jacobabad (1932) dan Hyderabad (1933), tujuan partai termasuk pendirian masyarakat Islam, dan kematian Magsi dalam gempa bumi Kuwait pada Mei 1935 pada usia 27 tahun."
title: "Balochistan's undying dream"
