reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md). Read on 25 October 2026. It corroborates, independently of CAIR's own site, that Ibrahim Hooper is CAIR's National Communications Director. There is no standalone English Wikipedia article and no Wikidata item for Hooper himself was found in this run. The article also records that the United Arab Emirates, Texas and Florida have designated CAIR as a terrorist organisation — a designation CAIR disputes; that controversy is about the organisation, not a school attestation for Hooper."
