summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مجلس العلاقات الأمريكية الإسلامية ⁦(كير)⁩؛ تُستخدم لوقائع الكيان فقط. تذكر تأسيس المجلس في يونيو 1994 ومقره في واشنطن، وتسمّي إبراهيم هوبر مديرًا وطنيًا لاتصالاته ضمن قياداته."
  en: "English Wikipedia article on the Council on American-Islamic Relations (CAIR); used for entity facts only. It records CAIR's formation in June 1994 and its Washington, D.C. headquarters, and lists Ibrahim Hooper among its key people as National Communications Director."
  es: "Artículo de la Wikipedia en inglés sobre el Consejo de Relaciones Americano-Islámicas (CAIR); se utiliza únicamente para obtener información sobre la entidad. En él se registra la formación de CAIR en junio de 1994 y su sede en Washington, D.C., y se menciona a Ibrahim Hooper entre sus figuras clave como Director Nacional de Comunicaciones."
  fr: "Article de Wikipédia en anglais sur le Conseil des relations américano-islamiques (CAIR); utilisé uniquement pour des informations sur l'organisation. Il relate la création du CAIR en juin 1994 et son siège à Washington, D.C., et mentionne Ibrahim Hooper parmi ses figures clés en tant que directeur national de la communication."
  ur: "کونسل آن امریکن اسلامک ریلیشنز (CAIR) پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ جون 1994 میں CAIR کی تشکیل اور اس کے واشنگٹن، ڈی سی ہیڈکوارٹر کو ریکارڈ کرتا ہے، اور ابراہیم ہوپر کو نیشنل کمیونیکیشن ڈائریکٹر کے طور پر اپنے اہم لوگوں میں شامل کرتا ہے۔"
  tr: "Amerikan-İslami İlişkiler Konseyi (CARE) hakkında İngilizce Wikipedia makalesi; yalnızca varlık gerçekleri için kullanılır. Konseyin Haziran 1994'te Washington'da merkezli kurulmasından bahseder ve liderliğinde ulusal iletişim direktörü olarak İbrahim Huber atanmıştır."
  id: "Artikel Wikipedia berbahasa Inggris tentang Council on American-Islamic Relations (CARE); digunakan hanya untuk fakta entitas. Artikel tersebut menyebutkan pendirian dewan pada Juni 1994, yang berkantor pusat di Washington, dan menunjuk Ibrahim Huber sebagai direktur komunikasi nasionalnya di bawah kepemimpinannya."
