summary:
  ar: "مدخل رقية سخاوات حسين في بنغلابيديا، الموسوعة الوطنية لبنغلاديش، بقلم شاهدة أختر؛ تُستخدم لوقائع الكيان فقط. يفصّل تعلّمها في البيت على يد إخوتها، وزواجها سنة 1898 من سيد سخاوات حسين ووفاته سنة 1909، وتأسيسها مدرسة سخاوات التذكارية للبنات في باغالبور سنة 1909 ثم في كلكتا سنة 1911 وإدارتها لها أربعة وعشرين عاما، وتأسيسها جمعية نساء الإسلام سنة 1916، ووفاتها في كلكتا في 9 ديسمبر 1932."
  en: "Entry 'Hossain, Roquiah Sakhawat' in Banglapedia, the national encyclopedia of Bangladesh, by Shahida Akhter; used for entity facts only. It details her home learning with her brothers' help, her marriage in 1898 to Syed Sakhawat Hossain and his death in 1909, her founding of the Sakhawat Memorial Girls' School at Bhagalpur in 1909 and at Calcutta in 1911 and her twenty-four years running it, her founding of the Anjuman-e-Khawatin-e-Islam in 1916, and her death at Calcutta on 9 December 1932."
