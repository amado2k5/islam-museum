reliability_note: "A scholarly national encyclopedia entry, independent of Wikipedia in editorship; the English Wikipedia article in turn cites it throughout. Read in full on 25 October 2026. It styles her litterateur, educationist and social reformer who 'played a pioneering role in awakening Muslim women', spells her name Roquiah, gives her birth name as Roquiah Khatun and her literary name as Mrs RS Hossain, and adds detail the English article lacks or states more exactly: the school was started on 1 October 1909 at Bhagalpur with five students and set up at Calcutta at 13 Waliullah Lane on 16 March 1911 with eight students, upgraded to a Middle English school in 1917 and a High English school in 1931, with its moves to 13 European Asylum Lane (1931) and 162 Lower Circular Road (1932); its curriculum of Bangla, English, Urdu, Persian, home nursing, first aid, cooking, sewing, physical exercise and music; her arranging of horse-carriages so girls could travel in purdah and her training of teachers herself; the government's Muslim Women Training School at Calcutta set up in 1919 at her repeated urging; her two daughters who died in infancy; and the Anjuman's work paying girls' school costs, sheltering orphans and the destitute, aiding widows and setting up businesses for women's economic independence. It dates Sultana's Dream to 1908 (the English article's lead and works list give 1905, its marriage section 1908; both are recorded). It names no school for her."
