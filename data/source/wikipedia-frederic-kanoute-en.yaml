  ar: "مقالة ويكيبيديا الإنجليزية عن فريديريك كانوتيه؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته من ليون إلى إشبيلية واعتزاله سنة 2013، وشراءه مسجدًا في إشبيلية سنة 2007 من ماله الخاص."
  en: "English Wikipedia article on Frédéric Kanouté; used for entity facts only. It recounts his career from Lyon to Sevilla and his 2013 retirement, and his 2007 purchase of a Seville mosque out of his own pocket."
  es: "Artículo de la Wikipedia en inglés sobre Frédéric Kanouté; utilizado únicamente para obtener información sobre la persona. Narra su trayectoria desde Lyon hasta Sevilla, su retiro en 2013 y la compra, en 2007, de una mezquita en Sevilla con sus propios recursos."
  fr: "Article de Wikipédia en anglais sur Frédéric Kanouté; utilisé uniquement à des fins d’information sur l’entité. Il retrace sa carrière de Lyon à Séville et sa retraite en 2013, ainsi que l’acquisition en 2007 d’une mosquée à Séville à ses propres frais."
  ur: "Frédéric Kanouté پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں لیون سے سیویلا تک ان کے کیریئر اور ان کی 2013 کی ریٹائرمنٹ، اور 2007 میں اپنی جیب سے سیویل مسجد کی خریداری کا ذکر ہے۔"
  tr: "Frédéric Canute hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. León'dan Sevilla'ya yolculuğunu, 2013'te emekliliğini ve 2007'de kendi parasıyla Sevilla'da bir cami satın almasını anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Frédéric Canute; digunakan hanya untuk fakta entitas. Artikel ini menceritakan perjalanannya dari León ke Sevilla dan pensiunnya pada 2013, serta pembelian sebuah masjid di Sevilla pada 2007 dengan uangnya sendiri."
