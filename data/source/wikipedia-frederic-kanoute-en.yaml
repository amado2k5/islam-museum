reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and fetched by the recorded revision id, with the returned revision asserted equal before any claim was drawn. It gives him as born 2 September 1977 at Sainte-Foy-lès-Lyon, France, full name Frédéric Oumar Kanouté; Lyon, West Ham United, Tottenham Hotspur, Sevilla (2005–2012, two consecutive UEFA Cups in 2006 and 2007, 137 goals in 290 matches) and Beijing Guoan; named the 2007 African Footballer of the Year, the first player born outside Africa to win the award. Its text makes no statement naming a religion or school for him: it reports his practice — refusing a gambling sponsor's name on his shirt because gambling is against the principles of Islam, paying more than US$700,000 in 2007 to buy the Seville mosque whose premises were due to be sold, and fasting in Ramadan — and its categories file him under French Muslims, Malian Muslims and Converts to Islam. Category filings and reported practice are not a text attestation of a school."
