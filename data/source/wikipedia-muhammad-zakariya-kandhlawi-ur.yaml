summary:
  ar: "مقالة ويكيبيديا الأردية عن محمد زكريا الكاندهلوي؛ تصفه بأنه من أكابر علماء ديوبند، ابن محمد يحيى الكاندهلوي وابن أخي محمد إلياس الكاندهلوي، وتذكر كتابه المشهور «فضائل أعمال» وأنه نصاب جماعة التبليغ، ودراسته الأولى في كنكوه وحفظه القرآن على يد والده، دون تواريخ ميلاد أو وفاة ودون تسمية مذهب في متنها."
  en: "The Urdu Wikipedia article on Muhammad Zakariya Kandhlawi; it describes him as one of the elders of the Deoband scholars, the son of Muhammad Yahya Kandhlawi and the nephew of Muhammad Ilyas Kandhlawi, records his famous book Fada'il-e-A'mal as the Tablighi Jamaat's curriculum, and gives his early studies at Gangoh and his memorisation of the Qur'an under his father, with no birth or death dates and no school named in its prose."
