summary:
  ar: "مقالة ويكيبيديا الأردية عن محمد زكريا الكاندهلوي؛ تصفه بأنه من أكابر علماء ديوبند، ابن محمد يحيى الكاندهلوي وابن أخي محمد إلياس الكاندهلوي، وتذكر كتابه المشهور «فضائل أعمال» وأنه نصاب جماعة التبليغ، ودراسته الأولى في كنكوه وحفظه القرآن على يد والده، دون تواريخ ميلاد أو وفاة ودون تسمية مذهب في متنها."
  en: "The Urdu Wikipedia article on Muhammad Zakariya Kandhlawi; it describes him as one of the elders of the Deoband scholars, the son of Muhammad Yahya Kandhlawi and the nephew of Muhammad Ilyas Kandhlawi, records his famous book Fada'il-e-A'mal as the Tablighi Jamaat's curriculum, and gives his early studies at Gangoh and his memorisation of the Qur'an under his father, with no birth or death dates and no school named in its prose."
  es: "El artículo de Wikipedia en urdu sobre Muhammad Zakaria Kandhlawi lo describe como uno de los eruditos más destacados de Deoband, menciona su famoso libro Fada'il-eA'mal como el currículo de Tablighi Jamaat y da cuenta de sus primeros estudios en Gangoh y su memorización del Corán bajo la tutela de su padre, sin mencionar fechas de nacimiento ni de muerte ni nombrar ninguna escuela en su texto."
  fr: "L'article de Wikipédia en ourdou sur Muhammad Zakaria Kandhlawi; il le décrit comme l'un des aînés des érudits de Deoband, mentionne son célèbre livre Fada'il-eA'mal comme le programme d'études de la Tablighi Jamaat, et donne ses premières études à Gangoh et sa mémorisation du Coran sous la tutelle de son père, sans mentionner de dates de naissance ou de décès ni d'école dans son texte."
  ur: "محمد زکریا کاندھلوی پر اردو ویکیپیڈیا کا مضمون؛ اس میں ان کو دیوبند کے علماء کے بزرگوں میں سے ایک کے طور پر بیان کیا گیا ہے، ان کی مشہور کتاب فضیلۃ عامل کو تبلیغی جماعت کے نصاب کے طور پر درج کیا گیا ہے، اور گنگوہ میں ان کی ابتدائی تعلیم اور اپنے والد کے تحت قرآن مجید کا حفظ کیا گیا ہے، اس کی پیدائش یا وفات کی تاریخوں کے بغیر اور اس کے نثر میں کسی مکتب کا نام نہیں ہے۔"
