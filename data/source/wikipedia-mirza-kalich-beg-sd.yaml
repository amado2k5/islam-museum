reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. A long Sindhi biography drawing on his autobiography Sao Pan Karo Pano ('green leaf or black leaf'): it quotes him dating his own birth to 4 Muharram 1270 AH at Tando Thoro, Hyderabad — which converts to 7 October 1853, against the 4 October 1853 of the English and Urdu articles and Wikidata — and records a further variant of 7 October 1850 found in some places; the person record follows 4 October 1853 and records the variants. It details the Mirza family's Georgian origin, his grandfather Mirza Khusro Beg and father Fredunbeg at the Talpur court, the family's losses at the British conquest of Sindh in 1843, and his life and works at length. It names no school for him. Read on 24 October 2026."
