summary:
  ar: "مقال موسوعي عن محمد أوكور ⁦(مواليد 1979)⁩، لاعب كرة السلة التركي: ميلاده في يالوفا في 26 مايو 1979، وبطولة NBA سنة 2004 مع ديترويت، ومواسمه مع يوتا جاز، وتعيينه مدرباً لتطوير اللاعبين في فينيكس صنز سنة 2016. لا يذكر المقال شيئاً عن دينه."
  en: "Community-edited encyclopedia article, retrieved in full at the stated revision; it gives his birth at Yalova, Turkey, on 26 May 1979, his Turkish club years, the 2004 NBA championship with Detroit, seven seasons with the Utah Jazz and his 2016 appointment as a Phoenix Suns player development coach. It contains no religion content."
  es: "Artículo de enciclopedia editado por la comunidad, recuperado íntegramente en la revisión indicada; en él se detalla su nacimiento en Yalova, Turquía, el 26 de mayo de 1979, su trayectoria en clubes turcos, el campeonato de la NBA de 2004 con Detroit, sus siete temporadas con los Utah Jazz y su nombramiento en 2016 como entrenador de desarrollo de jugadores de los Phoenix Suns. No contiene contenido religioso."
  fr: "Article encyclopédique collaboratif, consulté intégralement à la date indiquée; il retrace sa naissance à Yalova, en Turquie, le 26 mai 1979, ses années en club en Turquie, son titre de champion NBA en 2004 avec Detroit, ses sept saisons avec le Utah Jazz et sa nomination en 2016 comme entraîneur au développement des joueurs des Phoenix Suns. Il ne contient aucun élément religieux."
  ur: "کمیونٹی میں ترمیم شدہ انسائیکلوپیڈیا مضمون، بیان کردہ نظرثانی پر مکمل طور پر بازیافت کیا گیا؛ اس نے 26 مئی 1979 کو ترکی کے شہر یالووا میں جنم لیا، اس کے ترک کلب کے سال، ڈیٹرائٹ کے ساتھ 2004 کی این بی اے چیمپئن شپ، یوٹاہ جاز کے ساتھ سات سیزن اور 2016 میں فینکس سنز کے پلیئر ڈویلپمنٹ کوچ کے طور پر ان کی تقرری۔ اس میں کوئی مذہب کا مواد نہیں ہے۔"
