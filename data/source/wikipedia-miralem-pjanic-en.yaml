summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ميراليم بيانيتش؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في لوكسمبورغ ومسيرته مع ميتز وليون وروما ويوفنتوس وبرشلونة وسيسكا موسكو ومبارياته مع منتخب البوسنة، وتذكر في حياته الشخصية أنه مسلم وبوسني عرقيًا دون تسمية أي مذهب."
  en: "English Wikipedia article on Miralem Pjanić; used for entity facts only. It recounts his Luxembourg upbringing, his career at Metz, Lyon, Roma, Juventus, Barcelona and CSKA Moscow and his Bosnia and Herzegovina internationals, and states in its personal-life section that he is a Muslim and an ethnic Bosniak, without naming any school."
  es: "Artículo de la Wikipedia en inglés sobre Miralem Pjanić; utilizado únicamente para datos sobre la persona. Relata su infancia en Luxemburgo, su carrera en el Metz, el Lyon, la Roma, la Juventus, el Barcelona y el CSKA Moscú, así como sus partidos internacionales con Bosnia y Herzegovina. En la sección sobre su vida personal, afirma que es musulmán y de etnia bosniaca, sin mencionar ninguna escuela."
  fr: "L'article de Wikipédia en anglais consacré à Miralem Pjanić, utilisé uniquement à des fins d'information sur l'entité, relate son enfance au Luxembourg, sa carrière à Metz, Lyon, la Roma, la Juventus, Barcelone et le CSKA Moscou, ainsi que ses sélections en équipe nationale de Bosnie-Herzégovine. La section consacrée à sa vie personnelle précise qu'il est musulman et d'origine bosniaque, sans toutefois mentionner d'établissement scolaire."
  ur: "میرالم پجانیچ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کی لکسمبرگ کی پرورش، میٹز، لیون، روما، جووینٹس، بارسلونا اور CSKA ماسکو اور اس کے بوسنیا اور ہرزیگووینا انٹرنیشنلز میں اس کے کیریئر کا ذکر کیا گیا ہے، اور اس کے ذاتی زندگی کے حصے میں کہا گیا ہے کہ وہ ایک مسلمان اور نسلی بوسنیاک ہیں، بغیر کسی اسکول کا نام لیے۔"
