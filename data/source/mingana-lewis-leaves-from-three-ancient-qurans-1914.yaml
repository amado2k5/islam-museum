label:
  ar: "ألفونس منگانا وأغنس سميث لويس، أوراق من ثلاثة مصاحف قديمة ⁦(كامبريدج، 1914)⁩"
  en: "Alphonse Mingana and Agnes Smith Lewis (eds), Leaves from Three Ancient Qurans, Possibly Pre-Othmanic, with a List of their Variants (Cambridge: Cambridge University Press, 1914)"
summary:
  ar: "نشرة لأوراق قرآنية ممحوّة تحت مواعظ عربية مسيحية في رقّ طرسي اشترته لويس سنة 1895، مع مقدمة وقائمة بما رأى الناشران أنه اختلافات عن النص المتداول."
  en: "Edition of Qur'anic leaves erased beneath Christian Arabic homilies in a palimpsest Lewis bought in 1895, with an introduction and a list of what the editors took to be variants from the received text."
  es: "Edición de hojas coránicas borradas bajo homilías cristianas en árabe en un palimpsesto que Lewis compró en 1895, con una introducción y una lista de lo que los editores consideraron variantes del texto recibido."
  fr: "Édition de feuilles coraniques effacées sous des homélies arabes chrétiennes dans un palimpseste que Lewis a acheté en 1895, avec une introduction et une liste de ce que les éditeurs considéraient comme des variantes du texte reçu."
  ur: "1895 میں خریدے گئے ایک palimpsest Lewis میں عیسائی عربی homilies کے نیچے مٹائے گئے قرآنی پتوں کا ایڈیشن، ایک تعارف اور ایک فہرست کے ساتھ جو ایڈیٹرز نے موصول شدہ متن سے مختلف شکلوں کے طور پر لیا تھا۔"
  tr: "Louis tarafından 1895'te satın alınan, Tarsi parşömeniyle Arap-Hristiyan vaazlarının altında silinmiş Kur'an sayfalarından oluşan bir broşür, giriş ve yayınevlerinin dolaşıma sokulan metinden fark olarak gördüklerini içeren bir listeyle."
  id: "Sebuah pamflet halaman Al-Qur'an yang dihapus di bawah khotbah Arab-Kristen dalam perkamen Tarsi yang dibeli oleh Louis pada tahun 1895, dengan pengantar dan daftar apa yang dianggap penerbit sebagai perbedaan dari teks yang beredar."
