summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الربع المجيب؛ لوقائع الكيان فقط: ربع دائرة خشبية أو نحاسية مقسمة إلى تسعين درجة، بخيط ثقال ولوحتي تصويب ثقبيتين، ضلعان مستقيمان مقسمان إلى ستين وحدة سدسية، يقيس ارتفاع الشمس والأجرام، يعين الوقت والاتجاهات ويجري حسابات مثلثية، وصفه الخوارزمي في بغداد القرن التاسع واستُعمل لتحديد أوقات الصلاة، وللنسخة الملاحية هيئة مجردة."
  en: "English Wikipedia article on the sine quadrant (rub mujayyab); entity facts only: a quarter-circle of wood or brass divided into ninety degrees, with a weighted plumb cord (khait) and two pinhole sighting plates, straight sides divided into sixty sexagesimal units, measuring solar and celestial altitude, telling time, finding directions and performing trigonometric computation, described by al-Khwarizmi in ninth-century Baghdad and used for determining prayer times, with a skeletal maritime version."
  es: "Artículo de la Wikipedia en inglés sobre el cuadrante sinusoidal (rub mujayyab); solo datos sobre la entidad: un cuarto de círculo de madera o latón dividido en noventa grados, con una cuerda de plomada con peso (khait) y dos placas de puntería con orificios, lados rectos divididos en sesenta unidades sexagesimales, que mide la altitud solar y celeste, indica la hora, encuentra direcciones y realiza cálculos trigonométricos, descrito por al-Juarismi en el Bagdad del siglo IX y utilizado para determinar los horarios de oración, con una versión marítima esquelética."
  fr: "Article de Wikipédia en anglais sur le quadrant sinus (rub mujayyab); informations sur l'objet uniquement: un quart de cercle en bois ou en laiton divisé en quatre-vingt-dix degrés, avec un fil à plomb lesté (khait) et deux plaques de visée à trous d'épingle, côtés droits divisés en soixante unités sexagésimales, mesurant l'altitude solaire et céleste, indiquant l'heure, trouvant des directions et effectuant des calculs trigonométriques, décrit par al-Khwarizmi à Bagdad au IXe siècle et utilisé pour déterminer les heures de prière, avec une version maritime squelettique."
