summary:
  ar: "تقرير موقع إيكوال تايمز في أغسطس 2016 بعد شهر من وفاة عبد الستار إيدهي؛ يُستخدم لوقائع الكيان فقط. يروي تصريحات فيصل إيدهي للصحفيين في كراتشي في 13 يوليو 2016 مدافعًا عن المؤسسة ضد الدعاية السلبية، والجدل الذي أثاره المتشددون حول تبرع أبيه بقرنيتيه وقبول المؤسسة الرضّع المتروكين، وشهادة الناشط الحقوقي آي. أي. رحمن بأن إيدهي «لم يكن ضد الدين بل هاجم التديّن بلا هوادة»."
  en: "Equal Times report of August 2016, one month after Abdul Sattar Edhi's death; used for entity facts only. It records Faisal Edhi's statements to journalists at Karachi on 13 July 2016 defending the foundation against negative propaganda, the hardline controversy over his father's cornea donation and the foundation's sheltering of abandoned infants, and the human-rights activist I. A. Rehman's testimony that Edhi 'was not against religion but he attacked religiosity relentlessly'."
  es: "Informe de Equal Times de agosto de 2016, un mes después de la muerte de Abdul Sattar Edhi; utilizado únicamente para datos sobre la entidad. Recopila las declaraciones de Faisal Edhi a periodistas en Karachi el 13 de julio de 2016, en las que defendía a la fundación contra la propaganda negativa, la polémica en torno a la donación de córneas de su padre y el acogimiento de bebés abandonados por parte de la fundación, y el testimonio del activista de derechos humanos IA Rehman, quien afirmó que Edhi \"no estaba en contra de la religión, pero atacaba la religiosidad sin descanso\"."
  fr: "Rapport d'Equal Times d'août 2016, un mois après la mort d'Abdul Sattar Edhi; utilisé uniquement à titre d'information sur l'entité. Il relate les déclarations de Faisal Edhi aux journalistes à Karachi le 13 juillet 2016, défendant la fondation contre la propagande négative, la controverse radicale concernant le don de cornée de son père et l'accueil d'enfants abandonnés par la fondation, ainsi que le témoignage du militant des droits de l'homme IA Rehman selon lequel Edhi « n'était pas contre la religion, mais il s'attaquait sans relâche à la religiosité »."
  ur: "عبدالستار ایدھی کی موت کے ایک ماہ بعد اگست 2016 کی ایکول ٹائمز کی رپورٹ؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں فیصل ایدھی کے 13 جولائی 2016 کو کراچی میں صحافیوں کے سامنے بیانات ریکارڈ کیے گئے ہیں جو منفی پروپیگنڈے کے خلاف فاؤنڈیشن کا دفاع کرتے ہیں، ان کے والد کے کارنیا عطیہ پر سخت گیر تنازعہ اور لاوارث شیر خوار بچوں کو فاؤنڈیشن کی پناہ گاہیں، اور انسانی حقوق کے کارکن آئی اے رحمٰن کی گواہی کے خلاف مذہب پر حملہ نہیں کیا گیا۔ بے لگام'"
title: "One month on, Pakistan still mourns its 'Angel of Mercy'"
