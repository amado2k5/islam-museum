reliability_note: "Read on 27 October 2026. A dated news report from the month after Abdul Sattar Edhi's death (8 July 2016); its account of the Federal Shariat Court's 2009 organ-donation ruling and of Faisal Edhi's 13 July 2016 press statements is contemporary reporting. It is used for two facts only: that Faisal Edhi was the foundation's public head and spokesman immediately after his father's death, and that the accusations against the family were accusations by opponents — not attestations of anyone's affiliation."
