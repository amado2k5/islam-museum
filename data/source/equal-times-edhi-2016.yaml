summary:
  ar: "تقرير موقع إيكوال تايمز في أغسطس 2016 بعد شهر من وفاة عبد الستار إيدهي؛ يُستخدم لوقائع الكيان فقط. يروي تصريحات فيصل إيدهي للصحفيين في كراتشي في 13 يوليو 2016 مدافعًا عن المؤسسة ضد الدعاية السلبية، والجدل الذي أثاره المتشددون حول تبرع أبيه بقرنيتيه وقبول المؤسسة الرضّع المتروكين، وشهادة الناشط الحقوقي آي. أي. رحمن بأن إيدهي «لم يكن ضد الدين بل هاجم التديّن بلا هوادة»."
  en: "Equal Times report of August 2016, one month after Abdul Sattar Edhi's death; used for entity facts only. It records Faisal Edhi's statements to journalists at Karachi on 13 July 2016 defending the foundation against negative propaganda, the hardline controversy over his father's cornea donation and the foundation's sheltering of abandoned infants, and the human-rights activist I. A. Rehman's testimony that Edhi 'was not against religion but he attacked religiosity relentlessly'."
