summary:
  ar: "صفحة «مُنجِّم» في موسوعة TDV الإسلامية، وتعرّف المنجّم بأنه من يشتغل بعلم قائم على اعتقاد أن النجوم تؤثر في الناس والأحداث، وتحيل إلى أحكام النجوم وإلى منصب المنجّم باشي."
  en: "The TDV İslâm Ansiklopedisi page 'MÜNECCİM', which defines the munajjim as a practitioner of the discipline based on the belief that the stars affect people and events, and refers the reader to astrology (ilm-i ahkam-i nucum) and to the office of müneccimbaşı."
  es: "La página 'MÜNECCİM' de la TDV İslâm Ansiklopedisi define al munajjim como un practicante de la disciplina basada en la creencia de que las estrellas afectan a las personas y los eventos, y remite al lector a la astrología (ilm-i ahkam-i nucum) y al cargo de müneccimbaşı."
  fr: "La page « MÜNECCİM » de TDV İslâm Ansiklopedisi définit le munajjim comme un praticien de la discipline basée sur la croyance que les étoiles affectent les personnes et les événements, et renvoie le lecteur à l'astrologie (ilm-i ahkam-i nucum) et au bureau du müneccimbaşı."
  ur: "TDV İslâm Ansiklopedisi صفحہ 'MÜNECCİM'، جو اس عقیدے کی بنیاد پر کہ ستارے لوگوں اور واقعات پر اثر انداز ہوتے ہیں، اور قاری کو علم نجوم (ilm-i ahkam-i nucum) اور müneccım کے دفتر کی طرف رجوع کرتا ہے، جو کہ مناجم کو نظم و ضبط کے ایک پریکٹیشنر کے طور پر بیان کرتا ہے۔"
  tr: "TDV İslami ansiklopedisindeki \"Astrolog\" sayfası, astrologları, yıldızların insanları ve olayları etkilediğine inanan bilgiyle çalışanlar olarak tanımlar; bu, yıldızların hükümlerine ve astrolog Bashi'nin konumuna atıfta bulunur."
  id: "Halaman \"Astrologer\" dalam ensiklopedia Islam TDV mendefinisikan astrolog sebagai mereka yang bekerja dengan pengetahuan berdasarkan keyakinan bahwa bintang memengaruhi orang dan peristiwa, merujuk pada aturan bintang dan posisi astrolog Bashi."
