summary:
  ar: "مقالة ويكيبيديا العربية عن عمر القزابري، إمام مسجد الحسن الثاني بالدار البيضاء؛ لوقائع الكيان فقط: مولده في 4 أغسطس 1974، وحفظه القرآن على أبيه أحمد القزابري، ودراسته بمدرسة ابن يوسف بمراكش، وسنواته في السعودية، وخطابته في مسجد الألفة، وقراءته العشر على أحمد عيسى المعصراوي، وإمامته في مسجد الحسن الثاني منذ رمضان 2005؛ وتنقل روايته من مقابلة مع قناة اقرأ."
  en: "Arabic Wikipedia article on Omar al-Qazabri, imam of the Hassan II Mosque in Casablanca; entity facts only: birth on 4 August 1974, memorisation under his father Ahmad al-Qazabri, schooling at the Ibn Yusuf school in Marrakesh, his years in Saudi Arabia, his preaching at the Ulfa mosque, the ten readings with Ahmad Isa al-Ma'sarawi, and his imamate at the Hassan II Mosque since Ramadan 2005; it relies on his interview with Iqraa TV."
  es: "Artículo en la Wikipedia en árabe sobre Omar al-Qazabri, imán de la mezquita Hassan II en Casablanca; solo datos sobre la persona: nacimiento el 4 de agosto de 1974, memorización con su padre Ahmad al-Qazabri, educación en la escuela Ibn Yusuf en Marrakech, sus años en Arabia Saudita, su predicación en la mezquita Ulfa, las diez lecturas con Ahmad Isa al-Ma'sarawi y su imamato en la mezquita Hassan II desde el Ramadán de 2005; se basa en su entrevista con Iqraa TV."
  fr: "Article de Wikipédia en arabe sur Omar al-Qazabri, imam de la mosquée Hassan II de Casablanca; informations uniquement sur l’entité: naissance le 4 août 1974, mémorisation auprès de son père Ahmad al-Qazabri, scolarité à l’école Ibn Yusuf de Marrakech, ses années en Arabie saoudite, ses prédications à la mosquée Ulfa, les dix lectures avec Ahmad Isa al-Ma’sarawi et son imamat à la mosquée Hassan II depuis le Ramadan 2005; il s’appuie sur son interview avec Iqraa TV."
  ur: "کاسابلانکا میں حسن II مسجد کے امام عمر القزابری پر عربی ویکیپیڈیا کا مضمون؛ ہستی کے حقائق صرف: 4 اگست 1974 کو پیدائش، اپنے والد احمد القزابری کے تحت حفظ، مراکش کے ابن یوسف اسکول میں تعلیم، سعودی عرب میں ان کے سال، الفا مسجد میں ان کی تبلیغ، احمد عیسیٰ المصراوی کے ساتھ دس قراءت، اور حسن دوم مسجد میں ان کی امامت؛ رمضان المبارک کے بعد سے یہ اقراء ٹی وی کے ساتھ ان کے انٹرویو پر انحصار کرتا ہے۔"
  tr: "Kazablanka'daki II. Hasan Camii İmamı Ömer El-Kazabri hakkında Arapça Vikipedi makalesi; sadece olaylar için: 4 Ağustos 1974'teki doğumu, babası Ahmed El-Kazabri yanında Kur'an'ı ezberlemesi, Marakeş'teki İbn Yusuf Okulu'ndaki eğitimi, Suudi Arabistan'daki yılları, El-Ulfa Camii'ndeki vaazı, Ahmed İssa El-Ma'savi'nin on kez okuması ve 2005 Ramazan'dan beri Hasan II Camii'deki imamı; anlatımı Iqraa kanalına verdiği bir röportajdan aktarılmaktadır."
  id: "Artikel Wikipedia Arab tentang Omar Al-Qazabri, Imam Masjid Hassan II di Casablanca; hanya untuk acara entitas: kelahirannya pada 4 Agustus 1974, hafalan Al-Qur'an di bawah ayahnya Ahmed Al-Qazabri, studinya di Sekolah Ibn Yusuf di Marrakech, tahun-tahunnya di Arab Saudi, khotbahnya di Masjid Al-Ulfa, sepuluh pembacaan Ahmed Issa Al-Ma'sawi, dan imamnya di Masjid Hassan II sejak Ramadan 2005; kisahnya dinarasikan dari wawancara dengan saluran Iqraa."
