summary:
  ar: "\u0645\u0642\u0627\u0644\u0629 \u0648\u064a\u0643\u064a\u0628\u064a\u062f\u064a\u0627 \u0627\u0644\u0639\u0631\u0628\u064a\u0629 \u0639\u0646 \u0639\u0645\u0631 \u0627\u0644\u0642\u0632\u0627\u0628\u0631\u064a\u060c \u0625\u0645\u0627\u0645 \u0645\u0633\u062c\u062f \u0627\u0644\u062d\u0633\u0646 \u0627\u0644\u062b\u0627\u0646\u064a \u0628\u0627\u0644\u062f\u0627\u0631 \u0627\u0644\u0628\u064a\u0636\u0627\u0621\u061b \u0644\u0648\u0642\u0627\u0626\u0639 \u0627\u0644\u0643\u064a\u0627\u0646 \u0641\u0642\u0637: \u0645\u0648\u0644\u062f\u0647 \u0641\u064a 4 \u0623\u063a\u0633\u0637\u0633 1974\u060c \u0648\u062d\u0641\u0638\u0647 \u0627\u0644\u0642\u0631\u0622\u0646 \u0639\u0644\u0649 \u0623\u0628\u064a\u0647 \u0623\u062d\u0645\u062f \u0627\u0644\u0642\u0632\u0627\u0628\u0631\u064a\u060c \u0648\u062f\u0631\u0627\u0633\u062a\u0647 \u0628\u0645\u062f\u0631\u0633\u0629 \u0627\u0628\u0646 \u064a\u0648\u0633\u0641 \u0628\u0645\u0631\u0627\u0643\u0634\u060c \u0648\u0633\u0646\u0648\u0627\u062a\u0647 \u0641\u064a \u0627\u0644\u0633\u0639\u0648\u062f\u064a\u0629\u060c \u0648\u062e\u0637\u0627\u0628\u062a\u0647 \u0641\u064a \u0645\u0633\u062c\u062f \u0627\u0644\u0623\u0644\u0641\u0629\u060c \u0648\u0642\u0631\u0627\u0621\u062a\u0647 \u0627\u0644\u0639\u0634\u0631 \u0639\u0644\u0649 \u0623\u062d\u0645\u062f \u0639\u064a\u0633\u0649 \u0627\u0644\u0645\u0639\u0635\u0631\u0627\u0648\u064a\u060c \u0648\u0625\u0645\u0627\u0645\u062a\u0647 \u0641\u064a \u0645\u0633\u062c\u062f \u0627\u0644\u062d\u0633\u0646 \u0627\u0644\u062b\u0627\u0646\u064a \u0645\u0646\u0630 \u0631\u0645\u0636\u0627\u0646 2005\u061b \u0648\u062a\u0646\u0642\u0644 \u0631\u0648\u0627\u064a\u062a\u0647 \u0645\u0646 \u0645\u0642\u0627\u0628\u0644\u0629 \u0645\u0639 \u0642\u0646\u0627\u0629 \u0627\u0642\u0631\u0623."
  en: "Arabic Wikipedia article on Omar al-Qazabri, imam of the Hassan II Mosque in Casablanca; entity facts only: birth on 4 August 1974, memorisation under his father Ahmad al-Qazabri, schooling at the Ibn Yusuf school in Marrakesh, his years in Saudi Arabia, his preaching at the Ulfa mosque, the ten readings with Ahmad Isa al-Ma'sarawi, and his imamate at the Hassan II Mosque since Ramadan 2005; it relies on his interview with Iqraa TV."
