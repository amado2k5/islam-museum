summary:
  ar: "مقالة ويكيبيديا العربية عن زكريا تامر؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في دمشق عام 1931 ⁦(السنة فقط)⁩ وتركه الدراسة عام 1944 ومسيرته وأعماله وجوائزه، ولا يحمل صندوق معلوماتها تاريخ ميلاد ولا يسمّي نصّها دينًا أو مذهبًا له."
  en: "Arabic Wikipedia article on Zakaria Tamer; used for entity facts only. It gives his birth at Damascus in 1931 (year only), his leaving school in 1944, his career, works and awards. Its infobox carries no birth date and its text names no religion or school for him."
  es: "Artículo de Wikipedia en árabe sobre Zakaria Tamer; se utiliza únicamente para obtener información sobre la persona. Indica que nació en Damasco en 1931 (solo el año), que dejó la escuela en 1944, su trayectoria profesional, sus obras y sus premios. Su ficha informativa no incluye la fecha de nacimiento y el texto no menciona su religión ni su escuela."
  fr: "Article Wikipédia en arabe sur Zakaria Tamer; utilisé uniquement pour les informations le concernant. Il indique sa naissance à Damas en 1931 (année seulement), son départ de l'école en 1944, sa carrière, ses œuvres et ses récompenses. Son infobox ne mentionne ni sa date de naissance, ni sa religion, ni son école."
  ur: "زکریا تیمر پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1931 میں دمشق میں ان کی پیدائش ⁦(صرف سال)⁩، 1944 میں اس کا اسکول چھوڑنا، اس کا کیریئر، کام اور ایوارڈز۔ اس کے معلوماتی خانے میں کوئی تاریخ پیدائش نہیں ہے اور اس کے متن میں اس کے لیے کوئی مذہب یا اسکول نہیں ہے۔"
