summary:
  ar: مقالة ويكيبيديا الأذربيجانية عن حسن بك زردابي؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في زرداب في 28 يونيو 1837 وتنبّه إلى أن بعض المصادر تعطي 1842، وتروي تعليمه وصحيفة «أكينجي» وعمله المسرحي مع نجف بك وزيروف وسنواته الأخيرة في باكو.
  en: Azerbaijani Wikipedia article on Hasan bey Zardabi; used for entity facts only. It gives his birth at Zardab on 28 June 1837, noting that some sources give 1842, and recounts his education, the Akinchi newspaper, his theatre work with Najaf bey Vazirov, and his later Baku years.
  es: "Artículo de la Wikipedia en azerbaiyano sobre Hasan bey Zardabi; utilizado únicamente para datos sobre la persona. Indica que nació en Zardab el 28 de junio de 1837, aunque algunas fuentes mencionan 1842, y relata su educación, su paso por el periódico Akinchi, su trabajo teatral con Najaf bey Vazirov y sus últimos años en Bakú."
  fr: "Article Wikipédia azerbaïdjanais sur Hasan bey Zardabi; utilisé uniquement à des fins d’information. Il indique sa naissance à Zardab le 28 juin 1837, tout en précisant que certaines sources mentionnent 1842, et relate son éducation, son travail au journal Akinchi, son engagement théâtral auprès de Najaf bey Vazirov et ses années passées à Bakou."
