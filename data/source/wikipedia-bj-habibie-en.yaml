reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Covers his birth at Parepare on 25 June 1936, his studies at Delft and RWTH Aachen (Diplom-Ingenieur 1960, doctorate 1965), his work at Messerschmitt-Bölkow-Blohm and on the Airbus A300B, his return to Indonesia in 1974, the founding and growth of IPTN and the N-250, his ministry of research and technology (1978-1998), his chairmanship of the Indonesian Association of Muslim Intellectuals (ICMI) from 1990, his vice-presidency and 517-day presidency (1998-1999) with the East Timor referendum and the political reforms, his post-presidency and the Habibie Centre, and his death at Jakarta on 11 September 2019 and burial at Kalibata Heroes' Cemetery. The article names no school of Islam for him. Read in full on 24 October 2026."
