summary:
  ar: "مقالة ويكيبيديا العربية عن عاطفة يحيى آغا؛ تُستخدم لوقائع الكيان فقط، تؤكد رئاستها لكوسوفو من 7 أبريل 2011 إلى 7 أبريل 2016 وميلادها في جاكوفا ودراستها، وتذكر أنها تنحدر من أسرة مسلمة، وهي خلفية أسرية لا شهادة على مدرسة."
  en: "Arabic Wikipedia article on Atifete Jahjaga; used for entity facts only, confirming her presidency of Kosovo from 7 April 2011 to 7 April 2016, her Gjakova birth and her studies; it says she descends from a Muslim family — family background, not an attestation of a school."
  es: "Artículo en árabe de la Wikipedia sobre Atifete Jahjaga; utilizado únicamente para datos sobre la persona, confirmando su presidencia de Kosovo del 7 de abril de 2011 al 7 de abril de 2016, su nacimiento en Gjakova y sus estudios; dice que desciende de una familia musulmana (antecedentes familiares, no una certificación de una escuela)."
  fr: "Article de Wikipédia en arabe sur Atifete Jahjaga; utilisé uniquement pour des informations sur l’entité, confirmant sa présidence du Kosovo du 7 avril 2011 au 7 avril 2016, sa naissance à Gjakova et ses études; il indique qu’elle descend d’une famille musulmane — origine familiale, et non une attestation scolaire."
  ur: "عربی ویکیپیڈیا کا مضمون عاطفے جہجگا پر؛ 7 اپریل 2011 سے 7 اپریل 2016 تک کوسوو کی اس کی صدارت، اس کی گجاکووا کی پیدائش اور اس کی تعلیم کی تصدیق کرتے ہوئے، صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا کہنا ہے کہ وہ ایک مسلم خاندان سے تعلق رکھتی ہیں - خاندانی پس منظر، کسی اسکول کی تصدیق نہیں۔"
