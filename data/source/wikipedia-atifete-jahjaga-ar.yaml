reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. A short article, read in full on 25 October 2026. It confirms her presidency from 7 April 2011 to 7 April 2016, her birth on 20 April 1975 at Gjakova, her direction of national security before her election, her law degree from the University of Pristina in 2000, her July 2006 Leicester programme in police management and criminal law, and her training at the George C. Marshall Center and the FBI National Academy; it notes that her election met internal controversy and European welcome. Its personal-life sentence — that she descends from a Muslim family, is married and has no children — is family background, which the lane's faith rules never count, and it names no school for her."
