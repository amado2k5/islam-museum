summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن زين العابدين بن أحمد الكاتب المعروف بـ«زعبا»؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 16 أيلول 1895 في باتو كيكير بنكري سمبيلن، ومساره في التدريس في ملايا وسنغافورة وكلية الدراسات الشرقية في لندن، وسلسلة «بليتا بهاسا» ونظام زعبا للإملاء الملايوي، ومقالاته وترجماته لشكسبير، ووفاته في 23 تشرين الأول 1973 في بتالينغ جايا ودفنه في مقبرة جالان أمبانغ الإسلامية بكوالالمبور. لا يحمل صندوق معلوماتها حقل ديانة ولا يذكر متنها ديانته."
  en: "English Wikipedia article on Zainal Abidin Ahmad (writer), known as Za'ba; used for entity facts only. It gives his birth on 16 September 1895 at Batu Kikir, Negeri Sembilan, his teaching career in Malaya and Singapore and at the School of Oriental and African Studies in London, his Pelita Bahasa grammar series and the Za'aba spelling system, his essays and Shakespeare translations, and his death on 23 October 1973 at Petaling Jaya, with burial at the Jalan Ampang Muslim Cemetery, Kuala Lumpur. Its infobox carries no religion field."
  es: "Artículo de la Wikipedia en inglés sobre Zainal Abidin Ahmad (escritor), conocido como Za'ba; utilizado únicamente para datos biográficos. Indica su nacimiento el 16 de septiembre de 1895 en Batu Kikir, Negeri Sembilan, su trayectoria docente en Malasia y Singapur, así como en la Escuela de Estudios Orientales y Africanos de Londres, su serie de gramáticas Pelita Bahasa y el sistema ortográfico Za'aba, sus ensayos y traducciones de Shakespeare, y su fallecimiento el 23 de octubre de 1973 en Petaling Jaya, con sepultura en el cementerio musulmán de Jalan Ampang, Kuala Lumpur. Su ficha informativa no incluye información sobre religión."
  fr: "L'article de Wikipédia en anglais consacré à Zainal Abidin Ahmad (écrivain), dit Za'ba, ne contient que des informations sur l'individu. Il indique sa naissance le 16 septembre 1895 à Batu Kikir, dans l'État de Negeri Sembilan, sa carrière d'enseignant en Malaisie et à Singapour, ainsi qu'à la School of Oriental and African Studies de Londres, sa série de grammaires « Pelita Bahasa » et le système orthographique Za'aba, ses essais et ses traductions de Shakespeare, et son décès le 23 octobre 1973 à Petaling Jaya, avec inhumation au cimetière musulman de Jalan Ampang, à Kuala Lumpur. Son infobox ne comporte pas de champ relatif à la religion."
