summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن زين العابدين بن أحمد الكاتب المعروف بـ«زعبا»؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 16 أيلول 1895 في باتو كيكير بنكري سمبيلن، ومساره في التدريس في ملايا وسنغافورة وكلية الدراسات الشرقية في لندن، وسلسلة «بليتا بهاسا» ونظام زعبا للإملاء الملايوي، ومقالاته وترجماته لشكسبير، ووفاته في 23 تشرين الأول 1973 في بتالينغ جايا ودفنه في مقبرة جالان أمبانغ الإسلامية بكوالالمبور. لا يحمل صندوق معلوماتها حقل ديانة ولا يذكر متنها ديانته."
  en: "English Wikipedia article on Zainal Abidin Ahmad (writer), known as Za'ba; used for entity facts only. It gives his birth on 16 September 1895 at Batu Kikir, Negeri Sembilan, his teaching career in Malaya and Singapore and at the School of Oriental and African Studies in London, his Pelita Bahasa grammar series and the Za'aba spelling system, his essays and Shakespeare translations, and his death on 23 October 1973 at Petaling Jaya, with burial at the Jalan Ampang Muslim Cemetery, Kuala Lumpur. Its infobox carries no religion field."
