summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن بليز دياني؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في غوريه سنة 1872 وتبنّي عائلة كريسبان المسيحية له وتعميدها إياه، وانتسابه إلى الماسونية سنة 1899، ومسيرته نائبًا عن البلدات الأربع ووفاته سنة 1934."
  en: "English Wikipedia article on Blaise Diagne; used for entity facts only. It recounts his birth at Gorée in 1872, his adoption and baptism by the Christian Crespin family, his becoming a freemason in 1899, his career as deputy for the Four Communes, and his death in 1934."
  es: "Artículo de la Wikipedia en inglés sobre Blaise Diagne; se utiliza únicamente para obtener información sobre la persona. Relata su nacimiento en Gorée en 1872, su adopción y bautismo por la familia cristiana Crespin, su ingreso en la masonería en 1899, su carrera como diputado de las Cuatro Comunas y su fallecimiento en 1934."
  fr: "Article de Wikipédia en anglais sur Blaise Diagne; utilisé uniquement à des fins d’information sur l’entité. Il relate sa naissance à Gorée en 1872, son adoption et son baptême par la famille Christian Crespin, son initiation à la franc-maçonnerie en 1899, sa carrière de député des Quatre Communes et sa mort en 1934."
  ur: "Blaise Diagne پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1872 میں گوری میں اس کی پیدائش، کرسچن کریسپین خاندان کی طرف سے اس کی گود لینے اور بپتسمہ لینے، 1899 میں اس کا فری میسن بننے، فور کمیون کے نائب کے طور پر اس کا کیریئر، اور 1934 میں اس کی موت کا ذکر ہے۔"
  tr: "Belize Diani hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1872'de Gourieh'deki doğumunu, Hristiyan evlat edinilmesini ve Crispan'ın ailesi tarafından vaftiz edilmesini, 1899'da Masonluk üyeliğini, dört kasabanın milletvekili olarak kariyerini ve 1934'teki ölümünü anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Belize Diani; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya di Gourieh pada tahun 1872, adopsi dan pembaptisan Kristen oleh keluarga Crispan, keanggotaannya dalam Freemasonry pada tahun 1899, kariernya sebagai deputi untuk empat kota, dan kematiannya pada tahun 1934."
