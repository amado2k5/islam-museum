  ar: "مقالة ويكيبيديا الإنجليزية عن بليز دياني؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في غوريه سنة 1872 وتبنّي عائلة كريسبان المسيحية له وتعميدها إياه، وانتسابه إلى الماسونية سنة 1899، ومسيرته نائبًا عن البلدات الأربع ووفاته سنة 1934."
  en: "English Wikipedia article on Blaise Diagne; used for entity facts only. It recounts his birth at Gorée in 1872, his adoption and baptism by the Christian Crespin family, his becoming a freemason in 1899, his career as deputy for the Four Communes, and his death in 1934."
