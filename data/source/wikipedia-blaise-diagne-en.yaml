reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision; the article carries a 'more footnotes needed' banner, so its uncited detail is used with care. It gives his birth at Gorée on 13 October 1872 to a Lebu father and a Manjack mother, his adoption by the Christian Crespin family, who baptised him 'Blaise', his joining a Grand Orient de France lodge in Réunion in September 1899, his election of 10 May 1914, the 1916 citizenship law, his recruitment work in the First World War, and his death at Cambo-les-Bains on 11 May 1934. It names no personal religious affiliation for him; its only religion-adjacent statement is the allegation that he was not buried in the Muslim cemetery of Soumbedioune in Dakar because of his freemasonry."
