summary:
  ar: "مقالة ويكيبيديا العربية عن هزاع البلوشي؛ تُستخدم لوقائع الكيان فقط: اسمه الكامل وولادته في ولاية لوى بعُمان سنة 1995 وحفظه القرآن صغيرًا وانتشار تلاوته سنة 2013 وإمامته في مساجد عدة منها جامع الشيخ زايد الكبير بأبوظبي ودراسته الحالية للشريعة بجامعة الشارقة."
  en: "Arabic Wikipedia article on Hazaa Al-Balushi; used for entity facts only: his full name, his birth in Liwa, Oman, in 1995, his childhood memorisation of the Qur'an, the spread of his recitation from 2013, his imamate at mosques including the Sheikh Zayed Grand Mosque in Abu Dhabi, and his current Sharia studies at the University of Sharjah."
  es: "Artículo en árabe de la Wikipedia sobre Hazaa Al-Balushi; utilizado únicamente para datos sobre la persona: su nombre completo, su nacimiento en Liwa, Omán, en 1995, su memorización del Corán en la infancia, la difusión de su recitación desde 2013, su imamato en mezquitas, incluida la Gran Mezquita Sheikh Zayed en Abu Dabi, y sus estudios actuales de la Sharia en la Universidad de Sharjah."
  fr: "Article de Wikipédia en arabe sur Hazaa Al-Balushi; utilisé uniquement pour les faits concernant l’entité: son nom complet, sa naissance à Liwa, Oman, en 1995, sa mémorisation du Coran durant son enfance, la diffusion de sa récitation à partir de 2013, son imamat dans des mosquées, notamment la Grande Mosquée Sheikh Zayed à Abu Dhabi, et ses études actuelles de charia à l’Université de Sharjah."
