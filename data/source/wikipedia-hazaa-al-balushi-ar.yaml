reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md). Fetched by revision id through the MediaWiki API on 26 October 2026; the returned revision id equals the recorded one. The article gives Hazaa bin Abdullah bin Salim Al-Balushi, born 1995 in Liwa, Oman, an Omani Qur'an reciter; memorisation begun at six and finished at fourteen (the English article gives seven and thirteen); economics and political science studies begun at Sultan Qaboos University and current Sharia studies (fiqh and its principles) at the University of Sharjah; fame from a friend's recording in 2013; taraweeh imamate in Britain, Indonesia, Kuwait, the Emirates, Bahrain and Qatar in 2014; jury chairmanship at international Qur'an competitions in Ingushetia and Saratov, Russia; and a list of mosques he has led, headed by the Sheikh Zayed Grand Mosque in Abu Dhabi. Its infobox gives his religion as Muslim and leaves the madhhab and creed fields empty."
