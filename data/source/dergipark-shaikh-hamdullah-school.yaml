  en: "Shaikh Hamdullah School in the Art of Turkish Calligraphy — Motif Akademi Halkbilimi Dergisi (2023)"
summary:
  ar: "دراسة أكاديمية محكّمة ⁦(سجيل سيفير دمير، 2023)⁩ عن مدرسة الشيخ حمد الله (1436–1520) في الخط التركي: تطويره الأقلام الستة، وصيرورة نسخِه الطريقة المفضلة لكتابة المصاحف في العالم الإسلامي، وأعماله من مصاحف ولوحات ومرقّعات في مجموعات عالمية."
  en: "Peer-reviewed journal study (Seçil Sever Demir, 2023) of the Shaikh Hamdullah school (1436–1520) in Turkish calligraphy: his Ottoman recasting of the six scripts, his naskh becoming the preferred method of transcribing the Qur'an across the Islamic world, and his Qur'ans, panels and muraqqas in collections worldwide, studied through a Metropolitan Museum muraqqa."
  es: "Estudio revisado por pares (Seçil Sever Demir, 2023) sobre la escuela de Shaikh Hamdullah (1436-1520) en caligrafía turca: su reinterpretación otomana de los seis alfabetos, su naskh convirtiéndose en el método preferido para transcribir el Corán en todo el mundo islámico, y sus Coranes, paneles y muraqqas en colecciones de todo el mundo, estudiados a través de una muraqqa del Museo Metropolitano."
  fr: "Étude publiée dans une revue à comité de lecture (Seçil Sever Demir, 2023) sur l'école de Cheikh Hamdullah (1436-1520) en calligraphie turque: sa réinterprétation ottomane des six écritures, son naskh devenant la méthode préférée de transcription du Coran dans le monde islamique, et ses Corans, panneaux et muraqqas dans les collections du monde entier, étudiés à travers un muraqqa du Metropolitan Museum."
  ur: "ترکی کی خطاطی میں شیخ حمد اللہ مکتبہ (1436–1520) کا ہم مرتبہ نظرثانی شدہ جریدہ مطالعہ (Seçil Sever Demir, 2023): اس کی عثمانی چھ رسم الخط کی دوبارہ ترتیب، اس کا نسخ پوری اسلامی دنیا میں قرآن کی نقل کرنے کا پسندیدہ طریقہ بن گیا، اور اس کے مجموعے قرآن، اور اس کے مجموعے قرآن۔ ایک میٹروپولیٹن میوزیم مراقہ کے ذریعے مطالعہ کیا۔"
  tr: "Şeyh Hamdallah'ın (1436–1520) Türk hat sanatı okulu üzerine hakemli akademik çalışma (Sijil Sefir Demir, 2023): altı kalemin gelişimi, İslam dünyasında Kur'an yazmanın tercih edilen yöntemi olarak kopyalarının evrimi ve küresel koleksiyonlardaki Kur'an, levha ve yamalı bohça eserleri."
  id: "Sebuah studi akademik yang ditinjau sejawat (Sijil Sefir Demir, 2023) tentang aliran Sheikh Hamdallah (1436–1520) dalam kaligrafi Turki: pengembangan enam pena, evolusi salinannya sebagai metode utama menulis Al-Quran di dunia Islam, serta karya-karyanya berupa Al-Quran, pelat, dan tambal sulam dalam koleksi global."
title: "Shaikh Hamdullah School in the Art of Turkish Calligraphy: A Case Study from the Metropolitan Museum of Art"
