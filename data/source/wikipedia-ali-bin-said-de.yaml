reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 24 October 2026; it rests on Hertslet, The Map of Africa by Treaty, vol. I (pp. 357–407). It gives: reigned 13 February 1890 to 5 March 1893; the provisional agreement of 14 June 1890 accepting the British protectorate; the 1890 waiver of sovereignty over the strip leased to the German East Africa Company between the Umba and Rovuma rivers; no right of disposal over Wituland; in 1892, under compulsion, the lease of the Benadir ports (Mogadishu, Warsheikh, Merca, Baraawe) to Italy; GCSI 1890; and the assessment that with his reign Zanzibar's independence ended. The article states nothing about his religion."
