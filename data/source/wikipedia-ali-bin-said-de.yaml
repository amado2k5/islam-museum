summary:
  ar: "مقالة ويكيبيديا الألمانية عن علي بن سعيد؛ تُستخدم لوقائع الكيان فقط. توثّق تنازله سنة 1890 عن السيادة على الشريط الساحلي لشركة شرق أفريقيا الألمانية، وإجباره سنة 1892 على تأجير موانئ بنادر لإيطاليا، وتختم بأن باستلامه «انتهى استقلال زنجبار»."
  en: "German Wikipedia article on Ali ibn Said; used for entity facts only. It records his 1890 surrender of sovereignty over the coastal strip to the German East Africa Company, the forced 1892 lease of the Benadir ports to Italy, and closes that with his accession 'Zanzibar's independence ended'."
  es: "Artículo de la Wikipedia en alemán sobre Ali ibn Said; utilizado únicamente para datos sobre la persona. En él se recoge su cesión de soberanía sobre la franja costera a la Compañía Alemana de África Oriental en 1890, el arrendamiento forzoso de los puertos de Benadir a Italia en 1892, y concluye que con su ascenso al poder «la independencia de Zanzíbar llegó a su fin»."
  fr: "Article de Wikipédia en allemand sur Ali ibn Said; utilisé uniquement pour les informations relatives à l'entité. Il relate sa cession de souveraineté sur la bande côtière à la Compagnie allemande d'Afrique orientale en 1890, la location forcée des ports de Benadir à l'Italie en 1892, et conclut qu'avec son accession au trône, « l'indépendance de Zanzibar prit fin »."
