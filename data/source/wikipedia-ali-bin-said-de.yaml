  ar: "مقالة ويكيبيديا الألمانية عن علي بن سعيد؛ تُستخدم لوقائع الكيان فقط. توثّق تنازله سنة 1890 عن السيادة على الشريط الساحلي لشركة شرق أفريقيا الألمانية، وإجباره سنة 1892 على تأجير موانئ بنادر لإيطاليا، وتختم بأن باستلامه «انتهى استقلال زنجبار»."
  en: "German Wikipedia article on Ali ibn Said; used for entity facts only. It records his 1890 surrender of sovereignty over the coastal strip to the German East Africa Company, the forced 1892 lease of the Benadir ports to Italy, and closes that with his accession 'Zanzibar's independence ended'."
