label: { ar: "داعية إسلامية: الأمن والاستقرار من أعظم النعم — الجمهور", en: "Islamic preacher: security and stability are among the greatest blessings — Al Gomhor" }
summary:
  ar: "تقرير في موقع الجمهور عن لقاء الدكتورة نيفين مختار، الداعية الإسلامية، مع شريف نورالدين وآية شعيب في برنامج «أنا وهو وهي» على قناة صدى البلد في 6 أكتوبر 2026؛ تحدثت فيه عن الوطن أساسًا للحياة والاستقرار، وعن نعم الأمن والصحة وقوت اليوم، ودعت إلى عدم حجب المشكلات لإدراك النعم الأساسية."
  en: "A report on the Al Gomhor site of Dr Neveen Mokhtar's appearance with Sherif Nour El-Din and Aya Shoaib on the programme 'Ana wa Huwa wa Hiya' (Me, Him and Her) on Sada El Balad on 6 October 2026; she spoke of the homeland as a foundation of life and stability, of the blessings of security, health and daily sustenance, and urged that discussing problems should not obscure awareness of basic blessings."
  es: "En el sitio web de Al Gomhor se publicó un reportaje sobre la aparición de la Dra. Neveen Mokhtar junto a Sherif Nour El-Din y Aya Shoaib en el programa 'Ana wa Huwa wa Hiya' (Yo, Él y Ella) en Sada El Balad el 6 de octubre de 2026; habló de la patria como fundamento de la vida y la estabilidad, de las bendiciones de la seguridad, la salud y el sustento diario, e instó a que la discusión de los problemas no oculte la conciencia de las bendiciones básicas."
  fr: "Un compte rendu publié sur le site Al Gomhor relate l'apparition du Dr Neveen Mokhtar avec Sherif Nour El-Din et Aya Shoaib dans l'émission « Ana wa Huwa wa Hiya » (Moi, Lui et Elle) sur Sada El Balad le 6 octobre 2026; elle y parle de la patrie comme d'un fondement de la vie et de la stabilité, des bienfaits de la sécurité, de la santé et de la subsistance quotidienne, et insiste sur le fait que la discussion des problèmes ne doit pas occulter la conscience de ces bienfaits fondamentaux."
  ur: "6 اکتوبر 2026 کو صدا البلاد پر پروگرام 'انا و ہوا و حیا' ⁦(میں، وہ اور اس)⁩ میں ڈاکٹر نوین مختار کی شریف نورالدین اور آیا شعیب کے ساتھ پیش ہونے کی ال گومور سائٹ پر ایک رپورٹ؛ انہوں نے وطن کو زندگی اور استحکام کی بنیاد کے طور پر، سلامتی، صحت اور روزمرہ کے رزق کی نعمتوں کے بارے میں بتایا، اور اس بات پر زور دیا کہ مسائل پر بحث کرنے سے بنیادی نعمتوں کے بارے میں آگاہی کو مبہم نہیں ہونا چاہیے۔"
