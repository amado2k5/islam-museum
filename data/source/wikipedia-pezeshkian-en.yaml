summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مسعود بزشكيان؛ تُستخدم لوقائع الكيان فقط. تعطي رئاسته منذ 28 تموز 2024 وصندوقها سلفه إبراهيم رئيسي، وتنص على أن محمد مخبر كان رئيسًا بالوكالة بين وفاة رئيسي وتنصيب بزشكيان."
  en: "English Wikipedia article on Masoud Pezeshkian; used for entity facts only. It gives his presidency as beginning on 28 July 2024, names Ebrahim Raisi as his predecessor in its infobox, and states in its text that Mohammad Mokhber served as acting president between Raisi's death and Pezeshkian's inauguration."
  es: "Artículo de la Wikipedia en inglés sobre Masoud Pezeshkian; utilizado únicamente para obtener información sobre la persona. Indica que su presidencia comenzó el 28 de julio de 2024, menciona a Ebrahim Raisi como su predecesor en el recuadro informativo y afirma en su texto que Mohammad Mokhber se desempeñó como presidente interino entre la muerte de Raisi y la toma de posesión de Pezeshkian."
  fr: "Article de Wikipédia en anglais sur Massoud Pezeshkian; utilisé uniquement pour les informations sur l'entité. Il indique que sa présidence a débuté le 28 juillet 2024, mentionne Ebrahim Raisi comme son prédécesseur dans son infobox et précise dans son texte que Mohammad Mokhber a assuré l'intérim entre le décès de Raisi et l'investiture de Pezeshkian."
  ur: "مسعود پیزشکیان پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 28 جولائی 2024 کو ان کی صدارت کا آغاز کرتا ہے، اپنے انفو باکس میں ابراہیم رئیسی کو اپنے پیشرو کے طور پر نامزد کرتا ہے، اور اس کے متن میں کہا گیا ہے کہ محمد مخبر نے رئیسی کی موت اور پیزشکیان کے افتتاح کے درمیان قائم مقام صدر کے طور پر خدمات انجام دیں۔"
