  ar: "مقالة ويكيبيديا الإنجليزية عن شيخو أحمدو (أحمد بن محمد لبو، ح. 1776 – 20 أبريل 1845)، مؤسس إمبراطورية ماسينا (دينا حمد الله) في دلتا النيجر الداخلية بمالي الحالية وحاكمها بلقب الإمام (ألمامي) من 1818 إلى وفاته؛ تروي نشأته وتتلمذه على القادري سيدي المختار الكنتي، وجهاده، وتأسيسه حمد الله، وسياسات دولته الثيوقراطية، ووفاته وخلفه ابنه أحمدو الثاني."
  en: "English Wikipedia article on Seku Amadu (Ahmadu ibn Muhammadu Lobbo, c. 1776 – 20 April 1845), the Fulbe founder of the Massina Empire (Diina of Hamdullahi) in the Inner Niger Delta of present-day Mali, who ruled as Almami from 1818 until his death; it recounts his upbringing, his pupilage under the Qadiriyya teacher Sidi Mukhtar al-Kunti, his jihad, the founding of Hamdullahi, the policies of his theocratic state, and his death and succession by his son Amadu II."
