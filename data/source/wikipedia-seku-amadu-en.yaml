summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شيخو أحمدو ⁦(أحمد بن محمد لبو، ح. 1776 – 20 أبريل 1845)⁩، مؤسس إمبراطورية ماسينا ⁦(دينا حمد الله)⁩ في دلتا النيجر الداخلية بمالي الحالية وحاكمها بلقب الإمام ⁦(ألمامي)⁩ من 1818 إلى وفاته؛ تروي نشأته وتتلمذه على القادري سيدي المختار الكنتي، وجهاده، وتأسيسه حمد الله، وسياسات دولته الثيوقراطية، ووفاته وخلفه ابنه أحمدو الثاني."
  en: "English Wikipedia article on Seku Amadu (Ahmadu ibn Muhammadu Lobbo, c. 1776 – 20 April 1845), the Fulbe founder of the Massina Empire (Diina of Hamdullahi) in the Inner Niger Delta of present-day Mali, who ruled as Almami from 1818 until his death; it recounts his upbringing, his pupilage under the Qadiriyya teacher Sidi Mukhtar al-Kunti, his jihad, the founding of Hamdullahi, the policies of his theocratic state, and his death and succession by his son Amadu II."
  es: "Artículo de Wikipedia en inglés sobre Seku Amadu (Ahmadu ibn Muhammadu Lobbo, c. 1776 - 20 de abril de 1845), fundador del Imperio Massina (Religión de Hamdullahi) en el delta interior del Níger en la actual Malí; relata su educación, su aprendizaje bajo el maestro Qadiriyya Sidi Mukhtar al-Kunti, su yihad, la fundación de Hamdullahi, las políticas de su estado teocrático y su muerte y sucesión por su hijo Amadu II."
  fr: "Article de Wikipédia en anglais sur Seku Amadu (Ahmadu ibn Muhammadu Lobbo, vers 1776 – 20 avril 1845), fondateur de l'empire Massina (religion de Hamdullahi) dans le delta intérieur du Niger, aujourd'hui au Mali; il raconte son éducation, sa scolarité auprès du professeur de Qadiriyya Sidi Mukhtar al-Kunti, son jihad, la fondation de Hamdullahi, la politique de son État théocratique, ainsi que sa mort et sa succession par son fils Amadu II."
  ur: "انگریزی ویکیپیڈیا مضمون Seku Amadu ⁦(احمدو ابن محمدو لوبو، c. 1776 - 20 اپریل 1845)⁩، موجودہ مالی کے اندرونی نائجر ڈیلٹا میں مسینا سلطنت ⁦(حمداللہ کا مذہب)⁩ کے بانی؛ اس میں ان کی پرورش، قادریہ کے استاد سیدی مختار الکنتی کے ماتحت ان کی شاگردی، ان کے جہاد، حمداللہی کی بنیاد، اس کی تھیوکریٹک ریاست کی پالیسیوں، اور اس کے بیٹے عمدو دوم کی وفات اور جانشینی کا ذکر ہے۔"
