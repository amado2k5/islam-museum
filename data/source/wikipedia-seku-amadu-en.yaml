reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it, chiefly Hunwick (2003, 2004), Hiskett (1976), Saad (1983), Vikør (1999) and Okoth (2006). Read in full on 25 October 2026. The article gives his birth as c. 1776, his death precisely as 20 April 1845, and states expressly that he was a pupil of the Qadiriyya Sufi teacher Sidi Mukhtar al-Kunti (citing Hunwick 2004) and that the law of his state rested on the Maliki interpretation of Sharia — a statement about the state, used in the record only as such."
