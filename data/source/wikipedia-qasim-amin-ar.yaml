reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. It dates his birth 1 December 1863 at Alexandria and his death 23 April 1908 at Cairo (the English article's lead gives 12 April 1908; the discrepancy is recorded in the person record), and covers his Montpellier scholarship, his judgeship in the Mixed Courts from 1885, his friendships with Muhammad Abduh and Saad Zaghloul, and The Liberation of Women (1899), written in rebuttal of the Duc d'Harcourt's attack on Egyptian women. The article names no school of Islam for him. Read in full on 24 October 2026."
