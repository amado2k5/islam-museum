reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 at the recorded revision, fetched by revision id and asserted equal before any claim was drawn. It gives his birth on 24 October 1775 at Delhi, his succession to Akbar II in 1837, his court's poets (Ghalib, Daagh Dehlvi, Momin Khan Momin, and his mentor Zauq), the events of 1857, his trial, exile and death at Rangoon on 7 November 1862. In its text it states that he 'was a devout Sufi', was regarded as a Sufi pir and accepted murids, quoting the contemporary Delhi Urdu Akhbaar. Its infobox religion field gives Sunni Islam and its categories file him under Indian Sunni Muslims; the text names no legal school."
