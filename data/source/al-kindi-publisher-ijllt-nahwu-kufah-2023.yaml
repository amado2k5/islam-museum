  ar: "صفحة «The Nahwu Kufah Mazhab’s View in Data Approach to Determining Rules (IJLLT, 2023)» لدى Al-Kindi Center for Research and Development. لم يفتحها المتحف بنفسه؛ عُرف محتواها من ملخص بحثي قُدّم إلى المتحف ووافق المؤسس على استعماله في 21 نوفمبر 2026. يُستشهد بها في: الفرق بين البصرة والكوفة في القياس والسماع وحدود الشواهد."
  en: "The page \"The Nahwu Kufah Mazhab’s View in Data Approach to Determining Rules (IJLLT, 2023)\" (Al-Kindi Center for Research and Development). The museum did not open it itself: what is known of it comes from a research summary supplied to the museum and approved for use by the founder on 21 November 2026. Cited for: the differences between the schools of Basra and Kufa over analogy, transmission and the limits of evidence."
  ur: "صفحہ «The Nahwu Kufah Mazhab’s View in Data Approach to Determining Rules (IJLLT, 2023)»، Al-Kindi Center for Research and Development۔ عجائب گھر نے اسے خود نہیں کھولا؛ اس کے بارے میں جو معلوم ہے وہ عجائب گھر کو دیے گئے ایک تحقیقی خلاصے سے ہے جس کے استعمال کی منظوری بانی نے 21 نومبر 2026 کو دی۔ اس کا حوالہ اس کے لیے دیا گیا: قیاس، سماع اور شواہد کی حدود میں بصرہ اور کوفہ کے مدارس کا فرق۔"
  fr: "La page « The Nahwu Kufah Mazhab’s View in Data Approach to Determining Rules (IJLLT, 2023) » (Al-Kindi Center for Research and Development). Le musée ne l'a pas ouverte lui-même : ce qu'on en sait vient d'une synthèse de recherche remise au musée et approuvée pour usage par le fondateur le 21 novembre 2026. Citée pour : les différences entre les écoles de Basra et de Kufa sur l'analogie, la transmission et les limites des témoignages."
  es: "La página «The Nahwu Kufah Mazhab’s View in Data Approach to Determining Rules (IJLLT, 2023)» (Al-Kindi Center for Research and Development). El museo no la abrió por sí mismo: lo que se sabe de ella procede de un resumen de investigación entregado al museo y aprobado para su uso por el fundador el 21 de noviembre de 2026. Citada para: las diferencias entre las escuelas de Basora y Kufa sobre la analogía, la transmisión y los límites de los testimonios."
