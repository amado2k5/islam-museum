summary:
  ar: "فصل في الذي يلزم القائلين بالصرفة من الرسالة الشافية للجرجاني، وهو بحسب الملخص البحثي يورد آية اجتماع الإنس والجن بإحالة الإسراء ٨٨. ذُكرت هذه الصفحة في ملخص بحثي قُدّم إلى المتحف وأجاز المؤسس استعماله في 21 نوفمبر 2026؛ ولم يفتح المتحف الصفحة نفسها."
  en: "The section of al-Jurjani's al-Risala al-Shafiya on what follows for those who hold the doctrine of sarfa, which, according to the research summary, gives the verse on humans and jinn gathering with the reference al-Isra 88. The page was named in a research summary supplied to the museum and approved for use by the founder on 21 November 2026; the museum did not open it."
  ur: "جرجانی کی الرسالۃ الشافیہ کی وہ فصل جو صرفہ کے قائلین پر لازم آنے والی بات پر ہے اور تحقیقی خلاصے کے مطابق انس و جن کے اجتماع والی آیت کو الاسراء 88 کے حوالے سے دیتی ہے۔ اس صفحے کا ذکر عجائب گھر کو دیے گئے ایک تحقیقی خلاصے میں تھا جس کے استعمال کی منظوری بانی نے 21 نومبر 2026 کو دی؛ عجائب گھر نے یہ صفحہ خود نہیں کھولا۔"
  fr: "La section de la Risala al-Shafiya d'al-Jurjani sur ce qui s'ensuit pour les tenants de la sarfa, qui, selon le résumé de recherche, donne le verset sur les humains et les djinns réunis avec la référence al-Isra 88. La page est nommée dans un résumé de recherche remis au musée et approuvé pour usage par le fondateur le 21 novembre 2026 ; le musée ne l'a pas ouverte."
  es: "La sección de la Risala al-Shafiya de al-Jurjani sobre lo que se sigue para quienes sostienen la sarfa, que según el resumen de investigación da el versículo sobre humanos y genios reunidos con la referencia al-Isra 88. La página figura en un resumen de investigación entregado al museo y aprobado para su uso por el fundador el 21 de noviembre de 2026; el museo no la abrió."
  tr: "Al-Jurjani'nin Al-Shafiyah Treatise'inden saf mektubu söyleyenleri neyin zorunlu kıldığına dair bir bölüm; araştırma özetine göre, bu mektup, insan ve cinlerin buluşmasını anlatan ayeti İsra 88'e atıfta bulunarak içeriyor. Bu sayfa, müzeye sunulan ve kurucu tarafından 21 Kasım 2026'da yetkilendirilen bir araştırma özetinde bahsedilmiştir; müze sayfayı kendisi açmamıştır."
  id: "Sebuah bab tentang apa yang mewajibkan mereka yang mengucapkan surat murni dari Risalah Al-Shafiyah karya Al-Jurjani, yang menurut ringkasan penelitian, memuat ayat tentang pertemuan manusia dan jin dengan merujuk pada Isra 88. Halaman ini disebutkan dalam ringkasan penelitian yang diserahkan ke museum dan diotorisasi oleh pendiri pada 21 November 2026; museum tidak membuka halaman itu sendiri."
