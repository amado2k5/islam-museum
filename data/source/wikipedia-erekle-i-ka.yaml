reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It gives his birth in 1642 and death in 1709, his Moscow upbringing as Nikoloz Davidovich, his 1674 return to Kakheti, the shah's promise of the Kartli throne in exchange for his conversion, his acceptance of Islam after long hesitation under the name Nazar Ali Khan, his Tbilisi administration and guild charters, his 1703 transfer to Kakheti, his entrusting of Kakheti to his converted son David II (Imam Quli Khan), and his death in Persia soon after. It names no branch or school of Islam for the king himself. Checked 1 November 2026."
