reliability_note: "Pointer for entity facts only, used where the article cites a source: founded 1977 as Kuwait's first Islamic bank, first day of operation 31 August 1978 with 170 account applications, the moves of 1983 and 1986, the only Islamic bank in The Banker's top 100 Arab banks by 1983 (KUNA, 2017); listed on the Kuwait Stock Exchange in 1984; Kuveyt Türk established by Turkish cabinet decree in 1989; KFH Capital (1999); Bahrain branch (2002); KFH Malaysia (2005), the first Islamic bank licensed there under the 1983 Act, and its announced exit by the end of 2026 (Business Today, 5 March 2026); the completion of the Ahli United Bank acquisition for BHD 4.1 billion (MarketScreener, 23 September 2022); sukuk trading volume of US$11.4 billion in 2016 (CPI Financial); 631 locations, KWD 42.7 billion total assets and 17,500 employees in 2025 (Annual Report 2025); ownership after the merger, led by the Kuwait Investment Authority at 16.80%; fifth on Forbes Middle East's 30 Most Valuable Banks 2025 and ninth on its Top 100 Listed Companies 2025 (Forbes Middle East, May 2026); the industry awards of 2015 and 2016. Read in Chrome on 6 November 2026."
