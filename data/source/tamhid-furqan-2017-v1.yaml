  en: "al-Tamhid li-ma fi al-Muwatta' min al-Ma'ani wa-al-Asanid — Ibn 'Abd al-Barr, ed. Bashar 'Awwad Ma'ruf, al-Furqan Foundation, vol. 1"
summary:
  ar: "المجلد الأول من نشرة مؤسسة الفرقان للتراث الإسلامي (مركز دراسات المخطوطات الإسلامية، لندن)، الطبعة الأولى 1439هـ/2017م، ضمن «سلسلة النصوص المحققة»، حققه وعلق عليه بشار عواد معروف ومعه محمد بشار عواد وشريك ثالث، وفيه تقديم أحمد زكي يماني، ومقدمة التحقيق الواسعة (ترجمة ابن عبد البر، ووصف النسخ، وإبرازتا الكتاب، ومنهج التحقيق)، ومقدمة المؤلف، وأول باب الألف من شيوخ مالك."
  en: "Volume 1 of the al-Furqan Islamic Heritage Foundation edition (Centre for the Study of Islamic Manuscripts, London), first edition 1439 AH/2017 CE, in the series of critically edited texts, edited and annotated by Bashar 'Awwad Ma'ruf with Muhammad Bashar 'Awwad and a third co-editor; it holds Ahmad Zaki Yamani's foreword, the long editor's introduction (life of Ibn 'Abd al-Barr, the manuscripts, the book's two recensions, editorial method), the author's own introduction and the first part of the letter alif of Malik's teachers."
