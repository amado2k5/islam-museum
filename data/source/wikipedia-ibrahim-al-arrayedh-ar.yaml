  ar: "مقالة ويكيبيديا العربية عن إبراهيم العريض (1908–2002)؛ تُستخدم لوقائع الكيان فقط. تؤكد هويته شاعرا بحرينيا وتاريخي مولده ووفاته، وصندوق معلوماتها يذكر دينه: الإسلام عموما."
  en: "Arabic Wikipedia article on Ibrahim Al-Arrayedh (1908–2002); used for entity facts only. It confirms his identity as a Bahraini poet and his birth and death dates; its infobox gives his religion as Islam in general."
  es: "Artículo de Wikipedia en árabe sobre Ibrahim Al-Arrayedh (1908-2002); se utiliza únicamente para obtener información sobre la persona. Confirma su identidad como poeta bahreiní y sus fechas de nacimiento y fallecimiento; su ficha informativa indica que profesaba el islam en general."
  fr: "Article de Wikipédia en arabe sur Ibrahim Al-Arrayedh (1908-2002); utilisé uniquement pour les informations le concernant. Il confirme son identité de poète bahreïni et ses dates de naissance et de décès; son infobox indique qu’il était musulman."
  ur: "ابراہیم العرید (1908-2002) پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ایک بحرینی شاعر کے طور پر اس کی شناخت اور اس کی تاریخ پیدائش اور موت کی تصدیق کرتا ہے۔ اس کا انفو باکس اس کا مذہب عام طور پر اسلام کے طور پر دیتا ہے۔"
  tr: "İbrahim El-Arayed (1908–2002) hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılır. Bahreynli bir şair olarak tanımlanır ve doğum ve ölüm tarihini doğrular; bilgi kutusunda ise dini olan genel olarak İslam yer alır."
  id: "Artikel Wikipedia Arab tentang Ibrahim Al-Arayed (1908–2002); hanya digunakan untuk fakta entitas. Ia diidentifikasi sebagai penyair Bahrain dan mengonfirmasi riwayat kelahiran dan kematiannya, serta infobox tersebut menyebutkan agamanya: Islam secara umum."
