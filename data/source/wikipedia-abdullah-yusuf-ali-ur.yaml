summary:
  ar: "مقال الأردية عن عبد الله يوسف علي؛ يصفه في صدره بأنه عالم سني ومترجم القرآن إلى الإنجليزية ومدير سابق للكلية الإسلامية بلاهور، ويؤرخ مولده في 4 أبريل 1872 في سورت لأسرة بوهرية داودية شيعية."
  en: "Urdu encyclopedia article on Abdullah Yusuf Ali; its lead styles him a Sunni scholar, English translator of the Qur'an and former principal of Islamia College, Lahore, and it dates his birth to 4 April 1872 at Surat, into a Dawoodi Bohra Shia family."
  es: "Artículo de una enciclopedia en urdu sobre Abdullah Yusuf Ali; en su introducción se le describe como un erudito sunita, traductor del Corán al inglés y antiguo director del Islamia College de Lahore, y se indica que nació el 4 de abril de 1872 en Surat, en el seno de una familia chiíta Dawoodi Bohra."
  fr: "Article d'encyclopédie ourdou sur Abdullah Yusuf Ali; son introduction le présente comme un érudit sunnite, traducteur anglais du Coran et ancien directeur de l'Islamia College de Lahore, et date sa naissance du 4 avril 1872 à Surat, dans une famille chiite Dawoodi Bohra."
  ur: "عبداللہ یوسف علی پر اردو انسائیکلوپیڈیا کا مضمون؛ اس کے مرکزی انداز میں وہ ایک سنی عالم، قرآن کے انگریزی مترجم اور اسلامیہ کالج لاہور کے سابق پرنسپل ہیں، اور اس کی پیدائش 4 اپریل 1872 کو سورت میں ایک داؤدی بوہرہ شیعہ خاندان میں ہوئی۔"
  tr: "Abdullah Yusuf Ali hakkında Urduca makale; kalbinde bir Sünni âlim, Kur'an'ı İngilizceye çeviren ve Lahor'daki İslami Koleji'nin eski müdürü olarak tanımlanır. 4 Nisan 1872'de Surat'ta bir Taoist Bohri ailesine ait olarak tarihlendirilir."
  id: "Artikel dalam bahasa Urdu tentang Abdullah Yusuf Ali; ia digambarkan dalam hatinya sebagai ulama Sunni, penerjemah Al-Qur'an ke dalam bahasa Inggris, dan mantan direktur Islamic College di Lahore. Ia bertanggal 4 April 1872 di Surat, berasal dari keluarga Bohri Daois."
