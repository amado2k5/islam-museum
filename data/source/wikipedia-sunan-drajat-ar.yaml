reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision via the MediaWiki API on 1 November 2026; a fact is used only where the article cites a source for it (Wikipedia broad rule). It rests on the Ba'alawi genealogical tradition (its infobox files his family as Al Ba'alawi) and on Salam (1989) and the 1999 History of Sunan Drajat; its Shafi'i madhhab value is that single family's filing and is preserved in the record without being adopted. Its Hijri pairings, 875 for 1470 and 940 for 1533, are the source's own and are recorded as such."
