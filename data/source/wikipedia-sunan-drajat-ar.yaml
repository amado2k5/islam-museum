  ar: "مقالة ويكيبيديا العربية عن سونن درجات (رادين هاشم)؛ تعطي ولادته 875هـ/1470م ووفاته 940هـ/1533م، وصندوق معلوماتها يعطي عقيدته أهل السنة والجماعة ومذهبه الشافعي ويصنّف عائلته في آل باعلوي، وتذكر اهتمامه بالتعليم والغذاء ورعاية الأيتام والفقراء وبناءه معهدًا شرعيًا."
  en: "Arabic Wikipedia article on Sunan Drajat (Raden Hashim); it gives his birth as 875 AH/1470 CE and death as 940 AH/1533 CE, and its infobox gives his creed as Ahl al-Sunna wa-l-Jama'a and his madhhab as Shafi'i, filing his family under the Ba'alawi; the text notes his care for teaching, food, orphans and the poor, and his founding of a religious boarding school."
