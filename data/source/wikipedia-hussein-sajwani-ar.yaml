summary:
  ar: "مقالة ويكيبيديا العربية عن حسين سجواني: وُلد سنة 1953 لعائلة متوسطة في دبي، درس الهندسة الصناعية في جامعة واشنطن وتخرج سنة 1981، وأسس داماك العقارية سنة 2002، وتبرع عبر مؤسسته بثلاثة ملايين درهم لمستشفى مجدي يعقوب للقلب ومليون درهم لحملة مئة مليون وجبة."
  en: "Arabic Wikipedia article on Hussain Sajwani, born in 1953 to a middle-class family in Dubai; he studied industrial engineering at the University of Washington, graduating in 1981, founded DAMAC Properties in 2002, and through his foundation gave three million dirhams to the Magdi Yacoub heart hospital project and one million dirhams to the 100 Million Meals campaign."
  es: "Artículo en árabe de la Wikipedia sobre Hussain Sajwani, nacido en 1953 en el seno de una familia de clase media en Dubái; estudió ingeniería industrial en la Universidad de Washington, donde se graduó en 1981, fundó DAMAC Properties en 2002 y, a través de su fundación, donó tres millones de dirhams al proyecto del hospital cardíaco Magdi Yacoub y un millón de dirhams a la campaña \"100 Million Meals\"."
  fr: "Article de Wikipédia en arabe sur Hussain Sajwani, né en 1953 dans une famille de classe moyenne à Dubaï; il a étudié le génie industriel à l'Université de Washington, où il a obtenu son diplôme en 1981, a fondé DAMAC Properties en 2002 et, par le biais de sa fondation, a fait don de trois millions de dirhams au projet d'hôpital cardiaque Magdi Yacoub et d'un million de dirhams à la campagne « 100 Million Meals »."
  ur: "حسین سجوانی پر عربی ویکیپیڈیا کا مضمون، جو 1953 میں دبئی کے ایک متوسط گھرانے میں پیدا ہوئے؛ اس نے واشنگٹن یونیورسٹی سے انڈسٹریل انجینئرنگ کی تعلیم حاصل کی، 1981 میں گریجویشن کیا، 2002 میں DAMAC پراپرٹیز کی بنیاد رکھی، اور اپنی فاؤنڈیشن کے ذریعے Magdi Yacoub heart Hospital پروجیکٹ کو 30 لاکھ درہم اور 100 ملین کھانے کی مہم کو 10 لاکھ درہم دیے۔"
