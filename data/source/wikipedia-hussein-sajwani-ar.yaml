  ar: "مقالة ويكيبيديا العربية عن حسين سجواني: وُلد سنة 1953 لعائلة متوسطة في دبي، درس الهندسة الصناعية في جامعة واشنطن وتخرج سنة 1981، وأسس داماك العقارية سنة 2002، وتبرع عبر مؤسسته بثلاثة ملايين درهم لمستشفى مجدي يعقوب للقلب ومليون درهم لحملة مئة مليون وجبة."
  en: "Arabic Wikipedia article on Hussain Sajwani, born in 1953 to a middle-class family in Dubai; he studied industrial engineering at the University of Washington, graduating in 1981, founded DAMAC Properties in 2002, and through his foundation gave three million dirhams to the Magdi Yacoub heart hospital project and one million dirhams to the 100 Million Meals campaign."
