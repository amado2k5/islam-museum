reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It gives his birth on 8 October 1624 — one day against the 9 October of the English, Arabic and Urdu articles, preserved as a rival reading — his death on 14 December 1661, his father as Shah Jahan (Q83672, the QID of person/shah-jahan-mughal on main) and his mother as Mumtaz Mahal. It files his religion both as Islam generically and as Sunni Islam; structured statements never settle faith under the founder rulings, and no article text names a school for him. The QID was grounded from the English article's own page property, the Arabic and Urdu articles agreeing. Item revision fetched live and re-asserted identical on a second query, 1 November 2026."
