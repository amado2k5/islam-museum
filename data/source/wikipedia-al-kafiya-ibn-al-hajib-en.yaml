summary:
  ar: "صفحة «Ibn al-Hajib» في ويكيبيديا الإنجليزية، وهي الصفحة الموثِّقة التي سماها ملخص بحثي قُدّم إلى المتحف للكتاب «الكافية في علم النحو»؛ لم يفتح المتحف الصفحة، وقد أجاز المؤسس استعمال الملخص دون إعادة تحقق في 21 نوفمبر 2026، في موضوع: نسبة الكتاب إلى مؤلفه وتاريخه."
  en: "The page \"Ibn al-Hajib\" on the English Wikipedia, named by a research summary supplied to the museum as the documenting page for al-Kafiya fi Ilm al-Nahw; the museum did not open the page, and the founder approved using the summary without re-verification on 21 November 2026, for the ascription of the work to its author and its date."
  ur: "انگریزی ویکیپیڈیا پر صفحہ «Ibn al-Hajib»، جسے عجائب گھر کو دیے گئے ایک تحقیقی خلاصے نے «الکافیہ فی علم النحو» کا مستند صفحہ بتایا؛ عجائب گھر نے صفحہ نہیں کھولا، اور بانی نے 21 نومبر 2026 کو دوبارہ تصدیق کے بغیر خلاصے کے استعمال کی منظوری دی، موضوع: کتاب کی مصنف سے نسبت اور اس کی تاریخ۔"
  fr: "La page « Ibn al-Hajib » de Wikipédia (anglaise), nommée par un résumé de recherche remis au musée comme page documentaire de al-Kafiya fi Ilm al-Nahw ; le musée n'a pas ouvert la page, et le fondateur a approuvé l'usage du résumé sans nouvelle vérification le 21 novembre 2026, pour l'attribution de l'ouvrage à son auteur et sa date."
  es: "La página «Ibn al-Hajib» de Wikipedia (en inglés), nombrada por un resumen de investigación entregado al museo como página documental de al-Kafiya fi Ilm al-Nahw; el museo no abrió la página, y el fundador aprobó usar el resumen sin nueva verificación el 21 de noviembre de 2026, para la atribución de la obra a su autor y su fecha."
  tr: "İngilizce Vikipedi'deki \"İbn el-Hacib\" sayfası, belgelenmiş sayfa olarak müzeye \"El-Kafiya fi Ilm el-Nahv\" kitabı için sunulan araştırma özeti olarak adlandırılmıştır; müze sayfayı açmamış ve kurucu 21 Kasım 2026'da özetin yeniden doğrulama olmaksızın kullanılmasına izin vermiştir: kitabın yazarına ve tarihine atfedilmesi konusudur."
  id: "Halaman \"Ibn al-Hajib\" di Wikipedia bahasa Inggris, yang merupakan halaman terdokumentasi yang disebut ringkasan penelitian yang dikirim ke museum untuk buku \"Al-Kafiya fi Ilm al-Nahw\"; museum tidak membuka halaman tersebut, dan pendiri mengizinkan penggunaan ringkasan tanpa verifikasi ulang pada 21 November 2026, dengan topik: atribusi buku kepada penulisnya dan sejarahnya."
