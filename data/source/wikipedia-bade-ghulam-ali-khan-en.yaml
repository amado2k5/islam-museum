  ar: "مقالة ويكيبيديا الإنجليزية عن بادي غلام علي خان؛ تُستخدم لوقائع الكيان فقط. تذكر أنه مغنٍّ هندي من غرانة قصور–بتيالا، وُلد في 2 نيسان 1902 في قصور وتوفي في 23 نيسان 1968 في حيدر آباد، وأنه لحّن باسم «سبرانغ»، ونال جائزة سانغيت ناتاك أكاديمي وبادما بوشان سنة 1962. لا تذكر دينه في أي موضع."
  en: "English Wikipedia article on Bade Ghulam Ali Khan; used for entity facts only. It gives him as an Indian vocalist of the Kasur Patiala Gharana, born 2 April 1902 at Kasur and died 23 April 1968 at Hyderabad, composing under the pen name Sabrang, with the Sangeet Natak Akademi Award and the Padma Bhushan in 1962. It names no religion anywhere."
