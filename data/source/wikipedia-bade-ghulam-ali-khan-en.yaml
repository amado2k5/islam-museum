summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن بادي غلام علي خان؛ تُستخدم لوقائع الكيان فقط. تذكر أنه مغنٍّ هندي من غرانة قصور–بتيالا، وُلد في 2 نيسان 1902 في قصور وتوفي في 23 نيسان 1968 في حيدر آباد، وأنه لحّن باسم «سبرانغ»، ونال جائزة سانغيت ناتاك أكاديمي وبادما بوشان سنة 1962. لا تذكر دينه في أي موضع."
  en: "English Wikipedia article on Bade Ghulam Ali Khan; used for entity facts only. It gives him as an Indian vocalist of the Kasur Patiala Gharana, born 2 April 1902 at Kasur and died 23 April 1968 at Hyderabad, composing under the pen name Sabrang, with the Sangeet Natak Akademi Award and the Padma Bhushan in 1962. It names no religion anywhere."
  es: "Artículo de Wikipedia en inglés sobre Bade Ghulam Ali Khan; utilizado únicamente para datos sobre la persona. Lo describe como un vocalista indio de la escuela Kasur Patiala Gharana, nacido el 2 de abril de 1902 en Kasur y fallecido el 23 de abril de 1968 en Hyderabad, que componía bajo el seudónimo de Sabrang, y que recibió el premio Sangeet Natak Akademi y el Padma Bhushan en 1962. No menciona su religión en ningún momento."
  fr: "Article Wikipédia en anglais sur Bade Ghulam Ali Khan; utilisé uniquement à titre informatif. Il est présenté comme un chanteur indien de l’école de Kasur Patiala, né le 2 avril 1902 à Kasur et décédé le 23 avril 1968 à Hyderabad, compositeur sous le pseudonyme de Sabrang, lauréat du prix Sangeet Natak Akademi et de la Padma Bhushan en 1962. Aucune mention de sa religion n’est faite."
  ur: "بڑے غلام علی خان پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ انہیں قصور پٹیالہ گھرانے کے ایک ہندوستانی گلوکار کے طور پر دیتا ہے، جو 2 اپریل 1902 کو قصور میں پیدا ہوئے اور 23 اپریل 1968 کو حیدرآباد میں انتقال کر گئے، سبرنگ کے قلمی نام سے کمپوز کرنے والے، سنگیت ناٹک اکادمی ایوارڈ اور 1962 میں پدم بھوشن کے ساتھ۔ اس میں کہیں بھی کسی مذہب کا نام نہیں ہے۔"
  tr: "Badi Ghulam Ali Khan hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Grana Kasur–Patiala'dan Hintli bir şarkıcı olduğu, 2 Nisan 1902'de Kasur'da doğduğu ve 23 Nisan 1968'de Haydarabad'da öldüğü belirtilmektedir. 'Sprang' adıyla beste yaptı ve 1962'de Sangeet Natak Akademi ile Padma Bhushan ödüllerini aldı. Dini hiçbir yerde belirtilmemiştir."
  id: "Artikel Wikipedia bahasa Inggris tentang Badi Ghulam Ali Khan; digunakan hanya untuk fakta entitas. Dicatat bahwa ia adalah penyanyi India dari Grana Kasur–Patiala, lahir pada 2 April 1902 di Kasur dan meninggal pada 23 April 1968 di Hyderabad. Ia menggubah musik dengan nama 'Sprang' dan menerima penghargaan Sangeet Natak Akademi serta Padma Bhushan pada tahun 1962. Agamanya tidak disebutkan di mana pun."
