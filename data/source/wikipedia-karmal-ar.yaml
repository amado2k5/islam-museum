summary:
  ar: "مقالة ويكيبيديا العربية عن ببرك كارمل؛ تُستخدم لوقائع الكيان فقط. تؤكد مولده في 6 يناير 1929 في كاماري قرب كابل ووفاته في موسكو في 3 ديسمبر 1996 بسرطان الكبد، وخانة الديانة في صندوق معلوماتها فارغة، وتصنّفه في فئة «ملحدون أفغان»، وتعطي تقابلي الهجري 1347 لميلاده و1417 لوفاته في تصنيفاتها."
  en: "Arabic Wikipedia article on Babrak Karmal; used for entity facts only. It confirms his birth on 6 January 1929 at Kamari near Kabul and his death at Moscow on 3 December 1996 from liver cancer. Its infobox religion field is blank; its categories file him under 'Afghan atheists' (a filing, not an attestation) and pair his birth with 1347 AH and his death with 1417 AH."
  es: "Artículo de Wikipedia en árabe sobre Babrak Karmal; utilizado únicamente para datos sobre la persona. Confirma su nacimiento el 6 de enero de 1929 en Kamari, cerca de Kabul, y su fallecimiento en Moscú el 3 de diciembre de 1996 a causa de un cáncer de hígado. El campo de religión de su ficha informativa está en blanco; sus categorías lo clasifican como «ateos afganos» (una clasificación, no una certificación) y asocian su nacimiento con el año 1347 de la Hégira y su fallecimiento con el año 1417 de la Hégira."
  fr: "Article Wikipédia en arabe sur Babrak Karmal; utilisé uniquement pour les informations le concernant. Il confirme sa naissance le 6 janvier 1929 à Kamari, près de Kaboul, et son décès à Moscou le 3 décembre 1996 des suites d’un cancer du foie. Le champ « religion » de son infobox est vide; ses catégories le classent dans la catégorie « Athées afghans » (un classement, et non une attestation) et associent sa naissance à l’année 1347 de l’Hégire et son décès à l’année 1417 de l’Hégire."
  ur: "ببرک کارمل پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ تصدیق کرتا ہے کہ ان کی پیدائش 6 جنوری 1929 کو کابل کے قریب کماری میں ہوئی اور 3 دسمبر 1996 کو ماسکو میں جگر کے کینسر سے ان کی موت ہوئی۔ اس کا انفو باکس مذہب کا میدان خالی ہے۔ اس کے زمرے اسے 'افغان ملحد' ⁦(ایک فائلنگ، ایک تصدیق نہیں)⁩ کے تحت درج کرتے ہیں اور اس کی پیدائش 1347 ہجری اور ان کی وفات 1417 ہجری کے ساتھ جوڑتے ہیں۔"
  tr: "Babark Karmel hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 6 Ocak 1929'da Kabil yakınlarındaki Kamari'de doğduğunu ve 3 Aralık 1996'da Moskova'da karaciğer kanserinden öldüğünü doğrular. Bilgi kutusundaki din alanı boştur, onu 'Afgan ateistleri' olarak sınıflandırır ve bu kategorilerde doğumuna karşılık gelen Hicri takvimi 1347, ölümüne ise 1417 atamaktadır."
  id: "Artikel Wikipedia bahasa Arab tentang Babark Karmel; hanya digunakan untuk fakta entitas. Artikel ini mengonfirmasi kelahirannya pada 6 Januari 1929 di Kamari dekat Kabul dan kematiannya di Moskow pada 3 Desember 1996 akibat kanker hati. Kolom agama dalam infobox kosong, mengklasifikasikannya sebagai 'ateis Afghanistan,' dan menetapkan kalender Hijriyah 1347 untuk kelahirannya dan 1417 untuk kematiannya dalam kategorinya."
