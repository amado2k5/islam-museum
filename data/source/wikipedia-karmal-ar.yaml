  ar: "مقالة ويكيبيديا العربية عن ببرك كارمل؛ تُستخدم لوقائع الكيان فقط. تؤكد مولده في 6 يناير 1929 في كاماري قرب كابل ووفاته في موسكو في 3 ديسمبر 1996 بسرطان الكبد، وخانة الديانة في صندوق معلوماتها فارغة، وتصنّفه في فئة «ملحدون أفغان»، وتعطي تقابلي الهجري 1347 لميلاده و1417 لوفاته في تصنيفاتها."
  en: "Arabic Wikipedia article on Babrak Karmal; used for entity facts only. It confirms his birth on 6 January 1929 at Kamari near Kabul and his death at Moscow on 3 December 1996 from liver cancer. Its infobox religion field is blank; its categories file him under 'Afghan atheists' (a filing, not an attestation) and pair his birth with 1347 AH and his death with 1417 AH."
