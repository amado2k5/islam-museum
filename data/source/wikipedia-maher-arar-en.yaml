reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It gives Arar as born in Syria in 1970 (year only), resident in Canada since 1987, with a McGill bachelor’s degree in computer engineering and a master’s in telecommunications from the Institut national de la recherche scientifique; his detention at JFK airport in September 2002, deportation to Syria, release on 5 October 2003, the O’Connor commission’s findings and his exoneration, the RCMP apology of 28 September 2006, the formal apology and C$10.5 million settlement of 26 January 2007, and the dismissal of his United States lawsuit (Second Circuit, 2 November 2009; Supreme Court declined review, 14 June 2010). It makes no statement of his religion in its text; its categories file him under “Canadian Muslims”."
