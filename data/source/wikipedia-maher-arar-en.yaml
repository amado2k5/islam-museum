summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ماهر عرار؛ تُستخدم لوقائع الكيان فقط. تروي احتجازه في نيويورك سنة 2002 وترحيله إلى سوريا وسجنه وتعذيبه هناك، وتحقيق أوكونور الذي برّأه، واعتذار الحكومة الكندية وتعويضها له سنة 2007."
  en: "English Wikipedia article on Maher Arar; used for entity facts only. It recounts his 2002 detention in New York, his deportation to Syria and imprisonment and torture there, the O’Connor inquiry that cleared him, and the Canadian government’s 2007 apology and compensation."
  es: "Artículo de la Wikipedia en inglés sobre Maher Arar; se utiliza únicamente para obtener información sobre la persona. Relata su detención en Nueva York en 2002, su deportación a Siria, donde fue encarcelado y torturado, la investigación de O'Connor que lo exoneró y la disculpa y compensación ofrecidas por el gobierno canadiense en 2007."
  fr: "Article de Wikipédia en anglais sur Maher Arar; utilisé uniquement à des fins d'information sur l'entité. Il relate son arrestation à New York en 2002, son expulsion vers la Syrie où il a été emprisonné et torturé, l'enquête O'Connor qui l'a innocenté, ainsi que les excuses et l'indemnisation présentées par le gouvernement canadien en 2007."
  ur: "مہر ارار پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں نیویارک میں اس کی 2002 کی حراست، شام میں اس کی جلاوطنی اور وہاں قید اور تشدد، O'Connor کی انکوائری جس نے اسے کلیئر کر دیا، اور کینیڈین حکومت کی 2007 کی معافی اور معاوضے کا ذکر کیا ہے۔"
  tr: "Maher Arar hakkında İngilizce Wikipedia makalesi; yalnızca varlık gerçekleri için kullanılmıştır. 2002'de New York'ta tutuklanışını, Suriye'ye sınır dışı edilmesini, orada hapsedilmesini ve işkencesini yaşaması, O'Connor'ın kendisini beraat ettiren soruşturmasını ve 2007'de Kanada hükümetinin özür ve tazminatını anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Maher Arar; hanya digunakan untuk fakta entitas. Artikel ini menceritakan penahanannya di New York pada tahun 2002, deportasi ke Suriah, penahanan dan penyiksaan di sana, penyelidikan terhadap O'Connor yang membebaskannya, serta permintaan maaf dan kompensasi pemerintah Kanada pada tahun 2007."
