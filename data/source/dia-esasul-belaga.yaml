reliability_note: "Read in the museum's session on 20 November 2026. It says al-Zamakhshari wrote the book because the Qur'an cannot be understood without knowing the eloquence, metaphor and other subtleties of Arabic; that it differs from earlier dictionaries in taking the root letters from the first letter onward, with 28 chapters, one per letter, and the words in each ordered alphabetically (with some confusion in four- and five-letter roots); and that its material is verses, hadith, proverbs, rhymed prose, sayings of well-known writers and new meanings that words acquired. Used for entity facts only."
