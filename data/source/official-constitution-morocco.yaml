  ar: "«دستور المغرب، 2011»، كما يُنشر عند: المحكمة الدستورية المغربية. العنوان ونص الفصل 5 مأخوذان من ملخص بحثي زُوّد به المتحف، ولم يفتح المتحف الصفحة؛ وقد أجاز المؤسس استعمال النص كما ورد في 21 نوفمبر 2026."
  en: "Constitution of Morocco, 2011, as published at: Constitutional Court of Morocco. The address and the wording of Article 5 come from a research summary supplied to the museum, and the museum did not open the page; the founder approved using the wording as supplied on 21 November 2026."
  ur: "Constitution of Morocco, 2011، جیسا کہ Constitutional Court of Morocco پر شائع ہے۔ پتہ اور دفعہ 5 کی عبارت متحف کو فراہم کردہ ایک تحقیقی خلاصے سے لی گئی ہے، اور متحف نے صفحہ نہیں کھولا؛ بانی نے 21 نومبر 2026 کو عبارت کو جیسی ملی اسی طرح استعمال کرنے کی منظوری دی۔"
  fr: "Constitution of Morocco, 2011, tel que publié à : Constitutional Court of Morocco. L'adresse et le texte (article 5) viennent d'un résumé de recherche remis au musée, et le musée n'a pas ouvert la page ; le fondateur a approuvé l'usage du texte tel que fourni le 21 novembre 2026."
  es: "Constitution of Morocco, 2011, tal como se publica en: Constitutional Court of Morocco. La dirección y el texto (artículo 5) proceden de un resumen de investigación entregado al museo, y el museo no abrió la página; el fundador aprobó usar el texto tal como se entregó el 21 de noviembre de 2026."
  tr: "\"Fas Anayasası, 2011,\" yayımlandığı şekliyle: Fas Anayasa Mahkemesi. Madde 5'in başlığı ve metni, müzenin sayfasını açmadığı bir araştırma özetinden alınmıştır; kurucu, metnin kullanımına 21 Kasım 2026'da belirtildiği şekilde izin vermiştir."
  id: "\"Konstitusi Maroko, 2011,\" sebagaimana diterbitkan di: Mahkamah Konstitusi Maroko. Judul dan teks Pasal 5 diambil dari ringkasan penelitian yang disediakan oleh museum, yang tidak dibuka oleh museum; pendiri mengizinkan penggunaan teks tersebut seperti yang dinyatakan pada 21 November 2026."
