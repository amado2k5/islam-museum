  ar: "مقالة ويكيبيديا الإنجليزية عن محمد علي بوغرا (1909–1963)، رئيس وزراء باكستان الثالث (1953–1955)؛ تعطي مولده في 19 تشرين الأول 1909 في بكرغانج ووفاته في 23 كانون الثاني 1963 في دكا، وتروي مسيرته الدبلوماسية وسقوط حكومته، ولا تذكر ديانته في أي نص."
  en: "The English Wikipedia article on Mohammad Ali Bogra (1909–1963), Pakistan's third prime minister (1953–1955); it gives his birth on 19 October 1909 at Backergunge and his death on 23 January 1963 at Dacca, recounts his diplomatic career and the fall of his government, and says nothing about his religion in its text."
  es: "El artículo de la Wikipedia en inglés sobre Mohammad Ali Bogra (1909-1963), tercer primer ministro de Pakistán (1953-1955), indica que nació el 19 de octubre de 1909 en Backergunge y murió el 23 de enero de 1963 en Dacca, relata su carrera diplomática y la caída de su gobierno, y no menciona su religión en el texto."
  fr: "L'article de Wikipédia en anglais sur Mohammad Ali Bogra (1909-1963), troisième Premier ministre du Pakistan (1953-1955); il indique sa naissance le 19 octobre 1909 à Backergunge et sa mort le 23 janvier 1963 à Dacca, relate sa carrière diplomatique et la chute de son gouvernement, et ne dit rien sur sa religion dans son texte."
