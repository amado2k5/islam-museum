reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026, and its content checked against the recorded revision. It gives Baaba Maal, born 12 November 1953 at Podor on the Senegal River (agreeing with Wikidata, against the English and French articles' 13 June 1953; the record follows this article and Wikidata and carries the date as debated); his singing in Pulaar and his promotion of the traditions of the Pulaar-speaking people of Futa Tooro; his expected future as a fisherman, changed under the influence of the blind guitarist Mansour Seck; music learned from his mother and his school headmaster; study in Dakar and then in Paris; his return to study traditional music with Seck and perform with Daande Lenol; and the main line of his albums and charity concerts, including his appointment as a UNDP emissary in July 2003. The article states no religion for him."
