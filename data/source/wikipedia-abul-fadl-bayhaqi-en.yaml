summary:
  ar: "سيرة المؤرخ والكاتب الغزنوي أبي الفضل محمد بن حسين البيهقي (نحو 995–1077) في ويكيبيديا الإنجليزية، استنادًا أساسًا إلى مدخل يوسفي في الموسوعة الإيرانية وبوثورث: مولده في حارث آباد ببيهق ونشأته في نيسابور، خدمته في ديوان الرسائل تسعة عشر عامًا عند أبي نصر مشكان، وسجنه وتقاعده، وتأليفه «تاريخ البيهقي» في اثنين وعشرين عامًا، ووفاته بغزنة في 21 أيلول 1077."
  en: "English Wikipedia biography of the Ghaznavid secretary-historian Abu'l-Fadl Muhammad ibn Husayn Bayhaqi (c. 995 - 21 September 1077), resting chiefly on Yusofi's Encyclopaedia Iranica entry and Bosworth: birth at Harethabad in Bayhaq, education at Nishapur, nineteen years in the chancery under Abu Nasr Mushkan, dismissal and imprisonment, retirement to Ghazni, the twenty-two years spent writing the Tarikh-i Bayhaqi, and death at Ghazni on 21 September 1077."
  ur: "غزنوی منشی و مؤرخ ابوالفضل محمد بن حسین بیہقی (تقریباً 995ء – 21 ستمبر 1077ء) کی انگریزی ویکیپیڈیا سوانح، ماخذِ اساسی یوسفی کا ایرانیکا مدخل اور بوسورتھ: بیہق کے حارث آباد میں پیدائش، نیشاپور میں تعلیم، ابو نصر مشکان کے ماتحت دیوانِ رسالت میں انیس برس، قید و سبکدوشی، اور بائیس برس میں «تاریخِ بیہقی» کی تصنیف۔"
