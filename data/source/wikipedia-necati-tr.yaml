summary:
  ar: "مقالة ويكيبيديا التركية عن نجاتي بك ⁦(ت. 1509)⁩؛ تنصّ صراحة على أن تاريخ ميلاده غير معروف وأن اسمه الحقيقي «عيسى» في الرأي الغالب ⁦(وفي بعض المصادر «نوح»)⁩، وأن مسقط رأسه يُظن قسطمونة، وأنه عمل كاتب ديوان للأمير عبد الله، وأن وفاته سنة 1509 غير مؤكدة تمامًا."
  en: "Turkish Wikipedia article on Necâtî Bey (d. 1509); it states plainly that his birth date is unknown, that his real name is generally held to be İsa (some sources say Nuh), that his birthplace is thought to be Kastamonu, that he served as divan secretary to Prince Abdullah, and that even his death year 1509 is not certain."
  es: "Artículo de la Wikipedia en turco sobre Necâtî Bey (fallecido en 1509); afirma claramente que se desconoce su fecha de nacimiento, que generalmente se considera que su verdadero nombre era İsa (algunas fuentes dicen Nuh), que se cree que nació en Kastamonu, que fue secretario del diván del príncipe Abdullah, e incluso que el año de su muerte, 1509, no es seguro."
  fr: "L'article de Wikipédia turc sur Necâtî Bey (mort en 1509) indique clairement que sa date de naissance est inconnue, que son vrai nom est généralement considéré comme étant İsa (certaines sources disent Nuh), que son lieu de naissance serait Kastamonu, qu'il a servi comme secrétaire du divan du prince Abdullah, et que même son année de décès, 1509, n'est pas certaine."
  ur: "Necâtî Bey (d. 1509) پر ترکی ویکیپیڈیا مضمون؛ اس میں واضح طور پر کہا گیا ہے کہ اس کی تاریخ پیدائش نامعلوم ہے، کہ اس کا اصل نام عام طور پر عیسیٰ ⁦(بعض ذرائع نوح کہتے ہیں)⁩ رکھا جاتا ہے، کہ اس کی جائے پیدائش کسطامونو کے بارے میں خیال کیا جاتا ہے، کہ اس نے شہزادہ عبداللہ کے دیوان سیکرٹری کے طور پر کام کیا، اور یہ کہ ان کی وفات کا سال 1509 بھی یقینی نہیں ہے۔"
