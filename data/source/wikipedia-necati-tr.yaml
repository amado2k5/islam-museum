  ar: "مقالة ويكيبيديا التركية عن نجاتي بك (ت. 1509)؛ تنصّ صراحة على أن تاريخ ميلاده غير معروف وأن اسمه الحقيقي «عيسى» في الرأي الغالب (وفي بعض المصادر «نوح»)، وأن مسقط رأسه يُظن قسطمونة، وأنه عمل كاتب ديوان للأمير عبد الله، وأن وفاته سنة 1509 غير مؤكدة تمامًا."
  en: "Turkish Wikipedia article on Necâtî Bey (d. 1509); it states plainly that his birth date is unknown, that his real name is generally held to be İsa (some sources say Nuh), that his birthplace is thought to be Kastamonu, that he served as divan secretary to Prince Abdullah, and that even his death year 1509 is not certain."
