  ar: "صفحة جنان يوسف في موقع معهد يقين للأبحاث الإسلامية؛ تعدّد سبعة عشر موردًا من مقالاتها وأوراقها وحلقاتها عن أسماء الله والقرآن، وتقدّمها بصفتها الدكتورة جنان يوسف من كبار الباحثين في المعهد."
  en: "Jinan Yousef's page on the Yaqeen Institute for Islamic Research website, listing seventeen of her articles, papers and programme episodes on the names of Allah and the Qur'an, and presenting her as Dr. Jinan Yousef, a Senior Fellow of the institute."
