  fr: "La page de Jinan Yousef sur le site web de l'Institut Yaqeen de recherche islamique, répertoriant dix-sept de ses articles, documents et épisodes de programmes sur les noms d'Allah et du Coran, et la présentant comme le Dr Jinan Yousef, membre senior de l'institut."
  ur: "یاقین انسٹی ٹیوٹ فار اسلامک ریسرچ ویب سائٹ پر جنان یوسف کا صفحہ، اللہ اور قرآن کے ناموں پر ان کے سترہ مضامین، مقالات اور پروگرام کی اقساط کی فہرست، اور انہیں انسٹی ٹیوٹ کے سینئر فیلو ڈاکٹر جنان یوسف کے طور پر پیش کر رہا ہے۔"
