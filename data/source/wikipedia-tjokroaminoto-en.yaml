summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عمر سعيد تجوكروامينوتو؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 16 آب 1882 بفونوروغو ووفاته في 17 كانون الأول 1934 بيوجياكارتا، وتدرّجه في الخدمة المدنية، واشتراكه في تأسيس شريكة الإسلام ورئاسته لها، وتلاميذه ومنهم سوكارنو، وحجّه، واعتقاله سنة 1921 وإطلاقه سنة 1922."
  en: "English Wikipedia article on Oemar Said Tjokroaminoto; used for entity facts only. It gives his birth on 16 August 1882 at Ponorogo and his death on 17 December 1934 at Yogyakarta, his civil-service career, his co-founding of Sarekat Islam and his chairmanship of it, his pupils including Sukarno, his Hajj, and his arrest in 1921 and release in 1922."
  es: "Artículo de la Wikipedia en inglés sobre Oemar Said Tjokroaminoto; utilizado únicamente para datos biográficos. En él se detallan su nacimiento el 16 de agosto de 1882 en Ponorogo y su fallecimiento el 17 de diciembre de 1934 en Yogyakarta, su carrera en la administración pública, su cofundación de Sarekat Islam y su presidencia de la misma, sus alumnos, entre ellos Sukarno, su peregrinación a La Meca (Hajj) y su arresto en 1921 y su liberación en 1922."
  fr: "Article de Wikipédia en anglais sur Oemar Said Tjokroaminoto; utilisé uniquement pour les informations sur l’entité. Il indique sa naissance le 16 août 1882 à Ponorogo et sa mort le 17 décembre 1934 à Yogyakarta, sa carrière dans la fonction publique, sa cofondation de Sarekat Islam et sa présidence de cette organisation, ses élèves, dont Sukarno, son pèlerinage à La Mecque, ainsi que son arrestation en 1921 et sa libération en 1922."
