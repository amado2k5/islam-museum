  ar: "مقالة ويكيبيديا الإنجليزية عن عمر سعيد تجوكروامينوتو؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 16 آب 1882 بفونوروغو ووفاته في 17 كانون الأول 1934 بيوجياكارتا، وتدرّجه في الخدمة المدنية، واشتراكه في تأسيس شريكة الإسلام ورئاسته لها، وتلاميذه ومنهم سوكارنو، وحجّه، واعتقاله سنة 1921 وإطلاقه سنة 1922."
  en: "English Wikipedia article on Oemar Said Tjokroaminoto; used for entity facts only. It gives his birth on 16 August 1882 at Ponorogo and his death on 17 December 1934 at Yogyakarta, his civil-service career, his co-founding of Sarekat Islam and his chairmanship of it, his pupils including Sukarno, his Hajj, and his arrest in 1921 and release in 1922."
