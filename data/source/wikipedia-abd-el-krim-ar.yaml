  ar: "مقالة ويكيبيديا العربية عن محمد بن عبد الكريم الخطابي الورياغلي (12 يناير 1882 بأجدير – 6 فبراير 1963 بالقاهرة)؛ تسرد نشأته وتعليمه بالقرويين وقضاءه بمليلية ومعركة أنوال وجمهورية الريف ونفيه ورئاسته لجنة تحرير المغرب العربي ودفنه بمقبرة الشهداء بالقاهرة."
  en: "The Arabic Wikipedia article on Abd el-Krim (Muhammad ibn Abd al-Karim al-Khattabi; 12 January 1882 at Ajdir – 6 February 1963 at Cairo), covering his upbringing, his studies at al-Qarawiyyin, his judgeship in Melilla, the Battle of Annual, the Republic of the Rif, his exile, his presidency of the Arab Maghreb Liberation Committee, and his burial in the Martyrs' Cemetery in Cairo."
