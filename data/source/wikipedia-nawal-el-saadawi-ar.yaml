summary:
  ar: "مقالة ويكيبيديا العربية «نوال السعداوي»؛ تُستخدم لوقائع الكيان فقط. يذكر صندوق معلوماتها ديانتها «إلحاد»، وهو حقل مستمد من ويكيداتا، وتنقل المقالة تصريحاتها في الدين والحجاب والختان بنصّها."
  en: "Arabic Wikipedia article on Nawal El Saadawi; used for entity facts only. Its infobox gives her religion as atheism — a field drawn from Wikidata — and its text quotes her statements on religion, the veil and circumcision."
  es: "Artículo en árabe de la Wikipedia sobre Nawal El Saadawi; se utiliza únicamente para obtener información sobre la persona. Su ficha informativa indica que su religión era atea —un dato extraído de Wikidata— y su texto cita sus declaraciones sobre religión, el velo y la circuncisión."
  fr: "Article Wikipédia en arabe sur Nawal El Saadawi; utilisé uniquement pour les informations la concernant. Son infobox indique qu'elle était athée (information issue de Wikidata) et son texte cite ses déclarations sur la religion, le voile et la circoncision."
  ur: "عربی ویکیپیڈیا مضمون نوال السعادوی پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا انفو باکس اس کے مذہب کو الحاد کے طور پر دیتا ہے — ایک فیلڈ جو Wikidata سے لیا گیا ہے — اور اس کا متن مذہب، پردے اور ختنہ سے متعلق اس کے بیانات کا حوالہ دیتا ہے۔"
  tr: "Arapça Vikipedi makalesi \"Nawal Al-Saadawi\"; yalnızca varlığın gerçekleri için kullanılmıştır. Bilgi kutusunda dinini \"ateizm\" olarak belirtir; bu alan Wikidata'dan türetilmiş ve makalede din, başörtüsü ve sünnetle ilgili açıklamaları metinlerinde sunulmaktadır."
  id: "Artikel Wikipedia Arab \"Nawal Al-Saadawi\"; digunakan hanya untuk fakta entitas. Infobox-nya menyebutkan agamanya sebagai \"ateisme,\" sebuah bidang yang berasal dari Wikidata, dan artikel tersebut menyajikan pernyataannya tentang agama, hijab, dan sunat dalam teksnya."
