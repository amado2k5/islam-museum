reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Covers her birth at Kafr Tahla on 27 October 1931, her career and posts, the 1981 imprisonment, the 2008 court rejection of the nationality suit, her works list, her statements on religion (including the 2015 Hajj comments and her sayings on the Black Stone and circumcision), and her death on 21 March 2021, which the article dates in Hijri as 8 Sha'ban 1442 and places in South Giza in the infobox, against the Cairo of the English article and Britannica; the article also records her burial in the family cemetery at 6th of October City. The infobox religion field ('atheism') reproduces Wikidata's P140 and is therefore not an independent attestation; it is treated as one source family with Wikidata in the person record. Read in full on 24 October 2026."
