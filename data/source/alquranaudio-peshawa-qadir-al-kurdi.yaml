reliability_note: "A reciter-directory profile, a low-authority secondary source used only for what it states plainly: that he is a Kurdish-Iraqi reciter, that he is based in the Kurdistan Region of Iraq, that he serves as an imam in Sulaymaniyah, and that his recordings of al-Kahf, Maryam and al-Rahman are widely played. It lists him among full-mushaf reciters in the Hafs 'an 'Asim narration — a qira'a fact about the recitation, not a school attestation for the man. The wave-199 harvest treated the Sulaymaniyah imamate as a single-profile claim and left his base city otherwise unresolved; it is recorded here with that weight. Read on 9 November 2026."
