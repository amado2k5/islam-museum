  ar: "مقالة ويكيبيديا الإنجليزية عن إيكا تجيبتا ويدجاجا، المولود باسم أوي إك تجونغ نحو 1921 في تشيوانتشو بالصين والمتوفى في 26 كانون الثاني 2019 في جاكرتا، مؤسس مجموعة سينار ماس؛ تذكر هجرته طفلًا إلى ماكاسار وتجارته بالكوبرا وبناءه مصانع الورق والبنوك، ووفاته في منزله في منتنغ ودفنه في كاراوانغ."
  en: "English Wikipedia article on Eka Tjipta Widjaja, born Oei Ek Tjong around 1921 in Quanzhou, China, and died 26 January 2019 in Jakarta, founder of the Sinar Mas Group; it records his childhood migration to Makassar, his copra trading, his paper mills and banks, and his death at his Menteng home and burial in Karawang."
