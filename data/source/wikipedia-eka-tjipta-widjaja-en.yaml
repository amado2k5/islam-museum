summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن إيكا تجيبتا ويدجاجا، المولود باسم أوي إك تجونغ نحو 1921 في تشيوانتشو بالصين والمتوفى في 26 كانون الثاني 2019 في جاكرتا، مؤسس مجموعة سينار ماس؛ تذكر هجرته طفلًا إلى ماكاسار وتجارته بالكوبرا وبناءه مصانع الورق والبنوك، ووفاته في منزله في منتنغ ودفنه في كاراوانغ."
  en: "English Wikipedia article on Eka Tjipta Widjaja, born Oei Ek Tjong around 1921 in Quanzhou, China, and died 26 January 2019 in Jakarta, founder of the Sinar Mas Group; it records his childhood migration to Makassar, his copra trading, his paper mills and banks, and his death at his Menteng home and burial in Karawang."
  es: "Artículo de la Wikipedia en inglés sobre Eka Tjipta Widjaja, nacido Oei Ek Tjong alrededor de 1921 en Quanzhou, China, y fallecido el 26 de enero de 2019 en Yakarta, fundador del Grupo Sinar Mas; en él se narra su migración infantil a Makassar, su comercio de copra, sus fábricas de papel y bancos, y su fallecimiento en su casa de Menteng y su entierro en Karawang."
  fr: "L'article de Wikipédia en anglais sur Eka Tjipta Widjaja, né Oei Ek Tjong vers 1921 à Quanzhou, en Chine, et décédé le 26 janvier 2019 à Jakarta, fondateur du groupe Sinar Mas, relate son enfance passée à Makassar, son commerce de coprah, ses papeteries et ses banques, ainsi que sa mort à son domicile de Menteng et son enterrement à Karawang."
