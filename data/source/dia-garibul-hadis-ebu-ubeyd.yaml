reliability_note: "Read in the museum's session on 20 November 2026. It calls the work one of the first written on the rare words of the hadith, and by some authors the first in the genre, since earlier studies were treatises while this rests, in the author's own words, on forty years of work; says Abu Ubayd also wrote the first dictionary of rare words, al-Gharib al-musannaf; and that he did not arrange the words alphabetically, al-Khatib al-Baghdadi reporting a musnad order that is not clearly visible in the printed editions. Used for entity facts only."
