summary:
  ar: "مدخل «موسوعة الإسلام» لمؤسسة الشؤون الدينية التركية TDV عن غريب الحديث لأبي عبيد، اطُّلع عليه في ٢٠ نوفمبر ٢٠٢٦؛ يُستخدم لوقائع الكيان: مكانته بين أوائل مؤلفات هذا الفن وترتيبه."
  en: "The TDV İslâm Ansiklopedisi entry on Gharib al-Hadith of Abu Ubayd (online edition), read on 20 November 2026; used for entity facts: its place among the first works of the field and its arrangement."
  es: "Entrada de la TDV İslâm Ansiklopedisi sobre Gharib al-Hadith of Abu Ubayd (edición en línea), consultada el 20 de noviembre de 2026; utilizada para datos de la entidad: su lugar entre las primeras obras del campo y su ordenación."
  fr: "Article de la TDV İslâm Ansiklopedisi sur Gharib al-Hadith of Abu Ubayd (édition en ligne), consulté le 20 novembre 2026 ; utilisé pour les données de l'entité : sa place parmi les premières œuvres du domaine et son classement."
  ur: "TDV İslâm Ansiklopedisi ⁦(آن لائن ایڈیشن)⁩ میں Gharib al-Hadith of Abu Ubayd پر اندراج، 20 نومبر 2026 کو پڑھا؛ ہستی کے حقائق کے لیے استعمال: اس فن کی ابتدائی کتب میں مقام اور ترتیب."
  tr: "Türk Dini İşler Vakfı (TDV) tarafından hazırlanan \"İslam Ansiklopedisi\" için Ebu Ubeyd'in nadir hadisi hakkındaki madde, 20 Kasım 2026 tarihinde erişildi; varlığın gerçekleri için kullanıldı: bu sanatın en eski eserleri arasında statüsü ve düzeni."
  id: "Entri untuk \"Ensiklopedia Islam\" oleh Yayasan Urusan Agama Turki (TDV) tentang hadis langka Abu Ubaid, diakses pada 20 November 2026; digunakan untuk fakta entitas: statusnya di antara karya seni ini paling awal dan penataannya."
title: "ĠARÎBÜ’l-ḤADÎS̱ (Ebû Ubeyd)"
