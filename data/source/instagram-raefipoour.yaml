reliability_note: "His own page, run jointly for him and the Masaf Institute: a primary source for his self-presentation and a dated platform figure, not independent corroboration of biography. The profile was read directly on Instagram on 7 November 2026 and showed 1,002,269 followers and 52 following, with the Masaf Telegram channel as its website link. This fresh on-platform read is the figure carried in the record; it is close to, and slightly below, the wave-194 harvest's Tier-1 figure of 1.1 million from on-platform post metadata of 15 October 2026. The hafi.pro tracker has no page for this handle (checked 7 November 2026) and the instastatistics page for the handle could not be read in this run, so the on-platform profile read is the build's count source. No Masaf YouTube count is cited, per the wave brief."
