summary:
  ar: "مقالة ويكيبيديا الفارسية عن بيير أميديار؛ تُستخدم لوقائع الكيان فقط. مقالة قصيرة تعطي ولادته في 21 يونيو 1967 باسم برويز مراد أميديار وتأسيسه إيباي وشبكة أميديار وترتيبه في قائمة فوربس. لا تذكر دينه."
  en: "Persian Wikipedia article on Pierre Omidyar; used for entity facts only. A short article giving his birth as 21 June 1967 under the name Parviz Morad Omidyar, his founding of eBay and of Omidyar Network, and his Forbes ranking. It makes no statement of his religion."
  es: "Artículo de Wikipedia en persa sobre Pierre Omidyar; utilizado únicamente para datos sobre la persona. Un breve artículo que indica que nació el 21 de junio de 1967 con el nombre de Parviz Morad Omidyar, fundó eBay y Omidyar Network, y figura en la lista de Forbes. No menciona su religión."
  fr: "Article Wikipédia en persan sur Pierre Omidyar; utilisé uniquement pour des informations factuelles. Ce court article indique sa naissance le 21 juin 1967 sous le nom de Parviz Morad Omidyar, la création d’eBay et d’Omidyar Network, ainsi que son classement Forbes. Il ne mentionne pas sa religion."
  ur: "پیری اومیڈیار پر فارسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ پرویز مراد امید یار کے نام سے 21 جون 1967 کو ان کی پیدائش، ای بے اور امید یار نیٹ ورک کے ان کے بانی، اور فوربس کی درجہ بندی کا ایک مختصر مضمون۔ اس میں اس کے مذہب کا کوئی بیان نہیں ہے۔"
  tr: "Pierre Amidyar hakkında Farsça Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Kısa bir makale, 21 Haziran 1967'de Parviz Murad Amidyar olarak doğduğunu, eBay ve Amadiar ağının kuruluşunu ve Forbes listesindeki sıralamasını belirtir. Dini hakkında hiç bahsedilmiyor."
  id: "Artikel Wikipedia Persia tentang Pierre Amidyar; digunakan hanya untuk fakta entitas. Sebuah artikel singkat menyebutkan kelahirannya pada 21 Juni 1967 sebagai Parviz Murad Amidyar, pendiri eBay dan jaringan Amadiar, serta peringkatnya dalam daftar Forbes. Artikel tersebut tidak menyebutkan agamanya."
