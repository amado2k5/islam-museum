summary:
  ar: "مقالة ويكيبيديا الفرنسية عن محمد ولد الغزواني؛ تُستخدم لوقائع الكيان فقط. صندوقها يذكر الإسلام دينا، ومتنها يذكر ولادته في 31 ديسمبر 1956 في بومديد في أسرة صوفية، وأنه «يُعرّف نفسه بأنه مسلم متمسك بقيم الإسلام والطقس المالكي» مستشهدة بصحيفتي لاليبر ولوبينيون؛ وهي المقالة الوحيدة التي تسمي مذهبا له شخصيا في متنها."
  en: "French Wikipedia article on Mohamed Ould Ghazouani; used for entity facts only. Its infobox gives his religion as Islam. Its biography gives his birth on 31 December 1956 at Boumdeid into a Sufi family, son of a spiritual leader of the maraboutic Ideiboussat tribe, and — citing La Libre of 2 August 2019 and L'Opinion of 3 October 2021 — says he defines himself as a Muslim attached to the values of Islam and to the Maliki rite. It is the only article whose own text names a school for him personally; the Arabic article carries the same passage on the same citations."
