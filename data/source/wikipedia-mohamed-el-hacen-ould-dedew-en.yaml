  ar: "مقالة ويكيبيديا الإنجليزية عن محمد الحسن بن الددو الشنقيطي؛ تُستخدم لوقائع الكيان فقط. تذكر ميلاده في بوتلميت في 31 أكتوبر 1963 ونشأته العلمية وحفظه القرآن وإجازاته في الحديث، ورئاسته لمركز تكوين العلماء وجامعة عبد الله بن يسين، ونائب رئيس الاتحاد العالمي لعلماء المسلمين سنة 2014."
  en: "English Wikipedia article on Muhammad al-Hasan al-Diddu al-Shanqiti; used for entity facts only. It records his birth in Boutilimit on 31 October 1963, his scholarly upbringing, memorisation of the Qur'an and licenses in hadith, his presidency of the Center for the Development of Scholars and of Abdallah ibn Yasin University, and his vice-presidency of the International Union of Muslim Scholars in 2014."
