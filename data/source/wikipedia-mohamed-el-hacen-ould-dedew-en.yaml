summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد الحسن بن الددو الشنقيطي؛ تُستخدم لوقائع الكيان فقط. تذكر ميلاده في بوتلميت في 31 أكتوبر 1963 ونشأته العلمية وحفظه القرآن وإجازاته في الحديث، ورئاسته لمركز تكوين العلماء وجامعة عبد الله بن يسين، ونائب رئيس الاتحاد العالمي لعلماء المسلمين سنة 2014."
  en: "English Wikipedia article on Muhammad al-Hasan al-Diddu al-Shanqiti; used for entity facts only. It records his birth in Boutilimit on 31 October 1963, his scholarly upbringing, memorisation of the Qur'an and licenses in hadith, his presidency of the Center for the Development of Scholars and of Abdallah ibn Yasin University, and his vice-presidency of the International Union of Muslim Scholars in 2014."
  es: "Artículo de la Wikipedia en inglés sobre Muhammad al-Hasan al-Diddu al-Shanqiti; utilizado únicamente para datos biográficos. En él se registra su nacimiento en Boutilimit el 31 de octubre de 1963, su formación académica, la memorización del Corán y sus licencias en hadices, su presidencia del Centro para el Desarrollo de los Eruditos y de la Universidad Abdallah ibn Yasin, y su vicepresidencia de la Unión Internacional de Eruditos Musulmanes en 2014."
  fr: "Article de Wikipédia en anglais sur Muhammad al-Hasan al-Diddu al-Shanqiti; utilisé uniquement à des fins d’information sur l’entité. Il relate sa naissance à Boutilimit le 31 octobre 1963, sa formation académique, sa mémorisation du Coran et ses diplômes en hadith, sa présidence du Centre pour le développement des savants et de l’Université Abdallah ibn Yasin, ainsi que sa vice-présidence de l’Union internationale des savants musulmans en 2014."
  ur: "محمد الحسن الددو الشانقیتی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 31 اکتوبر 1963 کو بوتیلمیٹ میں ان کی پیدائش، ان کی علمی پرورش، قرآن کا حفظ اور حدیث میں لائسنس، سنٹر فار دی ڈویلپمنٹ آف اسکالرز اور عبداللہ ابن یاسین یونیورسٹی کی صدارت، اور 2014 میں مسلم اسکالرز کی بین الاقوامی یونین کی نائب صدر کے طور پر ریکارڈ کیا گیا ہے۔"
  tr: "Muhammed el-Hasan ibn el-Dadu el-Shanqeeti hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılır. 31 Ekim 1963'te Boutilimityte'de doğduğunda, bilimsel yetiştirilmesi, Kur'an'ı ezberlemesi, hadis yetkilendirmesi, Alimlerin Eğitimi Merkezi ve Abdullah ibn Yassine Üniversitesi başkanlığı ve 2014'te Uluslararası Müslüman Alimler Birliği başkan yardımcılığı sırasında anılır."
  id: "Artikel Wikipedia bahasa Inggris tentang Muhammad al-Hasan ibn al-Dadu al-Shanqeeti; hanya digunakan untuk fakta entitas. Ia disebutkan saat kelahirannya di Boutilimityte pada 31 Oktober 1963, didikan sebagai akademis, menghafal Al-Quran, otorisasi dalam hadis, menjabat sebagai presiden di Center for the Training of Scholars dan Universitas Abdullah ibn Yassine, serta wakil presiden International Union of Muslim Scholars pada tahun 2014."
