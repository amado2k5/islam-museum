reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 at the recorded revision (revid asserted equal before use). It gives Muhammad al-Hasan bin al-Dido al-Shanqiti, born 31 October 1963 in Boutilimit, Mauritania; raised in a scholarly family, his grandfather Muhammad Ali bin Abd al-Wadud his first tutor; memorisation of the Qur'an and study of the ten readings with his mother; licenses to teach the major hadith collections; president of the Scholars' Information Center and of Abdallah ibn Yasin University; head of the Center for the Development of Scholars; vice-president of the International Union of Muslim Scholars in 2014. Its infobox carries the religion fields (Religion Islam, Jurisprudence Maliki, Creed Ash'ari) only inside a commented-out block that is not displayed, and no text in the article names a school for him."
