reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision. It gives him as born in 1874 at Liuhe in Jiangsu, of Kipchak descent, religious name Nur Muhammad, and died on 21 June 1965 at Beijing; it attests his study as a khalifa under the ahong Wang Haoran at Beijing's Niujie Mosque, his appointment by the Gansu education commissioner Ma Linyi, the founding of the Shanghai Islamic Normal School in 1928 with Ma Fuxiang as chairman and Da Pusheng as principal, his wartime missions to Egypt, Saudi Arabia and India, and his post-1949 offices, among them head of the first and second hajj delegations and vice-chairman of the Islamic Association of China. It names no school, order or movement for him."
