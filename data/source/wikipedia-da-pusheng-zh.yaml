  ar: "مقالة ويكيبيديا الصينية عن دا بوشينغ؛ تُستخدم لوقائع الكيان فقط، وهي مقالته الوحيدة في أي لغة. تروي العالم من ليوخه (1874–1965) الذي درس عند وانغ هاوران في مسجد نيوجيه، وعيّنه ما ليني مديرًا لمكتب تعليم الهوي في قانسو، وشارك في إنشاء المدرسة الإسلامية النظامية في شنغهاي سنة 1928 وأدارها، وترأّس بعد 1949 وفود الحج."
  en: "Chinese Wikipedia article on Da Pusheng; used for entity facts only, and his only article in any language. It recounts the Liuhe scholar (1874 – 21 June 1965) who studied under Wang Haoran at the Niujie Mosque, was appointed by Ma Linyi to direct the Gansu Hui education office, co-founded the Shanghai Islamic Normal School in 1928 as its principal, and after 1949 led China's hajj delegations."
