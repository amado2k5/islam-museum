  ar: "مقالة ويكيبيديا العربية عن بير مهر علي شاه (1859–1937)؛ مادتها الأساسية مترجمة عن الإنجليزية، وتصفه بأنه باحث وشاعر صوفي من البنجاب ينتمي إلى الطريقة الجشتية وعالم حنفي، وتفصّل بيعته لخواجة شمس الدين السيالوي على الطريقة الجشتية النظامية وإجازة إمداد الله المهاجر المكي له بسلسلة جشتية صابرية."
  en: "The Arabic Wikipedia article on Pir Meher Ali Shah (1859–1937); its core is translated from the English article, describing him as a Punjabi Sufi scholar and poet of the Chishti order and a Hanafi scholar, and detailing his bay'ah to Khawaja Shams-ud-din Sialvi in the Chishti Nizami order and Haji Imdadullah Muhajir Makki's grant to him of a Chishti Sabiri silsila."
