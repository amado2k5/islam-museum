summary:
  ar: "مقالة لأحمد نوح و كريم عوض في مجلة «كان» التاريخية ⁦(2023، ص58-73)⁩ تعالج بيلتا طليطلة — الحوضين المائيين المنسوبين إلى الزرقالي — على أنها أعجوبة هندسية في تقنيات النوافير المائية الأندلسية. قرئت بياناتها الببليوغرافية والملخص فقط؛ لم تُقرأ تحليلاتها الهندسية التفصيلية فلا يُستند إليها في أي دعوى آلية."
  en: "An article by Nouh and Awad Karim in the Kan historical journal (2023, pp. 58-73) treating the Baylatan of Toledo — the twin water basins attributed to al-Zarqali — as an engineering marvel of Andalusi waterwheel technology. Only bibliographic data and the abstract were read; its detailed engineering analysis was not independently verified and supports no mechanism claim here."
  ur: "احمد نوح اور کریم عوض کا مضمون «کان» ہسٹری جرنل میں ⁦(2023، ص58-73)⁩ جو طلیطلہ کے بيلتا — زرقالی سے منسوب دو پانی کے حوضوں — کو اندلسی واٹر وہیل ٹیکنالوجی کا انجینئرنگ عجوبہ قرار دیتا ہے۔ صرف کتابیاتی تفصیلات اور خلاصہ پڑھا گیا؛ اس کا تفصیلی انجینئرنگ تجزیہ آزادانہ تصدیق نہیں ہوا اس لیے یہاں کسی میکانزم کے دعوے کی بنیاد نہیں بنتا۔"
  es: "Un artículo de Nouh y Awad Karim publicado en la revista histórica Kan (2023, pp. 58-73) trata sobre el Baylatan de Toledo —las dos dársenas atribuidas a al-Zarqali— como una maravilla de la ingeniería andalusí de la tecnología de la rueda hidráulica. Solo se consultaron los datos bibliográficos y el resumen; su análisis técnico detallado no fue verificado de forma independiente y no respalda ninguna de las afirmaciones sobre su mecanismo."
  fr: "Un article de Nouh et Awad Karim paru dans la revue historique Kan (2023, p. 58-73) présente les Baylatan de Tolède – les deux bassins attribués à al-Zarqali – comme un chef-d'œuvre d'ingénierie de la technologie andalouse des roues hydrauliques. Seules les données bibliographiques et le résumé ont été consultés; l'analyse technique détaillée n'a pas été vérifiée indépendamment et ne confirme aucune hypothèse quant à leur mécanisme."
