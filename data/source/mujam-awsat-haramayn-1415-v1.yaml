label:
  ar: "الطبراني، المعجم الأوسط، الجزء الأول، تحقيق طارق بن عوض الله وعبد المحسن بن إبراهيم الحسيني ⁦(دار الحرمين، القاهرة، 1415هـ/1995م)⁩"
  en: "al-Tabarani, al-Mu'jam al-Awsat, vol. 1, ed. Tariq ibn Awad Allah and Abd al-Muhsin ibn Ibrahim al-Husayni (Dar al-Haramayn, Cairo, 1415/1995)"
  ur: "طبرانی، المعجم الاوسط، جلد اول، تحقیق طارق بن عوض اللہ و عبد المحسن بن ابراہیم الحسینی ⁦(دار الحرمین، قاہرہ، 1415ھ/1995ء)⁩"
summary:
  ar: "الجزء الأول ⁦(الأحاديث 1–1037)⁩ من «المعجم الأوسط» للحافظ أبي القاسم سليمان بن أحمد الطبراني ⁦(260–360هـ)⁩، بتحقيق أبي معاذ طارق بن عوض الله بن محمد وأبي الفضل عبد المحسن بن إبراهيم الحسيني، دار الحرمين للطباعة والنشر، القاهرة، 1415هـ/1995م؛ في صدره عمل المحققين، وترجمة الطبراني من «سير أعلام النبلاء»، ونقد الطبعة السابقة للأجزاء الأولى، ووصف النسخ الخطية."
  en: "Volume 1 (hadiths 1–1037) of al-Mu'jam al-Awsat by al-Hafiz Abu al-Qasim Sulayman ibn Ahmad al-Tabarani (260–360 AH), edited by Abu Mu'adh Tariq ibn Awad Allah ibn Muhammad and Abu al-Fadl Abd al-Muhsin ibn Ibrahim al-Husayni, Dar al-Haramayn, Cairo, 1415/1995; it opens with the editors' account of their work, al-Tabarani's life from Siyar A'lam al-Nubala', a critique of the earlier printing of the first volumes, and a description of the manuscripts."
  es: "Volumen 1 (hadices 1–1037) de al-Mu'jam al-Awsat de al-Hafiz Abu al-Qasim Sulayman ibn Ahmad al-Tabarani (260–360 AH), editado por Abu Mu'adh Tariq ibn Awad Allah ibn Muhammad y Abu al-Fadl Abd al-Muhsin ibn Ibrahim al-Husaini, Dar al-Haramayn, El Cairo, 1415/1995; comienza con el relato de los editores sobre su trabajo, la vida de al-Tabarani según Siyar 'lam al-Nubala', una crítica de la impresión anterior de los primeros volúmenes y una descripción de los manuscritos."
  fr: "Volume 1 (hadiths 1–1037) d'al-Mu'jam al-Awsat par al-Hafiz Abu al-Qasim Sulayman ibn Ahmad al-Tabarani (260–360 AH), édité par Abu Mu'adh Tariq ibn Awad Allah ibn Muhammad et Abu al-Fadl Abd al-Muhsin ibn Ibrahim al-Husaini, Dar al-Haramayn, Le Caire, 1415/1995; il s'ouvre sur le récit des éditeurs de leur travail, la vie d'al-Tabarani tirée de Siyar 'lam al-Nubala', une critique de l'impression antérieure des premiers volumes et une description des manuscrits."
  ur: "المعجم الاوسط کی جلد 1 ⁦(حدیث 1–1037)⁩ از الحافظ ابو القاسم سلیمان بن احمد الطبرانی ⁦(260-360 ہجری)⁩، ابو معاذ طارق بن عواد اللہ ابن محمد اور ابو الفضل ابن الثنائب الدارنیب المنیب المعروف ابو معاذ طارق بن عواد اللہ ابن محمد نے ترمیم کی۔ الحرمین، قاہرہ، 1415/1995؛ اس کا آغاز ایڈیٹرز کے ان کے کام، الطبرانی کی زندگی سیار اعلام النبلاء سے، پہلی جلدوں کی ابتدائی طباعت پر تنقید، اور مخطوطات کی تفصیل سے ہوتا ہے۔"
  tr: "Al-Hafız Ebu Kasım Süleyman bin Ahmed El-Teberni'nin (260–360 H) tarafından düzenlenen \"El-Mu'jam El-Ewsat\"ın birinci cildi (Hadisler 1–1037), Ebu Mu'adh bin Awad Allah bin Muhammed ve Ebu Fadl Abdul Mohsen bin İbrahim El-Hüseyni, Dar Al-Haramain tarafından Basım ve Yayın için, Kahire, 1415 Hicri / 1995 M.S. tarafından düzenlenmiştir; başlangıcında editörlerin çalışmaları, El-Teberni'nin \"Siyar A'lam El-Nubala\" biyografisi, ilk ciltlerin önceki baskısının eleştirisi ve el yazmalarının tanımları yer almaktadır."
  id: "Jilid pertama (Hadis 1–1037) dari \"Al-Mu'jam Al-Awsat\" oleh Al-Hafiz Abu Al-Qasim Sulayman bin Ahmad Al-Tabarani (260–360 H), disunting oleh Abu Mu'adh bin Awad Allah bin Muhammad dan Abu Al-Fadl Abdul Mohsen bin Ibrahim Al-Husseini, Dar Al-Haramain untuk Percetakan dan Penerbitan, Kairo, 1415 H / 1995 M; di awal adalah karya para editor, biografi Al-Tabarani tentang \"Siyar A'lam Al-Nubala\", kritik terhadap edisi sebelumnya dari jilid-jilid pertama, serta deskripsi manuskrip-manuskrip tersebut."
