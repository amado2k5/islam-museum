summary:
  ar: "الجزء الأول ⁦(الأحاديث 1–1037)⁩ من «المعجم الأوسط» للحافظ أبي القاسم سليمان بن أحمد الطبراني ⁦(260–360هـ)⁩، بتحقيق أبي معاذ طارق بن عوض الله بن محمد وأبي الفضل عبد المحسن بن إبراهيم الحسيني، دار الحرمين للطباعة والنشر، القاهرة، 1415هـ/1995م؛ في صدره عمل المحققين، وترجمة الطبراني من «سير أعلام النبلاء»، ونقد الطبعة السابقة للأجزاء الأولى، ووصف النسخ الخطية."
  en: "Volume 1 (hadiths 1–1037) of al-Mu'jam al-Awsat by al-Hafiz Abu al-Qasim Sulayman ibn Ahmad al-Tabarani (260–360 AH), edited by Abu Mu'adh Tariq ibn Awad Allah ibn Muhammad and Abu al-Fadl Abd al-Muhsin ibn Ibrahim al-Husayni, Dar al-Haramayn, Cairo, 1415/1995; it opens with the editors' account of their work, al-Tabarani's life from Siyar A'lam al-Nubala', a critique of the earlier printing of the first volumes, and a description of the manuscripts."
