summary:
  ar: 'الجزء الثاني من الطبعة الأولى لـ«الأعلام: قاموس تراجم لأشهر الرجال والنساء من العرب والمستعربين والمستشرقين في الجاهلية والإسلام والعصر الحاضر» لخير الدين الزركلي، 1346هـ/1927م، حقوق الطبع للمؤلف؛ يبدأ بحرف الشين؛ مع ذكر المصدر لكل ترجمة في الحاشية.'
  en: Volume 2 of the first edition of al-A'lam - a dictionary of the best-known men and women among the Arabs, the Arabised and the Orientalists, pre-Islamic, Islamic and modern - by Khayr al-Din al-Zirikli, 1346/1927, copyright of the author; it begins with the letter shin, each entry with its source in a footnote.
  ur: 'خیر الدین زرکلی کی «الاعلام: قاموس تراجم لاشہر الرجال والنساء من العرب والمستعربین والمستشرقین» کے پہلے ایڈیشن کی جلد دوم، 1346ھ/1927ء، حقوقِ طبع مصنف کے؛ یہ حرفِ شین سے شروع ہوتی ہے، اور ہر ترجمے کا ماخذ حاشیے میں ہے۔'
