  en: "al-Ghazali, al-Mustasfa min Ilm al-Usul, vol. 1 (al-Maktaba al-Tijariyya al-Kubra, Cairo, 1356/1937)"
  ur: "غزالی، المستصفیٰ من علم الاصول، جلد اول (المکتبۃ التجاریۃ الکبریٰ، قاہرہ، 1356ھ/1937ء)"
summary:
  ar: "الجزء الأول من «المستصفى من علم الأصول» لحجة الإسلام أبي حامد محمد بن محمد بن محمد الغزالي، الطبعة الأولى 1356هـ/1937م، يُطلب من المكتبة التجارية الكبرى بأول شارع محمد علي بمصر لصاحبها مصطفى محمد، مطبوع بمطبعتها؛ يضم خطبة المؤلف والمقدمة المنطقية والقطب الأول في الأحكام والقطب الثاني في أدلة الأحكام، ومنها الأصول الموهومة الأربعة: شرع من قبلنا وقول الصحابي والاستحسان والاستصلاح."
  en: "Volume 1 of al-Mustasfa min Ilm al-Usul by Hujjat al-Islam Abu Hamid Muhammad ibn Muhammad ibn Muhammad al-Ghazali, first printing 1356 AH / 1937, sold by al-Maktaba al-Tijariyya al-Kubra at the start of Muhammad Ali Street, Cairo, owned by Mustafa Muhammad, and printed at its press; it contains the author's preface, the logical introduction, Pole 1 on rulings and Pole 2 on the proofs of rulings, including the four 'supposed sources': the law of earlier prophets, the Companion's opinion, istihsan and istislah."
  ur: "حجۃ الاسلام ابو حامد محمد بن محمد بن محمد غزالی کی «المستصفیٰ من علم الاصول» کی جلد اول، طبع اول 1356ھ/1937ء، المکتبۃ التجاریۃ الکبریٰ (شارع محمد علی، قاہرہ؛ مالک مصطفیٰ محمد) سے دستیاب اور اسی کے مطبع میں چھپی؛ اس میں مصنف کا خطبہ، منطقی مقدمہ، قطبِ اول (احکام) اور قطبِ دوم (ادلۂ احکام) ہیں، جن میں چار «اصولِ موہومہ» شامل ہیں: سابقہ شریعتیں، قولِ صحابی، استحسان اور استصلاح۔"
