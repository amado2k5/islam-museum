summary:
  ar: "مقالة ويكيبيديا الأردية عن محمد حسین آزاد؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 10 يونيو 1830 ووفاته في 22 يناير 1910، وتعليمه على يد والده ثم في ظل الشاعر ذوق، ودخوله كلية دلهي حيث كان نذير أحمد وذكاء الله من زملائه."
  en: "Urdu Wikipedia article on Muhammad Husain Azad; used for entity facts only. It gives his birth as 10 June 1830 and his death as 22 January 1910, records his early education by his father and under the poet Zauq, and his entry to Delhi College, where Nazir Ahmad and Zakaullah were among his fellow students."
  es: "Artículo de Wikipedia en urdu sobre Muhammad Husain Azad; utilizado únicamente para datos biográficos. Indica que nació el 10 de junio de 1830 y falleció el 22 de enero de 1910, relata su educación temprana con su padre y el poeta Zauq, y su ingreso al Delhi College, donde Nazir Ahmad y Zakaullah fueron algunos de sus compañeros de estudios."
  fr: "Article de Wikipédia en ourdou sur Muhammad Husain Azad; utilisé uniquement pour les informations factuelles. Il indique sa naissance le 10 juin 1830 et son décès le 22 janvier 1910, relate son éducation initiale dispensée par son père et le poète Zauq, ainsi que son entrée au Delhi College, où Nazir Ahmad et Zakaullah comptaient parmi ses camarades."
