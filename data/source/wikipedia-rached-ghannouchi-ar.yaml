summary:
  ar: "مقالة ويكيبيديا العربية عن راشد الغنوشي؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته من الجماعة الإسلامية إلى حركة النهضة، وسجنه في عهدي بورقيبة وبن علي، واغترابه، وعودته بعد الثورة، ويذكر صندوق معلوماتها دينه «الإسلام» بصورة عامة دون مذهب."
  en: "Arabic Wikipedia article on Rached Ghannouchi; used for entity facts only. It traces him from the Islamic Group to the Ennahda Movement, his imprisonments under Bourguiba and Ben Ali, his exile and his return after the revolution; its infobox gives his religion as Islam in general, with no school named."
  es: "Artículo de Wikipedia en árabe sobre Rached Ghannouchi; se utiliza únicamente para obtener información sobre la persona. En él se narra su trayectoria desde el Grupo Islámico hasta el Movimiento Ennahda, sus encarcelamientos bajo el régimen de Bourguiba y Ben Ali, su exilio y su regreso tras la revolución. Su ficha informativa indica que profesaba el islam en general, sin mencionar ninguna escuela específica."
  fr: "Article Wikipédia en arabe sur Rached Ghannouchi; utilisé uniquement pour les informations sur l’entité. Il retrace son parcours, du Groupe islamique au mouvement Ennahda, ses emprisonnements sous Bourguiba et Ben Ali, son exil et son retour après la révolution; son infobox indique qu’il est musulman, sans préciser d’école religieuse."
  ur: "راچد غنوچی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اسلامی گروپ سے النہضہ موومنٹ، بورگویبہ اور بن علی کے تحت اس کی قید، اس کی جلاوطنی اور انقلاب کے بعد اس کی واپسی کا پتہ چلتا ہے۔ اس کا انفو باکس اس کا مذہب عام طور پر اسلام کے طور پر دیتا ہے، جس کا کوئی اسکول نام نہیں ہے۔"
