summary:
  ar: "ملف «يوميات الجمال» في مجلة هاربرز بازار العربية ⁦(عدد مايو ٢٠٢٠)⁩ عن المؤثرة في الأزياء المحتشمة المقيمة في الرياض نيا عمرون، اللندنية السابقة، تعرض فيه روتينها الكامل للعناية بالبشرة والمكياج."
  en: "Harper's Bazaar Arabia's Beauty Diaries feature (May 2020 issue) on the Riyadh-based modest fashion influencer Nia Amroun, a former Londoner, in which she shares her full skincare and make-up routine."
  es: "En la sección \"Beauty Diaries\" de Harper's Bazaar Arabia (número de mayo de 2020), se presenta a Nia Amroun, una influencer de moda modesta afincada en Riad y originaria de Londres, en la que comparte su rutina completa de cuidado de la piel y maquillaje."
  fr: "Le numéro de mai 2020 de la rubrique « Beauty Diaries » de Harper's Bazaar Arabia est consacré à Nia Amroun, influenceuse de mode pudique basée à Riyad et ancienne Londonienne, dans laquelle elle partage sa routine complète de soins de la peau et de maquillage."
  ur: "ہارپر بازار عربیہ کی بیوٹی ڈائری کی خصوصیت ⁦(مئی 2020 کا شمارہ)⁩ ریاض میں مقیم معمولی فیشن پر اثر انداز کرنے والی نیا امرون، جو لندن کی ایک سابقہ ہے، جس میں وہ اپنی مکمل سکن کیئر اور میک اپ روٹین شیئر کرتی ہیں۔"
  tr: "Harper's Bazaar Arabic dergisinde (Mayıs 2020 sayısı) yayımlanan \"Beauty Diaries\" dosyası, Riyad'da yaşayan mütevazı moda fenomeni Nia Amroun'u konu alıyor; eski Londralı Nia Amroun, tam cilt bakım ve makyaj rutinini sunuyor."
  id: "File \"Beauty Diaries\" di majalah Harper's Bazaar Arabic (edisi Mei 2020) tentang influencer fashion modest yang tinggal di Riyadh, Nia Amroun, yang sebelumnya tinggal di London, mempresentasikan rutinitas perawatan kulit dan riasannya yang lengkap."
