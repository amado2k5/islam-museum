summary:
  ar: "مقالة ويكيبيديا العربية القصيرة عن فاطمة جناح؛ تعطي مولدها في 30 تموز 1893 نقلاً عن موسوعة أكسفورد للمرأة في التاريخ العالمي، ووفاتها في كراتشي في 9 تموز 1967، ولا تسمي لها مذهباً في متنها."
  en: "The short Arabic Wikipedia article on Fatima Jinnah; it gives her birth on 30 July 1893, citing the Oxford Encyclopedia of Women in World History, and her death at Karachi on 9 July 1967, and names no school for her in its text; its categories file her among Pakistani Ismailis."
  es: "El breve artículo de Wikipedia en árabe sobre Fatima Jinnah indica que nació el 30 de julio de 1893, citando la Enciclopedia Oxford de Mujeres en la Historia Mundial, y que murió en Karachi el 9 de julio de 1967, pero no menciona ninguna escuela a la que pertenezca; sus categorías la clasifican entre los ismaelitas pakistaníes."
  fr: "Le court article de Wikipédia en arabe sur Fatima Jinnah; il indique sa naissance le 30 juillet 1893, citant l'Oxford Encyclopedia of Women in World History, et sa mort à Karachi le 9 juillet 1967, et ne mentionne aucune école pour elle dans son texte; ses catégories la classent parmi les Ismaéliens pakistanais."
  ur: "فاطمہ جناح پر مختصر عربی ویکیپیڈیا مضمون؛ اس نے آکسفورڈ انسائیکلوپیڈیا آف ویمن ان ورلڈ ہسٹری کا حوالہ دیتے ہوئے 30 جولائی 1893 کو اس کی پیدائش کی، اور 9 جولائی 1967 کو کراچی میں اس کی موت، اور اس کے متن میں اس کے لیے کسی اسکول کا نام نہیں لیا۔ اس کے زمرے اسے پاکستانی اسماعیلیوں میں درج کرتے ہیں۔"
  tr: "Fatima Janah hakkında kısa Arapça Vikipedi makalesi; doğum tarihini 30 Temmuz 1893 olarak belirtir, Oxford Dünya Tarihinde Kadınlar Ansiklopedisi'nden alıntılanır ve 9 Temmuz 1967'de Karaçi'de öldüğü belirtilir ve herhangi bir düşünce okuluyla adlandırılmaz."
  id: "Artikel singkat Wikipedia dalam bahasa Arab tentang Fatima Janah; mencantumkan tanggal lahirnya 30 Juli 1893, dikutip dari Oxford Encyclopedia of Women in World History, dan kematiannya di Karachi pada 9 Juli 1967, dan tidak menyebutkan namanya berdasarkan aliran pemikiran apapun."
