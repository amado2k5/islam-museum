summary:
  ar: 'مقالة ويكيبيديا الأذربيجانية عن محمد أمين رسول زاده؛ تُستخدم لوقائع الكيان فقط. مقالة مطولة تتناول مولده في نوخاني سنة 1884 ومسيرته الحزبية والمجلس الوطني وجمهورية 1918 واعتقاله وإطلاقه ومنفاه: نشاطه في إسطنبول من أواخر 1922 وتحريره «يني قفقاسيا» فيها من 16 سبتمبر 1923 حتى حظرها سنة 1927، وسنواته الأوروبية والأنقرية الأخيرة ووفاته في أنقرة سنة 1955.'
  en: 'Azerbaijani Wikipedia article on Mahammad Amin Rasulzade; used for entity facts only. A very long article covering his Novkhany birth in 1884, his party and National Council career, the 1918 republic, his arrest and release, and his exile: active in Istanbul from late 1922, editing Yeni Qafqaziya there from 16 September 1923 until its 1927 ban, with his later European and Ankara years and his death at Ankara in 1955.'
  es: "Artículo de Wikipedia en azerbaiyano sobre Mahammad Amin Rasulzade; utilizado únicamente para datos sobre la persona. Un artículo muy extenso que abarca su nacimiento en Novkhany en 1884, su trayectoria en el partido y el Consejo Nacional, la república de 1918, su arresto y liberación, y su exilio: activo en Estambul desde finales de 1922, donde dirigió el periódico Yeni Qafqaziya desde el 16 de septiembre de 1923 hasta su prohibición en 1927, incluyendo sus años posteriores en Europa y Ankara, y su fallecimiento en Ankara en 1955."
  fr: "Article Wikipédia azerbaïdjanais sur Mahammad Amin Rasulzade; utilisé uniquement à des fins d'information sur l'entité. Cet article très long retrace sa naissance à Novkhany en 1884, son parcours au sein du parti et du Conseil national, la république de 1918, son arrestation et sa libération, ainsi que son exil: actif à Istanbul à partir de la fin de 1922, il y dirige le journal Yeni Qafqaziya du 16 septembre 1923 jusqu'à son interdiction en 1927, puis ses années en Europe et à Ankara, et sa mort à Ankara en 1955."
  ur: "محمد امین رسول زادے پر آذربائیجانی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ 1884 میں ان کی نوخانی کی پیدائش، ان کی پارٹی اور قومی کونسل کے کیریئر، 1918 کی جمہوریہ، ان کی گرفتاری اور رہائی، اور ان کی جلاوطنی کا احاطہ کرنے والا ایک بہت طویل مضمون: 1922 کے آخر سے استنبول میں سرگرم، 16 ستمبر 1923 سے لے کر 1927 کی پابندی تک وہاں ینی قفقازیہ کی تدوین کی، بعد میں ان کی یورپی اور انکرا میں وفات کے بعد ان کی وفات کے سال۔"
  tr: "Mohammad Amin Rasulzadeh hakkında Azerbaycanca Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1884'te Nokhani'deki doğumu, siyasi kariyeri, Ulusal Meclis, 1918 Cumhuriyeti, tutuklanması, serbest bırakılması ve sürgünü: 1922 sonlarından itibaren İstanbul'daki faaliyetleri ve 16 Eylül 1923'ten 1927'deki yasaklanmasına kadar orada 'Yeni Caffaksia'nın kurtarılması, son Avrupa ve Ankara yılları ve 1955'te Ankara'daki ölümü üzerine kapsamlı bir makale."
  id: "Artikel Wikipedia Azerbaijan tentang Mohammad Amin Rasulzadeh; digunakan hanya untuk fakta entitas. Artikel panjang yang membahas kelahirannya di Nokhani pada tahun 1884, karier politiknya, Majelis Nasional, Republik 1918, penangkapan, pembebasan, dan pengasingannya: aktivitasnya di Istanbul sejak akhir 1922 dan pembebasan 'Yeni Caffaksia' di sana dari 16 September 1923 hingga larangan pada 1927, tahun-tahun terakhirnya di Eropa dan Ankara, serta kematiannya di Ankara pada 1955."
