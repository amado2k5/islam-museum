summary:
  ar: 'مقالة ويكيبيديا الأذربيجانية عن محمد أمين رسول زاده؛ تُستخدم لوقائع الكيان فقط. مقالة مطولة تتناول مولده في نوخاني سنة 1884 ومسيرته الحزبية والمجلس الوطني وجمهورية 1918 واعتقاله وإطلاقه ومنفاه: نشاطه في إسطنبول من أواخر 1922 وتحريره «يني قفقاسيا» فيها من 16 سبتمبر 1923 حتى حظرها سنة 1927، وسنواته الأوروبية والأنقرية الأخيرة ووفاته في أنقرة سنة 1955.'
  en: 'Azerbaijani Wikipedia article on Mahammad Amin Rasulzade; used for entity facts only. A very long article covering his Novkhany birth in 1884, his party and National Council career, the 1918 republic, his arrest and release, and his exile: active in Istanbul from late 1922, editing Yeni Qafqaziya there from 16 September 1923 until its 1927 ban, with his later European and Ankara years and his death at Ankara in 1955.'
