reliability_note: "Copy used: the MNZOR1994AR scan on the microSD at books/lugha/lisan-arab/MNZOR1994AR/ (809 pages, Apple Vision OCR in pages.json and book.txt; the file name carries 1994 but the OCR of the title page gives no date, so no date is recorded). The title page (scan p. 1) gives the author, 'the first volume', and the publisher. The front matter carries no printed page numbers in the OCR, so the cites give scan numbers and are marked as such in the entry. Scan p. 2 is blank. Scan p. 4 quotes the biographical notice of Ibn Hajar, al-Durar al-Kamina, and of al-Suyuti, Bughyat al-Wu'at, and the footnote on scan p. 5 is read from OCR. Only the front matter was read; no dictionary entry was read or cited, and the volume's index and supplement were not checked. OCR errors are present in the front matter (for example in the dates on scans 4 and 5), so each date is quoted with its source and not taken from the OCR alone."
