label:
  ar: "لسان العرب — ابن منظور، دار صادر، بيروت ⁦(المجلد الأول)⁩"
  en: "Lisan al-Arab, Ibn Manzur, Dar Sadir, Beirut (vol. 1)"
  ur: "لسان العرب — ابن منظور، دار صادر، بیروت ⁦(جلد اول)⁩"
summary:
  ar: "المجلد الأول من طبعة دار صادر في بيروت لكتاب لسان العرب لابن منظور، والمقروء صفحاته الأمامية فقط: صفحة العنوان، ومقدمة الناشرين، وترجمة المؤلف، ومقدمة طبعة بولاق الأولى {cite:lisan-al-arab-dar-sadir p. 1} {cite:lisan-al-arab-dar-sadir p. 3} {cite:lisan-al-arab-dar-sadir p. 4}."
  en: "Volume one of the Dar Sadir (Beirut) edition of Ibn Manzur's Lisan al-Arab. Only its front matter was read for this record: the title page, the publishers' note, the author's biography and the preface of the first (Bulaq) edition {cite:lisan-al-arab-dar-sadir p. 1} {cite:lisan-al-arab-dar-sadir p. 3} {cite:lisan-al-arab-dar-sadir p. 4}."
  ur: "ابن منظور کی لسان العرب کا دار صادر ⁦(بیروت)⁩ کا جلد اول۔ اس ریکارڈ کے لیے صرف اس کے ابتدائی صفحات پڑھے گئے: عنوان کا صفحہ، ناشرین کا نوٹ، مصنف کا تذکرہ اور پہلے ⁦(بولاق)⁩ ایڈیشن کا دیباچہ {cite:lisan-al-arab-dar-sadir p. 1} {cite:lisan-al-arab-dar-sadir p. 3} {cite:lisan-al-arab-dar-sadir p. 4}۔"
  es: "Volumen uno de la edición de Dar Sadir (Beirut) del Lisan al-Arab de Ibn Manzur. Para este registro, solo se leyó la parte preliminar: la página del título, la nota de los editores, la biografía del autor y el prefacio de la primera edición (Bulaq) {cite:lisan-al-arab-dar-sadir p. 1} {cite:lisan-al-arab-dar-sadir p. 3} {cite:lisan-al-arab-dar-sadir p. 4}."
  fr: "Volume un de l'édition Dar Sadir (Beyrouth) du Lisan al-Arab d'Ibn Manzur. Seules les pages liminaires ont été lues pour cette étude: la page de titre, la note de l'éditeur, la biographie de l'auteur et la préface de la première édition (Bulaq) {cite:lisan-al-arab-dar-sadir p. 1} {cite:lisan-al-arab-dar-sadir p. 3} {cite:lisan-al-arab-dar-sadir p. 4}."
  tr: "İbn Manzur'un Lisan al-Arab kitabının Beyrut'taki Dar Sader baskısının ilk cildi ve ön sayfaları yalnızca okunabilir: başlık sayfası, yayınevinin girişi, yazarın biyografisi ve ilk Bulaq baskısının önsözü {cite:lisan-al-arab-dar-sadir s. 1} {cite:lisan-al-arab-dar-sadir s. 3} {cite:lisan-al-arab-dar-sadir s. 4}."
  id: "Jilid pertama edisi Dar Sader di Beirut dari buku Lisan al-Arab karya Ibn Manzur, dan halaman depan hanya dapat dibaca: halaman judul, pengantar penerbit, biografi penulis, dan pengantar edisi Bulaq pertama {cite:lisan-al-arab-dar-sadir hlm. 1} {cite:lisan-al-arab-dar-sadir hlm. 3} {cite:lisan-al-arab-dar-sadir hlm. 4}."
