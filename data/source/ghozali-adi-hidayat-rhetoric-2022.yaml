reliability_note: "Peer-reviewed journal article read on 15 November 2026. It states (citing Ismail, 2018) that in 2013 Adi Hidayat founded the Quantum Akhyar Institute in Bekasi, which focuses on Islamic studies and the development of dawah; that his dawah activities developed by taking advantage of media developments in 2016 through the establishment of Akhyar TV with his two best friends, Heru Sukari and Roy Winarto; and that the transition of his dawah activities from Akhyar TV, which focused on raising ulama, to YouTube was done accidentally. Secondary biographical retellings of the same account specify November 2016 for the Akhyar TV founding. Read on 15 November 2026."
