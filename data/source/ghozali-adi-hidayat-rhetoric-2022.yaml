label: { en: "Ghozali (2022) — Oral interpretation mechanism in social media: Ustaz Adi Hidayat's rhetoric on the Adi Hidayat Official channel" }
summary:
  ar: "مقالة أكاديمية ⁦(مجلة مصحف، 2022)⁩ عن خطاب عدي هداية على يوتيوب؛ تذكر أنه أسس معهد كوانتم أخيار سنة 2013، وأن أنشطته الدعوية تطورت سنة 2016 بإنشاء أخيار تي في مع صديقيه هيرو سوكاري وروي وينارتو، ثم انتقلت من أخيار تي في إلى يوتيوب."
  en: "A 2022 journal article (Mushaf: Jurnal Tafsir Berwawasan Keindonesiaan) on Adi Hidayat's rhetoric on YouTube: he founded the Quantum Akhyar Institute in 2013, his dawah activities developed in 2016 through the establishment of Akhyar TV with his two friends Heru Sukari and Roy Winarto, and the activity later moved from Akhyar TV to YouTube."
  ur: "ایک تعلیمی جریدے ⁦(مصحف، 2022ء)⁩ کا مضمون عدی ہدایت کی یوٹیوب خطابت پر؛ اس کے مطابق انہوں نے 2013ء میں کوانٹم اخیار انسٹی ٹیوٹ قائم کیا، 2016ء میں اپنے دو دوستوں ہیرو سوکاری اور روئے وینارٹو کے ساتھ اخیار ٹی وی قائم کر کے دعوتی سرگرمیاں بڑھائیں، اور بعد میں یہ سرگرمی اخیار ٹی وی سے یوٹیوب کی طرف منتقل ہو گئی۔"
  es: "Un artículo de revista de 2022 (Mushaf: Jurnal Tafsir Berwawasan Keindonesiaan) sobre la retórica de Adi Hidayat en YouTube: fundó el Instituto Quantum Akhyar en 2013, sus actividades de dawah se desarrollaron en 2016 mediante la creación de Akhyar TV con sus dos amigos Heru Sukari y Roy Winarto, y la actividad posteriormente se trasladó de Akhyar TV a YouTube."
  fr: "Un article de revue de 2022 (Mushaf: Jurnal Tafsir Berwawasan Keindonesiaan) sur la rhétorique d'Adi Hidayat sur YouTube: il a fondé le Quantum Akhyar Institute en 2013, ses activités de dawah se sont développées en 2016 grâce à la création d'Akhyar TV avec ses deux amis Heru Sukari et Roy Winarto, et l'activité s'est ensuite déplacée d'Akhyar TV vers YouTube."
title: "Oral Interpretation Mechanism in Social Media: Analysis of Ustaz Adi Hidayat's Significant Rhetoric in Youtube Channel Adi Hidayat Official"
