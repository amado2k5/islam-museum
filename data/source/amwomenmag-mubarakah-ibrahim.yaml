summary:
  ar: "ملف مجلة «المرأة المسلمة الأمريكية» عن مباركة إبراهيم بمناسبة اختيارها «امرأة الشهر المسلمة»؛ يسجل خبرتها التي تتجاوز عقدين في الصحة واللياقة، وشهادتها الجامعية متعددة التخصصات في علوم التمرين والصحة العامة وعلم النفس من جامعة جنوب كونيتيكت الحكومية، وظهورها في برنامج أوبرا وينفري سنة 2008 وفي صحيفة نيويورك تايمز ومجلة بريفنشن وشيكاغو تريبيون."
  en: "The American Muslim Women Magazine profile of Mubarakah Ibrahim as its Muslim Woman of the Month, recording her two decades in health and fitness, her interdisciplinary bachelor's degree in Exercise Science, Public Health and Psychology from Southern Connecticut State University, and her appearances on The Oprah Winfrey Show in 2008 and in The New York Times, Prevention magazine and the Chicago Tribune."
  es: "La revista American Muslim Women Magazine publicó un perfil de Mubarakah Ibrahim como su Mujer Musulmana del Mes, destacando sus dos décadas en el mundo de la salud y el fitness, su licenciatura interdisciplinaria en Ciencias del Ejercicio, Salud Pública y Psicología por la Universidad Estatal del Sur de Connecticut, y sus apariciones en The Oprah Winfrey Show en 2008 y en The New York Times, la revista Prevention y el Chicago Tribune."
  fr: "Le magazine American Muslim Women présente Mubarakah Ibrahim comme sa Femme musulmane du mois, retraçant ses deux décennies dans le domaine de la santé et du fitness, son baccalauréat interdisciplinaire en sciences de l'exercice, santé publique et psychologie de l'Université d'État du Sud du Connecticut, et ses apparitions dans l'émission d'Oprah Winfrey en 2008 et dans le New York Times, le magazine Prevention et le Chicago Tribune."
  ur: "امریکی مسلم ویمن میگزین کی پروفائل مبارکہ ابراہیم کی بطور اس کی مسلم وومن آف دی منتھ، صحت اور تندرستی میں ان کی دو دہائیوں کی ریکارڈنگ، سدرن کنیکٹی کٹ سٹیٹ یونیورسٹی سے ورزش سائنس، صحت عامہ اور نفسیات میں ان کی بین الضابطہ بیچلر ڈگری، اور The Oprah Winfrey اور The Timemagine شو میں 2008 میں پیش ہوئے۔ شکاگو ٹریبیون۔"
