summary:
  ar: "ملف مجلة «المرأة المسلمة الأمريكية» عن مباركة إبراهيم بمناسبة اختيارها «امرأة الشهر المسلمة»؛ يسجل خبرتها التي تتجاوز عقدين في الصحة واللياقة، وشهادتها الجامعية متعددة التخصصات في علوم التمرين والصحة العامة وعلم النفس من جامعة جنوب كونيتيكت الحكومية، وظهورها في برنامج أوبرا وينفري سنة 2008 وفي صحيفة نيويورك تايمز ومجلة بريفنشن وشيكاغو تريبيون."
  en: "The American Muslim Women Magazine profile of Mubarakah Ibrahim as its Muslim Woman of the Month, recording her two decades in health and fitness, her interdisciplinary bachelor's degree in Exercise Science, Public Health and Psychology from Southern Connecticut State University, and her appearances on The Oprah Winfrey Show in 2008 and in The New York Times, Prevention magazine and the Chicago Tribune."
