summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن فقير إيبي (حاجي ميرزا علي خان وزير)؛ تُستخدم لوقائع الكيان فقط. تروي مولده نحو سنة 1897 في وادي توچي بشمال وزيرستان وحجّه سنة 1923 واستقراره في قرية إيبي، وحرب عصاباته ضد البريطانيين من 1936، وقرار بانو سنة 1947 الداعي إلى پشتونستان مستقلة، ومقاومته لباكستان حتى وفاته في 16 أبريل 1960. لا تسمّي المقالة مدرسة ولا طريقة له."
  en: "English Wikipedia article on the Faqir of Ipi (Haji Mirza Ali Khan Wazir); used for entity facts only. It recounts his birth about 1897 in the Tochi Valley of North Waziristan, his Hajj in 1923 and settlement at Ipi, his guerrilla campaign against the British from 1936, the 1947 Bannu Resolution demanding an independent Pashtunistan, and his continued resistance to Pakistan until his death on 16 April 1960. The article names no school or Sufi order for him. It carries editorial banners disputing its factual accuracy and noting missing citations, so only facts the article itself anchors in its cited literature are used."
  ur: "فقیر ایپی (حاجی میرزا علی خان وزیر) پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال ہوتا ہے۔ اس میں ان کی پیدائش تقریباً 1897ء، انگریزوں کے خلاف گوریلا جنگ، 1947ء کا بنوں قرارداد اور 16 اپریل 1960ء کو وفات کا ذکر ہے۔"
