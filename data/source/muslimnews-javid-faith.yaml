label: { en: "The Muslim News (2018): Home Secretary Javid hits back at those questioning his faith" }
summary:
  ar: "تقرير «مسلم نيوز» عن كلمة ساجد جاويد في حفل الإفطار الكبير بمجلس العموم في 5 حزيران 2018، حيث أصرّ على أنه «أول وزير داخلية مسلم يُدعى» إلى الإفطار وقال «علاقتي بالله شأني الخاص»، وينقل قوله في لقاء انتخابي سنة 2010: «تراث عائلتي مسلم... لكني لا أمارس أي دين»."
  en: "The Muslim News report of Sajid Javid's speech at the Big Iftar in the House of Commons on 5 June 2018, where he insisted he was the first Muslim Home Secretary to be invited and said his relationship with God was his own business, and of his 2010 hustings statement that his family's heritage is Muslim but he does not practise any religion."
  es: "El medio Muslim News recoge el discurso de Sajid Javid en el Gran Iftar celebrado en la Cámara de los Comunes el 5 de junio de 2018, donde insistió en que era el primer ministro del Interior musulmán invitado y afirmó que su relación con Dios era asunto suyo, y su declaración en un debate electoral de 2010 en la que afirmaba que la herencia de su familia era musulmana, pero que él no practicaba ninguna religión."
  fr: "Le compte rendu de Muslim News concernant le discours de Sajid Javid lors du grand iftar à la Chambre des communes le 5 juin 2018, où il a insisté sur le fait qu'il était le premier ministre de l'Intérieur musulman à être invité et a déclaré que sa relation avec Dieu était son affaire personnelle, ainsi que sa déclaration lors des campagnes électorales de 2010 selon laquelle son héritage familial est musulman mais qu'il ne pratique aucune religion."
  ur: "5 جون 2018 کو ہاؤس آف کامنز میں بڑی افطار میں ساجد جاوید کی تقریر کی مسلم نیوز کی رپورٹ، جہاں انہوں نے اصرار کیا کہ وہ مدعو کیے جانے والے پہلے مسلم ہوم سیکرٹری ہیں اور کہا کہ خدا کے ساتھ ان کا تعلق ان کا اپنا کاروبار ہے، اور ان کے 2010 کے ہسٹنگ بیان کے بارے میں کہ ان کے خاندان کی میراث مسلم ہے لیکن وہ کسی مذہب پر عمل نہیں کرتے۔"
  tr: "'Muslim News' tarafından yapılan bir haber, Sajid Javid'in 5 Haziran 2018'de Avam Kamarası'ndaki büyük iftar törenindeki konuşmasına dair bir haber; burada iftara 'davet edilen ilk Müslüman İçişleri Bakanı' olduğunu ısrarla belirtti ve 'Tanrı ile ilişkim benim özel meselemdir.' dedi. 2010 seçim toplantısından alıntı yapıyor: 'Ailemin kökeni Müslüman... Ama hiçbir din uygulamıyorum.'"
  id: "Sebuah laporan dari 'Muslim News' tentang pidato Sajid Javid pada upacara iftar besar di House of Commons pada 5 Juni 2018, di mana ia menegaskan bahwa dirinya adalah 'Menteri Dalam Negeri Muslim pertama yang diundang' ke iftar dan berkata, 'Hubungan saya dengan Tuhan adalah urusan pribadi saya.' Ia mengutip Sajid Javid dari pertemuan pemilu 2010: 'Warisan keluarga saya adalah Muslim... Tapi saya tidak menganut agama apapun.'"
title: "Home Secretary Javid hits back at those questioning his faith"
