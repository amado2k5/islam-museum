summary:
  ar: "مقالة ويكيبيديا العربية عن روح الله الخميني؛ تُستخدم لوقائع الكيان فقط. تقدّمه في مطلعها زعيمًا دينيًا في الشيعة الاثنا عشرية ومرجعًا وفقيهًا قاد الثورة الإيرانية وأسّس الجمهورية الإسلامية وبقي مرشدها الأعلى حتى وفاته سنة 1989، وتروي نشأته في خمين ودراسته في قم والنجف ونفيه وعودته إلى إيران."
  en: "Arabic Wikipedia article on Ruhollah Khomeini; used for entity facts only. Its lead presents him as a religious leader in Twelver Shi'a, a marja' and a jurist who led the Iranian Revolution, founded the Islamic Republic and remained its supreme leader until his death in 1989; it recounts his upbringing at Khomeyn, his studies at Qom and Najaf, his exile and his return to Iran."
  es: "Artículo de Wikipedia en árabe sobre Ruhollah Khomeini; utilizado únicamente para datos sobre la persona. Su introducción lo presenta como un líder religioso chiíta duodecimano, un marja' y un jurista que lideró la Revolución iraní, fundó la República Islámica y permaneció como su líder supremo hasta su muerte en 1989; relata su infancia en Khomeyn, sus estudios en Qom y Najaf, su exilio y su regreso a Irán."
  fr: "Article de Wikipédia en arabe sur Rouhollah Khomeini; utilisé uniquement à des fins d’information sur l’entité. Son introduction le présente comme un chef religieux du chiisme duodécimain, un marja’ et un juriste qui a mené la révolution iranienne, fondé la République islamique et en est resté le guide suprême jusqu’à sa mort en 1989; elle relate son enfance à Khomeyn, ses études à Qom et Najaf, son exil et son retour en Iran."
  ur: "روح اللہ خمینی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی قیادت انہیں بارہویں شیعہ میں ایک مذہبی رہنما کے طور پر پیش کرتی ہے، ایک مرجا' اور ایک فقیہ جس نے ایرانی انقلاب کی قیادت کی، اسلامی جمہوریہ کی بنیاد رکھی اور 1989 میں اپنی موت تک اس کے سپریم لیڈر رہے۔ اس میں خمین میں اس کی پرورش، قم اور نجف میں اس کی تعلیم، اس کی جلاوطنی اور ایران واپسی کا ذکر ہے۔"
