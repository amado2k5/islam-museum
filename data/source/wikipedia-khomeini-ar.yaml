  ar: "مقالة ويكيبيديا العربية عن روح الله الخميني؛ تُستخدم لوقائع الكيان فقط. تقدّمه في مطلعها زعيمًا دينيًا في الشيعة الاثنا عشرية ومرجعًا وفقيهًا قاد الثورة الإيرانية وأسّس الجمهورية الإسلامية وبقي مرشدها الأعلى حتى وفاته سنة 1989، وتروي نشأته في خمين ودراسته في قم والنجف ونفيه وعودته إلى إيران."
  en: "Arabic Wikipedia article on Ruhollah Khomeini; used for entity facts only. Its lead presents him as a religious leader in Twelver Shi'a, a marja' and a jurist who led the Iranian Revolution, founded the Islamic Republic and remained its supreme leader until his death in 1989; it recounts his upbringing at Khomeyn, his studies at Qom and Najaf, his exile and his return to Iran."
