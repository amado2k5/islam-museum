reliability_note: "Read in the museum's session on 20 November 2026. The statistics page shows, as of that day: 12,009 documented roots, 78,259 words recorded, 410,062 historical attestations and 213,506 detailed meanings; attestations by era: pre-Islamic 27,863, Islamic 80,314, Abbasid 193,999, states and emirates 53,136, modern 53,730; and visitor figures. The home page of the same site shows smaller figures (3,240 roots, 18,672 words, 42,509 attestations) and says the dictionary spans five eras from pre-Islamic inscriptions to modern use, arranged by roots with evidence from original sources; the museum cannot tell which figures are current and gives the statistics page's, dated. The site footer reads: all rights reserved, Arabic Language Academy in Sharjah, Government of Sharjah, 2026."
