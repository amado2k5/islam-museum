summary:
  ar: "صفحة التعريف في موقع حبيبة دا سيلفا الرسمي؛ تصفها بأنها مؤثرة دولية مقيمة في المملكة المتحدة بأكثر من مليون ونصف متابع عبر المنصات، معروفة بفيديوهات الجمال والموضة والموضوعات القريبة على يوتيوب، وأنها أطلقت أول مشروع تجاري لها احتفاءً بالتنوع والشمول — خط حجابها بألوان البشرة — وأنها تعاونت مع شركاء في دبي وماليزيا وتركيا ولبنان ونيجيريا وكندا."
  en: "The About page of Habiba Da Silva's official site; it describes her as an international influencer based in the United Kingdom with over 1.5 million followers across social media, known for her YouTube videos on beauty, fashion and relatable subjects, who launched her first business venture celebrating diversity and inclusivity — her skin-tone hijab line — and has worked with partners in Dubai, Malaysia, Turkey, Lebanon, Nigeria and Canada."
