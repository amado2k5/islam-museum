summary:
  ar: "صفحة التعريف في موقع حبيبة دا سيلفا الرسمي؛ تصفها بأنها مؤثرة دولية مقيمة في المملكة المتحدة بأكثر من مليون ونصف متابع عبر المنصات، معروفة بفيديوهات الجمال والموضة والموضوعات القريبة على يوتيوب، وأنها أطلقت أول مشروع تجاري لها احتفاءً بالتنوع والشمول — خط حجابها بألوان البشرة — وأنها تعاونت مع شركاء في دبي وماليزيا وتركيا ولبنان ونيجيريا وكندا."
  en: "The About page of Habiba Da Silva's official site; it describes her as an international influencer based in the United Kingdom with over 1.5 million followers across social media, known for her YouTube videos on beauty, fashion and relatable subjects, who launched her first business venture celebrating diversity and inclusivity — her skin-tone hijab line — and has worked with partners in Dubai, Malaysia, Turkey, Lebanon, Nigeria and Canada."
  es: "La página \"Acerca de\" del sitio web oficial de Habiba Da Silva la describe como una influencer internacional radicada en el Reino Unido con más de 1,5 millones de seguidores en las redes sociales, conocida por sus videos de YouTube sobre belleza, moda y temas con los que el público se identifica, quien lanzó su primera iniciativa empresarial celebrando la diversidad y la inclusión: su línea de hijabs en tonos de piel, y ha trabajado con socios en Dubái, Malasia, Turquía, Líbano, Nigeria y Canadá."
  fr: "La page « À propos » du site officiel d’Habiba Da Silva la décrit comme une influenceuse internationale basée au Royaume-Uni, suivie par plus de 1,5 million de personnes sur les réseaux sociaux. Connue pour ses vidéos YouTube sur la beauté, la mode et des sujets accessibles à tous, elle a lancé sa première entreprise, une ligne de hijabs couleur chair, célébrant la diversité et l’inclusion. Elle a également travaillé avec des partenaires à Dubaï, en Malaisie, en Turquie, au Liban, au Nigeria et au Canada."
  ur: "حبیبہ دا سلوا کی آفیشل سائٹ کے بارے میں صفحہ؛ اس نے اسے یونائیٹڈ کنگڈم میں مقیم ایک بین الاقوامی اثر و رسوخ کے طور پر بیان کیا ہے جس کے سوشل میڈیا پر 1.5 ملین سے زیادہ پیروکار ہیں، جو خوبصورتی، فیشن اور متعلقہ موضوعات پر اپنی یوٹیوب ویڈیوز کے لیے مشہور ہیں، جس نے تنوع اور شمولیت کو منانے کے لیے اپنا پہلا کاروباری منصوبہ شروع کیا — اس کی جلد کے رنگ کی حجاب لائن — اور دبئی، ملائیشیا، کینیڈا، نیجر، ترکی، لیبنیہ اور لیبن میں شراکت داروں کے ساتھ کام کر چکی ہے۔"
  tr: "Habiba da Silva'nın resmi web sitesindeki profil sayfası, onu Birleşik Krallık merkezli, platformlarda bir buçuk milyondan fazla takipçisi olan, YouTube'da güzellik, moda ve ilgili konularla tanınan uluslararası bir influencer olarak tanımlıyor ve çeşitlilik ile kapsayıcılığı kutlayan ilk işini kurduğu – ten tonlarıyla başörtüsü serisi – ve Dubai, Malezya, Türkiye, Lübnan, Nijerya ve Kanada'daki ortaklarıyla iş birliği yaptığını belirtiyor."
  id: "Halaman profil di situs resmi Habiba da Silva menggambarkannya sebagai influencer internasional yang berbasis di Inggris dengan lebih dari satu setengah juta pengikut di berbagai platform, dikenal karena kecantikan, mode, dan topik terkait di YouTube, serta bahwa dia meluncurkan bisnis pertamanya yang merayakan keberagaman dan inklusi—lini hijab dengan warna kulit—dan bahwa dia telah berkolaborasi dengan mitra di Dubai, Malaysia, Turki, Lebanon, Nigeria, dan Kanada."
