  ar: "تقرير مركز تحليل القبائل (ويلمسبرغ، فرجينيا) عن الشخصيات الدينية على الحدود الأفغانية الباكستانية، مستندا خصوصا إلى كتاب سناء هارون «حدود الإيمان». يذكر أن ملا هده (نجم الدين آخوندزاده) تلقّى من آخوند سوات إذنا بتعليم الطرق الصوفية الأربع الكبرى من مقره في هده، وأن تلميذه حاجي تورنغزي ورث هذا المزج الطرقي."
  en: "A Tribal Analysis Center (Williamsburg, Virginia) report on religious figures of the Afghan–Pakistan frontier, drawing in particular on Sana Haroon's Frontier of Faith. It states that the Hadda Mullah, Najmuddin Akhundzada, received permission from the Akhund of Swat to teach all four prominent Sufi schools from his seat at Hadda — an attestation of a personal teaching authorisation (ijaza) in the Sufi orders, independent of Edwards' account of his discipleship."
