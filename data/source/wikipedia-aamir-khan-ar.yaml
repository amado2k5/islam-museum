  fr: "Article Wikipédia en arabe sur Aamir Khan; utilisé uniquement à titre informatif. Il confirme sa naissance le 14 mars 1965 et son statut d’acteur, réalisateur et producteur indien, fondateur d’Aamir Khan Productions."
  ur: "عامر خان پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 14 مارچ 1965 کو ان کی پیدائش اور ایک ہندوستانی اداکار، ہدایت کار اور پروڈیوسر کے طور پر ان کے کھڑے ہونے کی تصدیق کرتا ہے جس نے عامر خان پروڈکشن کی بنیاد رکھی۔"
  tr: "Aamir Khan hakkında Arapça Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılmıştır. Bu makale, onun 14 Mart 1965 doğumlu olduğunu ve Aamir Khan Yapım Şirketi'ni kuran Hintli bir aktör, yönetmen ve yapımcı olduğunu doğrular."
  id: "Artikel Wikipedia bahasa Arab tentang Aamir Khan hanya digunakan untuk fakta entitas tersebut. Artikel tersebut mengonfirmasi bahwa ia lahir pada 14 Maret 1965, dan bahwa ia adalah aktor, sutradara, dan produser India yang mendirikan Aamir Khan Production Company."
