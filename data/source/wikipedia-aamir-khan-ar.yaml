  ar: "مقالة ويكيبيديا العربية عن عامر خان؛ تُستخدم لوقائع الكيان فقط. تؤكد مولده في 14 مارس 1965 وأنه ممثل ومخرج ومنتج هندي أسّس شركة عامر خان للإنتاج."
  en: "Arabic Wikipedia article on Aamir Khan; used for entity facts only. It confirms his birth on 14 March 1965 and his standing as an Indian actor, director and producer who founded Aamir Khan Productions."
