  ar: "مقالة ويكيبيديا الإندونيسية عن عمر سعيد تجوكروامينوتو؛ تُستخدم لوقائع الكيان فقط. تتفق مع الإنجليزية في الميلاد والوفاة والمسيرة، وتضيف دفنه في مقبرة كونتشين بيوجياكارتا ورواية تقول إنه مرض بعد مؤتمر لشريكة الإسلام في بانجارنيغارا (تقول الإنجليزية بانجارماسين)، وأسماء أبنائه ومنهم سيتي أويتاري."
  en: "Indonesian Wikipedia article on Oemar Said Tjokroaminoto; used for entity facts only. It agrees with the English article on his birth, death and career, and adds his burial in the Kuncen cemetery at Yogyakarta, an account that he fell ill after a Sarekat Islam congress at Banjarnegara (the English article says Banjarmasin), and the names of his children including Siti Oetari."
