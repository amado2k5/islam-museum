summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن عمر سعيد تجوكروامينوتو؛ تُستخدم لوقائع الكيان فقط. تتفق مع الإنجليزية في الميلاد والوفاة والمسيرة، وتضيف دفنه في مقبرة كونتشين بيوجياكارتا ورواية تقول إنه مرض بعد مؤتمر لشريكة الإسلام في بانجارنيغارا ⁦(تقول الإنجليزية بانجارماسين)⁩، وأسماء أبنائه ومنهم سيتي أويتاري."
  en: "Indonesian Wikipedia article on Oemar Said Tjokroaminoto; used for entity facts only. It agrees with the English article on his birth, death and career, and adds his burial in the Kuncen cemetery at Yogyakarta, an account that he fell ill after a Sarekat Islam congress at Banjarnegara (the English article says Banjarmasin), and the names of his children including Siti Oetari."
  es: "Artículo de la Wikipedia en indonesio sobre Oemar Said Tjokroaminoto; utilizado únicamente para datos sobre la persona. Coincide con el artículo en inglés sobre su nacimiento, muerte y trayectoria profesional, y añade que fue enterrado en el cementerio de Kuncen en Yogyakarta, que enfermó tras un congreso de Sarekat Islam en Banjarnegara (el artículo en inglés menciona Banjarmasin) y los nombres de sus hijos, entre ellos Siti Oetari."
  fr: "Article de Wikipédia indonésien sur Oemar Said Tjokroaminoto; utilisé uniquement pour les informations le concernant. Il concorde avec l’article anglais sur sa naissance, sa mort et sa carrière, et ajoute qu’il est enterré au cimetière de Kuncen à Yogyakarta, qu’il est tombé malade après un congrès de la Sarekat Islam à Banjarnegara (l’article anglais mentionne Banjarmasin), et les noms de ses enfants, dont Siti Oetari."
  ur: "انڈونیشیائی ویکیپیڈیا کا مضمون عمیر سید Tjokroaminoto پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ان کی پیدائش، موت اور کیرئیر پر انگریزی مضمون سے متفق ہے، اور یوگیکارتا کے کنسن قبرستان میں ان کی تدفین کو شامل کرتا ہے، یہ ایک بیان ہے کہ وہ بنجرنیگارا میں ایک سراکت اسلام کانگریس کے بعد بیمار ہو گیا تھا ⁦(انگریزی مضمون بنجرماسین کہتا ہے)⁩، اور اس کے بچوں کے نام بشمول سیتی اویتاری۔"
