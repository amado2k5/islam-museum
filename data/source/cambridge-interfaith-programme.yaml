summary:
  ar: "صفحة «التعقل الكتابي» على موقع برنامج كامبردج للحوار بين الأديان، وهو من رواد المنهج؛ توثّق practise قراءة النصوص التوراتية والقرآنية معاً في مجموعات يهودية ومسيحية ومسلمة ومؤتمراته الأكاديمية في كامبردج، كما اطُّلع عليها في 17 نوفمبر 2026."
  en: "The 'Scriptural Reasoning' page on the Cambridge Interfaith Programme's site, one of the practice's pioneers; it documents groups of Jewish, Christian and Muslim participants reading scriptural texts together and CIP's academic conferences, as consulted on 17 November 2026."
  es: "La página \"Razonamiento Bíblico\" del sitio web del Programa Interreligioso de Cambridge, uno de los pioneros en esta práctica, documenta grupos de participantes judíos, cristianos y musulmanes que leen textos bíblicos juntos, así como las conferencias académicas del CIP, según la información consultada el 17 de noviembre de 2026."
  fr: "La page « Raisonnement scripturaire » du site du Cambridge Interfaith Programme, l'un des pionniers de cette pratique, documente des groupes de participants juifs, chrétiens et musulmans lisant ensemble des textes scripturaires et les conférences académiques du CIP, telles que consultées le 17 novembre 2026."
  ur: "کیمبرج بین المذاہب پروگرام کی سائٹ پر 'صحیفائی استدلال' کا صفحہ، پریکٹس کے علمبرداروں میں سے ایک؛ یہ یہودی، عیسائی اور مسلمان شرکاء کے گروپوں کو ایک ساتھ صحیفائی عبارتیں پڑھنے اور CIP کی تعلیمی کانفرنسوں کی دستاویز کرتا ہے، جیسا کہ 17 نومبر 2026 کو مشاورت کی گئی تھی۔"
  tr: "Cambridge Dinlerarası Diyalog Programı web sitesindeki \"İncil Akıl Yürütme\" sayfası, yöntemin öncüsü olarak, 17 Kasım 2026'da Cambridge'deki Yahudi, Hristiyan ve Müslüman gruplarda ve akademik konferanslarda hem Tora hem de Kur'an metinlerinin birlikte okunmasını belgelemektedir."
  id: "Halaman \"Penalaran Alkitabiah\" di situs web Program Dialog Antaragama Cambridge, pelopor metode ini, mendokumentasikan praktik membaca baik teks Taurat maupun teks Al-Qur'an bersama-sama dalam kelompok Yahudi, Kristen, dan Muslim serta konferensi akademiknya di Cambridge, sebagaimana diakses pada 17 November 2026."
