  ar: "مقالة ويكيبيديا التركية عن يوسف عز الدين أفندي؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 10 أكتوبر 1857 بقصر دولما بهجة ابنًا للسلطان عبد العزيز ودورنّو قادين، ووفاته في إسطنبول في 1 فبراير 1916 وهو ولي للعهد."
  en: "Turkish Wikipedia article on Yusuf İzzeddin Efendi; used for entity facts only. It gives his birth on 10 October 1857 at Dolmabahçe Palace, a son of Sultan Abdulaziz and Dürrinev Kadın, and his death in Istanbul on 1 February 1916 while crown prince."
  es: "Artículo de la Wikipedia en turco sobre Yusuf İzzeddin Efendi; utilizado únicamente para datos sobre la persona. Indica que nació el 10 de octubre de 1857 en el Palacio de Dolmabahçe, hijo del sultán Abdulaziz y Dürrinev Kadın, y que falleció en Estambul el 1 de febrero de 1916 siendo príncipe heredero."
  fr: "Article de Wikipédia en turc sur Yusuf İzzeddin Efendi; utilisé uniquement pour les informations sur l'entité. Il indique sa naissance le 10 octobre 1857 au palais de Dolmabahçe, fils du sultan Abdulaziz et de Dürrinev Kadın, et sa mort à Istanbul le 1er février 1916 alors qu'il était prince héritier."
