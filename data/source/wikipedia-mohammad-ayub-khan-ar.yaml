  ar: "مقالة ويكيبيديا العربية عن محمد أيوب خان (أمير أفغانستان)؛ مقالة قصيرة تُستخدم لوقائع الكيان فقط. تعطي مولده في كابل سنة 1857 ونسبه «بن شير علي خان بن دوست محمد خان» وإمارته (1879-1880) ولقبه الغازي، وتذكر وفاته سنة 1914 ودفنه في بيشاور. لا تحمل المقالة أي حقل للديانة."
  en: "Arabic Wikipedia article on Mohammad Ayub Khan (Emir of Afghanistan); a short article used for entity facts only. It gives his birth at Kabul in 1857, his lineage as son of Sher Ali Khan son of Dost Mohammad Khan, his emirate (1879–1880) and his style al-Ghazi, and records his death in 1914 and burial at Peshawar. The article carries no religion field."
