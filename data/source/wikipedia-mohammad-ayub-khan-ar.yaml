summary:
  ar: "مقالة ويكيبيديا العربية عن محمد أيوب خان ⁦(أمير أفغانستان)⁩؛ مقالة قصيرة تُستخدم لوقائع الكيان فقط. تعطي مولده في كابل سنة 1857 ونسبه «بن شير علي خان بن دوست محمد خان» وإمارته (1879-1880) ولقبه الغازي، وتذكر وفاته سنة 1914 ودفنه في بيشاور. لا تحمل المقالة أي حقل للديانة."
  en: "Arabic Wikipedia article on Mohammad Ayub Khan (Emir of Afghanistan); a short article used for entity facts only. It gives his birth at Kabul in 1857, his lineage as son of Sher Ali Khan son of Dost Mohammad Khan, his emirate (1879–1880) and his style al-Ghazi, and records his death in 1914 and burial at Peshawar. The article carries no religion field."
  es: "Artículo de Wikipedia en árabe sobre Mohammad Ayub Khan (Emir de Afganistán); un breve artículo que solo incluye datos sobre la persona. Menciona su nacimiento en Kabul en 1857, su linaje como hijo de Sher Ali Khan, hijo de Dost Mohammad Khan, su emirato (1879-1880) y su título, al-Ghazi. También registra su fallecimiento en 1914 y su entierro en Peshawar. El artículo no incluye información sobre religión."
  fr: "Article de Wikipédia en arabe sur Mohammad Ayub Khan (émir d'Afghanistan); article concis fournissant uniquement des informations factuelles. Il mentionne sa naissance à Kaboul en 1857, sa filiation (fils de Sher Ali Khan, lui-même fils de Dost Mohammad Khan), son émirat (1879-1880), son titre (al-Ghazi), ainsi que sa mort en 1914 et son inhumation à Peshawar. L'article ne comporte pas de champ relatif à la religion."
  ur: "عربی ویکیپیڈیا مضمون محمد ایوب خان ⁦(امیر افغانستان)⁩ پر؛ ایک مختصر مضمون جو صرف ہستی کے حقائق کے لیے استعمال ہوتا ہے۔ یہ 1857 میں کابل میں ان کی پیدائش، شیر علی خان ولد دوست محمد خان کے بیٹے کے طور پر اس کا سلسلہ نسب، اس کی امارت (1879-1880) اور اس کا طرز الغازی، اور 1914 میں ان کی وفات اور پشاور میں تدفین درج کرتا ہے۔ مضمون میں کوئی مذہب نہیں ہے۔"
