  ar: "مقالة ويكيبيديا التركية عن جاهيت عارف؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 11 أكتوبر 1910 بسالونيك ووفاته في 26 ديسمبر 1997 بإسطنبول ودفنه في مقبرة زنجيرلي قويو، ومسيرته في جامعات إسطنبول والشرق الأوسط التقنية وتوبيتاك. لا يحتوي المقال — نصا وصندوق معلومات — أي محتوى ديني."
  en: "Turkish Wikipedia article on Cahit Arf; used for entity facts only. It gives his birth on 11 October 1910 at Thessaloniki, his death on 26 December 1997 at Istanbul and his burial in Zincirlikuyu Cemetery, and his career at Istanbul University, METU and TÜBİTAK. Neither the article's text nor its infobox contains any religion content."
