summary:
  ar: "كامل الزيارات لجعفر بن محمد بن قولويه القمي ⁦(ت 367هـ)⁩، من أقدم كتب أداب الزيارة وفضائل المشاهد؛ نسخة ممسوحة أجريت عليها قراءة آلية في مكتبة الحصاد."
  en: "Kamil al-Ziyarat by Ja'far ibn Muhammad ibn Quluwayh al-Qummi (d. 367 AH), among the earliest books of visitation etiquette and shrine merits; a scanned copy OCR'd in the local harvest."
  es: "Kamil al-Ziyarat de Ja'far ibn Muhammad ibn Quluwayh al-Qummi (m. 367 AH), uno de los libros más antiguos sobre etiqueta para las visitas y méritos en los santuarios; una copia escaneada procesada mediante OCR en la colección local."
  fr: "Kamil al-Ziyarat de Ja'far ibn Muhammad ibn Quluwayh al-Qummi (mort en 367 AH), parmi les premiers livres sur l'étiquette des visites et les mérites des sanctuaires; une copie scannée OCR dans la récolte locale."
  ur: "کامل الزیارات بذریعہ جعفر بن محمد بن قولویہ القمی ⁦(متوفی 367ھ)⁩، زیارت کے آداب اور مزار کی فضیلت کی ابتدائی کتابوں میں سے؛ مقامی فصل میں ایک اسکین شدہ کاپی OCR'd۔"
  tr: "Ca'far bin Muhammed bin Qulawayh al-Qummi (ö. 367 Ah) tarafından yazılmış Kamil al-Ziyarat, ziyaret görgü kuralları ve Şehitlerin erdemleri üzerine en eski kitaplardan biridir; El-Hassad Kütüphanesi'nde makineyle okunan taranmış bir kopyadır."
  id: "Kamil al-Ziyarat karya Ja'far ibn Muhammad ibn Qulawayh al-Qummi (wafat 367 H), salah satu buku tertua tentang etiket kunjungan dan kebajikan para Syuhada; sebuah salinan hasil scan yang dibaca secara mesin di Perpustakaan Al-Hassad."
