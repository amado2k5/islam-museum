  ar: "مقالة ويكيبيديا الإنجليزية عن محمد أوز، مراجعة 9 أكتوبر 2026؛ تُستخدم لوقائع الكيان فقط، ويُستشهد بكل واقعة بمصدرها كما ذكرته المقالة. تصف نشأته في بيئة مسلمة مختلطة: أسرة أبيه تقليدية وأسرة أمه علمانية، وهي خلفية أسرية لا مدرسة له."
