summary:
  ar: "صفحة «من نحن» في موقع شركة «لالا حجاب» التي شاركت سنا صالح في تأسيسها مع زوجها ويل؛ يقولان فيها إنهما معروفان باسم سنا وويل على تيك توك باسم «عائلة صالح»، يصنعان محتوى يُظهر الجانب الممتع من ثقافتهما ودينهما، وُلدا ونشآ في كولومبيا البريطانية بكندا وانتقلا إلى أونتاريو مطلع سنة 2019، وإن سنا أسست خط الحجاب بعد صبغها أول حجاب بالوردي والبنفسجي في صيف 2020، وإن اسم الشركة من اقتراح ابنتهما أمينة."
  en: "The About Us page of Lala Hijabs, the company Sana Saleh co-founded with her husband Will. They say they are known as Sana and Will on TikTok as the Saleh Family (@salehfamily), create content showing the fun side of their culture and religion, were all born and raised in British Columbia, Canada, and moved to Ontario at the start of 2019; that Sana started the hijab line after dyeing her first hijab pink and purple in the summer of 2020; and that the company name was suggested by their daughter Aaminah."
