summary:
  ar: "صفحة «من نحن» في موقع شركة «لالا حجاب» التي شاركت سنا صالح في تأسيسها مع زوجها ويل؛ يقولان فيها إنهما معروفان باسم سنا وويل على تيك توك باسم «عائلة صالح»، يصنعان محتوى يُظهر الجانب الممتع من ثقافتهما ودينهما، وُلدا ونشآ في كولومبيا البريطانية بكندا وانتقلا إلى أونتاريو مطلع سنة 2019، وإن سنا أسست خط الحجاب بعد صبغها أول حجاب بالوردي والبنفسجي في صيف 2020، وإن اسم الشركة من اقتراح ابنتهما أمينة."
  en: "The About Us page of Lala Hijabs, the company Sana Saleh co-founded with her husband Will. They say they are known as Sana and Will on TikTok as the Saleh Family (@salehfamily), create content showing the fun side of their culture and religion, were all born and raised in British Columbia, Canada, and moved to Ontario at the start of 2019; that Sana started the hijab line after dyeing her first hijab pink and purple in the summer of 2020; and that the company name was suggested by their daughter Aaminah."
  es: "La página \"Sobre nosotros\" de Lala Hijabs, la empresa que Sana Saleh cofundó con su esposo Will. Dicen que son conocidos como Sana y Will en TikTok como la Familia Saleh (@salehfamily), crean contenido que muestra el lado divertido de su cultura y religión, nacieron y se criaron en la Columbia Británica, Canadá, y se mudaron a Ontario a principios de 2019; que Sana comenzó la línea de hijabs después de teñir su primer hijab de rosa y morado en el verano de 2020; y que el nombre de la empresa fue sugerido por su hija Aaminah."
  fr: "La page « À propos » de Lala Hijabs, l’entreprise que Sana Saleh a cofondée avec son mari Will, explique: « Sur TikTok, je suis connu sous le nom de Sana et Will, alias la famille Saleh (@salehfamily). Je crée du contenu qui met en valeur le côté ludique de ma culture et de ma religion. Je suis né et j’ai grandi en Colombie-Britannique, au Canada, et j’ai déménagé en Ontario début 2019. Sana a lancé ma marque de hijabs après avoir teint son premier hijab en rose et violet durant l’été 2020. Le nom de l’entreprise m’a été suggéré par ma fille Aaminah. »"
  ur: "ہمارے بارے میں لالہ حجاب کا صفحہ، کمپنی ثنا صالح نے اپنے شوہر ول کے ساتھ مل کر قائم کی۔ ان کا کہنا ہے کہ وہ صالح فیملی (@salehfamily) کے طور پر TikTok پر ثنا اور ول کے نام سے جانے جاتے ہیں، اپنی ثقافت اور مذہب کے تفریحی پہلو کو ظاہر کرنے والا مواد تخلیق کرتے ہیں، سبھی برٹش کولمبیا، کینیڈا میں پیدا ہوئے اور پلے بڑھے، اور 2019 کے آغاز میں اونٹاریو چلے گئے؛ کہ ثنا نے 2020 کے موسم گرما میں اپنے پہلے حجاب کو گلابی اور جامنی رنگ میں رنگنے کے بعد حجاب لائن شروع کی تھی۔ اور یہ کہ کمپنی کا نام ان کی بیٹی آمنہ نے تجویز کیا تھا۔"
  tr: "\"Biz Kimiz\" sayfası, Sana Saleh'in eşi Will ile birlikte kurduğu \"La La Hijab\" şirketinin web sitesinde; TikTok'ta Sana ve Will olarak \"Saleh Ailesi\" olarak bilindiklerini söylüyorlar. Kültürlerinin ve dinlerinin keyifli yanlarını sergileyen içerikler üretiyorlar. Kanada'nın British Columbia kentinde doğup büyüdüler ve 2019 başlarında Ontario'ya taşındılar. Sana, 2020 yazında ilk başörtüsünü pembe ve mor renklere boyadıktan sonra başörtüsü serisini kurdu ve şirketin adı kızları Amina tarafından önerildi."
  id: "Halaman \"Who Are We\" di situs web perusahaan \"La La Hijab,\" yang didirikan bersama suaminya Will; mereka mengatakan bahwa mereka dikenal sebagai Sana dan Will di TikTok sebagai \"Saleh Family.\" Mereka membuat konten yang menampilkan sisi menyenangkan dari budaya dan agama mereka. Mereka lahir dan besar di British Columbia, Kanada, dan pindah ke Ontario pada awal 2019. Sana mendirikan lini hijab setelah mewarnai hijab pertamanya dengan warna merah muda dan ungu pada musim panas 2020, dan nama perusahaan disarankan oleh putri mereka, Amina."
