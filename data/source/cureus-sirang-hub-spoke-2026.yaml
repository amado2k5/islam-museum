summary:
  ar: "مقالة زبيدة سيرانغ ورفقائها في مجلة Cureus (2026) عبر مستودع جامعة الآغا خان: توثّق تنفيذ نموذج «المحور والأذرع» لطب العيون في شمال باكستان منذ 2021 تحت خدمة الآغا خان الصحية، بمحور رئيسي في غلغت ومحورين فرعيين في تشترال العليا والسفلى ودعم عن بُعد من مستشفى جامعة الآغا خان بكراتشي."
  en: "Zubaida Sirang and colleagues' Cureus article (2026), held in the Aga Khan University repository: it documents the hub-and-spoke ophthalmology model implemented in northern Pakistan from 2021 under Aga Khan Health Service Pakistan, with a central hub in Gilgit, sub-hubs in Upper and Lower Chitral, and teleophthalmology support from the Aga Khan University Hospital, Karachi."
title: "Pioneering Comprehensive Eye Care in Northern Pakistan: Development and Implementation of a Hub-and-Spoke Model"
