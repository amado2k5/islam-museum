label: { en: "Cureus (2026): Sirang et al., hub-and-spoke eye care in northern Pakistan" }
summary:
  ar: "مقالة زبيدة سيرانغ ورفقائها في مجلة Cureus (2026) عبر مستودع جامعة الآغا خان: توثّق تنفيذ نموذج «المحور والأذرع» لطب العيون في شمال باكستان منذ 2021 تحت خدمة الآغا خان الصحية، بمحور رئيسي في غلغت ومحورين فرعيين في تشترال العليا والسفلى ودعم عن بُعد من مستشفى جامعة الآغا خان بكراتشي."
  en: "Zubaida Sirang and colleagues' Cureus article (2026), held in the Aga Khan University repository: it documents the hub-and-spoke ophthalmology model implemented in northern Pakistan from 2021 under Aga Khan Health Service Pakistan, with a central hub in Gilgit, sub-hubs in Upper and Lower Chitral, and teleophthalmology support from the Aga Khan University Hospital, Karachi."
  es: "El artículo de Zubaida Sirang y sus colegas publicado en Cureus (2026), que se encuentra en el repositorio de la Universidad Aga Khan, documenta el modelo de oftalmología de red centralizada implementado en el norte de Pakistán a partir de 2021 bajo el Servicio de Salud Aga Khan de Pakistán, con un centro principal en Gilgit, subcentros en el Alto y Bajo Chitral, y apoyo de teleoftalmología del Hospital Universitario Aga Khan de Karachi."
  fr: "L'article de Zubaida Sirang et ses collègues sur Cureus (2026), conservé dans le dépôt de l'Université Aga Khan: il documente le modèle d'ophtalmologie en étoile mis en œuvre dans le nord du Pakistan à partir de 2021 sous l'égide du Service de santé Aga Khan du Pakistan, avec un centre névralgique à Gilgit, des sous-centres dans le Haut et le Bas Chitral, et un soutien en téléophtalmologie de l'hôpital universitaire Aga Khan de Karachi."
title: "Pioneering Comprehensive Eye Care in Northern Pakistan: Development and Implementation of a Hub-and-Spoke Model"
