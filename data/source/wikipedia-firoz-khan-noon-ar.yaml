summary:
  ar: "مقالة ويكيبيديا العربية عن فيروز خان نون (1893–1970)؛ تعطي مولده في 7 أيار 1893 ووفاته في 9 كانون الأول 1970، وتذكر في صندوقها أنه خلف إبراهيم إسماعيل تشوندريغار في رئاسة الوزراء وأن تشودري خليق الزمان خلفه في حاكمية بنغال الشرقية. لا يسمي نصها مذهباً له."
  en: "The Arabic Wikipedia article on Firoz Khan Noon (1893–1970); it gives his birth on 7 May 1893 and his death on 9 December 1970, and its infobox names Ibrahim Ismail Chundrigar as his predecessor as prime minister and Chaudhry Khaliquzzaman as his successor as governor of East Bengal. Its text names no school for him."
  es: "El artículo de Wikipedia en árabe sobre Firoz Khan Noon (1893-1970) indica que nació el 7 de mayo de 1893 y falleció el 9 de diciembre de 1970. Su ficha informativa menciona a Ibrahim Ismail Chundrigar como su predecesor en el cargo de primer ministro y a Chaudhry Khaliquzzaman como su sucesor como gobernador de Bengala Oriental. El texto no menciona ninguna escuela a la que haya asistido."
  fr: "L'article de Wikipédia en arabe consacré à Firoz Khan Noon (1893-1970) indique sa naissance le 7 mai 1893 et son décès le 9 décembre 1970. Son infobox mentionne Ibrahim Ismail Chundrigar comme son prédécesseur au poste de Premier ministre et Chaudhry Khaliquzzaman comme son successeur au poste de gouverneur du Bengale oriental. Le texte ne fait mention d'aucune école à son nom."
