  ar: "مقالة ويكيبيديا العربية عن فيروز خان نون (1893–1970)؛ تعطي مولده في 7 أيار 1893 ووفاته في 9 كانون الأول 1970، وتذكر في صندوقها أنه خلف إبراهيم إسماعيل تشوندريغار في رئاسة الوزراء وأن تشودري خليق الزمان خلفه في حاكمية بنغال الشرقية. لا يسمي نصها مذهباً له."
  en: "The Arabic Wikipedia article on Firoz Khan Noon (1893–1970); it gives his birth on 7 May 1893 and his death on 9 December 1970, and its infobox names Ibrahim Ismail Chundrigar as his predecessor as prime minister and Chaudhry Khaliquzzaman as his successor as governor of East Bengal. Its text names no school for him."
