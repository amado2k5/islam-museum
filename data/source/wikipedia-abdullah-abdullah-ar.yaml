  ar: "مقالة ويكيبيديا العربية عن عبد الله عبد الله؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 5 سبتمبر 1960 بكابل لأب بشتوني من قندهار وأم طاجيكية من وادي بنشير، وتفيد أنه تلقى تعليما دينيا إسلاميا قبل دراسة طب العيون في جامعة كابل (تخرج 1983)."
  en: "Arabic Wikipedia article on Abdullah Abdullah; used for entity facts only. It gives his birth on 5 September 1960 at Kabul to a Pashtun father from Kandahar and a Tajik mother from the Panjshir valley, and says he received an Islamic religious education before studying ophthalmology at Kabul University (graduated 1983)."
