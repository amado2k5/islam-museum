summary:
  ar: "مقالة ويكيبيديا العربية عن عبد الله عبد الله؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 5 سبتمبر 1960 بكابل لأب بشتوني من قندهار وأم طاجيكية من وادي بنشير، وتفيد أنه تلقى تعليما دينيا إسلاميا قبل دراسة طب العيون في جامعة كابل ⁦(تخرج 1983)⁩."
  en: "Arabic Wikipedia article on Abdullah Abdullah; used for entity facts only. It gives his birth on 5 September 1960 at Kabul to a Pashtun father from Kandahar and a Tajik mother from the Panjshir valley, and says he received an Islamic religious education before studying ophthalmology at Kabul University (graduated 1983)."
  es: "Artículo de Wikipedia en árabe sobre Abdullah Abdullah; utilizado únicamente para datos sobre la persona. Indica que nació el 5 de septiembre de 1960 en Kabul, hijo de un padre pastún de Kandahar y una madre tayika del valle de Panjshir, y afirma que recibió educación religiosa islámica antes de estudiar oftalmología en la Universidad de Kabul (se graduó en 1983)."
  fr: "Article Wikipédia en arabe sur Abdullah Abdullah; utilisé uniquement pour les informations sur l’entité. Il indique qu’il est né le 5 septembre 1960 à Kaboul d’un père pachtoune originaire de Kandahar et d’une mère tadjike de la vallée du Panjshir, et précise qu’il a reçu une éducation religieuse islamique avant d’étudier l’ophtalmologie à l’université de Kaboul (diplômé en 1983)."
  ur: "عبداللہ عبداللہ پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 5 ستمبر 1960 کو کابل میں قندھار سے تعلق رکھنے والے ایک پشتون والد اور پنجشیر کی وادی سے ایک تاجک ماں کے ہاں پیدا ہوا، اور کہتا ہے کہ اس نے کابل یونیورسٹی میں امراض چشم کی تعلیم حاصل کرنے سے پہلے اسلامی مذہبی تعلیم حاصل کی ⁦(گریجویشن 1983)⁩۔"
  tr: "Abdullah Abdullah hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 5 Eylül 1960'ta Kabil'de, Kandahar'dan bir Peştun baba ve Binshir Vadisi'nden Tacik bir annenin çocuğu olarak doğdu ve bu makalede, Kabil Üniversitesi'nde göz hastalıkları okumadan önce İslami dini eğitim aldığı belirtilmektedir (1983'te mezun oldu)."
  id: "Artikel Wikipedia Arab tentang Abdullah Abdullah; digunakan hanya untuk fakta entitas. Ia lahir pada 5 September 1960 di Kabul dari ayah Pashtun dari Kandahar dan ibu Tajik dari Lembah Binshir, dan disebutkan bahwa ia menerima pendidikan agama Islam sebelum belajar oftalmologi di Universitas Kabul (lulus 1983)."
