summary:
  ar: "ترجمة محمد المهدي الفاسي في موقع معهد الإمام الغزالي، مقتطفة من مقدمة طبعة المعهد لكتاب «الخصائص المحمدية» المتضمن ترجمة «مطالع المسرات»؛ تصفه بأنه فقيه ومحدث وصوفي وكاتب سير ومؤرخ، وتذكر أن قاسم الخصاصي صار شيخه في الطريق الروحي، وتورد مولده في 29 رجب 1033هـ ووفاته في 9 شعبان 1109هـ (20 شباط 1698)."
  en: "Imam Ghazali Institute biography of Shaykh Muhammad al-Mahdi al-Fasi, excerpted from the introduction to IGI's Al-Khasa'is al-Muhammadiyya, which includes a translation of his Matali' al-Masarrat. It calls him a famous jurist, muhaddith, Sufi, biographer and historian, records that Qasim al-Khasasi became his shaykh in the spiritual path, quotes al-Qadiri's and al-Kattani's descriptions of him, and gives his birth on 29 Rajab 1033 AH and his death on 9 Sha'ban 1109 AH (20 February 1698). It is one of the two independent texts behind the person record's sufi/documented settlement."
title: "Shaykh Muhammad al-Mahdi al-Fasi: A Biography"
