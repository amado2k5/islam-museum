reliability_note: "Publisher's biography page, published 25 October 2022 and updated 24 September 2024, read live on 1 November 2026. It is excerpted from the scholarly introduction to IGI's edition of the subject's own Matali' al-Masarrat and quotes the classical biographers (al-Qadiri's Nashr al-Mathani, al-Kattani's Salwat al-Anfas, Makhluf's Shajarat al-Nur). One error is recorded and not followed: it converts 29 Rajab 1033 AH to '17 May 1642 CE', where the Hijri year 1033 and the Wikipedia articles both give 1624; the person record follows 1624."
