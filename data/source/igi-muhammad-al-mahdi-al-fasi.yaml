summary:
  ar: "ترجمة محمد المهدي الفاسي في موقع معهد الإمام الغزالي، مقتطفة من مقدمة طبعة المعهد لكتاب «الخصائص المحمدية» المتضمن ترجمة «مطالع المسرات»؛ تصفه بأنه فقيه ومحدث وصوفي وكاتب سير ومؤرخ، وتذكر أن قاسم الخصاصي صار شيخه في الطريق الروحي، وتورد مولده في 29 رجب 1033هـ ووفاته في 9 شعبان 1109هـ ⁦(20 شباط 1698)⁩."
  en: "Imam Ghazali Institute biography of Shaykh Muhammad al-Mahdi al-Fasi, excerpted from the introduction to IGI's Al-Khasa'is al-Muhammadiyya, which includes a translation of his Matali' al-Masarrat. It calls him a famous jurist, muhaddith, Sufi, biographer and historian, records that Qasim al-Khasasi became his shaykh in the spiritual path, quotes al-Qadiri's and al-Kattani's descriptions of him, and gives his birth on 29 Rajab 1033 AH and his death on 9 Sha'ban 1109 AH (20 February 1698). It is one of the two independent texts behind the person record's sufi/documented settlement."
  es: "Biografía del Shaykh Muhammad al-Mahdi al-Fasi del Instituto Imam Ghazali, extraída de la introducción a Al-Khasa'is al-Muhammadiyya del IGI, que incluye una traducción de su Matali' al-Masarrat. Lo describe como un célebre jurista, muhaddith, sufí, biógrafo e historiador; registra que Qasim al-Khasasi se convirtió en su shaykh en el camino espiritual; cita las descripciones de al-Qadiri y al-Kattani; y sitúa su nacimiento el 29 de Rajab de 1033 AH y su muerte el 9 de Sha'ban de 1109 AH (20 de febrero de 1698). Es uno de los dos textos independientes que sustentan el registro de la vida sufí/documentada de esta persona."
  fr: "Biographie de Cheikh Muhammad al-Mahdi al-Fasi, publiée par l'Institut Imam Ghazali et extraite de l'introduction de son ouvrage *Al-Khasa'is al-Muhammadiyya*, qui comprend une traduction de son *Matali' al-Masarrat*. Ce texte le présente comme un juriste, muhaddith, soufi, biographe et historien renommé. Il indique que Qasim al-Khasasi devint son maître spirituel, cite les descriptions qu'en font al-Qadiri et al-Kattani, et précise sa date de naissance: le 29 Rajab 1033 AH; sa date de décès: le 9 Sha'ban 1109 AH (20 février 1698). Il s'agit de l'un des deux textes indépendants à l'origine de la documentation soufie relative à sa vie."
  ur: "امام غزالی انسٹی ٹیوٹ شیخ محمد المہدی الفاسی کی سوانح عمری، IGI کے الخصائص المحمدیہ کے تعارف سے اقتباس، جس میں ان کی مطالی المصرات کا ترجمہ بھی شامل ہے۔ اسے ایک مشہور فقیہ، محدث، صوفی، سوانح نگار اور مورخ کہتے ہیں، ریکارڈ ہے کہ قاسم الخصی روحانی راہ میں ان کے شیخ بنے، القادری اور القطانی کی ان کے بارے میں تصریحات نقل کرتے ہیں، اور ان کی ولادت 29 رجب 1033 ہجری اور ان کی وفات 19 شعبان 190 ہجری کو ہوئی۔ یہ شخص کے صوفی/دستاویزی تصفیے کے پیچھے دو آزاد متن میں سے ایک ہے۔"
  tr: "İmam el-Gazeli Enstitüsü web sitesindeki Muhammed el-Mehdi el-Fassi'nin biyografisi, enstitü baskısının 'El-Khasa'is el-Muhammadiyya' kitabının girişinden alıntıdır ve 'Matali' el-Masarat'ın biyografisini içerir; onu bir hukukçu, hadis âlim, tasavvuf, biyografi yazarı ve tarihçi olarak tanımlar. Kasım el-Hasasi'nin manevi yolda onun şeyhi olması, doğumunun 29 Rajab 1033 Hile ve 9 Şa'ban 1109 Hicri (20 Şubat 1698) tarihindeki ölümü belirtilir."
  id: "Biografi Muhammad al-Mahdi al-Fassi di situs web Institut Imam Al-Ghazali, yang diambil dari pengantar edisi institut buku 'Al-Khasa'is al-Muhammadiyya,' yang memuat biografi 'Matali' al-Masarat, menggambarkannya sebagai seorang ahli hukum, ulama hadis, sufi, biografer, dan sejarawan. Disebutkan bahwa Qasim al-Khasasi menjadi sheikhnya di jalan spiritual, menyebutkan kelahirannya pada 29 Rajab 1033 H dan kematiannya pada 9 Sha'ban 1109 H (20 Februari 1698)."
