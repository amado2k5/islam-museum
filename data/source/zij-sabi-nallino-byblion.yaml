reliability_note: "Edition not verified: the title page and the front matter name Carlo Nallino as editor and Byblion (2005) as publisher, and say the text follows a manuscript in the El Escorial library. The original Nallino edition's date and place are not confirmed from this copy. The author's name is printed variously (Muhammad ibn Sinan; Muhammad ibn Jabir ibn Sinan; known as al-Battani); the entry uses the form in person/al-battani. Page numbers are scan markers, not printed folios."
