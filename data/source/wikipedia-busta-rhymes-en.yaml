reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026, and its content checked against the recorded revision. It gives Trevor George Smith Jr., born 20 May 1972 in East Flatbush, Brooklyn, to Jamaican immigrant parents, the family's move to Uniondale, Long Island when he was 12, and his schooling alongside the future Notorious B.I.G. and Jay-Z; the name Busta Rhymes, given him by Chuck D after the footballer George 'Buster' Rhymes; Leaders of the New School and the guest verse on A Tribe Called Quest's 'Scenario'; the solo breakthrough The Coming (1996) and ten further solo albums to Blockbusta (2023); his hit singles and features, the Conglomerate label and collective, twelve Grammy nominations without a win, and the inaugural MTV Rock the Bells Visionary Award in 2025. For his faith, the personal-life section states in terms that he identifies as a member of the Five-Percent Nation and has been a Muslim since the age of 12, citing two video interviews (2007 and 2009). That is one article's attestation of a movement membership and a generic Muslim identity; no school is named."
