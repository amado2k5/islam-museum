summary:
  ar: "مقالة في «ذا دين شو» تعرّف بغابرييل الروماني ⁦(يرد اسمه في نص الصفحة أيضا «غابرييل أرماني»)⁩: تصف رحلته من أسرة مسيحية في رومانيا إلى الدفاع العلني عن الإسلام، وعمله اللاحق مديرا لمدرسة في كوالالمبور ومستشارا تربويا."
  en: "A Deen Show article profiling Gabriel Al Romaani (the page's text also spells him 'Gabriel Armani'): it describes his journey from a Christian family in Romania to defending Islam publicly, and his later work as a school principal in Kuala Lumpur and an educational consultant."
  es: "Un artículo de Deen Show que presenta a Gabriel Al Romaani (en el texto de la página también aparece escrito como 'Gabriel Armani'): describe su trayectoria desde una familia cristiana en Rumania hasta la defensa pública del Islam, y su posterior trabajo como director de escuela en Kuala Lumpur y consultor educativo."
  fr: "Un article de Deen Show dressant le portrait de Gabriel Al Romaani (le texte de la page l'orthographie également « Gabriel Armani »): il décrit son parcours, d'une famille chrétienne en Roumanie à la défense publique de l'islam, et son travail ultérieur en tant que directeur d'école à Kuala Lumpur et consultant en éducation."
  ur: "دین شو کا ایک مضمون جس میں گیبریل الرمانی کی پروفائلنگ کی گئی ہے ⁦(صفحہ کا متن بھی اس پر 'جبریل ارمانی' لکھتا ہے)⁩: اس میں رومانیہ کے ایک عیسائی خاندان سے عوامی سطح پر اسلام کا دفاع کرنے کے سفر، اور بعد میں کوالالمپور میں ایک اسکول کے پرنسپل اور ایک تعلیمی مشیر کے طور پر ان کے کام کو بیان کیا گیا ہے۔"
