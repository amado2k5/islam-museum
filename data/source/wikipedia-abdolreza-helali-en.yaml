reliability_note: "Read in full on 7 November 2026; the reading tools available in this run did not expose a revision id, so none is recorded. Used for his career (began reciting at 11, student of Abbas Saberi of Tehran's Heyat al-Reza, took over its recitations at 14 after Saberi's death, expanded the hey'at's bases, founded the Takiyegah Agha Morteza Ali complex in Tehran's Harandi neighbourhood in 2022 with health and addiction-support services), for his works list, and for the documented 2017 arrest episode as the article reports it. The article is internally inconsistent on his birth date: its prose says he was born on 3 November 1981 in Khorramshahr while its infobox gives 3 September 1981 — his own published statement (see the Fars interview source) explains that his birth certificate was backdated into Shahrivar (September), and the person record follows his stated 3 November date. Its Career section calls him 'a Shiite religious singer' — a profession descriptor preserved in the person record's faith note."
