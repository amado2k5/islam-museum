  ar: "مقالة ويكيبيديا الأذربيجانية عن مرتضى مختاروف؛ تُستخدم لوقائع الكيان فقط. تروي مولده في قرية أميرجان سنة 1857 في أسرة عريجي، ومسيرته من عامل إلى خبير حفر وصاحب شركة ومصانع."
  en: "Azerbaijani Wikipedia article on Murtuza Mukhtarov; used for entity facts only. It recounts his birth in 1857 at Amirjan village into a cart-driver's family, and his rise from labourer to drilling expert, company owner and factory builder."
  es: "Artículo de la Wikipedia en azerbaiyano sobre Murtuza Mukhtarov; utilizado únicamente para datos sobre la persona. Relata su nacimiento en 1857 en la aldea de Amirjan, en el seno de una familia de carreteros, y su ascenso desde obrero hasta experto en perforación, propietario de una empresa y constructor de fábricas."
  fr: "Article Wikipédia azerbaïdjanais sur Murtuza Mukhtarov; utilisé uniquement à des fins d'information sur l'entité. Il relate sa naissance en 1857 au village d'Amirjan, dans une famille de charretiers, et son ascension professionnelle, de simple ouvrier à expert en forage, puis propriétaire d'entreprise et constructeur d'usine."
  ur: "مرتضی مختاروف پر آذربائیجانی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1857 میں امیرجان گاؤں میں ایک گاڑی چلانے والے خاندان میں اس کی پیدائش، اور مزدور سے ڈرلنگ کے ماہر، کمپنی کے مالک اور فیکٹری بلڈر تک اس کے عروج کا ذکر ہے۔"
  tr: "Murtada Mukhtarov hakkında Azerbaycan Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1857'de Amirjan köyünde Ariji ailesinde doğmasını ve bir işçiden kazıcılık uzmanlığına ve bir şirket ile fabrika sahibine geçişini anlatır."
  id: "Artikel Wikipedia Azerbaijan tentang Murtada Mukhtarov; hanya digunakan untuk fakta entitas. Artikel ini menceritakan kelahirannya di desa Amirjan pada tahun 1857 dalam keluarga Oriji, serta kariernya dari pekerja hingga ahli penggali dan pemilik perusahaan serta pabrik."
