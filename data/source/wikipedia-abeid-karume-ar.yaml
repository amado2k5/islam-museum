  ar: "مقالة ويكيبيديا العربية عن عبيد كرومي؛ تُستخدم لوقائع الكيان فقط. تروي ادعاءه أنه ولد في قرية مويرا سنة 1905 وعمله بحارا، وقيادته ثورة زنجبار واتحادها مع تنجانيقا وصيرورته أول نائب لرئيس تنزانيا، واغتياله في مدينة زنجبار سنة 1972. حقل الديانة في صندوق معلوماتها فارغ، ولا تسمي مدرسة."
  en: "Arabic Wikipedia article on Abeid Karume; used for entity facts only. It recounts his claim to have been born in the village of Mwera in 1905, his work as a seaman, his leadership of the Zanzibar Revolution and the union with Tanganyika that made him Tanzania's first vice-president, and his assassination in Zanzibar City in 1972. Its infobox religion field is empty and it names no school."
