reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision, fetched by revision id and the returned revision asserted equal. The article gives his birth in Amsterdam on 8 December 1984, his upbringing in a marginalised Amsterdam neighbourhood to Moroccan parents, his trainers, and his national charitable association for social works. One passage says he helped improve Morocco's image as a Muslim country and culture through visiting sports stars — a statement about Morocco, not about Hari's own religion. The article's text names no religion for him; it files him under Moroccan Muslims and Dutch Muslims, which are filings, not attestation. Its family details (wife and children) differ from the English article's later account and are not used."
