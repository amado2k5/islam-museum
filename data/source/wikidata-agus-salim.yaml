summary:
  ar: "عنصر ويكيداتا Q118629 لأغوس سالم؛ يحمل ميلاده في 8 تشرين الأول 1884 ووفاته في 4 تشرين الثاني 1954، وجاكرتا مكانًا لوفاته، ويعطي ديانته «الإسلام» إجمالًا دون مذهب."
  en: "Wikidata item Q118629 for Agus Salim; it carries his birth on 8 October 1884 and his death on 4 November 1954, Jakarta as his place of death, and gives his religion as Islam in general, with no school."
  es: "El elemento Q118629 de Wikidata corresponde a Agus Salim; en él figuran su fecha de nacimiento, el 8 de octubre de 1884, y su fecha de fallecimiento, el 4 de noviembre de 1954, con Yakarta como lugar de su muerte, y se indica que su religión era el Islam en general, sin mencionar ninguna escuela específica."
  fr: "L'élément Wikidata Q118629 pour Agus Salim; il indique sa naissance le 8 octobre 1884 et sa mort le 4 novembre 1954, Jakarta comme lieu de décès, et donne sa religion comme étant l'islam en général, sans école."
  ur: "اگس سلیم کے لیے وکی ڈیٹا آئٹم Q118629؛ یہ 8 اکتوبر 1884 کو ان کی پیدائش اور 4 نومبر 1954 کو اس کی موت، جکارتہ کو اس کی موت کی جگہ کے طور پر لے جاتا ہے، اور اس کے مذہب کو عام طور پر اسلام دیتا ہے، جس میں کوئی اسکول نہیں ہے۔"
  tr: "Wikidata Element Q118629 Agus Salem; 8 Ekim 1884 doğumlu ve 4 Kasım 1954'te ölen Jakarta, ölüm yeri olarak kabul edilmiştir ve genellikle dini \"İslam\" olarak kabul edilir, herhangi bir mezhep yoktur."
  id: "Elemen Wikidata Q118629 Agus Salem; lahir pada 8 Oktober 1884, dan meninggal pada 4 November 1954, Jakarta sebagai tempat kematiannya, dan umumnya menganggap agamanya \"Islam\" tanpa sekte apapun."
