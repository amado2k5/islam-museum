  ar: "مقالة ويكيبيديا الإنجليزية عن سوني علي بير (حكم نحو 1464–1492)، خامس عشر حكام أسرة سوني ومؤسس إمبراطورية سونغاي؛ فتح تمبكتو وجني ودلتا النيجر الداخلية، وتصف المقالة ديانته التوفيقية المتنازع عليها بين إسلام معلن وممارسات تقليدية، وخلاف المؤرخين المسلمين معه، ووفاته سنة 1492."
  en: "English Wikipedia article on Sonni Ali Ber (r. c. 1464–1492), fifteenth ruler of the Sonni dynasty and founder of the Songhai Empire; he conquered Timbuktu, Djenne and the Inner Niger Delta, and the article sets out his contested religious profile — a professed Islam alongside traditional practice, and the hostility of the Muslim chroniclers — and his death in 1492."
