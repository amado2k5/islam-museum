reliability_note: "Read in full on 1 November 2026. The article rests on the Tarikh al-Sudan and Tarikh al-Fattash kinglists and narratives (in Levtzion's Cambridge History of Africa chapter), sources written under or for the Askia dynasty that overthrew his house, and it says so itself: funeral stelae from Kukiya cast doubt on the chroniclers' picture. It gives no birth year — his accession falls about 1464 — and dates his death to 6 November 1492 on the Tarikh al-Sudan's account of a drowning while crossing the Niger, marked in the article as conjecture, against an oral tradition that his sister's son Askia Muhammad killed him. On religion it reports both that he observed the prayers, fasted and gave alms and that he venerated trees and stones and would not accept the sharia in Songhai, citing al-Maghili's condemnation and Toby Green's qualification; no source read names a school or order for him."
