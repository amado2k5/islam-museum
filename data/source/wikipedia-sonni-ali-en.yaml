summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سوني علي بير ⁦(حكم نحو 1464–1492)⁩، خامس عشر حكام أسرة سوني ومؤسس إمبراطورية سونغاي؛ فتح تمبكتو وجني ودلتا النيجر الداخلية، وتصف المقالة ديانته التوفيقية المتنازع عليها بين إسلام معلن وممارسات تقليدية، وخلاف المؤرخين المسلمين معه، ووفاته سنة 1492."
  en: "English Wikipedia article on Sonni Ali Ber (r. c. 1464–1492), fifteenth ruler of the Sonni dynasty and founder of the Songhai Empire; he conquered Timbuktu, Djenne and the Inner Niger Delta, and the article sets out his contested religious profile — a professed Islam alongside traditional practice, and the hostility of the Muslim chroniclers — and his death in 1492."
  es: "Artículo de la Wikipedia en inglés sobre Sonni Ali Ber (1464-1492), decimoquinto gobernante de la dinastía Sonni y fundador del Imperio Songhai; conquistó Tombuctú, Djenné y el delta interior del Níger, y el artículo expone su controvertido perfil religioso —un islamismo profesado junto con prácticas tradicionales y la hostilidad de los cronistas musulmanes— y su muerte en 1492."
  fr: "Article de Wikipédia en anglais sur Sonni Ali Ber (règne 1464-1492), quinzième souverain de la dynastie Sonni et fondateur de l'empire Songhaï; il a conquis Tombouctou, Djenné et le delta intérieur du Niger, et l'article décrit son profil religieux controversé — un islam professé parallèlement à la pratique traditionnelle, et l'hostilité des chroniqueurs musulmans — et sa mort en 1492."
  ur: "سونی علی بیر (rc 1464–1492) پر انگریزی ویکیپیڈیا مضمون، سونی خاندان کے پندرہویں حکمران اور سونگھائی سلطنت کے بانی؛ اس نے ٹمبکٹو، جینی اور اندرونی نائجر ڈیلٹا کو فتح کیا، اور اس مضمون میں اس کے متنازعہ مذہبی پروفائل - روایتی عمل کے ساتھ ساتھ اسلام کا دعویٰ، اور مسلمان تاریخ سازوں کی دشمنی - اور 1492 میں اس کی موت کا ذکر کیا گیا ہے۔"
  tr: "Sünni hanedanının on beşinci hükümdarı ve Songhai İmparatorluğu'nun kurucusu Suni Ali Bir hakkında İngilizce Vikipedi makalesi (yaklaşık 1464–1492 yılları arasında hüküm sürdü); Timbuktu, Jenni ve iç Nijer Deltası'nı fethetti. Makale, ilan edilen İslam ile geleneksel uygulamalar arasındaki tartışmalı Tawfiqi dinini, Müslüman tarihçiler arasındaki anlaşmazlıkları ve 1492'deki ölümünü anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Suni Ali Bir (memerintah sekitar 1464–1492), penguasa kelima belas dinasti Sunni dan pendiri Kekaisaran Songhai; menaklukkan Timbuktu, Jenni, dan Delta Niger bagian dalam. Artikel tersebut menggambarkan agama Tawfiqi yang kontroversial antara Islam yang dideklarasikan dan praktik tradisional, perselisihan di antara sejarawan Muslim, serta kematiannya pada tahun 1492."
