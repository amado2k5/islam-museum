summary:
  ar: "مقالة ويكيبيديا التترية عن غالياسكار كمال؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 6 يناير 1879 ⁦(بالقديم 25 ديسمبر 1878)⁩ في قازان في أسرة والده غالب أكبر كمال الدينوف، ووفاته في 16 يونيو 1933 بقازان، وتفاصيل أسرته ومكتبته؛ ولا تسمي له دينا ولا مذهبا."
  en: "Tatar Wikipedia article on Galiaskar Kamal; used for entity facts only. It gives his birth on 6 January 1879 (old style 25 December 1878) at Kazan in the family of Galiakbar Kamaletdinov, his death on 16 June 1933 at Kazan, and family detail; it names no religion or school for him."
  es: "Artículo de Wikipedia en tártaro sobre Galiaskar Kamal; utilizado únicamente para datos sobre la persona. Indica que nació el 6 de enero de 1879 (25 de diciembre de 1878 según el calendario antiguo) en Kazán, en el seno de la familia de Galiakbar Kamaletdinov, que falleció el 16 de junio de 1933 en Kazán y proporciona detalles sobre su familia; no menciona su religión ni su escuela."
  fr: "Article Wikipédia en tatar sur Galiaskar Kamal; utilisé uniquement pour les informations le concernant. Il indique sa naissance le 6 janvier 1879 (25 décembre 1878 selon l’ancien calendrier) à Kazan, dans la famille de Galiakbar Kamaletdinov, son décès le 16 juin 1933 à Kazan, et des détails sur sa famille; il ne mentionne ni sa religion ni son école."
  ur: "گالیاسکر کمال پر تاتار ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 6 جنوری 1879 ⁦(پرانی طرز 25 دسمبر 1878)⁩ کو کازان میں گالیاکبر کمال الدینوف کے خاندان میں پیدا ہوا، 16 جون 1933 کو کازان میں ان کی موت، اور خاندانی تفصیلات؛ اس کے لیے کسی مذہب یا اسکول کا نام نہیں ہے۔"
  tr: "Galyaskar Kemal hakkında Tatar Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 6 Ocak 1879'da (eski: 25 Aralık 1878) Kazan'da babası Ghalib Akbar Kemal Dinov'un ailesine doğduğunu ve 16 Haziran 1933'te Kazan'da öldüğünü, ailesi ve kütüphanesi hakkında bilgilerle birlikte verilmektedir; dini veya mezhebi adı verilmemiştir."
  id: "Artikel Wikipedia Tatar tentang Galyaskar Kemal; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya pada 6 Januari 1879 (lama: 25 Desember 1878) di Kazan dari keluarga ayahnya, Ghalib Akbar Kemal Dinov, dan kematiannya pada 16 Juni 1933 di Kazan, beserta rincian keluarga dan perpustakaannya; tidak disebutkan agama atau sektenya."
