summary:
  ar: "مقالة ويكيبيديا العربية عن فيصل عبد القادر الحسيني؛ تُستخدم لوقائع الكيان فقط. تؤكد ولادته في 17 يوليو 1940 ووفاته في 31 مايو 2001، وانتماءه إلى عائلة الحسيني الفلسطينية ودوره سياسيا فلسطينيا مقدسيا."
  en: "Arabic Wikipedia article on Faisal Abdel Qader al-Husseini; used for entity facts only. It confirms his birth on 17 July 1940 and death on 31 May 2001 and his place in the Palestinian Husseini family and Jerusalem politics."
  es: "Artículo de Wikipedia en árabe sobre Faisal Abdel Qader al-Husseini; utilizado únicamente para datos biográficos. Confirma su nacimiento el 17 de julio de 1940 y su fallecimiento el 31 de mayo de 2001, así como su lugar en la familia palestina Husseini y en la política de Jerusalén."
  fr: "Article de Wikipédia en arabe sur Faisal Abdel Qader al-Husseini; utilisé uniquement à des fins d’information sur l’entité. Il confirme sa naissance le 17 juillet 1940 et son décès le 31 mai 2001, ainsi que son appartenance à la famille palestinienne Husseini et son rôle dans la vie politique de Jérusalem."
  ur: "فیصل عبدالقادر الحسینی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 17 جولائی 1940 کو ان کی پیدائش اور 31 مئی 2001 کو موت اور فلسطینی حسینی خاندان اور یروشلم کی سیاست میں ان کے مقام کی تصدیق کرتا ہے۔"
  tr: "Faysal Abdul Kader el-Hüseyini hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 17 Temmuz 1940'ta doğduğunu, 31 Mayıs 2001'de öldüğünü, Filistinli el-Hüseyni ailesine ait olduğunu ve Filistinli Kudüslü bir politikacı olarak rolünü doğrulamaktadır."
  id: "Artikel Wikipedia berbahasa Arab tentang Faisal Abdul Qader al-Husseini; hanya digunakan untuk fakta entitas. Artikel ini mengonfirmasi kelahirannya pada 17 Juli 1940, dan kematiannya pada 31 Mei 2001, keanggotaannya dalam keluarga Palestina al-Husseini, serta perannya sebagai politisi Palestina di Yerusalem."
