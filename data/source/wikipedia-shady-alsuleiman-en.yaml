reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 by its recorded revision (oldid=1381715990; revision equality asserted). It gives: born 1978 in Sydney to a Palestinian family that migrated to Australia in the late 1960s; an ijazah with sanad in complete Qur'an memorisation from Darul Uloom Al-Husainiah in Sindh, Pakistan (that span is flagged citation-needed in the article and is not relied on alone); six years of study in Damascus specialising in Arabic and comparative fiqh, with ijazas in fiqh, usul al-fiqh and hadith; founder of the United Muslims of Australia (UMA), Sydney Islamic College, the Australian National Mosque Association (ANMA) and Islamic Media International; secretary of the Australian National Imams Council 2006-2015 and its president from 2016, re-elected 2019; listed in The Muslim 500; added in April 2018 as the 14th name on Denmark's list of preachers banned from entry; won a 2018 defamation case against News Corp. Its infobox gives his denomination as Sunni without a citation, and its categories file him among Sunni scholars — the only naming of a school in any source consulted, and a single source family together with the Wikidata value imported from the article."
