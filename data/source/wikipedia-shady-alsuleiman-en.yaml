summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شادي السليمان؛ تُستخدم لوقائع الكيان فقط. تروي مولده في سيدني سنة 1978 لأسرة فلسطينية، وإجازته في حفظ القرآن في السند وباكستان ودراسته ست سنوات في دمشق، وتأسيسه «مسلمي أستراليا المتحدين» وكلية سيدني الإسلامية ورئاسته المجلس الوطني للأئمة، وإدراجه في «المسلمون 500»، ومنعه من دخول الدنمارك سنة 2018، وكسبه قضية تشهير ضد نيوز كورب."
  en: "English Wikipedia article on Shady Alsuleiman; used for entity facts only. It covers his 1978 birth in Sydney to a Palestinian family, his Qur'an memorisation ijazah in Sindh and six years of study in Damascus, the United Muslims of Australia, Sydney Islamic College and the Australian National Imams Council he founded or leads, his listing in The Muslim 500, his 2018 ban from Denmark and his defamation win against News Corp."
