  ar: "الطبعة الكاملة الأولى من كتاب سيبويه بتحقيق الأستاذ الدكتور محمد كاظم البكّاء (جامعة الكوفة)، المجلد الأول، القسم الأول (أبواب النحو)، الجزء الأول: مقدمة الكتاب وإسناد الفعل؛ تبدأ بمقدمة المحقق (ص 1–12) ثم تنقل متن الكتاب مرتباً على أبواب مصنّفة. تعتمد المقدمة على مخطوطات مكتبة الأوقاف ببغداد والموصل وصنعاء ونسخة بولاق."
  en: "First complete edition of Sibawayh's Kitab in methodical arrangement, edited by Muhammad Kazim al-Bakka (Kufa), volume 1 part 1, published by Zein Legal and Literary Library, Beirut, 2015. Its editor's introduction (pp. 1–12) and classified text are the working base for this lane. Edition not yet verified against the physical book."
