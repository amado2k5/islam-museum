summary:
  ar: "الطبعة الكاملة الأولى من كتاب سيبويه بتحقيق الأستاذ الدكتور محمد كاظم البكّاء ⁦(جامعة الكوفة)⁩، المجلد الأول، القسم الأول ⁦(أبواب النحو)⁩، الجزء الأول: مقدمة الكتاب وإسناد الفعل؛ تبدأ بمقدمة المحقق ⁦(ص 1–12)⁩ ثم تنقل متن الكتاب مرتباً على أبواب مصنّفة. تعتمد المقدمة على مخطوطات مكتبة الأوقاف ببغداد والموصل وصنعاء ونسخة بولاق."
  en: "First complete edition of Sibawayh's Kitab in methodical arrangement, edited by Muhammad Kazim al-Bakka (Kufa), volume 1 part 1, published by Zein Legal and Literary Library, Beirut, 2015. Its editor's introduction (pp. 1–12) and classified text are the working base for this lane. Edition not yet verified against the physical book."
  es: "Primera edición completa del Kitab de Sibawayh en orden metódico, editada por Muhammad Kazim al-Bakka (Kufa), volumen 1, parte 1, publicada por la Biblioteca Jurídica y Literaria Zein, Beirut, 2015. La introducción del editor (págs. 1-12) y el texto clasificado constituyen la base de esta publicación. Edición aún no cotejada con el libro físico."
  fr: "Première édition complète du Kitab de Sibawayh, classée méthodiquement, éditée par Muhammad Kazim al-Bakka (Koufa), tome 1, partie 1, publiée par la Bibliothèque juridique et littéraire Zein, Beyrouth, 2015. L'introduction de l'éditeur (p. 1-12) et le texte classé constituent la base de cette étude. Édition non encore vérifiée par rapport à l'ouvrage physique."
  ur: "سیبویح کی کتاب کا پہلا مکمل ایڈیشن طریقہ وار ترتیب میں، جس کی تدوین محمد کاظم البکا ⁦(کوفہ)⁩، جلد 1 حصہ 1، زین لیگل اینڈ لٹریری لائبریری، بیروت، 2015 میں شائع ہوئی۔ اس کے ایڈیٹر کا تعارف ⁦(صفحہ 1-12)⁩ اور درجہ بند متن اس لین کے کام کی بنیاد ہیں۔ طبعی کتاب کے خلاف ایڈیشن ابھی تک تصدیق شدہ نہیں ہے۔"
  tr: "Sibawayh'in kitabının Profesör Dr. Muhammad Kazem Al-Bakka (Kufe Üniversitesi) tarafından düzenlenen ilk tam baskısı, Birinci Cilt, Birinci Bölüm (Dilbilgisi Bölümleri), Birinci Bölüm: Kitaba Giriş ve Eylem Zinciri; Editörün girişiyle başlar (s. 1–12), ardından kitabın metni düzenli bölümlere ayrılır. Giriş, Bağdat, Musul ve Sana'a'daki Vakıf Kütüphanesi'nden alınan el yazmalarına ve Bulaq el yazmasına dayanır."
  id: "Edisi lengkap pertama dari buku Sibawayh yang diedit oleh Profesor Dr. Muhammad Kazem Al-Bakka (Universitas Kufa), Volume Satu, Bagian Satu (Bab tentang Tata Bahasa), Bagian Satu: Pengantar Buku dan Rantai Tindakan; Dimulai dengan pengantar editor (hlm. 1–12), kemudian teks buku disusun dalam bagian-bagian yang terorganisir. Pendahuluan ini mengandalkan manuskrip dari Perpustakaan Endowments di Baghdad, Mosul, dan Sana'a, serta manuskrip Bulaq."
