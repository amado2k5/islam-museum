summary:
  ar: "مقالة ويكيبيديا الأردية عن حسين أحمد المدني؛ تُستخدم لوقائع الكيان فقط. سيرة تقليدية موسّعة تذكر ولادته في 19 شوال 1296هـ ووفاته في 13 جمادى الأولى 1377هـ بديوبند، وتنص على بيعته لرشيد أحمد الكنكوهي وخلافته عنه."
  en: "Urdu Wikipedia article on Husain Ahmad Madani; used for entity facts only. A long traditional biography giving his birth on 19 Shawwal 1296 AH and his death on 13 Jumada al-awwal 1377 AH at Deoband, listing his Deoband teachers and books, and stating in its text that he took bay'ah from Rashid Ahmad Gangohi and became his authorised khalifa."
  es: "Artículo de Wikipedia en urdu sobre Husain Ahmad Madani; utilizado únicamente para datos sobre la persona. Una extensa biografía tradicional que indica su nacimiento el 19 de Shawwal de 1296 AH y su muerte el 13 de Jumada al-awwal de 1377 AH en Deoband, enumerando a sus maestros y libros de Deoband, y afirmando en su texto que prestó juramento de lealtad (bay'ah) a Rashid Ahmad Gangohi y se convirtió en su califa autorizado."
  fr: "Article de Wikipédia en ourdou sur Husain Ahmad Madani; utilisé uniquement pour les informations sur l'entité. Une longue biographie traditionnelle indique sa naissance le 19 Shawwal 1296 AH et sa mort le 13 Jumada al-awwal 1377 AH à Deoband, énumère ses maîtres et ouvrages de Deoband, et précise qu'il a prêté allégeance à Rashid Ahmad Gangohi et est devenu son calife autorisé."
  ur: "حسین احمد مدنی پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ ایک طویل روایتی سوانح عمری جس میں آپ کی ولادت 19 شوال 1296 ہجری کو ہوئی اور آپ کی وفات 13 جمادی الاول 1377 ہجری کو دیوبند میں ہوئی، اس میں دیوبند کے اساتذہ اور کتب کی فہرست دی گئی ہے اور اس کے متن میں بتایا گیا ہے کہ انہوں نے رشید احمد گنگوہی سے بیعت کی اور ان کے مجاز خلیفہ بنے۔"
  tr: "Hussein Ahmad Al-Madani hakkında Urduca Vikipedi makalesi; yalnızca varlığın olayları için kullanılmıştır. 19 Shawwal 1296 Hicri'de doğumunu ve 13 Jumada al-Awwal 1377 H.'de Deoband'da öldüğünü belirten kapsamlı geleneksel biyografi, Rashid Ahmad al-Kankuhi'ye bağlılığını ve onun tahtını belirtir."
  id: "Artikel Wikipedia Urdu tentang Hussein Ahmad Al-Madani; digunakan hanya untuk peristiwa entitas tersebut. Biografi tradisional yang luas menyebutkan kelahirannya pada 19 Shawwal 1296 H dan kematiannya pada 13 Jumada al-Awwal 1377 H di Deoband, dan menyatakan kesetiaannya kepada Rashid Ahmad al-Kankuhi dan suksesinya."
