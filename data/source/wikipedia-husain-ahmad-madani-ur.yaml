reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md). Read in full on 26 October 2026 at the recorded revision, fetched by revision id and asserted equal before any claim was drawn. A hagiographic Urdu biography resting on the traditional lives (Naqsh-e-Hayat and its abridgements, the Shaykh al-Islam biographies): it pairs both dates itself — born 19 Shawwal 1296 AH (matching 6 October 1879) at Bangarmau, Unnao, and died Thursday 13 Jumada al-awwal 1377 AH, 5 December 1957, at Deoband — so the record's Hijri years are the source's own, not conversions. Its teachers table documents his study under Mahmud Hasan and the Deoband faculty. Its Tasawwuf section states that, directed by Mahmud Hasan, he took bay'ah from Rashid Ahmad Gangohi and in time became his authorised khalifa — one text attestation of personal Sufi discipleship. Its text nowhere names a legal school for him; its Hanafi and Maturidi framings are the navbox templates and categories (Hanafis, Hanafi fiqh, Maturidi personalities, Sunni Sufis), which are filings."
