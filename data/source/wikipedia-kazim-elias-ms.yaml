  ar: "مقالة ويكيبيديا الملايوية عن محمد كاظم إلياس، مراجعة 7 سبتمبر 2026؛ تُستخدم لوقائع الكيان فقط. تفصّل مولده في بيراك وتعليمه في معهد تحفيظ القرآن والقراءات بمسجد الولاية، وتأسيسه مركز البركة التعليمي في إيبوه وترؤّسه له، وأسلوبه المرح في المحاضرات وموضوعات الأسرة والتحفيز."
  en: "Malay Wikipedia article on Mohammad Kazim Elias, revision of 7 September 2026; used for entity facts only. It details his birth in Perak, his education at the Maahad Tahfiz Al Quran & Qiraat of the Perak State Mosque, his founding and headship of the Al Barakah Education Centre in Ipoh, and his relaxed, humorous lecture style on family and motivation themes."
