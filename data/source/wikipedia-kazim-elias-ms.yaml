reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026): a fact is used only where the article cites a source for it. The title 'Kazim Elias' on Malay Wikipedia is a redirect to this article. Its lead, citing Utusan Malaysia (30 November 2013), calls him an independent preacher and Malaysian media personality, records his birth at Kampung Paya, Batu Kurau, Mukim Selama, Perak on 28 November 1972, his tahfiz diploma from the Maahad Tahfiz Al Quran & Qiraat at the Perak State Mosque, and his role as founder and principal of Pusat Pendidikan Al Barakah, headquartered at Kampung Manjoi, Ipoh, Perak; its infobox lists his television and radio presence (Forum Perdana Ehwal Islam, Tanyalah Ustaz, Perak FM) and the acronym DUKE. No school is named for him. Read in full on 15 November 2026."
