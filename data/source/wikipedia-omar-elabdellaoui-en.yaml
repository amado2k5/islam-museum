summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عمر العبدلاوي؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته من أكاديمية مانشستر سيتي وإعاراته إلى أولمبياكوس وغلطة سراي وبودو/غليمت، و49 مباراة دولية مع النرويج، وإصابته في عينيه بألعاب نارية ليلة رأس سنة 2020."
  en: "English Wikipedia article on Omar Elabdellaoui; used for entity facts only. It recounts his Manchester City academy years, loans, Olympiacos, Galatasaray and Bodø/Glimt spells, 49 Norway caps, and the New Year's Eve 2020 fireworks injury to his eyes."
  es: "Artículo de la Wikipedia en inglés sobre Omar Elabdellaoui; utilizado únicamente para obtener información sobre la persona. En él se narran sus años en la cantera del Manchester City, sus cesiones, su paso por el Olympiacos, el Galatasaray y el Bodø/Glimt, sus 49 partidos con la selección de Noruega y la lesión ocular que sufrió a causa de los fuegos artificiales en la víspera de Año Nuevo de 2020."
  fr: "Article Wikipédia en anglais sur Omar Elabdellaoui; utilisé uniquement à des fins d'information sur l'entité. Il relate ses années à l'académie de Manchester City, ses prêts, ses passages à l'Olympiacos, à Galatasaray et à Bodø/Glimt, ses 49 sélections en équipe nationale de Norvège et sa blessure aux yeux lors des feux d'artifice du Nouvel An 2020."
  ur: "عمر الابدلاوی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کی مانچسٹر سٹی اکیڈمی کے سالوں، قرضوں، اولمپیاکوس، گالاتسرے اور بوڈو/گلمٹ کے منتر، 49 ناروے کیپس، اور نئے سال کی شام 2020 کی آتش بازی سے اس کی آنکھوں پر لگنے والی چوٹ کا ذکر ہے۔"
  tr: "Omar Al-Abdallawi hakkında İngilizce Wikipedia makalesi; sadece varlığın gerçekleri için kullanılmıştır. Manchester City akademisinden yolculuğunu, Olympiakos, Galatasaray ve Bodo/Glimt'e kiralanmalarını, Norveç ile 49 uluslararası maçını ve 2020 yılbaşı gecesi havai fişek yaralanmasını anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Omar Al-Abdallawi; digunakan hanya untuk fakta entitas. Artikel ini menceritakan perjalanannya dari akademi Manchester City, peminjaman ke Olympiacos, Galatasaray, dan Bodo/Glimt, 49 pertandingan internasional melawan Norwegia, serta cedera matanya akibat kembang api pada malam Tahun Baru 2020."
