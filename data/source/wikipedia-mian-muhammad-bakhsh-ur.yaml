  en: "The Urdu Wikipedia article on Mian Muhammad Bakhsh; its silsila section states that his chain of tariqa is Qadiri, Qalandari and Hujwiri, it records his bay'ah to Sain Ghulam Muhammad of Kalrodi, and it gives his birth as circa 1830 (1246 AH in Faqir Qadri's biography) and his death in 1907 at Khari Sharif."
