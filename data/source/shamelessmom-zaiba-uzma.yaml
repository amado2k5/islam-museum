summary:
  ar: "صفحة حلقة بودكاست «شيمليس ليدرشيب» التي استضافت زايبة حسن وعظمى جعفري؛ تحمل السيرة الرسمية المشتركة للمقدمتين: زايبة أمريكية مسلمة وُلدت ونشأت في شيكاغو، من أصل أيرلندي باكستاني ونشأة بين الأديان، تُدعى للحديث في فعاليات حوار الأديان، وتعمل على درجة ماجستير وشهادة في تدريب الوالدين، وهي أم لأربعة أطفال؛ وعظمى طبيبة نشأت في هيوستن وتدير عيادتها في فينيكس."
  en: "The Shameless Leadership podcast episode page hosting Zaiba Hasan and Uzma Jafri; it carries the hosts' shared official biography: Zaiba is an American Muslim born and raised in Chicago, of Irish and Pakistani heritage and an interfaith upbringing, frequently invited to speak at interfaith events, working on a master's degree and a parent coaching certification, and a mother of four; Uzma is a Houston-raised physician running her own practice in Phoenix."
  es: "La página del episodio del podcast Shameless Leadership que presenta a Zaiba Hasan y Uzma Jafri incluye la biografía oficial compartida de las presentadoras: Zaiba es una musulmana estadounidense nacida y criada en Chicago, de ascendencia irlandesa y pakistaní y con una educación interreligiosa, invitada frecuentemente a hablar en eventos interreligiosos, que está cursando una maestría y una certificación como asesora de padres, y es madre de cuatro hijos; Uzma es una médica criada en Houston que dirige su propia consulta en Phoenix."
  fr: "La page de l'épisode du podcast Shameless Leadership, animé par Zaiba Hasan et Uzma Jafri, présente leur biographie officielle commune: Zaiba est une Américaine musulmane née et élevée à Chicago, d'origine irlandaise et pakistanaise, élevée dans un contexte interreligieux. Elle est fréquemment invitée à prendre la parole lors d'événements interreligieux, poursuit actuellement une maîtrise et une certification de coaching parental, et est mère de quatre enfants; Uzma est une médecin originaire de Houston qui exerce à Phoenix."
  ur: "دی شیملیس لیڈرشپ پوڈ کاسٹ ایپی سوڈ پیج زیبا حسن اور عظمیٰ جعفری کی میزبانی کر رہا ہے۔ اس میں میزبانوں کی مشترکہ باضابطہ سوانح عمری ہے: زیبا ایک امریکی مسلمان ہے جو شکاگو میں پیدا ہوئی اور پرورش پائی، آئرش اور پاکستانی وراثت اور بین المذاہب پرورش کی، اکثر بین المذاہب تقریبات میں بولنے کے لیے مدعو کیا جاتا ہے، ماسٹر ڈگری اور والدین کی کوچنگ سرٹیفیکیشن پر کام کرنا، اور چار بچوں کی ماں؛ عظمیٰ ہیوسٹن میں پرورش پانے والی ایک ڈاکٹر ہے جو فینکس میں اپنی پریکٹس چلا رہی ہے۔"
  tr: "Zaiba Hassan ve Azma Jafari'nin ev sahipliği yaptığı \"Shimlis Liderliği\" podcast bölümünün sayfasında, iki sunucunun resmi ortak biyografileri yer alıyor: Zaiba, Chicago'da doğup büyümüş, İrlanda-Pakistan kökenli ve dinlerarası bir yetiştirilme yetiştirilmiş, dinlerarası diyalog etkinliklerinde konuşmaya davet edilen, ebeveynlik eğitimi alanında yüksek lisans ve sertifika üzerinde çalışan, dört çocuk annesi olan Amerikalı Müslüman Zeybah. Azma ise Houston'da büyümüş ve Phoenix'te kliniğini işleten bir doktordur."
  id: "Halaman episode podcast \"Shimlis Leadership\", yang menampilkan Zaiba Hassan dan Azma Jafari, menampilkan biografi resmi bersama kedua pembawa acara: Zaiba adalah Zaybah Muslim Amerika yang lahir dan besar di Chicago, berdarah Irlandia-Pakistan dan dibesarkan lintas agama, diundang untuk berbicara di acara dialog antaragama, sedang menempuh gelar master dan sertifikat pelatihan parenting, ibu dari empat anak; dan Azma adalah dokter yang tumbuh di Houston dan menjalankan kliniknya di Phoenix."
