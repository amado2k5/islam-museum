  ar: "صفحة حلقة بودكاست «شيمليس ليدرشيب» التي استضافت زايبة حسن وعظمى جعفري؛ تحمل السيرة الرسمية المشتركة للمقدمتين: زايبة أمريكية مسلمة وُلدت ونشأت في شيكاغو، من أصل أيرلندي باكستاني ونشأة بين الأديان، تُدعى للحديث في فعاليات حوار الأديان، وتعمل على درجة ماجستير وشهادة في تدريب الوالدين، وهي أم لأربعة أطفال؛ وعظمى طبيبة نشأت في هيوستن وتدير عيادتها في فينيكس."
  en: "The Shameless Leadership podcast episode page hosting Zaiba Hasan and Uzma Jafri; it carries the hosts' shared official biography: Zaiba is an American Muslim born and raised in Chicago, of Irish and Pakistani heritage and an interfaith upbringing, frequently invited to speak at interfaith events, working on a master's degree and a parent coaching certification, and a mother of four; Uzma is a Houston-raised physician running her own practice in Phoenix."
