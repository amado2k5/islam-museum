summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عيسى علي بنتامي؛ تُستخدم لوقائع الكيان فقط. تروي عمله أستاذا في جامعة أبوبكر تافاوا باليوا وجامعة المدينة الإسلامية، ومديرا عاما لوكالة تطوير تكنولوجيا المعلومات الوطنية (2016–2019)، ثم وزيرا للاتصالات والاقتصاد الرقمي (2019–2023)، والجدل حول خطبه القديمة وتنصّله منها سنة 2021. لا يذكر نصها مذهبا له."
  en: "English Wikipedia article on Isa Ali Pantami; used for entity facts only. It recounts his lecturing at Abubakar Tafawa Balewa University and the Islamic University of Madinah, his directorship of the National Information Technology Development Agency (2016–2019) and his tenure as Minister of Communications and Digital Economy (2019–2023), and the controversy over his early sermons and his 2021 recantation of them. Its text names no school for him."
