reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 at the recorded revision, fetched by revision id through the MediaWiki API with the returned id asserted equal. It gives his birth name as Isa Ali Ibrahim, his birthplace as Gombe State, his education at Abubakar Tafawa Balewa University and Robert Gordon University, his NITDA directorship from 26 September 2016 to 20 August 2019 and his ministry from 21 August 2019 to 29 May 2023; it leaves the infobox birth-date field empty and files him under 'Year of birth missing (living people)'. On faith it records his years as chief imam of the Abubakar Tafawa Balewa University mosque, the resurfaced mid-2000s sermons sympathetic to the Taliban and al-Qaeda and his April 2021 public recantation of those views; it never calls him Salafi, never names Izala as his affiliation and names no madhhab."
