summary:
  ar: "قناة «الراسخون في العلم» على يوتيوب (@alrasekhoon)؛ يقول قسم «حول» فيها إنها تُدار عبر موقع الراسخون في العلم، وهو الموقع الرسمي لصالح المغامسي، وفيها محاضراته ودروسه."
  en: "The Al-Rasekhoon YouTube channel (@alrasekhoon); its About states that it is run through the Al-Rasekhoon website, which is the official website of Saleh Al-Maghamsi, and it carries his lectures and lessons."
  es: "El canal de YouTube Al-Rasekhoon (@alrasekhoon); en su sección \"Acerca de\" se indica que se gestiona a través del sitio web Al-Rasekhoon, que es el sitio web oficial de Saleh Al-Maghamsi, y que en él se publican sus conferencias y lecciones."
  fr: "La chaîne YouTube Al-Rasekhoon (@alrasekhoon); sa section À propos indique qu'elle est gérée par le biais du site web Al-Rasekhoon, qui est le site web officiel de Saleh Al-Maghamsi, et qu'elle diffuse ses conférences et ses leçons."
  ur: "الراسیخون یوٹیوب چینل (@alrasekhoon)؛ اس کے بارے میں بتایا گیا ہے کہ یہ الرسیخون ویب سائٹ کے ذریعے چلائی جاتی ہے، جو صالح المغامسی کی سرکاری ویب سائٹ ہے، اور اس میں ان کے لیکچرز اور اسباق ہوتے ہیں۔"
  tr: "'Al-Rasikhun fi Al-'Alm' YouTube kanalı (@alrasekhoon); 'Hakkında' bölümünde, Salih Al-Maghamsi'nin resmi sitesi olan 'Al-Rasikhun fi Al-'Ilm' web sitesi üzerinden yönetildiği belirtilmektedir; bu site Salih Al-Maghamsi'nin dersleri ve derslerinin verildiği yerdir."
  id: "Saluran YouTube 'Al-Rasikhun fi Al-'Alm' (@alrasekhoon); bagian 'Tentang' menyatakan bahwa saluran ini dikelola melalui situs web 'Al-Rasikhun fi Al-'Ilm', yang merupakan situs resmi Saleh Al-Maghamsi, tempat kuliah dan pelajarannya diadakan."
