summary:
  ar: "مقالة ويكيبيديا العربية عن الأمير الوليد بن طلال بن عبد العزيز آل سعود، المستثمر السعودي؛ توافق المقالة الإنجليزية على مولده في جدة في ٧ آذار ١٩٥٥ وشركة المملكة القابضة واحتجازه سنة ٢٠١٧ وإطلاق سراحه."
  en: "Arabic Wikipedia article on Prince Al Waleed bin Talal Al Saud, the Saudi investor; it agrees with the English article on his birth in Jeddah on 7 March 1955, his Kingdom Holding Company and his 2017 detention and release."
  es: "Artículo de Wikipedia en árabe sobre el príncipe Al Waleed bin Talal Al Saud, el inversor saudí; coincide con el artículo en inglés sobre su nacimiento en Jeddah el 7 de marzo de 1955, su empresa Kingdom Holding Company y su detención y liberación en 2017."
  fr: "L'article de Wikipédia en arabe sur le prince Al Waleed bin Talal Al Saud, l'investisseur saoudien, concorde avec l'article en anglais concernant sa naissance à Djeddah le 7 mars 1955, sa Kingdom Holding Company et sa détention puis sa libération en 2017."
  ur: "سعودی سرمایہ کار شہزادہ الولید بن طلال آل سعود پر عربی ویکیپیڈیا کا مضمون؛ یہ 7 مارچ 1955 کو جدہ میں اس کی پیدائش، اس کی کنگڈم ہولڈنگ کمپنی اور اس کی 2017 کی حراست اور رہائی کے انگریزی مضمون سے متفق ہے۔"
  tr: "Suudi yatırımcı Prens Alwaleed bin Talal bin Abdulaziz Al Saud hakkında Arapça Wikipedia makalesi; İngilizce makale, 7 Mart 1955'te Cidde'de doğması, Kingdom Holding Company, 2017'de tutuklanması ve serbest bırakılmasıyla örtüşüyor."
  id: "Artikel Wikipedia Arab tentang Pangeran Alwaleed bin Talal bin Abdulaziz Al Saud, investor Saudi; artikel berbahasa Inggris sejalan dengan kelahirannya di Jeddah pada 7 Maret 1955, Kingdom Holding Company, penahanannya pada 2017, dan pembebasannya."
