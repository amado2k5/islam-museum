label: { ar: "أسماء بنت راشد الرويشد — صفحة المؤلفة في موقع قناة الجامع لعلوم القرآن", en: "Asma bint Rashid Al-Ruwaished — author page, Al-Jami' Channel for Quranic Sciences (quran-uni.com)" }
summary:
  ar: "صفحة المؤلفة أسماء بنت راشد الرويشد في موقع قناة الجامع لعلوم القرآن (quran-uni.com)؛ تثبت اسمها الكامل وكتابها «هكذا عاشوا مع القرآن» الصادر عن دار الحضارة للنشر والتوزيع سنة 2011 في 168 صفحة، في تصنيفي التفسير وأصوله وتدبر القرآن."
  en: "The author page of Asma bint Rashid Al-Ruwaished on the site of the Al-Jami' Channel for Quranic Sciences (quran-uni.com); it establishes her full name and her book 'Hakatha Ashu ma'a al-Qur'an' (Thus They Lived with the Qur'an), published by Dar al-Hadara in 2011, 168 pages, catalogued under tafsir and contemplation of the Qur'an."
  es: "La página de la autora Asma bint Rashid Al-Ruwaished en el sitio web del Canal Al-Jami' para las Ciencias Coránicas (quran-uni.com) establece su nombre completo y su libro 'Hakatha Ashu ma'a al-Qur'an' (Así vivieron con el Corán), publicado por Dar al-Hadara en 2011, de 168 páginas, catalogado bajo tafsir y contemplación del Corán."
  fr: "La page d'auteur d'Asma bint Rashid Al-Ruwaished sur le site de la chaîne Al-Jami' pour les sciences coraniques (quran-uni.com); elle établit son nom complet et son livre 'Hakatha Ashu ma'a al-Qur'an' (Ainsi ils vécurent avec le Coran), publié par Dar al-Hadara en 2011, 168 pages, catalogué sous tafsir et contemplation du Coran."
  ur: "الجامع چینل فار قرآنی سائنسز (quran-uni.com) کی سائٹ پر اسماء بنت راشد الروایش کا مصنف صفحہ؛ اس نے اس کا پورا نام اور اس کی کتاب 'حکاتہ اشو ما القرآن' ⁦(اس طرح وہ قرآن کے ساتھ زندہ رہتے ہیں)⁩ قائم کرتے ہیں، جو 2011 میں دار الہدارہ کی طرف سے شائع ہوئی، 168 صفحات پر مشتمل، تفسیر اور قرآن کی تفہیم کے تحت کیٹلاگ۔"
  tr: "Yazar Asma bint Rashid Al-Ruwaished'in Al-Jami' Kuran Bilimleri Kanalı (quran-uni.com) sitesindeki sayfası, tam adını ve 2011'de Dar Al-Hadara tarafından yayımlanan ve Kur'an ile Nasıl Yaşadılar adlı kitabını, Tafsir ve Kur'an'ın İlkeleri ve Telaş kategorilerinde 168 sayfa olarak doğrulamaktadır."
  id: "Halaman penulis Asma bint Rashid Al-Ruwaished di situs Al-Jami' Channel for Quranic Sciences (quran-uni.com) mengonfirmasi nama lengkapnya dan bukunya \"This Is How They Lived with the Qur'an,\" yang diterbitkan oleh Dar Al-Hadara untuk Penerbitan dan Distribusi pada tahun 2011, dalam 168 halaman, dalam kategori Tafsir dan Prinsip serta Kontemplasi Al-Qur'an."
