reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It gives his reign (20 October 1760 to 7 July 1763), his full name Mir Muhammad Qasim Ali Khan, his father Mir Razi Khan, his marriage to a daughter of Mir Jafar, and his death on 8 May 1777 at Kotwal near Delhi — the narrative marks the Kotwal details citation-needed, and Banglapedia independently gives death in obscurity near Delhi in 1777. It files him under 'Year of birth unknown' and gives no birth date at all; its claim that he descended from Ali al-Ridha is itself flagged citation-needed in the article. Its only link on faith is a see-also to Shia Islam in India and a category filing, neither of which the record treats as attestation. Checked 1 November 2026."
