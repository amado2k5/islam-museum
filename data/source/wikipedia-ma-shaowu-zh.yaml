reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision; its account draws on Wang Jianping's study of Ma Shaowu's rule in southern Xinjiang, on the Xinjiang Hui history outline and on his family's recollections. It gives his courtesy name as Shiying, his birth in 1874 at Tonghai in Yunnan, and his death at Dihua in 1937. Its infobox religion field reads 'Islam, Sufism (Gaozan school)' — Gaozan being a name of the Jahriyya — and its text states in detail that he was a great-grandson of Ma Mingxin's eldest son, studied under the Jahriyya leader Ma Yuanzhang, was sent to Xinjiang to strengthen the Gaozan (Jahriyya) menhuan with instructions to assist it, built its gongbei shrines, raised its adherents for the 1924 assault on Ma Fuxing, and opposed Communism out of his own religious stance. It dates that assault to 31 May 1924, where the Chinese Ma Fuxing article gives 2 June."
