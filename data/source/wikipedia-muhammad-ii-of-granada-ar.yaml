summary:
  ar: "مقالة ويكيبيديا العربية عن أبي عبد الله محمد الثاني ⁦(633–701 هـ)⁩؛ تعطي ولادته سنة 1236 في منطقة غرناطة وحكمه من 671 إلى 701 هـ (1273–1302)، وتقول إنه لُقّب بالفقيه لورعه وتدينه؛ تُستخدم لوقائع الكيان فقط."
  en: "Arabic Wikipedia article on Abu Abd Allah Muhammad II (633-701 AH); it gives his birth in 1236 in the Granada region, his reign from 671 to 701 AH (1273-1302), and says he was surnamed al-Faqih for his piety and religiosity; used for entity facts only."
  es: "Artículo de Wikipedia en árabe sobre Abu Abd Allah Muhammad II (633-701 AH); indica que nació en 1236 en la región de Granada, que reinó desde 671 hasta 701 AH (1273-1302) y que recibió el sobrenombre de al-Faqih por su piedad y religiosidad; se utiliza únicamente para datos sobre la entidad."
  fr: "Article de Wikipédia en arabe sur Abu Abd Allah Muhammad II (633-701 AH); il indique sa naissance en 1236 dans la région de Grenade, son règne de 671 à 701 AH (1273-1302), et dit qu'il était surnommé al-Faqih pour sa piété et sa religiosité; utilisé uniquement pour les faits concernant l'entité."
  ur: "ابو عبد اللہ محمد ثانی ⁦(633-701ھ)⁩ پر عربی ویکیپیڈیا مضمون؛ اس کی پیدائش 1236 میں غرناطہ کے علاقے میں ہوئی، اس کا دور حکومت 671 سے 701 ہجری (1273-1302) تک ہے، اور کہتے ہیں کہ اسے ان کی تقویٰ اور مذہبیت کی وجہ سے فقیہ کہا گیا تھا۔ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔"
  tr: "Arapça Vikipedi makalesi, Ebu Abdullah Muhammed II (633–701 H) hakkında; 1236'da Granada bölgesinde doğduğunu ve 671-701 Hicri (1273–1302) arasındaki saltanatını anlatır ve dindarlığı ve dindarlığı nedeniyle 'hukukçu' unvanını aldığını belirtir; sadece varlığın gerçekleri için kullanılır."
  id: "Artikel Wikipedia berbahasa Arab tentang Abu Abdullah Muhammad II (633–701 H); artikel ini menyebutkan kelahirannya pada tahun 1236 di wilayah Granada dan masa pemerintahannya dari 671 hingga 701 H (1273–1302), serta menyatakan bahwa ia dijuluki 'sang ahli hukum' karena kesalehan dan kesalehannya; istilah ini hanya digunakan untuk fakta-fakta entitas tersebut."
