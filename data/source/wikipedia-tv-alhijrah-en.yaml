  ar: "مقالة ويكيبيديا الإنجليزية عن تي في الهجرة: قناة تلفزيونية إسلامية ماليزية حكومية مجانية، تملكها وتديرها شركة الهجرة الإعلامية تحت إشراف إدارة التنمية الإسلامية الماليزية، انطلقت رسميًا في 7 ديسمبر 2010 من مجمع المركز الإسلامي في كوالالمبور."
  en: "The English Wikipedia article on TV Alhijrah: a state-owned Malaysian free-to-air Islamic television channel, owned and operated by Alhijrah Media Corporation, a company under the purview of the Department of Islamic Development Malaysia (JAKIM) of the Prime Minister's Department; officially launched on 7 December 2010 and broadcasting from the Islamic Centre Complex, Kuala Lumpur."
