reliability_note: "Encyclopaedia article read on 15 November 2026. It records TV Alhijrah as a state-owned Malaysian free-to-air Islamic television channel owned and operated by Al-Hijrah Media Corporation, a company under the purview of the Department of Islamic Development Malaysia of the Prime Minister's Department; Malaysia's first full-fledged and sharia-compliance free-to-air Islamic television network; operations began on a trial basis on 1 November 2010 and the station was officially launched on 1 Muharram 1432H (7 December 2010); headquarters at the Islamic Centre Complex, Kuala Lumpur. Used for entity facts (owner, launch date, headquarters) only, never for audience figures. Read on 15 November 2026."
