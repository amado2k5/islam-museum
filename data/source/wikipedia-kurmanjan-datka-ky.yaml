  ur: "کرمانجن داتکا پر کرغیز ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ سال کی درستگی (1811) پر اس کی پیدائش، 1 فروری 1907 کو اس کی موت، اور 1832 سے 1876 تک اس کی الائی کی حکمرانی دیتا ہے۔"
  tr: "Karamangan Datka hakkında Kırgız Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1811'deki doğumundan, 1 Şubat 1907'deki ölümünden ve 1832'den 1876'ya kadar Alai üzerindeki yönetiminden bahseder."
  id: "Artikel Wikipedia Kyrgyz tentang Karamangan Datka; digunakan hanya untuk fakta entitas. Artikel ini menyebutkan kelahirannya pada tahun 1811, kematiannya pada 1 Februari 1907, dan pemerintahannya atas Alai dari tahun 1832 hingga 1876."
