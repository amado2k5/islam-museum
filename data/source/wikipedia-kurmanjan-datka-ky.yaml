  ar: "مقالة ويكيبيديا القرغيزية عن قرمانجان داتقا؛ تُستخدم لوقائع الكيان فقط. تذكر مولدها بسنة 1811 ووفاتها في 1 فبراير 1907 وحكمها للألاي من 1832 إلى 1876."
  en: "Kyrgyz Wikipedia article on Kurmanjan Datka; used for entity facts only. It gives her birth at year precision (1811), her death on 1 February 1907, and her rule of the Alai from 1832 to 1876."
