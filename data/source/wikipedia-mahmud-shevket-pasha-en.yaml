  ar: "مقالة ويكيبيديا الإنجليزية عن محمود شوكت باشا؛ تُستخدم لوقائع الكيان فقط. تعطيه قائدًا عسكريًّا وُلد في بغداد سنة 1856، قاد جيش الحركة سنة 1909، وتولى الصدارة العظمى من يناير 1913 حتى اغتياله في إسطنبول في 11 يونيو 1913."
  en: "English Wikipedia article on Mahmud Shevket Pasha; used for entity facts only. It gives him as a military commander born in Baghdad in 1856 who led the Action Army in 1909 and served as Grand Vizier from January 1913 until his assassination in Istanbul on 11 June 1913."
  es: "Artículo de la Wikipedia en inglés sobre Mahmud Shevket Pasha; utilizado únicamente para datos sobre la persona. Lo describe como un comandante militar nacido en Bagdad en 1856 que dirigió el Ejército de Acción en 1909 y se desempeñó como Gran Visir desde enero de 1913 hasta su asesinato en Estambul el 11 de junio de 1913."
  fr: "Article de Wikipédia en anglais sur Mahmud Shevket Pacha; utilisé uniquement pour les informations sur l'entité. Il le présente comme un commandant militaire né à Bagdad en 1856, qui a dirigé l'Armée d'action en 1909 et a été grand vizir de janvier 1913 jusqu'à son assassinat à Istanbul le 11 juin 1913."
