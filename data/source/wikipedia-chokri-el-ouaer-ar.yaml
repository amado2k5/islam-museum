summary:
  ar: "مقالة ويكيبيديا العربية عن شكري الواعر؛ تُستخدم لوقائع الكيان فقط. يذكر متنها ميلاده في 15 أغسطس 1966 في تونس، بينما يعطي قالب تاريخ ميلاده في صندوق المعلومات 15 يونيو 1966، وهو اختلاف مسجل في سجل الشخص."
  en: "Arabic Wikipedia article on Chokri El Ouaer; used for entity facts only. Its lead gives his birth as 15 August 1966 in Tunis, while its infobox birth-date template gives 15 June 1966 — a variant recorded in the person record. It recounts his Espérance career, four continental cups and the Afro-Asian Cup, and the May 2026 vice-presidency."
  es: "Artículo de Wikipedia en árabe sobre Chokri El Ouaer; utilizado únicamente para datos sobre la persona. En la introducción figura que nació el 15 de agosto de 1966 en Túnez, mientras que la plantilla de fecha de nacimiento en su ficha informativa indica el 15 de junio de 1966, una variante registrada en su ficha personal. El artículo relata su trayectoria en el Espérance, sus cuatro Copas Continentales y la Copa Afroasiática, así como su vicepresidencia en mayo de 2026."
  fr: "Article Wikipédia en arabe sur Chokri El Ouaer; utilisé uniquement pour les informations relatives à l’entité. Son introduction indique sa naissance le 15 août 1966 à Tunis, tandis que le modèle de date de naissance de l’infobox mentionne le 15 juin 1966 – une variante figurant dans sa fiche de personne. L’article retrace sa carrière à l’Espérance, ses quatre Coupes continentales et la Coupe afro-asiatique, ainsi que sa vice-présidence en mai 2026."
