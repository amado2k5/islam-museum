summary:
  ar: "عنصر ويكيبيانات Q467021 لمظفر الدين شاه قاجار: قيمتان لميلاده ⁦(23 مارس 1853 مستوردًا من ويكيبيديا الإنجليزية، و25 مارس 1853 بمرجع موسوعة الإسلام لبريل)⁩، وأربع قيم لوفاته في يناير 1907 ⁦(3 و6 و9 والشهر فقط)⁩، وأبوه ناصر الدين شاه، ودفنه في مرقد الإمام الحسين، وقيمتان للديانة بلا مرجع: «الإسلام» (Q432) و«التشيع الاثنا عشري» (Q269785)."
  en: "Wikidata item Q467021 for Mozaffar ad-Din Shah Qajar: two birth values (23 March 1853, imported from the English Wikipedia, and 25 March 1853, referenced to Brill's Encyclopaedia of Islam), four death values in January 1907 (the 3rd, 6th, 9th and the month only), father Naser al-Din Shah, burial at the Imam Husayn Mausoleum, and two unreferenced religion values, Islam (Q432) and Twelver Shiism (Q269785)."
  es: "Elemento de Wikidata Q467021 para Mozaffar ad-Din Shah Qajar: dos valores de nacimiento (23 de marzo de 1853, importado de la Wikipedia en inglés, y 25 de marzo de 1853, referenciado a la Enciclopedia del Islam de Brill), cuatro valores de muerte en enero de 1907 (el 3, 6, 9 y solo el mes), padre Naser al-Din Shah, entierro en el Mausoleo del Imam Husayn, y dos valores de religión sin referencia, Islam (Q432) y Chiismo duodecimano (Q269785)."
  fr: "L'élément Wikidata Q467021 pour Mozaffar ad-Din Shah Qajar: deux valeurs de naissance (23 mars 1853, importée de Wikipédia en anglais, et 25 mars 1853, référencée dans l'Encyclopédie de l'Islam de Brill), quatre valeurs de décès en janvier 1907 (le 3, le 6, le 9 et le mois seulement), père Naser al-Din Shah, inhumation au mausolée de l'Imam Husayn, et deux valeurs de religion non référencées, l'islam (Q432) et le chiisme duodécimain (Q269785)."
