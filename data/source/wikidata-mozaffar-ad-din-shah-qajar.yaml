  ar: "عنصر ويكيبيانات Q467021 لمظفر الدين شاه قاجار: قيمتان لميلاده (23 مارس 1853 مستوردًا من ويكيبيديا الإنجليزية، و25 مارس 1853 بمرجع موسوعة الإسلام لبريل)، وأربع قيم لوفاته في يناير 1907 (3 و6 و9 والشهر فقط)، وأبوه ناصر الدين شاه، ودفنه في مرقد الإمام الحسين، وقيمتان للديانة بلا مرجع: «الإسلام» (Q432) و«التشيع الاثنا عشري» (Q269785)."
  en: "Wikidata item Q467021 for Mozaffar ad-Din Shah Qajar: two birth values (23 March 1853, imported from the English Wikipedia, and 25 March 1853, referenced to Brill's Encyclopaedia of Islam), four death values in January 1907 (the 3rd, 6th, 9th and the month only), father Naser al-Din Shah, burial at the Imam Husayn Mausoleum, and two unreferenced religion values, Islam (Q432) and Twelver Shiism (Q269785)."
