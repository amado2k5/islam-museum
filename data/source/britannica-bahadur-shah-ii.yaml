summary:
  ar: "مادة في موسوعة بريطانيكا عن آخر الأباطرة المغول، تذكر أنه حكم 1837–1857، وأن البريطانيين استعادوا دلهي في سبتمبر 1857، وأنه اعتُقل في نهاية الشهر ونُفي إلى رانغون، وتوفي هناك في 7 نوفمبر 1862."
  en: "An entry in the Encyclopaedia Britannica on the last Mughal emperor. It states that he ruled 1837–1857, that the British retook Delhi in September 1857, that he was arrested at the end of that month and exiled to Rangoon, and that he died there on 7 November 1862."
