summary:
  ar: "مادة في موسوعة بريطانيكا عن آخر الأباطرة المغول، تذكر أنه حكم 1837–1857، وأن البريطانيين استعادوا دلهي في سبتمبر 1857، وأنه اعتُقل في نهاية الشهر ونُفي إلى رانغون، وتوفي هناك في 7 نوفمبر 1862."
