summary:
  ar: "مادة في موسوعة بريطانيكا عن آخر الأباطرة المغول، تذكر أنه حكم 1837–1857، وأن البريطانيين استعادوا دلهي في سبتمبر 1857، وأنه اعتُقل في نهاية الشهر ونُفي إلى رانغون، وتوفي هناك في 7 نوفمبر 1862."
  en: "An entry in the Encyclopaedia Britannica on the last Mughal emperor. It states that he ruled 1837–1857, that the British retook Delhi in September 1857, that he was arrested at the end of that month and exiled to Rangoon, and that he died there on 7 November 1862."
  es: "Entrada de la Enciclopedia Británica sobre el último emperador mogol. Indica que gobernó entre 1837 y 1857, que los británicos reconquistaron Delhi en septiembre de 1857, que fue arrestado a finales de ese mes y exiliado a Rangún, y que murió allí el 7 de noviembre de 1862."
  fr: "Un article de l'Encyclopædia Britannica consacré au dernier empereur moghol indique qu'il régna de 1837 à 1857, que les Britanniques reprirent Delhi en septembre 1857, qu'il fut arrêté à la fin du même mois et exilé à Rangoun, où il mourut le 7 novembre 1862."
  ur: "انسائیکلوپیڈیا برٹانیکا میں آخری مغل بادشاہ پر ایک اندراج۔ اس میں کہا گیا ہے کہ اس نے 1837-1857 تک حکومت کی، کہ ستمبر 1857 میں انگریزوں نے دہلی پر دوبارہ قبضہ کر لیا، کہ اس مہینے کے آخر میں اسے گرفتار کر کے رنگون جلاوطن کر دیا گیا، اور وہیں 7 نومبر 1862 کو انتقال کر گئے۔"
