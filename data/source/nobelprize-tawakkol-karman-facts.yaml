  ar: "صفحة وقائع جائزة نوبل عن توكل كرمان: وُلدت في تعز سنة 1979، ونالت جائزة نوبل للسلام سنة 2011 مع إلين جونسون سيرليف وليما غبوي لنضالهن السلمي من أجل سلامة النساء وحقوقهن."
  en: "Nobel Prize facts page for Tawakkol Karman: born in Ta'izz in 1979; Nobel Peace Prize 2011, shared with Ellen Johnson Sirleaf and Leymah Gbowee, for their non-violent struggle for the safety of women and for women's rights."
  es: "Página con datos sobre Tawakkol Karman y el Premio Nobel: nació en Ta'izz en 1979; Premio Nobel de la Paz 2011, compartido con Ellen Johnson Sirleaf y Leymah Gbowee, por su lucha no violenta por la seguridad de las mujeres y por los derechos de las mujeres."
  fr: "Page d'informations sur le prix Nobel de Tawakkol Karman: née à Ta'izz en 1979; prix Nobel de la paix 2011, partagé avec Ellen Johnson Sirleaf et Leymah Gbowee, pour leur lutte non violente pour la sécurité des femmes et pour les droits des femmes."
  ur: "توکل کرمان کے لیے نوبل انعام کے حقائق کا صفحہ: 1979 میں تائیز میں پیدا ہوئے۔ نوبل امن انعام 2011، ایلن جانسن سرلیف اور لیمہ گوبی کے ساتھ، خواتین کے تحفظ اور خواتین کے حقوق کے لیے ان کی عدم تشدد کی جدوجہد کے لیے۔"
