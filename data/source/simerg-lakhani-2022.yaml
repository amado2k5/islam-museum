reliability_note: "Read in full on 26 October 2026. Simerg, an Ismaili community publication, profiles Lakhani in a series dedicated to Ismaili leaders of distinction; its biographical sketch (compiled from Government of Alberta materials) calls her “a proud Ismaili Muslim” and her parents “active members of the Ismaili community”. The community’s own recognition of her as one of its leaders is an attestation independent of her office’s biography."
