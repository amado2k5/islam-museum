summary:
  ar: "ملف عن سلمى لاخاني نشرته مجلة «سيمرغ» في 7 فبراير 2022 ضمن سلسلتها «الاحتفاء بالقادة الإسماعيليين»، يصفها بأنها «مسلمة إسماعيلية فخورة» ووالديها بأنهما عضوان ناشطان في الجماعة الإسماعيلية."
  en: "Profile of Salma Lakhani published by Simerg on 7 February 2022 in its “Celebrating Ismaili Leaders” series, describing her as “a proud Ismaili Muslim” and her parents as active members of the Ismaili community."
  es: "El perfil de Salma Lakhani fue publicado por Simerg el 7 de febrero de 2022 en su serie \"Celebrando a los líderes ismaelitas\", donde se la describe como \"una orgullosa musulmana ismaelita\" y a sus padres como miembros activos de la comunidad ismaelita."
  fr: "Profil de Salma Lakhani publié par Simerg le 7 février 2022 dans sa série « Célébration des leaders ismaéliens », la décrivant comme « une fière musulmane ismaélienne » et ses parents comme des membres actifs de la communauté ismaélienne."
  ur: "سلمیٰ لاکھانی کا پروفائل سمرگ نے 7 فروری 2022 کو اپنی \"سیلیبریٹنگ اسماعیلی لیڈرز\" سیریز میں شائع کیا، جس میں انہیں \"ایک قابل فخر اسماعیلی مسلمان\" اور اس کے والدین کو اسماعیلی کمیونٹی کے فعال اراکین کے طور پر بیان کیا گیا۔"
  tr: "Salma Lakhani hakkında 7 Şubat 2022'de Simorgh dergisi tarafından \"İsmaili Liderleri Kutlamak\" serisinin bir parçası olarak yayımlanan bir dosya, onu \"gururlu bir İsmaili Müslüman\" olarak tanımlıyor ve ebeveynleri İsmaili topluluğunun aktif üyeleri olarak tanımlanıyor."
  id: "Sebuah berkas tentang Salma Lakhani yang diterbitkan oleh majalah Simorgh pada 7 Februari 2022, sebagai bagian dari seri \"Merayakan Pemimpin Ismaili,\" yang menggambarkannya sebagai \"Muslim Ismaili yang bangga\" dan orang tuanya sebagai anggota aktif komunitas Ismaili."
title: "Celebrating Ismaili Leaders: Salma Lakhani’s Inspiring Journey"
