reliability_note: "Live article version retrieved in-session via the MediaWiki API on 1 November 2026; the publisher field carries the exact revision ID it was read at. It names her mother as Jawaher bint Mohammed Al Qasimi — the same mother the father's English article gives for Bodour — supporting the sibling relation recorded in Bodour's record. Its Royal Academy dates differ slightly from the English article's (a master's in painting in 2004 against postgraduate studies completed in 2005); the English article's account is followed in the prose. It names no religion or school for her."
