reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Covers his birth at Thieytou on 29 December 1923 into an aristocratic Muslim Wolof family of the Mouride brotherhood and his traditional Islamic schooling, his Paris studies from 1946 (philosophy licence 1948, chemistry diplomas 1950, doctorate 1960), his work in nuclear physics at the Collège de France laboratories, his theses on the African origin of Egyptian civilisation, Nations nègres et culture (1954), his role on the UNESCO International Scientific Committee for the General History of Africa and the 1974 Cairo symposium, the university in Dakar named after him, and his death on 7 February 1986. The long reception section, favourable and hostile, is used only attributed; the article names no school of Islam for Diop himself. Read in full on 24 October 2026."
