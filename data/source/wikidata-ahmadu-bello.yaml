  id: "Elemen Wikidata Q401032 oleh Ahmadu Bello: Ia menyebutkan kelahirannya pada 12 Juni 1910 di Raba (dengan nilai lain pada tahun 1909) dan kematiannya pada 15 Januari 1966 di Kaduna, dengan nilai agamanya hanya sebagai Islam, tanpa sekte apapun."
