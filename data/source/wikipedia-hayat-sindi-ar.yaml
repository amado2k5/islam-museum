summary:
  ar: "مقالة ويكيبيديا العربية عن حياة سليمان سندي ⁦(6 تشرين الثاني 1967)⁩، عالمة وباحثة سعودية وعضوة مجلس الشورى وصاحبة مشروع «التشخيص للجميع»؛ تعرض دراستها في كامبردج وهارفارد وجوائزها ومناصبها، ولا تنسب إليها مذهبًا فقهيًا."
  en: "Arabic Wikipedia article on Hayat Sulaiman Sindi (6 November 1967), the Saudi scientist and researcher, Consultative Assembly member and founder of the 'Diagnostics for All' project; it covers her studies at Cambridge and Harvard, her awards and posts, and names no legal school for her."
  es: "Artículo en árabe de la Wikipedia sobre Hayat Sulaiman Sindi (6 de noviembre de 1967), científica e investigadora saudí, miembro de la Asamblea Consultiva y fundadora del proyecto \"Diagnóstico para todos\"; abarca sus estudios en Cambridge y Harvard, sus premios y cargos, y no menciona ninguna facultad de derecho a la que haya asistido."
  fr: "Article de Wikipédia en arabe sur Hayat Sulaiman Sindi (6 novembre 1967), la scientifique et chercheuse saoudienne, membre de l'Assemblée consultative et fondatrice du projet « Diagnostic pour tous »; il couvre ses études à Cambridge et Harvard, ses prix et ses postes, et ne mentionne aucune école de droit pour elle."
  ur: "حیات سلیمان سندھی ⁦(6 نومبر 1967)⁩ پر عربی ویکیپیڈیا کا مضمون، سعودی سائنسدان اور محقق، کنسلٹیٹو اسمبلی کے رکن اور 'تشخیص برائے سب' منصوبے کے بانی؛ اس میں کیمبرج اور ہارورڈ میں اس کی پڑھائی، اس کے ایوارڈز اور پوسٹس، اور اس کے لیے کسی قانونی اسکول کا نام نہیں لیا گیا ہے۔"
