summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن خزان أُميّة؛ لوقائع الكيان فقط: نظام قسطار بطيني داخل البطين يتيح سحب السائل الدماغي الشوكي أو إيصال الأدوية ⁦(كالعلاج الكيميائي)⁩ إليه، يتكون من قسطار في أحد البطينين الجانبيين موصول بخزان مزروع تحت فروة الرأس، يعالج أورام الدماغ وابيضاض الدم/اللمفومة وداء السحايا الرقيقة بإعطاء الدواء داخل القراب، ويُستخدم في الرعاية التلطيفية لحقن المورفين داخل البطينات، وقد اخترعه أيوب خان أُميّة الجراح الباكستاني-الأمريكي عام 1963، واستعمله باحثو جامعة تكساس ساوثويسترن في يناير 2017 لقياس الضغط داخل القحف عند رواد الفضاء."
  en: "English Wikipedia article on the Ommaya reservoir; entity facts only: an intraventricular catheter system for aspirating cerebrospinal fluid or delivering drugs ⁦(e.g. chemotherapy)⁩ into it, a catheter in one lateral ventricle attached to a reservoir implanted under the scalp, used against brain tumors, leukemia/lymphoma and leptomeningeal disease by intrathecal administration and in palliative care for intracerebroventricular morphine; invented in 1963 by the Pakistani-American neurosurgeon Ayub K. Ommaya; used by UT Southwestern researchers in January 2017 to measure astronauts' intracranial pressure."
  es: "Artículo de la Wikipedia en inglés sobre el reservorio de Ommaya; solo datos sobre la entidad: un sistema de catéter intraventricular para aspirar líquido cefalorraquídeo o administrarle fármacos (por ejemplo, quimioterapia), un catéter en un ventrículo lateral conectado a un reservorio implantado bajo el cuero cabelludo, utilizado contra tumores cerebrales, leucemia/linfoma y enfermedad leptomeníngea mediante administración intratecal y en cuidados paliativos para morfina intracerebroventricular; inventado en 1963 por el neurocirujano pakistaní-estadounidense Ayub K. Ommaya; utilizado por investigadores de UT Southwestern en enero de 2017 para medir la presión intracraneal de los astronautas."
  fr: "Article de Wikipédia en anglais sur le réservoir d'Ommaya; informations sur l'entité uniquement: système de cathéter intraventriculaire permettant d'aspirer le liquide céphalo-rachidien ou d'y administrer des médicaments (par exemple, une chimiothérapie), un cathéter placé dans un ventricule latéral relié à un réservoir implanté sous le cuir chevelu, utilisé contre les tumeurs cérébrales, la leucémie/le lymphome et les maladies leptoméningées par administration intrathécale et en soins palliatifs pour la morphine intracérébroventriculaire; inventé en 1963 par le neurochirurgien pakistano-américain Ayub K. Ommaya; utilisé par des chercheurs de l'UT Southwestern en janvier 2017 pour mesurer la pression intracrânienne des astronautes."
