  en: "Al-Hujwiri, Kashf al-Mahjub, vol. 1, Arabic translation, study and notes by Is'ad 'Abd al-Hadi Qandil, revised and introduced by Badi' Jum'a (Supreme Council for Culture, National Translation Project, Cairo, 2007)"
  ur: "ہجویری، کشف المحجوب، جلد اول، عربی ترجمہ، مطالعہ و تعلیق اسعاد عبد الہادی قندیل، نظرِ ثانی و تقدیم بدیع جمعہ (المجلس الاعلیٰ للثقافۃ، قومی منصوبۂ ترجمہ، قاہرہ 2007)"
summary:
  ar: "الجزء الأول من الترجمة العربية لكشف المحجوب عن الفارسية ⁦(العدد 1042 من سلسلة ميراث الترجمة)⁩، بدراسة مطولة للمترجمة في عصر الهجويري وسيرته وكتابه، ثم الترجمة من المقدمة إلى الباب الثالث عشر في رجال الصوفية المتأخرين."
  en: "Volume one of the Arabic translation of Kashf al-Mahjub from the Persian (no. 1042 in the Translation Heritage series), with the translator's long study of al-Hujwiri's age, life and book, followed by the translation from the preface to chapter thirteen on the later Sufi masters."
  ur: "کشف المحجوب کے فارسی سے عربی ترجمے کی پہلی جلد (سلسلۂ میراث الترجمہ کا شمارہ 1042)، مترجمہ کے ہجویری کے زمانے، سیرت اور کتاب پر طویل مطالعے کے ساتھ، پھر مقدمے سے تیرھویں باب (متاخر صوفی رجال) تک کا ترجمہ۔"
