reliability_note: "The repository states no licence, so nothing but the titles of the books is taken from it: they are the collections' own headings, and a heading is a fact about the work. The titles were matched to the division of the hadith-api dataset by the English name of each book, and all 335 matched. The repository says its data was gathered from Sunnah.com; the titles were not checked against a printed edition. Read on 15 November 2026."
