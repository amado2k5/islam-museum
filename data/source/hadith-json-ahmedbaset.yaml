summary:
  ar: "مستودع على GitHub ينشر سبعة عشر كتابا من كتب الحديث، منها الكتب التسعة، في ملفات JSON بالعربية والإنجليزية، ومع كل كتاب قائمة بعناوين كتبه الداخلية بالعربية والإنجليزية. أخذ المتحف منه العناوين العربية لكتب الصحيحين والسنن الأربع فقط، ولم يأخذ منه نصا."
  en: "A GitHub repository that publishes seventeen hadith collections, the nine books among them, as JSON files in Arabic and English, each with a list of its internal books by Arabic and English title. The museum took from it only the Arabic titles of the books of the two Sahihs and the four Sunan, and no text."
  ur: "گٹ ہب کا ایک ذخیرہ جو حدیث کی سترہ کتابیں، جن میں کتبِ تسعہ شامل ہیں، عربی اور انگریزی میں JSON فائلوں کی صورت میں شائع کرتا ہے، اور ہر کتاب کے ساتھ اس کی اندرونی کتابوں کے عربی اور انگریزی عنوانات کی فہرست دیتا ہے۔ میوزیم نے اس سے صرف صحیحین اور سننِ اربعہ کی کتابوں کے عربی عنوانات لیے ہیں، کوئی متن نہیں لیا۔"
  es: "Un repositorio de GitHub que publica diecisiete colecciones de hadices, entre ellas nueve libros, como archivos JSON en árabe e inglés, cada uno con una lista de sus libros internos por título en árabe e inglés. El museo solo tomó de él los títulos en árabe de los libros de los dos Sahihs y los cuatro Sunan, y ningún texto."
  fr: "Un dépôt GitHub publie dix-sept recueils de hadiths, dont les neuf livres, sous forme de fichiers JSON en arabe et en anglais, chacun contenant la liste de ses livres internes par titre arabe et anglais. Le musée n'a prélevé que les titres arabes des deux Sahihs et des quatre Sunan, sans en extraire le texte."
  tr: "GitHub'da, dokuz kitap da dahil olmak üzere on yedi hadis kitabını Arapça ve İngilizce JSON dosyalarında yayımlayan bir depo; her kitapta Arapça ve İngilizce dahili kitap başlıklarının listesi yer alıyor. Müze, müzeden yalnızca iki Sahih'in ve dört Sünan'ın Arapça başlıklarını aldı ve hiçbir metin almadı."
  id: "Sebuah repositori di GitHub yang menerbitkan tujuh belas buku hadits, termasuk sembilan buku, dalam file JSON dalam bahasa Arab dan Inggris, dengan setiap buku berisi daftar judul buku internalnya dalam bahasa Arab dan Inggris. Museum hanya mengambil judul Arab dari dua Sahih dan empat Sunan darinya, dan tidak mengambil teks apapun dari museum tersebut."
