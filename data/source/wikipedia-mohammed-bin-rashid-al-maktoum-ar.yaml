summary:
  ar: "مقالة ويكيبيديا العربية عن محمد بن راشد آل مكتوم؛ تُستخدم لوقائع الكيان فقط. سيرة مطولة: ولادته في الشندغة بدبي في 15 يوليو 1949، وتعليمه في دبي ولندن وكلية مونز العسكرية، ورئاسته لشرطة دبي ووزارة الدفاع، وولايته للعهد (1995)، ثم حكمه لدبي ورئاسته لمجلس الوزراء من 2006. ويذكر متنها أنه تلقى في طفولته مبادئ اللغة العربية وتعاليم الدين الإسلامي، وهو تكوين لا إثبات انتماء، ولا تسمي مدرسة له."
  en: "Arabic Wikipedia article on Mohammed bin Rashid Al Maktoum; used for entity facts only. A long biography: born at Al Shindagha in Dubai on 15 July 1949; educated in Dubai, London and at the Mons Officer Cadet School; head of Dubai Police and minister of defence; crown prince from 1995; ruler of Dubai and prime minister from 2006. Its text says he received the principles of Arabic and the teachings of Islam in childhood — formation, not an attestation — and names no school for him."
