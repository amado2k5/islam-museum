summary:
  ar: "طبعة دار المعارف بالقاهرة (1119 كورنيش النيل) من التفسير الوسيط للدكتور محمد سيد طنطاوي، مفتي جمهورية مصر العربية، في خمسة عشر مجلدًا من الفاتحة إلى الناس، بمراجعة الدكتور عبد الرحمن العدوي؛ ويحمل غلاف المجلد الأول تاريخ 1412هـ / 1992م. النسخة المستعملة ملف واحد مجمّع يضم المجلدات الخمسة عشر متتالية."
  en: "The Dar al-Ma'arif (Cairo, 1119 Corniche al-Nil) printing of Dr Muhammad Sayyid Tantawi's al-Tafsir al-Wasit, issued while he was Grand Mufti of Egypt, in fifteen volumes from al-Fatiha to al-Nas, revised by Dr Abd al-Rahman al-Adawi; the title page of volume 1 is dated 1412 AH / 1992 CE. The copy used is one combined file holding the fifteen volumes in sequence."
  ur: "دار المعارف قاہرہ (1119 کورنیش النیل) کی طبع کردہ ڈاکٹر محمد سید طنطاوی کی التفسیر الوسیط، جو انہوں نے مفتیِ مصر کی حیثیت سے شائع کی، پندرہ جلدوں میں سورۂ فاتحہ سے سورۂ ناس تک، ڈاکٹر عبد الرحمن العدوی کی نظرِ ثانی کے ساتھ؛ پہلی جلد کے سرورق پر 1412ھ / 1992ء درج ہے۔ استعمال شدہ نسخہ ایک مجموعی فائل ہے جس میں پندرہ جلدیں پے در پے ہیں۔"
