summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ألبوم «اُس راہ پر» لجنيد جمشيد (1999)؛ لوقائع الكيان فقط: ثاني ألبوماته المنفردة بعد توقف فرقة فايتل ساينز، وتعاونه مع شعيب منصور، ومصوّر الأغنية الرئيسة، وثلاث أغان لبيدو، وقائمة الأغاني؛ تستند إلى دون وذا فرايداي تايمز وذا إكسبرس تريبيون."
  en: "English Wikipedia article on Junaid Jamshed's album Us Rah Par (1999); entity facts only: his second solo album after Vital Signs paused, his work with Shoaib Mansoor, the title song's video, three songs by Biddu, and the track list; it cites Dawn, The Friday Times and The Express Tribune."
  es: "Artículo de la Wikipedia en inglés sobre el álbum Us Rah Par (1999) de Junaid Jamshed; solo datos sobre la entidad: su segundo álbum en solitario después de la pausa de Vital Signs, su trabajo con Shoaib Mansoor, el vídeo de la canción principal, tres canciones de Biddu y la lista de canciones; cita a Dawn, The Friday Times y The Express Tribune."
  fr: "Article de Wikipédia en anglais sur l'album Us Rah Par (1999) de Junaid Jamshed; informations sur l'entité uniquement: son deuxième album solo après la pause de Vital Signs, son travail avec Shoaib Mansoor, le clip de la chanson titre, trois chansons de Biddu et la liste des titres; il cite Dawn, The Friday Times et The Express Tribune."
  ur: "جنید جمشید کے البم ہم راہ پر (1999) پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق: وائٹل سائنز کے توقف کے بعد ان کا دوسرا سولو البم، شعیب منصور کے ساتھ ان کا کام، ٹائٹل گانے کی ویڈیو، بیڈو کے تین گانے، اور ٹریک لسٹ؛ اس نے ڈان، دی فرائیڈے ٹائمز اور دی ایکسپریس ٹریبیون کا حوالہ دیا ہے۔"
  tr: "Junaid Jamshed'in 'As Rah Par' albümü hakkında İngilizce Wikipedia makalesi (1999); sadece bu varlık için: Vital Signs ara verdikten sonraki ikinci solo albümü, baş şarkı fotoğrafçısı Shoaib Mansour ile iş birliği, üç Lepido şarkısı ve çalma listesi; Don, The Friday Times ve The Express Tribune temelinde."
  id: "Artikel Wikipedia bahasa Inggris tentang album 'As Rah Par' oleh Junaid Jamshed (1999); hanya untuk entitas ini: album solo keduanya setelah Vital Signs hiatus, kolaborasinya dengan Shoaib Mansour, fotografer lagu utama, tiga lagu Lepido, dan playlist-nya; berdasarkan Don, The Friday Times, dan The Express Tribune."
