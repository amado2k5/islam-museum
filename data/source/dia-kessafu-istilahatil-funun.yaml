summary:
  ar: "مدخل «موسوعة الإسلام» لمؤسسة الشؤون الدينية التركية TDV عن كشاف اصطلاحات الفنون والعلوم، اطُّلع عليه في ٢٠ نوفمبر ٢٠٢٦؛ يُستخدم لوقائع الكيان: اسم المؤلف وأصله وعقيدته ومذهبه وإعداده الكتاب."
  en: "The TDV İslâm Ansiklopedisi entry on Kashshaf Istilahat al-Funun wa-l-Ulum (online edition), read on 20 November 2026; used for entity facts: the author's name, origin, creed and school, and how he prepared the work."
  es: "Entrada de la TDV İslâm Ansiklopedisi sobre Kashshaf Istilahat al-Funun wa-l-Ulum (edición en línea), consultada el 20 de noviembre de 2026; utilizada para datos de la entidad: el nombre del autor, su origen, credo y escuela, y cómo preparó la obra."
  fr: "Article de la TDV İslâm Ansiklopedisi sur Kashshaf Istilahat al-Funun wa-l-Ulum (édition en ligne), consulté le 20 novembre 2026 ; utilisé pour les données de l'entité : le nom de l'auteur, son origine, son credo et son école, et sa préparation de l'ouvrage."
  ur: "TDV İslâm Ansiklopedisi ⁦(آن لائن ایڈیشن)⁩ میں Kashshaf Istilahat al-Funun wa-l-Ulum پر اندراج، 20 نومبر 2026 کو پڑھا؛ ہستی کے حقائق کے لیے استعمال: مصنف کا نام، نسب، عقیدہ، مسلک اور کتاب کی تیاری."
  tr: "Türk Dini İşler Vakfı (TDV) tarafından \"İslam Ansiklopedisi\"ne Sanat ve Bilim Terminolojisi Dizini hakkında 20 Kasım 2026 tarihinde erişilmiştir; varlığın olguları için kullanılmıştır: yazarın adı, kökeni, inanç, doktrin ve kitap hazırlığı."
  id: "Entri ke \"Ensiklopedia Islam\" oleh Yayasan Urusan Agama Turki (TDV) tentang Indeks Terminologi Seni dan Sains, diakses pada 20 November 2026; digunakan untuk fakta entitas: nama penulis, asal-usul, kepercayaan, doktrin, dan persiapan buku."
