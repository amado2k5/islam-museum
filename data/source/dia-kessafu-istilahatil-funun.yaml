reliability_note: "Read in the museum's session on 20 November 2026. It gives the author's full name as Muhammad A'la ibn Ali ibn Muhammad Hamid ibn Muhammad Sabir al-Umari al-Faruqi al-Thanawi, born at Thana about 170 km north-west of Delhi; reads his nisbas as descent from Umar, Sunni (ahl al-sunna) in creed and Hanafi in practice; says he served as judge at Thana towards the end of Aurangzeb's reign (1658-1707), learned Arabic and the religious sciences from his father and then taught himself logic, philosophy, medicine, astronomy and mathematics from the books he collected; and that he set out to collect the terms of all the sciences in one book. Used for entity facts only; the creed and school statement carries this source."
