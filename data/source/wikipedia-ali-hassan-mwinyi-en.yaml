  ar: "مقالة ويكيبيديا الإنجليزية عن علي حسن مويني؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في كيفوري سنة 1925 وعمله معلما ورئاسته زنجبار ثم تنزانيا (1985–1995) وتحريره الاقتصادي وفتحه باب التعددية الحزبية وجائزة الملك فيصل لخدمة الإسلام سنة 2022 ووفاته في دار السلام سنة 2024. لا تسمي له مدرسة."
  en: "English Wikipedia article on Ali Hassan Mwinyi; used for entity facts only. It recounts his birth at Kivure in 1925, his years as a teacher, his presidencies of Zanzibar and then of Tanzania (1985–1995), his economic liberalisation, the opening to multi-party politics, the 2022 King Faisal Prize for Service to Islam, and his death at Dar es Salaam in 2024. It names no school for him."
