summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن علي حسن مويني؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في كيفوري سنة 1925 وعمله معلما ورئاسته زنجبار ثم تنزانيا (1985–1995) وتحريره الاقتصادي وفتحه باب التعددية الحزبية وجائزة الملك فيصل لخدمة الإسلام سنة 2022 ووفاته في دار السلام سنة 2024. لا تسمي له مدرسة."
  en: "English Wikipedia article on Ali Hassan Mwinyi; used for entity facts only. It recounts his birth at Kivure in 1925, his years as a teacher, his presidencies of Zanzibar and then of Tanzania (1985–1995), his economic liberalisation, the opening to multi-party politics, the 2022 King Faisal Prize for Service to Islam, and his death at Dar es Salaam in 2024. It names no school for him."
  es: "Artículo de la Wikipedia en inglés sobre Ali Hassan Mwinyi; utilizado únicamente para datos biográficos. Relata su nacimiento en Kivure en 1925, sus años como maestro, sus presidencias de Zanzíbar y luego de Tanzania (1985-1995), su liberalización económica, la apertura al multipartidismo, el Premio Rey Faisal de 2022 por su servicio al Islam y su fallecimiento en Dar es Salaam en 2024. No menciona ninguna escuela a la que pertenezca."
  fr: "Article de Wikipédia en anglais sur Ali Hassan Mwinyi; utilisé uniquement à des fins d’information sur l’entité. Il relate sa naissance à Kivure en 1925, ses années d’enseignement, ses présidences de Zanzibar puis de Tanzanie (1985-1995), la libéralisation économique, l’ouverture au multipartisme, le prix du roi Faisal pour services rendus à l’islam en 2022 et son décès à Dar es Salaam en 2024. Aucune école n’est mentionnée en son honneur."
  ur: "علی حسن میونی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1925 میں کیوور میں ان کی پیدائش، بطور استاد ان کے سال، زنجبار اور پھر تنزانیہ (1985-1995) کی صدارت، ان کی معاشی آزادی، کثیر الجماعتی سیاست کا آغاز، 2022 کا شاہ فیصل انعام برائے خدمت اسلام، اور دارالسلام میں ان کی موت کا ذکر ہے۔"
