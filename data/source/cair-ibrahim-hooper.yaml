  ar: "السيرة الرسمية لإبراهيم هوبر في موقع مجلس العلاقات الأمريكية الإسلامية (كير)؛ تذكر أنه مدير الاتصالات الوطني في المجلس منذ تأسيسه سنة 1994، وأنه حاصل على بكالوريوس في التاريخ وماجستير في الصحافة والاتصال الجماهيري، وأنه يظهر متحدثًا باسم المجلس. لا تذكر تاريخ ميلاد ولا مكان ولادة ولا مذهبًا."
  en: "CAIR's official staff biography of Ibrahim Hooper; it states he is CAIR's National Communications Director, has been with CAIR since its founding in 1994, holds a bachelor's degree in history and a master's in journalism and mass communication, and appears as CAIR's spokesman offering an Islamic perspective. It gives no birth date, no birthplace and no school."
