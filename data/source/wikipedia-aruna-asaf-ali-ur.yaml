summary:
  ar: "مقالة ويكيبيديا الأردية عن أرونا آصف علي؛ تُستخدم لوقائع الكيان فقط. تذكر ولادتها في كالكا في 16 تموز 1909 في أسرة بنغالية براهمية، وجدّها لأمها القائد البراهمي تريلوكياناث سانيال، وزواجها من آصف علي سنة 1928 رغم معارضة الأهل لأسباب الدين والعمر، ودورها في حركة «اتركوا الهند» وعموديتها لدلهي."
  en: "Urdu Wikipedia article on Aruna Asaf Ali; used for entity facts only. It gives her birth at Kalka on 16 July 1909 into a Bengali Brahmin family, her maternal grandfather the Brahmo leader Trailokyanath Sanyal, her 1928 marriage to Asaf Ali despite parental opposition on grounds of religion and age, her Quit India role and her Delhi mayorship."
  es: "Artículo de Wikipedia en urdu sobre Aruna Asaf Ali; utilizado únicamente para datos sobre la persona. Describe su nacimiento en Kalka el 16 de julio de 1909 en el seno de una familia brahmán bengalí, a su abuelo materno, el líder brahmo Trailokyanath Sanyal, su matrimonio en 1928 con Asaf Ali a pesar de la oposición de sus padres por motivos religiosos y de edad, su papel en el movimiento Quit India y su mandato como alcaldesa de Delhi."
  fr: "Article de Wikipédia en ourdou sur Aruna Asaf Ali; utilisé uniquement pour les informations la concernant. Il indique sa naissance à Kalka le 16 juillet 1909 dans une famille de brahmanes bengalis, son grand-père maternel, Trailokyanath Sanyal, leader du mouvement Brahmo, son mariage en 1928 avec Asaf Ali malgré l’opposition de ses parents pour des raisons religieuses et d’âge, son rôle dans le mouvement « Quit India » et son mandat de maire de Delhi."
  ur: "ارونا آصف علی پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس نے 16 جولائی 1909 کو کالکا میں ایک بنگالی برہمن خاندان میں جنم لیا، اس کے نانا برہمو رہنما تریلوکیا ناتھ سانیال، مذہب اور عمر کی بنیاد پر والدین کی مخالفت کے باوجود اس کی 1928 میں آصف علی سے شادی، اس کے ہندوستان چھوڑنے کے کردار اور دہلی کی میئر شپ۔"
  tr: "Aruna Asif Ali hakkında Urduca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 16 Temmuz 1909'da Kalka'da Bengal Brahmi bir ailede doğduğu ve annesinin babası Brahmi lideri Trilokyanath Sanyal'ın 1928'de Asif Ali ile evlendiği anılmaktadır; ailesinin dini ve yaş nedenleriyle, 'Hindistan'dan Çık' hareketindeki rolü ve Delhi'deki liderliği nedeniyle bu hareketin muhalefetine rağmen."
  id: "Artikel Wikipedia Urdu tentang Aruna Asif Ali; digunakan hanya untuk fakta entitas. Ia dikenang lahir di Kalka pada 16 Juli 1909, dalam keluarga Brahmi Bengali, kakek dari pihak ibu adalah pemimpin Brahmi Trilokyanath Sanyal, dan pernikahannya dengan Asif Ali pada tahun 1928 meskipun mendapat penolakan dari orang tuanya karena alasan agama dan usia, perannya dalam gerakan 'Quit India' dan kepemimpinannya di Delhi."
