  ar: "مقالة ويكيبيديا الأردية عن أرونا آصف علي؛ تُستخدم لوقائع الكيان فقط. تذكر ولادتها في كالكا في 16 تموز 1909 في أسرة بنغالية براهمية، وجدّها لأمها القائد البراهمي تريلوكياناث سانيال، وزواجها من آصف علي سنة 1928 رغم معارضة الأهل لأسباب الدين والعمر، ودورها في حركة «اتركوا الهند» وعموديتها لدلهي."
  en: "Urdu Wikipedia article on Aruna Asaf Ali; used for entity facts only. It gives her birth at Kalka on 16 July 1909 into a Bengali Brahmin family, her maternal grandfather the Brahmo leader Trailokyanath Sanyal, her 1928 marriage to Asaf Ali despite parental opposition on grounds of religion and age, her Quit India role and her Delhi mayorship."
