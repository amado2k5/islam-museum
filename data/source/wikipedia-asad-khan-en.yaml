reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). A medium article resting on Satish Chandra's Parties and Politics at the Mughal Court, William Irvine's Later Mughals and Munis Faruqui's Princes of the Mughal Empire. It gives his birth as circa 1626 (Chandra) or circa 1631 (Irvine) — both readings built in the person record — his Safavid family and his father Zulfiqar Khan Qaramanlu's migration to India, his service from 1654, his wazirate of 1676–1707, the Jinji episode and the arrest of Kam Bakhsh, his Vakil-i-Mutlaq years, the Gujarat governorship held in absentia, the handing over of Jahandar Shah, his son Zulfiqar Khan's killing and his own death on 15 June 1716. It names no faith for him in its text. Checked 1 November 2026."
