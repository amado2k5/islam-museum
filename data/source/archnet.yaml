  ar: "أرشنت ⁦(المعهد الثقافي الآغا خان بالتعاون مع معهد MIT للدراسات الإسلامية)⁩"
  en: "Archnet (Aga Khan Trust for Culture / MIT Aga Khan Documentation Center)"
