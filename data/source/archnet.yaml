reliability_note: "A peer-reviewed, institutionally maintained open database of Islamic-architecture sites, monuments and scholars; strong for building dates, architects and site types — the single largest corroborating source for the building backlog. Cite as {cite:archnet site/1000} or {cite:archnet authority/<id>} (the record resolves under archnet.org/sites/ or /authorities/). Facts-only posture permanently: the site's Terms of Use place material under CC BY-NC 4.0 for instructional, nonprofit and personal use, so record text and images are never republished and no bulk harvest runs. Access note: the live site returned HTTP 429 (Vercel security checkpoint) to the harvest fetcher on 8 November 2026; Wayback Machine snapshots serve full server-rendered records and robots.txt (archived) carries no disallow rules. Assessment: web-sources lane, 8 Nov 2026; decision dec-20261108-205 (supersedes engine false-positive dec-20261108-199)."
