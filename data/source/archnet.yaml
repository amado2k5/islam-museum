summary:
  ar: "مورد مفتوح يوثّق العمارة والبيئة المبنية للحضارات الإسلامية — المساجد والمدارس والقصور والأسوار والمقامات — مع ملفات للمواقع والشخصيات والجهات، وأنشئ عام ٢٠٠٢ بمشروع مشترك بين مؤسسة الآغا خان الثقافية ومركز توثيق الآغا خان في معهد ماساتشوستس للتكنولوجيا."
  en: "An open resource on the architecture and built environment of Muslim societies, begun in 2002 as a joint project of the Aga Khan Trust for Culture and the Aga Khan Documentation Center at MIT, holding about 9,000 site records, 6,000 authority names and more than 120,000 images, publications, videos and teaching tools."
  ur: "An open resource on the architecture and built environment of Muslim societies, begun in 2002 as a joint project of the Aga Khan Trust for Culture and the Aga Khan Documentation Center at MIT, holding about 9,000 site records, 6,000 authority names and more than 120,000 images, publications, videos and teaching tools."
