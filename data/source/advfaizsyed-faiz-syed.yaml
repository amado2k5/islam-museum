reliability_note: "His own official website: a primary source for his self-presented biography, offices and channel figures, not independent corroboration. Read in full on 5 November 2026. It states he was born on 12 December 1979 in Aurangabad, Maharashtra, to Azam Ali Syed and Aliya Fatima; lists his degrees (including B.Sc. Computers, LL.B, M.C.A and M.A Islamic Studies); names him Founder & President of the Islamic Research Centre Education & Welfare Trust and President of the Al Kitab Education & Welfare Society; and gives IRC TV at 4.23 million subscribers with 33,000+ videos and 1.05 billion views, with the site's own note that the channel figures reflect publicly available statistics as of September 2026. Its lecture totals (2,000+ lectures, 200+ cities, 950+ topics, 45,000+ short videos) are his own counts and are reported as such."
