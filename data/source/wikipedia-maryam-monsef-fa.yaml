summary:
  ar: مقالة ويكيبيديا الفارسية عن مريم منصف؛ تُستخدم لوقائع الكيان فقط. يعطي صندوق معلوماتها ديانتها «الإسلام» مستندًا إلى قائمة «مسلم لينك» للنواب المسلمين، ويصف والديها بأنهما من الهزارة.
  en: Persian Wikipedia article on Maryam Monsef; used for entity facts only. Its infobox gives her religion as 'Islam', citing a Muslim Link list of Muslim MPs, and describes her parents as Hazara.
  es: "Artículo de Wikipedia en persa sobre Maryam Monsef; utilizado únicamente para obtener información sobre la persona. Su ficha informativa indica que su religión es el islam, citando una lista de diputados musulmanes de Muslim Link, y describe a sus padres como hazaras."
  fr: "Article Wikipédia en persan sur Maryam Monsef; utilisé uniquement pour les informations sur l’entité. Son infobox indique que sa religion est l’islam, citant une liste de députés musulmans de Muslim Link, et décrit ses parents comme hazaras."
  ur: "مریم منصف پر فارسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا معلوماتی باکس اس کا مذہب 'اسلام' کے طور پر دیتا ہے، مسلم ممبران پارلیمنٹ کی ایک مسلم لنک فہرست کا حوالہ دیتے ہوئے، اور اس کے والدین کو ہزارہ بتاتا ہے۔"
  tr: "Maryam Monsef hakkında Farsça Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Bilgi kutusunda, \"Muslim Link\" Müslüman milletvekilleri listesine dayanarak dinini \"İslam\" olarak verir ve ebeveynlerini Hazara olarak tanımlar."
  id: "Artikel Wikipedia Persia tentang Maryam Monsef; digunakan hanya untuk fakta entitas. Infobox-nya menyebutkan agamanya \"Islam\" berdasarkan daftar \"Muslim Link\" deputi Muslim, dan menggambarkan orang tuanya sebagai Hazara."
