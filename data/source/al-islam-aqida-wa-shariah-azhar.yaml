  en: Islam, Creed and Law — Mahmud Shaltut
summary:
  ar: "كتاب الإمام محمود شلتوت ⁦(شيخ الأزهر الأسبق)⁩ عن الإسلام بوصفه عقيدة وشريعة: مقدمة في ماهية الإسلام، والعقائد الأساسية، وطريق ثبوت العقيدة، والعبادات والمعاملات؛ قدّم له وعلّق عليه الدكتور محمد عمارة في طبعة مجمع البحوث الإسلامية ضمن سلسلته العلمية ⁦(1439هـ/2018م)⁩، 204 صفحات، إشراف الأمين العام للمجمع."
  en: "Mahmud Shaltut's book (former Grand Imam of al-Azhar) on Islam as creed and law: an introduction on what Islam is, the basic beliefs, how belief is established, and worship and dealings; with a study and notes by Muhammad Imara, in the Islamic Research Academy's Scientific Series (1439 AH / 2018 CE), 204 pages, supervised by the Academy's Secretary-General."
  es: "El libro de Mahmud Shaltut (antiguo Gran Imán de al-Azhar) sobre el Islam como credo y ley: una introducción sobre qué es el Islam, las creencias básicas, cómo se establece la creencia, el culto y las relaciones; con un estudio y notas de Muhammad Imara, en la Serie Científica de la Academia de Investigación Islámica (1439 AH / 2018 CE), 204 páginas, supervisado por el Secretario General de la Academia."
  fr: "Le livre de Mahmud Shaltut (ancien Grand Imam d'al-Azhar) sur l'Islam en tant que croyance et loi: une introduction sur ce qu'est l'Islam, les croyances fondamentales, comment la croyance est établie, et le culte et les relations; avec une étude et des notes de Muhammad Imara, dans la série scientifique de l'Académie de recherche islamique (1439 AH / 2018 CE), 204 pages, supervisé par le secrétaire général de l'Académie."
  ur: "محمود شلتوت کی کتاب ⁦(سابق عظیم الشان امام الازہر)⁩ اسلام بطور عقیدہ اور قانون: اسلام کیا ہے، بنیادی عقائد، عقیدہ کیسے قائم ہوتا ہے، اور عبادات اور معاملات پر ایک تعارف؛ اسلامک ریسرچ اکیڈمی کی سائنسی سیریز ⁦(1439ھ / 2018 عیسوی)⁩ میں، 204 صفحات پر مشتمل، اکیڈمی کے سیکرٹری جنرل کی زیر نگرانی محمد امارہ کے مطالعہ اور نوٹ کے ساتھ۔"
