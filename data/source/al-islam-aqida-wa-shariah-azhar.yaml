  ar: "كتاب الإمام محمود شلتوت (شيخ الأزهر الأسبق) عن الإسلام بوصفه عقيدة وشريعة: مقدمة في ماهية الإسلام، والعقائد الأساسية، وطريق ثبوت العقيدة، والعبادات والمعاملات؛ قدّم له وعلّق عليه الدكتور محمد عمارة في طبعة مجمع البحوث الإسلامية ضمن سلسلته العلمية (1439هـ/2018م)، 204 صفحات، إشراف الأمين العام للمجمع."
