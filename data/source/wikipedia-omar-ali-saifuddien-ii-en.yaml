  ar: "مقالة ويكيبيديا الإنجليزية عن عمر علي سيف الدين الثاني؛ تُستخدم لوقائع الكيان فقط. تجعله السلطان الثالث والعشرين لبروناي (1828–1852)، ابن محمد جمال العالم الأول، وكان قاصرًا حين مات والده سنة 1804 وطالب بالعرش سنة 1825؛ ويعطي صندوقها خليفته عبد المؤمن ووفاته في 18 تشرين الثاني 1852 بسند إلى صحيفة سنغافورة الحرة ودينه الإسلام السنّي، ولا يعطي متنها تاريخ ميلاد ولا تسمّي مذهبًا في متنها."
  en: "English Wikipedia article on Omar Ali Saifuddin II; used for entity facts only. It gives him as the 23rd Sultan of Brunei (1828–1852), son of Muhammad Jamalul Alam I, a minor when his father died in 1804, who asserted his claim in 1825; its infobox names Abdul Momin as successor, gives his death on 18 November 1852 (cited to the Singapore Free Press) and his religion as Sunni Islam; its text gives no birth date and names no school."
