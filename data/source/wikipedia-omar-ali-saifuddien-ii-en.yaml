summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عمر علي سيف الدين الثاني؛ تُستخدم لوقائع الكيان فقط. تجعله السلطان الثالث والعشرين لبروناي (1828–1852)، ابن محمد جمال العالم الأول، وكان قاصرًا حين مات والده سنة 1804 وطالب بالعرش سنة 1825؛ ويعطي صندوقها خليفته عبد المؤمن ووفاته في 18 تشرين الثاني 1852 بسند إلى صحيفة سنغافورة الحرة ودينه الإسلام السنّي، ولا يعطي متنها تاريخ ميلاد ولا تسمّي مذهبًا في متنها."
  en: "English Wikipedia article on Omar Ali Saifuddin II; used for entity facts only. It gives him as the 23rd Sultan of Brunei (1828–1852), son of Muhammad Jamalul Alam I, a minor when his father died in 1804, who asserted his claim in 1825; its infobox names Abdul Momin as successor, gives his death on 18 November 1852 (cited to the Singapore Free Press) and his religion as Sunni Islam; its text gives no birth date and names no school."
  es: "Artículo de la Wikipedia en inglés sobre Omar Ali Saifuddin II; utilizado únicamente para datos sobre la persona. Lo describe como el 23.º sultán de Brunéi (1828-1852), hijo de Muhammad Jamalul Alam I, menor de edad cuando su padre falleció en 1804, quien reclamó el trono en 1825; su ficha informativa nombra a Abdul Momin como sucesor, indica su fallecimiento el 18 de noviembre de 1852 (citado por el Singapore Free Press) y su religión como el islam sunita; el texto no proporciona fecha de nacimiento ni menciona ninguna escuela."
  fr: "Article de Wikipédia en anglais sur Omar Ali Saifuddin II; utilisé uniquement pour les informations factuelles. Il le présente comme le 23e sultan de Brunei (1828-1852), fils de Muhammad Jamalul Alam Ier, mineur à la mort de son père en 1804, qui revendiqua le trône en 1825; son infobox mentionne Abdul Momin comme successeur, indique sa mort le 18 novembre 1852 (source: Singapore Free Press) et sa religion comme étant l’islam sunnite; son texte ne donne aucune date de naissance ni ne mentionne d’établissement scolaire."
  ur: "عمر علی سیف الدین II پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اسے برونائی کے 23ویں سلطان (1828-1852) کے طور پر دیتا ہے، محمد جمال العالم اول کا بیٹا، ایک نابالغ جب اس کے والد کا 1804 میں انتقال ہوا، جس نے 1825 میں اپنے دعوے پر زور دیا۔ اس کا معلوماتی باکس عبدالمومن کو جانشین کے طور پر نامزد کرتا ہے، اس کی موت 18 نومبر 1852 ⁦(سنگاپور فری پریس کے حوالے سے)⁩ اور اس کا مذہب سنی اسلام بتاتا ہے۔ اس کے متن میں کوئی تاریخ پیدائش نہیں ہے اور کوئی اسکول کا نام نہیں ہے۔"
  tr: "Omar Ali Saif al-Din II hakkındaki İngilizce Vikipedi makalesi yalnızca varlığın gerçekleri için kullanılmıştır. Kendisi, babası 1804'te öldüğünde reşit olmayan ve 1825'te tahta geçen Muhammed Cemal I'in oğlu olan Brunei'nin yirmi üçüncü Sultanı (1828–1852) olarak atanmıştır; bu fon ise 18 Kasım 1852'de ölen halefi Abdul Mu'min'e verilir ve dini Sünni İslam olan Singapur Özgür Gazetesi'ne bir sertifika verilmiştir. Metinde doğum tarihi veya herhangi bir mezhepin adı verilmemiştir."
  id: "Artikel Wikipedia bahasa Inggris tentang Omar Ali Saif al-Din II hanya digunakan untuk fakta entitas tersebut. Ia diangkat menjadi Sultan Brunei ke-23 (1828–1852), putra Muhammad Jamal yang Pertama, yang masih di bawah umur ketika ayahnya meninggal pada tahun 1804 dan mengklaim tahta pada tahun 1825; dana tersebut diberikan kepada penerusnya Abdul Mu'min, yang meninggal pada 18 November 1852, beserta sertifikat dari Singapore Free Newspaper, yang agamanya adalah Islam Sunni. Surat kabar ini tidak mencantumkan tanggal lahir atau menyebut sekte mana pun dalam teksnya."
