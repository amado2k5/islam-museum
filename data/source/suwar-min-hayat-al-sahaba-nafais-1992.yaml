summary:
  ar: "طبعة دار النفائس ببيروت، الطبعة الأولى 1412هـ/1992م، من «صور من حياة الصحابة» للدكتور عبد الرحمن رأفت الباشا، في سبعة «كتب» تضم سبعين صورة تقريباً لأصحاب النبي، مع حواشٍ لغوية وقوائم مصادر في آخر كل صورة وفهرس ألفبائي."
  en: "The Dar al-Nafa'is (Beirut) first edition, 1412/1992, of Dr Abd al-Rahman Ra'fat al-Basha's Suwar min Hayat al-Sahaba, in seven 'books' of about seventy portraits of the Prophet's Companions, with glosses on words, a list of sources at the end of each portrait and an alphabetical index."
