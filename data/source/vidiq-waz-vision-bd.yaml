reliability_note: "Platform statistics aggregator, not a museum-verified fact: the figure of 768,000 subscribers (about 127 million total views, 1,944 videos) was read from vidIQ on 8 November 2026 and is used only as a dated audience figure. The page records that the channel's country is set to the United States — a diaspora-operated Bengali waz channel; the country setting is a channel fact, not a verified place of residence for any person. Its catalogue is a waz aggregator's, carrying among others recordings of Allama Lutfur Rahman. No channel creation date was captured in this pass, so none is asserted. The page names no owner, head or operator for the channel. vidIQ's estimated earnings are modelled and are not used."
