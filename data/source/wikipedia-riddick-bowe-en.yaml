reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision, fetched by revision id and the returned revision asserted equal. The infobox gives his birth name, his birth on 10 August 1967 in New York City — the date citing a New York Times profile of 13 June 2009 — and his nickname Big Daddy; the text places his birth and upbringing in East New York, Brooklyn, records the 1988 Olympic silver medal, the 1992 undisputed title won from Evander Holyfield, his only defeat in their 1993 rematch, the 1995 WBO title and third Holyfield fight, the two 1996 Golota bouts, his 1998 kidnapping conviction and 17 months in federal prison, his 2013 Muay Thai debut loss in Pattaya, and his 2015 International Boxing Hall of Fame induction. The article's text and categories make no statement of his religion."
