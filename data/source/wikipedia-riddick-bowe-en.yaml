summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ريديك باو؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده باسم ريديك لامونت باو في 10 أغسطس 1967 في بروكلين بنيويورك، وفضيته الأولمبية سنة 1988، وبطولته المطلقة للوزن الثقيل سنة 1992، وسجله 43 فوزاً مقابل هزيمة واحدة، ونزاله الوحيد في المواي تاي سنة 2013. ولا تذكر ديانته في متنها ولا في تصنيفاتها."
  en: "English Wikipedia article on Riddick Bowe; used for entity facts only. It gives his birth as Riddick Lamont Bowe on 10 August 1967 in Brooklyn, New York, his 1988 Olympic silver medal, his 1992 undisputed heavyweight championship, his record of 43 wins against a single loss, and his single Muay Thai bout of 2013. It makes no statement of his religion in its text or categories."
  es: "Artículo de la Wikipedia en inglés sobre Riddick Bowe; utilizado únicamente para datos biográficos. Indica que nació como Riddick Lamont Bowe el 10 de agosto de 1967 en Brooklyn, Nueva York, su medalla de plata olímpica de 1988, su campeonato indiscutible de peso pesado de 1992, su récord de 43 victorias y una sola derrota, y su único combate de Muay Thai en 2013. No menciona su religión ni en el texto ni en las categorías."
  fr: "Article Wikipédia en anglais sur Riddick Bowe; utilisé uniquement pour les informations le concernant. Il mentionne sa naissance sous le nom de Riddick Lamont Bowe le 10 août 1967 à Brooklyn, New York, sa médaille d'argent aux Jeux olympiques de 1988, son titre de champion du monde incontesté des poids lourds en 1992, son palmarès de 43 victoires pour une seule défaite, et son unique combat de Muay Thai en 2013. Sa religion n'est pas abordée dans le texte ni dans les catégories."
  ur: "Riddick Bowe پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ان کی پیدائش 10 اگست 1967 کو بروکلین، نیو یارک میں رڈک لامونٹ بوے کے طور پر ہوئی، اس کا 1988 کا اولمپک چاندی کا تمغہ، اس کا 1992 کا غیر متنازعہ ہیوی ویٹ چیمپئن شپ، اس کا ایک ہی ہار کے خلاف 43 جیت کا ریکارڈ، اور 2013 کا اس کا واحد موئے تھائی مقابلہ۔"
  tr: "Riddick Baugh hakkında İngilizce Wikipedia makalesi; yalnızca varlık bilgileri için kullanılır. Doğumu 10 Ağustos 1967'de Brooklyn, New York'ta Riddick Lamont Baugh olarak, 1988 Olimpiyat gümüşü, 1992'de mutlak heatrik şampiyonluğu, 43 galibiyet ve bir mağlubiyetle rekoru ve 2013'teki tek Muay Thai maçı olarak verilmiştir. Dini metinde veya sınıflandırmalarda belirtilmemiştir."
  id: "Artikel Wikipedia bahasa Inggris tentang Riddick Baugh; digunakan hanya untuk fakta entitas. Kelahirannya disebutkan sebagai Riddick Lamont Baugh pada 10 Agustus 1967 di Brooklyn, New York, perak Olimpiade pada 1988, kejuaraan absolut heatrical pada 1992, rekor 43 kemenangan dan satu kekalahan, dan satu-satunya pertandingan Muay Thai pada 2013. Agamanya tidak disebutkan dalam teks maupun klasifikasinya."
