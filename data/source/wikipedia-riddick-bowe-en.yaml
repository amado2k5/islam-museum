  ar: "مقالة ويكيبيديا الإنجليزية عن ريديك باو؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده باسم ريديك لامونت باو في 10 أغسطس 1967 في بروكلين بنيويورك، وفضيته الأولمبية سنة 1988، وبطولته المطلقة للوزن الثقيل سنة 1992، وسجله 43 فوزاً مقابل هزيمة واحدة، ونزاله الوحيد في المواي تاي سنة 2013. ولا تذكر ديانته في متنها ولا في تصنيفاتها."
  en: "English Wikipedia article on Riddick Bowe; used for entity facts only. It gives his birth as Riddick Lamont Bowe on 10 August 1967 in Brooklyn, New York, his 1988 Olympic silver medal, his 1992 undisputed heavyweight championship, his record of 43 wins against a single loss, and his single Muay Thai bout of 2013. It makes no statement of his religion in its text or categories."
