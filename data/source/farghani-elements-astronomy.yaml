summary:
  en: "The 1669 Amsterdam edition of al-Farghani's treatise on the heavenly motions and the principles of astronomy, with the Arabic text and a Latin version printed together and the notes of Jacob Golius. This record covers the pages read in the first section (PDF pages 1 to 100): front matter, the Latin index of chapters and the Arabic text of chapters 8 to 30. The second section (PDF pages 101 to 200) adds the rest of chapter 7 and chapters 6 to 1 in Arabic, then the Latin text from page 133 through chapter 18 (page 200)."
  ar: "طبعة أمستردام سنة 1669 من كتاب الفرغاني في الحركات السماوية وأصول علم النجوم، مع النص العربي والترجمة اللاتينية وحواشي يعقوب غوليوس. يغطي هذا السجل الصفحات 1 إلى 100 من الملف (التصدير والفهرس ونص الفصول من الثامن إلى الثلاثين). ويغطي القسم الثاني الصفحات 101 إلى 200: بقية الفصل السابع والفصول من السادس إلى الأول في النص العربي، ثم النص اللاتيني من الصفحة 133 حتى الفصل الثامن عشر (ص 200)."
