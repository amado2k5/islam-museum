label: { en: "al-Farghani, Elementa astronomica (Golius, Amsterdam 1669)", ar: "الفرغاني، جوامع علم النجوم وأصول الحركات السماوية ⁦(طبعة غوليوس، أمستردام 1669)⁩" }
summary:
  en: "The 1669 Amsterdam edition of al-Farghani's treatise on the heavenly motions and the principles of astronomy, with the Arabic text and a Latin version printed together and the notes of Jacob Golius. This record covers the pages read in the first section (PDF pages 1 to 100): front matter, the Latin index of chapters and the Arabic text of chapters 8 to 30. The second section (PDF pages 101 to 200) adds the rest of chapter 7 and chapters 6 to 1 in Arabic, then the Latin text from page 133 through chapter 18 (page 200)."
  ar: "طبعة أمستردام سنة 1669 من كتاب الفرغاني في الحركات السماوية وأصول علم النجوم، مع النص العربي والترجمة اللاتينية وحواشي يعقوب غوليوس. يغطي هذا السجل الصفحات 1 إلى 100 من الملف ⁦(التصدير والفهرس ونص الفصول من الثامن إلى الثلاثين)⁩. ويغطي القسم الثاني الصفحات 101 إلى 200: بقية الفصل السابع والفصول من السادس إلى الأول في النص العربي، ثم النص اللاتيني من الصفحة 133 حتى الفصل الثامن عشر ⁦(ص 200)⁩."
  es: "Edición de Ámsterdam de 1669 del tratado de al-Farghani sobre los movimientos celestes y los principios de la astronomía, con el texto árabe y una versión en latín impresos juntos, y las notas de Jacob Golius. Este registro abarca las páginas leídas en la primera sección (páginas 1 a 100 del PDF): la introducción, el índice latino de los capítulos y el texto árabe de los capítulos 8 al 30. La segunda sección (páginas 101 a 200 del PDF) añade el resto del capítulo 7 y los capítulos 6 al 1 en árabe, y luego el texto en latín desde la página 133 hasta el capítulo 18 (página 200)."
  fr: "L'édition de 1669 d'Amsterdam du traité d'al-Farghani sur les mouvements célestes et les principes de l'astronomie, avec le texte arabe et une version latine imprimés ensemble et les notes de Jacob Golius. Cette notice couvre les pages de la première section (pages 1 à 100 du PDF): les pages liminaires, l'index latin des chapitres et le texte arabe des chapitres 8 à 30. La seconde section (pages 101 à 200 du PDF) ajoute la suite du chapitre 7 et les chapitres 6 à 1 en arabe, puis le texte latin de la page 133 au chapitre 18 (page 200)."
  ur: "آسمانی حرکات اور فلکیات کے اصولوں پر الفرغانی کے مقالے کا 1669 کا ایمسٹرڈیم ایڈیشن، جس میں عربی متن اور لاطینی ورژن ایک ساتھ چھاپا گیا اور جیکب گولیئس کے نوٹ۔ یہ ریکارڈ پہلے حصے ⁦(پی ڈی ایف صفحات 1 سے 100 تک)⁩ میں پڑھے گئے صفحات کا احاطہ کرتا ہے: فرنٹ میٹر، ابواب کا لاطینی انڈیکس اور ابواب 8 سے 30 کا عربی متن۔ دوسرا سیکشن ⁦(پی ڈی ایف صفحات 101 سے 200)⁩ باقی باب 7 اور ابواب 6 سے 1 کو عربی میں شامل کرتا ہے، پھر صفحہ 3 سے صفحہ 3 تک۔ 200)۔"
