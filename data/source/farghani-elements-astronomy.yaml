reliability_note: "Read from the OCR of a scanned copy (local harvest file, read-only, outside git). Title page (PDF p.5): Latin title as above; Arabic title on PDF p.5 and p.6, reading 'في الحركات السماوية وجوامع علم النجوم', OCR-doubtful. The title page credits the work to Golius ('Opera Jacobi Golii') and the publisher's preface (PDF pp.7-8) says Golius recognised and annotated the Arabic text and died before finishing the work; the Latin translator is not named on the title page. The name on the title page is Muhammad ibn Kathir; the standard name in other sources is Ahmad ibn Muhammad ibn Kathir: both are recorded, not merged. Page citations use the PDF page markers of the OCR file, not the printed folios. Printed numbers (distances, sizes, periods) are OCR readings and are flagged in the entities that use them; the scan images should be checked before any number is treated as final. The 1669 date and public-domain status are from the title page."
