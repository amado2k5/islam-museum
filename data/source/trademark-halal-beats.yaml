summary:
  ar: "قيود سجلّ العلامات التجارية الخاصة بعلامتي «حلال بيتس»: العلامة الأمريكية ⁦(الرقم التسلسلي 98799566)⁩ التي قدّمها عمر حاجي فالو في أكتوبر 2024 وسُجّلت في يوليو 2025، والعلامة البريطانية «حلال ساوندتراكس» (UK00004129624) المسجلة باسم عمر حاجي فالو، كما تعرضها قاعدة «تريد مارك إيليت»."
  en: "Trademark-register entries for the Halal Beats marks: the United States HALAL BEATS mark (Serial 98799566) filed by Umar Haji Valu in October 2024 and registered in July 2025, and the United Kingdom HALAL SOUNDTRACKS mark (UK00004129624) owned by Umar Haji Valu, as mirrored by TrademarkElite."
  es: "Registros de marcas comerciales para las marcas Halal Beats: la marca estadounidense HALAL BEATS (número de serie 98799566) presentada por Umar Haji Valu en octubre de 2024 y registrada en julio de 2025, y la marca británica HALAL SOUNDTRACKS (UK00004129624) propiedad de Umar Haji Valu, según consta en TrademarkElite."
  fr: "Inscriptions au registre des marques pour les marques Halal Beats: la marque américaine HALAL BEATS (numéro de série 98799566) déposée par Umar Haji Valu en octobre 2024 et enregistrée en juillet 2025, et la marque britannique HALAL SOUNDTRACKS (UK00004129624) appartenant à Umar Haji Valu, telles que reproduites par TrademarkElite."
  ur: "حلال بیٹس کے نشانات کے لیے ٹریڈ مارک رجسٹر اندراجات: ریاستہائے متحدہ کا حلال بیٹس مارک ⁦(سیریل 98799566)⁩ عمر حاجی ویلیو نے اکتوبر 2024 میں درج کروایا اور جولائی 2025 میں رجسٹر کیا، اور برطانیہ کے حلال ساؤنڈ ٹریکس نشان ⁦(UK0000024 کی ملکیت)⁩ TrademarkElite کی طرف سے عکس بند."
  tr: "Halal Beats ticari markaları için marka tescil kısıtlamaları: Ekim 2024'te Omar Haji Falu tarafından sunulan ve Temmuz 2025'te tescil edilen Amerikan markası (seri numarası 98799566) ile Trademark Elite veritabanı tarafından sunulan İngiliz markası Halal Soundtracks (UK00004129624) Omar Haji Fallow adıyla tescil edilmiştir."
  id: "Pembatasan pendaftaran merek dagang untuk merek dagang Halal Beats: merek Amerika (nomor seri 98799566) yang diajukan oleh Omar Haji Falu pada Oktober 2024 dan terdaftar pada Juli 2025, serta merek dagang Inggris Halal Soundtracks (UK00004129624) yang terdaftar dengan nama Omar Haji Fallow, sebagaimana disajikan oleh basis data Trademark Elite."
