summary:
  ar: "مقالة ويكيبيديا الإنجليزية «حميد الدين الفراهي» (وعنوان «حميد الدين فراهي» تحويلة إليها) عن عالم القرآن (18 تشرين الثاني 1863 – 11 تشرين الثاني 1930) من فريها في قضاء أعظم كره، صاحب نظرية النظم في القرآن؛ تذكر أنه تعلم العربية عن ابن خاله شبلي النعماني ودرّس في كراتشي وعليكره وحيدر آباد وأدار مدرسة الإصلاح في سراي مير منذ 1925 حيث كان أمين أحسن الإصلاحي من طلابه المخصوصين؛ ويحمل صندوقها حقل طائفة سنية."
  en: "The English Wikipedia article 'Hamid al-Din Farahi' (the title 'Hamiduddin Farahi' redirects to it) on the Qur'an scholar (18 November 1863 – 11 November 1930) of Phariha in Azamgarh district, originator of the nazm (coherence) theory of the Qur'an; it states that he learned Arabic from his cousin Shibli Nomani, taught at Karachi, Aligarh and Hyderabad, and ran Madrasatul Islah at Sara-e-Mir from 1925, where Amin Ahsan Islahi was among his specially trained students; its infobox carries a Sunni denomination field, which is not a text attestation."
