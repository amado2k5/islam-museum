summary:
  ar: "مقالة ويكيبيديا الإنجليزية «حميد الدين الفراهي» ⁦(وعنوان «حميد الدين فراهي» تحويلة إليها)⁩ عن عالم القرآن ⁦(18 تشرين الثاني 1863 – 11 تشرين الثاني 1930)⁩ من فريها في قضاء أعظم كره، صاحب نظرية النظم في القرآن؛ تذكر أنه تعلم العربية عن ابن خاله شبلي النعماني ودرّس في كراتشي وعليكره وحيدر آباد وأدار مدرسة الإصلاح في سراي مير منذ 1925 حيث كان أمين أحسن الإصلاحي من طلابه المخصوصين؛ ويحمل صندوقها حقل طائفة سنية."
  en: "The English Wikipedia article 'Hamid al-Din Farahi' (the title 'Hamiduddin Farahi' redirects to it) on the Qur'an scholar (18 November 1863 – 11 November 1930) of Phariha in Azamgarh district, originator of the nazm (coherence) theory of the Qur'an; it states that he learned Arabic from his cousin Shibli Nomani, taught at Karachi, Aligarh and Hyderabad, and ran Madrasatul Islah at Sara-e-Mir from 1925, where Amin Ahsan Islahi was among his specially trained students; its infobox carries a Sunni denomination field, which is not a text attestation."
  es: "El artículo de la Wikipedia en inglés 'Hamid al-Din Farahi' (el título 'Hamiduddin Farahi' redirige a él) sobre el erudito coránico (18 de noviembre de 1863 - 11 de noviembre de 1930) de Phariha en el distrito de Azamgarh, creador de la teoría del nazm (coherencia) del Corán; afirma que aprendió árabe de su primo Shibli Nomani, enseñó en Karachi, Aligarh y Hyderabad, y dirigió Madrasatul Islah en Sara-e-Mir desde 1925, donde Amin Ahsan Islahi fue uno de sus estudiantes especialmente capacitados; su cuadro informativo contiene un campo de denominación sunita, que no es una atestación textual."
  fr: "L'article de Wikipédia en anglais intitulé « Hamid al-Din Farahi » (dont le titre « Hamiduddin Farahi » redirige vers cet article) est consacré au savant du Coran (18 novembre 1863 – 11 novembre 1930) originaire de Phariha, dans le district d'Azamgarh, et fondateur de la théorie du nazm (cohérence) du Coran. Il y est indiqué qu'il apprit l'arabe auprès de son cousin Shibli Nomani, enseigna à Karachi, Aligarh et Hyderabad, et dirigea la Madrasatul Islah à Sara-e-Mir à partir de 1925, où Amin Ahsan Islahi figurait parmi ses élèves spécialement formés. Son infobox comporte un champ relatif à l'appartenance à l'école sunnite, qui ne constitue pas une attestation textuelle."
  ur: "انگریزی ویکیپیڈیا کا مضمون 'حامد الدین فراہی' ⁦(عنوان 'حمید الدین فراہی' اس کی طرف رجوع کرتا ہے)⁩ اعظم گڑھ ضلع کے فریحہ کے قرآن عالم ⁦(18 نومبر 1863 - 11 نومبر 1930)⁩ پر، قرآن کے نظم ⁦(مربوط)⁩ نظریہ کے بانی؛ اس میں کہا گیا ہے کہ انہوں نے اپنے کزن شبلی نعمانی سے عربی سیکھی، کراچی، علی گڑھ اور حیدرآباد میں پڑھایا، اور 1925 سے سارا میر میں مدرسۃ الاصلاح چلایا، جہاں امین احسن اصلاحی ان کے خصوصی تربیت یافتہ طلباء میں سے تھے۔ اس کے انفو باکس میں سنی فرقے کا فیلڈ ہے، جو کہ متن کی تصدیق نہیں ہے۔"
