summary:
  ar: "مقالة ويكيبيديا الفارسية عن حسين أنصاريان: تصفه في مطلعها بأنه «روحاني شيعه ومفسّر قرآن من إيران»، مولود في 18 آبان 1323 في خوانسار، درس في حوزتي طهران وقم، وله آلاف الأشرطة وأكثر من أربعين كتابًا في نحو ثمانين مجلدًا."
  en: "The Persian Wikipedia article on Hossein Ansarian: its opening describes him as a Shia cleric and Qur'an commentator from Iran, born on 18 Aban 1323 SH in Khansar, educated at the Tehran and Qom seminaries, with thousands of recorded lectures and more than forty books in about eighty volumes to his name."
  es: "El artículo de la Wikipedia en persa sobre Hossein Ansarian lo describe, en su introducción, como un clérigo chiíta y comentarista del Corán originario de Irán, nacido el 18 de Aban de 1323 SH en Khansar, educado en los seminarios de Teherán y Qom, con miles de conferencias grabadas y más de cuarenta libros en unos ochenta volúmenes."
  fr: "L'article de Wikipédia en persan sur Hossein Ansarian: son introduction le décrit comme un religieux chiite et commentateur du Coran originaire d'Iran, né le 18 Aban 1323 SH à Khansar, formé aux séminaires de Téhéran et de Qom, avec des milliers de conférences enregistrées et plus de quarante livres en environ quatre-vingts volumes à son actif."
  ur: "حسین انصاری پر فارسی ویکیپیڈیا کا مضمون: اس کا آغاز انہیں ایران سے تعلق رکھنے والے ایک شیعہ عالم اور قرآن کے مفسر کے طور پر بیان کرتا ہے، جو 18 ابان 1323ھ کو خانسار میں پیدا ہوئے، تہران اور قم کے مدرسوں میں تعلیم یافتہ، ہزاروں ریکارڈ شدہ لیکچرز اور چالیس سے زائد کتابوں کے ساتھ تقریباً اسّی جلدوں میں ان کے نام ہیں۔"
