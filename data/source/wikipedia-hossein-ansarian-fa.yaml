reliability_note: "Read in full on 7 November 2026; the reading tools available in this run did not expose a revision id, so none is recorded. Used for the opening's independently authored prose attestation — «روحانی شیعه و مفسر قرآن اهل ایران است» ('he is a Shia cleric and Qur'an commentator from Iran') — for the birth date and place (18 Aban 1323 SH in Khansar, i.e. 9 November 1944, agreeing with the English article), for his schooling and seminary path in Tehran and Qom and his teachers, for his preaching at the Hosseinieh Hamadaniha in Tehran, and for the works list and its scale (4,000 lecture tapes and more than 40 book titles in about 80 volumes, as the article reports). The infobox's «مذهب: شیعه دوازده‌امامی» (religion: Twelver Shia) is structured data — it supports the Twelver context for the founder's mapping rule but is not itself counted as an attestation."
