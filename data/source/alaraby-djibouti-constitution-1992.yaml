  en: "Constitution of Djibouti, 1992, revised November 2025 (Al-Araby Al-Jadeed, archived copy of the 1992 Djibouti constitution)"
summary:
  ar: "«دستور جيبوتي، 1992، المعدل في نوفمبر 2025»، كما يُنشر عند: العربي الجديد، نسخة مؤرشفة من دستور جيبوتي 1992. العنوان ونص المادتان 1 و93 مأخوذان من ملخص بحثي زُوّد به المتحف، ولم يفتح المتحف الصفحة؛ وقد أجاز المؤسس استعمال النص كما ورد في 21 نوفمبر 2026."
  en: "Constitution of Djibouti, 1992, revised November 2025, as published at: Al-Araby Al-Jadeed, archived copy of the 1992 Djibouti constitution. The address and the wording of Article 1 and Article 93 come from a research summary supplied to the museum, and the museum did not open the page; the founder approved using the wording as supplied on 21 November 2026."
  ur: "Constitution of Djibouti, 1992, revised November 2025، جیسا کہ Al-Araby Al-Jadeed, archived copy of the 1992 Djibouti constitution پر شائع ہے۔ پتہ اور دفعات 1 اور 93 کی عبارت متحف کو فراہم کردہ ایک تحقیقی خلاصے سے لی گئی ہے، اور متحف نے صفحہ نہیں کھولا؛ بانی نے 21 نومبر 2026 کو عبارت کو جیسی ملی اسی طرح استعمال کرنے کی منظوری دی۔"
  fr: "Constitution of Djibouti, 1992, revised November 2025, tel que publié à : Al-Araby Al-Jadeed, archived copy of the 1992 Djibouti constitution. L'adresse et le texte (articles 1 et 93) viennent d'un résumé de recherche remis au musée, et le musée n'a pas ouvert la page ; le fondateur a approuvé l'usage du texte tel que fourni le 21 novembre 2026."
  es: "Constitution of Djibouti, 1992, revised November 2025, tal como se publica en: Al-Araby Al-Jadeed, archived copy of the 1992 Djibouti constitution. La dirección y el texto (artículos 1 y 93) proceden de un resumen de investigación entregado al museo, y el museo no abrió la página; el fundador aprobó usar el texto tal como se entregó el 21 de noviembre de 2026."
  tr: "\"Cibuti Anayasası, 1992, Kasım 2025'te değiştirildi,\" ayrıca şu kitapta yayımlanmıştır: Al-Araby Al-Jadeed, 1992 Cibuti Anayasası'nın arşivlenmiş bir kopyası. 1. ve 93. maddelerin başlığı ve metni, müzenin sayfasını açmadığı müzenin sağladığı bir araştırma özetinden alınmıştır; kurucu, metnin kullanımına 21 Kasım 2026'da belirtildiği şekilde izin vermiştir."
  id: "\"Konstitusi Djibouti, 1992, diubah pada November 2025,\" juga diterbitkan dalam: Al-Araby Al-Jadeed, salinan arsip Konstitusi Djibouti 1992. Judul dan teks Pasal 1 dan 93 diambil dari ringkasan penelitian yang disediakan oleh museum, yang tidak dibuka oleh museum; pendiri mengizinkan penggunaan teks tersebut sebagaimana dinyatakan pada 21 November 2026."
