summary:
  ar: "قناة عبد الحي محمد سيف الله نفسها على يوتيوب (@abdulhisaifullahofficial)؛ نصّ «نبذة» القناة يسمّيه بالبنغالية خطيبَ مجمع مسجد الجمعة في بالابي بدكا، وقُرئت القناة ومقاطعها في 8 نوفمبر 2026 عبر خدمة عدّ المشتركين الفورية."
  en: "Abdul Hai Muhammad Saifullah's own YouTube channel (@abdulhisaifullahofficial); its About text names him in Bengali as khatib of Masjidul Juma Complex, Pallabi, Dhaka, and the channel and its videos were read on 8 November 2026 via realtimesubcount."
  ur: "عبد الحی محمد سیف اللہ کا اپنا یوٹیوب چینل (@abdulhisaifullahofficial)؛ اس کے «About» متن میں بنگالی میں انھیں ڈھاکہ کے پلّابی میں مسجد الجمعہ کمپلیکس کا خطیب بتایا گیا ہے، اور چینل اور اس کی ویڈیوز 8 نومبر 2026ء کو realtimesubcount کے ذریعے پڑھی گئیں۔"
  es: "El canal de YouTube de Abdul Hai Muhammad Saifullah (@abdulhisaifullahofficial); su texto \"Acerca de\" lo nombra en bengalí como khatib del complejo Masjidul Juma, Pallabi, Dhaka, y el canal y sus videos fueron leídos el 8 de noviembre de 2026 a través de realtimesubcount."
  fr: "La chaîne YouTube d'Abdul Hai Muhammad Saifullah (@abdulhisaifullahofficial); son texte À propos le nomme en bengali khatib du complexe Masjidul Juma, Pallabi, Dhaka, et la chaîne et ses vidéos ont été consultées le 8 novembre 2026 via realtimesubcount."
  tr: "Abdul Hai Mohammed Saifullah'ın YouTube kanalı (@abdulhisaifullahofficial); kanalın 'profil' metni onu Bengalce'de Palappi, Dakka'daki Cuma Camii Kompleksi'nin vaizi olarak anmaktadır. Kanal ve klipleri, 8 Kasım 2026'da anında abone sayma servisi aracılığıyla okundu."
  id: "Channel YouTube Abdul Hai Mohammed Saifullah sendiri (@abdulhisaifullahofficial); teks 'profil' channel tersebut menyebutnya dalam bahasa Bengali sebagai pengkhotbah Kompleks Masjid Jumat di Palappi, Dhaka. Channel dan klip-klipnya dibaca pada 8 November 2026 melalui layanan penghitungan pelanggan instan."
