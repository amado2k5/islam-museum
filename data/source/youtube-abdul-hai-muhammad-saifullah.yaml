reliability_note: "The channel's own About text, read via realtimesubcount on 8 November 2026 (channel UCqyY3LIJtTMaeoI3Tok_9Kg), names him in Bengali — 'আব্দুল হাই মুহাম্মাদ সাইফুল্লাহ, খতীব — মসজিদুল জুম'আ কমপ্লেক্স, পল্লবী, ঢাকা' — that is, khatib of Masjidul Juma Complex, Pallabi, Dhaka; aggregator video descriptions independently give the same khatib role. His publisher bios link the same presence through the legacy YouTube user path youtube.com/user/TheSaifullah1988: the '1988' in that legacy handle is part of an old username and is NOT a birth year, and no source read gives his birth date. The channel is a primary source for his output, role and self-presentation, not independent corroboration of biography. No subscriber count is taken from this source (see source/vidiq-abdul-hai-muhammad-saifullah). The About text and the videos name no school of law or order for him himself. Read on 8 November 2026."
