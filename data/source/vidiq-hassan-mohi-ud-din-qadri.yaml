reliability_note: "Platform statistics aggregator, not a museum-verified fact: the figure of 104,000 subscribers (8,326,048 total views, 2,247 videos) was read from vidIQ on 5 November 2026 and is used only as a dated audience figure. This is the borderline re-verification required by the wave-193 brief: the harvest read 104K on 2026-11-05 and this dated re-read confirms 104,000 — at or above the ~100K men's bar, so the record is built. The page also records that the channel was created on 17 October 2009 and that its channel country is set to Pakistan. Note the channel belongs to Hassan Mohi-ud-Din Qadri and is distinct from his brother Hussain's channel (@drhussainqadri, 548,000 subscribers on vidIQ at the same date), whose figures are not used here. vidIQ's estimated earnings are modelled and are not used."
