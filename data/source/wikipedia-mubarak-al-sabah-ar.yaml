summary:
  ar: "مقالة ويكيبيديا العربية المطوّلة عن الشيخ مبارك بن صباح بن جابر الصباح (1844 – 28 نوفمبر 1915)، حاكم الكويت السابع ومؤسسها الحقيقي في وصفها؛ تروي ولادته في الكويت ونشأته وحملاته العسكرية في الأحساء وقطر وخلافه المالي مع أخويه محمد وجراح وقتله إياهما ليلة 25 ذي القعدة 1313هـ/7 مايو 1896م وقيل 8 مايو بمشاركة ابنيه جابر وسالم، وصراعه الطويل مع يوسف الإبراهيم وسعيه لنيل اعتراف السلطنة، وازدهار الكويت التجاري في عهده."
  en: "Long Arabic Wikipedia article on Sheikh Mubarak bin Sabah bin Jaber Al-Sabah (1844 – 28 November 1915), seventh ruler of Kuwait and in its description her true founder; it recounts his birth at Kuwait, his upbringing and military campaigns in al-Ahsa and Qatar, his financial dispute with his brothers Muhammad and Jarrah, his killing of them on the night of 25 Dhu al-Qa'da 1313 AH / 7 May 1896 (also said 8 May) with his sons Jaber and Salim taking part, his long struggle with Yusuf al-Ibrahim, his pursuit of the Sultan's recognition, and Kuwait's commercial flourishing under him."
