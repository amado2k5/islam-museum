summary:
  ar: "الطبعة الثانية من دائرة المعارف الإسلامية، صدرت في ثلاثة عشر مجلدًا بين 1954 و2008 بإشراف هاملتون جب وعدد من المستشرقين. تُحال الصفحات إلى رقم الصفحة في ملف PDF لكل مجلد من النسخة المرقمنة على أرشيف الإنترنت."
  en: "The second edition of the Encyclopaedia of Islam, issued in thirteen volumes from 1954 to 2008 under the editorship of H. A. R. Gibb and a committee of Orientalists. Citations give the volume and the page number of the PDF file of that volume in the digitised copy on archive.org, not the printed page."
  es: "La segunda edición de la Enciclopedia del Islam, publicada en trece volúmenes entre 1954 y 2008 bajo la dirección editorial de HAR Gibb y un comité de orientalistas. Las citas indican el volumen y el número de página del archivo PDF correspondiente en la copia digitalizada disponible en archive.org, no la página impresa."
  fr: "La deuxième édition de l'Encyclopédie de l'Islam, publiée en treize volumes de 1954 à 2008 sous la direction de H.A.R. Gibb et d'un comité d'orientalistes, est citée dans la version PDF numérisée disponible sur archive.org. Les références bibliographiques indiquent le volume et la page correspondante, et non la page imprimée."
  ur: "انسائیکلوپیڈیا آف اسلام کا دوسرا ایڈیشن، 1954 سے 2008 تک تیرہ جلدوں میں ہار گِب اور مستشرقین کی ایک کمیٹی کی ادارت میں جاری ہوا۔ اقتباسات archive.org پر ڈیجیٹائزڈ کاپی میں اس حجم کی PDF فائل کا حجم اور صفحہ نمبر دیتے ہیں، پرنٹ شدہ صفحہ نہیں۔"
