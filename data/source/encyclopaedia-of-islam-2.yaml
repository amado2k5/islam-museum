reliability_note: "Brill copyright. The archive.org copy (item ei2-complete, uploaded 26 Sep 2022) states no licence URL, so the status is not verified as public domain. Facts are taken from the text and rewritten in the museum's own words, each cited by volume and PDF page; quotations stay at 40 words or fewer. The catalogue record gives the set as 1960 [i.e. 1954]–2008. Page anchors (vol. N p. M) are PDF page numbers, not printed page numbers; volume 5 is split into three PDFs (vol. 5.1, 5.2, 5.3). The text was read through Apple Vision OCR, so names and diacritics need checking against the page image in doubtful cases."
