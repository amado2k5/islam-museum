summary:
  ar: "مقالة ويكيبيديا التركية القصيرة عن عبدول فراشري؛ تُستخدم لوقائع الكيان فقط. توافق الألمانية وويكيداتا في تاريخي ميلاده ⁦(17 أغسطس 1839)⁩ ووفاته ⁦(11 أكتوبر 1892)⁩، وتذكر تعلّمه الفارسية في تكية بكتاشية وخدمته مع أبيه في الدفاع عن حدود اليونان."
  en: "Short Turkish Wikipedia article on Abdyl Frashëri; used for entity facts only. It agrees with the German article and Wikidata on his birth (17 August 1839) and death (11 October 1892), and records his Persian studies at a Bektashi tekke and his service with his father defending the Greek frontier."
  es: "Breve artículo en turco de la Wikipedia sobre Abdyl Frashëri; utilizado únicamente para datos sobre la persona. Coincide con el artículo en alemán y con Wikidata sobre su nacimiento (17 de agosto de 1839) y su muerte (11 de octubre de 1892), y registra sus estudios de persa en un tekke bektashi y su servicio junto a su padre en la defensa de la frontera griega."
  fr: "Court article de Wikipédia en turc sur Abdyl Frashëri; utilisé uniquement pour les informations factuelles. Il concorde avec l’article allemand et Wikidata concernant sa naissance (17 août 1839) et sa mort (11 octobre 1892), et mentionne ses études de persan dans une école Bektashi et son engagement aux côtés de son père dans la défense de la frontière grecque."
  ur: "عبدل فریشری پر مختصر ترک ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اس کی پیدائش ⁦(17 اگست 1839)⁩ اور موت ⁦(11 اکتوبر 1892)⁩ پر جرمن مضمون اور وکی ڈیٹا سے متفق ہے، اور بکتاشی ٹیکے میں اس کی فارسی تعلیم اور یونانی سرحد کا دفاع کرنے والے اپنے والد کے ساتھ اس کی خدمات کو ریکارڈ کرتا ہے۔"
  tr: "Abdul Farashri hakkında kısa Türkçe Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Almanca ve Wikidata, doğum tarihleri (17 Ağustos 1839) ve ölüm tarihleri (11 Ekim 1892) ile eşleşir; Bektaşiye Tekkiyeh'de Farsça öğrendiği ve babasıyla birlikte Yunanistan sınırlarını savunmadaki hizmetinden bahseder."
  id: "Artikel singkat Wikipedia Turki tentang Abdul Farashri; digunakan hanya untuk fakta entitas. Bahasa Jerman dan Wikidata mencocokkan tanggal lahirnya (17 Agustus 1839) dan kematiannya (11 Oktober 1892), menyebutkan pembelajarannya tentang bahasa Persia di Bektashiye Tekkiyeh dan pengabdiannya bersama ayahnya dalam mempertahankan perbatasan Yunani."
