reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. A short article: born 17 August 1839 at Fraşır (Frashër), died 11 October 1892 at Istanbul (agreeing with the German article and Wikidata against the Albanian, English and Arabic articles — recorded as a conflict); his name in Ottoman state records is Abdullah Hüsnü; he began school at Frashër and also learned Persian at the Bektashi Nasibi Tahir Baba Tekke (his brother Sami's first school as well — an education fact); elder brother of Şemseddin Sami and Naim; he served with his father in the defence of the Greek frontier; after the Ottoman defeat of 1877–78 he organised the Albanian nationalists, joined the Berlin Congress, contributed to the Prizren programme, was elected deputy for Yanya in the second parliament (a variant on the other articles' first parliament, recorded loosely), had the South Albanian constitution prepared (1878) and was, unlike co-founder Ali Pasha of Gusinje, for an independent Albanian state from the start. No statement attests his own adherence to the Bektashi order."
