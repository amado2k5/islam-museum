summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مصطفى السباعي ⁦(1915 – 3 أكتوبر 1964)⁩: سياسي وناشط سوري، عميد كلية الشريعة وكلية الحقوق بجامعة دمشق، وقائد الإخوان المسلمين في سوريا من 1945 إلى 1961؛ يذكر صندوق معلوماتها دينه «الإسلام» وطائفته «سني» وحركته «سلفية» مستشهدة بقاموس موسالي التاريخي للحركات الإسلامية."
  en: "English Wikipedia article on Mustafa al-Siba'i (1915 – 3 October 1964): Syrian politician and activist, dean of the Faculty of Islamic Jurisprudence and the School of Law at Damascus University, and leader of the Syrian Muslim Brotherhood from 1945 to 1961; its infobox gives his religion as Islam, denomination Sunni and movement Salafi, the last cited to Moussalli's Historical Dictionary of Islamic Fundamentalist Movements."
  es: "Artículo de la Wikipedia en inglés sobre Mustafa al-Siba'i (1915 – 3 de octubre de 1964): político y activista sirio, decano de la Facultad de Jurisprudencia Islámica y de la Escuela de Derecho de la Universidad de Damasco, y líder de la Hermandad Musulmana Siria de 1945 a 1961; su ficha informativa indica que su religión era el Islam, su denominación sunita y su movimiento salafista, este último citado en el Diccionario histórico de movimientos fundamentalistas islámicos de Moussalli."
  fr: "L'article de Wikipédia en anglais sur Mustafa al-Siba'i (1915 – 3 octobre 1964): homme politique et militant syrien, doyen de la faculté de jurisprudence islamique et de l'école de droit de l'université de Damas, et chef des Frères musulmans syriens de 1945 à 1961; son infobox indique que sa religion est l'islam, sa confession sunnite et son mouvement salafiste, ce dernier étant cité dans le Dictionnaire historique des mouvements fondamentalistes islamiques de Moussalli."
  ur: "مصطفٰی السبائی پر انگریزی ویکیپیڈیا کا مضمون ⁦(1915 - 3 اکتوبر 1964)⁩: شامی سیاست دان اور کارکن، دمشق یونیورسٹی میں اسلامی فقہ اور قانون کے فیکلٹی کے ڈین، اور 1945 سے 1961 تک شامی اخوان المسلمین کے رہنما؛ اس کا معلوماتی باکس اس کا مذہب اسلام، فرقہ سنی اور تحریک سلفی دیتا ہے، جس کا آخری حوالہ موصلی کی اسلامی بنیاد پرست تحریکوں کی تاریخی لغت میں دیا گیا ہے۔"
  tr: "Mustafa El-Sibai hakkında İngilizce Vikipedi makalesi (1915 – 3 Ekim 1964): Suriyeli politikacı ve aktivist, Şam Üniversitesi Şeriat ve Hukuk Fakültesi Dekanı ve 1945-1961 yılları arasında Suriye'deki Müslüman Kardeşler'in lideri; bilgi kutusunda dini \"İslam\", mezhebi \"Sünni\" ve hareketi \"Selefi\" olarak belirtilmiş, Mousali'nin İslami Hareketler Tarihsel Sözlüğü'ne atıfta bulunulmuştur."
  id: "Artikel Wikipedia bahasa Inggris tentang Mustafa Al-Sibai (1915 – 3 Oktober 1964): politikus dan aktivis Suriah, Dekan Fakultas Syariah dan Hukum di Universitas Damaskus, serta pemimpin Ikhwanul Muslimin di Suriah dari 1945 hingga 1961; infobox menyebutkan agamanya sebagai \"Islam,\" sektenya sebagai \"Sunni,\" dan gerakannya \"Salafi,\" mengutip Kamus Sejarah Gerakan Islam karya Mousali."
