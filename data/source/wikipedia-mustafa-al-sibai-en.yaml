reliability_note: "Encyclopedia article read in full on 3 November 2026 and re-fetched the same day with identical text; the reading tool does not expose the numeric revision id, so none is recorded. Its life narrative rests on Moubayed's Steel and Silk (pp. 340–341) and Beinin (1987); the 'Salafi' movement attestation is cited to Ahmad S. Moussalli, Historical Dictionary of Islamic Fundamentalist Movements in the Arab World, Iran and Turkey (1999), p. 259, which says al-Siba'i and 'Isam al-'Attar had 'a long history in al-Salafiyya'. The article errs in dating his deanship of the Faculty of Theology to 1940; the Arabic article and the university chronology place his professorship in 1950 and his founding deanship of the Sharia Faculty in 1955."
