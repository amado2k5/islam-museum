summary:
  ar: "الصفحة «Arabic Collections Online» في New York University Libraries؛ ذُكرت في ملف بحث قُدّم إلى المتحف في 21 نوفمبر 2026، ولم يفتح المتحف الصفحة، ووافق المؤسس على استعمال الملف دون إعادة تحقق. تُستعمل في: مراجع الأسماء والأنساب والتراجم وقواعد الاستناد."
  en: "The page \"Arabic Collections Online\" (New York University Libraries), named in a research file supplied to the museum on 21 November 2026; the museum did not open the page, and the founder approved using the file without re-verification. Used for: the reference works and authority files on names, genealogies and biographies."
  ur: "صفحہ «Arabic Collections Online» (New York University Libraries)؛ یہ عجائب گھر کو 21 نومبر 2026ء کو دی گئی تحقیقی فائل میں مذکور ہے، عجائب گھر نے صفحہ نہیں کھولا اور بانی نے دوبارہ تصدیق کے بغیر فائل کے استعمال کی منظوری دی۔ استعمال: ناموں، انساب اور تراجم کے مراجع اور اتھارٹی ریکارڈ۔"
  fr: "La page « Arabic Collections Online » (New York University Libraries), citée dans un fichier de recherche remis au musée le 21 novembre 2026 ; le musée n'a pas ouvert la page, et le fondateur a approuvé l'usage du fichier sans nouvelle vérification. Utilisée pour : les ouvrages de référence et fichiers d'autorité sur les noms, les généalogies et les biographies."
  es: "La página «Arabic Collections Online» (New York University Libraries), citada en un archivo de investigación entregado al museo el 21 de noviembre de 2026; el museo no abrió la página, y el fundador aprobó usar el archivo sin volver a verificar. Usada para: las obras de referencia y archivos de autoridad sobre nombres, genealogías y biografías."
