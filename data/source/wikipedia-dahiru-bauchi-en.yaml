  ar: "مقالة ويكيبيديا الإنجليزية عن الشيخ طاهر عثمان باوتشي (1927–2025)، العالم النيجيري التيجاني؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في غومبي وتلقيه الطريقة التيجانية وعضويته فيها، وزواجه من ابنة إبراهيم إنياس، ووفاته في 26 نوفمبر 2025."
  en: "English Wikipedia article on Sheikh Dahiru Usman Bauchi (1927-2025), the Nigerian Tijani scholar; used for entity facts only. It records his birth in Gombe, his receiving the Tijaniyya tariqa and his membership of the order, his marriage to a daughter of Ibrahim Niass, and his death on 26 November 2025."
