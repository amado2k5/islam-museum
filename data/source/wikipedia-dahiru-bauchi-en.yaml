reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 at the recorded revision, fetched by revision id via the MediaWiki API and the returned id asserted equal. The lead and infobox give his birth as 29 June 1927, and the text states he was born in the Hijri year 1346; Wikidata and the Hausa article give 28 June 1927, so the record marks the day debated. The text states in its lead that he 'was part of the Islamic Sufi group known as the Tijaniyyah' and in its education section that 'He received the Tijjaniyyah Tariqah' — a personal statement of membership and initiation, not only of office; its infobox gives denomination 'Sunni, Sufi', jurisprudence Maliki and movement Tijaniyya. His death at home on 26 November 2025 is cited to the Daily Post of 27 November 2025."
