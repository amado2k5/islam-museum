  ar: "مقالة ويكيبيديا الإندونيسية عن عدي هداية؛ تُستخدم لوقائع الكيان فقط. تفصّل تعليمه في بانديغلانغ وغاروت وليبيا، ومناصبه في ليبيا وإندونيسيا، وتأسيسه معهد كوانتم أخيار سنة 2013، وحملة تبرعاته لفلسطين سنة 2021، ومؤلفاته والجدل حول تعريفه للقدرية والجبرية."
