summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن عدي هداية؛ تُستخدم لوقائع الكيان فقط. تفصّل تعليمه في بانديغلانغ وغاروت وليبيا، ومناصبه في ليبيا وإندونيسيا، وتأسيسه معهد كوانتم أخيار سنة 2013، وحملة تبرعاته لفلسطين سنة 2021، ومؤلفاته والجدل حول تعريفه للقدرية والجبرية."
  en: "Indonesian Wikipedia article on Adi Hidayat; used for entity facts only. It details his schooling in Pandeglang, Garut and Libya, his posts in Libya and Indonesia, his founding of the Quantum Akhyar Institute in 2013, his 2021 Palestine fundraising campaign, his books and the controversy over his definitions of qadariyah and jabariyah."
  es: "Artículo de la Wikipedia en indonesio sobre Adi Hidayat; utilizado únicamente para datos sobre la persona. Detalla su formación académica en Pandeglang, Garut y Libia, sus cargos en Libia e Indonesia, la fundación del Instituto Quantum Akhyar en 2013, su campaña de recaudación de fondos para Palestina en 2021, sus libros y la controversia en torno a sus definiciones de qadariyah y jabariyah."
  fr: "Article de Wikipédia indonésien sur Adi Hidayat; utilisé uniquement à des fins d’information sur l’entité. Il détaille sa scolarité à Pandeglang, Garut et en Libye, ses postes en Libye et en Indonésie, la fondation du Quantum Akhyar Institute en 2013, sa campagne de financement pour la Palestine en 2021, ses livres et la controverse concernant ses définitions de qadariyah et jabariyah."
  ur: "عدی ہدایت پر انڈونیشین ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں پانڈےگلانگ، گاروت اور لیبیا میں ان کی تعلیم، لیبیا اور انڈونیشیا میں ان کی پوسٹس، 2013 میں ان کی کوانٹم اخیار انسٹی ٹیوٹ کی بنیاد، 2021 میں ان کی فلسطین فنڈ ریزنگ مہم، اس کی کتابیں اور اس کی قدریہ اور جبریہ کی تعریفوں پر ہونے والے تنازعات کی تفصیل ہے۔"
  tr: "Uday Hidayah hakkında Endonezya Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Bandilang, Garut ve Libya'daki eğitimini, Libya ve Endonezya'daki pozisyonlarını, 2013'te Quantum Akhair Enstitüsü'nü kurmasını, 2021'de Filistin'e yaptığı bağış kampanyasını, yazılarını ve kadercilik ile determinizm tanımları üzerindeki tartışmayı detaylandırmaktadır."
  id: "Artikel Wikipedia Indonesia tentang Uday Hidayah; digunakan hanya untuk fakta entitas. Artikel ini merinci pendidikannya di Bandilang, Garut, dan Libya, posisinya di Libya dan Indonesia, pendirian Institut Quantum Akhair pada 2013, kampanye donasinya ke Palestina pada 2021, tulisan-tulisannya, serta perdebatan tentang definisi fatalisme dan determinisme yang ia miliki."
