summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حبيب الله خان؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 2 يوليو 1872 في سمرقند نقلا عن فوغلسانغ وسجلات الأنساب، وإمارته لأفغانستان من 1901 حتى اغتياله في كالاغوش بلَغمان في 20 فبراير 1919، وإصلاحاته ومدرسة حبيبية والأكاديمية العسكرية وحياد أفغانستان في الحرب العالمية الأولى. صندوق معلوماتها وحده يذكر دينه «الإسلام السني»."
  en: "English Wikipedia article on Habibullah Khan; used for entity facts only. It gives his birth on 2 July 1872 at Samarkand, citing Vogelsang and a genealogy record, his emirate of Afghanistan from 1901 until his assassination at Kalagosh in Laghman on 20 February 1919, his reforms, the Habibia High School and military academy, and Afghanistan's neutrality in the First World War. Its infobox alone gives his religion as Sunni Islam."
  es: "Artículo de la Wikipedia en inglés sobre Habibullah Khan; utilizado únicamente para datos biográficos. Indica su nacimiento el 2 de julio de 1872 en Samarcanda, citando a Vogelsang y un registro genealógico; su gobierno como emirato de Afganistán desde 1901 hasta su asesinato en Kalagosh, Laghman, el 20 de febrero de 1919; sus reformas; la escuela secundaria y academia militar de Habibia; y la neutralidad de Afganistán en la Primera Guerra Mundial. Su ficha informativa solo indica que su religión era el islam sunita."
  fr: "L'article de Wikipédia en anglais consacré à Habibullah Khan, utilisé uniquement pour les informations le concernant, indique sa naissance le 2 juillet 1872 à Samarcande (d'après Vogelsang et un registre généalogique), son émirat d'Afghanistan de 1901 jusqu'à son assassinat à Kalagosh, dans le district de Laghman, le 20 février 1919, ses réformes, le lycée et l'académie militaire Habibia, ainsi que la neutralité de l'Afghanistan pendant la Première Guerre mondiale. Seule son infobox mentionne sa religion: l'islam sunnite."
  ur: "حبیب اللہ خان پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 2 جولائی 1872 کو سمرقند میں اس کی پیدائش، ووگلسنگ اور نسب نامے کے ریکارڈ کا حوالہ دیتے ہوئے، 1901 سے اس کی امارت افغانستان سے لے کر 20 فروری 1919 کو لغمان کے کالاگوش میں اس کے قتل تک، اس کی اصلاحات، حبیبیہ ہائی اسکول اور ملٹری اکیڈمی، اور افغانستان کی پہلی عالمی جنگ میں غیر جانبدارانہ جنگ میں۔ اس کا انفو باکس ہی اس کا مذہب بطور سنی اسلام دیتا ہے۔"
