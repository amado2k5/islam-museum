summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حبيب الله خان؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 2 يوليو 1872 في سمرقند نقلا عن فوغلسانغ وسجلات الأنساب، وإمارته لأفغانستان من 1901 حتى اغتياله في كالاغوش بلَغمان في 20 فبراير 1919، وإصلاحاته ومدرسة حبيبية والأكاديمية العسكرية وحياد أفغانستان في الحرب العالمية الأولى. صندوق معلوماتها وحده يذكر دينه «الإسلام السني»."
  en: "English Wikipedia article on Habibullah Khan; used for entity facts only. It gives his birth on 2 July 1872 at Samarkand, citing Vogelsang and a genealogy record, his emirate of Afghanistan from 1901 until his assassination at Kalagosh in Laghman on 20 February 1919, his reforms, the Habibia High School and military academy, and Afghanistan's neutrality in the First World War. Its infobox alone gives his religion as Sunni Islam."
