reliability_note: "A channel-statistics aggregator read on 4 November 2026; its figures are dated platform measurements, not museum facts. As of 2026-11-05 it recorded 1,090,000 subscribers, 10,995 videos and 298,648,628 total views for the studio channel, opened on 9 February 2013 with its country set to Kazakhstan. Its most-viewed videos are sermons by 'Ұстаз Нұрсұлтан Рысмағанбет' (Ustaz Nursultan Rysmaganbet), which also fixes the Kazakh Cyrillic form of his name. ÁLI stýdıasy is a studio/distribution channel: its audience is never counted as the preacher's own reach, and the channel is not recorded as his property."
