summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن معمر القذافي؛ تُستخدم لوقائع الكيان فقط. تذكر ميلاده نحو سنة 1942 قرب قصر أبو هادي خارج سرت — مع تعليق تحريري بأن تاريخ ميلاده لم يرد في مصادر موثوقة — واستيلاءه على السلطة بانقلاب 1 سبتمبر 1969 الذي أطاح بالملك إدريس، وقتله في سرت في 20 أكتوبر 2011. تصف قسمُ أيديولوجيته إحياءه الإسلامي الراجع إلى القرآن والرافض للتفاسير العلمية والحديث، دون أن يسمّي نصُّها مذهبًا له."
  en: "English Wikipedia article on Muammar Gaddafi; used for entity facts only. It gives his birth as circa 1942 near Qasr Abu Hadi outside Sirte — with an editorial note that his birth date does not appear to have been published in reliable sources — his seizure of power in the coup of 1 September 1969 that overthrew King Idris, and his killing at Sirte on 20 October 2011. Its ideology section describes his Islamic revivalism returning to the Qur'an and rejecting scholarly interpretations and the Hadith, without its text naming any school for him."
