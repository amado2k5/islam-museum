summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن معمر القذافي؛ تُستخدم لوقائع الكيان فقط. تذكر ميلاده نحو سنة 1942 قرب قصر أبو هادي خارج سرت — مع تعليق تحريري بأن تاريخ ميلاده لم يرد في مصادر موثوقة — واستيلاءه على السلطة بانقلاب 1 سبتمبر 1969 الذي أطاح بالملك إدريس، وقتله في سرت في 20 أكتوبر 2011. تصف قسمُ أيديولوجيته إحياءه الإسلامي الراجع إلى القرآن والرافض للتفاسير العلمية والحديث، دون أن يسمّي نصُّها مذهبًا له."
  en: "English Wikipedia article on Muammar Gaddafi; used for entity facts only. It gives his birth as circa 1942 near Qasr Abu Hadi outside Sirte — with an editorial note that his birth date does not appear to have been published in reliable sources — his seizure of power in the coup of 1 September 1969 that overthrew King Idris, and his killing at Sirte on 20 October 2011. Its ideology section describes his Islamic revivalism returning to the Qur'an and rejecting scholarly interpretations and the Hadith, without its text naming any school for him."
  es: "Artículo de la Wikipedia en inglés sobre Muamar Gadafi; utilizado únicamente para datos sobre la persona. Indica que nació alrededor de 1942 cerca de Qasr Abu Hadi, en las afueras de Sirte —con una nota editorial que señala que su fecha de nacimiento no parece haber sido publicada en fuentes fiables—, su toma del poder en el golpe de Estado del 1 de septiembre de 1969 que derrocó al rey Idris, y su asesinato en Sirte el 20 de octubre de 2011. Su sección sobre ideología describe su resurgimiento islámico, que implicaba el retorno al Corán y el rechazo de las interpretaciones académicas y los Hadices, sin mencionar ninguna escuela a la que pertenezca."
  fr: "L'article de Wikipédia en anglais sur Mouammar Kadhafi, utilisé uniquement pour les informations factuelles, indique sa naissance vers 1942 près de Qasr Abu Hadi, aux abords de Syrte (avec une note éditoriale précisant que cette date de naissance ne semble pas avoir été publiée dans des sources fiables). Il relate également sa prise de pouvoir lors du coup d'État du 1er septembre 1969 qui a renversé le roi Idris, et sa mort à Syrte le 20 octobre 2011. La section consacrée à son idéologie décrit son renouveau islamique, caractérisé par un retour au Coran et le rejet des interprétations savantes et des hadiths, sans toutefois mentionner d'école particulière à son égard."
