reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read on 27 October 2026 at the recorded revision, fetched by revision id with the returned id asserted equal; the article is long and the sections used were read in full. The infobox birth-date field carries an editorial comment that his birth date does not appear to have been published in reliable sources, and gives circa 1942; the lead likewise gives (c. 1942 – 20 October 2011). The early-life text, cited to Blundy and Lycett, Kawczynski and St. John, places his birth near Qasr Abu Hadi outside Sirte. The infobox names Idris I (as King of Libya) as predecessor in the chairmanship of the Revolutionary Command Council from 1 September 1969, and the death place as Sirte. The article's categories file him under both Libyan Quranist Muslims and Libyan Sunni Muslims; filings are not text statements."
