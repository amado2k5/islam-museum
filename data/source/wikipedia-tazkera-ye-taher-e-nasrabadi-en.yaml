reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). An article on the work rather than the man, resting on Mahmoud Fotoohi's Encyclopaedia Iranica entry 'Taḏkera-ye Naṣrābādi' (2020) and on Sunil Sharma's chapter in Safavid Persia in the Age of Empires (2021). It names the author as the poet and literary historian Mirza Mohammad Taher Nasrabadi and describes the Tazkira as a collection of brief biographies of around one thousand poets from Safavid Iran, composed in 1680 and dedicated to the Safavid shah Suleiman I (r. 1666–1694), dividing the Persian literary world into Iran, Turan and India. Checked 1 November 2026."
