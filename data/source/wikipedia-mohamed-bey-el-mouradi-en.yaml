  ar: "مقالة ويكيبيديا الإنجليزية عن محمد باي المرادي؛ تُستخدم لوقائع الكيان فقط. لا تعطي سنة ميلاد، وتجعل ولايته 1675–14 تشرين الأول 1696 وأنه الابن الأكبر لمراد باي الثاني، وتسرد حروبه مع أخيه علي وخلفه رمضان باي ومنشآته ومنها جامع سيدي محرز."
  en: "English Wikipedia article on Mohamed Bey El Mouradi; used for entity facts only. It gives no birth year, dates his beylicate 1675 – 14 October 1696, makes him the eldest son of Murad II Bey with Murad II as predecessor and Ramadan Bey as successor, narrates the civil wars with his brother Ali, the 1686 Algerian sack and the 1694–1695 annexation, and lists his buildings, headed by the Sidi Mahrez Mosque."
