summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد باي المرادي؛ تُستخدم لوقائع الكيان فقط. لا تعطي سنة ميلاد، وتجعل ولايته 1675–14 تشرين الأول 1696 وأنه الابن الأكبر لمراد باي الثاني، وتسرد حروبه مع أخيه علي وخلفه رمضان باي ومنشآته ومنها جامع سيدي محرز."
  en: "English Wikipedia article on Mohamed Bey El Mouradi; used for entity facts only. It gives no birth year, dates his beylicate 1675 – 14 October 1696, makes him the eldest son of Murad II Bey with Murad II as predecessor and Ramadan Bey as successor, narrates the civil wars with his brother Ali, the 1686 Algerian sack and the 1694–1695 annexation, and lists his buildings, headed by the Sidi Mahrez Mosque."
  es: "Artículo de la Wikipedia en inglés sobre Mohamed Bey El Mouradi; utilizado únicamente para datos sobre la persona. No indica el año de nacimiento, fecha su beylicato entre 1675 y el 14 de octubre de 1696, lo presenta como el hijo mayor de Murad II Bey, con Murad II como predecesor y Ramadan Bey como sucesor, narra las guerras civiles con su hermano Ali, el saqueo de Argelia en 1686 y la anexión de 1694-1695, y enumera sus construcciones, encabezadas por la Mezquita Sidi Mahrez."
  fr: "L'article de Wikipédia en anglais sur Mohamed Bey El Mouradi, utilisé uniquement pour les informations factuelles, ne mentionne pas son année de naissance, date son mandat de beylicate de 1675 au 14 octobre 1696, le présente comme le fils aîné de Murad II Bey (Murad II étant son prédécesseur et Ramadan Bey son successeur), relate les guerres civiles contre son frère Ali, le sac de l'Algérie en 1686 et l'annexion de 1694-1695, et énumère ses édifices, dont la mosquée Sidi Mahrez."
