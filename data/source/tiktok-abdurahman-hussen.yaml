reliability_note: "His own account: a primary source for his identity, his self-presentation and his short-form dawah output in Afaan Oromo, not independent corroboration of biography. The profile was read directly on TikTok on 7 November 2026 and showed 819,900 followers, 376 following, 15,100,000 total likes and 1,550 videos, with no verification badge; the figures are dated platform figures, not museum measurements. The display name is 'Abdurahman hussen' and the bio reads '#link-youtube kiyya as jalaa argachuu ni dandeessu' — Afaan Oromo directing viewers to his YouTube link below; no YouTube channel name or count is taken from it, and none was read in this run. The profile gives no birth date and no school of law. This fresh read is higher than, and consistent with, the 700,000-follower milestone for this man reported for 25 December 2025 in the wave-195 harvest (a celebratory post by Ustaz Riyad Abdaallah carrying a screenshot of the profile; that post itself could not be located in a citable form on 7 November 2026, so the record rests on this direct read, not on the milestone post). Read on 7 November 2026."
