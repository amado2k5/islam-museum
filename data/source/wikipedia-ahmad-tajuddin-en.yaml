reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 at the recorded revision, fetched by its revision id with the returned id asserted equal. It gives him as the 27th Sultan of Brunei, eldest surviving son of Muhammad Jamalul Alam II (his predecessor) and Pengiran Anak Fatimah, born at Istana Pekan, Brunei Town, installed in 1931 and crowned on 17 March 1940, succeeded by his younger brother Omar Ali Saifuddien III; it has him die at the Singapore General Hospital of renal failure, and its narrative (citing Sidhu 2009) has him die the day after reaching the hospital with the funeral on 4 June 1950. Its text names no school for him: it records his founding of an Islamic school in 1940 and the Japanese administration's continued recognition of him as head of the Islamic religion in Brunei, both matters of patronage and office."
