summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أحمد تاج الدين، السلطان السابع والعشرين لبروناي (1924–1950)؛ تُستخدم لوقائع الكيان فقط. تعطي في صدرها ومربع معلوماتها مولده في 22 آب 1912 ووفاته في 4 حزيران 1950، بينما تسجل ملاحظتها نفسها أوراقًا بحثية بروناوية تعطي 1913 وريس يعطي 2 أيلول 1913؛ ومربع معلوماتها يربط دينه بالإسلام السني معروضًا «الإسلام»."
  en: "English Wikipedia article on Ahmad Tajuddin, the 27th Sultan of Brunei (1924–1950); used for entity facts only. Its lead and infobox give his birth as 22 August 1912 and his death as 4 June 1950, while its own note records Bruneian research papers giving 22 August 1913 and the historian Bob Reece giving 2 September 1913; its infobox religion field links Sunni Islam, displayed as 'Islam'."
