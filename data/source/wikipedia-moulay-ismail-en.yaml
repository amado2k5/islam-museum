summary:
  ar: "مقال الإنجليزية عن مولاي إسماعيل بن الشريف ⁦(نحو 1645 – 22 مارس 1727)⁩، سلطان المغرب 1672–1727 وثاني حكام الدولة العلوية: نشأته بسجلماسة، وولايته فاس والشمال من 1667، ومبايعته بفاس في 14 أبريل 1672، وحروبه ضد ابن أخيه أحمد بن محرز حتى 1687، واتخاذه مكناس عاصمة وبناؤه مجمعها القصري، واسترجاعه المعمورة (1681) والعرائش (1689) وأصيلة (1691)."
  en: "English encyclopedia article on Moulay Ismail ibn al-Sharif (c. 1645 – 22 March 1727), Sultan of Morocco 1672–1727 and second ruler of the 'Alawi dynasty: his birth at Sijilmasa, his governorship of Fez and the north from 1667, his proclamation at Fez on 14 April 1672, his wars against his nephew Ahmed ben Mehrez until 1687, his making Meknes his capital and building its palace complex, and his recovery of La Mamora (1681), Larache (1689) and Asilah (1691)."
