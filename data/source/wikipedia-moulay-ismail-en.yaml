summary:
  ar: "مقال الإنجليزية عن مولاي إسماعيل بن الشريف ⁦(نحو 1645 – 22 مارس 1727)⁩، سلطان المغرب 1672–1727 وثاني حكام الدولة العلوية: نشأته بسجلماسة، وولايته فاس والشمال من 1667، ومبايعته بفاس في 14 أبريل 1672، وحروبه ضد ابن أخيه أحمد بن محرز حتى 1687، واتخاذه مكناس عاصمة وبناؤه مجمعها القصري، واسترجاعه المعمورة (1681) والعرائش (1689) وأصيلة (1691)."
  en: "English encyclopedia article on Moulay Ismail ibn al-Sharif (c. 1645 – 22 March 1727), Sultan of Morocco 1672–1727 and second ruler of the 'Alawi dynasty: his birth at Sijilmasa, his governorship of Fez and the north from 1667, his proclamation at Fez on 14 April 1672, his wars against his nephew Ahmed ben Mehrez until 1687, his making Meknes his capital and building its palace complex, and his recovery of La Mamora (1681), Larache (1689) and Asilah (1691)."
  es: "Artículo de enciclopedia inglesa sobre Moulay Ismail ibn al-Sharif (c. 1645 – 22 de marzo de 1727), sultán de Marruecos entre 1672 y 1727 y segundo gobernante de la dinastía 'Alawi: su nacimiento en Sijilmasa, su gobierno de Fez y el norte desde 1667, su proclamación en Fez el 14 de abril de 1672, sus guerras contra su sobrino Ahmed ben Mehrez hasta 1687, la conversión de Meknes en su capital y la construcción de su complejo palaciego, y la recuperación de La Mamora (1681), Larache (1689) y Asilah (1691)."
  fr: "Article d'encyclopédie anglaise sur Moulay Ismail ibn al-Sharif (vers 1645 – 22 mars 1727), sultan du Maroc de 1672 à 1727 et deuxième souverain de la dynastie alaouite: sa naissance à Sijilmasa, son gouvernement de Fès et du nord à partir de 1667, sa proclamation à Fès le 14 avril 1672, ses guerres contre son neveu Ahmed ben Mehrez jusqu'en 1687, la transformation de Meknès en capitale et la construction de son complexe palatial, et la reconquête de La Mamora (1681), Larache (1689) et Asilah (1691)."
  ur: "مولائے اسماعیل ابن الشریف ⁦(c. 1645 - 22 مارچ 1727)⁩، مراکش کے سلطان 1672-1727 اور علوی خاندان کے دوسرے حکمران پر انگریزی انسائیکلوپیڈیا کا مضمون: ان کی پیدائش سجلماسا میں، اس کی فیز کی گورنری اور شمال میں 16 اپریل 1647 کو ان کی پیدائش۔ 1672، اس کی اپنے بھتیجے احمد بن مہریز کے خلاف 1687 تک جنگیں، اس نے میکنیس کو اپنا دارالحکومت بنایا اور اس کا محل کمپلیکس بنایا، اور اس کی لا مامورا (1681)، لاراچ (1689) اور اسیلہ (1691) کی بازیابی۔"
  tr: "Moulay İsmail bin Şerif (yaklaşık 1645 – 22 Mart 1727), Fas Sultanı 1672–1727 ve Alaouite devletinin ikinci hükümdarı hakkında bir İngiliz makalesi: Sijilmasa'daki yetiştirilme süreci, 1667'den itibaren Fez ve kuzey valiliği, 14 Nisan 1672'de Fes'e bağlılığı, yeğeni Ahmed bin Mahrez'e karşı 1687'ye kadar verdiği savaşlar, Meknes'i başkent olarak ataması, saray kompleksinin inşası, Al-Maamoura (1681), Larache (1689) ve Asilah'ın (1691) geri alınması."
  id: "Sebuah artikel bahasa Inggris tentang Moulay Ismail bin Sharif (sekitar 1645 – 22 Maret 1727), Sultan Maroko 1672–1727 dan penguasa kedua negara Alaouite: masa kecilnya di Sijilmasa, masa jabatannya di Fez dan utara sejak 1667, kesetiaannya pada Fez pada 14 April 1672, perang-perangnya melawan keponakannya Ahmed bin Mahrez hingga 1687, pengangkatannya atas Meknes sebagai ibu kota, pembangunan kompleks istana, pemulihan Al-Maamoura (1681), Larache (1689), dan Asilah (1691)."
