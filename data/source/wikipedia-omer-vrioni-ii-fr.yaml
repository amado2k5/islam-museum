reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. A short article. It calls him an Albanian prime minister and diplomat; born 1839, died 1928; of the beys of Berat, Fier and Myzeqe; founder of the city of Fier in 1864 'with the help of his son Kahreman Pacha Vrioni (1889–1955)' — the same incompatible dates as the Turkish article; member of the Albanian High Council of Regency in 1921; and 'Prime Minister of Albania: December 1921 – January 1922' — an office the English, Albanian and Turkish articles do not give him (they record only the Regency membership), so the premiership is carried in the record as the French article's claim, attributed. It states nothing about his religion."
