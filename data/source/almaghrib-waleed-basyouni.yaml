summary:
  ar: "صفحة معهد المغرب لدورة «حاملو المشعل» التي يدرّسها وليد بسيوني؛ تصفه بأنه رئيس معهد المغرب ومدير قسم العقيدة والأخلاق فيه، حاصل على الدكتوراه في العقيدة، وإمام مركز كلير ليك الإسلامي ومدير مؤتمر تكساس للدعوة."
  en: "AlMaghrib Institute's page for the course 'Torch Bearers', taught by Waleed Basyouni; it describes him as the President of AlMaghrib Institute and Head of Islamic Theology and Ethics, with a PhD in Theology, and as Imam of Clear Lake Islamic Center and Director of the Texas Dawah Convention."
  es: "Página del Instituto AlMaghrib para el curso \"Portadores de la Antorcha\", impartido por Waleed Basyouni; lo describe como el Presidente del Instituto AlMaghrib y Jefe de Teología y Ética Islámicas, con un Doctorado en Teología, y como Imán del Centro Islámico de Clear Lake y Director de la Convención Dawah de Texas."
  fr: "La page de l'Institut AlMaghrib consacrée au cours « Porteurs de flambeau », dispensé par Waleed Basyouni, le décrit comme le président de l'Institut AlMaghrib et responsable de la théologie et de l'éthique islamiques, titulaire d'un doctorat en théologie, ainsi que comme imam du Centre islamique de Clear Lake et directeur de la Convention Dawah du Texas."
  ur: "المغرب انسٹی ٹیوٹ کا صفحہ 'ٹارچ بیئررز' کورس کے لیے، جسے ولید بسیونی نے پڑھایا ہے۔ یہ انہیں المغرب انسٹی ٹیوٹ کے صدر اور اسلامی تھیولوجی اینڈ ایتھکس کے سربراہ، تھیالوجی میں پی ایچ ڈی کے ساتھ، اور کلیئر لیک اسلامک سینٹر کے امام اور ٹیکساس دعوۃ کنونشن کے ڈائریکٹر کے طور پر بیان کرتا ہے۔"
  tr: "Fas Enstitüsü'nün 'Meşale Taşıyıcıları' dersi için sayfası; onu Fas Enstitüsü başkanı ve oradaki İnanç ve Etik Bölümü direktörü, İnanç alanında doktora derecesine sahip, Clear Lake İslami Merkezi imamı ve Teksas Da'wah Konferansı direktörü olarak tanımlıyor."
  id: "Halaman Institut Maroko untuk kursus 'Pembawa Obor' yang diajarkan oleh Walid Basyouni; halaman tersebut menggambarkan dia sebagai presiden Institut Maroko dan direktur Departemen Kredo dan Etika di sana, memegang gelar PhD dalam kredo, imam Pusat Islam Danau Clear, dan direktur Konferensi Da'wah Texas."
