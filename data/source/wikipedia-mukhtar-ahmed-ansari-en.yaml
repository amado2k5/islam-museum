reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 by its recorded revision id via the MediaWiki API, the returned id asserted equal before any claim was drawn. It gives his birth on 25 December 1880 and his death, of a heart attack on a train from Mussoorie to Delhi, on 10 May 1936, and states that his family, the Ansaris of Yusufpur, were descended from the Sufi saint Abdullah Ansari of Herat — a family descent claim, not an affiliation of the man himself. It names no school for him."
