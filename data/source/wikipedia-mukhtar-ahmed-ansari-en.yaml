summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مختار أحمد أنصاري؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في محمد آباد بغازيبور سنة 1880، ودراسته الطب في مدراس ولندن وإدنبرة وريادته في الجراحة، ونشاطه الوطني ورئاسته المؤتمر والرابطة، وبعثته الطبية إلى البلقان، وتأسيسه الجامعة الملية الإسلامية ومستشاريته لها، ووفاته سنة 1936 ودفنه في حرم الجامعة."
  en: "English Wikipedia article on Mukhtar Ahmed Ansari; used for entity facts only. It recounts his 1880 birth at Mohammadabad in Ghazipur, his medical training at Madras, London and Edinburgh and his pioneering surgery, his nationalist career and Congress and Muslim League presidencies, the Balkan Wars medical mission, his founding and chancellorship of Jamia Millia Islamia, and his death in 1936 and burial on the university's premises."
