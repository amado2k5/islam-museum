summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مختار أحمد أنصاري؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في محمد آباد بغازيبور سنة 1880، ودراسته الطب في مدراس ولندن وإدنبرة وريادته في الجراحة، ونشاطه الوطني ورئاسته المؤتمر والرابطة، وبعثته الطبية إلى البلقان، وتأسيسه الجامعة الملية الإسلامية ومستشاريته لها، ووفاته سنة 1936 ودفنه في حرم الجامعة."
  en: "English Wikipedia article on Mukhtar Ahmed Ansari; used for entity facts only. It recounts his 1880 birth at Mohammadabad in Ghazipur, his medical training at Madras, London and Edinburgh and his pioneering surgery, his nationalist career and Congress and Muslim League presidencies, the Balkan Wars medical mission, his founding and chancellorship of Jamia Millia Islamia, and his death in 1936 and burial on the university's premises."
  es: "Artículo de la Wikipedia en inglés sobre Mukhtar Ahmed Ansari; utilizado únicamente para datos sobre la persona. Relata su nacimiento en 1880 en Mohammadabad, Ghazipur, su formación médica en Madrás, Londres y Edimburgo, su cirugía pionera, su trayectoria nacionalista y sus presidencias del Congreso y la Liga Musulmana, la misión médica en las Guerras Balcánicas, la fundación y el rectorado de Jamia Millia Islamia, y su fallecimiento en 1936 y su entierro en las instalaciones de la universidad."
  fr: "Article de Wikipédia en anglais sur Mukhtar Ahmed Ansari; utilisé uniquement à des fins d'information sur l'entité. Il relate sa naissance en 1880 à Mohammadabad, dans le district de Ghazipur, sa formation médicale à Madras, Londres et Édimbourg et ses interventions chirurgicales novatrices, son engagement nationaliste et ses présidences du Congrès et de la Ligue musulmane, sa mission médicale lors des guerres balkaniques, la fondation et la fonction de chancelier de l'université Jamia Millia Islamia, ainsi que sa mort en 1936 et son inhumation dans l'enceinte de l'université."
  ur: "مختار احمد انصاری پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں غازی پور کے محمد آباد میں ان کی 1880 کی پیدائش، مدراس، لندن اور ایڈنبرا میں ان کی طبی تربیت اور ان کی ابتدائی سرجری، ان کے قوم پرست کیریئر اور کانگریس اور مسلم لیگ کی صدارت، بلقان وار طبی مشن، جامعہ ملیہ اسلامیہ کی ان کی بانی اور چانسلر شپ، اور 1936 میں ان کی موت اور یونیورسٹی کی تدفین کا ذکر ہے۔"
  tr: "Mukhtar Ahmed Ansari hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1880'de Muhammadabad, Gazipur'daki doğumunu, Madras, Londra ve Edinburgh'daki tıp eğitimlerini, cerrahi alanındaki öncülüğünü, ulusal aktivizmini, konferans ve derneğin başkanlığını, Balkanlar'daki tıbbi misyonunu, Millia İslam Üniversitesi'nin kuruluşunu ve oradaki danışmanlık görevini, 1936'daki ölümünü ve üniversite kampüsünde defnedilmesini anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Mukhtar Ahmed Ansari; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya di Muhammadabad, Gazipur pada tahun 1880, studi kedokterannya di Madras, London, dan Edinburgh, perintisannya dalam bidang bedah, aktivisme nasionalnya, kepemimpinannya dalam konferensi dan asosiasi, misi medisnya ke Balkan, pendirian Millia Islamic University dan posisi penasihatnya di sana, kematiannya pada tahun 1936, serta pemakamannya di kampus universitas."
