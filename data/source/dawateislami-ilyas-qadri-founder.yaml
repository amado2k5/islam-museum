reliability_note: "His own organisation's official biography: a primary source for the movement's self-presentation, not independent corroboration. Read in full on 5 November 2026. It states he was born on 26 Ramadan 1369 AH / 12 July 1950 in Karachi, that his name is Muhammad with Ilyas as his name in general usage, his kunya Abu Bilal and his pen name Attar; that he studied under Mufti Waqar al-Din Razavi for 22 years; that he pledged allegiance to Ziauddin Ahmad al-Madani and received ijaza and khilafa from him and from 15 other spiritual leaders; that he served as imam at Nur Masjid, Kharadar; and that in 1981 he founded Dawat-e-Islami with the aim 'I must strive to reform myself and the people of the entire world.' Its service statistics are the organisation's own approximate report as of 20 October 2026 and are reported as such. Its Family section states: 'He has two sons and one daughter. His eldest son is Ubayd Raza al-Madani, who was appointed the shaykh's successor and spiritual representative.' That sentence is the attestation used for Ubaid Raza Attari's child_of relation to person/ilyas-qadri in this wave."
