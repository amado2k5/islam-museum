summary:
  ar: "مدخل «كازاسكر» في موسوعة TDV الإسلامية التركية بقلم محمد إپشيرلي ⁦(المجلد 25، أنقرة 2022، ص 140–143)⁩، ويتناول قاضي الجند في صدر الإسلام، والكازاسكر في الدول التركية الإسلامية، ونشأة الكازاسكرية في الدولة العثمانية، وتعيينه وعزله ورواتبه، ومهامه القضائية والإدارية، ومحاكمه في الديوان وفي داره."
  en: "The TDV İslâm Ansiklopedisi entry 'Kazasker' by Mehmet İpşirli (vol. 25, Ankara 2022, pp. 140–143). It covers the army judge in early Islam, the kazasker in the Turkish-Islamic states, the formal institution in the Ottoman state, appointment and dismissal, pay and grants, duties in the judiciary and administration, and the kazaskers' courts in the imperial council and at home."
