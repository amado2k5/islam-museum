summary:
  ar: "مدخل «كازاسكر» في موسوعة TDV الإسلامية التركية بقلم محمد إپشيرلي ⁦(المجلد 25، أنقرة 2022، ص 140–143)⁩، ويتناول قاضي الجند في صدر الإسلام، والكازاسكر في الدول التركية الإسلامية، ونشأة الكازاسكرية في الدولة العثمانية، وتعيينه وعزله ورواتبه، ومهامه القضائية والإدارية، ومحاكمه في الديوان وفي داره."
  en: "The TDV İslâm Ansiklopedisi entry 'Kazasker' by Mehmet İpşirli (vol. 25, Ankara 2022, pp. 140–143). It covers the army judge in early Islam, the kazasker in the Turkish-Islamic states, the formal institution in the Ottoman state, appointment and dismissal, pay and grants, duties in the judiciary and administration, and the kazaskers' courts in the imperial council and at home."
  es: "La entrada «Kazasker» de Mehmet İpşirli en la TDV İslâm Ansiklopedisi (vol. 25, Ankara 2022, pp. 140-143) abarca la figura del juez militar en los inicios del Islam, el kazasker en los estados turco-islámicos, la institución formal en el estado otomano, su nombramiento y destitución, su salario y concesiones, sus funciones en el poder judicial y la administración, y los tribunales de los kazaskers en el consejo imperial y en el ámbito nacional."
  fr: "L'article « Kazasker » de Mehmet İpşirli (vol. 25, Ankara 2022, pp. 140–143) dans la TDV İslâm Ansiklopedisi traite du juge militaire dans l'islam primitif, du kazasker dans les États turco-islamiques, de l'institution formelle dans l'État ottoman, de la nomination et de la révocation, de la rémunération et des subventions, des fonctions judiciaires et administratives, ainsi que des tribunaux des kazaskers au sein du conseil impérial et en Turquie."
  ur: "TDV İslâm Ansiklopedisi entry 'Kazasker' by Mehmet İpşirli ⁦(جلد 25، انقرہ 2022، صفحہ 140–143)⁩۔ اس میں ابتدائی اسلام میں فوجی جج، ترک اسلامی ریاستوں میں قازق، عثمانی ریاست میں رسمی ادارہ، تقرری اور برطرفی، تنخواہ اور گرانٹ، عدلیہ اور انتظامیہ میں فرائض، اور شاہی کونسل اور گھر میں قازقوں کی عدالتوں کا احاطہ کیا گیا ہے۔"
