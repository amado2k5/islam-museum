summary:
  ar: مقالة ويكيبيديا العربية عن علي باش حانبة؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في تونس سنة 1876 ووفاته في إسطنبول في 29 أكتوبر 1918، وتعليمه في المدرسة الصادقية ثم إجازته في القانون من جامعة باريس، وتأسيسه جريدة «التونسي» في 7 فبراير 1907 ضمن حركة الشباب التونسي، وتصنيفها له في «مدفونين في مقبرة الجلاز». لا تذكر المقالة دينًا أو مذهبًا له.
  en: Arabic Wikipedia article on Ali Bach Hamba; used for entity facts only. It gives his birth in Tunis in 1876 and his death in Istanbul on 29 October 1918, his education at Sadiki College and his law licence from the University of Paris, his founding of the newspaper Le Tunisien on 7 February 1907 within the Young Tunisians movement, and its categorisation of him among those buried in the Jellaz cemetery. The article states no religion or school for him.
