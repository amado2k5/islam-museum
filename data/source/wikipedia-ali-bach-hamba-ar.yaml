summary:
  ar: مقالة ويكيبيديا العربية عن علي باش حانبة؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في تونس سنة 1876 ووفاته في إسطنبول في 29 أكتوبر 1918، وتعليمه في المدرسة الصادقية ثم إجازته في القانون من جامعة باريس، وتأسيسه جريدة «التونسي» في 7 فبراير 1907 ضمن حركة الشباب التونسي، وتصنيفها له في «مدفونين في مقبرة الجلاز». لا تذكر المقالة دينًا أو مذهبًا له.
  en: Arabic Wikipedia article on Ali Bach Hamba; used for entity facts only. It gives his birth in Tunis in 1876 and his death in Istanbul on 29 October 1918, his education at Sadiki College and his law licence from the University of Paris, his founding of the newspaper Le Tunisien on 7 February 1907 within the Young Tunisians movement, and its categorisation of him among those buried in the Jellaz cemetery. The article states no religion or school for him.
  es: "Artículo de Wikipedia en árabe sobre Ali Bach Hamba; utilizado únicamente para datos biográficos. Indica su nacimiento en Túnez en 1876 y su fallecimiento en Estambul el 29 de octubre de 1918, su formación en el Colegio Sadiki y su licenciatura en Derecho por la Universidad de París, la fundación del periódico Le Tunisien el 7 de febrero de 1907 dentro del movimiento de los Jóvenes Tunecinos, y su inclusión en la lista de personas sepultadas en el cementerio de Jellaz. El artículo no menciona su religión ni su escuela."
  fr: "Article de Wikipédia en arabe sur Ali Bach Hamba; utilisé uniquement pour les informations biographiques. Il indique sa naissance à Tunis en 1876 et sa mort à Istanbul le 29 octobre 1918, ses études au collège Sadiki et son diplôme de droit à l’Université de Paris, la fondation du journal Le Tunisien le 7 février 1907 au sein du mouvement des Jeunes Tunisiens, et sa sépulture au cimetière de Jellaz. L’article ne mentionne ni sa religion ni son établissement scolaire."
  ur: "علی بچ حمبہ پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1876 میں تیونس میں ان کی پیدائش اور 29 اکتوبر 1918 کو استنبول میں ان کی موت، سادیکی کالج میں ان کی تعلیم اور پیرس یونیورسٹی سے ان کا لاء لائسنس، 7 فروری 1907 کو ینگ تیونس کی تحریک کے اندر اخبار Le Tunisien کی بنیاد، اور جیلاز میں دفن ہونے والوں میں ان کی درجہ بندی۔ آرٹیکل میں اس کے لیے کوئی مذہب یا اسکول نہیں بتایا گیا ہے۔"
  tr: "Ali Bash Hanba hakkında Arapça Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1876'da Tunus'ta doğduğunu, 29 Ekim 1918'de İstanbul'da öldüğünü, Sadiqiye Okulu'ndaki eğitimini, ardından Paris Üniversitesi'nden hukuk diplomasını aldığını, 7 Şubat 1907'de Tunus Gençlik Hareketi kapsamında 'El-Tunus' gazetesinin kurulmasını ve gazetenin 'Celaz Mezarlığı'nda defnedilmesi' olarak sınıflandırılmasını anlatmaktadır. Makalede dini veya mezhebi belirtilmemektedir."
  id: "Artikel Wikipedia bahasa Arab tentang Ali Bash Hanba; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya di Tunisia pada tahun 1876, kematiannya di Istanbul pada 29 Oktober 1918, pendidikannya di Sekolah Sadiqiya, kemudian gelar hukum dari Universitas Paris, pendirian surat kabar 'Al-Tunisi' pada 7 Februari 1907 sebagai bagian dari Gerakan Pemuda Tunisia, dan klasifikasinya sebagai 'Dimakamkan di Pemakaman Jalaz.' Artikel tersebut tidak menyebutkan agama atau sektenya."
