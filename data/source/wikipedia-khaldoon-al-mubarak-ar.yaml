summary:
  ar: "مقالة ويكيبيديا العربية عن خلدون المبارك؛ تذكر مولده في 1 كانون الأول 1975 — وهي قراءة مخالفة لقراءة المقالة الإنجليزية 27 كانون الثاني 1976 — وتتناول قيادته لمبادلة ومناصبه في حكومة أبو ظبي ورئاسته مانشستر سيتي."
  en: "Arabic Wikipedia article on Khaldoon Al Mubarak; it gives his birth as 1 December 1975 — a rival reading to the English article's 27 January 1976 — and covers his Mubadala leadership, his Abu Dhabi government roles and his chairmanship of Manchester City."
  es: "Artículo en árabe de la Wikipedia sobre Khaldoon Al Mubarak; indica que nació el 1 de diciembre de 1975 —una lectura que difiere del 27 de enero de 1976 que aparece en el artículo en inglés— y abarca su liderazgo en Mubadala, sus funciones en el gobierno de Abu Dhabi y su presidencia del Manchester City."
  fr: "L'article de Wikipédia en arabe sur Khaldoon Al Mubarak indique sa naissance au 1er décembre 1975 — une date qui diffère de celle de l'article en anglais, qui mentionne le 27 janvier 1976 — et aborde son rôle à la tête de Mubadala, ses fonctions au sein du gouvernement d'Abu Dhabi et sa présidence de Manchester City."
  ur: "خلدون المبارک پر عربی ویکیپیڈیا مضمون؛ یہ ان کی پیدائش 1 دسمبر 1975 کے طور پر کرتا ہے - ایک حریف انگریزی مضمون کے 27 جنوری 1976 کو پڑھتا ہے - اور اس میں ان کی مبادلہ قیادت، اس کی ابوظہبی حکومت کے کردار اور مانچسٹر سٹی کی ان کی چیئرمین شپ کا احاطہ کیا گیا ہے۔"
