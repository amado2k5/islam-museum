  ar: "دراسة أكاديمية عن إذاعات الدعوة السلفية في إندونيسيا؛ تعدّ راديو رودجا من أهم محطاتها، وتذكر أن رودجا راديو ورودجا تي في ويوفيد تي في تعمل تحت إدارة مجتمع رجال الأعمال المسلمين الإندونيسي (KPMI)."
