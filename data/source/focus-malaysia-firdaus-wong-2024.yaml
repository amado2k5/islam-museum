label: { en: "Focus Malaysia, March 2024 — Firdaus Wong and the KK Super Mart 'socks' affair" }
summary:
  ar: "مقالة صحيفة Focus Malaysia في 22 مارس 2024 عن دور فردوس وونغ في نشر قضية جوارب «الله» في متاجر KK Super Mart؛ فيها أكثر من 540 ألف متابع له على فيسبوك وأكثر من 350 ألفا على إنستغرام، ومتجره MyKampung Fresh Mart، ونظريات مؤامرة متداولة منسوبة لمروّجيها."
  en: "Focus Malaysia article of 22 March 2024 on Firdaus Wong's role in viralising the KK Super Mart 'Allah' socks affair; it counts more than 540,000 Facebook followers and more than 350,000 Instagram followers for him, notes his MyKampung Fresh Mart store, and reports circulating conspiracy claims about him as attributed claims."
  es: "Artículo de Focus Malaysia del 22 de marzo de 2024 sobre el papel de Firdaus Wong en la viralización del caso de los calcetines \"Allah\" de KK Super Mart; el artículo menciona que tiene más de 540.000 seguidores en Facebook y más de 350.000 en Instagram, señala su tienda MyKampung Fresh Mart e informa sobre teorías conspirativas que circulan sobre él, atribuyéndole dichas afirmaciones."
  fr: "L'article de Focus Malaysia du 22 mars 2024 sur le rôle de Firdaus Wong dans la viralité de l'affaire des chaussettes « Allah » de KK Super Mart; il compte plus de 540 000 abonnés sur Facebook et plus de 350 000 abonnés sur Instagram pour lui, note son magasin MyKampung Fresh Mart et rapporte des allégations de complot circulant à son sujet comme des allégations qui lui sont attribuées."
  ur: "KK سپر مارٹ 'اللہ' جرابوں کے معاملے کو وائرل کرنے میں فردوس وونگ کے کردار پر 22 مارچ 2024 کا ملائیشیا کا مضمون؛ یہ اس کے لیے 540,000 سے زیادہ فیس بک فالوورز اور 350,000 سے زیادہ انسٹاگرام فالوورز کا شمار کرتا ہے، اس کے MyKampung Fresh Mart اسٹور کو نوٹ کرتا ہے، اور اس کے بارے میں گردش کرنے والے سازشی دعوؤں کو منسوب دعووں کے طور پر رپورٹ کرتا ہے۔"
  tr: "Focus Malaysia tarafından 22 Mart 2024 tarihli bir makale, Firdous Wong'un KK Super Mart mağazalarında 'Allah' çorap meselesini yaymadaki rolü hakkında; Facebook'ta 540.000'den fazla, Instagram'da, MyKampung Fresh Mart mağazasında ve organizatörlerine atfedilen komplo teorilerini dolaştıran 350.000'den fazla takipçisi var."
  id: "Sebuah artikel oleh Focus Malaysia pada 22 Maret 2024, tentang peran Firdous Wong dalam menyebarkan isu kaus kaki 'Allah' di toko-toko KK Super Mart; Focus Malaysia memiliki lebih dari 540.000 pengikut di Facebook dan lebih dari 350.000 di Instagram, tokonya MyKampung Fresh Mart, serta menyebarkan teori konspirasi yang dikaitkan dengan promotor mereka."
title: "Conspiracy theories abound over KK Super Mart's socks saga; enters Firdaus Wong as the plot thickens"
