  ar: "مقالة ويكيبيديا التركية عن طلعت باشا؛ تُستخدم لوقائع الكيان فقط. يعطي صندوق معلوماتها دينه «الإسلام» مع الإشارة إلى البكتاشية، وتروي نظارته للداخلية وصدره الأعظم ومقتله في برلين سنة 1921."
  en: "Turkish Wikipedia article on Talat Pasha; used for entity facts only. Its infobox gives his religion as Islam with a Bektashi affiliation noted, and it recounts his interior ministry, his grand vizierate and his killing at Berlin in 1921."
  es: "Artículo de la Wikipedia en turco sobre Talat Pasha; utilizado únicamente para obtener información sobre la persona. Su ficha informativa indica que profesaba el islam, con una afiliación bektashi, y relata su ministerio del interior, su cargo de gran visir y su asesinato en Berlín en 1921."
  fr: "Article de Wikipédia en turc sur Talat Pacha; utilisé uniquement pour les informations sur l’entité. Son infobox indique qu’il était musulman, avec une affiliation bektashi, et relate son ministère de l’Intérieur, son grand vizirat et son assassinat à Berlin en 1921."
  ur: "طلعت پاشا پر ترک ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا انفو باکس بکتاشی سے وابستگی کے ساتھ اس کا مذہب اسلام کے طور پر دیتا ہے، اور اس میں اس کی وزارت داخلہ، اس کے عظیم وزیر اور 1921 میں برلن میں اس کے قتل کا ذکر ہے۔"
  tr: "Talat Paşa hakkında Türkçe Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Bilgi kutusunda dini Bektaşizm'e atıfta bulunarak \"İslam\" olarak verilir ve İçişleri Bakanlığı, Büyük Sandığı ve 1921'de Berlin'de suikastı anlatılır."
  id: "Artikel Wikipedia Turki tentang Talat Pasha; hanya digunakan untuk fakta entitas. Infobox di sini mencantumkan agamanya sebagai \"Islam\" dengan merujuk pada Bektashisme, dan menceritakan Kementerian Dalam Negerinya, Peti Besarnya, dan pembunuhannya di Berlin pada tahun 1921."
