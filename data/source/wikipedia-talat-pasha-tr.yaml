reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and re-fetched by the recorded revision id with content verified identical. It gives him born on 1 September 1874 at Kırcaali in the Edirne Vilayet, minister of the interior from 1913, minister of finance 1914–1917 and grand vizier from 4 February 1917 to 8 October 1918, and killed at Berlin on 15 March 1921. Its infobox gives his religion (dini) as Islam, with the Bektashi affiliation in parenthesis cited to Feroz Ahmad, İttihat ve Terakki (5th ed., p. 222). Its text reports — hedged as 'according to some sources' — that he was also a member of the Bektashi order, citing Hanioğlu's TDV İslâm Ansiklopedisi entry, and that he entered the Macedonia Risorta masonic lodge at Salonika."
