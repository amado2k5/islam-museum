  ar: "مقالة ويكيبيديا الإنجليزية عن عمرة خان الجندولي (نحو 1860–1904)؛ تُستخدم لوقائع الكيان فقط. تروي أنه خان جندول ثم نواب دير (1890–1895)، وأنه كان المسؤول الرئيس عن حملة چترال البريطانية سنة 1895، وأنه فرّ إلى أفغانستان بعدها ومات في كابل في 11 سبتمبر 1904."
  en: "English Wikipedia article on Umra Khan of Jandol (c. 1860–1904); used for entity facts only. It recounts that he was Khan of Jandol and then Nawab of Dir (1890–1895), that he was chiefly responsible for the British Chitral Expedition of 1895, and that after it he fled to Afghanistan and died at Kabul on 11 September 1904."
