summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عمرة خان الجندولي ⁦(نحو 1860–1904)⁩؛ تُستخدم لوقائع الكيان فقط. تروي أنه خان جندول ثم نواب دير (1890–1895)، وأنه كان المسؤول الرئيس عن حملة چترال البريطانية سنة 1895، وأنه فرّ إلى أفغانستان بعدها ومات في كابل في 11 سبتمبر 1904."
  en: "English Wikipedia article on Umra Khan of Jandol (c. 1860–1904); used for entity facts only. It recounts that he was Khan of Jandol and then Nawab of Dir (1890–1895), that he was chiefly responsible for the British Chitral Expedition of 1895, and that after it he fled to Afghanistan and died at Kabul on 11 September 1904."
  es: "Artículo de la Wikipedia en inglés sobre Umra Khan de Jandol (c. 1860–1904); utilizado únicamente para datos sobre la persona. Relata que fue Khan de Jandol y luego Nawab de Dir (1890–1895), que fue el principal responsable de la Expedición Británica a Chitral de 1895, y que después de ella huyó a Afganistán y murió en Kabul el 11 de septiembre de 1904."
  fr: "Article de Wikipédia en anglais sur Umra Khan de Jandol (vers 1860-1904); utilisé uniquement à titre informatif. Il relate qu'il fut Khan de Jandol puis Nawab de Dir (1890-1895), qu'il fut le principal artisan de l'expédition britannique de Chitral en 1895, et qu'après celle-ci, il s'enfuit en Afghanistan et mourut à Kaboul le 11 septembre 1904."
  ur: "جندول کے عمرا خان پر انگریزی ویکیپیڈیا مضمون (c. 1860-1904)؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں بتایا گیا ہے کہ وہ جندول کے خان اور پھر دیر (1890-1895) کے نواب تھے، کہ وہ 1895 کی برطانوی چترال مہم کے لیے بنیادی طور پر ذمہ دار تھے، اور اس کے بعد وہ افغانستان فرار ہو گئے اور 11 ستمبر 1904 کو کابل میں انتقال کر گئے۔"
