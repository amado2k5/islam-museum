label: { en: "Kakar, The Consolidation of the Central Authority in Afghanistan under Amir 'Abd al-Rahman, 1880–1896 (SOAS MPhil thesis, 1968)" }
summary:
  ar: "أطروحة ماجستير فلسفة لمحمد حسن كاكار في كلية الدراسات الشرقية والأفريقية بلندن (1968) عن توحيد السلطة المركزية في أفغانستان في عهد الأمير عبد الرحمن. تصف ملا مشك عالم ⁦(واسمه الأصلي دين محمد)⁩ بأنه أبرز زعماء «الحزب الوطني» في ثورة 1879–1880 وأكثرهم نفوذا، من قسم أندر من قبيلة غلزاي، وأنه وُلد سنة 1790، ونال لقبه من معلّمه ملا عبد الحكيم، وأسّس مدارس وكان ذا نفوذ ديني واسع."
  en: "M. Hasan Kakar's University of London (SOAS) MPhil thesis of 1968 on the consolidation of central authority in Afghanistan under Amir 'Abd al-Rahman. Its first chapter describes Mulla Mushk-i-'Alam Akhundzadah — by origin Din Mohammad, of the Andar section of the Ghilzay tribe, born in 1790 — as the most influential leader of the 'National Party' of the 1879–80 rising, a wealthy patron of madrasas whose laqab was given him by his teacher Mulla 'Abd al-Hakim. It names no Sufi order or school for him."
  es: "La tesis de maestría de M. Hasan Kakar de la Universidad de Londres (SOAS), de 1968, versó sobre la consolidación de la autoridad central en Afganistán bajo el emir Abd al-Rahman. Su primer capítulo describe a Mulla Mushk-i-'Alam Akhundzadah —cuyo nombre de nacimiento era Din Mohammad, perteneciente a la sección Andar de la tribu Ghilzay, nacido en 1790— como el líder más influyente del Partido Nacional durante el levantamiento de 1879-1880, un acaudalado mecenas de madrasas cuyo laqab le fue otorgado por su maestro Mulla Abd al-Hakim. No menciona ninguna orden o escuela sufí a la que pertenezca."
  fr: "La thèse de maîtrise (MPhil) de M. Hasan Kakar, soutenue en 1968 à l'Université de Londres (SOAS), porte sur la consolidation du pouvoir central en Afghanistan sous l'émir Abd al-Rahman. Son premier chapitre décrit Mulla Mushk-i-'Alam Akhundzadah – de son vrai nom Din Mohammad, issu de la branche Andar de la tribu Ghilzay et né en 1790 – comme le chef le plus influent du « Parti national » lors du soulèvement de 1879-1880. Riche mécène de madrasas, il reçut son laqab des mains de son maître, Mulla Abd al-Hakim. La thèse ne mentionne aucun ordre ni école soufie auquel il aurait appartenu."
  ur: "ایم حسن کاکڑ کا لندن یونیورسٹی (SOAS) کا ایم فل مقالہ 1968 میں امیر عبدالرحمٰن کے ماتحت افغانستان میں مرکزی اتھارٹی کے استحکام پر۔ اس کے پہلے باب میں ملا مشک عالم اخوندزادہ کو بیان کیا گیا ہے - بذریعہ اصل دین محمد، جو کہ غزائی قبیلے کے اندر سے تعلق رکھتا ہے، جو 1790 میں پیدا ہوا تھا - 1879-80 کی ابھرتی ہوئی 'نیشنل پارٹی' کے سب سے زیادہ بااثر رہنما کے طور پر، ایک امیر المؤمنین جس کے استاد ممد لعل نے انہیں 'مدرد رسول' عطا کیا تھا۔ الحکیم اس میں اس کے لیے کسی صوفی حکم یا مکتب کا نام نہیں ہے۔"
  tr: "Londra'daki Doğu ve Afrika Çalışmaları Okulu'nda Muhammed Hassan Kakar tarafından hazırlanan felsefe yüksek lisans tezi (1968), Prens Abdul Rahman döneminde Afganistan'da merkezi otoritenin birleşmesi üzerine yazılmıştır. Molla Muşk, gerçek adı Din Muhammed'dir, 1879–1880 devriminde Gilzai kabilesinin daha öfkeli bir kesiminden 'Ulusal Parti'nin en önde gelen ve etkili lideri olarak tanımlanır. 1790 doğumludur, unvanını öğretmeni Molla Abdul Hakim'den almış, okullar kurmuş ve geniş dini etkiye sahiptir."
  id: "Tesis magister filsafat oleh Muhammad Hassan Kakar di School of Oriental and African Studies di London (1968) tentang penyatuan otoritas pusat di Afghanistan selama masa pemerintahan Pangeran Abdul Rahman. Mullah Mushk menggambarkan seorang cendekiawan (nama aslinya Din Muhammad) sebagai pemimpin paling menonjol dan berpengaruh dari 'Partai Nasional' dalam revolusi 1879–1880, berasal dari bagian suku Gilzai yang lebih marah. Ia lahir pada tahun 1790, menerima gelarnya dari gurunya Mullah Abdul Hakim, mendirikan sekolah, dan memiliki pengaruh agama yang luas."
title: "The Consolidation of the Central Authority in Afghanistan under Amir 'Abd al-Rahman, 1880–1896"
