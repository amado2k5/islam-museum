reliability_note: "Read on 27 October 2026 in the ProQuest reproduction carried by 1library.net; the OCR is degraded and quotations from it are kept short. Kakar's account of Mushk-i-Alam rests on the 1888 Biographical Accounts of Chiefs and on Sayyid Qasim Rishtia; his birth year 1790 is the only birth-year attestation found for Mushk-i-Alam and is therefore carried as debated in the person record."
