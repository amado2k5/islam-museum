summary:
  ar: "أطروحة ماجستير فلسفة لمحمد حسن كاكار في كلية الدراسات الشرقية والأفريقية بلندن (1968) عن توحيد السلطة المركزية في أفغانستان في عهد الأمير عبد الرحمن. تصف ملا مشك عالم (واسمه الأصلي دين محمد) بأنه أبرز زعماء «الحزب الوطني» في ثورة 1879–1880 وأكثرهم نفوذا، من قسم أندر من قبيلة غلزاي، وأنه وُلد سنة 1790، ونال لقبه من معلّمه ملا عبد الحكيم، وأسّس مدارس وكان ذا نفوذ ديني واسع."
  en: "M. Hasan Kakar's University of London (SOAS) MPhil thesis of 1968 on the consolidation of central authority in Afghanistan under Amir 'Abd al-Rahman. Its first chapter describes Mulla Mushk-i-'Alam Akhundzadah — by origin Din Mohammad, of the Andar section of the Ghilzay tribe, born in 1790 — as the most influential leader of the 'National Party' of the 1879–80 rising, a wealthy patron of madrasas whose laqab was given him by his teacher Mulla 'Abd al-Hakim. It names no Sufi order or school for him."
