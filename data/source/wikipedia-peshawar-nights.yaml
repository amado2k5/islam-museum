summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن «ليالي بيشاور»؛ تُستخدم لوقائع الكيان فقط. تروي أن الكتاب من تأليف سلطان الواعظين شيرازي بوصفه رواية شاهد عيان لعشر ليالٍ من الحوار في بشاور بدأت في 27 يناير 1927 بين عالمين سنيين وعالم شيعي، نُشر بالفارسية في طهران وترجم إلى لغات عدة."
  en: "English Wikipedia article on Peshawar Nights; used for entity facts only. It recounts the book as Sultan al-Wa'izin Shirazi's firsthand account of ten nights of dialogue in Peshawar beginning 27 January 1927 between two Sunni scholars and a Shia author, originally written in Persian and published in Tehran with translations into several languages."
  es: "Artículo de la Wikipedia en inglés sobre Las noches de Peshawar; utilizado únicamente para datos sobre la entidad. Relata que el libro es el relato de primera mano del sultán al-Wa'izin Shirazi sobre diez noches de diálogo en Peshawar, que comenzaron el 27 de enero de 1927, entre dos eruditos sunitas y un autor chiíta. Originalmente escrito en persa y publicado en Teherán, con traducciones a varios idiomas."
  fr: "Article de Wikipédia en anglais sur « Les Nuits de Peshawar »; utilisé uniquement à des fins d'information. Il relate l'ouvrage comme le récit de première main du sultan al-Wa'izin Shirazi de dix nuits de dialogue à Peshawar, à partir du 27 janvier 1927, entre deux érudits sunnites et un auteur chiite. Initialement écrit en persan, il fut publié à Téhéran et traduit en plusieurs langues."
