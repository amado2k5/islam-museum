  ar: "مقالة ويكيبيديا الإنجليزية عن «ليالي بيشاور»؛ تُستخدم لوقائع الكيان فقط. تروي أن الكتاب من تأليف سلطان الواعظين شيرازي بوصفه رواية شاهد عيان لعشر ليالٍ من الحوار في بشاور بدأت في 27 يناير 1927 بين عالمين سنيين وعالم شيعي، نُشر بالفارسية في طهران وترجم إلى لغات عدة."
  en: "English Wikipedia article on Peshawar Nights; used for entity facts only. It recounts the book as Sultan al-Wa'izin Shirazi's firsthand account of ten nights of dialogue in Peshawar beginning 27 January 1927 between two Sunni scholars and a Shia author, originally written in Persian and published in Tehran with translations into several languages."
