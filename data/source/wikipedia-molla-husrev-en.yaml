reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). Every fact it carries is cited to Koca's TDV entry, the İslam Düşünce Atlası or Repp 1986, and it is careful with uncertainty ('possibly in 1397', 'may have studied', death 'in 1480-81, possibly October 1480'). Its text names no legal school for him: the only Hanafi-adjacent datum is Mehmed II's reported epithet 'the Abu Hanifa of our time', which is praise, not an attestation of school. Read live on 1 November 2026; the article's own page property grounds Wikidata item Q12244864."
