summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الملا خسرو، مراجعة 2 آذار 2026؛ مبنية على مدخل موسوعة TDV بقلم فرحات كوجا وعلى كتاب راب «مفتي إسطنبول» (1986): ميلاده نحو 1397 في قرقين قرب سيفاس، وإجازته من يوسف بالي ابن الملا فناري، ومسيرته قاضياً ومدرساً وقاضي عسكر، وقضاؤه بإسطنبول سنة 1459، ووفاته بها سنة 1480–1481 ودفنه في مدرسته ببورصة."
  en: "English Wikipedia article on Molla Hüsrev, revision of 2 March 2026; built on Ferhat Koca's TDV İslâm Ansiklopedisi entry and R. C. Repp's The Müfti of Istanbul (1986) — his birth possibly in 1397 at Kargın near Sivas, his ijaza from Yûsuf Bâlî son of Molla Fenârî, his career as müderris, kazasker and qadi, his appointment as qadi of Istanbul in 1459, his death at Istanbul in 1480-81 and burial at his Bursa madrasa."
