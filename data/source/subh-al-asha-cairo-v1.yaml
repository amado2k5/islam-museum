summary:
  ar: "الجزء الأول من «صبح الأعشى» لأبي العباس أحمد القلقشندي، طبع بمطبعة دار الكتب المصرية بالقاهرة سنة 1340هـ/1922م؛ فيه خطبة المؤلف وفهرس أبواب الكتاب كله والمقدمة."
  en: "Vol. 1 of Abu al-Abbas Ahmad al-Qalqashandi's Subh al-a'sha, printed at the Dar al-Kutub al-Misriyya press, Cairo, 1340/1922; it holds the author's preface, the plan of the whole book and the introduction."
  es: "Volumen 1 de Subh al-a'sha de Abu al-Abbas Ahmad al-Qalqashandi, impreso en la imprenta Dar al-Kutub al-Misriyya, El Cairo, 1340/1922; contiene el prefacio del autor, el esquema de todo el libro y la introducción."
  fr: "Volume 1 du Subh al-a'sha d'Abu al-Abbas Ahmad al-Qalqashandi, imprimé à l'imprimerie Dar al-Kutub al-Misriyya, Le Caire, 1340/1922; il contient la préface de l'auteur, le plan de l'ensemble du livre et l'introduction."
  ur: "والیوم ابو العباس احمد القلقشاندی کی سبھ العشاء کا 1، دار الکتب المصریہ پریس، قاہرہ، 1340/1922 میں مطبوعہ؛ اس میں مصنف کا دیباچہ، پوری کتاب کا منصوبہ اور تعارف موجود ہے۔"
  tr: "Abu al-Abbas Ahmed al-Qalqashandi tarafından yazılmış \"Subh al-A'sha\"nın ilk cildi, 1340 Hicri / 1922 yılında Kahire'deki Mısır Ulusal Kütüphane Matbaası tarafından basılmıştır; yazarın vaazını, kitabın tüm bölümlerinin dizini ve girişini içerir."
  id: "Volume pertama \"Subh al-A'sha\" karya Abu al-Abbas Ahmad al-Qalqashandi, dicetak oleh Percetakan Perpustakaan Nasional Mesir di Kairo pada tahun 1340 H / 1922 M; memuat khotbah penulis, indeks seluruh bab dalam buku, dan pengantar."
