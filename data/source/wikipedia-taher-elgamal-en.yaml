summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن طاهر الجمل ⁦(مواليد 18 أغسطس 1955)⁩؛ لوقائع الكيان فقط: مشفِّر مصري-أمريكي وُلد في مصر، بكالوريوس هندسة كهربائية من جامعة القاهرة 1977 وماجستير 1981 ودكتوراه 1984 من ستانفورد تحت إشراف مارتن هلمان، انضم إلى مختبرات إتش بي 1984، وورقته عام 1985 «نظام تعمية بمفتاح عمومي ومخطط توقيع مبنيان على اللوغاريتمات المتقطعة» اقترحت نظام الجمل للتعمية ومخطط الجمل للتوقيع الذي صار أساس خوارزمية التوقيع الرقمي DSA ومعيار NIST للتوقيع الرقمي، وكان عالماً رئيساً في نتسكيب 1995–1998 حيث دفع بروتوكول SSL الذي بنيت عليه TLS وHTTPS حتى لُقّب «أب SSL»، وأسس سيكيوريفاي 1998، ونال جائزة مؤتمر RSA للإنجاز مدى الحياة 2009 وجائزة ماركوني 2019 مع بول كوشر، وانتُخب للأكاديمية الوطنية للهندسة 2022."
  en: "English Wikipedia article on Taher Elgamal ⁦(born 18 August 1955)⁩; entity facts only: Egyptian-American cryptographer born in Egypt, BSc in electrical engineering from Cairo University in 1977, MS 1981 and PhD 1984 at Stanford under Martin Hellman, joined HP Labs in 1984; his 1985 paper 'A public key cryptosystem and a signature scheme based on discrete logarithms' proposed the ElGamal encryption system and the ElGamal signature scheme that became the basis of the Digital Signature Algorithm ⁦(DSA)⁩ adopted by NIST as the Digital Signature Standard; chief scientist at Netscape 1995–1998 where he drove SSL — basis of TLS and HTTPS — and was called 'father of SSL'; founded Securify in 1998, received the RSA Conference 2009 Lifetime Achievement Award and the 2019 Marconi Prize with Paul Kocher, and was elected to the National Academy of Engineering in 2022."
  es: "Artículo de la Wikipedia en inglés sobre Taher Elgamal (nacido el 18 de agosto de 1955); solo datos de la entidad: criptógrafo egipcio-estadounidense nacido en Egipto, licenciado en ingeniería eléctrica por la Universidad de El Cairo en 1977, máster en 1981 y doctor en 1984 en Stanford bajo la dirección de Martin Hellman, se unió a HP Labs en 1984; su artículo de 1985 'Un criptosistema de clave pública y un esquema de firma basado en logaritmos discretos' propuso el sistema de cifrado ElGamal y el esquema de firma ElGamal que se convirtieron en la base del Algoritmo de Firma Digital (DSA) adoptado por el NIST como el Estándar de Firma Digital; científico jefe en Netscape de 1995 a 1998, donde impulsó SSL —base de TLS y HTTPS— y fue llamado 'padre de SSL'; fundó Securify en 1998, recibió el Premio a la Trayectoria Profesional de la Conferencia RSA 2009 y el Premio Marconi 2019 con Paul Kocher, y fue elegido miembro de la Academia Nacional de Ingeniería en 2022."
  fr: "Article Wikipédia en anglais sur Taher Elgamal (né le 18 août 1955); informations sur l’entité uniquement: cryptographe égypto-américain né en Égypte, titulaire d’une licence en génie électrique de l’Université du Caire (1977), d’une maîtrise (1981) et d’un doctorat (1984) de Stanford sous la direction de Martin Hellman, a rejoint HP Labs en 1984; son article de 1985 intitulé « A public key cryptosystem and a signature scheme based on discrete logarithms » a proposé le système de chiffrement ElGamal et le schéma de signature ElGamal qui sont devenus la base de l’algorithme de signature numérique (DSA) adopté par le NIST comme norme de signature numérique; scientifique en chef chez Netscape de 1995 à 1998 où il a piloté le SSL — base du TLS et du HTTPS — et a été surnommé le « père du SSL »; Il a fondé Securify en 1998, a reçu le prix RSA pour l'ensemble de sa carrière lors de la conférence 2009 et le prix Marconi 2019 avec Paul Kocher, et a été élu à l'Académie nationale d'ingénierie en 2022."
  ur: "Taher Elgamal ⁦(پیدائش 18 اگست 1955)⁩ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق: مصر میں پیدا ہونے والے مصری نژاد امریکی کرپٹوگرافر، 1977 میں قاہرہ یونیورسٹی سے الیکٹریکل انجینئرنگ میں بی ایس سی، ایم ایس 1981 اور پی ایچ ڈی اسٹینفورڈ میں مارٹن ہیل مین کے تحت، 1984 میں HP لیبز میں شامل ہوئے۔ اس کا 1985 کا مقالہ 'ایک عوامی کلیدی کرپٹو سسٹم اور مجرد لوگارتھمز پر مبنی ایک دستخطی اسکیم' نے ElGamal انکرپشن سسٹم اور ElGamal دستخطی اسکیم کی تجویز پیش کی جو NIST کی طرف سے ڈیجیٹل دستخطی معیار کے طور پر اختیار کیے گئے ڈیجیٹل سگنیچر الگورتھم (DSA) کی بنیاد بنی۔ Netscape 1995-1998 کے چیف سائنسدان جہاں انہوں نے SSL چلایا - TLS اور HTTPS کی بنیاد - اور 'SSL کا باپ' کہلاتا تھا۔ 1998 میں Securify کی بنیاد رکھی، RSA کانفرنس 2009 لائف ٹائم اچیومنٹ ایوارڈ اور پال کوچر کے ساتھ 2019 مارکونی پرائز حاصل کیا، اور 2022 میں نیشنل اکیڈمی آف انجینئرنگ کے لیے منتخب ہوئے۔"
