  fr: "Le texte du commentaire d'al-Qurtubi divisé par verset tel que servi par Quran.com, avec les numéros de page imprimés entre crochets; lire ici pour 16:8, 36:36, 42:29, 65:12 et 74:31."
  tr: "El-Qurtubi'nin Tafsir'inin metni, Quran.com cephede gösterildiği gibi ayetlerde parçalanmış olup, parantez içinde sayfa numaraları yer almaktadır; Tafsirler 16:8, 36:36, 42:29, 65:12 ve 74:31 okunmuştur."
  id: "Teks Tafsir Al-Qurtubi terfragmentasi pada ayat-ayat seperti yang ditunjukkan pada fasad Quran.com, berisi nomor halaman dalam tanda kurung; Tafsir 16:8, 36:36, 42:29, 65:12, dan 74:31 dibacakan darinya."
