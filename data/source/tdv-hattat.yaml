reliability_note: "Read in full on 1 November 2026 in the web edition, from its first paragraph to the bibliography. Facts are rewritten in the museum's own words and cited to the printed range of the entry (493–499), since the web edition gives no finer anchor. The entry reports some facts from older sources (the Menakıb-ı Hünerverân's wage figures, Ibn al-Sa'igh's origin of the licence); those are cited here as the entry reports them, and the older works were not read for this record."
