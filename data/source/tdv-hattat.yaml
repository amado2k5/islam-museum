summary:
  ar: "مدخل «HATTAT» (الخطّاط) في موسوعة TDV الإسلامية التركية بقلم م. أوغور درمان (المجلد 16، إسطنبول 1997، ص 493–499). يتناول معنى الكلمة وتاريخها، وكتّاب الخط وورّاقيه، والمعلّم والتلميذ (المشق)، ومراحل التعليم والإجازة (الإجازة ومراسمها)، والتوقيعات والشجرات، والمدارس الحديثة للخط، وأسماء الخطاطين مع تواريخ وفاتهم، وأهم المصادر البيبليوغرافية."
  en: "The TDV İslâm Ansiklopedisi entry 'HATTAT' (calligrapher) by M. Uğur Derman (vol. 16, Istanbul 1997, pp. 493–499). It covers the meaning and history of the word, the scribes and copyists before the calligrapher, the master-pupil practice (meşk), the stages and ceremony of the licence (icâzet), signatures and lineages, the Ottoman schools and court offices, a list of masters with their dates of death, and the principal bibliographic works."
