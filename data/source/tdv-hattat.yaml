summary:
  ar: "مدخل «HATTAT» ⁦(الخطّاط)⁩ في موسوعة TDV الإسلامية التركية بقلم م. أوغور درمان ⁦(المجلد 16، إسطنبول 1997، ص 493–499)⁩. يتناول معنى الكلمة وتاريخها، وكتّاب الخط وورّاقيه، والمعلّم والتلميذ ⁦(المشق)⁩، ومراحل التعليم والإجازة ⁦(الإجازة ومراسمها)⁩، والتوقيعات والشجرات، والمدارس الحديثة للخط، وأسماء الخطاطين مع تواريخ وفاتهم، وأهم المصادر البيبليوغرافية."
  en: "The TDV İslâm Ansiklopedisi entry 'HATTAT' (calligrapher) by M. Uğur Derman (vol. 16, Istanbul 1997, pp. 493–499). It covers the meaning and history of the word, the scribes and copyists before the calligrapher, the master-pupil practice (meşk), the stages and ceremony of the licence (icâzet), signatures and lineages, the Ottoman schools and court offices, a list of masters with their dates of death, and the principal bibliographic works."
  es: "La entrada «HATTAT» (calígrafo) de la TDV İslâm Ansiklopedisi, de M. Uğur Derman (vol. 16, Estambul, 1997, págs. 493-499), abarca el significado y la historia de la palabra, los escribas y copistas anteriores al calígrafo, la práctica maestro-discípulo (meşk), las etapas y la ceremonia de la licencia (icâzet), las firmas y los linajes, las escuelas otomanas y las oficinas de la corte, una lista de maestros con sus fechas de fallecimiento y las principales obras bibliográficas."
  fr: "L’article « HATTAT » (calligraphe) de M. Uğur Derman (vol. 16, Istanbul, 1997, p. 493-499) dans la TDV İslâm Ansiklopedisi traite de la signification et de l’histoire du mot, des scribes et copistes qui ont précédé le calligraphe, de la pratique du maître et de l’élève (meşk), des étapes et de la cérémonie de l’obtention de la licence (icâzet), des signatures et des lignées, des écoles et des offices de la cour ottomans, d’une liste de maîtres avec leurs dates de décès et des principales références bibliographiques."
  ur: "TDV İslâm Ansiklopedisi اندراج 'HATTAT' ⁦(خطاط)⁩ از M. Uğur Derman ⁦(جلد 16، استنبول 1997، صفحہ 493–499)⁩۔ اس میں لفظ کے معنی اور تاریخ کا احاطہ کیا گیا ہے، خطاط سے پہلے کاتب اور نقل کرنے والے، ماسٹر پیپل پریکٹس (meşk)، لائسنس کے مراحل اور تقریب (icâzet)، دستخط اور نسب، عثمانی اسکولوں اور عدالتی دفاتر، ان کی تاریخ وفات کے ساتھ ماسٹرز کی فہرست، اور بنیادی کتابیات کے کام۔"
  tr: "M. Ugur Derman tarafından yazılan Türk İslami TDV Ansiklopedisi'nde \"HATTAT\" (Hattat) hakkında madde (Cilt 16, İstanbul 1997, ss. 493–499). Kelimenin anlamı ve tarihi, hat kitabı ve belgeleri, öğretmen ve öğrenci (öğretmen), eğitim aşamaları ve ijaze (ijaze ve törenleri), imzalar ve ağaçlar, modern hat okulları, hat yazarlarının isimleri ve ölüm tarihleri ile en önemli bibliyografik kaynakları kapsar."
  id: "Entri tentang \"HATTAT\" (Kaligrafer) dalam Ensiklopedia TDV Islam Turki oleh M. Ugur Derman (Vol. 16, Istanbul 1997, hlm. 493–499). Buku ini mencakup makna dan sejarah kata, buku kaligrafi dan dokumennya, guru dan murid (guru), tahapan pendidikan dan ijazah (ijazah dan upacara), tanda tangan dan pohon, sekolah kaligrafi modern, nama-nama kaligrafer beserta tanggal kematiannya, serta sumber bibliografi terpenting."
