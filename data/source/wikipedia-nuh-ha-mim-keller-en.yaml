summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن نوح حا ميم كلر ⁦(مواليد 1954)⁩، عالم ومترجم أمريكي مسلم مقيم في عمّان؛ تنص في متنها على أنه انضم إلى الطريقة الشاذلية الصوفية وصار تلميذًا لعبد الرحمن الشاغوري من 1982 وأخذ عنه إجازته، وتسرد تحوّله إلى الإسلام سنة 1977 وترجماته ومنها «عمدة السالك» و«القرآن منظورًا»."
  en: "The English Wikipedia article on Nuh Ha Mim Keller (born 1954), American Muslim scholar and translator living in Amman; its text states that he joined the Shadhili Sufi order and was a disciple of Abd al-Rahman al-Shaghouri from 1982, receiving his authorization from him, and covers his 1977 conversion to Islam and his translations, including Reliance of the Traveller and The Quran Beheld."
  es: "El artículo de la Wikipedia en inglés sobre Nuh Ha Mim Keller (nacido en 1954), erudito y traductor musulmán estadounidense que vive en Amán, afirma que se unió a la orden sufí Shadhili y fue discípulo de Abd al-Rahman al-Shaghouri desde 1982, recibiendo su autorización, y abarca su conversión al Islam en 1977 y sus traducciones, incluidas Reliance of the Traveller y The Quran Beheld."
  fr: "L'article de Wikipédia en anglais sur Nuh Ha Mim Keller (né en 1954), érudit et traducteur musulman américain vivant à Amman; son texte indique qu'il a rejoint l'ordre soufi Shadhili et a été disciple d'Abd al-Rahman al-Shaghouri à partir de 1982, recevant son autorisation de lui, et couvre sa conversion à l'islam en 1977 et ses traductions, notamment Reliance of the Traveller et The Quran Beheld."
  ur: "انگریزی ویکیپیڈیا مضمون نوہ ہا میم کیلر ⁦(پیدائش 1954)⁩، عمان میں رہنے والے امریکی مسلمان اسکالر اور مترجم؛ اس کے متن میں کہا گیا ہے کہ اس نے شادھیلی صوفی آرڈر میں شمولیت اختیار کی اور 1982 سے عبدالرحمن الشغوری کے شاگرد تھے، ان سے اس کی اجازت حاصل کی، اور اس میں ان کے 1977 میں اسلام قبول کرنے اور اس کے تراجم کا احاطہ کیا گیا ہے، بشمول ریلائنس آف دی ٹریولر اور قرآن بیہلڈ۔"
  tr: "Umman'da yaşayan Amerikalı Müslüman alim ve çevirmen Noah Hamim Keller (d. 1954) hakkında İngilizce Wikipedia makalesi, onun Şadhili Sufi tarikatına katıldığını ve 1982'de Abdul Rahman Al-Shaghuri'nin öğrencisi olduğunu, ondan icazah aldığını belirtir. Ayrıca 1977'de İslam'a geçişini ve \"Umdat al-Salik\" ile \"Kur'an'ın bir bakış açısında\" gibi çevirilerini anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Noah Hamim Keller (lahir 1954), seorang ulama dan penerjemah Muslim Amerika yang tinggal di Oman, menyatakan bahwa ia bergabung dengan tarekat Sufi Shadhili dan menjadi murid Abdul Rahman Al-Shaghouri pada tahun 1982, menerima ijazah darinya. Artikel itu juga menceritakan konversinya ke Islam pada tahun 1977 dan terjemahannya, termasuk \"Umdat al-Salik\" dan \"Al-Quran dari Perspektif.\""
