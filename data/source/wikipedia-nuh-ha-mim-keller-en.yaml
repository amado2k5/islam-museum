summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن نوح حا ميم كلر (مواليد 1954)، عالم ومترجم أمريكي مسلم مقيم في عمّان؛ تنص في متنها على أنه انضم إلى الطريقة الشاذلية الصوفية وصار تلميذًا لعبد الرحمن الشاغوري من 1982 وأخذ عنه إجازته، وتسرد تحوّله إلى الإسلام سنة 1977 وترجماته ومنها «عمدة السالك» و«القرآن منظورًا»."
  en: "The English Wikipedia article on Nuh Ha Mim Keller (born 1954), American Muslim scholar and translator living in Amman; its text states that he joined the Shadhili Sufi order and was a disciple of Abd al-Rahman al-Shaghouri from 1982, receiving his authorization from him, and covers his 1977 conversion to Islam and his translations, including Reliance of the Traveller and The Quran Beheld."
