reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision via the MediaWiki API on 1 November 2026; a fact is used only where the article cites a source for it (Wikipedia broad rule). Used for her birth in Karachi on 13 August 1973, her mother the journalist and editor Muneeza Shamsie, her great-aunt the writer Attia Hosain, her Karachi Grammar School, Hamilton College and University of Massachusetts Amherst education, her novels from In the City by the Sea (1998) to Best of Friends (2022), her non-fiction Offence — The Muslim Case (2009), her Women's Prize for Fiction for Home Fire, her move to London in 2007 and her dual Pakistani and British nationality. The article's statement that she considers herself Muslim is cited there to the Evening Standard profile, which is registered separately and is the source used for her self-description."
