  ur: "ابشیہی، المستطرف فی کل فن مستظرف ⁦(قاہرہ کی سنگی طباعت، بولاک پیرس کا نسخہ)⁩"
summary:
  ar: "نسخة ممسوحة من مكتبة بولاك (BULAC RES MON 8 62) لطبعة قاهرية من المستطرف، فيها فهرس الأبواب الأربعة والثمانين وخطبة المؤلف، وفي آخرها خاتمة الطبع."
  en: "A scan from the BULAC library (RES MON 8 62) of a Cairo printing of al-Mustatraf, with the list of its eighty-four chapters and the author's preface, and the printer's colophon at the end."
  ur: "بولاک لائبریری (RES MON 8 62) سے المستطرف کی قاہرہ کی ایک طباعت کا اسکین، جس میں چوراسی ابواب کی فہرست اور مصنف کا خطبہ ہے، اور آخر میں طباعت کا اختتامیہ۔"
  es: "Escaneo de la biblioteca BULAC (RES MON 8 62) de una edición de El Cairo de al-Mustatraf, con la lista de sus ochenta y cuatro capítulos, el prefacio del autor y el colofón del impresor al final."
  fr: "Un scan de la bibliothèque BULAC (RES MON 8 62) d'une impression du Caire d'al-Mustatraf, avec la liste de ses quatre-vingt-quatre chapitres et la préface de l'auteur, et le colophon de l'imprimeur à la fin."
  tr: "BULAC RES MON 8 62 kütüphanesinden taranmış bir kopya, Al-Mustatraf'ın Kahire baskısının 8 62 kopyası, seksen dört bölümün dizini ve yazarın vaazını içeriyor, ayrıca baskının sonunda da kapanıyor."
  id: "Salinan hasil scan dari perpustakaan BULAC RES MON 8 62 edisi Kairo Al-Mustatraf, berisi indeks delapan puluh empat bab dan khotbah penulis, serta di akhir kesimpulan edisi."
