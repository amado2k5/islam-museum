reliability_note: "The OCR of this scan stores each line in reversed character order; it was read by reversing the lines, and remains noisy. The colophon (PDF p. 698) names the press as being in Cairo and the sponsor as 'Ali Agha al-Turjuman'; its year reads as '[five] and seventy and two hundred after the thousand', probably 1275 AH, but the units word is damaged (needs_source). The title page (PDF p. 9) gives the author as Shihab al-Din Ahmad al-Abshihi. Citations are PDF pages; the printed-page offset was not established. Names and numbers are unverified against the images."
