summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد رحيم باوا محيي الدين ⁦(توفي 8 ديسمبر 1986)⁩، معلّم ناطق بالتاميلية ومتصوّف من سريلانكا أسّس زمالة باوا محيي الدين في فيلادلفيا؛ يسجل صندوق معلوماتها تاريخ ميلاده مجهولًا، وتسرد مسيرته في سريلانكا والولايات المتحدة وكتبه وضريحه."
  en: "The English Wikipedia article on Muhammad Raheem Bawa Muhaiyaddeen (died 8 December 1986), Tamil-speaking teacher and Sufi mystic from Sri Lanka who founded the Bawa Muhaiyaddeen Fellowship in Philadelphia; its infobox records his birth date as unknown, and its text covers his Sri Lankan and American careers, his books, and his mausoleum."
  es: "El artículo de la Wikipedia en inglés sobre Muhammad Raheem Bawa Muhaiyaddeen (fallecido el 8 de diciembre de 1986), maestro de habla tamil y místico sufí de Sri Lanka que fundó la Bawa Muhaiyaddeen Fellowship en Filadelfia; su ficha informativa indica que se desconoce su fecha de nacimiento, y su texto abarca su trayectoria profesional en Sri Lanka y Estados Unidos, sus libros y su mausoleo."
  fr: "L'article de Wikipédia en anglais sur Muhammad Raheem Bawa Muhaiyaddeen (décédé le 8 décembre 1986), enseignant tamoul et mystique soufi du Sri Lanka qui a fondé la Bawa Muhaiyaddeen Fellowship à Philadelphie; son infobox indique que sa date de naissance est inconnue, et son texte couvre ses carrières sri-lankaise et américaine, ses livres et son mausolée."
