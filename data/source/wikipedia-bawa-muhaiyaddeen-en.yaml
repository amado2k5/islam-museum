  ar: "مقالة ويكيبيديا الإنجليزية عن محمد رحيم باوا محيي الدين (توفي 8 ديسمبر 1986)، معلّم ناطق بالتاميلية ومتصوّف من سريلانكا أسّس زمالة باوا محيي الدين في فيلادلفيا؛ يسجل صندوق معلوماتها تاريخ ميلاده مجهولًا، وتسرد مسيرته في سريلانكا والولايات المتحدة وكتبه وضريحه."
  en: "The English Wikipedia article on Muhammad Raheem Bawa Muhaiyaddeen (died 8 December 1986), Tamil-speaking teacher and Sufi mystic from Sri Lanka who founded the Bawa Muhaiyaddeen Fellowship in Philadelphia; its infobox records his birth date as unknown, and its text covers his Sri Lankan and American careers, his books, and his mausoleum."
