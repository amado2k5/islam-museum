reliability_note: "DISCLOSED FALLBACK — NOT A DIRECT READ: Facebook profile/page fetch is blocked in the build environment, so this figure was NOT read directly by the writer of this record. It rests on the wave-195 harvest's same-day read (7 November 2026) of the post metadata of a post on his Facebook author page dated August 2026, which showed 320,000 followers. The harvest does not give the page's handle, and web searches on 7 November 2026 (his Latin name with Facebook/Ethiopia terms, and Amharic-script terms for Ustaz Abu Hayder) did not surface the page's exact name or URL, so NO URL is recorded here rather than a guessed one — this record deliberately carries no URL field. The figure is a dated platform figure as reported by the harvest, not a museum measurement and not the writer's own read. The page metadata as reported names no birth date and no school of law."
