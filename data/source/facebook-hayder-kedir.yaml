summary:
  ar: "صفحة حيدر كدير المؤلفية على فيسبوك؛ بلغت 320,000 متابع وفق قراءة بيانات منشور على الصفحة مؤرخ في أغسطس 2026 أجراها حصاد الموجة 195 في 7 نوفمبر 2026، ولم يمكن تثبيت عنوان الصفحة الدقيق."
  en: "Hayder Kedir's Facebook author page; it counted 320,000 followers in the wave-195 harvest's 7 November 2026 read of the metadata of a post on the page dated August 2026, and the page's exact URL could not be pinned."
  es: "La página de autor de Hayder Kedir en Facebook; contaba con 320.000 seguidores en la cosecha wave-195 del 7 de noviembre de 2026, según la lectura de los metadatos de una publicación en la página con fecha de agosto de 2026, y no se pudo fijar la URL exacta de la página."
  fr: "La page Facebook d'auteur de Hayder Kedir; elle comptait 320 000 abonnés lors de la vague 195, le 7 novembre 2026, lors de la lecture des métadonnées d'une publication sur la page datée d'août 2026, et l'URL exacte de la page n'a pas pu être épinglée."
  ur: "حیدر کدیر کا فیس بک مصنف صفحہ؛ اس نے اگست 2026 کے صفحہ پر ایک پوسٹ کے میٹا ڈیٹا کو پڑھنے کی لہر-195 فصل کے 7 نومبر 2026 میں 320,000 پیروکاروں کی گنتی کی، اور صفحہ کا درست URL پن نہیں کیا جا سکا۔"
  tr: "Wave 195 Harvest tarafından 7 Kasım 2026'da Ağustos 2026 tarihli sayfada yayımlanan verilerin okunmasına göre Haider Kadir'in Facebook'taki yazar sayfası 320.000 takipçiye ulaştı ve sayfa başlığı tam olarak sabitlenemedi."
  id: "Halaman penulis Haider Kadir di Facebook mencapai 320.000 pengikut menurut pembacaan data yang dipublikasikan di halaman tanggal Agustus 2026 yang dilakukan oleh Wave 195 Harvest pada 7 November 2026, dan judul halaman yang tepat tidak dapat dipin."
