  ar: "مقالة ويكيبيديا الإنجليزية عن خواندمير (غياث الدين محمد)؛ تعطي حياته 1475/76–1535/36، مولده في هراة ووفاته في دلهي ودفنه قرب ضريح نظام الدين أولياء، وتذكر أن فقدانه منصبه بعد فتح الصفويين هراة كان غالبًا لأسباب دينية سياسية إذ كان خواندمير مسلمًا سنّيًا والصفويون شيعة متحمسين."
  en: "English Wikipedia article on Khvandamir (Ghiyath al-Din Muhammad); it gives his life as 1475/76-1535/36, his birth at Herat, his death at Delhi and burial near the shrine of Nizamuddin Auliya, and states that his loss of office after the Safavid conquest of Herat was most likely for religio-political reasons, as Khvandamir was a Sunni Muslim whereas the Safavids were zealous Shia Muslims."
