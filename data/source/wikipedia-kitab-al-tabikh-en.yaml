summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن كتاب الطبيخ لابن سيار الوراق؛ لوقائع الكيان فقط: أقدم كتاب طبخ عربي باقٍ، أكثر من 600 وصفة في 132 باباً، جمع من مطابخ القرنين الثامن والتاسع العباسيين، فرضية التأليف لسيف الدولة الحمداني، محتوى العصيدة والأطباق الفارسية والنبطية، مخطوط إسطنبول المملوك للصالح نجم الدين أيوب وشجر الدر، وترجمات نصر الله وزوالي وفافارو ووينس."
  en: "English Wikipedia article on Ibn Sayyar al-Warraq's Kitab al-Tabikh; entity facts only: the oldest surviving Arabic cookbook, over 600 recipes in 132 chapters, compiled from eighth- and ninth-century Abbasid court kitchens, the Sayf al-Dawla patronage hypothesis, asida/Persian/Nabataean content, the Istanbul manuscript owned by al-Salih Najm al-Din Ayyub and Shajar al-Durr, and the Nasrallah, Zaouali, Favaro and Waines translations."
  es: "Artículo de la Wikipedia en inglés sobre el Kitab al-Tabikh de Ibn Sayyar al-Warraq; solo datos sobre la entidad: el libro de cocina árabe más antiguo que se conserva, más de 600 recetas en 132 capítulos, compilado a partir de cocinas de la corte abasí de los siglos VIII y IX, la hipótesis del mecenazgo de Sayf al-Dawla, contenido asida/persa/nabateo, el manuscrito de Estambul propiedad de al-Salih Najm al-Din Ayyub y Shajar al-Durr, y las traducciones de Nasrallah, Zaouali, Favaro y Waines."
  fr: "Article de Wikipédia en anglais sur le Kitab al-Tabikh d'Ibn Sayyar al-Warraq; faits concernant l'ouvrage uniquement: le plus ancien livre de cuisine arabe existant, plus de 600 recettes réparties en 132 chapitres, compilées à partir des cuisines de la cour abbasside des VIIIe et IXe siècles, l'hypothèse du patronage de Sayf al-Dawla, un contenu asida/persan/nabatéen, le manuscrit d'Istanbul appartenant à al-Salih Najm al-Din Ayyub et Shajar al-Durr, et les traductions de Nasrallah, Zaouali, Favaro et Waines."
  ur: "ابن سیار الوراق کی کتاب التبیخ پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق: قدیم ترین زندہ بچ جانے والی عربی کک بک، 132 ابواب میں 600 سے زیادہ ترکیبیں، آٹھویں اور نویں صدی کے عباسی دربار کے کچن سے مرتب کی گئی، سیف الدولہ سرپرستی مفروضہ، اسیدا/فارسی/نباطین مواد، استنبول کا مخطوطہ المعروف الشاعۃ النسائع اور المعروف الشاعۃ النساء الدر، اور نصراللہ، زاؤلی، فاوارو اور وینز کے تراجم۔"
  tr: "İbn Sayyar el-Varrak'ın yemek kitabı üzerine İngilizce Vikipedi makalesi; sadece varlık için gerçekler: en eski Arap yemek kitabı, 132 bölümde 600'den fazla tarif, sekizinci ve dokuzuncu yüzyıl Abbasi mutfaklarından bir derleme, Seyf al-Dawla el-Hamdani'nin yazarlık hipotezi, lapa, Fars ve Nebati yemeklerinin içeriği, Salih Najm al-Din Ayyub ve Şacar al-Durr'a ait İstanbul el yazması ve Nasrallah, Zawali, Favaro ve Weins'in çevirileri."
  id: "Artikel Wikipedia bahasa Inggris tentang buku masak oleh Ibn Sayyar al-Warraq; hanya untuk entitas fakta: buku masak Arab tertua yang masih ada, lebih dari 600 resep dalam 132 bab, koleksi masakan Abbasiyah abad kedelapan dan kesembilan, hipotesis kepengarangan oleh Saif al-Dawla al-Hamdani, isi bubur dan hidangan Persia serta Nabatean, manuskrip Istanbul milik Salih Najm al-Din Ayyub dan Shajar al-Durr, serta terjemahan oleh Nasrallah, Zawali, Favaro, dan Weins."
