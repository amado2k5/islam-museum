  ar: "مقالة ويكيبيديا الإنجليزية عن كتاب الطبيخ لابن سيار الوراق؛ لوقائع الكيان فقط: أقدم كتاب طبخ عربي باقٍ، أكثر من 600 وصفة في 132 باباً، جمع من مطابخ القرنين الثامن والتاسع العباسيين، فرضية التأليف لسيف الدولة الحمداني، محتوى العصيدة والأطباق الفارسية والنبطية، مخطوط إسطنبول المملوك للصالح نجم الدين أيوب وشجر الدر، وترجمات نصر الله وزوالي وفافارو ووينس."
  en: "English Wikipedia article on Ibn Sayyar al-Warraq's Kitab al-Tabikh; entity facts only: the oldest surviving Arabic cookbook, over 600 recipes in 132 chapters, compiled from eighth- and ninth-century Abbasid court kitchens, the Sayf al-Dawla patronage hypothesis, asida/Persian/Nabataean content, the Istanbul manuscript owned by al-Salih Najm al-Din Ayyub and Shajar al-Durr, and the Nasrallah, Zaouali, Favaro and Waines translations."
