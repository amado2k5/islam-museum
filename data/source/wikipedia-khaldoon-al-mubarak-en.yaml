summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن خلدون المبارك، الرئيس التنفيذي لمبادلة ورئيس مانشستر سيتي ومجموعة سيتي لكرة القدم؛ يعطي نصها وصندوق معلوماتها مولده في 27 كانون الثاني 1976 في أبو ظبي، وتذكر جدالات اللعب المالي النظيف وحكم الدوري الإنجليزي في أيلول 2026 ضد مانشستر سيتي مع شروع النادي في الاستئناف."
  en: "English Wikipedia article on Khaldoon Al Mubarak, Mubadala's chief executive and chairman of Manchester City and City Football Group; its text and infobox give his birth on 27 January 1976 in Abu Dhabi, and it reports the Financial Fair Play controversies and the September 2026 Premier League verdict against Manchester City, which the club has begun to appeal."
  es: "Artículo de la Wikipedia en inglés sobre Khaldoon Al Mubarak, director ejecutivo de Mubadala y presidente del Manchester City y del City Football Group; su texto y ficha informativa indican que nació el 27 de enero de 1976 en Abu Dabi, e informa sobre las controversias del Fair Play Financiero y el veredicto de la Premier League de septiembre de 2026 contra el Manchester City, que el club ha comenzado a apelar."
  fr: "L'article de Wikipédia en anglais sur Khaldoon Al Mubarak, directeur général de Mubadala et président de Manchester City et du City Football Group, indique sa naissance le 27 janvier 1976 à Abou Dhabi et relate les controverses liées au fair-play financier ainsi que le verdict de la Premier League de septembre 2026 contre Manchester City, contre lequel le club a commencé à faire appel."
