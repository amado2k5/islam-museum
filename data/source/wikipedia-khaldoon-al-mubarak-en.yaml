  ar: "مقالة ويكيبيديا الإنجليزية عن خلدون المبارك، الرئيس التنفيذي لمبادلة ورئيس مانشستر سيتي ومجموعة سيتي لكرة القدم؛ يعطي نصها وصندوق معلوماتها مولده في 27 كانون الثاني 1976 في أبو ظبي، وتذكر جدالات اللعب المالي النظيف وحكم الدوري الإنجليزي في أيلول 2026 ضد مانشستر سيتي مع شروع النادي في الاستئناف."
  en: "English Wikipedia article on Khaldoon Al Mubarak, Mubadala's chief executive and chairman of Manchester City and City Football Group; its text and infobox give his birth on 27 January 1976 in Abu Dhabi, and it reports the Financial Fair Play controversies and the September 2026 Premier League verdict against Manchester City, which the club has begun to appeal."
