summary:
  ar: "مدخل «al-Hasan ibn al-Haytham» في Encyclopedia of World Biography ⁦⁦(تحديث 2018)⁩⁩: مولده في البصرة نحو 966م، ودعوته إلى مصر في عهد الحاكم الفاطمي لمحاولة تنظيم مجرى النيل، وإخفاقه ونفيه إلى نسخ المخطوطات الرياضية في القاهرة، وكتابه «ضوء القمر» الذي يرد فيه نظرية القدماء في انعكاس ضوء الشمس على القمر كالمرايا، ويذهب إلى أن القمر جسم مضيء ذاتياً لأن كل نقطة على سطحه تبث أشعة الضوء في كل الاتجاهات بينما تعكس مرآة الشعاع في اتجاه واحد، ويختم بأن للأشعة أثراً فيزيائياً على سطح القمر يجعل لونه وضوؤه مرئيين."
  en: "The 'al-Hasan ibn al-Haytham' entry in Encyclopedia of World Biography (updated 2018): born at Basra c. 966, called to Egypt under the Fatimid al-Hakim to attempt regulating the Nile, disgraced and reduced to copying mathematical manuscripts in Cairo; his 'On the Light of the Moon' refutes the ancient theory that the moon reflects sunlight like a mirror — each lunar surface point broadcasts light rays in all directions while a mirror reflects a ray in one direction — and concludes a physical effect of sunlight on the moon renders its color and light visible."
  ur: "Encyclopedia of World Biography ⁦⁦(اپڈیٹ 2018)⁩⁩ کا مدخل «al-Hasan ibn al-Haytham»: تقریباً 966ء میں بصرہ میں پیدائش، فاطمی حاکم کے دور میں نیل کے بہاؤ کو منظم کرنے کی کوشش کے لیے مصر بلانا، ناکامی اور قاہرہ میں ریاضیاتی مخطوطات نقل کرنے پر مجبور ہونا؛ اس کی «On the Light of the Moon» قدیم نظریہ کا رد کرتی ہے کہ چاند شمس کی روشنی آئینے کی طرح منعکس کرتا ہے — چاند کی ہر سطحی نقطہ روشنی کی شعاعیں تمام سمتوں میں نشر کرتا ہے جبکہ آئینہ شعاع کو ایک ہی سمت میں منعکس کرتا ہے — اور یہ نتیجہ دیتی ہے کہ سورج کی روشنی کا چاند پر طبعی اثر اس کا رنگ اور روشنی مرئی بناتا ہے۔"
  es: "La entrada de 'al-Hasan ibn al-Haytham' en la Enciclopedia de Biografías Mundiales (actualizada en 2018): nació en Basora alrededor del año 966, fue llamado a Egipto bajo el mandato del fatimí al-Hakim para intentar regular el Nilo, cayó en desgracia y se vio reducido a copiar manuscritos matemáticos en El Cairo; su obra 'Sobre la luz de la luna' refuta la antigua teoría de que la luna refleja la luz solar como un espejo —cada punto de la superficie lunar emite rayos de luz en todas direcciones, mientras que un espejo refleja un rayo en una sola dirección— y concluye que un efecto físico de la luz solar sobre la luna hace que su color y su luz sean visibles."
