reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision, fetched by revision id and the returned revision asserted equal. The infobox gives his birth name Tinnakorn Srisawat, his birth on 23 July 1997 at Pa Phayom, Phatthalung, his nicknames The Iron Man and The Tank, and his record of 274 wins, 44 losses and 10 draws. The text records his MAX Muay Thai 125 lb title (2016), his Omnoi Stadium 130 lb title (2017), his ONE Flyweight Muay Thai World Championship with five successful defences, the special-rules bout with Demetrious Johnson on 26 March 2022, his loss of the title on the scales at ONE 169 on 9 November 2024 (he won the fight itself), his knockout of Takeru Segawa at ONE 172, his honorary master's degree from Thaksin University (7 June 2025) and his July 2025 signing with the football club Phichit United. The personal-life text, citing one report — the South China Morning Post of 16 February 2023 — says he was briefly ordained as a Buddhist monk a month before his February 2023 wedding to Aida Looksaikongdin and shortly after the wedding announced he had converted to Islam. The article files him in the categories Converts to Islam from Buddhism and Thai Muslims, which are filings, not attestation."
