  ar: "مقالة ويكيبيديا الإنجليزية عن رودتانغ جيتموانغنون؛ تُستخدم لوقائع الكيان فقط. تعطي اسمه عند الولادة تيناكورن سريساوات وميلاده في با فايوم بفتهالونغ في 23 يوليو 1997، وبطولته لون للمواي تاي لوزن الذبابة بخمسة دفاعات ناجحة، وسجله 274 انتصاراً، وتذكر في حياته الشخصية إعلانه اعتناق الإسلام بعد زواجه في فبراير 2023 مستندة إلى ساوث تشاينا مورنينغ بوست."
  en: "English Wikipedia article on Rodtang Jitmuangnon; used for entity facts only. It gives his birth name Tinnakorn Srisawat and his birth at Pa Phayom, Phatthalung, on 23 July 1997, his ONE Flyweight Muay Thai World Championship with five successful defences, his record of 274 wins, and — in its personal-life section, citing the South China Morning Post — his announcement that he had converted to Islam after his February 2023 wedding."
