  ar: "حلقة بودكاست «الرحلة» مع الإمام داود وليد: نشأ في مقاطعة تشيسترفيلد بفيرجينيا، وانتقل إلى ديترويت لتعلم العربية، وسافر للطلب إلى غانا ومالي والسنغال، ويدرّس علاقة التصوف بالنشاط المقدس ومناهضة العنصرية، ويرأس فرع ميشيغان من مجلس العلاقات الأمريكية الإسلامية (كير)."
  en: "Episode of The Journey podcast with Imam Dawud Walid: raised in Chesterfield County, Virginia, he moved to Detroit to learn Arabic, travelled for study to Ghana, Mali and Senegal, teaches on the relationship of tasawwuf (Sufism) with sacred activism and anti-racism work, and heads CAIR-Michigan."
