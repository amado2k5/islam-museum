summary:
  ar: "حلقة بودكاست «الرحلة» مع الإمام داود وليد: نشأ في مقاطعة تشيسترفيلد بفيرجينيا، وانتقل إلى ديترويت لتعلم العربية، وسافر للطلب إلى غانا ومالي والسنغال، ويدرّس علاقة التصوف بالنشاط المقدس ومناهضة العنصرية، ويرأس فرع ميشيغان من مجلس العلاقات الأمريكية الإسلامية ⁦(كير)⁩."
  en: "Episode of The Journey podcast with Imam Dawud Walid: raised in Chesterfield County, Virginia, he moved to Detroit to learn Arabic, travelled for study to Ghana, Mali and Senegal, teaches on the relationship of tasawwuf (Sufism) with sacred activism and anti-racism work, and heads CAIR-Michigan."
  es: "Episodio del podcast The Journey con el imán Dawud Walid: criado en el condado de Chesterfield, Virginia, se mudó a Detroit para aprender árabe, viajó a Ghana, Mali y Senegal para estudiar, enseña sobre la relación del tasawwuf (sufismo) con el activismo sagrado y el trabajo contra el racismo, y dirige CAIR-Michigan."
  fr: "Épisode du podcast The Journey avec l'imam Dawud Walid: élevé dans le comté de Chesterfield, en Virginie, il a déménagé à Détroit pour apprendre l'arabe, a voyagé pour étudier au Ghana, au Mali et au Sénégal, enseigne sur la relation du tasawwuf (soufisme) avec l'activisme sacré et le travail antiraciste, et dirige CAIR-Michigan."
  ur: "امام داؤد ولید کے ساتھ سفر پوڈ کاسٹ کی قسط: چیسٹرفیلڈ کاؤنٹی، ورجینیا میں پرورش پائی، وہ عربی سیکھنے کے لیے ڈیٹرائٹ چلا گیا، گھانا، مالی اور سینیگال کا مطالعہ کرنے کے لیے سفر کیا، مقدس سرگرمی اور نسل پرستی کے خلاف کام کے ساتھ تصوف ⁦(تصوف)⁩ کے تعلق کی تعلیم دیتا ہے، اور CAIR- کے سربراہ ہیں۔"
  tr: "İmam Dawood Walid ile \"The Journey\" adlı podcast bölümü: Virginia, Chesterfield County'de büyüdü, Arapça öğrenmek için Detroit'e taşındı, Sufizm ile kutsal etkinlik arasındaki ilişkiyi incelemek için Gana, Mali ve Senegal'e seyahat etti ve Amerikan-İslam İlişkileri Konseyi'nin (CARE) Michigan şubesine başkanlık ediyor."
  id: "Episode podcast \"The Journey\" bersama Imam Dawood Walid: Ia tumbuh besar di Chesterfield County, Virginia, pindah ke Detroit untuk belajar bahasa Arab, pergi ke Ghana, Mali, dan Senegal untuk mempelajari hubungan antara Sufisme dan aktivitas suci serta anti-rasisme, serta memimpin cabang Michigan dari Council on American-Islamic Relations (CARE)."
