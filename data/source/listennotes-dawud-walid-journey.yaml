reliability_note: "Episode page of Hebah Masood's interview podcast The Journey, consulted 26 October 2026. It states that Walid grew up in Chesterfield County, Virginia; that hip hop, the film X and the Rodney King and Amadou Diallo cases awakened his interest in social justice and Islam; that he moved to Detroit to learn Classical Arabic; that his learning journey took him to Ghana, Mali and Senegal; that he heads CAIR-Michigan and had authored four books; and that in the episode he discusses Black Muslim history and the relationship of tasawwuf with sacred activism and anti-racism work, naming individual teachers he has learned from. It describes his teaching on Sufism; it does not name him personally as a Sufi or name any order or legal school for him."
