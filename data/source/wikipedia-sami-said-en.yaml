  ar: "مقالة ويكيبيديا الإنجليزية عن الكاتب سامي سعيد؛ تُستخدم لوقائع الكيان فقط. توثّق ولادته في كرن بإريتريا سنة 1979، وهجرة أسرته عبر السودان وألمانيا إلى غوتنبرغ، ورواياته ومنها «مانيسكان إر دن فاكراستي ستادين» (2018). لا تسمّي المقالة دينًا أو مذهبًا له."
  en: "English Wikipedia article on the writer Sami Said; used for entity facts only. It records his birth in Keren, Eritrea, in 1979, his family's flight via Sudan and Germany to Gothenburg, and his novels including Människan är den vackraste staden (2018). The article names no religion or school for him."
