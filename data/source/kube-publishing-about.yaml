summary:
  ar: "صفحة «من نحن» في موقع دار كيوب للنشر: دار مستقلة تنشر كتبًا عامة وأكاديمية وكتب أطفال عن الإسلام وتجربة المسلمين، تأسست سنة 2007، وتتولى علامة المؤسسة الإسلامية التي قامت سنة 1973."
  en: "Kube Publishing's About Us page: an independent house publishing general, academic and children's books on Islam and the Muslim experience, established in 2007, which handles the imprint of the Islamic Foundation, established in 1973."
  ur: "کیوب پبلشنگ کا «ہمارے بارے میں» صفحہ: اسلام اور مسلم تجربے پر عمومی، علمی اور بچوں کی کتابیں شائع کرنے والا آزاد ادارہ، 2007 میں قائم، جو 1973 میں قائم اسلامک فاؤنڈیشن کی اشاعتی علامت سنبھالتا ہے۔"
  es: "Página \"Sobre nosotros\" de Kube Publishing: una editorial independiente que publica libros generales, académicos e infantiles sobre el Islam y la experiencia musulmana, fundada en 2007, que gestiona el sello editorial de la Fundación Islámica, establecida en 1973."
  fr: "Page « À propos de nous » de Kube Publishing: maison d’édition indépendante spécialisée dans l’édition de livres généraux, universitaires et pour enfants sur l’islam et l’expérience musulmane, fondée en 2007, qui gère le label de la Fondation islamique, créée en 1973."
  tr: "Cube Publishing web sitesindeki \"Biz Kimiz\" sayfası: 2007'de kurulan, İslam ve Müslüman deneyimi hakkında genel kitaplar, akademik kitaplar ve çocuk kitapları yayımlayan bağımsız bir yayınevi olan ve 1973'te kurulan İslami Vakıf tarafından yönetilmektedir."
  id: "Halaman \"Siapa Kita\" di situs web Cube Publishing: sebuah penerbit independen yang menerbitkan buku umum, buku akademik, dan buku anak-anak tentang Islam dan pengalaman Muslim, didirikan pada tahun 2007, dan dikelola oleh Islamic Foundation yang didirikan pada tahun 1973."
