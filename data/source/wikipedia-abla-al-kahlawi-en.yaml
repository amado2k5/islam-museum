reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026), read through the MediaWiki API at revision 1353865316 on 1 November 2026. Gives: Egyptian scholar and teacher of Islamic jurisprudence, preacher and television presenter, 15 December 1948 - 25 January 2021 (the Arabic article and Wikidata give 24 January 2021); daughter of the nashid singer Mohammed al-Kahlawi; master's (1974) and doctorate (1978) in Islamic law at Al-Azhar; in 1979 head of the Sharia department at the Faculty of Education of the women's college in Mecca; later dean of Islamic and Arabic Studies at the Women's College of Al-Azhar; taught at the College of Education for Girls in Riyadh; preached daily at the Masjid al-Haram from 1987 to 1989; known to her audience as 'Mama Abla'; listed in the first edition of The 500 Most Influential Muslims (2009); one of 41 scholars who wrote in 2006 condemning the violence after the Jyllands-Posten cartoons while rejecting the cartoons; a signatory of 'A Common Word Between Us and You'; founded a charity in Mokattam for orphans and cancer and Alzheimer's patients; died of Covid-19. Publications listed: on zakat and development (1996), on women's inner and outer purity (1997), on women's issues in hajj and umra (2005). The article names no school. Recorded in docs/authenticity-ledger/pages/wikipedia-abla-al-kahlawi-en.yaml."
