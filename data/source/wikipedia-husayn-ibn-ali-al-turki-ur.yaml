summary:
  ar: "مقالة ويكيبيديا الأردية الموجزة عن حسين بن علي التركي؛ تُستخدم لوقائع الكيان فقط. تصفه بأنه مؤسس الأسرة الحسينية وحاكم تونس من 15 تموز 1705 إلى 7 أيلول 1735."
  en: "Urdu Wikipedia stub on Husayn ibn Ali al-Turki; used for entity facts only. It identifies him as founder of the Husaynid dynasty and ruler of Tunis from 15 July 1705 to 7 September 1735, the taking-office and deposition dates the fuller articles give."
  es: "Fragmento de la Wikipedia en urdu sobre Husayn ibn Ali al-Turki; se utiliza únicamente para datos sobre la persona. Lo identifica como fundador de la dinastía Husayní y gobernante de Túnez desde el 15 de julio de 1705 hasta el 7 de septiembre de 1735, fechas que figuran en los artículos completos sobre su toma de posesión y su destitución."
  fr: "Ébauche de l'article Wikipédia en ourdou sur Husayn ibn Ali al-Turki; utilisée uniquement pour les informations factuelles. Elle le présente comme le fondateur de la dynastie husaynide et souverain de Tunis du 15 juillet 1705 au 7 septembre 1735, les dates d'accession au pouvoir et de destitution étant précisées dans les articles plus complets."
  ur: "حسین ابن علی الترکی پر اردو ویکیپیڈیا سٹب؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ان کی شناخت حسینی خاندان کے بانی اور تیونس کے حکمران کے طور پر 15 جولائی 1705 سے 7 ستمبر 1735 تک کرتا ہے، عہدہ سنبھالنے اور معزولی کی تاریخیں مکمل مضامین دیتے ہیں۔"
  tr: "Urduca Vikipedi makalesi, Hüseyin bin Ali el-Turki hakkında özdür; yalnızca varlığın gerçekleri için kullanılır. Hüseyinler hanedanının kurucusu ve 15 Temmuz 1705'ten 7 Eylül 1735'e kadar Tunus'un hükümdarı olarak tanımlanır."
  id: "Artikel Wikipedia dalam bahasa Urdu singkat tentang Hussein bin Ali al-Turki; digunakan hanya untuk fakta entitas tersebut. Ia digambarkan sebagai pendiri dinasti Husaynid dan penguasa Tunis dari 15 Juli 1705 hingga 7 September 1735."
