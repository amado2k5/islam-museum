summary:
  ar: "الجزء الرابع عشر من «نهاية الأرب» في الطبعة الأولى لدار الكتب المصرية ⁦(1362هـ/1943م)⁩، من الفن الخامس في التاريخ: أخبار الأنبياء بعد موسى إلى عيسى، ثم أخبار ملوك الأمم كالصين والترك والخزر."
  en: "Volume 14 of Nihayat al-Arab in the first Dar al-Kutub al-Misriyya printing (1362/1943), from the fifth art, history: the prophets after Moses down to Jesus, then the kings of nations such as China, the Turks and the Khazars."
  ur: "«نہایۃ الارب» کی چودھویں جلد، دار الکتب المصریہ کا پہلا ایڈیشن (1362ھ/1943ء)، پانچویں فن یعنی تاریخ سے: موسیٰ کے بعد سے عیسیٰ تک انبیا کے احوال، پھر چین، ترک اور خزر جیسی قوموں کے بادشاہوں کے احوال۔"
