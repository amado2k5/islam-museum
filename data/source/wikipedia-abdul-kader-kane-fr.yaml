reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It has him rule Futa Toro from 1776 to his death in 1807, adds his higher studies at Pir Sagnokhor to the English article's Coki, and gives his death precisely: assassinated on 4 April 1807 in a plot organised by the Jagoordo, the assembly that elected the Almamy — the date Wikidata also records. The English article instead gives 26 April 1806 and death in battle at Gouriki; the conflict is stated openly in the museum's record. It names no legal school or Sufi order for Kane himself. Checked 1 November 2026."
