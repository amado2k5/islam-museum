reliability_note: "Scholarly biographical dictionary by the leading Albanologist of his generation, read in the Internet Archive scan of the second edition; the Gurakuqi entry stands at pp. 178–179. Elsie records that Gurakuqi's Jesuit teachers encouraged him and that he began writing poetry in Italian, Latin and Albanian, the latter published in the Jesuit periodical of religious culture Elçija i Zemrës t'Jezu Krishtit (The Messenger of the Sacred Heart); the dictionary's Islam entry separately describes the community headed by the grand mufti of Tirana as organized Sunni Islam."
