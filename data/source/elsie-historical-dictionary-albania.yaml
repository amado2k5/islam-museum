summary:
  ar: "قاموس روبرت إلسي التاريخي لألبانيا ⁦(الطبعة الثانية، 2010)⁩: مدخل لويج غوراكوكي يوثّق تكوينه الكاثوليكي — تعليمه عند اليسوعيين في كلية سافيريان ونشره شعره المبكر في الدورية اليسوعية الثقافية الدينية «رسول القلب الأقدس» — ويروي مسيرته حتى اغتياله في باري سنة 1925."
  en: "Robert Elsie's Historical Dictionary of Albania (second edition, 2010): the Luigj Gurakuqi entry documents his Catholic formation — Jesuit schooling at the Saverian College and his early verse published in the Jesuit periodical of religious culture, The Messenger of the Sacred Heart — and traces his career to his murder at Bari in 1925."
  es: "El Diccionario histórico de Albania de Robert Elsie (segunda edición, 2010) incluye la entrada sobre Luigj Gurakuqi, que documenta su formación católica —su educación jesuita en el Colegio Saverian y sus primeros versos publicados en la revista jesuita de cultura religiosa, El Mensajero del Sagrado Corazón— y traza la trayectoria de su vida hasta su asesinato en Bari en 1925."
  fr: "Le dictionnaire historique de l'Albanie de Robert Elsie (deuxième édition, 2010): l'entrée consacrée à Luigj Gurakuqi documente sa formation catholique — ses études jésuites au Saverian College et ses premiers vers publiés dans le périodique jésuite de culture religieuse, Le Messager du Sacré-Cœur — et retrace sa carrière jusqu'à son assassinat à Bari en 1925."
