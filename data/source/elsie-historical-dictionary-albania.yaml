  ar: "قاموس روبرت إلسي التاريخي لألبانيا (الطبعة الثانية، 2010): مدخل لويج غوراكوكي يوثّق تكوينه الكاثوليكي — تعليمه عند اليسوعيين في كلية سافيريان ونشره شعره المبكر في الدورية اليسوعية الثقافية الدينية «رسول القلب الأقدس» — ويروي مسيرته حتى اغتياله في باري سنة 1925."
  en: "Robert Elsie's Historical Dictionary of Albania (second edition, 2010): the Luigj Gurakuqi entry documents his Catholic formation — Jesuit schooling at the Saverian College and his early verse published in the Jesuit periodical of religious culture, The Messenger of the Sacred Heart — and traces his career to his murder at Bari in 1925."
