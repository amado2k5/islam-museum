summary:
  ar: "مقالة ويكيبيديا العربية عن حسرت موهاني؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في 14 تشرين الأول 1878 ووفاته في 13 أيار 1951، وريادته في المطالبة بالاستقلال التام، وقيادته في الحزب الشيوعي الهندي، ورئاسته الرابطة الإسلامية 1919 وبقاءه في الهند بعد التقسيم."
  en: "Arabic Wikipedia article on Hasrat Mohani; used for entity facts only. It gives his birth on 14 October 1878 and his death on 13 May 1951, and recounts his pioneering demand for complete independence, his leadership in the Communist Party of India, his 1919 Muslim League presidency and his remaining in India after Partition."
  es: "Artículo en árabe de la Wikipedia sobre Hasrat Mohani; se utiliza únicamente para obtener información sobre la persona. Indica su fecha de nacimiento, el 14 de octubre de 1878, y su fallecimiento, el 13 de mayo de 1951. Relata su lucha pionera por la independencia total, su liderazgo en el Partido Comunista de la India, su presidencia de la Liga Musulmana en 1919 y su permanencia en la India tras la Partición."
  fr: "Article de Wikipédia en arabe sur Hasrat Mohani; utilisé uniquement pour les informations factuelles. Il indique sa date de naissance, le 14 octobre 1878, et sa date de décès, le 13 mai 1951, et relate sa revendication pionnière d’une indépendance totale, son rôle de leader au sein du Parti communiste d’Inde, sa présidence de la Ligue musulmane en 1919 et son maintien en Inde après la Partition."
  ur: "حسرت موہانی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 14 اکتوبر 1878 کو ان کی پیدائش اور 13 مئی 1951 کو ان کی موت کا ذکر کرتا ہے، اور مکمل آزادی کے لیے ان کے اہم مطالبے، کمیونسٹ پارٹی آف انڈیا میں ان کی قیادت، ان کی 1919 کی مسلم لیگ کی صدارت اور تقسیم کے بعد ہندوستان میں ان کے باقی رہنے کا ذکر کرتا ہے۔"
  tr: "Hasrat Mohani hakkında Arapça Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılmıştır. 14 Ekim 1878 doğumlu ve 13 Mayıs 1951'de öldüğü, tam bağımsızlık talebindeki liderliği, Hindistan Komünist Partisi'ndeki liderliği, 1919'da Müslüman Ligi başkanlığı ve bölünmeden sonra Hindistan'daki varlığı belirtilmektedir."
  id: "Artikel Wikipedia bahasa Arab tentang Hasrat Mohani hanya digunakan untuk fakta-fakta entitas tersebut. Ia disebutkan lahir pada 14 Oktober 1878 dan meninggal pada 13 Mei 1951, serta kepemimpinannya dalam menuntut kemerdekaan penuh, kepemimpinannya di Partai Komunis India, kepresidenan Liga Muslim pada tahun 1919, dan keberadaannya yang berkelanjutan di India setelah pemisahan."
