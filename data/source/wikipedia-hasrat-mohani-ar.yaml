  ar: "مقالة ويكيبيديا العربية عن حسرت موهاني؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في 14 تشرين الأول 1878 ووفاته في 13 أيار 1951، وريادته في المطالبة بالاستقلال التام، وقيادته في الحزب الشيوعي الهندي، ورئاسته الرابطة الإسلامية 1919 وبقاءه في الهند بعد التقسيم."
  en: "Arabic Wikipedia article on Hasrat Mohani; used for entity facts only. It gives his birth on 14 October 1878 and his death on 13 May 1951, and recounts his pioneering demand for complete independence, his leadership in the Communist Party of India, his 1919 Muslim League presidency and his remaining in India after Partition."
