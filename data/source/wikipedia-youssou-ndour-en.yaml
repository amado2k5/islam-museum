reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026, and its content checked against the recorded revision. It gives Youssou Madjiguène N'Dour, born 1 October 1959 at Dakar, to a Serer father and a Toucouleur mother, culturally Wolof; his start performing at 12, his singing with Ibra Kassé's Star Band from 1976, Étoile de Dakar in 1978 and its split into Super Étoile de Dakar, his backing band; his part in developing mbalax; his studio (1991) and label Jololi (1995); the 1994 duet '7 Seconds' with Neneh Cherry and the 1998 World Cup anthem; the Grammy Award for the album Egypt (2005); his acting as Olaudah Equiano in Amazing Grace (2006); his media group Groupe Futurs Médias (founded 2003; L'Observateur, RFM, and TFM from 2010); his activism, including the FAO goodwill ambassadorship of 16 October 2000, the 1985 Mandela concert, the 1988 Amnesty tour, the cancelled 2003 American tour over the coming invasion of Iraq, Live 8 in 2005 and the Birima microfinance launch of 2008; his 2012 presidential candidacy and disqualification, his backing of Macky Sall, and his posts as Minister of Culture and Tourism (April 2012), then of Tourism and Leisure, until 2 September 2013, then Special Adviser to the President; the Prince Claus Award (2002), the Yale honorary doctorate (2011), the shared Polar Music Prize (2013) and Rolling Stone's 2023 ranking of him at 69 among the 200 greatest singers. For his faith, the article says in terms: as a Mouride disciple (taalibé), a Muslim of the Mouride brotherhood, one of the large four Sufi orders in Senegambia, he often incorporated aspects of Islamic music and chants into his work. That is an attestation of his own affiliation, one of the two independent attestations on which the record's sufi segment rests (the French article is the other); no article names a madhhab for him."
