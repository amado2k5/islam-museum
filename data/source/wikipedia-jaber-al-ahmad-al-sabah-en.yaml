summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن جابر الأحمد الجابر الصباح؛ تُستخدم لوقائع الكيان فقط. تذكر أنه وُلد في مدينة الكويت في 29 يونيو 1926، وكان وزيرًا للمالية 1962–1965 ورئيسًا للوزراء 1965–1978، ثم أمير الكويت الثالث عشر من 31 ديسمبر 1977 حتى وفاته في 15 يناير 2006؛ قاد الكويت في المنفى أثناء الغزو العراقي 1990–1991، ونجا من هجوم على موكبه سنة 1985، ودُفن في مقبرة صليبيخات. ويقرأ حقل الدين في صندوق معلوماتها «إسلام سني»، وهي قيمة بنيوية لا يرد مثلها في متنها."
  en: "English Wikipedia article on Jaber Al-Ahmad Al-Jaber Al-Sabah; used for entity facts only. It gives him as born at Kuwait City on 29 June 1926, minister of finance 1962–1965 and prime minister 1965–1978, then the thirteenth Emir of Kuwait from 31 December 1977 until his death on 15 January 2006; he led Kuwait in exile during the Iraqi occupation of 1990–1991, survived an attack on his motorcade in 1985, and was buried at Sulaibikhat Cemetery. Its infobox religion field reads 'Sunni Islam' — a structured value its text nowhere repeats."
