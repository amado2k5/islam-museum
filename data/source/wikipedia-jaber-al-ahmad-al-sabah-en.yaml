summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن جابر الأحمد الجابر الصباح؛ تُستخدم لوقائع الكيان فقط. تذكر أنه وُلد في مدينة الكويت في 29 يونيو 1926، وكان وزيرًا للمالية 1962–1965 ورئيسًا للوزراء 1965–1978، ثم أمير الكويت الثالث عشر من 31 ديسمبر 1977 حتى وفاته في 15 يناير 2006؛ قاد الكويت في المنفى أثناء الغزو العراقي 1990–1991، ونجا من هجوم على موكبه سنة 1985، ودُفن في مقبرة صليبيخات. ويقرأ حقل الدين في صندوق معلوماتها «إسلام سني»، وهي قيمة بنيوية لا يرد مثلها في متنها."
  en: "English Wikipedia article on Jaber Al-Ahmad Al-Jaber Al-Sabah; used for entity facts only. It gives him as born at Kuwait City on 29 June 1926, minister of finance 1962–1965 and prime minister 1965–1978, then the thirteenth Emir of Kuwait from 31 December 1977 until his death on 15 January 2006; he led Kuwait in exile during the Iraqi occupation of 1990–1991, survived an attack on his motorcade in 1985, and was buried at Sulaibikhat Cemetery. Its infobox religion field reads 'Sunni Islam' — a structured value its text nowhere repeats."
  es: "Artículo de la Wikipedia en inglés sobre Jaber Al-Ahmad Al-Jaber Al-Sabah; utilizado únicamente para datos sobre la entidad. Indica que nació en la ciudad de Kuwait el 29 de junio de 1926, fue ministro de finanzas entre 1962 y 1965 y primer ministro entre 1965 y 1978, y posteriormente decimotercer emir de Kuwait desde el 31 de diciembre de 1977 hasta su fallecimiento el 15 de enero de 2006. Dirigió Kuwait en el exilio durante la ocupación iraquí de 1990-1991, sobrevivió a un ataque contra su caravana en 1985 y fue enterrado en el cementerio de Sulaibikhat. El campo de religión de su ficha informativa indica «Islam sunita», un valor estructurado que no se repite en ningún otro lugar del texto."
  fr: "L'article de Wikipédia en anglais consacré à Jaber Al-Ahmad Al-Jaber Al-Sabah, utilisé uniquement pour les informations sur l'entité, indique qu'il est né à Koweït City le 29 juin 1926, ministre des Finances de 1962 à 1965 et Premier ministre de 1965 à 1978, puis treizième émir du Koweït du 31 décembre 1977 jusqu'à sa mort le 15 janvier 2006. Il a dirigé le Koweït en exil pendant l'occupation irakienne de 1990 à 1991, a survécu à une attaque contre son convoi en 1985 et est enterré au cimetière de Sulaibikhat. Le champ « religion » de son infobox indique « Islam sunnite » – une valeur structurée qui n'apparaît nulle part ailleurs dans le texte."
