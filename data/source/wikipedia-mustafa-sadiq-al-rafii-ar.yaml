  ar: "مقالة ويكيبيديا العربية عن مصطفى صادق الرافعي؛ تُستخدم لوقائع الكيان فقط. تعطي اسمه الكامل ولقبه «معجزة الأدب العربي» وميلاده في بهتيم بالقليوبية في يناير 1880 وحياته في طنطا وكتبه ومعاركه الأدبية."
