  tr: "Urduca Vikipedi makalesi \"Abdullah bin Jassim II\" (revizyon 12024681): 17 Temmuz 1913'ten itibaren hüküm sürer ve dinini kutu içinde \"Sünni\" olarak belirtir; \"1871 doğumlu\" kategorisi, eklemeler listesinde tek orijinal yanlış yıl olan 1871'dir."
  id: "Artikel Wikipedia Urdu \"Abdullah bin Jassim II\" (revisi 12024681): menetapkan pemerintahannya sejak 17 Juli 1913, dan agamanya dalam kotaknya sebagai \"Sunni\"; dan kategori \"lahir pada 1871\" adalah satu-satunya tahun asli yang salah 1871 dalam daftar tambahan."
