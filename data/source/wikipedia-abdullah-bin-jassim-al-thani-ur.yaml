  en: "The Urdu Wikipedia article 'Abdullah bin Jassim Al Thani' (revision 12024681): it dates his rule from 17 July 1913 and its infobox gives his religion as Sunni; its '1871 births' category is the sole origin of the additions queue's erroneous 1871 birth year."
