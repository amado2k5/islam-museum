  tr: "Mustafa Mahmoud'un \"Ölümün Gizemi\" adlı kitabının Beyrut'taki Dar Al-Awda baskısı (Ocak 1972), sanatçı Cemal Kamel'in kapağı ve sonunda yayınevi tarafından yayımlanan kitaplarının listesi."
  id: "Edisi Dar Al-Awda di Beirut (Januari 1972) dari buku Mustafa Mahmoud \"The Mystery of Death,\" dengan sampul oleh seniman Jamal Kamel, dan di akhir daftar bukunya yang diterbitkan oleh penerbit."
