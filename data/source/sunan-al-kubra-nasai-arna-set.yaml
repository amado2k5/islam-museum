summary:
  ar: "نسخة ممسوحة كاملة من «السنن الكبرى» للنسائي بتحقيق حسن عبد المنعم شلبي وإشراف شعيب الأرنؤوط، تقع في 5886 صفحة مسح؛ ويرجع إليها هذا السجل بأرقام صفحات المسح. لم يُقرأ رقم المجلد من صفحة العنوان في هذه النسخة."
  en: "A full scan of al-Nasa'i's Sunan al-Kubra in the edition of Hasan Abd al-Mun'im Shalabi, supervised by Shu'ayb al-Arna'ut, 5,886 scan pages; this record cites its scan pages. The volume number is not read from this copy's title page."
  es: "Escaneo completo del Sunan al-Kubra de al-Nasa'i en la edición de Hasan Abd al-Mun'im Shalabi, supervisada por Shu'ayb al-Arna'ut, 5886 páginas escaneadas; este registro cita dichas páginas. El número de volumen no se lee de la portada de esta copia."
  fr: "Numérisation intégrale du Sunan al-Kubra d'al-Nasa'i, édition de Hasan Abd al-Mun'im Shalabi, sous la supervision de Shu'ayb al-Arna'ut, 5 886 pages numérisées; cette notice fait référence à ces pages. Le numéro de volume n'est pas indiqué sur la page de titre de cet exemplaire."
  ur: "حسن عبد المنعیم شلبی کے ایڈیشن میں النسائی کی سنن الکبری کا مکمل اسکین، شعیب الارناوت کے زیر نگرانی، 5,886 اسکین صفحات؛ یہ ریکارڈ اس کے اسکین صفحات کا حوالہ دیتا ہے۔ اس کاپی کے ٹائٹل پیج سے والیوم نمبر نہیں پڑھا گیا ہے۔"
  tr: "Al-Nasa'i tarafından hazırlanan, Hassan Abdul Munim Shalabi tarafından düzenlenen ve Shuaib Al-Arna'ut tarafından denetlenen 'Al-Sunan Al-Kubra' adlı tam taranmış bir kopya; bu kayıt, taranan sayfaların sayfa numaralarıyla birlikte belirtilmiştir. Bu kopyada cilt numarası başlık sayfasından okunmamıştır."
  id: "Salinan lengkap 'Al-Sunan Al-Kubra' oleh Al-Nasa'i, diedit oleh Hassan Abdul Munim Shalabi dan diawasi oleh Shuaib Al-Arna'ut, terdiri dari 5.886 halaman yang dipindai; catatan ini merujuk pada halaman tersebut dengan nomor halaman yang dipindai. Nomor volume tidak dibaca dari halaman judul dalam salinan ini."
