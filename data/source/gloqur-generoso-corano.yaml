summary:
  ar: "تدوينة لميخايلو ياكوبوفيتش، 21 يوليو 2023، عن «القرآن الكريم» بالإيطالية للشيخ عثمان من المركز الثقافي الإسلامي في فوندي: طبعته الأولى 2015، والثانية 2020 عن جمعية نقل رسالة الإسلام في الإسكندرية، والتساؤل عن خطاب الأزهر الملحق بها."
  en: "A post by Mykhaylo Yakubovych, 21 July 2023, on Generoso Corano, the Italian translation by Sheikh Othman of the Islamic Cultural Center of Fondi: first edition 2015, second edition 2020 by the Conveying Islamic Message Society of Alexandria, and the questions raised by the al-Azhar letter printed in it."
  ur: "میخائیلو یاکوبووچ کی تحریر، 21 جولائی 2023، فوندی کے اسلامی ثقافتی مرکز کے شیخ عثمان کے اطالوی «جنیروسو کورانو» پر: پہلی اشاعت 2015، دوسری 2020 اسکندریہ کی کانویئنگ اسلامک میسج سوسائٹی سے، اور اس میں شامل ازہر کے خط پر سوالات۔"
  es: "Publicación de Mykhaylo Yakubovych, 21 de julio de 2023, sobre Generoso Corano, la traducción al italiano del jeque Othman del Centro Cultural Islámico de Fondi: primera edición 2015, segunda edición 2020 de la Sociedad para la Transmisión del Mensaje Islámico de Alejandría, y las cuestiones planteadas por la carta de al-Azhar impresa en ella."
  fr: "Article de Mykhaylo Yakubovych, 21 juillet 2023, sur Generoso Corano, la traduction italienne de Cheikh Othman du Centre culturel islamique de Fondi: première édition 2015, deuxième édition 2020 par la Société de transmission du message islamique d’Alexandrie, et les questions soulevées par la lettre d’al-Azhar qui y est imprimée."
  tr: "Mikhailo Yakubovich tarafından 21 Temmuz 2023 tarihli bir yazı, Fondi'deki İslam Kültür Merkezi'nden Şeyh Osman tarafından İtalyanca \"Kutsal Kuran\" hakkında: İskenderiye'deki İslam Mesajını Aktarma Derneği'nden 2015, ikinci baskı 2020 ve ona bağlı Ezher söylemini sorgulayan bir yazı."
  id: "Sebuah tulisan oleh Mikhailo Yakubovich, 21 Juli 2023, tentang \"Al-Qur'an\" dalam bahasa Italia oleh Sheikh Othman dari Pusat Kebudayaan Islam di Fondi: edisi pertama 2015, edisi kedua 2020 dari Society for Conveying the Message of Islam in Alexandria, dan mempertanyakan wacana Al-Azhar yang melekat padanya."
