  ar: "مقالة ويكيبيديا الإنجليزية عن يوويري موسيفيني؛ تُستخدم لوقائع الكيان فقط. تروي ولادته سنة 1944 في نتونغامو ودراسته في جامعة دار السلام وحرب الأدغال ورئاسته لأوغندا منذ 1986 وفوزه في انتخابات 2026. في حياته الشخصية تقول المقالة إنه لا مكان عبادة محددا له ويحضر كاتدرائيات مختلفة لأسباب أمنية؛ ولا تسمي انتماءه الديني."
  en: "English Wikipedia article on Yoweri Museveni; used for entity facts only. It recounts his birth in 1944 at Ntungamo, his studies at the University of Dar es Salaam, the Bush War, his presidency of Uganda since 1986 and his victory in the 2026 election. Its personal-life section states only that he has no specific place of worship and attends different cathedrals for security reasons; it names no affiliation for him."
