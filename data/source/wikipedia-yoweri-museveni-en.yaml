summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن يوويري موسيفيني؛ تُستخدم لوقائع الكيان فقط. تروي ولادته سنة 1944 في نتونغامو ودراسته في جامعة دار السلام وحرب الأدغال ورئاسته لأوغندا منذ 1986 وفوزه في انتخابات 2026. في حياته الشخصية تقول المقالة إنه لا مكان عبادة محددا له ويحضر كاتدرائيات مختلفة لأسباب أمنية؛ ولا تسمي انتماءه الديني."
  en: "English Wikipedia article on Yoweri Museveni; used for entity facts only. It recounts his birth in 1944 at Ntungamo, his studies at the University of Dar es Salaam, the Bush War, his presidency of Uganda since 1986 and his victory in the 2026 election. Its personal-life section states only that he has no specific place of worship and attends different cathedrals for security reasons; it names no affiliation for him."
  es: "Artículo de la Wikipedia en inglés sobre Yoweri Museveni; utilizado únicamente para datos sobre la persona. Relata su nacimiento en 1944 en Ntungamo, sus estudios en la Universidad de Dar es Salaam, la Guerra de Secesión, su presidencia de Uganda desde 1986 y su victoria en las elecciones de 2026. La sección sobre su vida personal solo indica que no tiene un lugar de culto fijo y que asiste a diferentes catedrales por motivos de seguridad; no menciona ninguna afiliación religiosa."
  fr: "Article de Wikipédia en anglais sur Yoweri Museveni; utilisé uniquement pour des informations factuelles sur l’entité. Il relate sa naissance en 1944 à Ntungamo, ses études à l’Université de Dar es Salaam, la guerre du Bush, sa présidence de l’Ouganda depuis 1986 et sa victoire aux élections de 2026. La section consacrée à sa vie privée indique seulement qu’il n’a pas de lieu de culte particulier et qu’il fréquente différentes cathédrales pour des raisons de sécurité; aucune affiliation religieuse n’est mentionnée."
  ur: "Yoweri Museveni پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی پیدائش 1944 میں نٹنگامو میں، یونیورسٹی آف دارالسلام میں ان کی تعلیم، بش کی جنگ، 1986 سے یوگنڈا کی ان کی صدارت اور 2026 کے انتخابات میں ان کی جیت کا ذکر ہے۔ اس کے ذاتی زندگی کے حصے میں صرف یہ کہا گیا ہے کہ اس کے پاس عبادت کی کوئی خاص جگہ نہیں ہے اور وہ سیکورٹی وجوہات کی بنا پر مختلف گرجا گھروں میں جاتا ہے۔ یہ اس کے لیے کسی وابستگی کا نام نہیں لیتا۔"
