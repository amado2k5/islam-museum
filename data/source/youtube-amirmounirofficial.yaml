summary:
  ar: "القناة الرسمية للدكتور أمير منير على يوتيوب (@amirmounirofficial)؛ يصفها وصفها بأنها «القناة الرسمية للدكتور أمير منير»، وفيها دروسه الوعظية وسلاسله مثل «أبواب الجنة» و«الساعة سبعة»."
  en: "The official YouTube channel of Dr Amir Mounir (@amirmounirofficial); its description states in Arabic that it is 'the official channel of Dr Amir Mounir', and it carries his preaching lessons and series such as Abwab al-Janna and Al-Sa'a Sab'a."
  es: "El canal oficial de YouTube del Dr. Amir Mounir (@amirmounirofficial); su descripción indica en árabe que es \"el canal oficial del Dr. Amir Mounir\", y contiene sus lecciones de predicación y series como Abwab al-Janna y Al-Sa'a Sab'a."
  fr: "La chaîne YouTube officielle du Dr Amir Mounir (@amirmounirofficial); sa description indique en arabe qu'il s'agit de « la chaîne officielle du Dr Amir Mounir », et elle diffuse ses enseignements et séries tels que Abwab al-Janna et Al-Sa'a Sab'a."
  ur: "ڈاکٹر عامر منیر کا آفیشل یوٹیوب چینل (@amirmounirofficial)؛ عربی میں اس کی تفصیل بتاتی ہے کہ یہ 'ڈاکٹر امیر منیر کا آفیشل چینل' ہے، اور اس میں ان کے تبلیغی اسباق اور سلسلہ ابواب الجنۃ اور الساعۃ سبع شامل ہیں۔"
  tr: "Dr. Amir Mounir'in YouTube'daki resmi kanalı (@amirmounirofficial); burayı \"Dr. Amir Mounir'in resmi kanalı\" olarak tanımlıyor ve \"The Gates of Paradise\" ve \"Seven O'Clock\" gibi vaazları ve dizileri yer alıyor."
  id: "Saluran resmi Dr. Amir Mounir di YouTube (@amirmounirofficial); ia menggambarkannya sebagai \"saluran resmi Dr. Amir Mounir,\" menampilkan khotbah dan serial seperti \"The Gates of Paradise\" dan \"Seven O'Clock.\""
