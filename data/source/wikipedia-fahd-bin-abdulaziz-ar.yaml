summary:
  ar: "مقالة ويكيبيديا العربية عن فهد بن عبد العزيز آل سعود؛ تُستخدم لوقائع الكيان فقط. يذكر صندوق معلوماتها، استشهادًا بكتاب لفهد بن عبد الله السماري وناصر بن محمد الجهيمي، ولادته في الرياض في 16 مارس 1921 مقترنة بعام 1340هـ، ووفاته في الرياض في 1 أغسطس 2005. ولا يتضمن صندوق معلوماتها حقلًا للدين؛ وتصنيفاتها تدرجه في «مسلمون سنة سعوديون»."
  en: "Arabic Wikipedia article on Fahd bin Abdulaziz Al Saud; used for entity facts only. Its infobox, citing a book by Fahd bin Abdullah al-Samari and Nasir bin Muhammad al-Juhaimi, gives his birth at Riyadh as 16 March 1921 paired with the year 1340 AH, and his death at Riyadh on 1 August 2005. Its infobox has no religion field; its categories file him under 'Saudi Sunni Muslims'."
  es: "Artículo en árabe de la Wikipedia sobre Fahd bin Abdulaziz Al Saud; utilizado únicamente para datos sobre la persona. Su ficha informativa, que cita un libro de Fahd bin Abdullah al-Samari y Nasir bin Muhammad al-Juhaimi, indica que nació en Riad el 16 de marzo de 1921, año 1340 de la Hégira, y falleció en Riad el 1 de agosto de 2005. La ficha informativa no incluye información sobre religión; sus categorías lo clasifican como «musulmán sunita saudí»."
  fr: "Article Wikipédia en arabe sur Fahd bin Abdulaziz Al Saud; utilisé uniquement pour les informations le concernant. Son infobox, citant un ouvrage de Fahd bin Abdullah al-Samari et Nasir bin Muhammad al-Juhaimi, indique sa naissance à Riyad le 16 mars 1921 (an 1340 de l'Hégire) et son décès à Riyad le 1er août 2005. L'infobox ne comporte pas de champ « religion »; il est classé dans la catégorie « Musulmans sunnites saoudiens »."
  ur: "فہد بن عبدالعزیز آل سعود پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا معلوماتی باکس، فہد بن عبداللہ السماری اور ناصر بن محمد الجہیمی کی ایک کتاب کا حوالہ دیتے ہوئے، ریاض میں ان کی پیدائش 16 مارچ 1921 کو سنہ 1340 ہجری کے ساتھ جوڑا گیا، اور ان کی وفات یکم اگست 2005 کو ریاض میں ہوئی۔ اس کے معلوماتی خانے کا کوئی مذہب نہیں ہے۔ اس کے زمرے اسے 'سعودی سنی مسلمان' کے تحت فائل کرتے ہیں۔"
