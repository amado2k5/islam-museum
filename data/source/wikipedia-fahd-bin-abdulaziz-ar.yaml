summary:
  ar: "مقالة ويكيبيديا العربية عن فهد بن عبد العزيز آل سعود؛ تُستخدم لوقائع الكيان فقط. يذكر صندوق معلوماتها، استشهادًا بكتاب لفهد بن عبد الله السماري وناصر بن محمد الجهيمي، ولادته في الرياض في 16 مارس 1921 مقترنة بعام 1340هـ، ووفاته في الرياض في 1 أغسطس 2005. ولا يتضمن صندوق معلوماتها حقلًا للدين؛ وتصنيفاتها تدرجه في «مسلمون سنة سعوديون»."
  en: "Arabic Wikipedia article on Fahd bin Abdulaziz Al Saud; used for entity facts only. Its infobox, citing a book by Fahd bin Abdullah al-Samari and Nasir bin Muhammad al-Juhaimi, gives his birth at Riyadh as 16 March 1921 paired with the year 1340 AH, and his death at Riyadh on 1 August 2005. Its infobox has no religion field; its categories file him under 'Saudi Sunni Muslims'."
