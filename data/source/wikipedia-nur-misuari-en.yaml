  ar: "مقالة ويكيبيديا الإنجليزية عن نور ميسواري (وُلد 1939)؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 3 مارس 1939 في تابول بسولو باسم نورالاجي بينانغ ميسواري، وتأسيسه وقيادته للجبهة الوطنية لتحرير مورو، وحكومته لمنطقة الحكم الذاتي في مينداناو المسلمة (1996–2001)، وتمرده سنة 2001 وأزمة زامبوانغا 2013 وإدانته بالفساد سنة 2024."
  en: "English Wikipedia article on Nur Misuari (born 1939); used for entity facts only. It gives his birth on 3 March 1939 at Tapul, Sulu, under the name Nurallaji Pinang Misuari, his founding and leadership of the Moro National Liberation Front, his governorship of the Autonomous Region in Muslim Mindanao (1996–2001), the 2001 rebellion, the 2013 Zamboanga crisis, and his 2024 graft conviction."
