summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن نور ميسواري ⁦(وُلد 1939)⁩؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 3 مارس 1939 في تابول بسولو باسم نورالاجي بينانغ ميسواري، وتأسيسه وقيادته للجبهة الوطنية لتحرير مورو، وحكومته لمنطقة الحكم الذاتي في مينداناو المسلمة (1996–2001)، وتمرده سنة 2001 وأزمة زامبوانغا 2013 وإدانته بالفساد سنة 2024."
  en: "English Wikipedia article on Nur Misuari (born 1939); used for entity facts only. It gives his birth on 3 March 1939 at Tapul, Sulu, under the name Nurallaji Pinang Misuari, his founding and leadership of the Moro National Liberation Front, his governorship of the Autonomous Region in Muslim Mindanao (1996–2001), the 2001 rebellion, the 2013 Zamboanga crisis, and his 2024 graft conviction."
  es: "Artículo de la Wikipedia en inglés sobre Nur Misuari (nacido en 1939); utilizado únicamente para datos sobre la persona. En él se indica su nacimiento el 3 de marzo de 1939 en Tapul, Sulu, con el nombre de Nurallaji Pinang Misuari, la fundación y el liderazgo del Frente Moro de Liberación Nacional, su mandato como gobernador de la Región Autónoma del Mindanao Musulmán (1996-2001), la rebelión de 2001, la crisis de Zamboanga de 2013 y su condena por corrupción en 2024."
  fr: "Article de Wikipédia en anglais sur Nur Misuari (né en 1939); utilisé uniquement pour les informations sur l’entité. Il indique sa naissance le 3 mars 1939 à Tapul, Sulu, sous le nom de Nurallaji Pinang Misuari, la fondation et la direction du Front de libération nationale Moro, son mandat de gouverneur de la Région autonome de Mindanao musulmane (1996-2001), la rébellion de 2001, la crise de Zamboanga de 2013 et sa condamnation pour corruption en 2024."
