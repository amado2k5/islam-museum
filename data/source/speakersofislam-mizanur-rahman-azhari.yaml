  ur: "میزان الرحمن ازہری کی سوانح حیات سپیکرز آف اسلام کی ویب سائٹ پر، 16 مارچ 2025 کو شائع ہوئی۔ اس کی پیدائش، تعلیم اور اپنے تبلیغی کیریئر کے آغاز کے لیے دوسرے پروفائل کے طور پر استعمال کیا گیا۔"
  tr: "İslami Vaizler web sitesinde 16 Mart 2025'te yayımlanan Mizan al-Rahman Azhari'nin biyografisi, doğumu, eğitimi ve misyonerlik yolculuğunun başlangıcı olayları için ikincil bir kaynak olarak hizmet vermektedir."
  id: "Biografi Mizan al-Rahman Azhari di situs web Penceramah Islam, yang diterbitkan pada 16 Maret 2025, menjadi sumber sekunder untuk peristiwa kelahiran, pendidikan, dan awal perjalanan misinya."
