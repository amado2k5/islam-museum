summary:
  ar: "سيرة ميزان الرحمن أزهري في موقع خطباء الإسلام، نُشرت في 16 مارس 2025؛ تُستخدم مصدرا ثانيا لوقائع ولادته وتعليمه وبداية مسيرته الدعوية."
