summary:
  ar: "الجزء الثاني من تحقيق عادل مرشد لرواية الحسين بن الحسن المروزي عن ابن المبارك، على نسختين خطيتين، مع استدراك ما سقط من بعض الآثار والرواة في الطبعات السابقة كما يقول الغلاف."
  en: "Part 2 of Adil Murshid's edition of al-Husayn ibn al-Hasan al-Marwazi's recension from Ibn al-Mubarak, based on two manuscripts, which according to its title page restores reports and narrators missing in earlier printings."
  ur: "حسین بن حسن مروزی کی ابن المبارک سے روایت کی عادل مرشد کی تحقیق کا دوسرا جزء، دو قلمی نسخوں پر مبنی، جو سرورق کے مطابق پچھلی طباعتوں میں ساقط آثار اور راویوں کی تلافی کرتا ہے۔"
