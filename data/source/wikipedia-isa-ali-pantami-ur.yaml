summary:
  ar: "مقالة ويكيبيديا الأردية عن عيسى علي بنتامي؛ مقالة قصيرة مشتقة من المقالة الإنجليزية، تُستخدم لوقائع الكيان فقط. تصفه بأنه أستاذ جامعي وموظف حكومي نيجيري، نشط بين 2016 و2023، وتفيله في فئة المسلمين النيجيريين."
  en: "Urdu Wikipedia article on Isa Ali Pantami; a short stub derived from the English article, used for entity facts only. It describes him as a Nigerian university teacher and civil servant active between 2016 and 2023 and files him under Nigerian Muslims."
  es: "Artículo de Wikipedia en urdu sobre Isa Ali Pantami; un breve extracto derivado del artículo en inglés, utilizado únicamente para datos sobre la persona. Lo describe como un profesor universitario y funcionario público nigeriano que estuvo activo entre 2016 y 2023, y lo clasifica dentro de los musulmanes nigerianos."
  fr: "Article Wikipédia en ourdou sur Isa Ali Pantami; une brève ébauche dérivée de l’article anglais, utilisée uniquement pour fournir des informations factuelles. Il le décrit comme un professeur d’université et fonctionnaire nigérian ayant exercé ses fonctions entre 2016 et 2023 et le classe dans la catégorie des musulmans nigérians."
  ur: "عیسیٰ علی پنتامی پر اردو ویکیپیڈیا مضمون؛ انگریزی مضمون سے ماخوذ ایک مختصر سٹب، صرف ہستی کے حقائق کے لیے استعمال ہوتا ہے۔ اس میں اسے نائیجیرین یونیورسٹی کے استاد اور 2016 اور 2023 کے درمیان سرگرم سرکاری ملازم کے طور پر بیان کیا گیا ہے اور اسے نائجیریا کے مسلمانوں کے تحت فائل کیا گیا ہے۔"
  tr: "Isa Ali Bentami hakkında Urduca Wikipedia makalesi; İngilizce makaleden türetilmiş kısa bir makale, yalnızca varlığın gerçekleri için kullanılmıştır. Onu 2016 ile 2023 yılları arasında aktif olan Nijeryalı bir üniversite profesörü ve devlet yetkilisi olarak tanımlar ve Nijeryalı Müslümanlar arasında sınıflandırır."
  id: "Artikel Urdu Wikipedia tentang Isa Ali Bentami; artikel pendek yang diambil dari artikel bahasa Inggris, hanya digunakan untuk fakta entitas. Ia menggambarkannya sebagai profesor universitas dan pejabat pemerintah Nigeria, aktif antara 2016 dan 2023, dan mengklasifikasikannya di antara Muslim Nigeria."
