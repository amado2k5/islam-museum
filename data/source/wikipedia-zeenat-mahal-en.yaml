summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن زينت محل؛ تُستخدم لوقائع الكيان فقط. تروي زواجها من بهادر شاه ظفر سنة 1840، وسعيها لتنصيب ابنها وليًّا للعهد، ونفيها إلى رانغون ووفاتها سنة 1886، ولا تذكر دينها في متنها."
  en: "English Wikipedia article on Zeenat Mahal; used for entity facts only. It recounts her marriage to Bahadur Shah Zafar in 1840, her campaign to have her son named heir, her exile to Rangoon and her death in 1886, and makes no statement of her religion in its text."
  es: "Artículo de la Wikipedia en inglés sobre Zeenat Mahal; se utiliza únicamente para obtener información sobre la persona. Relata su matrimonio con Bahadur Shah Zafar en 1840, su campaña para que su hijo fuera nombrado heredero, su exilio a Rangún y su muerte en 1886, y no menciona su religión en el texto."
  fr: "Article de Wikipédia en anglais sur Zeenat Mahal; utilisé uniquement à des fins d’information sur la personne. Il relate son mariage avec Bahadur Shah Zafar en 1840, sa campagne pour que son fils soit désigné héritier, son exil à Rangoun et sa mort en 1886, sans mentionner sa religion."
  ur: "زینت محل پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1840 میں بہادر شاہ ظفر سے اس کی شادی، اپنے بیٹے کو وارث رکھنے کی مہم، رنگون میں اس کی جلاوطنی اور 1886 میں اس کی موت کا ذکر ہے، اور اس کے متن میں اس کے مذہب کا کوئی بیان نہیں ہے۔"
