  ar: "مقالة ويكيبيديا الإندونيسية عن أحمد الخطيب المنكباوي؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده يوم الاثنين 6 ذي الحجة 1276هـ، وتذكر أن تلاميذه تلقّوا عنه الفقه الشافعي وأنه مُدوَّن في طبقات الشافعية لسراج الدين عباس، ووفاته في متنها 13 آذار 1916."
  en: "Indonesian Wikipedia article on Ahmad Khatib al-Minangkabawi; used for entity facts only. It pairs his birth with Monday 6 Dhu al-Hijjah 1276 AH, records that his students were taught Shafi'i fiqh by him and that he is enrolled in Siradjuddin Abbas's Thabaqat al-Shafi'iyah, and gives his death in its body text as 13 March 1916."
