  ar: "مقالة ويكيبيديا الإنجليزية عن محمد مصدق؛ تُستخدم لوقائع الكيان فقط. تروي رئاسته لحكومة إيران 1951–1953 وتأميمه النفط وإطاحته بانقلاب 1953 ووفاته تحت الإقامة الجبرية، وتعطي ميلاده في طهران في 16 حزيران 1882 ووفاته فيها في 5 آذار 1967. لا يذكر صندوقها ولا نصّها أي انتماء ديني شخصي له."
  en: "English Wikipedia article on Mohammad Mosaddegh; used for entity facts only. It recounts his premiership of Iran from 1951 to 1953, the nationalisation of the oil industry, his overthrow in the 1953 coup and his death under house arrest; it gives his birth in Tehran on 16 June 1882 and his death there on 5 March 1967. Neither its infobox nor its text makes any statement of his personal religious affiliation."
