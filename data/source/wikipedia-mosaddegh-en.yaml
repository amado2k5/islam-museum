summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد مصدق؛ تُستخدم لوقائع الكيان فقط. تروي رئاسته لحكومة إيران 1951–1953 وتأميمه النفط وإطاحته بانقلاب 1953 ووفاته تحت الإقامة الجبرية، وتعطي ميلاده في طهران في 16 حزيران 1882 ووفاته فيها في 5 آذار 1967. لا يذكر صندوقها ولا نصّها أي انتماء ديني شخصي له."
  en: "English Wikipedia article on Mohammad Mosaddegh; used for entity facts only. It recounts his premiership of Iran from 1951 to 1953, the nationalisation of the oil industry, his overthrow in the 1953 coup and his death under house arrest; it gives his birth in Tehran on 16 June 1882 and his death there on 5 March 1967. Neither its infobox nor its text makes any statement of his personal religious affiliation."
  es: "Artículo de la Wikipedia en inglés sobre Mohammad Mosaddegh; utilizado únicamente para datos sobre la persona. Relata su mandato como primer ministro de Irán entre 1951 y 1953, la nacionalización de la industria petrolera, su derrocamiento en el golpe de Estado de 1953 y su muerte bajo arresto domiciliario. Indica que nació en Teherán el 16 de junio de 1882 y falleció allí el 5 de marzo de 1967. Ni su ficha informativa ni su texto mencionan su afiliación religiosa."
  fr: "Article de Wikipédia en anglais sur Mohammad Mossadegh; utilisé uniquement à des fins d'information sur l'entité. Il relate son mandat de Premier ministre d'Iran de 1951 à 1953, la nationalisation de l'industrie pétrolière, son renversement lors du coup d'État de 1953 et sa mort en résidence surveillée; il indique sa naissance à Téhéran le 16 juin 1882 et son décès dans cette même ville le 5 mars 1967. Ni son infobox ni son texte ne font mention de son appartenance religieuse."
  ur: "محمد مصدق پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1951 سے 1953 تک ایران میں ان کی وزارت عظمیٰ، تیل کی صنعت کو قومیانے، 1953 کی بغاوت میں ان کا تختہ الٹنے اور نظر بندی میں ان کی موت کا ذکر ہے۔ اس کی پیدائش 16 جون 1882 کو تہران میں ہوئی اور 5 مارچ 1967 کو اس کی موت ہوئی۔"
