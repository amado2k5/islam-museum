summary:
  ar: "مقالة ويكيبيديا العربية عن نجيب رزاق ⁦(وُلد 1953)⁩؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 23 يوليو 1953 وأنه ابن رئيس الوزراء السابق عبد الرزاق حسين، ورئاسته السادسة لوزراء ماليزيا من أبريل 2009 حتى مايو 2018."
  en: "Arabic Wikipedia article on Najib Razak (born 1953); used for entity facts only. It gives his birth on 23 July 1953, names him a son of the former prime minister Abdul Razak Hussein, and gives his tenure as Malaysia's sixth prime minister from April 2009 to May 2018."
  es: "Artículo en árabe de la Wikipedia sobre Najib Razak (nacido en 1953); utilizado únicamente para datos sobre la persona. Indica que nació el 23 de julio de 1953, que es hijo del ex primer ministro Abdul Razak Hussein y que fue sexto primer ministro de Malasia desde abril de 2009 hasta mayo de 2018."
  fr: "Article de Wikipédia en arabe sur Najib Razak (né en 1953); utilisé uniquement à des fins d'information sur l'entité. Il indique sa date de naissance, le 23 juillet 1953, précise qu'il est le fils de l'ancien Premier ministre Abdul Razak Hussein et mentionne son mandat de sixième Premier ministre de Malaisie, d'avril 2009 à mai 2018."
  ur: "نجیب رزاق ⁦(پیدائش 1953)⁩ پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 23 جولائی 1953 کو ان کی پیدائش کرتا ہے، اسے سابق وزیر اعظم عبدالرزاق حسین کے بیٹے کا نام دیتا ہے، اور اپریل 2009 سے مئی 2018 تک ملائیشیا کے چھٹے وزیر اعظم کے طور پر ان کی مدت ملازمت دیتا ہے۔"
