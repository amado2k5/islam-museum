summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سونن قيري ⁦(رادين فاكو)⁩؛ تعطي ولادته 1442 في بلنبانغان ووفاته 1506 في كبوماس بغريسيك وأباه مولانا إسحاق ودراسته عند سونن أمبل وتأسيسه مدرسة قيري كداتون ومواقفه الأرثوذكسية."
  en: "English Wikipedia article on Sunan Giri (Raden Paku); it gives his birth in 1442 at Blambangan, death in 1506 at Kebomas, Gresik, his father Maulana Ishak, his study under Sunan Ampel, his founding of the Giri Kedaton school and his orthodox stance."
  es: "Artículo de la Wikipedia en inglés sobre Sunan Giri (Raden Paku); en él se menciona su nacimiento en 1442 en Blambangan, su muerte en 1506 en Kebomas, Gresik, su padre Maulana Ishak, sus estudios con Sunan Ampel, la fundación de la escuela Giri Kedaton y su postura ortodoxa."
  fr: "Article de Wikipédia en anglais sur Sunan Giri (Raden Paku); il donne sa naissance en 1442 à Blambangan, sa mort en 1506 à Kebomas, Gresik, son père Maulana Ishak, ses études auprès de Sunan Ampel, la fondation de l'école Giri Kedaton et sa position orthodoxe."
  ur: "سنن گری ⁦(راڈن پاکو)⁩ پر انگریزی ویکیپیڈیا مضمون؛ یہ 1442 میں بلمبنگن میں ان کی پیدائش، 1506 میں کیبوماس، گریسک میں موت، ان کے والد مولانا اسحاق، سنن امپل کے تحت ان کی تعلیم، گیری کیڈاٹن اسکول کی بنیاد اور ان کے آرتھوڈوکس موقف کے بارے میں۔"
  tr: "Sonen Qiri (Radin Faku) hakkında İngilizce Wikipedia makalesi; 1442'de Blenbangan'da doğduğunu ve 1506'da Gresik'teki Kapomas'ta öldüğünü, babası Mawlana Ishaq'ı, Sonen Ambel ile çalışmalarını, Qiri Kadatun okulunun kuruluşunu ve ortodoks görüşlerini anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Sonen Qiri (Radin Faku); menceritakan kelahirannya pada tahun 1442 di Blenbangan dan kematiannya pada tahun 1506 di Kapomas, Gresik, ayahnya Mawlana Ishaq, studinya dengan Sonen Ambel, pendirian aliran Qiri Kadatun, dan posisi-posisi ortodoksnya."
