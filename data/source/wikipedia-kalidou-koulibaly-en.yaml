  ar: "مقالة ويكيبيديا الإنجليزية عن خاليدو كوليبالي؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في سينت ديه دي فوج لأبوين سنغاليين، ومسيرته من متز وغنك إلى نابولي وتشيلسي والهلال، وقيادته السنغال إلى لقب كأس أمم أفريقيا 2021، ومواقفه ضد العنصرية في إيطاليا."
  en: "English Wikipedia article on Kalidou Koulibaly; used for entity facts only. It recounts his upbringing in Saint-Dié-des-Vosges to Senegalese parents, his career from Metz and Genk to Napoli, Chelsea and Al-Hilal, his captaincy of Senegal to the 2021 Africa Cup of Nations title, and his stance against racism in Italy."
