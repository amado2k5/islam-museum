summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن خاليدو كوليبالي؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في سينت ديه دي فوج لأبوين سنغاليين، ومسيرته من متز وغنك إلى نابولي وتشيلسي والهلال، وقيادته السنغال إلى لقب كأس أمم أفريقيا 2021، ومواقفه ضد العنصرية في إيطاليا."
  en: "English Wikipedia article on Kalidou Koulibaly; used for entity facts only. It recounts his upbringing in Saint-Dié-des-Vosges to Senegalese parents, his career from Metz and Genk to Napoli, Chelsea and Al-Hilal, his captaincy of Senegal to the 2021 Africa Cup of Nations title, and his stance against racism in Italy."
  es: "Artículo de la Wikipedia en inglés sobre Kalidou Koulibaly; utilizado únicamente para obtener información sobre la persona. Narra su infancia en Saint-Dié-des-Vosges, con padres senegaleses, su trayectoria profesional desde el Metz y el Genk hasta el Napoli, el Chelsea y el Al-Hilal, su capitanía con Senegal en la conquista de la Copa Africana de Naciones 2021 y su postura contra el racismo en Italia."
  fr: "Article de Wikipédia en anglais sur Kalidou Koulibaly; utilisé uniquement à des fins d’information sur l’entité. Il relate son enfance à Saint-Dié-des-Vosges, de parents sénégalais, sa carrière de Metz et Genk à Naples, Chelsea et Al-Hilal, son capitanat du Sénégal jusqu’à la victoire à la Coupe d’Afrique des Nations 2021, et sa prise de position contre le racisme en Italie."
  ur: "Kalidou Koulibaly پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں سینیگالی والدین کے لیے سینٹ-ڈی-ڈیس-واسجیس میں ان کی پرورش، میٹز اور جینک سے لے کر ناپولی، چیلسی اور الہلال تک ان کا کیریئر، 2021 افریقہ کپ آف نیشنز ٹائٹل تک سینیگال کی ان کی کپتانی، اور اٹلی میں نسل پرستی کے خلاف ان کے موقف کا ذکر ہے۔"
  tr: "Khalidou Coulibaly hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Saint-de-Deux'deki büyüme tarzını Senegalli ebeveynlere, Metz ve Genk'ten Napoli, Chelsea ve Al Hilal'e olan yolculuğunu, Senegal'i 2021 Afrika Uluslar Kupası şampiyonluğuna liderlik edişini ve İtalya'daki ırkçılığa karşı tutumlarını anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Khalidou Coulibaly; digunakan hanya untuk fakta entitas. Artikel ini menceritakan masa kecilnya di Saint-de-Deux kepada orang tua Senegal, perjalanannya dari Metz dan Genk ke Napoli, Chelsea, dan Al Hilal, kepemimpinannya di Senegal hingga gelar Piala Afrika 2021, serta sikapnya melawan rasisme di Italia."
