reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026; the reading route did not expose a revision id, so the consultation date is recorded in place of a revision. It gives Koulibaly as born on 20 June 1991 in Saint-Dié-des-Vosges to Senegalese parents; professional debut for Metz in August 2010; Genk from June 2012 (Belgian Cup 2013); Napoli from July 2014 (Supercoppa Italiana 2014, Coppa Italia 2020); Chelsea 2022-23; Al-Hilal from 2023; Senegal captain, Africa Cup of Nations winner 2021 and runner-up 2019 and 2025. Its personal-life section states 'He is a Muslim and stated that his name derives from the Quran', citing The Players' Tribune; it names no school. Its early-life section quotes him describing his childhood neighbourhood as 'black, white, Arab, African, Muslim, Christian' — a description of his environment, not an attestation of a school."
