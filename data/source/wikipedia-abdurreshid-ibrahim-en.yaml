summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الرشيد إبراهيم؛ تعطي ميلاده في 23 أبريل 1857 في تارا بسيبيريا، ودراسته في المدينة ومكة وإسطنبول، وقضاءه في جمعية أورنبورغ، وقيادته «اتفاق المسلمين»، ورحلاته إلى الصين واليابان وكونه أول إمام لمسجد طوكيو."
  en: "English Wikipedia article on Abdurreshid Ibrahim; used for entity facts only. It gives his birth on 23 April 1857 at Tara, Siberia, his studies in Medina, Mecca and Istanbul, his qadi service at the Orenburg assembly, his leadership in Ittifaq al-Muslimin, his travels to China and Japan, and his role as first imam of the Tokyo Mosque."
  es: "Artículo de la Wikipedia en inglés sobre Abdurreshid Ibrahim; utilizado únicamente para datos biográficos. Describe su nacimiento el 23 de abril de 1857 en Tara, Siberia, sus estudios en Medina, La Meca e Estambul, su servicio como cadí en la asamblea de Orenburg, su liderazgo en Ittifaq al-Muslimin, sus viajes a China y Japón, y su papel como primer imán de la Mezquita de Tokio."
  fr: "Article de Wikipédia en anglais sur Abdurreshid Ibrahim; utilisé uniquement pour les informations le concernant. Il mentionne sa naissance le 23 avril 1857 à Tara, en Sibérie, ses études à Médine, La Mecque et Istanbul, son service de cadi à l’assemblée d’Orenbourg, son rôle de dirigeant au sein d’Ittifaq al-Muslimin, ses voyages en Chine et au Japon, et sa fonction de premier imam de la mosquée de Tokyo."
  ur: "عبدالرشید ابراہیم پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 23 اپریل 1857 کو تارا، سائبیریا میں ان کی پیدائش، مدینہ، مکہ اور استنبول میں ان کی تعلیم، اورینبرگ اسمبلی میں ان کی قاضی خدمات، اتحاد المسلمین میں ان کی قیادت، چین اور جاپان کے سفر اور ٹوکیو مسجد کے پہلے امام کے طور پر ان کا کردار۔"
