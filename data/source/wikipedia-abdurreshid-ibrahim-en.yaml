  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الرشيد إبراهيم؛ تعطي ميلاده في 23 أبريل 1857 في تارا بسيبيريا، ودراسته في المدينة ومكة وإسطنبول، وقضاءه في جمعية أورنبورغ، وقيادته «اتفاق المسلمين»، ورحلاته إلى الصين واليابان وكونه أول إمام لمسجد طوكيو."
  en: "English Wikipedia article on Abdurreshid Ibrahim; used for entity facts only. It gives his birth on 23 April 1857 at Tara, Siberia, his studies in Medina, Mecca and Istanbul, his qadi service at the Orenburg assembly, his leadership in Ittifaq al-Muslimin, his travels to China and Japan, and his role as first imam of the Tokyo Mosque."
