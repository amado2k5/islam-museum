reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It treats his birth year as unsettled — about 1610-1612, commonly placed at 1611, with Linehan giving 1611, Djajadiningrat about 1610 and Lombard about 1612 — and gives his youthful names Raja Mughal, Raja Bungsu and Sultan Husein Syah, his Pahang father Sultan Ahmad Syah (generally identified with Ahmad Shah II), his reign from 27 December 1636 to 15 February 1641, his legal reforms replacing ordeal proof with witness procedure under Islamic law, and his strong patronage of Nuruddin ar-Raniri, whom it calls a Shafi'i scholar — that school is ar-Raniri's, not the sultan's. It names no school or order for Iskandar Thani himself. Checked 1 November 2026."
