  ar: "مقالة ويكيبيديا العربية عن محمد رضا بهلوي؛ تُستخدم لوقائع الكيان فقط. تروي تولّيه عرش إيران سنة 1941 وإصلاحاته وخروجه من البلاد مع الثورة ووفاته في القاهرة سنة 1980. يعطي صندوق معلوماتها مذهبه بصيغة «شيعي اثنا عشري»، أما نصّها فلا ينصّ على انتماء شخصي له."
