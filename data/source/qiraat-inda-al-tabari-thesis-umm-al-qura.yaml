  en: "al-Qira'at 'inda Abi Ja'far al-Tabari fi Daw' al-Lugha wa'l-Nahw — Ahmad Khalid Babakr (doctoral thesis, Umm al-Qura University, 1982–1983)"
  ur: "القراءات عند ابی جعفر الطبری فی ضوء اللغۃ والنحو — احمد خالد بابکر (پی ایچ ڈی مقالہ، جامعہ ام القریٰ، 1982–1983ء)"
summary:
  ar: "رسالة دكتوراه في اللغة العربية قدمها أحمد خالد بابكر إلى قسم الدراسات العليا، الفرع اللغوي، بكلية اللغة العربية في جامعة أم القرى بمكة المكرمة، بإشراف الدكتور عبد العزيز برهام، للعام 1402–1403هـ؛ تدرس جهود الطبري اللغوية والنحوية من خلال توجيهه للقراءات التي أوردها في «جامع البيان»، وتعرّف به عالمًا من علماء اللغة والنحو والقراءات."
  en: "A doctoral thesis in Arabic by Ahmad Khalid Babakr for the graduate studies department (linguistics branch) of the Faculty of Arabic at Umm al-Qura University in Mecca, supervised by Dr Abd al-Aziz Burham, 1402–1403 AH; it studies al-Tabari's work in language and grammar through his handling of the readings he cites in Jami' al-Bayan, and presents him as a scholar of language, grammar and the readings."
  ur: "عربی زبان میں پی ایچ ڈی کا مقالہ، جو احمد خالد بابکر نے جامعہ ام القریٰ مکہ مکرمہ کی کلیۃ اللغۃ العربیہ کے شعبۂ اعلیٰ تعلیم (لسانی شاخ) کو ڈاکٹر عبد العزیز برہام کی نگرانی میں 1402–1403ھ میں پیش کیا؛ اس میں «جامع البیان» میں مذکور قراءتوں کی توجیہ کے ذریعے طبری کی لسانی اور نحوی خدمات کا مطالعہ ہے، اور انہیں لغت، نحو اور قراءات کے عالم کے طور پر متعارف کرایا گیا ہے۔"
