summary:
  ar: "مقالة ويكيبيديا الأردية عن أمان الله خان؛ طبعة مرافقة للمقالة الإنجليزية تُستخدم لوقائع الكيان فقط، وتعطي مولده سنة 1892 وحكمه 1919-1929 ووفاته في زيورخ سنة 1960."
  en: "Urdu Wikipedia article on Amanullah Khan; a companion edition to the English article, used for entity facts only, giving his birth in 1892, his rule of 1919–1929 and his death at Zurich in 1960."
  es: "Artículo de Wikipedia en urdu sobre Amanullah Khan; una edición complementaria del artículo en inglés, utilizada únicamente para datos sobre la persona, que indica su nacimiento en 1892, su reinado de 1919 a 1929 y su muerte en Zúrich en 1960."
  fr: "Article de Wikipédia en ourdou sur Amanullah Khan; une édition complémentaire à l'article en anglais, utilisée uniquement pour les informations sur l'entité, indiquant sa naissance en 1892, son règne de 1919 à 1929 et sa mort à Zurich en 1960."
  ur: "امان اللہ خان پر اردو ویکیپیڈیا مضمون؛ انگریزی مضمون کا ایک ساتھی ایڈیشن، جو صرف ہستی کے حقائق کے لیے استعمال ہوتا ہے، اس کی پیدائش 1892 میں ہوئی، اس کی حکومت 1919-1929 اور اس کی موت 1960 میں زیورخ میں ہوئی۔"
  tr: "Amanullah Khan hakkında Urduca Wikipedia makalesi; yalnızca varlığın olayları için kullanılan İngilizce makalenin eşlik eden bir baskısı; 1892'de doğum, 1919-1929 yılları arasında hükümdarlığı ve 1960'ta Zürih'te ölmesi."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang Amanullah Khan; edisi pendamping artikel bahasa Inggris yang hanya digunakan untuk peristiwa entitas tersebut, mengingat kelahirannya pada tahun 1892, masa pemerintahannya 1919-1929, dan kematiannya di Zurich pada tahun 1960."
