summary:
  ar: "مقالة ويكيبيديا الأردية عن وزير أكبر خان؛ مقالة قصيرة تُستخدم لوقائع الكيان فقط. تعطي مولده في 15 أكتوبر 1816 ووفاته سنة 1845 في جلال آباد ودفنه عند ضريح حضرة علي، وأباه أمير دوست محمد خان. لا تحمل المقالة أي حقل للديانة."
  en: "Urdu Wikipedia article on Wazir Akbar Khan; a short article used for entity facts only. It gives his birth as 15 October 1816, his death in 1845 at Jalalabad and his burial at the shrine of Hazrat Ali, and names his father as Emir Dost Mohammad Khan. The article carries no religion field."
  es: "Artículo de Wikipedia en urdu sobre Wazir Akbar Khan; un breve artículo que solo incluye datos biográficos. Indica que nació el 15 de octubre de 1816, falleció en 1845 en Jalalabad y fue enterrado en el santuario de Hazrat Ali. Menciona a su padre como Emir Dost Mohammad Khan. El artículo no incluye información sobre religión."
  fr: "Article de Wikipédia en ourdou sur Wazir Akbar Khan; un article court contenant uniquement des informations factuelles. Il indique sa naissance le 15 octobre 1816, son décès en 1845 à Jalalabad et son inhumation au mausolée de Hazrat Ali. Son père est mentionné comme étant l’émir Dost Mohammad Khan. L’article ne comporte pas de champ relatif à la religion."
  ur: "وزیر اکبر خان پر اردو ویکیپیڈیا مضمون؛ ایک مختصر مضمون جو صرف ہستی کے حقائق کے لیے استعمال ہوتا ہے۔ اس میں ان کی پیدائش 15 اکتوبر 1816، ان کی وفات 1845 میں جلال آباد میں ہوئی اور حضرت علی کے مزار پر ان کی تدفین ہوئی، اور اپنے والد کا نام امیر دوست محمد خان رکھا گیا۔ مضمون میں کوئی مذہب نہیں ہے۔"
  tr: "Vezir Ekber Han hakkında Urduca Vikipedi makalesi; sadece varlığın gerçekleri için kullanılan kısa bir makale. 15 Ekim 1816'da doğumunu, 1845'te Celalabad'da öldüğünü ve Hazret Ali ile babası Emir Dost Muhammed Han'ın türbesinde defnedilmesini anlatır. Makalede herhangi bir din alanı yer almıyor."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang Wazir Akbar Khan; artikel pendek yang hanya digunakan untuk fakta entitas tersebut. Artikel ini menceritakan kelahirannya pada 15 Oktober 1816, kematiannya pada tahun 1845 di Jalalabad, dan pemakamannya di makam Hazrat Ali dan ayahnya Amir Dost Muhammad Khan. Artikel tersebut tidak memuat bidang agama apapun."
