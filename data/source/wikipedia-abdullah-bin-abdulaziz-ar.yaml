summary:
  ar: "مقالة ويكيبيديا العربية عن عبد الله بن عبد العزيز آل سعود؛ تُستخدم لوقائع الكيان فقط. يذكر صندوق معلوماتها ولادته في الرياض في 1 أغسطس 1924 ووفاته في الرياض في 23 يناير 2015، دون حقل للدين؛ وتصنيفاتها تدرجه في «مسلمون سنة سعوديون»."
  en: "Arabic Wikipedia article on Abdullah bin Abdulaziz Al Saud; used for entity facts only. Its infobox gives his birth at Riyadh on 1 August 1924 and his death at Riyadh on 23 January 2015, with no religion field; its categories file him under 'Saudi Sunni Muslims'."
  es: "Artículo en árabe de la Wikipedia sobre Abdullah bin Abdulaziz Al Saud; utilizado únicamente para datos sobre la persona. Su ficha informativa indica que nació en Riad el 1 de agosto de 1924 y falleció en Riad el 23 de enero de 2015, sin especificar su religión; sus categorías lo clasifican como «musulmán sunita saudí»."
  fr: "Article Wikipédia en arabe sur Abdullah bin Abdulaziz Al Saud; utilisé uniquement pour les informations sur l'entité. Son infobox indique sa naissance à Riyad le 1er août 1924 et son décès à Riyad le 23 janvier 2015, sans mention de religion; ses catégories le classent dans la catégorie « Musulmans sunnites saoudiens »."
  ur: "عبداللہ بن عبدالعزیز آل سعود پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا معلوماتی خانہ یکم اگست 1924 کو ریاض میں اس کی پیدائش اور 23 جنوری 2015 کو ریاض میں اس کی موت، بغیر کسی مذہب کے۔ اس کے زمرے اسے 'سعودی سنی مسلمان' کے تحت فائل کرتے ہیں۔"
