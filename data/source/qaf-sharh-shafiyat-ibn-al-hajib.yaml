summary:
  ar: "الصفحة «Sharh Shafiyat Ibn al-Hajib» — Qaf؛ لخّصها ملخص بحثي قدّمه المؤسس إلى المتحف في 21 نوفمبر 2026؛ لم يفتح المتحف الصفحة، ووافق المؤسس على استعمال الملخص دون إعادة تحقق. استُعملت في: كتاب «Sharh Shafiyat Ibn al-Hajib» ومؤلفه وتاريخه."
  en: "The page «Sharh Shafiyat Ibn al-Hajib» — Qaf; summarised in a research file supplied to the museum by the founder on 21 November 2026; the museum did not open the page, and the founder approved using the summary without re-verification. Used for: the book «Sharh Shafiyat Ibn al-Hajib»: its author and date."
  ur: "صفحہ «Sharh Shafiyat Ibn al-Hajib» — Qaf؛ اسے ایک تحقیقی فائل نے خلاصہ کیا جو بانی نے 21 نومبر 2026 کو میوزیم کو دی؛ میوزیم نے صفحہ نہیں کھولا اور بانی نے دوبارہ جانچ کے بغیر خلاصہ استعمال کرنے کی منظوری دی۔ استعمال: کتاب «Sharh Shafiyat Ibn al-Hajib»، اس کے مصنف اور تاریخ کا بیان۔"
  fr: "La page «Sharh Shafiyat Ibn al-Hajib» — Qaf ; résumée dans un fichier de recherche remis au musée par le fondateur le 21 novembre 2026 ; le musée n'a pas ouvert la page, et le fondateur a approuvé l'usage de la synthèse sans nouvelle vérification. Utilisée pour : le livre « Sharh Shafiyat Ibn al-Hajib » : son auteur et sa date."
  es: "La página «Sharh Shafiyat Ibn al-Hajib» — Qaf; resumida en un archivo de investigación entregado al museo por el fundador el 21 de noviembre de 2026; el museo no abrió la página, y el fundador aprobó usar el resumen sin volver a verificar. Usada para: el libro «Sharh Shafiyat Ibn al-Hajib»: su autor y su fecha."
  tr: "\"Şerh Şafiyat İbn el-Hacib\" sayfası — Kaf; kurucu tarafından 21 Kasım 2026'da müzeye sunulan bir araştırma özetiyle özetlenmiştir; müze sayfayı açmamış ve kurucu özeti yeniden doğrulama yapmadan kullanmayı kabul etmiştir. Kullanıldığı bölümler: \"Şerh Şafiyat İbn el-Hacib\" kitabında, yazarı ve tarihçesi."
  id: "Halaman \"Sharh Shafiyat Ibn al-Hajib\" — Qaf; dirangkum oleh ringkasan penelitian yang diserahkan oleh pendiri ke museum pada 21 November 2026; museum tidak membuka halaman tersebut, dan pendiri setuju menggunakan ringkasan tersebut tanpa verifikasi ulang. Digunakan dalam: buku \"Sharh Shafiyat Ibn al-Hajib,\" penulisnya, dan sejarahnya."
