summary:
  ar: "المجلد الأول من طبعة حجرية لـ«ميزان الاعتدال» للذهبي، طُبعت في الهند بأمر المولوي محمد خادم حسين العظيم آبادي كما في صفحة عنوانها؛ يبدأ بخطبة المؤلف ومقدمته في منهج الكتاب، ثم التراجم على حروف المعجم من الألف إلى آخر حرف الظاء، وفي آخره «خاتمة الطبع»."
  en: "Volume 1 of a lithograph edition of al-Dhahabi's Mizan al-I'tidal, printed in India by order of al-Mawlawi Muhammad Khadim Husayn al-Azimabadi according to its title page; it opens with the author's preface and his introduction on the book's method, then the entries in alphabetical order from alif to the end of the letter za', closing with a printer's colophon."
