summary:
  ar: "مقالة ويكيبيديا العربية الموجزة عن كفاية الله الدهلوي ⁦(1292–1372 هـ / 1875–1952 م)⁩؛ تُستخدم لوقائع الكيان فقط. تذكر نسبه «كفاية الله بن عناية الله بن فيض الله الحنفي الدهلوي» وشيوخه عبد العلي الميروتي وخليل أحمد السهارنفوري ومحمود حسن الديوبندي، وكتابه «كفاية المفتي»."
  en: "Short Arabic Wikipedia article on Kifayatullah Dehlvi (1292–1372 AH / 1875–1952); used for entity facts only. It gives his lineage as 'Kifayatullah ibn Inayatullah ibn Faidhullah al-Hanafi al-Dehlavi', names his teachers Abd al-Ali al-Miruthi, Khalil Ahmad Saharanpuri and Mahmud Hasan Deobandi, and lists his fatwa collection Kifayat al-Mufti."
  es: "Breve artículo árabe de Wikipedia sobre Kifayatullah Dehlvi (1292–1372 AH / 1875–1952); Se utiliza únicamente para hechos de entidades. Da su linaje como 'Kifayatullah ibn Inayatullah ibn Faidhullah al-Hanafi al-Dehlavi', nombra a sus maestros Abd al-Ali al-Miruthi, Khalil Ahmad Saharanpuri y Mahmud Hasan Deobandi, y enumera su colección de fatwas Kifayat al-Mufti."
  fr: "Court article Wikipédia en arabe sur Kifayatullah Dehlvi (1292-1372 AH / 1875-1952); utilisé uniquement pour les faits d’entité. Il donne sa lignée comme « Kifayatullah ibn Inayatullah ibn Faidhullah al-Hanafi al-Dehlavi », nomme ses professeurs Abd al-Ali al-Miruthi, Khalil Ahmad Saharpuri et Mahmud Hasan Deobandi, et énumère son recueil de fatwas Kifayat al-Mufti."
  ur: "کفایت اللہ دہلوی ⁦(1292-1372ھ / 1875-1952)⁩ پر مختصر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کا شجرہ نسب 'کفایت اللہ ابن عنایت اللہ ابن فید اللہ الحنفی الدہلوی' کے نام سے ملتا ہے، ان کے اساتذہ کا نام عبد العلی المیروتی، خلیل احمد سہارنپوری اور محمود حسن دیوبندی رکھا گیا ہے، اور ان کے فتویٰ مجموعہ کفایت المفتی کی فہرست دی گئی ہے۔"
