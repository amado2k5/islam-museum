summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سرتور فقير (سعيد الله خان)؛ تُستخدم لوقائع الكيان فقط. تروي مولده في قرية ريغا بوادي بونير من قبيلة يوسفزي، وسفره للتعليم الديني وإقامته عشر سنوات في مزار شريف وعودته سنة 1895، وإعلانه الجهاد وقيادته آلاف المقاتلين ضد حصون ملاكند وچاكدرّه في يوليو 1897، ووفاته سنة 1917 (أو 1918). لا تعطي المقالة تاريخ مولد ولا تسمّي مدرسة ولا طريقة."
  en: "English Wikipedia article on Sartor Faqir (Saidullah Khan); used for entity facts only. It recounts his birth at Rega in the Buner Valley to a Yusufzai family, his travels for religious education including ten years at Mazar-i-Sharif and his return in 1895, his proclamation of jihad and leadership of the July 1897 assaults on Malakand and Chakdara, and his death in 1917 (given also as 1918). It gives no birth date and names no school or Sufi order for him; the British epithets it records ('Mad Mullah', 'Mad Faqir') are colonial labels, quoted as such."
  ur: "سرتور فقیر (سعید اللہ خان) پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال ہوتا ہے۔ اس میں ان کی بونیر میں پیدائش، 1897ء میں ملاکنڈ اور چکدرہ پر حملوں کی قیادت اور 1917ء میں وفات کا ذکر ہے۔"
