reliability_note: "A scholarly national encyclopedia entry, independent of Wikipedia. Read in full on 25 October 2026. It styles him businessman, zamindar, philanthropist, social worker and builder of the Dhaka Nawab estate. It agrees with the English Wikipedia article on the birth and death dates and places, and adds: his father Khwaja Alimullah (d. 1854) came to Dhaka from Kashmir via Uttar Pradesh; the 1846 waqfnama making Abdul Ghani mutawalli; his plea for amnesty for the sepoys after 1857; the honorary magistracy in 1861 (the English article's dated list gives the municipality commissionership in 1864 and the magistracy in 1866); his presidency of the panchayat system and its turbans for mahalla leaders; the asylum of 1866; the water plant at about 2.5 lakh rupees; and that 'he was intensely a religious man', whose charity extended to the Nahr-i-Zubaida at Mecca and to financing others' Hajj. It records his arbitration of the 1869 Shia–Sunni riot without naming his own school — relevant to the faith note in the person record. It gives his burial as the family graveyard at Begum Bazar (the English article names the Kartalab Khan Mosque, which stands in Begum Bazar; both are recorded)."
