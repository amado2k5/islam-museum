summary:
  ar: "مدخل خواجة عبد الغني في بنغلابيديا، الموسوعة الوطنية لبنغلاديش، بقلم محمد عالمغير؛ تُستخدم لوقائع الكيان فقط. تؤكد مولده في 30 يوليو 1813 في بيغوم بازار بدكا ووفاته في منزل إحسان في 24 أغسطس 1896، وتفصّل ولايته للأملاك ونظام البانشايات وأعماله الخيرية."
  en: "Entry 'Ghani, Nawab Khwaja Abdul' in Banglapedia, the national encyclopedia of Bangladesh, by Mohammad Alamgir; used for entity facts only. It confirms his birth on 30 July 1813 at Begum Bazar, Dhaka, and his death at Ahsan Manzil on 24 August 1896, and details his trusteeship of the estate, the panchayat system and his charities."
