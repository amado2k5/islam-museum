summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سيد راس مسعود (1889–1937)؛ تُستخدم لوقائع الكيان فقط. تروي أنه ابن سيد محمود وحفيد السيد أحمد خان، ومسيرته في التعليم في باتنا وحيدرآباد، وتوليه منصب نائب رئيس جامعة عليكرة الإسلامية من سنة 1929 حتى وفاته."
  en: "English Wikipedia article on Syed Ross Masood (1889–1937); used for entity facts only. It recounts that he was the son of Syed Mahmood and grandson of Syed Ahmad Khan, his education career in Patna and Hyderabad, and his vice-chancellorship of Aligarh Muslim University from 1929 until his death."
  es: "Artículo de la Wikipedia en inglés sobre Syed Ross Masood (1889-1937); utilizado únicamente para datos sobre la persona. Relata que era hijo de Syed Mahmood y nieto de Syed Ahmad Khan, su trayectoria académica en Patna y Hyderabad, y su cargo como vicerrector de la Universidad Musulmana de Aligarh desde 1929 hasta su fallecimiento."
  fr: "Article de Wikipédia en anglais sur Syed Ross Masood (1889-1937); utilisé uniquement à des fins d’information sur la personne. Il relate qu’il était le fils de Syed Mahmood et le petit-fils de Syed Ahmad Khan, son parcours scolaire à Patna et Hyderabad, et son poste de vice-chancelier de l’Université musulmane d’Aligarh de 1929 jusqu’à sa mort."
  ur: "سید راس مسعود (1889-1937) پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں بتایا گیا ہے کہ وہ سید محمود کے بیٹے اور سید احمد خان کے پوتے تھے، ان کا تعلیمی کیریئر پٹنہ اور حیدرآباد میں تھا، اور 1929 سے ان کی وفات تک علی گڑھ مسلم یونیورسٹی کے وائس چانسلر رہے۔"
  tr: "Syed Ras Masood (1889–1937) hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Anlatılanlara göre, Syed Mahmood'un oğlu ve Syed Ahmed Khan'ın torunu olduğu, Patna ve Haydarabad'daki eğitim kariyeri ve 1929'dan ölümüne kadar Aligarh İslam Üniversitesi Başkan Yardımcısı olarak atandığı anlatılır."
  id: "Artikel Wikipedia bahasa Inggris tentang Syed Ras Masood (1889–1937); digunakan hanya untuk fakta entitas. Diceritakan bahwa ia adalah putra Syed Mahmood dan cucu Syed Ahmed Khan, karier pendidikannya di Patna dan Hyderabad, serta diangkat sebagai Wakil Presiden Universitas Islam Aligarh dari tahun 1929 hingga wafatnya."
