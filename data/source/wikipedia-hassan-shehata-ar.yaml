summary:
  ar: "مقالة ويكيبيديا العربية عن حسن شحاتة؛ تُستخدم لوقائع الكيان فقط. تذكر ميلاده في 19 يونيو 1947 بكفر الدوار، وتغطي سنوات لعبه للزمالك وكاظمة وسجله مدربًا لمنتخب مصر."
  en: "Arabic Wikipedia article on Hassan Shehata; used for entity facts only. It likewise gives his birth as 19 June 1947 at Kafr El Dawwar and covers his Zamalek and Kazma playing years and his Egypt managerial record."
  es: "Artículo de Wikipedia en árabe sobre Hassan Shehata; utilizado únicamente para obtener información sobre la persona. Asimismo, indica que nació el 19 de junio de 1947 en Kafr El Dawwar y abarca sus años como jugador en el Zamalek y el Kazma, así como su trayectoria como entrenador de la selección egipcia."
  fr: "Article Wikipédia en arabe sur Hassan Shehata; utilisé uniquement pour les informations relatives à l’entité. Il indique également sa date de naissance, le 19 juin 1947, à Kafr El Dawwar et retrace ses années de joueur à Zamalek et Kazma ainsi que son expérience d’entraîneur en équipe nationale d’Égypte."
  ur: "حسن شہتا پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اسی طرح اس کی پیدائش 19 جون 1947 کو کفر الدوار میں ہوئی اور اس کے زمالک اور کاظمہ کے کھیل کے سالوں اور اس کے مصر کے انتظامی ریکارڈ کا احاطہ کیا۔"
  tr: "Hassan Shehata hakkında Arapça Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 19 Haziran 1947'de Kafr El-Dawar'da doğduğu belirtilmiştir; Zamalek ve Kazma için oynadığı yıllar ile Mısır milli takımının antrenörlüğü kariyerini kapsar."
  id: "Artikel Wikipedia bahasa Arab tentang Hassan Shehata; digunakan hanya untuk fakta entitas. Ia disebutkan lahir pada 19 Juni 1947 di Kafr El-Dawar, mencakup masa bermainnya untuk Zamalek dan Kazma, serta rekam jejaknya sebagai pelatih tim nasional Mesir."
