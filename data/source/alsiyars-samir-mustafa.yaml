reliability_note: "A biographical encyclopedia written in a sympathetic register; used with attribution for the outline of his life: his full name (Samir ibn Mustafa al-Suyuti), his kunya Abu Abd al-Rahman, his birth in Egypt in about 1976 and his upbringing and residence in Helwan, south of Cairo, his teachers (Hasan Abu al-Ashbal al-Zuhayri, Abu Ishaq al-Heweny, Muhammad Abd al-Maqsud al-Afifi, Ata ibn Abd al-Latif, and Mohamed Hussein Yaqoub, whose company he kept for ten years), his pulpit at the al-Haqq Mosque in Helwan and his lesson series preserved in the Islamweb archive, his arrest at Cairo airport on 6 June 2017 while travelling for Umrah, his acquittal and re-arrest, and his ongoing trial as one of 312 defendants in the case known as the Jabhat al-Nusra cell, with sessions adjourned into October 2026 and no verdict issued. Its info table and text both describe his affiliation as an independent Salafi and his madhhab as al-Shafi'i — a single source's attestation, recorded here exactly. Read in full on 26 October 2026."
