summary:
  ar: "سيرة سمير مصطفى في موسوعة سير أعلام المعاصرين (alsiyars.com)؛ تذكر اسمه الكامل ونسبه السيوطي وميلاده بمصر في نحو سنة 1976 وإقامته بحلوان وشيوخه ومنبره بمسجد الحق واعتقاله سنة 2017 ومحاكمته الجارية."
  en: "Biography of Samir Mustafa in the Alsiyars encyclopedia of contemporary figures (alsiyars.com); it gives his full name and al-Suyuti lineage, his birth in Egypt in about 1976, his residence in Helwan, his teachers, his pulpit at the al-Haqq Mosque, his 2017 arrest and his ongoing trial."
  es: "Biografía de Samir Mustafa en la enciclopedia Alsiyars de figuras contemporáneas (alsiyars.com); en ella se indica su nombre completo y linaje al-Suyuti, su nacimiento en Egipto alrededor de 1976, su residencia en Helwan, sus maestros, su púlpito en la mezquita al-Haqq, su arresto en 2017 y su juicio en curso."
  fr: "Biographie de Samir Mustafa dans l'encyclopédie Alsiyars des personnalités contemporaines (alsiyars.com); elle donne son nom complet et sa lignée al-Suyuti, sa naissance en Égypte vers 1976, sa résidence à Helwan, ses enseignants, sa chaire à la mosquée al-Haqq, son arrestation en 2017 et son procès en cours."
  ur: "ہم عصر شخصیات کے السیار انسائیکلوپیڈیا میں سمیر مصطفی کی سوانح عمری (alsiyars.com)؛ اس میں اس کا پورا نام اور السیوطی نسب، تقریباً 1976 میں مصر میں اس کی پیدائش، ہیلوان میں اس کی رہائش، اس کے اساتذہ، الحق مسجد میں اس کا منبر، اس کی 2017 کی گرفتاری اور اس کا جاری مقدمہ درج ہے۔"
