  ar: "مقالة ويكيبيديا الفرنسية عن سرين مصطفى سي، ابن الشيخ أحمد التيجاني سي والمسؤول الأخلاقي عن جماعة المسترشدين؛ تُستخدم هنا لتوثيق أن حركة المسترشدين خرجت من حضن الطريقة التيجانية وأن والد المؤسس كان مرشدها الروحي الذي أكّد طابعها الرسمي في 20 فبراير 1978."
  en: "French Wikipedia article on Serigne Moustapha Sy, son of Cheikh Ahmed Tidiane Sy and moral head of the Dahiratoul Moustarchidina; used here for its record that the Moustarchidina movement came out of the bosom of the Tijani brotherhood and that his father, as its spiritual guide, confirmed the movement's official character on 20 February 1978."
