reliability_note: "Read at the recorded revision via the MediaWiki API on 1 November 2026 and re-asserted on a second live query; used for entity facts only. It names Serigne Moustapha Sy (born 10 June 1952 at Tivaouane), son of Serigne Cheikh Al-Maktoum, as responsable moral of the Dahiratoul Moustarchidina wal Moustarchidaty; states that the movement 'est sorti du giron de la confrérie tidiane' and was born at Tivaouane in one of Senegal's most important Tijani families, the Sy family; records on Rassoul Keïta's account that on 20 February 1978 'Serigne Cheikh Ahmed Tidiane Sy, le guide spirituel, confirme le caractère officiel de ce mouvement'; and it cites the scholarship on the movement, Leonardo Alfonso Villalon's chapter 'The Moustarchidine of Senegal. The Family Politics of a Contemporary Tijan Movement' in Jean-Louis Triaud (ed.), La Tijâniyya. Une confrérie musulmane à la conquête de l'Afrique (Karthala, 2005), and Fabienne Samson, Les marabouts de l'islam politique. Le Dahiratoul Moustarchidina Wal Moustarchidaty, un mouvement néo-confrérique sénégalais (Karthala, 2005)."
