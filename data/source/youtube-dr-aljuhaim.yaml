  ar: "قناته على يوتيوب (@Dr_Aljuhaim) باسم «Khaled Aljuhaim خالد الجهيّم»، تصف نفسها بأنها قناة مختصة بتلاوات القرآن الكريم وتسجيلات الشيخ د. خالد يوسف الجهيّم، وفيها سور كاملة من ليالي رمضان 1443–1447هـ وتلاوات من صلوات الفجر والعشاء."
