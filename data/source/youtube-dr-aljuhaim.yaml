summary:
  ar: "قناته على يوتيوب (@Dr_Aljuhaim) باسم «Khaled Aljuhaim خالد الجهيّم»، تصف نفسها بأنها قناة مختصة بتلاوات القرآن الكريم وتسجيلات الشيخ د. خالد يوسف الجهيّم، وفيها سور كاملة من ليالي رمضان 1443–1447هـ وتلاوات من صلوات الفجر والعشاء."
  en: "His YouTube channel (@Dr_Aljuhaim), named 'Khaled Aljuhaim'; its description calls it a channel specialising in Qur'an recitations and recordings of Sheikh Dr. Khalid Yusuf al-Juhaim, and it carries complete surahs from the Ramadan nights of 1443–1447 AH and recitations from the Fajr and Isha prayers."
  es: "Su canal de YouTube (@Dr_Aljuhaim), llamado 'Khaled Aljuhaim', se describe como un canal especializado en recitaciones del Corán y grabaciones del Sheikh Dr. Khalid Yusuf al-Juhaim, y contiene suras completas de las noches de Ramadán de 1443-1447 AH y recitaciones de las oraciones de Fajr e Isha."
  fr: "Sa chaîne YouTube (@Dr_Aljuhaim), nommée « Khaled Aljuhaim », est décrite comme une chaîne spécialisée dans les récitations et les enregistrements du Coran du cheikh Dr. Khalid Yusuf al-Juhaim, et elle propose des sourates complètes des nuits du Ramadan de 1443 à 1447 AH ainsi que des récitations des prières de Fajr et d'Isha."
  ur: "ان کا یوٹیوب چینل (@Dr_Aljuhaim)، جس کا نام 'خالد الجہیم' ہے؛ اس کی تفصیل اسے ایک چینل کہتی ہے جو قرآن کی تلاوت اور شیخ ڈاکٹر خالد یوسف الجہیم کی ریکارڈنگ میں مہارت رکھتا ہے، اور یہ 1443-1447 ہجری کی رمضان کی راتوں کی مکمل سورتیں اور فجر اور عشاء کی نمازوں کی تلاوت کرتا ہے۔"
  tr: "YouTube kanalı (@Dr_Aljuhaim) 'Halid Aljuhaim Khaled Al-Juhaim', kendisini Şeyh Dr. Halid Youssef Al-Juhaim'in Kur'an okavı ve kayıtları konusunda uzmanlaşmış bir kanal olarak tanımlar; Ramazan gecelerinden tam sureler ile Fajr ve İşa namazlarından okunmaları içerir."
  id: "Saluran YouTube-nya (@Dr_Aljuhaim) bernama 'Khaled Aljuhaim Khaled Al-Juhaim' menggambarkan dirinya sebagai saluran yang khusus membacakan Al-Quran dan rekaman Sheikh Dr. Khalid Youssef Al-Juhaim, menampilkan surah lengkap dari malam Ramadan 1443–1447 H serta bacaan dari shalat Fajr dan Isha."
