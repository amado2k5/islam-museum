summary:
  ar: "مقالة ويكيبيديا التركية عن متين غوراك ⁦(وُلد في 20 آب 1960 في كيزيلتبه بماردين)⁩، رئيس الأركان العامة الحادي والثلاثين؛ تذكر أنه من أسرة تركمانية هاجرت من الموصل ومسيرته في المدفعية والطيران البري وقيادة الجيش الثاني."
  en: "Turkish Wikipedia article on Metin Gürak (born 20 August 1960 in Kızıltepe, Mardin), the 31st chief of the General Staff; it records his Turkmen family that emigrated from Mosul and his career in artillery and army aviation up to command of the Second Army."
  es: "Artículo de la Wikipedia en turco sobre Metin Gürak (nacido el 20 de agosto de 1960 en Kızıltepe, Mardin), el 31.º jefe del Estado Mayor; en él se menciona a su familia turcomana que emigró de Mosul y su carrera en la artillería y la aviación del ejército hasta llegar al mando del Segundo Ejército."
  fr: "Article de Wikipédia turc sur Metin Gürak (né le 20 août 1960 à Kızıltepe, Mardin), le 31e chef d'état-major général; il relate sa famille turkmène qui a émigré de Mossoul et sa carrière dans l'artillerie et l'aviation de l'armée jusqu'au commandement de la deuxième armée."
  ur: "میٹن گورک ⁦(20 اگست 1960 کو Kızıltepe، Mardin میں پیدا ہوئے)⁩، 31 ویں چیف آف جنرل اسٹاف پر ترک ویکیپیڈیا کا مضمون؛ اس میں اس کے ترکمان خاندان کو ریکارڈ کیا گیا ہے جو موصل سے ہجرت کر کے آئے تھے اور آرٹلری اور آرمی ایوی ایشن میں اس کا کیریئر سیکنڈ آرمی کی کمان تک تھا۔"
  tr: "Genelkurmay Başkanı Metin Gücek (20 Ağustos 1960, Kızıltpe, Mardin doğumlu) hakkında Türkçe Wikipedia makalesi; Musul'dan göç etmiş Türkmen bir aileden geldiği ve topçu, kara havacılığı ve İkinci Ordu komutanlığı kariyerine sahip olduğu belirtilmektedir."
  id: "Artikel Wikipedia Turki tentang Metin Gürak (lahir 20 Agustus 1960, di Kızıltpe, Mardin), Kepala Staf Umum ke-31; dicatat bahwa ia berasal dari keluarga Turkmen yang bermigrasi dari Mosul dan memiliki karier di bidang artileri, penerbangan darat, serta komando Angkatan Darat Kedua."
