summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الرزاق حسين (1922–1976)؛ تُستخدم لوقائع الكيان فقط. تروي مولده في بيكان ببهانغ في 11 مارس 1922، وتعليمه، ومقاومته في الحرب، ونيابته لرئاسة الوزراء (1957–1970)، ورئاسته الثانية لوزراء ماليزيا (1970–1976) وسياسته الاقتصادية الجديدة، ووفاته في لندن في 14 يناير 1976، وأن ابنه الأكبر نجيب رزاق صار رئيس وزراء لاحقا."
  en: "English Wikipedia article on Abdul Razak Hussein (1922–1976); used for entity facts only. It recounts his birth at Pekan, Pahang, on 11 March 1922, his education, his wartime resistance work, his deputy premiership (1957–1970), his tenure as Malaysia's second prime minister (1970–1976) and his New Economic Policy, his death at London on 14 January 1976, and that his eldest son Najib Razak later became prime minister."
  es: "Artículo de la Wikipedia en inglés sobre Abdul Razak Hussein (1922-1976); utilizado únicamente para datos sobre la persona. Relata su nacimiento en Pekan, Pahang, el 11 de marzo de 1922, su educación, su labor en la resistencia durante la guerra, su viceprimer ministro (1957-1970), su mandato como segundo primer ministro de Malasia (1970-1976) y su Nueva Política Económica, su fallecimiento en Londres el 14 de enero de 1976, y que su hijo mayor, Najib Razak, se convirtió posteriormente en primer ministro."
  fr: "Article de Wikipédia en anglais sur Abdul Razak Hussein (1922-1976); utilisé uniquement pour les informations biographiques. Il relate sa naissance à Pekan, dans l’État de Pahang, le 11 mars 1922, ses études, son engagement dans la résistance pendant la guerre, son poste de vice-premier ministre (1957-1970), son mandat de deuxième premier ministre de Malaisie (1970-1976) et sa Nouvelle politique économique, sa mort à Londres le 14 janvier 1976, et précise que son fils aîné, Najib Razak, est devenu par la suite premier ministre."
  ur: "عبدالرزاق حسین (1922–1976) پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 11 مارچ 1922 کو پیکان، پہانگ میں ان کی پیدائش، ان کی تعلیم، ان کی جنگ کے دوران مزاحمتی کام، ان کی نائب وزیر اعظم شپ (1957-1970)، ملائیشیا کے دوسرے وزیر اعظم کے طور پر ان کی مدت کار (1970-1976) اور ان کی نئی اقتصادی پالیسی، ان کی وفات کا ذکر ہے، جو کہ 19 جنوری 1922 کو لندن میں ان کا بیٹا تھا اور ان کا انتقال 1967 میں ہوا تھا۔ رزاق بعد میں وزیراعظم بنے۔"
