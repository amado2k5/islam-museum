  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الرزاق حسين (1922–1976)؛ تُستخدم لوقائع الكيان فقط. تروي مولده في بيكان ببهانغ في 11 مارس 1922، وتعليمه، ومقاومته في الحرب، ونيابته لرئاسة الوزراء (1957–1970)، ورئاسته الثانية لوزراء ماليزيا (1970–1976) وسياسته الاقتصادية الجديدة، ووفاته في لندن في 14 يناير 1976، وأن ابنه الأكبر نجيب رزاق صار رئيس وزراء لاحقا."
  en: "English Wikipedia article on Abdul Razak Hussein (1922–1976); used for entity facts only. It recounts his birth at Pekan, Pahang, on 11 March 1922, his education, his wartime resistance work, his deputy premiership (1957–1970), his tenure as Malaysia's second prime minister (1970–1976) and his New Economic Policy, his death at London on 14 January 1976, and that his eldest son Najib Razak later became prime minister."
