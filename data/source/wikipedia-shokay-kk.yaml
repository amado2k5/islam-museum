summary:
  ar: "مقالة ويكيبيديا الكازاخية عن مصطفى شوكاي ⁦(25 ديسمبر 1890 – 27 ديسمبر 1941)⁩؛ تُستخدم لوقائع الكيان فقط. يذكر صندوق معلوماتها أنه رئيس وزراء حكومة تركستان المستقلة ومسقط رأسه أوليه تارانغيل ودينه الإسلام ⁦(السنّة)⁩، ويؤرّخ وفاته بـ27 ديسمبر 1941 في برلين."
  en: "Kazakh Wikipedia article on Mustafa Shokay (25 December 1890 – 27 December 1941); used for entity facts only. Its infobox names him premier of the Turkestan Autonomy, gives his birthplace as Aulie-Tarangyl and his religion as Islam (Sunni), and dates his death to 27 December 1941 at Berlin."
  es: "Artículo de la Wikipedia en kazajo sobre Mustafa Shokay (25 de diciembre de 1890 - 27 de diciembre de 1941); utilizado únicamente para datos sobre la persona. Su ficha informativa lo identifica como primer ministro de la Autonomía de Turkestán, indica que nació en Aulie-Tarangyl, que profesaba el islam (suní) y que falleció el 27 de diciembre de 1941 en Berlín."
  fr: "Article de Wikipédia en kazakh sur Mustafa Shokay (25 décembre 1890 – 27 décembre 1941); utilisé uniquement pour les informations sur l’entité. Son infobox le désigne comme Premier ministre de l’autonomie du Turkestan, indique son lieu de naissance comme étant Aulie-Tarangyl et sa religion comme étant l’islam sunnite, et date sa mort du 27 décembre 1941 à Berlin."
  ur: "مصطفی شوکے پر قازق ویکیپیڈیا کا مضمون ⁦(25 دسمبر 1890 - 27 دسمبر 1941)⁩؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کے انفو باکس میں اسے ترکستان کی خود مختاری کا پریمیئر قرار دیا گیا ہے، اس کی جائے پیدائش اولی ترنگیل اور اس کا مذہب اسلام ⁦(سنی)⁩ بتایا گیا ہے، اور اس کی موت 27 دسمبر 1941 کو برلن میں ہے۔"
  tr: "Mustafa Shukai hakkında Kazakça Vikipedi makalesi (25 Aralık 1890 – 27 Aralık 1941); yalnızca varlığın kronikleri için kullanılmıştır. Bilgi kutusunda, Bağımsız Türkistan Hükümeti'nin Başbakanı olduğu, doğum yerinin Oleh Tarangul olduğu ve dininin İslam (Sünni) olduğu belirtilmiştir; ölüm tarihi 27 Aralık 1941, Berlin'de gerçekleşmektedir."
  id: "Artikel Wikipedia Kazakh tentang Mustafa Shukai (25 Desember 1890 – 27 Desember 1941); hanya digunakan untuk kronik entitas tersebut. Kotak infonya menyebutkan bahwa ia adalah Perdana Menteri Pemerintah Turkestan Merdeka, tempat kelahirannya Oleh Tarangul, dan agamanya adalah Islam (Sunni), serta kematiannya tertanggal 27 Desember 1941 di Berlin."
