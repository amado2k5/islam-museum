summary:
  ar: "مقالة ويكيبيديا العربية عن رشيد الدين فضل الله الهمذاني (1247–1318)؛ تنص على ولادته في همدان لعائلة يهودية واعتناقه الإسلام في نحو الثلاثين، وتذكر عرضًا أنه كان على المذهب الحنفي في سياق حديثها عن تحوّل أولجايتو المذهبي، وتحفظ الخلاف بين الباحثين في أصله؛ تُستخدم لوقائع الكيان فقط مع هذه التنبيهات."
  en: "Arabic Wikipedia article on Rashid al-Din Fadl Allah al-Hamadani (1247-1318); it states he was born in Hamadan to a Jewish family and embraced Islam at about thirty, names the Hanafi school for him in a single passage on Oldjaitu's change of school, and preserves the scholarly disagreement over his origins; used for entity facts only, with those cautions."
  es: "Artículo de Wikipedia en árabe sobre Rashid al-Din Fadl Allah al-Hamadani (1247-1318); afirma que nació en Hamadán en el seno de una familia judía y que se convirtió al Islam alrededor de los treinta años, nombra la escuela Hanafi para él en un solo pasaje sobre el cambio de escuela de Oldjaitu y conserva el desacuerdo académico sobre sus orígenes; utilizado únicamente para datos objetivos, con las debidas precauciones."
  fr: "L'article de Wikipédia en arabe sur Rashid al-Din Fadl Allah al-Hamadani (1247-1318) indique qu'il est né à Hamadan dans une famille juive et s'est converti à l'islam vers l'âge de trente ans, mentionne l'école hanafite pour lui dans un seul passage sur le changement d'école d'Oldjaitu, et conserve le désaccord des érudits sur ses origines; à utiliser uniquement pour des faits concernant l'entité, avec ces mises en garde."
  ur: "عربی ویکیپیڈیا مضمون راشد الدین فضل اللہ الحمدانی (1247-1318) پر؛ اس میں کہا گیا ہے کہ وہ ہمدان میں ایک یہودی گھرانے میں پیدا ہوا تھا اور تقریباً تیس سال کی عمر میں اسلام قبول کیا تھا، اولڈجائیتو کے مکتب کی تبدیلی کے ایک حصے میں اس کے لیے حنفی مکتبہ کا نام دیا گیا ہے، اور اس کی اصلیت پر علمی اختلاف کو برقرار رکھا گیا ہے۔ ان احتیاطوں کے ساتھ، صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔"
