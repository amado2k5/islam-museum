reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It states he was born in Hamadan, that he embraced Islam at about thirty, and dates his killing to Jumada I 718 AH (1318). In its account of Oldjaitu it says the Ilkhan turned from the Hanafi school — glossing that Rashid was upon it — to the Shia school: the one passage in any text read that names a school for Rashid al-Din himself, and a single-text attestation. Its own religion section records that researchers still disagree whether he was born Jewish and converted, or born Muslim, while agreeing he lived the life of a sincere Muslim; it quotes Ibn Kathir, al-Dhahabi and Ibn Hajar for the Jewish origin. Checked 2 November 2026."
