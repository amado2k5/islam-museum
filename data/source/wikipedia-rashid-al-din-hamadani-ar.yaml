  ar: "مقالة ويكيبيديا العربية عن رشيد الدين فضل الله الهمذاني (1247–1318)؛ تنص على ولادته في همدان لعائلة يهودية واعتناقه الإسلام في نحو الثلاثين، وتذكر عرضًا أنه كان على المذهب الحنفي في سياق حديثها عن تحوّل أولجايتو المذهبي، وتحفظ الخلاف بين الباحثين في أصله؛ تُستخدم لوقائع الكيان فقط مع هذه التنبيهات."
  en: "Arabic Wikipedia article on Rashid al-Din Fadl Allah al-Hamadani (1247-1318); it states he was born in Hamadan to a Jewish family and embraced Islam at about thirty, names the Hanafi school for him in a single passage on Oldjaitu's change of school, and preserves the scholarly disagreement over his origins; used for entity facts only, with those cautions."
