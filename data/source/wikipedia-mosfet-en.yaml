summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ترانزستور موسفت؛ لوقائع الكيان فقط: ترانزستور أثر حقلي ببوابة معزولة يُصنع عادة بأكسدة السيليكون، اقترح ليلينفلد مبدأه عام 1925 دون بناء جهاز عامل، وأول جهاز موسفت عامل صنعه محمد عطا الله وداون كانغ في مختبرات بِل عام 1959 مستنداً إلى تخميل السطح بالأكسدة الحرارية، وهو أكثر أنواع الترانزستور شيوعاً في الدارات الرقمية بمليارات الترانزستورات في الشريحة الواحدة، وأساس منطق CMOS المنخفض الاستهلاك."
  en: "English Wikipedia article on the MOSFET; entity facts only: an insulated-gate field-effect transistor most commonly fabricated by controlled oxidation of silicon, the field-effect principle proposed by Lilienfeld in 1925 without a working device, the first working MOSFET made by Mohamed Atalla and Dawon Kahng at Bell Labs in 1959 on Atalla's earlier surface-passivation and thermal-oxidation work, by far the most common transistor in digital circuits with billions on a single chip, and the basis of low-power CMOS logic."
  es: "Artículo de la Wikipedia en inglés sobre el MOSFET; solo datos sobre la entidad: un transistor de efecto de campo de puerta aislada fabricado comúnmente mediante oxidación controlada de silicio, el principio de efecto de campo propuesto por Lilienfeld en 1925 sin un dispositivo funcional, el primer MOSFET funcional fabricado por Mohamed Atalla y Dawon Kahng en Bell Labs en 1959 sobre el trabajo previo de Atalla sobre pasivación de superficie y oxidación térmica, con mucho el transistor más común en circuitos digitales con miles de millones en un solo chip, y la base de la lógica CMOS de bajo consumo."
  fr: "Article de Wikipédia en anglais sur le MOSFET; informations sur l’entité uniquement: transistor à effet de champ à grille isolée, généralement fabriqué par oxydation contrôlée du silicium, principe de l’effet de champ proposé par Lilienfeld en 1925 sans dispositif fonctionnel, premier MOSFET fonctionnel réalisé par Mohamed Atalla et Dawon Kahng aux Bell Labs en 1959 sur la base des travaux antérieurs d’Atalla sur la passivation de surface et l’oxydation thermique, de loin le transistor le plus courant dans les circuits numériques avec des milliards sur une seule puce, et base de la logique CMOS basse consommation."
  ur: "MOSFET پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق: ایک موصل گیٹ فیلڈ ایفیکٹ ٹرانزسٹر جو سب سے زیادہ عام طور پر سلکان کے کنٹرول شدہ آکسیڈیشن کے ذریعے من گھڑت ہے، 1925 میں لیلین فیلڈ کی طرف سے بغیر کسی ورکنگ ڈیوائس کے تجویز کردہ فیلڈ ایفیکٹ اصول، پہلا کام کرنے والا MOSFET جسے محمد عطاللہ اور ڈاون کاہنگ نے بیل لیبز میں 1959 میں بنایا تھا تھرمل آکسیڈیشن کا کام، ڈیجیٹل سرکٹس میں ایک ہی چپ پر اربوں کے ساتھ اب تک کا سب سے عام ٹرانزسٹر، اور کم طاقت والے CMOS منطق کی بنیاد ہے۔"
