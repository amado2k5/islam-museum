summary:
  ar: "لقطات موقع islamtoday.net في أرشيف الإنترنت: أقدمها في 11 أبريل 2001 صورة بلا نص، وأقدم لقطة معنونة في 25 مارس 2002 بعنوان «islamtoday - A web site about islam and muslims»، وفي لقطة 7 فبراير 2003 صار العنوان «الإسلام اليوم - A web site about islam and muslims»."
  en: "Internet Archive captures of islamtoday.net: the earliest, of 11 April 2001, is an image with no text; the earliest titled capture, of 25 March 2002, is 'islamtoday - A web site about islam and muslims'; by the capture of 7 February 2003 the title reads «الإسلام اليوم» - A web site about islam and muslims."
  ur: "islamtoday.net کی انٹرنیٹ آرکائیو تصاویر: سب سے پرانی، 11 اپریل 2001، بغیر متن کی ایک تصویر ہے؛ عنوان والی پہلی، 25 مارچ 2002، «islamtoday - A web site about islam and muslims»؛ اور 7 فروری 2003 کی تصویر میں عنوان «الإسلام اليوم - A web site about islam and muslims» ہے۔"
  es: "Capturas de islamtoday.net en Internet Archive: la más antigua, del 11 de abril de 2001, es una imagen sin texto; la captura más antigua con título, del 25 de marzo de 2002, es 'islamtoday - Un sitio web sobre el islam y los musulmanes'; en la captura del 7 de febrero de 2003, el título dice «الإسلام اليوم» - Un sitio web sobre el islam y los musulmanes."
  fr: "Captures d'écran d'Internet Archive du site islamtoday.net: la plus ancienne, datée du 11 avril 2001, est une image sans texte; la première capture titrée, du 25 mars 2002, est « islamtoday - Un site web sur l'islam et les musulmans »; la capture du 7 février 2003 affiche le titre « الإسلام اليوم » - Un site web sur l'islam et les musulmans."
  tr: "islamtoday.net site ekran görüntüleri Internet Archive'da: 11 Nisan 2001'de bir metin resmi ve 25 Mart 2002'de \"islamtoday - İslam ve Müslümanlar hakkında bir web sitesi\" başlıklı ekran görüntüsü sunuyorum ve 7 Şubat 2003'te başlık \"Islam Today - İslam ve Müslümanlar hakkında bir web sitesi\" oldu."
  id: "islamtoday.net tangkapan layar situs di Internet Archive: Saya mempersembahkan pada 11 April 2001, sebuah gambar teks, dan tangkapan layar berjudul 25 Maret 2002, berjudul \"islamtoday - Situs web tentang Islam dan Muslim,\" dan pada 7 Februari 2003, judulnya menjadi \"Islam Today - Situs web tentang Islam dan Muslim.\""
