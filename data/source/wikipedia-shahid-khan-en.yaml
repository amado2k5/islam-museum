summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شاهد رفيق خان ⁦(وُلد في ١٨ تموز ١٩٥٠ في لاهور)⁩، رجل الأعمال الباكستاني الأمريكي مالك فليكس-إن-غيت وجاكسونفيل جاغوارز وفولهام؛ تذكر نشأته في لاهور في أسرة مسلمة وانتقاله إلى الولايات المتحدة سنة ١٩٦٧ ودراسته للهندسة وأعماله وملكيته الرياضية ووصف المقالة له بأنه مسلم غير ملتزم، دون أن تسمي له مذهبًا."
  en: "English Wikipedia article on Shahid Rafiq Khan (born 18 July 1950 in Lahore), Pakistani-American businessman who owns Flex-N-Gate, the Jacksonville Jaguars and Fulham F.C.; it records his Lahore upbringing in a Muslim family, his move to the United States in 1967, his engineering studies, his business and sports ownership and the article's description of him as a non-observant Muslim, without naming any school for him."
