summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شاهد رفيق خان ⁦(وُلد في ١٨ تموز ١٩٥٠ في لاهور)⁩، رجل الأعمال الباكستاني الأمريكي مالك فليكس-إن-غيت وجاكسونفيل جاغوارز وفولهام؛ تذكر نشأته في لاهور في أسرة مسلمة وانتقاله إلى الولايات المتحدة سنة ١٩٦٧ ودراسته للهندسة وأعماله وملكيته الرياضية ووصف المقالة له بأنه مسلم غير ملتزم، دون أن تسمي له مذهبًا."
  en: "English Wikipedia article on Shahid Rafiq Khan (born 18 July 1950 in Lahore), Pakistani-American businessman who owns Flex-N-Gate, the Jacksonville Jaguars and Fulham F.C.; it records his Lahore upbringing in a Muslim family, his move to the United States in 1967, his engineering studies, his business and sports ownership and the article's description of him as a non-observant Muslim, without naming any school for him."
  es: "Artículo de la Wikipedia en inglés sobre Shahid Rafiq Khan (nacido el 18 de julio de 1950 en Lahore), empresario paquistaní-estadounidense propietario de Flex-N-Gate, los Jacksonville Jaguars y el Fulham FC; en él se narra su infancia en Lahore en una familia musulmana, su traslado a Estados Unidos en 1967, sus estudios de ingeniería, su actividad empresarial y deportiva, y la descripción que hace el artículo de él como musulmán no practicante, sin mencionar ninguna escuela a la que haya asistido."
  fr: "L'article de Wikipédia en anglais sur Shahid Rafiq Khan (né le 18 juillet 1950 à Lahore), homme d'affaires pakistano-américain propriétaire de Flex-N-Gate, des Jaguars de Jacksonville et du Fulham FC, relate son enfance à Lahore dans une famille musulmane, son arrivée aux États-Unis en 1967, ses études d'ingénieur, ses activités commerciales et sportives, et le décrit comme un musulman non pratiquant, sans toutefois mentionner d'établissement scolaire."
