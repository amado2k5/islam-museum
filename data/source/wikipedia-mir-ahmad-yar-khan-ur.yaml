  ar: "المقال الأردي عن مير أحمد يار خان: مولده في لورالاي، وعمله مساعدا شخصيا لوكيل الحاكم العام في بلوشستان سنة 1921، وتدريبه العسكري في ژوب 1923، وولايته العهد 1928 وجلوسه على عرش قلات بعد وفاة والده، واعتقاله سنة 1958، وتعيينه حاكما لبلوشستان في 3 يناير 1974."
  en: "Urdu Wikipedia article on Mir Ahmad Yar Khan: his birth at Loralai, his appointment in 1921 as personal assistant to the Agent to the Governor-General in Balochistan, military training with the Zhob militia in 1923, his becoming crown prince in 1928 and succeeding on his father's death, his 1958 arrest, and his appointment as Governor of Balochistan on 3 January 1974. Its categories file him among 1902 births and 1979 deaths."
