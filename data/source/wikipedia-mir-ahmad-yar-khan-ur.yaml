reliability_note: >-
  Short tertiary article; its categories give 1902–1979, agreeing with
  the English article and Wikidata. Its honorific-laden opening styles
  him 'al-Hajj' inside his string of titles — an honorific, not an
  attestation of a school, and the record does not use it as one. It
  gives his accession only as following his father's death in
  September 1933, without a day. Retrieved in full via the MediaWiki
  API on 31 October 2026, the returned revision id asserted equal to
  the recorded one before any claim was drawn.
