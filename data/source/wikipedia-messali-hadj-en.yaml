summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مصالي الحاج؛ تُستخدم لوقائع الكيان فقط. تعطي مولده بتلمسان في 16 مايو 1898 ووفاته بباريس في 3 يونيو 1974 ودفنه بتلمسان، وتأسيسه نجم شمال إفريقيا (1926) وحزب الشعب (1937) وغيرهما. وعن دينه تقول إن عائلة أمه كانت من الطريقة الدرقاوية وإنه تلقى «تعليمًا دينيًا متأثرًا بالطريقة الدرقاوية الصوفية» (نايلور)."
  en: "English Wikipedia article on Messali Hadj; used for entity facts only. It gives his birth at Tlemcen on 16 May 1898, death in Paris on 3 June 1974 and burial place Tlemcen, and his founding of the Étoile nord-africaine (1926), the PPA (1937) and later movements. On religion it says his mother's family was affiliated with the Darqawiyya brotherhood and that he received 'a religious education influenced by the Darqawiyya Sufi order' (Naylor)."
