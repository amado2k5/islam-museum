summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مصالي الحاج؛ تُستخدم لوقائع الكيان فقط. تعطي مولده بتلمسان في 16 مايو 1898 ووفاته بباريس في 3 يونيو 1974 ودفنه بتلمسان، وتأسيسه نجم شمال إفريقيا (1926) وحزب الشعب (1937) وغيرهما. وعن دينه تقول إن عائلة أمه كانت من الطريقة الدرقاوية وإنه تلقى «تعليمًا دينيًا متأثرًا بالطريقة الدرقاوية الصوفية» ⁦(نايلور)⁩."
  en: "English Wikipedia article on Messali Hadj; used for entity facts only. It gives his birth at Tlemcen on 16 May 1898, death in Paris on 3 June 1974 and burial place Tlemcen, and his founding of the Étoile nord-africaine (1926), the PPA (1937) and later movements. On religion it says his mother's family was affiliated with the Darqawiyya brotherhood and that he received 'a religious education influenced by the Darqawiyya Sufi order' (Naylor)."
  es: "Artículo de Wikipedia en inglés sobre Messali Hadj; utilizado únicamente para datos sobre la persona. Indica su nacimiento en Tlemcen el 16 de mayo de 1898, su fallecimiento en París el 3 de junio de 1974 y su sepultura en Tlemcen, así como la fundación de la Étoile nord-africaine (1926), la PPA (1937) y movimientos posteriores. En cuanto a la religión, menciona que la familia de su madre estaba afiliada a la hermandad Darqawiyya y que recibió una educación religiosa influenciada por la orden sufí Darqawiyya (Naylor)."
  fr: "L'article de Wikipédia en anglais consacré à Messali Hadj, utilisé uniquement pour les informations le concernant, indique sa naissance à Tlemcen le 16 mai 1898, son décès à Paris le 3 juin 1974 et son inhumation à Tlemcen. Il mentionne également la fondation de l'Étoile nord-africaine (1926), du PPA (1937) et d'autres mouvements ultérieurs. Concernant sa religion, l'article précise que la famille de sa mère était affiliée à la confrérie Darqaouiyya et qu'il a reçu une éducation religieuse influencée par l'ordre soufi Darqaouiyya (Naylor)."
  ur: "Messali Hadj پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی پیدائش 16 مئی 1898 کو Tlemcen میں ہوئی، 3 جون 1974 کو پیرس میں موت اور Tlemcen کو دفن کرنے کی جگہ، اور اس کی Étoile nord-africaine (1926) PPA (1937) اور بعد کی تحریکوں کی بنیاد رکھی گئی۔ مذہب کے بارے میں یہ کہتا ہے کہ اس کی والدہ کا خاندان دارقاویہ بھائی چارے سے وابستہ تھا اور اس نے 'دارقاویہ صوفی حکم سے متاثر ہو کر مذہبی تعلیم حاصل کی' ⁦(نائلر)⁩۔"
  tr: "Messali Al-Hajj hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 16 Mayıs 1898'de Tlemcen'de doğduğunu, 3 Haziran 1974'te Paris'te öldüğünü, Tlemcen'de defnedilmesini ve Kuzey Afrika Yıldızı'nı (1926), Halk Partisi'ni (1937) ve diğerlerini kurduğunu anlatır. Dini konusunda, annesinin ailesinin Darqaviye tarikatından olduğu ve 'Darqaviye Sufi tarikatından etkilenen dini eğitim' aldığı söylenir (Naylor)."
  id: "Artikel Wikipedia bahasa Inggris tentang Messali Al-Hajj; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya di Tlemcen pada 16 Mei 1898, kematiannya di Paris pada 3 Juni 1974, pemakamannya di Tlemcen, serta pendirian North African Star (1926), Partai Rakyat (1937), dan lainnya. Mengenai agamanya, dikatakan bahwa keluarga ibunya berasal dari tarekat Darqawiya dan bahwa ia menerima 'pendidikan agama yang dipengaruhi oleh tarekat Sufi Darqawiya' (Naylor)."
