summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن منظمة منهاج القرآن العالمية (MQI): منظمة غير حكومية عالمية أسسها محمد طاهر القادري سنة 1980 في لاهور بباكستان ومقرها لاهور، ولها فروع في أكثر من مئة بلد، وموقعها minhaj.org."
  en: "The English Wikipedia article on Minhaj-ul-Quran International (MQI), a global non-governmental organisation founded by Muhammad Tahir-ul-Qadri in 1980 in Lahore, Pakistan, headquartered in Lahore with operations in over 100 countries; its website is given as www.minhaj.org."
  es: "El artículo de la Wikipedia en inglés sobre Minhaj-ul-Quran International (MQI), una organización no gubernamental global fundada por Muhammad Tahir-ul-Qadri en 1980 en Lahore, Pakistán, con sede en Lahore y operaciones en más de 100 países; su sitio web es www.minhaj.org."
  fr: "L'article de Wikipédia en anglais sur Minhaj-ul-Quran International (MQI), une organisation non gouvernementale mondiale fondée par Muhammad Tahir-ul-Qadri en 1980 à Lahore, au Pakistan, dont le siège social est à Lahore et qui opère dans plus de 100 pays; son site web est www.minhaj.org."
  ur: "منہاج القرآن انٹرنیشنل (MQI) پر انگلش ویکیپیڈیا کا مضمون، ایک عالمی غیر سرکاری تنظیم جس کی بنیاد محمد طاہر القادری نے 1980 میں لاہور، پاکستان میں رکھی تھی، جس کا صدر دفتر لاہور میں ہے جس کے 100 سے زائد ممالک میں آپریشنز ہیں۔ اس کی ویب سائٹ www.minhaj.org کے طور پر دی گئی ہے۔"
  tr: "Dünya Kur'an Müfredat Organizasyonu (MQI) hakkında İngilizce Wikipedia makalesi: 1980 yılında Pakistan'ın Lahor kentinde Muhammed Tahir El-Qadri tarafından kurulan, merkezi Lahor'da olan, yüzün üzerinde ülkede ve minhaj.org konumda şubeleri bulunan küresel bir sivil toplum kuruluşudur."
  id: "Artikel Wikipedia bahasa Inggris tentang World Quran Curriculum Organization (MQI): Sebuah organisasi non-pemerintah global yang didirikan oleh Muhammad Tahir Al-Qadri pada tahun 1980 di Lahore, Pakistan, berkantor pusat di Lahore, dengan cabang di lebih dari seratus negara dan lokasi minhaj.org."
