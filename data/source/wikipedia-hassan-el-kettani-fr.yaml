summary:
  ar: "مقالة ويكيبيديا الفرنسية عن حسن الكتاني؛ بذرة قصيرة لا تكاد تزيد عن سطرين. تثبت أنه داعية مغربي، اعتُقل في 18 فبراير 2003 وأعيدت محاكمته بعد تفجيرات الدار البيضاء في 16 مايو 2003 وحُكم عليه بعشرين سنة، ثم شمله العفو."
  en: "French Wikipedia article on Hassan El Kettani; a stub of a few lines. It gives him as a Moroccan preacher, arrested on 18 February 2003, retried after the Casablanca bombings of 16 May 2003 and sentenced to twenty years, then pardoned."
  es: "Artículo de la Wikipedia en francés sobre Hassan El Kettani; un esbozo de unas pocas líneas. Lo describe como un predicador marroquí, arrestado el 18 de febrero de 2003, juzgado nuevamente tras los atentados de Casablanca del 16 de mayo de 2003 y condenado a veinte años de prisión, para luego ser indultado."
  fr: "Article Wikipédia français sur Hassan El Kettani; un bref extrait de quelques lignes. Il est présenté comme un prédicateur marocain, arrêté le 18 février 2003, rejugé après les attentats de Casablanca du 16 mai 2003 et condamné à vingt ans de prison, puis gracié."
  ur: "حسن ال کیتانی پر فرانسیسی ویکیپیڈیا مضمون؛ چند سطروں کا سٹب۔ یہ اسے مراکش کے مبلغ کے طور پر دیتا ہے، جسے 18 فروری 2003 کو گرفتار کیا گیا، 16 مئی 2003 کے کاسا بلانکا بم دھماکوں کے بعد دوبارہ کوشش کی گئی اور بیس سال کی سزا سنائی گئی، پھر اسے معاف کر دیا گیا۔"
  tr: "Hassan Al-Kettani hakkında Fransızca Wikipedia makalesi; iki satırdan biraz uzun kısa bir taslak. Bu, onun Faslı bir vaiz olduğunu, 18 Şubat 2003'te tutuklandığını, 16 Mayıs 2003'teki Kazablanka bombalamalarından sonra yeniden yargılandığını, yirmi yıl hapis cezasına çarptırıldığını ve ardından affedildiğini kanıtlıyor."
  id: "Artikel Wikipedia Prancis tentang Hassan Al-Kettani; sebuah artikel singkat yang hampir tidak lebih dari dua baris. Artikel ini membuktikan bahwa dia adalah seorang pendeta Maroko, ditangkap pada 18 Februari 2003, diadili ulang setelah bom Casablanca pada 16 Mei 2003, dijatuhi hukuman dua puluh tahun, dan kemudian diampuni."
