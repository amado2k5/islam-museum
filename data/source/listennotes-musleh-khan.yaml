  fr: "La page du podcast Muslim Central consacrée à Musleh Khan contient sa biographie habituelle: né à Médine, en Arabie saoudite, imam au centre communautaire Sakinah de Toronto, animateur de la série en ligne « Ask Musleh », et a suivi pendant dix ans des études intensives à l’université de Médine aux côtés d’éminents érudits."
