summary:
  ar: "صفحة بودكاست مسلم سنترال لمصلح خان مع سيرته القياسية: وُلد في المدينة المنورة، إمام في مركز السكينة المجتمعي في تورنتو، مقدّم سلسلة «اسأل مصلح» على الإنترنت، وأكمل عقدًا من الدراسة المكثفة في جامعة المدينة إلى جانب علماء بارزين."
  en: "Muslim Central's podcast page for Musleh Khan with his standard biography: born in Medina, Saudi Arabia, an imam at the Sakinah Community Center in Toronto, host of the online series 'Ask Musleh', and completed a decade of intensive studies at the University of Medina alongside prominent scholars."
  es: "La página de podcasts de Muslim Central sobre Musleh Khan incluye su biografía habitual: nació en Medina, Arabia Saudita, es imán en el Centro Comunitario Sakinah en Toronto, presentador de la serie en línea 'Pregúntale a Musleh' y completó una década de estudios intensivos en la Universidad de Medina junto a destacados académicos."
  fr: "La page du podcast Muslim Central consacrée à Musleh Khan contient sa biographie habituelle: né à Médine, en Arabie saoudite, imam au centre communautaire Sakinah de Toronto, animateur de la série en ligne « Ask Musleh », et a suivi pendant dix ans des études intensives à l’université de Médine aux côtés d’éminents érudits."
  ur: "مسلم سنٹرل کا مصلح خان کے لیے ان کی معیاری سوانح عمری کے ساتھ پوڈ کاسٹ صفحہ: مدینہ، سعودی عرب میں پیدا ہوا، ٹورنٹو کے سکینہ کمیونٹی سینٹر میں امام، آن لائن سیریز 'اسک مصلح' کے میزبان، اور ممتاز اسکالرز کے ساتھ مدینہ یونیورسٹی میں ایک دہائی تک گہری تعلیم مکمل کی۔"
  tr: "Musleh Khan'ın rekor kıran biyografisiyle ilgili Muslim Central Podcast sayfası: Medine'de doğdu, Toronto'daki Sakina Toplum Merkezi'nde imam, çevrimiçi dizi \"Bir Reformcuya Sor\"un sunucusu ve Medina Üniversitesi'nde önde gelen akademisyenlerle birlikte on yıl yoğun eğitim aldı."
  id: "Halaman Podcast Muslim Central untuk Musleh Khan dengan biografi pemecah rekornya: Lahir di Madinah, imam di Sakina Community Centre di Toronto, pembawa acara serial daring \"Ask a Reformer,\" dan menyelesaikan satu dekade studi intensif di Universitas Medina bersama para cendekiawan terkemuka."
