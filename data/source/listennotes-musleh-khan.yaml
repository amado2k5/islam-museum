  ar: "صفحة بودكاست مسلم سنترال لمصلح خان مع سيرته القياسية: وُلد في المدينة المنورة، إمام في مركز السكينة المجتمعي في تورنتو، مقدّم سلسلة «اسأل مصلح» على الإنترنت، وأكمل عقدًا من الدراسة المكثفة في جامعة المدينة إلى جانب علماء بارزين."
  en: "Muslim Central's podcast page for Musleh Khan with his standard biography: born in Medina, Saudi Arabia, an imam at the Sakinah Community Center in Toronto, host of the online series 'Ask Musleh', and completed a decade of intensive studies at the University of Medina alongside prominent scholars."
