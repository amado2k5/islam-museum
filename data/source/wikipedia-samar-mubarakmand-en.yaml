  ar: "مقالة ويكيبيديا الإنجليزية عن سمر مبارك مند؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 17 سبتمبر 1942 براولبندي «في أسرة مسلمة»، وعمله في هيئة الطاقة الذرية الباكستانية وقيادته لمجموعة التشخيص وبرنامج الاختبارات الباردة، وتأسيسه «نسكوم». عبارة الأسرة خلفية عائلية لا تثبت دينا شخصيا."
  en: "English Wikipedia article on Samar Mubarakmand; used for entity facts only. It gives his birth as 17 September 1942 at Rawalpindi 'into a Muslim family', his Pakistan Atomic Energy Commission career heading the Diagnostic Group and the cold-test programme, and his founding of NESCOM. The family phrase is family background, not an attestation of personal affiliation."
