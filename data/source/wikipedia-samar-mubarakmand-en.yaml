summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سمر مبارك مند؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 17 سبتمبر 1942 براولبندي «في أسرة مسلمة»، وعمله في هيئة الطاقة الذرية الباكستانية وقيادته لمجموعة التشخيص وبرنامج الاختبارات الباردة، وتأسيسه «نسكوم». عبارة الأسرة خلفية عائلية لا تثبت دينا شخصيا."
  en: "English Wikipedia article on Samar Mubarakmand; used for entity facts only. It gives his birth as 17 September 1942 at Rawalpindi 'into a Muslim family', his Pakistan Atomic Energy Commission career heading the Diagnostic Group and the cold-test programme, and his founding of NESCOM. The family phrase is family background, not an attestation of personal affiliation."
  es: "Artículo de la Wikipedia en inglés sobre Samar Mubarakmand; utilizado únicamente para datos biográficos. Indica que nació el 17 de septiembre de 1942 en Rawalpindi en el seno de una familia musulmana, su trayectoria en la Comisión de Energía Atómica de Pakistán, donde dirigió el Grupo de Diagnóstico y el programa de pruebas en frío, y la fundación de NESCOM. La mención de la familia se refiere a sus antecedentes familiares, no a una afiliación personal."
  fr: "L'article de Wikipédia en anglais consacré à Samar Mubarakmand est utilisé uniquement à des fins d'information sur l'entité. Il indique sa naissance le 17 septembre 1942 à Rawalpindi, dans une famille musulmane, sa carrière au sein de la Commission pakistanaise de l'énergie atomique où il a dirigé le Groupe de diagnostic et le programme d'essais à froid, ainsi que la fondation de NESCOM. La mention de sa famille fait référence à son origine familiale et non à une affiliation personnelle."
  ur: "ثمر مبارک مند پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 17 ستمبر 1942 کو راولپنڈی میں 'ایک مسلم خاندان میں' پیدا ہوا، ان کا پاکستان اٹامک انرجی کمیشن کا کیریئر ڈائیگنوسٹک گروپ اور کولڈ ٹیسٹ پروگرام کی سربراہی، اور نیسکام کی بنیاد ہے۔ خاندانی جملہ خاندانی پس منظر ہے، ذاتی وابستگی کی تصدیق نہیں۔"
  tr: "Samar Mubarak Mand hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 17 Eylül 1942'de Müslüman bir ailede doğmuş olması, Pakistan Atom Enerjisi Otoritesi'ndeki çalışmaları, tanı grubunun ve soğuk test programının liderliği ve NSCOM'un kuruluşu olarak hatırlanmaktadır. 'Aile' ifadesi, kişisel bir dini kanıtlamayan bir aile geçmişidir."
  id: "Artikel Wikipedia bahasa Inggris tentang Samar Mubarak Mand; digunakan hanya untuk fakta entitas. Ia dikenang lahir pada 17 September 1942 dalam keluarga Muslim, pekerjaannya di Otoritas Energi Atom Pakistan, kepemimpinannya atas kelompok diagnostik dan program uji dingin, serta pendirian NSCOM. Frasa 'keluarga' adalah latar belakang keluarga yang tidak membuktikan agama pribadi."
