reliability_note: "Lecture transcript read in full on 1 November 2026 at the foundation's own site; the page dates the lecture to 15 November 2017 and names its translators. One sentence attests faith for Widjaja himself in the speaker's own voice — 'Beliau adalah umat Kristen yang sangat taat' (he is a very devout Christian) — and it is one of the two independent texts the person record's faith rests on (the foundation's English commemoration article reporting his own 2002 words is the other). The two texts have different authors, occasions and languages and neither copies the other."
