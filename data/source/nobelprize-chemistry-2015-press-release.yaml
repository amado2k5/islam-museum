reliability_note: "The awarding body's own release dated 7 October 2015, read in full on 16 November 2026. Gives the prize motivation, the daily DNA-damage framing (UV radiation, free radicals, spontaneous changes, copying defects at cell division), the three mapped mechanisms and their laureates, the xeroderma-pigmentosum-style consequence that defects in nucleotide excision repair lead to skin cancer under sunlight, the mismatch-repair thousandfold error reduction, the cancer-treatment significance, and the laureate biographies (Sancar: born 1946 Savur, PhD 1977 UT Dallas, Sarah Graham Kenan Professor at UNC Chapel Hill, US and Turkish citizen)."
