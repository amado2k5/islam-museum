summary:
  ar: "البيان الصحفي الرسمي لجائزة نوبل في الكيمياء 2015 إلى توماس ليندال وبول مودريتش وعزيز سانجار «لدراسات آلية إصلاح الحمض النووي»: يشرح أن الحمض النووي يتلف يومياً بالأشعة فوق البنفسجية والجذور الحرة وأخطاء النسخ، وأن ليندال رسم آلية إصلاح الاستئصال القاعدي، وسانجار رسم إصلاح الاستئصال النوكليوتيدي الذي تصلح به الخلايا ضرر الأشعة فوق البنفسجية — وخلله يُسبب سرطان الجلد عند التعرض للشمس — ومودريتش إصلاح عدم التطابق، وأن عملهم أساس لعلاجات سرطانية جديدة؛ الجائزة ثمانية ملايين كرونة مقسومة بالتساوي."
  en: "The official press release of the 2015 Nobel Prize in Chemistry to Tomas Lindahl, Paul Modrich and Aziz Sancar 'for mechanistic studies of DNA repair': it explains that DNA is damaged daily by UV radiation, free radicals and replication errors, that Lindahl mapped base excision repair, Sancar mapped nucleotide excision repair — the mechanism cells use to repair UV damage, whose defects cause skin cancer in sunlight — and Modrich demonstrated mismatch repair, and that their work underlies new cancer treatments; the eight-million-krona prize shared equally."
  es: "El comunicado de prensa oficial del Premio Nobel de Química 2015 otorgado a Tomas Lindahl, Paul Modrich y Aziz Sancar \"por sus estudios mecanísticos sobre la reparación del ADN\" explica que el ADN se daña diariamente por la radiación ultravioleta, los radicales libres y los errores de replicación; que Lindahl cartografió la reparación por escisión de bases; Sancar, la reparación por escisión de nucleótidos (el mecanismo que utilizan las células para reparar el daño causado por la radiación ultravioleta, cuyos defectos provocan cáncer de piel expuesto a la luz solar); y Modrich, que demostró la reparación de errores de emparejamiento. Además, su trabajo sienta las bases de nuevos tratamientos contra el cáncer. El premio, dotado con ocho millones de coronas suecas, se repartió a partes iguales."
  fr: "Le communiqué de presse officiel du prix Nobel de chimie 2015 décerné à Tomas Lindahl, Paul Modrich et Aziz Sancar « pour leurs études mécanistiques sur la réparation de l'ADN » explique que l'ADN est endommagé quotidiennement par les rayons UV, les radicaux libres et les erreurs de réplication, que Lindahl a cartographié la réparation par excision de base, Sancar a cartographié la réparation par excision de nucléotides — le mécanisme utilisé par les cellules pour réparer les dommages causés par les UV, dont les défauts provoquent le cancer de la peau sous l'effet du soleil — et Modrich a démontré la réparation des mésappariements, et que leurs travaux sous-tendent de nouveaux traitements contre le cancer; le prix de huit millions de couronnes est partagé à parts égales."
  ur: "کیمسٹری میں 2015 کے نوبل انعام کی باضابطہ پریس ریلیز ٹامس لنڈاہل، پال موڈرچ اور عزیز سنکار کو 'ڈی این اے کی مرمت کے میکانسٹک اسٹڈیز کے لیے': اس میں بتایا گیا ہے کہ ڈی این اے کو روزانہ یووی ریڈی ایشن، فری ریڈیکلز اور ریپلیکیشن کی غلطیوں سے نقصان پہنچتا ہے، کہ لنڈاہل نے میپڈ بیس ایکسائز کی مرمت، سنکار میپڈ میپڈ میکانزم سیلز کو نقصان پہنچانے کے لیے استعمال کیا۔ نقائص سورج کی روشنی میں جلد کے کینسر کا سبب بنتے ہیں - اور موڈرچ نے مماثلت کی مرمت کا مظاہرہ کیا، اور یہ کہ ان کا کام کینسر کے نئے علاج پر مشتمل ہے۔ 80 لاکھ کا کرونا انعام یکساں طور پر بانٹ دیا گیا۔"
  tr: "2015 Nobel Kimya Ödülü'nün resmi basın bülteni, Thomas Lindahl, Paul Modrić ve Aziz Sanjar'a \"DNA onarım mekanizmaları üzerine çalışmaları\" için: DNA'nın her gün ultraviyole ışınlar, serbest radikaller ve transkripsiyon hatalarıyla zarar gördüğünü, Lindahl'ın bazal eksizyon onarımı mekanizmasını tasarladığını, Sanjar'ın hücrelerin UV hasarını onardığı nükleotid onarımını tasarladığını—ve bu kusurun güneş ışığına maruz kaldığında cilt kanserine yol açtığını—Modrić'in uyumsuzlukların onarımını tasarladığını ve bu çalışmaların yeni kanser tedavilerinin temelini oluşturduğunu açıklıyor; ödül sekiz milyon kron olarak eşit bölünmüştür."
  id: "Siaran pers resmi Nobel Kimia 2015 untuk Thomas Lindahl, Paul Modrić, dan Aziz Sanjar \"untuk studi mekanisme perbaikan DNA\": menjelaskan bahwa DNA rusak setiap hari oleh sinar ultraviolet, radikal bebas, dan kesalahan transkripsi, bahwa Lindahl merancang mekanisme perbaikan eksisi basal, Sanjar merancang perbaikan nukleotida di mana sel memperbaiki kerusakan UV—dan cacatnya menyebabkan kanker kulit saat terkena sinar matahari—dan Modrić merancang perbaikan ketidakcocokan, dan bahwa pekerjaan mereka menjadi dasar pengobatan kanker baru; hadiahnya delapan juta krona dibagi sama rata."
