summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن راشد بن سعيد آل مكتوم؛ تُستخدم لوقائع الكيان فقط. تذكر أنه وُلد في دبي في 11 يونيو 1912، وتولى حكم دبي عند وفاة والده في 10 سبتمبر 1958، وكان أول نائب لرئيس دولة الإمارات (1971–1990) ورئيس وزرائها من 30 أبريل 1979 حتى وفاته في دبي في 7 أكتوبر 1990، وأنه قاد تحويل دبي إلى ميناء ومركز تجاري حديث (ميناء راشد، وحقل فتح النفطي 1966). ويقرأ حقل الدين في صندوق معلوماتها «الإسلام السني»؛ ولا يذكر متنها مدرسة له."
  en: "English Wikipedia article on Rashid bin Saeed Al Maktoum; used for entity facts only. It gives him as born at Dubai on 11 June 1912, ruler of Dubai from his father's death on 10 September 1958, first Vice President of the UAE (1971–1990) and its Prime Minister from 30 April 1979 until his death at Dubai on 7 October 1990, and as the driver of Dubai's transformation into a modern port and trading hub (Port Rashid; the Fateh oil field, 1966). Its infobox religion field reads 'Sunni Islam'; no text in it names a school for him."
