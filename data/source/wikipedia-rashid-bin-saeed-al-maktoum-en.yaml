summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن راشد بن سعيد آل مكتوم؛ تُستخدم لوقائع الكيان فقط. تذكر أنه وُلد في دبي في 11 يونيو 1912، وتولى حكم دبي عند وفاة والده في 10 سبتمبر 1958، وكان أول نائب لرئيس دولة الإمارات (1971–1990) ورئيس وزرائها من 30 أبريل 1979 حتى وفاته في دبي في 7 أكتوبر 1990، وأنه قاد تحويل دبي إلى ميناء ومركز تجاري حديث ⁦(ميناء راشد، وحقل فتح النفطي 1966)⁩. ويقرأ حقل الدين في صندوق معلوماتها «الإسلام السني»؛ ولا يذكر متنها مدرسة له."
  en: "English Wikipedia article on Rashid bin Saeed Al Maktoum; used for entity facts only. It gives him as born at Dubai on 11 June 1912, ruler of Dubai from his father's death on 10 September 1958, first Vice President of the UAE (1971–1990) and its Prime Minister from 30 April 1979 until his death at Dubai on 7 October 1990, and as the driver of Dubai's transformation into a modern port and trading hub (Port Rashid; the Fateh oil field, 1966). Its infobox religion field reads 'Sunni Islam'; no text in it names a school for him."
  es: "Artículo de la Wikipedia en inglés sobre Rashid bin Saeed Al Maktoum; utilizado únicamente para datos sobre la persona. Lo describe como nacido en Dubái el 11 de junio de 1912, gobernante de Dubái desde la muerte de su padre el 10 de septiembre de 1958, primer vicepresidente de los EAU (1971-1990) y su primer ministro desde el 30 de abril de 1979 hasta su muerte en Dubái el 7 de octubre de 1990, y como impulsor de la transformación de Dubái en un puerto moderno y un centro comercial (Puerto Rashid; el yacimiento petrolífero de Fateh, 1966). Su campo de religión en la ficha informativa dice \"Islam sunita\"; no hay ningún texto que mencione una escuela a la que pertenezca."
  fr: "Article Wikipédia en anglais sur Rashid bin Saeed Al Maktoum; utilisé uniquement pour les informations sur l'entité. Il indique qu'il est né à Dubaï le 11 juin 1912, qu'il a été souverain de Dubaï à partir du décès de son père le 10 septembre 1958, premier vice-président des Émirats arabes unis (1971-1990) et Premier ministre du 30 avril 1979 jusqu'à sa mort à Dubaï le 7 octobre 1990, et qu'il a été le principal artisan de la transformation de Dubaï en un port moderne et un centre commercial majeur (Port Rashid; champ pétrolier de Fateh, 1966). L'infobox « Religion » mentionne « Islam sunnite »; aucun texte ne fait mention d'une école qui lui serait associée."
  ur: "راشد بن سعید المکتوم پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اسے 11 جون 1912 کو دبئی میں پیدا ہوا، 10 ستمبر 1958 کو اپنے والد کی وفات سے لے کر دبئی کا حکمران، متحدہ عرب امارات کے پہلے نائب صدر (1971–1990) اور 30 اپریل 1979 سے دبئی میں 7 اکتوبر 1990 کو ان کی موت تک اس کا وزیر اعظم رہا، اور دبئی کو ایک جدید ڈرائیور کے طور پر تجارت کی شکل دی گئی۔ ⁦(پورٹ رشید؛ فتح آئل فیلڈ، 1966)⁩۔ اس کا infobox مذہب کا میدان پڑھتا ہے 'سنی اسلام'؛ اس میں کوئی متن اس کے لیے کسی اسکول کا نام نہیں ہے۔"
  tr: "Rashid bin Saeed Al Maktoum hakkında İngilizce Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılmıştır. 11 Haziran 1912'de Dubai'de doğduğu, babasının 10 Eylül 1958'deki ölümünden sonra Dubai'nin yönetimini üstlendiği ve 30 Nisan 1979'dan 7 Ekim 1990'da Dubai'de vefatına kadar BAE'nin ilk Başkan Yardımcısı (1971–1990) ve Başbakan olduğu belirtilmektedir. Ayrıca Dubai'nin modern bir liman ve ticaret merkezine dönüşümünü yönetti (1966'da Rashid Limanı ve Fath petrol sahası). Haql al-Din bilgi kutusunda 'Sünni İslam' yazmaktadır; kendisi için bir okuldan bahsetmemektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Rashid bin Saeed Al Maktoum hanya digunakan untuk fakta entitas tersebut. Perlu dicatat bahwa ia lahir di Dubai pada 11 Juni 1912, mengambil alih pemerintahan Dubai setelah kematian ayahnya pada 10 September 1958, dan menjadi Wakil Presiden pertama UEA (1971–1990) serta Perdana Menteri dari 30 April 1979 hingga wafatnya di Dubai pada 7 Oktober 1990. Ia juga memimpin transformasi Dubai menjadi pelabuhan modern dan pusat perdagangan (Pelabuhan Rashid dan ladang minyak Fath pada tahun 1966). Haql al-Din menuliskan 'Islam Sunni' di kotak informasinya; tidak disebutkan sekolah untuknya."
