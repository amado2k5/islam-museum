  ar: "مقالة ويكيبيديا العربية عن سلمان رشدي؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في بومباي سنة 1947 وأعماله الأدبية وقضية «الآيات الشيطانية» والفتوى بحقه ومحاولة اغتياله سنة 2022. بوابات المقالة تضم بوابة «إلحاد»، وهو تصنيف تحريري لا شهادة نصية."
  en: "Arabic Wikipedia article on Salman Rushdie; used for entity facts only. It covers his 1947 birth in Bombay, his literary works, the Satanic Verses affair and the fatwa against him, and the 2022 attempt on his life. The article's portal bar includes an 'atheism' portal — an editorial filing, not a textual attestation."
