summary:
  ar: "مقالة ويكيبيديا العربية عن سلمان رشدي؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في بومباي سنة 1947 وأعماله الأدبية وقضية «الآيات الشيطانية» والفتوى بحقه ومحاولة اغتياله سنة 2022. بوابات المقالة تضم بوابة «إلحاد»، وهو تصنيف تحريري لا شهادة نصية."
  en: "Arabic Wikipedia article on Salman Rushdie; used for entity facts only. It covers his 1947 birth in Bombay, his literary works, the Satanic Verses affair and the fatwa against him, and the 2022 attempt on his life. The article's portal bar includes an 'atheism' portal — an editorial filing, not a textual attestation."
  es: "Artículo de Wikipedia en árabe sobre Salman Rushdie; se utiliza únicamente para datos sobre la persona. Abarca su nacimiento en Bombay en 1947, su obra literaria, el escándalo de Los versos satánicos y la fatwa en su contra, así como el atentado contra su vida en 2022. La barra de navegación del artículo incluye un portal sobre «ateísmo», una anotación editorial, no una declaración textual."
  fr: "Article Wikipédia en arabe sur Salman Rushdie; utilisé uniquement à des fins d'information. Il aborde sa naissance à Bombay en 1947, son œuvre littéraire, l'affaire des Versets sataniques et la fatwa lancée contre lui, ainsi que la tentative d'assassinat dont il a été victime en 2022. La barre d'adresse de l'article contient un lien vers une section « athéisme » — un ajout éditorial, et non une attestation textuelle."
  ur: "سلمان رشدی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں بمبئی میں ان کی 1947 کی پیدائش، ان کے ادبی کام، شیطانی آیات کا معاملہ اور ان کے خلاف فتویٰ، اور ان کی زندگی پر 2022 کی کوششوں کا احاطہ کیا گیا ہے۔ مضمون کے پورٹل بار میں ایک 'الحاد' پورٹل شامل ہے — ایک ادارتی فائلنگ، متنی تصدیق نہیں۔"
  tr: "Salman Rushdie hakkında Arapça Vikipedi makalesi yalnızca varlığın gerçekleri için kullanılmıştır. 1947'de Bombay'daki doğumunu, edebi eserlerini, 'Şeytani Ayetler' davasını anlatır, kendisine yönelik fetvayı ve 2022'de kendisine yönelik suikast girişimini anlatır. Makale portalları arasında 'Ateizm' portalı bulunur; bu, metinsel bir sertifika değil, editoryal bir kategoridir."
  id: "Artikel Wikipedia berbahasa Arab tentang Salman Rushdie hanya digunakan untuk fakta-fakta entitas tersebut. Artikel ini menceritakan kelahirannya di Bombay pada tahun 1947, karya sastranya, kasus 'Satanic Verses,' fatwa terhadapnya, dan upaya pembunuhan terhadapnya pada tahun 2022. Portal artikel termasuk portal 'Atheism', yang merupakan kategori editorial daripada sertifikat teks."
