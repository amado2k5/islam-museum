reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Its header gives born 19 February 1864, Cairo, and died 5 December 1921, Rome, agreeing with the TDV İslâm Ansiklopedisi and Wikidata; its own assassination narrative, however, dates the shooting to the evening of 6 December, and the person record notes the variant. It gives his grand vizierate as 12 June 1913 – 3 February 1917, his release from Malta as 29 April 1921, his burial beside his father Halim Pasha in the garden of the Mahmud II tomb (ceremony in January 1922), and his protective patronage of Galatasaray Sports Club. Read in full on 24 October 2026."
