  ar: "مقالة ويكيبيديا الإنجليزية عن أماني عبيد كرومي؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في مدينة زنجبار سنة 1948 وعمله محاسبا وموظفا حكوميا، ورئاسته زنجبار من 2000 إلى 2010، وانتخابيه المتنازع عليهما، وحوارات المصالحة وتصويت الاستفتاء سنة 2010 وتسليمه السلمي للسلطة. يصفه متنها بأنه مسلم، دون مدرسة."
  en: "English Wikipedia article on Amani Abeid Karume; used for entity facts only. It recounts his birth in Zanzibar City in 1948, his work as an accountant and government officer, his presidency of Zanzibar from 2000 to 2010, his two contested elections, the reconciliation talks, the 2010 referendum and his peaceful handover of power. Its text calls him a Muslim and names no school."
