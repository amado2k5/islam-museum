summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أماني عبيد كرومي؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في مدينة زنجبار سنة 1948 وعمله محاسبا وموظفا حكوميا، ورئاسته زنجبار من 2000 إلى 2010، وانتخابيه المتنازع عليهما، وحوارات المصالحة وتصويت الاستفتاء سنة 2010 وتسليمه السلمي للسلطة. يصفه متنها بأنه مسلم، دون مدرسة."
  en: "English Wikipedia article on Amani Abeid Karume; used for entity facts only. It recounts his birth in Zanzibar City in 1948, his work as an accountant and government officer, his presidency of Zanzibar from 2000 to 2010, his two contested elections, the reconciliation talks, the 2010 referendum and his peaceful handover of power. Its text calls him a Muslim and names no school."
  es: "Artículo de la Wikipedia en inglés sobre Amani Abeid Karume; utilizado únicamente para datos biográficos. Relata su nacimiento en la ciudad de Zanzíbar en 1948, su trayectoria como contable y funcionario público, su presidencia de Zanzíbar entre 2000 y 2010, sus dos elecciones disputadas, las conversaciones de reconciliación, el referéndum de 2010 y su traspaso pacífico del poder. El texto lo describe como musulmán y no menciona ninguna escuela religiosa."
  fr: "Article de Wikipédia en anglais sur Amani Abeid Karume; utilisé uniquement à des fins d'information sur l'entité. Il relate sa naissance à Zanzibar City en 1948, son travail de comptable et de fonctionnaire, sa présidence de Zanzibar de 2000 à 2010, ses deux élections contestées, les pourparlers de réconciliation, le référendum de 2010 et sa passation de pouvoir pacifique. Le texte le présente comme musulman et ne mentionne aucune école."
  ur: "امانی عابد کرومی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1948 میں زنجبار شہر میں ان کی پیدائش، ایک اکاؤنٹنٹ اور سرکاری افسر کے طور پر ان کا کام، 2000 سے 2010 تک زنجبار کی ان کی صدارت، ان کے دو انتخابات میں حصہ لینے، مفاہمت کی بات چیت، 2010 کے ریفرنڈم اور اقتدار کی پرامن منتقلی کا ذکر ہے۔ اس کا متن اسے مسلمان کہتا ہے اور کسی اسکول کا نام نہیں دیتا۔"
