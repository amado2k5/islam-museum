  en: "Tadrib al-Rawi fi Sharh Taqrib al-Nawawi by al-Suyuti, with the gloss of Ibn al-Ajami — ed. Muhammad Awwama, vol. 5, Dar al-Minhaj, Jeddah 1437 AH / 2016"
summary:
  ar: "المجلد الخامس من «تدريب الراوي في شرح تقريب النواوي» لجلال الدين السيوطي (849–911هـ)، ومعه حاشية أحمد بن أحمد بن العجمي (1014–1086هـ)، حقق نصيهما وقومهما محمد عوامة، الطبعة الأولى، دار المنهاج للنشر والتوزيع بجدة ودار اليسر، 1437هـ/2016م. يضم الأنواع من الثلاثين (المشهور) إلى الخامس والستين (أوطان الرواة)، ويميز في الصفحة متن «التقريب» وشرح السيوطي «[ش]» وحاشية ابن العجمي وتعليقات المحقق."
  en: "Volume 5 of Tadrib al-Rawi fi Sharh Taqrib al-Nawawi by Jalal al-Din al-Suyuti (849–911 AH), with the gloss of Ahmad ibn Ahmad ibn al-Ajami (1014–1086 AH), both texts edited by Muhammad Awwama; first edition, Dar al-Minhaj, Jeddah, with Dar al-Yusr, 1437 AH / 2016. It covers types thirty (the well-known hadith) to sixty-five (the homelands of transmitters); each page separates al-Nawawi's base text, al-Suyuti's commentary (marked [ش]), Ibn al-Ajami's gloss and the editor's notes."
