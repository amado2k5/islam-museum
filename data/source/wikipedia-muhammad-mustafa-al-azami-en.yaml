  ar: "مقالة ويكيبيديا الإنجليزية عن المحدّث محمد مصطفى الأعظمي؛ لوقائع الكيان فقط: مولده في مئو بالهند في 1930، ودراسته في دار العلوم ديوبند (1952) والأزهر (1955) وكامبريدج ⁦(الدكتوراه 1966)⁩، ومناصبه في جامعة الملك سعود وغيرها، وجائزة الملك فيصل للدراسات الإسلامية (1980)، ومؤلفاته وتحقيقاته، ووفاته بالرياض في 20 ديسمبر 2017؛ وتستند إلى سي إن إن العربية وكتب أكاديمية."
  en: "English Wikipedia article on the hadith scholar Muhammad Mustafa al-Azami; entity facts only: birth at Mau, India, in 1930, study at Darul Uloom Deoband (1952), al-Azhar (1955) and Cambridge (PhD 1966), his posts at King Saud University and elsewhere, the King Faisal Prize for Islamic Studies (1980), his books and editions, and death in Riyadh on 20 December 2017; it cites CNN Arabic and academic works."
