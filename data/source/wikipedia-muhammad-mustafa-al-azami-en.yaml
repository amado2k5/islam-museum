summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن المحدّث محمد مصطفى الأعظمي؛ لوقائع الكيان فقط: مولده في مئو بالهند في 1930، ودراسته في دار العلوم ديوبند (1952) والأزهر (1955) وكامبريدج ⁦(الدكتوراه 1966)⁩، ومناصبه في جامعة الملك سعود وغيرها، وجائزة الملك فيصل للدراسات الإسلامية (1980)، ومؤلفاته وتحقيقاته، ووفاته بالرياض في 20 ديسمبر 2017؛ وتستند إلى سي إن إن العربية وكتب أكاديمية."
  en: "English Wikipedia article on the hadith scholar Muhammad Mustafa al-Azami; entity facts only: birth at Mau, India, in 1930, study at Darul Uloom Deoband (1952), al-Azhar (1955) and Cambridge (PhD 1966), his posts at King Saud University and elsewhere, the King Faisal Prize for Islamic Studies (1980), his books and editions, and death in Riyadh on 20 December 2017; it cites CNN Arabic and academic works."
  es: "Artículo de la Wikipedia en inglés sobre el erudito en hadices Muhammad Mustafa al-Azami; solo datos biográficos: nacimiento en Mau, India, en 1930, estudios en Darul Uloom Deoband (1952), al-Azhar (1955) y Cambridge (doctorado en 1966), sus cargos en la Universidad Rey Saud y otros lugares, el Premio Rey Faisal de Estudios Islámicos (1980), sus libros y ediciones, y su fallecimiento en Riad el 20 de diciembre de 2017; cita CNN Arabic y trabajos académicos."
  fr: "Article de Wikipédia en anglais sur le spécialiste du hadith Muhammad Mustafa al-Azami; faits concernant uniquement l’entité: naissance à Mau, en Inde, en 1930, études à Darul Uloom Deoband (1952), à al-Azhar (1955) et à Cambridge (doctorat en 1966), ses postes à l’université du roi Saoud et ailleurs, le prix du roi Faisal pour les études islamiques (1980), ses livres et éditions, et décès à Riyad le 20 décembre 2017; il cite CNN Arabic et des travaux universitaires."
  ur: "عالم حدیث محمد مصطفی الاعظمی پر انگریزی ویکیپیڈیا مضمون؛ ہستی کے حقائق صرف: 1930 میں ماؤ، انڈیا میں پیدائش، دارالعلوم دیوبند (1952)، الازہر (1955) اور کیمبرج ⁦(پی ایچ ڈی 1966)⁩ میں مطالعہ، کنگ سعود یونیورسٹی اور دیگر جگہوں پر ان کی پوسٹس، کنگ فیصل پرائز فار اسلامک اسٹڈیز (1980)، دسمبر 2020 میں ان کی کتابوں اور ایڈیشنوں میں وفات۔ یہ CNN عربی اور علمی کاموں کا حوالہ دیتا ہے۔"
  tr: "Hadis âlimi Muhammed Mustafa Al-A'zami hakkında İngilizce Wikipedia makalesi; sadece varlığın olayları için: 1930'da Hindistan'ın Mau kentinde doğması, Darul Uloom Deoband'daki (1952), Al-Azhar'daki (1955), Cambridge (PhD 1966) çalışmaları, King Saud Üniversitesi ve diğerlerindeki görevleri, Kral Faysal İslami Araştırmalar Ödülü (1980), yazıları ve doğrulamaları ile 20 Aralık 2017'de Riyad'da vefatı; CNN Arapçası ve akademik kitaplara dayanmaktadır."
  id: "Artikel Wikipedia bahasa Inggris tentang ulama hadis Muhammad Mustafa Al-A'zami; hanya untuk peristiwa entitas tersebut: kelahirannya di Mau, India, pada tahun 1930, studinya di Darul Uloom Deoband (1952), Al-Azhar (1955), Cambridge (PhD 1966), posisinya di Universitas King Saud dan lainnya, Penghargaan King Faisal untuk Studi Islam (1980), tulisan dan verifikasinya, serta kematiannya di Riyadh pada 20 Desember 2017; artikel ini didasarkan pada buku CNN dalam bahasa Arab dan akademik."
