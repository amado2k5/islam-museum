summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حمزة يوسف (مواليد 1985)؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في غلاسكو في 7 أبريل 1985 لأبوين مهاجرين، ودراسته للسياسة في جامعة غلاسكو، وعمله مساعدا برلمانيا، وانتخابه عضوا في البرلمان الإسكتلندي سنة 2011، ومناصبه وزيرا للعدل (2018-2021) ثم للصحة (2021-2023)، وفوزه بزعامة الحزب الوطني الإسكتلندي وتوليه منصب الوزير الأول لإسكتلندا (مارس 2023 - مايو 2024) أولَ مسلم وأصغر شخص يشغل المنصب، واستقالته في أبريل 2024."
  en: "English Wikipedia article on Humza Yousaf (born 1985); used for entity facts only. It records his birth in Glasgow on 7 April 1985 to immigrant parents, his politics degree at the University of Glasgow, his work as a parliamentary assistant, his election to the Scottish Parliament in 2011, his offices as justice secretary (2018–2021) and health secretary (2021–2023), his win in the 2023 SNP leadership election and his term as First Minister of Scotland (March 2023 – May 2024) as the first Muslim and youngest person in the office, and his resignation in April 2024."
