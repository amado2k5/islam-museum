summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حمزة يوسف ⁦(مواليد 1985)⁩؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في غلاسكو في 7 أبريل 1985 لأبوين مهاجرين، ودراسته للسياسة في جامعة غلاسكو، وعمله مساعدا برلمانيا، وانتخابه عضوا في البرلمان الإسكتلندي سنة 2011، ومناصبه وزيرا للعدل (2018-2021) ثم للصحة (2021-2023)، وفوزه بزعامة الحزب الوطني الإسكتلندي وتوليه منصب الوزير الأول لإسكتلندا ⁦(مارس 2023 - مايو 2024)⁩ أولَ مسلم وأصغر شخص يشغل المنصب، واستقالته في أبريل 2024."
  en: "English Wikipedia article on Humza Yousaf (born 1985); used for entity facts only. It records his birth in Glasgow on 7 April 1985 to immigrant parents, his politics degree at the University of Glasgow, his work as a parliamentary assistant, his election to the Scottish Parliament in 2011, his offices as justice secretary (2018–2021) and health secretary (2021–2023), his win in the 2023 SNP leadership election and his term as First Minister of Scotland (March 2023 – May 2024) as the first Muslim and youngest person in the office, and his resignation in April 2024."
  es: "Artículo de la Wikipedia en inglés sobre Humza Yousaf (nacido en 1985); utilizado únicamente para datos sobre la persona. En él se registra su nacimiento en Glasgow el 7 de abril de 1985, hijo de padres inmigrantes, su licenciatura en ciencias políticas por la Universidad de Glasgow, su trabajo como asistente parlamentario, su elección al Parlamento escocés en 2011, sus cargos como secretario de justicia (2018-2021) y secretario de salud (2021-2023), su victoria en las elecciones para el liderazgo del SNP en 2023 y su mandato como Primer Ministro de Escocia (marzo de 2023 - mayo de 2024) como el primer musulmán y la persona más joven en ocupar el cargo, y su dimisión en abril de 2024."
  fr: "Article de Wikipédia en anglais sur Humza Yousaf (né en 1985); utilisé uniquement pour les informations le concernant. Il relate sa naissance à Glasgow le 7 avril 1985 de parents immigrés, son diplôme de sciences politiques à l’Université de Glasgow, son travail d’assistant parlementaire, son élection au Parlement écossais en 2011, ses fonctions de ministre de la Justice (2018-2021) et de ministre de la Santé (2021-2023), sa victoire à l’élection à la tête du SNP en 2023 et son mandat de Premier ministre d’Écosse (mars 2023 – mai 2024), en tant que premier musulman et plus jeune personne à occuper ce poste, et sa démission en avril 2024."
  ur: "ہمزہ یوسف ⁦(پیدائش 1985)⁩ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں تارکین وطن کے والدین کے لیے 7 اپریل 1985 کو گلاسگو میں ان کی پیدائش، گلاسگو یونیورسٹی میں ان کی سیاست کی ڈگری، پارلیمانی اسسٹنٹ کے طور پر ان کا کام، 2011 میں سکاٹش پارلیمنٹ کے لیے ان کا انتخاب، جسٹس سیکریٹری (2018–2021) اور سیکریٹری صحت (2021–2023) کے طور پر ان کے دفاتر، S3P20 میں ان کی قیادت کی جیت اور بطور وزیر اعظم منتخب ہونے کا ریکارڈ درج ہے۔ ⁦(مارچ 2023 - مئی 2024)⁩ دفتر میں پہلے مسلمان اور سب سے کم عمر شخص کے طور پر، اور اپریل 2024 میں ان کا استعفیٰ۔"
  tr: "Hamza Youssef hakkında İngilizce Wikipedia makalesi (d. 1985); yalnızca varlık bilgileri için kullanılır. 7 Nisan 1985'te Glasgow'da göçmen ebeveynlerin çocuğu olarak doğdu, Glasgow Üniversitesi'nde siyaset eğitimi aldı, parlamento asistanı olarak çalıştı, 2011'de İskoçya Parlamentosu üyesi seçildi, Adalet Bakanı (2018-2021) ve ardından Sağlık Bakanı (2021-2023) olarak görev yaptı, İskoçya Ulusal Partisi liderliğini kazandı ve İskoçya Başbakanı oldu (Mart 2023 - Mayıs 2024), bu görevi üstlenen ilk Müslüman ve en genç kişi oldu ve Nisan 2024'te istifa etti."
  id: "Artikel Wikipedia bahasa Inggris tentang Hamza Youssef (lahir 1985); hanya digunakan untuk fakta entitas. Ia lahir di Glasgow pada 7 April 1985 dari orang tua imigran, belajar politik di Universitas Glasgow, bekerja sebagai asisten parlemen, terpilih sebagai anggota Parlemen Skotlandia pada 2011, menjabat sebagai Menteri Kehakiman (2018-2021) dan kemudian Menteri Kesehatan (2021-2023), memenangkan kepemimpinan Partai Nasional Skotlandia, dan menjadi Menteri Pertama Skotlandia (Maret 2023 - Mei 2024), menjadi Muslim pertama dan orang termuda yang memegang posisi tersebut, dan mengundurkan diri pada April 2024."
