summary:
  ar: مجموعة سير أعلام النبلاء للذهبي ⁦(ت 748هـ)⁩ في نسخة مصورة واحدة من المستودع المحلي، تقع في نحو 4683 صفحة، والأرقام المطبوعة على الصفحات تطابق أرقام صفحات الملف؛ تُشير الإحالات إلى هذه الصفحات. ترجمة مالك بن أنس ⁦(رقم 4664)⁩ في الصفحات 3145–3152.
  en: The full Siyar a'lam al-nubala' of al-Dhahabi (d. 748 AH) in one local scan of about 4683 pages; printed page numbers match the scan's page numbers and citations use them. Malik ibn Anas's entry (no. 4664) is at pages 3145–3152.
  es: "El Siyar a'lam al-nubala' completo de al-Dhahabi (fallecido en 748 AH) consta de una copia digitalizada de aproximadamente 4683 páginas; la numeración de las páginas impresas coincide con la digitalizada y las citas las utilizan. La entrada de Malik ibn Anas (n.º 4664) se encuentra en las páginas 3145-3152."
  fr: "Le Siyar a'lam al-nubala' complet d'al-Dhahabi (mort en 748 AH) est disponible en une seule numérisation locale d'environ 4683 pages; la pagination imprimée correspond à celle de la numérisation et les citations l'utilisent. L'entrée de Malik ibn Anas (n° 4664) se trouve aux pages 3145–3152."
  ur: "تقریباً 4683 صفحات پر مشتمل ایک مقامی اسکین میں الذہبی ⁦(متوفی 748ھ)⁩ کا مکمل سیار اعلام النبلاء؛ پرنٹ شدہ صفحہ نمبر اسکین کے صفحہ نمبروں سے میل کھاتے ہیں اور حوالہ جات انہیں استعمال کرتے ہیں۔ مالک بن انس کا اندراج ⁦(نمبر 4664)⁩ صفحہ 3145-3152 پر ہے۔"
  tr: "Siyar A'lam al-Nubala' koleksiyonu, yerel arşivden tek bir resimli kopya olarak yerel arşivden alınmıştır ve sayfalardaki basılı numaralar dosya sayfa numaralarıyla eşleşmektedir; kaynaklar bu sayfalara atıfta bulunmaktadır. Malik ibn Anas (no. 4664) çevirisi, sayfalar 3145–3152."
  id: "Koleksi Siyar A'lam al-Nubala' oleh al-Dhahabi (wafat 748 H) dalam satu salinan bergambar dari repositori lokal, terdiri dari sekitar 4683 halaman, dengan nomor cetak pada halaman yang sesuai dengan nomor halaman file; referensi merujuk pada halaman-halaman tersebut. Terjemahan Malik ibn Anas (no. 4664) pada halaman 3145–3152."
