summary:
  ar: "عنصر ويكيداتا Q398 للبحرين، كما ورد في ملخص بحثي زُوّد به المتحف ولم يفتح المتحف الصفحة: الاسم الرسمي مملكة البحرين، وإحداثيات الموقع 26°4′3″ شمالاً و50°33′4″ شرقاً، ومركزها الجغرافي 26°2′22.9″ شمالاً و50°33′33.5″ شرقاً، وهي دولة ذات سيادة وجزيرة وأرخبيل وملكية دستورية، عضو في الأمم المتحدة منذ 21 سبتمبر 1971، ولغتها الرسمية العربية، واللغات المستعملة العربية الفصحى والبحرانية والإنجليزية والملايوية."
  en: "Wikidata item Q398 for Bahrain, as given in a research summary supplied to the museum; the museum did not open the page: the official name Kingdom of Bahrain, the coordinate location 26 4 3 N 50 33 4 E, the geographic centre 26 2 22.9 N 50 33 33.5 E, a sovereign state, island country, archipelago and constitutional monarchy, a United Nations member since 21 September 1971, Arabic as the official language, and the languages used Modern Standard Arabic, Bahrani Arabic, English and Malay."
  ur: "بحرین کا وکی ڈیٹا آئٹم Q398، جیسا ایک تحقیقی خلاصے میں ملا جو متحف کو دیا گیا؛ متحف نے صفحہ نہیں کھولا: سرکاری نام مملکت بحرین، مقام کے نقاط 26°4′3″ شمال اور 50°33′4″ مشرق، جغرافیائی مرکز 26°2′22.9″ شمال اور 50°33′33.5″ مشرق، خودمختار ریاست، جزیرہ ملک، جزائر کا مجموعہ اور آئینی بادشاہت، 21 ستمبر 1971 سے اقوام متحدہ کی رکن، سرکاری زبان عربی، اور استعمال ہونے والی زبانیں فصیح عربی، بحرانی عربی، انگریزی اور ملے۔"
  fr: "Élément Wikidata Q398 pour Bahreïn, tel que donné dans un résumé de recherche fourni au musée ; le musée n'a pas ouvert la page : le nom officiel Royaume de Bahreïn, la localisation 26°4′3″ N 50°33′4″ E, le centre géographique 26°2′22,9″ N 50°33′33,5″ E, un État souverain, pays insulaire, archipel et monarchie constitutionnelle, membre de l'ONU depuis le 21 septembre 1971, l'arabe comme langue officielle, et pour langues utilisées l'arabe standard moderne, l'arabe bahreïni, l'anglais et le malais."
  es: "Entrada de Wikidata Q398 para Baréin, tal como figura en un resumen de investigación entregado al museo; el museo no abrió la página: el nombre oficial Reino de Baréin, la ubicación 26°4′3″ N 50°33′4″ E, el centro geográfico 26°2′22,9″ N 50°33′33,5″ E, un Estado soberano, país insular, archipiélago y monarquía constitucional, miembro de la ONU desde el 21 de septiembre de 1971, el árabe como lengua oficial, y como lenguas usadas el árabe estándar moderno, el árabe bahreiní, el inglés y el malayo."
