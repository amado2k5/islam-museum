summary:
  ar: "قائمة فيدسبوت لمؤثرات الموضة المحتشمة على إنستغرام؛ تعيد إنتاج نص سيرة منال تشينوتاي على إنستغرام حرفيًا: «الرئيس التنفيذي ومؤسِّسة @rumluh.uk» و«@chinutayhome» و«شريكة مؤسِّسة @maisfragrances» وأم لطفلين تحب الجمال والموضة ومقيمة في بريطانيا."
  en: "Feedspot's list of modest fashion Instagram influencers; it reproduces Manal Chinutay's own Instagram profile text verbatim: 'CEO and Founder @rumluh.uk', '@chinutayhome', 'Co Founder @maisfragrances', a UK-based mother of two who loves beauty and fashion."
  es: "Lista de Feedspot de influencers de moda modesta en Instagram; reproduce textualmente el texto del perfil de Instagram de Manal Chinutay: 'CEO y fundadora de @rumluh.uk', '@chinutayhome', 'Cofundadora de @maisfragrances', una madre de dos hijos residente en el Reino Unido a la que le encanta la belleza y la moda."
  fr: "La liste de Feedspot recensant les influenceuses Instagram de mode pudique reproduit textuellement le profil Instagram de Manal Chinutay: « PDG et fondatrice de @rumluh.uk », « @chinutayhome », « Co-fondatrice de @maisfragrances », une mère de deux enfants basée au Royaume-Uni, passionnée de beauté et de mode."
  ur: "Feedspot کی معمولی فیشن انسٹاگرام پر اثر انداز کرنے والوں کی فہرست؛ یہ منال چنوتائے کے اپنے انسٹاگرام پروفائل ٹیکسٹ کو لفظی طور پر دوبارہ پیش کرتا ہے: 'CEO اور بانی @rumluh.uk'، '@chinutayhome'، 'Co Founder@maisfragrances'، جو کہ برطانیہ میں مقیم دو بچوں کی ماں ہے جو خوبصورتی اور فیشن سے محبت کرتی ہے۔"
  tr: "Feedspot'un Instagram'daki mütevazı moda fenomenleri listesi, Manal Chinottai'nin Instagram biyografisini kelimenin tam anlamıyla yeniden üretiyor: \"CEO ve @rumluh.uk kurucu,\" \"@chinutayhome,\" \"@maisfragrances vakfının ortağı\" ve güzellik ile modayı seven ve Birleşik Krallık'ta yaşayan iki çocuk annesi."
  id: "Daftar influencer fashion sederhana di Instagram Feedspot secara harfiah mereproduksi biografi Instagram Manal Chinottai: \"CEO dan pendiri @rumluh.uk,\" \"@chinutayhome,\" \"partner @maisfragrances foundation,\" dan ibu dari dua anak yang menyukai kecantikan dan mode serta tinggal di Inggris."
