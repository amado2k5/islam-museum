summary:
  ar: "مدخل «وقعة نويس» في موسوعة TDV الإسلامية لبكير كوتوك أوغلو: لقب المؤرخين الرسميين في الدولة العثمانية، وتأسيس المنصب في أوائل القرن الثامن عشر على يد أم جازادة حسين باشا وتعيين نعيمة، وشروط التعيين والرواتب وكيفية جمع الأخبار، وسجل الوقعة نويسين حتى إلغاء المنصب."
  en: "The TDV İslâm Ansiklopedisi entry on the vak'anüvis by Bekir Kütükoğlu: the title borne by the Ottoman state's official historians, the office's foundation under Amcazade Hüseyin Pasha with Naima's appointment, the qualities sought in appointees, salaries, how reports reached the historian, and the line of office-holders until the post lapsed."
  ur: "TDV اسلام دائرۃ المعارف کا مضمون «وقعہ نویس» بکر کوتوک اوغلو کی تحریر: سلطنت عثمانیہ کے سرکاری مؤرخین کا لقب، امجازادہ حسین پاشا کے دور میں منصب کا قیام اور نعیمہ کی تقرری، شرائط تقرر اور تنخواہیں، واقعات کی رپورٹنگ کا نظام اور منصب کے خاتمے تک کا سلسلہ۔"
  es: "La entrada de Bekir Kütükoğlu en la TDV İslâm Ansiklopedisi sobre el vak'anüvis: el título que ostentaban los historiadores oficiales del estado otomano, la fundación del cargo bajo el mandato de Amcazade Hüseyin Pasha con el nombramiento de Naima, las cualidades que se buscaban en los designados, los salarios, cómo llegaban los informes al historiador y la sucesión de titulares del cargo hasta que este caducó."
  fr: "L'article de TDV İslâm Ansiklopedisi sur les vak'anüvis par Bekir Kütükoğlu: le titre porté par les historiens officiels de l'État ottoman, la fondation de la fonction sous Amcazade Hüseyin Pacha avec la nomination de Naima, les qualités recherchées chez les candidats, les salaires, la manière dont les rapports parvenaient à l'historien et la lignée des titulaires de la fonction jusqu'à la disparition du poste."
