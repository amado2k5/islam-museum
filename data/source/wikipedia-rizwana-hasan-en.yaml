  ar: "مقالة ويكيبيديا الإنجليزية عن سيدة رضوانة حسن؛ تُستخدم لوقائع الكيان فقط. يعطي صندوق معلوماتها مولدها في 15 يناير 1968 بهبيغانج، ويذكر نصها أنها وُلدت «في أسرة زميندار بنغالية مسلمة»، ويروي عملها القانوني البيئي على رأس رابطة بيلا، وجوائزها، وعملها مستشارة في الحكومة المؤقتة 2024–2026. لا يسمّي المقال دينا ولا مذهبا لها شخصيا."
  en: "English Wikipedia article on Syeda Rizwana Hasan; used for entity facts only. Its infobox gives her birth as 15 January 1968 at Habiganj; its text states that she was born 'into a Bengali Muslim Zamindar family', and covers her environmental law work at the head of BELA, her awards, and her service as an adviser in the 2024 interim government until February 2026. The article names no religion or school for her personally."
