summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سيدة رضوانة حسن؛ تُستخدم لوقائع الكيان فقط. يعطي صندوق معلوماتها مولدها في 15 يناير 1968 بهبيغانج، ويذكر نصها أنها وُلدت «في أسرة زميندار بنغالية مسلمة»، ويروي عملها القانوني البيئي على رأس رابطة بيلا، وجوائزها، وعملها مستشارة في الحكومة المؤقتة 2024–2026. لا يسمّي المقال دينا ولا مذهبا لها شخصيا."
  en: "English Wikipedia article on Syeda Rizwana Hasan; used for entity facts only. Its infobox gives her birth as 15 January 1968 at Habiganj; its text states that she was born 'into a Bengali Muslim Zamindar family', and covers her environmental law work at the head of BELA, her awards, and her service as an adviser in the 2024 interim government until February 2026. The article names no religion or school for her personally."
  es: "Artículo de la Wikipedia en inglés sobre Syeda Rizwana Hasan; utilizado únicamente para obtener información sobre la persona. Su ficha informativa indica que nació el 15 de enero de 1968 en Habiganj; el texto afirma que nació en el seno de una familia bengalí musulmana zamindar y abarca su labor en derecho ambiental al frente de BELA, sus premios y su servicio como asesora en el gobierno interino de 2024 hasta febrero de 2026. El artículo no menciona su religión ni su escuela."
  fr: "L'article Wikipédia en anglais consacré à Syeda Rizwana Hasan est utilisé uniquement à des fins d'information sur l'entité. Son infobox indique qu'elle est née le 15 janvier 1968 à Habiganj; son texte précise qu'elle est née dans une famille de zamindars musulmans bengalis et aborde son travail en droit environnemental à la tête de BELA, ses distinctions et son rôle de conseillère auprès du gouvernement intérimaire de 2024 jusqu'en février 2026. L'article ne mentionne ni sa religion ni son école."
  ur: "سیدہ رضوانہ حسن پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا انفو باکس اس کی پیدائش 15 جنوری 1968 کو حبیب گنج میں ہوا۔ اس کے متن میں کہا گیا ہے کہ وہ 'ایک بنگالی مسلم زمیندار گھرانے میں پیدا ہوئی تھیں'، اور بیلا کے سربراہ میں اس کے ماحولیاتی قانون کے کام، اس کے ایوارڈز، اور 2024 کی عبوری حکومت میں فروری 2026 تک بطور مشیر ان کی خدمات کا احاطہ کرتی ہے۔ مضمون میں ذاتی طور پر اس کے لیے کسی مذہب یا اسکول کا نام نہیں لیا گیا ہے۔"
  tr: "Lady Ridwana Hassan hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Bilgi kutusu, doğum tarihini 15 Ocak 1968'de Bhabigang'da veriyor, \"Müslüman Bengal Zamindar ailesinde doğduğunu\" belirtiyor ve Bela Derneği'nin başında çevre hukuku çalışmalarını, ödüllerini ve 2024–2026 döneminde geçici hükümette danışmanlık çalışmalarını anlatıyor. Makale, dini veya inancı kişisel olarak adlandırılmıyor."
  id: "Artikel Wikipedia bahasa Inggris tentang Lady Ridwana Hassan; digunakan hanya untuk fakta entitas. Kotak info-nya mencantumkan tanggal lahirnya pada 15 Januari 1968 di Bhabigang, menyatakan bahwa dia lahir \"dalam keluarga Muslim Bengali Zamindar,\" dan menceritakan pekerjaan hukum lingkungannya sebagai kepala Asosiasi Bela, penghargaan yang diterimanya, serta pekerjaannya sebagai penasihat di pemerintahan sementara 2024–2026. Artikel tersebut tidak menyebutkan agama atau kepercayaannya secara pribadi."
