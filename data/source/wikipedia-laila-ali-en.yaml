summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ليلى علي؛ تُستخدم لوقائع الكيان فقط. تعطي ميلادها في 30 ديسمبر 1977 في ميامي بيتش ابنةً لمحمد علي وفيرونيكا بورشيه، وسجلها غير المهزوم 24 فوزاً منها 21 بالضربة القاضية، وألقابها العالمية، ومسيرتها التلفزيونية. وتذكر في متنها أنها تربّت مسلمة ثم تركت الإسلام، وتنقل قولها عن أبيها: «كان أبي مسلماً، أما أنا فلا»."
  en: "English Wikipedia article on Laila Ali; used for entity facts only. It gives her birth on 30 December 1977 in Miami Beach, the daughter of Muhammad Ali and Veronica Porché, her undefeated record of 24 wins with 21 knockouts, her world titles, and her television career. Its text states that she was raised as a Muslim but later left Islam, and quotes her on her father: 'My father was Muslim, I'm not.'"
