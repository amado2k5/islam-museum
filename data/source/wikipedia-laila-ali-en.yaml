reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision, fetched by revision id and the returned revision asserted equal. The infobox gives her full name Laila Amaria Ali, her birth on 30 December 1977 in Miami Beach, and her nicknames She Bee Stingin', Madame Butterfly and Pretty Baby. The text records her upbringing, her business degree from Santa Monica College and her nail salon, her 1999 debut, her IBA, WIBA, IWBF and WBC titles, her 2003 win over Christy Martin, her final fight on 2 February 2007, and her later television work including Dancing with the Stars and American Gladiators. On religion, the text states she was raised as a Muslim but later left Islam, citing WBUR (16 June 2017) and Nine.com.au (28 June 2019), and quotes her own words in the Nine interview; the article files her in the categories African-American former Sunni Muslims and American former Sunni Muslims — filings, not attestation."
