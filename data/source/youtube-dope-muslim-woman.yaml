  ar: "قناة «بودكاست المرأة المسلمة المتميزة» (The Dope Muslim Woman Podcast) على يوتيوب (@thedopemuslimwomanpodcast)؛ مصدر أولي لحلقات سابريا ميلز المصورة وبثوثها في الزواج والطلاق والإيمان والأنوثة والسلطة والصدمات والسلطة الدينية، وتصف القناة نفسها بأنها حيث يلتقي الإيمان بالثقافة وتتحدى الحوارات المسلَّمات."
  en: "The Dope Muslim Woman Podcast YouTube channel (@thedopemuslimwomanpodcast); a primary source for Sabria Mills's video episodes and live streams on marriage, divorce, faith, femininity, power, trauma and religious authority, describing itself as where faith meets culture and conversations challenge perspectives."
  es: "El canal de YouTube Dope Muslim Woman Podcast (@thedopemuslimwomanpodcast); una fuente principal para los episodios de vídeo y las transmisiones en directo de Sabria Mills sobre matrimonio, divorcio, fe, feminidad, poder, trauma y autoridad religiosa, que se describe a sí mismo como un lugar donde la fe se encuentra con la cultura y las conversaciones desafían las perspectivas."
  fr: "La chaîne YouTube The Dope Muslim Woman Podcast (@thedopemuslimwomanpodcast) est une source importante pour les épisodes vidéo et les diffusions en direct de Sabria Mills sur le mariage, le divorce, la foi, la féminité, le pouvoir, les traumatismes et l'autorité religieuse. Elle se décrit comme un lieu où la foi rencontre la culture et où les conversations remettent en question les perspectives."
