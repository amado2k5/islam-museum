summary:
  ar: "مدخل «دلّال» في موسوعة TDV الإسلامية: الدلّال من يتوسّط بين البائع والمشتري أو ينادي بالأخبار في الأسواق؛ الدلّالون في فاطميين ومماليك والعثمانيين، أجرهم وتنظيمهم في اللجان وألوانهم بما فيها دلّالة النساء ودلّالو الجواري."
  en: "The TDV İslâm Ansiklopedisi entry on the dellal: the intermediary between buyer and seller and the crier who proclaims news in the markets; dellals under the Fatimids, Mamluks and Ottomans, their fees, guild organisation and specialities including women dellals and slave-brokers."
  es: "La entrada de la TDV İslâm Ansiklopedisi sobre el dellal: el intermediario entre comprador y vendedor y el pregonero que anuncia las noticias en los mercados; los dellales bajo los fatimíes, mamelucos y otomanos, sus honorarios, organización gremial y especialidades, incluidas las mujeres dellales y los intermediarios de esclavos."
  fr: "L'entrée TDV İslâm Ansiklopedisi sur le dellal: l'intermédiaire entre l'acheteur et le vendeur et le crieur qui proclame les nouvelles sur les marchés; les dellals sous les Fatimides, les Mamelouks et les Ottomans, leurs honoraires, leur organisation corporative et leurs spécialités, y compris les femmes dellals et les courtiers en esclaves."
  ur: "ڈیلال پر TDV İslâm Ansiklopedisi اندراج: خریدار اور بیچنے والے کے درمیان ثالث اور منڈیوں میں خبروں کا اعلان کرنے والا؛ فاطمیوں، مملوکوں اور عثمانیوں کے تحت ڈیل، ان کی فیس، گلڈ تنظیم اور خواتین ڈیل اور غلام دلالوں سمیت خصوصیات۔"
