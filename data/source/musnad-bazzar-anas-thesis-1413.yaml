summary:
  ar: "رسالة مقدمة لنيل درجة الماجستير في قسم الدراسات العليا، فرع الكتاب والسنة، بكلية الدعوة وأصول الدين، سنة 1413هـ/1992م، في تحقيق قسم من مسند أنس بن مالك من «مسند البزار» عن نسخة المكتبة الأزهرية، مع دراسة عن البزار ومسنده في ستة فصول ⁦(ترجمته، وخصائص المسند، ومصادره، ومنهجه، ومنهجه في العلل والجرح والتعديل، وتحقيق اسم الكتاب ونسبته ووصف النسخة)⁩. يبلغ عدد أحاديث القسم المحقق 266 حديثاً."
  en: "A thesis for the MA in the Department of Graduate Studies (Book and Sunna branch), Faculty of Da'wa and Usul al-Din, 1413/1992, editing a section of the Musnad of Anas ibn Malik from Musnad al-Bazzar from the Azhar Library manuscript, with a study of al-Bazzar and his Musnad in six chapters (his life, the Musnad's features, its sources, its method, his method in hidden defects and narrator criticism, and the book's title, attribution and manuscript). The edited section has 266 hadiths."
