  en: "Musnad al-Bazzar: a section of the Musnad of Anas ibn Malik, study, edition and takhrij (MA thesis, Faculty of Da'wa and Usul al-Din, 1413/1992)"
  ur: "مسند البزار: مسند انس بن مالک کا ایک حصہ، دراسہ و تحقیق و تخریج ⁦(ایم اے مقالہ، کلیۃ الدعوۃ واصول الدین، 1413ھ/1992ء)⁩"
summary:
  ar: "رسالة مقدمة لنيل درجة الماجستير في قسم الدراسات العليا، فرع الكتاب والسنة، بكلية الدعوة وأصول الدين، سنة 1413هـ/1992م، في تحقيق قسم من مسند أنس بن مالك من «مسند البزار» عن نسخة المكتبة الأزهرية، مع دراسة عن البزار ومسنده في ستة فصول ⁦(ترجمته، وخصائص المسند، ومصادره، ومنهجه، ومنهجه في العلل والجرح والتعديل، وتحقيق اسم الكتاب ونسبته ووصف النسخة)⁩. يبلغ عدد أحاديث القسم المحقق 266 حديثاً."
  en: "A thesis for the MA in the Department of Graduate Studies (Book and Sunna branch), Faculty of Da'wa and Usul al-Din, 1413/1992, editing a section of the Musnad of Anas ibn Malik from Musnad al-Bazzar from the Azhar Library manuscript, with a study of al-Bazzar and his Musnad in six chapters (his life, the Musnad's features, its sources, its method, his method in hidden defects and narrator criticism, and the book's title, attribution and manuscript). The edited section has 266 hadiths."
  es: "Tesis de maestría en el Departamento de Estudios de Posgrado (rama de Libros y Sunna), Facultad de Da'wa y Usul al-Din, 1413/1992, que consiste en la edición de una sección del Musnad de Anas ibn Malik del Musnad al-Bazzar del manuscrito de la Biblioteca de Azhar, con un estudio de al-Bazzar y su Musnad en seis capítulos (su vida, las características del Musnad, sus fuentes, su método, su método para detectar defectos ocultos y la crítica de narradores, y el título, la atribución y el manuscrito del libro). La sección editada contiene 266 hadices."
  fr: "Mémoire de maîtrise (1413/1992) du Département des études supérieures (section Livre et Sunna) de la Faculté de Da'wa et Usul al-Din, portant sur l'édition d'une section du Musnad d'Anas ibn Malik, extraite du manuscrit de la Bibliothèque Al-Azhar. Ce mémoire comprend une étude d'al-Bazzar et de son Musnad, structurée en six chapitres (sa vie, les caractéristiques du Musnad, ses sources, sa méthode, sa méthode d'analyse des défauts cachés et du narrateur, ainsi que le titre, l'attribution et le manuscrit de l'ouvrage). La section éditée contient 266 hadiths."
