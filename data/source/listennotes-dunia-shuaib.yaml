summary:
  ar: "صفحة لسن نوتس لبث محاضرات دنيا شعيب على مسلم سنترال ⁦(٦٠ حلقة منذ ٢٠ مارس ٢٠٢٠)⁩، وتنشر النص التعريفي بها: أنها مؤسسة معهد القلوب المهداة ومديرته التنفيذية، ومعلمة ومحاضرة دولية ومؤلفة تعمل في دمج التعليم الإسلامي بعلم النفس الحديث والتعليم النفسي الروحي."
  en: "The Listen Notes page for Dunia Shuaib's Muslim Central lecture feed (60 episodes since 20 March 2020), publishing the biography carried with the feed: that she is the founder and executive director of the Guided Hearts Institute, an educator, international lecturer and author whose work integrates Islamic teaching with modern psychology and psycho-spiritual education."
  es: "La página Listen Notes del canal de conferencias Muslim Central de Dunia Shuaib (60 episodios desde el 20 de marzo de 2020) publica la biografía que acompaña al canal: que es la fundadora y directora ejecutiva del Guided Hearts Institute, educadora, conferenciante internacional y autora cuyo trabajo integra la enseñanza islámica con la psicología moderna y la educación psicoespiritual."
  fr: "La page Listen Notes du flux de conférences Muslim Central de Dunia Shuaib (60 épisodes depuis le 20 mars 2020) publie la biographie qui accompagne le flux: elle est la fondatrice et directrice exécutive du Guided Hearts Institute, une éducatrice, conférencière internationale et auteure dont le travail intègre l’enseignement islamique à la psychologie moderne et à l’éducation psycho-spirituelle."
  ur: "دنیا شعیب کی مسلم سنٹرل لیکچر فیڈ ⁦(20 مارچ 2020 سے 60 اقساط)⁩ کے لیے سننے کے نوٹس کا صفحہ، فیڈ کے ساتھ کی جانے والی سوانح عمری کو شائع کر رہا ہے: کہ وہ گائیڈڈ ہارٹس انسٹی ٹیوٹ کی بانی اور ایگزیکٹو ڈائریکٹر ہیں، ایک ماہر تعلیم، بین الاقوامی لیکچرر اور مصنف ہیں جن کا کام اسلامی تعلیمات اور نفسیاتی تعلیم کو جدید نفسیاتی تعلیم کے ساتھ مربوط کرتا ہے۔"
  tr: "Donia Shuaib'in Muslim Central üzerine verdiği derslerin yayını için Ders Notları sayfası (20 Mart 2020'den itibaren 60 bölüm) ve giriş metnini yayımlıyor: Gifted Hearts Institute'un kurucusu ve icra direktörüdür; ayrıca İslami eğitimi modern psikoloji ve ruhsal psikoloji ile bütünleştirme üzerine çalışan uluslararası bir öğretmen, öğretim görevlisi ve yazardır."
  id: "Halaman Catatan Pelajaran untuk menyiarkan kuliah Donia Shuaib tentang Muslim Central (60 episode sejak 20 Maret 2020), dan menerbitkan teks pengantar: Dia adalah pendiri dan direktur eksekutif Gifted Hearts Institute, serta seorang guru, dosen, dan penulis internasional yang bekerja mengintegrasikan pendidikan Islam dengan psikologi modern dan psikologi spiritual."
