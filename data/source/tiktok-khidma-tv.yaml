reliability_note: "The outlet's own account: a primary source for its identity and self-presentation, not independent corroboration. A video page on the account was read directly on 8 November 2026: author name 'KhidmaTV', username khidmatv1, bio in Swahili reading 'Video zaidi zipo YouTube Channel @KHIDMA TV Wasiliana nasi +255 752 950 350' (more videos are on the YouTube channel @KHIDMA TV; contact us +255 752 950 350) — the +255 country code is Tanzania's. Its posts invite viewers, in Swahili, to follow it for news and sermons of various sheikhs ('Kwa Habari na Mawaidha ya Masheikh mbalimbali') on its YouTube channel and social accounts, under the hashtag #UtumishiKwaWote ('service for all'); one post credits a writer as @bushrarashidmgodoka, which is a post credit, not an ownership attestation. The read returned no follower count for this account, and no count is taken from this source. The account text read names no owner, manager or parent organisation. Read on 8 November 2026."
