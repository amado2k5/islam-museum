  ur: "Khidma TV کا TikTok اکاؤنٹ (@khidmatv1) KhidmaTV کے نام سے؛ اس کا بائیو، 8 نومبر 2026 کو براہ راست پڑھا گیا، ناظرین کو اس کے یوٹیوب چینل @KHIDMA TV پر ہدایت کرتا ہے اور ایک تنزانیائی (+255) رابطہ نمبر دیتا ہے، اور اس کی پوسٹس پر #UtumishiKwaWote کا نعرہ ہیش ٹیگ ہوتا ہے۔"
