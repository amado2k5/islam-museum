  ar: "حساب خدمة تي في على تيك توك (@khidmatv1) باسم KhidmaTV؛ سيرته المقروءة مباشرة في 8 نوفمبر 2026 توجّه المشاهدين إلى قناته على يوتيوب @KHIDMA TV وتعطي رقم اتصال تنزانيًا (+255)، ومنشوراته تحمل شعار #UtumishiKwaWote."
  en: "Khidma TV's TikTok account (@khidmatv1) under the name KhidmaTV; its bio, read directly on 8 November 2026, directs viewers to its YouTube channel @KHIDMA TV and gives a Tanzanian (+255) contact number, and its posts carry the slogan hashtag #UtumishiKwaWote."
  es: "La cuenta de TikTok de Khidma TV (@khidmatv1) bajo el nombre KhidmaTV; su biografía, leída directamente el 8 de noviembre de 2026, dirige a los espectadores a su canal de YouTube @KHIDMA TV y proporciona un número de contacto de Tanzania (+255), y sus publicaciones llevan el eslogan hashtag #UtumishiKwaWote."
