summary:
  ar: "مدخل «وقف» في موسوعة TDV الإسلامية التركية، في قسمين: الفقه ⁦(حاجي محمد گوناي)⁩، ويتناول تعريف الوقف وألفاظه وأدلته من السنة وعمل الصحابة وخلاف أبي حنيفة وصاحبيه في لزومه وأنواعه ووقف النقود والاستبدال؛ والتاريخ ⁦(بهاء الدين يدي يلدز)⁩، ويتناول الوقف نظاماً للخيرات من القرن الثامن إلى القرن التاسع عشر، ودواوين الأحباس والبر، والمدارس والعمارات والمستشفيات الوقفية، وموقف القوى الاستعمارية من الوقف."
  en: "The TDV İslâm Ansiklopedisi entry 'Vakıf' (endowment), in two sections. The fiqh section (Hacı Mehmet Günay) covers the definition and terms of waqf, its basis in the Sunna and the practice of the Companions, the disagreement of Abu Hanifa and his two disciples over whether it binds, its kinds, the cash waqf and exchange (istibdal). The history section (Bahaeddin Yediyıldız) treats waqf as a system of charitable works from the eighth to the nineteenth century: the diwans of ahbas and birr, waqf madrasas, soup kitchens and hospitals, and the stance of the colonial powers towards waqf."
