summary:
  ar: "مدخل «وقف» في موسوعة TDV الإسلامية التركية، في قسمين: الفقه ⁦(حاجي محمد گوناي)⁩، ويتناول تعريف الوقف وألفاظه وأدلته من السنة وعمل الصحابة وخلاف أبي حنيفة وصاحبيه في لزومه وأنواعه ووقف النقود والاستبدال؛ والتاريخ ⁦(بهاء الدين يدي يلدز)⁩، ويتناول الوقف نظاماً للخيرات من القرن الثامن إلى القرن التاسع عشر، ودواوين الأحباس والبر، والمدارس والعمارات والمستشفيات الوقفية، وموقف القوى الاستعمارية من الوقف."
  en: "The TDV İslâm Ansiklopedisi entry 'Vakıf' (endowment), in two sections. The fiqh section (Hacı Mehmet Günay) covers the definition and terms of waqf, its basis in the Sunna and the practice of the Companions, the disagreement of Abu Hanifa and his two disciples over whether it binds, its kinds, the cash waqf and exchange (istibdal). The history section (Bahaeddin Yediyıldız) treats waqf as a system of charitable works from the eighth to the nineteenth century: the diwans of ahbas and birr, waqf madrasas, soup kitchens and hospitals, and the stance of the colonial powers towards waqf."
  es: "La entrada «Vakıf» (dotación) de la TDV İslâm Ansiklopedisi se divide en dos secciones. La sección de fiqh (Hacı Mehmet Günay) abarca la definición y los términos del waqf, su fundamento en la Sunna y la práctica de los Compañeros, el desacuerdo entre Abu Hanifa y sus dos discípulos sobre su carácter vinculante, sus tipos, el waqf en efectivo y el intercambio (istibdal). La sección de historia (Bahaeddin Yediyıldız) trata el waqf como un sistema de obras de caridad desde el siglo VIII hasta el XIX: los diwanes de ahbas y birr, las madrasas waqf, los comedores sociales y los hospitales, y la postura de las potencias coloniales respecto al waqf."
  fr: "L'article « Vakıf » (waqf) de l'encyclopédie islamique TDV est divisé en deux sections. La section juridique (fiqh) (Hacı Mehmet Günay) aborde la définition et les termes du waqf, son fondement dans la Sunna et la pratique des Compagnons, le désaccord entre Abu Hanifa et ses deux disciples quant à son caractère contraignant, ses différentes formes, le waqf en espèces et l'échange (istibdal). La section historique (Bahaeddin Yediyıldız) traite du waqf comme d'un système d'œuvres caritatives du VIIIe au XIXe siècle: les diwans des ahbas et des birr, les madrasas waqf, les soupes populaires et les hôpitaux, ainsi que la position des puissances coloniales à son égard."
  ur: "TDV İslâm Ansiklopedisi اندراج 'وکیف' ⁦(انڈومنٹ)⁩ دو حصوں میں۔ فقہ کا حصہ (Hacı Mehmet Günay) وقف کی تعریف اور شرائط، سنت اور صحابہ کے عمل میں اس کی بنیاد، ابو حنیفہ اور ان کے دو شاگردوں کا اس بات پر اختلاف ہے کہ آیا یہ پابند ہے، اس کی اقسام، نقد وقف اور تبادلہ ⁦(استبدال)⁩۔ ہسٹری سیکشن ⁦(بہاء الدین یدی لِدِز)⁩ وقف کو آٹھویں سے انیسویں صدی کے رفاہی کاموں کے نظام کے طور پر مانتا ہے: احباس اور بیر کے دیوان، وقف مدارس، سوپ کچن اور ہسپتال، اور وقف کے بارے میں استعماری طاقتوں کا موقف۔"
