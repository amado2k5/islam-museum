summary:
  ar: "الموقع الرسمي لمتحف اللوفر لسجلات مقتنياته، ومنها قسم الفنون الإسلامية. لكل قطعة سجل برقم أرك ثابت ورقم جرد وعنوان ووصف ونقوش وأصل وتاريخ اقتناء ومراجع، ويوفر الموقع نسخة JSON من كل سجل. نصوص السجلات معلومات عامة بموجب «الرخصة المفتوحة» الفرنسية ⁦(Etalab)⁩ مع ذكر المتحف وتاريخ آخر تحديث، أما الصور فلا تدخل في هذه الرخصة."
  en: "The Musée du Louvre's official site for the records of its holdings, among them the department of Islamic Arts. Each object has a record with a persistent ARK identifier, inventory numbers, title, description, inscriptions, provenance, acquisition details and bibliography, and a JSON copy of every record is served. The text of the records is public information under the French Open Licence (Etalab), with the museum and the date of the last update credited; the photographs are not covered by that licence."
  ur: "لوور میوزیم کی سرکاری ویب سائٹ جس پر اس کے ذخیرے کے ریکارڈ ہیں، ان میں اسلامی فنون کا شعبہ بھی ہے۔ ہر شے کے ریکارڈ میں مستقل آرک شناخت، اندراجی نمبر، عنوان، تفصیل، کتبے، تاریخِ ملکیت، حصول کی تفصیل اور مآخذ ہوتے ہیں، اور ہر ریکارڈ کی جے سن نقل بھی دستیاب ہے۔ ریکارڈ کا متن فرانسیسی کھلے اجازت نامے ایٹالاب کے تحت عوامی معلومات ہے، بشرطیکہ میوزیم اور آخری تازہ کاری کی تاریخ کا حوالہ دیا جائے۔ تصاویر اس اجازت نامے میں شامل نہیں۔"
