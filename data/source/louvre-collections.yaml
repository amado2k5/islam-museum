reliability_note: "Object records written and maintained by the museum's own curatorial departments (the Terms of Use name the Islamic Arts among them): inventory numbers, titles, dates, materials, place of creation, inscriptions, provenance, acquisition details and bibliography. Licence: article 4.1.2 of the site's Terms of Use (collections.louvre.fr/en/page/cgu, read 12 Nov 2026) makes the textual content of the entries public information under the Etalab Open Licence, reusable including commercially, on condition that the Musée du Louvre is credited as the source with the date of the most recent update, and that no endorsement is suggested; the museum's {cite:louvre-collections <ark-id>} with the link is the attribution. Anchor: the ARK identifier (for example ark:/53355/cl010062323, which resolves at collections.louvre.fr/ark:/53355/cl010062323), with the inventory number beside it; every record has a JSON copy at the same address plus .json (checked on one record, 12 Nov 2026). Exclusions that bind the museum: (1) photographs are not open: article 4.1.1 requires prior authorisation for copyright-protected works and limits reuse of the others, and images credited to GrandPalaisRmn for other institutions need that institution's agreement, so no image is fetched, stored or republished; (2) the ADAGP clause of article 4.1.1.1 forbids text and data mining of titles and author names of works in the ADAGP repertory (modern and contemporary artists), which no Islamic-department object is expected to be, and any such record is skipped; (3) robots.txt (read 12 Nov 2026) disallows /search/export for all clients, and blocks image paths for named AI crawlers, so the export route is never used and images are never requested. The terms do not forbid reading record pages or their JSON, and no login or challenge is involved. Harvest channel: single record JSON addresses, one request at a time with a pause, text fields only; no bulk route exists. Posture: open for textual notices; restated in the museum's own words as facts, never lifted in whole. Record text is French or English, not Arabic. Coverage of the museum's backlog of objects is not yet measured. Tier 2. Assessment: web-sources lane, 12 Nov 2026; registered on the founder's approval of four pilot sources, 12 Nov 2026."
