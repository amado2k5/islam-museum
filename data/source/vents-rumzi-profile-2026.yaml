summary:
  ar: "ملف مجلة Vents ⁦(20 أغسطس 2026)⁩ عن رمزي، صاحب قناة «دعوة فوق الدنيا»: صانع محتوى وداعية في الرابعة والعشرين من أسرة فلسطينية نشأ في منطقة خليج سان فرانسيسكو بكاليفورنيا، بنى خلال أربع سنوات قناة تجاوز مشتركوها 200 ألف ومشاهداتها 125 مليونًا، وأتمّ خلال ذلك بكالوريوس الهندسة الكيميائية."
  en: "Vents Magazine's profile (20 August 2026) of Rumzi of Dawah Over Dunya: a 24-year-old content creator and dawah educator from a Palestinian family, raised in California's Bay Area, who in four years built a channel of more than 200,000 subscribers and 125 million views while completing a Bachelor's degree in chemical engineering."
  es: "Perfil publicado por la revista Vents (20 de agosto de 2026) sobre Rumzi de Dawah Over Dunya: un creador de contenido y educador de dawah de 24 años, proveniente de una familia palestina, criado en el Área de la Bahía de California, que en cuatro años construyó un canal con más de 200.000 suscriptores y 125 millones de visualizaciones mientras completaba una licenciatura en ingeniería química."
  fr: "Profil de Rumzi de Dawah Over Dunya par Vents Magazine (20 août 2026): un créateur de contenu et éducateur de dawah de 24 ans issu d'une famille palestinienne, élevé dans la région de la baie de San Francisco en Californie, qui a construit en quatre ans une chaîne de plus de 200 000 abonnés et 125 millions de vues tout en terminant un baccalauréat en génie chimique."
  ur: "وینٹ میگزین کا رمزی آف دعوہ اوور دنیا کا پروفائل ⁦(20 اگست 2026)⁩: فلسطینی خاندان سے تعلق رکھنے والا 24 سالہ مواد تخلیق کرنے والا اور دعوۃ معلم، کیلیفورنیا کے بے ایریا میں پرورش پانے والا، جس نے چار سالوں میں 200,000 سے زیادہ صارفین کا چینل بنایا اور 125 ملین کیمیکل انجینئرنگ کی ڈگری حاصل کی۔"
