summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن عبد الرزاق حسين (1922–1976)؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في بيكان سنة 1922 ورئاسته لوزراء ماليزيا حتى وفاته ولقبه بعد وفاته «أبو التنمية»."
  en: "Indonesian Wikipedia article on Abdul Razak Hussein (1922–1976); used for entity facts only. It gives his birth at Pekan in 1922, his Malaysian premiership until his death, and his posthumous title 'Father of Development'."
  es: "Artículo de la Wikipedia en indonesio sobre Abdul Razak Hussein (1922-1976); utilizado únicamente para datos sobre la persona. Indica su nacimiento en Pekan en 1922, su mandato como primer ministro de Malasia hasta su muerte y su título póstumo de «Padre del Desarrollo»."
  fr: "Article de Wikipédia indonésien sur Abdul Razak Hussein (1922-1976); utilisé uniquement pour les informations sur l'entité. Il indique sa naissance à Pekan en 1922, son mandat de Premier ministre de Malaisie jusqu'à sa mort et son titre posthume de « Père du développement »."
  ur: "عبدالرزاق حسین (1922-1976) پر انڈونیشیائی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1922 میں پیکان میں ان کی پیدائش، ان کی موت تک ملائیشیا کی وزارت عظمیٰ، اور بعد از مرگ 'Father of Development' کا خطاب دیتا ہے۔"
  tr: "Abdul Razzaq Hussain (1922–1976) hakkında Endonezya Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1922'de Bikan'da adı geçilmiş ve ölümüne kadar Malezya Başbakanı olarak görev yapmış, ölümünden sonra 'Kalkınmanın Babası' lakabını almıştır."
  id: "Artikel Wikipedia Indonesia tentang Abdul Razzaq Hussain (1922–1976); hanya digunakan untuk fakta entitas tersebut. Ia disebutkan dalam Bikan pada tahun 1922 dan menjabat sebagai Perdana Menteri Malaysia hingga wafat, serta dijuluki secara anumerta 'Bapak Pembangunan.'"
