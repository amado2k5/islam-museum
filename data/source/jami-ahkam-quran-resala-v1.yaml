  en: "al-Jami' li-Ahkam al-Qur'an — al-Qurtubi, ed. Abd Allah ibn Abd al-Muhsin al-Turki (Mu'assasat al-Risala, 2006), vol. 1"
  ur: "الجامع لاحکام القرآن — قرطبی، تحقیق عبد اللہ بن عبد المحسن الترکی (مؤسسۃ الرسالہ، 2006ء)، جلد اول"
summary:
  ar: "الجزء الأول من طبعة مؤسسة الرسالة ببيروت لتفسير القرطبي، بتحقيق الدكتور عبد الله بن عبد المحسن التركي، وشارك في تحقيق هذا الجزء محمد رضوان عرقسوسي؛ الطبعة الأولى 1427هـ/2006م. يضم مقدمة المصنف بأبوابها في علوم القرآن، ويقابل النص على نسخ خطية يرمز لها (ظ، د، ز) والمطبوعة (م)."
  en: "Volume 1 of the Mu'assasat al-Risala (Beirut) edition of al-Qurtubi's commentary, edited by Dr Abd Allah ibn Abd al-Muhsin al-Turki, with Muhammad Ridwan Irqsusi sharing in this volume; 1st edition 1427 AH / 2006. It contains the author's introduction and its chapters on the Qur'anic sciences, collated against manuscripts sigla (ظ، د، ز) and the earlier printing (م)."
  ur: "مؤسسۃ الرسالہ بیروت کے قرطبی کی تفسیر کے ایڈیشن کی پہلی جلد، تحقیق ڈاکٹر عبد اللہ بن عبد المحسن الترکی، اس جلد کی تحقیق میں محمد رضوان عرقسوسی شریک؛ پہلا ایڈیشن 1427ھ / 2006ء۔ اس میں مصنف کا مقدمہ اور علومِ قرآن پر اس کے ابواب ہیں، جن کا مقابلہ مخطوطات (ظ، د، ز) اور سابقہ مطبوعہ (م) سے کیا گیا ہے۔"
title: "الجامع لأحكام القرآن والمبين لما تضمنه من السنة وآي الفرقان، الجزء الأول"
