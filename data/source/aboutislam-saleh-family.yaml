summary:
  ar: "خبر موقع أباوت إسلام في 3 فبراير 2021 عن الزوجين المسلمين في تورونتو ويل وسنا صالح، المشهورين بمقاطعهما الكوميدية التي تجمع الناس، وإطلاقهما شركة «لالا حجاب» للحجابات المصبوغة يدويًا بعبوات مستدامة؛ يورد قول سنا إن الفكرة جاءت من غياب حجابات مصبوغة بأسلوب التعادل اللوني، وقول ويل — الذي نشأ غير مسلم — إن هدفهما تقريب صورة المسلمين إلى الناس، ومتابعتهما التي بلغت مئات الآلاف على تيك توك ويوتيوب."
  en: "AboutIslam's news report of 3 February 2021 on the Toronto Muslim couple Will and Sana Saleh, famous for comic videos that bring people together, and their launch of Lala Hijabs, selling hand-dyed hijabs in sustainable packaging. It quotes Sana on the idea coming from the absence of tie-dye hijabs, and Will — who says he grew up not a Muslim — on their aim of humanising Muslim people; it reports their following of hundreds of thousands on TikTok and YouTube."
