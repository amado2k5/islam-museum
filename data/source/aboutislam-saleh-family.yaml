summary:
  ar: "خبر موقع أباوت إسلام في 3 فبراير 2021 عن الزوجين المسلمين في تورونتو ويل وسنا صالح، المشهورين بمقاطعهما الكوميدية التي تجمع الناس، وإطلاقهما شركة «لالا حجاب» للحجابات المصبوغة يدويًا بعبوات مستدامة؛ يورد قول سنا إن الفكرة جاءت من غياب حجابات مصبوغة بأسلوب التعادل اللوني، وقول ويل — الذي نشأ غير مسلم — إن هدفهما تقريب صورة المسلمين إلى الناس، ومتابعتهما التي بلغت مئات الآلاف على تيك توك ويوتيوب."
  en: "AboutIslam's news report of 3 February 2021 on the Toronto Muslim couple Will and Sana Saleh, famous for comic videos that bring people together, and their launch of Lala Hijabs, selling hand-dyed hijabs in sustainable packaging. It quotes Sana on the idea coming from the absence of tie-dye hijabs, and Will — who says he grew up not a Muslim — on their aim of humanising Muslim people; it reports their following of hundreds of thousands on TikTok and YouTube."
  es: "El reportaje de AboutIslam del 3 de febrero de 2021 trata sobre la pareja musulmana de Toronto, Will y Sana Saleh, famosos por sus vídeos cómicos que unen a la gente, y el lanzamiento de Lala Hijabs, una marca que vende hijabs teñidos a mano en envases sostenibles. El reportaje cita a Sana, quien explica que la idea surgió ante la falta de hijabs teñidos con la técnica tie-dye, y a Will —quien afirma haber crecido sin ser musulmán—, quien destaca su objetivo de humanizar a la comunidad musulmana. Asimismo, informa que cuentan con cientos de miles de seguidores en TikTok y YouTube."
  fr: "L'article d'AboutIslam du 3 février 2021 présente Will et Sana Saleh, un couple musulman torontois célèbre pour ses vidéos humoristiques fédératrices, et le lancement de Lala Hijabs, une marque de hijabs teints à la main et présentés dans des emballages écoresponsables. Sana explique que l'idée leur est venue face à l'absence de hijabs tie-dye, tandis que Will, qui précise avoir grandi dans une famille non musulmane, évoque leur volonté de donner une image plus humaine des musulmans. L'article mentionne également leurs centaines de milliers d'abonnés sur TikTok et YouTube."
  ur: "ٹورنٹو کے مسلمان جوڑے ول اور ثناء صالح کے بارے میں اسلام کی 3 فروری 2021 کی نیوز رپورٹ، جو لوگوں کو اکٹھا کرنے والی مزاحیہ ویڈیوز کے لیے مشہور ہے، اور ان کے لالہ حجاب کے اجراء، پائیدار پیکیجنگ میں ہاتھ سے رنگے ہوئے حجاب فروخت کر رہے ہیں۔ یہ ٹائی ڈائی حجاب کی عدم موجودگی سے آنے والے آئیڈیا پر ثنا کا حوالہ دیتا ہے، اور ول - جو کہتا ہے کہ وہ مسلمان نہیں ہوا ہے - ان کا مقصد مسلمان لوگوں کو انسان بنانا ہے۔ یہ TikTok اور YouTube پر ان کے لاکھوں کی تعداد میں پیروکاروں کی اطلاع دیتا ہے۔"
