summary:
  ar: 'مقالة ويكيبيديا الفارسية عن دولا عمر؛ تُستخدم لوقائع الكيان فقط. توازي المقالة الإنجليزية: وُلد في 26 مايو 1934 في أوبزرفاتوري بكيب تاون لأبوين مهاجرين غوجراتيين، وكان عضوًا محترمًا في المجتمع المسلم، ووزيرًا للعدل منذ 1994، ووزيرًا للنقل منذ 1999 حتى وفاته في 13 مارس 2004، ودُفن وفق الشعائر الإسلامية.'
  en: 'Persian Wikipedia article on Dullah Omar; used for entity facts only. It mirrors the English article: born 26 May 1934 in Observatory, Cape Town, to Gujarati immigrant parents, a respected member of the Muslim community, justice minister from 1994, transport minister from 1999 until his death on 13 March 2004, buried in accordance with Muslim rites.'
  es: "Artículo de Wikipedia en persa sobre Dullah Omar; se utiliza únicamente para datos sobre la persona. Refleja el artículo en inglés: nació el 26 de mayo de 1934 en Observatory, Ciudad del Cabo, de padres inmigrantes gujaratis, fue un miembro respetado de la comunidad musulmana, ministro de justicia desde 1994, ministro de transporte desde 1999 hasta su fallecimiento el 13 de marzo de 2004, y fue enterrado según los ritos musulmanes."
  fr: "Article Wikipédia en persan sur Dullah Omar; utilisé uniquement à titre informatif. Il reprend les termes de l’article anglais: né le 26 mai 1934 à Observatory, au Cap, de parents immigrés gujaratis, membre respecté de la communauté musulmane, ministre de la Justice à partir de 1994, ministre des Transports de 1999 jusqu’à son décès le 13 mars 2004, inhumé selon le rite musulman."
  ur: "دلا عمر پر فارسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ انگریزی مضمون کا عکس ہے: 26 مئی 1934 کو آبزرویٹری، کیپ ٹاؤن میں گجراتی تارکین وطن والدین کے ہاں پیدا ہوا، مسلم کمیونٹی کے ایک معزز رکن، 1994 سے وزیر انصاف، 1999 سے وزیر ٹرانسپورٹ، 13 مارچ 2004 کو اپنی موت تک، مسلم رسومات کے مطابق دفنایا گیا۔"
  tr: "Doula Omar hakkında Farsça Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. İngilizce makale ise şöyle karşılık gelir: 26 Mayıs 1934'te Cape Town'daki Gözlemevi'nde Gujarati göçmen ebeveynlerin çocuğu olarak doğdu. Müslüman topluluğun saygın bir üyesi, 1994'ten beri Adalet Bakanı ve 1999'dan 13 Mart 2004'teki ölümüne kadar Ulaştırma Bakanıydı. İslami ayinlere uygun şekilde defnedildi."
  id: "Artikel Wikipedia Persia tentang Doula Omar; digunakan hanya untuk fakta entitas. Artikel berbahasa Inggris bersesuaian: Ia lahir pada 26 Mei 1934 di Observatorium Cape Town dari orang tua imigran Gujarati. Ia adalah anggota komunitas Muslim yang dihormati, Menteri Kehakiman sejak 1994, dan Menteri Transportasi dari 1999 hingga wafat pada 13 Maret 2004. Ia dimakamkan sesuai dengan upacara Islam."
