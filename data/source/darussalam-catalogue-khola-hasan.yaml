summary:
  ar: "كتالوج كتب دار السلام يخصص مدخلاً لـ«كتب خولة حسن»: كتابها «مآذن إسبانيا المتهاوية» (ناشرون طه، ٣٢ صفحة)، وكتابها عن التكاليف الطبية والاجتماعية لزواج الأقارب في الجالية الميربورية البريطانية (ألباتروس، ٦٠ صفحة)، وترجمتها لكتاب «ألوان الشرك المتعددة» بإشراف الدكتور صهيب حسن (دار السلام، ٦٤ صفحة)."
  en: "The Darussalam books catalogue's entry 'Books of Khola Hasan': her book The Crumbling Minarets of Spain (Taha Publishers, 32 pages), her book The Medical and Social Costs of Cousin Marriages within the British Mirpuri Community (Albatross Publishers, 60 pages), and her translation The Many Shades of Shirk, supervised by Dr Suhaib Hasan (Darussalam, 64 pages)."
