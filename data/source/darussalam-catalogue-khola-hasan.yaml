summary:
  ar: "كتالوج كتب دار السلام يخصص مدخلاً لـ«كتب خولة حسن»: كتابها «مآذن إسبانيا المتهاوية» ⁦(ناشرون طه، ٣٢ صفحة)⁩، وكتابها عن التكاليف الطبية والاجتماعية لزواج الأقارب في الجالية الميربورية البريطانية ⁦(ألباتروس، ٦٠ صفحة)⁩، وترجمتها لكتاب «ألوان الشرك المتعددة» بإشراف الدكتور صهيب حسن ⁦(دار السلام، ٦٤ صفحة)⁩."
  en: "The Darussalam books catalogue's entry 'Books of Khola Hasan': her book The Crumbling Minarets of Spain (Taha Publishers, 32 pages), her book The Medical and Social Costs of Cousin Marriages within the British Mirpuri Community (Albatross Publishers, 60 pages), and her translation The Many Shades of Shirk, supervised by Dr Suhaib Hasan (Darussalam, 64 pages)."
  es: "La entrada \"Libros de Khola Hasan\" en el catálogo de libros de Darussalam incluye: su libro Los minaretes en ruinas de España (Taha Publishers, 32 páginas), su libro Los costos médicos y sociales de los matrimonios entre primos dentro de la comunidad Mirpuri británica (Albatross Publishers, 60 páginas) y su traducción Los muchos matices de la idolatría, supervisada por el Dr. Suhaib Hasan (Darussalam, 64 páginas)."
  fr: "L'entrée du catalogue de livres Darussalam « Livres de Khola Hasan »: son livre The Crumbling Minarets of Spain (Taha Publishers, 32 pages), son livre The Medical and Social Costs of Cousin Marriages within the British Mirpuri Community (Albatross Publishers, 60 pages) et sa traduction The Many Shades of Shirk, supervisée par le Dr Suhaib Hasan (Darussalam, 64 pages)."
  ur: "کتاب The Crumbling Minarets of Spain ⁦(طحہ پبلشرز، 32 صفحات)⁩، The Medical and Social Costs of Cousin Marriages within the British Mirpuri Community ⁦(Albatross Publishers, 60 صفحات)⁩، اور اس کا ترجمہ The Many Shades of Shirk، زیر نگرانی ڈاکٹر صہیب حسن ⁦(دارالسلام، 64 صفحہ)⁩۔"
  tr: "Dar Al-Salam Kitaplar Kataloğu, \"Khawla Hassan'ın Kitapları\"na bir giriş ayırır: \"İspanya'nın Yıkılan Minareleri\" (Taha Publishers, 32 sayfa), İngiliz Mariborian topluluğunda akraba evliliğinin tıbbi ve sosyal maliyetleri üzerine kitabı (Albatross, 60 sayfa) ve Dr. Suhaib Hassan danışmanlığında \"Çoktanrıcılığın Çok Renkleri\" adlı kitabın çevirisi (Dar Al-Salam, 64 sayfa)."
  id: "Katalog Buku Dar Al-Salam mendedikasikan satu entri untuk \"Buku-buku Khawla Hassan\": bukunya \"Menara Menara Runtuh Spanyol\" (Taha Publishers, 32 halaman), bukunya tentang biaya medis dan sosial pernikahan sedarah di komunitas Mariborian Inggris (Albatross, 60 halaman), dan terjemahannya atas buku \"Warna Ganda Politeisme\" yang diawasi oleh Dr. Suhaib Hassan (Dar Al-Salam, 64 halaman)."
