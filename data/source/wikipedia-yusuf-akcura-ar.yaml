summary:
  ar: "بذرة ويكيبيديا العربية عن يوسف آقجورا؛ تُستخدم لوقائع الكيان فقط. تؤرخ له 1876–1935، وتصفه بأنه من منظري الطورانية ومن دعاة الفكر القومي في تركيا، وتذكر مولده في أوليانوفسك ⁦(سيمبيرسك سابقًا)⁩ في الإمبراطورية الروسية، ومن مؤلفاته كتاب عن أوضاع المسلمين التتار في روسيا وكتابات في مجلة «ترك». ولا تسمي مدرسة له."
  en: "Arabic Wikipedia stub on Yusuf Akçura; used for entity facts only. It dates him 1876–1935, calls him one of the theorists of Turanism and an advocate of national thought in Turkey, gives his birth at Ulyanovsk (formerly Simbirsk) in the Russian Empire, and names among his works a book on the condition of the Tatar Muslims of Russia and writings in the journal Türk. It names no school for him."
  es: "Breve entrada en árabe de la Wikipedia sobre Yusuf Akçura; se utiliza únicamente para datos sobre la persona. Lo fecha entre 1876 y 1935, lo describe como uno de los teóricos del turanismo y defensor del pensamiento nacional en Turquía, indica que nació en Ulyanovsk (antes Simbirsk), en el Imperio ruso, y menciona entre sus obras un libro sobre la situación de los musulmanes tártaros de Rusia y escritos en la revista Türk. No se menciona ninguna escuela a la que pertenezca."
  fr: "Ébauche de l'article Wikipédia en arabe consacré à Yusuf Akçura; utilisé uniquement pour des informations factuelles. Il le situe de 1876 à 1935, le présente comme l'un des théoriciens du touranisme et un défenseur de la pensée nationale en Turquie, indique qu'il est né à Oulianovsk (anciennement Simbirsk) dans l'Empire russe, et cite parmi ses œuvres un livre sur la condition des musulmans tatars de Russie et des articles parus dans la revue Türk. Aucune école n'est mentionnée."
  ur: "یوسف اکوورا پر عربی ویکیپیڈیا اسٹب؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی تاریخ 1876-1935 ہے، اسے ترکی میں ترانزم کے نظریہ سازوں میں سے ایک اور قومی فکر کا حامی قرار دیا گیا ہے، اس کی پیدائش روسی سلطنت میں اولیانوسک ⁦(سابقہ سمبرسک)⁩ میں ہوئی ہے، اور ان کی تخلیقات میں روس کے تاتار مسلمانوں کی حالت پر ایک کتاب اور جریدے ترک میں تحریروں کے نام شامل ہیں۔ اس کے لیے کسی اسکول کا نام نہیں ہے۔"
  tr: "Yusuf Akjura hakkında Arapça Vikipedi taslağı yalnızca varlığın gerçekleri için kullanılır. Onu 1876-1935 yılları arasında tarihlendirir ve Turanizm teorisyeni ve Türkiye'de milliyetçi düşüncenin savunucusu olarak tanımlanır. Rus İmparatorluğu'nda Ulyanovsk'ta (eski adıyla Sempirsk) doğduğu anılmaktadır. Eserleri arasında Rusya'daki Tatar Müslümanların durumu üzerine bir kitap ve 'Turk' dergisindeki yazılar bulunmaktadır. Onun adına bir okul yoktur."
  id: "Artikel singkat Wikipedia bahasa Arab tentang Yusuf Akjura hanya digunakan untuk fakta-fakta entitas tersebut. Buku ini mencatatkan tanggal 1876 hingga 1935, menggambarkannya sebagai seorang teoritikus Turanisme dan pendukung pemikiran nasionalis di Turki. Artikel tersebut menyebutkan kelahirannya di Ulyanovsk (sebelumnya Sempirsk) di Kekaisaran Rusia. Di antara karyanya terdapat sebuah buku tentang situasi Muslim Tatar di Rusia dan tulisan-tulisan di majalah 'Turk'. Tidak ada sekolah yang dinamai menurut namanya."
