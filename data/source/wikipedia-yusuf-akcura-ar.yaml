  ar: "بذرة ويكيبيديا العربية عن يوسف آقجورا؛ تُستخدم لوقائع الكيان فقط. تؤرخ له 1876–1935، وتصفه بأنه من منظري الطورانية ومن دعاة الفكر القومي في تركيا، وتذكر مولده في أوليانوفسك (سيمبيرسك سابقًا) في الإمبراطورية الروسية، ومن مؤلفاته كتاب عن أوضاع المسلمين التتار في روسيا وكتابات في مجلة «ترك». ولا تسمي مدرسة له."
  en: "Arabic Wikipedia stub on Yusuf Akçura; used for entity facts only. It dates him 1876–1935, calls him one of the theorists of Turanism and an advocate of national thought in Turkey, gives his birth at Ulyanovsk (formerly Simbirsk) in the Russian Empire, and names among his works a book on the condition of the Tatar Muslims of Russia and writings in the journal Türk. It names no school for him."
