  ar: "قناة «أنس آكشن» على يوتيوب، يقدم فيها صاحبها سلاسل في سيرة النبي وقصص البداية والنهاية وموضوعات دينية واجتماعية؛ تربط أوصاف مقاطعها قوائم تشغيله وحساباته على سناب شات وإنستغرام وتويتر."
