  es: "El canal de YouTube 'Anas Action', en el que su presentador ofrece series sobre la biografía del Profeta, sobre las historias de Al-Bidaya wa'l-Nihaya y sobre temas religiosos y sociales; las descripciones de sus vídeos enlazan con sus listas de reproducción y sus cuentas de Snapchat, Instagram y Twitter."
  fr: "La chaîne YouTube « Anas Action », sur laquelle son animateur présente des séries sur la biographie du Prophète, sur les récits d'Al-Bidaya wa'l-Nihaya et sur des sujets religieux et sociaux; ses descriptions de vidéos renvoient vers ses playlists et ses comptes Snapchat, Instagram et Twitter."
