summary:
  ar: "مقالة ويكيبيديا العربية عن حكيم محمد سعيد؛ تُستخدم لوقائع الكيان فقط. ترجمة للمقالة الإنجليزية تروي مولده في دلهي سنة 1920 لأسرة متعلمة متدينة ناطقة بالأردية، ودراسته القرآن في المدرسة المحلية، وتأسيسه مؤسسة همدرد سنة 1948 واستقراره في كراتشي، واغتياله في 17 أكتوبر 1998."
  en: "Arabic Wikipedia article on Hakim Muhammad Said; used for entity facts only. A translation of the English article, recounting his birth at Delhi in 1920 to an educated, religious Urdu-speaking family, his school study of the Qur'an, his founding of the Hamdard Foundation in 1948 and settlement in Karachi, and his assassination on 17 October 1998."
  es: "Artículo en árabe de la Wikipedia sobre Hakim Muhammad Said; utilizado únicamente para datos biográficos. Traducción del artículo en inglés que relata su nacimiento en Delhi en 1920 en el seno de una familia culta, religiosa y de habla urdu, sus estudios del Corán en la escuela, la fundación de la Fundación Hamdard en 1948 y su establecimiento en Karachi, y su asesinato el 17 de octubre de 1998."
  fr: "Article de Wikipédia en arabe sur Hakim Muhammad Said; utilisé uniquement à des fins d’information sur l’entité. Traduction de l’article anglais, relatant sa naissance à Delhi en 1920 dans une famille éduquée, religieuse et de langue ourdou, ses études du Coran, la fondation de la Fondation Hamdard en 1948 et son installation à Karachi, ainsi que son assassinat le 17 octobre 1998."
  ur: "حکیم محمد سعید پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ انگریزی مضمون کا ترجمہ، 1920 میں دہلی میں ایک پڑھے لکھے، مذہبی اردو بولنے والے گھرانے میں ان کی پیدائش، ان کے اسکول میں قرآن کا مطالعہ، 1948 میں ان کی ہمدرد فاؤنڈیشن کی بنیاد اور کراچی میں قیام، اور 17 اکتوبر 1998 کو ان کے قتل کا ذکر۔"
