  ar: "مقالة ويكيبيديا العربية عن حكيم محمد سعيد؛ تُستخدم لوقائع الكيان فقط. ترجمة للمقالة الإنجليزية تروي مولده في دلهي سنة 1920 لأسرة متعلمة متدينة ناطقة بالأردية، ودراسته القرآن في المدرسة المحلية، وتأسيسه مؤسسة همدرد سنة 1948 واستقراره في كراتشي، واغتياله في 17 أكتوبر 1998."
  en: "Arabic Wikipedia article on Hakim Muhammad Said; used for entity facts only. A translation of the English article, recounting his birth at Delhi in 1920 to an educated, religious Urdu-speaking family, his school study of the Qur'an, his founding of the Hamdard Foundation in 1948 and settlement in Karachi, and his assassination on 17 October 1998."
