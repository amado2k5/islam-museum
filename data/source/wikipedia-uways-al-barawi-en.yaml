summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الشيخ أويس البراوي (1847-1909)، العالم الصومالي الذي يُنسب إليه إحياء الإسلام في شرق أفريقيا في القرن التاسع عشر؛ يذكر صندوق معلوماتها أن مذهبه الفقهي الشافعي وأن معتقده الطريقة القادرية والأويسية، وتروي دراسته في بغداد عند مصطفى بن سلمان الجيلاني وعودته سنة 1883 وقيادته القادرية في الصومال وقتله على أيدي الدراويش سنة 1909."
  en: "English Wikipedia article on Sheikh Uways al-Barawi (1847–1909), the Somali scholar credited with reviving Islam in 19th-century East Africa; its infobox gives his jurisprudence as Shafi'i and his creed as Qadiriyya, Uwaysiyya, and its text recounts his studies in Baghdad under Mustafa b. Salman al-Jilani, his return in 1883, his leadership of the Qadiriyya in Somalia, and his killing by the Dervishes in 1909."
  es: "Artículo de Wikipedia en inglés sobre Sheikh Uways al-Barawi (1847-1909), el erudito somalí al que se atribuye el resurgimiento del Islam en el África Oriental del siglo XIX; su cuadro de información brinda su jurisprudencia como Shafi'i y su credo como Qadiriyya, Uwaysiyya, y su texto relata sus estudios en Bagdad bajo Mustafa b. Salman al-Jilani, su regreso en 1883, su liderazgo de Qadiriyya en Somalia y su asesinato a manos de los derviches en"
  fr: "Article de Wikipédia en anglais sur Cheikh Uways al-Barawi (1847-1909), l'érudit somalien crédité de la renaissance de l'Islam en Afrique de l'Est au XIXe siècle; sa boîte d'informations donne sa jurisprudence en tant que Shafi'i et son credo en tant que Qadiriyya, Uwaysiyya, et son texte raconte ses études à Bagdad sous Mustafa b. Salman al-Jilani, son retour en 1883, sa direction de la Qadiriyya en Somalie et son assassinat par les Derviches en"
  ur: "شیخ اویس البراوی (1847-1909) پر انگریزی ویکیپیڈیا کا مضمون، صومالی اسکالر نے 19ویں صدی کے مشرقی افریقہ میں اسلام کو زندہ کرنے کا سہرا دیا ہے۔ اس کے معلوماتی خانے میں ان کا فقہ شافعی اور عقیدہ قادریہ، اویسیہ بتایا گیا ہے، اور اس کے متن میں ان کی بغداد میں مصطفیٰ ب کے دور میں تعلیم کا ذکر ہے۔ سلمان الجیلانی، 1883 میں ان کی واپسی، صومالیہ میں قادریہ کی قیادت، اور درویشوں کے ہاتھوں ان کا قتل۔"
  tr: "Doğu Afrika'da İslam'ı yeniden canlandıran Somalili alim Şeyh Owais Al-Barawi (1847-1909) hakkında İngilizce Wikipedia makalesi; bilgi kutusunda onun fıkıh okulu Şafii olduğu ve inancının Kadiriyye ile Owaisi tarikatları olduğu belirtilir. Kitap, Mustafa bin Salman el-Cilani'nin Bağdat'taki eğitimini, 1883'te dönüşünü, Somali'deki Kadirilere liderliğini ve 1909'da dervişler tarafından öldürülmesini anlatır."
  id: "Artikel Wikipedia berbahasa Inggris tentang Sheikh Owais Al-Barawi (1847-1909), seorang cendekiawan Somalia yang diakui telah menghidupkan kembali Islam di Afrika Timur pada abad kesembilan belas; kotak informasinya menyebutkan bahwa aliran kehakimannya adalah Shafi'i, dan kepercayaannya adalah ordo Qadiriyya dan Owaisi. Artikel ini menceritakan studinya di Baghdad di bawah Mustafa bin Salman al-Jilani, kepulangannya pada tahun 1883, kepemimpinannya atas Qadiri di Somalia, dan pembunuhannya oleh para derwish pada tahun 1909."
