summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الشيخ أويس البراوي (1847-1909)، العالم الصومالي الذي يُنسب إليه إحياء الإسلام في شرق أفريقيا في القرن التاسع عشر؛ يذكر صندوق معلوماتها أن مذهبه الفقهي الشافعي وأن معتقده الطريقة القادرية والأويسية، وتروي دراسته في بغداد عند مصطفى بن سلمان الجيلاني وعودته سنة 1883 وقيادته القادرية في الصومال وقتله على أيدي الدراويش سنة 1909."
  en: "English Wikipedia article on Sheikh Uways al-Barawi (1847–1909), the Somali scholar credited with reviving Islam in 19th-century East Africa; its infobox gives his jurisprudence as Shafi'i and his creed as Qadiriyya, Uwaysiyya, and its text recounts his studies in Baghdad under Mustafa b. Salman al-Jilani, his return in 1883, his leadership of the Qadiriyya in Somalia, and his killing by the Dervishes in 1909."
