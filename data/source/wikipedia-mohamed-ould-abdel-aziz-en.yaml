summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد ولد عبد العزيز؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في أكجوجت سنة 1956، ودوره في انقلاب 2005 وقيادته انقلاب 2008، ورئاسته المجلس الأعلى للدولة ثم رئاسة البلاد (2009–2019) ورئاسته الاتحاد الأفريقي (2014–2015)، ثم اتهامه بالفساد وسجنه وإدانته سنة 2023 ورفع الحكم استئنافا سنة 2025 إلى خمس عشرة سنة. لا يذكر نصّها دينه؛ وتصنّفه في «المسلمين الموريتانيين» و«نقاد الإسلاموية»."
  en: "English Wikipedia article on Mohamed Ould Abdel Aziz; used for entity facts only. It recounts his birth at Akjoujt in 1956, his leading role in the 2005 coup and his leadership of the 2008 coup, his headship of the High Council of State and then the presidency (2009–2019), his chairmanship of the African Union (2014–2015), and then his corruption charge, jailing, conviction in 2023 and the raising of his sentence on appeal in 2025 to fifteen years. Its text says nothing about his religion; it files him under Mauritanian Muslims and Critics of Islamism."
