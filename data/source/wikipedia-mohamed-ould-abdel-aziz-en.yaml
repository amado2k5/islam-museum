summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد ولد عبد العزيز؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في أكجوجت سنة 1956، ودوره في انقلاب 2005 وقيادته انقلاب 2008، ورئاسته المجلس الأعلى للدولة ثم رئاسة البلاد (2009–2019) ورئاسته الاتحاد الأفريقي (2014–2015)، ثم اتهامه بالفساد وسجنه وإدانته سنة 2023 ورفع الحكم استئنافا سنة 2025 إلى خمس عشرة سنة. لا يذكر نصّها دينه؛ وتصنّفه في «المسلمين الموريتانيين» و«نقاد الإسلاموية»."
  en: "English Wikipedia article on Mohamed Ould Abdel Aziz; used for entity facts only. It recounts his birth at Akjoujt in 1956, his leading role in the 2005 coup and his leadership of the 2008 coup, his headship of the High Council of State and then the presidency (2009–2019), his chairmanship of the African Union (2014–2015), and then his corruption charge, jailing, conviction in 2023 and the raising of his sentence on appeal in 2025 to fifteen years. Its text says nothing about his religion; it files him under Mauritanian Muslims and Critics of Islamism."
  es: "Artículo de la Wikipedia en inglés sobre Mohamed Ould Abdel Aziz; utilizado únicamente para datos sobre la persona. Relata su nacimiento en Akjoujt en 1956, su papel protagónico en el golpe de Estado de 2005 y su liderazgo en el golpe de 2008, su presidencia del Alto Consejo de Estado y posteriormente la presidencia (2009-2019), su presidencia de la Unión Africana (2014-2015), y luego su acusación por corrupción, su encarcelamiento, su condena en 2023 y el aumento de su sentencia en apelación en 2025 a quince años. El texto no menciona su religión; lo clasifica dentro de la categoría de musulmanes mauritanos y críticos del islamismo."
  fr: "L'article de Wikipédia en anglais consacré à Mohamed Ould Abdel Aziz, utilisé uniquement à des fins d'information sur l'entité, relate sa naissance à Akjoujt en 1956, son rôle prépondérant dans le coup d'État de 2005 et sa direction du coup d'État de 2008, sa présidence du Haut Conseil d'État puis de l'Union africaine (2009-2019), sa présidence de l'Union africaine (2014-2015), ainsi que son inculpation pour corruption, son emprisonnement, sa condamnation en 2023 et le reclassement de sa peine en appel en 2025 à quinze ans. Le texte ne mentionne pas sa religion; il le classe dans les catégories « Musulmans mauritaniens » et « Critiques de l'islamisme »."
  ur: "محمد اولد عبدالعزیز پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1956 میں اکجوجٹ میں ان کی پیدائش، 2005 کی بغاوت میں ان کا اہم کردار اور 2008 کی بغاوت میں ان کی قیادت، ہائی کونسل آف سٹیٹ کی سربراہی اور پھر صدارت (2009-2019)، افریقی یونین کی ان کی چیئرمین شپ (2014-2015)، اور پھر ان پر کرپشن کے الزامات، 2014-2015 کے الزامات کا ذکر ہے۔ 2025 میں اپیل پر اس کی سزا پندرہ سال تک۔ اس کا متن اس کے مذہب کے بارے میں کچھ نہیں کہتا۔ اس نے اسے موریطانیہ کے مسلمانوں اور اسلامیات کے ناقدین کے تحت فائل کیا ہے۔"
  tr: "Mohamed Ould Abdel Aziz hakkında İngilizce Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılmıştır. 1956'da Akjoujt'taki doğumunu, 2005 darbesindeki rolünü, 2008 darbesindeki liderliğini, Yüksek Devlet Konseyi başkanlığını, ardından ülke başkanlığını (2009–2019), Afrika Birliği başkanlığını (2014–2015), yolsuzluk suçlaması, hapis cezası ve 2023'te mahkumiyetini, 2025'te temyizde on beş yıla çıkarılmasını anlatır. Metinde dini belirtilmemektedir; onu \"Moritanya Müslümanları\" ve \"İslamcı eleştirmenler\" olarak sınıflandırmaktadır."
  id: "Artikel Wikipedia bahasa Inggris tentang Mohamed Ould Abdel Aziz hanya digunakan untuk fakta entitas tersebut. Artikel ini menceritakan kelahirannya di Akjoujt pada tahun 1956, perannya dalam kudeta 2005, kepemimpinannya dalam kudeta 2008, kepresidenannya di Dewan Tinggi Negara, kemudian kepresidenannya di negara (2009–2019), kepresidenannya di Uni Afrika (2014–2015), kemudian tuduhan korupsi, penahanannya, dan vonis pada tahun 2023, dengan hukuman yang diajukan banding pada tahun 2025 hingga lima belas tahun. Teksnya tidak menyebutkan agamanya; ia mengklasifikasikannya sebagai \"Muslim Mauritania\" dan \"kritikus Islamis.\""
