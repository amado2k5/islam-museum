reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It gives him as c. 1769–1794, the last Zand ruler from 1789 to 1794 and the son of Jafar Khan, whose poisoning brought him to the throne; his loss of Shiraz through Haji Ibrahim's betrayal, the defence of Kerman, his betrayal by the ruler of Bam, and his blinding, imprisonment and death by strangling at Tehran in late 1794; his tomb is in the Imamzadeh Zeyd in Tehran's old bazaar. The text names no birthplace and no religion or legal school for the man himself. Checked 1 November 2026."
