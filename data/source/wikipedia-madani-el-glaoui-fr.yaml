summary:
  ar: "مقالة ويكيبيديا الفرنسية عن المدني الكلاوي ⁦(1860 أو 1866 – 14 أغسطس 1918 بمراكش)⁩، القائد المخزني الذي دعم الحفيظية وصار الصدر الأعظم؛ تذكر برنامجه السياسي المتضمن الدفاع عن الدين، ولا تنسب إليه مدرسة دينية."
  en: "The French Wikipedia article on Madani El Glaoui (1860 or 1866 – 14 August 1918 at Marrakech), the Makhzen caid who backed the Hafidiya and became Grand Vizier; it records his political programme of defending religion and names no religious school for him."
  es: "El artículo de la Wikipedia en francés sobre Madani El Glaoui (1860 o 1866 – 14 de agosto de 1918 en Marrakech), el caid del Majzén que apoyó a los Hafidiya y se convirtió en Gran Visir, recoge su programa político de defensa de la religión y no menciona ninguna escuela religiosa a la que pertenezca."
  fr: "L'article de Wikipédia en français sur Madani El Glaoui (1860 ou 1866 – 14 août 1918 à Marrakech), le caïd Makhzen qui a soutenu la Hafidiya et est devenu Grand Vizir; il relate son programme politique de défense de la religion et ne cite aucune école religieuse à son sujet."
  ur: "مدنی ال گلوئی ⁦(1860 یا 1866 - 14 اگست 1918 مراکیچ)⁩ پر فرانسیسی ویکیپیڈیا کا مضمون، مخزن سردار جس نے حفیدیہ کی حمایت کی اور وزیر اعظم بن گئے۔ اس میں مذہب کے دفاع کے ان کے سیاسی پروگرام کو ریکارڈ کیا گیا ہے اور اس کے لیے کسی مذہبی اسکول کا نام نہیں لیا گیا ہے۔"
