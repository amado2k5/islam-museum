summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن علي حاجي الأكوشي؛ تُستخدم لوقائع الكيان فقط. تعطي مولده سنة 1847 في أكوشا ووفاته في 8 أبريل 1930، ودراسته عند الشيخ الطريقي عبد الرحمن حاجي السوغوري، وأنه كان له مريدون (تذكر مريدا له بالاسم وتنقله مع 500 مريد)، وانتخابه شيخا للإسلام سنة 1918، وترؤسه مجلس الدفاع عن شمال القوقاز وداغستان، ولقاءه المشترك مع أوزون حاجي للتخطيط للانتفاضة ضد القوات البيضاء."
  en: "English Wikipedia article on Ali-Hajji of Akusha; used for entity facts only. It gives his birth in 1847 at Akusha and his death on 8 April 1930, his study under the tariqa sheikh Abdurrahman-Hajji as-Suguri, his murids (it names one murid and has him travel with 500 murids), his election as shaykh al-Islam in 1918, his chairmanship of the Security Council of the Northern Caucasus and Dagestan, and his joint planning of the anti-White insurgency with Uzun-Hajji."
