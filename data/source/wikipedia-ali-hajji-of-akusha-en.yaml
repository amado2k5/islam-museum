summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن علي حاجي الأكوشي؛ تُستخدم لوقائع الكيان فقط. تعطي مولده سنة 1847 في أكوشا ووفاته في 8 أبريل 1930، ودراسته عند الشيخ الطريقي عبد الرحمن حاجي السوغوري، وأنه كان له مريدون ⁦(تذكر مريدا له بالاسم وتنقله مع 500 مريد)⁩، وانتخابه شيخا للإسلام سنة 1918، وترؤسه مجلس الدفاع عن شمال القوقاز وداغستان، ولقاءه المشترك مع أوزون حاجي للتخطيط للانتفاضة ضد القوات البيضاء."
  en: "English Wikipedia article on Ali-Hajji of Akusha; used for entity facts only. It gives his birth in 1847 at Akusha and his death on 8 April 1930, his study under the tariqa sheikh Abdurrahman-Hajji as-Suguri, his murids (it names one murid and has him travel with 500 murids), his election as shaykh al-Islam in 1918, his chairmanship of the Security Council of the Northern Caucasus and Dagestan, and his joint planning of the anti-White insurgency with Uzun-Hajji."
  es: "Artículo de la Wikipedia en inglés sobre Ali-Hajji de Akusha; utilizado únicamente para datos sobre la persona. Menciona su nacimiento en 1847 en Akusha y su muerte el 8 de abril de 1930, sus estudios bajo la tariqa del jeque Abdurrahman-Hajji as-Suguri, sus murids (nombra a un murid y dice que viajó con 500 murids), su elección como shaykh al-Islam en 1918, su presidencia del Consejo de Seguridad del Cáucaso Norte y Daguestán, y su planificación conjunta de la insurgencia antiblanca con Uzun-Hajji."
  fr: "Article de Wikipédia en anglais sur Ali-Hajji d'Akusha; utilisé uniquement pour les informations sur l'entité. Il indique sa naissance en 1847 à Akusha et sa mort le 8 avril 1930, ses études auprès du cheikh de la tariqa Abdurrahman-Hajji as-Suguri, ses disciples (il nomme un disciple et précise qu'il voyageait avec 500 disciples), son élection comme cheikh al-Islam en 1918, sa présidence du Conseil de sécurité du Caucase du Nord et du Daghestan, et sa participation conjointe à la planification de l'insurrection anti-blanche avec Uzun-Hajji."
  ur: "اکوشہ کے علی حاجی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ان کی پیدائش 1847 میں اکوشا میں ہوئی اور ان کی وفات 8 اپریل 1930 کو ہوئی، طریقت شیخ عبدالرحمن حججی السگوری کے زیر مطالعہ ان کے مریدین ⁦(اس میں ایک مرید کا نام ہے اور اس نے 500 مریدوں کے ساتھ سفر کرایا ہے)⁩، 1918 میں شیخ الاسلام کے طور پر ان کا انتخاب اور شمالی کاسان کا سلامتی کونسل کا چیئرمین اور ان کا عہدہ سنبھالا۔ عزون-حاجی کے ساتھ سفید فام مخالف شورش کی اس کی مشترکہ منصوبہ بندی۔"
