summary:
  ar: "مقالة ويكيبيديا العربية عن محمد زكريا الكاندهلوي المدني، شيخ الحديث بالهند؛ تعطي مولده بـ11 ليلة خلت من رمضان 1315هـ / 2 شباط 1898م في كاندهلة، وتذكر انتقاله إلى كنكوه ثم سهارانبور مع والده سنة 1328هـ، وقراءته الحديث على والده ثم صحيح البخاري وسنن الترمذي على خليل أحمد السهارنفوري، ولزومه شيخه خليل أحمد الذي أجازه إجازة عامة وخلّفه، ومساعدته له في «بذل المجهود»، ومجاورته في آخر حياته المدينة المنورة."
  en: "The Arabic Wikipedia article on Muhammad Zakariya Kandhlawi al-Madani, Shaykh al-Hadith of India; it gives his birth as the night of 11 Ramadan 1315 AH / 2 February 1898 at Kandhla, records his moves to Gangoh and then, in 1328 AH, to Saharanpur with his father, his reading of hadith under his father and then of Sahih al-Bukhari and Sunan al-Tirmidhi under Khalil Ahmad Saharanpuri, his keeping to his shaykh Khalil Ahmad, who granted him a general ijaza and made him his khalifa, his assistance on Badhl al-Majhud, and his residence in Medina at the end of his life."
title: "محمد زكريا الكاندهلوي"
