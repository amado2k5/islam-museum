summary:
  ar: "مقالة ويكيبيديا العربية عن محمد زكريا الكاندهلوي المدني، شيخ الحديث بالهند؛ تعطي مولده بـ11 ليلة خلت من رمضان 1315هـ / 2 شباط 1898م في كاندهلة، وتذكر انتقاله إلى كنكوه ثم سهارانبور مع والده سنة 1328هـ، وقراءته الحديث على والده ثم صحيح البخاري وسنن الترمذي على خليل أحمد السهارنفوري، ولزومه شيخه خليل أحمد الذي أجازه إجازة عامة وخلّفه، ومساعدته له في «بذل المجهود»، ومجاورته في آخر حياته المدينة المنورة."
  en: "The Arabic Wikipedia article on Muhammad Zakariya Kandhlawi al-Madani, Shaykh al-Hadith of India; it gives his birth as the night of 11 Ramadan 1315 AH / 2 February 1898 at Kandhla, records his moves to Gangoh and then, in 1328 AH, to Saharanpur with his father, his reading of hadith under his father and then of Sahih al-Bukhari and Sunan al-Tirmidhi under Khalil Ahmad Saharanpuri, his keeping to his shaykh Khalil Ahmad, who granted him a general ijaza and made him his khalifa, his assistance on Badhl al-Majhud, and his residence in Medina at the end of his life."
  es: "El artículo de Wikipedia en árabe sobre Muhammad Zakariya Kandhlawi al-Madani, Shaykh al-Hadith de la India, indica que nació la noche del 11 de Ramadán de 1315 AH / 2 de febrero de 1898 en Kandhla, registra sus traslados a Gangoh y luego, en 1328 AH, a Saharanpur con su padre, su lectura de hadices bajo la tutela de su padre y luego de Sahih al-Bukhari y Sunan al-Tirmidhi bajo Khalil Ahmad Saharanpuri, su permanencia con su shaykh Khalil Ahmad, quien le otorgó una ijaza general y lo nombró su califa, su asistencia en Badhl al-Majhud y su residencia en Medina al final de su vida."
  fr: "L'article de Wikipédia en arabe sur Muhammad Zakariya Kandhlawi al-Madani, Shaykh al-Hadith de l'Inde, indique sa naissance dans la nuit du 11 Ramadan 1315 AH / 2 février 1898 à Kandhla, relate ses déplacements à Gangoh puis, en 1328 AH, à Saharanpur avec son père, son apprentissage du hadith auprès de son père puis du Sahih al-Bukhari et du Sunan al-Tirmidhi auprès de Khalil Ahmad Saharanpuri, sa fidélité à son cheikh Khalil Ahmad, qui lui accorda une ijaza générale et le nomma son khalifa, son aide lors de la bataille de Badhl al-Majhud et sa résidence à Médine à la fin de sa vie."
  ur: "عربی ویکیپیڈیا مضمون محمد زکریا کاندھلوی المدنی، شیخ الحدیث ہند؛ اس کی پیدائش 11 رمضان 1315 ہجری / 2 فروری 1898 کی رات کاندھلہ میں ہوئی، اس کی گنگوہ اور پھر 1328 ہجری میں اپنے والد کے ساتھ سہارنپور کی طرف نقل و حرکت ریکارڈ کی گئی، اس نے اپنے والد کے پاس حدیث پڑھی اور پھر صحیح البخاری اور سنن الترمذی کو اپنے خلیل احمد، خلیل احمد، احمد شیخ کے ماتحت رکھا۔ آپ نے انہیں عام اعجاز عطا کیا اور انہیں اپنا خلیفہ بنایا، بدہل المجھود پر ان کی معاونت اور زندگی کے آخر میں مدینہ میں ان کی رہائش کا انتظام کیا۔"
  tr: "Hindistan'daki hadis şeyhi Muhammed Zekeriye el-Kandhalvi el-Medeni hakkında Arapça Vikipedi makalesi, Ramazan 1315 Hicri / 2 Şubat 1898 tarihinde Kandhala'da doğduğunu belirtir. 1328 Hicri'de babasıyla birlikte Kankoh'a, ardından Saharanpur'a taşınmasını, babasının yanında hadis okumasını, ardından Sahih al-Buhari'yi ve Halil Ahmed el-Saharfuri döneminde Sunan al-Tirmidhi'yi okumasını ve öğretmeni Halil Ahmed'e bağlılığını; kendisine genel bir icazah verip yerine geçen, 'çaba göstermesi'nde yardım ettiği ve hayatının son günlerinde Medine'de yanında olduğu belirtilir."
  id: "Artikel Wikipedia berbahasa Arab tentang Muhammad Zakariya Al-Kandhalwi Al-Madani, Sheikh Hadis di India, menyebutkan kelahirannya 11 malam sebelum Ramadan 1315 H / 2 Februari 1898 M, di Kandhala. Artikel tersebut menyebutkan kepindahannya ke Kankoh, lalu Saharanpur bersama ayahnya pada tahun 1328 H, pembacaan hadis di bawah ayahnya, kemudian Sahih al-Bukhari dan Sunan al-Tirmidhi di bawah Khalil Ahmad al-Saharfuri, serta kesetiaannya kepada gurunya Khalil Ahmad, yang memberinya ijazah umum dan menggantikannya, membantunya 'berusaha,' dan berada di dekatnya di hari-hari terakhir hidupnya di Madinah."
