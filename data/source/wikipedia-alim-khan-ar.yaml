summary:
  ar: "مقالة ويكيبيديا العربية عن الأمير محمد عالم خان، آخر أمراء بخارى من سلالة منغيط؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 3 يناير 1880 ووفاته في كابل في 28 أبريل 1944، وتصنيفاتها تضعه في مواليد 1297 هـ ووفيات 1363 هـ."
  en: "Arabic Wikipedia article on Amir Muhammad Alim Khan, last Emir of Bukhara of the Manghit dynasty; used for entity facts only. It gives his birth on 3 January 1880 and his death at Kabul on 28 April 1944, and its categories file him under births of 1297 AH and deaths of 1363 AH."
  es: "Artículo en árabe de la Wikipedia sobre Amir Muhammad Alim Khan, último emir de Bujará de la dinastía Manghit; se utiliza únicamente para datos biográficos. Indica que nació el 3 de enero de 1880 y falleció en Kabul el 28 de abril de 1944, y lo ubica en las categorías de nacimientos de 1297 AH y fallecimientos de 1363 AH."
  fr: "Article de Wikipédia en arabe sur Amir Muhammad Alim Khan, dernier émir de Boukhara de la dynastie Manghit; utilisé uniquement à des fins d'information sur l'entité. Il indique sa naissance le 3 janvier 1880 et son décès à Kaboul le 28 avril 1944, et le classe parmi les naissances de 1297 AH et les décès de 1363 AH."
  ur: "منگھیت خاندان کے بخارا کے آخری امیر امیر محمد علیم خان پر عربی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی ولادت 3 جنوری 1880 اور وفات 28 اپریل 1944 کو کابل میں ہوئی ہے اور اس کے زمرے میں ان کی پیدائش 1297 ہجری اور وفات 1363 ہجری ہے۔"
  tr: "Manghit hanedanından Buhara prensi Prens Muhammed Alam Han hakkında Arapça Vikipedi makalesi; sadece varlığın gerçekleri için kullanılır. 3 Ocak 1880'de doğduğu ve 28 Nisan 1944'te Kabil'de öldüğü belirtilir; sınıflandırmaları onu 1297 Hicri doğumlu ve 1363 H yılında ölmüştür."
  id: "Artikel Wikipedia bahasa Arab tentang Pangeran Muhammad Alam Khan, pangeran terakhir Bukhara dari dinasti Manghit; hanya digunakan untuk fakta entitas. Ia disebutkan lahir pada 3 Januari 1880, dan meninggal di Kabul pada 28 April 1944, dan klasifikasinya menempatkannya lahir pada tahun 1297 H dan meninggal pada 1363 H."
