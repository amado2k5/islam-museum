summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محيي الدين ياسين (وُلد 1947)؛ تُستخدم لوقائع الكيان فقط. تروي مولده في موار بجوهر في 15 مايو 1947 باسم محيي الدين بن محمد ياسين، ورئاسته لحكومة جوهر (1986–1995) ونيابته لرئاسة الوزراء، وإقصاءه من أمنو لانتقاده فضيحة 1MDB، ورئاسته الثامنة لوزراء ماليزيا (مارس 2020 – أغسطس 2021) في جائحة كوفيد-19."
  en: "English Wikipedia article on Muhyiddin Yassin (born 1947); used for entity facts only. It recounts his birth at Muar, Johor, on 15 May 1947 as Mahiaddin bin Md. Yasin, his Johor chief ministership (1986–1995) and deputy premiership, his removal and expulsion from UMNO over his criticism of the 1MDB scandal, and his tenure as Malaysia's eighth prime minister (March 2020 – August 2021) through the COVID-19 pandemic."
