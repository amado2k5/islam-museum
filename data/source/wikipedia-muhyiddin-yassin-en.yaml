summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محيي الدين ياسين ⁦(وُلد 1947)⁩؛ تُستخدم لوقائع الكيان فقط. تروي مولده في موار بجوهر في 15 مايو 1947 باسم محيي الدين بن محمد ياسين، ورئاسته لحكومة جوهر (1986–1995) ونيابته لرئاسة الوزراء، وإقصاءه من أمنو لانتقاده فضيحة 1MDB، ورئاسته الثامنة لوزراء ماليزيا ⁦(مارس 2020 – أغسطس 2021)⁩ في جائحة كوفيد-19."
  en: "English Wikipedia article on Muhyiddin Yassin (born 1947); used for entity facts only. It recounts his birth at Muar, Johor, on 15 May 1947 as Mahiaddin bin Md. Yasin, his Johor chief ministership (1986–1995) and deputy premiership, his removal and expulsion from UMNO over his criticism of the 1MDB scandal, and his tenure as Malaysia's eighth prime minister (March 2020 – August 2021) through the COVID-19 pandemic."
  es: "Artículo de la Wikipedia en inglés sobre Muhyiddin Yassin (nacido en 1947); utilizado únicamente para datos sobre la persona. Relata su nacimiento en Muar, Johor, el 15 de mayo de 1947 como Mahiaddin bin Md. Yasin, su mandato como primer ministro de Johor (1986-1995) y viceprimer ministro, su destitución y expulsión de la UMNO por sus críticas al escándalo de 1MDB, y su mandato como octavo primer ministro de Malasia (marzo de 2020 - agosto de 2021) durante la pandemia de COVID-19."
  fr: "Article de Wikipédia en anglais sur Muhyiddin Yassin (né en 1947); utilisé uniquement à des fins d'information sur l'entité. Il relate sa naissance à Muar, Johor, le 15 mai 1947 sous le nom de Mahiaddin bin Md. Yasin, son mandat de ministre en chef de Johor (1986-1995) et de vice-premier ministre, son exclusion de l'UMNO suite à ses critiques du scandale 1MDB, et son mandat de huitième Premier ministre de Malaisie (mars 2020 – août 2021) pendant la pandémie de COVID-19."
