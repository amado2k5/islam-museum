summary:
  ar: "مقالة ويكيبيديا الروسية عن أوزون حاجي السالطي؛ تُستخدم لوقائع الكيان فقط. ينص متنها على أنه كان مريدًا للشيخ عبد الرحمن حاجي من سوغراتل وتلقى منه الإجازة للمشيخة بعد أحد عشر عامًا من الدراسة، وتذكر وفاته في 30 مارس 1920."
  en: "Russian Wikipedia article on Uzun-Haji Saltinsky; used for entity facts only. Its text states that he was a murid of Sheikh Abdurrahman-Hajji of Sogratl and received from him authorisation for sheikhdom after eleven years of study, and gives his death on 30 March 1920."
  es: "Artículo de la Wikipedia rusa sobre Uzun-Haji Saltinsky; utilizado únicamente para obtener información sobre la persona. Su texto indica que fue discípulo del jeque Abdurrahman-Hajji de Sogratl y que recibió de él la autorización para el jeque tras once años de estudio, y señala su fallecimiento el 30 de marzo de 1920."
  fr: "Article de Wikipédia en russe sur Uzun-Haji Saltinsky; utilisé uniquement à titre informatif. Le texte indique qu'il était un disciple du cheikh Abdurrahman-Hajji de Sogratl et qu'il reçut de lui l'autorisation d'accéder à la cheikherie après onze années d'études. Il mentionne également sa mort le 30 mars 1920."
