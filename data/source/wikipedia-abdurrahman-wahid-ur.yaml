summary:
  ar: "مقالة ويكيبيديا الأردية عن عبد الرحمن وحيد؛ تُستخدم لوقائع الكيان فقط. سيرة مختصرة تذكر مولده في جومبانغ سنة 1940 وترؤسه نهضة العلماء ورئاسته ووفاته في جاكرتا سنة 2009."
  en: "Urdu Wikipedia article on Abdurrahman Wahid; used for entity facts only. A shorter biography giving his birth at Jombang in 1940, his NU chairmanship, his presidency and his death at Jakarta in 2009."
  es: "Artículo de Wikipedia en urdu sobre Abdurrahman Wahid; utilizado únicamente para datos sobre la persona. Una biografía más breve que detalla su nacimiento en Jombang en 1940, su presidencia del NU, su presidencia y su fallecimiento en Yakarta en 2009."
  fr: "Article Wikipédia en ourdou sur Abdurrahman Wahid; utilisé uniquement à des fins d'information sur l'entité. Une biographie plus courte retrace sa naissance à Jombang en 1940, sa présidence de la Nahdlatul Ulama, sa présidence de l'Union nationale des étudiants (NU) et son décès à Jakarta en 2009."
  ur: "عبدالرحمن واحد پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ 1940 میں جومبنگ میں ان کی پیدائش، ان کی NU کی چیئرمین شپ، ان کی صدارت اور 2009 میں جکارتہ میں ان کی موت کے بارے میں ایک مختصر سوانح حیات۔"
  tr: "Abdul Rahman Wahid hakkında Urduca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1940'ta Jumbang'daki doğumundan, Nahdlatul Ulama liderliğinden, cumhurbaşkanlığından ve 2009'da Jakarta'daki ölümünden bahseden kısa bir biyografi."
  id: "Artikel Wikipedia Urdu tentang Abdul Rahman Wahid; digunakan hanya untuk fakta entitas. Biografi singkat yang menyebutkan kelahirannya di Jumbang pada tahun 1940, kepemimpinannya di Nahdlatul Ulama, kepresidenannya, dan kematiannya di Jakarta pada tahun 2009."
