reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). A long article. It gives her birth on 15 February 1638 at Daulatabad and her death on 26 May 1702 at Delhi, her memorisation of the Quran by the age of seven, her learning under Hafiza Mariam and Ashraf Mazandarani, her library and her patronage of scholars and translators, her pen name Makhfi and the works attached to her name, and her imprisonment at Salimgarh Fort for the last twenty years of her life; it also records that conflicting sources give her death year alternately as 1701 and 1702, a rivalry preserved in the person record. Its infobox files her religion as Sunni Islam; an infobox is not a text and the person record's faith settlement does not rest on it. The article's Sufi material — the Sufi idiom of her verse and a quoted travel account linking her imprisonment to her Sufi sympathies — attests inclination and poetic content, not initiation or discipleship. Checked 1 November 2026."
