reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. A short article with a full discography. It gives Ali Ibrahim 'Farka' Touré, born 31 October 1939, died 7 March 2006 (agreeing with the French article against the English article's 6 March); Rolling Stone's ranking of 76th among the hundred greatest guitarists; Talking Timbuktu (1994) with Ry Cooder and the first Grammy; and In the Heart of the Moon with Toumani Diabaté and the second Grammy. The article states no religion for him."
