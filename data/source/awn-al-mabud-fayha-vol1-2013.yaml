summary:
  ar: "الجزء الأول من طبعة دار الفيحاء بدمشق، الطبعة الثانية، يضم الأحاديث من 1 إلى 339 من كتاب الطهارة، مع مقدمة المحقق عن السنن ومنهج الشرح."
  en: "Provided by the founder, authorized 31 Oct 2026 (docs/delegation/founder-provided-books.md). Volume one of the Dar al-Fayha printing (Damascus, 2nd ed.), covering hadiths 1 to 339 of the Book of Purification, with the editor's introduction on the Sunan and the method of the commentary."
  es: "Proporcionado por el fundador, autorizado el 31 de octubre de 2026 (docs/delegation/founder-provided-books.md). Volumen uno de la edición impresa de Dar al-Fayha (Damasco, 2.ª ed.), que abarca los hadices 1 al 339 del Libro de la Purificación, con la introducción del editor sobre el Sunan y el método de comentario."
  fr: "Fourni par le fondateur, autorisé le 31 octobre 2026 (docs/delegation/founder-provided-books.md). Volume un de l'édition Dar al-Fayha (Damas, 2e édition), couvrant les hadiths 1 à 339 du Livre de la Purification, avec l'introduction de l'éditeur sur les Sunan et la méthode de commentaire."
  ur: "بانی کی طرف سے فراہم کردہ، 31 اکتوبر 2026 کو اختیار شدہ (docs/delegation/founder-provided-books.md)۔ دار الفیحہ طباعت کی ایک جلد ⁦(دمشق، دوسرا ایڈیشن)⁩، کتاب طہارت کی احادیث 1 سے 339 تک، سنن پر مدیر کے تعارف اور تفسیر کے طریقہ کے ساتھ۔"
  tr: "Şam'daki Dar Al-Fayha' baskısının ikinci baskısının ilk bölümü, Arınma Kitabı'nın 1'den 339'a kadar olan hadisleri, editörün Sünen ve açıklama metodolojisi üzerine girişini içerir."
  id: "Bagian pertama edisi Dar Al-Fayha di Damaskus, edisi kedua, memuat hadits dari 1 hingga 339 Kitab Penyucian, dengan pengantar oleh editor tentang Sunan dan metodologi penjelasannya."
