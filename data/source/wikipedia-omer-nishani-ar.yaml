reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. A short article. It gives his dates (5 February 1887 – 26 May 1954), his foreign ministership from 22 October 1944 to 22 March 1946, his chairmanship of the Presidium of the People's Republic from 16 March 1946 to 1 August 1953, his forced resignation on 24 July 1953 'for health reasons', his succession by Haxhi Lleshi, and that the autopsy concluded suicide while later reports indicate he was shot. It states nothing about his religion."
