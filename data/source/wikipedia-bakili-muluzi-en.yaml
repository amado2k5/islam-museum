summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن باكيلي مولوزي؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في ماشينغا سنة 1943 وعمله في حكومة باندا ثم قيادته المعارضة، وفوزه بانتخابات 1994 منهيًا حكم باندا وإعادة انتخابه سنة 1999، ومحاولة الولاية الثالثة، وفضيحة احتياطي الذرة، واعتقالاته وتهم الفساد، ومنعه من الترشح سنة 2009 وتقاعده من السياسة. يسميه متنها أول رئيس مسلم لمالاوي، دون مدرسة."
  en: "English Wikipedia article on Bakili Muluzi; used for entity facts only. It recounts his birth at Machinga in 1943, his years in Banda's government and then in opposition leadership, his 1994 election victory ending Banda's rule and his 1999 re-election, the third-term attempt, the maize-reserve scandal, his arrests and corruption charges, his barring from the 2009 race, and his retirement from politics. Its text calls him Malawi's first Muslim president and names no school."
  es: "Artículo de la Wikipedia en inglés sobre Bakili Muluzi; utilizado únicamente para datos sobre la persona. Relata su nacimiento en Machinga en 1943, sus años en el gobierno de Banda y posteriormente en la oposición, su victoria electoral en 1994 que puso fin al mandato de Banda y su reelección en 1999, su intento de obtener un tercer mandato, el escándalo de las reservas de maíz, sus arrestos y acusaciones de corrupción, su exclusión de las elecciones de 2009 y su retiro de la política. El texto lo describe como el primer presidente musulmán de Malawi y no menciona ninguna escuela."
  fr: "Article Wikipédia en anglais sur Bakili Muluzi; utilisé uniquement à des fins d'information sur l'entité. Il relate sa naissance à Machinga en 1943, ses années au sein du gouvernement de Banda puis à la tête de l'opposition, sa victoire électorale de 1994 qui mit fin au règne de Banda et sa réélection en 1999, sa tentative de briguer un troisième mandat, le scandale des réserves de maïs, ses arrestations et les accusations de corruption dont il fit l'objet, son exclusion de l'élection de 2009 et son retrait de la vie politique. Le texte le qualifie de premier président musulman du Malawi et ne mentionne aucune école."
