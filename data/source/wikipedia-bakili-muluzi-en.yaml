summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن باكيلي مولوزي؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في ماشينغا سنة 1943 وعمله في حكومة باندا ثم قيادته المعارضة، وفوزه بانتخابات 1994 منهيًا حكم باندا وإعادة انتخابه سنة 1999، ومحاولة الولاية الثالثة، وفضيحة احتياطي الذرة، واعتقالاته وتهم الفساد، ومنعه من الترشح سنة 2009 وتقاعده من السياسة. يسميه متنها أول رئيس مسلم لمالاوي، دون مدرسة."
  en: "English Wikipedia article on Bakili Muluzi; used for entity facts only. It recounts his birth at Machinga in 1943, his years in Banda's government and then in opposition leadership, his 1994 election victory ending Banda's rule and his 1999 re-election, the third-term attempt, the maize-reserve scandal, his arrests and corruption charges, his barring from the 2009 race, and his retirement from politics. Its text calls him Malawi's first Muslim president and names no school."
