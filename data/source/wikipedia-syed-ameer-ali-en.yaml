reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It gives: born 6 April 1849 at Cuttack, Orissa, fourth of five sons of Syed Saadat Ali (died 1856); 'The Shiite family traced its descent to Muhammad through his daughter Fatima from Imam Ali al-Rida, the eighth Shia Imam' — a statement about his FAMILY, which under the lane rule never counts alone for the man's own faith, and is weighed in the record only as part of the mapping context set out there; educated at Hooghly Mohsin College and Calcutta University (BA 1867, MA in history 1868, LLB 1869); London 1869–1873, Inner Temple, meeting Syed Ahmad Khan and Monomohun Ghose; returned 1873 and practised at the Calcutta High Court, lecturer in Islamic law at Presidency College; Bengal Legislative Council 1878; professor of law 1881; Governor-General's Legislative Council 1883; appointed to the Calcutta High Court bench in 1890; retired 1904 and settled in England with his wife Isabelle Ida Konstam, the first Muslim from India to reside there permanently by choice; founded the Central National Muhammedan Association in 1877 (the Encyclopedia of Religion entry gives 1878 and the Urdu article 1879 — variants recorded in the record), which grew to 34 branches and which he led for over twenty-five years; signatory of the 1906 Simla petition to Lord Minto and therefore a founding member of the All-India Muslim League; founded the London Muslim League in 1908 as an independent organisation; first Indian appointed to the Judicial Committee of the Privy Council, serving 1909–1928, styled 'The Right Honourable', and co-established the London Mosque Fund in 1910, where later the East London Mosque stands; his books A Critical Examination of the Life and Teachings of Mohammed (1873), The Personal Law of the Muhammedans (1880), The Spirit of Islam (1891; revised 1922, posthumous edition 1953), A Short History of the Saracens (1899), Islam (1906) and Mahommedan Law; it quotes D. S. Margoliouth's praise of The Spirit of Islam as having 'exercised a potent influence on the educated classes of the English-speaking world, wholly favourable to the faith it presents'. CONFLICTS inside the article: its lead says he died on 3 August 1928 at Rudgwick, Sussex (agreeing with Wikidata at day precision), while its early-life section says 'He died on August 4' — the record follows 3 August and records the variant."
