summary:
  ar: "«الإعلان الدستوري السوري، 13 مارس 2025»، كما يُنشر عند: وكالة سانا، وكالة الأنباء السورية الرسمية. العنوان ونص المادة 4 مأخوذان من ملخص بحثي زُوّد به المتحف، ولم يفتح المتحف الصفحة؛ وقد أجاز المؤسس استعمال النص كما ورد في 21 نوفمبر 2026."
  en: "Constitutional Declaration of Syria, 13 March 2025, as published at: SANA, the Syrian state news agency. The address and the wording of Article 4 come from a research summary supplied to the museum, and the museum did not open the page; the founder approved using the wording as supplied on 21 November 2026."
  ur: "Constitutional Declaration of Syria, 13 March 2025، جیسا کہ SANA, the Syrian state news agency پر شائع ہے۔ پتہ اور دفعہ 4 کی عبارت متحف کو فراہم کردہ ایک تحقیقی خلاصے سے لی گئی ہے، اور متحف نے صفحہ نہیں کھولا؛ بانی نے 21 نومبر 2026 کو عبارت کو جیسی ملی اسی طرح استعمال کرنے کی منظوری دی۔"
  fr: "Constitutional Declaration of Syria, 13 March 2025, tel que publié à : SANA, the Syrian state news agency. L'adresse et le texte (article 4) viennent d'un résumé de recherche remis au musée, et le musée n'a pas ouvert la page ; le fondateur a approuvé l'usage du texte tel que fourni le 21 novembre 2026."
  es: "Constitutional Declaration of Syria, 13 March 2025, tal como se publica en: SANA, the Syrian state news agency. La dirección y el texto (artículo 4) proceden de un resumen de investigación entregado al museo, y el museo no abrió la página; el fundador aprobó usar el texto tal como se entregó el 21 de noviembre de 2026."
  tr: "\"Suriye Anayasa Bildirisi, 13 Mart 2025,\" resmi Suriye haber ajansı SANA Ajansı'nda yayımlandığı üzere. 4. Maddenin başlığı ve metni, müze tarafından sağlanan bir araştırma özetinden alınmıştır ve müze sayfayı açmamıştır; kurucu metnin kullanımına 21 Kasım 2026'da belirtildiği şekilde izin vermiştir."
  id: "\"Deklarasi Konstitusi Suriah, 13 Maret 2025,\" sebagaimana diterbitkan di: SANA Agency, kantor berita resmi Suriah. Judul dan teks Pasal 4 diambil dari ringkasan penelitian yang disediakan oleh museum, dan museum tidak membuka halaman tersebut; pendiri mengizinkan penggunaan teks tersebut seperti yang dinyatakan pada 21 November 2026."
