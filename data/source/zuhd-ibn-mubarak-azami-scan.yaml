reliability_note: "The scan (590 PDF pages) has no title page; the edition is identified as Habib al-Rahman al-A'zami's from its apparatus (the editor refers to his introduction for the transmitters, collates a copy 'K' and an Alexandria copy of Nu'aym ibn Hammad's recension) and from Ahmad Farid's statement that al-A'zami edited the al-Marwazi recension (source/zuhd-ibn-mubarak-farid-1995-v1 p. 47); the Shamela item 20221013 in the same folder also names al-A'zami as editor. Printed page numbers in the OCR match the PDF pages ⁦(e.g. p. 293 bears '٢٩٣')⁩, so citations are both. OCR of names unverified against images."
