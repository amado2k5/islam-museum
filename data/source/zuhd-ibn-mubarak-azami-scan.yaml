summary:
  ar: "نسخة ممسوحة من نص «الزهد والرقائق» برواية الحسين بن الحسن المروزي عن ابن المبارك، بطريق يحيى بن صاعد، مقسومة على أجزاء الأصل المخطوط، مع حواشٍ تقابل النص بنسخة يرمز لها «ك» وتخرّج الآثار؛ تبدأ الصفحة الأولى بأول الكتاب بلا صفحة عنوان."
  en: "A scan of the text of al-Zuhd wa-l-Raqa'iq in the recension of al-Husayn ibn al-Hasan al-Marwazi from Ibn al-Mubarak, through Yahya ibn Sa'id, divided by the parts (ajza') of the manuscript, with footnotes collating a copy marked 'K' and tracing the reports; page 1 begins with the text, without a title page."
  ur: "ابن المبارک کی «الزہد والرقائق» کے متن کا اسکین، حسین بن حسن مروزی کی روایت سے، یحییٰ بن صاعد کے طریق سے، مخطوطے کے اجزا کے مطابق تقسیم، حواشی میں «ک» نامی نسخے سے مقابلہ اور آثار کی تخریج؛ پہلا صفحہ بغیر عنوان کے متن سے شروع ہوتا ہے۔"
