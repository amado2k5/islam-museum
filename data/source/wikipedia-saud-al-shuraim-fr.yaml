summary:
  ar: "مقالة ويكيبيديا الفرنسية عن سعود الشريم؛ تُستخدم لوقائع الكيان فقط. صندوقها يعطي تقليده «سني، حنبلي» وتلحق به قالب تصفح الحنبلية، ونصها موجز عن إمامته بالحرم."
  en: "French Wikipedia article on Saud Al-Shuraim; used for entity facts only. Its infobox gives his tradition as 'Sunnite, Hanbalite' and attaches the Hanbalism navbox; its text is a short account of his imamate of the Grand Mosque."
  es: "Artículo de la Wikipedia en francés sobre Saud Al-Shuraim; utilizado únicamente para obtener información sobre la persona. Su ficha informativa describe su tradición como «sunita, hanbalí» y adjunta el cuadro de navegación «hanbalismo»; su texto es un breve relato de su imamato de la Gran Mezquita."
  fr: "Article de Wikipédia en français sur Saoud al-Shuraim; utilisé uniquement pour les informations sur l'entité. Son infobox indique qu'il appartenait à la tradition « sunnite, hanbalite » et renvoie à l'encadré de navigation « hanbalisme »; son texte est un bref récit de son imamat de la Grande Mosquée."
  ur: "سعود الشریم پر فرانسیسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا معلوماتی خانہ اپنی روایت کو 'سنت، حنبلیت' کے طور پر دیتا ہے اور حنبلیت کے نام سے منسلک کرتا ہے۔ اس کا متن ان کی جامع مسجد کی امامت کا مختصر بیان ہے۔"
  tr: "Suud El-Şuraim hakkında Fransızca Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Kutusunda geleneği \"Sünni, Hanbali\" olarak belirtilmiş ve Haram'daki imamı hakkında kısa bir metinle birlikte bir Hanbali navigasyon şablonu eklenmiştir."
  id: "Artikel Wikipedia Prancis tentang Saud Al-Shuraim; digunakan hanya untuk fakta entitas. Kotaknya mencantumkan tradisinya sebagai \"Sunni, Hanbali\" dan melampirkan template navigasi Hanbali, dengan teks singkat tentang imamannya dalam Haram."
