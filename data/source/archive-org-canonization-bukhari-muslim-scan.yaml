reliability_note: "User-uploaded scan with OCR text. Its title and imprint pages give Islamic History and Civilization: Studies and Texts, vol. 69, edited by Wadad Kadi and Rotraud Wielandt; Brill, Leiden and Boston, 2007; ISBN 978 90 04 15839 9. The contents list two parts (Part One opens with an introduction and a chapter on the study of canons and canonization; Part Two is titled 'The Canon and the Needs of the Community'), and chapter one opens with Nizam al-Mulk in 465/1072-3. Only the front matter and the opening of chapter one were read. Read on 24 November 2026."
