summary:
  ar: "الصفحة «Musiqa al-Shir» — Internet Archive؛ لخّصها ملخص بحثي قدّمه المؤسس إلى المتحف في 21 نوفمبر 2026؛ لم يفتح المتحف الصفحة، ووافق المؤسس على استعمال الملخص دون إعادة تحقق. استُعملت في: كتاب «Musiqa al-Shir» ومؤلفه وتاريخه."
  en: "The page «Musiqa al-Shir» — Internet Archive; summarised in a research file supplied to the museum by the founder on 21 November 2026; the museum did not open the page, and the founder approved using the summary without re-verification. Used for: the book «Musiqa al-Shir»: its author and date."
  ur: "صفحہ «Musiqa al-Shir» — Internet Archive؛ اسے ایک تحقیقی فائل نے خلاصہ کیا جو بانی نے 21 نومبر 2026 کو میوزیم کو دی؛ میوزیم نے صفحہ نہیں کھولا اور بانی نے دوبارہ جانچ کے بغیر خلاصہ استعمال کرنے کی منظوری دی۔ استعمال: کتاب «Musiqa al-Shir»، اس کے مصنف اور تاریخ کا بیان۔"
  fr: "La page «Musiqa al-Shir» — Internet Archive ; résumée dans un fichier de recherche remis au musée par le fondateur le 21 novembre 2026 ; le musée n'a pas ouvert la page, et le fondateur a approuvé l'usage de la synthèse sans nouvelle vérification. Utilisée pour : le livre « Musiqa al-Shir » : son auteur et sa date."
  es: "La página «Musiqa al-Shir» — Internet Archive; resumida en un archivo de investigación entregado al museo por el fundador el 21 de noviembre de 2026; el museo no abrió la página, y el fundador aprobó usar el resumen sin volver a verificar. Usada para: el libro «Musiqa al-Shir»: su autor y su fecha."
  tr: "\"Musiqa al-Shir\" sayfası — İnternet Arşivi; kurucunun 21 Kasım 2026'da müzeye sunduğu bir araştırma özetiyle özetlenmiştir; müze sayfayı açmamış ve kurucu özeti yeniden doğrulama yapmadan kullanmayı kabul etmiştir. Kullanıldığı alanlar: \"Musiqa al-Shir\" kitabında, yazarı ve tarihçesi."
  id: "Halaman \"Musiqa al-Shir\" — Arsip Internet; dirangkum oleh ringkasan penelitian yang diajukan oleh pendiri ke museum pada 21 November 2026; museum tidak membuka halaman tersebut, dan pendiri setuju menggunakan ringkasan tersebut tanpa verifikasi ulang. Digunakan dalam: buku \"Musiqa al-Shir,\" penulisnya, dan sejarahnya."
