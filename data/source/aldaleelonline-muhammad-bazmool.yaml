summary:
  ar: "صفحة المؤلف محمد بازمول في موقع الدليل أونلاين، تجمع كتبه ومقالاته، منها «أخلاق الطبيب المسلم» و«إتحاف الأنام بشرح السنة وأحكامها» و«ليس من أصول الفقه» و«ليس من منهج السلف»."
  en: "The author page of Muhammad Bazmool on the Al-Daleel Online site, collecting his books and articles, among them 'Akhlaq al-Tabib al-Muslim', 'Ithaf al-Anam bi-Sharh al-Sunna', 'Laysa min Usul al-Fiqh' and 'Laysa min Manhaj al-Salaf'."
  es: "La página del autor de Muhammad Bazmool en el sitio Al-Daleel Online, que recopila sus libros y artículos, entre ellos 'Akhlaq al-Tabib al-Muslim', 'Ithaf al-Anam bi-Sharh al-Sunna', 'Laysa min Usul al-Fiqh' y 'Laysa min Manhaj al-Salaf'."
  fr: "La page de l'auteur de Muhammad Bazmool sur le site Al-Daleel Online, rassemblant ses livres et articles, parmi lesquels « Akhlaq al-Tabib al-Muslim », « Ithaf al-Anam bi-Sharh al-Sunna », « Laysa min Usul al-Fiqh » et « Laysa min Manhaj al-Salaf »."
  ur: "الدلیل آن لائن سائٹ پر محمد بازمول کے مصنف کا صفحہ، ان کی کتابوں اور مضامین کو جمع کرتا ہے، ان میں 'اخلاق الطب المسلم'، 'اتحاف الانعام بیشرح السنۃ'، 'لیصہ من اصول الفقہ' اور 'لیصہ من منہج السلف' شامل ہیں۔"
  tr: "Yazar Muhammad Bazmoul'un Al-Dalil Online web sitesindeki sayfası, \"Müslüman Doktorun Etiği,\" \"Ithaf al-Anam bi Sharh al-Sunnah wa Ahkam,\" \"Bu Fıkıh İlkelerinden Değildir\" ve \"Selef Metodolojisinden Değildir\" gibi kitaplarını ve makalelerini bir araya getiriyor."
  id: "Halaman penulis Muhammad Bazmoul di situs web Al-Dalil Online mengumpulkan buku dan artikelnya, termasuk \"Etika Dokter Muslim,\" \"Ithaf al-Anam bi Sharh al-Sunnah wa Ahkam,\" \"Ini Bukan dari Prinsip Yurisprudensi,\" dan \"Ini Bukan dari Metodologi Salaf.\""
