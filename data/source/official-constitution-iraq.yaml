  ar: "«دستور جمهورية العراق»، كما يُنشر عند: مجلس النواب العراقي. العنوان ونص المادة 4، الفقرة أولاً مأخوذان من ملخص بحثي زُوّد به المتحف، ولم يفتح المتحف الصفحة؛ وقد أجاز المؤسس استعمال النص كما ورد في 21 نوفمبر 2026."
  en: "Constitution of the Republic of Iraq, as published at: Council of Representatives of Iraq. The address and the wording of Article 4, first paragraph come from a research summary supplied to the museum, and the museum did not open the page; the founder approved using the wording as supplied on 21 November 2026."
  ur: "Constitution of the Republic of Iraq، جیسا کہ Council of Representatives of Iraq پر شائع ہے۔ پتہ اور دفعہ 4، پہلی شق کی عبارت متحف کو فراہم کردہ ایک تحقیقی خلاصے سے لی گئی ہے، اور متحف نے صفحہ نہیں کھولا؛ بانی نے 21 نومبر 2026 کو عبارت کو جیسی ملی اسی طرح استعمال کرنے کی منظوری دی۔"
  fr: "Constitution of the Republic of Iraq, tel que publié à : Council of Representatives of Iraq. L'adresse et le texte (article 4, premier paragraphe) viennent d'un résumé de recherche remis au musée, et le musée n'a pas ouvert la page ; le fondateur a approuvé l'usage du texte tel que fourni le 21 novembre 2026."
  es: "Constitution of the Republic of Iraq, tal como se publica en: Council of Representatives of Iraq. La dirección y el texto (artículo 4, primer apartado) proceden de un resumen de investigación entregado al museo, y el museo no abrió la página; el fundador aprobó usar el texto tal como se entregó el 21 de noviembre de 2026."
