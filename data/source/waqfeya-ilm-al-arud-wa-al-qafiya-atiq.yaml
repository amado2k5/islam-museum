summary:
  ar: "الصفحة «Ilm al-Arud wa-l-Qafiya» — Waqfeya؛ لخّصها ملخص بحثي قدّمه المؤسس إلى المتحف في 21 نوفمبر 2026؛ لم يفتح المتحف الصفحة، ووافق المؤسس على استعمال الملخص دون إعادة تحقق. استُعملت في: كتاب «Ilm al-Arud wa-l-Qafiya» ومؤلفه وتاريخه."
  en: "The page «Ilm al-Arud wa-l-Qafiya» — Waqfeya; summarised in a research file supplied to the museum by the founder on 21 November 2026; the museum did not open the page, and the founder approved using the summary without re-verification. Used for: the book «Ilm al-Arud wa-l-Qafiya»: its author and date."
  ur: "صفحہ «Ilm al-Arud wa-l-Qafiya» — Waqfeya؛ اسے ایک تحقیقی فائل نے خلاصہ کیا جو بانی نے 21 نومبر 2026 کو میوزیم کو دی؛ میوزیم نے صفحہ نہیں کھولا اور بانی نے دوبارہ جانچ کے بغیر خلاصہ استعمال کرنے کی منظوری دی۔ استعمال: کتاب «Ilm al-Arud wa-l-Qafiya»، اس کے مصنف اور تاریخ کا بیان۔"
  fr: "La page «Ilm al-Arud wa-l-Qafiya» — Waqfeya ; résumée dans un fichier de recherche remis au musée par le fondateur le 21 novembre 2026 ; le musée n'a pas ouvert la page, et le fondateur a approuvé l'usage de la synthèse sans nouvelle vérification. Utilisée pour : le livre « Ilm al-Arud wa-l-Qafiya » : son auteur et sa date."
  es: "La página «Ilm al-Arud wa-l-Qafiya» — Waqfeya; resumida en un archivo de investigación entregado al museo por el fundador el 21 de noviembre de 2026; el museo no abrió la página, y el fundador aprobó usar el resumen sin volver a verificar. Usada para: el libro «Ilm al-Arud wa-l-Qafiya»: su autor y su fecha."
  tr: "\"Ilm al-Arud wa-l-Qafiya\" sayfası — Waqfeya; kurucusunun 21 Kasım 2026'da müzeye sunduğu bir araştırma özetiyle özetlenmiştir; müze sayfayı açmamış ve kurucu özeti yeniden doğrulama yapmadan kullanmayı kabul etmiştir. Kullanıldığı alanlar: \"Ilm al-Arud wa-l-Qafiya\" kitabında, yazarı ve tarihçesi."
  id: "Halaman \"Ilm al-Arud wa-l-Qafiya\" — Waqfeya; dirangkum oleh ringkasan penelitian yang diserahkan oleh pendiri ke museum pada 21 November 2026; museum tidak membuka halaman tersebut, dan pendiri setuju menggunakan ringkasan tersebut tanpa verifikasi ulang. Digunakan dalam: buku \"Ilm al-Arud wa-l-Qafiya,\" penulisnya, dan sejarahnya."
