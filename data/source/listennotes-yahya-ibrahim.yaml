summary:
  ar: "قائمة Listen Notes لبودكاست مسلم سنترال الخاص بيحيى إبراهيم ⁦(أكثر من 700 حلقة منذ 2014)⁩؛ سيرتها المرفقة تذكر ولادته وتعليمه في كندا وأصوله المصرية وإقامته في بيرث، وحفظه القرآن في السادسة عشرة مع إجازة، وبدءه المحاضرات في السابعة عشرة ونشاطه المجتمعي منذ 1993."
  en: "The Listen Notes listing of Muslim Central's Yahya Ibrahim podcast (over 700 episodes since 2014); its attached biography records his Canadian birth and education, his Egyptian ancestry, his residence in Perth, his memorisation of the Qur'an at sixteen with an ijazah, his lecturing from seventeen and his community involvement since 1993."
  es: "La lista de Listen Notes del podcast de Yahya Ibrahim de Muslim Central (más de 700 episodios desde 2014); su biografía adjunta registra su nacimiento y educación en Canadá, su ascendencia egipcia, su residencia en Perth, su memorización del Corán a los dieciséis años con una ijazah, sus conferencias desde los diecisiete y su participación en la comunidad desde 1993."
  fr: "La liste des notes d'écoute du podcast Yahya Ibrahim de Muslim Central (plus de 700 épisodes depuis 2014); sa biographie jointe retrace sa naissance et son éducation au Canada, ses origines égyptiennes, sa résidence à Perth, sa mémorisation du Coran à seize ans avec une ijazah, ses conférences à partir de dix-sept ans et son implication communautaire depuis 1993."
  ur: "مسلم سینٹرل کے یحییٰ ابراہیم پوڈ کاسٹ کی لسٹنگ نوٹس ⁦(2014 سے 700 سے زیادہ اقساط)⁩؛ اس کے ساتھ منسلک سوانح عمری میں اس کی کینیڈا کی پیدائش اور تعلیم، اس کا مصری نسب، پرتھ میں اس کی رہائش، سولہ سال کی عمر میں قرآن مجید کا ایک اعجاز کے ساتھ حفظ، سترہ سال سے اس کا لیکچر اور 1993 سے اس کی کمیونٹی کی شمولیت کو ریکارڈ کیا گیا ہے۔"
