summary:
  ar: "مقالة ويكيبيديا العربية عن أبي بكر تفاوى باعليوه؛ مقالة قصيرة تُستخدم لوقائع الكيان فقط. تذكر ولادته في ديسمبر 1912 في مقاطعة باوتشي، وأسرته غيراوية الأب وفولانية الأم، ورئاسته وزراء نيجيريا حتى اغتياله سنة 1966."
  en: "Arabic Wikipedia article on Abubakar Tafawa Balewa, a short stub; used for entity facts only. It gives his birth in December 1912 in Bauchi province, his Gerawa father and Fulani mother, and his premiership of Nigeria until his assassination in 1966."
  es: "Artículo de Wikipedia en árabe sobre Abubakar Tafawa Balewa, un breve resumen; Se utiliza únicamente para hechos de entidades. Da su nacimiento en diciembre de 1912 en la provincia de Bauchi, su padre Gerawa y su madre Fulani, y su cargo de primer ministro de Nigeria hasta su asesinato en 1966."
  fr: "Article Wikipédia en arabe sur Abubakar Tafawa Balewa, un court bout; utilisé uniquement pour les faits d’entité. Il donne sa naissance en décembre 1912 dans la province de Bauchi, son père Gerawa et sa mère peule, et son poste de premier ministre du Nigeria jusqu'à son assassinat en 1966."
  ur: "ابوبکر تفوی بلیوا پر عربی ویکیپیڈیا کا مضمون، ایک مختصر سٹب؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس نے دسمبر 1912 میں صوبہ باچی میں جنم لیا، اس کے جیراوا والد اور فلانی والدہ، اور 1966 میں اس کے قتل تک نائیجیریا کی پریمیئر شپ۔"
  tr: "Abu Bakr, Tawawi Ba'aliyah hakkında Arapça Wikipedia makalesi; sadece varlığın gerçekleri için kullanılan kısa bir makale. Aralık 1912'de Bauchi Eyaleti'nde doğduğu ve ailesinin babası Fulani ile Gerawia'da olduğu ve 1966'daki suikastına kadar Nijerya Başbakanı olarak görev yaptığı belirtilir."
  id: "Artikel Wikipedia bahasa Arab tentang Abu Bakr, Tawawi Ba'aliyah; artikel singkat yang hanya digunakan untuk fakta entitas. Ia disebutkan lahir pada Desember 1912 di Provinsi Bauchi, dengan keluarganya adalah Gerawia dari ayah dan ibunya Fulani, serta sebagai Perdana Menteri Nigeria hingga pembunuhannya pada tahun 1966."
