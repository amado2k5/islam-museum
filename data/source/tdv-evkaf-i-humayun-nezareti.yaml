summary:
  ar: "مدخل «نظارة الأوقاف الهمايونية» في موسوعة TDV الإسلامية التركية. يصف النظارة التي أنشأها محمود الثاني سنة 1826 لجمع إدارة أوقاف السلاطين وذويهم في يد واحدة، ويفرّق بين التولية التي يتولاها المتولي والنظارة التي يتولاها الناظر، ثم يتتبع تفتيش الحرمين ودواوين الأوقاف السابقة، وما ضُم إلى النظارة، وجهازها في العاصمة والولايات، وما آل إليه مال الوقف حتى إلغاء وكالة الشريعة والأوقاف في 3 مارس 1924."
  en: "The TDV İslâm Ansiklopedisi entry on the Ottoman imperial ministry of waqfs. It describes the ministry Mahmud II set up in 1826 to gather the waqfs of the sultans and their households under one administration, distinguishes the trustee's management (tevliyet) from the nazir's supervision (nezaret), and follows the Haremeyn inspectorate and the earlier waqf offices, what was later joined to the ministry, its central and provincial machinery, and the fate of waqf revenue down to the abolition of the Şer'iyye ve Evkaf ministry on 3 March 1924."
