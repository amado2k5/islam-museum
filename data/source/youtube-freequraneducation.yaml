reliability_note: "The channel itself: a primary source for its work and reach, not for its operators' identity — its descriptions credit Darul Arqam Studio and its crowdfunding appeals (for example its LaunchGood campaign 'Teach 1.6 billion people how to read Quran Correctly') and name no person. Channel analytics mirrors give about 2 million subscribers and 283 million views in October 2026 and place the channel's profile in Indonesia; platform figures change constantly. The channel's initiators are named only by the 2019 Khalifa journal study registered separately. Checked 26 October 2026."
