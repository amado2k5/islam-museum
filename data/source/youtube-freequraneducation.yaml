summary:
  ar: "قناة «تعليم القرآن مجانًا» (FreeQuranEducation) على يوتيوب، قناة رسوم متحركة تعلّم قراءة القرآن للأطفال بمقاطع مصوَّرة مجانية بلا إعلانات، من إنتاج استوديو دار الأرقم؛ تنسب أوصاف مقاطعها العمل إلى الاستوديو ولا تسمّي شخصًا بعينه."
  en: "The FreeQuranEducation YouTube channel, an animated channel teaching children to read the Quran through free, advertisement-free illustrated videos, produced by Darul Arqam Studio; its video descriptions credit the studio and name no individual."
  es: "El canal de YouTube FreeQuranEducation, un canal de animación que enseña a los niños a leer el Corán a través de vídeos ilustrados gratuitos y sin publicidad, es producido por Darul Arqam Studio; en las descripciones de sus vídeos se menciona al estudio y no se nombra a ninguna persona en particular."
  fr: "La chaîne YouTube FreeQuranEducation, une chaîne animée qui enseigne aux enfants à lire le Coran grâce à des vidéos illustrées gratuites et sans publicité, est produite par Darul Arqam Studio; ses descriptions de vidéos mentionnent le studio et ne nomment aucun individu."
