  ur: "محمود احمدی نژاد پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا انفو باکس اس کا مذہب اسلام ⁦(بارہ شیعہ)⁩ دیتا ہے، اور اس کی تاریخ وفات اور موت کی جگہ خالی ہے۔"
  tr: "Mahmud Ahmedinejad hakkında Arapça Vikipedi makalesi; sadece varlığın gerçekleri için kullanılmıştır. Kutusunda dini \"İslam (On İki Şii)\" olarak yazılmış ve ölüm alanı boştur."
