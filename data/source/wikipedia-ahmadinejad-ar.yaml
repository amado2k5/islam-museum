summary:
  ar: "مقالة ويكيبيديا العربية عن محمود أحمدي نجاد؛ تُستخدم لوقائع الكيان فقط. يعطي صندوقها دينه «الإسلام ⁦(شيعة اثنا عشرية)⁩» وحقلا الوفاة فيه فارغان."
  en: "Arabic Wikipedia article on Mahmoud Ahmadinejad; used for entity facts only. Its infobox gives his religion as Islam (Twelver Shia), and its death-date and death-place fields are blank."
  es: "Artículo de Wikipedia en árabe sobre Mahmoud Ahmadinejad; se utiliza únicamente para obtener información sobre la persona. Su ficha informativa indica que su religión era el islam (chiita duodecimano), y los campos de fecha y lugar de fallecimiento están en blanco."
