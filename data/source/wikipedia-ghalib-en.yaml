  ar: "مقالة ويكيبيديا الإنجليزية عن غالب؛ تُستخدم لوقائع الكيان فقط. تروي حياته من ولادته في أغرة سنة 1797 إلى وفاته في دلهي سنة 1869، وتعيينه أستاذًا للشعر عند بهادر شاه ظفر سنة 1854، وتذكر في فصل آرائه الدينية أنه اتّبع اللاهوت الشيعي ونظم أبياتًا في مدح علي بن أبي طالب."
  en: "English Wikipedia article on Ghalib; used for entity facts only. It recounts his life from his birth in Agra in 1797 to his death in Delhi in 1869 and his appointment as Bahadur Shah Zafar's poet tutor in 1854, and states in its Religious views section that he followed Shia theology and wrote verses in praise of Ali ibn Abi Talib."
