reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 at the recorded revision, fetched by revision id and asserted equal before any claim was drawn. It gives his birth as Mirza Asadullah Baig Khan on 27 December 1797 at Agra, his move to Delhi, the pension dispute and his Calcutta journey, the titles Dabir-ul-Mulk and Najm-ud-Daula (1850), his appointment as the emperor's poet tutor in 1854 and as royal historian, and his death on 15 February 1869. Its Religious views section states that he 'followed Shia theology and had said many verses in praise of Ali ibn Abi Talib', citing Zahra Sabri, 'Three Shi'a Poets' (Indian Ocean World Centre Working Paper Series, 2016), a Pixstory piece and the Columbia University Press Ghalib concordance; the same section stresses his emphasis on seeking God over ritual practice and his scepticism toward some clerical readings. Its infobox carries no religion field."
