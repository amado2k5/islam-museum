summary:
  ar: "مقالة ويكيبيديا العربية عن خواجة حسن النظامي (1878–1955)؛ وهي ترجمة للمقالة الإنجليزية، تصفه بأنه ولي صوفي هندي وأديب، وتذكر تلاميذه وسلسلته وانتماءه إلى أهل السنة والجماعة، وتختلف عن الإنجليزية في يوم مولده ⁦(6 كانون الثاني بدل 26 كانون الأول)⁩."
  en: "The Arabic Wikipedia article on Khwaja Hasan Nizami (1878–1955); it is a translation of the English article, describing him as an Indian Sufi saint and writer with many disciples, of Nizamuddin Auliya's silsila and belonging to the Ahl al-Sunna wa'l-Jama'a, but differing from the English text on his birth day (6 January rather than 26 December)."
  es: "El artículo de Wikipedia en árabe sobre Khwaja Hasan Nizami (1878-1955) es una traducción del artículo en inglés que lo describe como un santo y escritor sufí indio con muchos discípulos, perteneciente a la silsila de Nizamuddin Auliya y a la Ahl al-Sunna wa'l-Jama'a, pero que difiere del texto en inglés en cuanto a su fecha de nacimiento (6 de enero en lugar del 26 de diciembre)."
  fr: "L'article de Wikipédia en arabe sur Khwaja Hasan Nizami (1878-1955); il s'agit d'une traduction de l'article anglais, le décrivant comme un saint soufi indien et écrivain avec de nombreux disciples, de la silsila de Nizamuddin Auliya et appartenant à l'Ahl al-Sunna wa'l-Jama'a, mais différant du texte anglais sur sa date de naissance (6 janvier plutôt que 26 décembre)."
  ur: "خواجہ حسن نظامی (1878-1955) پر عربی ویکیپیڈیا کا مضمون؛ یہ انگریزی مضمون کا ترجمہ ہے، جس میں انہیں ایک ہندوستانی صوفی بزرگ اور مصنف کے طور پر بیان کیا گیا ہے جس میں بہت سے شاگرد ہیں، نظام الدین اولیاء کے سلسلۂ سلسلۂ اور اہل السنہ والجماعت سے تعلق رکھتے ہیں، لیکن ان کے یوم پیدائش ⁦(6 جنوری کی بجائے 26 دسمبر)⁩ کے انگریزی متن سے مختلف ہے۔"
  tr: "Khwaja Hasan al-Nizami (1878–1955) hakkında Arapça Vikipedi makalesi; İngilizce makalenin çevirisi, onu Hint Sufi azizi ve yazarı olarak tanımlar, öğrencileri, soy hattı ve Ehl-al-Sunnah wal-Jama'ah ile bağlılığı belirtir. Doğum gününde (26 Aralık yerine 6 Ocak) İngilizce makaleden farklıdır."
  id: "Artikel Wikipedia bahasa Arab tentang Khwaja Hasan al-Nizami (1878–1955); ini adalah terjemahan dari artikel bahasa Inggris, yang menggambarkannya sebagai wali Sufi India dan penulis, menyebutkan murid-muridnya, garis keturunan, dan afiliasinya dengan Ahl al-Sunnah wal-Jama'ah. Artikel ini berbeda dari bahasa Inggris pada hari lahirnya (6 Januari, bukan 26 Desember)."
