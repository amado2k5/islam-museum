summary:
  ar: "مقالة ويكيبيديا العربية عن خواجة حسن النظامي (1878–1955)؛ وهي ترجمة للمقالة الإنجليزية، تصفه بأنه ولي صوفي هندي وأديب، وتذكر تلاميذه وسلسلته وانتماءه إلى أهل السنة والجماعة، وتختلف عن الإنجليزية في يوم مولده (6 كانون الثاني بدل 26 كانون الأول)."
  en: "The Arabic Wikipedia article on Khwaja Hasan Nizami (1878–1955); it is a translation of the English article, describing him as an Indian Sufi saint and writer with many disciples, of Nizamuddin Auliya's silsila and belonging to the Ahl al-Sunna wa'l-Jama'a, but differing from the English text on his birth day (6 January rather than 26 December)."
