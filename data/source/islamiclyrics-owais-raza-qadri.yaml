reliability_note: "Devotional lyrics site republishing the standard circulated biography of the reciter (the same text appears, with variants, on Last.fm and other fan/biography sites); low-to-moderate authority, used for career facts that are consistent across the copies: naat recitation from age eight, first album in 1983, travel to many countries, the 2007 Government of Pakistan Best Naat Khawan recognition and the 2008 Barkati Foundation silver-weighing honour. The copies disagree on his birth date — this page gives 8 July 1970, while other copies of the same text give 17 October 1969 — so no birth date is taken from this tradition. Read in full on 5 November 2026."
