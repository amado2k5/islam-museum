summary:
  ar: "نص السيرة المتداولة عن أويس رضا قادري كما نشره موقع Islamic Lyrics؛ يذكر أنه بدأ إنشاد النعت في الثامنة، وأن أول ألبوماته صدر سنة 1983، وأنه كُرّم سنة 2007 بلقب أفضل منشد نعت من حكومة باكستان."
  en: "The circulated biography text of Owais Raza Qadri as published by Islamic Lyrics: he began reciting naats at eight, his first album appeared in 1983, and the Government of Pakistan named him Best Naat Khawan in 2007."
  es: "El texto biográfico de Owais Raza Qadri publicado por Islamic Lyrics: Comenzó a recitar naats a los ocho años, su primer álbum apareció en 1983 y el Gobierno de Pakistán lo nombró Mejor Naat Khawan en"
  fr: "Le texte biographique d'Owais Raza Qadri, tel que publié par Islamic Lyrics, circule: Il a commencé à réciter des naats à l'âge de huit ans, son premier album est paru en 1983 et le gouvernement du Pakistan l'a nommé Meilleur Naat Khawan en 1983."
  ur: "اویس رضا قادری کی زیر گردش سوانح عمری کا متن جیسا کہ اسلامک بول کے ذریعہ شائع کیا گیا ہے: انہوں نے آٹھ سال کی عمر میں نعتیں پڑھنا شروع کیں، ان کا پہلا البم 1983 میں شائع ہوا، اور حکومت پاکستان نے انہیں بہترین نعت خواں قرار دیا۔"
  tr: "Islamic Lyrics web sitesinde yayımlanan geniş çapta yayılan Owais Raza Qadri'nin biyografi metni, sekiz yaşında natiful şiirler söylemeye başladığını, ilk albümünün 1983'te çıktığını ve 2007'de Pakistan Hükümeti tarafından En İyi Natiful Şarkıcı unvanıyla onurlandırıldığını belirtmektedir."
  id: "Teks biografi Owais Raza Qadri yang banyak beredar, sebagaimana diterbitkan oleh situs Islamic Lyrics, menyebutkan bahwa ia mulai menyanyikan puisi asli pada usia delapan tahun, album pertamanya dirilis pada tahun 1983, dan bahwa ia dianugerahi gelar Penyanyi Asli Terbaik pada tahun 2007 oleh Pemerintah Pakistan."
