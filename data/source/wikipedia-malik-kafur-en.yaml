reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It gives no birth date at all — the queue's c. 1270 is not in it and no birth block is built. It describes him as of Hindu descent (citing Kulke and Rothermund and Thapar), an eunuch slave of a Khwaja of Khambhat captured in the 1299 Gujarat invasion who converted to Islam (citing Doniger), commander against the Mongols in 1306 and in the Deccan campaigns of 1308-1311, governor of Devagiri 1313-1315, then na'ib (viceroy) until his assassination about a month after Alauddin's death, c. 11 February 1316, at Delhi. No text in it names a school or order for him. Checked 2 November 2026."
