summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن رحمة اليونسية؛ تُستخدم لوقائع الكيان فقط. تتفق مع الإنجليزية في الميلاد ⁦(26 تشرين الأول 1900)⁩ والوفاة ⁦(26 شباط 1969)⁩ في بادانغ بانجانغ، وتفصّل تاريخ مدرسة دينية بوتري ومدارسها الأخرى ومعهد تدريب المعلمات."
  en: "Indonesian Wikipedia article on Rahmah El Yunusiyah; used for entity facts only. It agrees with the English article on her birth (26 October 1900) and death (26 February 1969) at Padang Panjang, and details the history of Diniyah Putri, her further schools and her teacher-training institute."
  es: "Artículo de la Wikipedia en indonesio sobre Rahmah El Yunusiyah; utilizado únicamente para datos sobre la persona. Coincide con el artículo en inglés sobre su nacimiento (26 de octubre de 1900) y fallecimiento (26 de febrero de 1969) en Padang Panjang, y detalla la historia de Diniyah Putri, sus estudios posteriores y su instituto de formación de profesoras."
  fr: "Article de Wikipédia indonésien sur Rahmah El Yunusiyah; utilisé uniquement pour les informations relatives à l’entité. Il concorde avec l’article anglais concernant sa naissance (26 octobre 1900) et son décès (26 février 1969) à Padang Panjang, et détaille l’histoire de Diniyah Putri, de ses écoles ultérieures et de son institut de formation des enseignants."
  ur: "رحمہ ال یونسیہ پر انڈونیشین ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اس کی پیدائش ⁦(26 اکتوبر 1900)⁩ اور موت ⁦(26 فروری 1969)⁩ پڈانگ پنجنگ میں انگریزی مضمون سے متفق ہے، اور دنیہ پٹری، اس کے مزید اسکولوں اور اس کے ٹیچر ٹریننگ انسٹی ٹیوٹ کی تاریخ کی تفصیلات بتاتی ہے۔"
  tr: "Rahma Al-Younisiya hakkında Endonezya Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Padang Panjang'da doğum (26 Ekim 1900) ve ölüm (26 Şubat 1969) tarihlerinde İngilizce ile uyumludur ve Putree Dini Okulu'nun, diğer okullarının ve Öğretmen Eğitim Enstitüsü'nün tarihini detaylandırır."
  id: "Artikel Wikipedia Indonesia tentang Rahma Al-Younisiya; digunakan hanya untuk fakta entitas. Artikel ini sejalan dengan bahasa Inggris tentang kelahiran (26 Oktober 1900) dan kematian (26 Februari 1969) di Padang Panjang, yang merinci sejarah Sekolah Agama Putree, sekolah-sekolah lainnya, dan Institut Pelatihan Guru."
