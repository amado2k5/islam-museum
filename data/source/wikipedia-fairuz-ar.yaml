reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. A very long article, read in full on 25 October 2026. Its lead gives her birth as 21 November 1935 — the variant recorded in the person record, against Britannica's 20 November 1934, which the museum follows — and places her birth in the Shouf district, where the English article and Britannica place it in Beirut; the variant is recorded. It corroborates, independently of the English article, her Syriac Orthodox family background, her Maronite mother, and her move to the Eastern (Greek) Orthodox church on her marriage to Assi Rahbani, and it documents the Rahbani repertoire, the Baalbeck years, the war years and her later career in greater discographic detail than the English article."
