summary:
  ar: "مقالة ويكيبيديا العربية عن فيروز؛ تُستخدم لوقائع الكيان فقط. تقدّم ميلادها في 21 نوفمبر 1935، وتؤكد أسرتها السريانية الأرثوذكسية وأمها المارونية واعتناقها الكنيسة الأرثوذكسية الشرقية عند زواجها، وتوثّق مسيرتها بالتفصيل."
  en: "Arabic Wikipedia article on Fairuz; used for entity facts only. It gives her birth as 21 November 1935, corroborates her Syriac Orthodox family, her Maronite mother and her adoption of the Eastern Orthodox church on marriage, and documents her career in detail."
  es: "Artículo de Wikipedia en árabe sobre Fairuz; utilizado únicamente para obtener información sobre la persona. Indica que nació el 21 de noviembre de 1935, corrobora su ascendencia siríaca ortodoxa, su madre maronita y su conversión a la Iglesia ortodoxa oriental al contraer matrimonio, y documenta su trayectoria profesional en detalle."
  fr: "Article Wikipédia en arabe sur Fairuz; utilisé uniquement pour les informations relatives à l’entité. Il indique sa date de naissance, le 21 novembre 1935, confirme son appartenance à une famille syriaque orthodoxe, sa mère maronite et sa conversion à l’Église orthodoxe orientale lors de son mariage, et documente sa carrière en détail."
  ur: "فیروز پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اس کی پیدائش 21 نومبر 1935 کو ہوئی، اس کے سیریائی آرتھوڈوکس خاندان، اس کی مارونائٹ ماں اور اس کے مشرقی آرتھوڈوکس چرچ کو شادی پر گود لینے کی تصدیق کرتی ہے، اور اس کے کیریئر کو تفصیل سے دستاویز کرتی ہے۔"
