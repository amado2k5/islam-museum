  ar: "مقالة ويكيبيديا العربية عن فيروز؛ تُستخدم لوقائع الكيان فقط. تقدّم ميلادها في 21 نوفمبر 1935، وتؤكد أسرتها السريانية الأرثوذكسية وأمها المارونية واعتناقها الكنيسة الأرثوذكسية الشرقية عند زواجها، وتوثّق مسيرتها بالتفصيل."
