summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ألبوم «سلام» لسامي يوسف؛ لوقائع الكيان فقط: صدوره في 22 ديسمبر 2012 عن إي تي إم إنترناشونال، ووصفه له، وشهادته البلاتينية في جنوب شرق آسيا، والطبعة التركية، والمصوّرات، وقائمة الأغاني؛ تستند إلى صحف تابلويد وتي إن تي خبر وغلوبال بوست وسامانيولو خبر."
  en: "English Wikipedia article on Sami Yusuf's album Salaam; entity facts only: its release on 22 December 2012 by ETM International, his description of it, its platinum certification in South-East Asia, the Turkish edition, the videos and the track list; it cites Tabloid!, TNT Haber, Global Post and Samanyolu Haber."
  es: "Artículo de la Wikipedia en inglés sobre el álbum Salaam de Sami Yusuf; solo datos sobre la entidad: su lanzamiento el 22 de diciembre de 2012 por ETM International, su descripción del mismo, su certificación de platino en el sudeste asiático, la edición turca, los vídeos y la lista de canciones; cita a Tabloid!, TNT Haber, Global Post y Samanyolu Haber."
  fr: "Article de Wikipédia en anglais sur l'album Salaam de Sami Yusuf; informations uniquement sur l'artiste: sa sortie le 22 décembre 2012 chez ETM International, sa description, sa certification platine en Asie du Sud-Est, l'édition turque, les vidéos et la liste des titres; il cite Tabloid!, TNT Haber, Global Post et Samanyolu Haber."
  ur: "سمیع یوسف کے البم سلام پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق: ETM انٹرنیشنل کے ذریعہ 22 دسمبر 2012 کو اس کی ریلیز، اس کی تفصیل، جنوب مشرقی ایشیا میں اس کا پلاٹینم سرٹیفیکیشن، ترکی ایڈیشن، ویڈیوز اور ٹریک لسٹ؛ یہ Tabloid!، TNT Haber، Global Post اور Samanyolu Haber کا حوالہ دیتا ہے۔"
  tr: "Sami Youssef'in \"Salam\" albümü hakkında İngilizce Wikipedia makalesi; sadece varlık bilgileri için: 22 Aralık 2012'de ETM International tarafından yayımlanması, açıklaması, Güneydoğu Asya'daki platin sertifikası, Türk baskısı, fotoğraflar ve parça listesi; tabloid, TNT News, Global Post ve Samaniolu News temelinde."
  id: "Artikel Wikipedia bahasa Inggris tentang album Sami Youssef \"Salam\"; hanya untuk fakta entitas: perilisan pada 22 Desember 2012 oleh ETM International, deskripsinya, sertifikasi platinum di Asia Tenggara, edisi Turki, foto-fotonya, dan daftar lagu; berdasarkan tabloid, TNT News, Global Post, dan Samaniolu News."
