summary:
  ar: "الجزء الثالث من طبعة دار الكتب العلمية للقانون في الطب، مع حواشي محمد أمين الضنّاوي. يحتوي على الكتاب الرابع ⁦(المسح 3 إلى 393)⁩ وبداية الكتاب الخامس في تركيب الأدوية ⁦(من المسح 395)⁩، والنص ينقطع في آخر المسح عند 590 قبل خاتمة الكتاب."
  en: "Volume 3 of the Dar al-Kutub al-Ilmiyya edition of the Canon, with notes by Muhammad Amin al-Dannawi. It holds Book IV (scan pp. 3 to 393) and the opening of Book V on compound drugs (from scan p. 395). The text ends at scan p. 590, before the close of Book V."
  es: "Volumen 3 de la edición Dar al-Kutub al-Ilmiyya del Canon, con notas de Muhammad Amin al-Dannawi. Contiene el Libro IV (páginas 3 a 393) y el inicio del Libro V sobre medicamentos compuestos (desde la página 395). El texto finaliza en la página 590, antes del cierre del Libro V."
  fr: "Volume 3 de l'édition Dar al-Kutub al-Ilmiyya du Canon, annotée par Muhammad Amin al-Dannawi. Il contient le Livre IV (numérisation pp. 3 à 393) et le début du Livre V sur les médicaments composés (à partir de la numérisation p. 395). Le texte s'arrête à la numérisation p. 590, avant la fin du Livre V."
  ur: "کینن کے دار الکتب العلمیہ ایڈیشن کی جلد 3، محمد امین الداناوی کے نوٹس کے ساتھ۔ اس میں کتاب چہارم ⁦( اسکین پی پی 3 سے 393 تک)⁩ اور کمپاؤنڈ دوائیوں پر کتاب V کا افتتاح ⁦( اسکین صفحہ 395 سے)⁩ ہے۔ متن اسکین پی پر ختم ہوتا ہے۔ 590، کتاب V کے بند ہونے سے پہلے۔"
  tr: "Dar Al-Kutub Al-Ilmiyya li-Qanun fi Al-Tibb'in üçüncü bölümü, Muhammed Amin Al-Dhanawi'nin kenar notlarıyla birlikte. Dördüncü kitabı (El-Masva 3'ten 393'e kadar) ve ilaç bileşimi üzerine beşinci kitabın başını (Al-Masah 395'ten) içerir; metin, kitabın sonundan önce 590'da Sa'ah'ın sonunda, 590'da sona erer."
  id: "Bagian ketiga dari edisi Dar Al-Kutub Al-Ilmiyya li-Qanun fi Al-Tibb, dengan catatan pinggir Muhammad Amin Al-Dhanawi. Bagian ini memuat buku keempat (Al-Maswa 3 hingga 393) dan awal buku kelima tentang komposisi obat-obatan (dari Al-Masah 395), dengan teks berakhir di akhir Sa'ah pada 590 sebelum akhir buku."
