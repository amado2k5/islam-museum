label: { en: "El-Asr (Dec 2023): Pezić defends his doctorate at Novi Pazar" }
summary:
  ar: "تقرير مجلة «العصر» البوسنية عن مناقشة إلفدين بيزيتش أطروحة الدكتوراه في كلية الدراسات الإسلامية في نوفي بازار في 8 ديسمبر 2023؛ يتضمن التقرير سيرة مفصلة له: مولده سنة 1977 في ترافنيك، ودراسته في المدينة المنورة وجامعة القصيم، وكتبه، وعدد متابعي صفحته على فيسبوك ⁦(334 ألفا وقتها)⁩."
  en: "El-Asr magazine's report of Elvedin Pezić's doctoral defence at the Faculty of Islamic Studies in Novi Pazar on 8 December 2023; its biographical section gives his birth in 1977 in Travnik, his studies in Medina and at Qassim University, his books, and a Facebook following of 334,000 at the time."
  es: "La revista El-Asr publicó un reportaje sobre la defensa de la tesis doctoral de Elvedin Pezić en la Facultad de Estudios Islámicos de Novi Pazar el 8 de diciembre de 2023; su sección biográfica menciona su nacimiento en 1977 en Travnik, sus estudios en Medina y en la Universidad de Qassim, sus libros y que en aquel momento contaba con 334.000 seguidores en Facebook."
  fr: "Le magazine El-Asr a publié un compte rendu de la soutenance de thèse d'Elvedin Pezić à la Faculté d'études islamiques de Novi Pazar le 8 décembre 2023; sa section biographique indique sa naissance en 1977 à Travnik, ses études à Médine et à l'Université Qassim, ses livres et un nombre d'abonnés sur Facebook de 334 000 à l'époque."
  ur: "8 دسمبر 2023 کو Novi Pazar میں فیکلٹی آف اسلامک اسٹڈیز میں Elvedin Pezić کے ڈاکٹریٹ کے دفاع کی El-Asr میگزین کی رپورٹ؛ اس کا سوانحی سیکشن 1977 میں ٹراونک میں اس کی پیدائش، مدینہ اور قاسم یونیورسٹی میں اس کی تعلیم، اس کی کتابیں، اور اس وقت فیس بک پر 334,000 کی فالوونگ ہے۔"
