  ar: "تقرير مجلة «العصر» البوسنية عن مناقشة إلفدين بيزيتش أطروحة الدكتوراه في كلية الدراسات الإسلامية في نوفي بازار في 8 ديسمبر 2023؛ يتضمن التقرير سيرة مفصلة له: مولده سنة 1977 في ترافنيك، ودراسته في المدينة المنورة وجامعة القصيم، وكتبه، وعدد متابعي صفحته على فيسبوك (334 ألفا وقتها)."
  en: "El-Asr magazine's report of Elvedin Pezić's doctoral defence at the Faculty of Islamic Studies in Novi Pazar on 8 December 2023; its biographical section gives his birth in 1977 in Travnik, his studies in Medina and at Qassim University, his books, and a Facebook following of 334,000 at the time."
