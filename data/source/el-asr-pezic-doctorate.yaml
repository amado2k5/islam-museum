reliability_note: "Magazine report read in full on 4 November 2026. The defence it reports took place on 8 December 2023; the dissertation, 'Electronic commerce and network marketing through the prism of Islamic law' (206 pages), was mentored by Hakija Kanurić. The biographical section is the fullest published account read in this wave: born 1977 in Travnik, schooling in Busovača, service in the Army of the Republic of Bosnia and Herzegovina as a schoolboy volunteer until the war's end, a school year each in the Emirates and Jordan, the Arabic institute and Sharia faculty of the Islamic University of Medina, return to Bosnia in 2005, Sanski Most, then Sarajevo from 2009, and a master's at Qassim University. Its statement that the dissertation presents Hanafi positions first because the Hanafi school is officially followed in the region describes his audience's milieu, not the man himself, and was not used to settle faith. Its Facebook figure (334,000) is dated to the report (December 2023)."
