summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن منية مازيغ؛ تُستخدم لوقائع الكيان فقط. تعطي ميلادها في 10 يوليو 1970 في تونس، ودكتوراه مكغيل في الاقتصاد المالي، وحملتها لإطلاق سراح زوجها، وترشحها سنة 2004، وكتبها."
  en: "English Wikipedia article on Monia Mazigh; used for entity facts only. It gives her birth on 10 July 1970 in Tunisia, her McGill PhD in financial economics, her campaign for her husband Maher Arar’s release, her 2004 candidacy for the NDP in Ottawa South, her appointment as national coordinator of the International Civil Liberties Monitoring Group in June 2015, and her books."
  es: "Artículo de la Wikipedia en inglés sobre Monia Mazigh; utilizado únicamente para datos sobre la persona. En él se menciona su fecha de nacimiento, el 10 de julio de 1970 en Túnez, su doctorado en economía financiera por la Universidad McGill, su campaña para la liberación de su esposo Maher Arar, su candidatura en 2004 por el NDP en Ottawa Sur, su nombramiento como coordinadora nacional del Grupo Internacional de Monitoreo de las Libertades Civiles en junio de 2015 y sus libros."
  fr: "Article de Wikipédia en anglais sur Monia Mazigh; utilisé uniquement pour des informations sur l’entité. On y trouve des informations sur sa naissance le 10 juillet 1970 en Tunisie, son doctorat en économie financière de l’Université McGill, sa campagne pour la libération de son mari Maher Arar, sa candidature pour le NPD dans Ottawa-Sud en 2004, sa nomination comme coordonnatrice nationale du Groupe international de surveillance des libertés civiles en juin 2015 et ses ouvrages."
