summary:
  ar: "مقالة ويكيبيديا العربية المطولة عن تركي بن سعيد بن سلطان البوسعيدي، سلطان عمان؛ تروي نشأته وأسرته، ورحلته الشهيرة من الهند مدعومًا بأموال أخيه ماجد سلطان زنجبار، ودخوله مطرح ومسقط سنة 1871، ومرضه سنة 1874 وإنابة أخيه عبد العزيز، وعودته في ديسمبر 1875، وبرنامجه الإداري، حتى وفاته سنة 1888 وخلفه ابنه فيصل."
  en: "Long Arabic Wikipedia article on Turki bin Said bin Sultan Al Busaidi, Sultan of Oman; it recounts his upbringing and family, his famous journey from India financed by his brother Majid, Sultan of Zanzibar, his entry into Matrah and Muscat in 1871, his illness of 1874 and his brother Abd al-Aziz's deputyship, his return in December 1875, and his administrative programme, down to his death in 1888 and his son Faisal's succession."
  es: "Artículo extenso en la Wikipedia en árabe sobre Turki bin Said bin Sultan Al Busaidi, sultán de Omán; relata su infancia y su familia, su famoso viaje desde la India financiado por su hermano Majid, sultán de Zanzíbar, su entrada en Matrah y Mascate en 1871, su enfermedad de 1874 y el nombramiento de su hermano Abd al-Aziz como lugarteniente, su regreso en diciembre de 1875 y su programa administrativo, hasta su muerte en 1888 y la sucesión de su hijo Faisal."
  fr: "Long article de Wikipédia en arabe sur Turki bin Said bin Sultan Al Busaidi, sultan d'Oman; il relate son enfance et sa famille, son célèbre voyage depuis l'Inde financé par son frère Majid, sultan de Zanzibar, son entrée à Matrah et Mascate en 1871, sa maladie de 1874 et la nomination de son frère Abd al-Aziz comme député, son retour en décembre 1875 et son programme administratif, jusqu'à sa mort en 1888 et la succession de son fils Faisal."
  ur: "عمان کے سلطان ترکی بن سعید بن سلطان البوسیدی پر طویل عربی ویکیپیڈیا مضمون؛ اس میں ان کی پرورش اور خاندان کا ذکر ہے، ہندوستان سے ان کے مشہور سفر کو اس کے بھائی ماجد، زنجبار کے سلطان نے مالی اعانت فراہم کی، 1871 میں اس کا متراہ اور مسقط میں داخلہ، 1874 کی بیماری اور اس کے بھائی عبد العزیز کی نائبیت، دسمبر 1875 میں اس کی واپسی، اور اس کے انتظامی پروگرام میں اس کے بیٹے کی موت اور 88 میں ان کی موت جانشینی"
  tr: "Umman Sultanı Turki bin Said bin Sultan Al Busaidi hakkında kapsamlı Arapça Wikipedia makalesi; onun yetiştirilme sürecini, ailesini ve kardeşi Zanzibarlı Majid Sultan'ın desteğiyle Hindistan'dan olan ünlü yolculuğunu, 1871'de Muttrah ve Muskat'a girişini, 1874'te hastalığını, yerine kardeşi Abdul Aziz'in geçmesini, Aralık 1875'te dönüşünü ve 1888'deki ölümüne kadar olan idari programını, ardından oğlu Faysal'ın geçtiğini anlatır."
  id: "Artikel Wikipedia berbahasa Arab yang luas tentang Turki bin Said bin Sultan Al Busaidi, Sultan Oman; artikel ini menceritakan masa kecilnya, keluarga, dan perjalanan terkenalnya dari India yang didukung oleh dana saudaranya Majid Sultan dari Zanzibar, kemasukannya ke Muttrah dan Muscat pada tahun 1871, penyakitnya pada tahun 1874, penggantian oleh saudaranya Abdul Aziz, kepulangannya pada Desember 1875, dan program administrasinya hingga kematiannya pada tahun 1888, yang digantikan oleh putranya Faisal."
