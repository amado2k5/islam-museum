reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md). Read in full at revision 74536716 on 26 October 2026. Its infobox gives his death as 4 June 1888 at Muscat and its religion field as 'Ibadi Muslim' — an uncited infobox value its text does not discuss; its categories, by contrast, give his birth in 1248 AH / 1832 and death in 1305 AH / 1888, agreeing with the English article. Its body text errs twice against all of this — born in 1837, and 'took power in 1863' — readings the record states and does not follow; the Urdu article's early-life section copies the same erroneous paragraph."
