summary:
  ar: "مقالة ويكيبيديا العربية المطولة عن تركي بن سعيد بن سلطان البوسعيدي، سلطان عمان؛ تروي نشأته وأسرته، ورحلته الشهيرة من الهند مدعومًا بأموال أخيه ماجد سلطان زنجبار، ودخوله مطرح ومسقط سنة 1871، ومرضه سنة 1874 وإنابة أخيه عبد العزيز، وعودته في ديسمبر 1875، وبرنامجه الإداري، حتى وفاته سنة 1888 وخلفه ابنه فيصل."
  en: "Long Arabic Wikipedia article on Turki bin Said bin Sultan Al Busaidi, Sultan of Oman; it recounts his upbringing and family, his famous journey from India financed by his brother Majid, Sultan of Zanzibar, his entry into Matrah and Muscat in 1871, his illness of 1874 and his brother Abd al-Aziz's deputyship, his return in December 1875, and his administrative programme, down to his death in 1888 and his son Faisal's succession."
