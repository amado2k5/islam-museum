reliability_note: "Read in the museum's session on 20 November 2026. It says the word mu'jam in modern Arabic studies is ambiguous (the open lexicon of a language community, Lexicon; or the made dictionary, Dictionary); that qamus originally meant the ocean and became a general word for dictionary from al-Fayruzabadi's; that in the old Arabic tradition mu'jam did not name language books but a dotted book whose obscurity (ujma) had been removed, and 'huruf al-mu'jam' means the letters of dotting; that the first to name works mu'jam were the hadith scholars (for example the Mu'jam al-Sahaba), who ordered names alphabetically; and that the term is absent from the titles of the great dictionaries such as Kitab al-Ayn and Lisan al-Arab until the modern age. Used for entity facts only."
