summary:
  ar: "مقالة ويكيبيديا الأردية عن شاہ فیصل بن حسين، أول ملوك العراق (1921–1933)؛ تقول إنه وُلد في 20 مايو 1883 في الطائف، وتصف دوره في الثورة العربية وانتخابه عضوًا عن جدة في البرلمان العثماني، وتمثيله أباه في مؤتمر باريس للسلام، وملكه القصير على سوريا وطرد الفرنسيين له، وتتويجه على العراق في 23 أغسطس 1921 ووفاته في 8 سبتمبر 1933 وخلفه ابنه غازي."
  en: "Urdu Wikipedia article on Shah Faisal bin Hussein, first King of Iraq (1921–1933); it gives his birth as 20 May 1883 at Taif, and describes his part in the Arab Revolt, his election as Jeddah's deputy to the Ottoman parliament, his representation of his father at the Paris Peace Conference, his brief kingship of Syria and expulsion by the French, his coronation in Iraq on 23 August 1921, his death on 8 September 1933 and his succession by his son Ghazi."
  es: "Artículo en urdu de la Wikipedia sobre Shah Faisal bin Hussein, primer rey de Irak (1921-1933); indica que nació el 20 de mayo de 1883 en Taif y describe su participación en la Revuelta Árabe, su elección como diputado de Jeddah en el parlamento otomano, su representación de su padre en la Conferencia de Paz de París, su breve reinado en Siria y su expulsión por los franceses, su coronación en Irak el 23 de agosto de 1921, su muerte el 8 de septiembre de 1933 y su sucesión por su hijo Ghazi."
  fr: "L'article de Wikipédia en ourdou sur Shah Faisal bin Hussein, premier roi d'Irak (1921-1933); il indique sa naissance le 20 mai 1883 à Taïf et décrit son rôle dans la révolte arabe, son élection comme député de Djeddah au parlement ottoman, sa représentation de son père à la Conférence de paix de Paris, son bref règne sur la Syrie et son expulsion par les Français, son couronnement en Irak le 23 août 1921, sa mort le 8 septembre 1933 et sa succession par son fils Ghazi."
  ur: "شاہ فیصل بن حسین، عراق کے پہلے بادشاہ (1921–1933) پر اردو ویکیپیڈیا کا مضمون؛ اس میں ان کی پیدائش 20 مئی 1883 کو طائف میں ہوئی، اور عرب بغاوت میں ان کا حصہ، عثمانی پارلیمنٹ میں جدہ کے نائب کے طور پر ان کا انتخاب، پیرس امن کانفرنس میں اپنے والد کی نمائندگی، شام کی ان کی مختصر بادشاہی اور فرانسیسیوں کے ہاتھوں بے دخلی، 23 اگست 19931 کو عراق میں اس کی تاجپوشی، ستمبر 19931 کو اس کے بیٹے کی وفات اور 1931 میں اپنے بیٹے کی کامیابی کے بارے میں بتایا گیا ہے۔ غازی۔"
