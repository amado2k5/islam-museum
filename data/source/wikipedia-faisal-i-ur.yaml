reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md). Read in full at revision 8907274 on 25 October 2026. The article errs twice against the English and Arabic articles: it gives the birth year as 1883 (they give 1885) and calls Faisal his father's eldest son (he was the third son, as the English article states and the Arabic article's family account confirms). The record follows the English and Arabic articles on both points and states the Urdu variants in the born note. It agrees with them on Taif as the birthplace (against the English article's Mecca) and on the death date, 8 September 1933. It names no school for him."
