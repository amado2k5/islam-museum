summary:
  ar: "مقالة ويكيبيديا الأردية عن شاہ فیصل بن حسين، أول ملوك العراق (1921–1933)؛ تقول إنه وُلد في 20 مايو 1883 في الطائف، وتصف دوره في الثورة العربية وانتخابه عضوًا عن جدة في البرلمان العثماني، وتمثيله أباه في مؤتمر باريس للسلام، وملكه القصير على سوريا وطرد الفرنسيين له، وتتويجه على العراق في 23 أغسطس 1921 ووفاته في 8 سبتمبر 1933 وخلفه ابنه غازي."
  en: "Urdu Wikipedia article on Shah Faisal bin Hussein, first King of Iraq (1921–1933); it gives his birth as 20 May 1883 at Taif, and describes his part in the Arab Revolt, his election as Jeddah's deputy to the Ottoman parliament, his representation of his father at the Paris Peace Conference, his brief kingship of Syria and expulsion by the French, his coronation in Iraq on 23 August 1921, his death on 8 September 1933 and his succession by his son Ghazi."
