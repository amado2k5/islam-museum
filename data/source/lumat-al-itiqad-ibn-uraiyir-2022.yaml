  en: Lum'at al-I'tiqad, Ibn Qudama al-Maqdisi (ed. Muhammad ibn Abd al-Rahman al-Furayhan ibn Uraye'ir, Dar Rakaez, 1443 AH)
summary:
  ar: طبعة الدراسة والتحقيق للمحقق د. محمد بن عبد الرحمن الفرحان بن عريعر، ومقدمتها عن المؤلف ووصف المخطوطات، الطبعة الثانية ⁦(الرياض، 1443هـ/2022م)⁩. تُستعمل هنا للمقدمة والترجمة وأنواع مؤلفات الاعتقاد،
    ولا يُنقل نص المتن منها.
  en: The study-and-edition of Lum'at al-I'tiqad by Dr Muhammad ibn Abd al-Rahman al-Furayhan ibn Uraye'ir, second edition (Riyadh, 1443 AH / 2022), used here for the editor's introduction, the author's
    biography and the typology of creed works.
  es: "El estudio y edición de Lum'at al-I'tiqad del Dr. Muhammad ibn Abd al-Rahman al-Furayhan ibn Uraye'ir, segunda edición (Riad, 1443 AH / 2022), utilizado aquí para la introducción del editor, la biografía del autor y la tipología de las obras de doctrina."
  fr: "L'étude et l'édition de Lum'at al-I'tiqad par le Dr Muhammad ibn Abd al-Rahman al-Furayhan ibn Uraye'ir, deuxième édition (Riyad, 1443 AH / 2022), utilisées ici pour l'introduction de l'éditeur, la biographie de l'auteur et la typologie des ouvrages de croyance."
  ur: "ڈاکٹر محمد بن عبدالرحمٰن الفریحان ابن عریض کی لمیت الاعتقاد کا مطالعہ اور ایڈیشن، دوسرا ایڈیشن ⁦(ریاض، 1443 ہجری / 2022)⁩، یہاں ایڈیٹر کے تعارف، مصنف کی سوانح عمری اور تصنیفات کی نوع کے لیے استعمال کیا گیا ہے۔"
