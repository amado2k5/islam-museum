summary:
  ar: "مقالة ويكيبيديا الأردية عن أحمد الله شاه؛ تُستخدم لوقائع الكيان فقط. توازي المقالة الإنجليزية في بنيتها ومصادرها، وتذكر في متنها أنه من أهل السنة، وتروي قيادته لبغاوت 1857 ومقتله."
  en: "Urdu Wikipedia article on Ahmadullah Shah; used for entity facts only. It parallels the English article in structure and citations, states in its text that he belonged to Ahl al-Sunna, and recounts his leadership of the 1857 rebellion and his killing."
  es: "Artículo de Wikipedia en urdu sobre Ahmadullah Shah; se utiliza únicamente para datos sobre la persona. Su estructura y citas son similares a las del artículo en inglés, indica que pertenecía a Ahl al-Sunna y relata su liderazgo en la rebelión de 1857 y su asesinato."
  fr: "Article de Wikipédia en ourdou sur Ahmadullah Shah; utilisé uniquement à des fins d’information. Sa structure et ses citations sont similaires à celles de l’article anglais. Il indique qu’il appartenait à Ahl al-Sunna et relate son rôle à la tête de la rébellion de 1857 ainsi que sa mort."
  ur: "احمد اللہ شاہ پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ساخت اور حوالہ جات میں انگریزی مضمون کے متوازی ہے، اس کے متن میں کہا گیا ہے کہ اس کا تعلق اہل السنہ سے تھا، اور 1857 کی بغاوت اور اس کے قتل کی اس کی قیادت کا ذکر کرتا ہے۔"
  tr: "Ahmadullah Şah hakkında Urduca Vikipedi makalesi yalnızca varlığın gerçekleri için kullanılmıştır. Makale yapısal ve kaynaklar açısından benzerdir; Sünni olduğunu belirtir ve 1857 isyanındaki liderliği ile suikastını anlatır."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang Ahmadullah Shah hanya digunakan untuk fakta-fakta entitas tersebut. Artikel tersebut serupa dalam struktur dan sumber, menyebutkan bahwa ia adalah Sunni dan menceritakan kepemimpinannya dalam pemberontakan tahun 1857 serta pembunuhannya."
