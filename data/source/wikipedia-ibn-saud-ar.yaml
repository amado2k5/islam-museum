summary:
  ar: "مقالة ويكيبيديا العربية المطوّلة عن أبي تركي عبد العزيز بن عبد الرحمن بن فيصل آل سعود ⁦(19 ذي الحجة 1293هـ/15 يناير 1876م – 2 ربيع الأول 1373هـ/9 نوفمبر 1953م)⁩، مؤسس المملكة العربية السعودية وأول ملوكها والحاكم الرابع عشر من آل سعود؛ تروي خروجه من الكويت واسترداده الرياض ليلة 21 رمضان 1319هـ وسنوات التوحيد التي زادت على ثلاثين عامًا حتى المرسوم الملكي بتوحيد البلاد باسم المملكة العربية السعودية في 23 سبتمبر 1932، وإنشاءه المؤسسات ومجلس الشورى ومؤسسة النقد وسكة الحديد."
  en: "Long Arabic Wikipedia article on Abu Turki Abdulaziz bin Abdul Rahman bin Faisal Al Saud (19 Dhu al-Hijja 1293 AH / 15 January 1876 – 2 Rabi' al-Awwal 1373 AH / 9 November 1953), founder and first King of Saudi Arabia and fourteenth ruler of the House of Saud; it recounts his setting out from Kuwait and recapture of Riyadh on the night of 21 Ramadan 1319 AH, more than thirty years of unification campaigns up to the royal decree uniting the country as the Kingdom of Saudi Arabia on 23 September 1932, and his founding of the state's institutions, Shura Council, Monetary Agency and railway."
  es: "Artículo extenso en la Wikipedia en árabe sobre Abu Turki Abdulaziz bin Abdul Rahman bin Faisal Al Saud (19 de Dhu al-Hijja de 1293 AH / 15 de enero de 1876 - 2 de Rabi' al-Awwal de 1373 AH / 9 de noviembre de 1953), fundador y primer rey de Arabia Saudita y decimocuarto gobernante de la Casa de Saud; relata su partida de Kuwait y la reconquista de Riad la noche del 21 de Ramadán de 1319 AH, más de treinta años de campañas de unificación hasta el decreto real que unificó el país como el Reino de Arabia Saudita el 23 de septiembre de 1932, y su fundación de las instituciones estatales, el Consejo de la Shura, la Agencia Monetaria y el ferrocarril."
  fr: "Long article de Wikipédia en arabe sur Abu Turki Abdulaziz bin Abdul Rahman bin Faisal Al Saud (19 Dhu al-Hijja 1293 AH / 15 janvier 1876 – 2 Rabi' al-Awwal 1373 AH / 9 novembre 1953), fondateur et premier roi d'Arabie saoudite et quatorzième souverain de la maison des Saoud; il relate son départ du Koweït et la reconquête de Riyad dans la nuit du 21 Ramadan 1319 AH, plus de trente ans de campagnes d'unification jusqu'au décret royal unifiant le pays en tant que Royaume d'Arabie saoudite le 23 septembre 1932, et la fondation par ce dernier des institutions de l'État, le Conseil de la Choura, l'Agence monétaire et le chemin de fer."
  ur: "ابو ترکی عبدالعزیز بن عبدالرحمن بن فیصل آل سعود ⁦(19 ذی الحجہ 1293ھ / 15 جنوری 1876 - 2 ربیع الاول 1373ھ / 9 نومبر 1953)⁩ پر طویل عربی ویکیپیڈیا مضمون، سعودی عرب کے بانی اور پہلے بادشاہ اور ایوان سعود کے چودھویں حکمران؛ اس میں 21 رمضان 1319 ہجری کی رات کویت سے ان کے نکلنے اور ریاض پر دوبارہ قبضہ کرنے، 23 ستمبر 1932 کو مملکت کو سعودی عرب کی مملکت کے طور پر متحد کرنے کے شاہی فرمان تک اتحاد کی تیس سال سے زیادہ کی مہمات، اور ریاستی اداروں، شوریٰ اور ریلوے کی ایجنسی کے قیام کا ذکر ہے۔"
