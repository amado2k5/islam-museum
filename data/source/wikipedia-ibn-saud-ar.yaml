summary:
  ar: "مقالة ويكيبيديا العربية المطوّلة عن أبي تركي عبد العزيز بن عبد الرحمن بن فيصل آل سعود (19 ذي الحجة 1293هـ/15 يناير 1876م – 2 ربيع الأول 1373هـ/9 نوفمبر 1953م)، مؤسس المملكة العربية السعودية وأول ملوكها والحاكم الرابع عشر من آل سعود؛ تروي خروجه من الكويت واسترداده الرياض ليلة 21 رمضان 1319هـ وسنوات التوحيد التي زادت على ثلاثين عامًا حتى المرسوم الملكي بتوحيد البلاد باسم المملكة العربية السعودية في 23 سبتمبر 1932، وإنشاءه المؤسسات ومجلس الشورى ومؤسسة النقد وسكة الحديد."
  en: "Long Arabic Wikipedia article on Abu Turki Abdulaziz bin Abdul Rahman bin Faisal Al Saud (19 Dhu al-Hijja 1293 AH / 15 January 1876 – 2 Rabi' al-Awwal 1373 AH / 9 November 1953), founder and first King of Saudi Arabia and fourteenth ruler of the House of Saud; it recounts his setting out from Kuwait and recapture of Riyadh on the night of 21 Ramadan 1319 AH, more than thirty years of unification campaigns up to the royal decree uniting the country as the Kingdom of Saudi Arabia on 23 September 1932, and his founding of the state's institutions, Shura Council, Monetary Agency and railway."
