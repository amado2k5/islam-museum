summary:
  ar: "مقالہ اردو ويكيبيديا عن عبد الحليم محمود، وهو يتبع متن المقالة الإنجليزية؛ يقترن فيه تاريخ وفاته 17 أكتوبر 1978 بـ14 ذی القعدہ 1398هـ، وصندوق معلوماته ⁦(بالعربية)⁩ يعطي مذهبه مالكيا."
  en: "Urdu Wikipedia article on Abd al-Halim Mahmud, following the English article's text; it pairs his death, 17 October 1978, with 14 Dhu al-Qa'da 1398 AH, and its infobox gives his madhhab as Maliki."
  es: "Artículo de Wikipedia en urdu sobre Abd al-Halim Mahmud, que sigue al texto del artículo en inglés; relaciona su muerte, el 17 de octubre de 1978, con el 14 de Dhu al-Qa'da de 1398 AH, y su ficha informativa indica que su madhhab era Maliki."
  fr: "L'article de Wikipédia en ourdou sur Abd al-Halim Mahmud, suivant le texte de l'article en anglais, associe sa mort, le 17 octobre 1978, au 14 Dhu al-Qa'da 1398 AH, et son infobox indique que son madhhab est Maliki."
  ur: "عبد الحلیم محمود پر اردو ویکیپیڈیا مضمون، انگریزی مضمون کے متن کے بعد؛ اس نے ان کی وفات 17 اکتوبر 1978 کو 14 ذی القعدہ 1398 ہجری کے ساتھ جوڑ دی ہے اور اس کا معلوماتی خانہ ان کے مذہب کو مالکی قرار دیتا ہے۔"
  tr: "Abdul Halim Mahmood hakkındaki Urduca Vikipedi makalesi, makalenin İngilizce metnini takip eder; ölüm tarihini 17 Ekim 1978 olarak 14 Dhu al-Qi'dah 1398 Hile ilişkilendirir ve bilgi kutusu (Arapça) onun Maliki düşünce okulunu verir."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang Abdul Halim Mahmood, yang mengikuti teks bahasa Inggris dari artikel tersebut; artikel tersebut mengaitkan tanggal kematiannya sebagai 17 Oktober 1978 dengan 14 Dhu al-Qi'dah 1398 H, dan infobox-nya (dalam bahasa Arab) memberikan aliran pemikiran Maliki-nya."
