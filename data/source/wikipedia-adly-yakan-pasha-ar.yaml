reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and re-fetched by the recorded revision id with content verified identical. Its infobox gives his birth as 24 January 1864 — six days later than the English article's and Wikidata's 18 January — and his death on 22 October 1933 at Paris. Its text explains his name: he was the son of Khalil Ibrahim Pasha, a nephew (sister's son) of Muhammad Ali Pasha, and 'Yakan' is Turkish for a sister's son; educated at Istanbul from the age of eight and in France, then at German, Frères, Jesuit and Marcel schools in Egypt; translator at the interior ministry from 1880, then provincial governor posts, director of awqaf 1906–1909, member and deputy speaker of the Legislative Assembly from 1913, foreign minister in 1914, education minister (making Arabic the basic language of primary and secondary teaching and taking the first steps toward a state university), interior minister in 1919, prime minister from 16 March 1921, negotiator with Lord Curzon, and founder and first president of the Liberal Constitutional Party (29 October 1922 – 17 January 1924). Its infobox religion field is present but empty, and its text names no religion or school for him."
