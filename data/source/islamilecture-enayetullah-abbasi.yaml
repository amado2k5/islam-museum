  ar: "سيرة بنغالية مطوّلة لعناية الله عباسي في موقع Islami Lecture؛ تذكر اسمه الكامل وأسرته في سيدرغانج بنارايانغانج، وخلافته أباه بيرا للدربار الجونبوري سنة 2006، ومناصبه الحالية في تحريك ختم النبوة ومدرسته."
