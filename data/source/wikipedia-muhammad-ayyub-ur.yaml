summary:
  ar: "مقالة ويكيبيديا الأردية عن محمد أيوب؛ تُستخدم لوقائع الكيان فقط. ترجمة قصيرة للمقالة الإنجليزية؛ يعطي صندوقها الطائفة أهل السنة والفقه حنفي دون استشهاد، وتذكر مولده سنة 1952 ووفاته سنة 2016 بالمدينة."
  en: "Urdu Wikipedia article on Muhammad Ayyub; used for entity facts only. A short translation of the English article; its infobox gives denomination Ahl al-Sunnah and jurisprudence Hanafi without a citation, and it gives his birth in 1952 and death in 2016 at Medina."
  es: "Artículo de Wikipedia en urdu sobre Muhammad Ayyub; se utiliza únicamente para datos sobre la persona. Una breve traducción del artículo en inglés; su ficha informativa indica la denominación Ahl al-Sunnah y la jurisprudencia Hanafi sin citar ninguna fuente, y menciona su nacimiento en 1952 y su fallecimiento en 2016 en Medina."
  fr: "Article de Wikipédia en ourdou sur Muhammad Ayyub; utilisé uniquement pour les informations le concernant. Traduction abrégée de l’article anglais; son infobox indique son appartenance à la communauté sunnite (Ahl al-Sunnah) et à l’école de jurisprudence hanafite (Hanafi) sans citation, et mentionne sa naissance en 1952 et son décès en 2016 à Médine."
  ur: "محمد ایوب پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ انگریزی مضمون کا مختصر ترجمہ؛ اس کا معلوماتی خانہ بغیر کسی حوالہ کے فرقہ اہل السنۃ اور فقہ حنفی دیتا ہے، اور اس کی ولادت 1952 میں اور وفات 2016 میں مدینہ میں ہوتی ہے۔"
  tr: "Muhammed Eyyub hakkında Urduca Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. İngilizce makalenin kısa çevirisi; kutusu, 1952'de doğduğu ve 2016'da Medine'de vefatı belirtilen Ehl-sünnet ve Hanefi fıkıh mezhebine atıf belirtilmemiştir."
  id: "Artikel Wikipedia Urdu tentang Muhammad Ayyub; digunakan hanya untuk fakta entitas. Terjemahan singkat dari artikel bahasa Inggris; kotaknya diberikan kepada sekte Ahl al-Sunnah dan Hanafi tanpa kutipan, menyebutkan kelahirannya pada tahun 1952 dan kematiannya pada tahun 2016 di Madinah."
