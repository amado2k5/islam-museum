summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سونن درجات؛ تعطي اسمه عند الولادة رادين قاسم وولادته 1470 في سورابايا ووفاته 1522 في باتشيران بلامونغان وأباه سونن أمبل وأخاه سونن بونانغ وأغنيته الغاملانية «بنكور» وبناءه مسجدًا سنة 1502."
  en: "English Wikipedia article on Sunan Drajat; it gives his birth name as Raden Qasim, birth in 1470 at Surabaya, death in 1522 at Paciran, Lamongan, his father Sunan Ampel and brother Sunan Bonang, his gamelan tune Gending Pangkur and his building of a mosque in 1502."
  es: "Artículo de Wikipedia en inglés sobre Sunan Drajat; da su nombre de nacimiento como Raden Qasim, nacimiento en 1470 en Surabaya, muerte en 1522 en Paciran, Lamongan, su padre Sunan Ampel y su hermano Sunan Bonang, su melodía de gamelán Gending Pangkur y la construcción de una mezquita en 1502."
  fr: "Article Wikipédia en anglais sur Sunan Drajat; il donne son nom de naissance Raden Qasim, sa naissance en 1470 à Surabaya, sa mort en 1522 à Paciran, Lamongan, son père Sunan Ampel et son frère Sunan Bonang, son air de gamelan Gending Pangkur et sa construction d'une mosquée en 1502."
  ur: "سنن دراجات پر انگریزی ویکیپیڈیا مضمون؛ اس میں ان کی پیدائش کا نام رادن قاسم، پیدائش 1470 میں سورابایا میں، وفات 1522 میں پاسیران، لامونگن، اس کے والد سنان امپل اور بھائی سنان بونانگ، اس کی گیملان ٹیون گینڈنگ پنگکور اور 1502 میں اس کی مسجد کی عمارت بتائی گئی ہے۔"
  tr: "Sonen hakkında İngilizce Vikipedi makalesi bir derecedir; doğum adı Radin Qasim olarak verilmiştir; 1470'te Surabaya'da doğmuş ve 1522'de Bachiran Palamungan'da ölmüştür. Babası Sonen Amble, kardeşi Sonen Bunang, Gamlani şarkısı 'Bankor' ve 1502'de cami inşa etmiştir."
  id: "Artikel Wikipedia bahasa Inggris tentang Sonen adalah sebuah gelar; menyebutkan nama lahirnya sebagai Radin Qasim, lahir tahun 1470 di Surabaya, dan meninggal pada tahun 1522 di Bachiran Palamungan. Ayahnya adalah Sonen Amble, saudaranya Sonen Bunang, lagu Gamlani 'Bankor,' dan pembangunan masjid pada tahun 1502."
