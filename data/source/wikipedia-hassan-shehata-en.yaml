  ar: "مقالة ويكيبيديا الإنجليزية عن حسن شحاتة؛ تُستخدم لوقائع الكيان فقط. تروي سيرة المهاجم والمدرب المصري المولود في 19 يونيو 1947 بكفر الدوار: لعب للزمالك وكاظمة الكويتي وخاض 52 مباراة مع منتخب مصر، ثم قاد المنتخب مدربًا إلى ثلاثة ألقاب متتالية في كأس الأمم الأفريقية 2006 و2008 و2010."
  en: "English Wikipedia article on Hassan Shehata; used for entity facts only. It records the Egyptian forward and manager born 19 June 1947 at Kafr El Dawwar: a playing career with Zamalek and Kuwait's Kazma, 52 Egypt caps, and a managerial career crowned by Egypt's three consecutive Africa Cup of Nations titles in 2006, 2008 and 2010."
