summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حسن شحاتة؛ تُستخدم لوقائع الكيان فقط. تروي سيرة المهاجم والمدرب المصري المولود في 19 يونيو 1947 بكفر الدوار: لعب للزمالك وكاظمة الكويتي وخاض 52 مباراة مع منتخب مصر، ثم قاد المنتخب مدربًا إلى ثلاثة ألقاب متتالية في كأس الأمم الأفريقية 2006 و2008 و2010."
  en: "English Wikipedia article on Hassan Shehata; used for entity facts only. It records the Egyptian forward and manager born 19 June 1947 at Kafr El Dawwar: a playing career with Zamalek and Kuwait's Kazma, 52 Egypt caps, and a managerial career crowned by Egypt's three consecutive Africa Cup of Nations titles in 2006, 2008 and 2010."
  es: "Artículo de la Wikipedia en inglés sobre Hassan Shehata; utilizado únicamente para obtener información sobre la persona. En él se describe al delantero y entrenador egipcio nacido el 19 de junio de 1947 en Kafr El Dawwar: su carrera como jugador en el Zamalek y el Kazma de Kuwait, 52 partidos con la selección egipcia y una carrera como entrenador coronada por los tres títulos consecutivos de la Copa Africana de Naciones de Egipto en 2006, 2008 y 2010."
  fr: "Article Wikipédia en anglais sur Hassan Shehata; utilisé uniquement pour les informations sur l'entité. Il retrace la carrière de joueur de l'attaquant et entraîneur égyptien né le 19 juin 1947 à Kafr El Dawwar: sa carrière au Zamalek et au Kazma (Koweït), ses 52 sélections en équipe nationale d'Égypte et sa carrière d'entraîneur couronnée par trois titres consécutifs de l'Égypte à la Coupe d'Afrique des Nations en 2006, 2008 et 2010."
