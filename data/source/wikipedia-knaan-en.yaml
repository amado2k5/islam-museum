  ar: "مقالة ويكيبيديا الإنجليزية عن كينان؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته باسم كينان عبدي ورسمي في 1 فبراير 1978 في مقديشو، ونجاح أغنيته «راية متموّجة»، ولا تسمّي له مذهبًا."
  en: "English Wikipedia article on K'naan; used for entity facts only. It gives his birth as Keinan Abdi Warsame on 1 February 1978 in Mogadishu and the success of 'Wavin' Flag', and names no school for him."
  es: "Artículo de Wikipedia en inglés sobre K'naan; Se utiliza únicamente para hechos de entidades. Da su nacimiento como Keinan Abdi Warsame el 1 de febrero de 1978 en Mogadishu y el éxito de 'Wavin' Flag', y no le nombra ninguna escuela."
  fr: "Article Wikipédia en anglais sur K'naan; utilisé uniquement pour les faits d’entité. Il donne naissance à Keinan Abdi Warsame le 1er février 1978 à Mogadiscio et au succès de « Wavin' Flag », et ne lui donne aucune école."
  ur: "K'naan پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1 فروری 1978 کو موغادیشو میں کینان عبدی وارسیم کے نام سے جنم لیتا ہے اور 'واوین' فلیگ کی کامیابی، اور اس کے لیے کسی اسکول کا نام نہیں رکھتا۔"
