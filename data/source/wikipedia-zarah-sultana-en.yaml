reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision via the MediaWiki API on 1 November 2026; a fact is used only where the article cites a source for it (Wikipedia broad rule). Used for her birth on 31 October 1993 in Birmingham to a British Mirpuri family, her education at the University of Birmingham, her election for Coventry South in 2019, the suspension of the Labour whip in July 2024, her resignation from Labour on 3 July 2025 and her co-founding of Your Party with Jeremy Corbyn. For faith, the article states in its own text, cited to an Evening Standard profile of 22 May 2024, that 'Sultana is a practising Muslim', and quotes her speaking of the abuse she receives 'as a Muslim' - a generic identification and documented practice naming no school or order."
