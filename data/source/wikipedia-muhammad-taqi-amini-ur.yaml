  ar: "مقالة ويكيبيديا الأردية عن محمد تقي الأميني؛ تُستخدم لوقائع الكيان فقط. تسمّيه في صدرها «عالما سنيا» وتتبع سيرته من بارابانكي إلى عمادة كلية اللاهوت في عليكرة، وتتبع في بنيتها ومراجعها المقالة الإنجليزية."
  en: "Urdu Wikipedia article on Muhammad Taqi Amini; used for entity facts only. Its lead calls him a Sunni scholar in text and traces his career from Barabanki to the deanship at Aligarh; in structure and references it follows the English article, and so forms one source family with it."
  es: "Artículo de Wikipedia en urdu sobre Muhammad Taqi Amini; se utiliza únicamente para datos sobre la persona. En su introducción, lo describe como un erudito sunita y traza su trayectoria desde Barabanki hasta el decanato de Aligarh; en estructura y referencias, sigue el modelo del artículo en inglés, formando así una misma fuente."
  fr: "Article de Wikipédia en ourdou sur Muhammad Taqi Amini; utilisé uniquement pour les informations factuelles. Son introduction le présente comme un érudit sunnite et retrace son parcours de Barabanki jusqu’à son poste de doyen à Aligarh; sa structure et ses références suivent celles de l’article anglais, avec lequel il forme une même famille de sources."
