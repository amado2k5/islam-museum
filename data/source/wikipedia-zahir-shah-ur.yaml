summary:
  ar: "مقالة ويكيبيديا الأردية عن محمد ظاهر شاه؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 15 أكتوبر 1914 بكابل ووفاته في 23 يوليو 2007 بكابل ودفنه على تل مرنجان، وتحمل في صندوق معلوماتها قيمة الديانة أهل السنة."
  en: "Urdu Wikipedia article on Mohammad Zahir Shah; used for entity facts only. It gives his birth on 15 October 1914 at Kabul, his death on 23 July 2007 at Kabul and burial on Maranjan Hill, and carries in its infobox the religion value Sunni (Ahl al-Sunna)."
  es: "Artículo de Wikipedia en urdu sobre Mohammad Zahir Shah; se utiliza únicamente para datos sobre la persona. Indica que nació el 15 de octubre de 1914 en Kabul, falleció el 23 de julio de 2007 en Kabul y fue enterrado en la colina de Maranjan. En su ficha informativa, se indica que su religión era sunita (Ahl al-Sunna)."
  fr: "Article de Wikipédia en ourdou sur Mohammad Zahir Shah; utilisé uniquement pour les informations sur l’entité. Il indique sa naissance le 15 octobre 1914 à Kaboul, son décès le 23 juillet 2007 à Kaboul et son inhumation sur la colline de Maranjan, et mentionne dans son infobox l’appartenance religieuse sunnite (Ahl al-Sunna)."
  ur: "محمد ظاہر شاہ پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 15 اکتوبر 1914 کو کابل میں ان کی پیدائش، 23 جولائی 2007 کو کابل میں ان کی موت اور مرانجن ہل پر تدفین ہوئی، اور اس کے معلوماتی خانے میں سنی ⁦(اہل السنہ)⁩ کی مذہب کی قدر کی گئی ہے۔"
  tr: "Muhammad Zahir Şah hakkında Urduca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 15 Ekim 1914'te Kabil'de doğduğunu, 23 Temmuz 2007'de Kabil'de vefat ettiğini ve Marangan Tepesi'nde defnedilmesini içerir ve bilgi kutusunda Sünni dininin değerini içerir."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang Muhammad Zahir Shah; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya pada 15 Oktober 1914 di Kabul dan kematiannya pada 23 Juli 2007 di Kabul, serta pemakamannya di Bukit Marangan, dan mencantumkan dalam infobox nilai agama Sunni."
