reliability_note: "The channel's own presence: a primary source for its identity, output and reach — not independent corroboration of biography. Its description states verbatim that it is a channel founded and supervised by Ahmed Sbei (قناة أسسها أحمد سبيع ويشرف عليها) for demonstrating the truth of Islam and the falsity of other religions; its legacy username is Albyyinah, with linked Telegram (t.me/Albyyinah) and Patreon (patreon.com/Albyyinah) accounts. In his own narration of the channel's story he dates its launch to 2014 and its first video to 16 August 2014, with about 430 videos published by January 2020. SocialCounts recorded 1,089,752 subscribers, 589 videos and 95,026,430 views for the channel on 25 October 2026; platform figures change constantly and are recorded only with their date. This is the Arabic Al-Bayyinah channel, not the English-language Bayyinah Institute channel of Nouman Ali Khan."
