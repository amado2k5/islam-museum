summary:
  ar: "قناة البينة لمقارنة الأديان والرد على الشبهات على يوتيوب؛ يذكر وصفها أنها قناة أسسها أحمد سبيع ويشرف عليها، وهدفها إثبات صحة الإسلام والرد على الشبهات."
  en: "The Al-Bayyinah channel for comparative religion and answering doubts, on YouTube; its description states that Ahmed Sbei founded it and supervises it, and that its aim is to demonstrate the truth of Islam and answer doubts."
  es: "El canal Al-Bayyinah, dedicado a la religión comparada y a la resolución de dudas, se encuentra en YouTube. Su descripción indica que Ahmed Sbei lo fundó y lo supervisa, y que su objetivo es demostrar la verdad del Islam y responder a las dudas."
  fr: "La chaîne Al-Bayyinah, consacrée à l'étude comparée des religions et à la réponse aux doutes, est présente sur YouTube. Sa description indique qu'elle a été fondée et qu'elle est dirigée par Ahmed Sbei, et que son objectif est de démontrer la vérité de l'islam et de répondre aux questions."
  ur: "یوٹیوب پر تقابلی مذہب اور شبہات کے جواب کے لیے البیینہ چینل؛ اس کی تفصیل بتاتی ہے کہ احمد صبی نے اس کی بنیاد رکھی اور اس کی نگرانی کرتا ہے، اور اس کا مقصد اسلام کی سچائی کو ظاہر کرنا اور شکوک و شبہات کا جواب دینا ہے۔"
