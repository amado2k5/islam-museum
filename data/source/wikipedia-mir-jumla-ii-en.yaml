reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). A long article resting chiefly on Jagadish Narayan Sarkar's Life of Mir Jumla and on Jadunath Sarkar's histories. It gives his birth in 1591 in Isfahan — against the Ardistan reading of Banglapedia and of Jadunath Sarkar, preserved in the person record — his clerkship and diamond trade, his Golconda vizierate (1638–1655), his Mughal grand vizierate (1656–1657) and Bengal subahdari (1660–1663), the Assam campaign and his death on 30 March 1663 at Mankachar. Its infobox files his religion as Shi'a Islam, citing Jagadish Narayan Sarkar (ed.), The Life of Mir Jumla (2nd ed., 1979), p. 361; an infobox is not a text, and the person record's shia-twelver settlement rests on Banglapedia's 'Islam, Bengal' and on Jadunath Sarkar's History of Aurangzib, vol. 1, p. 216, instead. Checked 1 November 2026."
