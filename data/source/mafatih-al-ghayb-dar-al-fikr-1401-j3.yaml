  en: "Tafsir al-Fakhr al-Razi, known as al-Tafsir al-Kabir and Mafatih al-Ghayb — part 3 (Dar al-Fikr, Beirut, 1st ed., 1981)"
  ur: "تفسیر الفخر الرازی المعروف بالتفسیر الکبیر و مفاتیح الغیب — جزء سوم (دار الفکر، بیروت، پہلا ایڈیشن، 1981ء)"
summary:
  ar: "الجزء الثالث من طبعة دار الفكر ببيروت ⁦(الطبعة الأولى 1401هـ/1981م)⁩ لتفسير الرازي، وعلى غلافها اسم المؤلف «محمد الرازي فخر الدين ابن العلامة ضياء الدين عمر المشتهر بخطيب الري» وتاريخا 544–604هـ، وأن الطبعة تمتاز بفهرس لآيات الأحكام. يبدأ بتفسير آية إسكان آدم الجنة من سورة البقرة."
  en: "Part 3 of Dar al-Fikr's Beirut printing (1st ed. 1401 AH / 1981) of al-Razi's commentary; its cover names the author 'Muhammad al-Razi Fakhr al-Din, son of the learned Diya' al-Din Umar, known as the Preacher of Rayy', gives the dates 544–604 AH and says the printing has an index of the legal verses. It opens with the verse of al-Baqara on Adam being settled in the Garden."
  ur: "دار الفکر بیروت (پہلا ایڈیشن 1401ھ / 1981ء) کی تفسیرِ رازی کی طباعت کا جزء سوم؛ اس کے سرورق پر مصنف کا نام «محمد الرازی فخر الدین ابن العلامہ ضیاء الدین عمر المشتہر بخطیب الری»، تاریخیں 544–604ھ، اور یہ کہ اس طباعت میں آیاتِ احکام کا اشاریہ ہے۔ اس کا آغاز سورۂ بقرہ کی اس آیت سے ہوتا ہے جس میں آدم کو جنت میں بسانے کا ذکر ہے۔"
