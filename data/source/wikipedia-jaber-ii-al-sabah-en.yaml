summary:
  ar: "مقالة ويكيبيديا الإنجليزية المختصرة عن جابر الثاني المبارك الصباح ⁦(1860 – 5 فبراير 1917)⁩، حاكم الكويت الثامن من 28 نوفمبر 1915 إلى وفاته، أكبر أبناء مبارك الصباح وجدّ فرع آل جابر في أسرة آل صباح، المعروف بإصلاحات اقتصادية، والحاصل على وسام نجمة الهند سنة 1916."
  en: "Short English Wikipedia article on Jaber II Al-Mubarak Al-Sabah (1860 – 5 February 1917), eighth ruler of Kuwait from 28 November 1915 until his death, eldest son of Mubarak Al-Sabah and ancestor of the Al-Jaber branch of the Al-Sabah family, known for economic reforms, and made a Companion of the Order of the Star of India in 1916."
  es: "Breve artículo en inglés de Wikipedia sobre Jaber II Al-Mubarak Al-Sabah (1860 – 5 de febrero de 1917), octavo gobernante de Kuwait desde el 28 de noviembre de 1915 hasta su muerte, hijo mayor de Mubarak Al-Sabah y antepasado de la rama Al-Jaber de la familia Al-Sabah, conocido por sus reformas económicas y nombrado Compañero de la Orden de la Estrella de la India en 1916."
  fr: "Court article de Wikipédia en anglais sur Jaber II Al-Mubarak Al-Sabah (1860 – 5 février 1917), huitième souverain du Koweït du 28 novembre 1915 jusqu'à sa mort, fils aîné de Mubarak Al-Sabah et ancêtre de la branche Al-Jaber de la famille Al-Sabah, connu pour ses réformes économiques et fait Compagnon de l'Ordre de l'Étoile de l'Inde en 1916."
  ur: "جابر II المبارک الصباح ⁦(1860 - 5 فروری 1917)⁩ پر مختصر انگریزی ویکیپیڈیا مضمون، 28 نومبر 1915 سے اپنی موت تک کویت کے آٹھویں حکمران، مبارک الصباح کے سب سے بڑے بیٹے اور الصباح خاندان کی الجابر شاخ کے آباؤ اجداد نے، جو کہ ہندوستان میں ستارہ اور اقتصادیات کے لیے جانا جاتا ہے۔ 1916."
