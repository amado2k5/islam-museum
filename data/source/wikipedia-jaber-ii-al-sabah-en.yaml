  ar: "مقالة ويكيبيديا الإنجليزية المختصرة عن جابر الثاني المبارك الصباح (1860 – 5 فبراير 1917)، حاكم الكويت الثامن من 28 نوفمبر 1915 إلى وفاته، أكبر أبناء مبارك الصباح وجدّ فرع آل جابر في أسرة آل صباح، المعروف بإصلاحات اقتصادية، والحاصل على وسام نجمة الهند سنة 1916."
  en: "Short English Wikipedia article on Jaber II Al-Mubarak Al-Sabah (1860 – 5 February 1917), eighth ruler of Kuwait from 28 November 1915 until his death, eldest son of Mubarak Al-Sabah and ancestor of the Al-Jaber branch of the Al-Sabah family, known for economic reforms, and made a Companion of the Order of the Star of India in 1916."
