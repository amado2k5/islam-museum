summary:
  ar: "الموقع الرسمي لآدم غونش، وصفحة كتبه فيه؛ تعرض مؤلفاته في تربية الأطفال مثل «التربية بلا عقاب» و«التربية بلا عقاب 2» و«لا تمرّوا بالطفل مرورًا» مع ملخصاتها وفهارسها."
  en: "The official website of Adem Güneş, in its books page; it presents his child-education works such as Cezasız Eğitim, Cezasız Eğitim 2 and Çocuk Deyip Geçmeyin with their summaries and contents."
  es: "El sitio web oficial de Adem Güneş, en su página de libros; presenta sus obras sobre educación infantil como Cezasız Eğitim, Cezasız Eğitim 2 y Çocuk Deyip Geçmeyin con sus resúmenes y contenidos."
  fr: "Le site officiel d'Adem Güneş, dans sa page livres; il présente ses travaux sur l'éducation des enfants tels que Cezasız Eğitim, Cezasız Eğitim 2 et Çocuk Deyip Geçmeyin avec leurs résumés et leurs contenus."
  ur: "Adem Güneş کی سرکاری ویب سائٹ، اس کی کتابوں کے صفحہ میں؛ یہ اس کے بچوں کی تعلیم کے کاموں جیسے Cezasız Eğitim، Cezasız Eğitim 2 اور Çocuk Deyip Geçmeyin کو ان کے خلاصے اور مواد کے ساتھ پیش کرتا ہے۔"
  tr: "Adam Günch'ün resmi web sitesi ve kitap sayfası, \"Cezasız Eğitim\", \"Cezasız Eğitim 2\" ve \"Çocuğu Geçme\" gibi çocuk yetiştirme üzerine yaptığı çalışmaları, özetleri ve dizinleriyle birlikte sergiliyor."
  id: "Situs resmi Adam Günch dan halaman bukunya menampilkan karya-karyanya tentang pengasuhan anak seperti \"Pendidikan Tanpa Hukuman,\" \"Pendidikan Tanpa Hukuman 2,\" dan \"Jangan Lewati Anak Ini,\" beserta ringkasan dan indeksnya."
