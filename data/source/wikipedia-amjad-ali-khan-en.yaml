  ar: "مقال موسوعي عن أمجد علي خان ⁦(مواليد 1945)⁩، عازف السرود الهندي ابن العازف حافظ علي خان وتلميذه."
  en: "Community-edited encyclopedia article, retrieved in full at the stated revision; it gives his birth at Gwalior on 9 October 1945, his father and teacher Hafiz Ali Khan, the family’s move to Delhi in 1957, and his Padma Shri (1975), Padma Bhushan (1991) and Padma Vibhushan (2001). It carries no religion content."
  es: "Artículo de enciclopedia editado por la comunidad, recuperado íntegramente en la revisión indicada; en él se menciona su nacimiento en Gwalior el 9 de octubre de 1945, su padre y maestro Hafiz Ali Khan, el traslado de la familia a Delhi en 1957 y sus condecoraciones Padma Shri (1975), Padma Bhushan (1991) y Padma Vibhushan (2001). No contiene contenido religioso."
  fr: "Article encyclopédique collaboratif, consulté intégralement à la version indiquée; il relate sa naissance à Gwalior le 9 octobre 1945, son père et professeur Hafiz Ali Khan, le déménagement de la famille à Delhi en 1957, ainsi que ses distinctions: Padma Shri (1975), Padma Bhushan (1991) et Padma Vibhushan (2001). Il ne contient aucun élément religieux."
  ur: "کمیونٹی میں ترمیم شدہ انسائیکلوپیڈیا مضمون، بیان کردہ نظرثانی پر مکمل طور پر بازیافت کیا گیا؛ یہ ان کی پیدائش 9 اکتوبر 1945 کو گوالیار میں ہوئی، ان کے والد اور استاد حافظ علی خان، 1957 میں خاندان کے دہلی منتقل ہوئے، اور ان کی پدم شری (1975)، پدم بھوشن (1991) اور پدم وبھوشن (2001)۔ اس میں کوئی مذہبی مواد نہیں ہے۔"
  tr: "Hint marşçısı Amjad Ali Khan (d. 1945) hakkında ansiklopedik bir makale, müzisyen Hafiz Ali Khan ve öğrencisinin oğlu."
