summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سعد الغامدي؛ تُستخدم لوقائع الكيان فقط. تذكر نشأته بالدمام وحفظه القرآن سنة 1990 وإمامته الضيف في تراويح المسجد النبوي رمضان 2009 وإمامته لجامع كانو من 2012؛ وصندوقها يعطي فقهه «حنبلي، سلفي» وتاريخ مولد 19 مايو 1967 لا يؤيده نصها."
  en: "English Wikipedia article on Saad Al-Ghamdi; used for entity facts only. It gives his upbringing at Dammam, his memorisation of the Qur'an in 1990, his guest imamate of the Tarawih prayers at the Prophet's Mosque in Ramadan 2009, and his imamate of the Kanoo Mosque from 2012; its infobox gives his jurisprudence as 'Hanbali, Salafi' and a birth date of 19 May 1967 that its own text does not support."
  es: "Artículo de la Wikipedia en inglés sobre Saad Al-Ghamdi; utilizado únicamente para datos sobre la persona. Describe su infancia en Dammam, la memorización del Corán en 1990, su imanato invitado de las oraciones de Tarawih en la Mezquita del Profeta durante el Ramadán de 2009 y su imanato de la Mezquita de Kanoo desde 2012; su ficha informativa indica que su jurisprudencia es \"Hanbali, Salafi\" y que su fecha de nacimiento es el 19 de mayo de 1967, dato que el propio texto no respalda."
  fr: "L'article de Wikipédia en anglais consacré à Saad Al-Ghamdi, utilisé uniquement pour des informations factuelles, mentionne son enfance à Dammam, sa mémorisation du Coran en 1990, son imamat invité pour les prières de Tarawih à la Mosquée du Prophète durant le Ramadan 2009 et son imamat de la Mosquée Kanoo depuis 2012. Son infobox indique qu'il est « hanbalite, salafiste » et mentionne une date de naissance (19 mai 1967) que le texte lui-même ne confirme pas."
  ur: "سعد الغامدی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں دمام میں اس کی پرورش، 1990 میں اس کا قرآن حفظ، رمضان 2009 میں مسجد نبوی میں نماز تراویح کی اس کی مہمان امامت، اور 2012 سے کنو مسجد کی امامت؛ اس کے معلوماتی خانے میں اس کی فقہ حنبلی، سلفی اور تاریخ پیدائش 19 مئی 1967 دی گئی ہے جس کی خود اس کی عبارت تائید نہیں کرتی۔"
  tr: "Saad Al-Ghamdi hakkında İngilizce Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılmıştır. Makalede, Dammam'daki yetiştirilme tarzı, 1990'da Kur'an'ı ezberlemesi, 2009 Ramazan ayında Peygamber Camii Teravieh'te misafir namaz liderliği ve 2012'den beri Kano Camii imamı olduğu belirtilmektedir; kutusunda fıkıh 'Hanbali, Selefi' ve doğum tarihi 19 Mayıs 1967 olarak yer alır, ancak metni bu metinle desteklenmemektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Saad Al-Ghamdi hanya digunakan untuk fakta entitas tersebut. Artikel tersebut menyebutkan masa kecilnya di Dammam, hafalan Al-Qur'an pada tahun 1990, kepemimpinan shalat tamu di Masjid Nabi Taraweeh pada Ramadan 2009, dan imam Masjid Kano sejak 2012; kotaknya mencantumkan yurisprudensinya sebagai 'Hanbali, Salafi,' dan tanggal lahir 19 Mei 1967, yang tidak didukung oleh teksnya."
