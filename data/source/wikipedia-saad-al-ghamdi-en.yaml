summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سعد الغامدي؛ تُستخدم لوقائع الكيان فقط. تذكر نشأته بالدمام وحفظه القرآن سنة 1990 وإمامته الضيف في تراويح المسجد النبوي رمضان 2009 وإمامته لجامع كانو من 2012؛ وصندوقها يعطي فقهه «حنبلي، سلفي» وتاريخ مولد 19 مايو 1967 لا يؤيده نصها."
  en: "English Wikipedia article on Saad Al-Ghamdi; used for entity facts only. It gives his upbringing at Dammam, his memorisation of the Qur'an in 1990, his guest imamate of the Tarawih prayers at the Prophet's Mosque in Ramadan 2009, and his imamate of the Kanoo Mosque from 2012; its infobox gives his jurisprudence as 'Hanbali, Salafi' and a birth date of 19 May 1967 that its own text does not support."
