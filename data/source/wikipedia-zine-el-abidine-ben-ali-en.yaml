summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن زين العابدين بن علي؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في حمام سوسة وتكوينه العسكري، وتوليه الرئاسة خلفا لبورقيبة سنة 1987، وفراره إلى السعودية في يناير 2011، ووفاته في جدة سنة 2019 ودفنه في البقيع بالمدينة."
  en: "English Wikipedia article on Zine El Abidine Ben Ali; used for entity facts only. It recounts his Hammam Sousse childhood and military training, his succession to Bourguiba in 1987, his flight to Saudi Arabia in January 2011, his death at Jeddah in 2019 and his burial at al-Baqi in Medina."
  es: "Artículo de la Wikipedia en inglés sobre El Abidine Ben Ali; utilizado únicamente para datos sobre la persona. Relata su infancia en Hammam Sousse y su formación militar, su sucesión al trono de Bourguiba en 1987, su huida a Arabia Saudí en enero de 2011, su muerte en Yeda en 2019 y su entierro en al-Baqi, en Medina."
  fr: "Article de Wikipédia en anglais sur El Abidine Ben Ali; utilisé uniquement à des fins d’information sur l’entité. Il relate son enfance à Hammam Sousse et sa formation militaire, son accession au trône de Bourguiba en 1987, sa fuite en Arabie saoudite en janvier 2011, sa mort à Djeddah en 2019 et son inhumation à al-Baqi à Médine."
  ur: "العابدین بن علی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں حمام سوس کے بچپن اور فوجی تربیت، 1987 میں بورگویبا کی جانشینی، جنوری 2011 میں سعودی عرب کے لیے ان کی پرواز، 2019 میں جدہ میں ان کی موت اور مدینہ میں البقی میں ان کی تدفین کا ذکر ہے۔"
  tr: "Zine El Abidine Ben Ali hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Hammam Sousse'daki yetiştirilme sürecini, askeri oluşumunu, 1987'de Bourguiba'nın yerine cumhurbaşkanlığını üstlenmesini, Ocak 2011'de Suudi Arabistan'a kaçışını, 2019'da Cidde'de ölmesini ve şehirdeki Al-Baqi'de defnedilmesini anlatır."
  id: "Artikel Wikipedia berbahasa Inggris tentang Zine El Abidine Ben Ali; hanya digunakan untuk fakta entitas. Artikel ini menceritakan masa kecilnya di Hammam Sousse, formasi militernya, pengambilalihan jabatan presiden menggantikan Bourguiba pada tahun 1987, pelariannya ke Arab Saudi pada Januari 2011, kematiannya di Jeddah pada tahun 2019, dan pemakamannya di Al-Baqi' di kota tersebut."
