  ar: "مقالة ويكيبيديا الإنجليزية عن زين العابدين بن علي؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في حمام سوسة وتكوينه العسكري، وتوليه الرئاسة خلفا لبورقيبة سنة 1987، وفراره إلى السعودية في يناير 2011، ووفاته في جدة سنة 2019 ودفنه في البقيع بالمدينة."
  en: "English Wikipedia article on Zine El Abidine Ben Ali; used for entity facts only. It recounts his Hammam Sousse childhood and military training, his succession to Bourguiba in 1987, his flight to Saudi Arabia in January 2011, his death at Jeddah in 2019 and his burial at al-Baqi in Medina."
