summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد منظور نعماني (نحو 15 كانون الأول 1905 – 4 أيار 1997)، العالم الهندي صاحب «معارف الحديث»؛ تذكر تخرجه في دار العلوم ديوبند سنة 1927 وتدريسه شيخاً للحديث في ندوة العلماء، وعضويته التأسيسية في الجماعة الإسلامية واستقالته منها سنة 1942 ثم انتسابه إلى جماعة التبليغ، ووفاته في لكناؤ، ويحمل صندوقها حقول السنة والحنفية والتلمذة على عبد القادر الرائبوري وحسين أحمد المدني."
  en: "The English Wikipedia article on Muhammad Manzoor Nomani (c. 15 December 1905 – 4 May 1997), the Indian scholar of Maariful Hadith; it records his 1927 graduation from Darul Uloom Deoband, his four years as Shaykh al-Hadith at Darul Uloom Nadwatul Ulama, his founding membership of Jamaat-e-Islami and 1942 resignation, his later affiliation with the Tablighi Jamaat, and his death at Lucknow, and its infobox carries Sunni and Hanafi fields and lists him as a disciple of Abdul Qadir Raipuri and Husain Ahmad Madani."
