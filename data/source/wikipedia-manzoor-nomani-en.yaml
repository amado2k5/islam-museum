summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد منظور نعماني ⁦(نحو 15 كانون الأول 1905 – 4 أيار 1997)⁩، العالم الهندي صاحب «معارف الحديث»؛ تذكر تخرجه في دار العلوم ديوبند سنة 1927 وتدريسه شيخاً للحديث في ندوة العلماء، وعضويته التأسيسية في الجماعة الإسلامية واستقالته منها سنة 1942 ثم انتسابه إلى جماعة التبليغ، ووفاته في لكناؤ، ويحمل صندوقها حقول السنة والحنفية والتلمذة على عبد القادر الرائبوري وحسين أحمد المدني."
  en: "The English Wikipedia article on Muhammad Manzoor Nomani (c. 15 December 1905 – 4 May 1997), the Indian scholar of Maariful Hadith; it records his 1927 graduation from Darul Uloom Deoband, his four years as Shaykh al-Hadith at Darul Uloom Nadwatul Ulama, his founding membership of Jamaat-e-Islami and 1942 resignation, his later affiliation with the Tablighi Jamaat, and his death at Lucknow, and its infobox carries Sunni and Hanafi fields and lists him as a disciple of Abdul Qadir Raipuri and Husain Ahmad Madani."
  es: "El artículo de Wikipedia en inglés sobre Muhammad Manzoor Nomani (c. 15 de diciembre de 1905 - 4 de mayo de 1997), el erudito indio de Maariful Hadith; registra su graduación en 1927 de Darul Uloom Deoband, sus cuatro años como Shaykh al-Hadith en Darul Uloom Nadwatul Ulama, su membresía fundadora de Jamaat-e-Islami y su renuncia en 1942, su afiliación posterior con Tablighi Jamaat y su muerte en Lucknow como discípulo de Abdul Qadir Raipuri y Hussain Ahmad Madani."
  fr: "L'article de Wikipédia en anglais sur Muhammad Manzoor Nomani (vers le 15 décembre 1905 – 4 mai 1997), l'érudit indien du Maariful Hadith; il enregistre son diplôme de Darul Uloom Deoband en 1927, ses quatre années en tant que Shaykh al-Hadith à Darul Uloom Nadwatul Ulama, son adhésion fondatrice du Jamaat-e-Islami et sa démission en 1942, son affiliation ultérieure au Tablighi Jamaat et sa mort à Lucknow en tant que disciple d'Abdul Qadir Raipuri et de Hussain Ahmad Madani."
  ur: "معارف حدیث کے ہندوستانی اسکالر محمد منظور نعمانی ⁦(c. 15 دسمبر 1905 - 4 مئی 1997)⁩ پر انگریزی ویکیپیڈیا کا مضمون؛ اس میں دارالعلوم دیوبند سے ان کی 1927 کی گریجویشن، دارالعلوم ندوۃ العلماء میں شیخ الحدیث کے طور پر ان کے چار سال، جماعت اسلامی کی ان کی بانی رکنیت اور ان کا 1942 میں استعفیٰ، بعد میں تبلیغی جماعت سے ان کی وابستگی، اور لکھنؤ میں احمد حسین قاریانی کے شاگرد کے طور پر ان کی موت درج ہے۔"
  tr: "Hintli âlim ve 'Ma'arif al-Hadis' kitabının yazarı Muhammed Manzur Nomani (yaklaşık 15 Aralık 1905 – 4 Mayıs 1997) hakkında İngilizce Vikipedi makalesi; 1927'de Darul Uloom Deoband'dan mezun olmasından, Alimler Konferansı'nda hadis şeyhi olarak öğretilenmesinden, İslami Grup'taki kurucu üyeliğinden, 1942'de istifasından, ardından Tabligh Cemaati'ne katılmasından ve Lucknow'daki ölümünden bahseder. Kutuda Sünnet, Hanefiye tarlaları ve Abdul Kadir al-Raiburi ile Hüseyin Ahmed al-Madani dönemindeki müridliği yer alır."
  id: "Artikel Wikipedia bahasa Inggris tentang Muhammad Manzur Nomani (sekitar 15 Desember 1905 – 4 Mei 1997), seorang ulama India dan penulis 'Ma'arif al-Hadith'; artikel ini menyebutkan kelulusannya dari Darul Uloom Deoband pada tahun 1927, pengajarannya sebagai sheikh hadis di Konferensi Ulamawan, keanggotaannya yang mendirikan Kelompok Islam, pengunduran dirinya pada tahun 1942, kemudian afiliasinya dengan Tabligh Jamaat, dan kematiannya di Lucknow. Kotaknya memuat ladang Sunnah, Hanafiyyah, dan murid-muridnya di bawah Abdul Qadir al-Raiburi dan Hussein Ahmad al-Madani."
