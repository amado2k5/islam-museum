summary:
  ar: "مقالة ويكيبيديا الروسية عن توغولوق مولدو، الأقين القرغيزي؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 10 يونيو 1860 ⁦(وبرواية أخرى 17 يونيو)⁩ ووفاته في 4 يناير 1942، وتعليمه عند ملّا القرية وفي المدرسة الإسلامية المحلية."
  en: "Russian Wikipedia article on Togolok Moldo, the Kyrgyz akyn; used for entity facts only. It gives his birth on 10 June 1860 (17 June in some data) and his death on 4 January 1942, and records his boyhood schooling under the village mullah and at the local Muslim school."
  es: "Artículo de la Wikipedia rusa sobre Togolok Moldo, el akyn kirguís; utilizado únicamente para datos sobre la persona. Indica que nació el 10 de junio de 1860 (17 de junio en algunos datos) y falleció el 4 de enero de 1942, y registra su educación infantil bajo la tutela del mulá del pueblo y en la escuela musulmana local."
  fr: "Article de Wikipédia en russe sur Togolok Moldo, l'akyn kirghize; utilisé uniquement pour les informations sur l'entité. Il indique sa naissance le 10 juin 1860 (le 17 juin selon certaines sources) et son décès le 4 janvier 1942, et relate sa scolarité auprès du mollah du village et à l'école musulmane locale."
  ur: "روسی ویکیپیڈیا مضمون ٹوگولوک مولڈو، کرغیز اکین؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کی پیدائش 10 جون 1860 ⁦(کچھ اعداد و شمار میں 17 جون)⁩ اور اس کی موت 4 جنوری 1942 کو بتائی گئی ہے، اور گاؤں کے ملا کے تحت اور مقامی مسلم اسکول میں اس کے لڑکپن کی تعلیم کو ریکارڈ کیا گیا ہے۔"
