reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and re-fetched by the recorded revision id with content verified identical. It gives him as an Egyptian educator and scholar of Armenian origin, 15 April 1842 – 21 January 1919, working for the Ministry of Public Education by 1888, citing Goldschmidt's Biographical Dictionary of Modern Egypt (2000, p. 25) for the biography. It states in its text that he was an Armenian Apostolic Christian, and that a period newspaper in 1888 noted he was one of many 'non-Muslim' Egyptians in government; an 1895 item likewise noted a 'non-Muslim' in charge of education for a predominantly Muslim population. It lists his works on landed property, public instruction, Nile valley folk tales, heraldry and England in the Sudan. It has no infobox and names no religion for him beyond that text statement."
