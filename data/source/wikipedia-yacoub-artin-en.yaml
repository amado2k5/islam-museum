summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن يعقوب آرتين؛ تُستخدم لوقائع الكيان فقط. تروي عمله في وزارة المعارف المصرية وتذكر في متنها أنه كان مسيحيًا أرمنيًا رسوليًا، وأن الصحافة في عصره لاحظت أن «غير مسلم» يتولى التعليم."
  en: "English Wikipedia article on Yacoub Artin; used for entity facts only. It recounts his work in the Egyptian Ministry of Public Education and states in its text that he was an Armenian Apostolic Christian, noting that the press of his day remarked on a 'non-Muslim' in charge of education."
  es: "Artículo de la Wikipedia en inglés sobre Yacoub Artin; utilizado únicamente para obtener información sobre la persona. Relata su labor en el Ministerio de Educación Pública egipcio y afirma que era cristiano apostólico armenio, señalando que la prensa de la época comentó que un «no musulmán» estuviera a cargo de la educación."
  fr: "Article de Wikipédia en anglais sur Yacoub Artin; utilisé uniquement à des fins d'information sur l'entité. Il relate son travail au sein du ministère égyptien de l'Éducation publique et précise qu'il était un chrétien apostolique arménien, tout en soulignant que la presse de l'époque avait remarqué la présence d'un « non-musulman » à la tête de l'éducation."
  ur: "یعقوب آرٹین پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں مصری وزارت تعلیم عامہ میں ان کے کام کا تذکرہ کیا گیا ہے اور اس کے متن میں کہا گیا ہے کہ وہ ایک آرمینیائی مسیحی تھے، یہ نوٹ کرتے ہوئے کہ ان کے دور کے پریس نے تعلیم کے انچارج ایک 'غیر مسلم' پر تبصرہ کیا تھا۔"
  tr: "Yaqub Artin hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılır. Mısır Eğitim Bakanlığı'ndaki çalışmalarını anlatır ve içinde onun bir Ermeni Hristiyan apostolik olduğunu ve zamanının basınının 'gayrimüslim'in öğretimden sorumlu olduğunu fark ettiğini belirtir."
  id: "Artikel Wikipedia bahasa Inggris tentang Yaqub Artin; hanya digunakan untuk fakta entitas. Artikel ini menceritakan pekerjaannya di Kementerian Pendidikan Mesir dan menyebutkan bahwa ia adalah seorang apostolik Kristen Armenia dan pers pada masanya memperhatikan bahwa seorang 'non-Muslim' bertanggung jawab atas pengajaran."
