summary:
  ar: "«دستور موريتانيا»، كما يُنشر عند: المجلس الدستوري الموريتاني. العنوان ونص المادة 6 مأخوذان من ملخص بحثي زُوّد به المتحف، ولم يفتح المتحف الصفحة؛ وقد أجاز المؤسس استعمال النص كما ورد في 21 نوفمبر 2026."
  en: "Constitution of Mauritania, as published at: Constitutional Council of Mauritania. The address and the wording of Article 6 come from a research summary supplied to the museum, and the museum did not open the page; the founder approved using the wording as supplied on 21 November 2026."
  ur: "Constitution of Mauritania، جیسا کہ Constitutional Council of Mauritania پر شائع ہے۔ پتہ اور دفعہ 6 کی عبارت متحف کو فراہم کردہ ایک تحقیقی خلاصے سے لی گئی ہے، اور متحف نے صفحہ نہیں کھولا؛ بانی نے 21 نومبر 2026 کو عبارت کو جیسی ملی اسی طرح استعمال کرنے کی منظوری دی۔"
  fr: "Constitution of Mauritania, tel que publié à : Constitutional Council of Mauritania. L'adresse et le texte (article 6) viennent d'un résumé de recherche remis au musée, et le musée n'a pas ouvert la page ; le fondateur a approuvé l'usage du texte tel que fourni le 21 novembre 2026."
  es: "Constitution of Mauritania, tal como se publica en: Constitutional Council of Mauritania. La dirección y el texto (artículo 6) proceden de un resumen de investigación entregado al museo, y el museo no abrió la página; el fundador aprobó usar el texto tal como se entregó el 21 de noviembre de 2026."
  tr: "\"Moritanya Anayasası,\" şu adreste yayımlanmıştır: Moritanya Anayasa Konseyi. Madde 6'nın başlığı ve metni, müze tarafından sağlanan bir araştırma özetinden alınmıştır ve müze sayfayı açmamıştır; kurucu, metnin kullanımına 21 Kasım 2026'da belirtildiği şekilde izin vermiştir."
  id: "\"Konstitusi Mauritania,\" sebagaimana diterbitkan di: Dewan Konstitusi Mauritania. Judul dan teks Pasal 6 diambil dari ringkasan penelitian yang disediakan oleh museum, dan museum tidak membuka halaman tersebut; pendiri mengizinkan penggunaan teks tersebut seperti yang dinyatakan pada 21 November 2026."
