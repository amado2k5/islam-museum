reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It distinguishes its subject from Ahmed Raza Khan Barelvi and from Syed Ahmad Khan. Its infobox gives his religion as Sunni Islam and its jurisprudence field as Hanafi, referenced to Mukhtar Ahmad Ali (2000, p. 13: the two leaders 'strictly remained within the Hanafi School') and to Waleed Ziad, Hidden Caliphate (Harvard University Press, 2021, p. 176: he 'consistently called himself a staunch Sunni and follower of the Hanafi school of law'), alongside a second value 'Independent', referenced to Muhammad Hedayetullah's McGill thesis (1968), which holds that he rejected taqlid and declared himself a ghayr muqallid. Its text likewise calls him 'a traditional Sunni who adhered to the Hanafi school' (citing Campo's Encyclopedia of Islam, 2009). Its lead calls him a Naqshbandi Sufi murshid, and its text (Metcalf 1982; Gaborieau in Islamic Mysticism Contested, 2021; Ziad 2021) attests that he was a Sufi guide who initiated disciples into the Chishti, Qadiri, Naqshbandi and Mujaddidi orders and that his Mujaddidi credentials were well established. It gives his birth at Rae Bareli on 29 November 1786 and his death at Balakot on 6 May 1831, 23 Dhu al-Qa'da 1246 AH."
