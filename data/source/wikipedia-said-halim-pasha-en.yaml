  ar: "مقالة ويكيبيديا الإنجليزية عن سعيد حليم باشا؛ تُستخدم لوقائع الكيان فقط. تعرض صدره الأعظم (1913-1917) وتوقيعه التحالف العثماني الألماني وأوامر الترحيل، ونفيه إلى مالطا وتبرئته واغتياله في روما، وتحليل كتاباته السياسية."
  en: "English Wikipedia article on Said Halim Pasha; used for entity facts only. It covers his grand vizierate (1913–1917), his signature of the Ottoman–German alliance and of the deportation orders, his Malta exile, acquittal and assassination in Rome, and an analysis of his political writings."
