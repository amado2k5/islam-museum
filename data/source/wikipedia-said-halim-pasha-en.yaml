reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Its birth date is given as a string of variants — '18 or 28 January 1865 or 19 February 1864' — and its lead dates his death 6 December 1921, against 19 February 1864 and 5 December 1921 in the Turkish article, the TDV encyclopedia and Wikidata; the person record follows the latter and records the variants. On the Armenian genocide the article itself hedges: he is 'said to be' a perpetrator, his actual involvement is 'unsure', he signed the deportation orders and told Patriarch Zaven I that reports were exaggerated, while Kuşçubaşı is quoted that he knew nothing of it — the prose carries these as attributed positions. It describes his thought (including his appeal to '(Sunni) Islam's lack of clergy' in an argument about equality) but names no school for him personally. Read in full on 24 October 2026."
