summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن تطبيق موز ⁦(موزماتش سابقًا)⁩، المراجعة 1375667698 ⁦(19 سبتمبر 2026)⁩؛ لوقائع الكيان فقط: التأسيس سنة 2015 على يد شهزاد يونس في لندن، وواي كومبينيتر 2017، وجولات التمويل، وأعداد الأعضاء المؤرخة، ودعوى مجموعة ماتش وتغيير الاسم سنة 2022."
  en: "English Wikipedia article on the Muzz app (formerly Muzmatch), revision 1375667698 (19 September 2026); entity facts only: its founding in 2015 by Shahzad Younas in London, Y Combinator in 2017, the funding rounds, the dated member counts, the Match Group case and the 2022 renaming."
  ur: "موز ایپ ⁦(سابقہ مزمیچ)⁩ پر انگریزی ویکیپیڈیا کا مضمون، نظرِ ثانی 1375667698 ⁦(19 ستمبر 2026)⁩؛ صرف ادارے کے حقائق: 2015 میں لندن میں شہزاد یونس کے ہاتھوں قیام، 2017 میں وائی کومبی نیٹر، سرمایہ کاری کے مراحل، تاریخ وار اراکین، میچ گروپ کا مقدمہ اور 2022 میں نام کی تبدیلی۔"
  es: "Artículo de la Wikipedia en inglés sobre la aplicación Muzz (anteriormente Muzmatch), revisión 1375667698 (19 de septiembre de 2026); solo datos sobre la entidad: su fundación en 2015 por Shahzad Younas en Londres, Y Combinator en 2017, las rondas de financiación, el número de miembros con fecha, el caso de Match Group y el cambio de nombre en 2022."
  fr: "Article Wikipédia en anglais sur l'application Muzz (anciennement Muzmatch), révision 1375667698 (19 septembre 2026); faits sur l'entité uniquement: sa fondation en 2015 par Shahzad Younas à Londres, Y Combinator en 2017, les tours de financement, le nombre de membres daté, l'affaire Match Group et le changement de nom en 2022."
