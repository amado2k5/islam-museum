reliability_note: "Pointer for entity facts only, used only where the article cites a source: the founding by Shahzad Younas and the renaming after a legal dispute (Wamda, 30 March 2023); his banking career and self-built first app (Business Leader 2019; Business Insider); Y Combinator in 2017 and the $1.75 million seed round with 200,000 members (TechCrunch, 3 August 2017); the 2019 shortlistings (Evening Standard; The Spectator); the $7 million Series A with 1.5 million users (TechCrunch, 26 July 2019); three million members (Global Dating Insights, 6 July 2020); the Match Group claim of February 2021 and the April 2022 ruling (Financial Times; New York Times, 21 April 2022); the relaunch as Muzz in May 2022; ten million members in 2024 (Global Dating Insights, 15 February 2024); the 2022 'Find Malik a wife' campaign (BBC, 4 January 2022; The Guardian, 21 January 2022). The lead's '21 million users' and '800,000 marriages' and the 'As of 2026' line are company claims whose citation predates them; they are not used. Read in Chrome on 6 November 2026."
