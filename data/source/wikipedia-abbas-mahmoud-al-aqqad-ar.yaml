summary:
  ar: "مقالة ويكيبيديا العربية عن عباس محمود العقاد؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في أسوان في 29 شوال 1306 هـ الموافق 28 يونيو 1889، ووفاته في 26 شوال 1383 هـ الموافق 12 مارس 1964، وسيرته ومعاركه الأدبية ومؤلفاته."
  en: "Arabic Wikipedia article on Abbas Mahmoud al-Aqqad; used for entity facts only. It gives his birth at Aswan on 29 Shawwal 1306 AH, corresponding to 28 June 1889, his death on 26 Shawwal 1383 AH, corresponding to 12 March 1964, his life, his literary battles and his works."
  es: "Artículo en árabe de la Wikipedia sobre Abbas Mahmoud al-Aqqad; se utiliza únicamente para obtener información sobre la persona. En él se indica su nacimiento en Asuán el 29 de Shawwal de 1306 AH, correspondiente al 28 de junio de 1889, su fallecimiento el 26 de Shawwal de 1383 AH, correspondiente al 12 de marzo de 1964, su vida, sus batallas literarias y sus obras."
  fr: "Article de Wikipédia en arabe sur Abbas Mahmoud al-Aqqad; utilisé uniquement pour les informations biographiques. Il indique sa naissance à Assouan le 29 Shawwal 1306 AH (correspondant au 28 juin 1889), sa mort le 26 Shawwal 1383 AH (correspondant au 12 mars 1964), sa vie, ses controverses littéraires et ses œuvres."
  ur: "عباس محمود العقاد پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی پیدائش 29 شوال 1306 ہجری کو اسوان میں ہوئی، جو کہ 28 جون 1889 کو ہوئی، ان کی وفات 26 شوال 1383 ہجری کے مطابق، 12 مارچ 1964 کو ہوئی، ان کی زندگی، ان کی ادبی لڑائیاں اور ان کے کام۔"
  tr: "Abbas Mahmoud Al-Aqqad hakkında Arapça Vikipedi makalesi yalnızca varlığın gerçekleri için kullanılmıştır. Kendisinin Asvan'da 29 Şevval 1306 H tarihinde doğduğu ve 26 Şuvval 1383 H tarihinde, yani 12 Mart 1964'te öldüğü, biyografisi, edebi mücadeleleri ve eserleriyle birlikte verilmiştir."
  id: "Artikel Wikipedia bahasa Arab tentang Abbas Mahmoud Al-Aqqad hanya digunakan untuk fakta entitas tersebut. Ia dinyatakan lahir di Aswan pada 29 Shawwal 1306 H, yang bertepatan dengan 28 Juni 1889, dan meninggal pada 26 Shawwal 1383 H, yang bertepatan dengan 12 Maret 1964, bersama dengan biografi, pertempuran sastra, dan karya-karyanya."
