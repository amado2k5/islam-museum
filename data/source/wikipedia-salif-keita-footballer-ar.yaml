  ar: "مقالة ويكيبيديا العربية عن ساليف كيتا لاعب كرة القدم (1946–2023)؛ تُستخدم لوقائع الكيان فقط. تذكر ميلاده في 12 ديسمبر 1946 بباماكو ووفاته في 2 سبتمبر 2023 وفوزه بأول جائزة أفضل لاعب أفريقي سنة 1970، ولا تذكر ديانته في نصها ولا تصنيفاتها. يوم ميلادها (12) يخالف المقالتين الإنجليزية والفرنسية (6)."
  en: "Arabic Wikipedia article on Salif Keïta the footballer (1946–2023); used for entity facts only. It gives his birth as 12 December 1946 at Bamako, his death on 2 September 2023 and his first African Footballer of the Year award in 1970, and makes no statement of his religion in its text or categories. Its birth day (the 12th) differs from the English and French articles (the 6th)."
