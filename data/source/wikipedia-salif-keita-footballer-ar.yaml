summary:
  ar: "مقالة ويكيبيديا العربية عن ساليف كيتا لاعب كرة القدم (1946–2023)؛ تُستخدم لوقائع الكيان فقط. تذكر ميلاده في 12 ديسمبر 1946 بباماكو ووفاته في 2 سبتمبر 2023 وفوزه بأول جائزة أفضل لاعب أفريقي سنة 1970، ولا تذكر ديانته في نصها ولا تصنيفاتها. يوم ميلادها (12) يخالف المقالتين الإنجليزية والفرنسية (6)."
  en: "Arabic Wikipedia article on Salif Keïta the footballer (1946–2023); used for entity facts only. It gives his birth as 12 December 1946 at Bamako, his death on 2 September 2023 and his first African Footballer of the Year award in 1970, and makes no statement of his religion in its text or categories. Its birth day (the 12th) differs from the English and French articles (the 6th)."
  es: "Artículo en árabe de la Wikipedia sobre el futbolista Salif Keïta (1946-2023); utilizado únicamente para datos biográficos. Indica que nació el 12 de diciembre de 1946 en Bamako, falleció el 2 de septiembre de 2023 y recibió su primer premio al Futbolista Africano del Año en 1970. No menciona su religión ni en el texto ni en las categorías. Su fecha de nacimiento (el 12) difiere de la de los artículos en inglés y francés (el 6)."
  fr: "Article de Wikipédia en arabe sur le footballeur Salif Keïta (1946-2023); utilisé uniquement pour les informations le concernant. Il indique sa naissance le 12 décembre 1946 à Bamako, son décès le 2 septembre 2023 et son premier titre de Ballon d’Or africain en 1970. Sa religion n’est mentionnée ni dans le texte ni dans les catégories. La date de naissance indiquée (le 12) diffère de celle des articles en anglais et en français (le 6)."
  ur: "عربی ویکیپیڈیا کا مضمون سلیف کیتا فٹبالر پر (1946–2023)؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 12 دسمبر 1946 کو بماکو میں اس کی پیدائش، 2 ستمبر 2023 کو اس کی موت اور 1970 میں اس کا پہلا افریقی فٹ بالر آف دی ایئر ایوارڈ دیتا ہے، اور اس کے متن یا زمروں میں اس کے مذہب کا کوئی بیان نہیں ہے۔ اس کا یوم پیدائش (12th) انگریزی اور فرانسیسی مضامین (6th) سے مختلف ہے۔"
  tr: "Salif Keita, futbolcu (1946–2023) hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 12 Aralık 1946'da Bamako'da doğduğu, 2 Eylül 2023'te öldüğü ve 1970'te ilk Afrika Yılın Oyuncusu ödülünü kazandığı belirtilmektedir, ancak metinde veya sıralamasında dini belirtilmez. Doğum günü (12) İngilizce ve Fransızca makalelerle çelişmektedir (6)."
  id: "Artikel Wikipedia Arab tentang Salif Keita, pesepakbola (1946–2023); hanya digunakan untuk fakta entitas. Ia disebutkan lahir pada 12 Desember 1946 di Bamako, meninggal pada 2 September 2023, dan memenangkan penghargaan Pemain Afrika Terbaik pertama pada tahun 1970, namun tidak menyebutkan agamanya dalam teks atau peringkatnya. Tanggal lahirnya (12) bertentangan dengan artikel berbahasa Inggris dan Prancis (6)."
