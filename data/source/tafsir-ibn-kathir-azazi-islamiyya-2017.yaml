summary:
  ar: "طبعة محققة لتفسير ابن كثير قوبلت على نسخ خطية ومطبوعة، تخرّج أحاديثها وآثارها وتحكم عليها في الحواشي، بتحقيق عادل بن يوسف العزازي وإشراف أحمد بن بدر الدين؛ وصفحة العنوان والحقوق تُظهر اسم المكتبة الإسلامية بالقاهرة وسنة الطبع."
  en: "A verified edition of Ibn Kathir's commentary, collated against manuscripts and printed editions, with footnotes that trace and grade its hadith and reports, verified by Adil ibn Yusuf al-Azazi under the supervision of Ahmad ibn Badr al-Din. The title page and imprint show al-Maktaba al-Islamiyya, Cairo, and the year of printing."
  ur: "ابن کثیر کی تفسیر کا محقق ایڈیشن جو قلمی اور مطبوعہ نسخوں سے ملایا گیا اور جس کے حواشی میں احادیث و آثار کی تخریج اور ان پر حکم درج ہے؛ تحقیق عادل بن یوسف العزازی، زیر نگرانی احمد بن بدر الدین۔ صفحۂ عنوان اور حقوق پر المکتبۃ الاسلامیہ قاہرہ اور سنِ طباعت درج ہے۔"
reliability_note: "Harvest item tafsir/tafsir-ibn-kathir/0012994 (5,688 scanned pages, OCR with diacritics, good quality). Distinct from source/tafsir-ibn-kathir (Dar al-Andalus) and source/tafsir-ibn-kathir-alexandria-024188. Cited page numbers are the page markers of the harvest scan (pages.json), not the printed folios: the printed folios restart in each volume (for example scan p. 4805 carries a printed folio 413 in the sura al-Muddaththir volume). The title page (scan p. 1) and imprint (scan p. 2) were read as images; the footnotes, with the editor's gradings, are the editor's work and are cited as his. Citations from this copy are paraphrased in the museum's own words, with quotations within forty words."
