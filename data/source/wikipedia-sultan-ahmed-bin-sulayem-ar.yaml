summary:
  ar: "مقالة ويكيبيديا العربية عن سلطان أحمد بن سليّم: وُلد سنة 1955 في دبي، تؤرخ لبناء المنطقة الحرة في جبل علي ورئاسته موانئ دبي العالمية وإعفائه من مناصبه في 13 شباط 2026."
  en: "Arabic Wikipedia article on Sultan Ahmed bin Sulayem; it gives his birth in 1955 at Dubai and covers the Jebel Ali Free Zone, his DP World chairmanship and his removal from his posts on 13 February 2026."
  es: "Artículo en árabe de la Wikipedia sobre el sultán Ahmed bin Sulayem; en él se indica su nacimiento en 1955 en Dubái y se habla de la Zona Franca de Jebel Ali, su presidencia de DP World y su destitución de sus cargos el 13 de febrero de 2026."
  fr: "Article de Wikipédia en arabe sur le sultan Ahmed bin Sulayem; il indique sa naissance en 1955 à Dubaï et aborde la zone franche de Jebel Ali, sa présidence de DP World et sa destitution de ses fonctions le 13 février 2026."
  ur: "سلطان احمد بن سلیم پر عربی ویکیپیڈیا کا مضمون؛ یہ ان کی پیدائش 1955 میں دبئی میں ہوئی اور جیبل علی فری زون، ان کی ڈی پی ورلڈ کی چیئرمین شپ اور 13 فروری 2026 کو ان کے عہدوں سے ہٹائے جانے کا احاطہ کرتا ہے۔"
  tr: "Sultan Ahmed bin Sulayem hakkında Arapça Wikipedia makalesi: 1955 yılında Dubai'de doğan bu makale, Jebel Ali Serbest Bölgesi'nin inşasını, DP World başkanlığını ve 13 Şubat 2026'da görevden alınışını anlatıyor."
  id: "Artikel Wikipedia berbahasa Arab tentang Sultan Ahmed bin Sulayem: Lahir pada tahun 1955 di Dubai, artikel ini mengisahkan pembangunan Zona Bebas Jebel Ali, masa kepresidenannya di DP World, dan pemecatannya dari jabatannya pada 13 Februari 2026."
