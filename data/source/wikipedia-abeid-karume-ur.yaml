summary:
  ar: "مقالة ويكيبيديا الأردية عن عبيد كرومي؛ تُستخدم لوقائع الكيان فقط. تروي بالرواية نفسها دعواه الولادة في مويرا سنة 1905 وعمله بحارا، وثورة زنجبار والاتحاد مع تنجانيقا وصيرورته أول نائب لرئيس تنزانيا. لا تسمي متنها دينا ولا مدرسة له."
  en: "Urdu Wikipedia article on Abeid Karume; used for entity facts only. It gives the same account as the Arabic article: his claimed birth at Mwera in 1905, his work as a seaman, the Zanzibar Revolution, the union with Tanganyika and his first vice-presidency of Tanzania. Its text names no religion or school for him."
  es: "Artículo de Wikipedia en urdu sobre Abeid Karume; se utiliza únicamente para datos sobre la persona. Ofrece la misma información que el artículo en árabe: su supuesto nacimiento en Mwera en 1905, su trabajo como marinero, la Revolución de Zanzíbar, la unión con Tanganica y su primer mandato como vicepresidente de Tanzania. El texto no menciona ninguna religión ni escuela a la que perteneciera."
  fr: "L'article de Wikipédia en ourdou consacré à Abeid Karume est utilisé uniquement à titre informatif. Il reprend les éléments de l'article en arabe: sa naissance présumée à Mwera en 1905, son métier de marin, la révolution de Zanzibar, l'union avec le Tanganyika et sa première vice-présidence de la Tanzanie. Le texte ne mentionne ni sa religion ni son école."
  ur: "عابد کرومی پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ عربی مضمون کی طرح ہی بیان کرتا ہے: 1905 میں مویرا میں اس کی پیدائش کا دعویٰ کیا گیا، سمندری آدمی کے طور پر اس کا کام، زنجبار انقلاب، تانگانیکا کے ساتھ اتحاد اور تنزانیہ کی اس کی پہلی نائب صدر۔ اس کے متن میں اس کے لیے کسی مذہب یا اسکول کا نام نہیں ہے۔"
