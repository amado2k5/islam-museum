  ar: "مقالة ويكيبيديا الأردية عن عبيد كرومي؛ تُستخدم لوقائع الكيان فقط. تروي بالرواية نفسها دعواه الولادة في مويرا سنة 1905 وعمله بحارا، وثورة زنجبار والاتحاد مع تنجانيقا وصيرورته أول نائب لرئيس تنزانيا. لا تسمي متنها دينا ولا مدرسة له."
  en: "Urdu Wikipedia article on Abeid Karume; used for entity facts only. It gives the same account as the Arabic article: his claimed birth at Mwera in 1905, his work as a seaman, the Zanzibar Revolution, the union with Tanganyika and his first vice-presidency of Tanzania. Its text names no religion or school for him."
