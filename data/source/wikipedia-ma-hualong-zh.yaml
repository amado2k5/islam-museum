summary:
  ar: "مقالة ويكيبيديا الصينية عن ما هوالونغ؛ تُستخدم لوقائع الكيان فقط. تذكر أنه كان في شبابه أهونغًا ⁦(إمامًا)⁩، ولُقّب بـ«السيد الثالث عشر» (十三太爷) في سلسلة الجهرية، وكان كبير معلّمي (大教主) الطريقة الجهرية، وتحمل اسم طريقه الصوفي «طابرة الله»، وتؤرّخ إعدامه ذبحًا بطيئًا مع ابنه ما ياوبانغ في ووچونغ سنة 1871 بعد استسلامه في كانون الثاني من تلك السنة."
  en: "Chinese Wikipedia article on Ma Hualong; used for entity facts only. It records that in his early years he was an ahong, was known as the 'Thirteenth Master' (Shisan Taiye) in the Jahriyya transmission, was grand jiaozhu of the Jahriyya, and bore the Sufi path-name Tabirat Allah; it dates his execution by slow slicing, with his son Ma Yaobang, at Wuzhong in 1871 after his surrender in January of that year."
  es: "Artículo de la Wikipedia en chino sobre Ma Hualong; utilizado únicamente para datos sobre la persona. En él se registra que en sus primeros años fue un ahong, conocido como el \"Decimotercer Maestro\" (Shisan Taiye) en la transmisión Jahriyya, fue gran jiaozhu de la Jahriyya y ostentaba el nombre de camino sufí Tabirat Allah; se fecha su ejecución por decapitación lenta, junto con su hijo Ma Yaobang, en Wuzhong en 1871, tras su rendición en enero de ese mismo año."
  fr: "Article de Wikipédia en chinois sur Ma Hualong; utilisé uniquement pour les informations sur l’entité. Il indique que dans sa jeunesse, il était un ahong, connu comme le « Treizième Maître » (Shisan Taiye) dans la transmission Jahriyya, grand jiaozhu de la Jahriyya, et portait le nom de voie soufie Tabirat Allah; il date son exécution par la décapitation, avec son fils Ma Yaobang, à Wuzhong en 1871 après sa reddition en janvier de cette année-là."
