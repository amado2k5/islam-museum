summary:
  ar: "مقالة ويكيبيديا الصينية عن ما هوالونغ؛ تُستخدم لوقائع الكيان فقط. تذكر أنه كان في شبابه أهونغًا (إمامًا)، ولُقّب بـ«السيد الثالث عشر» (十三太爷) في سلسلة الجهرية، وكان كبير معلّمي (大教主) الطريقة الجهرية، وتحمل اسم طريقه الصوفي «طابرة الله»، وتؤرّخ إعدامه ذبحًا بطيئًا مع ابنه ما ياوبانغ في ووچونغ سنة 1871 بعد استسلامه في كانون الثاني من تلك السنة."
  en: "Chinese Wikipedia article on Ma Hualong; used for entity facts only. It records that in his early years he was an ahong, was known as the 'Thirteenth Master' (Shisan Taiye) in the Jahriyya transmission, was grand jiaozhu of the Jahriyya, and bore the Sufi path-name Tabirat Allah; it dates his execution by slow slicing, with his son Ma Yaobang, at Wuzhong in 1871 after his surrender in January of that year."
