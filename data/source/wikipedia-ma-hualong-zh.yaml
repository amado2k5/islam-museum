reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026, fetched through the MediaWiki API by its recorded revision id with the returned id asserted equal. An independent Chinese tradition, not a translation of the English article: it cites a Ningxia government page (2008), Li Enhan's study of the Tongzhi-era campaigns and Huang Zhenglin (2008) for the massacres at Lingzhou, and the Encyclopaedia of Islam Three entry for his path-name. Its birth–death filing gives the year 1810 and lunar-style days (15 December; 13 January) that its own text, which dates his surrender and execution by the Chinese lunar calendar (Tongzhi 9/11/16 and 10/1/13), does not support as Gregorian days; the days are not followed. Its categories file him under the Jahriyya （哲合忍耶）; categories are filings, not attestation."
