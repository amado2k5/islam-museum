summary:
  ar: مقالة ويكيبيديا الإنجليزية عن محمد أمين رسول زاده؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في نوخاني في 31 يناير 1884 لأبيه الآخوند الحاج ملا علي أكبر، وتأسيسه تنظيم «همت» وحزب «مساوات»، ورئاسته المجلس الوطني الأذربيجاني وإعلان جمهورية أذربيجان الديمقراطية في 28 مايو 1918، وتحريره «يني قفقاسيا» في المنفى، ووفاته في أنقرة في 6 مارس 1955 ودفنه في مقبرة جبه جي عصري.
  en: English Wikipedia article on Mahammad Amin Rasulzade; used for entity facts only. It gives his birth at Novkhany on 31 January 1884 to the akhund Haji Molla Alakbar, his founding of the Hummet organisation and the Musavat party, his chairmanship of the Azerbaijani National Council and the proclamation of the Azerbaijan Democratic Republic on 28 May 1918, his exile editorship of Yeni Kafkasya, and his death at Ankara on 6 March 1955 with burial at Cebeci Asri Cemetery.
  es: "Artículo de la Wikipedia en inglés sobre Mahammad Amin Rasulzade; utilizado únicamente para datos biográficos. En él se indica su nacimiento en Novkhany el 31 de enero de 1884, hijo del akhund Haji Molla Alakbar; la fundación de la organización Hummet y del partido Musavat; su presidencia del Consejo Nacional de Azerbaiyán y la proclamación de la República Democrática de Azerbaiyán el 28 de mayo de 1918; su labor como editor en el exilio del periódico Yeni Kafkasya; y su fallecimiento en Ankara el 6 de marzo de 1955, siendo enterrado en el cementerio de Cebeci Asri."
  fr: "Article de Wikipédia en anglais sur Mahammad Amin Rasulzade; utilisé uniquement pour les informations biographiques. Il mentionne sa naissance à Novkhany le 31 janvier 1884, fils de l’akhund Haji Molla Alakbar, la fondation de l’organisation Hummet et du parti Musavat, sa présidence du Conseil national azerbaïdjanais et la proclamation de la République démocratique d’Azerbaïdjan le 28 mai 1918, son poste de rédacteur en chef du journal Yeni Kafkasya pendant son exil, et sa mort à Ankara le 6 mars 1955, avec inhumation au cimetière Cebeci Asri."
  ur: "محمد امین رسول زادے پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس نے نوخانی میں 31 جنوری 1884 کو آخوند حاجی مولا الکبر کی پیدائش، ان کی ہمت تنظیم اور مساوات پارٹی کی بنیاد رکھی، ان کی آذربائیجانی نیشنل کونسل کی چیئرمین شپ اور 28 مئی 1918 کو آذربائیجان جمہوری جمہوریہ کا اعلان، ان کی جلاوطنی کی ادارت، ینی کاف کی وفات، 59 مارچ 1918 کو ان کی وفات۔ سیبیکی اسری قبرستان میں تدفین۔"
  tr: "Muhammed Emin Rasulzadeh hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Nokhani'de babası Akhund Hacı Molla Ali Akbar'ın 31 Ocak 1884'te doğması, 'Hemmt' örgütü ve 'Musawat' partisinin kuruluşuna, Azerbaycan Ulusal Konseyi başkanlığına, 28 Mayıs 1918'de Azerbaycan Demokratik Cumhuriyeti'nin ilanına, sürgünde 'Yeni Kafkasya'nın özgürlüğüne, 6 Mart 1955'te Ankara'da ölümüne ve Cebeci Asri mezarlığına defnedilmesine bağlanır."
  id: "Artikel Wikipedia bahasa Inggris tentang Mohammad Amin Rasulzadeh; digunakan hanya untuk fakta entitas. Kelahirannya di Nokhani pada 31 Januari 1884, dari ayahnya, Akhund Haj Molla Ali Akbar, dikaitkan dengan pendirian organisasi 'Hemmt' dan partai 'Musawat', kepemimpinannya di Dewan Nasional Azerbaijan, deklarasi Republik Demokratik Azerbaijan pada 28 Mei 1918, pembebasan 'Kaukasus Yeni' di pengasingan, kematiannya di Ankara pada 6 Maret 1955, dan pemakamannya di pemakaman Cebeci Asri."
