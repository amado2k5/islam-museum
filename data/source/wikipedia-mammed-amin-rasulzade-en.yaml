summary:
  ar: مقالة ويكيبيديا الإنجليزية عن محمد أمين رسول زاده؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في نوخاني في 31 يناير 1884 لأبيه الآخوند الحاج ملا علي أكبر، وتأسيسه تنظيم «همت» وحزب «مساوات»، ورئاسته المجلس الوطني الأذربيجاني وإعلان جمهورية أذربيجان الديمقراطية في 28 مايو 1918، وتحريره «يني قفقاسيا» في المنفى، ووفاته في أنقرة في 6 مارس 1955 ودفنه في مقبرة جبه جي عصري.
  en: English Wikipedia article on Mahammad Amin Rasulzade; used for entity facts only. It gives his birth at Novkhany on 31 January 1884 to the akhund Haji Molla Alakbar, his founding of the Hummet organisation and the Musavat party, his chairmanship of the Azerbaijani National Council and the proclamation of the Azerbaijan Democratic Republic on 28 May 1918, his exile editorship of Yeni Kafkasya, and his death at Ankara on 6 March 1955 with burial at Cebeci Asri Cemetery.
