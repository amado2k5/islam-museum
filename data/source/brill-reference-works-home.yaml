summary:
  ar: "الصفحة «Brill Reference Works, home page (named in the file for the Encyclopaedia of Islam)» في Brill؛ ذُكرت في ملف بحث قُدّم إلى المتحف في 21 نوفمبر 2026، ولم يفتح المتحف الصفحة، ووافق المؤسس على استعمال الملف دون إعادة تحقق. تُستعمل في: مراجع الأسماء والأنساب والتراجم وقواعد الاستناد."
  en: "The page \"Brill Reference Works, home page (named in the file for the Encyclopaedia of Islam)\" (Brill), named in a research file supplied to the museum on 21 November 2026; the museum did not open the page, and the founder approved using the file without re-verification. Used for: the reference works and authority files on names, genealogies and biographies."
  ur: "صفحہ «Brill Reference Works, home page (named in the file for the Encyclopaedia of Islam)» (Brill)؛ یہ عجائب گھر کو 21 نومبر 2026ء کو دی گئی تحقیقی فائل میں مذکور ہے، عجائب گھر نے صفحہ نہیں کھولا اور بانی نے دوبارہ تصدیق کے بغیر فائل کے استعمال کی منظوری دی۔ استعمال: ناموں، انساب اور تراجم کے مراجع اور اتھارٹی ریکارڈ۔"
  fr: "La page « Brill Reference Works, home page (named in the file for the Encyclopaedia of Islam) » (Brill), citée dans un fichier de recherche remis au musée le 21 novembre 2026 ; le musée n'a pas ouvert la page, et le fondateur a approuvé l'usage du fichier sans nouvelle vérification. Utilisée pour : les ouvrages de référence et fichiers d'autorité sur les noms, les généalogies et les biographies."
  es: "La página «Brill Reference Works, home page (named in the file for the Encyclopaedia of Islam)» (Brill), citada en un archivo de investigación entregado al museo el 21 de noviembre de 2026; el museo no abrió la página, y el fundador aprobó usar el archivo sin volver a verificar. Usada para: las obras de referencia y archivos de autoridad sobre nombres, genealogías y biografías."
  tr: "«Brill Referans Eserleri, ana sayfa (İslam Ansiklopedisi dosyasında adı geçen)» sayfası Brill'de; 21 Kasım 2026'da müzeye sunulan bir araştırma dosyasında bahsedilmiştir, ancak müze sayfayı açmamış ve kurucu dosyanın yeniden doğrulama yapılmadan kullanımını onaylamıştır. Kullanım alanı: isimler, soy kütüğü, biyografi ve atıf kuralları için referanslar."
  id: "Halaman «Brill Reference Works, halaman utama (dinamai dalam berkas Ensiklopedia Islam)» di Brill; disebutkan dalam berkas penelitian yang diserahkan ke museum pada 21 November 2026, tetapi museum tidak membuka halaman tersebut, dan pendiri menyetujui penggunaan berkas tanpa verifikasi ulang. Digunakan dalam: referensi untuk nama, silsilah, biografi, dan aturan sitasi."
