summary:
  ar: "مدخل «طراز» في موسوعة TDV الإسلامية التركية: الشريط المكتوب على الثياب الثمينة ودور الطراز التي تنسجه، وأصوله عند ملوك الفرس والروم، وأمر عبد الملك بن مروان بترك الطراز اليوناني في مصر وكتابة التوحيد مكانه، ثم دار الطراز وصاحب الطراز عند العباسيين والأمويين في الأندلس والفاطميين، وأثره في صقلية النورمانية."
  en: "The TDV İslâm Ansiklopedisi entry 'Tırâz': the inscribed band on fine garments and the workshops that wove it, its origins under the Persian and Byzantine rulers, Abd al-Malik ibn Marwan's order to drop the Greek tiraz in Egypt and weave the declaration of God's oneness instead, then the tiraz house and its master under the Abbasids, the Umayyads of al-Andalus and the Fatimids, and its afterlife in Norman Sicily."
  ur: "ٹی ڈی وی اسلامی انسائیکلوپیڈیا کا مدخل «طراز»: قیمتی کپڑوں پر لکھی ہوئی پٹی اور اسے بننے والے کارخانے، فارس اور روم کے بادشاہوں کے ہاں اس کی ابتدا، عبد الملک بن مروان کا مصر میں یونانی طراز ترک کر کے توحید کا کلمہ بننے کا حکم، پھر عباسیوں، اندلس کے امویوں اور فاطمیوں کے ہاں دار الطراز اور صاحب الطراز، اور نارمن صقلیہ میں اس کا اثر۔"
