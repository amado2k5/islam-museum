summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن علي أحمد ملا؛ تعطي مولده في 5 يوليو 1947، وأذانه في الحرم في الرابعة عشرة نيابة عن أقاربه، وتعيينه الرسمي في 1984، وابنه عاطف الذي أذّن أول مرة في الحرم في 4 أبريل 2022؛ وتستند إلى عرب نيوز ⁦(2003 و2021)⁩."
  en: "English Wikipedia article on Ali Ahmed Mullah; it gives birth on 5 July 1947, his adhan at the Haram from fourteen in place of his relatives, official appointment in 1984, and his son Atef's first adhan there on 4 April 2022; it cites Arab News (2003, 2021). The article carries a more-citations-needed tag."
  es: "Artículo de la Wikipedia en inglés sobre Ali Ahmed Mullah; indica que nació el 5 de julio de 1947, realizó su llamada a la oración (adhan) en el Haram a los catorce años en lugar de sus familiares, fue nombrado oficialmente en 1984 y su hijo Atef realizó allí su primera llamada a la oración el 4 de abril de 2022; cita a Arab News (2003, 2021). El artículo lleva la etiqueta \"se necesitan más citas\"."
  fr: "L'article de Wikipédia en anglais consacré à Ali Ahmed Mullah indique sa naissance le 5 juillet 1947, son premier appel à la prière (adhan) au Haram dès l'âge de quatorze ans, en remplacement de ses proches, sa nomination officielle en 1984 et le premier appel à la prière (adhan) de son fils Atef au Haram le 4 avril 2022. L'article cite Arab News (2003, 2021) et comporte la mention « citations supplémentaires nécessaires »."
