  ar: "مقالة ويكيبيديا الإنجليزية عن يايا توريه؛ تُستخدم لوقائع الكيان فقط. تروي سيرة لاعب الوسط العاجي المولود في 13 مايو 1983 ببواكي: موسم الألقاب الستة مع برشلونة 2009 ولقب مانشستر سيتي الأول منذ 44 سنة 2012، وأفضل لاعب أفريقي أربع سنوات متتالية، و100 مباراة مع ساحل العاج ولقب أمم أفريقيا 2015 قائدًا، وتذكر في حياته الشخصية أنه مسلم."
  en: "English Wikipedia article on Yaya Touré; used for entity facts only. It records the Ivorian midfielder born 13 May 1983 at Bouaké: the 2009 six-trophy season with Barcelona, Manchester City's first league title in 44 years in 2012, African Footballer of the Year four years running, 100 Ivory Coast caps and the 2015 Africa Cup of Nations title as captain, and states in its personal life section that he is Muslim."
