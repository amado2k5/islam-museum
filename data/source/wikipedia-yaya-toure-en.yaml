summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن يايا توريه؛ تُستخدم لوقائع الكيان فقط. تروي سيرة لاعب الوسط العاجي المولود في 13 مايو 1983 ببواكي: موسم الألقاب الستة مع برشلونة 2009 ولقب مانشستر سيتي الأول منذ 44 سنة 2012، وأفضل لاعب أفريقي أربع سنوات متتالية، و100 مباراة مع ساحل العاج ولقب أمم أفريقيا 2015 قائدًا، وتذكر في حياته الشخصية أنه مسلم."
  en: "English Wikipedia article on Yaya Touré; used for entity facts only. It records the Ivorian midfielder born 13 May 1983 at Bouaké: the 2009 six-trophy season with Barcelona, Manchester City's first league title in 44 years in 2012, African Footballer of the Year four years running, 100 Ivory Coast caps and the 2015 Africa Cup of Nations title as captain, and states in its personal life section that he is Muslim."
  es: "Artículo de la Wikipedia en inglés sobre Yaya Touré; utilizado únicamente para datos sobre la persona. En él se registran los logros del centrocampista marfileño nacido el 13 de mayo de 1983 en Bouaké: la temporada de seis trofeos de 2009 con el Barcelona, el primer título de liga del Manchester City en 44 años en 2012, el premio al Futbolista Africano del Año durante cuatro años consecutivos, 100 partidos con la selección de Costa de Marfil y el título de la Copa Africana de Naciones de 2015 como capitán, y en la sección de su vida personal se indica que es musulmán."
  fr: "Article Wikipédia en anglais sur Yaya Touré; utilisé uniquement pour les informations relatives à l'entité. Il retrace le parcours du milieu de terrain ivoirien né le 13 mai 1983 à Bouaké: la saison 2009, riche de six trophées avec Barcelone; le premier titre de champion d'Angleterre de Manchester City en 44 ans en 2012; le titre de Joueur africain de l'année quatre années de suite; ses 100 sélections en équipe nationale de Côte d'Ivoire; et le titre de champion d'Afrique des Nations 2015 en tant que capitaine. La section consacrée à sa vie privée précise qu'il est musulman."
  ur: "Yaya Touré پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں آئیورین مڈفیلڈر کا ریکارڈ ہے جو 13 مئی 1983 کو Bouaké میں پیدا ہوا: بارسلونا کے ساتھ 2009 کا چھ ٹرافی کا سیزن، مانچسٹر سٹی کا 2012 میں 44 سالوں میں پہلا لیگ ٹائٹل، افریقی فٹ بالر آف دی ایئر چار سال چل رہا ہے، 100 آئیوری کوسٹ کیپس اور 2015 کے کپتان کے طور پر اس کی ذاتی زندگی میں کپ کا حصہ ہے، وہ مسلمان ہے."
