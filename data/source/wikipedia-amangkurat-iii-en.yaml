reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It gives his birth name Raden Mas Sutikna, his father Amangkurat II (he was the king's only child), his nickname Pangeran Kencet, and no year of birth. It records his reign 1703-1705, the First Javanese War of Succession against his half-uncle Prince Puger, his flight east, his surrender at Surabaya in 1708, his exile to Dutch Ceylon and his death there in 1734. It names no school or order for the man himself. Checked 1 November 2026."
