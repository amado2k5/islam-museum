label: { en: "UK Parliament (2021): Rehman Chishti MP — Islam" }
summary:
  ar: "نص رحمان تشيشتي بصيغة المتكلم على موقع البرلمان البريطاني لأسبوع الأديان 2021: يقول إن إيمانه كان دائمًا جزءًا مهمًا من حياته، وإن قيم دينه تشكّل حياته داخل البرلمان وخارجه، وإنه أدى قسم الولاء على القرآن."
  en: "Rehman Chishti's first-person piece on the UK Parliament website for Inter Faith Week 2021: he writes that his faith has always been an important part of his life, that the tenets and values of his faith shape his life inside and outside Parliament, and that he took the oath of allegiance on the Quran."
  es: "En su artículo en primera persona publicado en la página web del Parlamento británico con motivo de la Semana Interreligiosa de 2021, Rehman Chishti escribe que su fe siempre ha sido una parte importante de su vida, que los principios y valores de su fe dan forma a su vida dentro y fuera del Parlamento, y que prestó juramento de lealtad sobre el Corán."
  fr: "Dans son témoignage à la première personne publié sur le site web du Parlement britannique à l'occasion de la Semaine interreligieuse 2021, Rehman Chishti écrit que sa foi a toujours été une partie importante de sa vie, que les principes et les valeurs de sa foi façonnent sa vie à l'intérieur et à l'extérieur du Parlement, et qu'il a prêté serment d'allégeance sur le Coran."
  ur: "رحمٰن چشتی کا یو کے پارلیمنٹ کی ویب سائٹ پر انٹر فیتھ ویک 2021 کے لیے پہلا فرد: وہ لکھتے ہیں کہ ان کا ایمان ہمیشہ ان کی زندگی کا ایک اہم حصہ رہا ہے، کہ ان کے عقیدے کے اصول اور اقدار پارلیمنٹ کے اندر اور باہر ان کی زندگی کو تشکیل دیتے ہیں، اور یہ کہ انہوں نے قرآن پر بیعت کا حلف اٹھایا۔"
  tr: "Rahman Chishti'nin İngiliz Parlamentosu'nun Din Haftası 2021 web sitesindeki birinci şahıs metni: İnancının her zaman hayatının önemli bir parçası olduğunu, dininin değerlerinin hem Parlamento içinde hem dışında hayatını şekillendirdiğini ve Kur'an'a bağlılık yemini ettiğini söylüyor."
  id: "Teks orang pertama Rahman Chishti di situs Religion Week Parlemen Inggris 2021: Ia mengatakan bahwa imannya selalu menjadi bagian penting dalam hidupnya, bahwa nilai-nilai agamanya membentuk hidupnya baik di dalam maupun di luar Parlemen, dan bahwa ia telah mengucapkan sumpah setia kepada Al-Qur'an."
