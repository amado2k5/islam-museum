reliability_note: "First-person statement by Rehman Chishti himself, published on the official UK Parliament website as part of its Roots to Parliament series for Inter Faith Week 2021, and read in full on 1 November 2026. In his own words: 'my faith has always been an important part of my life', 'The key tenets and values of my faith, including kindness, compassion, respect and acceptance of one another, shape my life both inside and outside of Parliament', and 'I took the oath of allegiance on the Quran'. The piece is titled 'Islam' and attests his own Muslim faith and practice generically; no school or order is named. His statement that he is the son of an imam is family background and was not used as evidence of his own faith."
