  ar: "نص رحمان تشيشتي بصيغة المتكلم على موقع البرلمان البريطاني لأسبوع الأديان 2021: يقول إن إيمانه كان دائمًا جزءًا مهمًا من حياته، وإن قيم دينه تشكّل حياته داخل البرلمان وخارجه، وإنه أدى قسم الولاء على القرآن."
  en: "Rehman Chishti's first-person piece on the UK Parliament website for Inter Faith Week 2021: he writes that his faith has always been an important part of his life, that the tenets and values of his faith shape his life inside and outside Parliament, and that he took the oath of allegiance on the Quran."
