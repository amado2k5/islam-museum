summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد يعقوب خان؛ تُستخدم لوقائع الكيان فقط. تعطي مولده سنة 1849 في قلعة غزنة ووفاته في شيملا بالهند في 15 نوفمبر 1923، وأباه شير علي خان، وتعيينه واليا على هراة سنة 1863 وتمرده وسجنه، وإمارته القصيرة ⁦(21 فبراير - 12 أكتوبر 1879)⁩ وتوقيعه معاهدة غاندماك ونفيه إلى الهند. لا تعطي أي قيمة للدين."
  en: "English Wikipedia article on Mohammad Yaqub Khan; used for entity facts only. It gives his birth in 1849 at the Citadel of Ghazni, his death at Shimla, India on 15 November 1923, his father Sher Ali Khan, his appointment as governor of Herat in 1863, his rebellion and imprisonment, his brief emirate (21 February – 12 October 1879), his signing of the Treaty of Gandamak and his exile to India. It gives no religion value."
  es: "Artículo de la Wikipedia en inglés sobre Mohammad Yaqub Khan; utilizado únicamente para datos biográficos. Describe su nacimiento en 1849 en la Ciudadela de Ghazni, su muerte en Shimla, India, el 15 de noviembre de 1923, quién fue su padre, Sher Ali Khan, su nombramiento como gobernador de Herat en 1863, su rebelión y encarcelamiento, su breve emirato (del 21 de febrero al 12 de octubre de 1879), la firma del Tratado de Gandamak y su exilio a la India. No incluye información sobre su contenido religioso."
  fr: "Article de Wikipédia en anglais sur Mohammad Yaqub Khan; utilisé uniquement pour les informations biographiques. Il mentionne sa naissance en 1849 à la citadelle de Ghazni, sa mort à Shimla (Inde) le 15 novembre 1923, son père Sher Ali Khan, sa nomination comme gouverneur d’Hérat en 1863, sa rébellion et son emprisonnement, son bref émirat (21 février – 12 octobre 1879), la signature du traité de Gandamak et son exil en Inde. Aucune mention de sa religion n’est faite."
  ur: "محمد یعقوب خان پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1849 میں غزنی کے قلعہ میں ان کی پیدائش، 15 نومبر 1923 کو شملہ، ہندوستان میں ان کی موت، ان کے والد شیر علی خان، 1863 میں ہرات کے گورنر کے طور پر ان کی تقرری، ان کی بغاوت اور قید، ان کی مختصر امارت ⁦(21 فروری - 12 اکتوبر 1879)⁩، ہندوستان سے اس کے سفر پر دستخط کرنے اور اس کے ہندوستان سے تعلق رکھنے کے لیے دستخط کیے گئے۔ یہ مذہب کی کوئی قدر نہیں کرتا۔"
  tr: "Muhammed Yaqub Han hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1849'da Gazni Kalesi'nde doğduğunu ve 15 Kasım 1923'te Hindistan'ın Şimla kentinde öldüğünü, babası Şer Ali Han'ı, 1863'te Herat valisi olarak atanmasını, isyanı ve hapsedilmesini, kısa prensliğini (21 Şubat - 12 Ekim 1879), Gandmak Antlaşması'nı imzalamasını ve Hindistan'a sürgününü anlatır. Dine hiçbir değer katmaz."
  id: "Artikel Wikipedia bahasa Inggris tentang Muhammad Yaqub Khan; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya pada tahun 1849 di Benteng Ghazni dan kematiannya di Shimla, India pada 15 November 1923, ayahnya Sher Ali Khan, pengangkatannya sebagai gubernur Herat pada tahun 1863, pemberontakan dan penahanannya, kekuasaan singkatnya (21 Februari - 12 Oktober 1879), penandatanganan Perjanjian Gandmak, dan pengasingannya ke India. Artikel ini tidak memberikan nilai pada agama."
