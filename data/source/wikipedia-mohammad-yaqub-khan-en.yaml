  ar: "مقالة ويكيبيديا الإنجليزية عن محمد يعقوب خان؛ تُستخدم لوقائع الكيان فقط. تعطي مولده سنة 1849 في قلعة غزنة ووفاته في شيملا بالهند في 15 نوفمبر 1923، وأباه شير علي خان، وتعيينه واليا على هراة سنة 1863 وتمرده وسجنه، وإمارته القصيرة (21 فبراير - 12 أكتوبر 1879) وتوقيعه معاهدة غاندماك ونفيه إلى الهند. لا تعطي أي قيمة للدين."
  en: "English Wikipedia article on Mohammad Yaqub Khan; used for entity facts only. It gives his birth in 1849 at the Citadel of Ghazni, his death at Shimla, India on 15 November 1923, his father Sher Ali Khan, his appointment as governor of Herat in 1863, his rebellion and imprisonment, his brief emirate (21 February – 12 October 1879), his signing of the Treaty of Gandamak and his exile to India. It gives no religion value."
