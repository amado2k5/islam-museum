summary:
  ar: "مقال في مقرناس ⁦(المجلد 8، 1991)⁩ يختبر منهج كريسويل في تأريخ الأقواس بحدة مدبّها ويوثق أمثلة بيزنطية سابقة على الإسلام ⁦(جسر كرة مجرة وسانت أبوليناريه إن كلاسه برافينا وآيا إيريني بالقسطنطينية)⁩."
  en: "A Muqarnas 8 (1991) article testing Creswell's method of dating early Muslim arches by their acuteness and documenting pre-Islamic Byzantine pointed examples: the Karamagara bridge, Sant'Apollinare in Classe at Ravenna and Hagia Irene in Constantinople."
  es: "Un artículo de Muqarnas 8 (1991) ponía a prueba el método de Creswell para datar los primeros arcos musulmanes según su agudeza y documentaba ejemplos bizantinos preislámicos de arcos apuntados: el puente de Karamagara, Sant'Apollinare in Classe en Rávena y Hagia Irene en Constantinopla."
  fr: "Un article de Muqarnas 8 (1991) testant la méthode de Creswell pour dater les premiers arcs musulmans par leur acuité et documentant des exemples pointus byzantins préislamiques: le pont de Karamagara, Sant'Apollinare in Classe à Ravenne et Hagia Irene à Constantinople."
  ur: "مقرناس 8 (1991) کا مضمون کریسویل کے ابتدائی مسلمانوں کے محرابوں کو ان کی تیز رفتاری کے ساتھ ڈیٹنگ کرنے کے طریقہ کار کی جانچ کرتا ہے اور قبل از اسلام بازنطینی نشان زد مثالوں کی دستاویز کرتا ہے: کراماگارا پل، ریوینا میں کلاسی میں سانت اپولینیئر اور قسطنطنیہ میں ہاگیا آئرین۔"
