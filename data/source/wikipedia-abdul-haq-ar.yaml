  ar: "مقالة ويكيبيديا العربية الموجزة عن مولوي عبد الحق؛ تُستخدم لوقائع الكيان فقط. تؤكد تاريخي ولادته ووفاته ولقبه «أبو الأردية» ومطالبته بجعل الأردية لغة باكستان الوطنية، دون أن تسمّي دينا أو مذهبا."
