reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 1 November 2026. The lead gives his dates as 18 March 1932 – 2 March 1950 and his descent as mixed Malay-Melanau; the early-life section records his birth at Kampung Pulo, Sibu, to Dhoby bin Buang, a Sibu Malay washerman, and Habibah binti Haji Lamit, his work at the Public Works Department, his resignation in 1949, and his evening teaching at the Sekolah Rakyat religious school; the political-activities section records his vice-secretaryship of the Sibu Malay Youth Movement, the founding meeting of Rukun 13 at which Awang Rambli read a passage from Surah Ya Sin before the oath, and his nationalist poem 'Panggilan Mu yang Suchi', published under the pen name Lidros on 28 February 1949; the assassination section covers the killing of Governor Duncan George Stewart at Sibu on 3 December 1949. No source in the article names a school or branch for him."
