summary:
  ar: "مقالة محكّمة في مجلة بروفيتيكا عن بلاغة الدعوة الرقمية عند الأستاذ أبي بسام عمر ميتا؛ تذكر ولادته في كودوس في 14 مايو 1979، وتخرّجه في معهد دار الشهادة، ودراسته في كلية الشريعة بمعهد العلوم الإسلامية والعربية ⁦(ليبيا)⁩، وتأسيسه منصة شاميلا، وعددًا من كتبه."
  en: "Peer-reviewed article in the Prophetica journal on the digital-da'wah rhetoric of Ustaz Abu Bassam Oemar Mita; it gives his birth in Kudus on 14 May 1979, his graduation from the Darusy Syahadah pesantren, his studies at the Faculty of Sharia of LIPIA, his founding of the Syameela platform, and several of his books."
  es: "Artículo revisado por pares en la revista Prophetica sobre la retórica de la da'wah digital del Ustaz Abu Bassam Oemar Mita; en él se menciona su nacimiento en Kudus el 14 de mayo de 1979, su graduación del pesantren Darusy Syahadah, sus estudios en la Facultad de Sharia de LIPIA, la fundación de la plataforma Syameela y varios de sus libros."
  fr: "Article évalué par des pairs dans la revue Prophetica sur la rhétorique numérique de la da'wa d'Ustaz Abu Bassam Oemar Mita; il retrace sa naissance à Kudus le 14 mai 1979, son diplôme du pesantren Darusy Syahadah, ses études à la faculté de charia de LIPIA, la fondation de la plateforme Syameela et plusieurs de ses livres."
  ur: "استاذ ابو بسام عمیر میتا کے ڈیجیٹل دعوہ بیانات پر پروپیٹیکا جریدے میں پیر کا جائزہ لیا گیا مضمون؛ یہ 14 مئی 1979 کو قدوس میں ان کی پیدائش، داروسی سہادہ کسانوں سے اس کی گریجویشن، LIPIA کی فیکلٹی آف شریعہ میں اس کی تعلیم، اس کے سیامیلا پلیٹ فارم کی بنیاد، اور اس کی کئی کتابیں ہیں۔"
title: "Analisis Retorika Dakwah Digital Ustadz Abu Bassam Oemar Mita dalam Teori Retorika Aristoteles"
