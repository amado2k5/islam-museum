reliability_note: "Peer-reviewed journal article, read on 15 November 2026. Its biographical passage (birth in Kudus on 14 May 1979; alumnus of Pesantren Darusy Syahadah, KMI unit, second cohort, 1999; then LIPIA's Faculty of Sharia; founder of Syameela) is stated as background to the rhetoric analysis. It lists his books as The Art of Life, This is The End, Make Peace with Yourself, Berdamai di Masa Senja and The Day After You Die, among others. It names no school or order for him; a pesantren and university formation is education, not attestation."
