summary:
  ar: "مقالة ويكيبيديا التركية عن أولوباطلي حسن؛ تناقش واقعيته التي كانت موضع جدل، وتورد خلاصة أبحاث حاقان يلماز: أنه ابن عبد الله مولود نحو 1390، سكبانباشيّ السلطان ورايته الرسمية المجرَّبة، وأن له وقفية مؤرخة 828هـ/1425 نظّمها الملا فناري تصفه بأنه «ديكي سَناجق الإسلام»، وأن رسمًا منمنمًا معاصرًا (1460) يصوّره شيخًا ملتحيًا يصعد برج رومانوس."
  en: "Turkish Wikipedia article on Ulubatli Hasan; it discusses his once-debated reality and reports Hakan Yilmaz's research conclusions: a son of Abdullah born about 1390, the sultan's experienced official standard-bearer and sekbanbashi, holder of a waqf deed of 828/1425 drawn up by Molla Fenari styling him 'planter of the banner of Islam', and depicted in a contemporary miniature of 1460 as an elderly bearded man climbing the Romanos tower."
  es: "Artículo de la Wikipedia turca sobre Ulubatli Hasan; en él se analiza su realidad, antes objeto de debate, y se recogen las conclusiones de la investigación de Hakan Yilmaz: hijo de Abdullah, nacido alrededor de 1390, experimentado portaestandarte oficial y sekbanbashi del sultán, poseedor de un documento waqf de 828/1425 redactado por Molla Fenari que lo denominaba \"plantador del estandarte del Islam\", y representado en una miniatura contemporánea de 1460 como un anciano barbudo escalando la torre Romanos."
  fr: "L'article de Wikipédia turc sur Ulubatli Hasan; il aborde sa réalité autrefois controversée et rapporte les conclusions des recherches de Hakan Yilmaz: fils d'Abdullah né vers 1390, porte-étendard officiel expérimenté du sultan et sekbanbashi, titulaire d'un acte de waqf de 828/1425 rédigé par Molla Fenari le qualifiant de « planteur de la bannière de l'Islam », et représenté dans une miniature contemporaine de 1460 comme un vieil homme barbu gravissant la tour Romanos."
  ur: "الوباطلی حسن پر ترکی ویکیپیڈیا مضمون؛ اس میں ان کی ایک بار زیر بحث حقیقت پر بحث کی گئی ہے اور ہاکان یلماز کے تحقیقی نتائج کی اطلاع دی گئی ہے: عبداللہ کا ایک بیٹا جو 1390 کے قریب پیدا ہوا، سلطان کا تجربہ کار سرکاری معیار کا علمبردار اور سیکبان باشی، جو 828/1425 کے وقف کا ہولڈر تھا، جسے مولا فیناری نے تیار کیا تھا، اور اسے اسلام کا ایک اسٹائل دیا تھا۔ رومنوس ٹاور پر چڑھنے والے ایک بزرگ داڑھی والے آدمی کے طور پر 1460 کا ہم عصر چھوٹا۔"
  tr: "Türkçe Vikipedi makalesi Ulubatlı Hasan hakkında; tartışmalı realizmini tartışır ve Hakan Yılmaz'ın araştırmalarının özetini sunar: Yılmaz'ın, yaklaşık 1390 doğumlu Şekbanbaşı Sultanı Abdullah'ın oğlu olduğu ve Molla Fınarı tarafından 828 Hicri/1425 Hicri tarihli bir vakfında 'İslam'ın Diki Sancakı' olarak tanımlandığı ve çağdaş bir minyatür tablonun (1460) onu sakallı bir yaşlı olarak Romanos Kulesi'ne tırmanırken tasvir ettiği belirtilir."
  id: "Artikel Wikipedia Turki tentang Ulubatlı Hasan membahas realisme kontroversialnya, dan menyajikan ringkasan penelitian Hakan Yılmaz: bahwa ia adalah putra Abdullah, lahir sekitar tahun 1390, Sultan Şekbanbashi, dan bahwa ia memiliki waqf bertanggal 828 H/1425 H, yang disusun oleh Mulla Fınarı, yang menggambarkannya sebagai 'Diki Sanjak dari Islam,' dan bahwa lukisan miniatur kontemporer (1460) menggambarkannya sebagai tetua berjanggut yang memanjat Menara Romanos."
