summary:
  ar: "مقالة ويكيبيديا التركية عن أولوباطلي حسن؛ تناقش واقعيته التي كانت موضع جدل، وتورد خلاصة أبحاث حاقان يلماز: أنه ابن عبد الله مولود نحو 1390، سكبانباشيّ السلطان ورايته الرسمية المجرَّبة، وأن له وقفية مؤرخة 828هـ/1425 نظّمها الملا فناري تصفه بأنه «ديكي سَناجق الإسلام»، وأن رسمًا منمنمًا معاصرًا (1460) يصوّره شيخًا ملتحيًا يصعد برج رومانوس."
  en: "Turkish Wikipedia article on Ulubatli Hasan; it discusses his once-debated reality and reports Hakan Yilmaz's research conclusions: a son of Abdullah born about 1390, the sultan's experienced official standard-bearer and sekbanbashi, holder of a waqf deed of 828/1425 drawn up by Molla Fenari styling him 'planter of the banner of Islam', and depicted in a contemporary miniature of 1460 as an elderly bearded man climbing the Romanos tower."
