reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision via the MediaWiki API on 1 November 2026; a fact is used only where the article cites a source for it (Wikipedia broad rule). Its existence-debate section fairly states both sides — the Melissenos-expansion argument of some Greek and Romanian historians, and Yilmaz's documentary counter-case (the Chronicon Maius colophon of 1478, the 1425 waqf deed, the grave, the 1460 miniature) — and both sides are preserved in the record. It follows Yilmaz in displacing the young-janissary image and the c. 1428 birth, which the English article retains; the conflict is recorded, not resolved."
