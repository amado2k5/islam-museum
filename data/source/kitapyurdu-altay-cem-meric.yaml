summary:
  ar: "الملف التعريفي بألطاي جم مريتش في موقع «كتاب يوردو» التركي لبيع الكتب، وهو سيرته القياسية لدى ناشريه؛ يقول إنه وُلد سنة 1991 في أنقرة، وأتمّ تعليمه الجامعي في كلية الطب بجامعة نجم الدين أربكان في قونية، ويمارس الطب، وعاد إلى الإسلام بعد تساؤلاته الاعتقادية، ويسمّي كتبه."
  en: "Author profile of Altay Cem Meriç on the Turkish bookseller Kitapyurdu, carrying his standard publisher biography; it states that he was born in 1991 in Ankara, completed his university education at Necmettin Erbakan University's Faculty of Medicine in Konya, practises medicine, returned to Islam after his creedal questioning, and names his books."
  es: "Perfil del autor Altay Cem Meriç en la librería turca Kitapyurdu, que incluye su biografía editorial habitual; en ella se indica que nació en 1991 en Ankara, completó sus estudios universitarios en la Facultad de Medicina de la Universidad Necmettin Erbakan en Konya, ejerce la medicina, regresó al Islam tras cuestionar su fe y titula sus libros."
title: "Kötülük Problemi (Altay Cem Meriç) — author biography"
