reliability_note: "Bookseller page reproducing the author's standard publisher biography (the same text is printed in his books, e.g. Peygamberliğin İspatı, İnsan Yayınları, 2022); used only for the biographical facts it states plainly: birth in Ankara in 1991, the Konya medical degree, active medical practice, his return to Islam after a period of creedal questioning, learning Arabic in that process, his broadcasts on creedal questions, philosophy and the social sciences, and his books — Peygamberliğin İspatı, the Muhtelif volumes, Öğrenmeyi Öğrenmek and Kötülük Problemi. It names no school or order for him. Read on 16 November 2026."
