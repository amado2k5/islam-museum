summary:
  ar: "مقالة ويكيبيديا العربية عن أبي الأعلى المودودي؛ تُستخدم لوقائع الكيان فقط. توثّق تعليمه على يد والده وحفظه الموطأ، وبيئته الفكرية الأولى التي تنازعها الحديث والحنفية والطرق الصوفية، ودعوته إلى الاجتهاد ونقده للجمود والتغريب."
  en: "Arabic Wikipedia article on Abul A'la Maududi; used for entity facts only. It records his father's teaching and his memorisation of the Muwatta, the intellectual milieu of his formation — hadith study, Hanafi rationalism and the Sufi orders side by side — and his call to ijtihad against both stagnation and westernisation."
  es: "Artículo de Wikipedia en árabe sobre Abul A'la Maududi; se utiliza únicamente para datos sobre la persona. En él se recogen las enseñanzas de su padre y su memorización del Muwatta, el entorno intelectual de su formación —el estudio de los hadices, el racionalismo hanafí y las órdenes sufíes coexistiendo— y su llamado al ijtihad contra el estancamiento y la occidentalización."
  fr: "Article de Wikipédia en arabe sur Abul A'la Maududi; utilisé uniquement à des fins d'information sur l'entité. Il relate l'enseignement de son père et sa mémorisation de la Muwatta, le milieu intellectuel de sa formation — l'étude des hadiths, le rationalisme hanafite et les ordres soufis coexistant — et son appel à l'ijtihad contre la stagnation et l'occidentalisation."
  ur: "ابوالاعلیٰ مودودی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کے والد کی تعلیم اور ان کی موطا کی یاد، ان کی تشکیل کا فکری ماحول — حدیث کا مطالعہ، حنفی عقلیت اور صوفی احکام ساتھ ساتھ — اور جمود اور مغرب دونوں کے خلاف ان کے اجتہاد کی دعوت کو ریکارڈ کیا گیا ہے۔"
  tr: "Ebu el-A'la el-Meddi hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Babası tarafından eğitilmesini, Muvatta'yı ezberlemesini, hadis, hanefi ve tasavvuf tarikatlarıyla çelişen erken entelektüel ortamını, ictihad çağrısını ve katılıklık ile Batılılaşma eleştirisini belgelemektedir."
  id: "Artikel Wikipedia Arab tentang Abu al-A'la al-Maududi; digunakan hanya untuk fakta entitas. Artikel ini mendokumentasikan pendidikannya oleh ayahnya dan hafalan Muwatta, lingkungan intelektual awalnya yang bertentangan dengan hadits, Hanafi, dan tarekat Sufi, seruannya untuk ijtihad, serta kritiknya terhadap kekakuan dan Westernisasi."
