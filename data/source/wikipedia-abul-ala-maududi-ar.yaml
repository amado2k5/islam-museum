reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Covers his father's instruction in Arabic, the Qur'an, hadith and fiqh and his memorisation of Imam Malik's Muwatta; his schooling at Aurangabad and Hyderabad and his father's death in 1919; his Delhi years (1921–1928) reading rhetoric, logic, tafsir, hadith and usul; the milieu the article describes for his formation — deep hadith scholarship, the Hanafi school with its rationalism, and the Sufi orders with their spirituality and, in the article's words, their innovations, side by side; and his reform programme set against both the party of stagnation (taqlid) and the party of westernising dissolution, including the quoted objection of the traditionalist ulama to his insistence on ijtihad. The milieu described is the article's characterisation of his environment, not an attestation of his own school, and the person record treats it so. Read in full on 24 October 2026."
