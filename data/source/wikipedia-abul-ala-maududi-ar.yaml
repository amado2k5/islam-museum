  ar: "مقالة ويكيبيديا العربية عن أبي الأعلى المودودي؛ تُستخدم لوقائع الكيان فقط. توثّق تعليمه على يد والده وحفظه الموطأ، وبيئته الفكرية الأولى التي تنازعها الحديث والحنفية والطرق الصوفية، ودعوته إلى الاجتهاد ونقده للجمود والتغريب."
  en: "Arabic Wikipedia article on Abul A'la Maududi; used for entity facts only. It records his father's teaching and his memorisation of the Muwatta, the intellectual milieu of his formation — hadith study, Hanafi rationalism and the Sufi orders side by side — and his call to ijtihad against both stagnation and westernisation."
