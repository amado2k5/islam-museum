summary:
  ar: 'إعلان جامعة ولاية بنسلفانيا عن محاضرة نيلسون مانديلا التي ألقتها زبيدة جعفر سنة 2018: في سنة 1980، وهي في الثانية والعشرين وصحفية في كيب تاون، تلقّت رسالة من نيلسون مانديلا يحثّها على الاستمرار في الكتابة لأن قصصها كانت تبعث الأمل في السجناء؛ وكانت قد اعتُقلت وعُذّبت بعد ستة أشهر من بدء وظيفتها الأولى؛ والتقت مانديلا في اليوم التالي لإطلاق سراحه سنة 1990.'
  en: 'Penn State''s announcement of Zubeida Jaffer''s 2018 Nelson Mandela Lecture: in 1980, aged 22 and a Cape Town journalist, she received a message from Nelson Mandela urging her to keep writing, as her stories gave prisoners hope; she had been detained and tortured six months into her first job; she met Mandela the day after his release in 1990.'
