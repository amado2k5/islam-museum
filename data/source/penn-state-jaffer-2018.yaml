label:
  en: South African author, journalist to deliver 2018 Nelson Mandela Lecture — Penn State
summary:
  ar: 'إعلان جامعة ولاية بنسلفانيا عن محاضرة نيلسون مانديلا التي ألقتها زبيدة جعفر سنة 2018: في سنة 1980، وهي في الثانية والعشرين وصحفية في كيب تاون، تلقّت رسالة من نيلسون مانديلا يحثّها على الاستمرار في الكتابة لأن قصصها كانت تبعث الأمل في السجناء؛ وكانت قد اعتُقلت وعُذّبت بعد ستة أشهر من بدء وظيفتها الأولى؛ والتقت مانديلا في اليوم التالي لإطلاق سراحه سنة 1990.'
  en: 'Penn State''s announcement of Zubeida Jaffer''s 2018 Nelson Mandela Lecture: in 1980, aged 22 and a Cape Town journalist, she received a message from Nelson Mandela urging her to keep writing, as her stories gave prisoners hope; she had been detained and tortured six months into her first job; she met Mandela the day after his release in 1990.'
  es: "Anuncio de Penn State sobre la Conferencia Nelson Mandela de Zubeida Jaffer en 2018: en 1980, a los 22 años y siendo periodista en Ciudad del Cabo, recibió un mensaje de Nelson Mandela instándola a seguir escribiendo, ya que sus historias daban esperanza a los prisioneros; había sido detenida y torturada seis meses después de comenzar su primer trabajo; conoció a Mandela al día siguiente de su liberación en 1990."
  fr: "Annonce par Penn State de la conférence Nelson Mandela 2018 de Zubeida Jaffer: en 1980, à l’âge de 22 ans, alors journaliste au Cap, elle a reçu un message de Nelson Mandela l’encourageant à continuer d’écrire, car ses articles donnaient de l’espoir aux prisonniers; elle avait été détenue et torturée six mois après avoir commencé son premier emploi; elle a rencontré Mandela le lendemain de sa libération en 1990."
  ur: "پین اسٹیٹ کا زبیدہ جعفر کے 2018 نیلسن منڈیلا لیکچر کا اعلان: 1980 میں، 22 سال کی عمر میں اور کیپ ٹاؤن کی ایک صحافی، اسے نیلسن منڈیلا کی طرف سے ایک پیغام موصول ہوا جس میں وہ لکھتے رہنے کی تاکید کرتے تھے، کیونکہ اس کی کہانیوں نے قیدیوں کو امید دی تھی۔ اسے اپنی پہلی ملازمت میں چھ ماہ تک حراست میں لیا گیا تھا اور تشدد کا نشانہ بنایا گیا تھا۔ وہ منڈیلا سے 1990 میں رہائی کے اگلے دن ملی۔"
  tr: "Pennsylvania Eyalet Üniversitesi'nin Nelson Mandela'nın 2018'de Zubaida Jafar tarafından verdiği konferansın duyurusu: 1980'de, yirmi iki yaşında ve Cape Town'da gazeteciyken, Nelson Mandela'dan yazmaya devam etmesi için bir mektup aldı; çünkü hikayeleri mahkumlara umut veriyordu; ilk işine başladıktan altı ay sonra tutuklanmış ve işkence görmüştü; ve Mandela ile 1990'da serbest bırakıldıktan sonraki gün tanıştı."
  id: "Pengumuman Pennsylvania State University tentang kuliah Nelson Mandela yang disampaikan oleh Zubaida Jafar pada tahun 2018: Pada tahun 1980, di usia dua puluh dua tahun dan seorang jurnalis di Cape Town, ia menerima surat dari Nelson Mandela yang mendesaknya untuk terus menulis karena ceritanya memberi harapan bagi para tahanan; ia telah ditangkap dan disiksa enam bulan setelah memulai pekerjaan pertamanya; dan ia bertemu Mandela sehari setelah Mandela dibebaskan pada tahun 1990."
