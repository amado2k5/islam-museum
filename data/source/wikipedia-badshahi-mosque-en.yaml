summary:
  ar: "مقال الإنجليزية عن المسجد الملكي بلاهور؛ يروي أن خليفة شجاع الدين قرأ خطاب غاندي على حشد الاحتجاج في ساحة المسجد في أبريل 1919 بعد مذبحة أمريتسار، وأنه صار لاحقاً رئيساً للمجلس البنجابي."
  en: "English encyclopedia article on the Badshahi Mosque in Lahore; it records that Khalifa Shuja-ud-Din read Gandhi's speech to the protest crowd in the mosque's courtyard in April 1919, after the Amritsar massacre, and that he later became Speaker of the Provincial Assembly of the Punjab."
  es: "Artículo de una enciclopedia inglesa sobre la Mezquita Badshahi en Lahore; en él se recoge que Khalifa Shuja-ud-Din leyó el discurso de Gandhi a la multitud que protestaba en el patio de la mezquita en abril de 1919, tras la masacre de Amritsar, y que posteriormente se convirtió en Presidente de la Asamblea Provincial del Punjab."
  fr: "Article d'encyclopédie anglaise sur la mosquée Badshahi de Lahore; il y est indiqué que Khalifa Shuja-ud-Din a lu le discours de Gandhi à la foule de manifestants dans la cour de la mosquée en avril 1919, après le massacre d'Amritsar, et qu'il est devenu plus tard président de l'Assemblée provinciale du Pendjab."
  ur: "لاہور کی بادشاہی مسجد پر انگریزی انسائیکلوپیڈیا کا مضمون؛ اس میں درج ہے کہ خلیفہ شجاع الدین نے امرتسر کے قتل عام کے بعد اپریل 1919 میں مسجد کے صحن میں احتجاجی ہجوم سے گاندھی کی تقریر پڑھی اور بعد میں وہ پنجاب کی صوبائی اسمبلی کے اسپیکر بنے۔"
  tr: "Lahor'daki Kraliyet Camii hakkında İngilizce bir makalede, Halife Shujauddin'in Amritsar katliamından sonra Nisan 1919'da cami meydanında Gandhi'nin konuşmasını okuduğu ve daha sonra Pencap Konseyi başkanı olduğu anlatılır."
  id: "Sebuah artikel berbahasa Inggris tentang Masjid Kerajaan di Lahore menceritakan bahwa Khalifa Shujauddin membacakan pidato Gandhi di alun-alun masjid pada April 1919 setelah pembantaian Amritsar, dan bahwa ia kemudian menjadi presiden Dewan Punjab."
