summary:
  ar: "صفحة «من نحن» في موقع دار تراث للنشر: تأسيسها سنة 1997 في جنوب لندن امتدادًا لعمل الشيخ محمد بن أحمد باثا بردولي، بتشجيع من محمد تقي العثماني، وبدايتها بمشروع ترجمة «موطأ الإمام محمد»، وأكثر من ستين عنوانًا."
  en: "Turath Publishing's About Us page: its establishment in 1997 in South London as a continuation of the work of Shaykh Muhammad ibn Ahmad Batha Bardoli, encouraged by Muhammad Taqi Usmani, its start with a project to translate the Muwatta of Imam Muhammad, and a catalogue of over sixty titles."
