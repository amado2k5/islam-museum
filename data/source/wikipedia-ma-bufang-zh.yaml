summary:
  ar: "مقالة ويكيبيديا الصينية عن ما بوفانغ؛ تُستخدم لوقائع الكيان فقط. تعطي اسمه الكنية تسيشيانغ واسمه الإسلامي حسيني، وحكمه تشينغهاي وإقامته في القاهرة ثم السعودية، ووفاته في جدة في 31 تموز 1975."
  en: "Chinese Wikipedia article on Ma Bufang; used for entity facts only. It gives his courtesy name Zixiang and his Islamic name Husaini, his rule of Qinghai, his exile in Cairo and then Saudi Arabia, and his death at Jeddah on 31 July 1975."
  es: "Artículo de la Wikipedia en chino sobre Ma Bufang; se utiliza únicamente para obtener información sobre la persona. Menciona su nombre de cortesía, Zixiang, y su nombre islámico, Husaini, su gobierno en Qinghai, su exilio en El Cairo y posteriormente en Arabia Saudita, y su fallecimiento en Yeda el 31 de julio de 1975."
  fr: "Article de Wikipédia en chinois sur Ma Bufang; utilisé uniquement pour les informations sur l’entité. Il mentionne son nom de courtoisie Zixiang et son nom islamique Husaini, son règne sur le Qinghai, son exil au Caire puis en Arabie saoudite, et sa mort à Djeddah le 31 juillet 1975."
  ur: "ما بوفنگ پر چینی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کا شائستہ نام زیکسیانگ اور اس کا اسلامی نام حسینی، اس کی چنگھائی کی حکمرانی، قاہرہ اور پھر سعودی عرب میں اس کی جلاوطنی اور 31 جولائی 1975 کو جدہ میں اس کی موت ہے۔"
  tr: "Ma Bufang hakkında Çince Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılmıştır. Soyadı Zixiang tarafından verilmiştir, İslami adı Husseini, Qinghai'deki yönetimi ve ardından Suudi Arabistan'daki ikametgahı ve 31 Temmuz 1975'te Cidde'deki ölümü."
  id: "Artikel Wikipedia Tiongkok tentang Ma Bufang hanya digunakan untuk fakta entitas tersebut. Nama belakangnya diberikan oleh Zixiang, nama Islamnya Husseini, pemerintahannya di Qinghai, kediamannya di Kairo dan kemudian Arab Saudi, serta kematiannya di Jeddah pada 31 Juli 1975."
