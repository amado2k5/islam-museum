summary:
  ar: "قناة بودكاست «الأمومة على الطريقة المسلمة» (Mommying While Muslim) على يوتيوب؛ مصدر أولي للبودكاست الذي تقدمه زايبة حسن وعظمى جعفري لدعم الأمهات المسلمات الأمريكيات في القضايا الخاصة التي يواجهنها في عالم ما بعد 11 سبتمبر، ومشاركة التجارب والموارد بينهن."
  en: "The YouTube channel of the Mommying While Muslim podcast; a primary source for the podcast hosted by Zaiba Hasan and Uzma Jafri, which seeks to support American Muslim mothers and the unique issues they face in a post-9/11 world, sharing experiences and resources among them."
  es: "El canal de YouTube del podcast Mommying While Muslim; una fuente principal para el podcast presentado por Zaiba Hasan y Uzma Jafri, que busca apoyar a las madres musulmanas estadounidenses y los problemas únicos que enfrentan en un mundo posterior al 11 de septiembre, compartiendo experiencias y recursos entre ellas."
  fr: "La chaîne YouTube du podcast Mommying While Muslim; une source principale pour le podcast animé par Zaiba Hasan et Uzma Jafri, qui vise à soutenir les mères musulmanes américaines et les problèmes uniques auxquels elles sont confrontées dans un monde post-11 septembre, en partageant des expériences et des ressources entre elles."
  ur: "Mommying while Muslim podcast کا یوٹیوب چینل؛ زیبا حسن اور عظمیٰ جعفری کے زیر اہتمام پوڈ کاسٹ کا ایک بنیادی ذریعہ، جو امریکی مسلمان ماؤں اور 9/11 کے بعد کی دنیا میں انہیں درپیش انوکھے مسائل کی حمایت کرنا چاہتا ہے، ان کے درمیان تجربات اور وسائل کا اشتراک کرنا۔"
