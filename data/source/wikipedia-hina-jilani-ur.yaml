reliability_note: "A short article. Read on 27 October 2026 at the recorded revision. It gives her born in 1953 (year only), her start of practice in 1979, and names her elder sister as Asma Jahangir. Its organisational dates differ from the English article's — it dates the founding of AGHS and the Women's Action Forum to 1987 where the English article gives 1980 — a discrepancy in the organisations' dates, not in her own; the English article's dates are followed in her record. It makes no statement of her religion."
