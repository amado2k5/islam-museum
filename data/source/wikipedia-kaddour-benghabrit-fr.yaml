summary:
  ar: "مقال الفرنسية عن قدور بن غبريط (1868-1954): مولده في سيدي بلعباس في 1 نوفمبر 1868 ووفاته في باريس في 24 يونيو 1954، مسيرته في القضاء والترجمة والدبلوماسية، تأسيسه معهد مسجد باريس، ودفنه وفق الشعائر المالكية."
  en: "French encyclopedia article on Kaddour Benghabrit (1868-1954): his birth at Sidi Bel Abbes on 1 November 1868 and death in Paris on 24 June 1954, his career in the judiciary, interpreting and diplomacy, his founding of the Paris Mosque Institute, and his burial according to the Maliki rite."
  es: "Artículo de una enciclopedia francesa sobre Kaddour Benghabrit (1868-1954): su nacimiento en Sidi Bel Abbès el 1 de noviembre de 1868 y su muerte en París el 24 de junio de 1954, su carrera en el poder judicial, la interpretación y la diplomacia, la fundación del Instituto de la Mezquita de París y su entierro según el rito malikí."
  fr: "Article d'encyclopédie française sur Kaddour Benghabrit (1868-1954): sa naissance à Sidi Bel Abbes le 1er novembre 1868 et sa mort à Paris le 24 juin 1954, sa carrière dans la justice, l'interprétation et la diplomatie, la fondation de l'Institut de la Mosquée de Paris et son enterrement selon le rite malikite."
  ur: "کدور بنگھبریت (1868-1954) پر فرانسیسی انسائیکلوپیڈیا کا مضمون: یکم نومبر 1868 کو سیدی بیل ایبس میں ان کی پیدائش اور 24 جون 1954 کو پیرس میں وفات، عدلیہ، ترجمانی اور سفارت کاری میں ان کا کیرئیر، پیرس مسجد انسٹی ٹیوٹ کی بنیاد، اور مالکی بیری کے مطابق۔"
  tr: "Kaddur bin Ghabrit hakkında Fransız makalesi (1868-1954): 1 Kasım 1868'de Sidi Bel Abbes'te doğdu ve 24 Haziran 1954'te Paris'te vefat etti. Yargı, çeviri ve diplomasi alanındaki kariyeri, Paris Camii Enstitüsü'nü kurması ve Maliki ayinlerine göre defnedilmesi."
  id: "Artikel Prancis tentang Kaddour bin Ghabrit (1868-1954): Lahir di Sidi Bel Abbes pada 1 November 1868, dan meninggal di Paris pada 24 Juni 1954. Kariernya di bidang peradilan, penerjemahan, dan diplomasi, mendirikan Institut Masjid Paris, serta pemakamannya sesuai dengan ritus Maliki."
