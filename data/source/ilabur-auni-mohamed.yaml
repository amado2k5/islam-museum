summary:
  ar: "ملف تعريفي في موقع iLabur بأوني محمد، حُدّث في 19 يونيو 2025؛ يؤكد ميلاده في باسير ماس سنة 1976 ودراسته للشريعة في الأزهر وإقامته في بينانغ منذ 2017 ولقبه «زاكر نايك ماليزيا»."
  en: "iLabur biodata profile of Auni Mohamed, updated 19 June 2025: it corroborates his 1976 birth in Pasir Mas, his Al-Azhar study of Islamic law, his residence in Penang since 2017 and his 'Zakir Naik Malaysia' nickname."
  es: "Perfil biográfico de Auni Mohamed en iLabur, actualizado el 19 de junio de 2025: corrobora su nacimiento en 1976 en Pasir Mas, sus estudios de derecho islámico en Al-Azhar, su residencia en Penang desde 2017 y su apodo de 'Zakir Naik Malaysia'."
  fr: "Profil biographique iLabur d'Auni Mohamed, mis à jour le 19 juin 2025: il confirme sa naissance en 1976 à Pasir Mas, ses études de droit islamique à Al-Azhar, sa résidence à Penang depuis 2017 et son surnom « Zakir Naik Malaysia »."
  ur: "عونی محمد کا iLabur بائیو ڈیٹا پروفائل، 19 جون 2025 کو اپ ڈیٹ کیا گیا: یہ ان کی 1976 میں پاسیر ماس میں پیدائش، اسلامی قانون کے بارے میں اس کے الازہر کا مطالعہ، 2017 سے پینانگ میں اس کی رہائش اور اس کے 'ذاکر نائیک ملائیشیا' کے عرفی نام کی تصدیق کرتا ہے۔"
  tr: "iLabur web sitesinde Oni Mohammed tarafından hazırlanan bir profil, 19 Haziran 2025'te güncellendi; 1976'da Basir Mas'ta doğduğunu, El-Azhar'da Şeriat çalışmasını, 2017'den beri Penang'da ikamet ettiğini ve 'Zakir Naik Malaysia' unvanını doğruluyor."
  id: "Profil di situs iLabur oleh Oni Mohammed, diperbarui pada 19 Juni 2025; mengonfirmasi kelahirannya di Basir Mas pada tahun 1976, studinya tentang Syariah di Al-Azhar, kediamannya di Penang sejak 2017, dan gelarnya 'Zakir Naik Malaysia.'"
