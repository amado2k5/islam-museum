label:
  ar: الأخبار الطوال — أبو حنيفة الدينوري ⁦(تحقيق عبد المنعم عامر، منشورات الشريف الرضي)⁩
  en: Al-Akhbar al-Tiwal — Abu Hanifa al-Dinawari (ed. Abd al-Mun'im Amir, Manshurat al-Sharif al-Radi reprint)
  ur: الاخبار الطوال — ابو حنیفہ دینوری ⁦(تحقیق عبد المنعم عامر، منشورات الشریف الرضی)⁩
summary:
  ar: كتاب أبي حنيفة أحمد بن داود الدينوري ⁦(ت 282هـ)⁩ في التاريخ من الأمم الأولى وملوك الفرس إلى موت المعتصم سنة 227هـ، بتحقيق عبد المنعم عامر، في طبعة مصورة نشرتها منشورات الشريف الرضي. يقدّم المحقق للكتاب بمقدمة عن الدينور والمؤلف ومخطوطات الكتاب، ومنها مخطوطة سوهاج {cite:akhbar-tiwal-amir intro scan p. 15} {cite:akhbar-tiwal-amir intro scan p. 19}.
  en: Abu Hanifa Ahmad ibn Dawud al-Dinawari's (d. 282 AH) history from the early nations and the Persian kings to the death of al-Mu'tasim in 227 AH, edited by Abd al-Mun'im Amir, in a photographic reprint issued by Manshurat al-Sharif al-Radi. The editor's introduction covers Dinawar, the author and the manuscripts, among them the Sohag manuscript {cite:akhbar-tiwal-amir intro scan p. 15} {cite:akhbar-tiwal-amir intro scan p. 19}.
  ur: ابو حنیفہ احمد بن داود دینوری ⁦(وفات 282ھ)⁩ کی تاریخ، قدیم قوموں اور فارسی بادشاہوں سے 227ھ میں معتصم کی وفات تک، تحقیق عبد المنعم عامر، منشورات الشریف الرضی کی عکسی اشاعت میں۔ محقق کا مقدمہ دینور، مصنف اور مخطوطات پر ہے، جن میں سوہاج کا مخطوطہ شامل ہے {cite:akhbar-tiwal-amir intro scan p. 15} {cite:akhbar-tiwal-amir intro scan p. 19}۔
  es: "La historia de Abu Hanifa Ahmad ibn Dawud al-Dinawari (m. 282 AH) desde las primeras naciones y los reyes persas hasta la muerte de al-Mu'tasim en 227 AH, editada por Abd al-Mun'im Amir, en una reimpresión fotográfica publicada por Manshurat al-Sharif al-Radi. La introducción del editor cubre a Dinawar, el autor y los manuscritos, incluido el manuscrito de Sohag {citar: exploración de introducción de akhbar-tiwal-amir p. 15} {citar: escaneo de introducción de news-tiwal-amir p. 19}."
  fr: "L'histoire d'Abu Hanifa Ahmad ibn Dawud al-Dinawari (mort en 282 AH) depuis les premières nations et les rois perses jusqu'à la mort d'al-Mu'tasim en 227 AH, édité par Abd al-Mun'im Amir, dans une réimpression photographique publiée par Manshurat al-Sharif al-Radi. L'introduction de l'éditeur couvre Dinawar, l'auteur et les manuscrits, y compris le manuscrit de Sohag {cite:akhbar-tiwal-amir intro scan p. 15} {cite: analyse d'introduction de news-tiwal-amir p. 19}."
  tr: "Ebu Hanifa Ahmed bin Davud el-Dinavri'nin (ö. 282 Hicri) İlk Uluslar ve Pers krallarından el-Mu'tasim'in ölümüne kadar olan tarih üzerine kitabı, Abd al-Munim Amer tarafından düzenlenmiş, Al-Sharif Al-Radi Yayınları tarafından yayımlanan faksimize baskıdır. Editör, kitabı al-Dinawar (yazar) hakkında bir giriş ve kitabın el yazmaları ile tanıtır; bunlar arasında Sohag el yazması {cite:akhbar-tiwal-amir intro s. 15} {cite:akhbar-tiwal-amir intro s. 19} yer alır."
  id: "Buku Abu Hanifa Ahmad ibn Dawud al-Dinawari (wafat 282 H) tentang sejarah dari Bangsa Pertama dan raja-raja Persia hingga kematian al-Mu'tasim pada tahun 227 H, disunting oleh Abd al-Munim Amer, dalam edisi faksimis yang diterbitkan oleh Al-Sharif Al-Radi Publications. Editor memperkenalkan buku ini dengan pengantar tentang al-Dinawar, sang penulis, dan manuskrip buku tersebut, termasuk manuskrip Sohag {cite:akhbar-tiwal-amir intro scan hlm. 15} {cite:akhbar-tiwal-amir intro scan hlm. 19}."
