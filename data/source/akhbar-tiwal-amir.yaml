label:
  ar: الأخبار الطوال — أبو حنيفة الدينوري (تحقيق عبد المنعم عامر، منشورات الشريف الرضي)
  en: Al-Akhbar al-Tiwal — Abu Hanifa al-Dinawari (ed. Abd al-Mun'im Amir, Manshurat al-Sharif al-Radi reprint)
  ur: الاخبار الطوال — ابو حنیفہ دینوری (تحقیق عبد المنعم عامر، منشورات الشریف الرضی)
summary:
  ar: كتاب أبي حنيفة أحمد بن داود الدينوري (ت 282هـ) في التاريخ من الأمم الأولى وملوك الفرس إلى موت المعتصم سنة 227هـ، بتحقيق عبد المنعم عامر، في طبعة مصورة نشرتها منشورات الشريف الرضي. يقدّم المحقق للكتاب بمقدمة عن الدينور والمؤلف ومخطوطات الكتاب، ومنها مخطوطة سوهاج {cite:akhbar-tiwal-amir intro scan p. 15} {cite:akhbar-tiwal-amir intro scan p. 19}.
  en: Abu Hanifa Ahmad ibn Dawud al-Dinawari's (d. 282 AH) history from the early nations and the Persian kings to the death of al-Mu'tasim in 227 AH, edited by Abd al-Mun'im Amir, in a photographic reprint issued by Manshurat al-Sharif al-Radi. The editor's introduction covers Dinawar, the author and the manuscripts, among them the Sohag manuscript {cite:akhbar-tiwal-amir intro scan p. 15} {cite:akhbar-tiwal-amir intro scan p. 19}.
  ur: ابو حنیفہ احمد بن داود دینوری (وفات 282ھ) کی تاریخ، قدیم قوموں اور فارسی بادشاہوں سے 227ھ میں معتصم کی وفات تک، تحقیق عبد المنعم عامر، منشورات الشریف الرضی کی عکسی اشاعت میں۔ محقق کا مقدمہ دینور، مصنف اور مخطوطات پر ہے، جن میں سوہاج کا مخطوطہ شامل ہے {cite:akhbar-tiwal-amir intro scan p. 15} {cite:akhbar-tiwal-amir intro scan p. 19}۔
