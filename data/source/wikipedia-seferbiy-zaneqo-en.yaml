summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن صفر بي زانوقه؛ تُستخدم لوقائع الكيان فقط. تذكر مولده سنة 1798 قرب أنابا ووفاته في 1 يناير 1860 في شبسوغيا ودفنه في وادي فوردوبغاتش، وتفصّل مسيرته أسيرا ثم ضابطا روسيا هاربا، ومسؤولا عثمانيا، وقائد الوفد الشركسي إلى القسطنطينية سنة 1831، وواليا عثمانيا على شركسيا في حرب القرم، وزعيما للاتحاد الشركسي حتى وفاته؛ ولا تنسب إليه مذهبا ولا طريقة."
  en: "English Wikipedia article on Seferbiy Zaneqo; used for entity facts only. It gives his birth in 1798 near Anapa, his death on 1 January 1860 in Shapsughia and his burial in the Vordobgach valley, and details his career as a hostage and Russian cadet, an Ottoman officer, head of the 1831 Circassian delegation to Constantinople, Ottoman governor of Circassia during the Crimean War and leader of the Circassian Confederation until his death; it names no school or order for him."
  es: "Artículo de la Wikipedia en inglés sobre Seferbiy Zaneqo; utilizado únicamente para datos biográficos. Indica su nacimiento en 1798 cerca de Anapa, su muerte el 1 de enero de 1860 en Shapsughia y su entierro en el valle de Vordobgach, y detalla su trayectoria como rehén y cadete ruso, oficial otomano, jefe de la delegación circasiana a Constantinopla en 1831, gobernador otomano de Circasia durante la Guerra de Crimea y líder de la Confederación Circasiana hasta su muerte; no menciona ninguna escuela u orden a la que perteneció."
  fr: "L'article de Wikipédia en anglais consacré à Seferbiy Zaneqo, utilisé uniquement pour les informations le concernant, indique sa naissance en 1798 près d'Anapa, sa mort le 1er janvier 1860 à Shapsughia et son inhumation dans la vallée de Vordobgach. Il détaille son parcours: otage, cadet russe, officier ottoman, chef de la délégation circassienne à Constantinople en 1831, gouverneur ottoman de Circassie pendant la guerre de Crimée et dirigeant de la Confédération circassienne jusqu'à sa mort. L'article ne mentionne ni école ni ordre auquel il aurait appartenu."
  ur: "Seferbiy Zaneqo پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1798 میں انپا کے قریب ان کی پیدائش، 1 جنوری 1860 کو شاپسوگیا میں اس کی موت اور وادی وردوبگاچ میں اس کی تدفین، اور ایک یرغمالی اور روسی کیڈٹ، ایک عثمانی افسر، 1831 کے سرکاسی وفد کے قسطنطنیہ کے سربراہ کے طور پر اس کے کیرئیر کی تفصیلات، عثمانی گورنر کے دور حکومت میں۔ سرکیسیئن کنفیڈریشن اپنی موت تک؛ اس میں اس کے لیے کسی اسکول یا آرڈر کا نام نہیں ہے۔"
  tr: "Safar Bi Zanuke hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1798'de Anapa yakınlarında doğduğu, 1 Ocak 1860'ta Špsugia'da öldüğü ve Vordubgăč Vadisi'ne defnedilmiş olduğu belirtilir. Kariyeri, önce bir mahkum ve ardından kaçak bir Rus subayı, bir Osmanlı yetkilisi, 1831'de Konstantinopolis'e giden Çerkes heyetinin lideri, Kırım Savaşı'nda Çerkes Osmanlı valisi ve ölümüne kadar Çerkes Konfederasyonu'nun lideri olarak öne çıkar; kendisine hiçbir tarikat veya tarikat atfedilmemiştir."
  id: "Artikel Wikipedia bahasa Inggris tentang Safar Bi Zanukeh; digunakan hanya untuk fakta entitas. Ia disebutkan lahir pada tahun 1798 di dekat Anapa, meninggal pada 1 Januari 1860 di Špsugia, dan dimakamkan di Lembah Vordubgăč. Kariernya dikenal sebagai tahanan dan kemudian perwira Rusia buronan, pejabat Ottoman, pemimpin delegasi Circassia ke Konstantinopel pada tahun 1831, gubernur Ottoman Circassia dalam Perang Krimea, dan pemimpin Konfederasi Circassia hingga kematiannya; tidak ada sekte atau ordo yang dikaitkan dengannya."
