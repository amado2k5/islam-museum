summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن صفر بي زانوقه؛ تُستخدم لوقائع الكيان فقط. تذكر مولده سنة 1798 قرب أنابا ووفاته في 1 يناير 1860 في شبسوغيا ودفنه في وادي فوردوبغاتش، وتفصّل مسيرته أسيرا ثم ضابطا روسيا هاربا، ومسؤولا عثمانيا، وقائد الوفد الشركسي إلى القسطنطينية سنة 1831، وواليا عثمانيا على شركسيا في حرب القرم، وزعيما للاتحاد الشركسي حتى وفاته؛ ولا تنسب إليه مذهبا ولا طريقة."
  en: "English Wikipedia article on Seferbiy Zaneqo; used for entity facts only. It gives his birth in 1798 near Anapa, his death on 1 January 1860 in Shapsughia and his burial in the Vordobgach valley, and details his career as a hostage and Russian cadet, an Ottoman officer, head of the 1831 Circassian delegation to Constantinople, Ottoman governor of Circassia during the Crimean War and leader of the Circassian Confederation until his death; it names no school or order for him."
