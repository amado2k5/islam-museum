reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It carries two rival birth statements (June 1762 at month precision and the year 1760), a death on 13 April 1794, and place items for Aldy, Shlisselburg and Oreshek Fortress. On the question this record had to test it files TWO structured religion (P140) values, Sunni Islam and Naqshbandi — the structured form of the frequently repeated Naqshbandi assumption, which Kemper's Encyclopaedia of Islam Three entry finds no evidence for; structured data never settles faith. The QID was grounded from the English article's own page property, the Arabic and Urdu articles agreeing. Item revision fetched live and re-asserted identical on a second query, 1 November 2026."
