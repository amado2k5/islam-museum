summary:
  ar: "مقالة ويكيبيديا العربية عن برنارد هوبكينز؛ تُستخدم لوقائع الكيان فقط. مقالة قصيرة: يذكر صندوق معلوماتها مولده في 15 يناير 1965 في فيلادلفيا وديانته «الإسلام»، وتصفه مقدمتها بأنه ملاكم أمريكي مسلم وبطل سابق للعالم في خفيف الثقيل يدرّبه نظيم ريتشاردسون."
  en: "Arabic Wikipedia article on Bernard Hopkins; used for entity facts only. A short article: its infobox gives his birth on 15 January 1965 in Philadelphia and his religion as Islam, and its lead describes him as an American Muslim boxer and former light-heavyweight world champion trained by Nazim Richardson."
  es: "Artículo en árabe de la Wikipedia sobre Bernard Hopkins; utilizado únicamente para datos sobre la persona. Un artículo breve: su ficha informativa indica que nació el 15 de enero de 1965 en Filadelfia y que su religión es el islam, y su introducción lo describe como un boxeador musulmán estadounidense y excampeón mundial de peso semipesado entrenado por Nazim Richardson."
  fr: "Article Wikipédia en arabe sur Bernard Hopkins; utilisé uniquement pour les informations le concernant. Cet article est court: son infobox indique sa naissance le 15 janvier 1965 à Philadelphie et sa religion est l’islam, tandis que son introduction le décrit comme un boxeur américain musulman, ancien champion du monde des mi-lourds, entraîné par Nazim Richardson."
  ur: "برنارڈ ہاپکنز پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ ایک مختصر مضمون: اس کا معلوماتی باکس 15 جنوری 1965 کو فلاڈیلفیا میں اس کی پیدائش اور اس کا مذہب اسلام ہے، اور اس کی قیادت اسے ایک امریکی مسلمان باکسر اور سابق ہلکے ہیوی ویٹ ورلڈ چیمپئن کے طور پر بیان کرتی ہے جسے ناظم رچرڈسن نے تربیت دی تھی۔"
  tr: "Bernard Hopkins hakkında Arapça Vikipedi makalesi; yalnızca varlık bilgileri için kullanılır. Kısa makale: Bilgi kutusunda 15 Ocak 1965'te Philadelphia'da doğduğu ve \"İslam\" olarak dininin olduğu belirtilir; girişinde ise Amerikalı Müslüman boksör ve Nazim Richardson tarafından eğitilen hafif sıklet dünya şampiyonu olarak tanımlanır."
  id: "Artikel Wikipedia Arab tentang Bernard Hopkins; digunakan hanya untuk fakta entitas. Artikel singkat: Infobox-nya menyebutkan kelahirannya pada 15 Januari 1965 di Philadelphia dan agamanya sebagai \"Islam,\" dan pengantarnya menggambarkannya sebagai petinju Muslim Amerika dan mantan juara dunia kelas berat ringan yang dilatih oleh Nazim Richardson."
