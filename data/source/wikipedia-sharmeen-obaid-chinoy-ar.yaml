summary:
  ar: "مقالة ويكيبيديا العربية عن شرمين عبيد جنائي ⁦(تشينوي)⁩؛ تُستخدم لوقائع الكيان فقط. تذكر ولادتها في كراتشي في 12 نوفمبر 1978 ومهنتها صحفية وصانعة أفلام، ودينها في صندوق المعلومات «الإسلام» عمومًا دون مذهب."
  en: "Arabic Wikipedia article on Sharmeen Obaid-Chinoy (filed under the transliteration 'Jana'i'); used for entity facts only. It gives her birth in Karachi on 12 November 1978, her work as a journalist and filmmaker, and her religion in the infobox as Islam generically — no school."
  es: "Artículo de Wikipedia en árabe sobre Sharmeen Obaid-Chinoy (archivado bajo la transliteración 'Jana'i'); utilizado únicamente para datos sobre la persona. Indica que nació en Karachi el 12 de noviembre de 1978, que trabajó como periodista y cineasta, y que su religión, según el recuadro informativo, es el islam en general, sin afiliación a ninguna escuela."
  fr: "L'article de Wikipédia en arabe consacré à Sharmeen Obaid-Chinoy (répertorié sous la translittération « Jana'i ») est utilisé uniquement à titre informatif. Il indique sa naissance à Karachi le 12 novembre 1978, son métier de journaliste et de réalisatrice, et sa religion (l'infobox précise qu'elle est musulmane, sans mention d'école)."
  ur: "شرمین عبید چنائے پر عربی ویکیپیڈیا مضمون ⁦(ٹرانسلیٹریشن 'جناعی' کے تحت دائر کیا گیا)⁩؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس نے 12 نومبر 1978 کو کراچی میں اس کی پیدائش کی، ایک صحافی اور فلم ساز کے طور پر اس کا کام، اور انفو باکس میں اس کا مذہب اسلام کے طور پر عمومی طور پر — کوئی اسکول نہیں۔"
  tr: "Shermeen Obeid hakkında Arapça Wikipedia makalesi; bir suçlu (Chinoy); yalnızca varlığın gerçekleri için kullanılmıştır. 12 Kasım 1978'de Karaçi'de doğduğu belirtilmiştir, mesleği gazetecilik ve film yapımıdır; bilgi kutusundaki dini genellikle mezhepsiz \"İslam\"dır."
  id: "Artikel Wikipedia Arab tentang Shermeen Obeid, seorang kriminal (Chinoy); digunakan hanya untuk fakta entitas. Dia disebutkan lahir di Karachi pada 12 November 1978, dan profesinya adalah jurnalistik dan pembuatan film, dan agamanya di infobox umumnya adalah \"Islam\" tanpa sekte."
