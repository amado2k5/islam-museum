reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It gives him as born on 22 September 1915, fifth caliph of the Mourides from 1990 until his death at Touba on 28 December 2007, the last surviving son of Cheikh Ahmadou Bamba, successor to Serigne Abdou Khadr Mbacké and succeeded by his nephew Serigne Mouhamadou Lamine Bara Mbacké; it credits him with more than 400 Islamic schools (daaras where students work the fields, most at Khelcom near Kaolack) and with covering the Grand Mosque of Touba in Italian marble, and records a three-day national mourning. Its short description calls him a 'Senegalese sufi leader' — a description of his role as head of the order — and its text describes him by office and descent; neither states his own initiation or affiliation."
