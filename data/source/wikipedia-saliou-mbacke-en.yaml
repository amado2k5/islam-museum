  ar: "مقالة ويكيبيديا الإنجليزية عن سيرين ساليو مباكي؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في 22 سبتمبر 1915 ووفاته في طوبى في 28 ديسمبر 2007، وخلافته الخامسة للمريدية من 1990 إلى 2007، وأنه آخر أبناء أحمدو بمبا الباقين، وأعماله في المدارس والزراعة وطوبى."
