summary:
  ar: "مقال موسوعي عن قسطنطين ⁦(كوستا)⁩ هورمان (1850–1921)، الموظّف النمساوي المجري من أصل بافاري، مؤسّس ومدير أول للمتحف الوطني للبوسنة والهرسك وجامع الشعر الشفهي لمسلمي البوسنة."
  en: "Encyclopedia article on Konstantin (Kosta) Hörmann (1850–1921), the Austro-Hungarian official of Bavarian descent who founded and first directed the National Museum of Bosnia and Herzegovina and compiled a major collection of Bosnian Muslim oral poetry."
  es: "Artículo de enciclopedia sobre Konstantin (Kosta) Hörmann (1850-1921), el funcionario austrohúngaro de ascendencia bávara que fundó y dirigió por primera vez el Museo Nacional de Bosnia y Herzegovina y recopiló una importante colección de poesía oral musulmana bosnia."
  fr: "Article encyclopédique sur Konstantin (Kosta) Hörmann (1850–1921), le fonctionnaire austro-hongrois d'origine bavaroise qui a fondé et dirigé le Musée national de Bosnie-Herzégovine et a compilé une importante collection de poésie orale musulmane bosniaque."
  ur: "انسائیکلوپیڈیا مضمون کونسٹنٹن ⁦(کوسٹا)⁩ ہورمن (1850–1921) پر، باویرین نسل کے آسٹرو ہنگری کے اہلکار جس نے بوسنیا اور ہرزیگووینا کے قومی عجائب گھر کی بنیاد رکھی اور سب سے پہلے اس کی ہدایت کاری کی اور بوسنیائی مسلم زبانی شاعری کا ایک بڑا مجموعہ مرتب کیا۔"
  tr: "Bavyera kökenli Avusturya-Macaristan yetkilisi, Bosna-Hersek Ulusal Müzesi'nin kurucusu ve ilk müdürü ve Bosnalı Müslümanların Sözlü Şiir Koleksiyoncusu Constantin (Costa) Horman (1850–1921) hakkında ansiklopedik bir makale."
  id: "Sebuah artikel ensiklopedis tentang Constantin (Costa) Horman (1850–1921), pejabat Austria-Hungaria asal Bavaria, pendiri dan direktur pertama Museum Nasional Bosnia dan Herzegovina serta Kolektor Puisi Lisan Muslim Bosnia."
