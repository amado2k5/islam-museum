reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). A substantial article in its own text, not a translation of the English one. It gives her birth on 2 April 1614 — agreeing with the Arabic article against the English article's 23 March — and her death on 16 September 1681, her care of Shah Jahan in confinement until his death, her building of Agra's Jama Masjid in 1648 and of Chandni Chowk and much of Shahjahanabad, and her burial near the Nizamuddin shrine in Delhi. Its dedicated Sufi section is the second of the two attestations the person record's faith settlement rests on — it states that she and her brother Dara Shikoh were disciples of Mullah Shah Badakhshi, who inducted them into the Qadiri order in 1641, and that he wished to leave her the charge of the silsila after him but the order's rules did not permit it. Checked 1 November 2026."
