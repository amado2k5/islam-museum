  ar: منهج توثيق السنة النبوية الشريفة — محمد إبراهيم الفيومي
  en: The Method of Documenting the Prophetic Sunna — Muhammad Ibrahim al-Fayyumi
summary:
  ar: "كتاب الدكتور محمد إبراهيم الفيومي، عضو مجمع البحوث الإسلامية، ضمن السلسلة العلمية للمجمع: يعرض مرتبة السنة في التشريع، وتعريفها عند المحدثين والأصوليين، وتاريخ كتابتها، وأسباب الوضع فيها، وقواعد الإسناد والجرح والتعديل، ومراتب تصنيف الحديث إلى الصحيح؛ 56 صفحة، إشراف الأمين العام للمجمع."
  en: "Muhammad Ibrahim al-Fayyumi's book in the Scientific Series of the Islamic Research Academy of al-Azhar: the rank of the Sunna among the sources of law, its definition for the muhaddithun and the usulis, the history of writing it down, the causes of fabrication, the rules of isnad and of criticism of narrators, and the stages by which hadith was sorted into sound and weak; 56 pages, supervised by the Academy's Secretary-General."
