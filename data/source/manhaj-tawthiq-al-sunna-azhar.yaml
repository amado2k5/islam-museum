label:
  ar: منهج توثيق السنة النبوية الشريفة — محمد إبراهيم الفيومي
  en: The Method of Documenting the Prophetic Sunna — Muhammad Ibrahim al-Fayyumi
summary:
  ar: "كتاب الدكتور محمد إبراهيم الفيومي، عضو مجمع البحوث الإسلامية، ضمن السلسلة العلمية للمجمع: يعرض مرتبة السنة في التشريع، وتعريفها عند المحدثين والأصوليين، وتاريخ كتابتها، وأسباب الوضع فيها، وقواعد الإسناد والجرح والتعديل، ومراتب تصنيف الحديث إلى الصحيح؛ 56 صفحة، إشراف الأمين العام للمجمع."
  en: "Muhammad Ibrahim al-Fayyumi's book in the Scientific Series of the Islamic Research Academy of al-Azhar: the rank of the Sunna among the sources of law, its definition for the muhaddithun and the usulis, the history of writing it down, the causes of fabrication, the rules of isnad and of criticism of narrators, and the stages by which hadith was sorted into sound and weak; 56 pages, supervised by the Academy's Secretary-General."
  es: "Libro de Muhammad Ibrahim al-Fayyumi en la Serie Científica de la Academia de Investigación Islámica de al-Azhar: la posición de la Sunna entre las fuentes de la ley, su definición para los muhaddithun y los usulis, la historia de su escritura, las causas de la falsificación, las reglas del isnad y de la crítica de los narradores, y las etapas por las cuales el hadiz se clasificó en auténtico y débil; 56 páginas, supervisado por el Secretario General de la Academia."
  fr: "Ouvrage de Muhammad Ibrahim al-Fayyumi dans la série scientifique de l'Académie de recherche islamique d'al-Azhar: le rang de la Sunna parmi les sources de la loi, sa définition pour les muhaddithun et les usulis, l'histoire de sa mise par écrit, les causes de la fabrication, les règles de l'isnad et de la critique des narrateurs, et les étapes par lesquelles les hadiths ont été triés en authentiques et en faibles; 56 pages, supervisé par le secrétaire général de l'Académie."
