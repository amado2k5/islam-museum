summary:
  ar: "المجلد 3 من فهرس ثنائي اللغة ⁦(تركي وإنجليزي)⁩ لمحمد أمين يلماز عن المساجد والتكايا والأضرحة العثمانية وغيرها التي حُوّلت إلى كنائس خارج تركيا وداخلها؛ يتناول هذا المجلد: Greece, with fountains in Dobruja and other buildings."
  en: "Volume 3 of Mehmet Emin Yılmaz's bilingual (Turkish and English) catalogue of Ottoman and other Muslim mosques, lodges, tombs and buildings converted into churches; this volume covers Greece, with fountains in Dobruja and other buildings."
  es: "Volumen 3 del catálogo bilingüe (turco e inglés) de Mehmet Emin Yılmaz sobre mezquitas, logias, tumbas y edificios otomanos y de otras culturas musulmanas convertidos en iglesias; este volumen abarca Grecia, incluyendo fuentes en Dobruja y otros edificios."
  fr: "Volume 3 du catalogue bilingue (turc et anglais) de Mehmet Emin Yılmaz sur les mosquées, loges, tombeaux et bâtiments ottomans et autres musulmans convertis en églises; ce volume couvre la Grèce, avec des fontaines en Dobroudja et d'autres bâtiments."
  ur: "مہمت ایمن یلماز کے دو لسانی ⁦(ترکی اور انگریزی)⁩ عثمانی اور دیگر مسلمانوں کی مساجد، قیام گاہوں، مقبروں اور گرجا گھروں میں تبدیل ہونے والی عمارتوں کی کیٹلاگ کی جلد 3؛ یہ حجم یونان پر محیط ہے، ڈوبروجا اور دیگر عمارتوں میں فوارے ہیں۔"
  tr: "Mehmet Emin Yılmaz'ın camiler, tekyalar, Osmanlı türbeleri ve Türkiye içinde ve dışında kiliseye dönüştürülmüş diğer iki dilli (Türkçe ve İngilizce) dizinlerinin 3. cildi; bu cilt: Yunanistan, Dobruca'daki çeşmeler ve diğer binalarla ilgilidir."
  id: "Volume 3 dari indeks dwibahasa (Turki dan Inggris) oleh Mehmet Emin Yilmaz tentang masjid, tekya, dan tempat suci Ottoman serta lainnya yang diubah menjadi gereja baik di dalam maupun di luar Turki; volume ini membahas: Yunani, dengan air mancur di Dobruja dan bangunan lainnya."
