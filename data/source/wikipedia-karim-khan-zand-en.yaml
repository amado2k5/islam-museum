reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It gives his birth as c. 1705 in the village of Pari in the Malayer district, his service as a cavalryman under Nader Shah, his rise through the wars with Ali Mardan Khan Bakhtiari, his rule over Iran except Khorasan and Balochistan from 1751 to 1779 under the title Vakil al-Ra'aya from his capital Shiraz, the siege and capture of Basra in 1775–1776, his courteous custody of the young Agha Mohammad Khan Qajar, and his death at Shiraz on 1 March 1779 after six months of illness. Its religious-policies section records only that, unlike the Safavids, he did not seek the approval of the ulama; it names no religion or legal school for the man himself. Checked 1 November 2026."
