summary:
  ar: "مقالة ويكيبيديا العربية عن عبد الحليم محمود؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 2 جمادى الأولى 1328هـ الموافق 12 مايو 1910 في أبو أحمد ببلبيس، ومسيرته في الأزهر، وتعيينه شيخا للأزهر في 27 مارس 1973 وأزمة استقالته 1974، ونشاطه الإصلاحي ومؤلفاته التي تجاوزت الستين وكثير منها في التصوف والفلسفة؛ وصندوق معلوماتها يعطي مذهبه مالكيا وعقيدته أهل السنة والجماعة."
  en: "Arabic Wikipedia article on Abd al-Halim Mahmud; used for entity facts only. It gives his birth on 2 Jumada al-Awwal 1328 AH (12 May 1910) at Abu Ahmed, Bilbeis, his career at al-Azhar, his appointment as Shaykh al-Azhar on 27 March 1973 and the resignation crisis of 1974, his reform activity and his more than sixty works, many on Sufism and philosophy; its infobox gives his madhhab as Maliki and his creed as Ahl al-Sunna wa-l-Jama'a."
  es: "Artículo en árabe de la Wikipedia sobre Abd al-Halim Mahmud; utilizado únicamente para datos sobre la persona. Indica su nacimiento el 2 de Jumada al-Awwal de 1328 AH (12 de mayo de 1910) en Abu Ahmed, Bilbeis, su trayectoria en al-Azhar, su nombramiento como Shaykh al-Azhar el 27 de marzo de 1973 y la crisis de renuncias de 1974, su actividad reformista y sus más de sesenta obras, muchas de ellas sobre sufismo y filosofía; su ficha informativa indica que su madhhab era Maliki y su credo Ahl al-Sunna wa-l-Jama'a."
  fr: "Article de Wikipédia en arabe sur Abd al-Halim Mahmud; utilisé uniquement pour les informations biographiques. Il indique sa naissance le 2 Jumada al-Awwal 1328 AH (12 mai 1910) à Abu Ahmed, Bilbeis, sa carrière à al-Azhar, sa nomination comme cheikh d'al-Azhar le 27 mars 1973 et la crise de démission de 1974, son activité réformatrice et ses plus de soixante ouvrages, dont beaucoup sur le soufisme et la philosophie; son infobox précise qu'il était de l'école malikite et de la confession sunnite."
  ur: "عبد الحلیم محمود پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 2 جمادی الاول 1328 ہجری ⁦(12 مئی 1910)⁩ کو ابو احمد، بلبیس میں ان کی پیدائش، الازہر میں ان کا کیریئر، 27 مارچ 1973 کو شیخ الازہر کی حیثیت سے ان کی تقرری اور 1974 کا استعفیٰ کا بحران، ان کی اصلاحی سرگرمیاں اور ساٹھ سے زیادہ صوفیوں پر ان کے کارنامے؛ اس کا معلوماتی خانہ اس کا مذہب مالکی اور اس کا عقیدہ اہل السنۃ والجماعۃ دیتا ہے۔"
  tr: "Abdul Halim Mahmoud hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 2 Cumedül-Avvel 1328 Hicri tarihinde, yani 12 Mayıs 1910'da Belbeis'teki Ebu Ahmed'de doğduğu makale, El-Ezher'deki yolculuğu, 27 Mart 1973'te El-Ezher Şeyhi olarak atanması, 1974'teki istifa krizi, reformist faaliyetleri ve altmışı aşan yazıları, bunların çoğu tasavvuf ve felsefe alanında olduğu belirtilir; ayrıca bilgi kutusunda Maliki doktrini ve inancı Ahl-al-Sunnah wal-Jama'ah olarak yer alır."
  id: "Artikel Wikipedia Arab tentang Abdul Halim Mahmoud; digunakan hanya untuk fakta entitas. Artikel ini menyebutkan kelahirannya pada 2 Jumada al-Awwal 1328 H, yang bertepatan dengan 12 Mei 1910 di Abu Ahmad di Belbeis, perjalanannya di Al-Azhar, pengangkatannya sebagai Sheikh Al-Azhar pada 27 Maret 1973, krisis pengunduran dirinya pada 1974, aktivitas reformisnya, dan tulisannya yang melebihi enam puluh, banyak di antaranya tentang Sufisme dan filsafat; dan kotak infonya menyediakan doktrin dan kredo Maliki sebagai Ahl al-Sunnah wal-Jama'ah."
