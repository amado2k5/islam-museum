summary:
  ar: "مقالة ويكيبيديا العربية عن عبد الحليم محمود؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 2 جمادى الأولى 1328هـ الموافق 12 مايو 1910 في أبو أحمد ببلبيس، ومسيرته في الأزهر، وتعيينه شيخا للأزهر في 27 مارس 1973 وأزمة استقالته 1974، ونشاطه الإصلاحي ومؤلفاته التي تجاوزت الستين وكثير منها في التصوف والفلسفة؛ وصندوق معلوماتها يعطي مذهبه مالكيا وعقيدته أهل السنة والجماعة."
  en: "Arabic Wikipedia article on Abd al-Halim Mahmud; used for entity facts only. It gives his birth on 2 Jumada al-Awwal 1328 AH (12 May 1910) at Abu Ahmed, Bilbeis, his career at al-Azhar, his appointment as Shaykh al-Azhar on 27 March 1973 and the resignation crisis of 1974, his reform activity and his more than sixty works, many on Sufism and philosophy; its infobox gives his madhhab as Maliki and his creed as Ahl al-Sunna wa-l-Jama'a."
