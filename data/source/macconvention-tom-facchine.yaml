summary:
  ar: "صفحة المتحدثين في مؤتمر ماك عن توم فاكين؛ تصفه بأنه مدير أبحاث الإسلام والمجتمع في معهد يقين ومدرّس في مدرسة ليغاسي الدولية الإلكترونية، حاصل على البكالوريوس في العلوم السياسية من فاسار (2011) وعلى بكالوريوس كلية الشريعة بالجامعة الإسلامية بالمدينة (2015-2020)."
  en: "The MAC Convention's speaker page for Tom Facchine: Research Director of Islam and Society at the Yaqeen Institute and instructor at Legacy International Online High School, with a BA in Political Science from Vassar College (2011) and a BA from the Faculty of Shariah at the Islamic University of Madinah after study there 2015-2020."
  es: "Página de ponentes de la Convención MAC para Tom Facchine: Director de Investigación sobre Islam y Sociedad en el Instituto Yaqeen e instructor en Legacy International Online High School, con una licenciatura en Ciencias Políticas de Vassar College (2011) y una licenciatura de la Facultad de Sharia de la Universidad Islámica de Medina tras estudiar allí entre 2015 y 2020."
  fr: "Page de présentation de Tom Facchine, intervenant à la convention MAC: directeur de recherche sur l’islam et la société à l’Institut Yaqeen et instructeur à la Legacy International Online High School, titulaire d’une licence en sciences politiques du Vassar College (2011) et d’une licence de la faculté de charia de l’Université islamique de Médine après des études de 2015 à 2020."
  ur: "MAC کنونشن کا سپیکر صفحہ برائے Tom Facchine: Yaqeen Institute میں اسلام اینڈ سوسائٹی کے ریسرچ ڈائریکٹر اور Legacy International Online High School میں انسٹرکٹر، Vassar College (2011) سے پولیٹیکل سائنس میں BA اور اسلامی یونیورسٹی مدینہ کی فیکلٹی آف شریعہ سے BA کے ساتھ 2015-2020 میں تعلیم حاصل کرنے کے بعد۔"
