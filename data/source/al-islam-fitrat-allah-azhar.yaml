  en: Islam, God's Fitra — Muhammad al-Bahi
summary:
  ar: "كتاب الدكتور محمد البهي ⁦(ت. 1982م)⁩، عضو هيئة كبار العلماء، ضمن السلسلة العلمية لمجمع البحوث الإسلامية بالأزهر الشريف، في اتجاه الإسلام إلى الإنسان والمال والملكية والإرث والحرية الفردية؛ 152 صفحة، تقديم أ.د. محمود حمدي زقزوق، إشراف الأمين العام للمجمع."
  en: "Muhammad al-Bahi's book (d. 1982), a member of the Council of Senior Scholars, in the Scientific Series of the Islamic Research Academy of al-Azhar: the Islamic orientation on human nature, wealth, ownership, inheritance and individual liberty; 152 pages, introduced by Mahmud Hamdi Zaqzuq and supervised by the Academy's Secretary-General."
  es: "El libro de Muhammad al-Bahi (fallecido en 1982), miembro del Consejo de Altos Eruditos, publicado en la Serie Científica de la Academia de Investigación Islámica de al-Azhar: la orientación islámica sobre la naturaleza humana, la riqueza, la propiedad, la herencia y la libertad individual; 152 páginas, con introducción de Mahmud Hamdi Zaqzuq y supervisado por el Secretario General de la Academia."
  fr: "L'ouvrage de Muhammad al-Bahi (décédé en 1982), membre du Conseil des grands savants, dans la série scientifique de l'Académie de recherche islamique d'al-Azhar: l'orientation islamique sur la nature humaine, la richesse, la propriété, l'héritage et la liberté individuelle; 152 pages, introduit par Mahmud Hamdi Zaqzuq et supervisé par le secrétaire général de l'Académie."
  ur: "محمد الباہی کی کتاب ⁦(متوفی 1982)⁩، سینئر سکالرز کی کونسل کے رکن، الازہر کی اسلامک ریسرچ اکیڈمی کی سائنسی سیریز میں: انسانی فطرت، دولت، ملکیت، وراثت اور انفرادی آزادی پر اسلامی رجحان؛ 152 صفحات، محمود حامدی زقوق نے متعارف کرایا اور اکیڈمی کے سیکرٹری جنرل کی زیر نگرانی۔"
