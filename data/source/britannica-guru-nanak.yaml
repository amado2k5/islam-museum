reliability_note: "Scholarly encyclopedia biography (published 20 July 1998, the standard date carried by Britannica's biographies in this museum), read in full online on 1 November 2026. An editorial source independent of Wikipedia: its statement that Nanak 'is revered as the founder and the first Guru of Sikhism' is, with the English Wikipedia article's lead, one of the two independent attestations on which the record's documented sikh segment rests. It is candid about the evidence: what is known comes mainly through janamsakhi legend, neither the route nor the places of his travels can be positively identified, and the tales of visits to Baghdad and Mecca are among the earlier posthumous traditions."
