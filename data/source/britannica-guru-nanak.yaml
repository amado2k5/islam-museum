summary:
  ar: "ترجمة غورو ناناك في موسوعة بريتانيكا؛ تصفه نصًا بأنه مؤسس السيخية وأول غورواتها، وتشكك في يوم ميلاده (15 أبريل؟ 1469) وتذكر انقسام التقليد في سنة وفاته بين 1538 و1539 مرجحة 1539، وتعامل رحلاته إلى بغداد ومكة بوصفها من الحكايات المتأخرة."
  en: "Encyclopaedia Britannica's biography of Guru Nanak; it describes him in terms as the revered founder and first Guru of Sikhism, marks his birth day uncertain (April 15?, 1469), reports the tradition divided between 1538 and 1539 for his death with 1539 the more likely, and treats his Baghdad and Mecca journeys as later hagiographical tradition."
