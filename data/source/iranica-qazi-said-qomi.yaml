reliability_note: "Peer-reviewed scholarly entry, read in full. Introduces him as a 'Shiʿite philosopher, jurist, and mystic', gives his birth at Qom on 10 Dhu'l-Qa'da 1049 / 3 March 1640, his teachers (his father, Lahiji, Rajab Ali Tabrizi, Fayz Kashani), his service as qadi of Qom and as court physician and prayer-leader under Abbas II, and his 'traditional Twelver Shiʿite' separation of God's essence and attributes. It shows from the dated completion of the third volume of his Tawhid commentary (18 Ramadan 1107 / 20 April 1696) that he died after that date — the record's death year follows this dated evidence, with the earlier readings preserved."
