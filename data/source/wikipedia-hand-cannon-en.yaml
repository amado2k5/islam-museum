summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن المدفع اليدوي؛ لوقائع الكيان فقط: أقدم الأسلحة النارية الشخصية وخليفة الرمح الناري، انتشاره بالصين في القرن الثالث عشر، شهادة معركة 1288، وصف الحسن الرماح للرماح النارية بين 1240 و1280، نص عربي 1320-1350 يصف المدفع ⁦(مدفع)⁩ بأنه يقذف مقذوفات من أنبوب على رأس قائم — يعده بعضهم مدفعاً يدوياً ويعترض آخرون، استعمال المماليك للمدافع بيقين بحلول 1342 ⁦(هامر)⁩ ووصف القلقشندي مدفعاً معدنياً يقذف كرة حديدية بين 1365 و1376، ونزاع الأصالة: خان يرى نقل المغول للبارود وأن المدافع بلغت مصر المملوكية في سبعينيات القرن الرابع عشر، بينما يدّعي أحمد يوسف الحسن استعمالاً بعين جالوت 1260 يخالفه مؤرخون آخرون."
  en: "English Wikipedia article on the hand cannon; entity facts only: the earliest personal firearm and successor of the fire lance, its 13th-century Chinese spread and the 1288 battle witness, Hasan al-Rammah's fire-lance descriptions c. 1240-1280, the 1320-1350 Arabic text describing a midfa discharging projectiles from a tube on a stock — read by some as a hand cannon and disputed by others, certain Mamluk cannon use by 1342 (Hammer), al-Qalqashandi's 1365-1376 description of a metal cannon firing an iron ball, and the contested chronology: Khan argues Mongol transmission of gunpowder and cannon reaching Mamluk Egypt only in the 1370s, while Ahmad Y. al-Hassan's claimed Ain Jalut 1260 use contradicts other historians."
  es: "Artículo de la Wikipedia en inglés sobre el cañón de mano; solo datos sobre la entidad: la primera arma de fuego personal y sucesora de la lanza de fuego, su difusión en China en el siglo XIII y el testimonio de la batalla de 1288, las descripciones de la lanza de fuego de Hasan al-Rammah c. 1240-1280, el texto árabe de 1320-1350 que describe un midfa que dispara proyectiles desde un tubo en una culata, leído por algunos como un cañón de mano y disputado por otros, cierto uso de cañones mamelucos hacia 1342 (Martillo), la descripción de al-Qalqashandi de 1365-1376 de un cañón de metal que dispara una bola de hierro, y la cronología disputada: Khan argumenta que la transmisión mongola de la pólvora y los cañones llegó al Egipto mameluco solo en la década de 1370, mientras que el uso de Ain Jalut 1260 afirmado por Ahmad Y. al-Hassan contradice a otros historiadores."
  fr: "Article de Wikipédia en anglais sur le canon à main; faits concernant l’arme: première arme à feu individuelle et successeur de la lance à feu, sa diffusion en Chine au XIIIe siècle et le témoignage de la bataille de 1288, les descriptions de la lance à feu par Hasan al-Rammah vers 1240-1280, le texte arabe de 1320-1350 décrivant un midfa tirant des projectiles depuis un tube fixé sur une crosse — interprété par certains comme un canon à main et contesté par d’autres, l’utilisation certaine de canons mamelouks dès 1342 (Marteau), la description par al-Qalqashandi, entre 1365 et 1376, d’un canon en métal tirant une boule de fer, et la chronologie controversée: Khan soutient que la transmission mongole de la poudre à canon et des canons n’a atteint l’Égypte mamelouke que dans les années 1370, tandis que l’utilisation revendiquée par Ahmad Y. al-Hassan à Ain Jalut en 1260 contredit d’autres historiens."
  ur: "ہاتھ کی توپ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق: ابتدائی ذاتی آتشیں اسلحہ اور فائر لانس کا جانشین، اس کا 13ویں صدی کا چینی پھیلاؤ اور 1288 کی جنگ کا گواہ، حسن الرمہ کی فائر لانس کی تفصیل c. 1240-1280، 1320-1350 عربی متن جس میں اسٹاک پر ٹیوب سے پروجیکٹائل خارج کرنے والے مڈفا کو بیان کیا گیا ہے - کچھ لوگوں نے ہاتھ کی توپ کے طور پر پڑھا اور دوسروں کے ذریعہ متنازعہ، کچھ مملوک توپ کا استعمال 1342 ⁦(ہتھوڑا)⁩، القلقاشندی کی 1365-1365 اور دھاتی کینن کی تفصیل مقابلہ کی تاریخ: خان کا کہنا ہے کہ منگول سے بارود اور توپ کی ترسیل صرف 1370 کی دہائی میں مملوک مصر تک پہنچی تھی، جبکہ احمد وائی الحسن کا دعویٰ عین جالوت 1260 کا استعمال دوسرے مورخین سے متصادم ہے۔"
