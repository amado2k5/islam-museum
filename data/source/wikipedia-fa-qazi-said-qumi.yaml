reliability_note: "Read in full. The lead calls him a philosopher, mujtahid, Shi'a marjaʿ and traditionist of the Qom school; his teachers were Rajab Ali Tabrizi in philosophy, Fayz Kashani in the religious sciences and Abd al-Razzaq Lahiji; he was the Shah's personal physician and taught in Qom, where he died between 1100 and 1107 AH and was buried at the start of Chaharmardan (Enqelab) street, near the shrine of Ali b. Babawayh. Its lead solar dates are garbled and were not used."
