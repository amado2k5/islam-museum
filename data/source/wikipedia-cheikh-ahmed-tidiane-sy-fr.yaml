summary:
  ar: "مقالة ويكيبيديا الفرنسية عن الشيخ أحمد التيجاني سي «المكتوم»؛ تُستخدم لوقائع الكيان فقط. توثّق ميلاده في سان لوي في 29 ديسمبر 1925 ابنًا لسرين بابكر سي، وتأسيسه «كوزري ميزولمان» ومجلة «الإسلام الأبدي» سنة 1950، وقيادته الروحية لجماعة المسترشدين، واعتراف أسرته به خليفةً في سنواته الأخيرة، ووفاته في داكار في 15 مارس 2017."
  en: "French Wikipedia article on Cheikh Ahmed Tidiane Sy 'Al Maktoum'; used for entity facts only. It records his birth at Saint-Louis on 29 December 1925 as a son of Serigne Babacar Sy, his founding of the Causerie musulmane instructive and the journal L'Islam éternel in 1950, his spiritual guidance of the Dahiratoul Moustarchidina, his family's recognition of him as khalifa in his last years, and his death at Dakar on 15 March 2017."
