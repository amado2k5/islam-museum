reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md), read in full on 1 November 2026 at the recorded revision, fetched via the MediaWiki API and re-asserted on a second live query. It is the only Wikipedia article on him in any language. Points drawn from it: the lead (1925-2017, 'industriel et religieux musulman sénégalais, khalife de Serigne Babacar Sy de la confrérie Tidiane de Tivaouane'); birth at Saint-Louis on 29 December 1925 to Serigne Babacar Sy and Sokhna Astou Kane, grandson of El Hadji Malick Sy; Islamic studies completed at fourteen and a first book at sixteen; the 1950 Causerie musulmane instructive, the Association éducative islamique (1955) and L'Islam éternel; COSKAS founded for the 1968 Mawlid; spiritual guide of the Dahiratoul Moustarchidina wal Moustarchidaty; founder of the Parti de la Solidarité Sénégalaise (February 1959) and ambassador to the United Arab Republic (decree of 11 November 1960); industrialist (SONACOS, SOCOCIM); writings including Fa Ilayka (1963) and Nahnou Awladou Tijani. On the Tijaniyya the article is explicit about the man himself: born into the order to a khalifa father, 'il est tout à fait normal qu'il soit initié dans ce cadre'; his adherence 'ne découle pas forcément de ses ascendants familiaux'; and it quotes his own verse 'Mon Seigneur m'a béni en ce que je m'appelle At-Tijany'. On succession the article dates his becoming 'grand khalife' to his brother Serigne Mansour Sy's death in 2012 and records both the family's unanimous recognition in his last years and his own rejection of the 'khalife général' title as colonial; he died at Dakar on Wednesday 15 March 2017, was succeeded by his brother Serigne Abdoul Aziz Sy Al-Amin, and was buried at Ndiandakhoum, Tivaouane."
