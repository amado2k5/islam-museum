summary:
  ar: "صفحة المؤلف للشيخ عاصم خان على موقع Islam21c؛ تذكر كتبه الخمسة وحفظه للقرآن وماجستير الصيدلة من كلية لندن الجامعية ودراسته في القاهرة وشغفه بدراسات التفسير."
  en: "The author page of Shaykh Asim Khan on Islam21c; it records his five books, his memorisation of the Qur'ān, his Masters in Pharmacy from University College London, his studies in Cairo and his focus on tafsir studies."
  es: "La página del autor Shaykh Asim Khan en Islam21c; en ella se recogen sus cinco libros, su memorización del Corán, su máster en Farmacia por el University College de Londres, sus estudios en El Cairo y su dedicación a los estudios de tafsir (interpretación del Corán)."
  fr: "La page auteur de Shaykh Asim Khan sur Islam21c; elle recense ses cinq livres, sa mémorisation du Coran, sa maîtrise en pharmacie de l'University College London, ses études au Caire et son intérêt pour les études de tafsir."
  ur: "اسلام21c پر شیخ عاصم خان کا مصنف صفحہ؛ اس میں ان کی پانچ کتابیں، ان کا حفظ قرآن، یونیورسٹی کالج لندن سے فارمیسی میں ماسٹرز، قاہرہ میں ان کی تعلیم اور تفسیر کے مطالعے پر ان کی توجہ درج ہے۔"
  tr: "Sheikh Asim Khan'ın İslam21c üzerine yazar sayfasında beş kitabı, Kur'an ezberi, University College London'dan eczacılık yüksek lisansı, Kahire'deki eğitimi ve Kuran tefsümiyetine olan tutkusu bahsediliyor."
  id: "Halaman penulis Sheikh Asim Khan di Islam21c menyebutkan lima bukunya, hafalan Al-Qur'an, gelar magister farmasi dari University College London, studinya di Kairo, dan kecintaannya pada studi penafsiran Al-Qur'an."
