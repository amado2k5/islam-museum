summary:
  ar: "مقالة ياسر طبّاع في مجلة Muqarnas ⁦(3, 1985)⁩ تدعو إلى منشأ بغدادي عباسي للمقرنص مستندةً إلى قبة الإمام دور بسامراء ⁦(1090)⁩ والانتشار السريع اللاحق."
  en: "Yasser Tabbaa's Muqarnas-journal paper (vol. 3, 1985) arguing for an Abbasid Baghdad origin of the muqarnas dome, from the Imam Dur mausoleum at Samarra (1090) and the form's rapid subsequent spread."
  ur: "یاسر طباع کا Muqarnas جرنل مقالہ ⁦(جلد 3، 1985)⁩ جو سامراء کے مقبرۂ امام دور ⁦(1090ء)⁩ اور تیز پھیلاؤ کی بنیاد پر مقرنس گنبد کے عباسی بغدادی آغاز کی دعو کرتا ہے۔"
  es: "El artículo de la revista Muqarnas de Yasser Tabbaa (vol. 3, 1985) defiende un origen abasí en Bagdad de la cúpula de los muqarnas, del mausoleo del Imam Dur en Samarra (1090) y la rápida difusión posterior de la forma."
