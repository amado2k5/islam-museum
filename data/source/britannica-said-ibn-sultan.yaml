summary:
  ar: "مادة في موسوعة بريطانيكا عن سعيد بن سلطان ⁦(وُلد 1791 في عُمان، وتوفي في 19 أكتوبر 1856 في البحر)⁩، حاكم مسقط وعُمان وزنجبار (1806-1856) الذي جعل زنجبار القوة الأولى في شرق أفريقيا والعاصمة التجارية لغرب المحيط الهندي؛ تذكر صراحة أنه كان ينتمي إلى المذهب الإباضي في الإسلام، وأنه قسّم ممتلكاته بوصيته بين ابنيه ماجد ⁦(زنجبار)⁩ وثويني ⁦(مسقط وعُمان)⁩."
  en: "Encyclopaedia Britannica entry on Said bin Sultan (born 1791 in Oman, died 19 October 1856 at sea), ruler of Muscat and Oman and of Zanzibar (1806–56) who made Zanzibar the principal power in East Africa and the commercial capital of the western Indian Ocean; it states expressly that he belonged to the Ibadi sect of Islam, and that his will divided his dominions between his sons Majid (Zanzibar) and Thuwaini (Muscat and Oman)."
  es: "Entrada de la Enciclopedia Británica sobre Said bin Sultan (nacido en 1791 en Omán, fallecido el 19 de octubre de 1856 en el mar), gobernante de Mascate y Omán y de Zanzíbar (1806-1856), quien convirtió a Zanzíbar en la principal potencia de África Oriental y la capital comercial del océano Índico occidental; afirma expresamente que pertenecía a la secta ibadí del Islam y que su testamento dividió sus dominios entre sus hijos Majid (Zanzíbar) y Thuwaini (Mascate y Omán)."
  fr: "L'article de l'Encyclopædia Britannica sur Said bin Sultan (né en 1791 à Oman, mort le 19 octobre 1856 en mer), souverain de Mascate et d'Oman et de Zanzibar (1806-1856), qui fit de Zanzibar la principale puissance d'Afrique de l'Est et la capitale commerciale de l'océan Indien occidental, indique expressément qu'il appartenait à la secte ibadite de l'islam et que son testament divisait ses territoires entre ses fils Majid (Zanzibar) et Thuwaini (Mascate et Oman)."
  ur: "انسائیکلوپیڈیا برٹانیکا کا اندراج سید بن سلطان ⁦(عمان میں 1791 میں پیدا ہوا، 19 اکتوبر 1856 کو سمندر میں انتقال ہوا)⁩، مسقط اور عمان اور زنجبار کے حکمران (1806-56) جنہوں نے زنزیبار کو مشرقی افریقہ کی اصل طاقت اور مغربی بحر ہند کا تجارتی دارالحکومت بنایا؛ اس میں واضح طور پر کہا گیا ہے کہ ان کا تعلق اسلام کے عبادی فرقے سے تھا، اور یہ کہ ان کی وصیت نے ان کے بیٹوں ماجد ⁦(زنجبار)⁩ اور تھوینی ⁦(مسقط اور عمان)⁩ کے درمیان اپنی حکومتیں تقسیم کر دی تھیں۔"
  tr: "Encyclopaedia Britannica'da Said bin Sultan (1791 yılında Umman'da doğdu, 19 Ekim 1856'da denizde öldü), Muskat, Umman ve Zanzibar'ın hükümdarı (1806-1856) hakkında bir kayıt; Zanzibar'ı Doğu Afrika'nın en büyük gücü ve batı Hint Okyanusu'nun ticari başkenti yapan Said bin Sultan hakkında bir kayıt; açıkça İbadi İslam mezhebine mensup olduğu ve vasiyetiyle mülklerini iki oğlu Majid (Zanzibar) ve Thuwaini (Maskat ve Umman) arasında paylaştığı belirtilir."
  id: "Sebuah entri dalam Encyclopaedia Britannica tentang Said bin Sultan (lahir 1791 di Oman, meninggal pada 19 Oktober 1856 di laut), penguasa Muscat, Oman, dan Zanzibar (1806-1856), yang menjadikan Zanzibar sebagai kekuatan utama di Afrika Timur dan ibu kota perdagangan Samudra Hindia barat; entri tersebut secara eksplisit menyatakan bahwa ia termasuk dalam sekte Islam Ibadi dan membagi harta bemilihnya melalui wasiatnya antara dua putranya, Majid (Zanzibar) dan Thuwaini (Muscat dan Oman)."
