summary:
  ar: "مادة في موسوعة بريطانيكا عن سعيد بن سلطان (وُلد 1791 في عُمان، وتوفي في 19 أكتوبر 1856 في البحر)، حاكم مسقط وعُمان وزنجبار (1806-1856) الذي جعل زنجبار القوة الأولى في شرق أفريقيا والعاصمة التجارية لغرب المحيط الهندي؛ تذكر صراحة أنه كان ينتمي إلى المذهب الإباضي في الإسلام، وأنه قسّم ممتلكاته بوصيته بين ابنيه ماجد (زنجبار) وثويني (مسقط وعُمان)."
  en: "Encyclopaedia Britannica entry on Said bin Sultan (born 1791 in Oman, died 19 October 1856 at sea), ruler of Muscat and Oman and of Zanzibar (1806–56) who made Zanzibar the principal power in East Africa and the commercial capital of the western Indian Ocean; it states expressly that he belonged to the Ibadi sect of Islam, and that his will divided his dominions between his sons Majid (Zanzibar) and Thuwaini (Muscat and Oman)."
