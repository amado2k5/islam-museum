summary:
  ar: "مدخل «الرياضيات» في موسوعة TDV الإسلامية بقلم رشدي راشد: أصل الكلمة اليوناني وانتقالها إلى «التعاليم» ثم «الرياضيات»، ونشأة البحث الرياضي في بغداد القرن التاسع مع حركة الترجمة، وكتاب الخوارزمي في الجبر والمقابلة، ثم ثابت بن قرة وأبو كامل والكرجي والسموأل وعمر الخيام وصولاً إلى الكاشي في سمرقند."
  en: "The TDV İslâm Ansiklopedisi entry on mathematics by Roshdi Rashed: the Greek word mathemata rendered as ulum-i ta'alim and then riyaziyyat; the birth of mathematical research in ninth-century Baghdad with the translation movement; al-Khwarizmi's algebra as the first book of an independent branch; then Thabit ibn Qurra, Abu Kamil, al-Karaji, al-Samaw'al, Umar al-Khayyam and on to al-Kashi at Samarkand."
  es: "La entrada de Roshdi Rashed en la TDV İslâm Ansiklopedisi sobre matemáticas: la palabra griega mathemata traducida como ulum-i ta'alim y luego riyaziyyat; el nacimiento de la investigación matemática en Bagdad en el siglo IX con el movimiento de traducción; el álgebra de al-Juarismi como el primer libro de una rama independiente; luego Thabit ibn Qurra, Abu Kamil, al-Karaji, al-Samaw'al, Umar al-Khayyam y hasta al-Kashi en Samarcanda."
  fr: "L'article de Roshdi Rashed sur les mathématiques dans l'ouvrage TDV İslâm Ansiklopedisi: le mot grec mathemata traduit par ulum-i ta'alim puis riyaziyyat; la naissance de la recherche mathématique à Bagdad au IXe siècle avec le mouvement de traduction; l'algèbre d'al-Khwarizmi comme premier livre d'une branche indépendante; puis Thabit ibn Qurra, Abu Kamil, al-Karaji, al-Samaw'al, Umar al-Khayyam et enfin al-Kashi à Samarcande."
  ur: "ریاضی پر TDV İslâm Ansiklopedisi entry by Roshdi Rashed: یونانی لفظ mathemata جس کا ترجمہ علم العلم اور پھر ریاضیات۔ نویں صدی کے بغداد میں ترجمے کی تحریک کے ساتھ ریاضیاتی تحقیق کی پیدائش؛ الخوارزمی کا الجبرا ایک آزاد شاخ کی پہلی کتاب کے طور پر؛ پھر ثابت بن قرہ، ابو کامل، الکراجی، السموال، عمر الخیام اور سمرقند میں الکاشی کی طرف روانہ ہوئے۔"
