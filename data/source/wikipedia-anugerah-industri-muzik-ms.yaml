  ur: "Anugerah Industri Muzik پر مالائی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق: منتظم اور معاون ادارہ، 1993 میں اس کا آغاز، 2011 کے تنازعہ کے بعد آڈیٹر کی تبدیلی، موجودہ اور بند شدہ زمرہ جات بشمول دو ناسید زمرے، اور جدول۔ ایڈیشن ٹیبل اور اصل کہانی میں کوئی قطار حوالہ نہیں ہے اور انفرادی اعزاز کے لیے استعمال نہیں کیا جاتا ہے۔"
