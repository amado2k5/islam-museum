summary:
  ar: "مقالة ويكيبيديا الملايوية عن جوائز صناعة الموسيقى الماليزية؛ لوقائع الكيان فقط: الجهة المنظمة والداعمة، وبدايتها سنة 1993، وتغيير المدقق بعد جدل 2011، والفئات الحالية والملغاة ومنها فئتا النشيد، وجدول الدورات؛ جدول الدورات وتاريخ الفكرة فيها بلا مصادر مفصلة فلا يُعتمد عليهما في الجوائز الفردية."
  en: "Malay Wikipedia article on the Anugerah Industri Muzik; entity facts only: the organiser and supporting body, its start in 1993, the change of auditor after the 2011 controversy, the current and discontinued categories including the two nasyid categories, and the table of editions; the editions table and the origin story carry no row citations and are not used for individual honours."
  es: "Artículo de Wikipedia en malayo sobre los Anugerah Industri Muzik; solo datos sobre la entidad: el organizador y el organismo de apoyo, su inicio en 1993, el cambio de auditor tras la controversia de 2011, las categorías actuales y descontinuadas, incluidas las dos categorías nasyid, y la tabla de ediciones; la tabla de ediciones y la historia del origen no contienen citas de filas y no se utilizan para honores individuales."
