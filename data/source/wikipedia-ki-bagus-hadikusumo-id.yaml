summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن كي باغوس هاديكوسومو (بعنوان «Bagoes Hadikoesoemo»)؛ تُستخدم لوقائع الكيان فقط، وهي مقالته الوحيدة في أي لغة من اللغات المدروسة. تعطي ميلاده باسم رادن هدايت في كاومان بيوجياكارتا في 24 تشرين الثاني 1890 — وتذكر أن تاريخه الهجري الاثنين 11 ربيع الآخر 1308 — ووفاته في جاكرتا في 4 تشرين الثاني 1954 ودفنه في مقبرة باكونتشين بيوجياكارتا، ورئاسته للمحمدية خلفًا لماس منصور، وعضويته في لجنة التحقيق ومدافعته عن ميثاق جاكرتا. حقل الديانة في صندوقها معلَّق خارج النص فلا يظهر."
  en: "Indonesian Wikipedia article on Ki Bagus Hadikusumo (titled 'Bagoes Hadikoesoemo'); used for entity facts only, and his only article in any language consulted. It gives his birth as Raden Hidajat at Kauman, Yogyakarta, on 24 November 1890 — noting the Hijri date as Monday 11 Rabi' al-Akhir 1308 — his death in Jakarta on 4 November 1954 and his burial at Pakuncen cemetery, Yogyakarta, his Muhammadiyah chairmanship in succession to Mas Mansoer, and his BPUPKI membership and defence of the Jakarta Charter. The religion field of its infobox is commented out in the wikitext, so it does not display."
