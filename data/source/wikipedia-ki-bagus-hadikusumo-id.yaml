summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن كي باغوس هاديكوسومو ⁦(بعنوان «Bagoes Hadikoesoemo»)⁩؛ تُستخدم لوقائع الكيان فقط، وهي مقالته الوحيدة في أي لغة من اللغات المدروسة. تعطي ميلاده باسم رادن هدايت في كاومان بيوجياكارتا في 24 تشرين الثاني 1890 — وتذكر أن تاريخه الهجري الاثنين 11 ربيع الآخر 1308 — ووفاته في جاكرتا في 4 تشرين الثاني 1954 ودفنه في مقبرة باكونتشين بيوجياكارتا، ورئاسته للمحمدية خلفًا لماس منصور، وعضويته في لجنة التحقيق ومدافعته عن ميثاق جاكرتا. حقل الديانة في صندوقها معلَّق خارج النص فلا يظهر."
  en: "Indonesian Wikipedia article on Ki Bagus Hadikusumo (titled 'Bagoes Hadikoesoemo'); used for entity facts only, and his only article in any language consulted. It gives his birth as Raden Hidajat at Kauman, Yogyakarta, on 24 November 1890 — noting the Hijri date as Monday 11 Rabi' al-Akhir 1308 — his death in Jakarta on 4 November 1954 and his burial at Pakuncen cemetery, Yogyakarta, his Muhammadiyah chairmanship in succession to Mas Mansoer, and his BPUPKI membership and defence of the Jakarta Charter. The religion field of its infobox is commented out in the wikitext, so it does not display."
  es: "Artículo de la Wikipedia en indonesio sobre Ki Bagus Hadikusumo (titulado 'Bagoes Hadikoesoemo'); utilizado únicamente para datos sobre la entidad, y su único artículo en cualquier idioma consultado. Indica su nacimiento como Raden Hidajat en Kauman, Yogyakarta, el 24 de noviembre de 1890 —indicando la fecha Hijri como lunes 11 Rabi' al-Akhir 1308— su muerte en Yakarta el 4 de noviembre de 1954 y su entierro en el cementerio de Pakuncen, Yogyakarta, su presidencia de Muhammadiyah en sucesión de Mas Mansoer, y su membresía en BPUPKI y defensa de la Carta de Yakarta. El campo de religión de su ficha informativa está comentado en el wikitexto, por lo que no se muestra."
  fr: "L'article de Wikipédia indonésien consacré à Ki Bagus Hadikusumo (intitulé « Bagoes Hadikoesoemo ») ne contient que des informations biographiques et est le seul article le concernant, toutes langues confondues. Il indique sa naissance sous le nom de Raden Hidajat à Kauman, Yogyakarta, le 24 novembre 1890 (date hégirienne: lundi 11 Rabi' al-Akhir 1308), son décès à Jakarta le 4 novembre 1954 et son inhumation au cimetière de Pakuncen, à Yogyakarta. On y trouve également des informations sur sa succession à la présidence de la Muhammadiyah par Mas Mansoer, son appartenance à la BPUPKI et sa défense de la Charte de Jakarta. Le champ « religion » de son infobox est commenté dans le wikitexte et n'apparaît donc pas."
  ur: "انڈونیشیائی ویکیپیڈیا مضمون کی باگس ہادیکوسومو پر ⁦(عنوان 'باگوس ہادیکوسومو')⁩؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے، اور کسی بھی زبان میں اس کے واحد مضمون سے مشورہ کیا جاتا ہے۔ اس نے 24 نومبر 1890 کو کومان، یوگیاکارتا میں ریڈن حجت کے طور پر جنم لیا - ہجری تاریخ کو پیر 11 ربیع الآخیر 1308 کے طور پر نوٹ کیا - ان کی وفات 4 نومبر 1954 کو جکارتہ میں ہوئی اور ان کی تدفین پاکونسن قبرستان، یوگیاکارتہ میں ہوئی، اس کی کامیابی میں ان کے بی پی یو کے چیئرمین اور محمد پی یو کے سربراہ بن گئے۔ جکارتہ چارٹر کی رکنیت اور دفاع۔ اس کے معلوماتی خانے کے مذہب کے شعبے پر ویکی ٹیکسٹ میں تبصرہ کیا گیا ہے، اس لیے یہ ظاہر نہیں ہوتا ہے۔"
  tr: "Endonezya Vikipedi'sinde Ki Bagus Hadikoesoemo hakkında yazılmış makale (\"Bagoes Hadikoesoemo\" başlığıyla) yalnızca varlığın gerçekleri için kullanılır ve incelenen dillerde yayımlanan tek makalesidir. Doğumu, 24 Kasım 1890'da Bügyakarta'daki Kauman'da Radan Hidayat olarak verilmiştir — hicri tarihi Pazartesi, 11 Rabi' al-Thani 1308 olarak belirtilmiştir — 4 Kasım 1954'te Cakarta'da ölümü, Büyügyakarta'daki Bakuncin Mezarlığı'na defnedilmesi, Mas Mansour'dan sonra Muhammediye'nin liderliği, soruşturma komitesindeki üyeliği ve Cakarta Şartı'nın savunulması olarak belirtilmiştir. Kutucundaki din alanı metnin dışında asılı ve görünmez."
  id: "Artikel Wikipedia Indonesia tentang Ki Bagus Hadikoesoemo (berjudul \"Bagoes Hadikoesoemo\") hanya digunakan untuk fakta-fakta entitas tersebut dan merupakan satu-satunya artikelnya dalam bahasa yang dipelajari. Namanya lahir sebagai Radan Hidayat di Kauman, Bügyakarta pada 24 November 1890 — menyebutkan tanggal Hijriyahnya sebagai Senin, 11 Rabi' al-Thani 1308 — kematiannya di Jakarta pada 4 November 1954, pemakamannya di Pemakaman Bakuncin di Büyügyakarta, kepemimpinannya atas Mohammadiyah setelah Mas Mansour, keanggotaannya dalam komite penyelidikan, dan pembelaannya terhadap Piagam Jakarta. Bidang agama dalam kotaknya tergantung di luar teks dan tidak tercantum."
