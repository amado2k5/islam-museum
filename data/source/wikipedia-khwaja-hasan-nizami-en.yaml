summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن خواجة حسن النظامي (1878–1955)، وتنص في متنها على أنه ولي صوفي هندي وأديب أردي، وأنه كان له تلاميذ كثيرون، وأنه من سلسلة نظام الدين أولياء، وتذكر في سياق إحيائه مجالس محرم في دلهي بعد التقسيم أنه كان من أهل السنة والجماعة."
  en: "The English Wikipedia article on Khwaja Hasan Nizami (1878–1955), which states in its text that he was an Indian Sufi saint and Urdu essayist with many disciples, that he was of Nizamuddin Auliya's silsila, and — in the passage on his reviving Delhi's Muharram gatherings after Partition — that he was part of the Ahl us Sannah wal Jammah."
