summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن خواجة حسن النظامي (1878–1955)، وتنص في متنها على أنه ولي صوفي هندي وأديب أردي، وأنه كان له تلاميذ كثيرون، وأنه من سلسلة نظام الدين أولياء، وتذكر في سياق إحيائه مجالس محرم في دلهي بعد التقسيم أنه كان من أهل السنة والجماعة."
  en: "The English Wikipedia article on Khwaja Hasan Nizami (1878–1955), which states in its text that he was an Indian Sufi saint and Urdu essayist with many disciples, that he was of Nizamuddin Auliya's silsila, and — in the passage on his reviving Delhi's Muharram gatherings after Partition — that he was part of the Ahl us Sannah wal Jammah."
  es: "El artículo de la Wikipedia en inglés sobre Khwaja Hasan Nizami (1878-1955), que afirma en su texto que fue un santo sufí indio y ensayista en urdu con muchos discípulos, que pertenecía a la silsila de Nizamuddin Auliya y, en el pasaje sobre su reactivación de las reuniones de Muharram en Delhi después de la Partición, que era parte de Ahl us Sannah wal Jammah."
  fr: "L'article de Wikipédia en anglais sur Khwaja Hasan Nizami (1878-1955), qui indique dans son texte qu'il était un saint soufi indien et un essayiste ourdou avec de nombreux disciples, qu'il appartenait à la silsila de Nizamuddin Auliya, et — dans le passage sur sa relance des rassemblements de Muharram à Delhi après la Partition — qu'il faisait partie de l'Ahl us Sannah wal Jammah."
  ur: "خواجہ حسن نظامی (1878-1955) پر انگریزی ویکیپیڈیا کا مضمون، جس کے متن میں کہا گیا ہے کہ وہ ایک ہندوستانی صوفی بزرگ اور اردو کے بہت سے شاگردوں کے ساتھ مضمون نگار تھے، کہ وہ نظام الدین اولیاء کے سلسلۂ سلسہ میں سے تھے، اور - ان کے دوبارہ زندہ کرنے والے دہلی کے محرم کے اجتماعات کے حوالے سے کہا گیا ہے کہ وہ تقسیم ہند کے بعد ہم میں سے ایک صوفی بزرگ تھے۔"
  tr: "Khwaja Hasan al-Nizami (1878–1955) hakkında İngilizce Wikipedia makalesi, onun bir Hint Sufi azizi ve Urdu edebiyatçısı olduğu, birçok öğrencisi olduğu ve Nizamuddin aziz soyundan geldiği belirtilmektedir. Bölünme sonrası Delhi'deki Muharrem toplantıları bağlamında, Sünni topluluğun takipçisi olduğu belirtilmektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Khwaja Hasan al-Nizami (1878–1955), yang menyatakan bahwa ia adalah seorang wali Sufi India dan tokoh sastra Urdu, bahwa ia memiliki banyak murid, dan bahwa ia berasal dari garis keturunan para wali Nizamuddin. Dalam konteks pertemuan Muharram-nya di Delhi setelah pemisahan disebutkan bahwa ia adalah pengikut komunitas Sunni."
