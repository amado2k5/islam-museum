summary:
  ar: "مقالة ويكيبيديا العربية عن حامد كرزاي؛ تُستخدم لوقائع الكيان فقط. تروي مولده في 24 ديسمبر 1957 في قرية كرز بولاية قندهار، ودراسته الابتدائية في كابل ودراسته الجامعية في الهند، ورئاسته لأفغانستان من 2001 إلى 2014 ووصفه لطالبان بأنهم إخوته. يعطي صندوق معلوماتها دينه «إسلام سني»."
  en: "Arabic Wikipedia article on Hamid Karzai; used for entity facts only. It recounts his birth on 24 December 1957 in the village of Karz, Kandahar Province, his primary schooling in Kabul and his university study in India, his presidency of Afghanistan from 2001 to 2014, and his description of the Taliban as his brothers. Its infobox gives his religion as Sunni Islam."
  ur: "حامد کرزئی پر عربی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے مستعمل۔ اس میں 24 دسمبر 1957ء کو صوبہ قندھار کے گاؤں کرز میں ان کی پیدائش، کابل میں ان کی ابتدائی تعلیم اور بھارت میں جامعی تعلیم، 2001ء سے 2014ء تک افغانستان کی صدارت اور طالبان کو اپنا بھائی کہنا بیان ہوا ہے۔ اس کے معلوماتی خانے میں ان کا مذہب اسلام سنی درج ہے۔"
