  ar: "مقالة ويكيبيديا الإنجليزية عن مصطفى كمال أتاتورك ⁦(نحو 1881 – 10 تشرين الثاني 1938)⁩، مؤسس الجمهورية التركية وأول رؤسائها؛ تعرض مسيرته العسكرية من سالونيك وموناستير وحرب الاستقلال، وإصلاحاته العلمانية من إلغاء الخلافة إلى قانون القبعة والأبجدية اللاتينية، وتختم بفصل عن الجدل حول معتقداته الدينية الشخصية بين التأكيدات الإسلامية في خطاباته ونسبته عند باحثين إلى اللاأدرية أو الربوبية أو الإلحاد."
  en: "English Wikipedia article on Mustafa Kemal Atatürk (c. 1881 – 10 November 1938), founder and first president of the Republic of Turkey; it covers his military career from Salonica and Monastir through the War of Independence, his secularising reforms from the abolition of the caliphate to the Hat Law and the Latin alphabet, and closes with a section on the debate over his personal religious beliefs, between the positive affirmations of Islam in his speeches and scholarly attributions of agnosticism, deism or atheism."
