summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مصطفى كمال أتاتورك ⁦(نحو 1881 – 10 تشرين الثاني 1938)⁩، مؤسس الجمهورية التركية وأول رؤسائها؛ تعرض مسيرته العسكرية من سالونيك وموناستير وحرب الاستقلال، وإصلاحاته العلمانية من إلغاء الخلافة إلى قانون القبعة والأبجدية اللاتينية، وتختم بفصل عن الجدل حول معتقداته الدينية الشخصية بين التأكيدات الإسلامية في خطاباته ونسبته عند باحثين إلى اللاأدرية أو الربوبية أو الإلحاد."
  en: "English Wikipedia article on Mustafa Kemal Atatürk (c. 1881 – 10 November 1938), founder and first president of the Republic of Turkey; it covers his military career from Salonica and Monastir through the War of Independence, his secularising reforms from the abolition of the caliphate to the Hat Law and the Latin alphabet, and closes with a section on the debate over his personal religious beliefs, between the positive affirmations of Islam in his speeches and scholarly attributions of agnosticism, deism or atheism."
  es: "Artículo de la Wikipedia en inglés sobre Mustafa Kemal Atatürk (c. 1881 – 10 de noviembre de 1938), fundador y primer presidente de la República de Turquía; abarca su carrera militar desde Salónica y Monastir hasta la Guerra de la Independencia, sus reformas secularizadoras desde la abolición del califato hasta la Ley del Sombrero y el alfabeto latino, y concluye con una sección sobre el debate en torno a sus creencias religiosas personales, entre las afirmaciones positivas del Islam en sus discursos y las atribuciones académicas de agnosticismo, deísmo o ateísmo."
  fr: "L'article de Wikipédia en anglais sur Mustafa Kemal Atatürk (vers 1881 – 10 novembre 1938), fondateur et premier président de la République de Turquie, retrace sa carrière militaire de Salonique et Monastir à la guerre d'indépendance, ses réformes laïques de l'abolition du califat à la loi sur le chapeau et à l'alphabet latin, et se termine par une section sur le débat concernant ses convictions religieuses personnelles, entre les affirmations positives de l'islam dans ses discours et les attributions savantes d'agnosticisme, de déisme ou d'athéisme."
  ur: "مصطفی کمال اتاترک ⁦(c. 1881 - 10 نومبر 1938)⁩ پر انگریزی ویکیپیڈیا مضمون، جمہوریہ ترکی کے بانی اور پہلے صدر؛ اس میں سالونیکا اور موناسٹر سے جنگ آزادی کے ذریعے ان کے فوجی کیریئر، خلافت کے خاتمے سے لے کر ہیٹ لا اور لاطینی حروف تہجی تک ان کی سیکولرائزنگ اصلاحات، اور ان کے ذاتی مذہبی عقائد پر بحث کے ایک حصے کے ساتھ، ان کی تقاریر میں اسلام کے مثبت اثبات اور علمی وابستگی یا علمی وابستگی کے درمیان شامل ہیں۔"
  tr: "Türk Cumhuriyeti'nin kurucusu ve ilk cumhurbaşkanı Mustafa Kemal Atatürk (yaklaşık 1881 – 10 Kasım 1938) hakkında İngilizce Wikipedia makalesi; Selanik ve Monastir'den Kurtuluş Savaşı'na kadar olan askeri kariyerini ve halifeliğin kaldırılmasından şapka yasası ve Latin alfabesine kadar olan seküler reformlarını sunar. Kişisel dini inançları üzerine tartışmayı, konuşmalarındaki İslami teydiler ile araştırmacılar arasında agnostisizm, lordluk veya ateizme atfedilmesi arasındaki tartışmayı ele alan bir bölümle sona erer."
  id: "Artikel Wikipedia bahasa Inggris tentang Mustafa Kemal Atatürk (sekitar 1881 – 10 November 1938), pendiri Republik Turki dan presiden pertamanya; artikel ini menampilkan karier militernya dari Thessaloniki dan Monastir hingga Perang Kemerdekaan, serta reformasi sekulernya dari penghapusan kekhalifahan hingga hukum topi dan alfabet Latin. Artikel ini ditutup dengan bab tentang perdebatan tentang keyakinan agama pribadinya, antara afirmasi Islam dalam pidatonya dan atribusinya di kalangan peneliti pada agnostisisme, kekuasaan, atau ateisme."
