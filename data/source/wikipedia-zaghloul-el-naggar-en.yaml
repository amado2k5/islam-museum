reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026), read through the MediaWiki API at revision 1368789036 on 1 November 2026. Gives: Zaghloul Ragheb Mohammed Al Naggar, Egyptian geologist and author, 17 November 1933 - 9 November 2025 (died in Amman); BSc Cairo; PhD in geology, University of Wales, 1963, thesis on the Esna-Idfu region of the Nile Valley; Fellow of the Islamic Academy of Sciences (1988); imprisoned as a student for political activism, in exile from the early 1960s until 1970; the book 'The Geological Concept of Mountains in the Qur'an' (2003); chair of geology at King Fahd University of Petroleum and Minerals; later Chairman of the Committee of Scientific Notions in the Qur'an, Supreme Council of Islamic Affairs, Cairo. It also lists claims it calls controversial (camel urine as treatment, 9/11 denial, a 2004 claim about NASA and the splitting of the Moon). The infobox read names no school. Recorded in docs/authenticity-ledger/pages/wikipedia-zaghloul-el-naggar-en.yaml."
