reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Covers her birth at Constantinople on 11 June 1884, her education at home and at the American College for Girls (graduated 1901), her marriages to Salih Zeki Bey (divorced 1910) and to Dr Adnan Adıvar (1917), her school-inspectorship in Beirut, Damascus and Aleppo in 1916-17 and the Antoura orphanage, her role in the Turkish War of Independence and the founding of the Anadolu Agency in 1920, her exile in Europe 1926-1939, her professorship at Istanbul University from 1939 and her parliamentary term 1950-1954, and her death at Istanbul on 9 January 1964. The Antoura material is contested and is presented in the person record attributed to its named scholars and witnesses, never in the museum's voice. Wikidata also carries an 1883 birth-year value; the article's 1884 is followed. The article names no school of Islam for her. Read in full on 24 October 2026."
