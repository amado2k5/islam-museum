reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read on 24 October 2026. The article is a full parallel of the English article and shares much of its text and its scholarly base (Adrawi; Rizwi; Tayyab), so for the faith attestation it is counted as corroboration of the English article rather than as a third independent community; the independence in the record's faith note rests on the English and Arabic editions. Its own infobox nevertheless states the same data independently in Urdu: denomination Sunni (اہل سنت), madhhab Hanafi (حنفی), Sufi order Chishtiyya–Sabiriyya–Imdadiyya, teachers Mahmud Deobandi and Muhammad Qasim Nanawtawi, discipleship under Imdadullah Muhajir Makki and Rashid Ahmad Gangohi, and his offices (third principal of Darul Uloom Deoband 1890–1915; president of Jamiat Ulema-e-Hind, November 1920)."
