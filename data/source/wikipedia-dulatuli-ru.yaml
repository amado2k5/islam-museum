summary:
  ar: "مقالة ويكيبيديا الروسية عن ميرجاقيب دولاتوف ⁦(25 نوفمبر 1885 – 5 أكتوبر 1935)⁩؛ تُستخدم لوقائع الكيان فقط. توثّق شعره ونثره وأسماءه المستعارة وقيادته في ألاش أوردا ووفاته في مستشفى معسكر سوسنوفيتس في كاريليا سنة 1935."
  en: "Russian Wikipedia article on Mirzhakip Dulatov (25 November 1885 – 5 October 1935); used for entity facts only. It documents his poetry and prose, his pseudonyms, his Alash-Orda leadership and his death in the Sosnovets camp infirmary in Karelia in 1935."
  es: "Artículo de la Wikipedia en ruso sobre Mirzhakip Dulatov (25 de noviembre de 1885 - 5 de octubre de 1935); utilizado únicamente para datos biográficos. Documenta su poesía y prosa, sus seudónimos, su liderazgo en Alash-Orda y su muerte en la enfermería del campo de Sosnovets en Karelia en 1935."
  fr: "Article de Wikipédia en russe sur Mirzhakip Dulatov (25 novembre 1885 – 5 octobre 1935); utilisé uniquement à des fins d’information sur l’entité. Il documente sa poésie et sa prose, ses pseudonymes, son rôle à la tête d’Alash-Orda et sa mort à l’infirmerie du camp de Sosnovets en Carélie en 1935."
  ur: "میرزاکیپ دولاتوف پر روسی ویکیپیڈیا مضمون ⁦(25 نومبر 1885 - 5 اکتوبر 1935)⁩؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کی شاعری اور نثر، اس کے تخلص، اس کی الاش-اوردا کی قیادت اور 1935 میں کیریلیا میں سوسنویٹ کیمپ انفرمری میں اس کی موت کی دستاویز کی گئی ہے۔"
