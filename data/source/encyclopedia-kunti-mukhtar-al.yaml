summary:
  ar: "مادة موسوعية عن الشيخ سيدي مختار الكبير الكنتي (1729-1811)، المولود سنة 1729 قرب أروان شمال تمبكتو، من قبيلة كنتة التي تدّعي النسب إلى عقبة بن نافع الفهري؛ تروي تقسيم كنتة إلى فرعين غربي وشرقي وسياق نشأته القبلي والعلمي في جنوب الصحراء."
  en: "Encyclopaedia entry on al-Shaykh Sidi-Mukhtar al-Kabir al-Kunti (1729–1811), born in 1729 near Arawan north of Timbuktu, of the widely dispersed Kunta tribe which claims descent from Uqba b. Nafi al-Fihri; it recounts the Kunta's division into western and eastern branches and the tribal and scholarly setting of his upbringing in the southern Sahara."
  es: "Entrada de enciclopedia sobre al-Shaykh Sidi-Mukhtar al-Kabir al-Kunti (1729-1811), nacido en 1729 cerca de Arawan, al norte de Tombuctú, perteneciente a la tribu Kunta, muy dispersa, que afirma descender de Uqba b. Nafi al-Fihri; en ella se relata la división de los Kunta en ramas occidentales y orientales, así como el entorno tribal y académico de su crianza en el sur del Sáhara."
  fr: "Article encyclopédique sur al-Shaykh Sidi-Mukhtar al-Kabir al-Kunti (1729–1811), né en 1729 près d'Arawan au nord de Tombouctou, de la tribu Kunta largement dispersée qui revendique une descendance d'Uqba b. Nafi al-Fihri; il relate la division des Kunta en branches occidentales et orientales et le contexte tribal et savant de son éducation dans le sud du Sahara."
  ur: "الشیخ سیدی مختار الکبیر الکنتی (1729–1811) پر انسائیکلوپیڈیا کا اندراج، جو کہ 1729 میں ٹمبکٹو کے شمال میں اراوان کے قریب پیدا ہوئے، بڑے پیمانے پر منتشر کنٹا قبیلے سے تعلق رکھتے ہیں جو عقبہ ب کی نسل کا دعویٰ کرتا ہے۔ نافع الفہری; اس میں کنٹا کی مغربی اور مشرقی شاخوں میں تقسیم اور جنوبی صحارا میں اس کی پرورش کی قبائلی اور علمی ترتیب کا ذکر ہے۔"
  tr: "1729'da Timbuktu'nun kuzeyinde, Arwan yakınlarında doğan ve Uqba bin Nafi Al-Fihri'ye ait olduğunu iddia eden Kenta kabilesinden Şeyh Sidi Mukhtar Al-Kabir Al-Kunti (1729-1811) hakkında ansiklopedik bir materyal; Kenta'nın batı ve doğu olmak üzere iki kola bölünmesini ve güney Sahra'daki kabile ve bilimsel yetiştirilme sürecinin bağlamını anlatır."
  id: "Sebuah materi ensiklopedis tentang Sheikh Sidi Mukhtar Al-Kabir Al-Kunti (1729-1811), lahir pada tahun 1729 dekat Arwan, utara Timbuktu, dari suku Kenta yang mengklaim garis keturunan Uqba bin Nafi Al-Fihri; buku ini menceritakan pembagian Kenta menjadi dua cabang, barat dan timur, serta konteks latar belakang suku dan akademisnya di Sahara selatan."
