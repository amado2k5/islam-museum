summary:
  ar: "مادة موسوعية عن الشيخ سيدي مختار الكبير الكنتي (1729-1811)، المولود سنة 1729 قرب أروان شمال تمبكتو، من قبيلة كنتة التي تدّعي النسب إلى عقبة بن نافع الفهري؛ تروي تقسيم كنتة إلى فرعين غربي وشرقي وسياق نشأته القبلي والعلمي في جنوب الصحراء."
  en: "Encyclopaedia entry on al-Shaykh Sidi-Mukhtar al-Kabir al-Kunti (1729–1811), born in 1729 near Arawan north of Timbuktu, of the widely dispersed Kunta tribe which claims descent from Uqba b. Nafi al-Fihri; it recounts the Kunta's division into western and eastern branches and the tribal and scholarly setting of his upbringing in the southern Sahara."
