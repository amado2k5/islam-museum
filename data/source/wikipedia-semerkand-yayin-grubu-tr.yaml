summary:
  ar: "مقالة ويكيبيديا التركية عن مجموعة سمرقند للنشر، وهي شركة إعلامية من النوع الصوفي مقرّها تركيا؛ تذكر أن أسسها وُضعت سنة 1999 مع مجلة سمرقند، وأن قناة سمرقند تي في بدأت البث سنة 2010؛ تُستخدم لوقائع الكيان فقط."
  en: "Turkish Wikipedia article on the Semerkand Yayın Grubu (Semerkand Media Group), a media company of Sufi type headquartered in Türkiye; it states that its foundations were laid in 1999 with the Semerkand magazine and that its television channel Semerkand TV began broadcasting in 2010; used for entity facts only."
  es: "Artículo de la Wikipedia en turco sobre Semerkand Yayın Grubu (Grupo de Medios Semerkand), una empresa de medios de comunicación de tipo sufí con sede en Turquía; afirma que sus cimientos se sentaron en 1999 con la revista Semerkand y que su canal de televisión Semerkand TV comenzó a emitir en 2010; se utiliza únicamente para datos sobre la entidad."
  fr: "Article de Wikipédia en turc sur le Semerkand Yayın Grubu (Groupe de médias Semerkand), une entreprise de médias de type soufi basée en Turquie; il indique que ses fondations ont été posées en 1999 avec le magazine Semerkand et que sa chaîne de télévision Semerkand TV a commencé à émettre en 2010; utilisé uniquement pour des informations sur l’entité."
  ur: "Semerkand Yayın Grubu (Semerkand Media Group) پر ترک ویکیپیڈیا مضمون، صوفی قسم کی ایک میڈیا کمپنی جس کا صدر دفتر ترکی میں ہے۔ اس میں کہا گیا ہے کہ اس کی بنیادیں 1999 میں سمرکند میگزین کے ساتھ رکھی گئی تھیں اور اس کے ٹیلی ویژن چینل سیمرکند ٹی وی نے 2010 میں نشریات شروع کی تھیں۔ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔"
  tr: "Türkiye merkezli Sufi tipi bir medya şirketi olan Semerkand Yayıncılık Grubu hakkında Türk Vikipedi makalesi, kuruluşunun 1999'da Semerkant dergisiyle başladığını ve Semerkand TV kanalının 2010'da yayına başladığını belirtiyor; kanalın yalnızca kuruluşun etkinlikleri için kullanıldığını belirtiyor."
  id: "Artikel Wikipedia Turki tentang Samarkand Publishing Group, sebuah perusahaan media tipe Sufi yang berbasis di Turki, menyebutkan bahwa pendiriannya dimulai pada tahun 1999 bersama majalah Samarkand, dan bahwa saluran TV Samarkand mulai menyiarkan pada tahun 2010; saluran ini digunakan hanya untuk acara entitas tersebut."
