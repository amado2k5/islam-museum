summary:
  ar: "مقالة ويكيبيديا الكازاخية عن سادير بالوان ⁦(سادير البطل، ابن خوش أحمد)⁩؛ تُستخدم لوقائع الكيان فقط. تجعله بطلًا شعبيًا وشاعرًا أويغوريًا قاد أحد فصائل انتفاضة غولجا الفلاحية (1864–1867)، مولودًا سنة 1798 ومتوفى سنة 1871."
  en: "Kazakh Wikipedia article on Sadir Baluan Khushakhmetuly (Sadir Palwan); used for entity facts only. It presents him as a Uyghur folk hero and zhyrau (bard-poet) who was one of the leaders of the Ghulja peasant uprising of 1864–1867, born in 1798 and died in 1871, citing a Kazakh encyclopedia of sportsmen."
  es: "Artículo de la Wikipedia en kazajo sobre Sadir Baluan Khushakhmetuly (Sadir Palwan); utilizado únicamente para datos sobre la persona. Lo presenta como un héroe popular uigur y zhyrau (bardo-poeta) que fue uno de los líderes del levantamiento campesino de Ghulja de 1864-1867, nacido en 1798 y fallecido en 1871, citando una enciclopedia kazaja de deportistas."
  fr: "Article de Wikipédia en kazakh sur Sadir Baluan Khushakhmetuly (Sadir Palwan); utilisé uniquement à des fins d’information sur l’entité. Il le présente comme un héros populaire ouïghour et un zhyrau (barde-poète) qui fut l’un des chefs du soulèvement paysan de Ghulja de 1864-1867, né en 1798 et mort en 1871, d’après une encyclopédie kazakhe des sportifs."
  ur: "قازق ویکیپیڈیا کا مضمون سدیر بلوان خوشاخمیتولی ⁦(صدیر پالوان)⁩ پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اسے ایغور لوک ہیرو اور زائراؤ ⁦(بارڈ شاعر)⁩ کے طور پر پیش کیا گیا ہے جو 1864-1867 کی غلجا کسان بغاوت کے رہنماؤں میں سے ایک تھا، جو 1798 میں پیدا ہوا اور 1871 میں انتقال کر گیا، قازق انسائیکلوپیڈیا آف کھلاڑیوں کے حوالے سے۔"
  tr: "Sadir Balwan (Kahraman Sadir, Khush Ahmed'in oğlu) hakkında Kazakça Vikipedi makalesi; sadece varlığın gerçekleri için kullanılmıştır. Bu, onu, 1798 doğumlu ve 1871'de ölen Golja köylü ayaklanmasının (1864–1867) bir fraksiyonuna liderlik eden popüler bir kahraman ve Uygur şair yapar."
  id: "Artikel Wikipedia Kazakh tentang Sadir Balwan (Sadir Sang Pahlawan, putra Khush Ahmed); digunakan hanya untuk fakta entitas tersebut. Ini menjadikannya pahlawan populer dan penyair Uyghur yang memimpin salah satu faksi pemberontakan petani Golja (1864–1867), lahir pada 1798 dan meninggal pada 1871."
