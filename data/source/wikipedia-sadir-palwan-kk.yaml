  en: "Kazakh Wikipedia article on Sadir Baluan Khushakhmetuly (Sadir Palwan); used for entity facts only. It presents him as a Uyghur folk hero and zhyrau (bard-poet) who was one of the leaders of the Ghulja peasant uprising of 1864–1867, born in 1798 and died in 1871, citing a Kazakh encyclopedia of sportsmen."
