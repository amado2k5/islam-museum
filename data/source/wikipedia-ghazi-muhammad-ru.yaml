  ar: "مقالة ويكيبيديا الروسية عن غازي محمد؛ تُستخدم لوقائع الكيان فقط. يسجل متنها دخوله الطريقة النقشبندية على يد جمال الدين وإذنه بأن يُعدّ شيخًا، ويعدّ الفقه الشافعي بين مواد دراسته، ويعطي مولده سنة 1795 ووفاته في غيمري سنة 1832."
  en: "Russian Wikipedia article on Ghazi Muhammad; used for entity facts only. Its text records his entering the Naqshbandi tariqa under Jamal al-Din, who gave him permission to be counted a sheikh, lists Shafi'i law among the subjects of his education, and gives his birth in 1795 and his death at Gimry in 1832."
