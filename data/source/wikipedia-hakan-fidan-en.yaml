summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن هاكان فيدان ⁦(وُلد في 17 تموز 1968 في حمامونو بأنقرة)⁩، وزير خارجية تركيا منذ حزيران 2023 ورئيس الاستخبارات الوطنية قبلها (2010–2023)؛ تذكر خدمته ضابط صف (1986–2001) ورئاسته وكالة تيكا ودراساته في ماريلاند وبيلكنت."
  en: "English Wikipedia article on Hakan Fidan (born 17 July 1968 in Hamamönü, Ankara), Turkey's foreign minister since June 2023 and previously director of the National Intelligence Organization (2010-2023); it records his non-commissioned service (1986-2001), his TİKA directorship and his studies at Maryland and Bilkent."
  es: "Artículo de la Wikipedia en inglés sobre Hakan Fidan (nacido el 17 de julio de 1968 en Hamamönü, Ankara), ministro de Asuntos Exteriores de Turquía desde junio de 2023 y anteriormente director de la Organización Nacional de Inteligencia (2010-2023); en él se recoge su servicio como suboficial (1986-2001), su cargo como director de TİKA y sus estudios en Maryland y Bilkent."
  fr: "Article de Wikipédia en anglais sur Hakan Fidan (né le 17 juillet 1968 à Hamamönü, Ankara), ministre des Affaires étrangères de la Turquie depuis juin 2023 et ancien directeur de l'Organisation nationale du renseignement (2010-2023); il retrace son service en tant que sous-officier (1986-2001), sa direction de la TİKA et ses études à Maryland et Bilkent."
  ur: "ہاکان فیدان ⁦(17 جولائی 1968 کو ہمامونی، انقرہ میں پیدا ہوئے)⁩ پر انگریزی ویکیپیڈیا کا مضمون، جون 2023 سے ترکی کے وزیر خارجہ اور اس سے قبل نیشنل انٹیلی جنس آرگنائزیشن (2010-2023) کے ڈائریکٹر؛ اس میں ان کی نان کمیشنڈ سروس (1986-2001)، اس کی TİKA ڈائریکٹر شپ اور میری لینڈ اور بلکینٹ میں ان کی تعلیم کو ریکارڈ کیا گیا ہے۔"
  tr: "Hakan Fidan (17 Temmuz 1968, Hamammonu, Ankara doğumlu), Haziran 2023'ten beri Türkiye Dışişleri Bakanı ve eski Milli İstihbarat Başkanı (2010–2023) hakkında İngilizce Wikipedia makalesi; astsubay olarak (1986–2001), TIKA ajansının başkanı ve Maryland ile Belkent'teki eğitimlerinden bahsedilmektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Hakan Fidan (lahir 17 Juli 1968, di Hamammonu, Ankara), Menteri Luar Negeri Turki sejak Juni 2023 dan mantan Kepala Intelijen Nasional (2010–2023); artikel tersebut menyebutkan masa jabatannya sebagai bintara (1986–2001), kepala badan TIKA, dan studinya di Maryland dan Belkent."
