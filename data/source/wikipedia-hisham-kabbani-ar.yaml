summary:
  ar: "مقالة ويكيبيديا العربية عن محمد هشام قباني، تصفه في صدرها بأنه عالم وشيخ صوفي من لبنان، وتذكر تخرّجه في الكيمياء من الجامعة الأميركية في بيروت وشهادته في الفقه من دمشق وزواجه من ابنة الشيخ محمد ناظم الحقاني وحمله إجازة منه بتدريس الطريقة النقشبندية وتأسيسه المجلس الإسلامي الأعلى في أمريكا."
  en: "The Arabic Wikipedia article on Muhammad Hisham Kabbani, whose lead calls him a scholar and Sufi shaykh from Lebanon; it records his chemistry degree from the American University of Beirut, his fiqh certificate from Damascus, his marriage to Shaykh Nazim al-Haqqani’s daughter, the ijaza he holds from Nazim to teach the Naqshbandi order, and his founding of the Islamic Supreme Council of America."
  es: "El artículo de la Wikipedia en árabe sobre Muhammad Hisham Kabbani, cuyo titular lo describe como un erudito y jeque sufí del Líbano, recoge su licenciatura en química por la Universidad Americana de Beirut, su certificado de fiqh de Damasco, su matrimonio con la hija del jeque Nazim al-Haqqani, la ijaza que posee de Nazim para enseñar la orden Naqshbandi y la fundación del Consejo Supremo Islámico de América."
  fr: "L'article de Wikipédia en arabe sur Muhammad Hisham Kabbani, dont l'introduction le décrit comme un érudit et un cheikh soufi du Liban, mentionne son diplôme de chimie de l'Université américaine de Beyrouth, son certificat de fiqh de Damas, son mariage avec la fille du cheikh Nazim al-Haqqani, l'ijaza qu'il détient de Nazim pour enseigner l'ordre Naqshbandi et la fondation du Conseil suprême islamique d'Amérique."
  ur: "محمد ہشام کبانی پر عربی ویکیپیڈیا کا مضمون، جس کی قیادت انہیں لبنان سے ایک عالم اور صوفی شیخ کہتی ہے۔ اس میں بیروت کی امریکن یونیورسٹی سے ان کی کیمسٹری کی ڈگری، دمشق سے ان کی فقہ کی سند، شیخ ناظم الحقانی کی بیٹی سے ان کی شادی، نقشبندی کی تعلیم دینے کے لیے ناظم سے حاصل کردہ اعجاز، اور اسلامک سپریم کونسل آف امریکہ کی ان کی بانی کا ریکارڈ ہے۔"
  tr: "Muhammed Hişam Kabbani hakkında Arapça Vikipedi makalesi, onu başta bir âlim ve Lübnanlı Sufi şeyhi olarak tanımlar, Amerikan Beyrut Üniversitesi'nden kimya mezuniyeti, Şam'dan fıkıh diploması, Şeyh Muhammed Nazim el-Haqqani'nin kızıyla evliliği, Nakşbendi tarikatını öğretme lisansı ve Amerika'daki Yüksek İslam Konseyi'ni kurduğu belirtilir."
  id: "Artikel Wikipedia berbahasa Arab tentang Muhammad Hisham Qabbani menggambarkannya pada awalnya sebagai seorang ulama dan sheikh Sufi dari Lebanon, menyebutkan kelulusannya di bidang kimia dari American University of Beirut, gelar yurisprudensi dari Damaskus, pernikahannya dengan putri Sheikh Muhammad Nazim al-Haqqani, kepemilikan izin mengajar tarekat Naqshbandi, dan pendiriannya atas Dewan Islam Tertinggi di Amerika."
