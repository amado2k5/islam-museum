summary:
  ar: "مقالة ويكيبيديا العربية عن محمد هشام قباني، تصفه في صدرها بأنه عالم وشيخ صوفي من لبنان، وتذكر تخرّجه في الكيمياء من الجامعة الأميركية في بيروت وشهادته في الفقه من دمشق وزواجه من ابنة الشيخ محمد ناظم الحقاني وحمله إجازة منه بتدريس الطريقة النقشبندية وتأسيسه المجلس الإسلامي الأعلى في أمريكا."
  en: "The Arabic Wikipedia article on Muhammad Hisham Kabbani, whose lead calls him a scholar and Sufi shaykh from Lebanon; it records his chemistry degree from the American University of Beirut, his fiqh certificate from Damascus, his marriage to Shaykh Nazim al-Haqqani’s daughter, the ijaza he holds from Nazim to teach the Naqshbandi order, and his founding of the Islamic Supreme Council of America."
