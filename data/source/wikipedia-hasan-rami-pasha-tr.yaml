reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and re-fetched by the recorded revision id with content verified identical. The article is flagged unsourced on its own page and has no infobox. It gives him as fleet commander 1897–1908 and Minister of the Navy 1903–1908 — dates that differ from the English article's 1906 appointment — records his disagreement with his predecessor Bozcaadalı Hasan Hüsnü Pasha, his celebrated report to Abdul Hamid II after the disastrous 1897 fleet movement, the purchase of destroyers and torpedo boats in his ministry, his exile after the Second Constitutional Era as the man held responsible for the fleet's condition, his memoirs blaming Hasan Hüsnü Pasha's policies, and the soldiers' nickname for him, Harami Pasha, arising from corruption rumours. It makes no statement of his religion."
