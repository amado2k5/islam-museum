  ar: "مقالة ويكيبيديا الإنجليزية عن جيتا غوبيناث؛ تُستخدم لوقائع الكيان فقط. تذكر مولدها في 8 ديسمبر 1971 بكلكتا في «أسرة ماليالية من كانور، كيرلا» ونشأتها في ميسور وتعليمها ومنصبَيها في صندوق النقد الدولي (كبيرة الاقتصاديين ثم النائب الأول للمدير العام) وعودتها إلى هارفارد، ولا تنسب إليها دينا بنفسها."
  en: "English Wikipedia article on Gita Gopinath; used for entity facts only. It gives her birth as 8 December 1971 at Kolkata, 'in a Malayali family from Kannur, Kerala', her upbringing at Mysore, her education, her two IMF posts (chief economist, then first deputy managing director) and her return to Harvard. It names no religion for her personally."
