reliability_note: "Read in full (text and wikitext) on 1 November 2026. The article rests on the current state of the art: Sean W. Anthony's biographical sketch in the Brill edition The Works of Ibn Wadih al-Ya'qubi (2018), Anthony's 2016 journal study 'Was Ibn Wadih al-Ya'qubi a Shi'ite Historian?', Elton L. Daniel's 2004 reconsideration, and Muhammad Qasim Zaman's Encyclopaedia of Islam entry. It gives no birth date: specific dates for his early life are unrecorded and modern historians estimate his birth between 230 and 240 AH (844-854 CE), so the museum queue's 812 is attested nowhere in it. Its lead and infobox still carry the traditional death date of 284 AH (897-898), but its Death section shows, after Anthony, that this date is an erroneous conflation with the contemporary hadith scholar Ahmad ibn Ishaq al-Assal (d. Safar 284 AH): al-Ya'qubi's own verses prove he survived the fall of the Tulunids in 292 AH (905) and the death of al-Muktafi in 295 AH (908), and he is believed to have died in Egypt shortly after 908. Its sectarian-identity section preserves every scholarly reading, from de Goeje's 'full-blooded Shi'ite' and the Waqifa hypothesis to Daniel's Hashimi-loyalist rebuttal and Anthony's Rafidi finding; no single branch commands the field."
