reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. A short article: it gives his birth on 4 October 1853 at Tando Thoro on the Phuleli Canal, Hyderabad, his father Fredunbeg's story (a Georgian of Tbilisi, enslaved in the Qajar conflicts and gifted to the Talpur emirs of Sindh), his 457 books in 43 disciplines in eight languages (he knew 25), and a partial works list (Maqalat-ul-Hikmat, Alamat-ul-Quran, Zeenat, his autobiography Sao Pan Karo Pano). The career and honours detail comes from the Urdu and Sindhi articles. It gives no death date in the extract read and names no religion or school for him. Read in full on 24 October 2026."
