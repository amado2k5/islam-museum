summary:
  ar: "شذرات الذهب في أخبار من ذهب لشهاب الدين أبي الفلاح عبد الحي أحمد بن محمد العكري الحنبلي الدمشقي المعروف بابن العماد ⁦(ت 1089هـ)⁩؛ ممسوحات مكتبة الحصاد المحلية أجريت عليها قراءة آلية بآبل فيجن وتشمل الجزء الثالث ⁦(350–500هـ)⁩ والجزأين السابع والثامن ⁦(نحو 800–1000هـ)⁩."
  en: "Ibn al-Imad's annals of Islamic history to 1000 AH; local library scans OCR'd with Apple Vision covering vol. 3 (350–500) and vols. 7–8 (c. 800–1000)."
  es: "Anales de historia islámica de Ibn al-Imad hasta el año 1000 AH; escaneos de la biblioteca local procesados mediante OCR con Apple Vision que abarcan el volumen 3 (350–500) y los volúmenes 7–8 (aprox. 800–1000)."
  fr: "Annales d'Ibn al-Imad sur l'histoire islamique jusqu'en 1000 AH; numérisations de la bibliothèque locale OCR avec Apple Vision couvrant le vol. 3 (350-500) et les vol. 7-8 (c. 800-1000)."
  ur: "ابن عماد کی تاریخ اسلامی کی تاریخ 1000 ہجری تک؛ مقامی لائبریری ایپل ویژن کورنگ والیوم کے ساتھ OCR'd کو اسکین کرتی ہے۔ 3 (350-500) اور جلد۔ 7–8 (c. 800–1000)۔"
  tr: "Shadharat al-Dhahab fi Akhbar Man Dhahab (Şihab el-Din Ebu el-Felah Abd al-Hayy Ahmed ibn Muhammed el-Ukri el-Hanbali el-Dimashqi, İbn al-Imad olarak bilinir (ö. 1089 H) tarafından yazılmıştır; yerel kütüphane el-Hassad incelemeleri Apple Vision ile mekanik olarak okunmuş ve üçüncü bölüm (350–500 H) ile yedinci ve sekizinci ciltleri (yaklaşık 800–1000 Ah) içermektedir."
  id: "Shadharat al-Dhahab fi Akhbar Man Dhahab oleh Shihab al-Din Abu al-Falah Abd al-Hayy Ahmad ibn Muhammad al-Ukri al-Hanbali al-Dimashqi, dikenal sebagai Ibn al-Imad (wafat 1089 H); survei perpustakaan lokal al-Hassad dibaca secara mekanis menggunakan Apple Vision dan mencakup bagian ketiga (350–500 H) serta volume ketujuh dan kedelapan (sekitar 800–1000 H)."
