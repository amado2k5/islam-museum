reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). A short article: it pairs his birth and death as 1163/1749 and 1233/1817, names him Abd al-Wahhab ibn Wali Allah ibn Abd al-Rahim al-Umari al-Dihlawi, records that he studied under his brother Abdul Aziz and that he took the Sufi path from Shaykh Muhammad Ashiq ibn Ubayd Allah al-Bahattli, and lists Damgh al-Batil and Asrar al-Mahabba among his works. Its statement of his personal Sufi initiation is the record's primary attestation for his Sufi affiliation; it names no legal school for him. Its own Wikidata item (Q12213581) is separate from the Urdu article's and is cited separately. Checked 1 November 2026."
