summary:
  ar: "مقالة ويكيبيديا الفرنسية عن أحمد رايسوني؛ مقالة قصيرة موسومة بأنها بحاجة إلى مصادر. تثبت ميلاده سنة 1953 في القصر الكبير قرب العرائش، وانضمامه شابًا إلى جمعية التبليغ والدعوة، وتأسيسه الجمعية الإسلامية بالقصر الكبير سنة 1976، وشهاداته من القرويين (1978) وجامعة محمد الخامس (دكتوراه 1992)، وقيادته لحركة التوحيد والإصلاح حتى ربيع 2003."
  en: "French Wikipedia article on Ahmed Raissouni; a short article flagged as needing sources. It gives his birth in 1953 at Ksar el-Kebir near Larache, his youthful membership of a Tabligh association, his founding of the Islamic Association of Ksar el-Kebir in 1976, his degrees from al-Qarawiyyin (1978) and Mohammed V University (doctorate 1992), and his leadership of the Movement of Unity and Reform until spring 2003."
