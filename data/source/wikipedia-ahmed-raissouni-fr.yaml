reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md). Read in full on 26 October 2026; the article was fetched by revision id through the MediaWiki API and the returned revid asserted equal to 235539797 before any claim was drawn. It is a stub flagged 'à sourcer' (needing sources) since December 2018, so its statements carry less weight than the English and Arabic articles. Its text describes him as a theologian who interprets the texts liberally 'while remaining faithful to Sunni orthodoxy' — the only text attestation of a Sunni affiliation for him in any article read, and it names no school. It also records his voluntary exile in Saudi Arabia and later professorship at the University of Qatar, which the English article frames as a move to Doha."
