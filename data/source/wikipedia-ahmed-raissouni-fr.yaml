summary:
  ar: "مقالة ويكيبيديا الفرنسية عن أحمد رايسوني؛ مقالة قصيرة موسومة بأنها بحاجة إلى مصادر. تثبت ميلاده سنة 1953 في القصر الكبير قرب العرائش، وانضمامه شابًا إلى جمعية التبليغ والدعوة، وتأسيسه الجمعية الإسلامية بالقصر الكبير سنة 1976، وشهاداته من القرويين (1978) وجامعة محمد الخامس ⁦(دكتوراه 1992)⁩، وقيادته لحركة التوحيد والإصلاح حتى ربيع 2003."
  en: "French Wikipedia article on Ahmed Raissouni; a short article flagged as needing sources. It gives his birth in 1953 at Ksar el-Kebir near Larache, his youthful membership of a Tabligh association, his founding of the Islamic Association of Ksar el-Kebir in 1976, his degrees from al-Qarawiyyin (1978) and Mohammed V University (doctorate 1992), and his leadership of the Movement of Unity and Reform until spring 2003."
  es: "Artículo de la Wikipedia en francés sobre Ahmed Raissouni; un artículo breve que necesita fuentes. En él se menciona su nacimiento en 1953 en Ksar el-Kebir, cerca de Larache, su pertenencia en su juventud a una asociación Tabligh, la fundación de la Asociación Islámica de Ksar el-Kebir en 1976, sus títulos de al-Qarawiyyin (1978) y de la Universidad Mohammed V (doctorado en 1992), y su liderazgo del Movimiento de Unidad y Reforma hasta la primavera de 2003."
  fr: "Article de Wikipédia en français sur Ahmed Raissouni; un article court signalé comme nécessitant des sources. Il mentionne sa naissance en 1953 à Ksar el-Kebir près de Larache, son appartenance, dans sa jeunesse, à une association Tabligh, la fondation de l’Association islamique de Ksar el-Kebir en 1976, ses diplômes d’al-Qarawiyyin (1978) et de l’Université Mohammed V (doctorat en 1992), ainsi que son rôle à la tête du Mouvement d’unité et de réforme jusqu’au printemps 2003."
  ur: "احمد رئیسونی پر فرانسیسی ویکیپیڈیا مضمون؛ ایک مختصر مضمون کو ذرائع کی ضرورت کے طور پر نشان زد کیا گیا ہے۔ یہ 1953 میں لاراچے کے قریب کسر الکبیر میں ان کی پیدائش، تبلیغی انجمن کی نوجوانی کی رکنیت، 1976 میں اس کی اسلامک ایسوسی ایشن آف کسار الکبیر کی بنیاد، القرویین (1978) اور محمد وی یونیورسٹی ⁦(ڈاکٹریٹ 1992)⁩ سے اس کی ڈگریاں، اور اس کی قیادت کی قیادت اور 2019 تک اتحاد اور 2012 تک اتحاد۔"
