summary:
  ar: مقالة ويكيبيديا الأذربيجانية عن ميرزا علي أكبر صابر؛ تُستخدم لوقائع الكيان فقط. مقالة طويلة تعطي اسم مولده ألكبر زين العابدين أوغلو طاهرزاده ومولده في شماخي في 30 مايو 1862 ودراسته وأسفاره وسنوات صناعة الصابون ودوره المركزي في «ملا نصر الدين» ووفاته في شماخي مسقط رأسه سنة 1911.
  en: Azerbaijani Wikipedia article on Mirza Alakbar Sabir; used for entity facts only. A long article giving his birth name as Alakbar Zeynalabdin oglu Tahirzadeh, his birth at Shamakhi on 30 May 1862, his schooling, travels, soap-making years, his central role in Molla Nasreddin, and his death in his native Shamakhi in 1911.
  es: "Artículo de la Wikipedia en azerbaiyano sobre Mirza Alakbar Sabir; utilizado únicamente para datos sobre la persona. Un extenso artículo que menciona su nombre de nacimiento como Alakbar Zeynalabdin oglu Tahirzadeh, su nacimiento en Shamakhi el 30 de mayo de 1862, su educación, viajes, años dedicados a la fabricación de jabón, su papel central en Molla Nasreddin y su muerte en su ciudad natal de Shamakhi en 1911."
  fr: "Article Wikipédia azerbaïdjanais sur Mirza Alakbar Sabir; utilisé uniquement à des fins d'information sur l'entité. Cet article détaillé mentionne son nom de naissance, Alakbar Zeynalabdin oglu Tahirzadeh, sa naissance à Shamakhi le 30 mai 1862, sa scolarité, ses voyages, ses années de fabrication de savon, son rôle central dans Molla Nasreddin et sa mort dans sa ville natale de Shamakhi en 1911."
  ur: "مرزا الکبر صابر پر آذربائیجانی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ ایک طویل مضمون جس میں ان کی پیدائش کا نام الکبر زینالابدین اوگلو طاہر زادہ، 30 مئی 1862 کو شماکھی میں ان کی پیدائش، ان کی اسکولی تعلیم، سفر، صابن بنانے کے سال، مولا نصرالدین میں ان کا مرکزی کردار، اور ان کی وفات 1911 میں ان کے آبائی علاقے شماکھی میں ہے۔"
