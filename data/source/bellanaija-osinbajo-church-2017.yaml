reliability_note: "Read in full on 26 October 2026. The report quotes Osinbajo at a Lagos conference tagged 'Towards a Better Nigeria': 'Nigeria became a member of the Islamic Development Bank in 2005 and the first person to sit as director of the bank was Ngozi Okonjo-Iweala. The second person to sit as a director is the current Finance Minister, Kemi Adeosun, and both of them are Christians... The person who brought us into the bank is not a Fulani or Northerner, the person was a Christian.' This is one attestation of her own affiliation — a named public official's public statement about her, reported secondhand through Punch and BellaNaija. It is not her own statement, and on its own it does not meet the lane's two-source bar."
