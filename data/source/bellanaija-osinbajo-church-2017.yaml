  ar: "تقرير بيلا نايجا ⁦(أكتوبر 2017)⁩ عن كلمة نائب الرئيس ييمي أوسينباجو في مؤتمر بلاغوس، نقلا عن صحيفة بانش، وفيه يسمّي نجوزي أوكونجو إيويالا بنفسها مسيحية بوصفها أول من جلس مديرا في البنك الإسلامي للتنمية عن نيجيريا."
  en: "BellaNaija's October 2017 report, following Punch, of Vice President Yemi Osinbajo's address to a Lagos conference of pastors, in which he names Ngozi Okonjo-Iweala personally as a Christian — the first person to sit as a director of the Islamic Development Bank for Nigeria."
  es: "El informe de BellaNaija de octubre de 2017, publicado después de Punch, recoge el discurso del vicepresidente Yemi Osinbajo en una conferencia de pastores en Lagos, en el que nombra personalmente a Ngozi Okonjo-Iweala como cristiana, la primera persona en ocupar un puesto de directora en el Banco Islámico de Desarrollo de Nigeria."
  fr: "Le rapport de BellaNaija d'octobre 2017, faisant suite à celui de Punch, relate le discours du vice-président Yemi Osinbajo lors d'une conférence de pasteurs à Lagos, dans lequel il cite personnellement Ngozi Okonjo-Iweala comme chrétienne — la première personne à siéger comme directrice de la Banque islamique de développement pour le Nigeria."
