summary:
  ar: "عنصر ويكي بيانات Q381150 لنوري السعيد، ثُبّت عبر خصائص صفحة المقالة الإنجليزية؛ يُستخدم لوقائع الكيان فقط. يعطي ولادته في 1 ديسمبر 1888 ووفاته في 15 يوليو 1958 وبغداد مكانًا للولادة والوفاة، ويحمل قيمتَي دين: الإسلام عمومًا والإسلام السني، وكلتاهما من هذا العنصر وحده."
  en: "Wikidata item Q381150 for Nuri al-Said, grounded through the English article's pageprops; used for entity facts only. It gives his birth on 1 December 1888, his death on 15 July 1958, Baghdad as birth and death place, and two religion values — Islam in general and Sunni Islam — both carried by this item alone."
  es: "El elemento de Wikidata Q381150 para Nuri al-Said, basado en los atributos de página del artículo en inglés, se utiliza únicamente para datos de la entidad. Indica su nacimiento el 1 de diciembre de 1888, su muerte el 15 de julio de 1958, Bagdad como lugar de nacimiento y muerte, y dos valores religiosos —el islam en general y el islam sunita— ambos contenidos exclusivamente en este elemento."
  fr: "L'élément Wikidata Q381150 concernant Nuri al-Said, basé sur les propriétés de la page de l'article en anglais, est utilisé uniquement pour les informations relatives à l'entité. Il indique sa naissance le 1er décembre 1888, son décès le 15 juillet 1958, Bagdad comme lieu de naissance et de décès, ainsi que deux valeurs religieuses: l'islam en général et l'islam sunnite, deux informations présentes uniquement dans cet élément."
  ur: "ویکی ڈیٹا آئٹم Q381150 برائے نوری السید، جو انگریزی مضمون کے صفحہ کے پراپس پر مبنی ہے۔ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1 دسمبر 1888 کو ان کی پیدائش، 15 جولائی 1958 کو ان کی موت، بغداد کی پیدائش اور موت کی جگہ، اور دو مذاہب کی اقدار - عمومی طور پر اسلام اور سنی اسلام - دونوں کو صرف اس شے کے ذریعے اٹھایا گیا ہے۔"
  tr: "Nuri Al-Said tarafından İngilizce makale sayfasının özellikleri aracılığıyla düzeltilmiş bir Wikidata öğesi Q381150; yalnızca varlığın gerçekleri için kullanılmıştır. Doğumunu 1 Aralık 1888'de, ölümünü 15 Temmuz 1958'de ve Bağdat'ı doğum ve ölüm yeri olarak belirtir ve dinin değerlerini taşır: genel olarak İslam ve Sünni İslam, ki bunlar yalnızca bu unsura aittir."
  id: "Elemen Wikidata Q381150 oleh Nuri Al-Said, ditetapkan melalui properti halaman artikel berbahasa Inggris; digunakan hanya untuk fakta entitas. Artikel ini mencantumkan kelahirannya pada 1 Desember 1888, dan kematiannya pada 15 Juli 1958, serta Baghdad sebagai tempat kelahiran dan kematian, serta membawa nilai-nilai agama: Islam secara umum dan Islam Sunni, keduanya hanya termasuk dalam elemen ini."
