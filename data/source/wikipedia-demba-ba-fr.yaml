summary:
  ar: "مقالة ويكيبيديا الفرنسية عن دمبا با؛ تُستخدم لوقائع الكيان فقط. تغطي ميلاده سنة 1985 ومسيرته مع الأندية والمنتخب السنغالي، وتصفه متحدثًا «بصفته مسلمًا» في خلاف راعي نيوكاسل، وتنقل قوله بعد هجمات يناير 2015 «أنا مسلم»."
  en: "French Wikipedia article on Demba Ba; used for entity facts only. It covers his 1985 birth, his club career and his Senegal career, describes him speaking as a Muslim in the Newcastle sponsor dispute, and quotes him saying “Je suis musulman” after the January 2015 Paris attacks."
  es: "Artículo de la Wikipedia en francés sobre Demba Ba; utilizado únicamente para obtener información sobre la persona. Abarca su nacimiento en 1985, su trayectoria en clubes y en la selección de Senegal, describe su testimonio como musulmán durante la disputa con el patrocinador del Newcastle y lo cita diciendo «Je suis musulman» (Soy musulmán) tras los atentados de París de enero de 2015."
  fr: "Article de Wikipédia en français sur Demba Ba; utilisé uniquement pour des informations sur l’entité. Il retrace sa naissance en 1985, sa carrière en club et en équipe nationale du Sénégal, décrit ses propos en tant que musulman lors du conflit avec le sponsor de Newcastle et cite ses déclarations « Je suis musulman » après les attentats de Paris de janvier 2015."
  ur: "Demba Ba پر فرانسیسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کی 1985 کی پیدائش، اس کے کلب کیریئر اور اس کے سینیگال کیرئیر کا احاطہ کیا گیا ہے، اسے نیو کیسل اسپانسر تنازعہ میں ایک مسلمان کے طور پر بولنے کا بیان کیا گیا ہے، اور جنوری 2015 کے پیرس حملوں کے بعد اسے \"Je suis musulman\" کہنے کا حوالہ دیا گیا ہے۔"
  tr: "Demba Ba hakkında Fransızca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1985'teki doğumunu ve kulüpler ile Senegal milli takımındaki kariyerini kapsar, Newcastle sponsor anlaşmazlığında \"Müslüman\" olarak tanımlanır ve Ocak 2015 saldırılarından sonra yaptığı \"Ben bir Müslümanım\" ifadesini alıntılar."
  id: "Artikel Wikipedia Prancis tentang Demba Ba; digunakan hanya untuk fakta entitas. Artikel ini membahas kelahirannya pada tahun 1985 dan kariernya bersama klub serta tim nasional Senegal, menggambarkannya sebagai \"Muslim\" dalam sengketa sponsor Newcastle, dan mengutip pernyataannya setelah serangan Januari 2015, \"Saya seorang Muslim.\""
