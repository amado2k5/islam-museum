summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن فيصل عبد القادر الحسيني؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في بغداد سنة 1940 ابنا لعبد القادر الحسيني، وعمله في منظمة التحرير والجيش الفلسطيني، وتأسيسه جمعية الدراسات العربية سنة 1979، وعضويته في المجلس الإسلامي الأعلى بالقدس، ووفاته بأزمة قلبية في الكويت سنة 2001 ودفنه في الخاتونية بالقدس."
  en: "English Wikipedia article on Faisal Abdel Qader al-Husseini; used for entity facts only. It recounts his birth in Baghdad in 1940 as the son of Abd al-Qadir al-Husayni, his work for the PLO and the Palestinian Liberation Army, his founding of the Arab Studies Society in 1979, his membership of the Supreme Muslim Council in Jerusalem, his death from a heart attack in Kuwait in 2001 and his burial in the Khatuniyya in Jerusalem."
  es: "Artículo de la Wikipedia en inglés sobre Faisal Abdel Qader al-Husseini; utilizado únicamente para datos sobre la persona. Relata su nacimiento en Bagdad en 1940 como hijo de Abd al-Qadir al-Husayni, su trabajo para la OLP y el Ejército de Liberación de Palestina, la fundación de la Sociedad de Estudios Árabes en 1979, su pertenencia al Consejo Supremo Musulmán en Jerusalén, su muerte por un ataque al corazón en Kuwait en 2001 y su entierro en la Khatuniyya de Jerusalén."
  fr: "Article de Wikipédia en anglais sur Faisal Abdel Qader al-Husseini; utilisé uniquement à des fins d’information sur l’entité. Il relate sa naissance à Bagdad en 1940, fils d’Abd al-Qadir al-Husayni, son engagement au sein de l’OLP et de l’Armée de libération palestinienne, la fondation de la Société d’études arabes en 1979, son appartenance au Conseil suprême musulman de Jérusalem, son décès d’une crise cardiaque au Koweït en 2001 et son inhumation au cimetière Khatuniyya de Jérusalem."
  ur: "فیصل عبدالقادر الحسینی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1940 میں بغداد میں عبد القادر الحسینی کے بیٹے کے طور پر ان کی پیدائش، پی ایل او اور فلسطینی لبریشن آرمی کے لیے ان کے کام، 1979 میں عرب اسٹڈیز سوسائٹی کی بنیاد، یروشلم میں سپریم مسلم کونسل کی رکنیت، کویت میں دل کا دورہ پڑنے سے ان کی موت اور 2001 میں کویت میں ان کی موت کا ذکر ہے۔ یروشلم۔"
  tr: "Faysal Abdul Kader el-Hüseyini hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1940'ta Bağdat'ta doğduğu makale, Abdul Kader el-Hüseyni'nin oğlu olarak doğduğunu, Filistin Kurtuluş Örgütü ve Filistin ordusundaki çalışmalarını, 1979'da Arap Araştırmaları Derneği'ni kurmasını, Kudüs'teki Yüksek İslami Konsey üyeliğini, 2001'de Kuveyt'te kalp krizi sonucu hayatını kaybetmesini ve Kudüs'teki El-Hatuniye'ye defnedilmesini anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Faisal Abdul Qader al-Husseini; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya di Baghdad pada tahun 1940, putra Abdul Qader al-Husseini, pekerjaannya di Organisasi Pembebasan Palestina dan tentara Palestina, pendirian Asosiasi Studi Arab pada tahun 1979, keanggotaannya di Dewan Islam Tertinggi di Yerusalem, kematiannya akibat serangan jantung di Kuwait pada tahun 2001, dan pemakamannya di Al-Khatouniya di Yerusalem."
