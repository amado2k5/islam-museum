  ar: "مقالة ويكيبيديا الإنجليزية عن فيصل عبد القادر الحسيني؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في بغداد سنة 1940 ابنا لعبد القادر الحسيني، وعمله في منظمة التحرير والجيش الفلسطيني، وتأسيسه جمعية الدراسات العربية سنة 1979، وعضويته في المجلس الإسلامي الأعلى بالقدس، ووفاته بأزمة قلبية في الكويت سنة 2001 ودفنه في الخاتونية بالقدس."
  en: "English Wikipedia article on Faisal Abdel Qader al-Husseini; used for entity facts only. It recounts his birth in Baghdad in 1940 as the son of Abd al-Qadir al-Husayni, his work for the PLO and the Palestinian Liberation Army, his founding of the Arab Studies Society in 1979, his membership of the Supreme Muslim Council in Jerusalem, his death from a heart attack in Kuwait in 2001 and his burial in the Khatuniyya in Jerusalem."
