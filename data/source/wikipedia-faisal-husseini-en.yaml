reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision. It gives Husseini as born in Baghdad on 17 July 1940, son of Abd al-Qadir al-Husayni and grandson of Musa Kazim Pasha al-Husseini, a founding member of the General Union of Palestinian Students (1959), a PLO official in Jerusalem (1964–65), trained at the Damascus Military College and in the Palestinian Liberation Army from 1967, founder-chairman of the Arab Studies Society (1979), repeatedly under house arrest and imprisoned (1982–89), a member of the Supreme Muslim Council in Jerusalem from 1982, spokesman and adviser to the Madrid delegation, head of the Fatah faction in the West Bank and finally PA Minister for Jerusalem Affairs; he died of a heart attack in Kuwait on 31 May 2001 while mediating between Kuwait and the PLO, and was buried in the family tomb in the Khatuniyya, Jerusalem. The article makes no statement of his personal religion anywhere; membership of the Supreme Muslim Council is an office recorded in his career, not an affiliation statement."
