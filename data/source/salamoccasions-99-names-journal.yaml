summary:
  ar: "صفحة منتج دفتر «أسماء الله الحسنى» الموجَّه في متجر سلام أوكيجنز، تحمل سيرة الناشر لجنان يوسف: خريجة قانون من كلية لندن للاقتصاد وجامعة كاليفورنيا في بيركلي بتخصص في القانون الدولي، ومدرّسة دورات لدى دار البروج، واهتماماتها أسماء الله وسيرة النبي والتزكية والشخصيات المسلمة."
  en: "The Salam Occasions product page for the 99 Names of Allah Guided Journal, carrying the publisher's biography of Jinan Yousef: a law graduate of the London School of Economics and UC Berkeley with an emphasis on international law, a course instructor for Al Buruj Press, whose interests are the names of Allah, the life and character of the Prophet, tazkiya and Muslim personalities."
  es: "La página del producto Salam Occasions para el Diario Guiado de los 99 Nombres de Alá, que incluye la biografía del editor Jinan Yousef: licenciado en derecho por la London School of Economics y la UC Berkeley con especialización en derecho internacional, profesor de cursos para Al Buruj Press, cuyos intereses son los nombres de Alá, la vida y el carácter del Profeta, la tazkiya y las personalidades musulmanas."
  fr: "La page produit Salam Occasions pour le journal guidé des 99 noms d'Allah, contenant la biographie de l'éditeur Jinan Yousef: diplômé en droit de la London School of Economics et de l'UC Berkeley avec une spécialisation en droit international, instructeur de cours pour Al Buruj Press, dont les intérêts sont les noms d'Allah, la vie et le caractère du Prophète, la tazkiya et les personnalités musulmanes."
