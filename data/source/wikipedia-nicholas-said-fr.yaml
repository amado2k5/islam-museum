summary:
  ar: "مقالة ويكيبيديا الفرنسية عن نيكولاس سعيد؛ تُستخدم لوقائع الكيان فقط. مقالة مستقلة بمصادرها الخاصة تروي أسره سنة 1851 وحجه إلى مكة وعماده في ريغا في 31 أكتوبر 1855 واتخاذه اسم نيكولاس وصيرورته مسيحيا أرثوذكسيا، وخدمته في الحرب الأهلية الأمريكية."
  en: "French Wikipedia article on Nicholas Said; used for entity facts only. An independently sourced article recounting his capture in 1851, his Mecca pilgrimage, his baptism at Riga on 31 October 1855, when he took the name Nicholas and became an Orthodox Christian, and his American Civil War service."
  es: "Artículo de la Wikipedia en francés sobre Nicholas Said; utilizado únicamente para obtener información sobre la persona. Un artículo de fuente independiente que relata su captura en 1851, su peregrinación a La Meca, su bautismo en Riga el 31 de octubre de 1855, cuando adoptó el nombre de Nicholas y se convirtió al cristianismo ortodoxo, y su servicio en la Guerra Civil estadounidense."
  fr: "Article de Wikipédia en français sur Nicolas Said; utilisé uniquement pour les informations factuelles. Cet article, issu d'une source indépendante, relate sa capture en 1851, son pèlerinage à La Mecque, son baptême à Riga le 31 octobre 1855 (date à laquelle il prit le nom de Nicolas et se convertit à l'orthodoxie) et son engagement durant la guerre de Sécession américaine."
  ur: "نکولس سیڈ پر فرانسیسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ 1851 میں اس کی گرفتاری، اس کی مکہ یاترا، 31 اکتوبر 1855 کو ریگا میں اس کا بپتسمہ، جب اس نے نکولس کا نام لیا اور ایک آرتھوڈوکس عیسائی بن گیا، اور اس کی امریکی خانہ جنگی کی خدمت کا ایک آزادانہ طور پر حاصل کردہ مضمون۔"
  tr: "Nicolas Said hakkında Fransızca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Kendi kaynaklarıyla bağımsız bir makale; 1851'deki ailesini, Mekke'ye yaptığı hacını, 31 Ekim 1855'te Riga'da vaftizini, Nicholas adını benimsemesini, Ortodoks Hristiyanlığa geçişini ve Amerikan İç Savaşı'ndaki hizmetini anlatır."
  id: "Artikel Wikipedia Prancis tentang Nicolas Said; digunakan hanya untuk fakta entitas. Artikel independen dengan sumber sendiri yang menceritakan keluarganya pada tahun 1851, ziarahnya ke Mekah, pembaptisannya di Riga pada 31 Oktober 1855, adopsi nama Nicholas, konversinya ke Kristen Ortodoks, dan pengabdiannya dalam Perang Saudara Amerika."
