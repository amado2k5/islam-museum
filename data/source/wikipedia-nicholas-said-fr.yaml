reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md). Read in full on 26 October 2026 and checked against the recorded revision. This is an independent tradition beside the English article, with its own sourcing (Dean Calbreath's biography, the Oxford Research Encyclopedia of African History, BlackPast and the Washington Post), not a translation of it. Its text records that Said, bought and freed by the Russian ambassador Menshikov, was encouraged to be baptised at Riga on 31 October 1855, changed his name to Nicholas and became an Orthodox Christian; its infobox gives his religion as Islam, then Orthodox Christianity. It gives his birth as 1834 or 1836 in Kukawa and his death, marked uncertain, as 1882 at Brownsville, Tennessee. It adds his capture by Tuaregs in 1851, his passage through Katsina, Murzuq and Tripoli, his service to Ottoman aristocrats including the vizier Mustafa Reshid Pasha, and his arrival in the United States in 1860."
