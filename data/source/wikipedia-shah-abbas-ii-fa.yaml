reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). A long Persian article, partly parallel to the English but carrying material of its own. For the shah himself it states that, unlike his father, he showed greater interest in the Sunni school, which earned him the enmity of many of the ulama of his father's court — the counter-characterisation preserved in the person record's flagged unknown, against the English article's attestation of his Shi'ia practice. It gives his death on 26 October 1666 at Khosrowabad near Damghan, agreeing with the Arabic article and Wikidata against the English article's Behshahr, and notes that his coins bore the Shi'a slogan and the names of the Twelve Imams. Checked 1 November 2026."
