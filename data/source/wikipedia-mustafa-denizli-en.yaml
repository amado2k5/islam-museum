  ar: "مقالة ويكيبيديا الإنجليزية عن مصطفى دنيزلي؛ تُستخدم لوقائع الكيان فقط. تروي سبعة عشر موسمًا مع آلتاي إزمير لاعبًا، ثم كونه المدرب الوحيد الذي فاز بالدوري التركي مع الأندية الثلاثة الكبرى في إسطنبول، وقيادته تركيا إلى ربع نهائي يورو 2000."
  en: "English Wikipedia article on Mustafa Denizli; used for entity facts only. It recounts his seventeen seasons as a player with Altay of İzmir, his record as the only manager to win the Süper Lig with all three Istanbul giants, and his leadership of Turkey to the Euro 2000 quarter-finals."
