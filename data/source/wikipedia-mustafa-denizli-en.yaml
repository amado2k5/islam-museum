reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It gives Denizli as born on 10 November 1949, a forward who spent 17 years with his hometown club Altay in İzmir before one season at Galatasaray, and a manager who won the Süper Lig with Galatasaray (1987–88, plus a European Cup semi-final in 1988–89), Fenerbahçe (2000–01) and Beşiktaş (2008–09), coached Turkey at Euro 2000, and worked in Germany, Iran and Azerbaijan. Its text makes no statement of his religion; its category list files him under 'Cretan Muslims', an ethnic-heritage category reflecting his family's Cretan background, which is not a sourced statement of personal religion and names no school."
