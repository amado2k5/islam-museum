summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مصطفى دنيزلي؛ تُستخدم لوقائع الكيان فقط. تروي سبعة عشر موسمًا مع آلتاي إزمير لاعبًا، ثم كونه المدرب الوحيد الذي فاز بالدوري التركي مع الأندية الثلاثة الكبرى في إسطنبول، وقيادته تركيا إلى ربع نهائي يورو 2000."
  en: "English Wikipedia article on Mustafa Denizli; used for entity facts only. It recounts his seventeen seasons as a player with Altay of İzmir, his record as the only manager to win the Süper Lig with all three Istanbul giants, and his leadership of Turkey to the Euro 2000 quarter-finals."
  es: "Artículo de la Wikipedia en inglés sobre Mustafa Denizli; utilizado únicamente para datos sobre la persona. Relata sus diecisiete temporadas como jugador en el Altay de Esmirna, su récord como el único entrenador en ganar la Süper Lig con los tres grandes de Estambul y su liderazgo de Turquía hasta los cuartos de final de la Eurocopa 2000."
  fr: "Article de Wikipédia en anglais sur Mustafa Denizli; utilisé uniquement à des fins d'information sur l'entité. Il relate ses dix-sept saisons comme joueur à l'Altay d'Izmir, son record en tant que seul entraîneur à avoir remporté la Süper Lig avec les trois grands clubs d'Istanbul, et son parcours jusqu'aux quarts de finale de l'Euro 2000 avec la Turquie."
  ur: "مصطفی ڈینیزلی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ازمیر کے Altay کے ساتھ بطور کھلاڑی ان کے سترہ سیزن، استنبول کے تینوں جنات کے ساتھ سپر لیگ جیتنے والے واحد مینیجر کے طور پر ان کا ریکارڈ اور یورو 2000 کے کوارٹر فائنل تک ترکی کی قیادت کا ذکر ہے۔"
  tr: "Mustafa Denizli hakkında İngilizce Wikipedia makalesi; sadece varlığın gerçekleri için kullanılmıştır. Altay İzmir'de oyuncu olarak geçirdiği on yedi sezonu, ardından İstanbul'daki üç büyük kulüple Türk ligini kazanan tek teknik direktör olduğunu ve Türkiye'yi Euro 2000 çeyrek finaline taşıdığını anlatıyor."
  id: "Artikel Wikipedia bahasa Inggris tentang Mustafa Denizli; digunakan hanya untuk fakta entitas. Ia menceritakan tujuh belas musim bersama Altay Izmir sebagai pemain, kemudian menjadi satu-satunya pelatih yang memenangkan liga Turki bersama tiga klub utama di Istanbul, dan membawa Turki ke perempat final Euro 2000."
