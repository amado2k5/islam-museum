summary:
  ar: "مقالة ويكيبيديا الأردية عن حاجي وارث علي شاه، وهي نص مستقل عن الإنجليزية: تنص على مولده سنة 1232 هـ ⁦(1817 م)⁩ في ديوا شريف، وعلى أنه مؤسس السلسلة الوارثية، وأنه صار في صباه مريدًا لخادم علي شاه وبقي مريده وخليفته حتى وفاة الشيخ، وتذكر ارتباطه بالمدرستين القادرية والجشتية، وتؤرخ وفاته بـ 29 محرم 1323 هـ ⁦(5 نيسان 1905)⁩."
  en: "The Urdu Wikipedia article on Haji Waris Ali Shah, a text independent of the English article: it states his birth in 1232 AH (1817) at Dewa Sharif, that he founded the Warsiyya silsila, that in boyhood he became a murid (disciple) of Khadim Ali Shah and remained his murid and khalifa until the latter's death, that his affiliation was with the Qadiri and Chishti schools of Sufism, and it dates his death to 29 Muharram 1323 AH (5 April 1905)."
  es: "El artículo de Wikipedia en urdu sobre Haji Waris Ali Shah, un texto independiente del artículo en inglés: afirma su nacimiento en 1232 AH (1817) en Dewa Sharif, que fundó Warsiyya silsila, que en su niñez se convirtió en murid (discípulo) de Khadim Ali Shah y siguió siendo su murid y califa hasta la muerte de este último, que su afiliación era con las escuelas de sufismo Qadiri y Chishti, y fecha su muerte en el 29 de Muharram de 1323 AH (5 de abril de 1905)."
  fr: "L'article de Wikipédia en ourdou sur Haji Waris Ali Shah, un texte indépendant de l'article anglais: il indique sa naissance en 1232 AH (1817) à Dewa Sharif, qu'il a fondé la Warsiyya silsila, que dans son enfance, il est devenu murid (disciple) de Khadim Ali Shah et est resté son murid et khalifa jusqu'à la mort de ce dernier, que son affiliation était avec les écoles de soufisme Qadiri et Chishti, et il date sa mort au 29 Muharram 1323 AH (5 avril 1905)."
