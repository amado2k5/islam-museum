summary:
  ar: "مقالة ويكيبيديا الأردية عن حاجي وارث علي شاه، وهي نص مستقل عن الإنجليزية: تنص على مولده سنة 1232 هـ (1817 م) في ديوا شريف، وعلى أنه مؤسس السلسلة الوارثية، وأنه صار في صباه مريدًا لخادم علي شاه وبقي مريده وخليفته حتى وفاة الشيخ، وتذكر ارتباطه بالمدرستين القادرية والجشتية، وتؤرخ وفاته بـ 29 محرم 1323 هـ (5 نيسان 1905)."
  en: "The Urdu Wikipedia article on Haji Waris Ali Shah, a text independent of the English article: it states his birth in 1232 AH (1817) at Dewa Sharif, that he founded the Warsiyya silsila, that in boyhood he became a murid (disciple) of Khadim Ali Shah and remained his murid and khalifa until the latter's death, that his affiliation was with the Qadiri and Chishti schools of Sufism, and it dates his death to 29 Muharram 1323 AH (5 April 1905)."
