  ar: "مقالة ويكيبيديا العربية عن أحمد حسام ميدو؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته مع الزمالك والأندية الأوروبية وفوزه بجائزة الحذاء الأبنوسي مع غينت، ومسيرته التدريبية وعمله التلفزيوني، وتروي تعرضه لعبارات معادية للإسلام في نيوكاسل وتدرجه في تصنيف «مسلمون مصريون» دون تسمية أي مذهب له."
  en: "Arabic Wikipedia article on Ahmed Hossam Mido; used for entity facts only. It recounts his career with Zamalek and the European clubs and his Ebony Shoe award at Gent, his coaching career and television work; it reports the Islamophobic abuse aimed at him at Newcastle and files him under the category 'Egyptian Muslims', without naming any school for him."
