summary:
  ar: "مقالة ويكيبيديا العربية عن أحمد حسام ميدو؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته مع الزمالك والأندية الأوروبية وفوزه بجائزة الحذاء الأبنوسي مع غينت، ومسيرته التدريبية وعمله التلفزيوني، وتروي تعرضه لعبارات معادية للإسلام في نيوكاسل وتدرجه في تصنيف «مسلمون مصريون» دون تسمية أي مذهب له."
  en: "Arabic Wikipedia article on Ahmed Hossam Mido; used for entity facts only. It recounts his career with Zamalek and the European clubs and his Ebony Shoe award at Gent, his coaching career and television work; it reports the Islamophobic abuse aimed at him at Newcastle and files him under the category 'Egyptian Muslims', without naming any school for him."
  es: "Artículo de Wikipedia en árabe sobre Ahmed Hossam Mido; utilizado únicamente para datos sobre la persona. Relata su trayectoria en el Zamalek y en clubes europeos, su premio Bota de Ébano en el Gent, su carrera como entrenador y su trabajo en televisión. Informa sobre los insultos islamófobos que sufrió en Newcastle y lo clasifica dentro de la categoría de \"musulmanes egipcios\", sin mencionar ninguna escuela a la que pertenezca."
  fr: "Article Wikipédia en arabe sur Ahmed Hossam Mido; utilisé uniquement à des fins d'information sur l'entité. Il retrace sa carrière au Zamalek et dans les clubs européens, son Soulier d'Ébène à La Gantoise, sa carrière d'entraîneur et ses apparitions à la télévision; il mentionne les injures islamophobes dont il a été victime à Newcastle et le classe dans la catégorie « Musulmans égyptiens », sans préciser son établissement scolaire."
  ur: "احمد حسام مڈو پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں زمالک اور یورپی کلبوں کے ساتھ ان کے کیریئر اور جینٹ میں ایبونی شو ایوارڈ، ان کے کوچنگ کیریئر اور ٹیلی ویژن کے کام کا ذکر ہے۔ یہ نیو کیسل میں اس کے خلاف اسلام فوبک بدسلوکی کی اطلاع دیتا ہے اور اسے 'مصری مسلمان' کے زمرے میں درج کرتا ہے، بغیر اس کے کسی اسکول کا نام لیے۔"
  tr: "Ahmed Hossam Mido hakkında Arapça Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılıyor. Zamalek ve Avrupa kulüplerindeki kariyerini, Gent ile Ebony Shoe Ödülü'nü, antrenörlük kariyerini ve televizyon kariyerini anlatıyor. Ayrıca Newcastle'da İslam karşıtı ifadelere maruz kalmasını ve herhangi bir tarikat belirtmeden 'Mısırlı Müslümanlar' olarak sınıflandırılmasını da anlatıyor."
  id: "Artikel Wikipedia berbahasa Arab tentang Ahmed Hossam Mido hanya digunakan untuk fakta entitas tersebut. Artikel ini menceritakan kariernya bersama klub Zamalek dan Eropa, memenangkan Penghargaan Sepatu Ebony bersama Gent, karier kepelatihannya, dan karier televisinya. Artikel ini juga menceritakan paparan terhadap pernyataan anti-Islam di Newcastle dan klasifikasinya sebagai 'Muslim Mesir' tanpa menyebutkan sekte manapun."
