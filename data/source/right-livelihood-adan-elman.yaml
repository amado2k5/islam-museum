  ar: "صفحة جائزة رايت ليفليهود عن فرتون آدن وإلواد علمان؛ تعطي تاريخي ميلادهما الدقيقين ومكاني ولادتهما في مقديشو، وتصف عملهما المشترك في السلام ونزع السلاح وحقوق الإنسان في الصومال."
