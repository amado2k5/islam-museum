reliability_note: "Award foundation's own laureate profile, read on 25 October 2026 (page content as indexed; the live page presents a bot check to automated readers). It lists Fartuun Adan: place of birth Mogadishu, Somalia, date of birth 2 February 1969; and Ilwad Elman: place of birth Mogadishu, Somalia, date of birth 22 December 1989. Its award citation is 'for promoting peace, demilitarisation and human rights in Somalia in the face of terrorism and gender-based violence', and it describes Elman Peace's disarmament and reintegration work, Sister Somalia's support for survivors, and the Peace by Africa network. It names no religion or school for either woman."
