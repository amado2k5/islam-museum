  ur: "فرطون اذان اور الود ایلمان کے لیے رائٹ لائیولی ہڈ ایوارڈ یافتہ صفحہ؛ یہ خواتین کی صحیح تاریخ پیدائش اور ان کی جائے پیدائش موغادیشو دونوں دیتا ہے، اور صومالیہ میں امن، غیر فوجی سازی اور انسانی حقوق کے لیے ان کے مشترکہ کام کی وضاحت کرتا ہے۔"
