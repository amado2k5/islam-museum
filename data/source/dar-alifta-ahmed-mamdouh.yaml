reliability_note: "His institution's own official reports: a primary source for his posts, not independent corroboration of biography. The honouring report (dated 2 March 2023 on the page) names «الدكتور أحمد ممدوح، أمين الفتوى ومنسق لجنة المعاملات» among the fatwa secretaries honoured by Grand Mufti Shawki Allam; the Academy symposium report names him «مدير إدارة الأبحاث الشرعية بدار الإفتاء» and records his address on the scholarly consensus against depicting prophets in drama; the Book Fair report records him speaking as fatwa secretary on fatwa in the digital age. Egyptian press reports add that he answers questions in video fatwas published on the Dar's official YouTube channel and in the Al-Nas channel programme «مع الناس». No report gives a birth date or a fuller name. Checked 25 October 2026."
