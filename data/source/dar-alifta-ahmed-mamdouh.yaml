summary:
  ar: "موقع دار الإفتاء المصرية الرسمي في مواضع تذكر أحمد ممدوح: تكريم المفتي شوقي علام له بوصفه أمين الفتوى ومنسق لجنة المعاملات (2023)، وخبر ندوة مجمع اللغة العربية الذي يصفه بمدير إدارة الأبحاث الشرعية، وندوة معرض القاهرة للكتاب التي تحدث فيها بوصفه أمين الفتوى."
  en: "Egypt's Dar al-Ifta official website in the places that name Ahmed Mamdouh: the Grand Mufti Shawki Allam's honouring of him as fatwa secretary and coordinator of the transactions committee (2023), the Arabic Language Academy symposium report naming him director of the Sharia Research Department, and the Cairo Book Fair panel at which he spoke as fatwa secretary."
  es: "El sitio web oficial de Dar al-Ifta de Egipto menciona a Ahmed Mamdouh en los siguientes lugares: el reconocimiento otorgado por el Gran Muftí Shawki Allam como secretario de fatwas y coordinador del comité de transacciones (2023), el informe del simposio de la Academia de la Lengua Árabe que lo nombra director del Departamento de Investigación de la Sharia, y el panel de la Feria del Libro de El Cairo en el que intervino como secretario de fatwas."
  fr: "Le site web officiel de Dar al-Ifta en Égypte mentionne Ahmed Mamdouh dans les documents suivants: la distinction honorifique qui lui a été décernée par le Grand Mufti Shawki Allam en tant que secrétaire des fatwas et coordinateur du comité des transactions (2023), le rapport du symposium de l’Académie de la langue arabe le nommant directeur du département de recherche sur la charia, et la table ronde de la Foire du livre du Caire à laquelle il a participé en tant que secrétaire des fatwas."
