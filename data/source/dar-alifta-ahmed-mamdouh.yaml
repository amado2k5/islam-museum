summary:
  ar: "موقع دار الإفتاء المصرية الرسمي في مواضع تذكر أحمد ممدوح: تكريم المفتي شوقي علام له بوصفه أمين الفتوى ومنسق لجنة المعاملات (2023)، وخبر ندوة مجمع اللغة العربية الذي يصفه بمدير إدارة الأبحاث الشرعية، وندوة معرض القاهرة للكتاب التي تحدث فيها بوصفه أمين الفتوى."
  en: "Egypt's Dar al-Ifta official website in the places that name Ahmed Mamdouh: the Grand Mufti Shawki Allam's honouring of him as fatwa secretary and coordinator of the transactions committee (2023), the Arabic Language Academy symposium report naming him director of the Sharia Research Department, and the Cairo Book Fair panel at which he spoke as fatwa secretary."
