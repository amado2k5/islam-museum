summary:
  ar: "الموقع الرسمي لمسجد دار السنة في أكتون بلندن ⁦(3 واربل واي)⁩؛ يعرض الموقع محاضرات المسجد ودروسه، وتتصدّر قسم الفيديو فيه عناوين مناظرات الشمسي ودروسه، وهو مصدر أولي لهوية المسجد ومنصته الدعوية، لا مصدر مستقل مؤيد."
  en: "The official website of Masjid Daar us Sunnah in Acton, London (3 Warple Way); it carries the masjid's lectures and classes, and its video section is led by Shamsi's debates and lessons. A primary source for the masjid's identity and its dawah platform, not independent corroboration."
  es: "El sitio web oficial de la Mezquita Daar us Sunnah en Acton, Londres (3 Warple Way) ofrece las conferencias y clases de la mezquita, y su sección de videos presenta los debates y lecciones de Shamsi. Es una fuente primaria sobre la identidad de la mezquita y su plataforma de dawah, pero no una corroboración independiente."
  fr: "Le site web officiel de la mosquée Daar us Sunnah à Acton, Londres (3 Warple Way) propose les conférences et les cours de la mosquée, ainsi qu'une section vidéo animée par Shamsi, avec des débats et des enseignements. Il s'agit d'une source primaire concernant l'identité de la mosquée et sa plateforme de da'wa, mais non d'une confirmation indépendante."
  ur: "ایکٹن، لندن میں مسجد دار سنت کی آفیشل ویب سائٹ ⁦(3 وارپل وے)⁩؛ اس میں مسجد کے لیکچرز اور کلاسز ہوتے ہیں، اور اس کے ویڈیو سیکشن کی قیادت شمسی کے مباحث اور اسباق کرتے ہیں۔ مسجد کی شناخت اور اس کے دعوتی پلیٹ فارم کے لیے ایک بنیادی ذریعہ، آزاد تصدیق نہیں۔"
