summary:
  ar: "مقالة ويكيبيديا العربية عن عبد الباري الفرنجي محلي (1878–1926)؛ تُستخدم لوقائع الكيان فقط. تصفه بأنه عالم مسلم فرنجي محلي، وتذكر تتلمذه على الشيخ عبد الباقي الفرنجي محلي ورحلاته إلى الحرمين وبغداد، وعمله أستاذًا مساعدًا في بونه سنة 1916، وتأليفه نحو 111 كتابًا وتأسيسه مدرسة النظام وعضويته المؤسسة لأكاديمية شبلي وللجامعة الملية الإسلامية."
  en: "Arabic Wikipedia article on Abdul Bari Firangi Mahali (1878–1926); used for entity facts only. It calls him a Muslim scholar of Firangi Mahal, records his study under Shaykh Abd al-Baqi al-Firangi Mahali, his travels to the Haramayn and Baghdad, his post as assistant professor at Pune in 1916, his authorship of some 111 books, and his founding of Madrasa al-Nizam and founder membership of the Shibli Academy and Jamia Millia Islamia."
  es: "Artículo de Wikipedia en árabe sobre Abdul Bari Firangi Mahali (1878-1926); utilizado únicamente para datos sobre la persona. Lo describe como un erudito musulmán de Firangi Mahal, registra sus estudios con el jeque Abd al-Baqi al-Firangi Mahali, sus viajes a Haramayn y Bagdad, su puesto como profesor asistente en Pune en 1916 y su autoría de unos 111 libros."
  fr: "Article de Wikipédia en arabe sur Abdul Bari Firangi Mahali (1878-1926); utilisé uniquement à des fins d’information sur l’entité. Il le présente comme un érudit musulman de Firangi Mahal, relate ses études auprès du cheikh Abd al-Baqi al-Firangi Mahali, ses voyages à Haramayn et à Bagdad, son poste de professeur assistant à Pune en 1916 et la publication de quelque 111 ouvrages."
  ur: "عربی ویکیپیڈیا مضمون عبدالباری فرنگی محلی (1878-1926) پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں انہیں فرنگی محل کا ایک مسلمان عالم کہا جاتا ہے، شیخ عبد الباقی الفرنگی محلی کے تحت ان کی تعلیم، حرمین اور بغداد کے سفر، 1916 میں پونے میں اسسٹنٹ پروفیسر کے طور پر ان کا عہدہ، تقریباً 111 کتابوں کی ان کی تصنیف کا ریکارڈ ہے۔"
