summary:
  ar: "مقالة ويكيبيديا العربية عن عبد الباري الفرنجي محلي (1878–1926)؛ تُستخدم لوقائع الكيان فقط. تصفه بأنه عالم مسلم فرنجي محلي، وتذكر تتلمذه على الشيخ عبد الباقي الفرنجي محلي ورحلاته إلى الحرمين وبغداد، وعمله أستاذًا مساعدًا في بونه سنة 1916، وتأليفه نحو 111 كتابًا وتأسيسه مدرسة النظام وعضويته المؤسسة لأكاديمية شبلي وللجامعة الملية الإسلامية."
  en: "Arabic Wikipedia article on Abdul Bari Firangi Mahali (1878–1926); used for entity facts only. It calls him a Muslim scholar of Firangi Mahal, records his study under Shaykh Abd al-Baqi al-Firangi Mahali, his travels to the Haramayn and Baghdad, his post as assistant professor at Pune in 1916, his authorship of some 111 books, and his founding of Madrasa al-Nizam and founder membership of the Shibli Academy and Jamia Millia Islamia."
