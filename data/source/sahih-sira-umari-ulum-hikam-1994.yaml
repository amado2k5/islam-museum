label:
  ar: "السيرة النبوية الصحيحة: محاولة لتطبيق قواعد المحدثين في نقد روايات السيرة النبوية — أكرم ضياء العمري ⁦(مكتبة العلوم والحكم، المدينة المنورة، ط6 1415هـ/1994م)⁩"
  en: "al-Sira al-Nabawiyya al-Sahiha: An Attempt to Apply the Hadith Scholars' Rules to the Criticism of the Sira Reports — Akram Diya' al-Umari (Maktabat al-Ulum wa-al-Hikam, Medina, 6th ed. 1415/1994)"
summary:
  ar: "الطبعة السادسة ⁦(1415هـ/1994م)⁩ من «السيرة النبوية الصحيحة» للدكتور أكرم ضياء العمري، مكتبة العلوم والحكم بالمدينة المنورة، وفيها مقدمة في منهج كتابة تاريخ صدر الإسلام ومصادر السيرة، ثم أربعة فصول: الرسول في مكة، والرسول في المدينة ⁦(المجتمع وتنظيماته وإجلاء اليهود)⁩، والجهاد ضد المشركين، والرسالة والرسول."
  en: "The sixth edition (1415/1994) of Dr Akram Diya' al-Umari's al-Sira al-Nabawiyya al-Sahiha, Maktabat al-Ulum wa-al-Hikam, Medina: an introduction on the method of writing early Islamic history and on the sources of the sira, then four chapters — the Prophet in Mecca; the Prophet in Medina (society, its first institutions and the expulsion of the Jewish tribes); the struggle against the polytheists; and the Message and the Messenger."
  es: "La sexta edición (1415/1994) de al-Sira al-Nabawiyya al-Sahiha, Maktabat al-Ulum wa-al-Hikam, Medina, del Dr. Akram Diya' al-Umari: una introducción sobre el método de escritura de la historia islámica temprana y sobre las fuentes de la sira, seguida de cuatro capítulos: el Profeta en La Meca; el Profeta en Medina (la sociedad, sus primeras instituciones y la expulsión de las tribus judías); la lucha contra los politeístas; y el Mensaje y el Mensajero."
  fr: "La sixième édition (1415/1994) de l'ouvrage du Dr Akram Diya' al-Umari, al-Sira al-Nabawiyya al-Sahiha, Maktabat al-Ulum wa-al-Hikam, Médine: une introduction sur la méthode d'écriture de l'histoire islamique ancienne et sur les sources de la sira, puis quatre chapitres — le Prophète à La Mecque; le Prophète à Médine (la société, ses premières institutions et l'expulsion des tribus juives); la lutte contre les polythéistes; et le Message et le Messager."
  ur: "چھٹا ایڈیشن (1415/1994) ڈاکٹر اکرم دیا العمری کی السیرۃ النبویہ الصحیح، مکتبۃ العلوم و الحکم، مدینہ: ابتدائی اسلامی تاریخ لکھنے کے طریقہ کار اور سیرت کے ماخذ پر ایک تعارف، پھر چار ابواب میں؛ نبی کریم۔ مدینہ میں پیغمبر ⁦(معاشرہ، اس کے پہلے ادارے اور یہودی قبائل کی بے دخلی)⁩؛ مشرکین کے خلاف جدوجہد؛ اور پیغام اور رسول۔"
  tr: "Dr. Akram Diyaa Al-Omari'nin \"Gerçek Peygamber Biyografisi\"nin altıncı baskısı (1415 Hicri / 1994 AD), Medine'deki Maktabat al-Uloom wal-Hikam. Erken İslam'ın tarihinin yazma metodolojisine ve biyografinin kaynaklarına giriş içerir; ardından dört bölüm gelir: Mekke'de Elçi, Medine'de Elçi (Cemiyet ve Örgütleri ve Yahudilerin Kovulması), Çilmişlere Karşı Cihad ve Mesaj ve Elçi."
  id: "Edisi keenam (1415 H / 1994 M) dari \"Biografi Nabi Otentik\" oleh Dr. Akram Diyaa Al-Omari, Maktabat al-Uloom wal-Hikam di Madinah. Edisi ini memuat pengantar metodologi penulisan sejarah Islam awal dan sumber-sumber biografi, diikuti oleh empat bab: Rasul di Mekah, Utusan di Madinah (Masyarakat dan Organisasinya serta Pengusiran Yahudi), Jihad Melawan Politeis, dan Pesan dan Rasululan."
