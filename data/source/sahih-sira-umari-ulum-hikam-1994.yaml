  en: "al-Sira al-Nabawiyya al-Sahiha: An Attempt to Apply the Hadith Scholars' Rules to the Criticism of the Sira Reports — Akram Diya' al-Umari (Maktabat al-Ulum wa-al-Hikam, Medina, 6th ed. 1415/1994)"
summary:
  ar: "الطبعة السادسة (1415هـ/1994م) من «السيرة النبوية الصحيحة» للدكتور أكرم ضياء العمري، مكتبة العلوم والحكم بالمدينة المنورة، وفيها مقدمة في منهج كتابة تاريخ صدر الإسلام ومصادر السيرة، ثم أربعة فصول: الرسول في مكة، والرسول في المدينة (المجتمع وتنظيماته وإجلاء اليهود)، والجهاد ضد المشركين، والرسالة والرسول."
  en: "The sixth edition (1415/1994) of Dr Akram Diya' al-Umari's al-Sira al-Nabawiyya al-Sahiha, Maktabat al-Ulum wa-al-Hikam, Medina: an introduction on the method of writing early Islamic history and on the sources of the sira, then four chapters — the Prophet in Mecca; the Prophet in Medina (society, its first institutions and the expulsion of the Jewish tribes); the struggle against the polytheists; and the Message and the Messenger."
