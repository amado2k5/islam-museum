summary:
  ar: "السيرة الذاتية في الموقع الرسمي لسليمان مولا: حفظ القرآن في الرابعة عشرة ⁦(سنة 1989)⁩، ودرس سبع سنوات وأتمّ الأهلية في العلوم الشرعية ومنها الفقه متخصصا في المذهب الحنفي، ونال إجازات من علماء جنوب أفريقيا وشبه القارة، ودرّس في دار العلوم زكريا، وألّف «صدى من الكهف» و«الشمس التي لا تغيب أبدا»."
  en: "The biography on Sulaiman Moola's official website: he memorised the Qur'an at fourteen (in 1989), studied for seven years completing his scholarship in the sacred sciences including fiqh specialising in the Hanafi school, received ijazahs from scholars of South Africa and the subcontinent, taught at Dar al-Uloom Zakariyya, and authored Echoes from the Cave and The Sun That Never Set."
  es: "La biografía de Sulaiman Moola en su sitio web oficial dice lo siguiente: memorizó el Corán a los catorce años (en 1989), estudió durante siete años completando sus estudios en ciencias sagradas, incluyendo fiqh, especializándose en la escuela Hanafi, recibió ijazahs de eruditos de Sudáfrica y del subcontinente, enseñó en Dar al-Uloom Zakariyya y es autor de Echoes from the Cave y The Sun That Never Set."
  fr: "La biographie de Sulaiman Moola sur son site officiel indique qu'il a mémorisé le Coran à quatorze ans (en 1989), a étudié pendant sept ans pour achever ses études dans les sciences sacrées, notamment le fiqh, se spécialisant dans l'école hanafite, a reçu des ijazahs de savants d'Afrique du Sud et du sous-continent, a enseigné à Dar al-Uloom Zakariyya et est l'auteur de Echoes from the Cave et The Sun That Never Set."
  ur: "سلیمان مولا کی آفیشل ویب سائٹ پر سوانح عمری: اس نے چودہ سال کی عمر میں قرآن حفظ کیا ⁦(1989 میں)⁩، سات سال تک تعلیم حاصل کی اور فقہ حنفی میں مہارت حاصل کرنے سمیت مقدس علوم میں اسکالرشپ مکمل کیا، جنوبی افریقہ اور برصغیر کے اسکالرز سے اعجازات حاصل کیے، دارالعلوم میں پڑھایا اور ثنائی زاکیۃ کے مصنفین اور مصنفین سے۔ سیٹ"
  tr: "Süleyman Molla'nın resmi web sitesindeki özgeçmiş: 1989'da on dört yaşında Kur'an'ı ezberledi, yedi yıl eğitim aldı ve Hanefi okulunda uzmanlaşarak İslam bilimleri, fıkıh dahil, yeterlilik tamamladı. Güney Afrika ve alt kıtadan alimlerden lisans aldı, Dar Al-Uloom Zakaria'da eğitim aldı ve \"Mağaradan Yankı\" ile \"Asla Batmayan Güneş\" kitaplarının yazarı oldu."
  id: "Curriculum Vitae di situs resmi Suleiman Molla: Menghafal Al-Quran pada usia empat belas tahun (tahun 1989), belajar selama tujuh tahun, dan menyelesaikan kualifikasi ilmu Islam, termasuk hukum, dengan spesialisasi di sekolah Hanafi. Ia memperoleh lisensi dari para ulama dari Afrika Selatan dan anak benua, belajar di Dar Al-Uloom Zakaria, dan menulis \"Gema dari Gua\" dan \"Matahari yang Tidak Pernah Terbenam.\""
