summary:
  ar: "السيرة الذاتية في الموقع الرسمي لسليمان مولا: حفظ القرآن في الرابعة عشرة (سنة 1989)، ودرس سبع سنوات وأتمّ الأهلية في العلوم الشرعية ومنها الفقه متخصصا في المذهب الحنفي، ونال إجازات من علماء جنوب أفريقيا وشبه القارة، ودرّس في دار العلوم زكريا، وألّف «صدى من الكهف» و«الشمس التي لا تغيب أبدا»."
  en: "The biography on Sulaiman Moola's official website: he memorised the Qur'an at fourteen (in 1989), studied for seven years completing his scholarship in the sacred sciences including fiqh specialising in the Hanafi school, received ijazahs from scholars of South Africa and the subcontinent, taught at Dar al-Uloom Zakariyya, and authored Echoes from the Cave and The Sun That Never Set."
