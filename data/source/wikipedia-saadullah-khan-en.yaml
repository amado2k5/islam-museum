reliability_note: "Pointer for entity facts only. A full life: born c. 1591 at Chiniot into a Punjabi Jat Thahim family, educated at Lahore under Shaykh Kamal al-Din, teacher at Wazir Khan's madrasa, tutor to Asaf Khan's children, entering imperial service in December 1641 and rising through the arz-i-mukarrar, the Mir-i-Saman office and the Diwan-i-Khalisa to grand vizier in 1645, holding 7000/7000 until his death in April 1656; with the Balkh settlement, the Kandahar sieges and the European travellers' praise (Manucci, Bernier). It names no school for him. Checked 1 November 2026."
