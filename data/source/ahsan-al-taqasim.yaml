label: { ar: "أحسن التقاسيم في معرفة الأقاليم للمقدسي", en: "Ahsan al-Taqasim fi Ma'rifat al-Aqalim of al-Muqaddasi" }
summary:
  ar: "أحسن التقاسيم في معرفة الأقاليم لشمس الدين محمد بن أحمد المقدسي البشاري ⁦(ت نحو 380هـ)⁩، أعظم كتب الجغرافيا الإقليمية وصفاً للمسالك والمدن والعادات والصنائع، نسخة رقمية ممسوحة في مكتبة الحصاد المحلية أُجريت عليها قراءة آلية بآبل فيجن."
  en: "Al-Muqaddasi's Ahsan al-Taqasim fi Ma'rifat al-Aqalim — the finest regional geography of routes, cities, customs and crafts — scanned and Apple-Vision OCR'd in the local harvest library."
  es: "La obra Ahsan al-Taqasim fi Ma'rifat al-Aqalim de Al-Muqaddasi —la mejor geografía regional de rutas, ciudades, costumbres y artesanías— fue escaneada y procesada mediante OCR con Apple Vision en la biblioteca local."
  fr: "L'ouvrage d'Al-Muqaddasi, Ahsan al-Taqasim fi Ma'rifat al-Aqalim — la meilleure géographie régionale des routes, des villes, des coutumes et de l'artisanat — a été numérisé et traité par reconnaissance optique de caractères (OCR) Apple-Vision dans la bibliothèque locale."
  ur: "المقدسی کا احسن التقاسم فی معارف الاقلیم — راستوں، شہروں، رسم و رواج اور دستکاریوں کا بہترین علاقائی جغرافیہ — اسکین کیا گیا اور مقامی فصل کی لائبریری میں Apple-Vision OCR'd۔"
  tr: "Şemseddin Muhammed ibn Ahmed el-Makdisi el-Bişri'nin (ö. yaklaşık 380 Hicri yılında) bölgeleri tanıma konusunda en iyi bölümleri, rotaları, şehirleri, gelenekleri ve zanaatları anlatan en büyük bölgesel coğrafya kitabı, yerel Al-Hasad kütüphanesinde Apple Vision'da mekanik olarak okunan taranmış dijital bir kopyadır."
  id: "Pembagian terbaik dalam mengetahui wilayah oleh Shams al-Din Muhammad ibn Ahmad al-Maqdisi al-Bishri (wafat sekitar 380 H), buku geografi regional terbesar yang menggambarkan rute, kota, adat, dan kerajinan, adalah salinan digital hasil scan di perpustakaan Al-Hasad setempat, yang dibaca secara mekanis di Apple Vision."
