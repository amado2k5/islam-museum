summary:
  ar: "تدوينة لميخايلو ياكوبوفيتش في مشروع «القرآن العالمي» بجامعة مونستر، 17 مايو 2024، عن ترجمة «صحيح إنترناشونال»: ثلاث أمريكيات مسلمات في جدة، ودار أبي القاسم للنشر، وطبعتها الأولى 1997 مع المنتدى الإسلامي، والثانية 2004، ومنهجها المعلن على عقيدة أهل السنة والجماعة، وانتشارها."
  en: "A post by Mykhaylo Yakubovych for the Global Qur'an project at the University of Münster, 17 May 2024, on the Saheeh International translation: three American Muslim women in Jeddah, the Abul-Qasim Publishing House, the first edition of 1997 with al-Muntada al-Islami, the second of 2004, its declared method according to the creed of Ahl al-Sunna wa-l-Jama'a, and its spread."
  ur: "جامعہ مونسٹر کے منصوبے «گلوبل قرآن» میں میخائیلو یاکوبووچ کی تحریر، 17 مئی 2024، «صحیح انٹرنیشنل» ترجمے پر: جدہ میں تین امریکی مسلمان خواتین، دار ابو القاسم، المنتدی الاسلامی کے ساتھ 1997 کی پہلی اشاعت، 2004 کی دوسری، اہل السنہ والجماعہ کے عقیدے کے مطابق اعلان کردہ طریقہ، اور اس کی مقبولیت۔"
