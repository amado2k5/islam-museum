reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It covers her Indian father and Malay mother, her father's death when she was eight and her childhood help selling nasi padang, her law degrees (bachelor's 1978, master's 2001) and honorary doctorate of 7 July 2016, her NTUC legal career, her parliamentary service for Jurong (2001–2015) and Marsiling–Yew Tee (2015–2017), her ministerial posts, her resignation on 7 August 2017 to contest the presidency and her swearing-in the day after her uncontested election was declared on 13 September 2017. Two particulars are recorded with care: it dates her election as Speaker to 14 January 2014, where the English article gives 14 January 2013 — the English date is followed and the variant recorded; and it states in terms that she professes Islam ('تعتنق حليمة الإسلام ديانةً'), a generic profession naming no school. It also notes her opposition front against radical Islam and the Islamic State."
