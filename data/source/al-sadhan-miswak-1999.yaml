summary:
  ar: "ملخص مراجعة في مجلة طب الأسنان السعودية عن السواك وأنواع أعواد تنظيف الأسنان واستعمالاتها؛ يذكر أن أعواد المضغ استُخدمت في بابل قبل نحو سبعة آلاف سنة ثم لدى اليونان والرومان والمصريين القدماء والمسلمين."
  en: "An abstract of a Saudi Dental Journal review on miswak and chewing sticks; it reports use in Babylonia about 7,000 years ago and later among Greeks, Romans, ancient Egyptians and Muslims."
  es: "Resumen de una revisión publicada en la Revista Dental Saudí sobre el miswak y los palillos para masticar; en ella se informa de su uso en Babilonia hace unos 7.000 años y posteriormente entre griegos, romanos, antiguos egipcios y musulmanes."
  fr: "Résumé d'une étude du Saudi Dental Journal sur le miswak et les bâtonnets à mâcher; elle rapporte leur utilisation en Babylonie il y a environ 7 000 ans, puis plus tard chez les Grecs, les Romains, les anciens Égyptiens et les musulmans."
  ur: "مسواک اور چبانے کے بارے میں سعودی ڈینٹل جرنل کے جائزے کا خلاصہ؛ یہ تقریباً 7,000 سال پہلے بابل میں اور بعد میں یونانیوں، رومیوں، قدیم مصریوں اور مسلمانوں میں استعمال ہونے کی اطلاع ہے۔"
