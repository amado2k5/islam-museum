summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن فرانك ريبيري؛ تُستخدم لوقائع الكيان فقط. تروي سيرة الجناح الفرنسي المولود في 7 أبريل 1983 ببولوني سور مير: اثنا عشر موسمًا مع بايرن ميونخ وجائزة أفضل لاعب في أوروبا 2013، وفيورنتينا وساليرنيتانا، و81 مباراة مع فرنسا، وأنه اعتنق الإسلام واتخذ اسم بلال يوسف محمد."
  en: "English Wikipedia article on Franck Ribéry; used for entity facts only. It records the French winger born 7 April 1983 at Boulogne-sur-Mer: twelve seasons at Bayern Munich and the 2013 UEFA Best Player in Europe Award, Fiorentina and Salernitana, 81 France caps, and that he is a convert to Islam who adopted the name Bilal Yusuf Mohammed."
  es: "Artículo de la Wikipedia en inglés sobre Franck Ribéry; utilizado únicamente para obtener información sobre la persona. En él se menciona que el extremo francés nació el 7 de abril de 1983 en Boulogne-sur-Mer: doce temporadas en el Bayern de Múnich y el premio al Mejor Jugador de Europa de la UEFA en 2013, Fiorentina y Salernitana, 81 partidos internacionales con Francia, y que es un converso al islam que adoptó el nombre de Bilal Yusuf Mohammed."
  fr: "Article Wikipédia en anglais sur Franck Ribéry; utilisé uniquement pour les informations relatives à l'entité. Il mentionne l'ailier français né le 7 avril 1983 à Boulogne-sur-Mer: douze saisons au Bayern Munich et lauréat du prix du meilleur joueur UEFA en Europe en 2013, passage à la Fiorentina et à Salernitana, 81 sélections en équipe de France, et sa conversion à l'islam sous le nom de Bilal Yusuf Mohammed."
  ur: "Franck Ribery پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں فرانسیسی ونگر کا ریکارڈ ہے جو 7 اپریل 1983 کو بولون-سر-میر میں پیدا ہوا: بارہ سیزن بایرن میونخ میں اور 2013 کے یو ای ایف اے بیسٹ پلیئر ان یوروپ ایوارڈ، فیورینٹینا اور سالرنیتانا، 81 فرانس کیپس، اور یہ کہ وہ اسلام قبول کرنے والا ہے جس نے بلال یوسف محمد کا نام اپنایا۔"
  tr: "Franck Ribéry hakkında İngilizce Wikipedia makalesi; sadece kurumun gerçekleri için kullanılmıştır. 7 Nisan 1983'te Bologne-sur-Mer'de doğan Fransız kanat oyuncusunun biyografisini anlatır: Bayern Münih'te on iki sezon, 2013 Avrupa Yılın Oyuncusu ödülü, Fiorentina ve Salernitana ile 81 maç, ayrıca İslam'a geçip Bilal Youssef Mohammed adını aldığı anlatılır."
  id: "Artikel Wikipedia bahasa Inggris tentang Franck Ribéry; digunakan hanya untuk fakta entitas. Artikel ini menceritakan biografi winger Prancis yang lahir pada 7 April 1983 di Bologne-sur-Mer: dua belas musim bersama Bayern Munich, penghargaan Pemain Terbaik Eropa 2013, Fiorentina dan Salernitana, serta 81 pertandingan melawan Prancis, dan bahwa ia memeluk Islam dan mengambil nama Bilal Youssef Mohammed."
