  ar: "مقالة ويكيبيديا الإنجليزية عن فرانك ريبيري؛ تُستخدم لوقائع الكيان فقط. تروي سيرة الجناح الفرنسي المولود في 7 أبريل 1983 ببولوني سور مير: اثنا عشر موسمًا مع بايرن ميونخ وجائزة أفضل لاعب في أوروبا 2013، وفيورنتينا وساليرنيتانا، و81 مباراة مع فرنسا، وأنه اعتنق الإسلام واتخذ اسم بلال يوسف محمد."
  en: "English Wikipedia article on Franck Ribéry; used for entity facts only. It records the French winger born 7 April 1983 at Boulogne-sur-Mer: twelve seasons at Bayern Munich and the 2013 UEFA Best Player in Europe Award, Fiorentina and Salernitana, 81 France caps, and that he is a convert to Islam who adopted the name Bilal Yusuf Mohammed."
