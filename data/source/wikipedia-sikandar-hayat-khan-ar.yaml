summary:
  ar: "مقالة ويكيبيديا العربية عن إسكندر حياة خان؛ تُستخدم لوقائع الكيان فقط. تروي باختصار أنه وُلد في 5 حزيران 1892 وتوفي ليلة 26 كانون الأول 1942 ودُفن بجوار المسجد البادشاهي في لاهور، وأنه قاد الحزب الاتحادي إلى فوز 1937 وحكم البنجاب رئيسا للوزراء، ولا تذكر دينا ولا مذهبا."
  en: "Arabic Wikipedia article on Sikandar Hayat Khan; used for entity facts only. It briefly recounts that he was born on 5 June 1892 and died on the night of 26 December 1942 and was buried beside the Badshahi Mosque in Lahore, and that he led the Unionist Party to victory in 1937 and governed the Punjab as Premier; it names no religion or school."
  es: "Artículo en árabe de la Wikipedia sobre Sikandar Hayat Khan; utilizado únicamente para datos sobre la persona. Relata brevemente que nació el 5 de junio de 1892 y murió la noche del 26 de diciembre de 1942, y que fue enterrado junto a la Mezquita Badshahi en Lahore. También menciona que lideró al Partido Unionista a la victoria en 1937 y gobernó el Punjab como Primer Ministro; no se menciona ninguna religión ni escuela política."
  fr: "Article de Wikipédia en arabe sur Sikandar Hayat Khan; utilisé uniquement à titre informatif. Il relate brièvement sa naissance le 5 juin 1892 et sa mort dans la nuit du 26 décembre 1942. Il est enterré près de la mosquée Badshahi à Lahore et mentionne qu’il a mené le Parti unioniste à la victoire en 1937 et a gouverné le Pendjab en tant que Premier ministre. L’article ne fait mention ni de religion ni d’école."
  ur: "سکندر حیات خان پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں مختصراً بتایا گیا ہے کہ وہ 5 جون 1892 کو پیدا ہوئے اور 26 دسمبر 1942 کی رات کو انتقال کر گئے اور لاہور میں بادشاہی مسجد کے پاس دفن ہوئے، اور یہ کہ انہوں نے 1937 میں یونینسٹ پارٹی کو فتح دلائی اور بطور وزیر اعظم پنجاب پر حکومت کی۔ اس میں کسی مذہب یا اسکول کا نام نہیں ہے۔"
