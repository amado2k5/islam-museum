  ar: "مقالة ويكيبيديا العربية عن إسكندر حياة خان؛ تُستخدم لوقائع الكيان فقط. تروي باختصار أنه وُلد في 5 حزيران 1892 وتوفي ليلة 26 كانون الأول 1942 ودُفن بجوار المسجد البادشاهي في لاهور، وأنه قاد الحزب الاتحادي إلى فوز 1937 وحكم البنجاب رئيسا للوزراء، ولا تذكر دينا ولا مذهبا."
  en: "Arabic Wikipedia article on Sikandar Hayat Khan; used for entity facts only. It briefly recounts that he was born on 5 June 1892 and died on the night of 26 December 1942 and was buried beside the Badshahi Mosque in Lahore, and that he led the Unionist Party to victory in 1937 and governed the Punjab as Premier; it names no religion or school."
