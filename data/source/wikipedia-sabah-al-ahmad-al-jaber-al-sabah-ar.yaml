  ar: "مقالة ويكيبيديا العربية المطوّلة عن صباح الأحمد الجابر الصباح؛ تُستخدم لوقائع الكيان فقط. تتناول نشأته وتوليه الخارجية أربعة عقود ورئاسة الوزراء وإمارة الكويت من 2006 إلى 2020 وسياساته الداخلية والخارجية ووفاته. ولا تسمي المقالة له دينًا ولا مدرسة في متنها ولا في صندوق معلوماتها."
  en: "The long Arabic Wikipedia article on Sabah Al-Ahmad Al-Jaber Al-Sabah; used for entity facts only. It covers his upbringing, his four decades as foreign minister, his premiership, his emirate of Kuwait from 2006 to 2020, his domestic and foreign policies and his death. The article names no religion or school for him, in its text or in its infobox; its passages on Islamist currents concern Kuwaiti politics, not the man."
