summary:
  ar: مقالة ويكيبيديا العربية عن البشير صفر؛ تُستخدم لوقائع الكيان فقط. مطلعها يعطي مولده في تونس في 27 فبراير 1865 — خلافًا للمقالتين الإنجليزية والفرنسية وويكيداتا (1856)، وهو على الأرجح قلبٌ لرقمين — ووفاته سنة 1917، وأسرته من أصول تركية مستقرة بالمهدية ووالده مصطفى صفر أمير اللواء، وتعليمه في المدرسة الصادقية وبعثته إلى باريس سنة 1880 وعودته سنة 1882. لا تذكر المقالة دينًا أو مذهبًا له.
  en: Arabic Wikipedia article on Béchir Sfar; used for entity facts only. Its lead gives his birth in Tunis on 27 February 1865 — against the English and French articles and Wikidata (1856), most likely a digit transposition — and his death in 1917, his family of Turkish origin settled at Mahdia, his father Mustafa Sfar the army commander, his Sadiki education, his 1880 study mission to Paris and his 1882 return. The article states no religion or school for him.
  es: "Artículo de Wikipedia en árabe sobre Béchir Sfar; utilizado únicamente para datos sobre la persona. Su introducción indica que nació en Túnez el 27 de febrero de 1865 —en contradicción con los artículos en inglés y francés y Wikidata (1856), probablemente debido a una transposición de dígitos— y falleció en 1917. Menciona que su familia era de origen turco y se estableció en Mahdia, que su padre, Mustafa Sfar, era comandante del ejército, su educación sadiki, su viaje de estudios a París en 1880 y su regreso en 1882. El artículo no indica que profesara ninguna religión ni asistiera a ninguna escuela."
  fr: "L'article de Wikipédia en arabe sur Béchir Sfar, utilisé uniquement pour les informations biographiques, indique sa naissance à Tunis le 27 février 1865 (contrairement aux articles en anglais et en français, ainsi qu'à Wikidata qui mentionne 1856, probablement une erreur de frappe) et son décès en 1917. Sa famille, d'origine turque, s'était installée à Mahdia. Son père, Mustafa Sfar, était commandant de l'armée. L'article mentionne également son éducation sadiki, son séjour d'études à Paris en 1880 et son retour en 1882. Aucune mention n'est faite de sa religion ni de son école."
