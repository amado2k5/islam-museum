summary:
  ar: مقالة ويكيبيديا العربية عن البشير صفر؛ تُستخدم لوقائع الكيان فقط. مطلعها يعطي مولده في تونس في 27 فبراير 1865 — خلافًا للمقالتين الإنجليزية والفرنسية وويكيداتا (1856)، وهو على الأرجح قلبٌ لرقمين — ووفاته سنة 1917، وأسرته من أصول تركية مستقرة بالمهدية ووالده مصطفى صفر أمير اللواء، وتعليمه في المدرسة الصادقية وبعثته إلى باريس سنة 1880 وعودته سنة 1882. لا تذكر المقالة دينًا أو مذهبًا له.
  en: Arabic Wikipedia article on Béchir Sfar; used for entity facts only. Its lead gives his birth in Tunis on 27 February 1865 — against the English and French articles and Wikidata (1856), most likely a digit transposition — and his death in 1917, his family of Turkish origin settled at Mahdia, his father Mustafa Sfar the army commander, his Sadiki education, his 1880 study mission to Paris and his 1882 return. The article states no religion or school for him.
