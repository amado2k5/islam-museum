  ar: "مقالة ويكيبيديا الفرنسية عن سيرين مونتاخا مباكي؛ تُستخدم لوقائع الكيان فقط. تذكر في صدرها ولادته في 11 يوليو 1932 وفي متنها ولادته سنة 1933 في دارو كايل، وخلافته العامة للمريدية منذ يناير 2018 خلفًا لسيدي مختار مباكي، ومواقفه العامة في سنوات 2022–2024."
  en: "French Wikipedia article on Serigne Mountakha Mbacké; used for entity facts only. Its lead gives his birth on 11 July 1932 while its body gives 1933 at Darou Kayel, and it records his caliphate of the Mourides since January 2018, succeeding Sidy Mokhtar Mbacké, and his public interventions of 2022–2024."
