reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. The article is internally split on his birth: its lead gives 11 July 1932 (the value Wikidata also carries), while its biography section gives 1933 at Darou Kayel near Mboul, in the rural community of Keur Moussa, citing mourides.info; the English article gives 1930. It gives him as son of Serigne Mouhamadou Bassirou Mbacké and grandson of Ahmadou Bamba, khalifa-general of the Mourides since January 2018, succeeding Serigne Sidy Mokhtar Mbacké, and records his August 2023 appeal to Ousmane Sonko to end his hunger strike and his ban on election campaigning at Touba ahead of the 2024 presidential election. The text describes him by office and descent; it makes no statement of his personal initiation or affiliation."
