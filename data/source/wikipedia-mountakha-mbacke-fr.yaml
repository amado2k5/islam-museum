summary:
  ar: "مقالة ويكيبيديا الفرنسية عن سيرين مونتاخا مباكي؛ تُستخدم لوقائع الكيان فقط. تذكر في صدرها ولادته في 11 يوليو 1932 وفي متنها ولادته سنة 1933 في دارو كايل، وخلافته العامة للمريدية منذ يناير 2018 خلفًا لسيدي مختار مباكي، ومواقفه العامة في سنوات 2022–2024."
  en: "French Wikipedia article on Serigne Mountakha Mbacké; used for entity facts only. Its lead gives his birth on 11 July 1932 while its body gives 1933 at Darou Kayel, and it records his caliphate of the Mourides since January 2018, succeeding Sidy Mokhtar Mbacké, and his public interventions of 2022–2024."
  es: "Artículo de la Wikipedia en francés sobre Serigne Mountakha Mbacké; utilizado únicamente para datos sobre la persona. Su introducción indica que nació el 11 de julio de 1932, mientras que el cuerpo menciona 1933 en Darou Kayel, y registra su califato de los Mourides desde enero de 2018, sucediendo a Sidy Mokhtar Mbacké, y sus intervenciones públicas entre 2022 y 2024."
  fr: "Article Wikipédia français sur Serigne Mountakha Mbacké; utilisé uniquement pour les informations sur l’entité. Son introduction indique sa naissance le 11 juillet 1932, tandis que son corps mentionne 1933 à Darou Kayel. Il relate son califat des Mourides depuis janvier 2018, succédant à Sidy Mokhtar Mbacké, et ses interventions publiques de 2022 à 2024."
  ur: "Serigne Mountakha Mbacké پر فرانسیسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی برتری 11 جولائی 1932 کو اس کی پیدائش کرتی ہے جبکہ اس کا جسم 1933 کو دارو کیل میں دیتا ہے، اور یہ جنوری 2018 سے موریڈس کی اس کی خلافت کو ریکارڈ کرتا ہے، اس کے بعد سیدی مختار Mbacké، اور اس کی 2022-2024 کی عوامی مداخلتوں کو ریکارڈ کرتا ہے۔"
