reliability_note: "Read in full on 4 November 2026. The lead calls him in prose 'un prédicateur Soufi malien' (a Malian Sufi preacher) and dates his creation of the Ançar Dine movement to 1993 — where the English article gives 1991; both readings are preserved in the record. The biography gives his birth on 12 May 1955 at Tamani in the Ségou region (the infobox gives 11 May 1955 — both readings preserved), religious studies at Saad Touré's establishment and then under the marabout Bama Worofana, preaching in Côte d'Ivoire about 1979–1980, suspension by the government of Moussa Traoré in 1986 (officially lifted in 1998), the High Islamic Council vice-presidency from its creation in 2002 (citing Libération), the presidency of the Groupement des leaders spirituels musulmans du Mali from late 2011 (citing Le Monde) and the Council presidency from 21 April 2019 (citing Jeune Afrique). No revision id is recorded (endpoint unreachable in this session); the access date stands in its place."
