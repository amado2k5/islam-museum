summary:
  ar: "مقالة ويكيبيديا الفرنسية عن الشريف عثمان مدني حيدرة؛ تصفه في متنها بأنه «داعية صوفي مالي»، وتذكر سيرته: مولده في تاماني سنة 1955، ودراسته، ووقفه عن الدعوة سنة 1986، ونائب رئاسة المجلس الإسلامي الأعلى منذ 2002 ثم رئاسته منذ 21 أبريل 2019."
  en: "French Wikipedia article on Chérif Ousmane Madani Haïdara; its lead calls him in prose a Malian Sufi preacher, and its biography gives his birth at Tamani in 1955, his studies, his 1986 suspension from preaching, the High Islamic Council vice-presidency from 2002 and the presidency from 21 April 2019."
  es: "Artículo de la Wikipedia en francés sobre Chérif Ousmane Madani Haïdara; en su introducción lo describe en prosa como un predicador sufí maliense, y su biografía menciona su nacimiento en Tamani en 1955, sus estudios, su suspensión de la predicación en 1986, la vicepresidencia del Alto Consejo Islámico desde 2002 y la presidencia desde el 21 de abril de 2019."
  fr: "Article de Wikipédia en français sur Chérif Ousmane Madani Haïdara; son introduction le décrit en prose comme un prédicateur soufi malien, et sa biographie retrace sa naissance à Tamani en 1955, ses études, sa suspension de ses fonctions de prédicateur en 1986, sa vice-présidence du Haut Conseil islamique à partir de 2002 et sa présidence à partir du 21 avril 2019."
  ur: "فرانسیسی ویکیپیڈیا مضمون شیرف عثمان مدنی حیدرا پر؛ اس کا لیڈ انہیں نثر میں ایک مالیان صوفی مبلغ کہتا ہے، اور ان کی سوانح عمری 1955 میں تمانی میں ان کی پیدائش، ان کی تعلیم، 1986 میں تبلیغ سے معطل، 2002 سے اعلی اسلامی کونسل کی نائب صدارت اور 21 اپریل 2019 سے صدارت کا عہدہ دیتی ہے۔"
