  ar: "مقالة ويكيبيديا العربية عن بير سيد جماعة علي شاه (1834–1951)؛ وهي ترجمة للمقالة الإنجليزية، تصفه بأنه عالم وولي صوفي من الطريقة النقشبندية ترأس مؤتمر عموم الهند السني وقاد حركة مسجد الشهيد غنج وحركة باكستان، وتوفي في علي بور بناروال حيث ضريحه."
  en: "The Arabic Wikipedia article on Pir Syed Jamaat Ali Shah (1834–1951); it is a translation of the English article, describing him as a scholar and Sufi saint of the Naqshbandi order who presided over the All India Sunni Conference and led the Shaheed Ganj Mosque movement and the Pakistan Movement, dying at Alipur, Narowal, where his tomb stands."
