summary:
  ar: "المقال العربي بعنوان «غلام مرتضى سيد»: سيرته من مؤتمر الخلافة في سنّ 1920 إلى رئاسة رابطة السند الإسلامية 1943 وانشقاقه عنها وتأسيسه حركات الجيئي سندھ، مع قائمة كتبه."
  en: "The Arabic article 'Ghulam Murtaza Syed': his biography from the 1920 Khilafat conference at Sann to the Sindh Muslim League presidency of 1943, his break with the League and the Jeay Sindh movements, with a list of his books."
  es: "El artículo en árabe titulado \"Ghulam Murtaza Syed\": su biografía desde la conferencia del Califato de Sann en 1920 hasta la presidencia de la Liga Musulmana de Sindh en 1943, su ruptura con la Liga y los movimientos Jeay Sindh, con una lista de sus libros."
  fr: "L'article arabe « Ghulam Murtaza Syed »: sa biographie depuis la conférence Khilafat de 1920 à Sann jusqu'à la présidence de la Ligue musulmane du Sindh en 1943, sa rupture avec la Ligue et les mouvements Jeay Sindh, avec une liste de ses livres."
  ur: "عربی مضمون 'غلام مرتضیٰ سید': ان کی سوانح عمری سن 1920 کی خلافت کانفرنس سے لے کر 1943 کی سندھ مسلم لیگ کی صدارت تک، ان کی لیگ سے علیحدگی اور جئے سندھ تحریک، ان کی کتابوں کی فہرست کے ساتھ۔"
  tr: "\"Ghulam Murtada Sayyid\" başlıklı Arapça makale: 1920'deki Halifelik Konferansından 1943'te İslami Sindh Birliği başkanlığına kadar olan biyografisi, ondan ayrılışı ve Sindh'teki Ji'i hareketlerinin kuruluşu ile birlikte kitap listesi."
  id: "Artikel berbahasa Arab berjudul \"Ghulam Murtada Sayyid\": Biografinya dari Konferensi Khalifah tahun 1920 hingga kepresidenan Liga Sindh Islam pada tahun 1943, perpisahannya dari Liga tersebut, dan pendirian gerakan Ji'i di Sindh, beserta daftar bukunya."
