summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ألبوم «Night Song» لنصرت فتح علي خان ومايكل بروك (1996)؛ لوقائع الكيان فقط: التسجيل في ريل وورلد سنة 1995، وطريقة الإنتاج، والموسيقيون، والاستقبال، والمرتبة في بيلبورد والقائمة البريطانية، وترشيح غرامي سنة 1997؛ تستند إلى ساوند أون ساوند وبيلبورد ولوس أنجلوس تايمز وموجو."
  en: "English Wikipedia article on the album Night Song by Nusrat Fateh Ali Khan and Michael Brook (1996); entity facts only: its 1995 recording at Real World, the production method, the musicians, the reception, the Billboard and UK peaks and the 1997 Grammy nomination; it cites Sound on Sound, Billboard, the Los Angeles Times and Mojo."
  es: "Artículo de la Wikipedia en inglés sobre el álbum Night Song de Nusrat Fateh Ali Khan y Michael Brook (1996); solo datos sobre la entidad: su grabación en 1995 en Real World, el método de producción, los músicos, la recepción, los puestos más altos en Billboard y el Reino Unido y la nominación al Grammy de 1997; cita a Sound on Sound, Billboard, Los Angeles Times y Mojo."
  fr: "Article de Wikipédia en anglais sur l'album Night Song de Nusrat Fateh Ali Khan et Michael Brook (1996); informations uniquement sur l'album: son enregistrement en 1995 au Real World, la méthode de production, les musiciens, l'accueil, les sommets des classements Billboard et britanniques et la nomination aux Grammy Awards de 1997; il cite Sound on Sound, Billboard, le Los Angeles Times et Mojo."
  ur: "نصرت فتح علی خان اور مائیکل بروک (1996) کے البم نائٹ سونگ پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق: حقیقی دنیا میں اس کی 1995 کی ریکارڈنگ، پروڈکشن کا طریقہ، موسیقار، استقبالیہ، بل بورڈ اور یو کے کی چوٹیوں اور 1997 کی گریمی نامزدگی؛ یہ ساؤنڈ آن ساؤنڈ، بل بورڈ، لاس اینجلس ٹائمز اور موجو کا حوالہ دیتا ہے۔"
  tr: "Nusrat Fateh Ali Khan ve Michael Brook'un \"Night Song\" albümü hakkında İngilizce Wikipedia makalesi (1996); sadece varlık bilgileri için: 1995'te Real World'de kayıt, prodüksiyon yöntemi, müzisyenler, tepki, Billboard ve Birleşik Krallık listelerinde sıralama ve 1997'de Grammy adaylığı; Sound on Sound, Billboard, Los Angeles Times ve Mojo temelinde."
  id: "Artikel Wikipedia bahasa Inggris tentang album \"Night Song\" oleh Nusrat Fateh Ali Khan dan Michael Brook (1996); hanya untuk fakta entitas: rekaman di Real World pada tahun 1995, metode produksi, musisi, resepsi, peringkat di Billboard dan tangga lagu Inggris, serta nominasi Grammy pada tahun 1997; berdasarkan Sound on Sound, Billboard, Los Angeles Times, dan Mojo."
