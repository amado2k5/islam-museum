  ar: "مقالة ويكيبيديا الإنجليزية عن عنايت خان (بهجاء Enayat)؛ تُستخدم لوقائع الكيان فقط. تذكر أنه عازف سيتار وسربهار وُلد سنة 1894 في المقاطعات الشمالية الغربية لأسرة موسيقية، ابن إمداد خان ووالد ولايت خان وإمرات خان، استقر في كلكتا وتوفي فيها سنة 1938 عن 43 عاما. لا تذكر المقالة شيئا عن دينه."
  en: "English Wikipedia article on Enayat Khan; used for entity facts only. It gives the sitar and surbahar player born in 1894 in the North-Western Provinces to a family of musicians, son of Imdad Khan and father of Vilayat Khan and Imrat Khan, settled at Calcutta and died there in 1938 aged 43. It makes no statement about his religion."
