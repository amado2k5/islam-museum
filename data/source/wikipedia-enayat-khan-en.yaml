summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عنايت خان ⁦(بهجاء Enayat)⁩؛ تُستخدم لوقائع الكيان فقط. تذكر أنه عازف سيتار وسربهار وُلد سنة 1894 في المقاطعات الشمالية الغربية لأسرة موسيقية، ابن إمداد خان ووالد ولايت خان وإمرات خان، استقر في كلكتا وتوفي فيها سنة 1938 عن 43 عاما. لا تذكر المقالة شيئا عن دينه."
  en: "English Wikipedia article on Enayat Khan; used for entity facts only. It gives the sitar and surbahar player born in 1894 in the North-Western Provinces to a family of musicians, son of Imdad Khan and father of Vilayat Khan and Imrat Khan, settled at Calcutta and died there in 1938 aged 43. It makes no statement about his religion."
  es: "Artículo de la Wikipedia en inglés sobre Enayat Khan; utilizado únicamente para datos sobre la persona. Indica que el intérprete de sitar y surbahar nació en 1894 en las Provincias Noroccidentales en el seno de una familia de músicos, hijo de Imdad Khan y padre de Vilayat Khan e Imrat Khan, se estableció en Calcuta y falleció allí en 1938 a los 43 años. No se menciona su religión."
  fr: "L'article de Wikipédia en anglais sur Enayat Khan, utilisé uniquement pour des informations biographiques, indique qu'il s'agissait d'un joueur de sitar et de surbahar né en 1894 dans les Provinces du Nord-Ouest, au sein d'une famille de musiciens. Fils d'Imdad Khan et père de Vilayat Khan et d'Imrat Khan, il s'installa à Calcutta où il mourut en 1938 à l'âge de 43 ans. L'article ne mentionne pas sa religion."
