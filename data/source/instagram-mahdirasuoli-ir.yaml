summary:
  ar: "صفحة إنستغرام ثانية تحمل اسم مهدي رسولي (@mahdirasuoli.ir) من نوع حساب أعمال؛ أظهر ملفها عند قراءته في 7 نوفمبر 2026 عدد 731,107 متابعين و13 حسابًا تتابعها، وتربط إلى قناة تيليغرام."
  en: "A second Instagram page in Mahdi Rasouli's name (@mahdirasuoli.ir), a business account; its profile, read on 7 November 2026, showed 731,107 followers and 13 following, linking out to a Telegram channel."
  es: "Una segunda página de Instagram a nombre de Mahdi Rasouli (@mahdirasuoli.ir), una cuenta comercial; su perfil, consultado el 7 de noviembre de 2026, mostraba 731.107 seguidores y 13 seguidos, con un enlace a un canal de Telegram."
  fr: "Une deuxième page Instagram au nom de Mahdi Rasouli (@mahdirasuoli.ir), un compte professionnel; son profil, consulté le 7 novembre 2026, affichait 731 107 abonnés et 13 abonnements, renvoyant vers une chaîne Telegram."
  ur: "مہدی رسولی کے نام کا دوسرا انسٹاگرام صفحہ (@mahdirasuoli.ir)، ایک کاروباری اکاؤنٹ؛ اس کی پروفائل، جو 7 نومبر 2026 کو پڑھی گئی تھی، نے ٹیلیگرام چینل سے منسلک ہوتے ہوئے 731,107 فالوورز اور 13 فالوورز کو دکھایا۔"
  tr: "Mehdi Rasouli (@mahdirasuoli.ir) adlı ikinci bir Instagram sayfası ise bir iş hesabıdır; 7 Kasım 2026'da görüntülendiğinde dosyasında 731.107 takipçi ve takip ettiği 13 hesap bulunmakta olup, bir Telegram kanalına bağlantı vermektedir."
  id: "Halaman Instagram kedua bernama Mehdi Rasouli (@mahdirasuoli.ir) adalah akun bisnis; saat dilihat pada 7 November 2026, filenya memiliki 731.107 pengikut dan 13 akun yang diikuti, terhubung ke saluran Telegram."
