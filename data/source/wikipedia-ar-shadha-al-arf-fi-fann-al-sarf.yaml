  en: "The page «شذا العرف في فن الصرف» — Wikipedia (Arabic); summarised in a research file supplied to the museum by the founder on 21 November 2026; the museum did not open the page, and the founder approved using the summary without re-verification. Used for: the book «Shadha al-Arf fi Fann al-Sarf»: its author and date."
  ur: "صفحہ «شذا العرف في فن الصرف» — Wikipedia (Arabic)؛ اسے ایک تحقیقی فائل نے خلاصہ کیا جو بانی نے 21 نومبر 2026 کو میوزیم کو دی؛ میوزیم نے صفحہ نہیں کھولا اور بانی نے دوبارہ جانچ کے بغیر خلاصہ استعمال کرنے کی منظوری دی۔ استعمال: کتاب «Shadha al-Arf fi Fann al-Sarf»، اس کے مصنف اور تاریخ کا بیان۔"
