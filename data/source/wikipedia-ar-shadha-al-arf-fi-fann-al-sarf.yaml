  es: "La página «شذا العرف في فن الصرف» — Wikipedia (Arabic); resumida en un archivo de investigación entregado al museo por el fundador el 21 de noviembre de 2026; el museo no abrió la página, y el fundador aprobó usar el resumen sin volver a verificar. Usada para: el libro «Shadha al-Arf fi Fann al-Sarf»: su autor y su fecha."
  tr: "\"Shadha al-Arf fi Fann al-Sarf\" sayfası — Wikipedia (Arapça); kurucusunun 21 Kasım 2026'da müzeye sunduğu bir araştırma özetiyle özetlenmiştir; müze sayfayı açmamış ve kurucu özetin yeniden doğrulama yapılmadan kullanılmasını kabul etmiştir. Kullanıldığı alanlar: \"Shadha al-Arf fi Fann al-Sarf\" adlı kitap, yazarı ve tarihçesi."
