summary:
  ar: «مقالة ويكيبيديا الإنجليزية «Na'ima B. Robert» ⁦(رُوجعت في 26 أكتوبر 2026)⁩. المصدر لميلادها في ليدز ونشأتها في زيمبابوي ودراستها في جامعة لندن واعتناقها الإسلام سنة 1998 ومذكراتها وكتبها المصورة ورواياتها للشباب وتأسيسها تحرير مجلة «SISTERS».»
  en: "The English Wikipedia article 'Na'ima B. Robert' (revision consulted 26 October 2026). The source for her Leeds birth, Zimbabwe upbringing, University of London degree, 1998 conversion, her memoir, picture books and young-adult novels, and her founding editorship of SISTERS Magazine."
  ur: «انگریزی ویکیپیڈیا کا مضمون «Na'ima B. Robert» ⁦(26 اکتوبر 2026 کو رجوع کیا گیا)⁩۔»
  es: "El artículo de la Wikipedia en inglés «Na'ima B. Robert» (revisión consultada el 26 de octubre de 2026). Fuente de información sobre su nacimiento en Leeds, su crianza en Zimbabue, su título universitario en la Universidad de Londres, su conversión al islam en 1998, sus memorias, sus libros ilustrados y sus novelas para jóvenes, así como su labor como editora fundadora de la revista SISTERS."
  fr: "L'article Wikipédia en anglais « Na'ima B. Robert » (révision consultée le 26 octobre 2026). Source des informations concernant sa naissance à Leeds, son enfance au Zimbabwe, son diplôme de l'Université de Londres, sa conversion en 1998, ses mémoires, ses albums illustrés et ses romans pour jeunes adultes, ainsi que son rôle de rédactrice fondatrice du magazine SISTERS."
