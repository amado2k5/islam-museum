  ar: «مقالة ويكيبيديا الإنجليزية «Na'ima B. Robert» (رُوجعت في 26 أكتوبر 2026). المصدر لميلادها في ليدز ونشأتها في زيمبابوي ودراستها في جامعة لندن واعتناقها الإسلام سنة 1998 ومذكراتها وكتبها المصورة ورواياتها للشباب وتأسيسها تحرير مجلة «SISTERS».»
  en: "The English Wikipedia article 'Na'ima B. Robert' (revision consulted 26 October 2026). The source for her Leeds birth, Zimbabwe upbringing, University of London degree, 1998 conversion, her memoir, picture books and young-adult novels, and her founding editorship of SISTERS Magazine."
