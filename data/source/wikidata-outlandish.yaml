  ar: "عنصر ويكي بيانات Q586885 لفرقة آوتلانديش: فرقة هيب هوب، تأسست سنة 1997، وأعضاؤها الثلاثة، وجائزة إم تي في أوروبا لأفضل فنان دنماركي، وروابط المقالات باثنتين وعشرين لغة."
  en: "Wikidata item Q586885 for Outlandish: a hip-hop group founded in 1997, its three members, the MTV Europe Music Award for Best Danish Act, and sitelinks in twenty-two languages."
