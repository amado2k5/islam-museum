  ur: "وکی ڈیٹا آئٹم Q586885 آؤٹ لینڈیش کے لیے: 1997 میں قائم ایک ہپ ہاپ گروپ، اس کے تین اراکین، بہترین ڈینش ایکٹ کے لیے MTV یورپ میوزک ایوارڈ، اور بائیس زبانوں میں سائٹ لنکس۔"
  tr: "Wikidata maddesi Q586885 Outlandish: 1997'de kurulan, üç üyesi, MTV Europe En İyi Danimarkalı Sanatçı Ödülü ve yirmi iki dilde makale bağlantılarıyla bir hip-hop grubu."
  id: "Item Wikidata Q586885 Outlandish: sebuah grup hip-hop yang didirikan pada tahun 1997, dengan tiga anggota, MTV Europe Award untuk Artis Denmark Terbaik, dan tautan artikel dalam dua puluh dua bahasa."
