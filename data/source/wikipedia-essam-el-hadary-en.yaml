  ar: "مقالة ويكيبيديا الإنجليزية عن عصام الحضري؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته مع دمياط والأهلي وسيون والإسماعيلي والزمالك والمريخ وغيرها، و159 مباراة دولية مع مصر، ورقمه القياسي بوصفه أكبر لاعب شارك في مباراة بكأس العالم ⁦(روسيا 2018)⁩. لا تذكر المقالة دينه في أي موضع."
  en: "English Wikipedia article on Essam El Hadary; used for entity facts only. It recounts his career at Damietta, Al Ahly, Sion, Ismaily, Zamalek, Al-Merreikh and other clubs, his 159 Egypt caps, and his record as the oldest player ever to appear in a World Cup match (Russia 2018). It makes no mention of his religion anywhere."
  es: "Artículo de la Wikipedia en inglés sobre Essam El Hadary; utilizado únicamente para obtener información sobre la persona. Narra su trayectoria en Damietta, Al Ahly, Sion, Ismaily, Zamalek, Al-Merreikh y otros clubes, sus 159 partidos con la selección egipcia y su récord como el jugador de mayor edad en participar en un partido de la Copa del Mundo (Rusia 2018). No menciona su religión en ningún momento."
  fr: "Article Wikipédia en anglais sur Essam El Hadary; utilisé uniquement à des fins d'information. Il retrace sa carrière à Damiette, Al Ahly, Sion, Ismaily, Zamalek, Al-Merreikh et dans d'autres clubs, ses 159 sélections en équipe nationale d'Égypte et son record du joueur le plus âgé à avoir disputé un match de Coupe du monde (Russie 2018). Sa religion n'y est pas mentionnée."
  ur: "انگریزی ویکیپیڈیا مضمون عصام الہدری پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں دمیٹا، الاحلی، سیون، اسماعیلی، زمالک، المریخ اور دیگر کلبوں میں ان کے کیریئر، ان کی 159 مصری کیپس، اور ورلڈ کپ میچ ⁦(روس 2018)⁩ میں نظر آنے والے اب تک کے سب سے زیادہ عمر کے کھلاڑی کے طور پر ان کا ریکارڈ بیان کیا گیا ہے۔ اس میں ان کے مذہب کا کہیں ذکر نہیں ہے۔"
