  ar: "مقالة ويكيبيديا الإنجليزية عن سامية صلوحي حسن؛ تُستخدم لوقائع الكيان فقط. تروي ولادتها في مكوندوتشي بزنجبار سنة 1960 ووزارتها في زنجبار ونائبيتها لرئيس تنزانيا (2015–2021) ثم رئاستها البلاد منذ 19 مارس 2021 إثر وفاة ماغوفولي، حتى انتخابات 2025 وما أثير حولها. لا يذكر نصها دينها؛ وتصنيفاتها تضعها في «مسلمون تنزانيون»."
  en: "English Wikipedia article on Samia Suluhu Hassan; used for entity facts only. It recounts her birth at Makunduchi, Zanzibar, in 1960, her Zanzibar ministries, her vice-presidency of Tanzania (2015–2021) and her presidency since 19 March 2021 on Magufuli’s death, through the contested 2025 election. Its text does not state her religion; its categories file her under Tanzanian Muslims."
