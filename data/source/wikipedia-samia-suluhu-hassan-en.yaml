summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سامية صلوحي حسن؛ تُستخدم لوقائع الكيان فقط. تروي ولادتها في مكوندوتشي بزنجبار سنة 1960 ووزارتها في زنجبار ونائبيتها لرئيس تنزانيا (2015–2021) ثم رئاستها البلاد منذ 19 مارس 2021 إثر وفاة ماغوفولي، حتى انتخابات 2025 وما أثير حولها. لا يذكر نصها دينها؛ وتصنيفاتها تضعها في «مسلمون تنزانيون»."
  en: "English Wikipedia article on Samia Suluhu Hassan; used for entity facts only. It recounts her birth at Makunduchi, Zanzibar, in 1960, her Zanzibar ministries, her vice-presidency of Tanzania (2015–2021) and her presidency since 19 March 2021 on Magufuli’s death, through the contested 2025 election. Its text does not state her religion; its categories file her under Tanzanian Muslims."
  es: "Artículo de la Wikipedia en inglés sobre Samia Suluhu Hassan; utilizado únicamente para datos biográficos. Relata su nacimiento en Makunduchi, Zanzíbar, en 1960, sus ministerios en Zanzíbar, su vicepresidencia de Tanzania (2015-2021) y su presidencia desde el 19 de marzo de 2021, tras la muerte de Magufuli, hasta las controvertidas elecciones de 2025. El texto no especifica su religión; la clasifica dentro de la categoría de musulmana tanzana."
  fr: "Article de Wikipédia en anglais sur Samia Suluhu Hassan; utilisé uniquement à des fins d'information sur l'entité. Il relate sa naissance à Makunduchi, à Zanzibar, en 1960, ses ministères à Zanzibar, sa vice-présidence de la Tanzanie (2015-2021) et sa présidence depuis le décès de Magufuli le 19 mars 2021, jusqu'à l'élection contestée de 2025. Le texte ne mentionne pas sa religion; ses catégories la classent dans la catégorie « Musulmane tanzanienne »."
  ur: "سامعہ سلوہ حسن پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1960 میں زنجبار کے مکندوچی میں اس کی پیدائش، اس کی زنجبار کی وزارتیں، اس کی تنزانیہ کی نائب صدارت (2015–2021) اور 19 مارچ 2021 سے اس کی صدارت میگوفولی کی موت پر، 2025 کے انتخابات کے ذریعے بتائی گئی ہے۔ اس کے متن میں اس کا مذہب نہیں بتایا گیا ہے۔ اس کے زمرے اسے تنزانیہ کے مسلمانوں کے تحت فائل کرتے ہیں۔"
  tr: "Samia Salouhi Hassan hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1960'ta Mkunduchi, Zanzibar'da doğduğunu, Zanzibar'daki bakanlığını, Tanzanya Cumhurbaşkanı Yardımcılığı görevini (2015–2021) ve ardından 19 Mart 2021'den Magufuli'nin ölümünden sonra 2025 seçimleri ve çevresindeki konulara kadar ülke başkanlığını anlatır. Metninde dininden bahsedilmez; sınıflandırmaları onu \"Tanzanyalı Müslümanlar\" olarak sınıflandırır."
  id: "Artikel Wikipedia bahasa Inggris tentang Samia Salouhi Hassan; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya di Mkunduchi, Zanzibar pada tahun 1960, pelayanannya di Zanzibar, perannya sebagai Wakil Presiden Tanzania (2015–2021), dan kemudian masa kepresidenannya dari 19 Maret 2021, setelah kematian Magufuli, hingga pemilihan 2025 dan isu-isu tersekeliling. Teksnya tidak menyebutkan agamanya; klasifikasinya menempatkannya di bawah \"Muslim Tanzania.\""
