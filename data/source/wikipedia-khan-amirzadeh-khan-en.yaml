summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن خان أميرزاده خان (1918–1977)؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في بخښالي بقضاء مردان في 15 نوفمبر 1918، ودراسته القانون في عليكره وعمله محاميا، وعضويته في حركة خداي خدمتغار ثم قيادته حزب العوامي الوطني، وفوزه في انتخابات 1970، وتولّيه وزارة القانون والتعليم في إقليم الحدود، ودوره في لجنة دستور 1973 وترشّحه للمعارضة في الانتخابات الرئاسية تلك السنة، واعتقالاته في قضية مؤامرة حيدرآباد، ووفاته في 13 سبتمبر 1977."
  en: "English Wikipedia article on Khan Amirzadah Khan (1918–1977); used for entity facts only. It recounts his birth at Bakhshali in Mardan district on 15 November 1918, his law studies at Aligarh and practice as a lawyer, his membership of the Khudai Khidmatgar movement and leadership of the National Awami Party, his victories in the 1970 elections, his provincial ministries of law, education and parliamentary affairs, his work on the 1973 constitutional committee and his candidacy as the combined opposition's nominee in that year's presidential election, his arrests in the Hyderabad conspiracy case, and his death on 13 September 1977."
  es: "Artículo de la Wikipedia en inglés sobre Khan Amirzadah Khan (1918-1977); utilizado únicamente para datos sobre la persona. Relata su nacimiento en Bakhshali, en el distrito de Mardan, el 15 de noviembre de 1918, sus estudios de derecho en Aligarh y su ejercicio como abogado, su pertenencia al movimiento Khudai Khidmatgar y su liderazgo en el Partido Nacional Awami, sus victorias en las elecciones de 1970, sus ministerios provinciales de derecho, educación y asuntos parlamentarios, su trabajo en el comité constitucional de 1973 y su candidatura como nominado de la oposición unida en las elecciones presidenciales de ese año, sus arrestos en el caso de la conspiración de Hyderabad y su muerte el 13 de septiembre de 1977."
  fr: "Article de Wikipédia en anglais sur Khan Amirzadah Khan (1918-1977); utilisé uniquement pour les informations biographiques. Il relate sa naissance à Bakhshali, dans le district de Mardan, le 15 novembre 1918, ses études de droit à Aligarh et son exercice de la profession d’avocat, son appartenance au mouvement Khudai Khidmatgar et son rôle de dirigeant du Parti national Awami, ses victoires aux élections de 1970, ses fonctions de ministres provinciaux de la Justice, de l’Éducation et des Affaires parlementaires, son travail au sein du comité constitutionnel de 1973 et sa candidature comme candidat de l’opposition unie à l’élection présidentielle de la même année, ses arrestations dans le cadre de l’affaire de la conspiration d’Hyderabad et sa mort le 13 septembre 1977."
  ur: "خان امیرزادہ خان (1918-1977) پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 15 نومبر 1918 کو مردان ضلع کے بخشالی میں ان کی پیدائش، علی گڑھ میں قانون کی تعلیم حاصل کی اور بطور وکیل پریکٹس، خدائی خدمتگار تحریک کی ان کی رکنیت اور نیشنل عوامی پارٹی کی قیادت، 1970 کے انتخابات میں ان کی کامیابیوں، ان کی صوبائی وزارتیں، قانون، تعلیم اور پارلیمانی امور، آئینی کمیٹی کے طور پر ان کے کام کرنے کا ذکر ہے۔ اس سال کے صدارتی انتخابات میں اپوزیشن کے مشترکہ امیدوار، حیدرآباد سازش کیس میں ان کی گرفتاریاں، اور 13 ستمبر 1977 کو ان کی موت۔"
  tr: "Han Amirzada Han (1918–1977) hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 15 Kasım 1918'de Mardan ilçesinin Bakhshali kentinde doğmasını, Alikra'da hukuk eğitimini, avukatlık çalışmalarını, Khudai Khidmatgar hareketine üyeliğini ve ardından Ulusal Halk Partisi liderliğini, 1970 seçimlerindeki zaferini, Khodro Eyaleti Hukuk ve Eğitim Bakanı olarak atanmasını, 1973 Anayasa Komitesi'ndeki rolünü, o yılki cumhurbaşkanlığı seçimlerinde muhalefette adaylığını, Haydarabad komplo davasında tutuklanmasını ve 13 Eylül 1977'deki ölümünü anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Khan Amirzada Khan (1918–1977); hanya digunakan untuk fakta entitas. Artikel ini menceritakan kelahirannya di Bakhshali, distrik Mardan pada 15 November 1918, studi hukumnya di Alikra, pekerjaannya sebagai pengacara, keanggotaannya dalam gerakan Khudai Khidmatgar dan kemudian kepemimpinannya di Partai Rakyat Nasional, kemenangannya dalam pemilihan tahun 1970, pengangkatannya sebagai Menteri Hukum dan Pendidikan di Provinsi Khodro, perannya dalam Komite Konstitusi 1973, pencalonannya di oposisi dalam pemilihan presiden tahun itu, penangkapannya dalam kasus konspirasi Hyderabad, serta kematiannya pada 13 September 1977."
