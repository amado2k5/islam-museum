reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 by its recorded revision id via the MediaWiki API, the returned id asserted equal before any claim was drawn. The article is an autobiography-tagged biography (September 2011) resting partly on family and social-media material, and it repeats some sections verbatim; its hard facts are corroborated where it matters by the contemporary record it cites (the 1973 presidential vote is carried by the New York Times of 11 August 1973). It has no religion field and never raises his religion. It gives his death at Mardan on 13 September 1977, where Wikidata gives 9 January 1977; the article's value is carried, marked debated."
