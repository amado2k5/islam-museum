summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن خان أميرزاده خان (1918–1977)؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في بخښالي بقضاء مردان في 15 نوفمبر 1918، ودراسته القانون في عليكره وعمله محاميا، وعضويته في حركة خداي خدمتغار ثم قيادته حزب العوامي الوطني، وفوزه في انتخابات 1970، وتولّيه وزارة القانون والتعليم في إقليم الحدود، ودوره في لجنة دستور 1973 وترشّحه للمعارضة في الانتخابات الرئاسية تلك السنة، واعتقالاته في قضية مؤامرة حيدرآباد، ووفاته في 13 سبتمبر 1977."
  en: "English Wikipedia article on Khan Amirzadah Khan (1918–1977); used for entity facts only. It recounts his birth at Bakhshali in Mardan district on 15 November 1918, his law studies at Aligarh and practice as a lawyer, his membership of the Khudai Khidmatgar movement and leadership of the National Awami Party, his victories in the 1970 elections, his provincial ministries of law, education and parliamentary affairs, his work on the 1973 constitutional committee and his candidacy as the combined opposition's nominee in that year's presidential election, his arrests in the Hyderabad conspiracy case, and his death on 13 September 1977."
