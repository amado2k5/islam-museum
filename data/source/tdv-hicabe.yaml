summary:
  ar: "مدخل «حجابة» في موسوعة TDV الإسلامية: حفظ باب الكعبة ومفاتيحها وفتحها لزوّارها في الأوقات، والفرق بينها وبين السِّدانة التي تعمّ خدمة البيت كله؛ وأصحابها سادن أو حاجب بنسبة حجبي، وانتقالها من جرهم إلى خزاعة إلى قصيّ فعبد الدار، وتسليم النبي المفتاح لعثمان بن طلحة وشيبة بن عثمان يوم الفتح، وبقاء الوظيفة في بني شيبة حتى اليوم."
  en: "The TDV İslâm Ansiklopedisi entry on the hicâbe: the keeping of the Ka'ba's door and keys and its opening to visitors at set times, distinguished from the wider sidâne covering all service of the House; its holders called sâdin or hâcib with the nisba hacebî; its descent from Jurhum to Huzâ'a to Qusayy and the Abd al-Dar line; the Prophet handing the key to Uthman ibn Talha and Shayba ibn Uthman at the conquest; and the office remaining in the Banu Shayba to this day."
  es: "La entrada de TDV İslâm Ansiklopedisi sobre el hicâbe: la custodia de la puerta y las llaves de la Kaaba y su apertura a los visitantes en horarios establecidos, a diferencia del sidâne más amplio que abarca todos los servicios de la Casa; sus titulares llamados sâdin o hâcib con el nisba hacebî; su descendencia de Jurhum a Huzâ'a a Qusayy y la línea Abd al-Dar; el Profeta entregando la llave a Uthman ibn Talha y Shayba ibn Uthman en la conquista; y el cargo que permanece en los Banu Shayba hasta el día de hoy."
  fr: "L'entrée du TDV İslâm Ansiklopedisi sur le hicâbe: la garde de la porte et des clés de la Kaaba et son ouverture aux visiteurs à des heures fixes, distinguée du sidâne plus large couvrant tout service de la Maison; ses détenteurs appelés sâdin ou hâcib avec la nisba hacebî; sa descente de Jurhum à Huzâ'a à Qusayy et à la lignée d'Abd al-Dar; le Prophète remettant la clé à Uthman ibn Talha et Shayba ibn Uthman lors de la conquête; et le maintien de cette fonction dans la famille des Banu Shayba jusqu'à nos jours."
