reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision, fetched by revision id and the returned revision asserted equal. The lead cites the K-1 fighter profile for his birth date and describes him as a Dutch, European and World Muay Thai champion, K-1 World GP 2008 in Hawaii champion and former Glory Light Heavyweight Champion who also competed in the UFC's light heavyweight division. The early-life text says he was born and raised in Schiedam, his parents Turkish immigrants from Kars, and that he began kickboxing at ten. The career text records his inaugural Glory Light Heavyweight Championship at Glory 15 in Istanbul on 12 April 2014 and his UFC debut win and loss in 2017-2018. The article's text makes no statement of his religion; it files him only in the category Dutch Muslims, which is a filing, not attestation."
