summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن غوكهان ساكي؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في سخيدام في 18 أكتوبر 1983 لأبوين تركيين من قارص، وبطولته كي-وان في هاواي 2008، ولقب غلوري لخفيف الثقيل 2014، ونزاليه في UFC. ولا تذكر ديانته في متنها."
  en: "English Wikipedia article on Gökhan Saki; used for entity facts only. It gives his birth in Schiedam on 18 October 1983 to Turkish parents from Kars, his K-1 World Grand Prix 2008 win in Hawaii, his 2014 Glory Light Heavyweight Championship, and his two UFC fights. It makes no statement of his religion in its text."
  es: "Artículo de la Wikipedia en inglés sobre Gökhan Saki; utilizado únicamente para datos biográficos. Indica que nació en Schiedam el 18 de octubre de 1983, hijo de padres turcos originarios de Kars, su victoria en el K-1 World Grand Prix 2008 en Hawái, su título de Campeón de Peso Semipesado de Glory en 2014 y sus dos peleas en la UFC. No menciona su religión en el texto."
  fr: "Article Wikipédia en anglais sur Gökhan Saki; utilisé uniquement pour les informations le concernant. Il mentionne sa naissance à Schiedam le 18 octobre 1983 de parents turcs originaires de Kars, sa victoire au K-1 World Grand Prix 2008 à Hawaï, son titre de champion des poids mi-lourds du Glory en 2014 et ses deux combats à l'UFC. Sa religion n'est pas précisée."
  ur: "گوخان ساکی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اسکیڈم میں 18 اکتوبر 1983 کو کارس سے ترک والدین کے ہاں، ہوائی میں اس کی K-1 ورلڈ گراں پری 2008 کی جیت، اس کی 2014 کی گلوری لائٹ ہیوی ویٹ چیمپئن شپ، اور اس کی دو UFC لڑائیوں میں جنم لیتی ہے۔ اس کے متن میں اس کے مذہب کا کوئی بیان نہیں ہے۔"
  tr: "Gokhan Saki hakkında İngilizce Wikipedia makalesi; sadece varlık bilgileri için kullanılmıştır. 18 Ekim 1983'te Skhedam'da Karslı Türk ebeveynlerin çocuğu olarak doğdu, 2008'de Hawaii şampiyonluğunu, 2014'te Glory ağır siklet unvanını kazandı ve UFC rekabetini yaşadı. Metinde dini belirtilmemiştir."
  id: "Artikel Wikipedia bahasa Inggris tentang Gokhan Saki; digunakan hanya untuk fakta entitas. Ia lahir di Skhedam pada 18 Oktober 1983, dari orang tua Turki dari Kars, gelar juara di Hawaii tahun 2008, gelar kelas berat Glory pada tahun 2014, dan rivalitas UFC-nya. Agamanya tidak disebutkan dalam teks."
