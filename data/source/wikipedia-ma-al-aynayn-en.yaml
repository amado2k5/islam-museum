reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It gives: born Muhammad al-Mustafa — 'c. 10 February 1830' in the lead, in the Hawdh region of present-day Mauritania (the Arabic article states that 'Muhammad al-Mustafa' is a common error and that his name was Sidi al-Mustafa, after his father's own shaykh Sidi al-Mustafa ibn Uthman — the record carries the Arabic article's correction and the common form as a variant); twelfth of 48 brothers, son of Muhammad Fadil, 'founder of the Fadiliyya, a Qadiriyya Sufi brotherhood'; singled out to study in Fes, teacher from 16; Hajj in 1858, meeting the heir Muhammad ibn Abd al-Rahman at Marrakesh and Sultan Abd al-Rahman at Meknes; on his return in 1861 'his father gave him a turban and the title of Shaykh' — the investiture on which, with the Arabic and French articles, the record's sufi segment rests: his own sheikhdom at the head of the Fadili branch, not descent alone; moved about 1870 to the Saqiyat al-Hamra, founded the zawiya Dar al-Hamra' (1871–72); from 1873 regular visits to Marrakesh and Fes; appointed by dahir of Sultan Moulay Hassan I (1879) his representative from the Souss to the Saqiyat al-Hamra and Tarfaya; began the ribat at Smara in 1898 and moved there in 1902; proclaimed jihad against the colonisers in 1904; a member of 'his Gudfiyya brotherhood' (the article's variant spelling of the Fadili line) 'may have' assassinated Xavier Coppolani in 1905 — carried hedged and attributed; backed Abd al-Hafid against Abd al-Aziz (1907); retreated to Tiznit (1908–09); marched north in June 1910 with some 6,000 men and was defeated by General Moinier on 23 June 1910; died at Tiznit on 23 October 1910, his tomb a pilgrimage site; his son El-Hiba, 'known as The Blue Sultan', continued the resistance (the Spanish article's attribution of a Blue Sultan proclamation to the father himself is recorded against this as a conflict); 140 books counted by his biographer Murabbih Rabbuh, 314 by Julio Caro Baroja; his descendants numbered 363 in a 1974 count."
