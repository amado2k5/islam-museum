summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الشيخ ماء العينين (ت. 1910)؛ تُستخدم لوقائع الكيان فقط. تذكر أن أباه محمد فاضل أسس الفاضلية، وهي طريقة صوفية قادرية أخوية، وأنه منح ابنه العمامة ولقب الشيخ بعد حجه، وقاومته للاستعمار الفرنسي والإسباني ووفاته في تزنيت."
  en: "English Wikipedia article on Shaykh Ma al-'Aynayn (d. 1910); used for entity facts only. It records that his father Muhammad Fadil founded the Fadiliyya, a Qadiriyya Sufi brotherhood, and gave his son a turban and the title of Shaykh after his Hajj, and covers his resistance to French and Spanish colonisation and his death at Tiznit."
