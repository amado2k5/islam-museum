summary:
  ar: "صفحة Music Metrics Vault المرآة لصفحة محمد بدر الزمان الفنية على سبوتيفاي؛ تنقل سيرته الفنية: «مغنٍّ وكاتب أغانٍ وملحن ورجل أعمال وعضو في فرقة كالاراب شيلبيغوشتي… مؤسس هولي تيون ورئيسها التنفيذي»، وتعدّد أغانيه الشهيرة."
  en: "Music Metrics Vault's mirror of Muhammad Badruzzaman's Spotify artist page; it carries his artist biography — \"Singer, Songwriter, Music Composer, Entrepreneur and Member Of Bangladeshi Popular Band Kalarab Shilpigosthi… founder and CEO of Holy Tune\" — and lists his popular songs."
  es: "Music Metrics Vault es una réplica de la página de artista de Muhammad Badruzzaman en Spotify; incluye su biografía artística —\"Cantante, compositor, músico, empresario y miembro de la popular banda bangladesí Kalarab Shilpigosthi... fundador y director ejecutivo de Holy Tune\"— y enumera sus canciones más populares."
  fr: "Le miroir de Music Metrics Vault de la page artiste Spotify de Muhammad Badruzzaman; il contient sa biographie d'artiste — « Chanteur, auteur-compositeur, compositeur de musique, entrepreneur et membre du groupe populaire bangladais Kalarab Shilpigosthi… fondateur et PDG de Holy Tune » — et liste ses chansons populaires."
  ur: "میوزک میٹرکس والٹ کا عکس محمد بدرزمان کے اسپاٹائف آرٹسٹ کا صفحہ؛ اس میں ان کی فنکاروں کی سوانح عمری ہے - \"گلوکار، نغمہ نگار، موسیقار، کاروباری اور بنگلہ دیشی پاپولر بینڈ کے رکن کلاراب شلپیگوستی… ہولی ٹیون کے بانی اور سی ای او\" - اور ان کے مقبول گانوں کی فہرست ہے۔"
  tr: "Music Metrics Vault sayfası, Mohamed Badr Al-Zaman'ın Spotify'daki sanat sayfasını yansıtır; sanatsal biyografisi şunları içerir: \"Şarkıcı, söz yazarı, besteci, iş insanı ve Kalararap Shelbigushti grubunun üyesi... Holy Tune'un kurucusu ve CEO'su,\" ve onun çok sayıda ünlü şarkısı."
  id: "Halaman Music Metrics Vault mencerminkan halaman seni Mohamed Badr Al-Zaman di Spotify; biografi artistiknya meliputi: \"Penyanyi, penulis lagu, komposer, pengusaha, dan anggota band Kalararap Shelbigushti... Pendiri dan CEO Holy Tune,\" serta banyak lagu terkenalnya."
