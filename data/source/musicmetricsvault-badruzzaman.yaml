reliability_note: "A mirror of his own Spotify artist page (artist ID 0U9NJ8msAQ4aOsDokeLzjy), a primary source for his self-presentation, as read on 9 November 2026: the biography quoted above names his roles and his founding of Holy Tune, and his popular songs are listed as Hasbi Rabbi Jallallah, Allah Bolo, Malikre Bhulia, Iqra, Cholar Pothe, Munajat and Eshke Muhammad. The page's Spotify figures (13,667 followers; 12,986 monthly listeners) are flagged by the page itself as possibly outdated (\"last updated ~9 months\" before its November 2026 crawl, so about February 2026) and are carried only with that dating. The biography names no school of law for him."
