summary:
  ar: "متن «طيبة النشر في القراءات العشر» لابن الجزري ⁦(ت 833هـ)⁩ في طبعته السادسة، ضبطه وصححه وراجعه محمد تميم الزعبي، وفيه مقدمتا الطبعة الخامسة والأولى اللتان تصفان منهج الضبط وصلة الطيبة بالشاطبية والدرة."
  en: "The text of Ibn al-Jazari's Tayyibat al-Nashr fi al-Qira'at al-Ashr (d. 833 AH), sixth printing, established and checked by Muhammad Tamim al-Za'bi; its prefaces to the fifth and first printings describe the method of vocalising the text and the relation of the Tayyiba to al-Shatibiyya and al-Durra."
  ur: "ابن الجزری ⁦(م 833ھ)⁩ کی «طیبۃ النشر فی القراءات العشر» کا متن، چھٹی طباعت، محمد تمیم زعبی کا ضبط و تصحیح؛ پانچویں اور پہلی طباعت کے دیباچوں میں ضبط کا منہج اور طیبہ کا شاطبیہ و دُرّہ سے تعلق بیان ہے۔"
  es: "El texto de Tayyibat al-Nashr fi al-Qira'at al-Ashr de Ibn al-Jazari (m. 833 AH), sexta edición, fue establecido y revisado por Muhammad Tamim al-Za'bi; sus prefacios a la quinta y primera edición describen el método de vocalización del texto y la relación de la Tayyiba con al-Shatibiyya y al-Durra."
title: "طيبة النشر في القراءات العشر"
