reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). Use with caution: this article wrongly gives his death in 1229 (626 AH) and his succession by Ruknuddin — it has conflated the death of his son Nasiruddin Mahmud and the 1229 investiture with the sultan's own death, which the English article and the Arabic Razia article both date to 30 April 1236; its death year is not used. Its remaining narrative (Aibak's slave freed and married to Aibak's daughter, the coloured-clothes grievance signal and the marble lions with their bell-chain at the palace gate, the council of the Forty, the Abbasid caliph al-Mustansir's investiture, the silver coinage, the completion of the Qutb mosque) agrees in substance with the English article. It names no madhhab for him. Checked 1 November 2026."
