summary:
  ar: "صفحة پێشەوا قادر الكردي على فيسبوك؛ أظهرت بيانات منشوراتها على منشور مؤرخ في 13 يناير 2026 عدد متابعين قدره 5.3 ملايين كما قرأها حصاد الموجة 199 — وهو رقمه الأكبر بين منصاته."
  en: "Peshawa Qadir Al-Kurdi's Facebook page: post metadata on a post dated 13 January 2026 showed 5,300,000 followers, as read in the wave-199 harvest — his largest platform figure."
  es: "La página de Facebook de Peshawa Qadir Al-Kurdi: los metadatos de una publicación con fecha del 13 de enero de 2026 mostraban 5.300.000 seguidores, como se lee en la cosecha wave-199, su cifra más alta en la plataforma."
  fr: "La page Facebook de Peshawa Qadir Al-Kurdi: les métadonnées d'une publication datée du 13 janvier 2026 indiquaient 5 300 000 abonnés, selon la vague-199 récolte — son chiffre le plus élevé sur la plateforme."
  ur: "پشاور قادر الکردی کا فیس بک صفحہ: 13 جنوری 2026 کی ایک پوسٹ پر پوسٹ میٹا ڈیٹا نے 5,300,000 پیروکاروں کو دکھایا، جیسا کہ لہر 199 فصل میں پڑھا گیا ہے - اس کا سب سے بڑا پلیٹ فارم ہے۔"
  tr: "Peşava Kader El-Kurdi'nin Facebook sayfası; 13 Ocak 2026 tarihli bir gönderisindeki veriler, Harvest Wave 199 tarafından okunan 5,3 milyon takipçi sayısını gösteriyordu — bu rakam platformları arasında en yüksek sayı."
  id: "Halaman Facebook Peshawa Qader Al-Kurdi; data dari postingannya pada postingan tertanggal 13 Januari 2026, menunjukkan jumlah pengikut sebanyak 5,3 juta, menurut Harvest Wave 199 — angka tertinggi di antara platformnya."
