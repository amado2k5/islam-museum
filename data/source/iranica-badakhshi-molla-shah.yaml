summary:
  ar: "مدخل «بدخشي، ملا شاه» بقلم حميد ألغار في الموسوعة الإيرانية؛ يعطي مولده سنة 990هـ/1582م في قرية أراكسا بمنطقة رستاق في بدخشان، وانتسابه إلى الطريقة القادرية وتلمذته لميان مير، وتلمذة دارا شكوه وجهان آرا له، ووفاته في لاهور بعد ثلاث سنوات من جلوس أورنكزيب (1658م) أي 1661م ودفنه بجوار ميان مير."
  en: "Hamid Algar's Encyclopaedia Iranica entry 'Badaḵšī, Mollā Shah'; it gives his birth in 990/1582 at Araksa in the Rostaq area of Badakhshan, his Qadiri affiliation and discipleship under Mian Mir, the discipleship of Dara Shikoh and Jahanara, and his death at Lahore three years after Aurangzeb's accession (1658) — i.e. 1661 — and burial beside Mian Mir."
