reliability_note: "Peer-reviewed scholarly encyclopedia entry (Encyclopaedia Iranica), read in full at the live URL on 1 November 2026 (article published 15 December 1988; page last updated 17 October 2016; DOI 10.1163/2330-4804_EIRO_COM_6294). It rests on the accounts of Mulla Shah's own disciples (Dara Shikoh's Sakinat al-awliya and Jahanara's Risala-yi Sahibiya) and on the standard secondary literature (Rizvi, Schimmel, Meier). It is the anchor source for this record: the birth year 990/1582, the Qadiri affiliation, the discipleship under Mian Mir, the royal disciples and the death at Lahore in 1661 are all taken from it."
