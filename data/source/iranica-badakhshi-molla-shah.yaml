  en: "Encyclopaedia Iranica — Badaḵšī, Mollā Shah"
summary:
  ar: "مدخل «بدخشي، ملا شاه» بقلم حميد ألغار في الموسوعة الإيرانية؛ يعطي مولده سنة 990هـ/1582م في قرية أراكسا بمنطقة رستاق في بدخشان، وانتسابه إلى الطريقة القادرية وتلمذته لميان مير، وتلمذة دارا شكوه وجهان آرا له، ووفاته في لاهور بعد ثلاث سنوات من جلوس أورنكزيب ⁦(1658م)⁩ أي 1661م ودفنه بجوار ميان مير."
  en: "Hamid Algar's Encyclopaedia Iranica entry 'Badaḵšī, Mollā Shah'; it gives his birth in 990/1582 at Araksa in the Rostaq area of Badakhshan, his Qadiri affiliation and discipleship under Mian Mir, the discipleship of Dara Shikoh and Jahanara, and his death at Lahore three years after Aurangzeb's accession (1658) — i.e. 1661 — and burial beside Mian Mir."
  es: "La entrada de Hamid Algar en la Encyclopaedia Iranica, titulada 'Badaḵšī, Mollā Shah', indica su nacimiento en 990/1582 en Araksa, en la zona de Rostaq de Badakhshan, su afiliación a la orden Qadiri y su discipulado con Mian Mir, el discipulado de Dara Shikoh y Jahanara, y su muerte en Lahore tres años después de la ascensión de Aurangzeb al trono (1658), es decir, en 1661, y su entierro junto a Mian Mir."
  fr: "L'article « Badaḵšī, Mollā Shah » de l'Encyclopaedia Iranica d'Hamid Algar donne sa naissance en 990/1582 à Araksa dans la région de Rostaq du Badakhshan, son affiliation Qadiri et son enseignement auprès de Mian Mir, son enseignement auprès de Dara Shikoh et Jahanara, et sa mort à Lahore trois ans après l'accession d'Aurangzeb au pouvoir (1658) — soit 1661 — et son enterrement aux côtés de Mian Mir."
  ur: "حامد الگر کا انسائیکلوپیڈیا ایرانیکا اندراج 'بدخشی، مولا شاہ'؛ اس کی پیدائش 990/1582 میں بدخشاں کے علاقے روستاق کے علاقے اراکسہ میں ہوئی، اس کی قادری وابستگی اور شاگردی میاں میر کے ماتحت، دارا شکوہ اور جہانارا کی شاگردی، اور اورنگ زیب کے الحاق (1658) کے تین سال بعد لاہور میں اس کی وفات یعنی 1661ء اور میان کے قریب۔"
