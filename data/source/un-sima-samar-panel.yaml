  ar: "سيرة سيما سمر لدى فريق الأمين العام للأمم المتحدة رفيع المستوى المعني بالنزوح الداخلي؛ تؤرخ ميلادها 3 فبراير 1957 وتخرجها الطبي سنة 1982 وفرارها إلى باكستان سنة 1984 وتأسيسها منظمة الشهداء في كويتا ورئاستها للجنة الأفغانية المستقلة لحقوق الإنسان."
  en: "Biography of Sima Samar for the UN Secretary-General's High-Level Panel on Internal Displacement; it dates her birth to 3 February 1957, her 1982 Kabul medical graduation, her 1984 flight to Pakistan, her founding of the Shuhada Organization in Quetta, and her chairmanship of the Afghan Independent Human Rights Commission."
