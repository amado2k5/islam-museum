summary:
  ar: "سيرة سيما سمر لدى فريق الأمين العام للأمم المتحدة رفيع المستوى المعني بالنزوح الداخلي؛ تؤرخ ميلادها 3 فبراير 1957 وتخرجها الطبي سنة 1982 وفرارها إلى باكستان سنة 1984 وتأسيسها منظمة الشهداء في كويتا ورئاستها للجنة الأفغانية المستقلة لحقوق الإنسان."
  en: "Biography of Sima Samar for the UN Secretary-General's High-Level Panel on Internal Displacement; it dates her birth to 3 February 1957, her 1982 Kabul medical graduation, her 1984 flight to Pakistan, her founding of the Shuhada Organization in Quetta, and her chairmanship of the Afghan Independent Human Rights Commission."
  es: "Biografía de Sima Samar para el Panel de Alto Nivel del Secretario General de la ONU sobre Desplazamiento Interno; en ella se indica que nació el 3 de febrero de 1957, se graduó en medicina en Kabul en 1982, huyó a Pakistán en 1984, fundó la Organización Shuhada en Quetta y presidió la Comisión Independiente de Derechos Humanos de Afganistán."
  fr: "Biographie de Sima Samar pour le Groupe de haut niveau du Secrétaire général de l'ONU sur les personnes déplacées à l'intérieur de leur propre pays; elle date sa naissance du 3 février 1957, son diplôme de médecine à Kaboul en 1982, sa fuite vers le Pakistan en 1984, la fondation de l'Organisation des martyrs à Quetta et sa présidence de la Commission indépendante afghane des droits de l'homme."
  ur: "داخلی نقل مکانی پر اقوام متحدہ کے سیکرٹری جنرل کے اعلیٰ سطحی پینل کے لیے سیما ثمر کی سوانح حیات؛ اس میں اس کی پیدائش 3 فروری 1957، اس کی 1982 میں کابل میڈیکل گریجویشن، 1984 میں پاکستان کے لیے اس کی پرواز، کوئٹہ میں اس کی شہدا آرگنائزیشن کی بنیاد، اور افغان آزاد انسانی حقوق کمیشن کی ان کی چیئرمین شپ ہے۔"
