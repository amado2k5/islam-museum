summary:
  en: "The 1939 Cairo edition of al-Khwarizmi's algebra, introduced and annotated by Ali Mustafa Mosharafa and Muhammad Mursi Ahmad of the Faculty of Science of the Egyptian University (publication no. 2 of the faculty), printed from the Bodleian manuscript copied in Cairo in Muharram 743 AH. It has an introduction on algebra before al-Khwarizmi, a chapter on the author and the book, and the full Arabic text with modern algebraic notes. The copy read is a Columbia University scan read by OCR."
  ar: "طبعة القاهرة سنة 1939 من كتاب الخوارزمي في الجبر والمقابلة، قدّم لها وعلّق عليها علي مصطفى مشرفة ومحمد مرسي أحمد من كلية العلوم بالجامعة المصرية (الإصدار رقم 2 للكلية)، عن مخطوط مكتبة بودلي المنسوخ بالقاهرة في المحرم سنة 743هـ. فيها مقدمة عن الجبر قبل الخوارزمي، وفصل عن المؤلف وكتابه، ونص الكتاب كاملاً بحواشٍ جبرية حديثة. النسخة المقروءة مسح لجامعة كولومبيا قُرئ بالتعرف الضوئي."
