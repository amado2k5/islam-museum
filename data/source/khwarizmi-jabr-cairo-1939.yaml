reliability_note: "Pages cited are PDF/scan pages of the Columbia University scan (130 scan pages), not printed folios. Printed page = scan page minus 12 for scan pp. 13-26 (scan p.15 is printed p.3, p.26 is p.14); a manuscript facsimile plate (scan p.28) and a blank leaf are inserted after p.26, so from scan p.29 printed page = scan page minus 14 (scan p.30 is printed p.16, p.122 is p.106). The editors' preface is dated 26/9/1937 (scan p.12) and the title page gives 1939 (scan p.7). The editors state that their base manuscript is the Bodleian copy finished in Cairo on Sunday 19 Muharram 743 AH, about five hundred years after the author, which they believed the only surviving copy, and that obvious copying errors were corrected silently (scan pp. 12, 26, 122); treat the text as a modern edition of a late copy. Their notes give modern algebraic equivalents; these are the editors' work, not al-Khwarizmi's. OCR by Apple Vision on a scan with no text layer: the Arabic is clean in the printed text but garbled on the facsimile pages (scan pp. 9, 28) and in the inline equations; quotations must be checked against the scan."
