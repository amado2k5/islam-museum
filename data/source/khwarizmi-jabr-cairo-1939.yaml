summary:
  en: "The 1939 Cairo edition of al-Khwarizmi's algebra, prepared by Ali Mustafa Mosharafa and Muhammad Morsi Ahmad of the Faculty of Science of the Egyptian University. The copy is a Columbia University scan read by OCR, and only the title page and editors' introduction have been read."
  ar: "طبعة القاهرة سنة 1939 من كتاب الخوارزمي في الجبر والمقابلة، قدّمها علي مصطفى مشرفة ومحمد مرسي أحمد من كلية العلوم بالجامعة المصرية. النسخة مسح لجامعة كولومبيا قُرئ بالتعرف الضوئي، وقُرئت صفحات العنوان والمقدمة فقط."
