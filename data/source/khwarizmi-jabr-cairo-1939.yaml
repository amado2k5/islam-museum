reliability_note: "Edition not verified against the manuscript. The title page of the scan gives 1939, the editors' preface is dated 1937 (OCR of scan p.12, date partly legible). The editors state that their base manuscript was a copy made about five hundred years after the author's death, and that obvious copying errors were corrected silently (scan pp. 11-12); treat the text as a modern edition of a late copy. OCR was done by Apple Vision on a scan with no text layer, and the Arabic is partly garbled on some pages (e.g. scan p.9); quotations must be checked against the scan. Page numbers are OCR scan markers, not printed folios. The title as printed is 'kitab al-jabr wal-muqabala'; the longer title in the museum's brief is not confirmed by the OCR."
