summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن طارق ذياب؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته مع الترجي والأهلي السعودي وجائزة أفضل لاعب أفريقي 1977 وكأس العالم 1978، ثم توليه وزارة الشباب والرياضة (2011–2014)، دون أي ذكر لديانته."
  en: "English Wikipedia article on Tarak Dhiab; used for entity facts only. It recounts his career with Espérance and Al-Ahli, the 1977 African Footballer of the Year award and the 1978 World Cup, and his tenure as Minister of Youth and Sports (2011–2014), with no mention of his religion."
  es: "Artículo de la Wikipedia en inglés sobre Tarak Dhiab; utilizado únicamente para obtener información sobre la persona. Relata su trayectoria en el Espérance y el Al-Ahli, el premio al Futbolista Africano del Año de 1977 y la Copa Mundial de 1978, así como su mandato como Ministro de Juventud y Deportes (2011-2014), sin mencionar su religión."
  fr: "Article de Wikipédia en anglais sur Tarak Dhiab; utilisé uniquement à des fins d’information sur l’entité. Il retrace sa carrière à l’Espérance et à Al-Ahli, son titre de meilleur joueur africain de l’année en 1977 et sa victoire à la Coupe du monde de 1978, ainsi que son mandat de ministre de la Jeunesse et des Sports (2011-2014), sans aucune mention de sa religion."
  ur: "تارک ذیاب پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ایسپرنس اور الاہلی کے ساتھ ان کے کیریئر کا ذکر کیا گیا ہے، 1977 کے افریقی فٹبالر آف دی ایئر کا ایوارڈ اور 1978 کا ورلڈ کپ، اور وزیر برائے نوجوانان اور کھیل (2011–2014) کے طور پر ان کے دور کا ذکر کیا گیا ہے، جس میں ان کے مذہب کا کوئی ذکر نہیں ہے۔"
  tr: "Tarek Diab hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Esperance, Al-Ahli Suudi Arabistan'daki kariyerini, 1977'de Afrika Yılın Oyuncusu ödülünü ve 1978 Dünya Kupası'nı, ardından Gençlik ve Spor Bakanı olarak atanmasını (2011–2014) anlatır, dininden hiç bahsedilmez."
  id: "Artikel Wikipedia bahasa Inggris tentang Tarek Diab; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kariernya bersama Esperance, Al-Ahli Arab Saudi, penghargaan Pemain Afrika Terbaik tahun 1977, dan Piala Dunia 1978, kemudian pengangkatannya sebagai Menteri Pemuda dan Olahraga (2011–2014), tanpa menyebutkan agamanya."
