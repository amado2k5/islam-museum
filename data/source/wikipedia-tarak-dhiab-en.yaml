reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It gives Dhiab as born on 15 January 1954 in Tunis — the French article and Wikidata give 15 July 1954 instead, and the conflict is recorded in the person's born note — an attacking midfielder for Espérance de Tunis and Saudi Al-Ahli, African Footballer of the Year in 1977, a member of the Tunisia side that won Africa's first World Cup match in 1978, and Minister of Youth and Sports from 24 December 2011 to 29 January 2014. It notes the federation's figure of 107 caps is not ratified by FIFA. It makes no statement of his religion anywhere: no religion field, no statement in text, no religious category."
