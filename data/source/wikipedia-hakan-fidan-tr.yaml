summary:
  ar: "مقالة ويكيبيديا التركية عن هاكان فيدان ⁦(وُلد في 17 تموز 1968 في أنقرة)⁩، وزير خارجية تركيا منذ 2023 ورئيس جهاز الاستخبارات الوطنية منذ 2010 حتى 2023؛ تذكر مسيرته العسكرية والاستخبارية والدبلوماسية بتفصيل واسع."
  en: "Turkish Wikipedia article on Hakan Fidan (born 17 July 1968 in Ankara), Turkey's foreign minister since 2023 and director of the National Intelligence Organization from 2010 to 2023; it records his military, intelligence and diplomatic career in detail."
  es: "Artículo de la Wikipedia en turco sobre Hakan Fidan (nacido el 17 de julio de 1968 en Ankara), ministro de Asuntos Exteriores de Turquía desde 2023 y director de la Organización Nacional de Inteligencia de 2010 a 2023; en él se detalla su trayectoria militar, en los servicios de inteligencia y en la diplomacia."
  fr: "Article de Wikipédia en turc sur Hakan Fidan (né le 17 juillet 1968 à Ankara), ministre des Affaires étrangères de la Turquie depuis 2023 et directeur de l'Organisation nationale du renseignement de 2010 à 2023; il retrace en détail sa carrière militaire, de renseignement et diplomatique."
  ur: "ہاکان فیدان ⁦(17 جولائی 1968 کو انقرہ میں پیدا ہوئے)⁩، 2023 سے ترکی کے وزیر خارجہ اور 2010 سے 2023 تک نیشنل انٹیلی جنس آرگنائزیشن کے ڈائریکٹر پر ترک ویکیپیڈیا کا مضمون؛ اس میں ان کے فوجی، انٹیلی جنس اور سفارتی کیریئر کو تفصیل سے درج کیا گیا ہے۔"
  tr: "2023'ten beri Türkiye Dışişleri Bakanı ve 2010-2023 yılları arasında Ulusal İstihbarat Servisi Başkanı olan Hakan Fidan (17 Temmuz 1968, Ankara doğumlu) hakkında Türk Wikipedia'daki makale, onun askeri, istihbarat ve diplomatik kariyerini kapsamlı şekilde anlatıyor."
  id: "Artikel Wikipedia Turki tentang Hakan Fidan (lahir 17 Juli 1968 di Ankara), Menteri Luar Negeri Turki sejak 2023 dan Kepala Dinas Intelijen Nasional dari 2010 hingga 2023, secara luas menceritakan karier militer, intelijen, dan diplomatiknya."
