  ar: "صفحة «The Cairo Trilogy» لدى Encyclopaedia Britannica. لم يفتحها المتحف بنفسه؛ عُرف محتواها من ملخص بحثي قُدّم إلى المتحف ووافق المؤسس على استعماله في 21 نوفمبر 2026. يُستشهد بها في: نجيب محفوظ وجائزة نوبل للأدب سنة 1988 وأعماله الكبرى."
  en: "The page \"The Cairo Trilogy\" (Encyclopaedia Britannica). The museum did not open it itself: what is known of it comes from a research summary supplied to the museum and approved for use by the founder on 21 November 2026. Cited for: Naguib Mahfouz, the 1988 Nobel Prize in Literature and his major works."
