reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It gives: born 1 June 1850 at Frashër, son of Halit Bey (1797–1859) and Emine (1814–1861), his father of the Dakollari branch of the Frashëri family; the family is 'a distinguished Muslim Albanian family of Bektashi religious affiliations' — a statement about the family, which the record treats as family background, never as the man's own attested affiliation; he began his studies at the Bektashi tekke in Frashër (an education fact), then the Zosimea school at Ioannina, finishing its eight-year programme in seven; to Istanbul in 1872, Ottoman bureaucracy and journalism, postings to Tripoli and Rhodes; the Istanbul alphabet of 1879 and the Society for the Publication of Albanian Writings (October 1879); the Korçë Albanian school opened 7 March 1887; the six-volume Kâmûsü'l-A'lâm (1889–1899 in the works list; the section text says written 1889–1899 and the last volume 1899) and the Kâmûs-ı Türkî (1899–1901); the treatise Albania: What she has been, What she is, What she shall be (1899) — the article records that Turkish historians generally do not accept the attribution to him while Albanian works express no doubt, and the museum carries the attribution dispute as such; he 'supported Turkish nationalism ... along with secularism (anti-clericalism or laicism) against theocracy'; died 18 June 1904 'after a severe illness at his home in Erenköy, Istanbul' (the Turkish article gives 1 July 1904 and the German 5 June 1904 — recorded as conflicts); his son Ali Sami Yen founded Galatasaray. No statement in the article attests Sami's own membership of the Bektashi order, and none is recorded."
