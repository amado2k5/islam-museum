  ar: "مقالة ويكيبيديا الإنجليزية عن سامي فراشري (شمس الدين سامي، 1850-1904)؛ تُستخدم لوقائع الكيان فقط. تصف أسرته بأنها أسرة ألبانية مسلمة ذات انتماءات بكتاشية، وتذكر بدء دراسته في تكية فراشر البكتاشية، وأعماله المعجمية والموسوعية وكتابه في قضية ألبانيا."
  en: "English Wikipedia article on Sami Frashëri (Şemseddin Sami, 1850–1904); used for entity facts only. It describes his family as a Muslim Albanian family 'of Bektashi religious affiliations', records that he began his studies at the Bektashi tekke in Frashër, and covers his dictionaries, his encyclopedia and his Albanian treatise."
