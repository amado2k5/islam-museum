summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن علي الجفري ⁦(ولد 16 أبريل 1971)⁩، العالم اليمني المقيم في القاهرة ومؤسس مؤسسة طابة؛ لا يسمي متنها له مذهبًا، وتصنفه تصنيفاتها في الأشاعرة والشافعية وصوفية أهل السنة."
  en: "The English Wikipedia article on Ali al-Jifri (born 16 April 1971), the Yemeni scholar based in Cairo and founder of the Tabah Foundation; its text names no school for him, while its categories file him among Ash'aris, Shafi'is and Sunni Sufis."
  es: "El artículo de la Wikipedia en inglés sobre Ali al-Jifri (nacido el 16 de abril de 1971), el erudito yemení afincado en El Cairo y fundador de la Fundación Tabah; su texto no menciona ninguna escuela a la que pertenezca, mientras que sus categorías lo sitúan entre los ash'aris, los shafi'is y los sufíes sunitas."
  fr: "L'article de Wikipédia en anglais sur Ali al-Jifri (né le 16 avril 1971), le savant yéménite basé au Caire et fondateur de la Fondation Tabah; son texte ne mentionne aucune école pour lui, tandis que ses catégories le classent parmi les Ash'arites, les Shafi'ites et les soufis sunnites."
  ur: "علی الجفری ⁦(پیدائش 16 اپریل 1971)⁩ پر انگریزی ویکیپیڈیا کا مضمون، قاہرہ میں مقیم یمنی اسکالر اور تبع فاؤنڈیشن کے بانی؛ اس کا متن اس کے لیے کسی مکتب کا نام نہیں رکھتا، جبکہ اس کے زمرے اسے اشعری، شافعی اور سنی صوفیاء میں درج کرتے ہیں۔"
