  ar: "تقرير لديفيد ليبيسكا في صحيفة «ذا ناشونال» عن دار كازي للنشر في شيكاغو: بداياتها نحو 1970 وإدارة لياقت علي لها منذ 1972، وأول كتاب نشرته سنة 1974، وانتقالها إلى شارع بلمونت سنة 1984، وعمل ليلى بختيار فيها منذ 1992، و«القرآن السامي» الذي نشرته أوائل 2007."
  en: "A report by David Lepeska in The National on Kazi Publications of Chicago: its beginnings around 1970 and Liaquat Ali's running of it from 1972, its first published book in 1974, its move to Belmont Avenue in 1984, Laleh Bakhtiar's work there from 1992, and The Sublime Quran, published in early 2007."
