summary:
  ar: "تقرير لديفيد ليبيسكا في صحيفة «ذا ناشونال» عن دار كازي للنشر في شيكاغو: بداياتها نحو 1970 وإدارة لياقت علي لها منذ 1972، وأول كتاب نشرته سنة 1974، وانتقالها إلى شارع بلمونت سنة 1984، وعمل ليلى بختيار فيها منذ 1992، و«القرآن السامي» الذي نشرته أوائل 2007."
  en: "A report by David Lepeska in The National on Kazi Publications of Chicago: its beginnings around 1970 and Liaquat Ali's running of it from 1972, its first published book in 1974, its move to Belmont Avenue in 1984, Laleh Bakhtiar's work there from 1992, and The Sublime Quran, published in early 2007."
  ur: "ذا نیشنل میں ڈیوڈ لیپیسکا کی رپورٹ، شکاگو کی کازی پبلیکیشنز پر: تقریباً 1970 میں آغاز، 1972 سے لیاقت علی کی نگرانی، 1974 میں پہلی شائع شدہ کتاب، 1984 میں بیلمونٹ ایونیو منتقلی، 1992 سے لیلیٰ بختیار کا کام، اور 2007 کے اوائل میں شائع ہونے والا «دی سبلائم قرآن»۔"
  es: "Un reportaje de David Lepeska en The National sobre Kazi Publications de Chicago: sus inicios alrededor de 1970 y la gestión de Liaquat Ali desde 1972, su primer libro publicado en 1974, su traslado a Belmont Avenue en 1984, el trabajo de Laleh Bakhtiar allí desde 1992 y El Sublime Corán, publicado a principios de 2007."
  fr: "Un article de David Lepeska dans The National sur Kazi Publications de Chicago: ses débuts vers 1970 et sa direction par Liaquat Ali à partir de 1972, son premier livre publié en 1974, son déménagement sur Belmont Avenue en 1984, le travail de Laleh Bakhtiar là-bas à partir de 1992 et Le Sublime Coran, publié début 2007."
  tr: "David Lipeska'nın The National'da Chicago'daki Kazi Publishing hakkında bir raporu: 1970 civarında başlangıçları, 1972'den beri Ali'nin liderliği, ilk kitabı 1974'te yayımlanması, 1984'te Belmont Street'e taşınması (Layla Bakhtiar'ın 1992'den beri çalıştığı) ve 2007 başında yayımladığı \"The Noble Quran\" adlı kitabı."
  id: "Laporan oleh David Lipeska di The National tentang Kazi Publishing di Chicago: awal mula sekitar tahun 1970, dengan kepemimpinan Ali sejak 1972, buku pertamanya diterbitkan pada 1974, kepindahannya ke Belmont Street pada 1984, tempat Layla Bakhtiar bekerja sejak 1992, dan \"The Noble Quran,\" yang ia terbitkan pada awal 2007."
