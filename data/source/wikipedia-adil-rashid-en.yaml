  ar: "مقالة ويكيبيديا الإنجليزية عن عادل رشيد (مواليد 1988)؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في برادفورد في 17 فبراير 1988 من أصل باكستاني ميربوري، ولعبه ليوركشير وإنجلترا منذ 2009، وفوزه بكأسَي العالم 2019 و2022، وكونه أكثر رامي دوران أخذا للويكيت لإنجلترا في مباريات اليوم الواحد والعشرينيات، ووسام MBE سنة 2023."
  en: "English Wikipedia article on Adil Rashid (born 1988); used for entity facts only. It records his birth in Bradford on 17 February 1988 of Pakistani Mirpuri descent, his career for Yorkshire and England from 2009, his 2019 and 2022 World Cup wins, his standing as England's highest spin wicket-taker in ODIs and T20Is, and his MBE in 2023."
