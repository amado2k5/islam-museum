reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision. It gives him as born in 1879 and died 1949 — against the Chinese article's 12 March 1880, which is followed with the conflict recorded — from a family of learned imams at Tianjin, taught Islamic and Confucian scholarship by his father, an imam in north-eastern China in his twenties, then a pilgrim and a student at al-Azhar who gained fluency in Arabic, and back in China the translator of the Qur'an, begun at the request of Ding Yunhui's son. It names no school, order or movement for him."
