summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن وانغ جينغزهاي؛ تُستخدم لوقائع الكيان فقط. تروي العالم المسلم من أسرة أئمة في تيانجين (1879–1949) الذي خدم إمامًا في شمال شرق الصين، وحجّ ودرس في الأزهر، وأسّس مجلات دينية، وكان أوّل من ترجم القرآن كاملًا إلى الصينية."
  en: "English Wikipedia article on Wang Jingzhai; used for entity facts only. It recounts the Muslim scholar from a Tianjin family of imams (1879–1949) who served as an imam in north-eastern China, performed the hajj and attended al-Azhar, founded religious periodicals, and was the first or second person to translate the entire Qur'an into Chinese."
  es: "Artículo de la Wikipedia en inglés sobre Wang Jingzhai; utilizado únicamente para obtener información sobre la persona. Narra la vida de este erudito musulmán perteneciente a una familia de imanes de Tianjin (1879-1949), quien ejerció como imán en el noreste de China, realizó la peregrinación a La Meca (Hajj) y asistió a Al-Azhar, fundó publicaciones religiosas y fue la primera o segunda persona en traducir el Corán completo al chino."
  fr: "Article de Wikipédia en anglais sur Wang Jingzhai; utilisé uniquement pour les informations sur l'entité. Il relate l'histoire de ce savant musulman issu d'une famille d'imams de Tianjin (1879-1949), qui a officié comme imam dans le nord-est de la Chine, accompli le hajj, étudié à al-Azhar, fondé des périodiques religieux et été le premier ou le deuxième à traduire l'intégralité du Coran en chinois."
  ur: "Wang Jingzhai پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں تیانجن کے ایک ائمہ (1879–1949) کے خاندان سے تعلق رکھنے والے مسلم اسکالر کا ذکر ہے جس نے شمال مشرقی چین میں بطور امام خدمات انجام دیں، حج ادا کیا اور الازہر میں شرکت کی، مذہبی رسالوں کی بنیاد رکھی، اور وہ پہلا یا دوسرا شخص تھا جس نے پورے قرآن کا چینی میں ترجمہ کیا۔"
