  en: "English Wikipedia article on Wang Jingzhai; used for entity facts only. It recounts the Muslim scholar from a Tianjin family of imams (1879–1949) who served as an imam in north-eastern China, performed the hajj and attended al-Azhar, founded religious periodicals, and was the first or second person to translate the entire Qur'an into Chinese."
