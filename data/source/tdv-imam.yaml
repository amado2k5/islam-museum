  ar: "مدخل «إمام» في موسوعة TDV الإسلامية، بأربعة أقسام: نشأة الإمامة في الصلاة من العهد النبوي وتطور التعيين والأجر عبر العصور ⁦(القسم الأول)⁩، تنظيم الإمامة في الدولة العثمانية من البراءة والمحققية إلى إمامة المهلة والجيش ⁦(القسم الثاني)⁩، الإمامة في الجمهورية التركية ⁦(القسم الثالث)⁩، وموقف الفقه من شروط الإمام ⁦(القسم الرابع)⁩."
