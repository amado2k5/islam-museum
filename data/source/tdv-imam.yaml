label:
  ar: "إمام — موسوعة TDV الإسلامية ⁦(كوتشوك آشجي، بيدلي، يوجل، أوغوت)⁩"
  en: "İMAM (imam, prayer leader) — TDV İslâm Ansiklopedisi (Küçükaşcı, Beydilli, Yücel, Öğüt)"
summary:
  ar: "مدخل «إمام» في موسوعة TDV الإسلامية، بأربعة أقسام: نشأة الإمامة في الصلاة من العهد النبوي وتطور التعيين والأجر عبر العصور ⁦(القسم الأول)⁩، تنظيم الإمامة في الدولة العثمانية من البراءة والمحققية إلى إمامة المهلة والجيش ⁦(القسم الثاني)⁩، الإمامة في الجمهورية التركية ⁦(القسم الثالث)⁩، وموقف الفقه من شروط الإمام ⁦(القسم الرابع)⁩."
  en: "The TDV İslâm Ansiklopedisi entry on the imam, in four sections: the office of prayer leadership from the Prophet's time and the history of appointment and pay (section one), the Ottoman organisation of imams from the sultan's berat to the neighbourhood and army imams (section two), imams in the Turkish Republic (section three), and the jurists' requirements for the imam (section four)."
  es: "La entrada de la TDV İslâm Ansiklopedisi sobre el imán se divide en cuatro secciones: el oficio de liderazgo de la oración desde la época del Profeta y la historia del nombramiento y la remuneración (sección uno), la organización otomana de los imanes desde el berat del sultán hasta los imanes del vecindario y del ejército (sección dos), los imanes en la República Turca (sección tres) y los requisitos de los juristas para el imán (sección cuatro)."
  fr: "L'entrée de TDV İslâm Ansiklopedisi sur l'imam, en quatre sections: la fonction de direction de la prière depuis l'époque du Prophète et l'histoire de la nomination et de la rémunération (section un), l'organisation ottomane des imams depuis le berat du sultan jusqu'aux imams de quartier et de l'armée (section deux), les imams dans la République turque (section trois) et les exigences des juristes concernant l'imam (section quatre)."
  ur: "امام پر TDV İslâm Ansiklopedisi اندراج، چار حصوں میں: نماز کی امامت کا عہدہ نبوی کے زمانے سے اور تقرری اور تنخواہ کی تاریخ ⁦(سیکشن ایک)⁩، سلطان کی برات سے لے کر محلے تک کے ائمہ کی عثمانی تنظیم اور فوج کے امام ⁦(سیکشن دو)⁩، ائمہ جمہوریہ کے لیے ترک اور تینوں کے لیے ضروری ہے۔ ⁦(سیکشن چار)⁩"
  tr: "TDV İslami Ansiklopedisi'ndeki \"İmam\" maddesi dört bölüme ayrılmıştır: Peygamberlik Döneminden Nama Yoluyla İmamatlığın Ortaya Çıkışı ve Çağlar Boyunca Atama ve Ödülün Gelişimi (Birinci Bölüm), Osmanlı İmparatorluğu'nda İmamatlığın Masumiyetten Doğrulamadan Geçici Dönem ve Ordu İmalığına Geçiş (İkinci Bölüm), Türkiye Cumhuriyeti'nde İmalık (Üçüncü Bölüm) ve İmamın Koşullarına Dair Fıkıh Pozisyonu (Dördüncü Bölüm)."
  id: "Entri \"Imam\" dalam Ensiklopedia Islam TDV, dibagi menjadi empat bagian: Kemunculan Imamate dalam Doa dari Era Kenabian dan Perkembangan Pengangkatan dan Penghargaan Sepanjang Zaman (Bagian Satu), Organisasi Imamate di Kekaisaran Ottoman dari Kepolosan dan Verifikasi menjadi Imamate Periode Sementara dan Tentara (Bagian Dua), Imamate di Republik Turki (Bagian Tiga), dan Posisi Yurisprudensi tentang Kondisi Imam (Bagian Empat)."
