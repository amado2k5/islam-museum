  ar: "تدوينة لميخايلو ياكوبوفيتش، 12 يناير 2024، عن «القرآن مع الترجمة» لإسعاد دوراكوفيتش بالبوسنية: أتمّها سنة 2002 ونشرتها دار سفيتلوست في سراييفو سنة 2004 مع النص العربي، وترجم السور المكية شعرًا مقفّى والمدنية نثرًا."
