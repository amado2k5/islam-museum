summary:
  ar: "تدوينة لميخايلو ياكوبوفيتش، 12 يناير 2024، عن «القرآن مع الترجمة» لإسعاد دوراكوفيتش بالبوسنية: أتمّها سنة 2002 ونشرتها دار سفيتلوست في سراييفو سنة 2004 مع النص العربي، وترجم السور المكية شعرًا مقفّى والمدنية نثرًا."
  en: "A post by Mykhaylo Yakubovych, 12 January 2024, on Esad Duraković's Bosnian Kuran s prijevodom: completed in 2002 and published with the Arabic text by Svjetlost in Sarajevo in 2004, with the Meccan suras rendered in rhymed verse and the Medinan in prose."
  ur: "میخائیلو یاکوبووچ کی تحریر، 12 جنوری 2024، اسعاد دوراکووچ کے بوسنیائی «کوران س پریوودوم» پر: 2002 میں مکمل، 2004 میں سرائیوو میں سویتلوست نے عربی متن کے ساتھ شائع کیا؛ مکی سورتیں مقفیٰ نظم میں اور مدنی نثر میں۔"
  es: "Publicación de Mykhaylo Yakubovych, 12 de enero de 2024, sobre el libro de Esad Duraković, *Bosnian Kuran s prijevodom*: completado en 2002 y publicado con el texto árabe por Svjetlost en Sarajevo en 2004, con las suras de La Meca en verso rimado y las de Medina en prosa."
  fr: "Article de Mykhaylo Yakubovych, 12 janvier 2024, sur le Coran bosnien d'Esad Duraković: achevé en 2002 et publié avec le texte arabe par Svjetlost à Sarajevo en 2004, avec les sourates mecquoises rendues en vers rimés et les sourates médinoises en prose."
  tr: "Mikhailo Jakupović tarafından 12 Ocak 2024 tarihli bir yazı, Isad Duraković'in Bosnakça 'Kur'an' ve Çevirisi' üzerine: 2002'de tamamlanmış ve 2004'te Arapça metinle Saraybosna'da Svetlostt tarafından yayımlanmış, Mekke surelerini kafiyeli şiire, Madaniya'yı ise düzyazıya çevirmiştir."
  id: "Sebuah tulisan oleh Mikhailo Jakupović, 12 Januari 2024, tentang 'Al-Qur'an dengan Terjemahan' oleh Isad Duraković dalam bahasa Bosnia: selesai pada 2002 dan diterbitkan oleh Svetlostt di Sarajevo pada 2004 dengan teks Arab, serta surah Mekah yang diterjemahkan ke dalam puisi berima dan Madaniya ke dalam prosa."
