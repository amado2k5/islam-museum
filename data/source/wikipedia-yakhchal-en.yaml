summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن اليخچال؛ لوقائع الكيان فقط: اشتقاق الاسم يخ+چال، سجلات تؤرخه لنحو 400 ق.م، تشريح القبة والخزان تحت الأرض وجدار الظل وأحواض الجليد، مونة الساروج وجدران بمترين، حجوم إلى 5000 م3، الاقتران بالقنات والبادجير، فروق الظل 15-20 درجة، مخروط كرمان الثمانية عشر متراً، تسمية الثلاجة الحديثة به في إيران وأفغانستان وطاجيكستان، وتبني المغول له «برف خانة» من همايون إلى شاه جهان."
  en: "English Wikipedia article on the yakhchal; entity facts only: the yakh+chal etymology, records from about 400 BCE, the dome/subterranean chamber/shade-wall/ice-pool anatomy, sarooj mortar and two-metre walls, volumes up to 5,000 m3, pairing with qanats and badgirs, 15-20 degree shade differentials, the eighteen-metre Kerman cone, the word's use for modern refrigerators in Iran, Afghanistan and Tajikistan, and the Mughal baraf khana adoption from Humayun to Shah Jahan."
  es: "Artículo de la Wikipedia en inglés sobre el yakhchal; solo datos sobre la entidad: la etimología yakh+chal, registros desde aproximadamente el 400 a. C., la anatomía de la cúpula/cámara subterránea/pared de sombra/piscina de hielo, mortero sarooj y paredes de dos metros, volúmenes de hasta 5000 m3, combinación con qanats y badgirs, diferenciales de sombra de 15 a 20 grados, el cono de Kerman de dieciocho metros, el uso de la palabra para refrigeradores modernos en Irán, Afganistán y Tayikistán, y la adopción del baraf khana mogol desde Humayun hasta Shah Jahan."
  fr: "Article de Wikipédia en anglais sur le yakhchal; faits concernant l’entité uniquement: étymologie yakh+chal, documents datant d’environ 400 av. J.-C., structure en dôme/chambre souterraine/mur d’ombrage/bassin de glace, mortier sarooj et murs de deux mètres, volumes jusqu’à 5 000 m³, association avec les qanats et les badgirs, différences d’ombrage de 15 à 20 degrés, cône de Kerman de dix-huit mètres, utilisation du mot pour les réfrigérateurs modernes en Iran, en Afghanistan et au Tadjikistan, et adoption du baraf khana moghol par Humayun et Shah Jahan."
  ur: "یخچل پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق: یخ+چل ایٹمولوجی، تقریباً 400 قبل مسیح کا ریکارڈ، گنبد/زیر زمینی چیمبر/شیڈ وال/آئس پول اناٹومی، سروج مارٹر اور دو میٹر کی دیواریں، حجم 5,000 ایم 3 تک، قنات کے ساتھ جوڑنا، ڈگری 2، مختلف درجے اور شدے 5- اٹھارہ میٹر کرمان مخروط، ایران، افغانستان اور تاجکستان میں جدید ریفریجریٹرز کے لیے اس لفظ کا استعمال، اور ہمایوں سے شاہ جہاں تک مغل باراف خانہ کو اپنایا گیا۔"
