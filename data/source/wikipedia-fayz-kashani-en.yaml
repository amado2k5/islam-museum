reliability_note: "Read in full. The lead introduces him as an 'Iranian Akhbari Twelver Shi'i Muslim, mystic, poet, philosopher, and muhaddith' — one of the two independent prose attestations behind the person record's shia-twelver settlement (the Arabic article's lead calls him a Shi'i Imami). It gives his birth at Kashan on 15 September 1598 and his death there on 22 May 1680, his father Shah Murtada, his studies at Isfahan and at Shiraz under Sayyid Majid Bahrani, his place in the circles of Shaykh Baha'i, Mir Damad and Mulla Sadra — the last his teacher for eight years and his father-in-law — his teaching at the Molla Abd-Allah madrasa and leadership of Friday prayer at Isfahan, and a documented bibliography of 122 works in over 550,000 lines, about 40 of them published, among them al-Wafi, Tafsir al-Safi, al-Mahajja al-bayza, 'Ayn al-yaqin, Mafatih al-shara'i' and Kalimat maknuna, beside some 20,000 verses of poetry. Its account of his contested positions (on ijma, on music and impurity, and on prayer not needing to be in Arabic) is reflected in the prose."
