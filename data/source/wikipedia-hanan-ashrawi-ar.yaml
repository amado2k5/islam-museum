summary:
  ar: "مقالة ويكيبيديا العربية عن حنان عشراوي؛ تُستخدم لوقائع الكيان فقط. يصفها صدرها بأنها «ناشطة سياسية فلسطينية مسيحية» — وصف لانتمائها هي لا لأسرتها فقط — ويوافق الإنجليزية في الولادة في نابلس في 8 أكتوبر 1946 لأبوين مسيحيين، ويروي مسيرتها الأكاديمية والسياسية."
  en: "Arabic Wikipedia article on Hanan Ashrawi; used for entity facts only. Its lead describes her personally as 'a Palestinian Christian political activist' — a statement of her own affiliation, not only her family's — and it agrees with the English article on her birth in Nablus on 8 October 1946 to Christian parents and recounts her academic and political career."
  es: "Artículo en árabe de la Wikipedia sobre Hanan Ashrawi; utilizado únicamente para obtener información sobre la persona. Su introducción la describe personalmente como «una activista política palestina cristiana» —una declaración de su propia afiliación, no solo de su familia— y coincide con el artículo en inglés sobre su nacimiento en Nablus el 8 de octubre de 1946, de padres cristianos, y relata su trayectoria académica y política."
  fr: "Article de Wikipédia en arabe sur Hanan Ashrawi; utilisé uniquement pour des informations sur l’entité. Son introduction la décrit personnellement comme « une militante politique chrétienne palestinienne » — une affirmation de sa propre appartenance, et non seulement de celle de sa famille — et confirme, comme l’article en anglais, sa naissance à Naplouse le 8 octobre 1946 de parents chrétiens et retrace son parcours universitaire et politique."
  ur: "حنان اشراوی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا لیڈ اسے ذاتی طور پر 'فلسطینی عیسائی سیاسی کارکن' کے طور پر بیان کرتا ہے - اس کی اپنی وابستگی کا بیان، نہ صرف اس کے خاندان کا - اور یہ 8 اکتوبر 1946 کو نابلس میں عیسائی والدین کے لیے اس کی پیدائش کے انگریزی مضمون سے متفق ہے اور اس کے تعلیمی اور سیاسی کیریئر کا ذکر کرتا ہے۔"
