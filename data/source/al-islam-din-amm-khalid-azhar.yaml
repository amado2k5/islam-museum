label:
  ar: "الإسلام دين عام خالد — محمد فريد وجدي"
  en: "Islam, a Universal and Eternal Religion — Muhammad Farid Wajdi"
summary:
  ar: "كتاب الأستاذ محمد فريد وجدي ⁦(ت ١٣٧٣هـ / ١٩٥٤م)⁩، ضمن السلسلة العلمية لمجمع البحوث الإسلامية بالأزهر الشريف، في تحليل مبادئ الدين الإسلامي: الدين والوحي، والإسلام وسلطان العقل والعلم، وشريعة الإسلام؛ 152 صفحة، إشراف الأمين العام للمجمع."
  en: "Muhammad Farid Wajdi's book in the Scientific Series of the Islamic Research Academy of al-Azhar, an analysis of the principles of Islam in three chapters: religion and revelation, Islam and the authority of reason and science, and the Shari'a; 152 pages, supervised by the Academy's Secretary-General."
  es: "El libro de Muhammad Farid Wajdi, perteneciente a la Serie Científica de la Academia de Investigación Islámica de Al-Azhar, es un análisis de los principios del Islam dividido en tres capítulos: religión y revelación, el Islam y la autoridad de la razón y la ciencia, y la Sharia; consta de 152 páginas y fue supervisado por el Secretario General de la Academia."
  fr: "L'ouvrage de Muhammad Farid Wajdi, dans la collection scientifique de l'Académie de recherche islamique d'al-Azhar, analyse les principes de l'islam en trois chapitres: religion et révélation, islam et autorité de la raison et de la science, et la charia; 152 pages, sous la supervision du secrétaire général de l'Académie."
  ur: "اسلامک ریسرچ اکیڈمی آف الازہر کی سائنسی سیریز میں محمد فرید وجدی کی کتاب، تین ابواب میں اسلام کے اصولوں کا تجزیہ: مذہب اور وحی، اسلام اور عقل و سائنس کی اتھارٹی، اور شریعت؛ اکیڈمی کے سیکرٹری جنرل کی زیر نگرانی 152 صفحات۔"
  tr: "Profesör Muhammed Farid Wagdi'nin (ö. 1373 Hicri / 1954 M.S.) kitabı, İslam ilkelerini analiz eden İslam ilkelerini: din ve vahiy, İslam ve akl ve bilimin otoritesi ile İslam hukuku; 152 sayfa, Akademi Genel Sekreteri tarafından denetlenmektedir."
  id: "Buku Profesor Muhammad Farid Wagdi (wafat 1373 H / 1954 M), dalam seri ilmiah Akademi Riset Islam di Al-Azhar Al-Sharif, menganalisis prinsip-prinsip Islam: agama dan wahyu, Islam dan otoritas akal dan ilmu pengetahuan, serta hukum Islam; 152 halaman, diawasi oleh Sekretaris Jenderal Akademi."
