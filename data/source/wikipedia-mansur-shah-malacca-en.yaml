  ar: "مقالة ويكيبيديا الإنجليزية عن سلطان منصور شاه (ت. 1477)، سادس سلاطين ملقا؛ خلف أباه مظفر شاه، وبلغت ملقا في عهده أقصى اتساعها، وخفّض ضرائب التجارة، واهتم بالإسلام فدرس التصوف على مولانا أبي بكر وأمر بترجمة كتاب دار المنظوم إلى الملايوية واستشار علماء فاساي؛ وتفصّل المقالة نقش شاهد قبره الذي يؤرخ وفاته برجب 882هـ."
  en: "English Wikipedia article on Sultan Mansur Shah (d. 1477), sixth sultan of Malacca; he succeeded his father Muzaffar Shah, brought Malacca to its greatest territorial extent, reduced trade taxes, and took a personal interest in Islam — studying Sufism under Maulana Abu Bakar, ordering the Darul Manzum translated into Malay and consulting the scholars of Pasai; the article also sets out his tombstone inscription, which dates his death to Rajab 882 AH."
