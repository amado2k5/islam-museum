reliability_note: "Read in full (text and wikitext) on 1 November 2026. Its narrative rests on Cœdès (1968), Andaya's History of Malaysia (1982), Ricklefs (2001) and Brown's Malay Annals translation (1952). Its lead dates the reign 1459–1477 while its infobox and succession box print 1456–1477; the lead's frame, which the Malay edition shares, is the one recorded, with the variant preserved. The tombstone section reports two rival decipherments of the same stones — Moquette's reading of Rajab 882 AH (1477) and Hervey's of Rajab 880 AH (1475), the latter carried in the title of Winstedt's 1918 paper — and both are preserved in the record. The article itself casts doubt on the historicity of his Chinese wife Hang Li Po, noting that no Ming source knows her. Its infobox carries 'Sunni Islam', an editor's summary over the same tradition as the Malay edition's, so the two editions are one attestation family for faith purposes. No birth date is given."
