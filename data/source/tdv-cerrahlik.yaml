summary:
  ar: "مدخل «جراحة» في موسوعة TDV الإسلامية في قسمين: الأول تاريخ علم الجراحة من الحضارات القديمة إلى مدرسة الزهراوي والجراحين المسلمين، والثاني مهنة الجرّاح عند العثمانيين: تعلّمها، وجرّاحو القصر والبيمارستانات والجيش، وأجورهم وامتحان الحكيم باشي لهم."
  en: "The TDV İslâm Ansiklopedisi entry on surgery in two sections: I the history of surgical science from the ancient civilisations to al-Zahrawi and the Muslim surgeons, and II the Ottoman surgeon's profession: how it was learned, the palace, hospital and army surgeons, their wages and the hekimbaşı's examination and licensing of them."
  es: "La entrada de la TDV İslâm Ansiklopedisi sobre cirugía se divide en dos secciones: I) la historia de la ciencia quirúrgica desde las civilizaciones antiguas hasta al-Zahrawi y los cirujanos musulmanes, y II) la profesión de cirujano otomano: cómo se aprendía, los cirujanos de palacio, hospital y ejército, sus salarios y el examen y la concesión de licencias por parte del hekimbaşı."
  fr: "L'entrée de TDV İslâm Ansiklopedisi sur la chirurgie est divisée en deux sections: I l'histoire de la science chirurgicale des civilisations anciennes à al-Zahrawi et aux chirurgiens musulmans, et II la profession de chirurgien ottoman: comment elle était apprise, les chirurgiens du palais, de l'hôpital et de l'armée, leurs salaires et l'examen et l'agrément de l'hekimbaşı."
