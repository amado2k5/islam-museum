reliability_note: "The college's own institutional biography of its founder, consulted on 26 October 2026; the page carries no revision identifier, so this source is recorded in consultation-date form. It gives no birth or death years. It states that he lost his parents in early childhood and was raised by his uncle Sayyid Hamid Hussain at Lucknow, began as head maulvi of the newly founded Raj Kumar College, went to England at thirty-two and took a law degree, moved a resolution for women's education at the Educational Conference at Allahabad in 1890 which was repudiated, and on his arrival at Lucknow in 1912 founded the Muslim Girls' School at Kabootar Wali Kothi in Kaiserbagh, which later took his name."
