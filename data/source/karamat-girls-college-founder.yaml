  ar: "صفحة «المؤسس» في موقع كلية كرامت حسين الإسلامية للبنات بلَكْنَاو؛ تُستخدم لوقائع الكيان فقط. تروي نشأة القاضي سيد كرامت حسين يتيمًا في لكناو، وبدايته معلّمًا، وحصوله على شهادة القانون في إنجلترا، وقراره تعليم النساء في مؤتمر ألاهاباد التعليمي سنة 1890، وتأسيسه مدرسة البنات المسلمات في لكناو سنة 1912."
  en: "The 'founder' page of the Karamat Husain Muslim Girls P. G. College, Lucknow; used for entity facts only. It recounts Justice Sayyed Karamat Hussain's orphaned upbringing at Lucknow, his start as a teacher, his law degree in England, his 1890 resolution on women's education at the Allahabad Educational Conference, and his founding of the Muslim Girls' School at Lucknow in 1912."
