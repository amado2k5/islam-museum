summary:
  ar: "صفحة «المؤسس» في موقع كلية كرامت حسين الإسلامية للبنات بلَكْنَاو؛ تُستخدم لوقائع الكيان فقط. تروي نشأة القاضي سيد كرامت حسين يتيمًا في لكناو، وبدايته معلّمًا، وحصوله على شهادة القانون في إنجلترا، وقراره تعليم النساء في مؤتمر ألاهاباد التعليمي سنة 1890، وتأسيسه مدرسة البنات المسلمات في لكناو سنة 1912."
  en: "The 'founder' page of the Karamat Husain Muslim Girls P. G. College, Lucknow; used for entity facts only. It recounts Justice Sayyed Karamat Hussain's orphaned upbringing at Lucknow, his start as a teacher, his law degree in England, his 1890 resolution on women's education at the Allahabad Educational Conference, and his founding of the Muslim Girls' School at Lucknow in 1912."
  es: "La página del fundador del Karamat Husain Muslim Girls PG College de Lucknow se utiliza únicamente para información sobre la institución. En ella se narra la infancia huérfana del juez Sayyed Karamat Hussain en Lucknow, sus inicios como profesor, su licenciatura en derecho en Inglaterra, su resolución de 1890 sobre la educación de la mujer en la Conferencia Educativa de Allahabad y la fundación de la Escuela para Niñas Musulmanas de Lucknow en 1912."
  fr: "La page consacrée au fondateur du Karamat Husain Muslim Girls PG College de Lucknow est uniquement destinée à fournir des informations sur l'établissement. Elle retrace l'enfance orpheline du juge Sayyed Karamat Hussain à Lucknow, ses débuts comme enseignant, ses études de droit en Angleterre, sa résolution de 1890 sur l'éducation des femmes lors de la Conférence éducative d'Allahabad et la fondation de l'école pour filles musulmanes de Lucknow en 1912."
  ur: "کرامت حسین مسلم گرلز پی جی کالج، لکھنؤ کا 'بانی' صفحہ؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں لکھنؤ میں جسٹس سید کرامت حسین کی یتیم پرورش، بطور استاد ان کی شروعات، انگلینڈ میں قانون کی ڈگری، الہ آباد ایجوکیشنل کانفرنس میں خواتین کی تعلیم سے متعلق ان کی 1890 کی قرارداد اور 1912 میں لکھنؤ میں مسلم گرلز اسکول کے قیام کا ذکر ہے۔"
  tr: "Lucknow'daki Karamat Hussain İslami Koleji Kızlar için web sitesindeki \"Kurucu\" sayfası; yalnızca kurumun kayıtları için kullanılır. Yargıç Syed Karamat Hussain'in Lucknow'da yetim olarak yetiştirilmesini, öğretmenliğe başlamasını, İngiltere'de hukuk diploması almasını, 1890'da Allahabad Eğitim Konferansı'nda kadınları eğitme kararını ve 1912'de Lucknow'da Müslüman kızlar okulunu kurmasını anlatır."
  id: "Halaman \"Pendiri\" di situs web Karamat Hussain Islamic College for Girls di Lucknow; hanya digunakan untuk catatan entitas. Halaman ini menceritakan masa kecil Hakim Syed Karamat Hussain sebagai yatim piatu di Lucknow, awal kariernya sebagai guru, meraih gelar hukum di Inggris, keputusannya untuk mendidik perempuan di Konferensi Pendidikan Allahabad tahun 1890, dan pendirian sekolah perempuan Muslim di Lucknow pada tahun 1912."
