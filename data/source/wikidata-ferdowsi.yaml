summary:
  ar: "عنصر ويكي بيانات Q4784346 لأراش فردوسي، ثُبّت عبر خصائص صفحة المقالة الإنجليزية؛ يُستخدم لوقائع الكيان فقط. يعطي ولادته 7 أكتوبر 1985 في أوفرلاند بارك، ويحمل قيمة وحيدة للدين هي الإسلام الشيعي عمومًا (Q9585) لا تؤيدها أي مقالة."
  en: "Wikidata item Q4784346 for Arash Ferdowsi, grounded through the English article's pageprops; used for entity facts only. It gives his birth as 7 October 1985 at Overland Park, and carries a single religion value — Shia Islam in general (Q9585) — that no article text supports."
  es: "El elemento de Wikidata Q4784346 para Arash Ferdowsi, basado en los pageprops del artículo en inglés, se utiliza únicamente para datos de la entidad. Indica que nació el 7 de octubre de 1985 en Overland Park y contiene un único valor religioso: el islam chiíta en general (Q9585), que no está respaldado por el texto del artículo."
  fr: "L'élément Wikidata Q4784346 concernant Arash Ferdowsi, basé sur les propriétés de la page de l'article en anglais, est utilisé uniquement pour les informations relatives à l'entité. Il indique sa date de naissance, le 7 octobre 1985, à Overland Park, et ne mentionne que l'islam chiite (Q9585), une information non étayée par le texte de l'article."
  ur: "وکی ڈیٹا آئٹم Q4784346 عرش فردوسی کے لیے، انگریزی مضمون کے صفحہ پروپس کے ذریعے۔ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی پیدائش 7 اکتوبر 1985 کو اوورلینڈ پارک میں ہوئی ہے، اور اس میں ایک ہی مذہب کی قدر ہے - عمومی طور پر شیعہ اسلام (Q9585) - جس کی کوئی مضمون متن کی حمایت نہیں کرتا ہے۔"
