summary:
  ar: "ورقة طاهر الجمل المؤسِّسة في IEEE Transactions on Information Theory ⁦(المجلد 31، العدد 4، يوليو 1985)⁩، اقترحت نظام التعمية بمفتاح عمومي ومخطط التوقيع اللذين يحملان اسمه، وأصبح مخطط التوقيع أساس خوارزمية التوقيع الرقمي DSA."
  en: "Taher Elgamal's founding paper in IEEE Transactions on Information Theory ⁦(vol. 31, no. 4, July 1985)⁩, which proposed the public-key cryptosystem and the signature scheme that carry his name; the signature scheme became the basis of the Digital Signature Algorithm."
  es: "El artículo fundacional de Taher Elgamal en IEEE Transactions on Information Theory (vol. 31, n.º 4, julio de 1985), que proponía el criptosistema de clave pública y el esquema de firma que llevan su nombre; dicho esquema de firma se convirtió en la base del algoritmo de firma digital."
  fr: "L'article fondateur de Taher Elgamal dans IEEE Transactions on Information Theory (vol. 31, no. 4, juillet 1985), qui proposait le cryptosystème à clé publique et le schéma de signature qui porte son nom; le schéma de signature est devenu la base de l'algorithme de signature numérique."
  ur: "IEEE ٹرانزیکشنز آن انفارمیشن تھیوری میں طاہر ایلگمل کا بانی پیپر ⁦(جلد 31، نمبر 4، جولائی 1985)⁩، جس میں عوامی کلیدی کرپٹو سسٹم اور دستخطی اسکیم کی تجویز پیش کی گئی جس میں ان کا نام ہے؛ دستخطی اسکیم ڈیجیٹل دستخط الگورتھم کی بنیاد بن گئی۔"
  tr: "Tahir Al-Jamal'ın IEEE Transactions on Information Theory'deki makalesi (Cilt 31, Sayı 4, Temmuz 1985), açık anahtarlı bir şifreleme sistemi ve onun adını taşıyan imza şeması önerdi ve imza şeması DSA algoritmasının temelini oluşturdu."
  id: "Makalah Tahir Al-Jamal di IEEE Transactions on Information Theory (Vol. 31, No. 4, Juli 1985) mengusulkan sistem enkripsi kunci publik dan skema tanda tangan yang menggunakan namanya, dan skema tanda tangan menjadi dasar algoritma DSA."
