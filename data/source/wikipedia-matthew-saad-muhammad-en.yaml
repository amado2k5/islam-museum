  ar: "مقالة ويكيبيديا الإنجليزية عن ماثيو سعد محمد؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 16 يونيو 1954 في فيلادلفيا ووفاته في 25 مايو 2014 فيها، وسجله 39 فوزاً و16 خسارة و3 تعادلات، ولقب المجلس العالمي للملاكمة في وزن خفيف الثقيل من 1979 إلى 1981، وطفولته يتيماً أخذته النُّسّاك اسماً، واعتناقه الإسلام بعد فوزه باللقب وتغيير اسمه."
  en: "English Wikipedia article on Matthew Saad Muhammad; used for entity facts only. It gives his birth on 16 June 1954 in Philadelphia and his death there on 25 May 2014, his record of 39 wins, 16 losses and 3 draws, the WBC light heavyweight title from 1979 to 1981, his childhood as an abandoned orphan named by nuns, and his conversion to Islam after winning the title and his change of name."
