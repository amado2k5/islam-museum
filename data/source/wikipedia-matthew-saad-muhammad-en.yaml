summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ماثيو سعد محمد؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 16 يونيو 1954 في فيلادلفيا ووفاته في 25 مايو 2014 فيها، وسجله 39 فوزاً و16 خسارة و3 تعادلات، ولقب المجلس العالمي للملاكمة في وزن خفيف الثقيل من 1979 إلى 1981، وطفولته يتيماً أخذته النُّسّاك اسماً، واعتناقه الإسلام بعد فوزه باللقب وتغيير اسمه."
  en: "English Wikipedia article on Matthew Saad Muhammad; used for entity facts only. It gives his birth on 16 June 1954 in Philadelphia and his death there on 25 May 2014, his record of 39 wins, 16 losses and 3 draws, the WBC light heavyweight title from 1979 to 1981, his childhood as an abandoned orphan named by nuns, and his conversion to Islam after winning the title and his change of name."
  es: "Artículo de la Wikipedia en inglés sobre Matthew Saad Muhammad; utilizado únicamente para datos sobre la persona. En él se indica que nació el 16 de junio de 1954 en Filadelfia y falleció allí el 25 de mayo de 2014, su récord de 39 victorias, 16 derrotas y 3 empates, el título de peso semipesado del CMB de 1979 a 1981, su infancia como huérfano abandonado al que unas monjas le pusieron nombre, y su conversión al Islam tras ganar el título y cambiar de nombre."
  fr: "Article de Wikipédia en anglais sur Matthew Saad Muhammad; utilisé uniquement pour les informations le concernant. Il indique sa naissance le 16 juin 1954 à Philadelphie et son décès dans la même ville le 25 mai 2014, son palmarès de 39 victoires, 16 défaites et 3 matchs nuls, son titre de champion WBC des mi-lourds de 1979 à 1981, son enfance d’orphelin abandonné et baptisé par des religieuses, ainsi que sa conversion à l’islam après avoir remporté le titre et changé de nom."
  ur: "میتھیو سعد محمد پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 16 جون 1954 کو فلاڈیلفیا میں اس کی پیدائش اور 25 مئی 2014 کو وہیں اس کی موت، اس کا ریکارڈ 39 جیت، 16 ہار اور 3 ڈرا، 1979 سے 1981 تک ڈبلیو بی سی لائٹ ہیوی ویٹ ٹائٹل، اس کا بچپن ایک لاوارث یتیم کے طور پر گزرا جس کا نام راہباؤں نے رکھا تھا، اور اس کا نام تبدیل کرنے کے بعد اسلام کا نام تبدیل کیا تھا۔"
  tr: "Matthew Saad Muhammad hakkında İngilizce Wikipedia makalesi; sadece varlık bilgileri için kullanılmıştır. 16 Haziran 1954'te Philadelphia'da doğdu ve 25 Mayıs 2014'te vefat etti; 39 galibiyet, 16 mağlubiyet ve 3 beraberlik kaydetti. 1979'dan 1981'e kadar Dünya Boks Konseyi hafif ağır sıklet kategorisinde şampiyon oldu. Yetimdi ve adı münzeviler tarafından benimsendi ve unvanı kazanıp adını değiştirdikten sonra İslam'a geçti."
  id: "Artikel Wikipedia bahasa Inggris tentang Matthew Saad Muhammad; hanya digunakan untuk fakta entitas. Ia lahir pada 16 Juni 1954 di Philadelphia dan meninggal pada 25 Mei 2014, di mana ia mencatat 39 kemenangan, 16 kekalahan, dan 3 seri. Ia memegang gelar World Boxing Council di kategori kelas berat ringan dari tahun 1979 hingga 1981. Ia adalah seorang yatim piatu yang namanya diadopsi oleh para pertapa, dan ia memeluk Islam setelah memenangkan gelar dan mengganti namanya."
