reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision, fetched by revision id and the returned revision asserted equal. Its infobox gives his birth name as Maxwell Antonio Loach (formerly Matthew Franklin), his birth on 16 June 1954 and death on 25 May 2014, both in Philadelphia, and his record of 39 wins (29 by knockout), 16 losses and 3 draws. Its background section, citing a Resources for Human Development profile and Nigel Collins in The Ring (July 1981), tells of his abandonment at five on the Benjamin Franklin Parkway, the name Matthew Franklin given him by nuns of Catholic Social Services, and his adoption. On religion, the text states that he was one of a group of light heavyweight champions who became Muslims and changed their names, that he confirmed this in interviews after his career (citing a Philadelphia magazine profile of 26 July 2011), and that shortly after winning the world title in April 1979 he converted to Islam and changed his name. The article names no school or branch for him; its categories (Converts to Islam from Christianity, African-American Muslims) are filings."
