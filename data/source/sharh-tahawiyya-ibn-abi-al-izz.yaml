reliability_note: "The classical text is public domain; the editor's introduction and footnotes belong to the edition and are not used. Page numbers cited are the printed pages, which are the PDF pages minus four (PDF page 271 prints 267). The scan is OCR with some misreadings, so quotations were compared with it allowing for that. The author's dates (731 to 792) come from the title page; the editor's name is partly illegible on the title page and must be confirmed against a physical copy before the source is marked reviewed."
