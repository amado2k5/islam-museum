summary:
  ar: "شرح ابن أبي العز الحنفي ⁦(731 إلى 792هـ)⁩ للعقيدة الطحاوية في طبعة دار الحديث بالقاهرة سنة 1421هـ ⁦(2000م)⁩، وفيه ينقل أقوال الناس في كل مسألة ويناقشها."
  en: "Ibn Abi al-Izz al-Hanafi's (731 to 792 AH) commentary on the Tahawi creed in the Dar al-Hadith edition (Cairo, 1421 AH / 2000), in which he reports people's positions on each question and discusses them."
  es: "El comentario de Ibn Abi al-Izz al-Hanafi (731 a 792 AH) sobre el credo Tahawi en la edición Dar al-Hadith (El Cairo, 1421 AH / 2000), en el que recoge las posturas de la gente sobre cada cuestión y las analiza."
  fr: "Le commentaire d'Ibn Abi al-Izz al-Hanafi (731 à 792 AH) sur la croyance Tahawi dans l'édition Dar al-Hadith (Le Caire, 1421 AH / 2000), dans lequel il rapporte les positions des gens sur chaque question et les discute."
  ur: "دارالحدیث ایڈیشن ⁦(قاہرہ، 1421ھ / 2000)⁩ میں ابن ابی العز الحنفی کی ⁦(731 تا 792 ہجری)⁩ طحاوی عقیدہ کی تفسیر، جس میں وہ ہر سوال پر لوگوں کے موقف بیان کرتے ہیں اور ان پر بحث کرتے ہیں۔"
  tr: "İbn Ebi el-İzz el-Hanefi (731 - 792 H) 1421 Hicri (2000 M.S.) yılında Kahire'deki Dar al-Hadis baskısında Tahavi inancını açıklamış ve her konuda insanların görüşlerini aktarmış ve tartışmıştır."
  id: "Ibn Abi al-Izz al-Hanafi (731 hingga 792 H) menjelaskan kredo Tahawi dalam edisi Dar al-Hadith di Kairo pada tahun 1421 H (2000 M), di mana ia menyampaikan dan membahas pendapat masyarakat tentang setiap isu."
