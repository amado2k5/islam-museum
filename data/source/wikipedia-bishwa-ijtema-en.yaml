reliability_note: "Pointer for entity facts only, used where the article cites a source: the first conference at Kakrail Mosque in 1946 and the gatherings at Chittagong (1954), Siddhirganj (1958) and Ramna (1960, 1962, 1965), the move to Tongi in 1967 and the 160-acre ground from 1972 (Banglapedia; Prothom Alo, 24 January 2014); organisation by the Bangladeshi Tablighi Jamaat with state help (The Business Standard, 3 February 2024); attendance estimates of 2 million in 2001 (Banglapedia), 5 million around 2010 (The Telegraph, 7 January 2016), 2 million in 2018 (Al Jazeera, 24 January 2018) and 4 million in 2023 (Prothom Alo, 15 January 2023); 20,000 to 50,000 foreign participants in 2007 (Reuters, 2 February 2007); the 2008 curtailment for weather (The Daily Star, 26 January 2008); the 2018 final prayer in Bengali; the 2024 phases and the fourteen deaths during the first (Prothom Alo/UNB, 4 February 2024); the December 2024 clashes between the two factions (BBC Bangla, 18 December 2024). Rankings against other gatherings and uncited lines are not used. Read in Chrome on 6 November 2026."
