summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أنور إبراهيم ⁦(وُلد 1947)⁩؛ تُستخدم لوقائع الكيان فقط. تروي مولده في بينانغ وتعليمه في الكلية المالايوية وجامعة مالايا، وقيادته لحركة أبيم واعتقاله 1974–1975، وصعوده في أمنو عبر وزارتي التعليم والمالية إلى نيابة رئاسة الوزراء، وإقالته سنة 1998 وسجنه وإطلاقه سنة 2004، وقيادته للمعارضة وسجنه الثاني، وتولّيه رئاسة الوزراء عاشرا في 24 نوفمبر 2022."
  en: "English Wikipedia article on Anwar Ibrahim (born 1947); used for entity facts only. It recounts his Penang birth and his Malay College and University of Malaya education, his ABIM leadership and 1974–1975 detention, his UMNO rise through the education and finance ministries to the deputy premiership, his 1998 sacking, imprisonment and 2004 release, his opposition leadership and second imprisonment, and his swearing-in as tenth prime minister on 24 November 2022."
  es: "Artículo de la Wikipedia en inglés sobre Anwar Ibrahim (nacido en 1947); utilizado únicamente para datos sobre la persona. Relata su nacimiento en Penang y su educación en el Malay College y la Universidad de Malaya, su liderazgo en el ABIM y su detención entre 1974 y 1975, su ascenso en la UMNO a través de los ministerios de educación y finanzas hasta el cargo de viceprimer ministro, su destitución en 1998, su encarcelamiento y su liberación en 2004, su liderazgo en la oposición y su segundo encarcelamiento, y su toma de posesión como décimo primer ministro el 24 de noviembre de 2022."
  fr: "Article de Wikipédia en anglais sur Anwar Ibrahim (né en 1947); utilisé uniquement à des fins d’information sur l’entité. Il relate sa naissance à Penang et ses études au Malay College et à l’Université de Malaya, son rôle à la tête de l’ABIM et sa détention de 1974-1975, son ascension au sein de l’UMNO à travers les ministères de l’Éducation et des Finances jusqu’au poste de vice-Premier ministre, son limogeage en 1998, son emprisonnement et sa libération en 2004, son rôle à la tête de l’opposition et sa seconde incarcération, et sa prestation de serment comme dixième Premier ministre le 24 novembre 2022."
  ur: "انور ابراہیم ⁦(پیدائش 1947)⁩ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کی پینانگ کی پیدائش اور اس کے مالے کالج اور یونیورسٹی آف ملایا کی تعلیم، اس کی ABIM کی قیادت اور 1974-1975 کی نظربندی، اس کی UMNO کی تعلیم اور مالیات کی وزارتوں کے ذریعے نائب وزیراعظم کے عہدے تک اضافہ، اس کی 1998 میں برطرفی، قید اور 2004 کی رہائی، اس کی اپوزیشن لیڈر شپ اور 10 نومبر کو وزیر اعظم کے عہدے پر رہنے کا ذکر ہے۔ 2022۔"
  tr: "Anwar Ibrahim (1947 doğumlu) hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Penang'daki doğumunu, Malavi Koleji ve Malaya Üniversitesi'ndeki eğitimini, APIM hareketindeki liderliğini ve 1974–1975 yıllarındaki tutuklanışını, Amno'da Eğitim ve Maliye Bakanlıkları aracılığıyla başbakan yardımcılığına yükselmesini, 1998'de görevden alınmasını, 2004'te hapsedilmesini ve serbest bırakılmasını, muhalefet liderliğini ve ikinci kez hapsedilmesini, ayrıca 24 Kasım 2022'de başbakanlığa onuncu kez atanışını anlatmaktadır."
  id: "Artikel Wikipedia bahasa Inggris tentang Anwar Ibrahim (lahir 1947); digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya di Penang, pendidikannya di Malawi College dan Universitas Malaya, kepemimpinannya dalam gerakan APIM dan penangkapannya pada 1974–1975, kenaikannya di Amno melalui Kementerian Pendidikan dan Keuangan hingga menjadi wakil perdana menteri, pemecatannya pada 1998, penahanan dan pembebasannya pada 2004, kepemimpinannya di oposisi dan penahanan keduanya, serta pengangkatan kesepuluhnya sebagai perdana menteri pada 24 November 2022."
