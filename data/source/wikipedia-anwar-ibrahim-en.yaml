summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أنور إبراهيم (وُلد 1947)؛ تُستخدم لوقائع الكيان فقط. تروي مولده في بينانغ وتعليمه في الكلية المالايوية وجامعة مالايا، وقيادته لحركة أبيم واعتقاله 1974–1975، وصعوده في أمنو عبر وزارتي التعليم والمالية إلى نيابة رئاسة الوزراء، وإقالته سنة 1998 وسجنه وإطلاقه سنة 2004، وقيادته للمعارضة وسجنه الثاني، وتولّيه رئاسة الوزراء عاشرا في 24 نوفمبر 2022."
  en: "English Wikipedia article on Anwar Ibrahim (born 1947); used for entity facts only. It recounts his Penang birth and his Malay College and University of Malaya education, his ABIM leadership and 1974–1975 detention, his UMNO rise through the education and finance ministries to the deputy premiership, his 1998 sacking, imprisonment and 2004 release, his opposition leadership and second imprisonment, and his swearing-in as tenth prime minister on 24 November 2022."
