summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن إبراهيم قالن ⁦(وُلد في 15 أيلول 1971 في إسطنبول)⁩، رئيس الاستخبارات الوطنية التركية منذ حزيران 2023 والأكاديمي المتخصص في الفلسفة الإسلامية؛ تذكر دكتوراهه في جامعة جورج واشنطن بإشراف سيد حسين نصر وكتبه عن ملا صدرا وناطقِيّته الرئاسية (2014–2023)."
  en: "English Wikipedia article on İbrahim Kalın (born 15 September 1971 in Istanbul), director of Turkey's National Intelligence Organization since June 2023 and an academic of Islamic philosophy; it records his George Washington University doctorate under Seyyed Hossein Nasr, his books on Mulla Sadra and his presidential spokespersonship (2014-2023)."
  es: "Artículo de la Wikipedia en inglés sobre İbrahim Kalın (nacido el 15 de septiembre de 1971 en Estambul), director de la Organización Nacional de Inteligencia de Turquía desde junio de 2023 y académico de filosofía islámica; en él se recoge su doctorado por la Universidad George Washington bajo la dirección de Seyyed Hossein Nasr, sus libros sobre Mulla Sadra y su cargo como portavoz presidencial (2014-2023)."
  fr: "Article de Wikipédia en anglais sur İbrahim Kalın (né le 15 septembre 1971 à Istanbul), directeur de l'Organisation nationale du renseignement turque depuis juin 2023 et universitaire spécialiste de philosophie islamique; il mentionne son doctorat de l'Université George Washington sous la direction de Seyyed Hossein Nasr, ses livres sur Mulla Sadra et son rôle de porte-parole de la présidence (2014-2023)."
  ur: "ابراہیم کالن ⁦(پیدائش 15 ستمبر 1971 استنبول)⁩ پر انگریزی ویکیپیڈیا کا مضمون، جون 2023 سے ترکی کی نیشنل انٹیلی جنس آرگنائزیشن کے ڈائریکٹر اور اسلامی فلسفہ کے ایک ماہر؛ اس میں سید حسین نصر کے تحت جارج واشنگٹن یونیورسٹی کی ڈاکٹریٹ، ملا صدرا اور ان کے صدارتی ترجمان (2014-2023) پر ان کی کتابیں درج ہیں۔"
