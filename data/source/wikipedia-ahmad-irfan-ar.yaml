reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It names him Ahmad ibn Muhammad Irfan ibn Nur al-Sharif al-Hasani al-Barelvi, known as al-Shahid, and gives his birth as 6 Safar 1201 AH = 28 November 1786 — one day earlier than the English and Urdu articles give for the same Hijri date. It records that he studied at Shah Waliullah's school in Delhi, gave bay'ah to Shah Abdul Aziz Dehlavi and took the tariqa (the Sufi path) from him, served in Amir Khan of Tonk's army, was proclaimed amir by the scholars and chiefs on 12 Jumada al-Akhira 1242 AH, and was killed at Balakot on Friday 24 Dhu al-Qa'da 1246 AH = 6 May 1831. It names no madhhab for him in its text; its category filing under 'Hanafis' is a filing, not an attestation, and is not counted."
