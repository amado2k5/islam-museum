summary:
  ar: "مقالة ويكيبيديا العربية «أحمد عرفان» عن أحمد بن محمد عرفان البريلوي الشهيد؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في 6 صفر 1201هـ الموافق 28 نوفمبر 1786م في رائي بريلي، ومبايعته للشاه عبد العزيز الدهلوي وأخذه الطريقة عنه، ووفاته في بالاكوت في 24 ذي القعدة 1246هـ الموافق 6 مايو 1831م."
  en: "Arabic Wikipedia article 'Ahmad Irfan' on Ahmad ibn Muhammad Irfan al-Barelvi, 'al-Shahid'; used for entity facts only. It gives his birth on 6 Safar 1201 AH, corresponding to 28 November 1786, at Rae Bareli, his bay'ah to Shah Abdul Aziz Dehlavi and taking the tariqa from him, and his death at Balakot on 24 Dhu al-Qa'da 1246 AH, 6 May 1831."
