  ar: "مقالة ويكيبيديا العربية عن بندر بليلة؛ تُستخدم لوقائع الكيان فقط. تذكر ميلاده بمكة سنة 1395هـ ودراسته وحفظه القرآن صغيرًا، وتعيينه إمامًا وخطيبًا بالمسجد الحرام ومفوضًا للإفتاء بمنطقة مكة، وعضويته في هيئة كبار العلماء، وخطبة عرفة سنة 1442هـ."
  en: "Arabic Wikipedia article on Bandar Baleela; used for entity facts only. It records his birth in Mecca in 1395 AH, his childhood memorisation of the Qur'an and his studies, his appointment as imam and khatib of Masjid al-Haram and as fatwa commissioner for the Makkah region, his membership of the Council of Senior Scholars, and the Arafat sermon of 1442 AH."
