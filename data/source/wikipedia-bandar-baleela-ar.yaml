reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 at the recorded revision (revid asserted equal before use). It gives Bandar bin Abdul Aziz Baleela, born in Mecca in 1395 AH; memorised the Qur'an while young; bachelor's at Umm al-Qura, master's in fiqh there in 1422 AH, doctorate in fiqh at the Islamic University of Madinah in 1429 AH; imam and khatib of Masjid al-Haram, assistant professor at Taif University, appointed fatwa commissioner for the Makkah region, member of the Council of Senior Scholars, and preacher of the Arafat sermon in 1442 AH. Its infobox names no school or creed for him."
