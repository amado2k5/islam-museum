summary:
  ar: "مقالة ويكيبيديا العربية عن بندر بليلة؛ تُستخدم لوقائع الكيان فقط. تذكر ميلاده بمكة سنة 1395هـ ودراسته وحفظه القرآن صغيرًا، وتعيينه إمامًا وخطيبًا بالمسجد الحرام ومفوضًا للإفتاء بمنطقة مكة، وعضويته في هيئة كبار العلماء، وخطبة عرفة سنة 1442هـ."
  en: "Arabic Wikipedia article on Bandar Baleela; used for entity facts only. It records his birth in Mecca in 1395 AH, his childhood memorisation of the Qur'an and his studies, his appointment as imam and khatib of Masjid al-Haram and as fatwa commissioner for the Makkah region, his membership of the Council of Senior Scholars, and the Arafat sermon of 1442 AH."
  es: "Artículo en árabe de la Wikipedia sobre Bandar Baleela; utilizado únicamente para datos sobre la persona. En él se registra su nacimiento en La Meca en 1395 AH, su memorización del Corán durante su infancia y sus estudios, su nombramiento como imán y khatib de la Mezquita Sagrada (Masjid al-Haram) y como comisionado de fatuas para la región de La Meca, su pertenencia al Consejo de Altos Eruditos y el sermón de Arafat de 1442 AH."
  fr: "Article de Wikipédia en arabe sur Bandar Baleela; utilisé uniquement à des fins d’information sur l’entité. Il relate sa naissance à La Mecque en 1395 AH, sa mémorisation du Coran durant son enfance et ses études, sa nomination comme imam et khatib de la Masjid al-Haram et comme commissaire aux fatwas pour la région de La Mecque, son appartenance au Conseil des grands oulémas et le sermon d’Arafat de 1442 AH."
  ur: "بندر بلیلہ پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں مکہ میں ان کی پیدائش 1395 ہجری، ان کا بچپن حفظ قرآن اور ان کا مطالعہ، مسجد الحرام کے امام اور خطیب کے طور پر ان کی تقرری اور مکہ مکرمہ کے علاقے کے فتوی کمشنر کے طور پر، سینئر علماء کی کونسل میں ان کی رکنیت اور 1442 ہجری کے عرفات کے خطبہ کو درج کیا گیا ہے۔"
