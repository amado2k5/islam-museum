reliability_note: "Peer-reviewed scholarly encyclopedia entry, read in full in the online edition on 1 November 2026 (article last updated 9 May 2018). Bregel, following the Sharafnama-ye shahi, puts his birth in the Year of the Dragon — 1532–33 CE, 938–39 AH — records the seizure of Bukhara in 964/1557, his father Eskandar's figurehead khanship from 968/1561, ʿAbdallāh's own proclamation as khan in 991/1583, the conquests of Balkh, Tashkent, Fergana, Badakhshan, Khorasan and Khwarazm, and states that he died in Samarkand in 1006/1598 at the start of his campaign against the Qazaqs. It documents his reliance on the Juybari Naqshbandi shaikhs as patronage and political support; it names no legal school for him personally."
