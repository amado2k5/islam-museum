summary:
  ar: "مقالة ويكيبيديا العربية عن محمد ضياء الحق؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 12 أغسطس 1924 ووفاته في 17 أغسطس 1988، وتعليمه في كلية سانت ستيفن بدلهي، ومهمته في الأردن، وتعيينه قائدا للجيش سنة 1976، وانقلاب 1977 ورئاسته، ودوره في الحرب السوفيتية الأفغانية. وليس فيها أي محتوى ديني."
  en: "Arabic Wikipedia article on Muhammad Zia-ul-Haq; used for entity facts only. It gives his birth on 12 August 1924 and death on 17 August 1988, his education at St Stephen's College, Delhi, his Jordan mission, his appointment as army chief in 1976, the 1977 coup and his presidency, and his role in the Soviet–Afghan War. It has no religion content."
  es: "Artículo de Wikipedia en árabe sobre Muhammad Zia-ul-Haq; se utiliza únicamente para datos biográficos. Menciona su fecha de nacimiento (12 de agosto de 1924) y su fallecimiento (17 de agosto de 1988), su educación en el St. Stephen's College de Delhi, su misión en Jordania, su nombramiento como jefe del ejército en 1976, el golpe de Estado de 1977 y su presidencia, así como su papel en la guerra soviético-afgana. No contiene contenido religioso."
  fr: "Article de Wikipédia en arabe sur Muhammad Zia-ul-Haq; utilisé uniquement pour des informations biographiques. Il mentionne sa naissance le 12 août 1924 et son décès le 17 août 1988, ses études au St Stephen's College de Delhi, sa mission en Jordanie, sa nomination comme chef d'état-major de l'armée en 1976, le coup d'État de 1977 et sa présidence, ainsi que son rôle dans la guerre soviéto-afghane. Il ne contient aucun élément religieux."
  ur: "محمد ضیاء الحق پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 12 اگست 1924 کو ان کی پیدائش اور 17 اگست 1988 کو موت، سینٹ اسٹیفن کالج، دہلی میں ان کی تعلیم، ان کے اردن مشن، 1976 میں آرمی چیف کے طور پر ان کی تقرری، 1977 کی بغاوت اور ان کی صدارت، اور سوویت افغان جنگ میں ان کے کردار کا ذکر کرتا ہے۔ اس میں کوئی مذہبی مواد نہیں ہے۔"
  tr: "Muhammed Zia-ul-Haq hakkında Arapça Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılır. Makalede 12 Ağustos 1924'teki doğumu, 17 Ağustos 1988'deki ölümü, Delhi'deki St. Stephen's College'daki eğitimi, Ürdün'deki görevi, 1976'da ordu komutanı olarak atanması, 1977 darbesi ve başkanlığı ile Sovyet-Afgan savaşındaki rolü yer alır. Dini içerik içermez."
  id: "Artikel Wikipedia berbahasa Arab tentang Muhammad Zia-ul-Haq; hanya digunakan untuk fakta entitas. Artikel tersebut menyebutkan kelahirannya pada 12 Agustus 1924, kematiannya pada 17 Agustus 1988, pendidikannya di St. Stephen's College di Delhi, misinya di Yordania, pengangkatannya sebagai komandan tentara pada 1976, kudeta 1977 dan masa kepresidenannya, serta perannya dalam perang Soviet-Afghanistan. Artikel ini tidak memuat konten keagamaan."
