  ar: "مقالة ويكيبيديا العربية عن محمد ضياء الحق؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 12 أغسطس 1924 ووفاته في 17 أغسطس 1988، وتعليمه في كلية سانت ستيفن بدلهي، ومهمته في الأردن، وتعيينه قائدا للجيش سنة 1976، وانقلاب 1977 ورئاسته، ودوره في الحرب السوفيتية الأفغانية. وليس فيها أي محتوى ديني."
  en: "Arabic Wikipedia article on Muhammad Zia-ul-Haq; used for entity facts only. It gives his birth on 12 August 1924 and death on 17 August 1988, his education at St Stephen's College, Delhi, his Jordan mission, his appointment as army chief in 1976, the 1977 coup and his presidency, and his role in the Soviet–Afghan War. It has no religion content."
