  fr: "Page du Kennedy Center consacrée au spectacle de Sariyah Idan sur la Millennium Stage (2 août 2016); utilisée uniquement à titre informatif. Elle y est décrite comme une auteure-compositrice-interprète originaire de New York et installée à Los Angeles, formée au jazz et influencée par les sonorités de ses racines juives."
