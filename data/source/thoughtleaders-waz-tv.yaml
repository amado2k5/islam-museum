reliability_note: "Platform statistics aggregator, not a museum-verified fact: the page, opened on 8 November 2026, gives 886,000 subscribers (887,000 in its own prose), about 138 million total views and nearly 4,500 videos — about 1,000 of them uploaded in the last two years — an average of about six uploads a week, a first upload on 5 February 2017 and the channel country set to the United States; it describes the channel as one of the largest producers of Bangladeshi Islamic lecture content (waz mahfil) in Bengali. The page does not expose the channel's exact YouTube handle, and no vidIQ page for the channel was found, so no handle is asserted in this museum's record. ThoughtLeaders' sponsorship and pricing figures are modelled and are not used."
