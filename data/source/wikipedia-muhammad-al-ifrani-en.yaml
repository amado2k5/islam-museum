summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد الصغير الإفراني؛ تُستخدم لوقائع الكيان فقط. تعطي اسمه الكامل ولقبه «الصغير» وميلاده بمراكش سنة 1669/1670 ووفاته نحو 1742/1743، ودراسته بمراكش ثم بالقرويين بفاس، وقائمة مؤلفاته وعلى رأسها «نزهة الحادي» و«صفوة من انتشر»."
  en: "English Wikipedia article on Mohammed al-Ifrani; used for entity facts only. It gives his full name, his byname al-Saghir, his birth at Marrakesh in 1669/1670 and death about 1742/1743, his studies at Marrakesh and at al-Qarawiyyin in Fes, and his works, headed by the Nuzhat al-Hadi chronicle of the Saadian sultans and the Safwat man Intashar biographies."
  es: "Artículo de la Wikipedia en inglés sobre Mohammed al-Ifrani; utilizado únicamente para datos biográficos. En él se indica su nombre completo, su sobrenombre al-Saghir, su nacimiento en Marrakech en 1669/1670 y su fallecimiento alrededor de 1742/1743, sus estudios en Marrakech y en al-Qarawiyyin en Fez, y sus obras, encabezadas por la crónica Nuzhat al-Hadi sobre los sultanes saadíes y las biografías de Safwat man Intashar."
  fr: "Article de Wikipédia en anglais sur Mohammed al-Ifrani; utilisé uniquement pour les informations factuelles. Il indique son nom complet, son surnom al-Saghir, sa naissance à Marrakech en 1669/1670 et sa mort vers 1742/1743, ses études à Marrakech et à al-Qarawiyyin à Fès, ainsi que ses œuvres, notamment la chronique Nuzhat al-Hadi sur les sultans saadiens et les biographies Safwat man Intashar."
  ur: "محمد العفرانی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کا پورا نام، اس کا نام الصغیر، اس کی پیدائش 1669/1670 میں اور وفات تقریباً 1742/1743، مراکیش میں اس کی تعلیم اور فیس میں القرویین میں، اور ان کی تخلیقات، جس کی سربراہی سعدی سلطانوں اور انسانوں کی سوانح عمری کے نزہت الہادی کی طرف سے کی گئی ہے۔"
  tr: "Muhammed el-Saghir el-İfrani hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Tam adı, soyadı 'el-Saghir', 1669/1670'te Marakeş'teki doğumu, yaklaşık 1742/1743 civarındaki ölümü, Marakeş'teki ve ardından Fez'deki Al-Karawiyyin'deki çalışmaları ile 'Nuzhat al-Hadi' ve 'Yayıcıların Elitleri' gibi eserlerinin bir listesini vermektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Muhammad al-Saghir al-Ifrani; digunakan hanya untuk fakta entitas. Artikel ini mencantumkan nama lengkap, nama belakang, 'al-Saghir,' kelahirannya di Marrakesh pada tahun 1669/1670, kematiannya sekitar tahun 1742/1743, studinya di Marrakech dan kemudian di Al-Qarawiyyin di Fez, serta daftar karyanya, yang paling utama di antaranya 'Nuzhat al-Hadi' dan 'The Elite of the Spreaders.'"
