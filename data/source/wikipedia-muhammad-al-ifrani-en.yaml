  ar: "مقالة ويكيبيديا الإنجليزية عن محمد الصغير الإفراني؛ تُستخدم لوقائع الكيان فقط. تعطي اسمه الكامل ولقبه «الصغير» وميلاده بمراكش سنة 1669/1670 ووفاته نحو 1742/1743، ودراسته بمراكش ثم بالقرويين بفاس، وقائمة مؤلفاته وعلى رأسها «نزهة الحادي» و«صفوة من انتشر»."
  en: "English Wikipedia article on Mohammed al-Ifrani; used for entity facts only. It gives his full name, his byname al-Saghir, his birth at Marrakesh in 1669/1670 and death about 1742/1743, his studies at Marrakesh and at al-Qarawiyyin in Fes, and his works, headed by the Nuzhat al-Hadi chronicle of the Saadian sultans and the Safwat man Intashar biographies."
