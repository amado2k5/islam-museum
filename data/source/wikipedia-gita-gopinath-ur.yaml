summary:
  ar: "مقالة ويكيبيديا الأردية عن جيتا غوبيناث؛ تُستخدم لوقائع الكيان فقط. تذكر مولدها سنة 1971 بكلکتا ومنصبَيها في صندوق النقد الدولي، وتنص على أن «أسرتها مليالية هندوسية»، وتصنفها ملفاتها في فئتي «أمريكيون هندوس» و«هنود هندوس»."
  en: "Urdu Wikipedia article on Gita Gopinath; used for entity facts only. It gives her 1971 Kolkata birth and her IMF posts, states in its text that 'her family is Malayali Hindu', and files her under the categories 'American Hindus' and 'Indian Hindus'."
  es: "Artículo de Wikipedia en urdu sobre Gita Gopinath; utilizado únicamente para obtener información sobre la persona. Indica que nació en Calcuta en 1971 y que ocupó cargos en el FMI, afirma en su texto que \"su familia es hindú malayali\" y la clasifica dentro de las categorías de \"hindúes estadounidenses\" e \"hindúes indios\"."
  fr: "Article Wikipédia en ourdou sur Gita Gopinath; utilisé uniquement à titre informatif. Il indique sa naissance à Calcutta en 1971 et ses postes au FMI, précise que « sa famille est hindoue malayali » et la classe dans les catégories « Hindous américains » et « Hindous indiens »."
  ur: "گیتا گوپی ناتھ پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اس کی 1971 کی کولکتہ کی پیدائش اور اس کے آئی ایم ایف کے خطوط دیتا ہے، اس کے متن میں کہتا ہے کہ 'اس کا خاندان ملیالی ہندو ہے'، اور اسے 'امریکی ہندو' اور 'ہندوستانی ہندو' کے زمرے کے تحت فائل کرتا ہے۔"
