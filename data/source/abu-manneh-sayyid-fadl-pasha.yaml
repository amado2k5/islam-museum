summary:
  ar: "دراسة لبطرس أبو منّه عن السيد فضل باشا الحضرمي؛ تذكر أنه وُلد سنة 1824، وتدرّب على مبادئ العلوية، وخلف والده سنة 1844 في قيادة الطريقة العلوية ومسلمي مالابار، وفرّ إلى مكة سنة 1853 بعد أمر باعتقاله، وصار لاحقا واليا على ظفار ومقربا من السلطان عبد الحميد الثاني، وتوفي في إسطنبول في أكتوبر 1900."
  en: "Butrus Abu-Manneh's study of Sayyid Fadl Pasha of Hadramawt; it states that he was born in 1824, was trained in Alawiyya principles, succeeded his father in 1844 as leader of the Alawiyya and of the Muslim community of Malabar, escaped to Mecca in early 1853 after an order for his arrest, later became governor of Dhofar and a dignitary at the court of Sultan Abdulhamid II, and died at Istanbul in October 1900."
title: "Abdulhamid II and Sayyid Fadl Pasha of Hadramawt: An Arab Dignitary's Ambitions (1876-1900)"
