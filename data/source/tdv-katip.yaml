label: { ar: "الكاتب — موسوعة TDV الإسلامية ⁦(مصطفى صبري كوجوكاشجي؛ إرهان أفيونجو وريجب أهشهالي)⁩", en: "KÂTİP — TDV İslâm Ansiklopedisi (Mustafa Sabri Küçükaşcı; Erhan Afyoncu and Recep Ahıshalı)" }
summary:
  ar: "مدخل «كاتب» في موسوعة TDV الإسلامية التركية، ويتناول الكتابة في صدر الإسلام والدول الإسلامية والتركية، وكتّاب الدواوين في الدولة الأموية والعباسية والفاطمية والمملوكية والسلجوقية والمغولية والصفوية، وأجور الكتّاب وتعليمهم، ثم الكتّاب في الدولة العثمانية: الدواوين والدفتردارية والخلفاء والشاكرد، وأجورهم ومواعيد عملهم وشروط الترقية."
  en: "The TDV İslâm Ansiklopedisi entry 'Kâtip' (scribe, secretary). It covers writing and scribes in early Islam, the chancery scribes of the Umayyad, Abbasid, Fatimid, Mamluk, Seljuk, Mongol and Safavid states, their pay and training, and then the Ottoman scribes: the central offices, the halifes, the apprentices, their pay and working hours, and promotion. The first part is by Mustafa Sabri Küçükaşcı, the Ottoman part by Erhan Afyoncu and Recep Ahıshalı."
  es: "La entrada «Kâtip» (escriba, secretario) de la enciclopedia TDV İslâm Ansiklopedisi abarca la escritura y los escribas en los inicios del Islam, los escribas de la cancillería de los estados omeya, abasí, fatimí, mameluco, selyúcida, mongol y safávida, su salario y formación, y, finalmente, los escribas otomanos: las oficinas centrales, los halifes, los aprendices, su salario, jornada laboral y ascensos. La primera parte es de Mustafa Sabri Küçükaşcı, y la parte otomana de Erhan Afyoncu y Recep Ahıshalı."
  fr: "L'article « Kâtip » (scribe, secrétaire) de l'ouvrage TDV İslâm Ansiklopedisi traite de l'écriture et des scribes dans l'islam primitif: les scribes de chancellerie des dynasties omeyyade, abbasside, fatimide, mamelouke, seldjoukide, mongole et safavide, leur rémunération et leur formation, puis les scribes ottomans: les bureaux centraux, les halifes, les apprentis, leur rémunération, leurs horaires de travail et leur avancement. La première partie est de Mustafa Sabri Küçükaşcı, la partie consacrée à l'Empire ottoman d'Erhan Afyoncu et Recep Ahıshalı."
  ur: "TDV İslâm Ansiklopedisi اندراج 'Kâtip' ⁦(منشی، سکریٹری)⁩۔ اس میں ابتدائی اسلام میں لکھنے والے اور کاتب، اموی، عباسی، فاطمی، مملوک، سلجوک، منگول اور صفوی ریاستوں کے چانسری کاتب، ان کی تنخواہ اور تربیت، اور پھر عثمانی کاتب: مرکزی دفاتر، حلیف، اپرنٹس، ان کی تنخواہ اور کام کے اوقات، اور پروموشن کا احاطہ کیا گیا ہے۔ پہلا حصہ مصطفٰی صابری کا ہے، عثمانی حصہ ایرہان افیونکو اور ریسپ احشالی کا ہے۔"
