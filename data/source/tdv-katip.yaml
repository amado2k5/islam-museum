summary:
  ar: "مدخل «كاتب» في موسوعة TDV الإسلامية التركية، ويتناول الكتابة في صدر الإسلام والدول الإسلامية والتركية، وكتّاب الدواوين في الدولة الأموية والعباسية والفاطمية والمملوكية والسلجوقية والمغولية والصفوية، وأجور الكتّاب وتعليمهم، ثم الكتّاب في الدولة العثمانية: الدواوين والدفتردارية والخلفاء والشاكرد، وأجورهم ومواعيد عملهم وشروط الترقية."
  en: "The TDV İslâm Ansiklopedisi entry 'Kâtip' (scribe, secretary). It covers writing and scribes in early Islam, the chancery scribes of the Umayyad, Abbasid, Fatimid, Mamluk, Seljuk, Mongol and Safavid states, their pay and training, and then the Ottoman scribes: the central offices, the halifes, the apprentices, their pay and working hours, and promotion. The first part is by Mustafa Sabri Küçükaşcı, the Ottoman part by Erhan Afyoncu and Recep Ahıshalı."
