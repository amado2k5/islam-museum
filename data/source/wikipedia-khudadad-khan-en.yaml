reliability_note: >-
  Tertiary encyclopedia article resting on Encyclopaedia Iranica's
  'Baluchistan i', Mujahid's Kalat memoir and the 1891 Britannica
  supplement. It gives his birth as about 1841 (to Mehrab Khan II and
  Khadijah), lists Mahmud Khan and Azam Jan among his issue, and
  leaves his death 'date unknown' — the death date in the record
  rests on the Memoranda on the Indian States 1921 instead. Its
  infobox carries a religion field, 'Sunni Islam': a structured
  filing, not a prose attestation, and the record treats it as such.
  The infobox's father field ('Nasir Khan II') conflicts with its own
  text, which makes Nasir his stepbrother and predecessor and Mehrab
  Khan II his father; no filiation edge is drawn from it. Retrieved
  in full via the MediaWiki API on 31 October 2026, the returned
  revision id asserted equal to the recorded one before any claim was
  drawn.
