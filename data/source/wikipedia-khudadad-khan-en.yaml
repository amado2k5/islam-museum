  en: "English Wikipedia article on Mir Khudadad Khan (born about 1841; the article gives no death date), Khan of Kalat from 1857 to 1893 with a brief interruption: his accession at sixteen after his stepbrother Nasir Khan II, the Sandeman system of indirect rule built over his khanate, his forced abdication in 1893 and his succession by his son Mahmud Khan II."
