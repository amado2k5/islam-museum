summary:
  ar: "المقال الإنجليزي عن مير خداداد خان ⁦(نحو 1841 – تاريخ وفاته غير معروف في المقال)⁩، خان قلات من 1857 إلى 1893 مع انقطاع قصير: صعوده العرش في السادسة عشرة بعد أخيه غير الشقيق ناصر خان الثاني، ونظام ساندمان للإدارة غير المباشرة، وخلعه القسري سنة 1893 وخلفه ابنه محمود خان الثاني."
  en: "English Wikipedia article on Mir Khudadad Khan (born about 1841; the article gives no death date), Khan of Kalat from 1857 to 1893 with a brief interruption: his accession at sixteen after his stepbrother Nasir Khan II, the Sandeman system of indirect rule built over his khanate, his forced abdication in 1893 and his succession by his son Mahmud Khan II."
  es: "Artículo de la Wikipedia en inglés sobre Mir Khudadad Khan (nacido alrededor de 1841; el artículo no indica la fecha de su muerte), Khan de Kalat desde 1857 hasta 1893 con una breve interrupción: su ascenso al trono a los dieciséis años después de su hermanastro Nasir Khan II, el sistema Sandeman de gobierno indirecto establecido sobre su kanato, su abdicación forzada en 1893 y su sucesión por su hijo Mahmud Khan II."
  fr: "Article de Wikipédia en anglais sur Mir Khudadad Khan (né vers 1841; l'article ne donne pas de date de décès), Khan de Kalat de 1857 à 1893 avec une brève interruption: son accession au pouvoir à seize ans après son demi-frère Nasir Khan II, le système Sandeman de gouvernement indirect construit sur son khanat, son abdication forcée en 1893 et sa succession par son fils Mahmud Khan II."
  ur: "میر خداداد خان پر انگریزی ویکیپیڈیا کا مضمون ⁦(پیدائش 1841ء؛ مضمون میں کوئی تاریخ وفات نہیں ہے)⁩، خان آف قلات 1857 سے 1893 تک مختصر وقفے کے ساتھ: سولہ سال کی عمر میں اس کا الحاق اس کے سوتیلے بھائی ناصر خان دوم کے بعد، اس کے خانت پر قائم بالواسطہ حکمرانی کا سنڈیمان نظام، اس کی زبردستی دستبرداری اور 1893 میں اس کے بیٹے مہر خان کی کامیابی۔"
  tr: "Mir Khuddadad Khan hakkında İngilizce makale (yaklaşık 1841 – ölüm tarihi makalede bilinmiyor), 1857'den 1893'e kadar Qalat Hanı olarak görev yaptı; kısa bir ara verdi: üvey kardeşi Nasir Khan II'den sonra on altıncıda tahta çıkışı, Sandman sisteminin dolaylı yönetimi, 1893'te zorla tahttan indirilmesi ve oğlu Mahmud Khan II tarafından tahta geçmesi."
  id: "Artikel bahasa Inggris tentang Mir Khuddadad Khan (sekitar 1841 – tanggal kematian tidak diketahui dalam artikel), Khan Qalat dari 1857 hingga 1893, dengan jeda singkat: naiknya ke tahta pada tanggal keenam belas setelah saudara tirinya Nasir Khan II, administrasi tidak langsung sistem Sandman, penggulingannya secara paksa pada 1893, dan suksesinya oleh putranya Mahmud Khan II."
