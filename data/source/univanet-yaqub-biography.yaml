reliability_note: "A forum mirror of Yaqub's widely reproduced biography, marked 'transferred' (منقول) at its foot; used only for its teacher list, which names Abdullah ibn Muhammad al-Amin al-Shanqiti as head of the Tafsir Department at the Islamic University of Madinah and records Yaqub's week in his company. It publishes no birth date for Abdullah and names no school of law for him. Read in full on 26 October 2026."
