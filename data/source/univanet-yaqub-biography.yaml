summary:
  ar: "نسخة منقولة من سيرة الداعية المصري محمد حسين يعقوب في منتديات يوني فانت؛ تذكر مولده بمصر وسفره إلى السعودية لطلب العلم وقائمة شيوخه، وفيها: «فضيلة الشيخ عبد الله بن محمد الأمين الشنقيطي، رئيس قسم التفسير بالجامعة الإسلامية بالمدينة المنورة»، وأن يعقوب رافقه أسبوعًا في إحدى الرحلات واستفاد منه كثيرًا."
  en: "A mirrored copy, on the Univanet forums, of the standard biography of the Egyptian preacher Muhammad Husayn Yaqub. It records his birth in Egypt, his travels to Saudi Arabia to seek knowledge and the list of his teachers; among them it names 'Shaykh Abdullah ibn Muhammad al-Amin al-Shanqiti, head of the Department of Tafsir at the Islamic University of Madinah', and says Yaqub accompanied him for a week on one journey and benefited greatly from him."
