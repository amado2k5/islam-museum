summary:
  ar: "نسخة منقولة من سيرة الداعية المصري محمد حسين يعقوب في منتديات يوني فانت؛ تذكر مولده بمصر وسفره إلى السعودية لطلب العلم وقائمة شيوخه، وفيها: «فضيلة الشيخ عبد الله بن محمد الأمين الشنقيطي، رئيس قسم التفسير بالجامعة الإسلامية بالمدينة المنورة»، وأن يعقوب رافقه أسبوعًا في إحدى الرحلات واستفاد منه كثيرًا."
  en: "A mirrored copy, on the Univanet forums, of the standard biography of the Egyptian preacher Muhammad Husayn Yaqub. It records his birth in Egypt, his travels to Saudi Arabia to seek knowledge and the list of his teachers; among them it names 'Shaykh Abdullah ibn Muhammad al-Amin al-Shanqiti, head of the Department of Tafsir at the Islamic University of Madinah', and says Yaqub accompanied him for a week on one journey and benefited greatly from him."
  es: "En los foros de Univanet se encuentra una copia de la biografía estándar del predicador egipcio Muhammad Husayn Yaqub. En ella se registra su nacimiento en Egipto, sus viajes a Arabia Saudita en busca de conocimiento y la lista de sus maestros; entre ellos menciona al 'Shaykh Abdullah ibn Muhammad al-Amin al-Shanqiti, jefe del Departamento de Tafsir de la Universidad Islámica de Medina', y afirma que Yaqub lo acompañó durante una semana en uno de sus viajes y que se benefició enormemente de él."
  fr: "Une copie conforme, sur les forums d'Univanet, de la biographie officielle du prédicateur égyptien Muhammad Husayn Yaqub, relate sa naissance en Égypte, ses voyages en Arabie saoudite pour approfondir ses connaissances et la liste de ses maîtres; parmi eux figure « Cheikh Abdullah ibn Muhammad al-Amin al-Shanqiti, directeur du département de Tafsir à l'Université islamique de Médine », et il est indiqué que Yaqub l'accompagna pendant une semaine lors d'un voyage et en tira un grand profit."
  ur: "مصری مبلغ محمد حسین یعقوب کی معیاری سوانح عمری کی، Univanet فورمز پر ایک عکس والی کاپی۔ اس میں مصر میں اس کی پیدائش، علم حاصل کرنے کے لیے سعودی عرب کا سفر اور اس کے اساتذہ کی فہرست درج ہے۔ ان میں شیخ عبداللہ بن محمد الامین الشنکطی، اسلامی یونیورسٹی مدینہ منورہ کے شعبہ تفسیر کے سربراہ کا نام ہے، اور کہتے ہیں کہ یعقوب ایک ہفتہ تک ان کے ساتھ ایک سفر میں رہے اور ان سے بہت فائدہ اٹھایا۔"
