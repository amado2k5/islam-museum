summary:
  ar: "مقالة ويكيبيديا الأردية عن محمد إلياس الكاندهلوي، مؤسس جماعة التبليغ؛ تعطي مولده بسنة 1303هـ في كاندهلة بمظفر نكر، ودراسته الأولى عند والده ثم إقامته في كنكوه ثماني أو تسع سنوات، ووصوله إلى ديوبند سنة 1326هـ للدروس عند محمود حسن الديوبندي وسماعه الترمذي والبخاري، وهي مقالة قصيرة لا تسمي مذهباً ولا بيعة."
  en: "The Urdu Wikipedia article on Muhammad Ilyas Kandhlawi, founder of the Tablighi Jamaat; it gives his birth in 1303 AH at Kandhla in Muzaffarnagar, his first studies under his father, his eight or nine years at Gangoh, and his arrival at Deoband in 1326 AH for the lessons of Mahmud Hasan Deobandi, hearing the Tirmidhi and Bukhari there. It is a short stub and names no school and no bay'ah."
