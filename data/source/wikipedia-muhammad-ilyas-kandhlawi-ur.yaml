summary:
  ar: "مقالة ويكيبيديا الأردية عن محمد إلياس الكاندهلوي، مؤسس جماعة التبليغ؛ تعطي مولده بسنة 1303هـ في كاندهلة بمظفر نكر، ودراسته الأولى عند والده ثم إقامته في كنكوه ثماني أو تسع سنوات، ووصوله إلى ديوبند سنة 1326هـ للدروس عند محمود حسن الديوبندي وسماعه الترمذي والبخاري، وهي مقالة قصيرة لا تسمي مذهباً ولا بيعة."
  en: "The Urdu Wikipedia article on Muhammad Ilyas Kandhlawi, founder of the Tablighi Jamaat; it gives his birth in 1303 AH at Kandhla in Muzaffarnagar, his first studies under his father, his eight or nine years at Gangoh, and his arrival at Deoband in 1326 AH for the lessons of Mahmud Hasan Deobandi, hearing the Tirmidhi and Bukhari there. It is a short stub and names no school and no bay'ah."
  es: "El artículo de Wikipedia en urdu sobre Muhammad Ilyas Kandhlawi, fundador de la Tablighi Jamaat, indica que nació en 1303 AH en Kandhla, Muzaffarnagar, que comenzó sus estudios con su padre, que pasó ocho o nueve años en Gangoh y que llegó a Deoband en 1326 AH para recibir las enseñanzas de Mahmud Hasan Deobandi, donde escuchó a Tirmidhi y Bukhari. Es un breve esbozo que no menciona ninguna escuela ni ningún juramento de lealtad (bay'ah)."
  fr: "L'article de Wikipédia en ourdou consacré à Muhammad Ilyas Kandhlawi, fondateur de la Tablighi Jamaat, indique sa naissance en 1303 AH à Kandhla, dans le district de Muzaffarnagar, ses premières études auprès de son père, ses huit ou neuf années passées à Gangoh, et son arrivée à Deoband en 1326 AH pour y recevoir l'enseignement de Mahmud Hasan Deobandi, où il étudia les ouvrages de Tirmidhi et de Bukhari. Cet article est succinct et ne mentionne ni école ni allégeance."
  ur: "تبلیغی جماعت کے بانی محمد الیاس کاندھلوی پر اردو ویکیپیڈیا کا مضمون؛ اس کی ولادت 1303 ہجری میں کاندھلہ مظفر نگر میں ہوئی، اس کی پہلی تعلیم اپنے والد کے زیر سایہ، آٹھ یا نو سال گنگوہ میں، اور 1326 ہجری میں محمود حسن دیوبندی کے اسباق کے لیے دیوبند پہنچی، وہاں ترمذی اور بخاری کی سماعت ہوئی۔ یہ ایک مختصر سٹب ہے اور اس میں کوئی اسکول اور بیع نہیں ہے۔"
