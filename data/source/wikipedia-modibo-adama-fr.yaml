reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. A short article. It gives: born 1786 at Wuro Chekke 'dans l'actuel État de Borno' (in today's Borno State — the English article places Wuro Chekke in what is now Adamawa State; the discrepancy is recorded in the record); son of Ardo Hassan, who began his religious education; completion of his studies at Birnin Ngazargamu, then capital of the Bornu empire; 'En 1806 il reçoit un drapeau vert de la part de Shehu Usman Dan Fodio' — he received a green flag from Usman dan Fodio in 1806 (the English article dates the Fombina delegation and his appointment to 1809, quoting a March 1809 Yola manuscript; the conflict is recorded in the record and the prose); conquests founding the kingdom of Fombina; capitals at Ribadu in 1838, Joboliwo in 1839 and finally Yola in 1841, where he died in 1847; he founded the dynasty of the emirs of Yola and gave his name to today's Adamawa State in Nigeria. Its bibliography cites the Historical Dictionary of the Republic of Cameroon entry 'Adama, Modibo (1786-1847)' and Samuel Nelle's 'Modimo Adama (1780-1847)' — a third birth-year variant, 1780, recorded in the record. The article names no school of law or theology for him."
