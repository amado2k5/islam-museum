  ar: "مقالة ويكيبيديا الفرنسية عن موديبو أداما (1786-1847)؛ تُستخدم لوقائع الكيان فقط. تجعله مؤسس سلالة أمراء يولا وصاحب اسم ولاية أداماوا الحالية، وتؤرخ تسلّمه الراية الخضراء بسنة 1806."
  en: "French Wikipedia article on Modibbo Adama (1786–1847); used for entity facts only. It makes him the founder of the dynasty of the emirs of Yola and the namesake of today's Adamawa State, and dates his receipt of the green flag to 1806."
  es: "Artículo de la Wikipedia en francés sobre Modibbo Adama (1786-1847); utilizado únicamente para datos sobre la persona. Lo presenta como el fundador de la dinastía de los emires de Yola y el homónimo del actual estado de Adamawa, y fecha la obtención de la bandera verde en 1806."
  fr: "L'article de Wikipédia en français sur Modibbo Adama (1786-1847) est utilisé uniquement à des fins d'information sur l'entité. Il le présente comme le fondateur de la dynastie des émirs de Yola et l'éponyme de l'actuel État d'Adamawa, et date l'obtention du drapeau vert à 1806."
  ur: "موڈیبو اداما (1786–1847) پر فرانسیسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اسے یولا کے امیروں کے خاندان کا بانی اور آج کی ادماوا ریاست کا نام بناتا ہے، اور اسے 1806 میں سبز پرچم کی وصولی کی تاریخ بتاتی ہے۔"
  tr: "Modibo Adama (1786-1847) hakkında Fransızca Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Bu onu Yola prenslik hanedanının kurucusu ve Adamawa Devleti'nin günümüzdeki adının taşıyıcısı yapar ve Yeşil Bayrak'ı 1806'da aldığı tarihini belirtir."
  id: "Artikel Wikipedia Prancis tentang Modibo Adama (1786-1847); digunakan hanya untuk fakta entitas tersebut. Artikel ini menjadikannya pendiri dinasti pangeran Yola dan pembawa nama saat ini Negara Bagian Adamawa, serta menandai penerimaannya Panji Hijau pada tahun 1806."
