summary:
  ar: "مقالة ويكيبيديا العربية «عبد الحميد الفراهي» (1280–1349هـ)، مبنية على تحقيق محمد أجمل أيوب الإصلاحي لـ«مفردات القرآن»؛ تعطي مولده صباح الأربعاء 6 جمادى الآخرة 1280هـ وتقرنه بـ17 تشرين الثاني 1863 خلافًا لمقالتي الإنجليزية والأردية (18 تشرين الثاني)، وتعدّد طلابه ومنهم سليمان الندوي وعبد الماجد الدريابادي وأمين أحسن الإصلاحي، وتنقل عن الهلالي أنه لا ينتمي لمذهب لكنه يتعبد على مذهب الحنفية لأنه نشأ عليه، وتعطي وفاته في مثورا في 19 جمادى الآخرة 1349هـ (11 تشرين الثاني 1930)."
  en: "The Arabic Wikipedia article 'Abd al-Hamid al-Farahi' (1280–1349 AH), built on Muhammad Ajmal Ayyub Islahi's edition of Mufradat al-Qur'an; it gives his birth on Wednesday 6 Jumada al-akhira 1280 AH, pairing it with 17 November 1863 against the English and Urdu articles' 18 November, lists his students including Sulaiman Nadvi, Abdul Majid Daryabadi and Amin Ahsan Islahi, quotes al-Hilali that he did not belong to a madhhab but worshipped according to the Hanafi school in which he was raised, and gives his death at Mathura on 19 Jumada al-akhira 1349 AH (11 November 1930)."
