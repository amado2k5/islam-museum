summary:
  ar: "مقالة ويكيبيديا العربية «عبد الحميد الفراهي» ⁦(1280–1349هـ)⁩، مبنية على تحقيق محمد أجمل أيوب الإصلاحي لـ«مفردات القرآن»؛ تعطي مولده صباح الأربعاء 6 جمادى الآخرة 1280هـ وتقرنه بـ17 تشرين الثاني 1863 خلافًا لمقالتي الإنجليزية والأردية ⁦(18 تشرين الثاني)⁩، وتعدّد طلابه ومنهم سليمان الندوي وعبد الماجد الدريابادي وأمين أحسن الإصلاحي، وتنقل عن الهلالي أنه لا ينتمي لمذهب لكنه يتعبد على مذهب الحنفية لأنه نشأ عليه، وتعطي وفاته في مثورا في 19 جمادى الآخرة 1349هـ ⁦(11 تشرين الثاني 1930)⁩."
  en: "The Arabic Wikipedia article 'Abd al-Hamid al-Farahi' (1280–1349 AH), built on Muhammad Ajmal Ayyub Islahi's edition of Mufradat al-Qur'an; it gives his birth on Wednesday 6 Jumada al-akhira 1280 AH, pairing it with 17 November 1863 against the English and Urdu articles' 18 November, lists his students including Sulaiman Nadvi, Abdul Majid Daryabadi and Amin Ahsan Islahi, quotes al-Hilali that he did not belong to a madhhab but worshipped according to the Hanafi school in which he was raised, and gives his death at Mathura on 19 Jumada al-akhira 1349 AH (11 November 1930)."
  es: "El artículo de Wikipedia en árabe 'Abd al-Hamid al-Farahi' (1280–1349 AH), basado en la edición de Muhammad Ajmal Ayyub Islahi de Mufradat al-Qur'an, indica su nacimiento el miércoles 6 de Jumada al-akhira de 1280 AH, comparándolo con el 17 de noviembre de 1863 frente al 18 de noviembre que indican los artículos en inglés y urdu; enumera a sus alumnos, entre ellos Sulaiman Nadvi, Abdul Majid Daryabadi y Amin Ahsan Islahi; cita a al-Hilali, quien afirma que no pertenecía a ninguna madhhab, sino que practicaba la religión según la escuela Hanafi en la que fue criado; y sitúa su muerte en Mathura el 19 de Jumada al-akhira de 1349 AH (11 de noviembre de 1930)."
  fr: "L'article de Wikipédia en arabe intitulé « Abd al-Hamid al-Farahi (1280–1349 AH) », basé sur l'édition de Mufradat al-Qur'an par Muhammad Ajmal Ayyub Islahi, indique sa naissance le mercredi 6 Jumada al-akhira 1280 AH, la faisant correspondre au 17 novembre 1863, contrairement aux articles en anglais et en ourdou qui mentionnent le 18 novembre. Il cite également ses élèves, parmi lesquels Sulaiman Nadvi, Abdul Majid Daryabadi et Amin Ahsan Islahi, et rapporte qu'il n'appartenait à aucun madhhab mais pratiquait le culte selon l'école hanafite dans laquelle il avait été élevé. Enfin, il indique sa mort à Mathura le 19 Jumada al-akhira 1349 AH (11 novembre 1930)."
  ur: "عربی ویکیپیڈیا کا مضمون 'عبد الحامد الفراحی' ⁦(1280-1349 ہجری)⁩، جو محمد اجمل ایوب اصلاحی کے مفردات القرآن کے ایڈیشن پر بنایا گیا ہے۔ اس نے بدھ 6 جمادی الثانی 1280 ہجری کو اس کی ولادت کی اور اسے 17 نومبر 1863 کو انگریزی اور اردو کے مضامین 18 نومبر کے مقابلے میں جوڑا، اس کے شاگردوں کی فہرست جن میں سلیمان ندوی، عبدالمجید دریابادی اور امین احسن اصلاحی شامل ہیں، الہلالی کا حوالہ دیتے ہوئے کہتا ہے کہ اس کا تعلق اس مکتبہ سے نہیں تھا جس کی پرورش حذیفہ سے ہوئی تھی۔ اور 19 جمادی الثانی 1349ھ ⁦(11 نومبر 1930)⁩ کو متھرا میں وفات پائی۔"
  tr: "Arapça Vikipedi makalesi \"Abdul Hamid al-Farahi\" (1280–1349 H), Muhammed Ajmal Ayyub al-Islahi'nin \"Mufradat al-Qur'an\" baskısına dayanarak, doğumunu 6 Cuma el-Akhirah 1280 Hicri Çarşamba sabahı olarak verir; bu, İngilizce ve Urduca makalelerinin aksine 17 Kasım 1863 ile örtüşür. Öğrencileri çok sayıda kişiydi; bunlar arasında Süleyman el-Nadvi, Abdul Majid el-Deryabadi ve Emin Ahsan el-İslahi vardı. El-Hilali'nin bir mezhebe mensup olmadığı, ancak Hanefi okulu tarafından yetiştirildiği için ona ibadet ettiği bildirilmektedir. 19 Cumedül-Akhirah 1349 H (11 Kasım 1930) tarihinde Mathura'da öldü."
  id: "Artikel Wikipedia Arab \"Abdul Hamid al-Farahi\" (1280–1349 H), berdasarkan edisi Muhammad Ajmal Ayyub al-Islahi dari \"Mufradat al-Qur'an,\" mencatat kelahirannya pada Rabu pagi, 6 Jumada al-Akhirah 1280 H, bertepatan dengan 17 November 1863, bertentangan dengan artikel Inggris dan Urdu (18 November). Murid-muridnya sangat banyak, termasuk Suleiman al-Nadwi, Abdul Majid al-Daryabadi, dan Amin Ahsan al-Islahi. Dilaporkan bahwa al-Hilali tidak berasal dari sekte manapun tetapi menyembah aliran Hanafi karena dibesarkan olehnya. Ia meninggal di Mathura pada 19 Jumada al-Akhirah 1349 H (11 November 1930)."
