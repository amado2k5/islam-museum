summary:
  ar: "مدخل موسوعي تركي عن المئذنة كتبته فيليز گوندوز: أصل الكلمة، والآراء في أصل الشكل، و«الأسطوانة» التي كان بلال يصعدها للأذان في المسجد النبوي، وأن أول من أضاف مئذنة إلى جامع هو مسلمة بن مخلد والي معاوية على مصر في جامع عمرو بالفسطاط (53/673)، ثم تطور المآذن في الشام والمغرب ومصر وإيران وآسيا الوسطى والأناضول."
  en: "A Turkish encyclopedia entry on the minaret by Filiz Gündüz: the word, the views on where the form came from, the 'ustuwana' Bilal climbed for the call to prayer in the Prophet's Mosque, the statement that the first to add a minaret to a mosque was Maslama ibn Mukhallad, Mu'awiya's governor of Egypt, at the Mosque of Amr in Fustat (53/673), and the later growth of minarets in Syria, the Maghrib, Egypt, Iran, Central Asia and Anatolia."
  es: "Una entrada de la enciclopedia turca sobre el minarete, escrita por Filiz Gündüz: la palabra, las opiniones sobre el origen de la forma, el 'ustuwana' al que Bilal subió para la llamada a la oración en la Mezquita del Profeta, la afirmación de que el primero en añadir un minarete a una mezquita fue Maslama ibn Mukhallad, gobernador de Egipto durante el reinado de Mu'awiya, en la Mezquita de Amr en Fustat (53/673), y el posterior desarrollo de los minaretes en Siria, el Magreb, Egipto, Irán, Asia Central y Anatolia."
  fr: "Un article de l'encyclopédie turque sur le minaret par Filiz Gündüz: le mot, les opinions sur l'origine de la forme, l'« ustuwana » que Bilal a escaladé pour l'appel à la prière dans la mosquée du Prophète, l'affirmation selon laquelle le premier à ajouter un minaret à une mosquée fut Maslama ibn Mukhallad, gouverneur de Mu'awiya en Égypte, à la mosquée d'Amr à Fustat (53/673), et le développement ultérieur des minarets en Syrie, au Maghreb, en Égypte, en Iran, en Asie centrale et en Anatolie."
