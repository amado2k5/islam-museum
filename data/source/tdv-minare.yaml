  ar: "مدخل موسوعي تركي عن المئذنة كتبته فيليز گوندوز: أصل الكلمة، والآراء في أصل الشكل، و«الأسطوانة» التي كان بلال يصعدها للأذان في المسجد النبوي، وأن أول من أضاف مئذنة إلى جامع هو مسلمة بن مخلد والي معاوية على مصر في جامع عمرو بالفسطاط (53/673)، ثم تطور المآذن في الشام والمغرب ومصر وإيران وآسيا الوسطى والأناضول."
  en: "A Turkish encyclopedia entry on the minaret by Filiz Gündüz: the word, the views on where the form came from, the 'ustuwana' Bilal climbed for the call to prayer in the Prophet's Mosque, the statement that the first to add a minaret to a mosque was Maslama ibn Mukhallad, Mu'awiya's governor of Egypt, at the Mosque of Amr in Fustat (53/673), and the later growth of minarets in Syria, the Maghrib, Egypt, Iran, Central Asia and Anatolia."
