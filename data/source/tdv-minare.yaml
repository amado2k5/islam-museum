reliability_note: "The entry was read on the web on 5 November 2026; the site gives the author as Filiz Gündüz and the print date as 2020. It is a single-section article without internal headings, so it is cited by paragraph (¶1 to ¶8, counted from the top of the article text). ¶1 gives the word and the origin theories; ¶2 the ustuwana, Maslama's corner minarets (53/673) and the materials; ¶3 the parts of a minaret; ¶5 the Syrian, Egyptian and Maghribi minarets, among them Damascus (705–714), Ibn Tulun and Qayrawan (105/724). It is used to establish what this secondary source says."
