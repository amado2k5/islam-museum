reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 5 November 2026 (page copy crawled 24 October 2026); the reading tools available in this run did not expose a revision id, so none is recorded. Its lead prose states that he 'belongs to the Qadri–Razavi order of Sufism', and its Sufism section records in prose that he became a murid of Ziauddin Madani, that Fazlur Rahman Malik and Waqaruddin authorized him in Sufism, and that Shariful Haq Amjadi authorized him in the four major Sufi orders. Its infobox fields (denomination Sunni, jurisprudence Hanafi, tariqa Qadiriyya, creed Maturidi, movement Barelvi) are infobox data and are NOT used as attestation under this lane's rules. Its criticism section, citing India Today, Indiatimes and One India reports of 2022, records allegations over his statements on blasphemy killings and over men associated with Dawat-e-Islami; those reports are attributed in the prose that uses them."
