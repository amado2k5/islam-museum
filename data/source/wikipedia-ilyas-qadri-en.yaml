  ar: "مقالة ويكيبيديا الإنجليزية عن محمد إلياس عطار قادري؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في كراتشي في 12 يوليو 1950، ودراسته عند ضياء الدين مدني ومحمد وقار الدين قادري، وانتماءه في متنها إلى الطريقة القادرية الرضوية، وكتابه «فيضان سنت»."
  en: "English Wikipedia article on Muhammad Ilyas Attar Qadri; used for entity facts only. It gives his birth in Karachi on 12 July 1950, his study under Ziauddin Madani and Muhammad Waqaruddin Qadri, states in its prose that he belongs to the Qadri–Razavi order of Sufism, and names his major work Faizan-e-Sunnat."
