summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد إلياس عطار قادري؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في كراتشي في 12 يوليو 1950، ودراسته عند ضياء الدين مدني ومحمد وقار الدين قادري، وانتماءه في متنها إلى الطريقة القادرية الرضوية، وكتابه «فيضان سنت»."
  en: "English Wikipedia article on Muhammad Ilyas Attar Qadri; used for entity facts only. It gives his birth in Karachi on 12 July 1950, his study under Ziauddin Madani and Muhammad Waqaruddin Qadri, states in its prose that he belongs to the Qadri–Razavi order of Sufism, and names his major work Faizan-e-Sunnat."
  es: "Artículo de la Wikipedia en inglés sobre Muhammad Ilyas Attar Qadri; utilizado únicamente para datos sobre la persona. Indica que nació en Karachi el 12 de julio de 1950, que estudió con Ziauddin Madani y Muhammad Waqaruddin Qadri, afirma en su texto que pertenece a la orden sufí Qadri-Razavi y nombra su obra principal Faizan-e-Sunnat."
  fr: "Article de Wikipédia en anglais sur Muhammad Ilyas Attar Qadri; utilisé uniquement pour les informations sur l’entité. Il indique sa naissance à Karachi le 12 juillet 1950, ses études auprès de Ziauddin Madani et Muhammad Waqaruddin Qadri, précise qu’il appartient à l’ordre soufi Qadri-Razavi et nomme son œuvre majeure Faizan-e-Sunnat."
  ur: "محمد الیاس عطار قادری پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی پیدائش 12 جولائی 1950 کو کراچی میں ہوئی، ضیاالدین مدنی اور محمد وقار الدین قادری کے زیر مطالعہ ان کا مطالعہ، اپنے نثر میں بتاتا ہے کہ ان کا تعلق تصوف کے قادری-رضوی حکم سے ہے، اور ان کی بڑی تصنیف کا نام فیضانِ سنت رکھا ہے۔"
  tr: "Muhammed İlyas Attar Kadri hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 12 Temmuz 1950'de Karaçi'de doğdu, Ziauddin Madani ve Muhammad Waqar al-Din Qadri'nin öğrencisi oldu, Kadiri-Razavi tarikatıyla bağlantısı ve 'Sünnetin Tufanı' adlı kitabı vardı."
  id: "Artikel Wikipedia bahasa Inggris tentang Muhammad Ilyas Attar Qadri; digunakan hanya untuk fakta-fakta entitas tersebut. Ia lahir di Karachi pada 12 Juli 1950, belajar di bawah bimbingan Ziauddin Madani dan Muhammad Waqar al-Din Qadri, keterlibatannya dengan tarekat Qadiri-Razavi, serta bukunya 'Flood of the Sunnah.'"
