summary:
  ar: "مدخل موسوعة الإسلام التركية (TDV) عن محمد مصطفى المراغي بقلم علي جمعة (المجلد 29، ص 164-165، أنقرة 2004)؛ يُستخدم لوقائع الكيان فقط. يوثّق تعيينه قاضيا أعلى للسودان سنة 1908 ومشيخته للأزهر (1928-1929 و1935-1945) وقانون 1920 في الأحوال الشخصية ووفاته في 23 أغسطس 1945، ولا يذكر مذهبا فقهيا له."
  en: "TDV İslâm Ansiklopedisi entry on Muhammad Mustafa al-Maraghi by Ali Jum'a (Ali Gomaa), vol. 29, pp. 164–165 (Ankara 2004); used for entity facts only. It records his appointment as Grand Qadi of the Sudan in 1908, his two Azhar rectorates (1928–1929 and 1935–1945), the 1920 personal-status law, and his death on 23 August 1945 — and names no fiqh school for him."
