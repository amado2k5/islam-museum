reliability_note: "Turkey's national encyclopedia of Islam, published by the Türkiye Diyanet Vakfı; the entry is signed by Ali Jum'a (Ali Gomaa), himself a later Grand Mufti of Egypt. Read in full at the encyclopedia's own site on 24 October 2026. It gives: full name Muhammad ibn Mustafa ibn Muhammad ibn Abd al-Mun'im al-Maraghi, of El Maragha in (then) Girga province; born 7 Rabi' al-Akhar 1298 (9 March 1881); studied under his father and Ali al-Salihi, then attached himself to Muhammad Abduh; 'alimiyya with first rank; teaching post at al-Azhar; qadi in the Sudan (Khartoum, then Dongola) from 1904; Grand Qadi of the Sudan 1 August 1908 (one source he cites gives 1909) – 1919, overseeing Gordon College's sharia section; head of sharia inspection (9 October 1919); president of the Grand Sharia Court (21 July 1920); member of the Supreme Sharia Court (27 January 1921), its president 11 December 1923 – 22 May 1928; member of the Greater Committee on the caliphate (25 March 1924); Sheikh al-Azhar 22 May 1928 – 10 October 1929 and again from 27 April 1935 until his death; his first-term reform projects and the July 1920 personal-status law (an oath-divorce not binding; a triple repudiation counting once; rulings on the grandson's inheritance); the Fatwa Committee of 11 August 1935 composed of three Hanafis, three Malikis, three Shafi'is and two Hanbalis; the Department of Preaching and Guidance first created in his first term; the July 1945 culture-and-research observatory that later became the Islamic Research Academy; and his death on 23 August 1945 after surgery (the Arabic and English articles give 22 August, the night of 14 Ramadan 1364, which the record follows), with the body taken to Hulwan, the funeral at al-Azhar Mosque and burial at the Sayyida Nafisa cemetery in Cairo. Its bibliography lists his Qur'an-translation treatise as printed at Cairo in 1355 (1936). Like every other source consulted, the entry names NO madhhab for him — as chief judge he had deliberately freed his judges from the Hanafi-only constraint wherever another school's opinion better served the public interest — and the record's faith value is accordingly unknown."
