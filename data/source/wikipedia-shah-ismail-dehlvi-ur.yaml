reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 at the recorded revision, fetched by revision id and asserted equal before any claim was drawn. It gives his birth as 12 Rabi' al-Awwal 1193 AH, corresponding to 29 April 1779 — the Arabic article gives the same Gregorian day with the Hijri month as Rabi' al-Akhir — and places his birth in Delhi, where the Arabic and English articles and Wikidata give Muzaffarnagar. It records that he memorised the Qur'an by eight, studied the curriculum books under his uncle Shah Abd al-Qadir and took his hadith sanad from his uncle Shah Abd al-Aziz, and that after completing his studies he kept the company of Syed Ahmad Barelvi and completed the path of suluk under him, calling Barelvi his pir and murshid. It names no madhhab for him in its text; its category filings under 'Hanafis' and 'Maturidis' are filings, not attestations, and are not counted."
