summary:
  ar: "مقالة ويكيبيديا الأردية «شاہ اسماعیل دہلوی»؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في 29 أبريل 1779، ودراسته كتب الدرس على عمه عبد القادر الدهلوي وأخذه سند الحديث عن عمه عبد العزيز الدهلوي، وإتمامه طريق السلوك في خدمة سيد أحمد بريلوي الذي تصفه بأنه بيره ومرشده، واستشهاده معه في بالاكوت سنة 1831."
  en: "Urdu Wikipedia article 'Shah Ismail Dehlvi'; used for entity facts only. It gives his birth on 29 April 1779, his study of the curriculum books under his uncle Abd al-Qadir Dehlvi and his hadith licence (sanad) from his uncle Abd al-Aziz Dehlvi, his completion of the Sufi path in the service of Syed Ahmad Barelvi, whom it calls his pir and murshid, and his death alongside him at Balakot in 1831."
  es: "Artículo de Wikipedia en urdu titulado \"Shah Ismail Dehlvi\"; utilizado únicamente para datos sobre la persona. Indica su nacimiento el 29 de abril de 1779, su estudio de los libros de texto con su tío Abd al-Qadir Dehlvi y su licencia de hadiz (sanad) otorgada por su tío Abd al-Aziz Dehlvi, su culminación del camino sufí al servicio de Syed Ahmad Barelvi, a quien denomina su pir y murshid, y su muerte junto a él en Balakot en 1831."
  fr: "L'article de Wikipédia en ourdou intitulé « Shah Ismail Dehlvi » est utilisé uniquement à des fins d'information sur l'entité. Il indique sa naissance le 29 avril 1779, ses études des manuels scolaires auprès de son oncle Abd al-Qadir Dehlvi et sa licence de hadith (sanad) de son oncle Abd al-Aziz Dehlvi, son achèvement de la voie soufie au service de Syed Ahmad Barelvi, qu'il qualifie de pir et murshid, et sa mort à ses côtés à Balakot en 1831."
  ur: "اردو ویکیپیڈیا مضمون 'شاہ اسماعیل دہلوی'؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 29 اپریل 1779 کو ان کی ولادت، ان کے چچا عبد القادر دہلوی کے تحت نصابی کتابوں کا مطالعہ اور ان کے چچا عبد العزیز دہلوی سے حدیث کی سند ⁦(سناد)⁩، سید احمد بریلوی کی خدمت میں صوفی راستے کی تکمیل، جنہیں یہ اپنا پیر و مرشد کہتے ہیں، اور ان کی وفات 81 میں بالا کوٹ میں ہوئی۔"
  tr: "Urduca Vikipedi makalesi \"Şah İsmail Dehlavi\" yalnızca varlığın gerçekleri için kullanılır. 29 Nisan 1779'da doğduğu, amcası Abdul Kadir Dehlawi'nin yanında eğitim aldığı, amcası Abdul Aziz Dehlawi'den anlatım zinciri aldığı, Syed Ahmad Barlawi'nin hizmetinde davranış yolunu tamamladığı ve onu akıl hocası olarak tanımladığı ve 1831'de Balakot'ta onunla birlikte şehit olduğu belirtilir."
  id: "Artikel Wikipedia Urdu \"Shah Ismail Dehlavi\" hanya digunakan untuk fakta entitas tersebut. Ia disebutkan lahir pada 29 April 1779, belajar di bawah pamannya Abdul Qadir Dehlawi, mengambil rantai narasi dari pamannya Abdul Aziz Dehlawi, menyelesaikan jalan hidup dalam pelayanan Syed Ahmad Barlawi, yang ia gambarkan sebagai mentor dan mentornya, serta menjadi martir bersamanya di Balakot pada tahun 1831."
