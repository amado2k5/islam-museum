summary:
  ar: "مقالة ويكيبيديا الأردية «شاہ اسماعیل دہلوی»؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في 29 أبريل 1779، ودراسته كتب الدرس على عمه عبد القادر الدهلوي وأخذه سند الحديث عن عمه عبد العزيز الدهلوي، وإتمامه طريق السلوك في خدمة سيد أحمد بريلوي الذي تصفه بأنه بيره ومرشده، واستشهاده معه في بالاكوت سنة 1831."
  en: "Urdu Wikipedia article 'Shah Ismail Dehlvi'; used for entity facts only. It gives his birth on 29 April 1779, his study of the curriculum books under his uncle Abd al-Qadir Dehlvi and his hadith licence (sanad) from his uncle Abd al-Aziz Dehlvi, his completion of the Sufi path in the service of Syed Ahmad Barelvi, whom it calls his pir and murshid, and his death alongside him at Balakot in 1831."
