summary:
  ar: "مقالة ويكيبيديا العربية «هدى شعراوي»؛ تُستخدم لوقائع الكيان فقط. تفصّل نشأتها في المنيا والقاهرة، وزواجها المبكر وانفصالها، ودورها في ثورة 1919، وتأسيس الاتحاد النسائي المصري، ووفاتها بسكتة قلبية وهي تكتب بيانا عن فلسطين."
  en: "Arabic Wikipedia article «هدى شعراوي»; used for entity facts only. It details her upbringing in Minya and Cairo, her early marriage and separation, her role in the 1919 revolution, the founding of the Egyptian Feminist Union, and her death of a heart attack while writing a statement on Palestine."
  es: "Artículo en árabe de la Wikipedia «هدى شعراوي»; utilizado únicamente para datos biográficos. Detalla su infancia en Minya y El Cairo, su matrimonio y separación a temprana edad, su papel en la revolución de 1919, la fundación de la Unión Feminista Egipcia y su muerte por un ataque al corazón mientras redactaba una declaración sobre Palestina."
  fr: "L'article de Wikipédia en arabe « هدى شعراوي » (utilisé uniquement à des fins documentaires) détaille son enfance à Minya et au Caire, son mariage précoce et sa séparation, son rôle dans la révolution de 1919, la fondation de l'Union féministe égyptienne et sa mort d'une crise cardiaque alors qu'elle rédigeait une déclaration sur la Palestine."
  ur: "عربی ویکیپیڈیا مضمون «هدى شعراوي»؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں منیا اور قاہرہ میں اس کی پرورش، اس کی ابتدائی شادی اور علیحدگی، 1919 کے انقلاب میں اس کے کردار، مصری فیمنسٹ یونین کی بنیاد، اور فلسطین پر ایک بیان لکھتے ہوئے دل کا دورہ پڑنے سے اس کی موت کی تفصیلات بیان کی گئی ہیں۔"
  tr: "Arapça Vikipedi makalesi \"Huda Shaarawy\" yalnızca varlığın gerçekleri için kullanılıyor. Minya ve Kahire'deki yetiştirilme tarzını, erken evliliğini ve ayrılığını, 1919 devrimindeki rolünü, Mısır Kadınlar Birliği'nin kuruluşunu ve Filistin hakkında bir açıklama yazarken kalp krizi geçirerek hayatını kaybetmesini detaylandırıyor."
  id: "Artikel Wikipedia berbahasa Arab \"Huda Shaarawy\" hanya digunakan untuk fakta tentang entitas tersebut. Ia merinci masa kecilnya di Minya dan Kairo, pernikahan dan perpisahannya yang dini, perannya dalam revolusi 1919, pendirian Persatuan Perempuan Mesir, dan kematiannya akibat serangan jantung saat menulis pernyataan tentang Palestina."
