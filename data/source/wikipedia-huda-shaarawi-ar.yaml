summary:
  ar: "مقالة ويكيبيديا العربية «هدى شعراوي»؛ تُستخدم لوقائع الكيان فقط. تفصّل نشأتها في المنيا والقاهرة، وزواجها المبكر وانفصالها، ودورها في ثورة 1919، وتأسيس الاتحاد النسائي المصري، ووفاتها بسكتة قلبية وهي تكتب بيانا عن فلسطين."
  en: "Arabic Wikipedia article «هدى شعراوي»; used for entity facts only. It details her upbringing in Minya and Cairo, her early marriage and separation, her role in the 1919 revolution, the founding of the Egyptian Feminist Union, and her death of a heart attack while writing a statement on Palestine."
