reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Richer than the English article on her childhood (her father's death at Graz on 14 August 1884, her memorisation of the Qur'an at nine, the marriage contract stipulating monogamy, her reunion with her husband in 1900 and her children Buthayna and Muhammad) and on the Egyptian movement's internal history. Two of its dates diverge from the English article and Britannica: it places her public unveiling in 1921, at the reception of Saad Zaghlul, where the English article and Britannica place it in 1923 on her return from Rome; and it dates her presidency of the Egyptian Feminist Union from a 1927 formal constitution, where the English article dates the founding to 1923. Both divergences are recorded in the person record. Its long section on her son's marriage dispute with the singer Fatma Sirri is a family matter reported by Mustafa Amin and is used only in brief, attributed form. It names no school for her. Read in full on 24 October 2026."
