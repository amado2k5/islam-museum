label:
  ar: "علل الحديث لابن أبي حاتم الرازي — الجزء الأول، المطبعة السلفية بالقاهرة 1343هـ"
  en: "Ilal al-Hadith by Ibn Abi Hatim al-Razi — part 1, al-Matba'a al-Salafiyya, Cairo 1343 AH"
summary:
  ar: "«علل الحديث» لأبي محمد عبد الرحمن بن أبي حاتم الرازي ⁦(240–327هـ)⁩، طبع بنفقة الشيخ محمد نصيف وشركائه، بالمطبعة السلفية ومكتبتها بالقاهرة لصاحبيها محب الدين الخطيب وعبد الفتاح قتلان، سنة 1343هـ، عن نسختين خطيتين إحداهما في خزانة أحمد تيمور باشا والأخرى في دار الكتب المصرية. الجزء الأول: من الطهارة إلى المناسك، وفي أوله مقدمة الناشر وترجمة المؤلف ووالده."
  en: "Ilal al-Hadith by Abu Muhammad Abd al-Rahman ibn Abi Hatim al-Razi (240–327 AH), printed at the expense of Shaykh Muhammad Nasif and partners by al-Matba'a al-Salafiyya and its bookshop in Cairo, owned by Muhibb al-Din al-Khatib and Abd al-Fattah Qatlan, in 1343 AH, from two manuscripts, one in the library of Ahmad Taymur Pasha and one in the Egyptian National Library; part 1: from purity to the pilgrimage rites, opening with the publisher's preface and biographies of the author and his father."
  es: "Ilal al-Hadith de Abu Muhammad Abd al-Rahman ibn Abi Hatim al-Razi (240–327 AH), impreso a expensas del Shaykh Muhammad Nasif y socios por al-Matba'a al-Salafiyya y su librería en El Cairo, propiedad de Muhibb al-Din al-Khatib y Abd al-Fattah Qatlan, en 1343 AH, a partir de dos manuscritos, uno en la biblioteca de Ahmad Taymur Pasha y otro en la Biblioteca Nacional Egipcia; parte 1: de la pureza a los ritos de peregrinación, comenzando con el prefacio del editor y biografías del autor y su padre."
  fr: "Ilal al-Hadith d'Abu Muhammad Abd al-Rahman ibn Abi Hatim al-Razi (240–327 AH), imprimé aux frais du cheikh Muhammad Nasif et de ses associés par al-Matba'a al-Salafiyya et sa librairie du Caire, appartenant à Muhibb al-Din al-Khatib et Abd al-Fattah Qatlan, en 1343 AH, à partir de deux manuscrits, l'un dans la bibliothèque d'Ahmad Taymur Pasha et l'autre dans la Bibliothèque nationale égyptienne; partie 1: de la pureté aux rites du pèlerinage, s'ouvrant sur la préface de l'éditeur et les biographies de l'auteur et de son père."
  ur: "ابو محمد عبدالرحمٰن بن ابی حاتم الرازی ⁦(240-327ھ)⁩ کی اِلال الحدیث، شیخ محمد ناصف اور شراکت داروں کے خرچ پر المطبع السلفیہ اور قاہرہ میں اس کی کتابوں کی دکان کے ذریعے طبع کی گئی، جس کی ملکیت محب الدین اور عبد القحطان، 1343 میں ہے۔ دو نسخوں سے، ایک احمد تیمور پاشا کی لائبریری میں اور ایک مصری نیشنل لائبریری میں؛ حصہ 1: پاکیزگی سے لے کر حج کی رسومات تک، ناشر کے دیباچے اور مصنف اور اس کے والد کی سوانح حیات کے ساتھ آغاز۔"
  tr: "Ebu Muhammed Abdülrahman ibn Ebi Hatim el-Razi (240–327 H) tarafından yazılmış \"İlal al-Hadis\", Şeyh Muhammed Nasif ve ortaklarının masraflarıyla, Kahire'deki Selefi Matbaa ve Kütüphanesi'nde, sahipleri Muhibdin el-Hatib ve Abdülfettah Kutlan'a ait, 1343 Hicri yılında, iki el yazması kopyası olarak basılmıştır: biri Ahmed Timur Paşa'nın kütüphanesinde, diğeri Mısır Ulusal Kütüphanesi'nde. Birinci Bölüm: Arınmadan Ritüellere, yazarın ve babasının yayınevinin tanıtımı ve biyografisiyle başlar."
  id: "\"Ilal al-Hadith\" oleh Abu Muhammad Abd al-Rahman ibn Abi Hatim al-Razi (240–327 H), dicetak atas biaya Sheikh Muhammad Nasif dan mitranya, di Salafi Press and Library di Kairo, milik pemiliknya Muhib al-Din al-Khatib dan Abd al-Fattah Qutlan, pada tahun 1343 H, dalam dua salinan manuskrip: satu di perpustakaan Ahmad Timur Pasha dan satu lagi di Perpustakaan Nasional Mesir. Bagian Satu: Dari Pemurnian ke Ritual, dimulai dengan pengantar penerbit dan biografi penulis serta ayahnya."
