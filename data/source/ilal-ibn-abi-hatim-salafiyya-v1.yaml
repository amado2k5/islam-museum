summary:
  ar: "«علل الحديث» لأبي محمد عبد الرحمن بن أبي حاتم الرازي (240–327هـ)، طبع بنفقة الشيخ محمد نصيف وشركائه، بالمطبعة السلفية ومكتبتها بالقاهرة لصاحبيها محب الدين الخطيب وعبد الفتاح قتلان، سنة 1343هـ، عن نسختين خطيتين إحداهما في خزانة أحمد تيمور باشا والأخرى في دار الكتب المصرية. الجزء الأول: من الطهارة إلى المناسك، وفي أوله مقدمة الناشر وترجمة المؤلف ووالده."
  en: "Ilal al-Hadith by Abu Muhammad Abd al-Rahman ibn Abi Hatim al-Razi (240–327 AH), printed at the expense of Shaykh Muhammad Nasif and partners by al-Matba'a al-Salafiyya and its bookshop in Cairo, owned by Muhibb al-Din al-Khatib and Abd al-Fattah Qatlan, in 1343 AH, from two manuscripts, one in the library of Ahmad Taymur Pasha and one in the Egyptian National Library; part 1: from purity to the pilgrimage rites, opening with the publisher's preface and biographies of the author and his father."
