reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026; the reading route did not expose a revision id, so the consultation date is recorded in place of a revision. It gives Mendy (full name Édouard Osoque Mendy) as born on 1 March 1992 in Montivilliers, France, his youth years at Le Havre and CS Municipaux, Cherbourg until 2014, Marseille's reserve team in 2015-16, Reims (Ligue 2 title 2017-18), Rennes from August 2019, Chelsea from September 2020 and Al-Ahli from 2023; it recounts Guinea-Bissau's November 2016 call-up, which he declined in favour of Senegal, and his Senegal debut on 18 November 2018. The article is shorter and partly outdated (its statistics tables are stale), and its account of the 2014 move has Marseille signing him directly from Cherbourg, omitting the year he spent without a club; the English article is followed where they differ. Its infobox carries no religion field and its text makes no statement of his religion."
