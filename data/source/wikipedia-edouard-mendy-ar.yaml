  ar: "مقالة ويكيبيديا العربية «إدوارد ميندي»؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في فرنسا سنة 1992، ومسيرته مع تشيربورغ ومرسيليا وريمس ورين وتشيلسي والأهلي، واستدعاء غينيا بيساو له ثم اختياره السنغال، وإنجازاته مع النادي والمنتخب."
