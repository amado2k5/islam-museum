summary:
  ar: "مقالة ويكيبيديا العربية «إدوارد ميندي»؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في فرنسا سنة 1992، ومسيرته مع تشيربورغ ومرسيليا وريمس ورين وتشيلسي والأهلي، واستدعاء غينيا بيساو له ثم اختياره السنغال، وإنجازاته مع النادي والمنتخب."
  en: "Arabic Wikipedia article on Édouard Mendy; used for entity facts only. It gives his birth in France in 1992, his career with Cherbourg, Marseille, Reims, Rennes, Chelsea and Al-Ahli, Guinea-Bissau's call-up and his choice of Senegal, and his club and national honours."
  es: "Artículo de Wikipedia en árabe sobre Édouard Mendy; utilizado únicamente para datos sobre la persona. Describe su nacimiento en Francia en 1992, su trayectoria en el Cherbourg, Marsella, Reims, Rennes, Chelsea y Al-Ahli, su convocatoria con Guinea-Bissau y su elección de Senegal, así como sus títulos con clubes y selecciones nacionales."
  fr: "Article Wikipédia en arabe consacré à Édouard Mendy; utilisé uniquement pour les informations relatives à l’entité. Il retrace sa naissance en France en 1992, sa carrière à Cherbourg, Marseille, Reims, Rennes, Chelsea et Al-Ahli, sa sélection en équipe nationale de Guinée-Bissau et son choix du Sénégal, ainsi que son palmarès en club et en sélection."
  ur: "ایڈورڈ مینڈی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1992 میں فرانس میں اس کی پیدائش، چیربرگ، مارسیلی، ریمس، رینس، چیلسی اور الاحلی کے ساتھ اس کا کیریئر، گنی بساؤ کی کال اپ اور سینیگال کا انتخاب، اور اس کے کلب اور قومی اعزازات۔"
