reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. Covers: his birth as Abdel Halim Ali Shabana on 21 June 1929 at al-Hilwat in the Sharqia Governorate; his mother's death days after his birth and his father's within the year, and his upbringing by an aunt and uncle in Cairo; his brother Ismail as his first teacher; the Arabic Music Institute at fourteen and teaching posts at Tanta and al-Mahalla; the 1953 radio debut as a last-minute substitute, heard by Hafez Abdel Wahab, whose name he took; collaborations with Mohamed Abdel Wahab ('Ahwak', 'Nebtedi Minen el Hekaya', 'Fatet Ganbena'), Mohamed Hamza, Kamal al-Taweel, Baligh Hamdi, Salah Jahin and Abdel Rahman el-Abnoudi; more than three hundred songs and sixteen films, among them Dalilah, the Middle East's first colour film; the co-founding of the Soutelphan production company with Abdel Wahab and Magdi el-Amroussi; the patriotic repertoire for the 1952 revolution, Nasser, the aftermath of 1967 ('Aadah al-Nahar') and Sadat after 1973, sung again by crowds in 2011; schistosomiasis contracted at eleven, diagnosed in 1956, and death from cirrhosis at King's College Hospital, London, on 30 March 1977; the hospital he built in 1969; his funeral in Cairo, attended by tens of thousands, with reported suicides among fans (reported as such); burial at the Al Bassatin Cemetery, Cairo; the interpolation of 'Khosara' in Jay-Z's 'Big Pimpin'' (1999) and the 2019 hologram concert with Carole Samaha. The article names no religion for him."
