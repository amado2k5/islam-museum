label: { en: "'New Kaaba cover installed on eve of Islamic New Year 1444', Arab News, 30 July 2022" }
summary:
  ar: "تقرير عرب نيوز في 30 يوليو 2022 عن تركيب كسوة الكعبة الجديدة مع مطلع سنة 1444 الهجرية: كانت تبدل صباح التاسع من ذي الحجة، ثم نقل موعدها إلى ليلة الأول من محرم بقرار ملكي، ويذكر نحو 670 كيلوغراما من الحرير الخام و120 كيلوغراما من خيوط الذهب و100 كيلوغرام من خيوط الفضة."
  en: "Arab News, 30 July 2022, on the new Kaaba cover installed at the dawn of the Hijri year 1444: it had been replaced on the morning of 9 Dhu al-Hijja, and the event was moved to the eve of 1 Muharram by a royal decision; the report gives about 670 kilograms of raw silk, 120 kilograms of gold thread and 100 kilograms of silver thread."
  ur: "عرب نیوز، 30 جولائی 2022: ہجری سال 1444 کے آغاز پر کعبہ کا نیا غلاف چڑھایا گیا؛ پہلے یہ 9 ذی الحجہ کی صبح بدلا جاتا تھا، پھر شاہی فیصلے سے یکم محرم کی شب مقرر ہوا؛ رپورٹ میں تقریباً 670 کلوگرام خام ریشم، 120 کلوگرام سونے کے تار اور 100 کلوگرام چاندی کے تار کا ذکر ہے۔"
  es: "Arab News, 30 de julio de 2022, sobre la nueva cubierta de la Kaaba instalada al amanecer del año Hijri 1444: había sido reemplazada la mañana del 9 de Dhu al-Hijja, y el evento fue trasladado a la víspera del 1 de Muharram por decisión real; el informe menciona unos 670 kilogramos de seda cruda, 120 kilogramos de hilo de oro y 100 kilogramos de hilo de plata."
  fr: "Arab News, 30 juillet 2022, à propos du nouveau revêtement de la Kaaba installé à l'aube de l'année hégirienne 1444: il avait été remplacé le matin du 9 Dhu al-Hijja, et l'événement a été déplacé à la veille du 1er Muharram par décision royale; le rapport fait état d'environ 670 kilogrammes de soie brute, 120 kilogrammes de fil d'or et 100 kilogrammes de fil d'argent."
  tr: "Arab News, 30 Temmuz 2022'de 1444 Hicri yılının başında Kabe'nin yeni Kiswa kurulmasıyla ilgili haber yapıyor: Deci 9. Hicce sabahı değişirdi, sonra kraliyet fermanıyla Muharrem gecesine alındı. Yaklaşık 670 kilogram ham ipek, 120 kilogram altın iplik ve 100 kilogram gümüş iplikten bahsediliyor."
  id: "Laporan Arab News pada 30 Juli 2022, tentang pemasangan Kiswa baru Ka'bah pada awal tahun 1444 H: Biasanya diubah pada pagi hari tanggal sembilan Dhu al-Hijjah, kemudian tanggalnya dipindahkan ke malam tanggal pertama Muharram melalui dekrit kerajaan. Disebutkan sekitar 670 kilogram sutra mentah, 120 kilogram benang emas, dan 100 kilogram benang perak."
