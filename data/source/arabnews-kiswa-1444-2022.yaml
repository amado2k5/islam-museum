summary:
  ar: "تقرير عرب نيوز في 30 يوليو 2022 عن تركيب كسوة الكعبة الجديدة مع مطلع سنة 1444 الهجرية: كانت تبدل صباح التاسع من ذي الحجة، ثم نقل موعدها إلى ليلة الأول من محرم بقرار ملكي، ويذكر نحو 670 كيلوغراما من الحرير الخام و120 كيلوغراما من خيوط الذهب و100 كيلوغرام من خيوط الفضة."
  en: "Arab News, 30 July 2022, on the new Kaaba cover installed at the dawn of the Hijri year 1444: it had been replaced on the morning of 9 Dhu al-Hijja, and the event was moved to the eve of 1 Muharram by a royal decision; the report gives about 670 kilograms of raw silk, 120 kilograms of gold thread and 100 kilograms of silver thread."
  ur: "عرب نیوز، 30 جولائی 2022: ہجری سال 1444 کے آغاز پر کعبہ کا نیا غلاف چڑھایا گیا؛ پہلے یہ 9 ذی الحجہ کی صبح بدلا جاتا تھا، پھر شاہی فیصلے سے یکم محرم کی شب مقرر ہوا؛ رپورٹ میں تقریباً 670 کلوگرام خام ریشم، 120 کلوگرام سونے کے تار اور 100 کلوگرام چاندی کے تار کا ذکر ہے۔"
