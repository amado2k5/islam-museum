reliability_note: "Devotional Malian press profile, read via search extract on 4 November 2026. It gives his birth on 12 May 1955 at Tamani (Baraouéli) in the Ségou region, his training at Saad Touré's establishment and under the marabout Bama Worofana, the 1991 founding of Ançar Dine ('défenseurs de la foi') preaching 'un islam malékite et soufi' (a Maliki and Sufi Islam), his election to the High Islamic Council presidency in April 2019 succeeding Imam Mahmoud Dicko, and a day of prayers for the country's stability that he organised at the Grand Mosque of Bamako on 21 June 2025. Admiring in tone; used for the birth date and place (where it agrees with the French Wikipedia biography) and for the 2025 prayer day only."
