summary:
  ar: "ملف تعريفي في موقع «فاسو أكتو» ⁦(10 سبتمبر 2026)⁩ عن الشريف عثمان مدني حيدرة؛ يعطي مولده في 12 مايو 1955 بتاماني، وتأسيسه أنصار الدين سنة 1991، ورئاسته المجلس الإسلامي الأعلى منذ أبريل 2019، ويوم صلاة من أجل استقرار البلاد نظّمه في الجامع الكبير بباماكو في 21 يونيو 2025."
  en: "Faso Actu profile (10 September 2026) of Chérif Ousmane Madani Haïdara; it gives his birth on 12 May 1955 at Tamani, the 1991 founding of Ançar Dine, his High Islamic Council presidency since April 2019, and a day of prayers for the country's stability that he organised at Bamako's Grand Mosque on 21 June 2025."
  es: "Perfil de Faso Actu (10 de septiembre de 2026) de Chérif Ousmane Madani Haïdara; en él se indica su nacimiento el 12 de mayo de 1955 en Tamani, la fundación de Ançar Dine en 1991, su presidencia del Alto Consejo Islámico desde abril de 2019 y una jornada de oraciones por la estabilidad del país que organizó en la Gran Mezquita de Bamako el 21 de junio de 2025."
  fr: "Profil Faso Actu (10 septembre 2026) de Chérif Ousmane Madani Haïdara; il donne sa naissance le 12 mai 1955 à Tamani, la fondation en 1991 d'Ançar Dine, sa présidence du Haut Conseil islamique depuis avril 2019 et une journée de prières pour la stabilité du pays qu'il a organisée à la Grande Mosquée de Bamako le 21 juin 2025."
  ur: "Chérif Ousmane Madani Haïdara کا فاسو ایکٹو پروفائل ⁦(10 ستمبر 2026)⁩؛ یہ ان کی پیدائش 12 مئی 1955 کو تمانی میں ہوئی، 1991 میں انار دین کی بنیاد رکھی، اپریل 2019 سے ان کی اعلیٰ اسلامی کونسل کی صدارت، اور ملک کے استحکام کے لیے دعا کا دن جس کا اہتمام انہوں نے 21 جون 2025 کو باماکو کی گرینڈ مسجد میں کیا۔"
