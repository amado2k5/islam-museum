  ar: "مقالة ويكيبيديا الإنجليزية عن الشيخ فضل الله النوري؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 24 ديسمبر 1843 بمازندران ووفاته حنقًا في طهران في 31 يوليو 1909، وتصفه في متنها بأنه «رجل دين شيعي اثنا عشري بارز»، وتذكر دراسته عند ميرزا حسن الشيرازي ودوره في الثورة الدستورية الفارسية ومعارضته لها أخيرًا وإعدامه."
  en: "English Wikipedia article on Sheikh Fazlollah Nouri; used for entity facts only. It gives his birth on 24 December 1843 in Mazandaran and his hanging in Tehran on 31 July 1909, calls him in its lead 'a prominent Twelver Shia cleric', records his study under Mirza Hasan Shirazi, his part in the Persian Constitutional Revolution, his turn against it, and his trial and execution."
