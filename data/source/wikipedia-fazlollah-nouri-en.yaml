summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الشيخ فضل الله النوري؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 24 ديسمبر 1843 بمازندران ووفاته حنقًا في طهران في 31 يوليو 1909، وتصفه في متنها بأنه «رجل دين شيعي اثنا عشري بارز»، وتذكر دراسته عند ميرزا حسن الشيرازي ودوره في الثورة الدستورية الفارسية ومعارضته لها أخيرًا وإعدامه."
  en: "English Wikipedia article on Sheikh Fazlollah Nouri; used for entity facts only. It gives his birth on 24 December 1843 in Mazandaran and his hanging in Tehran on 31 July 1909, calls him in its lead 'a prominent Twelver Shia cleric', records his study under Mirza Hasan Shirazi, his part in the Persian Constitutional Revolution, his turn against it, and his trial and execution."
  es: "Artículo de la Wikipedia en inglés sobre el jeque Fazlollah Nouri; utilizado únicamente para datos sobre la persona. Indica que nació el 24 de diciembre de 1843 en Mazandarán y que fue ahorcado en Teherán el 31 de julio de 1909. En su introducción, lo describe como \"un destacado clérigo chií duodecimano\", y registra sus estudios con Mirza Hasan Shirazi, su participación en la Revolución Constitucional Persa, su posterior oposición a ella, su juicio y su ejecución."
  fr: "Article de Wikipédia en anglais sur le cheikh Fazlollah Nouri; utilisé uniquement pour les informations factuelles. Il indique sa naissance le 24 décembre 1843 à Mazandaran et son exécution par pendaison à Téhéran le 31 juillet 1909, le qualifie en introduction d’« éminent religieux chiite duodécimain », relate ses études auprès de Mirza Hasan Shirazi, son rôle dans la révolution constitutionnelle persane, son opposition à celle-ci, ainsi que son procès et son exécution."
  ur: "شیخ فضل اللہ نوری پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 24 دسمبر 1843 کو مازندران میں ان کی پیدائش اور 31 جولائی 1909 کو تہران میں پھانسی پر لٹکایا گیا، اسے اپنی قیادت میں 'ایک ممتاز بارہ ور شیعہ عالم' کہتا ہے، مرزا حسن شیرازی کے تحت اس کا مطالعہ، فارسی کے آئینی انقلاب میں اس کا حصہ، اس کے خلاف اس کی باری اور اس کی سزائے موت کو ریکارڈ کرتا ہے۔"
  tr: "Şeyh Fazlullah el-Nuri hakkında İngilizce Vikipedi makalesi yalnızca varlığın gerçekleri için kullanılmıştır. 24 Aralık 1843'te Mazandaran'da doğduğundan ve 31 Temmuz 1909'da Tahran'da öldüğünden bahseder, onu \"önde gelen bir On İki Yıllık Şii din adamı\" olarak tanımlar, Mirza Hasan el-Şirazi ile çalışmaları, Pers anayasa devriminden oynadığı rolü, son zamanlarda karşı çıkması ve idamı belirtilir."
  id: "Artikel Wikipedia bahasa Inggris tentang Sheikh Fazlullah al-Nuri hanya digunakan untuk fakta entitas tersebut. Artikel tersebut menyebutkan kelahirannya pada 24 Desember 1843 di Mazandaran, dan kematiannya di Teheran pada 31 Juli 1909, menggambarkannya sebagai \"ulama Syiah Dua Belas yang terkemuka,\" menyebutkan studinya bersama Mirza Hasan al-Shirazi, perannya dalam revolusi konstitusional Persia, penentangannya baru-baru ini terhadapnya, dan eksekusinya."
