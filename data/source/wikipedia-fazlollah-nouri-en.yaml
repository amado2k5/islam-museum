reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026. The reading route used for this batch did not expose a revision id, so none is recorded and the consultation date stands in its place (lane precedent). The article names his faith for him personally in its own text: the lead calls him 'a prominent Twelver Shia cleric' and the infobox gives his jurisprudence as 'Twelver Shia Islam', with his study under the Shia scholar Mirza Hasan Shirazi in the shrine cities of Iraq. Its birth date, 24 December 1843, conflicts with the Encyclopaedia Iranica's Hijri-anchored 24 November 1843; the split is disclosed in the record."
