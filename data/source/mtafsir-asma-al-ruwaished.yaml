reliability_note: "A forum thread reproducing the foundation's own campaign announcements of 1432 AH (2011), including material forwarded from the foundation's messages and a report taken from its site (asyeh.com); used for her part in the campaign, her campaign lecture and the foundation's publication of her book. The roughly twenty thousand subscribers figure is the organisers' own figure for the centre's message database at the time, recorded as such. The lecture excerpts quoted in the thread are not reproduced in the museum's prose. It gives no birth date and names no school of law for her. Read in full on 26 October 2026."
