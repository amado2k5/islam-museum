summary:
  ar: "موضوع في ملتقى أهل التفسير ينقل إعلانات مؤسسة آسية للاستشارات والتدريب عن حملتها «لك استجبنا» قبيل رمضان 1432هـ: حلقة من برنامج «نسمات» على قناة المجد شاركت فيها الدكتورة أسماء الرويشد بمداخلة، ومقتطفات من محاضرة لها ضمن الحملة موجهة إلى النساء، وإعلان المؤسسة عن صدور كتابها «لك استجبنا» وتوزيعه مجانًا في أنحاء الرياض مع مسابقة بمئة جائزة؛ ويذكر الإعلان أن قاعدة بيانات خدمة رسائل الجوال التي يبثها المركز تقارب عشرين ألف مشتركة."
  en: "A thread on the Multaqa Ahl al-Tafsir forum reproducing the Asiyah Foundation for Consultations and Training's announcements of its 'Lak Istajabna' (To You We Responded) campaign ahead of Ramadan 1432 AH (2011): an episode of the 'Nasamat' programme on Al-Majd channel to which Dr Asma Al-Ruwaished contributed, excerpts of a campaign lecture of hers addressed to women, and the foundation's announcement of her book 'Lak Istajabna', distributed free across Riyadh with a hundred-prize competition. The announcement puts the database of the centre's mobile-message service at roughly twenty thousand women subscribers."
