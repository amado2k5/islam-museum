  ar: "الصفحة «EALL entry SIM-000043» في Brill (Encyclopedia of Arabic Language and Linguistics)؛ ذُكرت في ملف بحث قُدّم إلى المتحف في 21 نوفمبر 2026، ولم يفتح المتحف الصفحة، ووافق المؤسس على استعمال الملف دون إعادة تحقق. تُستعمل في: الحروف الطباعية والطباعة العربية وكتلة يونيكود العربية."
  en: "The page \"EALL entry SIM-000043\" (Brill (Encyclopedia of Arabic Language and Linguistics)), named in a research file supplied to the museum on 21 November 2026; the museum did not open the page, and the founder approved using the file without re-verification. Used for: Arabic typography and the Unicode Arabic block."
  ur: "صفحہ «EALL entry SIM-000043» (Brill (Encyclopedia of Arabic Language and Linguistics))؛ یہ عجائب گھر کو 21 نومبر 2026ء کو دی گئی تحقیقی فائل میں مذکور ہے، عجائب گھر نے صفحہ نہیں کھولا اور بانی نے دوبارہ تصدیق کے بغیر فائل کے استعمال کی منظوری دی۔ استعمال: عربی ٹائپوگرافی اور یونی کوڈ کا عربی بلاک۔"
  fr: "La page « EALL entry SIM-000043 » (Brill (Encyclopedia of Arabic Language and Linguistics)), citée dans un fichier de recherche remis au musée le 21 novembre 2026 ; le musée n'a pas ouvert la page, et le fondateur a approuvé l'usage du fichier sans nouvelle vérification. Utilisée pour : la typographie arabe et le bloc arabe d'Unicode."
  es: "La página «EALL entry SIM-000043» (Brill (Encyclopedia of Arabic Language and Linguistics)), citada en un archivo de investigación entregado al museo el 21 de noviembre de 2026; el museo no abrió la página, y el fundador aprobó usar el archivo sin volver a verificar. Usada para: la tipografía árabe y el bloque árabe de Unicode."
  tr: "Brill (Arap Dili ve Dilbilim Ansiklopedisi) içindeki \"EALL girişi SIM-000043\" sayfası; 21 Kasım 2026'da müzeye sunulan bir araştırma dosyasında bahsedilmiştir, ancak müze sayfayı açmamış ve kurucu dosyayı yeniden doğrulama yapmadan kullanmayı kabul etmiştir. Kullanım alanı: yazı tipleri, Arapça baskı ve Arapça Unicode bloğu."
  id: "Halaman \"EALL entry SIM-000043\" di Brill (Ensiklopedia Bahasa dan Linguistik Arab); disebutkan dalam berkas penelitian yang dikirim ke museum pada 21 November 2026, tetapi museum tidak membuka halaman tersebut, dan pendiri setuju menggunakan berkas tersebut tanpa verifikasi ulang. Digunakan dalam: jenis huruf, cetak Arab, dan blok Unicode Arab."
