summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ولاية عنايت خان (1916–2004)، وتصفه بأنه متصوف من الطريقة العنايتية ومعلّم للتأمل ولتقاليد الطريقة الجشتية الصوفية، وتسرد كتبه الصوفية من تأليفه."
  en: "The English Wikipedia article on Vilayat Inayat Khan (1916–2004), which describes him as a mystic of the Inayati Order and a teacher of meditation and of the traditions of the Chishti Order of Sufism, and lists his own Sufi books."
  es: "El artículo de la Wikipedia en inglés sobre Vilayat Inayat Khan (1916-2004), que lo describe como un místico de la Orden Inayati y un maestro de meditación y de las tradiciones de la Orden Chishti del sufismo, enumera sus propios libros sufíes."
  fr: "L'article de Wikipédia en anglais sur Vilayat Inayat Khan (1916-2004), qui le décrit comme un mystique de l'ordre Inayati et un enseignant de méditation et des traditions de l'ordre Chishti du soufisme, et qui énumère ses propres livres soufis."
  ur: "ولایت عنایت خان (1916-2004) پر انگریزی ویکیپیڈیا کا مضمون، جس میں انہیں عنایتی حکم کے صوفیانہ اور مراقبہ کے استاد اور چشتی ترتیب تصوف کی روایات کے استاد کے طور پر بیان کیا گیا ہے، اور ان کی اپنی صوفی کتابوں کی فہرست دی گئی ہے۔"
  tr: "Inayat Khan (1916–2004) bölgesi hakkında İngilizce Wikipedia makalesi, onu Inayati tarikatından bir Sufi olarak tanımlayan ve meditasyon ile Gestatik Sufi tarikatının gelenekleri öğretmeni olarak tanımlıyor, Sufi kitaplarını listeliyor."
  id: "Artikel Wikipedia bahasa Inggris tentang provinsi Inayat Khan (1916–2004), menggambarkannya sebagai seorang Sufi dari tarekat Inayati dan guru meditasi serta tradisi tarekat Sufi Gestatik, mencantumkan kitab-kitab Sufinya."
