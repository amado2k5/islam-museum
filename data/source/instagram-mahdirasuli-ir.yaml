summary:
  ar: "حساب مهدي رسولي الموثّق على إنستغرام (@mahdirasuli_ir)؛ أظهر ملفه عند قراءته في 7 نوفمبر 2026 عدد 1,546,790 متابعًا و205 حسابات يتابعها، ورابطه الخارجي إلى صفحة روابط باسم MahdiRasouliOfficial."
  en: "Mahdi Rasouli's verified Instagram account (@mahdirasuli_ir); its profile, read on 7 November 2026, showed 1,546,790 followers and 205 following, with its external link leading to a link page named MahdiRasouliOfficial."
  es: "La cuenta verificada de Instagram de Mahdi Rasouli (@mahdirasuli_ir); su perfil, leído el 7 de noviembre de 2026, mostraba 1.546.790 seguidores y 205 seguidos, con un enlace externo que llevaba a una página llamada MahdiRasouliOfficial."
  fr: "Le compte Instagram vérifié de Mahdi Rasouli (@mahdirasuli_ir); son profil, consulté le 7 novembre 2026, affichait 1 546 790 abonnés et 205 abonnements, avec son lien externe menant à une page de lien nommée MahdiRasouliOfficial."
  ur: "مہدی رسولی کا تصدیق شدہ انسٹاگرام اکاؤنٹ (@mahdirasuli_ir); اس کا پروفائل، جو 7 نومبر 2026 کو پڑھا گیا، اس میں 1,546,790 فالوورز اور 205 فالوورز دکھائے گئے، اس کے بیرونی لنک نے MahdiRasouliOfficial کے نام سے ایک لنک پیج بنایا۔"
  tr: "Mehdi Rasouli'nin doğrulanmış Instagram hesabı (@mahdirasuli_ir); 7 Kasım 2026'da okunduğunda 1.546.790 takipçi ve takip ettiği 205 hesap gösteriliyordu; ayrıca MahdiRasouliOfficial adlı bir sayfaya dış bağlantı vardı."
  id: "Akun Instagram Mehdi Rasouli yang sudah diverifikasi (@mahdirasuli_ir); filenya menunjukkan 1.546.790 pengikut dan 205 akun yang ia ikuti saat dibaca pada 7 November 2026, dengan tautan eksternal ke halaman bernama MahdiRasouliOfficial."
