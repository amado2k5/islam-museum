reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. Its infobox gives his birth as 21 August 1981 in Le Chesnay, Ile-de-France, France, while its text says he was 'born to a Tunisian family in Paris in 1981' — Le Chesnay is a commune on the outskirts of Paris, and the record follows the infobox's precise place and records the text's broader wording. The article gives no personal name behind the artist name eL Seed and names no religion or school for him; his use of a Qur'anic verse on the Gabes minaret is the subject matter of a work, not an attestation of affiliation."
