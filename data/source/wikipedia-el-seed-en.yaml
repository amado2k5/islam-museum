summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن إل سيد؛ تُستخدم لوقائع الكيان فقط. توثّق ميلاده في 21 أغسطس 1981 في لو شيناي بفرنسا لأسرة تونسية، وفنّه «الكاليغرافيتي»، وجدارية مئذنة جامع الجارة بقابس سنة 2012، ومشروع «إدراك» في القاهرة، وإقامته في دبي."
  en: "English Wikipedia article on eL Seed; used for entity facts only. It records his birth on 21 August 1981 in Le Chesnay, France, to a Tunisian family, his 'calligraffiti', the 2012 Jara Mosque minaret mural in Gabes, the Perception project in Cairo, and his base in Dubai."
  es: "Artículo de la Wikipedia en inglés sobre eL Seed; utilizado únicamente para datos sobre la entidad. En él se registra su nacimiento el 21 de agosto de 1981 en Le Chesnay, Francia, en el seno de una familia tunecina, su «caligrafiti», el mural del minarete de la mezquita Jara de Gabes de 2012, el proyecto Perception en El Cairo y su residencia en Dubái."
  fr: "Article Wikipédia en anglais sur eL Seed; utilisé uniquement pour les informations sur l’entité. Il relate sa naissance le 21 août 1981 au Chesnay, en France, dans une famille tunisienne, ses « calligraffiti », la fresque murale du minaret de la mosquée Jara à Gabès en 2012, le projet Perception au Caire et son domicile à Dubaï."
  ur: "ای ایل سیڈ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 21 اگست 1981 کو فرانس کے لی چیسنے میں ایک تیونس کے خاندان میں اس کی پیدائش، اس کی 'خطاطی'، 2012 میں گیبس میں جارا مسجد کے مینار کی دیوار، قاہرہ میں پرسیپشن پروجیکٹ، اور دبئی میں اس کا اڈہ درج ہے۔"
  tr: "El Sayed hakkında İngilizce Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılmıştır. 21 Ağustos 1981'de Fransa'nın Le Chignay kentinde Tunuslu bir ailede doğumu, hat sanatı, 2012'de Gabes'teki Al-Jara Camii minaresinin duvar resmi, Kahire'deki \"Idrak\" projesi ve Dubai'deki ikametgahı belgelenmiştir."
  id: "Artikel Wikipedia bahasa Inggris tentang El Sayed hanya digunakan untuk fakta entitas tersebut. Kelahirannya didokumentasikan pada 21 Agustus 1981 di Le Chignay, Prancis, dari sebuah keluarga Tunisia, seni kaligrafinya, mural menara Masjid Al-Jara di Gabes pada 2012, proyek \"Idrak\" di Kairo, dan kediamannya di Dubai."
