reliability_note: "Community-edited encyclopedia article following the Arabic biographical tradition, retrieved in full at the stated revision. It heads his years 464–557 AH and states in the text that he was born at Seville in 465 AH/1072 CE — against the English article's 1094 — and died at Seville in 557 AH/1162 CE, on which both articles agree. It records his study of medicine under his father Abu al-Ala, his roughly ten years' imprisonment at Marrakesh under the Almoravids, his service as physician and vizier to the Almohad caliphs, and his friendship with Ibn Rushd. The birth-year conflict is preserved in the record, not silently harmonised."
