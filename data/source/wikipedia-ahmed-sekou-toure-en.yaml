summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أحمد سيكو توري؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في فرانا ودراسته في المدرسة القرآنية وعمله النقابي وقيادته الحزب الديمقراطي الغيني إلى الاستقلال سنة 1958 ورئاسته غينيا حتى وفاته في كليفلاند في 26 مارس 1984. تصفه نصا بأنه «مسلم متدين» من شعب الماندينكا وحفيد حفيد ساموري توري؛ ولا تسمّي له مذهبا."
  en: "English Wikipedia article on Ahmed Sékou Touré; used for entity facts only. It recounts his upbringing in Faranah, his Qur'anic schooling, his trade-union work, his leadership of the PDG to Guinea's independence in 1958, his presidency until his death in Cleveland on 26 March 1984. Its text calls him 'a devout Muslim' of the Mandinka people and the great-grandson of Samori Ture; it names no school for him."
  es: "Artículo de la Wikipedia en inglés sobre Ahmed Sékou Touré; utilizado únicamente para datos biográficos. Relata su infancia en Faranah, su formación coránica, su labor sindical, su liderazgo del PDG hasta la independencia de Guinea en 1958 y su presidencia hasta su fallecimiento en Cleveland el 26 de marzo de 1984. El texto lo describe como un «musulmán devoto» del pueblo mandinka y bisnieto de Samori Ture; no menciona ninguna escuela a la que pertenezca."
  fr: "Article de Wikipédia en anglais sur Ahmed Sékou Touré; utilisé uniquement à des fins d'information sur l'entité. Il relate son enfance à Faranah, ses études coraniques, son engagement syndical, son rôle à la tête du PDG jusqu'à l'indépendance de la Guinée en 1958, et sa présidence jusqu'à sa mort à Cleveland le 26 mars 1984. Le texte le décrit comme un musulman pieux d'origine mandingue et l'arrière-petit-fils de Samori Touré; aucune école n'est mentionnée."
  ur: "احمد سیکو ٹوری پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں فارانہ میں اس کی پرورش، اس کی قرآنی تعلیم، اس کے ٹریڈ یونین کے کام، 1958 میں گنی کی آزادی کے لیے PDG کی قیادت، 26 مارچ 1984 کو کلیولینڈ میں اس کی موت تک اس کی صدارت کا ذکر ہے۔ اس کے متن میں اسے 'ایک دیندار مسلمان' کہا گیا ہے۔ اس کے لیے کسی اسکول کا نام نہیں ہے۔"
