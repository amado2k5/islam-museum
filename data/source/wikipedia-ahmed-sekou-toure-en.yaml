summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أحمد سيكو توري؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في فرانا ودراسته في المدرسة القرآنية وعمله النقابي وقيادته الحزب الديمقراطي الغيني إلى الاستقلال سنة 1958 ورئاسته غينيا حتى وفاته في كليفلاند في 26 مارس 1984. تصفه نصا بأنه «مسلم متدين» من شعب الماندينكا وحفيد حفيد ساموري توري؛ ولا تسمّي له مذهبا."
  en: "English Wikipedia article on Ahmed Sékou Touré; used for entity facts only. It recounts his upbringing in Faranah, his Qur'anic schooling, his trade-union work, his leadership of the PDG to Guinea's independence in 1958, his presidency until his death in Cleveland on 26 March 1984. Its text calls him 'a devout Muslim' of the Mandinka people and the great-grandson of Samori Ture; it names no school for him."
