  ar: "مقالة ويكيبيديا الكاتالونية عن السيد علي الميرغني (1873-1968)؛ تُستخدم لوقائع الكيان فقط. تثبت كونه رأس الطريقة الختمية وراعيا للحزب الوطني الاتحادي ثم مؤسسا للحزب الديمقراطي الشعبي سنة 1956."
  en: "Catalan Wikipedia article on Sayyid Ali al-Mirghani (1873–1968); used for entity facts only. It confirms him as head of the Khatmiyya tariqa and patron first of the National Unionist Party, then founder of the People's Democratic Party in 1956."
  es: "Artículo de la Wikipedia en catalán sobre Sayyid Ali al-Mirghani (1873–1968); utilizado únicamente para datos sobre la entidad. Lo confirma como jefe de la tariqa Khatmiyya y primer mecenas del Partido Nacional Unionista, y posteriormente fundador del Partido Democrático Popular."
  fr: "Article de Wikipédia en catalan sur Sayyid Ali al-Mirghani (1873-1968); utilisé uniquement pour les informations sur l'entité. Il confirme qu'il était le chef de la confrérie Khatmiyya et le premier mécène du Parti unioniste national, puis le fondateur du Parti démocratique populaire."
  ur: "کاتالان ویکیپیڈیا مضمون سید علی المرغانی (1873–1968) پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ان کی تصدیق کرتا ہے کہ وہ خاتمیہ طریقہ کے سربراہ اور نیشنل یونینسٹ پارٹی کے پہلے سرپرست، پھر پیپلز ڈیموکریٹک پارٹی کے بانی"
  tr: "Bay Ali Al-Mirghani (1873-1968) hakkında Katalanca Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Bu, onun Khatmiya tarikatının başı ve Ulusal Birlikçi Parti'nin hamisi olduğunu, o dönemde 1956'da Halk Demokrat Partisi'nin kurucusu olduğunu kanıtlamaktadır."
  id: "Artikel Wikipedia Catalan tentang Tuan Ali Al-Mirghani (1873-1968); hanya digunakan untuk fakta entitas. Artikel ini membuktikan bahwa ia adalah kepala ordo Khatmiya dan pelindung Partai Unionis Nasional, kemudian pendiri Partai Demokrat Populer pada tahun 1956."
