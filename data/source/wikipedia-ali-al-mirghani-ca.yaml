reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. A short article resting on Warburg's 'Historical discord in the Nile valley'. It calls him 'cap de la tariqa o confraria khatamiyya del Sudan' (head of the Khatmiyya tariqa or brotherhood of Sudan) and patron of the National Unionist Party — a third, independent statement of his headship of the Sufi order. It gives the 1930s rivalry with Abd al-Rahman al-Mahdi of the Ansar, his patronage of al-Azhari's NUP victory in 1953, the June 1956 withdrawal of his followers to form the Sudanese People's Democratic Party and the fall of the government, the 1967 reunification decided at his own house, his death the following year and his succession by his son Muhammad Uthman al-Mirghani. It names no madhhab for him."
