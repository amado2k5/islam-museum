summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن نور الدين أمرابط؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته الطويلة من أياكس وأيندهوفن إلى غلطة سراي وواتفورد والنصر وأيك أثينا، و64 مباراة دولية مع المغرب، وكونه الأخ الأكبر لسفيان أمرابط، دون أي ذكر لديانته."
  en: "English Wikipedia article on Nordin Amrabat; used for entity facts only. It recounts his long career from Ajax and PSV to Galatasaray, Watford, Al-Nassr and AEK Athens, his 64 Morocco caps, and that he is Sofyan Amrabat's elder brother, with no mention of his religion."
  es: "Artículo de la Wikipedia en inglés sobre Nordin Amrabat; utilizado únicamente para obtener información sobre la persona. Relata su larga trayectoria, desde el Ajax y el PSV hasta el Galatasaray, el Watford, el Al-Nassr y el AEK Atenas, sus 64 partidos con la selección de Marruecos y que es el hermano mayor de Sofyan Amrabat, sin mencionar su religión."
  fr: "Article Wikipédia en anglais sur Nordin Amrabat; utilisé uniquement pour des informations factuelles. Il retrace sa longue carrière, de l'Ajax et du PSV Eindhoven à Galatasaray, Watford, Al-Nassr et l'AEK Athènes, ses 64 sélections en équipe nationale du Maroc, et précise qu'il est le frère aîné de Sofyan Amrabat, sans mentionner sa religion."
  ur: "Nordin Amrabat پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں Ajax اور PSV سے لے کر Galatasaray، Watford، النصر اور AEK ایتھنز تک ان کے طویل کیریئر کا ذکر کیا گیا ہے، اس کے 64 مراکش کیپس، اور یہ کہ وہ صوفیان امربت کے بڑے بھائی ہیں، ان کے مذہب کا کوئی ذکر نہیں ہے۔"
  tr: "Nordin Amrabat hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Ajax ve Eindhoven'dan Galatasaray, Watford, Al Nassr ve AEK Atina'ya kadar uzun kariyerini, Fas ile 64 uluslararası maçı ve Sofyan Amrabat'ın ağabeyi olmasını anlatır, dini hakkında hiçbir bilgi verilmez."
  id: "Artikel Wikipedia bahasa Inggris tentang Nordin Amrabat; digunakan hanya untuk fakta entitas. Artikel ini menceritakan karier panjangnya dari Ajax dan Eindhoven hingga Galatasaray, Watford, Al Nassr, dan AEK Athena, 64 pertandingan internasional melawan Maroko, serta menjadi kakak Sofyan Amrabat, tanpa menyebutkan agamanya."
