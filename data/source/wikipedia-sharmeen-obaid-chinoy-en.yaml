summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شرمين عبيد تشينوي؛ تُستخدم لوقائع الكيان فقط. تذكر ولادتها في كراتشي في 12 نوفمبر 1978، وتعليمها في كلية سميث وجامعة ستانفورد، وأفلامها الوثائقية وجائزتي الأوسكار وجوائز إيمي السبع، وتصفها بأنها مسلمة غوجراتية دون أن تسمّي لها مذهبًا."
  en: "English Wikipedia article on Sharmeen Obaid-Chinoy; used for entity facts only. It gives her birth in Karachi on 12 November 1978, her education at Smith College and Stanford University, her documentary films, two Academy Awards and seven Emmy Awards, and describes her as a Gujarati Muslim — it names no school for her."
  es: "Artículo de la Wikipedia en inglés sobre Sharmeen Obaid-Chinoy; utilizado únicamente para obtener información sobre la persona. Indica que nació en Karachi el 12 de noviembre de 1978, estudió en Smith College y en la Universidad de Stanford, realizó documentales, ganó dos premios Óscar y siete premios Emmy, y la describe como una musulmana gujarati; no menciona ninguna escuela a la que haya asistido."
  fr: "Article Wikipédia en anglais sur Sharmeen Obaid-Chinoy; utilisé uniquement pour les informations la concernant. On y apprend sa naissance à Karachi le 12 novembre 1978, ses études au Smith College et à l’université de Stanford, ses films documentaires, ses deux Oscars et ses sept Emmy Awards, et on la décrit comme une musulmane gujarati; aucun établissement scolaire n’est mentionné."
  ur: "شرمین عبید چنائے پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 12 نومبر 1978 کو کراچی میں اس کی پیدائش، اسمتھ کالج اور اسٹینفورڈ یونیورسٹی میں اس کی تعلیم، اس کی دستاویزی فلمیں، دو اکیڈمی ایوارڈز اور سات ایمی ایوارڈز، اور اسے ایک گجراتی مسلمان کے طور پر بیان کرتی ہے - اس میں اس کے لیے کسی اسکول کا نام نہیں ہے۔"
  tr: "Shermeen Obaid Chinoy hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 12 Kasım 1978'de Karaçi'de doğduğundan, Smith College ve Stanford Üniversitesi'ndeki eğitiminden, belgesellerinden, iki Oscar ve yedi Emmy Ödülü'nden bahseder ve kendisini bir tarikat olarak tanımlamadan Gujarati Müslümanı olarak tanımlar."
  id: "Artikel Wikipedia bahasa Inggris tentang Shermeen Obaid Chinoy; digunakan hanya untuk fakta entitas tersebut. Ia menyebutkan kelahirannya di Karachi pada 12 November 1978, pendidikannya di Smith College dan Universitas Stanford, dokumenternya, dua Oscar, dan tujuh Emmy Awards, serta menggambarkannya sebagai Muslim Gujarati tanpa menyebut sekte."
