  ar: "مقالة ويكيبيديا الإنجليزية عن شرمين عبيد تشينوي؛ تُستخدم لوقائع الكيان فقط. تذكر ولادتها في كراتشي في 12 نوفمبر 1978، وتعليمها في كلية سميث وجامعة ستانفورد، وأفلامها الوثائقية وجائزتي الأوسكار وجوائز إيمي السبع، وتصفها بأنها مسلمة غوجراتية دون أن تسمّي لها مذهبًا."
  en: "English Wikipedia article on Sharmeen Obaid-Chinoy; used for entity facts only. It gives her birth in Karachi on 12 November 1978, her education at Smith College and Stanford University, her documentary films, two Academy Awards and seven Emmy Awards, and describes her as a Gujarati Muslim — it names no school for her."
