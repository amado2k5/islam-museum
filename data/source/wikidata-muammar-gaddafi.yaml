summary:
  ar: "عنصر ويكيداتا Q19878 لمعمر القذافي. يحمل قيمتَي ميلاد متنافستَين ⁦(7 يونيو و19 يونيو 1942)⁩، ووفاته 20 أكتوبر 2011 بسرت، وقيمتَي ديانة (P140) في العنصر الواحد: القرآنية والسنية — أسرة بنيوية واحدة متناقضة داخليًّا."
  en: "Wikidata item Q19878 for Muammar Gaddafi. It carries two competing birth values (7 June and 19 June 1942), his death on 20 October 2011 at Sirte, and two religion values (P140) in the one item — Quranism and Sunni Islam — a single, internally contradictory structured family."
  es: "El elemento de Wikidata Q19878 corresponde a Muamar Gadafi. Contiene dos fechas de nacimiento contradictorias (7 de junio y 19 de junio de 1942), su muerte el 20 de octubre de 2011 en Sirte y dos religiones (P140) en un mismo elemento: el coranismo y el islam sunita, conformando una única familia con una estructura internamente contradictoria."
  fr: "L'élément Wikidata Q19878 pour Mouammar Kadhafi. Il comporte deux valeurs de naissance concurrentes (7 juin et 19 juin 1942), sa mort le 20 octobre 2011 à Syrte, et deux valeurs religieuses (P140) dans l'élément unique — Coran et Islam sunnite — une seule famille structurée, mais contradictoire en interne."
  ur: "وکی ڈیٹا آئٹم Q19878 برائے معمر قذافی۔ اس میں دو مسابقتی پیدائشی اقدار ہیں ⁦(7 جون اور 19 جون 1942)⁩، اس کی موت 20 اکتوبر 2011 کو سرتے میں، اور دو مذہبی اقدار (P140) ایک آئٹم میں - قرآنیت اور سنی اسلام - ایک واحد، اندرونی طور پر متضاد ساختہ خاندان۔"
