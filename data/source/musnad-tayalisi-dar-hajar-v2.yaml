summary:
  ar: "الطبعة الأولى (جيزة، دار هجر، 1420هـ/1999م) للجزء الثاني من مسند أبي داود الطيالسي، بتحقيق الدكتور محمد بن عبد المحسن التركي بالتعاون مع مركز البحوث والدراسات العربية والإسلامية بدار هجر. يضم أحاديث مرقمة في الطبعة، منها ما يبدأ بحديث أبي مسعود البدري (641)."
  en: "First edition (Giza, Dar Hajar, 1420 AH / 1999 CE) of volume 2 of the Musnad of Abu Dawud al-Tayalisi, edited by Muhammad ibn Abd al-Muhsin al-Turki with the Centre for Arab and Islamic Research and Studies at Dar Hajar. Its numbered reports include the report from Abu Mas'ud al-Badri (641) at the start of the portion scanned."
