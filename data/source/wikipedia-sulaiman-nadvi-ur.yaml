summary:
  ar: "مقالة ويكيبيديا الأردية عن سيد سليمان الندوي؛ تعطي مولده في ديسنه في 22 تشرين الثاني 1884 ودراسته في بهلواري شريف وفي ندوة العلماء بلكنؤ وإكماله «سيرة النبي» لشبلي النعماني وتأسيسه دار المصنفين ومجلة «معارف» وهجرته إلى كراتشي في حزيران 1950 ووفاته فيها؛ يعطي مطلعها وفاته في 23 تشرين الثاني 1953 بينما يعطيها قسم الوفاة في 22 تشرين الثاني 1953. ولا يسمّي متنها مذهبًا ولا بيعة."
  en: "The Urdu Wikipedia article on Syed Sulaiman Nadvi; it gives his birth at Desna on 22 November 1884, his studies at Phulwari Sharif and at Nadwatul Ulama in Lucknow, his completion of Shibli Nomani's Sirat-un-Nabi, his founding of Darul Musannifeen and the journal Ma'arif, his migration to Karachi in June 1950 and his death there — its lead gives 23 November 1953 while its death section gives 22 November 1953. Its prose names no school and no bay'ah."
