summary:
  ar: "مقالة ويكيبيديا الأردية عن سيد سليمان الندوي؛ تعطي مولده في ديسنه في 22 تشرين الثاني 1884 ودراسته في بهلواري شريف وفي ندوة العلماء بلكنؤ وإكماله «سيرة النبي» لشبلي النعماني وتأسيسه دار المصنفين ومجلة «معارف» وهجرته إلى كراتشي في حزيران 1950 ووفاته فيها؛ يعطي مطلعها وفاته في 23 تشرين الثاني 1953 بينما يعطيها قسم الوفاة في 22 تشرين الثاني 1953. ولا يسمّي متنها مذهبًا ولا بيعة."
  en: "The Urdu Wikipedia article on Syed Sulaiman Nadvi; it gives his birth at Desna on 22 November 1884, his studies at Phulwari Sharif and at Nadwatul Ulama in Lucknow, his completion of Shibli Nomani's Sirat-un-Nabi, his founding of Darul Musannifeen and the journal Ma'arif, his migration to Karachi in June 1950 and his death there — its lead gives 23 November 1953 while its death section gives 22 November 1953. Its prose names no school and no bay'ah."
  es: "El artículo de Wikipedia en urdu sobre Syed Sulaiman Nadvi indica su nacimiento en Desna el 22 de noviembre de 1884, sus estudios en Phulwari Sharif y en Nadwatul Ulama en Lucknow, la finalización del Sirat-un-Nabi de Shibli Nomani, la fundación de Darul Musannifeen y la revista Ma'arif, su migración a Karachi en junio de 1950 y su muerte allí. El texto principal indica el 23 de noviembre de 1953, mientras que la sección sobre su fallecimiento indica el 22 de noviembre de 1953. No menciona ninguna escuela ni ningún juramento de lealtad (bay'ah)."
  fr: "L'article de Wikipédia en ourdou consacré à Syed Sulaiman Nadvi mentionne sa naissance à Desna le 22 novembre 1884, ses études à Phulwari Sharif et à Nadwatul Ulama à Lucknow, l'achèvement de son ouvrage Sirat-un-Nabi de Shibli Nomani, la fondation de Darul Musannifeen et de la revue Ma'arif, son installation à Karachi en juin 1950 et son décès dans cette ville (le chapitre introductif indique le 23 novembre 1953, tandis que la section relative à son décès mentionne le 22 novembre 1953). Le texte ne fait mention ni d'école ni de serment d'allégeance."
  ur: "سید سلیمان ندوی پر اردو ویکیپیڈیا مضمون؛ یہ 22 نومبر 1884 کو دیسنا میں ان کی پیدائش، پھلواری شریف اور ندوۃ العلماء لکھنؤ میں ان کی تعلیم، شبلی نعمانی کی سیرت النبی کی تکمیل، ان کی دارالمصنفین اور جریدہ معارف کی تاسیس، جون 1950 میں کراچی ہجرت اور نومبر 1953 میں ان کی وفات - اس کا سیکشن 1953 میں وفات پاتا ہے۔ 22 نومبر 1953 دیتا ہے۔ اس کی نثر میں کوئی مکتب اور کوئی بیعت نہیں ہے۔"
  tr: "Sayyid Süleyman el-Nadwi hakkında Urduca Vikipedi makalesi, 22 Kasım 1884'te Disna'da doğumunu, Pehlwari Şerif'teki eğitimini, Lucknow'daki Alimler Konferansı'nı, Shibli al-Numani'nin 'Sirat al-Nabi'sini tamamlamasını, Dar al-Musannifin ve 'Maarif' dergisini kurmasını, Haziran 1950'de Karaçi'ye göçünü ve orada vefatını anlatır; başlangıcı 23 Kasım 1953'teki ölümü olarak verilirken, ölüm bölümü 22 Kasım 1953'te verilmiştir. Metni okul veya yemin olarak adlandırılmaz."
  id: "Artikel Wikipedia Urdu tentang Sayyid Suleiman Al-Nadwi menceritakan kelahirannya di Disna pada 22 November 1884, studinya di Pahlwari Sharif, Konferensi Sarjana di Lucknow, penyelesaian 'Sirat al-Nabi' oleh Shibli al-Numani, pendirian Dar al-Musannifin dan majalah 'Maarif,' migrasinya ke Karachi pada Juni 1950, dan kematiannya di sana; awalnya disebut sebagai kematiannya pada 23 November 1953, sedangkan bagian kematiannya diberikan pada 22 November 1953. Teksnya tidak disebut sekolah atau janji."
