reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md). Read in full on 26 October 2026 and checked against the recorded revision. Its infobox leaves the religion (مذهب) field blank and lists Marxism and Marxism-Leninism in the school-of-thought (مکتب) field, a political ideology; its text gives his birth year also as 1305 AH, names his father Mirza Ahmad Elhami as a religious poet and a follower of the Ni'matullahi order and disciple of Heyran Alishah, and his mother, on the evidence of Lahouti's own letter, as a Kurdish woman of the Qalkhani tribe who followed the Yarsan faith. Those are his parents' affiliations, recorded as family background only."
