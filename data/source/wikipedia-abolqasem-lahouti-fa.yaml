summary:
  ar: "مقالة ويكيبيديا الفارسية عن أبي القاسم لاهوتي؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 20 مهر 1264 هـ.ش في كرمانشاه ووفاته في 25 اسفند 1335 هـ.ش في موسكو ودفنه في مقبرة نوفوديفيتشي، وتروي شورش تبريز 1922 ووزارته لثقافة طاجيكستان السوفييتية ونائبته في رئاسة اتحاد كتّاب الاتحاد السوفييتي."
  en: "Persian Wikipedia article on Abolqasem Lahouti; used for entity facts only. It gives his birth on 20 Mehr 1264 SH at Kermanshah and his death on 25 Esfand 1335 SH at Moscow, with burial at Novodevichy Cemetery, and recounts the 1922 Tabriz revolt, his ministry of culture in Soviet Tajikistan, and his vice-chairmanship under Maxim Gorky in the Soviet Writers' Union."
