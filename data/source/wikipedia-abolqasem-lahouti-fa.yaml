summary:
  ar: "مقالة ويكيبيديا الفارسية عن أبي القاسم لاهوتي؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 20 مهر 1264 هـ.ش في كرمانشاه ووفاته في 25 اسفند 1335 هـ.ش في موسكو ودفنه في مقبرة نوفوديفيتشي، وتروي شورش تبريز 1922 ووزارته لثقافة طاجيكستان السوفييتية ونائبته في رئاسة اتحاد كتّاب الاتحاد السوفييتي."
  en: "Persian Wikipedia article on Abolqasem Lahouti; used for entity facts only. It gives his birth on 20 Mehr 1264 SH at Kermanshah and his death on 25 Esfand 1335 SH at Moscow, with burial at Novodevichy Cemetery, and recounts the 1922 Tabriz revolt, his ministry of culture in Soviet Tajikistan, and his vice-chairmanship under Maxim Gorky in the Soviet Writers' Union."
  es: "Artículo de la Wikipedia en persa sobre Abolqasem Lahouti; utilizado únicamente para datos sobre la persona. Indica su nacimiento el 20 de Mehr de 1264 SH en Kermanshah y su muerte el 25 de Esfand de 1335 SH en Moscú, con sepultura en el cementerio de Novodevichy, y relata la revuelta de Tabriz de 1922, su ministerio de cultura en el Tayikistán soviético y su vicepresidencia bajo Maxim Gorki en la Unión de Escritores Soviéticos."
  fr: "Article Wikipédia en persan sur Abolqasem Lahouti; utilisé uniquement pour les informations biographiques. Il indique sa naissance le 20 Mehr 1264 SH à Kermanshah et sa mort le 25 Esfand 1335 SH à Moscou, avec inhumation au cimetière Novodievitchi, et relate la révolte de Tabriz de 1922, son ministère de la Culture au Tadjikistan soviétique et sa vice-présidence, sous Maxime Gorki, de l'Union des écrivains soviétiques."
  ur: "ابوالقاسم لاہوتی پر فارسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی پیدائش 20 مہر 1264 کو کرمانشاہ میں ہوئی اور اس کی موت 25 اسفند 1335 کو ماسکو میں ہوئی، نووڈیویچی قبرستان میں تدفین کے ساتھ، اور 1922 کی تبریز کی بغاوت، سوویت تاجکستان میں اس کی وزارت ثقافت، اور اس کے سوویت حکومت کے ماتحت سوویت حکومت کے حکمرانوں کا ذکر ہے۔ یونین"
