summary:
  ar: "مقالة ويكيبيديا العربية عن عبد الرشيد علي شرماركي؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في 16 أكتوبر 1919 ⁦(خلافا للإنجليزية)⁩ ورئاسته الوزراء ثم الرئاسة ⁦(تبدأ عندها في 10 يونيو 1967)⁩ ووفاته اغتيالا في 15 أكتوبر 1969، ولا تذكر دينه."
  en: "Arabic Wikipedia article on Abdirashid Ali Shermarke; used for entity facts only. It gives his birth on 16 October 1919 (against the English article's 8 June), his premiership and presidency (which it starts on 10 June 1967) and his assassination on 15 October 1969. It says nothing about his religion."
  es: "Artículo en árabe de la Wikipedia sobre Abdirashid Ali Shermarke; se utiliza únicamente para obtener información sobre la persona. Indica que nació el 16 de octubre de 1919 (en contraposición al 8 de junio que indica el artículo en inglés), que comenzó su mandato como primer ministro y presidente (el cual comienza el 10 de junio de 1967) y que fue asesinado el 15 de octubre de 1969. No menciona nada sobre su religión."
  fr: "Article de Wikipédia en arabe sur Abdirashid Ali Shermarke; utilisé uniquement pour les informations relatives à l'entité. Il indique sa naissance le 16 octobre 1919 (contrairement à l'article en anglais qui mentionne le 8 juin), son mandat de Premier ministre puis de président (qui débute le 10 juin 1967) et son assassinat le 15 octobre 1969. Il ne mentionne rien concernant sa religion."
  ur: "عربی ویکیپیڈیا مضمون عبدالرشید علی شیرمارکے پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 16 اکتوبر 1919 کو ان کی پیدائش ⁦(انگریزی آرٹیکل 8 جون کے برخلاف)⁩، ان کی وزارت عظمیٰ اور صدارت ⁦(جس کا آغاز 10 جون 1967 سے ہوتا ہے)⁩ اور 15 اکتوبر 1969 کو ان کا قتل۔ اس میں ان کے مذہب کے بارے میں کچھ نہیں کہا گیا ہے۔"
  tr: "Abdul Rashid Ali Sharmarki hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Doğumunu 16 Ekim 1919'da (İngilizcenin aksine), başbakanlığını, ardından başbakanlığını (10 Haziran 1967'de başlayan) ve 15 Ekim 1969'da suikastla ölmesini anlatır, dini belirtilmeden anlatılır."
  id: "Artikel Wikipedia berbahasa Arab tentang Abdul Rashid Ali Sharmarki; hanya digunakan untuk fakta entitas. Artikel ini menceritakan kelahirannya pada 16 Oktober 1919 (berbeda dengan bahasa Inggris), masa jabatannya lalu masa jabatannya (mulai 10 Juni 1967), dan kematiannya akibat pembunuhan pada 15 Oktober 1969, tanpa menyebutkan agamanya."
