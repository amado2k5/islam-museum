summary:
  ar: "ملف مؤسسة أترجة عن مؤسسها الشيخ هيثم تميم: أسس المؤسسة (تؤرخ هذه الصفحة تأسيسها بسنة 2000 وتذكر مواد أخرى للمؤسسة سنة 2001)، ودرس في دمشق، وكان محاضرا أول في الجامعة الإسلامية في بيروت، ويحمل إجازات عالية، ويدير «حلول الشريعة»، ويوصف بأنه قائد الجالية السنية اللبنانية في المملكة المتحدة تحت دار الفتوى."
  en: "The Utrujj Foundation's profile of its founder Shaykh Haytham Tamim: he established the foundation (this page dates it to 2000; other Utrujj materials give 2001), studied in Damascus, was a senior lecturer at the Islamic University of Beirut, holds high ijazas, directs Shariah Solutions, and is described as leader of the Lebanese Sunni community in the UK under Dar Al-Fatwa."
