summary:
  ar: "ملف مؤسسة أترجة عن مؤسسها الشيخ هيثم تميم: أسس المؤسسة ⁦(تؤرخ هذه الصفحة تأسيسها بسنة 2000 وتذكر مواد أخرى للمؤسسة سنة 2001)⁩، ودرس في دمشق، وكان محاضرا أول في الجامعة الإسلامية في بيروت، ويحمل إجازات عالية، ويدير «حلول الشريعة»، ويوصف بأنه قائد الجالية السنية اللبنانية في المملكة المتحدة تحت دار الفتوى."
  en: "The Utrujj Foundation's profile of its founder Shaykh Haytham Tamim: he established the foundation (this page dates it to 2000; other Utrujj materials give 2001), studied in Damascus, was a senior lecturer at the Islamic University of Beirut, holds high ijazas, directs Shariah Solutions, and is described as leader of the Lebanese Sunni community in the UK under Dar Al-Fatwa."
  es: "Perfil del fundador de la Fundación Utrujj, el jeque Haytham Tamim: fundó la organización (esta página la fecha en 2000; otros materiales de Utrujj indican 2001), estudió en Damasco, fue profesor titular en la Universidad Islámica de Beirut, posee altas ijazas, dirige Shariah Solutions y se le describe como líder de la comunidad suní libanesa en el Reino Unido bajo Dar Al-Fatwa."
  fr: "Profil du fondateur de la Fondation Utrujj, le cheikh Haytham Tamim: il a créé la fondation (cette page la date de 2000; d’autres documents d’Utrujj donnent 2001), a étudié à Damas, a été maître de conférences à l’Université islamique de Beyrouth, détient de hautes ijazas, dirige Shariah Solutions et est décrit comme le chef de la communauté sunnite libanaise au Royaume-Uni sous Dar Al-Fatwa."
  ur: "اترج فاؤنڈیشن کا اپنے بانی شیخ ہیثم تمیم کا پروفائل: اس نے فاؤنڈیشن قائم کی ⁦(اس صفحہ کی تاریخ 2000 ہے؛ دیگر اتروج مواد 2001 دیتا ہے)⁩، دمشق میں تعلیم حاصل کی، بیروت کی اسلامی یونیورسٹی میں سینئر لیکچرر تھے، اعلیٰ اعجاز رکھتے ہیں، شریعہ حل کی ہدایت کرتے ہیں، اور یو کے کے تحت سنی کمیونٹی کے رہنما ہیں۔ الفتاویٰ۔"
  tr: "Atraja Vakfı'nın kurucusu Şeyh Haitham Tamim hakkında dosyası: Vakfı kurdu (bu sayfa kuruluşunu 2000 yılında tarihlendirir ve 2001'de vakfın diğer maddelerinden bahseder), Şam'da eğitim almış, Beyrut İslam Üniversitesi'nde kıdemli öğretim üyesi olmuş, yüksek lisanslara sahiptir, 'Hulul al-Şeria'yı yönetmektedir ve Fetva Dar altında Birleşik Krallık'taki Lübnan Sünni topluluğunun lideri olarak tanımlanmaktadır."
  id: "Berkas Yayasan Atraja tentang pendirinya, Sheikh Haitham Tamim: Ia mendirikan yayasan (halaman ini menandai pendiriannya pada tahun 2000 dan menyebutkan artikel lain dari yayasan pada tahun 2001), belajar di Damaskus, pernah menjadi dosen senior di Universitas Islam Beirut, memegang lisensi tinggi, mengelola 'Hulul al-Sharia', dan digambarkan sebagai pemimpin komunitas Sunni Lebanon di Inggris di bawah Dar Fatwa."
