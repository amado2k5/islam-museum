reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision via the MediaWiki API on 1 November 2026; a fact is used only where the article cites a source for it (Wikipedia broad rule). It records his birth on 16 February 1984 in La Marsa (its early-life section says Tunis, the capital of which La Marsa is a coastal suburb), his move to France at 15 to study and train, his computer-science degree at the University of Southern California (2007), his Olympic golds at Beijing 2008 (1500 m freestyle) and London 2012 (10 km marathon) with bronze in the 2012 1500 m freestyle, his world titles at Rome 2009 and Barcelona 2013, and his 18-month ban after a positive Adderall test in December 2006, which annulled his 2007 world championship results. It names no religion for him."
