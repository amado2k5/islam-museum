summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سر سكندر حياة خان؛ تُستخدم لوقائع الكيان فقط. تروي أنه وُلد في 5 حزيران 1892 في ملتان وتوفي في 26 كانون الأول 1942 في لاهور ودُفن عند أعتاب المسجد البادشاهي، وأنه أول رئيس وزراء للبنجاب (1937–1942)، وقّع ميثاق جناح–سكندر سنة 1937، وساند قرار لاهور مع معارضته تقسيم الهند نفسه، وأنه ابن نواب محمد حياة خان."
  en: "English Wikipedia article on Sir Sikandar Hayat Khan; used for entity facts only. It recounts that he was born on 5 June 1892 at Multan and died on 26 December 1942 at Lahore and was buried at the footsteps of the Badshahi Mosque, that he was the first Premier of the Punjab (1937–1942), signed the Jinnah–Sikandar Pact in 1937, supported the Lahore Resolution while opposing the partition of India itself, and was the son of Nawab Muhammad Hayat Khan."
  es: "Artículo de la Wikipedia en inglés sobre Sir Sikandar Hayat Khan; utilizado únicamente para datos biográficos. Relata que nació el 5 de junio de 1892 en Multan y falleció el 26 de diciembre de 1942 en Lahore, siendo enterrado a los pies de la Mezquita Badshahi. También menciona que fue el primer Primer Ministro del Punjab (1937-1942), firmó el Pacto Jinnah-Sikandar en 1937, apoyó la Resolución de Lahore oponiéndose a la partición de la India y era hijo del Nawab Muhammad Hayat Khan."
  fr: "Article de Wikipédia en anglais sur Sir Sikandar Hayat Khan; utilisé uniquement à des fins d’information sur l’entité. Il relate qu’il est né le 5 juin 1892 à Multan et décédé le 26 décembre 1942 à Lahore, où il a été enterré au pied de la mosquée Badshahi; qu’il a été le premier Premier ministre du Pendjab (1937-1942); qu’il a signé le pacte Jinnah-Sikandar en 1937; qu’il a soutenu la résolution de Lahore tout en s’opposant à la partition de l’Inde; et qu’il était le fils du Nawab Muhammad Hayat Khan."
  ur: "سر سکندر حیات خان پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں بتایا گیا ہے کہ وہ 5 جون 1892 کو ملتان میں پیدا ہوئے اور 26 دسمبر 1942 کو لاہور میں انتقال کر گئے اور بادشاہی مسجد کے قدموں میں دفن ہوئے، وہ پنجاب کے پہلے وزیر اعظم (1937-1942) تھے، جناح سکندر معاہدے پر دستخط کرتے ہوئے 1937ء میں لاہور کی مخالفت اور خود بھارت کی مخالفت کی حمایت کرتے تھے۔ نواب محمد حیات خان کے بیٹے تھے۔"
  tr: "Sikandar Hayat Khan'ın sırrıyla ilgili İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 5 Haziran 1892'de Multan'da doğduğu, 26 Aralık 1942'de Lahor'da öldüğü ve Badshahi Camii'nin kapısına defnedildiği anlatılıyor. Pencap'ın ilk Başbakanı (1937–1942), 1937'de Jinnah–Sikandar Paktı'nı imzaladı, Hindistan'ın bölünmesine karşı çıkarken Lahor Kararı'nı destekledi ve Nawab Muhammad Hayat Khan'ın oğluydu."
  id: "Artikel Wikipedia bahasa Inggris tentang rahasia Sikandar Hayat Khan; digunakan hanya untuk fakta entitas. Diceritakan bahwa ia lahir pada 5 Juni 1892 di Multan, meninggal pada 26 Desember 1942 di Lahore, dan dimakamkan di depan pintu Masjid Badshahi. Ia adalah Perdana Menteri pertama Punjab (1937–1942), menandatangani Pakta Jinnah–Sikandar pada tahun 1937, mendukung Keputusan Lahore sambil menentang pemisahan India itu sendiri, dan merupakan putra Nawab Muhammad Hayat Khan."
