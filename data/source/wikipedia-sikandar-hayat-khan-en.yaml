summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سر سكندر حياة خان؛ تُستخدم لوقائع الكيان فقط. تروي أنه وُلد في 5 حزيران 1892 في ملتان وتوفي في 26 كانون الأول 1942 في لاهور ودُفن عند أعتاب المسجد البادشاهي، وأنه أول رئيس وزراء للبنجاب (1937–1942)، وقّع ميثاق جناح–سكندر سنة 1937، وساند قرار لاهور مع معارضته تقسيم الهند نفسه، وأنه ابن نواب محمد حياة خان."
  en: "English Wikipedia article on Sir Sikandar Hayat Khan; used for entity facts only. It recounts that he was born on 5 June 1892 at Multan and died on 26 December 1942 at Lahore and was buried at the footsteps of the Badshahi Mosque, that he was the first Premier of the Punjab (1937–1942), signed the Jinnah–Sikandar Pact in 1937, supported the Lahore Resolution while opposing the partition of India itself, and was the son of Nawab Muhammad Hayat Khan."
