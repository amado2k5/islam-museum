  ar: "مقالة ويكيبيديا الأردية عن حكيم محمد أجمل خان الدهلوي؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في 12 شباط 1868 ووفاته في 29 كانون الأول 1927، وتعليمه القرآني والطبي، وطبيبه لدى نواب رامبور، وألقابه (حاذق الملك ومسيح الملك)، وتأسيسه كلية الطبية وتوليه الجامعة الملية الإسلامية 1920."
  en: "Urdu Wikipedia article on Hakim Mohammad Ajmal Khan Dehlvi; used for entity facts only. It gives his birth on 12 February 1868 and his death on 29 December 1927, recounts his Qur'an memorisation and medical training, his post as physician to the Nawab of Rampur, his titles Haziq-ul-Mulk and Masih-ul-Mulk, his founding of the Tibbia College and his headship of Jamia Millia Islamia from 1920."
