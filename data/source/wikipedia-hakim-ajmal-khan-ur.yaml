summary:
  ar: "مقالة ويكيبيديا الأردية عن حكيم محمد أجمل خان الدهلوي؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في 12 شباط 1868 ووفاته في 29 كانون الأول 1927، وتعليمه القرآني والطبي، وطبيبه لدى نواب رامبور، وألقابه ⁦(حاذق الملك ومسيح الملك)⁩، وتأسيسه كلية الطبية وتوليه الجامعة الملية الإسلامية 1920."
  en: "Urdu Wikipedia article on Hakim Mohammad Ajmal Khan Dehlvi; used for entity facts only. It gives his birth on 12 February 1868 and his death on 29 December 1927, recounts his Qur'an memorisation and medical training, his post as physician to the Nawab of Rampur, his titles Haziq-ul-Mulk and Masih-ul-Mulk, his founding of the Tibbia College and his headship of Jamia Millia Islamia from 1920."
  es: "Artículo de Wikipedia en urdu sobre Hakim Mohammad Ajmal Khan Dehlvi; utilizado únicamente para datos biográficos. Indica su nacimiento el 12 de febrero de 1868 y su fallecimiento el 29 de diciembre de 1927, relata su memorización del Corán y su formación médica, su cargo como médico del Nawab de Rampur, sus títulos de Haziq-ul-Mulk y Masih-ul-Mulk, la fundación del Tibbia College y su dirección de Jamia Millia Islamia desde 1920."
  fr: "Article de Wikipédia en ourdou sur Hakim Mohammad Ajmal Khan Dehlvi; utilisé uniquement à titre informatif. Il indique sa naissance le 12 février 1868 et sa mort le 29 décembre 1927, relate sa mémorisation du Coran et sa formation médicale, son poste de médecin du Nawab de Rampur, ses titres de Haziq-ul-Mulk et Masih-ul-Mulk, la fondation du Tibbia College et sa direction de la Jamia Millia Islamia à partir de 1920."
  ur: "حکیم محمد اجمل خان دہلوی پر اردو ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 12 فروری 1868 کو ان کی پیدائش اور 29 دسمبر 1927 کو ان کی وفات کا ذکر کرتا ہے، ان کے حفظ قرآن اور طبی تربیت، رام پور کے نواب کے لیے ان کے طبیب کے عہدے، ان کے القابات حاذق الملک اور مسیح الملک، طبیہ کالج کی بنیاد اور جامعہ اسلامیہ کی سربراہی 1920 سے ان کی وفات کا ذکر ہے۔"
  tr: "Hakim Muhammad Ajmal Khan Dehlawi hakkında Urduca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 12 Şubat 1868'deki doğumundan, 29 Aralık 1927'deki ölümünden, Kur'an ve tıp eğitiminden, Rampur Nawablarının doktorluk rolünden, unvanlarından (Haziq al-Mulk ve Masih al-Mulk), bir tıp fakültesi kurduğundan ve 1920'de Ulusal İslam Üniversitesi'ni kurmasından bahseder."
  id: "Artikel Wikipedia berbahasa Urdu tentang Hakim Muhammad Ajmal Khan Dehlawi; digunakan hanya untuk fakta entitas tersebut. Artikel tersebut menyebutkan kelahirannya pada 12 Februari 1868, dan kematiannya pada 29 Desember 1927, pendidikan Al-Qur'an dan kedokterannya, perannya sebagai dokter di bawah Nawab Rampur, gelar-gelarnya (Haziq al-Mulk dan Masih al-Mulk), pendirian perguruan tinggi kedokteran, dan penetapan Universitas Islam Nasional pada tahun 1920."
