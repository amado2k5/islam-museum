summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أبو القاسم فضل الحق (1873–1962)، رئيس وزراء البنغال الأول (1937–1943) ومقدّم قرار لاهور؛ تعطي مولده في 26 تشرين الأول 1873 في ساتوريا ووفاته في 27 نيسان 1962 في دكا ودفنه في ضريح القادة الثلاثة، وتصفه بأنه وُلد لأسرة مسلمة بنغالية دون أن تسمي مذهبه."
  en: "The English Wikipedia article on A. K. Fazlul Huq (1873–1962), first prime minister of Bengal (1937–1943) and mover of the Lahore Resolution; it gives his birth on 26 October 1873 at Saturia, his death on 27 April 1962 at Dacca and his burial in the Mausoleum of Three Leaders, and says he was born to a Bengali Muslim family without naming any school for him."
  es: "El artículo de la Wikipedia en inglés sobre AK Fazlul Huq (1873-1962), primer ministro de Bengala (1937-1943) e impulsor de la Resolución de Lahore, indica que nació el 26 de octubre de 1873 en Saturia, falleció el 27 de abril de 1962 en Dacca y fue enterrado en el Mausoleo de los Tres Líderes. Menciona que nació en una familia musulmana bengalí, sin nombrar ninguna escuela a la que perteneció."
  fr: "L'article de Wikipédia en anglais sur AK Fazlul Huq (1873-1962), premier ministre du Bengale (1937-1943) et auteur de la résolution de Lahore; il indique sa naissance le 26 octobre 1873 à Saturia, sa mort le 27 avril 1962 à Dacca et son inhumation dans le mausolée des Trois Leaders, et dit qu'il est né dans une famille musulmane bengalie sans nommer d'école en son honneur."
  ur: "اے کے فضل الحق (1873–1962)، بنگال کے پہلے وزیر اعظم (1937–1943) اور قرارداد لاہور کے مووور پر انگریزی ویکیپیڈیا کا مضمون؛ یہ 26 اکتوبر 1873 کو ستوریہ میں اس کی پیدائش، 27 اپریل 1962 کو ڈھاکہ میں اس کی موت اور تین رہنماؤں کے مقبرے میں اس کی تدفین، اور کہتا ہے کہ وہ ایک بنگالی مسلمان گھرانے میں پیدا ہوئے بغیر اس کے لیے کسی اسکول کا نام نہیں لیا۔"
  tr: "Bengal'in ilk Başbakanı (1937–1943) ve Lahor Kararı'nın öncüsü olan Abu al-Qasim Fazl-ul-Haq (1873–1962) hakkında İngilizce Wikipedia makalesi, 26 Ekim 1873'te Satoria'da doğduğunu, 27 Nisan 1962'de Dakka'da öldüğünü ve Üç Lider'in türbesinde defnedilmesini belirtir; mezhebi belirtilmeden bir Bengal Müslüman ailesinde doğduğu belirtilir."
  id: "Artikel Wikipedia bahasa Inggris tentang Abu al-Qasim Fazl-ul-Haq (1873–1962), Menteri Utama pertama Bengal (1937–1943) dan pendahulu Keputusan Lahore, menyebutkan kelahirannya pada 26 Oktober 1873 di Satoria, kematiannya pada 27 April 1962 di Dhaka, dan pemakamannya di makam Tiga Pemimpin, menggambarkan dirinya lahir dalam keluarga Muslim Bengali tanpa menyebutkan sektenya."
