  ar: "مقالة ويكيبيديا الإنجليزية عن أبو القاسم فضل الحق (1873–1962)، رئيس وزراء البنغال الأول (1937–1943) ومقدّم قرار لاهور؛ تعطي مولده في 26 تشرين الأول 1873 في ساتوريا ووفاته في 27 نيسان 1962 في دكا ودفنه في ضريح القادة الثلاثة، وتصفه بأنه وُلد لأسرة مسلمة بنغالية دون أن تسمي مذهبه."
  en: "The English Wikipedia article on A. K. Fazlul Huq (1873–1962), first prime minister of Bengal (1937–1943) and mover of the Lahore Resolution; it gives his birth on 26 October 1873 at Saturia, his death on 27 April 1962 at Dacca and his burial in the Mausoleum of Three Leaders, and says he was born to a Bengali Muslim family without naming any school for him."
