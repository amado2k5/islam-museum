  ar: "مقالة ويكيبيديا الروسية عن شبدان جانتاييف (شبدان باتير)؛ تُستخدم لوقائع الكيان فقط، وهي المقالة الوحيدة عنه بأي لغة. تروي حياته منابًا قرغيزيًا وبطلًا عسكريًا في خدمة روسيا، ومسعاه لتعليم القرغيز، ولا تذكر دينه في أي موضع."
  en: "Russian Wikipedia article on Shabdan Jantayev (Shabdan Baatyr); used for entity facts only, and the only article on him in any language. It recounts his life as a Kyrgyz manap and military leader in Russian service and his promotion of Kyrgyz schooling, and nowhere states his religion."
