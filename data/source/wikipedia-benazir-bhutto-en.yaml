  ar: "مقالة ويكيبيديا الإنجليزية عن بينظير بوتو؛ تُستخدم لوقائع الكيان فقط. توثّق ميلادها في كراتشي سنة 1953 ودراستها في هارفارد وأكسفورد، وسجنها ومنفاها، ورئاستها للحكومة مرتين، وقضايا الفساد ونتائجها، وعودتها سنة 2007 واغتيالها في راولبندي ونسبته المتنازع عليها."
  en: "English Wikipedia article on Benazir Bhutto; used for entity facts only. It records her birth at Karachi in 1953, her Harvard and Oxford education, her imprisonment and exile, her two premierships, the corruption cases and their outcomes, her 2007 return and her assassination at Rawalpindi with its contested attributions."
