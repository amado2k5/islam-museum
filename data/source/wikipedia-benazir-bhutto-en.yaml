reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. A long, heavily referenced article, read in full on 25 October 2026. Covers her birth on 21 June 1953 at Pinto's Nursing Home, Karachi, to Zulfikar Ali Bhutto and Nusrat Ispahani; Radcliffe/Harvard (comparative government, 1973), Oxford PPE and postgraduate study in international law and diplomacy, and her 1977 election as the first Asian woman President of the Oxford Union; her father's execution in April 1979, the Movement for the Restoration of Democracy, her imprisonments (including eighteen months in solitary confinement at Sukkur) and her 1984 departure for London; her return on 10 April 1986 and her December 1987 Karachi marriage to Asif Ali Zardari; her swearing-in as prime minister on 2 December 1988; the dismissal of her first government in August 1990; her second term from 19 October 1993, the privatisation programme, the women's measures, the 1996 recognition of the Taliban and the police killing of her brother Murtaza (unsolved; she suspected a conspiracy reaching President Leghari's circle); her dismissal on 5 November 1996; the corruption proceedings and their outcomes (the April 1999 Ehtesab Bench conviction in absentia — five years, an $8.6 million fine and disqualification — set aside when a retrial was ordered two years later over political bias exerted on the judges; the Swiss proceedings under magistrate Daniel Devaud, the Geneva court's order to surrender $11.9 million and serve 180 days, overturned on the retrial she secured; John Burns's New York Times estimate of $1.5 billion in takings by 1996 against $1.2 million in declared family assets; the 2006 NAB accusations and the Interpol notices, expressly not arrest warrants); the National Reconciliation Ordinance amnesty and her return on 18 October 2007, when two bombs striking her Karachi cavalcade killed 149 and injured 402; and her assassination on 27 December 2007 at Rawalpindi — three shots from two to three metres and a ball-bearing suicide vest, twenty-two others killed, reports differing on whether bullets or shrapnel struck her, no autopsy held. On responsibility the article is careful and is followed carefully here: the authorities and the CIA named Baitullah Mehsud of the Pakistani Taliban as the alleged mastermind (he denied it); al-Qaeda's Mustafa Abu al-Yazid claimed responsibility; PPP figures alleged an intelligence-linked sniper and a cover-up; the UN commission established in 2009 (Muñoz, FitzGerald, Darusman) was not tasked to name a culprit, and Muñoz later gave his view that the Pakistani Taliban likely carried it out, perhaps assisted by rogue elements in the intelligence agencies, the original police investigation having been deliberately botched; the February 2012 official enquiry blamed 27 militant groups; and in February 2011 a Rawalpindi court subpoenaed Musharraf for not acting on known threats and providing insufficient security. On faith the article is internally in tension, which the person record states plainly: it describes the Bhutto family as Sunni Muslims, says her mother was born into a Shia family and converted to Sunnism on marriage, records that Benazir, like her father, professed an adherence to Sufism, and in its legacy section says extremist opponents opposed her 'because she was a Shia Muslim'. No one of these is two independent attestations of a school."
