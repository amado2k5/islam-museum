  en: "HalalTrip's profile of Aida Azlin in its article on young Muslim entrepreneurs: a Singaporean graduate of Nanyang Technological University's School of Art, Design and Media, founder of the AA community, formerly of The Shawl Label, with a letter-writing community of about 160,000."
