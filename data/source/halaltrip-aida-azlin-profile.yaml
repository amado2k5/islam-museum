summary:
  ar: "ملف عايدة عزلين في مقال منصة حلال تريب عن رائدات الأعمال المسلمات الشابات؛ يقدّمها سنغافورية تخرجت في كلية الفن والتصميم والإعلام بجامعة نانيانغ التكنولوجية، ومؤسسة مجتمع «AA»، وصاحبة علامة «ملصق الشال» سابقا، ويقدّر مجتمع رسائلها بنحو 160 ألفا."
  en: "HalalTrip's profile of Aida Azlin in its article on young Muslim entrepreneurs: a Singaporean graduate of Nanyang Technological University's School of Art, Design and Media, founder of the AA community, formerly of The Shawl Label, with a letter-writing community of about 160,000."
  es: "Perfil de Aida Azlin en el artículo de HalalTrip sobre jóvenes emprendedores musulmanes: una graduada singapurense de la Escuela de Arte, Diseño y Medios de Comunicación de la Universidad Tecnológica de Nanyang, fundadora de la comunidad AA, anteriormente de The Shawl Label, con una comunidad de intercambio de cartas de aproximadamente 160.000 personas."
  fr: "Le profil d'Aida Azlin sur HalalTrip, dans son article sur les jeunes entrepreneurs musulmans: diplômée singapourienne de l'École d'art, de design et de médias de l'Université technologique de Nanyang, fondatrice de la communauté AA, anciennement de The Shawl Label, avec une communauté de correspondance d'environ 160 000 membres."
  ur: "HalalTrip کا نوجوان مسلم کاروباریوں پر اپنے مضمون میں Aida Azlin کا پروفائل: نانیانگ ٹیکنالوجی یونیورسٹی کے سکول آف آرٹ، ڈیزائن اور میڈیا کے ایک سنگاپوری گریجویٹ، AA کمیونٹی کے بانی، جو پہلے The Shall Label کے تھے، تقریباً 160,000 کی خط لکھنے والی کمیونٹی کے ساتھ۔"
  tr: "Aida Ajleen'in dosyası, genç Müslüman kadın girişimciler hakkında Halal Trip platformunda yer alan bir makalede; Nanyang Teknoloji Üniversitesi Sanat, Tasarım ve Medya Fakültesi'nden mezun olmuş, 'AA' topluluğunun kurucularından biri olan ve daha önce 'Şal Afiş' markasını taşıyan Singapurlu tarafından sunulmuştur. Mesaj topluluğu yaklaşık 160.000 kişi olarak tahmin edilmektedir."
  id: "Berkas Aida Ajleen ada dalam sebuah artikel di platform Halal Trip tentang pengusaha perempuan Muslim muda; dipresentasikan oleh seorang warga Singapura yang lulus dari College of Art, Design and Media di Nanyang Technological University, merupakan pendiri komunitas 'AA', dan sebelumnya memegang merek 'Shawl Poster'. Komunitas pesannya diperkirakan sekitar 160.000 orang."
title: "5 Young Muslim Entrepreneurs Who Will Inspire You — Aida Azlin profile"
