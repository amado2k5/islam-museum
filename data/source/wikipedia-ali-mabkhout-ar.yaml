  ar: "مقالة ويكيبيديا العربية عن علي مبخوت؛ تُستخدم لوقائع الكيان فقط. تعطي اسمه الكامل علي أحمد مبخوت محسن عمران الهاجري وميلاده في 5 أكتوبر 1990، وتصفه بأنه الهداف التاريخي لمنتخب الإمارات. ولا تذكر ديانته."
  en: "Arabic Wikipedia article on Ali Mabkhout; used for entity facts only. It gives his full name as Ali Ahmed Mabkhout Mohsen Imran al-Hajeri and his birth on 5 October 1990, and describes him as the UAE national team's all-time top scorer. It makes no statement about his religion."
  es: "Artículo de Wikipedia en árabe sobre Ali Mabkhout; utilizado únicamente para obtener información sobre la persona. Indica su nombre completo como Ali Ahmed Mabkhout Mohsen Imran al-Hajeri y su fecha de nacimiento, el 5 de octubre de 1990, y lo describe como el máximo goleador histórico de la selección nacional de los Emiratos Árabes Unidos. No menciona su religión."
  fr: "Article de Wikipédia en arabe sur Ali Mabkhout; utilisé uniquement à des fins d'information sur l'entité. Son nom complet est Ali Ahmed Mabkhout Mohsen Imran al-Hajeri, sa date de naissance est le 5 octobre 1990, et il est présenté comme le meilleur buteur de tous les temps de l'équipe nationale des Émirats arabes unis. Aucune mention n'est faite de sa religion."
