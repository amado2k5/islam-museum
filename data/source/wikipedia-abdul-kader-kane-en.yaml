reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It dates him c. 1726 to 26 April 1806, places his birth at Pafa Warneu in the Saloum, records his study under Moktar Ndumbe Diop at Coki, his inauguration as Almaami in 1776 at approximately fifty years of age after Sulayman Bal's death, the Bunxoy defeat and captivity of 1796, and his death shot by the Almaami of Bundu at the battle of Gouriki. Its death date and manner conflict with the French article and Wikidata, which give assassination on 4 April 1807; the conflict is stated openly in the museum's record. It names no legal school or Sufi order for Kane himself. Checked 1 November 2026."
