summary:
  ar: "مقالة ويكيبيديا العربية عن عبد الوحيد هاشم؛ تُستخدم لوقائع الكيان فقط. بذرة قصيرة تتفق مع المقالة الإنجليزية والإندونيسية في سنواته (1914–1953) ووزارته الأولى للشؤون الدينية وابوّته لهاشم أشعري مؤسس نهضة العلماء وتولّيه قيادة الجمعية بعده."
  en: "Arabic Wikipedia article on Abdul Wahid Hasyim; used for entity facts only. A short stub agreeing with the English and Indonesian articles on his years (1914–1953), his service as the first Minister of Religious Affairs, his parentage as son of Hasyim Asy'ari, the founder of Nahdlatul Ulama, and his later leadership of that organisation."
  es: "Artículo de Wikipedia en árabe sobre Abdul Wahid Hasyim; utilizado únicamente para datos sobre la persona. Un breve extracto que coincide con los artículos en inglés e indonesio sobre su vida (1914-1953), su cargo como primer Ministro de Asuntos Religiosos, su parentesco con Hasyim Asy'ari, fundador de Nahdlatul Ulama, y su posterior liderazgo de dicha organización."
  fr: "Article de Wikipédia en arabe sur Abdul Wahid Hasyim; utilisé uniquement pour les informations sur l’entité. Ce court extrait concorde avec les articles en anglais et en indonésien concernant ses années de naissance (1914-1953), son rôle de premier ministre des Affaires religieuses, sa filiation avec Hasyim Asy’ari, fondateur de Nahdlatul Ulama, et son rôle ultérieur à la tête de cette organisation."
  ur: "عبدالواحد حسیم پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ ان کے سالوں (1914-1953) پر انگریزی اور انڈونیشی مضامین سے اتفاق کرنے والا ایک مختصر اسٹب، مذہبی امور کے پہلے وزیر کے طور پر ان کی خدمات، نہدل العلماء کے بانی حسیم اسیاری کے بیٹے کے طور پر ان کی ولدیت، اور اس تنظیم کی بعد میں ان کی قیادت۔"
  tr: "Abdul Wahid Hashim hakkında Arapça Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1914–1953 yılları, ilk dini işler bakanlığı ve Nahdlat al-Ulama'nın kurucusu Haşim Ash'ari'nin babalığı ile derneğin sonraki liderliği dönemindeki İngilizce ve Endonezya makaleleriyle örtüşen kısa bir taslak."
  id: "Artikel Wikipedia bahasa Arab tentang Abdul Wahid Hashim; digunakan hanya untuk fakta entitas. Sebuah artikel singkat yang selaras dengan artikel berbahasa Inggris dan Indonesia selama masa kepemimpinannya (1914–1953), kementerian urusan agama pertamanya, dan keturunannya dari Hashim Ash'ari, pendiri Nahdlat al-Ulama, serta kepemimpinannya selanjutnya atas asosiasi tersebut."
