summary:
  ar: "مقالة ويكيبيديا الروسية عن ماجيت غفوري؛ تُستخدم لوقائع الكيان فقط. تعطي مولده مزدوج التأريخ 8/20 يوليو 1880 في زيليم كارانوفو في أسرة خليفة ⁦(معلّم)⁩ كان خامس أبنائها، وسلسلة نسب أسرته وفيها أسلاف من الملّالي، ودراسته منذ 1893 في أوتياشيفو ثم طرويسك وقازان وأوفا، ووفاته في 28 أكتوبر 1934 ودفنه بأوفا في حديقة ماتروسوف. تصف أستاذه في أوتياشيفو بأنه «مصلح مسلم» ولا تسمي لغفوري نفسه دينا ولا مذهبا."
  en: "Russian Wikipedia article on Majit Gafuri; used for entity facts only. It dual-dates his birth 8/20 July 1880 at Zilim-Karanovo, fifth child in the family of a khalfa (teacher), gives a family genealogy that includes mullah ancestors, his study from 1893 at Utyashevo and then at Troitsk, Kazan and Ufa, and his death on 28 October 1934 and burial at Ufa in the Matrosov park. It calls his Utyashevo teacher a 'Muslim enlightener' but names no religion or school for Gafuri himself."
  es: "Artículo de la Wikipedia rusa sobre Majit Gafuri; utilizado únicamente para datos sobre la persona. Indica su nacimiento el 20 de julio de 1880 en Zilim-Karanovo, siendo el quinto hijo de un maestro (khalfa). Presenta una genealogía familiar que incluye ancestros mulás, sus estudios desde 1893 en Utyashevo y posteriormente en Troitsk, Kazán y Ufa, y su fallecimiento el 28 de octubre de 1934, siendo enterrado en Ufa, en el parque Matrosov. Describe a su maestro de Utyashevo como un \"ilustrador musulmán\", pero no menciona la religión ni la escuela a la que perteneció Gafuri."
  fr: "L'article de Wikipédia en russe consacré à Majit Gafuri, utilisé uniquement pour les informations le concernant, mentionne sa naissance le 8/20 juillet 1880 à Zilim-Karanovo, cinquième enfant d'une famille de calife (maître), une généalogie familiale incluant des ancêtres mollahs, ses études à partir de 1893 à Utyashevo puis à Troitsk, Kazan et Oufa, ainsi que son décès le 28 octobre 1934 et son inhumation à Oufa, dans le parc Matrosov. L'article qualifie son maître d'Utyashevo de « prédicateur musulman », mais ne précise ni la religion ni l'école de Gafuri lui-même."
  ur: "مجیت غفوری پر روسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کی پیدائش 8/20 جولائی 1880 کو زلم کارانوو میں دوہری ہے، جو ایک خلیفہ ⁦(استاد)⁩ کے خاندان کا پانچواں بچہ ہے، ایک خاندانی شجرہ نسب دیتا ہے جس میں ملا کے آباؤ اجداد شامل ہیں، اس کا مطالعہ 1893 سے Utyashevo میں اور پھر Troitsk، Kazan اور Ufa میں، اور 19 اکتوبر کو Matrosov میں اس کی موت اور 1943 کو Matrosov میں ہوئی۔ پارک یہ اپنے اُتیاشیوو استاد کو 'مسلم روشن خیال' کہتا ہے لیکن خود غفوری کے لیے کسی مذہب یا اسکول کا نام نہیں لیتا۔"
