summary:
  ar: "مقالة ويكيبيديا الروسية عن ماجيت غفوري؛ تُستخدم لوقائع الكيان فقط. تعطي مولده مزدوج التأريخ 8/20 يوليو 1880 في زيليم كارانوفو في أسرة خليفة (معلّم) كان خامس أبنائها، وسلسلة نسب أسرته وفيها أسلاف من الملّالي، ودراسته منذ 1893 في أوتياشيفو ثم طرويسك وقازان وأوفا، ووفاته في 28 أكتوبر 1934 ودفنه بأوفا في حديقة ماتروسوف. تصف أستاذه في أوتياشيفو بأنه «مصلح مسلم» ولا تسمي لغفوري نفسه دينا ولا مذهبا."
  en: "Russian Wikipedia article on Majit Gafuri; used for entity facts only. It dual-dates his birth 8/20 July 1880 at Zilim-Karanovo, fifth child in the family of a khalfa (teacher), gives a family genealogy that includes mullah ancestors, his study from 1893 at Utyashevo and then at Troitsk, Kazan and Ufa, and his death on 28 October 1934 and burial at Ufa in the Matrosov park. It calls his Utyashevo teacher a 'Muslim enlightener' but names no religion or school for Gafuri himself."
