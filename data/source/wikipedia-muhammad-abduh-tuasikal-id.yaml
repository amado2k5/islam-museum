summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن محمد عبده تواسيكال، مراجعة 17 سبتمبر 2026؛ تُستخدم لوقائع الكيان فقط. تفصّل مولده في أمبون وتعليمه الهندسي في جامعة غاجاه مادا وجامعة الملك سعود ودكتوراهه في جامعة يوجياكارتا الحكومية، وإدارته موقع رومايشو وترؤّسه معهد دار الشالحين."
  en: "Indonesian Wikipedia article on Muhammad Abduh Tuasikal, revision of 17 September 2026; used for entity facts only. It details his birth in Ambon, his engineering education at Gadjah Mada University and King Saud University and his doctorate at Yogyakarta State University, his running of the Rumaysho website and his headship of Pondok Pesantren Darush Sholihin."
  es: "Artículo de la Wikipedia en indonesio sobre Muhammad Abduh Tuasikal, revisado el 17 de septiembre de 2026; utilizado únicamente para datos sobre la persona. Detalla su nacimiento en Ambon, su formación en ingeniería en la Universidad Gadjah Mada y la Universidad Rey Saud, su doctorado en la Universidad Estatal de Yogyakarta, su gestión del sitio web Rumaysho y su dirección del Pondok Pesantren Darush Sholihin."
  fr: "Article de Wikipédia indonésien sur Muhammad Abduh Tuasikal, mis à jour le 17 septembre 2026; utilisé uniquement à titre informatif. Il détaille sa naissance à Ambon, ses études d’ingénieur à l’université Gadjah Mada et à l’université du Roi Saoud, son doctorat à l’université d’État de Yogyakarta, la gestion du site web Rumaysho et sa direction du Pondok Pesantren Darush Sholihin."
  ur: "انڈونیشیائی ویکیپیڈیا مضمون محمد عبدہ توسیکل پر، 17 ستمبر 2026 کی نظرثانی؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں امبون میں ان کی پیدائش، گدجاہ مادا یونیورسٹی اور کنگ سعود یونیورسٹی میں ان کی انجینئرنگ کی تعلیم اور یوگیکارتا اسٹیٹ یونیورسٹی میں ڈاکٹریٹ، رومیشو ویب سائٹ چلانے اور پونڈوک پسانترین داروش شولہین کی سربراہی کی تفصیلات بیان کی گئی ہیں۔"
  tr: "Mohammed Abdu Tuasikal hakkında Endonezya Vikipedi makalesi, 17 Eylül 2026 tarihinde incelenmiştir; yalnızca varlık bilgileri için kullanılmıştır. Ambon'da doğmuş, mühendislik eğitimini Gajah Mada Üniversitesi ve King Saud Üniversitesi'nde, doktorasını ise Romaisho sitesi tarafından yönetilen ve Dar Al Shalheen Enstitüsü tarafından yönetilen Yogyakarta Devlet Üniversitesi'nde almıştır."
  id: "Artikel Wikipedia Indonesia tentang Mohammed Abdu Tuasikal, ditinjau 17 September 2026; hanya digunakan untuk fakta entitas. Ia lahir di Ambon, dan pendidikan tekniknya di Universitas Gajah Mada dan Universitas King Saud, serta gelar doktor di Universitas Negeri Yogyakarta, dikelola oleh situs Romaisho, dan dipimpin oleh Institut Dar Al Shalheen."
