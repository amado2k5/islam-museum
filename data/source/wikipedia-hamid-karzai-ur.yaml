summary:
  ar: "مقالة ويكيبيديا الأردية عن حامد كرزاي؛ تُستخدم لوقائع الكيان فقط. تروي مولده في 24 ديسمبر 1957 ونسبه لبوبلزاي، وتعليمه الأولي في كابل وتعليمه العالي في الهند، ومشاركته في الجهاد الأفغاني ونائب وزارة الخارجية (1992–1994)، ورئاسته من 2001 إلى 2014 وانتخاب 2004. لا يحمل صندوق معلوماتها أي قيمة للدين ولا يسمّي نصها ديناً له."
  en: "Urdu Wikipedia article on Hamid Karzai; used for entity facts only. It recounts his birth on 24 December 1957 and his Popalzai descent, his initial schooling in Kabul and higher education in India, his part in the Afghan jihad and his deputy foreign ministry (1992–1994), his presidency from 2001 to 2014 and the 2004 election. Its infobox carries no religion value and its text names no religion for him."
  ur: "حامد کرزئی پر اردو ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے مستعمل۔ اس میں 24 دسمبر 1957ء کو ان کی پیدائش اور پوپلزئی نسبت، کابل میں ان کی ابتدائی تعلیم اور بھارت میں اعلیٰ تعلیم، افغان جہاد میں ان کی شرکت اور نائب وزیر خارجہ کا عہدہ (1992ء–1994ء)، 2001ء سے 2014ء تک ان کی صدارت اور 2004ء کے انتخابات بیان ہوئے ہیں۔ اس کے معلوماتی خانے میں مذہب کی کوئی قدر نہیں اور اس کے متن میں بھی ان کا کوئی مذہب درج نہیں۔"
