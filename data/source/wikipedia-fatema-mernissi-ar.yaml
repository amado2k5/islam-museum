summary:
  ar: "مقالة ويكيبيديا العربية «فاطمة المرنيسي»؛ تُستخدم لوقائع الكيان فقط. يذكر صندوق معلوماتها ديانتها «الإسلام» دون فرقة أو مذهب، وتذكر مقدمتها تأسيسها «القوافل المدنية» وجمعية «نساء، عائلات، أطفال»."
  en: "Arabic Wikipedia article on Fatema Mernissi; used for entity facts only. Its infobox gives her religion as Islam with no branch or school, and its lead records her founding of the Civil Caravans and the 'Women, Families, Children' group."
  es: "Artículo de Wikipedia en árabe sobre Fatema Mernissi; se utiliza únicamente para obtener información sobre la persona. Su ficha informativa indica que su religión era el islam, sin especificar su rama o escuela, y su introducción registra la fundación de las Caravanas Civiles y del grupo «Mujeres, Familias y Niños»."
  fr: "Article Wikipédia en arabe sur Fatema Mernissi; utilisé uniquement pour les informations la concernant. Son infobox indique qu'elle est de religion musulmane, sans mention de branche ou d'école, et son introduction relate la fondation des Caravanes civiles et du groupe « Femmes, Familles, Enfants »."
  ur: "فاطمہ مرنیسی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا معلوماتی باکس اس کا مذہب اسلام کے طور پر دیتا ہے جس کی کوئی شاخ یا اسکول نہیں ہے، اور اس کی قیادت اس کے شہری کارواں اور 'خواتین، خاندان، بچوں' کے گروپ کی بانی کو ریکارڈ کرتی ہے۔"
  tr: "Arapça Wikipedia makalesi \"Fatima Al-Marnisi\"; yalnızca varlığın gerçekleri için kullanılmıştır. Bilgi kutusunda dini \"İslam\" olarak mezhep veya mezhep olmadan belirtilir ve girişinde \"Sivil Kervanlar\" ile \"Kadınlar, Aileler, Çocuklar\" derneğinin kuruluşundan bahsedilir."
  id: "Artikel Wikipedia Arab \"Fatima Al-Marnisi\"; digunakan hanya untuk fakta entitas. Infobox-nya menyebutkan agamanya sebagai \"Islam\" tanpa sekte atau sekte, dan pengantarnya menyebutkan pendirian \"Karavan Sipil\" dan asosiasi \"Perempuan, Keluarga, Anak-anak\"."
