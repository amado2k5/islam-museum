reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. It gives her birth at Fez on 27 September 1940 and death at Rabat on 30 November 2015, but its education narrative (political science at the Sorbonne in 1957, doctorate at Brandeis in 1974) conflicts with the English article's sourced sequence (Mohammed V University from 1959, Sorbonne 1966, Brandeis doctorate 1973, which the Brandeis alumni page cited by the articles supports); the conflict is recorded in the person record and the English sequence is followed. The infobox religion field reproduces Wikidata's generic Islam statement. Read in full on 24 October 2026."
