reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. A stub: 'Muhammad Mustafa Ma al-'Aynayn (1830–31, Walata, present-day Mauritania – 1910, Tiznit, Morocco)', full name Muhammad Mustafa ibn Muhammad Fadil Ma al-'Aynayn al-Shinqiti, 'a Saharan religious and political leader of the Sahara who fought against French-supported and Spanish-supported Moroccan colonisation in North Africa'. Its birth range '1830–31' straddles the two years the other articles divide between, and is recorded with them; the record follows 1831 on the Arabic article's exact Hijri date. It uses the common name form Muhammad Mustafa, against the Arabic article's correction to Sidi al-Mustafa."
