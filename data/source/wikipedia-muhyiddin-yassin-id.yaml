summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن محيي الدين ياسين ⁦(وُلد 1947)⁩؛ تُستخدم لوقائع الكيان فقط. سيرة كاملة تروي نشأته وتعليمه، ورئاسته لحكومة جوهر، ومسيرته الوزارية ونيابته لرئاسة الوزراء، ورئاسته لوزراء ماليزيا واستجابته لجائحة كوفيد-19."
  en: "Indonesian Wikipedia article on Muhyiddin Yassin (born 1947); used for entity facts only. A full biography recounting his upbringing and education, his Johor chief ministership, his ministerial career and deputy premiership, and his premiership and COVID-19 response."
  es: "Artículo de la Wikipedia en indonesio sobre Muhyiddin Yassin (nacido en 1947); utilizado únicamente para datos sobre la persona. Una biografía completa que relata su infancia y educación, su mandato como primer ministro de Johor, su carrera ministerial y viceprimer ministro, y su gestión como primer ministro y su respuesta a la COVID-19."
  fr: "Article de Wikipédia indonésien sur Muhyiddin Yassin (né en 1947); utilisé uniquement à des fins d’information sur l’entité. Biographie complète retraçant son enfance et ses études, son mandat de ministre en chef de Johor, sa carrière ministérielle et son poste de vice-premier ministre, ainsi que son mandat de premier ministre et sa gestion de la pandémie de COVID-19."
  ur: "محی الدین یاسین ⁦(پیدائش 1947)⁩ پر انڈونیشین ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ ایک مکمل سوانح عمری جس میں ان کی پرورش اور تعلیم، ان کی جوہر کی وزارت اعلیٰ، ان کے وزارتی کیریئر اور نائب وزیر اعظم، اور ان کی وزارت عظمیٰ اور COVID-19 کے ردعمل کو بیان کیا گیا ہے۔"
  tr: "Muhyiddin Yassin (d. 1947) hakkında Endonezya Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Yetiştirilme tarzı ve eğitimi, Jowhar hükümetindeki liderliği, bakanlık kariyeri ve başbakan yardımcılığı, Malezya bakanlarının başkanlığı ve COVID-19 pandemisine verdiği yanıt hakkında tam bir biyografi."
  id: "Artikel Wikipedia Indonesia tentang Muhyiddin Yassin (lahir 1947); digunakan hanya untuk fakta entitas. Biografi lengkap yang menceritakan masa kecil dan pendidikannya, kepemimpinannya di pemerintahan Jowhar, karier menteri dan jabatan wakil perdana menteri, masa kepresidenannya sebagai menteri Malaysia, serta responsnya terhadap pandemi COVID-19."
