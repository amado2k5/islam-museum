  ar: "مقالة ويكيبيديا الفرنسية عن يعقوب آرتين؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في أسرة تشراكيان الأرمنية الكاثوليكية ومساره في الإدارة المصرية ووكالته لوزارة المعارف حتى 1906 ورئاسته للمعهد المصري ودفنه في المقبرة الأرمنية الكاثوليكية بالقاهرة القديمة."
  en: "French Wikipedia article on Yacoub Artin; used for entity facts only. It recounts his upbringing in the Armenian Catholic Tcherakian family, his career in the Egyptian administration, his undersecretaryship of public instruction until 1906, his presidency of the Institut Égyptien, and his burial in the Armenian Catholic cemetery in Old Cairo."
