reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and re-fetched by the recorded revision id with content verified identical. It gives him born at Cairo on 15 April 1842 and died in the same city on 21 January 1919, son of Artin Bey Tcherakian; tutor to the Khedive Ismail's children from 1873, secretary-interpreter at the Khedive's private cabinet 1878–1879, then on the land-tax commission and many other commissions; undersecretary of state for public instruction from April 1884, remaining at the ministry until 1906; member of the Institut Égyptien from 1881 and its president 1888 and again 1913–1916. It describes the Tcherakian family as an Armenian Catholic family originating from Sivas, and states that he was buried with other members of the family in the Armenian Catholic cemetery in Old Cairo. It makes no separate statement of a denomination for him personally beyond the family affiliation and the burial."
