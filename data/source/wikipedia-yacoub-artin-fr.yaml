summary:
  ar: "مقالة ويكيبيديا الفرنسية عن يعقوب آرتين؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في أسرة تشراكيان الأرمنية الكاثوليكية ومساره في الإدارة المصرية ووكالته لوزارة المعارف حتى 1906 ورئاسته للمعهد المصري ودفنه في المقبرة الأرمنية الكاثوليكية بالقاهرة القديمة."
  en: "French Wikipedia article on Yacoub Artin; used for entity facts only. It recounts his upbringing in the Armenian Catholic Tcherakian family, his career in the Egyptian administration, his undersecretaryship of public instruction until 1906, his presidency of the Institut Égyptien, and his burial in the Armenian Catholic cemetery in Old Cairo."
  es: "Artículo de la Wikipedia en francés sobre Yacoub Artin; utilizado únicamente para datos biográficos. Relata su infancia en la familia armenia católica Tcherakian, su carrera en la administración egipcia, su cargo como subsecretario de instrucción pública hasta 1906, su presidencia del Instituto Egipcio y su entierro en el cementerio católico armenio del Viejo Cairo."
  fr: "Article de Wikipédia en français sur Yacoub Artin; utilisé uniquement à des fins d’information sur l’entité. Il relate son enfance au sein de la famille arménienne catholique Tcherakien, sa carrière dans l’administration égyptienne, son poste de sous-secrétaire à l’Instruction publique jusqu’en 1906, sa présidence de l’Institut Égyptien et son inhumation au cimetière arménien catholique du Vieux Caire."
  ur: "یعقوب آرٹین پر فرانسیسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں آرمینیائی کیتھولک ٹیچراکیان خاندان میں اس کی پرورش، مصری انتظامیہ میں ان کے کیریئر، 1906 تک ان کی پبلک انسٹرکشن کی انڈر سیکرٹری شپ، انسٹی ٹیوٹ مصر کی صدارت، اور پرانے قاہرہ میں آرمینیائی کیتھولک قبرستان میں ان کی تدفین کا ذکر ہے۔"
  tr: "Yaacoub Artin hakkında Fransızca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Ermeni Katolik Cherakian ailesindeki yetiştirilme sürecini, Mısır yönetimindeki yolunu, 1906'ya kadar Eğitim Bakanı olarak görev süresini, Mısır Enstitüsü başkanlığını ve Eski Kahire'deki Ermeni Katolik mezarlığına defnedilmesini anlatır."
  id: "Artikel Wikipedia Prancis tentang Yaacoub Artin; digunakan hanya untuk fakta entitas tersebut. Artikel ini menceritakan masa kecilnya dalam keluarga Katolik Armenia Cherakian, jalannya dalam administrasi Mesir, masa jabatannya sebagai Menteri Pendidikan hingga 1906, masa jabatannya sebagai Presiden Institut Mesir, dan pemakamannya di pemakaman Katolik Armenia di Kairo Lama."
