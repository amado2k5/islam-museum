  ar: "مقالة ويكيبيديا الفارسية عن محمد رضا بهلوي؛ تُستخدم لوقائع الكيان فقط. تروي حكمه وخروجه من إيران مطلع 1979 وجولته بين مصر والمغرب والباهاما والمكسيك والولايات المتحدة وبنما وعودته إلى مصر ووفاته فيها سنة 1980. لا يحمل صندوقها حقلًا لمذهبه ولا ينصّ نصّها على انتماء ديني شخصي له."
  en: "Persian Wikipedia article on Mohammad Reza Pahlavi; used for entity facts only. It recounts his reign, his departure from Iran in early 1979, his passage through Egypt, Morocco, the Bahamas, Mexico, the United States and Panama, and his return to Egypt, where he died in 1980. Its infobox carries no religion field and its text makes no statement of his personal religious affiliation."
