summary:
  ar: "مقالة ويكيبيديا الفارسية عن محمد رضا بهلوي؛ تُستخدم لوقائع الكيان فقط. تروي حكمه وخروجه من إيران مطلع 1979 وجولته بين مصر والمغرب والباهاما والمكسيك والولايات المتحدة وبنما وعودته إلى مصر ووفاته فيها سنة 1980. لا يحمل صندوقها حقلًا لمذهبه ولا ينصّ نصّها على انتماء ديني شخصي له."
  en: "Persian Wikipedia article on Mohammad Reza Pahlavi; used for entity facts only. It recounts his reign, his departure from Iran in early 1979, his passage through Egypt, Morocco, the Bahamas, Mexico, the United States and Panama, and his return to Egypt, where he died in 1980. Its infobox carries no religion field and its text makes no statement of his personal religious affiliation."
  es: "Artículo de Wikipedia en persa sobre Mohammad Reza Pahlavi; se utiliza únicamente para obtener información sobre la persona. Relata su reinado, su salida de Irán a principios de 1979, su paso por Egipto, Marruecos, las Bahamas, México, Estados Unidos y Panamá, y su regreso a Egipto, donde falleció en 1980. Su ficha informativa no incluye información sobre religión y su texto no menciona su afiliación religiosa personal."
  fr: "Article Wikipédia en persan sur Mohammad Reza Pahlavi; utilisé uniquement à titre informatif. Il relate son règne, son départ d'Iran début 1979, son passage par l'Égypte, le Maroc, les Bahamas, le Mexique, les États-Unis et le Panama, et son retour en Égypte, où il est décédé en 1980. Son infobox ne comporte aucun champ relatif à la religion et son texte ne mentionne aucune appartenance religieuse personnelle."
  ur: "محمد رضا پہلوی پر فارسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کے دور حکومت، 1979 کے اوائل میں ایران سے ان کی روانگی، مصر، مراکش، بہاماس، میکسیکو، ریاستہائے متحدہ اور پاناما سے گزرنے اور مصر واپسی کا ذکر کیا گیا ہے، جہاں وہ 1980 میں انتقال کر گئے۔"
