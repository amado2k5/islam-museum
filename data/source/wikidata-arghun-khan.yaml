summary:
  ar: "عنصر ويكيداتا Q220099: الإيلخان الرابع في الدولة الإيلخانية 1284-1291، أبوه أبغا، وابنه غازان، ووفاته في مارس 1291 كما في البطاقة؛ ولد سنة 1258."
  en: "Wikidata item Q220099 for Arghun: fourth Ilkhan of the Mongol Ilkhanate (1284-1291), father Abaqa (Q223239), son Ghazan (Q334496), died March 1291 as the card records (two day-level claims, 7 and 10 March); birth 1258 fills the card's empty birth field."
  es: "Elemento de Wikidata Q220099 para Arghun: cuarto Ilkhan del Ilkanato mongol (1284-1291), padre Abaqa (Q223239), hijo Ghazan (Q334496), murió en marzo de 1291 como registra la tarjeta (dos afirmaciones a nivel de día, 7 y 10 de marzo); el nacimiento en 1258 llena el campo de nacimiento vacío de la tarjeta."
  fr: "L'élément Wikidata Q220099 pour Arghun: quatrième Ilkhan de l'Ilkhanat mongol (1284-1291), père d'Abaqa (Q223239), fils de Ghazan (Q334496), décédé en mars 1291 comme l'indique la fiche (deux revendications au niveau du jour, les 7 et 10 mars); la naissance en 1258 remplit le champ de naissance vide de la fiche."
  ur: "وکی ڈیٹا آئٹم Q220099 برائے ارغون: منگول الخانات کا چوتھا ایلخان (1284-1291)، باپ اباقا (Q223239)، بیٹا غزن (Q334496)، کارڈ ریکارڈ کے طور پر مارچ 1291 کو فوت ہوا ⁦(دو دن کے درجے کے دعوے، 7 اور مارچ)⁩؛ پیدائش 1258 کارڈ کی خالی پیدائشی فیلڈ کو بھرتا ہے۔"
  tr: "Wikidata Element Q220099: 1284-1291 yılları arasında İlhanlık devletinde dördüncü İlhan, babası Abgha ve oğlu Ghazan, kartta belirtildiği gibi Mart 1291'de öldü; 1258'de doğdu."
  id: "Elemen Wikidata Q220099: Ilkhan keempat di negara Ilkhanat 1284-1291, ayahnya Abgha dan putranya Ghazan, meninggal pada Maret 1291 seperti yang disebutkan dalam kartu; lahir pada 1258."
