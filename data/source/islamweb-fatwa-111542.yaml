summary:
  ar: "صفحة وردت في ملخص بحثي قُدِّم إلى المتحف واعتمده المؤسس في 21 نوفمبر 2026؛ لم تُفتح الصفحة، وأرقام الصفحات المذكورة هي ما في الملخص ولم يُتحقق منها. ناشرها: IslamWeb. يُستند إليها في: أحكام قراءة القرآن بغير العربية في الصلاة عند المذاهب؛ وجوب تعلم العربية لما تتوقف عليه العبادة."
  en: "A page listed in a research summary supplied to the museum and approved by the founder on 21 November 2026; the page was not opened, and any page numbers are the summary's and unchecked. Publisher: IslamWeb. Used for: the positions on reciting the Qur'an in a non-Arabic language in prayer; the obligation to learn Arabic for worship."
  ur: "ایک صفحہ جو عجائب گھر کو دیے گئے تحقیقی خلاصے میں مذکور ہے اور جسے بانی نے 21 نومبر 2026 کو منظور کیا؛ صفحہ کھولا نہیں گیا، اور صفحات کے نمبر خلاصے کے ہیں اور جانچے نہیں گئے۔ ناشر: IslamWeb۔ اس سے استناد ان امور کے لیے ہے: نماز میں قرآن کو غیر عربی میں پڑھنے کے بارے میں مذاہب کے اقوال؛ عبادت کے لیے عربی سیکھنے کی فرضیت۔"
  fr: "Page citée dans un résumé de recherche remis au musée et approuvé par le fondateur le 21 novembre 2026 ; la page n'a pas été ouverte, et les numéros de page sont ceux du résumé, non vérifiés. Éditeur : IslamWeb. Utilisée pour : les positions sur la récitation du Coran dans une langue autre que l'arabe dans la prière; l'obligation d'apprendre l'arabe pour le culte."
  es: "Página citada en un resumen de investigación entregado al museo y aprobado por el fundador el 21 de noviembre de 2026; la página no se abrió, y los números de página son los del resumen, sin comprobar. Editor: IslamWeb. Usada para: las posiciones sobre recitar el Corán en una lengua distinta del árabe en la oración; la obligación de aprender árabe para el culto."
