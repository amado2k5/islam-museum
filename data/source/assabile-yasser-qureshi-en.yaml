reliability_note: "Read in full on 26 October 2026. Assabile is a long-established Qur'an-recitation platform; this page is the only biographical source found for him (searches of Arabic, English, Urdu, Indonesian and Malay Wikipedia and of Wikidata on 26 October 2026 found no article and no item). It gives his full name as Yasser Abdullah Ibrahim Ahmed Qureshi, born in 1976 in the village of Deir Ganadleh in the Egyptian province of Assiut (Asyut); Qur'an memorisation at the village Qur'anic school under Sheikh Shaker, continued under Sheikh Khalaf Hassan and Sheikh Kamal Omar Ali; a move to Cairo in 1994, a bachelor's diploma in social services, and certifications in the Hafs reading, tajwid and the higher readings; after preaching permission from the Ministry of Awqaf, imam and preacher at the Musa ibn Nusayr Mosque in Al-Shorouk City, Cairo, then at a mosque in the United Arab Emirates; recordings for the Hanin Institution, the Al Majd Qur'an channel, the Al Iman channel in Gaza and the Qur'an channel in Nablus. It names no school, madhhab or creed for him."
