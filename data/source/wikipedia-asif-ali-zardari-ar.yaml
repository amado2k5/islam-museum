summary:
  ar: "مقالة ويكيبيديا العربية عن آصف علي زرداري؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 26 يوليو 1955، وبروزه بعد زواجه من بينظير بوتو سنة 1987، ووزارته للاستثمار، واعتقاله واتهامه بقتل مرتضى بوتو وبالفساد، وإطلاق سراحه سنة 2004 ومنفاه في دبي، ورئاستيه. وليس فيها أي محتوى ديني."
  en: "Arabic Wikipedia article on Asif Ali Zardari; used for entity facts only. It gives his birth on 26 July 1955, his rise after his 1987 marriage to Benazir Bhutto, his investment ministry, his arrest and indictment for the murder of Murtaza Bhutto and for corruption, his release in 2004 and exile in Dubai, and his presidencies. It has no religion content."
  es: "Artículo de Wikipedia en árabe sobre Asif Ali Zardari; se utiliza únicamente para obtener información sobre su persona. Describe su nacimiento el 26 de julio de 1955, su ascenso tras su matrimonio con Benazir Bhutto en 1987, su ministerio de inversiones, su arresto y procesamiento por el asesinato de Murtaza Bhutto y por corrupción, su liberación en 2004 y su exilio en Dubái, así como sus presidencias. No contiene contenido religioso."
  fr: "Article Wikipédia en arabe consacré à Asif Ali Zardari; utilisé uniquement à des fins d'information sur la personne. Il relate sa naissance le 26 juillet 1955, son ascension politique après son mariage avec Benazir Bhutto en 1987, son ministère des Investissements, son arrestation et sa mise en examen pour le meurtre de Murtaza Bhutto et pour corruption, sa libération en 2004 et son exil à Dubaï, ainsi que ses mandats présidentiels. Il ne contient aucune information religieuse."
  ur: "آصف علی زرداری پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 26 جولائی 1955 کو ان کی پیدائش، 1987 میں بے نظیر بھٹو سے شادی کے بعد ان کا عروج، ان کی سرمایہ کاری کی وزارت، مرتضیٰ بھٹو کے قتل اور بدعنوانی کے الزام میں ان کی گرفتاری اور فرد جرم، 2004 میں ان کی رہائی اور دبئی میں جلاوطنی، اور ان کی صدارتوں کا ذکر کرتا ہے۔ اس میں کوئی مذہبی مواد نہیں ہے۔"
  tr: "Asif Ali Zardari hakkında Arapça Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılmıştır. Makalede 26 Temmuz 1955'teki doğumundan, 1987'de Benazir Bhutto ile evlendikten sonra yükselişinden, Yatırım Bakanlığı'ndan, Murtadha Bhutto'nun öldürülmesi ve yolsuzlukla suçlanmasından tutuklanması, 2004'te serbest bırakılması, Dubai'deki sürgünü ve başkanlığı belirtilmektedir. Dini içerik içermemektedir."
  id: "Artikel Wikipedia berbahasa Arab tentang Asif Ali Zardari hanya digunakan untuk fakta entitas tersebut. Artikel tersebut menyebutkan kelahirannya pada 26 Juli 1955, kebangkitannya setelah menikah dengan Benazir Bhutto pada tahun 1987, Kementerian Investasinya, penangkapannya dan tuduhan membunuh Murtadha Bhutto serta korupsi, pembebasannya pada tahun 2004, pengasingannya di Dubai, dan masa kepresidenannya. Artikel tersebut tidak memuat konten keagamaan."
