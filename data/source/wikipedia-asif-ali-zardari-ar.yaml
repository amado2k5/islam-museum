  ar: "مقالة ويكيبيديا العربية عن آصف علي زرداري؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 26 يوليو 1955، وبروزه بعد زواجه من بينظير بوتو سنة 1987، ووزارته للاستثمار، واعتقاله واتهامه بقتل مرتضى بوتو وبالفساد، وإطلاق سراحه سنة 2004 ومنفاه في دبي، ورئاستيه. وليس فيها أي محتوى ديني."
  en: "Arabic Wikipedia article on Asif Ali Zardari; used for entity facts only. It gives his birth on 26 July 1955, his rise after his 1987 marriage to Benazir Bhutto, his investment ministry, his arrest and indictment for the murder of Murtaza Bhutto and for corruption, his release in 2004 and exile in Dubai, and his presidencies. It has no religion content."
