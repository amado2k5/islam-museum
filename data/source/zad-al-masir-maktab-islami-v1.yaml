label:
  ar: "زاد المسير في علم التفسير — ابن الجوزي، الجزء الأول (المكتب الإسلامي، لصاحبه زهير الشاويش)"
  en: "Zad al-Masir fi Ilm al-Tafsir — Ibn al-Jawzi, part 1 (al-Maktab al-Islami, Zuhayr al-Shawish)"
  ur: "زاد المسیر فی علم التفسیر — ابن الجوزی، جزء اول (المکتب الاسلامی، زہیر الشاویش)"
summary:
  ar: "الجزء الأول (من الفاتحة إلى آخر آل عمران) من طبعة المكتب الإسلامي لزاد المسير، وفيه خطبة المؤلف وفصوله في فضل التفسير والتفسير والتأويل ومدة النزول وأول ما نزل وآخره، ثم تفسير الاستعاذة والبسملة والسور، مع حواشٍ تذكر فروق النسخ (ب) و(ج) وتخرّج الأحاديث."
  en: "Part 1 (al-Fatiha to the end of Al Imran) of al-Maktab al-Islami's printing of Zad al-Masir, with the author's preface and his sections on the merit of tafsir, tafsir and ta'wil, the span of revelation and the first and last revealed, then the commentary on the isti'adha, the basmala and the suras, with footnotes giving variants from manuscripts (b) and (j) and referencing the hadith."
  ur: "المکتب الاسلامی کی زاد المسیر کی طباعت کا جزء اول (سورۂ فاتحہ سے آل عمران کے آخر تک)، جس میں مصنف کا خطبہ اور تفسیر کی فضیلت، تفسیر و تاویل، مدتِ نزول، اور سب سے پہلے اور آخر میں نازل ہونے والے حصے پر ان کی فصلیں ہیں، پھر استعاذہ، بسملہ اور سورتوں کی تفسیر، حواشی کے ساتھ جن میں نسخوں (ب) اور (ج) کے فرق اور احادیث کی تخریج ہے۔"
