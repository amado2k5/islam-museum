  fr: "Article encyclopédique collaboratif, consulté intégralement à la date indiquée; il relate sa naissance à Atlantic City, dans le New Jersey, le 24 janvier 1998, son parcours à Xavier, son arrivée en NBA en 2020 après avoir été drafté, ses quatre saisons à La Nouvelle-Orléans et son transfert à Dallas en 2024. L’article ne contient aucune mention de religion; son nom est expliqué comme étant le surnom de son père, signifiant « guerrier puissant » en arabe."
