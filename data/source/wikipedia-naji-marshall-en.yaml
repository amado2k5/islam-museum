  ar: "مقال موسوعي عن ناجي مارشال ⁦(مواليد 1998)⁩، لاعب كرة السلة الأمريكي الذي لعب لزافيير ثم في NBA مع نيو أورلينز ودالاس."
  en: "Community-edited encyclopedia article, retrieved in full at the stated revision; it gives his birth in Atlantic City, New Jersey, on 24 January 1998, his Xavier career, his undrafted entry to the NBA in 2020, four seasons with New Orleans and the 2024 move to Dallas. It carries no religion content; his name is explained as his father's nickname, meaning strong warrior in Arabic."
