  ar: "مقال موسوعي عن ألبرين شينغون ⁦(مواليد 2002)⁩: ميلاده في غيرسون في 25 يوليو 2002، وصعوده عبر بانفيت وبشكتاش، واختياره في درافت NBA سنة 2021، واختياره لأول مرة لمباراة كل النجوم سنة 2025. لا يذكر المقال شيئاً عن دينه."
  en: "Community-edited encyclopedia article, retrieved in full at the stated revision; it gives his birth at Giresun, Turkey, on 25 July 2002, his rise through Banvit and Beşiktaş, his selection 16th overall in the 2021 NBA draft by Houston, and his first NBA All-Star selection in 2025. It contains no religion content."
  es: "Artículo de enciclopedia editado por la comunidad, recuperado íntegramente en la revisión indicada; en él se detalla su nacimiento en Giresun, Turquía, el 25 de julio de 2002, su ascenso a través del Banvit y el Beşiktaş, su selección en el puesto 16 del draft de la NBA de 2021 por Houston y su primera selección al All-Star de la NBA en 2025. No contiene contenido religioso."
  fr: "Article encyclopédique édité par la communauté, consulté intégralement à la version indiquée; il relate sa naissance à Giresun, en Turquie, le 25 juillet 2002, son ascension à travers Banvit et Beşiktaş, sa sélection en 16e position au total lors de la draft NBA 2021 par Houston, et sa première sélection au NBA All-Star Game en 2025. Il ne contient aucun contenu religieux."
