  ar: "طبعة دار الفتح من «اللمع» لأبي نصر السراج الطوسي (ت 378هـ)، بتحقيق محمد أديب الجادر، تبدأ بإسناد الكتاب ومقدمة المؤلف، وتختم بأربعة عشر فهرساً منها فهرس رجال سماع الكتاب وفهرس الألفاظ والمصطلحات."
  en: "The Dar al-Fath edition of al-Luma' by Abu Nasr al-Sarraj al-Tusi (d. 378 AH), edited by Muhammad Adib al-Jadir; it opens with the book's chain of transmission and the author's preface and closes with fourteen indexes, among them indexes of the men in the book's audition record and of terms."
  ur: "ابو نصر سراج طوسی (م 378ھ) کی «اللمع» کا دار الفتح ایڈیشن، تحقیق محمد ادیب الجادر؛ یہ کتاب کی سند اور مصنف کے مقدمے سے شروع ہو کر چودہ فہارس پر ختم ہوتا ہے، جن میں سماعِ کتاب کے رجال اور اصطلاحات کی فہرستیں ہیں۔"
