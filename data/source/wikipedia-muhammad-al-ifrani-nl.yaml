  ar: "مقالة ويكيبيديا الهولندية عن محمد الإفراني؛ تُستخدم لوقائع الكيان فقط. صدرها يعطي مراكش 1670–1747 ومتنها يجعل وفاته 1743 أو 1745، ويذكر دراسته بفاس واحتمال منصبه في بلاط مولاي إسماعيل وعمله إماماً وخطيباً في المدرسة اليوسفية بمراكش وتدريسه الفقه والحديث."
  en: "Dutch Wikipedia article on Mohammed El Ifrani; used for entity facts only. Its lead gives Marrakesh 1670–1747 while its text dates his death to 1743 or 1745; it records his studies at Fes, a possible post at Moulay Ismail's court, his later service as imam and khatib of the Ben Yusuf Madrasa at Marrakesh and his teaching of law and hadith. Its lead's 1747 is the reading the queue row carried."
