label:
  ar: "مدارك التنزيل وحقائق التأويل ⁦(تفسير النسفي)⁩ — طبعة بتحقيق مروان محمد الشعار، بمقدمة غير موقعة ⁦(نسخة بلا صفحة عنوان)⁩"
  en: "Madarik al-Tanzil wa-Haqa'iq al-Ta'wil (Tafsir al-Nasafi) — edition credited to Marwan Muhammad al-Sha'ar, with an unsigned introduction (copy without title page)"
summary:
  ar: "نسخة كاملة في 1377 صفحة تبدأ بمقدمة قصيرة غير موقعة تشكر «شيخنا مروان محمد الشعار الذي حقق هذا التفسير»، ثم مقدمة المؤلف والتفسير، مع حواش في تخريج الأحاديث وتراجم الأعلام."
  en: "A complete copy of 1,377 pages opening with a short unsigned introduction that thanks 'our shaykh Marwan Muhammad al-Sha'ar, who edited this tafsir', then the author's preface and the commentary, with notes referencing hadiths and identifying persons."
  es: "Una copia completa de 1.377 páginas que comienza con una breve introducción sin firmar que agradece a \"nuestro shaykh Marwan Muhammad al-Sha'ar, quien editó este tafsir\", seguida del prefacio del autor y el comentario, con notas que hacen referencia a hadices e identifican a personas."
  fr: "Un exemplaire complet de 1 377 pages s'ouvrant sur une courte introduction non signée qui remercie « notre cheikh Marwan Muhammad al-Sha'ar, qui a édité ce tafsir », puis la préface de l'auteur et le commentaire, avec des notes faisant référence aux hadiths et identifiant les personnes."
  ur: "1,377 صفحات پر مشتمل ایک مکمل نسخہ جس میں ایک مختصر غیر دستخط شدہ تعارف ہے جس کا شکریہ 'ہمارے شیخ مروان محمد الشعر، جنہوں نے اس تفسیر کی تدوین کی'، پھر مصنف کا دیباچہ اور تفسیر، جس میں احادیث کا حوالہ دیتے ہوئے اور افراد کی نشاندہی کی گئی ہے۔"
  tr: "1377 sayfanın tam versiyonu; 'bu tefsiri başaran Şeyh Mervan Muhammed Al'Şar'a teşekkür eden kısa, imzasız bir girişle başlar, ardından yazarın girişi ve tefsiri, hadis doğruluğu üzerine dipnotlar ve önemli şahsiyetlerin biyografileri yer alır."
  id: "Versi lengkap 1377 halaman, dimulai dengan pengantar singkat tanpa tanda tangan yang mengucapkan terima kasih kepada 'Sheikh Marwan Muhammad Al-Sha'ar yang telah mencapai tafsir ini,' diikuti dengan pengantar dan tafsir penulis, beserta catatan kaki tentang otentikasi hadis dan biografi tokoh-tokoh terkemuka."
