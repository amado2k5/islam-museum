  ar: "مقالة ويكيبيديا الإندونيسية عن سونن موريا؛ تعطي اسمه سيد عمر سعيد وأباه سونن كاليجاغا وشيوخه ووفاته 1560 ودفنه في تشولو بدأوي في قدوس عند جبل موريا، وصندوقها يعطي طائفته «سني» مع حقل الفقه فارغًا، ولا تعطي تاريخ ولادة."
  en: "Indonesian Wikipedia article on Sunan Muria; it gives his name as Sayyid Umar Said, his father Sunan Kalijaga and his teachers, his death in 1560 and burial at Colo, Dawe, Kudus on Mount Muria; its Muslim-scholar infobox gives his denomination as Sunni with the jurisprudence field blank, and it gives no birth date."
