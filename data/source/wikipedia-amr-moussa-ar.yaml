  ar: "مقالة ويكيبيديا العربية عن عمرو موسى؛ تُستخدم لوقائع الكيان فقط. تروي ولادته بالقاهرة وانتقاله صغيرًا إلى الريف بالغربية، ومسيرته الدبلوماسية ووزارته للخارجية وأمانته العامة للجامعة، وعمله الحالي من مكتبه في القاهرة. حقل الدين في صندوق معلوماتها فارغ."
  en: "Arabic Wikipedia article on Amr Moussa; used for entity facts only. It recounts his birth in Cairo and his childhood move to the countryside in Gharbia, his diplomatic career, foreign ministership and League secretary-generalship, and his current work from his Cairo office. The religion field of its infobox is empty."
