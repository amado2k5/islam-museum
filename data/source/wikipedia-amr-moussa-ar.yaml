summary:
  ar: "مقالة ويكيبيديا العربية عن عمرو موسى؛ تُستخدم لوقائع الكيان فقط. تروي ولادته بالقاهرة وانتقاله صغيرًا إلى الريف بالغربية، ومسيرته الدبلوماسية ووزارته للخارجية وأمانته العامة للجامعة، وعمله الحالي من مكتبه في القاهرة. حقل الدين في صندوق معلوماتها فارغ."
  en: "Arabic Wikipedia article on Amr Moussa; used for entity facts only. It recounts his birth in Cairo and his childhood move to the countryside in Gharbia, his diplomatic career, foreign ministership and League secretary-generalship, and his current work from his Cairo office. The religion field of its infobox is empty."
  es: "Artículo de Wikipedia en árabe sobre Amr Moussa; se utiliza únicamente para obtener información sobre la persona. Relata su nacimiento en El Cairo y su traslado durante su infancia al campo en Gharbia, su carrera diplomática, su cargo como ministro de Asuntos Exteriores y secretario general de la Liga de las Naciones, y su trabajo actual desde su oficina en El Cairo. El campo de religión de su ficha informativa está vacío."
  fr: "Article Wikipédia en arabe sur Amr Moussa; utilisé uniquement pour les informations sur l'entité. Il relate sa naissance au Caire et son enfance à la campagne, dans le district de Gharbia, sa carrière diplomatique, son poste de ministre des Affaires étrangères et de secrétaire général de la Ligue, ainsi que ses fonctions actuelles au Caire. Le champ « religion » de son infobox est vide."
  ur: "عمرو موسی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں قاہرہ میں ان کی پیدائش اور غربیہ کے دیہی علاقوں میں ان کے بچپن کی منتقلی، ان کے سفارتی کیریئر، وزارت خارجہ اور لیگ کے سیکرٹری جنرل کے عہدے اور قاہرہ کے دفتر سے ان کے موجودہ کام کا ذکر ہے۔ اس کے معلوماتی خانے کا مذہب خالی ہے۔"
