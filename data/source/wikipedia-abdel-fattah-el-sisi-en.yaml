reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read on 27 October 2026 and checked against the recorded revision. It gives el-Sisi as born in El Gamaleya, Cairo, on 19 November 1954, an Egyptian Military Academy graduate of 1977, director of military intelligence, defence minister from August 2012, leader of the 3 July 2013 removal of President Morsi and of the dispersal of the Rabaa and Nahda sit-ins, sworn in as president on 8 June 2014, and re-elected in 2018 and 2023 in elections observers describe as unfree; the article reports that most independent observers view him as a dictator leading an authoritarian government. Its infobox carries no religion field and its text names no school for him; passages on his speeches about Islam concern his public policy, not an affiliation of his own."
