reliability_note: 'Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It has no religion field. Its personal-life section says she married within ''the Sunni Bhora community where she grew up'' — the community of her upbringing, not a school she attested — and that her mother converted to Islam on marriage. Its text records her support of the Iranian Revolution and her 1998 boycott of Salman Rushdie''s South Africa visit as political positions.'
