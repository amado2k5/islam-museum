summary:
  ar: مقالة ويكيبيديا الإنجليزية عن فاطمة مير؛ تُستخدم لوقائع الكيان فقط. تعطي ميلادها في ديربان في 12 أغسطس 1928 ووفاتها فيها في 12 مارس 2010، ودراستها لعلم الاجتماع في جامعة ناتال، ودورها المؤسس في اتحاد نساء جنوب أفريقيا ومعهد بحوث السود، وسيرتها لنيلسون مانديلا.
  en: English Wikipedia article on Fatima Meer; used for entity facts only. It gives her birth in Durban on 12 August 1928 and her death there on 12 March 2010, her sociology degrees at the University of Natal, her founding roles in the Federation of South African Women and the Institute for Black Research, and her biography of Nelson Mandela.
  es: "Artículo de la Wikipedia en inglés sobre Fatima Meer; utilizado únicamente para datos biográficos. En él se indica que nació en Durban el 12 de agosto de 1928 y falleció allí el 12 de marzo de 2010, obtuvo sus títulos de sociología en la Universidad de Natal, desempeñó un papel fundamental en la fundación de la Federación de Mujeres Sudafricanas y el Instituto de Investigación Negra, y escribió una biografía de Nelson Mandela."
  fr: "Article Wikipédia en anglais sur Fatima Meer; utilisé uniquement pour les informations biographiques. On y apprend sa naissance à Durban le 12 août 1928 et son décès dans la même ville le 12 mars 2010, ses diplômes de sociologie à l’Université du Natal, son rôle fondateur au sein de la Fédération des femmes sud-africaines et de l’Institut de recherche sur les Noirs, ainsi que sa biographie de Nelson Mandela."
  ur: "فاطمہ میر پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 12 اگست 1928 کو ڈربن میں اس کی پیدائش اور 12 مارچ 2010 کو وہیں اس کی موت، نٹال یونیورسٹی میں اس کی سوشیالوجی کی ڈگریاں، فیڈریشن آف ساؤتھ افریقن ویمن اور انسٹی ٹیوٹ فار بلیک ریسرچ میں اس کے بانی کردار، اور نیلسن منڈیلا کی سوانح عمری۔"
  tr: "Fatima Mir hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 12 Ağustos 1928'de Durban'da doğum yapar, 12 Mart 2010'da orada vefat eder, Natal Üniversitesi'nde sosyoloji eğitimi, Güney Afrika Kadınlar Birliği ve Siyah Araştırma Enstitüsü'ndeki kurucu rolü ve Nelson Mandela biyografisini paylaşır."
  id: "Artikel Wikipedia bahasa Inggris tentang Fatima Mir; digunakan hanya untuk fakta entitas. Ia melahirkan di Durban pada 12 Agustus 1928, dan meninggal di sana pada 12 Maret 2010, studinya di bidang sosiologi di University of Natal, peran pendirinya di South African Women's Union dan Black Research Institute, serta biografi Nelson Mandela."
