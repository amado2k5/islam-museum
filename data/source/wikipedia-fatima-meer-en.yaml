  ar: مقالة ويكيبيديا الإنجليزية عن فاطمة مير؛ تُستخدم لوقائع الكيان فقط. تعطي ميلادها في ديربان في 12 أغسطس 1928 ووفاتها فيها في 12 مارس 2010، ودراستها لعلم الاجتماع في جامعة ناتال، ودورها المؤسس في اتحاد نساء جنوب أفريقيا ومعهد بحوث السود، وسيرتها لنيلسون مانديلا.
  en: English Wikipedia article on Fatima Meer; used for entity facts only. It gives her birth in Durban on 12 August 1928 and her death there on 12 March 2010, her sociology degrees at the University of Natal, her founding roles in the Federation of South African Women and the Institute for Black Research, and her biography of Nelson Mandela.
