  fr: "Article de Wikipédia en anglais sur Surin Pitsuwan (1949-2017); utilisé uniquement pour les informations sur l’entité. Il indique sa naissance le 28 octobre 1949 à Nakhon Si Thammarat et son décès le 30 novembre 2017 à Bangkok, son poste de ministre des Affaires étrangères (1997-2001) et son mandat de douzième secrétaire général de l’ASEAN (2008-2012)."
