  ar: "مقالة ويكيبيديا الإنجليزية عن سورين بيتسوان (1949–2017)؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 28 أكتوبر 1949 في ناخون سي تامارات ووفاته في 30 نوفمبر 2017 في بانكوك، ووزارته للخارجية (1997–2001) وأمانته العامة لرابطة دول جنوب شرق آسيا ⁦(آسيان)⁩ (2008–2012)."
  en: "English Wikipedia article on Surin Pitsuwan (1949–2017); used for entity facts only. It gives his birth on 28 October 1949 at Nakhon Si Thammarat and his death on 30 November 2017 at Bangkok, his foreign ministership (1997–2001), and his tenure as the twelfth secretary-general of ASEAN (2008–2012)."
