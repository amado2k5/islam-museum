reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision. It gives his birth at Luddan on 20 February 1916 and his death at Lahore on 30 January 1995 (the death date in its infobox template), his parentage (his father Ahmad Yar Khan Daultana, in both the infobox parents field and the early-life text), his education at Government College, Lahore and Corpus Christi College, Oxford, his call to the Bar at Middle Temple in 1939, his joining of the Punjab Muslim League in 1942 and election to the Punjab Legislative Assembly in 1946, his chief ministership of West Punjab from 15 April 1951 to 3 April 1953, his support for the anti-Ahmadi demands of 1951, the martial law imposed at Lahore in 1953 and his resignation, his defence ministry in the Chundrigar government of October to December 1957, and his high commissionership in London from 1972 to 1979. The article names no school for him: its religion-bearing sentences are political — his view that the Muslims of the Punjab should unite with their co-religionists in the demand for Pakistan, cited to Korson (1974, p. 19) — and office-holding. It also calls Chaudhry Sir Shahab-ud-Din his uncle, citing a Friday Times profile of Shahabuddin (2011)."
