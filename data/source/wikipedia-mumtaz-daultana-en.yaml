summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ممتاز دولتانة؛ تُستخدم لوقائع الكيان فقط. تروي أنه سياسي باكستاني وُلد في لُدّن في 20 شباط 1916 ابنًا لأحمد يار خان دولتانة، وكان ثاني رؤساء وزراء بنجاب الغربية (1951–1953) فاستقال بعد أعمال شغب لاهور 1953، ثم وزيرًا للدفاع (1957)، ثم سفيرًا لدى المملكة المتحدة (1972–1979)، وتوفي في لاهور في 30 كانون الثاني 1995."
  en: "English Wikipedia article on Mumtaz Daultana; used for entity facts only. It records a Pakistani politician born at Luddan on 20 February 1916, the son of Ahmad Yar Khan Daultana, who was the second chief minister of West Punjab (1951–1953) and resigned after the 1953 Lahore riots, then minister of defence (1957) and high commissioner to the United Kingdom (1972–1979), and died at Lahore on 30 January 1995."
