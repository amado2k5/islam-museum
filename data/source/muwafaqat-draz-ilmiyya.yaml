summary:
  ar: "«الموافقات في أصول الشريعة» لأبي إسحاق إبراهيم بن موسى اللخمي الغرناطي المالكي الشاطبي (ت 790هـ)، شرحه وخرّج أحاديثه الشيخ عبد الله دراز، ووضع تراجمه الأستاذ محمد عبد الله دراز، وخرّج آياته وفهرس موضوعاته عبد السلام عبد الشافي محمد؛ منشورات محمد علي بيضون، دار الكتب العلمية، بيروت، «طبعة جديدة كاملة في مجلد واحد»، مع مقدمة الناشر وترجمة الشاطبي منقولة عن الأعلام للزركلي ومقدمة دراز في التعريف بالكتاب."
  en: "al-Muwafaqat fi Usul al-Shari'a by Abu Ishaq Ibrahim ibn Musa al-Lakhmi al-Gharnati al-Maliki al-Shatibi (d. 790 AH), with commentary and hadith references by Shaykh Abd Allah Draz, biographical notes by Muhammad Abd Allah Draz, and Qur'an references and subject index by Abd al-Salam Abd al-Shafi Muhammad; Muhammad Ali Baydun / Dar al-Kutub al-Ilmiyya, Beirut, 'a new complete edition in one volume', with the publisher's preface, a life of al-Shatibi taken from al-Zirikli's al-A'lam, and Draz's introduction to the book."
  ur: "ابو اسحاق ابراہیم بن موسیٰ لخمی غرناطی مالکی شاطبی (م 790ھ) کی «الموافقات فی اصول الشریعہ»، شرح و تخریجِ احادیث شیخ عبد اللہ دراز، تراجم استاد محمد عبد اللہ دراز، تخریجِ آیات و فہرست عبد السلام عبد الشافی محمد؛ منشورات محمد علی بیضون، دار الکتب العلمیہ، بیروت، «ایک جلد میں مکمل نیا ایڈیشن»، ناشر کے مقدمے، زرکلی کی الاعلام سے ماخوذ شاطبی کے ترجمے اور کتاب کے تعارف پر دراز کے مقدمے کے ساتھ۔"
title: "الموافقات في أصول الشريعة"
