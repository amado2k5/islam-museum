  en: "al-Shatibi, al-Muwafaqat fi Usul al-Shari'a (commentary by Abd Allah Draz, Dar al-Kutub al-Ilmiyya, one volume)"
  ur: "شاطبی، الموافقات فی اصول الشریعہ ⁦(شرح عبد اللہ دراز، دار الکتب العلمیہ، ایک جلد)⁩"
summary:
  ar: "«الموافقات في أصول الشريعة» لأبي إسحاق إبراهيم بن موسى اللخمي الغرناطي المالكي الشاطبي ⁦(ت 790هـ)⁩، شرحه وخرّج أحاديثه الشيخ عبد الله دراز، ووضع تراجمه الأستاذ محمد عبد الله دراز، وخرّج آياته وفهرس موضوعاته عبد السلام عبد الشافي محمد؛ منشورات محمد علي بيضون، دار الكتب العلمية، بيروت، «طبعة جديدة كاملة في مجلد واحد»، مع مقدمة الناشر وترجمة الشاطبي منقولة عن الأعلام للزركلي ومقدمة دراز في التعريف بالكتاب."
  en: "al-Muwafaqat fi Usul al-Shari'a by Abu Ishaq Ibrahim ibn Musa al-Lakhmi al-Gharnati al-Maliki al-Shatibi (d. 790 AH), with commentary and hadith references by Shaykh Abd Allah Draz, biographical notes by Muhammad Abd Allah Draz, and Qur'an references and subject index by Abd al-Salam Abd al-Shafi Muhammad; Muhammad Ali Baydun / Dar al-Kutub al-Ilmiyya, Beirut, 'a new complete edition in one volume', with the publisher's preface, a life of al-Shatibi taken from al-Zirikli's al-A'lam, and Draz's introduction to the book."
  ur: "ابو اسحاق ابراہیم بن موسیٰ لخمی غرناطی مالکی شاطبی ⁦(م 790ھ)⁩ کی «الموافقات فی اصول الشریعہ»، شرح و تخریجِ احادیث شیخ عبد اللہ دراز، تراجم استاد محمد عبد اللہ دراز، تخریجِ آیات و فہرست عبد السلام عبد الشافی محمد؛ منشورات محمد علی بیضون، دار الکتب العلمیہ، بیروت، «ایک جلد میں مکمل نیا ایڈیشن»، ناشر کے مقدمے، زرکلی کی الاعلام سے ماخوذ شاطبی کے ترجمے اور کتاب کے تعارف پر دراز کے مقدمے کے ساتھ۔"
  es: "al-Muwafaqat fi Usul al-Shari'a de Abu Ishaq Ibrahim ibn Musa al-Lakhmi al-Gharnati al-Maliki al-Shatibi (m. 790 d. H.), con comentarios y referencias de hadices de Shaykh Abd Allah Draz, notas biográficas de Muhammad Abd Allah Draz y referencias del Corán e índice de temas de Abd al-Salam Abd al-Shafi Muhammad; Muhammad Ali Baydun / Dar al-Kutub al-Ilmiyya, Beirut, 'una nueva edición completa en un solo volumen', con el prefacio del editor, una vida de al-Shatibi extraída de al-A'lam de al-Zirikli y la introducción de Draz al libro."
  fr: "al-Muwafaqat fi Usul al-Shari'a par Abu Ishaq Ibrahim ibn Musa al-Lakhmi al-Gharnati al-Maliki al-Shatibi (mort en 790 AH), avec commentaires et références aux hadiths de Shaykh Abd Allah Draz, notes biographiques de Muhammad Abd Allah Draz, et références du Coran et index des sujets par Abd al-Salam Abd al-Shafi Muhammad; Muhammad Ali Baydun / Dar al-Kutub al-Ilmiyya, Beyrouth, « une nouvelle édition complète en un seul volume », avec la préface de l'éditeur, une vie d'al-Shatibi tirée de al-A'lam d'al-Zirikli et l'introduction du livre de Draz."
  tr: "\"El-Muvefaquk fi Usul al-Şeriat\" Ebu İshaq İbrahim bin Musa el-Lakhmi el-Lakhmi el-Maliki el-Şatibi (ö. 790 Ah) tarafından, Şeyh Abdullah Daraz tarafından açıklanan ve hadisler hazırlanmış, biyografileri Profesör Muhammed Abdullah Daraz tarafından hazırlanmış, ayetleri ve konu dizini Abdülselam Abdül-Şafi Muhammed tarafından yayımlanmıştır; Muhammad Ali Baydoun, Dar al-Kutub al-Ilmiyya, Beyrut tarafından yayımlanmıştır; \"Tek ciltte tamamen yeni bir baskı,\" yayınevinin girişi ve el-Şatibi'nin biyografisi al-Zarkali'nin el-A'lam'ından alıntılanmış, giriş ise Daraz'ın kitabı tanıtmıştır."
  id: "\"Al-Muwafaqat fi Usul al-Shari'ah\" oleh Abu Ishaq Ibrahim ibn Musa al-Lakhmi al-Gharnati al-Maliki al-Shatibi (wafat 790 H), dijelaskan dan hadits-hadits yang disusun oleh Sheikh Abdullah Daraz, dengan biografi yang disiapkan oleh Profesor Muhammad Abdullah Daraz, serta ayat-ayat dan indeks topiknya diterbitkan oleh Abd al-Salam Abd al-Shafi Muhammad; diterbitkan oleh Muhammad Ali Baydoun, Dar al-Kutub al-Ilmiyya, Beirut, \"edisi baru lengkap dalam satu jilid,\" dengan pengantar penerbit dan biografi al-Shatibi yang dikutip dari al-A'lam oleh al-Zarkali, serta pengantar oleh Daraz sebagai pengantar buku."
