summary:
  ar: "مدخل «كعبة» في موسوعة TDV الإسلامية بثلاثة أقسام: وصف البناء وتاريخه وخدماته — الحجابة والسقاية والرفادة والعمارة والبخور والغسل — وفقه زيارتها وصلاة الحرم، ومقامها في الأدب التركي."
  en: "The TDV İslâm Ansiklopedisi entry on the Ka'ba in three sections: the building, its history and its services — custodianship, water-supply, feeding, covering, perfuming and washing — the fiqh of visiting it, and its place in Turkish literature."
  es: "La entrada de TDV İslâm Ansiklopedisi sobre la Kaaba se divide en tres secciones: el edificio, su historia y sus servicios (custodia, suministro de agua, alimentación, cobertura, perfumado y lavado), el fiqh (jurisprudencia islámica) sobre su visita y su lugar en la literatura turca."
  fr: "L'article de TDV İslâm Ansiklopedisi sur la Ka'ba est divisé en trois sections: le bâtiment, son histoire et ses services — la garde, l'approvisionnement en eau, la nourriture, la couverture, la parfumerie et le lavage — le fiqh de sa visite et sa place dans la littérature turque."
  ur: "کعبہ پر TDV İslâm Ansiklopedisi کا اندراج تین حصوں میں ہے: عمارت، اس کی تاریخ اور اس کی خدمات — نگہبانی، پانی کی فراہمی، کھانا کھلانا، ڈھانپنا، خوشبو لگانا اور دھونا — اس کی زیارت کا فقہ، اور ترکی ادب میں اس کا مقام۔"
  tr: "TDV İslami Ansiklopedisi'nde \"Kabe\"ye giriş üç bölüme ayrılmıştır: yapının tanımı, tarihi ve hizmetleri — başörtüsü, sulama, numune alma, mimari, tütsü ve yıkama — kutsal alandaki ziyaret ve namaz fıkıhı ile Türk edebiyatındaki statüsü."
  id: "Pintu masuk ke \"Ka'bah\" dalam Ensiklopedia Islam TDV dibagi menjadi tiga bagian: deskripsi struktur, sejarahnya, dan pelayanannya — hijab, penyiraman, pengambilan sampel, arsitektur, dupa, dan pencucian — yurisprudensi kunjungan dan doa di tempat suci, serta statusnya dalam sastra Turki."
