  ar: "مقالة ويكيبيديا الإنجليزية عن يوسف علي كيناديد (1837 – 14 أغسطس 1911)، السلطان الصومالي مؤسس سلطنة هوبيو (حكم من أبريل 1878 إلى 28 سبتمبر 1911) الذي خلفه ابنه علي يوسف كيناديد؛ يذكر صندوق معلوماتها أن دينه الإسلام، وتروي نشأته في أسرة ماجرتين دارود، وتأسيسه السلطنة سنة 1878، ومعاهدة الحماية الإيطالية سنة 1889، ونفيه إلى عدن ثم إريتريا."
  en: "English Wikipedia article on Yusuf Ali Kenadid (1837 – 14 August 1911), the Somali sultan who founded the Sultanate of Hobyo (reigned April 1878 – 28 September 1911) and was succeeded by his son Ali Yusuf Kenadid; its infobox gives his religion as Islam, and its text recounts his Majeerteen Darod family, his founding of the sultanate in 1878, the Italian protectorate treaty of 1889, and his exile to Aden and then Eritrea."
