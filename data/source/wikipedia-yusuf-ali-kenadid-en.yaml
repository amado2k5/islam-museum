summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن يوسف علي كيناديد ⁦(1837 – 14 أغسطس 1911)⁩، السلطان الصومالي مؤسس سلطنة هوبيو ⁦(حكم من أبريل 1878 إلى 28 سبتمبر 1911)⁩ الذي خلفه ابنه علي يوسف كيناديد؛ يذكر صندوق معلوماتها أن دينه الإسلام، وتروي نشأته في أسرة ماجرتين دارود، وتأسيسه السلطنة سنة 1878، ومعاهدة الحماية الإيطالية سنة 1889، ونفيه إلى عدن ثم إريتريا."
  en: "English Wikipedia article on Yusuf Ali Kenadid (1837 – 14 August 1911), the Somali sultan who founded the Sultanate of Hobyo (reigned April 1878 – 28 September 1911) and was succeeded by his son Ali Yusuf Kenadid; its infobox gives his religion as Islam, and its text recounts his Majeerteen Darod family, his founding of the sultanate in 1878, the Italian protectorate treaty of 1889, and his exile to Aden and then Eritrea."
  es: "Artículo de Wikipedia en inglés sobre Yusuf Ali Kenadid (1837 - 14 de agosto de 1911), el Sultanato de Hobyo (abril de 1878 - 28 de septiembre de 1911). Su cuadro de información indica que su religión es el Islam, y su texto relata su familia Majeerteen Darod, su fundación del Sultanato en 1878, el Tratado del Protectorado italiano de 1889 y su exilio a Adén y luego a Eritrea."
  fr: "Article Wikipédia en anglais sur Yusuf Ali Kenadid (1837 – 14 août 1911), sultanat de Hobyo (avril 1878 – 28 septembre 1911). Sa boîte d'information donne sa religion comme l'Islam, et son texte raconte sa famille Majeerteen Darod, sa fondation du sultanat en 1878, le traité de protectorat italien de 1889 et son exil à Aden puis en Érythrée."
  ur: "یوسف علی کناڈیڈ ⁦(1837 - 14 اگست 1911)⁩ پر انگریزی ویکیپیڈیا کا مضمون، سلطنت ہوبیو ⁦(اپریل 1878 - 28 ستمبر 1911)⁩۔ اس کا معلوماتی خانہ اس کا مذہب اسلام دیتا ہے، اور اس کا متن اس کے مجیرتین درود خاندان، 1878 میں اس کی سلطنت کی بنیاد، 1889 کا اطالوی تحفظاتی معاہدہ، اور اس کی عدن اور پھر اریٹیریا کی جلاوطنی کا ذکر کرتا ہے۔"
  tr: "Yusuf Ali Kinnadid (1837 – 14 Ağustos 1911), Somali Sultanı ve Hobio Sultanlığı'nın kurucusu (Nisan 1878'den 28 Eylül 1911'e kadar hüküm sürdü) hakkında İngilizce Vikipedi makalesi, yerine oğlu Ali Yusuf Kinnadid geçti; bilgi kutusunda dininin İslam olduğu belirtilir ve Magertaine Darud ailesinde yetiştirilmesi, 1878'de sultanlığı kurması, 1889'daki İtalyan himaye antlaşması ve Aden'e ve ardından Eritre'ye sürgününü anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Yusuf Ali Kinnadid (1837 – 14 Agustus 1911), Sultan Somalia dan pendiri Kesultanan Hobio (memerintah dari April 1878 hingga 28 September 1911), digantikan oleh putranya Ali Yusuf Kinnadid; kotak informasinya menyebutkan bahwa agamanya adalah Islam, dan menceritakan masa kecilnya dalam keluarga Magertaine Darud, pendirian kesultanan pada tahun 1878, perjanjian protektorat Italia pada tahun 1889, dan pengasingannya ke Aden dan kemudian Eritrea."
