summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سلطان مجيد أفندييف؛ تُستخدم لوقائع الكيان فقط. تروي ميلاده في شماخى في 26 مايو 1887 ابن تاجر وحفيد مفتي ما وراء القوقاز، وتنظيمه حزب «همّت» لجلب العمال المسلمين إلى الحركة الاشتراكية الديمقراطية، وتأهله طبيبًا سنة 1915، ومناصبه السوفيتية، واعتقاله سنة 1937 وإعدامه في باكو في 21 أبريل 1938 وردّ اعتباره سنة 1956. لا تذكر شيئًا عن دينه الشخصي أو إلحاده."
  en: "English Wikipedia article on Sultan Majid Afandiyev; used for entity facts only. It recounts his birth at Shamakhi on 26 May 1887 as a merchant's son and grandson of the Transcaucasian mufti, his organising of the Hummet party to bring Muslim workers into the social-democratic movement, his qualification as a physician in 1915, his Soviet offices, his 1937 arrest, his execution at Baku on 21 April 1938 and his rehabilitation in 1956. It makes no statement about his personal religion or unbelief."
