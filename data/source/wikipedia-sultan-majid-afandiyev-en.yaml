summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سلطان مجيد أفندييف؛ تُستخدم لوقائع الكيان فقط. تروي ميلاده في شماخى في 26 مايو 1887 ابن تاجر وحفيد مفتي ما وراء القوقاز، وتنظيمه حزب «همّت» لجلب العمال المسلمين إلى الحركة الاشتراكية الديمقراطية، وتأهله طبيبًا سنة 1915، ومناصبه السوفيتية، واعتقاله سنة 1937 وإعدامه في باكو في 21 أبريل 1938 وردّ اعتباره سنة 1956. لا تذكر شيئًا عن دينه الشخصي أو إلحاده."
  en: "English Wikipedia article on Sultan Majid Afandiyev; used for entity facts only. It recounts his birth at Shamakhi on 26 May 1887 as a merchant's son and grandson of the Transcaucasian mufti, his organising of the Hummet party to bring Muslim workers into the social-democratic movement, his qualification as a physician in 1915, his Soviet offices, his 1937 arrest, his execution at Baku on 21 April 1938 and his rehabilitation in 1956. It makes no statement about his personal religion or unbelief."
  es: "Artículo de la Wikipedia en inglés sobre el sultán Majid Afandiyev; utilizado únicamente para datos sobre la persona. Relata su nacimiento en Shamakhi el 26 de mayo de 1887 como hijo de un comerciante y nieto del muftí transcaucásico, su organización del partido Hummet para incorporar a los trabajadores musulmanes al movimiento socialdemócrata, su obtención del título de médico en 1915, sus cargos en la Unión Soviética, su arresto en 1937, su ejecución en Bakú el 21 de abril de 1938 y su rehabilitación en 1956. No menciona su religión personal ni su falta de fe."
  fr: "Article de Wikipédia en anglais sur le sultan Majid Afandiyev; utilisé uniquement pour les informations factuelles. Il relate sa naissance à Shamakhi le 26 mai 1887, fils de marchand et petit-fils du mufti transcaucasien, son rôle dans la création du parti Hummet pour intégrer les travailleurs musulmans au mouvement social-démocrate, son diplôme de médecin obtenu en 1915, ses fonctions au sein du Soviet, son arrestation en 1937, son exécution à Bakou le 21 avril 1938 et sa réhabilitation en 1956. Il ne fait aucune mention de sa religion ou de son acrophilie."
  ur: "سلطان ماجد آفندیف پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں شماکھی میں 26 مئی 1887 کو ایک تاجر کے بیٹے اور ٹرانسکاکیشین مفتی کے پوتے کے طور پر، مسلم کارکنوں کو سماجی جمہوری تحریک میں شامل کرنے کے لیے ہمٹ پارٹی کی تنظیم، 1915 میں بطور معالج ان کی اہلیت، سوویت یونین کے دفاتر، 13 اپریل کو ان کی گرفتاری، 13 اپریل کو ان کی گرفتاری کا ذکر ہے۔ 1938 اور 1956 میں اس کی بحالی۔ اس میں ان کے ذاتی مذہب یا کفر کے بارے میں کوئی بیان نہیں ہے۔"
  tr: "Sultan Mejid Avendiyev hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 26 Mayıs 1887'de Shamakhi'de, bir tüccarın oğlu ve Transkafkasya Büyük Müftüsünün torunu olarak anılır; Müslüman işçileri sosyal demokrat harekete dahil etmek için 'Himmat' partisini kurması, 1915'te doktorluk diploması, Sovyet görevleri, 1937'de tutuklanması, 21 Nisan 1938'de Bakü'de idam edilmesi ve 1956'daki rehabilitasyonu hakkında hiçbir şey belirtilmez. Kişisel dini veya ateizmi hakkında hiçbir şey belirtilmemektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Sultan Mejid Avendiyev; hanya digunakan untuk fakta entitas. Ia diceritakan dalam Shamakhi pada 26 Mei 1887, putra seorang pedagang dan cucu Mufti Agung Transkaukasus, organisasinya atas partai 'Himmat' untuk melibatkan pekerja Muslim ke dalam gerakan sosial demokrat, kualifikasi sebagai dokter pada tahun 1915, posisi Sovietnya, penangkapannya pada tahun 1937, eksekusinya di Baku pada 21 April 1938, dan rehabilitasinya pada tahun 1956. Artikel tersebut tidak menyebutkan apa pun tentang agama pribadi atau ateismenya."
