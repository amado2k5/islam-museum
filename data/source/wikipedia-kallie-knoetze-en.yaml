reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision, fetched by revision id and the returned revision asserted equal. The article carries a 'BLP sources' banner. Its infobox gives his birth name, birth date and birth place as Roodepoort, South Africa — the German article and Wikidata give Pretoria instead, and the conflict is recorded in the person record. The text records his amateur rivalry with Gerrie Coetzee, his 1976 professional debut, his knockouts of Duane Bobick and Richard Dunn, his January 1979 rating as the world's number-three heavyweight after knocking out Bill Sharkey, his elimination-bout loss to John Tate in June 1979, his retirement in 1981, and four film roles between 1979 and 1991, best known as Rosco Dunn in Bomber (1982). The article's text and categories make no statement of his religion."
