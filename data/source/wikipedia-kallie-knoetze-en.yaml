summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن كالي كنوتزي؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده باسم نيكولاس ياكوبوس كنوتزي في 24 أبريل 1953 في روديبورت، ولقبه «دي بيك فان بومسترات»، وسجله 21 فوزاً منها 20 بالضربة القاضية، وخسارته نزال الإقصاء أمام جون تيت سنة 1979، وأدواره السينمائية. ولا تذكر ديانته في متنها ولا في تصنيفاتها."
  en: "English Wikipedia article on Kallie Knoetze; used for entity facts only. It gives his birth as Nikolaas Jacobus Knoetze on 24 April 1953 in Roodepoort, his nickname Die Bek van Boomstraat, his record of 21 wins with 20 knockouts, his 1979 elimination-bout loss to John Tate, and his film roles. It makes no statement of his religion in its text or categories."
