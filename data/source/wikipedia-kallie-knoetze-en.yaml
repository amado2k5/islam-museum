summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن كالي كنوتزي؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده باسم نيكولاس ياكوبوس كنوتزي في 24 أبريل 1953 في روديبورت، ولقبه «دي بيك فان بومسترات»، وسجله 21 فوزاً منها 20 بالضربة القاضية، وخسارته نزال الإقصاء أمام جون تيت سنة 1979، وأدواره السينمائية. ولا تذكر ديانته في متنها ولا في تصنيفاتها."
  en: "English Wikipedia article on Kallie Knoetze; used for entity facts only. It gives his birth as Nikolaas Jacobus Knoetze on 24 April 1953 in Roodepoort, his nickname Die Bek van Boomstraat, his record of 21 wins with 20 knockouts, his 1979 elimination-bout loss to John Tate, and his film roles. It makes no statement of his religion in its text or categories."
  es: "Artículo de la Wikipedia en inglés sobre Kallie Knoetze; utilizado únicamente para datos biográficos. Indica que nació como Nikolaas Jacobus Knoetze el 24 de abril de 1953 en Roodepoort, su apodo Die Bek van Boomstraat, su récord de 21 victorias (20 por nocaut), su derrota en un combate eliminatorio contra John Tate en 1979 y sus papeles cinematográficos. No menciona su religión ni en el texto ni en las categorías."
  fr: "Article Wikipédia en anglais sur Kallie Knoetze; utilisé uniquement pour les informations le concernant. Il mentionne sa naissance sous le nom de Nikolaas Jacobus Knoetze le 24 avril 1953 à Roodepoort, son surnom « Die Bek van Boomstraat », son palmarès de 21 victoires dont 20 par KO, sa défaite en éliminatoires contre John Tate en 1979, et ses rôles au cinéma. Sa religion n'est pas abordée dans le texte ni dans les catégories."
  ur: "Kallie Knoetze پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 24 اپریل 1953 کو روڈ پورٹ میں نیکولاس جیکبس نوٹز کے طور پر پیدا ہوا، اس کا عرفی نام ڈائی بیک وین بومسٹریٹ، اس کا 20 ناک آؤٹ کے ساتھ 21 جیت کا ریکارڈ، جان ٹیٹ سے اس کا 1979 کے خاتمے میں ہار، اور اس کے فلمی کردار۔ اس کے متن یا زمروں میں اس کے مذہب کا کوئی بیان نہیں ہے۔"
  tr: "Kali Knutzi hakkında İngilizce Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılmıştır. 24 Nisan 1953'te Rudepoort'ta 'De Beek van Baumstert' lakabıyla Nicholas Jacobus Knutsi olarak doğdu; 21 galibiyeti vardı, bunların 20'si nakavtla, 1979'da John Tate'e karşı eleme maçını kaybetti ve film rolleri aldı. Dini metinde veya sınıflandırmalarında belirtilmemiştir."
  id: "Artikel Wikipedia bahasa Inggris tentang Kali Knutzi hanya digunakan untuk fakta entitas tersebut. Ia lahir dengan nama Nicholas Jacobus Knutsi pada 24 April 1953 di Rudepoort, dijuluki 'De Beek van Baumstert', dengan 21 kemenangan, termasuk 20 kemenangan dengan knockout, kalah dalam pertandingan eliminasi dari John Tate pada tahun 1979, serta perannya dalam film. Agamanya tidak disebutkan dalam teks maupun klasifikasi mereka."
