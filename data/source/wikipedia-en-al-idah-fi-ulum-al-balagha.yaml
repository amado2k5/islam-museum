  ar: "الصفحة «Al-Idah fi Ulum al-Balagha» — Wikipedia (English)؛ لخّصها ملخص بحثي قدّمه المؤسس إلى المتحف في 21 نوفمبر 2026؛ لم يفتح المتحف الصفحة، ووافق المؤسس على استعمال الملخص دون إعادة تحقق. استُعملت في: كتاب «al-Idah fi Ulum al-Balagha» ومؤلفه وتاريخه."
  en: "The page «Al-Idah fi Ulum al-Balagha» — Wikipedia (English); summarised in a research file supplied to the museum by the founder on 21 November 2026; the museum did not open the page, and the founder approved using the summary without re-verification. Used for: the book «al-Idah fi Ulum al-Balagha»: its author and date."
  ur: "صفحہ «Al-Idah fi Ulum al-Balagha» — Wikipedia (English)؛ اسے ایک تحقیقی فائل نے خلاصہ کیا جو بانی نے 21 نومبر 2026 کو میوزیم کو دی؛ میوزیم نے صفحہ نہیں کھولا اور بانی نے دوبارہ جانچ کے بغیر خلاصہ استعمال کرنے کی منظوری دی۔ استعمال: کتاب «al-Idah fi Ulum al-Balagha»، اس کے مصنف اور تاریخ کا بیان۔"
  fr: "La page «Al-Idah fi Ulum al-Balagha» — Wikipedia (English) ; résumée dans un fichier de recherche remis au musée par le fondateur le 21 novembre 2026 ; le musée n'a pas ouvert la page, et le fondateur a approuvé l'usage de la synthèse sans nouvelle vérification. Utilisée pour : le livre « al-Idah fi Ulum al-Balagha » : son auteur et sa date."
  es: "La página «Al-Idah fi Ulum al-Balagha» — Wikipedia (English); resumida en un archivo de investigación entregado al museo por el fundador el 21 de noviembre de 2026; el museo no abrió la página, y el fundador aprobó usar el resumen sin volver a verificar. Usada para: el libro «al-Idah fi Ulum al-Balagha»: su autor y su fecha."
  tr: "\"Al-Idah fi Ulum al-Balagha\" sayfası — Wikipedia (İngilizce); kurucu tarafından 21 Kasım 2026'da müzeye sunulan bir araştırma özetiyle özetlenmiştir; müze sayfayı açmamış ve kurucu özeti yeniden doğrulama yapmadan kullanmayı kabul etmiştir. Kullanıldığı alanlar: \"al-Idah fi Ulum al-Balagha\" adlı kitap, yazarı ve tarihçesi."
  id: "Halaman \"Al-Idah fi Ulum al-Balagha\" — Wikipedia (Inggris); dirangkum oleh ringkasan penelitian yang diserahkan oleh pendiri ke museum pada 21 November 2026; museum tidak membuka halaman tersebut, dan pendiri setuju menggunakan ringkasan tersebut tanpa verifikasi ulang. Digunakan dalam: buku \"al-Idah fi Ulum al-Balagha,\" penulisnya, dan sejarahnya."
