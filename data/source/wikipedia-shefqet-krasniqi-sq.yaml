reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). Read in full on 4 November 2026. It names his books ('Texhvid i preferuar', 'Rruga e Ndriçuar', 'Qëndrime në Kohë' 1–2, and his study of Abu Hanifa's transmissions) and his translations of two works of Muhammad ibn Salih al-Uthaymin, his weekly column in Epoka e Re, and his membership of the League of Muslim Scholars' board since 2009. On the mosque post it differs from the English article, presenting the imamate as continuing; the English article's dated account (dismissal in 2015, continued preaching on television, radio and social media) is followed in the record, and the difference is noted there. Its infobox belongs to the same structured-data family as the English and Russian ones and was not counted as an independent faith source. The revision-id endpoint was not read in this session, so no revision id is recorded; the access date stands in its place."
