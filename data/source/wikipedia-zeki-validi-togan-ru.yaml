summary:
  ar: "مقالة ويكيبيديا الروسية عن أحمد زكي وليدي؛ تُستخدم لوقائع الكيان فقط. تُعنون الميلاد في صندوق معلوماتها 22 ديسمبر 1890 (بينما تعطي المقالات الأخرى وويكي بيانات 10 ديسمبر)، وتعطي وفاته في 26 يوليو 1970 بإسطنبول ودفنه في مقبرة قراجه أحمد بها، وأصله من أسرة وليدوف من رجال الدين وكان أبوه إمام مسجد كوزيانوفو ومؤسس مدرستها. صندوق معلوماتها هو الموضع الوحيد الذي يسمي له مذهبا: «الإسلام السنّي»."
  en: "Russian Wikipedia article on Akhmet-Zaki Validi; used for entity facts only. Its infobox dates his birth 22 December 1890 (the other articles and Wikidata give 10 December), gives his death on 26 July 1970 at Istanbul and his burial in the Karacaahmet cemetery there, and his origin in the Validov family of religious figures, his father the imam of the Kuzyanovo mosque who founded its madrasa. Its infobox is the only place that names a school for him: 'Sunni Islam'."
