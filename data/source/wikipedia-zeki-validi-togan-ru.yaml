summary:
  ar: "مقالة ويكيبيديا الروسية عن أحمد زكي وليدي؛ تُستخدم لوقائع الكيان فقط. تُعنون الميلاد في صندوق معلوماتها 22 ديسمبر 1890 ⁦(بينما تعطي المقالات الأخرى وويكي بيانات 10 ديسمبر)⁩، وتعطي وفاته في 26 يوليو 1970 بإسطنبول ودفنه في مقبرة قراجه أحمد بها، وأصله من أسرة وليدوف من رجال الدين وكان أبوه إمام مسجد كوزيانوفو ومؤسس مدرستها. صندوق معلوماتها هو الموضع الوحيد الذي يسمي له مذهبا: «الإسلام السنّي»."
  en: "Russian Wikipedia article on Akhmet-Zaki Validi; used for entity facts only. Its infobox dates his birth 22 December 1890 (the other articles and Wikidata give 10 December), gives his death on 26 July 1970 at Istanbul and his burial in the Karacaahmet cemetery there, and his origin in the Validov family of religious figures, his father the imam of the Kuzyanovo mosque who founded its madrasa. Its infobox is the only place that names a school for him: 'Sunni Islam'."
  es: "Artículo de la Wikipedia rusa sobre Akhmet-Zaki Validi; utilizado únicamente para datos sobre la persona. Su ficha informativa indica que nació el 22 de diciembre de 1890 (otros artículos y Wikidata dan el 10 de diciembre), que falleció el 26 de julio de 1970 en Estambul y que fue enterrado en el cementerio de Karacaahmet, y que pertenecía a la familia Validov, de gran tradición religiosa. Su padre fue imán de la mezquita de Kuzyanovo y fundador de su madrasa. Esta ficha informativa es el único lugar donde se menciona una escuela religiosa en su honor: «Islam sunita»."
  fr: "L'article de Wikipédia en russe consacré à Akhmet-Zaki Validi ne contient que des informations sur l'entité. Sa fiche descriptive indique sa naissance au 22 décembre 1890 (contrairement aux autres articles et à Wikidata qui mentionnent le 10 décembre), son décès le 26 juillet 1970 à Istanbul et son inhumation au cimetière de Karacaahmet, ainsi que son appartenance à la famille Validov, une famille de religieux. Son père était l'imam de la mosquée Kuzyanovo et fondateur de sa madrasa. Cette fiche descriptive est la seule à mentionner une école portant son nom: « Islam sunnite »."
