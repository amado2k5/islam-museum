summary:
  ar: "تغطية عرب خبر المنقولة عن الوفد: محكمة جنح مستأنف مصر القديمة أيّدت حبس إسلام بحيري ثلاث سنوات وغرامة 20 ألف جنيه في قضية شيك، وقُبض عليه في 24 سبتمبر 2024 ثم أُخلي سبيله بكفالة 20 ألف جنيه بعد معارضة استئنافية حُددت لها جلسة 23 ديسمبر 2024؛ وتقارير الموقع عن جلسات أكتوبر 2024 تذكر إغلاق عدة قضايا بالتصالح ونقله عن صفحته قوله إن الأمر انتهى وإن القضايا كيدية."
  en: "arabkhabar's coverage, carried from Al-Wafd: the Misr El-Qadima appeals court upheld a three-year sentence and an EGP 20,000 fine against Behery in a cheque case; he was arrested on 24 September 2024 and released on EGP 20,000 bail after an opposition-appeal, with a hearing set for 23 December 2024. The site's reporting of the October 2024 sessions records several cases closed by reconciliation, and quotes his Facebook post that the matter is over and the cases fabricated and malicious."
  es: "Según la información de Arabkhabar, recogida por Al-Wafd: el tribunal de apelaciones de Misr El-Qadima confirmó una condena de tres años y una multa de 20.000 libras egipcias contra Behery en un caso de cheques; fue arrestado el 24 de septiembre de 2024 y puesto en libertad bajo fianza de 20.000 libras egipcias tras una apelación de la oposición, con una audiencia programada para el 23 de diciembre de 2024. El informe del sitio sobre las sesiones de octubre de 2024 registra varios casos cerrados por conciliación y cita su publicación de Facebook en la que afirma que el asunto está zanjado y que los casos son fabricados y maliciosos."
  fr: "D'après la couverture d'arabkhabar relayée par Al-Wafd: la cour d'appel de Misr El-Qadima a confirmé la peine de trois ans de prison et une amende de 20 000 EGP infligées à Behery dans une affaire de chèque sans provision; arrêté le 24 septembre 2024, il a été libéré sous caution de 20 000 EGP après un appel de l'opposition, l'audience étant fixée au 23 décembre 2024. Le site, dans son compte rendu des sessions d'octobre 2024, fait état de plusieurs affaires classées par conciliation et cite un message publié sur Facebook par Behery affirmant que l'affaire est close et que les accusations étaient fabriquées de toutes pièces et malveillantes."
  ur: "arabkhabar کی کوریج، الوافد سے کی گئی: مصر القدیمہ اپیل کورٹ نے چیک کیس میں بیہری کے خلاف تین سال کی سزا اور EGP 20,000 جرمانے کو برقرار رکھا۔ اسے 24 ستمبر 2024 کو گرفتار کیا گیا تھا اور حزب اختلاف کی اپیل کے بعد EGP 20,000 کی ضمانت پر رہا کیا گیا تھا، جس کی سماعت 23 دسمبر 2024 کو مقرر تھی۔ اکتوبر 2024 کے سیشنز کی سائٹ کی رپورٹنگ میں مفاہمت کے ذریعے بند کیے گئے متعدد مقدمات درج کیے گئے ہیں، اور اس کی فیس بک پوسٹ کا حوالہ دیا گیا ہے کہ معاملہ ختم ہو چکا ہے اور مقدمات من گھڑت ہیں۔"
