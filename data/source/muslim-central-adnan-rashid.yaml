summary:
  ar: "قائمة بودكاست مسلم سنترال لعدنان راشد على Listen Notes؛ تصفه بأنه ناشط في الدعوة زار أكثر من 30 دولة، وحاصل على إجازات في الحديث، وعلى البكالوريوس بمرتبة الشرف في التاريخ من بيركبيك، وعمل باحثًا أول ومحاضرًا في iERA وخطيبًا في مساجد غرب لندن."
  en: "The Listen Notes listing of Muslim Central's Adnan Rashid podcast; it describes him as active in dawah across more than 30 countries, holding ijazas in hadith and a BA with honours in history from Birkbeck, and having served as a senior researcher and lecturer with iERA and as a khateeb in West London mosques."
  es: "La ficha del podcast de Adnan Rashid en Listen Notes, de Muslim Central, lo describe como una persona activa en la dawah (proselitismo islámico) en más de 30 países, con ijazas (certificaciones islámicas) en hadiz y una licenciatura con honores en historia por Birkbeck, además de haber trabajado como investigador principal y profesor en iERA y como khateeb (predicador religioso) en mezquitas del oeste de Londres."
  fr: "La fiche d'écoute du podcast Adnan Rashid de Muslim Central le décrit comme actif dans la da'wah dans plus de 30 pays, titulaire d'ijazas en hadith et d'une licence avec mention en histoire de Birkbeck, et ayant travaillé comme chercheur principal et conférencier pour iERA et comme khatib dans des mosquées de l'ouest de Londres."
  ur: "مسلم سنٹرل کے عدنان رشید پوڈ کاسٹ کی لسٹنگ نوٹس؛ اس میں اسے 30 سے زائد ممالک میں دعوت میں سرگرم ہونے کے طور پر بیان کیا گیا ہے، جس نے حدیث میں اعجاز اور برک بیک سے تاریخ میں بی اے کیا ہے، اور iERA کے ساتھ سینئر محقق اور لیکچرر اور مغربی لندن کی مساجد میں خطیب کے طور پر خدمات انجام دی ہیں۔"
  tr: "Listen Notes'ta Adnan Rashid tarafından hazırlanan Muslim Central podcast listesi; Da'wah'ta aktivist olarak tanımlanıyor; 30'dan fazla ülkeyi ziyaret etmiş, hadis diploması sahibi, Birkbeck'ten tarih alanında onur derecesiyle lisans derecesine sahip, kıdemli araştırmacı, iERA'da öğretim görevlisi ve Batı Londra camilerinde vaiz olarak çalışmış."
  id: "Daftar podcast Muslim Central oleh Adnan Rashid di Listen Notes; digambarkan sebagai aktivis di Da'wah yang telah mengunjungi lebih dari 30 negara, memiliki gelar Hadis, meraih gelar sarjana dengan predikat kehormatan dalam sejarah dari Birkbeck, bekerja sebagai peneliti senior, dosen di iERA, dan sebagai pengkhotbah di masjid-masjid West London."
