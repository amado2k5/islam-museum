label:
  ar: "ابن رشد الحفيد، بداية المجتهد ونهاية المقتصد، المجلد الرابع ⁦(حققه وضبطه وعلق عليه د. علي بن محمد بن ونيس ومعه فريق من العلماء والباحثين، دار ابن الجوزي 1442هـ)⁩"
  en: "Ibn Rushd al-Hafid, Bidayat al-Mujtahid wa-Nihayat al-Muqtasid, vol. 4 (edited and annotated by Dr Ali ibn Muhammad ibn Wanis with a team of scholars and researchers, Dar Ibn al-Jawzi 1442 AH)"
  ur: "ابن رشد الحفید، بدایۃ المجتہد و نہایۃ المقتصد، جلد چہارم (تحقیق و ضبط و تعلیق ڈاکٹر علی بن محمد بن ونیس مع علما و محققین کی ایک جماعت، دار ابن الجوزی 1442ھ)"
summary:
  ar: "المجلد الرابع من ستة مجلدات من طبعة دار ابن الجوزي ⁦(الدمام)⁩ المحققة على مخطوطات يرمز لها في الحواشي بأحرف ⁦(أ، ب، ج، م)⁩، مع ترقيم مسلسل للفقرات وإحالات إلى كتب المذاهب؛ يضم من كتاب العقيقة إلى البيوع والعرية ⁦(الفقرات 1475-2173)⁩، 1442هـ."
  en: "Volume 4 of the six-volume Dar Ibn al-Jawzi (Dammam) critical edition, established on manuscripts signalled in the notes by sigla (A, B, J, M), with numbered paragraphs and references to each school's books; it runs from the Book of the Aqiqa to Sales and the Ariyya (paragraphs 1475-2173), 1442 AH."
  ur: "دار ابن الجوزی (دمام) کے چھ جلدی محققہ ایڈیشن کی جلد چہارم، جو مخطوطات پر قائم ہے جن کے رموز حواشی میں (أ، ب، ج، م) ہیں، مسلسل نمبر شدہ فقروں اور مذاہب کی کتب کے حوالوں کے ساتھ؛ اس میں کتاب العقیقہ سے بیوع اور عریہ تک (فقرے 1475-2173) ہے، 1442ھ۔"
title: "بداية المجتهد ونهاية المقتصد"
