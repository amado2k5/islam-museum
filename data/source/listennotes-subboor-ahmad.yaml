summary:
  ar: "صفحة حلقة بودكاست «محادثات مع بيتر بوغوسيان» ⁦(3 فبراير 2026)⁩ التي استضافت صبور أحمد؛ تصفه سيرة الضيف بأنه مدافع ومناظر وكاتب بريطاني مسلم حاصل على الماجستير في الفلسفة من بيركبيك، جامعة لندن، يتنقل لتعليم المسلمين كيفية عرض الإسلام."
  en: "Episode page of Peter Boghossian's podcast (3 February 2026) featuring Subboor Ahmad; its guest biography describes a British Muslim apologist, debater, writer and podcaster with a master's degree in philosophy from Birkbeck, University of London, who travels to teach Muslims how to articulate Islam."
  es: "Página del episodio del podcast de Peter Boghossian (3 de febrero de 2026) con Subboor Ahmad; su biografía lo describe como un apologista, orador, escritor y podcaster musulmán británico con una maestría en filosofía de Birkbeck, Universidad de Londres, que viaja para enseñar a los musulmanes cómo articular el Islam."
  fr: "Page de l'épisode du podcast de Peter Boghossian (3 février 2026) avec Subboor Ahmad; sa biographie d'invité décrit un apologiste, débatteur, écrivain et podcasteur musulman britannique titulaire d'une maîtrise en philosophie de Birkbeck, Université de Londres, qui voyage pour enseigner aux musulmans comment articuler l'islam."
  ur: "پیٹر بوگھوسیئن کے پوڈ کاسٹ کا ایپی سوڈ صفحہ ⁦(3 فروری 2026)⁩ جس میں سبور احمد شامل ہیں۔ اس کی مہمانوں کی سوانح عمری میں برک بیک، لندن یونیورسٹی سے فلسفہ میں ماسٹر ڈگری کے ساتھ ایک برطانوی مسلمان معافی نامہ نگار، بحث کرنے والے، مصنف اور پوڈ کاسٹر کی وضاحت کی گئی ہے، جو مسلمانوں کو اسلام کو بیان کرنے کا طریقہ سکھانے کے لیے سفر کرتے ہیں۔"
  tr: "Sabour Ahmed'in ağırladığı \"Peter Bogosian ile Sohbetler\" (3 Şubat 2026) podcast bölümünün sayfasında, konuk olarak Londra Üniversitesi Birkbeck'ten felsefe alanında yüksek lisans derecesine sahip İngiliz Müslüman bir savunucu, tartışmacı ve yazar olarak tanımlanıyor; Müslümanlara İslam'ı nasıl sunacaklarını öğretmek için seyahat ediyor."
  id: "Halaman episode podcast \"Conversations with Peter Bogosian\" (3 Februari 2026), yang menjadi tuan rumah Sabour Ahmed, menggambarkan tamu tersebut sebagai pembela, debater, dan penulis Muslim Inggris dengan gelar magister filsafat dari Birkbeck, University of London, yang bepergian untuk mengajarkan Muslim bagaimana menyajikan Islam."
