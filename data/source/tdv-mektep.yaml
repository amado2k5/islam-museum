reliability_note: "Read through the browser pane on 1 November 2026, web edition: part 1 (Nebi Bozkurt, pp. 5–6) and part 2 (Cahit Baltacı, pp. 6–7) read in full, covering the kuttab and sıbyan schools, the early teachers, the curriculum, the standing of the teacher, the Ottoman foundations and the reforms of 1824, 1846, 1868. Part 3 (architecture, Zeynep Ahunbay, pp. 7–9) and part 4 (the school hymn, pp. 10–11) were not read and are not cited. The bibliographies were not checked. A search of the site for MUALLİM gave no standalone article; the teacher's title appears in this entry only inside the text of the school."
