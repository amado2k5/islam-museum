summary:
  ar: "مدخل «مكتب» (mekteb) في موسوعة TDV الإسلامية، من أربعة أجزاء: الأول بقلم نبي بوزكورت عن المعنى والمكتب في الأصل والكُتّاب وأول دروسه في عهد النبي والعصر الأموي والعباسي، والثاني بقلم جاهت بالتجي عن المكتب العثماني: المناهج والمعلمون وأجورهم وتكوين المعلم وإنشاء دار المعلمين سنة 1868، والثالث عن العمارة، والرابع عن النشيد. (المجلد 29، أنقرة، 2004، ص 5–11)."
  en: "The entry 'MEKTEP' (mekteb, school) in the TDV İslâm Ansiklopedisi, in four parts: part 1 by Nebi Bozkurt on the word, the early kuttab schools from the Prophet's time through the Umayyad and Abbasid periods; part 2 by Cahit Baltacı on the Ottoman school: curricula, teachers, their training and pay, and the teachers' school of 1868; part 3 on architecture; part 4 on the school hymn (vol. 29, 2004, pp. 5–11)."
title: "MEKTEP"
