label: { ar: "المكتب — موسوعة TDV الإسلامية ⁦(نبي بوزكورت، جاهت بالتجي وآخرون)⁩", en: "MEKTEP — TDV İslâm Ansiklopedisi (Nebi Bozkurt; Cahit Baltacı and others)" }
summary:
  ar: "مدخل «مكتب» (mekteb) في موسوعة TDV الإسلامية، من أربعة أجزاء: الأول بقلم نبي بوزكورت عن المعنى والمكتب في الأصل والكُتّاب وأول دروسه في عهد النبي والعصر الأموي والعباسي، والثاني بقلم جاهت بالتجي عن المكتب العثماني: المناهج والمعلمون وأجورهم وتكوين المعلم وإنشاء دار المعلمين سنة 1868، والثالث عن العمارة، والرابع عن النشيد. ⁦(المجلد 29، أنقرة، 2004، ص 5–11)⁩."
  en: "The entry 'MEKTEP' (mekteb, school) in the TDV İslâm Ansiklopedisi, in four parts: part 1 by Nebi Bozkurt on the word, the early kuttab schools from the Prophet's time through the Umayyad and Abbasid periods; part 2 by Cahit Baltacı on the Ottoman school: curricula, teachers, their training and pay, and the teachers' school of 1868; part 3 on architecture; part 4 on the school hymn (vol. 29, 2004, pp. 5–11)."
  es: "La entrada 'MEKTEP' (mekteb, escuela) en la TDV İslâm Ansiklopedisi, en cuatro partes: parte 1 por Nebi Bozkurt sobre la palabra, las primeras escuelas kuttab desde la época del Profeta hasta los períodos omeya y abasí; parte 2 por Cahit Baltacı sobre la escuela otomana: planes de estudio, maestros, su formación y salario, y la escuela de maestros de 1868; parte 3 sobre arquitectura; parte 4 sobre el himno escolar (vol. 29, 2004, págs. 5-11)."
  fr: "L'entrée « MEKTEP » (mekteb, école) dans la TDV İslâm Ansiklopedisi, en quatre parties: partie 1 par Nebi Bozkurt sur le mot, les premières écoles kuttab de l'époque du Prophète jusqu'aux périodes omeyyade et abbasside; partie 2 par Cahit Baltacı sur l'école ottomane: programmes, enseignants, leur formation et leur rémunération, et l'école des enseignants de 1868; partie 3 sur l'architecture; partie 4 sur l'hymne scolaire (vol. 29, 2004, pp. 5-11)."
  ur: "TDV İslâm Ansiklopedisi میں 'MEKTEP' ⁦(مکتب، اسکول)⁩ کا اندراج، چار حصوں میں: حصہ 1 نبیی بوزکورٹ کا لفظ پر، ابتدائی کتب مکاتب جو پیغمبر کے زمانے سے لے کر اموی اور عباسی ادوار تک؛ حصہ 2 از Cahit Baltacı عثمانی اسکول پر: نصاب، اساتذہ، ان کی تربیت اور تنخواہ، اور اساتذہ کا اسکول 1868؛ فن تعمیر پر حصہ 3؛ حصہ 4 اسکول کے بھجن پر ⁦(جلد 29، 2004، صفحہ 5-11)⁩۔"
  tr: "TDV İslami Ansiklopedisi'ndeki \"Mekteb\" maddesi dört bölümden oluşur: ilki Nabi Bozkurt'un anlamı ve makamı ve kitabın kökeni üzerine ve ilk dersleri ile Peygamber dönemi ile Emevi ve Abbasi dönemlerinde ilk dersleri; ikincisi Jahat Baltiji'nin Osmanlı Ofisi: Müfredatlar, Öğretmenler, Maaşları, Öğretmen Eğitimi ve 1868'de Öğretmenler Evinin Kurulması üzerine; üçüncüsü mimarlık üzerine; dördüncüsü ise marşlar üzerine. (Cilt 29, Ankara, 2004, ss. 5–11)."
  id: "Entri \"Mekteb\" dalam Ensiklopedia Islam TDV, terdiri dari empat bagian: yang pertama oleh Nabi Bozkurt tentang makna dan jabatan asal serta buku, serta pelajaran pertamanya pada masa Nabi serta era Umayyah dan Abbasiyah; yang kedua oleh Jahat Baltiji tentang Kantor Ottoman: Kurikulum, Guru, Upah Mereka, Pelatihan Guru, dan Pendirian Rumah Guru pada tahun 1868; yang ketiga tentang arsitektur; dan yang keempat tentang lagu kebangsaan. (Volume 29, Ankara, 2004, hlm. 5–11)."
