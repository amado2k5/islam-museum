  ar: "دراسة أكاديمية محكّمة لجايلز هولدر (2012) عن الشريف عثمان مدني حيدرة وحركة أنصار الدين؛ تصفه بأنه «المرشد الروحي المالكي» للحركة، وتنقل عن موقع الحركة أن أعضاءها تجاوزوا مئة ألف في أربعة وعشرين بلدًا."
  en: "Peer-reviewed academic study by Gilles Holder (2012) on Chérif Ousmane Madani Haidara and the Ansar Dine movement; it calls him the movement's Maliki 'spiritual guide' and quotes the movement's own site claiming more than one hundred thousand members in twenty-four countries."
title: "Chérif Ousmane Madani Haidara and the Islamic Movement Ansar Dine: A Popular Malian Reformism in Search of Autonomy"
