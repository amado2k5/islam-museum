reliability_note: "Peer-reviewed academic study, read on 4 November 2026 in the English version hosted on Cairn. It calls Haidara in prose 'the Maliki spiritual guide of Ansar Dine' and quotes the movement's own website (accessed 4 October 2010): 'more than one hundred thousand members, in twenty-four countries, thirty sections, 169 subsections and nine hundred committees' — the membership figure is the movement's self-report as relayed by Holder and is cited as such. It also records the formation of Ansar Dine International in January 2004, with national offices in Mali, Ivory Coast and Burkina Faso, and Mawlid celebrations drawing tens of thousands from across Mali and West Africa."
