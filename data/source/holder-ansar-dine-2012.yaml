label: { en: "Gilles Holder — 'Chérif Ousmane Madani Haidara and the Islamic Movement Ansar Dine' (Cahiers d'études africaines, 2012)" }
summary:
  ar: "دراسة أكاديمية محكّمة لجايلز هولدر (2012) عن الشريف عثمان مدني حيدرة وحركة أنصار الدين؛ تصفه بأنه «المرشد الروحي المالكي» للحركة، وتنقل عن موقع الحركة أن أعضاءها تجاوزوا مئة ألف في أربعة وعشرين بلدًا."
  en: "Peer-reviewed academic study by Gilles Holder (2012) on Chérif Ousmane Madani Haidara and the Ansar Dine movement; it calls him the movement's Maliki 'spiritual guide' and quotes the movement's own site claiming more than one hundred thousand members in twenty-four countries."
  es: "Estudio académico revisado por pares realizado por Gilles Holder (2012) sobre Chérif Ousmane Madani Haidara y el movimiento Ansar Dine; en él se le denomina el \"guía espiritual\" Maliki del movimiento y se cita el propio sitio web del movimiento, que afirma tener más de cien mil miembros en veinticuatro países."
  fr: "Étude académique évaluée par des pairs de Gilles Holder (2012) sur Chérif Ousmane Madani Haidara et le mouvement Ansar Dine; elle le qualifie de « guide spirituel » malikite du mouvement et cite le site du mouvement lui-même affirmant avoir plus de cent mille membres dans vingt-quatre pays."
  ur: "Gilles Holder (2012) کی طرف سے Chérif Osmane Madani Haidara and the Insar Dine Movement پر ہم مرتبہ نظرثانی شدہ تعلیمی مطالعہ؛ یہ اسے تحریک کا مالکی 'روحانی رہنما' کہتا ہے اور تحریک کی اپنی سائٹ کا حوالہ دیتا ہے جس میں چوبیس ممالک میں ایک لاکھ سے زیادہ اراکین کا دعویٰ ہے۔"
title: "Chérif Ousmane Madani Haidara and the Islamic Movement Ansar Dine: A Popular Malian Reformism in Search of Autonomy"
author: [{ family: "Holder", given: "Gilles" }]
