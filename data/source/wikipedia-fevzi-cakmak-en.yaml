  ar: "مقالة ويكيبيديا الإنجليزية عن فوزي جاكماق؛ تُستخدم لوقائع الكيان فقط. تروي قيادته في غاليبولي، ورئاسته الأركان ونظارة الحربية العثمانية، ووزارة الدفاع ورئاسة الحكومة في أنقرة، ورئاسته أركان الجمهورية حتى 1944، ووفاته ودفنه في إسطنبول سنة 1950."
  en: "English Wikipedia article on Fevzi Çakmak; used for entity facts only. It recounts his Gallipoli corps command, his Ottoman chief-of-staff and war-minister posts, his Ankara defence ministry and premiership, his chief-of-staff tenure to 1944, and his death and burial at Istanbul in 1950."
