reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and re-fetched by the recorded revision id with content verified identical. It gives him as born 12 January 1876 at Cihangir, Istanbul (citing the TBMM archive biography through Gök's monograph), a staff captain of 1898, V Corps commander at Gallipoli, where two of his brothers were killed, Ottoman Chief of the General Staff 1918–1919 and Minister of War in February–April 1920, then at Ankara Minister of National Defense, Deputy Prime Minister and Prime Minister from 24 January 1921 to 12 July 1922, Chief of the General Staff from 5 August 1921 until his retirement on 12 January 1944, field marshal (Mareşal) from 31 August 1922 — with Atatürk one of Turkey's only two — and dead on 10 April 1950 at Teşvikiye, Istanbul, his funeral service held at the Beyazıt Mosque and his burial at Eyüp Cemetery on 12 April 1950. It makes no statement of his religion in its text or infobox. Its birthplace reading, Cihangir, differs from the Turkish article's lead (Anadolu Kavağı) and from Wikidata (Rumelikavağı) — all Istanbul districts."
