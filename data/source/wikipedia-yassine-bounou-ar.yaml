summary:
  ar: "مقالة ويكيبيديا العربية «ياسين بونو»؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في مونتريال سنة 1991 لأبوين مغربيين، ومسيرته مع الوداد وأتلتيكو مدريد وسرقسطة وجيرونا وإشبيلية والهلال، ومشاركاته مع منتخب المغرب."
  en: "Arabic Wikipedia article on Yassine Bounou; used for entity facts only. It gives his birth in Montreal in 1991 to Moroccan parents, his career with Wydad, Atlético Madrid, Zaragoza, Girona, Sevilla and Al Hilal, and his appearances for Morocco."
  es: "Artículo de Wikipedia en árabe sobre Yassine Bounou; utilizado únicamente para datos sobre la persona. Indica que nació en Montreal en 1991 de padres marroquíes, su trayectoria en el Wydad, el Atlético de Madrid, el Zaragoza, el Girona, el Sevilla y el Al Hilal, y sus apariciones con la selección de Marruecos."
  fr: "Article Wikipédia en arabe sur Yassine Bounou; utilisé uniquement pour les informations le concernant. Il indique sa naissance à Montréal en 1991 de parents marocains, sa carrière au Wydad, à l’Atlético Madrid, à Saragosse, à Gérone, à Séville et à Al Hilal, ainsi que ses sélections en équipe nationale du Maroc."
  ur: "یاسین بونو پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1991 میں مونٹریال میں مراکش کے والدین کے ہاں اس کی پیدائش، وائیڈاد، ایٹلیٹکو میڈرڈ، زاراگوزا، گیرونا، سیویلا اور الہلال کے ساتھ اس کا کیریئر اور مراکش کے لیے اس کی پیشی ہے۔"
  tr: "Arapça Vikipedi makalesi \"Yassine Bounou\"; yalnızca kuruluşun gerçekleri için kullanılmıştır. 1991'de Montreal'de doğduğu ve Fas kökenli ebeveynlerin çocuğu olarak anılmaktadır; Wydad, Atlético Madrid, Zaragoza, Girona, Sevilla ve Al Hilal takımlarındaki kariyeri ve Fas milli takımındaki katılımı yer almaktadır."
  id: "Artikel Wikipedia Arab \"Yassine Bounou\"; hanya digunakan untuk fakta entitas. Ia disebutkan lahir di Montreal pada tahun 1991 dari orang tua Maroko, kariernya bersama Wydad, Atlético Madrid, Zaragoza, Girona, Sevilla, dan Al Hilal, serta partisipasinya dengan tim nasional Maroko."
