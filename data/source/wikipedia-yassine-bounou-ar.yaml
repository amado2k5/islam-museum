reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Consulted on 26 October 2026; the reading route did not expose a revision id, so the consultation date is recorded in place of a revision. It gives Bounou as born on 5 April 1991 in Montreal, Canada, a holder of Moroccan and Canadian citizenship, and his career through Wydad, Atlético Madrid, Zaragoza (on loan), Girona, Sevilla and Al Hilal, with his Morocco record from the 2013 debut to the 2022 World Cup semi-final and the 2025 Africa Cup of Nations, at which he was named the tournament's best goalkeeper; it also names him African Goalkeeper of the Year twice (2023 and 2025). Its infobox carries no religion field and its text makes no statement of his religion or of any school."
