summary:
  ar: "صفحة «Taj al-'Arus min Jawahir al-Qamus» في ويكيبيديا الإنجليزية، وهي الصفحة الموثِّقة التي سماها ملخص بحثي قُدّم إلى المتحف للكتاب «تاج العروس من جواهر القاموس»؛ لم يفتح المتحف الصفحة، وقد أجاز المؤسس استعمال الملخص دون إعادة تحقق في 21 نوفمبر 2026، في موضوع: نسبة الكتاب إلى مؤلفه وتاريخه."
  en: "The page \"Taj al-'Arus min Jawahir al-Qamus\" on the English Wikipedia, named by a research summary supplied to the museum as the documenting page for Taj al-Arus min Jawahir al-Qamus; the museum did not open the page, and the founder approved using the summary without re-verification on 21 November 2026, for the ascription of the work to its author and its date."
  ur: "انگریزی ویکیپیڈیا پر صفحہ «Taj al-'Arus min Jawahir al-Qamus»، جسے عجائب گھر کو دیے گئے ایک تحقیقی خلاصے نے «تاج العروس من جواہر القاموس» کا مستند صفحہ بتایا؛ عجائب گھر نے صفحہ نہیں کھولا، اور بانی نے 21 نومبر 2026 کو دوبارہ تصدیق کے بغیر خلاصے کے استعمال کی منظوری دی، موضوع: کتاب کی مصنف سے نسبت اور اس کی تاریخ۔"
  fr: "La page « Taj al-'Arus min Jawahir al-Qamus » de Wikipédia (anglaise), nommée par un résumé de recherche remis au musée comme page documentaire de Taj al-Arus min Jawahir al-Qamus ; le musée n'a pas ouvert la page, et le fondateur a approuvé l'usage du résumé sans nouvelle vérification le 21 novembre 2026, pour l'attribution de l'ouvrage à son auteur et sa date."
  es: "La página «Taj al-'Arus min Jawahir al-Qamus» de Wikipedia (en inglés), nombrada por un resumen de investigación entregado al museo como página documental de Taj al-Arus min Jawahir al-Qamus; el museo no abrió la página, y el fundador aprobó usar el resumen sin nueva verificación el 21 de noviembre de 2026, para la atribución de la obra a su autor y su fecha."
