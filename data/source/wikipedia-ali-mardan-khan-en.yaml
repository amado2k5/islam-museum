reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It gives his death on 2 April 1657 — against 26 April 1657 in the Urdu article and Wikidata, a rivalry preserved in the person record — his Kurdish Zig origin as son of Ganj Ali Khan, his inheritance of the governorships of Kerman, Sistan and Kandahar in 1624, the surrender of Kandahar to Shah Jahan in March 1638, his rise to a mansab of 7000/7000 and the title Amir al-Umara by 1643, his governorships of Kashmir, the Punjab and Kabul, and his building works (the Ravi canal for Lahore's Shalimar Bagh, the Chashma Shahi garden, the Peshawar covered bazaar). It names no religion for him. Checked 1 November 2026."
