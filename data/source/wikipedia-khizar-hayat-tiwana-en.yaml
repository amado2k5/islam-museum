summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ملک خضر حياة تيوانا؛ تُستخدم لوقائع الكيان فقط. تروي أنه وُلد في 7 آب 1900 في چك مظفرآباد وتوفي في 20 كانون الثاني 1975 في بيوت سيتي بكاليفورنيا، وأنه آخر رئيس وزراء للبنجاب الموحدة (1942–1947)، عارض تقسيم الهند ونظرية الدولتين، وطُرد من الرابطة الإسلامية، واستقال في 2 آذار 1947، وأنه ابن سر عمر حياة خان."
  en: "English Wikipedia article on Malik Khizar Hayat Tiwana; used for entity facts only. It recounts that he was born on 7 August 1900 at Chak Muzaffarabad and died on 20 January 1975 at Butte City, California, that he was the last Premier of the undivided Punjab (1942–1947), opposed the partition of India and the two-nation theory, was expelled from the Muslim League, resigned on 2 March 1947, and was the son of Sir Umar Hayat Khan."
