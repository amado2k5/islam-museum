summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ملک خضر حياة تيوانا؛ تُستخدم لوقائع الكيان فقط. تروي أنه وُلد في 7 آب 1900 في چك مظفرآباد وتوفي في 20 كانون الثاني 1975 في بيوت سيتي بكاليفورنيا، وأنه آخر رئيس وزراء للبنجاب الموحدة (1942–1947)، عارض تقسيم الهند ونظرية الدولتين، وطُرد من الرابطة الإسلامية، واستقال في 2 آذار 1947، وأنه ابن سر عمر حياة خان."
  en: "English Wikipedia article on Malik Khizar Hayat Tiwana; used for entity facts only. It recounts that he was born on 7 August 1900 at Chak Muzaffarabad and died on 20 January 1975 at Butte City, California, that he was the last Premier of the undivided Punjab (1942–1947), opposed the partition of India and the two-nation theory, was expelled from the Muslim League, resigned on 2 March 1947, and was the son of Sir Umar Hayat Khan."
  es: "Artículo de la Wikipedia en inglés sobre Malik Khizar Hayat Tiwana; utilizado únicamente para datos biográficos. Relata que nació el 7 de agosto de 1900 en Chak Muzaffarabad y falleció el 20 de enero de 1975 en Butte City, California; que fue el último Primer Ministro del Punjab indiviso (1942-1947); que se opuso a la partición de la India y a la teoría de las dos naciones; que fue expulsado de la Liga Musulmana; que renunció el 2 de marzo de 1947; y que era hijo de Sir Umar Hayat Khan."
  fr: "Article de Wikipédia en anglais sur Malik Khizar Hayat Tiwana; utilisé uniquement à des fins d’information sur l’entité. Il y est indiqué qu’il est né le 7 août 1900 à Chak Muzaffarabad et décédé le 20 janvier 1975 à Butte City, en Californie, qu’il fut le dernier Premier ministre du Pendjab non divisé (1942-1947), qu’il s’opposa à la partition de l’Inde et à la théorie des deux nations, qu’il fut exclu de la Ligue musulmane, qu’il démissionna le 2 mars 1947 et qu’il était le fils de Sir Umar Hayat Khan."
  ur: "ملک خضر حیات ٹوانہ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں بتایا گیا ہے کہ وہ 7 اگست 1900 کو چک مظفر آباد میں پیدا ہوئے اور 20 جنوری 1975 کو بٹ سٹی، کیلیفورنیا میں ان کا انتقال ہوا، وہ غیر منقسم پنجاب (1942–1947) کے آخری وزیر اعظم تھے، تقسیم ہند اور دو قومی نظریہ کی مخالفت کرتے ہوئے، مسلم لیگ سے استعفیٰ دے دیا گیا، مارچ 42 کو مسلم لیگ سے نکال دیا گیا۔ سر عمر حیات خان کا۔"
  tr: "Malik Khidr Hayat Tiwana hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 7 Ağustos 1900'de Muzaffarabad'da doğduğu ve 20 Ocak 1975'te Kaliforniya, Piot City'de öldüğü anlatılır. Birleşik Pencap'ın (1942–1947) son Başbakanıydı, Hindistan'ın bölünmesine ve iki devlet teorisine karşı çıktı, Müslüman Ligi'nden ihraç edildi, 2 Mart 1947'de istifa etti ve Umar Hayat Khan'ın sırdaşı oldu."
  id: "Artikel Wikipedia bahasa Inggris tentang Malik Khidr Hayat Tiwana; digunakan hanya untuk fakta entitas. Diceritakan bahwa ia lahir pada 7 Agustus 1900 di Muzaffarabad dan meninggal pada 20 Januari 1975 di Piot City, California. Ia adalah Perdana Menteri terakhir Punjab yang bersatu (1942–1947), menentang pembagian India dan teori dua negara, dikeluarkan dari Liga Muslim, mengundurkan diri pada 2 Maret 1947, dan menjadi tempat curhat Umar Hayat Khan."
