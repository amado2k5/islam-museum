reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision, fetched by revision id through the MediaWiki API with the returned id asserted equal. Its biography rests chiefly on Ian Talbot's Khizr Tiwana, the Punjab Unionist Party and the Partition of India (Routledge, 2013), with Jalal (1994), Moon (1962), Hardy (1972) and the New York Times of 25 January 1975. On religion its early-life text states, without a citation attached, that unlike his father he was a religious person and is believed to be a follower of Sufism; no source it cites names a school or order for him, and its categories (including a '20th-century Indian Muslims' filing) attest nothing."
