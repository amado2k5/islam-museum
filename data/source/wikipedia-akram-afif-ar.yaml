  fr: "Article Wikipédia en arabe sur Akram Afif; utilisé uniquement à titre informatif. Il indique son nom complet: Akram Hassan Afif Yahya Afif, sa date de naissance: 18 novembre 1996, et ses deux titres de meilleur joueur asiatique de l’année. Aucune mention n’est faite de sa religion."
  ur: "اکرم عفیف پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کا پورا نام اکرم حسن عفیف یحییٰ عفیف بتایا گیا ہے، ان کی پیدائش 18 نومبر 1996 کو ہوئی تھی اور ان کے دو ایشین فٹبالر آف دی ایئر ایوارڈز ہیں۔ اس کے مذہب کے بارے میں کوئی بیان نہیں ہے۔"
