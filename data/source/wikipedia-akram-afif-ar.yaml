  ar: "مقالة ويكيبيديا العربية عن أكرم عفيف؛ تُستخدم لوقائع الكيان فقط. تعطي اسمه الكامل أكرم حسن عفيف يحيى عفيف وميلاده في 18 نوفمبر 1996 وفوزه بجائزة أفضل لاعب في آسيا مرتين. ولا تذكر ديانته."
  en: "Arabic Wikipedia article on Akram Afif; used for entity facts only. It gives his full name as Akram Hassan Afif Yahya Afif, his birth on 18 November 1996 and his two Asian Footballer of the Year awards. It makes no statement about his religion."
