reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md). Fetched by revision id through the MediaWiki API on 26 October 2026; the returned revision id equals the recorded one. Much of the article is a general account of the Bosnian war rather than biography. Its biographical statements: Fatih Seferagic is a Bosnian hafiz, reciter and preacher of worldwide fame; he was born in 1995 in Bosnia and Herzegovina (the Bashkir article and Wikidata give Germany as the birthplace); his family moved to the United States in his childhood because of the war; he memorised the Qur'an young, studied Islamic sciences at institutions in the United States and the Middle East, took part in recitation competitions, and by 2025 had about 1.17 million YouTube subscribers. It names no school or madhhab for him."
