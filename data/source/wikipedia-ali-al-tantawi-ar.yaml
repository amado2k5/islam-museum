summary:
  ar: "مقالة ويكيبيديا العربية عن الفقيه والأديب والقاضي علي الطنطاوي؛ لوقائع الكيان فقط: مولده بدمشق في 23 جمادى الأولى 1327هـ / 12 يونيو 1909، ودراسته في مكتب عنبر وحقوق دمشق، وكتابته في «الرسالة» عشرين سنة، وقضاؤه 1941–1953، ومشروع قانون الأحوال الشخصية السوري (1947)، وانتقاله إلى السعودية في 1963، وبرامجه الإذاعية والتلفزيونية، ووفاته بجدة في 4 ربيع الأول 1420هـ / 18 يونيو 1999؛ ومن مراجعها «ذكريات علي الطنطاوي» وسيرة حفيده مجاهد ديرانية."
  en: "Arabic Wikipedia article on the jurist, writer and judge Ali al-Tantawi; entity facts only: birth in Damascus on 23 Jumada I 1327 / 12 June 1909, schooling at Maktab Anbar and law at Damascus, twenty years of writing in al-Risala, his judgeship 1941–1953, the draft Syrian personal-status law (1947), his move to Saudi Arabia in 1963, his radio and television programmes, and death in Jeddah on 4 Rabi' I 1420 / 18 June 1999; its references include his own Memoirs and his grandson Mujahid Dirani's biography."
