summary:
  ar: "مقالة ويكيبيديا العربية عن الفقيه والأديب والقاضي علي الطنطاوي؛ لوقائع الكيان فقط: مولده بدمشق في 23 جمادى الأولى 1327هـ / 12 يونيو 1909، ودراسته في مكتب عنبر وحقوق دمشق، وكتابته في «الرسالة» عشرين سنة، وقضاؤه 1941–1953، ومشروع قانون الأحوال الشخصية السوري (1947)، وانتقاله إلى السعودية في 1963، وبرامجه الإذاعية والتلفزيونية، ووفاته بجدة في 4 ربيع الأول 1420هـ / 18 يونيو 1999؛ ومن مراجعها «ذكريات علي الطنطاوي» وسيرة حفيده مجاهد ديرانية."
  en: "Arabic Wikipedia article on the jurist, writer and judge Ali al-Tantawi; entity facts only: birth in Damascus on 23 Jumada I 1327 / 12 June 1909, schooling at Maktab Anbar and law at Damascus, twenty years of writing in al-Risala, his judgeship 1941–1953, the draft Syrian personal-status law (1947), his move to Saudi Arabia in 1963, his radio and television programmes, and death in Jeddah on 4 Rabi' I 1420 / 18 June 1999; its references include his own Memoirs and his grandson Mujahid Dirani's biography."
  es: "Artículo en árabe de la Wikipedia sobre el jurista, escritor y juez Ali al-Tantawi; solo datos biográficos: nacimiento en Damasco el 23 de Jumada I de 1327 / 12 de junio de 1909, estudios en Maktab Anbar y derecho en Damasco, veinte años escribiendo en al-Risala, su cargo como juez entre 1941 y 1953, el proyecto de ley siria sobre el estatuto personal (1947), su traslado a Arabia Saudita en 1963, sus programas de radio y televisión, y su muerte en Jeddah el 4 de Rabi' I de 1420 / 18 de junio de 1999; sus referencias incluyen sus propias Memorias y la biografía de su nieto Mujahid Dirani."
  fr: "Article de Wikipédia en arabe sur le juriste, écrivain et juge Ali al-Tantawi; ne contient que des informations sur sa personne: naissance à Damas le 23 Jumada I 1327 / 12 juin 1909, études à Maktab Anbar et en droit à Damas, vingt ans d’écriture dans al-Risala, son mandat de juge de 1941 à 1953, le projet de loi syrien sur le statut personnel (1947), son installation en Arabie saoudite en 1963, ses émissions de radio et de télévision, et sa mort à Djeddah le 4 Rabi' I 1420 / 18 juin 1999; ses références incluent ses propres Mémoires et la biographie de son petit-fils Mujahid Dirani."
  ur: "فقیہ، مصنف اور جج علی الطنطاوی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق: دمشق میں 23 جمادی الثانی 1327/12 جون 1909 کو پیدائش، مکتب الانبار میں اسکول کی تعلیم اور دمشق میں قانون، الرسالہ میں بیس سال کی تحریر، ان کی جج شپ 1941-1953، شام کے ذاتی حیثیت کے قانون کا مسودہ (1947)، سعودی عرب اور ٹیلی ویژن پر ان کا پروگرام، ra6 اور عربی میں اس کا پروگرام۔ جدہ میں 4 ربیع الثانی 1420/18 جون 1999 کو وفات پائی۔ اس کے حوالہ جات میں ان کی اپنی یادداشتیں اور ان کے پوتے مجاہد دیرانی کی سوانح عمری شامل ہے۔"
  tr: "hukukçu, yazar ve yargıç Ali Al-Tantawi hakkında Arapça Vikipedi makalesi; sadece varlığın olayları için: 23 Jumada al-Awwal 1327 Hicri / 12 Haziran 1909'da Şam'da Şam'da doğması, Şam'daki Anbar ve Haklar Ofisi'ndeki çalışmaları, yirmi yıl boyunca \"Al-Risalah\"da yazması, 1941-1953 yılları arasındaki yargı deneyimi, Suriye Kişisel Statü Yasası taslağı (1947), 1963'te Suudi Arabistan'a taşınması, radyo ve televizyon programları, 4 Rabi'al-Awwal 1420 Hicri / 18 Haziran 1999'da Cidde'de ölümü; referansları arasında \"Ali Al-Tantawi'nin Anıları\" ve torunu Mücahit Diraniyya'nın biyografisi yer alır."
  id: "Artikel Wikipedia Arab tentang ahli hukum, penulis, dan hakim Ali Al-Tantawi; hanya untuk peristiwa entitas tersebut: kelahirannya di Damaskus pada 23 Jumada al-Awwal 1327 AH / 12 Juni 1909, studinya di Kantor Hak Anbar dan Hak di Damaskus, tulisannya di \"Al-Risalah\" selama dua puluh tahun, pengalaman yudisial dari 1941 hingga 1953, rancangan Undang-Undang Status Pribadi Suriah (1947), kepindahannya ke Arab Saudi pada 1963, program radio dan televisinya, kematiannya di Jeddah pada 4 Rabi' al-Awwal 1420 AH / 18 Juni 1999; di antara referensinya adalah \"Kenangan Ali Al-Tantawi\" dan biografi cucunya Mujahid Diraniyya."
