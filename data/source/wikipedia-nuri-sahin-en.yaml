  ar: "مقالة ويكيبيديا الإنجليزية عن نوري شاهين؛ تُستخدم لوقائع الكيان فقط. تروي بدايته القياسية مع بوروسيا دورتموند كأصغر لاعب وهداف في تاريخ البوندسليغا، ولقب 2011، وانتقاله إلى ريال مدريد وعودته، ثم تدريبه أنطاليا سبور ودورتموند وباشاك شهير، و52 مباراة دولية مع تركيا."
  en: "English Wikipedia article on Nuri Şahin; used for entity facts only. It recounts his record-breaking start at Borussia Dortmund as the Bundesliga's youngest player and scorer, the 2011 title, his move to Real Madrid and return, his coaching of Antalyaspor, Dortmund and Başakşehir, and his 52 caps for Turkey."
