reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It gives his birth in 1216 — coherent with its statement that he ascended the throne in 1266 at the age of fifty — and his death on 13 January 1287; it records his capture by the Mongols as a boy, his sale to Khawaja Jamal-ud-din of Basra, his purchase by Iltutmish in 1232 and membership of the Forty, his vizierate under Nasiruddin Mahmud, and his kingship doctrine and court discipline. It describes his Basran master as a Sufi — the master's description, not an order named for Balban himself — and names no school for the sultan. Checked 1 November 2026."
