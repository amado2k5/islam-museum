summary:
  ar: "الموقع الرسمي لعبد الرحمن ذاكر الهاشمي (makany.co)، وهو موقع منهج «فقه النفس» ومركز مكاني؛ يذكر أن المركز يعنى بالصحة النفسية من منظور فقه النفس ويشرف عليه عبد الرحمن ذاكر الهاشمي، طبيب واستشاري العلاج التربوي والنفسي، وأن رحلة فقه النفس بدأت سنة 1417هـ/1997م."
  en: "The official website of Abdul Rahman Dhaker al-Hashemi (makany.co), home of the Fiqh al-Nafs curriculum and the Makani Center; it states that the center works on mental health from the Fiqh al-Nafs perspective and is supervised by Abdul Rahman Dhaker al-Hashemi, a physician and consultant in educational and psychological therapy, and that the Fiqh al-Nafs journey began in 1417 AH / 1997 CE."
  es: "El sitio web oficial de Abdul Rahman Dhaker al-Hashemi (makany.co), sede del programa de estudios Fiqh al-Nafs y del Centro Makani, indica que el centro trabaja en salud mental desde la perspectiva del Fiqh al-Nafs y está supervisado por Abdul Rahman Dhaker al-Hashemi, médico y consultor en terapia educativa y psicológica."
  fr: "Le site officiel d'Abdul Rahman Dhaker al-Hashemi (makany.co), qui abrite le programme d'études Fiqh al-Nafs et le centre Makani, indique que ce dernier travaille sur la santé mentale dans la perspective du Fiqh al-Nafs et est supervisé par Abdul Rahman Dhaker al-Hashemi, médecin et consultant en thérapie éducative et psychologique."
  ur: "عبدالرحمن ذاکر الہاشمی (makany.co) کی سرکاری ویب سائٹ، فقہ النفس نصاب اور مکانی مرکز کا گھر؛ اس میں کہا گیا ہے کہ یہ مرکز دماغی صحت پر فقہ النفس کے نقطہ نظر سے کام کرتا ہے اور اس کی نگرانی عبدالرحمٰن ذاکر الہاشمی کرتے ہیں، جو ایک طبیب اور تعلیمی اور نفسیاتی علاج کے مشیر ہیں، اور یہ کہ فقہ النفس کا سفر 1417 ہجری / 1997 عیسوی میں شروع ہوا تھا۔"
  tr: "Abdulrahman Zakir Al-Haşimi'nin (makany.co) resmi web sitesi, 'Fiqh al-Nefs' müfredatı ve Makani Merkezi için bir sitedir; merkezin psikoloji perspektifinden ruh sağlığına odaklandığı, eğitim ve psikolojik terapi alanında hekim ve danışman Abdulrahman Zakir al-Hashimi tarafından denetlendiği, psikoloji yolculuğunun ise 1417 Hicri / 1997 M.S. yılında başladığı belirtilmelidir."
  id: "Situs resmi Abdulrahman Zakir Al-Hashimi (makany.co), yang merupakan situs kurikulum 'Fiqh al-Nafs' dan Pusat Makani; perlu disebutkan bahwa pusat ini berfokus pada kesehatan mental dari perspektif psikologi dan diawasi oleh Abdulrahman Zakir al-Hashimi, seorang dokter dan konsultan terapi pendidikan dan psikologis, serta perjalanan psikologi dimulai pada tahun 1417 H / 1997 M."
