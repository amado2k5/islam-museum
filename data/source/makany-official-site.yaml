reliability_note: "The person's own website: a primary source for his self-presented work, not independent corroboration (founder's sourcing ladder, 24 Oct 2026). Read in full on 26 October 2026. It describes Fiqh al-Nafs as a curriculum for understanding the human soul, built on reason, revelation and observation, taught in three successive stages of sessions (Iqra', Nafs, Lita'arafu) held yearly from Ramadan to Ramadan at the Makani Center and broadcast online, with the 'Ma'a Nafsi' programme as the recommended public starting point; it describes the Makani Center's services (educational sessions, a permanent youth club, counselling sessions) and names its supervisor. The site publishes no birth date, no birthplace and no school or madhhab for him."
