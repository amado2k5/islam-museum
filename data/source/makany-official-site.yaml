summary:
  ar: "الموقع الرسمي لعبد الرحمن ذاكر الهاشمي (makany.co)، وهو موقع منهج «فقه النفس» ومركز مكاني؛ يذكر أن المركز يعنى بالصحة النفسية من منظور فقه النفس ويشرف عليه عبد الرحمن ذاكر الهاشمي، طبيب واستشاري العلاج التربوي والنفسي، وأن رحلة فقه النفس بدأت سنة 1417هـ/1997م."
  en: "The official website of Abdul Rahman Dhaker al-Hashemi (makany.co), home of the Fiqh al-Nafs curriculum and the Makani Center; it states that the center works on mental health from the Fiqh al-Nafs perspective and is supervised by Abdul Rahman Dhaker al-Hashemi, a physician and consultant in educational and psychological therapy, and that the Fiqh al-Nafs journey began in 1417 AH / 1997 CE."
