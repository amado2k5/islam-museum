summary:
  ar: "مقالة ريتشارد لورش في Centaurus ⁦(20, 1976)⁩ التي وصفت فيها التوركيتوم بأنه جمع بين «أسطرلابون» بطلميوس والأسطرلاب المستوي، وحكمت على آلة جابر الموصوفة بأنها ملهمة للنوع لا مطابقة له."
  en: "Richard Lorch's Centaurus paper (vol. 20, 1976) characterising the torquetum as a combination of Ptolemy's astrolabon and the plane astrolabe, and judging Jabir's described instrument a similar inspiration rather than an identified torquetum."
  ur: "رچرڈ لورش کی Centaurus مقالہ ⁦(جلد 20، 1976)⁩ جس نے تورکیتوم کو بطلموس کے اسطرلابون اور مستوی اسطرلاب کا مجموعہ قرار دیا اور جابر کے بیان کردہ آلہ کو مشابہ اخذ مانا نہ کہ مخصوص تورکیتوم۔"
  es: "El artículo de Richard Lorch en Centaurus (vol. 20, 1976) caracteriza el torquetum como una combinación del astrolabio de Ptolomeo y el astrolabio plano, y considera que el instrumento descrito por Jabir es una inspiración similar en lugar de un torquetum identificado."
  fr: "L'article de Richard Lorch sur Centaurus (vol. 20, 1976) caractérise le torquetum comme une combinaison de l'astrolabon de Ptolémée et de l'astrolabe plan, et juge l'instrument décrit par Jabir comme une inspiration similaire plutôt qu'un torquetum identifié."
  tr: "Richard Lorsch'un Centaurus'taki (20, 1976) makalesi, torketumu Ptolemaios'un 'astrolabı' ile düzlem astrolabını birleştiren bir şekilde tanımlamış ve Jabeur'un tanımladığı aleti cinsten ilham alan ve eşsiz olarak değerlendirmiştir."
  id: "Artikel Richard Lorsch di Centaurus (20, 1976) menggambarkan torketum sebagai menggabungkan 'astrolabe' Ptolemy dengan astrolabe bidang, dan menilai instrumen yang digambarkan Jabeur sebagai terinspirasi genus dan tak tertandingi."
title: "The Astronomical Instruments of Jabir ibn Aflah and the Torquetum"
