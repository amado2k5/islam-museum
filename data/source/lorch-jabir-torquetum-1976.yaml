summary:
  ar: "مقالة ريتشارد لورش في Centaurus ⁦(20, 1976)⁩ التي وصفت فيها التوركيتوم بأنه جمع بين «أسطرلابون» بطلميوس والأسطرلاب المستوي، وحكمت على آلة جابر الموصوفة بأنها ملهمة للنوع لا مطابقة له."
  en: "Richard Lorch's Centaurus paper (vol. 20, 1976) characterising the torquetum as a combination of Ptolemy's astrolabon and the plane astrolabe, and judging Jabir's described instrument a similar inspiration rather than an identified torquetum."
  ur: "رچرڈ لورش کی Centaurus مقالہ ⁦(جلد 20، 1976)⁩ جس نے تورکیتوم کو بطلموس کے اسطرلابون اور مستوی اسطرلاب کا مجموعہ قرار دیا اور جابر کے بیان کردہ آلہ کو مشابہ اخذ مانا نہ کہ مخصوص تورکیتوم۔"
