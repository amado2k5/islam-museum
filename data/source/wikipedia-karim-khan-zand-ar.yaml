reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). A short article: it gives his life in Hijri as 1119 AH to 13 Safar 1193 AH alongside c. 1705 — its pairing of 1119 AH with 1705 is inconsistent, since 1119 AH falls in 1707–1708, and its Gregorian death year is misprinted 1709 for 1779 — calls him founder of the Zand state ruling from Shiraz from 1750 to 1779 under the title Vakil al-Ra'aya, and treats his Gulf relations with the Busaidi imam and the Qawasim. It names no religion or legal school for him. Checked 1 November 2026."
