summary:
  ar: "مقالة ويكيبيديا العربية عن هاشم الأتاسي؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته السياسية كاملة، وتذكر اسمه الكامل ولقبه «أبو الجمهورية»، وتقرن حياته بعامي 1290–1380 هـ."
  en: "Arabic Wikipedia article on Hashim al-Atassi; used for entity facts only. It recounts his full political career, gives his full name and his nickname Abu al-Jumhuriyya, and pairs his life with the years 1290–1380 AH."
  es: "Artículo de Wikipedia en árabe sobre Hashim al-Atassi; se utiliza únicamente para obtener información sobre la persona. Relata toda su trayectoria política, proporciona su nombre completo y su apodo Abu al-Jumhuriyya, y sitúa su vida entre los años 1290 y 1380 de la Hégira."
  fr: "Article de Wikipédia en arabe sur Hashim al-Atassi; utilisé uniquement à des fins d’information sur l’entité. Il retrace son parcours politique complet, donne son nom complet et son surnom, Abu al-Jumhuriyya, et situe sa vie entre 1290 et 1380 de l’Hégire."
  ur: "ہاشم العطاسی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کے مکمل سیاسی کیرئیر کا ذکر کیا گیا ہے، ان کا پورا نام اور اس کا عرفی نام ابو الجمہریہ بتایا گیا ہے، اور ان کی زندگی کو 1290-1380 ہجری کے ساتھ جوڑا گیا ہے۔"
  tr: "Haşim el-Atassi hakkında Arapça Vikipedi makalesi yalnızca varlığın gerçekleri için kullanılır. Tüm siyasi kariyerini anlatır, tam adı ve unvanı 'Cumhuriyetin Babası' olarak anılar ve hayatını 1290–1380 H yıllarına bağlar."
  id: "Artikel Wikipedia berbahasa Arab tentang Hashim al-Atassi hanya digunakan untuk fakta-fakta entitas tersebut. Artikel ini menceritakan seluruh karier politiknya, menyebutkan nama lengkap dan gelar 'Bapak Republik,' serta mengaitkan kehidupannya dengan tahun 1290–1380 H."
