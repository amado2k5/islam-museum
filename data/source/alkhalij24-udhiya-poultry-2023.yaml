label: { ar: "فتوى أضحية الدواجن في «الحكاية» — الخليج 24 ⁦(يونيو 2023)⁩", en: "The poultry-sacrifice opinion on Al-Hekaya — alkhalij24 (June 2023)" }
summary:
  ar: "تغطية موقع الخليج 24 وأخبار مصر لمداخلة سعد الدين الهلالي في برنامج «الحكاية» في يونيو 2023، أجاز فيها الأضحية بالدواجن لمن لا يقدر على الأضحية بالماشية مستندًا إلى ابن حزم."
  en: "alkhalij24 and Akhbar Masr coverage of Saad El-Din El-Hilali's June 2023 phone-in on Al-Hekaya, in which he permitted sacrificing poultry for those unable to afford livestock, citing Ibn Hazm."
  es: "Cobertura de alkhalij24 y Akhbar Masr sobre la intervención telefónica de Saad El-Din El-Hilali en Al-Hekaya en junio de 2023, en la que permitió el sacrificio de aves de corral para aquellos que no pueden permitirse tener ganado, citando a Ibn Hazm."
  fr: "alkhalij24 et Akhbar Masr ont couvert l'intervention téléphonique de Saad El-Din El-Hilali en juin 2023 sur Al-Hekaya, dans laquelle il autorisait le sacrifice de volailles pour ceux qui n'avaient pas les moyens d'acheter du bétail, citant Ibn Hazm."
  ur: "alkhalij24 اور Akhbar Masr کی کوریج سعد الدین ہلالی کے جون 2023 میں الحکیہ پر فون ان کی، جس میں انہوں نے ابن حزم کا حوالہ دیتے ہوئے، مویشیوں کی استطاعت نہ رکھنے والوں کے لیے مرغی کی قربانی کی اجازت دی۔"
