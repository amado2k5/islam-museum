summary:
  ar: "تحليل أكاديمي في مجلة «ذا ريفيلر» لظاهرة الدعاة الجدد على يوتيوب، يدرس حالة عمران بن منصور «رجل الدعوة» ومناظرته حول المولد سنة 2016، ويصفه بأنه مبشّر سلفي على يوتيوب وُلد سنة 1990 ومقيم في لندن."
  en: "An academic analysis in The Revealer of the new YouTube preaching phenomenon, studying Imran ibn Mansur (Dawah Man) and his 2016 Mawlid video debate; it describes him as a Salafi YouTube evangelizer born in 1990 and based in London."
  es: "Un análisis académico publicado en The Revealer sobre el nuevo fenómeno de la predicación en YouTube, que estudia a Imran ibn Mansur (Dawah Man) y su debate en vídeo de Mawlid de 2016, lo describe como un evangelizador salafista de YouTube nacido en 1990 y residente en Londres."
  fr: "Une analyse académique publiée dans The Revealer sur le nouveau phénomène de prédication sur YouTube, étudiant Imran ibn Mansur (Dawah Man) et son débat vidéo du Mawlid de 2016; elle le décrit comme un évangéliste salafiste sur YouTube né en 1990 et basé à Londres."
  ur: "The Revealer of the new YouTube تبلیغی رجحان میں ایک علمی تجزیہ، عمران بن منصور (Dawah Man) اور اس کے 2016 کے میلاد ویڈیو مباحثے کا مطالعہ؛ اس میں اسے 1990 میں پیدا ہونے والے اور لندن میں مقیم سلفی یوٹیوب مبشر کے طور پر بیان کیا گیا ہے۔"
  tr: "The Reveler dergisinde YouTube'daki yeni vaizler olgusunu ele alan akademik bir analiz, \"Da'wah adamı\" İmran bin Mansour'un 2016'daki doğumuyla ilgili tartışmasını inceliyor; kendisi 1990 doğumlu ve Londra'da yaşayan bir Selefi vaizi olarak tanımlıyor."
  id: "Analisis akademis di majalah The Reveler tentang fenomena pengkhotbah baru di YouTube mempelajari kasus Imran bin Mansour, \"Da'wah man,\" dan debatnya tentang kelahiran pada tahun 2016, menggambarkannya sebagai pengkhotbah Salafi di YouTube yang lahir tahun 1990 dan tinggal di London."
title: "Digital Islam and the New Sheikhs"
