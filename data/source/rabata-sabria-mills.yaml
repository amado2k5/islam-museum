summary:
  ar: "سيرة سابريا ميلز في صفحة مجلس إدارة منظمة «رابطة» (Rabata): معالجة سلوكية ومدربة ومتحدثة متخصصة في تجاوز ألم الفراق والأنماط السلوكية السلبية، حاصلة على الماجستير في القيادة التربوية والسلوك البشري من جامعة جورجيا الجنوبية، والرئيسة التنفيذية لشركة بودكاست «المرأة المسلمة المتميزة»، وقد تتلمذت سنوات على علماء من المدرستين المالكية والشافعية، وهي عضو مجلس إدارة رابطة."
  en: "Sabria Mills's biography on the Rabata board of directors page: a behavioral therapist, coach and public speaker specializing in heartbreak and negative behavioral patterns, with a master's degree in Educational Leadership and Human Behavior from Georgia Southern University, CEO of The DOPE Muslim Woman Podcast LLC, several years of study under scholars of the Maliki and Shafi'i schools, and a Rabata board member."
  es: "La biografía de Sabria Mills en la página de la junta directiva de Rabata la describe como terapeuta conductual, coach y oradora especializada en desamor y patrones de comportamiento negativos, con una maestría en Liderazgo Educativo y Comportamiento Humano de la Universidad Georgia Southern, directora ejecutiva de The DOPE Muslim Woman Podcast LLC, varios años de estudio con académicos de las escuelas Maliki y Shafi'i, y miembro de la junta directiva de Rabata."
  fr: "Biographie de Sabria Mills sur la page du conseil d'administration de Rabata: thérapeute comportementale, coach et conférencière spécialisée dans le chagrin d'amour et les schémas comportementaux négatifs, titulaire d'une maîtrise en leadership éducatif et comportement humain de l'université Georgia Southern, PDG de The DOPE Muslim Woman Podcast LLC, plusieurs années d'études auprès d'érudits des écoles Maliki et Shafi'i, et membre du conseil d'administration de Rabata."
  ur: "رباتا بورڈ آف ڈائریکٹرز کے صفحے پر صابریا ملز کی سوانح حیات: ایک رویے کی معالج، کوچ اور عوامی اسپیکر جو دل کو توڑنے اور منفی رویے کے نمونوں میں مہارت رکھتی ہے، جارجیا سدرن یونیورسٹی سے تعلیمی قیادت اور انسانی رویے میں ماسٹر ڈگری کے ساتھ، دی DOPE مسلم وومن پوڈکاسٹ ایل ایل سی کے سی ای او، شابا کے اسکولوں اور شابا بورڈ کے کئی سالوں سے اسکالر ہیں۔ رکن"
