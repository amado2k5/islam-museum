summary:
  ar: "سيرة سابريا ميلز في صفحة مجلس إدارة منظمة «رابطة» (Rabata): معالجة سلوكية ومدربة ومتحدثة متخصصة في تجاوز ألم الفراق والأنماط السلوكية السلبية، حاصلة على الماجستير في القيادة التربوية والسلوك البشري من جامعة جورجيا الجنوبية، والرئيسة التنفيذية لشركة بودكاست «المرأة المسلمة المتميزة»، وقد تتلمذت سنوات على علماء من المدرستين المالكية والشافعية، وهي عضو مجلس إدارة رابطة."
  en: "Sabria Mills's biography on the Rabata board of directors page: a behavioral therapist, coach and public speaker specializing in heartbreak and negative behavioral patterns, with a master's degree in Educational Leadership and Human Behavior from Georgia Southern University, CEO of The DOPE Muslim Woman Podcast LLC, several years of study under scholars of the Maliki and Shafi'i schools, and a Rabata board member."
