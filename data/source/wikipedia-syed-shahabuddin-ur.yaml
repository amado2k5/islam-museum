summary:
  ar: "مقال موسوعي بالأردية عن سيد شهاب الدين (1935–2017)، يوافق المقال الإنجليزي في التاريخين ويذكر الوفاة في نويدا."
  en: "Community-edited encyclopedia article in Urdu, retrieved in full at the stated revision; it agrees on the 4 November 1935 birth and 4 March 2017 death but places the death at Noida, preserved as a variant in the record."
  es: "Artículo de enciclopedia editado por la comunidad en urdu, recuperado íntegramente en la revisión indicada; coincide en la fecha de nacimiento del 4 de noviembre de 1935 y la de fallecimiento del 4 de marzo de 2017, pero sitúa el fallecimiento en Noida, conservado como una variante en el registro."
  fr: "Article encyclopédique édité par la communauté en ourdou, récupéré intégralement à la version indiquée; il s’accorde sur la naissance le 4 novembre 1935 et le décès le 4 mars 2017, mais situe le décès à Noida, conservé comme variante dans l’enregistrement."
  ur: "اردو میں کمیونٹی ایڈیٹ شدہ انسائیکلوپیڈیا مضمون، بیان کردہ نظر ثانی پر مکمل طور پر بازیافت کیا گیا؛ یہ 4 نومبر 1935 کی پیدائش اور 4 مارچ 2017 کی موت پر متفق ہے لیکن موت کو نوئیڈا میں رکھتا ہے، جو کہ ریکارڈ میں ایک قسم کے طور پر محفوظ ہے۔"
  tr: "Syed Shihabuddin (1935–2017) hakkında Urduca ansiklopedik bir makale, İngilizce makaleyle her iki tarihte de eşleşiyor ve Noida'daki ölümünden bahsediyor."
  id: "Sebuah artikel ensiklopedis dalam bahasa Urdu tentang Syed Shihabuddin (1935–2017), yang mencocokkan artikel bahasa Inggris pada kedua tanggal tersebut dan menyebutkan kematiannya di Noida."
