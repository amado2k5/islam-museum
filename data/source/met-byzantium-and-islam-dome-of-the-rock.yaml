summary:
  ar: "الصفحة «Where in the World: Dome of the Rock» — The Metropolitan Museum of Art, Byzantium and Islam blog; لخّصها ملخص بحثي قدّمه المؤسس إلى المتحف في 21 نوفمبر 2026؛ لم يفتح المتحف الصفحة، ووافق المؤسس على استعمال الملخص دون إعادة تحقق. استُعملت في: نقش قبة الصخرة سنة 72هـ: موضعه ومضمونه."
  en: "The page «Where in the World: Dome of the Rock» — The Metropolitan Museum of Art, Byzantium and Islam blog; summarised in a research file supplied to the museum by the founder on 21 November 2026; the museum did not open the page, and the founder approved using the summary without re-verification. Used for: the Dome of the Rock inscription of 72 AH: its place and content."
  ur: "صفحہ «Where in the World: Dome of the Rock» — The Metropolitan Museum of Art, Byzantium and Islam blog; اسے ایک تحقیقی فائل نے خلاصہ کیا جو بانی نے 21 نومبر 2026 کو میوزیم کو دی؛ میوزیم نے صفحہ نہیں کھولا اور بانی نے دوبارہ جانچ کے بغیر خلاصہ استعمال کرنے کی منظوری دی۔ استعمال: 72ھ کا قبۃ الصخرہ کا کتبہ: اس کا مقام اور مضمون۔"
  fr: "La page «Where in the World: Dome of the Rock» — The Metropolitan Museum of Art, Byzantium and Islam blog; résumée dans un fichier de recherche remis au musée par le fondateur le 21 novembre 2026 ; le musée n'a pas ouvert la page, et le fondateur a approuvé l'usage de la synthèse sans nouvelle vérification. Utilisée pour : l'inscription du Dôme du Rocher de 72 H : son lieu et son contenu."
  es: "La página «Where in the World: Dome of the Rock» — The Metropolitan Museum of Art, Byzantium and Islam blog; resumida en un archivo de investigación entregado al museo por el fundador el 21 de noviembre de 2026; el museo no abrió la página, y el fundador aprobó usar el resumen sin volver a verificar. Usada para: la inscripción de la Cúpula de la Roca del año 72 AH: su lugar y su contenido."
  tr: "«Dünyanın Nereleri: Kaya Kubbesi» sayfası — Metropolitan Sanat, Bizans ve İslam Müzesi blogu; Kurucu tarafından 21 Kasım 2026'da müzeye sunulan bir araştırma özetiyle özetlenmiştir; müze sayfayı açmamış ve kurucu özeti yeniden doğrulama yapmadan kullanmayı kabul etmiştir. Kullanıldığı yer: 72 Hicri Kaya Kubbesi yazıtı: konumu ve içeriği."
  id: "Halaman «Di Mana di Dunia: Kubah Batu» — Museum Seni Metropolitan, blog Bizantium dan Islam; Ringkasan ini dirangkum oleh ringkasan penelitian yang diajukan oleh pendiri ke museum pada 21 November 2026; museum tidak membuka halaman tersebut, dan pendiri setuju menggunakan abstrak tanpa verifikasi ulang. Digunakan dalam: Prasasti Kubah Batu tahun 72 H: lokasi dan isinya."
