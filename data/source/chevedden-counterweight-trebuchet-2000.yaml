label: { ar: "شيفدن، اختراع المنجنيق ذي الثقل الموازن ⁦(2000)⁩", en: "Chevedden, The Invention of the Counterweight Trebuchet ⁦(2000)⁩", ur: "چیوڈن، وزنی منجنیق کی ایجاد ⁦(2000)⁩" }
summary:
  ar: "دراسة في انتشار المنجنيق ذي الثقل الموازن عبر الحضارات، يدافع فيها عن أصلٍ في العالم الإسلامي ويصف دور مهندسي صلاح الدين، مقابل مواقف ترجّح أوروبا اللاتينية."
  en: "A study of the counterweight trebuchet's diffusion across civilisations, arguing a western Islamic origin and describing the role of Saladin's engineers, against positions favouring Latin Europe."
  ur: "وزنی منجنیق کے تہذیبی انتشار پر تحقیق، جس میں مغربی عالمِ اسلام کی اصلیت کا دفاع اور صلاح الدین کے انجینئروں کا کردار بیان ہوا ہے، لاطینی یورپ کو ترجیح دینے والی رائے کے مقابل۔"
  es: "Un estudio sobre la difusión del trabuquete de contrapeso a través de las civilizaciones, que defiende un origen islámico occidental y describe el papel de los ingenieros de Saladino, en contraposición a las posturas que favorecen a la Europa latina."
  fr: "Une étude de la diffusion du trébuchet à contrepoids à travers les civilisations, défendant une origine islamique occidentale et décrivant le rôle des ingénieurs de Saladin, contre les positions favorisant l'Europe latine."
  tr: "Dengeleme ağırlık mancınıkının medeniyetler arasında yayılmasını inceleyen bir çalışma, İslam dünyasındaki kökenini savunuyor ve Selahaddin'in mühendislerinin rolünü Latin Avrupa'yı destekleyen pozisyonlara kıyasla tanımlıyor."
  id: "Sebuah studi tentang penyebaran pelontar bobot penyeimbang di berbagai peradaban, membela asal-usul di dunia Islam dan menggambarkan peran para insinyur Saladin, berbeda dengan posisi yang lebih menguntungkan Eropa Latin."
title: "The Invention of the Counterweight Trebuchet: A Study in Cultural Diffusion"
