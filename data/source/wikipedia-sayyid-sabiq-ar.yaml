summary:
  ar: "مقالة ويكيبيديا العربية عن الفقيه السيد سابق؛ لوقائع الكيان فقط: مولده في إسطنها بالمنوفية في يناير 1915، وتخرجه في كلية الشريعة بالأزهر، وكتابه «فقه السنة»، ومحاكمته في قضية مقتل النقراشي وتبرئته، واعتقاله في 1949، وعمله في وزارة الأوقاف وجامعة أم القرى، وجائزة الملك فيصل في 1414هـ، ووفاته في 23 ذي القعدة 1420هـ / 27 فبراير 2000."
  en: "Arabic Wikipedia article on the jurist Sayyid Sabiq; entity facts only: birth at Istanha, Monufia, in January 1915, graduation from al-Azhar's Faculty of Sharia, his book Fiqh al-Sunna, his trial in the Nuqrashi assassination case and acquittal, his 1949 detention, his posts at the Ministry of Awqaf and Umm al-Qura University, the King Faisal Prize in 1414 AH, and death on 23 Dhu al-Qa'da 1420 / 27 February 2000."
  es: "Artículo en la Wikipedia en árabe sobre el jurista Sayyid Sabiq; solo datos biográficos: nacimiento en Istanha, Monufia, en enero de 1915, graduación de la Facultad de Sharia de al-Azhar, su libro Fiqh al-Sunna, su juicio en el caso del asesinato de Nuqrashi y su absolución, su detención en 1949, sus cargos en el Ministerio de Awqaf y la Universidad Umm al-Qura, el Premio Rey Faisal en 1414 AH y su muerte el 23 de Dhu al-Qa'da de 1420 / 27 de febrero de 2000."
  fr: "Article de Wikipédia en arabe sur le juriste Sayyid Sabiq; faits concernant uniquement l’entité: naissance à Istanha, Monufia, en janvier 1915, diplôme de la faculté de charia d’al-Azhar, son livre Fiqh al-Sunna, son procès dans l’affaire de l’assassinat de Nuqrashi et son acquittement, sa détention en 1949, ses postes au ministère des Awqaf et à l’université Umm al-Qura, le prix du roi Faisal en 1414 AH et sa mort le 23 Dhu al-Qa'da 1420 / 27 février 2000."
  ur: "فقیہ سید صابق پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق: استنھا، مونوفیہ میں جنوری 1915 میں پیدائش، الازہر کی فیکلٹی آف شریعہ سے گریجویشن، اس کی کتاب فقہ السنۃ، نقرشی قتل کیس میں ان کا مقدمہ اور بری ہونا، ان کی 1949 میں نظربندی، وزارت اوقاف میں ان کی پوسٹس اور یونیورسٹی آف اوقاف میں۔ 1414ھ، اور وفات 23 ذی القعدہ 1420/27 فروری 2000ء کو ہوئی۔"
