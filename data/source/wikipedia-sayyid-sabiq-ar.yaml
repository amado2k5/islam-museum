summary:
  ar: "مقالة ويكيبيديا العربية عن الفقيه السيد سابق؛ لوقائع الكيان فقط: مولده في إسطنها بالمنوفية في يناير 1915، وتخرجه في كلية الشريعة بالأزهر، وكتابه «فقه السنة»، ومحاكمته في قضية مقتل النقراشي وتبرئته، واعتقاله في 1949، وعمله في وزارة الأوقاف وجامعة أم القرى، وجائزة الملك فيصل في 1414هـ، ووفاته في 23 ذي القعدة 1420هـ / 27 فبراير 2000."
  en: "Arabic Wikipedia article on the jurist Sayyid Sabiq; entity facts only: birth at Istanha, Monufia, in January 1915, graduation from al-Azhar's Faculty of Sharia, his book Fiqh al-Sunna, his trial in the Nuqrashi assassination case and acquittal, his 1949 detention, his posts at the Ministry of Awqaf and Umm al-Qura University, the King Faisal Prize in 1414 AH, and death on 23 Dhu al-Qa'da 1420 / 27 February 2000."
