summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن صهيب ويب: مولده في أوكلاهوما باسم ويليام ويب، واعتناقه الإسلام سنة 1992، ودراسته الشريعة في الأزهر، وإمامته في بوسطن، وتأسيسه معهدًا لتدريس العلوم الشرعية."
  en: "The English Wikipedia article on Suhaib Webb: his birth in Oklahoma as William Webb, his conversion to Islam in 1992, his study of Islamic law at al-Azhar, his imamate in Boston, and the institute he founded for the Islamic sciences."
  es: "El artículo de la Wikipedia en inglés sobre Suhaib Webb: su nacimiento en Oklahoma como William Webb, su conversión al Islam en 1992, sus estudios de derecho islámico en al-Azhar, su imamato en Boston y el instituto que fundó para las ciencias islámicas."
  fr: "L'article de Wikipédia en anglais sur Suhaib Webb: sa naissance en Oklahoma sous le nom de William Webb, sa conversion à l'islam en 1992, ses études de droit islamique à al-Azhar, son imamat à Boston et l'institut qu'il a fondé pour les sciences islamiques."
  ur: "صہیب ویب پر انگریزی ویکیپیڈیا کا مضمون: ولیم ویب کے طور پر اوکلاہوما میں ان کی پیدائش، 1992 میں اسلام قبول کرنا، الازہر میں اسلامی قانون کا مطالعہ، بوسٹن میں ان کی امامت، اور اسلامی علوم کے لیے ان کی قائم کردہ انسٹی ٹیوٹ۔"
  tr: "Suhaib Webb hakkında İngilizce Wikipedia makalesi: Oklahoma'da William Webb olarak doğdu, 1992'de İslam'a geçti, El-Ezher'de Şeriat eğitimi aldı, Boston'da namaz kıldı ve İslami bilimleri öğretmek için bir enstitü kurdu."
  id: "Artikel Wikipedia bahasa Inggris tentang Suhaib Webb: lahir di Oklahoma dengan nama William Webb, memeluk Islam pada tahun 1992, belajar Syariah di Al-Azhar, memimpin shalat di Boston, dan mendirikan sebuah institut untuk mengajarkan ilmu Islam."
