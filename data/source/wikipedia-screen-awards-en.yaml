summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن جوائز سكرين الهندية؛ لوقائع الكيان فقط: إطلاقها سنة 1995 من مجلة سكرين التابعة لمجموعة إنديان إكسبرس، واختيار الفائزين من أهل الصناعة، واستحواذ ستار إنديا على المجلة سنة 2015، والفئات، وآخر دورة في 8 ديسمبر 2019؛ تستند إلى إنديا توداي وإنديان إكسبرس."
  en: "English Wikipedia article on India's Screen Awards; entity facts only: their launch in 1995 by Screen magazine of the Indian Express Group, winners chosen by industry insiders, Star India's acquisition of the magazine in 2015, the categories and the last ceremony on 8 December 2019; it cites India Today and The Indian Express."
  es: "Artículo de la Wikipedia en inglés sobre los premios Screen Awards de la India; solo datos sobre la entidad: su lanzamiento en 1995 por la revista Screen del grupo Indian Express, los ganadores elegidos por expertos de la industria, la adquisición de la revista por Star India en 2015, las categorías y la última ceremonia el 8 de diciembre de 2019; cita a India Today y The Indian Express."
  fr: "Article de Wikipédia en anglais sur les Screen Awards indiens; informations sur l’entité uniquement: leur lancement en 1995 par le magazine Screen du groupe Indian Express, les lauréats choisis par des professionnels du secteur, l’acquisition du magazine par Star India en 2015, les catégories et la dernière cérémonie le 8 décembre 2019; il cite India Today et The Indian Express."
  ur: "ہندوستان کے اسکرین ایوارڈز پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق: انڈین ایکسپریس گروپ کے اسکرین میگزین کے ذریعہ 1995 میں ان کا آغاز، صنعت کے اندرونی ذرائع کے ذریعہ منتخب کردہ فاتحین، 2015 میں اسٹار انڈیا کا میگزین کا حصول، زمرے اور آخری تقریب 8 دسمبر 2019 کو؛ اس نے انڈیا ٹوڈے اور دی انڈین ایکسپریس کا حوالہ دیا ہے۔"
