summary:
  ar: "مقال موسوعي بالكشميرية عن محمود گامي ⁦(ت 1855)⁩، يصفه في مطلعه بأنه شاعر صوفي من القرن الثامن عشر، ويذكر مولده في أروور قرب شاه آباد ووفاته سنة 1855 ودفنه هناك، وأن سلسلة شعراء الصوفية في كشمير بدأت به."
  en: "Kashmiri encyclopedia biography of Mahmud Gami (d. 1855), styling him in its lead an eighteenth-century Sufi poet, placing his birth at Aroora near Shahabad in the later 1700s, and stating his death in 1855 and burial there; it dates the start of Kashmir’s line of Sufi poets from him."
  es: "La biografía enciclopédica de Mahmud Gami (nacido en 1855), que figura en su introducción como un poeta sufí del siglo XVIII, sitúa su nacimiento en Aroora, cerca de Shahabad, a finales del siglo XVIII; data el inicio de la tradición de poetas sufíes de Cachemira a partir de él."
  fr: "L'encyclopédie kashmiri présente la biographie de Mahmud Gami (né en 1855), le décrivant en introduction comme un poète soufi du XVIIIe siècle, situant sa naissance à Aroora près de Shahabad à la fin des années 1700; elle fait remonter à lui le début de la lignée des poètes soufis du Cachemire."
  ur: "محمود گامی کی کشمیری انسائیکلوپیڈیا سوانح عمری ⁦(پیدائش 1855)⁩، اسے اٹھارویں صدی کے صوفی شاعر کے طور پر پیش کرتے ہوئے، 1700 کی دہائی کے آخر میں شاہ آباد کے قریب اروڑہ میں ان کی پیدائش ہوئی۔ اس سے کشمیر کے صوفی شاعروں کی سطر کا آغاز ہوتا ہے۔"
