reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026; the recorded revision was fetched by its revision id and a second query returned the same revision id. Its infobox and lead give his birth as 10 February 1960, marked citation-needed in the article; the Arabic article and Wikidata give 5 September 1960, and the record carries the September date as debated for that reason. Its text quotes him saying he was born in Kabul in the house where he resides, and describes a Pashtun father from Kandahar and a Tajik mother from Panjshir — family background, not a faith attestation."
