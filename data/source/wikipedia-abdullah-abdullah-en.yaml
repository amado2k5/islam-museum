summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الله عبد الله؛ تُستخدم لوقائع الكيان فقط. تروي مولده في حي كارته بروان بكابل، وعمله طبيب عيون، ومسيرته وزيرا للخارجية (2001-2005) ورئيسا تنفيذيا لأفغانستان (2014-2020) ورئيسا للمجلس الأعلى للمصالحة الوطنية (2020-2021)، وترشحه للرئاسة ثلاث مرات. لا تحمل خانة للديانة ولا يسمي نصها ديانته."
  en: "English Wikipedia article on Abdullah Abdullah; used for entity facts only. It recounts his birth in the Karte Parwan district of Kabul, his work as an ophthalmologist, and his career as foreign minister (2001–2005), Chief Executive of Afghanistan (2014–2020) and chairman of the High Council for National Reconciliation (2020–2021), with three presidential candidacies. It carries no religion field and its text does not name his religion."
  es: "Artículo de la Wikipedia en inglés sobre Abdullah Abdullah; utilizado únicamente para datos sobre la persona. Relata su nacimiento en el distrito de Karte Parwan, en Kabul, su trabajo como oftalmólogo y su trayectoria como ministro de Asuntos Exteriores (2001-2005), jefe del Ejecutivo de Afganistán (2014-2020) y presidente del Alto Consejo para la Reconciliación Nacional (2020-2021), además de tres candidaturas presidenciales. No incluye información sobre su religión y su texto no la menciona."
  fr: "Article de Wikipédia en anglais consacré à Abdullah Abdullah; utilisé uniquement à des fins d'information sur l'entité. Il relate sa naissance dans le quartier de Karte Parwan à Kaboul, son travail d'ophtalmologue et sa carrière: ministre des Affaires étrangères (2001-2005), chef de l'exécutif afghan (2014-2020) et président du Haut Conseil pour la réconciliation nationale (2020-2021), ainsi que ses trois candidatures à la présidence. L'article ne comporte pas de champ relatif à la religion et son texte ne mentionne pas sa religion."
  ur: "عبداللہ عبداللہ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں کابل کے کارتے پروان ضلع میں ان کی پیدائش، ایک ماہر امراض چشم کے طور پر ان کے کام، اور وزیر خارجہ (2001–2005)، افغانستان کے چیف ایگزیکٹو (2014–2020) اور قومی مفاہمت کی ہائی کونسل (2020–2021) کے چیئرمین کے طور پر تین صدارتی امیدواروں کے ساتھ ان کی پیدائش کا ذکر ہے۔ اس کا کوئی مذہب نہیں ہے اور اس کا متن اس کے مذہب کا نام نہیں رکھتا ہے۔"
  tr: "Abdullah Abdullah hakkında İngilizce Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılmıştır. Makale, Kabil'in Karte Browan semtindeki doğumunu, göz doktoru olarak çalışmalarını, Dışişleri Bakanı olarak (2001-2005), Afganistan Genel Müdürü (2014-2020) ve Ulusal Uzlaşma Yüksek Konseyi Başkanı (2020-2021) olarak kariyerini ve üç kez cumhurbaşkanlığı adaylığını anlatır. Din kategorisi taşımaz, metninde dini adı geçmez."
  id: "Artikel Wikipedia berbahasa Inggris tentang Abdullah Abdullah hanya digunakan untuk fakta entitas tersebut. Artikel ini menceritakan kelahirannya di lingkungan Karte Browan, Kabul, pekerjaannya sebagai dokter mata, kariernya sebagai Menteri Luar Negeri (2001-2005), sebagai Kepala Eksekutif Afghanistan (2014-2020), dan sebagai Ketua Dewan Tertinggi untuk Rekonsiliasi Nasional (2020-2021), serta pencalonannya sebagai presiden sebanyak tiga kali. Artikel ini tidak memuat kategori agama, dan teksnya juga tidak menyebut agamanya."
