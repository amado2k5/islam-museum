  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الله عبد الله؛ تُستخدم لوقائع الكيان فقط. تروي مولده في حي كارته بروان بكابل، وعمله طبيب عيون، ومسيرته وزيرا للخارجية (2001-2005) ورئيسا تنفيذيا لأفغانستان (2014-2020) ورئيسا للمجلس الأعلى للمصالحة الوطنية (2020-2021)، وترشحه للرئاسة ثلاث مرات. لا تحمل خانة للديانة ولا يسمي نصها ديانته."
  en: "English Wikipedia article on Abdullah Abdullah; used for entity facts only. It recounts his birth in the Karte Parwan district of Kabul, his work as an ophthalmologist, and his career as foreign minister (2001–2005), Chief Executive of Afghanistan (2014–2020) and chairman of the High Council for National Reconciliation (2020–2021), with three presidential candidacies. It carries no religion field and its text does not name his religion."
