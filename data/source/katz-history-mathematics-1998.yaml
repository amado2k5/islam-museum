summary:
  ar: "مرجع فيكتور كاتز الجامعي؛ تستشهد به مقالة مسلمة المتوازيات عند ⁦(ص 269)⁩ على محاولة ابن الهيثم وإدخاله الحركة في الهندسة، وعند ⁦(ص 271)⁩ على كتاب صدر الدين ⁦(1298)⁩ المطبوع بروما 1594 كنقطة انطلاق ساكيري وفي النهاية الهندسة اللا أقليدية."
  en: "Victor Katz's standard history of mathematics; the parallel-postulate article cites p. 269 for Ibn al-Haytham's attempted proof and his introduction of motion into geometry, and p. 271 for Sadr al-Din's 1298 book, printed at Rome in 1594, as the starting point for Saccheri and ultimately non-Euclidean geometry."
  es: "La obra de referencia de Victor Katz sobre la historia de las matemáticas, en su artículo sobre el postulado de las paralelas, cita la página 269 para el intento de demostración de Ibn al-Haytham y su introducción del movimiento en la geometría, y la página 271 para el libro de Sadr al-Din de 1298, impreso en Roma en 1594, como punto de partida para Saccheri y, en última instancia, para la geometría no euclidiana."
  fr: "L'histoire standard des mathématiques de Victor Katz; l'article sur le postulat parallèle cite la page 269 pour la tentative de preuve d'Ibn al-Haytham et son introduction du mouvement dans la géométrie, et la page 271 pour le livre de Sadr al-Din de 1298, imprimé à Rome en 1594, comme point de départ de la géométrie de Saccheri et finalement de la géométrie non euclidienne."
  ur: "وکٹر کاٹز کی ریاضی کی معیاری تاریخ؛ متوازی پوسٹلیٹ آرٹیکل پی کا حوالہ دیتا ہے۔ 269 ابن الہیثم کے کوشش شدہ ثبوت اور جیومیٹری میں حرکت کے تعارف کے لیے، اور صفحہ۔ صدرالدین کی 1298 کتاب کے لیے 271، جو 1594 میں روم میں چھپی تھی، ساکری اور بالآخر غیر یوکلیڈین جیومیٹری کے لیے نقطہ آغاز کے طور پر۔"
