summary:
  ar: "تصدير رقمي من المكتبة الشاملة لنص منهاج السنة النبوية لتقي الدين ابن تيمية (ت 728هـ) مع حواشي التحقيق ورموز النسخ الخطية، في 2540 صفحة؛ يبدأ بفهرس مفصّل للفصول ثم خطبة المؤلف وينتهي في الفصل السادس من الرد على حجج الإمامية في إمامة أبي بكر."
  en: "A digital export from al-Maktaba al-Shamila of the text of Minhaj al-Sunna al-Nabawiyya by Taqi al-Din Ibn Taymiyya (d. 728 AH), with the critical apparatus and manuscript sigla, in 2,540 pages; it opens with a detailed table of chapters, then the author's preface, and ends inside the sixth chapter of the reply on Abu Bakr's imamate."
