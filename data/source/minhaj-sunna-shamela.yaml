language: ar
reliability_note: "Pages cited are the PDF pages of the Shamela export (item 1416_20210502), which equal the page number printed in each page footer (shamela.org); they are not the printed pages of the paper edition. The export's digits are often printed reversed (e.g. «٨٢٧» for 728) and its diacritics are displaced; every number used was read with that in mind. The footnotes use the same manuscript sigla as the key page of Muhammad Rashad Salim's printed edition (vol. 8, PDF p. 3, source/minhaj-sunna-salim-v8), and this is taken as the edition behind the export; the export itself does not name the editor on its title page. The footnotes are the editor's; only the author's text is used for his positions, and the editor's notes are cited as the editor's."
