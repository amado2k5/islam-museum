  ar: "مقالة ويكيبيديا العربية عن آق شمس الدين، مراجعة 2 أيار 2026؛ تعيد عرض الرواية العربية المألوفة: مولده بدمشق سنة 792هـ/1389م وحفظه القرآن في السابعة ودراسته في أماسيا وحلب وأنقرة، وتعليمه محمد الفاتح، وكتابيه في الطب وقوله في الميكروب، وتحديده موضع قبر أبي أيوب الأنصاري، ووفاته في غوينوك سنة 1459م."
  en: "Arabic Wikipedia article on Aq Shams al-Din, revision of 2 May 2026; it restates the familiar Arabic narrative — born at Damascus in 792/1389, memorising the Qur'an at seven and studying at Amasya, Aleppo and Ankara, his tutorship of Mehmed the Conqueror, his two medical books and the microbe saying, his locating of Abu Ayyub al-Ansari's grave, and his death at Goynuk in 1459."
