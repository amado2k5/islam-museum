summary:
  ar: "مدخل موسوعي تركي عن العمامة وأنواعها، يذكر شواهد قديمة على أغطية رأس ملفوفة، واستعمالها قبل الإسلام لدى البابليين والفرس والعرب، ثم تنوع أشكالها ودلالاتها في المجتمعات الإسلامية."
  en: "A Turkish encyclopedia entry on turbans and their forms. It describes ancient evidence for wrapped headwear and its pre-Islamic use among Babylonians, Persians and Arabs, followed by diverse forms and meanings in Muslim societies."
  es: "Entrada de una enciclopedia turca sobre turbantes y sus formas. Describe evidencias antiguas de tocados envolventes y su uso preislámico entre babilonios, persas y árabes, seguido de diversas formas y significados en las sociedades musulmanas."
  fr: "Un article d'une encyclopédie turque consacré aux turbans et à leurs différentes formes. Il décrit les traces anciennes de coiffes enveloppées et leur usage préislamique chez les Babyloniens, les Perses et les Arabes, ainsi que la diversité des formes et des significations qu'elles ont évolué au sein des sociétés musulmanes."
  ur: "پگڑیوں اور ان کی شکلوں پر ایک ترک انسائیکلوپیڈیا اندراج۔ اس میں لپیٹے ہوئے سر کے لباس اور بابلیوں، فارسیوں اور عربوں میں اس کے قبل از اسلام استعمال کے قدیم شواہد کی وضاحت کی گئی ہے، اس کے بعد مسلم معاشروں میں متنوع شکلیں اور معنی ہیں۔"
