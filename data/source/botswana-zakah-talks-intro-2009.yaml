reliability_note: "The introduction by Hajj Issa Bryce to the booklet of talks Bewley delivered at Masjid an-Nur, Gaborone, on 2–4 March 2009, read in full in this session. It styles him 'Hajj Abdalhaqq Sayf al-'Ilm Bewley', states that he became Muslim during a visit to Morocco in 1968 and spent the following three years studying there, that on returning to England 'he met and married his wife, the world-famous translator Aisha Abdarrahman', that he helped establish Muslim communities in Nigeria and in Córdoba, Spain (the community that later built the Granada mosque), spent eighteen months in Bermuda and the USA, was imam of the mosque at Norwich and ran a Muslim school there through most of the 1980s, and later taught Islamic studies at Dallas College, Cape Town, serving as imam-khatib of the Jumu'a Mosque of Cape Town in its first year (2006). It is independent of both Wikipedia and the publishers' biographies."
