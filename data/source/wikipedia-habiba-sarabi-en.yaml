summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حبيبة سرابي؛ تُستخدم لوقائع الكيان فقط. توثّق ولادتها سنة 1956 في سراب بولاية غزني نقلاً عن القاموس التاريخي لأفغانستان، ووزارتها لشؤون المرأة خلفًا لسيما سمر، وحاكميتها لباميان (2005–2013) بوصفها أول امرأة تحكم ولاية أفغانية، وجوائزها، وتذكر انتماءها العرقي الهزاري وتهجئة اسمها ساروبي."
  en: "English Wikipedia article on Habiba Sarabi; used for entity facts only. It records her birth in 1956 in Sarab, Ghazni province, citing the Historical Dictionary of Afghanistan, her succession of Sima Samar as Minister of Women's Affairs, her governorship of Bamyan (2005–2013) as the first woman to govern an Afghan province, and her awards, and gives her Hazara ethnicity and the Sarobi spelling variant."
