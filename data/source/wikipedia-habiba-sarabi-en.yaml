summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حبيبة سرابي؛ تُستخدم لوقائع الكيان فقط. توثّق ولادتها سنة 1956 في سراب بولاية غزني نقلاً عن القاموس التاريخي لأفغانستان، ووزارتها لشؤون المرأة خلفًا لسيما سمر، وحاكميتها لباميان (2005–2013) بوصفها أول امرأة تحكم ولاية أفغانية، وجوائزها، وتذكر انتماءها العرقي الهزاري وتهجئة اسمها ساروبي."
  en: "English Wikipedia article on Habiba Sarabi; used for entity facts only. It records her birth in 1956 in Sarab, Ghazni province, citing the Historical Dictionary of Afghanistan, her succession of Sima Samar as Minister of Women's Affairs, her governorship of Bamyan (2005–2013) as the first woman to govern an Afghan province, and her awards, and gives her Hazara ethnicity and the Sarobi spelling variant."
  es: "Artículo de la Wikipedia en inglés sobre Habiba Sarabi; utilizado únicamente para datos sobre la persona. Registra su nacimiento en 1956 en Sarab, provincia de Ghazni, citando el Diccionario Histórico de Afganistán, su sucesión de Sima Samar como Ministra de Asuntos de la Mujer, su mandato como gobernadora de Bamyan (2005-2013) como la primera mujer en gobernar una provincia afgana, y sus premios, y le atribuye la etnia hazara y la variante ortográfica sarobi."
  fr: "Article de Wikipédia en anglais sur Habiba Sarabi; utilisé uniquement pour les informations la concernant. Il mentionne sa naissance en 1956 à Sarab, dans la province de Ghazni, en citant le Dictionnaire historique de l’Afghanistan, sa succession de Sima Samar au poste de ministre des Affaires féminines, son mandat de gouverneure de Bamyan (2005-2013) en tant que première femme à gouverner une province afghane, ainsi que ses distinctions. Il précise également son appartenance ethnique hazara et la variante orthographique Sarobi."
  ur: "حبیبہ سرابی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1956 میں صوبہ غزنی کے سراب میں ان کی پیدائش، افغانستان کی تاریخی لغت کا حوالہ دیتے ہوئے، سیما ثمر کی وزیر برائے امور خواتین کے طور پر ان کی جانشینی، بامیان کی ان کی گورنری (2005-2013) کو افغان صوبے پر حکومت کرنے والی پہلی خاتون کے طور پر، اور اس کے ایوارڈز، اور اس کی ہزارہ نسل کو سراہا گیا ہے۔"
