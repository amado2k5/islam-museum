summary:
  ar: "صفحة مسلم سنترال الصوتية لكمال المكي مع سيرته القياسية: لُقّب بـ«الحزام الأسود في الدعوة»، معروف بورشة «كيف تُدخل شخصًا في الإسلام في عشر دقائق»، ومحاضراته وفيديوهاته تستهدف قضايا معاصرة، وتعلّم على أيدي علماء من أنحاء العالم."
  en: "Muslim Central's audio page for Kamal El-Mekki with his standard biography: dubbed the 'Black Belt of Dawah', known for the workshop 'How to Give Shahadah in 10 Minutes', his lectures and online videos address contemporary issues, and he was educated at the hands of scholars from across the world."
  es: "La página de audio de Muslim Central sobre Kamal El-Mekki incluye su biografía habitual: apodado el \"Cinturón Negro de la Dawah\", conocido por el taller \"Cómo pronunciar la Shahada en 10 minutos\", sus conferencias y vídeos en línea abordan temas contemporáneos, y fue educado por eruditos de todo el mundo."
  fr: "La page audio de Muslim Central consacrée à Kamal El-Mekki présente sa biographie habituelle: surnommé la « ceinture noire de la da'wa », connu pour son atelier « Comment prononcer la shahada en 10 minutes », ses conférences et vidéos en ligne abordent des questions contemporaines, et il a été formé par des érudits du monde entier."
  ur: "مسلم سنٹرل کا کمال المکی کے لیے ان کی معیاری سوانح عمری کے ساتھ آڈیو صفحہ: 'دعوۃ کی بلیک بیلٹ' کے نام سے مشہور، ورکشاپ '10 منٹ میں شہادت کیسے دی جائے' کے لیے جانا جاتا ہے، اس کے لیکچرز اور آن لائن ویڈیوز عصری مسائل پر روشنی ڈالتے ہیں، اور وہ دنیا بھر کے اسکالرز کے ہاتھوں تعلیم یافتہ تھے۔"
