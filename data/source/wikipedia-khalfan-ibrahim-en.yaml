summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن خلفان إبراهيم؛ تُستخدم لوقائع الكيان فقط. تروي فوزه بجائزة أفضل لاعب في آسيا سنة 2006 بوصفه أول قطري ينالها، ومسيرته الطويلة مع السد وفوزه بدوري أبطال آسيا 2011. ولا تذكر ديانته."
  en: "English Wikipedia article on Khalfan Ibrahim; used for entity facts only. It recounts his 2006 Asian Player of the Year award, the first won by a Qatari, his long career with Al Sadd and their 2011 AFC Champions League title. It makes no statement about his religion."
  es: "Artículo de la Wikipedia en inglés sobre Khalfan Ibrahim; utilizado únicamente para obtener información sobre la persona. Relata su premio al Jugador Asiático del Año en 2006, el primero que ganó un catarí, su larga trayectoria con el Al Sadd y el título de la Liga de Campeones de la AFC de 2011. No menciona su religión."
  fr: "Article Wikipédia en anglais sur Khalfan Ibrahim; utilisé uniquement à des fins d'information sur l'entité. Il relate son titre de Joueur asiatique de l'année 2006, le premier remporté par un Qatari, sa longue carrière à Al Sadd et leur victoire en Ligue des champions de l'AFC en 2011. Il ne fait aucune mention de sa religion."
  ur: "خلفان ابراہیم پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کے 2006 کے ایشین پلیئر آف دی ایئر ایوارڈ کا ذکر ہے، جو پہلا قطری نے جیتا تھا، الصد کے ساتھ ان کا طویل کیریئر اور 2011 کا AFC چیمپئنز لیگ ٹائٹل۔ اس کے مذہب کے بارے میں کوئی بیان نہیں ہے۔"
