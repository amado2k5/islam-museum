summary:
  ar: "عنصر ويكيداتا Q558626 لسيد مير محمد عالم خان؛ يُستخدم للمعرّفات والوقائع المنظّمة فقط. يذكر مولده في 3 يناير 1880 ووفاته في 28 أبريل 1944 وقيمتي دين (P140) هما الإسلام والإسلام السني، دون قيمة حنفية."
  en: "Wikidata item Q558626 for Sayyid Mir Muhammad Alim Khan; used for identifiers and structured facts only. It gives his birth on 3 January 1880 and his death on 28 April 1944, and religion (P140) values of Islam and Sunni Islam, with no Hanafi value."
  es: "Elemento de Wikidata Q558626 para Sayyid Mir Muhammad Alim Khan; utilizado únicamente para identificadores y datos estructurados. Indica su fecha de nacimiento el 3 de enero de 1880 y su fallecimiento el 28 de abril de 1944, así como su religión (P140), específicamente el Islam y el Islam sunita, sin mencionar la escuela Hanafi."
  fr: "L'élément Wikidata Q558626 concerne Sayyid Mir Muhammad Alim Khan; il sert uniquement à identifier et à fournir des informations structurées. Il indique sa date de naissance, le 3 janvier 1880, et sa date de décès, le 28 avril 1944. La référence P140 mentionne l'islam sunnite, sans mention de l'école hanafite."
  ur: "وکی ڈیٹا آئٹم Q558626 برائے سید میر محمد علیم خان؛ صرف شناخت کنندگان اور ساختی حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 3 جنوری 1880 کو ان کی پیدائش اور 28 اپریل 1944 کو ان کی موت، اور مذہب (P140) اسلام اور سنی اسلام کی اقدار، جس کی کوئی حنفی قدر نہیں ہے۔"
  tr: "Syed Mir Muhammad Alam Khan tarafından Q558626 Wikidata öğesi; yalnızca organize tanımlayıcılar ve gerçekler için kullanılır. 3 Ocak 1880 doğumlu ve 28 Nisan 1944'te öldüğü belirtilir; dinin değerleri (P140) İslam ve Sünni İslam'dır, ancak Hanefi değeri yoktur."
  id: "Elemen Wikidata Q558626 oleh Syed Mir Muhammad Alam Khan; digunakan hanya untuk pengenal terorganisir dan fakta. Ia disebutkan lahir pada 3 Januari 1880, dan meninggal pada 28 April 1944, dan nilai-nilai agama (HlmP140) adalah Islam dan Islam Sunni, tanpa nilai Hanafi."
