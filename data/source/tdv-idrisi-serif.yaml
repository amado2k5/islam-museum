summary:
  ar: "مدخل «الشريف الإدريسي» في موسوعة TDV الإسلامية التركية: نسبه ومولده في سبتة سنة 493هـ وتعلّمه في قرطبة ونزوله بلرمو في خدمة رجار الثاني، وكتابه «نزهة المشتاق» الذي أتمّه في شوال 548هـ (يناير 1154م) مقسوماً إلى سبعة أقاليم في كل منها عشرة أجزاء على رأس كل جزء خريطته، ومصادره من الجغرافيين المسلمين وبطلميوس، وطبعاته وترجماته، وإعادة كونراد ميلر رسم خرائطه، ومختصراته وكتبه الأخرى."
  en: "The TDV İslâm Ansiklopedisi entry on al-Sharif al-Idrisi: his lineage, birth at Ceuta in 493 AH, study at Córdoba and settling at Palermo in the service of Roger II; his Nuzhat al-mushtaq, finished in Shawwal 548 (January 1154), arranged in seven climes of ten sections each with a map at the head of every section; his sources among the Muslim geographers and Ptolemy; its editions and translations, Konrad Miller's redrawing of its maps, its abridgements and his other books."
  ur: "ٹی ڈی وی اسلامی انسائیکلوپیڈیا کا مدخل «شریف ادریسی»: ان کا نسب، 493ھ میں سبتہ میں پیدائش، قرطبہ میں تعلیم اور روجر دوم کی ملازمت میں پالرمو میں قیام؛ ان کی کتاب «نزہۃ المشتاق» جو شوال 548ھ (جنوری 1154ء) میں مکمل ہوئی، سات اقلیموں میں ترتیب دی گئی جن میں سے ہر ایک کے دس حصے ہیں اور ہر حصے کے شروع میں اس کا نقشہ ہے؛ مسلمان جغرافیہ دانوں اور بطلیموس میں سے اس کے مآخذ؛ اس کے ایڈیشن اور ترجمے، کونراڈ ملر کا اس کے نقشوں کو دوبارہ بنانا، اس کے اختصارات اور ان کی دوسری کتابیں۔"
