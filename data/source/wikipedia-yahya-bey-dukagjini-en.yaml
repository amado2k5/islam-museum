reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision via the MediaWiki API on 1 November 2026; a fact is used only where the article cites a source for it (Wikipedia broad rule). It rests on Gibb's History of Ottoman Poetry (1904), the First Encyclopaedia of Islam, Fleischer (1986), Elsie's Albanian literature work and Turkish scholarship. It states openly that neither his birth year (1488 or 1489) nor his death year (1582 preferred; 1575, 1573 and 1578-79 also given) nor his death place is agreed, and the record preserves those variants."
