  ar: "مقالة ويكيبيديا الإنجليزية عن يحيى بك دوكاجيني (طاشليجه لي يحيى)؛ تعطي ولادته 1488 أو 1489 في شمال ألبانيا ووفاته 1582 على الأرجح في لوزنيتسا، ومسيرته جنديًا إنكشاريًا وشاعر ديوان، ومرثيته في الشاهزاده مصطفى ونفيه، وخمسة مثنوياته وديوانه."
  en: "English Wikipedia article on Yahya bey Dukagjini (Taşlıcalı Yahya); it gives his birth in 1488 or 1489 in northern Albania and his death most probably in 1582 at Loznica, his career as a janissary soldier and diwan poet, his elegy for Şehzade Mustafa and his exile, and his five mesnevis and diwan."
