summary:
  ar: "بحث كلاسيكي لجورج هنري فارمر في رصد ما نقلته الحضارة الإسلامية إلى الموسيقى الأوروبية؛ يثبت فيه أن أصل كلمات lute وrebec وguitar وnaker من العود والرباب والقيثارة والنقارة حقيقة مقررة، ويصف قناة المنستريل والأندلس."
  en: "Henry George Farmer's classic survey of what Islamic civilisation transmitted to European music; it states that the derivation of lute, rebec, guitar and naker from al-'ud, rabab, qitara and naqqara 'is an established fact' and describes the Andalusi-minstrel channel."
  ur: "ہنری جارج فارمر کی معیاری تحقیق کہ اسلامی تہذیب نے یورپی موسیقی کو کیا پہنچایا؛ اس میں lute، rebec، guitar اور naker کی اشتقاق al-'ud، rabab، qitara اور naqqara سے «مقررہ حقیقت» کہی گئی ہے اور اندلسی-منسترل راستہ بیان ہوا ہے۔"
  es: "El estudio clásico de Henry George Farmer sobre lo que la civilización islámica transmitió a la música europea afirma que la derivación del laúd, el rabel, la guitarra y el naker a partir del al-'ud, el rabab, la qitara y la naqqara \"es un hecho establecido\" y describe la conexión entre los juglares andaluces."
  fr: "L'étude classique d'Henry George Farmer sur ce que la civilisation islamique a transmis à la musique européenne; elle affirme que la dérivation du luth, du rebec, de la guitare et du naker à partir d'al-'ud, de rabab, de qitara et de naqqara « est un fait établi » et décrit le courant andalou des ménestrels."
  tr: "George Henry Farmer'ın İslam medeniyetinin Avrupa müziğine aktardıklarını belgeleyen klasik bir çalışması; ud, rebab, gitar ve naqara kelimelerinin ud, rebab, gitar ve naqara'dan kökeninin kesin bir gerçek olduğunu kanıtlar ve minstrel kanalı ile Endülüs'ü tanımlar."
  id: "Sebuah studi klasik oleh George Henry Farmer yang mendokumentasikan apa yang diwariskan peradaban Islam ke musik Eropa; ia membuktikan bahwa asal-usul kata lute, rebec, gitar, dan naker dari oud, rebab, gitar, dan naqara adalah fakta yang sudah pasti, dan menggambarkan saluran minstrel dan Andalusia."
