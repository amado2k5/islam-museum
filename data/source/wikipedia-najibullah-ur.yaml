summary:
  ar: "مقالة ويكيبيديا الأردية عن محمد نجيب الله؛ تُستخدم لوقائع الكيان فقط. تصفه بالشيوعي المؤيد للسوفيات، وتروي رئاسته جهاز الخاد ثم أفغانستان، واحتماءه بمقر الأمم المتحدة في كابل من 1992 حتى قتله سنة 1996، وتصنّفه فئاتها في «اشتراكيي الإسلام»."
  en: "Urdu Wikipedia article on Mohammad Najibullah; used for entity facts only. It describes him as a communist and Soviet supporter, recounts his leadership of KHAD and then of Afghanistan, his refuge in the UN compound in Kabul from 1992 until his killing in 1996. Its categories file him under 'Islamic socialists' — a filing, not an attestation."
  es: "Artículo de Wikipedia en urdu sobre Mohammad Najibullah; utilizado únicamente para datos sobre la persona. Lo describe como comunista y partidario de la Unión Soviética, relata su liderazgo en KHAD y posteriormente en Afganistán, y su refugio en el complejo de la ONU en Kabul desde 1992 hasta su asesinato en 1996. Sus categorías lo clasifican como «socialista islámico», una clasificación, no una declaración."
  fr: "Article de Wikipédia en ourdou sur Mohammad Najibullah; utilisé uniquement à des fins d'information. Il le décrit comme un communiste et un partisan soviétique, relate son rôle à la tête du KHAD puis de l'Afghanistan, ainsi que son refuge dans l'enceinte de l'ONU à Kaboul de 1992 jusqu'à son assassinat en 1996. Il est classé dans la catégorie « socialistes islamistes » – un classement, et non une attestation."
