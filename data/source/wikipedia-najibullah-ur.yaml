  ar: "مقالة ويكيبيديا الأردية عن محمد نجيب الله؛ تُستخدم لوقائع الكيان فقط. تصفه بالشيوعي المؤيد للسوفيات، وتروي رئاسته جهاز الخاد ثم أفغانستان، واحتماءه بمقر الأمم المتحدة في كابل من 1992 حتى قتله سنة 1996، وتصنّفه فئاتها في «اشتراكيي الإسلام»."
  en: "Urdu Wikipedia article on Mohammad Najibullah; used for entity facts only. It describes him as a communist and Soviet supporter, recounts his leadership of KHAD and then of Afghanistan, his refuge in the UN compound in Kabul from 1992 until his killing in 1996. Its categories file him under 'Islamic socialists' — a filing, not an attestation."
