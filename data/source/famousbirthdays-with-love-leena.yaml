  ar: "ملف «مع الحب لينا» في دليل فيموس بيرثدايز؛ يذكر أنها مؤثرة إنستغرام اشتهرت بمحتوى الأزياء المحتشمة والجمال، وأنها متزوجة من عمر سنوبر ولهما ابنة وُلدت 2020 وابن وُلد 2023، وأن الأسرة تقيم في تكساس، وأن أباها فلسطيني وأمها أمريكية، وأن درس حجاب لها تجاوز 1.5 مليون مشاهدة."
  en: "The Famous Birthdays directory profile of With Love Leena. It describes her as an Instagram influencer known for modest fashion, lifestyle and beauty content; names her husband as Omar Snoubar, with a daughter born in 2020 and a son born in 2023; places the family in Texas; gives her father as Palestinian and her mother as American; and notes a daily hijab tutorial viewed more than 1.5 million times on YouTube."
