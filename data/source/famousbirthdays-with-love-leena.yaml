summary:
  ar: "ملف «مع الحب لينا» في دليل فيموس بيرثدايز؛ يذكر أنها مؤثرة إنستغرام اشتهرت بمحتوى الأزياء المحتشمة والجمال، وأنها متزوجة من عمر سنوبر ولهما ابنة وُلدت 2020 وابن وُلد 2023، وأن الأسرة تقيم في تكساس، وأن أباها فلسطيني وأمها أمريكية، وأن درس حجاب لها تجاوز 1.5 مليون مشاهدة."
  en: "The Famous Birthdays directory profile of With Love Leena. It describes her as an Instagram influencer known for modest fashion, lifestyle and beauty content; names her husband as Omar Snoubar, with a daughter born in 2020 and a son born in 2023; places the family in Texas; gives her father as Palestinian and her mother as American; and notes a daily hijab tutorial viewed more than 1.5 million times on YouTube."
  es: "El perfil de With Love Leena en el directorio Famous Birthdays la describe como una influencer de Instagram conocida por su contenido sobre moda modesta, estilo de vida y belleza; menciona a su esposo como Omar Snoubar, con una hija nacida en 2020 y un hijo nacido en 2023; sitúa a la familia en Texas; indica que su padre es palestino y su madre estadounidense; y destaca un tutorial diario sobre el uso del hiyab que ha sido visto más de 1,5 millones de veces en YouTube."
  fr: "Le profil de With Love Leena dans l'annuaire Famous Birthdays la décrit comme une influenceuse Instagram connue pour ses contenus sur la mode pudique, le style de vie et la beauté; son mari est Omar Snoubar, ils ont une fille née en 2020 et un fils né en 2023; la famille réside au Texas; son père est palestinien et sa mère américaine; et un tutoriel quotidien sur le hijab, visionné plus de 1,5 million de fois sur YouTube, est mentionné."
  ur: "ود لینا کی مشہور برتھ ڈے ڈائرکٹری پروفائل۔ یہ اسے ایک انسٹاگرام پر اثر انداز کرنے والے کے طور پر بیان کرتا ہے جسے معمولی فیشن، طرز زندگی اور خوبصورتی کے مواد کے لیے جانا جاتا ہے۔ اپنے شوہر کا نام عمر سنوبر رکھا ہے، جس کی ایک بیٹی 2020 میں پیدا ہوئی اور ایک بیٹا 2023 میں پیدا ہوا؛ خاندان کو ٹیکساس میں رکھتا ہے؛ اس کے والد کو فلسطینی اور اس کی ماں کو امریکی قرار دیتا ہے۔ اور یومیہ حجاب ٹیوٹوریل کو یوٹیوب پر 1.5 ملین سے زیادہ بار دیکھا جاتا ہے۔"
  tr: "Ünlü Doğum Günleri rehberindeki \"With Love Lina\" dosyası; mütevazı moda ve güzellik içerikleriyle tanınan bir Instagram influencer'ı, Omar Snooper ile evli olduğu ve 2020 doğumlu bir kızları ve 2023 doğumlu bir oğulları olduğu belirtilmelidir. Aile Teksas'ta yaşıyor, babası Filistinli, annesi Amerikalı ve başörtüsü dersi 1,5 milyonu aştı."
  id: "File \"Dengan Cinta Lina\" dalam panduan Famous Birthdays; perlu disebutkan bahwa dia adalah influencer Instagram yang dikenal dengan konten fashion dan kecantikan yang sederhana, menikah dengan Omar Snooper, dan mereka memiliki seorang putri yang lahir pada 2020 dan seorang putra yang lahir pada 2023. Keluarga ini tinggal di Texas, ayahnya adalah orang Palestina dan ibunya orang Amerika, dan pelajaran hijabnya telah melebihi 1,5 juta penayangan."
