summary:
  ar: "مقالة ويكيبيديا العربية عن نواف الأحمد الجابر الصباح؛ تُستخدم لوقائع الكيان فقط. تتناول نشأته ومناصبه الأمنية وولايته للعهد وإمارته للكويت من 2020 إلى 2023 ووفاته. ويعطي حقل الدين في صندوق معلوماتها «الإسلام» عمومًا دون تسمية مدرسة."
  en: "Arabic Wikipedia article on Nawaf Al-Ahmad Al-Jaber Al-Sabah; used for entity facts only. It covers his upbringing, his security posts, his crown-princeship, his emirate of Kuwait from 2020 to 2023 and his death. Its infobox religion field gives Islam generically and names no school for him."
  es: "Artículo de Wikipedia en árabe sobre Nawaf Al-Ahmad Al-Jaber Al-Sabah; se utiliza únicamente para obtener información sobre la persona. Abarca su infancia, sus cargos de seguridad, su condición de príncipe heredero, su gobierno como emirato de Kuwait entre 2020 y 2023, y su fallecimiento. En su ficha informativa, el apartado de religión indica que profesaba el islam de forma genérica y no menciona ninguna escuela religiosa."
  fr: "L'article de Wikipédia en arabe consacré à Nawaf Al-Ahmad Al-Jaber Al-Sabah, utilisé uniquement à des fins d'information sur la personne, retrace son enfance, ses fonctions dans les forces de sécurité, son titre de prince héritier, son mandat d'émir du Koweït de 2020 à 2023 et son décès. L'infobox « Religion » mentionne l'islam de manière générique, sans préciser d'école religieuse."
  ur: "عربی ویکیپیڈیا مضمون نواف الاحمد الجابر الصباح پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کی پرورش، اس کی سیکورٹی پوسٹس، اس کی ولی عہدی، اس کی امارت کویت 2020 سے 2023 اور اس کی موت کا احاطہ کیا گیا ہے۔ اس کا انفو باکس مذہب کا میدان اسلام کو عمومی طور پر دیتا ہے اور اس کے لیے کسی اسکول کا نام نہیں رکھتا۔"
  tr: "Nawaf Al-Ahmad Al-Jaber Al-Sabah hakkında Arapça Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Yetiştirilme tarzını, güvenlik pozisyonlarını, 2020-2023 yılları arasındaki Kuveyt veliaht prensi ve emirliğini ve ölümünü kapsar. Bilgi kutusundaki din alanı genellikle \"İslam\" olarak geçer ama bir okul belirtmez."
  id: "Artikel Wikipedia berbahasa Arab tentang Nawaf Al-Ahmad Al-Jaber Al-Sabah; digunakan hanya untuk fakta entitas. Artikel ini mencakup masa kecilnya, posisi keamanan, putra mahkota dan emirat Kuwait dari 2020 hingga 2023, serta kematiannya. Bidang agama dalam infobox umumnya mencantumkan \"Islam\" tanpa menyebutkan sekolah."
