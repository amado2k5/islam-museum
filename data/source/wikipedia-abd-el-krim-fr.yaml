summary:
  ar: "مقالة ويكيبيديا الفرنسية عن عبد الكريم الخطابي (1882–1963)؛ يعطي صندوقها دينه «إسلام سني مالكي»، وتصف في متنها دولة الريف الإصلاحية بأنها مستلهمة من السلفية، دون أن تنسب إليه مذهبًا بنصّ شخصي."
  en: "The French Wikipedia article on Abd el-Krim (1882–1963); its infobox gives his religion as Sunni Maliki Islam, and its text describes the reformist Rif Republic he promoted as inspired by Salafism, without attributing a school to him in a personal text statement."
  es: "El artículo de la Wikipedia en francés sobre Abd el-Krim (1882-1963); su ficha informativa indica que su religión era el islam suní malikí, y su texto describe la República reformista del Rif que promovió como inspirada por el salafismo, sin atribuirle ninguna escuela en una declaración personal."
  fr: "L'article de Wikipédia en français sur Abd el-Krim (1882-1963); son infobox indique que sa religion est l'islam sunnite malikite, et son texte décrit la République réformiste du Rif qu'il a promue comme inspirée par le salafisme, sans lui attribuer d'école dans une déclaration personnelle."
  ur: "عبدالکریم (1882–1963) پر فرانسیسی ویکیپیڈیا کا مضمون؛ اس کا انفو باکس اس کا مذہب بطور سنی مالکی اسلام دیتا ہے، اور اس کا متن اس اصلاح پسند Rif جمہوریہ کو بیان کرتا ہے جسے اس نے سلفیت سے متاثر ہوکر فروغ دیا تھا، بغیر کسی ذاتی ٹیکسٹ بیان میں کسی اسکول کو اس سے منسوب کیا ہے۔"
