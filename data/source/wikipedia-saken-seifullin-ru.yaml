  ar: "مقالة ويكيبيديا الروسية عن ساكن سيفولين؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 15 أكتوبر 1894 في أوول أورتاو بقضاء أكمولينسك، ووفاته في 25 أبريل 1938 في ألما آتا، وترأسه مجلس مفوضي الشعب في جمهورية قيرغيزيا ذاتية الحكم، وعضويته البارزة في الحزب الشيوعي (البلاشفة)، وتدريسه الروسية في مدرسة مسلمين؛ ولا تسمي له دينا ولا مذهبا."
  en: "Russian Wikipedia article on Saken Seifullin; used for entity facts only. It gives his birth on 15 October 1894 at the aul of Ortau in Akmolinsk Uezd, his death on 25 April 1938 at Alma-Ata, his chairmanship of the Council of People's Commissars of the Kirghiz ASSR, his prominence in the Communist Party (Bolsheviks), and his teaching of Russian at a Muslim madrasa; it names no religion or school for him."
