summary:
  ar: "مقالة ويكيبيديا الروسية عن ساكن سيفولين؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 15 أكتوبر 1894 في أوول أورتاو بقضاء أكمولينسك، ووفاته في 25 أبريل 1938 في ألما آتا، وترأسه مجلس مفوضي الشعب في جمهورية قيرغيزيا ذاتية الحكم، وعضويته البارزة في الحزب الشيوعي ⁦(البلاشفة)⁩، وتدريسه الروسية في مدرسة مسلمين؛ ولا تسمي له دينا ولا مذهبا."
  en: "Russian Wikipedia article on Saken Seifullin; used for entity facts only. It gives his birth on 15 October 1894 at the aul of Ortau in Akmolinsk Uezd, his death on 25 April 1938 at Alma-Ata, his chairmanship of the Council of People's Commissars of the Kirghiz ASSR, his prominence in the Communist Party (Bolsheviks), and his teaching of Russian at a Muslim madrasa; it names no religion or school for him."
  es: "Artículo de la Wikipedia rusa sobre Saken Seifullin; utilizado únicamente para datos biográficos. Indica su nacimiento el 15 de octubre de 1894 en el distrito de Ortau, en Akmolinsk Uezd, su fallecimiento el 25 de abril de 1938 en Alma-Ata, su presidencia del Consejo de Comisarios del Pueblo de la RASS de Kirguistán, su prominencia en el Partido Comunista (bolchevique) y su labor docente de ruso en una madrasa musulmana; no menciona su religión ni su escuela."
  fr: "L'article de Wikipédia en russe consacré à Saken Seifullin, utilisé uniquement à titre informatif, indique sa naissance le 15 octobre 1894 à Ortau, dans l'ouezd d'Akmolinsk, son décès le 25 avril 1938 à Alma-Ata, sa présidence du Conseil des commissaires du peuple de la RSSA kirghize, son rôle important au sein du Parti communiste (bolchevik) et son enseignement du russe dans une madrasa musulmane. L'article ne mentionne ni sa religion ni son école."
  ur: "Saken Seifullin پر روسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ان کی پیدائش 15 اکتوبر 1894 کو اکمولنسک ازد کے اول کے اول میں ہوئی، اس کی موت 25 اپریل 1938 کو الما-اتا میں ہوئی، کرغیز ASSR کی عوامی کمیسار کی کونسل کی ان کی سربراہی، کمیونسٹ پارٹی ⁦(بالشویکوں)⁩ میں اس کی نمایاں حیثیت، اور اس کی روسی زبان میں ایک مسلم تعلیم؛ اس کے لیے کسی مذہب یا اسکول کا نام نہیں ہے۔"
  tr: "Sivolin sakini hakkında Rusça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 15 Ekim 1894'te Akmolinsk ilçesindeki Ovel Ortau'da doğdu ve 25 Nisan 1938'de Almatı'da vefat etti. Kırgız Özerk Cumhuriyeti Halk Komiserliği Konseyi'ne başkanlık etti, Komünist Parti'nin (Bolşevikler) önde gelen bir üyesiydi ve bir Müslüman okulunda Rusça öğretti; okulda dini veya mezhebi adı verilmemektedir."
  id: "Artikel Wikipedia Rusia tentang penduduk Sivolin; hanya digunakan untuk fakta entitas. Ia lahir pada 15 Oktober 1894 di Ovel Ortau, distrik Akmolinsk, dan meninggal pada 25 April 1938 di Almaty. Ia memimpin Dewan Komisariat Rakyat Republik Otonom Kyrgyz, anggota terkemuka Partai Komunis (Bolshevik), dan mengajar bahasa Rusia di sekolah Muslim; tidak disebutkan agama atau sektenya."
