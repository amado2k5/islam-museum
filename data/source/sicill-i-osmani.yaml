reliability_note: "Mehmed Süreyya's late-Ottoman register of some 17,000 biographies, in the 1996 Latin-script edition (6 vols; vol. 1 ISBN 975-333-039-1; vol. 6 holds indexes and appendices). Copy used: scans sicill-i.osmani_01 … _06 (about 350 PDF pp. each), OCR of the Turkish text with frequent letter errors in diacritics and some two-column interleaving. Printed folios run continuously across the volumes and are legible only on some pages, so citations give the volume and PDF page; each entry ends with a reference in parentheses to the original Matbaa-i Amire edition (4 vols, 1308–c.1316 AH), e.g. «(I. 170)», which is recorded where useful. Editor's introduction: vol. 1 PDF pp. 5–9."
