summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن صباح الأحمد الجابر الصباح؛ تُستخدم لوقائع الكيان فقط. تذكر أنه وُلد في 16 يونيو 1929 (ومكان الولادة في صندوق معلوماتها الجهراء)، وكان وزيرًا للخارجية من 1963 إلى 2003 ورئيسًا للوزراء من 2003 إلى 2006، ثم أميرًا للكويت من يناير 2006 بعد تنازل سعد العبد الله لأسباب صحية، حتى وفاته في روتشستر بولاية منيسوتا في 29 سبتمبر 2020 ودفنه في مقبرة صليبيخات في اليوم التالي؛ واشتهر بوساطاته الخليجية وقيادته الإنسانية."
  en: "English Wikipedia article on Sabah Al-Ahmad Al-Jaber Al-Sabah; used for entity facts only. It gives him as born on 16 June 1929 (its infobox gives the birthplace as Jahra), foreign minister from 1963 to 2003 and prime minister from 2003 to 2006, then Emir of Kuwait from January 2006 — after Saad Al-Abdullah abdicated on health grounds — until his death at Rochester, Minnesota, on 29 September 2020, buried at Sulaibikhat Cemetery the next day; he was known for Gulf mediation and humanitarian leadership. Its infobox religion field reads 'Sunni Islam' — a structured value, not a statement in its text."
