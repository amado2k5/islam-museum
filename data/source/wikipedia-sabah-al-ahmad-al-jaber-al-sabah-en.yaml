summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن صباح الأحمد الجابر الصباح؛ تُستخدم لوقائع الكيان فقط. تذكر أنه وُلد في 16 يونيو 1929 ⁦(ومكان الولادة في صندوق معلوماتها الجهراء)⁩، وكان وزيرًا للخارجية من 1963 إلى 2003 ورئيسًا للوزراء من 2003 إلى 2006، ثم أميرًا للكويت من يناير 2006 بعد تنازل سعد العبد الله لأسباب صحية، حتى وفاته في روتشستر بولاية منيسوتا في 29 سبتمبر 2020 ودفنه في مقبرة صليبيخات في اليوم التالي؛ واشتهر بوساطاته الخليجية وقيادته الإنسانية."
  en: "English Wikipedia article on Sabah Al-Ahmad Al-Jaber Al-Sabah; used for entity facts only. It gives him as born on 16 June 1929 (its infobox gives the birthplace as Jahra), foreign minister from 1963 to 2003 and prime minister from 2003 to 2006, then Emir of Kuwait from January 2006 — after Saad Al-Abdullah abdicated on health grounds — until his death at Rochester, Minnesota, on 29 September 2020, buried at Sulaibikhat Cemetery the next day; he was known for Gulf mediation and humanitarian leadership. Its infobox religion field reads 'Sunni Islam' — a structured value, not a statement in its text."
  es: "Artículo de la Wikipedia en inglés sobre Sabah Al-Ahmad Al-Jaber Al-Sabah; utilizado únicamente para datos sobre la entidad. Indica que nació el 16 de junio de 1929 (su ficha informativa indica Jahra como lugar de nacimiento), fue ministro de Asuntos Exteriores de 1963 a 2003 y primer ministro de 2003 a 2006, y posteriormente emir de Kuwait desde enero de 2006 —tras la abdicación de Saad Al-Abdullah por motivos de salud— hasta su fallecimiento en Rochester, Minnesota, el 29 de septiembre de 2020, siendo enterrado al día siguiente en el cementerio de Sulaibikhat. Fue conocido por su mediación en el Golfo Pérsico y su liderazgo humanitario. El campo de religión de su ficha informativa indica «Islam sunita» —un valor estructurado, no una afirmación en su texto—."
  fr: "L'article de Wikipédia en anglais consacré à Sabah Al-Ahmad Al-Jaber Al-Sabah, utilisé uniquement pour les informations biographiques, indique qu'il est né le 16 juin 1929 (son infobox précise que son lieu de naissance est Jahra). Il a été ministre des Affaires étrangères de 1963 à 2003, puis Premier ministre de 2003 à 2006, et enfin émir du Koweït à partir de janvier 2006 – après l'abdication de Saad Al-Abdullah pour raisons de santé – jusqu'à son décès à Rochester, dans le Minnesota, le 29 septembre 2020. Il a été inhumé au cimetière de Sulaibikhat le lendemain. Il était reconnu pour sa médiation dans le Golfe et son engagement humanitaire. Le champ « religion » de son infobox indique « Islam sunnite » – une valeur structurée, et non une affirmation figurant dans le texte."
  ur: "صباح الاحمد الجابر الصباح پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اسے 16 جون 1929 کو پیدا ہوا ⁦(اس کا معلومات خانہ جاہرہ کے طور پر جائے پیدائش دیتا ہے)⁩، 1963 سے 2003 تک وزیر خارجہ اور 2003 سے 2006 تک وزیر اعظم، پھر جنوری 2006 تک کویت کے امیر - سعد العبداللہ کے صحت کی بنیاد پر استعفیٰ دینے کے بعد - ستمبر 2020 کو منیس، 2002 میں منیس میں انتقال ہونے تک۔ اگلے دن سولی بیخات قبرستان میں دفن کیا گیا۔ وہ خلیجی ثالثی اور انسانی ہمدردی کی قیادت کے لیے جانا جاتا تھا۔ اس کا انفو باکس مذہب کا فیلڈ 'سنی اسلام' پڑھتا ہے - ایک ساختی قدر، اس کے متن میں کوئی بیان نہیں۔"
  tr: "Sabah Al-Ahmad Al-Jaber Al-Sabah hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 16 Haziran 1929'da doğduğu (doğum yeri kamuya açık bilgi kutusunda), 1963-2003 yılları arasında Dışişleri Bakanı ve 2003-2006 yılları arasında Başbakan, ardından Ocak 2006'dan itibaren Saad Al-Abdullah'ın sağlık nedenleriyle tahttan çekilmesinin ardından Kuveyt Emiri olarak görev yaptığı belirtilmiştir; 29 Eylül 2020'de Rochester, Minnesota'da vefat eden ve ertesi gün Sulaybikhat Mezarlığı'na defnedilen kişi; Körfez arabuluculuğu ve insani liderliğiyle tanınıyordu."
  id: "Artikel Wikipedia bahasa Inggris tentang Sabah Al-Ahmad Al-Jaber Al-Sabah; hanya digunakan untuk fakta entitas. Dicatat bahwa ia lahir pada 16 Juni 1929 (dan tempat kelahirannya ada di infobox publik), menjabat sebagai Menteri Luar Negeri dari 1963 hingga 2003 dan Perdana Menteri dari 2003 hingga 2006, kemudian Emir Kuwait dari Januari 2006 setelah Saad Al-Abdullah turun tahta karena alasan kesehatan, hingga wafat di Rochester, Minnesota pada 29 September 2020, dan dimakamkan di Pemakaman Sulaybikhat keesokan harinya; ia dikenal karena mediasi Teluk dan kepemimpinan kemanusiaannya."
