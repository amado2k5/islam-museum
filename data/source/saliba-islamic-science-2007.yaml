summary:
  ar: "كتاب جورج ساليبا عن العلم الإسلامي والنهضة؛ تستشهد به مقالتا الزيج والعرضي: في الأولى على استعمال الأزياج للتنجيم رغم تحفظ الفلكيين، وفي الثانية على «قضية العرضي» ⁦(ص 203)⁩ ونسبة الابتكار غير البطلمي عند العرضي قبل الطوسي على ضوء مخطوطة مارش 621."
  en: "George Saliba's Islamic Science and the Making of the European Renaissance (MIT Press 2007); cited by the Zij article for zijes being used for astrology despite astronomers' reservations (Ibn al-Shatir's al-Zij al-jadid example) and by the al-Urdi article for the Urdi lemma (p. 203) and the argument, from Bodleian Marsh 621, that al-Urdi's non-Ptolemaic contributions preceded al-Tusi's."
  es: "La obra de George Saliba, *Islamic Science and the Making of the European Renaissance* (MIT Press, 2007); citada en el artículo sobre Zij por el uso de zijes en astrología a pesar de las reservas de los astrónomos (ejemplo de al-Zij al-jadid de Ibn al-Shatir) y en el artículo sobre al-Urdi por el lema de Urdi (p. 203) y el argumento, de Bodleian Marsh 621, de que las contribuciones no ptolemaicas de al-Urdi precedieron a las de al-Tusi."
  fr: "L'ouvrage de George Saliba, Islamic Science and the Making of the European Renaissance (MIT Press 2007); cité par l'article sur Zij pour l'utilisation des zijes en astrologie malgré les réserves des astronomes (exemple d'Ibn al-Shatir sur al-Zij al-jadid) et par l'article sur al-Urdi pour le lemme d'Urdi (p. 203) et l'argument, tiré de Bodleian Marsh 621, selon lequel les contributions non ptolémaïques d'al-Urdi ont précédé celles d'al-Tusi."
  ur: "جارج سلیبا کی اسلامی سائنس اور یورپی نشاۃ ثانیہ کی تشکیل ⁦(MIT پریس 2007)⁩؛ ماہرین فلکیات کے تحفظات کے باوجود علم نجوم کے لیے زیج کے استعمال کیے جانے کے لیے زیج کے مضمون کا حوالہ دیا گیا ہے ⁦(ابن الشاطر کی الزیج الجدید مثال)⁩ اور اردو لیمہ کے لیے الاردی مضمون ⁦(ص 203)⁩ اور بوڈلیان مارش 621 سے دلیل، جو کہ پہلے سے موجود ہیں الطوسی"
  tr: "George Saliba'nın İslam bilimi ve rönesans üzerine kitabı, 'Zij' ve 'Al-Ardi' makalelerinde atıfta bulunulur: ilki astronomların çekincelerine rağmen astroloji için 'azij' kullanımını üzerine, ikincisi ise 'Al-Ardi'nin Durumu' (s. 203) ve Mart 621 el yazması ışığında Al-'Ardi'de Ptolemaios dışı yeniliklerin Al-Tusi'den önce atfedilmesi üzerine yazılmıştır."
  id: "Buku George Saliba tentang ilmu pengetahuan Islam dan renaisans dikutip dalam artikel 'Zij' dan 'Al-Ardi': yang pertama tentang penggunaan 'azij' untuk astrologi meskipun ada keraguan para astronom, dan yang kedua tentang 'The Case of Al-Ardi' (hlm. 203) serta atribusi inovasi non-Ptolemaik dalam Al-'Ardi sebelum Al-Tusi, berdasarkan manuskrip Maret 621."
