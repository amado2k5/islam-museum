reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026, and its lead and text checked against the recorded revision. It gives Baaba Maal, born in Podor on the Senegal River (its lead dates the birth 13 June 1953; the French article agrees, while the Arabic article and Wikidata give 12 November 1953 — the record follows the Arabic article and Wikidata and carries the date as debated); that he sings primarily in Pulaar and promotes the traditions of the Pulaar-speaking people of Futa Tooro; that he was expected to become a fisherman like his father but learned music under the blind guitarist Mansour Seck, his lifelong friend and family gawlo, from his mother and his school headmaster; music study at the university in Dakar and then in Paris, including courses at the Conservatoire de Paris; his return to study traditional music with Seck and perform with Daande Lenol; Djam Leelii (1989) and the fusion albums Firin' in Fouta (1994) and Nomad Soul (1998, with Brian Eno among its producers); his honour from the Prince Claus Fund in 1998; the Red Hot charity recordings of 1998 and 2002; Live Earth in Johannesburg on 7 July 2007; Television (2009); his work on the Black Hawk Down and Far Cry 2 soundtracks; The Traveller (2016) and 'There Will Be Time' with Mumford & Sons; his vocals on the Black Panther film scores (2018 and 2022), including a cameo as a funeral singer in the sequel; his appointment as a UNDP Youth Emissary in July 2003; the launch of his charity Nann-K on 28 March 2016; his December 2019 pledge to fight desertification by planting trees; and his naming as a UNCCD Goodwill Ambassador in April 2023. The article states no religion for him."
