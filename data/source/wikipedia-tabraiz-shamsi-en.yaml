summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن تبريز شمسي ⁦(مواليد 1990)⁩، لاعب الكريكت الجنوب أفريقي؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في جوهانسبرغ في 18 فبراير 1990، وظهوره الدولي سنة 2016، وكونه أكثر آخذي الويكيت لجنوب أفريقيا في العشرينيات الدولية، وتصدّره تصنيف المجلس الدولي لراميي العشرينيات سنة 2021، وأول خمسة ويكيت له في مباريات اليوم الواحد سنة 2021."
  en: "English Wikipedia article on Tabraiz Shamsi (born 1990), the South African cricketer; used for entity facts only. It records his birth in Johannesburg on 18 February 1990, his international debut in 2016, his standing as South Africa's highest wicket-taker in T20 Internationals, his rise to the top of the ICC T20I bowling rankings in 2021, and his first ODI five-wicket haul in 2021."
  es: "Artículo de la Wikipedia en inglés sobre Tabraiz Shamsi (nacido en 1990), el jugador de críquet sudafricano; utilizado únicamente para datos sobre la persona. Registra su nacimiento en Johannesburgo el 18 de febrero de 1990, su debut internacional en 2016, su posición como el jugador sudafricano con más wickets en partidos internacionales T20, su ascenso a la cima del ranking de lanzadores T20I de la ICC en 2021 y su primera actuación de cinco wickets en un partido ODI en 2021."
  fr: "Article de Wikipédia en anglais sur Tabraiz Shamsi (né en 1990), le joueur de cricket sud-africain; utilisé uniquement à des fins d'information. Il relate sa naissance à Johannesburg le 18 février 1990, ses débuts internationaux en 2016, son statut de meilleur preneur de guichets sud-africain en T20 internationaux, son ascension au sommet du classement ICC des lanceurs en T20I en 2021 et sa première performance à cinq guichets en ODI en 2021."
  ur: "جنوبی افریقی کرکٹر تبریز شمسی ⁦(پیدائش 1990)⁩ پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 18 فروری 1990 کو جوہانسبرگ میں ان کی پیدائش، 2016 میں ان کا بین الاقوامی ڈیبیو، T20 انٹرنیشنلز میں جنوبی افریقہ کے سب سے زیادہ وکٹیں لینے والے کھلاڑی کے طور پر ان کا کھڑا ہونا، 2021 میں ICC T20I بولنگ رینکنگ میں ان کا سرفہرست ہونا، اور 2021 میں ان کا پہلا ون ڈے میں پانچ وکٹیں حاصل کرنے کا ریکارڈ درج ہے۔"
  tr: "Tabriz Shamsi (d. 1990), Güney Afrikalı kriketçi hakkında İngilizce Wikipedia makalesi; sadece varlık bilgileri için kullanılmıştır. 18 Şubat 1990'da Johannesburg'da doğdu, 2016'da uluslararası maçına çıktı, 1920'lerde Güney Afrika için en çok wicket alan oyuncuydu, 2021'de Uluslararası Yirmiler Atıcılar Konseyi sıralamasında zirveye çıktı ve 2021'de tek günlük maçlarda ilk beş wicketini aldı."
  id: "Artikel Wikipedia bahasa Inggris tentang Tabriz Shamsi (lahir 1990), pemain kriket Afrika Selatan; hanya digunakan untuk fakta entitas. Ia lahir di Johannesburg pada 18 Februari 1990, melakukan debut internasionalnya pada 2016, menjadi pengambil wicket terbanyak untuk Afrika Selatan pada tahun 1920-an, memuncaki peringkat International Council of Twenties Shooters pada 2021, dan mengambil lima wicket pertamanya dalam pertandingan satu hari pada 2021."
