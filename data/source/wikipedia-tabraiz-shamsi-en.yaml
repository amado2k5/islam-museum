summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن تبريز شمسي (مواليد 1990)، لاعب الكريكت الجنوب أفريقي؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في جوهانسبرغ في 18 فبراير 1990، وظهوره الدولي سنة 2016، وكونه أكثر آخذي الويكيت لجنوب أفريقيا في العشرينيات الدولية، وتصدّره تصنيف المجلس الدولي لراميي العشرينيات سنة 2021، وأول خمسة ويكيت له في مباريات اليوم الواحد سنة 2021."
  en: "English Wikipedia article on Tabraiz Shamsi (born 1990), the South African cricketer; used for entity facts only. It records his birth in Johannesburg on 18 February 1990, his international debut in 2016, his standing as South Africa's highest wicket-taker in T20 Internationals, his rise to the top of the ICC T20I bowling rankings in 2021, and his first ODI five-wicket haul in 2021."
