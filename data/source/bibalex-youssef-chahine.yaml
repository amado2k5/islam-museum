summary:
  ar: "نعي مكتبة الإسكندرية ليوسف شاهين ⁦(3 أغسطس 2008)⁩؛ يذكر وفاته في القاهرة وجنازته في الكاتدرائية الكاثوليكية اليونانية ودفنه مع أسرته في الإسكندرية، وولادته سنة 1926 لأسرة مسيحية، وهو مصدر مستقل ثانٍ لخلفية أسرته لا لدينه الشخصي."
  en: "Bibliotheca Alexandrina obituary of Youssef Chahine (3 August 2008); it records his death in Cairo, his funeral in the Greek Catholic cathedral and burial with his family in Alexandria, and his birth in 1926 to a Christian family — a second independent source for his family background, not for a personal affiliation."
  es: "La necrología de Youssef Chahine publicada en la Biblioteca de Alejandría el 3 de agosto de 2008 recoge su fallecimiento en El Cairo, su funeral en la catedral greco-católica y su entierro con su familia en Alejandría, así como su nacimiento en 1926 en el seno de una familia cristiana; esta es una segunda fuente independiente sobre sus antecedentes familiares, no sobre su afiliación personal."
  fr: "La notice nécrologique de Youssef Chahine dans la Bibliotheca Alexandrina (3 août 2008) relate son décès au Caire, ses funérailles dans la cathédrale gréco-catholique et son inhumation avec sa famille à Alexandrie, ainsi que sa naissance en 1926 dans une famille chrétienne — une deuxième source indépendante concernant ses origines familiales, et non une affiliation personnelle."
  ur: "ببلیوتھیکا الیگزینڈرینا یوسف چاہنے کی موت ⁦(3 اگست 2008)⁩؛ اس میں قاہرہ میں ان کی موت، یونانی کیتھولک کیتھیڈرل میں ان کی تدفین اور اسکندریہ میں اپنے خاندان کے ساتھ تدفین، اور ان کی پیدائش 1926 میں ایک مسیحی خاندان میں ریکارڈ کی گئی ہے۔"
  tr: "Youssef Chahine için Bibliotheca Alexandrina ölüm ilanı (3 Ağustos 2008); Kahire'deki ölümü, Yunan Katolik Katedrali'ndeki cenazesi ve ailesiyle birlikte İskenderiye'de defnedilmesi gibi bir belgede yer alır. 1926 yılında Hristiyan bir ailede doğdu ve kişisel dini yerine aile kökeni için ikinci bağımsız bir kaynak olarak hizmet etti."
  id: "Obituari Bibliotheca Alexandrina untuk Youssef Chahine (3 Agustus 2008); menyebutkan kematiannya di Kairo, pemakamannya di Katedral Katolik Yunani, dan pemakamannya bersama keluarganya di Alexandria. Ia lahir pada tahun 1926 dari keluarga Kristen, menjadi sumber independen kedua untuk latar belakang keluarganya daripada agama pribadinya."
title: "Alexandria Says Farewell to Chahine"
