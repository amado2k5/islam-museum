  ar: "نعي مكتبة الإسكندرية ليوسف شاهين (3 أغسطس 2008)؛ يذكر وفاته في القاهرة وجنازته في الكاتدرائية الكاثوليكية اليونانية ودفنه مع أسرته في الإسكندرية، وولادته سنة 1926 لأسرة مسيحية، وهو مصدر مستقل ثانٍ لخلفية أسرته لا لدينه الشخصي."
  en: "Bibliotheca Alexandrina obituary of Youssef Chahine (3 August 2008); it records his death in Cairo, his funeral in the Greek Catholic cathedral and burial with his family in Alexandria, and his birth in 1926 to a Christian family — a second independent source for his family background, not for a personal affiliation."
