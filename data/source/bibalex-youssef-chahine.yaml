reliability_note: "Institutional obituary read on 25 October 2026. It states Chahine passed away in Cairo four weeks after slipping into a coma following a brain haemorrhage, that his funeral took place in Cairo's Greek Catholic cathedral on Monday 28 July 2008 and he was buried with his family in Alexandria, and that he was born in 1926 'to a Christian family of Syrian, Lebanese, Greek and Italian roots'. It also covers Victoria College, study in California, his debut Baba Amin (1950), some 40 films, The Sparrow (1973), Is It Chaos? (2007), and the Cannes 50th anniversary lifetime achievement award in 1997. Used in the person record only for the death, funeral and family-background facts; it does not attest a personal religious affiliation for Chahine himself."
