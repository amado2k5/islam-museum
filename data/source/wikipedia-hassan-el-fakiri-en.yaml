reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision, fetched by revision id. It gives him as born 18 April 1977 in Amezzaourou, a town in the commune of Temsamane, Morocco; a right back and defensive midfielder who began at Lyn (debut 28 May 1995, the fans' player of the year in 1997), moved to Brann and then Monaco in 2000 (an unused substitute in the 2004 Champions League final), had loans back to Lyn and to Rosenborg, played for Borussia Mönchengladbach from 2005 until their 2007 relegation, and returned to Brann, winning the 2007 Norwegian title before retiring in 2014; eight caps for Norway. The infobox also carries his coaching posts: manager of Os (2015-2017), assistant manager at Saint-Étienne (2024-2026) and player development coach at Brann (2026-). It makes no statement of his religion. He is a different person from the sixteenth-century Ottoman writer filed in this museum as person/fakiri."
