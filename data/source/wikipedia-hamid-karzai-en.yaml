summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حامد كرزاي؛ تُستخدم لوقائع الكيان فقط. تروي مولده في 24 ديسمبر 1957 في كرز قرب قندهار، وتعليمه في كابل والهند، وجمعه التبرعات للمجاهدين ومنصب نائب وزير الخارجية، وقيادته لأفغانستان من 2001 إلى 2014 وانتخابيه 2004 و2009، والانتقادات الدولية لرئاسته بشأن الفساد وانتخابات 2009 وردوده عليها. لا يرد فيها دين شخصي له؛ وذكرها للدين يتعلق بسياسة حكومته."
  en: "English Wikipedia article on Hamid Karzai; used for entity facts only. It recounts his birth on 24 December 1957 at Karz near Kandahar, his schooling at Kabul and in India, his mujahideen fundraising and deputy foreign ministry, his leadership of Afghanistan from 2001 to 2014 with elections in 2004 and 2009, and the international criticism of his presidency over corruption and the 2009 election with his answers. It names no personal religion for him; its religion content concerns his government's policy."
  ur: "حامد کرزئی پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے مستعمل۔ اس میں 24 دسمبر 1957ء کو کرز، نزد قندھار میں ان کی پیدائش، کابل اور بھارت میں ان کی تعلیم، مجاہدین کے لیے چندہ مہم اور نائب وزیر خارجہ کا عہدہ، 2001ء سے 2014ء تک افغانستان کی قیادت اور 2004ء و 2009ء کے انتخابات، اور بدعنوانی و 2009ء کے انتخابات پر ان کی صدارت پر بین الاقوامی تنقید اور ان کے جوابات بیان ہوئے ہیں۔ اس میں ان کا کوئی ذاتی مذہب درج نہیں؛ مذہبی مواد ان کی حکومت کی پالیسی سے متعلق ہے۔"
  es: "Artículo de la Wikipedia en inglés sobre Hamid Karzai; utilizado únicamente para datos sobre la persona. Relata su nacimiento el 24 de diciembre de 1957 en Karz, cerca de Kandahar, su educación en Kabul y en la India, su labor de recaudación de fondos para los muyahidines y su cargo como viceministro de Asuntos Exteriores, su liderazgo de Afganistán entre 2001 y 2014, con elecciones en 2004 y 2009, y las críticas internacionales a su presidencia por corrupción y las elecciones de 2009, con sus respectivas respuestas. No menciona ninguna religión personal suya; su contenido religioso se centra en la política de su gobierno."
  fr: "Article de Wikipédia en anglais sur Hamid Karzaï; utilisé uniquement pour les informations relatives à l'entité. Il relate sa naissance le 24 décembre 1957 à Karz, près de Kandahar, sa scolarité à Kaboul et en Inde, son rôle dans la collecte de fonds pour les moudjahidines et son poste de vice-ministre des Affaires étrangères, sa direction de l'Afghanistan de 2001 à 2014 (avec les élections de 2004 et 2009), ainsi que les critiques internationales formulées à l'encontre de sa présidence pour corruption et les élections de 2009, et ses réponses à ces critiques. L'article ne mentionne aucune religion personnelle de Karzaï; les informations relatives à la religion concernent la politique de son gouvernement."
  tr: "Hamid Karzai hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 24 Aralık 1957'de Kandahar yakınlarındaki Karz'da doğmasını, Kabil ve Hindistan'daki eğitimini, mücahitler için yaptığı bağış toplamanı, Dışişleri Bakan Yardımcılığı görevini, 2001-2014 ve 2004-2009 seçimleri arasındaki Afganistan liderliğini ve başkanlığına yönelik yolsuzluk ve 2009 seçimleri ile bunlara verdiği tepkiler konusundaki uluslararası eleştirilerini anlatır. Kişisel dininden bahsetmez; din bahsetmesi hükümetinin politikasıyla ilgilidir."
  id: "Artikel Wikipedia bahasa Inggris tentang Hamid Karzai; hanya digunakan untuk fakta entitas tersebut. Artikel ini menceritakan kelahirannya pada 24 Desember 1957 di Karz dekat Kandahar, pendidikannya di Kabul dan India, penggalangan dana untuk mujahidin, posisinya sebagai Wakil Menteri Luar Negeri, kepemimpinannya di Afghanistan dari 2001 hingga 2014 dan pemilihan 2004 dan 2009, serta kritik internasional terhadap masa kepresidenannya terkait korupsi dan pemilihan 2009 serta tanggapannya terhadapnya. Artikel ini tidak menyebutkan agama pribadinya; penyebutan agama terkait dengan kebijakan pemerintahannya."
