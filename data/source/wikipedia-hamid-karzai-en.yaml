summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حامد كرزاي؛ تُستخدم لوقائع الكيان فقط. تروي مولده في 24 ديسمبر 1957 في كرز قرب قندهار، وتعليمه في كابل والهند، وجمعه التبرعات للمجاهدين ومنصب نائب وزير الخارجية، وقيادته لأفغانستان من 2001 إلى 2014 وانتخابيه 2004 و2009، والانتقادات الدولية لرئاسته بشأن الفساد وانتخابات 2009 وردوده عليها. لا يرد فيها دين شخصي له؛ وذكرها للدين يتعلق بسياسة حكومته."
  en: "English Wikipedia article on Hamid Karzai; used for entity facts only. It recounts his birth on 24 December 1957 at Karz near Kandahar, his schooling at Kabul and in India, his mujahideen fundraising and deputy foreign ministry, his leadership of Afghanistan from 2001 to 2014 with elections in 2004 and 2009, and the international criticism of his presidency over corruption and the 2009 election with his answers. It names no personal religion for him; its religion content concerns his government's policy."
  ur: "حامد کرزئی پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے مستعمل۔ اس میں 24 دسمبر 1957ء کو کرز، نزد قندھار میں ان کی پیدائش، کابل اور بھارت میں ان کی تعلیم، مجاہدین کے لیے چندہ مہم اور نائب وزیر خارجہ کا عہدہ، 2001ء سے 2014ء تک افغانستان کی قیادت اور 2004ء و 2009ء کے انتخابات، اور بدعنوانی و 2009ء کے انتخابات پر ان کی صدارت پر بین الاقوامی تنقید اور ان کے جوابات بیان ہوئے ہیں۔ اس میں ان کا کوئی ذاتی مذہب درج نہیں؛ مذہبی مواد ان کی حکومت کی پالیسی سے متعلق ہے۔"
