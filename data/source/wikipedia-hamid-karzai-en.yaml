reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read on 27 October 2026. This writer's fetch route exposed no revision id, so the article is cited by consultation date under the consultation-date fallback and no revision is asserted. The article records the criticism of his government — systemic corruption and the fraud claims around the 2009 election — together with his rebuttals, and says in the lead that he was accused of corruption; the museum's prose carries all of this as attributed criticism, never as settled guilt. The word Sunni does not occur in the article; its only religion content is the Shia Personal Status Law of his government, which is state policy."
