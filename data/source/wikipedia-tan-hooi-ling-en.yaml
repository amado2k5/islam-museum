summary:
  ar: "مقالة ويكيبيديا الإنجليزية — النسخة اللغوية الوحيدة — عن تان هوي لينغ، سيدة الأعمال التي شاركت في تأسيس غراب وكانت مديرتها التشغيلية؛ تذكر نشأتها في كوالالمبور وبيتالينغ جايا لأب مهندس مدني وأم سمسارة، ودراستها للهندسة الميكانيكية في جامعة باث، وعملها في ماكينزي التي رعت ماجستيرها في إدارة الأعمال في هارفارد حيث التقت أنتوني تان، وإطلاقهما مايتكسي سنة 2012، وعودتها الكاملة إلى غراب سنة 2015 واعتزامها التنحي عن أدوارها التشغيلية بنهاية 2023. لا تذكر المقالة أي تاريخ أو سنة ميلاد لها."
  en: "English Wikipedia article - the only language edition - on Tan Hooi Ling, the businesswoman who co-founded Grab and served as its chief operating officer; it records her upbringing in Kuala Lumpur and Petaling Jaya to a civil-engineer father and a remisier mother, her mechanical engineering degree at the University of Bath, her work at McKinsey & Company, which sponsored her Harvard Business School MBA where she met Anthony Tan, their launch of MyTeksi in 2012, her full-time return to Grab in 2015, and her announced step-down from operational roles by the end of 2023. The article gives no birth date or year for her."
