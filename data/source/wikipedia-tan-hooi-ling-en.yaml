summary:
  ar: "مقالة ويكيبيديا الإنجليزية — النسخة اللغوية الوحيدة — عن تان هوي لينغ، سيدة الأعمال التي شاركت في تأسيس غراب وكانت مديرتها التشغيلية؛ تذكر نشأتها في كوالالمبور وبيتالينغ جايا لأب مهندس مدني وأم سمسارة، ودراستها للهندسة الميكانيكية في جامعة باث، وعملها في ماكينزي التي رعت ماجستيرها في إدارة الأعمال في هارفارد حيث التقت أنتوني تان، وإطلاقهما مايتكسي سنة 2012، وعودتها الكاملة إلى غراب سنة 2015 واعتزامها التنحي عن أدوارها التشغيلية بنهاية 2023. لا تذكر المقالة أي تاريخ أو سنة ميلاد لها."
  en: "English Wikipedia article - the only language edition - on Tan Hooi Ling, the businesswoman who co-founded Grab and served as its chief operating officer; it records her upbringing in Kuala Lumpur and Petaling Jaya to a civil-engineer father and a remisier mother, her mechanical engineering degree at the University of Bath, her work at McKinsey & Company, which sponsored her Harvard Business School MBA where she met Anthony Tan, their launch of MyTeksi in 2012, her full-time return to Grab in 2015, and her announced step-down from operational roles by the end of 2023. The article gives no birth date or year for her."
  es: "Artículo de Wikipedia en inglés —la única edición en ese idioma— sobre Tan Hooi Ling, la empresaria que cofundó Grab y se desempeñó como su directora de operaciones; en él se narra su infancia en Kuala Lumpur y Petaling Jaya, hija de un ingeniero civil y una agente de bolsa; su licenciatura en ingeniería mecánica por la Universidad de Bath; su trabajo en McKinsey & Company, que patrocinó su MBA en la Harvard Business School, donde conoció a Anthony Tan; el lanzamiento de MyTeksi en 2012; su regreso a tiempo completo a Grab en 2015; y su anunciada retirada de los cargos operativos a finales de 2023. El artículo no proporciona su fecha ni año de nacimiento."
  fr: "L'article de Wikipédia en anglais – la seule version disponible – consacré à Tan Hooi Ling, la femme d'affaires qui a cofondé Grab et en a été la directrice des opérations, retrace son enfance à Kuala Lumpur et Petaling Jaya, fille d'un ingénieur civil et d'une courtier, ses études d'ingénierie mécanique à l'Université de Bath, son expérience chez McKinsey & Company (qui a financé son MBA à Harvard Business School, où elle a rencontré Anthony Tan), le lancement de MyTeksi en 2012, son retour à temps plein chez Grab en 2015 et son retrait annoncé des fonctions opérationnelles d'ici fin 2023. L'article ne mentionne ni sa date ni son année de naissance."
  ur: "انگریزی ویکیپیڈیا مضمون - واحد زبان کا ایڈیشن - Tan Hooi Ling پر، ایک کاروباری خاتون جس نے Grab کی مشترکہ بنیاد رکھی اور اس کے چیف آپریٹنگ آفیسر کے طور پر خدمات انجام دیں۔ اس میں کوالالمپور میں اس کی پرورش اور پیٹلنگ جیا کو ایک سول انجینئر والد اور ایک یادگار ماں کے پاس ریکارڈ کیا گیا ہے، باتھ یونیورسٹی میں اس کی میکینیکل انجینئرنگ کی ڈگری، میک کینسی اینڈ کمپنی میں اس کا کام، جس نے اس کے ہارورڈ بزنس اسکول ایم بی اے کو سپانسر کیا جہاں اس کی ملاقات انتھونی ٹین سے ہوئی، 2012 میں مائی ٹیکسی کے آغاز اور 2012 میں مکمل طور پر واپسی کا اعلان کیا۔ 2023 کے آخر تک آپریشنل کرداروں سے۔ مضمون اس کے لیے کوئی تاریخ پیدائش یا سال نہیں بتاتا۔"
  tr: "İngilizce Wikipedia'daki tek dil versiyonu olan makale, Garab'ın kurucularından ve operasyon yöneticisi olan iş kadını Tan Hui Ling hakkında; Kuala Lumpur'daki yetiştirilme tarzından ve Petaling Jaya'dan inşaat mühendisi bir baba ve bir anneye sahip olması, Bath Üniversitesi'nde makine mühendisliği eğitimi, McKinsey'deki çalışmaları (Harvard'da MBA programını desteklediği ve Anthony Tan ile tanıştığı), 2012'de Mexy'nin lansmanı, 2015'te Ghorab'a tam dönüşü ve 2023 sonuna kadar operasyonel görevlerinden ayrılma niyeti bahsediliyor. Makalede doğum tarihi veya yılı belirtilmemektedir."
  id: "Artikel Wikipedia berbahasa Inggris — satu-satunya versi bahasa — tentang Tan Hui Ling, wanita pengusaha yang ikut mendirikan Garab dan menjadi manajer operasionalnya; artikel tersebut menyebutkan masa kecilnya di Kuala Lumpur dan Petaling Jaya dari ayah insinyur sipil dan ibu mucikari, studinya di teknik mesin di University of Bath, pekerjaannya di McKinsey yang mensponsori gelar MBA di Harvard di mana dia bertemu Anthony Tan, peluncuran Mexy pada 2012, kembalinya penuh ke Ghorab pada 2015, dan niatnya untuk mundur dari peran operasionalnya pada akhir 2023. Artikel tersebut tidak menyebutkan tanggal atau tahun kelahirannya."
