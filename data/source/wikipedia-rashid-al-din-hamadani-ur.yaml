reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). A very short article; it independently confirms his Hamadan birth, his Jewish family, his conversion at thirty and his execution on 13 July 1318. Its statement that the Jami' al-Tawarikh was composed at Abaqa Khan's command is an error — the commission was Ghazan's, per the English and Arabic articles — and is not followed. It names no school for him. Checked 2 November 2026."
