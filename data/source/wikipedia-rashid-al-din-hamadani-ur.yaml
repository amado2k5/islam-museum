summary:
  ar: "مقالة ويكيبيديا الأردية المختصرة عن رشيد الدين طبيب (1247–1318)؛ تنص على ولادته في همدان من أسرة يهودية وقبوله الإسلام في سن الثلاثين وإعدامه في 13 يوليو 1318 عن سبعين عامًا؛ تُستخدم لوقائع الكيان فقط."
  en: "Short Urdu Wikipedia article on Rashid al-Din Tabib (1247-1318); it states he was born in Hamadan into a Jewish family, accepted Islam at the age of thirty, and was executed on 13 July 1318 at the age of seventy; used for entity facts only."
  es: "Breve artículo de Wikipedia en urdu sobre Rashid al-Din Tabib (1247-1318); afirma que nació en Hamadán en una familia judía, aceptó el Islam a la edad de treinta años y fue ejecutado el 13 de julio de 1318 a la edad de setenta años; se utiliza únicamente para datos sobre la persona."
  fr: "Court article de Wikipédia en ourdou sur Rashid al-Din Tabib (1247-1318); il indique qu'il est né à Hamadan dans une famille juive, a accepté l'islam à l'âge de trente ans et a été exécuté le 13 juillet 1318 à l'âge de soixante-dix ans; utilisé uniquement pour les faits concernant l'entité."
  ur: "راشد الدین تبیب (1247-1318) پر مختصر اردو ویکیپیڈیا مضمون؛ اس میں کہا گیا ہے کہ وہ ہمدان میں ایک یہودی گھرانے میں پیدا ہوا، تیس سال کی عمر میں اسلام قبول کیا، اور ستر سال کی عمر میں 13 جولائی 1318 کو پھانسی دے دی گئی۔ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔"
  tr: "Rashid al-Din Tabib (1247–1318) hakkında kısa Urduca Wikipedia makalesi; onun Hamadan'da Yahudi bir ailede doğduğunu, otuz yaşında İslam'a geçtiğini ve 13 Temmuz 1318'de, yetmiş yaşındayken idam edildiğini belirtir; sadece varlığın gerçekleri için kullanılmıştır."
  id: "Artikel singkat Wikipedia dalam bahasa Urdu tentang Rashid al-Din Tabib (1247–1318); menyatakan bahwa ia lahir di Hamadan dari keluarga Yahudi, memeluk Islam pada usia tiga puluh tahun, dan dieksekusi pada 13 Juli 1318, pada usia tujuh puluh tahun; hanya digunakan untuk fakta entitas tersebut."
