summary:
  ar: "مدخل موسوعة إيرانيكا «عارف قزوینی» بقلم جلال متيني؛ يُستخدم لوقائع الكيان. يروي تعليمه في قزوين وإكراه أبيه له على تعلّم الروضة‌خواني، وغنائه في بلاط مظفرالدین شاه ثم تأييده الدستوريين وهجرته إلى إسطنبول وموته في 1 بهمن 1312 ⁦(21 يناير 1934)⁩ ودفنه في صحن ضريح ابن سينا بهمدان."
  en: "Encyclopaedia Iranica entry 'Aref Qazvini' by Jalal Matini; used for entity facts. It recounts his schooling at Qazvin and his father's forcing him to learn rawda-khwani, his singing at Mozaffar al-Din Shah's court, his constitutionalist support and Istanbul exile, and his death on 1 Bahman 1312 (21 January 1934) with burial in the courtyard of the Avicenna mausoleum at Hamadan."
  es: "Entrada de la Enciclopedia Iranica «Aref Qazvini» de Jalal Matini; utilizada para datos sobre la persona. Relata su educación en Qazvin y cómo su padre lo obligó a aprender rawda-khwani, sus cantos en la corte de Mozaffar al-Din Shah, su apoyo al constitucionalismo y su exilio en Estambul, y su muerte el 1 de Bahman de 1312 (21 de enero de 1934), siendo enterrado en el patio del mausoleo de Avicena en Hamadán."
  fr: "L'article « Aref Qazvini » de l'Encyclopaedia Iranica, rédigé par Jalal Matini, est utilisé pour les informations relatives à l'entité. Il relate sa scolarité à Qazvin, l'apprentissage forcé du rawda-khwani par son père, ses chants à la cour de Mozaffar al-Din Shah, son soutien aux constitutionnalistes, son exil à Istanbul et sa mort le 1er Bahman 1312 (21 janvier 1934), avec son inhumation dans la cour du mausolée d'Avicenne à Hamadan."
  ur: "انسائیکلوپیڈیا ایرانیکا اندراج 'عارف قزوینی' از جلال متینی؛ ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں قزوین میں ان کی اسکول کی تعلیم اور اس کے والد کی طرف سے انھیں ردا خوانی سیکھنے پر مجبور کرنے، مظفر الدین شاہ کے دربار میں اس کا گانا، اس کی آئینی حمایت اور استنبول جلاوطنی، اور ان کی موت 1 بہمن 1312 ⁦(21 جنوری 1934)⁩ کو حوثی النوم کے صحن میں تدفین کے ساتھ بتائی گئی ہے۔"
  tr: "Iranica Ansiklopedisi 'Aref Qazvini' için Jalal Matini tarafından yazılan kayıt; varlığın olayları için kullanılmıştır. Kitap, Kazvin'deki eğitimini, babasının Khawani anaokulunu okumaya zorlamasını, Mozaffar al-Din Şah'ın sarayında şarkı söylemesini, ardından Anayasacılara verdiği desteği, İstanbul'a göçü, 1 Bahman 1312 Hicri'deki ölümü (21 Ocak 1934) ve Hamadan'daki İbn Sina'nın türbesinin avlusuna defnedilmesini anlatır."
  id: "Entri untuk Ensiklopedia Iranica 'Aref Qazvini' oleh Jalal Matini; digunakan untuk peristiwa entitas tersebut. Buku ini menceritakan pendidikannya di Qazvin, paksaan ayahnya untuk belajar di taman kanak-kanak Khawani, nyanyiannya di istana Mozaffar al-Din Shah, kemudian dukungannya kepada kaum Konstitusionalis, migrasinya ke Istanbul, kematiannya pada 1 Bahman 1312 H (21 Januari 1934), dan pemakamannya di halaman mausoleum Ibn Sina di Hamadan."
