summary:
  ar: "مدخل موسوعة إيرانيكا «عارف قزوینی» بقلم جلال متيني؛ يُستخدم لوقائع الكيان. يروي تعليمه في قزوين وإكراه أبيه له على تعلّم الروضة‌خواني، وغنائه في بلاط مظفرالدین شاه ثم تأييده الدستوريين وهجرته إلى إسطنبول وموته في 1 بهمن 1312 (21 يناير 1934) ودفنه في صحن ضريح ابن سينا بهمدان."
  en: "Encyclopaedia Iranica entry 'Aref Qazvini' by Jalal Matini; used for entity facts. It recounts his schooling at Qazvin and his father's forcing him to learn rawda-khwani, his singing at Mozaffar al-Din Shah's court, his constitutionalist support and Istanbul exile, and his death on 1 Bahman 1312 (21 January 1934) with burial in the courtyard of the Avicenna mausoleum at Hamadan."
