reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. A separately edited article from the English one: it agrees on the Panipat birth (1837), the Delhi studies, the Hisar collector's office in 1856, the eight years as tutor in Nawab Mustafa Khan Shefta's household, the Lahore Government Book Depot, the Musaddas written in 1879 at Sir Syed's request, and the death at Panipat on 31 December 1914. It adds that Hali later became Ghalib's student in Delhi, dates the Shamsul Ulema title to 1904, and lists works the English article omits (Majalis-un-Nisa, written in Lahore for schoolgirls and long in the curriculum; Tiryaq-e-Masmum, a reply to the missionary Imaduddin; Shawahid-e-Ilham). Its infobox gives his religion as Islam, with no school."
