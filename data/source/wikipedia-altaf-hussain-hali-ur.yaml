summary:
  ar: "مقالة ويكيبيديا الأردية عن الطاف حسين حالي؛ تُستخدم لوقائع الكيان فقط. تؤكد مولده سنة 1837 في بانيبات ووفاته فيها في 31 ديسمبر 1914، وتؤرخ منحه لقب شمس العلماء بسنة 1904، وتفصّل قائمة مؤلفاته ومنها «مجالس النساء» و«ترياق مسموم»."
  en: "Urdu Wikipedia article on Altaf Hussain Hali; used for entity facts only. It confirms his birth at Panipat in 1837 and death there on 31 December 1914, dates the title Shamsul Ulema to 1904, and gives a fuller works list including Majalis-un-Nisa and Tiryak-e-Masmum."
  es: "Artículo de Wikipedia en urdu sobre Altaf Hussain Hali; utilizado únicamente para datos biográficos. Confirma su nacimiento en Panipat en 1837 y su fallecimiento allí el 31 de diciembre de 1914, fecha el título de Shamsul Ulema en 1904 y ofrece una lista más completa de sus obras, incluyendo Majalis-un-Nisa y Tiryak-e-Masmum."
  fr: "Article de Wikipédia en ourdou sur Altaf Hussain Hali; utilisé uniquement pour les informations relatives à l’entité. Il confirme sa naissance à Panipat en 1837 et son décès dans cette même ville le 31 décembre 1914, date l’obtention du titre de Shamsul Ulema à 1904 et fournit une liste plus complète de ses œuvres, notamment Majalis-un-Nisa et Tiryak-e-Masmum."
  ur: "الطاف حسین حالی پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1837 میں پانی پت میں ان کی پیدائش اور 31 دسمبر 1914 کو وہیں وفات کی تصدیق کرتا ہے، شمس العلماء کا لقب 1904 کو بتاتا ہے، اور مجالس النساء اور تریاقِ مسمم سمیت مکمل کاموں کی فہرست دیتا ہے۔"
  tr: "Taf Hussain Hali hakkında Urduca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1837'de Panipat'ta doğduğunu ve 31 Aralık 1914'te orada öldüğünü doğrular, ayrıca 1904'te Shams al-Ulama unvanını verdiğini belirtir. \"Majalis al-Nisa\" ve \"Zehirli Panzehir\" gibi eserlerini detaylandırır."
  id: "Artikel Wikipedia Urdu tentang Taf Hussain Hali; hanya digunakan untuk fakta entitas tersebut. Artikel ini mengonfirmasi kelahirannya pada tahun 1837 di Panipat dan kematiannya di sana pada 31 Desember 1914, serta menandai pemberian gelar Shams al-Ulama pada tahun 1904. Artikel ini merinci karya-karyanya termasuk \"Majalis al-Nisa\" dan \"Penawar Beracun.\""
