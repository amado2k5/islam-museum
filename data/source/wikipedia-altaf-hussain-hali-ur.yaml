  en: "Urdu Wikipedia article on Altaf Hussain Hali; used for entity facts only. It confirms his birth at Panipat in 1837 and death there on 31 December 1914, dates the title Shamsul Ulema to 1904, and gives a fuller works list including Majalis-un-Nisa and Tiryak-e-Masmum."
