reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026): a fact is used only where the article cites a source for it. Read in full on 7 November 2026 (page copy crawled 22 June 2026). The lead and infobox give Ramtanu Gaud Panday, born c. 1493 at Gwalior into a Hindu Gaur Brahmin family, died 26 April 1589 at Gwalior. The body warns that his birth year is unclear (about 1493, or between 1493 and 1506) and that historical facts are difficult to extract from the extensive and contradictory legends around him, citing Bonnie C. Wade, Imaging Sound (1998). It gives his father Mukund Ram, a poet and musician of Gwalior; his first break at the court of Raja Man Singh Tomar; his discipleship to Swami Haridas; most of his adult life under Raja Ramchandra Singh of Rewa (r. 1555–1592); and his arrival at Akbar's court in 1562, 'still a Vaishnava musician', citing Babineau (1979), after which Akbar counted him among the Navaratnas and gave him the honorific Mian. Its Schooling section splits his formation by tradition — Hindu legends give Haridas, Muslim biographies the Sufi mystic Muhammad Ghaus — and quotes Wade that the evidence suggests Tansen was less affiliated with either religion than with music. Its Family section carries, labelled as legend, his marriage to a daughter of Akbar 'for which he had to convert to Islam'. Its Death section gives two accounts — 1586 at Delhi with Hindu funeral customs, per some Islamic historians, against the Akbarnama's 26 April 1589 with mostly Muslim customs — records that scholars refute the conversion, and places his burial in the mausoleum complex of Muhammad Ghaus at Gwalior. No revision id was exposed by the fetched copy, so no revision id is recorded; the access date stands in its place, on the consultation-date precedent of recent records."
