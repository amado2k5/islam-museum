  ar: "مقالة ويكيبيديا العربية عن محمد شياع السوداني؛ تُستخدم لوقائع الكيان فقط. تعطي اسمه الكامل محمد شياع صبار حاتم السوداني وولادته في 4 آذار 1970 ببغداد، ويعطي صندوق معلوماتها حقل دين «الإسلام» وحقل طائفة منفصلًا «الشيعة»، وهما حقلا صندوق من أسرة واحدة، وتصنّفه ضمن «شيعة عراقيون»."
  en: "Arabic Wikipedia article on Mohammed Shia' al-Sudani; used for entity facts only. It gives his full name, Mohammed Shia' Sabbar Hatim al-Sudani, and his birth on 4 March 1970 at Baghdad; its infobox carries a religion field 'Islam' and a separate sect field 'Shia' — infobox fields of one family — and it files him under 'Iraqi Shia', a category filing."
