reliability_note: "Scholarly encyclopedia entry by Vanessa Martin, read in full on 26 October 2026; with the English Wikipedia article, one of the record's two text sources for Nouri. It frames his whole career inside Twelver Shi'ism: study in the Shi'ite shrine cities (the Atabat) under 'the prominent Shi'ite theologian Mirza Hasan Shirazi', his standing as a mojtahed, and his own definition of the assembly he wanted as one meant 'to serve and assist the Twelver Shi'ite government, and to protect the rights of the followers of the Ja'fari faith'. Its Hijri dates are its own: birth 2 Dhu'l-Qa'da 1259, converted by the entry to 24 November 1843 (English Wikipedia gives 24 December 1843), and execution 13 Rajab 1327, which converts to 31 July 1909 although the entry prints 'July 7, 1909' beside it — an internal inconsistency disclosed in the record."
