summary:
  ar: "مدخل موسوعة إيرانيكا (Encyclopaedia Iranica) «نوري، فضل الله» بقلم فانيسا مارتن؛ يُستخدم لوقائع الكيان. يعطي ميلاده في لاشك بكوجور من مازندران في 2 ذي القعدة 1259 ⁦(24 نوفمبر 1843)⁩ وإعدامه في طهران في 13 رجب 1327، ودراسته في مدن العتبات الشيعية عند ميرزا حسن الشيرازي، وعودته إلى طهران نحو 1882-83 حتى غدا أبرز علمائها وفقهائها، ودفاعه عن دستورية مقيدة بالشريعة."
  en: "Encyclopaedia Iranica entry 'NURI, FAŻL-ALLĀH' by Vanessa Martin; used for entity facts. It gives his birth at Lashak in the Kojur district of Mazandaran on 2 Dhu'l-Qa'da 1259 (24 November 1843) and his execution at Tehran on 13 Rajab 1327, his study in the Shi'ite shrine cities under Mirza Hasan Shirazi, his return to Tehran about 1882-83 to become its leading scholar and jurist, and his campaign for a constitutionalism bound by the shari'a."
  es: "Entrada de la Enciclopedia Iranica 'NURI, FAŻL-ALLĀH' de Vanessa Martin; utilizada para datos sobre la entidad. Indica su nacimiento en Lashak, en el distrito de Kojur de Mazandaran, el 2 de Dhu'l-Qa'da de 1259 (24 de noviembre de 1843) y su ejecución en Teherán el 13 de Rajab de 1327, sus estudios en las ciudades santuario chiítas con Mirza Hasan Shirazi, su regreso a Teherán alrededor de 1882-83 para convertirse en su principal erudito y jurista, y su campaña por un constitucionalismo regido por la sharia."
  fr: "L'article « NURI, FAŻL-ALLĀH » de l'Encyclopaedia Iranica, rédigé par Vanessa Martin, est utilisé pour les informations relatives à cette personne. Il indique sa naissance à Lashak, dans le district de Kojur (Mazandaran), le 2 Dhu'l-Qa'da 1259 (24 novembre 1843), son exécution à Téhéran le 13 Rajab 1327, ses études dans les villes saintes chiites auprès de Mirza Hasan Shirazi, son retour à Téhéran vers 1882-1883 où il devint un éminent érudit et juriste, et son combat pour un constitutionnalisme fondé sur la charia."
  ur: "انسائیکلوپیڈیا ایرانیکا اندراج 'نوری، فاضل اللہ' از وینیسا مارٹن؛ ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 2 ذوالقعدہ 1259 ⁦(24 نومبر 1843)⁩ کو مازندران کے ضلع کوجور میں لشکر میں ان کی پیدائش اور 13 رجب 1327 کو تہران میں اس کی پھانسی، مرزا حسن شیرازی فقیہ کے تحت شیعہ مزاروں کے شہروں میں اس کا مطالعہ، اور شریعت کے لیے اس کی مہم کا آغاز ہوا۔"
  tr: "Encyclopaedia Iranica girişi \"Nouri, Fazlallah\" Vanessa Martin tarafından; varlığın gerçekleri için kullanılmıştır. 2 Dhu al-Qi'dah 1259'da (24 Kasım 1843) Mazandaran'ın Kojur bölgesindeki Lashka'da doğdu, 13 Rajab 1327'de Tahran'da idam edildi, Şii türbelerinde Mirza Hasan el-Şirazi'nin yanında eğitim aldı, 1882-83 civarında Tahran'a döndü ve şeriatla bağlı anayasaya bağlılığı savunan en önde gelen alim ve hukukçulardan biri oldu."
  id: "Entri Ensiklopedia Iranica \"Nouri, Fazlallah\" oleh Vanessa Martin; digunakan untuk fakta entitas. Ia lahir di Lashka, Kojur, Mazandaran, pada 2 Dhu al-Qi'dah 1259 (24 November 1843), dieksekusi di Teheran pada 13 Rajab 1327, belajar di makam Syiah di bawah Mirza Hasan al-Shirazi, kembali ke Teheran sekitar tahun 1882-83, dan menjadi salah satu ulama dan ahli hukum paling menonjol, membela konstitusionalitas yang terikat oleh Syariah."
