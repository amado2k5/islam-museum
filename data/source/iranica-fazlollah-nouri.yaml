summary:
  ar: "مدخل موسوعة إيرانيكا (Encyclopaedia Iranica) «نوري، فضل الله» بقلم فانيسا مارتن؛ يُستخدم لوقائع الكيان. يعطي ميلاده في لاشك بكوجور من مازندران في 2 ذي القعدة 1259 (24 نوفمبر 1843) وإعدامه في طهران في 13 رجب 1327، ودراسته في مدن العتبات الشيعية عند ميرزا حسن الشيرازي، وعودته إلى طهران نحو 1882-83 حتى غدا أبرز علمائها وفقهائها، ودفاعه عن دستورية مقيدة بالشريعة."
  en: "Encyclopaedia Iranica entry 'NURI, FAŻL-ALLĀH' by Vanessa Martin; used for entity facts. It gives his birth at Lashak in the Kojur district of Mazandaran on 2 Dhu'l-Qa'da 1259 (24 November 1843) and his execution at Tehran on 13 Rajab 1327, his study in the Shi'ite shrine cities under Mirza Hasan Shirazi, his return to Tehran about 1882-83 to become its leading scholar and jurist, and his campaign for a constitutionalism bound by the shari'a."
