summary:
  ar: "مدخل «حافظ كتب» في موسوعة TDV الإسلامية لإسماعيل أرونسال: الموظفون في مكتبات الأوقاف العثمانية، وما تشترطه الوقفيات فيهم من أمانة ومعرفة بأسماء الكتب، وواجباتهم من حفظ الكتب وإعارتها بضمان ومراقبة القراء وترميم المجلدات، ومراتبهم ورواتبهم بالأقجة ومساكنهم ومساعدوهم ⁦(الياقمة)⁩."
  en: "The TDV İslâm Ansiklopedisi entry on the hafiz-i kutub by İsmail E. Erünsal: the officers of the Ottoman waqf libraries, the honesty and bibliographic knowledge the endowment deeds required, their duties of guarding, lending against pledge, watching readers and reporting worn bindings, their graded ranks, akçe salaries, housing and rations, and the apprentice 'yamak'."
  ur: "TDV اسلام دائرۃ المعارف کا مضمون «حافظ کتب» اسماعیل ارونسال کی تحریر: عثمانی وقف کتب خانوں کے ملازمین، وقف ناموں میں مطلوب امانت و کتب شناسی، کتب کی حفاظت، رہن کے عوض عاریت، قارئین کی نگرانی اور تجدید کی اطلاع جیسی ذمہ داریاں، درجات، اقچہ تنخواہیں، رہائش و راشن اور معاون «یماق»۔"
  es: "La entrada de İsmail E. Erünsal en la TDV İslâm Ansiklopedisi sobre el hafiz-i kutub: los funcionarios de las bibliotecas waqf otomanas, la honestidad y el conocimiento bibliográfico que exigían las escrituras de donación, sus deberes de custodia, préstamo contra prenda, vigilancia de los lectores e informe sobre encuadernaciones desgastadas, sus rangos escalonados, salarios akçe, vivienda y raciones, y el aprendiz 'yamak'."
  fr: "L'article de TDV İslâm Ansiklopedisi sur le hafiz-i kutub par İsmail E. Erünsal: les officiers des bibliothèques waqf ottomanes, l'honnêteté et les connaissances bibliographiques requises par les actes de dotation, leurs devoirs de garde, de prêt contre gage, de surveillance des lecteurs et de signalement des reliures usées, leurs grades hiérarchisés, leurs salaires akçe, leur logement et leurs rations, et l'apprenti 'yamak'."
  tr: "TDV İslami Ansiklopedisi'nde İsmail Aronsal'ın \"Hafız Kitab\" maddesi: Osmanlı vakıf kütüphanelerindeki çalışanlar ve vakıfların onlardan kitap isimleri hakkında güvenilirlik ve bilgi açısından neler beklediği, okuyucuların garantisi ve gözetimi altında kitapları koruma ve ödünç verme, ciltlerin restorasyonu, rütbeleri, maaşları, ikametgahları ve yardımcıları (Yaqma) bakımından neler beklendiği."
  id: "Entri tentang \"Hafiz Kitab\" dalam Ensiklopedia Islam TDV oleh Ismail Aronsal: Karyawan di perpustakaan wakaf Ottoman, dan apa yang dibutuhkan oleh dana abadi dari mereka dalam hal kepercayaan dan pengetahuan tentang nama-nama buku, tugas mereka dalam melestarikan dan meminjamkan buku di bawah jaminan dan pengawasan pembaca, memulihkan buku, pangkat, gaji, dan tempat tinggal mereka, serta asisten mereka (Yaqma)."
