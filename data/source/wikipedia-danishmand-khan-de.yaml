reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). A short article resting, by its own literature list, on M. Athar Ali's Encyclopaedia of Islam entry 'S̲h̲afīʿā Yazdi' and on Muhammad Salih Kamboh's Amal-i Salih. It names the man Shafi'a of Yazd, traces his course from merchant at Ahmednagar to Shah Jahan's military service, the title Danishmand Khan granted in 1654/55, and the office of Mir Bakhshi under Aurangzeb, and gives his death in 1670; it gives no birth year and no place of death, and none is built in the person record. It records that knowledge of him rests on François Bernier's letters, with Niccolò Manucci confirming Bernier's portrait. Checked 1 November 2026."
