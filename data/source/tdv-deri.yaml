summary:
  ar: "مدخل «جلد» في موسوعة TDV الإسلامية التركية في ثلاثة أقسام: تاريخ الجلد ودباغته عند العرب الأوائل ونحو ذلك لنبي بوزكورت، وأحكام الجلد الفقهية لمصطفى باكتير، وصناعة الجلود عند الأتراك لزكي تكين، وفيه دباغو إسطنبول وطائفتهم وشركتهم."
  en: "The TDV İslâm Ansiklopedisi entry on leather, in three parts: the history of hides and tanning among the early Arabs by Nebi Bozkurt, the legal rulings on hides by Mustafa Baktır, and leather-working among the Turks by Zeki Tekin, with the Istanbul tanners, their guild and their company."
  es: "La entrada de la TDV İslâm Ansiklopedisi sobre el cuero, en tres partes: la historia de las pieles y el curtido entre los primeros árabes por Nebi Bozkurt, las resoluciones legales sobre las pieles por Mustafa Baktır y el trabajo del cuero entre los turcos por Zeki Tekin, con los curtidores de Estambul, su gremio y su compañía."
  fr: "L'article de TDV İslâm Ansiklopedisi sur le cuir, en trois parties: l'histoire des peaux et du tannage chez les premiers Arabes par Nebi Bozkurt, les décisions juridiques sur les peaux par Mustafa Baktır et le travail du cuir chez les Turcs par Zeki Tekin, avec les tanneurs d'Istanbul, leur guilde et leur compagnie."
  ur: "چمڑے پر TDV İslâm Ansiklopedisi کا اندراج، تین حصوں میں: نبی بوزکورٹ کے ذریعہ ابتدائی عربوں میں چھپائی اور ٹیننگ کی تاریخ، مصطفی بکتر کی کھالوں کے بارے میں قانونی احکام، اور زیکی ٹیکین کے ذریعے ترکوں کے درمیان چمڑے کا کام، استنبول کے ٹینر اور ان کی کمپنی کے ساتھ۔"
  tr: "Türk İslami TDV Ansiklopedisi'ndeki \"Deri\" maddesi üç bölüme ayrılmıştır: erken Araplar arasında deri tarihi ve tabaklanışı ile Peygamber Bozkurt'un benzer eserleri; Mustafa Bakıtir'in deri üzerine fıkıh kararları; ve Türkler arasında Zaki Tekin'in deri endüstrisi, İstanbul tabakçıları, mezhebi ve şirketini kapsar."
  id: "Entri \"Kulit\" dalam Ensiklopedia Islam Turki TDV dibagi menjadi tiga bagian: sejarah kulit dan penyamakan kulitnya di kalangan orang Arab awal dan karya serupa oleh Nabi Bozkurt; aturan yurisprudensi tentang kulit oleh Mustafa Bakıtir; dan industri kulit di kalangan Turki oleh Zaki Tekin, yang mencakup para penyamak kulit Istanbul, sekte mereka, dan perusahaan mereka."
