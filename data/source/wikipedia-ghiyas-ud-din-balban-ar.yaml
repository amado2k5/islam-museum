reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It gives his reign as 1266-1287, his service as the preceding sultan's deputy, his designation of his grandson Kai Khusrau (son of his son Muhammad, killed against the Mongols) over his surviving son Bughra Khan, and his death at the end of 685 AH, corresponding to 1287 — a pairing the English article's 13 January 1287 falls inside. Caution: the same article pairs his accession with '644 AH', which is 1246-47 CE and belongs to his becoming deputy, not sultan; that pairing is not used. It gives no birth year and names no school for him. Checked 1 November 2026."
