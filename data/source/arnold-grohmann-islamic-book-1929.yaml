summary:
  ar: "«الكتاب الإسلامي: مساهمة في فنّه وتاريخه من القرن السابع إلى الثامن عشر الميلادي»، إصدار مؤسسة بيغاسوس عام 1929 لمعرض «الكتاب الإسلامي» بباريس، ويقسمه مؤلفاه قسمين: يكتب أدولف غرومان القسم الأول عن الفترة المبكرة ⁦(المنمنمات، الزخرفة، التجليد)⁩ والسير توماس أرنولد القسم الثاني عن التصوير الفارسي والمغولي والتركي وفن صناعة الكتاب، وفيه أثريّ صناعة الورّاقين ودكاكينهم وتجليد الطائف واليمن وأسماء المجلدين الأوائل ونقش أغلفة التيموريين وورشة بهزاد."
  en: "The Islamic Book: A Contribution to Its Art and History from the VII-XVIII Century, published by the Pegasus Press, Paris, in 1929 for the exhibition of the same name. Adolf Grohmann wrote the first part on the early period (miniatures, decoration, bindings) and Sir Thomas Arnold the second on Persian, Mughal and Turkish painting and on Islamic bookcraft — the warraq trade and its bazaar shops, Yemeni and Ta'if bindings, the first named bookbinders, Timurid tooled covers, and Bihzad's workshop."
  ur: "«اسلامی کتاب: ساتویں سے اٹھارھویں صدی تک اس کے فن اور تاریخ کا مطالعہ»، بیگاسس پریس، پیرس، ۱۹۲۹ء، اسی نام کی نمائش کے لیے۔ ایڈولف گروہمان نے پہلا حصہ ابتدائی دور پر لکھا ⁦(مصوری، زخرفہ، جلد سازی)⁩ اور سر تھامس آرنلڈ نے دوسرا حصہ فارسی، مغل اور ترکی مصوری اور اسلامی کتاب سازی پر — ورّاقوں کی صنعت اور ان کی بازار دکانیں، یمن اور طائف کی جلد بندیاں، پہلے نامور مجلد، تیموری نقش شدہ جلدیں اور بہزاد کی ورکشاپ۔"
  es: "El libro islámico: una contribución a su arte e historia desde el siglo VII al XVIII, publicado por Pegasus Press, París, en 1929 para la exposición del mismo nombre. Adolf Grohmann escribió la primera parte sobre el período inicial (miniaturas, decoración, encuadernaciones) y Sir Thomas Arnold la segunda sobre la pintura persa, mogol y turca y sobre la artesanía del libro islámico: el comercio de warraq y sus bazares, las encuadernaciones yemeníes y de Ta'if, los primeros encuadernadores conocidos, las cubiertas decoradas timúridas y el taller de Bihzad."
  fr: "L'ouvrage *Le Livre islamique: Contribution à son art et à son histoire du VIIe au XVIIIe siècle*, publié par Pegasus Press à Paris en 1929 à l'occasion de l'exposition éponyme, comprend une première partie rédigée par Adolf Grohmann, consacrée à la période ancienne (miniatures, décoration, reliures), et une seconde partie, signée par Sir Thomas Arnold, traitant de la peinture persane, moghole et turque, ainsi que de l'artisanat du livre islamique: le commerce warraq et ses boutiques de bazar, les reliures yéménites et de Taïf, les premiers relieurs mentionnés, les couvertures timourides ornées et l'atelier de Bihzad."
