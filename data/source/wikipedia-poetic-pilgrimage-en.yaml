  ar: "مقالة ويكيبيديا الإنجليزية عن الثنائي البريطاني بويتك بيلغريمج؛ لوقائع الكيان فقط: تأسيسه سنة 2002 على يد منيرة راشدة وسكينة عبد النور، والفيلم الوثائقي «هيب هوب حجابيز» على الجزيرة سنة 2015، وأعماله 2009–2011، والتغطية في نيو ستيتسمان والأهرام ويكلي والإندبندنت."
  en: "English Wikipedia article on the British duo Poetic Pilgrimage; entity facts only: its founding in 2002 by Muneera Rashida and Sukina Abdul Noor, the 2015 Al Jazeera documentary Hip Hop Hijabis, its releases of 2009–2011, and its coverage in the New Statesman, Al-Ahram Weekly and The Independent."
  es: "Artículo de la Wikipedia en inglés sobre el dúo británico Poetic Pilgrimage; solo datos sobre la entidad: su fundación en 2002 por Muneera Rashida y Sukina Abdul Noor, el documental de Al Jazeera de 2015 Hip Hop Hijabis, sus lanzamientos de 2009 a 2011 y su cobertura en New Statesman, Al-Ahram Weekly y The Independent."
  fr: "Article Wikipédia en anglais sur le duo britannique Poetic Pilgrimage; informations uniquement sur l’entité: sa fondation en 2002 par Muneera Rashida et Sukina Abdul Noor, le documentaire d’Al Jazeera de 2015 Hip Hop Hijabis, ses sorties de 2009 à 2011 et sa couverture dans le New Statesman, Al-Ahram Weekly et The Independent."
  ur: "انگریزی ویکیپیڈیا کا مضمون برطانوی جوڑی شاعرانہ زیارت پر؛ صرف ہستی کے حقائق: منیرا راشدہ اور سکینہ عبدالنور کے ذریعہ 2002 میں اس کی بنیاد، 2015 کی الجزیرہ دستاویزی فلم ہپ ہاپ حجابیس، 2009-2011 کی ریلیز، اور نیو اسٹیٹس مین، الاحرام ویکلی اور دی انڈیپنڈنٹ میں اس کی کوریج۔"
  tr: "İngiliz ikili Poetic Pilgrimage hakkında İngilizce Wikipedia makalesi; sadece varlık için gerçekler: 2002'de Munira Rashida ve Sakina Abdel Nour tarafından kurulması, 2015'te Al Jazeera'da yayınlanan \"Hip Hop Hijabis\" belgeseli, 2009–2011 yılları arasındaki çalışmaları ve New Statesman, Al-Ahram Weekly ile The Independent'taki haberleri."
  id: "Artikel Wikipedia bahasa Inggris tentang duo Inggris Poetic Pilgrimage; hanya untuk entitas fakta: pendiriannya pada 2002 oleh Munira Rashida dan Sakina Abdel Nour, dokumenter \"Hip Hop Hijabis\" di Al Jazeera pada 2015, karya-karyanya dari 2009–2011, dan liputan di New Statesman, Al-Ahram Weekly, dan The Independent."
