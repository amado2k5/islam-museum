summary:
  ar: "مقالة ويكيبيديا الأردية عن حكيم نابينا أنصاري؛ تُستخدم لوقائع الكيان فقط. تعطي اسمه الكامل عبد الوهاب أنصاري ومولده سنة 1868 في يوسف بور بمقاطعة غازي بور ووفاته في دلهي سنة 1941، وفقدانه بصره طفلا، ودراسته في دار العلوم ديوبند وبيعته لرشيد أحمد الكنكوهي، وشهرته بتشخيص النبض ومعالجته لمحمد إقبال، ودفنه بجوار ضريح الكنكوهي."
  en: "Urdu Wikipedia article on Hakim Nabina Ansari; used for entity facts only. It gives his full name as Abdul Wahhab Ansari, his birth in 1868 at Yusufpur in Ghazipur district and his death at Delhi in 1941, his childhood loss of sight, his study at Darul Uloom Deoband and his bay'ah to Rashid Ahmad Gangohi, his fame for pulse diagnosis and his treatment of Muhammad Iqbal, and his burial beside Gangohi's shrine."
