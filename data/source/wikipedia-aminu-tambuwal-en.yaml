reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision, fetched by revision id through the MediaWiki API. It gives Tambuwal as born on 10 January 1966 in Tambuwal town, a lawyer who represented Tambuwal/Kebbe in the House of Representatives from 2003 to 2015 (Deputy Chief Whip 2007–2011, then Speaker 2011–2015), governed Sokoto State from 2015 to 2023, and has sat in the Senate for Sokoto South since 13 June 2023; its infobox records his party as the African Democratic Congress from 2026. It makes no statement of his religion anywhere in its text — the one 'Muslim' in the body describes Muhammadu Buhari — and its categories file him under 'Nigerian Muslims', which is a filing, not an attestation."
