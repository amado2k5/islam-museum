summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أمينو وزيري تامبوال؛ تُستخدم لوقائع الكيان فقط. تروي عضويته في مجلس النواب (2003–2015) ورئاسته له (2011–2015)، وحاكميته لولاية صكتو (2015–2023)، وعضويته في مجلس الشيوخ منذ 2023."
  en: "English Wikipedia article on Aminu Tambuwal; used for entity facts only. It recounts his years in the House of Representatives (2003–2015) including as Speaker (2011–2015), his governorship of Sokoto State (2015–2023), and his Senate seat for Sokoto South since 2023."
  es: "Artículo de la Wikipedia en inglés sobre Aminu Tambuwal; utilizado únicamente para obtener información sobre la persona. En él se relata su trayectoria en la Cámara de Representantes (2003-2015), incluyendo su cargo como Presidente (2011-2015), su mandato como gobernador del estado de Sokoto (2015-2023) y su escaño en el Senado por Sokoto Sur desde 2023."
  fr: "Article de Wikipédia en anglais sur Aminu Tambuwal; utilisé uniquement à des fins d’information sur l’entité. Il retrace ses années à la Chambre des représentants (2003-2015), notamment en tant que président (2011-2015), son mandat de gouverneur de l’État de Sokoto (2015-2023) et son siège de sénateur pour Sokoto Sud depuis 2023."
  ur: "امینو تمبووال پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ایوان نمائندگان (2003–2015) میں ان کے سالوں کا ذکر کرتا ہے جس میں بطور اسپیکر (2011–2015)، ان کی سوکوٹو اسٹیٹ کی گورنر شپ (2015–2023)، اور 2023 سے سوکوٹو ساؤتھ کے لیے ان کی سینیٹ کی نشست شامل ہے۔"
  tr: "Amino Waziri Tambual hakkında İngilizce Wikipedia makalesi; yalnızca varlık bilgileri için kullanılır. Makale, Temsilciler Meclisi üyeliğini (2003–2015), başkanlığını (2011–2015), Sukto eyaleti valiliğini (2015–2023) ve 2023'ten beri Senato üyeliğini anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Amino Waziri Tambual; digunakan hanya untuk fakta entitas. Artikel ini menceritakan keanggotaannya di Dewan Perwakilan Rakyat (2003–2015), masa kepresidenannya (2011–2015), masa jabatannya sebagai gubernur negara bagian Sukto (2015–2023), dan keanggotaannya di Senat sejak 2023."
