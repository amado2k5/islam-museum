summary:
  ar: "مقالة ويكيبيديا الأردية عن محيي الدين ياسين ⁦(وُلد 1947)⁩؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 15 مايو 1947 وتنصيبه وزيرا أعظم ثامنا لماليزيا في 1 مارس 2020 وعضويته في البرلمان عن باغوه."
  en: "Urdu Wikipedia article on Muhyiddin Yassin (born 1947); used for entity facts only. It gives his birth on 15 May 1947, his swearing-in as Malaysia's eighth prime minister on 1 March 2020, and his Pagoh parliamentary seat."
  es: "Artículo de Wikipedia en urdu sobre Muhyiddin Yassin (nacido en 1947); utilizado únicamente para datos sobre la persona. Indica su fecha de nacimiento, el 15 de mayo de 1947, su toma de posesión como octavo primer ministro de Malasia el 1 de marzo de 2020 y su escaño parlamentario por Pagoh."
  fr: "Article de Wikipédia en ourdou sur Muhyiddin Yassin (né en 1947); utilisé uniquement à des fins d’information sur l’entité. Il indique sa date de naissance, le 15 mai 1947, sa prestation de serment comme huitième Premier ministre de Malaisie le 1er mars 2020, et son siège parlementaire à Pagoh."
  ur: "محی الدین یاسین ⁦(پیدائش 1947)⁩ پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 15 مئی 1947 کو ان کی پیدائش، 1 مارچ 2020 کو ملائیشیا کے آٹھویں وزیر اعظم کے طور پر ان کی حلف برداری، اور ان کی پاگوہ پارلیمانی نشست ہے۔"
  tr: "Muhyiddin Yassin (1947 doğumlu) hakkında Urduca Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 15 Mayıs 1947'deki doğumundan, 1 Mart 2020'de Malezya'nın sekizinci Başbakanı olarak göreve başlamasından ve Baghu'daki parlamento üyeliğinden bahsedilmektedir."
  id: "Artikel Wikipedia Urdu tentang Muhyiddin Yassin (lahir 1947); digunakan hanya untuk fakta entitas. Artikel ini menyebutkan kelahirannya pada 15 Mei 1947, pelantikannya sebagai Menteri Utama Malaysia kedelapan pada 1 Maret 2020, dan keanggotaannya di parlemen Baghu."
