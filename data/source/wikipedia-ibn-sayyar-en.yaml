summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ابن سيار الوراق؛ لوقائع الكيان فقط: أبو محمد المظفر بن نصر بن سيار الوراق كاتب عراقي من بغداد القرن العاشر، جامع كتاب الطبيخ أقدم كتاب طبخ عربي معروف، أكثر من 600 وصفة في 132 باباً، طبعة أوهرنبيرغ-مروّة 1987 وقراءة بيري."
  en: "English Wikipedia article on Ibn Sayyar al-Warraq; entity facts only: Abu Muhammad al-Muzaffar ibn Nasr ibn Sayyar al-Warraq, an Iraqi author from tenth-century Baghdad, compiler of the Kitab al-Tabikh — the earliest known Arabic cookbook — with over 600 recipes in 132 chapters, plus the Oehrnberg-Mroueh 1987 edition and Perry's reading."
  es: "Artículo de la Wikipedia en inglés sobre Ibn Sayyar al-Warraq; solo datos sobre la entidad: Abu Muhammad al-Muzaffar ibn Nasr ibn Sayyar al-Warraq, un autor iraquí del siglo X de Bagdad, compilador del Kitab al-Tabikh —el libro de cocina árabe más antiguo conocido— con más de 600 recetas en 132 capítulos, además de la edición de Oehrnberg-Mroueh de 1987 y la lectura de Perry."
  fr: "Article de Wikipédia en anglais sur Ibn Sayyar al-Warraq; informations sur l'entité uniquement: Abu Muhammad al-Muzaffar ibn Nasr ibn Sayyar al-Warraq, auteur irakien du Xᵉ siècle originaire de Bagdad, compilateur du Kitab al-Tabikh — le plus ancien livre de cuisine arabe connu — contenant plus de 600 recettes réparties en 132 chapitres, ainsi que l'édition Oehrnberg-Mroueh de 1987 et la lecture de Perry."
  ur: "ابن سیار الوراق پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق: ابو محمد المظفر ابن نصر ابن سیار الوراق، دسویں صدی کے بغداد سے تعلق رکھنے والے ایک عراقی مصنف، کتاب التبیخ کے مرتب کرنے والے - قدیم ترین عربی کک بک - جس میں 132 ابواب میں 600 سے زیادہ ترکیبیں ہیں، اور اس کے علاوہ 132 ابواب میں 600 سے زائد نسخے ہیں۔ پڑھنا"
  tr: "İbn Sayyar el-Varraq hakkında İngilizce Vikipedi makalesi; sadece varlık için gerçekler: Bağdatlı Iraklı yazar Ebu Muhammed el-Muzaffar ibn Nasr ibn Sayyar el-Warraq, onuncu yüzyılda Bağdat'tan Iraklı bir yazar, Yemek Kitabı'nın derleyicisi, bilinen en eski Arap yemek kitabı, 132 bölümde 600'den fazla tarif, Ohrenberg-Marwa baskısı 1987, Perry tarafından okunmuştur."
  id: "Artikel Wikipedia bahasa Inggris tentang Ibn Sayyar al-Warraq; hanya untuk fakta entitas: Abu Muhammad al-Muzaffar ibn Nasr ibn Sayyar al-Warraq, seorang penulis Irak dari Baghdad pada abad kesepuluh, penyusun Kitab Memasak, buku masak Arab tertua yang diketahui, lebih dari 600 resep dalam 132 bab, edisi Ohrenberg-Marwa 1987, dibaca oleh Perry."
