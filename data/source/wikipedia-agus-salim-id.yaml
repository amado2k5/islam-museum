summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن أغوس سالم؛ تُستخدم لوقائع الكيان فقط. تتفق مع الإنجليزية في تاريخي الميلاد والوفاة ومقبرة كاليباتا، وتضيف دراسته على يد عمه الشيخ أحمد خطيب في جدة، ومسيرته الصحفية في «نيرتجا» و«فجر آسيا»، وقائمة كتبه ومنها كتابه في التوحيد والتقدير والتوكل (1953). لا تسمي له مذهبًا."
  en: "Indonesian Wikipedia article on Agus Salim; used for entity facts only. It agrees with the English article on his birth and death dates and his Kalibata burial, and adds his study under his uncle Shaykh Ahmad Khatib in Jeddah, his journalism at Neratja and Fadjar Asia, and his writings including the 1953 book on tawhid, takdir and tawakal. It names no school of Islam for him."
  es: "Artículo de la Wikipedia en indonesio sobre Agus Salim; utilizado únicamente para datos sobre la persona. Coincide con el artículo en inglés sobre sus fechas de nacimiento y muerte y su entierro en Kalibata, y añade que estudió con su tío, el jeque Ahmad Khatib, en Yeda, que trabajó como periodista en Neratja y Fadjar Asia, y que escribió obras, entre ellas el libro de 1953 sobre tawhid, takdir y tawakal. No menciona ninguna escuela del islam a la que pertenezca."
  fr: "Article de Wikipédia indonésien sur Agus Salim; utilisé uniquement pour les informations factuelles. Il concorde avec l’article anglais concernant ses dates de naissance et de décès ainsi que son inhumation à Kalibata, et mentionne également ses études auprès de son oncle, le cheikh Ahmad Khatib, à Djeddah, son travail de journaliste pour Neratja et Fadjar Asia, et ses écrits, notamment son ouvrage de 1953 sur le tawhid, le takdir et le tawakal. Il ne précise pas son appartenance à une école de l’islam."
  ur: "اگس سلیم پر انڈونیشین ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ان کی پیدائش اور وفات کی تاریخوں اور ان کے کلیبت دفن سے متعلق انگریزی مضمون سے متفق ہے، اور جدہ میں ان کے چچا شیخ احمد خطیب کے زیر مطالعہ، نیرتجا اور فجر ایشیا میں ان کی صحافت، اور ان کی تصانیف بشمول توحید، تکدیر اور توکل پر 1953 کی کتاب کو شامل کرتا ہے۔ اس نے اس کے لیے اسلام کے کسی مکتب کا نام نہیں لیا۔"
  tr: "Agos Salim hakkında Endonezya Vikipedi makalesi yalnızca varlığın gerçekleri için kullanılmıştır. Doğum ve ölüm tarihleri ile Kalipata mezarlığı konusunda İngilizce ile uyumludur ve amcası Şeyh Ahmed Khatib'in Cidde'deki çalışmalarını, 'Nirtja' ve 'Dawn of Asia' adlı gazetecilik kariyerini ve Tawhid, Taqreed ve Tawakkul (1953) üzerine yazdığı kitap listesini ekler. Onu bir düşünce okulu olarak adlandırmayın."
  id: "Artikel Wikipedia Indonesia tentang Agos Salim hanya digunakan untuk fakta entitas tersebut. Artikel ini sejalan dengan bahasa Inggris mengenai tanggal lahir dan kematian serta pemakaman Kalipata, serta menambahkan studinya di bawah pamannya Sheikh Ahmed Khatib di Jeddah, karier jurnalistiknya di 'Nirtja' dan 'Dawn of Asia,' serta daftar bukunya, termasuk bukunya tentang Tawhid, Taqreed, dan Tawakkul (1953). Jangan sebut dia sebagai aliran pemikiran."
