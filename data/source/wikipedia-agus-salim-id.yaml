summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن أغوس سالم؛ تُستخدم لوقائع الكيان فقط. تتفق مع الإنجليزية في تاريخي الميلاد والوفاة ومقبرة كاليباتا، وتضيف دراسته على يد عمه الشيخ أحمد خطيب في جدة، ومسيرته الصحفية في «نيرتجا» و«فجر آسيا»، وقائمة كتبه ومنها كتابه في التوحيد والتقدير والتوكل (1953). لا تسمي له مذهبًا."
  en: "Indonesian Wikipedia article on Agus Salim; used for entity facts only. It agrees with the English article on his birth and death dates and his Kalibata burial, and adds his study under his uncle Shaykh Ahmad Khatib in Jeddah, his journalism at Neratja and Fadjar Asia, and his writings including the 1953 book on tawhid, takdir and tawakal. It names no school of Islam for him."
