  en: "Albanian encyclopedia article on Hasan Prishtina (1873–1933): his Berisha family origins in Drenica, his schooling at Thessaloniki and Istanbul, his part in the constitutional revolution and the uprisings, and his death at Thessaloniki in 1933."
