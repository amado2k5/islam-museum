summary:
  ar: "مقالة ويكيبيديا العربية عن شاه جهان بيكم، بيغوم بوبال؛ بذرة قصيرة تُستخدم لوقائع الكيان فقط. تعطي مولدها في 29 تموز 1838 ووفاتها في بوبال في 16 حزيران 1901، وتذكر أنها اعتلت إمارة بوبال بعد وفاة والدتها سكندر بيكم، ودينها في صندوق المعلومات الإسلام فقط."
  en: "Arabic Wikipedia article on Shah Jahan Begum, Begum of Bhopal; a short stub used for entity facts only. It gives her birth on 29 July 1838 and her death at Bhopal on 16 June 1901, says she took the principality of Bhopal after her mother Sikandar Begum’s death, and gives her religion in the infobox as Islam only."
  es: "Artículo en árabe de la Wikipedia sobre Shah Jahan Begum, Begum de Bhopal; un breve esbozo utilizado únicamente para datos sobre la persona. Indica su nacimiento el 29 de julio de 1838 y su fallecimiento en Bhopal el 16 de junio de 1901, afirma que asumió el principado de Bhopal tras la muerte de su madre, Sikandar Begum, y en el recuadro informativo solo se indica que profesaba el islam."
  fr: "Article Wikipédia en arabe sur Shah Jahan Begum, Bégum de Bhopal; une brève ébauche servant uniquement à fournir des informations factuelles. On y trouve la date de naissance de Shah Jahan Begum (29 juillet 1838) et de son décès à Bhopal (16 juin 1901), ainsi que la mention qu'elle a hérité de la principauté de Bhopal après la mort de sa mère, Sikandar Begum. L'infobox indique uniquement que Shah Jahan Begum était de confession musulmane."
  ur: "شاہ جہاں بیگم، بھوپال کی بیگم پر عربی ویکیپیڈیا مضمون؛ ایک مختصر سٹب صرف ہستی کے حقائق کے لیے استعمال ہوتا ہے۔ اس کی پیدائش 29 جولائی 1838 کو ہوئی اور اس کی موت 16 جون 1901 کو بھوپال میں ہوئی، کہتی ہیں کہ اس نے اپنی والدہ سکندر بیگم کی موت کے بعد بھوپال کی سلطنت سنبھالی، اور معلومات کے خانے میں اپنا مذہب صرف اسلام کے طور پر پیش کیا۔"
