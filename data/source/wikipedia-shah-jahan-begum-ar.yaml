  ar: "مقالة ويكيبيديا العربية عن شاه جهان بيكم، بيغوم بوبال؛ بذرة قصيرة تُستخدم لوقائع الكيان فقط. تعطي مولدها في 29 تموز 1838 ووفاتها في بوبال في 16 حزيران 1901، وتذكر أنها اعتلت إمارة بوبال بعد وفاة والدتها سكندر بيكم، ودينها في صندوق المعلومات الإسلام فقط."
