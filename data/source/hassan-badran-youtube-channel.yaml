summary:
  ar: "قناة حسان بدران على يوتيوب، واسمها «حسان بدران - Hassan Badran»، تنشر أحاديثه التحفيزية وتلاوات قرآنية بصوته، وتربط أوصاف مقاطعها حسابه على إنستغرام وصفحته على فيسبوك."
  en: "Hassan Badran's YouTube channel, named 'Hassan Badran' in Arabic and Latin script, which publishes his motivational talks and Quran recitations in his own voice. Its video descriptions link his Instagram account and his Facebook page."
  es: "El canal de YouTube de Hassan Badran, llamado «Hassan Badran» en árabe y alfabeto latino, publica sus charlas motivacionales y recitaciones del Corán con su propia voz. Las descripciones de sus videos incluyen enlaces a su cuenta de Instagram y a su página de Facebook."
  fr: "La chaîne YouTube d'Hassan Badran, intitulée « Hassan Badran » en arabe et en alphabet latin, propose des discours de motivation et des récitations du Coran qu'il interprète lui-même. La description de ses vidéos renvoie vers son compte Instagram et sa page Facebook."
  ur: "حسن بدران کا یوٹیوب چینل جس کا نام 'حسن بدران' عربی اور لاطینی رسم الخط میں ہے، جو ان کی ترغیبی گفتگو اور قرآن کی تلاوت اپنی آواز میں شائع کرتا ہے۔ اس کی ویڈیو کی تفصیل اس کے انسٹاگرام اکاؤنٹ اور اس کے فیس بک پیج کو لنک کرتی ہے۔"
  tr: "Hassan Badran'ın YouTube kanalı 'Hassan Badran', motivasyon konuşmalarını ve Kur'an okumalarını kendi sesiyle yayınlıyor, kliplerinin açıklamalarını Instagram hesabı ve Facebook sayfasına bağlıyor."
  id: "Saluran YouTube Hassan Badran, yang disebut 'Hassan Badran,' mempublikasikan ceramah motivasi dan pembacaan Al-Qur'an dengan suaranya, menghubungkan deskripsi klip-klipnya ke akun Instagram dan halaman Facebook-nya."
