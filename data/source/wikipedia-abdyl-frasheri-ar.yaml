reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It gives: Abdül Dume Bey Frashëri (1 June 1839 – 23 October 1892), Albanian Ottoman official and politician of the First Constitutional Era, one of the first ideologues of the Albanian National Awakening, who worked to spread national feeling and an education programme in the Albanian language and literature; a founder of the League of Prizren and among its most prominent leaders; founder of the Central Committee for Defending Albanian Rights in Istanbul; deputy for the province of Ioannina in the Ottoman parliament in 1876–1877; his family 'among the distinguished Albanian Muslim families affiliated with the Bektashi Sufi tariqa' — a family statement, as in the English and Albanian articles; his parents Halit Bey (1797–1859) and Emine (1814–1861), the second of her line descending from Imrahor Ilyas Bey of Korçë. No statement in the article attests his own adherence to the order, and none is recorded."
