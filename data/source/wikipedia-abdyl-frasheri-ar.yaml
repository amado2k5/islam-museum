summary:
  ar: "مقالة ويكيبيديا العربية عن عبدول دومه بك فراشيري؛ تُستخدم لوقائع الكيان فقط. توافق الألبانية والإنجليزية في تاريخي ميلاده ⁦(1 يونيو 1839)⁩ ووفاته ⁦(23 أكتوبر 1892)⁩، وتصف أسرته بأنها من العائلات الألبانية المسلمة المنتسبة إلى الطريقة البكتاشية."
  en: "Arabic Wikipedia article on Abdül Dume Bey Frashëri; used for entity facts only. It agrees with the Albanian and English articles on his birth (1 June 1839) and death (23 October 1892), and describes his family as among the distinguished Albanian Muslim families affiliated with the Bektashi Sufi order."
  es: "Artículo de Wikipedia en árabe sobre Abdül Dume Bey Frashëri; utilizado únicamente para datos sobre la persona. Coincide con los artículos en albanés e inglés sobre su nacimiento (1 de junio de 1839) y su muerte (23 de octubre de 1892), y describe a su familia como una de las familias musulmanas albanesas más destacadas afiliadas a la orden sufí Bektashi."
  fr: "Article de Wikipédia en arabe sur Abdül Dume Bey Frashëri; utilisé uniquement pour les informations relatives à l’entité. Il concorde avec les articles albanais et anglais concernant sa naissance (1er juin 1839) et sa mort (23 octobre 1892), et décrit sa famille comme faisant partie des familles musulmanes albanaises distinguées affiliées à l’ordre soufi Bektashi."
  ur: "عربی ویکیپیڈیا پر عبد الدوم بے فریشری پر مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اس کی پیدائش ⁦(1 جون 1839)⁩ اور موت ⁦(23 اکتوبر 1892)⁩ پر البانی اور انگریزی مضامین سے متفق ہے، اور اس کے خاندان کو بکتاشی صوفی حکم سے وابستہ ممتاز البانیائی مسلم خاندانوں میں سے ایک کے طور پر بیان کرتا ہے۔"
  tr: "Abdulduma Bey Frashiri hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Arnavutça ve İngilizce doğum tarihleri (1 Haziran 1839) ve ölüm tarihleri (23 Ekim 1892) ile örtüşür ve ailesi Bektaşi tarikatına bağlı Arnavut Müslüman ailelere ait olarak tanımlanır."
  id: "Artikel Wikipedia Arab tentang Abdul Duma Bey Frashiri; digunakan hanya untuk fakta entitas. Bahasa Albania dan Inggris sesuai dengan tanggal lahirnya (1 Juni 1839) dan kematiannya (23 Oktober 1892), dan keluarganya digambarkan berasal dari keluarga Muslim Albania yang berafiliasi dengan ordo Bektashi."
