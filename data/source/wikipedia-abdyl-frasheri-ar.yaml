  en: "Arabic Wikipedia article on Abdül Dume Bey Frashëri; used for entity facts only. It agrees with the Albanian and English articles on his birth (1 June 1839) and death (23 October 1892), and describes his family as among the distinguished Albanian Muslim families affiliated with the Bektashi Sufi order."
