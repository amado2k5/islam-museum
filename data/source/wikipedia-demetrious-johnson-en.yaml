reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It gives Johnson as born on 13 August 1986 in Madisonville, Kentucky, raised in Parkland, Washington; inaugural UFC flyweight champion from 22 September 2012 with 11 consecutive title defences, a UFC record, losing the title to Henry Cejudo in August 2018; ONE Championship flyweight champion from 26 August 2022; retired on 6 September 2024 as ONE's first hall-of-fame inductee, and announced in March 2026 for the UFC Hall of Fame. It makes no statement of his religion anywhere in its text."
