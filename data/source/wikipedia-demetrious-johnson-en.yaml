summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ديمتريوس جونسون؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في ولاية واشنطن، وبطولته الافتتاحية لوزن الذبابة في يو إف سي مع رقم قياسي من 11 دفاعا متتاليا، وانتقاله إلى بطولة ون وفوزه ببطولتها سنة 2022، واعتزاله سنة 2024 وإدراجه في قاعتي المشاهير."
  en: "English Wikipedia article on Demetrious Johnson; used for entity facts only. It recounts his Washington State upbringing, his inaugural UFC flyweight championship with a record 11 consecutive defences, his move to ONE Championship and its 2022 title, his 2024 retirement, and his hall-of-fame inductions."
  es: "Artículo de la Wikipedia en inglés sobre Demetrious Johnson; utilizado únicamente para datos sobre la persona. Narra su infancia en el estado de Washington, su primer campeonato de peso mosca de la UFC con un récord de 11 defensas consecutivas, su paso a ONE Championship y su título en 2022, su retiro en 2024 y su ingreso al Salón de la Fama."
  fr: "Article de Wikipédia en anglais sur Demetrious Johnson; utilisé uniquement à des fins d'information sur l'entité. Il relate son enfance dans l'État de Washington, son premier titre de champion poids mouche de l'UFC avec un record de 11 défenses consécutives, son passage au ONE Championship et son titre de 2022, sa retraite en 2024 et son intronisation au Temple de la renommée."
  ur: "ڈیمیٹریس جانسن پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کی واشنگٹن اسٹیٹ پرورش، اس کی پہلی UFC فلائی ویٹ چیمپئن شپ کا ریکارڈ 11 مسلسل دفاع کے ساتھ، اس کا ون چیمپئن شپ میں جانا اور اس کا 2022 کا ٹائٹل، اس کی 2024 کی ریٹائرمنٹ، اور اس کی ہال آف فیم شمولیت کا ذکر ہے۔"
  tr: "Demetrius Johnson hakkında İngilizce Wikipedia makalesi; sadece varlık bilgileri için kullanılmıştır. Washington eyaletindeki yetiştirilme yıllarını, 11 ardışık savunma rekoruyla ilk UFC sinek siklet şampiyonluğunu, 2022'de Championship One'a geçişini ve kazanmasını, 2024'te emekliliğini ve Hall of Fame'e kabul edilmesini anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Demetrius Johnson; digunakan hanya untuk fakta entitas. Artikel ini menceritakan masa kecilnya di negara bagian Washington, gelar juara UFC flyweight perdananya dengan rekor 11 pertahanan berturut-turut, perpindahannya ke Championship One dan memenangkannya pada 2022, pensiun pada 2024, dan pengangkatannya ke Hall of Fame."
