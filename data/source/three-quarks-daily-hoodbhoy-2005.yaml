label: { en: "Pervez Hoodbhoy — 3 Quarks Daily, quoting his 'Miracles, Wars, and Politics'" }
summary:
  ar: "صفحة «ثري كواركس ديلي» ⁦(نوفمبر 2005)⁩ تنقل مطولا من مقال برويز هودبوي نفسه «المعجزات والحروب والسياسة»، وفيه يقول بلسانه: «ملحدون مثلي» — تصريح شخصي بضمير المتكلم في مقال موقّع باسمه، يُحفظ هنا كما نُقل."
  en: "3 Quarks Daily page (November 2005) quoting at length from Pervez Hoodbhoy's own article 'Miracles, Wars, and Politics', in which he writes in the first person of 'atheists such as myself' — a first-person self-description in his own bylined article, preserved here as quoted."
  es: "3 Quarks Daily página (noviembre de 2005) cita extensamente el artículo de Pervez Hoodbhoy, 'Milagros, guerras y política', en el que escribe en primera persona como 'ateos como yo', una autodescripción en primera persona en su propio artículo firmado, que se conserva aquí tal como se cita."
  fr: "La page quotidienne de 3 Quarks (novembre 2005) cite longuement l'article de Pervez Hoodbhoy intitulé « Miracles, guerres et politique », dans lequel il écrit à la première personne « des athées comme moi » — une autodescription à la première personne dans son propre article signé, conservée ici telle que citée."
  ur: "3 کوارکس ڈیلی صفحہ ⁦(نومبر 2005)⁩ پرویز ہودبھائے کے اپنے مضمون 'معجزات، جنگیں اور سیاست' سے طوالت کا حوالہ دیتے ہوئے، جس میں وہ 'ملحد جیسے خود' کے پہلے شخص میں لکھتے ہیں - ان کے اپنے تحریری مضمون میں پہلا شخص خود کی وضاحت، یہاں محفوظ ہے۔"
  tr: "\"Three Quarks Daily\" sayfası (Kasım 2005), Pervez Hoodboy'un kendi makalesi \"Mucizeler, Savaşlar ve Politika\"dan kapsamlı şekilde alıntı yapar; burada şöyle der: \"Benim gibi ateistler\" — kendi adına imzalanmış bir makalede birinci şahıs kişisel beyanı, burada alıntı yapıldığı gibi korunmuştur."
  id: "Halaman \"Three Quarks Daily\" (November 2005) secara luas mengutip dari artikel Pervez Hoodboy sendiri \"Miracles, Wars, and Politics,\" di mana ia mengatakan: \"Atheis seperti saya\" — sebuah pernyataan pribadi dalam orang pertama dalam artikel yang ditandatangani atas namanya, disimpan di sini seperti yang dikutip."
