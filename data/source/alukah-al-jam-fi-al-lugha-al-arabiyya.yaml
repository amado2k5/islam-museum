summary:
  ar: "صفحة «الجمع في اللغة العربية: الأنواع والصياغة والإعراب»، Alukah. لم يفتح المتحف هذا المرجع بنفسه؛ عُرف ما قيل عنه من ملخص بحثي قدّمه المؤسس إلى المتحف ووافق على استعماله في 21 نوفمبر 2026. يُستشهد به في: المثنى والجمع."
  en: "The page \"الجمع في اللغة العربية: الأنواع والصياغة والإعراب\" (Alukah). The museum did not open it itself: what is known of it comes from a research summary supplied to the museum by the founder, who approved its use on 21 November 2026. Cited for: the dual and the plural."
  ur: "صفحہ «الجمع في اللغة العربية: الأنواع والصياغة والإعراب»، Alukah۔ عجائب گھر نے اسے خود نہیں کھولا؛ اس کے بارے میں جو معلوم ہے وہ بانی کے فراہم کردہ تحقیقی خلاصے سے ہے، جس کے استعمال کی منظوری بانی نے 21 نومبر 2026 کو دی۔ اس کا حوالہ ان کے لیے دیا گیا: مثنیٰ اور جمع۔"
  fr: "La page « الجمع في اللغة العربية: الأنواع والصياغة والإعراب » (Alukah). Le musée ne l'a pas ouvert lui-même : ce qu'on en sait vient d'un résumé de recherche fourni au musée par le fondateur, qui en a approuvé l'usage le 21 novembre 2026. Cité pour : le duel et le pluriel."
  es: "La página «الجمع في اللغة العربية: الأنواع والصياغة والإعراب» (Alukah). El museo no lo abrió por sí mismo: lo que se sabe de él procede de un resumen de investigación entregado al museo por el fundador, que aprobó su uso el 21 de noviembre de 2026. Citado para: el dual y el plural."
  tr: "\"Arapçada Çoğul: Türler, Formülasyon ve Ayrıştırma,\" sayfası. Müze bu referansı kendisi açmadı; kurucusunun müzeye sunduğu ve 21 Kasım 2026'da kullanımını onayladığı bir araştırma özetinden neler söylendiğini biliyor. Atıf alanı: Al-Muthanna ve Çoğul."
  id: "Halaman \"Jamak dalam Bahasa Arab: Jenis, Formulasi, dan Parsing,\" Alukah. Museum tidak membuka referensi ini sendiri; museum mengetahui apa yang dikatakan tentangnya dari ringkasan penelitian yang diajukan oleh pendiri museum dan disetujui penggunaannya pada 21 November 2026. Dikutip dalam: Al-Muthanna dan Jamak."
