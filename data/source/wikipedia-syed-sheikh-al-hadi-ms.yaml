summary:
  ar: "مقالة ويكيبيديا الملايوية عن سيد شيخ الهادي؛ تُستخدم لوقائع الكيان فقط. تربط ميلاده في كامبونغ هولو بملقا بـ22 رجب 1284هـ (22 تشرين الثاني 1867)، وتتتبع تعليمه في بنينغت وترنغانو ودعوته سنة 1894/95 مع طاهر جلال الدين لجمع طلاب الملايو في مكة والقاهرة، وتأسيس «الإمام» سنة 1906 ومدارسه في سنغافورة وملقا وبينانغ ومطبعة جلوتونغ، ووفاته في منزله بجلوتونغ في 20 شباط 1934 ودفنه فيها."
  en: "Malay Wikipedia article on Syed Sheikh Syed Ahmad Al-Hadi; used for entity facts only. It pairs his birth at Kampung Hulu, Malacca, with 22 Rajab 1284 AH (22 November 1867), follows his education on Penyengat and in Terengganu, his 1894/95 invitation with Tahir Jalaluddin to gather Malay students in Mecca and Cairo, the founding of Al-Imam in 1906, his madrasas in Singapore, Malacca and Penang and the Jelutong Press, and his death at his home in Jelutong on 20 February 1934 and burial there."
