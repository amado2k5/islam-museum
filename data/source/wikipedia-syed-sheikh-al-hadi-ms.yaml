reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision, fetched by revision id through the MediaWiki API with the returned id asserted equal. The article draws on the same biographical literature as the English article (its bibliography is carried over from the German tradition) and is treated as the same family where the two agree. It names no school for him and no teacher relationship with Ahmad Khatib al-Minangkabawi; his named teachers are on Penyengat and in Terengganu, and he heard Abduh lecture at al-Azhar and Rashid Rida in Mecca."
