summary:
  ar: "مقالة ويكيبيديا الملايوية عن سيد شيخ الهادي؛ تُستخدم لوقائع الكيان فقط. تربط ميلاده في كامبونغ هولو بملقا بـ22 رجب 1284هـ ⁦(22 تشرين الثاني 1867)⁩، وتتتبع تعليمه في بنينغت وترنغانو ودعوته سنة 1894/95 مع طاهر جلال الدين لجمع طلاب الملايو في مكة والقاهرة، وتأسيس «الإمام» سنة 1906 ومدارسه في سنغافورة وملقا وبينانغ ومطبعة جلوتونغ، ووفاته في منزله بجلوتونغ في 20 شباط 1934 ودفنه فيها."
  en: "Malay Wikipedia article on Syed Sheikh Syed Ahmad Al-Hadi; used for entity facts only. It pairs his birth at Kampung Hulu, Malacca, with 22 Rajab 1284 AH (22 November 1867), follows his education on Penyengat and in Terengganu, his 1894/95 invitation with Tahir Jalaluddin to gather Malay students in Mecca and Cairo, the founding of Al-Imam in 1906, his madrasas in Singapore, Malacca and Penang and the Jelutong Press, and his death at his home in Jelutong on 20 February 1934 and burial there."
  es: "Artículo de Wikipedia en malayo sobre Syed Sheikh Syed Ahmad Al-Hadi; utilizado únicamente para datos sobre la persona. Relaciona su nacimiento en Kampung Hulu, Malaca, con el 22 de Rajab de 1284 AH (22 de noviembre de 1867), su educación en Penyengat y Terengganu, su invitación en 1894/95 junto con Tahir Jalaluddin para reunir a estudiantes malayos en La Meca y El Cairo, la fundación de Al-Imam en 1906, sus madrasas en Singapur, Malaca y Penang y la imprenta de Jelutong, y su muerte en su casa en Jelutong el 20 de febrero de 1934 y su entierro allí."
  fr: "Article de Wikipédia en malais sur Syed Sheikh Syed Ahmad Al-Hadi; utilisé uniquement pour les informations factuelles. Il associe sa naissance à Kampung Hulu, Malacca, au 22 Rajab 1284 AH (22 novembre 1867), retrace son éducation à Penyengat et à Terengganu, son invitation en 1894/95 avec Tahir Jalaluddin à rassembler des étudiants malais à La Mecque et au Caire, la fondation d’Al-Imam en 1906, ses madrasas à Singapour, Malacca et Penang et la Jelutong Press, et sa mort à son domicile de Jelutong le 20 février 1934 et son inhumation au même endroit."
  ur: "سید شیخ سید احمد الہادی پر مالائی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 22 رجب 1284 ہجری ⁦(22 نومبر 1867)⁩ کے ساتھ کمپونگ ہولو، ملاکا میں اس کی پیدائش کو جوڑتا ہے، پینینگٹ پر اس کی تعلیم کے بعد اور ترنگگانو میں، طاہر جلال الدین کے ساتھ اس کی 1894/95 میں مکہ اور قاہرہ میں ملائی طلباء کو جمع کرنے کی دعوت دی گئی، اس کے بانی، ملاکا میں الامامس، 160 میں ملاکا کے بانی تھے۔ پینانگ اور جیلوٹونگ پریس، اور 20 فروری 1934 کو جیلوٹونگ میں ان کے گھر پر ان کی موت اور وہیں تدفین۔"
