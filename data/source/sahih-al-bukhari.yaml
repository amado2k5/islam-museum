reliability_note: "Canonical Sunni hadith collection. The Rahimiyya edition named above is not in the local harvest, so it has not been checked. Citations give hadith numbers, not pages. The local al-Bugha scan (books/hadith/sahih-bukhari/niyazaka_gmail, PDF pages) follows its own numbering. That numbering agrees with the standard numbering for the early hadiths checked (1, 3, 8, 13, 50) but not from about 3000 on: the Night Journey hadith is 3035 in the al-Bugha scan and is commonly cited as 3207 in the standard numbering. Numbers from the al-Bugha scan are therefore cited to sahih-al-bukhari-bugha, never to this source. Page-form citations to this source are not allowed."
