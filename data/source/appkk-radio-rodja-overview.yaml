reliability_note: "The overview text of the station's own Radio Rodja 2017 app listing (package com.wRadioRodja756AM2017), read via a mirror on 4 November 2026: it states that Radio Rodja began as a community FM station in early 2005 in Cileungsi, Bogor, was officially launched in 2007 on 756 AM, launched Rodja TV in 2009 as an internet-streaming station, and began satellite broadcasts in 2011, with the studio complex on Jalan Pahlawan, Kampung Tengah, Cileungsi, beside Masjid Al-Barkah. A first-party account of the station's history; dates are the station's own. Read on 4 November 2026."
