reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision via the MediaWiki API on 1 November 2026; a fact is used only where the article cites a source for it (Wikipedia broad rule). The article is built on the Ba'alawi genealogical tradition (citing al-Mashhur's Shams al-Zahira) and files him under Shafi'i and Ash'ari categories; its infobox is the only structured attestation naming a legal school for him (Shafi'i), and because it rests on that one genealogical family it is preserved in the record but not treated as two-source documentation. Its Hijri pairings (869/1465, 931/1525) are the source's own and are recorded as derived from it."
