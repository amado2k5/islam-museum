summary:
  ar: "مقالة ويكيبيديا العربية عن سونن بونانغ ⁦(مخدوم إبراهيم)⁩؛ تعطي ولادته 869هـ/1465م ووفاته 931هـ/1525م في توبان، وصندوقها يعطي عقيدته أهل السنة والجماعة ومذهبه الشافعي، مع سلسلة نسب باعلوية."
  en: "Arabic Wikipedia article on Sunan Bonang (Makhdum Ibrahim); it gives his birth in 869 AH/1465 and death in 931 AH/1525 at Tuban, and its infobox gives his creed as Sunni and his madhhab as Shafi'i, with a Ba'alawi genealogical chain."
  es: "Artículo de Wikipedia en árabe sobre Sunan Bonang (Makhdum Ibrahim); indica que nació en el año 869 AH/1465 y murió en el año 931 AH/1525 en Tuban, y su ficha informativa indica que su credo era sunita y su madhhab shafi'i, con una cadena genealógica ba'alawi."
  fr: "L'article de Wikipédia en arabe sur Sunan Bonang (Makhdum Ibrahim) indique sa naissance en 869 AH/1465 et sa mort en 931 AH/1525 à Tuban, et son infobox précise qu'il était sunnite et son madhhab shafi'i, avec une chaîne généalogique ba'alawi."
  ur: "سنن بونانگ ⁦(مخدوم ابراہیم)⁩ پر عربی ویکیپیڈیا مضمون؛ اس کی ولادت 869ھ/1465ء میں ہوئی اور وفات 931ھ/1525ء میں تبان میں ہوئی، اور اس کا معلومات خانہ اس کا عقیدہ سنی اور اس کا مذہب شافعی کے طور پر بیان کرتا ہے، جس میں بعلوی نسباتی سلسلہ ہے۔"
  tr: "Arapça Wikipedia makalesi, Sunan Bonang (Makhdoom İbrahim) hakkında; 869 H/1465 yılında doğduğunu ve 931 H/1525 yılında Tuban'da öldüğünü belirtir; kutusunda ise Ehl-sünnet vel-Cemaah inancı ve Şafii mezhebi ile birlikte Aleviler soyundan bahsedilmektedir."
  id: "Artikel Wikipedia Arab tentang Sunan Bonang (Makhdoom Ibrahim); menyebutkan kelahirannya pada tahun 869 H/1465 M dan kematiannya pada tahun 931 H/1525 M di Tuban, dan kotaknya memuat kredo Ahl al-Sunnah wal-Jama'ah dan aliran Shafi'i-nya, beserta garis keturunan Alawiyah."
