reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). A devotional narrative rather than a sourced biography: its infobox gives his birth in 1732 while its body gives 1748, it credits him with memorising the Quran in Dagestan and religious study in Bukhara against the contemporary reports of an illiterate shepherd carried by the English article's scholarly sources, and its category set files him under four different birth years at once. It is one of the carriers of the attestation this record had to test — it states plainly that he was affiliated with the Naqshbandi tariqa — and it agrees with all other sources on his death at Shlisselburg on 13 April 1794. Checked 1 November 2026."
