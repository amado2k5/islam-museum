reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md). Read in full on 26 October 2026 and checked against the recorded revision. It says he took Islam as his reference, argued that religion needed reform and that the khutba should be read in each nation's own language, and was the Young Ottoman who wrote most on religious subjects; these are his published positions. Its infobox carries no religion field for him, and neither text nor infobox names a madhhab or school for him personally."
