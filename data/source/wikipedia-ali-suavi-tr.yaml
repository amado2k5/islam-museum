summary:
  ar: "مقالة ويكيبيديا التركية عن علي سعاوي؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 8 ديسمبر 1839 بإسطنبول ووفاته في 20 مايو 1878 فيها، وتروي حجّه مع أبيه وهو في السابعة عشرة ووعظه في جامع شهزاده باشي وصحيفته «مخبر» في لندن وإدارته المدرسة الغلاطية ثم اقتحامه قصر جراغان ومقتله ودفنه قرب قصر يلدز، ولقبه «الثوري المعمّم»."
  en: "Turkish Wikipedia article on Ali Suavi; used for entity facts only. It gives his birth on 8 December 1839 at Istanbul and his death there on 20 May 1878, and recounts his pilgrimage with his father at seventeen, his preaching at the Sehzadebasi Mosque, his London newspaper Muhbir, his headship of the Galatasaray school, the Ciragan Palace raid in which he was killed, his burial near Yildiz Palace, and his nickname 'Sarikli Ihtilalci' (the Turbaned Revolutionary)."
  es: "Artículo de la Wikipedia en turco sobre Ali Suavi; utilizado únicamente para datos sobre la persona. Indica su nacimiento el 8 de diciembre de 1839 en Estambul y su muerte allí el 20 de mayo de 1878, y relata su peregrinación con su padre a los diecisiete años, su predicación en la Mezquita Sehzadebasi, su periódico londinense Muhbir, su dirección de la escuela Galatasaray, el asalto al Palacio Ciragan en el que fue asesinado, su entierro cerca del Palacio Yildiz y su apodo \"Sarikli Ihtilalci\" (el revolucionario del turbante)."
  fr: "Article de Wikipédia en turc sur Ali Suavi; utilisé uniquement pour les informations sur l'entité. Il indique sa naissance le 8 décembre 1839 à Istanbul et sa mort dans cette même ville le 20 mai 1878, et relate son pèlerinage avec son père à l'âge de dix-sept ans, ses prédications à la mosquée Sehzadebasi, son journal londonien Muhbir, sa direction de l'école Galatasaray, le raid du palais Ciragan au cours duquel il fut tué, son inhumation près du palais Yildiz et son surnom « Sarikli Ihtilalci » (le révolutionnaire au turban)."
  ur: "علی سویوی پر ترک ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 8 دسمبر 1839 کو استنبول میں ان کی پیدائش اور 20 مئی 1878 کو وہیں ان کی موت کا ذکر کرتا ہے، اور سترہ سال کی عمر میں اپنے والد کے ساتھ ان کی زیارت، ان کی صاحبزادی مسجد میں تبلیغ، اس کے لندن کے اخبار محب، گلاتاسرے اسکول کی سربراہی، سیراگن پیلس پر حملہ، جس میں ان کا قتل کیا گیا تھا، کا ذکر ہے۔ 'سرکلی احتلالچی' ⁦(پگڑی والے انقلابی)⁩۔"
  tr: "Ali Saawi hakkında Türkçe Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 8 Aralık 1839'da İstanbul'da doğduğunu ve 20 Mayıs 1878'de orada öldüğünü anlatır. On yedi yaşında babasıyla yaptığı hac, Şahzadebaşı Camii'nde ve Londra'daki gazetesi 'Mukhber'de vaaz vermesi, Galatya okulundaki yönetimi, ardından Ħıragan Sarayı'na basılması, öldürülmesi ve Yıldız Sarayı yakınlarında gömülmesi ile ona 'genelleştirilmiş devrimci' unvanını kazandırdığı anılar anlatılır."
  id: "Artikel Wikipedia Turki tentang Ali Saawi; digunakan hanya untuk fakta entitas tersebut. Artikel ini menyebutkan kelahirannya pada 8 Desember 1839 di Istanbul dan kematiannya pada 20 Mei 1878 di sana. Artikel ini menceritakan ziarahnya bersama ayahnya pada usia tujuh belas tahun, khotbahnya di Masjid Şahzadebaşı dan surat kabarnya 'Mukhber' di London, administrasinya di sekolah Galatian, kemudian penyerbuan Istana Ħıragan, pembunuhannya, dan pemakamannya di dekat Istana Yıldız, memberinya gelar 'revolusioner umum.'"
