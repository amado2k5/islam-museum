summary:
  ar: "مقالة ويكيبيديا التركية عن علي سعاوي؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 8 ديسمبر 1839 بإسطنبول ووفاته في 20 مايو 1878 فيها، وتروي حجّه مع أبيه وهو في السابعة عشرة ووعظه في جامع شهزاده باشي وصحيفته «مخبر» في لندن وإدارته المدرسة الغلاطية ثم اقتحامه قصر جراغان ومقتله ودفنه قرب قصر يلدز، ولقبه «الثوري المعمّم»."
  en: "Turkish Wikipedia article on Ali Suavi; used for entity facts only. It gives his birth on 8 December 1839 at Istanbul and his death there on 20 May 1878, and recounts his pilgrimage with his father at seventeen, his preaching at the Sehzadebasi Mosque, his London newspaper Muhbir, his headship of the Galatasaray school, the Ciragan Palace raid in which he was killed, his burial near Yildiz Palace, and his nickname 'Sarikli Ihtilalci' (the Turbaned Revolutionary)."
