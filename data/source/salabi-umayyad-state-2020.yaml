reliability_note: "Popular Arabic academic survey, volume 2 of the set. Citations use the printed page numbers, which match the PDF page index in the scan (checked at pp. 6-12, 39-54, 129, 142, 352-382, 425, 446, 459-480, 492-509). Pages now read: 39-43 (Farazdaq, Jarir, al-Ra'i), 352-382 (Umar ibn Abd al-Aziz fiscal and penal policy), 459-480 (Hisham ibn Abd al-Malik, his sons, al-Zuhri), and most of 493-509 (Zayd ibn Ali and Ali Zayn al-Abidin); pages not listed here are not yet read for this record. The text layer is OCR; spot checks confirmed the cited passages but not every diacritic or name spelling. Names rendered in the OCR with ligature or spacing faults (for example Sulayman ibn Dinar at p.472, which may be a different name from Abu Hazim al-Araj) were not verified against another source. The book cites its own sources (Tabari, Ibn Kathir, Ibn Abd al-Hakam and others); those are pointers, not verified by this record."
