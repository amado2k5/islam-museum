summary:
  ar: "بيان صحفي من فلاي دبي عن فوز غيث الغيث بجائزة الرئيس التنفيذي للعام في الشرق الأوسط: اختارته حكومة دبي سنة 2008 لقيادة فلاي دبي بعد مسيرة 23 سنة في طيران الإمارات بلغ فيها نائب الرئيس التنفيذي للعمليات التجارية العالمية."
  en: "flydubai press release on Ghaith Al Ghaith's CEO Middle East 'Aviation CEO of the Year' award; it records that after a 23-year career at Emirates Airline, rising to Executive Vice-President Commercial Operations Worldwide, he was handpicked by the Government of Dubai in 2008 to head up flydubai."
  es: "En su comunicado de prensa sobre el premio \"CEO de Aviación del Año\" otorgado a Ghaith Al Ghaith, CEO de Oriente Medio, se indica que, tras una trayectoria de 23 años en Emirates Airline, donde llegó a ser Vicepresidente Ejecutivo de Operaciones Comerciales Mundiales, fue elegido personalmente por el Gobierno de Dubái en 2008 para dirigir flydubai."
  fr: "Communiqué de presse de flydubai concernant le prix « PDG de l'année dans le secteur de l'aviation au Moyen-Orient » décerné à Ghaith Al Ghaith; il indique qu'après une carrière de 23 ans chez Emirates Airline, où il a gravi les échelons jusqu'au poste de vice-président exécutif des opérations commerciales mondiales, il a été personnellement choisi par le gouvernement de Dubaï en 2008 pour diriger flydubai."
  ur: "غیث الغیث کے سی ای او مڈل ایسٹ 'ایوی ایشن سی ای او آف دی ایئر' ایوارڈ پر flydubai کی پریس ریلیز؛ یہ ریکارڈ کرتا ہے کہ ایمریٹس ایئرلائن میں 23 سالہ کیریئر کے بعد، دنیا بھر میں ایگزیکٹو وائس پریذیڈنٹ کمرشل آپریشنز کے عہدے پر فائز ہونے کے بعد، اسے حکومت دبئی نے 2008 میں فلائی دبئی کی سربراہی کے لیے منتخب کیا۔"
