  ar: "«دائرة الإحصاءات العامة الأردنية، استبيان تعداد 2015»، دائرة الإحصاءات العامة الأردنية، 2015. ورد في ملخص بحثي زُوّد به المتحف مع إدخال نسب اللغات في الأردن؛ ولم يفتح المتحف الصفحة، وقد أجاز المؤسس استعمال الملخص كما ورد في 21 نوفمبر 2026."
