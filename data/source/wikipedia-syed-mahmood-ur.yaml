summary:
  ar: "مقالة ويكيبيديا الأردية عن جسٹس سید محمود؛ تُستخدم لوقائع الكيان فقط. تؤكد مولده في 24 مايو 1850 ووفاته في 8 مايو 1903 وقضاءه في محكمة الله آباد العليا ومساعدته لوالده سيد أحمد خان في تأسيس الكلية."
  en: "Urdu Wikipedia article on Justice Syed Mahmood; used for entity facts only. It confirms his birth on 24 May 1850, his death on 8 May 1903, his Allahabad High Court judgeship and his assistance to his father Syed Ahmad Khan in founding the college."
  es: "Artículo de Wikipedia en urdu sobre el juez Syed Mahmood; se utiliza únicamente para datos biográficos. Confirma su nacimiento el 24 de mayo de 1850, su fallecimiento el 8 de mayo de 1903, su cargo como juez del Tribunal Superior de Allahabad y su colaboración con su padre, Syed Ahmad Khan, en la fundación de la universidad."
  fr: "Article de Wikipédia en ourdou sur le juge Syed Mahmood; utilisé uniquement à titre informatif. Il confirme sa naissance le 24 mai 1850, son décès le 8 mai 1903, son poste de juge à la Haute Cour d’Allahabad et son aide à son père, Syed Ahmad Khan, pour la fondation du collège."
  ur: "جسٹس سید محمود پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 24 مئی 1850 کو ان کی پیدائش، 8 مئی 1903 کو ان کی موت، ان کی الہ آباد ہائی کورٹ کی جج شپ اور کالج کے قیام میں ان کے والد سید احمد خان کی مدد کی تصدیق کرتا ہے۔"
  tr: "Yargıç Syed Mahmood hakkında Urduca Wikipedia makalesi; yalnızca kurumun gerçekleri için kullanılmıştır. 24 Mayıs 1850'de doğumunu, 8 Mayıs 1903'teki ölümünü, Allahabad Yüksek Mahkemesi'ndeki yargı pozisyonunu ve babası Syed Ahmad Khan'a kolejin kuruluşunda yardım ettiğini doğrulamaktadır."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang Hakim Syed Mahmood; hanya digunakan untuk fakta entitas. Artikel ini mengonfirmasi kelahirannya pada 24 Mei 1850, kematiannya pada 8 Mei 1903, posisi yudisialnya di Pengadilan Tinggi Allahabad, dan bantuannya kepada ayahnya Syed Ahmad Khan dalam mendirikan perguruan tinggi tersebut."
