  ar: مقالة ويكيبيديا الروسية عن ميرزا فتح علي أخوندوف؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 12 يوليو 1812 ووفاته في تفليس في 10 مارس 1878، ولقبه القلمي «صبوحي»، وفي قسم آرائه الفلسفية أنه كان ملحدًا انتقد الأديان كلها ولا سيما عقائد الإسلام، ناقلة عن محمدوف (1962).
  en: Russian Wikipedia article on Mirza Fatali Akhundov; used for entity facts only. It gives his birth on 12 July 1812 and death at Tiflis on 10 March 1878 (26 February Old Style), his pen name Sabuhi, and a philosophical-views section stating that, being an atheist, he criticised all religions, above all the dogmas of Islam, citing Mamedov (1962).
