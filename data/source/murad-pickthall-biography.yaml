  ar: "سيرة عبد الحكيم مراد لمارمادوك بكتال في موقع «التراث الإسلامي البريطاني»، وفيها قوله عن نفسه: «أسمّي نفسي مسلماً سنياً من المدرسة الحنفية»، ونفوره من الفرقة القاديانية، وطلبه للفتاوى الحنفية."
  en: "Abdal Hakim Murad's biography of Marmaduke Pickthall for British Muslim Heritage, quoting his self-definition — 'I call myself a Sunni Muslim of the Hanafi school' — recording his impatience with the Qadiani sect, and that he was often asked for Hanafi fatwas."
