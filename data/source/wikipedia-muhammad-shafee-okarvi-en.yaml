summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد شفيع أوكاروي ⁦(2 شباط 1930 – 24 نيسان 1984)⁩، العالم والخطيب الباكستاني وأحد مؤسسي جماعة أهل السنة في باكستان وأول رئيس لها؛ تذكر هجرته سنة 1947 وتأسيسه الجامعة الحنفية أشرف المدارس في أوكارا وخطابته في كراتشي وعضويته في مجلس الأمة سنة 1977 ووفاته في كراتشي، ويحمل صندوقها حقول السنة والطريقة النقشبندية والفقه الحنفي والحركة البريلوية."
  en: "The English Wikipedia article on Muhammad Shafee Okarvi (2 February 1930 – 24 April 1984), the Pakistani scholar and orator who was one of the founders of Jamaat Ahle Sunnat Pakistan and its first chairman; it records his 1947 migration, his founding of Jamia Hanafiyya Ashraf-ul-Madaris at Okara, his Karachi preaching, his 1977 National Assembly membership and his death at Karachi, and its infobox carries Sunni, Naqshbandi, Hanafi and Barelvi fields."
  es: "El artículo de Wikipedia en inglés sobre Muhammad Shafee Okarvi (2 de febrero de 1930 - 24 de abril de 1984), el erudito y orador paquistaní que fue uno de los fundadores de Jamaat Ahle Sunnat Pakistán y su primer presidente; Registra su migración en 1947, su fundación de Jamia Hanafiyya Ashraf-ul-Madaris en Okara, su predicación en Karachi, su membresía en la Asamblea Nacional en 1977 y su muerte en Karachi, y su cuadro de información incluye campos suníes, naqshbandi, hanafi y barelvi."
  fr: "L'article de Wikipédia en anglais sur Muhammad Shafee Okarvi (2 février 1930 – 24 avril 1984), érudit et orateur pakistanais qui fut l'un des fondateurs de Jamaat Ahle Sunnat Pakistan et son premier président; Il enregistre sa migration en 1947, sa fondation de Jamia Hanafiyya Ashraf-ul-Madaris à Okara, sa prédication à Karachi, son adhésion à l'Assemblée nationale en 1977 et sa mort à Karachi, et sa boîte d'information contient les domaines sunnite, Naqshbandi, Hanafi et Barelvi."
