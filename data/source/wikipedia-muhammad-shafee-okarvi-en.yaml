summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد شفيع أوكاروي (2 شباط 1930 – 24 نيسان 1984)، العالم والخطيب الباكستاني وأحد مؤسسي جماعة أهل السنة في باكستان وأول رئيس لها؛ تذكر هجرته سنة 1947 وتأسيسه الجامعة الحنفية أشرف المدارس في أوكارا وخطابته في كراتشي وعضويته في مجلس الأمة سنة 1977 ووفاته في كراتشي، ويحمل صندوقها حقول السنة والطريقة النقشبندية والفقه الحنفي والحركة البريلوية."
  en: "The English Wikipedia article on Muhammad Shafee Okarvi (2 February 1930 – 24 April 1984), the Pakistani scholar and orator who was one of the founders of Jamaat Ahle Sunnat Pakistan and its first chairman; it records his 1947 migration, his founding of Jamia Hanafiyya Ashraf-ul-Madaris at Okara, his Karachi preaching, his 1977 National Assembly membership and his death at Karachi, and its infobox carries Sunni, Naqshbandi, Hanafi and Barelvi fields."
