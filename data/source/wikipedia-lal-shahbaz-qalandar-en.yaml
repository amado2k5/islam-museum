summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن لعل شهباز قلندر ⁦(السيد عثمان المروندي، 1177 – 19 فبراير 1274)⁩ في سيهون بالسند؛ تصفه بأنه ولي صوفي وشاعر وقلندر جوّال، ولا تسمّي طريقة له؛ تُستخدم لوقائع الكيان فقط."
  en: "English Wikipedia article on Lal Shahbaz Qalandar (Sayyid Uthman al-Marwandi, 1177 - 19 February 1274) of Sehwan in Sindh; it describes him as a Sufi saint, poet and wandering Qalandar, and names no order for him; used for entity facts only."
  es: "Artículo de Wikipedia en inglés sobre Lal Shahbaz Qalandar (Sayyid Uthman al-Marwandi, 1177 - 19 de febrero de 1274) de Sehwan en Sindh; lo describe como un santo sufí, poeta y Qalandar errante, y no le menciona ningún orden; Se utiliza únicamente para hechos de entidades."
  fr: "Article Wikipédia en anglais sur Lal Shahbaz Qalandar (Sayyid Uthman al-Marwandi, 1177-19 février 1274) de Sehwan dans le Sind; il le décrit comme un saint soufi, poète et Qalandar errant, et ne nomme aucun ordre pour lui; utilisé uniquement pour les faits d’entité."
  ur: "سندھ میں سیہون کے لعل شہباز قلندر ⁦(سید عثمان المروندی، 1177 - 19 فروری 1274)⁩ پر انگریزی ویکیپیڈیا کا مضمون؛ اس میں اسے ایک صوفی بزرگ، شاعر اور آوارہ قلندر کے طور پر بیان کیا گیا ہے، اور اس کے لیے کوئی حکم نہیں ہے۔ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔"
  tr: "Belki Şahbaz Qalandar (Seyyid Osman el-Marvandi, 1177 – 19 Şubat 1274) hakkında İngilizce Vikipedi makalesi, onu Sufi azizi, şair ve Qalandar'ı bir gezgin olarak tanımlar, yöntemini belirtmeden; sadece varlığın gerçekleri için kullanılır."
  id: "Artikel Wikipedia bahasa Inggris tentang Mungkin Shahbaz Qalandar (Sayyid Uthman al-Marvandi, 1177 – 19 Februari 1274) di Sihun, Sindh; menggambarkannya sebagai wali Sufi, penyair, dan Qalandar sebagai pengelana, tanpa menyebutkan metodenya; hanya digunakan untuk fakta entitas."
