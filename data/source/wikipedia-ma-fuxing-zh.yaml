summary:
  ar: "مقالة ويكيبيديا الصينية عن ما فوشينغ؛ تُستخدم لوقائع الكيان فقط. تعطي مولده سنة 1866 في جيانشوي بيونان وقتله في كاشغر في 2 حزيران 1924، وتصفه في مطلعها بأنه زعيم «التعليم القديم» الخوفية في الإسلام."
  en: "Chinese Wikipedia article on Ma Fuxing; used for entity facts only. It gives his birth in 1866 at Jianshui in Yunnan and his killing at Kashgar on 2 June 1924, and describes him in its lead as a leader of the Khufiyya 'old teaching' of Islam."
  es: "Artículo de la Wikipedia en chino sobre Ma Fuxing; utilizado únicamente para obtener información sobre la persona. Indica que nació en 1866 en Jianshui, Yunnan, y que fue asesinado en Kashgar el 2 de junio de 1924. En su introducción, lo describe como un líder de la tradición Khufiyya, la \"antigua enseñanza\" del islam."
  fr: "Article de Wikipédia en chinois sur Ma Fuxing; utilisé uniquement pour les informations sur l’entité. Il indique sa naissance en 1866 à Jianshui, dans le Yunnan, et son assassinat à Kashgar le 2 juin 1924, et le décrit en introduction comme un chef de file de l’école khufiyya, « l’ancien enseignement » de l’islam."
  ur: "ما فکسنگ پر چینی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1866 میں یونان کے جیانشوئی میں ان کی پیدائش اور 2 جون 1924 کو کاشغر میں ان کے قتل کو بیان کرتا ہے، اور اسے اسلام کی خفیہ 'پرانی تعلیم' کے رہنما کے طور پر بیان کرتا ہے۔"
  tr: "Çin Vikipedi'sinde Ma Fuxing hakkında makale; yalnızca varlığın gerçekleri için kullanılmıştır. 1866'da Jianshui Biunan'da doğduğunu ve 2 Haziran 1924'te Kaşgar'da suikasta uğradığını anlatır ve açılışında onu korkutucu İslam'ın 'eski öğretisi'nin lideri olarak tanımlar."
  id: "Artikel Wikipedia Tiongkok tentang Ma Fuxing; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya pada tahun 1866 di Jianshui Biunan dan pembunuhannya di Kashgar pada 2 Juni 1924, dan menggambarkannya di pembukaannya sebagai pemimpin 'ajaran lama' Islam yang ditakuti."
