reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision; its narrative rests chiefly on the Xinjiang literary and historical materials collection (1998). It gives his courtesy name as Shenzhi, his birth year as 1866 — against 1864 in the English article and Wikidata — and his death at Kashgar on 2 June 1924. Its lead sentence calls him a leader of the Khufiyya (虎夫耶) 'old teaching'; no other article read repeats that affiliation, so it is a single-text attestation."
