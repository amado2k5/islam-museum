summary:
  ar: "مقالة ويكيبيديا الأردية عن صلاح البدير؛ تُستخدم لوقائع الكيان فقط. صندوقها المقتضب لا يحمل خانات دينية ولا يسمي نصها مذهباً، وإن صنّفته فئاتها في الأئمة السنة والعلماء السنة السعوديين؛ وتذكر مولده بالهفوف وإماماته وقضاءه بالمدينة دون تاريخ مولد."
  en: "Urdu Wikipedia article on Salah Al-Budair; used for entity facts only. Its bare infobox carries no religion fields and its text names no school, though its categories file him among Sunni imams and Saudi Sunni scholars; it gives his birth at Hofuf, his imamates and his Medina judgeship, without a birth date."
  es: "Artículo de Wikipedia en urdu sobre Salah Al-Budair; utilizado únicamente para datos sobre la persona. Su breve ficha informativa no incluye campos sobre religión y su texto no menciona ninguna escuela, aunque sus categorías lo clasifican entre los imanes sunitas y los eruditos sunitas saudíes; indica su lugar de nacimiento en Hofuf, sus imamatos y su cargo como juez en Medina, sin especificar la fecha de nacimiento."
  fr: "Article de Wikipédia en ourdou sur Salah Al-Budair; utilisé uniquement pour les informations sur l'entité. Son infobox minimaliste ne comporte aucun champ relatif à la religion et son texte ne mentionne aucune école, bien que ses catégories le classent parmi les imams sunnites et les érudits sunnites saoudiens; elle indique sa naissance à Hofuf, ses imamats et sa fonction de juge à Médine, sans toutefois préciser de date de naissance."
  ur: "صلاح البدیر پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کے ننگے انفو باکس میں کوئی مذہب نہیں ہے اور اس کے متن کا کوئی نام نہیں ہے، حالانکہ اس کے زمرے اسے سنی اماموں اور سعودی سنی علماء میں درج کرتے ہیں۔ یہ اس کی پیدائش ہفوف، اس کے ائمہ اور اس کے مدینہ جج کے مقام پر بغیر تاریخ پیدائش کے کرتا ہے۔"
