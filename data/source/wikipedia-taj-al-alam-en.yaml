reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It gives her birth as Putri Sri Alam in 1612, her father as Iskandar Muda and her husband as his successor Iskandar Thani, her marriage in 1619, her enthronement after her husband's death on 15 February 1641, her reign to 1675 as the first of four successive sultanas, the contraction of Acehnese power and the VOC treaties of 1659 and 1663, the Bustan's characterisation of her as virtuous and pious, the Islamic scholarship of her court — Abdurrauf of Singkil writing on Shafi'i jurisprudence, a school named for him, not for her — and her death on 23 October 1675 leaving no children. It names no school or order for the sultana herself. Checked 1 November 2026."
