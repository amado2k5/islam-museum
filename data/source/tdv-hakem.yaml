  en: "HAKEM (the arbiter chosen by the parties) — TDV İslâm Ansiklopedisi (Ahmet Akgündüz)"
summary:
  ar: "مدخل «حكم» في موسوعة TDV الإسلامية: الحَكَم في الجاهلية الحجازية وحكماء القبائل والسوق ومنهم النساء، تحكيم النبي في الحجر الأسود، فرق الحَكَم عن القاضي والوسيط والخبير، وشروط الحَكَم عند الفقهاء."
  en: "The TDV İslâm Ansiklopedisi entry on the hakam: the arbiter in pre-Islamic Hijazi society, the famous tribal and market arbiters including women, the Prophet's arbitration over the Black Stone, what separates the hakam from the qadi, the mediator and the expert, and the qualifications the jurists required."
  es: "La entrada de TDV İslâm Ansiklopedisi sobre el hakam: el árbitro en la sociedad hiyazí preislámica, los famosos árbitros tribales y de mercado, incluidas las mujeres, el arbitraje del Profeta sobre la Piedra Negra, qué diferencia al hakam del qadi, del mediador y del experto, y las cualificaciones que exigían los juristas."
  fr: "L'article de TDV İslâm Ansiklopedisi sur le hakam: l'arbitre dans la société préislamique du Hedjaz, les célèbres arbitres tribaux et de marché, y compris les femmes, l'arbitrage du Prophète sur la Pierre Noire, ce qui distingue le hakam du qadi, du médiateur et de l'expert, et les qualifications requises des juristes."
