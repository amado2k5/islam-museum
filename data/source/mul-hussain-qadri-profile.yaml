  en: "Official profile of Hussain Mohi-ud-Din Qadri on the Minhaj University Lahore website, read on 5 November 2026. It records his birth in Lahore on 24 October 1982; his education at Aitcheson College, York University Toronto, Sciences-Po Paris (MBA 2005) and Victoria University Melbourne (PhD in Economics); a 2020 Harvard qualification; his posts as President of Minhaj-ul-Quran International, Deputy Chairman of the Board of Governors of Minhaj University Lahore, Chairman of Minhaj Education Society and of Aghosh Orphan Care Homes, and CEO of Al-Mawakhat Microfinance; 50 authored books; the Global Islamic Finance Award (September 2019); and that Shaykh-ul-Islam Prof. Dr Muhammad Tahir-ul-Qadri, 'his venerable father', was among his teachers in Shari'ah and classical Islamic sciences."
