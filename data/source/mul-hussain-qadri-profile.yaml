label:
  en: "Minhaj University Lahore profile of Prof. Dr Hussain Mohi-ud-Din Qadri"
summary:
  ar: "الملف الرسمي لحسين محيي الدين قادري على موقع جامعة منهاج لاهور، كما قُرئ في 5 نوفمبر 2026."
  en: "Official profile of Hussain Mohi-ud-Din Qadri on the Minhaj University Lahore website, read on 5 November 2026. It records his birth in Lahore on 24 October 1982; his education at Aitcheson College, York University Toronto, Sciences-Po Paris (MBA 2005) and Victoria University Melbourne (PhD in Economics); a 2020 Harvard qualification; his posts as President of Minhaj-ul-Quran International, Deputy Chairman of the Board of Governors of Minhaj University Lahore, Chairman of Minhaj Education Society and of Aghosh Orphan Care Homes, and CEO of Al-Mawakhat Microfinance; 50 authored books; the Global Islamic Finance Award (September 2019); and that Shaykh-ul-Islam Prof. Dr Muhammad Tahir-ul-Qadri, 'his venerable father', was among his teachers in Shari'ah and classical Islamic sciences."
  es: "Perfil oficial de Hussain Mohi-ud-Din Qadri en el sitio web de la Universidad Minhaj de Lahore, consultado el 5 de noviembre de 2026. En él se registra su nacimiento en Lahore el 24 de octubre de 1982; su formación académica en Aitcheson College, la Universidad de York en Toronto, Sciences-Po París (MBA 2005) y la Universidad Victoria de Melbourne (doctorado en Economía); una titulación de Harvard de 2020; sus cargos como Presidente de Minhaj-ul-Quran International, Vicepresidente del Consejo de Administración de la Universidad Minhaj de Lahore, Presidente de la Sociedad Educativa Minhaj y de los Hogares de Cuidado para Huérfanos Aghosh, y Director Ejecutivo de Al-Mawakhat Microfinance; 50 libros de su autoría; el Premio Global de Finanzas Islámicas (septiembre de 2019); y que el Shaykh-ul-Islam Prof. Dr. Muhammad Tahir-ul-Qadri, 'su venerable padre', fue uno de sus maestros en Sharia y ciencias islámicas clásicas."
  fr: "Profil officiel de Hussain Mohi-ud-Din Qadri sur le site web de l'Université Minhaj de Lahore, consulté le 5 novembre 2026. Il mentionne sa naissance à Lahore le 24 octobre 1982; ses études à l'Aitcheson College, à l'Université York de Toronto, à Sciences Po Paris (MBA 2005) et à l'Université Victoria de Melbourne (doctorat en économie); un diplôme de Harvard obtenu en 2020; ses fonctions de président de Minhaj-ul-Quran International, de vice-président du conseil d'administration de l'Université Minhaj de Lahore, de président de la Minhaj Education Society et des foyers pour orphelins Aghosh, et de directeur général d'Al-Mawakhat Microfinance; 50 ouvrages publiés; le Prix mondial de la finance islamique (septembre 2019); et que le cheikh-ul-Islam, le professeur Dr Muhammad Tahir-ul-Qadri, « son vénérable père », a compté parmi ses professeurs de charia et de sciences islamiques classiques."
  ur: "منہاج یونیورسٹی لاہور کی ویب سائٹ پر حسین محی الدین قادری کا آفیشل پروفائل، 5 نومبر 2026 کو پڑھا گیا۔ اس میں ان کی پیدائش 24 اکتوبر 1982 کو درج ہے۔ ایچیسن کالج، یارک یونیورسٹی ٹورنٹو، سائنسز-پو پیرس ⁦(ایم بی اے 2005)⁩ اور وکٹوریہ یونیورسٹی میلبورن ⁦(معاشیات میں پی ایچ ڈی)⁩ میں ان کی تعلیم؛ ہارورڈ کی 2020 کی اہلیت؛ منہاج القرآن انٹرنیشنل کے صدر، منہاج یونیورسٹی لاہور کے بورڈ آف گورنرز کے ڈپٹی چیئرمین، منہاج ایجوکیشن سوسائٹی اور آغوش آرفن کیئر ہومز کے چیئرمین، اور المواخات مائیکرو فنانس کے سی ای او کے طور پر ان کے عہدے۔ 50 تصنیف شدہ کتابیں؛ گلوبل اسلامک فنانس ایوارڈ ⁦(ستمبر 2019)⁩؛ اور یہ کہ شیخ الاسلام پروفیسر ڈاکٹر محمد طاہرالقادری، 'ان کے والد محترم'، شریعت اور کلاسیکی اسلامی علوم میں ان کے اساتذہ میں سے تھے۔"
  tr: "Hussain Mohiuddin Qadri'nin resmi dosyası, 5 Kasım 2026 tarihinde okunan Minhaj Üniversitesi Lahore web sitesinde."
  id: "Berkas resmi Hussain Mohiuddin Qadri di situs web Universitas Minhaj Lahore, seperti yang dibaca pada 5 November 2026."
