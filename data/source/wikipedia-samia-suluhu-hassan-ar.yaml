summary:
  ar: "مقالة ويكيبيديا العربية «سامية حسن» عن سامية صلوحي حسن؛ تُستخدم لوقائع الكيان فقط. تروي رئاستها تنزانيا منذ 2021. تصنيفاتها تضعها في «مسلمون تنزانيون» و«مسلمون في القرن 21»، وتضعها أيضا في مواليد 1961 خلافا لسنة 1960 في المقالة الإنجليزية وويكيداتا؛ ونصها لا يسمي دينا ولا مدرسة."
  en: "Arabic Wikipedia article «سامية حسن» on Samia Suluhu Hassan; used for entity facts only. It recounts her presidency of Tanzania since 2021. Its categories file her under Tanzanian Muslims and 21st-century Muslims, and also under births of 1961, against the 1960 of the English article and Wikidata; its text names no religion or school."
  es: "Artículo en árabe de Wikipedia «سامية حسن» sobre Samia Suluhu Hassan; utilizado únicamente para datos sobre la persona. Relata su presidencia de Tanzania desde 2021. Sus categorías la clasifican dentro de los musulmanes tanzanos y los musulmanes del siglo XXI, y también entre los nacidos en 1961, en contraposición a los 1960 del artículo en inglés y Wikidata; su texto no menciona ninguna religión ni escuela."
  fr: "L'article de Wikipédia en arabe « سامية حسن » consacré à Samia Suluhu Hassan, utilisé uniquement à des fins d'information, relate sa présidence de la Tanzanie depuis 2021. Ses catégories la classent parmi les musulmans tanzaniens et les musulmans du XXIe siècle, ainsi que parmi les personnes nées en 1961, contrairement à l'article en anglais et à Wikidata qui indiquent 1960. Le texte ne mentionne ni religion ni école."
  ur: "عربی ویکیپیڈیا مضمون «سامیة حسن» سامیہ سلوہ حسن پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 2021 سے تنزانیہ کی اس کی صدارت کا ذکر کرتا ہے۔ اس کے زمرے اسے تنزانیہ کے مسلمانوں اور 21 ویں صدی کے مسلمانوں کے تحت درج کرتے ہیں، اور 1961 کی پیدائش کے تحت بھی، انگریزی مضمون اور Wikidata کے 1960 کے خلاف؛ اس کے متن میں کسی مذہب یا اسکول کا نام نہیں ہے۔"
  tr: "Arapça Wikipedia makalesi \"Samia Salohi Hassan\" hakkında yer alır; yalnızca varlığın gerçekleri için kullanılır. 2021'den beri Tanzanya başkanlığını anlatır. Kategorileri onu \"Tanzanya Müslümanları\" ve \"21. yüzyıldaki Müslümanlar\" kategorilerine yerleştirir ve ayrıca 1961 doğumlu olarak gösterir; İngilizce ve Wikidata makalelerinde ise 1960'tan farklı olarak; metninde din veya okul belirtilmemektedir."
  id: "Artikel Wikipedia Arab \"Samia Hassan\" tentang Samia Salohi Hassan; hanya digunakan untuk fakta entitas. Artikel ini menceritakan masa kepresidenannya di Tanzania sejak 2021. Kategorinya menempatkannya di bawah \"Muslim Tanzania\" dan \"Muslim di abad ke-21,\" serta menempatkannya lahir pada 1961, berbeda dengan 1960 dalam artikel bahasa Inggris dan Wikidata; teksnya tidak menyebutkan agama atau sekolah."
