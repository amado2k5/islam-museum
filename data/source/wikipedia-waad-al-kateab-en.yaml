  ar: "مقالة ويكيبيديا الإنجليزية عن وعد الخطيب ⁦(وُلدت نحو ١٩٩١)⁩، الاسم المستعار لصحفية ومخرجة سورية فاز فيلمها الوثائقي «من أجل سما» ⁦(٢٠١٩)⁩ بجائزة بافتا لأفضل وثائقي ورُشح للأوسكار؛ تذكر سنواتها الخمس في توثيق حصار حلب للقناة الرابعة وجائزة إيمي الدولية وحياتها في المملكة المتحدة، ولا تسمي لها دينًا."
  en: "English Wikipedia article on Waad Al-Kateab (born c. 1991), the pseudonym of a Syrian journalist and filmmaker whose documentary For Sama (2019) won the BAFTA for Best Documentary and was nominated for an Academy Award; it records her five years documenting the siege of Aleppo for Channel 4 News, her International Emmy and her life in the United Kingdom, and names no faith for her."
