summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن وعد الخطيب ⁦(وُلدت نحو ١٩٩١)⁩، الاسم المستعار لصحفية ومخرجة سورية فاز فيلمها الوثائقي «من أجل سما» ⁦(٢٠١٩)⁩ بجائزة بافتا لأفضل وثائقي ورُشح للأوسكار؛ تذكر سنواتها الخمس في توثيق حصار حلب للقناة الرابعة وجائزة إيمي الدولية وحياتها في المملكة المتحدة، ولا تسمي لها دينًا."
  en: "English Wikipedia article on Waad Al-Kateab (born c. 1991), the pseudonym of a Syrian journalist and filmmaker whose documentary For Sama (2019) won the BAFTA for Best Documentary and was nominated for an Academy Award; it records her five years documenting the siege of Aleppo for Channel 4 News, her International Emmy and her life in the United Kingdom, and names no faith for her."
  es: "Artículo de la Wikipedia en inglés sobre Waad Al-Kateab (nacida hacia 1991), seudónimo de una periodista y cineasta siria cuyo documental For Sama (2019) ganó el premio BAFTA al Mejor Documental y fue nominado a un Premio de la Academia; en él se recogen sus cinco años documentando el asedio de Alepo para Channel 4 News, su premio Emmy Internacional y su vida en el Reino Unido, y no se menciona ninguna religión en particular."
  fr: "L'article de Wikipédia en anglais sur Waad Al-Kateab (née vers 1991), pseudonyme d'une journaliste et cinéaste syrienne dont le documentaire For Sama (2019) a remporté le BAFTA du meilleur documentaire et a été nominé aux Oscars; il relate ses cinq années de reportage sur le siège d'Alep pour Channel 4 News, son Emmy international et sa vie au Royaume-Uni, et ne mentionne aucune religion pour elle."
