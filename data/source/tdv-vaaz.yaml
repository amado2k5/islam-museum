summary:
  ar: "مدخل «وعظ» في موسوعة TDV الإسلامية، بابه الأول لحسن جيريت: الوعظ والقصص والتذكير في الإسلام، وتاريخ القُصّاص ⁦(الحكواتيين الواعظين)⁩ من عهد عمر بن الخطاب إلى انحطاط الصنعة في القرن الرابع الهجري، وكتب ابن الجوزي والسيوطي في زيف القصّاص."
  en: "The TDV İslâm Ansiklopedisi entry on wa'z (exhortation), its first section by Hasan Cirit: exhortation, storytelling and reminding in Islam, and the history of the qussas (storyteller-preachers) from the caliphate of Umar to the decline of the craft by the fourth Islamic century, with the books Ibn al-Jawzi and al-Suyuti wrote against the storytellers' fabrications."
  es: "La entrada de TDV İslâm Ansiklopedisi sobre wa'z (exhortación), su primera sección por Hasan Cirit: exhortación, narración de cuentos y recordatorio en el Islam, y la historia de los qussas (predicadores-narradores) desde el califato de Umar hasta el declive del oficio en el siglo IV islámico, con los libros que Ibn al-Jawzi y al-Suyuti escribieron contra las invenciones de los narradores."
  fr: "L'entrée de TDV İslâm Ansiklopedisi sur wa'z (exhortation), sa première section par Hasan Cirit: exhortation, récit et rappel dans l'Islam, et l'histoire des qussas (prédicateurs-conteurs) du califat d'Umar au déclin de cet art au IVe siècle islamique, avec les livres qu'Ibn al-Jawzi et al-Suyuti ont écrits contre les fabrications des conteurs."
