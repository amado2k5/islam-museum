summary:
  ar: "صفحة وقائع جائزة نوبل عن نجيب محفوظ: وُلد في القاهرة سنة 1911 وتوفي فيها سنة 2006، ونال جائزة نوبل في الأدب سنة 1988 لأنه شكّل فنّا سرديا عربيا ينطبق على البشرية جمعاء."
  en: "Nobel Prize facts page for Naguib Mahfouz: born in Cairo in 1911, died in Cairo in 2006; Nobel Prize in Literature 1988 for having formed an Arabian narrative art that applies to all mankind."
  es: "Página de datos sobre el Premio Nobel de Naguib Mahfouz: nació en El Cairo en 1911, murió en El Cairo en 2006; Premio Nobel de Literatura 1988 por haber creado un arte narrativo árabe aplicable a toda la humanidad."
  fr: "Fiche d'information sur le prix Nobel de Naguib Mahfouz: né au Caire en 1911, décédé au Caire en 2006; prix Nobel de littérature 1988 pour avoir créé un art narratif arabe qui s'applique à toute l'humanité."
  ur: "نجیب محفوظ کے لیے نوبل انعام کے حقائق کا صفحہ: 1911 میں قاہرہ میں پیدا ہوئے، 2006 میں قاہرہ میں انتقال کر گئے۔ نوبل انعام برائے ادب 1988 ایک عربی بیانیہ آرٹ کی تشکیل کے لیے جو تمام بنی نوع انسان پر لاگو ہوتا ہے۔"
  tr: "Naguib Mahfouz hakkında Nobel Ödülü bilgi sayfası: 1911'de Kahire'de doğdu ve 2006'da orada vefat etti. 1988'de tüm insanlığa uygulanan bir Arap anlatı sanatı oluşturduğu için Nobel Edebiyat Ödülü'nü kazandı."
  id: "Halaman fakta Nobel tentang Naguib Mahfouz: Ia lahir di Kairo pada tahun 1911 dan meninggal di sana pada tahun 2006. Ia memenangkan Hadiah Nobel Sastra pada tahun 1988 karena membentuk seni naratif Arab yang berlaku untuk seluruh umat manusia."
