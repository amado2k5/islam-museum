summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مروان الشماخ؛ تُستخدم لوقائع الكيان فقط. تروي لقب الدوري الفرنسي مع بوردو 2009 ومسيرته في إنجلترا واعتزاله 2019، وتصفه في قسم حياته الشخصية بأنه مسلم ممارس نقلاً عن «ذا إندبندنت»، وتصنفه ضمن «مسلمي فرنسا»."
  en: "English Wikipedia article on Marouane Chamakh; used for entity facts only. It recounts the 2009 Ligue 1 title with Bordeaux, his English career and his 2019 retirement; its personal-life section calls him a practising Muslim, citing The Independent, and the article files him under the category 'French Muslims'."
  es: "Artículo de la Wikipedia en inglés sobre Marouane Chamakh; utilizado únicamente para obtener información sobre la persona. Relata el título de la Ligue 1 de 2009 con el Burdeos, su trayectoria en Inglaterra y su retirada en 2019; en la sección sobre su vida personal se le describe como musulmán practicante, citando a The Independent, y el artículo lo clasifica dentro de la categoría de «musulmanes franceses»."
  fr: "Article Wikipédia en anglais sur Marouane Chamakh; utilisé uniquement à des fins d'information sur l'entité. Il relate son titre de champion de Ligue 1 avec Bordeaux en 2009, sa carrière en Angleterre et sa retraite en 2019; la section consacrée à sa vie privée le présente comme un musulman pratiquant, citant The Independent, et l'article le classe dans la catégorie « Musulmans français »."
  ur: "مروانے چماخ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ بورڈو کے ساتھ 2009 کے لیگ 1 ٹائٹل کا ذکر کرتا ہے، اس کے انگلش کیریئر اور اس کی 2019 کی ریٹائرمنٹ؛ دی انڈیپنڈنٹ کا حوالہ دیتے ہوئے اس کا ذاتی زندگی کا حصہ اسے ایک باعمل مسلمان کہتا ہے، اور مضمون اسے 'فرانسیسی مسلمان' کے زمرے میں درج کرتا ہے۔"
