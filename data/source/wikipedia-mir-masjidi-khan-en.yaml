summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مير مسجدي خان؛ تُستخدم لوقائع الكيان فقط. تعطي وفاته سنة 1841 ولا تعطي تاريخ مولد، وتصفه بأنه زعيم مقاومة أفغاني من سهل شمالي من أسرة طاجيكية عُرفت بالعلم الشرعي والتقوى، أبوه صاحبزاده إسحاق جان خان، وأنه قاد المقاومة ضد تنصيب شجاع شاه الدراني في الحرب الإنجليزية الأفغانية الأولى، وحصّن وادي نجراب وأباد حملة على چاريكار وآوى دوست محمد خان، ومات مسموما على الأرجح في أوائل 1841. لا تسمي مذهبا ولا طريقة."
  en: "English Wikipedia article on Mir Masjidi Khan; used for entity facts only. It gives his death in 1841 and no birth date, and describes him as an Afghan resistance leader from the Shamali Plain of a Tajik family respected for Islamic learning and piety, his father Sahibzada Ishaq Jan Khan, who led resistance to the installation of Shuja Shah Durrani in the First Anglo-Afghan War, fortified the Nijrab valley, destroyed an expedition sent against Charikar, sheltered Dost Mohammad Khan, and died, probably poisoned, in early 1841. It names no school or order."
  es: "Artículo de la Wikipedia en inglés sobre Mir Masjidi Khan; utilizado únicamente para datos sobre la persona. Indica que murió en 1841 y no menciona su fecha de nacimiento. Lo describe como un líder de la resistencia afgana de la llanura de Shamali, perteneciente a una familia tayika respetada por su erudición y piedad islámicas. Su padre, Sahibzada Ishaq Jan Khan, lideró la resistencia contra la instalación de Shuja Shah Durrani en la Primera Guerra Anglo-Afgana, fortificó el valle de Nijrab, destruyó una expedición enviada contra Charikar, dio refugio a Dost Mohammad Khan y murió, probablemente envenenado, a principios de 1841. No menciona ninguna escuela ni orden religiosa."
  fr: "L'article de Wikipédia en anglais consacré à Mir Masjidi Khan, utilisé uniquement pour les informations le concernant, indique sa mort en 1841 et ne mentionne pas sa date de naissance. Il le décrit comme un chef de la résistance afghane originaire de la plaine de Shamali, issu d'une famille tadjike respectée pour son érudition islamique et sa piété. Son père, Sahibzada Ishaq Jan Khan, mena la résistance contre l'intronisation de Shuja Shah Durrani lors de la Première Guerre anglo-afghane, fortifia la vallée de Nijrab, détruisit une expédition envoyée contre Charikar, abrita Dost Mohammad Khan et mourut, probablement empoisonné, au début de l'année 1841. L'article ne mentionne ni école ni ordre religieux."
  ur: "میر مسجدی خان پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی موت 1841 میں بتائی گئی ہے اور کوئی تاریخ پیدائش نہیں ہے، اور انہیں ایک تاجک خاندان کے شاملی کے میدان سے تعلق رکھنے والے افغان مزاحمتی رہنما کے طور پر بیان کیا گیا ہے جو اسلامی تعلیم اور تقویٰ کے لیے معزز تھے، ان کے والد صاحبزادہ اسحاق جان خان، جنہوں نے پہلی اینگلو-افغان جنگ میں شجاع شاہ درانی کی تنصیب کے خلاف مزاحمت کی قیادت کی، چاکراب کے خلاف قلعہ بندی کی، قلعہ بندی کی گئی، نیپالی فوج کو تباہ کر دیا۔ دوست محمد خان کو پناہ دی اور 1841 کے اوائل میں غالباً زہر کھا کر مر گیا۔"
