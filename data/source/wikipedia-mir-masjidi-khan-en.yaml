summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مير مسجدي خان؛ تُستخدم لوقائع الكيان فقط. تعطي وفاته سنة 1841 ولا تعطي تاريخ مولد، وتصفه بأنه زعيم مقاومة أفغاني من سهل شمالي من أسرة طاجيكية عُرفت بالعلم الشرعي والتقوى، أبوه صاحبزاده إسحاق جان خان، وأنه قاد المقاومة ضد تنصيب شجاع شاه الدراني في الحرب الإنجليزية الأفغانية الأولى، وحصّن وادي نجراب وأباد حملة على چاريكار وآوى دوست محمد خان، ومات مسموما على الأرجح في أوائل 1841. لا تسمي مذهبا ولا طريقة."
  en: "English Wikipedia article on Mir Masjidi Khan; used for entity facts only. It gives his death in 1841 and no birth date, and describes him as an Afghan resistance leader from the Shamali Plain of a Tajik family respected for Islamic learning and piety, his father Sahibzada Ishaq Jan Khan, who led resistance to the installation of Shuja Shah Durrani in the First Anglo-Afghan War, fortified the Nijrab valley, destroyed an expedition sent against Charikar, sheltered Dost Mohammad Khan, and died, probably poisoned, in early 1841. It names no school or order."
