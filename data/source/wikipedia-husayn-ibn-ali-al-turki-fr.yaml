summary:
  ar: "مقالة ويكيبيديا الفرنسية المفصلة عن حسين باي الأول؛ تُستخدم لوقائع الكيان فقط. تعطي مولده بالكاف سنة 1675 ابناً لعلي تركي الكريتي وحفصية الشرني، وبيعته في 12 تموز 1705 وتسلمه الحكم في 15 تموز، ومنشآته الدينية، ووفاته بالقيروان في 13 أيار 1740، وتصف تقواه نقلاً عن المؤرخ محمد الصغير بن يوسف."
  en: "French Wikipedia article on Hussein Ier Bey, the fullest of the texts read; used for entity facts only. It gives his birth at Le Kef in 1675 to Ali Turki of Crete and Hafsia Cherni, his proclamation on 12 July 1705 and taking office on 15 July, his religious buildings, his deposition in 1735 and his death at Kairouan on 13 May 1740. Following the chronicler Muhammad Saghir Ben Youssef it describes his ardent piety and rosary — documented practice, which the person record's faith note records as settling no value."
  es: "Artículo de la Wikipedia en francés sobre Hussein Ier Bey, el texto más completo de los consultados; utilizado únicamente para datos sobre la persona. Indica su nacimiento en Le Kef en 1675, hijo de Ali Turki de Creta y Hafsia Cherni; su proclamación el 12 de julio de 1705 y su toma de posesión el 15 de julio; sus edificios religiosos; su deposición en 1735; y su muerte en Kairouan el 13 de mayo de 1740. Siguiendo al cronista Muhammad Saghir Ben Youssef, describe su ferviente piedad y el uso del rosario, práctica documentada, que la nota de fe del registro de la persona indica que no tiene valor alguno."
  fr: "L'article de Wikipédia en français sur Hussein Ier Bey, le plus complet des textes consultés, est utilisé uniquement pour les informations le concernant. Il relate sa naissance au Kef en 1675, fils d'Ali Turki de Crète et d'Hafsia Cherni, sa proclamation le 12 juillet 1705 et son entrée en fonction le 15 juillet, ses édifices religieux, sa destitution en 1735 et sa mort à Kairouan le 13 mai 1740. S'appuyant sur le chroniqueur Muhammad Saghir Ben Youssef, il décrit sa piété fervente et sa pratique du rosaire – une pratique attestée, mais dont la signification est précisée dans la note relative à la foi du chroniqueur."
  ur: "حسین آئر بی پر فرانسیسی ویکیپیڈیا کا مضمون، پڑھی جانے والی تحریروں میں سے مکمل؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی پیدائش 1675 میں لی کیف میں کریٹ کے علی ترکی اور حفصہ چرنی کے ہاں ہوئی، اس کا اعلان 12 جولائی 1705 کو ہوا اور 15 جولائی کو عہدہ سنبھالا، اس کی مذہبی عمارتیں، 1735 میں اس کی معزولی اور 13 مئی 1740 کو کیروان میں اس کی موت ہوئی۔ rosary - دستاویزی مشق، جسے شخص کے عقیدے کے نوٹ میں ریکارڈ کیا جاتا ہے کہ کوئی قیمت نہیں طے کرنا۔"
  tr: "Hüseyin Bey I hakkında ayrıntılı Fransızca Vikipedi makalesi yalnızca varlığın gerçekleri için kullanılmıştır. 1675'te Kef'te Ali Turki el-Kariti ve Hafsiya el-Şerni'nin oğlu olarak doğduğunu, 12 Temmuz 1705'te bağlılığını, 15 Temmuz'da iktidarı devralmasını, dini kurumlarını ve 13 Mayıs 1740'ta Kairuan'da öldüğünü anlatır ve dindarlığını tarihçi Muhammed el-Saghir bin Yusuf'tan alıntılandığı şekilde anlatır."
  id: "Artikel rinci di Wikipedia Prancis tentang Hussein Bey I hanya digunakan untuk fakta-fakta entitas tersebut. Artikel ini menceritakan kelahirannya di Kef pada tahun 1675, putra Ali Turki al-Kariti dan Hafsiya al-Sharni, kesetiaannya pada 12 Juli 1705, naik kekuasaannya pada 15 Juli, institusi agamanya, dan kematiannya di Kairouan pada 13 Mei 1740, serta menggambarkan kesalehannya yang dikutip oleh sejarawan Muhammad al-Saghir ibn Yusuf."
