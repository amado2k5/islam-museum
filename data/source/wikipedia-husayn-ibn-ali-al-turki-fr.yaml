  ar: "مقالة ويكيبيديا الفرنسية المفصلة عن حسين باي الأول؛ تُستخدم لوقائع الكيان فقط. تعطي مولده بالكاف سنة 1675 ابناً لعلي تركي الكريتي وحفصية الشرني، وبيعته في 12 تموز 1705 وتسلمه الحكم في 15 تموز، ومنشآته الدينية، ووفاته بالقيروان في 13 أيار 1740، وتصف تقواه نقلاً عن المؤرخ محمد الصغير بن يوسف."
  en: "French Wikipedia article on Hussein Ier Bey, the fullest of the texts read; used for entity facts only. It gives his birth at Le Kef in 1675 to Ali Turki of Crete and Hafsia Cherni, his proclamation on 12 July 1705 and taking office on 15 July, his religious buildings, his deposition in 1735 and his death at Kairouan on 13 May 1740. Following the chronicler Muhammad Saghir Ben Youssef it describes his ardent piety and rosary — documented practice, which the person record's faith note records as settling no value."
