summary:
  ar: "مدخل «يني چري» في موسوعة TDV الإسلامية: مسائل تأسيس الجيش الإنكشاري، نظام الدوشرمة والأوجاق، التنظيم والتسليح والرواتب، مكانة الإنكشارية في الجيش والمجتمع، وإلغاء الأوجاق سنة 1826."
  en: "The TDV İslâm Ansiklopedisi entry on the Janissary: the corps' debated foundation, the pencik and devşirme recruitment systems, the Acemi Ocağı, organisation into ortas, arms and drill, pay, the corps' place in army and society, and its abolition in the Vak'a-i Hayriyye of 1826."
  ur: "TDV اسلامی انسائیکلوپیڈیا کا مادہ «ینی چری»: ینکری دستے کی بنیاد کے مسائل، پنجیک و دوشیرمہ بھرتی نظام، اجمی اجاق، ارتا تنظیم، اسلحہ و مشق، تنخواہ، فوج و معاشرے میں ان کا مقام، اور 1826 میں دستے کا خاتمہ۔"
  es: "La entrada de la TDV İslâm Ansiklopedisi sobre los jenízaros: la controvertida fundación del cuerpo, los sistemas de reclutamiento pencik y devşirme, el Acemi Ocağı, la organización en ortas, las armas y el entrenamiento, la paga, el lugar del cuerpo en el ejército y la sociedad, y su abolición en el Vak'a-i Hayriyye de 1826."
  fr: "L'article du TDV İslâm Ansiklopedisi sur les janissaires: la fondation controversée du corps, les systèmes de recrutement pencik et devşirme, l'Acemi Ocağı, l'organisation en ortas, les armes et l'entraînement, la solde, la place du corps dans l'armée et la société, et son abolition dans le Vak'a-i Hayriyye de 1826."
