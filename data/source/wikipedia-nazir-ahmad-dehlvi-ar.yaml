reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. A short, separately edited article sourced to the Babtain dictionary of Arabic poets. It gives the birth year 1831 (paired with 1247 AH) — one of the variants recorded in the person record — and the full name: Nazir Ahmad ibn Saadat Ali ibn Najabat Ali al-Azampuri al-Bijnori al-Dehlvi. Its printed death year '1902' is a typographical error: its own categories file him under deaths of 1912 (and of 1320 AH, itself inconsistent with 1912). It records that he studied under Nasrullah al-Khwishki, moved to Delhi and learned English, translated meanings of the Qur'an into Urdu, and was 'among the advocates and followers of the renewal movement led by Sayyid Ahmad Khan' — movement affiliation, not a school attestation. It names no school for him."
