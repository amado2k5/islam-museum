summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الحسين بن طلال (مقالة جيدة)؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في عمّان في 14 نوفمبر 1935، واعتلاءه العرش سنة 1952 في السابعة عشرة بعد عزل والده طلال، وحروب الأردن مع إسرائيل وفقدان الضفة الغربية سنة 1967 وأحداث أيلول 1970 وفك الارتباط سنة 1988 وعودة الانتخابات سنة 1989، ومرضه باللمفوما ووفاته في عمّان في 7 فبراير 1999 ودفنه في قصر رغدان. يقرأ حقل الدين في صندوق معلوماتها «الإسلام السنّي»."
  en: "English Wikipedia article on Hussein bin Talal (a Good Article); used for entity facts only. It recounts his birth in Amman on 14 November 1935, his accession in 1952 aged seventeen after his father Talal's deposition, Jordan's wars with Israel and the loss of the West Bank in 1967, Black September in 1970, the 1988 disengagement and the 1989 return of elections, his lymphoma treatment and his death in Amman on 7 February 1999 with burial at Raghadan Palace. Its infobox religion field reads 'Sunni Islam'."
