summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الحسين بن طلال ⁦(مقالة جيدة)⁩؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في عمّان في 14 نوفمبر 1935، واعتلاءه العرش سنة 1952 في السابعة عشرة بعد عزل والده طلال، وحروب الأردن مع إسرائيل وفقدان الضفة الغربية سنة 1967 وأحداث أيلول 1970 وفك الارتباط سنة 1988 وعودة الانتخابات سنة 1989، ومرضه باللمفوما ووفاته في عمّان في 7 فبراير 1999 ودفنه في قصر رغدان. يقرأ حقل الدين في صندوق معلوماتها «الإسلام السنّي»."
  en: "English Wikipedia article on Hussein bin Talal (a Good Article); used for entity facts only. It recounts his birth in Amman on 14 November 1935, his accession in 1952 aged seventeen after his father Talal's deposition, Jordan's wars with Israel and the loss of the West Bank in 1967, Black September in 1970, the 1988 disengagement and the 1989 return of elections, his lymphoma treatment and his death in Amman on 7 February 1999 with burial at Raghadan Palace. Its infobox religion field reads 'Sunni Islam'."
  es: "Artículo de la Wikipedia en inglés sobre Hussein bin Talal (un buen artículo); utilizado únicamente para datos sobre la persona. Relata su nacimiento en Amán el 14 de noviembre de 1935, su ascenso al trono en 1952 a los diecisiete años tras la deposición de su padre Talal, las guerras de Jordania con Israel y la pérdida de Cisjordania en 1967, el Septiembre Negro de 1970, la retirada de 1988 y la celebración de elecciones en 1989, su tratamiento contra el linfoma y su fallecimiento en Amán el 7 de febrero de 1999, con sepultura en el Palacio de Raghadan. El campo de religión de su ficha informativa indica «Islam sunita»."
  fr: "Article de Wikipédia en anglais sur Hussein bin Talal (un bon article); utilisé uniquement pour les informations sur l'entité. Il relate sa naissance à Amman le 14 novembre 1935, son accession au trône en 1952 à l'âge de dix-sept ans après la destitution de son père Talal, les guerres jordaniennes contre Israël et la perte de la Cisjordanie en 1967, le Septembre noir en 1970, le désengagement de 1988 et le retour des élections en 1989, son traitement contre un lymphome et sa mort à Amman le 7 février 1999, avec inhumation au palais de Raghadan. Son infobox « Religion » indique « Islam sunnite »."
  ur: "حسین بن طلال پر انگریزی ویکیپیڈیا مضمون ⁦(ایک اچھا مضمون)⁩؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 14 نومبر 1935 کو عمان میں ان کی پیدائش، 1952 میں ان کے والد طلال کی معزولی کے بعد سترہ سال کی عمر میں ان کا الحاق، اسرائیل کے ساتھ اردن کی جنگیں اور 1967 میں مغربی کنارے کی شکست، 1970 میں بلیک ستمبر، 1988 کی علیحدگی اور 1989 کے انتخابات میں عمان کی واپسی اور 1989 کے انتخابات میں عمان کی واپسی پر ان کی موت کا ذکر ہے۔ 1999 میں راغادان محل میں تدفین کے ساتھ۔ اس کے infobox مذہب کا میدان 'سنی اسلام' پڑھتا ہے۔"
