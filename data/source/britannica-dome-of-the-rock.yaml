summary:
  ar: "الصفحة «Dome of the Rock» — Encyclopaedia Britannica; لخّصها ملخص بحثي قدّمه المؤسس إلى المتحف في 21 نوفمبر 2026؛ لم يفتح المتحف الصفحة، ووافق المؤسس على استعمال الملخص دون إعادة تحقق. استُعملت في: نقش قبة الصخرة سنة 72هـ: موضعه ومضمونه."
  en: "The page «Dome of the Rock» — Encyclopaedia Britannica; summarised in a research file supplied to the museum by the founder on 21 November 2026; the museum did not open the page, and the founder approved using the summary without re-verification. Used for: the Dome of the Rock inscription of 72 AH: its place and content."
  ur: "صفحہ «Dome of the Rock» — Encyclopaedia Britannica; اسے ایک تحقیقی فائل نے خلاصہ کیا جو بانی نے 21 نومبر 2026 کو میوزیم کو دی؛ میوزیم نے صفحہ نہیں کھولا اور بانی نے دوبارہ جانچ کے بغیر خلاصہ استعمال کرنے کی منظوری دی۔ استعمال: 72ھ کا قبۃ الصخرہ کا کتبہ: اس کا مقام اور مضمون۔"
  fr: "La page «Dome of the Rock» — Encyclopaedia Britannica; résumée dans un fichier de recherche remis au musée par le fondateur le 21 novembre 2026 ; le musée n'a pas ouvert la page, et le fondateur a approuvé l'usage de la synthèse sans nouvelle vérification. Utilisée pour : l'inscription du Dôme du Rocher de 72 H : son lieu et son contenu."
  es: "La página «Dome of the Rock» — Encyclopaedia Britannica; resumida en un archivo de investigación entregado al museo por el fundador el 21 de noviembre de 2026; el museo no abrió la página, y el fundador aprobó usar el resumen sin volver a verificar. Usada para: la inscripción de la Cúpula de la Roca del año 72 AH: su lugar y su contenido."
  tr: "\"Kaya Kubbesi\" sayfası — Encyclopaedia Britannica; Kurucu tarafından 21 Kasım 2026'da müzeye sunulan bir araştırma özetiyle özetlenmiştir; Müze sayfayı açmamış ve kurucu özeti yeniden doğrulama yapmadan kullanmayı kabul etmiştir. Kullanıldığı yer: 72 Hicri Kaya Kubbesi yazıtı: konumu ve içeriği."
  id: "Halaman \"Dome of the Rock\" — Encyclopaedia Britannica; Ringkasan ini dirangkum oleh ringkasan penelitian yang diajukan oleh pendiri ke museum pada 21 November 2026; Museum tidak membuka halaman tersebut, dan pendiri setuju untuk menggunakan abstrak tanpa verifikasi ulang. Digunakan dalam: Prasasti Rock Dome tahun 72 AH: lokasi dan isinya."
