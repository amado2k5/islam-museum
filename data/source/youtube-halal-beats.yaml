summary:
  ar: "قناة «حلال بيتس» على يوتيوب للفنان والمنتج المقيم في لندن عمر فالو؛ تحمل أغانيه ومقاطعه الصوتية المعتمدة على الصوت البشري والدف فقط، وتربط موقعه الرسمي وصفحاته على منصات البث."
  en: "The Halal Beats YouTube channel of the London-based artist and producer Umar Valu; it carries his songs and soundtracks made with the human voice and the daf only, and links his official website and his streaming-platform artist pages."
  es: "El canal de YouTube Halal Beats del artista y productor londinense Umar Valu; en él se pueden encontrar sus canciones y bandas sonoras creadas únicamente con la voz humana y el daf, y se incluyen enlaces a su sitio web oficial y a sus páginas de artista en plataformas de streaming."
  fr: "La chaîne YouTube Halal Beats de l'artiste et producteur londonien Umar Valu; elle propose ses chansons et bandes originales réalisées uniquement avec la voix humaine et le daf, et renvoie vers son site officiel et ses pages d'artiste sur les plateformes de streaming."
  ur: "لندن میں مقیم فنکار اور پروڈیوسر عمر والو کا حلال بیٹس یوٹیوب چینل؛ یہ صرف انسانی آواز اور ڈی اے ایف کے ساتھ بنائے گئے اس کے گانے اور ساؤنڈ ٹریک رکھتا ہے، اور اس کی آفیشل ویب سائٹ اور اس کے اسٹریمنگ پلیٹ فارم آرٹسٹ کے صفحات کو لنک کرتا ہے۔"
  tr: "Londra merkezli sanatçı ve yapımcı Omar Falou'nun YouTube kanalı 'Halal Beats', şarkılarını ve ses kliplerini yalnızca insan sesi ve tefle paylaşıyor, resmi web sitesi ve yayın platformlarındaki sayfalarına bağlantı veriyor."
  id: "Saluran YouTube 'Halal Beats' oleh artis dan produser asal London, Omar Falou, menampilkan lagu-lagu dan klip audio yang sepenuhnya didasarkan pada suara manusia dan tamborin, serta menautkan ke situs resmi dan halaman di platform streaming."
