  ar: "مقالة ويكيبيديا الأوكرانية عن جعفر سيدامت قريمر؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 1 سبتمبر 1889 في قيزيل طاش ووفاته في 3 أبريل 1960 في إسطنبول، وتفصّل تأسيسه جمعية الطلبة التتر مع نعمان چلبى جهان سنة 1908 ووزاراته ولقاءاته في كييف ودعمه حركة بروميثيوس؛ ولا تتضمن أي محتوى ديني عنه."
  en: "Ukrainian Wikipedia article on Djafer Seydamet Kirimer; used for entity facts only. It gives his birth on 1 September 1889 at Kiziltash and his death on 3 April 1960 in Istanbul, and details his 1908 co-founding of the Crimean Tatar Students' Association with Noman Chelebidjikhan, his ministries, his Kyiv meetings and his support for Prometheism; it contains no religion content about him."
