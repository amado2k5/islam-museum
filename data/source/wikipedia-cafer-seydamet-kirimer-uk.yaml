summary:
  ar: "مقالة ويكيبيديا الأوكرانية عن جعفر سيدامت قريمر؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 1 سبتمبر 1889 في قيزيل طاش ووفاته في 3 أبريل 1960 في إسطنبول، وتفصّل تأسيسه جمعية الطلبة التتر مع نعمان چلبى جهان سنة 1908 ووزاراته ولقاءاته في كييف ودعمه حركة بروميثيوس؛ ولا تتضمن أي محتوى ديني عنه."
  en: "Ukrainian Wikipedia article on Djafer Seydamet Kirimer; used for entity facts only. It gives his birth on 1 September 1889 at Kiziltash and his death on 3 April 1960 in Istanbul, and details his 1908 co-founding of the Crimean Tatar Students' Association with Noman Chelebidjikhan, his ministries, his Kyiv meetings and his support for Prometheism; it contains no religion content about him."
  es: "Artículo de la Wikipedia en ucraniano sobre Djafer Seydamet Kirimer; utilizado únicamente para datos sobre la persona. Indica su nacimiento el 1 de septiembre de 1889 en Kiziltash y su fallecimiento el 3 de abril de 1960 en Estambul, y detalla su cofundación en 1908 de la Asociación de Estudiantes Tártaros de Crimea con Noman Chelebidjikhan, sus ministerios, sus reuniones en Kiev y su apoyo al prometeísmo; no contiene información religiosa sobre él."
  fr: "Article de Wikipédia ukrainien sur Djafer Seydamet Kirimer; utilisé uniquement pour les informations biographiques. Il indique sa naissance le 1er septembre 1889 à Kiziltash et son décès le 3 avril 1960 à Istanbul, et détaille sa co-fondation en 1908 de l'Association des étudiants tatars de Crimée avec Noman Chelebidjikhan, ses ministères, ses réunions à Kyiv et son soutien au prométhéisme; il ne contient aucun contenu religieux le concernant."
  ur: "Djafer Seydamet Kirimer پر یوکرینی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1 ستمبر 1889 کو کِزلتاش میں ان کی پیدائش اور 3 اپریل 1960 کو استنبول میں اس کی موت کا ذکر کرتا ہے، اور اس کی 1908 میں نعمان چیلیبیدجیخان کے ساتھ کریمین تاتار طلباء کی تنظیم کے شریک بانی، اس کی وزارتیں، اس کی کیو میٹنگز اور پرومیتھیزم کے لیے اس کی حمایت کی تفصیلات بتاتی ہیں۔ اس میں اس کے بارے میں کوئی مذہبی مواد نہیں ہے۔"
