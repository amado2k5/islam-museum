  ar: "مقالة ويكيبيديا العربية عن هوار ملا محمد؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 1 يونيو 1981 في الموصل ومسيرته مع الأندية والمنتخب العراقي، وتقرن سنة ميلاده بسنة 1401 هـ في تصنيفاتها. ولا تذكر ديانته."
  en: "Arabic Wikipedia article on Hawar Mulla Mohammed; used for entity facts only. It gives his birth on 1 June 1981 in Mosul, his club and Iraq career, and pairs his birth year with 1401 AH in its categories. It makes no statement about his religion."
