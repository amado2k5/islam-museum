summary:
  ar: "مقالة ريتشارد بوليت المؤسِّسة عن الطرش في تاريخ الطباعة: يؤرخ المطبوعات العربية، يصف القوالب الخشبية والمعدنية والحبر والقطع المتعددة للنص الواحد، ويقترح أن الطباعة العربية اختراع مستقل لا نقل عن الصين."
  en: "Richard W. Bulliet's foundational article on the tarsh in the history of printing: dates the Arabic blockprints, describes wooden and metal matrices, the inks and the multi-block printing of a single text, and argues that Arabic block printing was most likely an independent invention rather than a borrowing from China."
  es: "El artículo fundamental de Richard W. Bulliet sobre el tarsh en la historia de la imprenta: fecha las impresiones en bloque árabes, describe las matrices de madera y metal, las tintas y la impresión en múltiples bloques de un solo texto, y argumenta que la impresión en bloque árabe fue muy probablemente una invención independiente en lugar de un préstamo de China."
  fr: "L'article fondateur de Richard W. Bulliet sur le tarsh dans l'histoire de l'imprimerie: date les estampes arabes, décrit les matrices en bois et en métal, les encres et l'impression multi-blocs d'un seul texte, et soutient que l'impression arabe sur blocs était très probablement une invention indépendante plutôt qu'un emprunt à la Chine."
  ur: "پرنٹنگ کی تاریخ میں ترش پر رچرڈ ڈبلیو بلیٹ کا بنیادی مضمون: عربی بلاک پرنٹس کی تاریخیں، لکڑی اور دھاتی میٹرکس، سیاہی اور ایک متن کی ملٹی بلاک پرنٹنگ کی وضاحت کرتا ہے، اور دلیل دیتا ہے کہ عربی بلاک پرنٹنگ غالباً ایک آزاد ایجاد تھی نہ کہ چین سے ادھار لی گئی تھی۔"
  tr: "Richard Bullitt'in matbaacılık tarihindeki sağırlık üzerine makalesi: Arap baskılarını kronikleştiriyor, ahşap, metalik, mürekkep ve tek bir metnin birden fazla parçasını tanımlıyor ve Arap baskısının Çin'in bir kopyası değil, bağımsız bir icat olduğunu öne sürüyor."
  id: "Artikel Richard Bullitt tentang tuli dalam sejarah percetakan: Ia mendokumentasikan cetakan Arab, menggambarkan kayu, logam, tinta, dan beberapa bagian dari satu teks, serta menyarankan bahwa pencetakan Arab adalah penemuan independen, bukan salinan dari Tiongkok."
title: "Medieval Arabic Tarsh: A Forgotten Chapter in the History of Printing"
