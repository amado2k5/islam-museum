  ar: "مقالة ريتشارد بوليت المؤسِّسة عن الطرش في تاريخ الطباعة: يؤرخ المطبوعات العربية، يصف القوالب الخشبية والمعدنية والحبر والقطع المتعددة للنص الواحد، ويقترح أن الطباعة العربية اختراع مستقل لا نقل عن الصين."
  en: "Richard W. Bulliet's foundational article on the tarsh in the history of printing: dates the Arabic blockprints, describes wooden and metal matrices, the inks and the multi-block printing of a single text, and argues that Arabic block printing was most likely an independent invention rather than a borrowing from China."
