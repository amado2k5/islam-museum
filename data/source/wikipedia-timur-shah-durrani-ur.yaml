reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). A short article: it names him second ruler of the Durrani (Abdali) empire, reigning from 16 October 1772 until his death on 18 May 1793 — its accession day differs from the English article's November 1772, while its death day agrees with the English body and Wikidata against the English lead's 20 May — and second, eldest surviving son of Ahmad Shah Abdali, with a list of Ahmad Shah's eight sons and the succession of rulers after him. Its categories file both 1746 and 1748 as birth years. It names no religion or legal school for him. Checked 1 November 2026."
