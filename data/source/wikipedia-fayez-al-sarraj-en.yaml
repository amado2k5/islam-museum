  ar: "مقالة ويكيبيديا الإنجليزية عن فايز السراج؛ تُستخدم لوقائع الكيان فقط. تذكر ميلاده في 20 فبراير 1960 بطرابلس، ورئاسته للمجلس الرئاسي الليبي وحكومة الوفاق الوطني (2016–2021)، وتدريبه مهندسًا معماريًّا وعمله بوزارة الإسكان. لا تذكر المقالة دينه في نصها ولا في صندوق معلوماتها."
