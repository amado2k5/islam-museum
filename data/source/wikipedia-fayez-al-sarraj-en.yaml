summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن فايز السراج؛ تُستخدم لوقائع الكيان فقط. تذكر ميلاده في 20 فبراير 1960 بطرابلس، ورئاسته للمجلس الرئاسي الليبي وحكومة الوفاق الوطني (2016–2021)، وتدريبه مهندسًا معماريًّا وعمله بوزارة الإسكان. لا تذكر المقالة دينه في نصها ولا في صندوق معلوماتها."
  en: "English Wikipedia article on Fayez al-Sarraj; used for entity facts only. It gives his birth on 20 February 1960 at Tripoli, his chairmanship of Libya's Presidential Council and headship of the Government of National Accord (2016–2021), his training as an architect and his employment at the Housing Ministry. The article states no religion for him in its text or infobox."
  es: "Artículo de Wikipedia en inglés sobre Fayez al-Sarraj; utilizado únicamente para datos sobre la persona. Indica que nació el 20 de febrero de 1960 en Trípoli, presidió el Consejo Presidencial de Libia y dirigió el Gobierno de Acuerdo Nacional (2016-2021), se formó como arquitecto y trabajó en el Ministerio de Vivienda. El artículo no menciona su religión ni en el texto ni en el recuadro informativo."
  fr: "Article de Wikipédia en anglais sur Fayez al-Sarraj; utilisé uniquement pour les informations relatives à l'entité. Il indique sa naissance le 20 février 1960 à Tripoli, sa présidence du Conseil présidentiel libyen et son poste à la tête du Gouvernement d'union nationale (2016-2021), sa formation d'architecte et son emploi au ministère du Logement. L'article ne mentionne aucune religion à son sujet, ni dans son texte ni dans son infobox."
