label:
  ar: "مصطفى محمود، القرآن كائن حي ⁦(دار المعارف، القاهرة، نحو 1993)⁩"
  en: "Mostafa Mahmoud, al-Qur'an Ka'in Hayy (Dar al-Ma'arif, Cairo, c. 1993)"
  ur: "مصطفیٰ محمود، القرآن کائن حی ⁦(دار المعارف، قاہرہ، تقریباً 1993)⁩"
summary:
  ar: "طبعة دار المعارف من كتاب مصطفى محمود «القرآن كائن حي»، مقالات في البنية «العضوية» للكلمة القرآنية، والنفس والروح، وغاية الخلق، وأسلوب خطبة الجمعة، والعلوم الذرية والطب والإسلام، والجبر والاختيار."
  en: "Dar al-Ma'arif's printing of Mostafa Mahmoud's al-Qur'an Ka'in Hayy: essays on the 'organic' structure of the Qur'anic word, the self and the spirit, the purpose of creation, the style of the Friday sermon, atomic science, medicine and Islam, and freedom and determinism."
  ur: "مصطفیٰ محمود کی «القرآن کائن حی» کا دار المعارف کا ایڈیشن: قرآنی لفظ کی «عضوی» ساخت، نفس اور روح، تخلیق کا مقصد، خطبۂ جمعہ کا اسلوب، ایٹمی علوم، طب اور اسلام، اور جبر و اختیار پر مضامین۔"
  es: "Edición de Dar al-Ma'arif de Al-Qur'an Ka'in Hayy de Mostafa Mahmoud: ensayos sobre la estructura \"orgánica\" de la palabra coránica, el yo y el espíritu, el propósito de la creación, el estilo del sermón del viernes, la ciencia atómica, la medicina y el Islam, y la libertad y el determinismo."
  fr: "L'impression par Dar al-Ma'arif de l'ouvrage de Mostafa Mahmoud, al-Qur'an Ka'in Hayy: essais sur la structure « organique » du mot coranique, le soi et l'esprit, le but de la création, le style du sermon du vendredi, la science atomique, la médecine et l'islam, et la liberté et le déterminisme."
  tr: "Mustafa Mahmoud'un \"Kur'an Yaşayan Bir Varlıktır\" adlı kitabının Dar Al-Maaref baskısı, Kur'an sözünin \"organik\" yapısı, ruh ve ruh, yaratılışın amacı, Cuma vaazlarının tarzı, atom bilimleri, tıp ve İslam, cebir ve özgür irade üzerine denemeler."
  id: "Edisi Dar Al-Maaref dari buku Mustafa Mahmoud \"Al-Quran adalah Makhluk Hidup,\" esai tentang struktur \"organik\" firman Al-Qur'an, jiwa dan roh, tujuan penciptaan, gaya khotbah Jumat, ilmu atom, kedokteran dan Islam, aljabar, serta kehendak bebas."
