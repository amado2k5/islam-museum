summary:
  ar: "طبعة دار المعارف من كتاب مصطفى محمود «القرآن كائن حي»، مقالات في البنية «العضوية» للكلمة القرآنية، والنفس والروح، وغاية الخلق، وأسلوب خطبة الجمعة، والعلوم الذرية والطب والإسلام، والجبر والاختيار."
  en: "Dar al-Ma'arif's printing of Mostafa Mahmoud's al-Qur'an Ka'in Hayy: essays on the 'organic' structure of the Qur'anic word, the self and the spirit, the purpose of creation, the style of the Friday sermon, atomic science, medicine and Islam, and freedom and determinism."
  ur: "مصطفیٰ محمود کی «القرآن کائن حی» کا دار المعارف کا ایڈیشن: قرآنی لفظ کی «عضوی» ساخت، نفس اور روح، تخلیق کا مقصد، خطبۂ جمعہ کا اسلوب، ایٹمی علوم، طب اور اسلام، اور جبر و اختیار پر مضامین۔"
