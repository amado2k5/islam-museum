reliability_note: "Auction house object page read in full 2026-11-15. Gives the instrument's technical description (brass disc, magnetic compass, wind-rose, city qibla names, small sundial below the south point, missing levelling screws and graduated semi-circular arc), the attribution to fifteenth-century al-Wafa'i, the acknowledged inspiration from Ibn al-Shatir's Jewel Box (citing King p. 53), Ottoman popularity via Seydi Ali Reis (citing Brice/Imber/Lorch 1976 and Maddison & Savage-Smith 1997 pp. 277-279), and a signed example by 'Amal Hasan Baba al-Duyuwi 1171' (1757/58). Auction descriptions are commercial but the technical and bibliographic content is standard for Islamic-object catalogues."
