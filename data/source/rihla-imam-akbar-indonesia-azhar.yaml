label:
  ar: رحلة الإمام الأكبر إلى إندونيسيا
  en: "The Grand Imam's Journey to Indonesia"
summary:
  ar: "كتاب من السلسلة العلمية لمجمع البحوث الإسلامية بالأزهر الشريف ⁦(السنة 49، 1439هـ/2018م، 170 صفحة)⁩، يسجل زيارة الإمام الأكبر أ.د. أحمد الطيب إلى إندونيسيا في فبراير 2016م، ويعرض بطاقة البلد وعلاقات مصر به وأنشطة الأزهر فيه وصحافة الزيارة؛ اعتنى به وقدّم له محمود حمدي زقزوق، وأشرف عليه الأمين العام للمجمع."
  en: "A book in the Scientific Series of the Islamic Research Academy of al-Azhar (49th year, 1439 AH / 2018 CE, 170 pages), recording the Grand Imam Ahmad al-Tayyib's visit to Indonesia in February 2016, with a profile of the country, Egypt-Indonesia relations, al-Azhar's activities there and the press coverage; edited and introduced by Mahmud Hamdi Zaqzuq, supervised by the Academy's Secretary-General."
  es: "Un libro de la Serie Científica de la Academia de Investigación Islámica de al-Azhar (año 49, 1439 AH / 2018 d. C., 170 páginas), que recoge la visita del Gran Imam Ahmad al-Tayyib a Indonesia en febrero de 2016, con un perfil del país, las relaciones entre Egipto e Indonesia, las actividades de al-Azhar allí y la cobertura de prensa; editado e introducido por Mahmud Hamdi Zaqzuq, bajo la supervisión del Secretario General de la Academia."
  fr: "Un ouvrage de la collection scientifique de l'Académie de recherche islamique d'al-Azhar (49e année, 1439 AH / 2018 CE, 170 pages), relatant la visite du Grand Imam Ahmad al-Tayyib en Indonésie en février 2016, avec un profil du pays, des relations Égypte-Indonésie, des activités d'al-Azhar sur place et de la couverture médiatique; édité et présenté par Mahmud Hamdi Zaqzuq, sous la supervision du Secrétaire général de l'Académie."
  ur: "الازہر کی اسلامک ریسرچ اکیڈمی کی سائنسی سیریز کی ایک کتاب ⁦(49ویں سال، 1439 ہجری / 2018 عیسوی، 170 صفحات)⁩، فروری 2016 میں امام اعظم احمد الطیب کے انڈونیشیا کے دورے کو ریکارڈ کرتی ہے، جس میں ملک، مصر اور انڈونیشیا کے تعلقات، الازہر پریس کی سرگرمیوں کا احاطہ کیا گیا ہے۔ اکیڈمی کے سیکرٹری جنرل کی زیر نگرانی محمود حمدی زقزوق نے ترمیم اور متعارف کرایا۔"
  tr: "El-Ezher'deki İslami Araştırmalar Akademisi'nin bilimsel serisinden bir kitap (yıl 49, 1439 Hicri / 2018 M.S., 170 sayfa), Şubat 2016'da Büyük İmam Prof. Dr. Ahmed Al-Tayeb'in Endonezya ziyaretini kaydetmektedir. Ülkenin profilini, Mısır'ın onunla ilişkilerini, El-Ezher'in oradaki faaliyetlerini ve ziyaretçi basını sunmaktadır; bu kitap Mahmud Hamdi Zaqzouk tarafından yönetilmiş ve sunulmuş, Akademi Genel Sekreteri tarafından denetlenmiştir."
  id: "Sebuah buku dari seri ilmiah Akademi Riset Islam di Al-Azhar (tahun 49, 1439 H / 2018 M, 170 halaman), yang mencatat kunjungan Imam Agung Prof. Dr. Ahmed Al-Tayeb ke Indonesia pada Februari 2016. Buku ini menyajikan profil negara, hubungan Mesir dengannya, aktivitas Al-Azhar di sana, dan pers tamu; buku ini dirawat dan dipresentasikan oleh Mahmoud Hamdi Zaqzouq, serta diawasi oleh Sekretaris Jenderal Akademi."
