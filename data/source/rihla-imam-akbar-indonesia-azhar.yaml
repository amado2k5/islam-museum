summary:
  ar: "كتاب من السلسلة العلمية لمجمع البحوث الإسلامية بالأزهر الشريف (السنة 49، 1439هـ/2018م، 170 صفحة)، يسجل زيارة الإمام الأكبر أ.د. أحمد الطيب إلى إندونيسيا في فبراير 2016م، ويعرض بطاقة البلد وعلاقات مصر به وأنشطة الأزهر فيه وصحافة الزيارة؛ اعتنى به وقدّم له محمود حمدي زقزوق، وأشرف عليه الأمين العام للمجمع."
  en: "A book in the Scientific Series of the Islamic Research Academy of al-Azhar (49th year, 1439 AH / 2018 CE, 170 pages), recording the Grand Imam Ahmad al-Tayyib's visit to Indonesia in February 2016, with a profile of the country, Egypt-Indonesia relations, al-Azhar's activities there and the press coverage; edited and introduced by Mahmud Hamdi Zaqzuq, supervised by the Academy's Secretary-General."
