  ar: "سيرة نور الدين يلدز في ملف متحدثي الفعاليات بجامعة إينونو التركية؛ تقول إنه وُلد سنة 1960 في أوف بولاية طرابزون، وإنه عالم دين وكاتب، وإنه قاد تأسيس جمعية النسيج الاجتماعي ومؤسسة النسيج الاجتماعي، وإنه متزوج وأب لأربعة أبناء."
  en: "Speaker biography of Nureddin Yıldız in İnönü University's event-speakers file; it states that he was born in 1960 in Of, Trabzon, that he is a theologian and writer, that he led the founding of the Sosyal Doku association and foundation, and that he is married with four children."
  es: "La biografía del ponente Nureddin Yıldız figura en el archivo de ponentes de la Universidad de İnönü; en ella se indica que nació en 1960 en Of, Trabzon, que es teólogo y escritor, que lideró la fundación de la asociación y fundación Sosyal Doku, y que está casado y tiene cuatro hijos."
