  ar: "مقالة ويكيبيديا الأردية عن عطية فيضي؛ تُستخدم لوقائع الكيان فقط. تصفها بأنها بوهرة إسماعيلية من آل تائب جي، وتروي صداقاتها الأدبية مع شبلي نعماني ومحمد إقبال، وزواجها من صموئيل فيضي رحيمين، وقبرها في مقبرة ميوة شاه بكراتشي في قسم البوهرة السليمانيين."
  en: "Urdu Wikipedia article on Atiya Fyzee; used for entity facts only. It calls her an Ismaili Bohra of the Tyabji family, recounts her literary friendships with Shibli Nomani and Muhammad Iqbal, her marriage to Samuel Fyzee-Rahamin, and her grave in the Sulaimani Bohra enclosure of Karachi’s Mewa Shah cemetery."
