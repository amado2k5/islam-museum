summary:
  ar: "مقالة ويكيبيديا الإنجليزية الموجزة عن لو تاك كوانغ، المولود في 17 نيسان 1948، مؤسس شركة بايان ريسورسز لتعدين الفحم؛ تذكر عمله مراهقًا في شركة بناء أبيه في سنغافورة وانتقاله إلى إندونيسيا سنة 1972 وثروته بحسب فوربس."
  en: "Brief English Wikipedia article on Low Tuck Kwong, born 17 April 1948, founder of the Bayan Resources coal company; it records his teenage work at his father's Singapore construction company, his 1972 move to Indonesia, and his Forbes wealth ranking."
  es: "Breve artículo en inglés de la Wikipedia sobre Low Tuck Kwong, nacido el 17 de abril de 1948, fundador de la compañía carbonera Bayan Resources; en él se narra su trabajo adolescente en la empresa constructora de su padre en Singapur, su traslado a Indonesia en 1972 y su posición en la lista de riqueza de Forbes."
  fr: "Bref article de Wikipédia en anglais sur Low Tuck Kwong, né le 17 avril 1948, fondateur de la compagnie charbonnière Bayan Resources; il relate son travail d'adolescent dans l'entreprise de construction de son père à Singapour, son déménagement en Indonésie en 1972 et son classement de fortune selon Forbes."
  ur: "لو ٹک کوانگ پر مختصر انگریزی ویکیپیڈیا مضمون، پیدائش 17 اپریل 1948، بایان ریسورسز کول کمپنی کے بانی؛ اس میں ان کے والد کی سنگاپور کی تعمیراتی کمپنی میں ان کے نوعمر کام، ان کے 1972 میں انڈونیشیا منتقل ہونے اور فوربس کی دولت کی درجہ بندی کو ریکارڈ کیا گیا ہے۔"
