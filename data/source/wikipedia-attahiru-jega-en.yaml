reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 at the recorded revision, fetched by revision id through the MediaWiki API with the returned id asserted equal. It gives his birth name as Attahiru Muhammadu Jega and his birth on 11 January 1957 at Jega in the Northern Region (now Kebbi State), his presidency of the Academic Staff Union of Universities, his vice-chancellorship of Bayero University from 2005, his INEC chairmanship from 8 June 2010 to 30 June 2015, and his 2025 appointment as Special Adviser and Coordinator of the Presidential Livestock Reform Initiative. No sentence in the article mentions Islam, a school, or any religious affiliation for him."
