  ar: "مقالة ويكيبيديا الإنجليزية عن عطاهيرو جيغا؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في 11 يناير 1957 في جيغا، ومسيرته الأكاديمية في جامعة بايرو حيث صار نائبا للمستشار، ورئاسته للجنة الانتخابية الوطنية المستقلة (2010–2015) وإشرافه على انتخابات 2015، وتعيينه مستشارا خاصا للرئيس تينوبو لإصلاحات الثروة الحيوانية سنة 2025. لا يذكر نصها دينه إطلاقا."
  en: "English Wikipedia article on Attahiru Jega; used for entity facts only. It recounts his birth on 11 January 1957 in Jega, his academic career at Bayero University where he became vice-chancellor, his chairmanship of the Independent National Electoral Commission (2010–2015) and the 2015 elections, and his 2025 appointment as Special Adviser to President Tinubu on livestock reforms. Its text makes no statement of his religion at all."
