summary:
  ar: "مقالة ويكيبيديا الفرنسية عن البوري ندياي ⁦(ح. 1847-1901)⁩، بوربا جولوف من 1875 إلى 1890 وشخصية كبرى في مقاومة التغلغل الاستعماري الفرنسي في السنغال؛ تروي نشأته في بلاط كايور مع عمه لات ديور وقتاله إلى جانبه ومع مابا دياخو با، وتنصيبه ملكا في يانغ يانغ سنة 1875، واتفاقه مع الفرنسيين سنة 1885 ورفضه إرسال ابنه إلى مدرسة الرهائن، وسقوط جولوف سنة 1890، ورحلته الطويلة شرقا مع أحمدو تال حتى موته قرب دوسو، حيث تروي الرواية المحلية وفاته بسهم مسموم ودفن ذراعه في دوسو."
  en: "French Wikipedia article on Alboury Ndiaye (c. 1847–1901), Buurba of Jolof from 1875 to 1890 and a great figure of resistance to French colonial penetration in Senegal; it recounts his upbringing at the Cayor court with his uncle Lat Dior and his fighting beside him and Maba Diakhou Ba, his enthronement at Yang-Yang in 1875, his 1885 agreement with the French and refusal to send his son to the hostages' school, the fall of Jolof in 1890, and his long journey east with Ahmadu Tall until his death near Dosso, where the local tradition it reports has him die by a poisoned arrow, his arm buried at Dosso."
  es: "Artículo de la Wikipedia en francés sobre Alboury Ndiaye (c. 1847–1901), Buurba de Jolof desde 1875 hasta 1890 y una gran figura de la resistencia a la penetración colonial francesa en Senegal; relata su crianza en la corte de Cayor con su tío Lat Dior y su lucha junto a él y Maba Diakhou Ba, su entronización en Yang-Yang en 1875, su acuerdo de 1885 con los franceses y su negativa a enviar a su hijo a la escuela de rehenes, la caída de Jolof en 1890 y su largo viaje hacia el este con Ahmadu Tall hasta su muerte cerca de Dosso, donde la tradición local relata que murió por una flecha envenenada y que su brazo fue enterrado en Dosso."
  fr: "L'article de Wikipédia en français sur Alboury Ndiaye (vers 1847-1901), Buurba de Jolof de 1875 à 1890 et figure majeure de la résistance à la colonisation française au Sénégal, relate son enfance à la cour de Cayor auprès de son oncle Lat Dior et ses combats à ses côtés et aux côtés de Maba Diakhou Ba, son intronisation à Yang-Yang en 1875, son accord de 1885 avec les Français et son refus d'envoyer son fils à l'école des otages, la chute de Jolof en 1890 et son long périple vers l'est avec Ahmadu Tall jusqu'à sa mort près de Dosso, où, selon la tradition locale, il serait mort d'une flèche empoisonnée et son bras enterré à Dosso."
  ur: "Alboury Ndiaye (c. 1847–1901) پر فرانسیسی ویکیپیڈیا کا مضمون، 1875 سے 1890 تک جولوف کا بوربا اور سینیگال میں فرانسیسی نوآبادیاتی دخول کے خلاف مزاحمت کی ایک عظیم شخصیت؛ اس میں کیور کے دربار میں اپنے چچا لاٹ ڈائر کے ساتھ اس کی پرورش اور اس کے ساتھ ہونے والی لڑائی اور مابا دیاخو با، 1875 میں یانگ یانگ میں اس کی تخت نشینی، فرانسیسیوں کے ساتھ اس کا 1885 کا معاہدہ اور اپنے بیٹے کو یرغمالیوں کے اسکول میں بھیجنے سے انکار، 1890 میں جولوف کا زوال، اور احمد کے ساتھ اس کا طویل سفر، جہاں تک اس کی موت واقع ہوئی۔ مقامی روایت کے مطابق اس کی موت زہریلے تیر سے ہوئی، اس کا بازو ڈوسو میں دفن ہوا۔"
