summary:
  ar: "مقالة ويكيبيديا الفرنسية عن البوري ندياي (ح. 1847-1901)، بوربا جولوف من 1875 إلى 1890 وشخصية كبرى في مقاومة التغلغل الاستعماري الفرنسي في السنغال؛ تروي نشأته في بلاط كايور مع عمه لات ديور وقتاله إلى جانبه ومع مابا دياخو با، وتنصيبه ملكا في يانغ يانغ سنة 1875، واتفاقه مع الفرنسيين سنة 1885 ورفضه إرسال ابنه إلى مدرسة الرهائن، وسقوط جولوف سنة 1890، ورحلته الطويلة شرقا مع أحمدو تال حتى موته قرب دوسو، حيث تروي الرواية المحلية وفاته بسهم مسموم ودفن ذراعه في دوسو."
  en: "French Wikipedia article on Alboury Ndiaye (c. 1847–1901), Buurba of Jolof from 1875 to 1890 and a great figure of resistance to French colonial penetration in Senegal; it recounts his upbringing at the Cayor court with his uncle Lat Dior and his fighting beside him and Maba Diakhou Ba, his enthronement at Yang-Yang in 1875, his 1885 agreement with the French and refusal to send his son to the hostages' school, the fall of Jolof in 1890, and his long journey east with Ahmadu Tall until his death near Dosso, where the local tradition it reports has him die by a poisoned arrow, his arm buried at Dosso."
