reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it, chiefly Charles, Precolonial Senegal: the Jolof Kingdom, 1800–1890 (1977) and her 1971 study of his exile, with Blair (1984) for the reign dates. Read in full on 25 October 2026. The article gives his birth as c. 1847 against the English article's c. 1848, calls Lat Dior his uncle against the English article's older cousin, names Amadou Cheikhou Ba as his predecessor against the English article's Sanor Ndiaye, gives his death only as 1901 at Dosso, and reports a local tradition of his death by a poisoned arrow at Kalakala against the English article's death in battle against the French at Dosso (Charles, pp. 127–130); the record states each disagreement."
