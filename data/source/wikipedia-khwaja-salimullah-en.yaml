summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن خواجة سليم الله، رابع نواب دكا؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في منزل إحسان في 7 يونيو 1871 ووفاته في كلكتا في 16 يناير 1915، ودوره في تأسيس رابطة مسلمي عموم الهند في مؤتمر دكا 1906 ومطالبته بجامعة لدكا؛ وتذكر في صندوقها أن دينه الإسلام السني."
  en: "English Wikipedia article on Khwaja Salimullah, fourth Nawab of Dhaka; used for entity facts only. It records his birth at Ahsan Manzil on 7 June 1871 and his death at Calcutta on 16 January 1915, his part in founding the All-India Muslim League at the 1906 Dhaka conference and his demand for a Dhaka university; its infobox records his religion as Sunni Islam."
