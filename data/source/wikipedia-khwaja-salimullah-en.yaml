reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. The article rests on Banglapedia, on Muntasir Mamun's Dhaka: Smriti Bismritir Nagari (1993) and on Sharifuddin Ahmed's Dhaka Past, Present, Future. Its infobox records 'religion: Sunni Islam' — a single source family for the school; the Arabic and Urdu articles, Banglapedia and Wikidata name no school, so the person record leaves the faith unknown with this attestation stated. The article covers his deputy-magistracy (1893–1895) and Mymensingh business, his succession in 1901, his support of the Partition of Bengal, the 16 October 1905 Northbrook Hall meeting and the Mohammedan Provincial Union, the April 1906 educational conference at Shahbag, his proposed 'Muslim All India Confederacy', the 27–30 December 1906 Muhammadan Educational Conference and the founding of the All-India Muslim League on its last day with Salimullah as vice-president, his presidencies of the Bengal Muslim Leagues, his August 1911 demand for a Dhaka university at Curzon Hall and the pledge that followed the partition's annulment, his 1912 fundraising for Turkish Muslims in the Balkan Wars and support of the Allies in the First World War, his honours (CSI 1906; KCSI 1909; GCIE 1911 — Banglapedia gives different years, recorded in the record), and the places named after him. It places the 1906 convention at Ahsan Manzil; Banglapedia places the conference at the Shahbag garden-house; both are recorded."
