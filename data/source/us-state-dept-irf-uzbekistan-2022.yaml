reliability_note: "An official US government country report, read in full on 4 November 2026 in its ecoi.net rendering. Its executive summary states that human rights activists reported an increase in anti-Christian, antisemitic, anti-Western and misogynist content on social media channels of popular Islamic bloggers such as Abror Muxtor Aliy, and that in September 2022 the authorities dismissed Aliy — who had approximately half a million followers across dozens of channels on several social media outlets — from two government positions in the country's Islamic academy and muftiate. The criticism is the activists' as reported by the State Department, not the museum's finding. The report's demography section describes Uzbekistan's Muslims in general as mostly Sunni of the Hanafi school; that is a population statistic, not an attestation about Aliy, and it was not used for his faith."
