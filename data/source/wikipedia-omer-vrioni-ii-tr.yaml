reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It gives: born 1839 at Berat, died 1928; of the Viryoni (Vrioni) family of Berat, Fier and Myzeqe in the Yanina Vilayet; founded Fier in 1864 'together with his son Kahreman Pasha Vrioni (1889–1955)' — dates for Kahreman that are incompatible with a joint founding in 1864, and against the Albanian article, which makes Kahreman the father; member of the League of Prizren (1878), arrested at Preveza and exiled to Çanakkale, recalled by the Yanina governor Mustafa Asım Pasha in 1882; contributor to the Elbasan teachers' school founded 1 December 1909; father of Sami Bey Vrioni, delegate at the 1912 Vlorë Assembly; 'in December 1921 he was elected member of the High Council of Regency as representative of the Bektashi community' (Bektaşi cemaatinin temsilcisi), resigning in opposition to Ahmet Zogu; office dated 24 December 1921 – 11 March 1922. The Bektashi-seat statement is the third independent attestation. The Turkish Wikipedia's article 'Ömer Viryoni Paşa' without the 'II' is the grandfather's article (Alamana, Missolonghi, Varna) and was not used for this record."
