summary:
  ar: "أقدم لقطة ذات محتوى لموقع umma.ru في أرشيف الإنترنت، 30 يناير 2003: أبواب للأخبار والنبي محمد والأسئلة والمقالات والأحاديث والصلاة والصوتيات والكتب والفتاوى ومواقيت الصلاة وطرح سؤال ومسرد، وحقوق «2002 Umma.ru»؛ لقطتا 2001 و2002 صفحتان فارغتان."
  en: "The earliest Internet Archive capture of umma.ru with content, 30 January 2003: sections for news, the Prophet Muhammad, questions, articles, hadiths, prayer, audio, books, fatwas, prayer times, 'ask a question' and a glossary, with '2002 Umma.ru'; the 2001 and 2002 captures are blank pages."
  ur: "umma.ru کی انٹرنیٹ آرکائیو میں مواد والی سب سے پرانی تصویر، 30 جنوری 2003: خبریں، نبی محمد، سوالات، مضامین، احادیث، نماز، آڈیو، کتب، فتاویٰ، اوقاتِ نماز، سوال پوچھیں اور فرہنگ کے ابواب، اور «2002 Umma.ru»؛ 2001 اور 2002 کی تصاویر خالی صفحات ہیں۔"
