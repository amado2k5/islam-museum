reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read on 26 October 2026 and checked against the recorded revision. The article states the United States’ allegation that Khadr threw the grenade that killed Sergeant Christopher Speer as an allegation, records his guilty plea together with its later retraction, and reports the Canadian court findings (Supreme Court, January 2010) that Canadian officials’ participation in his interrogations violated his Charter rights. It makes no statement naming a religious school for him and files him under “Canadian Muslims”."
