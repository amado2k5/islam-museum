summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عمر خضر؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في تورنتو في 19 سبتمبر 1986، وأسره في أيوب خيل في 27 يوليو 2002، واحتجازه في باغرام وغوانتانامو، وإقراره بالذنب سنة 2010، وترحيله إلى كندا سنة 2012، وإفراجه بكفالة سنة 2015، وتسوية 2017 واعتذارها."
  en: "English Wikipedia article on Omar Khadr; used for entity facts only. It gives his birth in Toronto on 19 September 1986, his capture at Ayub Kheyl on 27 July 2002, his detention at Bagram and Guantanamo, his guilty plea of 25 October 2010, his repatriation on 29 September 2012, his release on bail on 7 May 2015, the 2017 settlement and apology, and the completion of his sentence conditions in March 2019."
  es: "Artículo de la Wikipedia en inglés sobre Omar Khadr; utilizado únicamente para datos sobre la persona. Indica que nació en Toronto el 19 de septiembre de 1986, fue capturado en Ayub Kheyl el 27 de julio de 2002, estuvo detenido en Bagram y Guantánamo, se declaró culpable el 25 de octubre de 2010, fue repatriado el 29 de septiembre de 2012, fue puesto en libertad bajo fianza el 7 de mayo de 2015, llegó a un acuerdo y ofreció disculpas en 2017, y cumplió las condiciones de su condena en marzo de 2019."
  fr: "Article de Wikipédia en anglais sur Omar Khadr; utilisé uniquement pour les informations relatives à l’entité. Il indique sa naissance à Toronto le 19 septembre 1986, sa capture à Ayub Kheyl le 27 juillet 2002, sa détention à Bagram et à Guantanamo, son plaidoyer de culpabilité le 25 octobre 2010, son rapatriement le 29 septembre 2012, sa libération sous caution le 7 mai 2015, l’accord et les excuses de 2017, et l’achèvement de ses conditions de peine en mars 2019."
