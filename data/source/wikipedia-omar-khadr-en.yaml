  ar: "مقالة ويكيبيديا الإنجليزية عن عمر خضر؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في تورنتو في 19 سبتمبر 1986، وأسره في أيوب خيل في 27 يوليو 2002، واحتجازه في باغرام وغوانتانامو، وإقراره بالذنب سنة 2010، وترحيله إلى كندا سنة 2012، وإفراجه بكفالة سنة 2015، وتسوية 2017 واعتذارها."
  en: "English Wikipedia article on Omar Khadr; used for entity facts only. It gives his birth in Toronto on 19 September 1986, his capture at Ayub Kheyl on 27 July 2002, his detention at Bagram and Guantanamo, his guilty plea of 25 October 2010, his repatriation on 29 September 2012, his release on bail on 7 May 2015, the 2017 settlement and apology, and the completion of his sentence conditions in March 2019."
