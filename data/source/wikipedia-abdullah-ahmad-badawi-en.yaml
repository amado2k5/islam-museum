  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الله أحمد بدوي (1939–2025)؛ تُستخدم لوقائع الكيان فقط. تروي مولده في بايان ليباس ببينانق في 26 نوفمبر 1939، ومسيرته في الخدمة المدنية والوزارات، ورئاسته الخامسة لوزراء ماليزيا (2003–2009) ومفهومه «إسلام حضاري»، ووفاته في كوالالمبور في 14 أبريل 2025."
  en: "English Wikipedia article on Abdullah Ahmad Badawi (1939–2025); used for entity facts only. It recounts his birth at Bayan Lepas, Penang, on 26 November 1939, his civil-service and ministerial career, his tenure as Malaysia's fifth prime minister (2003–2009) and his Islam Hadhari concept, and his death at Kuala Lumpur on 14 April 2025."
