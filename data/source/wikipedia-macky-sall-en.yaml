summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ماكي سال؛ تُستخدم لوقائع الكيان فقط. فيها قسم خاص بالدين يقول: «سال مسلم يتبع المذهب المالكي» مستشهدة بوكالة آسي أفريقيا، ويذكر تأييده «الإسلام المتسامح»؛ وهي المقالة الوحيدة التي تسمي مذهبا له في متنها."
  en: "English Wikipedia article on Macky Sall; used for entity facts only. Its dedicated Religion section states: 'Sall is a Muslim who follows the Maliki school' (citing ACI Africa's report of his audience with Pope Francis), and records his opposition to 'excessive forms of Islam' and support for 'tolerant Islam' (BBC). It is the only article whose text names a school for him."
  es: "Artículo de la Wikipedia en inglés sobre Macky Sall; utilizado únicamente para obtener información sobre la persona. Su sección dedicada a la religión afirma: «Sall es musulmán y sigue la escuela Maliki» (citando el informe de ACI Africa sobre su audiencia con el Papa Francisco), y recoge su oposición a las «formas excesivas del islam» y su apoyo al «islam tolerante» (BBC). Es el único artículo cuyo texto menciona una escuela para referirse a él."
  fr: "L'article de Wikipédia en anglais consacré à Macky Sall, utilisé uniquement pour des informations sur l'entité, mentionne dans sa section « Religion »: « Sall est un musulman de l'école malikite » (citant le compte rendu d'ACI Afrique de son audience avec le pape François). Il y est également fait mention de son opposition aux « formes excessives de l'islam » et de son soutien à un « islam tolérant » (BBC). C'est le seul article qui cite une école de pensée à son sujet."
