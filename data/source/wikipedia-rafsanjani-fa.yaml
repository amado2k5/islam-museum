summary:
  ar: "مقالة ويكيبيديا الفارسية عن أكبر هاشمي رفسنجاني؛ تُستخدم لوقائع الكيان فقط. تصفه في مطلعها بأنه رجل دين شيعي وسياسي إيراني، وتروي دراسته في حوزة قم على يد بروجردي والخميني وغيرهما من المراجع ودوره في الثورة ورئاسته للبرلمان ثم الجمهورية ورئاسته لمجلس الخبراء ومجلس تشخيص مصلحة النظام حتى وفاته سنة 2017."
  en: "Persian Wikipedia article on Akbar Hashemi Rafsanjani; used for entity facts only. Its lead describes him as a Shia cleric and Iranian politician; it recounts his studies at the Qom seminary under Borujerdi, Khomeini and other marja's, his role in the revolution, his speakership of parliament, his presidency, and his chairmanship of the Assembly of Experts and the Expediency Discernment Council until his death in 2017."
  es: "Artículo de Wikipedia en persa sobre Akbar Hashemi Rafsanjani; utilizado únicamente para datos sobre la persona. Su introducción lo describe como un clérigo chiíta y político iraní; relata sus estudios en el seminario de Qom con Borujerdi, Khomeini y otros marjas, su papel en la revolución, su presidencia del parlamento, su presidencia y su presidencia de la Asamblea de Expertos y del Consejo de Discernimiento de la Conveniencia hasta su muerte en 2017."
  fr: "Article Wikipédia en persan sur Akbar Hashemi Rafsanjani; utilisé uniquement à des fins d'information sur l'entité. Son introduction le décrit comme un religieux chiite et un homme politique iranien; elle relate ses études au séminaire de Qom auprès de Borujerdi, Khomeini et d'autres marjas, son rôle dans la révolution, sa présidence du Parlement, sa présidence de l'Assemblée des experts et sa présidence du Conseil de discernement de l'intérêt supérieur du régime jusqu'à sa mort en 2017."
  ur: "اکبر ہاشمی رفسنجانی پر فارسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی قیادت میں اسے ایک شیعہ عالم اور ایرانی سیاست دان کے طور پر بیان کیا گیا ہے۔ اس میں بروجردی، خمینی اور دیگر مرجع کے تحت قم کے مدرسے میں ان کی تعلیم، انقلاب میں ان کے کردار، پارلیمنٹ کی اسپیکر شپ، ان کی صدارت، اور ماہرین کی اسمبلی اور ایکسپیڈینسی ڈسرنمنٹ کونسل کی ان کی سربراہی 2017 میں ان کی موت تک کا ذکر ہے۔"
