  ar: "مقالة ويكيبيديا الفارسية عن أكبر هاشمي رفسنجاني؛ تُستخدم لوقائع الكيان فقط. تصفه في مطلعها بأنه رجل دين شيعي وسياسي إيراني، وتروي دراسته في حوزة قم على يد بروجردي والخميني وغيرهما من المراجع ودوره في الثورة ورئاسته للبرلمان ثم الجمهورية ورئاسته لمجلس الخبراء ومجلس تشخيص مصلحة النظام حتى وفاته سنة 2017."
  en: "Persian Wikipedia article on Akbar Hashemi Rafsanjani; used for entity facts only. Its lead describes him as a Shia cleric and Iranian politician; it recounts his studies at the Qom seminary under Borujerdi, Khomeini and other marja's, his role in the revolution, his speakership of parliament, his presidency, and his chairmanship of the Assembly of Experts and the Expediency Discernment Council until his death in 2017."
