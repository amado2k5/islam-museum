summary:
  ar: "ملف أصغر غوندوي في موقع ريختا؛ يذكر أنه ولد سنة 1884 في غوراخبور لأسرة محدودة الدخل، وأنه تعلّم الأردية والعربية والفارسية والإنجليزية بجهده الذاتي، وأنه كتب في مطلع حياته متأثرا بشعراء التصوف ثم صار له صوته الخاص، وأن مجموعتيه هما «نشاط روح» و«سرود زندگي»."
  en: "Rekhta's profile of Asghar Gondvi. It gives him born in 1884 at Gorakhpur to a family of limited means, self-taught in Urdu, Arabic, Persian and English; it says that in his earlier phase he wrote under the influence of Sufi poets before acquiring a personal tone, and names his collections Nishat-e Rooh and Surood-e Zindagi."
  es: "Perfil de Asghar Gondvi según Rekhta. En él se indica que nació en 1884 en Gorakhpur en el seno de una familia de escasos recursos, que fue autodidacta en urdu, árabe, persa e inglés; se menciona que en su etapa inicial escribió bajo la influencia de poetas sufíes antes de adquirir un estilo propio, y se nombran sus colecciones Nishat-e Rooh y Surood-e Zindagi."
  fr: "Le portrait d'Asghar Gondvi établi par Rekhta indique qu'il est né en 1884 à Gorakhpur dans une famille modeste, qu'il était autodidacte en ourdou, en arabe, en persan et en anglais; il est précisé que, dans sa première période, il écrivait sous l'influence de poètes soufis avant d'acquérir un style personnel, et ses recueils sont intitulés Nishat-e Rooh et Surood-e Zindagi."
