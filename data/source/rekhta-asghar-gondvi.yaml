summary:
  ar: "ملف أصغر غوندوي في موقع ريختا؛ يذكر أنه ولد سنة 1884 في غوراخبور لأسرة محدودة الدخل، وأنه تعلّم الأردية والعربية والفارسية والإنجليزية بجهده الذاتي، وأنه كتب في مطلع حياته متأثرا بشعراء التصوف ثم صار له صوته الخاص، وأن مجموعتيه هما «نشاط روح» و«سرود زندگي»."
  en: "Rekhta's profile of Asghar Gondvi. It gives him born in 1884 at Gorakhpur to a family of limited means, self-taught in Urdu, Arabic, Persian and English; it says that in his earlier phase he wrote under the influence of Sufi poets before acquiring a personal tone, and names his collections Nishat-e Rooh and Surood-e Zindagi."
