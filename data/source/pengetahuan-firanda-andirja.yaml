summary:
  ar: "ملف تعريفي إندونيسي بفيراندا أنديرجا في موقع «بنغيتاهوان»؛ يُستخدم شاهدا نصيا مستقلا على وصفه في الأدبيات الإندونيسية بأنه «عالم سلفي»، وهو وصف انتماء لا يُسوّي مسألة العقيدة."
  en: "Indonesian biographical profile of Firanda Andirja on the Pengetahuan website; used as an independent prose text describing him as a 'Salafi scholar' (ulama Salafi), a movement descriptor preserved in the person record's faith note."
  es: "Perfil biográfico indonesio de Firanda Andirja en el sitio web Pengetahuan; utilizado como un texto en prosa independiente que lo describe como un \"erudito salafista\" (ulama Salafi), un descriptor del movimiento que se conserva en la nota de fe del registro de la persona."
  fr: "Profil biographique indonésien de Firanda Andirja sur le site web Pengetahuan; utilisé comme texte en prose indépendant le décrivant comme un « érudit salafiste » (ulama Salafi), un descripteur de mouvement conservé dans la note de foi de la fiche de la personne."
  ur: "Pengetahuan ویب سائٹ پر Firanda Andirja کی انڈونیشین سوانحی پروفائل؛ ایک آزاد نثری متن کے طور پر استعمال کیا جاتا ہے جس میں اسے 'سلفی اسکالر' ⁦(علماء سلفی)⁩ کے طور پر بیان کیا جاتا ہے، جو کہ شخصی ریکارڈ کے عقیدے کے نوٹ میں محفوظ ہے۔"
  tr: "'Bengitahuan' web sitesinde Veranda Andirja'nın Endonezya'daki profili; Endonezya edebiyatında onu 'Selefi âlim' olarak tanımlamak için bağımsız metinsel kanıtlar kullanır; bu tanım, inanç meselesiyle aynı şey ifade etmez."
  id: "Profil Indonesia tentang Veranda Andirja di situs web 'Bengitahuan'; ia menggunakan bukti tekstual independen untuk menggambarkannya dalam sastra Indonesia sebagai 'ulama Salafi,' sebuah deskripsi afiliasi yang tidak setara dengan isu iman."
