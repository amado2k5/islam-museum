summary:
  ar: "مقالة ويكيبيديا الأردية عن روح الله الخميني؛ تُستخدم لوقائع الكيان فقط. تصفه في نصّها بأنه عالم في الإسلام الشيعي الاثنا عشري الأصلي، وتروي قيادته للثورة الإيرانية وتأسيسه الجمهورية الإسلامية ومرشديته حتى وفاته سنة 1989."
  en: "Urdu Wikipedia article on Ruhollah Khomeini; used for entity facts only. Its text describes him as a scholar of Usuli Twelver Shia Islam, and recounts his leadership of the Iranian Revolution, his founding of the Islamic Republic and his supreme leadership until his death in 1989."
  es: "Artículo de Wikipedia en urdu sobre Ruhollah Khomeini; utilizado únicamente para datos sobre la persona. Su texto lo describe como un erudito del islam chiíta duodecimano usuli y relata su liderazgo en la Revolución iraní, la fundación de la República Islámica y su liderazgo supremo hasta su muerte en 1989."
  fr: "Article de Wikipédia en ourdou sur Rouhollah Khomeini; utilisé uniquement à des fins d’information sur l’entité. Son texte le décrit comme un érudit de l’islam chiite duodécimain usuli et relate son rôle à la tête de la révolution iranienne, la fondation de la République islamique et son leadership suprême jusqu’à sa mort en 1989."
  ur: "روح اللہ خمینی پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا متن اسے Usuli Twelver شیعہ اسلام کے ایک عالم کے طور پر بیان کرتا ہے، اور ان کی ایرانی انقلاب کی قیادت، اسلامی جمہوریہ کے قیام اور 1989 میں اپنی موت تک ان کی اعلیٰ قیادت کا ذکر کرتا ہے۔"
