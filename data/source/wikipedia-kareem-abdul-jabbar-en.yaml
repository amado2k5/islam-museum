summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن كريم عبد الجبار؛ تُستخدم لوقائع الكيان فقط. تذكر مولده باسم فرديناند لويس ألسندور جونيور في 16 أبريل 1947 في مدينة نيويورك، ومسيرته مع جامعة كاليفورنيا في لوس أنجلوس وميلووكي باكس ولوس أنجلوس ليكرز، وأرقامه القياسية وتكريماته، وروايتها أنه اعتنق الإسلام السنّي سنة 1968."
  en: "English Wikipedia article on Kareem Abdul-Jabbar; used for entity facts only. It gives his birth as Ferdinand Lewis Alcindor Jr. on 16 April 1947 in New York City, his career with UCLA, the Milwaukee Bucks and the Los Angeles Lakers, his records and honours, and its account that he converted to Sunni Islam in 1968."
  es: "Artículo de la Wikipedia en inglés sobre Kareem Abdul-Jabbar; utilizado únicamente para obtener información sobre la persona. En él se menciona su nacimiento como Ferdinand Lewis Alcindor Jr. el 16 de abril de 1947 en la ciudad de Nueva York, su trayectoria profesional con la UCLA, los Milwaukee Bucks y los Los Angeles Lakers, sus récords y galardones, y su conversión al islam sunita en 1968."
  fr: "Article de Wikipédia en anglais sur Kareem Abdul-Jabbar; utilisé uniquement pour les informations sur l'entité. Il retrace sa naissance sous le nom de Ferdinand Lewis Alcindor Jr. le 16 avril 1947 à New York, sa carrière à UCLA, aux Milwaukee Bucks et aux Los Angeles Lakers, ses records et distinctions, et mentionne sa conversion à l'islam sunnite en 1968."
  ur: "کریم عبدالجبار پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ نیویارک سٹی میں 16 اپریل 1947 کو فرڈینینڈ لیوس ایلکنڈر جونیئر کے طور پر جنم لیتا ہے، یو سی ایل اے، ملواکی بکس اور لاس اینجلس لیکرز کے ساتھ اس کا کیریئر، اس کے ریکارڈ اور اعزازات، اور اس کا اکاؤنٹ جو اس نے 1968 میں سنی اسلام قبول کیا۔"
  tr: "Kareem Abdul-Jabbar hakkında İngilizce Wikipedia makalesi; yalnızca varlık gerçekleri için kullanılır. 16 Nisan 1947'de New York'ta Ferdinand Luis Alcindor Jr. olarak doğdu ve Kaliforniya Üniversitesi, Los Angeles, Milwaukee Bucks ve Los Angeles Lakers'taki kariyeri, kayıtları, onurları ve 1968'de Sünni İslam'a geçtiği anlatısı ile birlikte yer aldı."
  id: "Artikel Wikipedia bahasa Inggris tentang Kareem Abdul-Jabbar; digunakan hanya untuk fakta entitas. Ia lahir dengan nama Ferdinand Luis Alcindor Jr. pada 16 April 1947 di New York City, dan kariernya bersama University of California, Los Angeles, Milwaukee Bucks, dan Los Angeles Lakers, beserta catatan, penghargaan, dan narasi bahwa ia memeluk Islam Sunni pada tahun 1968."
