reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026. It states in its lead that during the summer of 1968 Abdul-Jabbar converted to Sunni Islam from Catholicism and adopted the Arabic name Kareem Abdul-Jabbar, which he did not use publicly until 1971; its personal-life section repeats that in the summer of 1968 he took the shahada twice and converted to Sunni Islam. It also records that Hamaas Abdul Khaalis, who gave him his name, led the Hanafi Movement, that the two later parted ways over teachings, and that Abdul-Jabbar declined an invitation to join the Nation of Islam. Revision identifiers could not be recorded in this run; the article was consulted directly on the date given."
