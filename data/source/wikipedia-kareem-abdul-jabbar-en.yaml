  ar: "مقالة ويكيبيديا الإنجليزية عن كريم عبد الجبار؛ تُستخدم لوقائع الكيان فقط. تذكر مولده باسم فرديناند لويس ألسندور جونيور في 16 أبريل 1947 في مدينة نيويورك، ومسيرته مع جامعة كاليفورنيا في لوس أنجلوس وميلووكي باكس ولوس أنجلوس ليكرز، وأرقامه القياسية وتكريماته، وروايتها أنه اعتنق الإسلام السنّي سنة 1968."
  en: "English Wikipedia article on Kareem Abdul-Jabbar; used for entity facts only. It gives his birth as Ferdinand Lewis Alcindor Jr. on 16 April 1947 in New York City, his career with UCLA, the Milwaukee Bucks and the Los Angeles Lakers, his records and honours, and its account that he converted to Sunni Islam in 1968."
