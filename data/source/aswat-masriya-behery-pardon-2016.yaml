  ar: "خبر وكالة أنباء الشرق الأوسط في أصوات مصرية بتاريخ 17 نوفمبر 2016: الرئيس السيسي يعفو عن 82 سجينا شابا بينهم المذيع إسلام بحيري."
  en: "A MENA report carried by Aswat Masriya on 17 November 2016: President el-Sisi pardoned 82 young detainees, among them the television host Islam Behery."
  es: "Según un informe de MENA publicado por Aswat Masriya el 17 de noviembre de 2016, el presidente El-Sisi indultó a 82 jóvenes detenidos, entre ellos el presentador de televisión Islam Behery."
  fr: "Un reportage de MENA diffusé par Aswat Masriya le 17 novembre 2016: le président el-Sisi a gracié 82 jeunes détenus, parmi lesquels l’animateur de télévision Islam Behery."
  ur: "17 نومبر 2016 کو اسوات مسریہ کی طرف سے MENA کی رپورٹ: صدر السیسی نے 82 نوجوان قیدیوں کو معاف کر دیا، ان میں ٹیلی ویژن کے میزبان اسلام بیہری بھی شامل ہیں۔"
  tr: "Orta Doğu Haber Ajansı'ndan Aswat Masriya'dan 17 Kasım 2016 tarihli haber: Cumhurbaşkanı Sisi, aralarında yayıncı İslam Bahiri'nin de bulunduğu 82 genç tutukluyu affetti."
  id: "Berita dari Middle East News Agency tentang Aswat Masriya tertanggal 17 November 2016: Presiden Sisi mengampuni 82 tahanan muda, termasuk penyiar Islam Bahiri."
