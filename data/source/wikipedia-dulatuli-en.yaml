summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ميرجاقيب دولاتولي ⁦(25 نوفمبر 1885 – 5 أكتوبر 1935)⁩، الشاعر والكاتب الكازاخي وأحد قادة ألاش أوردا؛ تُستخدم لوقائع الكيان فقط. تتناول مولده في أسرة مسلمة في ساريكوبا ولقاءه بأحمد بايتورسينول وعليخان بوكيخانوف سنة 1904 وكتابيه «أويان! قازاق» و«باقيتسيز جمال» وقيادته في ألاش واعتقاله سنة 1928 ووفاته في معسكر سولوفكي سنة 1935."
  en: "English Wikipedia article on Mirjaqip Dulatuli (25 November 1885 – 5 October 1935), the Kazakh poet, writer and Alash Orda leader; used for entity facts only. It covers his birth into a Muslim family at Sarikopa, his meeting with Ahmet Baitursynuly and Alikhan Bukeikhanov in 1904, his books Oyan! Qazaq and Baqytsyz Jamal, his Alash leadership, his arrest in 1928 and his death in the Solovki labour camp in 1935."
  es: "Artículo de la Wikipedia en inglés sobre Mirjaqip Dulatuli (25 de noviembre de 1885 - 5 de octubre de 1935), poeta, escritor y líder de Alash Orda kazajo; utilizado únicamente para datos biográficos. Abarca su nacimiento en una familia musulmana en Sarikopa, su encuentro con Ahmet Baitursynuly y Alikhan Bukeikhanov en 1904, sus libros ¡Oyan! Qazaq y Baqytsyz Jamal, su liderazgo en Alash, su arresto en 1928 y su muerte en el campo de trabajo de Solovki en 1935."
  fr: "Article de Wikipédia en anglais sur Mirjaqip Dulatuli (25 novembre 1885 – 5 octobre 1935), poète, écrivain et chef du mouvement Alash Orda kazakh; utilisé uniquement à des fins d’information. Il relate sa naissance dans une famille musulmane à Sarikopa, sa rencontre avec Ahmet Baitursynuly et Alikhan Bukeikhanov en 1904, ses ouvrages Oyan! Qazaq et Baqytsyz Jamal, son rôle à la tête de l’Alash, son arrestation en 1928 et sa mort au camp de travail de Solovki en 1935."
  ur: "میرجاکیپ دولتولی ⁦(25 نومبر 1885 - 5 اکتوبر 1935)⁩ پر انگریزی ویکیپیڈیا کا مضمون، قازق شاعر، مصنف اور الاش اردا رہنما؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ساری کوپا کے ایک مسلم گھرانے میں ان کی پیدائش، احمد بیتورسینولی اور علیخان بوکیخانوف سے ان کی 1904 میں ملاقات، ان کی کتابیں اویان! قزاق اور بقیتسیز جمال، اس کی الاش قیادت، 1928 میں اس کی گرفتاری اور 1935 میں سولوکی لیبر کیمپ میں اس کی موت۔"
  tr: "Kazak şair ve yazar ile Alash Orda'nın liderlerinden biri olan Mirjakip Dolatuli (25 Kasım 1885 – 5 Ekim 1935) hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılır. Serikoba'da Müslüman bir aileye doğumunu, 1904'te Ahmad Baitursinol ve Alikhan Bukikhanov ile tanışmasını ve \"Oyan! Kazakh\" ve \"Bakıtsiz Jamal\" adlı kitaplarını, Alash'taki liderliğini, 1928'de tutuklanmasını ve 1935'te Solovki kampında ölümünü kapsar."
  id: "Artikel Wikipedia bahasa Inggris tentang Mirjakip Dolatuli (25 November 1885 – 5 Oktober 1935), penyair dan penulis Kazakh serta salah satu pemimpin Alash Orda; hanya digunakan untuk fakta entitas tersebut. Artikel ini mencakup kelahirannya dalam keluarga Muslim di Sarikoba, pertemuannya dengan Ahmad Baitursinol dan Alikhan Bukikhanov pada tahun 1904, serta bukunya \"Oyan! Kazakh\" dan \"Bakıtsiz Jamal,\" kepemimpinannya di Alash, penangkapannya pada tahun 1928, dan kematiannya di kamp Solovki pada tahun 1935."
