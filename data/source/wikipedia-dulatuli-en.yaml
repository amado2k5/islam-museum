  ar: "مقالة ويكيبيديا الإنجليزية عن ميرجاقيب دولاتولي (25 نوفمبر 1885 – 5 أكتوبر 1935)، الشاعر والكاتب الكازاخي وأحد قادة ألاش أوردا؛ تُستخدم لوقائع الكيان فقط. تتناول مولده في أسرة مسلمة في ساريكوبا ولقاءه بأحمد بايتورسينول وعليخان بوكيخانوف سنة 1904 وكتابيه «أويان! قازاق» و«باقيتسيز جمال» وقيادته في ألاش واعتقاله سنة 1928 ووفاته في معسكر سولوفكي سنة 1935."
  en: "English Wikipedia article on Mirjaqip Dulatuli (25 November 1885 – 5 October 1935), the Kazakh poet, writer and Alash Orda leader; used for entity facts only. It covers his birth into a Muslim family at Sarikopa, his meeting with Ahmet Baitursynuly and Alikhan Bukeikhanov in 1904, his books Oyan! Qazaq and Baqytsyz Jamal, his Alash leadership, his arrest in 1928 and his death in the Solovki labour camp in 1935."
