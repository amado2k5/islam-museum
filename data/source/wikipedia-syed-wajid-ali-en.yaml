summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سيد واجد علي؛ تُستخدم هنا لوقائع عن والده: تذكر أن واجد علي كان الابن الثاني للسير سيد مراتب علي، مستشهدة بكتاب كلود ماركوفيتس عن تجار العصر الاستعماري (2008)، وتروي أعمال الأسرة التجارية في لاهور."
  en: "English Wikipedia article on Syed Wajid Ali; used here for facts about his father: it states that Wajid Ali was the second son of Sir Syed Maratib Ali, citing Claude Markovits's Merchants, Traders, Entrepreneurs (2008), and recounts the family's Lahore business career."
  es: "Artículo de la Wikipedia en inglés sobre Syed Wajid Ali; utilizado aquí para obtener información sobre su padre: afirma que Wajid Ali fue el segundo hijo de Sir Syed Maratib Ali, citando Merchants, Traders, Entrepreneurs (2008) de Claude Markovits, y relata la trayectoria empresarial de la familia en Lahore."
  fr: "Article de Wikipédia en anglais sur Syed Wajid Ali; utilisé ici pour des informations sur son père: il indique que Wajid Ali était le deuxième fils de Sir Syed Maratib Ali, citant Merchants, Traders, Entrepreneurs de Claude Markovits (2008), et relate la carrière commerciale de la famille à Lahore."
  ur: "سید واجد علی پر انگریزی ویکیپیڈیا مضمون؛ یہاں اپنے والد کے بارے میں حقائق کے لیے استعمال کیا گیا ہے: اس میں کہا گیا ہے کہ واجد علی سر سید مراتیب علی کے دوسرے بیٹے تھے، انہوں نے کلاڈ مارکوِٹس کے مرچنٹس، ٹریڈرز، انٹرپرینیورز (2008) کا حوالہ دیتے ہوئے اس خاندان کے لاہور کے کاروباری کیریئر کا ذکر کیا۔"
  tr: "Burada babası hakkında bilgi vermek için Syed Wajid Ali hakkında İngilizce Wikipedia makalesi kullanılmıştır: Wajid Ali'nin, Claude Markovitz'in Lahor'daki ticaret ailesinin işlerini anlatan sömürge dönemi tüccarları üzerine kitabına (2008) atıfta bulunarak, Sir Syed Maratib Ali'nin ikinci oğlu olduğunu unutmayın."
  id: "Artikel Wikipedia bahasa Inggris tentang Syed Wajid Ali digunakan di sini untuk fakta tentang ayahnya: Ingat bahwa Wajid Ali adalah putra kedua Sir Syed Maratib Ali, mengutip buku Claude Markovitz tentang pedagang era kolonial (2008), yang menceritakan bisnis keluarga pedagang di Lahore."
