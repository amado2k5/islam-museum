summary:
  ar: "ملف علمي بقلم كينيث إكس. روبنز وجون مكليود عن عائلة حميد: يوثق رفض يوسف حميد سنة 1992 أن يُسأل بصفته «زعيماً مسلماً» وبكلماته هو، ودعمه الكبير لترميم كنيس شار هشمايم في تاني إحياءً لذكرى والدته اليهودية."
  en: "Scholarly profile of the Hamied family by Kenneth X. Robbins and John McLeod; it records Yusuf Hamied's 1992 refusal, in his own words, of being consulted 'as a Muslim leader', and his heavy support for the reconstruction of the Shaar Hashamaim Synagogue in Thane in memory of his Jewish mother."
title: "Cipla's Journey: How a Muslim-Jewish Romance Shaped One of India's Biggest Pharma Firms"
