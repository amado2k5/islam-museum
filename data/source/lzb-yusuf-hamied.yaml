label: { en: "Yusuf Hamied — Robbins and McLeod profile" }
summary:
  ar: "ملف علمي بقلم كينيث إكس. روبنز وجون مكليود عن عائلة حميد: يوثق رفض يوسف حميد سنة 1992 أن يُسأل بصفته «زعيماً مسلماً» وبكلماته هو، ودعمه الكبير لترميم كنيس شار هشمايم في تاني إحياءً لذكرى والدته اليهودية."
  en: "Scholarly profile of the Hamied family by Kenneth X. Robbins and John McLeod; it records Yusuf Hamied's 1992 refusal, in his own words, of being consulted 'as a Muslim leader', and his heavy support for the reconstruction of the Shaar Hashamaim Synagogue in Thane in memory of his Jewish mother."
  es: "Perfil académico de la familia Hamied, elaborado por Kenneth X. Robbins y John McLeod; en él se recoge la negativa de Yusuf Hamied en 1992, en sus propias palabras, a ser consultado \"como líder musulmán\", y su firme apoyo a la reconstrucción de la sinagoga Shaar Hashamaim en Thane en memoria de su madre judía."
  fr: "Profil scientifique de la famille Hamied par Kenneth X. Robbins et John McLeod; il relate le refus de Yusuf Hamied en 1992, selon ses propres termes, d'être consulté « en tant que chef musulman », et son soutien indéfectible à la reconstruction de la synagogue Shaar Hashamaim à Thane en mémoire de sa mère juive."
  ur: "کینتھ ایکس رابنس اور جان میکلوڈ کے ذریعہ حمید خاندان کا علمی پروفائل؛ اس میں یوسف حامد کے 1992 کے انکار کو، ان کے اپنے الفاظ میں، 'ایک مسلمان رہنما کے طور پر' مشورہ کرنے سے، اور ان کی یہودی ماں کی یاد میں تھانے میں واقع شار ہاشمیم عبادت گاہ کی تعمیر نو کے لیے ان کی بھاری حمایت کو ریکارڈ کیا گیا ہے۔"
  tr: "Kenneth X tarafından hazırlanmış bilimsel bir dosya. Robbins ve John McLeod Hamid ailesi hakkında: Bu dosya, Youssef Hamid'in 1992'de \"Müslüman lider\" olarak ve kendi sözleriyle davet edilmeyi reddetmesini ve Yahudi annesinin ikinci anmasında Shar Hashemaim sinagogunun restorasyonunu güçlü şekilde desteklemesini belgelemektedir."
  id: "Berkas ilmiah oleh Kenneth X. Robbins dan John McLeod tentang keluarga Hamid: Ini mendokumentasikan penolakan Youssef Hamid pada tahun 1992 untuk diminta dalam kapasitasnya sebagai \"pemimpin Muslim\" dan dengan kata-katanya sendiri, serta dukungannya yang kuat untuk pemulihan sinagoga Shar Hashemaim dalam peringatan kedua ibunya yang Yahudi."
title: "Cipla's Journey: How a Muslim-Jewish Romance Shaped One of India's Biggest Pharma Firms"
