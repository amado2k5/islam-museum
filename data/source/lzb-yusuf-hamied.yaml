reliability_note: "Profile by two scholars of South Asian Jewish history, first published at Café Dissensus and republished by the Lithuanian Jewish Community on 13 October 2017; read in full on 1 November 2026. It is the source for Hamied's own recorded stance as stated in the person record's faith note, including the 1992 Times of India exchange, the Thane synagogue reconstruction, and his 2008 visit to the Ponary massacre site in Vilnius."
