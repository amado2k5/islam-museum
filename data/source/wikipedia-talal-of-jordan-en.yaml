  ar: "مقالة ويكيبيديا الإنجليزية عن الملك طلال (1909–1972)؛ تُستخدم لوقائع الكيان فقط. تروي مولده في مكة أكبر أبناء عبد الله بن الحسين، وخدمته في الفيلق العربي وتخرّجه في ساندهيرست، وجلوسه على العرش بعد اغتيال أبيه سنة 1951، ودستور 1952، وتنحّيه القسري سنة 1952 لمرض نفسي وُصف بالفصام، ووفاته في مصحّ بإسطنبول سنة 1972. صندوق معلوماتها يذكر دينه: الإسلام السنّي."
  en: "English Wikipedia article on King Talal (1909–1972); used for entity facts only. It recounts his Mecca birth as the eldest son of Abdullah bin Hussein, his Arab Legion service and Sandhurst graduation, his accession on his father's assassination in 1951, the constitution of 1952, his forced abdication in 1952 for a mental illness reported as schizophrenia, and his death at a sanatorium in Istanbul in 1972. Its infobox gives his religion as Sunni Islam."
