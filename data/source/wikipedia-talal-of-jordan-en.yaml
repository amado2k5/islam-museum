summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الملك طلال (1909–1972)؛ تُستخدم لوقائع الكيان فقط. تروي مولده في مكة أكبر أبناء عبد الله بن الحسين، وخدمته في الفيلق العربي وتخرّجه في ساندهيرست، وجلوسه على العرش بعد اغتيال أبيه سنة 1951، ودستور 1952، وتنحّيه القسري سنة 1952 لمرض نفسي وُصف بالفصام، ووفاته في مصحّ بإسطنبول سنة 1972. صندوق معلوماتها يذكر دينه: الإسلام السنّي."
  en: "English Wikipedia article on King Talal (1909–1972); used for entity facts only. It recounts his Mecca birth as the eldest son of Abdullah bin Hussein, his Arab Legion service and Sandhurst graduation, his accession on his father's assassination in 1951, the constitution of 1952, his forced abdication in 1952 for a mental illness reported as schizophrenia, and his death at a sanatorium in Istanbul in 1972. Its infobox gives his religion as Sunni Islam."
  es: "Artículo de la Wikipedia en inglés sobre el rey Talal (1909-1972); utilizado únicamente para datos sobre la persona. Relata su nacimiento en La Meca como hijo mayor de Abdullah bin Hussein, su servicio en la Legión Árabe y su graduación en Sandhurst, su ascenso al trono tras el asesinato de su padre en 1951, la constitución de 1952, su abdicación forzada en 1952 por una enfermedad mental diagnosticada como esquizofrenia, y su muerte en un sanatorio de Estambul en 1972. Su ficha informativa indica que profesaba el islam sunita."
  fr: "Article de Wikipédia en anglais sur le roi Talal (1909-1972); utilisé uniquement pour les informations le concernant. Il relate sa naissance à La Mecque, fils aîné d’Abdullah ben Hussein, son service dans la Légion arabe et son diplôme de Sandhurst, son accession au trône suite à l’assassinat de son père en 1951, la constitution de 1952, son abdication forcée en 1952 pour cause de maladie mentale (diagnostiquée comme étant la schizophrénie), et sa mort dans un sanatorium d’Istanbul en 1972. Son infobox indique qu’il était de confession sunnite."
  ur: "شاہ طلال پر انگریزی ویکیپیڈیا مضمون (1909–1972)؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں عبداللہ بن حسین کے بڑے بیٹے کے طور پر ان کی مکہ پیدائش، ان کی عرب لیجن سروس اور سینڈہرسٹ گریجویشن، 1951 میں اپنے والد کے قتل پر ان کا الحاق، 1952 کا آئین، 1952 میں ذہنی بیماری کی وجہ سے جبری دستبرداری کا ذکر ہے، اور 1997 میں اس کی موت شیزوفرینیا میں ہوئی تھی۔ infobox اپنا مذہب بطور سنی اسلام دیتا ہے۔"
  tr: "Kral Talal (1909–1972) hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Mekke'de doğmasını, Abdullah bin Hüseyin'in en büyük oğlu olarak doğumunu, Arap Lejyonu'ndaki hizmetini, Sandhurst'taki mezuniyetini, 1951'de babasının suikastından sonra tahta çıkışını, 1952 anayasasını, 1952'de şizofreni olarak tanımlanan bir akıl hastalığı nedeniyle zorunlu tahttan çekilmesini ve 1972'de İstanbul'daki bir hastanede ölümünü anlatır. Bilgi kutusunda dini olan Sünni İslam'dan bahsedilmektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Raja Talal (1909–1972); digunakan hanya untuk fakta entitas tersebut. Artikel ini menceritakan kelahirannya di Mekah, putra sulung Abdullah bin Hussein, pengabdiannya di Legiun Arab, kelulusannya di Sandhurst, naiknya ke tahta setelah pembunuhan ayahnya pada tahun 1951, konstitusi tahun 1952, penuntunan paksa tahta pada tahun 1952 karena penyakit mental yang disebut skizofrenia, dan kematiannya di rumah sakit di Istanbul pada tahun 1972. Kotak infonya menyebutkan agamanya: Islam Sunni."
