summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مرتضى مختاروف؛ تُستخدم لوقائع الكيان فقط. تروي مولده في أميرجان سنة 1857 ⁦(بعلامة استفهام في المقال نفسه)⁩، وشركته للحفر منذ 1890 وبراءاته، وقصره في باكو ومساجده، ووفاته في 28 أبريل 1920."
  en: "English Wikipedia article on Murtuza Mukhtarov; used for entity facts only. It recounts his birth at Amirjan in 1857 (queried in the article itself), his drilling company from 1890 and his patents, his Baku palace and his mosques, and his death on 28 April 1920."
  es: "Artículo de la Wikipedia en inglés sobre Murtuza Mukhtarov; utilizado únicamente para obtener información sobre la persona. Relata su nacimiento en Amirjan en 1857 (dato consultado en el propio artículo), su empresa de perforación desde 1890 y sus patentes, su palacio en Bakú y sus mezquitas, y su fallecimiento el 28 de abril de 1920."
  fr: "Article de Wikipédia en anglais sur Murtuza Mukhtarov; utilisé uniquement pour les informations sur l’entité. Il relate sa naissance à Amirjan en 1857 (mentionnée dans l’article lui-même), sa société de forage fondée en 1890 et ses brevets, son palais et ses mosquées à Bakou, ainsi que sa mort le 28 avril 1920."
  ur: "مرتضی مختاروف پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں امیرجان میں ان کی پیدائش 1857 ⁦(مضمون میں ہی پوچھی گئی)⁩، 1890 میں اس کی ڈرلنگ کمپنی اور اس کے پیٹنٹ، اس کے باکو محل اور اس کی مساجد اور 28 اپریل 1920 کو اس کی موت کا ذکر ہے۔"
  tr: "Murtada Mukhtarov hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1857'de Emircan'da doğduğu (aynı makalede soru işaretiyle), 1890'dan beri kazı şirketini, beraatlarını, Bakü'deki sarayını, camilerini ve 28 Nisan 1920'deki ölümünü anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Murtada Mukhtarov; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya di Emirjan pada tahun 1857 (dengan tanda tanya dalam artikel yang sama), perusahaan penggalian sejak 1890, pembebasannya, istananya di Baku, masjid-masjidnya, dan kematiannya pada 28 April 1920."
