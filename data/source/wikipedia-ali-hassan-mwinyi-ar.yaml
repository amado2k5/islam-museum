summary:
  ar: "مقالة ويكيبيديا العربية عن علي حسن مويني؛ تُستخدم لوقائع الكيان فقط. مقالة موجزة تروي رئاسته تنزانيا وتذكر فوزه بجائزة الملك فيصل العالمية في خدمة الإسلام سنة 2022. لا تسمي له مدرسة دينية."
  en: "Arabic Wikipedia article on Ali Hassan Mwinyi; used for entity facts only. A short article recounting his presidency of Tanzania and noting his 2022 King Faisal International Prize for Service to Islam. It names no religious school for him."
  es: "Artículo de Wikipedia en árabe sobre Ali Hassan Mwinyi; utilizado únicamente para datos sobre la persona. Un breve artículo que relata su presidencia de Tanzania y menciona el Premio Internacional Rey Faisal de 2022 por su servicio al Islam. No se menciona ninguna escuela religiosa a la que pertenezca."
  fr: "Article de Wikipédia en arabe consacré à Ali Hassan Mwinyi; utilisé uniquement à des fins d’information sur l’entité. Ce court article retrace sa présidence de la Tanzanie et mentionne l’obtention du Prix international du roi Faisal pour services rendus à l’islam en 2022. Aucune école religieuse n’est citée."
  ur: "علی حسن میونی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ ایک مختصر مضمون جس میں تنزانیہ کی ان کی صدارت کا ذکر کیا گیا ہے اور اسلام کی خدمت کے لیے ان کے 2022 کے شاہ فیصل بین الاقوامی انعام کا ذکر کیا گیا ہے۔ اس نے اس کے لیے کسی مذہبی درس کا نام نہیں لیا۔"
  tr: "Ali Hassan Mwini hakkında Arapça Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Tanzanya'daki başkanlığını anlatan ve 2022'de İslam Hizmeti Kral Faysal Uluslararası Ödülü'nü kazandığını anlatan kısa bir makale. Ona dini okul demeyin."
  id: "Artikel Wikipedia Arab tentang Ali Hassan Mwini; hanya digunakan untuk fakta entitas. Artikel singkat yang menceritakan masa kepresidenannya di Tanzania dan menyebutkan kemenangannya Penghargaan Internasional King Faisal dalam Pelayanan Islam pada tahun 2022. Jangan menyebutnya sekolah agama."
