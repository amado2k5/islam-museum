summary:
  ar: "مدخل «شبلي النعماني» في موسوعة الإسلام التركية (TDV) بقلم أنيس أحمد وم. سعيد أوزروارلي؛ يفصّل أستاذيته بعليكره منذ 1882 ورحلاته ولقبه «شمس العلماء» سنة 1894 واستقالته من ندوة العلماء في 3 مارس 1913 وتأسيسه دار المصنفين سنة 1914 ومؤلفاته بتواريخ طبعها ومشروعه في علم الكلام الجديد."
  en: "The TDV İslâm Ansiklopedisi (Turkish encyclopedia of Islam) entry 'Şiblî Nu'mânî' by Anis Ahmad and M. Sait Özervarli; it details his Aligarh post from 1882, his journeys, his title Shamsul Ulama in 1894, his resignation from Nadwatul Ulama on 3 March 1913, his founding of Darul Musannifin in 1914, his works with their print dates, and his new-kalam project."
