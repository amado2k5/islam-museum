reliability_note: "Scholarly encyclopedia entry, read in full on 24 October 2026 — an independent source beyond Wikipedia. It records his birth at Bindul in the Azamgarh region, his given name Muhammad, his laqab Shibli and his nisba Nu'mani after Imam Azam Nu'man ibn Thabit (Abu Hanifa), his Hajj in 1877, his Arabic post at the Muhammadan Anglo-Oriental College from 1882, his founding of a national college at Azamgarh in 1883, his travels to Turkey, Syria and Egypt for the great libraries, his reception by Abdul Hamid II and the Medjidie order, his attendance at Nadwatul Ulama's founding meeting in 1894 and the Shamsul Ulama title the same year, his leaving Aligarh in 1898 after sixteen years, his November 1900 move to Hyderabad to pay his father's debts and his service to the Nizam, his first secretaryship of the Anjuman-i Taraqqi-i Urdu (1903), his 1905 move to the editorship of the Nadwa journal and the academic direction of Darul Uloom Nadwatul Ulama, his resignation on 3 March 1913 after opposition to his curricular ideas (his students then boycotted classes for three months), his founding of Darul Musannifin at Azamgarh in 1914 with his own house and books given to it, and his death at Azamgarh in 1914. It calls him the Indian subcontinent's first modern Muslim historian and, in its second part, the representative of the new-kalam movement in India, summarising that project at length, including his criticism of both later-Ash'ari imitation and European-model imitation. It names no madhhab for him: his Sirat-i Nu'man treats the points of Hanafi fiqh because its subject is Abu Hanifa, not because it assigns Shibli a school."
