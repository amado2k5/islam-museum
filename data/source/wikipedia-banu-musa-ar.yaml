summary:
  ar: "مقالة ويكيبيديا العربية عن بني موسى؛ تثبت في قائمتها سنوات لكل أخ: محمد ⁦(قبل 803 – 873)⁩ وأحمد (803 – 873) والحسن (810 – 873)، وتضيف في متنها أن الحسن توفي سنة 873، وتجعل بغداد مولد الإخوة ووفاتهم في صندوق معلوماتها."
  en: "Arabic Wikipedia article on the Banu Musa; its list prints years for each brother — Muhammad (before 803 – 873), Ahmad (803 – 873) and al-Hasan (810 – 873) — its narrative adds that al-Hasan died in 873, and its infobox gives Baghdad as the brothers' birth and death place."
  es: "Artículo en árabe de la Wikipedia sobre los Banu Musa; su lista muestra los años de nacimiento de cada hermano: Muhammad (antes de 803 – 873), Ahmad (803 – 873) y al-Hasan (810 – 873). Su narración añade que al-Hasan murió en 873, y su ficha informativa indica que Bagdad fue el lugar de nacimiento y muerte de los hermanos."
  fr: "Article de Wikipédia en arabe sur les Banu Musa; sa liste imprime les années de chaque frère — Muhammad (avant 803 – 873), Ahmad (803 – 873) et al-Hasan (810 – 873) — son récit ajoute qu'al-Hasan est mort en 873, et son infobox indique Bagdad comme lieu de naissance et de décès des frères."
  ur: "بنو موسی پر عربی ویکیپیڈیا مضمون؛ اس کی فہرست ہر بھائی کے لیے سال پرنٹ کرتی ہے - محمد ⁦(803 - 873 سے پہلے)⁩، احمد (803 - 873) اور الحسن (810 - 873) - اس کی داستان میں مزید کہا گیا ہے کہ الحسن کی وفات 873 میں ہوئی، اور اس کا معلومات خانہ بغداد کو بھائیوں کی پیدائش اور موت کی جگہ بتاتا ہے۔"
  tr: "Banu Musa hakkında Arapça Vikipedi makalesi; her kardeşin yıllarını listeler: Muhammed (803-873'ten önce), Ahmed (803–873) ve Hasan (810–873) ve Hasan'ın 873'te öldüğü eklenir ve bilgi kutusunda kardeşlerin doğum ve ölüm yeri olarak Bağdat'ı gösterir."
  id: "Artikel Wikipedia berbahasa Arab tentang Banu Musa; mencantumkan tahun masing-masing saudara: Muhammad (sebelum 803–873), Ahmad (803–873), dan Hasan (810–873), menambahkan bahwa Hasan meninggal pada tahun 873, dan menempatkan Baghdad sebagai tempat kelahiran dan kematian kedua saudara tersebut dalam kotak informasinya."
