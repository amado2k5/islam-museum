reliability_note: "Read in full on 1 November 2026. The article's narrative is a fair Arabic account of the brothers' lives and works, drawing on MacTutor and Arabic heritage literature, but the individual years it prints for Ahmad (803-873) and al-Hasan (810-873) carry no citation in the article, and they are contradicted as knowledge by the English article's scholarly apparatus, which states that only Muhammad's death year is known. They are therefore preserved in the younger brothers' records as an attested modern tradition, not built as dates; the same applies to its infobox, which assigns Baghdad as the trio's birthplace and 873 as their common death year. Its statement that the family came from Marw al-Shahijan in Khurasan agrees with the English article's account of their father."
