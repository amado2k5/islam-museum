reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and re-fetched by the recorded revision id with content verified identical. It gives his birth with day precision — 23 July 1882 at Kocamustafapaşa, Istanbul — where the English article gives the year only, and his death on 26 January 1948 at Ankara. Its infobox gives his religion (dini) as Islam, generically, and the value itself carries the article's 'citation needed' tag; its text names no school for him. Its honorifics call him Şark Fatihi ('Conqueror of the East') and Alçıtepe Kahramanı ('Hero of Alçıtepe')."
