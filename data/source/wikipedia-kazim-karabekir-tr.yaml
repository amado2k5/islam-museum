summary:
  ar: "مقالة ويكيبيديا التركية عن كاظم قرة بكر؛ تُستخدم لوقائع الكيان فقط. تعطيه مولودًا في 23 يوليو 1882 بقوجة مصطفى باشا في إسطنبول، وتعطي صندوق معلوماتها دينه «الإسلام» بصيغة عامة مع وسم «بحاجة إلى مصدر»."
  en: "Turkish Wikipedia article on Kâzım Karabekir; used for entity facts only. It gives his birth as 23 July 1882 at Kocamustafapaşa, Istanbul, and its infobox gives his religion as Islam generically, flagged as needing a citation."
  es: "Artículo de la Wikipedia en turco sobre Kâzım Karabekir; utilizado únicamente para datos sobre la persona. Indica que nació el 23 de julio de 1882 en Kocamustafapaşa, Estambul, y su ficha informativa menciona genéricamente que su religión era el Islam, aunque se indica que requiere una cita."
  fr: "Article de Wikipédia en turc sur Kâzım Karabekir; utilisé uniquement pour les informations sur l'entité. Il indique sa naissance le 23 juillet 1882 à Kocamustafapaşa, Istanbul, et son infobox mentionne l'islam comme religion, sans préciser s'il s'agissait d'une citation."
  ur: "کاظم کارابیکیر پر ترک ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کی پیدائش 23 جولائی 1882 کو کوکامسٹافپاسا، استنبول میں ہوئی، اور اس کا معلوماتی خانہ اس کے مذہب کو عمومی طور پر اسلام کے طور پر دیتا ہے، جس میں ایک حوالہ کی ضرورت کے طور پر جھنڈا لگایا گیا ہے۔"
  tr: "Kazım Karabakır hakkında Türkçe Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 23 Temmuz 1882'de İstanbul'daki Kocae Mustafa Paşa'da doğum yapmış ve bilgi kutusunda genel biçimde dini \"İslam\" olarak \"kaynak gerekli\" etiketiyle yer almaktadır."
  id: "Artikel Wikipedia Turki tentang Kazim Karabakır; digunakan hanya untuk fakta entitas. Artikel tersebut melahirkannya pada 23 Juli 1882 di Kocae Mustafa Pasha di Istanbul, dan memberikan infobox agamanya \"Islam\" dalam bentuk umum dengan tag \"needs source.\""
