reliability_note: "First-person magazine profile, read in full on 25 October 2026. It records in her own words: 30 years in Iran on a refugee card; her 2012 return to her father's hometown in Charkint with her mother and three children; work with academic institutions in Mazar-i-Sharif; her appointment as district governor after Sarwar Danish's recommendation; and her post-2021 life in the American Midwest with her husband and three children. Its Hazara framing is quoted in the person record's faith note as group attribution only."
