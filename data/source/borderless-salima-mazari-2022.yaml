  ar: "ملف مجلة بوردرلس عن سليمة مزاري بصيغة «كما رُوي لـ» (7 يوليو 2022)؛ شهادتها بلسانها عن ولادتها لاجئة في إيران وعودتها سنة 2012 وحاكميتها وهربها إلى الغرب الأوسط الأمريكي. يصف الهزارة بأنهم أقلية عرقية تعرّضت للتمييز «بسبب عرقها ودينها الشيعي» — وصف للجماعة لا شهادة على انتمائها الشخصي."
  en: "Borderless Magazine's as-told-to profile of Salima Mazari (7 July 2022); her own account of her refugee birth in Iran, her 2012 return, her governorship and her escape to the American Midwest. It describes the Hazara as an ethnic minority discriminated against 'because of their ethnicity and Shiite religion' — a group description, not an attestation of her personal affiliation."
