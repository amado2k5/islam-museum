summary:
  ar: "كتاب الدكتور أحمد محمد عوف، ضمن السلسلة العلمية لمجمع البحوث الإسلامية بالأزهر الشريف، عن تاريخ الجامع الأزهر في ألف عام: قيادته، وما قيل عنه، وعصر بنائه؛ 158 صفحة، إشراف الأمين العام للمجمع."
  en: "Ahmad Muhammad Awf's book in the Scientific Series of the Islamic Research Academy of al-Azhar, on a thousand years of the al-Azhar mosque: its leadership, what was said about it, and the age of its building; 158 pages, supervised by the Academy's Secretary-General."
  es: "El libro de Ahmad Muhammad Awf, perteneciente a la Serie Científica de la Academia de Investigación Islámica de al-Azhar, trata sobre los mil años de la mezquita de al-Azhar: su liderazgo, lo que se dijo sobre ella y la antigüedad de su construcción; 158 páginas, supervisado por el Secretario General de la Academia."
  fr: "Le livre d'Ahmad Muhammad Awf dans la série scientifique de l'Académie de recherche islamique d'al-Azhar, sur mille ans de la mosquée al-Azhar: sa direction, ce qui a été dit à son sujet et l'âge de sa construction; 158 pages, supervisé par le secrétaire général de l'Académie."
  ur: "احمد محمد عوف کی کتاب الازہر کی اسلامک ریسرچ اکیڈمی کی سائنسی سیریز میں، مسجد الازہر کے ایک ہزار سال پر: اس کی قیادت، اس کے بارے میں کیا کہا گیا، اور اس کی عمارت کی عمر؛ اکیڈمی کے سیکرٹری جنرل کی زیر نگرانی 158 صفحات۔"
