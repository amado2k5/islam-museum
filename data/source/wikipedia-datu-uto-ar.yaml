  ar: "مقالة ويكيبيديا العربية عن داتو أوتو، ترجمة للمقالة الإنجليزية؛ تُستخدم لوقائع الكيان فقط. يعطي مربع معلوماتها دينه «أهل السنة والجماعة»، وتحمل قراءتين أقدم مخالفتين: نهاية حكمه سنة 1888 في صدرها ووفاته «نحو 1900» في مربع معلوماتها."
  en: "Arabic Wikipedia article on Datu Uto, a rendering of the English article; used for entity facts only. Its infobox gives his religion as Ahl al-Sunna wa'l-Jama'a (the Sunni community), and it carries two older variant readings against the English article: his reign ending in 1888 in its lead, and his death as 'c. 1900' in its infobox."
