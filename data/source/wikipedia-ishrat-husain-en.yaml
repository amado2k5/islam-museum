summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عشرت حسين؛ تُستخدم لوقائع الكيان فقط. تروي مولده سنة 1941 في أغرا وانتقال أسرته إلى كراتشي بعد التقسيم، ودراسته في كلية ويليامز وجامعة بوسطن، وعمله في البنك الدولي حتى 1999، ومحافظته لبنك الدولة الباكستاني في 1999–2006، وعمادته معهد إدارة الأعمال في 2008–2016، ومستشاريته رئيس الوزراء في 2018–2022، ورئاسته مركز التميز في التمويل الإسلامي بالمعهد."
  en: "English Wikipedia article on Ishrat Husain; used for entity facts only. It recounts his birth in 1941 at Agra and his family's move to Karachi after Partition, his studies at Williams College and Boston University, his World Bank career to 1999, his governorship of the State Bank of Pakistan 1999–2006, his deanship of IBA Karachi 2008–2016, his advisership to the Prime Minister 2018–2022, and his chairmanship of IBA's Centre for Excellence in Islamic Finance."
