  ar: "مقالة ويكيبيديا الإنجليزية عن أوزون حاجي؛ تُستخدم لوقائع الكيان فقط. يصفه متنها بأنه «شيخ طريقة صوفية نقشبندية» وتذكر تتلمذه مريدًا على الشيخ عبد الرحمن حاجي السوغوري النقشبندي وحصوله منه على الإجازة، ووفاته بالتيفوس في فيدينو في 30 مارس 1920."
  en: "English Wikipedia article on Uzun-Haji; used for entity facts only. Its text calls him “the sheikh of a Naqshbandi Sufi tariqa”, records his murid discipleship under the Naqshbandi sheikh Abdurrahman-Hajji as-Suguri and his ijazah from him, and his death from typhus at Vedeno on 30 March 1920."
