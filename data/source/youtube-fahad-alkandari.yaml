reliability_note: "The channel's own presence: a primary source for its identity, output and reach — not independent corroboration of biography. Verified as his own channel on 25 October 2026: the channel is named 'Fahad Alkandari l فهد الكندري' and its description states in Arabic that it is the official channel of Sheikh Fahad Alkandari; Kuwait Finance House's site likewise speaks of his programme Wisam al-Qur'an as broadcast on KTV and 'his YouTube channel'. The channel began on 2 July 2012 (ThoughtLeaders). Youtubers.me recorded 1,930,000 subscribers, 218,062,307 views and 1,008 videos for it in October 2026; platform figures change constantly and are recorded only with their date."
