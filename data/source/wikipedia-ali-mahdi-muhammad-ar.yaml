summary:
  ar: "مقالة ويكيبيديا العربية عن علي مهدي محمد؛ تُستخدم لوقائع الكيان فقط. تروي ولادته عام 1938 في إحدى قرى شبيلي الوسطى من أسرة صوفية كان والده فيها من متبعي الطريقة الإدريسية، وانتخابه رئيسا في جيبوتي سنة 1991 بعد الإطاحة ببري. خلفية أسرته الصوفية خلفية لا شهادة شخصية، وسنة ولادتها 1938 تخالف الإنجليزية وويكيداتا (1939)."
  en: "Arabic Wikipedia article on Ali Mahdi Muhammad; used for entity facts only. It recounts his birth in 1938 in a village of Middle Shabelle in a Sufi family whose father followed the Idrisiyya order, and his election as president at Djibouti in 1991 after Barre's overthrow. The family's Sufi background is background, not a personal attestation; its 1938 birth year differs from the English article and Wikidata (1939)."
