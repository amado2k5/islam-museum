summary:
  ar: "مقالة ويكيبيديا العربية عن علي مهدي محمد؛ تُستخدم لوقائع الكيان فقط. تروي ولادته عام 1938 في إحدى قرى شبيلي الوسطى من أسرة صوفية كان والده فيها من متبعي الطريقة الإدريسية، وانتخابه رئيسا في جيبوتي سنة 1991 بعد الإطاحة ببري. خلفية أسرته الصوفية خلفية لا شهادة شخصية، وسنة ولادتها 1938 تخالف الإنجليزية وويكيداتا (1939)."
  en: "Arabic Wikipedia article on Ali Mahdi Muhammad; used for entity facts only. It recounts his birth in 1938 in a village of Middle Shabelle in a Sufi family whose father followed the Idrisiyya order, and his election as president at Djibouti in 1991 after Barre's overthrow. The family's Sufi background is background, not a personal attestation; its 1938 birth year differs from the English article and Wikidata (1939)."
  es: "Artículo de Wikipedia en árabe sobre Ali Mahdi Muhammad; se utiliza únicamente para datos sobre la persona. Relata su nacimiento en 1938 en una aldea de Shabelle Medio, en el seno de una familia sufí cuyo padre pertenecía a la orden Idrisiyya, y su elección como presidente de Yibuti en 1991 tras el derrocamiento de Barre. Los antecedentes sufíes de la familia son información de contexto, no una afirmación personal; su año de nacimiento de 1938 difiere del artículo en inglés y de Wikidata (1939)."
  fr: "Article de Wikipédia en arabe sur Ali Mahdi Muhammad; utilisé uniquement à titre informatif. Il relate sa naissance en 1938 dans un village du Moyen-Shabelle, au sein d'une famille soufie dont le père appartenait à l'ordre Idrisiyya, et son élection à la présidence de Djibouti en 1991 après la chute de Barre. L'appartenance de la famille au soufisme est un élément de contexte et non une preuve personnelle; l'année de naissance mentionnée (1938) diffère de celle indiquée dans l'article en anglais et sur Wikidata (1939)."
