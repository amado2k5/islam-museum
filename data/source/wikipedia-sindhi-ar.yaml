summary:
  ar: "مقالة ويكيبيديا العربية عن عبيد الله السندي (1872–1944)؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في أسرة سيخية في سيالكوت باسم بوتا سينغ أوبال، واعتناقه الإسلام في الخامسة عشرة، ودراسته في دار العلوم ديوبند على يد رشيد أحمد الكنكوهي ومحمود حسن الديوبندي، ونشاطه السياسي ووفاته في 21 أغسطس 1944."
  en: "Arabic Wikipedia article on Obaidullah Sindhi (1872–1944); used for entity facts only. It recounts his birth in a Sikh family at Sialkot as Buta Singh Uppal, his conversion to Islam at fifteen, his studies at Darul Uloom Deoband under Rashid Ahmad Gangohi and Mahmud Hasan Deobandi, his political activity, and his death on 21 August 1944."
  es: "Artículo de Wikipedia en árabe sobre Obaidullah Sindhi (1872-1944); utilizado únicamente para datos sobre la persona. Relata su nacimiento en una familia sij en Sialkot con el nombre de Buta Singh Uppal, su conversión al islam a los quince años, sus estudios en Darul Uloom Deoband bajo la tutela de Rashid Ahmad Gangohi y Mahmud Hasan Deobandi, su actividad política y su fallecimiento el 21 de agosto de 1944."
  fr: "Article de Wikipédia en arabe sur Obaidullah Sindhi (1872-1944); utilisé uniquement à des fins d’information sur l’entité. Il relate sa naissance dans une famille sikh à Sialkot sous le nom de Buta Singh Uppal, sa conversion à l’islam à l’âge de quinze ans, ses études à Darul Uloom Deoband auprès de Rashid Ahmad Gangohi et Mahmud Hasan Deobandi, son engagement politique et sa mort le 21 août 1944."
  ur: "عبید اللہ سندھی (1872-1944) پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں سیالکوٹ کے ایک سکھ گھرانے میں بوٹا سنگھ اپل کے نام سے ان کی پیدائش، پندرہ سال کی عمر میں اسلام قبول کرنے، رشید احمد گنگوہی اور محمود حسن دیوبندی کی قیادت میں دارالعلوم دیوبند میں ان کی تعلیم، ان کی سیاسی سرگرمی، اور 21 اگست 1944 کو ان کی موت کا ذکر ہے۔"
