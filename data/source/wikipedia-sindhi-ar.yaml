  ar: "مقالة ويكيبيديا العربية عن عبيد الله السندي (1872–1944)؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في أسرة سيخية في سيالكوت باسم بوتا سينغ أوبال، واعتناقه الإسلام في الخامسة عشرة، ودراسته في دار العلوم ديوبند على يد رشيد أحمد الكنكوهي ومحمود حسن الديوبندي، ونشاطه السياسي ووفاته في 21 أغسطس 1944."
  en: "Arabic Wikipedia article on Obaidullah Sindhi (1872–1944); used for entity facts only. It recounts his birth in a Sikh family at Sialkot as Buta Singh Uppal, his conversion to Islam at fifteen, his studies at Darul Uloom Deoband under Rashid Ahmad Gangohi and Mahmud Hasan Deobandi, his political activity, and his death on 21 August 1944."
