summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أحمد بن خالد الناصري (1835–1897)، مؤرخ سلا صاحب «الاستقصا»؛ تصفه بأنه من الأسرة التي أسست الطريقة الناصرية في القرن السابع عشر، ولا تنسب إليه انتسابًا شخصيًا إلى طريقة أو مذهب."
  en: "The English Wikipedia article on Ahmad ibn Khalid al-Nasiri (1835–1897), the Salé historian of the Kitab al-Istiqsa; it describes him as a member of the family that founded the Nasiriyya Sufi order in the 17th century and makes no personal affiliation claim for him."
  es: "El artículo de la Wikipedia en inglés sobre Ahmad ibn Khalid al-Nasiri (1835-1897), el historiador salé del Kitab al-Istiqsa, lo describe como miembro de la familia que fundó la orden sufí Nasiriyya en el siglo XVII y no hace ninguna afirmación de afiliación personal sobre él."
  fr: "L'article de Wikipédia en anglais sur Ahmad ibn Khalid al-Nasiri (1835–1897), l'historien de Salé du Kitab al-Istiqsa; il le décrit comme un membre de la famille qui a fondé l'ordre soufi Nasiriyya au XVIIe siècle et ne fait aucune revendication d'affiliation personnelle pour lui."
  ur: "احمد بن خالد النصیری (1835–1897) پر انگریزی ویکیپیڈیا کا مضمون، کتاب الاستقسا کے سالے مورخ؛ یہ اسے اس خاندان کے ایک فرد کے طور پر بیان کرتا ہے جس نے 17ویں صدی میں ناصریہ صوفی حکم کی بنیاد رکھی اور اس کے لیے کوئی ذاتی وابستگی کا دعویٰ نہیں کرتا۔"
  tr: "Salé tarihçisi ve 'Al-İstiksa' kitabının yazarı Ahmed bin Halid el-Nasiri (1835–1897) hakkında İngilizce Wikipedia makalesi; onu on yedinci yüzyılda Nasiri tarikatını kuran aileye mensup olarak tanımlar ve herhangi bir tarikat veya mezhepten kişisel bir bağlılığı belirtmez."
  id: "Artikel Wikipedia bahasa Inggris tentang Ahmed bin Khalid al-Nasiri (1835–1897), sejarawan Salé dan penulis 'Al-Istiqsa'; artikel ini menggambarkannya sebagai anggota keluarga yang mendirikan ordo Nasiri pada abad ketujuh belas, dan tidak mengaitkan afiliasi pribadi apapun dengannya dari ordo atau sekte manapun."
