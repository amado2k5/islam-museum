  ar: "قناة عمران بن منصور على يوتيوب، التي بدأت باسم «جلسات النصيحة» وحملت مقاطعه باسم «رجل الدعوة»، ثم أُعيدت تسميتها «أغنياء صالحون» وتعمل اليوم باسم «شاي مع أخي»؛ ما زال فهرسها يضم مقاطع عصر «رجل الدعوة» إلى جانب محتوى جديد في ريادة الأعمال."
  en: "Imran ibn Mansur's YouTube channel, launched as Naseeha Sessions and carrying his Dawah Man videos, later renamed Righteous and Rich and now running as Chai With My Bhai; its catalogue still holds the Dawah Man-era videos alongside newer business content."
