summary:
  ar: "قناة عمران بن منصور على يوتيوب، التي بدأت باسم «جلسات النصيحة» وحملت مقاطعه باسم «رجل الدعوة»، ثم أُعيدت تسميتها «أغنياء صالحون» وتعمل اليوم باسم «شاي مع أخي»؛ ما زال فهرسها يضم مقاطع عصر «رجل الدعوة» إلى جانب محتوى جديد في ريادة الأعمال."
  en: "Imran ibn Mansur's YouTube channel, launched as Naseeha Sessions and carrying his Dawah Man videos, later renamed Righteous and Rich and now running as Chai With My Bhai; its catalogue still holds the Dawah Man-era videos alongside newer business content."
  es: "El canal de YouTube de Imran ibn Mansur, que se lanzó como Naseeha Sessions y que contenía sus vídeos de Dawah Man, fue posteriormente renombrado Righteous and Rich y ahora funciona como Chai With My Bhai; su catálogo aún conserva los vídeos de la época de Dawah Man junto con contenido empresarial más reciente."
  fr: "La chaîne YouTube d'Imran ibn Mansur, lancée sous le nom de Naseeha Sessions et diffusant ses vidéos Dawah Man, renommée plus tard Righteous and Rich et maintenant Chai With My Bhai; son catalogue contient toujours les vidéos de l'époque Dawah Man ainsi que du contenu commercial plus récent."
  ur: "عمران بن منصور کا یوٹیوب چینل، جسے نسیحہ سیشنز کے نام سے شروع کیا گیا اور اس کے دعوہ مین ویڈیوز لے کر، بعد میں اس کا نام بدل کر نیک اور امیر رکھ دیا گیا اور اب Chai With My Bhai کے نام سے چل رہا ہے۔ اس کے کیٹلاگ میں اب بھی نئے کاروباری مواد کے ساتھ دعوہ مین دور کی ویڈیوز موجود ہیں۔"
