  ar: "رابط «الكتاب ⁦(كتاب سيبويه)⁩» في المكتبة الشاملة كما ورد في ملخص بحثي قُدّم إلى المتحف؛ لم يفتح المتحف الصفحة، وقد أجاز المؤسس استعمال الملخص دون إعادة تحقق في 21 نوفمبر 2026، في موضوع: وجود الكتاب في المكتبة الشاملة."
  en: "The link for al-Kitab (Kitab Sibawayh) in the Shamela library, as listed in a research summary supplied to the museum; the museum did not open the page, and the founder approved using the summary without re-verification on 21 November 2026, for the work's presence in the Shamela library."
  ur: "«الکتاب ⁦(کتاب سیبویہ)⁩» کا المکتبۃ الشاملہ میں لنک، جیسا عجائب گھر کو دیے گئے ایک تحقیقی خلاصے میں مذکور ہے؛ عجائب گھر نے صفحہ نہیں کھولا، اور بانی نے 21 نومبر 2026 کو دوبارہ تصدیق کے بغیر خلاصے کے استعمال کی منظوری دی، موضوع: کتاب کی الشاملہ میں موجودگی۔"
  fr: "Le lien de al-Kitab (Kitab Sibawayh) dans la bibliothèque Shamela, tel que le liste un résumé de recherche remis au musée ; le musée n'a pas ouvert la page, et le fondateur a approuvé l'usage du résumé sans nouvelle vérification le 21 novembre 2026, pour la présence de l'ouvrage dans la bibliothèque Shamela."
  es: "El enlace de al-Kitab (Kitab Sibawayh) en la biblioteca Shamela, tal como lo lista un resumen de investigación entregado al museo; el museo no abrió la página, y el fundador aprobó usar el resumen sin nueva verificación el 21 de noviembre de 2026, para la presencia de la obra en la biblioteca Shamela."
  tr: "Kapsamlı Kütüphane'deki \"Kitap (Sibawayh'in Kitabı)\" bağlantısı, müzeye sunulan bir araştırma özetinde belirtilmiştir; müze sayfayı açmamış ve kurucu 21 Kasım 2026'da özetin yeniden doğrulama olmaksızın kullanılmasına izin vermiştir: Kitabın Kapsamlı Kütüphane'deki varlığı."
  id: "Tautan ke \"Buku (Buku Sibawayh)\" di Perpustakaan Komprehensif seperti yang tercantum dalam ringkasan penelitian yang dikirimkan ke museum; museum tidak membuka halaman tersebut, dan pendiri mengizinkan penggunaan ringkasan tanpa verifikasi ulang pada 21 November 2026, dengan topik: Kehadiran buku di Perpustakaan Komprehensif."
