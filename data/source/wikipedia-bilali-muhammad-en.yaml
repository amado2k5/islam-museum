  ar: "مقالة ويكيبيديا الإنجليزية عن وثيقة بلالي؛ تُستخدم لوقائع الكيان فقط. تروي حياة بلالي محمد، المولود في تيمبو بغينيا بين 1760 و1779 لأسرة مسلمة متعلمة، واستعباده وبيعه سنة 1802 إلى جزيرة سابيلو، ووفاته سنة 1857 واكتشاف مخطوطته العربية بعد وفاته."
  en: "English Wikipedia article on the Bilali Document; used for entity facts only. It recounts the life of Bilali Muhammad, born in Timbo, Guinea, between 1760 and 1779 to a well-educated Muslim family, his enslavement and sale in 1802 to Sapelo Island, his death in 1857 and the discovery of his Arabic manuscript after it."
