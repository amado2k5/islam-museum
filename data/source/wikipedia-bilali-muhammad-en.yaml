reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. The English biographical title 'Bilali Muhammad' redirects to this article. It gives Bilali as born in Timbo, Guinea, sometime between 1760 and 1779 to a well-educated West African Muslim family (citing B. G. Martin, Georgia Historical Quarterly, 1994), enslaved as a teenager, held ten years on Middle Caicos by Dr. Bell, sold in 1802 and bought by Thomas Spalding of Sapelo Island, where he became head driver and manager over some five hundred enslaved people; it records that he spoke Arabic and knew the Qur'an, that he and his fellow Muslims on Sapelo helped defend the United States in the War of 1812, and that he died in 1857, after which his thirteen-page Arabic manuscript was found. The manuscript is a statement of Islamic belief and the rules of ablution, morning prayer and the call to prayer, drawn from the Risalah of Ibn Abi Zayd al-Qayrawani. The article names no madhhab or order for Bilali personally; its categories are filings only."
