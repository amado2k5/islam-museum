summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن وثيقة بلالي؛ تُستخدم لوقائع الكيان فقط. تروي حياة بلالي محمد، المولود في تيمبو بغينيا بين 1760 و1779 لأسرة مسلمة متعلمة، واستعباده وبيعه سنة 1802 إلى جزيرة سابيلو، ووفاته سنة 1857 واكتشاف مخطوطته العربية بعد وفاته."
  en: "English Wikipedia article on the Bilali Document; used for entity facts only. It recounts the life of Bilali Muhammad, born in Timbo, Guinea, between 1760 and 1779 to a well-educated Muslim family, his enslavement and sale in 1802 to Sapelo Island, his death in 1857 and the discovery of his Arabic manuscript after it."
  es: "Artículo de la Wikipedia en inglés sobre el Documento de Bilali; se utiliza únicamente para obtener información sobre la persona. Narra la vida de Bilali Muhammad, nacido en Timbo, Guinea, entre 1760 y 1779 en el seno de una familia musulmana culta, su esclavitud y venta en 1802 a la isla de Sapelo, su muerte en 1857 y el posterior descubrimiento de su manuscrito árabe."
  fr: "Article de Wikipédia en anglais sur le Document de Bilali; utilisé uniquement à des fins d’information sur l’entité. Il relate la vie de Bilali Muhammad, né à Timbo, en Guinée, entre 1760 et 1779 dans une famille musulmane instruite, son esclavage et sa vente en 1802 à l’île de Sapelo, sa mort en 1857 et la découverte de son manuscrit arabe après celle-ci."
  ur: "بلالی دستاویز پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں بلالی محمد کی زندگی، جو 1760 اور 1779 کے درمیان ٹمبو، گنی میں پیدا ہوئے، ایک پڑھے لکھے مسلمان گھرانے میں، اس کی غلامی اور 1802 میں سیپیلو جزیرے پر فروخت، 1857 میں اس کی موت اور اس کے بعد اس کے عربی نسخے کی دریافت کا ذکر ہے۔"
  tr: "Bilali Belgesi hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılır. 1760-1779 yılları arasında Gine'nin Tymbou kentinde eğitimli bir Müslüman ailede doğan Bilali Muhammed'in hayatını, 1802'de köleleştirilip Sabila adasına satılmasını, 1857'deki ölümünü ve ölümünden sonra Arapça el yazmasının keşfini anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Dokumen Bilali; hanya digunakan untuk fakta entitas. Artikel ini menceritakan kehidupan Bilali Muhammad, lahir di Tymbou, Guinea antara tahun 1760 dan 1779 dari keluarga Muslim terdidik, perbudakan dan penjualan pada tahun 1802 ke pulau Sabilo, kematiannya pada tahun 1857, dan penemuan manuskrip Arabnya setelah kematiannya."
