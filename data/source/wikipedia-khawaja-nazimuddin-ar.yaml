  ar: "مقالة ويكيبيديا العربية المختصرة عن خواجة ناظم الدين (1894–1964)؛ تعطي مولده في 19 تموز 1894 ووفاته في 22 تشرين الأول 1964 في دكا ومناصبه، ولا تذكر ديانته."
  en: "The short Arabic Wikipedia article on Khawaja Nazimuddin (1894–1964); it gives his birth on 19 July 1894, his death on 22 October 1964 at Dhaka and his offices, and says nothing about his religion."
  es: "El breve artículo de Wikipedia en árabe sobre Khawaja Nazimuddin (1894-1964) indica su nacimiento el 19 de julio de 1894, su muerte el 22 de octubre de 1964 en Dhaka y sus oficinas, pero no dice nada sobre su religión."
  fr: "Le court article de Wikipédia en arabe sur Khawaja Nazimuddin (1894–1964); il donne sa naissance le 19 juillet 1894, sa mort le 22 octobre 1964 à Dhaka et ses bureaux, mais ne dit rien sur sa religion."
  ur: "خواجہ ناظم الدین (1894-1964) پر مختصر عربی ویکیپیڈیا مضمون؛ یہ ان کی پیدائش 19 جولائی 1894 کو ہوئی، اس کی موت 22 اکتوبر 1964 کو ڈھاکہ اور اس کے دفاتر میں ہوئی، اور اس کے مذہب کے بارے میں کچھ نہیں کہا گیا۔"
  tr: "Khwaja Nazimuddin (1894–1964) hakkında Arapça Vikipedi makalesi; 19 Temmuz 1894'te doğumunu ve 22 Ekim 1964'te Dakka'da vefatını ve görevlerini belirtir, dini ise belirtilmez."
  id: "Artikel Wikipedia Arab tentang Khwaja Nazimuddin (1894–1964); menyebutkan kelahirannya pada 19 Juli 1894, dan kematiannya pada 22 Oktober 1964 di Dhaka dan posisinya, serta tidak menyebutkan agamanya."
