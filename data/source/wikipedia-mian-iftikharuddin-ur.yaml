  ar: "مقالہ ویکیپیڈیا اردو مضمون میاں افتخار الدین کے بارے میں؛ اس کا متن ولادت کا سال 1908ء باغبانپورہ لاہور دیتا ہے (اگرچہ اس کا اپنا زمرہ 1907ء کی پیدائشوں کا ہے) اور وفات کا صرف سال 1962ء؛ پروگریسو پیپرز لمیٹڈ اور اس کے اخبارات درج ہیں۔ اس میں کوئی مذہبی بیان نہیں ملتا۔"
  en: "The Urdu Wikipedia article on Mian Iftikharuddin; its text gives his birth year as 1908 at Baghbanpura, Lahore (though its own category files him under 1907 births) and his death year only as 1962; it records Progressive Papers Limited and its newspapers. It makes no statement of his religion."
