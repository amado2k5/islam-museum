summary:
  ar: "مقالہ ویکیپیڈیا اردو مضمون میاں افتخار الدین کے بارے میں؛ اس کا متن ولادت کا سال 1908ء باغبانپورہ لاہور دیتا ہے ⁦(اگرچہ اس کا اپنا زمرہ 1907ء کی پیدائشوں کا ہے)⁩ اور وفات کا صرف سال 1962ء؛ پروگریسو پیپرز لمیٹڈ اور اس کے اخبارات درج ہیں۔ اس میں کوئی مذہبی بیان نہیں ملتا۔"
  en: "The Urdu Wikipedia article on Mian Iftikharuddin; its text gives his birth year as 1908 at Baghbanpura, Lahore (though its own category files him under 1907 births) and his death year only as 1962; it records Progressive Papers Limited and its newspapers. It makes no statement of his religion."
  es: "El artículo de Wikipedia en urdu sobre Mian Iftikharuddin indica que nació en 1908 en Baghbanpura, Lahore (aunque su propia categoría lo incluye entre los nacidos en 1907) y que falleció en 1962. Menciona a Progressive Papers Limited y sus periódicos, pero no especifica su religión."
  fr: "L'article de Wikipédia en ourdou consacré à Mian Iftikharuddin indique sa naissance en 1908 à Baghbanpura, Lahore (bien que sa propre catégorie le classe parmi les personnes nées en 1907) et son décès en 1962 seulement; il mentionne la société Progressive Papers Limited et ses journaux. Il ne fait aucune mention de sa religion."
