summary:
  ar: "مقالة ويكيبيديا الأردية عن حاجي عبد الرحمن ليمبونغ؛ وهي ترجمة للمقالة الإنجليزية وتُحسب ضمن أسرتها. تروي الحياة نفسها: وُلد 1868 في تيليمونغ، وقاد المقاومة من 1922 إلى 1928، ونُفي إلى مكة وتوفي فيها سنة 1929، ولا تسمّي له مذهبًا."
  en: "Urdu Wikipedia article on Haji Abdul Rahman Limbong; a translation of the English article and counted with its family. It gives the same life: born 1868 at Telemong, resistance leader from 1922 to 1928, exiled to Mecca and died there in 1929, naming no school."
  es: "Artículo de Wikipedia en urdu sobre Haji Abdul Rahman Limbong; una traducción del artículo en inglés que incluye a su familia. Presenta la misma biografía: nació en 1868 en Telemong, fue líder de la resistencia de 1922 a 1928, exiliado a La Meca y falleció allí en 1929, sin mencionar ninguna escuela."
  fr: "L'article de Wikipédia en ourdou sur Haji Abdul Rahman Limbong est une traduction de l'article anglais et mentionne sa famille. Il retrace sa vie de la même manière: né en 1868 à Telemong, chef de la résistance de 1922 à 1928, exilé à La Mecque où il mourut en 1929, sans préciser son école."
  ur: "حاجی عبدالرحمن لمبونگ پر اردو ویکیپیڈیا مضمون؛ انگریزی مضمون کا ترجمہ اور اس کے اہل خانہ کے ساتھ شمار کیا گیا۔ یہ وہی زندگی دیتا ہے: ٹیلی مونگ میں 1868 میں پیدا ہوا، 1922 سے 1928 تک مزاحمتی رہنما، مکہ جلاوطن ہو گیا اور وہیں 1929 میں انتقال کر گیا، کسی اسکول کا نام نہیں رکھا۔"
