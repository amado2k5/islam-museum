  fr: "Page citée dans un résumé de recherche remis au musée et approuvé par le fondateur le 21 novembre 2026 ; la page n'a pas été ouverte, et les numéros de page sont ceux du résumé, non vérifiés. Éditeur : IslamWeb. Utilisée pour : la question de savoir si une traduction est le Coran et la règle sur son toucher; les positions sur la récitation du Coran dans une langue autre que l'arabe dans la prière."
  es: "Página citada en un resumen de investigación entregado al museo y aprobado por el fundador el 21 de noviembre de 2026; la página no se abrió, y los números de página son los del resumen, sin comprobar. Editor: IslamWeb. Usada para: si una traducción cuenta como el Corán y la regla sobre tocarla; las posiciones sobre recitar el Corán en una lengua distinta del árabe en la oración."
