summary:
  ar: "كتاب الدكتور عباس شومان (وكيل الأزهر الشريف) ضمن السلسلة العلمية لمجمع البحوث الإسلامية، السنة التاسعة والأربعون (1439هـ/2018م)، 544 صفحة؛ يجمع مقالات نشرها المؤلف في الصحف عن التجديد في الفكر الإسلامي: مداخل نظرية عن ماهيته وضوابطه، ثم مسائل في العبادات والأسرة والمعاملات وحقوق غير المسلمين والتطرف، وفقه السياسة الشرعية. أرقام الصفحات المستشهد بها هي أرقام صفحات ملف PDF، والصفحة المطبوعة أقل منها بواحد."
  en: "Abbas Shouman's book (Deputy Grand Imam of al-Azhar) in the Scientific Series of the Islamic Research Academy, 49th year (1439 AH / 2018 CE), 544 pages; a collection of articles the author published in newspapers on renewal in Islamic thought, opening with a framework on its nature and limits and then taking up questions of worship, family, dealings, the rights of non-Muslims, extremism, and sharia politics. Page citations are PDF page numbers; the printed page is one less."
