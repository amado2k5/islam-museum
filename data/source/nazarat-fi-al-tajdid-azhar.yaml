  ar: نظرات في التجديد — عباس شومان
  en: Glances at Renewal — Abbas Shouman
summary:
  ar: "كتاب الدكتور عباس شومان ⁦(وكيل الأزهر الشريف)⁩ ضمن السلسلة العلمية لمجمع البحوث الإسلامية، السنة التاسعة والأربعون ⁦(1439هـ/2018م)⁩، 544 صفحة؛ يجمع مقالات نشرها المؤلف في الصحف عن التجديد في الفكر الإسلامي: مداخل نظرية عن ماهيته وضوابطه، ثم مسائل في العبادات والأسرة والمعاملات وحقوق غير المسلمين والتطرف، وفقه السياسة الشرعية. أرقام الصفحات المستشهد بها هي أرقام صفحات ملف PDF، والصفحة المطبوعة أقل منها بواحد."
  en: "Abbas Shouman's book (Deputy Grand Imam of al-Azhar) in the Scientific Series of the Islamic Research Academy, 49th year (1439 AH / 2018 CE), 544 pages; a collection of articles the author published in newspapers on renewal in Islamic thought, opening with a framework on its nature and limits and then taking up questions of worship, family, dealings, the rights of non-Muslims, extremism, and sharia politics. Page citations are PDF page numbers; the printed page is one less."
  es: "Libro de Abbas Shouman (Gran Imán Adjunto de al-Azhar) en la Serie Científica de la Academia de Investigación Islámica, año 49 (1439 AH / 2018 d. C.), 544 páginas; una recopilación de artículos que el autor publicó en periódicos sobre la renovación del pensamiento islámico, comenzando con un marco sobre su naturaleza y límites, para luego abordar cuestiones de culto, familia, relaciones, derechos de los no musulmanes, extremismo y política de la sharia. Las citas de página corresponden a los números de página del PDF; la página impresa es una página menos."
  fr: "Ouvrage d'Abbas Shouman (Grand Imam adjoint d'al-Azhar), publié dans la Collection scientifique de l'Académie de recherche islamique, 49e année (1439 AH / 2018 ap. J.-C.), 544 pages; recueil d'articles parus dans la presse sur le renouveau de la pensée islamique, débutant par une introduction à sa nature et ses limites, puis abordant des questions telles que le culte, la famille, les relations humaines, les droits des non-musulmans, l'extrémisme et la politique de la charia. Les références de pages correspondent aux numéros de page du PDF; la version imprimée comporte une page de moins."
  ur: "اسلامک ریسرچ اکیڈمی کے سائنسی سلسلے میں عباس شومان کی کتاب ⁦(نائب عظیم الشان امام الازہر)⁩، 49 ویں سال ⁦(1439ھ / 2018 عیسوی)⁩، 544 صفحات؛ اسلامی فکر کی تجدید پر مصنف کے اخبارات میں شائع ہونے والے مضامین کا مجموعہ، اس کی نوعیت اور حدود پر ایک فریم ورک کے ساتھ آغاز اور پھر عبادات، خاندان، معاملات، غیر مسلموں کے حقوق، انتہا پسندی، اور شرعی سیاست کے سوالات اٹھائے۔ صفحہ کے حوالہ جات پی ڈی ایف صفحہ نمبر ہیں۔ پرنٹ شدہ صفحہ ایک کم ہے۔"
