summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن إدريس مرشد العزم شاه سلطان فيرق؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 19 حزيران 1849 في كوالا كيبوي بكمبار، وخلافته صهره السلطان يوسف شرف الدين مظفر شاه سنة 1887، ودخول فيرق الولايات الملايوية الاتحادية، ووفاته في 14 كانون الثاني 1916 في بوكيت تشاندان بكوالا كانغسار ودفنه في مقبرة الغفران الملكية. يعطي صندوق معلوماتها ديانته «الإسلام السنّي» ولا يسمّي متنها مذهبًا. تسمّيه مقدمتها السلطان الثامن والعشرين ويسمّيه متن نشأتها السابع والعشرين."
  en: "English Wikipedia article on Idris Murshidul Azzam Shah of Perak; used for entity facts only. It gives his birth on 19 June 1849 at Kuala Keboi, Kampar, his succession to his father-in-law Sultan Yusuf Sharifuddin Muzaffar Shah in 1887, Perak's entry into the Federated Malay States, his death on 14 January 1916 at Bukit Chandan, Kuala Kangsar, and his burial at the Al-Ghufran Royal Mausoleum. Its infobox gives his religion as Sunni Islam; its text names no school. Its lead calls him the 28th sultan and its early-life text the 27th."
