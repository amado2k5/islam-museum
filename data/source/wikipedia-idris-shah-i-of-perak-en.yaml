summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن إدريس مرشد العزم شاه سلطان فيرق؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 19 حزيران 1849 في كوالا كيبوي بكمبار، وخلافته صهره السلطان يوسف شرف الدين مظفر شاه سنة 1887، ودخول فيرق الولايات الملايوية الاتحادية، ووفاته في 14 كانون الثاني 1916 في بوكيت تشاندان بكوالا كانغسار ودفنه في مقبرة الغفران الملكية. يعطي صندوق معلوماتها ديانته «الإسلام السنّي» ولا يسمّي متنها مذهبًا. تسمّيه مقدمتها السلطان الثامن والعشرين ويسمّيه متن نشأتها السابع والعشرين."
  en: "English Wikipedia article on Idris Murshidul Azzam Shah of Perak; used for entity facts only. It gives his birth on 19 June 1849 at Kuala Keboi, Kampar, his succession to his father-in-law Sultan Yusuf Sharifuddin Muzaffar Shah in 1887, Perak's entry into the Federated Malay States, his death on 14 January 1916 at Bukit Chandan, Kuala Kangsar, and his burial at the Al-Ghufran Royal Mausoleum. Its infobox gives his religion as Sunni Islam; its text names no school. Its lead calls him the 28th sultan and its early-life text the 27th."
  es: "Artículo de la Wikipedia en inglés sobre Idris Murshidul Azzam Shah de Perak; utilizado únicamente para datos sobre la entidad. Indica su nacimiento el 19 de junio de 1849 en Kuala Keboi, Kampar, su sucesión de su suegro, el sultán Yusuf Sharifuddin Muzaffar Shah, en 1887, la entrada de Perak en los Estados Federados Malayos, su muerte el 14 de enero de 1916 en Bukit Chandan, Kuala Kangsar, y su entierro en el Mausoleo Real de Al-Ghufran. Su ficha informativa indica que su religión era el islam sunita; su texto no menciona ninguna escuela. Su introducción lo denomina el 28.º sultán y su texto sobre su juventud, el 27.º."
  fr: "Article de Wikipédia en anglais sur Idris Murshidul Azzam Shah de Perak; utilisé uniquement pour les informations le concernant. Il indique sa naissance le 19 juin 1849 à Kuala Keboi, Kampar, son accession au trône de son beau-père, le sultan Yusuf Sharifuddin Muzaffar Shah, en 1887, l’entrée de Perak dans les États malais fédérés, sa mort le 14 janvier 1916 à Bukit Chandan, Kuala Kangsar, et son inhumation au mausolée royal d’Al-Ghufran. Son infobox précise qu’il était de confession sunnite; le texte ne mentionne aucune école sultane. Son introduction le désigne comme le 28e sultan et sa biographie comme le 27e."
  ur: "پیرک کے ادریس مرشد العظیم شاہ پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 19 جون 1849 کو کوالا کیبوئی، کمپار میں ان کی پیدائش، 1887 میں ان کے سسر سلطان یوسف شریف الدین مظفر شاہ کی جانشینی، فیڈریٹڈ ملائی ریاستوں میں پیراک کا داخلہ، ان کی موت 14 جنوری 1916 کو بکیت چندن، کوالال کانگسار کے مقام پر، اور ان کے المعروف روم میں ہوئی۔ اس کا انفو باکس اس کا مذہب بطور سنی اسلام دیتا ہے۔ اس کے متن کا کوئی اسکول نہیں ہے۔ اس کا لیڈ اسے 28 واں سلطان اور اس کی ابتدائی زندگی کا متن 27 واں کہتا ہے۔"
  tr: "İdris Murshid el-Azm Şah Sultan Firaq hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 19 Haziran 1849'da Kuala Quipe, Kampar'da doğdu, 1887'de damadı Sultan Yusuf Şerafuddin Muzaffar Şah tarafından yerine geçti, Malay Federal Eyalet Birliği'ne katıldı, 14 Ocak 1916'da Kuala Kangsar, Phuket Chandan'da öldü ve Kraliyet Ghufran Mezarlığı'na defnedildi. Bilgi kutusunda dini 'Sünni İslam' olarak belirtilmiş, metni bir tarikat olarak adlandırılmamıştır. Giriş metninde yirmi sekizinci Sultan ve yirmi yedinci köken metni olarak adlandırılmıştır."
  id: "Artikel Wikipedia bahasa Inggris tentang Idris Murshid al-Azm Shah Sultan Firaq; digunakan hanya untuk fakta entitas. Ia lahir pada 19 Juni 1849 di Kuala Quipe, Kampar, digantikan oleh menantunya Sultan Yusuf Sharafuddin Muzaffar Shah pada tahun 1887, bergabung dengan Korps Provinsi Federal Melayu, meninggal pada 14 Januari 1916 di Phuket Chandan, Kuala Kangsar, dan dimakamkan di Pemakaman Kerajaan Ghufran. Kotak infonya mencantumkan agamanya sebagai 'Islam Sunni' dan tidak menyebut teksnya sebagai sekte. Pendahuluannya menyebutnya sebagai Sultan ke-28 dan teks asal-usulnya yang kedua puluh tujuh."
