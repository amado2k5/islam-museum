summary:
  ar: "مقالة ويكيبيديا العربية «سلطان بن سلمان بن عبد العزيز آل سعود»، مراجعة 19 أكتوبر 2026؛ تُستخدم لوقائع الكيان فقط. تؤرخ رئاسته للهيئة السعودية للفضاء من تأسيسها حتى 2 مايو 2021، وتسجل قائمة تكريماته الطويلة."
  en: "Arabic Wikipedia article on Sultan bin Salman Al Saud, revision of 19 October 2026; used for entity facts only. It dates his chairmanship of the Saudi Space Commission from its inception to 2 May 2021 and lists his many decorations."
  es: "Artículo de Wikipedia en árabe sobre el sultán bin Salman Al Saud, revisado el 19 de octubre de 2026; utilizado únicamente para datos sobre la persona. En él se fecha su presidencia de la Comisión Espacial Saudí desde su creación hasta el 2 de mayo de 2021 y se enumeran sus numerosas condecoraciones."
  fr: "Article de Wikipédia en arabe sur Sultan bin Salman Al Saud, mis à jour le 19 octobre 2026; utilisé uniquement à des fins d’information sur l’entité. Il retrace son mandat à la tête de la Commission spatiale saoudienne, de sa création jusqu’au 2 mai 2021, et énumère ses nombreuses décorations."
  ur: "سلطان بن سلمان آل سعود پر عربی ویکیپیڈیا کا مضمون، 19 اکتوبر 2026 کی نظر ثانی؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ سعودی اسپیس کمیشن کے آغاز سے لے کر 2 مئی 2021 تک ان کی سربراہی کی تاریخ رکھتا ہے اور ان کی بہت سی سجاوٹوں کی فہرست دیتا ہے۔"
  tr: "Arapça Vikipedi makalesi \"Sultan bin Salman bin Abdulaziz Al Saud,\" 19 Ekim 2026'da incelenmiştir; yalnızca varlık gerçekleri için kullanılmıştır. Suudi Uzay Komisyonu'nun başkanlığı, kuruluşundan 2 Mayıs 2021'e kadar sürmektedir ve uzun onur listesini kaydetmektedir."
  id: "Artikel Wikipedia Arab \"Sultan bin Salman bin Abdulaziz Al Saud,\" ditinjau pada 19 Oktober 2026; digunakan hanya untuk fakta entitas. Kepresidenannya di Komisi Antariksa Saudi dimulai sejak pendiriannya hingga 2 Mei 2021, dan mencatat daftar panjang penghargaan yang diterimanya."
