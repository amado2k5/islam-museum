  ar: "«الدستور المؤقت للصومال، 2012، النص الصومالي»، كما يُنشر عند: البرلمان الفيدرالي الصومالي، ملف PDF بالإنجليزية. العنوان ونص المادة 5 مأخوذان من ملخص بحثي زُوّد به المتحف، ولم يفتح المتحف الصفحة؛ وقد أجاز المؤسس استعمال النص كما ورد في 21 نوفمبر 2026."
  en: "Provisional Constitution of Somalia, 2012, Somali text, as published at: Federal Parliament of Somalia, English PDF. The address and the wording of Article 5 come from a research summary supplied to the museum, and the museum did not open the page; the founder approved using the wording as supplied on 21 November 2026."
  ur: "Provisional Constitution of Somalia, 2012, Somali text، جیسا کہ Federal Parliament of Somalia, English PDF پر شائع ہے۔ پتہ اور دفعہ 5 کی عبارت متحف کو فراہم کردہ ایک تحقیقی خلاصے سے لی گئی ہے، اور متحف نے صفحہ نہیں کھولا؛ بانی نے 21 نومبر 2026 کو عبارت کو جیسی ملی اسی طرح استعمال کرنے کی منظوری دی۔"
  fr: "Provisional Constitution of Somalia, 2012, Somali text, tel que publié à : Federal Parliament of Somalia, English PDF. L'adresse et le texte (article 5) viennent d'un résumé de recherche remis au musée, et le musée n'a pas ouvert la page ; le fondateur a approuvé l'usage du texte tel que fourni le 21 novembre 2026."
  es: "Provisional Constitution of Somalia, 2012, Somali text, tal como se publica en: Federal Parliament of Somalia, English PDF. La dirección y el texto (artículo 5) proceden de un resumen de investigación entregado al museo, y el museo no abrió la página; el fundador aprobó usar el texto tal como se entregó el 21 de noviembre de 2026."
  tr: "\"Somali Geçici Anayasası, 2012, Somali Metni,\" yayımlanmıştır: Somali Federal Parlamentosu, İngilizce PDF dosyası. Madde 5'in başlığı ve metni, müze tarafından sağlanan bir araştırma özetinden alınmıştır ve müze sayfayı açmamıştır; kurucu, metnin kullanımına 21 Kasım 2026'da belirtildiği şekilde izin vermiştir."
  id: "\"Konstitusi Sementara Somalia, 2012, Teks Somalia,\" diterbitkan di: Parlemen Federal Somalia, file PDF dalam bahasa Inggris. Judul dan teks Pasal 5 diambil dari ringkasan penelitian yang disediakan oleh museum, dan museum tidak membuka halaman tersebut; pendiri mengizinkan penggunaan teks tersebut seperti yang dinyatakan pada 21 November 2026."
