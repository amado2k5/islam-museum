reliability_note: "Structured-data item, retrieved via the MediaWiki API on 1 November 2026 and its revision re-asserted against a second live query (identical). The item was resolved through its English sitelink 'Al-Hasan ibn Musa ibn Shakir', a redirect page to the combined Banu Musa article. Registered for the identifier only: its birth (810) and death (873) values, both in the Julian calendar model, are unsourced and descend from the same modern tradition as the Arabic article's printed years (810-873); the English article's scholarly apparatus dates al-Hasan only to the 9th century and states that of the three brothers only Muhammad's death year is known, so the values are preserved as a tradition in his record but no birth or death block is built from them. The item carries no religion value."
