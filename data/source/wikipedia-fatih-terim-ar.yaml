summary:
  ar: "مقالة ويكيبيديا العربية عن فاتح تريم؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 4 سبتمبر 1953 في أضنة ولقبه «الإمبراطور» ومسيرته مع غلطة سراي وفي إيطاليا ومنتخب تركيا، ولا تذكر شيئًا عن ديانته."
  en: "Arabic Wikipedia article on Fatih Terim; used for entity facts only. It gives his birth on 4 September 1953 in Adana, his 'Emperor' nickname and his career with Galatasaray, in Italy and with the Turkey national team. It makes no statement of his religion."
  es: "Artículo de Wikipedia en árabe sobre Fatih Terim; se utiliza únicamente para obtener información sobre la persona. Indica su fecha de nacimiento, el 4 de septiembre de 1953 en Adana, su apodo de «Emperador» y su trayectoria en el Galatasaray, en Italia y con la selección nacional de Turquía. No menciona su religión."
  fr: "Article Wikipédia en arabe consacré à Fatih Terim; utilisé uniquement à titre informatif. Il mentionne sa date de naissance, le 4 septembre 1953 à Adana, son surnom « Empereur » et sa carrière au Galatasaray, en Italie et en équipe nationale de Turquie. Sa religion n'est pas précisée."
  ur: "عربی ویکیپیڈیا مضمون فتح تریم پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ان کی پیدائش 4 ستمبر 1953 کو اڈانا میں ہوئی، اس کا 'شہنشاہ' عرفی نام اور گالاتاسرائے کے ساتھ، اٹلی میں اور ترکی کی قومی ٹیم کے ساتھ ان کا کیریئر۔ اس میں اس کے مذہب کا کوئی بیان نہیں ہے۔"
