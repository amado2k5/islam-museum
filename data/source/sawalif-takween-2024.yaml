summary:
  ar: "مادة سواليف ⁦(24 مايو 2024، أعاد نشرها موقع عرب خبر)⁩ عن إطلاق مؤسسة تكوين الفكر العربي في القاهرة في 4 مايو 2024: تعريف المؤسسة بنفسها، ومجلس أمنائها وفيه يوسف زيدان، ومؤتمرها الأول عن طه حسين، والانتقادات الحادة التي واجهتها ودعوات إغلاقها، وأصوات دعت إلى التريث في الحكم عليها."
  en: "Sawalif feature (24 May 2024, republished by Arab Khabar) on the launch of the Takween Foundation for Arab Thought in Cairo on 4 May 2024: the foundation's self-definition, its board of trustees including Youssef Ziedan, its first conference on Taha Hussein, the sharp criticism and closure calls it faced, and voices urging that it be judged by its output."
