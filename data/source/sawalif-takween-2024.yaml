summary:
  ar: "مادة سواليف ⁦(24 مايو 2024، أعاد نشرها موقع عرب خبر)⁩ عن إطلاق مؤسسة تكوين الفكر العربي في القاهرة في 4 مايو 2024: تعريف المؤسسة بنفسها، ومجلس أمنائها وفيه يوسف زيدان، ومؤتمرها الأول عن طه حسين، والانتقادات الحادة التي واجهتها ودعوات إغلاقها، وأصوات دعت إلى التريث في الحكم عليها."
  en: "Sawalif feature (24 May 2024, republished by Arab Khabar) on the launch of the Takween Foundation for Arab Thought in Cairo on 4 May 2024: the foundation's self-definition, its board of trustees including Youssef Ziedan, its first conference on Taha Hussein, the sharp criticism and closure calls it faced, and voices urging that it be judged by its output."
  es: "Artículo de Sawalif (24 de mayo de 2024, republicado por Arab Khabar) sobre el lanzamiento de la Fundación Takween para el Pensamiento Árabe en El Cairo el 4 de mayo de 2024: la autodefinición de la fundación, su junta directiva, incluido Youssef Ziedan, su primera conferencia sobre Taha Hussein, las duras críticas y los llamamientos a su cierre a los que se enfrentó, y las voces que instaban a que se la juzgara por sus resultados."
  fr: "Article de Sawalif (24 mai 2024, republié par Arab Khabar) sur le lancement de la Fondation Takween pour la pensée arabe au Caire le 4 mai 2024: l’auto-définition de la fondation, son conseil d’administration comprenant Youssef Ziedan, sa première conférence sur Taha Hussein, les critiques acerbes et les appels à la fermeture auxquels elle a été confrontée, et les voix qui insistent pour qu’elle soit jugée sur sa production."
title: "«مؤسسة تكوين الفكر العربي».. ما قصتها ولماذا أحدثت هذه الضجة؟"
