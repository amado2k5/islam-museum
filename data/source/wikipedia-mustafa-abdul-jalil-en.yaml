summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مصطفى عبد الجليل؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في 6 نوفمبر 1952 في البيضاء، وتخرّجه سنة 1975 في الشريعة والقانون من جامعة ليبيا، وقضاءه منذ 1978، وأمانته للجنة الشعبية العامة للعدل في نظام القذافي (2007–2011) واستقالته في 21 فبراير 2011، ورئاسته المجلس الوطني الانتقالي من 5 مارس 2011 إلى 8 أغسطس 2012 حين كان رئيس دولة ليبيا بحكم الواقع. ولا يذكر متنها دينه."
  en: "English Wikipedia article on Mustafa Abdul Jalil; used for entity facts only. It gives his birth on 6 November 1952 at Beida, his 1975 graduation in Shari'a and law from the University of Libya, his judgeship from 1978, his service as Gaddafi's secretary of justice (2007–2011) and his resignation on 21 February 2011, and his chairmanship of the National Transitional Council from 5 March 2011 to 8 August 2012, when he was Libya's de facto head of state. It makes no statement of his religion in its text."
