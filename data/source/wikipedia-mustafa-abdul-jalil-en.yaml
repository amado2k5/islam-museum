summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مصطفى عبد الجليل؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في 6 نوفمبر 1952 في البيضاء، وتخرّجه سنة 1975 في الشريعة والقانون من جامعة ليبيا، وقضاءه منذ 1978، وأمانته للجنة الشعبية العامة للعدل في نظام القذافي (2007–2011) واستقالته في 21 فبراير 2011، ورئاسته المجلس الوطني الانتقالي من 5 مارس 2011 إلى 8 أغسطس 2012 حين كان رئيس دولة ليبيا بحكم الواقع. ولا يذكر متنها دينه."
  en: "English Wikipedia article on Mustafa Abdul Jalil; used for entity facts only. It gives his birth on 6 November 1952 at Beida, his 1975 graduation in Shari'a and law from the University of Libya, his judgeship from 1978, his service as Gaddafi's secretary of justice (2007–2011) and his resignation on 21 February 2011, and his chairmanship of the National Transitional Council from 5 March 2011 to 8 August 2012, when he was Libya's de facto head of state. It makes no statement of his religion in its text."
  es: "Artículo de la Wikipedia en inglés sobre Mustafa Abdul Jalil; utilizado únicamente para datos sobre la persona. Indica su nacimiento el 6 de noviembre de 1952 en Beida, su graduación en Sharia y Derecho en la Universidad de Libia en 1975, su nombramiento como juez desde 1978, su servicio como secretario de Justicia de Gadafi (2007-2011) y su dimisión el 21 de febrero de 2011, y su presidencia del Consejo Nacional de Transición desde el 5 de marzo de 2011 hasta el 8 de agosto de 2012, periodo en el que fue jefe de Estado de facto de Libia. No menciona su religión en el texto."
  fr: "L'article de Wikipédia en anglais consacré à Mustafa Abdul Jalil, utilisé uniquement pour les informations le concernant, indique sa naissance le 6 novembre 1952 à Beida, l'obtention de son diplôme en charia et en droit à l'Université de Libye en 1975, sa nomination comme juge à partir de 1978, son poste de secrétaire à la Justice sous Kadhafi (2007-2011), sa démission le 21 février 2011 et sa présidence du Conseil national de transition du 5 mars 2011 au 8 août 2012, période durant laquelle il était le chef d'État de facto de la Libye. L'article ne mentionne pas sa religion."
  ur: "مصطفی عبدالجلیل پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 6 نومبر 1952 کو بیدا میں ان کی پیدائش، لیبیا یونیورسٹی سے شریعت اور قانون میں ان کی 1975 میں گریجویشن، 1978 سے ان کی جج شپ، قذافی کے سیکرٹری برائے انصاف (2007-2011) کے طور پر ان کی خدمات اور 21 فروری 2011 کو ان کا استعفیٰ، اور 21 مارچ 2011 کو قومی عبوری کونسل کی سربراہی سے 21 مارچ کو ان کی تبدیلی 2012، جب وہ لیبیا کے اصل سربراہ مملکت تھے۔ اس کے متن میں اس کے مذہب کا کوئی بیان نہیں ہے۔"
  tr: "Mustafa Abdul Jalil hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 6 Kasım 1952'de Kazablanka'da doğduğunu, 1975'te Libya Üniversitesi'nden Şeriat ve Hukuk alanında mezun olduğunu, 1978'den beri yargı pozisyonunu, Kaddafi rejimi döneminde Genel Halk Adalet Komitesi sekreterliğini (2007–2011), 21 Şubat 2011'deki istifasını ve 5 Mart 2011'den 8 Ağustos 2012'ye kadar Ulusal Geçiş Konseyi başkanlığını ve fiili olarak Libya Cumhurbaşkanı olduğu dönemi belirtmektedir. Metinde dini belirtilmemiştir."
  id: "Artikel Wikipedia bahasa Inggris tentang Mustafa Abdul Jalil; digunakan hanya untuk fakta entitas. Artikel tersebut menyebutkan kelahirannya pada 6 November 1952 di Casablanca, kelulusannya pada tahun 1975 dalam bidang Syariah dan Hukum dari Universitas Libya, posisi yudisialnya sejak 1978, sekretariat Komite Umum Rakyat untuk Kehakiman di bawah rezim Gaddafi (2007–2011), pengunduran dirinya pada 21 Februari 2011, dan kepresidenannya di Dewan Transisi Nasional dari 5 Maret 2011 hingga 8 Agustus 2012, saat ia menjabat sebagai Presiden Libya secara de facto. Agamanya tidak disebutkan dalam teks."
