  ur: "صوفی احکامات کی تشکیل اور اس کے اثرات کا کلاسک علمی مطالعہ؛ نقشبندیہ اور اس کے وسطی ایشیائی، عثمانی اور ہندوستانی خطوط کا علاج کرتا ہے۔"
