reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It gives his birth on 26 March 1991 in Queens, New York City, to Egyptian immigrant parents, his upbringing in Rutherford, New Jersey, in a Muslim household observing Islamic holidays, and states that he 'remains a practicing Muslim' — practice and upbringing, which name no school. Career coverage includes See Dad Run (2012), the Hulu series Ramy (debuted 19 April 2019), for which he won the Golden Globe for Best Actor – Television Series Musical or Comedy in January 2020 and a Peabody Award, with two Emmy nominations; the HBO special Ramy Youssef: Feelings (2019); co-creating Mo (Netflix, 2022) with Mo Amer; the More Feelings tour (2023) whose final nights raised funds for Gaza through ANERA; his first major film role in Poor Things (2023); hosting Saturday Night Live on 30 March 2024, where his monologue prayed for God to free the people of Palestine and the hostages; the Netflix partnership through his company Cairo Cowboy (2024); co-creating #1 Happy Family USA (2025); and his 2025 honorary doctorate from Rutgers. It records his 2022 marriage to a Saudi visual artist whose details he does not disclose."
