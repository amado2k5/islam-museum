summary:
  en: "The Ministry of Education's curriculum policy for this subject, as served on the Ministry's curriculum site; the museum's course records quote its expectations by code, within the 40-word limit, and map lessons to them (mapped by the museum, not endorsed by the Ministry)."
  ar: "سياسة المنهاج الصادرة عن وزارة التعليم في أونتاريو لهذه المادة، كما تُنشر في موقع المنهاج الوزاري؛ تقتبس سجلات المقررات في المتحف توقعاتها برموزها في حدود أربعين كلمة وتربط الدروس بها، والربط من عمل المتحف لا بإقرار من الوزارة."
  ur: "اس مضمون کے لیے وزارتِ تعلیم اونٹاریو کی نصابی پالیسی، جیسا کہ وزارت کی نصابی ویب سائٹ پر شائع ہے؛ میوزیم کے کورس ریکارڈ اس کی توقعات کو ان کے کوڈ کے ساتھ چالیس الفاظ کی حد میں نقل کرتے اور اسباق کو ان سے جوڑتے ہیں، اور یہ ربط میوزیم کا کام ہے، وزارت کی توثیق نہیں۔"
  es: "La política curricular del Ministerio de Educación para esta materia, publicada en el sitio web del Ministerio, y los registros del curso del museo citan sus expectativas mediante un código, dentro del límite de 40 palabras, y asignan lecciones a ellas (asignación realizada por el museo, no respaldada por el Ministerio)."
  fr: "La politique du ministère de l'Éducation concernant ce sujet, telle qu'elle figure sur le site web du ministère consacré aux programmes scolaires; les dossiers de cours du musée citent ses attentes par code, dans la limite de 40 mots, et y associent des leçons (association réalisée par le musée, non approuvée par le ministère)."
  tr: "Ontario Eğitim Bakanlığı tarafından bu konu için yayımlanan müfredat politikası, Bakanlık Müfredatı web sitesinde yayımlanarak, müzenin ders kayıtlarını sembolleriyle yaklaşık kırk kelimeyle alıntılıyor ve dersleri bunlara bağlıyor, bakanlık onayı olmadan müzenin çalışmalarına bağlıyor."
  id: "Kebijakan kurikulum yang dikeluarkan oleh Kementerian Pendidikan Ontario untuk mata pelajaran ini, sebagaimana dipublikasikan di situs web Kurikulum Menteri, mengutip catatan kursus museum beserta simbolnya dalam sekitar empat puluh kata dan mengaitkan pelajaran ke catatan tersebut, mengaitkannya dengan pekerjaan museum, bukan dengan persetujuan kementerian."
