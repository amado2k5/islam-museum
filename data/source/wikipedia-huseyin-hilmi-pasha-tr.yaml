summary:
  ar: "مقالة ويكيبيديا التركية عن حسين حلمي باشا؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في سبتمبر 1855 بمدللي، وصدارتيه سنة 1909، ووفاته في أبريل 1923 بفيينا مستندة إلى موسوعة وقف الديانة التركي الإسلامية."
  en: "Turkish Wikipedia article on Hüseyin Hilmi Paşa; used for entity facts only. It gives his birth in September 1855 at Midilli (Lesbos), his two grand vizierates of 1909, and his death in April 1923 at Vienna, citing the TDV İslâm Ansiklopedisi."
  es: "Artículo de la Wikipedia en turco sobre Hüseyin Hilmi Paşa; utilizado únicamente para datos sobre la persona. Indica su nacimiento en septiembre de 1855 en Midilli (Lesbos), sus dos grandes visiratos de 1909 y su muerte en abril de 1923 en Viena, citando la TDV İslâm Ansiklopedisi."
  fr: "Article de Wikipédia en turc sur Hüseyin Hilmi Paşa; utilisé uniquement pour les informations sur l’entité. Il indique sa naissance en septembre 1855 à Midilli (Lesbos), ses deux grands vizirats de 1909 et sa mort en avril 1923 à Vienne, citant le TDV İslâm Ansiklopedisi."
  ur: "Hüseyin Hilmi Paşa پر ترکی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ستمبر 1855 میں Midilli (Lesbos) میں اس کی پیدائش، 1909 کے اس کے دو عظیم وزیریٹس، اور اپریل 1923 میں ویانا میں اس کی موت، TDV İslâm Ansiklopedisi کے حوالے سے۔"
  tr: "Hüseyin Helmi Paşa hakkında Türkçe Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Türk İslam Dini Vakfı Ansiklopedisi'ne dayanarak, Eylül 1855'te Mudallali'de doğduğu, iki başkanının 1909'da olduğu ve Nisan 1923'te Viyana'da öldüğü belirtilmiştir."
  id: "Artikel Wikipedia Turki tentang Hüseyin Helmi Pasha; digunakan hanya untuk fakta entitas. Ia dinyatakan lahir pada September 1855 di Mudallali, dua presidennya pada tahun 1909, dan wafat pada April 1923 di Wina, berdasarkan Ensiklopedia Wakaf Agama Islam Turki."
