summary:
  ar: "مقالة ويكيبيديا الأردية عن حمد بن خليفة آل ثاني، وهي مختصرة؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في الدوحة في 1 يناير 1952 وحكمه من 1995 إلى 2013 ووفاته في 12 يوليو 2026، ويقرأ حقل الدين في صندوق معلوماتها «سنی» ⁦(سنّي)⁩. حقل تاريخ الوفاة في الصندوق فارغ رغم أن متنها يذكر الوفاة."
  en: "Urdu Wikipedia article on Hamad bin Khalifa Al Thani, a short stub; used for entity facts only. It gives his birth in Doha on 1 January 1952, his reign from 1995 to 2013 and his death on 12 July 2026 in its lead. Its infobox religion field reads 'Sunni' — a structured value in a stub, the only religion statement in any of his articles. The infobox death-date field was left empty although the text records the death."
  es: "Artículo de Wikipedia en urdu sobre Hamad bin Khalifa Al Thani, un breve esbozo; utilizado únicamente para datos sobre la entidad. En su introducción, indica su nacimiento en Doha el 1 de enero de 1952, su reinado de 1995 a 2013 y su fallecimiento el 12 de julio de 2026. El campo de religión de su ficha informativa muestra «Sunita» —un valor estructurado en un esbozo, la única mención de religión en todos sus artículos—. El campo de fecha de fallecimiento de la ficha informativa se dejó vacío, aunque el texto registra la fecha de su muerte."
  fr: "Article Wikipédia en ourdou sur Hamad bin Khalifa Al Thani, une ébauche succincte; utilisée uniquement pour les informations biographiques. Son introduction indique sa naissance à Doha le 1er janvier 1952, son règne de 1995 à 2013 et son décès le 12 juillet 2026. Le champ « religion » de l’infobox indique « sunnite » — une valeur structurée dans une ébauche, la seule mention de religion dans tous ses articles. Le champ « date de décès » de l’infobox est vide, bien que le texte fasse état du décès."
  ur: "حمد بن خلیفہ الثانی پر اردو ویکیپیڈیا کا مضمون، ایک چھوٹا سا سٹب؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ یکم جنوری 1952 کو دوحہ میں ان کی پیدائش، 1995 سے 2013 تک ان کا دور حکومت اور اس کی قیادت میں 12 جولائی 2026 کو ان کی موت ہوئی۔ اس کا انفو باکس مذہب کا فیلڈ 'سنی' پڑھتا ہے - ایک اسٹب میں ایک ساختی قدر، اس کے کسی بھی مضمون میں واحد مذہب کا بیان۔ انفو باکس کی موت کی تاریخ کا فیلڈ خالی چھوڑ دیا گیا تھا حالانکہ متن موت کو ریکارڈ کرتا ہے۔"
  tr: "Hamad bin Halife Al Thani hakkında Urduca Wikipedia makalesi, özüdür; yalnızca varlığın gerçekleri için kullanılır. Kutuda 1 Ocak 1952'de Doha'da doğduğu, 1995-2013 yılları arasındaki saltanatı ve 12 Temmuz 2026'daki ölümü belirtilir ve bilgi kutusunda din alanı \"Sünni\" (Sünni) olarak okunur. Kutudaki ölüm tarihi boştur, ancak ölüm anı belirtilmiştir."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang Hamad bin Khalifa Al Thani, yang ringkas; digunakan hanya untuk fakta entitas. Artikel tersebut menyebutkan kelahirannya di Doha pada 1 Januari 1952, pemerintahannya dari 1995 hingga 2013, dan kematiannya pada 12 Juli 2026, serta menuliskan bidang agama di infobox sebagai \"Sunni\" (Sunni). Kolom tanggal kematian di kotak itu kosong meskipun menyebutkan kematian."
