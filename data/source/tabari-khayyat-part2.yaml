  id: "Bagian kedua dari Sejarah Al-Tabari dalam edisi Perpustakaan Khayyat di Beirut, salinan hasil scan dari Bibliotheca Alexandrina (AAlexandrina-224135), membahas berita tentang almarhum Umayyah dan gubernur Khorasan. Referensi di sini digunakan bersama dengan nomor halaman survei."
