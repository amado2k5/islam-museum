summary:
  ar: "مقالة ويكيبيديا العربية «عبد الله هارون ⁦(سياسي)⁩»؛ تُستخدم لوقائع الكيان فقط. مختصرة: تذكر أنه سياسي هندي بريطاني أسهم في تطوير دور المسلمين في المجالات الاقتصادية والتعليمية والاجتماعية والسياسية، وأنه أيّد قرار لاهور سنة 1940 باسم مسلمي السند، وتوفي في كراتشي في 27 أبريل 1942، وتصنفه في «شعب ميمون» وقادة حركة باكستان."
  en: "Arabic Wikipedia article 'Abdullah Haroon (politician)'; used for entity facts only. A short article: it describes him as a British Indian politician who developed the role of Muslims in economic, educational, social and political fields, records his endorsement of the 1940 Lahore Resolution on behalf of the Muslims of Sindh, gives his death at Karachi on 27 April 1942, and files him among the Memon people and the leaders of the Pakistan Movement."
  es: "Artículo en árabe de la Wikipedia «Abdullah Haroon (político)»; utilizado únicamente para datos sobre la persona. Un breve artículo que lo describe como un político británico de origen indio que impulsó el papel de los musulmanes en los ámbitos económico, educativo, social y político; recoge su apoyo a la Resolución de Lahore de 1940 en nombre de los musulmanes de Sindh; indica su fallecimiento en Karachi el 27 de abril de 1942; y lo sitúa entre el pueblo Memon y los líderes del Movimiento de Pakistán."
  fr: "Article de Wikipédia en arabe intitulé « Abdullah Haroon (homme politique) »; utilisé uniquement à des fins d'information. Cet article concis le décrit comme un homme politique britannique d'origine indienne qui a œuvré pour le développement du rôle des musulmans dans les domaines économique, éducatif, social et politique. Il relate son soutien à la résolution de Lahore de 1940 au nom des musulmans du Sindh, indique son décès à Karachi le 27 avril 1942 et le classe parmi les membres du mouvement Memon et les figures de proue du mouvement pour le Pakistan."
