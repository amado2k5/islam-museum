  ar: "مقالة ويكيبيديا العربية «عبد الله هارون (سياسي)»؛ تُستخدم لوقائع الكيان فقط. مختصرة: تذكر أنه سياسي هندي بريطاني أسهم في تطوير دور المسلمين في المجالات الاقتصادية والتعليمية والاجتماعية والسياسية، وأنه أيّد قرار لاهور سنة 1940 باسم مسلمي السند، وتوفي في كراتشي في 27 أبريل 1942، وتصنفه في «شعب ميمون» وقادة حركة باكستان."
  en: "Arabic Wikipedia article 'Abdullah Haroon (politician)'; used for entity facts only. A short article: it describes him as a British Indian politician who developed the role of Muslims in economic, educational, social and political fields, records his endorsement of the 1940 Lahore Resolution on behalf of the Muslims of Sindh, gives his death at Karachi on 27 April 1942, and files him among the Memon people and the leaders of the Pakistan Movement."
