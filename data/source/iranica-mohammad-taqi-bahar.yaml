summary:
  ar: "مدخل موسوعة إيرانيكا «بهار، محمدتقي ملك الشعراء» بقلم م. ب. لورين وج. متيني؛ يُستخدم لوقائع الكيان. يعطي سنواته 1265–1330 هـ.ش (1886–1951) ويروي تتلمذه على أبيه وأديب النيسابوري وعمله شاعرًا لضريح مشهد وصحفه الدستورية وسجنه ونفيه وعودته من علاج سويسرا ليموت في أبريل 1951 ودفنه في ظهيرالدولة."
  en: "Encyclopaedia Iranica entry 'Bahar, Mohammad-Taqi Malek al-Sho'ara' by M. B. Loraine and J. Matini; used for entity facts. It gives his years as 1265-1330 SH (1886-1951) and recounts his schooling under his father and Adib Nishapuri, his post as poet of the Mashhad shrine, his constitutionalist papers, his imprisonment and exile, and his return from Swiss treatment to die in April 1951, buried at Zahir-od-dowleh."
  es: "Entrada de la Enciclopedia Iranica 'Bahar, Mohammad-Taqi Malek al-Sho'ara', de MB Loraine y J. Matini; utilizada para datos sobre la persona. Indica que vivió entre 1265 y 1330 SH (1886-1951) y relata su educación con su padre y Adib Nishapuri, su cargo como poeta del santuario de Mashhad, sus escritos constitucionalistas, su encarcelamiento y exilio, y su regreso tras recibir tratamiento en Suiza para morir en abril de 1951, siendo enterrado en Zahir-od-dowleh."
  fr: "L'article « Bahar, Mohammad-Taqi Malek al-Sho'ara » de l'Encyclopaedia Iranica, rédigé par MB Loraine et J. Matini, est utilisé pour les informations relatives à cette personne. Il indique ses années de naissance et de décès (1265-1330 SH, soit 1886-1951) et relate son éducation auprès de son père et d'Adib Nishapuri, son poste de poète du sanctuaire de Mashhad, ses écrits constitutionnalistes, son emprisonnement et son exil, ainsi que son retour de Suisse où il avait reçu des soins. Il décède en avril 1951 et est inhumé à Zahir-od-dowleh."
  ur: "انسائیکلو پیڈیا ایرانیکا اندراج 'بہار، محمد تقی ملک الشعراء' از ایم بی لورین اور جے متینی؛ ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کے سال 1265-1330 SH (1886-1951) کے طور پر بیان کیے گئے ہیں اور ان کے والد اور ادیب نیشاپوری کے تحت ان کی تعلیم، مشہد مزار کے شاعر کے طور پر ان کا عہدہ، ان کے آئین سازی کے کاغذات، ان کی قید اور جلاوطنی، اور اپریل 1951 میں سوئس علاج سے واپسی کے بعد ظہیر دفن کے بارے میں بتایا گیا ہے۔"
  tr: "Iranica Ansiklopedisi'ne M. B. Loreen ve J. Matini tarafından yazılmış \"Bahar, Muhammad Taqi, Şairlerin Kralı\" girişi; varlığın olayları için kullanılmıştır. 1265–1330 Hicri (1886–1951) yıllarını verir ve babası ile Nişapur yazarı yanında aldığı rehberliğini, Meşhed türbesi için şair olarak yaptığı çalışmaları ve anayasal gazetelerini, hapsedilmesini, sürgününü, İsviçre'deki tedaviden dönüşünü ve Nisan 1951'deki ölümü ile Dahir al-Dawla'da defnedilmesini anlatır."
  id: "Entri ke Ensiklopedia Iranica \"Bahar, Muhammad Taqi, Raja Para Penyair\" oleh M. B. Loreen dan J. Matini; digunakan untuk peristiwa entitas tersebut. Ia mencantumkan tahun-tahunnya 1265–1330 H (1886–1951) dan menceritakan bimbingannya di bawah ayahnya dan penulis Nishapur, karyanya sebagai penyair untuk mausoleum Mashhad dan surat kabar konstitusionalnya, penahanan, pengasingan, kembali dari perawatan di Swiss, serta kematiannya pada April 1951 dan pemakamannya di Dahir al-Dawla."
title: "BAHĀR, MOḤAMMAD-TAQĪ"
