summary:
  ar: "مدخل موسوعة إيرانيكا «بهار، محمدتقي ملك الشعراء» بقلم م. ب. لورين وج. متيني؛ يُستخدم لوقائع الكيان. يعطي سنواته 1265–1330 هـ.ش (1886–1951) ويروي تتلمذه على أبيه وأديب النيسابوري وعمله شاعرًا لضريح مشهد وصحفه الدستورية وسجنه ونفيه وعودته من علاج سويسرا ليموت في أبريل 1951 ودفنه في ظهيرالدولة."
  en: "Encyclopaedia Iranica entry 'Bahar, Mohammad-Taqi Malek al-Sho'ara' by M. B. Loraine and J. Matini; used for entity facts. It gives his years as 1265-1330 SH (1886-1951) and recounts his schooling under his father and Adib Nishapuri, his post as poet of the Mashhad shrine, his constitutionalist papers, his imprisonment and exile, and his return from Swiss treatment to die in April 1951, buried at Zahir-od-dowleh."
