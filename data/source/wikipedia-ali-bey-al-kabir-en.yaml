reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It gives his life as 1728 to 8 May 1773, his birth in the Principality of Abkhazia, his kidnapping at about thirteen and sale in Cairo in 1741, his purchase for Ibrahim Ketkhuda in 1743, his service as amir al-hajj in 1753 or 1754 — when he earned the Turkish nickname Balut Kapan, 'cloud-catcher', for his attacks on the Bedouin — his terms as shaykh al-balad, his practical bid for independence from 1769, and his death after Abu al-Dahab's betrayal; on his parentage it reports the Abkhazian origin of Pleshcheev and Fındıklılı Efendi, Lusignan's supposed Greek Orthodox priest father David via the Encyclopaedia of Islam, and Mikaberidze's Georgian Orthodox priest. It names no legal school for him. Checked 1 November 2026."
