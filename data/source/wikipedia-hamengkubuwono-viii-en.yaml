  ar: "مقالة ويكيبيديا الإنجليزية عن هامينغكوبوونو الثامن؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 3 آذار 1880 بيوجياكارتا باسم غوستي رادن ماس سوجادي، وتولّيه العرش في 8 شباط 1921 ووفاته في 22 تشرين الأول 1939، ودعمه المبكر لأحمد دحلان في تأسيس المحمدية، وألقابه الكاملة."
  en: "English Wikipedia article on Hamengkubuwono VIII; used for entity facts only. It gives his birth on 3 March 1880 at Yogyakarta under the name Gusti Raden Mas Sujadi, his accession on 8 February 1921 and his death on 22 October 1939, his early support for Ahmad Dahlan in the formation of Muhammadiyah, and his full titles."
