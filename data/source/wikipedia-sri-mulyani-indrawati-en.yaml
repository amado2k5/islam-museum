  ar: "مقالة ويكيبيديا الإنجليزية عن سري مولياني إندراواتي، المولودة في 26 آب 1962 في تانجونغ كارانغ (بندر لامبونغ)، وزيرة المالية الإندونيسية في عهد ثلاثة رؤساء؛ تذكر دراستها في جامعة إندونيسيا وجامعة إلينوي وفترتيها الوزاريتين وإدارتها في البنك الدولي وإنقاذ بنك سنتشري وإقالتها في 8 أيلول 2025."
  en: "English Wikipedia article on Sri Mulyani Indrawati, born 26 August 1962 in Tanjung Karang (Bandar Lampung), Indonesia's finance minister under three presidents; it records her studies at the University of Indonesia and the University of Illinois, her two ministerial tenures, her World Bank managing directorship, the Bank Century bailout, and her dismissal on 8 September 2025."
