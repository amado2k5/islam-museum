summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سري مولياني إندراواتي، المولودة في 26 آب 1962 في تانجونغ كارانغ ⁦(بندر لامبونغ)⁩، وزيرة المالية الإندونيسية في عهد ثلاثة رؤساء؛ تذكر دراستها في جامعة إندونيسيا وجامعة إلينوي وفترتيها الوزاريتين وإدارتها في البنك الدولي وإنقاذ بنك سنتشري وإقالتها في 8 أيلول 2025."
  en: "English Wikipedia article on Sri Mulyani Indrawati, born 26 August 1962 in Tanjung Karang (Bandar Lampung), Indonesia's finance minister under three presidents; it records her studies at the University of Indonesia and the University of Illinois, her two ministerial tenures, her World Bank managing directorship, the Bank Century bailout, and her dismissal on 8 September 2025."
  es: "Artículo de la Wikipedia en inglés sobre Sri Mulyani Indrawati, nacida el 26 de agosto de 1962 en Tanjung Karang (Bandar Lampung), ministra de finanzas de Indonesia bajo tres presidentes; en él se recogen sus estudios en la Universidad de Indonesia y la Universidad de Illinois, sus dos mandatos ministeriales, su cargo como directora gerente del Banco Mundial, el rescate del Banco Century y su destitución el 8 de septiembre de 2025."
  fr: "L'article de Wikipédia en anglais sur Sri Mulyani Indrawati, née le 26 août 1962 à Tanjung Karang (Bandar Lampung), ministre des Finances de l'Indonésie sous trois présidents; il relate ses études à l'Université d'Indonésie et à l'Université de l'Illinois, ses deux mandats ministériels, son poste de directrice générale de la Banque mondiale, le sauvetage de la Banque du siècle et son limogeage le 8 septembre 2025."
  ur: "سری ملیانی اندراوتی پر انگریزی ویکیپیڈیا کا مضمون، جن کی پیدائش 26 اگست 1962 کو تنجنگ کارنگ ⁦(بندر لامپنگ)⁩ میں ہوئی، تین صدور کے تحت انڈونیشیا کے وزیر خزانہ؛ اس میں یونیورسٹی آف انڈونیشیا اور یونیورسٹی آف الینوائے میں اس کی تعلیم، اس کے دو وزارتی ادوار، اس کی ورلڈ بینک کی منیجنگ ڈائریکٹر شپ، بینک سنچری بیل آؤٹ، اور 8 ستمبر 2025 کو اس کی برطرفی کو ریکارڈ کیا گیا ہے۔"
