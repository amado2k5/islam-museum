summary:
  ar: "مقالة ويكيبيديا العربية عن ألبوم «بدونك»؛ لوقائع الكيان فقط: موقف سامي يوسف، وموقف أوايكننغ التي واصلت عرض الألبوم وقالت إنه كامل وإن عقده معها لخمسة ألبومات، وإبطال العقد، وقائمة الأغاني؛ تستند إلى بيانات الطرفين."
  en: "Arabic Wikipedia article on the album Without You; entity facts only: Sami Yusuf's position, the position of Awakening, which kept offering the album and said it was complete and that he was signed to it for five albums, the voiding of the contract, and the track list; it cites both sides' statements."
  es: "Artículo de Wikipedia en árabe sobre el álbum Without You; solo datos de la entidad: la postura de Sami Yusuf, la postura de Awakening, que siguió ofreciendo el álbum y dijo que estaba completo y que él había firmado un contrato para cinco álbumes, la anulación del contrato y la lista de canciones; cita las declaraciones de ambas partes."
  fr: "Article de Wikipédia en arabe sur l'album Without You; faits concernant uniquement l'entité: la position de Sami Yusuf, la position d'Awakening, qui a continué à proposer l'album en affirmant qu'il était terminé et qu'il avait signé pour cinq albums, l'annulation du contrat et la liste des titres; il cite les déclarations des deux parties."
  ur: "آپ کے بغیر البم پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق: سمیع یوسف کی پوزیشن، بیداری کی پوزیشن، جو البم پیش کرتا رہا اور کہا کہ یہ مکمل ہے اور اسے پانچ البمز، معاہدے کی منسوخی، اور ٹریک لسٹ کے لیے سائن کیا گیا ہے۔ یہ دونوں فریقوں کے بیانات کا حوالہ دیتا ہے۔"
  tr: "\"Without You\" albümüyle ilgili Arapça Wikipedia makalesi; sadece gerçekler: Sami Youssef'in tutumu ve Awakening'in tutumu, albümü sunmaya devam etti ve albümün tamamlandığını söyledi, sözleşmesi beş albümlük olmasına rağmen iptal edildi ve parça listesi her iki tarafın ifadelerine dayanıyor."
  id: "Artikel Wikipedia Arab tentang album \"Without You\"; hanya untuk fakta entitas: sikap Sami Youssef dan posisi Awakening, yang terus mempresentasikan album dan mengatakan bahwa album itu lengkap, meskipun kontraknya dengan mereka adalah lima album, kontrak dibatalkan, dan daftar lagu didasarkan pada pernyataan kedua belah pihak."
