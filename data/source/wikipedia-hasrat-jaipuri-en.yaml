  ar: "مقالة ويكيبيديا الإنجليزية عن حسرت جايبوري؛ تُستخدم لوقائع الكيان فقط. توثّق ميلاده في جايبور سنة 1922 باسم إقبال حسين، وعمله كناقل أغانٍ في أفلام راج كابور حتى 1971، وجائزتي فيلم فير، ووفاته في مومباي سنة 1999."
  en: "English Wikipedia article on Hasrat Jaipuri; used for entity facts only. It records his birth in Jaipur in 1922 as Iqbal Husain, his years as lyricist for Raj Kapoor's films until 1971, his two Filmfare Awards for Best Lyricist, and his death in Mumbai in 1999."
