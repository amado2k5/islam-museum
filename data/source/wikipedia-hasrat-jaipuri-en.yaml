reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 1 November 2026. The lead gives his birth as Iqbal Hussain on 15 April 1922 and his death on 17 September 1999; the early-life section records his Urdu and Persian education from his maternal grandfather, the poet Fida Husain 'Fida', his work as a Bombay bus conductor from 1940, his discovery by Prithviraj Kapoor at a mushaira, and his first recorded song for Barsaat (1949); the career section covers the Raj Kapoor films to 1971, Ram Teri Ganga Maili (1985) and Henna (1991); the awards list gives the Filmfare Best Lyricist awards of 1967 (for Suraj) and 1972 (for Andaz). On religion the article names no school or affiliation: its only religious content is Jaipuri's quoted remark, about his youthful love for a Hindu neighbour, that a Muslim boy need not fall in love only with a Muslim girl — his Muslim identity is documented, his school is not."
