summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن عبد الوحيد هاشم؛ تُستخدم لوقائع الكيان فقط. تتفق مع الإنجليزية في الميلاد والوفاة والأبوة، وتفصّل فترات وزارته الثلاث ورئاسته العامة لنهضة العلماء من 1951 إلى 1953، وتعطي اسم زوجته شليحة منوّرة."
  en: "Indonesian Wikipedia article on Abdul Wahid Hasyim; used for entity facts only. It agrees with the English article on his birth, death and parentage, details his three terms as Minister of Religious Affairs and his general chairmanship of Nahdlatul Ulama from 1951 to 1953, and names his wife as Sholichah Munawwaroh."
  es: "Artículo de la Wikipedia en indonesio sobre Abdul Wahid Hasyim; utilizado únicamente para datos sobre la persona. Coincide con el artículo en inglés sobre su nacimiento, muerte y filiación, detalla sus tres mandatos como Ministro de Asuntos Religiosos y su presidencia general de Nahdlatul Ulama de 1951 a 1953, e identifica a su esposa como Sholichah Munawwaroh."
  fr: "Article de Wikipédia indonésien sur Abdul Wahid Hasyim; utilisé uniquement pour les informations relatives à l’entité. Il concorde avec l’article anglais concernant sa naissance, son décès et sa filiation, détaille ses trois mandats de ministre des Affaires religieuses et sa présidence de Nahdlatul Ulama de 1951 à 1953, et nomme son épouse Sholichah Munawwaroh."
  ur: "عبدالواحد ہاسیم پر انڈونیشیائی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ان کی پیدائش، وفات اور ولدیت سے متعلق انگریزی مضمون سے اتفاق کرتا ہے، ان کے مذہبی امور کے وزیر کی حیثیت سے ان کی تین شرائط اور 1951 سے 1953 تک نہدلۃ العلماء کی جنرل چیئرمین شپ کی تفصیلات بیان کرتا ہے، اور ان کی اہلیہ کا نام شولیچہ منورہ رکھا ہے۔"
