reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision, fetched by revision id through the MediaWiki API with the returned id asserted equal. Its lead cites the National Information and Communication Agency's 2001 volume on Abdurrahman Wahid (p. 6) for his parentage and his later leadership of Nahdlatul Ulama. Its detailed ministerial terms differ in detail from the English article's infobox; the lead-level statement (1945, and 1949–1952) on which both agree is what is recorded. The article makes no statement of his school of Islam."
