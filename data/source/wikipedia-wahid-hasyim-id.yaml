  ar: "مقالة ويكيبيديا الإندونيسية عن عبد الوحيد هاشم؛ تُستخدم لوقائع الكيان فقط. تتفق مع الإنجليزية في الميلاد والوفاة والأبوة، وتفصّل فترات وزارته الثلاث ورئاسته العامة لنهضة العلماء من 1951 إلى 1953، وتعطي اسم زوجته شليحة منوّرة."
  en: "Indonesian Wikipedia article on Abdul Wahid Hasyim; used for entity facts only. It agrees with the English article on his birth, death and parentage, details his three terms as Minister of Religious Affairs and his general chairmanship of Nahdlatul Ulama from 1951 to 1953, and names his wife as Sholichah Munawwaroh."
