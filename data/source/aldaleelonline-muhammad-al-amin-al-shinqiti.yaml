summary:
  ar: "صفحة ترجمة محمد الأمين الشنقيطي (ت. 1393هـ) صاحب «أضواء البيان» في موقع الدليل؛ تذكر نشأته في موريتانيا ومناصبه في التدريس والقضاء ووفاته بمكة، وتنقل عن ابنه عبد الله بن محمد الأمين الشنقيطي رواية عن والده: أنه كان ينهاهم عن أكل الحوامض لأن لها أثرًا في الحفظ."
  en: "The biography page of Muhammad al-Amin al-Shinqiti (d. 1393 AH), author of 'Adwa al-Bayan', on the Al-Daleel Online site. It records his upbringing in Mauritania, his teaching and judgeship posts and his death in Makkah, and quotes his son Abdullah ibn Muhammad al-Amin al-Shanqiti relating of his father that he used to forbid them sour foods because they affect memorisation."
