summary:
  ar: "صفحة ترجمة محمد الأمين الشنقيطي ⁦(ت. 1393هـ)⁩ صاحب «أضواء البيان» في موقع الدليل؛ تذكر نشأته في موريتانيا ومناصبه في التدريس والقضاء ووفاته بمكة، وتنقل عن ابنه عبد الله بن محمد الأمين الشنقيطي رواية عن والده: أنه كان ينهاهم عن أكل الحوامض لأن لها أثرًا في الحفظ."
  en: "The biography page of Muhammad al-Amin al-Shinqiti (d. 1393 AH), author of 'Adwa al-Bayan', on the Al-Daleel Online site. It records his upbringing in Mauritania, his teaching and judgeship posts and his death in Makkah, and quotes his son Abdullah ibn Muhammad al-Amin al-Shanqiti relating of his father that he used to forbid them sour foods because they affect memorisation."
  es: "La página biográfica de Muhammad al-Amin al-Shinqiti (fallecido en 1393 AH), autor de 'Adwa al-Bayan', en el sitio web Al-Daleel Online, narra su infancia en Mauritania, sus cargos como profesor y juez, y su fallecimiento en La Meca. También cita a su hijo Abdullah ibn Muhammad al-Amin al-Shanqiti, quien relata que su padre solía prohibirles los alimentos ácidos porque afectaban la memorización."
  fr: "La page biographique de Muhammad al-Amin al-Shinqiti (décédé en 1393 AH), auteur d’« Adwa al-Bayan », sur le site Al-Daleel Online, retrace son enfance en Mauritanie, ses fonctions d’enseignant et de juge, ainsi que sa mort à La Mecque. Elle cite également son fils, Abdullah ibn Muhammad al-Amin al-Shanqiti, qui raconte que son père leur interdisait les aliments acides, car ils nuisaient à la mémorisation."
  ur: "الدلیل آن لائن سائٹ پر 'عدوی البیان' کے مصنف محمد الامین الشنقیتی ⁦(متوفی 1393ھ)⁩ کی سوانح عمری کا صفحہ۔ اس میں موریطانیہ میں ان کی پرورش، ان کی تدریس اور قاضی کے عہدوں اور مکہ مکرمہ میں ان کی وفات کو درج کیا گیا ہے، اور ان کے بیٹے عبداللہ بن محمد الامین الشانقیتی کا اپنے والد کے حوالے سے نقل کیا گیا ہے کہ وہ انہیں کھٹے کھانے سے منع کرتے تھے کیونکہ ان سے حافظہ متاثر ہوتا ہے۔"
