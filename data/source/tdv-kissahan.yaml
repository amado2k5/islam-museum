summary:
  ar: "مدخل «قصّة خوان» في موسوعة TDV الإسلامية لإبراهيم ألطونل: راوي القصص في البيوت والقصور، وألفاظه المقارنة ⁦(قصّاص ونقّال وروزه خوان وشاهنامه خوان ومدّاح)⁩، ومن القصص الديني في المساجد إلى التسلية الشعبية."
  en: "The TDV İslâm Ansiklopedisi entry on kissahan by İbrahim Altunel: the tale-teller of the markets, mansions and palaces, his neighbouring titles (kussâs, nakkāl, rûzehan, şahnâmehan, meddâh), and the passage from religious storytelling in the mosques to popular entertainment."
  es: "La entrada de TDV İslâm Ansiklopedisi sobre kissahan de İbrahim Altunel: el narrador de cuentos de los mercados, mansiones y palacios, sus títulos vecinos (kussâs, nakkāl, rûzehan, şahnâmehan, meddâh) y el paso de la narración religiosa en las mezquitas al entretenimiento popular."
  fr: "L'entrée TDV İslâm Ansiklopedisi sur kissahan par İbrahim Altunel: le conteur des marchés, des demeures et des palais, ses titres voisins (kussâs, nakkāl, rûzehan, şahnâmehan, meddâh), et le passage des récits religieux dans les mosquées au divertissement populaire."
  ur: "کسہان پر TDV İslâm Ansiklopedisi entry by İbrahim Altunel: بازاروں، حویلیوں اور محلوں کا کہانی سنانے والا، اس کے پڑوسی عنوانات (kussâs, nakkāl, rûzehan, şahnâmehan, meddâh)، اور مذہبی کہانی سنانے سے لے کر مسجد کی تفریح میں مقبولیت تک۔"
  tr: "TDV İslami Ansiklopedisi'nde İbrahim Altounal'ın \"Juan'ın Hikayesi\" girişi: evlerde ve saraylarda anlatıcı, karşılaştırmalı terimleri (Qisa, Naqal, Roza Khawan, Shahnameh Khawan ve övgüler) camilerdeki dini hikayelerden popüler eğlenceye kadar uzanır."
  id: "Entri \"Kisah Juan\" dalam Ensiklopedia Islam TDV oleh Ibrahim Altounal: narator cerita di rumah dan istana, serta istilah perbandingannya (Qisas, Naqal, Roza Khawan, Shahnameh Khawan, dan pujian), mulai dari cerita keagamaan di masjid hingga hiburan populer."
