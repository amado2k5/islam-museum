summary:
  ar: "مقالة ويكيبيديا العربية الموسّعة «مسلم الوائلي ⁦(رادود حسيني)⁩»، كما قُرئت كاملة في 24 أكتوبر 2026؛ تُستخدم لوقائع الكيان فقط، وتوجد للمقال نسخة أقصر بعنوان «مسلم الوائلي منشد» تستند إلى سيرته المنشورة."
  en: "The fuller Arabic Wikipedia article 'Muslim al-Waeli (Husayni radud)', read in full on 24 October 2026; used for entity facts only. Arabic Wikipedia also carries a shorter article, 'Muslim al-Waeli, munshid', drawn from his published biography."
  es: "El artículo completo de Wikipedia en árabe 'Muslim al-Waeli (Husayni radud)', leído en su totalidad el 24 de octubre de 2026; Se utiliza únicamente para hechos de entidades. La Wikipedia en árabe también incluye un artículo más breve, 'Muslim al-Waeli, munshid', extraído de su biografía publicada."
  fr: "L'article Wikipédia arabe plus complet « Muslim al-Waeli (Husayni radud) », lu dans son intégralité le 24 octobre 2026; utilisé uniquement pour les faits d’entité. Wikipédia en arabe contient également un article plus court, « Muslim al-Waeli, munshid », tiré de sa biographie publiée."
  ur: "مکمل عربی ویکیپیڈیا مضمون 'مسلم الولی ⁦(حسینی ردود)⁩'، 24 اکتوبر 2026 کو مکمل پڑھا گیا؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ عربی ویکیپیڈیا میں ان کی شائع شدہ سوانح عمری سے اخذ کردہ ایک چھوٹا مضمون 'مسلم الولی، منشد' بھی ہے۔"
  tr: "24 Ekim 2026'da tam olarak okunan genişletilmiş Arapça Vikipedi makalesi \"Muslim Al-Waeli (Radood Husseini)\" yalnızca varlığın gerçekleri için kullanılmıştır ve yayımlanmış biyografisine dayanan \"Muslim Al-Waeli Chanted\" başlıklı daha kısa bir versiyonu da vardır."
