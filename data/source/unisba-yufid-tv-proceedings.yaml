summary:
  ar: "ورقة مؤتمر إندونيسية عن قناة يوفيد تي في شورتس؛ تذكر أن القناة بدأت في يونيو 2009 وأن مؤسسة شبكة يوفيد سُجّلت قانونيًا في 27 أكتوبر 2014، وأن مشتركي القناة تجاوزوا 4.16 ملايين."
  en: "An Indonesian conference paper on the Yufid TV Shorts channel; it records that the channel began in June 2009, that the Yufid Network foundation was legally registered on 27 October 2014, and that the channel's subscribers passed 4.16 million."
  es: "Un documento presentado en una conferencia en Indonesia sobre el canal de vídeos cortos Yufid TV Shorts; en él se indica que el canal comenzó a funcionar en junio de 2009, que la fundación Yufid Network se registró legalmente el 27 de octubre de 2014 y que el número de suscriptores del canal superó los 4,16 millones."
  fr: "Un document de conférence indonésien sur la chaîne Yufid TV Shorts; il indique que la chaîne a débuté en juin 2009, que la fondation Yufid Network a été légalement enregistrée le 27 octobre 2014 et que le nombre d'abonnés de la chaîne a dépassé les 4,16 millions."
  ur: "یوفڈ ٹی وی شارٹس چینل پر انڈونیشیائی کانفرنس پیپر؛ یہ ریکارڈ کرتا ہے کہ چینل کا آغاز جون 2009 میں ہوا، کہ یوفڈ نیٹ ورک فاؤنڈیشن قانونی طور پر 27 اکتوبر 2014 کو رجسٹرڈ ہوئی، اور چینل کے سبسکرائبرز کی تعداد 4.16 ملین سے تجاوز کر گئی۔"
  tr: "UVID TV Shorts kanalı hakkında Endonezya'da yayımlanan bir konferans bildirisi; kanalın Haziran 2009'da başladığını, UVID ağının 27 Ekim 2014'te yasal olarak kaydedildiğini ve abone sayısının 4,16 milyonu aştığını belirtiyor."
  id: "Makalah konferensi Indonesia tentang saluran UVID TV Shorts; disebutkan bahwa saluran ini dimulai pada Juni 2009, jaringan UVID secara resmi terdaftar pada 27 Oktober 2014, dan jumlah pelanggan saluran tersebut melebihi 4,16 juta."
