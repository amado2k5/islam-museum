reliability_note: "Read in the museum's session on 20 November 2026. It gives the full title al-Nihaya fi gharib al-hadith wa-l-athar and says the author called it al-Nihaya because it holds the contents of earlier books in the field; names the most respected earlier works (Abu Ubayd, al-Khattabi, al-Harawi's Kitab al-Gharibayn, al-Zamakhshari's al-Fa'iq, Abu Musa al-Madini's Majmu' al-mughith); says Ibn al-Athir built on al-Harawi's work and Abu Musa's completion of it, explaining only the unusual words of the hadith, and added others from further sources. Used for entity facts only."
