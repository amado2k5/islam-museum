  ar: "مقالة ويكيبيديا الإندونيسية عن سونن قيري؛ تعطي في متنها ولادته 1442 ووفاته 1506 ودفنه في كبوماس بغريسيك (وصندوقها يعطي الولادة 1443 والوفاة في مدى 1506–1521)، وأباه مولانا إسحاق مع رواية بديلة تسميه سيد يعقوب، وشيوخه ومنهم سونن أمبل، وصندوقها يعطي طائفته «سني» مع حقل الفقه فارغًا."
  en: "Indonesian Wikipedia article on Sunan Giri; its body gives his birth in 1442 and death in 1506 with burial at Kebomas, Gresik (its infobox gives birth 1443 and death as the range 1506-1521), his father as Maulana Ishaq with a variant tradition naming Sayyid Ya'qub, and his teachers including Sunan Ampel; its Muslim-scholar infobox gives his denomination as Sunni with the jurisprudence field blank."
