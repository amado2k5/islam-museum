label:
  ar: "فجر الإسلام: يبحث عن الحياة العقلية في صدر الإسلام إلى آخر الدولة الأموية — أحمد أمين، الطبعة العاشرة 1969م، دار الكتاب العربي، بيروت ⁦(موسوعة أحمد أمين الإسلامية)⁩"
  en: "Ahmad Amin, Fajr al-Islam: a study of intellectual life from early Islam to the end of the Umayyad state — 10th edition 1969, Dar al-Kitab al-'Arabi, Beirut (Ahmad Amin's Islamic Encyclopaedia series)"
summary:
  ar: "الطبعة العاشرة ⁦(1969م)⁩ من «فجر الإسلام» لأحمد أمين، وأصلها من مطبوعات لجنة التأليف والترجمة والنشر، وفيها مقدمة المؤلف للطبعة الثانية ⁦(يناير 1933)⁩، ومقدمة طه حسين للطبعة الأولى ⁦(ديسمبر 1928)⁩، والفهرس، ثم سبعة أبواب: العرب في الجاهلية، والإسلام، والفرس وأثرهم، والتأثير اليوناني الروماني، والحياة العقلية ومراكزها، والحركة الدينية تفصيلاً ⁦(القرآن وتفسيره، والحديث، والتشريع)⁩، والفرق الدينية؛ ثم فهرس الأعلام."
  en: "The tenth edition (1969) of Ahmad Amin's Fajr al-Islam, originally published by the Lajnat al-Ta'lif wa-al-Tarjama wa-al-Nashr. It holds the author's preface to the second edition (January 1933), Taha Husayn's preface to the first (December 1928) and the contents, then seven parts: the Arabs before Islam, Islam, the Persians and their influence, Greco-Roman influence, intellectual life and its centres, the religious movement in detail (the Qur'an and its exegesis, hadith, law), and the religious sects; then an index of names."
  es: "La décima edición (1969) de Fajr al-Islam de Ahmad Amin, publicada originalmente por Lajnat al-Ta'lif wa-al-Tarjama wa-al-Nashr. Contiene el prefacio del autor a la segunda edición (enero de 1933), el prefacio de Taha Husayn a la primera (diciembre de 1928) y el índice, dividido en siete partes: los árabes antes del Islam, el Islam, los persas y su influencia, la influencia grecorromana, la vida intelectual y sus centros, el movimiento religioso en detalle (el Corán y su exégesis, hadices, leyes) y las sectas religiosas; y, finalmente, un índice de nombres."
  fr: "La dixième édition (1969) de Fajr al-Islam d'Ahmad Amin, initialement publiée par Lajnat al-Ta'lif wa-al-Tarjama wa-al-Nashr, comprend la préface de l'auteur à la deuxième édition (janvier 1933), la préface de Taha Husayn à la première (décembre 1928), puis la table des matières, divisée en sept parties: les Arabes avant l'islam, l'islam, les Perses et leur influence, l'influence gréco-romaine, la vie intellectuelle et ses centres, le mouvement religieux en détail (le Coran et son exégèse, les hadiths, la loi), et les sectes religieuses; suivie d'un index des noms."
  ur: "احمد امین کی فجر الاسلام کا دسواں ایڈیشن (1969)، اصل میں لجنت الطائف و الترجمہ و النشر نے شائع کیا۔ اس میں دوسرے ایڈیشن ⁦(جنوری 1933)⁩ کا مصنف کا دیباچہ، پہلے ⁦(دسمبر 1928)⁩ کا طحہ حسین کا دیباچہ اور مندرجات، پھر سات حصے: اسلام سے پہلے کے عرب، اسلام، فارسی اور ان کا اثر، یونانی رومن اثر، فکری زندگی اور اس کے مراکز، مذہبی تحریک، قرآنی تحریک اور اس کی تفصیلات قانون) اور مذہبی فرقے؛ پھر ناموں کا ایک اشاریہ۔"
