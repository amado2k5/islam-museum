  en: "Ahmad Amin, Fajr al-Islam: a study of intellectual life from early Islam to the end of the Umayyad state — 10th edition 1969, Dar al-Kitab al-'Arabi, Beirut (Ahmad Amin's Islamic Encyclopaedia series)"
summary:
  ar: "الطبعة العاشرة ⁦(1969م)⁩ من «فجر الإسلام» لأحمد أمين، وأصلها من مطبوعات لجنة التأليف والترجمة والنشر، وفيها مقدمة المؤلف للطبعة الثانية ⁦(يناير 1933)⁩، ومقدمة طه حسين للطبعة الأولى ⁦(ديسمبر 1928)⁩، والفهرس، ثم سبعة أبواب: العرب في الجاهلية، والإسلام، والفرس وأثرهم، والتأثير اليوناني الروماني، والحياة العقلية ومراكزها، والحركة الدينية تفصيلاً ⁦(القرآن وتفسيره، والحديث، والتشريع)⁩، والفرق الدينية؛ ثم فهرس الأعلام."
  en: "The tenth edition (1969) of Ahmad Amin's Fajr al-Islam, originally published by the Lajnat al-Ta'lif wa-al-Tarjama wa-al-Nashr. It holds the author's preface to the second edition (January 1933), Taha Husayn's preface to the first (December 1928) and the contents, then seven parts: the Arabs before Islam, Islam, the Persians and their influence, Greco-Roman influence, intellectual life and its centres, the religious movement in detail (the Qur'an and its exegesis, hadith, law), and the religious sects; then an index of names."
