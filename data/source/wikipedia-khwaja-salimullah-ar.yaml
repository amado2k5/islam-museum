  ar: "مقالة ويكيبيديا العربية عن خواجة سليم الله؛ تُستخدم لوقائع الكيان فقط. مختصرة تؤكد أنه رابع نواب دكا، وتأييده لتقسيم البنغال، وعضويته في الجمعية التشريعية البنغالية من 1913 حتى وفاته في كلكتا سنة 1915."
  en: "Arabic Wikipedia article on Khwaja Salimullah; used for entity facts only. A short article confirming that he was the fourth Nawab of Dhaka, a strong supporter of the Partition of Bengal, and a member of the Bengal Legislative Assembly from 1913 until his death at Calcutta in 1915."
