summary:
  ar: "مقالة ويكيبيديا العربية عن خواجة سليم الله؛ تُستخدم لوقائع الكيان فقط. مختصرة تؤكد أنه رابع نواب دكا، وتأييده لتقسيم البنغال، وعضويته في الجمعية التشريعية البنغالية من 1913 حتى وفاته في كلكتا سنة 1915."
  en: "Arabic Wikipedia article on Khwaja Salimullah; used for entity facts only. A short article confirming that he was the fourth Nawab of Dhaka, a strong supporter of the Partition of Bengal, and a member of the Bengal Legislative Assembly from 1913 until his death at Calcutta in 1915."
  es: "Artículo en árabe de la Wikipedia sobre Khwaja Salimullah; utilizado únicamente para datos sobre la persona. Un breve artículo que confirma que fue el cuarto Nawab de Dhaka, un firme defensor de la Partición de Bengala y miembro de la Asamblea Legislativa de Bengala desde 1913 hasta su fallecimiento en Calcuta en 1915."
  fr: "Article de Wikipédia en arabe sur Khwaja Salimullah; utilisé uniquement à des fins d'information sur l'entité. Ce court article confirme qu'il fut le quatrième Nawab de Dhaka, un fervent partisan de la partition du Bengale et membre de l'Assemblée législative du Bengale de 1913 jusqu'à sa mort à Calcutta en 1915."
  ur: "خواجہ سلیم اللہ پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ ایک مختصر مضمون اس بات کی تصدیق کرتا ہے کہ وہ ڈھاکہ کے چوتھے نواب تھے، جو بنگال کی تقسیم کے زبردست حامی تھے، اور 1913 سے لے کر 1915 میں کلکتہ میں اپنی موت تک بنگال کی قانون ساز اسمبلی کے رکن رہے۔"
  tr: "Khwaja Salimullah hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Kısa bir not, onun Dakka'nın dördüncü Nawab'ı olduğunu, Bengal'in bölünmesini desteklediğini ve 1913'ten 1915'te Kalküta'da ölümüne kadar Bengal Yasama Meclisi üyesi olduğunu doğrulamaktadır."
  id: "Artikel Wikipedia bahasa Arab tentang Khwaja Salimullah; digunakan hanya untuk fakta entitas. Catatan singkat yang mengonfirmasi bahwa ia adalah Nawab keempat Dhaka, mendukung pembagian Bengal, dan menjadi anggota Majelis Legislatif Bengali dari tahun 1913 hingga wafat di Calcutta pada tahun 1915."
