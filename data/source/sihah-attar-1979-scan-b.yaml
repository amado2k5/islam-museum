  en: "al-Sihah — al-Jawhari, ed. Attar (2nd ed., 1979), second scan, beginning mid-way through the editor's essay and including Bakri Shaykh Amin's article"
  ur: "الصحاح — جوہری، تحقیق عطار ⁦(دوسرا ایڈیشن، 1979ء)⁩، دوسرا اسکین جو محقق کے مضمون کے درمیان سے شروع ہوتا ہے اور اس میں بکری شیخ امین کا مقالہ ہے"
summary:
  ar: "نسخة ممسوحة ثانية من طبعة عطار الثانية للصحاح، تبدأ صفحاتها من أثناء رد المحقق على من نسب السبق إلى البندنيجي والفارابي، وتضم مقال الدكتور بكري شيخ أمين في «الصحاح» وعمل محققه، المنشور في «المجلة العربية» سنة 1398هـ، وفيه ترجمة موجزة للجوهري ووصف لنسخ الصحاح ومزاياه وهناته."
  en: "A second scan of Attar's second edition of al-Sihah, whose pages begin part-way through the editor's rebuttal of those who credited al-Bandaniji and al-Farabi with priority, and which includes Dr Bakri Shaykh Amin's article on al-Sihah and its editor's work, published in al-Majalla al-Arabiyya in 1398 AH, with a short biography of al-Jawhari and an account of the manuscripts, merits and faults of al-Sihah."
  ur: "عطار کے دوسرے ایڈیشنِ صحاح کا دوسرا اسکین، جس کے صفحات محقق کے اس رد کے درمیان سے شروع ہوتے ہیں جو بندنیجی اور فارابی کو سبقت دینے والوں کے خلاف ہے، اور اس میں ڈاکٹر بکری شیخ امین کا مقالہ ہے جو «المجلہ العربیہ» میں 1398ھ میں چھپا، جس میں جوہری کی مختصر سوانح اور صحاح کے نسخوں، خوبیوں اور خامیوں کا بیان ہے۔"
