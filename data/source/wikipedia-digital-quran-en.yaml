summary:
  ar: "مقالة ويكيبيديا الإنجليزية «المصحف الرقمي» (Digital Quran) المراجعة 1342274341 ⁦(8 مارس 2026)⁩؛ لوقائع الكيان فقط: برامج القرآن على الأقراص منذ أوائل التسعينيات، والأجهزة المخصصة لعرض النص وتشغيل التلاوة وانتشارها في إندونيسيا، والنقاش في آداب التعامل معها، ومسائل التوثق من سلامة النص الرقمي."
  en: "English Wikipedia article 'Digital Quran', revision 1342274341 (8 March 2026); entity facts only: Qur'an software on CD-ROM from the early 1990s, devices dedicated to showing the text and playing recitations and their spread in Indonesia, the debate on the etiquette of handling them, and the questions of verifying digital text."
  ur: "انگریزی ویکیپیڈیا کا مضمون «ڈیجیٹل قرآن»، نظرِ ثانی 1342274341 ⁦(8 مارچ 2026)⁩؛ صرف حقائق: 1990 کی دہائی کے آغاز سے سی ڈی پر قرآن کے پروگرام، متن اور تلاوت کے مخصوص آلات اور انڈونیشیا میں ان کا پھیلاؤ، آداب پر بحث، اور ڈیجیٹل متن کی صحت کی تصدیق۔"
