summary:
  ar: "مقالة ويكيبيديا الإنجليزية «المصحف الرقمي» (Digital Quran) المراجعة 1342274341 ⁦(8 مارس 2026)⁩؛ لوقائع الكيان فقط: برامج القرآن على الأقراص منذ أوائل التسعينيات، والأجهزة المخصصة لعرض النص وتشغيل التلاوة وانتشارها في إندونيسيا، والنقاش في آداب التعامل معها، ومسائل التوثق من سلامة النص الرقمي."
  en: "English Wikipedia article 'Digital Quran', revision 1342274341 (8 March 2026); entity facts only: Qur'an software on CD-ROM from the early 1990s, devices dedicated to showing the text and playing recitations and their spread in Indonesia, the debate on the etiquette of handling them, and the questions of verifying digital text."
  ur: "انگریزی ویکیپیڈیا کا مضمون «ڈیجیٹل قرآن»، نظرِ ثانی 1342274341 ⁦(8 مارچ 2026)⁩؛ صرف حقائق: 1990 کی دہائی کے آغاز سے سی ڈی پر قرآن کے پروگرام، متن اور تلاوت کے مخصوص آلات اور انڈونیشیا میں ان کا پھیلاؤ، آداب پر بحث، اور ڈیجیٹل متن کی صحت کی تصدیق۔"
  es: "Artículo de la Wikipedia en inglés «Corán digital», revisión 1342274341 (8 de marzo de 2026); solo datos sobre la entidad: software del Corán en CD-ROM de principios de la década de 1990, dispositivos dedicados a mostrar el texto y reproducir recitaciones y su difusión en Indonesia, el debate sobre la etiqueta en su manejo y las cuestiones de verificación del texto digital."
  fr: "Article Wikipédia en anglais « Coran numérique », révision 1342274341 (8 mars 2026); faits sur l'entité uniquement: logiciel du Coran sur CD-ROM du début des années 1990, appareils dédiés à l'affichage du texte et à la lecture des récitations et leur diffusion en Indonésie, le débat sur l'étiquette de leur manipulation et les questions de vérification du texte numérique."
  tr: "İngilizce Vikipedi makalesi \"Dijital Kur'an,\" 1342274341 (8 Mart 2026) tarihinde incelendi; sadece varlık kayıtları için: 1990'ların başından beri disklerde Kur'an programları, metinleri görüntülemek, okumaları çalmak ve yaymak için Endonezya'da kullanılan cihazlar, bunlarla başa çıkma görgü kuralları ve dijital metinlerin gerçekliğinin doğrulanması konuları."
  id: "Artikel Wikipedia bahasa Inggris \"Digital Quran,\" ditinjau 1342274341 (8 Maret 2026); hanya untuk catatan entitas: Program Al-Quran di cakram sejak awal 1990-an, perangkat yang didedikasikan untuk menampilkan teks, memutar pembacaan, dan menyebarkannya di Indonesia, diskusi tentang etiket dalam menanganinya, dan isu verifikasi keaslian teks digital."
