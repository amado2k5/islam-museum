  ar: "مقالة ويكيبيديا الإنجليزية عن نيكولا أنيلكا؛ تُستخدم لوقائع الكيان فقط. تروي سيرة المهاجم الفرنسي المولود في 14 مارس 1979 بلي شيناي: لعب لباريس سان جيرمان وأرسنال (ثنائية 1997–98) وريال مدريد ومانشستر سيتي وفنربخشة وتشيلسي (الحذاء الذهبي للدوري الإنجليزي 2009) وأندية لاحقة، وخاض 69 مباراة مع فرنسا، واعتنق الإسلام سنة 2004 في الإمارات واتخذ اسم عبد السلام بلال."
  en: "English Wikipedia article on Nicolas Anelka; used for entity facts only. It records the French forward born 14 March 1979 at Le Chesnay: Paris Saint-Germain, Arsenal (the 1997–98 double), Real Madrid, Manchester City, Fenerbahçe, Chelsea (the 2009 Premier League Golden Boot) and later clubs, 69 France caps, and his 2004 conversion to Islam in the United Arab Emirates, taking the name Abdul-Salam Bilal."
