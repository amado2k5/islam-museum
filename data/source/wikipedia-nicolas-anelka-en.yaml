summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن نيكولا أنيلكا؛ تُستخدم لوقائع الكيان فقط. تروي سيرة المهاجم الفرنسي المولود في 14 مارس 1979 بلي شيناي: لعب لباريس سان جيرمان وأرسنال ⁦(ثنائية 1997–98)⁩ وريال مدريد ومانشستر سيتي وفنربخشة وتشيلسي ⁦(الحذاء الذهبي للدوري الإنجليزي 2009)⁩ وأندية لاحقة، وخاض 69 مباراة مع فرنسا، واعتنق الإسلام سنة 2004 في الإمارات واتخذ اسم عبد السلام بلال."
  en: "English Wikipedia article on Nicolas Anelka; used for entity facts only. It records the French forward born 14 March 1979 at Le Chesnay: Paris Saint-Germain, Arsenal (the 1997–98 double), Real Madrid, Manchester City, Fenerbahçe, Chelsea (the 2009 Premier League Golden Boot) and later clubs, 69 France caps, and his 2004 conversion to Islam in the United Arab Emirates, taking the name Abdul-Salam Bilal."
  es: "Artículo de la Wikipedia en inglés sobre Nicolas Anelka; utilizado únicamente para datos sobre la persona. En él se registra la trayectoria del delantero francés nacido el 14 de marzo de 1979 en Le Chesnay: Paris Saint-Germain, Arsenal (doblete 1997-98), Real Madrid, Manchester City, Fenerbahçe, Chelsea (Bota de Oro de la Premier League 2009) y otros clubes posteriores, 69 partidos internacionales con Francia y su conversión al Islam en 2004 en los Emiratos Árabes Unidos, donde adoptó el nombre de Abdul-Salam Bilal."
  fr: "Article Wikipédia en anglais sur Nicolas Anelka; utilisé uniquement pour les informations sur l'entité. Il retrace le parcours de l'attaquant français né le 14 mars 1979 au Chesnay: Paris Saint-Germain, Arsenal (doublé en 1997-1998), Real Madrid, Manchester City, Fenerbahçe, Chelsea (Soulte d'or de Premier League en 2009) et clubs ultérieurs, 69 sélections en équipe de France, et sa conversion à l'islam en 2004 aux Émirats arabes unis, où il a pris le nom d'Abdul-Salam Bilal."
  ur: "نکولس انیلکا پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 14 مارچ 1979 کو Le Chesnay میں پیدا ہونے والے فرانسیسی فارورڈ کا ریکارڈ ہے: پیرس سینٹ جرمین، آرسنل ⁦(1997-98 ڈبل)⁩، ریئل میڈرڈ، مانچسٹر سٹی، فینرباہی، چیلسی ⁦(2009 پریمیئر لیگ گولڈن بوٹ)⁩ اور بعد میں کلبوں، 69 سے 69 یونائیٹڈ فرانس اور اسلام آباد میں اسلام آباد کی ٹیمیں ایمریٹس، عبدالسلام بلال کا نام لینا۔"
