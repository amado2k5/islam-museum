summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن غلام محمد طرزي؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في قندهار في 30 أبريل 1830 ⁦(بعلامة «بحاجة لمصدر» في المقال نفسه)⁩ ووفاته في دمشق في 8 ديسمبر 1900 أو 5 فبراير 1901، وأباه سردار رحيم دل خان، ومشاركته في الحرب الإنجليزية الأفغانية الثانية ونفيه سنة 1881 وجولاته شاعرا في الهند وبغداد وإسطنبول ودمشق ولقبه القلمي «طرزي»، وأنه والد محمود طرزي. لا تسمي دينا ولا مذهبا."
  en: "English Wikipedia article on Ghulam Muhammad Tarzi; used for entity facts only. It gives his birth at Kandahar on 30 April 1830 (flagged 'citation needed' in the article itself) and his death at Damascus on 8 December 1900 or 5 February 1901, his father Sardar Rahim Dil Khan, his part in the Second Anglo-Afghan War and his expulsion in 1881, his years as a poet in India, Baghdad, Istanbul and Damascus under the pen name Tarzi, and that he was Mahmud Tarzi's father. It names no religion or school."
  es: "Artículo de la Wikipedia en inglés sobre Ghulam Muhammad Tarzi; utilizado únicamente para datos sobre la persona. Indica su nacimiento en Kandahar el 30 de abril de 1830 (se requiere citación en el propio artículo) y su muerte en Damasco el 8 de diciembre de 1900 o el 5 de febrero de 1901, su padre Sardar Rahim Dil Khan, su participación en la Segunda Guerra Anglo-Afgana y su expulsión en 1881, sus años como poeta en la India, Bagdad, Estambul y Damasco bajo el seudónimo de Tarzi, y que era el padre de Mahmud Tarzi. No menciona ninguna religión ni escuela."
  fr: "L'article de Wikipédia en anglais consacré à Ghulam Muhammad Tarzi, utilisé uniquement pour des informations factuelles, mentionne sa naissance à Kandahar le 30 avril 1830 (mention « référence nécessaire » dans l'article lui-même) et sa mort à Damas le 8 décembre 1900 ou le 5 février 1901. Il y est question de son père, Sardar Rahim Dil Khan, de son rôle dans la Seconde Guerre anglo-afghane et de son expulsion en 1881, de ses années comme poète en Inde, à Bagdad, à Istanbul et à Damas sous le pseudonyme de Tarzi, et du fait qu'il était le père de Mahmud Tarzi. L'article ne fait mention ni de religion ni d'école."
  ur: "غلام محمد طرزی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 30 اپریل 1830 کو قندھار میں ان کی پیدائش ⁦(مضمون میں ہی جھنڈا لگا ہوا 'حوالہ درکار ہے')⁩ اور دمشق میں 8 دسمبر 1900 یا 5 فروری 1901 کو ان کی موت، ان کے والد سردار رحیم دل خان، دوسری اینگلو افغان جنگ میں ان کا حصہ اور 1881 میں ان کی بے دخلی، ہندوستان میں ان کے برسر اقتدار، بغداد اور بغداد میں بطور شاعر۔ نام طرزی رکھا، اور یہ کہ وہ محمود طرزی کے والد تھے۔ اس میں کسی مذہب یا اسکول کا نام نہیں ہے۔"
