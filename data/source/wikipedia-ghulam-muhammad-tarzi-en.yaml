summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن غلام محمد طرزي؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في قندهار في 30 أبريل 1830 (بعلامة «بحاجة لمصدر» في المقال نفسه) ووفاته في دمشق في 8 ديسمبر 1900 أو 5 فبراير 1901، وأباه سردار رحيم دل خان، ومشاركته في الحرب الإنجليزية الأفغانية الثانية ونفيه سنة 1881 وجولاته شاعرا في الهند وبغداد وإسطنبول ودمشق ولقبه القلمي «طرزي»، وأنه والد محمود طرزي. لا تسمي دينا ولا مذهبا."
  en: "English Wikipedia article on Ghulam Muhammad Tarzi; used for entity facts only. It gives his birth at Kandahar on 30 April 1830 (flagged 'citation needed' in the article itself) and his death at Damascus on 8 December 1900 or 5 February 1901, his father Sardar Rahim Dil Khan, his part in the Second Anglo-Afghan War and his expulsion in 1881, his years as a poet in India, Baghdad, Istanbul and Damascus under the pen name Tarzi, and that he was Mahmud Tarzi's father. It names no religion or school."
