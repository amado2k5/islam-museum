summary:
  ar: "مدخل موسوعة السيخ عن لجنة حدود البنجاب لسنة 1947: تشكيلها، وعضوية القاضي دين محمد بوصفه مرشح الرابطة الإسلامية، وترؤسه بصفته العضو الأقدم جلساتها العلنية في لاهور من 21 إلى 31 يوليو 1947، وتقريره المؤيد لخط الرابطة."
  en: "The Sikh Encyclopedia's entry on the 1947 Punjab Boundary Commission: its constitution, Justice Din Muhammad's membership as a Muslim League nominee, his presiding as seniormost member over the public sittings at Lahore from 21 to 31 July 1947, and his report supporting the League's line."
  es: "La entrada de la Enciclopedia Sikh sobre la Comisión de Límites del Punjab de 1947: su constitución, la pertenencia del juez Din Muhammad como candidato de la Liga Musulmana, su presidencia como miembro de mayor antigüedad en las sesiones públicas celebradas en Lahore del 21 al 31 de julio de 1947 y su informe en apoyo de la postura de la Liga."
  fr: "L'article de l'Encyclopédie sikh sur la Commission de délimitation du Pendjab de 1947: sa constitution, l'adhésion du juge Din Muhammad en tant que candidat de la Ligue musulmane, sa présidence en tant que membre le plus ancien des séances publiques à Lahore du 21 au 31 juillet 1947 et son rapport soutenant la ligne de la Ligue."
  ur: "1947 کے پنجاب باؤنڈری کمیشن پر سکھ انسائیکلوپیڈیا کا اندراج: اس کا آئین، جسٹس دین محمد کی مسلم لیگ کے نامزد امیدوار کے طور پر رکنیت، 21 سے 31 جولائی 1947 تک لاہور میں ہونے والے عوامی اجلاسوں میں سب سے سینئر ممبر کی حیثیت سے ان کی صدارت، اور لیگ کی لائن کی حمایت کرنے والی ان کی رپورٹ۔"
  tr: "1947 Pencap Sınır Komisyonu'na Sih Ansiklopedisi'ne giriş: kuruluşu, Müslüman Birliği adayı olarak Qazi Deen Muhammad'ın üyeliği, 21-31 Temmuz 1947 tarihleri arasında Lahor'daki kamu oturumlarının kıdemli üyesi olarak başkanlığı ve Birliğin çizgisini destekleyen raporu."
  id: "Entri ke Sikh Encyclopedia tentang Komisi Perbatasan Punjab tahun 1947: pembentukannya, keanggotaan Qazi Deen Muhammad sebagai kandidat Liga Muslim, kepemimpinannya sebagai anggota senior dalam sesi publik di Lahore dari 21 hingga 31 Juli 1947, dan laporannya yang mendukung garis Liga."
