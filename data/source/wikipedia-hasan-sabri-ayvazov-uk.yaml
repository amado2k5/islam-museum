summary:
  ar: "مقالة ويكيبيديا الأوكرانية عن أسان صبري أيفازوف؛ تُستخدم لوقائع الكيان فقط، وهي النص الأوفى عنه إذ لا مقالة إنجليزية له. تعطي مولده في 6 مايو 1878 في ألوبكا وإعدامه رميا في 17 أبريل 1938، وتفصّل تحريره لترجمان من 1914 وملت في 1917 ورئاسته القورولتاي مرتين سنة 1918 وتدريسه العربية والعثمانية؛ ولا تذكر له مذهبا."
  en: "Ukrainian Wikipedia article on Asan Sabri Ayvazov; used for entity facts only, and the fullest text on him as he has no English article. It gives his birth on 6 May 1878 at Alupka and his shooting on 17 April 1938, and details his editorship of Tercüman from 1914 and of Millet in 1917, his two chairmanships of the Qurultay in 1918 and his teaching of Arabic and Ottoman; it names no school for him."
  es: "Artículo de la Wikipedia en ucraniano sobre Asan Sabri Ayvazov; se utiliza únicamente para obtener información sobre él, y es el texto más completo ya que no existe un artículo en inglés. Indica su nacimiento el 6 de mayo de 1878 en Alupka y su fusilamiento el 17 de abril de 1938, y detalla su labor como editor de Tercüman desde 1914 y de Millet en 1917, sus dos presidencias del Qurultay en 1918 y su enseñanza de árabe y otomano; no menciona ninguna escuela a la que pertenezca."
  fr: "L'article de Wikipédia ukrainien consacré à Asan Sabri Ayvazov, utilisé uniquement pour les informations biographiques, est le texte le plus complet à son sujet, car il n'existe pas d'article en anglais. On y apprend sa naissance le 6 mai 1878 à Aloupka et son assassinat le 17 avril 1938. L'article détaille également son rôle de rédacteur en chef de Tercüman à partir de 1914 et de Millet en 1917, ses deux présidences de la Qurultay en 1918 et son enseignement de l'arabe et de l'ottoman; aucune école n'est mentionnée."
  ur: "آسان صابری ایوازوف پر یوکرین ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے، اور اس پر مکمل متن کیونکہ اس کا کوئی انگریزی مضمون نہیں ہے۔ یہ 6 مئی 1878 کو الوپکا میں ان کی پیدائش اور 17 اپریل 1938 کو اس کی شوٹنگ، اور 1914 سے ٹرکمن اور 1917 میں ملیٹ کی ان کی ایڈیٹر شپ، 1918 میں قرلطے کی ان کی دو چیئرمین شپ اور عربی اور عثمانی کی تعلیم کی تفصیلات بتاتا ہے۔ اس کے لیے کسی اسکول کا نام نہیں ہے۔"
  tr: "Asan Sabri Ivazov hakkındaki Ukrayna Vikipedi makalesi yalnızca varlığın gerçekleri için kullanılır ve onun hakkında en kapsamlı metindir, çünkü onun için İngilizce bir makale yoktur. 6 Mayıs 1878'de Alubka'da doğduğunu ve 17 Nisan 1938'de kasılarak idam edildiğini belirtir, 1914'te Tarjuman tarafından düzenlendiğini, 1917'deki mezhebini, 1918'de iki kez liderliğini ve Arapça ile Osmanlı öğretimini detaylandırır; kendisi için herhangi bir düşünce okulundan bahsetmez."
  id: "Artikel Wikipedia Ukraina tentang Asan Sabri Ivazov hanya digunakan untuk fakta-fakta entitas tersebut, dan merupakan teks paling komprehensif tentang dirinya, karena tidak ada artikel berbahasa Inggris untuknya. Artikel ini menceritakan kelahirannya pada 6 Mei 1878 di Alubka dan eksekusinya dengan regu tembak pada 17 April 1938, merinci penyuntingannya oleh Tarjuman pada tahun 1914, denominasi tahun 1917, kepemimpinannya dua kali pada tahun 1918, dan pengajarannya tentang bahasa Arab dan Ottoman; tidak menyebutkan aliran pemikiran apapun tentang dirinya."
