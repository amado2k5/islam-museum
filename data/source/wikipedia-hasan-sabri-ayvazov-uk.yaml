  ar: "مقالة ويكيبيديا الأوكرانية عن أسان صبري أيفازوف؛ تُستخدم لوقائع الكيان فقط، وهي النص الأوفى عنه إذ لا مقالة إنجليزية له. تعطي مولده في 6 مايو 1878 في ألوبكا وإعدامه رميا في 17 أبريل 1938، وتفصّل تحريره لترجمان من 1914 وملت في 1917 ورئاسته القورولتاي مرتين سنة 1918 وتدريسه العربية والعثمانية؛ ولا تذكر له مذهبا."
  en: "Ukrainian Wikipedia article on Asan Sabri Ayvazov; used for entity facts only, and the fullest text on him as he has no English article. It gives his birth on 6 May 1878 at Alupka and his shooting on 17 April 1938, and details his editorship of Tercüman from 1914 and of Millet in 1917, his two chairmanships of the Qurultay in 1918 and his teaching of Arabic and Ottoman; it names no school for him."
