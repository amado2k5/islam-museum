reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Consulted on 26 October 2026; the reading route did not expose a revision id, so the consultation date is recorded in place of a revision. It gives Hakimi (full name Achraf Hakimi Mouh) as born on 4 November 1998 in Madrid to Moroccan parents, and his career through Real Madrid, Borussia Dortmund (on loan), Inter Milan and Paris Saint-Germain, with his Morocco record from the 2016 senior debut to the 2025 Africa Cup of Nations title and Olympic bronze. Its infobox gives his religion as Muslim generically, a value drawn from Wikidata; its text names no school."
