summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محبوب الحق؛ تُستخدم لوقائع الكيان فقط. سيرة مفصلة تروي مولده في 24 فبراير 1934 في غورداسبور في أسرة مسلمة بنجابية وهجرته إلى لاهور عند التقسيم، ودراسته في لاهور وكامبريدج وييل وهارفارد، وعمله كبير اقتصاديي لجنة التخطيط وخطابه عن «22 أسرة»، وعمله في البنك الدولي وبرنامج الأمم المتحدة الإنمائي حيث أنشأ تقرير التنمية البشرية ومؤشر التنمية البشرية، ووفاته في نيويورك في 16 يوليو 1998."
  en: "English Wikipedia article on Mahbub ul Haq; used for entity facts only. A detailed biography recounting his birth on 24 February 1934 at Gurdaspur into a Punjabi Muslim family and the family's migration to Lahore at Partition, his studies at Lahore, Cambridge, Yale and Harvard, his work as chief economist of the Planning Commission and his '22 families' speech, his World Bank and UNDP career in which he created the Human Development Report and the Human Development Index, and his death at New York on 16 July 1998."
  es: "Artículo de la Wikipedia en inglés sobre Mahbub ul Haq; utilizado únicamente para datos sobre la persona. Una biografía detallada que relata su nacimiento el 24 de febrero de 1934 en Gurdaspur en el seno de una familia musulmana punjabí y la migración de la familia a Lahore tras la Partición, sus estudios en Lahore, Cambridge, Yale y Harvard, su labor como economista jefe de la Comisión de Planificación y su discurso sobre las \"22 familias\", su trayectoria en el Banco Mundial y el PNUD, donde creó el Informe sobre Desarrollo Humano y el Índice de Desarrollo Humano, y su fallecimiento en Nueva York el 16 de julio de 1998."
  fr: "Article de Wikipédia en anglais sur Mahbub ul Haq; utilisé uniquement à des fins d'information sur l'entité. Biographie détaillée retraçant sa naissance le 24 février 1934 à Gurdaspur, au sein d'une famille musulmane du Pendjab, et la migration de sa famille vers Lahore lors de la Partition, ses études à Lahore, Cambridge, Yale et Harvard, son travail en tant qu'économiste en chef de la Commission de planification et son discours sur les « 22 familles », sa carrière à la Banque mondiale et au PNUD, au cours de laquelle il a créé le Rapport sur le développement humain et l'Indice de développement humain, et son décès à New York le 16 juillet 1998."
  ur: "محبوب الحق پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ 24 فروری 1934 کو گورداسپور میں ایک پنجابی مسلمان گھرانے میں ان کی پیدائش اور تقسیم کے وقت اس خاندان کی لاہور منتقلی، لاہور، کیمبرج، ییل اور ہارورڈ میں ان کی تعلیم، پلاننگ کمیشن کے چیف اکانومسٹ کے طور پر ان کا کام اور '22 خاندانوں' کی تقریر، ان کا ورلڈ بینک اور یو این ڈی پی کیرئیر، جس میں انہوں نے نیو یارک ڈویلپمنٹ انڈیکس اور ہیومن ڈویلپمنٹ کے بارے میں تفصیلی سوانح عمری بنائی۔ 16 جولائی 1998۔"
