summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محبوب الحق؛ تُستخدم لوقائع الكيان فقط. سيرة مفصلة تروي مولده في 24 فبراير 1934 في غورداسبور في أسرة مسلمة بنجابية وهجرته إلى لاهور عند التقسيم، ودراسته في لاهور وكامبريدج وييل وهارفارد، وعمله كبير اقتصاديي لجنة التخطيط وخطابه عن «22 أسرة»، وعمله في البنك الدولي وبرنامج الأمم المتحدة الإنمائي حيث أنشأ تقرير التنمية البشرية ومؤشر التنمية البشرية، ووفاته في نيويورك في 16 يوليو 1998."
  en: "English Wikipedia article on Mahbub ul Haq; used for entity facts only. A detailed biography recounting his birth on 24 February 1934 at Gurdaspur into a Punjabi Muslim family and the family's migration to Lahore at Partition, his studies at Lahore, Cambridge, Yale and Harvard, his work as chief economist of the Planning Commission and his '22 families' speech, his World Bank and UNDP career in which he created the Human Development Report and the Human Development Index, and his death at New York on 16 July 1998."
