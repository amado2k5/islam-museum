reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. Covers her birth on 23 August 1950 at Frunze (now Bishkek) to Isak Otunbayev, a member of the Kirghiz SSR Supreme Court from 1967 to 1992, and the teacher Salika Daniyarova (1925–2020); her philosophy degree at Moscow State University in 1972 and her 1975 Candidate of Sciences dissertation critiquing Frankfurt School treatments of Marxist-Leninist dialectics; her teaching at Kyrgyz State National University from 1975 to 1981 and Communist Party posts from 1981; her 1986 appointment as the Kirghiz SSR's deputy premier and foreign minister, her chairmanship of the USSR UNESCO committee and vice-presidency of UNESCO's Executive Board (1989–1992); her service as independent Kyrgyzstan's foreign minister and deputy prime minister in 1992, as its first ambassador to the United States and Canada (1992–1994), foreign minister again (1994–1997), ambassador to the United Kingdom (1997–2002) and UN Deputy Special Representative for Georgia (2002–2004); her co-founding of Ata-Jurt in December 2004, her months as acting foreign minister in 2005, her leadership of the Social Democratic bloc in the Jogorku Kenesh from December 2007 and of the opposition from 2008; her selection on 7 April 2010 to head the interim government after the April Revolution ousted President Bakiyev, the constitutional referendum that made Kyrgyzstan a parliamentary republic, her swearing-in as president on 3 July 2010 — the first woman head of state in Central Asia — and the end of her term on 1 December 2011 (one body passage gives 31 December; the lead, the Urdu article and Britannica all support 1 December, which the record follows); the June 2010 ethnic violence in the south (more than 400 killed), the Kiljunen international commission's condemnation of her provisional government for inaction, Amnesty International's criticism, her government's May 2011 rejection of the commission's crimes-against-humanity conclusion, and the attributed claims in the Askarov case, including the UN Human Rights Committee's 2016 findings of violations; her founding of the Roza Otunbayeva Initiative in January 2012; her awards (the US International Women of Courage Award 2011, commandership of the Légion d'honneur, Mongolia's Polar Star); and her service from 2022, dated by the article to 2025, as the UN Secretary-General's Special Representative for Afghanistan and head of UNAMA. The article names no religion for her."
