summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن هاشم جليل العالم أقام الدين؛ تُستخدم لوقائع الكيان فقط. تجعله السلطان الخامس والعشرين لبروناي (1885–1906)، وُلد سنة 1825 للسلطان عمر علي سيف الدين الثاني، وطلب مساعدة بريطانيا ضد توسّع تشارلز بروك فأبرم اتفاقية الحماية 1888 والاتفاقية التكميلية 1905–1906، وتوفي في 10 أيار 1906؛ ويجعل صندوقها ابنه محمد جمال العالم الثاني خليفته ودينه الإسلام السنّي. وتحمل المقالة راية محتوى مولّد بالذكاء الاصطناعي من كانون الأول 2025."
  en: "English Wikipedia article on Hashim Jalilul Alam Aqamaddin; used for entity facts only. It gives him as the 25th Sultan of Brunei (1885–1906), born in 1825 to Sultan Omar Ali Saifuddin II, who sought British help against Charles Brooke’s expansion, concluded the 1888 Protectorate Agreement and the 1905–06 Supplementary Agreement, and died on 10 May 1906; its infobox names his son Muhammad Jamalul Alam II as successor and gives his religion as Sunni Islam. The article carries an AI-generated-content banner dated December 2025."
