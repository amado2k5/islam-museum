summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن هاشم جليل العالم أقام الدين؛ تُستخدم لوقائع الكيان فقط. تجعله السلطان الخامس والعشرين لبروناي (1885–1906)، وُلد سنة 1825 للسلطان عمر علي سيف الدين الثاني، وطلب مساعدة بريطانيا ضد توسّع تشارلز بروك فأبرم اتفاقية الحماية 1888 والاتفاقية التكميلية 1905–1906، وتوفي في 10 أيار 1906؛ ويجعل صندوقها ابنه محمد جمال العالم الثاني خليفته ودينه الإسلام السنّي. وتحمل المقالة راية محتوى مولّد بالذكاء الاصطناعي من كانون الأول 2025."
  en: "English Wikipedia article on Hashim Jalilul Alam Aqamaddin; used for entity facts only. It gives him as the 25th Sultan of Brunei (1885–1906), born in 1825 to Sultan Omar Ali Saifuddin II, who sought British help against Charles Brooke’s expansion, concluded the 1888 Protectorate Agreement and the 1905–06 Supplementary Agreement, and died on 10 May 1906; its infobox names his son Muhammad Jamalul Alam II as successor and gives his religion as Sunni Islam. The article carries an AI-generated-content banner dated December 2025."
  es: "Artículo de la Wikipedia en inglés sobre Hashim Jalilul Alam Aqamaddin; utilizado únicamente para datos sobre la entidad. Lo describe como el 25.º sultán de Brunéi (1885-1906), nacido en 1825 hijo del sultán Omar Ali Saifuddin II, quien solicitó ayuda británica contra la expansión de Charles Brooke, concluyó el Acuerdo del Protectorado de 1888 y el Acuerdo Suplementario de 1905-1906, y falleció el 10 de mayo de 1906. Su ficha informativa nombra a su hijo Muhammad Jamalul Alam II como sucesor y señala su religión como islam sunita. El artículo incluye un banner de contenido generado por IA con fecha de diciembre de 2025."
  fr: "Article de Wikipédia en anglais sur Hashim Jalilul Alam Aqamaddin; utilisé uniquement pour les informations sur l'entité. Il le présente comme le 25e sultan de Brunei (1885-1906), né en 1825, fils du sultan Omar Ali Saifuddin II. Ce dernier sollicita l'aide britannique contre l'expansion de Charles Brooke, conclut l'accord de protectorat de 1888 et l'accord complémentaire de 1905-1906, et mourut le 10 mai 1906. Son infobox mentionne son fils, Muhammad Jamalul Alam II, comme successeur et indique qu'il était de confession sunnite. L'article comporte une bannière de contenu généré par IA datée de décembre 2025."
  ur: "ہاشم جلیل العالم اقام الدین پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اسے برونائی کے 25 ویں سلطان (1885–1906) کے طور پر دیتا ہے، جو 1825 میں سلطان عمر علی سیف الدین دوم کے ہاں پیدا ہوا، جس نے چارلس بروک کی توسیع کے خلاف برطانوی مدد طلب کی، 1888 کے پروٹیکٹوریٹ معاہدہ اور 1905-06 کے ضمیمہ، 1905-1906 میں وفات پائی۔ اس کا معلوماتی باکس اپنے بیٹے محمد جمال العالم کو جانشین کے طور پر نامزد کرتا ہے اور اپنا مذہب سنی اسلام دیتا ہے۔ مضمون میں دسمبر 2025 کا AI سے تیار کردہ مواد کا بینر ہے۔"
