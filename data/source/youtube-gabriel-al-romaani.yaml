summary:
  ar: "قناة يوتيوب للداعية المولود في رومانيا غابرييل الروماني ⁦(المعرّف @alromaani)⁩، تضم محاضراته ومواعظه؛ ويؤرخ بدء عمله الدعوي على الإنترنت بيناير 2007."
  en: "The YouTube channel of the Romanian-born dawah speaker Gabriel Al Romaani (handle @alromaani), carrying his lectures and reminders; he dates his online dawah work from January 2007."
  es: "El canal de YouTube del predicador de dawah de origen rumano Gabriel Al Romaani (usuario @alromaani), donde se publican sus conferencias y recordatorios; él mismo sitúa su labor de dawah en línea desde enero de 2007."
  fr: "La chaîne YouTube du prédicateur de da'wa d'origine roumaine Gabriel Al Romaani (pseudo @alromaani), diffuse ses conférences et ses rappels; il date son travail de da'wa en ligne de janvier 2007."
  ur: "رومانیہ میں پیدا ہونے والے دعوتی اسپیکر جبریل الرومانی کا یوٹیوب چینل ⁦(@alromaani ہینڈل)⁩، اپنے لیکچرز اور یاددہانی لے کر؛ وہ جنوری 2007 سے اپنے آن لائن دعوتی کام کی تاریخ دے رہے ہیں۔"
  tr: "Romanya doğumlu vaiz Gabriel the Roman'ın (@alromaani olarak bilinir) YouTube kanalında onun dersleri ve vaazları yer alıyor; vaaz çalışmalarının çevrimiçi başladığını Ocak 2007'de tarihlendiriyor."
  id: "Saluran YouTube pengkhotbah yang lahir di Rumania, Gabriel the Roman (dikenal sebagai @alromaani) memuat kuliah dan khotbahnya; ia mencatat awal pekerjaan khotbahnya secara daring pada Januari 2007."
