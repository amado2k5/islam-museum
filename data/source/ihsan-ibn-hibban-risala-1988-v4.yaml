label:
  ar: "الإحسان في تقريب صحيح ابن حبان — ترتيب الأمير علاء الدين ابن بلبان، تحقيق شعيب الأرناؤوط، مؤسسة الرسالة، بيروت، ط1 1408هـ/1988م، المجلد الرابع"
  en: "al-Ihsan fi Taqrib Sahih Ibn Hibban — arranged by al-Amir 'Ala' al-Din Ibn Balban, ed. Shu'ayb al-Arna'ut, Mu'assasat al-Risala, Beirut, 1st ed. 1408/1988, vol. 4"
summary:
  ar: "المجلد الرابع من طبعة شعيب الأرناؤوط المحققة المخرّجة: يبدأ من كتاب الطهارة، باب أحكام الجنب ⁦(الحديث 1205)⁩، ويمتد في كتاب الصلاة إلى أبواب المساجد والأذان، مع إحالة كل حديث إلى موضعه من «التقاسيم والأنواع» بالقسم والنوع، وفهرس الموضوعات في آخره."
  en: "Volume 4 of Shu'ayb al-Arna'ut's critical, source-referenced edition: it opens in the Book of Purity, chapter on the rules for the ritually impure (hadith 1205), and runs into the Book of Prayer as far as the chapters on mosques and the call to prayer; each hadith is referred to its place in the original Taqasim by section and type, with a subject index at the end."
  es: "El volumen 4 de la edición crítica y con referencias a fuentes de Shu'ayb al-Arna'ut comienza en el Libro de la Pureza, capítulo sobre las reglas para los ritualmente impuros (hadiz 1205), y se extiende hasta el Libro de la Oración, llegando a los capítulos sobre las mezquitas y la llamada a la oración; cada hadiz se remite a su lugar en el Taqasim original por sección y tipo, con un índice temático al final."
  fr: "Volume 4 de l'édition critique et référencée de Shu'ayb al-Arna'ut: il s'ouvre dans le Livre de la Pureté, chapitre sur les règles pour les impurs rituels (hadith 1205), et se poursuit dans le Livre de la Prière jusqu'aux chapitres sur les mosquées et l'appel à la prière; chaque hadith est renvoyé à sa place dans le Taqasim original par section et type, avec un index des sujets à la fin."
  ur: "شعیب الارناوت کے تنقیدی، ماخذ سے متعلق ایڈیشن کی جلد 4: یہ کتاب طہارت میں کھلتا ہے، نجاست کے احکام کے باب ⁦(حدیث 1205)⁩، اور نماز کی کتاب میں مساجد اور اذان کے باب تک جاتا ہے۔ ہر حدیث کو اصل تقسم میں سیکشن اور ٹائپ کے لحاظ سے اس کی جگہ کا حوالہ دیا گیا ہے، جس کے آخر میں مضمون کا اشاریہ ہے۔"
  tr: "Şuayb el-Arna'ut tarafından düzenlenen ve yönetilen baskının Dördüncü Cildi: Ceneb üzerine hükümler üzerine olan Arınma Kitabı (Hadisler 1205) ile başlar ve Namaz Kitabı'nda cami bölümleri ve ezan sirvi bölümlerine kadar uzanır; her hadis kategori ve türe göre 'kategori ve türler'deki yerini belirtir ve sonunda konu dizini içerir."
  id: "Jilid Keempat edisi oleh Shu'ayb al-Arna'ut, disunting dan diarahkan: Buku ini dimulai dengan Kitab Pemurnian, bab tentang aturan janabah (Hadis 1205), dan diperluas dalam Kitab Doa ke bab-bab masjid dan panggilan shalat, dengan setiap hadis merujuk pada posisinya dalam 'kategori dan jenis' berdasarkan kategori dan jenis, dengan indeks topik di akhir."
