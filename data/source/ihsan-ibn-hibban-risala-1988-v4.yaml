summary:
  ar: "المجلد الرابع من طبعة شعيب الأرناؤوط المحققة المخرّجة: يبدأ من كتاب الطهارة، باب أحكام الجنب (الحديث 1205)، ويمتد في كتاب الصلاة إلى أبواب المساجد والأذان، مع إحالة كل حديث إلى موضعه من «التقاسيم والأنواع» بالقسم والنوع، وفهرس الموضوعات في آخره."
  en: "Volume 4 of Shu'ayb al-Arna'ut's critical, source-referenced edition: it opens in the Book of Purity, chapter on the rules for the ritually impure (hadith 1205), and runs into the Book of Prayer as far as the chapters on mosques and the call to prayer; each hadith is referred to its place in the original Taqasim by section and type, with a subject index at the end."
