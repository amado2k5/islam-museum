reliability_note: "Read in the museum's session on 20 November 2026. It describes the book as an Arabic dictionary by Ibn Faris arranged by the first letters of roots in alphabetical order of a cyclical kind; says no composition date is stated and that scholars disagree on whether it came before or after Mujmal al-Lugha; and gives the author's declared aim as tracing the branches of each root back to one or more comprehensive semantic origins, relying on five main sources named in the preface, the first Kitab al-Ayn. Used for entity facts only."
