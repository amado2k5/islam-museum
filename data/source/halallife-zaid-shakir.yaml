summary:
  ar: "ملف موقع «الحياة الحلال» عن الإمام زيد شاكر: يروي اعتناقه الإسلام سنة 1977 وشهاداته من الجامعة الأمريكية وروتجرز ودراسته سبع سنوات في سوريا وتخرجه في جامعة أبو النور سنة 2001 ومشاركته في تأسيس كلية الزيتونة؛ وتذكر حقوله المنظمة مذهبه سنيا وفقهه شافعيا."
  en: "The Halal Life's scholar profile of Imam Zaid Shakir: it narrates his conversion in 1977, his American University and Rutgers degrees, his seven years of study in Syria and 2001 graduation from Abu Nour University, and his co-founding of Zaytuna College; its structured fields give his denomination as Sunni and his jurisprudence as Shafi'i."
  es: "El perfil académico del imán Zaid Shakir, publicado por Halal Life, narra su conversión en 1977, sus títulos de la Universidad Americana y de Rutgers, sus siete años de estudio en Siria y su graduación en 2001 de la Universidad de Abu Nour, así como su cofundación del Colegio Zaytuna; su estructura detallada indica que se identifica como sunita y su jurisprudencia como shafi'í."
  fr: "Le profil intellectuel de l'imam Zaid Shakir sur le site Halal Life: il relate sa conversion en 1977, ses diplômes de l'American University et de Rutgers, ses sept années d'études en Syrie et son diplôme de l'université Abu Nour en 2001, ainsi que sa co-fondation du Zaytuna College; ses champs structurés indiquent qu'il est sunnite et que sa jurisprudence est chaféite."
  ur: "حلال لائف کا امام زید شاکر کی اسکالر پروفائل: یہ 1977 میں ان کی تبدیلی، ان کی امریکن یونیورسٹی اور رٹگرز کی ڈگریاں، شام میں ان کی سات سالہ تعلیم اور ابو نور یونیورسٹی سے 2001 میں گریجویشن، اور زیتونا کالج کے شریک بانی کو بیان کرتی ہے۔ اس کے ڈھانچے والے شعبے اس کے فرقے کو سنی اور اس کی فقہ کو شافعی دیتے ہیں۔"
