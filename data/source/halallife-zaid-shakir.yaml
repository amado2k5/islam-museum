summary:
  ar: "ملف موقع «الحياة الحلال» عن الإمام زيد شاكر: يروي اعتناقه الإسلام سنة 1977 وشهاداته من الجامعة الأمريكية وروتجرز ودراسته سبع سنوات في سوريا وتخرجه في جامعة أبو النور سنة 2001 ومشاركته في تأسيس كلية الزيتونة؛ وتذكر حقوله المنظمة مذهبه سنيا وفقهه شافعيا."
  en: "The Halal Life's scholar profile of Imam Zaid Shakir: it narrates his conversion in 1977, his American University and Rutgers degrees, his seven years of study in Syria and 2001 graduation from Abu Nour University, and his co-founding of Zaytuna College; its structured fields give his denomination as Sunni and his jurisprudence as Shafi'i."
