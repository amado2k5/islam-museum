reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and re-fetched by the recorded revision id with content verified identical. It gives him as born on 6 May 1872 at Mytilene, Lesbos, one of the 'Three Pashas' of the Committee of Union and Progress, Minister of the Navy from 1914 to 1918 and commander of the Fourth Army in Syria, known there as as-Saffāḥ for the hangings of Arab nationalists at Damascus and Beirut on 6 May 1916 — 34 executed in 1915–1916 in all — the 1917 deportation of the Jews of Jaffa, and the Tafas massacre among his listed battles. On the Armenian genocide it reports the historians' contest: Wolfgang Gust's assessment that he preserved perhaps 150,000 Armenians in terrible conditions while helping to kill another 150,000, and Ümit Kurt's argument that he favoured forced conversion and assimilation over killing and remains a génocidaire; in absentia he was sentenced to death by a Turkish military court for massacring Arab subjects. He was assassinated at Tbilisi on 21 July 1922 by Armenian Revolutionary Federation members as part of Operation Nemesis, and his remains were brought to Erzurum and buried there. It makes no statement of his religion in its text or infobox."
