summary:
  ar: "مقالة ويكيبيديا الكازاخية عن أحمد بايتورسينول ⁦(5 سبتمبر 1872 – 8 ديسمبر 1937)⁩؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 5 سبتمبر 1872 وتتناول علمه وتعليمه وحركة ألاش وتخليد ذكراه في كازاخستان."
  en: "Kazakh Wikipedia article on Ahmet Baitursynuly (5 September 1872 – 8 December 1937); used for entity facts only. It gives his birth as 5 September 1872 and covers his scholarship, teaching, the Alash movement and his commemoration in Kazakhstan."
  es: "Artículo de la Wikipedia en kazajo sobre Ahmet Baitursynuly (5 de septiembre de 1872 - 8 de diciembre de 1937); utilizado únicamente para datos biográficos. Indica que nació el 5 de septiembre de 1872 y abarca su labor académica, docente, el movimiento Alash y su conmemoración en Kazajistán."
  fr: "Article de Wikipédia en kazakh sur Ahmet Baitursynuly (5 septembre 1872 – 8 décembre 1937); utilisé uniquement à des fins d’information sur la personne. Il indique sa date de naissance, le 5 septembre 1872, et aborde ses travaux universitaires, son enseignement, son engagement dans le mouvement Alash et les hommages qui lui sont rendus au Kazakhstan."
  ur: "احمد بیتورسینولی پر قازق ویکیپیڈیا کا مضمون ⁦(5 ستمبر 1872 - 8 دسمبر 1937)⁩؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی پیدائش 5 ستمبر 1872 ہے اور اس میں ان کی اسکالرشپ، تدریس، الاش تحریک اور قازقستان میں ان کی یادگاری کا احاطہ کیا گیا ہے۔"
  tr: "Ahmad Baitursinol hakkında Kazakça Vikipedi makalesi (5 Eylül 1872 – 8 Aralık 1937); yalnızca varlığın olayları için kullanılmıştır. 5 Eylül 1872'deki doğumundan bahseder ve bilgisi, eğitimi, Alash hareketi ve Kazakistan'daki anısını kapsar."
  id: "Artikel Wikipedia Kazakh tentang Ahmad Baitursinol (5 September 1872 – 8 Desember 1937); digunakan hanya untuk peristiwa entitas tersebut. Artikel ini menyebutkan kelahirannya pada 5 September 1872, dan membahas pengetahuannya, pendidikan, gerakan Alash, serta memperingati kenangannya di Kazakhstan."
