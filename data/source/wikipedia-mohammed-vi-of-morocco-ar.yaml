summary:
  ar: "مقالة ويكيبيديا العربية عن محمد السادس بن الحسن؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 21 أغسطس 1963، وتوليه الحكم خلفا لوالده الحسن الثاني ومبايعته في الرباط يوم 23 يوليو 1999 الموافق 9 ربيع الثاني 1420 هـ، وإصلاحاته للحقل الديني في المغرب."
  en: "Arabic Wikipedia article on Mohammed VI of Morocco; used for entity facts only. It gives his birth on 21 August 1963, his accession succeeding his father Hassan II and his bay'a at Rabat on 23 July 1999 (9 Rabi' al-Thani 1420 AH), and his reforms of Morocco's religious field."
  es: "Artículo en árabe de la Wikipedia sobre Mohammed VI de Marruecos; utilizado únicamente para datos sobre la persona. Indica su nacimiento el 21 de agosto de 1963, su ascenso al trono sucediendo a su padre Hassan II y su juramento de lealtad (bay'a) en Rabat el 23 de julio de 1999 (9 Rabi' al-Thani 1420 AH), así como sus reformas en el ámbito religioso de Marruecos."
  fr: "Article de Wikipédia en arabe sur Mohammed VI du Maroc; utilisé uniquement à des fins d'information sur l'entité. Il indique sa naissance le 21 août 1963, son accession au trône après avoir succédé à son père Hassan II et sa bay'a à Rabat le 23 juillet 1999 (9 Rabi' al-Thani 1420 AH), ainsi que ses réformes du domaine religieux marocain."
  ur: "مراکش کے محمد ششم پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ان کی پیدائش 21 اگست 1963 کو ہوئی، اس کا الحاق ان کے والد حسن ثانی کے بعد ہوا اور 23 جولائی 1999 ⁦(9 ربیع الثانی 1420 ہجری)⁩ کو رباط میں ان کی بیع اور مراکش کے مذہبی میدان میں ان کی اصلاحات۔"
