  ar: "مقالة ويكيبيديا الروسية عن سلطان مجيد أفندييف؛ تُستخدم لوقائع الكيان فقط. أوفى سيرة له: تاريخاه 14 [26] مايو 1887 – 21 أبريل 1938، وأسماؤه الحزبية المستعارة «موفيد زاده» و«يولداش» و«سلطان»، ومناصبه الحزبية والسوفيتية، ومحاكمته وإعدامه وردّ اعتباره. لا تسمي مذهبًا له ولا تشهد بإلحاده شخصيًا."
  en: "Russian Wikipedia article on Sultan Majid Afandiyev; used for entity facts only. The fullest biography: his dates 14 [26] May 1887 – 21 April 1938, his party pseudonyms Mufidzade, Yoldash and Sultan, his party and Soviet offices, his trial, execution and rehabilitation. It names no school for him and does not attest atheism for him personally."
