summary:
  ar: "مقالة ويكيبيديا الروسية عن سلطان مجيد أفندييف؛ تُستخدم لوقائع الكيان فقط. أوفى سيرة له: تاريخاه 14 [26] مايو 1887 – 21 أبريل 1938، وأسماؤه الحزبية المستعارة «موفيد زاده» و«يولداش» و«سلطان»، ومناصبه الحزبية والسوفيتية، ومحاكمته وإعدامه وردّ اعتباره. لا تسمي مذهبًا له ولا تشهد بإلحاده شخصيًا."
  en: "Russian Wikipedia article on Sultan Majid Afandiyev; used for entity facts only. The fullest biography: his dates 14 [26] May 1887 – 21 April 1938, his party pseudonyms Mufidzade, Yoldash and Sultan, his party and Soviet offices, his trial, execution and rehabilitation. It names no school for him and does not attest atheism for him personally."
  es: "Artículo de la Wikipedia rusa sobre el sultán Majid Afandiyev; utilizado únicamente para datos sobre la persona. La biografía más completa incluye: sus fechas 14 [26] de mayo de 1887 – 21 de abril de 1938, sus seudónimos de partido Mufidzade, Yoldash y Sultan, sus cargos en el partido y en la Unión Soviética, su juicio, ejecución y rehabilitación. No menciona ninguna escuela a la que pertenezca ni atestigua su ateísmo personal."
  fr: "Article de Wikipédia russe sur Sultan Majid Afandiyev; utilisé uniquement pour les informations factuelles. Biographie la plus complète: dates de naissance (14 [26] mai 1887 – 21 avril 1938), pseudonymes de parti (Mufidzade, Yoldash et Sultan), fonctions au sein du parti et du Soviet, procès, exécution et réhabilitation. L’article ne mentionne aucune école qu’il aurait fréquentée et n’atteste pas de son athéisme personnel."
  ur: "سلطان ماجد آفندیف پر روسی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ مکمل سوانح عمری: ان کی تاریخیں 14 مئی 1887 - 21 اپریل 1938، ان کی پارٹی تخلص مفدزادے، یولداش اور سلطان، ان کی پارٹی اور سوویت دفاتر، ان کا مقدمہ، پھانسی اور بحالی۔ یہ اس کے لیے کسی اسکول کا نام نہیں لیتا اور ذاتی طور پر اس کے لیے الحاد کی تصدیق نہیں کرتا۔"
  tr: "Sultan Mejid Avendiyev hakkında Rusça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. En kapsamlı biyografisi: 14 [26] Mayıs 1887 – 21 Nisan 1938 tarihleri, partisi 'Movidzade', 'Yuldash' ve 'Sultan' takma adlarıyla anılmıştır; parti ve Sovyet pozisyonları, yargılanması, idam edilmesi ve rehabilitasyonu. Mezhebini isimlendirmeyin ve ateizmini şahsen onaylamayın."
  id: "Artikel Wikipedia Rusia tentang Sultan Mejid Avendiyev; digunakan hanya untuk fakta entitas. Biografi paling lengkap tentang dirinya: Tanggalnya 14 [26] Mei 1887 – 21 April 1938, alias partainya 'Movidzade,' 'Yuldash,' dan 'Sultan,' posisi partainya dan Soviet, persidangan, eksekusi, dan rehabilitasinya. Jangan sebutkan sektenya maupun secara pribadi membuktikan ateismenya."
