  ar: "متن الشمائل المحمدية للترمذي مع شرح إبراهيم بن محمد الباجوري ⁦(1198–1277هـ)⁩ «المواهب اللدنية على الشمائل المحمدية»، اعتنى به محمد عوامة وكتب مقدمته بالمدينة المنورة في 27 ذي القعدة 1421هـ، الطبعة الأولى 1422هـ/2001م، في 56 باباً مع فهرس."
  en: "The text of al-Tirmidhi's al-Shama'il al-Muhammadiyya with the commentary of Ibrahim ibn Muhammad al-Bajuri (1198–1277 AH), al-Mawahib al-Laduniyya ala al-Shama'il al-Muhammadiyya, edited by Muhammad Awwama, who signed his preface in Medina on 27 Dhu al-Qa'da 1421; 1st edition 1422/2001, 56 chapters with an index."
