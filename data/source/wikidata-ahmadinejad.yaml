summary:
  ar: "عنصر ويكي بيانات Q34448 لمحمود أحمدي نجاد، ثُبّت عبر خصائص صفحة المقالة الإنجليزية؛ يُستخدم لوقائع الكيان فقط. يعطي ولادته 28 تشرين الأول 1956 في أرادان، وللدين قيمة الشيعة عمومًا (Q9585)، ولا يحمل أي قيمة وفاة."
  en: "Wikidata item Q34448 for Mahmoud Ahmadinejad, grounded through the English article's pageprops; used for entity facts only. It gives his birth as 28 October 1956 at Aradan and a religion value of Shia Islam in general (Q9585), and carries no death value at all."
  es: "El elemento de Wikidata Q34448 para Mahmoud Ahmadinejad, basado en los atributos de página del artículo en inglés, se utiliza únicamente para datos de la entidad. Indica que nació el 28 de octubre de 1956 en Aradan y profesa el islam chiíta en general (Q9585), sin incluir la fecha de su fallecimiento."
  fr: "L'élément Wikidata Q34448 concernant Mahmoud Ahmadinejad, basé sur les propriétés de la page de l'article en anglais, est utilisé uniquement pour les informations relatives à l'entité. Il indique sa date de naissance au 28 octobre 1956 à Aradan et son appartenance religieuse à l'islam chiite (Q9585). Aucune information concernant sa date de décès n'est fournie."
  ur: "محمود احمدی نژاد کے لیے Wikidata آئٹم Q34448، انگریزی مضمون کے صفحہ پروپس کے ذریعے۔ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 28 اکتوبر 1956 کو ارادان میں اس کی پیدائش اور عام طور پر شیعہ اسلام کی ایک مذہبی قدر (Q9585) کے طور پر دیتا ہے، اور موت کی کوئی قیمت نہیں رکھتی۔"
  tr: "Mahmoud Ahmedinejad tarafından hazırlanan Wikidata maddesi Q34448, İngilizce makale sayfası properties aracılığıyla düzeltildi; sadece varlığın gerçekleri için kullanıldı. Doğum tarihini 28 Ekim 1956 olarak Aradan'da veriyor ve din genellikle Şii anlamı taşır (Q9585) ile ölüm açısından bir anlam taşımaz."
  id: "Item Wikidata Q34448 oleh Mahmoud Ahmadinejad, diperbaiki melalui properti halaman artikel berbahasa Inggris; digunakan hanya untuk fakta entitas. Ia mencantumkan tanggal lahirnya 28 Oktober 1956 dalam bahasa Aradan, dan agama umumnya memiliki makna Syiah (Q9585), dan tidak membawa makna kematian apapun."
