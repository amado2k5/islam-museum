reliability_note: "Peer-reviewed librarians' journal study, read in full. It gives Yusuf al-Khalidi as 1842–1906 with his brother Yasin and Yasin's son Ruhi; it states that Hajj Raghib, the library's founder, died in Nablus in 1952 at the age of 82 (an age that would imply birth about 1870, preserved unadopted), and that the Khalidi family acted as Hanafi qadis in the Ottoman period — family milieu, not Raghib's own attestation."
