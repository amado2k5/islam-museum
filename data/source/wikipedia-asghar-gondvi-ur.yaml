summary:
  ar: "مقالة ويكيبيديا الأردية عن أصغر غوندوي؛ تُستخدم لوقائع الكيان فقط. نصّها يذكر صراحة أنه بايع رسميا على يد الشاه عبد الغني وظل مشبعا بروح التصوف، ويجعل وفاته سنة 1936 في غوندا، بينما تجعلها المقالة الإنجليزية في الله آباد."
  en: "Urdu Wikipedia article on Asghar Gondvi; used for entity facts only. Its text states expressly that he formally took bay'ah (the initiation oath) at the hand of Shah Abdul Ghani and remained steeped in tasawwuf; its infobox places his death in 1936 at Gonda, where the English article places it at Allahabad."
  es: "Artículo de Wikipedia en urdu sobre Asghar Gondvi; utilizado únicamente para datos sobre la persona. Su texto afirma expresamente que prestó formalmente el juramento de iniciación (bay'ah) de manos de Shah Abdul Ghani y permaneció inmerso en el sufismo; su ficha informativa sitúa su muerte en 1936 en Gonda, mientras que el artículo en inglés la sitúa en Allahabad."
  fr: "Article de Wikipédia en ourdou sur Asghar Gondvi; utilisé uniquement pour les informations sur l'entité. Son texte indique expressément qu'il a prêté serment d'allégeance (bay'ah) aux mains de Shah Abdul Ghani et qu'il est resté plongé dans le soufisme; son infobox situe sa mort en 1936 à Gonda, alors que l'article en anglais la situe à Allahabad."
  ur: "اصغر گونڈوی پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا متن واضح طور پر بیان کرتا ہے کہ اس نے باضابطہ طور پر شاہ عبدالغنی کے ہاتھ سے بیعت کی اور تصوف میں ڈٹے رہے۔ اس کے معلوماتی خانے میں ان کی موت 1936 میں گونڈا میں ہوئی، جہاں انگریزی مضمون اسے الہ آباد میں رکھتا ہے۔"
