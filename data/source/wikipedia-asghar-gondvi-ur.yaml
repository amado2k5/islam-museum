  ar: "مقالة ويكيبيديا الأردية عن أصغر غوندوي؛ تُستخدم لوقائع الكيان فقط. نصّها يذكر صراحة أنه بايع رسميا على يد الشاه عبد الغني وظل مشبعا بروح التصوف، ويجعل وفاته سنة 1936 في غوندا، بينما تجعلها المقالة الإنجليزية في الله آباد."
  en: "Urdu Wikipedia article on Asghar Gondvi; used for entity facts only. Its text states expressly that he formally took bay'ah (the initiation oath) at the hand of Shah Abdul Ghani and remained steeped in tasawwuf; its infobox places his death in 1936 at Gonda, where the English article places it at Allahabad."
