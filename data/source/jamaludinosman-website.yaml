reliability_note: "His own site: a primary source for his self-presentation, roles and work, not independent corroboration of biography. Read in full on 8 November 2026: its masthead styles him 'A Muslim preacher devoted to the community · Imam · Educator' and 'Madinah Trained, BA in Hadith'; its About section states verbatim that 'Sheikh Jamaludin Osman studied at the Islamic University of Madinah, earning a Bachelor's degree in Hadith' and that 'Today he serves as Imam of Jamia Mosque, Nairobi'; its description line reads 'Muslim preacher, educator and community leader. Imam of Jamia Mosque, Nairobi, Kenya.' The homepage read gives no birth date and names no school of law or order for him; his Madinah degree is formation, which under this lane's rules attests nothing about a faith value."
