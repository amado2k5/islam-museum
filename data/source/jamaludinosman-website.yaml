  ar: "الموقع الرسمي للشيخ جمال الدين عثمان (jamaludinosman.com)؛ يقدّمه داعيةً وإمامًا ومعلّمًا، ويذكر أنه درس في الجامعة الإسلامية بالمدينة المنورة ونال البكالوريوس في الحديث، وأنه اليوم إمام الجامع الكبير ⁦(جامع جاميا)⁩ في نيروبي."
