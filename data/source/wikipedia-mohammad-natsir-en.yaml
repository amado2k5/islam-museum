  ar: "مقالة ويكيبيديا الإنجليزية عن العالم والسياسي الإندونيسي محمد ناصر؛ لوقائع الكيان فقط: مولده في سولوك في 17 يوليو 1908، ودراسته في باندونغ على أحمد حسن، وكتاباته منذ 1929، ورئاسته الوزراء 1950–1951، وسجنه 1962–1964، وتوقيعه عريضة الخمسين في 1980، وجائزة الملك فيصل (1980)، وتكريمه بطلًا قوميًا في 2008؛ وتستند إلى رسالة ماجستير في جامعة ماكغيل (1995) وكتب إندونيسية وتمبو وجاكرتا بوست."
  en: "English Wikipedia article on the Indonesian scholar and politician Mohammad Natsir; entity facts only: birth at Solok on 17 July 1908, study at Bandung under Ahmad Hassan, writings from 1929, his premiership 1950–1951, imprisonment 1962–1964, his signing of the Petition of Fifty in 1980, the King Faisal award (1980) and his naming as a National Hero in 2008; it cites a McGill master's thesis (1995), Indonesian biographies, Tempo and the Jakarta Post."
