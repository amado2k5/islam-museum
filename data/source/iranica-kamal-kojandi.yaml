reliability_note: "Scholarly encyclopedia entry, read in full in session. It opens 'Persian poet and Sufi (b. Khojand, ca. 720/1320; d. Tabriz, 803/1400-01)', records his reputation as a Sufi shaikh in Khojand and Transoxiana, the khanqah at Waliankuh in Tabriz granted by Sultan Husayn Jalayirid as the base of his literary and spiritual activities, his four years at Saray after Toqtamish's conquest of Tabriz in 787/1385, his divan collected by his disciples, and his burial at his retreat. On the death year it reports the biographical range from 792/1390 (Dawlatshah) to 807/1404 (Gazorgahi) and the generally accepted 803/1400-01 of Jami and Khwandamir, confirmed by contemporary chronograms. It names no Sufi order for him."
