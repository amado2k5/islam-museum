label:
  ar: "بيت المقدس في الإسلام — مجموعة من العلماء والمفكرين"
  en: "Bayt al-Maqdis in Islam — a group of scholars and thinkers"
summary:
  ar: "كتاب من السلسلة العلمية لمجمع البحوث الإسلامية بالأزهر الشريف، في 138 صفحة، إشراف الأمين العام للمجمع، يضم ثلاثة أبحاث: من تاريخ بيت المقدس لإسحاق موسى الحسيني، ومدينة الأمجاد لعبد الحميد حسن، والتاريخ يبطل مزاعم اليهود لعبد الحميد السايح، مع ملاحق تنشر بيان المجمع عن إحراق المسجد الأقصى سنة 1969م، ونداء مؤتمر إنقاذ القدس بعمّان سنة 1968م، وفتوى علماء الضفة الغربية سنة 1967م، وقرارات المؤتمر الرابع للمجمع سنة 1968م. مادته بحث ومرافعة لها طابع الدفاع عن حق المسلمين في القدس، وتعرض ذلك بوصفه رأي الكتاب."
  en: "A book in the Scientific Series of the Islamic Research Academy of al-Azhar, 138 pages, supervised by the Academy's Secretary-General. It has three studies (a history of Bayt al-Maqdis; the city of glories; history against the Jewish claims) and annexes that print the Academy's 1969 statement on the burning of al-Aqsa, the 1968 Amman appeal, the 1967 fatwa of the West Bank scholars and the Academy's 1968 resolutions. Its voice is a defence of Muslim rights in Jerusalem, and the book's claims are read as its own position."
  es: "Un libro de la Serie Científica de la Academia de Investigación Islámica de Al-Azhar, de 138 páginas, supervisado por el Secretario General de la Academia. Contiene tres estudios (una historia de Bayt al-Maqdis; la ciudad de las glorias; la historia en contra de las reivindicaciones judías) y anexos que incluyen la declaración de la Academia de 1969 sobre la quema de Al-Aqsa, el llamamiento de Amán de 1968, la fatwa de 1967 de los eruditos de Cisjordania y las resoluciones de la Academia de 1968. Su postura es una defensa de los derechos de los musulmanes en Jerusalén, y las afirmaciones del libro se interpretan como su propia posición."
  fr: "Ouvrage de la collection scientifique de l'Académie de recherche islamique d'al-Azhar, ce livre de 138 pages, supervisé par le secrétaire général de l'Académie, présente trois études (une histoire de Bayt al-Maqdis, la « Cité des gloires », et une argumentation historique contre les revendications juives). Ses annexes reproduisent la déclaration de l'Académie de 1969 sur l'incendie d'al-Aqsa, l'appel d'Amman de 1968, la fatwa de 1967 des oulémas de Cisjordanie et les résolutions de l'Académie de 1968. Défendant les droits des musulmans à Jérusalem, l'ouvrage exprime sa propre position."
  ur: "الازہر کی اسلامک ریسرچ اکیڈمی کی سائنسی سیریز کی ایک کتاب، 138 صفحات پر مشتمل، اکیڈمی کے سیکرٹری جنرل کی زیر نگرانی۔ اس میں تین مطالعات ہیں ⁦(بیت المقدس کی تاریخ؛ شہرت کا شہر؛ یہودیوں کے دعووں کے خلاف تاریخ)⁩ اور ملحقہ جو الاقصیٰ کو جلانے کے بارے میں اکیڈمی کا 1969 کا بیان، 1968 کی عمان کی اپیل، مغربی کنارے کے علماء کا 1967 کا فتویٰ اور اکیڈمی کی 1968 کی قرارداد کو پرنٹ کرتی ہے۔ اس کی آواز یروشلم میں مسلمانوں کے حقوق کا دفاع ہے، اور کتاب کے دعوے اس کے اپنے موقف کے طور پر پڑھے جاتے ہیں۔"
  tr: "El-Ezher El-Şerif İslami Araştırma Akademisi'nin bilimsel serisinden 138 sayfalık bir kitap, Akademi Genel Sekreteri denetiminde, üç araştırma makalesi içerir: İshaq Musa El-Hüseyni'nin Kudüs Tarihinden, Abdul Hamid Hasid Hassan'ın Şanlı Şehri ve Abdul Hamid Al-Sayeh'in Yahudi İddialarını Reddeden Tarih adlı eserleri; eklerde Akademi'nin 1969'da Aksa'nın yakılması, 1968'de Amman'da Kudüs Kurtarma Konferansı çağrısı, 1967'de Batı Şeria alimlerinin fetvası ve 1968'de Akademi'nin dördüncü konferansının kararları yer almaktadır. İçeriği, Kudüs'teki Müslümanların haklarını savunma karakterine yönelik bir araştırma ve yalvarışlardır ve kitabın görüşü olarak sunulmaktadır."
  id: "Sebuah buku dari seri ilmiah Akademi Riset Islam di Al-Azhar Al-Sharif, 138 halaman, diawasi oleh Sekretaris Jenderal Akademi, berisi tiga makalah penelitian: Dari Sejarah Yerusalem oleh Ishaq Musa Al-Husseini, dan Kota Kemuliaan oleh Abdul Hamid Hassan, serta Sejarah Menolak Klaim Yahudi oleh Abdul Hamid Al-Sayeh, dengan lampiran yang menerbitkan pernyataan Akademi tentang pembakaran Masjid Al-Aqsa pada 1969, seruan untuk Konferensi Penyelamatan Yerusalem di Amman pada 1968, fatwa para cendekiawan Tepi Barat pada 1967, dan keputusan konferensi keempat Akademi pada 1968. Isinya adalah penelitian dan permohonan dengan karakter pembelaan hak-hak Muslim di Yerusalem, disajikan sebagai opini buku tersebut."
