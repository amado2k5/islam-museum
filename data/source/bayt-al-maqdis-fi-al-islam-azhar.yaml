  en: "Bayt al-Maqdis in Islam — a group of scholars and thinkers"
summary:
  ar: "كتاب من السلسلة العلمية لمجمع البحوث الإسلامية بالأزهر الشريف، في 138 صفحة، إشراف الأمين العام للمجمع، يضم ثلاثة أبحاث: من تاريخ بيت المقدس لإسحاق موسى الحسيني، ومدينة الأمجاد لعبد الحميد حسن، والتاريخ يبطل مزاعم اليهود لعبد الحميد السايح، مع ملاحق تنشر بيان المجمع عن إحراق المسجد الأقصى سنة 1969م، ونداء مؤتمر إنقاذ القدس بعمّان سنة 1968م، وفتوى علماء الضفة الغربية سنة 1967م، وقرارات المؤتمر الرابع للمجمع سنة 1968م. مادته بحث ومرافعة لها طابع الدفاع عن حق المسلمين في القدس، وتعرض ذلك بوصفه رأي الكتاب."
  en: "A book in the Scientific Series of the Islamic Research Academy of al-Azhar, 138 pages, supervised by the Academy's Secretary-General. It has three studies (a history of Bayt al-Maqdis; the city of glories; history against the Jewish claims) and annexes that print the Academy's 1969 statement on the burning of al-Aqsa, the 1968 Amman appeal, the 1967 fatwa of the West Bank scholars and the Academy's 1968 resolutions. Its voice is a defence of Muslim rights in Jerusalem, and the book's claims are read as its own position."
