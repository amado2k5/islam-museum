  ar: "معجم البلدان لياقوت الحموي (ت 626هـ)، الطبعة الأولى بمطبعة السعادة بالقاهرة (1323هـ/1906م) التي عني بتصحيحها وكتابة المستدرك عليها محمد أمين الخانجي بقراءته على الشيخ أحمد بن الأمين الشنقيطي، في عشرة مجلدات؛ المقروء منها المجلدان الأول والثاني في مسح واحد. الأرقام المذكورة أرقام صفحات المسح."
  en: "The Mu'jam al-buldan of Yaqut al-Hamawi (d. 626 AH), first edition, Matba'at al-Sa'ada, Cairo (1323 AH / 1906 CE), corrected and supplemented by Muhammad Amin al-Khanji, who read it with Shaykh Ahmad ibn al-Amin al-Shinqiti, in ten volumes; the scan read holds volumes 1 and 2. Page numbers cited are scan pages."
