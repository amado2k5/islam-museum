summary:
  ar: "مقالة ويكيبيديا الأردية المختصرة عن خواجة ناظم الدين؛ تعطي مولده ووفاته في دكا ومنصبيه، وتصنفه في زمرتي «باكستانيون شيعة» و«سياسيون شيعة» دون أن يرد في متنها أو صندوق معلوماتها أي ذكر لمذهبه."
  en: "The short Urdu Wikipedia article on Khawaja Nazimuddin; it gives his birth and death at Dhaka and his two offices, and files him under the categories Pakistani Shia and Shia politicians, while neither its text nor its infobox names any school for him."
  es: "El breve artículo de Wikipedia en urdu sobre Khawaja Nazimuddin indica su lugar de nacimiento y muerte en Dhaka, así como sus dos oficinas, y lo clasifica dentro de las categorías de chiítas pakistaníes y políticos chiítas, aunque ni el texto ni el recuadro informativo mencionan ninguna escuela a la que pertenezca."
  fr: "Le court article de Wikipédia en ourdou sur Khawaja Nazimuddin; il indique sa naissance et sa mort à Dhaka ainsi que ses deux fonctions, et le classe dans les catégories Chiite pakistanais et Homme politique chiite, sans que ni son texte ni son infobox ne mentionnent d'établissement scolaire pour lui."
  ur: "خواجہ ناظم الدین پر مختصر اردو ویکیپیڈیا مضمون؛ یہ ڈھاکہ اور اس کے دو دفاتر میں اس کی پیدائش اور موت بتاتا ہے، اور اسے پاکستانی شیعہ اور شیعہ سیاستدانوں کے زمرے کے تحت فائل کرتا ہے، جب کہ اس کے متن اور نہ ہی اس کے معلوماتی خانے میں اس کے لیے کسی اسکول کا نام نہیں ہے۔"
  tr: "Khwaja Nazimuddin hakkında kısa Urduca Wikipedia makalesi, onun Dakka'daki doğumunu ve ölümünü ve iki pozisyonunu veriyor; onu iki gruba ayırıyor: \"Şii Pakistanlılar\" ve \"Şii politikacılar\", içeriğinde veya bilgi kutusunda mezhebine hiç değinmeden."
  id: "Artikel singkat Wikipedia dalam bahasa Urdu tentang Khwaja Nazimuddin menceritakan kelahiran dan kematiannya di Dhaka serta dua posisinya, mengkategorikannya ke dalam dua kelompok: \"Syiah Pakistan\" dan \"Politikus Syiah\" tanpa menyebutkan sektenya dalam konten atau infobox."
