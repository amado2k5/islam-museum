summary:
  ar: "المسالك والممالك لعبيد الله بن خرداذبه صاحب البريد بجبل ⁦(ت نحو 300هـ)⁩، طبعة دي غويه ضمن مكتبة الجغرافيين العرب ⁦(Bibliotheca Geographorum Arabicorum ج ٦، ليدن 1889م)⁩ — مسالك البريد وسجلات الخراج وطرق التجار؛ نسخة رقمية ممسوحة في مكتبة الحصاد المحلية أُجريت عليها قراءة آلية بآبل فيجن."
  en: "Ibn Khurdadhbih's Masalik wa-l-Mamalik, de Goeje's edition in Bibliotheca Geographorum Arabicorum vol. 6 (Leiden 1889) — postal routes, kharaj registers and the merchants' itineraries; scanned and Apple-Vision OCR'd in the local harvest library."
  es: "Masalik wa-l-Mamalik de Ibn Khurdadhbih, edición de De Goeje en Bibliotheca Geographorum Arabicorum vol. 6 (Leiden 1889): rutas postales, registros kharaj e itinerarios de los comerciantes; escaneados y procesados con OCR mediante Apple-Vision en la biblioteca local de Harvest."
  fr: "Ibn Khurdadhbih's Masalik wa-l-Mamalik, de Goeje's edition in Bibliotheca Geographorum Arabicorum vol. 6 (Leiden 1889) — postal routes, kharaj registers and the merchants itinérances; scand and Apple-Vision OCRed in the local harvest library."
  ur: "ابن خرددبیح کا مسالک و الممالک، ببلیوتھیکا جیوگرافورم عربیکورم جلد 1 میں ڈی گوج کا ایڈیشن۔ 6 (Leiden 1889) — ڈاک کے راستے، خاراج رجسٹر اور تاجروں کے سفر کے پروگرام؛ مقامی فصل کی لائبریری میں اسکین اور Apple-Vision OCR'd۔"
  tr: "Al-Masalik wa al-Mamalik, Cebel'deki posta sahibi Ubayd Allah ibn Khordadbeh tarafından (ö. yaklaşık 300 Hicri), de Guy'ın Arap Coğrafyacılar Kütüphanesi'ndeki baskısı (Bibliotheca Geographorum Arabicorum Cilt 6, Leiden 1889) — Posta Yolları, Kharaj Kayıtları ve Tüccar Yolları; yerel Al-Hassad Kütüphanesi'nde taranmış dijital kopyası ve Apple Vision'da otomatik olarak okunmuştur."
  id: "Al-Masalik wa al-Mamalik oleh Ubayd Allah ibn Khordadbeh, pemilik pos di Jabal (wafat sekitar 300 H), edisi de Guy dalam Perpustakaan Geografer Arab (Bibliotheca Geographorum Arabicorum Vol. 6, Leiden 1889) — Rute Pos, Catatan Kharaj, dan Jalan Pedagang; salinan digital hasil scan di Perpustakaan Al-Hassad setempat, yang dibaca secara otomatis di Apple Vision."
