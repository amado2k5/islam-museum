summary:
  ar: "المسالك والممالك لعبيد الله بن خرداذبه صاحب البريد بجبل (ت نحو 300هـ)، طبعة دي غويه ضمن مكتبة الجغرافيين العرب (Bibliotheca Geographorum Arabicorum ج ٦، ليدن 1889م) — مسالك البريد وسجلات الخراج وطرق التجار؛ نسخة رقمية ممسوحة في مكتبة الحصاد المحلية أُجريت عليها قراءة آلية بآبل فيجن."
  en: "Ibn Khurdadhbih's Masalik wa-l-Mamalik, de Goeje's edition in Bibliotheca Geographorum Arabicorum vol. 6 (Leiden 1889) — postal routes, kharaj registers and the merchants' itineraries; scanned and Apple-Vision OCR'd in the local harvest library."
