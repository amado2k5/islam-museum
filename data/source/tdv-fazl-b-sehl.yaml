label: { ar: "الفضل بن سهل — موسوعة TDV الإسلامية ⁦(حقي دورسون يلدز)⁩", en: "FAZL b. SEHL — TDV İslâm Ansiklopedisi (Hakkı Dursun Yıldız)", ur: "فضل بن سهل — ٹی ڈی وی اسلامی انسائیکلوپیڈیا ⁦(حقی دورسون یلدز)⁩" }
summary:
  ar: "مدخل «الفضل بن سهل» في موسوعة TDV الإسلامية التركية: مولده في سرخس خراسان، وأبوه سهل بن زندانفروه الفارسي الزردشتي الذي أسلم بتأثير يحيى بن خالد البرمكي، ودخوله خدمة جعفر بن يحيى البرمكي ثم معلماً للمأمون بعد سقوط البرامكة، وإسلامه سنة 190هـ ⁦(806م)⁩، وكونه محرك الصراع مع الأمين وسبب تتويج المأمون بولاية العهد، وتلقيبه ذا الرياستين أول من جمع السلطتين العسكرية والمدنية، ومقتله في حمام بسرخس سنة 202هـ ⁦(818م)⁩."
  en: "The TDV İslâm Ansiklopedisi entry on al-Fadl ibn Sahl: born at Sarakhs in Khurasan; his father Sehl ibn Zadanfarukh, an Iranian Zoroastrian who converted under Yahya ibn Khalid al-Barmaki's influence; his service under Ja'far ibn Yahya al-Barmaki then as tutor to al-Ma'mun after the Barmakids' fall; his acceptance of Islam in 190 AH / 806 CE; his role in the struggle with al-Amin and in al-Ma'mun's accession; his title Dhu al-Riyasatayn, first to combine military and civil authority; and his murder in a bath at Sarakhs in 202 AH / 818 CE."
  ur: "ٹی ڈی وی اسلامی انسائیکلوپیڈیا کا مدخل «فضل بن سهل»: خراسان کے سرخس میں پیدائش؛ ان کے والد سحل بن زندانفروہ جو ایرانی زرتشتی تھے اور یحییٰ بن خالد برمکی کے اثر سے مسلمان ہوئے؛ جعفر بن یحییٰ برمکی کی خدمت پھر برامکہ کے زوال کے بعد مامون کے استاد بننا؛ 190ھ ⁦(806ء)⁩ میں اسلام قبول کرنا؛ امین کے خلاف جدوجہد اور مامون کی ولی عہدی میں ان کا کردار؛ «ذو الرئاستین» کا لقب — پہلی بار فوجی اور دیوانی اختیار کا حامل؛ اور 202ھ ⁦(818ء)⁩ میں سرخس کے حمام میں قتل۔"
  es: "La entrada de TDV İslâm Ansiklopedisi sobre al-Fadl ibn Sahl: nació en Sarakhs en Jorasán; su padre, Sehl ibn Zadanfarukh, era un zoroastriano iraní que se convirtió bajo la influencia de Yahya ibn Khalid al-Barmaki; su servicio bajo Ja'far ibn Yahya al-Barmaki y luego como tutor de al-Ma'mun después de la caída de los Barmakids; su aceptación del Islam en 190 AH / 806 CE; su papel en la lucha con al-Amin y en la ascensión de al-Ma'mun; su título de Dhu al-Riyasatayn, el primero en combinar autoridad militar y civil; y su asesinato en un baño en Sarakhs en 202 AH / 818 CE."
  fr: "L'article de TDV İslâm Ansiklopedisi sur al-Fadl ibn Sahl: né à Sarakhs au Khorasan; son père Sehl ibn Zadanfarukh, un zoroastrien iranien converti sous l'influence de Yahya ibn Khalid al-Barmaki; son service auprès de Ja'far ibn Yahya al-Barmaki puis comme précepteur d'al-Ma'mun après la chute des Barmakids; sa conversion à l'islam en 190 AH / 806 CE; son rôle dans la lutte contre al-Amin et dans l'accession au pouvoir d'al-Ma'mun; son titre de Dhu al-Riyasatayn, le premier à combiner l'autorité militaire et civile; et son assassinat dans un bain à Sarakhs en 202 AH / 818 CE."
