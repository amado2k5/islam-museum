summary:
  ar: "«دستور تونس، 2022»، كما يُنشر عند: رئاسة الحكومة التونسية، ملف PDF. العنوان ونص الفصل 6 مأخوذان من ملخص بحثي زُوّد به المتحف، ولم يفتح المتحف الصفحة؛ وقد أجاز المؤسس استعمال النص كما ورد في 21 نوفمبر 2026."
  en: "Constitution of Tunisia, 2022, as published at: Presidency of the Government of Tunisia. The address and the wording of Article 6 come from a research summary supplied to the museum, and the museum did not open the page; the founder approved using the wording as supplied on 21 November 2026."
  ur: "Constitution of Tunisia, 2022، جیسا کہ Presidency of the Government of Tunisia پر شائع ہے۔ پتہ اور دفعہ 6 کی عبارت متحف کو فراہم کردہ ایک تحقیقی خلاصے سے لی گئی ہے، اور متحف نے صفحہ نہیں کھولا؛ بانی نے 21 نومبر 2026 کو عبارت کو جیسی ملی اسی طرح استعمال کرنے کی منظوری دی۔"
  fr: "Constitution of Tunisia, 2022, tel que publié à : Presidency of the Government of Tunisia. L'adresse et le texte (article 6) viennent d'un résumé de recherche remis au musée, et le musée n'a pas ouvert la page ; le fondateur a approuvé l'usage du texte tel que fourni le 21 novembre 2026."
  es: "Constitution of Tunisia, 2022, tal como se publica en: Presidency of the Government of Tunisia. La dirección y el texto (artículo 6) proceden de un resumen de investigación entregado al museo, y el museo no abrió la página; el fundador aprobó usar el texto tal como se entregó el 21 de noviembre de 2026."
  tr: "\"Tunus Anayasası, 2022,\" şu adreste yayımlanmıştır: Tunus Hükümeti Başkanlığı, PDF dosyası. Madde 6'nın başlığı ve metni, müze tarafından sağlanan bir araştırma özetinden alınmıştır ve müze sayfayı açmamıştır; kurucu, metnin kullanımına 21 Kasım 2026'da belirtildiği şekilde izin vermiştir."
  id: "\"Konstitusi Tunisia, 2022,\" sebagaimana diterbitkan di: Kepresidenan Pemerintah Tunisia, file PDF. Judul dan teks Pasal 6 diambil dari ringkasan penelitian yang disediakan oleh museum, dan museum tidak membuka halaman tersebut; pendiri mengizinkan penggunaan teks tersebut seperti yang dinyatakan pada 21 November 2026."
