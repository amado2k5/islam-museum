summary:
  ar: "مقالة ويكيبيديا العربية عن ألفا كوندي؛ تُستخدم لوقائع الكيان فقط. تروي رئاسته غينيا منذ 21 ديسمبر 2010 بوصفه رابع رئيس منذ الاستقلال وأول رئيس منتخب ديمقراطيا، وإعادة انتخابه 2015 و2020، والإطاحة به في انقلاب سبتمبر 2021، وعقوده في معارضة نظام لانسانا كونتي. لا تذكر دينه في أي نص."
  en: "Arabic Wikipedia article on Alpha Condé; used for entity facts only. It recounts his presidency of Guinea from 21 December 2010 as the fourth president since independence and the first democratically elected one, his re-elections in 2015 and 2020, his overthrow in the September 2021 coup, and his decades opposing the Lansana Conté regime. Its text says nothing about his religion."
  es: "Artículo en árabe de la Wikipedia sobre Alpha Condé; se utiliza únicamente para obtener información sobre la persona. Relata su presidencia de Guinea desde el 21 de diciembre de 2010 como el cuarto presidente desde la independencia y el primero elegido democráticamente, sus reelecciones en 2015 y 2020, su derrocamiento en el golpe de Estado de septiembre de 2021 y sus décadas de oposición al régimen de Lansana Conté. El texto no menciona su religión."
  fr: "Article de Wikipédia en arabe sur Alpha Condé; utilisé uniquement à des fins d’information sur l’entité. Il retrace sa présidence de la Guinée à partir du 21 décembre 2010, en tant que quatrième président depuis l’indépendance et premier président démocratiquement élu, ses réélections en 2015 et 2020, son renversement lors du coup d’État de septembre 2021 et ses décennies d’opposition au régime de Lansana Conté. Le texte ne mentionne pas sa religion."
  ur: "الفا کونڈے پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 21 دسمبر 2010 سے گیانا کی ان کی صدارت کو آزادی کے بعد سے چوتھے صدر کے طور پر اور جمہوری طور پر منتخب ہونے والے پہلے صدر، 2015 اور 2020 میں ان کے دوبارہ انتخابات، ستمبر 2021 کی بغاوت میں ان کا تختہ الٹنے اور لانسانا کونٹیریگ کی مخالفت کرنے والی دہائیوں کو بیان کرتا ہے۔ اس کا متن اس کے مذہب کے بارے میں کچھ نہیں کہتا۔"
  tr: "Alpha Condé hakkında Arapça Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 21 Aralık 2010'dan bu yana Gine başkanlığını, bağımsızlıktan bu yana dördüncü cumhurbaşkanı ve ilk demokratik olarak seçilmiş cumhurbaşkanı olarak, 2015 ve 2020'de yeniden seçilmesini, Eylül 2021 darbesinde görevden alınmasını ve Lansana Conté rejimine karşı onlarca yıl boyunca mücadelesini anlatır. Dini hiçbir metinde belirtilmemiştir."
  id: "Artikel Wikipedia berbahasa Arab tentang Alpha Condé; digunakan hanya untuk fakta entitas tersebut. Artikel ini menceritakan masa kepresidenannya di Guinea sejak 21 Desember 2010, sebagai presiden keempat sejak kemerdekaan dan presiden pertama yang terpilih secara demokratis, pemilihannya kembali pada 2015 dan 2020, penggulingannya dalam kudeta September 2021, serta puluhan tahun menentang rezim Lansana Conté. Agamanya tidak disebutkan dalam teks apa pun."
