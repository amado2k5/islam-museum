  ar: "مقالة ويكيبيديا العربية عن ألفا كوندي؛ تُستخدم لوقائع الكيان فقط. تروي رئاسته غينيا منذ 21 ديسمبر 2010 بوصفه رابع رئيس منذ الاستقلال وأول رئيس منتخب ديمقراطيا، وإعادة انتخابه 2015 و2020، والإطاحة به في انقلاب سبتمبر 2021، وعقوده في معارضة نظام لانسانا كونتي. لا تذكر دينه في أي نص."
  en: "Arabic Wikipedia article on Alpha Condé; used for entity facts only. It recounts his presidency of Guinea from 21 December 2010 as the fourth president since independence and the first democratically elected one, his re-elections in 2015 and 2020, his overthrow in the September 2021 coup, and his decades opposing the Lansana Conté regime. Its text says nothing about his religion."
