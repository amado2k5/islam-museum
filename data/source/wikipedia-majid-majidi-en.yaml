summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مجيد مجيدي؛ تُستخدم لوقائع الكيان فقط. تذكر في صندوقها أنه وُلد في تالش، وتصف نشأته في طهران ودراسته في معهد الفنون المسرحية، و«أطفال الجنة» أول فيلم إيراني يُرشّح للأوسكار، و«لون الجنة» و«باران» و«أغنية العصافير» و«محمد رسول الله» (2015)، وانسحابه من مهرجان دنماركي احتجاجًا على الرسوم المسيئة. لا تذكر المقالة أي دين له."
  en: "English Wikipedia article on Majid Majidi; used for entity facts only. Its infobox gives his birthplace as Talesh, while its biography text records that he grew up in Tehran and studied at the Institute of Dramatic Arts there; it records Children of Heaven as the first Iranian film nominated for an Academy Award, The Color of Paradise, Baran, The Song of Sparrows and Muhammad: The Messenger of God (2015), and his withdrawal from a Danish film festival in protest at cartoons satirising Muhammad. The article names no religion for him."
  es: "Artículo de la Wikipedia en inglés sobre Majid Majidi; utilizado únicamente para datos sobre la persona. Su ficha informativa indica que nació en Talesh, mientras que su biografía menciona que creció en Teherán y estudió en el Instituto de Artes Dramáticas de esa ciudad. También menciona \"Los niños del cielo\" (la primera película iraní nominada a un premio Óscar), \"El color del paraíso\", \"Baran\", \"El canto de los gorriones\" y \"Mahoma: El mensajero de Dios\" (2015), así como su retirada de un festival de cine danés en protesta por las caricaturas que satirizaban a Mahoma. El artículo no especifica su religión."
  fr: "L'article Wikipédia en anglais consacré à Majid Majidi est utilisé uniquement pour ses informations sur l'entité. Son infobox indique que Talesh est son lieu de naissance, tandis que sa biographie précise qu'il a grandi à Téhéran et étudié à l'Institut des arts dramatiques de cette ville. L'article mentionne également *Les Enfants du ciel* comme le premier film iranien nommé aux Oscars, ainsi que *La Couleur du paradis*, *Baran*, *Le Chant des moineaux* et *Muhammad: Le Messager de Dieu* (2015). Il relate aussi son retrait d'un festival de cinéma danois en signe de protestation contre des caricatures satiriques de Mahomet. L'article ne mentionne aucune religion à son sujet."
  ur: "ماجد مجیدی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کے معلوماتی خانے میں اس کی جائے پیدائش طالش بتائی گئی ہے، جب کہ اس کی سوانح عمری کے متن میں درج ہے کہ وہ تہران میں پلا بڑھا اور وہاں انسٹی ٹیوٹ آف ڈرامیٹک آرٹس میں تعلیم حاصل کی۔ اس میں چلڈرن آف ہیون کو اکیڈمی ایوارڈ کے لیے نامزد ہونے والی پہلی ایرانی فلم کے طور پر ریکارڈ کیا گیا ہے، دی کلر آف پیراڈائز، باران، دی سونگ آف اسپروز اور محمد: دی میسنجر آف گاڈ (2015)، اور محمد پر طنز کرنے والے کارٹونوں کے خلاف احتجاج میں ڈنمارک کے فلمی میلے سے ان کی دستبرداری۔ مضمون میں اس کے لیے کسی مذہب کا نام نہیں ہے۔"
  tr: "Majid Majidi hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Kutusunda Talesh'te doğduğu belirtiliyor ve Tahran'da yetiştirilme tarzını, Sahne Sanatları Enstitüsü'ndeki eğitimini, Oscar'a aday gösterilen ilk İran filmi \"Cennetin Çocukları\", \"Cennetin Rengi\", \"Baran\", \"Kuşların Şarkısı\" ve \"Muhammed: Tanrı'nın Elçisi\" (2015) ile saldırgan karikatürlere karşı protesto olarak Danimarka'daki bir festivalden çekilmesini anlatıyor. Makalede onun herhangi bir dininden bahsedilmiyor."
  id: "Artikel Wikipedia bahasa Inggris tentang Majid Majidi; digunakan hanya untuk fakta entitas tersebut. Di kotaknya tertulis bahwa ia lahir di Talesh dan menggambarkan masa kecilnya di Teheran serta studinya di Institute of Performing Arts, \"Children of Paradise,\" film Iran pertama yang dinominasikan untuk Oscar, \"The Color of Paradise,\" \"Baran,\" \"Song of the Birds,\" dan \"Muhammad: The Messenger of God\" (2015), serta penarikannya dari festival Denmark sebagai protes terhadap kartun yang menyinggung. Artikel tersebut tidak menyebutkan agama apapun miliknya."
