reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. Its infobox gives Talesh, Iran as birthplace, occupations director, producer and screenwriter, years active 1981–present, two children and his website; its lead gives his birth date as 17 April 1959 and his notable works; its biography section records that he was born in a Persian middle-class family, grew up in Tehran, started acting in amateur theatre groups at 14, studied at the Institute of Dramatic Arts in Tehran, acted in Mohsen Makhmalbaf's Boycott (1985), directed Children of Heaven (1997) — the first Iranian film nominated by the Academy — The Color of Paradise (2000), Baran (2001), The Willow Tree (2005) and the documentary Barefoot to Herat, was one of five directors invited for the Vision Beijing project for the 2008 Olympics, pulled out of a Danish film festival 'to protest against insulting any religious belief or icon' after the publication in Denmark of cartoons satirising Muhammad, and directed Muhammad: The Messenger of God (2015), in which Muhammad's face is obscured and never shown. The birthplace in its current infobox (Talesh) conflicts with the Tehran birth given by Wikidata, by iFilm and by many older biographies, which is why his person record carries the birthplace as debated. No religion is named anywhere in the article, which is why his person record's faith segment is unknown."
