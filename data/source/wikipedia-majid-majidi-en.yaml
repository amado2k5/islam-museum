summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن مجيد مجيدي؛ تُستخدم لوقائع الكيان فقط. تذكر في صندوقها أنه وُلد في تالش، وتصف نشأته في طهران ودراسته في معهد الفنون المسرحية، و«أطفال الجنة» أول فيلم إيراني يُرشّح للأوسكار، و«لون الجنة» و«باران» و«أغنية العصافير» و«محمد رسول الله» (2015)، وانسحابه من مهرجان دنماركي احتجاجًا على الرسوم المسيئة. لا تذكر المقالة أي دين له."
  en: "English Wikipedia article on Majid Majidi; used for entity facts only. Its infobox gives his birthplace as Talesh, while its biography text records that he grew up in Tehran and studied at the Institute of Dramatic Arts there; it records Children of Heaven as the first Iranian film nominated for an Academy Award, The Color of Paradise, Baran, The Song of Sparrows and Muhammad: The Messenger of God (2015), and his withdrawal from a Danish film festival in protest at cartoons satirising Muhammad. The article names no religion for him."
