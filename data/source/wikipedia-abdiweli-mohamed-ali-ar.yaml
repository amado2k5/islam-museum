summary:
  ar: "مقالة ويكيبيديا العربية عن عبد الولي محمد علي غاس؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في 2 يوليو 1965 ورئاسته وزراء الصومال (2011–2012) ورئاسته بونتلاند. خانة الديانة في صندوقها فارغة، ولا يذكر النص دينه شخصيا ولا مدرسته."
  en: "Arabic Wikipedia article on Abdiweli Mohamed Ali Gaas; used for entity facts only. It recounts his birth on 2 July 1965, his premiership of Somalia (2011–2012) and his presidency of Puntland. Its infobox religion field is empty and the text does not discuss his own religion or school."
  es: "Artículo de Wikipedia en árabe sobre Abdiweli Mohamed Ali Gaas; se utiliza únicamente para obtener información sobre la persona. Relata su nacimiento el 2 de julio de 1965, su mandato como primer ministro de Somalia (2011-2012) y su presidencia de Puntlandia. El campo de religión de su ficha informativa está vacío y el texto no menciona su religión ni su escuela."
  fr: "L'article de Wikipédia en arabe consacré à Abdiweli Mohamed Ali Gaas, utilisé uniquement à des fins d'information sur l'entité, relate sa naissance le 2 juillet 1965, son mandat de Premier ministre de Somalie (2011-2012) et sa présidence du Puntland. L'encadré « Religion » est vide et le texte n'aborde ni sa religion ni son école."
  ur: "عبدویلی محمد علی گاس پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 2 جولائی 1965 کو ان کی پیدائش، صومالیہ کی پریمیئر شپ (2011–2012) اور پنٹ لینڈ کی صدارت کا ذکر ہے۔ اس کا انفو باکس مذہب کا میدان خالی ہے اور متن میں اس کے اپنے مذہب یا مکتب پر بحث نہیں کی گئی ہے۔"
  tr: "Abdul Wali Muhammad Ali Gass hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 2 Temmuz 1965'teki doğumunu, Somali Başbakanlığı (2011–2012) ve Puntland başkanlığını anlatır. Kutudaki din bölümü boştur ve metinde şahsen dininden veya okulundan bahsedilmez."
  id: "Artikel Wikipedia Arab tentang Abdul Wali Muhammad Ali Gass; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya pada 2 Juli 1965, masa jabatannya sebagai Perdana Menteri Somalia (2011–2012), dan masa kepresidenannya di Puntland. Bagian agama di kotaknya kosong, dan teksnya tidak menyebutkan agamanya secara pribadi maupun sekolahnya."
