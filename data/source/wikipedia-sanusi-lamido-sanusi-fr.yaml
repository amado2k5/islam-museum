summary:
  ar: "مقالة ويكيبيديا الفرنسية عن سانوسي لاميدو سانوسي؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في 31 يوليو 1961 بكانو ومحافظته للبنك المركزي وإمارته، وتقول إنه بصفته أميرا يقود الجماعة الصوفية في نيجيريا المتجمعة في فرع التيجانية."
  en: "French Wikipedia article on Sanusi Lamido Sanusi; used for entity facts only. It gives his birth on 31 July 1961 in Kano, his central-bank governorship and his emirate, and says that as emir he leads Nigeria's Sufi community gathered in the Tijaniyya branch."
  es: "Artículo de la Wikipedia en francés sobre Sanusi Lamido Sanusi; utilizado únicamente para datos sobre la persona. Indica su fecha de nacimiento, el 31 de julio de 1961 en Kano, su cargo como gobernador del banco central y su emirato, y afirma que, como emir, lidera la comunidad sufí de Nigeria reunida en la rama Tijaniyya."
  fr: "Article de Wikipédia en français sur Sanusi Lamido Sanusi; utilisé uniquement pour les informations sur l'entité. Il indique sa naissance le 31 juillet 1961 à Kano, son poste de gouverneur de la banque centrale et son émirat, et précise qu'en tant qu'émir, il dirige la communauté soufie du Nigeria, rassemblée dans la branche Tijaniyya."
  ur: "Sanusi Lamido Sanusi پر فرانسیسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 31 جولائی 1961 کو کانو میں اس کی مرکزی بینک کی گورنر شپ اور اس کی امارت میں جنم لیتا ہے، اور کہتا ہے کہ بطور امیر وہ تیجانیہ برانچ میں جمع ہونے والی نائیجیریا کی صوفی برادری کی قیادت کرتا ہے۔"
  tr: "Sanusi Lamidou Sanusi hakkında Fransızca Vikipedi makalesi; sadece varlık bilgileri için kullanılmıştır. 31 Temmuz 1961'de Kano'da doğduğunu, merkez bankası valiliğini ve emirliğini belirtir ve bir prens olarak Nijerya'daki Tijaniya şubesinde toplanan Sufi topluluğuna liderlik ettiğini belirtir."
  id: "Artikel Wikipedia Prancis tentang Sanusi Lamidou Sanusi; hanya digunakan untuk fakta entitas. Artikel tersebut menyebutkan kelahirannya pada 31 Juli 1961 di Kano, masa jabatannya sebagai gubernur bank sentral, dan emiratnya, serta menyatakan bahwa sebagai pangeran, ia memimpin komunitas Sufi di Nigeria yang berkumpul di cabang Tijaniya."
