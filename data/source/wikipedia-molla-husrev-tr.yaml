summary:
  ar: "مقالة ويكيبيديا التركية عن الملا خسرو، مراجعة 1 آب 2026؛ أغنى المقالات عنه: اسمه محمد بن فراموز من قبيلة الورساق التركمانية، ونشأته عند صهره خسرو، وإجازته من يوسف بالي ببورصة، وقضاؤه العسكري سنة 1429، وقضاؤه بإسطنبول بعد وفاة خضر بك سنة 863/1459، واعتزاله إلى بورصة حيث كتب «الدرر»، ثم مفتياً بإسطنبول حتى وفاته سنة 1480 ودفنه بوصيته في مدرسته ببورصة."
  en: "Turkish Wikipedia article on Molla Hüsrev, revision of 1 August 2026; the fullest of the Wikipedia articles — his name Mehmed b. Ferâmûz of the Varsak Turkmen, his upbringing by his brother-in-law Hüsrev, his ijaza from Yûsuf Bâlî at Bursa, his kazasker appointment in 1429, his appointment as qadi of Istanbul on Hızır Bey's death in 863/1459, his withdrawal to Bursa where he wrote the Dürer, and his tenure as mufti of Istanbul until his death in 1480, when he was buried by his will at his Bursa madrasa."
