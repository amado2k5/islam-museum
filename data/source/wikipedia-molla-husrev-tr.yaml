reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). The article rests chiefly on Ferhat Koca's TDV İslâm Ansiklopedisi entry, and is valuable for its explicit correction of the older biographical tradition: Taşköprülüzâde's phrase ümerâ-i Ferâsiha ('the commanders of the Varangians') was misread and mis-translated as 'of the Franks', which is how Molla Hüsrev's father came to be described in derivative sources as a Frankish or Rum amir who converted. Its infobox gives death in 1480 at Istanbul and burial at Bursa but no birth date; its text names no legal school for him. Read live on 1 November 2026; the article's own page property grounds Wikidata item Q12244864."
