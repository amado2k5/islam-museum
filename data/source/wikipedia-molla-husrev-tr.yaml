summary:
  ar: "مقالة ويكيبيديا التركية عن الملا خسرو، مراجعة 1 آب 2026؛ أغنى المقالات عنه: اسمه محمد بن فراموز من قبيلة الورساق التركمانية، ونشأته عند صهره خسرو، وإجازته من يوسف بالي ببورصة، وقضاؤه العسكري سنة 1429، وقضاؤه بإسطنبول بعد وفاة خضر بك سنة 863/1459، واعتزاله إلى بورصة حيث كتب «الدرر»، ثم مفتياً بإسطنبول حتى وفاته سنة 1480 ودفنه بوصيته في مدرسته ببورصة."
  en: "Turkish Wikipedia article on Molla Hüsrev, revision of 1 August 2026; the fullest of the Wikipedia articles — his name Mehmed b. Ferâmûz of the Varsak Turkmen, his upbringing by his brother-in-law Hüsrev, his ijaza from Yûsuf Bâlî at Bursa, his kazasker appointment in 1429, his appointment as qadi of Istanbul on Hızır Bey's death in 863/1459, his withdrawal to Bursa where he wrote the Dürer, and his tenure as mufti of Istanbul until his death in 1480, when he was buried by his will at his Bursa madrasa."
  es: "Artículo de la Wikipedia en turco sobre Molla Hüsrev, revisión del 1 de agosto de 2026; el más completo de los artículos de Wikipedia: su nombre Mehmed b. Ferâmûz de los turcomanos de Varsak, su crianza por su cuñado Hüsrev, su ijaza de Yûsuf Bâlî en Bursa, su nombramiento como kazasker en 1429, su nombramiento como cadí de Estambul tras la muerte de Hızır Bey en 863/1459, su retiro a Bursa donde escribió el Durero, y su mandato como muftí de Estambul hasta su muerte en 1480, cuando fue enterrado según su testamento en su madrasa de Bursa."
  fr: "Article de Wikipédia en turc sur Molla Hüsrev, révision du 1er août 2026; l’article le plus complet de Wikipédia — son nom Mehmed b. Ferâmûz, issu de la tribu turkmène de Varsak, son éducation par son beau-frère Hüsrev, son ijaza délivré par Yûsuf Bâlî à Bursa, sa nomination comme kazasker en 1429, sa nomination comme cadi d’Istanbul à la mort de Hızır Bey en 863/1459, son retrait à Bursa où il écrivit le Dürer, et son mandat de mufti d’Istanbul jusqu’à sa mort en 1480, date à laquelle il fut enterré, conformément à ses dernières volontés, dans sa madrasa de Bursa."
  ur: "مولا حسریف پر ترکی ویکیپیڈیا مضمون، 1 اگست 2026 کی نظر ثانی؛ ویکیپیڈیا کے تمام مضامین — اس کا نام محمد ب۔ ورسک ترکمان کا فیرموز، اس کی پرورش اس کے بہنوئی حسریو نے کی، برصا میں یوسف بالی سے اس کا اعجاز، 1429 میں اس کی قازق تقرری، اس کی استنبول کے قاضی کے طور پر تقرری، حزیر بے کی وفات پر 863/14 میں اس کی واپسی، برصا میں اس کی واپسی اور برصغیر میں اس کی واپسی لکھی۔ 1480 میں اپنی وفات تک استنبول کے مفتی کی حیثیت سے کام کیا، جب انہیں ان کے برسا مدرسہ میں ان کی وصیت سے دفن کیا گیا۔"
  tr: "Molla Hüsraw hakkında Türkçe Vikipedi makalesi, revizyon 1 Ağustos 2026; Hakkında en zengin makaleler şunlardır: Adı Varsaq Türkmen kabilesinden Muhammed ibn Faramuz, kayınbiraderi Hüzrav'ın yanında yetiştirilmesi, Bursa'daki Yusuf Bali'den aldığı yetki, 1429'da askeri yargısı, 863/1459'da Hidr Bey'in ölümünden sonra İstanbul'daki kararı, Bursa'ya çekilip 'Al-Durar'ı yazması, ardından 1480'deki ölümüne kadar İstanbul'da müftü olarak görev yapması ve vasiyetine göre Bursa'daki okulunda defnedilmesi."
  id: "Artikel Wikipedia Turki tentang Mulla Khusraw, revisi 1 Agustus 2026; Artikel terkaya tentang dirinya adalah: Namanya Muhammad ibn Faramuz dari suku Turkmen Warsaq, masa kecilnya di bawah saudara iparnya Khusraw, otorisasi dari Yusuf Bali di Bursa, kehakiman militernya pada 1429, penghakimannya di Istanbul setelah kematian Khidr Bey pada 863/1459, pensiun ke Bursa di mana dia menulis 'Al-Durar', kemudian dia melayani sebagai mufti di Istanbul hingga kematiannya pada 1480, dan dimakamkan sesuai wasiatnya di sekolahnya di Bursa."
