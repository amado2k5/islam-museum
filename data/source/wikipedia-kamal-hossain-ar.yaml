summary:
  ar: "مقالة ويكيبيديا العربية عن كمال حسين؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته القانونية والسياسية في بنغلاديش، ومنها دفاعه عن عبد الحميد خان بهشاني في قضية أمر بالمثول أمام القضاء، ولا تذكر له ديانة ولا مذهبًا."
  en: "Arabic Wikipedia article on Kamal Hossain; used for entity facts only. It recounts his legal and political career in Bangladesh, including his defence of Abdul Hamid Khan Bhashani in a habeas corpus case, and names no religion or school for him."
  es: "Artículo en árabe de la Wikipedia sobre Kamal Hossain; utilizado únicamente para datos sobre la persona. Relata su trayectoria jurídica y política en Bangladesh, incluyendo su defensa de Abdul Hamid Khan Bhashani en un caso de hábeas corpus, y no menciona ninguna religión ni escuela a la que pertenezca."
  fr: "Article de Wikipédia en arabe sur Kamal Hossain; utilisé uniquement à des fins d’information sur l’entité. Il relate sa carrière juridique et politique au Bangladesh, notamment sa défense d’Abdul Hamid Khan Bhashani dans une affaire d’habeas corpus, sans mentionner sa religion ni son école."
  ur: "کمال حسین پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں بنگلہ دیش میں ان کے قانونی اور سیاسی کیرئیر کا ذکر ہے، جس میں عبدالحمید خان بھاشانی کا حبیس کارپس کیس میں دفاع بھی شامل ہے، اور ان کے لیے کسی مذہب یا اسکول کا نام نہیں لیا گیا ہے۔"
  tr: "Kamal Hüseyin hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Bangladeş'teki hukuki ve siyasi kariyerini, Abdul Hamid Khan Bhashani'nin yargı önüne çıkmasını emrettiği davada savunmasını anlatır ve onun adına herhangi bir din veya mezhepten bahsetmez."
  id: "Artikel Wikipedia berbahasa Arab tentang Kamal Hussein; digunakan hanya untuk fakta entitas. Artikel ini menceritakan karier hukum dan politiknya di Bangladesh, termasuk pembelaannya terhadap Abdul Hamid Khan Bhashani dalam kasus yang memerintahkan kehadirannya di hadapan pengadilan, dan tidak menyebutkan agama atau sekte apapun untuknya."
