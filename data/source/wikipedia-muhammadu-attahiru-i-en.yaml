reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. The article names him twelfth Sultan of the Sokoto Caliphate, reigning 13 October 1902 to 15 March 1903, son of Ahmadu Atiku per its infobox, and the last independent Sultan before the British takeover; its text (citing Falola's Historical Dictionary of Nigeria, 2009, and a Daily Trust report) gives his death at the battle of Mbormi on 29 July 1903, while its infobox gives August 1903 — both are recorded in the person record. It gives no birth date (the article is filed under 'Year of birth missing') and makes no statement of his religion or madhhab in text or infobox."
