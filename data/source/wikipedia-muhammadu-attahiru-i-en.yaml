  ar: "مقالة ويكيبيديا الإنجليزية عن محمد الطاهر الأول، السلطان الثاني عشر لخلافة صكتو؛ تُستخدم لوقائع الكيان فقط. تروي حكمه القصير من أكتوبر 1902، ومقاومته للتقدم البريطاني، وهجرته من صكتو، ومقتله في مبورمي في 29 يوليو 1903."
  en: "English Wikipedia article on Muhammadu Attahiru I, twelfth Sultan of Sokoto; used for entity facts only. It recounts his short reign from October 1902, his resistance to the British advance, his flight from Sokoto as a hijra, and his death at Mbormi on 29 July 1903."
