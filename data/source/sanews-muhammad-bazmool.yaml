summary:
  ar: "خبر «السعودية نيوز» ⁦(30 يونيو 2022)⁩ عن تكليف مفتي عام المملكة عددا من المشايخ للرد على استفسارات الحجاج في موسم حج 1443هـ، ومنهم محمد بازمول مفوض الإفتاء بمنطقة مكة المكرمة."
  en: "Saudi News report (30 June 2022) on the Grand Mufti's commissioning of scholars to answer pilgrims' questions in the Hajj season of 1443 AH, naming Muhammad Bazmool as ifta commissioner for the Makkah Region."
  es: "Según un informe de Saudi News (30 de junio de 2022), el Gran Muftí encargó a varios eruditos que respondieran a las preguntas de los peregrinos durante la temporada del Hajj de 1443 AH, nombrando a Muhammad Bazmool como comisionado de ifta para la región de La Meca."
  fr: "Rapport de Saudi News (30 juin 2022) sur la nomination par le Grand Mufti de savants chargés de répondre aux questions des pèlerins pendant la saison du Hajj de 1443 AH, nommant Muhammad Bazmool commissaire ifta pour la région de La Mecque."
  ur: "سعودی نیوز کی رپورٹ ⁦(30 جون 2022)⁩ مفتی اعظم کی جانب سے 1443 ہجری کے حج سیزن میں حجاج کے سوالات کے جوابات دینے کے لیے علماء کی کمیشننگ پر، محمد بازمول کو مکہ مکرمہ ریجن کا افتا کمشنر نامزد کیا گیا۔"
