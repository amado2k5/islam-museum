  ar: "مقالة ويكيبيديا الإنجليزية عن أديب إسحاق؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في دمشق وتعليمه في مدرسة اللعازريين، وعمله في الجمارك والصحافة، وتتلمذه على جمال الدين الأفغاني، وتأسيسه «مصر القاهرة» في باريس، ووفاته في الحدث بلبنان."
  en: "English Wikipedia article on Adib Ishaq; used for entity facts only. It recounts his Damascus childhood and Lazarist schooling, his customs and journalism work, his discipleship under Jamal al-Din al-Afghani, his Paris journal Misr al-Qahira, and his death at al-Hadath in Lebanon."
