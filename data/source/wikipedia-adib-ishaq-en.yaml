reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. The article is internally divided on his death: the lead gives 12 June 1885 citing Khayati, while its own infobox and categories give 1884; the lead date is followed and the conflict preserved in his record. On religion the text names no affiliation for him: he is a Syrian-Armenian journalist, schooled by the Lazarists. Its bibliography lists Mustapha Khayati's study of him under the title 'Un disciple libre penseur de Al-Afghani' ('a free-thinking disciple of al-Afghani') — a description of his thought, not an affiliation."
