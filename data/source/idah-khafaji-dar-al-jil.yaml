reliability_note: "Read on 21 Nov 2026 in the Shamela library copy (https://shamela.ws/book/7380), which states that its numbering follows the printed edition; volume and page are those the Shamela page displays and were not checked against a paper copy. The text is al-Qazwini's with Khafaji's long commentary and footnotes mixed in the same page; the museum attributes each statement to the one who makes it. The copy read holds three volumes and the index of volume 3 (p.237) lists only topics of the science of ma'ani (qasr, insha', wasl and fasl, ijaz and itnab) and appendices; the parts on bayan and badi' that the book announces were not found in this copy. The year of the edition is not shown on the Shamela page."
