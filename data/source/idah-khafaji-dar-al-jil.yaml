summary:
  ar: "كتاب الإيضاح في علوم البلاغة للخطيب القزويني، بشرح محمد عبد المنعم خفاجي، دار الجيل؛ قُرئ في نسخة المكتبة الشاملة في 21 نوفمبر 2026، في موضوع: تقسيم علوم البلاغة إلى المعاني والبيان والبديع وتعريف علم المعاني وأبوابه الثمانية ⁦(ج1 ص7 و17 و41 و48-55)⁩. والنسخة المقروءة لا تحمل قسمي البيان والبديع."
  en: "al-Idah fi Ulum al-Balagha by al-Khatib al-Qazwini with Muhammad Abd al-Mun'im Khafaji's commentary, Dar al-Jil; read on 21 November 2026 in the Shamela library copy for the division of the sciences of eloquence into ma'ani, bayan and badi', and the definition of ma'ani and its eight chapters (vol. 1, pp.7, 17, 41, 48-55). The copy read does not carry the sections on bayan and badi'."
  ur: "الخطیب القزوینی کی الإیضاح فی علوم البلاغة، محمد عبد المنعم خفاجی کی شرح کے ساتھ، دار الجیل؛ 21 نومبر 2026 کو المکتبۃ الشاملہ کے نسخے میں پڑھی گئی، علوم بلاغت کی معانی، بیان اور بدیع میں تقسیم اور علم معانی کی تعریف اور اس کے آٹھ ابواب کے لیے ⁦(ج1 ص7، 17، 41، 48-55)⁩۔ پڑھے گئے نسخے میں بیان اور بدیع کے حصے نہیں ہیں۔"
  fr: "al-Idah fi Ulum al-Balagha d'al-Khatib al-Qazwini avec le commentaire de Muhammad Abd al-Mun'im Khafaji, Dar al-Jil ; lu le 21 novembre 2026 dans la copie de la bibliothèque Shamela pour la division des sciences de l'éloquence en ma'ani, bayan et badi', et la définition des ma'ani et de ses huit chapitres (vol. 1, pp. 7, 17, 41, 48-55). La copie lue ne contient pas les parties sur le bayan et le badi'."
  es: "al-Idah fi Ulum al-Balagha de al-Khatib al-Qazwini con el comentario de Muhammad Abd al-Mun'im Khafaji, Dar al-Jil; leído el 21 de noviembre de 2026 en la copia de la biblioteca Shamela para la división de las ciencias de la elocuencia en ma'ani, bayan y badi', y la definición de los ma'ani y sus ocho capítulos (vol. 1, pp. 7, 17, 41, 48-55). La copia leída no contiene las partes sobre bayan y badi'."
  tr: "Al-Khatib Al-Qazwini tarafından yazılmış Al-Idhah fi Uloom al-Balagha kitabı, açıklaması Muhammed Abdul Munim Khafaji, Dar Al-Jeel; 21 Kasım 2026 tarihli Al-Maktaba Al-Shamela baskısında okunmuştur: Retorik Bilimlerinin Anlamlar, Konuşma, Retorik ve Anlamlar Bilimi ile Sekiz Bölümü Tanımı (Cilt 1, ss. 7, 17, 41, 48-55). Okunabilir versiyonda hitabet ve hitabet bölümleri yer almamaktadır."
  id: "Buku Al-Idhah fi Uloom al-Balagha oleh Al-Khatib Al-Qazwini, dengan penjelasan oleh Muhammad Abdul Munim Khafaji, Dar Al-Jeel; dibaca dalam edisi Al-Maktaba Al-Shamela pada 21 November 2026, dengan topik: Pembagian Ilmu Retorika menjadi Makna, Keelokan, Retorika, dan Definisi Ilmu Makna serta Delapan Babnya (Vol. 1, hlm. 7, 17, 41, 48-55). Versi yang dapat dibaca tidak memuat bagian kefasihan dan retorika."
