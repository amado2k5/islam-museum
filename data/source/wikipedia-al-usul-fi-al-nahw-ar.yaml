summary:
  ar: "صفحة «الأصول في النحو» في ويكيبيديا العربية، وهي الصفحة الموثِّقة التي سماها ملخص بحثي قُدّم إلى المتحف للكتاب «الأصول في النحو»؛ لم يفتح المتحف الصفحة، وقد أجاز المؤسس استعمال الملخص دون إعادة تحقق في 21 نوفمبر 2026، في موضوع: نسبة الكتاب إلى مؤلفه وتاريخه."
  en: "The page \"الأصول في النحو\" on the Arabic Wikipedia, named by a research summary supplied to the museum as the documenting page for al-Usul fi al-Nahw; the museum did not open the page, and the founder approved using the summary without re-verification on 21 November 2026, for the ascription of the work to its author and its date."
  ur: "عربی ویکیپیڈیا پر صفحہ «الأصول في النحو»، جسے عجائب گھر کو دیے گئے ایک تحقیقی خلاصے نے «الاصول فی النحو» کا مستند صفحہ بتایا؛ عجائب گھر نے صفحہ نہیں کھولا، اور بانی نے 21 نومبر 2026 کو دوبارہ تصدیق کے بغیر خلاصے کے استعمال کی منظوری دی، موضوع: کتاب کی مصنف سے نسبت اور اس کی تاریخ۔"
  fr: "La page « الأصول في النحو » de Wikipédia (arabe), nommée par un résumé de recherche remis au musée comme page documentaire de al-Usul fi al-Nahw ; le musée n'a pas ouvert la page, et le fondateur a approuvé l'usage du résumé sans nouvelle vérification le 21 novembre 2026, pour l'attribution de l'ouvrage à son auteur et sa date."
  es: "La página «الأصول في النحو» de Wikipedia (en árabe), nombrada por un resumen de investigación entregado al museo como página documental de al-Usul fi al-Nahw; el museo no abrió la página, y el fundador aprobó usar el resumen sin nueva verificación el 21 de noviembre de 2026, para la atribución de la obra a su autor y su fecha."
  tr: "Arapça Vikipedi'deki \"Dilbilgisinde Kökenler\" sayfası, \"Dilbilgisinde Kökenler\" kitabı için müzeye sunulan araştırma özeti olarak belgelenmiş sayfa; müze sayfayı açmadı ve kurucu, 21 Kasım 2026'da özetin yeniden doğrulama yapılmadan kullanılmasına izin verdi: kitabın yazarına ve tarihine atfedilmesi."
  id: "Halaman \"Asal-usul dalam Tata Bahasa\" di Wikipedia bahasa Arab, yang merupakan halaman terdokumentasi yang disebut ringkasan penelitian yang diajukan ke museum untuk buku \"Origins in Grammar\"; museum tidak membuka halaman tersebut, dan pendiri mengizinkan penggunaan ringkasan tanpa verifikasi ulang pada 21 November 2026, dalam topik: atribusi buku kepada penulisnya dan sejarahnya."
