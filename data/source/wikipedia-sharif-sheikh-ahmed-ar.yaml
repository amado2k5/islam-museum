  ar: "مقالة ويكيبيديا العربية عن شريف شيخ أحمد؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في 25 يوليو 1964 قرب مهداي في أسرة صوفية كان والده فيها من أتباع الطريقة الإدريسية، ورئاسته اتحاد المحاكم الإسلامية ثم رئاسته للصومال (2009–2012). خانة الدين في صندوقها «مسلم» بلا فرع، وخلفية أسرته الصوفية خلفية لا شهادة شخصية."
  en: "Arabic Wikipedia article on Sharif Sheikh Ahmed; used for entity facts only. It recounts his birth on 25 July 1964 near Mahaday in a Sufi family whose father followed the Idrisiyya order, his chairmanship of the Islamic Courts Union and his presidency of Somalia (2009–2012). Its infobox religion field gives 'Muslim' with no branch; the family's Sufi background is background, not a personal attestation."
