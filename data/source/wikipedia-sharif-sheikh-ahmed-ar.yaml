summary:
  ar: "مقالة ويكيبيديا العربية عن شريف شيخ أحمد؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في 25 يوليو 1964 قرب مهداي في أسرة صوفية كان والده فيها من أتباع الطريقة الإدريسية، ورئاسته اتحاد المحاكم الإسلامية ثم رئاسته للصومال (2009–2012). خانة الدين في صندوقها «مسلم» بلا فرع، وخلفية أسرته الصوفية خلفية لا شهادة شخصية."
  en: "Arabic Wikipedia article on Sharif Sheikh Ahmed; used for entity facts only. It recounts his birth on 25 July 1964 near Mahaday in a Sufi family whose father followed the Idrisiyya order, his chairmanship of the Islamic Courts Union and his presidency of Somalia (2009–2012). Its infobox religion field gives 'Muslim' with no branch; the family's Sufi background is background, not a personal attestation."
  es: "Artículo de Wikipedia en árabe sobre Sharif Sheikh Ahmed; utilizado únicamente para datos sobre la persona. Relata su nacimiento el 25 de julio de 1964 cerca de Mahaday en una familia sufí cuyo padre seguía la orden Idrisiyya, su presidencia de la Unión de Tribunales Islámicos y su presidencia de Somalia (2009-2012). El campo de religión de su ficha informativa indica «musulmán» sin especificar la rama; los antecedentes sufíes de la familia se mencionan como información general, no como una afirmación personal."
  fr: "Article Wikipédia en arabe sur Sharif Sheikh Ahmed; utilisé uniquement à titre informatif. Il relate sa naissance le 25 juillet 1964 près de Mahaday, au sein d’une famille soufie dont le père était membre de l’ordre Idrisiyya, sa présidence de l’Union des tribunaux islamiques et sa présidence de la Somalie (2009-2012). L’infobox « Religion » indique « Musulman » sans précision; l’appartenance à l’ordre soufi familial est mentionnée à titre d’information et non comme une attestation personnelle."
  ur: "شریف شیخ احمد پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 25 جولائی 1964 کو مہادے کے قریب ایک صوفی گھرانے میں ان کی پیدائش کا ذکر کرتا ہے جس کے والد نے ادریسیہ کے حکم کی پیروی کی، اس کی اسلامی عدالت یونین کی چیئرمین شپ اور صومالیہ کی ان کی صدارت (2009-2012)۔ اس کا infobox مذہب کا میدان 'مسلم' دیتا ہے جس کی کوئی شاخ نہیں ہے۔ خاندان کا صوفی پس منظر پس منظر ہے، ذاتی تصدیق نہیں۔"
  tr: "Şerif Şeyh Ahmed hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 25 Temmuz 1964'te, Mahdai yakınlarında, babasının İdrisi tarikatına mensup olduğu bir Sufi ailede doğduğunu anlatır; İslam Mahkemeleri Birliği'nin başında ve ardından Somali'nin başı olmuştur (2009–2012). Din kutusu \"Müslüman\" olarak adlandırılır ve onun Sufi aile geçmişi kişisel bir tanıklıktan çok arka plandır."
  id: "Artikel Wikipedia Arab tentang Sharif Sheikh Ahmed; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya pada 25 Juli 1964, dekat Mahdai, dalam keluarga Sufi di mana ayahnya adalah pengikut ordo Idrisi, dan ia memimpin Persatuan Pengadilan Islam lalu menjadi kepala Somalia (2009–2012). Kotak agama adalah \"Muslim\" tanpa cabang, dan latar belakang keluarga Sufinya adalah latar belakang, bukan kesaksian pribadi."
