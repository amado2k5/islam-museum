label:
  ar: سفير الإسلام إلى سائر الأقوام — محمد فريد وجدي
  en: "Safir al-Islam ila Sa'ir al-Aqwam (The Ambassador of Islam to All Peoples) — Muhammad Farid Wajdi"
summary:
  ar: "كتاب الأستاذ محمد فريد وجدي، ضمن السلسلة العلمية لمجمع البحوث الإسلامية بالأزهر الشريف، يضم تصديراً لمجمع البحوث، وذكريات عن المؤلف بقلم طاهر الطناحي، ورسالة كتبها وجدي لمؤتمر أديان زُعم أنه سيُعقد في طوكيو سنة ١٩٠٧م، تقرر أن الإسلام دين الأنبياء المشترك لا دين جديد؛ 52 صفحة، إشراف الأمين العام للمجمع."
  en: "Muhammad Farid Wajdi's book in the Scientific Series of the Islamic Research Academy of al-Azhar. It has a foreword by the Academy, a memoir of Wajdi by Tahir al-Tanahi, and a message Wajdi wrote for a religions congress announced for Tokyo in 1907: Islam is the shared religion of all prophets, not a new religion; 52 pages, supervised by the Academy's Secretary-General."
  es: "Libro de Muhammad Farid Wajdi en la Serie Científica de la Academia de Investigación Islámica de al-Azhar. Tiene un prólogo de la Academia, unas memorias de Wajdi escritas por Tahir al-Tanahi y un mensaje que Wajdi escribió para un congreso religioso anunciado en Tokio en 1907: el Islam es la religión compartida de todos los profetas, no una religión nueva; 52 páginas, supervisadas por el Secretario General de la Academia."
  fr: "Le livre de Muhammad Farid Wajdi dans la série scientifique de l'Académie de recherche islamique d'al-Azhar. Il contient un avant-propos de l'Académie, des mémoires de Wajdi par Tahir al-Tanahi et un message que Wajdi a écrit pour un congrès des religions annoncé à Tokyo en 1907: L'Islam est la religion commune à tous les prophètes, pas une nouvelle religion; 52 pages, supervisé par le Secrétaire Général de l'Académie."
  ur: "اسلامک ریسرچ اکیڈمی آف الازہر کی سائنسی سیریز میں محمد فرید وجدی کی کتاب۔ اس میں اکیڈمی کا ایک پیش لفظ ہے، طاہر التناہی کی وجدی کی یادداشت، اور ایک پیغام وجدی نے 1907 میں ٹوکیو میں ہونے والی مذاہب کی کانگریس کے لیے لکھا ہے: اسلام تمام انبیاء کا مشترکہ مذہب ہے، کوئی نیا مذہب نہیں۔ اکیڈمی کے سیکرٹری جنرل کی زیر نگرانی 52 صفحات۔"
  tr: "Profesör Muhammed Farid Wagdi'nin kitabı, El-Ezher'deki İslami Araştırma Akademisi'nin bilimsel serisinin bir parçası, Araştırma Akademisi'nden bir önsöz, Tahir Al-Tanahi'nin yazarla ilgili anıları ve 1907'de Tokyo'da düzenlendiği iddia edilen bir dini konferans için Wajdi'nin yazdığı, İslam'ı peygamberlerin ortak dini olarak kabul eden bir mektubu içerir; 52 sayfa, Akademi Genel Sekreteri tarafından denetlenir."
  id: "Buku karya Profesor Muhammad Farid Wagdi, bagian dari seri ilmiah Akademi Riset Islam di Al-Azhar, memuat kata pengantar dari Akademi Riset, kenangan tentang penulis oleh Taher Al-Tanahi, dan surat yang ditulis oleh Wajdi untuk konferensi agama yang diklaim diadakan di Tokyo pada tahun 1907, yang menetapkan Islam sebagai agama bersama para nabi, bukan agama baru; 52 halaman, diawasi oleh Sekretaris Jenderal Akademi."
