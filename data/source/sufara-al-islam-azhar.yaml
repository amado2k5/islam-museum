summary:
  ar: "كتاب الأستاذ محمد فريد وجدي، ضمن السلسلة العلمية لمجمع البحوث الإسلامية بالأزهر الشريف، يضم تصديراً لمجمع البحوث، وذكريات عن المؤلف بقلم طاهر الطناحي، ورسالة كتبها وجدي لمؤتمر أديان زُعم أنه سيُعقد في طوكيو سنة ١٩٠٧م، تقرر أن الإسلام دين الأنبياء المشترك لا دين جديد؛ 52 صفحة، إشراف الأمين العام للمجمع."
  en: "Muhammad Farid Wajdi's book in the Scientific Series of the Islamic Research Academy of al-Azhar. It has a foreword by the Academy, a memoir of Wajdi by Tahir al-Tanahi, and a message Wajdi wrote for a religions congress announced for Tokyo in 1907: Islam is the shared religion of all prophets, not a new religion; 52 pages, supervised by the Academy's Secretary-General."
