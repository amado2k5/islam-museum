label:
  ar: "ابن حزم، المحلى بالآثار، المجلد الثالث ⁦(دار ابن حزم، بيروت، ط1، 1437هـ/2016م)⁩"
  en: "Ibn Hazm, al-Muhalla bi-l-Athar, vol. 3 (Dar Ibn Hazm, Beirut, 1st ed., 1437/2016)"
  ur: "ابن حزم، المحلی بالآثار، جلد سوم ⁦(دار ابن حزم، بیروت، طبع اول، 1437ھ/2016ء)⁩"
summary:
  ar: "المجلد الثالث من طبعة دار ابن حزم لـ«المحلى»، بإشراف خالد الرباط ومشاركة باحثين، يضم تتمة كتاب الطهارة ⁦(الوضوء والمسح على الخفين)⁩ وكتاب التيمم وكتاب الحيض والاستحاضة وأول كتاب الصلاة، مع تعليقات المحققين وتخريجاتهم وفهرس المسائل؛ فيه مسائل غسل الرجلين، ودم الحامل، وقضاء الصلاة المتروكة عمداً."
  en: "Volume 3 of the Dar Ibn Hazm edition of al-Muhalla, supervised by Khalid al-Rabbat with a team of researchers, holding the rest of the Book of Purity (ablution and wiping over footwear), the Book of Dry Ablution, the Book of Menstruation and Irregular Bleeding, and the beginning of the Book of Prayer, with the editors' notes, references and an index of questions."
  ur: "دار ابن حزم کے ایڈیشن «المحلی» کی جلد سوم، خالد الرباط کی نگرانی میں محققین کی شرکت سے، جس میں کتاب الطہارۃ کا باقی حصہ ⁦(وضو اور موزوں پر مسح)⁩، کتاب التیمم، کتاب الحیض والاستحاضہ اور کتاب الصلاۃ کا آغاز ہیں، محققین کے حواشی، تخریجات اور مسائل کی فہرست کے ساتھ۔"
  es: "Volumen 3 de la edición Dar Ibn Hazm de al-Muhalla, supervisada por Khalid al-Rabbat con un equipo de investigadores, que contiene el resto del Libro de la Pureza (ablución y limpieza del calzado), el Libro de la Ablución Seca, el Libro de la Menstruación y el Sangrado Irregular, y el comienzo del Libro de la Oración, con notas de los editores, referencias y un índice de preguntas."
  fr: "Volume 3 de l'édition Dar Ibn Hazm d'al-Muhalla, supervisée par Khalid al-Rabbat avec une équipe de chercheurs, contenant le reste du Livre de la Pureté (ablution et essuyage des chaussures), le Livre des Ablutions Sèches, le Livre des Menstruations et des Saignements Irréguliers, et le début du Livre de la Prière, avec les notes des éditeurs, les références et un index des questions."
  tr: "\"El-Muhalla\"nın Dar İbn Hazm baskısının üçüncü cildi, Khalid Al-Rabat'ın denetiminde ve araştırmacıların katılımıyla yürütülür; Arınma Kitabı'nın (Deri Çorapların Üzerine Abdest Alma ve Silinme), Tayammum Kitabı, Adet ve İstihada Kitabı'nın devamını, Namaz Kitabı'nın başlangıcını, editörlerin notları ve doğrulamalarını ve bir sayı dizinini içerir; hamile kadınların ayaklarının yıkanması, kanı ve kasıtlı olarak kaçırılan namazların telafisi ile ilgili konuları içerir."
  id: "Jilid ketiga edisi Dar Ibn Hazm \"Al-Muhalla,\" yang diawasi oleh Khalid Al-Rabat dan dengan partisipasi para peneliti, memuat kelanjutan Kitab Pemurnian (Wudhu dan Mengelap Kaos Kaki Kulit), Kitab Tayammum, Kitab Menstruasi dan Istihada, serta awal Kitab Doa, beserta anotasi dan otentikasi para editor serta indeks isu; buku ini mencakup isu-isu terkait mencuci kaki, darah wanita hamil, dan sengaja mengejar doa yang terlewat."
title: "المحلى بالآثار في شرح المجلى بالاختصار ⁦(المجلد الثالث)⁩"
