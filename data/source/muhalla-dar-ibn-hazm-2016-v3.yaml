  en: "Ibn Hazm, al-Muhalla bi-l-Athar, vol. 3 (Dar Ibn Hazm, Beirut, 1st ed., 1437/2016)"
  ur: "ابن حزم، المحلی بالآثار، جلد سوم ⁦(دار ابن حزم، بیروت، طبع اول، 1437ھ/2016ء)⁩"
summary:
  ar: "المجلد الثالث من طبعة دار ابن حزم لـ«المحلى»، بإشراف خالد الرباط ومشاركة باحثين، يضم تتمة كتاب الطهارة ⁦(الوضوء والمسح على الخفين)⁩ وكتاب التيمم وكتاب الحيض والاستحاضة وأول كتاب الصلاة، مع تعليقات المحققين وتخريجاتهم وفهرس المسائل؛ فيه مسائل غسل الرجلين، ودم الحامل، وقضاء الصلاة المتروكة عمداً."
  en: "Volume 3 of the Dar Ibn Hazm edition of al-Muhalla, supervised by Khalid al-Rabbat with a team of researchers, holding the rest of the Book of Purity (ablution and wiping over footwear), the Book of Dry Ablution, the Book of Menstruation and Irregular Bleeding, and the beginning of the Book of Prayer, with the editors' notes, references and an index of questions."
  ur: "دار ابن حزم کے ایڈیشن «المحلی» کی جلد سوم، خالد الرباط کی نگرانی میں محققین کی شرکت سے، جس میں کتاب الطہارۃ کا باقی حصہ ⁦(وضو اور موزوں پر مسح)⁩، کتاب التیمم، کتاب الحیض والاستحاضہ اور کتاب الصلاۃ کا آغاز ہیں، محققین کے حواشی، تخریجات اور مسائل کی فہرست کے ساتھ۔"
title: "المحلى بالآثار في شرح المجلى بالاختصار (المجلد الثالث)"
