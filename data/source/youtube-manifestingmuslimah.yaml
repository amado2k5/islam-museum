summary:
  ar: "قناة «مانيفستنغ مسلمة» (Manifesting Muslimah) على يوتيوب (@manifestingmuslimah) وتحمل اسم صاحبتها زهرة بيدرسن؛ مصدر أولي لفيديوهاتها في التوكل على الله وضبط التوقعات منه وحب الذات عبر محبته، وهي الفيديوهات المرافقة لبودكاستها بالاسم نفسه عن تحقيق الأهداف بثقة بالله."
  en: "The Manifesting Muslimah YouTube channel (@manifestingmuslimah), titled with its owner's name, Zahra Pedersen; a primary source for her videos on trust in God (tawakkul), on expectations of Allah, and on loving oneself by loving Allah, companion to her podcast of the same name about pursuing goals through trust in God."
  es: "El canal de YouTube Manifesting Muslimah (@manifestingmuslimah), titulado con el nombre de su dueña, Zahra Pedersen; una fuente principal para sus videos sobre la confianza en Dios (tawakkul), sobre las expectativas de Allah y sobre amarse a uno mismo amando a Allah, complemento de su podcast del mismo nombre sobre cómo alcanzar metas a través de la confianza en Dios."
  fr: "La chaîne YouTube Manifesting Muslimah (@manifestingmuslimah), portant le nom de sa propriétaire, Zahra Pedersen, est une source principale pour ses vidéos sur la confiance en Dieu (tawakkul), sur les attentes d'Allah et sur le fait de s'aimer soi-même en aimant Allah, en complément de son podcast du même nom sur la poursuite des objectifs grâce à la confiance en Dieu."
  ur: "مینی فیسٹنگ مسلمہ یوٹیوب چینل (@manifestingmuslimah)، جس کا عنوان اس کے مالک کے نام، زہرہ پیڈرسن کے ساتھ؛ خدا پر بھروسہ ⁦(توکل)⁩، اللہ کی توقعات پر، اور اللہ سے محبت کرکے اپنے آپ سے محبت کرنے پر، خدا پر بھروسہ کے ذریعے اہداف کے حصول کے بارے میں اسی نام کے اس کے پوڈ کاسٹ کے ساتھی پر اس کی ویڈیوز کا بنیادی ذریعہ۔"
