  ar: "مقالة ويكيبيديا العربية عن غادة السمان؛ تُستخدم لوقائع الكيان فقط. تعطي ولادتها في دمشق عام 1942 لأسرة دمشقية برجوازية، ووالدها الدكتور أحمد السمان رئيس الجامعة السورية ووزير التعليم سابقًا، ومسيرتها وأعمالها، ولا يسمّي نصّها دينًا أو مذهبًا لها."
  en: "Arabic Wikipedia article on Ghada al-Samman; used for entity facts only. It gives her birth in Damascus in 1942 to a bourgeois Damascene family, her father Dr Ahmad al-Samman, president of the Syrian University and a former education minister, and her career and works. Its text names no religion or school for her."
