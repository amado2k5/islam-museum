label:
  ar: "الحكم العطائية لابن عطاء الله السكندري، شرح ابن عباد النفزي الرندي، إعداد ودراسة محمد عبد المقصود هيكل ⁦(مركز الأهرام للترجمة والنشر، سلسلة تقريب التراث 2، القاهرة 1408هـ/1988م)⁩"
  en: "Ibn 'Ata' Allah al-Iskandari, al-Hikam al-'Ata'iyya, with the commentary of Ibn 'Abbad al-Nafzi al-Rundi, selected and studied by Muhammad 'Abd al-Maqsud Haykal (Ahram Centre for Translation and Publishing, Taqrib al-Turath 2, Cairo, 1408 AH / 1988)"
  ur: "ابن عطاء اللہ سکندری، الحکم العطائیہ، شرح ابن عباد نفزی رندی، اعداد و دراسہ محمد عبد المقصود ہیکل ⁦(مرکز الاہرام للترجمہ والنشر، سلسلہ تقریب التراث 2، قاہرہ 1408ھ/1988ء)⁩"
summary:
  ar: "مختارات من الحكم العطائية بشرح ابن عباد الرندي مع تعقيبات، أعدها محمد عبد المقصود هيكل بإشراف عبد الصبور شاهين، في الطبعة الأولى سنة 1408هـ/1988م، وفي صدرها دراسة في ابن عطاء الله وعصره وفي ابن عباد الرندي ومصنفاته وفي الحكم."
  en: "Selections from al-Hikam al-'Ata'iyya with Ibn 'Abbad al-Rundi's commentary and added remarks, prepared by Muhammad 'Abd al-Maqsud Haykal under the supervision of 'Abd al-Sabur Shahin, first edition 1408 AH / 1988, opening with a study of Ibn 'Ata' Allah and his age, of Ibn 'Abbad al-Rundi and his works, and of the Hikam."
  ur: "الحکم العطائیہ سے منتخبات، ابن عباد رندی کی شرح اور تعقیبات کے ساتھ، جنہیں محمد عبد المقصود ہیکل نے عبد الصبور شاہین کی نگرانی میں تیار کیا، پہلا ایڈیشن 1408ھ/1988ء، جس کے آغاز میں ابن عطاء اللہ اور ان کے عصر، ابن عباد رندی اور ان کی تصانیف، اور حکم پر مطالعہ ہے۔"
title: "الحكم العطائية — شرح ابن عباد الرندي (مختارات)"
