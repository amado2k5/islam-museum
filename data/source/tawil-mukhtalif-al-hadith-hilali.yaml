label: { ar: "تأويل مختلف الحديث ⁦(تحقيق سليم الهلالي)⁩", en: "Ta'wil mukhtalif al-hadith (ed. Salim al-Hilali)" }
summary:
  ar: "طبعة محققة من «تأويل مختلف الحديث» لابن قتيبة، حققها أبو أسامة سليم بن عيد الهلالي السلفي الأثري وخرّج أحاديثها وآثارها، ويرجع إليها هذا السجل في صفحاتها المطبوعة 130–141."
  en: "An edited edition of Ibn Qutayba's Ta'wil mukhtalif al-hadith, verified and annotated by Abu Usama Salim ibn Ied al-Hilali; this record cites its printed pages 130 to 141."
  es: "Edición revisada de Ta'wil mukhtalif al-hadith de Ibn Qutayba, verificada y anotada por Abu Usama Salim ibn Ied al-Hilali; este registro cita sus páginas impresas 130 a 141."
  fr: "Une édition éditée du Ta'wil mukhtalif al-hadith d'Ibn Qutayba, vérifiée et annotée par Abu Usama Salim ibn Ied al-Hilali; ce document cite ses pages imprimées 130 à 141."
  ur: "ابن قتیبہ کی تاویل مختالف الحدیث کا ایک ترمیم شدہ ایڈیشن، ابو اسامہ سالم ابن اید ہلالی کی طرف سے تصدیق شدہ اور تشریح؛ یہ ریکارڈ اس کے مطبوعہ صفحات 130 سے 141 کا حوالہ دیتا ہے۔"
  tr: "İbn Kuteybe tarafından yazılmış ve Hadis'in hadislerini ve geleneklerini çıkaran Ebu Usama Süleym ibn 'Eid al-Hilali el-Athari tarafından doğrulanmış 'Tevil Mukhtalab al-Hadis' baskısı. Bu kayıt, basılı sayfa 130–141'de referans verilmiştir."
  id: "Edisi terverifikasi 'Ta'wil Mukhtalab al-Hadith' oleh Ibn Qutaybah, diverifikasi oleh Abu Usama Sulaym ibn 'Idul Fitri al-Hilali al-Athari, yang mengambil hadis dan tradisinya. Catatan ini dirujuk dalam halaman cetak 130–141."
title: "تأويل مختلف الحديث"
