label:
  ar: "الطبقات الكبرى لابن سعد، القسم المتمم لتابعي أهل المدينة ومن بعدهم ⁦(من ربع الطبقة الثالثة إلى منتصف الطبقة السادسة)⁩ — دراسة وتحقيق زياد محمد منصور، مكتبة العلوم والحكم، المدينة المنورة، الطبعة الثانية 1408هـ/1987م"
  en: "Ibn Sa'd, al-Tabaqat al-Kubra, the completing section on the Successors of Medina and after them (from the last quarter of the third generation to the middle of the sixth) — study and edition by Ziyad Muhammad Mansur, Maktabat al-'Ulum wa-al-Hikam, Medina, 2nd edition 1408 AH/1987 CE"
summary:
  ar: "نشرة القطعة الساقطة من المجلد الخامس في طبعات الطبقات الكبرى، عن نسخة وحيدة مصورة من معهد المخطوطات بالقاهرة، فيها 407 تراجم لتابعي أهل المدينة ومن بعدهم، مع تقديم عبد الله بن عبد الله الزايد نائب رئيس الجامعة الإسلامية، ودراسة للمحقق عن حياة ابن سعد ومنهجه في هذا القسم ومرتبته في نقد الرجال، ووصف النسخة، وتخريج وتعليقات، وفهارس."
  en: "An edition of the section missing from volume 5 in the printed editions of al-Tabaqat al-Kubra, from a unique manuscript photographed at the Institute of Manuscripts in Cairo, holding 407 notices of the Successors of Medina and those after them; with a foreword by 'Abd Allah ibn 'Abd Allah al-Zayid, vice-president of the Islamic University, the editor's study of Ibn Sa'd's life, his method in this section and his rank as a critic of transmitters, a description of the manuscript, takhrij and notes, and indexes."
