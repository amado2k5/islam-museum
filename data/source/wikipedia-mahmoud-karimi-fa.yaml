summary:
  ar: "مقالة ويكيبيديا الفارسية عن المداح محمود كريمي: تعطي تاريخ ميلاده 23 خرداد 1347 في طهران، وتذكر أن أباه نقي فُقد سنة 1361 في عملية فتح المبين وأن أخاه أبا الفضل قُتل سنة 1365 في عملية كربلاء 5، وأنه بدأ النوح من السابعة، وأنه من حلقة منصور ارضي، وأن موقع «فطرس» هو مركز حفظ ونشر آثاره."
  en: "The Persian Wikipedia article on the maddah Mahmoud Karimi: it gives his birth date as 23 Khordad 1347 in Tehran, records that his father Naqi went missing in 1361 in Operation Fath al-Mobin and his brother Abolfazl was killed in 1365 in Operation Karbala-5, that he began reciting at seven, that he belongs to Mansour Arzi's circle, and that the Fotras site is the centre for preserving and publishing his works."
