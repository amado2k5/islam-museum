reliability_note: "Read in full on 7 November 2026; the reading tools available in this run did not expose a revision id, so none is recorded. Used for the exact birth date — 23 Khordad 1347, i.e. 13 June 1968 — which the English and Arabic articles give only as the year 1968; for his father Naqi missing in Operation Fath al-Mobin (1361) and his brother Abolfazl killed in Operation Karbala-5 (1365); for his childhood work in masonry and carpentry alongside reciting from thirteen; for his maddahi teaching classes in 1362–1372; for his place in Mansour Arzi's circle; for his fame in the 1380s through the televised noheh 'Eshgh ya'ni…'; and for the Fotras site as the centre preserving his works. The article's prose describes him only as an Iranian maddah and gives no statement of his personal faith."
