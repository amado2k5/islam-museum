summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أمير خان ⁦(الملاكم)⁩؛ تُستخدم لوقائع الكيان فقط. تروي فضيته الأولمبية سنة 2004 وألقابه العالمية في الوزن الخفيف الوسط واعتزاله سنة 2022 بسجل 34 فوزا و6 هزائم، وتصفه بأنه مسلم وعضو في الطريقة الصوفية النقشبندية، لكن الاستشهادين الوحيدين خلف دعوى العضوية منشوران على وسائل التواصل الاجتماعي من داخل أوساط الطريقة."
  en: "English Wikipedia article on Amir Khan the boxer; used for entity facts only. It recounts his 2004 Olympic silver medal, his light-welterweight world titles, his 2016 middleweight title challenge and his 2022 retirement with a record of 34 wins and 6 losses, and states that he is a Muslim and a member of the Naqshbandi Sufi Order — but the only two citations behind the membership claim are social-media posts from within the order's community."
  es: "Artículo de la Wikipedia en inglés sobre el boxeador Amir Khan; utilizado únicamente para datos sobre la persona. Relata su medalla de plata olímpica de 2004, sus títulos mundiales de peso superligero, su desafío por el título de peso mediano en 2016 y su retiro en 2022 con un récord de 34 victorias y 6 derrotas, y afirma que es musulmán y miembro de la Orden Sufí Naqshbandi; sin embargo, las únicas dos citas que respaldan la afirmación de su pertenencia son publicaciones en redes sociales de la comunidad de la orden."
  fr: "Article de Wikipédia en anglais sur le boxeur Amir Khan; utilisé uniquement à des fins d'information. Il relate sa médaille d'argent aux Jeux olympiques de 2004, ses titres mondiaux en super-légers, son combat pour le titre des poids moyens en 2016 et sa retraite en 2022 avec un palmarès de 34 victoires et 6 défaites. L'article indique également qu'il est musulman et membre de l'ordre soufi Naqshbandi, mais les deux seules sources citées à l'appui de cette affirmation sont des publications sur les réseaux sociaux de la communauté de l'ordre."
  ur: "عامر خان باکسر پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کے 2004 کے اولمپک سلور میڈل، اس کے لائٹ ویلٹر ویٹ ورلڈ ٹائٹلز، اس کے 2016 کے مڈل ویٹ ٹائٹل چیلنج اور 2022 میں 34 جیت اور 6 ہار کے ریکارڈ کے ساتھ اس کی ریٹائرمنٹ کا ذکر کیا گیا ہے، اور کہا گیا ہے کہ وہ ایک مسلمان اور نقشبندی صوفی آرڈر کا رکن ہے — لیکن سوشل میڈیا کے ممبران کے دعوے کے پیچھے صرف دو پوسٹس آرڈر کے پیچھے ہیں۔"
  tr: "Amir Khan (boksör) hakkında İngilizce Wikipedia makalesi; yalnızca varlık bilgileri için kullanılmıştır. 2004 Olimpiyat gümüş madalyası, orta sıklet dünya şampiyonlukları ve 2022'de emekliliğini, 34 galibiyet ve 6 mağlubiyetle emekliliğini anlatıyor, onu Müslüman ve Nakşibendi Sufi tarikatı üyesi olarak tanımlıyor, ancak üyelik iddiasının arkasındaki tek iki kaynak tarikat çevrelerinde sosyal medyada yayımlanıyor."
  id: "Artikel Wikipedia bahasa Inggris tentang Amir Khan (si petinju); hanya digunakan untuk fakta entitas. Artikel ini menceritakan perak Olimpiadenya pada 2004, gelar dunianya di kelas menengah, dan pensiunnya pada 2022 dengan rekor 34 kemenangan dan 6 kekalahan, serta menggambarkannya sebagai Muslim dan anggota ordo Sufi Naqshbandi, tetapi satu-satunya dua kutipan di balik klaim keanggotaan dipublikasikan di media sosial dalam lingkaran ordo tersebut."
