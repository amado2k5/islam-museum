  ar: "مقالة ويكيبيديا الإنجليزية عن أمير خان (الملاكم)؛ تُستخدم لوقائع الكيان فقط. تروي فضيته الأولمبية سنة 2004 وألقابه العالمية في الوزن الخفيف الوسط واعتزاله سنة 2022 بسجل 34 فوزا و6 هزائم، وتصفه بأنه مسلم وعضو في الطريقة الصوفية النقشبندية، لكن الاستشهادين الوحيدين خلف دعوى العضوية منشوران على وسائل التواصل الاجتماعي من داخل أوساط الطريقة."
  en: "English Wikipedia article on Amir Khan the boxer; used for entity facts only. It recounts his 2004 Olympic silver medal, his light-welterweight world titles, his 2016 middleweight title challenge and his 2022 retirement with a record of 34 wins and 6 losses, and states that he is a Muslim and a member of the Naqshbandi Sufi Order — but the only two citations behind the membership claim are social-media posts from within the order's community."
