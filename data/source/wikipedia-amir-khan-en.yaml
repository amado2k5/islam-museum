reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision, including the citation apparatus of the early-life section in the article's wikitext. It gives Khan as born on 8 December 1986 in Bolton to a Pakistani Punjabi Rajput family from Matore, Kahuta; Olympic lightweight silver medallist at Athens 2004 at seventeen; WBA light-welterweight champion in 2009 and unified IBF champion in 2011; a challenger for the WBC middleweight title against Canelo Álvarez in 2016; retired on 13 May 2022 with a record of 34 wins and 6 losses; and, in 2023, given a two-year backdated UK Anti-Doping ban over ostarine, which he maintained was ingested unintentionally and which the tribunal found was neither deliberate nor reckless. Of his religion the early-life section states: 'Khan is a Muslim, and a member of the Naqshbandi Sufi Order'. The two references attached to the membership claim are a Facebook post by 'The Path To RasulAllah' titled 'Boxer Amir Khan Gets Bayah With Pir...' and a tweet — community social-media posts, not independent publications; the claim's many web mirrors all copy this article. It names no legal school for him."
