summary:
  ar: "مقالة ويكيبيديا الأردية عن هيثم بن طارق، وهي مختصرة؛ تُستخدم لوقائع الكيان فقط. تذكر ولادته في 11 أكتوبر 1955 وخلافته لقابوس بن سعيد في سلطنة عُمان سنة 2020، ويقرأ حقل الدين في صندوق معلوماتها «إباضي إسلام»."
  en: "Urdu Wikipedia article on Haitham bin Tariq, a short stub; used for entity facts only. It gives his birth on 11 October 1955 and his succession to Qaboos bin Said as Sultan of Oman in 2020. Its infobox religion field reads 'Ibadi Islam' — a structured value in a stub that carries no biographical text on his affiliation."
  es: "Artículo de Wikipedia en urdu sobre Haitham bin Tariq, un breve esbozo; utilizado únicamente para datos sobre la entidad. Indica su fecha de nacimiento, el 11 de octubre de 1955, y su sucesión de Qaboos bin Said como sultán de Omán en 2020. El campo de religión de su ficha informativa indica «Islam ibadí», un valor estructurado en un esbozo que no contiene texto biográfico sobre su afiliación religiosa."
  fr: "L'article Wikipédia en ourdou sur Haitham bin Tariq est une ébauche succincte, servant uniquement à fournir des informations factuelles. Il indique sa naissance le 11 octobre 1955 et sa succession à Qaboos bin Said comme sultan d'Oman en 2020. Son champ « religion » mentionne « Islam ibadite » – une valeur structurée dans une ébauche ne comportant aucun texte biographique sur son appartenance religieuse."
  ur: "ہیثم بن طارق پر اردو ویکیپیڈیا کا مضمون، ایک مختصر سٹب؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 11 اکتوبر 1955 کو ان کی پیدائش اور 2020 میں عمان کے سلطان کے طور پر قابوس بن سعید کی جانشینی کرتا ہے۔ اس کے معلوماتی باکس کے مذہب کے شعبے میں 'عبادی اسلام' پڑھا جاتا ہے - ایک اسٹب میں ایک ساختی قدر جس میں اس کی وابستگی پر کوئی سوانحی متن نہیں ہے۔"
