summary:
  ar: "القناة الرسمية لعبد الرحمن ذاكر الهاشمي على يوتيوب (@MakanyWorld)، تجمع محاضراته ودروسه واستشاراته، وتصفه أوصاف مقاطعها بأنه طبيب واستشاري علم النفس التربوي والعلاج النفسي وصاحب مادة فقه النفس التدريبية."
  en: "The official YouTube channel of Abdul Rahman Dhaker al-Hashemi (@MakanyWorld), gathering his lectures, lessons and consultations; its video descriptions present him as a physician, a consultant in educational psychology and in psychotherapy, and the author of the Fiqh al-Nafs training curriculum."
  es: "El canal oficial de YouTube de Abdul Rahman Dhaker al-Hashemi (@MakanyWorld) reúne sus conferencias, lecciones y consultas; las descripciones de sus videos lo presentan como médico, consultor en psicología educativa y psicoterapia, y autor del programa de formación Fiqh al-Nafs."
  fr: "La chaîne YouTube officielle d'Abdul Rahman Dhaker al-Hashemi (@MakanyWorld), rassemblant ses conférences, ses leçons et ses consultations; ses descriptions vidéo le présentent comme médecin, consultant en psychologie de l'éducation et en psychothérapie, et auteur du programme de formation Fiqh al-Nafs."
  ur: "عبدالرحمن ذاکر الہاشمی (@MakanyWorld) کا آفیشل یوٹیوب چینل، ان کے لیکچرز، اسباق اور مشورے جمع کرتا ہے۔ اس کی ویڈیو کی تفصیل اسے ایک معالج، تعلیمی نفسیات اور سائیکو تھراپی میں ایک مشیر، اور فقہ النفس تربیتی نصاب کے مصنف کے طور پر پیش کرتی ہے۔"
