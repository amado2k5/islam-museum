reliability_note: "The channel's own presence: a primary source for its identity, output and reach — not independent corroboration of biography. Verified as his own channel on 26 October 2026: his official website makany.co links to @MakanyWorld as its YouTube channel, and the channel's own video descriptions state that the channel gathers the lectures, lessons and consultations of Dr Abdul Rahman Dhaker al-Hashemi and style him physician, consultant in educational psychology and consultant in psychotherapy, and originator of the Fiqh al-Nafs training material (the trilogy Iqra', Nafs, Lita'arafu). A separate volunteer-run archive of his lessons exists; it is not his channel and is not used. The channel publishes no birth date and no school or madhhab for him."
