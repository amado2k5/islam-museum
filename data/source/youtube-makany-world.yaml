  ar: "القناة الرسمية لعبد الرحمن ذاكر الهاشمي على يوتيوب (@MakanyWorld)، تجمع محاضراته ودروسه واستشاراته، وتصفه أوصاف مقاطعها بأنه طبيب واستشاري علم النفس التربوي والعلاج النفسي وصاحب مادة فقه النفس التدريبية."
  en: "The official YouTube channel of Abdul Rahman Dhaker al-Hashemi (@MakanyWorld), gathering his lectures, lessons and consultations; its video descriptions present him as a physician, a consultant in educational psychology and in psychotherapy, and the author of the Fiqh al-Nafs training curriculum."
