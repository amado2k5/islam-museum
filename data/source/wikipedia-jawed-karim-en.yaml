summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن جاود كريم؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في ميرزه بورغ بألمانيا الشرقية سنة 1979 لأب بنغلاديشي وأم ألمانية، وعمله في باي بال، ومشاركته في تأسيس يوتيوب ورفعه أول مقطع فيديو عليه سنة 2005. لا تذكر المقالة أي دين له."
  en: "English Wikipedia article on Jawed Karim; used for entity facts only. It covers his 1979 birth in Merseburg, East Germany, to a Bangladeshi father and a German mother, his work at PayPal, his co-founding of YouTube and his upload of its first video in 2005. The article states no religion for him."
  es: "Artículo de la Wikipedia en inglés sobre Jawed Karim; se utiliza únicamente para obtener información sobre la persona. Abarca su nacimiento en 1979 en Merseburg, Alemania Oriental, hijo de padre bangladesí y madre alemana, su trabajo en PayPal, su participación como cofundador de YouTube y la publicación de su primer vídeo en 2005. El artículo no menciona ninguna religión para él."
  fr: "Article Wikipédia en anglais sur Jawed Karim; utilisé uniquement pour des informations sur l'entité. Il relate sa naissance en 1979 à Merseburg, en Allemagne de l'Est, d'un père bangladais et d'une mère allemande, son travail chez PayPal, sa cofondation de YouTube et la mise en ligne de sa première vidéo en 2005. L'article ne mentionne aucune religion à son sujet."
  ur: "جاوید کریم پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی 1979 میں مشرقی جرمنی کے شہر مرسبرگ میں ایک بنگلہ دیشی والد اور ایک جرمن ماں کی پیدائش، پے پال پر ان کا کام، یوٹیوب کی اس کی شریک بانی اور 2005 میں اس کی پہلی ویڈیو اپ لوڈ کی گئی ہے۔ مضمون میں اس کے لیے کوئی مذہب نہیں بتایا گیا ہے۔"
  tr: "Jawad Karim hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1979'da Doğu Almanya'nın Mirseburg kentinde Bangladeşli bir baba ve Alman bir annenin doğumunu, PayPal'daki çalışmalarını, YouTube'un kuruluşuna katılımını ve 2005'te ilk video klibini yüklemesini anlatır. Makalede onun herhangi bir dininden bahsedilmemektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Jawad Karim; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya di Mirseburg, Jerman Timur pada tahun 1979 dari ayah Bangladesh dan ibu Jerman, pekerjaannya di PayPal, partisipasinya dalam mendirikan YouTube, dan mengunggah klip video pertamanya pada tahun 2005. Artikel tersebut tidak menyebutkan agama apa pun darinya."
