reliability_note: "Tracker of the public channel @akibahmed, his earlier, second channel: 5,130,000 subscribers, 665,750,466 total views and 243 videos as of 8 November 2026; channel started 13 November 2017; channel country set to Bangladesh; ranked #76 in Bangladesh and #3,584 in Entertainment by subscribers; the subscriber count was unchanged in the 28 days to 8 November 2026, so this is the older, slower channel of the two. Its most-viewed uploads mix cycle-race challenge videos (about 6.2 million and 2.3 million views) with natok titles also carried on the main channel ('Jinn Cycle' about 3.9 million, 'Goriber Eid' about 3.3 million). Figures are dated platform counts, not museum-verified facts; vidIQ's earnings estimates are not used. The page names no school of law or order for the man himself. Read on 9 November 2026."
