summary:
  ar: "مسح بالإنجليزية لعمارة القاهرة الإسلامية وفنونها الزخرفية من الفتح العربي إلى الفتح العثماني ⁦(642-1517م)⁩، في مقدمة وسبعة فصول مع ملاحق ومسارد."
  en: "An English survey of the architecture and decorative arts of Islamic Cairo from the Arab to the Ottoman conquest (642-1517), in an introduction and seven chapters with notes, glossaries, chronology and index."
  es: "Un estudio en inglés de la arquitectura y las artes decorativas del Cairo islámico desde la conquista árabe hasta la otomana (642-1517), con una introducción y siete capítulos que incluyen notas, glosarios, cronología e índice."
  fr: "Un aperçu en anglais de l'architecture et des arts décoratifs du Caire islamique de la conquête arabe à la conquête ottomane (642-1517), dans une introduction et sept chapitres avec notes, glossaires, chronologie et index."
  ur: "عرب سے عثمانی فتح (642-1517) تک اسلامی قاہرہ کے فن تعمیر اور آرائشی فنون کا انگریزی سروے، ایک تعارف اور سات ابواب کے ساتھ نوٹ، لغت، تاریخ اور اشاریہ۔"
  tr: "Arap fethi döneminden Osmanlı fethine (MS 642-1517) kadar İslam Kahire'nin mimarisi ve süsleme sanatlarına dair İngilizce bir inceleme, bir giriş ve yedi bölümden oluşan ekler ve sözlüklerle."
  id: "Survei Inggris tentang arsitektur Kairo Islam dan seni dekoratif dari penaklukan Arab hingga penaklukan Ottoman (642-1517 M), dalam pengantar dan tujuh bab beserta lampiran dan glosarium."
