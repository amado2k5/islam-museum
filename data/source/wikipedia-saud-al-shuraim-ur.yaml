  ar: "مقالة ويكيبيديا الأردية عن سعود الشريم؛ تُستخدم لوقائع الكيان فقط. صندوقها يعطي دينه أهل السنة ومدرسته حنبلي وتاريخ مولده 19 يناير 1964 مخالفا للمقالات الأخرى وويكيداتا، ونصها يلخص دراسته ومناصبه."
  en: "Urdu Wikipedia article on Saud Al-Shuraim; used for entity facts only. Its infobox gives his religion as Ahl al-Sunna and his school as Hanbali, and a birth date of 19 January 1964 against the other articles and Wikidata; its text summarises his studies and posts."
  es: "Artículo de Wikipedia en urdu sobre Saud Al-Shuraim; utilizado únicamente para obtener información sobre la persona. Su ficha informativa indica que su religión era Ahl al-Sunna y su escuela Hanbali, y que su fecha de nacimiento era el 19 de enero de 1964, a diferencia de otros artículos y Wikidata; su texto resume sus estudios y publicaciones."
  fr: "Article Wikipédia en ourdou sur Saud Al-Shuraim; utilisé uniquement pour les informations le concernant. Son infobox indique qu'il est sunnite et hanbalite, et qu'il est né le 19 janvier 1964, contrairement aux autres articles et à Wikidata; son texte résume ses études et ses fonctions."
  ur: "سعود الشریم پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کے معلوماتی خانے میں اس کا مذہب اہل السنہ اور اس کا مکتب حنبلی ہے، اور دیگر مضامین اور وکی ڈیٹا کے مقابلے میں تاریخ پیدائش 19 جنوری 1964 ہے۔ اس کا متن اس کے مطالعے اور خطوط کا خلاصہ کرتا ہے۔"
