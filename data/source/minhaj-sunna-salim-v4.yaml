summary:
  ar: "الجزء الرابع من تحقيق الدكتور محمد رشاد سالم، أستاذ العقيدة والمذاهب المعاصرة بجامعة الإمام محمد بن سعود الإسلامية، لمنهاج السنة النبوية في نقض كلام الشيعة القدرية، في إعادة طبع نشرتها دار الفضيلة بإذن الجامعة المؤرخ 6/2/1424هـ؛ يبدأ بالفصل الثالث من كلام ابن المطهر في الأدلة على إمامة علي."
  en: "Volume 4 of Dr Muhammad Rashad Salim's critical edition of Minhaj al-Sunna al-Nabawiyya fi Naqd Kalam al-Shi'a al-Qadariyya (Salim was professor of creed and contemporary schools at Imam Muhammad ibn Saud Islamic University), in a reprint by Dar al-Fadila under the university's permission dated 6/2/1424 AH; it opens with the third chapter of Ibn al-Mutahhar's text, on the proofs of Ali's imamate."
