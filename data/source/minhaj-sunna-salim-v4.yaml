label: { ar: "منهاج السنة النبوية، تحقيق محمد رشاد سالم، الجزء الرابع ⁦(دار الفضيلة)⁩", en: "Minhaj al-Sunna al-Nabawiyya, ed. Muhammad Rashad Salim, vol. 4 (Dar al-Fadila reprint)" }
summary:
  ar: "الجزء الرابع من تحقيق الدكتور محمد رشاد سالم، أستاذ العقيدة والمذاهب المعاصرة بجامعة الإمام محمد بن سعود الإسلامية، لمنهاج السنة النبوية في نقض كلام الشيعة القدرية، في إعادة طبع نشرتها دار الفضيلة بإذن الجامعة المؤرخ 6/2/1424هـ؛ يبدأ بالفصل الثالث من كلام ابن المطهر في الأدلة على إمامة علي."
  en: "Volume 4 of Dr Muhammad Rashad Salim's critical edition of Minhaj al-Sunna al-Nabawiyya fi Naqd Kalam al-Shi'a al-Qadariyya (Salim was professor of creed and contemporary schools at Imam Muhammad ibn Saud Islamic University), in a reprint by Dar al-Fadila under the university's permission dated 6/2/1424 AH; it opens with the third chapter of Ibn al-Mutahhar's text, on the proofs of Ali's imamate."
  es: "Volumen 4 de la edición crítica del Dr. Muhammad Rashad Salim de Minhaj al-Sunna al-Nabawiyya y Naqd Kalam al-Shi'a al-Qadariyya (Salim fue profesor de escuelas de credos y contemporáneas en la Universidad Islámica Imam Muhammad ibn Saud); Se abre con el tercer capítulo del texto de Ibn al-Mutahhar, sobre las pruebas del Imamato de Ali."
  fr: "Volume 4 de l'édition critique du Dr Muhammad Rashad Salim de Minhaj al-Sunna al-Nabawiyya et Naqd Kalam al-Shi'a al-Qadariyya (Salim était professeur de croyance et d'écoles contemporaines à l'Université islamique Imam Muhammad ibn Saud); il s'ouvre sur le troisième chapitre du texte d'Ibn al-Mutahhar, sur les preuves de l'Imamat d'Ali."
  ur: "ڈاکٹر محمد رشاد سلیم کے منہاج السنۃ النبویہ اور نقد کلام الشیعہ القادریہ کے تنقیدی ایڈیشن کی جلد 4 ⁦(سلیم امام محمد ابن سعود اسلامی یونیورسٹی میں مسلک اور عصری اسکولوں کے پروفیسر تھے)⁩؛ اس کا آغاز ابن المطھر کے متن کے تیسرے باب سے ہوتا ہے جو علی کی امامت کے دلائل پر ہوتا ہے۔"
  tr: "İmam Muhammed bin Suud İslam Üniversitesi İnanç ve Çağdaş Mezhepler Profesörü Dr. Muhammed Rashad Salem tarafından, Dar Al-Fadila tarafından üniversitenin izniyle 6/2/1424 tarihli yeniden basımda Kaderiye Şii'nin sözlerini çürüten Peygamber Sünneti Metodolojisi'nin doğrulanmasının dördüncü bölümü; İbn el-Mutahhar'ın Ali İmatı'na karşı delil üzerine sunduğu söylevin üçüncü bölümüyle başlar."
  id: "Bagian keempat dari verifikasi oleh Dr. Muhammad Rashad Salem, Profesor Iman dan Sekte Kontemporer di Universitas Islam Imam Muhammad bin Saud, tentang Metodologi Sunnah Nabi dalam membantah kata-kata Syiah Qadariyya, dalam cetakan ulang yang diterbitkan oleh Dar Al-Fadila dengan izin universitas tertanggal 2/6/1424 H; dimulai dengan bab ketiga dari khotbah Ibn al-Mutahhar tentang bukti terhadap Imami Ali."
title: "منهاج السنة النبوية في نقض كلام الشيعة القدرية، الجزء الرابع"
