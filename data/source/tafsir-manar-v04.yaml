label: { ar: "تفسير المنار، المجلد الرابع", en: "Tafsir al-Manar, volume 4" }
summary:
  ar: "المجلد الرابع من تفسير المنار لمحمد رشيد رضا، من تفسير آية 93 من سورة آل عمران إلى آية 23 من سورة النساء، بتحقيق إبراهيم شمس الدين. يتضمن الكلام في ملة إبراهيم وأول البيوت وحرمة الحرم وفرضية الحج، وفيه حواشٍ للمؤلف عن أحوال الحجاز في زمنه."
  en: "Volume 4 of Rashid Rida's Tafsir al-Manar, from Q. 3:93 to Q. 4:23, edited by Ibrahim Shams al-Din. It covers Abraham's religion, the first house, the sanctity of the Haram and the duty of the pilgrimage, with Rida's own notes on Hijaz in his time."
  es: "Volumen 4 del Tafsir al-Manar de Rashid Rida, desde el Corán 3:93 hasta el Corán 4:23, editado por Ibrahim Shams al-Din. Abarca la religión de Abraham, la primera casa, la santidad del Haram y el deber de la peregrinación, con las propias notas de Rida sobre el Hiyaz en su época."
  fr: "Le quatrième volume du Tafsir al-Manar de Rashid Rida, des sourates 3:93 à 4:23, édité par Ibrahim Shams al-Din, traite de la religion d'Abraham, de la première maison, du caractère sacré du Haram et du devoir du pèlerinage, avec les notes personnelles de Rida sur le Hedjaz de son époque."
  ur: "رشید ردا کی تفسیر المنار کی جلد 4، ص 3:93 سے 4:23 تک، ابراہیم شمس الدین کی تدوین۔ اس میں ابراہیم کے مذہب، پہلا گھر، حرم کی حرمت اور حج کے فرائض کا احاطہ کیا گیا ہے، اس میں ردا کے اپنے زمانے میں حجاز کے اپنے نوٹ شامل ہیں۔"
  tr: "Muhammed Reşid Rida'nın El-Manar Tafsir'inin Dördüncü Cildi, İmran Suresi'nin 93. ayetinden En-Nisa Suresi'nin 23. ayetine kadar olan yorumdan İbrahim Şemseddin tarafından düzenlenmiştir. Kitap, İbrahim'in dini, ilk evler, kutsal yerin kutsallığı ve Hac yükümlülüğü üzerine tartışmalar içerir ve yazarın kendi dönemindeki Hicaz koşullarına dair notlar içerir."
  id: "Jilid Empat Tafsir Al-Manar oleh Muhammad Rashid Rida, dari penafsiran ayat 93 Surah Al-Imran hingga ayat 23 Surah An-Nisa, disunting oleh Ibrahim Shams al-Din. Buku ini mencakup diskusi tentang agama Abraham, rumah-rumah pertama, kesucian tempat suci, dan kewajiban Haji, serta catatan dari penulis tentang kondisi Hijaz pada zamannya."
title: "تفسير القرآن الحكيم المشهور بتفسير المنار، المجلد الرابع"
