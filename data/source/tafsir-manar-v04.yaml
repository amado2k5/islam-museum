summary:
  ar: "المجلد الرابع من تفسير المنار لمحمد رشيد رضا، من تفسير آية 93 من سورة آل عمران إلى آية 23 من سورة النساء، بتحقيق إبراهيم شمس الدين. يتضمن الكلام في ملة إبراهيم وأول البيوت وحرمة الحرم وفرضية الحج، وفيه حواشٍ للمؤلف عن أحوال الحجاز في زمنه."
  en: "Volume 4 of Rashid Rida's Tafsir al-Manar, from Q. 3:93 to Q. 4:23, edited by Ibrahim Shams al-Din. It covers Abraham's religion, the first house, the sanctity of the Haram and the duty of the pilgrimage, with Rida's own notes on Hijaz in his time."
