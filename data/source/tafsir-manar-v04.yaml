reliability_note: "Edition not verified. The local copy is an OCR text of a modern printing whose title page names the editor Ibrahim Shams al-Din and the publisher Dar al-Kutub al-Ilmiyya, Beirut; the year of this printing is not read in the OCR and is not recorded here. Page numbers cited in the museum are the page markers of the local OCR copy (398 PDF pages, read here at pp. 1 to 12). The OCR contains many reading errors in the Arabic, including in Qur'an verses (which are never quoted from it); quotations are not made from the OCR text. Footnote and page references of the printed book are not checked against a printed copy. Every page number must be checked against the printed copy before publication."
