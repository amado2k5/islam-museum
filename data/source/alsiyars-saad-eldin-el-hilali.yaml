summary:
  ar: "سيرة نقدية لسعد الدين الهلالي على موقع السيار؛ تُستخدم للوقائع فقط، ومنها موضوعا رسالتيه للماجستير والدكتوراه وتاريخ كتابه «الإسلام وإنسانية الدولة» ونقد علي جمعة له."
  en: "Critical biography of Saad El-Din El-Hilali at alsiyars.com; used for facts only, among them the topics of his master's and doctoral theses, the publication history of Islam and the Humanity of the State, and Ali Gomaa's critical review of it."
  es: "Biografía crítica de Saad El-Din El-Hilali en alsiyars.com; utilizada únicamente para obtener información veraz, entre ellos los temas de sus tesis de maestría y doctorado, el historial de publicación de *El Islam y la Humanidad del Estado* y la reseña crítica de Ali Gomaa sobre la misma."
  fr: "Biographie critique de Saad El-Din El-Hilali sur alsiyars.com; utilisée uniquement à des fins factuelles, notamment les sujets de ses thèses de maîtrise et de doctorat, l’historique de publication de Islam and the Humanity of the State et la critique qu’en a faite Ali Gomaa."
  ur: "alsiyars.com پر سعد الدین ہلالی کی تنقیدی سوانح عمری؛ صرف حقائق کے لیے استعمال کیا جاتا ہے، ان میں اپنے ماسٹرز اور ڈاکٹریٹ کے مقالوں کے عنوانات، اسلام کی اشاعت کی تاریخ اور ریاست کی انسانیت اور علی گوما کا اس کا تنقیدی جائزہ۔"
