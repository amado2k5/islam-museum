summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الحاج مصباح (بعنوان «محمد مصباح»)؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده نحو 1876 في كاومان بسوراكارتا ووفاته سنة 1926، وتروي تعليمه في المعهد الشرعي وتجارته في الباتيك وحجه وتغيّر اسمه، ونشاطه في شريكة الإسلام ومجلاته «مدان مسلمين» و«إسلام برغيراك»، ودعوته إلى توافق الإسلام والشيوعية، ونفيه إلى غينيا الجديدة. تستند أساسًا إلى شيرايشي (1990) ولارسون (1987)."
  en: "English Wikipedia article on Haji Misbach (titled 'Mohammad Misbach'); used for entity facts only. It gives his birth about 1876 at Kauman, Surakarta, and his death in 1926, and recounts his pesantren education, his batik trade, his Hajj and name changes, his Sarekat Islam activity and his journals Medan Moeslimin and Islam Bergerak, his advocacy of the compatibility of Islam and communism, and his exile to New Guinea. It rests mainly on Shiraishi (1990) and Larson (1987)."
