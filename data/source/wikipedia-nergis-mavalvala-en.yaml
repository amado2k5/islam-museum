summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن نيرجيس مافالفالا؛ تُستخدم لوقائع الكيان فقط. تذكر مولدها سنة 1968 في لاهور ونشأتها في كراتشي، وتعليمها في ويلسلي ومعهد ماساتشوستس للتكنولوجيا (دكتوراه 1997 بإشراف راينر فايس)، وعملها في ليغو، وزمالة ماك آرثر 2010، وعمادتها لكلية العلوم بالمعهد. وتقول في وصف أسرتها إنها وُلدت «لأسرة فارسية كانت تمارس الزرادشتية» — صياغة أسرية لا تصريح شخصي."
  en: "English Wikipedia article on Nergis Mavalvala; used for entity facts only. It gives her birth in 1968 at Lahore and her upbringing in Karachi, her education at Wellesley and MIT (PhD 1997 under Rainer Weiss), her LIGO work, the 2010 MacArthur Fellowship and her deanship of MIT's School of Science. On religion it says only that she was 'Born to a Parsi family that practiced Zoroastrianism' — a family framing, not a personal attestation."
