summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن نيرجيس مافالفالا؛ تُستخدم لوقائع الكيان فقط. تذكر مولدها سنة 1968 في لاهور ونشأتها في كراتشي، وتعليمها في ويلسلي ومعهد ماساتشوستس للتكنولوجيا ⁦(دكتوراه 1997 بإشراف راينر فايس)⁩، وعملها في ليغو، وزمالة ماك آرثر 2010، وعمادتها لكلية العلوم بالمعهد. وتقول في وصف أسرتها إنها وُلدت «لأسرة فارسية كانت تمارس الزرادشتية» — صياغة أسرية لا تصريح شخصي."
  en: "English Wikipedia article on Nergis Mavalvala; used for entity facts only. It gives her birth in 1968 at Lahore and her upbringing in Karachi, her education at Wellesley and MIT (PhD 1997 under Rainer Weiss), her LIGO work, the 2010 MacArthur Fellowship and her deanship of MIT's School of Science. On religion it says only that she was 'Born to a Parsi family that practiced Zoroastrianism' — a family framing, not a personal attestation."
  es: "Artículo de la Wikipedia en inglés sobre Nergis Mavalvala; utilizado únicamente para datos biográficos. Indica que nació en 1968 en Lahore y creció en Karachi, estudió en Wellesley y el MIT (doctorado en 1997 bajo la dirección de Rainer Weiss), trabajó en LIGO, recibió la beca MacArthur en 2010 y fue decana de la Facultad de Ciencias del MIT. Sobre religión, solo menciona que «nació en una familia parsi que practicaba el zoroastrismo», una atribución familiar, no una declaración personal."
  fr: "L'article de Wikipédia en anglais consacré à Nergis Mavalvala, utilisé uniquement pour des informations factuelles, mentionne sa naissance en 1968 à Lahore, son enfance à Karachi, ses études à Wellesley et au MIT (doctorat obtenu en 1997 sous la direction de Rainer Weiss), ses travaux sur LIGO, l'obtention de la bourse MacArthur en 2010 et son poste de doyenne de la faculté des sciences du MIT. Concernant sa religion, il est seulement indiqué qu'elle était « née dans une famille parsie pratiquant le zoroastrisme » – une information familiale et non une affirmation personnelle."
  ur: "نیرگس ماولوالا پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1968 میں لاہور میں اس کی پیدائش اور کراچی میں اس کی پرورش، ویلزلی اور MIT میں اس کی تعلیم ⁦(رینر ویس کے تحت پی ایچ ڈی 1997)⁩، اس کا LIGO کام، 2010 کی میک آرتھر فیلوشپ اور MIT کے اسکول آف سائنس کی اس کی ڈین شپ۔ مذہب کے بارے میں یہ صرف یہ کہتا ہے کہ وہ 'پارسی خاندان میں پیدا ہوئی تھی جس نے زرتشتی مذہب پر عمل کیا' - ایک خاندان کی تشکیل، ذاتی تصدیق نہیں۔"
  tr: "Nerjis Mavavala hakkında İngilizce Wikipedia makalesi; yalnızca varlık gerçekleri için kullanılmıştır. 1968'de Lahor'da doğduğunu, Karaçi'deki çocukluğunu, Wellesley ve Massachusetts Teknoloji Enstitüsü'ndeki eğitimini (1997'de Rainer Weiss danışmanlığında doktora), Lego'daki çalışmalarını, 2010'daki MacArthur Bursu'nu ve enstitünün Fen Fakültesi dekanlığını belirtir. Ailesini \"Zerdüştlük uygulayan bir Pers ailesinde doğmuş\" olarak tanımlar — bu aile ifadesi kişisel bir ifade değildir."
  id: "Artikel Wikipedia bahasa Inggris tentang Nerjis Mavavala; digunakan hanya untuk fakta entitas. Ia menyebutkan kelahirannya pada tahun 1968 di Lahore, masa kecilnya di Karachi, pendidikannya di Wellesley dan Massachusetts Institute of Technology (PhD 1997 di bawah bimbingan Rainer Weiss), pekerjaannya di Lego, MacArthur Fellowship pada tahun 2010, dan jabatan dekan di College of Science institut tersebut. Ia menggambarkan keluarganya lahir \"dalam keluarga Persia yang mempraktikkan Zoroastrianisme\" — sebuah frasa keluarga, bukan pernyataan pribadi."
