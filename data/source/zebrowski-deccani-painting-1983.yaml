  en: "Mark Zebrowski, Deccani Painting (London: Sotheby Publications; Berkeley: University of California Press; New Delhi: Roli Books, 1983)"
summary:
  ar: "أول محاولة لجمع كل لوحات الدكن الكبرى ونسبتها إلى مدارسها ومصوريها، من أحمدنگر وبيجاپور وگولكنده في القرنين السادس عشر والسابع عشر إلى حيدرآباد والأقاليم في القرنين الثامن عشر والتاسع عشر."
  en: "The first attempt to gather all the major Deccani paintings and assign them to schools and artists, from Ahmadnagar, Bijapur and Golconda in the sixteenth and seventeenth centuries to Hyderabad and the provinces in the eighteenth and nineteenth."
  es: "El primer intento de reunir todas las principales pinturas del Decán y asignarlas a escuelas y artistas, desde Ahmadnagar, Bijapur y Golconda en los siglos XVI y XVII hasta Hyderabad y las provincias en los siglos XVIII y XIX."
  fr: "La première tentative de rassembler toutes les peintures majeures du Deccan et de les attribuer à des écoles et à des artistes, d'Ahmadnagar, Bijapur et Golconde aux XVIe et XVIIe siècles à Hyderabad et aux provinces aux XVIIIe et XIXe siècles."
  ur: "سولہویں اور سترہویں صدی میں احمد نگر، بیجاپور اور گولکنڈہ سے لے کر اٹھارویں اور انیسویں صدی میں حیدرآباد اور صوبوں تک تمام اہم دکنی پینٹنگز کو اکٹھا کرکے اسکولوں اور فنکاروں کو تفویض کرنے کی پہلی کوشش۔"
  tr: "Tüm büyük Dekkan tablolarını toplama ve bunları okullarına ve ressamlarına atfetme ilk girişimi; 16. ve 17. yüzyıllarda Ahmednagar, Bijapur ve Golconda'dan, 18. ve 19. yüzyıllarda Haydarabad ve eyaletlere kadar."
  id: "Upaya pertama untuk mengumpulkan semua lukisan utama Deccan dan mengaitkannya dengan sekolah dan pelukis mereka, mulai dari Ahmednagar, Bijapur, dan Golconda pada abad ke-16 dan ke-17 hingga Hyderabad dan provinsi-provinsi pada abad ke-18 dan ke-19."
