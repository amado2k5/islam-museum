reliability_note: "Her own website: a primary source for her career as she presents it, not independent corroboration. Read in full on 26 October 2026. It styles her Nawal bint Abdulaziz Al-Eid, full professor of the Sunnah at Princess Nourah University; gives her master's thesis (a study and edition of part of Ibn Battal's commentary on Sahih al-Bukhari) and her doctorate of 1424/1425 AH (a study and edition of the Book of Adhan from Ibn Kathir's al-Ahkam al-Kubra); her progression from teaching assistant (1419 AH) to full professor in the Islamic Studies department (hadith and its sciences), College of Arts, in 1435 AH; membership of the board of trustees of the King Abdulaziz Center for National Dialogue from 1435 to 1439 AH; the Prince Naif Prize in 1427 AH for her research on women's rights in the Sunnah; the Princess Nourah University research excellence award of 1438 AH; and her chairing of the board of trustees of the Ithra' al-Ma'rifa limited endowment company. It names no legal school or theological affiliation for her."
