summary:
  ar: "مقالة ويكيبيديا العربية عن بي آر شيتي: وُلد في 1 آب 1942 في كابو بولاية كارناتاكا، تؤرخ لمسيرته في الإمارات ولانهيار إن إم سي وتجميد حساباته سنة 2020."
  en: "Arabic Wikipedia article on B. R. Shetty; it gives his birth on 1 August 1942 at Kaup in Karnataka and covers his UAE career, the NMC collapse and the 2020 freezing of his accounts in detail."
  es: "Artículo en árabe de la Wikipedia sobre BR Shetty; en él se indica que nació el 1 de agosto de 1942 en Kaup, Karnataka, y se detalla su trayectoria profesional en los Emiratos Árabes Unidos, el colapso de la NMC y la congelación de sus cuentas en 2020."
  fr: "Article Wikipédia en arabe sur BR Shetty; il indique sa naissance le 1er août 1942 à Kaup, dans le Karnataka, et couvre en détail sa carrière aux Émirats arabes unis, la faillite de la NMC et le gel de ses comptes en 2020."
  ur: "بی آر شیٹی پر عربی ویکیپیڈیا مضمون؛ یہ ان کی پیدائش 1 اگست 1942 کو کرناٹک کے کاپ میں ہوئی اور اس میں ان کے متحدہ عرب امارات کے کیریئر، NMC کے خاتمے اور 2020 میں ان کے کھاتوں کے منجمد ہونے کا تفصیل سے احاطہ کیا گیا ہے۔"
  tr: "B.R. Shetty hakkında Arapça Wikipedia makalesi: 1 Ağustos 1942'de Kabu, Karnataka'da doğan bu makale, BAE'deki kariyerini, NMC'nin çöküşünü ve 2020'de hesaplarının dondurulmasını anlatıyor."
  id: "Artikel Wikipedia berbahasa Arab tentang B.R. Shetty: Lahir pada 1 Agustus 1942 di Kabu, Karnataka, artikel ini mengisahkan kariernya di UEA, runtuhnya NMC, dan pembekuan akun-akunnya pada tahun 2020."
