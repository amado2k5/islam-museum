summary:
  ar: "مقالة ويكيبيديا الأردية عن نواب سر فتح علي خان قزلباش؛ تُستخدم لوقائع الكيان فقط. تؤكد سنواته 1862–1923 وحياته في لاهور، وتضيف مادة لا توجد في المقالة الإنجليزية: أنه كان تعلُّقدار نواب گنج علي آباد في بہرائچ، وأنه عمل مع راجا محمودآباد على تأسيس جامعة عليكره الإسلامية، وكان من مؤسسي كلية الشيعة في لكناو، وبنى إمام بارہ في بہرائچ، ودُفن في كربلاء."
  en: "Urdu Wikipedia article on Nawab Sir Fateh Ali Khan Qizilbash; used for entity facts only. It confirms his years 1862–1923 and his Lahore career, and adds material not in the English article: that he was taluqdar of Nawabganj Aliabad in Bahraich, worked alongside the Raja of Mahmudabad for the founding of Aligarh Muslim University, was among the founders of Shia College, Lucknow, built an imambargah in Bahraich, and was buried in Karbala."
  es: "Artículo de Wikipedia en urdu sobre Nawab Sir Fateh Ali Khan Qizilbash; utilizado únicamente para datos sobre la persona. Confirma su vida entre 1862 y 1923 y su trayectoria en Lahore, y añade información que no figura en el artículo en inglés: que fue taluqdar de Nawabganj Aliabad en Bahraich, trabajó junto al Raja de Mahmudabad en la fundación de la Universidad Musulmana de Aligarh, fue uno de los fundadores del Colegio Chiíta de Lucknow, construyó un imambargah en Bahraich y fue enterrado en Karbala."
  fr: "Article de Wikipédia en ourdou sur Nawab Sir Fateh Ali Khan Qizilbash; utilisé uniquement pour les informations sur l’entité. Il confirme ses années de naissance (1862-1923) et sa carrière à Lahore, et ajoute des éléments absents de l’article en anglais: il fut taluqdar de Nawabganj Aliabad à Bahraich, collabora avec le Raja de Mahmudabad à la fondation de l’Université musulmane d’Aligarh, fut parmi les fondateurs du Shia College de Lucknow, fit construire un imambargah à Bahraich et fut inhumé à Karbala."
  ur: "نواب سر فتح علی خان قزلباش پر اردو ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ان کے سال 1862-1923 اور ان کے لاہور کیرئیر کی تصدیق کرتا ہے، اور انگریزی مضمون میں اس مواد کو شامل نہیں کرتا ہے: کہ وہ بہرائچ کے نواب گنج علی آباد کے تالقدار تھے، علی گڑھ مسلم یونیورسٹی کے قیام کے لیے محمود آباد کے راجہ کے ساتھ کام کیا، شیعہ کالج، لکھنؤ کے بانیوں میں سے تھے، ایک امام بارگاہ بنوائی، اور بڑائچ میں ایک امام بارگاہ بنوائی۔"
  tr: "Nawab Sir Fateh Ali Khan Kızilbaş hakkında Urduca Wikipedia makalesi yalnızca varlığın olayları için kullanılmıştır. 1862–1923 yıllarını ve Lahor'daki yaşamını doğrular ve İngilizce makalede bulunmayan materyaller ekler: Bahrey'deki Nawab Ganj Aliabad'ın tehsildarı olduğu, Alikra İslami Üniversitesi'nin kurulmasında Raja Mahmudabad ile çalıştığı, Lucknow'daki Şii Koleji'nin kurucularından biri olduğu, Bahreyç'te bir İmam Barah inşa ettiği ve Kerbel'de defnedildiği belirtilmektedir."
  id: "Artikel Wikipedia Urdu tentang Nawab Sir Fateh Ali Khan Qizilbash hanya digunakan untuk peristiwa entitas tersebut. Artikel ini mengonfirmasi tahun-tahunnya 1862–1923 dan kehidupannya di Lahore, serta menambahkan materi yang tidak ditemukan dalam artikel bahasa Inggris: bahwa ia adalah tehsildar Nawab Ganj Aliabad di Bahraich, bahwa ia bekerja sama dengan Raja Mahmudabad untuk mendirikan Universitas Islam Alikra, merupakan salah satu pendiri Syiah College di Lucknow, membangun Imam Barah di Bahraich, dan dimakamkan di Karbala."
