summary:
  ar: "مقالة ويكيبيديا الأردية عن نواب سر فتح علي خان قزلباش؛ تُستخدم لوقائع الكيان فقط. تؤكد سنواته 1862–1923 وحياته في لاهور، وتضيف مادة لا توجد في المقالة الإنجليزية: أنه كان تعلُّقدار نواب گنج علي آباد في بہرائچ، وأنه عمل مع راجا محمودآباد على تأسيس جامعة عليكره الإسلامية، وكان من مؤسسي كلية الشيعة في لكناو، وبنى إمام بارہ في بہرائچ، ودُفن في كربلاء."
  en: "Urdu Wikipedia article on Nawab Sir Fateh Ali Khan Qizilbash; used for entity facts only. It confirms his years 1862–1923 and his Lahore career, and adds material not in the English article: that he was taluqdar of Nawabganj Aliabad in Bahraich, worked alongside the Raja of Mahmudabad for the founding of Aligarh Muslim University, was among the founders of Shia College, Lucknow, built an imambargah in Bahraich, and was buried in Karbala."
