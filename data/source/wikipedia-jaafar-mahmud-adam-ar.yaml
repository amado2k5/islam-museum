  ar: "مقالة ويكيبيديا العربية عن جعفر محمود آدم؛ تُستخدم لوقائع الكيان فقط. تصفه في متنها بأنه «عالم نيجيري سلفي» وعضو بارز في جماعة إزالة البدعة وإقامة السنة، وتذكر ولادته في 12 فبراير 1960 ووفاته مقتولا بالرصاص في مسجد بكانو في أبريل 2007؛ يكتفي صندوق معلوماتها بديانته «مسلم»."
