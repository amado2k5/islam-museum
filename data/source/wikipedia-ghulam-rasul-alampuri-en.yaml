  ar: "مقالة ويكيبيديا الإنجليزية عن غلام رسول عالم بوري (29 كانون الثاني 1849 – 7 آذار 1892)؛ تسميه شاعراً صوفياً بنجابياً، وتنص نقلاً عن مدخل شاكل في الموسوعة الإسلامية (EI3) على أنه لم يكن منتسباً إلى أي طريقة صوفية، بخلاف كثير من شعراء البنجاب."
  en: "The English Wikipedia article on Ghulam Rasul Alampuri (29 January 1849 – 7 March 1892); it calls him a Punjabi Sufi poet and author and states, on Shackle's Encyclopaedia of Islam (EI3) entry, that unlike many other Punjabi poets he was not affiliated with any Sufi order."
