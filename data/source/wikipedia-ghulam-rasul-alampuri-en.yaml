summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن غلام رسول عالم بوري ⁦(29 كانون الثاني 1849 – 7 آذار 1892)⁩؛ تسميه شاعراً صوفياً بنجابياً، وتنص نقلاً عن مدخل شاكل في الموسوعة الإسلامية (EI3) على أنه لم يكن منتسباً إلى أي طريقة صوفية، بخلاف كثير من شعراء البنجاب."
  en: "The English Wikipedia article on Ghulam Rasul Alampuri (29 January 1849 – 7 March 1892); it calls him a Punjabi Sufi poet and author and states, on Shackle's Encyclopaedia of Islam (EI3) entry, that unlike many other Punjabi poets he was not affiliated with any Sufi order."
  es: "El artículo de la Wikipedia en inglés sobre Ghulam Rasul Alampuri (29 de enero de 1849 - 7 de marzo de 1892) lo describe como un poeta y autor sufí punjabí y afirma, en la entrada de la Enciclopedia del Islam de Shackle (EI3), que a diferencia de muchos otros poetas punjabíes, no estaba afiliado a ninguna orden sufí."
  fr: "L'article de Wikipédia en anglais sur Ghulam Rasul Alampuri (29 janvier 1849 – 7 mars 1892); il le qualifie de poète et auteur soufi punjabi et déclare, dans l'entrée de l'Encyclopédie de l'Islam de Shackle (EI3), que contrairement à de nombreux autres poètes punjabi, il n'était affilié à aucun ordre soufi."
