reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision, resting on Dehkhoda's Loghatnama and Zabiullah Safa's Tarikh-e Adabiyat dar Iran (vol. 2, pp. 196-197). It gives his full name as Kamal al-Din Mas'ud, counts him among the 'arifan (Sufi masters), says he settled in Tabriz after the Hajj and lived in the khanqah Sultan Husayn Jalayirid built for him, and reports his death variously in 792, 803 or 808 AH, with his tomb at Tabriz."
