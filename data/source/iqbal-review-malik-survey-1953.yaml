  ar: "مسح نديم شفيق مالك في «مجلة إقبال» (أكتوبر 2001) لصحف باكستان الإنجليزية لسنة 1953؛ وفي حاشية سيرية فيه سنوات خليفة شجاع الدين (1887-1955) وأدواره: أستاذاً فخرياً بالكلية الإسلامية، وأميناً للرابطة الإسلامية بالبنجاب 1919-1936، ورئيساً للمجلس البنجابي 1951، ورئيساً للجنة الحكومية سنة 1955."
  en: "Nadeem Shafiq Malik's survey in Iqbal Review (October 2001) of Pakistan's 1953 English newspapers; a biographical footnote in it gives Khalifa Shujauddin's years (1887-1955) and posts: honorary professor at Islamia College, secretary of the Punjab Muslim League 1919-1936, Speaker of the Punjab Assembly in 1951, and president of the government commission in 1955."
