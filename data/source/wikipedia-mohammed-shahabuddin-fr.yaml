reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md). Read in its infobox and lead on 27 October 2026 through the browser search/open route, which exposes no revision id; this file therefore records the consultation date in place of a revision, and no revision id was invented. On faith: the infobox's 'Sunni Islam' is a single structured value; the Japanese, Korean and Romanian editions' infoboxes give Islam generically — all of them structured values of one attestation family, echoed in no article text, and not independent corroboration. The value is recorded in the person record's faith note, not adopted. No Arabic article on him was found, which is why the French edition is registered here."
