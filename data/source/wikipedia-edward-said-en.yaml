summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن إدوارد سعيد؛ تُستخدم لوقائع الكيان فقط. توثّق ميلاده في أسرة فلسطينية مسيحية بروتستانتية وتحوله إلى اللاادارية في آخر حياته، وسيرته الأكاديمية ونشاطه السياسي وموته سنة 2003."
  en: "English Wikipedia article on Edward Said; used for entity facts only. It records his birth into a Palestinian Christian family of Protestants and his later agnosticism, his academic career, his political activism and his death in 2003."
  es: "Artículo de la Wikipedia en inglés sobre Edward Said; se utiliza únicamente para obtener información sobre la persona. En él se narra su nacimiento en el seno de una familia palestina cristiana protestante, su posterior agnosticismo, su trayectoria académica, su activismo político y su fallecimiento en 2003."
  fr: "Article de Wikipédia en anglais sur Edward Said; utilisé uniquement pour les informations le concernant. Il relate sa naissance dans une famille palestinienne chrétienne protestante, son agnosticisme ultérieur, sa carrière universitaire, son activisme politique et son décès en 2003."
  ur: "ایڈورڈ سیڈ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں پروٹسٹنٹ کے ایک فلسطینی عیسائی گھرانے میں اس کی پیدائش اور اس کے بعد کی اگنوسٹکزم، اس کے تعلیمی کیریئر، اس کی سیاسی سرگرمی اور 2003 میں اس کی موت کو ریکارڈ کیا گیا ہے۔"
