reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Covers his birth in Jerusalem on 1 November 1935 into a family of Palestinian Christians — both parents Arab Christians adhering to Protestantism — his schooling at St George's School and Victoria College, Princeton (1957) and Harvard (MA 1960, PhD 1964), Columbia from 1963 to 2003, Orientalism (1978) and the later works, the Palestinian National Council years (1977-1991) and the break over Oslo, the 2000 Lebanon stone-throwing incident and its attributed explanations, the West-Eastern Divan Orchestra, his honours, and his death in New York after twelve years of chronic lymphocytic leukaemia. The article's lead and infobox date the death to 24 September 2003 while its own death section records that his gravestone gives 25 September — the date the Arabic article and Britannica give, which the person record follows. The article also states that although raised Protestant he became an agnostic in later years, and its references quote Iskander and Rustom describing him as 'of Christian background, a confirmed agnostic, perhaps even an atheist'. Read in full on 24 October 2026."
