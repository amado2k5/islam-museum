reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Covers her birth as Nour Al-Huda Mohamed Sultan Shaarawi at Minya on 23 June 1879, her marriage at thirteen to her cousin Ali Sha'arawi and the separation that gave her years of independence, her part in the 1919 revolution, the founding of the Wafdist Women's Central Committee (12 January 1920), the founding of the Egyptian Feminist Union in 1923, her removal of her veil on returning from the Rome congress of the International Woman Suffrage Alliance, the journal L'Égyptienne (1925, in Arabic from 1937), the 1938 Eastern Women's Conference for the Defense of Palestine, the Order of Virtues (1945), and her death on 12 December 1947. It names no religion or school for her. Read in full on 24 October 2026."
