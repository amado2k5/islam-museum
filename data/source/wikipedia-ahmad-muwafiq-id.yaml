reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026): a fact is used only where the article cites a source for it. Read on 4 November 2026 (the article is short): the lead gives his birth (2 March 1974, Lamongan), his standing as an NU ulama living in Sleman, Yogyakarta, and his service as personal assistant to Abdurrahman Wahid, including during Wahid's presidency, footnoted to Tempo's 2023 profile and NU Online's 2023 account of how the two met at Pulau Besar, Malacca; the personal-life section records that he heads the Minggir pesantren in Sleman and was an orator in the Indonesian Islamic Students Movement (PMII) while studying at UIN Sunan Kalijaga, footnoted to Radar Semarang and a 2024 news report. The article names no legal school for him. No revision id is recorded; the access date stands in its place."
