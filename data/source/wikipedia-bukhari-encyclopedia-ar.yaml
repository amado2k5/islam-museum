summary:
  ar: "مقالة ويكيبيديا العربية «موسوعة صحيح البخاري»، المراجعة 73503774 ⁦(13 فبراير 2026)⁩؛ لوقائع الكيان فقط: موقع يعتني بصحيح البخاري والكتب المؤلفة عليه، بدأ العمل فيه سنة 2003 وأُطلق إصداره الأول أوائل 2016 والثاني نهاية 2017 والثالث مطلع 2019، وربطه بفروع النسخة اليونينية، وقائمة كتبه."
  en: "Arabic Wikipedia article 'Sahih al-Bukhari Encyclopedia', revision 73503774 (13 February 2026); entity facts only: a website devoted to Sahih al-Bukhari and the books written on it, begun in 2003, with its first release in early 2016, the second at the end of 2017 and the third in early 2019, its linking to branches of the Yunini recension, and its book list."
  ur: "عربی ویکیپیڈیا کا مضمون «موسوعة صحيح البخاري»، نظرِ ثانی 73503774 ⁦(13 فروری 2026)⁩؛ صرف حقائق: صحیح بخاری اور اس پر لکھی گئی کتابوں کی ویب سائٹ، کام 2003 میں شروع، پہلا اجرا 2016 کے آغاز میں، دوسرا 2017 کے آخر میں، تیسرا 2019 کے آغاز میں، یونینی نسخے کی شاخوں سے ربط، اور کتابوں کی فہرست۔"
