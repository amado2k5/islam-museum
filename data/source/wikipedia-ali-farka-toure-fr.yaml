reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It gives his birth on 31 October 1939 at Kanau, some 65 km from Timbuktu, to a noble Arma family of Songhai origin; the move to Niafunké; work as a chauffeur; his collecting journeys across Mali with the writer Amadou Hampâté Bâ; his first group La Troupe 117 (1960); his first journey outside Africa, to the Sofia festival in 1968; the Radio Mali orchestra and sound engineering from 1970; a solo career from 1973 and the first record Farka (1976); The Source (dated 1991 here, 1992 in the English article) and Talking Timbuktu (dated 1993 here, released 1994 in the English article) and its Grammy; his election as mayor of Niafunké; his foundation of April 2005; his death on 7 March 2006 in Bamako and burial at Niafunké; and the third, posthumous Grammy for Ali and Toumani on 13 February 2011. The article states no religion for him."
