reliability_note: "Read in full on 7 November 2026; the reading tools available in this run did not expose a revision id, so none is recorded. Used for his birth (Bahman 1356 SH in Tehran, stated in the infobox and the Life section; Bahman 1356 runs from 21 January to 19 February 1978, so only the year 1978 is recorded in the person record), for his education to diploma level, for his professional start in maddahi in 1371 SH at fifteen, for the role of his meeting Saeed Haddadian at a martyrs' funeral procession in his progress, for his present heyat — «هیئت ریحانة الحسین» (Heyat Reyhanat al-Hossein) in the Bagh Feyz district of Tehran — and for the noheh 'Amoo Abbas' (عموعباس) that made him known. The article's prose calls him only «مداح اهل ایران» ('a maddah from Iran'); it nowhere attests a school or order for the man himself, and his profession is not a faith attestation. No English Wikipedia article for him was found in this run."
