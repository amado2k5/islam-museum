summary:
  ar: "مقالة ويكيبيديا الفارسية عن سيد مجيد بني فاطمة: تصفه بأنه مدّاح من إيران، مولود في طهران في بهمن 1356، بدأ المدّاحية جديًا سنة 1371 وهو في الخامسة عشرة، ويقيم مدّاحيته الآن في هيئة ريحانة الحسين في حي باغ فيض بطهران، واشتهر بنوحة «عمو عباس»."
  en: "The Persian Wikipedia article on Seyed Majid Banifatemeh: it describes him as a maddah from Iran, born in Tehran in Bahman 1356 SH, who began maddahi in earnest in 1371 SH at the age of fifteen, now performs at the Heyat Reyhanat al-Hossein in Tehran's Bagh Feyz district, and is known to the public through the noheh 'Amoo Abbas'."
