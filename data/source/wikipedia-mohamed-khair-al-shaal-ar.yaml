reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Fetched by its recorded revision (revid 76256780) via the MediaWiki API, the returned revid asserted equal, and read in full on 26 October 2026. The article gives his full name as Muhammad Khayr ibn Muhyi al-Din al-Sha'al, born in the al-Salihiyya district of Damascus in 1970; a degree in dentistry from Damascus University (1992, among the top ten of his class) and a doctorate in usul al-din from Omdurman Islamic University (2009) on the isnad study of the asbab al-nuzul reports of Surat al-Baqara; ijazas in the Six Books and the Muwatta and in the narrations and books of his hadith teacher Nur al-Din Itr; dawah and education studied under his teacher Ahmed Kuftaro; teaching posts in Damascus institutes from 2000 to 2011 and at the Levant Institute; Friday preaching in Damascus mosques alongside his dental practice; television and radio programmes and a large body of books and sermon collections. The article names no religion or school for him in text or infobox; its categories file him under Syrian Sunni scholars, which are category filings, not attestations."
