reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It gives Muhammad as born on 9 July 1988 in Chicago to Palestinian parents; Titan FC welterweight champion in 2016; UFC welterweight champion from 27 July 2024 (Leon Edwards, UFC 304) — the first UFC champion of Palestinian descent — losing the title to Jack Della Maddalena on 10 May 2025. Its Personal life section states 'Muhammad is a Muslim' and that he is 'an outspoken supporter of the Palestinian people': a bare statement of Islam, naming no school."
