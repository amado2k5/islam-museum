summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن جعفر سيد أحمد قريمر؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 1 سبتمبر 1889 في قيزيل طاش ووفاته في 3 أبريل 1960 في إسطنبول، وتفصّل وزارته للحربية والخارجية في جمهورية القرم الشعبية سنة 1917 وحياته في المنفى؛ ولا تتضمن أي محتوى ديني عنه."
  en: "English Wikipedia article on Cafer Seydahmet Kırımer; used for entity facts only. It gives his birth on 1 September 1889 at Kızıltaş and his death on 3 April 1960 in Istanbul, and details his 1917 ministry of foreign and military affairs in the Crimean People's Republic and his exile life; it contains no religion content about him."
  es: "Artículo de la Wikipedia en inglés sobre Cafer Seydahmet Kırımer; utilizado únicamente para datos biográficos. Indica su nacimiento el 1 de septiembre de 1889 en Kızıltaş y su fallecimiento el 3 de abril de 1960 en Estambul, y detalla su cargo como ministro de Asuntos Exteriores y Militares en la República Popular de Crimea en 1917 y su vida en el exilio; no contiene información sobre su religión."
  fr: "Article de Wikipédia en anglais sur Cafer Seydahmet Kırımer; utilisé uniquement pour les informations le concernant. Il indique sa naissance le 1er septembre 1889 à Kızıltaş et son décès le 3 avril 1960 à Istanbul, et détaille son mandat de ministre des Affaires étrangères et militaires de la République populaire de Crimée en 1917 ainsi que sa vie en exil; il ne contient aucune information religieuse à son sujet."
  ur: "Cafer Seydahmet Kırımer پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1 ستمبر 1889 کو Kızıltaş میں ان کی پیدائش اور 3 اپریل 1960 کو استنبول میں ان کی موت، اور کریمین عوامی جمہوریہ میں ان کی 1917 کی وزارت خارجہ اور عسکری امور اور اس کی جلاوطنی کی زندگی کی تفصیلات بیان کرتا ہے۔ اس میں اس کے بارے میں کوئی مذہبی مواد نہیں ہے۔"
  tr: "Jafar Seyed Ahmed Qarimer hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1 Eylül 1889'da Kızıltaş'ta doğduğunu ve 3 Nisan 1960'ta İstanbul'da ölümünü anlatır; 1917'de Kırım Halk Cumhuriyeti'ndeki Savaş ve Dışişleri Bakanlığı ile sürgündeki hayatını detaylandırır; hakkında dini içerik içermez."
  id: "Artikel Wikipedia bahasa Inggris tentang Jafar Seyed Ahmed Qarimer; hanya digunakan untuk fakta entitas. Artikel ini menceritakan kelahirannya pada 1 September 1889 di Kızıltaş dan kematiannya pada 3 April 1960 di Istanbul, serta merinci Kementerian Perang dan Urusan Luar Negerinya di Republik Rakyat Krimea pada tahun 1917 serta kehidupannya di pengasingan; tidak memuat konten keagamaan apapun tentang dirinya."
