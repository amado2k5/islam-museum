summary:
  ar: "عنصر ويكيداتا لليون الأفريقي (Q332790)؛ يحمل ست قيم متنافسة لمولده ⁦(1483 و1490 و1494 و1496 و1500)⁩ وقيمًا متضاربة لوفاته ⁦(1548 و1550 و1600)⁩، وغرناطة مكانًا للولادة وتونس مكانًا للوفاة، ودينه الكاثوليكية وبند «مسلمون سابقون»."
  en: "Wikidata item for Leo Africanus (Q332790); it carries six competing birth values (1483, 1490, 1494, 1496, 1500) and conflicting death values (1548, 1550, 1600), Granada as birthplace and Tunis as place of death, and religion values of Catholicism and the category-like 'ex-Muslims'."
  es: "Elemento de Wikidata para Leo Africanus (Q332790); contiene seis valores de nacimiento contradictorios (1483, 1490, 1494, 1496, 1500) y valores de muerte contradictorios (1548, 1550, 1600), Granada como lugar de nacimiento y Túnez como lugar de muerte, y valores religiosos de catolicismo y la categoría de \"exmusulmanes\"."
  fr: "L'élément Wikidata pour Leo Africanus (Q332790); il comporte six valeurs de naissance concurrentes (1483, 1490, 1494, 1496, 1500) et des valeurs de décès contradictoires (1548, 1550, 1600), Grenade comme lieu de naissance et Tunis comme lieu de décès, et des valeurs religieuses de catholicisme et de la catégorie « ex-musulmans »."
  ur: "ویکی ڈیٹا آئٹم برائے لیو افریقینس (Q332790)؛ اس میں چھ مسابقتی پیدائشی اقدار ⁦(1483، 1490، 1494، 1496، 1500)⁩ اور متضاد موت کی اقدار ⁦(1548، 1550، 1600)⁩، جائے پیدائش کے طور پر گراناڈا اور موت کی جگہ کے طور پر تیونس، اور کیتھولک مذہب کی مذہبی اقدار اور زمرہ نما 'سابق' مسلم ہیں۔"
  tr: "Afrika Lyon'un (Q332790) Wikidata öğesi, doğumu için altı rakip değer (1483, 1490, 1494, 1496 ve 1500), ölümü için çelişkili değerler (1548, 1550, 1600), doğum yeri olarak Granada, ölüm yeri olarak Tunus, dini olarak Katoliklik ve \"Eski Müslümanlar\" maddesi taşır."
  id: "Elemen Wikidata dari Lyon Afrika (Q332790) membawa enam nilai yang bersaing untuk kelahirannya (1483, 1490, 1494, 1496, dan 1500), nilai yang bertentangan untuk kematiannya (1548, 1550, 1600), Granada sebagai tempat lahir, Tunisia sebagai tempat kematian, agamanya sebagai Katolik, dan item \"Mantan Muslim.\""
