summary:
  ar: "كتاب «Hochsprache und Dialekt im Arabischen»، Werner Diem (author). لم يفتح المتحف هذا المرجع بنفسه؛ عُرف ما قيل عنه من ملخص بحثي قدّمه المؤسس إلى المتحف ووافق على استعماله في 21 نوفمبر 2026. يُستشهد به في: الفروق بين فصحى التراث وفصحى العصر."
  en: "The book \"Hochsprache und Dialekt im Arabischen\" (Werner Diem (author)). The museum did not open it itself: what is known of it comes from a research summary supplied to the museum by the founder, who approved its use on 21 November 2026. Cited for: the differences between Classical and Modern Standard Arabic."
  ur: "کتاب «Hochsprache und Dialekt im Arabischen»، Werner Diem (author)۔ عجائب گھر نے اسے خود نہیں کھولا؛ اس کے بارے میں جو معلوم ہے وہ بانی کے فراہم کردہ تحقیقی خلاصے سے ہے، جس کے استعمال کی منظوری بانی نے 21 نومبر 2026 کو دی۔ اس کا حوالہ ان کے لیے دیا گیا: کلاسیکی اور جدید معیاری عربی کے فرق۔"
  fr: "L'ouvrage « Hochsprache und Dialekt im Arabischen » (Werner Diem (author)). Le musée ne l'a pas ouvert lui-même : ce qu'on en sait vient d'un résumé de recherche fourni au musée par le fondateur, qui en a approuvé l'usage le 21 novembre 2026. Cité pour : les différences entre l'arabe classique et l'arabe standard moderne."
  es: "La obra «Hochsprache und Dialekt im Arabischen» (Werner Diem (author)). El museo no lo abrió por sí mismo: lo que se sabe de él procede de un resumen de investigación entregado al museo por el fundador, que aprobó su uso el 21 de noviembre de 2026. Citado para: las diferencias entre el árabe clásico y el árabe estándar moderno."
  tr: "\"Hochsprache und Dialekt im Arabischen\" adlı kitap, Werner Diem (yazar). Müze bu referansı kendisi açmadı; kurucusunun müzeye sunduğu bir araştırma özetinden öğrendi ve 21 Kasım 2026'da kullanmayı kabul etti. Kaynak şu kitapta yer almaktadır: Mirasın Klasik Arapçası ile Modern Standart Arapça Arasındaki Farklar."
  id: "Buku \"Hochsprache und Dialekt im Arabischen,\" Werner Diem (penulis). Museum tidak membuka referensi ini sendiri; museum mengetahui apa yang dikatakan tentangnya dari ringkasan penelitian yang diserahkan oleh pendiri museum dan setuju menggunakannya pada 21 November 2026. Referensi ini dikutip dalam: Perbedaan Antara Arab Klasik Warisan dan Arab Standar Modern."
