summary:
  ar: "مقال العربية عن عبد الله الشرقاوي ⁦(1150–1227 هـ)⁩؛ اسمه الكامل عبد الله بن حجازي بن إبراهيم الشرقاوي، وُلد بقرية الطويلة بالشرقية قرب بلبيس، وحفظ القرآن بالقرين ودرس بالأزهر، وأخذ الخلوتية عن الحفني ثم محمود الكردي، وتولى مشيخة الأزهر سنة 1208 هـ، وينصّ على أنه «كان شيخ علماء الشافعية ومفتيهم في عصره»، ويؤرخ وفاته بالقاهرة يوم الخميس 2 شوال 1227 هـ عن الجبرتي."
  en: "Arabic encyclopedia article on Abd Allah al-Sharqawi (1150–1227 AH); his full name is Abd Allah ibn Hijazi ibn Ibrahim al-Sharqawi, born at al-Tawila village in al-Sharqiyya near Bilbays, who memorised the Qur'an at al-Qurin, studied at al-Azhar, took the Khalwatiyya from al-Hifni and then Mahmud al-Kurdi, and became Grand Imam in 1208 AH. It states that 'he was the shaykh of the Shafi'i scholars and their mufti in his era', and dates his death in Cairo to Thursday 2 Shawwal 1227 AH, citing al-Jabarti."
  es: "Artículo de una enciclopedia árabe sobre Abd Allah al-Sharqawi (1150–1227 AH); su nombre completo es Abd Allah ibn Hijazi ibn Ibrahim al-Sharqawi, nacido en la aldea de al-Tawila en al-Sharqiyya cerca de Bilbays, quien memorizó el Corán en al-Qurin, estudió en al-Azhar, recibió la orden de Khalwatiyya de al-Hifni y luego de Mahmud al-Kurdi, y se convirtió en Gran Imán en 1208 AH. Afirma que \"fue el shaykh de los eruditos shafi'íes y su muftí en su época\", y fecha su muerte en El Cairo el jueves 2 de Shawwal de 1227 AH, citando a al-Jabarti."
  fr: "L'article d'une encyclopédie arabe consacré à Abd Allah al-Sharqawi (1150-1227 AH) mentionne qu'il était le cheikh des savants chaféites et leur mufti à son époque. Né au village d'al-Tawila, dans la région d'al-Sharqiyya près de Bilbays, il mémorisa le Coran à al-Qurin, étudia à al-Azhar, reçut l'ordination rabbinique (Khalwatiyya) d'al-Hifni puis de Mahmud al-Kurdi, et devint grand imam en 1208 AH. L'article précise qu'« il était le cheikh des savants chaféites et leur mufti à son époque » et date sa mort au Caire du jeudi 2 Shawwal 1227 AH, d'après al-Jabarti."
  ur: "عبد اللہ الشرقوی ⁦(1150-1227ھ)⁩ پر عربی انسائیکلوپیڈیا کا مضمون؛ ان کا پورا نام عبد اللہ بن حجازی ابن ابراہیم الشرقاوی ہے، جو بلبیس کے قریب الشرقیہ کے گاؤں التویلہ میں پیدا ہوئے، جس نے القرآن میں قرآن حفظ کیا، الازہر میں تعلیم حاصل کی، الحفنی سے خلوطیہ لیا اور پھر محمود الکردی، 2016 میں امام بن گئے۔ اس میں لکھا ہے کہ 'وہ اپنے دور میں شافعی علماء کے شیخ اور ان کے مفتی تھے'، اور الجبرتی کے حوالے سے ان کی وفات قاہرہ میں جمعرات 2 شوال 1227 ہجری کو ہوئی ہے۔"
  tr: "Abdullah el-Şerkavi (1150–1227 H) hakkında Arapça makale; tam adı Abdullah ibn Hicazi ibn İbrahim el-Şerkavi idi. Belbeis yakınlarındaki Doğu Eyaleti'nde El-Tavile köyünde doğdu. Kur'an'ı El-Kuran'da ezberledi ve El-Ezher'de eğitim aldı. İnzivayı önce El-Hafni'den ve ardından Mahmud el-Kurdi'den aldı. 1208 Hicri'de El-Ezher'in liderliğini üstlendi ve \"kendi döneminde Şafii âlimlerinin şeyhi ve onların müftüsü\" olduğunu belirtti. El-Cebarti'ye göre, ölümünü Kahire'de 2 Şevval 1227 Hicri Perşembe günü tarihlendirdi."
  id: "Artikel berbahasa Arab tentang Abdullah al-Sharqawi (1150–1227 H); nama lengkapnya adalah Abdullah ibn Hijazi ibn Ibrahim al-Sharqawi. Ia lahir di desa Al-Tawila di Provinsi Timur dekat Belbeis. Ia menghafal Al-Quran di Al-Qurain dan belajar di Al-Azhar. Ia belajar pengasingan di bawah bimbingan Al-Hafni dan kemudian Mahmoud Al-Kurdi. Ia mengambil alih kepemimpinan Al-Azhar pada tahun 1208 H, menyatakan bahwa ia adalah \"sheikh para ulama Syhafi'i dan mufti mereka pada zamannya.\" Ia mencatat kematiannya di Kairo pada hari Kamis, 2 Syawal 1227 H, menurut Al-Jabarti."
