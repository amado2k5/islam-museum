summary:
  ar: "مقال العربية عن عبد الله الشرقاوي ⁦(1150–1227 هـ)⁩؛ اسمه الكامل عبد الله بن حجازي بن إبراهيم الشرقاوي، وُلد بقرية الطويلة بالشرقية قرب بلبيس، وحفظ القرآن بالقرين ودرس بالأزهر، وأخذ الخلوتية عن الحفني ثم محمود الكردي، وتولى مشيخة الأزهر سنة 1208 هـ، وينصّ على أنه «كان شيخ علماء الشافعية ومفتيهم في عصره»، ويؤرخ وفاته بالقاهرة يوم الخميس 2 شوال 1227 هـ عن الجبرتي."
  en: "Arabic encyclopedia article on Abd Allah al-Sharqawi (1150–1227 AH); his full name is Abd Allah ibn Hijazi ibn Ibrahim al-Sharqawi, born at al-Tawila village in al-Sharqiyya near Bilbays, who memorised the Qur'an at al-Qurin, studied at al-Azhar, took the Khalwatiyya from al-Hifni and then Mahmud al-Kurdi, and became Grand Imam in 1208 AH. It states that 'he was the shaykh of the Shafi'i scholars and their mufti in his era', and dates his death in Cairo to Thursday 2 Shawwal 1227 AH, citing al-Jabarti."
