summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد بن عبد الكريم الخطابي ⁦(12 يناير 1882 بأجدير – 6 فبراير 1963 بالقاهرة)⁩، رئيس جمهورية الريف؛ تسرد تعليمه بفاس وعمله بمليلية وحرب الريف ونفيه إلى ريونيون ثم القاهرة."
  en: "The English Wikipedia article on Abd el-Krim (Muhammad ibn Abd al-Karim al-Khattabi; 12 January 1882 at Ajdir – 6 February 1963 at Cairo), president of the Republic of the Rif, covering his education at Fez, his work in Melilla, the Rif War and his exile on Réunion and then in Cairo."
  es: "El artículo de la Wikipedia en inglés sobre Abd el-Krim (Muhammad ibn Abd al-Karim al-Khattabi; 12 de enero de 1882 en Ajdir – 6 de febrero de 1963 en El Cairo), presidente de la República del Rif, abarca su educación en Fez, su trabajo en Melilla, la Guerra del Rif y su exilio en Reunión y luego en El Cairo."
  fr: "L'article de Wikipédia en anglais sur Abd el-Krim (Muhammad ibn Abd al-Karim al-Khattabi; 12 janvier 1882 à Ajdir – 6 février 1963 au Caire), président de la République du Rif, couvrant ses études à Fès, son travail à Melilla, la guerre du Rif et son exil à La Réunion puis au Caire."
  ur: "عبدالکریم پر انگریزی ویکیپیڈیا کا مضمون ⁦(محمد ابن عبد الکریم الخطابی؛ 12 جنوری 1882 اجدیر میں - 6 فروری 1963 قاہرہ میں)⁩، جمہوریہ رف کے صدر، فیز میں ان کی تعلیم، میلیلا میں ان کے کام، رف جنگ اور پھر قاہرہ میں اس کی جلاوطنی اور جلاوطنی۔"
  tr: "Rif Cumhuriyeti Cumhurbaşkanı Muhammed bin Abd al-Karim al-Hattabi (12 Ocak 1882, Agdir – 6 Şubat 1963, Kahire) hakkında İngilizce Vikipedi makalesi; Fez'deki eğitimini, Melilla'daki çalışmalarını, Rif Savaşı'nı ve önce Réunion'a, ardından Kahire'ye sürgününü anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Mohamed bin Abd al-Karim al-Khattabi (12 Januari 1882, Agdir – 6 Februari 1963, Kairo), Presiden Republik Rif; artikel ini menceritakan pendidikannya di Fez, pekerjaannya di Melilla, Perang Rif, dan pengasingannya ke Réunion dan kemudian Kairo."
