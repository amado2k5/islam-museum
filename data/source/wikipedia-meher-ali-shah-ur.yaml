summary:
  ar: "مقالة ويكيبيديا الأردية عن بير سيد مهر علي شاه، وهي نص مستقل عن الإنجليزية: تنص على مولده في غولرة شريف في 14 نيسان 1859 الموافق 1 رمضان 1275 هـ، وعلى بيعته على يد شمس الدين السيالوي في السلسلة الجشتية النظامية السليمانية ومنحه الخلافة، وتصفه بأنه عالم حنفي، وتؤرخ وفاته بيوم الثلاثاء 29 صفر 1356 هـ (11 أيار 1937)."
  en: "The Urdu Wikipedia article on Pir Syed Meher Ali Shah, a text independent of the English article: it states his birth at Golra Sharif on 14 April 1859, corresponding to 1 Ramadan 1275 AH, his bay'ah at the hand of Shams-ud-din Sialvi in the Chishtiyya Nizamiya Sulaymaniya and his grant of khilafa, describes him as a Hanafi scholar, and dates his death to Tuesday 29 Safar 1356 AH (11 May 1937)."
