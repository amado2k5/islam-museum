summary:
  ar: "مقالة ويكيبيديا الأردية عن بير سيد مهر علي شاه، وهي نص مستقل عن الإنجليزية: تنص على مولده في غولرة شريف في 14 نيسان 1859 الموافق 1 رمضان 1275 هـ، وعلى بيعته على يد شمس الدين السيالوي في السلسلة الجشتية النظامية السليمانية ومنحه الخلافة، وتصفه بأنه عالم حنفي، وتؤرخ وفاته بيوم الثلاثاء 29 صفر 1356 هـ ⁦(11 أيار 1937)⁩."
  en: "The Urdu Wikipedia article on Pir Syed Meher Ali Shah, a text independent of the English article: it states his birth at Golra Sharif on 14 April 1859, corresponding to 1 Ramadan 1275 AH, his bay'ah at the hand of Shams-ud-din Sialvi in the Chishtiyya Nizamiya Sulaymaniya and his grant of khilafa, describes him as a Hanafi scholar, and dates his death to Tuesday 29 Safar 1356 AH (11 May 1937)."
  es: "El artículo de Wikipedia en urdu sobre Pir Syed Meher Ali Shah, un texto independiente del artículo en inglés, indica su nacimiento en Golra Sharif el 14 de abril de 1859, correspondiente al 1 de Ramadán de 1275 AH, su bay'ah a manos de Shams-ud-din Sialvi en el Chishtiyya Nizamiya Sulaymaniya y su concesión del califato, lo describe como un erudito hanafi y fecha su muerte el martes 29 de Safar de 1356 AH (11 de mayo de 1937)."
  fr: "L'article de Wikipédia en ourdou sur Pir Syed Meher Ali Shah, un texte indépendant de l'article en anglais: il indique sa naissance à Golra Sharif le 14 avril 1859, correspondant au 1er Ramadan 1275 AH, sa bay'ah de la main de Shams-ud-din Sialvi dans la Chishtiyya Nizamiya Sulaymaniya et son octroi du khilafa, le décrit comme un érudit hanafite et date sa mort au mardi 29 Safar 1356 AH (11 mai 1937)."
  ur: "پیر سید مہر علی شاہ پر اردو ویکیپیڈیا کا مضمون، انگریزی مضمون سے آزاد ایک متن: اس میں آپ کی ولادت 14 اپریل 1859ء کو گولڑہ شریف میں ہوئی، جو 1 رمضان 1275 ہجری کو ہوئی، آپ کی بیعت شمس الدین سیالوی کے ہاتھ پر چشتیہ نظامیہ میں ہوئی، اور آپ کو ان کی بعثت کے طور پر سلیقہ سلیقہ سے منسوب کیا گیا۔ حنفی عالم، اور ان کی وفات بروز منگل 29 صفر 1356ھ ⁦(11 مئی 1937)⁩ ہے۔"
