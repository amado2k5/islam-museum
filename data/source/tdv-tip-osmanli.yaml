summary:
  ar: "القسم الثاني من مدخل «التِّبّ» في موسوعة TDV الإسلامية، بقلم نيل ساري (المجلد 41، إسطنبول 2012، ص 101–111). يتناول الطب في الدولة العثمانية: الهيئة الطبية والحكومية، الدار الشفاء، والتكوين، والمدرسة الطبية، وتنظيم الطب في الدولة وصولاً إلى التعليم الحديث."
  en: "The second part of the TDV İslâm Ansiklopedisi entry 'TIP' (medicine), on the Ottoman period, by Nil Sarı (vol. 41, Istanbul 2012, pp. 101–111). It covers the palace and state medical establishment, the dârüşşifâ hospitals, the physician's office and the grades of practice, the training of physicians in the Süleymaniye madrasa, and the move to modern medical schools."
