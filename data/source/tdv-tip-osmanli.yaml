reliability_note: "Read on 1 November 2026 in the web edition, second part of the entry (Sarı, printed pp. 101–111): the Ottoman sections on the hekimbaşı, palace hospitals, dârüşşifâs, the physicians' pay and licences, medicine and treatment, training, and the start of the section on modern medical education. Not read for this record: the later part of the modern education section (after the 1870s schools) and the section on Ottoman medical literature beyond its opening lines. The bibliography was not used except where the text itself is cited."
