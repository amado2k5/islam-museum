label: { ar: "الطِّبّ ⁦(العهد العثماني)⁩ — موسوعة TDV الإسلامية ⁦(نيل ساري)⁩", en: "TIP (Medicine), Ottoman period — TDV İslâm Ansiklopedisi (Nil Sarı)" }
summary:
  ar: "القسم الثاني من مدخل «التِّبّ» في موسوعة TDV الإسلامية، بقلم نيل ساري ⁦(المجلد 41، إسطنبول 2012، ص 101–111)⁩. يتناول الطب في الدولة العثمانية: الهيئة الطبية والحكومية، الدار الشفاء، والتكوين، والمدرسة الطبية، وتنظيم الطب في الدولة وصولاً إلى التعليم الحديث."
  en: "The second part of the TDV İslâm Ansiklopedisi entry 'TIP' (medicine), on the Ottoman period, by Nil Sarı (vol. 41, Istanbul 2012, pp. 101–111). It covers the palace and state medical establishment, the dârüşşifâ hospitals, the physician's office and the grades of practice, the training of physicians in the Süleymaniye madrasa, and the move to modern medical schools."
  es: "La segunda parte de la entrada «TIP» (medicina) de la TDV İslâm Ansiklopedisi, sobre el período otomano, de Nil Sarı (vol. 41, Estambul 2012, págs. 101-111), abarca el palacio y el sistema médico estatal, los hospitales dârüşşifâ, el consultorio médico y las categorías profesionales, la formación de médicos en la madrasa Süleymaniye y la transición a las escuelas de medicina modernas."
  fr: "La deuxième partie de l'article « TIP » (médecine) de la TDV İslâm Ansiklopedisi, consacré à la période ottomane, est signée Nil Sarı (vol. 41, Istanbul, 2012, p. 101-111). Elle aborde le système médical palatial et d'État, les hôpitaux dârüşşifâ, le cabinet médical et les différents niveaux de pratique, la formation des médecins à la madrasa Süleymaniye et la transition vers les écoles de médecine modernes."
  ur: "TDV İslâm Ansiklopedisi اندراج 'TIP' ⁦(طب)⁩ کا دوسرا حصہ، عثمانی دور پر، نیل ساری ⁦(جلد 41، استنبول 2012، صفحہ 101–111)⁩۔ اس میں محل اور ریاستی طبی ادارے، داروشیف اسپتال، معالج کے دفتر اور پریکٹس کے درجات، سلیمانی مدرسہ میں معالجین کی تربیت، اور جدید طبی اسکولوں میں منتقلی شامل ہیں۔"
  tr: "TDV İslami Ansiklopedisi'ndeki \"Al-Tab\" maddesinin ikinci bölümü, Neil Sarri tarafından (Cilt 41, İstanbul 2012, ss. 101–111). Osmanlı devletinde tıptı: tıbbi ve devlet kurumu Al-Dar al-Şifa, eğitim, tıp fakültesi ve devlette tıbbın organizasyonu, modern eğitime kadar."
  id: "Bagian kedua dari entri \"Al-Tab\" dalam Ensiklopedia Islam TDV, oleh Neil Sarri (Vol. 41, Istanbul 2012, hlm. 101–111). Bagian ini mencakup kedokteran di negara Ottoman: badan kedokteran dan pemerintahan, Al-Dar al-Shifa, pelatihan, sekolah kedokteran, dan organisasi kedokteran di negara bagian, hingga pendidikan modern."
