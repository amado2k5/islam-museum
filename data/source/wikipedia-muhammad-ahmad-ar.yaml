reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Richer than the English article on his family (his boat-builder father Abdullah ibn Fahal, his mother Zaynab bint Nasr, his three brothers), his schooling in the khalwas of Karari, al-Gezira and Berber, his marriage into Sheikh al-Qurashi's family, the sympathy of al-Afghani and Muhammad Abduh for his movement, his social ordinances (against tobacco, alcohol, lavish weddings and wailing), and the naming of his four caliphs. It dates his joining of the Sammaniyya to 1871 where the English article dates the start of his discipleship to 1861; the person record notes both. Its thought section reports, in a critical voice, his claims to meet the Prophet awake, his declaration of unbelief against opponents, and the objections of scholars such as al-Amin al-Darir — used in the prose only as attributed positions. It gives his birth as 8 August 1843 'and it is said 1844' (Hijri 1259, 'and it is said 1250'), against Wikidata's 12 August 1844, which the record follows with the conflict noted. Read in full on 24 October 2026."
