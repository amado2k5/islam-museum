  ar: "مقالة ويكيبيديا العربية «محمد أحمد المهدي»؛ تُستخدم لوقائع الكيان فقط. تفصّل نشأته في جزيرة لبب وكرري، وتتلمذه على مشايخ السمانية، ودعوته، ووفاته يوم الاثنين 9 رمضان 1302هـ الموافق 22 يونيو 1885م في أم درمان."
  en: "Arabic Wikipedia article «محمد أحمد المهدي»; used for entity facts only. It details his upbringing on Labab Island and at Karari, his discipleship under the Sammaniyya sheikhs, his call, and his death on Monday 9 Ramadan 1302 AH, corresponding to 22 June 1885, at Omdurman."
