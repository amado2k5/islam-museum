summary:
  ar: "صفحة تطبيق محاضرات أبرور مختار علي على AppBrain، تحمل نصًّا تعريفيًّا بالأوزبكية عن ميلاده وتعليمه وترجماته، متداولًا بنفس الصياغة في متاجر التطبيقات؛ تُستخدم لوقائع السيرة الأساسية مع التنبيه على طبيعتها."
  en: "The AppBrain page of the Abror Muxtor Aliy lecture app, carrying an Uzbek biographical text on his birth, education and translations, reproduced in the same wording across app stores; used for basic biographical facts with its nature noted."
  es: "La página de AppBrain de la aplicación de la conferencia de Abror Muxtor Aliy, que contiene un texto biográfico en uzbeko sobre su nacimiento, educación y traducciones, reproducido con la misma redacción en todas las tiendas de aplicaciones; se utiliza para datos biográficos básicos con su naturaleza indicada."
  fr: "La page AppBrain de l'application de conférences d'Abror Muxtor Aliy, contenant un texte biographique ouzbek sur sa naissance, son éducation et ses traductions, reproduit à l'identique sur toutes les plateformes de téléchargement d'applications; utilisée pour les informations biographiques de base avec indication de leur nature."
  ur: "Abror Muxtor Aliy لیکچر ایپ کا AppBrain صفحہ، جس میں ان کی پیدائش، تعلیم اور تراجم پر ازبک سوانحی متن ہے، جسے ایپ اسٹورز پر ایک ہی الفاظ میں دوبارہ پیش کیا گیا ہے۔ اس کی نوعیت کے ساتھ بنیادی سوانحی حقائق کے لیے استعمال کیا جاتا ہے۔"
  tr: "AppBrain'deki Abrour Mukhtar Ali Konferansları uygulama sayfası, doğumu, eğitimi ve çevirileri hakkında Özbekçe bir giriş metni içerir ve uygulama mağazalarında aynı ifadelerle dolaşıma girer; temel biyografi bilgileri için ve bunların doğasına dair bir not içerir."
  id: "Halaman aplikasi Abrour Mukhtar Ali Lectures di AppBrain berisi teks pengantar dalam bahasa Uzbek tentang kelahiran, pendidikan, dan terjemahannya, yang beredar dengan kata-kata yang sama di toko aplikasi; teks ini digunakan untuk fakta biografi dasar dengan catatan tentang sifatnya."
