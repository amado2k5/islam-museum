reliability_note: "The biography is a developer-published profile text for the lecture app that carries his talks, reproduced unchanged across app stores; it is a primary/profile source for basic biographical facts (birth, schooling, posts, translation work), not independent corroboration. It gives his birth as 22 July 1976 in Karkidon village, Chust district, Namangan region, his madrasa and Tashkent Islamic Institute education (2000–2008), a later journalism master's, his imam-khatib and teaching work, third place in the 2008 republican qurrāʾ competition, and his Uzbek translations. A mirrored encyclopedia text gives a conflicting birth day (22 March 1976); the conflict is preserved in the person record and the day is recorded as debated."
