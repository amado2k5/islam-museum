summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ألبوم «أدعية النبي الخاتم» ليوسف إسلام؛ لوقائع الكيان فقط: تاريخ صدوره في 14 سبتمبر 1999 عن جمال، وكونه تتمة «حياة النبي الخاتم»، ومضمونه من أدعية النبي، وفصوله؛ تستند إلى أول ميوزيك."
  en: "English Wikipedia article on Yusuf Islam's album Prayers of the Last Prophet; entity facts only: its release date of 14 September 1999 on Jamal, its place as the follow-up to The Life of the Last Prophet, its content of the Prophet's supplications, and its sections; it cites AllMusic."
  es: "Artículo de la Wikipedia en inglés sobre el álbum Prayers of the Last Prophet de Yusuf Islam; solo datos sobre la entidad: su fecha de lanzamiento, el 14 de septiembre de 1999, en Jamal, su lugar como continuación de The Life of the Last Prophet, su contenido de las súplicas del Profeta y sus secciones; cita a AllMusic."
  fr: "Article de Wikipédia en anglais sur l'album Prayers of the Last Prophet de Yusuf Islam; informations uniquement sur l'album: sa date de sortie le 14 septembre 1999 chez Jamal, sa place en tant que suite de The Life of the Last Prophet, son contenu de supplications du Prophète et ses sections; il cite AllMusic."
  ur: "انگریزی ویکیپیڈیا مضمون یوسف اسلام کے البم پریئرز آف دی لاسٹ نبی پر؛ صرف ہستی کے حقائق: جمال پر 14 ستمبر 1999 کو اس کی ریلیز کی تاریخ، آخری نبی کی زندگی کی پیروی کے طور پر اس کا مقام، پیغمبر کی دعاؤں کا مواد، اور اس کے حصے؛ یہ AllMusic کا حوالہ دیتا ہے۔"
  tr: "Yusuf Islam'ın 'The Prayers of the Seal of the Prophet' albümü hakkında İngilizce Wikipedia makalesi; sadece varlık olayları için: çıkış tarihi 14 Eylül 1999'dur, Cemal hakkında ve 'Peygamberin Mührü'nün Hayatı'nın devamı olarak, içeriği Peygamber'in duaları ve bölümlerinden alınmıştır; ilk müziğe dayanmaktadır."
  id: "Artikel Wikipedia bahasa Inggris tentang album 'The Prayers of the Seal of the Prophet' oleh Yusuf Islam; hanya untuk peristiwa entitas tersebut: tanggal rilisnya adalah 14 September 1999, tentang Jamal, dan sebagai sekuel dari 'The Life of the Seal of the Prophet,' isinya dari doa dan bab-bab Nabi; ini didasarkan pada musik pertama."
