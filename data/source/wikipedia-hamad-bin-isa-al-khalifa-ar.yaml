summary:
  ar: "مقالة ويكيبيديا العربية عن حمد بن عيسى آل خليفة؛ تُستخدم لوقائع الكيان فقط. توافق الإنجليزية في الولادة (28 يناير 1950) والمناصب العسكرية وتولّي الحكم سنة 1999 ثم الملكية سنة 2002، وتذكر اسمه الكامل عند الولادة. لا يرد في صندوق معلوماتها ولا في متنها أي ذكر لدينه أو مذهبه، وتصنيفاتها تصفه بالمسلم البحريني والسنّي تصنيفًا."
  en: "Arabic Wikipedia article on Hamad bin Isa Al Khalifa; used for entity facts only. It agrees with the English article on his birth (28 January 1950), his military posts, his accession in 1999 and the kingship of 2002, and gives his full birth name. Neither its infobox nor its text makes any statement of his religion or school; its categories file him as a Bahraini Muslim and a Bahraini Sunni — filings, which never attest."
