summary:
  ar: "مقالة ويكيبيديا العربية عن حمد بن عيسى آل خليفة؛ تُستخدم لوقائع الكيان فقط. توافق الإنجليزية في الولادة ⁦(28 يناير 1950)⁩ والمناصب العسكرية وتولّي الحكم سنة 1999 ثم الملكية سنة 2002، وتذكر اسمه الكامل عند الولادة. لا يرد في صندوق معلوماتها ولا في متنها أي ذكر لدينه أو مذهبه، وتصنيفاتها تصفه بالمسلم البحريني والسنّي تصنيفًا."
  en: "Arabic Wikipedia article on Hamad bin Isa Al Khalifa; used for entity facts only. It agrees with the English article on his birth (28 January 1950), his military posts, his accession in 1999 and the kingship of 2002, and gives his full birth name. Neither its infobox nor its text makes any statement of his religion or school; its categories file him as a Bahraini Muslim and a Bahraini Sunni — filings, which never attest."
  es: "Artículo en árabe de la Wikipedia sobre Hamad bin Isa Al Khalifa; utilizado únicamente para datos sobre la persona. Coincide con el artículo en inglés sobre su nacimiento (28 de enero de 1950), sus cargos militares, su ascenso al trono en 1999 y su reinado en 2002, e incluye su nombre completo de nacimiento. Ni su ficha informativa ni su texto mencionan su religión o escuela religiosa; sus categorías lo clasifican como musulmán y sunita bareiní, clasificaciones que nunca se corroboran."
  fr: "Article de Wikipédia en arabe sur Hamad bin Isa Al Khalifa; utilisé uniquement pour les informations factuelles. Il concorde avec l’article en anglais concernant sa naissance (28 janvier 1950), ses fonctions militaires, son accession au trône en 1999 et son couronnement en 2002, et mentionne son nom de naissance complet. Ni son infobox ni son texte ne font mention de sa religion ou de son école religieuse; ses catégories le présentent comme musulman et sunnite bahreïni – des affirmations qui ne sont jamais étayées."
