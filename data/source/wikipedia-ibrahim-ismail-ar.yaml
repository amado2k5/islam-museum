summary:
  ar: "مقالة ويكيبيديا العربية عن إبراهيم إسماعيل، السلطان إبراهيم سلطان جوهر؛ تُستخدم لوقائع الكيان فقط. تؤكد مولده في 22 نوفمبر 1958 في مستشفى السلطانة أمينة، وكونه سلطان جوهر الخامس والعشرين وملك ماليزيا السابع عشر، وتأسيسه جولة «كمبارا ماهكوتا جوهر» السنوية للدراجات النارية."
  en: "Arabic Wikipedia article on Ibrahim Ismail, Sultan Ibrahim of Johor; used for entity facts only. It confirms his birth on 22 November 1958 at the Sultanah Aminah Hospital, his standing as the twenty-fifth Sultan of Johor and seventeenth King of Malaysia, and his founding of the annual Kembara Mahkota Johor motorcycle tour."
  es: "Artículo en árabe de la Wikipedia sobre Ibrahim Ismail, sultán Ibrahim de Johor; utilizado únicamente para datos sobre la persona. Confirma su nacimiento el 22 de noviembre de 1958 en el Hospital Sultanah Aminah, su condición de vigésimo quinto sultán de Johor y decimoséptimo rey de Malasia, y la fundación del recorrido anual en motocicleta Kembara Mahkota Johor."
  fr: "Article de Wikipédia en arabe sur Ibrahim Ismail, sultan Ibrahim de Johor; utilisé uniquement à des fins d’information sur l’entité. Il confirme sa naissance le 22 novembre 1958 à l’hôpital Sultanah Aminah, son statut de vingt-cinquième sultan de Johor et dix-septième roi de Malaisie, ainsi que la création du rallye moto annuel Kembara Mahkota Johor."
  ur: "ابراہیم اسماعیل، جوہر کے سلطان ابراہیم پر عربی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 22 نومبر 1958 کو سلطانہ امینہ ہسپتال میں اس کی پیدائش، جوہر کے پچیسویں سلطان اور ملائیشیا کے سترویں بادشاہ کے طور پر اس کے کھڑے ہونے، اور سالانہ کیمبرا مہکوٹا جوہر موٹر سائیکل ٹور کے بانی کی تصدیق کرتا ہے۔"
