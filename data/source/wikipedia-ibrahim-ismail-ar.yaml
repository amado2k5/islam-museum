  ar: "مقالة ويكيبيديا العربية عن إبراهيم إسماعيل، السلطان إبراهيم سلطان جوهر؛ تُستخدم لوقائع الكيان فقط. تؤكد مولده في 22 نوفمبر 1958 في مستشفى السلطانة أمينة، وكونه سلطان جوهر الخامس والعشرين وملك ماليزيا السابع عشر، وتأسيسه جولة «كمبارا ماهكوتا جوهر» السنوية للدراجات النارية."
  en: "Arabic Wikipedia article on Ibrahim Ismail, Sultan Ibrahim of Johor; used for entity facts only. It confirms his birth on 22 November 1958 at the Sultanah Aminah Hospital, his standing as the twenty-fifth Sultan of Johor and seventeenth King of Malaysia, and his founding of the annual Kembara Mahkota Johor motorcycle tour."
