summary:
  ar: "مقالة ويكيبيديا الأردية عن أحمد تاج الدين، بذرة قصيرة؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 22 آب 1913 ووفاته في 3 حزيران 1950، مخالفةً بذلك المقالات الإنجليزية والملايوية والعربية في يوم الوفاة، وتصنّف تصنيفاتها مولده أيضًا تحت سنتي 1912 و1913."
  en: "Urdu Wikipedia article on Ahmad Tajuddin, a short stub; used for entity facts only. It gives his birth as 22 August 1913 and his death as 3 June 1950 — differing from the English, Malay and Arabic articles on the death day — and its categories likewise file his birth under both 1912 and 1913."
  es: "Artículo de Wikipedia en urdu sobre Ahmad Tajuddin, un breve esbozo; utilizado únicamente para datos sobre la persona. Indica que nació el 22 de agosto de 1913 y falleció el 3 de junio de 1950 —a diferencia de los artículos en inglés, malayo y árabe sobre la fecha de su muerte— y sus categorías también clasifican su nacimiento como de 1912 y 1913."
  fr: "L'article Wikipédia en ourdou sur Ahmad Tajuddin est une ébauche succincte, utilisée uniquement pour les informations factuelles. Il indique sa naissance le 22 août 1913 et son décès le 3 juin 1950 — contrairement aux articles en anglais, en malais et en arabe concernant la date du décès — et ses catégories classent également sa naissance à la fois sous 1912 et 1913."
  ur: "احمد تاج الدین پر اردو ویکیپیڈیا کا مضمون، ایک مختصر سٹب؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کی پیدائش 22 اگست 1913 اور اس کی موت 3 جون 1950 بتائی گئی ہے - جو یوم وفات پر انگریزی، مالائی اور عربی مضامین سے مختلف ہے - اور اس کے زمرے اسی طرح ان کی پیدائش 1912 اور 1913 دونوں کے تحت درج کرتے ہیں۔"
  tr: "Ahmad Taceddin hakkında Urduca Vikipedi makalesi, kısa bir taslak; yalnızca varlığın gerçekleri için kullanılmıştır. Doğumunu 22 Ağustos 1913'te, ölümünü ise 3 Haziran 1950'de vermektedir; böylece İngilizce, Malayca ve Arapça ölüm gününe dair makalelerin aksine, ayrıca bu sınıflandırmalar da doğumunu 1912 ve 1913 yılları altında sınıflandırır."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang Ahmad Taj al-Din, sebuah artikel singkat; digunakan hanya untuk fakta entitas tersebut. Artikel ini mencantumkan kelahirannya pada 22 Agustus 1913, dan kematiannya pada 3 Juni 1950, sehingga berbeda dengan artikel dalam bahasa Inggris, Melayu, dan Arab pada hari kematian, dan klasifikasinya juga mengklasifikasikan kelahirannya di bawah tahun 1912 dan 1913."
