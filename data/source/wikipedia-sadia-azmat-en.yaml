reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision via the MediaWiki API on 1 November 2026; a fact is used only where the article cites a source for it (Wikipedia broad rule). Used for her birth in Leyton, London, her start in stand-up in 2010 after call-centre work, her Edinburgh Fringe shows Please Hold (2011) and I Am Not Malala (2014), the BBC Three short Things I Have Been Asked As a British Muslim (2015), the BBC Sounds podcast No Country for Young Women (2018-2020) and her memoir Sex Bomb (2022). Her own first-person titles and the article's account present her generically as a Muslim woman - she began wearing hijab at 19 and titled a 2019 Metro article 'Horny Muslim women like me aren't supposed to exist during Ramadan' - but no text in the article names a school or order for her. The article's infobox and categories give her birth year as 1990 with no citation visible, against Wikidata's 1987; the record builds 1987 as debated and preserves the 1990 reading here and in the born note."
