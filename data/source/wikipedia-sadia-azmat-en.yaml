summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سعدية عظمت: فنانة كوميدية ومؤلفة ومذيعة إنجليزية وُلدت في لايتون بلندن. تذكر قالب المعلومات سنة ميلادها 1990 وتصنّفها المقالة ضمن مواليد 1990، بينما تخصص كوميدياها تجربتها كامرأة مسلمة بريطانية."
  en: "English Wikipedia article on Sadia Azmat, the English stand-up comedian, author and broadcaster born in Leyton, London. Its infobox gives her birth year as 1990 and the article files her under 1990 births, while her comedy draws on her experience as a British Muslim woman."
  es: "Artículo de la Wikipedia en inglés sobre Sadia Azmat, la comediante, autora y locutora británica nacida en Leyton, Londres. Su ficha informativa indica que nació en 1990 y el artículo la incluye entre los nacidos ese año, mientras que su comedia se basa en su experiencia como mujer musulmana británica."
  fr: "L'article de Wikipédia en anglais consacré à Sadia Azmat, humoriste, auteure et animatrice britannique née à Leyton (Londres), indique qu'elle est née en 1990 et la classe dans la catégorie des personnes nées en 1990. Son humour s'inspire de son expérience de femme musulmane britannique."
  ur: "سعدیہ عظمت پر انگریزی ویکیپیڈیا کا مضمون، انگلش اسٹینڈ اپ کامیڈین، مصنفہ اور براڈکاسٹر لیٹن، لندن میں پیدا ہوئیں۔ اس کے معلوماتی خانے میں اس کی پیدائش کا سال 1990 بتایا گیا ہے اور مضمون میں اس کی پیدائش 1990 سے کم ہے، جب کہ اس کی کامیڈی ایک برطانوی مسلمان خاتون کے طور پر اس کے تجربے کو بیان کرتی ہے۔"
  tr: "Saadia Azmat hakkında İngilizce Wikipedia makalesi: Londra, Layton'da doğmuş İngiliz komedyen, yazar ve sunucu. Bilgi kutusunda doğum yılı 1990 olarak belirtiliyor ve makale onu 1990 doğumlu olarak sınıflandırıyor; komedyeni ise deneyimini Britanyalı Müslüman bir kadın olarak anlatıyor."
  id: "Artikel Wikipedia bahasa Inggris tentang Saadia Azmat: Seorang komedian, penulis, dan presenter Inggris yang lahir di Layton, London. Infobox menyebutkan tahun kelahirannya sebagai 1990, dan artikel tersebut mengkategorikannya sebagai lahir pada 1990, sementara komediannya mendedikasikan pengalamannya sebagai perempuan Muslim Inggris."
