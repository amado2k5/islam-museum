summary:
  ar: "مقالة ويكيبيديا الفارسية عن شروين بيشه‌ور، تعطي ولادته في طهران سنة 1974 وجنسيته الأمريكية ومهنته رائد أعمال ومستثمرًا مغامرًا. لا تذكر أي انتماء ديني."
  en: "The Persian Wikipedia article on Shervin Pishevar, giving his birth at Tehran in 1974, his American citizenship and his occupation as entrepreneur and venture capitalist. It names no religious affiliation."
  es: "El artículo de Wikipedia en persa sobre Shervin Pishevar indica que nació en Teherán en 1974, que tiene ciudadanía estadounidense y que se dedica a ser empresario y capitalista de riesgo. No menciona ninguna afiliación religiosa."
  fr: "L'article Wikipédia en persan consacré à Shervin Pishevar indique sa naissance à Téhéran en 1974, sa nationalité américaine et sa profession d'entrepreneur et de capital-risqueur. Il ne mentionne aucune appartenance religieuse."
  ur: "شیروین پشیور پر فارسی ویکیپیڈیا کا مضمون، 1974 میں تہران میں اس کی پیدائش، اس کی امریکی شہریت اور کاروباری اور کاروباری سرمایہ دار کے طور پر اس کا پیشہ۔ یہ کسی مذہبی وابستگی کا نام نہیں لیتا۔"
  tr: "Farsça Vikipedi makalesi, Şerwin Bishavar hakkında 1974'te Tahran'da doğduğunu, Amerikan vatandaşlığını ve girişimcilik ve girişim sermayedarı olarak mesleğini anlatıyor. Herhangi bir dini aidiyetten bahsetmiyor."
  id: "Artikel Wikipedia Persia tentang Sherwin Bishavar menyebutkan kelahirannya di Teheran pada tahun 1974, kewarganegaraan Amerika, dan profesinya sebagai pengusaha serta kapitalis ventura. Artikel tersebut tidak menyebutkan afiliasi agama apa pun."
