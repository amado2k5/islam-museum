  ar: "مقالة ويكيبيديا الإنجليزية عن حكيم أجمل خان؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في دلهي في أسرة أطباء يونانيين، وطبّه ومرضاه، ومؤسساته (كلية الطبية والجامعة الملية الإسلامية)، ونشاطه السياسي في الرابطة الإسلامية وحركة الخلافة ورئاسته المؤتمر الوطني الهندي 1921، ووفاته في 29 ديسمبر 1927."
  en: "English Wikipedia article on Hakim Ajmal Khan; used for entity facts only. It recounts his Delhi birth into a family of Unani physicians, his medical practice, his institutions (the Tibbia College and Jamia Millia Islamia), his politics in the Muslim League and the Khilafat movement and his 1921 Congress presidency, and his death on 29 December 1927."
