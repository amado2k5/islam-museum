summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حكيم أجمل خان؛ تُستخدم لوقائع الكيان فقط. تروي نشأته في دلهي في أسرة أطباء يونانيين، وطبّه ومرضاه، ومؤسساته ⁦(كلية الطبية والجامعة الملية الإسلامية)⁩، ونشاطه السياسي في الرابطة الإسلامية وحركة الخلافة ورئاسته المؤتمر الوطني الهندي 1921، ووفاته في 29 ديسمبر 1927."
  en: "English Wikipedia article on Hakim Ajmal Khan; used for entity facts only. It recounts his Delhi birth into a family of Unani physicians, his medical practice, his institutions (the Tibbia College and Jamia Millia Islamia), his politics in the Muslim League and the Khilafat movement and his 1921 Congress presidency, and his death on 29 December 1927."
  es: "Artículo de la Wikipedia en inglés sobre Hakim Ajmal Khan; utilizado únicamente para obtener información sobre la persona. Relata su nacimiento en Delhi en el seno de una familia de médicos Unani, su práctica médica, sus instituciones (el Colegio Tibbia y la Universidad Jamia Millia Islamia), su participación política en la Liga Musulmana y el movimiento Khilafat, su presidencia del Congreso en 1921 y su fallecimiento el 29 de diciembre de 1927."
  fr: "Article de Wikipédia en anglais sur Hakim Ajmal Khan; utilisé uniquement pour les informations sur l’entité. Il relate sa naissance à Delhi dans une famille de médecins Unani, sa pratique médicale, ses institutions (le Tibbia College et la Jamia Millia Islamia), son engagement politique au sein de la Ligue musulmane et du mouvement Khilafat, sa présidence du Congrès en 1921 et sa mort le 29 décembre 1927."
  ur: "حکیم اجمل خان پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی دہلی کی پیدائش یونانی معالجین کے خاندان میں، ان کی طبی مشق، ان کے ادارے ⁦(طبیہ کالج اور جامعہ ملیہ اسلامیہ)⁩، مسلم لیگ میں ان کی سیاست اور تحریک خلافت اور ان کی 1921 کی کانگریس کی صدارت، اور 29 دسمبر 1927 کو ان کی موت کا ذکر ہے۔"
  tr: "Hakim Ajmal Khan hakkında İngilizce Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Delhi'de Yunan doktorlardan oluşan bir ailede büyümesini, tıbbını ve hastalarını, kurumlarını (tıp fakültesi ve Millia İslam Üniversitesi), Müslüman Birliği ve Hilafe Hareketi'ndeki siyasi faaliyetlerini, 1921'de Hindistan Ulusal Kongresi başkanlığını ve 29 Aralık 1927'deki ölümünü anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Hakim Ajmal Khan; digunakan hanya untuk fakta entitas tersebut. Artikel ini menceritakan masa kecilnya di Delhi dalam keluarga dokter Yunani, obat dan pasiennya, institusinya (fakultas kedokteran dan Universitas Islam Millia), aktivitas politiknya di Liga Muslim dan Gerakan Khilafa, kepresidenannya di Kongres Nasional India pada tahun 1921, serta kematiannya pada 29 Desember 1927."
