summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سيث إدولجي دينشا (1842–1914)، المحسن البارسي الكراتشوي: نشأته من الفقر إلى أكبر مالك أراضٍ في كراتشي، وثروته من المقاولات للجيش البريطاني في الحرب الأفغانية الثانية، وأعماله الخيرية في المستشفيات والتعليم، ووفاته في البحر قرب بورسعيد سنة 1914."
  en: "English Wikipedia article on Seth Edulji Dinshaw (1842–1914), the Karachi Parsi philanthropist: his rise from poverty to become the city's largest landowner, his fortune made as a British Army contractor in the Second Afghan War, his hospital and education endowments, and his death at sea near Port Said in 1914."
  es: "Artículo de la Wikipedia en inglés sobre Seth Edulji Dinshaw (1842-1914), el filántropo parsi de Karachi: su ascenso desde la pobreza hasta convertirse en el mayor terrateniente de la ciudad, la fortuna que amasó como contratista del ejército británico en la Segunda Guerra Anglo-Afgana, sus donaciones a hospitales y centros educativos, y su muerte en el mar cerca de Port Said en 1914."
  fr: "Article de Wikipédia en anglais sur Seth Edulji Dinshaw (1842-1914), le philanthrope parsi de Karachi: son ascension de la pauvreté à devenir le plus grand propriétaire foncier de la ville, sa fortune amassée en tant qu’entrepreneur de l’armée britannique pendant la deuxième guerre anglo-afghane, ses fondations pour les hôpitaux et l’éducation, et sa mort en mer près de Port-Saïd en 1914."
  ur: "کراچی پارسی مخیر سیٹھ ایڈولجی ڈنشا (1842–1914) پر انگریزی ویکیپیڈیا کا مضمون: ان کا غربت سے اٹھ کر شہر کا سب سے بڑا زمیندار بننا، دوسری افغان جنگ میں برطانوی فوج کے ٹھیکیدار کے طور پر اس کی خوش قسمتی، اس کے ہسپتال اور تعلیم کے وقفے، اور 1914 میں پورٹ سید کے قریب سمندر میں اس کی موت۔"
  tr: "Seth Edulci Dinsha (1842–1914), Parsi hayırsever Karachoi hakkında İngilizce Wikipedia makalesi: yoksulluktan Karaçi'nin en büyük toprak sahibine yükselişi, İkinci Afgan Savaşı sırasında İngiliz Ordusu sözleşmelerinden elde ettiği servet, hastane ve eğitimdeki hayırsever çalışmaları ve 1914'te Port Said yakınlarında denizde ölümü."
  id: "Artikel Wikipedia bahasa Inggris tentang Seth Edulci Dinsha (1842–1914), dermawan Parsi Karachoi: kenaikannya dari kemiskinan menjadi pemilik tanah terbesar di Karachi, kekayaannya dari kontrak Tentara Inggris selama Perang Afghanistan Kedua, kerja amalnya di rumah sakit dan pendidikan, serta kematiannya di laut dekat Port Said pada tahun 1914."
