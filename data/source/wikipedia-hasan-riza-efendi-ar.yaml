summary:
  ar: "مقالة ويكيبيديا العربية عن حسن رضا أفندي، وهي مقالته الوحيدة في أي لغة؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في أسكدار بإسطنبول سنة 1849 (1265هـ)، وأخذه التعليق عن سامي أفندي والخط عن شفيق بك، وإمامته فرقة الموسيقى الهمايونية سنة 1871، وتدريسه في مدرسة الخطاطين من 1914، ومصاحفه التسعة عشر، ووفاته في 10 جمادى الآخرة 1338هـ وتفسّرها بـ2 مارس 1920."
  en: "Arabic Wikipedia article on Hasan Rıza Efendi, his only Wikipedia article in any language; used for entity facts only. It gives his birth at Üsküdar, Istanbul, in 1849 (1265 AH), his ta'liq studies under Sami Efendi and calligraphy under Şefik Bey, his imamate of the imperial band in 1871, his teaching at the School of Calligraphers from 1914, his nineteen mushafs, and his death on 10 Jumada al-Akhira 1338 AH, which it glosses as 2 March 1920."
