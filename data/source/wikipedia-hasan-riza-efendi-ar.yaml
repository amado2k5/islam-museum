summary:
  ar: "مقالة ويكيبيديا العربية عن حسن رضا أفندي، وهي مقالته الوحيدة في أي لغة؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في أسكدار بإسطنبول سنة 1849 ⁦(1265هـ)⁩، وأخذه التعليق عن سامي أفندي والخط عن شفيق بك، وإمامته فرقة الموسيقى الهمايونية سنة 1871، وتدريسه في مدرسة الخطاطين من 1914، ومصاحفه التسعة عشر، ووفاته في 10 جمادى الآخرة 1338هـ وتفسّرها بـ2 مارس 1920."
  en: "Arabic Wikipedia article on Hasan Rıza Efendi, his only Wikipedia article in any language; used for entity facts only. It gives his birth at Üsküdar, Istanbul, in 1849 (1265 AH), his ta'liq studies under Sami Efendi and calligraphy under Şefik Bey, his imamate of the imperial band in 1871, his teaching at the School of Calligraphers from 1914, his nineteen mushafs, and his death on 10 Jumada al-Akhira 1338 AH, which it glosses as 2 March 1920."
  es: "Artículo en árabe de la Wikipedia sobre Hasan Rıza Efendi, su único artículo en Wikipedia en cualquier idioma; utilizado únicamente para datos sobre la persona. Indica su nacimiento en Üsküdar, Estambul, en 1849 (1265 AH), sus estudios de ta'liq con Sami Efendi y de caligrafía con Şefik Bey, su imamato de la banda imperial en 1871, su enseñanza en la Escuela de Calígrafos desde 1914, sus diecinueve mushafs y su muerte el 10 de Jumada al-Akhira de 1338 AH, que se traduce como el 2 de marzo de 1920."
  fr: "Article Wikipédia en arabe consacré à Hasan Rıza Efendi, le seul article Wikipédia le concernant, toutes langues confondues; utilisé uniquement pour les informations le concernant. Il indique sa naissance à Üsküdar, Istanbul, en 1849 (1265 AH), ses études de ta'liq auprès de Sami Efendi et de calligraphie auprès de Şefik Bey, son imamat de la bande impériale en 1871, son enseignement à l'École des calligraphes à partir de 1914, ses dix-neuf mushafs et sa mort le 10 Jumada al-Akhira 1338 AH, date qu'il situe, selon l'interprétation, le 2 mars 1920."
  ur: "حسن رضا آفندی پر عربی ویکیپیڈیا مضمون، کسی بھی زبان میں ان کا واحد ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1849 ⁦(1265 ہجری)⁩ میں استنبول کے شہر استنبول میں اسکدر میں پیدا ہوا، اس کی تقلید سمیع آفندی کے تحت اور خطاطی کی تعلیم سفیک بی کے تحت، 1871 میں اس کے امپیریل بینڈ کے امام، 1914 سے خطاطوں کے اسکول میں اس کی تدریس، ان کی انیس جمعۃ المصفوعہ میں ان کی وفات ہوئی۔ 1338ھ، جسے یہ 2 مارچ 1920 کے طور پر بیان کرتا ہے۔"
  tr: "Hasan Reza Efendi hakkındaki Arapça Vikipedi makalesi, herhangi bir dilde yayımlanan tek makalesi olup, yalnızca varlığın gerçekleri için kullanılmaktadır. 1849'da (1265 Hicri) İstanbul'un Üsküder kentinde doğdu ve Sami Efendi ile hat üzerine yaptığı yorumlar Şafik Bey'e, 1871'de Humayun müzik grubunun liderliğine, 1914'ten itibaren Hat Okulu'nda öğretmenliğine, on dokuz Kur'anına ve 10 Cumedül-Akhirah 1338 H.'deki ölümüne atfedilir; bu tarih 2 Mart 1920 olarak açıklanır."
  id: "Artikel Wikipedia bahasa Arab tentang Hasan Reza Effendi, yang merupakan satu-satunya artikelnya dalam bahasa apa pun, hanya digunakan untuk fakta-fakta entitas tersebut. Ia lahir di Üsküder, Istanbul, pada tahun 1849 (1265 H), dan komentarnya tentang Sami Effendi serta kaligrafi dikaitkan dengan Shafik Bey, kepemimpinannya di band musik Humayun pada tahun 1871, pengajarannya di Sekolah Kaligrafer sejak 1914, sembilan belas Al-Quran, dan kematiannya pada 10 Jumada al-Akhirah 1338 H, yang dijelaskan sebagai 2 Maret 1920."
