summary:
  ar: "موسى كاظم الحسيني في ويكيبيديا العربية: مولده عام 1853 ووفاته في يافا في 26 آذار 1934 كما في صدر المقال، ومسيرته في الإدارة العثمانية ورئاسة بلدية القدس واللجنة التنفيذية."
  en: "Musa al-Husayni in the Arabic Wikipedia: its lead dates his death to 26 March 1934 at Jaffa, with his Ottoman administrative career, the Jerusalem mayoralty and the Executive Committee presidency."
  es: "Musa al-Husayni en la Wikipedia árabe: su portada fecha su muerte el 26 de marzo de 1934 en Jaffa, con su carrera administrativa otomana, la alcaldía de Jerusalén y la presidencia del Comité Ejecutivo."
  fr: "Musa al-Husayni dans Wikipédia arabe: sa mort date du 26 mars 1934 à Jaffa, avec sa carrière administrative ottomane, la mairie de Jérusalem et la présidence du Comité exécutif."
  ur: "عربی ویکیپیڈیا میں موسیٰ الحسینی: اس کی قیادت ان کی وفات 26 مارچ 1934 کو جافا میں ہوئی، اپنے عثمانی انتظامی کیریئر، یروشلم کی میئرلٹی اور ایگزیکٹو کمیٹی کی صدارت کے ساتھ۔"
  tr: "Musa Kazem Al-Husseini Arapça Vikipedi'de: 1853 doğumlu ve makalenin başında bahsedildiği gibi 26 Mart 1934'te Yafa'da vefat etti; Osmanlı yönetimindeki kariyeri, Kudüs belediye başkanlığı ve yürütme komitesindeki kariyeri."
  id: "Musa Kazem Al-Husseini dalam Wikipedia Arab: Lahir pada tahun 1853 dan meninggal di Jaffa pada 26 Maret 1934, seperti yang disebutkan di awal artikel, kariernya di pemerintahan Ottoman, walikota Yerusalem, dan komite eksekutif."
