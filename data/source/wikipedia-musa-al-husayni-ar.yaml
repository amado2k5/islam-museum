reliability_note: "Pointer for entity facts only. Read at the recorded revision and checked against it on 26 October 2026. The article title is «موسى كاظم الحسيني». Its lead gives his death at Jaffa on 26 March 1934 and burial at Bab al-Hadid, west of the Haram al-Sharif; the English article and Wikidata give Jerusalem, 27 March 1934. It names his father Salim and his brother Hussein, both also mayors of Jerusalem, and his son Abd al-Qader al-Husseini. It makes no statement of his religion."
