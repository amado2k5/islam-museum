summary:
  ar: "مدخل «متولّي» في موسوعة TDV الإسلامية التركية، ويتناول تعيين المتولّي وعزله وشروطه، وحقوقه وواجباته، ومحاسبته ومراقبته، وأجره، وتطور تعيينه في الدولة العثمانية من القضاة إلى الهيئات الإدارية للأوقاف، ثم في الجمهورية التركية حيث تتولى المديرية العامة للأوقاف الإدارة."
  en: "The TDV İslâm Ansiklopedisi entry 'Mütevelli' (waqf trustee). It covers how a trustee is appointed and removed, the qualifications he needs, his duties and limits, the oversight of his accounts, his pay, and how appointment changed in the Ottoman state from the judges to the administrative bodies of the waqfs, and then in the Republic, where the General Directorate of Foundations runs them. The entry is by Nazif Öztürk."
