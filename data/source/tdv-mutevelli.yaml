summary:
  ar: "مدخل «متولّي» في موسوعة TDV الإسلامية التركية، ويتناول تعيين المتولّي وعزله وشروطه، وحقوقه وواجباته، ومحاسبته ومراقبته، وأجره، وتطور تعيينه في الدولة العثمانية من القضاة إلى الهيئات الإدارية للأوقاف، ثم في الجمهورية التركية حيث تتولى المديرية العامة للأوقاف الإدارة."
  en: "The TDV İslâm Ansiklopedisi entry 'Mütevelli' (waqf trustee). It covers how a trustee is appointed and removed, the qualifications he needs, his duties and limits, the oversight of his accounts, his pay, and how appointment changed in the Ottoman state from the judges to the administrative bodies of the waqfs, and then in the Republic, where the General Directorate of Foundations runs them. The entry is by Nazif Öztürk."
  es: "La entrada «Mütevelli» (administrador de un waqf) en la TDV İslâm Ansiklopedisi describe cómo se nombra y se destituye a un administrador, los requisitos que debe cumplir, sus funciones y limitaciones, la supervisión de sus cuentas, su remuneración y cómo evolucionó el sistema de nombramiento en el Estado otomano, pasando de los jueces a los órganos administrativos de los waqfs, y posteriormente en la República, donde la Dirección General de Fundaciones los gestiona. La entrada es obra de Nazif Öztürk."
  fr: "L'article « Mütevelli » (administrateur de waqf) de l'encyclopédie islamique TDV (İslâm Ansiklopedisi) décrit la nomination et la révocation d'un administrateur, les qualifications requises, ses devoirs et ses limites, le contrôle de ses comptes, sa rémunération, ainsi que l'évolution de la nomination dans l'Empire ottoman, passant des juges aux organes administratifs des waqfs, puis dans la République de Turquie, où la Direction générale des fondations en assure la gestion. Cet article est de Nazif Öztürk."
  ur: "TDV İslâm Ansiklopedisi اندراج 'Mütevelli' ⁦(وقف ٹرسٹی)⁩۔ یہ اس بات کا احاطہ کرتا ہے کہ کس طرح ایک ٹرسٹی کا تقرر کیا جاتا ہے اور اسے ہٹایا جاتا ہے، اسے کس قابلیت کی ضرورت ہے، اس کے فرائض اور حدود، اس کے کھاتوں کی نگرانی، اس کی تنخواہ، اور کس طرح عثمانی ریاست میں ججوں سے لے کر وقف کے انتظامی اداروں میں تقرری تبدیل ہوئی، اور پھر جمہوریہ میں، جہاں جنرل ڈائریکٹوریٹ آف فاؤنڈیشن ان کو چلاتا ہے۔ اندراج Nazif Öztürk کی طرف سے ہے."
