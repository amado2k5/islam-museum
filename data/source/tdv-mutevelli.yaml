reliability_note: "Read in full in the web edition on 3 November 2026. The entry's bibliography was not read for this record. Facts are rewritten in the museum's own words and cited by the entry's printed page range, which the web edition gives for the whole entry. The image caption naming the Umayyad Mosque trustee is used only as a dated appointment, with no person record."
