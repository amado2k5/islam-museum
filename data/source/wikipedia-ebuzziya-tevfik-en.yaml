summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الكاتب والناشر العثماني أبو الضيا محمد توفيق (1849–1913)؛ تُستخدم لوقائع الكيان فقط. تروي نشاطه في حركة العثمانيين الشباب ومطبعته «مطبعة أبو الضيا» ومنفَييه إلى رودس وقونية وعضويته في البرلمان عن أنطاليا بعد 1908 ووفاته في 27 يناير 1913 ودفنه في مقبرة بكركوي."
  en: "English Wikipedia article on the Ottoman writer and publisher Ebüzziya Mehmed Tevfik (1849-1913); used for entity facts only. It recounts his Young Ottoman activity, his Matbaa-i Ebüzziya press, his exiles to Rhodes and Konya, his Antalya seat in parliament after 1908, his death on 27 January 1913, and his burial in Bakirkoy cemetery."
  es: "Artículo de la Wikipedia en inglés sobre el escritor y editor otomano Ebüzziya Mehmed Tevfik (1849-1913); utilizado únicamente para datos sobre la persona. Relata su actividad en el Movimiento Joven Otomano, su editorial Matbaa-i Ebüzziya, sus exilios a Rodas y Konya, su escaño en el parlamento por Antalya después de 1908, su muerte el 27 de enero de 1913 y su entierro en el cementerio de Bakirkoy."
  fr: "Article de Wikipédia en anglais sur l'écrivain et éditeur ottoman Ebüzziya Mehmed Tevfik (1849-1913); utilisé uniquement à des fins d'information. Il relate son activité au sein du mouvement Jeune Ottoman, sa maison d'édition Matbaa-i Ebüzziya, ses exils à Rhodes et à Konya, son siège au Parlement d'Antalya après 1908, sa mort le 27 janvier 1913 et son inhumation au cimetière de Bakirkoy."
  ur: "عثمانی مصنف اور ناشر ایبزیہ محمد تیوفیک (1849-1913) پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کی نوجوان عثمانی سرگرمی، اس کی مطبع ایبزیہ پریس، روڈز اور کونیا میں جلاوطنی، 1908 کے بعد پارلیمنٹ میں ان کی انطالیہ نشست، 27 جنوری 1913 کو اس کی موت، اور بکیرکوئے قبرستان میں اس کی تدفین کا ذکر ہے۔"
  tr: "Osmanlı yazarı ve yayıncısı Ebu el-Diya Muhammed Tavfik (1849–1913) hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Genç Osmanlı hareketindeki faaliyetlerini, matbaası 'Abu al-Diya' matbaasını, Rodos ve Konya'ya sürgünlerini, 1908'den sonra Antalya parlamentosuna üyeliğini, 27 Ocak 1913'teki ölümünü ve Bakrköy mezarlığına defnedilmesini anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang penulis dan penerbit Ottoman Abu al-Diya Muhammad Tawfiq (1849–1913); hanya digunakan untuk fakta entitas tersebut. Artikel ini menceritakan aktivitasnya dalam gerakan Muda Ottoman, mesin cetak 'Abu al-Diya', pengasingannya ke Rhodes dan Konya, keanggotaannya di parlemen Antalya setelah 1908, kematiannya pada 27 Januari 1913, dan pemakamannya di pemakaman Bakrköy."
