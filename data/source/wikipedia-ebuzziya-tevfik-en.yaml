  ar: "مقالة ويكيبيديا الإنجليزية عن الكاتب والناشر العثماني أبو الضيا محمد توفيق (1849–1913)؛ تُستخدم لوقائع الكيان فقط. تروي نشاطه في حركة العثمانيين الشباب ومطبعته «مطبعة أبو الضيا» ومنفَييه إلى رودس وقونية وعضويته في البرلمان عن أنطاليا بعد 1908 ووفاته في 27 يناير 1913 ودفنه في مقبرة بكركوي."
  en: "English Wikipedia article on the Ottoman writer and publisher Ebüzziya Mehmed Tevfik (1849-1913); used for entity facts only. It recounts his Young Ottoman activity, his Matbaa-i Ebüzziya press, his exiles to Rhodes and Konya, his Antalya seat in parliament after 1908, his death on 27 January 1913, and his burial in Bakirkoy cemetery."
