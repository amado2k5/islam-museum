reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md). Read in full on 26 October 2026 and checked against the recorded revision. It gives only the years 1849 and 1913 in its lead and infobox, though its text dates the death to 27 January 1913; its biography rests chiefly on the TDV Islam Ansiklopedisi entry by Ziyad Ebüzziya and on Fevziye Abdullah's Encyclopaedia of Islam (2nd ed.) chapter. It explains that he adopted the name Ebüzziya ('father of Ziya', after his eldest son) in exile at Rhodes because political exiles could not publish under their own names. It makes no statement of his religion anywhere in its text."
