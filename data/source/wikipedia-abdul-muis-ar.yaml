summary:
  ar: "مقالة ويكيبيديا العربية عن عبد المعز؛ بذرة قصيرة تُستخدم لوقائع الكيان فقط. تعطي ميلاده في سونغاي بوار في 3 تموز 1886 ووفاته في باندونغ في 17 حزيران 1959، وتصفه كاتبًا وصحفيًا ومناضلًا من أجل استقلال إندونيسيا وأول حائزي لقب بطلها القومي. صندوقها يعطي الديانة «الإسلام» وحقلا العقيدة والمذهب فارغان، وتصنيفاها يقرنان ميلاده بسنة 1303 هـ ووفاته بسنة 1378 هـ."
  en: "Arabic Wikipedia article on Abdul Muis; a short stub used for entity facts only. It gives his birth at Sungai Puar on 3 July 1886 and his death at Bandung on 17 June 1959, and describes him as a writer, journalist and fighter for Indonesian independence and the first holder of its national-hero title. Its infobox gives his religion as Islam with the creed and school fields left empty; its categories pair his birth with 1303 AH and his death with 1378 AH."
  es: "Artículo de Wikipedia en árabe sobre Abdul Muis; un breve esbozo utilizado únicamente para datos sobre la persona. Indica su nacimiento en Sungai Puar el 3 de julio de 1886 y su fallecimiento en Bandung el 17 de junio de 1959, y lo describe como escritor, periodista y luchador por la independencia de Indonesia, siendo el primer poseedor del título de héroe nacional. Su ficha informativa indica que su religión era el islam, dejando en blanco los campos de credo y escuela; sus categorías asocian su nacimiento con el año 1303 de la Hégira y su fallecimiento con el año 1378 de la Hégira."
  fr: "Article Wikipédia en arabe sur Abdul Muis; une brève ébauche servant uniquement à fournir des informations factuelles. On y apprend sa naissance à Sungai Puar le 3 juillet 1886 et sa mort à Bandung le 17 juin 1959. Il est décrit comme écrivain, journaliste et militant pour l’indépendance de l’Indonésie, et comme le premier à recevoir le titre de héros national. Son infobox indique qu’il était musulman, mais les champs relatifs à la religion et à l’école sont laissés vides. Ses catégories associent sa naissance à l’année 1303 de l’Hégire et sa mort à l’année 1378 de l’Hégire."
