summary:
  ar: "مقالة ويكيبيديا العربية عن عبد المعز؛ بذرة قصيرة تُستخدم لوقائع الكيان فقط. تعطي ميلاده في سونغاي بوار في 3 تموز 1886 ووفاته في باندونغ في 17 حزيران 1959، وتصفه كاتبًا وصحفيًا ومناضلًا من أجل استقلال إندونيسيا وأول حائزي لقب بطلها القومي. صندوقها يعطي الديانة «الإسلام» وحقلا العقيدة والمذهب فارغان، وتصنيفاها يقرنان ميلاده بسنة 1303 هـ ووفاته بسنة 1378 هـ."
  en: "Arabic Wikipedia article on Abdul Muis; a short stub used for entity facts only. It gives his birth at Sungai Puar on 3 July 1886 and his death at Bandung on 17 June 1959, and describes him as a writer, journalist and fighter for Indonesian independence and the first holder of its national-hero title. Its infobox gives his religion as Islam with the creed and school fields left empty; its categories pair his birth with 1303 AH and his death with 1378 AH."
