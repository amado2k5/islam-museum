summary:
  ar: "مقالہ اردو ويكيبيديا عن وهبة الزحيلي؛ تُستخدم لوقائع الكيان فقط. ينص متنه بعبارة صريحة على أنه كان تابعا للفقه الشافعي، ويذكر ميل طبعه إلى التصوف، وصندوق معلوماته يعطي فرقته أهل السنة وفقہه شافعيا."
  en: "Urdu Wikipedia article on Wahbah al-Zuhayli; used for entity facts only. Its text states in its own words that he was a follower of Shafi'i fiqh and remarks that his temperament inclined toward Sufism; its infobox gives his sect as Ahl al-Sunna and his fiqh as Shafi'i."
  es: "Artículo de Wikipedia en urdu sobre Wahbah al-Zuhayli; utilizado únicamente para datos sobre la persona. Su texto afirma textualmente que era seguidor del fiqh shafi'í y señala que su temperamento se inclinaba hacia el sufismo; su ficha informativa indica que pertenecía a la secta Ahl al-Sunna y que su fiqh era shafi'í."
  fr: "Article de Wikipédia en ourdou sur Wahbah al-Zuhayli; utilisé uniquement à des fins d'information sur l'entité. Le texte indique qu'il était un adepte du fiqh chaféite et précise que son tempérament le portait vers le soufisme; l'infobox le désigne comme appartenant à la secte Ahl al-Sunna et comme son fiqh chaféite."
  ur: "وہبہ الزحیلی پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا متن اپنے الفاظ میں کہتا ہے کہ وہ شافعی فقہ کے پیروکار تھے اور ان کا مزاج تصوف کی طرف مائل تھا۔ اس کا معلومات خانہ اس کا فرقہ اہل السنہ اور اس کا فقہ شافعی دیتا ہے۔"
