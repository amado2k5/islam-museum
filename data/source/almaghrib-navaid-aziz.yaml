summary:
  ar: "صفحة نويد عزيز على موقع معهد المغرب الذي يدرّس فيه: مدير العلاقات العامة في المعهد ومحاضر فيه، حاصل على بكالوريوس الشريعة من الجامعة الإسلامية بالمدينة المنورة، ومدير الخدمات الدينية والاجتماعية للجمعية الإسلامية الإعلامية في كالغاري، وأول قسيس مسلم لدى شرطة كالغاري سنة 2015."
  en: "AlMaghrib Institute's instructor page for Navaid Aziz, the institute he teaches for: its Director of Public Relations and an instructor, with a bachelor's in Islamic Law from the Islamic University of Madinah, Director of Religious and Social Services for the Islamic Information Society of Calgary, and the Calgary Police Service's first Muslim chaplain in 2015."
  es: "Página del instructor del Instituto AlMaghrib para Navaid Aziz, el instituto para el que imparte clases: su Director de Relaciones Públicas e instructor, con una licenciatura en Derecho Islámico de la Universidad Islámica de Medina, Director de Servicios Religiosos y Sociales de la Sociedad de Información Islámica de Calgary, y el primer capellán musulmán del Servicio de Policía de Calgary en 2015."
  fr: "Page de présentation de Navaid Aziz, instructeur à l'Institut AlMaghrib, l'institut où il enseigne: directeur des relations publiques et instructeur, titulaire d'une licence en droit islamique de l'Université islamique de Médine, directeur des services religieux et sociaux de la Société d'information islamique de Calgary et premier aumônier musulman du service de police de Calgary en 2015."
