reliability_note: "His own institute's page; a primary source for his identity, education and offices, not independent corroboration (founder's sourcing ladder, 24 Oct 2026). Consulted 26 October 2026. It states that he completed an associate degree in commerce and social sciences before the Islamic University of Madinah, where he took a diploma in Arabic and a bachelor's in Islamic Law specialising in fiqh and usul al-fiqh; that he is AlMaghrib's Director of Public Relations and an instructor; that he is Director of Religious and Social Services for the Islamic Information Society of Calgary, a youth and family counsellor, and became the first Muslim chaplain with the Calgary Police Service in 2015; and that his work includes mitigating criminal radicalisation among youth. It names no legal school for him personally."
