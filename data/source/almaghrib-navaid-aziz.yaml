  ar: "صفحة نويد عزيز على موقع معهد المغرب الذي يدرّس فيه: مدير العلاقات العامة في المعهد ومحاضر فيه، حاصل على بكالوريوس الشريعة من الجامعة الإسلامية بالمدينة المنورة، ومدير الخدمات الدينية والاجتماعية للجمعية الإسلامية الإعلامية في كالغاري، وأول قسيس مسلم لدى شرطة كالغاري سنة 2015."
  en: "AlMaghrib Institute's instructor page for Navaid Aziz, the institute he teaches for: its Director of Public Relations and an instructor, with a bachelor's in Islamic Law from the Islamic University of Madinah, Director of Religious and Social Services for the Islamic Information Society of Calgary, and the Calgary Police Service's first Muslim chaplain in 2015."
