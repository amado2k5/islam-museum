reliability_note: "An advocacy organisation's opinion piece, read on 5 November 2026 and used only with attribution. It reports that Abbasi, described as a 45-year-old imam, announced on 16 June 2023 that he was in the United Kingdom for eight Islamic events at the invitation of the British Bengali station iON TV, that at least two planned talks were cancelled after police contacted the hosting mosques, that he runs Tahreek-e-Khatme-Nabuwat Bangladesh, and that he is known in Bangladesh as the 'Helicopter Huzur' for travelling by helicopter to preach. Its characterisation of his preaching — that he openly calls for the killing of Ahmadiyyah Muslims, Hindus, atheists and Jews — is the piece's own, drawing on the exiled activist Asad Noor, and is recorded in his entry only as FWI's attributed characterisation, never in the museum's voice. The age it gives (45 in June 2023) is consistent with a 1978 birth year but does not confirm a birth date."
