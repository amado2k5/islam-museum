reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). A short article resting on modern scholarship of the Han Kitab (Murata, Chittick and Tu; Benite). It gives his life as circa 1660 to circa 1739, his Nanjing origin, his studies under his father Liu Sanjie and under Yuan Ruqi at the Garden of Military Studies Mosque, his mastery of Arabic and Persian, and his principal works — the Tianfang Xingli, the Tianfang Dianli and the Tianfang Zhisheng Shilu. Its lead calls him a Chinese Sunni Hanafi-Maturidi scholar; that characterization is one attestation, and the Urdu article's lead follows it so closely that the two read as one source family, so no faith settlement is built on it (see the person record's faith note). Checked 1 November 2026."
