summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ضياء الدين يوسفزي؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في شانغلا سنة 1969، وتأسيسه مدارس خاصة منخفضة الكلفة في سوات، ودعمه تعليم البنات، وابنته ملالا الحائزة على نوبل، ومشاركته في تأسيس صندوق ملالا وكتابه «دعها تطير» (2018). تصنيف المقالة يضعه ضمن «مسلمي باكستان السنة»، وهو تصنيف لا تسمية نصية لمذهب."
  en: "English Wikipedia article on Ziauddin Yousafzai; used for entity facts only. It covers his 1969 birth in Shangla, his founding of low-cost private schools in Swat, his advocacy of girls' education, his daughter the Nobel laureate Malala, his co-founding of the Malala Fund, and his book Let Her Fly (2018). The article's categories file him under 'Pakistani Sunni Muslims' — a filing, not a text naming a school."
  es: "Artículo de la Wikipedia en inglés sobre Ziauddin Yousafzai; se utiliza únicamente para obtener información sobre la persona. Abarca su nacimiento en Shangla en 1969, la fundación de escuelas privadas de bajo coste en Swat, su defensa de la educación femenina, su hija, la premio Nobel Malala, su cofundación del Fondo Malala y su libro «Let Her Fly» (2018). Las categorías del artículo lo clasifican como «musulmanes sunitas pakistaníes», una clasificación que no incluye el nombre de una escuela."
  fr: "Article de Wikipédia en anglais sur Ziauddin Yousafzai; utilisé uniquement à des fins d'information sur l'entité. Il aborde sa naissance en 1969 à Shangla, la fondation d'écoles privées à bas coût dans la vallée de Swat, son engagement pour l'éducation des filles, sa fille Malala, lauréate du prix Nobel de la paix, sa cofondation du Fonds Malala et son livre « Let Her Fly » (2018). Les catégories de l'article le classent dans la catégorie « Musulmans sunnites pakistanais » — il s'agit d'un classement, et non d'un nom d'établissement scolaire."
  ur: "ضیاء الدین یوسفزئی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں شانگلہ میں ان کی 1969 کی پیدائش، سوات میں کم لاگت پرائیویٹ اسکولوں کا قیام، لڑکیوں کی تعلیم کی وکالت، ان کی بیٹی نوبل انعام یافتہ ملالہ، ملالہ فنڈ کی ان کی شریک بانی، اور ان کی کتاب Let Her Fly (2018) کا احاطہ کیا گیا ہے۔ مضمون کے زمرے اسے 'پاکستانی سنی مسلمان' کے تحت فائل کرتے ہیں - ایک فائلنگ، نہ کہ کسی اسکول کا نام رکھنے والی تحریر۔"
