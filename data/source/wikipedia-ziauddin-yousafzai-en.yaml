summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ضياء الدين يوسفزي؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في شانغلا سنة 1969، وتأسيسه مدارس خاصة منخفضة الكلفة في سوات، ودعمه تعليم البنات، وابنته ملالا الحائزة على نوبل، ومشاركته في تأسيس صندوق ملالا وكتابه «دعها تطير» (2018). تصنيف المقالة يضعه ضمن «مسلمي باكستان السنة»، وهو تصنيف لا تسمية نصية لمذهب."
  en: "English Wikipedia article on Ziauddin Yousafzai; used for entity facts only. It covers his 1969 birth in Shangla, his founding of low-cost private schools in Swat, his advocacy of girls' education, his daughter the Nobel laureate Malala, his co-founding of the Malala Fund, and his book Let Her Fly (2018). The article's categories file him under 'Pakistani Sunni Muslims' — a filing, not a text naming a school."
