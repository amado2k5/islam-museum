summary:
  ar: "عنصر ويكيداتا Q2724873: حاكم مكة وزعيم قريش، وأبوه كلاب بن مرة (Q2327777)، وفاته نحو 480 كما في البطاقة؛ ولا تُستعمل زوجته ولا دينه في العنصر لأنهما يخالفان البطاقة."
  en: "Wikidata item Q2724873 for Qusayy ibn Kilab: ruler of Mecca and leader of Quraysh, son of Kilab ibn Murrah (Q2327777), died about 480 as the card records; the item's spouse and religion claims differ from the card and are not used."
  es: "Elemento de Wikidata Q2724873 para Qusayy ibn Kilab: gobernante de La Meca y líder de Quraysh, hijo de Kilab ibn Murrah (Q2327777), murió alrededor del año 480 según los registros de la ficha; las afirmaciones sobre el cónyuge y la religión del elemento difieren de la ficha y no se utilizan."
  fr: "L'élément Wikidata Q2724873 pour Qusayy ibn Kilab: souverain de La Mecque et chef des Quraysh, fils de Kilab ibn Murrah (Q2327777), mort vers 480 comme l'indique la fiche; les affirmations concernant le conjoint et la religion de l'élément diffèrent de la fiche et ne sont pas utilisées."
  ur: "وکی ڈیٹا آئٹم Q2724873 برائے قصی ابن کلاب: مکہ کے حکمران اور قریش کے رہنما، کلاب ابن مرہ کے بیٹے (Q2327777)، کارڈ ریکارڈ کے مطابق تقریباً 480 میں فوت ہوئے۔ آئٹم کے شریک حیات اور مذہب کے دعوے کارڈ سے مختلف ہیں اور استعمال نہیں کیے جاتے ہیں۔"
  tr: "Ansar Wikidata Q2724873: Mekke'nin hükümdarı ve Kureyş'in lideri, babası Kilab bin Murrah (Q2327777), yaklaşık 480 Hicri yılında, yani El-Battaqa'da öldü; ne eşi ne de dini El-Ensar'da kullanılmaz çünkü bunlar El-Battaqah ile çelişmektedir."
  id: "Ansar Wikidata Q2724873: Penguasa Mekah dan pemimpin Quraisy, ayahnya adalah Kilab ibn Murrah (Q2327777), meninggal sekitar tahun 480 H seperti di Al-Battaqa; baik istrinya maupun agamanya tidak digunakan dalam Al-Ansar karena bertentangan dengan Al-Battaqa."
