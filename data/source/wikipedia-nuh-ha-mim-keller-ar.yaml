  ar: "مقالة ويكيبيديا العربية عن نوح حاميم كلر (مواليد 1954)، تصفه في صدرها بأنه داعية إسلامي مقيم في الأردن وشيخ للطريقة الشاذلية في الولايات المتحدة، وتنص على أنه تتلمذ في سوريا على الشيخ عبد الرحمن الشاغوري وأخذ عنه الطريقة الشاذلية سنة 1988."
  en: "The Arabic Wikipedia article on Nuh Ha Mim Keller (born 1954), whose lead calls him a Muslim preacher resident in Jordan and a shaykh of the Shadhili order in the United States; its text states that he studied in Syria under Shaykh Abd al-Rahman al-Shaghouri and took the Shadhili order from him in 1988."
