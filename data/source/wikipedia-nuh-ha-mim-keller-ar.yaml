summary:
  ar: "مقالة ويكيبيديا العربية عن نوح حاميم كلر ⁦(مواليد 1954)⁩، تصفه في صدرها بأنه داعية إسلامي مقيم في الأردن وشيخ للطريقة الشاذلية في الولايات المتحدة، وتنص على أنه تتلمذ في سوريا على الشيخ عبد الرحمن الشاغوري وأخذ عنه الطريقة الشاذلية سنة 1988."
  en: "The Arabic Wikipedia article on Nuh Ha Mim Keller (born 1954), whose lead calls him a Muslim preacher resident in Jordan and a shaykh of the Shadhili order in the United States; its text states that he studied in Syria under Shaykh Abd al-Rahman al-Shaghouri and took the Shadhili order from him in 1988."
  es: "El artículo de Wikipedia en árabe sobre Nuh Ha Mim Keller (nacido en 1954), cuyo titular lo describe como un predicador musulmán residente en Jordania y un jeque de la orden Shadhili en los Estados Unidos, afirma que estudió en Siria con el jeque Abd al-Rahman al-Shaghouri y que recibió la orden Shadhili de él en 1988."
  fr: "L'article de Wikipédia en arabe sur Nuh Ha Mim Keller (né en 1954), dont l'introduction le décrit comme un prédicateur musulman résidant en Jordanie et un cheikh de l'ordre Shadhili aux États-Unis; son texte indique qu'il a étudié en Syrie sous la direction du cheikh Abd al-Rahman al-Shaghouri et a reçu l'ordre Shadhili de lui en 1988."
  ur: "نوح ہا میم کیلر ⁦(پیدائش 1954)⁩ پر عربی ویکیپیڈیا کا مضمون، جس کی قیادت انہیں اردن میں مقیم ایک مسلمان مبلغ اور ریاستہائے متحدہ میں شادھیلی حکم کے شیخ کہتی ہے۔ اس کے متن میں کہا گیا ہے کہ اس نے شام میں شیخ عبدالرحمٰن الشغوری کے ماتحت تعلیم حاصل کی اور 1988 میں ان سے شاذلی کا حکم لیا۔"
  tr: "Noah Hamim Keller (1954 doğumlu) hakkında Arapça Wikipedia makalesi, onu Ürdün'de yaşayan bir İslami vaiz ve Amerika Birleşik Devletleri'nde Şadhili tarikatının bir şeyhi olarak en üst sıralarda tanımlar. Suriye'de Şeyh Abdul Rahman Al-Shaghuri'nin yanında eğitim aldığı ve 1988'de ondan Şadhili tarikatı öğrendiği belirtilir."
  id: "Artikel Wikipedia berbahasa Arab tentang Noah Hamim Keller (lahir 1954) menggambarkannya di puncak sebagai seorang pengkhotbah Islam yang tinggal di Yordania dan seorang sheikh dari ordo Shadhili di Amerika Serikat. Artikel tersebut menyatakan bahwa ia belajar di Suriah di bawah bimbingan Sheikh Abdul Rahman Al-Shaghuri dan mempelajari ordo Shadhili darinya pada tahun 1988."
