summary:
  ar: "المجلد الرابع من طبعة دار ابن حزم لـ«المحلى»، بإشراف خالد الرباط ومشاركة باحثين، يضم تتمة كتاب الصلاة: صفة الصلاة، والمساجد، والإمامة، وصلاة السفر، مع تعليقات المحققين وتخريجاتهم وفهرس المسائل؛ فيه مسائل قصر الصلاة في السفر ومسافته."
  en: "Volume 4 of the Dar Ibn Hazm edition of al-Muhalla, supervised by Khalid al-Rabbat with a team of researchers, holding the continuation of the Book of Prayer: the description of the prayer, mosques, leading the prayer and the traveller's prayer, with the editors' notes, references and an index of questions."
  ur: "دار ابن حزم کے ایڈیشن «المحلی» کی جلد چہارم، خالد الرباط کی نگرانی میں محققین کی شرکت سے، جس میں کتاب الصلاۃ کا تسلسل: نماز کا طریقہ، مساجد، امامت اور مسافر کی نماز ہیں، محققین کے حواشی، تخریجات اور مسائل کی فہرست کے ساتھ۔"
title: "المحلى بالآثار في شرح المجلى بالاختصار (المجلد الرابع)"
