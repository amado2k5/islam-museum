summary:
  ar: "مقالة ويكيبيديا العربية عن الشيخ سلمان بن حمد آل خليفة الأول (1894–1961)؛ تُستخدم لوقائع الكيان فقط. تؤكد مولده في 10 أكتوبر 1894 وتربيته وليا للعهد في كنف أبيه حمد بن عيسى، وحكمه من 20 فبراير 1942، ودراسته القرآن والدين على معلمين في صغره، ووفاته في مسكنه بسافره في 2 نوفمبر 1961. لا حقل دين فيها."
  en: "Arabic Wikipedia article on Sheikh Salman bin Hamad Al Khalifa I (1894–1961); used for entity facts only. It confirms his birth on 10 October 1894, his upbringing as heir under his father Hamad bin Isa, his rule from 20 February 1942, his childhood study of the Qur'an and religion under tutors, and his death at his Safra residence on 2 November 1961. It has no religion field."
