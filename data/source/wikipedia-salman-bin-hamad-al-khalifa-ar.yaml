summary:
  ar: "مقالة ويكيبيديا العربية عن الشيخ سلمان بن حمد آل خليفة الأول (1894–1961)؛ تُستخدم لوقائع الكيان فقط. تؤكد مولده في 10 أكتوبر 1894 وتربيته وليا للعهد في كنف أبيه حمد بن عيسى، وحكمه من 20 فبراير 1942، ودراسته القرآن والدين على معلمين في صغره، ووفاته في مسكنه بسافره في 2 نوفمبر 1961. لا حقل دين فيها."
  en: "Arabic Wikipedia article on Sheikh Salman bin Hamad Al Khalifa I (1894–1961); used for entity facts only. It confirms his birth on 10 October 1894, his upbringing as heir under his father Hamad bin Isa, his rule from 20 February 1942, his childhood study of the Qur'an and religion under tutors, and his death at his Safra residence on 2 November 1961. It has no religion field."
  es: "Artículo en árabe de la Wikipedia sobre el jeque Salman bin Hamad Al Khalifa I (1894-1961); se utiliza únicamente para datos sobre la persona. Confirma su nacimiento el 10 de octubre de 1894, su crianza como heredero bajo el mandato de su padre, Hamad bin Isa, su reinado desde el 20 de febrero de 1942, sus estudios infantiles del Corán y la religión con tutores, y su fallecimiento en su residencia de Safra el 2 de noviembre de 1961. No incluye información sobre religión."
  fr: "L'article de Wikipédia en arabe consacré au cheikh Salman bin Hamad Al Khalifa Ier (1894-1961) est utilisé uniquement à des fins d'information sur l'entité. Il confirme sa naissance le 10 octobre 1894, son éducation en tant qu'héritier auprès de son père Hamad bin Isa, son règne à partir du 20 février 1942, son éducation religieuse et coranique auprès de précepteurs durant son enfance, et son décès à sa résidence de Safra le 2 novembre 1961. Il ne comporte pas de champ relatif à la religion."
