  ar: "مقالة ويكيبيديا الأردية عن رحمان تشيشتي ⁦(تسمّيه عطا الرحمان تشيشتي گجر؛ وُلد في 4 تشرين الأول 1978)⁩، سياسي المحافظين البريطاني من أصل باكستاني، عضو البرلمان عن غيلينغهام ورينهام منذ انتخابات 2010."
  en: "Urdu Wikipedia article on Rehman Chishti (styled there Atta-ur-Rehman Chishti Gujjar; born 4 October 1978), the Pakistani-born British Conservative politician, MP for Gillingham and Rainham from the 2010 election."
  es: "Artículo en urdu de la Wikipedia sobre Rehman Chishti (estilizado allí como Atta-ur-Rehman Chishti Gujjar; nacido el 4 de octubre de 1978), el político conservador británico nacido en Pakistán, diputado por Gillingham y Rainham desde las elecciones de 2010."
  fr: "Article de Wikipédia en ourdou sur Rehman Chishti (stylisé Atta-ur-Rehman Chishti Gujjar; né le 4 octobre 1978), homme politique conservateur britannique d'origine pakistanaise, député de Gillingham et Rainham depuis les élections de 2010."
  ur: "رحمٰن چشتی پر اردو ویکیپیڈیا کا مضمون ⁦(وہاں کا انداز عطاء الرحمان چشتی گجر؛ پیدائش 4 اکتوبر 1978)⁩، پاکستانی نژاد برطانوی کنزرویٹو سیاست دان، 2010 کے انتخابات سے گلنگھم اور رینہم کے ایم پی۔"
  tr: "Pakistan kökenli Britanyalı Muhafazakar politikacı, 2010 seçimlerinden beri Gillingham ve Rainham milletvekili olan Rahman Chishti hakkında Urduca Wikipedia makalesi."
