summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ميرزا كوجك خان؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده يونس في رشت في 12 أكتوبر 1880 ابنًا لتاجر، ومحاولته الانضمام إلى ستارخان، ودوره في فتح طهران 1909، وتأسيسه نهضة جنگل من سنة 1914 بالتعاون مع جمعية اتحاد الإسلام، وجمهورية گيلان السوفيتية 1920-21، ووفاته عضةَ صقيع في جبال طالش في 2 ديسمبر 1921."
  en: "English Wikipedia article on Mirza Kuchik Khan; used for entity facts only. It gives his birth as Yunes at Rasht on 12 October 1880, son of a merchant, his attempt to join Sattar Khan, his part in the 1909 capture of Tehran, his founding of the Jangal movement from 1914 in collaboration with the Society of Islamic Union, the Soviet Republic of Gilan of 1920-21, and his death by frostbite in the Talesh mountains on 2 December 1921."
