summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ميرزا كوجك خان؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده يونس في رشت في 12 أكتوبر 1880 ابنًا لتاجر، ومحاولته الانضمام إلى ستارخان، ودوره في فتح طهران 1909، وتأسيسه نهضة جنگل من سنة 1914 بالتعاون مع جمعية اتحاد الإسلام، وجمهورية گيلان السوفيتية 1920-21، ووفاته عضةَ صقيع في جبال طالش في 2 ديسمبر 1921."
  en: "English Wikipedia article on Mirza Kuchik Khan; used for entity facts only. It gives his birth as Yunes at Rasht on 12 October 1880, son of a merchant, his attempt to join Sattar Khan, his part in the 1909 capture of Tehran, his founding of the Jangal movement from 1914 in collaboration with the Society of Islamic Union, the Soviet Republic of Gilan of 1920-21, and his death by frostbite in the Talesh mountains on 2 December 1921."
  es: "Artículo de la Wikipedia en inglés sobre Mirza Kuchik Khan; utilizado únicamente para datos sobre la persona. Describe su nacimiento como Yunes en Rasht el 12 de octubre de 1880, hijo de un comerciante, su intento de unirse a Sattar Khan, su participación en la toma de Teherán en 1909, la fundación del movimiento Jangal a partir de 1914 en colaboración con la Sociedad de la Unión Islámica, la República Soviética de Gilan de 1920-21 y su muerte por congelación en las montañas de Talesh el 2 de diciembre de 1921."
  fr: "Article de Wikipédia en anglais sur Mirza Kuchik Khan; utilisé uniquement pour les informations sur l’entité. Il indique sa naissance sous le nom de Yunes à Rasht le 12 octobre 1880, fils d’un marchand, sa tentative de rejoindre Sattar Khan, son rôle dans la prise de Téhéran en 1909, la fondation du mouvement Jangal à partir de 1914 en collaboration avec la Société de l’Union islamique, la République soviétique de Gilan de 1920 à 1921, et sa mort par gelures dans les montagnes de Talesh le 2 décembre 1921."
