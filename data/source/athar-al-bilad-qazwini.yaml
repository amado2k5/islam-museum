summary:
  ar: "آثار البلاد وأخبار العباد لزكريا بن محمد بن محمود القزويني المتوفى سنة 682 هـ، موسوعة جغرافية مرتبة على حروف المعجم، في طبعة دار صادر ببيروت، وقد قُرئ نصه من تصدير المكتبة الشاملة وترقيمه موافق للمطبوع، فيُحال إليه بالصفحة."
  en: "Zakariyya ibn Muhammad ibn Mahmud al-Qazwini's Athar al-Bilad wa Akhbar al-Ibad (he died in 682 AH), a geographical encyclopedia arranged alphabetically, in the Dar Sader edition, Beirut. The text was read from the Shamela export, whose page numbering follows the print, so citations give the page."
  es: "Athar al-Bilad wa Akhbar al-Ibad de Zakariyya ibn Muhammad ibn Mahmud al-Qazwini (fallecido en 682 AH), una enciclopedia geográfica ordenada alfabéticamente, en la edición Dar Sader, Beirut. El texto se leyó a partir de la exportación de Shamela, cuya numeración de páginas sigue la de la impresión, por lo que las citas indican la página."
  fr: "L'ouvrage *Athar al-Bilad wa Akhbar al-Ibad* de Zakariyya ibn Muhammad ibn Mahmud al-Qazwini (décédé en 682 AH), une encyclopédie géographique classée par ordre alphabétique, dans son édition Dar Sader de Beyrouth, a été consulté à partir de l'édition Shamela, dont la pagination suit l'impression; les citations indiquent donc la page."
