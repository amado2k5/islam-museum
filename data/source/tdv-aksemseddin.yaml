summary:
  ar: "مدخل «آق شمس الدين» في موسوعة الإسلام التركية (TDV) بقلم أورخان ف. كوبرولو ومصطفى عصمت أوزون (المجلد 2، إسطنبول 1989، ص 299–302)؛ أوفى ترجمة علمية له: مولده بدمشق سنة 792هـ، وانتسابه إلى حاجي بيرام ولي وأخذه الخلافة عنه، وتأسيسه الفرع الشمسي من البيرامية، ومرافقته فتح القسطنطينية، ووفاته في غوينوك أواخر ربيع الآخر 863هـ (شباط 1459م)."
  en: "The TDV İslâm Ansiklopedisi (Turkish encyclopedia of Islam) entry 'AKŞEMSEDDİN' by Orhan F. Köprülü and Mustafa İsmet Uzun (vol. 2, Istanbul 1989, pp. 299–302); the fullest scholarly biography — his birth at Damascus in 792, his discipleship under Haci Bayram Veli and receipt of the khilafa from him, his founding of the Shamsiyya branch of the Bayramiyya, his part in the conquest of Constantinople, and his death at Göynük at the end of Rabi II 863 (February 1459)."
