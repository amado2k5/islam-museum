reliability_note: "Scholarly encyclopedia entry, read in full on 1 November 2026, and the anchor source for this record. It rests chiefly on Enisi's Menakibname and the Ottoman biographical tradition, handled critically: it pairs his birth year 792 with 1390 (the Wikipedia articles pair it with 1389), follows A. Ihsan Yurd in doubting the Aleppo episode of the popular narrative, gives his death as the end of Rabi II 863 (February 1459) corroborated by his tomb inscription, and flags the attribution of Maddat al-Hayat to him as debated. It attests for the man himself his intisab to Haci Bayram, his strict riyazet, his receipt of the khilafa from his sheikh and his founding of the Bayramiyya's Shamsiyya branch; it names no legal school for him."
