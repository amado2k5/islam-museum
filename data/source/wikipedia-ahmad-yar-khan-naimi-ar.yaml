summary:
  ar: "مقالة ويكيبيديا العربية عن أحمد يار خان النعيمي، من موسوعة الحضارة الإسلامية للمجمع الملكي لبحوث الحضارة الإسلامية؛ تعطي سنواته 1324–1391هـ / 1904–1971م، وتذكر تلمذته على والده ثم في مدرسة شمس العلوم ببدايون ثم في الجامعة النعيمية بمراد آباد على محمد نعيم المراد آبادي ومشتاق أحمد الكانفوري، ووفاته بكجرات."
  en: "The Arabic Wikipedia article on Ahmad Yar Khan Naeemi, sourced to the Royal Aal al-Bayt Institute's Encyclopaedia of Islamic Civilisation; it gives his years as 1324–1391 AH / 1904–1971 CE, his study under his father, at Madrasa Shamsul Uloom in Budaun and at Jamia Naeemia Moradabad under Muhammad Naeem al-Muradabadi and Mushtaq Ahmad al-Kanpuri, and his death at Gujrat."
  es: "El artículo árabe de Wikipedia sobre Ahmad Yar Khan Naeemi, extraído de la Enciclopedia de Civilización Islámica del Instituto Real Aal al-Bayt; da sus años como 1324-1391 AH / 1904-1971 EC, sus estudios con su padre, en Madrasa Shamsul Uloom en Budaun y en Jamia Naeemia Moradabad con Muhammad Naeem al-Muradabadi y Mushtaq Ahmad al-Kanpuri, y su muerte en Gujrat."
  fr: "L'article de Wikipédia en arabe sur Ahmad Yar Khan Naeemi, provenant de l'Encyclopédie de la civilisation islamique de l'Institut royal Aal al-Bayt; il donne ses années comme 1324-1391 AH / 1904-1971 CE, ses études sous la direction de son père, à Madrasa Shamsul Uloom à Budaun et à Jamia Naeemia Moradabad sous Muhammad Naeem al-Muradabadi et Mushtaq Ahmad al-Kanpuri, et sa mort à Gujrat."
  ur: "احمد یار خان نعیمی پر عربی ویکیپیڈیا کا مضمون، رائل آل البیت انسٹی ٹیوٹ کے انسائیکلوپیڈیا آف اسلامک سولائزیشن سے ماخذ۔ اس میں ان کے سال 1324-1391 ہجری / 1904-1971 عیسوی، ان کے والد کے زیر تعلیم، مدرسہ شمس العلوم بڈاؤن میں اور جامعہ نعیمیہ مرادآباد میں محمد نعیم المرابادی اور مشتاق احمد الکنپوری کے زیر تعلیم، اور گجرات میں ان کی وفات بتائی گئی ہے۔"
  tr: "Ahmad Yar Khan Al-Nuaimi hakkında Arapça Wikipedia makalesi, İslam Uygarlığı Araştırmaları Kraliyet Akademisi'nin İslam Medeniyeti Ansiklopedisi'nden alınmıştır; 1324–1391 Hicri / 1904–1971 yıllarını vermektedir; babasının yanında aldığı eğitimi, ardından Badayun'daki Şems El-Uloom Okulu'nda, ardından Moradabad'daki Muhammed Naeem Al-Muradabadi ve Mushtaq Ahmed Al-Kanfouri'nin yanında Al-Naeemiya Üniversitesi'nde ve Gujarat'taki ölümünden bahsedilmektedir."
  id: "Artikel Wikipedia berbahasa Arab tentang Ahmad Yar Khan Al-Nuaimi, dari Ensiklopedia Peradaban Islam Akademi Kerajaan untuk Penelitian Peradaban Islam; artikel ini mencantumkan tahun-tahunnya 1324–1391 H / 1904–1971 M, menyebutkan bimbingan ayahnya, kemudian di Sekolah Shams Al-Uloom di Badayun, kemudian di Universitas Al-Naeemiya di Moradabad di bawah Muhammad Naeem Al-Muradabadi dan Mushtaq Ahmed Al-Kanfouri, serta kematiannya di Gujarat."
