summary:
  ar: "مقالة ويكيبيديا العربية عن أحمد يار خان النعيمي، من موسوعة الحضارة الإسلامية للمجمع الملكي لبحوث الحضارة الإسلامية؛ تعطي سنواته 1324–1391هـ / 1904–1971م، وتذكر تلمذته على والده ثم في مدرسة شمس العلوم ببدايون ثم في الجامعة النعيمية بمراد آباد على محمد نعيم المراد آبادي ومشتاق أحمد الكانفوري، ووفاته بكجرات."
  en: "The Arabic Wikipedia article on Ahmad Yar Khan Naeemi, sourced to the Royal Aal al-Bayt Institute's Encyclopaedia of Islamic Civilisation; it gives his years as 1324–1391 AH / 1904–1971 CE, his study under his father, at Madrasa Shamsul Uloom in Budaun and at Jamia Naeemia Moradabad under Muhammad Naeem al-Muradabadi and Mushtaq Ahmad al-Kanpuri, and his death at Gujrat."
