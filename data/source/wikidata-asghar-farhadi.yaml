  fr: "L'élément Wikidata Q334242 pour Asghar Farhadi: dates et identifiants; il indique sa naissance le 7 mai 1972 dans la province d'Ispahan, sa citoyenneté iranienne et française, son épouse et sa fille, et trois affirmations religieuses provenant de cette seule source: l'islam, l'islam chiite et le chiisme duodécimain."
  ur: "وکی ڈیٹا آئٹم Q334242 اصغر فرہادی کے لیے: تاریخیں اور شناخت کنندہ؛ اس نے 7 مئی 1972 کو صوبہ اصفہان میں اس کی پیدائش کی، ایران اور فرانس کی شہریت، اس کی شریک حیات اور بیٹی، اور صرف اس واحد ذریعہ سے تین مذہب کے دعوے: اسلام، شیعہ اسلام اور بارہ شیعہ۔"
  tr: "Asghar Farhadi tarafından Wikidata Element Q334242: Tarihler ve Tanımlayıcılar; 7 Mayıs 1972'de İsfahan Eyaleti'nde doğmuştur, İran ve Fransız vatandaşlığına sahiptir ve sadece bu kaynaktan üç dini iddia taşımaktadır: İslam, Şiilik ve On Ikilikçilik."
  id: "Wikidata Elemen Q334242 oleh Asghar Farhadi: Sejarah dan Pengidentifikasi; ia lahir pada 7 Mei 1972 di Provinsi Isfahan, memegang kewarganegaraan Iran dan Prancis, serta membawa tiga klaim agama dari sumber ini saja: Islam, Syiah, dan Dua Belas Negara."
