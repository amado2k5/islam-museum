reliability_note: "Platform statistics aggregator, not a museum-verified fact: vidIQ compiles public YouTube data and stated, as of 15 November 2026, 198,000 subscribers, 19,780,876 total views and 6,453 videos; the channel started on 15 February 2013 and its channel country is set to Indonesia. Its most-viewed uploads, as listed on 15 November 2026, carry several different teachers — among them Ustadz Gigih Surya Nugraha (a February 2026 appeal for the foundation's Bandung radio station) and Ustadz Abu Haidar as-Sundawy — so the page shows a foundation's kajian catalogue, not one presenter's channel. vidIQ's estimated earnings are modelled and are not used. The page names no single presenter or operator. Read on 15 November 2026; the figures agree with the wave-200 harvest's vidIQ read of 10 November 2026 (198,000 subscribers, 19,754,142 views, 6,445 videos)."
