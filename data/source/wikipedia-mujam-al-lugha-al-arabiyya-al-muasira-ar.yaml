summary:
  ar: "صفحة «معجم اللغة العربية المعاصرة (2008)» في ويكيبيديا العربية، وهي الصفحة الموثِّقة التي سماها ملخص بحثي قُدّم إلى المتحف للكتاب «معجم اللغة العربية المعاصرة»؛ لم يفتح المتحف الصفحة، وقد أجاز المؤسس استعمال الملخص دون إعادة تحقق في 21 نوفمبر 2026، في موضوع: نسبة الكتاب إلى مؤلفه وتاريخه."
  en: "The page \"معجم اللغة العربية المعاصرة (2008)\" on the Arabic Wikipedia, named by a research summary supplied to the museum as the documenting page for Mu'jam al-Lugha al-Arabiyya al-Mu'asira; the museum did not open the page, and the founder approved using the summary without re-verification on 21 November 2026, for the ascription of the work to its author and its date."
  ur: "عربی ویکیپیڈیا پر صفحہ «معجم اللغة العربية المعاصرة (2008)»، جسے عجائب گھر کو دیے گئے ایک تحقیقی خلاصے نے «معجم اللغۃ العربیہ المعاصرہ» کا مستند صفحہ بتایا؛ عجائب گھر نے صفحہ نہیں کھولا، اور بانی نے 21 نومبر 2026 کو دوبارہ تصدیق کے بغیر خلاصے کے استعمال کی منظوری دی، موضوع: کتاب کی مصنف سے نسبت اور اس کی تاریخ۔"
  fr: "La page « معجم اللغة العربية المعاصرة (2008) » de Wikipédia (arabe), nommée par un résumé de recherche remis au musée comme page documentaire de Mu'jam al-Lugha al-Arabiyya al-Mu'asira ; le musée n'a pas ouvert la page, et le fondateur a approuvé l'usage du résumé sans nouvelle vérification le 21 novembre 2026, pour l'attribution de l'ouvrage à son auteur et sa date."
  es: "La página «معجم اللغة العربية المعاصرة (2008)» de Wikipedia (en árabe), nombrada por un resumen de investigación entregado al museo como página documental de Mu'jam al-Lugha al-Arabiyya al-Mu'asira; el museo no abrió la página, y el fundador aprobó usar el resumen sin nueva verificación el 21 de noviembre de 2026, para la atribución de la obra a su autor y su fecha."
  tr: "Arap Vikipedi'deki \"Çağdaş Arap Dili Sözlüğü (2008)\" sayfası, belgelenmiş sayfa olarak müzeye \"Çağdaş Arap Dili Sözlüğü\" kitabı için sunulan araştırma özeti olarak adlandırılmıştır; müze sayfayı açmamış ve kurucu, 21 Kasım 2026'da özetin yeniden doğrulama olmaksızın kullanılmasına izin vermiştir: kitabın yazarına ve tarihine atfedilmesi başlıklıdır."
  id: "Halaman \"Kamus Bahasa Arab Kontemporer (2008)\" di Wikipedia bahasa Arab, yang merupakan halaman terdokumentasi yang disebut ringkasan penelitian yang diserahkan ke museum untuk buku \"Kamus Bahasa Arab Kontemporer\"; museum tidak membuka halaman tersebut, dan pendiri mengizinkan penggunaan ringkasan tanpa verifikasi ulang pada 21 November 2026, dengan topik: atribusi buku kepada penulisnya dan sejarahnya."
