summary:
  ar: مقالة ويكيبيديا الأردية عن محمد طاهر القادري؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في جهنغ في 19 فبراير 1951، وخلفيته الأسرية، وتتلمذه على الشيخ طاہر علاؤ الدین القادري الگيلاني، وتأسيسه منهاج القرآن ومؤسسة المنهاج للرعاية والحركة الشعبية الباكستانية.
  en: Urdu Wikipedia article on Muhammad Tahir-ul-Qadri; used for entity facts only. It gives his birth in Jhang on 19 February 1951, his family background, his discipleship under Shaykh Tahir Allauddin al-Qadri al-Gillani, and his founding of Minhaj-ul-Quran, the Minhaj Welfare Foundation and the Pakistan Awami Tehreek.
  es: "Artículo de Wikipedia en urdu sobre Muhammad Tahir-ul-Qadri; Se utiliza únicamente para hechos de entidades. Da su nacimiento en Jhang el 19 de febrero de 1951, sus antecedentes familiares, su discipulado bajo Shaykh Tahir Allauddin al-Qadri al-Gillani y su fundación de Minhaj-ul-Quran, la Minhaj Welfare Foundation y Pakistan Awami Tehreek."
  fr: "Article Wikipédia en ourdou sur Muhammad Tahir-ul-Qadri; utilisé uniquement pour les faits d’entité. Il donne sa naissance à Jhang le 19 février 1951, ses antécédents familiaux, son statut de disciple auprès de Shaykh Tahir Allauddin al-Qadri al-Gillani et sa fondation du Minhaj-ul-Quran, de la Minhaj Welfare Foundation et du Pakistan Awami Tehreek."
  ur: "محمد طاہر القادری پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 19 فروری 1951 کو جھنگ میں ان کی پیدائش، ان کا خاندانی پس منظر، شیخ طاہر علاؤالدین القادری الگیلانی کے ماتحت ان کی شاگردی، اور منہاج القرآن، منہاج ویلفیئر فاؤنڈیشن اور پاکستان عوامی تحریک کی بانی ہے۔"
