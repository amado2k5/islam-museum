summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شيخو شاجاري؛ تُستخدم لوقائع الكيان فقط. تروي مسيرته من معلّم إلى نائب ووزير اتحادي، ورئاسته المنتخبة لنيجيريا (1979–1983) في الجمهورية الثانية، وإطاحة انقلاب 1983 به، ووفاته في أبوجا في 28 ديسمبر 2018."
  en: "English Wikipedia article on Shehu Shagari; used for entity facts only. It recounts his career from teacher to federal legislator and minister, his elected presidency of Nigeria (1979–1983) in the Second Republic, his overthrow in the 1983 coup, and his death in Abuja on 28 December 2018."
  es: "Artículo de la Wikipedia en inglés sobre Shehu Shagari; utilizado únicamente para datos sobre la persona. Narra su trayectoria desde maestro hasta legislador federal y ministro, su elección como presidente de Nigeria (1979-1983) durante la Segunda República, su derrocamiento en el golpe de Estado de 1983 y su fallecimiento en Abuja el 28 de diciembre de 2018."
  fr: "Article de Wikipédia en anglais sur Shehu Shagari; utilisé uniquement à des fins d’information sur l’entité. Il retrace son parcours, d’enseignant à législateur fédéral et ministre, son élection à la présidence du Nigeria (1979-1983) sous la Deuxième République, son renversement lors du coup d’État de 1983 et sa mort à Abuja le 28 décembre 2018."
  ur: "شیہو شگاری پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں استاد سے لے کر وفاقی قانون ساز اور وزیر تک ان کے کیریئر، دوسری جمہوریہ میں نائیجیریا کی ان کی منتخب صدارت (1979–1983)، 1983 کی بغاوت میں ان کا تختہ الٹنے اور 28 دسمبر 2018 کو ابوجا میں ان کی موت کا ذکر ہے۔"
