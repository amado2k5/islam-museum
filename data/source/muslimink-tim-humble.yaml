label: { en: "Tim Humble — Muslim Ink interview" }
summary:
  ar: "مقابلة مجلة Muslim Ink مع تيم همبل حول ممارسته الرقية الشرعية، بعنوان «الرقية أصبحت وسيلة للاستغلال»؛ يتحدث فيها بكلماته عن علاجه للناس بالقرآن والأدعية المأثورة، ويحيل القرّاء إلى موقعه muhammadtim.com لمزيد من المواد حول الرقية الذاتية."
  en: "Muslim Ink's interview with Tim Humble on his ruqyah practice, titled 'Ruqyah has become a means of exploitation'; in his own words he describes treating people through recitation and reported supplications, and directs readers to his website muhammadtim.com for his self-ruqyah materials."
  es: "La entrevista de Muslim Ink con Tim Humble sobre su práctica de ruqyah, titulada \"La ruqyah se ha convertido en un medio de explotación\", describe en sus propias palabras cómo trata a las personas mediante la recitación y las súplicas que se le atribuyen, y remite a los lectores a su sitio web muhammadtim.com para acceder a sus materiales de auto-ruqyah."
  fr: "L'interview de Tim Humble par Muslim Ink sur sa pratique de la ruqyah, intitulée « La ruqyah est devenue un moyen d'exploitation », révèle que Tim Humble y décrit comment il soigne les gens par la récitation et les invocations rapportées, et invite les lecteurs à consulter son site web muhammadtim.com pour accéder à ses supports d'auto-ruqyah."
  ur: "مسلم انک کا ٹم ہمبل کے ساتھ ان کی رقیہ مشق پر انٹرویو، جس کا عنوان ہے 'رقیہ استحصال کا ایک ذریعہ بن گیا ہے'؛ وہ اپنے الفاظ میں تلاوت اور اطلاع شدہ دعاؤں کے ذریعے لوگوں کے ساتھ سلوک کرنے کی وضاحت کرتا ہے، اور قارئین کو اس کی ویب سائٹ muhammadtim.com پر خود روقیہ مواد کے لیے ہدایت کرتا ہے۔"
  tr: "Muslim Ink dergisinin Tim Hempel ile Ruqyah (ruhsal şifa) uygulaması üzerine yaptığı \"Ruqyah Sömürü Aracı Oldu\" başlıklı röportajında kendi sözleriyle Kur'an ve iletilen dualarla insanlara davranmaktan bahsediyor ve okuyucuları kendi web sitesine yönlendiriyor muhammadtim.com kendini Ruqyah hakkında daha fazla materyal içeriyor."
  id: "Wawancara majalah Muslim Ink dengan Tim Hempel tentang praktik Ruqyah (penyembuhan spiritual) yang dilakukannya, berjudul \"Ruqyah Telah Menjadi Sarana Eksploitasi\"; di dalamnya, ia berbicara dengan kata-katanya sendiri tentang memperlakukan orang dengan Al-Qur'an dan doa yang disampaikan, serta mengarahkan pembaca ke situs webnya muhammadtim.com materi lebih lanjut tentang Ruqyah diri."
title: "Interview with Tim Humble: 'Ruqyah has become a means of exploitation'"
