summary:
  ar: "مقالة ويكيبيديا العربية عن حيدر العبادي؛ تُستخدم لوقائع الكيان فقط. يعطي متنها ولادته في 25 نيسان 1952 ويعطي صندوقها السنة فقط وحقل دين هو «مسلم شيعي»، وهو حقل صندوق واحد، وتصنّفه ضمن «شيعة عراقيون»."
  en: "Arabic Wikipedia article on Haider al-Abadi; used for entity facts only. Its lead gives his birth on 25 April 1952 while its infobox gives the year only; the infobox religion field reads 'Shia Muslim' — one infobox field — and it files him under 'Iraqi Shia', a category filing."
  es: "Artículo de Wikipedia en árabe sobre Haider al-Abadi; utilizado únicamente para datos sobre la persona. Su introducción indica que nació el 25 de abril de 1952, mientras que su ficha informativa solo proporciona el año; el campo de religión de la ficha informativa dice \"musulmán chiíta\" (un solo campo de la ficha informativa) y lo clasifica como \"chiíta iraquí\", una categoría."
  fr: "Article Wikipédia en arabe sur Haider al-Abadi; utilisé uniquement pour les informations sur l'entité. Son introduction indique sa date de naissance, le 25 avril 1952, tandis que son infobox ne mentionne que l'année; le champ « religion » de l'infobox indique « musulman chiite » (un seul champ d'infobox) et il est classé dans la catégorie « Chiite irakien »."
  ur: "حیدر العبادی پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کا لیڈ اس کی پیدائش 25 اپریل 1952 کو کرتا ہے جبکہ اس کا انفو باکس صرف سال دیتا ہے۔ انفو باکس مذہب کا فیلڈ 'شیعہ مسلم' پڑھتا ہے - ایک انفو باکس فیلڈ - اور یہ اسے 'عراقی شیعہ' کے تحت فائل کرتا ہے، ایک زمرہ فائلنگ۔"
  tr: "Haider al-Abadi hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Doğum tarihini 25 Nisan 1952 olarak veriyor ve kutusunda sadece Sünni ve dini alan olan \"Şii Müslüman\" olarak belirtiliyor; bu da tek bir kutu alanıdır ve onu \"Iraklı Şii\" olarak sınıflandırır."
  id: "Artikel Wikipedia Arab tentang Haider al-Abadi; digunakan hanya untuk fakta entitas. Artikel tersebut mencantumkan tanggal lahirnya pada 25 April 1952, dan kotaknya hanya mencantumkan bidang Sunni dan agama, yaitu \"Muslim Syiah,\" yang merupakan satu kolom kotak, mengklasifikasikannya sebagai \"Syiah Irak.\""
