label:
  ar: "المستدرك على الصحيحين للحاكم — دراسة وتحقيق مصطفى عبد القادر عطا، دار الكتب العلمية، بيروت، الجزء الثالث"
  en: "al-Mustadrak 'ala al-Sahihayn of al-Hakim — ed. Mustafa 'Abd al-Qadir 'Ata, Dar al-Kutub al-'Ilmiyya, Beirut, vol. 3"
summary:
  ar: "طبعة دار الكتب العلمية ⁦(منشورات محمد علي بيضون، بيروت)⁩ بدراسة وتحقيق مصطفى عبد القادر عطا، «أول طبعة رقمت الأحاديث وقوبلت على عدة مخطوطات»، مع تضمينات الذهبي في التلخيص والميزان والعراقي في أماليه والمناوي في فيض القدير؛ الجزء الثالث: كتاب الهجرة ⁦(29، ص 3-20، ح 4257-)⁩، وكتاب المغازي والسرايا ⁦(30، من ص 21، ح 4297-)⁩، وكتاب معرفة الصحابة ⁦(31، من ص 64، ح 4403-6709 في هذا الجزء)⁩، وفهرسه في آخره ⁦(ص 745-758)⁩."
  en: "The Dar al-Kutub al-'Ilmiyya edition (Muhammad 'Ali Baydun publications, Beirut), studied and edited by Mustafa 'Abd al-Qadir 'Ata, billed as 'the first edition to number the hadiths, collated with several manuscripts', with excerpts from al-Dhahabi's Talkhis and Mizan, al-'Iraqi's Amali and al-Munawi's Fayd al-Qadir; vol. 3 holds the Book of the Hijra (no. 29, pp. 3-20, from hadith 4257), the Book of Campaigns and Expeditions (no. 30, from p. 21, from hadith 4297) and the Book of Knowing the Companions (no. 31, from p. 64, hadiths 4403-6709 in this volume), with its index at the end (pp. 745-758)."
