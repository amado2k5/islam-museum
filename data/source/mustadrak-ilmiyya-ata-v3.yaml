label:
  ar: "المستدرك على الصحيحين للحاكم — دراسة وتحقيق مصطفى عبد القادر عطا، دار الكتب العلمية، بيروت، الجزء الثالث"
  en: "al-Mustadrak 'ala al-Sahihayn of al-Hakim — ed. Mustafa 'Abd al-Qadir 'Ata, Dar al-Kutub al-'Ilmiyya, Beirut, vol. 3"
summary:
  ar: "طبعة دار الكتب العلمية ⁦(منشورات محمد علي بيضون، بيروت)⁩ بدراسة وتحقيق مصطفى عبد القادر عطا، «أول طبعة رقمت الأحاديث وقوبلت على عدة مخطوطات»، مع تضمينات الذهبي في التلخيص والميزان والعراقي في أماليه والمناوي في فيض القدير؛ الجزء الثالث: كتاب الهجرة ⁦(29، ص 3-20، ح 4257-)⁩، وكتاب المغازي والسرايا ⁦(30، من ص 21، ح 4297-)⁩، وكتاب معرفة الصحابة ⁦(31، من ص 64، ح 4403-6709 في هذا الجزء)⁩، وفهرسه في آخره ⁦(ص 745-758)⁩."
  en: "The Dar al-Kutub al-'Ilmiyya edition (Muhammad 'Ali Baydun publications, Beirut), studied and edited by Mustafa 'Abd al-Qadir 'Ata, billed as 'the first edition to number the hadiths, collated with several manuscripts', with excerpts from al-Dhahabi's Talkhis and Mizan, al-'Iraqi's Amali and al-Munawi's Fayd al-Qadir; vol. 3 holds the Book of the Hijra (no. 29, pp. 3-20, from hadith 4257), the Book of Campaigns and Expeditions (no. 30, from p. 21, from hadith 4297) and the Book of Knowing the Companions (no. 31, from p. 64, hadiths 4403-6709 in this volume), with its index at the end (pp. 745-758)."
  es: "La edición Dar al-Kutub al-'Ilmiyya (publicaciones Muhammad 'Ali Baydun, Beirut), estudiada y editada por Mustafa 'Abd al-Qadir 'Ata, anunciada como 'la primera edición que numera los hadices, cotejados con varios manuscritos', con extractos de Talkhis y Mizan de al-Dhahabi, Amali de al-'Iraqi y Fayd al-Qadir de al-Munawi; vol. El volumen 3 contiene el Libro de la Hégira (n.º 29, págs. 3-20, del hadiz 4257), el Libro de las Campañas y Expediciones (n.º 30, desde la pág. 21, del hadiz 4297) y el Libro del Conocimiento de los Compañeros (n.º 31, desde la pág. 64, hadices 4403-6709 en este volumen), con su índice al final (págs. 745-758)."
  fr: "L'édition Dar al-Kutub al-'Ilmiyya (éditions Muhammad 'Ali Baydun, Beyrouth), étudiée et éditée par Mustafa 'Abd al-Qadir 'Ata, présentée comme « la première édition à numéroter les hadiths, collationnée avec plusieurs manuscrits », avec des extraits de Talkhis et Mizan d'al-Dhahabi, d'Amali d'al-'Iraqi et de Fayd al-Qadir d'al-Munawi; vol. 3 contient le Livre de l'Hégire (n° 29, pp. 3-20, du hadith 4257), le Livre des Campagnes et des Expéditions (n° 30, à partir de la p. 21, du hadith 4297) et le Livre de la Connaissance des Compagnons (n° 31, à partir de la p. 64, hadiths 4403-6709 dans ce volume), avec son index à la fin (pp. 745-758)."
  ur: "دار الکتب العلمیہ ایڈیشن ⁦(محمد علی بیدون پبلیکیشنز، بیروت)⁩، جس کا مطالعہ اور تدوین مصطفیٰ عبدالقادر عطا نے کیا تھا، جسے 'احادیث کو نمبر دینے والا پہلا ایڈیشن' کہا جاتا ہے، جس میں متعدد مخطوطات شامل ہیں، جن میں الذہقی، الذہبی' اور 'مذہبی' کے اقتباسات شامل ہیں۔ امالی اور المناوی کا فید القادر؛ والیوم 3 کے پاس ہجرت کی کتاب ⁦(نمبر 29، صفحہ 3-20، حدیث 4257 سے)⁩، مہمات اور مہمات کی کتاب ⁦(نمبر 30، صفحہ 21 سے، حدیث 4297 سے)⁩ اور صحابہ کی معرفت کی کتاب ⁦(نمبر 31، صفحہ 649 سے)⁩، اس کی جلد 640- میں حدیث ہے۔ آخر میں ⁦(صفحہ 745-758)⁩۔"
  tr: "Dar al-Kutub al-Ilmiyya baskısı (Muhammed Ali Baydoun Yayınları, Beyrut), Mustafa Abdul Kadir Atta tarafından incelenip doğrulanmıştır; \"ilk baskı hadisleri numaralandırmış ve birkaç el yazmasıyla karşılanmıştır,\" el-Dahabinin el-Talkhis wa al-Mizan'a, el-Iraqi'nin Amaliyya'sına ve el-Manawi'nin Fayd al-Qadir'e dahil edilmesiyle; Cilt Üç: Kitab al-Hijre (29, s. 3-20, hadis 4257-), Kitab al-Maghazi wal-Saraya (30, s. 21, hadis 4297-) ve Kitab Ma'rifat al-Sahabah (31, s. 64, bu bölümde hadis 4403-6709) ve dizini sonunda (s. 745-758)."
  id: "Edisi Dar al-Kutub al-Ilmiyya (Publikasi Muhammad Ali Baydoun, Beirut), yang dipelajari dan diverifikasi oleh Mustafa Abdul Qadir Atta, \"edisi pertama menomor hadis dan dipenuhi dengan beberapa manuskrip,\" dengan pencantuman al-Dhahabi dalam al-Talkhis wa al-Mizan, al-Iraqi dalam Amaliyya-nya, dan al-Manawi dalam Fayd al-Qadir; Jilid Tiga: Kitab al-Hijrah (29, hlm. 3-20, hadis 4257-), Kitab al-Maghazi wal-Saraya (30, dari hlm. 21, hadis 4297-), dan Kitab Ma'rifat al-Sahabah (31, hlm. 64, hadis 4403-6709 dalam bagian ini), dengan indeksnya di akhir (hlm. 745-758)."
