reliability_note: "Read on 1 November 2026 in the web edition, from the page text fetched in parts: the etymology and definition, the Companions and the centres of learning, the travel in search of hadith, the criticism of narrators and the rise of the isnad, the methods of receiving hadith and the permission to narrate (icazet), the dar al-hadith institutions, and the passage on the criticism of texts. Not read: the sections on the types of hadith in detail, the Shi'i section, and the bibliography, whose works were not opened. The printed page range 27–64 covers the whole entry, since the web edition gives no page marks inside the text, so citations give that range. The entry prints the Hijri century of the isnad as 'I.' beside the Christian-era label 'VIII.'; the museum's article uses the Christian-era label. Facts are rewritten in the museum's own words."
