summary:
  ar: "مدخل «حديث» في موسوعة TDV الإسلامية التركية بقلم محمد ياشار كاندمير (المجلد 15، إسطنبول 1997، ص 27–64)، ويتناول معنى الكلمة، وتاريخ الحديث من عهد النبي إلى التدوين، والرواية والتحمّل، ونقد الرواة والإسناد، والرحلة في طلب الحديث، ونشأة دور الحديث، وأنواع الحديث، وحديث الشيعة."
  en: "The TDV İslâm Ansiklopedisi entry 'HADİS' by M. Yaşar Kandemir (vol. 15, Istanbul 1997, pp. 27–64). It covers the meaning of the word, the history of hadith from the Prophet to its compilation, transmission and receiving, criticism of narrators and the isnad, the journey in search of hadith, the rise of dar al-hadith institutions, the types of hadith, and Shi'i hadith."
title: "HADİS"
