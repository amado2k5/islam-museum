summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شمس الدين إلتتمش، ثالث سلاطين دهلي ⁦(حكم 1211–1236)⁩؛ تعطي ولادته سنة 1192 ووفاته في دهلي في 30 أبريل 1236 وتقليد الخليفة المستنصر له سنة 1229؛ تُستخدم لوقائع الكيان فقط."
  en: "English Wikipedia article on Shams ud-Din Iltutmish, third sultan of Delhi (r. 1211-1236); it gives his birth in 1192, his death at Delhi on 30 April 1236, and the Abbasid caliph al-Mustansir's investiture of 1229; used for entity facts only, each cited where the article gives its own source."
  es: "Artículo de la Wikipedia en inglés sobre Shams ud-Din Iltutmish, tercer sultán de Delhi (r. 1211-1236); indica su nacimiento en 1192, su muerte en Delhi el 30 de abril de 1236 y la investidura del califa abasí al-Mustansir en 1229; se utiliza únicamente para datos sobre la entidad, citados donde el artículo proporciona su propia fuente."
  fr: "Article de Wikipédia en anglais sur Shams ud-Din Iltutmish, troisième sultan de Delhi (r. 1211-1236); il indique sa naissance en 1192, sa mort à Delhi le 30 avril 1236 et son investiture par le calife abbasside al-Mustansir en 1229; utilisé uniquement pour les faits concernant l'entité, chaque élément étant cité lorsque l'article donne sa propre source."
  ur: "شمس الدین التمش، دہلی کے تیسرے سلطان (r. 1211-1236) پر انگریزی ویکیپیڈیا کا مضمون؛ یہ 1192 میں ان کی پیدائش، 30 اپریل 1236 کو دہلی میں اس کی موت، اور عباسی خلیفہ المستنصر کی 1229 میں سرمایہ کاری؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے، ہر ایک کا حوالہ دیا جاتا ہے جہاں مضمون اپنا ماخذ دیتا ہے۔"
