reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Covers her birth at Fez on 27 September 1940, her upbringing in her paternal grandmother's harem, her schooling, political science at Mohammed V University from 1959, the Sorbonne in 1966, Brandeis from 1970 and the doctorate of 1973, teaching at Mohammed V University (1974-1981), the books from Beyond the Veil (1975) to Islam and Democracy and Scheherazade Goes West, the Prince of Asturias Award (2003) and Erasmus Prize (2004), and her death at Rabat on 30 November 2015. Its education sequence conflicts with the Arabic and Urdu articles (Sorbonne in 1957, doctorate in 1974); the conflict is recorded in the person record. Read in full on 24 October 2026."
