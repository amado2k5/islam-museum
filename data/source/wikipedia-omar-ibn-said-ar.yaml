summary:
  ar: "مقالة ويكيبيديا العربية عن عمر بن سعيد؛ تُستخدم لوقائع الكيان فقط. تصفه بعالم فولاني مسلم طلب العلم خمسة وعشرين عاما، وتروي أسره سنة 1807 وحياته في كارولاينا الشمالية ومخطوطاته العربية الأربعة عشر ووفاته سنة 1864."
  en: "Arabic Wikipedia article on Omar ibn Said; used for entity facts only. It describes him as a Fula Muslim scholar who studied for twenty-five years and recounts his capture in 1807, his life in North Carolina, his fourteen Arabic manuscripts, and his death in 1864."
  es: "Artículo de Wikipedia en árabe sobre Omar ibn Said; utilizado únicamente para obtener información sobre su persona. Lo describe como un erudito musulmán fulani que estudió durante veinticinco años y relata su captura en 1807, su vida en Carolina del Norte, sus catorce manuscritos en árabe y su muerte en 1864."
  fr: "Article de Wikipédia en arabe sur Omar ibn Said; utilisé uniquement à des fins d’information sur l’entité. Il le décrit comme un érudit musulman peul qui a étudié pendant vingt-cinq ans et relate sa capture en 1807, sa vie en Caroline du Nord, ses quatorze manuscrits arabes et sa mort en 1864."
  ur: "عمر بن سعید پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اسے ایک فولا مسلم اسکالر کے طور پر بیان کیا گیا ہے جس نے 25 سال تک تعلیم حاصل کی اور 1807 میں اس کی گرفتاری، شمالی کیرولینا میں اس کی زندگی، اس کے چودہ عربی نسخے، اور 1864 میں اس کی موت کا ذکر کیا ہے۔"
  tr: "Ömer ibn Saeed hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Yirmi beş yıl boyunca bilgi arayan bir Fulani Müslüman alimi olarak tanımlanır; 1807'deki esaretini, Kuzey Carolina'daki hayatını, on dört Arapça el yazmasını ve 1864'teki ölümünü anlatır."
  id: "Artikel Wikipedia bahasa Arab tentang Omar ibn Saeed; digunakan hanya untuk fakta entitas. Ia digambarkan sebagai seorang ulama Muslim Fulani yang mencari pengetahuan selama dua puluh lima tahun, menceritakan penahanannya pada tahun 1807, kehidupannya di North Carolina, empat belas manuskrip Arabnya, dan kematiannya pada tahun 1864."
