reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md). Read in full on 26 October 2026 and checked against the recorded revision. An Arabic text tradition closely following the English article's sources: it gives his birth in 1770 in Futa Toro, Senegal, his twenty-five years of study under Muslim scholars, his capture in 1807, his escape from a cruel master in Charleston, his sale to James Owen, his death in 1864 and burial in Bladen County, and his fourteen Arabic manuscripts. Its text calls him a Muslim scholar throughout and discusses his writings as those of a Muslim addressing two audiences; it names no madhhab or order for him."
