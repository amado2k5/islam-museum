summary:
  ar: "مقالة ويكيبيديا العربية عن علي أحمد ملا، مؤذن المسجد الحرام وشيخ المؤذنين؛ لوقائع الكيان فقط: مولده بمكة في 1366هـ، ودراسته، وأسرته من مؤذني الحرم، وتعيينه في 1975، والأذان من المنارات قبل 1400هـ، وأذانه بعد حادثة الحرم 1979؛ وتستند إلى عكاظ والرياض."
  en: "Arabic Wikipedia article on Ali Ahmad Mulla, muezzin of the Masjid al-Haram and head of its muezzins; entity facts only: birth in Mecca in 1366 AH, schooling, his family of Haram muezzins, appointment in 1975, the minaret adhan before 1400 AH, and his adhan after the 1979 seizure of the Haram; it cites Okaz and al-Riyadh."
  es: "Artículo en la Wikipedia en árabe sobre Ali Ahmad Mulla, muecín de la Mezquita Sagrada (Masjid al-Haram) y jefe de sus muecines; solo datos sobre la entidad: nacimiento en La Meca en 1366 AH, educación, su familia de muecines del Haram, nombramiento en 1975, el adhan del minarete antes de 1400 AH y su adhan después de la toma del Haram en 1979; cita a Okaz y al-Riyadh."
  fr: "Article de Wikipédia en arabe sur Ali Ahmad Mulla, muezzin de la Masjid al-Haram et chef de ses muezzins; faits concernant uniquement l'entité: naissance à La Mecque en 1366 AH, scolarité, sa famille de muezzins du Haram, nomination en 1975, l'adhan du minaret avant 1400 AH et son adhan après la prise du Haram en 1979; il cite Okaz et al-Riyadh."
