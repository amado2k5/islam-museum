summary:
  ar: "\u0645\u0642\u0627\u0644\u0629 \u0648\u064a\u0643\u064a\u0628\u064a\u062f\u064a\u0627 \u0627\u0644\u0639\u0631\u0628\u064a\u0629 \u0639\u0646 \u0639\u0644\u064a \u0623\u062d\u0645\u062f \u0645\u0644\u0627\u060c \u0645\u0624\u0630\u0646 \u0627\u0644\u0645\u0633\u062c\u062f \u0627\u0644\u062d\u0631\u0627\u0645 \u0648\u0634\u064a\u062e \u0627\u0644\u0645\u0624\u0630\u0646\u064a\u0646\u061b \u0644\u0648\u0642\u0627\u0626\u0639 \u0627\u0644\u0643\u064a\u0627\u0646 \u0641\u0642\u0637: \u0645\u0648\u0644\u062f\u0647 \u0628\u0645\u0643\u0629 \u0641\u064a 1366\u0647\u0640\u060c \u0648\u062f\u0631\u0627\u0633\u062a\u0647\u060c \u0648\u0623\u0633\u0631\u062a\u0647 \u0645\u0646 \u0645\u0624\u0630\u0646\u064a \u0627\u0644\u062d\u0631\u0645\u060c \u0648\u062a\u0639\u064a\u064a\u0646\u0647 \u0641\u064a 1975\u060c \u0648\u0627\u0644\u0623\u0630\u0627\u0646 \u0645\u0646 \u0627\u0644\u0645\u0646\u0627\u0631\u0627\u062a \u0642\u0628\u0644 1400\u0647\u0640\u060c \u0648\u0623\u0630\u0627\u0646\u0647 \u0628\u0639\u062f \u062d\u0627\u062f\u062b\u0629 \u0627\u0644\u062d\u0631\u0645 1979\u061b \u0648\u062a\u0633\u062a\u0646\u062f \u0625\u0644\u0649 \u0639\u0643\u0627\u0638 \u0648\u0627\u0644\u0631\u064a\u0627\u0636."
  en: "Arabic Wikipedia article on Ali Ahmad Mulla, muezzin of the Masjid al-Haram and head of its muezzins; entity facts only: birth in Mecca in 1366 AH, schooling, his family of Haram muezzins, appointment in 1975, the minaret adhan before 1400 AH, and his adhan after the 1979 seizure of the Haram; it cites Okaz and al-Riyadh."
