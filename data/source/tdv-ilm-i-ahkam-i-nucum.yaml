summary:
  ar: "مدخل «علم أحكام النجوم» في موسوعة TDV الإسلامية: التنجيم بوصفه علماً قائماً على اعتقاد أن النجوم تؤثر في الناس والأحداث، وفرقه عن الفلك الرياضي، وتصنيف الفارابي وابن خلدون وطاشكبري زاده له، ونشأته البابلية والساسانية، ومؤلفاته العربية، ومكانة المنجّم عند الخلفاء والقادة."
  en: "The TDV İslâm Ansiklopedisi entry on judicial astrology: the discipline resting on the belief that the stars affect people and events, its separation from mathematical astronomy in the classifications of al-Farabi, Ibn Khaldun and Tashkoprizade, its Babylonian and Sasanian background, the Arabic astrological literature, and the astrologer's place with caliphs and commanders."
  es: "La entrada de la TDV İslâm Ansiklopedisi sobre astrología judicial: la disciplina que se basa en la creencia de que las estrellas afectan a las personas y los acontecimientos, su separación de la astronomía matemática en las clasificaciones de al-Farabi, Ibn Khaldun y Tashkoprizade, sus antecedentes babilónicos y sasánidas, la literatura astrológica árabe y el lugar del astrólogo entre los califas y comandantes."
  fr: "L'article de TDV İslâm Ansiklopedisi sur l'astrologie judiciaire: la discipline fondée sur la croyance que les étoiles influencent les personnes et les événements, sa séparation de l'astronomie mathématique dans les classifications d'al-Farabi, d'Ibn Khaldun et de Tashkoprizade, ses origines babyloniennes et sassanides, la littérature astrologique arabe et la place de l'astrologue auprès des califes et des commandants."
