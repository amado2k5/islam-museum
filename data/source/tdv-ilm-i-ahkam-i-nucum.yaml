summary:
  ar: "مدخل «علم أحكام النجوم» في موسوعة TDV الإسلامية: التنجيم بوصفه علماً قائماً على اعتقاد أن النجوم تؤثر في الناس والأحداث، وفرقه عن الفلك الرياضي، وتصنيف الفارابي وابن خلدون وطاشكبري زاده له، ونشأته البابلية والساسانية، ومؤلفاته العربية، ومكانة المنجّم عند الخلفاء والقادة."
  en: "The TDV İslâm Ansiklopedisi entry on judicial astrology: the discipline resting on the belief that the stars affect people and events, its separation from mathematical astronomy in the classifications of al-Farabi, Ibn Khaldun and Tashkoprizade, its Babylonian and Sasanian background, the Arabic astrological literature, and the astrologer's place with caliphs and commanders."
