  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الرحمن السديس؛ تُستخدم لوقائع الكيان فقط. تروي إمامته للحرم من 1984 ورئاسته لشؤون الحرمين من 2012 وجائزة دبي للقرآن 2005 وخطبه ومواقفه والانتقادات الموجهة إليه؛ وصندوق سيرتها الدينية المضمّن يعطي المذهب سني والعقيدة أثري والفقه حنبلي والحركة سلفية، وتاريخ مولد 23 نوفمبر 1963 يخالف نصها."
  en: "English Wikipedia article on Abdul Rahman Al-Sudais; used for entity facts only. It recounts his imamate of the Grand Mosque from 1984, his presidency of the Two Holy Mosques' affairs from 2012, the 2005 Dubai International Holy Quran Award, his sermons and positions, and the criticism directed at him; its embedded religious-biography infobox gives denomination Sunni, creed Athari, jurisprudence Hanbali and movement Salafi, and a birth date of 23 November 1963 that contradicts the article's own text."
