summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الرحمن السديس؛ تُستخدم لوقائع الكيان فقط. تروي إمامته للحرم من 1984 ورئاسته لشؤون الحرمين من 2012 وجائزة دبي للقرآن 2005 وخطبه ومواقفه والانتقادات الموجهة إليه؛ وصندوق سيرتها الدينية المضمّن يعطي المذهب سني والعقيدة أثري والفقه حنبلي والحركة سلفية، وتاريخ مولد 23 نوفمبر 1963 يخالف نصها."
  en: "English Wikipedia article on Abdul Rahman Al-Sudais; used for entity facts only. It recounts his imamate of the Grand Mosque from 1984, his presidency of the Two Holy Mosques' affairs from 2012, the 2005 Dubai International Holy Quran Award, his sermons and positions, and the criticism directed at him; its embedded religious-biography infobox gives denomination Sunni, creed Athari, jurisprudence Hanbali and movement Salafi, and a birth date of 23 November 1963 that contradicts the article's own text."
  es: "Artículo de la Wikipedia en inglés sobre Abdul Rahman Al-Sudais; utilizado únicamente para datos sobre la persona. Relata su imanato de la Gran Mezquita desde 1984, su presidencia de los asuntos de las Dos Mezquitas Sagradas desde 2012, el Premio Internacional del Sagrado Corán de Dubái de 2005, sus sermones y posturas, y las críticas dirigidas hacia él; su ficha biográfica religiosa integrada indica que es sunita, de credo athari, de jurisprudencia hanbalí y de movimiento salafista, y que su fecha de nacimiento es el 23 de noviembre de 1963, lo cual contradice el texto del propio artículo."
  fr: "Article de Wikipédia en anglais sur Abdul Rahman Al-Sudais; utilisé uniquement à des fins d'information sur l'entité. Il relate son imamat de la Grande Mosquée à partir de 1984, sa présidence des affaires des Deux Saintes Mosquées à partir de 2012, le Prix international du Saint Coran de Dubaï en 2005, ses sermons et ses prises de position, ainsi que les critiques dont il a fait l'objet; son encadré biographique religieux intégré indique une appartenance à l'Église sunnite, une croyance athari, une jurisprudence hanbalite et un mouvement salafiste, ainsi qu'une date de naissance (23 novembre 1963) qui contredit le texte même de l'article."
