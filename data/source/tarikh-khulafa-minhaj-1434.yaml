summary:
  ar: "كتاب جلال الدين السيوطي (ت 911هـ) في تراجم الخلفاء من الصديق إلى عصره مرتبة زمنياً مع حوادث أيامهم: الطبعة الثانية المصححة المنقحة، دار المنهاج جدة بالتعاون مع دار الأوقاف للنشرون الإسلامية بإدارة الشؤون الإسلامية بتمويل الهيئة العامة للأوقاف بدولة قطر، 1434هـ/2013م، إشراف محمد عثمان نصوح الحسيني، اعتمدت ست نسخ خطية منها نسختان بخط تلميذي المؤلف، مجلد واحد 864 صفحة."
  en: "Jalal al-Din al-Suyuti's (d. 911 AH) chronological biographies of the caliphs from al-Siddiq to his own age with the events of their days: second revised edition, Dar al-Minhaj Jeddah with Dar al-Awqaf/Islamic Affairs Administration of Qatar, 1434 AH / 2013 CE, supervised by Muhammad Uthman Nusuh al-Husayni, based on six manuscripts including two copied by the author's students, one volume of 864 pages."
