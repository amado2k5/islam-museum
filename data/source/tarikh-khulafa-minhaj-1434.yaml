label:
  ar: تاريخ الخلفاء — السيوطي ⁦(طبعة دار المنهاج)⁩
  en: Tarikh al-Khulafa — al-Suyuti (Dar al-Minhaj edition)
summary:
  ar: "كتاب جلال الدين السيوطي ⁦(ت 911هـ)⁩ في تراجم الخلفاء من الصديق إلى عصره مرتبة زمنياً مع حوادث أيامهم: الطبعة الثانية المصححة المنقحة، دار المنهاج جدة بالتعاون مع دار الأوقاف للنشرون الإسلامية بإدارة الشؤون الإسلامية بتمويل الهيئة العامة للأوقاف بدولة قطر، 1434هـ/2013م، إشراف محمد عثمان نصوح الحسيني، اعتمدت ست نسخ خطية منها نسختان بخط تلميذي المؤلف، مجلد واحد 864 صفحة."
  en: "Jalal al-Din al-Suyuti's (d. 911 AH) chronological biographies of the caliphs from al-Siddiq to his own age with the events of their days: second revised edition, Dar al-Minhaj Jeddah with Dar al-Awqaf/Islamic Affairs Administration of Qatar, 1434 AH / 2013 CE, supervised by Muhammad Uthman Nusuh al-Husayni, based on six manuscripts including two copied by the author's students, one volume of 864 pages."
  es: "Biografías cronológicas de los califas de Jalal al-Din al-Suyuti (m. 911 AH) desde al-Siddiq hasta su propia época con los acontecimientos de sus días: segunda edición revisada, Dar al-Minhaj Jeddah con Dar al-Awqaf/Administración de Asuntos Islámicos de Qatar, 1434 AH / 2013 CE Uthman Nusuh al-Husaini, basado en seis manuscritos, incluidos dos copiados por los alumnos del autor, es un volumen de 864 páginas."
  fr: "Biographies chronologiques des califes d'al-Siddiq à son époque avec les événements de leur époque de Jalal al-Din al-Suyuti (mort en 911 AH): deuxième édition révisée, Dar al-Minhaj Jeddah avec Dar al-Awqaf/Administration des affaires islamiques du Qatar, 1434 AH / 2013 CE Uthman Nusuh al-Husaini, basée sur six manuscrits, dont deux copiés par les étudiants de l'auteur, est un volume de 864 pages."
  ur: "جلال الدین السیوطی کی ⁦(متوفی 911ھ)⁩ خلفاء الصدیق سے لے کر ان کی عمر تک ان کے ایام کے واقعات کے ساتھ تاریخ ساز سوانح عمری: دوسرا نظر ثانی شدہ ایڈیشن، دار المنہاج جدہ مع دارال اوقاف/اسلامی امور کی انتظامیہ، قطر کی زیر نگرانی، عیسوی 2013، 2013 محمد عثمان نصوح الحسینی، چھ مخطوطات پر مبنی جن میں سے دو مصنف کے طلبہ نے نقل کیے ہیں، ایک جلد 864 صفحات پر مشتمل ہے۔"
