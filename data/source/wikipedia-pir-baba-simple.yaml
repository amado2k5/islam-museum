summary:
  ar: "مقالة ويكيبيديا الإنجليزية المبسطة «پير بابا»: مير سيد علي الترمذي، وليّ صوفي من الطريقة الكبروية أسهم في نشر الإسلام بين البشتون؛ وُلد نحو 908هـ ⁦(1502م)⁩ في قندوز بترمذ من خراسان — قراءة تختلف عن فرغانة في المقالة الإنجليزية — وتوفي سنة 991هـ ⁦(1583م)⁩، وضريحه في باچا كِلّي بمنطقة بونير؛ أبوه مير سيد قنبر علي الترمذي وأمه بيبي سلطان بانو."
  en: "Simple English Wikipedia article 'Pir Baba': Mir Syed Ali Tirmizi, a Sufi Muslim saint of the Kubrawiya order who played an important role in the spread of Islam among the Pashtuns; born around 908 AH (1502 CE) at Qundoos (Kunduz), Tirmiz, Khurasan — a birthplace reading that differs from the English article's Fergana — and died in 991 AH (1583 CE); his mausoleum is at Pacha Kalay, Buner District; his father was Mir Syed Qanbar Ali Tirmizi and his mother Bibi Sultan Banu."
  es: "Artículo simple de Wikipedia en inglés 'Pir Baba': Mir Syed Ali Tirmizi, un santo musulmán sufí de la orden Kubrawiya que jugó un papel importante en la expansión del Islam entre los pashtunes; nació alrededor del año 908 d. H. (1502 d. C.) en Qundoos (Kunduz), Tirmiz, Khurasan (una lectura del lugar de nacimiento que difiere de Fergana del artículo en inglés) y murió en 991 d. C. (1583 d. C.); su mausoleo está en Pacha Kalay, distrito de Buner; su padre era Mir Syed Qanbar Ali Tirmizi y su madre Bibi Sultan Banu."
  fr: "Article simple de Wikipédia en anglais « Pir Baba »: Mir Syed Ali Tirmizi, un saint musulman soufi de l'ordre Kubrawiya qui a joué un rôle important dans la propagation de l'islam parmi les Pachtounes; né vers 908 AH (1502 CE) à Qundoos (Kunduz), Tirmiz, Khurasan — une lecture du lieu de naissance qui diffère de Fergana de l'article anglais — et décédé en 991 AH (1583 CE); son mausolée se trouve à Pacha Kalay, district de Buner; son père était Mir Syed Qanbar Ali Tirmizi et sa mère Bibi Sultan Banu."
  ur: "سادہ انگریزی ویکیپیڈیا مضمون 'پیر بابا': میر سید علی ترمذی، کبرویہ حکم کے ایک صوفی مسلمان بزرگ جنہوں نے پشتونوں میں اسلام کی اشاعت میں اہم کردار ادا کیا۔ تقریباً 908 ہجری ⁦(1502 عیسوی)⁩ قندوس ⁦(قندوز)⁩، ترمیز، خراسان میں پیدا ہوئے - ایک جائے پیدائش پڑھنا جو انگریزی مضمون کے فرغانہ سے مختلف ہے - اور 991 ہجری ⁦(1583 عیسوی)⁩ میں وفات پائی؛ ان کا مزار پچا کلے، ضلع بونیر میں ہے۔ ان کے والد میر سید قنبر علی ترمذی اور والدہ بی بی سلطان بانو تھیں۔"
  tr: "Basitleştirilmiş İngilizce Vikipedi makalesi \"Pir Baba\": Mir Seyyid Ali el-Tirmidi, Kabiru tarikatından bir Sufi olup Peştunlar arasında İslam'ın yayılmasına katkıda bulundu; yaklaşık 908 Hicri (1502) yılında Kunduz'da, Termez, Horasan'da doğdu—İngilizce makaledeki Fergana'dan farklı bir okuma—ve 991 Hicri (1583) yılında öldü. Türbesi Buner bölgesindeki Baja Kali'dedir; babası Mir Seyyid Qanbar Ali el-Tirmidi, annesi ise Bibi Sultan Bano'dur."
  id: "Artikel Wikipedia bahasa Inggris sederhana \"Pir Baba\": Mir Sayyid Ali al-Tirmidhi, seorang Sufi dari tarekat Kabiru yang berkontribusi menyebarkan Islam di kalangan Pashtun; lahir sekitar tahun 908 H (1502 M) di Kunduz di Termez, Khorasan—bacaan yang berbeda dari Fergana dalam artikel Inggris—dan meninggal pada 991 H (1583 M). Makamnya berada di Baja Kali di wilayah Buner; ayahnya adalah Mir Sayyid Qanbar Ali al-Tirmidhi dan ibunya adalah Bibi Sultan Bano."
