summary:
  ar: "مقالة ويكيبيديا الإنجليزية المبسطة «پير بابا»: مير سيد علي الترمذي، وليّ صوفي من الطريقة الكبروية أسهم في نشر الإسلام بين البشتون؛ وُلد نحو 908هـ ⁦(1502م)⁩ في قندوز بترمذ من خراسان — قراءة تختلف عن فرغانة في المقالة الإنجليزية — وتوفي سنة 991هـ ⁦(1583م)⁩، وضريحه في باچا كِلّي بمنطقة بونير؛ أبوه مير سيد قنبر علي الترمذي وأمه بيبي سلطان بانو."
  en: "Simple English Wikipedia article 'Pir Baba': Mir Syed Ali Tirmizi, a Sufi Muslim saint of the Kubrawiya order who played an important role in the spread of Islam among the Pashtuns; born around 908 AH (1502 CE) at Qundoos (Kunduz), Tirmiz, Khurasan — a birthplace reading that differs from the English article's Fergana — and died in 991 AH (1583 CE); his mausoleum is at Pacha Kalay, Buner District; his father was Mir Syed Qanbar Ali Tirmizi and his mother Bibi Sultan Banu."
