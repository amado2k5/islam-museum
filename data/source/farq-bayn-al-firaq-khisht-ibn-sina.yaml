label:
  ar: "البغدادي، الفرق بين الفرق وبيان الفرقة الناجية منهم ⁦(دراسة وتحقيق محمد عثمان الخشت، مكتبة ابن سينا، القاهرة)⁩"
  en: "al-Baghdadi, al-Farq bayn al-Firaq wa-Bayan al-Firqa al-Najiya minhum (study and edition by Muhammad Uthman al-Khisht, Maktabat Ibn Sina, Cairo)"
  ur: "بغدادی، الفرق بین الفرق و بیان الفرقۃ الناجیۃ منہم ⁦(دراسہ و تحقیق محمد عثمان الخشت، مکتبہ ابن سینا، قاہرہ)⁩"
summary:
  ar: "طبعة مكتبة ابن سينا للنشر والتوزيع ⁦(76 شارع محمد فريد، النزهة، مصر الجديدة، القاهرة)⁩ من «الفرق بين الفرق وبيان الفرقة الناجية منهم: عقائد الفرق الإسلامية وآراء كبار أعلامها» للأستاذ الإمام أبي منصور عبد القاهر بن طاهر بن محمد البغدادي ⁦(ت 429هـ/1037م)⁩، دراسة وتحقيق محمد عثمان الخشت؛ في أولها دراسة عن المؤلف والكتاب ومنهجه ومصادره والتأليف في العقائد قبله، ومنهج التحقيق، وفي الحواشي تراجم الأعلام."
  en: "The Maktabat Ibn Sina (76 Muhammad Farid Street, al-Nuzha, Heliopolis, Cairo) edition of al-Farq bayn al-Firaq wa-Bayan al-Firqa al-Najiya minhum - 'the creeds of the Islamic sects and the views of their great figures' - by Abu Mansur Abd al-Qahir ibn Tahir ibn Muhammad al-Baghdadi (d. 429 AH / 1037), studied and edited by Muhammad Uthman al-Khisht; it opens with a study of the author and the book, its method, its sources and earlier creed literature, and the editor's method, with notes identifying persons."
  ur: "مکتبہ ابن سینا ⁦(76 شارع محمد فرید، النزہہ، مصر الجدیدہ، قاہرہ)⁩ کا «الفرق بین الفرق و بیان الفرقۃ الناجیۃ منہم: اسلامی فرقوں کے عقائد اور ان کے بڑے اعلام کی آرا» کا ایڈیشن، از ابو منصور عبد القاہر بن طاہر بن محمد بغدادی ⁦(م 429ھ/1037ء)⁩، دراسہ و تحقیق محمد عثمان الخشت؛ آغاز میں مصنف اور کتاب، اس کے منہج، مصادر اور سابقہ عقائدی تصانیف پر دراسہ اور منہجِ تحقیق، اور حواشی میں اعلام کے تراجم۔"
