label:
  ar: "البغدادي، الفرق بين الفرق وبيان الفرقة الناجية منهم ⁦(دراسة وتحقيق محمد عثمان الخشت، مكتبة ابن سينا، القاهرة)⁩"
  en: "al-Baghdadi, al-Farq bayn al-Firaq wa-Bayan al-Firqa al-Najiya minhum (study and edition by Muhammad Uthman al-Khisht, Maktabat Ibn Sina, Cairo)"
  ur: "بغدادی، الفرق بین الفرق و بیان الفرقۃ الناجیۃ منہم ⁦(دراسہ و تحقیق محمد عثمان الخشت، مکتبہ ابن سینا، قاہرہ)⁩"
summary:
  ar: "طبعة مكتبة ابن سينا للنشر والتوزيع ⁦(76 شارع محمد فريد، النزهة، مصر الجديدة، القاهرة)⁩ من «الفرق بين الفرق وبيان الفرقة الناجية منهم: عقائد الفرق الإسلامية وآراء كبار أعلامها» للأستاذ الإمام أبي منصور عبد القاهر بن طاهر بن محمد البغدادي ⁦(ت 429هـ/1037م)⁩، دراسة وتحقيق محمد عثمان الخشت؛ في أولها دراسة عن المؤلف والكتاب ومنهجه ومصادره والتأليف في العقائد قبله، ومنهج التحقيق، وفي الحواشي تراجم الأعلام."
  en: "The Maktabat Ibn Sina (76 Muhammad Farid Street, al-Nuzha, Heliopolis, Cairo) edition of al-Farq bayn al-Firaq wa-Bayan al-Firqa al-Najiya minhum - 'the creeds of the Islamic sects and the views of their great figures' - by Abu Mansur Abd al-Qahir ibn Tahir ibn Muhammad al-Baghdadi (d. 429 AH / 1037), studied and edited by Muhammad Uthman al-Khisht; it opens with a study of the author and the book, its method, its sources and earlier creed literature, and the editor's method, with notes identifying persons."
  ur: "مکتبہ ابن سینا ⁦(76 شارع محمد فرید، النزہہ، مصر الجدیدہ، قاہرہ)⁩ کا «الفرق بین الفرق و بیان الفرقۃ الناجیۃ منہم: اسلامی فرقوں کے عقائد اور ان کے بڑے اعلام کی آرا» کا ایڈیشن، از ابو منصور عبد القاہر بن طاہر بن محمد بغدادی ⁦(م 429ھ/1037ء)⁩، دراسہ و تحقیق محمد عثمان الخشت؛ آغاز میں مصنف اور کتاب، اس کے منہج، مصادر اور سابقہ عقائدی تصانیف پر دراسہ اور منہجِ تحقیق، اور حواشی میں اعلام کے تراجم۔"
  es: "La edición de Maktabat Ibn Sina (calle Muhammad Farid 76, al-Nuzha, Heliópolis, El Cairo) de al-Farq bayn al-Firaq wa-Bayan al-Firqa al-Najiya minhum. 429 AH / 1037), estudiada y editada por Muhammad Uthman al-Khisht; comienza con un estudio del autor y del libro, su método, sus fuentes y la literatura creíble anterior, y el método del editor, con notas que identifican a las personas."
  fr: "L'édition Maktabat Ibn Sina (76 rue Muhammad Farid, al-Nuzha, Héliopolis, Le Caire) d'al-Farq bayn al-Firaq wa-Bayan al-Firqa al-Najiya minhum. 429 AH / 1037), étudiée et éditée par Muhammad Uthman al-Khisht; elle s'ouvre sur une étude de l'auteur et du livre, de sa méthode, de ses sources et de la littérature doctrinale antérieure, ainsi que de la méthode de l'éditeur, avec des notes identifiant les personnes."
  tr: "Profesör İmam Ebu Mansur Abd al-Qahir ibn Muhammed el-Bağdadi (ö. 429 Ah/1037 M.A.) tarafından yazılmış \"Al-Firaq Bayn al-Faqr wa Bayan al-Firaq al-Najiya Min Amin: İslami Tarikatların Öğretileri ve Onların Önde Gelen Figürlerinin Görüşleri\" adlı kitabından İbn Sina Yayın ve Dağıtım Kütüphanesi (76 Muhammad Farid Caddesi, Al-Nozha, Heliopolis, Kahire), Muhammed Osman el-Hoşt tarafından yapılan bir çalışma ve doğrulama; başlangıçta yazar, kitap, metodolojisi, kaynakları, önceki inançlar üzerine yazıları, doğrulama metodolojisi ve dipnotlarda önemli şahsiyetlerin biyografileri üzerine bir inceleme."
  id: "Edisi Perpustakaan Ibn Sina untuk Penerbitan dan Distribusi (76 Jalan Muhammad Farid, Al-Nozha, Heliopolis, Kairo) dari \"Al-Firaq Bayn al-Faqr wa Bayan al-Firaq al-Najiya Min Amin: Doktrin Sekte Islam dan Pendapat Tokoh-tokoh Terkemuka mereka\" oleh Profesor Imam Abu Mansur Abd al-Qahir ibn Tahir ibn Muhammad al-Baghdadi (wafat 429 H/1037 M), sebuah studi dan verifikasi oleh Muhammad Uthman al-Khosht; di awal, studi tentang penulis, buku, metodologinya, sumber-sumbernya, tulisannya tentang ajaran sebelumnya, metodologi verifikasi, dan dalam catatan kaki, biografi tokoh-tokoh terkemuka."
