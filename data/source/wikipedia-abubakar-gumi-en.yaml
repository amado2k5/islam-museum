reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 at the recorded revision, fetched by revision id via the MediaWiki API and the returned id asserted equal. The lead and infobox give his birth as 7 November 1924, while the article's own categories file him under 1922 births and the book it cites (Hunwick and O'Fahey, Arabic Literature of Africa, 1994) treats 1922; the record therefore marks the birth date debated between 5 November 1922 (Wikidata) and 7 November 1924. The article states in its text that 'Gumi is a follower of the Maliki school of thought', derived from his writings including his tafsir Radd al-azhan ila ma'ani al-Qur'an; its infobox gives religion Islam, denomination Sunni, jurisprudence Maliki and movement Salafism. It records his death on 11 September 1992 in London, his Grand Khadi tenure of 1962-1967, his conflicts with the Sufi brotherhoods, and his student's founding of the Izala society at his direction."
