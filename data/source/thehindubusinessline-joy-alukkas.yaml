summary:
  ar: "ملف ذا هندو بيزنيس لاين عن جوي ألوكاس: بدأ مساعدة والده في السادسة عشرة، وقاد التوسع الدولي للعائلة في أواخر الثمانينات، وفي تقاسم سنة 2001 تسلّم أعمال غرب آسيا؛ ويناقش حياته ومسيرته بتفصيل دون ذكر أي دين."
  en: "The Hindu BusinessLine profile of Joy Alukkas: he began assisting his father at sixteen, led the family's international expansion in the late 1980s, and in the 2001 family division took the West Asia business; it discusses his life and career in detail without mentioning any religion."
  es: "El perfil de Joy Alukkas publicado en The Hindu BusinessLine indica que comenzó a ayudar a su padre a los dieciséis años, lideró la expansión internacional de la familia a finales de la década de 1980 y, en la división familiar de 2001, se hizo cargo del negocio en Asia Occidental; el artículo analiza su vida y carrera en detalle sin mencionar ninguna religión."
  fr: "Le profil de Joy Alukkas publié par The Hindu BusinessLine: il a commencé à assister son père à seize ans, a dirigé l'expansion internationale de l'entreprise familiale à la fin des années 1980 et, lors de la scission familiale de 2001, a pris la direction des activités en Asie occidentale; l'article retrace sa vie et sa carrière en détail sans mentionner aucune religion."
  ur: "جوائے الوکاس کا ہندو بزنس لائن پروفائل: اس نے سولہ سال کی عمر میں اپنے والد کی مدد کرنا شروع کی، 1980 کی دہائی کے آخر میں خاندان کی بین الاقوامی توسیع کی قیادت کی، اور 2001 میں خاندانی تقسیم نے مغربی ایشیا کا کاروبار سنبھالا۔ اس میں کسی مذہب کا ذکر کیے بغیر ان کی زندگی اور کیریئر پر تفصیل سے بات کی گئی ہے۔"
  tr: "Joey Alukas hakkında Hindu Business Line dosyası: On altı yaşında babasına yardım etmeye başladı, 1980'lerin sonlarında ailenin uluslararası genişlemesine liderlik etti ve 2001'de Batı Asya operasyonlarını devraldı; hayatını ve kariyerini ayrıntılı olarak anlatıyor, herhangi bir dini belirtmeden."
  id: "Berkas The Hindu Business Line tentang Joey Alukas: Ia mulai membantu ayahnya pada usia enam belas tahun, memimpin ekspansi internasional keluarga pada akhir 1980-an, dan pada tahun 2001 mengambil alih operasi Asia Barat; ia membahas kehidupan dan kariernya secara rinci tanpa menyebutkan agama apa pun."
