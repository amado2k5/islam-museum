  ar: "مقالة ويكيبيديا العربية عن علي بن الحسين بن علي الهاشمي (1879 – 13 فبراير 1935)، ثاني وآخر ملوك المملكة الحجازية الهاشمية من 2 أكتوبر 1924 إلى 19 ديسمبر 1925؛ تسرد نسبه الكامل ونشأته في مكة وإسطنبول ودفاعه عن بقية مملكته وجدة والمدينة ثم مغادرته إلى الهند فالعراق ووفاته في بغداد ودفنه في المقبرة الملكية بالأعظمية، وما قيل في وصفه عند لورنس وكينينغتون."
  en: "Arabic Wikipedia article on Ali bin Hussein al-Hashimi (1879 – 13 February 1935), second and last King of the Hashemite Kingdom of Hejaz from 2 October 1924 to 19 December 1925; it gives his full lineage, his upbringing at Mecca and Istanbul, his defence of the remaining kingdom at Jeddah and Medina, his departure to India and then Iraq, his death at Baghdad and burial in the royal cemetery at Adhamiyah, and the portraits of him by Lawrence and Kennington."
