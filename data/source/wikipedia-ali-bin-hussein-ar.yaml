reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md). Read in full at revision 75513515 on 25 October 2026. It dates his reign from 2 October 1924, where the English article dates his father's abdication to 3 October 1924 — a one-day difference the prose states rather than merges. It gives his death at Baghdad on 13 February 1935 and his burial in the royal cemetery at Adhamiyah, and it names no religion and no school for him."
