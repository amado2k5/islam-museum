summary:
  ar: "مقالة ويكيبيديا العربية عن علي بن الحسين بن علي الهاشمي ⁦(1879 – 13 فبراير 1935)⁩، ثاني وآخر ملوك المملكة الحجازية الهاشمية من 2 أكتوبر 1924 إلى 19 ديسمبر 1925؛ تسرد نسبه الكامل ونشأته في مكة وإسطنبول ودفاعه عن بقية مملكته وجدة والمدينة ثم مغادرته إلى الهند فالعراق ووفاته في بغداد ودفنه في المقبرة الملكية بالأعظمية، وما قيل في وصفه عند لورنس وكينينغتون."
  en: "Arabic Wikipedia article on Ali bin Hussein al-Hashimi (1879 – 13 February 1935), second and last King of the Hashemite Kingdom of Hejaz from 2 October 1924 to 19 December 1925; it gives his full lineage, his upbringing at Mecca and Istanbul, his defence of the remaining kingdom at Jeddah and Medina, his departure to India and then Iraq, his death at Baghdad and burial in the royal cemetery at Adhamiyah, and the portraits of him by Lawrence and Kennington."
  es: "Artículo en árabe de la Wikipedia sobre Ali bin Hussein al-Hashimi (1879 – 13 de febrero de 1935), segundo y último rey del Reino Hachemita de Hiyaz desde el 2 de octubre de 1924 hasta el 19 de diciembre de 1925; en él se detalla su linaje completo, su crianza en La Meca y Estambul, su defensa del reino restante en Yeda y Medina, su partida a la India y luego a Irak, su muerte en Bagdad y su entierro en el cementerio real de Adhamiyah, y los retratos que Lawrence y Kennington le hicieron."
  fr: "Article de Wikipédia en arabe sur Ali bin Hussein al-Hashimi (1879 – 13 février 1935), deuxième et dernier roi du royaume hachémite du Hedjaz du 2 octobre 1924 au 19 décembre 1925; il donne sa lignée complète, son éducation à La Mecque et à Istanbul, sa défense du royaume restant à Djeddah et à Médine, son départ pour l'Inde puis l'Irak, sa mort à Bagdad et son enterrement dans le cimetière royal d'Adhamiyah, ainsi que les portraits de lui par Lawrence et Kennington."
  ur: "علی بن حسین الہاشمی ⁦(1879 - 13 فروری 1935)⁩ پر عربی ویکیپیڈیا مضمون، 2 اکتوبر 1924 سے 19 دسمبر 1925 تک حجاز کی ہاشمی بادشاہت کے دوسرے اور آخری بادشاہ؛ اس میں ان کا پورا سلسلہ نسب، مکہ اور استنبول میں اس کی پرورش، جدہ اور مدینہ میں اس کی بقیہ سلطنت کا دفاع، اس کی ہندوستان اور پھر عراق روانگی، بغداد میں اس کی موت اور ادھمیہ کے شاہی قبرستان میں تدفین، اور لارنس اور کیننگٹن کے ذریعہ ان کی تصویریں ملتی ہیں۔"
  tr: "Ali bin Al-Hüseyin bin Ali El-Haşimi (1879 – 13 Şubat 1935), 2 Ekim 1924'ten 19 Aralık 1925'e kadar Haşimi Hicazi Krallığı'nın ikinci ve son kralı olan Arapça Vikipedi makalesi; tam soyunu, Mekke ve İstanbul'daki yetiştirilme tarzını, krallığının geri kalanını, Cidde ve Medine'yi savunmasını, ardından Hindistan ve Irak'a ayrılışını, Bağdat'taki ölümünü, El-Adhamiye'deki Kraliyet Mezarlığı'na defnedilmesini ve Lawrence ile Kennington'ın tanımı hakkında söylediklerini listeler."
  id: "Artikel Wikipedia berbahasa Arab tentang Ali bin Al-Husayn bin Ali Al-Hashimi (1879 – 13 Februari 1935), raja kedua dan terakhir Kerajaan Hejazi Hashemite dari 2 Oktober 1924 hingga 19 Desember 1925; artikel ini mencantumkan garis keturunan lengkapnya, masa kecilnya di Mekah dan Istanbul, pembelaannya atas sisa kerajaannya, Jeddah, dan Madinah, kemudian kepergiannya ke India dan Irak, kematiannya di Baghdad, pemakamannya di Pemakaman Kerajaan di Al-Adhamiyah, serta apa yang telah dikatakan tentang deskripsinya oleh Lawrence dan Kennington."
