summary:
  ar: "بطاقة ويكي بيانات لأمان الله خان؛ معرّفات منظمة وتواريخ فقط. تحمل مولده في 1 يونيو 1892 في بغمان ووفاته في 25 أبريل 1960 في زيورخ ⁦(والمقالة الإنجليزية تعطي 26 أبريل)⁩، وتحمل للديانة قيمتين منظمتين: الإسلام والإسلام السني، وهما مع التصنيف العربي عائلة بنيوية واحدة."
  en: "Wikidata item for Amanullah Khan; structured identifiers and dates only. It carries his birth on 1 June 1892 at Paghman and his death on 25 April 1960 at Zurich (the English article gives 26 April), and carries two structured religion values, Islam and Sunni Islam, which with the Arabic category filing form a single structured family."
  es: "Entrada de Wikidata para Amanullah Khan; solo identificadores estructurados y fechas. Indica su nacimiento el 1 de junio de 1892 en Paghman y su muerte el 25 de abril de 1960 en Zúrich (el artículo en inglés indica el 26 de abril), y contiene dos valores religiosos estructurados, Islam e Islam sunita, que junto con la categoría árabe forman una única familia estructurada."
  fr: "L'article Wikidata concernant Amanullah Khan ne contient que des identifiants structurés et des dates. Il indique sa naissance le 1er juin 1892 à Paghman et son décès le 25 avril 1960 à Zurich (l'article en anglais mentionne le 26 avril), ainsi que deux valeurs structurées pour la religion: « Islam » et « Islam sunnite », qui, avec la catégorie arabe, forment une seule famille structurée."
  ur: "امان اللہ خان کے لیے وکی ڈیٹا آئٹم؛ صرف ساختی شناخت کنندگان اور تاریخیں۔ اس میں ان کی پیدائش 1 جون 1892 کو پغمان میں ہوئی اور اس کی موت 25 اپریل 1960 کو زیورخ میں ہوئی ⁦(انگریزی آرٹیکل 26 اپریل کو بتاتا ہے)⁩، اور اس میں دو ساختی مذہبی اقدار ہیں، اسلام اور سنی اسلام، جو عربی زمرہ کے دائرے کے ساتھ ایک واحد ساختہ خاندان کی تشکیل کرتی ہے۔"
