reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. Its lead names him 'a Sudanese religious and political leader. The late leader of the Khatmiyya, a sufi order known in Egypt, Sudan and Eritrea' — one of the two independent attestations of his headship of the Sufi order on which the record's sufi segment rests. It gives: born at Masawa in northern Sudan in 1873 into the Maraghna family founded by his grandfather Muhammad Uthman al-Mirghani al-Khatim; moved with his father to Kassala in 1881; studied fiqh under his uncle Muhammad Uthman Taj al-Sir at Suakin; his father died in Cairo on 15 January 1886; five years in Cairo visiting al-Azhar without a degree; returned to Sudan, settling at Khartoum in 1901, headquarters at Khartoum Bahri; knighted 1916 (CMG 1900, KCMG 1916, KCVO 1919); on his brother Ahmed's death in 1928 became religious and political leader of the family, rivalling Abd al-Rahman al-Mahdi's Ansar; supported the government through the First World War, the Darfur campaign of 1916 and the Arab Revolt; promoted 'Unity of the Nile Valley', leading to the Ashiqqa party (1943) and the National Unionist Party (1952); the June 1956 split founded the People's Democratic Party under his leadership; died of kidney disease after surgery on 21 February 1968 at Hillat Khojali, Khartoum Bahri, succeeded by his son Mohamed Osman al-Mirghani. It names no madhhab for him."
