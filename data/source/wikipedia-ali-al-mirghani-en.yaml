  ar: "مقالة ويكيبيديا الإنجليزية عن السيد علي الميرغني (1873-1968)، زعيم الطريقة الختمية الصوفية في السودان؛ تُستخدم لوقائع الكيان فقط. توثّق نشأته في مصوع وكسلا ودراسته في القاهرة وقيادته للأسرة والطريقة منذ 1928 ووفاته في حلة خوجلي بالخرطوم بحري في 21 فبراير 1968."
  en: "English Wikipedia article on Sayyid Ali al-Mirghani (1873–1968), leader of the Khatmiyya Sufi order in Sudan; used for entity facts only. It records his upbringing at Massawa and Kassala, his Cairo years, his leadership of the family and the order from 1928, and his death at Hillat Khojali, Khartoum Bahri, on 21 February 1968."
