reliability_note: "An independent article, not a translation of the English one. Read on 27 October 2026 at the recorded revision. It gives him born 28 February 1928 at Bantva (Bantva Manavadar, British Raj) and died 8 July 2016 at Karachi, resting place Karachi; its infobox gives his ethnicity as Bantva Memon and his spouse as Bilquis Edhi and a son, Faisal Edhi. On religion its text notes that he never studied at any religious school and disliked religious honorifics — a formation fact — and names no school or affiliation for him."
