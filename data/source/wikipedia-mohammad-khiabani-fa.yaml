summary:
  ar: "مقالة ويكيبيديا الفارسية «محمد خياباني»؛ تُستخدم لوقائع الكيان فقط. تعطي نسبه إلى عبد الحميد التاجر الخامنه‌إي، ودراسته الفقه والأصول حتى قرب مرحلة الاجتهاد وكان روحاني مسجد تبريز الجامع، وقيامه من 17 فروردين 1299 شمسية وقيام دولته في أذربيجان باسم «آزاديستان»، وقتله يوم الاثنين 22 شهريور 1299 الموافق 29 ذي الحجة 1338."
  en: "Persian Wikipedia article 'Mohammad Khiabani'; used for entity facts only. It gives him as the son of Abdolhamid, a merchant of Khameneh, his study of jurisprudence and its principles to near the level of ijtihad, his service as cleric of Tabriz's Jameh mosque, his uprising from 7 April 1920 and his Azadistan government in Azerbaijan, and his killing on Monday 22 Shahrivar 1299, corresponding to 29 Dhu'l-Hijja 1338."
