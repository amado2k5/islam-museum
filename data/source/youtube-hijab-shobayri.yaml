summary:
  ar: "تسجيل على يوتيوب لمناظرة محمد حجاب والسيد علي الشوبيري كما اطُّلع عليه في 17 نوفمبر 2026؛ يوثّق المناظرة المطوّلة في حفظ القرآن ومقام الصحابة وعقيدة الإمامة."
  en: "A YouTube recording of the Muhammad Hijab–Sayed Ali al-Shobayri debate as consulted on 17 November 2026; it documents the long-form exchange on Qur'anic preservation, the Companions and the Imamate."
  es: "Grabación de YouTube del debate entre Muhammad Hijab y Sayed Ali al-Shobayri, realizado el 17 de noviembre de 2026; documenta el extenso intercambio sobre la preservación del Corán, los Compañeros y el Imamato."
  fr: "Un enregistrement YouTube du débat entre Muhammad Hijab et Sayed Ali al-Shobayri, consulté le 17 novembre 2026; il documente l'échange approfondi sur la préservation du Coran, les Compagnons et l'Imamat."
  ur: "17 نومبر 2026 کو مشورے کے مطابق محمد حجاب-سید علی الشوبائری کی یوٹیوب کی ریکارڈنگ؛ یہ قرآن کے تحفظ، صحابہ اور امامت پر طویل فارم کے تبادلے کو دستاویز کرتا ہے۔"
  tr: "17 Kasım 2026'da izlenen Muhammed Hicab ile Bay Ali Al-Shoubairi arasındaki tartışmanın YouTube kaydı; Kur'an ezberi, Sahabelerin statüsü ve İmamat doktrini üzerine uzun süren tartışmayı belgeliyor."
  id: "Rekaman YouTube perdebatan antara Mohammed Hijab dan Bapak Ali Al-Shoubairi, yang ditonton pada 17 November 2026; mendokumentasikan perdebatan panjang tentang hafalan Al-Quran, status Para Sahabat, dan doktrin Imamate."
