summary:
  ar: "مقالة ويكيبيديا الروسية عن ديني أرسانوف؛ تُستخدم لوقائع الكيان فقط. تسمّيه مقدمتها مؤسس أحد أكبر الوِرد الويناخية المنتمية إلى التيار النقشبندي في الإسلام الصوفي، ويذكر متنها مولده سنة 1851 في زبير يورت ومقتله في 27 ديسمبر 1917 في غروزني، مصححًا تأريخًا خاطئًا بسنة 1918."
  en: "Russian Wikipedia article on Deni Arsanov; used for entity facts only. Its lead names him founder of one of the largest Vainakh virds belonging to the Naqshbandi current of Sufi Islam, and its text gives his birth in 1851 at Zebir-Yurt and his killing on 27 December 1917 at Grozny, expressly correcting a 1918 dating in the literature."
  es: "Artículo de la Wikipedia rusa sobre Deni Arsanov; utilizado únicamente para datos sobre la persona. Su introducción lo identifica como fundador de uno de los mayores grupos religiosos Vainakh pertenecientes a la corriente Naqshbandi del islam sufí, y su texto indica que nació en 1851 en Zebir-Yurt y que fue asesinado el 27 de diciembre de 1917 en Grozny, corrigiendo expresamente una fecha de 1918 que aparecía en la bibliografía."
  fr: "Article de Wikipédia en russe sur Deni Arsanov; utilisé uniquement pour les informations sur l’entité. Son introduction le présente comme le fondateur de l’un des plus importants virds Vainakh appartenant au courant Naqshbandi de l’islam soufi, et son texte indique sa naissance en 1851 à Zebir-Yurt et sa mort le 27 décembre 1917 à Grozny, corrigeant expressément une datation de 1918 présente dans la littérature."
