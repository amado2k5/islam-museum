summary:
  ar: "مقالة ويكيبيديا التركية عن نعمان چلبى جهان؛ تُستخدم لوقائع الكيان فقط. تعطي مولده سنة 1885 في سوناك ووفاته سنة 1918 غرقا مقيدا بعد إعدامه، ونشاطه في جمعية وطن ومشاركته في تأسيس الحزب الوطني التتري؛ ولا تذكر له مذهبا."
  en: "Turkish Wikipedia article on Numan Çelebicihan; used for entity facts only. It gives his birth in 1885 at Sunak and his death in 1918, weighted and drowned after his execution, his activity in the Vatan society and his part in founding the Crimean Tatar national party; it names no school for him."
  es: "Artículo de la Wikipedia en turco sobre Numan Çelebicihan; utilizado únicamente para datos sobre la persona. Indica su nacimiento en 1885 en Sunak y su muerte en 1918, cuando fue ejecutado y ahogado tras ser sometido a un linchamiento, su actividad en la sociedad Vatan y su participación en la fundación del partido nacional tártaro de Crimea; no menciona ninguna escuela a la que haya asistido."
  fr: "Article de Wikipédia en turc sur Numan Çelebicihan; utilisé uniquement pour les informations le concernant. Il indique sa naissance en 1885 à Sunak et sa mort en 1918, lesté et noyé après son exécution, son activité au sein de la société Vatan et son rôle dans la fondation du parti national tatar de Crimée; il ne mentionne aucune école à son nom."
  ur: "ترکی ویکیپیڈیا مضمون نعمان سلیبیسیہان پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ سنک میں 1885 میں اس کی پیدائش اور 1918 میں اس کی موت، اس کی پھانسی کے بعد وزن اور ڈوب گیا، وطن معاشرے میں اس کی سرگرمی اور کریمین تاتار قومی پارٹی کی بنیاد رکھنے میں اس کا حصہ؛ اس کے لیے کسی اسکول کا نام نہیں ہے۔"
