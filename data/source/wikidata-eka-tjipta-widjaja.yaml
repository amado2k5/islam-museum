summary:
  ar: "عنصر ويكي بيانات Q1322162 عن إيكا تجيبتا ويدجاجا: يذكر وفاته في 26 كانون الثاني 2019 ومسقط رأسه تشيوانتشو ومكان وفاته جاكرتا، ويحمل بيانَي مولد متنافسين ⁦(3 تشرين الأول 1923 و3 تشرين الأول 1922)⁩، ولا يحمل أي بيان دين."
  en: "Wikidata item Q1322162 for Eka Tjipta Widjaja; it gives his death on 26 January 2019, his birthplace as Quanzhou and his place of death as Jakarta, carries two rival birth statements (3 October 1923 and 3 October 1922), and has no religion statement at all."
  es: "El elemento de Wikidata Q1322162 corresponde a Eka Tjipta Widjaja; indica que falleció el 26 de enero de 2019, que nació en Quanzhou y falleció en Yakarta, contiene dos declaraciones de nacimiento contradictorias (3 de octubre de 1923 y 3 de octubre de 1922) y no incluye ninguna declaración sobre su religión."
  fr: "L'élément Wikidata Q1322162 pour Eka Tjipta Widjaja; il indique son décès le 26 janvier 2019, son lieu de naissance comme étant Quanzhou et son lieu de décès comme étant Jakarta, comporte deux déclarations de naissance concurrentes (3 octobre 1923 et 3 octobre 1922), et ne contient aucune déclaration religieuse."
  ur: "وکی ڈیٹا آئٹم Q1322162 Eka Tjipta Widjaja کے لیے؛ یہ ان کی موت 26 جنوری 2019 کو دیتا ہے، اس کی جائے پیدائش کوانزو اور اس کی موت کی جگہ جکارتہ، دو حریف پیدائشی بیانات ⁦(3 اکتوبر 1923 اور 3 اکتوبر 1922)⁩ رکھتی ہے، اور اس کا کوئی مذہب بیان نہیں ہے۔"
  tr: "Ika Tjibeta Widjaja hakkında Wikidata maddesi Q1322162: 26 Ocak 2019'da öldüğünü belirtir, memleketi Chiwanchu, ölüm yeri Jakarta, iki yarışmacının doğum beyanı (3 Ekim 1923 ve 3 Ekim 1922) yer alır ve herhangi bir dini açıklama içermez."
  id: "Item Wikidata Q1322162 tentang Ika Tjibeta Widjaja: menyebutkan kematiannya pada 26 Januari 2019, kampung halamannya Chiwanchu, dan tempat kematiannya di Jakarta, serta memuat pernyataan kelahiran dua peserta (3 Oktober 1923 dan 3 Oktober 1922), dan tidak memuat pernyataan agama apapun."
