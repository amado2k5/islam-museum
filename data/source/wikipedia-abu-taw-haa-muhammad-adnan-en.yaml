reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026): a fact is used only where the article cites a source for it. Read in full on 5 November 2026. The body gives his 1991 birth in Rangpur, his schooling (Lions School and College, Rangpur; bachelor's and master's in philosophy at Carmichael College), his religious instruction at Jamia Salafia Madrasah in Rangpur, his YouTube start (lectures from 2017, first video 2019), his 2018 Alokito Gyani first place, his online madrasa, and the June 2021 disappearance and its police resolution, each footnoted to Bangladeshi press (Jugantor, Somoy TV, Prothom Alo, BBC News Bengali, Dhaka Tribune and others). The infobox's denomination and jurisprudence entries (Sunni / Hanafi) are structured data and were not used to settle faith; the Bengali article's infobox files him differently (Ahl-e-Hadith), and the two structured filings disagree. The revision-id endpoint was not reachable in this session, so no revision id is recorded; the access date stands in its place."
