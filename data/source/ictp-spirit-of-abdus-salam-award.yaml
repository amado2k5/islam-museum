label: { en: "Spirit of Abdus Salam Award — ICTP" }
summary:
  ar: "صفحة المركز الدولي للفيزياء النظرية (ICTP) عن جائزة روح عبد السلام، وتسجل اقتراحه تأسيس المركز سنة 1960 وافتتاحه سنة 1964 مديرا له، وأنه أول باكستاني وأول عالم من بلد إسلامي ينال جائزة نوبل في العلوم."
  en: "ICTP page for the Spirit of Abdus Salam Award, recording that Salam proposed the centre in 1960, that it opened in 1964 with him as director, and that he was the first Pakistani and the first from an Islamic country to receive a Nobel Prize in science."
  es: "Página del ICTP dedicada al Premio Espíritu de Abdus Salam, donde se recoge que Salam propuso la creación del centro en 1960, que se inauguró en 1964 con él como director, y que fue el primer pakistaní y el primero de un país islámico en recibir un Premio Nobel de ciencias."
  fr: "Page de l'ICTP consacrée au prix « Esprit d'Abdus Salam », indiquant que Salam a proposé la création du centre en 1960, qu'il a ouvert ses portes en 1964 sous sa direction, et qu'il a été le premier Pakistanais et le premier ressortissant d'un pays islamique à recevoir un prix Nobel de sciences."
  ur: "اسپرٹ آف عبدالسلام ایوارڈ کے لیے ICTP صفحہ، ریکارڈنگ میں کہ سلام نے سنٹر کے لیے 1960 میں تجویز پیش کی، کہ یہ 1964 میں ان کے ساتھ بطور ڈائریکٹر کھولا، اور یہ کہ وہ سائنس میں نوبل انعام حاصل کرنے والے پہلے پاکستانی اور اسلامی ملک سے پہلے شخص تھے۔"
  tr: "Uluslararası Teorik Fizik Merkezi (ICTP) sayfası, 1960'ta merkezin kurulması önerisini ve 1964'te direktör olarak açılışını kaydeder; ayrıca Nobel Bilim Ödülü'nü alan ilk Pakistanlı ve İslam ülkesinden ilk bilim insanı olduğunu belirtir."
  id: "Halaman International Centre for Theoretical Physics (ICTP) tentang Penghargaan Ruh Abdus Salam, yang mencatat usulannya untuk mendirikan pusat tersebut pada tahun 1960 dan pembukaannya pada tahun 1964 sebagai direkturnya, serta bahwa ia adalah orang Pakistan pertama dan ilmuwan pertama dari negara Islam yang menerima Hadiah Nobel Ilmu Pengetahuan."
title: "Spirit of Abdus Salam Award"
