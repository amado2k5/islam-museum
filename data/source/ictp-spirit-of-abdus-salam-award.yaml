reliability_note: "The institution Salam founded describes its own founding on its official site: his 1960 proposal at the IAEA's Fourth General Conference, the 1963 agreement with the Italian Government, and the centre's opening in 1964 with Salam as director. Also used for the 1979 Nobel Prize in Physics shared with Glashow and Weinberg. Read as opened on 26 Oct 2026."
