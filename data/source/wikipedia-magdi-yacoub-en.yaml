summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن السير مجدي يعقوب ⁦(ولد 16 تشرين الثاني 1935 في بلبيس)⁩، أستاذ جراحة القلب والصدر المصري البريطاني؛ تستهل بوصفه «قبطيًا» في صلب تعريفها به، وتذكر نشأته في أسرة مسيحية قبطية، وتأسيسه مركز زراعة القلب في مستشفى هيرفيلد سنة 1980 ومؤسسته الخيرية «سلسلة الأمل»."
  en: "English Wikipedia article on Sir Magdi Yacoub (born 16 November 1935 in Bilbeis), the Egyptian-British professor of cardiothoracic surgery; its lead names him 'a Coptic Egyptian-British' professor in its own voice, its early-life section records his birth to a Coptic Christian family, and it covers his founding of the heart transplantation centre at Harefield Hospital in 1980 and his Chain of Hope charity."
  es: "Artículo de la Wikipedia en inglés sobre Sir Magdi Yacoub (nacido el 16 de noviembre de 1935 en Bilbeis), profesor egipcio-británico de cirugía cardiotorácica; en su introducción lo describe como \"un profesor copto egipcio-británico\", en la sección sobre su juventud se registra su nacimiento en una familia cristiana copta, y se aborda la fundación del centro de trasplantes de corazón en el Hospital Harefield en 1980 y su organización benéfica Chain of Hope."
  fr: "L'article de Wikipédia en anglais sur Sir Magdi Yacoub (né le 16 novembre 1935 à Bilbeis), professeur égypto-britannique de chirurgie cardiothoracique; son introduction le qualifie de « professeur copte égypto-britannique », la section consacrée à sa jeunesse relate sa naissance dans une famille chrétienne copte, et elle aborde la fondation du centre de transplantation cardiaque de l'hôpital Harefield en 1980 et son œuvre caritative Chain of Hope."
  ur: "انگریزی ویکیپیڈیا مضمون سر ماگدی یعقوب ⁦(پیدائش 16 نومبر 1935 بلبیس میں)⁩، مصری-برطانوی پروفیسر کارڈیوتھوراسک سرجری؛ اس کا لیڈ اسے اپنی آواز میں 'ایک قبطی مصری-برطانوی' پروفیسر کا نام دیتا ہے، اس کا ابتدائی زندگی کا حصہ ایک قبطی عیسائی خاندان میں اس کی پیدائش کو ریکارڈ کرتا ہے، اور اس میں 1980 میں ہیرفیلڈ ہسپتال میں دل کی پیوند کاری کے مرکز کی بنیاد اور اس کے چیئر آف ہوپ چیریٹی کا احاطہ کیا گیا ہے۔"
