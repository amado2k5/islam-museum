reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md), read in full on 1 November 2026 at the recorded revision, fetched via the MediaWiki API. Points drawn from it: the lead dates 3 July 1912 – 30 May 1982; madrasa schooling in Foča and Sarajevo and the Sharia Judicial School (1928–1933); al-Azhar Sharia Law School, graduated 1939; signing of the El-Hidaje resolution against Ustasha policy; service as imam of the 28th regiment of the 13th Handžar Division and his letter to Himmler; the post-war sentence of five years' imprisonment and loss of civil rights; employment 1950–1960 and then in the Supreme Islamic Eldership until his death; part-time professor at Gazi Husrev-beg Madrasa in the 1960s and early 1970s; president of the Ilmija (Ulema) Association from 1964; editor-in-chief of Preporod 1970–1972 and 1976–1979; full professor of Qur'anic interpretation from 1977; the Glasnik Questions and Answers column (Đozo's fatwas); death at Sarajevo on 30 May 1982 and burial in the Bare cemetery; complete rehabilitation by the Islamic Community's Supreme Assembly on 6 October 1990. The article names no legal school for Đozo himself; his Bosnian Hanafi milieu is context, not attestation, and is not used as one."
