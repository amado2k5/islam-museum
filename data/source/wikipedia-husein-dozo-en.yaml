summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حسين دوزو؛ تُستخدم لوقائع الكيان فقط. توثّق ولادته في 3 يوليو 1912 ووفاته في سراييفو في 30 مايو 1982، ودراسته في مدارس سراييفو ثم في كلية الشريعة بالأزهر (تخرّج 1939)، وخدمته إمامًا في فرقة هاندجار خلال الحرب، وسجنه بعدها خمس سنوات، وعمله في المؤسسات الإسلامية اليوغوسلافية، وتدريسه في مدرسة غازي خسرو بك، ورئاسته جمعية العلماء، وتأسيسه صحيفة «بريپورود»، وأستاذيته لتفسير القرآن في كلية الدراسات الإسلامية منذ 1977، وإعادة اعتباره رسميًا سنة 1990."
  en: "English Wikipedia article on Husein Đozo; used for entity facts only. It records his birth on 3 July 1912 and his death at Sarajevo on 30 May 1982, his schooling in Sarajevo and at al-Azhar's Sharia Law School (graduated 1939), his wartime service as an imam in the Handžar Division and the five-year prison sentence that followed, his work in Yugoslav Islamic institutions, his teaching at the Gazi Husrev-beg Madrasa, his presidency of the Ulema Association, his founding of the newspaper Preporod, his professorship of Qur'anic interpretation at the Islamic Theological Faculty from 1977, and his official rehabilitation in 1990."
