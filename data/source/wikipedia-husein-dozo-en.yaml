summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن حسين دوزو؛ تُستخدم لوقائع الكيان فقط. توثّق ولادته في 3 يوليو 1912 ووفاته في سراييفو في 30 مايو 1982، ودراسته في مدارس سراييفو ثم في كلية الشريعة بالأزهر ⁦(تخرّج 1939)⁩، وخدمته إمامًا في فرقة هاندجار خلال الحرب، وسجنه بعدها خمس سنوات، وعمله في المؤسسات الإسلامية اليوغوسلافية، وتدريسه في مدرسة غازي خسرو بك، ورئاسته جمعية العلماء، وتأسيسه صحيفة «بريپورود»، وأستاذيته لتفسير القرآن في كلية الدراسات الإسلامية منذ 1977، وإعادة اعتباره رسميًا سنة 1990."
  en: "English Wikipedia article on Husein Đozo; used for entity facts only. It records his birth on 3 July 1912 and his death at Sarajevo on 30 May 1982, his schooling in Sarajevo and at al-Azhar's Sharia Law School (graduated 1939), his wartime service as an imam in the Handžar Division and the five-year prison sentence that followed, his work in Yugoslav Islamic institutions, his teaching at the Gazi Husrev-beg Madrasa, his presidency of the Ulema Association, his founding of the newspaper Preporod, his professorship of Qur'anic interpretation at the Islamic Theological Faculty from 1977, and his official rehabilitation in 1990."
  es: "Artículo de la Wikipedia en inglés sobre Husein Đozo; utilizado únicamente para datos sobre la persona. En él se registra su nacimiento el 3 de julio de 1912 y su fallecimiento en Sarajevo el 30 de mayo de 1982, su formación académica en Sarajevo y en la Escuela de Derecho Islámico de Al-Azhar (se graduó en 1939), su servicio durante la guerra como imán en la División de Handžar y la condena de cinco años de prisión que le siguió, su trabajo en instituciones islámicas yugoslavas, su docencia en la madrasa Gazi Husrev-beg, su presidencia de la Asociación de Ulemas, la fundación del periódico Preporod, su cátedra de interpretación coránica en la Facultad de Teología Islámica desde 1977 y su rehabilitación oficial en 1990."
  fr: "Article de Wikipédia en anglais sur Husein Đozo; utilisé uniquement pour les informations biographiques. Il relate sa naissance le 3 juillet 1912 et sa mort à Sarajevo le 30 mai 1982, ses études à Sarajevo et à l’école de droit islamique d’al-Azhar (diplômé en 1939), son service pendant la guerre comme imam dans la division Handžar et sa peine de cinq ans de prison, son travail dans les institutions islamiques yougoslaves, son enseignement à la madrasa Gazi Husrev-beg, sa présidence de l’Association des oulémas, la fondation du journal Preporod, sa chaire d’interprétation coranique à la faculté de théologie islamique à partir de 1977 et sa réhabilitation officielle en 1990."
  ur: "حسین ڈوزو پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 3 جولائی 1912 کو ان کی پیدائش اور 30 مئی 1982 کو سراجیوو میں ان کی موت، سراجیوو میں ان کی اسکولنگ اور الازہر کے شریعہ لاء اسکول میں ⁦(1939 میں فارغ التحصیل)⁩، ہینڈزر ڈویژن میں امام کے طور پر جنگ کے وقت کی خدمات اور اس کے بعد پانچ سال کی قید کی سزا، یوگوسلاو میں ان کا کام، یوگوسلاو میں اسلامی تعلیم دینے والے ادارے میں ان کا کام درج ہے۔ مدرسہ، علماء ایسوسی ایشن کی ان کی صدارت، اخبار پریپورڈ کی ان کی بانی، 1977 سے اسلامی تھیولوجیکل فیکلٹی میں ان کی قرآنی تفسیر کی پروفیسری، اور 1990 میں ان کی سرکاری بحالی۔"
