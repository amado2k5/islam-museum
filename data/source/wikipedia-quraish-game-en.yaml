  ar: "مقالة ويكيبيديا الإنجليزية عن لعبة «قريش» (2005)، المراجعة 1360806946 ⁦(23 يونيو 2026)⁩؛ لوقائع الكيان فقط: لعبة استراتيجية في الزمن الحقيقي ثلاثية الأبعاد من إنتاج أفكار ميديا السورية ونشر دار الفكر، صدرت في 2 أغسطس 2005، عن حروب العرب قبل الإسلام وحروب الردة وفتوحات الخلافة الراشدة."
  en: "English Wikipedia article on the game Quraish (2005), revision 1360806946 (23 June 2026); entity facts only: a 3D real-time strategy game by the Syrian studio Afkar Media, published by Dar al-Fikr, released on 2 August 2005, on the pre-Islamic tribal wars, the Ridda wars and the campaigns of the Rashidun Caliphate."
