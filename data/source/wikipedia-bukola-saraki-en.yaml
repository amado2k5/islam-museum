reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision, fetched by revision id through the MediaWiki API. It gives Saraki as Abubakar Bukola Saraki, birth name Olubukola Abubakar Saraki, born on 19 December 1962 in London to Olusola Saraki and Florence Morenike Saraki, educated at King's College, Lagos, Cheltenham College and the London Hospital Medical College (MBBS 1987), a medical officer at Rush Green Hospital (1988–1989) and a director of Société Générale Bank (Nigeria) (1990–2000) before politics; governor of Kwara State 2003–2011, senator for Kwara Central 2011–2019 and President of the Senate 2015–2019. It makes no statement of his religion anywhere in its text; its categories file him under 'Nigerian Muslims', which is a filing, not an attestation."
