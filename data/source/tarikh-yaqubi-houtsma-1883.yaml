label:
  ar: "تاريخ اليعقوبي — أحمد بن أبي يعقوب بن واضح الكاتب (تحقيق م. ث. هوتسما، ليدن: بريل 1883)"
  en: "Tarikh al-Ya'qubi — Ahmad ibn Abi Ya'qub ibn Wadih al-Katib (ed. M. Th. Houtsma, Leiden: Brill, 1883)"
  ur: "تاریخ الیعقوبی — احمد بن ابی یعقوب بن واضح الکاتب (تحقیق م۔ ث۔ ہوتسما، لائیڈن: بریل 1883)"
summary:
  ar: "طبعة هوتسما لتاريخ اليعقوبي في جزأين، صدرت عن مطبعة بريل في ليدن سنة 1883: الجزء الأول في أخبار الأمم الأولى، والجزء الثاني في التاريخ الإسلامي من مولد النبي إلى حوادث سنة 258هـ، حيث ينتهي «الموجود من تاريخ ابن واضح» بنص الناسخ. {cite:tarikh-yaqubi-houtsma-1883 vol. 2 p. 625}"
  en: "Houtsma's edition of al-Ya'qubi's history in two volumes, printed by Brill at Leiden in 1883: the first on the early nations, the second on Islamic history from the Prophet's birth to the events of 258 AH, where, in the copyist's words, \"what survives of the history of Ibn Wadih\" ends. {cite:tarikh-yaqubi-houtsma-1883 vol. 2 p. 625}"
  ur: "ہوتسما کی تحقیق سے تاریخ الیعقوبی دو جلدوں میں، جو 1883 میں لائیڈن میں بریل کے مطبع سے شائع ہوئی: پہلی جلد قدیم قوموں کے حالات پر، اور دوسری نبی کی ولادت سے 258ھ کے واقعات تک اسلامی تاریخ پر، جہاں ناسخ کے الفاظ میں «ابن واضح کی تاریخ کا موجود حصہ» ختم ہوتا ہے۔ {cite:tarikh-yaqubi-houtsma-1883 vol. 2 p. 625}"
