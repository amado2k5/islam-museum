summary:
  ar: "صفحة فعالية TEDxBethnal Green Road على موقع TED، تدرج عالية أم ريان بين متحدثيها بصفتها «مؤلفة منشورة لدى بنغوين، مؤلفة من أكثر كتب صنداي تايمز مبيعا، مؤسسة جمعية سولاس يو كي ومديرتها التنفيذية»، مع سيرتها المنشورة نفسها."
  en: "The TEDxBethnal Green Road event page on ted.com, listing Aliyah Umm Raiyaan among its speakers as 'Penguin published, Sunday Times Bestselling Author, Founder and CEO of Registered Charity Solace UK', with her standard published biography."
  es: "La página del evento TEDxBethnal Green Road en ted.com incluye a Aliyah Umm Raiyaan entre sus ponentes como \"Autora superventas del Sunday Times, publicada por Penguin, fundadora y directora ejecutiva de la organización benéfica registrada Solace UK\", con su biografía publicada."
  fr: "La page de l'événement TEDxBethnal Green Road sur ted.com mentionne Aliyah Umm Raiyaan parmi ses intervenants en la qualifiant d'« auteure publiée chez Penguin, auteure à succès du Sunday Times, fondatrice et PDG de l'association caritative enregistrée Solace UK », avec sa biographie publiée habituelle."
  ur: "ted.com پر TEDxBethnal Green Road ایونٹ کا صفحہ، عالیہ ام ریان کو اس کے مقررین میں 'Penguin شائع، سنڈے ٹائمز کی بیسٹ سیلنگ مصنف، رجسٹرڈ چیریٹی سولیس UK کے بانی اور سی ای او' کے طور پر، اس کی معیاری شائع شدہ سوانح عمری کے ساتھ درج کرتا ہے۔"
