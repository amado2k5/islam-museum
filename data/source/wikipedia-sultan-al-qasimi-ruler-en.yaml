summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن الشيخ سلطان بن محمد القاسمي، حاكم الشارقة منذ 25 يناير 1972: مولده في 2 يوليو 1939، ودراسته في القاهرة وإكستر ودرم، ووزارته الأولى للتربية (1971)، وترميمه حصن الشارقة (1970)، ورئاسته الجامعة الأمريكية وجامعة الشارقة، ومؤلفاته ⁦(82 كتابًا حتى 2023)⁩، والأوسمة."
  en: "English Wikipedia article on Sheikh Sultan bin Muhammad Al-Qasimi, Ruler of Sharjah since 25 January 1972: birth on 2 July 1939, study in Cairo, Exeter and Durham, first UAE Minister of Education (1971), restoration of Al Hisn Fort (1970), presidency of the American University of Sharjah and the University of Sharjah, writings (82 books by 2023), and honours."
  es: "Artículo de la Wikipedia en inglés sobre el jeque Sultan bin Muhammad Al-Qasimi, gobernante de Sharjah desde el 25 de enero de 1972: nacimiento el 2 de julio de 1939, estudios en El Cairo, Exeter y Durham, primer ministro de Educación de los EAU (1971), restauración del fuerte Al Hisn (1970), presidencia de la Universidad Americana de Sharjah y de la Universidad de Sharjah, obras (82 libros hasta 2023) y honores."
  fr: "Article de Wikipédia en anglais sur Cheikh Sultan bin Muhammad Al-Qasimi, souverain de Sharjah depuis le 25 janvier 1972: naissance le 2 juillet 1939, études au Caire, à Exeter et à Durham, premier ministre de l’Éducation des Émirats arabes unis (1971), restauration du fort Al Hisn (1970), présidence de l’Université américaine de Sharjah et de l’Université de Sharjah, écrits (82 livres en 2023) et distinctions."
  ur: "25 جنوری 1972 سے شارجہ کے حکمران شیخ سلطان بن محمد القاسمی پر انگریزی ویکیپیڈیا کا مضمون: پیدائش 2 جولائی 1939، قاہرہ، ایکسیٹر اور ڈرہم میں تعلیم، متحدہ عرب امارات کے پہلے وزیر تعلیم (1971)، الحسن فورٹ کی بحالی (1970)، شارجہ یونیورسٹی کی صدارت اور شارجہ کی کتابیں لکھنا۔ 2023 تک) اور اعزازات۔"
  tr: "25 Ocak 1972'den beri Sharjah hükümdarı olan Şeyh Sultan bin Muhammed Al Kasimi hakkında İngilizce Wikipedia makalesi: 2 Temmuz 1939 doğumlu, Kahire, Exeter ve Durham'da eğitim gördü, ilk Eğitim Bakanlığı (1971), Sharjah Kalesi'ni restore etti (1970), Amerikan Üniversitesi ve Sharjah Üniversitesi başkanlığını yaptı, 2023 yılına kadar 82 kitap yazdı ve onur aldı."
  id: "Artikel Wikipedia bahasa Inggris tentang Sheikh Sultan bin Muhammad Al Qasimi, Penguasa Sharjah sejak 25 Januari 1972: lahir pada 2 Juli 1939, belajar di Kairo, Exeter, dan Durham, Kementerian Pendidikan pertamanya (1971), memulihkan Benteng Sharjah (1970), menjabat sebagai presiden American University dan University of Sharjah, menulis 82 buku hingga 2023, dan menerima penghargaan."
