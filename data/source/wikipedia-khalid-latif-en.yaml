summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن خالد لطيف ⁦(الإمام)⁩؛ تُستخدم لوقائع الكيان فقط. وُلد في إديسون بنيوجيرسي في 18 أكتوبر 1982، وكان أول قسيس مسلم في جامعة نيويورك وأصغر قسيس في تاريخ شرطة نيويورك، ثم أصبح سنة 2025 مدير المركز الإسلامي لمدينة نيويورك ومؤسسًا مشاركًا له."
  en: "English Wikipedia article on Khalid Latif (the imam); used for entity facts only. Born in Edison, New Jersey on 18 October 1982, he was New York University's first Muslim chaplain and the youngest chaplain in NYPD history, and in 2025 became director and co-founder of the Islamic Center of New York City."
  es: "Artículo de la Wikipedia en inglés sobre Khalid Latif (el imán); utilizado únicamente para datos sobre la persona. Nacido en Edison, Nueva Jersey, el 18 de octubre de 1982, fue el primer capellán musulmán de la Universidad de Nueva York y el capellán más joven en la historia del Departamento de Policía de Nueva York (NYPD). En 2025, se convirtió en director y cofundador del Centro Islámico de la Ciudad de Nueva York."
  fr: "Article de Wikipédia en anglais sur Khalid Latif (l'imam); utilisé uniquement à des fins d'information sur l'entité. Né à Edison, dans le New Jersey, le 18 octobre 1982, il fut le premier aumônier musulman de l'Université de New York et le plus jeune aumônier de l'histoire du NYPD. En 2025, il devint directeur et cofondateur du Centre islamique de New York."
  ur: "خالد لطیف ⁦(امام)⁩ پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ 18 اکتوبر 1982 کو ایڈیسن، نیو جرسی میں پیدا ہوئے، وہ نیویارک یونیورسٹی کے پہلے مسلمان پادری اور NYPD کی تاریخ کے سب سے کم عمر پادری تھے، اور 2025 میں نیویارک سٹی کے اسلامک سینٹر کے ڈائریکٹر اور شریک بانی بن گئے۔"
