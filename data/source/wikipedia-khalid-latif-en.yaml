reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 at the recorded revision (oldid=1378403269; revision equality asserted). The plain title 'Khalid Latif' is a disambiguation page; the imam's article is 'Khalid Latif (imam)', Wikidata Q6399529 — not the cricketer of the same name. The article gives him born on 18 October 1982 in Edison, New Jersey (the date citing his own birthday post); educated at New York University (political science, Middle Eastern and Islamic studies) and Hartford Seminary; appointed NYU's first Muslim chaplain in 2005 and, in 2007, the youngest chaplain in NYPD history at 24; executive director and imam of the Islamic Center at NYU for almost twenty years; and, from 2025, director and co-founder of the Islamic Center of New York City. A full-text search of the recorded revision finds no naming of any legal school, order or movement affiliation for him; its categories file him only under American imams and Muslim chaplains."
