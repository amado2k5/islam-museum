reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md). Read in full at revision 1381758816 on 25 October 2026. The article gives his birth as 2 February 1882 at Mecca (second of Hussein's four sons, by his first wife Abdiyya bint Abdullah) and his assassination on 20 July 1951 at Jerusalem; it refused, it notes, the Iraqi crown proclaimed to him on 8 March 1920 before it passed to Faisal. It names no school for him — the word Sunni does not appear in it as a description of the man."
