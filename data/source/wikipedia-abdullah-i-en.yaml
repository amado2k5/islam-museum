summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الله الأول بن الحسين ⁦(2 فبراير 1882 – 20 يوليو 1951)⁩، ثاني أبناء الشريف حسين، ونائب مكة في البرلمان العثماني، وقائد الجيش الشرقي في الثورة العربية، ومؤسس إمارة شرق الأردن في 11 أبريل 1921 وأميرها حتى صار ملكًا على الأردن المستقل في 25 مايو 1946؛ تروي طموحه إلى سوريا الكبرى، واجتماعاته السرية مع الوكالة اليهودية، وضمّه الضفة الغربية سنة 1950، واغتياله عند مدخل المسجد الأقصى أثناء صلاة الجمعة."
  en: "English Wikipedia article on Abdullah I bin Hussein (2 February 1882 – 20 July 1951), second son of Sharif Hussein, deputy for Mecca in the Ottoman parliament, commander of the Eastern Army in the Arab Revolt, founder of the Emirate of Transjordan on 11 April 1921 and its Emir until he became king of independent Jordan on 25 May 1946; it recounts his Greater Syria ambition, his secret meetings with the Jewish Agency, his annexation of the West Bank in 1950, and his assassination at the entrance of al-Aqsa Mosque during Friday prayers."
  es: "Artículo de la Wikipedia en inglés sobre Abdullah I bin Hussein (2 de febrero de 1882 - 20 de julio de 1951), segundo hijo de Sharif Hussein, diputado por La Meca en el parlamento otomano, comandante del Ejército Oriental en la Revuelta Árabe, fundador del Emirato de Transjordania el 11 de abril de 1921 y su emir hasta que se convirtió en rey de la Jordania independiente el 25 de mayo de 1946; relata su ambición por la Gran Siria, sus reuniones secretas con la Agencia Judía, su anexión de Cisjordania en 1950 y su asesinato a la entrada de la Mezquita de Al-Aqsa durante las oraciones del viernes."
  fr: "L'article de Wikipédia en anglais sur Abdullah Ier bin Hussein (2 février 1882 – 20 juillet 1951), deuxième fils du chérif Hussein, député de La Mecque au parlement ottoman, commandant de l'armée orientale pendant la révolte arabe, fondateur de l'émirat de Transjordanie le 11 avril 1921 et son émir jusqu'à son accession au trône de Jordanie indépendante le 25 mai 1946, relate son ambition de créer une Grande Syrie, ses rencontres secrètes avec l'Agence juive, l'annexion de la Cisjordanie en 1950 et son assassinat à l'entrée de la mosquée al-Aqsa pendant la prière du vendredi."
  ur: "عبداللہ اول بن حسین ⁦(2 فروری 1882 - 20 جولائی 1951)⁩ پر انگریزی ویکیپیڈیا کا مضمون، شریف حسین کے دوسرے بیٹے، عثمانی پارلیمنٹ میں مکہ کے نائب، عرب بغاوت میں مشرقی فوج کے کمانڈر، 11 اپریل 1921 کو امارت ٹرانسجورڈن کے بانی اور مئی 1921 میں اس کے بادشاہ کے بادشاہ بن گئے۔ 1946; اس میں شام کے عظیم تر عزائم، یہودی ایجنسی کے ساتھ ان کی خفیہ ملاقاتیں، 1950 میں مغربی کنارے پر ان کا الحاق، اور نماز جمعہ کے دوران مسجد اقصیٰ کے دروازے پر ان کے قتل کا ذکر کیا گیا ہے۔"
