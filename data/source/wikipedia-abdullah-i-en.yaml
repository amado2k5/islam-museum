summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الله الأول بن الحسين (2 فبراير 1882 – 20 يوليو 1951)، ثاني أبناء الشريف حسين، ونائب مكة في البرلمان العثماني، وقائد الجيش الشرقي في الثورة العربية، ومؤسس إمارة شرق الأردن في 11 أبريل 1921 وأميرها حتى صار ملكًا على الأردن المستقل في 25 مايو 1946؛ تروي طموحه إلى سوريا الكبرى، واجتماعاته السرية مع الوكالة اليهودية، وضمّه الضفة الغربية سنة 1950، واغتياله عند مدخل المسجد الأقصى أثناء صلاة الجمعة."
  en: "English Wikipedia article on Abdullah I bin Hussein (2 February 1882 – 20 July 1951), second son of Sharif Hussein, deputy for Mecca in the Ottoman parliament, commander of the Eastern Army in the Arab Revolt, founder of the Emirate of Transjordan on 11 April 1921 and its Emir until he became king of independent Jordan on 25 May 1946; it recounts his Greater Syria ambition, his secret meetings with the Jewish Agency, his annexation of the West Bank in 1950, and his assassination at the entrance of al-Aqsa Mosque during Friday prayers."
