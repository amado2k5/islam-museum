summary:
  ar: "أقدم لقطة في أرشيف الإنترنت لموقع binbaz.org.sa بتاريخ 27 نوفمبر 1999: يصف نفسه بأنه الموقع الرسمي الوحيد للشيخ عبد العزيز بن باز والمعتمد منه كتابةً قبل وفاته، والمشرف العام عليه ابنه أحمد بن عبد العزيز بن باز، وصمّمته شركة العالمية للإنترنت والاتصالات، وحقوقه 1420هـ/1999."
  en: "The earliest Internet Archive capture of binbaz.org.sa, 27 November 1999: it calls itself the only official site of Shaykh Abd al-Aziz ibn Baz, approved by him in writing before his death, with his son Ahmad ibn Abd al-Aziz ibn Baz as general supervisor, designed by al-Alamiyya Internet and Communications, copyright 1420 AH / 1999."
  ur: "binbaz.org.sa کی سب سے پرانی انٹرنیٹ آرکائیو تصویر، 27 نومبر 1999: خود کو شیخ عبدالعزیز بن باز کی واحد سرکاری سائٹ کہتی ہے جس کی انہوں نے وفات سے پہلے تحریری منظوری دی، نگرانِ عام ان کے صاحبزادے احمد بن عبدالعزیز بن باز، ڈیزائن العالمیہ انٹرنیٹ کمپنی، حقوق 1420ھ/1999۔"
