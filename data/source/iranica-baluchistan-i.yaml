  ar: "مقال موسوعة إيرانيكا «بلوشستان 1: الجغرافيا والتاريخ والإثنوغرافيا»: تاريخ خانية قلات وخلافة خداداد خان سنة 1857 وهو ابن ست عشرة سنة وحكمه حتى خلعه سنة 1893، وقوله إن البلوش يزعمون عموما أنهم مسلمون حنفيون."
  en: "Encyclopaedia Iranica article 'Baluchistan i. Geography, History and Ethnography': the history of the Kalat khanate, including Khudadad Khan's succession in 1857 aged sixteen and his rule until his forced abdication in 1893, and the ethnographic statement that the Baluch generally claim all Baluch are Hanafite Muslims."
