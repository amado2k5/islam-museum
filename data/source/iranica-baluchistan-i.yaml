reliability_note: >-
  Scholarly encyclopedia article, read online on 31 October 2026.
  Used in this batch for two things only: the Kalat succession
  narrative (Nasir Khan II succeeded in 1857 by his stepbrother
  Khudadad, aged sixteen, who ruled until 1893 and was then forced
  to abdicate), which fits the about-1841 birth year; and its
  statement that 'the Baluch generally claim that all Baluch are
  Hanafite Muslims' — a claim made about a people, recorded as such
  and never treated as an attestation of any individual khan's
  school.
