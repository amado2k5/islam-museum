summary:
  ar: "مقال موسوعة إيرانيكا «بلوشستان 1: الجغرافيا والتاريخ والإثنوغرافيا»: تاريخ خانية قلات وخلافة خداداد خان سنة 1857 وهو ابن ست عشرة سنة وحكمه حتى خلعه سنة 1893، وقوله إن البلوش يزعمون عموما أنهم مسلمون حنفيون."
  en: "Encyclopaedia Iranica article 'Baluchistan i. Geography, History and Ethnography': the history of the Kalat khanate, including Khudadad Khan's succession in 1857 aged sixteen and his rule until his forced abdication in 1893, and the ethnographic statement that the Baluch generally claim all Baluch are Hanafite Muslims."
  es: "Artículo de la Enciclopedia Iranica 'Baluchistán i. Geografía, Historia y Etnografía': la historia del kanato de Kalat, incluyendo la sucesión de Khudadad Khan en 1857 a la edad de dieciséis años y su gobierno hasta su abdicación forzada en 1893, y la afirmación etnográfica de que los baluchis generalmente afirman que todos los baluchis son musulmanes hanafíes."
  fr: "L'article de l'Encyclopaedia Iranica intitulé « Baloutchistan i. Géographie, histoire et ethnographie »: l'histoire du khanat de Kalat, y compris la succession de Khudadad Khan en 1857 à l'âge de seize ans et son règne jusqu'à son abdication forcée en 1893, et l'affirmation ethnographique selon laquelle les Baloutches affirment généralement que tous les Baloutches sont des musulmans hanafites."
