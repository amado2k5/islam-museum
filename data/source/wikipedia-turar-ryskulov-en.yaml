summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن تورار ريسقولوف؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 26 ديسمبر 1894 في ولاية سيميريتشيه، ورئاسته للجنة التنفيذية المركزية ثم لمجلس مفوضي الشعب في تركستان، وعمله نائبا لمفوض القوميات في موسكو ومفوضا للكومنترن في منغوليا، واعتقاله سنة 1937 وإعدامه في موسكو في 10 فبراير 1938 وردّ اعتباره سنة 1956. لا يسمي متنها ولا صندوق معلوماتها دينا ولا مذهبا له."
  en: "English Wikipedia article on Turar Ryskulov; used for entity facts only. It gives his birth on 26 December 1894 in Semirechye Oblast, his chairmanship of the Central Executive Committee and then of the Council of People's Commissars of the Turkestan ASSR, his work as deputy people's commissar for nationalities in Moscow and as a Comintern representative in Mongolia, his arrest in 1937, his execution in Moscow on 10 February 1938 and his rehabilitation in 1956. Neither its text nor its infobox names a religion or school for him."
  es: "Artículo de la Wikipedia en inglés sobre Turar Ryskulov; utilizado únicamente para datos sobre la persona. Indica su nacimiento el 26 de diciembre de 1894 en el óblast de Semirechye, su presidencia del Comité Ejecutivo Central y posteriormente del Consejo de Comisarios del Pueblo de la RASS de Turkestán, su labor como comisario adjunto del pueblo para las nacionalidades en Moscú y como representante de la Comintern en Mongolia, su arresto en 1937, su ejecución en Moscú el 10 de febrero de 1938 y su rehabilitación en 1956. Ni el texto ni el recuadro informativo mencionan su religión o escuela."
  fr: "Article de Wikipédia en anglais sur Turar Ryskulov; utilisé uniquement pour les informations biographiques. Il indique sa naissance le 26 décembre 1894 dans l’oblast de Semirechye, sa présidence du Comité exécutif central puis du Conseil des commissaires du peuple de la RSSA du Turkestan, ses fonctions de commissaire adjoint du peuple aux nationalités à Moscou et de représentant du Komintern en Mongolie, son arrestation en 1937, son exécution à Moscou le 10 février 1938 et sa réhabilitation en 1956. Ni le texte ni l’infobox ne mentionnent sa religion ou son appartenance à une école religieuse."
  ur: "انگریزی ویکیپیڈیا مضمون ٹورر ریسکولوف پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 26 دسمبر 1894 کو سیمیریچی اوبلاست میں ان کی پیدائش، سنٹرل ایگزیکٹو کمیٹی اور اس کے بعد ترکستان ASSR کی پیپلز کمیشنر کی کونسل کی سربراہی، ماسکو میں قومیتوں کے ڈپٹی پیپلز کمیشنر کے طور پر اور منگولیا میں ایک Comintern نمائندے کے طور پر ان کا کام، 1937 میں ان کی گرفتاری اور فروری 1937 میں ان کی موت، 1937 میں موت واقع ہوئی۔ 1956 میں اس کی بحالی۔ نہ تو اس کا متن اور نہ ہی اس کے معلوماتی خانے میں اس کے لیے کسی مذہب یا اسکول کا نام ہے۔"
  tr: "Turar Ryskulov hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 26 Aralık 1894'te Semiricheh bölgesinde doğdu, Türkistan'da Merkez Yürütme Komitesi'ne ve ardından Halk Komiserleri Konseyi'ne başkanlık etti, Moskova'da milletler komiseri yardımcısı ve Moğolistan'da Komintern komiseri olarak görev yaptı, 1937'de tutuklandı, 10 Şubat 1938'de Moskova'da idam edildi ve 1956'da görevine geri getirildi. Bedeni veya bilgi kutusuna din veya tarikat denmez."
  id: "Artikel Wikipedia bahasa Inggris tentang Turar Ryskulov; digunakan hanya untuk fakta entitas. Ia lahir pada 26 Desember 1894 di wilayah Semiricheh, memimpin Komite Eksekutif Pusat dan kemudian Dewan Komisaris Rakyat di Turkestan, menjabat sebagai wakil komisaris kebangsaan di Moskow dan komisaris Komintern di Mongolia, ditangkap pada tahun 1937, dieksekusi di Moskow pada 10 Februari 1938, dan diangkat kembali pada tahun 1956. Badan atau kotak informasinya tidak disebut agama atau sekte."
