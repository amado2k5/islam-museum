summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن تورار ريسقولوف؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في 26 ديسمبر 1894 في ولاية سيميريتشيه، ورئاسته للجنة التنفيذية المركزية ثم لمجلس مفوضي الشعب في تركستان، وعمله نائبا لمفوض القوميات في موسكو ومفوضا للكومنترن في منغوليا، واعتقاله سنة 1937 وإعدامه في موسكو في 10 فبراير 1938 وردّ اعتباره سنة 1956. لا يسمي متنها ولا صندوق معلوماتها دينا ولا مذهبا له."
  en: "English Wikipedia article on Turar Ryskulov; used for entity facts only. It gives his birth on 26 December 1894 in Semirechye Oblast, his chairmanship of the Central Executive Committee and then of the Council of People's Commissars of the Turkestan ASSR, his work as deputy people's commissar for nationalities in Moscow and as a Comintern representative in Mongolia, his arrest in 1937, his execution in Moscow on 10 February 1938 and his rehabilitation in 1956. Neither its text nor its infobox names a religion or school for him."
