summary:
  ar: "ترجمتان لمعاني القرآن ينشرهما موقع موسوعة القرآن الكريم QuranEnc.com: الفرنسية لرشيد معاش، الإصدار 1.0.3، والإسبانية لمحمد عيسى غارسيا، الإصدار 1.0.2. يعرضهما المتحف بجوار الآيات كما وردتا بلا تغيير وفق شروط إعادة النشر في الموقع، وهما ليستا ملكًا عامًا ولا ضمن بيانات المتحف المرخصة برخصة CC0."
  en: "Two translations of the meanings of the Qur'an published by QuranEnc.com (Encyclopedia of the Noble Quran): French by Rachid Maach, version 1.0.3, and Spanish by Muhammad Isa García, version 1.0.2. The museum shows them beside the verses unchanged, under that site's terms of re-publication; they are not public domain and are not part of the museum's CC0 data."
  ur: "قرآن کے معانی کے دو ترجمے جو QuranEnc.com نے شائع کیے: فرانسیسی از رشید معاش، ورژن 1.0.3، اور ہسپانوی از محمد عیسیٰ گارسیا، ورژن 1.0.2۔ عجائب گھر انہیں آیات کے ساتھ بلا ترمیم، اس ویب سائٹ کی دوبارہ اشاعت کی شرائط کے تحت دکھاتا ہے؛ یہ عام ملکیت نہیں اور عجائب گھر کے CC0 ڈیٹا کا حصہ نہیں۔"
  fr: "Deux traductions du sens des versets du Coran publiées par QuranEnc.com (Encyclopédie du Noble Coran) : en français par Rachid Maach, version 1.0.3, et en espagnol par Muhammad Isa García, version 1.0.2. Le musée les affiche à côté des versets sans modification, selon les conditions de republication de ce site ; elles ne sont pas dans le domaine public et ne font pas partie des données du musée sous licence CC0."
  es: "Dos traducciones de los significados del Corán publicadas por QuranEnc.com (Enciclopedia del Noble Corán): al francés por Rachid Maach, versión 1.0.3, y al español por Muhammad Isa García, versión 1.0.2. El museo las muestra junto a las aleyas sin modificación, según las condiciones de republicación de ese sitio; no son de dominio público ni forman parte de los datos del museo con licencia CC0."
