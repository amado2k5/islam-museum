label: { en: "QuranEnc.com, French, Spanish, Turkish and Indonesian translations of the meanings of the Qur'an", ar: "موقع QuranEnc.com، ترجمات معاني القرآن إلى الفرنسية والإسبانية والتركية والإندونيسية" }
summary:
  ar: "أربع ترجمات لمعاني القرآن ينشرها موقع موسوعة القرآن الكريم QuranEnc.com: الفرنسية لرشيد معاش، الإصدار 1.0.3، والإسبانية لمحمد عيسى غارسيا، الإصدار 1.0.2، والتركية لفريق مركز رواد للترجمة، الإصدار 1.0.4، والإندونيسية لوزارة الشؤون الدينية، الإصدار 1.0.1. يعرضها المتحف بجوار الآيات كما وردت بلا تغيير وفق شروط إعادة النشر في الموقع، وليست ملكًا عامًا ولا ضمن بيانات المتحف المرخصة برخصة CC0."
  en: "Four translations of the meanings of the Qur'an published by QuranEnc.com (Encyclopedia of the Noble Quran): French by Rachid Maach, version 1.0.3, Spanish by Muhammad Isa García, version 1.0.2, Turkish by the Rowwad Translation Center team, version 1.0.4, and Indonesian by the Ministry of Religious Affairs, version 1.0.1. The museum shows them beside the verses unchanged, under that site's terms of re-publication; they are not public domain and are not part of the museum's CC0 data."
  ur: "قرآن کے معانی کے چار ترجمے جو QuranEnc.com نے شائع کیے: فرانسیسی از رشید معاش، ورژن 1.0.3، ہسپانوی از محمد عیسیٰ گارسیا، ورژن 1.0.2، ترکی از رواد ٹرانسلیشن سینٹر ٹیم، ورژن 1.0.4، اور انڈونیشیائی از وزارتِ مذہبی امور، ورژن 1.0.1۔ عجائب گھر انہیں آیات کے ساتھ بلا ترمیم، اس ویب سائٹ کی دوبارہ اشاعت کی شرائط کے تحت دکھاتا ہے؛ یہ عام ملکیت نہیں اور عجائب گھر کے CC0 ڈیٹا کا حصہ نہیں۔"
  fr: "Quatre traductions du sens des versets du Coran publiées par QuranEnc.com (Encyclopédie du Noble Coran) : en français par Rachid Maach, version 1.0.3, en espagnol par Muhammad Isa García, version 1.0.2, en turc par l'équipe du Rowwad Translation Center, version 1.0.4, et en indonésien par le Ministère des Affaires religieuses, version 1.0.1. Le musée les affiche à côté des versets sans modification, selon les conditions de republication de ce site ; elles ne sont pas dans le domaine public et ne font pas partie des données du musée sous licence CC0."
  es: "Cuatro traducciones de los significados del Corán publicadas por QuranEnc.com (Enciclopedia del Noble Corán): al francés por Rachid Maach, versión 1.0.3, al español por Muhammad Isa García, versión 1.0.2, al turco por el equipo del Rowwad Translation Center, versión 1.0.4, y al indonesio por el Ministerio de Asuntos Religiosos, versión 1.0.1. El museo las muestra junto a las aleyas sin modificación, según las condiciones de republicación de ese sitio; no son de dominio público ni forman parte de los datos del museo con licencia CC0."
  tr: "QuranEnc.com (Noble Quran Encyclopedia) tarafından yayımlanan Kur'an meâllerinden dördü: Rachid Maach Fransızcası 1.0.3, Muhammad Isa García İspanyolcası 1.0.2, Rowwad Translation Center ekibi Türkçesi 1.0.4 ve Din İşleri Bakanlığı Endonezyacası 1.0.1. Müze bunları ayetlerin yanında değiştirmeden, sitenin yeniden yayın koşulları uyarınca gösterir; kamu malı değildirler ve müzenin CC0 verilerine dahil değildirler."
  id: "Empat terjemahan makna Al-Qur'an yang diterbitkan QuranEnc.com (Encyclopedia of the Noble Quran): Prancis oleh Rachid Maach versi 1.0.3, Spanyol oleh Muhammad Isa García versi 1.0.2, Turki oleh tim Rowwad Translation Center versi 1.0.4, dan Indonesia oleh Kementerian Agama versi 1.0.1. Museum menampilkannya di samping ayat tanpa perubahan sesuai ketentuan publikasi ulang situs tersebut; bukan domain publik dan bukan bagian dari data museum berlisensi CC0."
