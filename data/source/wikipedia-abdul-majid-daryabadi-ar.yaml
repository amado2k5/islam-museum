summary:
  ar: "مقالة ويكيبيديا العربية عن عبد الماجد الدريابادي ⁦(16 آذار 1892 – 6 كانون الثاني 1977)⁩؛ بذرة قصيرة تذكر أنه تأثر بشدة بأشرف علي التهانوي وحسين أحمد المدني وكان نشطًا في حركة الخلافة والجمعية الملكية الآسيوية؛ ولا تسمّي مذهبًا في متنها."
  en: "The Arabic Wikipedia article on Abdul Majid Daryabadi (16 March 1892 – 6 January 1977); a short stub stating that he was strongly influenced by Ashraf Ali Thanwi and Hussain Ahmad Madani and was active in the Khilafat Movement and the Royal Asiatic Society; it names no school in its prose."
  es: "El artículo de la Wikipedia en árabe sobre Abdul Majid Daryabadi (16 de marzo de 1892 - 6 de enero de 1977) es un breve esbozo que afirma que estuvo fuertemente influenciado por Ashraf Ali Thanwi y Hussain Ahmad Madani y que participó activamente en el Movimiento Khilafat y la Real Sociedad Asiática; no menciona ninguna escuela en su texto."
  fr: "L'article de Wikipédia en arabe sur Abdul Majid Daryabadi (16 mars 1892 – 6 janvier 1977); une brève ébauche indiquant qu'il a été fortement influencé par Ashraf Ali Thanwi et Hussain Ahmad Madani et qu'il était actif dans le mouvement Khilafat et la Royal Asiatic Society; il ne cite aucune école dans son texte."
  ur: "عبدالمجید دریابادی پر عربی ویکیپیڈیا کا مضمون ⁦(16 مارچ 1892 - 6 جنوری 1977)⁩؛ ایک مختصر سٹب جس میں بتایا گیا کہ وہ اشرف علی تھانوی اور حسین احمد مدنی سے بہت متاثر تھے اور تحریک خلافت اور رائل ایشیاٹک سوسائٹی میں سرگرم تھے۔ اس نے اپنے نثر میں کسی اسکول کا نام نہیں لیا۔"
  tr: "Abdul Majid Al-Daryabadi hakkında Arapça Vikipedi makalesi (16 Mart 1892 – 6 Ocak 1977); Ashraf Ali al-Tahanawi ve Hussein Ahmed al-Madani'den yoğun şekilde etkilendiğini, Halifelik Hareketi ve Kraliyet Asya Cemiyeti'nde aktif olduğunu belirten kısa bir taslak; içeriğinde bir tarikat adı verilmemektedir."
  id: "Artikel Wikipedia berbahasa Arab tentang Abdul Majid Al-Daryabadi (16 Maret 1892 – 6 Januari 1977); sebuah artikel singkat yang menyebutkan bahwa ia sangat dipengaruhi oleh Ashraf Ali al-Tahanawi dan Hussein Ahmed al-Madani, serta aktif dalam Gerakan Khalifah dan Royal Asiatic Society; tidak menyebutkan satu sekte pun dalam isinya."
