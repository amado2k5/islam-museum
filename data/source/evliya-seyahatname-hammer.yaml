summary:
  ar: "الجزء الثاني من الجلد الأول من ترجمة فون هامر لسياحتنامه إوليا جلبي، وفيه وصف موكب طوائف إسطنبول أمام السلطان: عدد دكاكين كل طائفة ورجالها وبيارتها ⁦(أولياؤها)⁩ ومراسم عرضها، من الخبّازين والسقّائين إلى الحدّادين والخيّاطين والحلّاقين."
  en: "Part 2 of the first volume of von Hammer's English translation of Evliya Çelebi's Seyahatname, which describes the procession of the Istanbul guilds before the sultan: each craft's shops and men, its patron saints (pirs), and the displays it made, from the bakers and water-carriers to the smiths, tailors and barbers."
  es: "Segunda parte del primer volumen de la traducción al inglés de von Hammer del Seyahatname de Evliya Çelebi, que describe la procesión de los gremios de Estambul ante el sultán: los talleres y los hombres de cada oficio, sus santos patronos (pirs) y las exhibiciones que realizaban, desde los panaderos y aguadores hasta los herreros, sastres y barberos."
  fr: "Deuxième partie du premier volume de la traduction anglaise par von Hammer du Seyahatname d'Evliya Çelebi, qui décrit le défilé des guildes d'Istanbul devant le sultan: les ateliers et les artisans de chaque métier, leurs saints patrons (pirs) et les étalages qu'ils présentaient, des boulangers et porteurs d'eau aux forgerons, tailleurs et barbiers."
