summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الرؤوف فطرت (1886–1938)، الكاتب والسياسي والمفكر الأوزبكي الجديدي من بخارى، تتعقب دراسته في إسطنبول وأدواره في حكومة جمهورية بخارى الشعبية السوفييتية وإعدامه في 4 أكتوبر 1938، ومنها أن محمود خوجة بهبودي كان مرشده."
  en: "The English Wikipedia article on Abdurauf Fitrat (1886–1938), the Bukhara-born Uzbek Jadid author, politician and public intellectual, tracing his Istanbul studies, his posts in the Bukharan People's Soviet Republic and his execution on 4 October 1938, and recording that Mahmudkhodja Behbudiy was his mentor."
  es: "El artículo de la Wikipedia en inglés sobre Abdurauf Fitrat (1886-1938), autor, político e intelectual público uzbeko Jadid nacido en Bujará, narra sus estudios en Estambul, sus cargos en la República Soviética Popular de Bujará y su ejecución el 4 de octubre de 1938, y deja constancia de que Mahmudkhodja Behbudiy fue su mentor."
  fr: "L'article de Wikipédia en anglais sur Abdurauf Fitrat (1886-1938), auteur, homme politique et intellectuel public ouzbek Jadid né à Boukhara, retraçant ses études à Istanbul, ses postes dans la République soviétique populaire de Boukhara et son exécution le 4 octobre 1938, et indiquant que Mahmudkhodja Behbudiy était son mentor."
