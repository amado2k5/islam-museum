summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سيد شيخ الهادي؛ تُستخدم لوقائع الكيان فقط. مقالة طويلة مترجمة عن الألمانية تعطي ميلاده في كامبونغ هولو بملقا في 22 تشرين الثاني 1867 (تقترن عنده بـ25 رجب 1284هـ)، وتعليمه في بنينغت وترنغانو، ومشاركته في تأسيس «الإمام»، ومدارسه ومطبعة جلوتونغ ورواياته وفكره الإصلاحي في «كاوم مودا»، ووفاته في جلوتونغ ببينانغ في 20 شباط 1934. لا تسمّي له مذهبًا؛ وتذكر أن تزويجه ابنته بنفسه سنة 1914 كان جائزًا عند الشافعية، وهي المدرسة القانونية الرسمية لجوهر."
  en: "English Wikipedia article on Syed Sheikh al-Hadi; used for entity facts only. A long article translated from the German: it gives his birth at Kampung Hulu, Malacca, on 22 November 1867 (paired with 25 Rajab 1284 AH), his Penyengat and Terengganu education, his co-founding of Al-Imam, his madrasas and the Jelutong Press, his novels, his Kaum Muda reform thought, and his death at Jelutong, Penang, on 20 February 1934. It names no school of law for him; it records that the marriage he solemnised for his daughter in 1914 was permitted under the Shafiite school, Johor's official legal school."
