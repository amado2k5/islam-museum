summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سيد شيخ الهادي؛ تُستخدم لوقائع الكيان فقط. مقالة طويلة مترجمة عن الألمانية تعطي ميلاده في كامبونغ هولو بملقا في 22 تشرين الثاني 1867 ⁦(تقترن عنده بـ25 رجب 1284هـ)⁩، وتعليمه في بنينغت وترنغانو، ومشاركته في تأسيس «الإمام»، ومدارسه ومطبعة جلوتونغ ورواياته وفكره الإصلاحي في «كاوم مودا»، ووفاته في جلوتونغ ببينانغ في 20 شباط 1934. لا تسمّي له مذهبًا؛ وتذكر أن تزويجه ابنته بنفسه سنة 1914 كان جائزًا عند الشافعية، وهي المدرسة القانونية الرسمية لجوهر."
  en: "English Wikipedia article on Syed Sheikh al-Hadi; used for entity facts only. A long article translated from the German: it gives his birth at Kampung Hulu, Malacca, on 22 November 1867 (paired with 25 Rajab 1284 AH), his Penyengat and Terengganu education, his co-founding of Al-Imam, his madrasas and the Jelutong Press, his novels, his Kaum Muda reform thought, and his death at Jelutong, Penang, on 20 February 1934. It names no school of law for him; it records that the marriage he solemnised for his daughter in 1914 was permitted under the Shafiite school, Johor's official legal school."
  es: "Artículo de la Wikipedia en inglés sobre Syed Sheikh al-Hadi; utilizado únicamente para datos sobre la persona. Un extenso artículo traducido del alemán: menciona su nacimiento en Kampung Hulu, Malaca, el 22 de noviembre de 1867 (correspondiente al 25 de Rajab de 1284 AH), su educación en Penyengat y Terengganu, su cofundación de Al-Imam, sus madrasas y la imprenta de Jelutong, sus novelas, su pensamiento reformista Kaum Muda y su muerte en Jelutong, Penang, el 20 de febrero de 1934. No se menciona ninguna escuela jurídica a la que perteneció; se indica que el matrimonio que celebró para su hija en 1914 fue permitido bajo la escuela Shafi'i, la escuela jurídica oficial de Johor."
  fr: "Article de Wikipédia en anglais sur Syed Sheikh al-Hadi; utilisé uniquement pour les informations le concernant. Cet article long, traduit de l'allemand, relate sa naissance à Kampung Hulu, Malacca, le 22 novembre 1867 (correspondant au 25 Rajab 1284 AH), ses études à Penyengat et Terengganu, sa cofondation d'Al-Imam, de ses madrasas et de la Jelutong Press, ses romans, sa pensée réformatrice Kaum Muda et sa mort à Jelutong, Penang, le 20 février 1934. Il ne mentionne aucune école de droit à laquelle il aurait appartenu; il indique que le mariage qu'il a célébré pour sa fille en 1914 a été autorisé par l'école chaféite, l'école juridique officielle de Johor."
  ur: "سید شیخ الہادی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ جرمن سے ترجمہ کردہ ایک طویل مضمون: یہ 22 نومبر 1867 کو کمپونگ ہولو، ملاکا میں ان کی پیدائش ⁦(25 رجب 1284 ہجری کے ساتھ جوڑا)⁩، ان کی پینینگت اور ترینگگانو تعلیم، اس کی امامت، اس کے مدارس اور جیلوتونگ پریس، اس کے ناول، اس کی موت، موت، ان کے ناولوں اور ان کی موت کے بارے میں لکھا گیا ہے۔ 20 فروری 1934۔ اس نے اس کے لیے قانون کے کسی مکتب کا نام نہیں لیا۔ اس میں درج ہے کہ اس نے 1914 میں اپنی بیٹی سے جو شادی کی تھی اس کی اجازت جوہر کے سرکاری قانونی اسکول شافعی اسکول کے تحت تھی۔"
  tr: "Sayyid Şeyh al-Hadi hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Almancadan çevrilmiş uzun bir makale, 22 Kasım 1867'de Malakka'nın Kampong Hulu kentinde doğduğunu (25 Recep 1284 Hicri ile ilişkili), Beningt ve Terengganu'daki eğitimini, 'İmam'ın kuruluşuna katılımını, okullarını, Glutong matbaasını, romanlarını ve reformcu düşüncelerini 'Kaum Muda'da ve 20 Şubat 1934'te Penang, Glutong'da vefatını anlatır. Onu bir düşünce okulu olarak adlandırmayın; 1914'te kızıyla evlenmesinin Şafi'ler, Jawhar'ın resmi hukuk okuluna göre izin verildiği belirtilir."
  id: "Artikel Wikipedia bahasa Inggris tentang Sayyid Sheikh al-Hadi; hanya digunakan untuk fakta entitas. Sebuah artikel panjang yang diterjemahkan dari bahasa Jerman menceritakan kelahirannya di Kampong Hulu, Melaka, pada 22 November 1867 (terkait dengan 25 Rajab 1284 H), pendidikannya di Beningt dan Terengganu, partisipasinya dalam mendirikan 'Imam,' sekolah-sekolahnya, penerbit Glutong, novelnya, dan pemikiran reformisnya dalam 'Kaum Muda', serta kematiannya di Glutong, Penang pada 20 Februari 1934. Jangan sebutkan dia sebagai aliran pemikiran; disebutkan bahwa pernikahannya dengan putrinya sendiri pada tahun 1914 diperbolehkan menurut Shafi'i, sekolah hukum resmi Jawhar."
