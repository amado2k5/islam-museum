summary:
  ar: "مقالة ويكيبيديا العربية عن عبد الله بن صالح العجيري؛ تُستخدم لوقائع الكيان فقط. تذكر ميلاده في الخبر سنة 1976 ودراسته الهندسة وأصول الدين وإدارته مركز تكوين للدراسات والأبحاث واشتهاره بنقد الإلحاد ونظرية التطور ومؤلفاته."
  en: "Arabic Wikipedia article on Abdullah ibn Salih al-Ajiri; used for entity facts only. It gives his birth in al-Khobar in 1976, his degrees in engineering and in usul al-din, his directorship of the Takween Center for Studies and Research, his reputation for critiquing atheism and the theory of evolution, and his books."
  es: "Artículo en árabe de la Wikipedia sobre Abdullah ibn Salih al-Ajiri; se utiliza únicamente para obtener información sobre la persona. Menciona su nacimiento en al-Khobar en 1976, sus títulos en ingeniería y en usul al-din, su dirección del Centro Takween de Estudios e Investigación, su reputación como crítico del ateísmo y la teoría de la evolución, y sus libros."
  fr: "Article de Wikipédia en arabe sur Abdullah ibn Salih al-Ajiri; utilisé uniquement pour les informations le concernant. Il mentionne sa naissance à al-Khobar en 1976, ses diplômes d’ingénieur et d’usul al-din, sa direction du Centre d’études et de recherches Takween, sa réputation de critique de l’athéisme et de la théorie de l’évolution, ainsi que ses ouvrages."
  ur: "عبداللہ ابن صالح العجیری پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1976 میں الخبر میں ان کی پیدائش، انجینئرنگ اور اصول الدین میں ان کی ڈگریاں، تکوین سینٹر فار اسٹڈیز اینڈ ریسرچ کی ان کی ڈائرکٹر شپ، الحاد اور نظریہ ارتقاء پر تنقید کے لیے ان کی شہرت، اور ان کی کتابیں بتاتی ہیں۔"
