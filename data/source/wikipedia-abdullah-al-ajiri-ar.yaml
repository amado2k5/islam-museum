reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Fetched by its recorded revision (revid 73727120) via the MediaWiki API, the returned revid asserted equal, and read in full on 26 October 2026. The article gives his full name as Abdullah ibn Salih al-Ajiri, born in al-Khobar in 1396 AH / 1976 CE, resident in the United Kingdom, holder of bachelor's degrees in usul al-din (Imam Muhammad ibn Saud Islamic University) and in computer engineering (King Fahd University of Petroleum and Minerals) and a master's thesis from King Faisal University, director of the Takween Center for Studies and Research, known for his critique of atheism and of the theory of evolution and for his command of Ibn Taymiyya's heritage, with books including Milishiya al-Ilhad, Yanbu' al-Ghiwaya al-Fikriyya, Shumu' al-Nahar and Zakhrif al-Qawl. Its unreferenced infobox gives his religion as Muslim, Ahl al-Sunna wa'l-Jama'a; the article's text names no madhhab for him. Its categories file him under Saudi Salafis and Saudi Sunni scholars, which are category filings, not attestations."
