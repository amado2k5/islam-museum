reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. It confirms his birth on 25 August 1949 at Djoliba; the tradition of direct descent from Sundiata Keita; his albinism and poor eyesight ending his hope of teaching; the scandal of his singing in a princely family, music being reserved to the griot caste; Bamako in 1968 and Tidiani Koné's Rail Band; Les Ambassadeurs (1973), Abidjan, and Mandjou (1978) in honour of Ahmed Sékou Touré; two albums recorded in the United States in 1980; the return to Bamako in 1984 and settlement at Montreuil in France; Soro — dated 1986 here, recorded under the Senegalese producer Ibrahima Sylla, where the English article dates the breakthrough album to 1987; and the London Mandela concert alongside Youssou N'Dour. The article states no religion for him."
