summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سانوسي لاميدو سانوسي (محمد السنوسي الثاني)؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في 31 يوليو 1961 بكانو، ومحافظته للبنك المركزي (2009–2014)، وإمارته لكانو (2014–2020) وخلعه وإعادته سنة 2024، وتصفه في متنها بأنه الزعيم الروحي (الخليفة) للطريقة التيجانية في نيجيريا، وهو منصب عُيّن فيه في 10 مايو 2021 وقلّده في السنغال."
  en: "English Wikipedia article on Sanusi Lamido Sanusi (Muhammadu Sanusi II); used for entity facts only. It recounts his birth on 31 July 1961 in Kano, his governorship of the Central Bank of Nigeria (2009–2014), his emirate of Kano (2014–2020), his deposition and his 2024 reinstatement, and describes him in its text as the spiritual leader (khalifa) of the Tijaniyyah Sufi order in Nigeria, an office to which he was appointed on 10 May 2021 and in which he was turbaned in Senegal."
