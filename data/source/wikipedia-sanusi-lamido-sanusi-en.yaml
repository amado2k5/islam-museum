summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سانوسي لاميدو سانوسي ⁦(محمد السنوسي الثاني)⁩؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في 31 يوليو 1961 بكانو، ومحافظته للبنك المركزي (2009–2014)، وإمارته لكانو (2014–2020) وخلعه وإعادته سنة 2024، وتصفه في متنها بأنه الزعيم الروحي ⁦(الخليفة)⁩ للطريقة التيجانية في نيجيريا، وهو منصب عُيّن فيه في 10 مايو 2021 وقلّده في السنغال."
  en: "English Wikipedia article on Sanusi Lamido Sanusi (Muhammadu Sanusi II); used for entity facts only. It recounts his birth on 31 July 1961 in Kano, his governorship of the Central Bank of Nigeria (2009–2014), his emirate of Kano (2014–2020), his deposition and his 2024 reinstatement, and describes him in its text as the spiritual leader (khalifa) of the Tijaniyyah Sufi order in Nigeria, an office to which he was appointed on 10 May 2021 and in which he was turbaned in Senegal."
  es: "Artículo de la Wikipedia en inglés sobre Sanusi Lamido Sanusi (Muhammadu Sanusi II); utilizado únicamente para datos sobre la persona. Relata su nacimiento el 31 de julio de 1961 en Kano, su mandato como gobernador del Banco Central de Nigeria (2009-2014), su emirato de Kano (2014-2020), su destitución y su restitución en 2024, y lo describe en su texto como el líder espiritual (khalifa) de la orden sufí Tijaniyyah en Nigeria, cargo para el que fue nombrado el 10 de mayo de 2021 y en el que fue investido en Senegal."
  fr: "Article de Wikipédia en anglais sur Sanusi Lamido Sanusi (Muhammadu Sanusi II); utilisé uniquement à des fins d’information sur l’entité. Il relate sa naissance le 31 juillet 1961 à Kano, son mandat de gouverneur de la Banque centrale du Nigéria (2009-2014), son émirat de Kano (2014-2020), sa destitution et sa réintégration en 2024, et le décrit comme le chef spirituel (khalifa) de l’ordre soufi Tijaniyyah au Nigéria, fonction à laquelle il a été nommé le 10 mai 2021 et pour laquelle il a reçu le turban au Sénégal."
  ur: "Sanusi Lamido Sanusi (Muhammadu Sanusi II) پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 31 جولائی 1961 کو کانو میں ان کی پیدائش، نائجیریا کے مرکزی بینک کی ان کی گورنری (2009–2014)، ان کی امارت کانو (2014–2020)، ان کی معزولی اور ان کی 2024 کی بحالی کا ذکر کیا گیا ہے، اور اس کے متن میں انہیں روحانی پیشوا کے طور پر بیان کیا گیا ہے۔ ان کی تقرری 10 مئی 2021 کو ہوئی تھی اور جس میں انہیں سینیگال میں پگڑی پہنائی گئی تھی۔"
