reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It gives Shaqiri as born 10 October 1991 in Zhegër, Gjilan, to Kosovar Albanian parents, emigrating to Switzerland in 1992; three Swiss titles with Basel; spells at Bayern Munich, Inter Milan and Stoke City; the 2019 Champions League and 2020 Premier League with Liverpool; a 2024 return to Basel; and 125 Switzerland caps with 32 goals. Its personal-life section states: 'Shaqiri is a Muslim but celebrates Christmas,' attributing the custom to his family and quoting his 2014 remark about the family Christmas tree. No school is named anywhere in the article."
