summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن جردان شكيري؛ تُستخدم لوقائع الكيان فقط. تروي طفولته في كوسوفو وهجرته إلى سويسرا، ومسيرته مع بازل وبايرن ميونيخ وإنتر ميلان وستوك سيتي وليفربول، ومبارياته الدولية مع سويسرا، وتذكر أنه مسلم يحتفل مع ذلك بعيد الميلاد عادةَ أسرته منذ طفولته."
  en: "English Wikipedia article on Xherdan Shaqiri; used for entity facts only. It recounts his Kosovo childhood and emigration to Switzerland, his career at Basel, Bayern Munich, Inter Milan, Stoke City and Liverpool and his Switzerland internationals, and states that he is a Muslim who nonetheless celebrates Christmas, a family custom from his childhood."
  es: "Artículo de la Wikipedia en inglés sobre Xherdan Shaqiri; utilizado únicamente para obtener información sobre él. Narra su infancia en Kosovo y su emigración a Suiza, su trayectoria en el Basilea, el Bayern de Múnich, el Inter de Milán, el Stoke City y el Liverpool, así como sus partidos internacionales con Suiza. Afirma que es musulmán, pero que celebra la Navidad, una costumbre familiar que se remonta a su infancia."
  fr: "Article de Wikipédia en anglais sur Xherdan Shaqiri; utilisé uniquement à des fins d’information. Il relate son enfance au Kosovo et son émigration en Suisse, sa carrière à Bâle, au Bayern Munich, à l’Inter Milan, à Stoke City et à Liverpool, ainsi que ses sélections en équipe nationale suisse. Il précise qu’il est musulman et qu’il célèbre néanmoins Noël, une tradition familiale héritée de son enfance."
  ur: "Xherdan Shaqiri پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اس کے کوسوو کے بچپن اور سوئٹزرلینڈ میں ہجرت، باسل، بائرن میونخ، انٹر میلان، اسٹوک سٹی اور لیورپول میں اس کے کیریئر اور اس کے سوئٹزرلینڈ کے بین الاقوامی مقابلوں کا ذکر کیا گیا ہے، اور کہا گیا ہے کہ وہ ایک مسلمان ہے جو اس کے باوجود کرسمس مناتا ہے، جو کہ اس کے بچپن سے ہی خاندانی رواج ہے۔"
  tr: "Jordan Shkiri hakkında İngilizce Wikipedia makalesi sadece varlığın gerçekleri için kullanılmıştır. Kosova'daki çocukluğunu, İsviçre'ye göçünü, Basel, Bayern Münih, Inter Milan, Stoke City ve Liverpool ile oynadığı uluslararası maçları ve İsviçre ile oynadığı uluslararası maçları anlatır ve Müslüman olduğunu, çocukluğundan beri Noel'i aile geleneği olarak kutladığını hatırlar."
  id: "Artikel Wikipedia bahasa Inggris tentang Jordan Shkiri hanya digunakan untuk fakta entitas tersebut. Artikel ini menceritakan masa kecilnya di Kosovo, migrasinya ke Swiss, kariernya bersama Basel, Bayern Munich, Inter Milan, Stoke City, dan Liverpool, serta pertandingan internasionalnya melawan Swiss, dan ia mengingat bahwa ia adalah Muslim dan masih merayakan Natal sebagai tradisi keluarga sejak kecil."
