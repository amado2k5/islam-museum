  ar: "مقالة ويكيبيديا الإنجليزية عن جردان شكيري؛ تُستخدم لوقائع الكيان فقط. تروي طفولته في كوسوفو وهجرته إلى سويسرا، ومسيرته مع بازل وبايرن ميونيخ وإنتر ميلان وستوك سيتي وليفربول، ومبارياته الدولية مع سويسرا، وتذكر أنه مسلم يحتفل مع ذلك بعيد الميلاد عادةَ أسرته منذ طفولته."
  en: "English Wikipedia article on Xherdan Shaqiri; used for entity facts only. It recounts his Kosovo childhood and emigration to Switzerland, his career at Basel, Bayern Munich, Inter Milan, Stoke City and Liverpool and his Switzerland internationals, and states that he is a Muslim who nonetheless celebrates Christmas, a family custom from his childhood."
