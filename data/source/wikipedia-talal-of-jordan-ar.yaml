summary:
  ar: "مقالة ويكيبيديا العربية عن الملك طلال بن عبد الله بن الحسين (1909–1972)؛ تُستخدم لوقائع الكيان فقط. تؤكد مولده في مكة في 26 فبراير 1909 ووفاته في إسطنبول في 7 يوليو 1972 ونسبه إلى أبيه عبد الله الأول وابنه الحسين. لا تذكر دينا ولا مذهبا له."
  en: "Arabic Wikipedia article on King Talal bin Abdullah (1909–1972); used for entity facts only. It confirms his birth in Mecca on 26 February 1909, his death in Istanbul on 7 July 1972, and his filiation to Abdullah I and to his son Hussein. It names no religion or school for him."
  es: "Artículo de Wikipedia en árabe sobre el rey Talal bin Abdullah (1909-1972); utilizado únicamente para datos sobre su persona. Confirma su nacimiento en La Meca el 26 de febrero de 1909, su muerte en Estambul el 7 de julio de 1972 y su parentesco con Abdullah I y su hijo Hussein. No menciona su religión ni su escuela religiosa."
  fr: "L'article de Wikipédia en arabe consacré au roi Talal bin Abdullah (1909-1972) est utilisé uniquement à des fins d'information. Il confirme sa naissance à La Mecque le 26 février 1909, son décès à Istanbul le 7 juillet 1972, ainsi que sa filiation avec Abdullah Ier et son fils Hussein. Aucune mention n'est faite de sa religion ou de son école religieuse."
  ur: "شاہ طلال بن عبداللہ (1909–1972) پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 26 فروری 1909 کو مکہ میں ان کی پیدائش، 7 جولائی 1972 کو استنبول میں ان کی موت، اور عبداللہ اول اور ان کے بیٹے حسین سے ان کی وابستگی کی تصدیق کرتا ہے۔ اس میں اس کے لیے کسی مذہب یا اسکول کا نام نہیں ہے۔"
  tr: "Kral Talal bin Abdullah bin Al-Hussein (1909–1972) hakkında Arapça Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 26 Şubat 1909'da Mekke'de doğduğunu, 7 Temmuz 1972'de İstanbul'da öldüğünü ve babası Abdullah I ile oğlu Hüseyin'e olan soyundan geldiğini doğrular. Herhangi bir dini veya mezhebinden bahsetmemektedir."
  id: "Artikel Wikipedia berbahasa Arab tentang Raja Talal bin Abdullah bin Al-Hussein (1909–1972); digunakan hanya untuk fakta entitas tersebut. Artikel ini mengonfirmasi kelahirannya di Mekah pada 26 Februari 1909, kematiannya di Istanbul pada 7 Juli 1972, serta garis keturunannya dari ayahnya Abdullah I dan putranya Hussein. Artikel tersebut tidak menyebutkan agama atau sekte apapun darinya."
