  ar: "مقالة ويكيبيديا العربية عن الملك طلال بن عبد الله بن الحسين (1909–1972)؛ تُستخدم لوقائع الكيان فقط. تؤكد مولده في مكة في 26 فبراير 1909 ووفاته في إسطنبول في 7 يوليو 1972 ونسبه إلى أبيه عبد الله الأول وابنه الحسين. لا تذكر دينا ولا مذهبا له."
