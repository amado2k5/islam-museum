summary:
  ar: "مقالة ويكيبيديا العربية عن خالد حسيني، الروائي الأفغاني الأمريكي؛ توافق المقالة الإنجليزية على مولده في كابل في ٤ آذار ١٩٦٥ وانتقال أسرته إلى الولايات المتحدة ورواياته، ولا تحمل وصف المقالة الإنجليزية له بأنه مسلم علماني."
  en: "Arabic Wikipedia article on Khaled Hosseini, the Afghan-American novelist; it agrees with the English article on his birth in Kabul on 4 March 1965, his family's move to the United States and his novels, and does not carry the English article's secular-Muslim self-description."
  es: "Artículo en árabe de la Wikipedia sobre Khaled Hosseini, el novelista afgano-estadounidense; coincide con el artículo en inglés sobre su nacimiento en Kabul el 4 de marzo de 1965, la mudanza de su familia a Estados Unidos y sus novelas, y no incluye la autodescripción de musulmán secular que aparece en el artículo en inglés."
  fr: "L'article de Wikipédia en arabe sur Khaled Hosseini, le romancier afghano-américain, est en accord avec l'article en anglais concernant sa naissance à Kaboul le 4 mars 1965, le déménagement de sa famille aux États-Unis et ses romans, mais ne reprend pas l'autodescription laïque et musulmane de l'article en anglais."
