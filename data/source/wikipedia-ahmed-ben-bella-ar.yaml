  ar: "مقالة ويكيبيديا العربية عن أحمد بن بلة؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 25 ديسمبر 1916 في مغنية لعائلة قدمت من مراكش، وتعليمه الأول في الزاوية القرآنية التي كان والده مقدما فيها، ومسيرته العسكرية والسياسية، ودفنه في مربع الشهداء بمقبرة العالية."
  en: "Arabic Wikipedia article on Ahmed Ben Bella; used for entity facts only. It gives his birth on 25 December 1916 at Maghnia to a family that had come from Marrakech, his first schooling in the Qur'anic zawiya where his father was muqaddam, his military and political career, and his burial in the Martyrs' Square of El Alia Cemetery."
