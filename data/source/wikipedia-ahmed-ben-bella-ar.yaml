summary:
  ar: "مقالة ويكيبيديا العربية عن أحمد بن بلة؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 25 ديسمبر 1916 في مغنية لعائلة قدمت من مراكش، وتعليمه الأول في الزاوية القرآنية التي كان والده مقدما فيها، ومسيرته العسكرية والسياسية، ودفنه في مربع الشهداء بمقبرة العالية."
  en: "Arabic Wikipedia article on Ahmed Ben Bella; used for entity facts only. It gives his birth on 25 December 1916 at Maghnia to a family that had come from Marrakech, his first schooling in the Qur'anic zawiya where his father was muqaddam, his military and political career, and his burial in the Martyrs' Square of El Alia Cemetery."
  es: "Artículo de Wikipedia en árabe sobre Ahmed Ben Bella; utilizado únicamente para datos sobre la persona. Describe su nacimiento el 25 de diciembre de 1916 en Maghnia, en el seno de una familia procedente de Marrakech; su primera educación en la zawiya coránica, donde su padre era muqaddam; su carrera militar y política; y su entierro en la Plaza de los Mártires del Cementerio de El Alia."
  fr: "Article de Wikipédia en arabe sur Ahmed Ben Bella; utilisé uniquement pour les informations factuelles. Il indique sa naissance le 25 décembre 1916 à Maghnia, dans une famille originaire de Marrakech, sa première scolarité dans la zawiya coranique où son père était muqaddam, sa carrière militaire et politique, et son inhumation au cimetière El Alia, place des Martyrs."
  ur: "احمد بن بیلا پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 25 دسمبر 1916 کو مگنیہ میں ایک ایسے خاندان میں پیدا ہوا جو مراکیچ سے آیا تھا، اس کی پہلی تعلیم قرآنی زاویہ میں ہوئی جہاں اس کے والد مقدم تھے، اس کا فوجی اور سیاسی کیریئر تھا، اور ان کی تدفین ال عالیہ قبرستان کے شہداء اسکوائر میں ہوئی۔"
  tr: "Ahmed bin Bella hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 25 Aralık 1916'da Maghnia'da Marakeş'ten gelen bir ailede doğdu; babasının sunuculuk yaptığı Kur'an Zawiya'daki ilk eğitimi, askeri ve siyasi kariyeri ve Al-Alia mezarlığındaki Şehitler Meydanı'na defnedildi."
  id: "Artikel Wikipedia bahasa Arab tentang Ahmed bin Bella; digunakan hanya untuk fakta entitas. Ia lahir pada 25 Desember 1916 di Maghnia dari keluarga yang berasal dari Marrakech, pendidikan awalnya di Qur'an zawiya tempat ayahnya menjadi presenter, karier militer dan politiknya, serta pemakamannya di Alun-Alun Syuhada di pemakaman Al-Alia."
