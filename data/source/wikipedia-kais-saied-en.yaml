summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن قيس سعيد؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في تونس سنة 1958 وتدريسه القانون الدستوري، وفوزه بانتخابات 2019 الرئاسية، وإجراءاته الاستثنائية في يوليو 2021 ودستور 2022 وإعادة انتخابه سنة 2024."
  en: "English Wikipedia article on Kais Saied; used for entity facts only. It recounts his birth at Tunis in 1958, his career teaching constitutional law, his victory in the 2019 presidential election, his July 2021 measures, the 2022 constitution and his re-election in 2024."
  es: "Artículo de la Wikipedia en inglés sobre Kais Saied; utilizado únicamente para datos sobre la persona. Relata su nacimiento en Túnez en 1958, su trayectoria como profesor de derecho constitucional, su victoria en las elecciones presidenciales de 2019, sus medidas de julio de 2021, la constitución de 2022 y su reelección en 2024."
  fr: "Article de Wikipédia en anglais sur Kais Saied; utilisé uniquement à des fins d’information sur l’entité. Il retrace sa naissance à Tunis en 1958, sa carrière d’enseignant de droit constitutionnel, sa victoire à l’élection présidentielle de 2019, ses mesures de juillet 2021, la constitution de 2022 et sa réélection en 2024."
  ur: "Kais Said پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 1958 میں تیونس میں ان کی پیدائش، آئینی قانون کی تعلیم دینے والے اپنے کیریئر، 2019 کے صدارتی انتخابات میں ان کی فتح، جولائی 2021 کے ان کے اقدامات، 2022 کے آئین اور 2024 میں ان کے دوبارہ انتخاب کا ذکر ہے۔"
