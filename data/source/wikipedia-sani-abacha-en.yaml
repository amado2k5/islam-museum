  ar: "مقالة ويكيبيديا الإنجليزية عن ساني أباتشا؛ تُستخدم لوقائع الكيان فقط. تصفه نصا بأنه «مسلم معلن» (professed Muslim)، وتروي ولادته في كانو، وانقلابه القصري في نوفمبر 1993 وحكمه حتى وفاته المفاجئة في أبوجا في 8 يونيو 1998، ودفنه في اليوم نفسه في كانو وفق التقاليد الإسلامية دون تشريح، واتهامات النهب الواسع في عهده."
  en: "English Wikipedia article on Sani Abacha; used for entity facts only. Its text calls him 'a professed Muslim', and it recounts his birth in Kano, his palace coup of November 1993 and rule until his sudden death in Abuja on 8 June 1998, his burial the same day in Kano according to Muslim tradition and without an autopsy, and the large-scale looting alleged against his regime."
