summary:
  ar: "مقال ريفاينري 29 المرافق لفيديو عن تجربة شهد بطل مسلمةً في أمريكا؛ يقول إن مدونة الجمال السودانية الأمريكية قررت لبس الحجاب قبل سنتين من المقال، وأن قناتها كانت تركز على دروس الشعر الطبيعي قبل أن تتوسع إلى العناية بالبشرة والمكياج ومدونات الحياة، وأنها انتقلت حديثًا من منيسوتا إلى لوس أنجلوس."
  en: "Refinery29's article accompanying its video on Shahd Batal's experience as a Muslim in America. It states that the Sudanese-American beauty blogger had decided to start wearing hijab two years earlier; that her YouTube channel had primarily focused on natural hair tutorials before expanding to skincare, makeup and lifestyle vlogs; and that she had recently moved from Minnesota to Los Angeles."
  es: "El artículo de Refinery29 que acompaña al video sobre la experiencia de Shahd Batal como musulmana en Estados Unidos afirma que la bloguera de belleza sudanesa-estadounidense había decidido empezar a usar hiyab dos años antes; que su canal de YouTube se había centrado principalmente en tutoriales de cabello natural antes de expandirse a vlogs sobre cuidado de la piel, maquillaje y estilo de vida; y que recientemente se había mudado de Minnesota a Los Ángeles."
  fr: "L'article de Refinery29 accompagnant sa vidéo sur l'expérience de Shahd Batal en tant que musulmane aux États-Unis indique que cette blogueuse beauté soudano-américaine avait décidé de porter le hijab deux ans auparavant; que sa chaîne YouTube était initialement consacrée aux tutoriels pour cheveux naturels avant de s'étendre aux soins de la peau, au maquillage et aux vlogs lifestyle; et qu'elle avait récemment déménagé du Minnesota à Los Angeles."
  ur: "Refinery29 کا مضمون اس کی ویڈیو کے ساتھ شاہد باتل کے امریکہ میں بطور مسلمان کے تجربے پر ہے۔ اس میں کہا گیا ہے کہ سوڈانی نژاد امریکی بیوٹی بلاگر نے دو سال قبل حجاب پہننا شروع کرنے کا فیصلہ کیا تھا۔ کہ اس کے یوٹیوب چینل نے اسکن کیئر، میک اپ اور لائف اسٹائل وی لاگز تک توسیع کرنے سے پہلے بنیادی طور پر بالوں کے قدرتی ٹیوٹوریلز پر توجہ مرکوز کی تھی۔ اور یہ کہ وہ حال ہی میں مینیسوٹا سے لاس اینجلس منتقل ہوئی تھی۔"
