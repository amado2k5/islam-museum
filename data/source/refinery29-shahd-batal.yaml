summary:
  ar: "مقال ريفاينري 29 المرافق لفيديو عن تجربة شهد بطل مسلمةً في أمريكا؛ يقول إن مدونة الجمال السودانية الأمريكية قررت لبس الحجاب قبل سنتين من المقال، وأن قناتها كانت تركز على دروس الشعر الطبيعي قبل أن تتوسع إلى العناية بالبشرة والمكياج ومدونات الحياة، وأنها انتقلت حديثًا من منيسوتا إلى لوس أنجلوس."
  en: "Refinery29's article accompanying its video on Shahd Batal's experience as a Muslim in America. It states that the Sudanese-American beauty blogger had decided to start wearing hijab two years earlier; that her YouTube channel had primarily focused on natural hair tutorials before expanding to skincare, makeup and lifestyle vlogs; and that she had recently moved from Minnesota to Los Angeles."
