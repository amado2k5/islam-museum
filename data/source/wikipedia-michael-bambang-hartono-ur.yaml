summary:
  ar: "مقالة ويكيبيديا الأردية عن مايكل بامبانغ هارتونو، المولود في 2 تشرين الأول 1939 في كودوس والمتوفى في 19 آذار 2026، الذي ورث مع أخيه رابرٹ بوڈي شركة جاروم سنة 1963 وبنى معه مجموعة جاروم وبنك سنترال آسيا؛ تذكر دراسته في جامعة ديبونيغورو ومسيرته في البريدج."
  en: "Urdu Wikipedia article on Michael Bambang Hartono, born 2 October 1939 in Kudus and died 19 March 2026, who inherited Djarum with his brother Robert Budi in 1963 and built the Djarum Group and Bank Central Asia with him; it records his studies at Diponegoro University and his bridge career."
  es: "Artículo en urdu de la Wikipedia sobre Michael Bambang Hartono, nacido el 2 de octubre de 1939 en Kudus y fallecido el 19 de marzo de 2026, quien heredó Djarum con su hermano Robert Budi en 1963 y construyó el Grupo Djarum y el Banco Asia Central con él; en él se recogen sus estudios en la Universidad de Diponegoro y su trayectoria profesional en el bridge."
  fr: "Article de Wikipédia en ourdou sur Michael Bambang Hartono, né le 2 octobre 1939 à Kudus et décédé le 19 mars 2026, qui a hérité de Djarum avec son frère Robert Budi en 1963 et a construit avec lui le groupe Djarum et la Bank Central Asia; il relate ses études à l'université Diponegoro et sa carrière de joueur de bridge."
  ur: "مائیکل بامبنگ ہارٹونو پر اردو ویکیپیڈیا کا مضمون، کدوس میں 2 اکتوبر 1939 کو پیدا ہوا اور 19 مارچ 2026 کو فوت ہوا، جنہوں نے 1963 میں اپنے بھائی رابرٹ بوڈی کے ساتھ دجارم کو وراثت میں حاصل کیا اور اس کے ساتھ جارم گروپ اور بینک سینٹرل ایشیا بنایا؛ یہ ڈیپونیگورو یونیورسٹی میں ان کی تعلیم اور اس کے پل کیریئر کو ریکارڈ کرتا ہے۔"
  tr: "Michael Bambang Hartono hakkında Urduca Wikipedia makalesi; 2 Ekim 1939'da Kudus'ta doğup 19 Mart 2026'da vefat etti; 1963'te kardeşi Robert Bodhi ile birlikte Jarum şirketini devraldı ve onlarla birlikte Jarum Grubu ve Central Asia Bankası'nı kurdu; Debonguru Üniversitesi'ndeki eğitimini ve Bridge'deki yolculuğunu hatırlıyor."
  id: "Artikel Wikipedia Urdu tentang Michael Bambang Hartono, lahir pada 2 Oktober 1939 di Kudus dan meninggal pada 19 Maret 2026, yang mewarisi perusahaan Jarum pada tahun 1963 bersama saudaranya Robert Bodhi dan membangun Grup Jarum serta Bank Asia Tengah bersama mereka; ia mengenang studinya di Universitas Debonguru dan perjalanannya di Bridge."
