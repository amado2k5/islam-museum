summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ضياء عنايت خان ⁦(مواليد 1971)⁩، عالم ومعلّم للتصوف في سلالة جدّه عنايت خان، رئيس الطريقة العنايتية ومؤسس أكاديمية سلوك؛ تسرد نشأته في نوفاتو بكاليفورنيا ودراسته في ديوك وكلية الدراسات الشرقية والأفريقية وتأكيده خليفةً لوالده ولاية سنة 2001 وكتبه."
  en: "The English Wikipedia article on Zia Inayat Khan (born 1971), scholar and teacher of Sufism in the lineage of his grandfather Inayat Khan, president of the Inayatiyya and founder of Suluk Academy; it covers his birth in Novato, California, his studies at Duke and SOAS, his confirmation as successor to his father Vilayat in 2001, and his books."
  es: "El artículo de la Wikipedia en inglés sobre Zia Inayat Khan (nacido en 1971), erudito y maestro de sufismo en el linaje de su abuelo Inayat Khan, presidente de la Inayatiyya y fundador de la Academia Suluk; abarca su nacimiento en Novato, California, sus estudios en Duke y SOAS, su confirmación como sucesor de su padre Vilayat en 2001 y sus libros."
  fr: "L'article de Wikipédia en anglais sur Zia Inayat Khan (né en 1971), érudit et enseignant du soufisme dans la lignée de son grand-père Inayat Khan, président de l'Inayatiyya et fondateur de l'Académie Suluk; il couvre sa naissance à Novato, en Californie, ses études à Duke et à SOAS, sa confirmation comme successeur de son père Vilayat en 2001 et ses livres."
