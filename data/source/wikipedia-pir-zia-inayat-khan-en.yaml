  ar: "مقالة ويكيبيديا الإنجليزية عن ضياء عنايت خان (مواليد 1971)، عالم ومعلّم للتصوف في سلالة جدّه عنايت خان، رئيس الطريقة العنايتية ومؤسس أكاديمية سلوك؛ تسرد نشأته في نوفاتو بكاليفورنيا ودراسته في ديوك وكلية الدراسات الشرقية والأفريقية وتأكيده خليفةً لوالده ولاية سنة 2001 وكتبه."
  en: "The English Wikipedia article on Zia Inayat Khan (born 1971), scholar and teacher of Sufism in the lineage of his grandfather Inayat Khan, president of the Inayatiyya and founder of Suluk Academy; it covers his birth in Novato, California, his studies at Duke and SOAS, his confirmation as successor to his father Vilayat in 2001, and his books."
