summary:
  ar: "عنصر ويكيداتا Q7295346 لراسونا سعيد؛ يحمل ميلادها في 14 أيلول 1910 ووفاتها في 2 تشرين الثاني 1965 ومكان وفاتها جاكرتا، ويعطي ديانتها «الإسلام» إجمالًا دون مذهب."
  en: "Wikidata item Q7295346 for Rasuna Said; it carries her birth on 14 September 1910, her death on 2 November 1965 and Jakarta as her place of death, and gives her religion as Islam in general, with no school."
  es: "El elemento Q7295346 de Wikidata corresponde a Rasuna Said; en él figuran su fecha de nacimiento el 14 de septiembre de 1910, su fallecimiento el 2 de noviembre de 1965 y Yakarta como lugar de su muerte, y se indica que su religión era el Islam en general, sin mencionar ninguna escuela."
  fr: "L'élément Wikidata Q7295346 pour Rasuna Said; il indique sa naissance le 14 septembre 1910, sa mort le 2 novembre 1965 et Jakarta comme lieu de décès, et donne sa religion comme étant l'islam en général, sans école."
  ur: "ویکی ڈیٹا آئٹم Q7295346 برائے رسونا سید؛ یہ 14 ستمبر 1910 کو اس کی پیدائش، 2 نومبر 1965 کو اس کی موت اور جکارتہ کو اس کی موت کی جگہ کے طور پر رکھتا ہے، اور اس کا مذہب عام طور پر اسلام کے طور پر دیتا ہے، جس میں کوئی اسکول نہیں ہے۔"
  tr: "Wikidata öğesi Q7295346 Rasona Said; 14 Eylül 1910'da doğumunu ve 2 Kasım 1965'teki ölümünü Jakarta'da ölüm yeri olarak gösterir ve dini genel olarak \"İslam\" olarak herhangi bir mezhep olmadan verilmektedir."
  id: "Elemen Wikidata Q7295346 Rasona Said; buku ini mencatat kelahirannya pada 14 September 1910, dan kematiannya pada 2 November 1965, dengan Jakarta sebagai tempat kematiannya, serta mencantumkan agamanya sebagai \"Islam\" secara umum tanpa sekte apapun."
