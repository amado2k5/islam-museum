summary:
  ar: "صفحة «أبطال سيراليون: عصر تمرد 1898» في موقع سيراليون ويب، وتضم سيرًا شعبية لباي بوريه وألمامي سولوكو ونياگوا وكپانا لويس ومدام يوكو؛ تروي في سيرة سولوكو نسبه إلى سانكيلاي زعيم بيريوا، وقيادته العسكرية بوصفه كوروغبا ثم تتويجه گباكو (ملكًا)، وحمايته لتجارة بومبان، ومناورته بين البريطانيين وقوات ساموري توريه التي احتلت بيريوا سنة 1884، وإرساله سرًا المحاربين والسلاح إلى باي بوريه سنة 1898 مع إظهار الولاء للبريطانيين، وقوله المشهور «سولوكو لن يموت» حين طُلب منه تسمية خليفته؛ وتروي في سيرة باي بوريه تدريبه في گبندمبو ولقبه كبَالاي وخدمته في شبابه تحت حاكم سوسو في جهاد طويل لإقامة الممارسات الإسلامية الصحيحة وتتويجه حاكمًا على كاسيه سنة 1886 وأسره في 11 نوفمبر 1898 ونفيه إلى ساحل الذهب وعودته سنة 1905 ووفاته سنة 1908."
  en: "The Sierra Leone Web page 'Sierra Leonean Heroes: 1898 Rebellion Era', carrying popular biographies of Bai Bureh, Almamy Suluku, Nyagua, Kpana Lewis and Madam Yoko. Its Suluku biography recounts his descent from Sankailay, chief of Biriwa, his rise as Kurugba (war captain) and crowning as Gbaku (king), his protection of the trade through Bumban, his manoeuvring between the British and Samori Touré's Mandinka forces, who occupied Biriwa in 1884, his secretly sending warriors and weapons to Bai Bureh in 1898 while professing loyalty to the British, and his famous reply when asked to name a successor: 'Suluku will never die'. Its Bai Bureh biography recounts his training at Gbendembu, his nickname Kebalai, his youthful service under a Soso ruler in a long jihad to establish correct Islamic practices, his crowning as ruler of Kasseh in 1886, his capture on 11 November 1898, exile to the Gold Coast, return in 1905 and death in 1908."
