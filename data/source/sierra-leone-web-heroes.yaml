summary:
  ar: "صفحة «أبطال سيراليون: عصر تمرد 1898» في موقع سيراليون ويب، وتضم سيرًا شعبية لباي بوريه وألمامي سولوكو ونياگوا وكپانا لويس ومدام يوكو؛ تروي في سيرة سولوكو نسبه إلى سانكيلاي زعيم بيريوا، وقيادته العسكرية بوصفه كوروغبا ثم تتويجه گباكو ⁦(ملكًا)⁩، وحمايته لتجارة بومبان، ومناورته بين البريطانيين وقوات ساموري توريه التي احتلت بيريوا سنة 1884، وإرساله سرًا المحاربين والسلاح إلى باي بوريه سنة 1898 مع إظهار الولاء للبريطانيين، وقوله المشهور «سولوكو لن يموت» حين طُلب منه تسمية خليفته؛ وتروي في سيرة باي بوريه تدريبه في گبندمبو ولقبه كبَالاي وخدمته في شبابه تحت حاكم سوسو في جهاد طويل لإقامة الممارسات الإسلامية الصحيحة وتتويجه حاكمًا على كاسيه سنة 1886 وأسره في 11 نوفمبر 1898 ونفيه إلى ساحل الذهب وعودته سنة 1905 ووفاته سنة 1908."
  en: "The Sierra Leone Web page 'Sierra Leonean Heroes: 1898 Rebellion Era', carrying popular biographies of Bai Bureh, Almamy Suluku, Nyagua, Kpana Lewis and Madam Yoko. Its Suluku biography recounts his descent from Sankailay, chief of Biriwa, his rise as Kurugba (war captain) and crowning as Gbaku (king), his protection of the trade through Bumban, his manoeuvring between the British and Samori Touré's Mandinka forces, who occupied Biriwa in 1884, his secretly sending warriors and weapons to Bai Bureh in 1898 while professing loyalty to the British, and his famous reply when asked to name a successor: 'Suluku will never die'. Its Bai Bureh biography recounts his training at Gbendembu, his nickname Kebalai, his youthful service under a Soso ruler in a long jihad to establish correct Islamic practices, his crowning as ruler of Kasseh in 1886, his capture on 11 November 1898, exile to the Gold Coast, return in 1905 and death in 1908."
  es: "La página web de Sierra Leona «Héroes de Sierra Leona: Era de la Rebelión de 1898» incluye biografías populares de Bai Bureh, Almamy Suluku, Nyagua, Kpana Lewis y Madam Yoko. La biografía de Suluku narra su descendencia de Sankailay, jefe de Biriwa, su ascenso como Kurugba (capitán de guerra) y su coronación como Gbaku (rey), su protección del comercio a través de Bumban, sus maniobras entre los británicos y las fuerzas mandinka de Samori Touré, que ocuparon Biriwa en 1884, el envío secreto de guerreros y armas a Bai Bureh en 1898 mientras profesaba lealtad a los británicos, y su famosa respuesta cuando se le pidió que nombrara a un sucesor: «Suluku nunca morirá». La biografía de Bai Bureh relata su formación en Gbendembu, su apodo Kebalai, su servicio juvenil bajo un gobernante Soso en una larga yihad para establecer las prácticas islámicas correctas, su coronación como gobernante de Kasseh en 1886, su captura el 11 de noviembre de 1898, su exilio a la Costa de Oro, su regreso en 1905 y su muerte en 1908."
  fr: "La page web sierra-léonaise « Héros sierra-léonais: l'ère de la rébellion de 1898 » propose des biographies populaires de Bai Bureh, Almamy Suluku, Nyagua, Kpana Lewis et Madame Yoko. La biographie de Suluku retrace sa descendance de Sankailay, chef de Biriwa, son ascension au grade de Kurugba (capitaine de guerre) et son couronnement en tant que Gbaku (roi), sa protection du commerce via Bumban, ses manœuvres entre les Britanniques et les forces mandingues de Samori Touré, qui occupaient Biriwa en 1884, l'envoi secret de guerriers et d'armes à Bai Bureh en 1898 tout en professant sa loyauté aux Britanniques, et sa célèbre réponse lorsqu'on lui demanda de nommer un successeur: « Suluku ne mourra jamais ». Sa biographie de Bai Bureh relate sa formation à Gbendembu, son surnom Kebalai, son service de jeunesse sous un souverain Soso dans un long jihad pour établir des pratiques islamiques correctes, son couronnement comme souverain de Kasseh en 1886, sa capture le 11 novembre 1898, son exil sur la Côte-de-l'Or, son retour en 1905 et sa mort en 1908."
  ur: "سیرا لیون کا ویب صفحہ 'سیرا لیونین ہیروز: 1898 ریبیلین ایرا'، جس میں بائی بورہ، المامی سولوکو، نیاگوا، کپانا لیوس اور میڈم یوکو کی مشہور سوانح حیات شامل ہیں۔ اس کی سولوکو کی سوانح عمری بیان کرتی ہے کہ بریوا کے سردار سنکیلے سے اس کا نزول، کروگبا ⁦(جنگی کپتان)⁩ کے طور پر اس کا عروج اور گباکو ⁦(بادشاہ)⁩ کے طور پر اس کی تاج پوشی، بمبن کے ذریعے اس کی تجارت کا تحفظ، برطانوی اور ساموری ٹوری کی منڈینکا افواج کے درمیان اس کی چالبازی، جنہوں نے بیروا پر قبضہ کیا، 188 میں خفیہ طور پر اپنے فوجیوں کو بھیجنے کے بارے میں بتایا ہے۔ 1898 میں انگریزوں کے ساتھ وفاداری کا دعویٰ کرتے ہوئے، اور جب کسی جانشین کا نام لینے کے لیے پوچھا گیا تو اس کا مشہور جواب: 'سولوکو کبھی نہیں مرے گا'۔ اس کی بائی بورہ کی سوانح عمری میں گبینمبو میں اس کی تربیت، اس کا عرفی نام کبلائی، صحیح اسلامی طریقوں کو قائم کرنے کے لیے ایک طویل جہاد میں ایک سوسو حکمران کے تحت اس کی نوجوانی کی خدمات، 1886 میں کسے کے حکمران کی حیثیت سے اس کی تاج پوشی، 11 نومبر 1898 کو اس کی گرفتاری، گولڈ کوسٹ میں جلاوطنی، 1909 میں واپسی اور موت کے بارے میں بتایا گیا ہے۔"
  tr: "Sierra Leone Web'deki 'Sierra Leone Kahramanları: 1898 İsyanı Dönemi' sayfasında Pai Buri, Almami Soloko, Nyagwa, Kapana Lewis ve Madame Yoko'nun popüler biyografileri yer alır; Soloko'nun biyografisi, soyunu Berewa'nın lideri Sankelai'ye, askeri liderliğine Kurugba olarak, ardından Gpaku'nun (kral) taç giymesini, Bombane ticaretini korumasını, 1884'te Berewa'yı işgal eden İngilizler ile Samori Tori kuvvetleri arasındaki manevralarını, 1898'de İngilizlere sadakatini gösterirken Bai Bureh'e gizlice savaşçı ve silah göndermesini ve sorulduğunda ünlü 'Soloko ölmeyecek' sözünü anlatır Halefinin adı; Bey Burier'in biyografisi, Gbandembbo'daki eğitimini, Kabalai unvanını, gençliğinde Sosso valisi altında uygun İslami uygulamaları kurma mücadelesindeki hizmetini, 1886'da Kasse valisi olarak taç giymesini, 11 Kasım 1898'de yakalanmasını, Altın Kıyı'ya sürgününü, 1905'te dönüşünü ve 1908'deki ölümünü anlatır."
  id: "Halaman 'Pahlawan Sierra Leone: Era Pemberontakan 1898' di Sierra Leone Web memuat biografi populer Pai Buri, Almami Soloko, Nyagwa, Kapana Lewis, dan Madame Yoko; biografi Soloko menceritakan garis keturunannya kepada Sankelai pemimpin Berewa, kepemimpinan militernya sebagai Kurugba, kemudian penobatan Gpaku (raja), perlindungannya atas perdagangan Bombane, manuvernya antara pasukan Inggris dan Samori Tori yang menduduki Berewa pada tahun 1884, pengiriman rahasia prajurit dan senjata ke Bai Bureh pada tahun 1898 sambil menunjukkan kesetiaan kepada Inggris, serta pepatah terkenalnya 'Soloko tidak akan mati' saat ditanya Nama penerusnya; biografi Bey Burier menceritakan pendidikannya di Gbandembbo, gelar Kabalai, pengabdiannya di masa muda di bawah gubernur Sosso dalam perjuangan panjang untuk menegakkan praktik Islam yang benar, penobatannya sebagai gubernur Kasse pada tahun 1886, penangkapannya pada 11 November 1898, pengasingannya ke Pantai Emas, kepulangannya pada tahun 1905, dan kematiannya pada tahun 1908."
