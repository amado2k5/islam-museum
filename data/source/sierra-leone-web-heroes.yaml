reliability_note: "An unsigned popular-history page, read in full on 25 October 2026; its Suluku biography tracks the standard scholarly account, C. Magbaily Fyle, Almamy Suluku of Sierra Leone, c. 1820-1906: the dynamics of political leadership in pre-colonial Sierra Leone (Evans Brothers, 1979), whose existence and details are confirmed by its review in Africa: Journal of the International African Institute 50/4 (1980) — the monograph itself was not opened in this run, and no fact in the records cites it directly. The page's Bai Bureh biography is one of the sources behind the English Wikipedia article's account and agrees with it in outline while differing in two details the record states rather than merges: it dates Bureh's crowning at Kasseh, and his taking of the Bai Bureh title, to 1886, and it describes his father as a Loko war-chief where the English and French articles describe him as a Muslim cleric and ulama."
