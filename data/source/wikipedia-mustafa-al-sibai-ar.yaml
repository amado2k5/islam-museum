  ar: "مقالة ويكيبيديا العربية «مصطفى السباعي» ⁦(1333–1384هـ / 1915–1964م)⁩: عالم فقيه وداعية وسياسي، أول سوري ينال الدكتوراه في الشريعة من الأزهر (1949)، ومؤسس كلية الشريعة بجامعة دمشق وأول عميد لها (1955)، ومؤسس الإخوان المسلمين في سوريا وأول مراقب عام لها (1945)؛ تذكر نشأته في حمص واعتقالاته وصحافته ⁦(المنار، الشهاب، المسلمون، حضارة الإسلام)⁩ ونيابته (1949) وقائمة مؤلفاته ومرضه بالشلل النصفي ثماني سنوات ووفاته في 3 أكتوبر 1964."
  en: "Arabic Wikipedia article 'Mustafa al-Siba'i' (1333–1384 AH / 1915–1964 CE): jurist, preacher and politician; the first Syrian to earn a doctorate in Sharia from al-Azhar (1949); founder of Damascus University's Faculty of Sharia and its first dean (1955); founder of the Muslim Brotherhood in Syria and its first General Guide (1945). It records his Homs upbringing, arrests, journalism (al-Manar, al-Shihab, al-Muslimun, Hadarat al-Islam), his 1949 parliamentary seat, his works, eight years of hemiparesis, and his death on 3 October 1964."
