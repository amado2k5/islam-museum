reliability_note: "His own autobiographical text, a primary source for his self-presentation and never independent corroboration. In it he describes beginning Qur'an courses at seven or eight, studying Qur'an, tajwid and ilm al-hal, turning to fiqh and then to the hadith collections, and — in his own telling — a later journey in the Halid-i Haki branch of the Naqshbandi order, begun through students of İhramcızade İsmail Hakkı Efendi of Sivas, after which he took up preaching. That is one prose text, his own; no second independent prose text read in this build names a school or order for him, so it does not settle his faith under the lane's two-source rule. The page gives no birth date or birthplace, and none is recorded from it. Its honorifics and quoted scripture are not reproduced in the museum's records. Read in full on 16 November 2026."
