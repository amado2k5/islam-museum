summary:
  ar: "مقالة ويكيبيديا العربية عن السلطان أبي بكر الجوهري؛ تُستخدم لوقائع الكيان فقط. مقالة قصيرة تعطي تاريخيه ⁦(3 شباط 1833 – 4 حزيران 1895)⁩ وكونه سلطان جوهر الحادي والعشرين وأول سلاطين جوهر الحديثة وإصلاحاته على النمط الغربي وصداقته للملكة فيكتوريا. لا تحمل في متنها بيان ديانة؛ ويضع أحد تصنيفاتها وفاته في «التهاب الكلى» خلافًا لالتهاب الرئة في متن المقالة الإنجليزية."
  en: "Arabic Wikipedia article on Abu Bakar, Sultan of Johor; used for entity facts only. A short article giving his dates (3 February 1833 – 4 June 1895), his position as 21st Sultan of Johor and first sultan of modern Johor, his Western-style reforms and his friendship with Queen Victoria. It carries no religion datum in its text; one of its category filings places his death under nephritis, against the pneumonia of the English article's text."
  es: "Artículo en árabe de la Wikipedia sobre Abu Bakar, sultán de Johor; utilizado únicamente para datos sobre la persona. Un breve artículo que detalla sus fechas (3 de febrero de 1833 - 4 de junio de 1895), su cargo como 21.º sultán de Johor y primer sultán del Johor moderno, sus reformas de estilo occidental y su amistad con la reina Victoria. No incluye información sobre su religión; una de sus categorías sitúa su muerte bajo la causa de nefritis, en contraposición a la neumonía que se menciona en el artículo en inglés."
  fr: "Article de Wikipédia en arabe sur Abou Bakr, sultan de Johor; utilisé uniquement à des fins d'information sur l'entité. Ce court article indique ses dates (3 février 1833 – 4 juin 1895), son statut de 21e sultan de Johor et premier sultan du Johor moderne, ses réformes inspirées de l'Occident et son amitié avec la reine Victoria. Il ne mentionne aucune religion; l'une de ses catégories classe son décès dans la catégorie « néphrite », contrairement à la pneumonie mentionnée dans l'article en anglais."
  ur: "جوہر کے سلطان ابوبکر پر عربی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ ایک مختصر مضمون جس میں ان کی تاریخیں ⁦(3 فروری 1833 - 4 جون 1895)⁩، جوہر کے 21ویں سلطان اور جدید جوہر کے پہلے سلطان کے طور پر ان کا مقام، ان کی مغربی طرز کی اصلاحات اور ملکہ وکٹوریہ کے ساتھ ان کی دوستی شامل ہے۔ اس کے متن میں کوئی مذہب نہیں ہے۔ اس کے زمرے کی فائلنگ میں سے ایک انگریزی مضمون کے متن کے نمونیا کے خلاف، ورم گردہ کے تحت اس کی موت کو درج کرتا ہے۔"
  tr: "Sultan Abu Bakr al-Jawhari hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Kısa bir makale, onun tarihini (3 Şubat 1833 – 4 Haziran 1895) Johor'un yirmi birinci sultanı ve modern Jowhar'ın ilk sultanı olarak, Batı tarzı reformlarını ve Kraliçe Victoria ile dostluğunu anlatır. Dini bir ifade içermez; sınıflandırmalarından biri ölümünü İngilizce makaledeki zatürrenin aksine, 'nefrit' olarak gösterir."
  id: "Artikel Wikipedia Arab tentang Sultan Abu Bakr al-Jawhari; digunakan hanya untuk fakta entitas. Sebuah artikel singkat yang menceritakan sejarahnya (3 Februari 1833 – 4 Juni 1895) sebagai Sultan Johor ke-21 dan Sultan pertama Jowhar modern, reformasi gaya Baratnya, serta persahabatannya dengan Ratu Victoria. Artikel tersebut tidak memuat pernyataan agama; salah satu klasifikasinya menempatkan kematiannya sebagai 'nefritis', berbeda dengan pneumonia dalam artikel bahasa Inggris."
