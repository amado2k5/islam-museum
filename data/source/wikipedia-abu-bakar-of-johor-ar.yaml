summary:
  ar: "مقالة ويكيبيديا العربية عن السلطان أبي بكر الجوهري؛ تُستخدم لوقائع الكيان فقط. مقالة قصيرة تعطي تاريخيه (3 شباط 1833 – 4 حزيران 1895) وكونه سلطان جوهر الحادي والعشرين وأول سلاطين جوهر الحديثة وإصلاحاته على النمط الغربي وصداقته للملكة فيكتوريا. لا تحمل في متنها بيان ديانة؛ ويضع أحد تصنيفاتها وفاته في «التهاب الكلى» خلافًا لالتهاب الرئة في متن المقالة الإنجليزية."
  en: "Arabic Wikipedia article on Abu Bakar, Sultan of Johor; used for entity facts only. A short article giving his dates (3 February 1833 – 4 June 1895), his position as 21st Sultan of Johor and first sultan of modern Johor, his Western-style reforms and his friendship with Queen Victoria. It carries no religion datum in its text; one of its category filings places his death under nephritis, against the pneumonia of the English article's text."
