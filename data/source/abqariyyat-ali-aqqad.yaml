label: { ar: "عبقرية الإمام علي", en: "The Genius of Imam Ali (Abqariyyat al-Imam Ali)" }
summary:
  ar: "كتاب لعباس محمود العقاد، كاتب مصري، وهو دراسة أدبية وتحليلية لشخصية علي بن أبي طالب وسيرته، وليس مونوغرافيا علمية تقليدية ولا كتاب تاريخ أولي. يقرأ المؤلف شخصية علي بمفتاح «آداب الفروسية» ⁦(النخوة)⁩ ويرد على ما نُسب إليه، ويتناول عصره وصراعه مع معاوية وقتلة عثمان والتحكيم والخوارج. ما يرويه المؤلف عن الأحداث يُستعمل هنا بوصفه قراءة المؤلف وروايته، وما يعرضه من تأويل شخصية وحكم على الأحداث يُنسب إليه ولا يُقدَّم حكماً للمتحف. تُستشهد به المتحف بصيغة {cite:abqariyyat-ali-aqqad p.N} حيث N رقم صفحة PDF للنسخة الممسوحة."
  en: "A literary and interpretive study of Ali ibn Abi Talib by the Egyptian writer Abbas Mahmud al-Aqqad, not a traditional scholarly monograph. The author reads Ali's character through the key of chivalry (nakhwa), answers what has been attributed to him, and treats his era, his conflict with Muawiya, the killers of Uthman, the arbitration and the Kharijites. Where the book narrates events it is cited as the author's narration; where it interprets character or passes judgement, the judgement is the author's. Cited as {cite:abqariyyat-ali-aqqad p.N}, N being the PDF page of the scanned copy."
  es: "Un estudio literario e interpretativo de Ali ibn Abi Talib del escritor egipcio Abbas Mahmud al-Aqqad, no una monografía académica tradicional. El autor analiza el carácter de Ali desde la perspectiva de la caballería (nakhwa), responde a las atribuciones que se le han hecho y aborda su época, su conflicto con Muawiya, los asesinos de Uthman, el arbitraje y los jariyíes. Cuando el libro narra eventos, se cita como narración del autor; cuando interpreta el carácter o emite juicios, el juicio es del autor. Citado como {cite:abqariyyat-ali-aqqad pN}, donde N es la página del PDF de la copia escaneada."
  fr: "Cette étude littéraire et interprétative d'Ali ibn Abi Talib, réalisée par l'écrivain égyptien Abbas Mahmud al-Aqqad, s'éloigne des monographies universitaires traditionnelles. L'auteur analyse le caractère d'Ali à travers le prisme de la chevalerie (nakhwa), répond aux questions qui lui ont été posées et aborde son époque, son conflit avec Muawiya, les assassins d'Uthman, l'arbitrage et les Kharijites. Les récits d'événements sont cités comme étant ceux de l'auteur; les interprétations de personnages et les jugements sont attribués à l'auteur. Référence: {cite:abqariyyat-ali-aqqad pN}, N correspondant à la page PDF de la copie numérisée."
