label: { ar: "عبقرية الإمام علي", en: "The Genius of Imam Ali (Abqariyyat al-Imam Ali)" }
summary:
  ar: "كتاب لعباس محمود العقاد، كاتب مصري، وهو دراسة أدبية وتحليلية لشخصية علي بن أبي طالب وسيرته، وليس مونوغرافيا علمية تقليدية ولا كتاب تاريخ أولي. يقرأ المؤلف شخصية علي بمفتاح «آداب الفروسية» (النخوة) ويرد على ما نُسب إليه، ويتناول عصره وصراعه مع معاوية وقتلة عثمان والتحكيم والخوارج. ما يرويه المؤلف عن الأحداث يُستعمل هنا بوصفه قراءة المؤلف وروايته، وما يعرضه من تأويل شخصية وحكم على الأحداث يُنسب إليه ولا يُقدَّم حكماً للمتحف. تُستشهد به المتحف بصيغة {cite:abqariyyat-ali-aqqad p.N} حيث N رقم صفحة PDF للنسخة الممسوحة."
  en: "A literary and interpretive study of Ali ibn Abi Talib by the Egyptian writer Abbas Mahmud al-Aqqad, not a traditional scholarly monograph. The author reads Ali's character through the key of chivalry (nakhwa), answers what has been attributed to him, and treats his era, his conflict with Muawiya, the killers of Uthman, the arbitration and the Kharijites. Where the book narrates events it is cited as the author's narration; where it interprets character or passes judgement, the judgement is the author's. Cited as {cite:abqariyyat-ali-aqqad p.N}, N being the PDF page of the scanned copy."
