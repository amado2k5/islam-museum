reliability_note: "Year: no year of publication is printed on the title page of the scanned copy (PDF p. 2). The colophon page (PDF p. 162) names المكتبة المصرية للطباعة والنشر and carries a date that reads as 1972 in the scan, but its wording refers to the distribution of the series, not to this edition's year; the year is therefore left unset here and must not be filled from memory. Author as printed: عباس محمود العقاد. The book opens with a foreword (تقديم) by مهدي عبد الحميد مصطفى, Azhar envoy in Lebanon (PDF pp. 14-15); the foreword is not the author's. The author's own introduction runs PDF pp. 16-18; the chapters are: صفاته (p. 19), مفتاح شخصيته (p. 33), إسلامه (p. 39), عصر الإمام (p. 47), البيعة (p. 58), سياسته (p. 92), حكومته (p. 120), النبي والإمام والصحابة (p. 128), ثقافته (p. 136), في بيته (p. 152), صورة مجملة (p. 157). All citations use the PDF page, not the printed page. The OCR is noisy in places; names and dates the book prints were checked against the page image where doubtful. The book contains no ISBN in the copy read."
