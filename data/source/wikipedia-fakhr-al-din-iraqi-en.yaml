reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). A Good Article. It gives his birth in 1213/14 at Komjan near Hamadan, his discipleship under Baha al-Din Zakariya, leader of the Multani branch of the Suhrawardiyya, and his brief succession after Zakariya's death in 1262; his move to Konya, where he studied with Sadr al-Din al-Qunawi and wrote the Lama'at; and his death at Damascus in 1289. Its historiography section warns that the Muqaddima, the main source for his life, may have been composed as late as the 15th century. Checked 2 November 2026."
