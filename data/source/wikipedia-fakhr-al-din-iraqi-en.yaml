  ar: "مقالة ويكيبيديا الإنجليزية عن فخر الدين العراقي (1213/14–1289)، الشاعر الصوفي صاحب «اللمعات»؛ مريد بهاء الدين زكريا السهروردي وخليفته زمنًا، وتلميذ صدر الدين القونوي في قونية؛ تُستخدم لوقائع الكيان فقط."
  en: "English Wikipedia article on Fakhr al-Din Iraqi (1213/14 - 1289), the Sufi poet of the Lama'at; disciple of the Suhrawardi master Baha al-Din Zakariya and briefly his successor, and a student of Sadr al-Din al-Qunawi in Konya; used for entity facts only."
