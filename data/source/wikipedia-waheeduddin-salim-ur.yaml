summary:
  ar: "مقالة ويكيبيديا الأردية عن وحيد الدين سليم؛ المصدر الرئيس لهذا السجل، إذ لا توجد له مقالة إنجليزية ولا عنصر ويكيداتا. تذكر مولده سنة 1869 في باني بت، وعمله سكرتيرًا لسر سيد أحمد خان، وتعيينه أول أستاذ مساعد للأردية في جامعة عثمانية، ووفاته سنة 1927."
  en: "Urdu Wikipedia article on Waheeduddin Salim; the primary source for this record, as he has no English Wikipedia article and no Wikidata item. It records his birth in 1869 at Panipat, his service as secretary to Sir Syed Ahmad Khan, his appointment as the first assistant professor of Urdu at Osmania University, and his death in 1927."
