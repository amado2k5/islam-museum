summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن جاكايا كيكويتي؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في مسوغا سنة 1950 ووزارته للخارجية (1995–2005) ورئاسته تنزانيا (2005–2015) ورئاسته الاتحاد الإفريقي. في حياته الشخصية تنص المقالة على أنه مسلم، مستشهدة بخبر لوكالة رويترز؛ ولا تسمي له مدرسة."
  en: "English Wikipedia article on Jakaya Kikwete; used for entity facts only. It recounts his birth at Msoga in 1950, his foreign ministry (1995–2005), his presidency of Tanzania (2005–2015) and his chairmanship of the African Union. Its personal-life section states that he is a Muslim, citing a Reuters news report; it names no school for him."
  es: "Artículo de la Wikipedia en inglés sobre Jakaya Kikwete; utilizado únicamente para obtener información sobre la persona. Relata su nacimiento en Msoga en 1950, su ministerio de Asuntos Exteriores (1995-2005), su presidencia de Tanzania (2005-2015) y su presidencia de la Unión Africana. En la sección sobre su vida personal, se indica que es musulmán, citando un informe de Reuters; no se menciona ninguna escuela a la que haya asistido."
  fr: "Article de Wikipédia en anglais sur Jakaya Kikwete; utilisé uniquement pour des informations sur l’entité. Il relate sa naissance à Msoga en 1950, son ministère des Affaires étrangères (1995-2005), sa présidence de la Tanzanie (2005-2015) et sa présidence de l’Union africaine. La section consacrée à sa vie personnelle indique qu’il est musulman, citant un article de Reuters; aucune mention n’est faite de son établissement scolaire."
