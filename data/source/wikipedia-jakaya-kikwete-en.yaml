  ar: "مقالة ويكيبيديا الإنجليزية عن جاكايا كيكويتي؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في مسوغا سنة 1950 ووزارته للخارجية (1995–2005) ورئاسته تنزانيا (2005–2015) ورئاسته الاتحاد الإفريقي. في حياته الشخصية تنص المقالة على أنه مسلم، مستشهدة بخبر لوكالة رويترز؛ ولا تسمي له مدرسة."
  en: "English Wikipedia article on Jakaya Kikwete; used for entity facts only. It recounts his birth at Msoga in 1950, his foreign ministry (1995–2005), his presidency of Tanzania (2005–2015) and his chairmanship of the African Union. Its personal-life section states that he is a Muslim, citing a Reuters news report; it names no school for him."
