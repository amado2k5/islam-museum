reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision via the MediaWiki API on 1 November 2026; a fact is used only where the article cites a source for it (Wikipedia broad rule). It records her birth in Rasht on 21 September 1969 — the date on her official French death registry entry, which the article notes corrects the long-published 22 November 1969 — her upbringing in Tehran, her schooling in Vienna from 1983, her master's degree from Islamic Azad University, her move to France, Persepolis and her other comics and films, the 2023 Woman, Life, Freedom anthology, the 2024 Princess of Asturias Award, her January 2025 refusal of the Legion of Honour, her marriage to Mattias Ripa (died April 2025) and her death in Paris on 3 June 2026, the death-certificate date, after reporting that also gave 4 June. Its category filings include 'French atheists' and 'Iranian atheists'; category filings are not evidence and are not used for her faith."
