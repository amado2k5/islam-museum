summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن راجا تشولان (1869–1933)، الأمير والإداري في بيراك؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 1 تموز 1869 في تانجونغ برامبانغ بكريان، وتعليمه في سنغافورة وملقا، ومسيرته الإدارية في بيراك، ودوره في قيام دول الملايو المتحدة سنة 1896، وتنصيبه «راجا دي هيلير بيراك» في 1 كانون الأول 1920، ووفاته في 10 نيسان 1933 في كوالا كانغسار ودفنه في الضريح الملكي؛ ويعطي صندوق معلوماتها دينه «الإسلام السني»."
  en: "English Wikipedia article on Raja Chulan (1869–1933), the Perak prince and administrator; used for entity facts only. It gives his birth on 1 July 1869 at Tanjung Brambang, Krian, his education at Raffles Institution in Singapore and Malacca High School, his administrative career in Perak, his part in forming the Federated Malay States in 1896, his conferment as Raja Di-Hilir Perak on 1 December 1920, his death on 10 April 1933 at Kuala Kangsar and his burial in the Al-Ghufran Royal Mausoleum; its infobox gives his religion as Sunni Islam."
