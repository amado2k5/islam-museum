summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن راجا تشولان (1869–1933)، الأمير والإداري في بيراك؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 1 تموز 1869 في تانجونغ برامبانغ بكريان، وتعليمه في سنغافورة وملقا، ومسيرته الإدارية في بيراك، ودوره في قيام دول الملايو المتحدة سنة 1896، وتنصيبه «راجا دي هيلير بيراك» في 1 كانون الأول 1920، ووفاته في 10 نيسان 1933 في كوالا كانغسار ودفنه في الضريح الملكي؛ ويعطي صندوق معلوماتها دينه «الإسلام السني»."
  en: "English Wikipedia article on Raja Chulan (1869–1933), the Perak prince and administrator; used for entity facts only. It gives his birth on 1 July 1869 at Tanjung Brambang, Krian, his education at Raffles Institution in Singapore and Malacca High School, his administrative career in Perak, his part in forming the Federated Malay States in 1896, his conferment as Raja Di-Hilir Perak on 1 December 1920, his death on 10 April 1933 at Kuala Kangsar and his burial in the Al-Ghufran Royal Mausoleum; its infobox gives his religion as Sunni Islam."
  es: "Artículo de la Wikipedia en inglés sobre Raja Chulan (1869-1933), príncipe y administrador de Perak; utilizado únicamente para datos sobre la entidad. Indica su nacimiento el 1 de julio de 1869 en Tanjung Brambang, Krian, su educación en la Raffles Institution de Singapur y en la Malacca High School, su carrera administrativa en Perak, su participación en la formación de los Estados Federados Malayos en 1896, su investidura como Raja Di-Hilir Perak el 1 de diciembre de 1920, su muerte el 10 de abril de 1933 en Kuala Kangsar y su entierro en el Mausoleo Real de Al-Ghufran; su ficha informativa indica que su religión era el islam sunita."
  fr: "L'article de Wikipédia en anglais consacré à Raja Chulan (1869-1933), prince et administrateur du Perak, est utilisé uniquement pour les informations biographiques. Il retrace sa naissance le 1er juillet 1869 à Tanjung Brambang, dans la province de Krian, ses études à la Raffles Institution de Singapour et au lycée de Malacca, sa carrière administrative au Perak, son rôle dans la formation des États malais fédérés en 1896, son couronnement comme Raja Di-Hilir Perak le 1er décembre 1920, son décès le 10 avril 1933 à Kuala Kangsar et son inhumation au mausolée royal d'Al-Ghufran. Son infobox précise qu'il était de confession sunnite."
  ur: "راجہ چولن (1869–1933) پر انگریزی ویکیپیڈیا مضمون، پیراک شہزادہ اور منتظم؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1 جولائی 1869 کو تنجنگ برامبنگ، کریان میں ان کی پیدائش، سنگاپور کے ریفلز انسٹی ٹیوشن اور ملاکا ہائی اسکول میں ان کی تعلیم، پیراک میں ان کا انتظامی کیرئیر، 1896 میں ملائی ریاستوں کی فیڈریشن کی تشکیل میں ان کا حصہ، راجہ دی ہلیر پیراک کے طور پر ان کا اعزاز، 1 دسمبر 1930 کو ان کی وفات، 1 دسمبر 1930 کو کانگسار اور الغفران شاہی مقبرہ میں ان کی تدفین؛ اس کا انفو باکس اس کا مذہب بطور سنی اسلام دیتا ہے۔"
