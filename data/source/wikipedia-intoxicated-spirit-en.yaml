  ar: "مقالة ويكيبيديا الإنجليزية عن ألبوم «Intoxicated Spirit» الحي لنصرت فتح علي خان وفرقته (1996)؛ لوقائع الكيان فقط: الإصدار عن شاناشي، والتسجيل في باكستان، والجولة، وترشيح غرامي، واستقبال النقاد في نيويورك تايمز وواشنطن بوست ونيوزداي."
  en: "English Wikipedia article on the live album Intoxicated Spirit by Nusrat Fateh Ali Khan & Party (1996); entity facts only: its release on Shanachie, its recording in Pakistan, the tour, the Grammy nomination, and the reviews in The New York Times, The Washington Post and Newsday."
  es: "Artículo de la Wikipedia en inglés sobre el álbum en directo Intoxicated Spirit de Nusrat Fateh Ali Khan & Party (1996); solo datos sobre la entidad: su lanzamiento en Shanachie, su grabación en Pakistán, la gira, la nominación al Grammy y las reseñas en The New York Times, The Washington Post y Newsday."
  fr: "Article de Wikipédia en anglais sur l'album live Intoxicated Spirit de Nusrat Fateh Ali Khan & Party (1996); faits concernant l'entité uniquement: sa sortie sur Shanachie, son enregistrement au Pakistan, la tournée, la nomination aux Grammy Awards et les critiques dans le New York Times, le Washington Post et Newsday."
  ur: "نصرت فتح علی خان اینڈ پارٹی (1996) کے لائیو البم Intoxicated Spirit پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق: شناچی پر اس کی ریلیز، پاکستان میں اس کی ریکارڈنگ، ٹور، گریمی نامزدگی، اور دی نیویارک ٹائمز، واشنگٹن پوسٹ اور نیوز ڈے میں جائزے۔"
  tr: "Nusrat Fateh Ali Khan ve grubunun canlı albümü 'Intoxicated Spirit' hakkında İngilizce Wikipedia makalesi (1996); sadece varlık kayıtları için: Shanashi'nin Pakistan'da kaydı, turne, Grammy adaylığı ve The New York Times, Washington Post ve Newsday'deki eleştirel tepkiler."
  id: "Artikel Wikipedia bahasa Inggris tentang album live 'Intoxicated Spirit' oleh Nusrat Fateh Ali Khan dan bandnya (1996); hanya untuk entity records: perilisan Shanashi, rekaman di Pakistan, tur, nominasi Grammy, dan tanggapan kritis di The New York Times, Washington Post, dan Newsday."
