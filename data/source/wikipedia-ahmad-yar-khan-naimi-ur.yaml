summary:
  ar: "مقالة ويكيبيديا الأردية عن مفتی أحمد يار خان نعيمي؛ سيرة مطولة من كتب التراجم المطبوعة ⁦(حيات سالك وحالات زندگي وحيات حكيم الامت)⁩، تعطي ميلاده 1 آذار 1894 مقترناً بـ4 جمادى الأولى 1324هـ وتسجل في قسم الولادة أيضاً قراءة 1324هـ/1906م وشهر شوال 1314هـ، ووفاته 3 رمضان 1391هـ ⁦(24 تشرين الأول 1971)⁩ في كجرات، ولا تسمي في متنها مذهباً فقهياً ولا بيعة له."
  en: "The Urdu Wikipedia article on Mufti Ahmad Yar Khan Naeemi; a long biography drawn from the printed lives (Hayat-e-Salik, Halat-e-Zindagi, Hayat-e-Hakim al-Ummat), giving his birth as 1 March 1894 paired with 4 Jumada al-Ula 1324 AH while its birth section also records a 1324 AH/1906 reading and a Shawwal 1314 AH reading, and his death on 3 Ramadan 1391 AH (24 October 1971) at Gujrat; its text names no madhhab for him and records no bay'ah of his."
  es: "El artículo de Wikipedia en urdu sobre Mufti Ahmad Yar Khan Naeemi, una larga biografía extraída de las vidas impresas (Hayat-e-Salik, Halat-e-Zindagi, Hayat-e-Hakim al-Ummat), indica que nació el 1 de marzo de 1894 junto con el 4 de Jumada al-Ula de 1324 AH, mientras que su sección de nacimiento también registra una lectura de 1324 AH/1906 y una lectura de Shawwal de 1314 AH, y su muerte el 3 de Ramadán de 1391 AH (24 de octubre de 1971) en Gujrat; su texto no menciona ninguna madhhab para él y no registra ninguna bay'ah suya."
  fr: "L'article de Wikipédia en ourdou sur le mufti Ahmad Yar Khan Naeemi; une longue biographie tirée des vies imprimées (Hayat-e-Salik, Halat-e-Zindagi, Hayat-e-Hakim al-Ummat), donnant sa naissance au 1er mars 1894 associé au 4 Jumada al-Ula 1324 AH, tandis que sa section sur la naissance mentionne également une lecture de 1324 AH/1906 et une lecture de Shawwal 1314 AH, et sa mort le 3 Ramadan 1391 AH (24 octobre 1971) à Gujrat; son texte ne mentionne aucun madhhab pour lui et ne mentionne aucune bay'ah de sa part."
