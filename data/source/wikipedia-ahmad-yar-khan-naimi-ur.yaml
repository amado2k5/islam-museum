summary:
  ar: "مقالة ويكيبيديا الأردية عن مفتی أحمد يار خان نعيمي؛ سيرة مطولة من كتب التراجم المطبوعة (حيات سالك وحالات زندگي وحيات حكيم الامت)، تعطي ميلاده 1 آذار 1894 مقترناً بـ4 جمادى الأولى 1324هـ وتسجل في قسم الولادة أيضاً قراءة 1324هـ/1906م وشهر شوال 1314هـ، ووفاته 3 رمضان 1391هـ (24 تشرين الأول 1971) في كجرات، ولا تسمي في متنها مذهباً فقهياً ولا بيعة له."
  en: "The Urdu Wikipedia article on Mufti Ahmad Yar Khan Naeemi; a long biography drawn from the printed lives (Hayat-e-Salik, Halat-e-Zindagi, Hayat-e-Hakim al-Ummat), giving his birth as 1 March 1894 paired with 4 Jumada al-Ula 1324 AH while its birth section also records a 1324 AH/1906 reading and a Shawwal 1314 AH reading, and his death on 3 Ramadan 1391 AH (24 October 1971) at Gujrat; its text names no madhhab for him and records no bay'ah of his."
