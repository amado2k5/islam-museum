summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عثمان خواجة ⁦(مواليد 1986)⁩، لاعب الكريكت الأسترالي الدولي السابق؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في إسلام آباد في 18 ديسمبر 1986 وهجرة أسرته إلى نيو ساوث ويلز وهو في الرابعة، وكونه أول مسلم وأول مولود في باكستان يلعب كريكت الاختبار لأستراليا، وسجل 6229 جولة اختبار في 88 اختبارا، وعودته بمئويتين توأمين في اختبار سيدني للرماد في يناير 2022، وأعلى نتيجة له 232 أمام سريلانكا في يناير 2025، واعتزاله الكريكت الدولية في يناير 2026."
  en: "English Wikipedia article on Usman Khawaja (born 1986), the former Australian international cricketer; used for entity facts only. It records his birth in Islamabad on 18 December 1986, his family's emigration to New South Wales when he was four, his standing as the first Muslim and first Pakistani-born cricketer to play Test cricket for Australia, his 6,229 Test runs in 88 Tests, his comeback twin centuries in the January 2022 Sydney Ashes Test, his career-best 232 against Sri Lanka in January 2025, the December 2023 ICC shoe-message episode, and his retirement from international cricket in January 2026."
  es: "Artículo de la Wikipedia en inglés sobre Usman Khawaja (nacido en 1986), el exjugador de críquet internacional australiano; utilizado únicamente para datos sobre la persona. Registra su nacimiento en Islamabad el 18 de diciembre de 1986, la emigración de su familia a Nueva Gales del Sur cuando tenía cuatro años, su condición de primer musulmán y primer jugador de críquet nacido en Pakistán en jugar críquet de prueba para Australia, sus 6229 carreras en 88 partidos de prueba, sus dos siglos de regreso en el partido de prueba de las Ashes de Sídney en enero de 2022, su mejor marca personal de 232 contra Sri Lanka en enero de 2025, el episodio del mensaje de la ICC sobre los zapatos en diciembre de 2023 y su retiro del críquet internacional en enero de 2026."
  fr: "Article de Wikipédia en anglais sur Usman Khawaja (né en 1986), ancien joueur de cricket international australien; utilisé uniquement à des fins d'information. Il relate sa naissance à Islamabad le 18 décembre 1986, l'émigration de sa famille en Nouvelle-Galles du Sud lorsqu'il avait quatre ans, son statut de premier musulman et de premier joueur de cricket d'origine pakistanaise à jouer au cricket test pour l'Australie, ses 6 229 courses en 88 tests, son retour avec un double siècle lors du test des Ashes de Sydney en janvier 2022, son meilleur score en carrière de 232 contre le Sri Lanka en janvier 2025, l'épisode du message sur la chaussure de l'ICC en décembre 2023 et sa retraite du cricket international en janvier 2026."
  ur: "سابق آسٹریلوی بین الاقوامی کرکٹر عثمان خواجہ ⁦(پیدائش 1986)⁩ پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 18 دسمبر 1986 کو اسلام آباد میں ان کی پیدائش، ان کے خاندان کی نیو ساؤتھ ویلز میں ہجرت جب وہ چار سال کے تھے، آسٹریلیا کے لیے ٹیسٹ کرکٹ کھیلنے والے پہلے مسلمان اور پہلے پاکستانی نژاد کرکٹر کے طور پر ان کا کھڑا ہونا، 88 ٹیسٹ میں اس کے 6,229 ٹیسٹ رنز، جنوری 2022 میں اس کی واپسی کی دو سنچریاں، سڈنی- سری لنکا کے خلاف جنوری 2022 میں کیئر ایشز ٹیسٹ میں ان کی دو سنچریاں شامل ہیں۔ 2025، دسمبر 2023 آئی سی سی کے جوتوں کے پیغام کا واقعہ، اور جنوری 2026 میں بین الاقوامی کرکٹ سے ان کی ریٹائرمنٹ۔"
  tr: "Usman Khawaja (d. 1986) hakkında İngilizce Wikipedia makalesi; yalnızca varlık bilgileri için kullanılmıştır. 18 Aralık 1986'da İslamabad'da doğdu ve ailesi dört yaşında Yeni Güney Galler'e göç etti; Pakistan'da Avustralya için Test kriketi oynayan ilk Müslüman ve ilk doğan kişi oldu, 88 Testte 6.229 Test vuruşu yaptı, Ocak 2022'de Sydney Ashes Testinde iki çift yüzyıl yaptı, Ocak 2025'te Sri Lanka'ya karşı en yüksek skoru olan 232'yi elde etti ve Ocak 2026'da uluslararası kriketten emekli oldu."
  id: "Artikel Wikipedia bahasa Inggris tentang Usman Khawaja (lahir 1986), mantan pemain kriket internasional Australia; hanya digunakan untuk fakta entitas. Ia lahir di Islamabad pada 18 Desember 1986, dan keluarganya bermigrasi ke New South Wales pada usia empat tahun, menjadi Muslim pertama dan anak pertama di Pakistan yang bermain kriket Test untuk Australia, mencetak 6.229 inning Test dalam 88 Test, kembali dengan dua double century di Sydney Ashes Test pada Januari 2022, skor tertingginya 232 melawan Sri Lanka pada Januari 2025, dan pensiun dari kriket internasional pada Januari 2026."
