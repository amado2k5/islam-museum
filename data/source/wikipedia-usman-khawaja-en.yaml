summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عثمان خواجة (مواليد 1986)، لاعب الكريكت الأسترالي الدولي السابق؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في إسلام آباد في 18 ديسمبر 1986 وهجرة أسرته إلى نيو ساوث ويلز وهو في الرابعة، وكونه أول مسلم وأول مولود في باكستان يلعب كريكت الاختبار لأستراليا، وسجل 6229 جولة اختبار في 88 اختبارا، وعودته بمئويتين توأمين في اختبار سيدني للرماد في يناير 2022، وأعلى نتيجة له 232 أمام سريلانكا في يناير 2025، واعتزاله الكريكت الدولية في يناير 2026."
  en: "English Wikipedia article on Usman Khawaja (born 1986), the former Australian international cricketer; used for entity facts only. It records his birth in Islamabad on 18 December 1986, his family's emigration to New South Wales when he was four, his standing as the first Muslim and first Pakistani-born cricketer to play Test cricket for Australia, his 6,229 Test runs in 88 Tests, his comeback twin centuries in the January 2022 Sydney Ashes Test, his career-best 232 against Sri Lanka in January 2025, the December 2023 ICC shoe-message episode, and his retirement from international cricket in January 2026."
