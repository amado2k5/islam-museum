summary:
  ar: "صفحة اليونسكو للتقييم الأولي لأضرار التراث الثقافي في غزة عبر الرصد بالأقمار الصناعية ⁦(UNITAR-UNOSAT)⁩، وتثبت فيها تضرر قصر الباشا."
  en: "UNESCO's running preliminary damage assessment of Gaza's cultural heritage by satellite monitoring (UNITAR-UNOSAT), which verifies Qasr al-Basha among damaged sites."
  ur: "غزہ کے ثقافتی ورثے کا UNESCO اولی نقصان جائزہ، سیٹلائٹ مانیٹرنگ ⁦(UNITAR-UNOSAT)⁩ کے ذریعے؛ قصر الباشا متاثرہ مقامات میں۔"
  fr: "Évaluation préliminaire continue de l'UNESCO sur les dommages au patrimoine de Gaza par satellite (UNITAR-UNOSAT), confirmant Qasr al-Basha parmi les sites endommagés."
  es: "Evaluación preliminar continua de UNESCO sobre los daños al patrimonio de Gaza por satélite (UNITAR-UNOSAT), que verifica Qasr al-Basha entre los sitios dañados."
  tr: "UNESCO'nun uydu izlemeyle (UNITAR-UNOSAT) yürüttüğü Gazze kültürel mirası ön hasar değerlendirmesi; Kasr el-Başa hasarlı alanlar arasında doğrulandı."
  id: "Penilaian awal berkelanjutan UNESCO atas kerusakan warisan Gaza lewat pemantauan satelit (UNITAR-UNOSAT); Qasr al-Basha termasuk yang terdampak."
