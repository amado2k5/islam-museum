summary:
  ar: "مقالة ويكيبيديا الإنجليزية ⁦(بعنوان «Sunan Murya»)⁩ عن سونن موريا؛ تعطي اسمه رادين عمر سعيد وأباه سونن كاليجاغا ووفاته 1551 في دأوي بقدوس، ولا تعطي أي تاريخ للولادة."
  en: "English Wikipedia article (titled 'Sunan Murya') on Sunan Muria; it gives his name as Raden Umar Said, his father as Sunan Kalijaga and his death in 1551 at Dawe, Kudus, and gives no birth date at all."
  es: "Artículo de la Wikipedia en inglés (titulado 'Sunan Murya') sobre Sunan Muria; indica que su nombre era Raden Umar Said, que su padre era Sunan Kalijaga y que murió en 1551 en Dawe, Kudus, pero no proporciona ninguna fecha de nacimiento."
  fr: "L'article de Wikipédia en anglais (intitulé « Sunan Murya ») sur Sunan Muria; il donne son nom comme Raden Umar Said, son père comme Sunan Kalijaga et sa mort en 1551 à Dawe, Kudus, et ne donne aucune date de naissance."
  ur: "سنن موریہ پر انگریزی ویکیپیڈیا مضمون ⁦(عنوان 'سنن موریا')⁩؛ اس میں ان کا نام ردن عمر سعید، ان کے والد سنن کلیجگا اور ان کی وفات 1551 میں داوے، قدوس میں بتائی گئی ہے، اور تاریخ پیدائش بالکل نہیں بتائی گئی ہے۔"
  tr: "İngilizce Wikipedia makalesi (\"Sunan Murya\" başlıklı) Sunan Murya hakkında; adını Radin Omar Saeed olarak belirtir, babası Sunan Kalijaga ve 1551'de Daoui Baqdous'ta öldüğü belirtilir ve doğum tarihi verilmez."
  id: "Artikel Wikipedia bahasa Inggris (berjudul \"Sunan Murya\") tentang Sunan Murya; mencantumkan namanya sebagai Radin Omar Saeed, ayahnya Sunan Kalijaga, dan kematiannya pada tahun 1551 di Daoui Baqdous, serta tidak menyebutkan tanggal lahir apa pun."
