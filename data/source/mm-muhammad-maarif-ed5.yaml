label:
  ar: "مصطفى محمود، محمد: محاولة لفهم السيرة النبوية، الطبعة الخامسة (دار المعارف، القاهرة)"
  en: "Mostafa Mahmoud, Muhammad: Muhawala li-Fahm al-Sira al-Nabawiyya, 5th ed. (Dar al-Ma'arif, Cairo)"
  ur: "مصطفیٰ محمود، محمد: محاولۃ لفہم السیرۃ النبویہ، طبع پنجم (دار المعارف، قاہرہ)"
summary:
  ar: "الطبعة الخامسة من كتاب مصطفى محمود «محمد: محاولة لفهم السيرة النبوية» عن دار المعارف، في فصول: محمد، وليست عظمة بل نبوة، وروح مشعة آسرة، ومسيرة كالإعصار، ومحمد صانع الرجال، وفي آخرها قائمة بأربعة وخمسين كتاباً له."
  en: "The fifth edition of Mostafa Mahmoud's Muhammad: Muhawala li-Fahm al-Sira al-Nabawiyya from Dar al-Ma'arif, in chapters titled Muhammad; Not greatness but prophethood; A radiant, captivating spirit; A march like a hurricane; Muhammad the maker of men; with a list of fifty-four of his books at the end."
  ur: "مصطفیٰ محمود کی «محمد: محاولۃ لفہم السیرۃ النبویہ» کا دار المعارف سے پانچواں ایڈیشن، ابواب: محمد، عظمت نہیں نبوت، روشن اور دلکش روح، طوفان جیسا سفر، محمد مردوں کے معمار؛ آخر میں ان کی چون کتابوں کی فہرست۔"
