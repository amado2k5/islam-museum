label:
  ar: "مصطفى محمود، محمد: محاولة لفهم السيرة النبوية، الطبعة الخامسة ⁦(دار المعارف، القاهرة)⁩"
  en: "Mostafa Mahmoud, Muhammad: Muhawala li-Fahm al-Sira al-Nabawiyya, 5th ed. (Dar al-Ma'arif, Cairo)"
  ur: "مصطفیٰ محمود، محمد: محاولۃ لفہم السیرۃ النبویہ، طبع پنجم ⁦(دار المعارف، قاہرہ)⁩"
summary:
  ar: "الطبعة الخامسة من كتاب مصطفى محمود «محمد: محاولة لفهم السيرة النبوية» عن دار المعارف، في فصول: محمد، وليست عظمة بل نبوة، وروح مشعة آسرة، ومسيرة كالإعصار، ومحمد صانع الرجال، وفي آخرها قائمة بأربعة وخمسين كتاباً له."
  en: "The fifth edition of Mostafa Mahmoud's Muhammad: Muhawala li-Fahm al-Sira al-Nabawiyya from Dar al-Ma'arif, in chapters titled Muhammad; Not greatness but prophethood; A radiant, captivating spirit; A march like a hurricane; Muhammad the maker of men; with a list of fifty-four of his books at the end."
  ur: "مصطفیٰ محمود کی «محمد: محاولۃ لفہم السیرۃ النبویہ» کا دار المعارف سے پانچواں ایڈیشن، ابواب: محمد، عظمت نہیں نبوت، روشن اور دلکش روح، طوفان جیسا سفر، محمد مردوں کے معمار؛ آخر میں ان کی چون کتابوں کی فہرست۔"
  es: "La quinta edición de Muhammad: Muhawala li-Fahm al-Sira al-Nabawiyya de Mostafa Mahmoud, publicada por Dar al-Ma'arif, consta de capítulos titulados Muhammad; No grandeza sino profecía; Un espíritu radiante y cautivador; Una marcha como un huracán; Muhammad, el creador de hombres; con una lista de cincuenta y cuatro de sus libros al final."
  fr: "La cinquième édition de Muhammad de Mostafa Mahmoud: Muhawala li-Fahm al-Sira al-Nabawiyya de Dar al-Ma'arif, en chapitres intitulés Muhammad; Non pas la grandeur mais la prophétie; Un esprit radieux et captivant; Une marche comme un ouragan; Muhammad le créateur d'hommes; avec une liste de cinquante-quatre de ses livres à la fin."
  tr: "Mustafa Mahmoud'un \"Muhammed: Peygamberlik Biyografisini Anlamaya Bir Girişim\" adlı kitabının beşinci baskısı, Dar Al-Maaref tarafından yayımlanmıştır; bölümler: Muhammed, Büyüklük Değil Peygamberlik, Parlak ve Büyüleyici Bir Ruh, Kasırga Gibi Bir Yolculuk ve İnsanların Yaratıcısı Muhammed, son elli dört kitabının listesiyle."
  id: "Edisi kelima buku Mustafa Mahmoud \"Muhammad: An Attempt to Understand the Prophetic Biography\" diterbitkan oleh Dar Al-Maaref, dalam bab-bab: Muhammad, Not Greatness but Prophethood, A Radiant and Captivating Spirit, A Journey Like a Hurricane, dan Muhammad the Maker of Men, dengan daftar akhir lima puluh empat bukunya."
