summary:
  ar: "مقالة ويكيبيديا الأردية عن عبد الماجد الدريابادي؛ تعطي مولده في درياباد في 16 آذار 1892 (16 شعبان 1309هـ) وعمله مع شبلي النعماني في «سيرة النبي» وكتبه التي تجاوزت السبعين ومنها «تفسير ماجدي» بالأردية والإنجليزية، ووفاته قبيل فجر 6 كانون الثاني 1977 (15 محرم 1397هـ) في خاتون منزل بلاكنؤ ودفنه في درياباد؛ ولا يسمّي متنها مذهبًا — تظهر الحنفية والماتريدية في تصنيفاتها فقط."
  en: "The Urdu Wikipedia article on Abdul Majid Daryabadi; it gives his birth at Daryabad on 16 March 1892 (16 Sha'ban 1309 AH), his work with Shibli Nomani on Sirat-un-Nabi, his more than seventy books including the Urdu and English Tafsir-e-Majidi, and his death before dawn on 6 January 1977 (15 Muharram 1397 AH) at Khatun Manzil, Lucknow, with burial at Daryabad; its prose names no school — Hanafi and Maturidi appear only in its category filings."
