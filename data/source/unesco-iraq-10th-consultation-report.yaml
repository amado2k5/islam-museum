  en: "Iraq, 10th consultation report to UNESCO (translated) (Iraq Ministry of Education, to UNESCO)"
summary:
  ar: "«تقرير العراق إلى اليونسكو، المشاورة العاشرة، مترجم»، وزارة التربية العراقية إلى اليونسكو، 2020. ورد في ملخص بحثي زُوّد به المتحف مع إدخال نسب اللغات في العراق؛ ولم يفتح المتحف الصفحة، وقد أجاز المؤسس استعمال الملخص كما ورد في 21 نوفمبر 2026."
  en: "Iraq, 10th consultation report to UNESCO (translated); Iraq Ministry of Education, to UNESCO, 2020. Named in a research summary supplied to the museum with the language-share entry for Iraq; the museum did not open the page, and the founder approved using the summary as supplied on 21 November 2026."
  ur: "Iraq, 10th consultation report to UNESCO (translated)؛ Iraq Ministry of Education, to UNESCO, 2020۔ متحف کو فراہم کردہ تحقیقی خلاصے میں عراق کے زبانوں کے تناسب کے اندراج کے ساتھ مذکور؛ متحف نے صفحہ نہیں کھولا، اور بانی نے 21 نومبر 2026 کو خلاصے کو جیسا ملا اسی طرح استعمال کرنے کی منظوری دی۔"
  fr: "Iraq, 10th consultation report to UNESCO (translated) ; Iraq Ministry of Education, to UNESCO, 2020. Nommé dans un résumé de recherche remis au musée avec l'entrée des parts de langues pour l'Irak ; le musée n'a pas ouvert la page, et le fondateur a approuvé l'usage du résumé tel que fourni le 21 novembre 2026."
  es: "Iraq, 10th consultation report to UNESCO (translated); Iraq Ministry of Education, to UNESCO, 2020. Nombrado en un resumen de investigación entregado al museo con la entrada de proporciones de lenguas de Irak; el museo no abrió la página, y el fundador aprobó usar el resumen tal como se entregó el 21 de noviembre de 2026."
  tr: "\"Irak'ın UNESCO'ya Raporu, Onuncu Danışma, Çeviri,\" Irak Eğitim Bakanlığı'ndan UNESCO'ya, 2020. Müzenin Irak'ta dil oranlarının tanıtımıyla ilgili bir araştırma özetinde bahsedilmiştir; müze sayfayı açmamış ve kurucu 21 Kasım 2026'da belirtildiği gibi özetin kullanımına izin vermiştir."
  id: "\"Laporan Irak kepada UNESCO, Konsultasi Kesepuluh, Diterjemahkan,\" Kementerian Pendidikan Irak kepada UNESCO, 2020. Laporan ini disebutkan dalam ringkasan penelitian yang disediakan oleh museum dengan pengenalan rasio bahasa di Irak; museum tidak membuka halaman tersebut, dan pendiri mengizinkan penggunaan ringkasan tersebut seperti yang dinyatakan pada 21 November 2026."
