summary:
  ar: "مقالة ويكيبيديا الأردية عن عيدي أمين؛ تُستخدم لوقائع الكيان فقط. مقالة موجزة تروي رئاسته لأوغندا (1971–1979) وسقوطه ومنفاه ووفاته في جدة سنة 2003، ولا تذكر دينه ولا مدرسته."
  en: "Urdu Wikipedia article on Idi Amin; used for entity facts only. A short article recounting his presidency of Uganda (1971–1979), his fall, exile and death at Jeddah in 2003. It makes no statement of his religion or school."
  es: "Artículo de Wikipedia en urdu sobre Idi Amin; se utiliza únicamente para datos sobre la persona. Un breve artículo que relata su presidencia de Uganda (1971-1979), su caída, exilio y muerte en Yeda en 2003. No menciona su religión ni su escuela política."
  fr: "Article de Wikipédia en ourdou sur Idi Amin; utilisé uniquement à des fins d’information sur l’entité. Ce court article relate sa présidence de l’Ouganda (1971-1979), sa chute, son exil et sa mort à Djeddah en 2003. Il ne mentionne ni sa religion ni son école."
  ur: "ایدی امین پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ ایک مختصر مضمون جس میں یوگنڈا کی ان کی صدارت (1971-1979)، 2003 میں جدہ میں ان کے زوال، جلاوطنی اور موت کا ذکر کیا گیا ہے۔ اس میں ان کے مذہب یا اسکول کا کوئی بیان نہیں ہے۔"
  tr: "Eidi Amin hakkında Urduca Vikipedi makalesi; yalnızca varlığın olayları için kullanılır. Uganda başkanlığını (1971–1979), düşüşünü, sürgününü ve 2003'te Cidde'deki ölümünü anlatan kısa bir makale, dini veya okulundan bahsedilmeden."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang Eidi Amin; hanya digunakan untuk peristiwa entitas tersebut. Sebuah artikel singkat yang menceritakan masa kepresidenannya di Uganda (1971–1979), kejatuhannya, pengasingannya, dan kematiannya di Jeddah pada tahun 2003, tanpa menyebutkan agama atau sekolahnya."
