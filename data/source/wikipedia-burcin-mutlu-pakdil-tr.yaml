summary:
  ar: "مقالة ويكيبيديا التركية عن بورتشين موتلو باكديل؛ تُستخدم لوقائع الكيان فقط. يحمل صندوق معلوماتها حقل «الدين» بقيمة «الإسلام» — صندوق معلومات وحيد في أسرة مصدرية واحدة، ولا يعضده أي تصريح في نص المقال التركي أو الإنجليزي، ولا يُذكر فيه أي مذهب. ويعطي حقل «المولد» اسم ولادتها «بورتشين موتلو» دون تاريخ أو مكان."
  en: "Turkish Wikipedia article on Burçin Mutlu-Pakdil; used for entity facts only. Its infobox carries a religion field with the value 'İslam' (Islam) — a single infobox in one source family, supported by no statement in the Turkish or English article texts, and naming no school. Its birth field gives only her birth name 'Burçin Mutlu', with no date or place."
  es: "Artículo de la Wikipedia en turco sobre Burçin Mutlu-Pakdil; utilizado únicamente para datos de la entidad. Su ficha informativa contiene un campo de religión con el valor «İslam» (Islam), una única ficha informativa en una sola fuente, sin respaldo en los textos del artículo en turco o inglés, y sin mencionar ninguna escuela. Su campo de nacimiento solo indica su nombre de nacimiento, «Burçin Mutlu», sin fecha ni lugar."
  fr: "Article de Wikipédia en turc sur Burçin Mutlu-Pakdil; utilisé uniquement pour les informations sur l'entité. Son infobox comporte un champ « religion » avec la valeur « İslam » (Islam) — une infobox unique dans une seule famille de sources, sans aucune mention dans les textes turc et anglais de l'article, et sans référence à une école. Son champ « naissance » indique uniquement son nom de naissance, « Burçin Mutlu », sans date ni lieu."
  ur: "Burçin Mutlu-Pakdil پر ترک ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس کے معلوماتی خانے میں 'اسلام' ⁦(اسلام)⁩ کی قدر کے ساتھ ایک مذہب کا فیلڈ ہے - ایک ذریعہ خاندان میں ایک واحد معلومات خانہ، جس کی تائید ترکی یا انگریزی مضمون کے متن میں کوئی بیان نہیں ہے، اور کسی اسکول کا نام نہیں ہے۔ اس کا پیدائشی میدان صرف اس کا پیدائشی نام 'Burçin Mutlu' دیتا ہے، جس میں کوئی تاریخ یا جگہ نہیں ہے۔"
  tr: "Porçın Mutlu Pakdül hakkında Türkçe Vikipedi makalesi; yalnızca varlık gerçekleri için kullanılır. Bilgi kutusunda \"Din\" alanı ve \"İslam\" değeri yer alır — tek bir kaynak ailesi içinde, Türkçe veya İngilizce makale metninde hiçbir ifadeyle desteklenmeyen ve içinde hiçbir mezhepten bahsedilmeyen. \"Doğum\" alanı, doğum adı \"Porçın Mutlu\" olarak tarih veya yer belirtmeden verir."
  id: "Artikel Wikipedia Turki tentang Porçın Mutlu Pakdıl; digunakan hanya untuk fakta entitas. Infobox-nya berisi kolom \"Agama\" dengan nilai \"Islam\" — satu infobox dalam satu keluarga sumber, didukung oleh tidak ada pernyataan dalam teks artikel Turki atau Inggris, dan tidak ada sekte yang disebutkan di dalamnya. Kolom \"Birth\" memberikan nama lahirnya \"Porçın Mutlu\" tanpa tanggal atau tempat."
