summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عزيز أخنوش؛ تُستخدم لوقائع الكيان فقط. تذكر ميلاده في 16 أغسطس 1961 بتافراوت، ورئاسته لحكومة المغرب من سبتمبر 2021 إلى 29 سبتمبر 2026، ووزارته للفلاحة (2007–2021)، وقيادته لمجموعة أكوا وحزب التجمع الوطني للأحرار. لا تذكر المقالة دينه في نصها ولا في صندوق معلوماتها."
  en: "English Wikipedia article on Aziz Akhannouch; used for entity facts only. It gives his birth on 16 August 1961 at Tafraout, his premiership of Morocco from September 2021 to 29 September 2026, his agriculture ministry (2007–2021), and his leadership of the Akwa Group and the National Rally of Independents. The article states no religion for him in its text or infobox."
  es: "Artículo de la Wikipedia en inglés sobre Aziz Akhannouch; utilizado únicamente para datos biográficos. Indica su fecha de nacimiento (16 de agosto de 1961) en Tafraout, su mandato como primer ministro de Marruecos desde septiembre de 2021 hasta el 29 de septiembre de 2026, su ministerio de agricultura (2007-2021) y su liderazgo del Grupo Akwa y la Agrupación Nacional de Independientes. El artículo no menciona su religión ni en el texto ni en el recuadro informativo."
  fr: "Article de Wikipédia en anglais sur Aziz Akhannouch; utilisé uniquement pour les informations sur l'entité. Il indique sa naissance le 16 août 1961 à Tafraout, son mandat de Premier ministre du Maroc de septembre 2021 au 29 septembre 2026, son ministère de l'Agriculture (2007-2021) et sa direction du Groupe Akwa et du Rassemblement national des indépendants. L'article ne mentionne aucune religion à son sujet, ni dans son texte ni dans son infobox."
