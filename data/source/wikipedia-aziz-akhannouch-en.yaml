  ar: "مقالة ويكيبيديا الإنجليزية عن عزيز أخنوش؛ تُستخدم لوقائع الكيان فقط. تذكر ميلاده في 16 أغسطس 1961 بتافراوت، ورئاسته لحكومة المغرب من سبتمبر 2021 إلى 29 سبتمبر 2026، ووزارته للفلاحة (2007–2021)، وقيادته لمجموعة أكوا وحزب التجمع الوطني للأحرار. لا تذكر المقالة دينه في نصها ولا في صندوق معلوماتها."
  en: "English Wikipedia article on Aziz Akhannouch; used for entity facts only. It gives his birth on 16 August 1961 at Tafraout, his premiership of Morocco from September 2021 to 29 September 2026, his agriculture ministry (2007–2021), and his leadership of the Akwa Group and the National Rally of Independents. The article states no religion for him in its text or infobox."
