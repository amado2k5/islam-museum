reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and re-fetched by the recorded revision id with content verified identical. It gives him as born in 1889 at Manastır (Bitola), the half-brother of the Minister of War Enver Pasha, organiser of Special Organization operations in Libya from 1915 and first commander of the Africa Groups Command, then commander of the Army of Islam, which entered Baku on 15 September 1918. Citing Erickson (2001) and the Armenian Genocide Museum-Institute, it states that during that command Nuri presided over the massacre of 30,000 Armenian civilians in Baku, and its categories file him among the perpetrators of the Armenian genocide. After the war he founded a weapons factory at Sütlüce, Istanbul, and was killed by its explosion on 2 March 1949. It makes no statement of his religion in its text or infobox."
