  ar: "مقالة ويكيبيديا الإنجليزية عن القارئة الإندونيسية ماريا أولفا؛ لوقائع الكيان فقط: مولدها في لامونغان في 21 ديسمبر 1955، وفوزها بمسابقتين وطنيتين، وكونها أول امرأة تفوز بجائزة دولية للتلاوة في ماليزيا في 1980، وتدريسها في معهد علوم القرآن والجامعة الإسلامية الحكومية، وجولاتها؛ وتستند إلى كتب أكاديمية ⁦(هارنيش ورسموسن 2011، وغيد 2004، ودي لونغ باس 2006)⁩ والصحافة."
  en: "English Wikipedia article on the Indonesian reciter Maria Ulfah; entity facts only: birth at Lamongan on 21 December 1955, two national competition wins, being the first woman to win an international recitation award in Malaysia in 1980, her teaching at the Institute for Qur'anic Studies and the State Islamic University, and her tours; it cites academic books (Harnish and Rasmussen 2011, Gade 2004, DeLong-Bas 2006) and the press."
