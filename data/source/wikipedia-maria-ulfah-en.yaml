summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن القارئة الإندونيسية ماريا أولفا؛ لوقائع الكيان فقط: مولدها في لامونغان في 21 ديسمبر 1955، وفوزها بمسابقتين وطنيتين، وكونها أول امرأة تفوز بجائزة دولية للتلاوة في ماليزيا في 1980، وتدريسها في معهد علوم القرآن والجامعة الإسلامية الحكومية، وجولاتها؛ وتستند إلى كتب أكاديمية ⁦(هارنيش ورسموسن 2011، وغيد 2004، ودي لونغ باس 2006)⁩ والصحافة."
  en: "English Wikipedia article on the Indonesian reciter Maria Ulfah; entity facts only: birth at Lamongan on 21 December 1955, two national competition wins, being the first woman to win an international recitation award in Malaysia in 1980, her teaching at the Institute for Qur'anic Studies and the State Islamic University, and her tours; it cites academic books (Harnish and Rasmussen 2011, Gade 2004, DeLong-Bas 2006) and the press."
  es: "Artículo de la Wikipedia en inglés sobre la recitadora indonesia Maria Ulfah; solo datos sobre la persona: nacimiento en Lamongan el 21 de diciembre de 1955, dos victorias en concursos nacionales, ser la primera mujer en ganar un premio internacional de recitación en Malasia en 1980, su labor docente en el Instituto de Estudios Coránicos y la Universidad Islámica Estatal, y sus giras; cita libros académicos (Harnish y Rasmussen 2011, Gade 2004, DeLong-Bas 2006) y la prensa."
  fr: "Article de Wikipédia en anglais sur la récitante indonésienne Maria Ulfah; informations uniquement sur l’entité: naissance à Lamongan le 21 décembre 1955, deux victoires à des concours nationaux, première femme à remporter un prix international de récitation en Malaisie en 1980, son enseignement à l’Institut d’études coraniques et à l’Université islamique d’État, et ses tournées; il cite des ouvrages universitaires (Harnish et Rasmussen 2011, Gade 2004, DeLong-Bas 2006) et la presse."
  ur: "انڈونیشی قاری ماریہ الفاہ پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق: 21 دسمبر 1955 کو لامونگن میں پیدائش، دو قومی مقابلے جیتے، 1980 میں ملائیشیا میں بین الاقوامی تلاوت کا ایوارڈ جیتنے والی پہلی خاتون ہونے کے ناطے، انسٹی ٹیوٹ فار قرآنک اسٹڈیز اور اسٹیٹ اسلامک یونیورسٹی میں اس کی تدریس، اور اس کے دورے؛ اس میں علمی کتابوں ⁦(ہرنش اور راسموسن 2011، گیڈ 2004، ڈی لونگ باس 2006)⁩ اور پریس کا حوالہ دیا گیا ہے۔"
