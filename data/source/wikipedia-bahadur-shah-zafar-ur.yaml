summary:
  ar: "مقالة ويكيبيديا الأردية عن بهادر شاه ظفر؛ تُستخدم لوقائع الكيان فقط. تروي حكمه وثورة 1857 ونفيه، وتذكر في متنها إلمامه بالطريق الصوفي، وفي صندوق معلوماتها أن دينه الإسلام السني."
  en: "Urdu Wikipedia article on Bahadur Shah Zafar; used for entity facts only. It recounts his reign, the rebellion of 1857 and his exile, states in its text that he was well versed in the Sufi path, and gives Sunni Islam in its infobox religion field."
  es: "Artículo de Wikipedia en urdu sobre Bahadur Shah Zafar; se utiliza únicamente para obtener información sobre la persona. Relata su reinado, la rebelión de 1857 y su exilio, afirma en su texto que era un gran conocedor del camino sufí y menciona el islam sunita en el campo de religión de su ficha informativa."
  fr: "Article de Wikipédia en ourdou sur Bahadur Shah Zafar; utilisé uniquement à des fins d'information. Il relate son règne, la rébellion de 1857 et son exil, indique qu'il était versé dans la voie soufie et précise qu'il appartenait à l'islam sunnite dans son infobox religion."
  ur: "بہادر شاہ ظفر پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کے دور حکومت، 1857 کی بغاوت اور اس کی جلاوطنی کا ذکر ہے، اس کے متن میں کہا گیا ہے کہ وہ صوفی راستے پر عبور رکھتے تھے، اور سنی اسلام کو اس کے انفو باکس مذہب کے میدان میں پیش کرتے ہیں۔"
  tr: "Bahadur Şah Zafar hakkında Urduca Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Hükümdarlığını, 1857 devrimi ve sürgününü anlatır, Sufi yoluna aşinalığından bahseder ve bilgi kutusunda dininin Sünni İslam olduğunu belirtir."
  id: "Artikel Wikipedia Urdu tentang Bahadur Shah Zafar; digunakan hanya untuk fakta entitas. Artikel ini menceritakan pemerintahannya dan revolusi 1857 serta pengasingannya, menyebutkan pengenalannya terhadap jalan Sufi, dan dalam infobox bahwa agamanya adalah Islam Sunni."
