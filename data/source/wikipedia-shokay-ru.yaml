summary:
  ar: "مقالة ويكيبيديا الروسية عن مصطفى شوكاي ⁦(25 ديسمبر 1890 – 27 ديسمبر 1941)⁩؛ تُستخدم لوقائع الكيان فقط. توثّق عمله في الدوما وحكومة تركستان المستقلة وهجرته ووفاته في برلين، وتذكر مسقط رأسه قرية أوليه تارانغيل، ويذكر صندوق معلوماتها دينه بأنه الإسلام على المذهب السنّي."
  en: "Russian Wikipedia article on Mustafa Shokay (25 December 1890 – 27 December 1941); used for entity facts only. It documents his Duma work, the Turkestan Autonomy, his emigration and his death in Berlin, gives his birthplace as the village of Aulie-Tarangyl, and its infobox gives his religion as Islam of the Sunni persuasion."
  es: "Artículo de la Wikipedia en ruso sobre Mustafa Shokay (25 de diciembre de 1890 - 27 de diciembre de 1941); utilizado únicamente para datos sobre la persona. Documenta su labor en la Duma, la Autonomía de Turkestán, su emigración y su muerte en Berlín. Indica que nació en la aldea de Aulie-Tarangyl y su ficha informativa señala que profesaba el islam sunita."
  fr: "Article de Wikipédia en russe sur Mustafa Shokay (25 décembre 1890 – 27 décembre 1941); utilisé uniquement pour les informations le concernant. Il documente son travail à la Douma, l’autonomie du Turkestan, son émigration et sa mort à Berlin, indique que son lieu de naissance est le village d’Aulie-Tarangyl, et son infobox précise qu’il était de confession sunnite."
  ur: "مصطفی شوکے پر روسی ویکیپیڈیا مضمون ⁦(25 دسمبر 1890 - 27 دسمبر 1941)⁩؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اس کے ڈوما کے کام، ترکستان کی خود مختاری، اس کی ہجرت اور برلن میں اس کی موت کو دستاویز کرتا ہے، اس کی جائے پیدائش اولی ترنگیل گاؤں کے طور پر بتاتا ہے، اور اس کا معلومات خانہ اس کے مذہب کو سنی قائل کے اسلام کے طور پر دیتا ہے۔"
