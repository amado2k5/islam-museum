summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سانيا ميرزا (مواليد 1986)، لاعبة التنس الهندية المحترفة السابقة؛ تُستخدم لوقائع الكيان فقط. تذكر مولدها في مومباي في 15 نوفمبر 1986 ونشأتها في حيدر آباد لأسرة مسلمة سنية كما يرد في قسم نشأتها، وصدارتها تصنيف الزوجي العالمي في أبريل 2015، وألقابها الستة الكبرى في الزوجي والمختلط، وأعلى تصنيف فردي لها (27 عالميا سنة 2007)، واعتزالها التنس الاحترافي في فبراير 2023، وفتوى سبتمبر 2005 بشأن ملابسها."
  en: "English Wikipedia article on Sania Mirza (born 1986), the former Indian professional tennis player; used for entity facts only. It records her birth in Mumbai on 15 November 1986 and upbringing in Hyderabad — its Early life section describes her family as a Sunni Muslim family — her rise to the doubles world No. 1 ranking in April 2015, her six major titles across women's and mixed doubles, her singles career-high of No. 27 in 2007, her retirement from professional tennis in February 2023, and the September 2005 fatwa concerning her attire."
