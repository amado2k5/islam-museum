summary:
  ar: «مقالة ويكيبيديا الإنجليزية «Suad Salih» ⁦(مراجعة 1346262245، رُوجعت في أكتوبر 2026)⁩. المصدر لسنة ميلادها 1945 وحملتها سنة 1998 لفتح باب الإفتاء للنساء وظهورها في الفيلم الوثائقي «أصوات محجبة».»
  en: "The English Wikipedia article 'Suad Salih' (revision 1346262245, consulted October 2026). The source for her birth year 1945, her 1998 campaign for women to serve as muftis, and her appearance in the documentary Veiled Voices."
  ur: «انگریزی ویکیپیڈیا کا مضمون «Suad Salih» ⁦(نظرثانی 1346262245، اکتوبر 2026 میں رجوع کیا گیا)⁩۔»
  es: "El artículo de la Wikipedia en inglés «Suad Salih» (revisión 1346262245, consultado en octubre de 2026). La fuente de su año de nacimiento (1945), su campaña de 1998 para que las mujeres ejercieran como muftíes y su aparición en el documental «Voiled Voices»."
  fr: "L'article « Suad Salih » de Wikipédia en anglais (révision 1346262245, consulté en octobre 2026) est la source des informations concernant son année de naissance (1945), sa campagne de 1998 pour que les femmes puissent officier comme muftis et son apparition dans le documentaire « Voiles voilées »."
  tr: "\"İngilizce Vikipedi makalesi 'Suad Salih' (1346262245 incelemesi, Ekim 2026'da incelenmiştir). Kaynak: 1945 ve kadınlar için fetvaların kapısını açmak ve 'Veiled Voices' belgesel filmindeki görünümü açmak amacıyla 1998'de yayımlanmıştır.\""
  id: "\"Artikel Wikipedia bahasa Inggris 'Suad Salih' (ulasan 1346262245, ditinjau pada Oktober 2026). Sumber: 1945 dan diterbitkan pada 1998 untuk membuka pintu bagi fatwa bagi perempuan dan penampilannya dalam film dokumenter 'Veiled Voices'.\""
