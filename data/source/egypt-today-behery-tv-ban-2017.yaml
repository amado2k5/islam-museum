label: { en: "Egypt Today: court bans Islam Behery's TV programme (29 October 2017)" }
summary:
  ar: "خبر إيجيبت توداي بتاريخ 29 أكتوبر 2017: محكمة القضاء الإداري تقضي بوقف إسلام بحيري عن الظهور تلفزيونيا وبمنع بث برنامجه أو إعادة بثه، في دعوى أقامها شيخ الأزهر أحمد الطيب."
  en: "An Egypt Today report of 29 October 2017: the Administrative Court ruled to suspend Behery from appearing on television and banned the airing or re-airing of his programme, in a suit brought by Al-Azhar's Grand Imam Ahmed el-Tayyib."
  es: "Según un informe de Egypt Today del 29 de octubre de 2017, el Tribunal Administrativo dictaminó la suspensión de Behery para que no pudiera aparecer en televisión y prohibió la emisión o retransmisión de su programa, en una demanda presentada por el Gran Imán de Al-Azhar, Ahmed el-Tayyib."
  fr: "Un article d'Egypt Today du 29 octobre 2017: le tribunal administratif a ordonné la suspension de Behery de ses apparitions à la télévision et a interdit la diffusion ou la rediffusion de son émission, suite à une plainte déposée par le grand imam d'Al-Azhar, Ahmed el-Tayyib."
  ur: "29 اکتوبر 2017 کی ایک مصری ٹوڈے کی رپورٹ: انتظامی عدالت نے الازہر کے عظیم الشان امام احمد الطیب کی طرف سے لائے گئے مقدمے میں بیہری کو ٹیلی ویژن پر آنے سے معطل کرنے اور ان کے پروگرام کو نشر کرنے یا دوبارہ نشر کرنے پر پابندی عائد کرنے کا حکم دیا۔"
  tr: "Egypt Today haberleri, 29 Ekim 2017: İdare Mahkemesi, Al-Ezher Büyük Şeyhi Ahmed Al-Tayeb tarafından açılan davada, Islam Behiri'nin televizyonda görünmesini ve programının yayınını veya tekrar yayınını yasaklamaya karar verdi."
  id: "Berita Egypt Today tertanggal 29 Oktober 2017: Pengadilan Administrasi memutuskan untuk menangguhkan Islam Behiri tampil di televisi dan melarang penayangan atau penayangan ulang programnya, dalam gugatan yang diajukan oleh Syekh Agung Al-Azhar Ahmed Al-Tayeb."
