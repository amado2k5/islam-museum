summary:
  ar: "مدخل سعوديبيديا عن سعد بن ناصر الشثري: مستشار في الديوان الملكي وعضو هيئة كبار العلماء وعضو اللجنة الدائمة للإفتاء، وتدرجه الأكاديمي في جامعة الإمام محمد بن سعود ثم جامعة الملك سعود، ومشايخه ومنهم ابن باز وعبد العزيز آل الشيخ ووالده ناصر الشثري."
  en: "Saudipedia's entry on Saad ibn Nasir al-Shathri: royal-court advisor, member of the Council of Senior Scholars and of the Permanent Committee for Ifta, his academic progression at Imam Muhammad ibn Saud University and then King Saud University, and his teachers, among them Ibn Baz, Abd al-Aziz Al al-Shaykh and his father Nasir al-Shathri."
  es: "Entrada de Saudipedia sobre Saad ibn Nasir al-Shathri: asesor de la corte real, miembro del Consejo de Altos Eruditos y del Comité Permanente para el Ifta, su trayectoria académica en la Universidad Imam Muhammad ibn Saud y posteriormente en la Universidad Rey Saud, y sus maestros, entre ellos Ibn Baz, Abd al-Aziz Al al-Shaykh y su padre Nasir al-Shathri."
  fr: "L'article de Saudipedia sur Saad ibn Nasir al-Shathri: conseiller à la cour royale, membre du Conseil des grands savants et du Comité permanent pour l'Ifta, son parcours universitaire à l'université Imam Muhammad ibn Saud puis à l'université du roi Saud, et ses professeurs, parmi lesquels Ibn Baz, Abd al-Aziz Al al-Shaykh et son père Nasir al-Shathri."
  ur: "سعد بن ناصر الشطری پر سعودی پیڈیا کا داخلہ: شاہی عدالت کے مشیر، کونسل آف سینئر سکالرز اور مستقل کمیٹی برائے افتا کے رکن، امام محمد ابن سعود یونیورسٹی اور پھر کنگ سعود یونیورسٹی میں ان کی تعلیمی ترقی، اور ان کے اساتذہ، ان میں ابن باز، عبد العزیز الصغریٰ اور ان کے والد۔"
  tr: "Saad bin Nasser Al-Shathri hakkında Saudipedia'ya Giriş: Kraliyet Sarayı'nda danışman, Kıdemli Alimler Konseyi üyesi ve Fetva Daimi Komitesi üyesi. Akademik olarak İmam Muhammed bin Suud Üniversitesi'nde ve ardından Kral Suud Üniversitesi'nde ilerledi; öğretmenleri arasında İbn Baz, Abdulaziz Al-Sheikh ve babası Nasser Al-Shathri yer aldı."
  id: "Pengantar tentang Saudipedia tentang Saad bin Nasser Al-Shathri: Penasihat di Istana Kerajaan, anggota Dewan Cendawan Senior, dan anggota Komite Tetap untuk Fatwa. Ia maju secara akademis di Universitas Imam Muhammad bin Saud dan kemudian Universitas King Saud, serta guru-gurunya termasuk Ibn Baz, Abdulaziz Al-Sheikh, dan ayahnya Nasser Al-Shathri."
