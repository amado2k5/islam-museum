summary:
  ar: "مدخل سعوديبيديا عن سعد بن ناصر الشثري: مستشار في الديوان الملكي وعضو هيئة كبار العلماء وعضو اللجنة الدائمة للإفتاء، وتدرجه الأكاديمي في جامعة الإمام محمد بن سعود ثم جامعة الملك سعود، ومشايخه ومنهم ابن باز وعبد العزيز آل الشيخ ووالده ناصر الشثري."
  en: "Saudipedia's entry on Saad ibn Nasir al-Shathri: royal-court advisor, member of the Council of Senior Scholars and of the Permanent Committee for Ifta, his academic progression at Imam Muhammad ibn Saud University and then King Saud University, and his teachers, among them Ibn Baz, Abd al-Aziz Al al-Shaykh and his father Nasir al-Shathri."
