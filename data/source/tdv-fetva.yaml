summary:
  ar: "مدخل «فتوى» في موسوعة TDV الإسلامية التركية، ويتناول معنى الفتوى وفرقها عن القضاء، وتاريخها من صدر الإسلام إلى عهد المذاهب الفقهية، وطبقات المفتين عند أهل المذاهب، وإجراءات الفتوى ونصّها، وفي الدولة العثمانية صار للشيخ الإسلام سلطة الفتوى، ثم وضع الشؤون الدينية في الجمهورية التركية الحديثة."
  en: "The TDV İslâm Ansiklopedisi entry 'Fetva' (fatwa). It covers the meaning of fatwa and how it differs from judicial ruling, its history from early Islam to the schools of law, the grades of muftis in each school, the procedure and form of a fatwa, and in the Ottoman state the shaykh al-islam's authority to issue fatwas, and the modern position of the religious affairs directorate in the Turkish Republic. The entry is by Fahrettin Atar."
