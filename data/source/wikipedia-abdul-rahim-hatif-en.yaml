summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عبد الرحيم هاتف ⁦(20 مايو 1926 – 19 أغسطس 2013)⁩، السياسي الأفغاني: مولود في قندهار في أسرة بشتونية، نائب رئيس منذ انتخابات 1988 ونائب أول للرئيس من يوليو 1991 إلى أبريل 1992، ثم رئيس بالوكالة من 16 إلى 28 أبريل 1992 بعد إزاحة نجيب الله، فمنفيّ في هولندا حيث توفي في ألفن آن دن راين. لا تسمّي المقالة له دينًا ولا مذهبًا."
  en: "English Wikipedia article on Abdul Rahim Hatif (20 May 1926 – 19 August 2013), the Afghan politician: born at Kandahar into a Pashtun family, a vice president from the 1988 elections and first vice president from July 1991 to April 1992, then acting President from 16 to 28 April 1992 after Najibullah's removal, and afterwards an exile in the Netherlands, where he died at Alphen aan den Rijn. The article names no religion and no school for him."
