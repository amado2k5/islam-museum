  ar: "مقالة ويكيبيديا الفرنسية عن الشيخ يعقوبا سيلا؛ تُستخدم لوقائع الكيان فقط. تقدّمه مرشدًا دينيًا مسلمًا مرتبطًا بالحمالية وُلد نحو 1906 في نيورو وتوفي في 15 أكتوبر 1988 في غانيوا، وتروي إقامته في ساساندرا ثم بناءه في غانيوا مجتمعًا دينيًا وشبكة دور سينما في مدن ساحل العاج."
  en: "French Wikipedia article on Cheikh Yacouba Sylla; used for entity facts only. It presents him as a Muslim religious guide tied to Hamallism, born about 1906 at Nioro and deceased on 15 October 1988 at Gagnoa, and recounts his detention at Sassandra and his building, at Gagnoa, of a religious community and a network of cinemas across Ivorian towns."
