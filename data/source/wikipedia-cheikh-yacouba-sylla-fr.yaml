reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision. It rests on Ivorian press and institutional pages and on Odile Goerg's Le Monde profile of 15 August 2018, whose headline calls him 'the enlightened Sufi who built dark rooms (cinemas)'. The article text itself ties him to the movement founded by Cheikh Hamallah, whose teaching gave rise in Côte d'Ivoire to the community known as Yacoubism; it does not name the Tijaniyya in its own words. It gives his birth as about 1906 at Nioro du Sahel and his death as 15 October 1988 at Gagnoa — the day conflicts with both Wikidata items (11 and 15 August 1988), so the record carries the year only. It records his 1930 condemnation and detention at Sassandra until 1938, his plantations and transport business, his cinemas at Gagnoa, Sinfra, Divo, Oumé, Soubré, Daloa and Adzopé, his closeness to Houphouët-Boigny and support for the RDA, and his Grand Officer rank in the Ivorian National Order (16 December 1977)."
