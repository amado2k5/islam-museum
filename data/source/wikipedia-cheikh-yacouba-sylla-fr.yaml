summary:
  ar: "مقالة ويكيبيديا الفرنسية عن الشيخ يعقوبا سيلا؛ تُستخدم لوقائع الكيان فقط. تقدّمه مرشدًا دينيًا مسلمًا مرتبطًا بالحمالية وُلد نحو 1906 في نيورو وتوفي في 15 أكتوبر 1988 في غانيوا، وتروي إقامته في ساساندرا ثم بناءه في غانيوا مجتمعًا دينيًا وشبكة دور سينما في مدن ساحل العاج."
  en: "French Wikipedia article on Cheikh Yacouba Sylla; used for entity facts only. It presents him as a Muslim religious guide tied to Hamallism, born about 1906 at Nioro and deceased on 15 October 1988 at Gagnoa, and recounts his detention at Sassandra and his building, at Gagnoa, of a religious community and a network of cinemas across Ivorian towns."
  es: "Artículo de la Wikipedia en francés sobre Cheikh Yacouba Sylla; utilizado únicamente para datos sobre la persona. Lo presenta como un guía religioso musulmán vinculado al hamalismo, nacido alrededor de 1906 en Nioro y fallecido el 15 de octubre de 1988 en Gagnoa, y relata su detención en Sassandra y la creación, en Gagnoa, de una comunidad religiosa y una red de cines en varias ciudades de Costa de Marfil."
  fr: "Article de Wikipédia en français sur Cheikh Yacouba Sylla; utilisé uniquement pour les informations le concernant. Il le présente comme un guide religieux musulman lié au hamallisme, né vers 1906 à Nioro et décédé le 15 octobre 1988 à Gagnoa. L’article relate sa détention à Sassandra et la création, à Gagnoa, d’une communauté religieuse et d’un réseau de cinémas dans plusieurs villes ivoiriennes."
  ur: "فرانسیسی ویکیپیڈیا مضمون شیخ یعقوبہ سائلہ پر؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں اسے ہمالیزم سے منسلک ایک مسلم مذہبی رہنما کے طور پر پیش کیا گیا ہے، جو تقریباً 1906 میں نیرو میں پیدا ہوا تھا اور 15 اکتوبر 1988 کو گگنوا میں فوت ہوا تھا، اور ایک مذہبی برادری اور آئیورین قصبوں میں سنیما گھروں کے نیٹ ورک کے ساسنڈرا اور اس کی عمارت، گگنوا میں اس کی نظربندی کا ذکر کرتا ہے۔"
  tr: "Şeyh Yacouba Sila hakkında Fransızca Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Kendisi, yaklaşık 1906 yılında Nioro'da doğmuş ve 15 Ekim 1988'de Ganyua'da ölmüş Hamaliya ile ilişkili bir Müslüman dini rehber tarafından sunulmaktadır. Kitap, Sasandra'daki ikametini ve ardından Fildişi Sahili şehirlerinde dini bir topluluk ve sinema ağı kurmasını anlatır."
  id: "Artikel Wikipedia Prancis tentang Sheikh Yacouba Sila; hanya digunakan untuk fakta entitas. Ia diperkenalkan oleh seorang pemandu agama Muslim yang terkait dengan Hamaliya yang lahir sekitar tahun 1906 di Nioro dan meninggal pada 15 Oktober 1988 di Ganyua. Artikel tersebut menceritakan kediamannya di Sasandra dan kemudian membangun komunitas keagamaan serta jaringan bioskop di kota-kota Pantai Gading."
