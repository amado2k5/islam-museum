  ar: "مقالة ويكيبيديا الإنجليزية عن عثمان سيمبين؛ تُستخدم لوقائع الكيان فقط. توثّق أصوله السريرية من جهة أمه ودراسته في مدرسة قرآنية وعضويته في الحزب الشيوعي وموضوعات أعماله الناقدة للدين، ودفنه في كفن مزيّن بآيات قرآنية."
  en: "English Wikipedia article on Ousmane Sembène; used for entity facts only. It records his Serer descent through his mother, his madrasa schooling, his Communist Party membership, his work's themes including 'the failings of religion', and his burial in a shroud adorned with Qur'anic verses."
