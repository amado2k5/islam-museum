summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن عثمان سيمبين؛ تُستخدم لوقائع الكيان فقط. توثّق أصوله السريرية من جهة أمه ودراسته في مدرسة قرآنية وعضويته في الحزب الشيوعي وموضوعات أعماله الناقدة للدين، ودفنه في كفن مزيّن بآيات قرآنية."
  en: "English Wikipedia article on Ousmane Sembène; used for entity facts only. It records his Serer descent through his mother, his madrasa schooling, his Communist Party membership, his work's themes including 'the failings of religion', and his burial in a shroud adorned with Qur'anic verses."
  es: "Artículo de la Wikipedia en inglés sobre Ousmane Sembène; utilizado únicamente para datos sobre la persona. En él se recoge su ascendencia serer por parte de su madre, su educación en una madrasa, su afiliación al Partido Comunista, los temas de su obra, entre los que se incluyen «los fracasos de la religión», y su entierro en una mortaja adornada con versículos coránicos."
  fr: "Article de Wikipédia en anglais sur Ousmane Sembène; utilisé uniquement pour les informations relatives à l’entité. Il relate ses origines sérères par sa mère, sa scolarité à la madrasa, son appartenance au Parti communiste, les thèmes de son œuvre, notamment « les failles de la religion », et son inhumation dans un linceul orné de versets coraniques."
  ur: "Ousmane Sembène پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کی والدہ، مدرسہ کی تعلیم، اس کی کمیونسٹ پارٹی کی رکنیت، اس کے کام کے موضوعات بشمول 'مذہب کی ناکامیاں'، اور قرآنی آیات سے مزین کفن میں اس کی تدفین کے ذریعے اس کے سیر کے نزول کو ریکارڈ کیا گیا ہے۔"
  tr: "Osman Sempin hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Klinik kökenleri annesinin tarafından, Kur'an okulunda çalışmaları, Komünist Parti üyeliği, dini eleştiren eserlerinin konuları ve Kur'an ayetleriyle süslenmiş bir kefene gömülü olarak belgelenmiştir."
  id: "Artikel Wikipedia bahasa Inggris tentang Osman Sempin; digunakan hanya untuk fakta entitas. Asal-usul klinisnya terdokumentasi dari pihak ibu, studinya di sekolah Al-Qur'an, keanggotaannya di Partai Komunis, subjek karya-karyanya yang kritis terhadap agama, dan pemakamannya dalam kain kafan yang dihiasi ayat-ayat Al-Qur'an."
