reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Covers his birth at Ziguinchor (1 January 1923, with 'or 8 January 1923' also given in the lead), his fisherman father, his Serer maternal line and childhood part in the Tuur festival, madrasa and French schooling to 1936, Dakar labour from 1938, conscription in 1944, the 1947 railroad strike, the Marseille docks, the CGT and the Communist Party, the novels from Le Docker noir (1956) to Niiwam et Taaw (1987), film study at the Gorky Film Studio in 1962-63, the films from Borom Sarret (1963) to Moolaadé (2004), the censorship of Ceddo in Senegal, his death at Dakar on 9 June 2007 and his burial in a shroud adorned with Qur'anic verses. It states no religion for him personally. Read in full on 24 October 2026."
