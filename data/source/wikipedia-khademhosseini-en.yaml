summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن علي خادم حسيني؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في طهران سنة 1975 وهجرة أسرته إلى كندا، ودكتوراه معهد ماساتشوستس 2005 بإشراف روبرت لانغر، ومناصبه في هارفارد وجامعة كاليفورنيا في لوس أنجلوس ومعهد تيراساكي، وعمله في المواد الحيوية وهندسة الأنسجة وشركاته."
  en: "English Wikipedia article on Ali Khademhosseini; used for entity facts only. It recounts his birth in Tehran in 1975 and his family's move to Canada, his 2005 MIT doctorate under Robert Langer, his posts at Harvard, UCLA and the Terasaki Institute, his work in biomaterials and tissue engineering, and his companies."
  es: "Artículo de la Wikipedia en inglés sobre Ali Khademhosseini; utilizado únicamente para datos sobre la persona. Relata su nacimiento en Teherán en 1975 y la mudanza de su familia a Canadá, su doctorado en el MIT en 2005 bajo la dirección de Robert Langer, sus cargos en Harvard, UCLA y el Instituto Terasaki, su trabajo en biomateriales e ingeniería de tejidos y sus empresas."
  fr: "Article de Wikipédia en anglais sur Ali Khademhosseini; utilisé uniquement à des fins d'information sur l'entité. Il relate sa naissance à Téhéran en 1975 et le déménagement de sa famille au Canada, son doctorat obtenu au MIT en 2005 sous la direction de Robert Langer, ses postes à Harvard, à l'UCLA et à l'Institut Terasaki, ses travaux sur les biomatériaux et l'ingénierie tissulaire, ainsi que ses entreprises."
  ur: "علی خادم حسینی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1975 میں تہران میں اس کی پیدائش اور اس کے خاندان کے کینیڈا منتقل ہونے، رابرٹ لینگر کے تحت اس کی 2005 میں ایم آئی ٹی کی ڈاکٹریٹ، ہارورڈ، یو سی ایل اے اور ٹیراساکی انسٹی ٹیوٹ میں ان کی پوسٹوں، بائیو میٹریلز اور ٹشو انجینئرنگ میں ان کے کام، اور ان کی کمپنیوں کا ذکر کرتا ہے۔"
  tr: "Ali Khadem Hosseini hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1975'te Tahran'da doğmasını, ailesinin Kanada'ya göçünü, 2005'te Massachusetts Enstitüsü'nden Robert Langer danışmanlığında yaptığı doktora derecesini, Harvard, California Üniversitesi, Los Angeles, Terrasaki Enstitüsü'ndeki görevlerini, biyomalzemeler, doku mühendisliği ve şirketlerindeki çalışmalarını anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Ali Khadem Hosseini; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya di Teheran pada tahun 1975, migrasi keluarganya ke Kanada, gelar PhD dari Massachusetts Institute pada 2005 di bawah bimbingan Robert Langer, posisinya di Harvard, University of California, Los Angeles, Terrasaki Institute, karyanya di bidang biomaterial, rekayasa jaringan, dan perusahaan-perusahaannya."
