  ar: "مقالة ويكيبيديا الإنجليزية عن علي خادم حسيني؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في طهران سنة 1975 وهجرة أسرته إلى كندا، ودكتوراه معهد ماساتشوستس 2005 بإشراف روبرت لانغر، ومناصبه في هارفارد وجامعة كاليفورنيا في لوس أنجلوس ومعهد تيراساكي، وعمله في المواد الحيوية وهندسة الأنسجة وشركاته."
  en: "English Wikipedia article on Ali Khademhosseini; used for entity facts only. It recounts his birth in Tehran in 1975 and his family's move to Canada, his 2005 MIT doctorate under Robert Langer, his posts at Harvard, UCLA and the Terasaki Institute, his work in biomaterials and tissue engineering, and his companies."
