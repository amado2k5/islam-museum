reliability_note: "A scholarly national encyclopedia entry, independent of Wikipedia. Read in full on 25 October 2026. It styles her zamindar, advocate and activist of female education, social worker and poet. It adds detail the English article lacks or states differently: her proficiency included Urdu (the English article's prose lists Arabic, Persian, Sanskrit and Bengali — both language sets are recorded); the Pashchimgaon foundation was a madrasah, later upgraded to the college named Nawab Faizunnesa College; in 1894 she performed hajj and is said to have founded a madrasah and an inn (musafirkhana) at Makkah; before her death she gave away a large portion of her landed property to provide scholarships for needy students, a waqf fund that still provides financial aid; she died in 1903 in her own village and was buried in the family graveyard; and she was awarded the posthumous Ekushey Padak for 2004. On her writing it stresses that she cultivated Bangla at a time when upper-class Muslims did not normally practise it, calls Rupjalal (1876) a prose-and-verse autobiographical allegory depicting the social condition of nineteenth-century Muslim society, and lists her other books as Sangitsar and Sangitlahari (the English article adds Tattwa O Jatiya Sangeet). It names no school for her."
