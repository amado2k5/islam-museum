summary:
  ar: "مدخل نواب فايز النساء تشودراني في بنغلابيديا، الموسوعة الوطنية لبنغلاديش، بقلم غوبيكا رانجان تشاكرابورتي؛ تُستخدم لوقائع الكيان فقط. تذكر مولدها في بشيم غاون بكوميلا سنة 1834 وإتقانها البنغالية والسنسكريتية والعربية والأردية رغم الحجاب الصارم، ومدرسة البنات التي أسستها في كوميلا سنة 1873، ومستشفى النساء والمستوصف الخيري، وحجها سنة 1894 ووقفها للمنح، ووفاتها في قريتها سنة 1903."
  en: "Entry 'Choudhurani, Nawab Faizunnesa' in Banglapedia, the national encyclopedia of Bangladesh, by Gopika Ranjan Chakraborty; used for entity facts only. It records her birth at Pashchimgaon in Comilla in 1834, her proficiency in Bangla, Sanskrit, Arabic and Urdu despite strict purdah, the girls' high school she established at Comilla in 1873, the women's hospital and charitable dispensary, her hajj in 1894 and her scholarship waqf, and her death in her own village in 1903."
