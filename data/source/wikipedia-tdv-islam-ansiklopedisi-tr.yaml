  ar: "مقالة ويكيبيديا التركية عن موسوعة وقف الديانة التركي الإسلامية، المراجعة 37838306؛ لوقائع الكيان فقط: موسوعة تركية في العلوم الإسلامية والحضارة صدرت بين 1988 و2013 في 44 مجلدًا ثم مجلدين ملحقين سنة 2016، ومتاحة كاملة على موقعها، ونالت الجائزة الكبرى للثقافة والفنون من رئاسة الجمهورية سنة 2014."
