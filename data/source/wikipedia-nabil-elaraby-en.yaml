summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن نبيل العربي؛ تُستخدم لوقائع الكيان فقط. تروي ميلاده في 15 مارس 1935، ودراسته القانون في القاهرة ونيويورك، وعضويته في محكمة العدل الدولية (2001–2006)، ووزارته للخارجية سنة 2011، وأمانته العامة لجامعة الدول العربية (2011–2016) خلفًا لعمرو موسى، ووفاته في 26 أغسطس 2024."
  en: "English Wikipedia article on Nabil Elaraby; used for entity facts only. It recounts his birth on 15 March 1935, his legal studies in Cairo and New York, his membership of the International Court of Justice (2001–2006), his foreign ministership in 2011, and his tenure as Secretary-General of the Arab League (2011–2016) succeeding Amr Moussa, and his death on 26 August 2024."
  es: "Artículo de la Wikipedia en inglés sobre Nabil Elaraby; utilizado únicamente para datos sobre la persona. Relata su nacimiento el 15 de marzo de 1935, sus estudios de derecho en El Cairo y Nueva York, su pertenencia a la Corte Internacional de Justicia (2001-2006), su cargo como ministro de Asuntos Exteriores en 2011, su mandato como secretario general de la Liga Árabe (2011-2016) sucediendo a Amr Moussa y su fallecimiento el 26 de agosto de 2024."
  fr: "Article de Wikipédia en anglais sur Nabil Elaraby; utilisé uniquement pour les informations sur l’entité. Il relate sa naissance le 15 mars 1935, ses études de droit au Caire et à New York, son mandat à la Cour internationale de Justice (2001-2006), son poste de ministre des Affaires étrangères en 2011, son mandat de secrétaire général de la Ligue arabe (2011-2016) succédant à Amr Moussa, et son décès le 26 août 2024."
  ur: "نبیل الارابی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 15 مارچ 1935 کو ان کی پیدائش، قاہرہ اور نیویارک میں ان کی قانونی تعلیم، بین الاقوامی عدالت انصاف کی رکنیت (2001–2006)، 2011 میں ان کی وزارت خارجہ، اور عمرو موسیٰ کے بعد عرب لیگ کے سیکرٹری جنرل (2011–2016) کے طور پر ان کی مدت کا ذکر ہے، اور 26 اگست کو ان کی موت۔"
  tr: "Nabil Al-Arabi hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 15 Mart 1935'teki doğumunu, Kahire ve New York'taki hukuk eğitimini, Uluslararası Adalet Divanı üyeliğini (2001–2006), 2011'de Dışişleri Bakanlığını ve Amr Moussa'nın yerine Arap Ligi Genel Sekreterliğini (2011–2016) ve 26 Ağustos 2024'teki ölümünü anlatır."
  id: "Artikel Wikipedia bahasa Inggris tentang Nabil Al-Arabi; digunakan hanya untuk fakta entitas. Artikel ini menceritakan kelahirannya pada 15 Maret 1935, studi hukumnya di Kairo dan New York, keanggotaannya di Mahkamah Internasional (2001–2006), Kementerian Luar Negeri pada 2011, serta Sekretaris Jenderal Liga Arab (2011–2016) menggantikan Amr Moussa, dan kematiannya pada 26 Agustus 2024."
