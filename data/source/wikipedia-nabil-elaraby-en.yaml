  ar: "مقالة ويكيبيديا الإنجليزية عن نبيل العربي؛ تُستخدم لوقائع الكيان فقط. تروي ميلاده في 15 مارس 1935، ودراسته القانون في القاهرة ونيويورك، وعضويته في محكمة العدل الدولية (2001–2006)، ووزارته للخارجية سنة 2011، وأمانته العامة لجامعة الدول العربية (2011–2016) خلفًا لعمرو موسى، ووفاته في 26 أغسطس 2024."
  en: "English Wikipedia article on Nabil Elaraby; used for entity facts only. It recounts his birth on 15 March 1935, his legal studies in Cairo and New York, his membership of the International Court of Justice (2001–2006), his foreign ministership in 2011, and his tenure as Secretary-General of the Arab League (2011–2016) succeeding Amr Moussa, and his death on 26 August 2024."
