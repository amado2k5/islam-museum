summary:
  ar: "مقالة ويكيبيديا العربية عن عمر السومة؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في 23 مارس 1989 في دير الزور وإقامته في دمشق، وتقرن سنة ميلاده بسنة 1409 هـ في تصنيفاتها. ولا تذكر ديانته."
  en: "Arabic Wikipedia article on Omar Al Somah; used for entity facts only. It gives his birth on 23 March 1989 in Deir ez-Zor, records Damascus as his residence, and pairs his birth year with 1409 AH in its categories. It makes no statement about his religion."
  es: "Artículo de Wikipedia en árabe sobre Omar Al Somah; utilizado únicamente para obtener información sobre la persona. Indica que nació el 23 de marzo de 1989 en Deir ez-Zor, registra Damasco como su lugar de residencia y asocia su año de nacimiento con el año 1409 de la Hégira en sus categorías. No menciona su religión."
  fr: "Article de Wikipédia en arabe sur Omar Al Somah; utilisé uniquement pour les informations relatives à l’entité. Il indique sa naissance le 23 mars 1989 à Deir ez-Zor, mentionne Damas comme lieu de résidence et associe son année de naissance à 1409 AH dans ses catégories. Il ne mentionne pas sa religion."
  ur: "عمر الصوم پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ ان کی پیدائش 23 مارچ 1989 کو دیر الزور میں ہوئی، دمشق کو ان کی رہائش گاہ کے طور پر درج کرتا ہے، اور اس کے زمرے میں اس کے سال پیدائش کو 1409 ہجری کے ساتھ جوڑتا ہے۔ اس کے مذہب کے بارے میں کوئی بیان نہیں ہے۔"
  tr: "Omer el-Somah hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Doğumunun 23 Mart 1989'da Deyr ez-Zor'da ve ikametgahını Şam'da belirtir ve sınıflandırmalarında doğum yılını 1409 Hicri ile ilişkilendirir. Dini belirtilmemiştir."
  id: "Artikel Wikipedia berbahasa Arab tentang Omar al-Somah; digunakan hanya untuk fakta entitas. Artikel tersebut menyebutkan kelahirannya pada 23 Maret 1989 di Deir ez-Zor dan kediamannya di Damaskus, serta mengaitkan tahun kelahirannya dengan 1409 AH dalam klasifikasi mereka. Artikel tersebut tidak menyebutkan agamanya."
