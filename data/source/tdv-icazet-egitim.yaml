reliability_note: "Read on 1 November 2026 in the web edition. Printed pages from the entry's lines: Cemil Akpınar pp. 393–400, Mehmet Ali Sarı pp. 400–401 (the Qur'anic recitation part). Read in full: the definition, the early history of the ijaza in hadith, the four elements and conditions, the ijaza for fatwa and teaching, the general ijaza, the Egyptian (1872) and Ottoman (1914) formalisation. Read in part: the hadith and recitation sections, which are cited only for the general points stated at their openings. The entry's terms are rewritten in the museum's own words; the hadith-transmission details are not used for the jurist's record beyond what is cited."
