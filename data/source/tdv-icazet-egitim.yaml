summary:
  ar: "مدخل «إجازة» (القسم التعليمي) في موسوعة TDV الإسلامية (المجلد 21، إسطنبول 2000، ص 393–401): معنى الإجازة في الرواية والتعليم، وتاريخها، وأركانها وشروطها، وإجازة الإفتاء والتدريس، والإجازة في العهد العثماني ومصر، والإجازة في القراءات."
  en: "The education section of the TDV İslâm Ansiklopedisi entry 'İCÂZET' (vol. 21, Istanbul 2000, pp. 393–401): the meaning of ijaza in transmission and teaching, its history, its elements and conditions, the ijaza for fatwa and teaching, the ijaza in the Ottoman and Egyptian systems, and the ijaza in Qur'anic recitation."
