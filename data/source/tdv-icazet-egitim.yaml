label: { ar: "الإجازة ⁦(في التعليم)⁩ — موسوعة TDV الإسلامية ⁦(جميل آقبينار، محمد علي ساري)⁩", en: "İCÂZET (education) — TDV İslâm Ansiklopedisi (Cemil Akpınar, Mehmet Ali Sarı)" }
summary:
  ar: "مدخل «إجازة» ⁦(القسم التعليمي)⁩ في موسوعة TDV الإسلامية ⁦(المجلد 21، إسطنبول 2000، ص 393–401)⁩: معنى الإجازة في الرواية والتعليم، وتاريخها، وأركانها وشروطها، وإجازة الإفتاء والتدريس، والإجازة في العهد العثماني ومصر، والإجازة في القراءات."
  en: "The education section of the TDV İslâm Ansiklopedisi entry 'İCÂZET' (vol. 21, Istanbul 2000, pp. 393–401): the meaning of ijaza in transmission and teaching, its history, its elements and conditions, the ijaza for fatwa and teaching, the ijaza in the Ottoman and Egyptian systems, and the ijaza in Qur'anic recitation."
  es: "La sección de educación de la entrada 'İCÂZET' de la TDV İslâm Ansiklopedisi (vol. 21, Estambul 2000, págs. 393–401): el significado de la ijaza en la transmisión y la enseñanza, su historia, sus elementos y condiciones, la ijaza para la fatwa y la enseñanza, la ijaza en los sistemas otomano y egipcio, y la ijaza en la recitación coránica."
  fr: "La section éducation de l'entrée 'İCÂZET' de TDV İslâm Ansiklopedisi (vol. 21, Istanbul 2000, pp. 393–401): la signification de l'ijaza dans la transmission et l'enseignement, son histoire, ses éléments et conditions, l'ijaza pour la fatwa et l'enseignement, l'ijaza dans les systèmes ottoman et égyptien, et l'ijaza dans la récitation coranique."
  ur: "TDV İslâm Ansiklopedisi entry 'ICÂZET' کا تعلیمی سیکشن ⁦(جلد 21، استنبول 2000، صفحہ 393–401)⁩: نشر و تدریس میں اعجاز کا مفہوم، اس کی تاریخ، اس کے عناصر اور حالات، فتویٰ اور تعلیم کا اعجاز، قرآنی نظام میں اعجاز اور قرآنی نظام میں اعجاز۔ تلاوت"
  tr: "TDV İslami Ansiklopedisi'nde \"İjaze\"ye (Eğitim Bölümü) Giriş (Cilt 21, İstanbul 2000, ss. 393–401): İjazenin rivayet ve öğretimdeki anlamı, tarihi, temel taşları ve koşulları, fetvaların verilişi ve öğreti, Osmanlı döneminde ve Mısır'da icaze, Kur'an okumalarında icaze."
  id: "Pengantar \"Ijazah\" (Bagian Pendidikan) dalam Ensiklopedia Islam TDV (Vol. 21, Istanbul 2000, hlm. 393–401): Makna ijazah dalam narasi dan pengajaran, sejarah, pilar, dan kondisinya, penerbitan fatwa dan ajaran, ijazah pada era Ottoman dan Mesir, serta ijazah dalam bacaan Al-Qur'an."
