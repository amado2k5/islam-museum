  ar: "مقالة ويكيبيديا العربية عن ميان محمد شافي (10 آذار 1869 – 7 كانون الثاني 1932)؛ تُستخدم لوقائع الكيان فقط. مقالة قصيرة تؤكد تاريخيه ودوره في تأسيس رابطة مسلمي عموم الهند ووفاته ودفنه في مقبرة أسلافه في باغبانبورا بلاهور، وتسمّي ابنته جهان آرا شاه نواز بين أولاده."
  en: "Arabic Wikipedia article on Mian Muhammad Shafi (10 March 1869 – 7 January 1932); used for entity facts only. A short article confirming his dates, his part in founding the All-India Muslim League, his death and burial in the ancestral graveyard at Baghbanpura, Lahore, and naming his daughter Jahanara Shahnawaz among his children."
