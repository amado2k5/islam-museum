summary:
  ar: "مقالة ويكيبيديا العربية عن ميان محمد شافي ⁦(10 آذار 1869 – 7 كانون الثاني 1932)⁩؛ تُستخدم لوقائع الكيان فقط. مقالة قصيرة تؤكد تاريخيه ودوره في تأسيس رابطة مسلمي عموم الهند ووفاته ودفنه في مقبرة أسلافه في باغبانبورا بلاهور، وتسمّي ابنته جهان آرا شاه نواز بين أولاده."
  en: "Arabic Wikipedia article on Mian Muhammad Shafi (10 March 1869 – 7 January 1932); used for entity facts only. A short article confirming his dates, his part in founding the All-India Muslim League, his death and burial in the ancestral graveyard at Baghbanpura, Lahore, and naming his daughter Jahanara Shahnawaz among his children."
  es: "Artículo en árabe de la Wikipedia sobre Mian Muhammad Shafi (10 de marzo de 1869 - 7 de enero de 1932); utilizado únicamente para datos biográficos. Un breve artículo que confirma sus fechas, su participación en la fundación de la Liga Musulmana de la India, su fallecimiento y entierro en el cementerio ancestral de Baghbanpura, Lahore, y que menciona a su hija Jahanara Shahnawaz entre sus hijos."
  fr: "Article de Wikipédia en arabe sur Mian Muhammad Shafi (10 mars 1869 – 7 janvier 1932); utilisé uniquement à des fins d’information. Ce court article confirme ses dates de naissance et de décès, son rôle dans la fondation de la Ligue musulmane panindienne, sa mort et son inhumation dans le cimetière familial de Baghbanpura, à Lahore, et mentionne sa fille Jahanara Shahnawaz parmi ses enfants."
