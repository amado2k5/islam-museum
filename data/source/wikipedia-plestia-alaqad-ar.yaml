  fr: "Article encyclopédique en arabe, édité par la communauté et consulté intégralement à la date indiquée; il mentionne son nom complet (Plestia Husam Kamel Alaqad), précise qu’elle est née à Gaza le 10 décembre 2001 et évoque son diplôme de l’Université de la Méditerranée orientale ainsi que ses documents relatifs à la guerre. Il ne contient aucun élément religieux."
  ur: "عربی میں کمیونٹی کی طرف سے ترمیم شدہ انسائیکلوپیڈیا مضمون، بیان کردہ نظر ثانی پر مکمل طور پر بازیافت کیا گیا؛ اس نے اس کا پورا نام (Plestia Husam Kamel Alacad) بتایا ہے، وہ بتاتی ہیں کہ وہ 10 دسمبر 2001 کو غزہ میں پیدا ہوئی تھیں، اور مشرقی بحیرہ روم یونیورسٹی میں اس کی ڈگری اور اس کی جنگی دستاویزات کا احاطہ کرتی ہے۔ اس میں کوئی مذہبی مواد نہیں ہے۔"
  tr: "Gazze doğumlu Filistinli gazeteci Hossam Kamel Al-Akkad (d. 10 Aralık 2001) tarafından Ballastia hakkında Arapça ansiklopedik bir makale."
