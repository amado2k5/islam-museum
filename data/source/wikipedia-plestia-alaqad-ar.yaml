  en: "Community-edited encyclopedia article in Arabic, retrieved in full at the stated revision; it gives her full name (Plestia Husam Kamel Alaqad), states she was born in Gaza on 10 December 2001, and covers her degree at Eastern Mediterranean University and her war documentation. It carries no religion content."
