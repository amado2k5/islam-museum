summary:
  ar: "مقالة ويكيبيديا الفرنسية عن الطيب العقبي؛ تُستخدم لوقائع الكيان فقط. تعطي مولده نحو 1890 بسيدي عقبة (شوال 1307هـ) ووفاته في مايو 1960 وتعدّ مكان وفاته غير معروف، ودراسته بالمدينة ومكة وإدارته جريدة «القبلة» للشريف حسين، وعودته إلى الجزائر 1920، ومشاركته في تأسيس جمعية العلماء المسلمين الجزائريين 1931، ومحاكمته وبراءته 1939، وفتواه بحماية اليهود زمن الحرب. لا تسمّي مذهبًا له."
  en: "French Wikipedia article on Tayeb el-Oqbi; used for entity facts only. It gives his birth about 1890 at Sidi Okba (Shawwal 1307 AH) and his death in May 1960 with the place of death marked unknown, his studies in Medina and Mecca and his editorship of al-Qibla for Sharif Hussein, his return to Algeria in 1920, his part in founding the Association of Algerian Muslim Ulama in 1931, his 1936 arrest, 1939 acquittal, and his wartime fatwa protecting Jews. It names no school for him."
