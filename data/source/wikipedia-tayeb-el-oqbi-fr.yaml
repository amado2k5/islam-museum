summary:
  ar: "مقالة ويكيبيديا الفرنسية عن الطيب العقبي؛ تُستخدم لوقائع الكيان فقط. تعطي مولده نحو 1890 بسيدي عقبة ⁦(شوال 1307هـ)⁩ ووفاته في مايو 1960 وتعدّ مكان وفاته غير معروف، ودراسته بالمدينة ومكة وإدارته جريدة «القبلة» للشريف حسين، وعودته إلى الجزائر 1920، ومشاركته في تأسيس جمعية العلماء المسلمين الجزائريين 1931، ومحاكمته وبراءته 1939، وفتواه بحماية اليهود زمن الحرب. لا تسمّي مذهبًا له."
  en: "French Wikipedia article on Tayeb el-Oqbi; used for entity facts only. It gives his birth about 1890 at Sidi Okba (Shawwal 1307 AH) and his death in May 1960 with the place of death marked unknown, his studies in Medina and Mecca and his editorship of al-Qibla for Sharif Hussein, his return to Algeria in 1920, his part in founding the Association of Algerian Muslim Ulama in 1931, his 1936 arrest, 1939 acquittal, and his wartime fatwa protecting Jews. It names no school for him."
  es: "Artículo de la Wikipedia en francés sobre Tayeb el-Oqbi; utilizado únicamente para datos biográficos. Indica su nacimiento alrededor de 1890 en Sidi Okba (Shawwal 1307 AH) y su fallecimiento en mayo de 1960, con lugar de defunción desconocido; sus estudios en Medina y La Meca; su labor como editor de al-Qibla para Sharif Hussein; su regreso a Argelia en 1920; su participación en la fundación de la Asociación de Ulemas Musulmanes Argelinos en 1931; su arresto en 1936; su absolución en 1939; y su fatua en tiempos de guerra en defensa de los judíos. No menciona ninguna escuela a la que pertenezca."
  fr: "L'article de Wikipédia en français consacré à Tayeb el-Oqbi, utilisé uniquement pour les informations le concernant, indique sa naissance vers 1890 à Sidi Okba (Shawwal 1307 AH) et sa mort en mai 1960 (lieu inconnu). Il relate ses études à Médine et à La Mecque, son poste de rédacteur en chef d'al-Qibla pour le chérif Hussein, son retour en Algérie en 1920, sa participation à la fondation de l'Association des oulémas musulmans d'Algérie en 1931, son arrestation en 1936, son acquittement en 1939 et sa fatwa, émise pendant la guerre, en faveur des Juifs. Aucune école n'est mentionnée."
