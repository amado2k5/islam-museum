  ar: "مقالة ويكيبيديا الإنجليزية عن راسونا سعيد؛ تُستخدم لوقائع الكيان فقط. تروي نشأتها في مانينجاو وتعليمها في مدرسة دينية بوتري، وخطبها المناهضة للاستعمار ونشاطها في بيرمي، ووفاتها في جاكرتا سنة 1965 ودفنها في مقبرة أبطال كاليباتا."
