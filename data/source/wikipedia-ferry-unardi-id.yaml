summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن فيري أوناردي، المولود في بادانغ بغرب سومطرة في 16 كانون الثاني 1988 لأسرة من أصل صيني كانت تدير متجر بقالة صغيرًا؛ تذكر دراسته الثانوية في مدرسة دون بوسكو في بادانغ، ودراسته المزدوجة في بيردو، وعمله ثلاث سنوات في مايكروسوفت، وتأسيسه ترافيلوكا في جاكرتا أوائل 2012 مع ألبرت جانغ وديريانتو كوسوما."
  en: "Indonesian Wikipedia article on Ferry Unardi, born in Padang, West Sumatra, on 16 January 1988 into a family of Chinese descent that ran a small grocery shop; it records his schooling at SMA Don Bosco in Padang, his double degree at Purdue, his three years at Microsoft, and his founding of Traveloka in Jakarta in early 2012 with Albert Zhang and Derianto Kusuma."
  es: "Artículo de la Wikipedia en indonesio sobre Ferry Unardi, nacido en Padang, Sumatra Occidental, el 16 de enero de 1988 en una familia de ascendencia china que regentaba una pequeña tienda de comestibles; en él se recogen sus estudios en la escuela secundaria SMA Don Bosco de Padang, su doble titulación en Purdue, sus tres años en Microsoft y la fundación de Traveloka en Yakarta a principios de 2012 junto con Albert Zhang y Derianto Kusuma."
  fr: "L'article de Wikipédia indonésien sur Ferry Unardi, né à Padang, dans l'ouest de Sumatra, le 16 janvier 1988, dans une famille d'origine chinoise qui tenait une petite épicerie; il relate sa scolarité au SMA Don Bosco de Padang, son double diplôme à Purdue, ses trois années chez Microsoft et la fondation de Traveloka à Jakarta début 2012 avec Albert Zhang et Derianto Kusuma."
