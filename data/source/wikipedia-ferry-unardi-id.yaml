  ar: "مقالة ويكيبيديا الإندونيسية عن فيري أوناردي، المولود في بادانغ بغرب سومطرة في 16 كانون الثاني 1988 لأسرة من أصل صيني كانت تدير متجر بقالة صغيرًا؛ تذكر دراسته الثانوية في مدرسة دون بوسكو في بادانغ، ودراسته المزدوجة في بيردو، وعمله ثلاث سنوات في مايكروسوفت، وتأسيسه ترافيلوكا في جاكرتا أوائل 2012 مع ألبرت جانغ وديريانتو كوسوما."
  en: "Indonesian Wikipedia article on Ferry Unardi, born in Padang, West Sumatra, on 16 January 1988 into a family of Chinese descent that ran a small grocery shop; it records his schooling at SMA Don Bosco in Padang, his double degree at Purdue, his three years at Microsoft, and his founding of Traveloka in Jakarta in early 2012 with Albert Zhang and Derianto Kusuma."
