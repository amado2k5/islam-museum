summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أنصار برني؛ تُستخدم لوقائع الكيان فقط. تروي ولادته في كراتشي سنة 1956 — وصندوق معلوماتها ومقدمتها يعطيان 14 أغسطس بينما يعطي متنها 16 أغسطس — وسجنه سنة 1977 وتأسيسه صندوق أنصار برني الدولي ووزارته الاتحادية لحقوق الإنسان."
  en: "English Wikipedia article on Ansar Burney; used for entity facts only. It recounts his birth at Karachi in 1956 — its infobox and lead give 14 August while its early-life section gives 16 August — his 1977 imprisonment, his founding of the Ansar Burney Trust International, and his federal human-rights ministry."
  es: "Artículo de la Wikipedia en inglés sobre Ansar Burney; utilizado únicamente para obtener información sobre la persona. Relata su nacimiento en Karachi en 1956 (su ficha informativa y el primer párrafo indican el 14 de agosto, mientras que la sección sobre su juventud indica el 16 de agosto), su encarcelamiento en 1977, la fundación de Ansar Burney Trust International y su ministerio federal de derechos humanos."
  fr: "Article de Wikipédia en anglais sur Ansar Burney; utilisé uniquement pour les informations sur l’entité. Il relate sa naissance à Karachi en 1956 (son infobox et son introduction indiquent le 14 août, tandis que sa section sur sa jeunesse indique le 16 août), son emprisonnement en 1977, la fondation de l’Ansar Burney Trust International et son ministère fédéral des droits de l’homme."
  ur: "انصار برنی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1956 میں کراچی میں ان کی پیدائش کا ذکر کرتا ہے - اس کا معلوماتی باکس اور لیڈ 14 اگست دیتا ہے جبکہ اس کا ابتدائی زندگی کا حصہ 16 اگست دیتا ہے - ان کی 1977 کی قید، انصار برنی ٹرسٹ انٹرنیشنل کی بنیاد، اور اس کی وفاقی وزارت انسانی حقوق۔"
