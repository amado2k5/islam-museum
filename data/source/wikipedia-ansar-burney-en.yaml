reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 27 October 2026 and checked against the recorded revision. The article CONTRADICTS ITSELF on his birth day: its infobox and lead give 14 August 1956 at Karachi, its early-life section states 16 August 1956; the Urdu article and Wikidata both give 14 August, which is carried, the split recorded. It names his father as Syed Mukhtar Ahmed Burney, gives his master's in law from the University of Karachi, his student-leader years and imprisonment in 1977 under the military government, his founding of the Prisoners Aid Society and the Ansar Burney Trust International on his release, his term as Pakistan's federal minister for human rights in the 2007–2008 caretaker cabinet, and his Sitara-i-Imtiaz and Hilal-i-Imtiaz (received 23 March 2013). It makes no statement of his religion anywhere."
