summary:
  ar: "الفهرست لأبي الفرج محمد بن إسحاق النديم، موسوعة ببليوغرافية من القرن الرابع الهجري، نسخة مؤسسة الفرقان للتراث الإسلامي بلندن ⁦(تحقيق أيمن فؤاد سيد، مجلدان، 981 صفحة)⁩، نسخة رقمية ممسوحة في مكتبة الحصاد المحلية أُجريت عليها قراءة آلية بآبل فيجن."
  en: "Ibn al-Nadim's Fihrist — Al-Furqan Islamic Heritage Foundation edition (Ayman Fuad Sayyid, 2 vols, 981 pp), scanned and Apple-Vision OCR'd in the local harvest library."
  es: "El Fihrist de Ibn al-Nadim — Edición de la Fundación del Patrimonio Islámico Al-Furqan (Ayman Fuad Sayyid, 2 vols., 981 págs.), escaneado y procesado con OCR mediante Apple-Vision en la biblioteca local Harvest."
  fr: "Le Fihrist d'Ibn al-Nadim — Édition de la Fondation du patrimoine islamique Al-Furqan (Ayman Fuad Sayyid, 2 volumes, 981 pages), numérisé et traité par OCR Apple-Vision dans la bibliothèque locale Harvest."
  ur: "ابن الندیم کا فہرسٹ - الفرقان اسلامک ہیریٹیج فاؤنڈیشن ایڈیشن ⁦(ایمن فواد سید، 2 جلد، 981 پی پی)⁩، مقامی فصل کی لائبریری میں سکین کیا گیا اور ایپل ویژن OCR'd۔"
  tr: "Abu al-Faraj Muhammad ibn Ishaq al-Nadim tarafından yazılmış Al-Fihrist, 4. yüzyıl Hicri tarihli bibliyografik ansiklopedi, Londra'daki Al-Furqan İslami Miras Vakfı tarafından hazırlanmış el yazması (Ayman Fouad Sayyid tarafından düzenlenmiştir, iki cilt, 981 sayfa), yerel Al-Hassad kütüphanesinde taranmış dijital kopya ve Apple Vision'da mekanik olarak okunmuştur."
  id: "Al-Fihrist oleh Abu al-Faraj Muhammad ibn Ishaq al-Nadim, sebuah ensiklopedia bibliografi dari abad ke-4 AH, manuskrip oleh Al-Furqan Foundation for Islamic Heritage di London (disunting oleh Ayman Fouad Sayyid, dua volume, 981 halaman), salinan digital hasil scan di perpustakaan Al-Hassad setempat, yang dibaca secara mekanis di Apple Vision."
