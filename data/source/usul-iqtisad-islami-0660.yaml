summary:
  ar: "كتاب في النظام الاقتصادي الإسلامي لرفيق يونس المصري، يعرض فيه المؤلف مقدمات في تعريف الاقتصاد والموارد والحاجات ومنهج الاقتصاد الإسلامي، ثم الملكية المقيّدة، والحرية الاقتصادية والتدخل، ويتبعها الإنتاج والتبادل والاستهلاك والادخار والتوزيع. الطبعة المطبوعة على صفحة العنوان هي الأولى بتاريخ 1431 هـ / 2010م، وهي بحسب المقدمة الخامسة طبعة منقحة من أصل صدر سنة 1409 هـ / 1989م."
  en: "A book on the Islamic economic system by Rafiq Yunus al-Misri. Its opening parts define economics, resources and needs, and the method of Islamic economics; it then treats restricted ownership, economic freedom and state intervention, and goes on to production, exchange, consumption, saving and distribution."
