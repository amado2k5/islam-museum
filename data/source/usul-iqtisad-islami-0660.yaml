label:
  ar: أصول الاقتصاد الإسلامي — رفيق يونس المصري
  en: Principles of Islamic Economics — Rafiq Yunus al-Misri
summary:
  ar: "كتاب في النظام الاقتصادي الإسلامي لرفيق يونس المصري، يعرض فيه المؤلف مقدمات في تعريف الاقتصاد والموارد والحاجات ومنهج الاقتصاد الإسلامي، ثم الملكية المقيّدة، والحرية الاقتصادية والتدخل، ويتبعها الإنتاج والتبادل والاستهلاك والادخار والتوزيع. الطبعة المطبوعة على صفحة العنوان هي الأولى بتاريخ 1431 هـ / 2010م، وهي بحسب المقدمة الخامسة طبعة منقحة من أصل صدر سنة 1409 هـ / 1989م."
  en: "A book on the Islamic economic system by Rafiq Yunus al-Misri. Its opening parts define economics, resources and needs, and the method of Islamic economics; it then treats restricted ownership, economic freedom and state intervention, and goes on to production, exchange, consumption, saving and distribution."
  es: "Un libro sobre el sistema económico islámico de Rafiq Yunus al-Misri. Sus primeras secciones definen la economía, los recursos y las necesidades, así como el método de la economía islámica; luego aborda la propiedad restringida, la libertad económica y la intervención estatal, y continúa con la producción, el intercambio, el consumo, el ahorro y la distribución."
  fr: "Un ouvrage sur le système économique islamique de Rafiq Yunus al-Misri. Ses premières parties définissent l'économie, les ressources et les besoins, ainsi que la méthode de l'économie islamique; il traite ensuite de la propriété restreinte, de la liberté économique et de l'intervention de l'État, puis de la production, de l'échange, de la consommation, de l'épargne et de la distribution."
  ur: "رفیق یونس المصری کی اسلامی معاشی نظام پر ایک کتاب۔ اس کے ابتدائی حصے معاشیات، وسائل اور ضروریات اور اسلامی معاشیات کے طریقہ کار کی وضاحت کرتے ہیں۔ اس کے بعد یہ محدود ملکیت، معاشی آزادی اور ریاستی مداخلت کا علاج کرتا ہے، اور پیداوار، تبادلے، کھپت، بچت اور تقسیم تک جاتا ہے۔"
  tr: "Rafiq Younis Al-Masri tarafından yazılmış İslami ekonomik sistem üzerine bir kitap, yazarın İslami ekonominin tanımı, kaynakları, ihtiyaçları ve metodolojisine girişler sunması, ardından mülkiyet, ekonomik özgürlük ve müdahaleyi kısıtladığını, ardından üretim, değişim, tüketim, tasarruf ve dağıtımı ele almaktadır. Başlık sayfasındaki basılı baskı, 1431 Hicri / 2010 M.S. tarihli ilk baskıdır ve beşinci girişe göre, 1409 Hicri / 1989 yılında yayımlanan orijinalin gözden geçirilmiş bir baskısıdır."
  id: "Sebuah buku tentang sistem ekonomi Islam karya Rafiq Younis Al-Masri, di mana penulis menyajikan pengantar tentang definisi ekonomi, sumber daya, kebutuhan, dan metodologi ekonomi Islam, kemudian kepemilikan terbatas, kebebasan ekonomi, dan intervensi, diikuti oleh produksi, pertukaran, konsumsi, penabungan, dan distribusi. Edisi cetak di halaman judul adalah edisi pertama bertanggal 1431 H / 2010 M, dan menurut pengantar kelima, ini adalah edisi revisi dari yang asli yang diterbitkan pada 1409 H / 1989 M."
