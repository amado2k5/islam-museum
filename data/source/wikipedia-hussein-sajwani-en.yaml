  ar: "مقالة ويكيبيديا الإنجليزية عن حسين سجواني: مؤسس داماك العقارية سنة 2002؛ تذكر بدايته في شركة غازكو سنة 1981 ومشروع التموين، وإدانته غيابياً في مصر سنة 2011 وتسوية القضية سنة 2013، واستثماره مع ترامب بقيمة 20 مليار دولار في مراكز البيانات سنة 2025."
  en: "English Wikipedia article on Hussain Sajwani, founder of DAMAC Properties in 2002; it covers his start at GASCO in 1981 and his catering venture, his 2011 in-absentia conviction in Egypt and the 2013 settlement, and his 2025 US$20 billion data-centre announcement with Donald Trump."
  es: "Artículo en inglés de la Wikipedia sobre Hussain Sajwani, fundador de DAMAC Properties en 2002; abarca sus inicios en GASCO en 1981 y su empresa de catering, su condena en rebeldía en Egipto en 2011 y el acuerdo alcanzado en 2013, y su anuncio en 2025 sobre un centro de datos de 20.000 millones de dólares con Donald Trump."
  fr: "Article de Wikipédia en anglais sur Hussain Sajwani, fondateur de DAMAC Properties en 2002; il couvre ses débuts chez GASCO en 1981 et son entreprise de restauration, sa condamnation par contumace en Égypte en 2011 et le règlement de 2013, ainsi que son annonce en 2025 d'un centre de données de 20 milliards de dollars avec Donald Trump."
