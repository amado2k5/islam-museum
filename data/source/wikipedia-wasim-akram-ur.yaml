summary:
  ar: "مقالة ويكيبيديا الأردية عن وسيم أكرم؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 3 يونيو 1966 في لاهور وقيادته باكستان وكونه أول رامٍ يبلغ 500 ويكيت في مباريات اليوم الواحد ⁦(502 ويكيت في 356 مباراة)⁩ وعمله معلقا ومدربا بعد الاعتزال."
  en: "Urdu Wikipedia article on Wasim Akram; used for entity facts only. It records his birth on 3 June 1966 in Lahore, his Pakistan captaincy, his standing as the first bowler to 500 ODI wickets (502 in 356 matches) and his post-retirement commentary and coaching work."
  es: "Artículo de Wikipedia en urdu sobre Wasim Akram; utilizado únicamente para datos sobre la persona. En él se registra su nacimiento el 3 de junio de 1966 en Lahore, su capitanía en Pakistán, su condición de primer jugador de críquet en alcanzar los 500 wickets en partidos ODI (502 en 356 partidos) y su labor como comentarista y entrenador tras su retiro."
  fr: "Article Wikipédia en ourdou sur Wasim Akram; utilisé uniquement à des fins d’information. Il relate sa naissance le 3 juin 1966 à Lahore, son capitanat au sein de l’équipe nationale du Pakistan, son record de 500 guichets en ODI (premier lanceur à atteindre ce capitanat, avec 502 guichets en 356 matchs) et ses activités de commentateur et d’entraîneur après sa retraite."
  ur: "وسیم اکرم پر اردو ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 3 جون 1966 کو لاہور میں ان کی پیدائش، ان کی پاکستان کی کپتانی، 500 ون ڈے وکٹیں ⁦(356 میچوں میں 502)⁩ بنانے والے پہلے باؤلر کے طور پر کھڑے ہونے اور ریٹائرمنٹ کے بعد کی کمنٹری اور کوچنگ کے کام کو ریکارڈ کیا گیا ہے۔"
  tr: "Wasim Akram hakkında Urduca Wikipedia makalesi; sadece varlığın gerçekleri için kullanılmıştır. 3 Haziran 1966'da Lahor'da doğduğu dönemde, Pakistan'ı yöneterek, bir günlük maçlarda 500 wicket alan ilk Ram (356 maçta 502 kale) ve emeklilikten sonra yorumcu ve antrenörlük çalışmalarıyla hatırlanır."
  id: "Artikel Wikipedia Urdu tentang Wasim Akram; digunakan hanya untuk fakta entitas. Ia dikenang karena kelahirannya pada 3 Juni 1966 di Lahore, memimpin Pakistan, menjadi Ram pertama yang mengambil 500 wicket dalam pertandingan satu hari (502 wicket dalam 356 pertandingan), serta pekerjaannya sebagai komentator dan pelatih setelah pensiun."
