summary:
  ar: "مقالة ويكيبيديا العربية عن محمد حسين آزاد؛ تُستخدم لوقائع الكيان فقط. مقالة قصيرة تذكر أنه أديب وشاعر هندي اشتهر بنثره الأردي، ومن آثاره «آب حيات» و«دربار أكبري»، وتؤرخ حياته بسنتَي 1830 و1910 دون يوم أو شهر."
  en: "Arabic Wikipedia article on Muhammad Husain Azad; used for entity facts only. A short article recording him as an Indian writer and poet known for his Urdu prose, naming Aab-e-Hayat and Darbar-e-Akbari among his works, and dating his life only by the years 1830 and 1910."
  es: "Artículo en árabe de la Wikipedia sobre Muhammad Husain Azad; utilizado únicamente para datos sobre la persona. Un breve artículo que lo describe como un escritor y poeta indio conocido por su prosa en urdu, mencionando entre sus obras Aab-e-Hayat y Darbar-e-Akbari, y fechando su vida solo entre los años 1830 y 1910."
  fr: "Article de Wikipédia en arabe sur Muhammad Husain Azad; utilisé uniquement à des fins d’information sur l’entité. Ce court article le présente comme un écrivain et poète indien connu pour sa prose en ourdou, citant Aab-e-Hayat et Darbar-e-Akbari parmi ses œuvres, et situant sa vie entre 1830 et 1910."
  ur: "محمد حسین آزاد پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ ایک مختصر مضمون جس میں انہیں ایک ہندوستانی مصنف اور شاعر کے طور پر ریکارڈ کیا گیا جو ان کی اردو نثر کے لیے جانا جاتا ہے، جس میں آب حیات اور دربار اکبری کا نام ان کی تخلیقات میں شامل ہے، اور ان کی زندگی صرف 1830 اور 1910 کے درمیان ہے۔"
