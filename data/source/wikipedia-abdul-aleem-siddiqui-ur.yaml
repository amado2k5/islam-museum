  ar: "مقالة ويكيبيديا الأردية عن عبد العليم صدیقي؛ تعطي مولده في 15 رمضان 1310هـ (3 نيسان 1892) في ميرته ووفاته في 22 آب 1954 في المدينة المنورة، وتسميه في متنها محمد عبد العليم صدیقي قادري وتصفه بأنه والد مولانا شاه أحمد نوراني، ويحمل صندوقها حقول البرلوية والسنة والحنفية."
