summary:
  ar: "مقالة ويكيبيديا الأردية عن عبد العليم صدیقي؛ تعطي مولده في 15 رمضان 1310هـ ⁦(3 نيسان 1892)⁩ في ميرته ووفاته في 22 آب 1954 في المدينة المنورة، وتسميه في متنها محمد عبد العليم صدیقي قادري وتصفه بأنه والد مولانا شاه أحمد نوراني، ويحمل صندوقها حقول البرلوية والسنة والحنفية."
  en: "The Urdu Wikipedia article on Abdul Aleem Siddiqui; it gives his birth on 15 Ramadan 1310 AH (3 April 1892) at Meerut and his death on 22 August 1954 in Medina, styles him in its text Muhammad Abdul Aleem Siddiqi Qadri and identifies him as the father of Maulana Shah Ahmad Noorani, and its infobox carries Barelvi, Sunni and Hanafi fields."
  es: "El artículo de Wikipedia en urdu sobre Abdul Aleem Siddiqui; Da su nacimiento el 15 de Ramadán de 1310 AH (3 de abril de 1892) en Meerut y su muerte el 22 de agosto de 1954 en Medina, lo denomina en su texto Muhammad Abdul Aleem Siddiqi Qadri y lo identifica como el padre de Maulana Shah Ahmad Noorani."
  fr: "L'article Wikipédia en ourdou sur Abdul Aleem Siddiqui; il donne sa naissance le 15 Ramadan 1310 AH (3 avril 1892) à Meerut et sa mort le 22 août 1954 à Médine, le nomme dans son texte Muhammad Abdul Aleem Siddiqi Qadri et l'identifie comme le père de Maulana Shah Ahmad Noorani."
  ur: "عبدالعلیم صدیقی پر اردو ویکیپیڈیا مضمون؛ یہ ان کی پیدائش 15 رمضان 1310ھ ⁦(3 اپریل 1892)⁩ کو میرٹھ میں ہوئی اور ان کی وفات 22 اگست 1954 کو مدینہ میں ہوئی، اسے اپنے متن میں محمد عبدالعلیم صدیقی قادری نے سٹائل کیا اور ان کی شناخت مولانا شاہ احمد نورانی کے والد کے طور پر کی ہے۔"
  tr: "Abdul Aleem Siddiqui hakkında Urduca Wikipedia makalesi, onun 15 Ramazan 1310 Hile (3 Nisan 1892) tarihinde ölümüne ve 22 Ağustos 1954'te Medine'de vefat ettiğine dair bir makale olarak yer almaktadır. Makalede adı Muhammed Abdul Aleem Siddiqi Qadri olarak geçer ve onu Mawlana Şah Ahmed Nurani'nin babası olarak tanımlar; kutusunda Barlawiyye, Sünnet ve Hanafiye tarlaları yer alır."
  id: "Artikel Wikipedia dalam bahasa Urdu tentang Abdul Aleem Siddiqui menyebutkan kelahirannya pada 15 Ramadan 1310 H (3 April 1892) dalam kematiannya dan kematiannya pada 22 Agustus 1954 di Madinah. Artikel tersebut menamainya Muhammad Abdul Aleem Siddiqi Qadri dan menggambarkannya sebagai ayah dari Mawlana Shah Ahmad Noorani, dan kotaknya memuat ladang Barlawiyya, Sunnah, dan Hanafiya."
