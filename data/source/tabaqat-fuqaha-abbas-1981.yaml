summary:
  ar: طبقات فقهاء الشافعية لأبي إسحاق الشيرازي ⁦(ت 476هـ)⁩ بتحقيق د. إحسان عباس، دار الرائد العربي، بيروت، من نسخة مصورة محلية ⁦(صفحة العنوان ومقدمة المحقق ترجمة المؤلف)⁩. تُستعمل أرقام صفحات الملف (PDF)، لا الأرقام المطبوعة؛ الصفحة الواحدة من الملف قد تكون بردية مزدوجة تحمل رقمين مطبوعين.
  en: Shirazi's biographical dictionary of Shafi'i jurists (d. 476 AH), edited by Ihsan Abbas, Dar al-Ra'id al-Arabi, Beirut, from a local scan; PDF page numbers of the scan are cited, not printed page numbers; one PDF page may be a two-page spread.
  es: "Diccionario biográfico de juristas shafi'íes de Shirazi (fallecido en el año 476 de la Hégira), editado por Ihsan Abbas, Dar al-Ra'id al-Arabi, Beirut, a partir de un escaneo local; se citan los números de página del PDF escaneado, no los números de página impresos; una página del PDF puede ser una doble página."
  fr: "Dictionnaire biographique des juristes shafi'ites de Shirazi (mort en 476 AH), édité par Ihsan Abbas, Dar al-Ra'id al-Arabi, Beyrouth, à partir d'une numérisation locale; les numéros de page PDF de la numérisation sont cités, et non les numéros de page imprimés; une page PDF peut être une double page."
  ur: "شافعی فقہاء کی شیرازی کی سوانحی لغت ⁦(متوفی 476ھ)⁩، جسے احسان عباس، دار الرعد العربی، بیروت، مقامی اسکین سے تدوین کیا گیا ہے۔ اسکین کے پی ڈی ایف صفحہ نمبرز کا حوالہ دیا گیا ہے، نہ کہ پرنٹ شدہ صفحہ نمبر؛ ایک پی ڈی ایف صفحہ دو صفحات پر مشتمل ہوسکتا ہے۔"
  tr: "Ebu İshaq el-Şirazi (ö. 476 Ahriy) tarafından yazılan Tabaqat Fuqaha al-Shafi'iyya, Dr. İhsan Abbas tarafından düzenlenen, Dar al-Raed al-Arabi, Beyrut, yerel resimli bir kopyadan (başlık sayfası ve editörün girişi, yazarın çevirisi) alınmıştır. Dosyada (PDF) sayfa numaraları kullanılır, basılı numaralar değil; dosyanın tek sayfası, iki basılı numara içeren çift papirüs olabilir."
  id: "Tabaqat Fuqaha al-Shafi'iyya oleh Abu Ishaq al-Shirazi (wafat 476 H), disunting oleh Dr. Ihsan Abbas, Dar al-Raed al-Arabi, Beirut, dari salinan bergambar lokal (halaman judul dan pengantar editor, terjemahan penulis). Nomor halaman digunakan dalam berkas (PDF), bukan nomor cetak; satu halaman berkas dapat berupa papirus ganda dengan dua nomor cetak."
