summary:
  ar: "مقالة ويكيبيديا العربية عن محمود جبريل؛ تُستخدم لوقائع الكيان فقط. تذكر ميلاده سنة 1952 ⁦(بالسنة فقط)⁩ ووفاته بالقاهرة في 5 أبريل 2020 متأثرًا بفيروس كورونا ومشكلات في القلب، ورئاسته لوزراء ليبيا أثناء أحداث 2011. لا تذكر المقالة دينه في نصها؛ وتصنيفاتها تدرجه ضمن «مسلمون سنة ليبيون»، وهو تصنيف لا نصّ."
  en: "Arabic Wikipedia article on Mahmoud Jibril; used for entity facts only. It gives his birth in 1952 (year only) and his death in Cairo on 5 April 2020 from COVID-19 with heart problems, and his premiership of Libya during the 2011 events. The article states no religion for him in its text; its categories file him under Libyan Sunni Muslims, which is a filing, not a text statement."
  es: "Artículo de Wikipedia en árabe sobre Mahmoud Jibril; utilizado únicamente para datos sobre la persona. Indica su nacimiento en 1952 (solo el año) y su fallecimiento en El Cairo el 5 de abril de 2020 a causa de la COVID-19 con problemas cardíacos, así como su mandato como primer ministro de Libia durante los sucesos de 2011. El artículo no menciona su religión; sus categorías lo clasifican como musulmán sunita libio, lo cual es una clasificación, no una declaración textual."
  fr: "Article Wikipédia en arabe sur Mahmoud Jibril; utilisé uniquement pour des informations factuelles. Il indique sa naissance en 1952 (année seulement) et son décès au Caire le 5 avril 2020 des suites de la COVID-19 et de problèmes cardiaques, ainsi que son rôle de Premier ministre de Libye lors des événements de 2011. L’article ne mentionne pas sa religion; ses catégories le classent dans la catégorie « Musulmans sunnites libyens », ce qui est un classement et non une affirmation explicite."
  ur: "محمود جبریل پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 1952 میں ان کی پیدائش ⁦(صرف سال)⁩ اور قاہرہ میں 5 اپریل 2020 کو دل کی دشواری کے ساتھ COVID-19 سے ان کی موت اور 2011 کے واقعات کے دوران لیبیا کی ان کی پریمیئر شپ۔ مضمون اپنے متن میں اس کے لیے کوئی مذہب نہیں بتاتا۔ اس کے زمرے اسے لیبیا کے سنی مسلمانوں کے تحت فائل کرتے ہیں، جو کہ فائلنگ ہے، ٹیکسٹ سٹیٹمنٹ نہیں۔"
  tr: "Mahmoud Jibril hakkında Arapça Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1952'de (sadece o yıl) doğduğu ve 5 Nisan 2020'de Kahire'de COVID-19 ve kalp sorunları nedeniyle vefat ettiğini, ayrıca 2011 olaylarında Libya bakanlarının başkanlığını yaptığı belirtilmektedir. Makale metinde dininden bahsetmiyor; kategorilerinde \"Libya Sünni Müslümanları\" olarak yer alıyor, bu bir sınıflandırma değil, metin değil."
  id: "Artikel Wikipedia Arab tentang Mahmoud Jibril; digunakan hanya untuk fakta entitas. Artikel ini menyebutkan kelahirannya pada tahun 1952 (hanya dalam tahun tersebut) dan kematiannya di Kairo pada 5 April 2020, akibat COVID-19 dan masalah jantung, serta masa jabatannya sebagai menteri Libya selama peristiwa 2011. Artikel tersebut tidak menyebutkan agamanya dalam teksnya; kategorinya termasuk dia di bawah \"Muslim Sunni Libya,\" yang merupakan klasifikasi bukan teks."
