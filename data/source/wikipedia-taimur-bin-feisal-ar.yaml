  ar: "مقالة ويكيبيديا العربية «تيمور بن فيصل» (المراجعة 75605534): يقول صدرها إنه تولّى في 15 أكتوبر 1913، وتذكر أول مجلس وزراء وخبراء الجمارك المصريين واتفاقية دارسي النفطية سنة 1925، وتنسب تنازله إلى أسباب صحية."
  en: "The Arabic Wikipedia article 'Taimur bin Feisal' (revision 75605534): its lead dates his accession 15 October 1913; it records the first council of ministers, the Egyptian customs experts and the 1925 D'Arcy oil agreement, and attributes his abdication to health reasons."
  ur: "عربی ویکیپیڈیا کا مضمون «تیمور بن فیصل» (نظرثانی 75605534): تمہید میں تخت نشینی 15 اکتوبر 1913ء درج ہے؛ پہلی وزراء کونسل، مصری کسٹم ماہرین اور 1925ء کی ڈی آرسی تیل معاہدے کا ذکر ہے اور دستبرداری کی وجہ صحت بتائی گئی ہے۔"
