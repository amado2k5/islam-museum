reliability_note: "Arabic Wikipedia, revision 75605534 (wikitext consulted in full). Its lead dates the accession 15 October 1913 against the English and Urdu articles' 5 October; its infobox names Mumbai as the death place while its own death template computes 1 January 1965, against the English article's and Wikidata's 28 January 1965, which the record follows. Its narrative is the fullest on administration (first council of ministers, Egyptian customs experts, the 1925 D'Arcy agreement) and gives health as the abdication reason where the English article gives financial pressure. Its infobox religion field reads 'Ibadi, Islam'. Consulted on 26 October 2026."
