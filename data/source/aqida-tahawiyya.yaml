summary:
  ar: "نص العقيدة الطحاوية لأبي جعفر الطحاوي ⁦(ت 321هـ)⁩ في طبعة دار ابن حزم ببيروت، ومعه ترجمة موجزة للمؤلف وبنود مرقمة من 1 إلى 134 وهوامش لغوية قصيرة."
  en: "The text of al-Tahawi's creed (d. 321 AH) in the Dar Ibn Hazm edition (Beirut), with a short biography of the author, articles numbered 1 to 134 and brief lexical footnotes."
  es: "El texto del credo de al-Tahawi (fallecido en el año 321 de la Hégira) en la edición de Dar Ibn Hazm (Beirut), con una breve biografía del autor, los artículos numerados del 1 al 134 y breves notas a pie de página con aclaraciones léxicas."
  fr: "Le texte du credo d'al-Tahawi (mort en 321 AH) dans l'édition Dar Ibn Hazm (Beyrouth), avec une brève biographie de l'auteur, des articles numérotés de 1 à 134 et de brèves notes de bas de page lexicales."
  ur: "دار ابن حزم ایڈیشن ⁦(بیروت)⁩ میں الطحاوی کے مسلک کا متن ⁦(متوفی 321ھ)⁩ مصنف کی مختصر سوانح عمری کے ساتھ، مضامین نمبر 1 تا 134 اور مختصر لغوی حاشیہ۔"
  tr: "Abu Ja'far Al-Tahawi (ö. 321 Hicri) tarafından yazılmış El-Tahavi'nin İnancı'nın metni, Beyrut'ta Dar İbn Hazm tarafından yayımlanmıştır; yazarın kısa biyografisi, 1'den 134'e kadar numaralandırılmış maddeler ve kısa dilbilimsel dipnotlarla birlikte yayımlanmıştır."
  id: "Teks Kredo Al-Tahawawi oleh Abu Ja'far Al-Tahawi (wafat 321 H) diterbitkan oleh Dar Ibn Hazm di Beirut, bersama dengan biografi singkat penulis, item bernomor dari 1 hingga 134, dan catatan kaki linguistik singkat."
title: "العقيدة الطحاوية: بيان عقيدة أهل السنة والجماعة"
