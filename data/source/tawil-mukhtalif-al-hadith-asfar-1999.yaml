summary:
  ar: "الطبعة الثانية المزيدة والمنقحة من «تأويل مختلف الحديث» لابن قتيبة، حققها محمد محيي الدين الأصفر، وأعاد النظر فيها معه محمد محمد بدير، ويرجع إليها هذا السجل بأرقام صفحات المسح."
  en: "The second, revised edition of Ibn Qutayba's Ta'wil mukhtalif al-hadith, edited by Muhammad Muhyi al-Din al-Asfar with a second reviewer, Muhammad Muhammad Badir; this record cites its scan pages."
  es: "La segunda edición revisada de Ta'wil mukhtalif al-hadith de Ibn Qutayba, editada por Muhammad Muhyi al-Din al-Asfar con un segundo revisor, Muhammad Muhammad Badir; este registro cita sus páginas escaneadas."
  fr: "La deuxième édition révisée du Ta'wil mukhtalif al-hadith d'Ibn Qutayba, éditée par Muhammad Muhyi al-Din al-Asfar avec un second réviseur, Muhammad Muhammad Badir; cette notice cite ses pages numérisées."
  ur: "ابن قتیبہ کی تاویل مختالف الحدیث کا دوسرا، نظر ثانی شدہ ایڈیشن، جسے محمد محی الدین الاسفار نے دوسرے جائزہ نگار، محمد محمد بدیر کے ساتھ ترمیم کیا؛ یہ ریکارڈ اس کے اسکین صفحات کا حوالہ دیتا ہے۔"
  tr: "İbn Kutuybah tarafından düzenlenen ve revize edilen \"Ta'wil Mukhta'il al-Hadis\"in ikinci baskısı, Muhammed Muhyiddin al-Asfar tarafından düzenlenmiş, Muhammed Muhammed Badir ile birlikte incelenmiş ve bu kayıtta bu eser haritadan alınan sayfa numaralarıyla birlikte atıfta bulunulmuştur."
  id: "Edisi kedua yang diedit dan direvisi dari \"Ta'wil Mukhta'il al-Hadith\" oleh Ibn Qutaybah, disunting oleh Muhammad Muhyiddin al-Asfar, ditinjau bersama Muhammad Muhammad Badir, dan catatan ini merujuk pada dokumen tersebut dengan nomor halaman dari survei."
