summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن بهليل لحاداليا؛ تؤكد مولده في باندا في ٧ آب ١٩٧٦، وتذكر عمله أيام المدرسة، ونشاطه في رابطة الطلاب المسلمين وتوليه الأمانة العامة لماليتها في قيادتها الوطنية (2001–2003)، ومسيرته في هيئة الاستثمار ووزارتي الاستثمار والطاقة، ورئاسته غولكار سنة ٢٠٢٤، وتعليق جامعة إندونيسيا درجته الدكتوراه."
  en: "Indonesian Wikipedia article on Bahlil Lahadalia; it confirms his birth in Banda on 7 August 1976, records his schoolboy work, his activism in the Muslim Students' Association and his general treasurership of its national leadership (2001-2003), his career through the Investment Coordinating Board and the investment and energy ministries, his 2024 Golkar chairmanship, and the University of Indonesia's suspension of his doctorate."
