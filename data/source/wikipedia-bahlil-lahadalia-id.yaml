summary:
  ar: "مقالة ويكيبيديا الإندونيسية عن بهليل لحاداليا؛ تؤكد مولده في باندا في ٧ آب ١٩٧٦، وتذكر عمله أيام المدرسة، ونشاطه في رابطة الطلاب المسلمين وتوليه الأمانة العامة لماليتها في قيادتها الوطنية (2001–2003)، ومسيرته في هيئة الاستثمار ووزارتي الاستثمار والطاقة، ورئاسته غولكار سنة ٢٠٢٤، وتعليق جامعة إندونيسيا درجته الدكتوراه."
  en: "Indonesian Wikipedia article on Bahlil Lahadalia; it confirms his birth in Banda on 7 August 1976, records his schoolboy work, his activism in the Muslim Students' Association and his general treasurership of its national leadership (2001-2003), his career through the Investment Coordinating Board and the investment and energy ministries, his 2024 Golkar chairmanship, and the University of Indonesia's suspension of his doctorate."
  es: "Artículo de la Wikipedia en indonesio sobre Bahlil Lahadalia; confirma su nacimiento en Banda el 7 de agosto de 1976, registra su trabajo escolar, su activismo en la Asociación de Estudiantes Musulmanes y su tesorería general de su dirección nacional (2001-2003), su carrera a través de la Junta Coordinadora de Inversiones y los ministerios de inversión y energía, su presidencia de Golkar en 2024 y la suspensión de su doctorado por parte de la Universidad de Indonesia."
  fr: "L'article de Wikipédia indonésien sur Bahlil Lahadalia confirme sa naissance à Banda le 7 août 1976, relate ses travaux scolaires, son activisme au sein de l'Association des étudiants musulmans et son poste de trésorier général de sa direction nationale (2001-2003), sa carrière au sein du Conseil de coordination des investissements et des ministères de l'Investissement et de l'Énergie, sa présidence du Golkar en 2024 et la suspension de son doctorat par l'Université d'Indonésie."
  ur: "بہلیل لہادالیہ پر انڈونیشین ویکیپیڈیا مضمون؛ یہ 7 اگست 1976 کو بندہ میں اس کی پیدائش کی تصدیق کرتا ہے، اس کے اسکول کے بچے کے کام، مسلم اسٹوڈنٹس ایسوسی ایشن میں اس کی سرگرمی اور اس کی قومی قیادت (2001-2003) کے جنرل خزانچی، انویسٹمنٹ کوآرڈینیٹنگ بورڈ اور سرمایہ کاری اور توانائی کی وزارتوں کے ذریعے اس کا کیریئر، اس کی 2024 میں گولکر کی یونیورسٹی میں ڈاکٹریٹ کی سربراہی، اور ان کی 2024 میں ڈاکٹریٹ کی خدمات کو ریکارڈ کرتا ہے۔"
  tr: "Bahlil Lahadalia hakkında Endonezya Vikipedi makalesi, 7 Ağustos 1976'da Banda'da doğduğunu doğrular, okul yıllarındaki çalışmaları, Müslüman Öğrenciler Derneği'ndeki faaliyetleri, ulusal liderliği altında Maliye Genel Sekreteri olarak atanması (2001–2003), Yatırım Otoritesi ve Yatırım ve Enerji Bakanlıkları'ndaki kariyeri, 2024'te Golkar başkanlığı ve Endonezya Üniversitesi tarafından doktora derecesinin askıya alınması gibi konuları belirtir."
  id: "Artikel Wikipedia Indonesia tentang Bahlil Lahadalia mengonfirmasi kelahirannya di Banda pada 7 Agustus 1976, menyebutkan pekerjaannya selama masa sekolah, aktivitasnya di Asosiasi Mahasiswa Muslim, pengangkatannya sebagai Sekretaris Jenderal Keuangan di bawah kepemimpinan nasional (2001–2003), kariernya di Otoritas Investasi dan Kementerian Investasi dan Energi, kepresidenannya di Golkar pada 2024, serta penangguhan gelar doktornya oleh Universitas Indonesia."
