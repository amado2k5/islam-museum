summary:
  ar: "صفحة تطبيق «أذان» في موقع IslamicFinder كما قُرئت في 6 نوفمبر 2026: يصف نفسه بأنه موثوق لدى 55 مليون مؤمن حول العالم، ويعدد خدماته من مواقيت الصلاة والأدعية والتقويم والقبلة ودليل الحج والعمرة."
  en: "IslamicFinder's page for its Athan app as read on 6 November 2026: it calls the app 'trusted by 55 million believers worldwide' and lists its services, from prayer times, duas and the Islamic calendar to the qibla finder and a Hajj and Umrah guide."
  ur: "IslamicFinder کی ویب سائٹ پر «اذان» ایپ کا صفحہ، 6 نومبر 2026 کو پڑھا گیا: ایپ کو دنیا بھر کے 5 کروڑ 50 لاکھ اہلِ ایمان کا معتمد کہتا ہے اور اس کی خدمات گنواتا ہے۔"
  es: "La página de IslamicFinder dedicada a su aplicación Athan, tal como se leía el 6 de noviembre de 2026, afirma que la aplicación cuenta con la confianza de 55 millones de creyentes en todo el mundo y enumera sus servicios, desde los horarios de oración, las súplicas y el calendario islámico hasta el buscador de la qibla y una guía para el Hajj y la Umrah."
  fr: "La page d'IslamicFinder pour son application Athan, telle que consultée le 6 novembre 2026: elle décrit l'application comme « utilisée par 55 millions de croyants dans le monde » et énumère ses services, allant des horaires de prière, des douas et du calendrier islamique à la recherche de la qibla et à un guide du Hajj et de l'Umrah."
