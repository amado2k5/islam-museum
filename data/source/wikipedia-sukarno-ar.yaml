  ar: "مقالة ويكيبيديا العربية عن أحمد سوكارنو؛ تُستخدم لوقائع الكيان فقط. تؤكد مولده في 6 يونيو 1901 في سورابايا لأب جاوي وأم بالية برهمانية ووفاته في 21 يونيو 1970، وتصنّفه فئاتها في «مسلمون إندونيسيون» و«اشتراكيون مسلمون»، وتقابل ميلاده بـ1319 هـ ووفاته بـ1390 هـ."
  en: "Arabic Wikipedia article on Sukarno (titled 'Ahmed Sukarno'); used for entity facts only. It confirms his birth on 6 June 1901 at Surabaya to a Javanese father and a Balinese Brahmin mother, and his death on 21 June 1970. Its categories file him under 'Indonesian Muslims' and 'Muslim socialists' (filings) and pair his birth with 1319 AH and his death with 1390 AH."
