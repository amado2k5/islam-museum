summary:
  ar: "مقالة ويكيبيديا العربية عن أحمد سوكارنو؛ تُستخدم لوقائع الكيان فقط. تؤكد مولده في 6 يونيو 1901 في سورابايا لأب جاوي وأم بالية برهمانية ووفاته في 21 يونيو 1970، وتصنّفه فئاتها في «مسلمون إندونيسيون» و«اشتراكيون مسلمون»، وتقابل ميلاده بـ1319 هـ ووفاته بـ1390 هـ."
  en: "Arabic Wikipedia article on Sukarno (titled 'Ahmed Sukarno'); used for entity facts only. It confirms his birth on 6 June 1901 at Surabaya to a Javanese father and a Balinese Brahmin mother, and his death on 21 June 1970. Its categories file him under 'Indonesian Muslims' and 'Muslim socialists' (filings) and pair his birth with 1319 AH and his death with 1390 AH."
  es: "Artículo de Wikipedia en árabe sobre Sukarno (titulado «Ahmed Sukarno»); utilizado únicamente para datos sobre la persona. Confirma su nacimiento el 6 de junio de 1901 en Surabaya, hijo de padre javanés y madre brahmán balinés, y su fallecimiento el 21 de junio de 1970. Sus categorías lo clasifican como «musulmanes indonesios» y «socialistas musulmanes» (archivos) y relaciona su nacimiento con el año 1319 de la Hégira y su fallecimiento con el año 1390 de la Hégira."
  fr: "L'article de Wikipédia en arabe consacré à Sukarno (intitulé « Ahmed Sukarno ») est utilisé uniquement à des fins d'information sur l'entité. Il confirme sa naissance le 6 juin 1901 à Surabaya, d'un père javanais et d'une mère brahmane balinaise, et son décès le 21 juin 1970. Il est classé dans les catégories « Musulmans indonésiens » et « Socialistes musulmans » et sa naissance est datée de 1319 AH, tandis que son décès est daté de 1390 AH."
  ur: "Sukarno پر عربی ویکیپیڈیا مضمون ⁦(عنوان 'احمد سوکارنو')⁩؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 6 جون 1901 کو سورابایا میں ایک جاوانی باپ اور بالینی برہمن ماں کے ہاں اس کی پیدائش اور 21 جون 1970 کو اس کی موت کی تصدیق کرتا ہے۔ اس کے زمرے اسے 'انڈونیشیائی مسلمان' اور 'مسلم سوشلسٹ' ⁦(فائلنگ)⁩ کے تحت درج کرتے ہیں اور ان کی پیدائش 1319 ہجری اور ان کی وفات 1390 ہجری کے ساتھ جوڑتے ہیں۔"
