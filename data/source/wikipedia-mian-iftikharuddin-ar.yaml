  ar: "مقالة ويكيبيديا العربية عن ميان افتخار الدين (1907–1962)؛ تعطي مولده في 8 نيسان 1907 ووفاته في 6 حزيران 1962، وتروي مسيرته في حزب المؤتمر ثم الرابطة الإسلامية وتأسيسه لصحيفة باكستان تايمز ودوره في نزاع كشمير. لا يرد فيها أي بيان عن دينه."
  en: "The Arabic Wikipedia article on Mian Iftikharuddin (1907–1962); it gives his birth on 8 April 1907 and his death on 6 June 1962, and recounts his Congress then Muslim League career, his founding of The Pakistan Times and his role in the Kashmir conflict. It makes no statement of his religion."
