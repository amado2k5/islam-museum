summary:
  ar: "مقالة ويكيبيديا التركية عن شفيقة غسبرالي؛ تُستخدم لوقائع الكيان فقط. تذكر مولدها في باغچه سراي بصيغة «14 أكتوبر أو 21 نوفمبر 1886»، وهو يوم بديل لا تحمله المقالة الإنجليزية ولا ويكي بيانات، وتسمي أمها زهرة من أسرة آقجورا، وتعدّ أبناء إسماعيل وزهرة الثمانية، وتتناول عملها في «ترجمان» وزواجها سنة 1906 ومجلة «عالم نسوان» وفرارها من القرم وإعدام زوجها في 31 مايو 1920 ووفاتها في إسطنبول في 31 أغسطس 1975 ودفنها في مقبرة زنجرلي كويو. ولا تذكر المقالة ديانتها في متنها."
  en: "Turkish Wikipedia article on Şefika Gaspıralı; used for entity facts only. It gives her birth at Bakhchysarai as '14 October or 21 November 1886' — an alternative day the English article and Wikidata do not carry — names her mother Zühre as a member of the Akçura family, lists the eight children of Ismail and Zühre, and covers her Terciman work, her 1906 marriage, Alem-i Nisvan, her flight from Crimea, her husband's execution on 31 May 1920, and her death at Istanbul on 31 August 1975 with burial at Zincirlikuyu Cemetery. It makes no statement of her religion in its text."
