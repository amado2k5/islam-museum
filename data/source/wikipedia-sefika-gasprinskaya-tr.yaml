summary:
  ar: "مقالة ويكيبيديا التركية عن شفيقة غسبرالي؛ تُستخدم لوقائع الكيان فقط. تذكر مولدها في باغچه سراي بصيغة «14 أكتوبر أو 21 نوفمبر 1886»، وهو يوم بديل لا تحمله المقالة الإنجليزية ولا ويكي بيانات، وتسمي أمها زهرة من أسرة آقجورا، وتعدّ أبناء إسماعيل وزهرة الثمانية، وتتناول عملها في «ترجمان» وزواجها سنة 1906 ومجلة «عالم نسوان» وفرارها من القرم وإعدام زوجها في 31 مايو 1920 ووفاتها في إسطنبول في 31 أغسطس 1975 ودفنها في مقبرة زنجرلي كويو. ولا تذكر المقالة ديانتها في متنها."
  en: "Turkish Wikipedia article on Şefika Gaspıralı; used for entity facts only. It gives her birth at Bakhchysarai as '14 October or 21 November 1886' — an alternative day the English article and Wikidata do not carry — names her mother Zühre as a member of the Akçura family, lists the eight children of Ismail and Zühre, and covers her Terciman work, her 1906 marriage, Alem-i Nisvan, her flight from Crimea, her husband's execution on 31 May 1920, and her death at Istanbul on 31 August 1975 with burial at Zincirlikuyu Cemetery. It makes no statement of her religion in its text."
  es: "Artículo de la Wikipedia en turco sobre Şefika Gaspıralı; utilizado únicamente para datos sobre la persona. Indica que nació en Bajchisarái el 14 de octubre o el 21 de noviembre de 1886 (fecha alternativa que no aparece en el artículo en inglés ni en Wikidata), nombra a su madre, Zühre, como miembro de la familia Akçura, enumera a los ocho hijos de Ismail y Zühre, y abarca su trabajo en Terciman, su matrimonio en 1906, Alem-i Nisvan, su huida de Crimea, la ejecución de su esposo el 31 de mayo de 1920 y su muerte en Estambul el 31 de agosto de 1975, con sepultura en el cementerio de Zincirlikuyu. No menciona su religión en el texto."
  fr: "L'article de Wikipédia en turc consacré à Şefika Gaspıralı, utilisé uniquement pour les informations la concernant, indique sa naissance à Bakhchysarai le 14 octobre ou le 21 novembre 1886 (une date alternative absente de l'article anglais et de Wikidata). Il mentionne sa mère, Zühre, comme membre de la famille Akçura, énumère les huit enfants d'Ismail et Zühre, et relate son travail au Terciman, son mariage en 1906, l'Alem-i Nisvan, sa fuite de Crimée, l'exécution de son mari le 31 mai 1920 et sa mort à Istanbul le 31 août 1975, suivie de son inhumation au cimetière de Zincirlikuyu. Aucune mention de sa religion n'est faite dans le texte."
  ur: "Şefika Gaspıralı پر ترک ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ اس کی پیدائش بخچیسرائے میں '14 اکتوبر یا 21 نومبر 1886' کے طور پر ہوئی - ایک متبادل دن جس میں انگریزی مضمون اور ویکیڈیٹا شامل نہیں ہے - اس کی والدہ ظہرے کا نام اکچورا خاندان کی رکن کے طور پر رکھتا ہے، اسماعیل اور ظہرے کے آٹھ بچوں کی فہرست دیتا ہے، اور اس کے ترسیمان کے کام، اس کی 1906 کی شادی، اس کے شوہر علیم-نی، کی فلائٹ پر اس کے شوہر علیم-نی سے شادی کا احاطہ کرتا ہے۔ 31 مئی 1920، اور استنبول میں اس کی موت 31 اگست 1975 کو زنسرلیکیو قبرستان میں تدفین کے ساتھ ہوئی۔ اس کے متن میں اس کے مذہب کا کوئی بیان نہیں ہے۔"
  tr: "Şafiq Gasprali hakkındaki Türk Vikipedi makalesi yalnızca varlığın olayları için kullanılmıştır. Bağçasaray'daki doğumunu \"14 Ekim veya 21 Kasım 1886\" olarak belirtir; bu alternatif gün İngilizce makalede veya Wikidata'da yer almıyor. Annesinin adı Akjura ailesinden Zahra olup, İsmail ve Zahra'nın sekiz çocuğu olarak kabul edilir. \"Tarjuman\"daki çalışmalarını, 1906'daki evliliğini, \"Alam Nisuan\" dergisini, Kırım'dan kaçışını, 31 Mayıs 1920'de kocasının idamını, 31 Ağustos 1975'te İstanbul'daki ölümünü ve Zincirli Koyu mezarlığına defnedilmesini ele alır. Makalede dininden bahsedilmemektedir."
  id: "Artikel Wikipedia Turki tentang Şafiq Gasprali hanya digunakan untuk peristiwa entitas tersebut. Ia menyebutkan kelahirannya di Bağçasaray sebagai \"14 Oktober atau 21 November 1886,\" sebuah hari alternatif yang tidak dibahas dalam artikel berbahasa Inggris atau Wikidata. Ibunya bernama Zahra dari keluarga Akjura, dan ia dianggap sebagai delapan anak dari Ismail dan Zahra. Ia meliput karyanya dalam \"Tarjuman,\" pernikahannya pada tahun 1906, majalah \"Alam Nisuan,\" pelariannya dari Krimea, eksekusi suaminya pada 31 Mei 1920, kematiannya di Istanbul pada 31 Agustus 1975, dan pemakamannya di pemakaman Zincirli Koyu. Artikel tersebut tidak menyebutkan agamanya dalam isinya."
