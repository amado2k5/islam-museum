summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ريز أحمد؛ تُستخدم لوقائع الكيان فقط. توثّق مولده في ويمبلي سنة 1982 لأسرة باكستانية بريطانية، ومسيرته من «الطريق إلى غوانتانامو» إلى «صوت المعدن»، ونشاطه في تمثيل المسلمين و«اختبار ريز»، وتصفه بأنه مسلم ممارس."
  en: "English Wikipedia article on Riz Ahmed; used for entity facts only. It records his birth in Wembley in 1982 to a British Pakistani family, his career from The Road to Guantanamo to Sound of Metal, his advocacy on Muslim representation and the Riz Test, and describes him as a practising Muslim."
  es: "Artículo de la Wikipedia en inglés sobre Riz Ahmed; utilizado únicamente para obtener información sobre la persona. En él se registra su nacimiento en Wembley en 1982 en el seno de una familia británico-pakistaní, su trayectoria profesional desde The Road to Guantanamo hasta Sound of Metal, su defensa de la representación musulmana y la prueba Riz, y se le describe como musulmán practicante."
  fr: "Article Wikipédia en anglais sur Riz Ahmed; utilisé uniquement pour les informations le concernant. Il relate sa naissance à Wembley en 1982 dans une famille britannique d'origine pakistanaise, sa carrière, de « The Road to Guantanamo » à « Sound of Metal », son engagement pour la représentation des musulmans et le « Riz Test », et le décrit comme un musulman pratiquant."
  ur: "رض احمد پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ویمبلے میں 1982 میں ایک برطانوی پاکستانی خاندان میں ان کی پیدائش، دی روڈ ٹو گوانتانامو سے ساؤنڈ آف میٹل تک ان کے کیریئر، مسلم نمائندگی اور ریز ٹیسٹ کے بارے میں ان کی وکالت کو ریکارڈ کیا گیا ہے اور انہیں ایک باعمل مسلمان کے طور پر بیان کیا گیا ہے۔"
