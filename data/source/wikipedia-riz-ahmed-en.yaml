  ar: "مقالة ويكيبيديا الإنجليزية عن ريز أحمد؛ تُستخدم لوقائع الكيان فقط. توثّق مولده في ويمبلي سنة 1982 لأسرة باكستانية بريطانية، ومسيرته من «الطريق إلى غوانتانامو» إلى «صوت المعدن»، ونشاطه في تمثيل المسلمين و«اختبار ريز»، وتصفه بأنه مسلم ممارس."
  en: "English Wikipedia article on Riz Ahmed; used for entity facts only. It records his birth in Wembley in 1982 to a British Pakistani family, his career from The Road to Guantanamo to Sound of Metal, his advocacy on Muslim representation and the Riz Test, and describes him as a practising Muslim."
