reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. A very long article, read in full on 25 October 2026. It gives his birth on 1 December 1982 in Wembley, London, to a British Pakistani family of Muhajir background from Karachi, his PPE degree at Christ Church, Oxford, and his acting training at the Royal Central School of Speech and Drama. Career coverage includes The Road to Guantánamo (2006) and his detention at Luton Airport on returning from the Berlinale; Four Lions (2010); Nightcrawler (2014); The Night Of (2016), whose Emmy made him the first Muslim and first South Asian to win a lead acting Emmy; Rogue One (2016); Venom (2018); Sound of Metal (2019), which brought the first Academy Award Best Actor nomination for a Muslim and British Pakistani actor; Mogul Mowgli (2020); the short film The Long Goodbye, which won the Academy Award for Best Live Action Short Film; his rap career as Riz MC and with the Swet Shop Boys, and the MTV award for 'Immigrants (We Get the Job Done)'; the Riz Test of 2018, named after his 2017 House of Commons speech on diversity; and his activism for Syrian and Rohingya refugees. Its activism section calls him 'a practicing Muslim' who 'has spoken candidly about negative stereotyping of Muslims' — practice and advocacy, which name no school. It records his marriage to the novelist Fatima Farheen Mirza in 2020 and their first child, revealed in 2025."
