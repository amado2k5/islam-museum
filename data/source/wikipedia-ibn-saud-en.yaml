reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md). Read in full at revision 1380322234 on 25 October 2026. On faith the article calls him in its lead a 'religious leader', says his demolition orders 'concorded with Wahhabi beliefs', and describes his enforcement of 'the new kingdom's ideology, based on the teachings of Muhammad Ibn Abd al-Wahhab' — statements about the doctrine of his state and the movement he patronised, naming no madhhab as his own; the record's faith note states this position in full. Its birth and death dates (15 January 1876 at Riyadh; 9 November 1953 at Taif) agree with the Arabic article and Wikidata against the Urdu article's 1877 birth year."
