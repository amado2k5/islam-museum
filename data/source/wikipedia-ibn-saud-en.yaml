  ar: "مقالة ويكيبيديا الإنجليزية المطوّلة عن عبد العزيز بن عبد الرحمن آل سعود المعروف بابن سعود وكنيته أبو تركي (15 يناير 1876 – 9 نوفمبر 1953)، مؤسس المملكة العربية السعودية وأول ملوكها؛ تروي نفي أسرته واسترداده الرياض سنة 1902 وتوحيده نجدًا والحجاز وتأسيسه الإخوان وانتصاره على آل رشيد والهاشميين وإعلانه المملكة سنة 1932 واكتشاف النفط ولقاءاته روزفلت وتشرشل ووفاته في قصر شبرا بالطائف ودفنه في مقبرة العود بالرياض."
  en: "Long English Wikipedia article on Abdulaziz bin Abdul Rahman Al Saud, known as Ibn Saud, with the kunya Abu Turki (15 January 1876 – 9 November 1953), founder and first King of Saudi Arabia; it recounts his family's exile, his recapture of Riyadh in 1902, his unification of Nejd and the Hejaz, the founding of the Ikhwan, his victories over the Rashidis and the Hashemites, the proclamation of the kingdom in 1932, the discovery of oil, his meetings with Roosevelt and Churchill, and his death at Shubra Palace in Taif and burial in Al Oud cemetery at Riyadh."
