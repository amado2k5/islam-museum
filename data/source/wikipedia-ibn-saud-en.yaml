summary:
  ar: "مقالة ويكيبيديا الإنجليزية المطوّلة عن عبد العزيز بن عبد الرحمن آل سعود المعروف بابن سعود وكنيته أبو تركي ⁦(15 يناير 1876 – 9 نوفمبر 1953)⁩، مؤسس المملكة العربية السعودية وأول ملوكها؛ تروي نفي أسرته واسترداده الرياض سنة 1902 وتوحيده نجدًا والحجاز وتأسيسه الإخوان وانتصاره على آل رشيد والهاشميين وإعلانه المملكة سنة 1932 واكتشاف النفط ولقاءاته روزفلت وتشرشل ووفاته في قصر شبرا بالطائف ودفنه في مقبرة العود بالرياض."
  en: "Long English Wikipedia article on Abdulaziz bin Abdul Rahman Al Saud, known as Ibn Saud, with the kunya Abu Turki (15 January 1876 – 9 November 1953), founder and first King of Saudi Arabia; it recounts his family's exile, his recapture of Riyadh in 1902, his unification of Nejd and the Hejaz, the founding of the Ikhwan, his victories over the Rashidis and the Hashemites, the proclamation of the kingdom in 1932, the discovery of oil, his meetings with Roosevelt and Churchill, and his death at Shubra Palace in Taif and burial in Al Oud cemetery at Riyadh."
  es: "Artículo extenso en la Wikipedia en inglés sobre Abdulaziz bin Abdul Rahman Al Saud, conocido como Ibn Saud, con la kunya Abu Turki (15 de enero de 1876 - 9 de noviembre de 1953), fundador y primer rey de Arabia Saudita; relata el exilio de su familia, la reconquista de Riad en 1902, la unificación de Nejd y el Hiyaz, la fundación de los Hermanos Musulmanes (Ikhwan), sus victorias sobre los Rashidis y los Hachemíes, la proclamación del reino en 1932, el descubrimiento de petróleo, sus encuentros con Roosevelt y Churchill, y su muerte en el Palacio de Shubra en Taif y su entierro en el cementerio de Al Oud en Riad."
  fr: "Long article de Wikipédia en anglais sur Abdulaziz bin Abdul Rahman Al Saud, connu sous le nom d'Ibn Saud, avec le kunya Abu Turki (15 janvier 1876 – 9 novembre 1953), fondateur et premier roi d'Arabie saoudite; il relate l'exil de sa famille, la reconquête de Riyad en 1902, l'unification du Nejd et du Hedjaz, la fondation des Frères musulmans, ses victoires sur les Rashidites et les Hachémites, la proclamation du royaume en 1932, la découverte du pétrole, ses rencontres avec Roosevelt et Churchill, et sa mort au palais Shubra à Taïf et son inhumation au cimetière Al Oud à Riyad."
  ur: "عبد العزیز بن عبدالرحمن آل سعود پر طویل انگریزی ویکیپیڈیا مضمون، جسے ابن سعود کے نام سے جانا جاتا ہے، کنیا ابو ترکی کے ساتھ ⁦(15 جنوری 1876 - 9 نومبر 1953)⁩، سعودی عرب کے بانی اور پہلے بادشاہ؛ اس میں ان کے خاندان کی جلاوطنی، 1902 میں ریاض پر اس کا دوبارہ قبضہ، نجد اور حجاز کا ان کا اتحاد، اخوان کی بنیاد، راشدیوں اور ہاشمیوں پر ان کی فتوحات، 1932 میں بادشاہی کا اعلان، تیل کی دریافت، روزل اور شوبراس کے چرچ میں اس کی ملاقاتیں اور اس کی موت کا ذکر ہے۔ ریاض کے العود قبرستان میں۔"
