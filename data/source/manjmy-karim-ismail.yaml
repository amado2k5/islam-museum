summary:
  ar: "ملف تعريفي بكريم إسماعيل على موقع «منجمي الإسلامي» (نُشر 15 يونيو 2026)؛ يصفه بأنه صانع محتوى ومدرب متخصص في علم النفس الإيجابي والتنمية الذاتية، ويعرض أعماله: بودكاست «بهدوء» وبودكاست «سكون» وسلسلة «وعي»، والجانب الروحاني في قناته ومنه سلسلة The Real Influencer وقراءاته النفسية والتربوية لمعاني الآيات في سلسلة «رسايل ربنا»."
  en: "A profile of Karim Ismail on the Manjmy Islamic website (published 15 June 2026); it describes him as a content creator and trainer specialising in positive psychology and self-development, and surveys his work: the podcasts 'Behudoo' (Calmly) and 'Sukoon', the 'Wa'i' (Awareness) series, and the spiritual side of his channel, including the series 'The Real Influencer' and his psychological and educational readings of the meanings of verses in the series 'Rasayel Rabbana'."
