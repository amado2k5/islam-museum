reliability_note: "A laudatory profile on an Islamic content directory, read in full on 26 October 2026; used only for the existence and scope of his programmes and the character of his channel, not for credentials or biography. It describes him as one of the most prominent content creators specialising in positive psychology, self-awareness and human development, who mixes scientific knowledge, real-life experience and spiritual values, and it details his podcasts 'Behudoo' and 'Sukoon', his 'Wa'i' series, his treatment of youth questions (relationships, self-esteem), and the spiritual content of his channel. It gives no birth date or birthplace and names no school, madhhab or creed for him. Its description of his reach — messages viewed by millions across the Arab countries — is the profile's own characterisation."
