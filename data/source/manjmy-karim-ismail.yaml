summary:
  ar: "ملف تعريفي بكريم إسماعيل على موقع «منجمي الإسلامي» ⁦(نُشر 15 يونيو 2026)⁩؛ يصفه بأنه صانع محتوى ومدرب متخصص في علم النفس الإيجابي والتنمية الذاتية، ويعرض أعماله: بودكاست «بهدوء» وبودكاست «سكون» وسلسلة «وعي»، والجانب الروحاني في قناته ومنه سلسلة The Real Influencer وقراءاته النفسية والتربوية لمعاني الآيات في سلسلة «رسايل ربنا»."
  en: "A profile of Karim Ismail on the Manjmy Islamic website (published 15 June 2026); it describes him as a content creator and trainer specialising in positive psychology and self-development, and surveys his work: the podcasts 'Behudoo' (Calmly) and 'Sukoon', the 'Wa'i' (Awareness) series, and the spiritual side of his channel, including the series 'The Real Influencer' and his psychological and educational readings of the meanings of verses in the series 'Rasayel Rabbana'."
  es: "Un perfil de Karim Ismail en el sitio web islámico Manjmy (publicado el 15 de junio de 2026) lo describe como creador de contenido y formador especializado en psicología positiva y desarrollo personal, y repasa su trabajo: los podcasts 'Behudoo' (Calma) y 'Sukoon', la serie 'Wa'i' (Conciencia) y el lado espiritual de su canal, incluyendo la serie 'The Real Influencer' y sus lecturas psicológicas y educativas del significado de los versículos en la serie 'Rasayel Rabbana'."
  fr: "Un profil de Karim Ismail sur le site web islamique Manjmy (publié le 15 juin 2026) le décrit comme un créateur de contenu et formateur spécialisé en psychologie positive et développement personnel, et présente son travail: les podcasts « Behudoo » (Calmement) et « Sukoon », la série « Wa'i » (Conscience), et le côté spirituel de sa chaîne, notamment la série « The Real Influencer » et ses lectures psychologiques et éducatives des significations des versets dans la série « Rasayel Rabbana »."
  ur: "منجمی اسلامی ویب سائٹ پر کریم اسماعیل کا پروفائل ⁦(شائع شدہ 15 جون 2026)⁩؛ اس میں اسے ایک مواد کے تخلیق کار اور ٹرینر کے طور پر بیان کیا گیا ہے جو مثبت نفسیات اور خود کی نشوونما میں مہارت رکھتا ہے، اور اس کے کام کا سروے کرتا ہے: پوڈکاسٹ 'بہدو' ⁦(سکون سے)⁩ اور 'سکون'، 'وائی' ⁦(آگاہی)⁩ سیریز، اور اس کے چینل کا روحانی پہلو، جس میں سیریز 'دی اصلی اثر و رسوخ' اور اس کے نفسیاتی مطالعہ کی سیریز کے معنی اور پڑھائی کی سیریز شامل ہیں۔ 'رسائل ربنا'۔"
  tr: "Karim İsmail'in \"İslami Madencim\" adlı web sitesinde (15 Haziran 2026'da yayımlanmıştır) bir profili; onu pozitif psikoloji ve kişisel gelişim konusunda uzmanlaşmış bir içerik üreticisi ve eğitmen olarak tanımlıyor. Çalışmalarını sunuyor: \"Behdooa\" podcast'i, \"Sukoon\" podcast'i ve \"Wa'i\" serisi, ayrıca kanalında manevi yönü, The Real Influencer dizisi ve \"Rabbimizin Mesajları\" dizisindeki ayetlerin anlamlarına dair psikolojik ve eğitici okumalarını sunuyor."
  id: "Profil Karim Ismail di situs \"My Islamic Mineer\" (diterbitkan 15 Juni 2026); ia menggambarkannya sebagai pembuat konten dan pelatih yang mengkhususkan diri dalam psikologi positif dan pengembangan diri. Ia mempresentasikan karya-karyanya: podcast \"Behdooa,\" podcast \"Sukoon,\" dan serial \"Wa'i,\" serta aspek spiritual di salurannya, termasuk serial The Real Influencer, dan pembacaan psikologis serta edukatifnya tentang makna ayat-ayat dalam seri \"Messages of Our Lord.\""
