  ar: "مقالة ويكيبيديا الإنجليزية عن أولجايتو ⁦(محمد خدابنده)⁩، ثامن إيلخانات الدولة الإيلخانية؛ تُستخدم لوقائع الكيان فقط. توثّق مولده في 24 مارس 1282، وتعمّده وتربيته البوذية، واعتناقه الإسلام السني ثم التشيع سنة 1310، ووفاته في سلطانية في ديسمبر 1316."
  en: "English Wikipedia article on Öljaitü (Muhammad Khodabandeh), eighth Ilkhan; used for entity facts only. It documents his birth on 24 March 1282, his baptism and Buddhist upbringing, his conversion to Sunni Islam and then to Shi'a Islam in 1310, and his death at Soltaniyeh in December 1316."
