summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن أولجايتو ⁦(محمد خدابنده)⁩، ثامن إيلخانات الدولة الإيلخانية؛ تُستخدم لوقائع الكيان فقط. توثّق مولده في 24 مارس 1282، وتعمّده وتربيته البوذية، واعتناقه الإسلام السني ثم التشيع سنة 1310، ووفاته في سلطانية في ديسمبر 1316."
  en: "English Wikipedia article on Öljaitü (Muhammad Khodabandeh), eighth Ilkhan; used for entity facts only. It documents his birth on 24 March 1282, his baptism and Buddhist upbringing, his conversion to Sunni Islam and then to Shi'a Islam in 1310, and his death at Soltaniyeh in December 1316."
  es: "Artículo de la Wikipedia en inglés sobre Öljaitü (Muhammad Khodabandeh), octavo Ilkhan; utilizado únicamente para datos sobre la persona. Documenta su nacimiento el 24 de marzo de 1282, su bautismo y educación budista, su conversión al islam sunita y posteriormente al islam chiita en 1310, y su muerte en Soltaniyeh en diciembre de 1316."
  fr: "Article de Wikipédia en anglais sur Öljaitü (Muhammad Khodabandeh), huitième Ilkhan; utilisé uniquement pour les informations sur l'entité. Il documente sa naissance le 24 mars 1282, son baptême et son éducation bouddhiste, sa conversion à l'islam sunnite puis à l'islam chiite en 1310, et sa mort à Soltaniyeh en décembre 1316."
  ur: "انگریزی ویکیپیڈیا مضمون Öljaitü (Muhammad Khodabandeh) پر، آٹھویں Ilkhan؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 24 مارچ 1282 کو ان کی پیدائش، اس کی بپتسمہ اور بدھ مت کی پرورش، اس کے سنی اسلام اور پھر 1310 میں شیعہ اسلام میں تبدیلی، اور دسمبر 1316 میں سلطانیہ میں اس کی موت کو دستاویز کیا گیا ہے۔"
