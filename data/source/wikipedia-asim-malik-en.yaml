summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد عاصم مالك، الجنرال الباكستاني ذي النجوم الثلاث ومدير عام جهاز الاستخبارات منذ 30 أيلول 2024 ومستشار الأمن القومي منذ 2025؛ تذكر والده الفريق غلام محمد مالك ودراساته ودكتوراهه وسيف الشرف وقياداته."
  en: "English Wikipedia article on Muhammad Asim Malik, the Pakistani three-star general who has been Director-General of the ISI since 30 September 2024 and National Security Adviser since 2025; it records his father Lt Gen Ghulam Muhammad Malik, his studies and doctorate, his Sword of Honour and his commands."
  es: "Artículo de la Wikipedia en inglés sobre Muhammad Asim Malik, el general pakistaní de tres estrellas que ha sido Director General del ISI desde el 30 de septiembre de 2024 y Asesor de Seguridad Nacional desde 2025; en él se menciona a su padre, el teniente general Ghulam Muhammad Malik, sus estudios y doctorado, su Espada de Honor y sus mandos."
  fr: "L'article de Wikipédia en anglais sur Muhammad Asim Malik, le général trois étoiles pakistanais qui est directeur général de l'ISI depuis le 30 septembre 2024 et conseiller à la sécurité nationale depuis 2025; il retrace l'histoire de son père, le lieutenant-général Ghulam Muhammad Malik, ses études et son doctorat, son épée d'honneur et ses commandements."
  ur: "پاکستانی تھری اسٹار جنرل محمد عاصم ملک پر انگریزی ویکیپیڈیا کا مضمون جو 30 ستمبر 2024 سے آئی ایس آئی کے ڈائریکٹر جنرل اور 2025 سے قومی سلامتی کے مشیر ہیں۔ اس میں ان کے والد لیفٹیننٹ جنرل غلام محمد ملک، ان کی تعلیم اور ڈاکٹریٹ، ان کی عزت کی تلوار اور ان کے احکام درج ہیں۔"
