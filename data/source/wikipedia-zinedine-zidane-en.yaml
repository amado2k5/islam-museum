summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن زين الدين زيدان؛ تُستخدم لوقائع الكيان فقط. توثّق ولادته في مرسيليا في 23 يونيو 1972، ومسيرته في كان وبوردو ويوفنتوس وريال مدريد، وكأس العالم 1998 والكرة الذهبية، وهدفه الطائر في نهائي دوري الأبطال 2002، وطرده في نهائي كأس العالم 2006، وفترتيه مدربًا لريال مدريد بثلاثة ألقاب متتالية لدوري الأبطال، وتصفه بأنه مسلم غير ممارس دون تسمية أي مذهب له."
  en: "English Wikipedia article on Zinedine Zidane; used for entity facts only. It records his birth in Marseille on 23 June 1972, his career at Cannes, Bordeaux, Juventus and Real Madrid, the 1998 World Cup and Ballon d'Or, the 2002 Champions League final volley, his sending-off in the 2006 World Cup final, his two spells coaching Real Madrid with three consecutive Champions League titles, and describes him as a non-practising Muslim, naming no school for him."
  es: "Artículo de la Wikipedia en inglés sobre Zinedine Zidane; utilizado únicamente para datos sobre la persona. Registra su nacimiento en Marsella el 23 de junio de 1972, su carrera en Cannes, Burdeos, Juventus y Real Madrid, la Copa del Mundo de 1998 y el Balón de Oro, la volea en la final de la Liga de Campeones de 2002, su expulsión en la final de la Copa del Mundo de 2006, sus dos etapas como entrenador del Real Madrid con tres títulos consecutivos de la Liga de Campeones, y lo describe como un musulmán no practicante, sin mencionar ninguna escuela a la que pertenezca."
  fr: "Article de Wikipédia en anglais sur Zinedine Zidane; utilisé uniquement pour les informations relatives à l'entité. Il relate sa naissance à Marseille le 23 juin 1972, sa carrière à Cannes, Bordeaux, la Juventus et le Real Madrid, la Coupe du monde 1998 et le Ballon d'Or, sa volée en finale de la Ligue des champions 2002, son expulsion lors de la finale de la Coupe du monde 2006, ses deux passages à la tête du Real Madrid avec trois titres consécutifs en Ligue des champions, et le décrit comme un musulman non pratiquant, sans mentionner d'établissement scolaire."
  ur: "زین الدین زیدان پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 23 جون 1972 کو مارسیل میں ان کی پیدائش، کانز، بورڈو، جووینٹس اور ریئل میڈرڈ میں ان کا کیریئر، 1998 کا ورلڈ کپ اور بیلن ڈی آر، 2002 چیمپئنز لیگ فائنل والی، 2006 کے ورلڈ کپ کے فائنل میں ان کی روانگی، ان کے دو سپیلز ٹائٹل اور ریئل میڈرڈ کوچ کے ساتھ تین میچز کا ریکارڈ ہے۔ اسے ایک غیر عملی مسلمان کے طور پر بیان کرتا ہے، اس کے لیے کسی اسکول کا نام نہیں دیتا۔"
  tr: "Zinedine Zidane hakkında İngilizce Wikipedia makalesi yalnızca varlığın gerçekleri için kullanılmıştır. 23 Haziran 1972'de Marsilya'daki doğumunu, Cannes, Bordeaux, Juventus, Real Madrid'deki kariyerini, 1998 Dünya Kupası'nı, Ballon d'Or'u, 2002 Şampiyonlar Ligi finalindeki uçan golünü, 2006 Dünya Kupası finalindeki atılışını, Real Madrid'in teknik direktörlüğünü ve üç ardışık Şampiyonlar Ligi şampiyonluğunu belgelemekte ve onu uygulamayan bir Müslüman olarak tanımlamaktadır, ancak hiçbir mezhebi belirtilmez."
  id: "Artikel Wikipedia bahasa Inggris tentang Zinedine Zidane hanya digunakan untuk fakta entitas tersebut. Artikel ini mendokumentasikan kelahirannya di Marseille pada 23 Juni 1972, kariernya di Cannes, Bordeaux, Juventus, Real Madrid, Piala Dunia 1998, Ballon d'Or, gol terbangnya di final Liga Champions 2002, pengusirannya di final Piala Dunia 2006, masa jabatannya sebagai pelatih Real Madrid dengan tiga gelar Liga Champions berturut-turut, dan menggambarkannya sebagai Muslim yang tidak taat agama tanpa menyebut sekte mana pun."
