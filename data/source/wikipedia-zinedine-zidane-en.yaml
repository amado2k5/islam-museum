summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن زين الدين زيدان؛ تُستخدم لوقائع الكيان فقط. توثّق ولادته في مرسيليا في 23 يونيو 1972، ومسيرته في كان وبوردو ويوفنتوس وريال مدريد، وكأس العالم 1998 والكرة الذهبية، وهدفه الطائر في نهائي دوري الأبطال 2002، وطرده في نهائي كأس العالم 2006، وفترتيه مدربًا لريال مدريد بثلاثة ألقاب متتالية لدوري الأبطال، وتصفه بأنه مسلم غير ممارس دون تسمية أي مذهب له."
  en: "English Wikipedia article on Zinedine Zidane; used for entity facts only. It records his birth in Marseille on 23 June 1972, his career at Cannes, Bordeaux, Juventus and Real Madrid, the 1998 World Cup and Ballon d'Or, the 2002 Champions League final volley, his sending-off in the 2006 World Cup final, his two spells coaching Real Madrid with three consecutive Champions League titles, and describes him as a non-practising Muslim, naming no school for him."
