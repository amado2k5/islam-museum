summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شير علي خان؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في كابل نحو 1825، وولايته إمارة أفغانستان مرتين (1863-1866 و1868-1879) بعد وفاة أبيه دوست محمد خان، وإصلاحاته الإدارية والعسكرية وأول خدمة بريدية ومدرسة، ووفاته في مزار شريف في 21 فبراير 1879 أثناء الحرب الإنجليزية الأفغانية الثانية ودفنه في الجامع الأزرق بمزار شريف. صندوق معلوماتها وحده يذكر دينه «الإسلام السني»."
  en: "English Wikipedia article on Sher Ali Khan; used for entity facts only. It gives his birth at Kabul about 1825, his two reigns as Emir of Afghanistan (1863–1866 and 1868–1879) after the death of his father Dost Mohammad Khan, his administrative and military reforms and the first postal service and school, and his death at Mazar-e Sharif on 21 February 1879 during the Second Anglo-Afghan War, with burial at the Blue Mosque in Mazar-i-Sharif. Its infobox alone gives his religion as Sunni Islam."
