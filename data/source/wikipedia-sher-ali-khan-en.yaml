summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن شير علي خان؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في كابل نحو 1825، وولايته إمارة أفغانستان مرتين ⁦(1863-1866 و1868-1879)⁩ بعد وفاة أبيه دوست محمد خان، وإصلاحاته الإدارية والعسكرية وأول خدمة بريدية ومدرسة، ووفاته في مزار شريف في 21 فبراير 1879 أثناء الحرب الإنجليزية الأفغانية الثانية ودفنه في الجامع الأزرق بمزار شريف. صندوق معلوماتها وحده يذكر دينه «الإسلام السني»."
  en: "English Wikipedia article on Sher Ali Khan; used for entity facts only. It gives his birth at Kabul about 1825, his two reigns as Emir of Afghanistan (1863–1866 and 1868–1879) after the death of his father Dost Mohammad Khan, his administrative and military reforms and the first postal service and school, and his death at Mazar-e Sharif on 21 February 1879 during the Second Anglo-Afghan War, with burial at the Blue Mosque in Mazar-i-Sharif. Its infobox alone gives his religion as Sunni Islam."
  es: "Artículo de la Wikipedia en inglés sobre Sher Ali Khan; utilizado únicamente para datos sobre la persona. Indica su nacimiento en Kabul alrededor de 1825, sus dos reinados como Emir de Afganistán (1863-1866 y 1868-1879) tras la muerte de su padre, Dost Mohammad Khan, sus reformas administrativas y militares, la creación del primer servicio postal y la primera escuela, y su fallecimiento en Mazar-e Sharif el 21 de febrero de 1879 durante la Segunda Guerra Anglo-Afgana, siendo enterrado en la Mezquita Azul de Mazar-e Sharif. Su ficha informativa solo indica que su religión era el islam sunita."
  fr: "L'article de Wikipédia en anglais consacré à Sher Ali Khan, utilisé uniquement pour les informations le concernant, indique sa naissance à Kaboul vers 1825, ses deux règnes en tant qu'émir d'Afghanistan (1863-1866 et 1868-1879) après la mort de son père, Dost Mohammad Khan, ses réformes administratives et militaires, la création du premier service postal et d'une première école, ainsi que sa mort à Mazar-e-Sharif le 21 février 1879 pendant la seconde guerre anglo-afghane, et son inhumation à la Mosquée bleue de Mazar-e-Sharif. Seule son infobox mentionne sa religion: l'islam sunnite."
