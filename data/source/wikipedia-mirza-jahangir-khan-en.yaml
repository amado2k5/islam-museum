reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026. The reading route used for this batch did not expose a revision id, so none is recorded and the consultation date stands in its place (lane precedent). The article is internally split on the death date: lead and infobox give 23 June 1908, while the biography, citing Rozaneh Magazine, says he was arrested and executed on 'Thursday 4 June 1908 (14 Khordad 1287)' — before the coup of 23 June that the same article describes; both readings are disclosed in the record, which follows the lead. Its Babi attestation rests on one scholarly tradition: 'it is known that Mirza Jahangir Khan was an Azali Babi' cites Nikki Keddie (Modern Iran, 2003, pp. 70, 179, 180), and Mangol Bayat (p. 43) supports only a circumstantial conversion pathway through Haj Sheikh Hadi Najmabadi. No source names a school of Islam for him."
