summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ميرزا جهانغيرخان؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في شيراز نحو 1870 أو 1875 وإعدامه في طهران في 23 يونيو 1908، وتروي تأسيسه أسبوعية «صور إسرافيل» وستارتها الساخرة عند دهخدا، وتذكر أنه كان بابیًا أزليًا نقلاً عن كيدي، وأن معاصريه عدّوه وملك المتكلمين بابيَّين فحُرم من الملاذ وأُعدم في باغ شاه."
  en: "English Wikipedia article on Mirza Jahangir Khan; used for entity facts only. It gives his birth at Shiraz about 1870 or 1875 and his execution at Tehran on 23 June 1908, recounts his founding of the weekly Sur-e Esrafil and Dehkhoda's satirical column in it, states on Keddie's authority that he was an Azali Babi, and records that contemporaries treated him and Malek al-Motakallemin as Babis, were refused sanctuary, and were executed at Bagh-e Shah."
