summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ميرزا جهانغيرخان؛ تُستخدم لوقائع الكيان فقط. تعطي ميلاده في شيراز نحو 1870 أو 1875 وإعدامه في طهران في 23 يونيو 1908، وتروي تأسيسه أسبوعية «صور إسرافيل» وستارتها الساخرة عند دهخدا، وتذكر أنه كان بابیًا أزليًا نقلاً عن كيدي، وأن معاصريه عدّوه وملك المتكلمين بابيَّين فحُرم من الملاذ وأُعدم في باغ شاه."
  en: "English Wikipedia article on Mirza Jahangir Khan; used for entity facts only. It gives his birth at Shiraz about 1870 or 1875 and his execution at Tehran on 23 June 1908, recounts his founding of the weekly Sur-e Esrafil and Dehkhoda's satirical column in it, states on Keddie's authority that he was an Azali Babi, and records that contemporaries treated him and Malek al-Motakallemin as Babis, were refused sanctuary, and were executed at Bagh-e Shah."
  es: "Artículo de la Wikipedia en inglés sobre Mirza Jahangir Khan; utilizado únicamente para datos sobre la persona. Indica su nacimiento en Shiraz alrededor de 1870 o 1875 y su ejecución en Teherán el 23 de junio de 1908, relata la fundación del semanario Sur-e Esrafil y la columna satírica de Dehkhoda en él, afirma, basándose en la autoridad de Keddie, que era un Azali Babi, y registra que sus contemporáneos lo trataron a él y a Malek al-Motakallemin como babíes, se les negó asilo y fueron ejecutados en Bagh-e Shah."
  fr: "L'article de Wikipédia en anglais sur Mirza Jahangir Khan, utilisé uniquement pour les informations factuelles, indique sa naissance à Shiraz vers 1870 ou 1875 et son exécution à Téhéran le 23 juin 1908. Il relate la fondation de l'hebdomadaire Sur-e Esrafil et la chronique satirique de Dehkhoda qui y était publiée, affirme, d'après Keddie, qu'il était un Azali Babi, et rapporte que ses contemporains le traitaient, ainsi que Malek al-Motakallemin, comme des Babis, qu'ils se virent refuser l'asile et qu'ils furent exécutés à Bagh-e Shah."
  ur: "مرزا جہانگیر خان پر انگریزی ویکیپیڈیا کا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ شیراز میں 1870 یا 1875 کے لگ بھگ اس کی پیدائش اور 23 جون 1908 کو تہران میں اس کی پھانسی کا ذکر کرتا ہے، اس میں ہفتہ وار سورۃ اسرافیل اور دیہخودہ کے طنزیہ کالم کی بنیاد کا ذکر کرتا ہے، کیڈی کے اختیار پر کہتا ہے کہ وہ ایک عزالی بابی تھا، اور ملک المومنین نے اس کے ساتھ سلوک کیا تھا۔ بابیوں کو پناہ دینے سے انکار کر دیا گیا اور انہیں باغ شاہ میں پھانسی دے دی گئی۔"
