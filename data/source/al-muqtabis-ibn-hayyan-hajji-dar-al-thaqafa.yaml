label:
  ar: "المقتبس في أخبار بلد الأندلس لأبي مروان ابن حيان القرطبي (377–469هـ) — تحقيق عبد الرحمن علي الحجي، دار الثقافة، بيروت (المكتبة الأندلسية)، بتصدير إحسان عباس (مايو 1965)"
  en: "Abu Marwan Ibn Hayyan al-Qurtubi (377–469 AH), al-Muqtabis fi Akhbar Balad al-Andalus — ed. 'Abd al-Rahman 'Ali al-Hajji, Dar al-Thaqafa, Beirut (al-Maktaba al-Andalusiyya), with a foreword by Ihsan 'Abbas (May 1965)"
summary:
  ar: "نشرة عبد الرحمن الحجي للقطعة الباقية من المقتبس في خمس سنوات غير كاملة من أيام الحكم المستنصر (360–364هـ/970–974م)، عن النسخة الوحيدة في مكتبة الأكاديمية التاريخية بمدريد (مجموعة كوديرا)، المنسوخة سنة 1300هـ/1888م عن مخطوطة ورثة سيدي حمودة بقسنطينة التي فُقدت؛ مع تصدير إحسان عباس الذي أعاد ترتيب أوراقها المضطربة، ومقدمة المحقق عن ابن حيان ومؤلفاته وأجزاء المقتبس الباقية."
  en: "'Abd al-Rahman al-Hajji's edition of the surviving section of al-Muqtabis covering five incomplete years of the reign of al-Hakam al-Mustansir (360–364 AH/970–974 CE), from the unique copy in the Library of the Royal Academy of History in Madrid (Codera collection). That copy was made in 1300 AH/1888 from the manuscript of the heirs of Sidi Hamuda in Constantine, which has since been lost. The edition has a foreword by Ihsan 'Abbas, who reordered its disordered leaves, and the editor's introduction on Ibn Hayyan, his works and the surviving parts of al-Muqtabis."
title: "المقتبس في أخبار بلد الأندلس — ابن حيان القرطبي (قطعة من أيام الحكم المستنصر 360–364هـ)"
