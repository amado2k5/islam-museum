label:
  ar: "المقتبس في أخبار بلد الأندلس لأبي مروان ابن حيان القرطبي ⁦(377–469هـ)⁩ — تحقيق عبد الرحمن علي الحجي، دار الثقافة، بيروت ⁦(المكتبة الأندلسية)⁩، بتصدير إحسان عباس ⁦(مايو 1965)⁩"
  en: "Abu Marwan Ibn Hayyan al-Qurtubi (377–469 AH), al-Muqtabis fi Akhbar Balad al-Andalus — ed. 'Abd al-Rahman 'Ali al-Hajji, Dar al-Thaqafa, Beirut (al-Maktaba al-Andalusiyya), with a foreword by Ihsan 'Abbas (May 1965)"
summary:
  ar: "نشرة عبد الرحمن الحجي للقطعة الباقية من المقتبس في خمس سنوات غير كاملة من أيام الحكم المستنصر ⁦(360–364هـ/970–974م)⁩، عن النسخة الوحيدة في مكتبة الأكاديمية التاريخية بمدريد ⁦(مجموعة كوديرا)⁩، المنسوخة سنة 1300هـ/1888م عن مخطوطة ورثة سيدي حمودة بقسنطينة التي فُقدت؛ مع تصدير إحسان عباس الذي أعاد ترتيب أوراقها المضطربة، ومقدمة المحقق عن ابن حيان ومؤلفاته وأجزاء المقتبس الباقية."
  en: "'Abd al-Rahman al-Hajji's edition of the surviving section of al-Muqtabis covering five incomplete years of the reign of al-Hakam al-Mustansir (360–364 AH/970–974 CE), from the unique copy in the Library of the Royal Academy of History in Madrid (Codera collection). That copy was made in 1300 AH/1888 from the manuscript of the heirs of Sidi Hamuda in Constantine, which has since been lost. The edition has a foreword by Ihsan 'Abbas, who reordered its disordered leaves, and the editor's introduction on Ibn Hayyan, his works and the surviving parts of al-Muqtabis."
  es: "Edición de Abd al-Rahman al-Hajji de la sección conservada de al-Muqtabis, que abarca cinco años incompletos del reinado de al-Hakam al-Mustansir (360-364 AH/970-974 d. C.), a partir del único ejemplar conservado en la Biblioteca de la Real Academia de Historia de Madrid (colección Codera). Dicho ejemplar fue realizado en 1300 AH/1888 a partir del manuscrito de los herederos de Sidi Hamuda en Constantina, que posteriormente se perdió. La edición incluye un prólogo de Ihsan Abbas, quien reordenó las hojas desordenadas, y una introducción del editor sobre Ibn Hayyan, sus obras y las partes conservadas de al-Muqtabis."
  fr: "L'édition par 'Abd al-Rahman al-Hajji de la section subsistante d'al-Muqtabis couvrant cinq années incomplètes du règne d'al-Hakam al-Mustansir (360-364 AH/970-974 CE), d'après l'unique exemplaire conservé à la Bibliothèque de l'Académie royale d'histoire de Madrid (collection Codera). Cet exemplaire fut réalisé en 1300 AH/1888 à partir du manuscrit des héritiers de Sidi Hamuda à Constantin, aujourd'hui disparu. L'édition comprend une préface d'Ihsan 'Abbas, qui a réorganisé les feuillets désordonnés, et une introduction de l'éditeur sur Ibn Hayyan, ses œuvres et les parties subsistantes d'al-Muqtabis."
  ur: "'عبدالرحمن الحاجی کا المکتبیس کے زندہ بچ جانے والے حصے کا ایڈیشن جو الحکم المستنصر ⁦(360-364 ہجری / 970-974 عیسوی)⁩ کے پانچ نامکمل سالوں پر محیط ہے، جو کہ رائل اکیڈمی آف ہسٹری کی لائبریری میں منفرد کاپی سے ہے ⁦(MadridCo مجموعہ)⁩۔ یہ نسخہ 1300ھ/1888ء میں قسطنطنیہ میں سیدی حمودہ کے ورثاء کے مخطوطہ سے تیار کیا گیا تھا، جو اس کے بعد سے گم ہے۔ ایڈیشن میں احسان عباس کا پیش لفظ ہے، جس نے اس کے منقطع پتوں کو دوبارہ ترتیب دیا، اور ابن حیان، اس کی تخلیقات اور المقطبی کے بچ جانے والے حصوں پر مدیر کا تعارف۔"
  tr: "Abdul Rahman al-Hajji'nin, al-Mustansir'in (360–364 Hicri / 970–974 M.S.) saltanatı sırasında beş eksik yıldan alıntılanan kalan parça üzerine bülteni, Madrid Tarih Akademisi Kütüphanesi'ndeki tek kopyadan (Codera koleksiyonu) yer almaktadır; 1300 Hicri / 1888 yılında Konstantin'deki Sidi Hammouda'nın varislerinin el yazmasından kopyalanmıştır; İhsan Abbas'ın tanıtımıyla, bozulmuş sayfaları, editörün İbn Hayyan'a girişi, eserleri ve alıntılanan diğer bölümler yeniden düzenlenmiştir."
  id: "Buletin Abdul Rahman al-Hajji tentang sisa fragmen yang dikutip dari lima tahun yang tidak lengkap selama masa pemerintahan al-Mustansir (360–364 H / 970–974 M), dari satu-satunya salinan di Perpustakaan Akademi Sejarah Madrid (koleksi Codera), disalin pada 1300 H / 1888 M dari manuskrip ahli waris Sidi Hammouda di Konstantinus yang hilang; dengan diperkenalkannya Ihsan Abbas, yang mengatur ulang halaman-halaman yang terganggu, pengantar editor untuk Ibn Hayyan, karya-karyanya, dan bagian-bagian yang tersisa dari kutipan."
title: "المقتبس في أخبار بلد الأندلس — ابن حيان القرطبي ⁦(قطعة من أيام الحكم المستنصر 360–364هـ)⁩"
