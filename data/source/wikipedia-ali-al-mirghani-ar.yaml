summary:
  ar: "مقالة ويكيبيديا العربية عن السيد علي الميرغني (1873-1968)؛ تُستخدم لوقائع الكيان فقط. تذكر أسرته المعروفة بقيادة الطريقة الختمية الصوفية، وتشكّك في سنة ميلاده (1873) إذ ترجّح نحو 1879 بناء على تقرير مخابرات، وتوثّق زعامته ووفاته بالخرطوم بحري."
  en: "Arabic Wikipedia article on Sayyid Ali al-Mirghani (1873–1968); used for entity facts only. It names his family as known for leading the Sufi Khatmiyya tariqa, questions his birth year (1873), preferring about 1879 on an intelligence report, and documents his leadership and his death at Khartoum Bahri."
  es: "Artículo de Wikipedia en árabe sobre Sayyid Ali al-Mirghani (1873-1968); utilizado únicamente para datos sobre la persona. Menciona a su familia como líder de la tariqa sufí Khatmiyya, cuestiona su año de nacimiento (1873), prefiriendo alrededor de 1879 según un informe de inteligencia, y documenta su liderazgo y su muerte en Khartoum Bahri."
  fr: "Article de Wikipédia en arabe sur Sayyid Ali al-Mirghani (1873-1968); utilisé uniquement pour les informations sur l’entité. Il mentionne sa famille comme étant à la tête de la confrérie soufie Khatmiyya, remet en question son année de naissance (1873), privilégiant 1879 d’après un rapport de renseignement, et relate son rôle de chef spirituel ainsi que sa mort à Khartoum Bahri."
  ur: "سید علی المرغانی (1873-1968) پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کے خاندان کا نام ہے جو کہ صوفی خاتمیہ طریقہ کی قیادت کرنے کے لیے جانا جاتا ہے، ان کے سال پیدائش (1873) پر سوال کرتا ہے، ایک انٹیلی جنس رپورٹ پر 1879 کو ترجیح دیتا ہے، اور خرطوم بہاری میں اس کی قیادت اور اس کی موت کو دستاویز کرتا ہے۔"
  tr: "Seyyid Ali el-Mirghani (1873-1968) hakkında Arapça Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. Ünlü ailesi Hatmiya Sufi tarikatının lideri olarak anılmaktadır ve doğum yılı (1873) şüphelidir; çünkü bir istihbarat raporuna dayanarak yaklaşık 1879 olduğu tahmin edilmektedir ve Hartum Bahri'deki liderliği ve ölümünü belgelemektedir."
  id: "Artikel Wikipedia Arab tentang Sayyid Ali al-Mirghani (1873-1968); digunakan hanya untuk fakta entitas. Keluarganya yang terkenal disebut sebagai pemimpin tarekat Sufi Khatmiya, dan mereka meragukan tahun kelahirannya (1873), karena diperkirakan sekitar 1879 berdasarkan laporan intelijen, dan mendokumentasikan kepemimpinan serta kematiannya di Khartoum Bahri."
