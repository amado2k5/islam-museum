reliability_note: "Pointer for entity facts only (Wikipedia broad rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 25 October 2026. Its lead calls him a Sudanese religious and political leader and his family 'known for the leadership of the Sufi Khatmiyya tariqa' — the second independent attestation of the order's headship in his person. It gives his lineage to Muhammad Uthman al-Mirghani al-Khatim, founder of the Khatmiyya; born on Masawi island in northern Sudan in a year it treats as uncertain — 1870 or 1880 are mentioned, with about 1879 preferred because an intelligence report estimated his age at eleven in 1890 (the English article and Wikidata give 1873, which the record follows with the doubt noted); moved to Kassala, then Massawa and Suakin; studied under his uncle Muhammad Uthman Taj al-Sir; his father died in Egypt and his Cairo grave became a Sufi shrine; five years in Cairo attending al-Azhar without a degree; the historian Abu Salim is cited doubting the rumours that he was an intelligence officer; return to Suakin, Kassala and Khartoum (1901); government land grants and support in his succession dispute with his brother Ahmed (d. 1928); his wartime loyalty, the Ali Dinar letter, the contact with Sharif Husayn; the newspaper al-Hadara published with al-Mahdi and al-Hindi on government subsidy until 1938; residence at Hillat Khojali, Khartoum Bahri, where he died and was buried in his mosque; succeeded by his son Muhammad Uthman al-Mirghani. It also carries the family's claimed Husayni genealogy and the doubts raised about it — a lineage claim, not a faith attestation, and not used as one. It names no madhhab for him."
