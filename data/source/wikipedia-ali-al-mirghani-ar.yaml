  ar: "مقالة ويكيبيديا العربية عن السيد علي الميرغني (1873-1968)؛ تُستخدم لوقائع الكيان فقط. تذكر أسرته المعروفة بقيادة الطريقة الختمية الصوفية، وتشكّك في سنة ميلاده (1873) إذ ترجّح نحو 1879 بناء على تقرير مخابرات، وتوثّق زعامته ووفاته بالخرطوم بحري."
  en: "Arabic Wikipedia article on Sayyid Ali al-Mirghani (1873–1968); used for entity facts only. It names his family as known for leading the Sufi Khatmiyya tariqa, questions his birth year (1873), preferring about 1879 on an intelligence report, and documents his leadership and his death at Khartoum Bahri."
