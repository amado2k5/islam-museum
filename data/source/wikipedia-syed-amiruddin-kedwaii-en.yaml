summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سيد أمير الدين قدوائي؛ تُستخدم لوقائع الكيان فقط. تروي مولده نحو 1901 في بارابانكي ودراسته القانون في جامعة عليكرة، ونشاطه في حركة الخلافة وحركة باكستان، وتصميمه علم باكستان، وهجرته إلى لاهور سنة 1947 ووفاته فيها في 21 آب 1973."
  en: "English Wikipedia article on Syed Amir-uddin Kedwaii; used for entity facts only. It recounts his birth about 1901 in Barabanki, his law degree at Aligarh University, his activism in the Khilafat movement and the Pakistan Movement, his designing of the national flag of Pakistan, his migration to Lahore in 1947 and his death there on 21 August 1973."
  es: "Artículo de la Wikipedia en inglés sobre Syed Amir-uddin Kedwaii; utilizado únicamente para datos biográficos. Relata su nacimiento alrededor de 1901 en Barabanki, su licenciatura en derecho en la Universidad de Aligarh, su activismo en el movimiento Khilafat y el Movimiento por Pakistán, el diseño de la bandera nacional de Pakistán, su migración a Lahore en 1947 y su fallecimiento allí el 21 de agosto de 1973."
  fr: "Article de Wikipédia en anglais sur Syed Amir-uddin Kedwaii; utilisé uniquement à des fins d’information sur l’entité. Il relate sa naissance vers 1901 à Barabanki, ses études de droit à l’université d’Aligarh, son activisme au sein du mouvement Khilafat et du mouvement pour le Pakistan, la conception du drapeau national du Pakistan, son émigration à Lahore en 1947 et son décès dans cette ville le 21 août 1973."
  ur: "سید امیر الدین کیدوائی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں بارہ بنکی میں ان کی پیدائش، علی گڑھ یونیورسٹی میں قانون کی ڈگری، تحریک خلافت اور تحریک پاکستان میں ان کی سرگرمی، پاکستان کے قومی پرچم کی ڈیزائننگ، 1947 میں لاہور ہجرت اور 21 اگست 1973 کو وہیں ان کی موت کا ذکر ہے۔"
