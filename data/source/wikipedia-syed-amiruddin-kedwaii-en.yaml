  ar: "مقالة ويكيبيديا الإنجليزية عن سيد أمير الدين قدوائي؛ تُستخدم لوقائع الكيان فقط. تروي مولده نحو 1901 في بارابانكي ودراسته القانون في جامعة عليكرة، ونشاطه في حركة الخلافة وحركة باكستان، وتصميمه علم باكستان، وهجرته إلى لاهور سنة 1947 ووفاته فيها في 21 آب 1973."
  en: "English Wikipedia article on Syed Amir-uddin Kedwaii; used for entity facts only. It recounts his birth about 1901 in Barabanki, his law degree at Aligarh University, his activism in the Khilafat movement and the Pakistan Movement, his designing of the national flag of Pakistan, his migration to Lahore in 1947 and his death there on 21 August 1973."
