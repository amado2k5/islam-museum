summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد عبد العليم صديقي (3 نيسان 1892 – 22 آب 1954)؛ تنص في صدرها على انتمائه إلى الحركة البريلوية في الإسلام السني وتلمذته على أحمد رضا خان البريلوي، وفي قسم البيعة والخلافة على أنه صار مريداً لأحمد رضا خان في الطريقة القادرية الرضوية ونال خلافته، ويحمل صندوقها حقول السنة والحنفية والماتريدية."
  en: "The English Wikipedia article on Muhammad Abdul Aleem Siddiqi (3 April 1892 – 22 August 1954); its lead states that he belonged to the Barelvi movement of Sunni Islam and was a student of Ahmed Raza Khan Barelvi, its Ba'at and Khilafat section states that he became a mureed of Ahmed Raza Khan in the Qadiriyya Razviya order and received his khilafat, and its infobox carries Sunni, Hanafi and Maturidi fields."
