summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد عبد العليم صديقي ⁦(3 نيسان 1892 – 22 آب 1954)⁩؛ تنص في صدرها على انتمائه إلى الحركة البريلوية في الإسلام السني وتلمذته على أحمد رضا خان البريلوي، وفي قسم البيعة والخلافة على أنه صار مريداً لأحمد رضا خان في الطريقة القادرية الرضوية ونال خلافته، ويحمل صندوقها حقول السنة والحنفية والماتريدية."
  en: "The English Wikipedia article on Muhammad Abdul Aleem Siddiqi (3 April 1892 – 22 August 1954); its lead states that he belonged to the Barelvi movement of Sunni Islam and was a student of Ahmed Raza Khan Barelvi, its Ba'at and Khilafat section states that he became a mureed of Ahmed Raza Khan in the Qadiriyya Razviya order and received his khilafat, and its infobox carries Sunni, Hanafi and Maturidi fields."
  es: "El artículo de la Wikipedia en inglés sobre Muhammad Abdul Aleem Siddiqi (3 de abril de 1892 - 22 de agosto de 1954); su introducción afirma que perteneció al movimiento Barelvi del Islam sunita y fue alumno de Ahmed Raza Khan Barelvi, su sección Ba'at y Khilafat afirma que se convirtió en mureed de Ahmed Raza Khan en la orden Qadiriyya Razviya y recibió su khilafat, y su ficha informativa contiene campos Sunni, Hanafi y Maturidi."
  fr: "L'article de Wikipédia en anglais sur Muhammad Abdul Aleem Siddiqi (3 avril 1892 – 22 août 1954); son introduction indique qu'il appartenait au mouvement Barelvi de l'islam sunnite et qu'il était un élève d'Ahmed Raza Khan Barelvi, sa section Ba'at et Califat indique qu'il est devenu un mureed d'Ahmed Raza Khan dans l'ordre Qadiriyya Razviya et a reçu son califat, et son infobox comporte les champs Sunni, Hanafi et Maturidi."
  ur: "محمد عبدالعلیم صدیقی پر انگریزی ویکیپیڈیا کا مضمون ⁦(3 اپریل 1892 - 22 اگست 1954)⁩؛ اس کا لیڈ کہتا ہے کہ وہ سنی اسلام کی بریلوی تحریک سے تعلق رکھتا تھا اور احمد رضا خان بریلوی کا طالب علم تھا، اس کی بعثت اور خلافت سیکشن کہتا ہے کہ وہ قادریہ رضویہ کے حکم میں احمد رضا خان کے مرید بنے اور ان کی خلافت حاصل کی، اور اس کے معلوماتی خانے میں سنی، حنفی اور ماتریدی شعبوں کا ذکر ہے۔"
