summary:
  ar: "الصفحة «On Arabic justification, part 1» في University of Reading (TypoArabic)؛ ذُكرت في ملف بحث قُدّم إلى المتحف في 21 نوفمبر 2026، ولم يفتح المتحف الصفحة، ووافق المؤسس على استعمال الملف دون إعادة تحقق. تُستعمل في: الحروف الطباعية والطباعة العربية وكتلة يونيكود العربية."
  en: "The page \"On Arabic justification, part 1\" (University of Reading (TypoArabic)), named in a research file supplied to the museum on 21 November 2026; the museum did not open the page, and the founder approved using the file without re-verification. Used for: Arabic typography and the Unicode Arabic block."
  ur: "صفحہ «On Arabic justification, part 1» (University of Reading (TypoArabic))؛ یہ عجائب گھر کو 21 نومبر 2026ء کو دی گئی تحقیقی فائل میں مذکور ہے، عجائب گھر نے صفحہ نہیں کھولا اور بانی نے دوبارہ تصدیق کے بغیر فائل کے استعمال کی منظوری دی۔ استعمال: عربی ٹائپوگرافی اور یونی کوڈ کا عربی بلاک۔"
  fr: "La page « On Arabic justification, part 1 » (University of Reading (TypoArabic)), citée dans un fichier de recherche remis au musée le 21 novembre 2026 ; le musée n'a pas ouvert la page, et le fondateur a approuvé l'usage du fichier sans nouvelle vérification. Utilisée pour : la typographie arabe et le bloc arabe d'Unicode."
  es: "La página «On Arabic justification, part 1» (University of Reading (TypoArabic)), citada en un archivo de investigación entregado al museo el 21 de noviembre de 2026; el museo no abrió la página, y el fundador aprobó usar el archivo sin volver a verificar. Usada para: la tipografía árabe y el bloque árabe de Unicode."
  tr: "Reading Üniversitesi'nde \"Arapça gerekçelendirme, bölüm 1\" sayfası (TypoArabic); 21 Kasım 2026'da müzeye sunulan bir araştırma dosyasında bahsedilmiş, ancak müze sayfayı açmamış ve kurucu dosyanın yeniden doğrulama yapılmadan kullanımını onaylamıştır. Kullanıldığı alanlar: Arap yazı tipleri, baskı ve Arap Unicode bloğu."
  id: "Halaman \"Tentang pembenaran Arab, bagian 1\" di Universitas Reading (TypoArabic); disebutkan dalam berkas penelitian yang dikirim ke museum pada 21 November 2026, tetapi museum tidak membuka halaman tersebut, dan pendiri menyetujui penggunaan berkas tanpa verifikasi ulang. Digunakan dalam: jenis huruf Arab, percetakan, dan blok Unicode Arab."
