reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It gives her birth as about 1612 — a figure from later historiography with no contemporary birth record, so an estimate — her father as Iskandar Muda and her husband as Iskandar Thani, her enthronement about 18 February 1641 on the Dutch report of Jacob Compostel (the Bustan placing her accession on her husband's death day), her collaborative government, her patronage of Islamic scholarship, Abdurrauf of Singkil's Mir'at al-Tullab composed at her request about 1663, and her death on 23 October 1675. It names no school or order for the sultana herself. Checked 1 November 2026."
