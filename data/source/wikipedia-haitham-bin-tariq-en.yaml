summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن هيثم بن طارق آل سعيد؛ تُستخدم لوقائع الكيان فقط. تذكر أنه وُلد في مسقط في 11 أكتوبر 1955، ابن طارق بن تيمور، وتدرّج في وزارة الخارجية (وكيلًا للشؤون السياسية 1986–1994 ثم أمينًا عامًا 1994–2002) ثم وزيرًا للتراث والثقافة 2002–2020، وخلف ابن عمه قابوس بن سعيد سلطانًا لعُمان في 11 يناير 2020 بحسب الرسالة المختومة التي تركها، وهو أيضًا رئيس الوزراء ويرأس لجنة رؤية عُمان 2040."
  en: "English Wikipedia article on Haitham bin Tariq Al Said; used for entity facts only. It gives him as born at Muscat on 11 October 1955, a son of Tariq bin Taimur, who rose through the Foreign Ministry (undersecretary for political affairs 1986–1994, then secretary general 1994–2002) and served as Minister of Heritage and Culture 2002–2020, succeeding his cousin Qaboos bin Said as Sultan of Oman on 11 January 2020 under the sealed letter Qaboos had left; he is also prime minister and chairs the Oman Vision 2040 committee. Its infobox religion field reads 'Ibadi Islam' — a structured value, not a statement in its text."
