summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن هيثم بن طارق آل سعيد؛ تُستخدم لوقائع الكيان فقط. تذكر أنه وُلد في مسقط في 11 أكتوبر 1955، ابن طارق بن تيمور، وتدرّج في وزارة الخارجية ⁦(وكيلًا للشؤون السياسية 1986–1994 ثم أمينًا عامًا 1994–2002)⁩ ثم وزيرًا للتراث والثقافة 2002–2020، وخلف ابن عمه قابوس بن سعيد سلطانًا لعُمان في 11 يناير 2020 بحسب الرسالة المختومة التي تركها، وهو أيضًا رئيس الوزراء ويرأس لجنة رؤية عُمان 2040."
  en: "English Wikipedia article on Haitham bin Tariq Al Said; used for entity facts only. It gives him as born at Muscat on 11 October 1955, a son of Tariq bin Taimur, who rose through the Foreign Ministry (undersecretary for political affairs 1986–1994, then secretary general 1994–2002) and served as Minister of Heritage and Culture 2002–2020, succeeding his cousin Qaboos bin Said as Sultan of Oman on 11 January 2020 under the sealed letter Qaboos had left; he is also prime minister and chairs the Oman Vision 2040 committee. Its infobox religion field reads 'Ibadi Islam' — a structured value, not a statement in its text."
  es: "Artículo de Wikipedia en inglés sobre Haitham bin Tariq Al Said; utilizado únicamente para datos sobre la entidad. Lo describe como nacido en Mascate el 11 de octubre de 1955, hijo de Tariq bin Taimur, quien ascendió en el Ministerio de Asuntos Exteriores (subsecretario de Asuntos Políticos 1986–1994, luego secretario general 1994–2002) y se desempeñó como Ministro de Patrimonio y Cultura 2002–2020, sucediendo a su primo Qaboos bin Said como Sultán de Omán el 11 de enero de 2020 bajo la carta sellada que Qaboos había dejado; también es primer ministro y preside el comité Visión Omán 2040. Su campo de religión en el cuadro de información dice \"Islam ibadí\" — un valor estructurado, no una declaración en su texto."
  fr: "L'article de Wikipédia en anglais consacré à Haitham bin Tariq Al Said, utilisé uniquement pour les informations le concernant, indique qu'il est né à Mascate le 11 octobre 1955. Fils de Tariq bin Taimur, il a gravi les échelons du ministère des Affaires étrangères (sous-secrétaire aux Affaires politiques de 1986 à 1994, puis secrétaire général de 1994 à 2002) et a été ministre du Patrimoine et de la Culture de 2002 à 2020. Il a succédé à son cousin Qabous bin Said comme sultan d'Oman le 11 janvier 2020, conformément à la lettre scellée laissée par ce dernier. Il est également Premier ministre et président du comité Oman Vision 2040. Le champ « Religion » de son infobox indique « Islam ibadite » — une valeur structurée, et non une affirmation figurant dans le texte."
  ur: "ہیثم بن طارق السید پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس سے وہ 11 اکتوبر 1955 کو مسقط میں پیدا ہوئے تھے، طارق بن تیمور کے بیٹے، جو وزارت خارجہ کے ذریعے اٹھائے گئے ⁦(سیاسی امور کے انڈر سیکرٹری 1986-1994، پھر سیکرٹری جنرل 1994-2002)⁩ اور 2002-2002 تک وزیر ثقافت اور ثقافتی ورثہ کے طور پر خدمات انجام دیں۔ عمان 11 جنوری 2020 کو مہر بند خط کے تحت قابوس روانہ ہوا تھا۔ وہ وزیر اعظم بھی ہیں اور عمان ویژن 2040 کمیٹی کے چیئرمین بھی ہیں۔ اس کا انفو باکس مذہب کا فیلڈ 'عبادی اسلام' پڑھتا ہے - ایک ساختی قدر، اس کے متن میں کوئی بیان نہیں۔"
  tr: "Haitham bin Tariq Al Said hakkında İngilizce Wikipedia makalesi; yalnızca kurumun gerçekleri için kullanılmıştır. 11 Ekim 1955'te Maskat'ta doğduğu belirtilmiştir; babası Tariq bin Taimur'un oğlu ve Dışişleri Bakanlığı'nda (1986–1994 yılları arasında Siyasi İşler Müsteşarı, 1994-2002 arasında Genel Sekreter, 2002-2020 arasında Miras ve Kültür Bakanı olarak) yükselmiştir. Kuzeni Kabus bin Said'in yerine 11 Ocak 2020'de Umman Sultanı oldu, bu da mühürlü mektuba göre. Ayrıca Başbakandır ve Umman Vizyon 2040 Komitesi'nin başkanlığını yürütmektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Haitham bin Tariq Al Said; hanya digunakan untuk fakta entitas. Dicatat bahwa ia lahir di Muscat pada 11 Oktober 1955, putra Tariq bin Taimur, dan naik pangkat di Kementerian Luar Negeri (sebagai Wakil Menteri Urusan Politik 1986–1994, lalu Sekretaris Jenderal dari 1994 hingga 2002), lalu Menteri Warisan dan Kebudayaan dari 2002 hingga 2020. Ia menggantikan sepupunya Qaboos bin Said sebagai Sultan Oman pada 11 Januari 2020, menurut surat tersegel yang ditinggalkannya. Ia juga Perdana Menteri dan ketua Komite Oman Vision 2040."
