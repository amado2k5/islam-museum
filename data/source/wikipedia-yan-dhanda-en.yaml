reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and checked against the recorded revision, fetched by revision id. It gives his full name as Yan Joseph Dhanda, born 14 December 1998 in Birmingham and raised in Tipton; youth career at West Bromwich Albion and Liverpool (joined 2013), a first professional contract in December 2015; Swansea City 2018–2022, Ross County 2022–2024, Heart of Midlothian from June 2024 with a loan to Dundee in 2025–26; England under-16 and under-17 caps; his wish to represent India and his Overseas Citizenship of India. Its personal-life section says he is of Punjabi Sikh heritage through his father, quoting Sky Sports that his father is Sikh-Punjabi and his mother English, and covers the racist abuse he received online after the February 2021 FA Cup tie at Manchester City. It names no religion for Dhanda himself."
