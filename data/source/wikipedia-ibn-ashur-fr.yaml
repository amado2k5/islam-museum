summary:
  ar: 'مقالة ويكيبيديا الفرنسية عن محمد الطاهر بن عاشور؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في تونس ووفاته في المرسى، ومساره أستاذًا بالزيتونة وعميدًا لها، ومناصبه الدينية: قاضٍ (1913–1923) فمفتٍ مالكي 1923 فباش مفتي مالكي 1927 فأول شيخ إسلام مالكي 1932، وتصف منصب الباش مفتي بأنه أعلى منصب ديني للمذهب المالكي. لا تسمّي مذهبه الشخصي خارج وصف المناصب.'
  en: 'French Wikipedia article on Mohamed Tahar Ben Achour; used for entity facts only. It gives his birth in Tunis and death at La Marsa, his career as Zaytuna professor and rector, and his religious offices: qadi (1913–1923), then Maliki mufti in 1923, Maliki bach mufti in 1927, and first Maliki Shaykh al-Islam in 1932, describing the bach mufti post as the highest religious dignity of the Maliki rite. It names no personal school for him apart from the office descriptions.'
  es: "Artículo de la Wikipedia en francés sobre Mohamed Tahar Ben Achour; utilizado únicamente para datos sobre la persona. Indica su nacimiento en Túnez y su fallecimiento en La Marsa, su trayectoria como profesor y rector de Zaytuna, y sus cargos religiosos: cadí (1913-1923), luego muftí malikí en 1923, muftí de Bach malikí en 1927 y primer jeque al-Islam malikí en 1932, describiendo el cargo de muftí de Bach como la máxima dignidad religiosa del rito malikí. No menciona ninguna escuela personal para él, aparte de las descripciones de sus cargos."
  fr: "Article de Wikipédia en français sur Mohamed Tahar Ben Achour; utilisé uniquement pour les informations le concernant. Il indique sa naissance à Tunis et sa mort à La Marsa, sa carrière de professeur et recteur de Zaytuna, ainsi que ses fonctions religieuses: cadi (1913-1923), puis mufti malikite en 1923, bach mufti malikite en 1927 et premier cheikh al-Islam malikite en 1932, décrivant la fonction de bach mufti comme la plus haute dignité religieuse du rite malikite. L’article ne mentionne aucune école personnelle qui lui serait attribuée, hormis la description de ses fonctions."
  ur: "محمد طاہر بن اچور پر فرانسیسی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ تیونس میں ان کی پیدائش اور لا مارسا میں موت، زیتونہ کے پروفیسر اور ریکٹر کے طور پر ان کا کیریئر، اور ان کے مذہبی دفاتر: قادی (1913-1923)، پھر 1923 میں مالکی مفتی، 1927 میں مالکی بچ مفتی، اور 1932 میں پہلے مالکی شیخ الاسلام، بحیثیت اعلیٰ ترین مذہبی عہدے پر فائز ہوئے۔ مالکی رسم۔ اس میں دفتری تفصیلات کے علاوہ اس کے لیے کسی ذاتی اسکول کا نام نہیں ہے۔"
