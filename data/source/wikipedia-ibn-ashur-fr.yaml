summary:
  ar: 'مقالة ويكيبيديا الفرنسية عن محمد الطاهر بن عاشور؛ تُستخدم لوقائع الكيان فقط. تعطي مولده في تونس ووفاته في المرسى، ومساره أستاذًا بالزيتونة وعميدًا لها، ومناصبه الدينية: قاضٍ (1913–1923) فمفتٍ مالكي 1923 فباش مفتي مالكي 1927 فأول شيخ إسلام مالكي 1932، وتصف منصب الباش مفتي بأنه أعلى منصب ديني للمذهب المالكي. لا تسمّي مذهبه الشخصي خارج وصف المناصب.'
  en: 'French Wikipedia article on Mohamed Tahar Ben Achour; used for entity facts only. It gives his birth in Tunis and death at La Marsa, his career as Zaytuna professor and rector, and his religious offices: qadi (1913–1923), then Maliki mufti in 1923, Maliki bach mufti in 1927, and first Maliki Shaykh al-Islam in 1932, describing the bach mufti post as the highest religious dignity of the Maliki rite. It names no personal school for him apart from the office descriptions.'
