reliability_note: >-
  Tertiary encyclopedia article resting on the Memoranda on the Indian
  States (1930, 1935), Soszynski's Kalat genealogy, the List of
  Leading Personages in Baluchistan (1921) and Ahmad Yar Khan's
  autobiography. It dates his birth 'about 1870', to Khudadad Khan,
  and his death to 10 September 1933, names him father of Ahmad Yar
  Khan among four sons, and says nothing of his religion. Retrieved
  in full via the MediaWiki API on 31 October 2026, the returned
  revision id asserted equal to the recorded one before any claim was
  drawn.
