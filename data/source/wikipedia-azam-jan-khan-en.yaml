  ar: "المقال الإنجليزي عن مير أعظم جان خان (نحو 1870 – 10 سبتمبر 1933)، خان قلات من ديسمبر 1931 إلى وفاته: رفضه العرش عند خلع والده خداداد خان سنة 1893 ومشاركته منفاه، وحكمه مكران نيابة عن أخيه محمود خان، وإدارته قلات أثناء مرض أخيه، وإلغاؤه السخرة، وتنصيبه الرسمي في كويته في 26 أبريل 1932."
  en: "English Wikipedia article on Mir Azam Jan Khan (about 1870 – 10 September 1933), Khan of Kalat from December 1931 until his death: his refusal of the throne when his father Khudadad Khan was deposed in 1893 and his sharing of the exile, his governorship of Makran for his brother Mahmud Khan II, his administration of Kalat during Mahmud's illness, his abolition of forced labour, and his formal installation at Quetta on 26 April 1932."
