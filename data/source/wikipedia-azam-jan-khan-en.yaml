summary:
  ar: "المقال الإنجليزي عن مير أعظم جان خان ⁦(نحو 1870 – 10 سبتمبر 1933)⁩، خان قلات من ديسمبر 1931 إلى وفاته: رفضه العرش عند خلع والده خداداد خان سنة 1893 ومشاركته منفاه، وحكمه مكران نيابة عن أخيه محمود خان، وإدارته قلات أثناء مرض أخيه، وإلغاؤه السخرة، وتنصيبه الرسمي في كويته في 26 أبريل 1932."
  en: "English Wikipedia article on Mir Azam Jan Khan (about 1870 – 10 September 1933), Khan of Kalat from December 1931 until his death: his refusal of the throne when his father Khudadad Khan was deposed in 1893 and his sharing of the exile, his governorship of Makran for his brother Mahmud Khan II, his administration of Kalat during Mahmud's illness, his abolition of forced labour, and his formal installation at Quetta on 26 April 1932."
  es: "Artículo de la Wikipedia en inglés sobre Mir Azam Jan Khan (alrededor de 1870 - 10 de septiembre de 1933), Khan de Kalat desde diciembre de 1931 hasta su muerte: su negativa a aceptar el trono cuando su padre Khudadad Khan fue depuesto en 1893 y su participación en el exilio, su gobierno de Makran en lugar de su hermano Mahmud Khan II, su administración de Kalat durante la enfermedad de Mahmud, su abolición del trabajo forzado y su investidura formal en Quetta el 26 de abril de 1932."
  fr: "Article de Wikipédia en anglais sur Mir Azam Jan Khan (environ 1870 – 10 septembre 1933), Khan de Kalat de décembre 1931 jusqu'à sa mort: son refus du trône lorsque son père Khudadad Khan fut déposé en 1893 et son partage de l'exil, son gouvernement de Makran pour son frère Mahmud Khan II, son administration de Kalat pendant la maladie de Mahmud, son abolition du travail forcé et son installation officielle à Quetta le 26 avril 1932."
  ur: "میر اعظم جان خان ⁦(تقریباً 1870 - 10 ستمبر 1933)⁩ پر انگریزی ویکیپیڈیا کا مضمون، خان آف قلات دسمبر 1931 سے ان کی موت تک: تخت سے انکار جب ان کے والد خداداد خان کو 1893 میں معزول کیا گیا اور جلاوطنی میں شریک ہونا، مکران کی گورنری اس کے بھائی محمود خان کی بیماری کے دوران، اس کے بھائی محمود خان کے دور میں۔ جبری مشقت، اور 26 اپریل 1932 کو کوئٹہ میں اس کی باقاعدہ تنصیب۔"
  tr: "Mir Azam Jan Han (yaklaşık 1870 – 10 Eylül 1933), Aralık 1931'den ölümüne kadar Qalat Hanı olan Mir Azam Jan Han (yaklaşık 1870 – 10 Eylül 1933) hakkında İngilizce makale: babası Huddadad Han'ın 1893'te tahttan indirilmesiyle tahtı reddetmesi ve sürgüne katılışı, kardeşi Mahmud Han adına Makran yönetimi, kardeşinin hastalığı sırasında Qalat'ı yönetmesi, zorla çalıştırmanın kaldırılması ve 26 Nisan 1932'de Kuveyt'e resmi olarak atanması."
  id: "Artikel bahasa Inggris tentang Mir Azam Jan Khan (sekitar 1870 – 10 September 1933), Khan Qalat dari Desember 1931 hingga kematiannya: penolakannya terhadap tahta setelah ayahnya Khuddadad Khan digulingkan pada tahun 1893 dan partisipasinya dalam pengasingan, pemerintahannya di Makran atas nama saudaranya Mahmud Khan, administrasi Qalat selama saudaranya sakit, penghapusan kerja paksa, dan pelantikannya secara resmi di Kuwait pada 26 April 1932."
