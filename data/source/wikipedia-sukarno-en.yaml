summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سوكارنو؛ تُستخدم لوقائع الكيان فقط. تروي مولده باسم كوسنو سوسروديهاردجو في 6 يونيو 1901 في سورابايا لأب مسلم جاوي وأم هندوسية بالية من طبقة البراهمة، وتأسيسه الحزب الوطني الإندونيسي، وإعلانه استقلال إندونيسيا سنة 1945 ورئاسته حتى عزله سنة 1967، ووفاته في جاكرتا في 21 يونيو 1970، وتذكر أبناءه الأربعة عشر ومنهم ميجاواتي."
  en: "English Wikipedia article on Sukarno; used for entity facts only. It recounts his birth as Kusno Sosrodihardjo on 6 June 1901 at Surabaya to a Muslim Javanese father and a Hindu Balinese mother of the Brahmin caste, his founding of the Indonesian National Party, his proclamation of Indonesian independence in 1945 and presidency until his removal in 1967, and his death at Jakarta on 21 June 1970; its infobox lists fourteen children including Megawati."
