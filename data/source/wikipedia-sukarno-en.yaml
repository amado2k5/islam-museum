summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن سوكارنو؛ تُستخدم لوقائع الكيان فقط. تروي مولده باسم كوسنو سوسروديهاردجو في 6 يونيو 1901 في سورابايا لأب مسلم جاوي وأم هندوسية بالية من طبقة البراهمة، وتأسيسه الحزب الوطني الإندونيسي، وإعلانه استقلال إندونيسيا سنة 1945 ورئاسته حتى عزله سنة 1967، ووفاته في جاكرتا في 21 يونيو 1970، وتذكر أبناءه الأربعة عشر ومنهم ميجاواتي."
  en: "English Wikipedia article on Sukarno; used for entity facts only. It recounts his birth as Kusno Sosrodihardjo on 6 June 1901 at Surabaya to a Muslim Javanese father and a Hindu Balinese mother of the Brahmin caste, his founding of the Indonesian National Party, his proclamation of Indonesian independence in 1945 and presidency until his removal in 1967, and his death at Jakarta on 21 June 1970; its infobox lists fourteen children including Megawati."
  es: "Artículo de la Wikipedia en inglés sobre Sukarno; utilizado únicamente para datos sobre la persona. Relata su nacimiento como Kusno Sosrodihardjo el 6 de junio de 1901 en Surabaya, hijo de un padre musulmán javanés y una madre hindú balinesa de la casta brahmán; la fundación del Partido Nacional Indonesio; la proclamación de la independencia de Indonesia en 1945 y su presidencia hasta su destitución en 1967; y su muerte en Yakarta el 21 de junio de 1970. Su ficha informativa enumera catorce hijos, entre ellos Megawati."
  fr: "Article de Wikipédia en anglais sur Sukarno; utilisé uniquement pour les informations sur l'entité. Il relate sa naissance sous le nom de Kusno Sosrodihardjo le 6 juin 1901 à Surabaya, d'un père javanais musulman et d'une mère balinaise hindoue de caste brahmane, la fondation du Parti national indonésien, la proclamation de l'indépendance de l'Indonésie en 1945 et la présidence jusqu'à sa destitution en 1967, et sa mort à Jakarta le 21 juin 1970; son infobox mentionne quatorze enfants, dont Megawati."
