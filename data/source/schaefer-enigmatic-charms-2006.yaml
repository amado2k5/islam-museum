summary:
  ar: "كتاب كارل شيفر الجامع للمطبوعات العربية الوسيطة في المكتبات الأمريكية والأوروبية: يحصر أكثر من مئة مطبوع طرش، يصف أشكالها وخطوطها وزخارفها، ويسجل الشهادات النصية من ابن النديم إلى الجوبري ونهاية الصنعة في القرن الخامس عشر."
  en: "Karl R. Schaefer's monograph cataloguing the medieval Arabic block-printed amulets in American and European collections: registers over a hundred tarsh prints, describes their formats, scripts and ornament, records the textual witnesses from Ibn al-Nadim to al-Jawbari, and the craft's disappearance in the fifteenth century."
  es: "La monografía de Karl R. Schaefer, que cataloga los amuletos árabes medievales impresos con bloques de madera en colecciones americanas y europeas, registra más de cien impresiones tarsh, describe sus formatos, escrituras y ornamentación, recoge los testimonios textuales desde Ibn al-Nadim hasta al-Jawbari y la desaparición de este oficio en el siglo XV."
  fr: "La monographie de Karl R. Schaefer, qui catalogue les amulettes arabes médiévales imprimées sur blocs dans les collections américaines et européennes: recense plus d'une centaine d'estampes tarsh, décrit leurs formats, leurs écritures et leurs ornements, enregistre les témoins textuels d'Ibn al-Nadim à al-Jawbari, et la disparition de cet artisanat au XVe siècle."
title: "Enigmatic Charms: Medieval Arabic Block Printed Amulets in American and European Libraries and Museums"
