summary:
  ar: "سيرة مرسيس كوميس لأبي الصلت الأكبر ⁦(نحو 1068–1134م)⁩ في معجم سبرنغر لرواد الفلك: دراسته في الإسكندرية والقاهرة في ظل الدولة الفاطمية، وسجنه عند الأفضل، وإقامة المهدية وبجاية، ومؤلفاته الفلكية ومنها رسالة الأسطرلاب و«صفة عمل صفيحة جامعة»."
  en: "Mercè Comes's BEA biography of the Elder Abu al-Salt (c. 1068–1134): his study and service in Fatimid Alexandria and Cairo, imprisonment under al-Afdal, residence at Mahdiyya and Béjaïa, and his astronomical works including the astrolabe treatise and the 'Description of the construction and use of a single plate'."
  ur: "مرسہ کامس کی BEA سوانح میں ابو الصلت الاکبر ⁦(تقریباً 1068–1134ء)⁩: فاطمی اسکندریہ و قاہرہ میں تعلیم و ملازمت، الافضل کے قید، مہدیہ اور بجایہ کی قیامگاہ، اور فلکی تصانیف جن میں اسطرلابی رسالہ اور «صفت عمل صفیحہ جامعہ» شامل ہیں۔"
  es: "La biografía de Mercè Comes sobre Abu al-Salt el Viejo (c. 1068–1134), publicada por la BEA: sus estudios y servicio en la Alejandría fatimí y El Cairo, su encarcelamiento bajo al-Afdal, su residencia en Mahdiyya y Béjaïa, y sus obras astronómicas, incluyendo el tratado sobre el astrolabio y la «Descripción de la construcción y el uso de una sola placa»."
  fr: "Biographie de Mercè Comes pour la BEA de l'Ancien Abu al-Salt (vers 1068-1134): ses études et son service dans l'Alexandrie fatimide et le Caire, son emprisonnement sous al-Afdal, sa résidence à Mahdiyya et Béjaïa, et ses œuvres astronomiques, y compris le traité sur l'astrolabe et la « Description de la construction et de l'utilisation d'une seule plaque »."
  tr: "Springer'in Astronomlar Sözlüğü'nde Abu al-Salt al-Akbar tarafından (yaklaşık 1068–1134 MS) Mersis Comis biyografisi: Fatımi devleti altında İskenderiye ve Kahire'deki çalışmaları, en iyi yerde hapsedilmesi, Mehdia ve Bejaia'nın kurulması ve Astrolab İnceleme ile 'Kapsamlı Bir Levhanın Çalışmasının Tanımı' gibi astronomik eserleri."
  id: "Biografi Mersis Comis oleh Abu al-Salt al-Akbar (sekitar 1068–1134 M) dalam Kamus Astronom Springer: studinya di Alexandria dan Kairo di bawah negara Fatimiyah, penahanannya di tempat terbaik, pendirian Mahdia dan Bejaia, serta karya astronominya termasuk Risalah Astrolabe dan 'Deskripsi Karya Lempeng Komprehensif.'"
