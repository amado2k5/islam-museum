reliability_note: "Complete biography page read in full on the ISMI host, which reproduces the Springer BEA entry verbatim with author byline and DOI 10.1007/978-0-387-30400-7_12. Facts used: birth c. 1068 Denia, death 23 October 1134 Béjaïa; study under al-Waqqashi; arrival Alexandria 1096; imprisonment 1107/1108–1111/1112; Mahdiyya from 1112/1113; works list including Risala fi al-'amal bi-l-asturlab and Sifat 'amal safiha jami'a taqawwama bi-ha jami' al-kawakib al-sab'a, described as the last of three known Andalusian equatoria and a possible link to eastern equatoria (al-Khazin). Comes calls him 'accomplished, though not innovative' — an expert assessment kept distinct from the museum's bounded record."
