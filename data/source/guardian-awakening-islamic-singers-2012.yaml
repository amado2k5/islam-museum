  ar: "تقرير عمر شهيد في الغارديان ⁦(13 أبريل 2012)⁩ عن شركة أوايكننغ: بدأت بنشر الكتب، ومكتبها الرئيس في المملكة المتحدة في سوانزي، وشعارها «مستلهم من الإيمان وقائم على القيم»، ووقعت مع سامي يوسف أول فنانيها سنة 2003، وخلافه معها سنة 2008، ثم ماهر زين، وحفلة أبولو هامرسميث لمنظمة أنقذ يتيما؛ مع أقوال الشريك المؤسس ولي الرحمن."
  en: "Omar Shahid's report in The Guardian of 13 April 2012 on Awakening: it began by publishing books, its UK head office is in Swansea, its slogan is 'faith-inspired and value-driven', it signed its first artist, Sami Yusuf, in 2003, he left after a 2008 dispute over his third album, it then signed Maher Zain, and it staged a Hammersmith Apollo concert for Save an Orphan; with statements by the co-founder Wali-ur Rahman."
