summary:
  ar: "مقالة ويكيبيديا الفارسية «ميرزا كوجك خان جنگلي»؛ تُستخدم لوقائع الكيان فقط. تعطي اسمه يونس أستادسرايي وميلاده في رشت في 21 مهر 1259 شمسية في أسرة متدينة، ودراسته الحوزوية في رشت وقزوين وطهران دون دخوله سلك رجال الدين، وهيئة اتحاد الإسلام، ومسير جمهورية گيلان، ووفاته في 11 آذر 1300 شمسية في مرتفعات ماسال بطالش."
  en: "Persian Wikipedia article 'Mirza Kuchik Khan Jangali'; used for entity facts only. It gives his name as Yunes Ostadsarai, his birth at Rasht on 21 Mehr 1259 Solar Hijri into a religious family, his seminary studies at Rasht, Qazvin and Tehran without his entering the clergy, the Committee of Islamic Union, the course of the Gilan republic, and his death on 11 Azar 1300 Solar Hijri in the Masal highlands of Talesh."
