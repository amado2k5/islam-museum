summary:
  ar: "مقالة ويكيبيديا الفارسية «ميرزا كوجك خان جنگلي»؛ تُستخدم لوقائع الكيان فقط. تعطي اسمه يونس أستادسرايي وميلاده في رشت في 21 مهر 1259 شمسية في أسرة متدينة، ودراسته الحوزوية في رشت وقزوين وطهران دون دخوله سلك رجال الدين، وهيئة اتحاد الإسلام، ومسير جمهورية گيلان، ووفاته في 11 آذر 1300 شمسية في مرتفعات ماسال بطالش."
  en: "Persian Wikipedia article 'Mirza Kuchik Khan Jangali'; used for entity facts only. It gives his name as Yunes Ostadsarai, his birth at Rasht on 21 Mehr 1259 Solar Hijri into a religious family, his seminary studies at Rasht, Qazvin and Tehran without his entering the clergy, the Committee of Islamic Union, the course of the Gilan republic, and his death on 11 Azar 1300 Solar Hijri in the Masal highlands of Talesh."
  es: "Artículo de Wikipedia en persa titulado \"Mirza Kuchik Khan Jangali\"; utilizado únicamente para datos sobre la persona. Indica que su nombre era Yunes Ostadsarai, que nació en Rasht el 21 de Mehr de 1259 del calendario islámico en el seno de una familia religiosa, que realizó estudios en seminarios de Rasht, Qazvin y Teherán sin ingresar al clero, que formó parte del Comité de la Unión Islámica, que participó en la creación de la república de Gilan y que falleció el 11 de Azar de 1300 del calendario islámico en las tierras altas de Masal, en Talesh."
  fr: "L'article Wikipédia persan « Mirza Kuchik Khan Jangali » (utilisé uniquement pour les informations biographiques) indique son nom: Yunes Ostadsarai. Il mentionne sa naissance à Rasht le 21 Mehr 1259 de l'Hégire solaire, au sein d'une famille religieuse, ses études au séminaire à Rasht, Qazvin et Téhéran sans qu'il n'entre dans les ordres, son appartenance au Comité de l'Union islamique, son rôle dans la république de Gilan et sa mort le 11 Azar 1300 de l'Hégire solaire, dans les hautes terres de Masal, à Talesh."
  ur: "فارسی ویکیپیڈیا مضمون 'مرزا کوچیک خان جنگلی'؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں ان کا نام یونس اوستادسرائے رکھا گیا ہے، ان کی پیدائش 21 مہر 1259 شمسی ہجری کو رشت میں ایک مذہبی گھرانے میں ہوئی، ان کی مدرسہ رشت، قزوین اور تہران میں ان کے پادریوں میں داخلے کے بغیر، اسلامی یونین کی کمیٹی، جمہوریہ گیلان کے کورس میں، اور ان کی وفات 11 آذر ہجری سنہ 130 ہجری کو ہوئی۔"
