  ar: "مقالة ويكيبيديا الإنجليزية عن محمد طلعت باشا؛ تُستخدم لوقائع الكيان فقط. تروي صعوده في جمعية الاتحاد والترقي ونظارته للداخلية وصدره الأعظم 1917–1918 ودوره في ترحيل الأرمن سنة 1915 وفراره إلى برلين واغتياله سنة 1921 وإعادة دفنه في إسطنبول سنة 1943، وتذكر في متنها أنه كان عضوًا في الطريقة البكتاشية."
  en: "English Wikipedia article on Mehmed Talat Pasha; used for entity facts only. It recounts his rise in the Committee of Union and Progress, his interior ministry, his grand vizierate of 1917–1918, his role in the 1915 deportations of the Armenians, his flight to Berlin, his assassination in 1921 and his reburial at Istanbul in 1943, and states in its text that he was a member of the Bektashi order."
