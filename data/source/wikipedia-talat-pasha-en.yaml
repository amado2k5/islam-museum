reliability_note: "Pointer for entity facts only (Wikipedia rule, AGENTS.md): a fact is used only where the article cites a source for it. Read in full on 26 October 2026 and re-fetched by the recorded revision id with content verified identical. It gives him born on 1 September 1874 at Kırcaali (Kardzhali), of Romani, Turkish and Pomak descent, a postal clerk at Adrianople and Salonika, a founder of the Ottoman Freedom Committee whose merger made Salonika the CUP's internal centre, deputy for Adrianople in 1908, minister of the interior, and grand vizier from 4 February 1917 to 8 October 1918. On 24 April 1915 he ordered the closure of Armenian political organisations and the arrest of Armenian leaders, and he issued the Tehcir (deportation) order of 1915; the article calls the deportations a principal means of carrying out what is now recognised as a genocide against the Armenians, and in its Legacy section says he is widely considered one of the main architects of the Armenian Genocide by historians. He fled to Berlin on 1–2 November 1918, was sentenced to death in absentia by the Istanbul court-martial, was shot dead in Berlin on 15 March 1921 by Soghomon Tehlirian, and was reburied at the Monument of Liberty, Istanbul, with a state funeral on 25 February 1943. Its infobox has no religion field and its categories make no religious filing for him; its text states that he was a member of the Bektashi order, citing Kieser (2018, p. 44) and Hanioğlu's TDV İslâm Ansiklopedisi entry."
