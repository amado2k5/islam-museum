summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد طلعت باشا؛ تُستخدم لوقائع الكيان فقط. تروي صعوده في جمعية الاتحاد والترقي ونظارته للداخلية وصدره الأعظم 1917–1918 ودوره في ترحيل الأرمن سنة 1915 وفراره إلى برلين واغتياله سنة 1921 وإعادة دفنه في إسطنبول سنة 1943، وتذكر في متنها أنه كان عضوًا في الطريقة البكتاشية."
  en: "English Wikipedia article on Mehmed Talat Pasha; used for entity facts only. It recounts his rise in the Committee of Union and Progress, his interior ministry, his grand vizierate of 1917–1918, his role in the 1915 deportations of the Armenians, his flight to Berlin, his assassination in 1921 and his reburial at Istanbul in 1943, and states in its text that he was a member of the Bektashi order."
  es: "Artículo de la Wikipedia en inglés sobre Mehmed Talat Pasha; utilizado únicamente para datos sobre la persona. Relata su ascenso en el Comité de Unión y Progreso, su ministerio del interior, su gran visirismo de 1917 a 1918, su papel en las deportaciones de armenios de 1915, su huida a Berlín, su asesinato en 1921 y su reinhumación en Estambul en 1943, y afirma en su texto que fue miembro de la orden Bektashi."
  fr: "Article de Wikipédia en anglais sur Mehmed Talat Pacha; utilisé uniquement pour les informations sur l’entité. Il relate son ascension au sein du Comité Union et Progrès, son ministère de l’Intérieur, son grand vizirat de 1917 à 1918, son rôle dans les déportations arméniennes de 1915, sa fuite à Berlin, son assassinat en 1921 et sa réinhumation à Istanbul en 1943, et précise qu’il était membre de l’ordre des Bektashis."
  ur: "محمد طلعت پاشا پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں یونین اینڈ پروگریس کی کمیٹی میں ان کے عروج، ان کی وزارت داخلہ، 1917-1918 کے ان کے عظیم وزیر، آرمینیائی باشندوں کی 1915 میں جلاوطنی میں ان کے کردار، برلن کے لیے ان کی پرواز، 1921 میں ان کا قتل اور 1943 میں استنبول میں ان کی دوبارہ تدفین کا ذکر ہے، اور وہ اس کے حکم کے متن میں ریاست کا رکن تھا۔"
