  ar: "مقالة ويكيبيديا الإنجليزية عن ويلفريد زاها؛ تُستخدم لوقائع الكيان فقط. تروي مسيرة الجناح المولود في 10 نوفمبر 1992 بأبيدجان: نشأته في إنجلترا، وكريستال بالاس ومانشستر يونايتد وعودته إلى بالاس هدّافًا تاريخيًا له في الدوري الإنجليزي، وغلطة سراي وتشارلوت، ومباراتيه مع إنجلترا ثم اختياره ساحل العاج. لا تذكر ديانته في أي موضع."
  en: "English Wikipedia article on Wilfried Zaha; used for entity facts only. It records the winger born 10 November 1992 at Abidjan: raised in England, Crystal Palace, Manchester United, his return to Palace as the club's record Premier League scorer, Galatasaray and Charlotte FC, two England caps and his switch to Ivory Coast. It makes no statement of his religion anywhere."
