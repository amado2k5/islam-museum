summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن ويلفريد زاها؛ تُستخدم لوقائع الكيان فقط. تروي مسيرة الجناح المولود في 10 نوفمبر 1992 بأبيدجان: نشأته في إنجلترا، وكريستال بالاس ومانشستر يونايتد وعودته إلى بالاس هدّافًا تاريخيًا له في الدوري الإنجليزي، وغلطة سراي وتشارلوت، ومباراتيه مع إنجلترا ثم اختياره ساحل العاج. لا تذكر ديانته في أي موضع."
  en: "English Wikipedia article on Wilfried Zaha; used for entity facts only. It records the winger born 10 November 1992 at Abidjan: raised in England, Crystal Palace, Manchester United, his return to Palace as the club's record Premier League scorer, Galatasaray and Charlotte FC, two England caps and his switch to Ivory Coast. It makes no statement of his religion anywhere."
  es: "Artículo de la Wikipedia en inglés sobre Wilfried Zaha; utilizado únicamente para datos sobre la persona. Describe al extremo nacido el 10 de noviembre de 1992 en Abiyán: criado en Inglaterra, Crystal Palace, Manchester United, su regreso al Palace como máximo goleador histórico del club en la Premier League, Galatasaray y Charlotte FC, dos internacionalidades con Inglaterra y su fichaje por Costa de Marfil. No menciona su religión en ningún momento."
  fr: "L'article Wikipédia en anglais consacré à Wilfried Zaha, utilisé uniquement pour des informations factuelles, retrace son parcours. Cet ailier, né le 10 novembre 1992 à Abidjan, a grandi en Angleterre, a évolué à Crystal Palace, à Manchester United, puis est retourné à Palace en tant que meilleur buteur de l'histoire du club en Premier League. Il a également joué pour Galatasaray et Charlotte FC, a été sélectionné à deux reprises en équipe d'Angleterre et a rejoint la Côte d'Ivoire. Sa religion n'est mentionnée nulle part."
  ur: "ولفریڈ زاہا پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں 10 نومبر 1992 کو عابدجان میں پیدا ہونے والے ونگر کو ریکارڈ کیا گیا ہے: انگلینڈ، کرسٹل پیلس، مانچسٹر یونائیٹڈ میں پرورش پائی، کلب کے ریکارڈ پریمیئر لیگ اسکورر کے طور پر محل میں اس کی واپسی، گالاتسرے اور شارلٹ ایف سی، دو انگلینڈ کیپس اور آئیوری کوسٹ میں اس کا سوئچ۔ اس میں کہیں بھی اپنے مذہب کا بیان نہیں ہے۔"
  tr: "Wilfried Zaha hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 10 Kasım 1992'de Abidjan'da doğan kanat oyuncusunun yolculuğunu anlatır: İngiltere, Crystal Palace ve Manchester United'da yetiştirilme tarzı, İngiltere Premier Ligi'nde tarihi golcü oyuncu olarak Palace'a dönüşü, Galatasaray ve Charlotte, İngiltere ile maçları ve ardından Fildişi Sahili'ni seçmesi. Dini hiçbir yerde bahsedilmez."
  id: "Artikel Wikipedia bahasa Inggris tentang Wilfried Zaha; digunakan hanya untuk fakta entitas tersebut. Artikel ini menceritakan perjalanan winger yang lahir pada 10 November 1992 di Abidjan: masa kecilnya di Inggris, Crystal Palace dan Manchester United, kembalinya ke Palace sebagai pencetak gol terbanyak bersejarah mereka di Liga Premier Inggris, Galatasaray dan Charlotte, pertandingannya melawan Inggris, dan kemudian pilihannya memilih Pantai Gading. Agamanya tidak disebutkan di mana pun."
