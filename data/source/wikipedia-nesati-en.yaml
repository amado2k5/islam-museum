reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). It states in prose that he was a Sufi of the Mevlevi Order, a disciple of the shaykh Ağazâde Mehmed Dede at Gelibolu and then Beşiktaş, that he served at Rumi's tomb in Konya and returned about 1670 to Edirne as shaykh of the Murâdiyye Mevlevîhâne, dying in 1674 — one of the three independent texts behind the person record's sufi settlement. The majority of sources give his real name as Ahmed, one source claiming Süleyman; his birth year is unknown and is speculated about 1600 from his poem on the frozen Bosphorus winter of 1621–22. Checked 1 November 2026."
