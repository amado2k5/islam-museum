summary:
  ar: "مدخل «حماية» في موسوعة TDV الإسلامية: مؤسسة الحماية عند عرب الجاهلية — حامي الحميى وحفير القوم وحق المرور وحمى القوافل والتجار في الطرق والأعياد، والحلف على حماية المظلوم ⁦(حلف الفضول)⁩، وحماية أبي طالب ومعتصم بن عدي للنبي وحماية ابن الدغنة لأبي بكر، ومصطلحات الإيمان والأمان والذمة المجاورة."
  en: "The TDV İslâm Ansiklopedisi entry on himaye (protection): the protection institution of Jahiliyya Arabia — the hâmi'l-humeyyâ and the hafîr, the hakku'l-mürûr toll paid for caravan escort, the rivalry for protection as a measure of tribal honour, the pacts sworn to protect the wronged (Hilf al-Fudul), Abu Talib's and Mut'im ibn Adi's protection of the Prophet and Ibn al-Dughunna's of Abu Bakr, and the neighbouring terms of aman, civar, hafare and zimmet."
  es: "La entrada de TDV İslâm Ansiklopedisi sobre himaye (protección): la institución de protección de la Arabia Jahiliyya: el hâmi'l-humeyyâ y el hafîr, el peaje hakku'l-mürûr pagado por la escolta de caravanas, la rivalidad por la protección como medida de honor tribal, los pactos jurados para proteger a los agraviados (Hilf al-Fudul), la protección de Abu Talib y Mut'im ibn Adi al Profeta y la de Ibn al-Dughunna a Abu Bakr, y los términos vecinos de aman, civar, hafare y zimmet."
