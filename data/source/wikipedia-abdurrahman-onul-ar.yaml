summary:
  ar: "مقالة ويكيبيديا العربية عن عبد الرحمن أونول؛ تُستخدم لوقائع الكيان فقط. تسجّل ميلاده في 1 ديسمبر 1973 في بايبورت وجنسيته التركية، وتصفه بأنه منشد تركي اشتهر بإنشادته المعروفة."
  en: "Arabic Wikipedia article on Abdurrahman Önül; used for entity facts only. It records his birth on 1 December 1973 in Bayburt and his Turkish citizenship, and describes him as a Turkish munshid known for a well-known nasheed performance."
  es: "Artículo de Wikipedia en árabe sobre Abdurrahman Önül; utilizado únicamente para datos sobre la persona. En él se registra su nacimiento el 1 de diciembre de 1973 en Bayburt y su ciudadanía turca, y se le describe como un munshid turco conocido por una destacada interpretación de nasheed."
  fr: "Article de Wikipédia en arabe sur Abdurrahman Önül; utilisé uniquement pour les informations relatives à l’entité. Il mentionne sa naissance le 1er décembre 1973 à Bayburt et sa nationalité turque, et le décrit comme un munshid turc connu pour une interprétation de nasheed très appréciée."
  ur: "عبدالرحمن اونول پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ اس میں یکم دسمبر 1973 کو ان کی پیدائش اور ان کی ترک شہریت کو ریکارڈ کیا گیا ہے، اور اسے ایک ترک منشد کے طور پر بیان کیا گیا ہے جو معروف نشید کارکردگی کے لیے جانا جاتا ہے۔"
  tr: "Abdul Rahman Önül hakkında Arapça Vikipedi makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 1 Aralık 1973'te Bayport'ta doğduğu ve Türk vatandaşlığına sahip olduğu kaydedilmiştir; ünlü ilahisiyle ünlü bir Türk ilahisi olarak tanımlanmıştır."
  id: "Artikel Wikipedia bahasa Arab tentang Abdul Rahman Önül; digunakan hanya untuk fakta entitas. Ia tercatat lahir pada 1 Desember 1973 di Bayport dan memiliki kewarganegaraan Turki, menggambarkannya sebagai penyanyi Turki yang terkenal karena nyanyian terkenalnya."
