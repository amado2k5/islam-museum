summary:
  ar: "مقالة ويكيبيديا العربية عن محمد جواد ظريف؛ تُستخدم لوقائع الكيان فقط. تعطي ولادته في 7 كانون الثاني 1960 في طهران، وتلخّص مناصبه: نائب وزير الخارجية، وممثل إيران الدائم لدى الأمم المتحدة 2002–2007، ووزير خارجيتها 2013–2021."
  en: "Arabic Wikipedia article on Mohammad Javad Zarif; used for entity facts only. It gives his birth on 7 January 1960 in Tehran and summarises his posts: deputy foreign minister, permanent representative to the United Nations 2002–2007, and foreign minister 2013–2021."
  es: "Artículo de Wikipedia en árabe sobre Mohammad Javad Zarif; utilizado únicamente para datos sobre la persona. Indica que nació el 7 de enero de 1960 en Teherán y resume sus cargos: viceministro de Asuntos Exteriores, representante permanente ante las Naciones Unidas (2002-2007) y ministro de Asuntos Exteriores (2013-2021)."
  fr: "Article de Wikipédia en arabe sur Mohammad Javad Zarif; utilisé uniquement à des fins d’information sur l’entité. Il indique sa date de naissance, le 7 janvier 1960 à Téhéran, et résume ses fonctions: vice-ministre des Affaires étrangères, représentant permanent auprès des Nations Unies de 2002 à 2007, et ministre des Affaires étrangères de 2013 à 2021."
  ur: "محمد جواد ظریف پر عربی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 7 جنوری 1960 کو تہران میں ان کی پیدائش کرتا ہے اور ان کے عہدوں کا خلاصہ کرتا ہے: نائب وزیر خارجہ، اقوام متحدہ میں مستقل نمائندہ 2002-2007، اور وزیر خارجہ 2013-2021۔"
  tr: "Muhammed Cevad Zarif hakkında Arapça Vikipedi makalesi; yalnızca kurumun gerçekleri için kullanılmıştır. 7 Ocak 1960'ta Tahran'da doğdu ve görevlerini özetlemektedir: Dışişleri Bakan Yardımcısı, İran'ın Birleşmiş Milletler Daimi Temsilcisi 2002–2007 ve 2013–2021 Dışişleri Bakanı."
  id: "Artikel Wikipedia bahasa Arab tentang Mohammad Javad Zarif; digunakan hanya untuk fakta entitas. Ia lahir pada 7 Januari 1960 di Teheran, dan merangkum posisinya: Wakil Menteri Luar Negeri, Perwakilan Tetap Iran untuk Perserikatan Bangsa-Bangsa 2002–2007, dan Menteri Luar Negeri 2013–2021."
