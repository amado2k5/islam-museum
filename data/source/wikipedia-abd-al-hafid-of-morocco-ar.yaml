  ar: "مقالة ويكيبيديا العربية عن عبد الحفيظ بن الحسن العلوي ⁦(24 فبراير 1876 بفاس – 4 أبريل 1937 بفرنسا)⁩؛ تسرد تعليمه وإجازة ماء العينين له سنة 1904 وخلافته بمراكش وتنازله بعد معاهدة فاس ومؤلفاته، وتصنيفها يضعه في وفيات 1356هـ وفي «سلفيون مغاربة»."
  en: "The Arabic Wikipedia article on Abd al-Hafid of Morocco (24 February 1876 at Fez – 4 April 1937 in France), covering his education, the ijaza he received from Ma al-Aynayn in 1904, his governorship of Marrakesh, his abdication after the Treaty of Fes and his writings; its classification places his death in 1356 AH and files him under Moroccan Salafis."
  es: "El artículo de la Wikipedia en árabe sobre Abd al-Hafid de Marruecos (24 de febrero de 1876 en Fez – 4 de abril de 1937 en Francia), que abarca su educación, la ijaza que recibió de Ma al-Aynayn en 1904, su gobierno de Marrakech, su abdicación tras el Tratado de Fez y sus escritos; su clasificación sitúa su muerte en 1356 AH y lo incluye entre los salafistas marroquíes."
  fr: "L'article de Wikipédia en arabe sur Abd al-Hafid du Maroc (24 février 1876 à Fès – 4 avril 1937 en France), couvrant son éducation, l'ijaza qu'il a reçue de Ma al-Aynayn en 1904, son gouvernement de Marrakech, son abdication après le traité de Fès et ses écrits; sa classification situe sa mort en 1356 AH et le classe parmi les salafistes marocains."
