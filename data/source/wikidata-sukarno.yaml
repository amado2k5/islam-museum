summary:
  ar: "عنصر ويكيداتا Q76127 لسوكارنو: التواريخ والمعرفات؛ يعطي ميلاده في 6 يونيو 1901 في سورابايا ووفاته في 21 يونيو 1970 في جاكرتا، ووالديه سوكيمي سوسروديهاردجو وإيدا أيو نيومان راي، وأبناءه ومنهم ميجاواتي سوكارنوبوتري، ودينه «الإسلام» عموما دون مدرسة."
  en: "Wikidata item Q76127 for Sukarno: dates and identifiers; it gives his birth on 6 June 1901 at Surabaya and his death on 21 June 1970 at Jakarta, his father Soekemi Sosrodihardjo and mother Ida Ayu Nyoman Rai, and his children including Megawati Sukarnoputri (Q76179). Its religion claim is Islam (Q432) generically; it names no school."
  es: "Elemento de Wikidata Q76127 para Sukarno: fechas e identificadores; indica su nacimiento el 6 de junio de 1901 en Surabaya y su muerte el 21 de junio de 1970 en Yakarta, su padre Soekemi Sosrodihardjo y su madre Ida Ayu Nyoman Rai, y sus hijos, incluida Megawati Sukarnoputri (Q76179). Su religión declarada es el Islam (Q432) de forma genérica; no menciona ninguna escuela."
  fr: "L'élément Wikidata Q76127 concernant Sukarno: dates et identifiants; il indique sa naissance le 6 juin 1901 à Surabaya et son décès le 21 juin 1970 à Jakarta, son père Soekemi Sosrodihardjo et sa mère Ida Ayu Nyoman Rai, ainsi que ses enfants, dont Megawati Sukarnoputri (Q76179). Sa religion est mentionnée comme étant l'islam (Q432) de manière générique; aucune école n'est précisée."
  ur: "ویکی ڈیٹا آئٹم Q76127 برائے Sukarno: تاریخیں اور شناخت کنندگان؛ اس کی پیدائش 6 جون 1901 کو سورابایا میں ہوئی اور اس کی موت 21 جون 1970 کو جکارتہ میں ہوئی، اس کے والد سوکیمی سوسروڈی ہاردجو اور والدہ ایدا ایو نیومن رائے، اور اس کے بچے بشمول میگاوتی سوکرنوپوتری (Q76179)۔ اس کے مذہب کا دعویٰ اسلام ہے (Q432) عمومی طور پر؛ اس میں کسی اسکول کا نام نہیں ہے۔"
