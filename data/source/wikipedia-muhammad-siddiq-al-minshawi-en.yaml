  ar: "مقالة ويكيبيديا الإنجليزية عن محمد صديق المنشاوي؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 20 يناير 1920 في المنشاة بسوهاج، وحفظه القرآن في الثامنة، وقبوله قارئا في الإذاعة المصرية سنة 1953، ومصحفه المرتل المسجل، ووفاته في 20 يونيو 1969 في المنشاة؛ وصندوق سيرتها الدينية المضمّن يعطي طائفته سنية."
  en: "English Wikipedia article on Muhammad Siddiq al-Minshawi; used for entity facts only. It gives his birth on 20 January 1920 at El-Mansha, Sohag, his memorisation of the Qur'an by age eight, his acceptance as an Egyptian Radio reciter in 1953, his recorded murattal Qur'an and his death on 20 June 1969 at El-Mansha; its embedded religious-biography infobox gives his denomination as Sunni."
