summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن محمد صديق المنشاوي؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 20 يناير 1920 في المنشاة بسوهاج، وحفظه القرآن في الثامنة، وقبوله قارئا في الإذاعة المصرية سنة 1953، ومصحفه المرتل المسجل، ووفاته في 20 يونيو 1969 في المنشاة؛ وصندوق سيرتها الدينية المضمّن يعطي طائفته سنية."
  en: "English Wikipedia article on Muhammad Siddiq al-Minshawi; used for entity facts only. It gives his birth on 20 January 1920 at El-Mansha, Sohag, his memorisation of the Qur'an by age eight, his acceptance as an Egyptian Radio reciter in 1953, his recorded murattal Qur'an and his death on 20 June 1969 at El-Mansha; its embedded religious-biography infobox gives his denomination as Sunni."
  es: "Artículo de la Wikipedia en inglés sobre Muhammad Siddiq al-Minshawi; utilizado únicamente para datos biográficos. Indica su nacimiento el 20 de enero de 1920 en El-Mansha, Sohag, su memorización del Corán a los ocho años, su aceptación como recitador de la Radio Egipcia en 1953, su grabación del Corán en escritura murattal y su fallecimiento el 20 de junio de 1969 en El-Mansha; su ficha biográfica religiosa integrada indica que profesaba la religión sunita."
  fr: "Article de Wikipédia en anglais sur Muhammad Siddiq al-Minshawi; utilisé uniquement pour les informations le concernant. Il indique sa naissance le 20 janvier 1920 à El-Mansha, Sohag, sa mémorisation du Coran à l’âge de huit ans, son acceptation comme récitant à la radio égyptienne en 1953, son enregistrement du Coran (murattal) et sa mort le 20 juin 1969 à El-Mansha; son encadré biographique religieux intégré précise qu’il était sunnite."
  ur: "محمد صدیق المنشاوی پر انگریزی ویکیپیڈیا مضمون؛ صرف ہستی کے حقائق کے لیے استعمال کیا جاتا ہے۔ یہ 20 جنوری 1920 کو المنشا، سوہاگ میں ان کی پیدائش، آٹھ سال کی عمر میں اس کا قرآن حفظ، 1953 میں مصری ریڈیو کے قاری کے طور پر قبولیت، اس کا ریکارڈ شدہ مراتل قرآن اور 20 جون 1969 کو المنشا میں ان کی موت؛ اس کا سرایت شدہ مذہبی سوانح حیات انفو باکس اس کا فرقہ بطور سنی دیتا ہے۔"
  tr: "Muhammed Siddiq Al-Minshawi hakkında İngilizce Wikipedia makalesi; yalnızca varlığın gerçekleri için kullanılmıştır. 20 Ocak 1920'de Al-Mansha, Sohag'da doğdu, sekiz yaşında Kur'an'ı ezberledi, 1953'te Mısır Radyosu'nda okunan olarak kabul edildi, Kur'an'ını kaydetti ve 20 Haziran 1969'da Al-Mansha'da vefat etti; ve dahil edilen dini biyografi kutusunda Sünni mezhebi yer alıyor."
  id: "Artikel Wikipedia bahasa Inggris tentang Muhammad Siddiq Al-Minshawi; digunakan hanya untuk fakta entitas. Ia lahir pada 20 Januari 1920 di Al-Mansha, Sohag, menghafal Al-Qur'an pada usia delapan tahun, diterima sebagai pembaca di Radio Mesir pada tahun 1953, merekam Al-Qur'an, dan meninggal pada 20 Juni 1969 di Al-Mansha; dan kotak biografi agama yang disertakan mencantumkan sekte Sunni-nya."
