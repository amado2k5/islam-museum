summary:
  ar: "مدخل «علي عبد الواحد وافي» ⁦(1901–1992)⁩ في موسوعة TDV الإسلامية بقلم حسين يازجي: مؤسس علم الاجتماع في مصر والعالم العربي — نشأته في أم درمان، تخرجه من دار العلوم سنة 1925، دكتوراه السوربون، تدريسه علم الاجتماع في دار العلوم والأزهر وجامعة القاهرة، عربنته لتدريس علم الاجتماع، عماداته، ونحو خمسين مؤلفاً بينها كتابه عن عبقرية ابن خلدون والمقدمة من زاوية اجتماعية."
  en: "The TDV İslâm Ansiklopedisi entry 'VÂFÎ, Ali Abdülvâhid' (1901–1992) by Hüseyin Yazıcı: the founder of sociology in Egypt and the Arab world — his birth at Umm Durman, his 1925 Dar al-Ulum degree, the Sorbonne doctorate, his teaching of sociology at Dar al-Ulum, al-Azhar and Cairo University, his Arabising of sociology instruction, his deanships, and some fifty works including his book on Ibn Khaldun's genius and a sociological reading of the Muqaddima."
