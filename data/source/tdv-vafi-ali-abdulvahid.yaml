summary:
  ar: "مدخل «علي عبد الواحد وافي» ⁦(1901–1992)⁩ في موسوعة TDV الإسلامية بقلم حسين يازجي: مؤسس علم الاجتماع في مصر والعالم العربي — نشأته في أم درمان، تخرجه من دار العلوم سنة 1925، دكتوراه السوربون، تدريسه علم الاجتماع في دار العلوم والأزهر وجامعة القاهرة، عربنته لتدريس علم الاجتماع، عماداته، ونحو خمسين مؤلفاً بينها كتابه عن عبقرية ابن خلدون والمقدمة من زاوية اجتماعية."
  en: "The TDV İslâm Ansiklopedisi entry 'VÂFÎ, Ali Abdülvâhid' (1901–1992) by Hüseyin Yazıcı: the founder of sociology in Egypt and the Arab world — his birth at Umm Durman, his 1925 Dar al-Ulum degree, the Sorbonne doctorate, his teaching of sociology at Dar al-Ulum, al-Azhar and Cairo University, his Arabising of sociology instruction, his deanships, and some fifty works including his book on Ibn Khaldun's genius and a sociological reading of the Muqaddima."
  es: "La entrada de TDV İslâm Ansiklopedisi 'VÂFÎ, Ali Abdülvâhid' (1901–1992) de Hüseyin Yazıcı: el fundador de la sociología en Egipto y el mundo árabe: su nacimiento en Umm Durman, su título de Dar al-Ulum en 1925, el doctorado de la Sorbona, su enseñanza de sociología en Dar al-Ulum, al-Azhar y la Universidad de El Cairo, su arabización de la enseñanza de la sociología, sus decanatos y unas cincuenta obras, entre ellas su libro sobre el genio de Ibn Khaldun y una lectura sociológica de la Muqaddima."
  fr: "L'entrée TDV İslâm Ansiklopedisi 'VÂFÎ, Ali Abdülvâhid' (1901–1992) par Hüseyin Yazıcı: le fondateur de la sociologie en Égypte et dans le monde arabe — sa naissance à Umm Durman, son diplôme de Dar al-Ulum en 1925, son doctorat de la Sorbonne, son enseignement de la sociologie à Dar al-Ulum, à al-Azhar et à l'Université du Caire, son arabisation de l'enseignement de la sociologie, ses décanats et une cinquantaine d'ouvrages, dont son livre sur le génie d'Ibn Khaldun et une lecture sociologique de la Muqaddima."
  ur: "TDV İslâm Ansiklopedisi entry 'VÂFÎ, Ali Abdülwâhid' (1901–1992) از حسین یزیکی: مصر اور عرب دنیا میں سماجیات کے بانی - ان کی پیدائش ام درمان میں ہوئی، ان کی 1925 میں دارالعلوم کی ڈگری، دارالعلوم کی ڈگری، سوریالوجی میں ان کی تعلیم الازہر اور قاہرہ یونیورسٹی، ان کی سماجیات کی تعلیم کی عربائزنگ، ان کے ڈین شپ، اور تقریباً پچاس کام جن میں ابن خلدون کی ذہانت پر ان کی کتاب اور مقدّمہ کی سماجیات کا مطالعہ شامل ہے۔"
  tr: "'Ali Abdul Wahid Wafi'nin (1901–1992) TDV İslami Ansiklopedisi'nde Hussein Yazji'nin kaydı: Mısır ve Arap Dünyasında Sosyolojinin Kurucusu — Omdurman'daki yetiştirilme yılları, 1925'te Dar Al-Uloom'dan mezun olması, Sorbonne'dan doktorası, Dar Al-Ulum, Al-Azhar ve Kahire Üniversitesi'nde sosyoloji öğretmesi, sosyoloji öğretmek üzere Araplaştırılması, dekanlıkları ve İbn Haldun'un dehası üzerine kitabı ile sosyal açıdan giriş dahil yaklaşık elli eser."
  id: "Entri oleh 'Ali Abdul Wahid Wafi' (1901–1992) dalam Ensiklopedia Islam TDV oleh Hussein Yazji: Pendiri Sosiologi di Mesir dan Dunia Arab — Masa kecilnya di Omdurman, kelulusannya dari Dar Al-Uloom pada tahun 1925, PhD dari Sorbonne, pengajarannya dalam sosiologi di Dar Al-Ulum, Al-Azhar, dan Universitas Kairo, Arabisasinya untuk mengajar sosiologi, jabatan dekannya, dan sekitar lima puluh karya, termasuk bukunya tentang kejeniusan Ibn Khaldun dan pengantar dari perspektif sosial."
