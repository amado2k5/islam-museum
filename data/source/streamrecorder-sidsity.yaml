reliability_note: "A stream-tracking site's profile page. Its biographical paragraph (real name Sadeel; South Korean and Palestinian creator; Muslim; first went live in December 2021; over 86,000 Twitch followers; Valorant streamer) reads as machine-generated promotional copy and is used here only for the identity she publishes under, her reported background and her self-presentation as a Muslim creator — never as independent corroboration of a school or of precise biography, and its age claim is not used. The page's tracked-stream data (Valorant, Roblox, Five Nights at Freddy's 2, IRL streams from Seoul) corroborates the gaming character of her channels. Checked 24 October 2026."
