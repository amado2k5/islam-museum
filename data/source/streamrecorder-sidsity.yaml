summary:
  ar: "صفحة ملف سيدسيتي على موقع ستريم ريكوردر لتتبع بثوث تويتش؛ تذكر اسم النشر «سديل» وخلفية كورية فلسطينية وأنها مسلمة، وهي مصدر ثانوي وحيد لهذه التفاصيل."
  en: "StreamRecorder's Twitch-tracking profile page for SidSity; it gives her publishing name as Sadeel, a South Korean and Palestinian background, and describes her as Muslim. It is the only secondary source for those details."
  es: "La página de perfil de Twitch de StreamRecorder para SidSity indica que su nombre artístico es Sadeel, que tiene ascendencia surcoreana y palestina, y que es musulmana. Es la única fuente secundaria que ofrece esta información."
  fr: "La page de profil Twitch de StreamRecorder pour SidSity indique que son nom d'utilisateur est Sadeel, qu'elle est d'origine sud-coréenne et palestinienne, et qu'elle est musulmane. Il s'agit de la seule source secondaire pour ces informations."
  ur: "SidSity کے لیے StreamRecorder کا ٹویچ ٹریکنگ پروفائل صفحہ؛ یہ اس کا اشاعتی نام سادیل کے طور پر دیتا ہے، جو جنوبی کوریائی اور فلسطینی پس منظر کی ہے، اور اسے مسلمان کے طور پر بیان کرتی ہے۔ یہ ان تفصیلات کا واحد ثانوی ذریعہ ہے۔"
  tr: "Stream Recorder Twitch'teki SeedCity dosya sayfası, yayın adı \"Sadeel\"i, Koreli Filistinli kökenli olduğunu ve bunun Müslüman olduğunu takip ediyor; bu da bu detaylar için tek ikincil kaynak olmasını sağlıyor."
  id: "Halaman file SeedCity di Stream Recorder Twitch melacak nama publikasi \"Sadeel,\" yang berasal dari latar belakang Korea-Palestina, dan bahwa Sadeel adalah Muslim, menjadikannya satu-satunya sumber sekunder untuk detail tersebut."
