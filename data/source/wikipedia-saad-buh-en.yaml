reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision, resting on Paul Marty, Études sur l'Islam au Sénégal (1917), Lucy Behrman, Muslim Brotherhoods and Politics in Senegal (1970), and David Robinson, Paths of Accommodation (2000). It calls him a 'Qadiriyyah, Fadiliyya Sufi', describes his settlement in the Trarza in the 1870s, his following at Saint-Louis, his rescues of the explorers Soleillet, Blanchet and Fabert, his fifty years of dealings with the French administration, and his letter of counsel to his brother Ma al-'Aynayn urging him not to wage war on the French — dated 1910 here, where the French article dates the Nasiha to 1906. It gives no birth or death dates."
