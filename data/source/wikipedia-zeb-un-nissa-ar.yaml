reliability_note: "Pointer for entity facts only (AGENTS.md, Wikipedia rule of 26 Oct 2026). A short article. It gives her birth on 15 February 1638 at Daulatabad and her death on 26 May 1702 at Delhi, describes her as a poet, calligrapher and memoriser of the Quran who knew Arabic and Persian, and lists her works — Zeb-ul-Monsha'at, her Diwan, and the Zeb-ul-Tafasir, noting the claim that hers is the only Quran commentary written by a woman. It pairs her life with the Hijri years 1048–1113 while itself noting a 1047 birth reading; neither Hijri year is built in the person record. Checked 1 November 2026."
