reliability_note: "Platform statistics aggregator, not a museum-verified fact: the figure of 4,170,000 subscribers (1,071,425,329 total views, 34,207 videos) was read from vidIQ on 5 November 2026 and is used only as a dated audience figure. The page also records that the channel was created on 4 December 2009, that its channel country is set to India, and that every one of its five most-viewed videos is a lecture by Adv. Faiz Syed. vidIQ's estimated earnings are modelled and are not used. Faiz Syed's own website gives a slightly different figure (4.23 million subscribers, as of September 2026); the vidIQ figure is the later, independently aggregated one and is the one carried in the record."
