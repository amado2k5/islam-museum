  en: "Kamāl ud-Dīn Behzād — English Wikipedia"
summary:
  ar: "مقالة ويكيبيديا الإنجليزية عن كمال الدين بهزاد؛ تعطي مولده بين 1455 و1460 في هراة ووفاته سنة 1535 في هراة ودفنه تحت جبل كوه مختار، وتروي تربّيه عند ميرك نقاش ورئاسته لورش هراة سنة 1486 وعمله عند الشاه إسماعيل وابنه طهماسب في تبريز."
  en: "English Wikipedia article on Kamal al-Din Behzad; it gives his birth between 1455 and 1460 at Herat, his death in 1535 at Herat and burial beneath Koh-i Mukhtar, and recounts his upbringing by Mirak Naqqash, his headship of the Herat ateliers in 1486, and his service under Shah Ismail and Shah Tahmasp at Tabriz."
  es: "Artículo de la Wikipedia en inglés sobre Kamal al-Din Behzad; en él se indica su nacimiento entre 1455 y 1460 en Herat, su muerte en 1535 en Herat y su entierro bajo Koh-i Mukhtar, y se relata su crianza por Mirak Naqqash, su dirección de los talleres de Herat en 1486 y su servicio bajo el Shah Ismail y el Shah Tahmasp en Tabriz."
  fr: "L'article de Wikipédia en anglais sur Kamal al-Din Behzad indique sa naissance entre 1455 et 1460 à Hérat, sa mort en 1535 à Hérat et son enterrement sous Koh-i Mukhtar, et relate son éducation par Mirak Naqqash, sa direction des ateliers de Hérat en 1486 et son service sous le Shah Ismail et le Shah Tahmasp à Tabriz."
  ur: "کمال الدین بہزاد پر انگریزی ویکیپیڈیا مضمون؛ اس میں ان کی پیدائش 1455 اور 1460 کے درمیان ہرات میں، اس کی موت 1535 میں ہرات میں اور کوہ مختار کے نیچے دفن ہوئی، اور میرک نقاش کے ذریعہ ان کی پرورش، 1486 میں ہرات کے اٹیلیرز کی سربراہی، اور تبری میں شاہ اسماعیل اور شاہ طہماسپ کے ماتحت ان کی خدمات کا ذکر ہے۔"
