  ar: "مقالة ويكيبيديا الإنجليزية عن كمال الدين بهزاد؛ تعطي مولده بين 1455 و1460 في هراة ووفاته سنة 1535 في هراة ودفنه تحت جبل كوه مختار، وتروي تربّيه عند ميرك نقاش ورئاسته لورش هراة سنة 1486 وعمله عند الشاه إسماعيل وابنه طهماسب في تبريز."
  en: "English Wikipedia article on Kamal al-Din Behzad; it gives his birth between 1455 and 1460 at Herat, his death in 1535 at Herat and burial beneath Koh-i Mukhtar, and recounts his upbringing by Mirak Naqqash, his headship of the Herat ateliers in 1486, and his service under Shah Ismail and Shah Tahmasp at Tabriz."
