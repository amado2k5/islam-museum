  fr: "La page « Minorities in Turkey » (Rights Agenda), nommée dans un résumé de recherche remis au musée ; le musée n'a pas ouvert la page, et le fondateur a approuvé l'usage du résumé tel que fourni le 21 novembre 2026. Citée pour : l'arabe dans le Hatay et le sud-est de la Turquie."
  es: "La página «Minorities in Turkey» (Rights Agenda), nombrada en un resumen de investigación entregado al museo; el museo no abrió la página, y el fundador aprobó usar el resumen tal como se entregó el 21 de noviembre de 2026. Citada para: el árabe en Hatay y el sureste de Turquía."
