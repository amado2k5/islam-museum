  ar: "صفحة «Minorities in Turkey» لدى Rights Agenda، وردت في ملخص بحثي زُوّد به المتحف؛ ولم يفتح المتحف الصفحة، وقد أجاز المؤسس استعمال الملخص كما ورد في 21 نوفمبر 2026. يُستشهد بها في: العربية في هاتاي وجنوب شرق تركيا."
  en: "The page \"Minorities in Turkey\" (Rights Agenda), named in a research summary supplied to the museum; the museum did not open the page, and the founder approved using the summary as supplied on 21 November 2026. Cited for: Arabic in Hatay and southeastern Turkey."
