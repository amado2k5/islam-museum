  ar: "مقالة ويكيبيديا الإنجليزية عن ديمس هاسابيس ⁦(وُلد 27 يوليو 1976 في لندن)⁩، الباحث البريطاني في الذكاء الاصطناعي الشريك المؤسس لديب مايند والحائز نوبل الكيمياء 2024. لا تذكر المقالة أي انتماء ديني له."
  en: "The English Wikipedia article on Demis Hassabis (born 27 July 1976 in London), the British AI researcher, DeepMind co-founder and 2024 Nobel laureate in Chemistry. It names no religious affiliation for him."
