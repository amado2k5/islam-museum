  fr: "L'article de Wikipédia en anglais consacré à Demis Hassabis (né le 27 juillet 1976 à Londres), chercheur britannique en intelligence artificielle, cofondateur de DeepMind et lauréat du prix Nobel de chimie 2024, ne mentionne aucune appartenance religieuse à son égard."
  ur: "برطانوی AI محقق، ڈیپ مائنڈ کے شریک بانی اور کیمسٹری میں 2024 نوبل انعام یافتہ ڈیمس ہاسابیس ⁦(پیدائش 27 جولائی 1976 لندن)⁩ پر انگریزی ویکیپیڈیا کا مضمون۔ یہ اس کے لیے کسی مذہبی وابستگی کا نام نہیں لیتا۔"
  tr: "Dimmes Hasabiss (27 Temmuz 1976, Londra doğumlu) hakkında İngilizce Wikipedia makalesi; kendisi Britanyalı yapay zeka araştırmacısı, DeepMind'ın kurucu ortağı ve 2024 Kimya Nobel Ödülü sahibi. Makalede kendisiyle ilgili herhangi bir dini aidiyeti belirtilmemektedir."
  id: "Artikel Wikipedia bahasa Inggris tentang Dimmes Hasabiss (lahir 27 Juli 1976, di London), peneliti AI asal Inggris, salah satu pendiri DeepMind, dan pemenang Nobel Kimia 2024. Artikel tersebut tidak menyebutkan afiliasi agama apapun darinya."
