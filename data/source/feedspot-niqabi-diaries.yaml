  ar: "قائمة فيدسبوت لبودكاست «يوميات المنتقبة» في تصنيفي أفضل بودكاستات النساء المسلمات وأفضل البودكاستات الإسلامية في المملكة المتحدة؛ تنسب إنتاج البودكاست إلى سمر أسامواه وتحدد موقعه في نيوكاسل أبون تاين بإنجلترا، وتصفه بأنه يشارك قصص النساء اللواتي يلبسن النقاب أو لبسنه وتجاربهن وأصواتهن، وتدرج قناته على يوتيوب وحساباته الاجتماعية."
  en: "Feedspot's listing of The Niqabi Diaries podcast in its best Muslim women's podcasts and best UK Islamic podcasts roundups. It credits the podcast's producer as Samar Asamoah, locates it in Newcastle upon Tyne, England, describes it as sharing the stories, experiences and voices of Muslim women who wear or have worn the niqab, and lists its YouTube channel and social accounts."
