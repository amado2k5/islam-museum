summary:
  ar: "قائمة فيدسبوت لبودكاست «يوميات المنتقبة» في تصنيفي أفضل بودكاستات النساء المسلمات وأفضل البودكاستات الإسلامية في المملكة المتحدة؛ تنسب إنتاج البودكاست إلى سمر أسامواه وتحدد موقعه في نيوكاسل أبون تاين بإنجلترا، وتصفه بأنه يشارك قصص النساء اللواتي يلبسن النقاب أو لبسنه وتجاربهن وأصواتهن، وتدرج قناته على يوتيوب وحساباته الاجتماعية."
  en: "Feedspot's listing of The Niqabi Diaries podcast in its best Muslim women's podcasts and best UK Islamic podcasts roundups. It credits the podcast's producer as Samar Asamoah, locates it in Newcastle upon Tyne, England, describes it as sharing the stories, experiences and voices of Muslim women who wear or have worn the niqab, and lists its YouTube channel and social accounts."
  es: "Feedspot incluyó el podcast The Niqabi Diaries en sus listas de los mejores podcasts de mujeres musulmanas y los mejores podcasts islámicos del Reino Unido. La productora del podcast es Samar Asamoah, se ubica en Newcastle upon Tyne, Inglaterra, se describe como un espacio para compartir las historias, experiencias y voces de mujeres musulmanas que usan o han usado el niqab, y se mencionan su canal de YouTube y sus redes sociales."
  fr: "Feedspot a inclus le podcast « The Niqabi Diaries » dans ses sélections des meilleurs podcasts pour femmes musulmanes et des meilleurs podcasts islamiques britanniques. La productrice du podcast est Samar Asamoah, il est basé à Newcastle upon Tyne, en Angleterre, et le podcast est décrit comme partageant les histoires, les expériences et les témoignages de femmes musulmanes qui portent ou ont porté le niqab. Le site mentionne également sa chaîne YouTube et ses comptes sur les réseaux sociaux."
  ur: "Feedspot کی The Naqabi Diaries کے پوڈ کاسٹ کی فہرست اس کے بہترین مسلم خواتین کے پوڈ کاسٹ اور بہترین UK اسلامی پوڈ کاسٹ راؤنڈ اپ میں۔ یہ پوڈ کاسٹ کے پروڈیوسر کو سمر اساموہ کے طور پر کریڈٹ کرتا ہے، اسے نیو کیسل اپون ٹائین، انگلینڈ میں تلاش کرتا ہے، اسے ان مسلم خواتین کی کہانیوں، تجربات اور آوازوں کو شیئر کرنے کے طور پر بیان کرتا ہے جو نقاب پہنتی ہیں یا پہنتی ہیں، اور اس کے یوٹیوب چینل اور سوشل اکاؤنٹس کی فہرست بناتی ہے۔"
  tr: "\"Niqab Günlükleri\" podcast'inin Feedspot listesi, Birleşik Krallık'taki en iyi Müslüman kadın podcastleri ve en iyi İslami podcastler sıralamamda; podcast Samar Asamoah'a atfediliyor ve konumu İngiltere'nin Newcastle upon Tyne kentindedir; niqab takan veya giyen kadınların hikayelerini, deneyimlerini ve seslerini paylaştığı bir şekilde tanımlanır. Kanalı YouTube ve sosyal medya hesaplarında listelenmiştir."
  id: "Daftar Feedspot untuk podcast \"Diaries of the Niqab\" dalam peringkat podcast perempuan Muslim terbaik dan podcast Islam terbaik di Inggris Raya; podcast ini dikaitkan dengan Samar Asamoah dan lokasinya di Newcastle upon Tyne, Inggris, menggambarkannya sebagai membagikan kisah perempuan yang mengenakan atau mengenakan niqab, pengalaman mereka, dan suara mereka. Channel-nya tercantum di YouTube dan akun media sosialnya."
