summary:
  ar: "قائمة Listen Notes لبودكاست مسلم سنترال الخاص بمعتصم الحميدي ⁦(687 حلقة منذ 2015)⁩؛ سيرتها المرفقة تذكر دراسته على تلامذة الألباني البارزين، وعمله إماما ومحاضرا في مسجد ابن تيمية بلندن ومركز الدعوة إلى الإسلام في لوتون، ومحاضراته في الجامعات والمدارس البريطانية، وتقديمه برامج وسلاسل محاضرات على قناة هدى."
  en: "The Listen Notes listing of Muslim Central's Moutasem Al-Hameedi podcast (687 episodes since 2015); its attached biography records his study under prominent students of al-Albani, his work as imam and lecturer at the Ibn Taymiyyah Mosque in London and the Call to Islam Islamic Center in Luton, his lecturing at British universities and schools, and his hosting of TV shows and lecture series on Huda TV."
  es: "La lista de Listen Notes del podcast de Moutasem Al-Hameedi de Muslim Central (687 episodios desde 2015); su biografía adjunta documenta sus estudios con destacados alumnos de al-Albani, su trabajo como imán y profesor en la mezquita Ibn Taymiyyah de Londres y en el Centro Islámico Llamada al Islam de Luton, sus conferencias en universidades y escuelas británicas, y su labor como presentador de programas de televisión y ciclos de conferencias en Huda TV."
  fr: "La liste des notes d'écoute du podcast Moutasem Al-Hameedi de Muslim Central (687 épisodes depuis 2015); sa biographie jointe retrace ses études auprès d'éminents élèves d'al-Albani, son travail d'imam et de conférencier à la mosquée Ibn Taymiyyah de Londres et au centre islamique Call to Islam de Luton, ses conférences dans des universités et des écoles britanniques, et son animation d'émissions de télévision et de séries de conférences sur Huda TV."
  ur: "مسلم سنٹرل کے معتصم الحمیدی پوڈ کاسٹ کی لسٹنگ نوٹس ⁦(2015 سے 687 اقساط)⁩؛ اس کے منسلک سوانح عمری میں البانی کے ممتاز طلباء کے تحت ان کا مطالعہ، لندن کی ابن تیمیہ مسجد میں امام اور لیکچرر کے طور پر ان کا کام اور لوٹن میں اسلام اسلامک سنٹر کی دعوت، برطانوی یونیورسٹیوں اور اسکولوں میں ان کا لیکچر، اور ہدا ٹی وی پر ٹی وی شوز اور لیکچر سیریز کی میزبانی کو ریکارڈ کیا گیا ہے۔"
