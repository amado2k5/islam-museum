summary:
  ar: "مقالة الموسوعة البريطانية عن عمران خان؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 5 أكتوبر 1952 في لاهور، وشهرته لاعب كريكت قاد باكستان إلى كأس العالم 1992، ودخوله السياسة منتقدا للفساد، ورئاسته الوزراء (2018-2022) وعزله بتصويت برلماني، وما واجهه بعد عزله من قضايا وسجن كما تنقله الموسوعة."
  en: "Encyclopaedia Britannica article on Imran Khan; used for entity facts only. It records his birth on 5 October 1952 in Lahore, his fame as the cricketer who led Pakistan to the 1992 World Cup, his entry into politics as a critic of corruption, his premiership (2018–2022) and removal by a parliamentary vote, and the charges and imprisonment that followed as Britannica reports them."
  es: "Artículo de la Enciclopedia Británica sobre Imran Khan; utilizado únicamente para datos sobre la persona. En él se recoge su nacimiento el 5 de octubre de 1952 en Lahore, su fama como el jugador de críquet que llevó a Pakistán a la Copa del Mundo de 1992, su entrada en la política como crítico de la corrupción, su mandato como primer ministro (2018-2022) y su destitución por votación parlamentaria, así como los cargos y el encarcelamiento que siguieron, según informa la Enciclopedia Británica."
  fr: "Article de l'Encyclopædia Britannica sur Imran Khan; utilisé uniquement pour les informations relatives à l'entité. Il relate sa naissance le 5 octobre 1952 à Lahore, sa renommée en tant que joueur de cricket ayant mené le Pakistan à la victoire lors de la Coupe du monde de 1992, son entrée en politique comme critique de la corruption, son mandat de Premier ministre (2018-2022) et sa destitution par un vote parlementaire, ainsi que les accusations et l'emprisonnement qui ont suivi, tels que rapportés par Britannica."
