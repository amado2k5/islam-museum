summary:
  ar: "مقالة الموسوعة البريطانية عن عمران خان؛ تُستخدم لوقائع الكيان فقط. تذكر مولده في 5 أكتوبر 1952 في لاهور، وشهرته لاعب كريكت قاد باكستان إلى كأس العالم 1992، ودخوله السياسة منتقدا للفساد، ورئاسته الوزراء (2018-2022) وعزله بتصويت برلماني، وما واجهه بعد عزله من قضايا وسجن كما تنقله الموسوعة."
  en: "Encyclopaedia Britannica article on Imran Khan; used for entity facts only. It records his birth on 5 October 1952 in Lahore, his fame as the cricketer who led Pakistan to the 1992 World Cup, his entry into politics as a critic of corruption, his premiership (2018–2022) and removal by a parliamentary vote, and the charges and imprisonment that followed as Britannica reports them."
