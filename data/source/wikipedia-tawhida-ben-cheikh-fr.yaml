reliability_note: "Community-edited encyclopedia article, retrieved in full at the stated revision, resting on Le Monde (2020), La Presse de Tunisie (2010, 2019), a UNDP survey and Claude Liauzu (2004). Its lead gives her birth at Tunis on 2 January 1909 and her death on 6 December 2010, while its body says she came from a well-off family of Ras Jebel. With the UNDP survey it styles her the first Muslim woman of the Arab world, or at least of the Maghreb, to practise as a physician; that wording attests Islam as her identity at the general level and names no school."
