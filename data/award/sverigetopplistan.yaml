summary:
  ar: "القائمة الوطنية السويدية للتسجيلات، القائمة على بيانات المبيعات من الاتحاد الدولي لصناعة التسجيلات في السويد، وعُرفت باسم «توبليستان» من 1975 ثم «هيتليستان» ثم اسمها الحالي منذ أكتوبر 2007؛ بلغ فيها ألبوم يوسف إسلام «An Other Cup» المرتبة السادسة عشرة سنة 2006."
  en: "Sweden's national record chart, based on sales data from IFPI Sverige, known as Topplistan from 1975, then Hitlistan, and by its present name since October 2007; Yusuf Islam's An Other Cup peaked at number 16 there in 2006."
  ur: "سویڈن کا قومی ریکارڈ چارٹ، جو آئی ایف پی آئی سویڈن کے فروخت کے اعداد پر مبنی ہے؛ 2006 میں «این ادر کپ» سولہویں نمبر تک پہنچا۔"
