summary:
  ar: "جوائز بريطانية للموسيقى العالمية رعتها إذاعة بي بي سي 3 بين 2003 و2008، اقترحها إيان أندرسون محرر مجلة إف روتس، وتختار فائزيها لجنة من اثني عشر عضوا؛ ألغتها بي بي سي في مارس 2009، ونال فيها يوسو ندور جائزة النقاد سنة 2005 عن ألبوم «مصر»."
  en: "British world-music awards sponsored by BBC Radio 3 from 2003 to 2008, conceived by Ian Anderson, editor of fRoots, with winners chosen by a twelve-member jury; the BBC axed them in March 2009. Youssou N'Dour won the Critics Award in 2005, for the album Egypt."
  ur: "بی بی سی ریڈیو 3 کے زیرِ سرپرستی 2003 سے 2008 تک دیے جانے والے برطانوی عالمی موسیقی ایوارڈز؛ بی بی سی نے انہیں مارچ 2009 میں ختم کیا۔ 2005 میں یوسو اندور کو «اِجپٹ» پر ناقدین کا ایوارڈ ملا۔"
