label: { ar: "شخصية العام الإسلامية ⁦(جائزة دبي الدولية للقرآن الكريم)⁩", en: "Islamic Personality of the Year (Dubai International Holy Quran Award)", ur: "اسلامی شخصیتِ سال ⁦(دبئی بین الاقوامی قرآن کریم ایوارڈ)⁩", es: "Personalidad Islámica del Año (Premio Internacional del Sagrado Corán de Dubái)", fr: "Personnalité islamique de l'année (Prix international du Saint Coran de Dubaï)", tr: "Yılın İslami Kişiliği (Dubai Uluslararası Kur'an Ödülü)", id: "Kepribadian Islam Tahun Ini (Penghargaan Al-Qur'an Internasional Dubai)" }
summary:
  ar: "تكريم سنوي ضمن جائزة دبي الدولية للقرآن الكريم لشخصية أو مؤسسة قدّمت إسهاما متميزا في المجالات الشرعية والفكرية والعلمية؛ أول من ناله محمد متولي الشعراوي في الدورة الأولى سنة 1418هـ."
  en: "An annual honour within the Dubai International Holy Quran Award for a person or institution with a distinguished contribution in the religious, intellectual and scientific fields; the first recipient was Muhammad Mutawalli al-Sha'rawi at the first session in 1418 AH."
  ur: "دبئی بین الاقوامی قرآن کریم ایوارڈ کے تحت سالانہ اعزاز، کسی شخصیت یا ادارے کے لیے جس نے دینی، فکری اور علمی میدان میں نمایاں خدمت کی ہو؛ پہلا اعزاز 1418ھ میں محمد متولی الشعراوی کو ملا۔"
  es: "Un galardón anual otorgado dentro del Premio Internacional del Sagrado Corán de Dubái a una persona o institución con una contribución destacada en los ámbitos religioso, intelectual y científico; el primer galardonado fue Muhammad Mutawalli al-Sha'rawi en la primera edición en 1418 AH."
  fr: "Distinction annuelle décernée dans le cadre du Prix international du Saint Coran de Dubaï à une personne ou une institution ayant apporté une contribution remarquable dans les domaines religieux, intellectuels et scientifiques; le premier lauréat fut Muhammad Mutawalli al-Sha'rawi lors de la première session en 1418 AH."
  tr: "Dubai Uluslararası Kur'an Ödülü kapsamında, Şeriat, düşünce ve bilim alanlarında olağanüstü katkılar yapmış bir kişilik veya kurum için verilen yıllık bir onur; ilk ödül sahibi 1418 Hicri'ndeki ilk oturumda Muhammed Metvally El-Şaarawi olmuştur."
  id: "Penghargaan tahunan dalam Dubai International Quran Award untuk tokoh atau institusi yang telah memberikan kontribusi luar biasa di bidang Syariah, pemikiran, dan ilmu pengetahuan; penerima pertama adalah Muhammad Metwally Al-Shaarawi pada sesi pertama tahun 1418 H."
