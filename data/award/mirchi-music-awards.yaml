summary:
  ar: "جوائز سنوية تمنحها إذاعة ميرتشي الهندية منذ 2009 لموسيقى الأفلام الهندية، تكرّم كل دورة موسيقى السنة السابقة؛ من فئاتها «أغنية تمثل التقليد الصوفي» التي نالها قوالي «Kun Faya Kun» لأ. ر. رحمن في الدورة الرابعة في 21 مارس 2012."
  en: "Annual awards given by India's Radio Mirchi since 2009 to Hindi film music, each ceremony honouring the previous year's music; among its categories is the song representing the Sufi tradition, won by A. R. Rahman's qawwali 'Kun Faya Kun' at the 4th ceremony on 21 March 2012."
  ur: "بھارت کے ریڈیو مرچی کے سالانہ ایوارڈز جو 2009 سے ہندی فلمی موسیقی کو دیے جاتے ہیں، اور ہر تقریب پچھلے سال کی موسیقی کو اعزاز دیتی ہے؛ اس کے زمروں میں صوفی روایت کی نمائندگی کرنے والا گیت شامل ہے، جو 21 مارچ 2012 کی چوتھی تقریب میں اے آر رحمان کی قوالی «Kun Faya Kun» کو ملا۔"
