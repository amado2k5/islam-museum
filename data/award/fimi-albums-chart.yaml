summary:
  ar: "قائمة الألبومات الرسمية في إيطاليا، يعدها الاتحاد الإيطالي لصناعة الموسيقى الذي تأسس سنة 1992، وصدرت أول مرة في 7 مارس 1995 لتحل محل قوائم سابقة رآها الاتحاد غير موثوقة؛ بلغ فيها ألبوم يوسف إسلام «An Other Cup» المرتبة الثانية والعشرين سنة 2006."
  en: "Italy's official albums chart, compiled by FIMI, the music industry federation founded in 1992, and first issued on 7 March 1995 to replace earlier charts the federation considered unreliable; Yusuf Islam's An Other Cup peaked at number 22 there in 2006."
  ur: "اٹلی کا سرکاری البمز چارٹ، جو 1992 میں قائم اطالوی موسیقی صنعت فیڈریشن مرتب کرتی ہے اور پہلی بار 7 مارچ 1995 کو شائع ہوا؛ 2006 میں «این ادر کپ» بائیسویں نمبر تک پہنچا۔"
