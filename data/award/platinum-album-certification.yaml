summary:
  ar: "شهادة مبيعات تمنحها شركات التسجيلات أو هيئات صناعة الموسيقى الوطنية لألبوم بلغ عتبة مبيعات محددة في بلد ما؛ يسجّل المتحف الشهادة والبلد والجهة كما تذكرها المصادر دون أن يعتمد أرقام المبيعات وقائع ثابتة."
  en: "A sales certification given by record companies or national music-industry bodies to an album that reached a set sales threshold in one country; the museum records the certification, the territory and the certifying body as the sources state them, and treats sales figures as attributed, not fixed facts."
  ur: "ریکارڈ کمپنیاں یا قومی موسیقی صنعت کے ادارے کسی ملک میں مقررہ فروخت تک پہنچنے والے البم کو جو سند دیتے ہیں؛ عجائب گھر سند، ملک اور دینے والا ادارہ ماخذ کے مطابق درج کرتا ہے۔"
  es: "Un certificado de ventas otorgado por compañías discográficas u organismos nacionales de la industria musical a un álbum que alcanzó un umbral de ventas determinado en un país; el museo registra la certificación, el territorio y el organismo certificador tal como los indican las fuentes, y trata las cifras de ventas como datos atribuidos, no como hechos fijos."
  fr: "Une certification de ventes délivrée par les maisons de disques ou les organismes nationaux de l'industrie musicale à un album ayant atteint un seuil de ventes déterminé dans un pays; le musée enregistre la certification, le territoire et l'organisme certificateur tels qu'ils apparaissent dans les sources, et considère les chiffres de ventes comme des données attribuées et non comme des faits établis."
  tr: "Belirli bir ülkede belirli bir satış eşiğine ulaşmış bir albüm için plak şirketleri veya ulusal müzik endüstrisi kuruluşları tarafından verilen satış sertifikası; müze, sabit satış rakamlarına dayanmadan sertifikayı, ülkeyi ve kaynaklar tarafından belirtilen varlığı kaydeder."
  id: "Sertifikat penjualan yang diberikan oleh perusahaan rekaman atau badan industri musik nasional untuk album yang telah mencapai ambang penjualan tertentu di negara tertentu; museum mencatat sertifikat, negara, dan entitas yang dikutip oleh sumber tanpa mengandalkan angka penjualan tetap."
