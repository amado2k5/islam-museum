summary:
  ar: "قائمة أفضل مئة ألبوم أسبوعيا في ألمانيا، وهي القائمة الرسمية التي تجمعها جي إف كاي إنترتينمنت لمصلحة الاتحاد الألماني لصناعة الموسيقى؛ يسجّل المتحف أعلى مرتبة بلغها ألبوم، مثل المرتبة الثانية لألبوم يوسف إسلام «An Other Cup» سنة 2006."
  en: "Germany's official weekly Top 100 albums chart, compiled by GfK Entertainment on behalf of the Bundesverband Musikindustrie; the museum records an album's peak, such as number 2 for Yusuf's An Other Cup in 2006."
  ur: "جرمنی کا سرکاری ہفتہ وار ٹاپ 100 البمز چارٹ، جو جی ایف کے انٹرٹینمنٹ مرتب کرتا ہے؛ جیسے 2006 میں یوسف اسلام کے «این ادر کپ» کا دوسرا نمبر۔"
  es: "La lista oficial semanal de los 100 mejores álbumes de Alemania, elaborada por GfK Entertainment en nombre de la Bundesverband Musikindustrie; el museo registra la posición más alta que alcanzó un álbum, como el número 2 para An Other Cup de Yusuf en 2006."
  fr: "Le classement officiel hebdomadaire des 100 meilleurs albums en Allemagne, établi par GfK Entertainment pour le compte de la Fédération allemande de l'industrie musicale (Bundesverband Musikindustrie), enregistre le meilleur classement d'un album, comme la 2e place atteinte par An Other Cup de Yusuf en 2006."
  tr: "Almanya'da haftalık yayınlanan en iyi 100 albüm listesi, GFK Entertainment tarafından Alman Müzik Endüstrisi Birliği yararına hazırlanan resmi liste, bir albümün elde ettiği en yüksek sıralamayı kaydeder; bu, Yusuf Islam'ın 2006'daki \"An Other Cup\" albümüyle ikinci sıraya benzer."
  id: "Daftar 100 album teratas mingguan di Jerman, daftar resmi yang disusun oleh GFK Entertainment untuk kepentingan Asosiasi Industri Musik Jerman, mencatat peringkat tertinggi yang pernah dicapai sebuah album, mirip dengan posisi kedua album Yusuf Islam \"An Other Cup\" pada tahun 2006."
