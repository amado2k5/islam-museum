summary:
  ar: "وسام تمنحه جمهورية باكستان الإسلامية منذ 1958 تقديرًا لـ«الإنجازات البارزة» في الفن والعلم والأدب والرياضة والتمريض، ويُعدّ من أرفع جوائز البلاد في هذه الميادين، ويُمنح أحيانًا لغير الباكستانيين."
  en: "An award of the Islamic Republic of Pakistan, instituted in 1958, for notable achievement in art, science, literature, sports and nursing; one of the country's most prestigious civil awards in these fields, sometimes given to foreign nationals."
  ur: "اسلامی جمہوریہ پاکستان کا اعزاز، جو 1958ء سے فن، سائنس، ادب، کھیل اور نرسنگ میں «نمایاں کامیابیوں» پر دیا جاتا ہے؛ ان شعبوں میں ملک کے معتبر ترین سول اعزازات میں سے، اور کبھی غیر ملکیوں کو بھی۔"
  es: "Un premio de la República Islámica de Pakistán, instituido en 1958, por logros destacados en arte, ciencia, literatura, deportes y enfermería; uno de los premios civiles más prestigiosos del país en estos campos, que en ocasiones se otorga a ciudadanos extranjeros."
  fr: "Une distinction de la République islamique du Pakistan, instituée en 1958, récompensant des réalisations remarquables dans les domaines de l'art, des sciences, de la littérature, du sport et des soins infirmiers; l'une des récompenses civiles les plus prestigieuses du pays dans ces domaines, parfois décernée à des ressortissants étrangers."
  tr: "1958'den beri Pakistan İslam Cumhuriyeti tarafından sanat, bilim, edebiyat, spor ve hemşirelikte 'olağanüstü başarılar' nedeniyle verilen bir madalyadır. Bu madalya, ülkenin bu alanlardaki en yüksek ödüllerinden biri olarak kabul edilir ve bazen Pakistanlı olmayanlara verilir."
  id: "Medali yang diberikan oleh Republik Islam Pakistan sejak tahun 1958 sebagai pengakuan atas 'pencapaian luar biasa' di bidang seni, sains, sastra, olahraga, dan keperawatan. Penghargaan ini dianggap sebagai salah satu penghargaan tertinggi di negara ini di bidang tersebut dan kadang-kadang diberikan kepada non-Pakistan."
