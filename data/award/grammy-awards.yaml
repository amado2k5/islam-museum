summary:
  ar: "الجوائز السنوية التي تمنحها الأكاديمية الوطنية لفنون التسجيل وعلومها في الولايات المتحدة منذ 1958؛ يسجّل المتحف منها ما ناله فنانون مسلمون أو أعمال موضوعها الإسلام، مثل جائزة أفضل ألبوم موسيقى عالمية معاصرة لألبوم «مصر» ليوسو ندور سنة 2005."
  en: "The annual awards of the National Academy of Recording Arts and Sciences of the United States, given since 1958; the museum records those won by Muslim artists or by works about Islam, such as the 2005 award for Best Contemporary World Music Album to Youssou N'Dour's Egypt."
  ur: "امریکہ کی نیشنل اکیڈمی آف ریکارڈنگ آرٹس اینڈ سائنسز کے سالانہ ایوارڈ، جو 1958 سے دیے جاتے ہیں؛ عجائب گھر ان میں سے وہ درج کرتا ہے جو مسلمان فنکاروں یا اسلام کے موضوع پر کاموں کو ملے، جیسے 2005 میں یوسو اندور کے «اِجپٹ» کو بہترین معاصر عالمی موسیقی البم کا ایوارڈ۔"
  es: "Los premios anuales de la Academia Nacional de Artes y Ciencias de la Grabación de los Estados Unidos, que se otorgan desde 1958; el museo registra los ganados por artistas musulmanes o por obras sobre el Islam, como el premio de 2005 al Mejor Álbum de Música Mundial Contemporánea para Egypt de Youssou N'Dour."
  fr: "Les prix annuels de la National Academy of Recording Arts and Sciences des États-Unis, décernés depuis 1958; le musée recense ceux remportés par des artistes musulmans ou par des œuvres sur l'islam, comme le prix du meilleur album de musique du monde contemporaine décerné en 2005 à Egypt de Youssou N'Dour."
  tr: "Amerika Birleşik Devletleri Ulusal Kayıt Sanatları ve Bilimleri Akademisi tarafından 1958'den beri verilen yıllık ödüller, Müslüman sanatçıların kayıtlarını veya İslami temalı eserleri içerir; örneğin 2005'te Yusu N'Dour'un \"Egypt\" albümü için En İyi Çağdaş Dünya Müziği Albümü ödülü."
  id: "Penghargaan tahunan yang diberikan oleh National Academy of Recording Arts and Sciences di Amerika Serikat sejak 1958 mencakup rekaman artis Muslim atau karya bertema Islam, seperti penghargaan Best Contemporary World Music Album untuk album Yusu N'Dour \"Egypt\" pada tahun 2005."
