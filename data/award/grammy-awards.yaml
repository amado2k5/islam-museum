  ar: "الجوائز السنوية التي تمنحها الأكاديمية الوطنية لفنون التسجيل وعلومها في الولايات المتحدة منذ 1958؛ يسجّل المتحف منها ما ناله فنانون مسلمون أو أعمال موضوعها الإسلام، مثل جائزة أفضل ألبوم موسيقى عالمية معاصرة لألبوم «مصر» ليوسو ندور سنة 2005."
  en: "The annual awards of the National Academy of Recording Arts and Sciences of the United States, given since 1958; the museum records those won by Muslim artists or by works about Islam, such as the 2005 award for Best Contemporary World Music Album to Youssou N'Dour's Egypt."
