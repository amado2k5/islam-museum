summary:
  ar: "القائمة الأسبوعية الرسمية لأكثر الألبومات مبيعا في فرنسا، يعدها الاتحاد الوطني للنشر الفونوغرافي الذي تأسس سنة 1922 ويمنح أيضا شهادات المبيعات؛ يسجّل المتحف أعلى مرتبة بلغها ألبوم، مثل المرتبة الرابعة والثلاثين لألبوم «مصر» ليوسو ندور سنة 2004."
  en: "France's official weekly chart of top-selling albums, compiled by SNEP, the record industry's organisation founded in 1922, which also issues sales certifications; the museum records an album's peak, such as number 34 for Youssou N'Dour's Egypt in 2004."
  ur: "فرانس میں سب سے زیادہ بکنے والے البمز کا سرکاری ہفتہ وار چارٹ، جو 1922 میں قائم ادارہ ایس این ای پی مرتب کرتا ہے؛ جیسے 2004 میں یوسو اندور کے «اِجپٹ» کا چونتیسواں نمبر۔"
