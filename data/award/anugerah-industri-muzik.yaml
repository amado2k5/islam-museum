summary:
  ar: "حفل جوائز صناعة الموسيقى الماليزية؛ رُشّح ماهر زين في دورته الثامنة عشرة سنة 2011 في فئة أفضل أغنية ماليزية يؤديها فنان أجنبي عن «إن شاء الله» بالنسخة الماليزية."
  en: "The Malaysian music-industry awards ceremony; its 18th edition in 2011 nominated Maher Zain in the category of best Malay song performed by a foreign artist for the Malay version of 'Insha Allah'."
  ur: "ملائیشیا کی موسیقی صنعت کی ایوارڈ تقریب؛ 2011 کے اٹھارہویں ایڈیشن میں ماہر زین «انشاء اللہ» کے ملے ورژن پر غیر ملکی فنکار کے بہترین ملے گیت کے زمرے میں نامزد ہوئے۔"
  es: "La ceremonia de entrega de premios de la industria musical de Malasia, en su 18.ª edición en 2011, nominó a Maher Zain en la categoría de mejor canción malaya interpretada por un artista extranjero por la versión malaya de 'Insha Allah'."
  fr: "Lors de la 18e édition des Malaysian Music Industry Awards en 2011, Maher Zain a été nominé dans la catégorie de la meilleure chanson malaise interprétée par un artiste étranger pour la version malaise de « Insha Allah »."
  tr: "Malezya Müzik Endüstrisi Ödülleri töreni; Maher Zain, 2011 yılında on sekizinci edisyonunda Malezya versiyonunda \"InshaAllah\" ile Yabancı Sanatçı Tarafından Seslendirilen En İyi Malezya Şarkısı kategorisinde aday gösterildi."
  id: "Upacara Penghargaan Industri Musik Malaysia; Maher Zain dinominasikan pada edisi kedelapan belas tahun 2011 dalam kategori Lagu Malaysia Terbaik yang Dibawakan oleh Artis Asing untuk \"InshaAllah\" versi Malaysia."
