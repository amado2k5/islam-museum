summary:
  ar: "جائزة سنوية يمنحها الاتحاد الأفريقي لكرة القدم منذ 1992 لأفضل لاعب أفريقي، وهي جزء من حفل جوائز الاتحاد منذ 2000؛ سبقتها جائزة مجلة فرانس فوتبول (1970–1994)."
  en: "The Confederation of African Football's annual award for the best African footballer, conferred since 1992 and part of the CAF Awards ceremony since 2000; France Football magazine gave a predecessor award from 1970 to 1994."
  ur: "افریقی فٹ بال کنفیڈریشن کا بہترین افریقی فٹ بالر کے لیے سالانہ انعام، 1992 سے، اور 2000 سے سی اے ایف ایوارڈز کا حصہ؛ اس سے پہلے فرانس فٹ بال رسالے کا انعام (1970–1994) تھا۔"
  es: "El premio anual de la Confederación Africana de Fútbol al mejor futbolista africano, que se otorga desde 1992 y forma parte de la ceremonia de entrega de los Premios CAF desde el año 2000; la revista France Football otorgó un premio predecesor entre 1970 y 1994."
  fr: "Le prix annuel de la Confédération africaine de football récompensant le meilleur footballeur africain, décerné depuis 1992 et faisant partie de la cérémonie des CAF Awards depuis 2000; le magazine France Football décernait un prix prédécesseur de 1970 à 1994."
  tr: "1992'den beri Afrika Futbol Konfederasyonu tarafından en iyi Afrikalı oyuncuya verilen yıllık bir ödül olan bu ödül, 2000 yılından beri Konfederasyon'un ödül töreninin bir parçasıdır; öncesinde France Football dergisi ödülü (1970–1994) verilmiştir."
  id: "Penghargaan tahunan yang diberikan oleh Konfederasi Sepak Bola Afrika sejak 1992 kepada pemain Afrika terbaik, penghargaan ini telah menjadi bagian dari upacara penghargaan Konfederasi sejak tahun 2000; penghargaan ini didahului oleh majalah France Football (1970–1994)."
