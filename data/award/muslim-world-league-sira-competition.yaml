summary:
  ar: "مسابقة عالمية في كتابة السيرة النبوية أعلنتها رابطة العالم الإسلامي في مؤتمر لها بباكستان سنة 1396هـ، وأُعلنت نتائجها في شعبان 1398هـ، وسُلّمت جوائزها في مؤتمر الرابطة بمكة سنة 1399هـ؛ تقدّم إليها 171 بحثا، وفاز بالمركز الأول «الرحيق المختوم»."
  en: "A worldwide competition for writing the Prophet's biography, announced by the Muslim World League at a conference in Pakistan in 1396 AH, with results announced in Shaban 1398 AH and prizes handed over at the League's conference in Mecca in 1399 AH (1979); 171 studies were entered, and al-Raheeq al-Makhtum took first place."
  ur: "سیرتِ نبوی پر لکھنے کا ایک عالمی مقابلہ جس کا اعلان رابطہ عالم اسلامی نے 1396ھ میں پاکستان میں اپنی ایک کانفرنس میں کیا؛ نتائج شعبان 1398ھ میں آئے اور انعامات 1399ھ (1979) میں مکہ کی کانفرنس میں دیے گئے؛ 171 مقالات آئے اور «الرحیق المختوم» اول رہی۔"
