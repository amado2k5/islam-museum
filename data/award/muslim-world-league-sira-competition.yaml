label: { ar: "مسابقة رابطة العالم الإسلامي في السيرة النبوية", en: "Muslim World League Sira Competition", ur: "رابطہ عالم اسلامی کا سیرت نگاری مقابلہ", es: "Liga Mundial Musulmana, Competición Sira", fr: "Compétition de Sira de la Ligue musulmane mondiale", tr: "Müslüman Dünya Ligi Peygamberlik Biyografisi Yarışması", id: "Kompetisi Liga Dunia Muslim dalam Biografi Nabi" }
summary:
  ar: "مسابقة عالمية في كتابة السيرة النبوية أعلنتها رابطة العالم الإسلامي في مؤتمر لها بباكستان سنة 1396هـ، وأُعلنت نتائجها في شعبان 1398هـ، وسُلّمت جوائزها في مؤتمر الرابطة بمكة سنة 1399هـ؛ تقدّم إليها 171 بحثا، وفاز بالمركز الأول «الرحيق المختوم»."
  en: "A worldwide competition for writing the Prophet's biography, announced by the Muslim World League at a conference in Pakistan in 1396 AH, with results announced in Shaban 1398 AH and prizes handed over at the League's conference in Mecca in 1399 AH (1979); 171 studies were entered, and al-Raheeq al-Makhtum took first place."
  ur: "سیرتِ نبوی پر لکھنے کا ایک عالمی مقابلہ جس کا اعلان رابطہ عالم اسلامی نے 1396ھ میں پاکستان میں اپنی ایک کانفرنس میں کیا؛ نتائج شعبان 1398ھ میں آئے اور انعامات 1399ھ (1979) میں مکہ کی کانفرنس میں دیے گئے؛ 171 مقالات آئے اور «الرحیق المختوم» اول رہی۔"
  es: "Un concurso mundial para escribir la biografía del Profeta, anunciado por la Liga Mundial Musulmana en una conferencia en Pakistán en 1396 AH, con los resultados anunciados en Shaban 1398 AH y los premios entregados en la conferencia de la Liga en La Meca en 1399 AH (1979); se presentaron 171 estudios y al-Raheeq al-Makhtum obtuvo el primer lugar."
  fr: "Un concours mondial pour la rédaction de la biographie du Prophète, annoncé par la Ligue musulmane mondiale lors d'une conférence au Pakistan en 1396 AH, avec des résultats annoncés en Shaban 1398 AH et des prix remis lors de la conférence de la Ligue à La Mecque en 1399 AH (1979); 171 études ont été soumises, et al-Raheeq al-Makhtum a remporté la première place."
  tr: "Peygamberlik biyografisi yazımı için küresel bir yarışma, 1396 Hicri'de Pakistan'daki Müslüman Dünya Birliği konferansında ilan edilmiş ve sonuçlar Şa'ban 1398 H.E.'de açıklanmıştır. Ödülleri 1399 Hicri'nde Mekke'deki Lig konferansında takdim edilmiştir; 171 araştırma makalesi sunulmuş ve birincilik 'Mühürlü Nektar'a verilmiştir."
  id: "Kompetisi global dalam penulisan biografi Nabi diumumkan oleh Muslim World League pada konferensinya di Pakistan tahun 1396 H, dengan hasil diumumkan dalam Sha'ban 1398 H. Penghargaannya diberikan pada konferensi Liga di Mekah pada tahun 1399 H; 171 makalah penelitian diajukan kepadanya, dan tempat pertama diberikan kepada 'Sealed Nectar.'"
