summary:
  ar: "قائمة مجلة بيلبورد الأمريكية لأكثر ألبومات الموسيقى العالمية مبيعا في الولايات المتحدة؛ يسجّل المتحف أعلى مرتبة بلغها ألبوم كما تذكرها المصادر، مثل المرتبة السادسة لألبوم «مصر» ليوسو ندور سنة 2004."
  en: "The American magazine Billboard's chart of the best-selling world-music albums in the United States; the museum records an album's peak position as its sources give it, such as number 6 for Youssou N'Dour's Egypt in 2004."
  ur: "امریکی رسالے بل بورڈ کا امریکہ میں سب سے زیادہ بکنے والے عالمی موسیقی البمز کا چارٹ؛ عجائب گھر کسی البم کی سب سے اونچی پوزیشن ماخذ کے مطابق درج کرتا ہے، جیسے 2004 میں یوسو اندور کے «اِجپٹ» کا چھٹا نمبر۔"
  es: "La lista de la revista estadounidense Billboard de los álbumes de música del mundo más vendidos en Estados Unidos; el museo registra la posición más alta que ocupa un álbum según sus fuentes, como el número 6 para Egypt de Youssou N'Dour en 2004."
  fr: "Le classement du magazine américain Billboard des albums de musique du monde les plus vendus aux États-Unis; le musée enregistre la position maximale d'un album telle qu'elle est indiquée par ses sources, comme la 6e place pour Egypt de Youssou N'Dour en 2004."
  tr: "Amerikan Billboard dergisinin Amerika Birleşik Devletleri'ndeki en çok satan küresel müzik albümleri listesi; müze, Yusu N'Dour'un 2004'teki \"Egypt\" albümü gibi kaynakların da belirttiği gibi, bir albümün ulaştığı en yüksek sıralamayı kaydediyor."
  id: "Daftar majalah American Billboard tentang album musik global terlaris di Amerika Serikat; museum ini mencatat peringkat tertinggi yang pernah dicapai sebuah album, seperti yang disebutkan oleh sumber, seperti posisi keenam untuk album Yusu N'Dour \"Egypt\" pada tahun 2004."
