summary:
  ar: "جوائز بريطانية سنوية لـ«موسيقى الأصول السوداء» من الهيب هوب والآر أند بي والسول والريغي والجاز والغوسبل وغيرها، أسسها كانيا كينغ وآندي رافل سنة 1996؛ نال فيها المغني السنغالي يوسو ندور جائزة أفضل فنان أفريقي سنة 2005."
  en: "Annual British awards for 'music of Black origin', from hip-hop, R&B and soul to reggae, jazz and gospel, founded by Kanya King and Andy Ruffell in 1996; the Senegalese singer Youssou N'Dour won its Best African Act award in 2005."
  ur: "«سیاہ فام اصل کی موسیقی» کے برطانوی سالانہ ایوارڈز، جو کانیا کنگ اور اینڈی رفل نے 1996 میں قائم کیے؛ 2005 میں سینیگال کے گلوکار یوسو اندور کو بہترین افریقی فنکار کا ایوارڈ ملا۔"
  es: "Premios británicos anuales para la \"música de origen negro\", que abarcan desde el hip-hop, el R&B y el soul hasta el reggae, el jazz y el gospel, fundados por Kanya King y Andy Ruffell en 1996; el cantante senegalés Youssou N'Dour ganó el premio al Mejor Artista Africano en 2005."
  fr: "Les British Awards, prix annuels récompensant la « musique d'origine noire », allant du hip-hop, du R&B et de la soul au reggae, au jazz et au gospel, ont été fondés par Kanya King et Andy Ruffell en 1996; le chanteur sénégalais Youssou N'Dour a remporté le prix du meilleur artiste africain en 2005."
