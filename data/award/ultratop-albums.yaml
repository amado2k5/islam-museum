summary:
  ar: "القوائم الرسمية للألبومات في بلجيكا، يصدرها منذ 1995 أولتراتوب، الجهة غير الربحية التي أنشأتها رابطة الترفيه البلجيكية، في قائمتين متوازيتين لفلاندرز ووالونيا؛ يسجّل المتحف أعلى مرتبة بلغها ألبوم في كل منهما."
  en: "Belgium's official albums charts, published since 1995 by Ultratop, a non-profit body created by the Belgian Entertainment Association, in parallel charts for Flanders and Wallonia; the museum records an album's peak in each."
  ur: "بیلجیم کے سرکاری البمز چارٹس، جو 1995 سے الٹراٹاپ فلانڈرز اور والونیا کے لیے دو متوازی فہرستوں میں شائع کرتا ہے۔"
  es: "Las listas oficiales de ventas de álbumes de Bélgica, publicadas desde 1995 por Ultratop, un organismo sin ánimo de lucro creado por la Asociación Belga de Entretenimiento, cuentan con listas paralelas para Flandes y Valonia; el museo registra la posición más alta que alcanzó un álbum en cada una de ellas."
  fr: "Les classements officiels des albums en Belgique, publiés depuis 1995 par Ultratop, un organisme à but non lucratif créé par l'Association belge du divertissement, sont établis en parallèle pour la Flandre et la Wallonie; le musée enregistre le pic de ventes d'un album dans chacun de ces classements."
  tr: "Belçika'daki resmi albüm listeleri, 1995'ten beri Belçika Eğlence Derneği tarafından kurulan kar amacı gütmeyen kuruluş Ultratop tarafından Flandre ve Wallonia için iki paralel listede yayımlanmaktadır; müze, her iki albümün de en yüksek sıralamasını kaydetmektedir."
  id: "Daftar album resmi di Belgia telah diterbitkan sejak tahun 1995 oleh Ultratop, entitas nirlaba yang didirikan oleh Belgian Entertainment Association, dalam dua daftar paralel untuk Flanders dan Wallonia; museum ini mencatat peringkat album tertinggi di masing-masing daftar album."
