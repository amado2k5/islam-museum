label: { ar: "جوائز سكرين ⁦(الهند)⁩", en: "Screen Awards", ur: "اسکرین ایوارڈز" }
summary:
  ar: "حفل جوائز سنوي للسينما الهندية أطلقته مجلة سكرين التابعة لمجموعة إنديان إكسبرس سنة 1995، يختار فائزيه أهل الصناعة، واستمر برعاية ستار إنديا بعد استحواذها على المجلة سنة 2015 حتى دورة 8 ديسمبر 2019؛ رُشّحت فيه أغنية «خواجة مير خواجة» لأ. ر. رحمن سنة 2009."
  en: "An annual Indian film-award ceremony launched by Screen magazine of the Indian Express Group in 1995, its winners chosen by industry insiders; it continued under Star India after Star acquired the magazine in 2015, until the ceremony of 8 December 2019. A. R. Rahman's 'Khwaja Mere Khwaja' was nominated there in 2009."
  ur: "بھارتی فلموں کی سالانہ ایوارڈ تقریب جو انڈین ایکسپریس گروپ کے رسالے «اسکرین» نے 1995 میں شروع کی اور جس کے فاتح صنعت کے ماہرین چنتے تھے؛ 2015 میں اسٹار انڈیا کے رسالہ خریدنے کے بعد بھی 8 دسمبر 2019 تک جاری رہی۔"
