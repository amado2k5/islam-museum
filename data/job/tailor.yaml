summary:
  ar: "الخيّاط هو من يقطع الثياب ويخيطها. تضبط كتب الحسبة صنعته: أن يُحسن القطع والفتحة والبطانات والأكمام والذيل، وأن تكون الغرزة ضيقة والإبرة رفيعة والخيط قصيراً، وأن يقيس القماش النفيس قبل قطعه ويوزنه إن كان حريراً أو ديباجاً فيردّه لوزنه، ونظّمت له طوائف في قاهرة لين وإسطنبول إوليا جلبي، وبير الخيّاطين عندهما إدريس النبي."
  en: "The khayyat cuts and sews garments. The hisba manuals regulate the craft: a clean cut, proper neck opening, wide gussets, even sleeves and hems, tight stitches, a fine needle and short thread; valuable cloth must be measured before cutting and silk or brocade weighed so that it is returned to its owner at the same weight. Tailors formed guilds in Lane's Cairo and Evliya's Istanbul, whose lore makes the prophet Idris their first patron."
  ur: "خیاط وہ ہے جو کپڑا کاٹ کر سوتا ہے۔ حسبہ کی کتابیں اس دست کو ضبط کرتی ہیں: صاف کٹائی، درست گلا، چوڑے سلیٹ، برابر آستینیں اور گھیرا، باریک سوئی اور چھوٹا دھاگہ؛ قیمتی کپڑا کاٹنے سے پہلے ناپا جائے اور ریشم یا دیبا تولا جائے تاکہ اسی وزن میں مالک کو لوٹے۔ لین کے قاہرہ اور اولیاء چلبی کے استنبول میں خیاطوں کی انجمنیں تھیں جن کا پہلا پیر نبی ادریس ہے۔"
  es: "El khayyat corta y cose prendas. Los manuales de la hisba regulan el oficio: un corte limpio, un escote adecuado, fuelles anchos, mangas y dobladillos uniformes, puntadas apretadas, aguja fina e hilo corto; las telas valiosas deben medirse antes de cortarlas y la seda o el brocado deben pesarse para que se devuelvan a su dueño con el mismo peso. Los sastres formaron gremios en el Cairo de Lane y en el Estambul de Evliya, cuya tradición atribuye al profeta Idris su primer patrón."
  fr: "Le khayyat coupe et coud les vêtements. Les manuels de la hisba régissent cet art: une coupe nette, une encolure bien ajustée, des goussets larges, des manches et des ourlets réguliers, des points serrés, une aiguille fine et un fil court; les tissus précieux doivent être mesurés avant la coupe et la soie ou le brocart pesés afin d’être rendus à leur propriétaire au même poids. Les tailleurs formèrent des guildes au Caire de Lane et à Istanbul d’Evliya, dont la tradition fait du prophète Idris leur premier protecteur."
  tr: "Terzi, elbiseleri kesen ve diken kişidir. Piyasa kontrol kitapları onun mesleğini düzenler: kesim, açıklık, astar, kol ve etek dikiminde iyi olmalı, dikiş ince, iğne ince ve iplik kısa olmalı, değerli kumaşı kesmeden önce ölçmeli, ipek veya brokar ise tartmalı ve ağırlığına göre geri vermelidir. Kahire, Lenin ve İstanbul'da onun için Evliya Çelebi gibi gruplar kurulmuş ve bu grupların başında Peygamber İdris bulunmaktaydı."
  id: "Penjahit adalah orang yang memotong dan menjahit pakaian. Buku-buku peraturan pasar mengatur keahliannya: bahwa ia harus mahir dalam memotong, membuka, memasang lapisan dalam, membuat lengan baju dan kelim, bahwa jahitan harus rapat, jarum tipis dan benang pendek, dan bahwa ia harus mengukur kain berharga sebelum memotongnya dan menimbangnya jika itu sutra atau brokat dan mengembalikannya sesuai beratnya. Kelompok-kelompok dibentuk untuknya di Kairo, Lenin dan Istanbul, Evliya Çelebi, dan kepala para penjahit di dalamnya adalah Idris sang Nabi."
