craft:
  materials: [textile, cotton, silk, wool]
  techniques:
    ar: "يأمر الشيزري أن يُقطع القماش حسناً، وأن تُضبط فتحة الرقبة وتُوسع البطانات وتتساوى الأكمام والأطراف ويُسوّى الذيل، وأن تكون الغرزة ضيقة لا واسعة والإبرة رفيعة والخيط في الإبرة قصيراً لئلا يهترأ. ولا يقطع الخيّاط قماشاً نفيساً حتى يقيسه، فإن كان حريراً أو ديباجاً وزنه قبل أخذه وردّه بعد خياطته لوزنه؛ ومن غشّهم أن يضعوا رملاً وغراءً في بطانة الثوب الحريري ليسرقوا من وزنه، ولا يُمهل الزبون أكثر من أسبوع إلا بشرط."
    en: "Al-Shayzari orders that the cloth be cut well, the neck opening made properly, the gussets wide, the sleeves and cuffs of equal length and the hems sewn evenly; the stitches should be tight, the needle fine and the thread short so it does not fray. The tailor must measure valuable cloth before cutting, and weigh silk or brocade so he returns it to its owner at the same weight; one fraud was to put sand and glue in a silk garment's lining to steal the difference, and work should not keep a customer waiting more than a week unless agreed."
    ur: "الشیزری کہتا ہے کہ کپڑا اچھی طرح کٹا جائے، گلا درست بنے، سلیٹیں چوڑی ہوں، آستینیں اور کلائیاں برابر اور گھیرا برابر سییا جائے؛ سلائیاں مضبوط، سوئی باریک اور دھاگہ چھوٹا ہو کہ نہ گھسے۔ خیاط قیمتی کپڑا کاٹنے سے پہلے ناپے اور ریشم یا دیبا کو تول کر اسی وزن میں مالک کو لوٹائے؛ ایک دھوکہ یہ تھا کہ ریشمی جوڑے کی استر میں ریت اور سریش ملا کر وزن کا فرق چرایا جائے، اور کام میں گاہک کو ایک ہفتے سے زیادہ نہ رُکایا جائے مگر معاہدے کے ساتھ۔"
