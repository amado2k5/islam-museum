summary:
  ar: "الجمّال يسوق الإبل في القوافل والعساكر والحج. عند العثمانيين كانت فرق الجمالة ⁦(شطربان)⁩ من أوائل ينكچري: خمس وعشرون أورطة جمّالة في منتصف القرن السابع عشر، أقدمها «باش دوه جي»، ودُفع لهم أرزاق بثمانية وعشرين ألف أقچة في القرن السادس عشر؛ وفي القصر ساربان للإبل — ساربان ماده للإناث وساربان نر للذكور — وألف كتار في الحظيرة الخاصة. ويقود الجمّال الكتار بخيط في منخر كل ناقة معقود بعجز التي قبلها، ويطلق نغمات الهداء التي كان الصحابي أنجشة ماهراً فيها."
  en: "The cameleer drives camels in caravans, armies and the pilgrimage. Among the Ottomans the camel-men's companies (şütürbân) stood inside the Janissary corps: twenty-five cameleer ortas by the mid-seventeenth century, the most senior under the başdeveci, granted zeâmets of 28,000 akçe in the sixteenth; the palace kept its sârbân — sârbân-ı mâde over the females and sârbân-ı ner over the males — and a thousand katars in the Has Ahır. The driver led the katar by a thread through each camel's nostril knotted to the rump of the one before, sounding the hidā riding-songs in which the Companion Anjasha was skilled."
  ur: "اونٹ بان قافلوں، لشکر اور حج کی راہ میں اونٹ ہانکتا ہے۔ عثمانیوں میں اونٹ والوں کی کمپنیاں ⁦(شطربان)⁩ ینی چری فوج کا حصہ تھیں: سترہویں صدی کے وسط میں پچیس اونٹچی اورتا، سردار باشدوہ جی، سولہویں صدی میں انہیں اٹھائیس ہزار آقچہ کے زعامت دیے گئے؛ محل میں اونٹوں کے ساربان — مادہ اونٹوں کے ساربانِ مادہ اور نر اونٹوں کے ساربانِ نر — اور خاص آخر میں ایک ہزار کتار۔ ڈرائیور ہر اونٹ کی نتھنے میں ڈالی گئی ڈور کو آگے والے کی کمر سے باندھ کر کتار چلاتا اور ہداء کے گیت گاتا، جن میں صحابی انجشہ ماہر تھے۔"
