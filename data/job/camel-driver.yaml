summary:
  ar: "الجمّال يسوق الإبل في القوافل والعساكر والحج. عند العثمانيين كانت فرق الجمالة ⁦(شطربان)⁩ من أوائل ينكچري: خمس وعشرون أورطة جمّالة في منتصف القرن السابع عشر، أقدمها «باش دوه جي»، ودُفع لهم أرزاق بثمانية وعشرين ألف أقچة في القرن السادس عشر؛ وفي القصر ساربان للإبل — ساربان ماده للإناث وساربان نر للذكور — وألف كتار في الحظيرة الخاصة. ويقود الجمّال الكتار بخيط في منخر كل ناقة معقود بعجز التي قبلها، ويطلق نغمات الهداء التي كان الصحابي أنجشة ماهراً فيها."
  en: "The cameleer drives camels in caravans, armies and the pilgrimage. Among the Ottomans the camel-men's companies (şütürbân) stood inside the Janissary corps: twenty-five cameleer ortas by the mid-seventeenth century, the most senior under the başdeveci, granted zeâmets of 28,000 akçe in the sixteenth; the palace kept its sârbân — sârbân-ı mâde over the females and sârbân-ı ner over the males — and a thousand katars in the Has Ahır. The driver led the katar by a thread through each camel's nostril knotted to the rump of the one before, sounding the hidā riding-songs in which the Companion Anjasha was skilled."
  ur: "اونٹ بان قافلوں، لشکر اور حج کی راہ میں اونٹ ہانکتا ہے۔ عثمانیوں میں اونٹ والوں کی کمپنیاں ⁦(شطربان)⁩ ینی چری فوج کا حصہ تھیں: سترہویں صدی کے وسط میں پچیس اونٹچی اورتا، سردار باشدوہ جی، سولہویں صدی میں انہیں اٹھائیس ہزار آقچہ کے زعامت دیے گئے؛ محل میں اونٹوں کے ساربان — مادہ اونٹوں کے ساربانِ مادہ اور نر اونٹوں کے ساربانِ نر — اور خاص آخر میں ایک ہزار کتار۔ ڈرائیور ہر اونٹ کی نتھنے میں ڈالی گئی ڈور کو آگے والے کی کمر سے باندھ کر کتار چلاتا اور ہداء کے گیت گاتا، جن میں صحابی انجشہ ماہر تھے۔"
  es: "El camellero conduce camellos en caravanas, ejércitos y peregrinaciones. Entre los otomanos, las compañías de camelleros (şütürbân) estaban integradas en el cuerpo de jenízaros: veinticinco compañías de camelleros a mediados del siglo XVII, las más importantes bajo el mando del başdeveci, recibieron zeâmets de 28.000 akçe en el siglo XVI; el palacio mantenía su sârbân —sârbân-ı mâde sobre las hembras y sârbân-ı ner sobre los machos— y mil katars en el Has Ahır. El conductor guiaba el katar por un hilo que pasaba por la fosa nasal de cada camello, atado a la grupa del anterior, mientras entonaba los cantos de cabalgata hidā en los que el Compañero Anjasha era experto."
  fr: "Le chamelier conduit les chameaux dans les caravanes, les armées et les pèlerinages. Chez les Ottomans, les compagnies de chameliers (şütürbân) étaient intégrées au corps des janissaires: vingt-cinq ortas de chameliers existaient au milieu du XVIIᵉ siècle, les plus importantes étant placées sous l’autorité des başdeveci, qui obtinrent des zeâmets de 28 000 akçe au XVIᵉ siècle; le palais entretenait ses sârbân — sârbân-ı mâde pour les femmes et sârbân-ı ner pour les hommes — et un millier de katars au sein du Has Ahır. Le chamelier guidait le katar à l’aide d’un fil passé dans la narine de chaque chameau et noué à la croupe du précédent, en entonnant les chants de chevauchée hidā, chants dans lesquels le Compagnon Anjasha excellait."
  tr: "Deve sürücüsü, kervanlarda, ordularda ve hac yolculuklarında develeri yönlendirir. Osmanlılar arasında deve birlikleri (şterban), en eski Osmanlı askeri birliklerindendi: 17. yüzyılın ortalarında yirmi beş deve birliği vardı, en eskisi \"Baş Dohji\" idi ve 16. yüzyılda yirmi sekiz bin akçe tayın alıyorlardı. Sarayda iki deve sürüsü vardı—dişiler için \"sarban medah\" ve erkekler için \"sarban ner\"—ve özel alanda bin deve çobanı bulunuyordu. Deve sürücüsü, önündeki devenin sağrısına bağlı bir ip yardımıyla sürüleri yönlendirir ve arkadaşı Anjasha'nın ustalıkla çaldığı tefin ezgilerini okurdu."
  id: "Pengemudi unta memimpin unta dalam kafilah, pasukan, dan ziarah. Di antara orang-orang Ottoman, korps unta (shterban) adalah salah satu unit militer Ottoman paling awal: dua puluh lima korps unta pada pertengahan abad ke-17, yang tertua adalah \"Bash Dohji,\" dan mereka dibayar jatah sebesar dua puluh delapan ribu akçe pada abad ke-16. Di istana, terdapat dua kawanan unta—\"sarban madah\" untuk unta betina dan \"sarban ner\" untuk unta jantan—dan seribu penggembala unta di area pribadi. Pengemudi unta memimpin kawanan dengan tali yang diikatkan ke pantat unta di depannya, sambil melantunkan melodi rebana yang dikuasai oleh sahabatnya, Anjasha."
