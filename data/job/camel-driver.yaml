training:
  mode: hereditary-family
  certification: "The state hired Turkmen tribesmen for the campaigns' baggage camels and held the buğurcu families obliged to breed camels for it; the palace sârbân and the Janissary şütürbân learned inside their ortas. The craft itself — the nose-rope katar, the pack-saddles, the tar-and-grease püse treatment, the hidā songs — was carried in the caravan and the family herd."
  duration: "Learned on the march; a campaign began with fattening and greasing the camels, and the drivers were held to the state of their animals."
