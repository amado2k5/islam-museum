summary:
  ar: "صانع القلوع يخيط أشرعة السفن. في موكب إسطنبول عدّ إوليا صنّاع الأشرعة ⁦(يلكنجيان)⁩ ثلاثمئة رجل بتسعين دكاناً، يصنعون كل أصناف الشراع، وبيرهم الأقدم شيث، وهم يمرّون على العربات يخيطون الأشرعة. ويمشي معهم في ركاب البحر صنّاع الصواري والسواري ⁦(سرنجي)⁩ وصنّاع المضخّات وحبّالو الجُرف، إذ القلوع لا يقوم إلا بصارٍ وحبل. ويذكر كونز في وصف أسطول الغوص البحريني أن قوارب البحرين ممتازة البناء يصنعها صنّاع محليون بمواد محلية، بقماش قلوع منسوج في البيت وحبال مفتولة من ليف النخل، وأنها بديعة المنظر بجهازها الفنّي وأشرعتها الملعقية الشكل؛ فالقلوع في الخليج صنعة بيتية تُنسج خيوطها وتُخاط في البرّ قبل أن تُنصَب على الصاري."
  en: "The sail-maker sewed the sails of ships. In Evliya's Istanbul procession the sail-makers (Yelkenjian) were three hundred men in ninety shops; they make all kinds of sails, their oldest patron is Seth, and they pass on wagons sewing sails. They march in the shipbuilders' company: the mast- and yard-makers (Serenji) who sell masts, yards, ribs, planks and all the wood a ship needs, and the pump-makers, for a sail is nothing without a mast and rigging. Kunz, describing the Bahrein pearling fleet, records that the boats of Bahrein are excellently built by native workmen of local materials, with home-woven sailcloth and rigging of twisted date-fibre, and that they make a picturesque sight with their artistic rigs and spoon-shaped sails — in the Gulf the sail was a homespun craft, woven ashore before it was ever bent to the yard."
  ur: "پال ساز جہازوں کے پال سلائی کرتا ہے۔ اولیاء کے استنبول کے جلوس میں پال ساز ⁦(یلکنجیان)⁩ تین سو آدمی نوے دکانیں ہیں؛ وہ ہر قسم کے پال بناتے، ان کا قدیم ترین پیر سیث ہے، اور وہ گاڑیوں پر چل کر پال سلائی کرتے نکلتے۔ انہی کے ساتھ جہاز سازوں کے رکاب میں مستول اور بازو بنانے والے ⁦(سرنجی)⁩ اور پمپ ساز چلتے، کیونکہ پال مستول اور رسّی کے بغیر کچھ نہیں۔ کنز بحرین کے غوطہ خوری بیڑے لکھتے ہوئے بتاتا ہے کہ بحرین کی کشتیاں مقامی دستکاروں نے مقامی سامان سے عمدہ بنائیں، گھر میں بُنا ہوا پال کا کپڑا اور کھجور کے ریشے کی مروڑی رسیاں، اور اپنے فنی آراستگی اور چمچ نما پالوں سے وہ دلکش منظر ہیں — خلیج میں پال ایک گھریلو دستکاری تھی جو ساحل پر بنائی جاتی اور پھر مستول پر چڑھائی جاتی۔"
