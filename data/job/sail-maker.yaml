  techniques:
    ar: "الصنعة خياطة القلوع: قماش متين يُنسَج — وعند بحرين الغوص يُنسَج في البيوت — ثم يُقصّ ويُخاط على قياس الصاري والبازو، ويُشدّ بالحبال المفتولة. وعند إوليا تعرض الورشة على عربات الموكب: الرجال يخيطون الأشرعة وهم يمرّون."
    en: "The craft is the sewing of sails: stout cloth woven — homespun in the Bahrein pearling boats — then cut and sewn to the measure of mast and yard, and bent on with rigging of twisted fibre. In Evliya the workshop shows itself on the procession wagons: the men sewing sails as they pass."
