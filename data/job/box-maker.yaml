summary:
  ar: "الصنادقي هو صانع الصناديق والأقفاص والسلال الجلدية. في موكب إسطنبول إوليا يمرّ «سيبد صندوقچي» — صنّاع السلال والصناديق الجلدية — مائة وخمسة رجال في ثلاثين دكاناً، تملأ دكاكينهم بضروب السلال والصناديق، ويمرّون كلّهم في الدروع. وفي القاهرة الخديوية يسجّل تشالكرافت عريضة «أهالي طائفة الصنادقية الخضر» في ديسمبر ١٨٦٨: صنّاعٌ يعملون في الصناديق المزخرفة المطعّمة بعرق اللؤلؤ أو الكبائن الصغيرة، يشكون إلى وزارة الداخلية أن مشايخ طائفتهم وكبار أعضائها حمّلوا الضريبة المهنية على الفقراء والضعفاء، وأن مكتب الضرائب ختم السجل بغير الحقائق بالتواطؤ مع شيوخ الطائفة، وأنه أغلق ورشهم ليُجبرهم على الدفع — حتى إن مائة وخمسة وعشرين قرشاً في السنة طُلبت من صبيانٍ متمرّنين في الثامنة لا يُدفع لكلٍّ منهم أكثر من قرش وربع في اليوم. وقد أثبت تحقيق «صار معمار» أن الحقيقة خلاف ما زعم قادة الطائفة، ورفع الصنادقية شكواهم إلى المجلس الخاص فالحكومة فمكتب الضرائب، وقالوا: لو بعنا رأس مالنا كله لما بلغ نصف التقدير."
  en: "The sandukji made chests, boxes and leather baskets. In Evliya's Istanbul procession the Seped-Sandukchi — makers of leather baskets and trunks — are one hundred and five men in thirty shops, their shops filled with different kinds of baskets and trunks, and they pass all clad in armour. In Khedivial Cairo Chalcraft records the December 1868 petition of the 'people of the al-Khidr box makers' guild' (ahali ta'ifat al-sanadiqiyya al-khidr): artisans making ornamental boxes inlaid with mother-of-pearl or small cabinets, complaining to the Interior Ministry that the guild's leaders and senior members were foisting the professional tax onto the poorer and weaker members, that the tax office had fraudulently sealed the register in collusion with the leadership, and that it had closed their workshops to force payment — down to 125 piastres a year demanded of eight-year-old apprentices who were themselves paid only a piastre and a quarter a day. The Sar Mi'mar's investigation found the truth at variance with the guild leaders' claims; the box makers petitioned the Privy Council, the Governorate and the tax office in turn, pleading that even selling all their capital would not come to half the assessment. Their shops, Chalcraft notes, generally employed two apprentices."
  ur: "سندقچی صندوق، بکس اور چمڑے کی ٹوکریاں بنانے والا ہے۔ اولیاء کے استنبول جلوس میں «سیبد صندوقچی» — چمڑے کی ٹوکریوں اور صندوقوں کے ساز — ایک سو پانچ آدمی تیس دکانوں میں ہیں، ان کی دکانیں قسم قسم کی ٹوکریوں اور صندوقوں سے بھری، اور وہ سب زرہ میں چلتے۔ خدیو قاہرہ میں چالکرافت دسمبر 1868ء کی «اہلِ طائفۃ الصنادقیہ الخضر» کی درخواست لکھتا: وہ کاریگر جو سدے صندوق یا چھوٹی الماریاں بناتے اور ماں مروارید جڑتے، وزارتِ داخلہ سے شکایت کرتے کہ طائفہ کے سردار کمزور ارکان پر پیشہ ور ٹیکس ڈال رہے، محصول خانے نے سرداروں کی ملی بھگت سے رجسٹر پر جھوٹی مہر لگائی اور ادائیگی کے لیے ورکشاپیں بند کر دیں — یہاں تک کہ آٹھ سالہ شاگردوں سے سالانہ 125 پائستر مانگے گئے جن کی روز کی مزدوری ڈیڑھ پائستر تھی۔ صار معمار کی تحقیق میں سچ سرداروں کے دعوے کے خلاف نکلا؛ صنادقیہ نے پرائیوی کونسل، گورنریٹ اور محصول خانے تک درخواستیں پہنچائیں اور کہا کہ سارا سرمایہ بھی بیچیں تو نصف وصولی نہ نکلے۔ چالکرافت لکھتا ہے کہ ان کی دکانوں میں عموماً دو شاگرد کام کرتے تھے۔"
