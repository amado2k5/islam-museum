  techniques:
    ar: "صنعة الصنادقي في إسطنبول هي سلالُ الجلد وصناديقه: يملأ الصنادقية دكاكينهم بضروب السلال والصناديق الجلدية ويمرّون في الموكب كلّهم في الدروع. وفي القاهرة يعمل الصنادقية في الصناديق المزخرفة المطعّمة بعرق اللؤلؤ أو الكبائن الصغيرة، وتوظّف الورشة عادةً صبيَّين متمرّنين ⁦(صناعين أشراك)⁩ يتقاضى الواحد قرشاً ونصف قرش في اليوم — وهو التفصيل الذي كشفته عريضتهم حين طُلب من كل صغيرٍ في الثامنة مائة وخمسة وعشرون قرشاً ضريبةً في السنة."
    en: "The Istanbul sandukji's craft is leather basketry and trunk-work: the Seped-Sandukchi fill their shops with different kinds of baskets and trunks and pass in the procession all clad in armour. In Cairo the box makers work in ornamental boxes inlaid with mother-of-pearl or small cabinets; a shop generally employs two journeyman-apprentices (sunna'in ashraq) paid one and a half piastres a day — the detail their own petition revealed when a 125-piastre annual tax was demanded of each eight-year-old apprentice."
    ur: "استنبول کے سندقچی کا ہنر چمڑے کی ٹوکری اور صندوق سازی ہے: سیبد صندوقچی اپنی دکانیں قسم قسم کی ٹوکریوں اور صندوقوں سے بھر کر سب زرہ میں جلوس میں چلتے۔ قاہرہ میں صنادقیہ سدے صندوق بناتے جن میں ماں مروارید جڑتا یا چھوٹی الماریاں؛ دکان پر عموماً دو شاگرد ⁦(صناعین اشراک)⁩ کام کرتے جن کی روز کی مزدوری ڈیڑھ پائستر تھی — وہی جزئیات جو ان کی اپنی درخواست نے ظاہر کیں جب ہر آٹھ سالہ شاگرد سے سالانہ 125 پائستر ٹیکس مانگا گیا۔"
