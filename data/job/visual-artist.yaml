training:
  mode: apprenticeship
  certification: "Workshop and corps apprenticeship: the Ottoman registers separate nakkash (master), shakird (apprentice) and müteferrika nakkash (supernumerary), under group chiefs sernakkashan, kethüda, serbölük and the oda chiefs; appointment was made on the recommendation of the hazinedarbashi of the Enderun and the tezkere of the reisülküttab, and masters could rise as far as the vezirate — Nakkash Hasan Pasha was trained in the Enderun."
  duration: "Bozkurt traces the craft through the ateliers: in the Persian line Cihangir of Bukhara learned from the Chinese nakkash Gung, his pupil Pir Seyyid Ahmed of Tabriz taught Bihzad; masters trained masters across the courts."
