summary:
  ar: "النقّاش من اشتغل بالتصوير والزخرفة، واللقب شمل في أصله الحَكّاك والنقّاش والمذهّب ثم صار يُطلق غالباً على رسّام المنمنمات. كان للنقّاشين أسماء على قدر موادهم: نقّاش الفضّة ونقّاش الذهب ونقّاش السِّكّة ونقّاش الحجارة. ومن ورشة هراة التي أخرجت بهزاداً إلى نقّاشي سَلاطين البابور الهنود الذين أفرد لهم أبو الفضل العلّامي باباً في آئين أكبري، إلى جماعة النقّاشين العثمانية التي صارت من أعظم فرق أهل الحرف: تسجّل ميزانية ١٥٢٦ تسعةً وعشرين نقّاشاً واثني عشر شاكرداً، وكان رؤساؤهم السرنقّاشان فالكتخدا، ويُدفع لهم الرزق كل ثلاثة أشهر، ويخرجون مع الجيش في السفر. وقد وجّهت مكانة التصوير عند الفقهاء الفنَّ الإسلامي وجهةً أنتجت فنون الخط والتذهيب والإبرو."
  en: "The nakkash is the craftsman of painting and decoration; the title originally embraced the engraver, the carver and the illuminator, but came to mean above all the miniature painter. The sources name nakkashes after their materials: nakkāsh al-fidda (of silver), of gold, of the coin dies, of stone. From the Herat workshop that produced Bihzad to the Mughal painters for whom Abu'l-Fazl al-Allami devoted a chapter of the A'in-i Akbari, to the Ottoman nakkashan corps which became one of the greatest divisions of the ehl-i hiref: a wage register of early 1526 lists twenty-nine nakkashes and twelve apprentices under their chiefs the sernakkashan and kethüda, paid every three months and marching with the army on campaign. The jurists' standing on figural depiction channelled Muslim art into the arts of calligraphy, illumination and marbling."
  ur: "نقّاش تصویر کشی اور آرائش کا کاریگر ہے؛ لقب اصل میں کندہ کار، نقاش اور مذہب سب پر آتا تھا مگر بعد میں خاص طور پر منی ایچر مصور پر بولا گیا۔ ماخذ نقّاشوں کو ان کے مواد کے نام سے پکارتے ہیں: نفّاش الفضہ، نقّاش الذهب، نقّاش السکہ، نقّاش الحجارہ۔ ہرات کی ورکشاپ جس نے بہزاد پیدا کیا، بابری مصور جن کے لیے ابوالفضل علامی نے آئین اکبری میں مستقل باب رکھا، اور عثمانی نقّاشان جو اہل حرف کی سب سے بڑی شاخوں میں تھے: ۱۵۲۶ء کی تنخواہ رجسٹر میں انتیس نقّاش اور بارہ شاگرد سرنقّاشان اور کتخدا کے ماتحت درج ہیں، تین ماہ بعد وظیفہ ملتا اور فوج کے ساتھ سفر پر جاتے۔ فقہا کی طرف سے تصویر کے بارے میں موقف نے اسلامی فن کو خطاطی، تذہیب اور ابرو کی طرف موڑا۔"
  es: "El nakkash es el artesano de la pintura y la decoración; el título originalmente abarcaba al grabador, al tallador y al iluminador, pero llegó a significar sobre todo al pintor de miniaturas. Las fuentes nombran a los nakkashes según sus materiales: nakkāsh al-fidda (de plata), de oro, de troqueles de monedas, de piedra. Desde el taller de Herat que produjo a Bihzad hasta los pintores mogoles a quienes Abu'l-Fazl al-Allami dedicó un capítulo del A'in-i Akbari, pasando por el cuerpo otomano de nakkashan que se convirtió en una de las mayores divisiones del ehl-i hiref: un registro de salarios de principios de 1526 enumera veintinueve nakkashes y doce aprendices bajo sus jefes, el sernakkashan y el kethüda, pagados cada tres meses y marchando con el ejército en campaña. La postura de los juristas sobre la representación figurativa canalizó el arte musulmán hacia las artes de la caligrafía, la iluminación y el marmoleado."
  fr: "Le nakkash est l'artisan peintre et décorateur; ce titre englobait à l'origine le graveur, le sculpteur et l'enlumineur, mais finit par désigner avant tout le peintre miniature. Les sources nomment les nakkashes selon leurs matériaux: nakkāsh al-fidda (d'argent), d'or, de matrices monétaires, de pierre. De l'atelier d'Hérat qui produisit Bihzad aux peintres moghols auxquels Abu'l-Fazl al-Allami consacra un chapitre de l'A'in-i Akbari, jusqu'au corps ottoman des nakkashans, qui devint l'une des plus importantes divisions de l'ehl-i hiref: un registre de paie du début de 1526 recense vingt-neuf nakkashes et douze apprentis sous l'autorité de leurs chefs, les sernakkashan et kethüda, payés tous les trois mois et participant aux campagnes militaires. L'importance accordée par les juristes à la représentation figurative orienta l'art musulman vers la calligraphie, l'enluminure et la marbrure."
  tr: "\"Gravürcü\" terimi başlangıçta \"oymacı\", \"gravürcü\" ve \"yaldızcı\" kelimelerini kapsıyordu, ancak daha sonra öncelikle minyatür ressamlarını ifade etmeye başladı. Gravürcüler, kullandıkları malzemeleri yansıtan isimlere sahipti: gümüş gravürcü, altın gravürcü, sikke gravürcü ve taş gravürcü. Behzad'ı yetiştiren Herat atölyesinden, Babür hanedanının Hint sultanlarının gravürcülerine (Ebu el-Fadl el-Allami'nin Ayn Akbari adlı eserinde bir bölüm ayırdığı kişiler), en büyük zanaatkâr gruplarından biri haline gelen Osmanlı gravürcüler loncasına kadar: 1526 bütçesinde yirmi dokuz gravürcü ve on iki şakarid kaydedilmiştir; bunların liderleri sarignashan ve katkhuda idi. Üç ayda bir maaş alıyorlardı ve orduya askeri seferlerde eşlik ediyorlardı. İslam alimleri için resmin önemi, hat sanatı, yaldızlama ve ebru sanatının gelişmesine yol açarak İslam sanatını şekillendirdi."
  id: "Istilah \"pengukir\" awalnya mencakup kata-kata \"pemahat,\" \"pengukir,\" dan \"penyepuh,\" tetapi kemudian terutama merujuk pada pelukis miniatur. Para pengukir memiliki nama yang mencerminkan bahan yang mereka gunakan: pengukir perak, pengukir emas, pengukir koin, dan pengukir batu. Dari bengkel Herat yang menghasilkan karya Behzad, hingga para pengukir para sultan India dari dinasti Babur (yang untuknya Abu al-Fadl al-Allami mendedikasikan sebuah bab dalam karyanya Ain Akbari), hingga serikat pengukir Ottoman, yang menjadi salah satu kelompok pengrajin terbesar: anggaran tahun 1526 mencatat dua puluh sembilan pengukir dan dua belas shakarid, yang pemimpinnya adalah sarignashan dan katkhuda. Mereka dibayar setiap tiga bulan sekali dan menemani tentara dalam kampanye militer. Pentingnya lukisan bagi para cendekiawan Islam membentuk seni Islam, yang mengarah pada pengembangan kaligrafi, penyepuhan, dan marmer."
