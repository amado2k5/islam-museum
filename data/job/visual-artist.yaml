places:
  - { place: place/herat, note: "At Herat a book-arts academy (kitabkhana) was founded where many nakkashes trained; it reached its brightest period under Sultan Husayn Bayqara (1470-1506), and Bihzad, counted the greatest master of the miniature, produced his finest works there.", sources: [source/tdv-nakkas] }
  - { place: place/delhi, note: "Humayun brought Tabrizi masters back from exile with him, and under Akbar the Mughal workshop flourished: Abu'l-Fazl al-Allami's A'in-i Akbari devotes a chapter to the nakkashes, Hindu and Muslim working side by side — Abd al-Samad, Mir Sayyid Ali, Basawan, Keshav Das, Miskin, Manohar, Bichitr, Abu'l-Hasan Nadir al-Zaman and Mansur Nadir al-Asr among them.", sources: [source/tdv-nakkas] }
  - { place: place/istanbul, note: "In the Ottoman ehl-i hiref the nakkashes formed one of the chief divisions; the wage register of Rabi' II 932 (Jan-Feb 1526) names twenty-nine masters and twelve apprentices, Kanuni gave Shahkulu his own atelier and visited to watch him work, and Evliya says the musavveran nakkashes had no guild patron because depiction was religiously proscribed — forty men in four shops in his day.", sources: [source/tdv-nakkas, source/tdv-resim] }
