places:
  - { place: place/jerusalem, note: "The interior mosaics of the Dome of the Rock survive from the Umayyad building: gilded cubes on a deep blue ground carrying the foundation inscription, and vegetal designs of acanthus, vine and jewelled trees; al-Umari (14th c.) describes the exterior as covered above the marble to the gutters with gold mosaic of plant patterns.", sources: [source/creswell-early-muslim-architecture-vol1] }
  - { place: place/damascus, note: "For the Great Mosque of Damascus, Ibn Asakir tells that al-Walid asked the Byzantine emperor for two hundred Rumi workmen; al-Umari records that gilded fusaifisa' was made of glass overlaid with thin glass and that polychrome fusaifisa' of paste was still being made in quantity for the mosque in the fourteenth century.", sources: [source/creswell-early-muslim-architecture-vol1] }
  - { place: place/medina, note: "Waqidi (quoted by Ya'qubi) relates that al-Walid asked the emperor of Rum for help rebuilding the Prophet's mosque and received a hundred workmen and forty loads of mosaic, the work finished in 90 AH; Baladhuri speaks of eighty Greek workmen.", sources: [source/creswell-early-muslim-architecture-vol1] }
