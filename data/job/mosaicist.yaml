  techniques:
    ar: "الفسيفساء عند العمري زجاجٌ يُذهَّب ثم يُغطّى بزجاج رقيق، وهو الصنف المسمّى «مشهر»؛ أما الفسيفساء الملوّنة فتُصنع من عجينة. وكانت المكعبات القديمة متساوية الصغر ومتشابهة، فيما تأتي الجديدة مختلفة الأحجام، وهي العلامة التي يُعرف بها القديم من الجديد. وصنعت كمية كبيرة منها للجامع الأموي قبيل حريق 740 هـ ⁦(1339 م)⁩ الذي أتلف صناديق مخزّنة منها. وفي النقوش يُركّب الفسيفسائي مكعبات مذهّبة على أرضية زرقاء غامقة، ويخرج أشجاراً وأغصاناً وزخارف بنائية على مساحات شاسعة."
    en: "Al-Umari's recipe: fusaifisa' is glass which is gilded and then overlaid with thin glass, the kind called mashar; polychrome fusaifisa' is made of paste. Old cubes are uniform and of equal size, new ones of varying size — the mark by which old work is told from new. A large quantity was made for the Umayyad Mosque before the fire of 740 AH (1339 CE) that destroyed stored chests of it. In the figured work the mosaicist set gilded cubes on a deep blue ground and raised trees, branching scrolls and architectural ornament over vast surfaces."
    ur: "عمری کی نسخہ نگاری کے مطابق فسيفساء وہ شیشہ ہے جسے سنہرا کیا جا کر پتلے شیشے سے ڈھانپا جاتا ہے، اسے «مشہر» کہتے ہیں؛ رنگین فسيفساء گارے سے بنتا ہے۔ پرانے خانے یکساں اور برابر ہوتے، نئے ناہموار — یہی پہچان ہے۔ جامع اموی کے لیے بڑی مقدار بنائی گئی جو ۷۴۰ھ ⁦(۱۳۳۹ء)⁩ کی آگ میں سڑ کر ضائع ہوئی۔ نقش میں کاریگر گہرے نیلے پس منظر پر سنہرے خانے جڑ کر درخت، شاخیں اور عمارت کے نقش اتارتا تھا۔"
