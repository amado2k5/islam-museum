summary:
  ar: "الفسيفسائي صانع الفسيفساء، يقطّع مكعبات الزجاج المذهّب والملوّن ويركّبها في الجص على الجدران والقباب؛ وقد بلغت حرفته ذروتها في العمارة الأموية، إذ غلّت فسيفساء قبة الصخرة والجامع الأموي بدمشق أشجاراً ورياحين ونقوشاً على أرضية ذهبية لم يرَ المؤرخون مثلها. وتروي المصادر أن الوليد بن عبد الملك طلب من ملك الروم صنّاعاً وأحمالاً من الفسيفساء لعمارة مسجد المدينة ومسجد دمشق، لكنّ النقد التاريخي لمارغريت فان برشيم يرى في تلك الروايات تضخيماً لطلبٍ اعتياديٍّ للمواد والأيدي العاملة؛ وكان الفسيفسائيون الشاميون أنفسهم يلبّون الحاجة، وبقي صنع الفسيفساء الزجاجية قائماً في دمشق إلى القرن الرابع عشر الميلادي."
  en: "The fassifsa'i was the worker in glass mosaic (fusaifisa'), who cut gilded and coloured glass cubes and set them in plaster across walls and domes; his craft reached its height in Umayyad architecture, where the mosaics of the Dome of the Rock and the Great Mosque of Damascus spread trees, wreaths and ornament on a gold ground that astonished every medieval writer. The Arabic sources tell that al-Walid ibn Abd al-Malik asked the Byzantine emperor for craftsmen and loads of mosaic for the mosques of Medina and Damascus, but Marguerite van Berchem's critical reading finds those accounts enlarged retellings of an ordinary request for materials and hands; Syrian workshops themselves supplied the need, and the making of glass fusaifisa' survived in Damascus into the fourteenth century."
  ur: "فسيفسائی شیشے کے چھوٹے سنہری اور رنگین خانے ⁦(فسيفساء)⁩ کاٹ کر پلستر میں جڑنے والا کاریگر تھا؛ اس کا ہنر اموی عمارت میں اپنے عروج پر تھا، جہاں قبة الصخرة اور دمشق کی جامع مسجد کے موزیک میں درختوں، ہار اور نقشوں سے بھری سنہری زمین ہر قرونِ وسطیٰ کے مصنف کو حیران کرتی تھی۔ عرب مصادر بیان کرتے ہیں کہ ولید بن عبدالملک نے شاہِ روم سے مدینہ اور دمشق کی مساجد کے لیے کاریگر اور موزیک کی سواریاں مانگیں، مگر مارگریت فان برشیم کی تنقیدی قراءت ان روایتوں کو ایک عام مانگ کی پھیلائی ہوئی صورت مانتی ہے؛ شامی کارخانے خود حاجت پوری کرتے تھے اور شیشے کا فسيفساء دمشق میں چودہویں صدی تک بنتا رہا۔"
  es: "El fassifsa'i era el artesano del mosaico de vidrio (fusaifisa'), quien cortaba cubos de vidrio dorados y coloreados y los colocaba en yeso sobre muros y cúpulas; su oficio alcanzó su máximo esplendor en la arquitectura omeya, donde los mosaicos de la Cúpula de la Roca y la Gran Mezquita de Damasco desplegaban árboles, guirnaldas y ornamentos sobre un fondo dorado que asombraron a todos los escritores medievales. Las fuentes árabes cuentan que al-Walid ibn Abd al-Malik solicitó al emperador bizantino artesanos y grandes cantidades de mosaico para las mezquitas de Medina y Damasco, pero la lectura crítica de Marguerite van Berchem revela que esos relatos son versiones ampliadas de una solicitud común de materiales y mano de obra; los propios talleres sirios cubrieron la demanda, y la elaboración de fusaifisa' de vidrio perduró en Damasco hasta el siglo XIV."
  fr: "Le fassifsa'i était l'artisan mosaïste qui découpait des cubes de verre doré et coloré et les incrustait dans du plâtre sur les murs et les coupoles. Son art atteignit son apogée dans l'architecture omeyyade, où les mosaïques du Dôme du Rocher et de la Grande Mosquée de Damas, ornées d'arbres, de guirlandes et de motifs sur fond d'or, émerveillèrent tous les auteurs médiévaux. Les sources arabes rapportent qu'al-Walid ibn Abd al-Malik demanda à l'empereur byzantin des artisans et de grandes quantités de mosaïques pour les mosquées de Médine et de Damas. Cependant, l'analyse critique de Marguerite van Berchem révèle que ces récits ne sont que des versions amplifiées d'une simple requête de matériaux et de main-d'œuvre. Les ateliers syriens répondaient eux-mêmes aux besoins, et la fabrication de fusaifisa' en verre se perpétua à Damas jusqu'au XIVe siècle."
