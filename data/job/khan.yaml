summary:
  ar: "الخان لقب الحكّام الترك منذ ما قبل الإسلام؛ كان الكاغان يقود الدولة الرحلية ويعيّن أقاربه خواناً على العشائر، ثم استقل اللقب ليكافئ الإمبراطور والشاه والسلطان، وحمله جنكيز خان وأبناؤه والقراخانيون والإيلخانيون وخانات القرم وخيوة وبخارى وخوقند، وأدخله العثمانيون في صيغتهم «سلطان البرّين وخاقان البحرين»."
  en: "Khan was the ruler's title of the Turkic peoples since before Islam; the khagan headed the nomadic state and appointed kinsmen as khans over its oymaks, then the title itself rose to mean emperor, shah and sultan, borne by Chinggis Khan and his sons, the Karakhanids, Ilkhanids, and the khanates of Crimea, Khiva, Bukhara and Kokand, while the Ottomans folded it into 'sultan of the two lands and khakan of the two seas'."
  ur: "خان اسلام سے پہلے سے ترک اقوام کے حکمرانوں کا لقب رہا؛ قاغان خانقاہی ریاست کا سربراہ تھا جو اپنے عزیزوں کو او یماقوں پر خان بنا کر مقرر کرتا، بعد میں یہ لقب خود شہنشاہ، شاہ اور سلطان کے مترادف ہو گیا، چنگیز خان اور اس کے بیٹوں، قراخانیوں، ایلخانیوں اور کریمیا، خیوہ، بخارا اور خوقند کے خانات نے اٹھایا، جبکہ عثمانیوں نے اسے 'سلطان البرین و خاقان البحرین' میں سمیٹا۔"
  es: "Khan era el título de gobernante de los pueblos turcos desde antes del Islam; el khagan dirigía el estado nómada y nombraba a sus parientes como khanes sobre sus oymaks, luego el título mismo pasó a significar emperador, shah y sultán, llevado por Gengis Kan y sus hijos, los karajánidas, los iljánidas y los kanatos de Crimea, Jiva, Bujará y Kokand, mientras que los otomanos lo fusionaron en 'sultán de las dos tierras y khakan de los dos mares'."
  fr: "Khan était le titre du souverain des peuples turcs depuis avant l'islam; le khagan dirigeait l'État nomade et nommait des membres de sa famille comme khans à la tête de ses oymaks, puis le titre lui-même s'est élevé au sens d'empereur, de shah et de sultan, porté par Gengis Khan et ses fils, les Karakhanides, les Ilkhanides et les khanats de Crimée, de Khiva, de Boukhara et de Kokand, tandis que les Ottomans l'ont intégré dans l'expression « sultan des deux terres et khakan des deux mers »."
  tr: "Han, İslam öncesi dönemden beri Türk hükümdarlarının kullandığı bir unvandı; Kağan, göçebe devleti yönetir ve akrabalarını kabilelerin başına Kağan olarak atardı. Daha sonra bu unvan, İmparator, Şah ve Sultan'ı ödüllendirmek için bağımsız hale geldi ve Cengiz Han ve oğulları, Karahanlılar, İlhanlılar ve Kırım, Hive, Buhara ve Kokand Hanlıkları tarafından kullanıldı. Osmanlılar bunu \"İki Ülkenin Sultanı ve İki Denizin Kağanı\" formülüne dahil ettiler."
  id: "Khan adalah gelar penguasa Turki sejak sebelum Islam; Khagan memimpin negara nomaden dan menunjuk kerabatnya sebagai Khawan atas klan-klan. Kemudian gelar tersebut menjadi independen untuk memberi penghargaan kepada Kaisar, Shah, dan Sultan, dan digunakan oleh Genghis Khan dan putra-putranya, Karakhanid, Ilkhanid, dan Khanat Krimea, Khiva, Bukhara, dan Kokand. Ottoman menggabungkannya ke dalam formula mereka \"Sultan Dua Negeri dan Khagan Dua Lautan.\""
