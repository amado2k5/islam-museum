summary:
  ar: "الطرّاز هو من يخيّط على الثياب والأقمشة بالحرير الملوّن والقصب. يحمي ابن الأخوة ثوب صاحبه في يديه: يُمنع المطرّزون والمزخرفون أن ينقلوا التطريز من ثوب إلى ثوب مما يجيئهم به القصّارون والضاربون. ويحسب الشيزري ثمن الغرزة في حساب التاجر: من اشترى قماشاً بعشرة دراهم فبيّضه بدرهم وطرّزه بدرهم ورمّمه بدرهم قال كلفني ثلاثة عشر درهماً، وإن كان هو الذي طرّزه قال اشتريته بعشرة وعمِلت عليه بثلاثة. وفي إسطنبول إوليا طائفتان: مطرّزو الذهب ⁦(نقّاشان زردوزان)⁩ خمسة وستون رجلاً بعشرين دكاناً وكثير منهم يعملون في بيوتهم، يصنعون للوزراء والأكابر مخدّات وستائر وعباءات مذهّبة تبهر العيون، ومطرّزو المحارم ⁦(نقّاشان ياغلق)⁩ خمسة وعشرون رجلاً بعشرين دكاناً يركّبون حريراً ملوّناً على محارم ومناشف وقمصان وملايات — وأمّ إوليا نفسها اشتهرت بهذه الصنعة. وفي قاهرة لين تقضي النساء أوقات فراغهن بالإبرة يطرّزن على إطار «المنسج» محارم وخماراً بحرير ملوّن وذهب، وتبيعها لهن الدلّالة في السوق وفي الحريم."
  en: "The tarraz stitches the garments and cloths with coloured silk and gold wire. Ibn al-Ukhuwwa protects the customer's garment in his hands: the embroiderers and ornament-stitchers are forbidden to transfer embroidery from one garment to another among the pieces the fullers and cloth-beaters bring them. Al-Shayzari prices the stitch in the merchant's accounting: a man who buys cloth for ten dirhams and pays one each for bleaching, embroidery and mending may say it cost him thirteen, but if he embroidered it himself he must say he bought it for ten and worked on it to the value of three. In Evliya's Istanbul there are two guilds: the gold embroiderers (Nakkashan Zerduzan), sixty-five men with twenty shops and many more working at home, who make for the vezirs and great men gold-embroidered cushions, sofa-cloths, curtains and cloaks that dazzle the eyes; and the handkerchief embroiderers (Nakkashan Yaghlik), twenty-five men with twenty shops, who work variegated silk on handkerchiefs, towels, shirts and sheets — Evliya's own mother was famous in this handicraft. In Lane's Cairo the women spend their leisure at the needle, embroidering handkerchiefs and head-veils on a frame called the menseg with coloured silks and gold, and a female broker sells the work in the market and in other harems."
  ur: "طرّاز کپڑوں اور بردوں پر رنگین ریشم اور زر کے تار سے کشیدہ کاری کرتا تھا۔ ابن الاخوہ مالک کے کپڑے کو اس کے ہاتھ میں محفوظ رکھتا ہے: طرّازوں اور مزین سازوں پر پابندی ہے کہ وہ دھوبیوں اور دکان پٹانے والوں کی لائی قطعوں میں سے ایک کپڑے کا کشیدہ دوسرے پر منتقل نہ کریں۔ الشیزری سوداگر کے حساب میں ٹانکے کی قیمت گنتا ہے: جو کپڑا دس درہم کا خرید کر سفید، کشیدہ اور مرمت پر ایک ایک درہم دے وہ کہے مجھے تیرہ کی پڑی، اور اگر اس نے خود کشیدہ کیا ہو تو کہے دس میں خریدا اور تین کا کام کیا۔ اولیاء چلبی کے استنبول میں دو انجمنیں ہیں: زر دوز ⁦(نقّاشان زردوزان)⁩ پینسٹھ آدمی بیس دکانوں کے ساتھ اور بہت سے گھروں میں کام کرنے والے، جو وزیروں اور بڑوں کے لیے زر کے تار سے کشیدہ تکیے، صوفہ چادریں، پردے اور عبا بناتے ہیں جو آنکھیں چمکا دیتے ہیں؛ اور رومال دوز ⁦(نقّاشان یاغلق)⁩ پچیس آدمی بیس دکانوں کے ساتھ جو رنگین ریشم سے رومال، تولیے، قمیصیں اور چادریں کڑھتے ہیں — خود اولیاء کی والدہ اسی دستکاری میں مشہور تھیں۔ لین کے قاہرہ میں عورتیں فارغ اوقات میں سوئی سے کام کرتیں، منسج نام کے فریم پر رنگین ریشم اور زر سے رومال اور سربند کڑھتیں، اور دلالہ عورت ان کو بازار اور دوسرے حرموں میں بیچتی ہے۔"
