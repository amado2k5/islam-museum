summary:
  ar: "الطرّاز هو من يخيّط على الثياب والأقمشة بالحرير الملوّن والقصب. يحمي ابن الأخوة ثوب صاحبه في يديه: يُمنع المطرّزون والمزخرفون أن ينقلوا التطريز من ثوب إلى ثوب مما يجيئهم به القصّارون والضاربون. ويحسب الشيزري ثمن الغرزة في حساب التاجر: من اشترى قماشاً بعشرة دراهم فبيّضه بدرهم وطرّزه بدرهم ورمّمه بدرهم قال كلفني ثلاثة عشر درهماً، وإن كان هو الذي طرّزه قال اشتريته بعشرة وعمِلت عليه بثلاثة. وفي إسطنبول إوليا طائفتان: مطرّزو الذهب ⁦(نقّاشان زردوزان)⁩ خمسة وستون رجلاً بعشرين دكاناً وكثير منهم يعملون في بيوتهم، يصنعون للوزراء والأكابر مخدّات وستائر وعباءات مذهّبة تبهر العيون، ومطرّزو المحارم ⁦(نقّاشان ياغلق)⁩ خمسة وعشرون رجلاً بعشرين دكاناً يركّبون حريراً ملوّناً على محارم ومناشف وقمصان وملايات — وأمّ إوليا نفسها اشتهرت بهذه الصنعة. وفي قاهرة لين تقضي النساء أوقات فراغهن بالإبرة يطرّزن على إطار «المنسج» محارم وخماراً بحرير ملوّن وذهب، وتبيعها لهن الدلّالة في السوق وفي الحريم."
  en: "The tarraz stitches the garments and cloths with coloured silk and gold wire. Ibn al-Ukhuwwa protects the customer's garment in his hands: the embroiderers and ornament-stitchers are forbidden to transfer embroidery from one garment to another among the pieces the fullers and cloth-beaters bring them. Al-Shayzari prices the stitch in the merchant's accounting: a man who buys cloth for ten dirhams and pays one each for bleaching, embroidery and mending may say it cost him thirteen, but if he embroidered it himself he must say he bought it for ten and worked on it to the value of three. In Evliya's Istanbul there are two guilds: the gold embroiderers (Nakkashan Zerduzan), sixty-five men with twenty shops and many more working at home, who make for the vezirs and great men gold-embroidered cushions, sofa-cloths, curtains and cloaks that dazzle the eyes; and the handkerchief embroiderers (Nakkashan Yaghlik), twenty-five men with twenty shops, who work variegated silk on handkerchiefs, towels, shirts and sheets — Evliya's own mother was famous in this handicraft. In Lane's Cairo the women spend their leisure at the needle, embroidering handkerchiefs and head-veils on a frame called the menseg with coloured silks and gold, and a female broker sells the work in the market and in other harems."
  ur: "طرّاز کپڑوں اور بردوں پر رنگین ریشم اور زر کے تار سے کشیدہ کاری کرتا تھا۔ ابن الاخوہ مالک کے کپڑے کو اس کے ہاتھ میں محفوظ رکھتا ہے: طرّازوں اور مزین سازوں پر پابندی ہے کہ وہ دھوبیوں اور دکان پٹانے والوں کی لائی قطعوں میں سے ایک کپڑے کا کشیدہ دوسرے پر منتقل نہ کریں۔ الشیزری سوداگر کے حساب میں ٹانکے کی قیمت گنتا ہے: جو کپڑا دس درہم کا خرید کر سفید، کشیدہ اور مرمت پر ایک ایک درہم دے وہ کہے مجھے تیرہ کی پڑی، اور اگر اس نے خود کشیدہ کیا ہو تو کہے دس میں خریدا اور تین کا کام کیا۔ اولیاء چلبی کے استنبول میں دو انجمنیں ہیں: زر دوز ⁦(نقّاشان زردوزان)⁩ پینسٹھ آدمی بیس دکانوں کے ساتھ اور بہت سے گھروں میں کام کرنے والے، جو وزیروں اور بڑوں کے لیے زر کے تار سے کشیدہ تکیے، صوفہ چادریں، پردے اور عبا بناتے ہیں جو آنکھیں چمکا دیتے ہیں؛ اور رومال دوز ⁦(نقّاشان یاغلق)⁩ پچیس آدمی بیس دکانوں کے ساتھ جو رنگین ریشم سے رومال، تولیے، قمیصیں اور چادریں کڑھتے ہیں — خود اولیاء کی والدہ اسی دستکاری میں مشہور تھیں۔ لین کے قاہرہ میں عورتیں فارغ اوقات میں سوئی سے کام کرتیں، منسج نام کے فریم پر رنگین ریشم اور زر سے رومال اور سربند کڑھتیں، اور دلالہ عورت ان کو بازار اور دوسرے حرموں میں بیچتی ہے۔"
  es: "El tarraz cose las prendas y telas con seda de colores e hilo de oro. Ibn al-Ukhuwwa protege la prenda del cliente en sus manos: los bordadores y los bordadores de adornos tienen prohibido transferir bordados de una prenda a otra entre las piezas que les traen los bataneros y los batidores de telas. Al-Shayzari valora la puntada en la contabilidad del comerciante: un hombre que compra tela por diez dirhams y paga uno por cada uno de los blanqueo, bordado y remiendo puede decir que le costó trece, pero si la bordó él mismo debe decir que la compró por diez y trabajó en ella por valor de tres. En el Estambul de Evliya hay dos gremios: los bordadores de oro (Nakkashan Zerduzan), sesenta y cinco hombres con veinte tiendas y muchos más trabajando en casa, que hacen para los vezirs y los grandes hombres cojines, fundas de sofá, cortinas y capas bordadas en oro que deslumbran la vista; y los bordadores de pañuelos (Nakkashan Yaghlik), veinticinco hombres con veinte talleres, que trabajan con seda multicolor en pañuelos, toallas, camisas y sábanas; la propia madre de Evliya era famosa en este oficio. En el Cairo de Lane, las mujeres pasan su tiempo libre bordando pañuelos y velos en un telar llamado menseg con sedas de colores y oro, y una intermediaria vende las obras en el mercado y en otros harenes."
  fr: "Le tarraz coud les vêtements et les étoffes avec de la soie colorée et du fil d'or. Ibn al-Ukhuwwa protège le vêtement du client entre ses mains: il est interdit aux brodeurs et aux orfèvres de transférer des broderies d'un vêtement à un autre parmi les pièces que leur apportent les foulons et les batteurs de tissus. Al-Shayzari intègre le coût de la broderie dans la comptabilité du marchand: un homme qui achète un tissu pour dix dirhams et paie un dirham pour le blanchiment, la broderie et la reprise peut déclarer un coût de treize dirhams, mais s'il l'a brodé lui-même, il doit déclarer l'avoir acheté pour dix dirhams et y avoir travaillé pour une valeur de trois dirhams. À Istanbul, sous le règne d'Evliya, il existe deux corporations: les brodeurs d'or (Nakkashan Zerduzan), soixante-cinq hommes possédant vingt boutiques et bien d'autres travaillant à domicile, qui confectionnent pour les vizirs et les grands de ce monde des coussins, des nappes, des rideaux et des manteaux brodés d'or d'une beauté éblouissante; Et les brodeurs de mouchoirs (Nakkashan Yaghlik), vingt-cinq hommes tenant vingt boutiques, qui travaillent la soie multicolore sur des mouchoirs, des serviettes, des chemises et des draps — la propre mère d'Evliya était réputée dans cet artisanat. Au Caire de Lane, les femmes passent leurs loisirs à broder des mouchoirs et des voiles sur un métier appelé menseg, avec des soies colorées et de l'or, et une courtière vend leurs créations au marché et dans d'autres harems."
  tr: "Nakışçı, renkli ipek ve iplikle elbise ve kumaşlara dikiş diken kişidir. Yeğen, kardeşinin giysisini ellerinde korur: Nakışçıların ve dekoratörlerin, terziler ve dikişçiler tarafından getirilen malzemeleri kullanarak nakışı bir giysiden diğerine aktarmaları yasaktır. El-Şeyzari, tüccarın hesabında bir dikişin maliyetini hesaplar: Eğer biri on dirheme kumaş alır, bir dirheme ağartır, bir dirheme nakış yapar ve bir dirheme tamir ettirirse, maliyetinin on üç dirhem olduğunu söyler. Ama eğer kendisi nakış yaparsa, \"On dirheme aldım, üç dirheme işledim\" der. İstanbul'da iki lonca vardı: Altın nakışçılar (Nakkaşan Zarduzan), yirmi dükkanı olan altmış beş adam, çoğu evden çalışarak bakanlar ve ileri gelenler için göz kamaştırıcı yaldızlı yastıklar, perdeler ve elbiseler üretiyordu; Ve mendil işlemecileri (Naqqashan Yaghlaq), yirmi dükkânı olan yirmi beş adam, mendillere, havlulara, gömleklere ve çarşaflara renkli ipek iplikler işliyorlardı; Eulia'nın annesi de bu zanaatıyla ünlüydü. Kahire'de kadınlar boş zamanlarını iğnelerle geçiriyor, tezgahta renkli ipek ve altın ipliklerle mendil ve peçeler işliyorlardı; bunlar daha sonra pazarda ve haremde bir aracı tarafından onlara satılıyordu."
  id: "Seorang penyulam adalah orang yang menjahit pakaian dan kain dengan sutra dan benang berwarna. Keponakan melindungi pakaian saudaranya di tangannya: penyulam dan dekorator dilarang memindahkan sulaman dari satu pakaian ke pakaian lain, menggunakan bahan yang dibawa oleh penjahit. Al-Shayzari menghitung biaya satu jahitan dalam catatan pedagang: jika seseorang membeli kain seharga sepuluh dirham, memutihkannya seharga satu dirham, menyulamnya seharga satu dirham, dan memperbaikinya seharga satu dirham, ia mengatakan biayanya tiga belas dirham. Tetapi jika ia menyulamnya sendiri, ia berkata, \"Saya membelinya seharga sepuluh dan mengerjakannya seharga tiga.\" Di Istanbul, ada dua serikat: para penyulam emas (Naqqashan Zarduzan), enam puluh lima orang dengan dua puluh toko, banyak di antaranya bekerja dari rumah, membuat bantal, tirai, dan jubah berlapis emas yang memukau untuk para menteri dan pejabat tinggi; dan para penyulam saputangan (Naqqashan Yaghlaq), dua puluh lima pria dengan dua puluh toko, yang menempelkan sutra berwarna pada saputangan, handuk, kemeja, dan seprai—ibu Eulia sendiri terkenal dengan kerajinan ini. Di Kairo, para wanita menghabiskan waktu luang mereka dengan jarum, menyulam saputangan dan kerudung dengan sutra berwarna dan emas di alat tenun, yang kemudian dijual kepada mereka oleh seorang makelar di pasar dan di harem."
