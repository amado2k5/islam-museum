  techniques:
    ar: "يحكي إوليا عن طائفة مطرّزي الذهب ⁦(نقّاشان زردوزان)⁩: خمسة وستون رجلاً بعشرين دكاناً وكثير منهم يعملون في بيوتهم، رئيسهم أبيسرخ المدفون بمدائن، يصنعون للوزراء والأكابر مخدّات وأغطية صوفا وستائر وعباءات مطرّزة بالذهب تبهر عيون الناظرين، وهي صنعة دقيقة. ومطرّزو المحارم ⁦(نقّاشان ياغلق)⁩ خمسة وعشرون رجلاً بعشرين دكاناً، رئيسهم سنبيّ الدين المشدود بسلمان وقبره عند دمشق، يركّبون حريراً ملوّناً على أغطية الوسائد والمحارم والمناشف والقمصان والملايات، ويسيرون وهم يطرّزون ويتبعهم رئيس المطرّزين بنقبائه ومشايخه وجاوشه والموسيقى. ويضبط ابن الأخوة أمانتهم: لا يُنقَل التطريز من ثوب إلى ثوب مما يجيئهم به القصّارون والضاربون. ويصف لين إطار «المنسج» الذي تطرّز عليه نساء القاهرة محارم وخماراً بحرير ملوّن وذهب، وتَحمِل الدلّالة ما عملن إلى السوق وإلى الحريم."
    en: "Evliya tells of the gold embroiderers' guild (Nakkashan Zerduzan): sixty-five men with twenty shops, a great number of them working at home, their patron Ebisurkh buried at Medain; they work gold-embroidered cushions, sofa-cloths, curtains and cloaks for vezirs and great men, which dazzle the eyes of beholders with the splendour of the gold wire — a neat handicraft. The handkerchief embroiderers (Nakkashan Yaghlik) are twenty-five men with twenty shops, their patron Senbi ud-din girded by Selman and buried near Damascus; they embroider with variegated silk cushion-cloths, handkerchiefs, towels, shirts and sheets, and they pass embroidering in the procession followed by the chief of the embroiderers with his nakibs, sheikhs, chaushes and the music. Ibn al-Ukhuwwa regulates their honesty: embroidery must not be transferred from one garment to another among the pieces the fullers or cloth-beaters bring. Lane describes the menseg frame on which the women of Cairo embroider handkerchiefs and head-veils with coloured silks and gold, and the female broker who carries their work to the market and to other harems."
    ur: "اولیہ چلبی زر دوزوں کی انجمن ⁦(نقّاشان زردوزان)⁩ بیان کرتا ہے: پینسٹھ آدمی بیس دکانوں کے ساتھ، بہت سے گھروں میں کام کرنے والے، ان کا سرپرست ابیسرخ مدائن میں مدفون؛ وہ وزیروں اور بڑوں کے لیے زر کے تار سے کشیدہ تکیے، صوفہ چادریں، پردے اور عبا بناتے ہیں جو زر کی چمک سے دیکھنے والوں کی آنکھیں چمکا دیتے ہیں — نفیس دستکاری۔ رومال دوز ⁦(نقّاشان یاغلق)⁩ پچیس آدمی بیس دکانوں کے ساتھ ہیں، ان کا سرپرست سنبی الدین ہے جسے سلمان نے کمر باندھی اور جو دمشق کے قریب مدفون ہے؛ وہ رنگین ریشم سے تکیا چادریں، رومال، تولیے، قمیصیں اور چادریں کڑھتے ہیں اور جلوس میں کڑھتے چلتے ہیں، ان کے پیچھے طرّازوں کا سردار اپنے نقیبوں، شیخوں، چاوشوں اور موسیقی کے ساتھ چلتا ہے۔ ابن الاخوہ ان کی دیانت ضبط کرتا ہے: دھوبیوں اور دکان پٹانے والوں کی لائی قطعوں میں سے کسی کپڑے کا کشیدہ دوسرے پر منتقل نہ ہو۔ لین منسج کے فریم کی صورت کھینچتا ہے جس پر قاہرہ کی عورتیں رنگین ریشم اور زر سے رومال اور سربند کڑھتیں، اور وہ دلالہ عورت جو ان کا کام بازار اور دوسرے حرموں میں لے جاتی ہے۔"
