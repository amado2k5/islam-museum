summary:
  ar: "عالم الاجتماع مهنة حديثة دخلت العالم الإسلامي عبر الجامعة: يذكر مدخل موسوعة TDV أن ضياء كوك ألب ألقى أول دروس الاجتماع في تركيا بسلانيك سنة 1911 ثم درّس في دار الفنون بإسطنبول بين 1913 و1919، وأن علي عبد الواحد وافي — مؤسس علم الاجتماع في مصر والعالم العربي — تخرج من دار العلوم سنة 1925 ونال دكتوراه السوربون سنة 1928 ⁦(في الفلسفة والاجتماع)⁩ فدرّس الاجتماع والنفس والتربية في دار العلوم وألقى في الأزهر ثم عُيّن عضو هيئة تدريس بقسم الاجتماع بكلية الآداب جامعة القاهرة سنة 1936 وعَرَّب تدريس العلم، وأسّس جمعيتي الاجتماع والفلسفة المصريتين ونال وسام الدولة سنة 1987؛ وقد ردّ تأسيس العلم إلى مقدمة ابن خلدون في كتابه عن عبقريته."
  en: "The social scientist is a modern calling that entered the Islamic world through the university. The TDV entries mark two founders: Ziya Gökalp gave the first sociology lessons in Turkey at Salonica in 1911, then taught at the Istanbul Darülfünun in 1913-1919; and Ali Abdülvâhid Vâfî — counted the founder of sociology in Egypt and the Arab world — graduated from Dar al-Ulum in 1925, took a Sorbonne doctorate in philosophy and sociology in 1928, taught psychology, pedagogy and sociology at Dar al-Ulum and lectured at al-Azhar, then was appointed to the sociology department of Cairo University's faculty of letters in 1936, Arabising the science's teaching, founding Egypt's sociology and philosophy societies, and receiving the state prize of 1987; he traced the science's founding to Ibn Khaldun's Muqaddima in his book on Ibn Khaldun's genius."
  ur: "ماہرِ سماجیات ایک جدید پیشہ ہے جو اسلامی دنیا میں جامعہ کے ذریعے آیا۔ TDV مداخل دو بانی بتاتی ہیں: ضیا گوک الپ نے 1911ء میں سلانیک میں ترکی کے پہلے سماجیات کے دروس دیے، پھر 1913-1919ء استنبول کے دارالفنون میں پڑھایا؛ اور علی عبدالواحد وافی — جسے مصر اور عرب دنیا میں سماجیات کا بانی مانا جاتا ہے — 1925ء میں دارالعلوم سے فارغ ہوا، 1928ء میں سوربون سے فلسفہ و سماجیات میں ڈاکٹریٹ لی، دارالعلوم میں نفسیات، تعلیمات اور سماجیات پڑھایا اور ازہر میں درس دیے، پھر 1936ء میں جامعہ قاہرہ کی کلیہ آداب کے شعبہ سماجیات میں رُکّنِ تدریس مقرر ہوا، اس علم کی تدریس عربوں میں کی، مصر کی سماجیات اور فلسفہ انجمنیں قائم کیں اور 1987ء کا ریاستی انعام پایا؛ اس نے ابن خلدون کی عبقریت پر اپنی کتاب میں علم کی بنیاد مقدمہ میں ڈھونڈی۔"
  es: "La ciencia social es una vocación moderna que entró en el mundo islámico a través de la universidad. Las entradas del TDV destacan a dos fundadores: Ziya Gökalp impartió las primeras lecciones de sociología en Turquía, en Salónica, en 1911, y luego enseñó en el Darülfünun de Estambul entre 1913 y 1919; y Ali Abdülvâhid Vâfî, considerado el fundador de la sociología en Egipto y el mundo árabe, se graduó en Dar al-Ulum en 1925, obtuvo un doctorado en filosofía y sociología en la Sorbona en 1928, enseñó psicología, pedagogía y sociología en Dar al-Ulum e impartió clases en al-Azhar, y luego fue nombrado miembro del departamento de sociología de la facultad de letras de la Universidad de El Cairo en 1936, donde arabizó la enseñanza de la ciencia, fundó las sociedades egipcias de sociología y filosofía, y recibió el premio estatal de 1987. En su libro sobre el genio de Ibn Khaldun, él rastreó los orígenes de la ciencia hasta el Muqaddima de Ibn Khaldun."
  fr: "La sociologie est une vocation moderne qui a fait son entrée dans le monde islamique par le biais de l'université. Les notices TDV mentionnent deux fondateurs: Ziya Gökalp a donné les premiers cours de sociologie en Turquie à Salonique en 1911, puis a enseigné à l'université Darülfünun d'Istanbul de 1913 à 1919; et Ali Abdülvâhid Vâfî — considéré comme le fondateur de la sociologie en Égypte et dans le monde arabe — est diplômé de Dar al-Ulum en 1925, a obtenu un doctorat en philosophie et sociologie à la Sorbonne en 1928, a enseigné la psychologie, la pédagogie et la sociologie à Dar al-Ulum et a donné des conférences à al-Azhar, puis a été nommé au département de sociologie de la faculté des lettres de l'université du Caire en 1936, arabisant l'enseignement de la science, fondant les sociétés égyptiennes de sociologie et de philosophie et recevant le prix d'État en 1987; Dans son ouvrage consacré au génie d'Ibn Khaldun, il retrace les origines de cette science jusqu'à la Muqaddima."
