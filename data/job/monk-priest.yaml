summary:
  ar: "الراهب والقسّيس رجل الدين النصراني كما تعرفه كتب المسلمين: الراهب ⁦(جمعه رهبان)⁩ من يخلو للعبادة والتزهّد في الصومعة، والقسّيس أو الكاهن ⁦(والتركية كشيش وباباز)⁩ من يقيم الشعائر باسم جماعته ويعلّمها ويفسّر كتابها. تعرض التفاسير الرهبان في آيات المدح على أنهم الجماعة النصرانية العابدة المتواضعة لينة القلوب، وتذكر من بدأ الرهبانية هرباً من الفتنة إلى الجبال والمغاور، وتنقل ما ذُمّ فيهم من كسب المال بغير الحق واتّخاذهم أرباباً حين تقادَ أحكامهم على أحكام الله. والكهنوت وراثي عند بعض الأديان ⁦(الكهنة والخوري والدستور)⁩ اختياري عند النصارى، والامتناع عن الزواج أصل في الغرب اللاتيني لا يلزم في كنائس الشرق، ومراتبه الأسقف فالقسيس فالشمّاس."
  en: "The monk and the priest are the Christian religious vocation as the Islamic world's books know it: the râhib (plural ruhbân) who withdraws to worship and live ascetically in the monastery, and the qissîs or kâhin (Turkish keşiş, papaz) who performs the rites in his congregation's name, teaches it and interprets its book. The tafsirs present the praised monks of the Qur'anic verses as the worshipping, humble, tender-hearted Christian group, record how some began the monastic life fleeing tribulation into the mountains and caves, and transmit what was blamed in them: devouring wealth unjustly and being taken as lords when their rulings displaced God's. The priesthood is hereditary in some religions (kohen, khoury, dastur), elective among Christians; celibacy is the rule in the Latin West but not binding in the Eastern churches, and its grades run bishop, presbyter, deacon."
  ur: "راہب اور قسّیس مسیحی دینی پیشہ ہے جیسا کہ مسلمانوں کی کتابیں جانتی ہیں: راہب ⁦(جمع رهبان)⁩ عبادت اور زهد کے لیے صومعے میں پناہ لینے والا، اور قسّیس یا کہن ⁦(ترکی میں كشیش اور پاپاز)⁩ اپنی جماعت کی طرف سے عبادات قائم کرنے، سکھانے اور کتاب کی تعبیر کرنے والا۔ تفاسیر آیاتِ مدح کے رهبان کو عبادت گزار، عاجز، نرم دل مسیحی جماعت بتاتی ہیں، واضح کرتی ہیں کہ بعض نے فتنے سے بچ کر پہاڑوں اور غاروں میں رہبانہ زندگی اختیار کی، اور ان میں جو ملامت منقول ہے وہ ناحق مال کھانے اور اپنے احکام کو اللہ کے احکام پر مقدم کر کے ربّ بنے جانے کی ہے۔ کچھ مذاہب میں کہانت وراثتی ہے ⁦(کوہن، خوری، دستور)⁩، مسیحیوں میں انتخابی؛ مغربی لاطینی کلیسا میں عزوبت اصول ہے مگر مشرقی کلیساؤں میں لازم نہیں، اور اس کے درجے اسقف، قس، شمّاس ہیں۔"
  es: "El monje y el sacerdote son la vocación religiosa cristiana tal como la conocen los libros del mundo islámico: el râhib (plural ruhbân) que se retira a adorar y vivir ascéticamente en el monasterio, y el qissîs o kâhin (turco keşiş, papaz) que realiza los ritos en nombre de su congregación, la enseña e interpreta su libro. Los tafsirs presentan a los monjes alabados de los versículos coránicos como el grupo cristiano devoto, humilde y de corazón tierno, registran cómo algunos comenzaron la vida monástica huyendo de la tribulación en las montañas y cuevas, y transmiten lo que se les reprochaba: devorar riquezas injustamente y ser tomados como señores cuando sus decisiones desplazaban a las de Dios. El sacerdocio es hereditario en algunas religiones (kohen, khoury, dastur), electivo entre los cristianos; El celibato es la norma en el Occidente latino, pero no es obligatorio en las iglesias orientales, y sus grados son obispo, presbítero y diácono."
  fr: "Le moine et le prêtre représentent la vocation religieuse chrétienne telle que la conçoivent les textes islamiques: le râhib (pluriel ruhbân) qui se retire au monastère pour y pratiquer sa religion et vivre de manière ascétique, et le qissîs ou kâhin (en turc keşiş, papaz) qui accomplit les rites au nom de sa communauté, l’enseigne et interprète ses textes sacrés. Les tafsirs présentent les moines loués dans les versets coraniques comme un groupe chrétien pieux, humble et compatissant, relatent comment certains ont embrassé la vie monastique en fuyant les épreuves et en se réfugiant dans les montagnes et les grottes, et transmettent les reproches qui leur ont été adressés: l’accaparement injuste des richesses et la prétention à l’autorité lorsque leurs décisions se substituaient à celles de Dieu. Le sacerdoce est héréditaire dans certaines religions (kohen, khoury, dastur), élu chez les chrétiens. Le célibat est la règle en Occident latin, mais n'est pas obligatoire dans les Églises orientales, et ses grades sont: évêque, prêtre, diacre."
  tr: "Müslüman metinlerinde tanımlanan Hristiyan din adamı ve rahip: Bir keşiş (çoğul: keşişler), bir inziva yerinde ibadet ve çilecilik için kendini izole eden kişidir; bir rahip (veya din adamı, Türkçe'de: keshish ve papazz) ise cemaati adına ayinleri yöneten, onlara öğreten ve kutsal metinlerini yorumlayan kişidir. Tefsirler, Hristiyan cemaatini dindar, mütevazı ve nazik yürekli bir grup olarak överek keşişleri sunar. Zulümden kaçmak için dağlara ve mağaralara sığınarak manastır hayatına başlayanlardan bahsederler ve ayrıca haksız yere zenginlik elde etmek ve Tanrı'nın kararlarının önüne geçerek kendilerini efendi ilan etmek gibi onlara yöneltilen eleştirileri de anlatırlar. Bazı dinlerde rahiplik kalıtsaldır (rahipler, görevliler ve diyakonlar), Hristiyanlarda ise gönüllüdür. Evlilikten uzak durmak Latin Batı'da bir gelenektir, ancak Doğu kiliselerinde zorunlu değildir. Hiyerarşik sıralama şu şekildedir: önce piskopos, sonra rahip, sonra diyakon."
  id: "Biarawan dan imam, rohaniwan Kristen sebagaimana didefinisikan dalam teks-teks Muslim: Seorang biarawan (jamak: biarawan-biarawan) adalah orang yang mengasingkan diri untuk beribadah dan menjalani kehidupan asketis di sebuah pertapaan, sedangkan seorang imam (atau rohaniwan, dan dalam bahasa Turki: keshish dan papazz) adalah orang yang memimpin ritual atas nama komunitasnya, mengajar mereka, dan menafsirkan kitab suci mereka. Komentar-komentar menyajikan para biarawan dalam pujian terhadap komunitas Kristen sebagai kelompok yang saleh, rendah hati, dan berhati lembut. Mereka menyebutkan mereka yang memulai kehidupan monastik untuk menghindari penganiayaan dengan mencari perlindungan di pegunungan dan gua-gua, dan mereka juga menceritakan kritik yang dilayangkan terhadap mereka, seperti memperoleh kekayaan secara tidak adil dan menganggap diri mereka sebagai tuan ketika keputusan mereka melampaui keputusan Tuhan. Jabatan imam bersifat turun-temurun dalam beberapa agama (imam, penahbis, dan diakon), sedangkan di kalangan Kristen bersifat sukarela. Pantang menikah adalah tradisi di Barat Latin tetapi tidak wajib di gereja-gereja Timur. Urutan hierarki adalah uskup, kemudian imam, kemudian diakon."
