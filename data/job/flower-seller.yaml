craft:
  techniques:
    ar: "صنعة بائع الزهور صنعة عرضٍ وحفظ: تُعرض الأزهار والفواكه في صحافٍ على مدار السنة لتُقدَّم هدايا للوزراء والكبار، وتُقطف أزهار الحنّاء والورد وتُباع جديدة في الشوارع. وفي موكب إسطنبول يحمل التجّار على الأعمدة أقشاقاً تمثّل قشك المحتسب وقشك سوق الفاكهة يستلقي فيها الغلمان على وسائد ذهبية، ويمرّ بازار باشي وكيا المحتسب على الخيل ويوبّخ من لا يحفظ الوزن والكيل."
    en: "The flower-seller's craft is display and keeping: dishes of flowers and fruit stand ready in every season to be offered as presents to vezirs and great men, and henna-blossoms and roses are cut and sold fresh in the streets. In the Istanbul procession the merchants carry on poles koshks imitating the muhtasib's and the fruit-market's, with boys reclining on golden cushions, while the bazar-bashi and the muhtasib's kyaya ride and upbraid those who failed just weight and measure."
    ur: "پھول فروش کا ہنر سجانا اور سنبھالنا ہے: ہر موسم میں پھولوں اور پھلوں کی تھالیاں تیار رہتیں جو بڑوں کو ہدیہ دی جائیں، اور حنّہ اور گلاب کے پھول توڑ کر بازاروں میں تازہ بکتے۔ استنبول کے جلوس میں سوداگر ستونوں پر کشک اٹھاتے جو محتسب اور پھل بازار کے کشکوں کی نقل ہیں جن میں لڑکے سنہری تکیوں پر تکیہ لگائے بیٹھے ہوتے، اور بازار باشی اور محتسب کا قیاضی گھوڑوں پر چڑھ کر ان کو ڈانٹتے جو صحیح وزن و ناپ نہ رکھیں۔"
