summary:
  ar: "بائع الزهور هو من يبيع الورد والأزهار والأغصان في السوق والشارع. يعدّ إوليا جلبي لتجّار الزهور في إسطنبول ثمانمائة رجل في ثلاثمائة دكان بيرهم بابا رتن، ولتجّار الزهور الذين يبيعون الفاكهة معها ثلاثمائة رجل في ثمانين دكاناً بيرهم خابيل إرمغان الذي تقلّد الحزام من أنس بن مالك وكان يأتي النبي وأهله بسلال الزهور والفاكهة هدية، وقبره في الطائف؛ دكاكينهم في تخت القلعة وآق سراي وسلطان محمد وآيا صوفيا أمام باب الجبة خانة، وفيها على مدار السنة صحاف مملوءة زهوراً وفواكه تُقدَّم هدايا للوزراء والكبار، ويمرّون في الموكب حاملين على الأعمدة أقشاقاً تمثّل قشك المحتسب وقشك سوق الفاكهة. وعند لين في شوارع القاهرة ينادي بائع الورد نداءً عجيباً: «كان الورد شوكة فمن عرق النبي ازدهر» — إشارة إلى معجزة تُروى عن النبي — وبائع أزهار الحنّاء ينادي «يا أطياب الجنة يا أزهار الحنّة»."
  en: "The flower-seller sold roses, blossoms and sprays in the market and the street. Evliya counts eight hundred flower-merchants in three hundred shops in Istanbul under their patron Baba Reten, and three hundred more who sell flowers and fruit together in eighty shops, whose patron Khabil Irmagham — girded by Ins Ben Malek — used to bring baskets of flowers and fruit as presents to the Prophet and his family and is buried at Taif. Their shops stand at Takht-ul-kala'a, Ak-serai, Sultan Mohammed and Aya Sofiyah before the gate of the Jebeh-khanah, where dishes of flowers and fruit are found at all seasons to be offered to the vezirs and great men; in the procession they carry on poles koshks imitating the koshk of the muhtasib and of the fruit market. In Lane's Cairo streets the rose-seller cries the singular cry 'The rose was a thorn; from the sweat of the Prophet it blossomed' — alluding to a miracle related of the Prophet — and the seller of henna-flowers cries 'Odours of paradise! O flowers of the henna!'"
  ur: "پھول فروش بازار اور گلی میں گلاب، کھلے پھول اور ٹہنیاں بیچتا تھا۔ اولیاء چلبی استنبول میں تین سو دکانوں پر آٹھ سو پھول کے سوداگر گنتا ہے جن کا پیر بابا رتن ہے، اور مزید تین سو جو پھول اور پھل دونوں بیچتے ہیں اسی دکانوں پر، جن کا پیر خابیل ارمغان ہے — انس بن مالک سے کمر بند باندھا — جو نبی اور اہلِ بیت کو پھولوں اور پھلوں کی ٹوکریاں ہدیہ لایا کرتا اور طائف میں مدفون ہے۔ ان کی دکانیں تخت القلعہ، آق سرائے، سلطان محمد اور آیا صوفیا میں جِبہ خانہ کے دروازے کے سامنے ہیں، جہاں ہر موسم میں پھولوں اور پھلوں سے بھری تھالیاں ملتی ہیں جو وزیروں اور بڑوں کو ہدیہ دی جاتی ہیں؛ جلوس میں وہ ستونوں پر کشک اٹھاتے جو محتسب کے کشک اور پھل بازار کے کشک کی نقل ہیں۔ لین کی قاہرہ کی گلیوں میں گلاب فروش عجیب پکار لگاتا ہے: «گلاب کانٹا تھا؛ نبی کے پسینے سے کھلا» — نبی سے منسوب ایک معجزے کی طرف اشارہ — اور حنّہ کے پھول بیچنے والا پکارتا ہے: «جنت کی خوشبویاں! حنّہ کے پھولو!»"
