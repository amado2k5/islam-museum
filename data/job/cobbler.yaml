craft:
  materials: [leather]
  techniques:
    ar: "يأمر الشيزري الإسكافية: أن يجوز لهم خياطة الحشو في الكعوب، لكن لا يخيطوا نعلاً تشقّقت في الدبغ ولا جلداً جديداً أو غير مدبوغ؛ وأن يفتلوا الخيط جيداً ولا يجاوز ذراعاً لئلا يهترأ ويضعف عند الجذب في الجلد؛ وألا يخيطوا بشعر الخنزير بل بألياف النخل أو شوارب الثعلب فهي خير؛ وألا يجعلوا في شباشب النساء ورقاً أو لباداً تصرّ إذا مشين — عادة نساء بغداد — فأمر المحتسب بمنع صنعها ولبسها."
    en: "Al-Shayzari's rules for the shoemakers: padding for the heels may be stitched, but they must not stitch a sole that split during tanning, nor new or untanned leather; the thread must be well twined and no longer than a cubit, or it frays and weakens as it is pulled through the leather; they must not sew with pig's bristles but with palm fibres or fox whiskers, which are better; and they must not put paper or felt into women's slippers so that they squeak — a fashion of the women of Baghdad — which the muhtasib must stop being made and worn."
    ur: "الشیزری کے اصول: ایڑیوں کی بھرائی سینا جائز ہے، مگر دباغت میں پھٹا تلوہ نہ کچا یا غیر دباغ شدہ چمڑا سیا جائے؛ دھاگا اچھی طرح بٹا ہو اور ایک ذرع سے زیادہ نہ ہو ورنہ چمڑے میں سے کھینچتے وقت گھس کر کمزور ہوتا ہے؛ سور کے بالوں سے نہ سیا جائے بلکہ کھجور کے ریشے یا لومڑی کے مونچھوں سے جو بہتر ہیں؛ اور عورتوں کی چپلوں میں کاغذ یا نمدہ نہ رکھا جائے کہ چلتے وقت چونچون کریں — بغداد کی عورتوں کی روش — جسے محتسب بنانے اور پہنے سے روکے۔"
