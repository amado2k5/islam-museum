summary:
  ar: "الإسكافي هو من يصنع الأحذية والنعال ويخيط الجلود. يأمر الشيزري الصنّاع ألا يكثروا الخرق القديمة حشواً بين البطانتين ولا بين النعل الداخلي والخارجي، وألا يخيطوا نعلاً تشقّق في الدبغ ولا جلداً غير مدبوغ، وأن يفتلوا الخيط جيداً وألا يزيد على ذراع، وألا يخيطوا بشعر الخنزير بل بألياف النخل أو شوارب الثعلب، وألا يحبسوا حذاء صاحبه إلا بشرط يوم معلوم. وفي إسطنبول إوليا جلبي للصنّاع أربعة آلاف رجل في ثلاثمئة وأربعين دكاناً ولهم سبعة معامل في سوق المرجان وامتياز سلطاني يعفيهم من سلطة غيرهم."
  en: "The iskafi made and sewed shoes and slippers. Al-Shayzari orders the makers not to stuff too many old rags between the linings or between the inner and outer soles, not to stitch a sole that split during tanning nor untanned leather, to twine the thread well and keep it under a cubit, to sew with palm fibres or fox whiskers rather than pig's bristles, and not to keep a customer's shoes beyond an agreed day. In Evliya's Istanbul the shoemakers numbered four thousand men in three hundred and forty shops, with seven factories in the Coral market and an imperial rescript exempting them from every other jurisdiction."
  ur: "اسکافی جوتے اور چپلیں بناتا اور چمڑا سیتا تھا۔ الشیزری صنعت کاروں کو حکم دیتا ہے کہ استر یا باطنی اور بیرونی تلوے کے درمیان پرانے چیتھڑے زیادہ نہ بھریں، دباغت میں پھٹا تلوہ یا کچا چمڑا نہ سئیں، دھاگا اچھی طرح بٹ کر ایک ذرع سے کم رکھیں، سور کے بال کے بجائے کھجور کے ریشے یا لومڑی کے مونچھوں سے سئیں، اور گاہک کے جوتے طے شدہ دن سے زیادہ نہ روکیں۔ اولیاء چلبی کے استنبول میں جوتے ساز تین سو چالیس دکانوں پر چار ہزار آدمی تھے جن کے سات کارخانے مرجان کے بازار میں تھے اور شاہی فرمان انہیں ہر دوسری مجسٹریسی سے مستثنیٰ کرتا تھا۔"
