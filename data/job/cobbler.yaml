summary:
  ar: "الإسكافي هو من يصنع الأحذية والنعال ويخيط الجلود. يأمر الشيزري الصنّاع ألا يكثروا الخرق القديمة حشواً بين البطانتين ولا بين النعل الداخلي والخارجي، وألا يخيطوا نعلاً تشقّق في الدبغ ولا جلداً غير مدبوغ، وأن يفتلوا الخيط جيداً وألا يزيد على ذراع، وألا يخيطوا بشعر الخنزير بل بألياف النخل أو شوارب الثعلب، وألا يحبسوا حذاء صاحبه إلا بشرط يوم معلوم. وفي إسطنبول إوليا جلبي للصنّاع أربعة آلاف رجل في ثلاثمئة وأربعين دكاناً ولهم سبعة معامل في سوق المرجان وامتياز سلطاني يعفيهم من سلطة غيرهم."
  en: "The iskafi made and sewed shoes and slippers. Al-Shayzari orders the makers not to stuff too many old rags between the linings or between the inner and outer soles, not to stitch a sole that split during tanning nor untanned leather, to twine the thread well and keep it under a cubit, to sew with palm fibres or fox whiskers rather than pig's bristles, and not to keep a customer's shoes beyond an agreed day. In Evliya's Istanbul the shoemakers numbered four thousand men in three hundred and forty shops, with seven factories in the Coral market and an imperial rescript exempting them from every other jurisdiction."
  ur: "اسکافی جوتے اور چپلیں بناتا اور چمڑا سیتا تھا۔ الشیزری صنعت کاروں کو حکم دیتا ہے کہ استر یا باطنی اور بیرونی تلوے کے درمیان پرانے چیتھڑے زیادہ نہ بھریں، دباغت میں پھٹا تلوہ یا کچا چمڑا نہ سئیں، دھاگا اچھی طرح بٹ کر ایک ذرع سے کم رکھیں، سور کے بال کے بجائے کھجور کے ریشے یا لومڑی کے مونچھوں سے سئیں، اور گاہک کے جوتے طے شدہ دن سے زیادہ نہ روکیں۔ اولیاء چلبی کے استنبول میں جوتے ساز تین سو چالیس دکانوں پر چار ہزار آدمی تھے جن کے سات کارخانے مرجان کے بازار میں تھے اور شاہی فرمان انہیں ہر دوسری مجسٹریسی سے مستثنیٰ کرتا تھا۔"
  es: "Los iskafi fabricaban y cosían zapatos y zapatillas. Al-Shayzari ordenaba a los fabricantes que no metieran demasiados trapos viejos entre los forros ni entre las suelas interiores y exteriores, que no cosieran una suela que se hubiera rajado durante el curtido ni cuero sin curtir, que retorcieran bien el hilo y lo mantuvieran por debajo de un codo, que cosieran con fibras de palma o bigotes de zorro en lugar de cerdas de cerdo, y que no se quedaran con los zapatos de un cliente más allá del día acordado. En el Estambul de Evliya, los zapateros sumaban cuatro mil hombres en trescientas cuarenta tiendas, con siete fábricas en el mercado del Coral y un decreto imperial que los eximía de toda otra jurisdicción."
  fr: "Les iskafi fabriquaient et cousaient des chaussures et des pantoufles. Al-Shayzari leur ordonnait de ne pas bourrer trop de vieux chiffons entre les doublures ni entre les semelles intérieure et extérieure, de ne pas coudre une semelle fendue lors du tannage ni du cuir non tanné, de bien tresser le fil et de le maintenir sous une coudée, de coudre avec des fibres de palmier ou des moustaches de renard plutôt qu'avec des soies de porc, et de ne pas garder les chaussures d'un client au-delà d'une journée convenue. À Istanbul, sous le règne d'Evliya, on comptait quatre mille cordonniers répartis dans trois cent quarante boutiques, sept ateliers au marché du Corail, et un rescrit impérial les exemptait de toute autre juridiction."
  tr: "Ayakkabıcı, ayakkabı ve terlik yapan ve deri diken kişidir. Sultan, zanaatkârlara, astarlar arasına veya iç ve dış tabanlar arasına aşırı miktarda eski bez koymamalarını, tabaklama sırasında çatlamış veya tabaklanmamış deriye taban dikmemelerini, ipliği iyice bükmelerini ve bir kol uzunluğunu geçmemelerini, domuz kılı yerine palmiye lifi veya tilki bıyığı ile dikmelerini ve bir sahibinin ayakkabısını belirli bir gün dışında teslim etmemelerini emretmiştir. İstanbul'da Evliya Çelebi semtinde üç yüz kırk dükkânda dört bin zanaatkâr çalışmakta olup, Mercan Çarşısı'nda yedi atölyeye sahipler ve bu atölyeler, kendilerini başkalarının otoritesinden muaf tutan bir sultanlık ayrıcalığına sahiptir."
  id: "Seorang tukang sepatu adalah seseorang yang membuat sepatu dan sandal serta menjahit kulit. Sultan memerintahkan para pengrajin untuk tidak menggunakan kain bekas yang berlebihan sebagai bantalan di antara lapisan dalam atau di antara sol dalam dan luar, tidak menjahit sol yang retak selama penyamakan atau kulit yang belum disamak, untuk memintal benang dengan baik dan tidak melebihi panjang lengan, tidak menjahit dengan bulu babi tetapi dengan serat palem atau kumis rubah, dan tidak menahan sepatu pemilik kecuali untuk hari yang ditentukan. Di Istanbul, distrik Evliya Çelebi memiliki empat ribu pengrajin di tiga ratus empat puluh toko, dan mereka memiliki tujuh bengkel di Pasar Karang, dengan hak istimewa sultan yang membebaskan mereka dari otoritas orang lain."
