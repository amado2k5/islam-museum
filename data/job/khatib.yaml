summary:
  ar: "الخطيب من يعتلي المنبر فيخطب الجمعة والعيدين؛ وكانت الخطابة فناً عربياً جاهلياً أصيلاً، ثم صارت الخطبة في الإسلام جزءاً من شعيرة الجمعة اتفق الفقهاء على فرضيتها. خطب النبي والخلفاء الراشدون بأنفسهم، ثم لمّا اتسعت الدولة وتباعد الخلفاء عن الناس في العصر العباسي عُيِّن عالمٌ خطيباً، وصار ذكر اسم الخليفة ثم السلطان في الخطبة علامة السيادة — فمن أُنزل اسمه من المنابر انتهت طاعته. وتحدد الشافعية والحنابلة أركان الخطبة وشروطها على الخطيب: من نية وطهارة وسماع الجماعة، وتسنّ الجلوس بين الخطبتين وقصرهما والاتكاء على عصا."
  en: "The khatib mounts the minbar and delivers the sermons of Friday and the two festivals. Oratory was already a prized art of pre-Islamic Arabia; in Islam the khutba became part of the Friday observance, and the jurists agree it is obligatory. The Prophet and the Rashidun preached in person; when the state grew and the Abbasid caliphs withdrew from the people, a scholar was appointed khatib, and naming the caliph — then the sultan — in the sermon became the mark of sovereignty: a ruler whose name was dropped from the minbars had lost his obedience. The Shafi'is and Hanbalis set the sermon's pillars and the khatib's conditions: intention, purity, an audience that hears, a sit between the two sermons, brevity, and leaning on a staff."
  ur: "خطیب وہ ہے جو منبر پر چڑھ کر جمعہ اور عیدوں کی تقریر کرتا ہے۔ خطابت جاہلی عرب کا پرانا ہنر تھی؛ اسلام میں خطبہ جمعے کی شعیر کا حصہ بنا اور فقہاء اس کے فرض ہونے پر متفق ہیں۔ نبی اور خلفائے راشدین خود خطبہ دیتے تھے؛ ریاست پھیلی اور عباسی خلفاء عوام سے دور ہوئے تو ایک عالم کو خطیب مقرر کیا گیا، اور خطبے میں خلیفہ پھر سلطان کا نام لینا فرمانروائی کی علامت بن گیا — جس کا نام منبروں سے گر گیا اس کی اطاعت ختم۔ شافعی اور حنبلی خطبے کے ارکان اور خطیب کی شرائط بیان کرتے ہیں: نیت، طہارت، سننے والی جماعت، دونوں خطبوں کے درمیان بیٹھنا، اختصار اور لکڑی کے سہارے۔"
