summary:
  ar: "صانع السلاح والدرع هو من يصوغ السيوف والرماح والخناجر والتُّرس والدروع: الزَّردية من الحلق المنظوم، والجَوْشَن المرقَّع بالصفائح، والكَزَغَند المبطّن بالقطن والمقوّى بالحلق أو الصفائح. يبيّن غوريليك أن السلاح الدفاعي الإسلامي المحفوظ لا يُؤرّخ قبل القرن الثالث عشر تقريباً، وأن صورته تُستقرأ من الكتب والصور: ورث المسلمون عن بيزنطة الدروع الرقيعة القصيرة وقمصان الزرد، وعن الفرس الساسانيين البدن الكامل من خوذة وأغطية عنق، ثم جاءت موجات سهوب آسيا الوسطى بأنواعها الرقيعة الطويلة. وفي إسطنبول إوليا للسّيافين ⁦(صنّاع السيوف)⁩ ألف رجل وثمانية بمئتين وخمس دكاكين بيرهم داود، وفي زمن النبي عسير الهندي، وتقدّموا الحرفيين جميعاً لأن كل بيت مسلم لا يستغني عن السيف؛ وصنّاع الدروع القدامى أربعون بأربع دكاكين وإن كان في إسطنبول أكثر من ألف يعملون للجيش والعسكر، بيرهم مسلم الحدادي الذي صنع درعاً أهداها للنبي فلبسها بأُحُد؛ وصنّاع الرماح أربعمئة بمئة وخمس دكاكين، وصنّاع الخناجر ثلاثون بعشر، وصنّاع التُّرس ⁦(قلقانجيان)⁩ ثلاثون بعشر دكاكين تُنسب إليهم تروس حلب المشهورة في فارس والتركية."
  en: "The armourer forged swords, lances, daggers, shields and body armour: the zardiyya of interlinked mail, the lamellar jawshan plated in rows, the quilted gazakand reinforced with mail or plates. Gorelik shows that surviving Islamic defensive arms are rarely datable before the thirteenth century, so the armourer's work is read from texts and images: the Muslims inherited the Byzantine short lamellar and scale coat with the mail shirt, and the Sasanian Iranian full harness of helmet and aventail, then the waves of the Central Asian steppe brought their own lamellar tradition. In Evliya's Istanbul the sword-cutlers were a thousand and eight men in two hundred and five shops, their patron David and, in the Prophet's time, Esir the Indian; they took precedence over all craftsmen because every Muslim house needs a sword. The old cuirass-makers were only forty men in four shops in the city though more than a thousand worked for the army and the camp; their patron Moslem Hadadi made a cuirass presented to the Prophet and worn at Uhud; the lance-makers were four hundred men in a hundred and five shops, the dagger-smiths thirty in ten, and the shield-makers (Kalkanjian) thirty men in ten shops, to whom the celebrated shields of Aleppo belong."
  ur: "سلاح ساز اور زرہ ساز تلوار، نیزہ، خنجر، ڈھال اور زرہیں بناتا ہے: کڑیوں کی زردیہ، تہ دار تختوں کی جوشن، اور روئی سی بُنا جس میں زرہ یا تختیاں ہو، گزگند۔ گوریلک بتاتا ہے کہ بچی ہوئی اسلامی دفاعی اسلحہ عموماً تیرہویں صدی سے پہلے کی نہیں ملتی اس لیے یہ ہنر کتابوں اور تصویری شواہد سے پڑھا جاتا ہے: مسلمانوں کو بازنطین سے چھوٹی لمیلر و سکیل زرہ اور زرہ قمیص ملی، ساسانی ایران سے پورا جسمانی سامان خوذ و گردن کا غطاء، اور وسط ایشیائی خانہ بدوشوں سے ان کی لمیلر روایت۔ اولیاء کے استنبول میں تلوار ساز ایک ہزار آٹھ آدمی دو سو پانچ دکانیں، پیر داؤد اور نبی کے زمانے میں اسیر ہندی؛ انہیں سب دستکاروں پر فضیلت ملی کہ ہر مسلمان گھر میں تلوار لازم ہے۔ شہر میں پرانے زرہ ساز صرف چالیس آدمی چار دکانیں مگر فوج اور لشکر کے لیے ہزار سے زیادہ کام کرتے؛ ان کا پیر مسلم حدادی ہے جس نے زرہ بنا کر پیش کی جو احد میں پہنی گئی؛ نیزہ ساز چار سو آدمی ایک سو پانچ دکانیں، خنجر ساز تیس آدمی دس، اور ڈھال ساز ⁦(قلقانجیان)⁩ تیس آدمی دس دکانیں جن سے حلب کی مشہور ڈھالیں جڑی ہیں۔"
  es: "El armero forjaba espadas, lanzas, dagas, escudos y armaduras corporales: la zardiyya de malla entrelazada, el jawshan lamelar con placas en filas, el gazakand acolchado reforzado con malla o placas. Gorelik muestra que las armas defensivas islámicas que sobreviven rara vez se pueden datar antes del siglo XIII, por lo que el trabajo del armero se lee a partir de textos e imágenes: los musulmanes heredaron la cota de malla corta bizantina y de escamas con la camisa de malla, y el arnés completo sasánida iraní de casco y aventail, luego las olas de la estepa de Asia Central trajeron su propia tradición lamelar. En el Estambul de Evliya los cortadores de espadas eran mil ocho hombres en doscientos cinco talleres, su patrón David y, en tiempos del Profeta, Esir el Indio; tenían precedencia sobre todos los artesanos porque cada casa musulmana necesita una espada. Los antiguos fabricantes de corazas eran solo cuarenta hombres en cuatro talleres en la ciudad aunque más de mil trabajaban para el ejército y el campamento; Su patrón, el musulmán Hadadi, hizo una coraza que se le presentó al Profeta y que se usó en Uhud; los fabricantes de lanceros eran cuatrocientos hombres en ciento cinco talleres, los herreros de dagas treinta en diez, y los fabricantes de escudos (Kalkanjian) treinta hombres en diez talleres, a quienes pertenecen los célebres escudos de Alepo."
  fr: "L'armurier forgeait des épées, des lances, des poignards, des boucliers et des armures: la zardiyya en cotte de mailles, la jawshan lamellaire plaquée en rangées, le gazakand matelassé renforcé de mailles ou de plaques. Gorelik montre que les armes défensives islamiques qui nous sont parvenues sont rarement datables avant le XIIIe siècle; le travail de l'armurier est donc déduit de textes et d'images: les musulmans héritèrent du manteau byzantin court à lamelles et à écailles avec la cotte de mailles, et de l'armure complète sassanide iranienne avec casque et aventail, puis les vagues des steppes d'Asie centrale apportèrent leur propre tradition lamellaire. À Istanbul, sous le règne d'Evliya, les couteliers d'épées étaient mille huit hommes répartis dans deux cent cinq ateliers, sous la protection de David et, à l'époque du Prophète, d'Esir l'Indien; ils avaient la priorité sur tous les artisans car chaque foyer musulman se devait d'avoir une épée. Les anciens fabricants de cuirasses n'étaient que quarante hommes dans quatre ateliers de la ville, bien que plus d'un millier travaillaient pour l'armée et les camps. Leur mécène, le musulman Hadadi, a réalisé une cuirasse offerte au Prophète et portée à Uhud; les fabricants de lances étaient quatre cents hommes dans cent cinq ateliers, les forgerons de poignards trente dans dix, et les fabricants de boucliers (Kalkanjian) trente hommes dans dix ateliers, à qui appartiennent les célèbres boucliers d'Alep."
