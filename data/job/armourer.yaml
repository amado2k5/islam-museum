  techniques:
    ar: "يرتّب غوريليك ما صنعه الدرّوع عبر القرون: الزردية قميص الحلق المنظوم، والجَوْشَن الرقيع الذي يُلبس فوق القميص القصير، والكَزَغَند ثوب القطن المبطّن الذي يقوّى أحياناً بحلق أو صفائح معدنية ويُلبس وحده أو تحت المعدن، والتُّرس المستديرة والخوذ المحدّبة والمخروطية ذات الأغطية المعدنية أو الزردية أو الجلدية أو القماشية، والنادرة الدروع القشورية. وفي إسطنبول يعرض السّيافون في الموكب سيوفاً من أعمال المصانع القديمة القسطنطينية التي تُستخرج حديدتها من غلطة سراي، ومن أعمال مستقيم الشامي وخلقان الهندي وصنوف سنجام ومقراري وزلّيحّام وكسرى وسوزك ودمردلّسي وسلامية ومصري؛ ويمرّون يلعبون بالسيوف العارية في آذانهم وحلوقهم وبطونهم ويتصارعون في صفوف. ويذكر إوليا أن السلطان مراد الرابع لا يستعمل إلا سيوف أصفهان أو سيوف داوود الأصمّ الذي جعله بمرسوم رئيس السّيافين."
    en: "Gorelik orders the armourer's products across the centuries: the zardiyya mail shirt, the lamellar jawshan worn over the short mail coat, the quilted-cotton gazakand sometimes reinforced with mail or layered metal plates and worn alone or under metal, the favoured round shields, the rounded and conical helmets with forged-metal or mail or leather or fabric aventails, and the rarer scale armour. In Istanbul the sword-cutlers pass in the procession showing blades from the old Constantinople factory, whose iron was dug at Galata-serai, and the work of Mustaqim the Syrian and Khalkan the Indian, in the types named Senjam, Makrari, Zillehham, Kessed, Suzik, Demirdelissi, Selamieh and Misri; they pass sticking naked swords into their ears, throats and stomachs and miming fights in files. Evliya adds that Sultan Murad IV used only blades of Isfahan or of deaf David, whom he made chief of the sword-cutlers by imperial rescript."
    ur: "گوریلک صدیوں میں زرہ ساز کی مصنوعات ترتیب دیتا ہے: کڑیوں کی زردیہ قمیص، چھوٹی زرہ پر پہنی جانے والی تہ دار جوشن، روئی کا گزگند جو بعض اوقات زرہ یا تختوں سے مضبوط ہو کر تنہا یا دھات کے نیچے پہنا جاتا، پسندیدہ گول ڈھالیں، گول اور مخروطی خود جن کے گردن کے غطاء دھات، زرہ، چمڑے یا کپڑے کے، اور کم ملنے والی چھلکے دار زرہ۔ استنبول میں تلوار ساز جلوس میں پرانے قسطنطین کارخانے کی تلواریں دکھاتے جن کی لوہا غلطہ سرائے سے نکلتی، اور شامی مستقیم اور ہندی خلقان کے کام — سنجام، مقراری، زلہام، کسد، سوزک، دمیردلسی، سلامیہ اور مصری ناموں میں؛ وہ جاتی ہٹی تلواریں کانوں، گلوں اور پیٹوں میں لگاتے اور قطار میں لڑائی کا مظاہرہ کرتے نکلتے۔ اولیاء لکھتا ہے کہ سلطان مراد چہارم اصفہان یا بہرے داؤد کی ہی تلواریں استعمال کرتا اور اسے فرمان سے تلوار سازوں کا سردار بنا دیا۔"
