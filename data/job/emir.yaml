summary:
  ar: "الأمير القائد والوالي في أول الدولة الإسلامية؛ استُعمل للقائد العسكري وللذي يحكم إقليماً، وجمع صلاحيات إدارية ومالية وقضائية وعسكرية واسعة في العهد الأموي، ثم قلّصها العباسيون بفصل المال عن الإمارة، حتى صار الأمراء شبه مستقلّين يكتفون بذكر الخليفة في الخطبة وعلى السكة."
  en: "The emir was the commander and provincial ruler of the early Islamic state; the name covered the army commander and the man governing a province, combining wide administrative, fiscal, judicial and military powers under the Umayyads, curbed by the Abbasids through separating finance from the emirate, until emirs became semi-independent dynasts content to name the caliph in khutba and coinage."
  ur: "امیر ابتدائی اسلامی ریاست کا کمانڈر اور صوبائی حاکم تھا؛ نام فوجی سردار اور صوبہ بھر کے حکمران دونوں پر بولا جاتا، اموی دور میں وسیع انتظامی، مالی، عدالتی اور فوجی اختیارات جمع تھے، عباسیوں نے مال کو امارت سے الگ کر کے کم کیے، یہاں تک کہ امیر نیم خود مختار خاندان بن گئے جو صرف خطبہ اور سِکّے میں خلیفہ کا نام رکھتے۔"
  es: "El emir era el comandante y gobernante provincial del primer estado islámico; el nombre abarcaba al comandante del ejército y al hombre que gobernaba una provincia, combinando amplios poderes administrativos, fiscales, judiciales y militares bajo los Omeyas, limitados por los Abasíes mediante la separación de las finanzas del emirato, hasta que los emires se convirtieron en dinastías semiindependientes que se contentaban con nombrar al califa en la jutba y en la acuñación de monedas."
  fr: "L'émir était le commandant et le dirigeant provincial du premier État islamique; ce terme désignait à la fois le commandant de l'armée et l'homme qui gouvernait une province, combinant de vastes pouvoirs administratifs, fiscaux, judiciaires et militaires sous les Omeyyades, pouvoirs limités par les Abbassides qui ont séparé les finances de l'émirat, jusqu'à ce que les émirs deviennent des dynastes semi-indépendants se contentant de nommer le calife dans la khutba et sur les pièces de monnaie."
