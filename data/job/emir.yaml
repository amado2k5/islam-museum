places:
  - { place: place/damascus, note: "Under the Umayyads the emir governed a province with near-caliphal powers: he led the prayer, appointed qadis, ran the shurta, the barid and the mint, and coined silver bearing his own name.", sources: [source/tdv-emir-idareci] }
  - { place: place/kufa, note: "In Kufa and the eastern provinces the populace looked on emirs as they would a kethüda or a shah — the provincial ruler as effective king of his territory.", sources: [source/tdv-emir-idareci] }
  - { place: place/baghdad, note: "Under the Abbasids emirs were mostly chosen from the bureaucracy, held short terms, shared power with the finance 'amil and were watched by the sahib al-barid; from the ninth century hereditary emirs (Aghlabids, Tahirids, Samanids) confined the caliph's share to khutba and coin.", sources: [source/tdv-emir-idareci] }
