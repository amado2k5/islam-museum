summary:
  ar: "شيخ القبيلة رئيسها المعروف بفضله أو ماله، تثقل مسؤولياته وإن قلّت امتيازاته: يجمع شمل القبيلة في الحرب والسلم ويقضي حاجاتها، ولا يملك عليها سلطاناً مطلقاً إذ يشاور مجلس كبار الأسر في المهمات، فيحكم أكثر مما يأمر. عند العرب كان يقال له شيخ أو سيد أو رئيس، وعند العثمانيين أدار البويّ أميرُه «بوي بيي» والعشيرة «مير عشيرة» أو كتخدا، وغلب الإرث على الاختيار. وكان عليه أن يكون صبوراً كريماً مضيافاً، شجاعاً يقدم نفسه للخطر في مصلحة القبيلة."
  en: "The tribal shaykh is the man recognised as the tribe's head for his merit or wealth; his burdens are heavy though his privileges are few. He holds the tribe together in war and peace and sees to its needs, yet wields no absolute authority — great matters go before the council of family elders, so he arbitrates more than he commands. The Arabs called him shaykh, sayyid or ra'is; among the Ottomans the boy was run by its boy beyi and the aşiret by its mîr-aşiret or kethüdâ, the office usually passing by inheritance. He had to be patient, generous and hospitable, and brave enough to risk himself for the tribe."
  ur: "شیخِ قبیلہ وہ شخص ہے جسے اس کی قابلیت یا دولت کی بنا پر قبیلے کا سردار مانا جاتا ہے؛ اس کی ذمہ داریاں بھاری ہیں اگرچہ مراعات کم۔ وہ جنگ اور امن میں قبیلے کو یکجا رکھتا اور اس کی ضرورتیں پوری کرتا ہے، مگر اس پر مطلق اختیار نہیں — بڑے معاملے خاندانوں کے بزرگوں کے مجلس میں طے ہوتے ہیں، اس لیے وہ حکم دینے سے زیادہ ثالثی کرتا ہے۔ عرب اسے شیخ، سید یا رئیس کہتے تھے؛ عثمانیوں میں بوئے کو بوئے بئی اور عشیرے کو میر عشیرہ یا کتخدا چلاتا تھا، اور یہ عہدہ عموماً موروثی تھا۔ اسے صبور، سخی اور مہمان نواز ہونا چاہیے تھا اور قبیلے کے مفاد میں اپنی جان داؤ پر لگانے کی ہمت۔"
  es: "El shaykh tribal es el hombre reconocido como jefe de la tribu por sus méritos o riquezas; sus responsabilidades son pesadas, aunque sus privilegios son pocos. Mantiene unida a la tribu en tiempos de guerra y paz y atiende a sus necesidades, pero no ejerce autoridad absoluta: los asuntos importantes se someten al consejo de ancianos de la familia, por lo que arbitra más de lo que manda. Los árabes lo llamaban shaykh, sayyid o ra'is; entre los otomanos, el joven era dirigido por su beyi y el aşiret por su mîr-aşiret o kethüdâ, cargo que generalmente se transmitía por herencia. Debía ser paciente, generoso y hospitalario, y lo suficientemente valiente como para arriesgarse por la tribu."
  fr: "Le cheikh tribal est l'homme reconnu comme chef de la tribu pour son mérite ou sa richesse; ses responsabilités sont lourdes, mais ses privilèges sont rares. Il assure la cohésion de la tribu en temps de guerre comme en temps de paix et veille à ses besoins, sans toutefois détenir une autorité absolue: les décisions importantes sont soumises au conseil des anciens de la famille. Son rôle est donc plus celui d'arbitre que de dirigeant. Les Arabes l'appelaient cheikh, sayyid ou ra'is; chez les Ottomans, le jeune chef était dirigé par son beyi et l'aşiret par son mîr-aşiret ou kethüdâ, cette fonction se transmettant généralement par héritage. Il devait être patient, généreux et hospitalier, et suffisamment courageux pour risquer sa vie pour la tribu."
