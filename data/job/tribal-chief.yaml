  mode: hereditary-family
  certification: "Recognition came with the man, not the office: personal merit or wealth made a chief, and among the nomads the choice of aşiret beys within the boy beyi's authority was generally hereditary. There was no investiture; the test was whether the council of family elders and the tribe followed him."
  duration: "Lifelong while he held the tribe's confidence; failure could mean removal — and for members who disgraced the tribe, the khal' penalty cast them out until another tribe, family or patron took them under protection."
