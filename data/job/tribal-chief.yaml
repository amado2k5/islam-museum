  - { place: place/mecca, note: "Jahiliyya Arabian tribes obeyed no organised polity: each tribe's shaykh kept it together in war and peace, arbitred more than commanded, and the tribe's menzil territory and hilf pacts defined its world.", sources: [source/tdv-seyh, source/tdv-kabile] }
  - { place: place/istanbul, note: "Ottoman registers graded the nomad order as boy ⁦(tribe)⁩, aşiret, cemaat, oymak, mahalle, oba; the boy beyi ran the boy while the mîr-aşiret or kethüdâ ran the aşiret, generally by hereditary succession, and the state reorganised tribes as kethüdâlıks to control their routes.", sources: [source/tdv-asiret] }
  - { place: place/mogadishu, note: "Ibn Battuta, visiting Mogadishu in 1331 in the reign of Sultan Abu Bakr b. Umar, records that the sultan there was called shaykh.", sources: [source/tdv-seyh] }
