summary:
  ar: "القَبّاني هو الوزّان العمومي الذي يضبط ميزان السوق. تجعل كتب الحسبة إصلاح الموازين والمكاييل والأوزان أول أعمال المحتسب: يأمر ابن الأخوة أصحاب الموازين أن يُبقوها نظيفة من الزيت والوسخ، وأن تُترَك حتى تسكن قبل الوزن، وألا تُعلَّق باليد، وألا يُلمس الكفّة بالإبهام، ويعدّد حيل الغشّ — النفخ في كفّة الذهب، وشعرة رقيقة تُشدّ بأحد الجانبين، وميزان «المؤدّي» ذي اللسان من حديد مطاوع — ويستبغض القسطاس القبطي في البضائع الثقيلة. ويصف الشيزري الميزان الأصحّ وخداع الحبّات المنقوعة في الزيت والمغروسة بالإبر، ودار العيار التي تُختَم فيها الأوزان بعد اختبارها ويُدعى التجار إليها بين حين وآخر لتُفحَص موازينهم. وفي إسطنبول إوليا يقف الوزّانون عند الجمارك الكبرى مع الكتّاب والسنسرة والصيارفة، ويمرّ القنطرجية على عربات يوزنون عليها أحمال البضائع ويسجّلونها لحسابات التجار، ولمفتّش وزن الحرير ⁦(ميزاني حرير)⁩ أن يُوزَن أمامه كل حرير ويأخذ العشر، وفي دار الضرب وزّانون يزنون كل شيء ويحفظون حساباً دقيقاً. وفي الإسكندرية يسجّل تشالكرافت أنظمة القبّانيين وضرائب الوزن في عهد الخديوي إسماعيل، ودعوى حمّالين محطات الوزن ⁦(طائفة عطالين قبّانية)⁩ ضد الوزّانين الذين يستأجرون من خارج الطائفة، وخلاف شيخ الوزّانين في الدقهلية."
  en: "The qabbani was the public weigher who kept the market's balance honest. The hisba books make the reform of scales, measures and weights the first duty of the muhtasib: Ibn al-Ukhuwwa orders owners of scales to keep them free of oil and dirt, to let them come to rest before weighing, never to suspend them from the hand and never to touch the pan with the thumb, and he lists the cheats — blowing into the gold pan, a fine strand of hair fastened to one side, and the al-Mu'addi balance with a steel beam but a tongue of soft iron — while disapproving of the Coptic steelyard for heavy goods. Al-Shayzari describes the true balance and the frauds of grain-weights soaked in oil and planted with needles, and the Dar al-'Iyar where weights were stamped after testing and to which merchants were periodically summoned to have their scales verified. In Evliya's Istanbul weighers stand at the great custom-house among the writers, brokers and bankers; the quintal-men (Kantarji) pass on wagons weighing bales of merchandise to the account of different merchants; the inspector of silk-weighing (Mizani-harir) has all silk weighed before him and takes a tenth; and at the mint the weighers weigh everything and keep an exact account. For Alexandria, Chalcraft records the codified regulations for the qabbani weighers, the weighing taxes of Isma'il's reign, the porters of the weigh stations (ta'ifat 'attalin qabbaniyya) petitioning against weighers who hired outside the guild, and the contested shaykhate of the Daqahliyya weighers."
  ur: "قبانی بازار کا ترازو درست رکھنے والا عوامی تولنے والا ہے۔ حسبہ کی کتابیں ترازو، پیمانے اور وزن کی اصلاح کو محتسب کی پہلی ذمے داری قرار دیتی ہیں: ابن الاخوہ ترازو والوں کو حکم دیتا کہ انہیں تیل اور میل سے صاف رکھیں، تولنے سے پہلے ساکت ہونے دیں، ہاتھ سے نہ لٹکائیں اور پلڑے کو انگوٹھا نہ لگائیں؛ اور دھوکے گنواتا ہے — سونے کے پلڑے میں پھونک مارنا، ایک طرف باریک بال باندھنا، اور «مؤدی» ترازو جس کا دباؤ نرم لوہے کا ہو — اور بھاری مال کے لیے قبطی قپان کو ناپسند کرتا ہے۔ الشیزری درست ترازو کی صفت اور تیل میں بھیگے اور سوئی گاڑے دانوں کے دھوکے بتاتا ہے، اور دار العیار جہاں وزن آزما کر مہر لگتے اور جہاں تاجر وقتہ فوقتاً اپنی ترازوئیں جانچ کو لاتے۔ اولیاء کے استنبول میں تولنے والے بڑے محصول خانے پر کاتبوں، دلالوں اور صرافوں کے ساتھ کھڑے ہیں؛ قنطرجی گاڑیوں پر چل کر اجناس کے گٹھڑ تول کر تاجروں کے حساب لکھتے؛ ریشم تول کے ناظر ⁦(میزانی حریر)⁩ کے آگے ہر ریشم تلی جاتی اور وہ دہائی لیتا؛ اور ضرب خانے میں تولنے والے ہر چیز تول کر درست حساب رکھتے۔ اسکندریہ کے لیے چالکرافت قبانیوں کے مدون قواعد، اسماعیل کے زمانے کے محصولِ وزن، محطۂ وزن کے ہمالوں ⁦(طائفۃ عطالین قبانیہ)⁩ کی درخواست کہ تولنے والے طائفہ سے باہر کے آدمی رکھتے، اور دقہلیہ کے تولنے والوں کے متنازع شیخ پن کی روایت رکھتا ہے۔"
  es: "El qabbani era el pesador público que mantenía la balanza honesta del mercado. Los libros de la hisba establecen la reforma de las balanzas, medidas y pesas como el primer deber del muhtasib: Ibn al-Ukhuwwa ordena a los dueños de balanzas que las mantengan libres de aceite y suciedad, que las dejen reposar antes de pesar, que nunca las cuelguen de la mano y que nunca toquen el platillo con el pulgar, y enumera los fraudes —soplando en el platillo de oro, un fino mechón de cabello sujeto a un lado, y la balanza de al-Mu'addi con una viga de acero pero una lengüeta de hierro dulce— al tiempo que desaprueba el patio de acero copto para mercancías pesadas. Al-Shayzari describe la balanza verdadera y los fraudes de las pesas de grano empapadas en aceite y plantadas con agujas, y el Dar al-'Iyar donde las pesas se sellaban después de ser probadas y a donde los comerciantes eran convocados periódicamente para que se verificaran sus balanzas. En el Estambul de Evliya, los pesadores se sitúan en la gran aduana entre escribanos, corredores y banqueros; los quintales (Kantarji) transportan en carros fardos de mercancías a nombre de distintos mercaderes; el inspector de pesaje de seda (Mizani-harir) hace pesar toda la seda ante sí y se queda con la décima parte; y en la ceca, los pesadores pesan todo y llevan una contabilidad exacta. En cuanto a Alejandría, Chalcraft registra las normas codificadas para los pesadores qabbani, los impuestos de pesaje del reinado de Isma'il, las peticiones de los porteadores de las estaciones de pesaje (ta'ifat 'attalin qabbaniyya) contra los pesadores que contrataban personal ajeno al gremio, y la disputada shaykhate de los pesadores Daqahliyya."
  fr: "Le qabbani était le peseur public chargé de garantir l'exactitude des balances du marché. Les ouvrages de la hisba font de la réforme des balances, des mesures et des poids le premier devoir du muhtasib: Ibn al-Ukhuwwa ordonne aux propriétaires de balances de les maintenir propres et exemptes d'huile et de saleté, de les laisser reposer avant la pesée, de ne jamais les suspendre à la main et de ne jamais toucher le plateau avec le pouce. Il énumère les fraudes – souffler dans le plateau à or, utiliser une fine mèche de cheveux fixée sur le côté, et la balance al-Mu'addi avec un fléau en acier mais un doigt en fer doux – tout en désapprouvant le système de pesage copte pour les marchandises lourdes. Al-Shayzari décrit la véritable balance et les fraudes liées aux poids à grains trempés dans l'huile et piqués d'aiguilles, ainsi que le Dar al-'Iyar, où les poids étaient marqués après test et où les marchands étaient convoqués périodiquement pour faire vérifier leurs balances. Dans l'ouvrage d'Evliya sur Istanbul, les peseurs se tiennent à la grande douane parmi les écrivains, les courtiers et les banquiers. Les porteurs de quintaux (Kantarji) transportent par chariots des ballots de marchandises pour le compte de différents marchands; l’inspecteur du pesage de la soie (Mizani-harir) fait peser toute la soie devant lui et en prélève un dixième; et à l’atelier monétaire, les peseurs pèsent tout et tiennent une comptabilité précise. Pour Alexandrie, Chalcraft relate les règlements codifiés pour les peseurs qabbani, les taxes de pesage du règne d’Ismaïl, les pétitions des porteurs des stations de pesage (ta’ifat ’attalin qabbaniyya) contre les peseurs qui embauchaient en dehors de la guilde, et le cheikhat contesté des peseurs Daqahliyya."
  tr: "Kabbani, pazar terazilerini düzenleyen kamu tartımcısıdır. Pazar denetimi (hisbah) üzerine yazılmış kitaplar, terazilerin, ölçülerin ve ağırlıkların düzeltilmesini muhtasib'in (pazar müfettişi) ilk görevi olarak belirtir. İbn el-Ukhuwwah, terazi kullananlara terazilerini yağ ve kirden temiz tutmalarını, tartmadan önce yerleşmelerini beklemelerini, elle asmamalarını ve kefeye başparmakla dokunmamalarını öğütler. Altın kefeye üflemek, bir tarafa bağlanmış ince bir saç teli ve yumuşak demir dilli \"mu'addi\" terazisi gibi hile yöntemlerini sıralar ve ağır mallar için kullanılan Kıpti terazisini onaylamaz. El-Şeyzari, en doğru teraziyi ve yağa batırılmış ve iğnelerle donatılmış tanelerin hilesini anlatır. Ayrıca, ağırlıkların test edildikten sonra damgalandığı ve tüccarların terazilerinin periyodik olarak kontrol edilmesi için çağrıldığı \"dar al-'ayyar\"dan (kalibrasyon evi) bahseder. İstanbul'da, Evliya'da, ana gümrük binasında katipler, komisyoncular ve para değiştiricilerle birlikte tartım görevlileri bulunuyordu. Arabacılar geçerken yükleri tartıyor ve tüccarların hesapları için ağırlıkları kaydediyorlardı. İpek tartım görevlisi (Mizani Harir) her ipeği önünde tarttırıyor ve onda birini alıyordu. Darphanede ise tartım görevlileri her şeyi tartıyor ve kesin kayıtlar tutuyordu. İskenderiye'de, Tebeşir Ustası, Hidiv İsmail dönemindeki tartım görevlileri ve ağırlık vergileri sistemlerini, tartım istasyonu hamallarının ('Atalin Kabbaniyye loncası) lonca dışından işçi çalıştıran tartım görevlilerine karşı açtığı davayı ve Daqahliya'daki tartım görevlilerinin başıyla olan anlaşmazlığı kaydetmiştir."
  id: "Qabbani adalah penimbang umum yang mengatur timbangan pasar. Buku-buku tentang pengawasan pasar (hisbah) menjadikan koreksi timbangan, ukuran, dan berat sebagai tugas pertama muhtasib (inspektur pasar). Ibn al-Ukhuwwah menginstruksikan mereka yang menggunakan timbangan untuk menjaganya tetap bersih dari minyak dan kotoran, membiarkannya diam sebelum menimbang, tidak menggantungnya dengan tangan, dan tidak menyentuh wadah timbangan dengan ibu jari. Ia menyebutkan beberapa trik kecurangan—meniup emas ke dalam wadah timbangan, rambut tipis yang diikat di satu sisi, dan timbangan \"mu'addi\" dengan lidah besi lunak—dan ia tidak menyetujui timbangan Koptik untuk barang-barang berat. Al-Shayzari menggambarkan timbangan yang paling akurat dan penipuan berupa butiran yang direndam dalam minyak dan ditusuk dengan jarum. Ia juga menyebutkan \"dar al-'ayyar\" (rumah kalibrasi) tempat timbangan dicap setelah diuji dan tempat para pedagang dipanggil secara berkala untuk memeriksa timbangan mereka. Di Istanbul, di Evliya, para penimbang berdiri di kantor bea cukai utama bersama para juru tulis, makelar, dan penukar uang. Para pengemudi gerobak lewat, menimbang muatan barang dan mencatat beratnya untuk pembukuan para pedagang. Penimbang sutra (Mizani Harir) meminta setiap helai sutra ditimbang di hadapannya, dan ia mengumpulkan sepersepuluhnya. Di percetakan uang, para penimbang menimbang semuanya dan menyimpan catatan yang tepat. Di Alexandria, Chalkcraft mencatat sistem penimbang dan pajak berat selama pemerintahan Khedive Ismail, gugatan para porter stasiun timbangan (serikat 'Atalin Qabbaniyya) terhadap para penimbang yang mempekerjakan pekerja dari luar serikat mereka, dan perselisihan dengan kepala penimbang di Daqahliya."
