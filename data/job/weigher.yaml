craft:
  techniques:
    ar: "صنعة القبّاني هي دقة التولية وضبط الغشّ. يفصّل ابن الأخوة والشيزري الميزان الأصحّ: كفّتان متساويتان، وثقب التعليق في وسط العارضة، ولسان من فولاذ صلب يميل بأقل وزن؛ ويحرّمان تعليق الميزان باليد، ولمس الكفّة بالإبهام، والنفخ في كفّة الذهب، وشدّ الشعرة بأحد الجانبين، ولسان «المؤدّي» من حديد مطاوع؛ ويستبغضان القسطاس القبطي في البضائع الثقيلة، ويحتفظ المحتسب بأوزان الاختبار — حصى في أجولة ليف أو قماش غليظ — بعيداً عن الرطوبة والغبار. وعند الشيزري تُختَم الأوزان في دار العيار بعد اختبارها ويُعاد فحصها على غفلة لئلا يستبدل التاجر حجارة بمثلها من خشب. وفي إسطنبول يوزن القنطرجية أحمال البضائع على العربات ويسجّلونها لحسابات التجار، ويوزن ميزاني حرير كل حرير ويأخذ العشر، وفي دار الضرب يزن الوزّان كل شيء ويحفظ حساباً دقيقاً."
    en: "The weigher's craft is exact weighing and the policing of its cheats. Ibn al-Ukhuwwa and al-Shayzari specify the true balance: equal sides, balanced pans, the suspension hole in the middle of the beam, and a tongue of hard steel that inclines at the slightest weight; they forbid suspending the scales from the hand, touching the pan with the thumb, blowing into the gold pan, fastening a fine strand of hair to one side, and the al-Mu'addi balance with its tongue of soft iron; they disapprove of the Coptic steelyard for heavy merchandise, and the muhtasib keeps test weights — pebbles in bags of palm-fibre or coarse canvas — away from moisture and dust. In al-Shayzari the weights are bound and stamped at the Dar al-'Iyar after testing, then re-examined by surprise lest a merchant have swapped them for wooden lookalikes. In Istanbul the Kantarji quintal-men weigh bales of merchandise on wagons and write them to the merchants' accounts; the Mizani-harir weighs every silk and takes a tenth; at the mint the weigher weighs everything and keeps an exact account."
    ur: "قبانی کا ہنر درست تول اور اس کے دھوکوں کی ضبط ہے۔ ابن الاخوہ اور الشیزری سچی ترازو کی صفت لکھتے: دونوں طرف برابر، پلڑے متوازن، لٹکنے کا سوراخ سلّی کے وسط میں، اور سخت فولاد کا دباؤ جو معمولی وزن سے جھکے؛ ہاتھ سے لٹکانا، پلڑے پر انگوٹھا، سونے کے پلڑے میں پھونک، ایک طرف بال باندھنا، اور نرم لوہے کے دباؤ والی «مؤدی» سب حرام؛ بھاری مال کے لیے قبطی قپان ناپسند، اور محتسب آزمائشی وزن — خجور کے ریشے یا موٹے کپڑے کی تھیلیوں میں ککریاں — نمی اور غبار سے دور رکھتا۔ الشیزری میں وزن دار العیار میں آزما کر باندھے اور مہر کیے جاتے اور اچانک پھر جانچے جاتے کہ تاجر لکڑی کے جعلی نہ بدل دے۔ استنبول میں قنطرجی گاڑیوں پر مال کے گٹھڑ تول کر تاجروں کے حساب لکھتے؛ میزانی حریر ہر ریشم تول کر دہائی لیتا؛ ضرب خانے میں تولنے والا ہر چیز تول کر درست حساب رکھتا ہے۔"
