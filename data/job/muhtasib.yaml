era:
  origins: prophetic
  first_attested:
    edtf: "0622/0644"
    precision: decade
    status: historical
    note: "The DİA entry says the Prophet appointed named market overseers in Mecca and Medina, and that Umar appointed overseers in Medina. The title muhtasib comes later. The first attestation is the widest range the entry supports."
    sources: [source/tdv-hisbe]
  status_today: replaced
places:
  - place: place/mecca
    note: "The Prophet's appointed market overseer in Mecca is named in the sources as Said ibn al-As al-Umawi, according to the entry."
    sources: [source/tdv-hisbe]
  - place: place/medina
    note: "Abdullah ibn Said ibn Usayha is named as an overseer of the Medina market. The entry names five early overseers in all, including Umar ibn al-Khattab and Shifa bint Abdullah."
    sources: [source/tdv-hisbe]
  - place: place/baghdad
    note: "A muhtasib of Baghdad, Abu Zakariyya Yahya ibn Abdullah, is recorded in 157 AH (773–74 CE) under al-Mansur. The caliph had a Baghdad muhtasib executed for abusing the post, according to the entry."
    sources: [source/tdv-hisbe]
  - place: place/cairo
    note: "Under the Fatimids a muhtasib of Cairo was appointed in 358 AH (969). The entry describes two hisba centres in Cairo and Fustat under the caliph, and a deputy for each district."
    sources: [source/tdv-hisbe]
  - place: place/damascus
    note: "In the Mamluk period the Damascus muhtasib was appointed by the viceroy and could appoint deputies in the provincial towns, according to the entry."
    sources: [source/tdv-hisbe]
  - place: place/istanbul
    note: "The office was in Istanbul by the time of the state's founding under the name ihtisap ağası. Galata, Üsküdar and Eyüp each had a muhtasib, according to the entry. The Istanbul ihtisap regulation of Mehmed II's reign (1451–1481) gives the wide powers of the post."
    sources: [source/tdv-hisbe]
  - place: place/edirne
    note: "In Shawwal 884 (December 1479) an ihtisap ağası was appointed to Edirne by an imperial order, according to the entry."
    sources: [source/tdv-hisbe]
