id: job/muhtasib
class: job
label: { ar: "المحتسب", en: "Muhtasib (market inspector)", ur: "محتسب" }
summary:
  ar: "المحتسب هو الموظف المكلَّف بالحِسبة، أي الأمر بالمعروف والنهي عن المنكر في الشأن العام: مراقبة الأسواق والموازين والمكاييل والأسعار، وصيانة النظام العام والأخلاق العامة. وهي عند الفقهاء فرض كفاية على المسلمين، وعلى المحتسب فرض عين بوصفه مكلّفاً بها. وقد عُرف المنصب في الدولة العثمانية باسم «ihtisap ağası» ⁦(آغا الاحتساب)⁩."
  en: "The muhtasib is the official charged with hisba: enjoining good and forbidding wrong in public life. That covers the markets, the weights and measures, prices, public order and public morals. Jurists treat hisba as a collective duty on all Muslims, and as a personal duty for the official who holds it. In the Ottoman state the office was called the ihtisap ağası (agha of the ihtisab)."
  ur: "محتسب وہ سرکاری عہدیدار ہے جو حسبہ پر مامور ہوتا ہے، یعنی عوامی زندگی میں نیکی کا حکم دینا اور برائی سے روکنا۔ اس میں بازار، اوزان و پیمانے، قیمتیں، عوامی نظم اور اخلاق شامل ہیں۔ فقہاء حسبہ کو تمام مسلمانوں پر فرضِ کفایہ اور منصب دار پر فرضِ عین قرار دیتے ہیں۔"
