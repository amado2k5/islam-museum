  techniques:
    ar: "صنعة القِرَب صنعة دبغ وطبق وخياط: الجلود تُدبَغ بقرظ اليمن أربع جولات من ثلاثة أيام لكل جلدة حتى تُنتَزع الشحوم كلها، ولا يُكتفَى بثلاث مع عفص الثالثة فتسودّ في الشمس؛ ثم تُقطَّع الجلود المذكّاة وحدها وتُطبَّق طبقات — ثلاث للكبار، اثنتان للمتوسط، طبقة متينة سليمة للصغار بلا رقعة — ويُمتحَن الصنيع بالشمّ والجسّ بحثاً عن أصول الوبر والتشقق."
    en: "The waterskin-maker's craft is tanning, layering and sewing: the skins tanned in Yemen qaraz over four three-day immersions until every grease is drawn — never three with oak-galls the third time, which blackens the hide in the sun; then only ritually slaughtered skins are cut and laid in layers — three for the large bottles, two for the middle-sized, one stout sound layer for the small without patching — and the finished bottle is proved by smell and touch for the hair-roots and cracking of carrion-hide."
    ur: "مشک سازی دباغت، تہہ لگانا اور سینا ہے: کھالیں یمن کے قرظ سے چار بار تین تین دن دبغ ہوں یہاں تک کہ ساری چکنائی اترے — کبھی صرف تین بار نہیں جس میں تیسری بار مازو ہو جو کھال دھوپ میں سیاہ کرے؛ پھر صرف شرعی ذبح کی کھالیں کٹی اور تہہ لگیں — بڑے کے تین، درمیانے کے دو، چھوٹے کے ایک مضبوط بغیر پیوند — اور تیار مشک سونگھنے اور چھونے سے پرکھی جائے کہ مردے کے بال جڑ اور شگاف نہ رہے۔"
