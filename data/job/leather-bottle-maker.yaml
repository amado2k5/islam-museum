summary:
  ar: "صانع القِرَب يعمل الأزقّة والمشك جلوداً للماء والسمن والمسير، وله في حسبة ابن الأخوة باب مشترك مع الدبّاغين: لا يُستعمَل في القِرَب إلا جلود الذبائح المذكّاة، وتُفتَّش دكاكينهم فجأة للتحقق من ذلك، وعلامات الفرق بين جلد الذبيحة وجلد الميتة الرائحة والخشونة عند الجسّ — ففي جلد الميتة تبقى أصول الوبر ويتشقّق الجلد إذا جفّ؛ والقِرَب الكبار تُصنَع من ثلاث طبقات، والمتوسطة من طبقتين، والصغار من طبقة واحدة متينة سليمة بلا رقعة. وفي الكتاب نفسه أحكام الدبغ الذي تُبنى عليه القربة: جلود المعز لا تُدبَغ إلا بقَرَظ اليمن — أربعون رطلاً مصرياً لكل مئة جلد صغير وستون لكل مئة كبير — تبقى الدفعة في محلول القرظ ثلاثة أيام ثم تُنقَل إلى حفرة أخرى بقرظ مثله، أربع مرات متتابعة لإزالة كل الشحم؛ ومن الغشّ الاقتصار على ثلاث مرات واستعمال العفص في الثالثة فيضر بالجلود وعلامته اسودادها في الشمس، ودبغ الصيف خير من دبغ الشتاء، وحفرة المئتي جلد لا يقل عاملها عن رجلين، ولا تُوضَع جلود البقر الميتة مع جلود المذبوح. وفي موكب إسطنبول مرّ صنّاع المشك ⁦(مشكجيان)⁩ مئة وخمسة رجال بخمسين دكاناً يحملون على خيلهم ضروب المشك وأزقّة الجلد وقوارب الماء، وإلى جوارهم صنّاع أوعية الزيت ⁦(دبّجيان)⁩ مئة رجل بأربعين دكاناً يزيّنون دكاكينهم بالأوعية الجلدية المسماة دبّة وبدج لحفظ الزيت والسمن والبارود."
  en: "The qirrab made waterskins and leather bottles — the skins that carried water, ghee and the traveller's provision. Ibn al-Ukhuwwa gives the leather-bottle makers a shared chapter with the tanners: only the skins of ritually slaughtered animals may go into the bottles, and surprise visits must be paid to their shops to verify it — the marks of the skin of an animal that died of itself are its smell, its roughness to the touch, the hair-roots still in it, and the way it cracks as it dries. Large bottles are made of three layers, middle-sized of two and small ones of a single layer, stout and sound and free of patching. The same chapter fixes the tanning on which the bottle stands: goat-skins tanned only with the qaraz of Yemen — forty Egyptian ratls to every hundred small skins, sixty to every hundred large — the batch lying three days in the qaraz pit, then moved to a second pit with an equal weight of qaraz, four times in succession to draw out all the grease. One deception is to stop at three immersions and use oak-galls the third time, which harms the skins — its mark is that they blacken in the sun; summer tanning beats winter tanning; a pit of two hundred skins takes no fewer than two men; and the hides of oxen that died of themselves must never lie with those of slaughtered beasts. In Evliya's Istanbul procession the jack-makers (Meshakjian) were a hundred and five men in fifty shops carrying on their horses every kind of jack, leathern bottles and water-pipes, beside the oil-pot makers (Debbejian), a hundred men in forty shops decking their shops with the leathern pots called debbe and boduj for keeping oil, butter and powder."
  ur: "قرّاب مشکیں اور چمڑے کے مشک بناتا — وہ کھالیں جو پانی، گھی اور مسافر کا سامان اٹھاتی تھیں۔ ابن الاخوہ مشک سازوں کو دبّاغوں کے ساتھ مشترک باب دیتا ہے: مشکوں میں صرف شرعی ذبح کیے جانوروں کی کھالیں جائیں، اور ان کی دکانوں کی اچانک تلاشی لی جائے؛ مردہ جانور کی کھال کی پہچان اس کی بو، ہاتھ لگنے پر کھردراپن، بال کی جڑوں کا باقی رہنا اور سکھنے پر شگاف ہے۔ بڑے مشک تین تہوں سے، درمیانے دو تہوں سے اور چھوٹے ایک مضبوط بغیر پیوند تہے سے بنتے۔ اسی باب میں دباغت کے قاعدے ہیں جن پر مشک کھڑی ہوتی ہے: بکری کی کھالیں صرف یمن کے قرظ سے دبغ ہوں — سو چھوٹے کھالوں کے چالیس مصری رطل اور سو بڑوں کے ساٹھ — تین دن قرظ کے گڑھے میں رہ کر دوسرے گڑھے میں اتنے ہی قرظ سے، مسلسل چار بار تاکہ ساری چکنائی نکلے؛ ایک دھوکہ تین بار پر اکتفا کر تیسری بار مازو لگانا ہے جو کھال بگاڑتا — پہچان دھوپ میں سیاہ پڑنا؛ گرمی کی دباغت سردی سے بہتر، دو سو کھالوں کے گڑھے پر کم از کم دو آدمی، اور خود مری گائے کی کھالیں ذبح شدہ کے ساتھ نہ رکھیں۔ اولیاء کے استنبول کے جلوس میں مشک ساز ⁦(مشکجیان)⁩ ایک سو پانچ آدمی پچاس دکانیں اپنے گھوڑوں پر مشکیں، چمڑے کے مشک اور نقیرے لادے نکلتے، اور ان کے ساتھ تیل کے برتن ساز ⁦(دبّجیان)⁩ سو آدمی چالیس دکانیں اپنی دکانیں دبّہ اور بودوج نامی کھال کے برتنوں سے سجاتے جو تیل، مکھن اور بارود رکھتے۔"
  es: "Los qirrab fabricaban odres y botellas de cuero, las mismas pieles que contenían agua, mantequilla clarificada y provisiones para el viajero. Ibn al-Ukhuwwa dedica un capítulo a los fabricantes de botellas de cuero junto con los curtidores: solo las pieles de animales sacrificados ritualmente podían entrar en las botellas, y era necesario realizar visitas sorpresa a sus talleres para verificarlo. Las características de la piel de un animal que murió de forma natural son su olor, su aspereza al tacto, las raíces del pelo aún presentes y la forma en que se agrieta al secarse. Las botellas grandes se fabricaban con tres capas, las medianas con dos y las pequeñas con una sola capa, robustas, resistentes y sin parches. El mismo capítulo especifica el curtido que se describe en la botella: pieles de cabra curtidas únicamente con qaraz de Yemen (cuarenta ratls egipcios por cada cien pieles pequeñas, sesenta por cada cien grandes). El lote reposa tres días en el pozo de qaraz, luego se traslada a un segundo pozo con la misma cantidad de qaraz, cuatro veces seguidas para extraer toda la grasa. Un error común es detenerse en tres inmersiones y usar agallas de roble la tercera vez, lo cual daña las pieles (su señal es que se ennegrecen al sol); el curtido de verano es mejor que el de invierno; un pozo de doscientas pieles requiere al menos dos hombres; y las pieles de bueyes que murieron por causas naturales nunca deben mezclarse con las de animales sacrificados. En la procesión de Evliya en Estambul, los fabricantes de jacks (Meshakjian) eran ciento cinco hombres en cincuenta tiendas que llevaban en sus caballos todo tipo de jacks, botellas de cuero y pipas de agua, junto con los fabricantes de tinajas de aceite (Debbejian), cien hombres en cuarenta tiendas que adornaban sus tiendas con las tinajas de cuero llamadas debbe y boduj para guardar aceite, mantequilla y polvo."
