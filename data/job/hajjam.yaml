summary:
  ar: "الحجّام هو من يفصد العروق ويحجم. تضبط كتب الحسبة صنعته ضبطاً دقيقاً: ألا يفصد إلا من عُرف بعلم تشريح الأعضاء والعروق والعضلات والشرايين، وأن يتدرّب المتعلّم على عروق ورق السلق حتى تثبت يده، وألا يباشر عملاً يدوياً يُقسّي أطراف أصابعه، وألا يفصد عبداً إلا بإذن مولاه ولا صبياً إلا بإذن وليّه ولا حاملاً ولا حائضاً، وأن يفصد في مكان مكشوف مضيء بمبضع حادّ وهو غير مضطرب. ويأخذ المحتسب عليهم العهد والميثاق في عشر حالات ألا يفصدوا إلا بعد مشاورة الأطباء، ويفصّل العروق التي تُفصَد ومواضعها ومنافعها."
  en: "The hajjam opened veins and applied the cupping glass. The hisba manuals regulate the craft minutely: none may practise phlebotomy unless known to be learned in the anatomy of limbs, veins, muscles and arteries; the learner practises on the veins of chard leaves until his hand is steady; he must take no manual work that callouses his fingertips and must tend his eyes; no slave without the owner's leave, no minor without the guardian's, no pregnant or menstruating woman; the bleeding is done in a lit, public place with a sharp instrument and a calm hand. The muhtasib takes a pledge and bond that in ten named cases they will bleed only after consulting the physicians, and lists the veins that may be bled, their places and their benefits."
  ur: "حجام وہ ہے جو فصد کھولتا اور پچھنے لگاتا ہے۔ حسبہ کی کتابیں اس کے پیشے کو بالکل تفصیل سے ضبط کرتی ہیں: فصد صرف وہ کھولے جو اعضا، رگوں، پٹھوں اور شریانوں کی تشریح جانتا معلوم ہو؛ سیکھنے والا سلق کے پتوں کی رگوں پر مشق کرے یہاں تک کہ ہاتھ بے لرز ہو؛ ایسا جسمانی کام نہ کرے جو انگلیوں کی انھیاں سخت کر دے اور آنکھوں کی دیکھ بھال کرے؛ غلام مالک کے، نابالغ سرپرست کے اذن کے بغیر نہ، حاملہ یا حائضہ کو نہ کھولے؛ فصد روشن، کھلی جگہ پر تیز آلہ اور پُرسکون ہاتھ سے ہو۔ محتسب دس مخصوص حالتوں میں ان سے عهد و پیمان لیتا ہے کہ معالجوں کے مشورے کے بغیر فصد نہ کھولیں، اور جن رگوں کو کھولا جا سکتا ہے ان کے مقام اور فائدے تفصیل سے بیان کرتا ہے۔"
