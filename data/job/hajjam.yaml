  techniques:
    ar: "يفصّل ابن الأخوة والشيزري أدوات الحجّام وطريقته: مباضع عدّة، وخيط ⁦(وتر)⁩ يشدّ به الذراع، ومسك في قرونه وأقراص يُنشَّق بها من أغمي عليه، ودهن يُدلك به سنّ المبضع فيقلّ الألم وإن أبطأ البرء، والمبضع يُمسَك بين الإبهام والوسطى وتُترك السبّابة للجسّ. والشقّ أوسع في الشتاء لئلا يتجمّد الدم وأضيق في الصيف لئلا يُغشى على المفصود سريعاً. ومن عروق اليد: الكِبلي ⁦(السيفلي)⁩ والأكحل والباسلق والأسيلم، ومن عروق الرجل عرق النسا والصافن وعرق داخل الركبة وعرق وراء وتر العقب."
    en: "Ibn al-Ukhuwwa and al-Shayzari detail the cupper's kit and method: a set of lancets, a sinew to bind the arm, musk in pods and pastilles to revive the fainting patient, oil to rub on the lancet's point so the incision hurts less though it heals more slowly, and the lancet held between thumb and middle finger with the forefinger left free to feel. The cut is made wider in winter lest the blood congeal and narrower in summer lest the patient faint too soon. Of the arm veins they name the cephalic, median, basilic, cubital and salvatella, and of the leg the sciatic, the saphena, the vein inside the knee and the vein behind the Achilles tendon."
    ur: "ابن الاخوہ اور الشیزری حجام کے اوزار اور طریقہ تفصیل سے بتاتے ہیں: کئی نشر، بازو باندھنے کی پٹی، غالب ہو جانے والے کے لیے قرن میں رکھی کستوری اور گولیاں، نشر کی نوک پر تیل ملنا کہ چھرا کم دکھے مگر زخم دیر سے بھرے، اور نشر انگوٹھے اور درمیانی انگلی میں پکڑنا اور شہادت کی انگلی محسوس کرنے کے لیے آزاد۔ چھرا سردی میں چوڑا کہ خون نہ جمے اور گرمی میں تنگ کہ مریض جلد بے ہوش نہ ہو۔ بازو کی رگوں میں کیفلی، وسطیٰ، باسلق، کہنی اور سالوٹیلا، اور ٹانگ میں سیاتی، صافن، گھٹنوں کے اندر والی اور ایڑی کی نس کے پیچھے والی رگ گنی ہیں۔"
