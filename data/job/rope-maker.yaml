summary:
  ar: "الحبّال صانع الحبال والمراسي، وفي إسطنبول العثمانية أقامت طائفته معاملها في خندق غلطة خلف دار الصناعة وفي ساحة أوك ميدان، فتفتل أصناف الحبال الغليظة والدقيقة، وفي الحرب تفتل حبال المدافع؛ وقد جاورتها طوائف صنّاع حبال الخيام وصنّاع اللجم ⁦(السّرج والعنان)⁩ وتجّار القنّب. يعدّ إوليا جلبي الحبّالين خمسمئة رجل، بيرُهم شيخ عبد الله إلابل المدفون باليمن، وكانوا يمرّون في الموكب يفتلون الحبال وينادون «آ مولا»."
  en: "The habbal made ropes and cables; in Ottoman Istanbul his guild kept its works in the ditch of Galata behind the Arsenal and on the Ok-meidan, twisting every kind of large and small rope, and in wartime twisting ropes for the guns. Beside them worked the tent-rope makers, the halter-makers and the hemp merchants who sold rope and pack-thread. Evliya Çelebi counts the rope-makers at five hundred men, their patron Sheikh Abd-allah Ilabli buried in Yemen, marching in the procession twisting ropes and crying 'Ay a Mola'."
  ur: "حبال بنانے والا حبّال رسیاں اور موٹی رسی بتتا تھا؛ عثمانی استنبول میں اس کی انجمن کے کارخانے غلطہ کے خندق میں اسلحہ خانے کے پیچھے اور اوک میدان میں تھے، جہاں ہر قسم کی رسیاں بٹی جاتیں اور جنگ کے وقت توپوں کی رسیاں بنتی تھیں۔ ان کے ساتھ خیمے کی رسیاں بنانے والے، لگام ساز اور سن اور دوری فروش بھی تھے۔ اولیاء چلبی حبّالوں کو پانچ سو آدمی لکھتا ہے، ان کا پیر یمن میں مدفون شیخ عبدالله الابلی ہے، اور وہ جلوس میں رسیاں بٹتے ہوئے «آ مولا» پکارتے نکلتے تھے۔"
  es: "El habbal fabricaba cuerdas y cables; en el Estambul otomano, su gremio mantenía sus talleres en la zanja de Galata, detrás del Arsenal y en Ok-meidan, donde trenzaban todo tipo de cuerdas, grandes y pequeñas, y en tiempos de guerra, cuerdas para los cañones. Junto a ellos trabajaban los fabricantes de cuerdas para tiendas de campaña, los fabricantes de cabestros y los comerciantes de cáñamo que vendían cuerdas e hilo para aparejos. Evliya Çelebi calcula que los fabricantes de cuerdas eran quinientos hombres; su patrón, el jeque Abd-allah Ilabli, enterrado en Yemen, marchaba en procesión trenzando cuerdas y gritando «¡Ay a Mola!»."
  fr: "Le habbal fabriquait des cordes et des câbles; à Istanbul, sous l’Empire ottoman, sa guilde tenait ses ateliers dans le fossé de Galata, derrière l’Arsenal, et sur l’Ok-meidan, où l’on tressait toutes sortes de cordes, grandes et petites, et, en temps de guerre, des cordes pour les canons. À leurs côtés travaillaient les fabricants de cordes de tente, les fabricants de licols et les marchands de chanvre qui vendaient des cordes et du fil à bâcher. Evliya Çelebi dénombre les cordiers à cinq cents hommes, leur protecteur, le cheikh Abd-allah Ilabli, enterré au Yémen, défilant en procession, tordant des cordes et criant « Ay a Mola ! »"
