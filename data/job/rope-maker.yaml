  techniques:
    ar: "يصف إوليا معمل الحبال في خندق غلطة، حيث تُفتل أصناف الكبلات والحبال الغليظة والدقيقة: حبال المرساة ⁦(جنكورتاران)⁩ والحبال الأرضية ⁦(كومنة)⁩ والحبال الراجعة ⁦(بالانكار)⁩ وحبال التمر ⁦(خورماليف)⁩ والإسبارطو ⁦(إسبرطشينة)⁩ والحبال الخشنة ⁦(خلاط)⁩، وفي زمن الحرب تُفتل حبال سحب المدافع. وصنّاع حبال الخيام ⁦(طانحجيان)⁩ مئة رجل بأربعين دكاناً يزيّنون خيامهم بالحبال القطنية الملوّنة، وصنّاع اللجم ⁦(كولانجيان)⁩ مئة وخمسة بخمسةٍ وخمسين دكاناً، وتجّار القنّب ⁦(كندرجيان)⁩ ثلاثمئة يبيعون القنب والقطن والحبال ويعاونون البحّارة."
    en: "Evliya describes the rope-works in the ditch of Galata, where every kind of large and small cable is twisted: anchor-cables (Jankurtaran), ground-ropes (Gumena), hauling-ropes (Palangar), date-fibre ropes (Khurmalif), esparto ropes (Ispartshina) and heavy hawsers (Khalat); in wartime the guild twists ropes for the guns. The tent-rope makers (Tanahjian), a hundred men in forty shops, adorn their tents with cotton tent-ropes of different colours; the halter-makers (Kulanjian) are a hundred and five men in fifty-five shops; and the hemp merchants (Kenderjian), three hundred men, sell hemp, cotton and ropes and serve as assistants to the boatmen."
    ur: "اولیاء غلطہ کے خندق میں بنے رسہ خانے لکھتا ہے جہاں ہر قسم کی موٹی باریک رسیاں بٹی جاتی ہیں: لنگر کی رسیاں ⁦(جنقورتاران)⁩، زمینی رسیاں ⁦(کومینہ)⁩، کھینچنے کی رسیاں ⁦(پالنگار)⁩، کھجور کے ریشے کی رسیاں ⁦(خورمالف)⁩، سفاڑتی رسیاں ⁦(اسپرتشینہ)⁩ اور موٹی رسیاں ⁦(خلاط)⁩؛ جنگ کے وقت انجمن توپوں کے لیے رسیاں بٹتی ہے۔ خیمے کی رسی بنانے والے ⁦(طانحجیان)⁩ سو آدمی چالیس دکانیں، اپنے خیمے رنگین روئی کی رسیوں سے سجاتے ہیں؛ لگام ساز ⁦(کولانجیان)⁩ ایک سو پانچ آدمی پچپن دکانیں؛ اور سن فروش ⁦(کندرجیان)⁩ تین سو آدمی سن، روئی اور رسیاں بیچتے اور ملاحوں کے معاون رہتے ہیں۔"
