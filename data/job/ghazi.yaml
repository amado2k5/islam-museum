  certification: "No school made a ghazi: the ribat volunteer took up the duty, and on the Anatolian uç the ghazi rank ran as a hereditary ocak station — but the son first had to prove himself a good cengâver. Aşık Pasha's list for the alp eren was courage, strength, zeal, horse, dress, bow, sword, spear and a worthy companion."
  duration: "A frontier apprenticeship in arms; among the uç Turks the title passed father to son once the heir had proved himself."
