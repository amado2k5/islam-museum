summary:
  ar: "الغازي من قاتل في سبيل الدين؛ والكلمة مصدَّرة من غزا بمعنى هاجم وجاهد، وهي في القرآن جمعاً وفي الحديث كثيراً. تحت الأمويين صار الغازي متطوعاً يقطن الرباطات خارج المدن ليدفع غارات الرحّل غير المسلمين ويدعوهم إلى الإسلام، فلما انحرفت بعض الجماعات إلى النهب شقّ الاسم ثم عاد إلى معناه. في الأناضول كان الغازي فارس الثغر: أمراء الغزو من دانشمند إلى أول العثمانيين يحملون اللقب، وترك أشيك باشا شروطه: قلبٌ وجرأة وعضد وهمّة وفرس وثوب خاص وقوس وسيف ورمح ورفيق صالح. ثم صار لقب شرف للقادة والسلاطين — من سلجوق بن دقاق «الملك الغازي» إلى سليمان القانوني ومحمود الأول وعبد الحميد الأول والثاني وغازي عثمان باشا — وامتد في تركيا الحديثة إلى مصطفى كمال غازياً 1921 ولقب الشرف للمحاربين القدامى."
  en: "The ghazi was the one who fought 'in the path': the word is the active participle of gazâ, to raid and strive, plural in the Qur'an and frequent in the hadith, where the maxim ran 'if I die a shahid, if I live a ghazi'. Under the Umayyads the ghazi became a volunteer garrisoned in ribats outside the cities, raised against the raiding non-Muslim nomads and charged with protecting towns and caravans and calling the nomads to Islam; when some bands slid into plunder the name soured for a time, then recovered. In Anatolia the ghazi was the frontier horseman — the conquering emirs from Danishmend to Osman bore the title — and Aşık Pasha listed what an alp eren needed: a strong heart, courage, arm strength, zeal, a good horse, a special dress, a bow, a good sword and spear, and a fit companion. Thereafter gazi passed into an honorific for commanders and sultans — from Seljuk's 'al-Malik al-Ghazi' to Süleyman, Mahmud I, Abdülhamid I and II and Gazi Osman Pasha — and survives in modern Turkey: Mustafa Kemal received it in 1921, and veterans of the Independence, Korea and Cyprus wars still carry the name."
  ur: "غازی وہ تھا جو راہِ دین میں لڑتا؛ لفظ «غزا» ⁦(حملہ کرنا، جہاد کرنا)⁩ کا فاعل ہے، قرآن میں جمع کے طور پر اور حدیث میں کثرت سے آیا، جملہ چل پڑا «مروں تو شہید، جیو تو غازی»۔ امویوں میں غازی رباطوں کا رضاکار بنا جو شہر کے باہر قلعوں میں ٹھہرتا، غیر مسلم خانہ بدوشوں کے حملوں سے شہر اور قافلے بچاتا اور انہیں اسلام کی دعوت دیتا؛ بعض گروہوں کے لوٹ مار سے نام کچھ وقت بگڑا پھر لوٹ آیا۔ اناطولیہ میں غازی سرحدی سوار تھا — دانشمند سے عثمان تک فاتح امیر یہ لقب رکھتے — اور عاشق پاشا نے alp eren کے اوزار گنوائے: مضبوط دل، جرأت، بازو، ہمت، اچھا گھوڑا، خاص لباس، کمان، اچھی تلوار و نیزہ اور موزوں ساتھی۔ پھر غازی کمانڈروں اور سلاطین کا لقبِ اعزاز بنا — سلجوق بن دقاق کے «الملک الغازی» سے سلیمان، محمود اول، عبدالحمید اول و دوم اور غازی عثمان پاشا تک — اور جدید ترکی میں باقی ہے: 1921 میں مصطفیٰ کمال کو ملا، اور جنگِ آزادی، کوریا و قبرص کے سابق فوجی آج بھی یہ نام رکھتے ہیں۔"
