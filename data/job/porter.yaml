summary:
  ar: "الحمّال ينقل الأحمال على ظهره وعلى الأعمدة من الموانئ والمخازن والأسواق. عند أوليا جلبي كان حمّالو اسطنبول أصحاب كدك ⁦(إقطاع مكتبي)⁩ معيّنين بفرمان سلطاني، أقوياء يحمل الواحد ألف أوقية، وحمّالو صومعة الأعمدة ⁦(سيريك حمال)⁩ يرفعون بها أحمالاً من أربعين إلى خمسين قنطاراً يسيرون بنظام وينادون «يا حيّ»، وحمّالو الجمارك والدقيق أشهرهم، ولهم بيرهم علي وسلمان، وحمّالو العدل الشرعي ثمانمائة رجل يخرجون مع القاضي عسكر وبيرهم أبو شيبة، وللحمّالين حمّام خاص. وفي إسكندرية القرن التاسع عشر كانت طائفة حمّالي القبّان تطالب بحق العمل على موازين المرفأ وبقسمة الدخل بين الأفراد ⁦(الرقيّة)⁩ حين استعان الوزّانون بغير الطائفة."
  en: "The porter moved loads on his back and on poles through the ports, magazines and markets. In Evliya's Istanbul the porters held the gedek, a kind of fief granted by imperial diploma: strong men carrying up to a thousand okkas each; the Sirik-hamal or pole-porters lifting forty-to-fifty-quintal loads in step and crying 'Ya Hayy'; the custom-house and Flour-hall porters the most famous, with Ali and Salman for patrons; the eight hundred porters of justice marching out with the kazaskers under their patron Abu Shayba, to whose family the Prophet had delivered the keys of Mecca; and a bath of their own, the Sort-hammam. In nineteenth-century Alexandria the weigh-station porters' guild petitioned for its exclusive right to porterage and for the rukiyya, the communal division of income, when the weighers hired outsiders."
  ur: "حمّال بندرگاہوں، گوداموں اور بازاروں میں سامان اپنی پیٹھ اور قطبوں پر اٹھاتا۔ اولیاء چلبی کے استنبول میں حمّالوں کو گدک نامی تملیک شاہی فرمان سے ملتی تھی: مضبوط مرد ہر ایک ہزار اوقہ اٹھاتا؛ ستونوں والے سیرک حمال چالیس پچاس قنطار کا بوجھ مل کر قدم بقدم چل کر «یا حیّ» پکارتے اٹھاتے؛ جمرك اور آٹے خانے کے حمّال سب سے مشہور، ان کے پیر علی اور سلمان؛ قاضی عسکر کے ساتھ نکلنے والے آٹھ سو عدالت حمّال جن کا پیر ابو شیبہ ہے جس کے گھرانے کو نبی نے مکہ کی کنجیاں سونپیں؛ اور ان کا اپنا حمام صورت حمّام۔ انیسویں صدی کے اسکندریہ میں قبّان حمّالوں کی انجمن نے، جب تولنے والے باہر کے مزدور لانے لگے، حصّی پالنے کے اپنے خصوصی حق اور آمدنی کی مشترکہ تقسیم ⁦(رقیّة)⁩ کی درخواست کی۔"
  es: "El porteador transportaba cargas sobre su espalda y en pértigas a través de los puertos, almacenes y mercados. En el Estambul de Evliya, los porteadores ostentaban el gedek, una especie de feudo otorgado por diploma imperial: hombres fuertes que cargaban hasta mil okkas cada uno; los Sirik-hamal o porteadores de pértigas levantaban cargas de cuarenta a cincuenta quintales al unísono y gritaban 'Ya Hayy'; los porteadores de la aduana y del mercado de harina eran los más famosos, con Ali y Salman como mecenas; los ochocientos porteadores de justicia marchaban con los kazaskers bajo el mando de su patrón Abu Shayba, a cuya familia el Profeta había entregado las llaves de La Meca; y tenían su propio baño, el Sort-hammam. En la Alejandría del siglo XIX, el gremio de porteadores de la estación de pesaje solicitó su derecho exclusivo al porteo y la rukiyya, la división comunal de los ingresos, cuando los pesadores contrataban a personas ajenas."
  fr: "Le porteur transportait des charges sur son dos et à l'aide de perches à travers les ports, les entrepôts et les marchés. À Istanbul, sous le règne d'Evliya, les porteurs détenaient le gedek, une sorte de fief octroyé par diplôme impérial: des hommes robustes pouvaient porter jusqu'à mille okkas chacun; les Sirik-hamal, ou porteurs à perche, soulevaient des charges de quarante à cinquante quintaux au pas cadencé en criant « Ya Hayy »; les porteurs de la douane et de la halle à farine étaient les plus célèbres, protégés par Ali et Salman; les huit cents porteurs de justice défilaient avec les kazaskers sous la direction de leur protecteur Abou Shayba, à la famille duquel le Prophète avait remis les clés de La Mecque; et ils disposaient de leur propre bain, le Sort-hammam. À Alexandrie, au XIXe siècle, la guilde des porteurs des stations de pesage a demandé l'exclusivité du portage et la rukiyya, le partage communautaire des revenus, lorsque les peseurs employaient des personnes extérieures à la guilde."
