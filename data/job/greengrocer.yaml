craft:
  techniques:
    ar: "صنعة الخُضَرِيّ صنعة بيع من السوق إلى الدكان أو إلى الظهر: تُعرَض الخضار طازجة في الدكاكين وتُزيَّن بها الأكاليل في الموكب، وتُنادى في الشوارع. وعند إدارة المدينة كان التَّرَكجي‌باشي رئيساً على الخبازين والخضريين من دائرة البستانجية، ومركز التوريد مستودع الخضار العام عند السكالة. ومن صنعتهم معرفة فصول الخضار ومواضعها — كترمس إمبابة الذي يُنقَع يومين أو ثلاثة ليذهب مرارته قبل بيعه."
    en: "The greengrocer's craft is selling — from the public repository to the shop or the hawker's back: vegetables offered fresh in the shops, wreaths of parsley and salad decking them on procession day, and the street cries calling them through the quarters. In Istanbul's administration the Terekehjibashi headed the bakers and greengrocers from the Bostanji department, and the supply ran through the public vegetable repository at the landing-place. The trade knew its seasons and its sources — like the tirmis of Imbabeh, soaked two or three days to lose its bitterness before it is sold."
    ur: "خضری کا ہنر بیچنا ہے — عوامی ذخیرے سے دکان تک یا ڈھونے والے کی پشت تک: دکانوں میں تازہ سبزیاں، جلوس کے دن اجوائن اور سلاد کی مالائیں، اور محلوں میں گونجتی پکاریں۔ استنبول کی انتظامیہ میں ترکجی‌باشی بستانجی محکمے سے نانبایوں اور خضریوں کا سردار تھا، اور رسد گھاٹ کے عوامی سبزی ذخیرے سے چلتی۔ پیشہ اپنے موسم اور اپنے منبع جانتا — جیسے امبابہ کا ترمس جسے بیچنے سے پہلے دو تین دن بھگویا جاتا کہ اس کی کڑواہٹ اترے۔"
