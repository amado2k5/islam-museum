summary:
  ar: "الخُضَرِيّ بائع الخضار في دكانه أو حمّالاً في الأسواق، من أهل الإنتاج لا أهل الوسطاء. في موكب إسطنبول مرّ باعة الخضار ⁦(سِبْزَواتج)⁩ خمسمئة رجل ودكان يبيعون في دكاكينهم كل صنف من الخضار ويقذفون على المتفرجين خياراً وجزراً وبقدونس طازجاً، بيرهم بابا رتن كما بير البستانيين؛ وتمرّ هذه الأصناف الأربعة — الفلاحون والبستانيون والمطعّمون وباعة الخضار — بضجيج عظيم في مقدمة الموكب بعد العلماء مباشرة، لأنهم منتجون، والخبز عمود الدين وقُوام الحياة ثمرة أيديهم. ورئيسهم التَّرَكجي‌باشي المعيَّن من دائرة البستانجي‌باشي، وهو رئيس الخبّازين والخضريّين معاً، ومعه كاتب بإجازة سلطانية، يمشي في الموكب مع رئيس الخبازين بينما يمشي نائبه ⁦(كيايا)⁩ مع الخضريين، ويزيّنون دكاكينهم بأكاليل البقدونس والسلق والكرفس والكرنب والخيار والباذنجان يقذفونها إلى الجمهور. ولتجّار السبانخ ⁦(إسبانكجيان)⁩ شأنهم: خمسمئة رجل بأربعمئة دكان، ومركزهم الكبير عند السكالة حيث مستودع الخضار العام. وعند لين في القاهرة الخُضَرِيّ ⁦(خضرجي)⁩ في عداد دكاكين السوق، والخضار تُحمَل في الشوارع مع الخبز وسائر المآكل، وبائع التِّرمِس ينادي «النجدة يا إمبابة» — دعاءً للشيخ الإمبابي المدفون بقرية إمبابة حيث أطيب الترمس — و«ترمس إمبابة يفوق اللوز» و«ما أحلى صغير النهر» في إشارة إلى نقعه يومين أو ثلاثة ليذهب مرارته."
  en: "The khudari sold vegetables from a shop or carried them through the markets — one of the producers, not the middlemen. In Evliya's Istanbul procession the vegetable-sellers (Sebzehvatj) were five hundred men and shops selling every kind of vegetable, throwing fresh cucumbers, carrots and parsley on the spectators as they passed; they shared the gardeners' patron, Baba Reten. These four corporations — the peasants, the gardeners, the grafters and the sellers of vegetables — marched with an incredible noise immediately after the divines, because they are producers: bread, the column of faith and support of life, is the result of their labours. Their head, the Terekehjibashi, was appointed from the Bostanjibashi's department as chief of the bakers and greengrocers together, a clerk with an imperial diploma attached to him; in the procession he walks with the chief of the bakers while his deputy (kyaya) walks with the greengrocers, who deck their shops with wreaths of parsley, salad, celery, cabbages, cucumbers and aubergines and toss them to the crowd. The spinach-merchants (Ispanakjian) had their own five hundred men in four hundred shops, their great establishment at the landing-place where the public vegetable repository stood. In Lane's Cairo the khudari stands in the list of market shops, vegetables are carried about for sale with bread and other eatables, and the tirmis-seller cries 'Aid! O Imbabee!' — calling on the saint of Imbabeh where the best lupins grow — 'The tirmis of Imbabeh surpasses the almond', and 'O how sweet the little offspring of the river', alluding to the two or three days' soaking that draws out its bitterness."
  ur: "خضری دکان سے سبزیاں بیچتا یا بازاروں میں ڈھو کر پھرتا — یہ پیدا کرنے والوں میں سے تھا، بیچولیوں میں سے نہیں۔ اولیاء کے استنبول کے جلوس میں سبزی فروش ⁦(سبزواتج)⁩ پانچ سو آدمی اور دکانیں تھیں جو ہر قسم کی سبزی بیچتے اور چلتے ہوئے ناظرین پر تازہ کھیرے، گاجریں اور اجوائن نکالتے؛ ان کا پیر باغبانوں جیسا بابا رتن۔ یہ چار انجمنیں — کسان، باغبان، کلنگر اور سبزی فروش — عالموں کے فوراً بعد زور دار شور سے گزرتیں، کیونکہ یہ پیدا کرنے والے ہیں: روٹی، جو دین کا ستون اور زندگی کی قوت ہے، ان ہی کی محنت کا ثمر ہے۔ ان کا سردار ترکجی‌باشی بستانجی‌باشی کے محکمے سے مقرر ہوتا اور نانبایوں اور خضریوں دونوں کا رئیس تھا؛ اس کے ساتھ سلطانی سند والا ایک منشی، جلوس میں وہ نانبایوں کے سردار کے ساتھ چلتا اور اس کا نائب ⁦(کیایا)⁩ خضریوں کے ساتھ، جو اپنی دکانیں اجوائن، سلاد، اجوائنِ خراسانی، گوبھی، کھیرے اور بینگن کی مالاؤں سے سجا کر ہجوم پر اچھالتے۔ پالک فروشوں ⁦(اسپانکجیان)⁩ کا اپنا حال: پانچ سو آدمی چار سو دکانیں، ان کا بڑا مرکز گھاٹ پر جہاں سبزیوں کا عوامی ذخیرہ تھا۔ لین کے قاہرہ میں خضری بازار کی دکانوں کی فہرست میں ہے، سبزیاں روٹی اور اور کھانوں کے ساتھ گلیوں میں بکتی، اور ترمس بیچنے والا پکارتا «مدد، اے امبابے!» — امبابہ کے ولی کو پکار جو وہاں دفن ہے اور جہاں کا ترمس بہترین — «امبابہ کا ترمس بادام سے بڑھ کر» اور «کیا مٹھا ہے دریا کا ننھا بچہ» — اس کے دو تین دن کے بھگونے کی طرف اشارہ جس سے کڑواہٹ نکلتی ہے۔"
  es: "El khudari vendía verduras en una tienda o las llevaba por los mercados, uno de los productores, no los intermediarios. En la procesión de Evliya en Estambul, los vendedores de verduras (Sebzehvatj) eran quinientos hombres y tiendas que vendían todo tipo de verduras, arrojando pepinos, zanahorias y perejil frescos a los espectadores a su paso; compartían el patrón de los jardineros, Baba Reten. Estas cuatro corporaciones —los campesinos, los jardineros, los injertadores y los vendedores de verduras— marchaban con un ruido increíble inmediatamente después de los divinos, porque son productores: el pan, la columna de la fe y el sustento de la vida, es el resultado de sus labores. Su jefe, el Terekehjibashi, fue nombrado del departamento del Bostanjibashi como jefe de los panaderos y verduleros juntos, un escribiente con un diploma imperial adjunto; En la procesión camina con el jefe de los panaderos mientras su lugarteniente (kyaya) camina con los verduleros, que adornan sus tiendas con guirnaldas de perejil, lechuga, apio, repollo, pepinos y berenjenas y las arrojan a la multitud. Los comerciantes de espinacas (Ispanakjian) tenían sus propios quinientos hombres en cuatrocientas tiendas, su gran establecimiento en el embarcadero donde se encontraba el depósito público de verduras. En el Cairo de Lane, el khudari figura en la lista de tiendas del mercado, las verduras se transportan para la venta con pan y otros alimentos, y el vendedor de tirmis grita '¡Ay! ¡Oh Imbabee!' — invocando al santo de Imbabeh donde crecen los mejores altramuces— 'El tirmis de Imbabeh supera a la almendra', y '¡Oh, qué dulce es el pequeño retoño del río!', aludiendo a los dos o tres días de remojo que extraen su amargor."
  fr: "Le khudari vendait des légumes dans une boutique ou les transportait à travers les marchés – il faisait partie des producteurs, et non des intermédiaires. Lors du cortège d'Evliya à Istanbul, les marchands de légumes (Sebzehvatj) étaient cinq cents hommes et leurs boutiques proposaient toutes sortes de légumes. Ils jetaient des concombres, des carottes et du persil frais sur les spectateurs à leur passage; ils partageaient le patron des jardiniers, Baba Reten. Ces quatre corporations – les paysans, les jardiniers, les travailleurs et les vendeurs de légumes – défilaient dans un vacarme incroyable juste après les divinités, car ce sont des producteurs: le pain, pilier de la foi et soutien de la vie, est le fruit de leur labeur. Leur chef, le Terekehjibashi, était issu du département du Bostanjibashi et dirigeait conjointement les boulangers et les marchands de légumes; il s'agissait d'un commis titulaire d'un diplôme impérial. Dans la procession, il marche avec le chef des boulangers tandis que son adjoint (kyaya) accompagne les marchands de légumes, qui décorent leurs étals de guirlandes de persil, de salade, de céleri, de choux, de concombres et d'aubergines qu'ils jettent à la foule. Les marchands d'épinards (Ispanakjian) disposaient de cinq cents hommes répartis dans quatre cents boutiques, leur principal établissement se trouvant à l'embarcadère où se situait le dépôt public de légumes. Dans le Caire de Lane, le khudari figure parmi les étals du marché; les légumes sont transportés pour être vendus avec du pain et d'autres denrées alimentaires, et le vendeur de tirmis s'écrie: « Au secours ! Ô Imbabee ! » — invoquant le saint d'Imbabeh, où poussent les meilleurs lupins — « Le tirmis d'Imbabeh surpasse l'amande », et « Ô combien doux est le petit rejeton du fleuve », faisant allusion au trempage de deux ou trois jours qui en atténue l'amertume."
  tr: "Manav, dükkanında sebze satan veya pazarlarda hamallık yapan kişi, aracı değil, üreticidir. İstanbul alayında, beş yüz kişi ve manav dükkanı, dükkanlarında her türlü sebzeyi satarak ve izleyicilere taze salatalık, havuç ve maydanoz atarak, kendi ekmeklerini ve bahçıvanların ekmeklerini dağıtarak geçti. Bu dört grup – çiftçiler, bahçıvanlar, aşıcılar ve manavlar – üretici oldukları ve dinin direği ve hayatın temeli olan ekmeğin ellerinin ürünü olduğu için, alayın önünde, alimlerin hemen ardından büyük bir gürültüyle geçtiler. Başları, Bostancıbaşı bölümünden atanan Türkcibaşı, hem fırıncıların hem de manavların başıydı. Kraliyet izniyle bir kâtip eşliğinde yürüyordu. Türkcibaşı, baş fırıncıyla birlikte alayda yürürken, yardımcısı (Kiyaya) manavlarla birlikte yürüyordu. Dükkanlarını maydanoz, pazı, kereviz, lahana, salatalık ve patlıcandan yapılmış çelenklerle süsleyip kalabalığa atıyorlardı. Ispanak tüccarları (Espankjian) da öne çıkan bir diğer gruptu: beş yüz adam ve dört yüz dükkan, ana merkezleri halka açık sebze deposunun bulunduğu pazar meydanındaydı. Kahire'de ise manav (Khadraji) pazar dükkanları arasında yer alıyor, sebzeler ekmek ve diğer yiyeceklerle birlikte sokaklarda taşınıyor ve acı bakla satıcısı \"İmbaba, yardım et!\" diye bağırıyor - en iyi acı baklaların bulunduğu İmbaba köyünde gömülü olan Şeyh İmbaba'ya bir dua - ve \"İmbaba acı baklaları bademden daha iyidir\" ve \"Küçük nehir ne kadar tatlıdır\" diyerek acılığını gidermek için iki veya üç gün suda bekletmeyi kastediyor."
  id: "Penjual sayur, penjual sayuran di tokonya atau porter di pasar, adalah salah satu produsen, bukan perantara. Dalam prosesi Istanbul, lima ratus pria dan toko penjual sayur (sebzwatc) lewat, menjual berbagai macam sayuran di toko mereka dan melemparkan mentimun, wortel, dan peterseli segar kepada para penonton, roti mereka sendiri serta roti para tukang kebun. Keempat kelompok ini—para petani, tukang kebun, pencangkok, dan penjual sayur—lewat dengan suara riuh di depan prosesi, tepat setelah para cendekiawan, karena mereka adalah produsen, dan roti, pilar agama dan dasar kehidupan, adalah buah dari tangan mereka. Pemimpin mereka, Turkjibashi, yang diangkat dari departemen Bostancıbashi, adalah kepala baik tukang roti maupun penjual sayur. Ia didampingi oleh seorang juru tulis dengan otorisasi kerajaan. Turkjibashi berjalan dalam prosesi bersama kepala tukang roti, sementara wakilnya (Kiyaya) berjalan bersama para penjual sayur. Mereka menghiasi toko-toko mereka dengan karangan bunga peterseli, sawi, seledri, kubis, mentimun, dan terong, yang mereka lemparkan ke kerumunan. Pedagang bayam (Espankjian) adalah kelompok terkemuka lainnya: lima ratus orang dengan empat ratus toko, pusat utama mereka terletak di alun-alun pasar tempat gudang sayuran umum berada. Dan di Kairo, penjual sayur (Khadraji) termasuk di antara toko-toko pasar, dan sayuran dibawa di jalanan bersama roti dan makanan lainnya, dan penjual lupin berseru, “Tolong, Imbaba!” — sebuah doa kepada Syekh Imbabi, yang dimakamkan di desa Imbaba tempat lupin terbaik berada — dan “Lupin Imbaba lebih baik daripada almond,” dan “Betapa manisnya sungai kecil itu,” mengacu pada perendaman selama dua atau tiga hari untuk menghilangkan rasa pahitnya."
