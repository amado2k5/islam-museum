summary:
  ar: "الداية هي التي تعين المرأة عند الولادة وتجلسها على «كرسي الولادة» وتقيم معها مراسم السبوع. يصف لين الداية في قاهرة ثلاثينيات القرن التاسع عشر: قبل يومين أو ثلاثة من موعد الولادة تنقل الكرسي — وهو ملكها — إلى بيت الحامل، كرسياً على صورة خاصة يُغطّى بشال أو منديل مطرّز وتُعقَد على ركنيه الأعلى أزهار الحنّاء أو الورد بمنديل مطرّز؛ وفي اليوم السابع بعد الولادة ⁦(يوم السبوع)⁩ تجلس الأم بصحبة الداية على كرسي الولادة رجاء أن تعود إليه قريباً، والداية — أو امرأة أخرى — تنثر في أرضية كل غرفة ملحاً وبذر حبة البركة وضع الليلة السابقة عند رأس الرضيع وتقول «الملح في عين من لا يصلي على النبي» وقائدةً «الملح الخبيث في عين الحاسد»؛ ثم تأخذ الداية قارورة الماء — دُرَّكاً للولد وقُلّة للبنت — التي وُضعت ليلة السبوع عند رأس الوليد فتضعها على صينية وتدور بها على النساء يلقين فيها نقوداً نُقوطاً لها؛ وتلقى لها معادنها ⁦(النقوط)⁩ في مناسبات العرس أيضاً، إذ تُكسى داية العائلة مع الكاتبات والبلّانة قطعة قماش ذهبي أو شالاً كشميرياً حين يدعون نساء البلد لحمّام العروس."
  en: "The dâyeh is the woman who assists at the birth, seats the mother on the birthing chair and keeps the subooa' rites with her. Lane describes the dâyeh of 1830s Cairo: two or three days before the expected delivery she conveys to the house her own 'kursee el-wilâdeh', a chair of a peculiar form, covered with a shawl or embroidered napkin, with flowers of the henna-tree or roses tied with an embroidered handkerchief to the upper corners of its back. On the seventh day after the birth — the Yum es-Subooa' — the mother, attended by the dâyeh, sits again on the kursee el-wilâdeh in the hope she may soon have occasion for it; the dâyeh, or another woman, sprinkles in each room a mixture of salt and fennel-flower seed placed the night before at the infant's head, saying 'the salt be in the eye of the person who doth not bless the Prophet' or 'the foul salt be in the eye of the envier'. Then she takes the water-bottle — a dorak for a boy, a kulleh for a girl — set at the child's head through the night, lays it on a tray and carries it round to the women, who drop her nukoot of money into it. She also earns her gifts at weddings, when the family's dâyeh is presented, with the khâtibehs and the bath-attendant, a piece of gold stuff or a Kashmir shawl as they ride out to invite the women to the bride's bath."
  ur: "دایہ وہ عورت ہے جو بچے کی پیدائش میں مدد کرتی، ماں کو «کرسۃ الولادہ» پر بٹھاتی اور سبوع کی رسمیں انجام دیتی ہے۔ لین انیسویں صدی کی تیسری دہائی کے قاہرہ کی دایہ بیان کرتا ہے: متوقع ولادت سے دو تین دن پہلے وہ اپنی «کرسی الولادہ» — ایک خاص شکل کی کرسی جو اس کی اپنی ملکیت ہے — گھر پہنچاتی ہے، شال یا کڑھائی والے رومال سے ڈھکی، پشت کے اوپری کونوں پر مہندی کے پھول یا گلاب کڑھے رومال سے بندھے۔ پیدائش کے ساتویں دن — یوم السبوع — ماں دایہ کے ساتھ پھر کرسی پر بیٹھتی ہے اس نیت سے کہ جلد دوبارہ محتاج ہو؛ دایہ یا کوئی اور عورت ہر کمرے میں نمک اور کلونجی کا ملا ہوا چھڑکتی ہے جو رات بھر بچے کے سرہانے رکھا تھا اور کہتی ہے «نمک ہو اس کی آنکھ میں جو نبی پر درود نہ پڑھے» یا «بد نمک ہو حاسد کی آنکھ میں»۔ پھر وہ پانی کی وہ بوتل — لڑکے کے لیے دُرک اور لڑکی کے لیے قُلّہ — جو رات بھر بچے کے سرہانے رہی، تھالی میں رکھ کر عورتوں میں گھماتی ہے اور وہ اس کے نقود یعنی نقد انعام تھالی میں ڈالتی ہیں۔ شادیوں میں بھی اسے ہدیہ ملتا، جب خاندان کی دایہ کو خاطبہ عورتوں اور حمام کی خادمہ کے ساتھ سونے کا کپڑا یا کشمیری شال دیا جاتا ہے جب وہ شہر کی عورتوں کو دلہن کے حمام کی دعوت دے رہی ہوں۔"
  es: "La dâyeh es la mujer que asiste en el parto, sienta a la madre en la silla de parto y guarda los ritos de la subooa' con ella. Lane describe a la dâyeh del Cairo de la década de 1830: dos o tres días antes del parto previsto, lleva a la casa su propia 'kursee el-wilâdeh', una silla de forma peculiar, cubierta con un chal o servilleta bordada, con flores del árbol de henna o rosas atadas con un pañuelo bordado en las esquinas superiores de su respaldo. Al séptimo día después del parto —el Yum es-Subooa'— la madre, asistida por la dâyeh, se sienta de nuevo en la kursee el-wilâdeh con la esperanza de que pronto tenga ocasión de usarla; La dâyeh, u otra mujer, esparce en cada habitación una mezcla de sal y semillas de flor de hinojo colocada la noche anterior en la cabeza del bebé, diciendo: «Que la sal esté en el ojo de quien no bendiga al Profeta» o «Que la sal sucia esté en el ojo del envidioso». Luego toma la botella de agua —un dorak para un niño, un kulleh para una niña— colocada en la cabeza del niño durante la noche, la coloca en una bandeja y la lleva a las mujeres, quienes depositan en ella su nukoot de dinero. También recibe regalos en las bodas, cuando la dâyeh de la familia, junto con los khâtibehs y el asistente del baño, recibe una pieza de oro o un chal de Cachemira mientras salen a invitar a las mujeres al baño de la novia."
  fr: "La dâyeh est la femme qui assiste à l'accouchement, installe la mère sur la chaise d'accouchement et accomplit les rites de la subooa'. Lane décrit la dâyeh du Caire des années 1830: deux ou trois jours avant l'accouchement prévu, elle apporte à la maison son propre « kursee el-wilâdeh », une chaise de forme particulière, recouverte d'un châle ou d'une serviette brodée, ornée de fleurs de henné ou de roses attachées par un mouchoir brodé aux coins supérieurs du dossier. Le septième jour après la naissance — le Yum es-Subooa' —, la mère, accompagnée de la dâyeh, s'assoit de nouveau sur le kursee el-wilâdeh, espérant en avoir bientôt l'occasion. La dâyeh, ou une autre femme, répand dans chaque pièce un mélange de sel et de graines de fenouil déposé la veille sur la tête du nourrisson, en disant: « Que le sel soit dans l’œil de celui qui ne bénit pas le Prophète » ou « Que le sel impur soit dans l’œil de l’envieux ». Ensuite, elle prend la gourde – un dorak pour un garçon, un kulleh pour une fille – placée sur la tête de l’enfant durant la nuit, la pose sur un plateau et la porte aux femmes, qui y déposent leur nukoot d’argent. Elle reçoit également ses présents lors des mariages, lorsque la dâyeh de la famille est présentée, avec les khâtibehs et la préposée au bain, comme un objet en or ou un châle du Cachemire, tandis qu’elles vont inviter les femmes au bain de la mariée."
