    ar: "أدوات الداية عند لين: «كرسي الولادة» ⁦(كرسي الولّادة)⁩ ملك لها يُنقل إلى بيت الحامل قبل الولادة بأيام، مغطّى بشال أو منديل مطرّز ومعقود على أركان ظهره أزهار الحنّاء أو الورد بمنديل مطرّز؛ وبعد الولادة تُجلس الأم عليه ثلاثة إلى ستة أيام في بيوت الأغنياء والموسرين، أما فقيرات النساء فنادراً ما يلزمن فراشاً ويعدن لأشغالهن بعد يوم أو يومين. وفي السبوع تنثر الداية الملح وحبة البركة في الغرف، وتحمل قارورة الماء على صينية لنقوطها، وتلقى الهدايا كذلك حين تكون من «المدينات» اللواتي يدعون نساء البلد لحمّام العروس راكبات الحمير وقد علّقن فوق أكتافهن الأيسر قطع الحرير المطرّز أو الشالات الكشميرية."
    en: "The dâyeh's equipment in Lane's account: her own 'kursee el-wilâdeh' carried to the house days before the birth, covered with a shawl or embroidered napkin, henna flowers or roses tied with an embroidered handkerchief to the upper corners of its back; after delivery the mother is placed on a bed for three to six days in the houses of the rich and comfortable, while poor women seldom take to a bed at all and resume their ordinary occupations in a day or two. On the subooa' the dâyeh sprinkles salt and fennel-flower seed in the rooms, carries the water-bottle on a tray for her nukoot, and receives gifts too when she is one of the 'mudinât' who ride out to invite the women to the bride's bath, pieces of striped silk or Kashmir shawls slung over the left shoulder."
