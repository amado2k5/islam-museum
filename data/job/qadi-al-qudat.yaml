summary:
  ar: "قاضي القضاة رأس الجهاز القضائي في الدول الإسلامية؛ نشأ المنصب في بغداد العباسية حين نصب هارون الرشيد أبا يوسف أوّل قاضي قضاة، وكان في البدء لقب شرف لقاضي العاصمة ثم غدا صاحبه الوالي الأعلى على قضاة الأمصار يعيّنهم نوّاباً له. شابهه في المغرب والأندلس قاضي الجماعة، واستمر في الفاطميين والأيوبيين والمماليك حتى صار عند المماليك قاضي قضاة لكل مذهب من المذاهب الأربعة، وقابله عند العثمانيين القاضي عسكر."
  en: "The qadi al-qudat stood at the head of the Islamic judiciary; the office arose in Abbasid Baghdad when Harun al-Rashid made Abu Yusuf the first qadi al-qudat, at first an honourable title for the capital's judge, then the superior who appointed the provinces' qadis as his own deputies. Its Maghribi counterpart was the qadi al-jama'a; it ran on under the Fatimids, Ayyubids and Mamluks, where it became one chief judge for each of the four schools, and the Ottomans answered it with the kazasker."
  ur: "قاضی القضاۃ اسلامی عدلیہ کا سربراہ تھا؛ یہ منصب عباسی بغداد میں پیدا ہوا جب ہارون الرشید نے ابو یوسف کو پہلا قاضی القضاۃ مقرر کیا، پہلے دارالخلافہ کے قاضی کا اعزازی لقب تھا پھر ایسا اعلٰی منصب جس کے نیچے صوبوں کے قاضی اس کے نائب بن کر تعینات ہوتے۔ مغرب اور اندلس میں اس کا ہم منصب قاضی الجماعہ تھا؛ یہ منصب فاطمی، ایوبی اور مملوک دور میں چلا جہاں چاروں مذاہب کے لیے الگ قاضی القضاۃ بن گیا، اور عثمانیوں میں اس کا جواب قاضی عسکر تھا۔"
