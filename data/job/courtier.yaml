summary:
  ar: "النديم صاحب السلطان في مجلس المنادمة، يونسه بشعر أو غناء أو نكتة، وقد يكلمه في أمر جاد. الكلمة في اللغة نديم الكأس والصديق، وتُستعمل أيضاً للمجالس والمصاحب. والجاحظ ينسب أصول هذا العمل في قصور الأمويين والعباسيين إلى آداب البلاط الساساني. وعند العثمانيين غلب لفظ المصاحب، مع ورود النديم في بعض المصادر."
  en: "The nadim was the ruler's companion at the drinking gathering. He kept him company with poetry, song or wit, and he might also speak with him on a serious matter. The word means a cup companion and a friend, and mujalis and musahib are used in the same sense. Al-Jahiz traces the rules of this work, as it appears in the Umayyad and Abbasid courts, to Sasanian court custom. The Ottomans more often said musahib, though some of their sources still say nadim."
  ur: "ندیم بادشاہ کا ساتھی تھا، جو شراب کی محفل میں شعر، گانے یا لطیفے سے اس کا ساتھ دیتا، اور سنجیدہ بات بھی کر سکتا تھا۔ لغت میں یہ پینے کا ساتھی اور دوست ہے، اور مجالس اور مصاحب بھی اسی معنی میں آتے ہیں۔ جاحظ اموی اور عباسی درباروں میں اس کام کے اصول ساسانی دربار کے آداب سے جوڑتا ہے۔ عثمانیوں نے زیادہ تر مصاحب کہا، اگرچہ بعض ماخذوں میں ندیم بھی ملتا ہے۔"
  es: "El nadim era el acompañante del gobernante en las reuniones para beber. Le hacía compañía con poesía, canciones o ingenio, y también podía conversar con él sobre asuntos serios. La palabra significa compañero de copa y amigo, y mujalis y musahib se usan con el mismo significado. Al-Jahiz atribuye las normas de esta práctica, tal como aparece en las cortes omeya y abasí, a la costumbre de la corte sasánida. Los otomanos usaban con más frecuencia el término musahib, aunque algunas de sus fuentes aún emplean nadim."
  fr: "Le nadim était le compagnon du souverain lors des festivités. Il lui tenait compagnie par la poésie, le chant ou l'esprit, et pouvait également aborder avec lui des sujets sérieux. Ce mot signifie « compagnon de coupe » et « ami », et les termes mujalis et musahib sont employés dans le même sens. Al-Jahiz fait remonter les règles de cette pratique, telles qu'elles apparaissent aux cours omeyyade et abbasside, à la coutume de la cour sassanide. Les Ottomans utilisaient plus souvent le terme musahib, bien que certaines de leurs sources emploient encore nadim."
  tr: "Saray mensubu, ziyafetlerde sultanın arkadaşıydı; ona şiir, şarkı veya anekdotlarla eğlence sunar, bazen de onunla ciddi konuları tartışırdı. Arapçada bu kelime, kadeh arkadaşı ve dost anlamına gelir ve ayrıca toplantılar ve ortaklar için de kullanılır. El-Cahiz, bu uygulamanın Emevi ve Abbasi saraylarındaki kökenini Sasani sarayının adabına bağlar. Osmanlılar arasında \"arkadaş\" terimi daha yaygındı, ancak bazı kaynaklarda \"danışman\" da geçmektedir."
  id: "Seorang abdi dalem adalah pendamping sultan dalam jamuan makan, menghiburnya dengan puisi, lagu, atau anekdot, dan terkadang mendiskusikan hal-hal serius dengannya. Kata dalam bahasa Arab merujuk pada pendamping minum dan seorang teman, dan juga digunakan untuk pertemuan dan rekan. Al-Jahiz mengaitkan asal-usul praktik ini di istana Umayyah dan Abbasiyah dengan etiket istana Sasaniyah. Di kalangan Utsmaniyah, istilah \"pendamping\" lebih umum digunakan, meskipun \"penasihat\" muncul dalam beberapa sumber."
