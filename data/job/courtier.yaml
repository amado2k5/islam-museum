summary:
  ar: "النديم صاحب السلطان في مجلس المنادمة، يونسه بشعر أو غناء أو نكتة، وقد يكلمه في أمر جاد. الكلمة في اللغة نديم الكأس والصديق، وتُستعمل أيضاً للمجالس والمصاحب. والجاحظ ينسب أصول هذا العمل في قصور الأمويين والعباسيين إلى آداب البلاط الساساني. وعند العثمانيين غلب لفظ المصاحب، مع ورود النديم في بعض المصادر."
  en: "The nadim was the ruler's companion at the drinking gathering. He kept him company with poetry, song or wit, and he might also speak with him on a serious matter. The word means a cup companion and a friend, and mujalis and musahib are used in the same sense. Al-Jahiz traces the rules of this work, as it appears in the Umayyad and Abbasid courts, to Sasanian court custom. The Ottomans more often said musahib, though some of their sources still say nadim."
  ur: "ندیم بادشاہ کا ساتھی تھا، جو شراب کی محفل میں شعر، گانے یا لطیفے سے اس کا ساتھ دیتا، اور سنجیدہ بات بھی کر سکتا تھا۔ لغت میں یہ پینے کا ساتھی اور دوست ہے، اور مجالس اور مصاحب بھی اسی معنی میں آتے ہیں۔ جاحظ اموی اور عباسی درباروں میں اس کام کے اصول ساسانی دربار کے آداب سے جوڑتا ہے۔ عثمانیوں نے زیادہ تر مصاحب کہا، اگرچہ بعض ماخذوں میں ندیم بھی ملتا ہے۔"
