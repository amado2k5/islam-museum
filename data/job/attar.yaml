craft:
  materials: []
  techniques:
    ar: "يفصّل الشيزري فحص الغشّ: المسك يُمتحَن بفتح قيراطيسه ووضعها على الشفة، فإن لذع كالنار فهو خالص وإلا فمغشوش؛ ومن غشّهم ملء القوارير بلحاء الأملج والفلفل الهندي وشدّيران معجونة براتنج الصنوبر المذاب بنسبة أربعة دراهم إلى درهم مسك، أو معجون مسك السغد بثلاثة أضعافه، أو ملء القيراطس بلحاء البلوط المحروق؛ ومنهم من يصنع مسكاً بلا قيراطس من القسط والرميك ودم التنين، أو من الناردين وبرادة العود والقرفة والقرنفل بمثل وزنه مسكاً؛ ويمتحَن المسك بمضغه وبزاقه على خرقة بيضاء فإن تنافى ولم يصبغ فهو خالص وإن لبث يصبغ فمغشوش. والعنبر يُصنع غشّاً من الزَّبَد وقرن الحبار والراتنج الأسود والشمع والصندروس وجوز الطيب، وأحياناً يُبخّ رؤوسه بالصندروس فيجب حرق أطرافه."
    en: "Al-Shayzari details the tests for fraud: a musk bag is opened and put to the lips — if the musk bites like fire it is pure, otherwise adulterated; the frauds include bags filled with emblic myrobalan bark, Indian pepperwort and shadiran kneaded with diluted pine resin at four dirhams to one of musk, a paste of Sughd musk with three times its bulk, or bags filled with fire-treated oak bark; some make bagless musk of costus, ramik and dragon's blood, or of spikenard, aloes-wood filings, cinnamon and cloves at equal weight; the test is to chew a little, spit it on white cloth and shake — what shakes off unstaining is pure, what stains is adulterated. Ambergris is faked from cuttlefish bone, black resin, beeswax, sandarac and nutmeg, and its tips are sometimes sprayed with sandarac so that they must be burnt to be tested."
    ur: "الشیزری دھوکھے کی جانچ تفصیل سے بتاتا ہے: کستوری کی تھیلی کھول کر ہونٹوں سے لگائی جائے — اگر وہ آگ کی طرح جھلسائے تو خالص، ورنہ ملاوٹ شدہ؛ دھوکھوں میں ہے کہ تھیلیاں آملہ کی چھال، ہندوستانی فلفل پودا اور شدیران سے بھر کر صنوبر کے رال میں چار درہم بدلہ ایک درہم کستوری گوندھیں، یا سغدی کستوری کو تین گنا ملا کر بھریں، یا بلوط کی جلی چھال بھریں؛ بعض بغیر تھیلی کی کستوری قسط، رمیک اور خونِ اژدہا سے یا سمبل الطیب، عود کی برادا، دارچینی اور لونگ برابر وزن سے بناتے ہیں؛ جانچ یہ ہے کہ ذرا چبا کر سفید کپڑے پر تھوک کر جھاڑا جائے — جو اتر کر داغ نہ چھوڑے وہ خالص، داغ چھوڑنے والا ملی۔ عنبر بھی زیبد، سمندر کی ہڈی، سیاہ رال، موم، صندروس اور جائفل سے بنا کر ملاتے ہیں، اور بعض اوقات اس کے سرے صندروس چھڑکتے ہیں جن کا امتحان جلانے سے ہوتا ہے۔"
