summary:
  ar: "العطّار هو من يبيع الطيب والأدوية المركّبة والمفردة، وفي دكانه المسك والعنبر والعود واللبان. تعدّ كتب الحسبة فضاءه أخطر الدكاكين لأن أغشّ العقاقير يضرّ المرضى: يأمر الشيزري المحتسب أن يهيب بهم ويعظهم ويخوّفهم العقوبة ويعاين أدويتهم كل أسبوع، ويفصّل غشّ الأفيون المصرّي بالخشخاش القرني وبعصارة الخسّ البري وبالصمغ، والراوند الصيني براوند الدوابّ، والتباشير بالعظام المحروقة، واللبان بالقلفونية والصمغ، والمسك بأملج البلوط وشدّيران يعجنه براتنج الصنوبر المذاب. ويقول ابن الأخوة إن أمرهم من أهم ما يعنى به المحتسب ولا يباشر البيع إلا أهل المعرفة والتجربة، وأن تُشترى الأدوية من العطّار مفردة ثم تُركَّب. وفي قاهرة لين كان العطّار عطّاراً وصيدلانياً يبيع الشموع أيضاً، وفي إسطنبول إوليا لتجّار العود والعنبر والبخور طوائف تبخّر دكاكينها في الموكب."
  en: "The attar sold perfumes and simple and compounded drugs: musk, ambergris, aloes-wood and frankincense stood on his shelves. The hisba manuals treat his shop as the most dangerous of all, for adulterated medicine harms the sick: al-Shayzari orders the muhtasib to intimidate, exhort and warn the druggists of punishment and to inspect their drugs weekly, and details the frauds — Egyptian opium cut with horned poppy, wild-lettuce sap and gum; Chinese rhubarb with the rawand of beasts; bamboo concrete with burnt bones; frankincense with colophonium and gum; musk bulked with emblic myrobalan and shadiran kneaded in diluted pine resin. Ibn al-Ukhuwwa calls them among the most important of the muhtasib's charges, permits selling only to persons of knowledge and experience, and requires that drugs be bought singly and then compounded. In Lane's Cairo the 'attar was druggist and perfumer and sold wax candles too, and in Evliya's Istanbul the aloe, ambergris and incense merchants perfumed their shops as they marched."
  ur: "عطار خوشبو اور سادہ و مرکب ادویہ بیچتا ہے: اس کی دکان پر کستوری، عنبر، عود اور لوبان رکھے ہوتے ہیں۔ حسبہ کی کتابیں اس کی دکان کو سب سے خطرناک سمجھتی ہیں کہ ملی ہوئی دوا مریض کو نقصان دیتی ہے: الشیزری محتسب کو حکم دیتا ہے کہ عطاروں کو ڈرائے، نصیحت کرے، سزا کی دھمکی دے اور ہر ہفتے ان کی ادویہ جانچے، اور دھوکھے گنواتا ہے — مصری افیون میں سیرہ والا خشخاش، جنگلی سالاد پتہ کا رس اور گوند؛ چینی ریوند میں جانوروں والی ریوند؛ تباشیر میں جلی ہڈیاں؛ لوبان میں کولوفون اور گوند؛ کستوری میں آملہ اور شدیران صنوبر کے رال میں گوندھ کر۔ ابن الاخوہ انھیں محتسب کی اہم ترین ذمہ داریوں میں لکھتا ہے، فروخت صرف علم و تجربہ والوں کو جائز سمجھتا ہے، اور کہتا ہے کہ ادویہ الگ الگ خرید کر پھر ترکیب دی جائے۔ لین کے قاہرہ میں عطار خوشبو فروش و دوا فروش دونوں تھا اور موم بتیاں بھی بیچتا تھا، اور اولیاء چلبی کے استنبول میں عود، عنبر اور بخور کے سوداگر جلوس میں اپنی دکانیں معطر کرتے چلتے تھے۔"
  es: "El vendedor de perfumes y medicamentos simples y compuestos: almizcle, ámbar gris, madera de aloe e incienso se exhibían en sus estantes. Los manuales de la hisba tratan su tienda como la más peligrosa de todas, pues la medicina adulterada perjudica a los enfermos: al-Shayzari ordena al muhtasib que intimide, exhorte y advierta a los boticarios sobre el castigo y que inspeccione sus medicamentos semanalmente, y detalla los fraudes: opio egipcio mezclado con amapola cornuda, savia y goma de lechuga silvestre; ruibarbo chino con rawand de bestias; hormigón de bambú con huesos quemados; incienso con colofonia y goma; almizcle mezclado con emblic mirobalán y shadiran amasado en resina de pino diluida. Ibn al-Ukhuwwa los considera entre los cargos más importantes del muhtasib, permite la venta solo a personas con conocimiento y experiencia, y exige que los medicamentos se compren individualmente y luego se preparen. En el Cairo de Lane, el 'attar era boticario y perfumista, y también vendía velas de cera; y en el Estambul de Evliya, los comerciantes de aloe, ámbar gris e incienso perfumaban sus tiendas mientras marchaban."
