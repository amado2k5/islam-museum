summary:
  ar: "الصحفي من يجمع الخبر ويحرّره وينشره في صحيفة أو مجلة؛ والمهنة وُلدت في العالم الإسلامي مع أولى الصحف العربية — «الوقائع المصرية» ⁦(1828)⁩ التي تولاها رفاعة رافع الطهطاوي، «حديقة الأخبار» لخليل الخوري ⁦(1858)⁩، «الجوائب» لأحمد فارس الشدياق ⁦(1860)⁩ الذي اختار لفظ «جريدة»، و«الأهرام» ⁦(1875)⁩ — وصار لفظ «صحافة» ⁦(sıhâfe)⁩ من عُرف نجيب الحداد وإبراهيم اليازجي. حمل الصحفي في بلاد الإسلام تراث المنادي والخطيب والكاتب: أذاع الخبر العام بعد أن كان حكراً للديوان، ورأس تحريره مدرسةً للرأي العام — من محمد حسين هيكل في الأهرام إلى آلاف الجرائد والمجلات التي أحصى الطرازي حتى ١٩٢٩ نحو ٥٥٠ جريدة في القاهرة وحدها."
  en: "The sahafi gathers, edits and publishes news in a newspaper or magazine; the profession was born in the Islamic world with the first Arabic papers — al-Waqa'i' al-Misriyya (1828), run by Rifa'a al-Tahtawi; Khalil al-Khuri's Hadiqat al-akhbar (1858); Ahmad Faris al-Shidyaq's al-Jawa'ib (1860), which chose the word jarida; and al-Ahram (1875) — and the very word sihafa (journalism) is credited to Najib al-Haddad and Ibrahim al-Yaziji. The journalist inherited the trades of crier, preacher and secretary: he made public the news that had been the chancery's preserve, and his editorship schooled public opinion — from Muhammad Husayn Haykal at al-Ahram to the roughly 550 Cairo newspapers al-Tarrazi counted by 1929."
  ur: "صحافی وہ ہے جو خبر جمع، ترمیم اور اخبار یا رسالے میں شائع کرتا ہے؛ یہ پیشہ اسلامی دنیا میں پہلے عربی اخبارات کے ساتھ پیدا ہوا — «الوقائع المصریہ» ⁦(1828)⁩ جسے رفاعہ الطہطاوی نے چلایا، خلیل الخوری کی «حديقۃ الاخبار» ⁦(1858)⁩، احمد فارس الشدیاق کی «الجوائب» ⁦(1860)⁩ جس نے «جریدہ» کا لفظ چنا، اور «الاہرام» ⁦(1875)⁩ — اور «صحافت» ⁦(صحافہ)⁩ کا اطلاق نجیب الحداد اور ابراہیم اليازجی سے منسوب ہے۔ صحافی نے منادی، خطیب اور کاتب کی میراث سنبھالی: وہ خبر عام کرتا جو پہلے دیوان کی ملکیت تھی، اور اس کی ادارت نے رائے عامہ کی تربیت کی — الاہرام کے محمد حسین ہیکل سے لکر ان جرائد تک جنہیں طرازی نے 1929ء تک قاہرہ میں ساڑھے پانچ سو گنا۔"
