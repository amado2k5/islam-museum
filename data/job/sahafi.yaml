summary:
  ar: "الصحفي من يجمع الخبر ويحرّره وينشره في صحيفة أو مجلة؛ والمهنة وُلدت في العالم الإسلامي مع أولى الصحف العربية — «الوقائع المصرية» ⁦(1828)⁩ التي تولاها رفاعة رافع الطهطاوي، «حديقة الأخبار» لخليل الخوري ⁦(1858)⁩، «الجوائب» لأحمد فارس الشدياق ⁦(1860)⁩ الذي اختار لفظ «جريدة»، و«الأهرام» ⁦(1875)⁩ — وصار لفظ «صحافة» ⁦(sıhâfe)⁩ من عُرف نجيب الحداد وإبراهيم اليازجي. حمل الصحفي في بلاد الإسلام تراث المنادي والخطيب والكاتب: أذاع الخبر العام بعد أن كان حكراً للديوان، ورأس تحريره مدرسةً للرأي العام — من محمد حسين هيكل في الأهرام إلى آلاف الجرائد والمجلات التي أحصى الطرازي حتى ١٩٢٩ نحو ٥٥٠ جريدة في القاهرة وحدها."
  en: "The sahafi gathers, edits and publishes news in a newspaper or magazine; the profession was born in the Islamic world with the first Arabic papers — al-Waqa'i' al-Misriyya (1828), run by Rifa'a al-Tahtawi; Khalil al-Khuri's Hadiqat al-akhbar (1858); Ahmad Faris al-Shidyaq's al-Jawa'ib (1860), which chose the word jarida; and al-Ahram (1875) — and the very word sihafa (journalism) is credited to Najib al-Haddad and Ibrahim al-Yaziji. The journalist inherited the trades of crier, preacher and secretary: he made public the news that had been the chancery's preserve, and his editorship schooled public opinion — from Muhammad Husayn Haykal at al-Ahram to the roughly 550 Cairo newspapers al-Tarrazi counted by 1929."
  ur: "صحافی وہ ہے جو خبر جمع، ترمیم اور اخبار یا رسالے میں شائع کرتا ہے؛ یہ پیشہ اسلامی دنیا میں پہلے عربی اخبارات کے ساتھ پیدا ہوا — «الوقائع المصریہ» ⁦(1828)⁩ جسے رفاعہ الطہطاوی نے چلایا، خلیل الخوری کی «حديقۃ الاخبار» ⁦(1858)⁩، احمد فارس الشدیاق کی «الجوائب» ⁦(1860)⁩ جس نے «جریدہ» کا لفظ چنا، اور «الاہرام» ⁦(1875)⁩ — اور «صحافت» ⁦(صحافہ)⁩ کا اطلاق نجیب الحداد اور ابراہیم اليازجی سے منسوب ہے۔ صحافی نے منادی، خطیب اور کاتب کی میراث سنبھالی: وہ خبر عام کرتا جو پہلے دیوان کی ملکیت تھی، اور اس کی ادارت نے رائے عامہ کی تربیت کی — الاہرام کے محمد حسین ہیکل سے لکر ان جرائد تک جنہیں طرازی نے 1929ء تک قاہرہ میں ساڑھے پانچ سو گنا۔"
  es: "El sahafi recopila, edita y publica noticias en un periódico o revista; la profesión nació en el mundo islámico con los primeros periódicos árabes: al-Waqa'i' al-Misriyya (1828), dirigido por Rifa'a al-Tahtawi; Hadiqat al-akhbar de Khalil al-Khuri (1858); al-Jawa'ib de Ahmad Faris al-Shidyaq (1860), que eligió la palabra jarida; y al-Ahram (1875); y la palabra misma sihafa (periodismo) se atribuye a Najib al-Haddad e Ibrahim al-Yaziji. El periodista heredó los oficios de pregonero, predicador y secretario: hizo públicas las noticias que hasta entonces habían sido dominio exclusivo de la cancillería, y su labor editorial instruyó a la opinión pública, desde Muhammad Husayn Haykal en al-Ahram hasta los aproximadamente 550 periódicos de El Cairo que al-Tarrazi contabilizó en 1929."
  fr: "Le sahafi recueille, édite et publie des informations dans un journal ou un magazine. Cette profession est née dans le monde islamique avec les premiers journaux arabes: al-Waqa'i' al-Misriyya (1828), dirigé par Rifa'a al-Tahtawi; Hadiqat al-akhbar (1858) de Khalil al-Khuri; al-Jawa'ib (1860) d'Ahmad Faris al-Shidyaq, qui a choisi le terme jarida; et al-Ahram (1875). Le mot même de sihafa (journalisme) est attribué à Najib al-Haddad et Ibrahim al-Yaziji. Le journaliste a hérité des fonctions de crieur public, de prédicateur et de secrétaire: il a rendu publiques les informations qui étaient auparavant réservées à la chancellerie, et son travail de rédacteur en chef a façonné l'opinion publique, de Muhammad Husayn Haykal à al-Ahram jusqu'aux quelque 550 journaux cairotes recensés par al-Tarrazi en 1929."
  tr: "Gazeteci, bir gazete veya dergide haberleri toplayan, düzenleyen ve yayınlayan kişidir. Bu meslek, İslam dünyasında ilk Arapça gazetelerle ortaya çıkmıştır: Rifa'a al-Tahtawi'nin yönettiği \"Al-Waqa'i' al-Misriyya\" (1828); Halil al-Khoury'nin \"Hadiqat al-Akhbar\"ı (1858); \"jarida\" (gazete) terimini seçen Ahmed Faris al-Shidyaq'ın \"Al-Jawa'ib\"i (1860); ve \"Al-Ahram\" (1875). \"Sahafa\" (basın) terimi ise Necib al-Haddad ve İbrahim al-Yaziji tarafından ortaya atılmıştır. İslam dünyasında gazeteciler, tellalın, hatibin ve kâtibin mirasını sürdürdüler: Daha önce yalnızca hükümetin alanı olan kamu haberlerini yaydılar ve editörlük rolleri, kamuoyu oluşturma okulu görevi gördü; bu durum, El-Ahram'daki Muhammed Hüseyin Haykal'dan, El-Tarazi'nin 1929'a kadar saydığı binlerce gazete ve dergiye kadar uzanmaktadır; bunların yaklaşık 550'si yalnızca Kahire'deydi."
  id: "Seorang jurnalis adalah seseorang yang mengumpulkan, menyunting, dan menerbitkan berita di surat kabar atau majalah. Profesi ini berasal dari dunia Islam dengan surat kabar berbahasa Arab pertama—\"Al-Waqa'i' al-Misriyya\" (1828), yang dipimpin oleh Rifa'a al-Tahtawi; \"Hadiqat al-Akhbar\" oleh Khalil al-Khoury (1858); \"Al-Jawa'ib\" oleh Ahmad Faris al-Shidyaq (1860), yang memilih istilah \"jarida\" (surat kabar); dan \"Al-Ahram\" (1875). Istilah \"sahafa\" (pers) diciptakan oleh Najib al-Haddad dan Ibrahim al-Yaziji. Di dunia Islam, jurnalis meneruskan warisan juru pengumuman kota, orator, dan juru tulis: mereka menyebarkan berita publik, yang sebelumnya merupakan domain eksklusif pemerintah, dan peran editorial mereka berfungsi sebagai sekolah opini publik—dari Muhammad Husayn Haykal di Al-Ahram hingga ribuan surat kabar dan majalah yang dihitung al-Tarazi hingga tahun 1929, termasuk sekitar 550 di Kairo saja."
