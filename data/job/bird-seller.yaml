summary:
  ar: "الكُشباز بائع الطيور وصيّادها، من الحمام الزاجل إلى البلابل والببغاوات. في موكب إسطنبول عدّ إوليا باعة الطيور ⁦(كوشبازان)⁩ مئتي رجل بخمسين دكاناً بلا بير، وذكر مثلاً قديماً يزدريهم مع المقامرين، وهم يربّون الحمام للعبة التقلة ⁦(طاقلة)⁩ التي يشتري فيها أبناء الأعيان البيضة بخمسين قرشاً ليحضنوها تحت حمامهم ثم يتبعون الفراخ وهي تصعد وتهبط، ومن سلالات حمامهم البغدادي الذي لا يخطئ طريق العودة أبداً. ومعهم صيادو الطيور والشركيّة والبلبلجية: خمسمئة صيّاد يعدّون أعوان النبّالين لأنهم يجلبون الريش لأجنحة السهام، وباعة العصافير بلا دكاكين يبسطون الشباك وعيدان الدِّبق في البراري والبساتين ويعرضون صيدهم في أقفاص، وخمسمئة بائع بلابل يزوّدون الأكابر والمولّاه وحوانيت الحلّاقين، وأقفاصهم المطعّمة بالجزع واللؤلؤ تبلغ ألف قرش وتُصنَع هدايا للملوك، وفيها ببغاوات تنطق وتلاويل ثرثارة. ويحذّر الشيزري المحتسب من صيّادي العصافير إذ قد يخلطون ما مات حتف أنفه بما ذُكّي ويبيعونه معاً."
  en: "The kushbaz caught and sold birds, from carrier-doves to nightingales and parrots. In Evliya's Istanbul procession the bird-merchants (Kiishbazan) were two hundred men in fifty shops with no patron; Evliya cites an old proverb that scorns them together with gamblers. They breed doves for the game called takla, in which the young gentlemen of the city pay fifty piastres for an egg to set under their own doves, then run after the young birds as they soar and descend; of their breeds the Baghdadi is most esteemed, for it never misses its way back. Around them march the bird-hunters and fowlers, five hundred strong with no shops, reckoned assistants of the bowmen because they bring feathers for the wings of arrows; the sparrow-merchants (Serjeyan), who spread nets and lime-rods on heaths and gardens and show their catch in cages; and five hundred nightingale-merchants, who furnish great men, mollas and barbers' shops, with cages set in onyx and pearl worth a thousand piastres, made only as presents to kings, holding talking parrots and chattering starlings. Al-Shayzari warns the muhtasib to watch the hunters of sparrows and other birds, for they might mix birds that died naturally with slaughtered ones and sell them together."
  ur: "کوشباز پرندے پکڑنے اور بیچنے والا ہے، قاصد کبوتر سے بلبل اور طوطے تک۔ اولیاء کے استنبول کے جلوس میں پرندہ فروش ⁦(کوشبازان)⁩ دو سو آدمی پچاس دکانیں تھے، ان کا کوئی پیر نہیں؛ اولیاء ایک پرانا کہاوت نقل کرتا ہے جو انہیں جواریوں کے ساتھ حقیر جانتا ہے۔ وہ تقلہ ⁦(طاقلة)⁩ کے کھیل کے لیے کبوتر پالتے ہیں جس میں شہر کے نوجوان امیر خاندان ایک انڈا پچاس پیاستر میں خرید کر اپنے کبوتر تلے رکھواتے، پھر اڑتے اور اترتے جوانوں کے پیچھے دوڑتے؛ نسلوں میں بغدادی سب سے بڑھ کر کہ وہ راه کبھی نہیں بھولتا۔ ان کے ساتھ پرندہ شکاری اور فاختا شکار پانچ سو دکانوں کے بغیر چلتے، تیر سازوں کے معاون سمجھے جاتے کہ تیروں کے پر کے لیے پر لاتے؛ سرجیان چکور فروش بغیر دکانوں کے برّیوں اور باغوں میں جال اور چیڑ کی لاٹھیاں بچھاتے اور شکار پنجرے میں دکھاتے؛ اور پانچ سو بلبل فروش بڑے لوگوں، مولیوں اور نایوں کی دکانوں کو بلبل دیتے، جن کے پنجرے عقیق اور موتی جڑے ہزار پیاستر کے ہوتے، صرف بادشاہوں کو تحفہ، جن میں بولتے طوطے اور بکوادی جلڈ۔ شیزری محتسب کو چکور اور دوسرے پرندوں کے شکاریوں سے خبردار کرتا ہے کہ وہ خود مُردہ پرندے ذبح شدہ میں ملا کر بیچ سکتے ہیں۔"
