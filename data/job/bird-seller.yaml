craft:
  techniques:
    ar: "أدوات الصنعة عند إوليا: الشباك وعيدان الدِّبق تُبسَط في البراري والبساتين، والأقفاص تعرض الصيد، وأجملها مطعّم بالجزع واللؤلؤ لهدايا الملوك؛ والصيّادون يصطادون بالطيور المدرّبة ويوردون الريش للنبّالين. وعند الشيزري ضبط المحتسب بيع الطيور خشية خلط الميتة بالمذكّاة. وعند لين تقام بيوت الحمام المربّعة في قرى مصر بجانب القمح، ويُعلَّق على حمام السحرة أجراس صغيرة تطير بها داخل الدار رنّانة."
    en: "The trade's tackle in Evliya: nets and lime-rods spread on heaths and in gardens, cages to exhibit the catch, the finest of them set with onyx and pearls for royal presents; the hunters take birds with trained birds and supply feathers to the bowmen. In al-Shayzari the muhtasib polices the sale of birds lest dead ones be mixed with slaughtered. In Lane, square pigeon-houses stand in Egypt's villages by the corn, and conjurers attach little round bells to live pigeons that fly ringing about the room."
    ur: "اولیاء میں پیشے کا سازوسامان: برّیوں اور باغوں میں بچھے جال اور چیڑ کی لاٹھیاں، شکار دکھانے کے پنجرے جن میں عمدہ ترین بادشاہی تحفوں کے لیے عقیق موتی جڑے ہوتے؛ شکاری مخصوص پرندوں سے شکار کرتے اور تیر سازوں کو پر دیتے۔ شیزری میں محتسب پرندوں کی بیع پر نگاہ رکھتا ہے کہ مُردہ ذبح شدہ میں نہ ملے۔ لین میں مصر کے گاؤںوں میں غلّے کے قریب مربع کبوتر خانے ہوتے، اور جادوگر زندہ کبوتروں کو گھنٹیاں باندھ دیتے جو کمرے میں بجتی اڑتی ہیں۔"
