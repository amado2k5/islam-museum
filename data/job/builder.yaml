  techniques:
    ar: "يضبط ابن الأخوة أحوال الصنّاع: أجرة يومية مُشترطة تمنع التأخر صباحاً والانصراف قبل الغروب، وتحذير من مَن يُسهّل التقدير ويسوم ثمناً قليلاً ثم يكلّف صاحب العمل فوق طاقته حتى يبيع العقار قبل تمامه، وإلزام العامل باستعمال الزوايا والأثقال والخيوط ليقوم البناء مستوياً بلا ميل وإلا ضمن الخلل، وتعويض الخشب المؤجّر للسقالات إذا قُطع، وإلزام الرقّاصين ⁦(الذين يصعدون وينزلون)⁩ باتّخاذ سراويل تستر وعدم الانصراف حتى الغروب. ويحلف البنّاءون ألا يأخذوا رشوة من حرّاقي الجير وصنّاع الجبس، وعلامة الجير الناضج أنه يصفرّ في التنّور قبل الطحن، وإذا خُلط بالماء في إناء جفّ سريعاً، ولا يُستعمل جير عتيق ولا غير الجيد. ويصف إوليا موكب البنّائين: النجّارون يعدّون البيوت الخشبية والبنّاءون يشيّدون الحيطان والجبّاصون يديرون طواحين الجبس."
    en: "Ibn al-Ukhuwwa regulates the workmen's conduct: a daily wage with terms preventing late starts and early departures; a warning against those who underquote a job and then burden the employer beyond his means until he sells the property unfinished; the duty to use angles, weights and lines so the building stands true, with liability for any fault; replacement or compensation for hired scaffolding timber that is cut; and the raqqasin, the men who run up and down the ladders, must wear drawers and must not leave before sunset. The masons swear not to take bribes or gifts from the lime-burners and gypsum-makers; the mark of well-burnt lime is that it turns yellow in the kiln before grinding, and once mixed with water in a vessel it dries quickly, and no old lime may be used, only the best. Evliya describes the builders' train: the carpenters prepare wooden houses, the builders raise walls and the plasterers set their plaster-mills in motion."
    ur: "ابن الاخوہ مزدوروں کے معاملات ضبط کرتا ہے: روزانہ اجرت پر ایسی شرائط جو صبح کی دیر اور شام سے پہلے رخصتی روکیں؛ ان لوگوں سے خبردار جو کم قیمت بتا کر کام لیں اور پھر آجر پر اتنا بوجھ ڈالیں کہ وہ ناتمام جائیداد بیچ دے؛ زاویہ، وزن اور ڈور استعمال کی ذمہ داری کہ عمارت سیدھی کھڑی ہو ورنہ نقص کی ذمہ داری ہو؛ کرایے کے پڑاؤ کی لکڑی کاٹنے پر تلافی؛ اور زینوں پر اوپر نیچے چڑھنے اترنے والے رقّاصوں کے لیے شرائط کہ وہ پائجمہ پہنیں اور غروب سے پہلے نہ جائیں۔ مستری قسم کھاتے ہیں کہ وہ چونا بھٹھے والوں اور گچ سازوں سے رشوت یا تحفہ نہ لیں؛ پکے چونے کی پہچان یہ ہے کہ بھٹے میں پیسنے سے پہلے زرد ہو، اور پانی میں ملاکر برتن میں رکھنے پر جلد سوکھ جائے؛ نہ پرانا چونا چلے نہ نااہل۔ اولیہ چلبی مستریوں کے جلوس کی صورت بیان کرتا ہے: بڑھئی لکڑی کے مکان تیار کرتے ہیں، بنّاء دیواریں اٹھاتے ہیں اور جبّاص اپنی جبس کی چکیاں چلاتے ہیں۔"
