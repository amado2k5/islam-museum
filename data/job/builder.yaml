summary:
  ar: "البنّاء هو من يشيّد الحيطان بالحجر واللبن والخشب ويقيم البيوت والحمّامات والجوامع. يجمع ابن الأخوة النجّارين والمنشّارين والبنّائين في باب واحد ويضبط أجرتهم وأمانتهم: أن يُشترَط للأجرة اليومية ما يمنع التأخر صباحاً والانصراف قبل الغروب، وأن يستعمل العامل الزوايا والأثقال والخيوط فيقوم البناء مستوياً وإلا ضمن الخلل، وأن يحلف البنّاءون ألا يقبلوا رشوة من حرّاقي الجير وصنّاع الجبس على الجير غير الناضج. وفي موكب إسطنبول عند إوليا جلبي تسير دار المعماريين بسبعين خليفة يقدر كل منهم على بناء جامع كآيا صوفيا، ويمرّ البنّاءون ⁦(بنّائيان)⁩ ثلاثة آلاف رجل يشيّدون الحيطان وهم في المسير. وفي قاهرة القرن التاسع عشر كانت صنائع البناء تشغل نحو ثلث الصنّاع."
  en: "The banna raised the walls in stone, brick and wood and put up the houses, baths and mosques. Ibn al-Ukhuwwa groups carpenters, sawyers and builders in one chapter and regulates their wages and honesty: terms are fixed for the agreed daily wage to stop late starts and early departures; the workman must use angles, weights and lines so the building stands true, or he is liable for the fault; and the masons must swear not to take bribes from the lime-burners and gypsum-makers over underburnt lime. In Evliya's procession the establishment of the architects marches with seventy master-builders, each able to build a mosque like Aya Sofiyah, and the builders (Bennayan) pass three thousand strong raising walls as they go. In nineteenth-century Cairo the building trades occupied about a third of the artisan workforce."
  ur: "بنّاء پتھر، اینٹ اور لکڑی سے دیواریں اٹھا کر مکان، حمام اور مسجدیں بناتا تھا۔ ابن الاخوہ بڑھئیوں، آری کشوں اور مستریوں کو ایک باب میں جمع کر کے ان کی اجرت اور دیانت ضبط کرتا ہے: طے شدہ روزانہ اجرت پر ایسی شرائط جو صبح کی دیر اور شام سے پہلے رخصتی روکیں؛ مزدور زاویہ، وزن اور ڈور استعمال کرے کہ عمارت سیدھی کھڑی ہو ورنہ نقص کی ذمہ داری اس پر ہے؛ اور مستری قسم کھائیں کہ وہ چونا بھٹھے والوں اور گچ سازوں سے ادھوری چونے کے لیے رشوت نہ لیں۔ اولیاء چلبی کے جلوس میں معماری خانہ ستر استاد معماروں کے ساتھ چلتا ہے جن میں سے ہر ایک آیا صوفیہ جیسی مسجد بنا سکتا ہے، اور مستری ⁦(بنّائیان)⁩ تین ہزار آدمی چلتے چلتے دیواریں اٹھاتے ہیں۔ انیسویں صدی کے قاہرہ میں تعمیر کے پیشے تقریباً ایک تہائی دستکاروں پر مشتمل تھے۔"
  es: "El banna levantó los muros de piedra, ladrillo y madera y construyó las casas, los baños y las mezquitas. Ibn al-Ukhuwwa agrupa a carpinteros, aserradores y constructores en un capítulo y regula sus salarios y honestidad: se fijan condiciones para el salario diario acordado para evitar retrasos y salidas anticipadas; el trabajador debe usar ángulos, pesos y líneas para que el edificio se mantenga recto, o será responsable de la falla; y los albañiles deben jurar no aceptar sobornos de los caleros y fabricantes de yeso por cal poco cocida. En la procesión de Evliya, el gremio de arquitectos marcha con setenta maestros constructores, cada uno capaz de construir una mezquita como Santa Sofía, y los constructores (Bennayan) pasan junto a tres mil fuertes muros de izamiento a su paso. En el Cairo del siglo XIX, los oficios de la construcción ocupaban aproximadamente un tercio de la mano de obra artesanal."
