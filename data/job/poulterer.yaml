summary:
  ar: "الدَّجَّاج مربّي الدجاج وبائعه، وفي موكب إسطنبول عدّ إوليا الطاووقجية ⁦(باعة الدجاج)⁩ أربعمئة رجل بمئة وخمسة دكاكين، بيرهم قارون الكيميائي المشهور الذي اتّخذ الدواجن رأس مال حقيقياً، فلما ابتلعته الأرض بقيت دواجنه والنطرون ميراثاً لأرض مصر — وهو الذي اخترع تفقيس الدجاج في الأفران، فمن لم يره لم ير شيئاً في هذه الدنيا — وكان الطاووقجية تبعاً لموكب البندقية وصنّاع السهام لأنهم يحتاجون ريش الدجاج أحياناً، ويمرّون بأصناف الديوك والدجاج في أقفاص بعضها معقّر وبعضها بملكين وأبَق مشقوق والديوك تصيح «كوكوروكو». وللدجاج أمين سلطاني هو الطاووق‌أمين: آغا بمئتي رجل تُعطى له من بيت المال قرى قرب رودستو وملاقرة وخيربولي لتربية الدواجن، ويورد للمطبخ السلطاني كل سنة ألفاً ومئتي دجاجة. وعند لين في مصر أفران التفقيس ⁦(معامل)⁩: يفحص ناظر الفرن البيض ثم يعطي دجاجة عن كل بيضتين؛ تُوقَد النيران في نصف الخلايا عشرة أيام ثم تُطفأ وتُوقَد في النصف الآخر ويوضَع بيض جديد تحتها، وبعض البيض الأول يُنقَل إلى أرضية الخلية العليا؛ والحرارة بين مئة ومئة وثمان درجات فهرنهايت، والمدير يعرف بالخبرة الطويلة الحرارة اللازمة بلا ميزان؛ ويفقس بعض البيض يوم عشرين وأكثره يوم إحدى وعشرين كمدة الحضانة الطبيعية، والضعاف يوضعون في الممر. وسجّلت الجريدة الرسمية المصرية سنة ١٢٤٦هـ ⁦(١٨٣١م)⁩ عدد معامل التفقيس في الوجهين البحري والقبلي وما استُعمل فيها من بيض وما فقس منه."
  en: "The dajjaj bred and sold poultry. In Evliya's Istanbul procession the poulterers (Tavukjian) were four hundred men in a hundred and five shops; their patron is Karun the famous alchemist — Charon — who held a great number of poultry as a real capital, and when the earth swallowed him his poultry and the natron remained as his heritage to the land of Egypt: it was he who invented hatching chickens in ovens — he who has not seen it has seen nothing in this world. The poulterers marched in the suite of the bowmen and arrow-makers, who sometimes need poultry feathers, passing with different kinds of cocks and hens in cages — some horned, some with two beaks, some forked — the cocks all crowing 'kukuruku'. The poultry had its own officer, the Tauk-emini: an Agha with two hundred men, given villages near Rodosto, Malakra and Khireboli for breeding poultry, supplying the imperial kitchen each year with twelve hundred chickens. In Lane's Egypt the hatching happened in chicken-ovens (maamal): the attendant examines the eggs brought by the neighbourhood and usually gives one chicken for every two eggs received; fires burn for the first ten days in the fire-cells over only half the ovens, are then put out and re-lit over the other half while fresh eggs are laid below, and some of the first eggs are moved to the floor of the cells where the fires have gone out; the heat is held at 100 to 108 degrees Fahrenheit, and the manager knows by long experience the exact temperature without any instrument. On the twentieth day some eggs hatch, most on the twenty-first — the same period as natural incubation — the weaker chickens set in the passage. An official Egyptian newspaper of 1246 AH (1831) counted the hatching establishments of Lower and Upper Egypt, the millions of eggs used and the millions hatched."
  ur: "دجّاج مرغی پالتا اور بیچتا تھا۔ اولیاء کے استنبول کے جلوس میں مرغی فروش ⁦(طاووقجیان)⁩ چار سو آدمی ایک سو پانچ دکانوں پر تھے؛ ان کا پیر مشہور کیمیا دان قارون ہے جس نے مرغیوں کو حقیقی سرمایہ بنا رکھا تھا، اور جب زمین اسے نگل گئی تو اس کی مرغیاں اور نطرون مصر کی میراث بنیں — اسی نے تنوروں میں چوزے نکالنا ایجاد کیا: جس نے نہ دیکھا اس نے دنیا میں کچھ نہیں دیکھا۔ مرغی فروش تیر اندازوں اور تیر سازوں کی جلو میں چلتے کہ انہیں کبھی مرغی کے پر چاہیے، اور قفسوں میں قسم قسم کے مرغ اور مرغیاں لے کر نکلتے — بعض سینگ دار، بعض دو چونچ والے، بعض دُم شاخے — مرغے «کوکروکوں» بانگ دیتے۔ مرغیوں کا اپنا افسر طاووق‌امین تھا: ایک آغا دو سو آدمیوں سمیت، جسے رودستو، ملاقرہ اور خیربولی کے قریب دیہات پالتو پرورش کو دیے گئے، وہ شاہی باورچی خانے کو ہر سال بارہ سو مرغیاں دیتا۔ لین کے مصر میں انڈے معامل نامی تنوروں میں سینے جاتے: محلے والے انڈے دیتے اور نگران ہر دو انڈوں پر ایک چوزہ دیتا؛ پہلے دس دن آدھے تنوروں کے اوپر والے خانوں میں آگ جلتی، پھر وہ بجھا کر دوسرے خانوں میں جلائی جاتی اور نیچے نئے انڈے رکھے جاتے، اور پہلے انڈوں میں سے بعض بجھے خانے کے فرش پر منتقل ہوتے؛ حرارت فہرنہائیٹ کے ۱۰۰ سے ۱۰۸ درجے میں رہتی اور منتظم بغیر آلہ طویل تجربے سے درست درجہ جانتا۔ بیسویں دن بعض انڈے پھوٹتے، اکثر اکیسویں — قدرتی سیون ہی کا زمانہ — اور کمزور چوزے راہداری میں رکھے جاتے۔ ۱۲۴۶ھ ⁦(۱۸۳۱ء)⁩ کے سرکاری مصری اخبار نے زیریں و بالائی مصر کے سیون خانوں، کروڑوں استعمال انڈوں اور نکلے چوزوں کی گنتی شائع کی۔"
  es: "Los dajjaj criaban y vendían aves de corral. En la procesión de Evliya en Estambul, los avicultores (Tavukjian) eran cuatrocientos hombres en ciento cinco tiendas; su patrón era Karun, el famoso alquimista —Caronte—, quien poseía una gran cantidad de aves de corral como verdadero capital, y cuando la tierra lo engulló, sus aves y el natrón permanecieron como su herencia para la tierra de Egipto: fue él quien inventó la incubación de pollos en hornos; quien no lo ha visto no ha visto nada en este mundo. Los avicultores marchaban en el séquito de los arqueros y fabricantes de flechas, que a veces necesitaban plumas de aves, pasando con diferentes tipos de gallos y gallinas en jaulas —algunos con cuernos, algunos con dos picos, algunos bifurcados—, los gallos cantando todos «kukuruku». Las aves de corral tenían su propio oficial, el Tauk-emini: un Agha con doscientos hombres, a quien se le asignaron aldeas cerca de Rodosto, Malakra y Khireboli para la cría de aves de corral, abasteciendo la cocina imperial cada año con mil doscientos pollos. En el Egipto de Lane, la incubación se realizaba en hornos de pollos (maamal): el encargado examinaba los huevos que traían los vecinos y solía dar un pollo por cada dos huevos recibidos; durante los primeros diez días, el fuego ardía en las celdas sobre solo la mitad de los hornos, luego se apagaba y se volvía a encender sobre la otra mitad mientras se ponían huevos frescos debajo, y algunos de los primeros huevos se trasladaban al suelo de las celdas donde el fuego se había apagado; el calor se mantenía entre 100 y 108 grados Fahrenheit, y el encargado conocía por larga experiencia la temperatura exacta sin ningún instrumento. Al vigésimo día eclosionaban algunos huevos, la mayoría al vigésimo primero —el mismo período que la incubación natural— los pollos más débiles se colocaban en el pasillo. Un periódico oficial egipcio de 1246 AH (1831) contabilizó los establecimientos de incubación del Bajo y Alto Egipto, los millones de huevos utilizados y los millones de huevos incubados."
  fr: "Les dajjaj élevaient et vendaient de la volaille. Lors du cortège d'Evliya à Istanbul, les volaillers (Tavukjian) étaient quatre cents hommes répartis dans cent cinq boutiques. Leur protecteur était Karun, le célèbre alchimiste – Charon – qui possédait une grande quantité de volailles comme un véritable capital. À sa mort, ses volailles et le natron restèrent en héritage pour l'Égypte. C'est lui qui inventa l'élevage de poussins au four – qui ne l'a pas vu n'a rien vu au monde. Les volaillers défilaient dans la suite des archers et des fabricants de flèches, qui ont parfois besoin de plumes de volaille, avec différentes sortes de coqs et de poules en cage – certains à cornes, d'autres à becs doubles, d'autres encore à bec fourchu – les coqs chantant tous « kukuruku ». La volaille avait son propre officier, le Tauk-emini: un Agha à la tête de deux cents hommes, chargé de l'élevage de volailles dans des villages près de Rodosto, Malakra et Khireboli, fournissant chaque année douze cents poulets aux cuisines impériales. Dans l'Égypte de Lane, l'incubation se faisait dans des poulaillers (maamal): le responsable examinait les œufs apportés par le voisinage et donnait généralement un poussin pour deux œufs reçus. Le feu brûlait pendant les dix premiers jours dans les cellules qui ne couvraient que la moitié des poulaillers, puis était éteint et rallumé sur l'autre moitié, tandis que de nouveaux œufs étaient pondus en dessous. Certains des premiers œufs étaient déplacés sur le sol des cellules où le feu s'était éteint. La température était maintenue entre 100 et 108 degrés Fahrenheit, et le responsable connaissait la température exacte par une longue expérience, sans aucun instrument. Au vingtième jour, certains œufs éclosent, la plupart au vingt-et-unième jour – soit la même durée que l'incubation naturelle – les poussins les plus faibles étant placés dans le couloir. Un journal officiel égyptien de 1246 AH (1831) recensait les poulaillers de Basse et de Haute-Égypte, les millions d'œufs utilisés et les millions d'œufs éclos."
