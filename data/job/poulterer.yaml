craft:
  techniques:
    ar: "صنعة الدَّجَّاج صنعة تربية وتفقيس وبيع: قرى التربية عند رودستو وملاقرة وخيربولي تورد المطبخ السلطاني؛ وفي مصر أفران المعامل تفقّس البيض بحرارة بين مئة ومئة وثمان درجات بلا ميزان، بنار تُنقَل بين الخلايا وبيض يُبدَّل بين العلوّ والأرضية، يفقس في عشرين أو إحدى وعشرين يوماً كالحضانة الطبيعية، ويُعاد دجاجة عن كل بيضتين. وفي السوق يُباع الدجاج حياً في الأقفاص."
    en: "The poulterer's craft is breeding, hatching and selling: the breeding villages near Rodosto, Malakra and Khireboli supplying the imperial kitchen; in Egypt the maamal ovens hatching eggs at 100-108 degrees without an instrument, the fires shifted between cells and the eggs moved between upper floor and oven until they hatch in twenty or twenty-one days like natural incubation, one chicken returned for every two eggs; and in the market the birds sold alive in cages."
    ur: "دجّاج کا ہنر پالنا، سینا اور بیچنا ہے: رودستو، ملاقرہ اور خیربولی کے پرورش گاؤں شاہی باورچی خانے کی فراہمی کرتے؛ مصر میں معامل کے تنور بغیر آلہ ۱۰۰-۱۰۸ درجے پر انڈے سیتے، آگ خانوں میں پھیرتی اور انڈے اوپر نیچے بدلتے یہاں تک کہ بیس یا اکیس دن میں قدرتی سیون جیسے چوزے نکلیں اور ہر دو انڈوں کا ایک چوزہ لوٹے؛ اور بازار میں مرغیاں زندہ قفسوں میں بکیں۔"
