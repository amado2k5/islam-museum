  techniques:
    ar: "يأمر الشيزري الطبّاخين بتغطية آنيتهم ووقايتها الذباب والهوام بعد غسلها بالماء الحار والأُشنان، وألا يُطبخ لحم المعز مع الضأن ولا لحم الإبل مع البقر مخافة أن يأكل منه ناقه فينتكس. ومن غشّهم أن يسلبوا الشحم ويصبّوا الدهن في القدر فيطفو على وجهه فيُوهِم كثرة اللحم، وأن يثخّنوا المديرة بالدقيق أو دقيق الأرز والسميد، والبهاثة بالقلقاس، واللبنية بثفل الزيت أو النشا."
    en: "Al-Shayzari orders cooks to cover their vessels and protect them from flies and crawling insects after washing them with hot water and plant ash, and not to cook goat with mutton or camel with beef, lest someone recovering from illness eat it and relapse. Their recorded frauds include extracting the fat and pouring it back into the pot so it floats and suggests plentiful meat, thickening madira with flour, rice flour or fine semolina, bulking bahata with taro, and thickening labaniyya with the dregs of oil or cornstarch."
    ur: "الشیزری باورچیوں کو حکم دیتا ہے کہ برتن گرم پانی اور اُشنن سے دھو کر مکھیوں اور کیڑوں سے بچا کر ڈھانپیں، اور بکری کا گوشت بھیڑ کے ساتھ نہ اونٹ کا گائے کے ساتھ نہ پکائیں کہ کوئی صحت یاب ہوتا مریض کھا کر دوبارہ بیمار نہ ہو۔ ان کے دھوکھوں میں ہے کہ چربی نکال کر ہنڈیا میں ڈال دیں کہ اوپر تیرتی دکھ کر گوشت کی کثرت کا بھروسا دے، مدیرہ کو آٹے، چاول کے آٹے یا باریک سوجی سے گاڑھا کریں، بہاتہ میں اروی ملائیں اور لبنیہ کو تیل کے تلچھٹ یا کارن اسٹارچ سے گاڑھا کریں۔"
