summary:
  ar: "الطبّاخ هو من يطبخ الطعام ويبيعه في دكانه. تضبط كتب الحسبة صنعته: أن يغطّي آنيته ويقيها الذباب والهوام بعد غسلها بالماء الحار والأُشنان، وألا يطبخ لحم المعز مع الضأن ولا لحم الإبل مع البقر، وأن يُراقَب لئلا يكثر الدهن ويقلّل اللحم أو يغشّ الأطعمة بالدقيق. وفي قاهرة لين كانت دكاكين الطبّاخين تبيع الكباب وسائر الأطباق، وفي إسطنبول إوليا جلبي للطبّاخين طائفة مسلّحة وبير ينتسب إلى زمن النبوة."
  en: "The tabbakh cooked food and sold it from his shop. The hisba manuals regulate the trade: vessels must be covered and protected from flies after washing with hot water and plant ash; goat must not be cooked with mutton nor camel with beef; and cooks are watched lest they pour off fat, stint the meat or bulk the dishes with flour. In Lane's Cairo the cooks' shops sold kebab and other dishes to take away, and in Evliya's Istanbul the cooks marched as an armed guild with a patron from the Prophet's time."
  ur: "طباخ وہ ہے جو دکان میں کھانا پکا کر بیچتا ہے۔ حسبہ کی کتابیں اس کے پیشے کو ضبط کرتی ہیں: برتن گرم پانی اور اُشنن سے دھو کر مکھیوں سے بچا کر ڈھانپے جائیں؛ بکری کا گوشت بھیڑ کے ساتھ اور اونٹ کا گائے کے ساتھ نہ پکایا جائے؛ اور باورچیوں پر نظر رکھی جائے کہ چربی نکال کر گوشت کم اور آٹا ملا کر کھانا زیادہ نہ دکھائیں۔ لین کے قاہرہ میں باورچیوں کی دکانیں کباب اور دوسرے کھانے بیچتیں، اور اولیاء چلبی کے استنبول میں باورچی ایک مسلح انجمن بن کر چلتے تھے جن کا پیر نبوی زمانے سے جڑا ہے۔"
  es: "El tabbakh cocinaba y vendía comida en su tienda. Los manuales de la hisba regulaban el comercio: los recipientes debían cubrirse y protegerse de las moscas después de lavarlos con agua caliente y ceniza vegetal; no se debía cocinar cabra con cordero ni camello con ternera; y se vigilaba a los cocineros para que no escurrieran la grasa, racionaran la carne o rellenaran los platos con harina. En el Cairo de Lane, las tiendas de los cocineros vendían kebab y otros platos para llevar, y en el Estambul de Evliya, los cocineros marchaban como un gremio armado con un patrón de la época del Profeta."
  fr: "Le tabbakh cuisinait et vendait ses plats dans sa boutique. Les manuels de la hisba réglementaient ce commerce: les récipients devaient être couverts et protégés des mouches après avoir été lavés à l’eau chaude et à la cendre végétale; il était interdit de cuisiner la chèvre avec le mouton, ni le chameau avec le bœuf; et les cuisiniers étaient surveillés afin d’éviter qu’ils ne jettent de graisse, qu’ils ne lésinent sur la viande ou qu’ils n’ajoutent trop de farine aux plats. Dans le Caire de Lane, les boutiques des cuisiniers vendaient des kebabs et autres plats à emporter, et dans l’Istanbul d’Evliya, les cuisiniers défilaient en guilde armée sous la protection d’un mécène remontant à l’époque du Prophète."
  tr: "Aşçı, dükkanında yemek hazırlayıp satan kişidir. Pazar müfettişlerinin yönetmelikleri onların çalışmalarını düzenler: mutfak eşyalarını sıcak su ve sabunla yıkadıktan sonra üzerlerini örtmeli ve sineklerden ve böceklerden korumalıdırlar; keçi etini kuzu etiyle, deve etini de sığır etiyle pişirmemelidirler; ve çok fazla yağ ve çok az et kullanmamaları veya yiyecekleri unla karıştırmamaları için denetlenmelidirler. Kahire'de aşçı dükkanlarında kebap ve diğer yemekler satılırdı ve İstanbul'da aşçıların silahlı bir loncası vardı; bu loncanın tarihi Peygamber zamanına kadar uzanan bir hac yolu bulunuyordu."
  id: "Seorang juru masak adalah seseorang yang menyiapkan dan menjual makanan di tokonya. Peraturan inspektorat pasar mengatur pekerjaan mereka: mereka harus menutupi peralatan mereka dan melindunginya dari lalat dan serangga setelah mencucinya dengan air panas dan sabun; mereka tidak boleh memasak daging kambing bersama daging domba, atau daging unta bersama daging sapi; dan mereka harus diawasi untuk memastikan mereka tidak menggunakan terlalu banyak lemak dan terlalu sedikit daging, atau mencampur makanan dengan tepung. Di Kairo, toko-toko juru masak menjual kebab dan hidangan lainnya, dan di Istanbul, para juru masak memiliki perkumpulan bersenjata, sebuah rute ziarah yang berasal dari zaman Nabi."
