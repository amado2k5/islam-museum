craft:
  materials: [leather]
  techniques:
    ar: "يصف كونز وستيفنسون عدة الغوّاص ويومه: لباسه شبه عارٍ إلا لُبدة، وعلى أصابعه وإبهامه «خباط» ⁦(قبعات الأصابع)⁩ من جلد مرن يحمي من الأصداف والمرجان، يلبس منها الصياد طقمين في الموسم؛ وحجر الغطس بيضاوي مثقوب الطرف من ثلاثين إلى خمسين رطلاً يتدلّى من قوائم المركب بعقدة زلّاقة تحت سطح الماء، وغوّاصان يتناوبان على الحجر الواحد؛ يضع قدماً في العروة فوق الحجر وأخرى في سلة شبكية، يشدّ أنفه بـ«فطام» ⁦(مشبك من قرن مرن)⁩ ويطلق العقدة فيهبط، ويجمع ما استطاع في نحو خمسين ثانية أو أكثر ثم يهزّ الحبل فيُسرَع بصعوده. يغوص كل رجل ثلاثين أو أربعين مرة في اليوم ويأتي بعشر أو اثنتي عشرة صدفة في الغطسة، ويعملون بالأسهم فيُبقَى نصيب كل غوّاص على حدة؛ ومنهم من يبقى تحت الماء سبعين أو ثمانين أو حتى تسعين ثانية، وأثبت رصد مُوثَّق بقاءَ غوّاص عربي 109 ثوانٍ في سبع قامات سنة 1887."
    en: "Kunz and Stevenson describe the diver's gear and day: clad only in a loin-cloth, each finger and thumb covered by a khubat or 'finger-hat' of flexible leather against the sharp shells and coral — a fisherman wearing out at least two sets a season; the oval diving-stone of thirty to fifty pounds, perforated at one end, suspended over outriggers by a stout rope and held by a slip-knot a few feet below the surface, one stone serving two divers alternately. He places a foot in the loop above the stone and the other in a coir net-basket, closes his nostrils with a fitaam of flexible horn, releases the slip-knot and sinks; he gathers what he can in fifty seconds or more, then jerks the rope and is hauled up. Each man descends thirty or forty times a day, brings up ten or twelve oysters a dive, works on shares with each diver's shells kept separate; a substantiated record reports an Arab diver down 109 seconds in seven fathoms in 1887."
    ur: "کنز اور سٹیونسن غواص کا ساز و سامان اور دن بیان کرتے ہیں: بس لنگوٹی پہنے، ہر انگلی اور انگوٹھے پر «خباط» ⁦(انگلی کی ٹوپی)⁩ لچکدار چمڑے کی جو نوکیلی صدفوں اور مرجان سے بچائے — ایک ملاح ایک موسم میں کم از کم دو جوڑے سل کرتا ہے؛ بیضوی غوطے کا پتھر تیس سے پچاس پاؤنڈ، ایک سرے سوراخ دار، مضبوط رسی سے کشتی کے کناروں سے لٹکا ہوا اور چند فٹ پانی کے نیچے پھسل گرہ سے روکا، ایک پتھر دو غواصوں کے باری باری کام آتا ہے۔ وہ ایک پاؤں پتھر کے اوپر کی کلی میں رکھتا اور دوسرا ناریل کے رسی کے جال ٹوکری میں، ناک لچکدار سینگ کی «فتام» سے بند کر کے گرہ کھول کر ڈوبتا؛ پچاس سیکنڈ یا اس سے زائد میں جو سکے سمیٹ کر رسی جھٹکتا اور اوپر کھنچا جاتا۔ ہر آدمی دن میں تیس چالیس بار اترتا، ہر غوطے میں دس بارہ صدف لاتا، حصے کے حساب سے کام کرتا اور ہر غواص کی صدفیں الگ رہتیں؛ ایک مصدقہ ریکارڈ عرب غواص کا ۱۸۸۷ء میں سات قامت میں ۱۰۹ سیکنڈ رہنا ہے۔"
