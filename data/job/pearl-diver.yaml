summary:
  ar: "الغوّاص هو من ينزل إلى قاع البحر بحجر الغطس يجمع أصداف اللؤلؤ، وهو صميم صناعة مصائد الخليج. يذكر كونز وستيفنسون أن مصائد الخليج الفارسي هي أشهر مصائد الدنيا وأقدمها وأن عملها استمر ألفي عام: رآها ميغاسثينس نحو 307 ق.م. وذكرها بطلميوس في جزيرة تيلوس ⁦(البحرين)⁩ وكتب عنها المسعودي وابن بطوطة ووصفها بارتيما سنة 1508؛ وكان مركزها البحرين والقطيف، يسيّرها في مطلع القرن العشرين نحو 3500 مركب بها نحو 35 ألف صياد: نقودة ربّان المالك، وغيّاصون هم الغواصون، وسيب شدّادو الحبال من أعراب وفُرس، ومُصلّي يخفف عن الشدّادين ليصلّوا."
  en: "The ghawwas descended to the sea-bed on the diving-stone to gather the pearl-oysters, the core trade of the Gulf fisheries. Kunz and Stevenson record that the Persian Gulf fisheries were the most famous and most ancient in the world, prosecuted for more than two thousand years: Megasthenes noted them about 307 BC, Ptolemy placed them at Tylos (Bahrein), and al-Mas'udi, Benjamin of Tudela, Ibn Battuta and Barthema (1508) all describe them; their centre was Bahrein and El-Katif. In the early twentieth century some 3,500 boats worked them manned by about 35,000 fishermen: the nakhoda or captain-owner, the ghoas or divers, the sebs or rope-tenders of Bedouin and Persian stock, and the 'prayer-man' who relieved the sebs when they stopped to pray."
  ur: "غوّاص غوطے کے پتھر سے سمندر کی تہ تک اتر کر موتی صدف جمع کرتا تھا، اور یہی خلیج کی ماہی گیری کی اصل صنعت تھی۔ کنز اور سٹیونسن لکھتے ہیں کہ خلیج فارس کی مصائد دنیا کی مشہور ترین اور قدیم ترین تھیں جو دو ہزار سال سے زائد عرصے سے چلی آ رہی ہیں: مگاستھینز نے تقریباً ۳۰۷ ق م میں ان کا ذکر کیا، بطلمیوس نے انہیں جزیرہ تیلوس ⁦(بحرین)⁩ پر رکھا، اور مسعودی، بنجمن طدیلہ، ابن بطوطہ اور بارتیما ⁦(۱۵۰۸ء)⁩ سب نے ان کی صورت بیان کی؛ ان کا مرکز بحرین اور قطیف تھا۔ بیسویں صدی کے آغاز میں تقریباً ساڑھے تین ہزار کشتیاں ان پر کام کرتی تھیں جن میں پینتیس ہزار ملاح تھے: ناخدا یا مالک کپتان، گیّاص یعنی غواص، بادیوی اور فارسی نسل کے سیب یعنی رسہ سنبھالنے والے، اور «مصلّی» جو سیبوں کی نماز کے وقت ان کے کام سنبھالتا۔"
  es: "Los ghawwas descendían al lecho marino sobre la piedra de buceo para recolectar las ostras perlíferas, el principal producto de la pesca en el Golfo. Kunz y Stevenson registran que la pesca en el Golfo Pérsico fue la más famosa y antigua del mundo, practicada durante más de dos mil años: Megástenes la mencionó alrededor del 307 a. C., Ptolomeo la ubicó en Tilos (Baréin), y al-Mas'udi, Benjamín de Tudela, Ibn Battuta y Barthema (1508) la describen; su centro estaba en Baréin y El-Katif. A principios del siglo XX, unos 3500 barcos trabajaban en la zona, tripulados por unos 35 000 pescadores: el nakhoda o capitán-propietario, los ghoas o buzos, los sebs o encargados de las cuerdas, de origen beduino y persa, y el \"hombre de la oración\", que relevaba a los sebs cuando se detenían a rezar."
