summary:
  ar: "صاحب الشرطة رئيس جهاز أمن المدينة في الدول الإسلامية؛ بدأ المنصب بأول تعيينٍ في عهد عثمان لابن كنفذ ثم استقل عن القضاء وتوسّع في الدولتين الأموية والعباسية حتى صار من أركان البيروقراطية الأربعة ومقدَّماً على الوزراء في البرتوكول. كان يختار من أثقاء الخليفة أو الوالي، يلبس الخلعة والمنطقة والشاشية يوم التولية، يعقّب المجرمين ويدير السجون وينفّذ الأحكام ويرفع تقرير الأمن إلى الخليفة، ويتقاضى في العهد العباسي ألف دينار."
  en: "The sahib al-shurta headed the shurta, the urban security force of the Islamic states; the office began with Uthman's appointment of Ibn Kunfudh, broke free of the qadi's department, and grew under the Umayyads and Abbasids until Mansur counted it one of the four pillars of government and its chief walked directly before the caliph in protocol. Chosen from the ruler's most trusted men, invested with the khil'a, mintaqa and shashiyya at his accession, he hunted criminals, ran the prisons, executed sentences, reported on security to the caliph and drew a thousand dinars under the Abbasids."
  ur: "صاحب شرطہ اسلامی ریاستوں میں شہر کی سیکورٹی فورس شرطہ کا سربراہ تھا؛ یہ منصب عثمان کے عہد میں ابن کنفذ کی تقرری سے شروع ہوا، عدالت سے الگ ہوا اور اموی و عباسی دور میں اتنا بڑا کہ منصور نے اسے حکومت کے چار ستونوں میں شمار کیا اور اس کا سردار پروٹوکول میں خلیفہ کے بالکل آگے چلتا تھا۔ وہ حکمران کے قریب ترین لوگوں میں سے چنا جاتا، تقرری پر خلعت، منطقہ اور شاشیہ پہنتا، مجرموں کا پیچھا کرتا، جیل چلاتا، سزائیں نافذ کرتا اور خلیفہ کو سیکورٹی رپورٹ پیش کرتا؛ عباسی دور میں اس کی تنخواہ ایک ہزار دینار تھی۔"
  es: "El sahib al-shurta dirigía la shurta, la fuerza de seguridad urbana de los estados islámicos; el cargo se originó con el nombramiento de Ibn Kunfudh por Uthman, se independizó del departamento del cadí y creció bajo los omeyas y los abasíes hasta que Mansur lo consideró uno de los cuatro pilares del gobierno y su jefe caminaba directamente ante el califa en señal de protocolo. Elegido entre los hombres de mayor confianza del gobernante, investido con los títulos de khil'a, mintaqa y shashiyya al ascender al trono, perseguía criminales, administraba las prisiones, ejecutaba sentencias, informaba sobre seguridad al califa y percibía mil dinares bajo los abasíes."
  fr: "Le sahib al-shurta dirigeait la shurta, la force de sécurité urbaine des États islamiques. Cette fonction, créée par la nomination d'Ibn Kunfudh par Uthman, s'émancipa du département du cadi et se développa sous les Omeyyades et les Abbassides, jusqu'à ce que Mansur la considère comme l'un des quatre piliers du gouvernement et que son chef marche directement devant le calife lors des cérémonies protocolaires. Choisi parmi les hommes les plus fidèles du souverain, investi des titres de khil'a, mintaqa et shashiyya dès son accession au pouvoir, il traquait les criminels, administrait les prisons, exécutait les sentences, rendait compte de la sécurité au calife et percevait un salaire de mille dinars sous les Abbassides."
  tr: "İslam devletlerinde polis şefi, şehrin güvenlik aygıtının başıydı. Bu makam, Osman döneminde İbn Kanfud'un atanmasıyla başladı. Daha sonra yargıdan bağımsız hale geldi ve Emevi ve Abbasi devletlerinde genişleyerek bürokrasinin dört temel direğinden biri oldu ve protokolde bakanlardan önce geldi. Polis şefi, halifenin veya valinin güvenilir danışmanları arasından seçilirdi. Atandığı gün onur cübbesi, kemer ve fes giyerdi. Suçluları takip eder, hapishaneleri yönetir, cezaları infaz eder ve halifeye güvenlik raporları sunardı. Abbasi döneminde bin dinar maaş alırdı."
  id: "Kepala polisi adalah kepala aparat keamanan kota di negara-negara Islam. Jabatan ini dimulai dengan pengangkatan pertama pada masa pemerintahan Utsman, yaitu Ibnu Kanfudh. Jabatan ini kemudian menjadi independen dari lembaga peradilan dan berkembang selama masa pemerintahan Umayyah dan Abbasiyah hingga menjadi salah satu dari empat pilar birokrasi dan memiliki prioritas di atas menteri dalam protokol. Kepala polisi dipilih dari antara orang-orang kepercayaan khalifah atau gubernur. Ia mengenakan jubah kehormatan, ikat pinggang, dan fez pada hari pengangkatannya. Ia mengejar penjahat, mengelola penjara, melaksanakan hukuman, dan menyampaikan laporan keamanan kepada khalifah. Selama era Abbasiyah, ia menerima gaji seribu dinar."
