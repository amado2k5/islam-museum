craft:
  techniques:
    ar: "ضبط الحسبة عند ابن الأخوة والشيزري هو فنّ الدلالة نفسه: معرفة البائع وتسجيل اسمه في الديوان، الإعلام بالعيوب والسنّ والعادات، أجر الدلال مما يأخذه التاجر لا غير، وعدم الانصراف عن السعر الأعلى إلى الأدنى. وعند إوليا مهارة الصنعة في سوقها: استعراض الخيل بالسلاسل، إسطبلات التجّار الأغنياء بأربعين إلى خمسين فرساً عربية، ونظام الآغا والكاتب والياسقجية على البيع بالمزاد."
    en: "The hisba rules of Ibn al-Ukhuwwa and al-Shayzari are the craft of the brokerage itself: knowing the seller and entering his name in the register, disclosing blemishes, age and habits, taking only the commission the merchant took, and never turning from a higher bidder to a lower. In Evliya the skill lies in the market's display: horses led in chains for show, rich dealers' stables of forty to fifty Arabian horses, and the order of the agha, the writer and the yassakji over the public auction."
    ur: "ابن الاخوہ اور شیزری کے ضوابط خود دلالی کا فن ہیں: بائع کو جاننا اور اس کا نام رجسٹر میں لکھنا، خامیاں، عمر اور عادتیں بتانا، صرف اتنا اجر لینا جتنا تاجر نے دیا، اور بڑی بولی چھوڑ کر کم بولی کی طرف نہ جانا۔ اولیاء میں مہارت بازار کی نمائش میں ہے: زنجیروں میں گھوڑوں کا استعراض، امیر تاجروں کے اصطبل جن میں چالیس سے پچاس عربی گھوڑے، اور نیلامی پر آغا، کاتب اور یاسقجیوں کا نظم۔"
