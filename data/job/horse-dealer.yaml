summary:
  ar: "بَيّاع الخيل تاجر الدوابّ ودلّالها وسمسارها في سوق الخيل. في موكب إسطنبول عدّ إوليا الجانبازان ⁦(جانبازانِ أسب)⁩ ثلاثمئة رجل، بيرهم كانبور علي الذي قلّده عليّ وهلك مع شهداء كربلاء؛ وهم تجّار أغنياء في إسطبل كل واحد منهم أربعون إلى خمسين فرساً عربية، وأكثرهم من الغجر وفيهم كل الأمم. ومعهم دلّالو الخيل ⁦(دلّالانِ أسب)⁩ ثلاثمئة لهم حق بيع الخيل أينما بيعت بالمزاد، والسماسرة ⁦(ميانجيانِ أسب)⁩ بلا دكاكين يتوسّطون بين البائع والمشتري وبيرهم نجيب الدين بن كانبور علي، ويمرّون يقودون آلاف الخيل بالسلاسل مع آغا سوق الخيل وكاتبه والياسقجية، والتفتيشية تُزار بأربعين كيساً كل سنة. ويضبط ابن الأخوة دلّالي البهائم: لا يبيع دلّال دابّة إلا وهو يعرف البائع أو من يعرفه ويسجّل اسمه في ديوانه خشية أن تكون معيبة أو مسروقة، ويُعلِم المشتري بعيوبها وسنّها وعاداتها، ولا يأخذ إلا ما أخذه التاجر نفسه، ولا ينصرف الدلّال عمّن يعرض السعر الأعلى إلى من يعرض الأدنى."
  en: "The janbazan-esb dealt horses as merchant, crier and go-between of the horse-market. In Evliya's Istanbul procession the horse-dealers (Janbazan-esb) were three hundred men, their patron Kanbur Ali, girded by Ali and martyred with the martyrs of Kerbela; they are rich merchants, forty to fifty Arabian horses in each man's stable, most of them gipsies with people of all nations among them. With them march the criers of horses at public sales (Dellalan-esb), three hundred men with the right of selling horses wherever they are sold by auction, and the go-betweens (Mianjian-esb) who have no shops but mediate between buyer and seller, their patron Nejib-ud-din the son of Kanbur Ali; they pass leading thousands of horses by chains before the Inspector of the horse-market, his writer and the yassakji, the inspectorship being let every year for forty purses. Ibn al-Ukhuwwa polices the cattle-brokers: a broker may not sell an animal unless he knows the seller or someone who knows him, and must record the name in his register in case the animal is defective or stolen; he must inform the purchaser of its blemishes, age and habits, and claim nothing for it beyond what the merchant himself took; nor may the broker turn away from the one who offers a high price to one who offers a smaller."
  ur: "جانبازانِ اسب گھوڑوں کا تاجر، نیلامی کا دلال اور خیل بازار کا ثالث ہے۔ اولیاء کے استنبول کے جلوس میں جانبازان تین سو آدمی تھے، ان کا پیر کانبر علی ہے جسے علی نے کمر بند پہنائی اور جو کربلا کے شہیدوں میں ہلاک ہوا؛ وہ امیر تاجر ہیں، ہر ایک کے اصطبل میں چالیس سے پچاس عربی گھوڑے، اکثر گجر اور ہر قوم کے لوگ ان میں شامل ہیں۔ ان کے ساتھ گھوڑوں کے منادی کرنے والے دلال ⁦(دلالانِ اسب)⁩ تین سو ہیں جنہیں حق ہے کہ گھوڑے جہاں نیلام ہوں وہیں بیچیں، اور سمسار ⁦(میانجیانِ اسب)⁩ بغیر دکانوں کے بائع اور خریدار کے درمیان وساطت کرتے ہیں جن کا پیر نجیب الدین بن کانبر علی ہے؛ وہ زنجیروں میں ہزاروں گھوڑے لے کر خیل بازار کے آغا، اس کے کاتب اور یاسقجیوں کے آگے گزرتے، اور یہ نگرانی ہر سال چالیس بکس پر ٹھیکے دی جاتی ہے۔ ابن الاخوہ مویشیوں کے دلالوں کو ضبط کرتا ہے: دلال کوئی جانور نہ بیچے مگر اسے بائع یا بائع کا جاننے والا معلوم ہو، اور اس کا نام اپنے رجسٹر میں لکھے کہ کہیں جانور معیوب یا چرایا ہوا نہ ہو؛ وہ خریدار کو اس کی خامیاں، عمر اور عادتیں بتائے، اور تاجر کے حصے سے کچھ زیادہ نہ مانگے؛ دلال بڑی بولی دینے والے کو چھوڑ کر کم بولی والے کی طرف بھی نہ جائے۔"
