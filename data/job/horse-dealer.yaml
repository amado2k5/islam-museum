summary:
  ar: "بَيّاع الخيل تاجر الدوابّ ودلّالها وسمسارها في سوق الخيل. في موكب إسطنبول عدّ إوليا الجانبازان ⁦(جانبازانِ أسب)⁩ ثلاثمئة رجل، بيرهم كانبور علي الذي قلّده عليّ وهلك مع شهداء كربلاء؛ وهم تجّار أغنياء في إسطبل كل واحد منهم أربعون إلى خمسين فرساً عربية، وأكثرهم من الغجر وفيهم كل الأمم. ومعهم دلّالو الخيل ⁦(دلّالانِ أسب)⁩ ثلاثمئة لهم حق بيع الخيل أينما بيعت بالمزاد، والسماسرة ⁦(ميانجيانِ أسب)⁩ بلا دكاكين يتوسّطون بين البائع والمشتري وبيرهم نجيب الدين بن كانبور علي، ويمرّون يقودون آلاف الخيل بالسلاسل مع آغا سوق الخيل وكاتبه والياسقجية، والتفتيشية تُزار بأربعين كيساً كل سنة. ويضبط ابن الأخوة دلّالي البهائم: لا يبيع دلّال دابّة إلا وهو يعرف البائع أو من يعرفه ويسجّل اسمه في ديوانه خشية أن تكون معيبة أو مسروقة، ويُعلِم المشتري بعيوبها وسنّها وعاداتها، ولا يأخذ إلا ما أخذه التاجر نفسه، ولا ينصرف الدلّال عمّن يعرض السعر الأعلى إلى من يعرض الأدنى."
  en: "The janbazan-esb dealt horses as merchant, crier and go-between of the horse-market. In Evliya's Istanbul procession the horse-dealers (Janbazan-esb) were three hundred men, their patron Kanbur Ali, girded by Ali and martyred with the martyrs of Kerbela; they are rich merchants, forty to fifty Arabian horses in each man's stable, most of them gipsies with people of all nations among them. With them march the criers of horses at public sales (Dellalan-esb), three hundred men with the right of selling horses wherever they are sold by auction, and the go-betweens (Mianjian-esb) who have no shops but mediate between buyer and seller, their patron Nejib-ud-din the son of Kanbur Ali; they pass leading thousands of horses by chains before the Inspector of the horse-market, his writer and the yassakji, the inspectorship being let every year for forty purses. Ibn al-Ukhuwwa polices the cattle-brokers: a broker may not sell an animal unless he knows the seller or someone who knows him, and must record the name in his register in case the animal is defective or stolen; he must inform the purchaser of its blemishes, age and habits, and claim nothing for it beyond what the merchant himself took; nor may the broker turn away from the one who offers a high price to one who offers a smaller."
  ur: "جانبازانِ اسب گھوڑوں کا تاجر، نیلامی کا دلال اور خیل بازار کا ثالث ہے۔ اولیاء کے استنبول کے جلوس میں جانبازان تین سو آدمی تھے، ان کا پیر کانبر علی ہے جسے علی نے کمر بند پہنائی اور جو کربلا کے شہیدوں میں ہلاک ہوا؛ وہ امیر تاجر ہیں، ہر ایک کے اصطبل میں چالیس سے پچاس عربی گھوڑے، اکثر گجر اور ہر قوم کے لوگ ان میں شامل ہیں۔ ان کے ساتھ گھوڑوں کے منادی کرنے والے دلال ⁦(دلالانِ اسب)⁩ تین سو ہیں جنہیں حق ہے کہ گھوڑے جہاں نیلام ہوں وہیں بیچیں، اور سمسار ⁦(میانجیانِ اسب)⁩ بغیر دکانوں کے بائع اور خریدار کے درمیان وساطت کرتے ہیں جن کا پیر نجیب الدین بن کانبر علی ہے؛ وہ زنجیروں میں ہزاروں گھوڑے لے کر خیل بازار کے آغا، اس کے کاتب اور یاسقجیوں کے آگے گزرتے، اور یہ نگرانی ہر سال چالیس بکس پر ٹھیکے دی جاتی ہے۔ ابن الاخوہ مویشیوں کے دلالوں کو ضبط کرتا ہے: دلال کوئی جانور نہ بیچے مگر اسے بائع یا بائع کا جاننے والا معلوم ہو، اور اس کا نام اپنے رجسٹر میں لکھے کہ کہیں جانور معیوب یا چرایا ہوا نہ ہو؛ وہ خریدار کو اس کی خامیاں، عمر اور عادتیں بتائے، اور تاجر کے حصے سے کچھ زیادہ نہ مانگے؛ دلال بڑی بولی دینے والے کو چھوڑ کر کم بولی والے کی طرف بھی نہ جائے۔"
  es: "Los janbazan-esb comerciaban con caballos como mercaderes, pregoneros e intermediarios del mercado de caballos. En la procesión de Estambul de Evliya, los comerciantes de caballos (Janbazan-esb) eran trescientos hombres, su patrón Kanbur Ali, ceñido por Ali y martirizado con los mártires de Kerbela; eran ricos mercaderes, con cuarenta o cincuenta caballos árabes en el establo de cada uno, la mayoría gitanos, con gente de todas las naciones entre ellos. Con ellos marchaban los pregoneros de las ventas públicas de caballos (Dellalan-esb), trescientos hombres con derecho a vender caballos dondequiera que se vendieran en subasta, y los intermediarios (Mianjian-esb) que no tenían tiendas pero mediaban entre comprador y vendedor, su patrón Nejib-ud-din, hijo de Kanbur Ali; pasaban guiando miles de caballos encadenados ante el inspector del mercado de caballos, su escribano y el yassakji, el cargo de inspector se arrendaba cada año por cuarenta bolsas. Ibn al-Ukhuwwa regula a los intermediarios de ganado: un intermediario no puede vender un animal a menos que conozca al vendedor o a alguien que lo conozca, y debe registrar el nombre en su libro de registro en caso de que el animal sea defectuoso o robado; debe informar al comprador de sus defectos, edad y hábitos, y no reclamar nada por él más allá de lo que el propio comerciante recibió; tampoco puede el intermediario rechazar a quien ofrece un precio alto en favor de quien ofrece uno menor."
  fr: "Les marchands de chevaux (janbazan-esb) étaient à la fois marchands, crieurs et intermédiaires du marché aux chevaux. Lors du cortège d'Evliya à Istanbul, on comptait trois cents marchands de chevaux (janbazan-esb), sous la protection de Kanbur Ali, qui, avec les martyrs de Kerbela, les soutint. Ces riches marchands possédaient chacun quarante à cinquante chevaux arabes dans leurs écuries. La plupart étaient des gitans, et l'on y trouvait des personnes de toutes nationalités. Marchaient avec eux les crieurs de chevaux lors des ventes publiques (dellalan-esb), trois cents hommes autorisés à vendre des chevaux aux enchères, et les intermédiaires (mianjian-esb), qui ne tenaient pas de boutique mais servaient d'intermédiaires entre acheteurs et vendeurs. Leur protecteur était Nejib-ud-din, fils de Kanbur Ali. Ils défilaient en menant des milliers de chevaux enchaînés devant l'inspecteur du marché aux chevaux, son greffier et le yassakji, la charge d'inspecteur étant attribuée chaque année pour quarante bourses. Ibn al-Ukhuwwa réglemente les courtiers en bétail: un courtier ne peut vendre un animal que s’il connaît le vendeur ou quelqu’un qui le connaît, et doit inscrire son nom dans son registre au cas où l’animal serait défectueux ou volé; il doit informer l’acheteur de ses défauts, de son âge et de ses habitudes, et ne rien réclamer de plus que ce que le marchand a lui-même perçu; le courtier ne peut pas non plus refuser un prix élevé à celui qui en offre un plus bas."
  tr: "At satıcısı, at pazarında hayvan tüccarı, komisyoncusu ve aracıydı. İstanbul alayında, Evliya Janbazan (Janbazan Asp), Ali'nin takip ettiği ve Kerbela şehitleriyle birlikte şehit düşen Pirham Kanbur Ali de dahil olmak üzere üç yüz kişiyi saymıştı. Bunlar, her birinin ahırında kırk ila elli Arap atı bulunan, çoğu Çingene olan ve her milletten insanı içeren zengin tüccarlardı. Onlarla birlikte, atların açık artırmada satıldığı her yerde satma hakkına sahip üç yüz at komisyoncusu (Dallalan Asp) ve satıcı ile alıcı arasında aracılık yapan, dükkanı olmayan aracılar (Miyanjiyan Asp) vardı. Pirham Najib al-Din ibn Kanbur Ali de, at pazarının Ağası, kâtibi ve Yasaqjiya ile birlikte zincirlenmiş binlerce atı yöneterek alaya katıldı. Müfettişlik her yıl kırk kese dolusu malla ziyaret ediliyordu. Kardeşin oğlu hayvan simsarlarını denetler: Hiçbir simsar, satıcıyı veya onu tanıyan birini tanımadığı ve adını kayıt defterine kaydetmediği sürece hayvan satmaz; çünkü hayvanın kusurlu veya çalınmış olabileceğinden korkar. Alıcıya hayvanın kusurlarını, yaşını ve alışkanlıklarını bildirir ve sadece tüccarın kendisinin kabul ettiği fiyatı alır. Simsar, en yüksek fiyatı verenden en düşük fiyatı verene kadar hiçbir şeyi geri çevirmez."
  id: "Penjual kuda adalah pedagang hewan, makelar, dan perantara mereka di pasar kuda. Dalam prosesi Istanbul, Evliya Janbazan (Janbazan Asp) menghitung tiga ratus orang, termasuk Pirham Kanbur Ali, yang diikuti Ali dan yang gugur bersama para syuhada Karbala. Mereka adalah pedagang kaya, masing-masing memiliki empat puluh hingga lima puluh kuda Arab di kandangnya, sebagian besar adalah orang Gipsi, dan mereka termasuk orang-orang dari semua kebangsaan. Bersama mereka ada tiga ratus makelar kuda (Dallalan Asp) yang berhak menjual kuda di mana pun kuda itu dilelang, dan perantara (Miyanjiyan Asp) tanpa toko yang bertindak sebagai perantara antara penjual dan pembeli. Pirham Najib al-Din ibn Kanbur Ali juga ikut serta, memimpin ribuan kuda dalam rantai, bersama dengan Agha pasar kuda, juru tulisnya, dan Yasaqjiya. Inspektorat dikunjungi dengan empat puluh kantong barang setiap tahun. Putra dari saudara laki-laki tersebut mengatur para makelar ternak: tidak ada makelar yang menjual hewan kecuali dia mengenal penjualnya atau seseorang yang mengenalnya dan mencatat namanya dalam buku register karena khawatir hewan tersebut mungkin cacat atau dicuri. Dia memberi tahu pembeli tentang cacat, usia, dan kebiasaan hewan tersebut, dan hanya mengambil apa yang diambil oleh pedagang itu sendiri. Makelar tidak akan berpaling dari orang yang menawarkan harga tertinggi kepada orang yang menawarkan harga terendah."
