summary:
  ar: "الورّاق هو صاحب صناعة الكتاب في المدينة الإسلامية: ناسخ وصاحب ورق ومجلد وبائع كتب في شخص واحد في الغالب، تُورّد دكّانه الأقلام والحبر وتكون مجمعاً لأهل الأدب. يذكر غرومان أن الورّاقين كانوا في أغلب الأحوال صُنّاع ورق وتجّاره ونسّاخاً ومجلدين معاً، وأن محالّهم كانت مجالس المتأدبين ولهم أقسامهم الخاصة في الأسواق كسائر الحِرَف، وأن الناسخ قد ينسخ مئة صفحة في يوم وليلة، وأن الكتاب الجيّد كان يُشترى في المتوسط بدينار ذهب. وفي موكب إسطنبول عند إوليا جلبي تمرّ طائفة الصحّافين بمئتي رجل وستين دكّاناً تزيّنها الآلاف من الكتب النفيسة."
  en: "The warraq was the book trade of the Islamic city in one person: copyist, paper-dealer, binder and bookseller together, his shop supplying pens and ink and serving as a meeting-place of the cultured. Grohmann records that the warraqun were usually paper-makers and dealers, copyists and bookbinders in one, that their shops were the rendezvous of the educated classes, that they had their own sections in the bazaars like the other trades, that a copyist could copy a hundred pages in a day and a night, and that a gold dinar was the average price of a better book. In Evliya's Istanbul procession the booksellers' guild (Sahhafan) passes two hundred men with sixty shops adorned with many thousand precious books."
  ur: "ورّاق اسلامی شہر میں کتاب کی صنعت کو ایک ہی شخص میں جمع کرتا تھا: نسخہ نویس، کاغذ فروش، جلد ساز اور کتب فروش مل کر، اور اس کی دکان قلم اور سیاہی مہیا کر کے اہلِ ادب کی مسجد ⁦(مجلس)⁩ بنتی تھی۔ گروہمان لکھتا ہے کہ ورّاق اکثر کاغذ ساز اور فروشندہ، نسخہ نویس اور جلد ساز سب ایک ہی ہوتے تھے، ان کی دکانیں متعلم طبقے کی آماجگاہ تھیں اور دیگر پیشوں کی طرح بازاروں میں ان کے اپنے حصے تھے؛ ناسخ ایک دن اور ایک رات میں سو صفحات نقل کر سکتا تھا، اور اچھی کتاب کی اوسط قیمت ایک دینارِ زر تھی۔ اولیہ کے استنبول جلوس میں صحّافوں کی انجمن دو سو آدمی اور ساٹھ دکانوں کے ساتھ چلتی ہے جن پر ہزاروں نفیس کتابیں سجی تھیں۔"
