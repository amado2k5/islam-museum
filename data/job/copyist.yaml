summary:
  ar: "الورّاق هو صاحب صناعة الكتاب في المدينة الإسلامية: ناسخ وصاحب ورق ومجلد وبائع كتب في شخص واحد في الغالب، تُورّد دكّانه الأقلام والحبر وتكون مجمعاً لأهل الأدب. يذكر غرومان أن الورّاقين كانوا في أغلب الأحوال صُنّاع ورق وتجّاره ونسّاخاً ومجلدين معاً، وأن محالّهم كانت مجالس المتأدبين ولهم أقسامهم الخاصة في الأسواق كسائر الحِرَف، وأن الناسخ قد ينسخ مئة صفحة في يوم وليلة، وأن الكتاب الجيّد كان يُشترى في المتوسط بدينار ذهب. وفي موكب إسطنبول عند إوليا جلبي تمرّ طائفة الصحّافين بمئتي رجل وستين دكّاناً تزيّنها الآلاف من الكتب النفيسة."
  en: "The warraq was the book trade of the Islamic city in one person: copyist, paper-dealer, binder and bookseller together, his shop supplying pens and ink and serving as a meeting-place of the cultured. Grohmann records that the warraqun were usually paper-makers and dealers, copyists and bookbinders in one, that their shops were the rendezvous of the educated classes, that they had their own sections in the bazaars like the other trades, that a copyist could copy a hundred pages in a day and a night, and that a gold dinar was the average price of a better book. In Evliya's Istanbul procession the booksellers' guild (Sahhafan) passes two hundred men with sixty shops adorned with many thousand precious books."
  ur: "ورّاق اسلامی شہر میں کتاب کی صنعت کو ایک ہی شخص میں جمع کرتا تھا: نسخہ نویس، کاغذ فروش، جلد ساز اور کتب فروش مل کر، اور اس کی دکان قلم اور سیاہی مہیا کر کے اہلِ ادب کی مسجد ⁦(مجلس)⁩ بنتی تھی۔ گروہمان لکھتا ہے کہ ورّاق اکثر کاغذ ساز اور فروشندہ، نسخہ نویس اور جلد ساز سب ایک ہی ہوتے تھے، ان کی دکانیں متعلم طبقے کی آماجگاہ تھیں اور دیگر پیشوں کی طرح بازاروں میں ان کے اپنے حصے تھے؛ ناسخ ایک دن اور ایک رات میں سو صفحات نقل کر سکتا تھا، اور اچھی کتاب کی اوسط قیمت ایک دینارِ زر تھی۔ اولیہ کے استنبول جلوس میں صحّافوں کی انجمن دو سو آدمی اور ساٹھ دکانوں کے ساتھ چلتی ہے جن پر ہزاروں نفیس کتابیں سجی تھیں۔"
  es: "El warraq era el comercio de libros de la ciudad islámica en una sola persona: copista, vendedor de papel, encuadernador y librero, todo en uno; su tienda suministraba plumas y tinta y servía como punto de encuentro de la gente culta. Grohmann registra que los warraqun solían ser fabricantes y vendedores de papel, copistas y encuadernadores a la vez; que sus tiendas eran el punto de encuentro de las clases educadas; que tenían sus propias secciones en los bazares como los demás oficios; que un copista podía copiar cien páginas en un día y una noche; y que un dinar de oro era el precio medio de un buen libro. En la procesión de Estambul de Evliya, el gremio de libreros (Sahhafan) desfila con doscientos hombres y sesenta tiendas adornadas con miles de libros valiosos."
  fr: "Le warraq incarnait le commerce du livre dans la ville islamique à lui seul: copiste, marchand de papier, relieur et libraire, sa boutique fournissant plumes et encre et servant de lieu de rencontre pour les gens cultivés. Grohmann rapporte que les warraqun étaient généralement à la fois fabricants et marchands de papier, copistes et relieurs, que leurs boutiques étaient le rendez-vous des classes instruites, qu'ils disposaient de leurs propres sections dans les bazars, comme les autres corps de métiers, qu'un copiste pouvait copier cent pages en un jour et une nuit, et qu'un dinar d'or coûtait en moyenne un livre de qualité. Dans le cortège d'Evliya à Istanbul, la guilde des libraires (Sahhafan) défile, composée de deux cents hommes et de soixante boutiques regorgeant de milliers de livres précieux."
  tr: "İslam şehrinde kitap endüstrisinin efendisi ciltçiydi: kâtip, kağıt tüccarı, ciltçi ve kitap satıcısı, çoğu zaman bunların hepsini bir arada barındıran bir kişiydi. Dükkanı kalem ve mürekkep tedarik eder ve edebiyatçılar için bir buluşma yeri görevi görürdü. Grouman, ciltçilerin çoğu durumda aynı anda kağıt üreticisi, tüccar, kâtip ve ciltçi olduklarını ve dükkanlarının diğer meslekler gibi pazarlarda kendilerine ayrılmış bölümleriyle alimler için buluşma yerleri olduğunu belirtiyor. Ayrıca bir kâtibin tek bir günde ve gecede yüz sayfa kopyalayabildiğini ve iyi bir kitabın ortalama bir altın dinara alındığını ifade ediyor. Evliya Çelebi'nin konutundaki İstanbul alayında, binlerce değerli kitapla süslenmiş iki yüz kişilik bir grup ve altmış dükkan geçiyor."
  id: "Penjilid buku adalah tokoh utama dalam industri buku di kota Islam: seorang juru tulis, pedagang kertas, penjilid buku, dan penjual buku, seringkali semuanya dalam satu orang. Tokonya menyediakan pena dan tinta serta berfungsi sebagai tempat berkumpulnya tokoh-tokoh sastra. Grouman mencatat bahwa penjilid buku, dalam kebanyakan kasus, adalah pembuat kertas, pedagang, juru tulis, dan penjilid buku sekaligus, dan bahwa toko-toko mereka adalah tempat pertemuan para cendekiawan, dengan bagian khusus mereka sendiri di pasar seperti perdagangan lainnya. Ia juga menyatakan bahwa seorang juru tulis dapat menyalin seratus halaman dalam satu hari dan malam, dan bahwa sebuah buku yang bagus dibeli dengan harga rata-rata satu dinar emas. Dalam prosesi Istanbul di kediaman Evliya Çelebi, sekelompok dua ratus pria dan enam puluh toko yang dihiasi dengan ribuan buku berharga lewat."
