  techniques:
    ar: "يجمع غرومان ما عرفه العصر الكلاسيكي عن صناعة الورّاق: فقد كان الورّاقون في أغلب الأحوال صُنّاع الورق وتجّاره ونسّاخاً ومجلدين في آن، ويورّدون الأقلام والحبر أيضاً، وكانت محالّهم مجالس يتردد عليها أهل الثقافة كما كان يتردد أدباء روما على دكاكين الباعة، وكان لبائعي الكتب وصُنّاع الورق أقسامهم في الأسواق كبقية الحرف. وكان الناسخ الماهر ينسخ مئة صفحة في يوم وليلة، وكانت تُدفع أسعار باهظة في الأعمال الأدبية النفيسة وخاصة نسخ المؤلفين بخط أيديهم، ومتوسط ثمن الكتاب الجيّد دينار ذهب. وفي إسطنبول مرّ الصحّافون بمئتي رجل وستين دكاناً يزيّنونها بآلاف الكتب النفيسة."
    en: "Grohmann gathers what the classical period knew of the warraq's trade: the warraqun were usually paper-makers and dealers, copyists and bookbinders in one, supplying pens and ink as well; their shops were the rendezvous of the cultured classes just as the literary connoisseurs of Rome met in the booksellers' booths, and booksellers and paper-makers had their own sections in the bazaars like the other trades. A skilled copyist could copy a hundred pages in a day and a night; fantastic prices were paid for valuable literary works, especially authors' autographs, and a gold dinar — in one comparison, a year's rent of a wine-bar — was the average price of a better book. In Istanbul the Sahhafan passed two hundred men with sixty shops adorned with many thousand precious books."
    ur: "گروہمان نے کلاسیکی دور کی ورّاقی صنعت جمع کی ہے: ورّاق اکثر کاغذ ساز اور فروشندہ، نسخہ نویس اور جلد ساز سب ایک ہوتے اور قلم و سیاہی بھی دیتے تھے؛ ان کی دکانیں متعلم طبقے کی آماجگاہ تھیں جس طرح روم کے ادب شناس کتاب فروشوں کی دکانوں پر جمع ہوتے، اور کتاب فروشوں اور کاغذ سازوں کے بازاروں میں اپنے حصے تھے جیسے دیگر پیشوں کے۔ ماہر ناسخ ایک دن اور ایک رات میں سو صفحات نقل کر سکتا تھا؛ نفیس ادبی تصانیف بالخصوص مصنف کے دستخطی نسخوں کی بڑی قیمتیں ادا ہوتیں، اور اچھی کتاب کی اوسط قیمت ایک دینارِ زر تھی۔ استنبول میں صحّاف دو سو آدمی اور ساٹھ دکانوں کے ساتھ گزرے جن پر ہزاروں نفیس کتابیں سجی تھیں۔"
