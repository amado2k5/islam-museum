summary:
  ar: "الراقص حرفي الفرح والميدان: عند المصريين قبيلة الغوازي ترقص نساؤها — الغازية — مكشوفات الوجوه في الأسواق والأفراح إلى صوت الكمانجة والرباب والطار والدربوكة، وعند الترك الچنگي راقصات وكۆچك غلمان يرقصون رقص النساء، وجرجوناباز يقلّدون الراقصين تقليداً غليظاً يُضحك الناس. أحصى أوليا في إستانبول اثنتي عشرة فرقة من الصبيان الراقصين والمقلّدين تسمّى چنگي، يتسابقون في الرقص والألعاب أمام قصر العروض. وفي مصر وصف لين رقص الغوازي بالاهتزاز السريع للوركين مع صنجات النحاس، وسجّل حظر الرقص العلني في القاهرة عام 1834 حتى انتقلت الطائفة إلى الصعيد."
  en: "The dancer is the professional of feast and square: in Egypt the Ghawazee tribe whose women — the ghâziya — dance unveiled in streets and festivities to the kemengeh, rabâb, târ and darabukkeh; among the Turks the çengi women dancers and the köçek boys who danced in female manner, and the curcunabaz clowns who burlesqued them. Evliya counts twelve companies of dancing and mimicking boys in Istanbul, all called çengi, vying in dance and tricks before the Alai kiosk. In Egypt Lane described the Ghawazee's rapid hip-vibration with brass castanets, and recorded the 1834 ban on public dancing in Cairo that drove the tribe to Upper Egypt."
  ur: "رقاص دعوتوں اور میدان کا پیشہ ور ہے: مصر میں غوازی قبیلہ جس کی عورتیں — غازیہ — کھلے چہرے بازاروں اور جشنوں میں کمانجہ، رباب، طار اور دربکے پر رقص کرتی ہیں؛ ترکوں میں چنگی رقاصائیں اور کوچک لڑکے جو زنانہ انداز میں ناچتے، اور جرجوناباز جو بھدّی نقل سے ہنساتے۔ اولیا نے استنبول میں رقص و تقلید کے بارہ لڑکوں کے دستے گنے جو سب چنگی کہلاتے، علائی کوشک کے آگے رقص اور کرتب میں سبقت کرتے۔ مصر میں لین نے غوازی کا تیز کولہے ہلانے والا رقص پیتل کی کھڑتالوں ساتھ بیان کیا اور ۱۸۳۴ء میں قاہرے میں عوامی رقص پر پابندی درج کی جس سے قبیلہ صعید منتقل ہوا۔"
  es: "El bailarín es el profesional de las fiestas y las plazas: en Egipto, la tribu Ghawazee, cuyas mujeres —las ghâziya— bailan descubiertas en las calles y festividades al son del kemengeh, el rabâb, el târ y el darabukkeh; entre los turcos, las bailarinas çengi y los niños köçek que bailaban a la manera femenina, y los payasos curcunabaz que las parodiaban. Evliya cuenta doce compañías de niños bailarines e imitadores en Estambul, todos llamados çengi, que compiten en bailes y trucos frente al quiosco Alai. En Egipto, Lane describió la rápida vibración de cadera de los Ghawazee con castañuelas de latón y registró la prohibición de 1834 del baile público en El Cairo que obligó a la tribu a trasladarse al Alto Egipto."
  fr: "Le danseur est l'âme des fêtes et des places publiques: en Égypte, la tribu des Ghawazee, dont les femmes – les ghâziya – dansent dévoilées dans les rues et lors des festivités au son des kemengeh, rabâb, târ et darabukkeh; chez les Turcs, les danseuses çengi et les garçons köçek qui dansent à la manière féminine, ainsi que les clowns curcunabaz qui les parodient. Evliya recense douze troupes de garçons danseurs et imitateurs à Istanbul, tous appelés çengi, rivalisant de danse et de numéros devant le kiosque Alai. En Égypte, Lane décrit le déhanchement rapide des Ghawazee accompagné de castagnettes en laiton et relate l'interdiction de la danse publique au Caire en 1834, qui contraignit la tribu à se réfugier en Haute-Égypte."
