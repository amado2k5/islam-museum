summary:
  ar: "الحَكَم من يختاره المتخاصمان بإرادتهما ليفصل نزاعهما؛ كان حرفة أهل السؤدد في الجاهلية الحجازية حين لا سلطة مركزية، فتحكّم حكماء القبائل في أسواق كعكاظ ومنهم نساء كسُهْن بنت لقمان، وتحكّم النبي قبل النبوة في وضع الحجر الأسود. أقرّه الفقه طريقاً تكميلياً للقضاء الرسمي: ولايته بقدر ما حُوّل إليه، يعزله الطرفان قبل الحكم، ويُشترط فيه ما يُشترط في القاضي من عقل وبلوغ وعدالة وعلم."
  en: "The hakam is the arbiter whom disputing parties choose of their own will to settle their quarrel; the office belonged to the notables of pre-Islamic Hijaz, where there was no central power, and tribal arbiters — among them women like Suhn bint Luqman — judged between tribes at markets such as Ukaz, while the Prophet himself arbitrated the placing of the Black Stone before his mission. Fiqh kept him as a complement to the official court: his writ runs only over what is submitted to him, the parties may dismiss him before the ruling, and the jurists require of him what they require of the qadi — reason, majority, probity and knowledge."
  ur: "حکم وہ شخص ہے جسے جھگڑنے والے فریق اپنی مرضی سے جھگڑا نپٹانے کے لیے چنتے ہیں؛ یہ منصب جاہلی حجاز کے بزرگوں کا تھا جہاں مرکزی طاقت نہ تھی، قبائلی حکماء عکاظ جیسے بازاروں میں فیصلے کرتے جن میں سہن بنت لقمان جیسی خواتین بھی تھیں، اور نبی نے بھی بعثت سے پہلے حجر اسود کے نصب میں حکمی کی۔ فقہ نے اسے رسمی عدالت کا معاون قرار دیا: اس کا اختیار صرف اتنا جتنا سونپا جائے، فیصلے سے پہلے فریق اسے برطرف کر سکتے ہیں، اور قاضی کے لیے جو شرائط ہیں — عقل، بلوغت، عدالت اور علم — وہی حکم کے لیے چاہئیں۔"
  es: "El hakam es el árbitro que las partes en disputa eligen voluntariamente para dirimir su controversia; el cargo correspondía a los notables del Hiyaz preislámico, donde no existía un poder central, y los árbitros tribales —entre ellos mujeres como Suhn bint Luqman— juzgaban entre tribus en mercados como Ukaz, mientras que el propio Profeta arbitraba la colocación de la Piedra Negra antes de su misión. El fiqh lo mantuvo como un complemento del tribunal oficial: su autoridad solo se extiende a lo que se le somete, las partes pueden destituirlo antes del fallo, y los juristas le exigen lo mismo que al cadí: razón, mayoría, probidad y conocimiento."
  fr: "Le hakam est l'arbitre que les parties en conflit choisissent librement pour régler leur différend. Cette fonction était dévolue aux notables du Hedjaz préislamique, où il n'existait pas de pouvoir central. Des arbitres tribaux – parmi lesquels des femmes comme Suhn bint Luqman – rendaient des jugements entre tribus sur des marchés tels qu'Ukaz, tandis que le Prophète lui-même arbitra le placement de la Pierre Noire avant sa mission. Le fiqh le maintient comme un complément au tribunal officiel: son autorité ne s'exerce que sur les affaires qui lui sont soumises, les parties peuvent le récuser avant qu'il ne rende sa décision, et les juristes exigent de lui ce qu'ils exigent du qadi: raison, majorité, probité et savoir."
