summary:
  ar: "الحفّار ⁦(النقّاش/حكّاك)⁩ ينقش الكتابة والزخرفة على الحجر والمعدن والعاج والخشب؛ وأرفع فروعه صناعة الأختام التي تُنقش معكوسة لتُقرأ مستقيمة عند الطبع، وكان أهلها يُنتقَون على الأمانة قبل المهارة لأن التزوير يهدّد الدولة والأفراد."
  en: "The engraver (hakkâk/naqqash) carved script and ornament on stone, metal, ivory and wood; its most honoured branch was Ottoman seal-cutting, where text was engraved in mirror image to print correctly and craftsmen were vetted for trustworthiness before skill, since forgery could harm state and citizen alike."
  ur: "نقاش ⁦(حقاک)⁩ پتھر، دھات، ہاتھی دانت اور لکڑی پر رسم الخط اور نقش کندہ کرتا ہے؛ اس کی معزز ترین شاخ عثمانی مہر سازی ہے جہاں رسم الخط الٹا کندہ ہوتا تھا تاکہ چھپنے پر سیدھا پڑھا جائے، اور کاریگر پہلے بھروسے کے لیے چنے جاتے تھے کیونکہ جعل سازی ریاست اور افراد کو نقصان پہنچا سکتی تھی۔"
