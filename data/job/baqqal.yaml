  techniques:
    ar: "يحصي إوليا بضائع البقّال في العرض: سلال البندق والفستق والزبيب والتين تلقى على الناس، وكل ما تؤمَّ البقالة له من مأكول ومشروب من فستق الشام واللوز والجوز والعنّاب والتمر والكرز المجفف؛ وتجّار اللبلبي ⁦(حمص محمّص)⁩ أربعمئة بمئة دكان يحمّصون اللبلبي ويطحنونه دقيقاً برحى يدوية صغيرة ويخلط بعضهم دقيقه بالغراء عجينة لرؤوس العصي، وهو غذاء صحّي للعسكر لمن يشكو استرخاء البطن. ويأمر الشيزري الخضريّ ببيع البقول مغسولة من السباخ خالية من الحشائش، وقطع أصول الجرجير والفجل، وينهى عن غسل البصل والثوم الطازج لأن الماء يزيد حدّتهما ونتنهما، وعن خلط ما بات عندهم بالجديد، وعن بيع البطيخ والخيار والتين الدودي وما فرط نضجه."
    en: "Evliya inventories the grocer's stock on show: baskets of hazel-nuts, pistachios, raisins and figs thrown to the crowd, and whatever eatables and drinkables the grocery may be resorted to for — pistachios from Syria, almonds, hazelnuts, jujubes, dates and dried cherries; the leblebi merchants, four hundred men in a hundred shops, roast the chickpeas and grind them to flour on small hand-mills, some kneading the flour with glue into a paste for club-heads, leblebis being a wholesome food in camp for those with relaxed bowels. Al-Shayzari orders the greengrocer to sell his produce washed of manure and free of grass and weeds, to cut the roots off lettuce and radishes, forbids washing fresh onions and garlic because water increases their pungency and offensive smell, forbids mixing yesterday's stock with the day's picking, and forbids worm-eaten melons, cucumbers and figs and anything so over-ripe that its skin has broken."
    ur: "اولیاء بقّال کے سامان کی گنتی جلوس میں کرتا ہے: فندق، پستا، کشمش اور انجیر کی ٹوکریاں ہجوم پر اچھالی جاتی ہیں، اور جو کچھ خورد و نوش کے لیے بقّال کے پاس جایا جائے — شامی پستا، بادام، فندق، عناب، کھجور اور خشک چیری؛ لبلبی ⁦(بُنے چنے)⁩ کے سوداگر چار سو آدمی سو دکانیں چنے بُنتے اور چھوٹی ہاتھ چکیوں پر آٹا پیسے کچھ اس میں گوند ملا کر ڈنڈوں کے سرے کی معجون بناتے، اور لشکر میں یہ انہی کا صحیح خوراک ہے جنہیں پیٹ ڈھیلا ہو۔ الشیزری سبزی فروش کو حکم دیتا ہے کہ مال کھاد سے دھو کر اور گھاس پھوس سے پاک بیچے، سلاد اور مولی کی جڑیں کاٹ دے، تازہ پیاز اور لہسن دھونے سے منع کرتا ہے کہ پانی ان کی تیزی اور بدبو بڑھاتا ہے، رات کا بچا مال تازہ میں نہ ملائے، اور کیڑے کھائے خربوزہ، کھیرا اور انجیر اور وہ بھی نہ بیچے جو اتنا پک گیا کہ چھلکا پھٹ گیا۔"
