summary:
  ar: "البقّال بائع المآكل والمشارب بالتجزئة: التمر والزبيب والتين والفستق والبندق والعسل والسمن والتوابل، والعطّار عند العثمانيين بائع العطرية والعقاقير من زنجبيل وفلفل وهيل وقرفة وقرنفل وراوند وناردين وعود. يعدّ إوليا البقّالين في مقدّمة موكب الطوائف لأنهم يبيعون المآكل والمشارب، وبيرهم عاصم بن النّبّاش الذي قلّده سلمان الفارسي وهو أول البقّالين عاش مئة وعشرين سنة وقبره في القدس؛ ويجتازون على عربات نصبت عليها خيام يلقون البندق والفستق والزبيب والتين على المتفرجين، وبعضهم يلبس أثواباً من البصل والتمر ويتعمّم قرون الماعز ويسبّح بمسبحة من الجوز؛ وعطّارو إسطنبول ثلاثة آلاف دكان بيرهم حسام الدين بن عبد الله البصري، والعطّارون المصريون خارج باب السجن يسوقون عربات محمّلة بثلاثة آلاف صنف وعيد في تذكرة داوود. وفي قاهرة لين تجاور في شارع السوق العطّار والزيّات الذي يبيع السمن والجبن والعسل مع الزيت والفكهاني والنقلي بائع الفواكه المجففة والخضري."
  en: "The baqqal sold food and drink by retail: dates, raisins, figs, pistachios, hazel-nuts, honey, clarified butter and spices, while the Ottoman attar sold the aromatics and drugs — ginger, pepper, cardamom, cinnamon, cloves, rhubarb, spikenard and aloes. Evliya gives the grocers precedence in the guild procession because they sell eatables and drinkables; their patron Asim Ibn al-Nabbash was girded by Selman Pak, was the first of all bakkals, lived a hundred and twenty years and is buried at Jerusalem. They pass in tents pitched on wagons, throwing hazel-nuts, pistachios, raisins and figs among the spectators, some dressed in robes made of onions and dates, wearing goats' horns on their heads and telling rosaries of nuts; the grocers of aromatics (Attaran) keep three thousand shops under their patron Hussam al-Din Ibn Abdullah of Basra, the Egyptian grocers outside the prison-gate driving wagons loaded with the three thousand articles that are enumerated in the Tezkeret of David. In Lane's Cairo the market street sets the 'attar beside the zeiyat who sells butter, cheese and honey with his oil, the fruiterer, the seller of dried fruits and the greengrocer."
  ur: "بقّال خوردنی اشیاء تھوک میں بیچتا تھا: کھجوریں، کشمش، انجیر، پستے، فندق، شہد، گھی اور مصالحے، جب کہ عثمانی عطار خوشبودار اور دوائی اشیاء — ادرک، مرچ، الائچی، دارچینی، لونگ، ریوند، سمبل الطیب اور عود — بیچتا تھا۔ اولیاء بقّالوں کو جلوس میں پہلا درجہ دیتا ہے کہ وہ خورد و نوش بیچتے ہیں؛ ان کا پیر عاصم بن نبّاش ہے جسے سلمان پاک نے کمر بند پہنائی، وہ سب بقّالوں کا پہلا تھا، ایک سو بیس برس جیا اور قدس میں دفن ہے۔ وہ گاڑیوں پر کھڑے خیموں میں نکلتے اور تماشائیوں پر فندق، پستا، کشمش اور انجیر اچھالتے، بعض پیاز اور کھجوروں کے بنے لباس پہنتے، سروں پر بکری کے سینگ رکھتے اور گری دار میووں کی تسبیح پھیرتے؛ عطار ⁦(مصالحہ فروش)⁩ تین ہزار دکانیں رکھتے ہیں جن کے پیر بصرہ کے حسام الدین بن عبد اللہ ہیں، اور مصری عطار قید خانے کے دروازے سے باہر گاڑیاں ہانکتے جن میں تین ہزار اشیاء ہیں جو تذکرۂ داؤد میں گنی گئی ہیں۔ لین کے قاہرہ میں بازار کی گلی میں عطار کے ساتھ زیّات ہے جو تیل کے ساتھ مکھن، پنیر اور شہد بیچتا، فروٹ فروش، خشک میوہ فروش اور سبزی فروش۔"
  es: "El baqqal vendía comida y bebida al por menor: dátiles, pasas, higos, pistachos, avellanas, miel, mantequilla clarificada y especias, mientras que el attar otomano vendía los aromáticos y las drogas: jengibre, pimienta, cardamomo, canela, clavo, ruibarbo, nardo y aloe. Evliya da precedencia a los tenderos en la procesión del gremio porque venden alimentos y bebidas; su patrón Asim Ibn al-Nabbash fue ceñido por Selman Pak, fue el primero de todos los bakkals, vivió ciento veinte años y está enterrado en Jerusalén. Pasan en tiendas montadas sobre carros, arrojando avellanas, pistachos, pasas e higos entre los espectadores, algunos vestidos con túnicas hechas de cebollas y dátiles, con cuernos de cabra en la cabeza y rezando rosarios de nueces; Los comerciantes de productos aromáticos (Attaran) mantienen tres mil tiendas bajo el patronazgo de Hussam al-Din Ibn Abdullah de Basora. Los comerciantes egipcios que se encuentran fuera de la puerta de la prisión conducen carros cargados con los tres mil artículos enumerados en el Tezkeret de David. En el Cairo de Lane, la calle del mercado sitúa al 'attar junto al zeiyat, que vende mantequilla, queso y miel con su aceite, al frutero, al vendedor de frutos secos y al verdulero."
  fr: "Les baqqals vendaient au détail des aliments et des boissons: dattes, raisins secs, figues, pistaches, noisettes, miel, ghee et épices, tandis que les attars ottomans proposaient des aromates et des médicaments — gingembre, poivre, cardamome, cannelle, clous de girofle, rhubarbe, nard et aloès. Evliya accorde la préséance aux épiciers lors du défilé des guildes car ils vendent des denrées alimentaires et des boissons; leur protecteur, Asim Ibn al-Nabbash, était protégé par Selman Pak, fut le premier de tous les bakkals, vécut cent vingt ans et est enterré à Jérusalem. Ils défilent dans des tentes dressées sur des chariots, jetant des noisettes, des pistaches, des raisins secs et des figues parmi les spectateurs, certains vêtus de robes faites d'oignons et de dattes, coiffés de cornes de chèvre et récitant des chapelets de noix. Les marchands d'aromates (Attaran) tiennent trois mille échoppes sous l'égide de leur protecteur, Hussam al-Din Ibn Abdullah de Bassora. Ces épiciers égyptiens, installés aux abords des portes de la prison, conduisent des charrettes chargées des trois mille articles énumérés dans le Tezkeret de David. Dans le Caire de Lane, la rue commerçante côtoie l'Attaran, le marchand de beurre, de fromage et de miel avec son huile, le marchand de fruits et légumes, le vendeur de fruits secs et le marchand de légumes."
  tr: "Bakkal, hurma, kuru üzüm, incir, fıstık, fındık, bal, tereyağı ve baharat gibi yiyecek ve içeceklerin perakende satıcısıdır. Osmanlılar arasında parfümcü ise zencefil, biber, kakule, tarçın, karanfil, ravent, nard ve öd ağacı gibi aromatik ve tıbbi maddelerin satıcısıdır. Bakkallar, yiyecek ve içecek sattıkları için dini grupların alayının ön saflarında yer alırlar. Salman el-Farsi'nin taklit ettiği liderleri Asim ibn el-Nabbash, ilk bakkaldı ve yüz yirmi yıl yaşadı. Türbesi Kudüs'tedir. Üzerlerine çadırlar kurulmuş arabalarla geçerler ve etraftakilere fındık, fıstık, kuru üzüm ve incir atarlar. Bazıları soğan ve hurmadan yapılmış elbiseler, keçi boynuzundan yapılmış sarıklar ve cevizden yapılmış tesbihler giyerler. İstanbul'daki parfümcüler, liderleri Husam al-Din ibn Abdullah al-Basri önderliğinde üç bin dükkana sahipti. Davud Kitabı'nda kaydedildiği üzere, Mısırlı parfümcüler hapishane kapısının dışında üç bin çeşit parfüm yüklü arabalarla dolaşıyorlardı. Kahire'de Lin, parfümcünün ve tereyağı, peynir, bal ve yağ satan yağ tüccarının, meyve satıcısının, kuru meyve satıcısının ve manavın yanında duruyor."
  id: "Pedagang grosir adalah penjual eceran makanan dan minuman: kurma, kismis, buah ara, pistachio, hazelnut, madu, ghee, dan rempah-rempah. Pedagang parfum di kalangan Ottoman adalah penjual zat aromatik dan obat-obatan seperti jahe, lada, kapulaga, kayu manis, cengkeh, rhubarb, spikenard, dan gaharu. Para pedagang grosir dianggap berada di garis depan prosesi kelompok keagamaan karena mereka menjual makanan dan minuman. Pemimpin mereka, Asim ibn al-Nabbash, yang ditiru oleh Salman al-Farsi, adalah pedagang grosir pertama dan hidup selama seratus dua puluh tahun. Makamnya berada di Yerusalem. Mereka lewat dengan gerobak yang di atasnya didirikan tenda, melemparkan hazelnut, pistachio, kismis, dan buah ara kepada para penonton. Beberapa dari mereka mengenakan jubah dari bawang dan kurma, sorban dari tanduk kambing, dan tasbih dari kenari. Para pedagang parfum di Istanbul memiliki tiga ribu toko, dipimpin oleh pemimpin mereka, Husam al-Din ibn Abdullah al-Basri. Para pedagang parfum Mesir di luar gerbang penjara mengendarai gerobak yang sarat dengan tiga ribu jenis parfum, seperti yang tercatat dalam Kitab Daud. Di Kairo, Lin berada di sebelah pedagang parfum dan pedagang minyak yang menjual ghee, keju, madu dengan minyak, penjual buah, penjual buah kering, dan penjual sayur."
