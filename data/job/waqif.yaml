summary:
  ar: "الواقف هو الذي يوقف ماله على وجه خير إلى الأبد: يخرج العقار أو المال من ملكه ويحبس ريعه للفقراء أو لمصلحة دينية أو اجتماعية. أجمع الفقهاء على أن شروط الواقف أن يكون عاقلاً بالغاً رشيداً حراً غير محجور عليه، ولا يُشترط فيه ولا في المستفيدين الإسلام ولا التبعية لدولة الإسلام. بدأ التوقيف من عهد النبي وأصحابه حتى قال جابر بن عبد الله إنه لا يعلم مالكاً من المهاجرين والأنصار لم يوقف، وتدرّج من أرض عمر بخيبر وبئر رومة لعثمان إلى أوقاف السلاطين والأمراء والنساء والعامة حتى صار «أهم مؤسسات الحضارة الإسلامية»."
  en: "The wāqif endowed property for a charitable purpose in perpetuity: the land or cash left his ownership and its yield was sealed to the poor or to a religious or social good. The jurists agreed the founder must be sane, adult, prudent, free and not interdicted — and required Islam of neither founder nor beneficiary. The practice began with the Prophet and the Companions — Umar's land at Khaybar, Uthman's purchase of the Well of Ruma, Ali's land and spring at Yanbu' — until Jabir ibn Abdallah said he knew no property-owner among the Muhajirun and Ansar who had not made a waqf; then it ran from caliphs and sultans and women of the dynasties down to modest founders, until the waqf stood as one of the chief institutions of Islamic civilisation. The founder set the conditions in his deed — who managed, who benefited, what the workers earned — and the waqf outlived him, his only earthly tie the du'a the deed asked for his memory."
  ur: "واقف وہ شخص تھا جو اپنی جائیداد ہمیشہ کے لیے کسی نیک مقصد پر وقف کر دیتا: زمین یا مال اس کی ملکیت سے نکل کر اس کی آمدن غریبوں یا کسی دینی و سماجی بھلائی کے لیے محبوس ہو جاتی۔ فقہاء کے اتفاق سے بانی کو عاقل، بالغ، رشید، آزاد اور غیر محجور ہونا ضروری تھا — بانی یا مستفید کا مسلمان یا ریاستِ اسلام کی تابعیت شرط نہ تھی۔ یہ عمل نبی اور صحابہ کے زمانے سے شروع ہوا — خیبر میں عمر کی زمین، عثمان کا رومہ کا کنواں، علی کی ینبوع کی زمین و چشمہ — یہاں تک کہ جابر بن عبداللہ کہتے ہیں کہ مہاجرین و انصار میں کوئی مالدار ایسا نہیں ملا جس نے وقف نہ کیا؛ پھر خلفاء، سلاطین، خاندانوں کی خواتین اور عام بانیوں تک پہنچا، یہاں تک کہ وقف اسلامی تہذیب کی اہم ترین مؤسسات میں شمار ہونے لگا۔"
  es: "El waqf donaba propiedades con fines benéficos a perpetuidad: la tierra o el dinero dejaban de ser de su propiedad y sus frutos se destinaban a los pobres o a un bien religioso o social. Los juristas coincidían en que el fundador debía ser cuerdo, adulto, prudente, libre y no estar sujeto a proscripción, y no exigían que ni el fundador ni el beneficiario profesaran el Islam. Esta práctica se inició con el Profeta y los Compañeros —las tierras de Umar en Khaybar, la compra del Pozo de Ruma por Uthman, las tierras y el manantial de Ali en Yanbu'— hasta que Jabir ibn Abdallah afirmó no conocer a ningún propietario entre los Muhajirun y los Ansar que no hubiera realizado un waqf; luego se extendió desde califas y sultanes y mujeres de las dinastías hasta fundadores modestos, hasta que el waqf se consolidó como una de las principales instituciones de la civilización islámica. El fundador estableció las condiciones en su escritura —quién administraba, quién se beneficiaba, cuánto ganaban los trabajadores— y el waqf le sobrevivió; su único vínculo terrenal fue la súplica que la escritura pedía por su memoria."
