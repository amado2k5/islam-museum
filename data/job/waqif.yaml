training:
  mode: mixed
  certification: "No training or licence — the 'profession' was the act itself. The jurists set the conditions: the founder must be of full legal capacity — sane, adult, prudent, free, un-interdicted — and his declaration had to be final, not time-bound nor subject to a dissolving condition; in the Hanafi doctrine the words 'vakıf', 'habs' and 'tesbîl' were explicit declaration, 'sadaqa' a figurative one."
  duration: "A single deed made the wāqif; registration by a judge's ruling, a death-bound waqf by will, or actual use — prayer held in a dedicated mosque, burial in a dedicated cemetery — made it binding."
