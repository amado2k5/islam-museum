summary:
  ar: "الغِربالي صانع الغرابل والمناخل من شعر الخيل ومن الجلد، وكان عوناً للطحّانين والخبّازين. يضبط ابن الأخوة صنعته: يُنصَب عليهم أمين خبير بغشّهم يأمرهم بغسل كل الشعر قبل استعماله والاحتراز من شعر الميتة — علامته أنه غليظ سريع الانكسار — وأن يُستعمَل الشعر على لونه بلا صبغ، إذ يغلي بعضهم الزاج ويترك الشعر فيه فيَهُنّ وينقطع عند الاستعمال ولا يمسك شيئاً ثم يبيعونه من غير إعلام المشتري أنه مصبوغ وهذا غشّ، ويُحلَّفون على ترك جلود الميتة في الغرابل وعلى تنقية الجلود قبل قَطْع الثقوب فيها لئلا يظهر فيها القطع سريعاً. وفي موكب إسطنبول عدّ إوليا صنّاع الغرابل ⁦(غلبُرجيان)⁩ ثلاثمئة رجل بمئتي دكان يصنعون الغرابل من شعر الخيل وهم أعوان الخبّازين يمرّون على العربات يصنعون الغرابل، بيرهم سعد الدين ابن النصّار الذي قلّده سلمان الفارسي وقبره بكَرَهْ آمِد."
  en: "The ghirbali made sieves and riddles of horse-hair and of skin, the assistant of millers and bakers. Ibn al-Ukhuwwa polices the craft: a trustworthy man experienced in their deceptions is set over them; he must command them to wash all hair before using it and to guard against the hair of animals that died of themselves — the mark of it is that it is coarse and breaks quickly — and hair must be used as it is, without dyeing: some makers boil copperas and leave the hair in it, which weakens it so that it snaps in use and holds nothing, and they sell it without telling the purchaser it is dyed, which is fraud. They must swear not to use for sieves the skins of animals that died of themselves, and to cleanse the skins before cutting the holes so that they shall not readily show cuts. In Evliya's Istanbul procession the sieve-makers (Ghalburjian) were three hundred men in two hundred shops making sieves of horse-hair as assistants of the bakers, passing on wagons making sieves; their patron Sa'd-ud-din Ibn-en-nassir, girded by Selman Pak, lies at Kara Amid."
  ur: "غربالی گھوڑے کے بال اور کھال کی چھلنیاں اور چھاننے بنانے والا ہے، آٹا گھسّانے والوں اور نانبایوں کا معاون۔ ابن الاخوہ اس پیشے کو ضبط کرتا ہے: ان پر امین اور ان کے دھوکوں سے واقف نگران مقرر ہو جو حکم دے کہ استعمال سے پہلے سارے بال دھوئے جائیں اور مردہ جانور کے بال سے بچیں — اس کی نشانی یہ ہے کہ وہ موٹا اور جلد ٹوٹنے والا ہوتا ہے — اور بال بغیر رنگے ویسا ہی استعمال ہو، کہ بعض زاگ ابال کر بال اس میں چھوڑ دیتے ہیں جس سے وہ کمزور ہو کر استعمال میں ٹوٹ جاتا اور کچھ نہیں روکتا، اور خریدار کو بتائے بغیر رنگا ہوا بیچ دیتے ہیں جو دھوکا ہے۔ انہیں قسم دلوائی جائے کہ چھلنیوں میں مردہ جانور کی کھالیں نہ لگائیں اور سوراخ کاٹنے سے پہلے کھالوں کو صاف کریں تاکہ شگاف جلد ظاہر نہ ہو۔ اولیاء کے استنبول کے جلوس میں چھلنی ساز ⁦(غلبرجیان)⁩ تین سو آدمی دو سو دکانیں تھے جو گھوڑے کے بال کی چھلنیاں بناتے، نانبایوں کے معاون، گاڑیوں پر چلتے چھلنیاں بناتے گئے؛ ان کا پیر سعد الدین ابن النصار ہے جسے سلمان پاک نے کمر بند پہنائی، اس کا مزار کرہ آمد میں ہے۔"
  es: "El ghirbali fabricaba tamices y cribas de crin de caballo y de piel, siendo ayudante de molineros y panaderos. Ibn al-Ukhuwwa vigilaba el oficio: se ponía a cargo de ellos un hombre de confianza, experto en sus engaños; debía ordenarles que lavaran todo el pelo antes de usarlo y que se protegieran del pelo de animales que murieron de muerte natural —la señal de este es que es áspero y se rompe fácilmente— y el pelo debía usarse tal cual, sin teñir: algunos fabricantes hervían sulfato de cobre y dejaban el pelo en él, lo que lo debilitaba de tal manera que se rompía al usarlo y no retenía nada, y lo vendían sin decirle al comprador que estaba teñido, lo cual era un fraude. Debían jurar que no usarían para tamices pieles de animales que murieron de muerte natural, y que limpiarían las pieles antes de cortar los agujeros para que no se vieran fácilmente los cortes. En la procesión de Evliya en Estambul, los fabricantes de tamices (Ghalburjian) eran trescientos hombres en doscientos talleres que fabricaban tamices de crin de caballo como ayudantes de los panaderos, pasando en carros que también fabricaban tamices; su patrón Sa'd-ud-din Ibn-en-nassir, ceñido por Selman Pak, yace en Kara Amid."
  fr: "Le ghirbali fabriquait des tamis et des cribles en crin de cheval et en peau, assistant des meuniers et des boulangers. Ibn al-Ukhuwwa supervisait ce métier: un homme de confiance, connaissant leurs pratiques douteuses, était chargé de les contrôler. Il devait leur ordonner de laver tous les poils avant de les utiliser et d’éviter ceux des animaux morts de mort naturelle – car ils étaient rêches et cassaient facilement – et de les employer tels quels, sans teinture. Certains fabricants faisaient bouillir de la cupuaçure et y laissaient tremper les poils, ce qui les affaiblissait au point qu’ils cassaient à l’usage et ne retenaient plus rien. Ils les vendaient ensuite sans avertir l’acheteur qu’ils étaient teints, ce qui constituait une fraude. Ils devaient jurer de ne pas utiliser pour leurs tamis les peaux d’animaux morts de mort naturelle et de les nettoyer avant d’y découper les trous afin que les coupures ne soient pas visibles. Dans le cortège d'Evliya à Istanbul, les fabricants de tamis (Ghalburjian) étaient trois cents hommes dans deux cents boutiques fabriquant des tamis en crin de cheval comme assistants des boulangers, passant sur des chariots fabriquant des tamis; leur patron Sa'd-ud-din Ibn-en-nassir, ceint par Selman Pak, repose à Kara Amid."
  tr: "Elek yapımcısı, değirmencilere ve fırıncılara yardım eden, at kılı ve deriden elek ve savurma sepetleri yapan bir zanaatkardı. Kardeşi İbn el-Ukhuwwah, zanaatını denetliyordu: hilekarlığıyla bilinen bir uzman, onları denetlemekle görevlendirilmişti. Onlara, kullanmadan önce tüm kılları yıkamalarını, ölü hayvanların kıllarını kullanmaktan kaçınmalarını (çünkü bu kıllar kalınlığı ve kırılganlığıyla karakterize ediliyordu) ve kılları boyamadan doğal renklerinde kullanmalarını emretti. Bazıları, diye açıkladı, şapı kaynatıp kılları içinde bırakıyorlardı; bu da kılların kullanım sırasında kırılmasına ve hiçbir şey tutmamasına neden oluyordu. Daha sonra, alıcıya boyalı olduğunu söylemeden satıyorlardı ki bu da dolandırıcılık olarak kabul ediliyordu. Elek yapımcıları ayrıca, ölü hayvanların derilerini eleklerde bırakacaklarına ve kesiklerin hemen görünür hale gelmesini önlemek için derileri delmeden önce temizleyeceklerine dair yemin ettirilmişlerdi. İstanbul'daki törende Evliya, iki yüz dükkânda at kılından elek yapan üç yüz elek ustası (Gulburjiyan) saydı. Bunlar fırıncı yardımcılarıydı ve elekleri yaparken arabaların yanından geçiyorlardı. Başları Sa'd al-Din ibn al-Nassar, Salman al-Farsi'nin takipçisiydi ve mezarı Karahit Amid'dedir."
  id: "Pembuat saringan adalah seorang pengrajin yang membuat saringan dan keranjang penampi dari bulu kuda dan kulit, membantu para penggiling dan pembuat roti. Saudaranya, Ibn al-Ukhuwwah, mengatur kerajinannya: seorang ahli, yang terkenal karena tipu dayanya, ditunjuk untuk mengawasi mereka. Ia menginstruksikan mereka untuk mencuci semua bulu sebelum digunakan, untuk menghindari penggunaan bulu dari hewan mati—yang dicirikan oleh ketebalan dan kerapuhannya—dan untuk menggunakan bulu dalam warna aslinya tanpa diwarnai. Beberapa, jelasnya, merebus tawas dan membiarkan bulu di dalamnya, menyebabkan bulu tersebut patah saat digunakan dan gagal menahan apa pun. Kemudian mereka menjualnya tanpa memberi tahu pembeli bahwa bulu tersebut telah diwarnai, yang dianggap sebagai penipuan. Para pembuat saringan juga diharuskan bersumpah untuk meninggalkan kulit hewan mati di dalam saringan dan membersihkan kulit tersebut sebelum membuat lubang di dalamnya untuk mencegah potongan tersebut langsung terlihat. Dalam prosesi Istanbul, Evliya menghitung tiga ratus pembuat saringan (Gulburjiyan) di dua ratus toko, yang membuat saringan dari bulu kuda. Mereka adalah asisten tukang roti, yang lewat di dekat gerobak sambil membuat saringan. Pemimpin mereka, Sa'd al-Din ibn al-Nassar, adalah pengikut Salman al-Farsi, dan makamnya berada di Karahit Amid."
