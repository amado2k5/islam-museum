  techniques:
    ar: "يفصّل ابن الأخوة مادة الغربال: يُغسَل الشعر كله قبل استعماله، ويُحتَرَز من شعر الميتة الذي يُعرَف بغلظه وسرعة انكساره، ويُستعمَل الشعر على طبيعته بلا صبغ، فبعضهم يغلي الزاج ويترك فيه الشعر فيضعف حتى ينقطع عند الاستعمال ولا يمسك، ويبيعونه مصبوغاً من غير إعلام المشتري وهذا غشّ؛ ويُحلَّف الصنّاع على ترك جلود الميتة، وتُنقَّى الجلود قبل قطع الثقوب لئلا يظهر بها القطع. ويصوّر إوليا صنعتهم في سياق طائفة الطحّانين: منقّو الحبوب ⁦(بغدای چالقجيان)⁩ ثلاثة آلاف من فلّاحي مصر ينخلون الحنطة والشعير والعدس والفول والأرز إذا اختلطت، وينخل بعضهم الحب من التراب حتى إن الحب الساقط يرسم على الأرض عبارة الشهادة؛ والطحّانون يبنون على العربات مطاحن تدور بدوران عجلاتها فتطحن وهي تسير."
    en: "Ibn al-Ukhuwwa details the sieve's materials: all hair must be washed before use, and the hair of animals that died of themselves barred — known by its coarseness and quick breaking; hair is used undyed, for some makers boil copperas and steep the hair in it so that it weakens, snaps in use and holds nothing, then sell it dyed without telling the purchaser — a fraud; the makers are sworn off the skins of dead animals, and the skins are cleansed before the holes are cut so that they do not readily show cuts. Evliya sets the trade among the millers' guild: the corn-purifiers (Boghdai Chalikjian), three thousand Egyptian peasants, sieve wheat, barley, lentils, beans and rice when mingled, and some sieve the dust from the grain so skilfully that the falling corn traces the words of the shahada on the ground; and the millers build mills on wagons whose wheels drive the grinding as they go."
    ur: "ابن الاخوہ چھلنی کا سامان تفصیل دیتا ہے: بال استعمال سے پہلے دھوئے جائیں، اور مردہ جانور کے بال سے بچا جائے جو موٹائی اور جلد ٹوٹنے سے پہچانے جاتے؛ بال بغیر رنگے استعمال ہو کہ بعض زاگ ابال کر بال بھگو دیتے جس سے وہ ٹوٹنے لگتا اور کچھ روکنے نہیں رکھتا اور رنگا ہوا خریدار کو بتائے بغیر بیچتے — یہ دھوکا؛ بنانے والوں سے قسم لی جائے کہ مردہ جانور کی کھال نہ لگائیں اور سوراخ کاٹنے سے پہلے کھالیں صاف کریں تاکہ شگاف جلد نہ آئے۔ اولیاء اس پیشے کو آٹا گھسّانے والوں کی انجمن میں دکھاتا ہے: غلہ صاف کرنے والے ⁦(بغدای چالقجیان)⁩ تین ہزار مصری دہقان گندم، جو، مسور، باقلا اور چاول ملی ہوئی حالت میں چھانتے، اور بعض مہارت سے غلہ چھانتے کہ گرتا دانہ زمین پر شہادت کے کلمے لکھ دیتا؛ اور آٹا پیسنے والے گاڑیوں پر چکیاں بناتے جن کے پہیوں کے چلنے سے چلتے آٹا پستی رہتی۔"
