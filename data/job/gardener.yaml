summary:
  ar: "البستانجي يعمل في بساتين القصر وبساتين السلطان. كانت فرقة البستانجي أُوجاغي العثمانية — من عهد مراد الأول — تُجنَّد من أقوى غلمان الدّوشرمة، وشغلها الأول بساتين طوب قاپي والحدائق السلطانية وقوارب السلطان؛ من عمل داخل القصر «غلمانان باغچه خاصّه» ومن خدم الخارج «غلمانان بستانيان». ثم جمعت الفرقة إلى جنت الأرض أمنَ العاصمة: رئيسها البستانجي باشي يمسك دفة قارب السلطان، وينفّذ أحكام الإعدام، ولا تُبنى يالي على البوسفور والخليج إلا بإذنه، حتى أُلغيت الفرقة سنة 1826."
  en: "The bostancı worked the palace gardens and the sultan's grounds. The Ottoman Bostancı Ocağı — reaching back to Murad I — was recruited from the strongest devşirme boys, its first work the gardens and bağs of Topkapı and the imperial bostans and the sultan's own kayıks; the insiders were gılmânân-ı bağçe-i hâssa, the outsiders in the imperial gardens gılmânân-ı bostâniyân. Then the corps added policing to horticulture: the bostancıbaşı helmed the sultan's barge, carried out executions, kept the register of every yalı on the Bosphorus and the Golden Horn — none could be built without his leave — until the corps was abolished in 1826."
  ur: "بستانجی شاہی باغات اور سلطان کے میدانوں میں کام کرتا تھا۔ عثمانی بستانجی اوجاغی — مراد اول کے زمانے تک پہنچنے والی — مضبوط دوشرمہ لڑکوں سے بھرتی ہوتی، اس کا پہلا کام طوپ قاپی کے باغ اور شاہی بستان اور سلطان کی کشتی تھیں؛ اندر والے «غلمانان باغچہ خاصہ» اور باہر شاہی باغوں والے «غلمانان بستانیان»۔ پھر اس دستے نے باغبانی کے ساتھ سیکورٹی بھی سنبھالی: بستانجی باشی سلطان کی کشتی کی پتوار تھامتا، سزائے موت نافذ کرتا، بوسفور اور خلیج کی ہر یالی کا دفتر رکھتا — اس کی اجازت کے بغیر کوئی یالی نہ بن سکتی — یہاں تک کہ 1826 میں یہ دستہ ختم ہوا۔"
