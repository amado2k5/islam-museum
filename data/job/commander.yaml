summary:
  ar: "السردار — من الفارسية «سر» رأساً و«دار» ماسكاً — لقب قائد الجيش في الدول التركية الإسلامية ومنها إلى العربية. عند السلاجقة والإيلخانيين جاء مقابله سپهسالار وسرلشكر وصوباشي؛ وعند العثمانيين صار السردار الوزير أو البيلربيه أو الصنجق بيه المعيَّن لإقليم أو حملة، يمسك براته صلاحيات التعيين والعزل ومنح الديرلك وحتى سحب الطغراء على الأحكام، ويقود معه الإنكشارية والجبجية والطوبجية والسواري ومعهم دفتردار وكاتب خزانة. وإذا غاب السلطان عن الحملة كان الوزير الأعظم سرداراً أكرم تسلَّم منه الصنجق الشريف وبتّ في التعيين والإعدام بلا رجوع. تحوّل اللقب بعد إلغاء الإنكشارية إلى السرعسكر قائد عساكر منصورة، وبقي «سيردار» لقب القائد البريطاني في مصر والسودان."
  en: "The serdar — Persian ser 'head' plus -dâr, 'the one who holds the lead' — was the army commander's title in the Turco-Islamic states, passing from Turkish into Arabic. Under the Seljuks and Ilkhanids its cognates ran as sipehsâlâr, serleşker and subaşı; under the Ottomans the serdar was the vezir, beylerbeyi or sancak beyi commissioned to a province or campaign, whose berat gave him power to appoint, dismiss and grant dirliks, even to affix the tuğra to blank decrees when the supply ran out. On campaign he moved with janissaries, armourers, gunners and cavalry, a defterdar or treasury clerk at his side, holding divan and hearing cases. When the sultan did not take the field the grand vezir went as serdâr-ı ekrem, received the sancak-ı şerif from the sultan's own hand at the Davud Pasha or Doğancılar muster-field, and ruled on appointments, grants and executions without reference home — Kara Mustafa Pasha executed the Budin governor Uzun İbrahim Pasha during the 1683 Vienna siege. After the janissary abolition the supreme command passed to the serasker of the Asâkir-i Mansûre, while 'sirdar' named the British commander in Egypt and the Sudan."
  ur: "سردار — فارسی «سر» ⁦(سر)⁩ اور «دار» ⁦(پکڑنے والا)⁩ سے — ترک اسلامی ریاستوں میں فوج کے کمانڈر کا لقب تھا جو ترکی سے عربی میں آیا۔ سلجوقیوں و ایلخانیوں میں اس کے ہم معنی سپہ سالار، سرلشکر اور صوباشی چلے؛ عثمانیوں میں سردار وہ وزیر، بیلربیگی یا صنجق بیگی تھا جسے کسی صوبے یا مہم پر مقرر کیا جاتا اور جس کے برات میں تقرری، برطرفی، درلک دینے اور خالی احکام پر طغراء لگانے تک کا اختیار ہوتا۔ مہم پر اس کے ساتھ ینکری، جیبجی، توپچی اور سوار ہوتے اور پاس میں دفتردار یا خزانہ کاتب؛ وہ راستے میں دیوان لگا کر مقدمے سنتا۔ جب سلطان خود میدان نہ جاتا تو وزیر اعظم «سردارِ اکرم» بنتا، سلطان کے ہاتھ سے صنجقِ شریف لیتا اور گھر پوچھے بغیر تقرری، عطا اور سزائے موت کا فیصلہ کرتا — قرہ مصطفیٰ پاشا نے 1683 کے محاصرہ ویانا میں بدین کے گورنر اوزون ابراہیم پاشا کو قتل کرایا۔ ینکری خاتمے کے بعد اعلیٰ کمان عساکر منصورہ کے سرعسکر کو ملی، جبکہ «سیردار» مصر و سوڈان میں برطانوی کمانڈر کا نام بنا۔"
  es: "El serdar —del persa ser 'cabeza' más -dâr, 'el que lleva la batuta'— era el título del comandante del ejército en los estados turco-islámicos, pasando del turco al árabe. Bajo los selyúcidas e iljánidas, sus cognados eran sipehsâlâr, serleşker y subaşı; bajo los otomanos, el serdar era el vezir, beylerbeyi o sancak beyi comisionado a una provincia o campaña, cuyo berat le daba poder para nombrar, destituir y otorgar dirliks, incluso para añadir la tuğra a los decretos en blanco cuando se agotaban los suministros. En campaña, se desplazaba con jenízaros, armeros, artilleros y caballería, con un defterdar o escribano del tesoro a su lado, celebrando el diván y escuchando los casos. Cuando el sultán no iba al campo de batalla, el gran vezir iba como serdâr-ı ekrem, recibía el sancak-ı şerif de la propia mano del sultán en el campo de reunión de Davud Pasha o Doğancılar, y dictaba sentencias sobre nombramientos, concesiones y ejecuciones sin consultar a su tierra natal. Kara Mustafa Pasha ejecutó al gobernador de Budin, Uzun İbrahim Pasha, durante el asedio de Viena de 1683. Tras la abolición de los jenízaros, el mando supremo pasó al serasker del Asâkir-i Mansûre, mientras que el «sirdar» designaba al comandante británico en Egipto y Sudán."
  fr: "Le serdar — du persan ser, « tête », auquel s'ajoute -dâr, « celui qui mène » — était le titre du commandant de l'armée dans les États turco-islamiques, passé du turc à l'arabe. Sous les Seldjoukides et les Ilkhanides, on trouvait des termes apparentés comme sipehsâlâr, serleşker et subaşı; sous les Ottomans, le serdar était le vezir, beylerbeyi ou sancak beyi, chargé d'une province ou d'une campagne, dont le berat lui conférait le pouvoir de nommer, de révoquer et d'octroyer des dirliks, voire d'apposer la tuğra sur des décrets vierges en cas de pénurie. En campagne, il se déplaçait avec des janissaires, des armuriers, des artilleurs et de la cavalerie, accompagné d'un defterdar ou trésorier, qui tenait le divan et instruisait les affaires. Lorsque le sultan ne se rendait pas sur le champ de bataille, le grand vizir s'y rendait en tant que serdâr-ı ekrem, recevait le sancak-ı şerif des mains mêmes du sultan au champ de rassemblement de Davud Pacha ou de Doğancılar, et statuait sur les nominations, les donations et les exécutions sans consulter sa famille – Kara Mustafa Pacha fit exécuter le gouverneur de Budin, Uzun İbrahim Pacha, lors du siège de Vienne en 1683. Après l'abolition des janissaires, le commandement suprême passa au serasker de l'Asâkir-i Mansûre, tandis que le terme « sirdar » désignait le commandant britannique en Égypte et au Soudan."
