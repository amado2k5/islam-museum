label: { ar: "الوزير", en: "Vizier", ur: "وزیر" }
summary:
  ar: "الوزير هو أعلى من يتولّى تدبير الدولة بعد الحاكم في الدول الإسلامية. نشأت الوزارة مؤسسةً منتظمة في العهد العباسي، وكان وزير التفويض نائباً عن الخليفة فيما فوّضه إليه. وفي الدولة العثمانية صار الوزراء أعضاء الديوان الهمايوني يتقدّمهم الصدر الأعظم، ثم صار لقب الوزير بعد الإصلاحات في القرن التاسع عشر رتبةً بروتوكولية."
  en: "The vizier was the most senior administrator after the ruler in Islamic states. The office became an organised institution in the Abbasid period, when a vizier of delegated powers acted for the caliph in what the caliph entrusted to him. In the Ottoman state the viziers sat in the imperial council under the first vizier, the grand vizier, and after the reforms of the nineteenth century the title became a protocol rank."
  ur: "وزیر اسلامی ریاستوں میں حکمران کے بعد سب سے بڑا منتظم تھا۔ عباسی دور میں یہ منصب باقاعدہ ادارہ بنا، اور تفویض کا وزیر خلیفہ کی طرف سے سونپے گئے امور میں اس کا نائب تھا۔ عثمانی ریاست میں وزراء دیوانِ ہمایوں کے رکن تھے جن کا سربراہ صدرِ اعظم ہوتا تھا، اور اصلاحات کے بعد یہ لقب ایک پروٹوکول رتبہ رہ گیا۔"
