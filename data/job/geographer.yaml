summary:
  ar: "الجغرافي هو من يصف الأرض وأقاليمها وسكانها، وقد عُربت كلمة geographia «جغرافيا» وسمّاها الخوارزمي «صورة الأرض» وفسّرها المسعودي «قطع الأرض». نشأ العلم فرعاً قائماً مع دخول مؤلفات الهند وإيران واليونان في الفلك والجغرافيا إلى بغداد العباسية من سبعينيات القرن الثامن، وقامت مدرستان للجغرافيا الوصفية في العراق وبلخ. ولم يعرف الجغرافيوس المتقدمون علمهم حدوداً دقيقة كعلم مستقل فتفرّق بين الفلك والكوزموغرافيا والفلسفة وكتب المسالك والممالك ورحلات الأسفار؛ ثم حمل العثمانيون التراث بالترجمة فأخرجوا أول كتبهم الجغرافية بعد فتح أدرنه بقليل وبلغ بهم العمل ذروته في القرن السابع عشر مع أول جغرافية منهجية لبلادهم."
  en: "The geographer described the earth, its climes and its peoples; the word geographia was arabised as cughrafiya, al-Khwarizmi named his book Surat al-ard (the image of the earth), and al-Mas'udi read the science as qat' al-ard, the cutting open of the earth. The craft arose as a science in Abbasid Baghdad as Indian, Iranian and Greek works of astronomy-geography arrived from the 770s, and the two descriptive schools of Iraq and Balkh formed. The medieval geographers knew no sharply bounded discipline: their matter lay scattered through astronomy, cosmography, philosophy, the masalik wa'l-mamalik books and travel accounts. The Ottomans carried the heritage on by translation, produced their first geography soon after the taking of Edirne, and reached their height in the seventeenth century with the first systematic geography of their own lands."
  ur: "جغرافیہ دان وہ شخص تھا جو زمین، اس کے اقالیم اور ان کے باشندوں کا بیان کرتا تھا؛ geographia کا لفظ جغرافیا ہو کر عربی میں آیا، خوارزمی نے اپنی کتاب کا نام صورۃ الارض رکھا اور مسعودی نے اس علم کو قطع الارض یعنی زمین کی کھوج کہا۔ یہ صنعت ستر کی دہائی سے ہند، ایران اور یونان کی فلکیات-جغرافیہ کی کتابوں کے بغداد پہنچنے سے علم بنا، اور عراق و بلخ کے دو بیانیہ مکاتب قائم ہوئے۔ قرونِ وسطی کے جغرافیہ دان اپنے علم کو ایک واضح حد بند فن نہیں مانتے تھے: ان کا مواد فلکیات، کائنات شناسی، فلسفہ، مسالک و ممالک کی کتابوں اور سفرناموں میں بکھرا تھا۔ عثمانیوں نے ترجمے سے اس ورثے کو آگے بڑھایا، ادرنے کی فتح کے فوراً بعد اپنی پہلی جغرافیہ لکھی اور سترہویں صدی میں اپنے ملک کی پہلی منظم جغرافیہ کے ساتھ عروج پر پہنچے۔"
  es: "El geógrafo describió la tierra, sus climas y sus pueblos; la palabra geographia se arabizó como cughrafiya, al-Juarismi tituló su libro Surat al-ard (la imagen de la tierra), y al-Mas'udi interpretó la ciencia como qat' al-ard, el corte de la tierra. El oficio surgió como ciencia en el Bagdad abasí con la llegada de obras de astronomía y geografía de la India, Irán y Grecia a partir de la década de 770, y se formaron las dos escuelas descriptivas de Irak y Balkh. Los geógrafos medievales no conocían una disciplina claramente delimitada: su materia se encontraba dispersa entre la astronomía, la cosmografía, la filosofía, los libros masalik wa'l-mamalik y los relatos de viajes. Los otomanos continuaron con esta tradición mediante traducciones, produjeron su primera geografía poco después de la toma de Edirne y alcanzaron su apogeo en el siglo XVII con la primera geografía sistemática de sus propios territorios."
  fr: "Le géographe décrivait la Terre, ses climats et ses peuples; le mot « geographia » fut arabisé en « cughrafiya », al-Khwarizmi intitula son ouvrage « Surat al-ard » (l’image de la Terre), et al-Mas’udi traduisit cette science par « qat’ al-ard », l’ouverture de la Terre. La géographie s’érigea en science à Bagdad sous les Abbassides avec l’arrivée, à partir des années 770, d’ouvrages d’astronomie et de géographie indiens, iraniens et grecs, et la formation des deux écoles descriptives d’Irak et de Balkh. Les géographes médiévaux ne connaissaient pas de discipline strictement délimitée: leurs travaux se mêlaient à l’astronomie, la cosmographie, la philosophie, les ouvrages de « masalik wa’l-mamalik » et les récits de voyage. Les Ottomans perpétuèrent cet héritage par la traduction, produisirent leur première géographie peu après la prise d’Edirne et atteignirent leur apogée au XVIIe siècle avec la première géographie systématique de leurs propres territoires."
  tr: "Coğrafyacı, yeryüzünü, bölgelerini ve sakinlerini tanımlayan kişidir. \"Geographia\" kelimesi Arapçaya \"جغرافيا\" (coğrafya) olarak çevrilmiş, el-Harezmi bunu \"صورة الأرض\" (yeryüzünün görüntüsü) olarak adlandırmış, el-Mas'udi ise \"قطع الأرض\" (kara parçaları) olarak yorumlamıştır. Bilim, 70'lerden itibaren Abbasi Bağdat'ına Hindistan, İran ve Yunanistan'dan gelen astronomik ve coğrafi eserlerle ayrı bir dal olarak ortaya çıkmıştır. Irak ve Belh'te iki betimleyici coğrafya okulu ortaya çıkmıştır. İlk coğrafyacılar, disiplinlerinin bağımsız bir bilim olarak kesin sınırlarını tanımadıkları için, astronomi, kozmografi, felsefe, rota ve krallıklar üzerine kitaplar ve seyahatnameler gibi çeşitli alanları kapsayan parçalı bir yapıya bürünmüştür. Daha sonra Osmanlılar, Edirne'nin fethinden kısa bir süre sonra ilk coğrafi eserlerini üreterek bu mirası çeviri yoluyla sürdürmüşlerdir. Çabaları, 17. yüzyılda topraklarının ilk sistematik coğrafya çalışmasının yapılmasıyla doruk noktasına ulaştı."
  id: "Seorang ahli geografi adalah orang yang mendeskripsikan Bumi, wilayah-wilayahnya, dan penduduknya. Kata geographia diarabkan sebagai \"جغرافيا\" (geografi), dan al-Khwarizmi menyebutnya \"صورة الأرض\" (gambaran Bumi), sedangkan al-Mas'udi menafsirkannya sebagai \"قطع الأرض\" (petak-petak tanah). Ilmu ini muncul sebagai cabang ilmu yang berbeda dengan kedatangan karya-karya astronomi dan geografi dari India, Iran, dan Yunani di Baghdad pada masa Abbasiyah sejak tahun 70-an dan seterusnya. Dua aliran geografi deskriptif muncul di Irak dan Balkh. Para ahli geografi awal tidak mengakui batasan yang tepat untuk disiplin ilmu mereka sebagai ilmu yang independen, sehingga menjadi terfragmentasi, meliputi astronomi, kosmografi, filsafat, buku-buku tentang rute dan kerajaan, serta catatan perjalanan. Kemudian, Ottoman melanjutkan warisan ini melalui penerjemahan, menghasilkan karya-karya geografi pertama mereka tak lama setelah penaklukan Edirne. Upaya mereka mencapai puncaknya pada abad ke-17 dengan penyusunan geografi sistematis pertama atas wilayah mereka."
