  techniques:
    ar: "صنعة المشّاطي تبدأ باختيار الخشب: لا يُصنع المشط إلا من الشمشاذ اليوناني، وألا يكون أخضر فيتعرّج وينكسر، وأفضلها الصَّدَف؛ وخشب النارنج يظهر عيبه في التمشيط بشظايا تقطع الشعر. ثم القَطع والكبس: يبقى المشط مضغوطاً في المِصْعَرة بعد قطعه حتى يستقيم، وتُصَفّ الأسنان على استقامة واحدة، ويُتقَن داخلُه حتى تصغر مسافات الأسنان وتدقّ، وتُستدَر الأسنان بالإزميل دون شظية تخدش الرأس أو تشدّ الشعرة."
    en: "The comb-maker's craft begins with the wood: combs may be made only of Greek box-wood, and never green, or they warp and break; the best are of tortoise-shell, and orange-wood betrays itself in splinters that tear the hair. Then cutting and pressing: the comb lies pressed hard in the press after cutting until it runs true, the teeth are set in one line, the inside is finished so the intervals stay small and the teeth fine, and the points are rounded with a chisel with no splinter left to scratch the head or catch a hair."
    ur: "کنگھی ساز کی دستکاری لکڑی کے انتخاب سے شروع ہوتی: کنگھی صرف یونانی بکس ووڈ کی ہو، ہری نہ ہو کہ تیڑھی ہو ٹوٹے؛ بہترین کچھوے کی خول کی، اور سنتری کی لکڑی کا عیب بال نوچنے والے پرزوں سے ظاہر ہوتا۔ پھر کاٹ اور میخرا: کٹائی کے بعد کنگھی مدت میخرے میں دبی رہے کہ سیدھی چلے، دانتیں ایک قطار میں ہوں، اندر کا کام اتنا نفیس کہ دانتوں کا فاصلہ چھوٹا اور دانتیں باریک رہیں، اور نقش چھینی سے گول ہو، کوئی پرزہ سر نہ کھروچے نہ بال الجھائے۔"
