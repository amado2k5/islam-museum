summary:
  ar: "صانع الأمشاط يخرج المشط من خشب الشَمْشاذ اليوناني — ولا يجوز عند ابن الأخوة أن يُصنع مشط الرجال والنساء إلا منه، وألا يكون أخضر فيتعرّج حين يجفّ وينكسر؛ وأفضل الأمشاط ما كان من الصَدَف. ومَن استعمل خشباً غير الشمشاذ — كخشب النارنج — ظهر في التمشيط، إذ تخرج شظايا الخشب فتقطع شعر المستعمل. وعلى الصانع إتقانُ الصنعة: تكون الأسنان على استقامة واحدة، ويبقى المشط بعد قَطْعه مضغوطاً في مِصْعَرة مدةً ليستقيم ولا يتحرك صحيحاً إلا كذلك، ويُتقن ما في داخله حتى تصغر «الفوهة» — مسافات ما بين الأسنان — وتدقّ الأسنان، ويتحرك حادّاً في الشعر، وتُستدَر الأسنان بالإزميل وتُجتَنَب الشظايا كلها. وعند لين تباع «أمشاط من خشب العود» في متاع الحجّ الذي يجلُبه الحاج إلى بيته، مع السِّبَح والمسواك والكحل والشالات من صنع الحجاز؛ وفي إسطنبول إوليا تُعرَض الأمشاط في سوق أدوات الإسكاف قرب البزستان القديم، في جملة القوالب والغراء والإبر والمقاصل والمِصْعَرات."
  en: "The comb-maker cut the comb from Greek box-wood — the only wood Ibn al-Ukhuwwa allows for men's and women's combs, and never green, for it warps as it dries and breaks; the best combs, he adds, are made of tortoise-shell. Any other wood — orange-wood, say — shows itself in the combing, splinters tearing out the user's hair. The workman owes the comb good craftsmanship: the points must stand in one line; the comb should lie pressed hard in a press for a time after it is cut so it runs true, for it will not move properly unless it is straight; the inside work must be well done so the 'mouth' — the intervals between the teeth — stays small and the teeth fine; it must move sharply through the hair, the teeth rounded with a chisel and every splinter avoided. Lane finds 'combs of aloes-wood' among the hajj goods a pilgrim brings home, beside rosaries, miswak sticks, kohl and shawls of Hegazi manufacture; and in Evliya's Istanbul combs are sold in the shoemakers'-tool market near the old Bezestan, among lasts, glue, needles, awls and presses."
  ur: "کنگھی ساز یونانی بکس ووڈ سے کنگھی تراشتا — ابن الاخوہ کے نزدیک مردوں اور عورتوں کی کنگھی اسی لکڑی سے ہو اور ہری نہ ہو کہ سوکھتے تیڑھی ہو کر ٹوٹ جائے؛ اور بہترین کنگھیاں کچھوے کی خول کی ہوتی ہیں۔ جو دوسری لکڑی — جیسے سنتری کی — لگائے وہ کنگھی کرنے میں ظاہر ہوتا، لکڑی کے پرزے بال نوچتے۔ کاریگر پر اچھی دستکاری فرض: دانتوں کا نقشہ یکساں ہو؛ کنگھی کٹنے کے بعد مدت میخرے میں دبی رہے کہ سیدھی چلے، اور صحیح نہ چلے جب تک سیدھی نہ ہو؛ اندر کا کام اتنا نفیس ہو کہ «فوہہ» — دانتوں کے درمیان کا فاصلہ — چھوٹا اور دانت باریک رہیں؛ کنگھی بالوں میں تیز چلے اور دانتیں چھینی سے گول کر کے ہر پرزہ بچایا جائے۔ لین میں «عُود کی کنگھیاں» حاجی کے وطن لائے حج کے سامان میں ہیں، تسبیح، مسواک، کحل اور حجازی شالوں کے ساتھ؛ اور اولیاء کے استنبول میں کنگھیاں پرانے بزستان کے قریب موچیوں کے اوزار کی منڈی میں تختوں، سریش، سوئیوں، اوزے اور میخروں کے ساتھ بکتی ہیں۔"
  es: "El fabricante de peines cortaba el peine de madera de boj griego, la única madera que Ibn al-Ukhuwwa permite para peines de hombres y mujeres, y nunca verde, pues se deforma al secarse y se rompe; los mejores peines, añade, están hechos de carey. Cualquier otra madera, como la de naranjo, se nota al peinar, ya que las astillas arrancan el cabello del usuario. El artesano debe hacer un peine de buena calidad: las puntas deben estar alineadas; el peine debe mantenerse presionado en una prensa durante un tiempo después de cortarlo para que gire correctamente, pues no se moverá bien si no está recto; el trabajo interior debe estar bien hecho para que la \"boca\" —los espacios entre los dientes— permanezca pequeña y los dientes finos; debe deslizarse con precisión por el cabello, los dientes redondeados con un cincel y evitando cualquier astilla. Lane encuentra \"peines de madera de aloe\" entre los artículos que un peregrino lleva a casa después del Hajj, junto a rosarios, palitos de miswak, kohl y chales de fabricación hegazí; y en el Estambul de Evliya, los peines se venden en el mercado de herramientas para zapateros cerca del antiguo Bezestan, entre hormas, pegamento, agujas, punzones y prensas."
  fr: "Le peigneur tailla le peigne dans du buis grec – le seul bois autorisé par Ibn al-Ukhuwwa pour les peignes d'hommes et de femmes, et jamais de bois vert, car il se déforme en séchant et se casse; les meilleurs peignes, ajoute-t-il, sont en écaille de tortue. Tout autre bois – le bois d'oranger, par exemple – se révèle désagréable lors du peignage, les échardes arrachant les cheveux. L'artisan se doit d'un travail soigné: les pointes doivent être parfaitement alignées; le peigne doit être pressé fermement pendant un certain temps après sa découpe afin qu'il glisse droit, car il ne fonctionnera correctement que s'il est droit; le travail intérieur doit être bien fait pour que l'ouverture – l'espace entre les dents – reste étroite et les dents fines; le peigne doit glisser avec précision dans les cheveux, les dents arrondies au ciseau et sans aucune écharde. Lane trouve des « peignes en bois d'aloès » parmi les biens du hajj qu'un pèlerin rapporte chez lui, à côté de chapelets, de bâtonnets de miswak, de khôl et de châles de fabrication Hegazi; et à Istanbul, dans l'œuvre d'Evliya, les peignes sont vendus au marché aux outils des cordonniers près du vieux Bezestan, parmi les formes à chaussures, la colle, les aiguilles, les poinçons et les presses."
  tr: "Tarak ustası, Yunan akasya ağacından taraklar yapar ve İbn el-Ukhuwwah'a göre, erkek ve kadın tarakları yalnızca bu ağaçtan yapılmalı ve kuruduğunda eğrilip kırılmaması için yeşil olmamalıdır. En iyi taraklar sedeften yapılanlardır. Akasya dışında başka bir ağaç türü (örneğin portakal ağacı) kullanılırsa, tarama sırasında kıymıklar çıkacak ve kullanıcının saçını kesecektir. Usta işini mükemmelleştirmelidir: dişler mükemmel bir şekilde hizalanmalı ve kesildikten sonra tarak, düzleştirilmesi ve doğru hareket etmesinin sağlanması için bir süre potada preslenmelidir. Ayrıca, dişler arasındaki boşlukların küçük ve dişlerin ince kesilmiş olması için iç bileşenleri de mükemmelleştirmeli, böylece saçta keskin bir şekilde hareket etmesini sağlamalıdır. Dişler bir keski ile yuvarlaklaştırılmalı ve tüm kıymıklardan kaçınılmalıdır. Lin'in zamanında, akasya ağacından yapılan taraklar, hacıların eve getirdikleri hac eşyaları arasında, tesbih, misvak, sürme ve Hicaz'da üretilen şallarla birlikte satılıyordu. İstanbul'da ise taraklar, eski çarşının yakınındaki ayakkabıcı aletleri pazarında, kalıplar, tutkal, iğneler, giyotinler ve bizlerle birlikte sergileniyor."
  id: "Pembuat sisir membuat sisir dari kayu akasia Yunani—dan menurut Ibn al-Ukhuwwah, sisir pria dan wanita hanya boleh terbuat dari kayu tersebut, dan tidak boleh basah, karena akan melengkung dan patah saat kering. Sisir terbaik adalah yang terbuat dari mutiara. Jika seseorang menggunakan kayu selain akasia—seperti kayu jeruk—hal itu akan terlihat saat menyisir, karena serpihan akan muncul dan melukai rambut pengguna. Pengrajin harus menyempurnakan pekerjaannya: gigi sisir harus sejajar sempurna, dan setelah dipotong, sisir harus ditekan dalam wadah selama beberapa waktu untuk meluruskannya dan memastikan sisir bergerak dengan benar. Ia juga harus menyempurnakan komponen internal sehingga celah di antara gigi sisir kecil dan gigi sisir dipotong halus, sehingga dapat bergerak tajam melalui rambut. Gigi sisir harus dibulatkan dengan pahat, dan semua serpihan harus dihindari. Pada masa Lin, sisir yang terbuat dari kayu akasia dijual di antara barang-barang haji yang dibawa pulang oleh para jamaah, bersama dengan tasbih, miswak (batang pengunyah), kohl, dan selendang yang dibuat di Hijaz. Di Istanbul, sisir dipajang di pasar peralatan tukang sepatu di dekat pasar lama, bersama dengan cetakan, lem, jarum, guillotine, dan penusuk."
