  techniques:
    ar: "صنعة الآجُرِّي صنعة طين وجير ونار: اللبن الطيني يُقطَع من طين الوادي — كطين بقيع الخبخب لمسجد المدينة — ويُجفَّف بالشمس، والآجُرّ يُحرَق في الكلْيان؛ والعرب فرّقت بين اللِّبنة والآجُرّ منذ العهد الأول. وعند بير باشا يُستخرَج الجير من قعر البحر صيفاً بغوص الأرناؤط، ويُترَك أربعين يوماً للهواء، ثم يُعجَن بالأيدي والأقدام ويُشكَّل آجراً أحمر كسا بيوت القسطنطينية."
    en: "The brick-maker's craft is clay, lime and fire: the mud brick cut from valley clay — like the clay of Baqi' al-Khabkhaba for the Prophet's mosque — and dried in the sun, the ajurr burnt in the kilns; Arabic distinguished libna from ajurr from the first centuries. At Pir Pasha the lime was drawn from the sea-bottom in summer by Albanese divers, left forty days to the air, then kneaded by hands and feet and formed into the red bricks that covered Constantinople's houses."
    ur: "آجرّی کا ہنر مٹی، چونا اور آگ ہے: کچی اینٹ وادی کی مٹی سے کٹی جاتی — جیسے نبوی مسجد کے لیے بقیع الخبخب کی مٹی — اور دھوپ میں سکھائی، اور آجر بھٹوں میں پکائی؛ عرب نے پہلے صدیوں سے لبنہ اور آجر میں فرق کیا۔ پیر پاشا میں آلبانی غوطہ خور گرمیوں میں سمندر کے تل سے چونا نکالتے، چالیس دن ہوا میں رہتا، پھر ہاتھوں پاؤں سے گوندھ کر وہ سرخ اینٹ بنتی جو قسطنطنیہ کے گھروں کو چڑھائی۔"
