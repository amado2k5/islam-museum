summary:
  ar: "الآجُرِّي صانع اللبن والآجر، مادة العمارة الأولى من مدينة النبي إلى إسطنبول. يثبت كريسويل في العمارة الإسلامية المبكرة أن مسجد المدينة النبوي وبيتي سودة وعائشة بُنيا من لبن طين وادي بقيع الخبخب، وأن بيوت المدينة كانت من اللبن غير المحرق، وبنى أبو موسى الأشعري مسجد البصرة ودار الإمارة من اللبن المجفف بالشمس سنة ١٧هـ؛ والعرب فرّقت بين اللِّبنة ⁦(اللبن الطيني)⁩ والآجُرّ ⁦(اللبن المحرق)⁩ كما في سور الطائف. وفي موكب إسطنبول عدّ إوليا صنّاع الآجر ⁦(كَرْبِيجيان)⁩ خمسمئة رجل بخمسة وثلاثين دكاناً، وصنّاع اللبن غير المحرق بالتبن ⁦(كوبيجيان)⁩ ألف رجل. وفي ضاحية بير باشا مئتا دكان للبنّائين والآجريين يعملون على الجير الذي يستخرجه غواصون أرناؤط من قعر البحر في الصيف، فيبقى أربعين يوماً معرضاً للهواء ثم يعجنه الرجال بأيديهم وأقدامهم ويصنعونه آجراً، حتى بدت بيوت القسطنطينية كلها حمراء بلون آجر بير باشا المخصوص."
  en: "The ajurri made bricks — mud-brick and kiln-burnt — the first fabric of building from the Prophet's Medina to Istanbul. Creswell records of early Muslim architecture that the Prophet's mosque at Medina and the houses of Sawda and 'A'isha were built of mud bricks from the valley of Baqi' al-Khabkhaba, that the houses of Medina were of unburnt brick, and that Abu Musa al-Ash'ari rebuilt the mosque and the Dar al-Imara of Basra in sun-dried bricks in 17 AH; Arabic itself drew the line between libna, the mud brick, and ajurr, the baked brick, as in the wall of Ta'if. In Evliya's Istanbul procession the brick-makers (Kerpichjian) were five hundred men in thirty-five shops, and the makers of unburnt straw-bricks (Kupejian) a thousand men. In the suburb of Pir Pasha two hundred brick-shops worked the lime that Albanese divers drew from the sea-bottom in summer; the lime lay forty days open to the air, then men kneaded it with their hands and feet and made it into bricks — the houses of Constantinople all showed the peculiar red of Pir Pasha brick."
  ur: "آجرّی لبن اور اینٹ بنانے والا ہے — مدینۃ النبی سے استنبول تک تعمیر کا پہلا سامان۔ کرسویل ابتدائی مسلم تعمیر میں لکھتا ہے کہ نبوی مسجد مدینہ اور سودہ اور عائشہ کے گھر وادی بقیع الخبخب کے لبن سے بنے، مدینہ کے گھر کچی اینٹوں کے تھے، اور ابو موسیٰ اشعری نے ۱۷ھ میں بصرہ کی مسجد اور دارالامارہ دھوپ سکی اینٹوں سے بنائی؛ عرب نے لِبنہ ⁦(کچی اینٹ)⁩ اور آجر ⁦(پکی اینٹ)⁩ میں فرق کیا جیسے طائف کی فصیل میں۔ اولیاء کے استنبول کے جلوس میں اینٹ ساز ⁦(کرپچیان)⁩ پانچ سو آدمی پینتیس دکانیں، اور بھوسے والی کچی اینٹ بنانے والے ⁦(کوپیجیان)⁩ ایک ہزار آدمی تھے۔ پیر پاشا کے نواح میں دو سو اینٹ دکانیں اس چونے پر کام کرتی ہیں جو آلبانی غوطہ خور گرمیوں میں سمندر کے تل سے نکالتے؛ چونا چالیس دن کھلی ہوا میں رہتا، پھر آدمی اسے ہاتھوں پاؤں سے گوندھ کر اینٹ بناتے — قسطنطنیہ کے گھر پیر پاشا کی اینٹ کے خاص سرخ رنگ سے دکھائی دیتے۔"
  es: "Los ajurr fabricaban ladrillos —de barro y cocidos en horno—, el primer material de construcción desde la Medina del Profeta hasta Estambul. Creswell registra en la arquitectura musulmana primitiva que la mezquita del Profeta en Medina y las casas de Sawda y Aisha se construyeron con ladrillos de barro del valle de Baqi' al-Khabkhaba, que las casas de Medina eran de ladrillo sin cocer, y que Abu Musa al-Ash'ari reconstruyó la mezquita y el Dar al-Imara de Basora con ladrillos secados al sol en el año 17 de la Hégira; el propio árabe estableció la distinción entre libna, el ladrillo de barro, y ajurr, el ladrillo cocido, como en el muro de Ta'if. En la procesión de Evliya a Estambul, los fabricantes de ladrillos (Kerpichjian) eran quinientos hombres en treinta y cinco talleres, y los fabricantes de ladrillos de paja sin cocer (Kupejian) eran mil hombres. En el suburbio de Pir Pasha, doscientas fábricas de ladrillos trabajaban la cal que los buzos albaneses extraían del fondo del mar en verano; la cal permanecía expuesta al aire durante cuarenta días, luego los hombres la amasaban con las manos y los pies y la convertían en ladrillos; todas las casas de Constantinopla lucían el peculiar color rojo del ladrillo de Pir Pasha."
  fr: "Les briquetiers (ajurri) fabriquaient les premières briques – de terre crue et cuites au four – constituant le matériau de construction de Médine, ville du Prophète, jusqu'à Istanbul. Creswell rapporte, à propos de l'architecture musulmane primitive, que la mosquée du Prophète à Médine et les maisons de Sawda et d'Aïcha furent construites en briques de terre crue provenant de la vallée de Baqi' al-Khabkhaba, que les maisons de Médine étaient en briques crues, et qu'Abu Musa al-Ash'ari reconstruisit la mosquée et le Dar al-Imara de Bassora en briques séchées au soleil en 17 AH. L'arabe lui-même établissait une distinction entre la brique de terre crue (libna) et la brique cuite (ajurr), comme en témoigne le mur de Taïf. Lors du cortège d'Evliya à Istanbul, on comptait cinq cents briquetiers (Kerpichjian) répartis dans trente-cinq ateliers, et mille fabricants de briques de paille crues (Kupejian). Dans la banlieue de Pir Pasha, deux cents briqueteries travaillaient la chaux que les plongeurs albanais puisaient au fond de la mer en été; la chaux restait quarante jours à l'air libre, puis les hommes la pétrissaient avec leurs mains et leurs pieds et en faisaient des briques — les maisons de Constantinople arboraient toutes le rouge particulier de la brique de Pir Pasha."
