craft:
  techniques:
    ar: "صنعة الفيشكجي هي تركيب الصواريخ وإطلاقها للعيد والنصر. يصف إوليا العرض: مئة ألف صاروخ بألوان مختلفة؛ منها ما يصعد مستقيماً إلى السماء، ومنها ما يميل فينشر النجوم حوله، ومنها ما ينقسم ثلاثة أقسام فيرتفع ثلاث دفعات — فإذا احترق الأول وسقط أُشعل الثاني ثم الثالث وانفجر بدويٍّ يكاد يشقّ الغمام. وللصنّاع مصنعٌ بمخزن أدوات وعتاد خارج مستشفى السليمانية ودكاكين في أيوب وغلطة وطوبخانه وبشيكتاش، وأغلبهم من جملة السلاحجية. وشيخهم عندهم «يهودي»، وأستاذهم الأول ابن سينا — كما تروي الطائفة لا كما توثّقه الكتب."
    en: "The fishekji's craft is the composition and firing of rockets for festival and victory. Evliya describes the display: a hundred thousand rockets of different colours; some mounting straight into the sky, some going obliquely and spreading stars around them, some divided into three parts ascending at three different times — the first burning out and falling, the second lighted, then the third, exploding with a noise that seems to rend the clouds. The makers keep a manufactory with tool repository and magazine outside the Suleimanieh hospital and shops at Eyyub, Galata, Tup-khanah and Beshiktash, and most of them belong to the armourers. Their patron is Jewish, the guild says, and their first master Avicenna — as the guild tells it, not as the books attest."
    ur: "فشکچی کا ہنر تہوار اور فتح کے لیے راکٹ ترکیب اور اڑانا ہے۔ اولیاء مظاہرہ لکھتا: کئی رنگوں کے ایک لاکھ راکٹ؛ بعض سیدھا آسمان کو، بعض ترچھے جا کر ستارے بکھیرتے، بعض تین حصوں میں تین مرتبہ چڑھتے — پہلا بجھ کر گرتا، دوسرا جلتا، پھر تیسرا ایسے شور سے پھٹتا کہ گویا بادل چاک ہو۔ سازوں کا کارخانہ سلیمانیہ ہسپتال کے باہر اوزاروں کے گودام اور ذخیرے سمیت ہے اور ایوب، غلاطہ، طوپ خانہ اور بشکطاش میں دکانیں ہیں، اور ان کا بڑا حصہ سلاح سازوں میں ہے۔ طائفہ کہتا ہے کہ ان کا سرپرست یہودی اور پہلا استاد ابن سینا ہے — جیسا کہ طائفہ کہتا ہے، نہ کہ کتابیں ثابت کرتی ہیں۔"
