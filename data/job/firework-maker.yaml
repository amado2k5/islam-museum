summary:
  ar: "الفيشكجي هو صانع الألعاب النارية في المواسم والأفراح السلطانية. عند إوليا الفيشكجيّة مائة رجل في ثمانية عشر دكاناً، شيخهم «يهودي»، وأغلبهم من جملة السلاحجية؛ يظهرون مهارتهم في الأفراح العامة، وولادات الأمراء، وأعياد الختان. لهم مصنعٌ خارج مستشفى السليمانية فيه مخزن أدواتهم وعتادهم، ودكاكين في أيوب وغلطة وطوبخانه وبشيكتاش. وأول من صنع الألعاب النارية عندهم ابن سينا، وهو أستاذ صنّاع الألعاب وشيخهم — كما تروي الطائفة. وفي أفراح الانتصارات يشعلون مئة ألف صاروخ بألوان مختلفة: منها ما يصعد مستقيماً إلى السماء، ومنها ما يميل فينشر النجوم حوله، ومنها ما ينقسم ثلاثة أقسام فيرتفع على ثلاث دفعات — فإذا احترق الأول وسقط أُشعل الثاني ثم الثالث حتى ينفجر بدويٍّ يكاد يشقّ الغمام. وعند لين يواكب إطلاق المدافع عرضُ الألعاب النارية حين فتح قنال القاهرة، حتى إن خير الألعاب يُعرَض في ضوء الشمس الساطع حيث يكاد لا يُرى."
  en: "The fishekji made the fireworks of the great festivals and the dynasty's rejoicings. In Evliya the firework-makers are one hundred men with eighteen shops; their patron is Jewish, the greatest part of them belonging to the armourers. They exhibit their skill at public rejoicings, on the birth of princes and on the feast of circumcision. Their manufactory stands outside the hospital of the Suleimanieh, holding the repository of their tools and their magazine, and they keep shops at Eyyub, Galata, Tup-khanah and Beshiktash. The first artist in fireworks, the guild says, was Avicenna, the master and patron of all firework-makers. On occasions of rejoicing for victories they set on fire some hundred thousand rockets of different colours: some mount straight into the sky, some go obliquely spreading stars around them, and some, divided into three parts, ascend at three different times — when the first has burned out and falls to the ground, the second is lighted, then the third, which at last explodes with a noise that seems to rend the clouds. In Lane's Cairo the display of the fire-works accompanies the firing of guns at the cutting of the Canal dam, the best of them shown in the glaring sunshine where they can hardly be seen."
  ur: "فشکچی بڑے تہواروں اور شاہی مسرتوں کی آتش بازی بنانے والا ہے۔ اولیاء میں فشکجی سو آدمی اٹھارہ دکانوں میں ہیں؛ ان کا سرپرست یہودی ہے اور ان کا بڑا حصہ سلاح سازوں سے ہے۔ وہ اپنی مہارت عام جشنوں، شہزادوں کی پیدائش اور ختنہ کے تہوار پر دکھاتے۔ ان کا کارخانہ سلیمانیہ ہسپتال کے باہر ہے جہاں ان کے اوزاروں کا گودام اور ذخیرہ ہے، اور ایوب، غلاطہ، طوپ خانہ اور بشکطاش میں دکانیں ہیں۔ طائفہ کہتا ہے کہ آتش بازی کا پہلا فنکار ابن سینا تھا اور وہ تمام فشکجیوں کا استاد اور سرپرست ہے۔ فتح کی خوشیوں میں وہ کئی رنگوں کے لگ بھگ ایک لاکھ راکٹ جلاتے: بعض سیدھا آسمان کو چڑھتے، بعض ترچھے جا کر گرد ستارے بکھیرتے، اور بعض تین حصوں میں بٹے تین مرتبہ چڑھتے — پہلا جل کر گرتا تو دوسرا پھر تیسرا جلتا اور آخر میں ایسے شور سے پھٹتا کہ گویا بادل چاک ہو۔ لین کے قاہرہ میں نہر کا باندھ کٹتے وقت بندوقوں کی بےقرار گولیوں کے ساتھ آتش بازی کا مظاہرہ ہوتا اور بہترین آتش بازی دھوپ کی چمک میں دکھائی جاتی جہاں وہ بمشکت دکھتی۔"
  es: "Los fishekji fabricaban los fuegos artificiales de las grandes fiestas y las celebraciones de la dinastía. En Evliya, los fabricantes de fuegos artificiales son cien hombres con dieciocho talleres; su patrón es judío, y la mayoría de ellos pertenecen a la familia de armeros. Exhiben su destreza en las celebraciones públicas, en el nacimiento de príncipes y en la fiesta de la circuncisión. Su fábrica se encuentra fuera del hospital de Suleimanieh, donde guardan sus herramientas y su almacén, y tienen talleres en Eyyub, Galata, Tup-khanah y Beshiktash. El gremio afirma que el primer artista de los fuegos artificiales fue Avicena, maestro y patrón de todos los fabricantes. En ocasiones de júbilo por las victorias, encendían unos cien mil cohetes de distintos colores: algunos se elevaban directamente al cielo, otros ascendían oblicuamente esparciendo estrellas a su alrededor, y otros, divididos en tres partes, subían en tres momentos diferentes: cuando la primera se consumía y caía al suelo, se encendía la segunda, y luego la tercera, que finalmente explotaba con un ruido que parecía rasgar las nubes. En el Cairo de Lane, el espectáculo de fuegos artificiales acompañaba el disparo de cañones durante la construcción de la presa del Canal, y los mejores se mostraban bajo el sol abrasador, donde apenas se distinguían."
  fr: "Les artificiers fabriquaient les feux d'artifice des grandes fêtes et des réjouissances dynastiques. À Evliya, on comptait une centaine d'artificiers répartis dans dix-huit ateliers; leur protecteur était juif, et la plupart d'entre eux appartenaient à la corporation des armuriers. Ils faisaient étalage de leur savoir-faire lors des festivités publiques, à la naissance des princes et à la fête de la circoncision. Leur manufacture se trouvait à l'extérieur de l'hôpital de Soliman le Magnifique, abritant leur entrepôt d'outils et leur magasin. Ils tenaient également des boutiques à Eyyub, Galata, Tupkhanah et Beshiktash. Selon la guilde, le premier artificier fut Avicenne, maître et protecteur de tous les artificiers. Lors des célébrations des victoires, on allumait des centaines de milliers de fusées de couleurs variées: certaines s’élevaient droit vers le ciel, d’autres obliques, semant des étoiles autour d’elles, et d’autres encore, divisées en trois parties, décollaient à trois moments différents: lorsque la première s’était consumée et était retombée au sol, la seconde s’allumait, puis la troisième, qui explosait enfin dans un fracas qui semblait déchirer les nuages. Dans le Caire de Lane, le spectacle pyrotechnique accompagnait les tirs de canon lors de la découpe du barrage du Canal, les plus beaux feux d’artifice étant projetés sous un soleil éclatant où ils étaient à peine visibles."
  tr: "Havai fişek yapımcısı, kraliyet festivalleri ve kutlamaları için havai fişek üreten kişidir. Evliya Havai Fişek Loncası, on sekiz dükkânda yüz kişiyi istihdam eder; liderleri Yahudidir ve çoğu silah ustasıdır. Halk kutlamalarında, prens doğumlarında ve sünnet törenlerinde yeteneklerini sergilerler. Süleymaniye Hastanesi dışında, alet ve ekipmanlarını barındıran bir fabrikaları ve Eyüp, Galata, Tophane ve Beşiktaş'ta dükkânları vardır. Topluluğa göre, aralarında havai fişekleri ilk yapan, ustaları ve liderleri İbn Sina'dır. Zafer kutlamalarında, çeşitli renklerde yüz bin roket yakarlar: bazıları doğrudan gökyüzüne yükselir, bazıları eğik düşerek etraflarına yıldızlar saçar, bazıları ise üç bölüme ayrılarak üç dalga halinde yükselir. İlki yanıp düştüğünde, ikincisi, sonra üçüncüsü yakılır ve bulutları neredeyse yaran bir gürültüyle patlayana kadar bu işlem devam eder. Kahire Kanalı'nın açılışı sırasında, top atışlarına havai fişek gösterisi eşlik ediyordu; öyle ki, en güzel havai fişekler parlak güneş ışığında neredeyse görünmez hale geliyordu."
  id: "Pembuat kembang api adalah orang yang menciptakan kembang api untuk festival dan perayaan kerajaan. Serikat pembuat kembang api Evliya mempekerjakan seratus orang di delapan belas toko, pemimpin mereka beragama Yahudi, dan sebagian besar dari mereka adalah ahli senjata. Mereka menunjukkan keahlian mereka pada perayaan publik, kelahiran pangeran, dan upacara sunat. Mereka memiliki pabrik di luar Rumah Sakit Süleymaniye, yang menyimpan peralatan dan perlengkapan mereka, dan toko-toko di Eyüp, Galata, Tophane, dan Beşiktaş. Menurut komunitas tersebut, orang pertama yang menciptakan kembang api di antara mereka adalah Ibn Sina, guru dan pemimpin mereka. Selama perayaan kemenangan, mereka menyalakan seratus ribu roket berbagai warna: beberapa naik lurus ke langit, beberapa miring, menyebarkan bintang-bintang di sekitarnya, dan beberapa terbagi menjadi tiga bagian, naik dalam tiga gelombang. Ketika yang pertama terbakar dan jatuh, yang kedua dinyalakan, lalu yang ketiga, hingga meledak dengan suara gemuruh yang hampir membelah awan. Pada saat pembukaan Terusan Kairo, penembakan meriam diiringi oleh pertunjukan kembang api, bahkan kembang api terbaik ditampilkan di bawah sinar matahari yang terik, sehingga hampir tidak terlihat."
