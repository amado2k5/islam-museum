summary:
  ar: "الفلّاح من يزرع الأرض ويسقيها. يصف أندرو واطسون في مدخل «زراعة» ثورة زراعية إسلامية مبكرة: محاصيل جديدة انتشرت من الهند إلى الأندلس — قصب السكر والقطن والأرز الآسيوي والحمضيات والموز والبطيخ والسبانخ — وتقنيات ريّ قديمة عمّمت كالشادوف والدولاب والقنوات الجوفية، ففتحت موسمَ صيفٍ جديداً وأبطلت بور الأرض. ويروي لين فلّاحي مصر وأقواتهم ونساءهم اللواتي يلتقطن الماء ويغزلن ويعجنّ الجِلّة، وصرامة جباة الضرائب عليهم."
  en: "The fellah tills and waters the soil. Andrew Watson's entry ZİRAAT describes an early Islamic agricultural revolution: new crops spread from India to al-Andalus — sugarcane, cotton, Asian rice, the citrus fruits, banana, watermelon, spinach — and old irrigation techniques generalised, the shaduf, the dulab waterwheel and the underground kanat, opening a new summer season and ending the year's fallow. Lane records Egypt's fellaheen, their food, their women fetching water and spinning and kneading the gelleh fuel-cakes, and the harshness of the tax gatherers upon them."
  ur: "فلّاح وہ ہے جو زمین جوتتا اور سینچتا ہے۔ اینڈریو واٹسن کے مضمون «زراعت» میں ابتدائی اسلامی زرعی انقلاب بیان ہے: ہندوستان سے اندلس تک نئی فصلیں پھیلیں — گنّا، کپاس، ایشیائی چاول، کھٹے پھل، کیلا، تربوز، پالک — اور پرانی آبپاشی کی تکنیکیں عام ہوئیں، شادوف، دولاب چرخ اور زیرِ زمین کانات، جنھوں نے صرف ایک نیا گرمیوں کا موسم کھولا اور سال بھر کی بنجر چھوٹی ختم کی۔ لین مصر کے فلّاحوں کی خوراک، ان کی عورتوں کے پانی بھرنے، روئی کاتنے اور ایندھن کی جِلّہ گوندھنے اور محصلوں کی سختی بیان کرتا ہے۔"
  es: "El fellah labra y riega la tierra. La entrada de Andrew Watson, ZİRAAT, describe una temprana revolución agrícola islámica: nuevos cultivos se extendieron desde la India hasta al-Ándalus —caña de azúcar, algodón, arroz asiático, cítricos, plátano, sandía, espinaca— y se generalizaron antiguas técnicas de irrigación —el shaduf, la rueda hidráulica dulab y el kanat subterráneo—, dando inicio a una nueva temporada de verano y poniendo fin al barbecho anual. Lane documenta a los fellahin de Egipto, su comida, a sus mujeres buscando agua, hilando y amasando las tortas de combustible gelleh, y la severidad de los recaudadores de impuestos hacia ellos."
