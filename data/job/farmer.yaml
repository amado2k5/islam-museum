training:
  mode: hereditary-family
  certification: "No licence and no diploma: Lane shows sons assisting their fathers in the operations of agriculture and children of five or six already tending the flocks; Watson's village farmers learned the new rotations and the local irrigation practice inside the family plot. Agricultural schooling arrived only in the late nineteenth century — the Halkalı Ziraat Mektebi of 1892 in the Ottoman lands and Egypt's ziraat school of 1890, later folded into Cairo University."
  duration: "A childhood in the fields; the seasonal round itself was the training."
