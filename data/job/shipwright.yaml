summary:
  ar: "القلفاط هو صانع السفن ومقوّمها في دار الصناعة ⁦(الترسانة)⁩: كان يبني السفن الحربية والتجارية ويقلّطها ويصلّحها تحت إشراف الدولة. يتابع المدخل هذه الصناعة من أول ترسانة إسلامية أقامها معاوية في جزيرة الروضة سنة ٥٤هـ، إلى ورش عكا وصور وإسكندرية وتونس والمهدية، ومراسلات والي مصر قرة بن شريك التي تذكر قلفاط الأستاذ والنجار والحدّاد، وحتى ترسانة علائية السلجوقية."
  en: "The shipwright (qalfat, kalafat ustası) built, caulked and repaired war and merchant ships in the state arsenal (dâr al-ṣināʿa, tersane). The TDV entry follows the trade from Muʿāwiya's first Islamic arsenal on Rawza island in 54/674, through the yards of Acre, Tyre, Alexandria, Tunis and Mahdia — with the Umayyad governor Qurra b. Sharīk's papyri naming the kalafat master, carpenter and smith — to the Seljuk tersane of Alanya."
  ur: "جہاز ساز ⁦(قلفاط، کلفت استاد)⁩ دار الصناعة ⁦(ترسانہ)⁩ میں جنگی اور تجارتی جہاز بناتا، ان کی کالا پتی کرتا اور مرمت کرتا تھا۔ ٹی ڈی وی کا مدخل اس پیشے کو معاویہ کے پہلے اسلامی ترسانے ⁦(جزیرہ روضہ، ۵۴ھ/۶۷۴ء)⁩ سے لے کر عکہ، صور، اسکندریہ، تونس اور مہدیہ کے ورشوں تک، اور قرة بن شریک کے پپائرس میں مذکور کلفت استاد، نجار اور حداد تک، سلجوقی ترسانہ علائیہ تک لے جاتا ہے۔"
