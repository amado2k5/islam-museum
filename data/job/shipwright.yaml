places:
  - { place: place/alexandria, note: "The largest arsenal of the conquest era stood at Alexandria; Muʿāwiya sent it cedar timber from the Lebanese mountains.", sources: [source/tdv-tersane] }
  - { place: place/cairo, note: "The first arsenal built by Muslims stood on Rawza island in the Nile (Sınâatü'r-Ravza, 54/674); the Tulunid, Ikhshidid and Fatimid yards at Fustat and Maqs followed.", sources: [source/tdv-tersane] }
  - { place: place/akka, note: "Muʿāwiya gathered the shipwrights at Acre in 49/669 and housed the arsenal workers along the shore; the yard was later moved to Tyre and back.", sources: [source/tdv-tersane] }
  - { place: place/tunis, note: "Hassān b. Nuʿmān founded the first North African arsenal at Tunis, staffed by a thousand Coptic shipwrights sent with their families from Egypt.", sources: [source/tdv-tersane] }
  - { place: place/al-mahdiyya, note: "The Fatimids built a port and arsenal at Mahdia, later enlarged to build a hundred shūne-type ships; Abd al-Muʾmin built his 120-ship fleet there.", sources: [source/tdv-tersane] }
  - { place: place/almeria, note: "Abd al-Raḥmān III built a great arsenal at al-Mariyya after the Fatimid raid, and al-Ḥakam II inspected and renewed it in 353/964.", sources: [source/tdv-tersane] }
  - { place: place/alanya, note: "The Anatolian Seljuks built a tersane at Alanya after its conquest by Kayqubād I; Sinop and Antalya also had yards.", sources: [source/tdv-tersane] }
