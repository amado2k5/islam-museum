craft:
  materials: [wood, textile]
  techniques:
    ar: "كان بناء السفينة يجري في دار الصناعة: تشغيل الورشة بتمويل الدولة، وتوريد الخشب ⁦(أرز لبنان وأخشاب الشام واليمن والأناضول وأفريقيا)⁩ والقار والزفت والمسامير والحديد وقماش الأشرعة والقنب للحبال من الخارج، وعمل فيها قلفاط الأستاذ والنجار والحدّاد كما تذكر برديات قرة بن شريك. وكان السلطان نفسه أحياناً يقف على الصنعة: يذكر المدخل أن الظاهر بيبرس استقبل سفراء صقلية في الترسانة وبيده آلة نجارة بين الأخشاب."
    en: "Shipbuilding ran inside the dâr al-ṣināʿa: a state-funded yard that imported timber — cedar from Lebanon, wood from Syria, Yemen, Anatolia and Africa — plus pitch, tar, nails, iron, sailcloth and hemp for ropes. Qurra b. Sharīk's surviving papyri name the kalafat master, carpenter and smith employed for construction, fitting-out and maintenance. The sultan himself could watch the trade: Baybars received Sicilian envoys in the tersane, carpenter's tool in hand, seated among the timber."
    ur: "جہاز سازی دار الصناعة میں ہوتی تھی: ریاستی اخراجات پر چلنے والی ورکشاپ جو لبنان کی دیوار کی لکڑی اور شام، یمن، اناطولیہ اور افریقہ کی سائو خشک لکڑی، رال، قیر، کیل، لوہا، پال کا کپڑا اور سن کی رسی باہر سے منگواتی تھی۔ قرة بن شریک کے بچ جانے والے پپائرس کلفت استاد، نجار اور حداد کا ذکر کرتے ہیں۔ سلطان خود بھی صنعت دیکھتا تھا: بے برس نے صقلیہ کے ایلچیوں کو ترسانے میں لکڑی کے درمیان نجار کا اوزار ہاتھ میں لیے ملاقات کی۔"
