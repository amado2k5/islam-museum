training:
  mode: hereditary-family
  certification: "No licence: the hāmi's qualification was standing — honour and lineage had to match the person seeking protection, and the office ran in the line of tribal chiefs and eşraf. The fee was negotiated: the hakku'l-mürûr toll for passage, or the hafâre — protection for a stated price by covenant."
  duration: "A himaye lasted as long as the passage or the need; the aman granted to a lone traveller was a bounded grant, while the pact of tribal protection could run by covenant."
