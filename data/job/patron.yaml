summary:
  ar: "الحامي — وقيل له حفير القوم وحامي الحميى — كان في الجاهلية من يمنح الحماية لشخص أو عائلة أو قافلة: لا سلطان مركزي في جزيرة العرب، فدخل التجار في حماية شيخ أو شريف من مشايخ القبائل على طريقهم ودفعوا «حق المرور» فيمشون آمنين في أرضها. اشترطوا أن يتكافأ طالب الحماية وحاميه شرفاً ونسباً، وتفاخرت القبائل بمن تحميهم وعدّت إجارة المستجير شرفاً للبيت، حتى عاهد أشراف مكة على أخذ حق المظلوم من الظالم في حلف الفضول الذي شهده النبي قبل البعثة. وفي الإسلام بقي الاسم: حمى أبو طالب النبي حتى مات، ودخل تحت حماية معتصم بن عدي راجعاً من الطائف، وحمى ابن الدغنة أبا بكر من المشركين حتى ردّها إليه وسكن إلى حماية الله."
  en: "The hāmi — also hafîr, 'the people's protector', or hâmi'l-humeyyâ — was the patron who granted protection in stateless Arabia: with no central authority, merchants entered the himaye of a tribe's chief or eşraf along their route, paid the toll called hakku'l-mürûr, and crossed its lands under the patron's guarantee. Patron and protected had to match in honour and descent, tribes boasted of those they sheltered, and guarding a guest showed the house's honour; at its height the Meccan notables swore the Hilf al-Fudul to win back the wronged person's due — a pact the Prophet himself witnessed before his mission. The institution lived into Islam: Abu Talib kept the Prophet under his himaye till death, Mut'im ibn Adi took him into protection on the return from Ta'if, and Ibn al-Dughunna protected Abu Bakr until he handed the himaye back and took refuge in God's."
  ur: "حامی — جسے حفیرِ قوم یا حامی الحمیٰ بھی کہتے تھے — بے ریاست عرب میں تحفظ دینے والا سرپرست تھا: مرکزی اختیار نہ ہونے کی وجہ سے تاجر راستے کی کسی قبیلے کے سردار یا اشراف کی حمایت میں داخل ہوتے، «حق المرور» کا محصول دیتے اور اس کی سرزمین سے امن سے گزرتے۔ سرپرست اور حمایت پانے والے میں شرافت و نسب کا توازن شرط تھا؛ قبیلے اپنے پناہ گزینوں پر فخر کرتے اور مہمان کی حفاظت گھرانے کی عزت سمجھی جاتی؛ مکہ کے سرداروں نے حلف الفضول کی قسم کھائی کہ مظلوم کا حق ظالم سے دلوائیں گے — وہ عہد جسے نبی نے بعثت سے پہلے دیکھا۔ اسلام کے زمانے میں بھی یہ مؤسسہ رہا: ابوطالب نے موت تک نبی کی حمایت کی، طائف سے لوٹتے ہوئے معطم بن عدی نے انہیں اپنے امان میں لیا، اور ابن الدغنہ نے ابوبکر کی مشرکین سے حمایت کی یہاں تک کہ ابوبکر نے حمایت لوٹا دی اور اللہ کی پناہ اختیار کی۔"
  es: "El hāmi —también hafîr, 'el protector del pueblo', o hâmi'l-humeyyâ— era el patrón que otorgaba protección en la Arabia sin Estado: sin una autoridad central, los mercaderes entraban en el himaye del jefe de una tribu o eşraf a lo largo de su ruta, pagaban el peaje llamado hakku'l-mürûr y cruzaban sus tierras bajo la garantía del patrón. Patrón y protegido debían coincidir en honor y linaje, las tribus se enorgullecían de aquellos a quienes daban cobijo, y proteger a un huésped demostraba el honor de la casa; en su apogeo, los notables de La Meca juraban al Hilf al-Fudul recuperar lo que le correspondía a la persona agraviada, un pacto del que el propio Profeta fue testigo antes de su misión. La institución perduró en el Islam: Abu Talib mantuvo al Profeta bajo su protección hasta su muerte, Mut'im ibn Adi lo tomó bajo su amparo a su regreso de Ta'if, e Ibn al-Dughunna protegió a Abu Bakr hasta que devolvió la protección y se refugió en Dios."
  fr: "Le hāmi — également appelé hafîr, « protecteur du peuple », ou hâmi'l-humeyyâ — était le protecteur qui accordait sa protection dans l'Arabie sans État. En l'absence d'autorité centrale, les marchands entraient dans le himaye du chef de tribu ou de l'eşraf sur leur route, payaient le péage appelé hakku'l-mürûr et traversaient ses terres sous la garantie du protecteur. Protecteur et protégé devaient être de même honneur et de même lignée; les tribus se vantaient de ceux qu'elles abritaient, et la protection d'un hôte témoignait de l'honneur de la maison. À son apogée, les notables mecquois prêtaient serment (Hilf al-Fudul) pour obtenir réparation pour la personne lésée — un pacte dont le Prophète lui-même fut témoin avant sa mission. Cette institution a perduré au sein de l'Islam: Abu Talib a gardé le Prophète sous sa protection jusqu'à sa mort, Mut'im ibn Adi l'a pris en charge à son retour de Ta'if, et Ibn al-Dughunna a protégé Abu Bakr jusqu'à ce qu'il rende la protection et prenne refuge auprès de Dieu."
