craft:
  materials: [wood]
  techniques:
    ar: "يضبط ابن الأخوة أحوال الصنّاع: أجرة يومية مُشترطة تمنع التأخر صباحاً والانصراف قبل الغروب، وتحذير من مَن يُسهّل التقدير ويسوم قليلاً ثم يكلّف صاحب العمل فوق طاقته حتى يبيع عقاره قبل تمامه، وإلزام العامل باستعمال الزوايا والأثقال والخيوط ليقوم البناء مستوياً بلا ميل وإلا ضمن الخلل، وتعويض الخشب المؤجّر للسقالات إذا قُطع. ويفصّل صنع القفل الخشبي: رأس القطعة التي فيها الأسنان المتحركة لا تُثقب بل تُنقَر ويُجعَل للأسنان موضع محفور، وأطرافها العليا مربعة والسفلى مدوّرة مصقولة مستوية الرأس، وتختلف الأقفال بتغاير الحيازيم لئلا يصنع مفتاح على مثال آخر. ويصف لين رسم دخول الطائفة: يدعو النقيب المعلمين بغصن أخضر، ويشدّ النقيب على الشاب شالاً فوق ثوبه ويعقده."
    en: "Ibn al-Ukhuwwa regulates the workmen's conduct: a daily wage with terms preventing late starts and early departures; a warning against those who underquote a job and then burden the employer beyond his means until he sells the property unfinished; the duty to use angles, weights and lines so the building stands true, with liability for any fault; and replacement or compensation for hired scaffolding timber that is cut. He details the wooden lock: the head holding the movable teeth must not be pierced but morticed, the teeth squared above and rounded, filed smooth and flat at the tip below, and the locks differentiated by wards so that no key can be cut to another's pattern. Lane describes the admission ceremony: the nakeeb invites the masters with a sprig of green, then girds the young man with a shawl over his coat and ties a knot in the girdle."
    ur: "ابن الاخوہ مزدوروں کے معاملات ضبط کرتا ہے: روزانہ اجرت پر ایسی شرائط جو صبح کی دیر اور شام سے پہلے رخصتی روکیں؛ ان لوگوں سے خبردار جو کم قیمت بتا کر کام لیں اور پھر آجر پر اتنا بوجھ ڈالیں کہ وہ ناتمام جائیداد بیچنے پر مجبور ہو؛ زاویہ، وزن اور ڈور استعمال کی ذمہ داری کہ عمارت سیدھی کھڑی ہو ورنہ نقص کی ذمہ داری ہو؛ اور کرایے کے پڑاؤ کے لکڑے کاٹنے پر تلافی۔ وہ لکڑی کے قفل کی تفصیل دیتا ہے: متحرک دندانے والا سرا چھیدا نہیں بلکہ خنچا جاتا ہے، دندانے اوپر سے مربع اور نیچے سے گول، چمکائے اور ہموار، اور قفل مختلف حاروں سے الگ الگ کہ کوئی کیلجہ دوسرے جیسا نہ بنے۔ لین داخلہ رسم بیان کرتا ہے: نقیب معلموں کو ہرا تنا دے کر دعوت دیتا ہے، پھر نوجوان کے کُرتے پر شال باندھ کر اس کا گرہ باندھتا ہے۔"
