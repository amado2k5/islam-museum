summary:
  ar: "النجّار هو من يعمل في الخشب: يبني ويصنع الأبواب والأقفال وما يحتاجه الناس من متاع. يجمع ابن الأخوة النجّارين والمنشّارين والبنّائين في باب واحد ويضبط أجرتهم وصدقهم: أن أكثر الصنّاع يتفقون على أجرة يومية ثم يتأخرون في الصباح وينصرفون قبل المساء فيُشترَط لهم ما يمنع ذلك، وأن بعضهم يُسهّل الأمر لصاحب العمل ويسومه ثمناً قليلاً فإذا بدأ العمل احتاج أكثر مما يطيق، وأن صانع الأقفال منهم يُوكَل به أمين يعرف صنعته لأن فيها أمن الأموال وحرمة البيوت، وألا يصنع مفتاحاً على مثال آخر إلا لشريكين معروفين بالأمانة. وفي قاهرة لين كان إدخال الابن في طائفة النجّارين يُقام بحلّة الرزّة ⁦(ربط الشاش بعقدها)⁩، وفي إسطنبول إوليا يمرّ النجّارون في موكب الطوائف يعِدّون البيوت الخشبية."
  en: "The najjar worked the wood: he built and made doors, locks and whatever furnishing people needed. Ibn al-Ukhuwwa groups carpenters, sawyers and builders in one chapter and regulates their wages and honesty: most workmen agree a daily wage and then come late and leave early, so terms must be fixed to prevent it; some assure an employer the job is easy and quote a low price, then demand more than he can bear once the work has begun; the lock-makers among them must have an honest man set over them, for in their craft lies the safety of wealth and the privacy of houses, and no key may be cut to another's pattern except for known partners. In Lane's Cairo a son was admitted to the carpenters' guild by the binding of the sash, and in Evliya's Istanbul the carpenters marched in the guild procession preparing wooden houses."
  ur: "نجار لکڑی کا کام کرتا ہے: عمارتیں، دروازے، قفل اور لوگوں کی ضرورت کا سازوسامان بناتا ہے۔ ابن الاخوہ بڑھئیوں، آری کشوں اور مستریوں کو ایک باب میں جمع کر کے ان کی اجرت اور دیانت ضبط کرتا ہے: اکثر مزدور روز کی اجرت طے کر کے صبح دیر سے آتے اور شام سے پہلے چلے جاتے ہیں، اس کی روک کے لیے شرائط مقرر ہوں؛ بعض آجر کو کام آسان بتلا کر کم قیمت لگاتے ہیں پھر کام شروع ہونے پر اتنا مانگتے ہیں کہ اس کی طاقت سے باہر ہو؛ ان میں قفل سازوں پر امین مقرر ہو کہ ان کے پیشے میں مال کی حفاظت اور گھروں کی حرمت ہے، اور کسی کے قفل جیسا کیلجہ صرف معلوم شریکوں کے لیے نہ بنایا جائے۔ لین کے قاہرہ میں بڑھئیوں کی انجمن میں لڑکے کا داخلہ کمر بند باندھنے کی رسوم سے ہوتا تھا، اور اولیاء چلبی کے استنبول میں بڑھئی انجمنوں کے جلوس میں لکڑی کے مکان تیار کرتے چلتے تھے۔"
  es: "El najjar trabajaba la madera: construía y fabricaba puertas, cerraduras y cualquier mueble que la gente necesitara. Ibn al-Ukhuwwa agrupa a carpinteros, aserradores y constructores en un capítulo y regula sus salarios y honestidad: la mayoría de los trabajadores acuerdan un salario diario y luego llegan tarde y se van temprano, por lo que deben fijarse condiciones para evitarlo; algunos le aseguran al empleador que el trabajo es fácil y le dan un precio bajo, para luego exigir más de lo que puede pagar una vez que el trabajo ha comenzado; los cerrajeros entre ellos deben tener a un hombre honesto a cargo, pues en su oficio reside la seguridad de la riqueza y la privacidad de las casas, y ninguna llave puede ser cortada según el patrón de otro excepto para socios conocidos. En el Cairo de Lane, un hijo era admitido en el gremio de carpinteros mediante la imposición de la faja, y en el Estambul de Evliya, los carpinteros marchaban en la procesión del gremio preparando casas de madera."
