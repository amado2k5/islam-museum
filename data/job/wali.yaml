summary:
  ar: "الوالي من يعيّنه الحاكم لتدبير مدينة أو إقليم خارج العاصمة؛ عُرف في البدء بالأمير أو العامل، وجمع الإمامة في الصلاة والقضاء وجباية الضرائب وقيادة الجيش وحفظ الأمن، وعُيّن بعهد مكتوب يبيّن حقوقه وواجباته، وخضع لتفتيش الدولة وسؤال المحتسبين، ودام عمله ما لم يُعزل أو يستقل."
  en: "The wali was the official the ruler appointed to run a city or province beyond the capital; at first called emir or 'amil, he combined leading the prayer, judging disputes, collecting taxes, commanding the army and keeping order, appointed by a written deed (ahd) that fixed his rights and duties, inspected by the state's envoys, and holding office until dismissed, resigned or driven out."
  ur: "والی وہ افسر تھا جسے حکمران دارالحکومت سے باہر کسی شہر یا صوبے کی نظامت کے لیے مقرر کرتا؛ ابتدا میں امیر یا عامل کہلاتا، نماز کی امامت، فیصلے، محصول کی وصولی، فوج کی قیادت اور امن کے فرائض جمع کرتا، تحریری عہد نامہ ⁦(عہد)⁩ سے مقرر ہوتا جس میں حقوق و فرائض لکھی جاتیں، ریاست کے معائنہ کار اس کی جانچ کرتے، اور عہدہ اس وقت تک رہتا جب تک معزول، مستعفی یا مخالفین نہ نکالیں۔"
