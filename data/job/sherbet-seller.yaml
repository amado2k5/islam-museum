craft:
  techniques:
    ar: "صنعة الشربتلي صناعةُ شرابٍ وتقديمُه: تُطبخ الفواكه والأزهار والجذور بالسكر — كزهر البنفسج المدقوق الذي يعطي الشراب الأخضر عند لين — أو يُنقع الزبيب وعرق السوس والخرّوب في الماء، ويُضاف العنبر والمسك في الخوشاب عند إوليا. وفي البيع يسقي الدكّاني من أقداح الصيني والفايانس المصطفّة، والمتجوّل يحمل «الشيشلة» الزجاجية وجَرّة الصفيح والأقداح التي يقرعها نداءً، وحامل العرقسوس يتّكئ بجَرّة الفخار الأحمر على ساعده الأيسر وفي فيها ليف النخل، وباعة الشتاء يحملون القدور الصغيرة ⁦(بكراج)⁩ على النار في يد والأقداح في اليد الأخرى."
    en: "The sherbet-seller's craft is drink-making and service: fruits, flowers and roots are boiled with sugar — the pounded violet-flowers that give the green sherbet in Lane — or raisins, licorice-root and locust-fruit are steeped, with amber and musk added to the khoshab in Evliya. At the counter the shopkeeper pours from ranked China and Fayence cups; the street man carries the sheesleh glass vessel, the tin jug and the cups he knocks together as his cry; the licorice-seller bears his red earthen jar on his left arm, its mouth stopped with palm-fibre; and the winter sellers carry the little brazier-pots (bakraj) on the fire in one hand and the cups in the other."
    ur: "شربتچی کا ہنر مشروب بنانا اور پیش کرنا ہے: پھل، پھول اور جڑیں شکر میں پکائی جاتی — لین کا کچھلا بنفشہ جو سبز شربت دیتا — یا کشمش، اسوس کی جڑ اور خرنوب بھگوئے جاتے، اور اولیاء کے خوشاب میں عنبر و مشک ملتا۔ دکاندار صف بند چین اور فایانس کے پیالوں سے پلاتا؛ آوارہ بیچنے والا «شیشلے» کا شیشہ برتن، تنکے کا جگ اور پیالے بجا کر آواز دیتا؛ اَسوس فروش بائے بازو پر سرخ مٹی کا گھڑا اٹھائے جس کے منہ میں کھجور کا ریشہ بھرا ہوتا؛ اور سردیوں کے فروش ایک ہاتھ میں آگ پر بکراج کی ہانڈیاں اور دوسرے میں پیالے اٹھائے پھرتے۔"
