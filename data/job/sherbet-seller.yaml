summary:
  ar: "الشربتلي هو صانع الشراب المُحلّى وبائعه في السوق والشارع. يصف لين أصناف شراب أهل مصر: السكر والماء، والليموناضة، وأشرفها شراب البنفسج الأخضر المطبوخ من زهر البنفسج المدقوق بالسكر، وشراب التوت والحمّاض، وما يُباع في الطرق من نبيذ الزبيب ⁦(زبيب)⁩ ومغلي عرق السوس وثمر الخرّوب، يُقدَّم في أقداح زجاجية مغطّاة تسمى «قُلّة» على صينية مستديرة غطاؤها حرير مُطرَّز. وفي إسطنبول إوليا للشربتجية خمسمائة رجل في ثلاثمائة دكان يزيّنون دكاكينهم بأقداح الصيني والفايانس مملوءة شراب الراوند والورد والليمون والنبق والتمر هندي والعنب، ولخوشابجية سبعمائة رجل في خمسمائة دكان يصنعون الخوشاب من فواكه البلاد كله مع العنبر والمسك، ولباعة الشربت بلا دكاكين ثلاثمائة، وللشربتليين الحارّ دكاكين في البيوت يغلون الشراب شتاءً ويحملون القدور الصغيرة على النار في الشوارع، ونقيبهم عثمان الذي ابتكر أصناف الخوشاب — كما تروي الطائفة — في عرسه بابنتي النبي."
  en: "The sherbet-seller made and sold the sweet drinks of the market and the street. Lane lists the Egyptians' sherbets: plain sugar and water, lemonade, the most esteemed violet-sherbet — green, boiled from pounded violet-flowers with sugar — mulberry and sorrel sherbets, and the street kinds: zebeeb or infusion of raisins, the strong licorice-root infusion, and the drink of the locust-tree fruit, served in covered glass cups called kollehs on a round tray under embroidered silk. In Evliya's Istanbul the Sherbetjian were five hundred men in three hundred shops, their stalls dressed with thousands of China and Fayence cups filled with sherbets of rhubarb, roses, lemons, lotus, tamarinds and grapes; the khoshab-merchants seven hundred in five hundred shops made their drink from the fruits of every province with amber and musk; three hundred more sold sherbet and julap without shops; and the issi-sherbetjian boiled warm sherbet at home and carried the little brazier-pots through the winter streets. Their chief, in guild lore, is Osman, who devised the kinds of khoshab at his wedding to the Prophet's two daughters."
  ur: "شربتچی بازار اور گلی کا میٹھا مشروب بنانے اور بیچنے والا تھا۔ لین مصریوں کے شربت گنواتا ہے: سادہ شکر پانی، لیموں کا شربت، سب سے معزز بنفشی شربت — سبز رنگ کا، بنفشے کے پھول کچھل کر شکر میں پکایا ہوا — توت اور کھٹی بوٹی کے شربت، اور گلی کے مشروبات: کشمش کا زبیب، اَسوس کی جڑ کا گاڑھا عرق اور خرنوب کا پھل؛ یہ سب «قلّہ» کہلائے ڈھکے شیشے کے پیالوں میں گول سینی پر کڑھائی ریشم کے نیچے پیش ہوتے۔ اولیاء کے استنبول میں شربتچیان تین سو دکانوں پر پانچ سو آدمی تھے، دکانیں چین اور فایانس کے ہزاروں پیالوں سے سجی جن میں راوند، گلاب، لیموں، کنول، آمچور اور انگور کے شربت بھرے تھے؛ خوشاب فروش پانچ سو دکانوں پر سات سو، اور شربت اور گلاب بغیر دکان بیچنے والے تین سو؛ عیسی شربتچیان سردیوں میں گھروں میں گرم شربت پکا کر ہاتھ میں انگیتھی کی چھوٹی ہانڈیاں لئے بازار پھرتے۔ ان کے سردار، صنعت کے قصے میں، عثمان ہیں جنہوں نے نبی کی دو بیٹیوں سے نکاح پر خوشاب کی اقسام ایجاد کیں۔"
  es: "El vendedor de sorbetes preparaba y vendía las bebidas dulces del mercado y de la calle. Lane enumera los sorbetes egipcios: azúcar y agua simples, limonada, el sorbete de violeta más apreciado —verde, hervido de flores de violeta machacadas con azúcar—, sorbetes de mora y acedera, y los tipos callejeros: zebeeb o infusión de pasas, la fuerte infusión de raíz de regaliz, y la bebida del fruto del algarrobo, servida en vasos de vidrio cubiertos llamados kollehs en una bandeja redonda bajo seda bordada. En el Estambul de Evliya, los Sherbetjian eran quinientos hombres en trescientos puestos, sus puestos adornados con miles de vasos de China y Loyence llenos de sorbetes de ruibarbo, rosas, limones, loto, tamarindos y uvas; los mercaderes khoshab setecientos en quinientos puestos preparaban su bebida con frutas de cada provincia con ámbar y almizcle; trescientos más vendían sorbete y julap sin puestos; Y los issi-sherbetjian hervían sorbete caliente en casa y llevaban los pequeños braseros por las calles invernales. Su jefe, según la tradición del gremio, es Osman, quien ideó los tipos de khoshab en su boda con las dos hijas del Profeta."
  fr: "Le vendeur de sorbet préparait et vendait les boissons sucrées du marché et de la rue. Lane énumère les sorbets égyptiens: eau sucrée, limonade, le très réputé sorbet à la violette – vert, obtenu par ébullition de fleurs de violette pilées avec du sucre –, sorbets à la mûre et à l’oseille, et les sorbets de rue: le zebeeb ou infusion de raisins secs, la forte infusion de racine de réglisse, et la boisson au fruit du caroubier, servie dans des coupes en verre couvertes appelées kollehs, sur un plateau rond sous de la soie brodée. À Istanbul, sous le règne d’Evliya, les vendeurs de sorbet étaient cinq cents hommes répartis dans trois cents boutiques, leurs étals ornés de milliers de coupes en porcelaine et en faïence remplies de sorbets à la rhubarbe, à la rose, au citron, au lotus, au tamarin et au raisin; les marchands de khoshab, sept cents dans cinq cents boutiques, préparaient leur boisson à partir de fruits de toutes les provinces, avec de l’ambre et du musc; trois cents autres vendaient du sorbet et du julap sans boutique. Les issi-sherbetjian faisaient bouillir du sherbet chaud chez eux et transportaient les petits pots-braseros à travers les rues hivernales. Leur chef, selon la tradition de la guilde, est Osman, qui imagina les différents types de khoshab lors de son mariage avec les deux filles du Prophète."
