summary:
  ar: "اللغوي صاحب المعجم: يجمع مفردات اللغة من أفواه البادية والنصوص الموثوقة ويرتّبها في كتاب يقصد به لساناً كاملاً. بدأت الصنعة بأسئلة الصحابة عن غريب القرآن وكتب الغريب لابن عباس وأصحابه، فلما فسدت اللغة باختلاط الأعاجم خرج اللغويون إلى البدو يجمعون، حتى وضع الخليل بن أحمد ⁦(ت ١٧٥هـ)⁩ «كتاب العين» أول معجم قصد جمع كل كلمات العربية بترتيب المخارج والتقليب، ثم تتابعت المدارس حتى بلغت ذروة الحجم بلسان العرب لابن منظور وذروة الانتشار بالقاموس المحيط للفيروزآبادي الذي صار «قاموس» اسم المعجم."
  en: "The lexicographer gathers the tongue's vocabulary from the mouths of the desert Arabs and trusted texts and orders it into a book meant to hold the whole language. The craft began with the Companions' questions about the Qur'an's rare words and the gharib works of Ibn Abbas's circle; then, as contact with non-Arabs corrupted speech, the lughawis went out to the bedouin to collect, until al-Khalil ibn Ahmad (d. 175 AH) made the Kitab al-Ayn, the first dictionary aiming at every Arabic word by the order of articulation points and permutation. School followed school until the largest harvest came in Ibn Manzur's Lisan al-Arab and the widest fame in al-Firuzabadi's al-Qamus al-Muhit, which gave 'qamus' as the very name of the dictionary."
  ur: "لغت نویس زبان کے الفاظ بادیہ نشین عربوں کی زبانی اور معتبر متون سے جمع کر کے ایسی کتاب مرتب کرتا ہے جس میں پوری زبان سمو آئے۔ اس پیشے کا آغاز صحابہ کے غریب قرآن پر سوالات اور ابن عباس کے حلقے کے غریب رسائی سے ہوا؛ پھر جب غیر عربوں کے اختلاط سے زبان بگڑنے لگی تو لغوی بدووں کے پاس جا کر مادے جمع کرنے لگے، یہاں تک کہ خلیل بن احمد ⁦(وفات ١٧٥ھ)⁩ نے «کتاب العین» لکھی — مخارج و قلب کے نظام پر پوری عربی زبان جمع کرنے والی پہلی لغت۔ پھر مکتب در مکتب یہ سلسلہ ابن منظور کی لسان العرب کے وسیع ترین ذخیرے اور فیروزآبادی کے قاموس المحیط کی وسیع ترین شہرت تک پہنچا، جس نے «قاموس» کو ہی لغت کا نام بنا دیا۔"
  es: "El lexicógrafo recopila el vocabulario de la lengua a partir de la conversación entre los árabes del desierto y textos fidedignos, y lo ordena en un libro destinado a contener la totalidad del idioma. El oficio comenzó con las preguntas de los Compañeros sobre las palabras raras del Corán y las obras gharib del círculo de Ibn Abbas; luego, a medida que el contacto con los no árabes corrompió el habla, los lughawis salieron a los beduinos para recopilar información, hasta que al-Khalil ibn Ahmad (m. 175 AH) creó el Kitab al-Ayn, el primer diccionario que pretendía clasificar cada palabra árabe según el orden de los puntos de articulación y las permutaciones. Se sucedieron varias escuelas hasta que la obra más importante fue el Lisan al-Arab de Ibn Manzur y la más famosa, el al-Qamus al-Muhit de al-Firuzabadi, que dio nombre al diccionario con la palabra «qamus»."
