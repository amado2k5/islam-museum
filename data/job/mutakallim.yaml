summary:
  ar: "المتكلّم صاحب علم الكلام: يثبت عقائد الدين بالدلائل القطعية ويردّ شبهات المخالفين بحجج العقل على قاعدة النص. نشأت الصنعة مع جهم بن صفوان أول من استعمل منهج الكلام، ثم مع واصل بن عطاء تلميذ الحسن البصري ببصرة نحو ١٠٠-١٢٠هـ الذي أسّس المعتزلة، فانقسم المتكلمون بين معتزلة وسلفية والمدرستين السنّيتين الأشعرية بالعراق والماتريدية بما وراء النهر، حتى أدخل الغزالي المنطق في العلم وبلغت الشروح والحواشي ذروتها مع التفتازاني والجرجاني، وفي العصر الحديث أعاد أهل «العلم الجديد للكلام» بناءه ليردّ على نقد العلم الحديث للدين."
  en: "The mutakallim holds the science of kalam: establishing the religion's creeds with decisive proofs and rebutting opponents' objections by rational argument built on the revealed text. The craft arose with Jahm ibn Safwan, the first scholar to use the kalam method, then with al-Hasan al-Basri's student Wasil ibn Ata at Basra about 100-120 AH, who founded the Mu'tazila; the mutakallimun then divided between the Mu'tazila, the Salafiyya and the two Sunni schools, the Ash'ariyya in the Middle East and the Maturidiyya in Transoxiana, until al-Ghazali brought logic into the science and the sharh-hashiya tradition peaked with al-Taftazani and al-Jurjani, while the modern 'new ilm-i kelam' rebuilt it to answer modern science's criticisms of religion."
  ur: "متکلم علم کلام کا حامل ہے: دین کے عقائد کو قطعی دلائل سے ثابت کرنا اور مخالفین کے اعتراضات کا نص کی بنیاد پر عقلی دلیل سے رد کرنا۔ یہ پیشہ جہم بن صفوان سے شروع ہوا جس نے پہلی بار اسلوب کلام استعمال کی، پھر بصرہ میں حسن بصری کے شاگرد واصل بن عطاء نے تقریباً ١٠٠-١٢٠ھ میں معتزلہ کی بنیاد رکھی؛ اس کے بعد متکلمین معتزلہ، سلفیہ اور دو سنی مسلکوں — مشرق وسطی میں اشاعرہ اور ماوراءالنہر میں ماتریدیہ — میں بٹ گئے، یہاں تک کہ غزالی نے علم میں منطق داخل کی اور شرح و حاشیہ کی روایت تفتازانی و جرجانی کے ساتھ عروج کو پہنچی، جبکہ جدید دور میں «نئے علم کلام» کے داعیوں نے دین پر جدید سائنس کے نقادانہ حملوں کے جواب میں اسے ازسرنو تعمیر کیا۔"
  es: "Los mutakallim sostienen la ciencia del kalam: establecer los credos de la religión con pruebas decisivas y refutar las objeciones de los oponentes mediante argumentos racionales basados en el texto revelado. Esta disciplina surgió con Jahm ibn Safwan, el primer erudito en utilizar el método kalam, y posteriormente con Wasil ibn Ata, discípulo de al-Hasan al-Basri, en Basora, alrededor del año 100-120 AH, quien fundó la escuela Mu'tazila. Los mutakallimun se dividieron entonces entre los Mu'tazila, los Salafiyya y las dos escuelas sunitas, la Ash'ariyya en Oriente Medio y la Maturidiyya en Transoxiana, hasta que al-Ghazali introdujo la lógica en la ciencia y la tradición sharh-hashiya alcanzó su apogeo con al-Taftazani y al-Jurjani, mientras que el moderno \"nuevo ilm-i kelam\" la reconstruyó para responder a las críticas de la ciencia moderna a la religión."
  fr: "Les mutakallim détiennent la science du kalam: établir les dogmes de la religion par des preuves irréfutables et réfuter les objections des opposants par une argumentation rationnelle fondée sur le texte révélé. Cette discipline a vu le jour avec Jahm ibn Safwan, le premier savant à utiliser la méthode du kalam, puis avec Wasil ibn Ata, élève d’al-Hasan al-Basri, à Bassora vers 100-120 AH, qui fonda le Mu’tazilite. Les mutakallimun se sont ensuite divisés entre les Mu’tazilites, les Salafiyya et les deux écoles sunnites, les Ash’arites au Moyen-Orient et les Maturiditya en Transoxiane, jusqu’à ce qu’al-Ghazali y introduise la logique et que la tradition sharh-hashiya atteigne son apogée avec al-Taftazani et al-Jurjani. Le « nouvel ilm-i kelam » moderne l’a reconstruit pour répondre aux critiques de la religion formulées par la science moderne."
  tr: "Kelam teolojisinin (İslam teolojisinin) ustası olan teolog: Dinî doktrinleri kesin delillerle ortaya koyar ve muhaliflerin şüphelerini metne dayalı rasyonel argümanlarla çürütür. Bu disiplin, Kelam yöntemini ilk kullanan Cahm ibn Safvan ile, ardından Hicri 100-120 yılları arasında Basra'da Hasan el-Basri'nin öğrencisi olan ve Mu'tezile'yi kuran Vezil ibn Ata ile ortaya çıkmıştır. Teologlar daha sonra Mu'tezile ve Selefiler ile Irak'taki Eş'ari ve Transoksanya'daki Maturidi olmak üzere iki Sünni mezhep arasında bölünmüş, ta ki Gazali teolojiye mantığı dahil edene ve tefsirler ve açıklamalar el-Taftazani ve el-Curcani ile zirveye ulaşana kadar. Modern çağda, \"yeni Kelam teolojisi\"nin savunucuları, modern teolojinin dine yönelik eleştirilerine cevap vermek için onu yeniden yapılandırmışlardır."
  id: "Teolog, ahli Kalam (teologi Islam): Ia menetapkan doktrin-doktrin agama dengan bukti-bukti yang meyakinkan dan membantah keraguan lawan dengan argumen rasional berdasarkan teks. Disiplin ini bermula dari Jahm ibn Safwan, orang pertama yang menggunakan metode Kalam, dan kemudian dari Wasil ibn Ata, murid al-Hasan al-Basri di Basra sekitar tahun 100-120 H, yang mendirikan Mu'tazila. Para teolog kemudian terpecah antara Mu'tazila dan Salafi, dan dua mazhab Sunni, Ash'ari di Irak dan Maturidi di Transoxiana, hingga al-Ghazali memperkenalkan logika ke dalam ilmu ini, dan tafsir serta penjelasannya mencapai puncaknya dengan al-Taftazani dan al-Jurjani. Di era modern, para pendukung \"ilmu Kalam baru\" merekonstruksinya untuk menanggapi kritik ilmu pengetahuan modern terhadap agama."
