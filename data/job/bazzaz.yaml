summary:
  ar: "البزّاز هو تاجر القماش في السوق والبيزستان: يشتري الأطوال ويقيس بالذراع ويبيع القطع. يفتتح الشيزري بابه بقول عمر بن الخطاب: لا يتجر في سوقنا إلا من يفقه، وإلا وقع في الربا شاء أم أبى؛ ويعدّد ما يفعله بزّازو زمانه من المحظور: النجش، والبيع على بيع أخيه، والطمع على طمع أخيه، والبيع بأجل مجهول كقولهم «حتى يجيء الحجّاج»، والبيع قبل القبض، وبيع الملامسة والمنابذة والحصى. ويجمع ابن الأخوة للبزّازين ⁦(باب البزّازين)⁩ نفس القواعد ويمنع بيع الحاضر للوارد. وفي بيزستان إسطنبول يمرّ تجار القماش ⁦(چوقه‌جيان)⁩ بعربات محمّلة بقماش لندن وفلورنسا وأنكونا ومرسيليا يذرعونه وهم يسيرون، والبزّازون باعة الكتّان ألف رجل بسبعمئة دكان."
  en: "The bazzaz is the cloth merchant of the market and the bezestan: he buys the bolts, measures by the cubit and sells the lengths. Al-Shayzari opens his chapter with 'Umar's saying that no one should trade in our market who does not know the laws of his religion, else he will fall into usury whether he means to or not; and he lists what the cloth merchants of his day did that was forbidden: collusion in bidding, selling against a brother's sale and offering against his offer, selling for payment at an indefinite time such as 'when the pilgrims come from Mecca', reselling before taking possession, and sale by touch, by throwing and by pebble. Ibn al-Ukhuwwa gives the drapers the same rules and forbids the townsman to sell for the incomer. In Istanbul's bezestan Evliya passes the cloth-merchants (Chokajian) with wagons loaded with cloth from London, Florence, Ancona and Marseilles, measuring it as they go, and the Bezzazan linen-merchants a thousand men with seven hundred shops."
  ur: "بزاز بازار اور بیزستان کا کپڑا سوداگر ہے: تھان خریدتا، ذرع سے ناپتا اور قطعے بیچتا ہے۔ الشیزری اپنے باب کا آغاز عمر بن خطاب کے قول سے کرتا ہے کہ ہمارے بازار میں صرف وہی سودا کرے جو اپنے دین کے احکام جانتا ہو ورنہ وہ چاہے یا نہ چاہے سود میں پڑ جائے؛ اور اپنے زمانے کے بزازوں کی وہ حرام رویوں کی گنتی کرتا ہے: نجش، اپنے بھائی کے بیع پر بیع، بھائی کے سودے پر سودا، غیر معینہ مدت پر بیع جیسے ⁦(جب مکہ کے حاجی آ جائیں)⁩، قبض سے پہلے دوبارہ بیچنا، اور ملامسہ، منابذہ اور کنکری والی بیع۔ ابن الاخوہ بزازوں کے لیے یہی اصول دیتا ہے اور شہری کے باہر والے کے لیے بیچنے پر پابندی لگاتا ہے۔ استنبول کے بیزستان میں اولیاء چلبی کپڑا سوداگروں ⁦(چوقاجیان)⁩ کو لندن، فلورنس، انکونا اور مارسی کے کپڑے سے لدے ریڑھوں پر ناپتے چلتے دکھاتا ہے، اور بزاز کتان سوداگر ایک ہزار آدمی سات سو دکانوں کے ساتھ ہیں۔"
