  techniques:
    ar: "يفصّل الشيزري بيوع البزّازين المحرّمة: النجش أن يزيد الرجل في السلعة وهو لا يريد شراءها ليغرّ غيره، والبيع على بيع أخيه والطمع على طمع أخيه، وبيع الغائب بثمن حاضر ينقص عن الثمن المؤجل لأن الأجل ببعض الثمن، والبيع بأجل مجهول، وشراء السلعة وبيعها قبل قبضها، وبيع الملامسة والمنابذة والحصى. وعلى المحتسب أن يتحقق صدقهم في التورية والبيع بالربح المعلوم: من اشترى قماشاً بعشرة ثم بيّضه وطرّزه ورمّمه بثلاثة قال كلفني ثلاثة عشر ولا يقول اشتريته بثلاثة عشر فيكذب، فإن كان هو الذي عمِل قال اشتريته بعشرة وعمِلت عليه بثلاثة. ويفحص موازينهم وأذرعهم ويمنع شراكتهم للدلّالين والسماسرة. ويمنع ابن الأخوة بيع الحاضر للوارد، ويذكر من مكايدهم مع الصيارف أن يُقرض الرجل ديناراً ويبيعه عباءة بدينارين فيكون له ثلاثة مؤجلة."
    en: "Al-Shayzari details the cloth merchants' forbidden sales: the najash, when a man raises the price on a commodity he does not want, to lure another; selling against a brother's sale and offering against his offer; buying for a deferred price then bargaining for a lower cash price, since the deferment is allowed for in the price; selling for payment at an indefinite term; buying a commodity and reselling it before taking possession; and sale by touch, by throwing and by pebble. The muhtasib must verify their honesty in the resale at a stated profit: a man who buys cloth for ten dirhams and pays one each to have it bleached, embroidered and repaired must say it cost him thirteen, not that he bought it for thirteen, and if he did the work himself he must say he bought it for ten and worked on it to the value of three. The muhtasib examines their scales and cubits and forbids their partnership with the bazaar criers and brokers. Ibn al-Ukhuwwa forbids the townsman to sell for the incomer, and names their trick with the money-changers: lending a man a dinar and selling him a cloak for two, so that three deferred dinars are owing."
    ur: "الشیزری بزازوں کی حرام بیعوں کی تفصیل دیتا ہے: نجش، جب آدمی اس چیز کی قیمت بڑھائے جو وہ خریدنا نہیں چاہتا تاکہ دوسرے کو دھوکہ دے؛ اپنے بھائی کے بیع پر بیع اور اس کے سودے پر سودا؛ مؤجل قیمت پر خرید کر کم نقد قیمت پر سودا، کہ التوا قیمت میں شمار ہے؛ غیر معینہ مدت پر بیع؛ چیز خرید کر قبض سے پہلے بیچنا؛ اور ملامسہ، منابذہ اور کنکری والی بیع۔ محتسب کو مقررہ نفع کے سودے میں ان کی صداقت کی تصدیق کرنی ہے: جو کپڑا دس درہم کا خرید کر اسے ایک ایک درہم میں سفید، کشیدہ اور مرمت کرائے وہ کہے مجھے تیرہ کی پڑی، یہ نہ کہے میں نے تیرہ میں خریدا کہ جھوٹ ہو؛ اور اگر کام خود کیا ہو تو کہے دس میں خریدا اور تین کا کام کیا۔ وہ ان کے ترازو اور ذرع کی جانچ کرتا ہے اور دلالوں اور سمساروں سے شرکت پر پابندی لگاتا ہے۔ ابن الاخوہ شہری کے باہر والے کے لیے بیچنے سے روکتا ہے، اور صرافوں کے ساتھ ان کی یہ چال بتاتا ہے: آدمی کو ایک دینار قرض دینا اور دو دینار کا عبا بیچنا کہ تین دینار مؤجل واجب ہو جائیں۔"
