summary:
  ar: "الثائر من يخرج على الأمر القائم — طاغيةٍ أو محتلٍّ أو نظامٍ — بقصد تغييره؛ و«الثوار» جمعه في العصر الحديث، كما سمّى الفقهاء حاله قديماً «البغي»: الخروج المسلح على الإمام العادل بقوةٍ وقصد عزله على تأويل، ومن لم يجتمع له ذلك فليس بباغٍ عندهم. ليست وظيفة يُعيَّن فيها بل حالٌ يُوصف بها صاحبها، غير أنها من أقدم أدوار الكلمة العامة: خطب الثائر منادياً وحمل رايته كما فعل المختار بن أبي عبيد والحسين بن علي قبله حين احتجّا بالمظلومية، ودعت الثورات الحديثة — عبد القادر الجزائري وعبد الكريم الخطابي وعمر المختار — باسم التحرير من الاستعمار، وجمعت بين السلاح والبيان فصارت «الثورة» في القرن العشرين عنوان صحف وإذاعات كما صار «الناطق باسم الثورة» منصباً في حد ذاته."
  en: "The tha'ir rises against the order that stands — a tyrant, an occupier or a regime — meaning to change it; the modern plural is 'the revolutionaries' (al-thuwwar), while classical fiqh named the condition baghy: armed rising against a just imam by force, intending to depose him, upon a ta'wil — and one who does not meet these is not a baghi in their law. It is not an office one is appointed to but a state one is described by; yet it is among the oldest roles of public speech: the rebel preached and raised his banner as al-Mukhtar ibn Abi Ubayd did, and al-Husayn ibn Ali before him when each protested wrong, and the modern revolutions — Abd al-Qadir al-Jaza'iri, Abd al-Karim al-Khattabi, Omar al-Mukhtar — called in the name of liberation from colonial rule, joining arms and manifesto until 'the revolution' became a twentieth-century title of papers and radios and 'the revolution's spokesman' an office in itself."
  ur: "باغی ⁦(ثائر)⁩ وہ ہے جو قائم شدہ حاکم — جابر، غاصب یا نظام — کے خلاف تبدیلی کے ارادے سے اٹھ کھڑا ہوتا ہے؛ جدید زمانے میں اس کا جمع «ثوار» ہے جب کہ کلاسیکی فقہ اس حال کو «بغی» کہتی ہے: عادل امام کے خلاف قوت اور عزل کے ارادے سے، کسی تأویل پر مسلح خروج — اور جس میں یہ شرائط نہ ہوں ان کے نزدیک باغی نہیں۔ یہ کوئی منصب نہیں جس پر تعینات کیا جائے بلکہ ایک حال ہے جس سے فرد معروف ہوتا ہے؛ مگر عوامی کلام کے قدیم ترین کرداروں میں ہے: باغی نے خطبہ دیا اور جھنڈا اٹھایا جیسے مختار بن ابی عبید اور قبل تر حسین بن علی نے مظلومیت پر احتجاج کرتے ہوئے کیا، اور جدید انقلابیوں — عبدالقادر الجزائری، عبدالکریم الخطابی، عمر مختار — نے استعمار سے آزادی کے نام پر اعلان کیا، ہتھیار اور بیانیہ ملا کر، یہاں تک کہ «انقلاب» بیسویں صدی کے اخبار اور ریڈیو کا عنوان بنا اور «انقلاب کا ترجمان» خود ایک منصب۔"
  es: "El tha'ir se alza contra el orden establecido —un tirano, un ocupante o un régimen— con la intención de cambiarlo; el plural moderno es «los revolucionarios» (al-thuwwar), mientras que el fiqh clásico denominaba a esta condición baghy: levantarse armado contra un imán justo por la fuerza, con la intención de deponerlo, basándose en un ta'wil; y quien no cumple con estos requisitos no es un baghi según su ley. No se trata de un cargo para el que se es designado, sino de un estado que lo define. Sin embargo, es uno de los roles más antiguos del discurso público: el rebelde predicaba y alzaba su bandera como lo hizo al-Mukhtar ibn Abi Ubayd, y al-Husayn ibn Ali antes que él cuando cada uno protestaba contra la injusticia, y las revoluciones modernas —Abd al-Qadir al-Jaza'iri, Abd al-Karim al-Khattabi, Omar al-Mukhtar— se manifestaron en nombre de la liberación del dominio colonial, uniendo armas y manifiestos hasta que \"la revolución\" se convirtió en un título del siglo XX para periódicos y radios, y \"el portavoz de la revolución\" en un cargo en sí mismo."
  fr: "Le tha'ir se soulève contre l'ordre établi — un tyran, un occupant ou un régime — dans le but de le changer; le pluriel moderne est « les révolutionnaires » (al-thuwwar), tandis que le fiqh classique désignait cette condition comme baghy: un soulèvement armé contre un imam juste par la force, dans l'intention de le déposer, sur un ta'wil — et celui qui ne remplit pas ces conditions n'est pas baghi selon leur loi. Il ne s'agit pas d'une fonction à laquelle on est nommé, mais d'un état par lequel on est décrit. Pourtant, il s'agit là d'un des plus anciens rôles de la parole publique: le rebelle prêchait et levait son étendard, comme l'ont fait al-Mukhtar ibn Abi Ubayd, et al-Husayn ibn Ali avant lui, lorsqu'ils protestaient contre l'injustice; et les révolutions modernes — Abd al-Qadir al-Jaza'iri, Abd al-Karim al-Khattabi, Omar al-Mukhtar — ont invoqué au nom de la libération du joug colonial, unissant leurs armes et leurs manifestes jusqu'à ce que « la révolution » devienne, au XXe siècle, un titre de journaux et de radios, et « le porte-parole de la révolution », une fonction à part entière."
