places:
  - { place: place/medina, note: "The office began in Medina: Bilal ibn Rabah called the first ezan from a rooftop, and 'Uthman raised the number of the Prophet's mosque's muezzins to four; in later centuries the great mosques of Mecca, Medina, Damascus and Cairo kept thirty to seventy muezzins, one for each school's mihrab.", sources: [source/tdv-muezzin] }
  - { place: place/istanbul, note: "The Ottoman muezzin held a sultan's berat and counted among the askeri; the palace hünkâr müezzinleri, headed by the sermüezzin and trained in Enderun music and etiquette, numbered fifteen in the sixteenth century, and Evliya Çelebi counts seven hundred muezzins of the 'ehl-i hiref-i hâssa'.", sources: [source/tdv-muezzin] }
  - { place: place/damascus, note: "Nasir-i Khusraw records muezzins in every town and village from Damascus to Kairouan paid by the governors; Ibn Asakir shows the Damascus mosques' muezzins paid largely from waqf revenue.", sources: [source/tdv-muezzin] }
