summary:
  ar: "المؤذّن من يؤذّن للصلاة ويقيمها، وقد استقلّت وظيفته عن المناداة العامة حين عيّن النبي بلال بن رباح أول مؤذّن بالمدينة بعد استقرار صيغة الأذان سنة ١ أو ٢ هـ. كان المؤذّن يُختار لحسن الصوت وقوته وإتقان القراءة والموسيقى، ويتقاضى مرتّباً من أوقاف المسجد أو من الديوان، وارتقى منه في الحرمين والجوامع الكبرى إلى مؤذّنين بعشرات تتقدّمهم رئاسة المؤذّنين؛ وفي الدولة العثمانية صار المؤذّن ببراءة سلطانية من أهل العسكر معفياً من الضريبة الشخصية، منهم مؤذّنو السلطان ⁦(هنكار مؤذّني)⁩ في القصر والجيش والأسطول، ويبلغ إوليا جلبي مؤذّني «أهل الحرف الخاصة» سبعمئة."
  en: "The muezzin gives the call to prayer and the iqama; his office separated from the general town-crier when the Prophet appointed Bilal ibn Rabah as the first muezzin in Medina, once the wording of the ezan was fixed in year 1 or 2 AH. He was chosen for a beautiful, powerful voice, good recitation and knowledge of music, and drew his pay from the mosque's waqf or the treasury. In the two sanctuaries and the great mosques he rose to bodies of dozens under a chief muezzin; under the Ottomans he held a sultan's berat, counted among the askeri exempt from personal tax, and served as palace muezzin (hünkâr müezzini) in the court, the army and the fleet — Evliya Çelebi gives seven hundred muezzins among the 'people of the imperial craft'."
  ur: "مؤذّن وہ شخص ہے جو اذان دیتا اور اقامت کہتا ہے؛ اس کا منصب عام منادی سے اس وقت الگ ہوا جب نبی نے مدینہ میں بلال بن رباح کو پہلا مؤذّن مقرر کیا، اذان کے الفاظ سن ۱ یا ۲ ہجری میں طے ہونے کے بعد۔ اسے خوبصورت بلند آواز، اچھی تلاوت اور موسیقی کے علم کی بنا پر چنا جاتا اور مسجد کے وقف یا دیوان سے تنخواہ پاتا۔ حرمین اور بڑی مسجدوں میں ان کی تعداد درجنوں ہوتی اور سردار مؤذّن ہوتا؛ عثمانیوں میں وہ سلطانی برات سے منصب پاتا، عسکری طبقے میں شمار ہوا اور ذاتی ٹیکس سے مستثنیٰ رہا، اور محل، لشکر اور بحریہ میں پادشاہ مؤذّن ⁦(ہنکار مؤذّنی)⁩ کی خدمت کرتا — اولیاء چلبی شاہی دستکاروں میں سات سو مؤذّن لکھتا ہے۔"
