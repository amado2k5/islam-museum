summary:
  ar: "سادن الكعبة حافظ بابها ومفاتيحها يفتحها للزوّار في الأوقات المعهودة، ويُعنى بمقام إبراهيم وبالهدايا الثمينة والأستار الداخلية والخارجية؛ ومن قام بالحجابة سُمّي حاجباً أو سادناً ونُسب حجبياً، والسِّدانة تطلق على خدمة البيت كلها. انتقلت الوظيفة من جرهم إلى خزاعة إلى قصيّ فبني عبد الدار حتى صارت يوم فتح مكة إلى عثمان بن طلحة، فأمر النبي بفتح الباب وخرج فسلّم المفتاح لعثمان وابن عمه شيبة بن عثمان وقال: خذاها إلى يوم القيامة لا ينزعها منكم إلا ظالم، وأخفاه بثوبه توصيةً بإخفائه. ثم استمرت الحجابة في بني شيبة كما شهد المؤرخون قرناً بعد قرن إلى يومنا، وعيّن عمر لها رزقاً ونظّم معاوية الموظفين، ثم تولاها لاحقاً الخدم الآغوات ثم الموظفون والخدام اليوم."
  en: "The sâdin kept the door of the Ka'ba and its keys and opened it to visitors at the stated times, attending also to the Maqam Ibrahim, the precious gifts and the inner and outer covers; the holder of the hicâbe was called hâcib or sâdin with the nisba hacebî, while sidâne named the whole service of the House. The office passed from Jurhum to Huza'a to Qusayy and the sons of Abd al-Dar, until at the conquest of Mecca it rested with Uthman ibn Talha: the Prophet had the door opened, and when he came out he gave the key to Uthman and his uncle's son Shayba ibn Uthman, telling them to take it until the Day of Resurrection, saying only wrongdoers would take it from them, hiding the key in his garment to teach them to do likewise. The custodianship then remained in the Banu Shayba, witnessed by the historians century after century down to today; Umar assigned it a budget, Mu'awiya regularised its officers, and in later ages eunuch aghas, then paid officials and servants, took over the wider services."
  ur: "سادن کعبہ کے دروازے اور کنجیوں کا نگہبان ہے جو مقررہ اوقات میں زائرین کے لیے دروازہ کھولتا، اور مقام ابراہیم، قیمتی ہدیوں اور اندرونی و بیرونی غلافوں کی دیکھ بھال کرتا ہے؛ حجابہ انجام دینے والا حاجب یا سادن کہلاتا اور حجبی نسبت سے جانا جاتا، جبکہ سِدانہ پورے بیت کی خدمت کا نام ہے۔ یہ منصب جرہم سے خزاعہ، قصیّ اور بنی عبدالدار کے ہاتھوں گزرتا فتح مکہ کے دن عثمان بن طلحہ تک پہنچا: نبی نے دروازہ کھلوایا، باہر آئے تو کنجی عثمان اور ان کے چچا زاد شيبہ بن عثمان کو دی اور فرمایا: اسے قیامت تک تمہارے پاس رہنے دو، تم سے صرف ظالم چھینے گا؛ اور کنجی اپنے کپڑے میں چھپا کر انہیں بھی ایسا کرنے کی تلقین کی۔ پھر حجابت بنی شیبہ میں رہی جسے مؤرخ صدیوں سے آج تک لکھتے ہیں؛ عمر نے اس کا وظیفہ مقرر کیا، معاویہ نے ملازمین منظم کیے، اور بعد میں خدم آغاؤں، پھر تنخواہ دار ملازمین اور خادموں نے وسيع خدمات سنبھالیں۔"
  es: "El sâdin custodiaba la puerta de la Kaaba y sus llaves, y la abría a los visitantes en los horarios establecidos, atendiendo también al Maqam Ibrahim, los valiosos obsequios y las cubiertas interiores y exteriores; al custodio de la hicâbe se le llamaba hâcib o sâdin con el nisba hacebî, mientras que sidâne designaba todo el servicio de la Casa. El cargo pasó de Jurhum a Huza'a, a Qusayy y a los hijos de Abd al-Dar, hasta que, tras la conquista de La Meca, recayó en Uthman ibn Talha: el Profeta mandó abrir la puerta y, al salir, entregó la llave a Uthman y al hijo de su tío, Shayba ibn Uthman, diciéndoles que la conservaran hasta el Día de la Resurrección, afirmando que solo los malhechores se la arrebatarían, escondiendo la llave en su vestimenta para enseñarles a hacer lo mismo. La custodia permaneció entonces en manos de los Banu Shayba, como atestiguan los historiadores siglo tras siglo hasta nuestros días; Umar le asignó un presupuesto, Mu'awiya regularizó a sus funcionarios y, en épocas posteriores, los eunucos aghas, que entonces eran funcionarios y sirvientes asalariados, se hicieron cargo de los servicios más amplios."
  fr: "Le sâdin était responsable de la porte de la Kaaba et de ses clés. Il l'ouvrait aux visiteurs aux heures prescrites et veillait également sur le Maqam Ibrahim, les précieux objets et les couvertures intérieure et extérieure. Le détenteur du hicâbe était appelé hâcib ou sâdin, avec la nisba hacebî, tandis que sidâne désignait l'ensemble du service de la Maison. Cette charge passa de Jurhum à Huza'a, puis à Qusayy et aux fils d'Abd al-Dar, jusqu'à ce qu'à la conquête de La Mecque, elle revienne à Uthman ibn Talha. Le Prophète fit ouvrir la porte et, à sa sortie, remit la clé à Uthman et à Shayba ibn Uthman, fils de son oncle, leur recommandant de la conserver jusqu'au Jour de la Résurrection. Il leur dit que seuls les injustes la leur prendraient et cacha la clé dans ses vêtements pour leur enseigner à faire de même. La garde de la Kaaba resta ensuite entre les mains des Banu Shayba, comme en témoignent les historiens de siècle en siècle jusqu'à nos jours. Umar lui a attribué un budget, Mu'awiya a régularisé ses officiers, et plus tard, les eunuques aghas, puis les fonctionnaires et serviteurs rémunérés, ont pris en charge l'ensemble des services."
  tr: "Kabe'nin bekçisi, kapısının ve anahtarlarının koruyucusudur; ziyaretçiler için belirlenen zamanlarda kapıyı açar. Ayrıca İbrahim Makamı'ndan, değerli hediyelerden ve iç ve dış perdelerden de sorumludur. Bekçilik görevini üstlenen kişiye bekçi veya koruyucu denir ve \"bekçilik\" (veya \"koruyuculuk\") terimiyle ilişkilendirilir. \"Bekçilik\" terimi, Kabe'nin tüm hizmetini ifade eder. Bu görev, Cürhum kabilesinden Huze'ye, sonra Kusayy kabilesine, sonra Beni Abdülder'e geçti ve Mekke'nin fethi gününde Osman ibn Talha'ya geldi. Peygamber, kapının açılmasını emretti, sonra dışarı çıktı ve anahtarı Osman'a ve kuzeni Şeybe ibn Osman'a vererek, \"Kıyamet Günü'ne kadar bunu alın. Bunu sizden ancak bir zalim alabilir.\" dedi. Sonra onu elbisesiyle gizledi ve saklı tutulmasını emretti. Tarihçilerin de belirttiği gibi, bu koruyuculuk görevi Banu Şeybe kabilesi içinde yüzyıllar boyunca, günümüze kadar devam etmiştir. Ömer bu iş için bir ödenek ayırmış ve Muaviye de personeli organize etmiştir. Daha sonra koruyuculuk görevini hadımlar (ağalar) üstlenmiş, ardından da günümüzdeki memurlar ve hizmetliler devralmıştır."
  id: "Penjaga Ka'bah adalah penjaga pintu dan kuncinya, membukanya untuk pengunjung pada waktu yang telah ditentukan. Ia juga bertanggung jawab atas Sakramen Ibrahim, hadiah-hadiah berharga, dan tirai dalam serta luar. Orang yang bertugas sebagai penjaga disebut penjaga atau pelindung, dan dikaitkan dengan istilah \"penjagaan\" (atau \"perwalian\"). Istilah \"penjagaan\" merujuk pada seluruh pelayanan Rumah (Ka'bah). Jabatan ini berpindah dari suku Jurhum ke suku Khuza'ah, kemudian ke suku Qusayy, kemudian ke Bani Abd al-Dar, hingga sampai kepada Utsman bin Talhah pada hari penaklukan Mekah. Nabi memerintahkan pintu dibuka, kemudian keluar dan menyerahkan kunci kepada Utsman dan sepupunya, Syebah bin Utsman, seraya berkata, \"Ambillah sampai Hari Kiamat. Tidak seorang pun akan mengambilnya darimu kecuali seorang tiran.\" Kemudian ia menyembunyikannya dengan pakaiannya, dan memerintahkan agar tetap tersembunyi. Kepemimpinan tersebut berlanjut di dalam Bani Shaybah, sebagaimana telah dibuktikan oleh para sejarawan, dari abad ke abad, hingga saat ini. Umar mengalokasikan tunjangan untuk itu, dan Mu'awiyah mengatur stafnya. Kemudian, kepemimpinan tersebut diambil alih oleh para kasim (agha), dan kemudian oleh para pejabat dan pelayan saat ini."
