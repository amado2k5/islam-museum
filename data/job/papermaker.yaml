summary:
  ar: "الكاغدي هو من يصنع الورق من الألياف المنقوعة المدقوقة، وكانت الصناعة قد انتقلت إلى العالم الإسلامي من الصين عبر آسيا الوسطى. تذكر موسوعة TDV أن أول مصنع في الشرق الأدنى فُتح في بغداد سنة 178هـ، وأن أنواعاً من الورق عُرفت بأسماء العمال والأمراء، ثم قامت مصانع في الشام ومصر والأندلس. أما العثمانيون فاستوردوا الورق زمناً طويلاً، وأول مصنع مؤكد عندهم يعود إلى القرن الثامن عشر."
  en: "The kaghadi made paper from soaked and beaten fibres, a craft that reached the Islamic world from China by way of Central Asia. The TDV encyclopaedia says the first mill in the Near East opened in Baghdad in 178 AH, that kinds of paper were named after officials and princes, and that mills followed in Syria, Egypt and al-Andalus. The Ottomans imported paper for a long time, and their first confirmed mill dates from the eighteenth century."
  ur: "کاغذ ساز بھیگے ہوئے اور کوٹے ہوئے ریشوں سے کاغذ بناتا تھا، اور یہ ہنر چین سے وسطی ایشیا کے راستے اسلامی دنیا میں پہنچا۔ ٹی ڈی وی کا مدخل کہتا ہے کہ مشرقِ قریب کا پہلا کارخانہ بغداد میں 178ھ میں کھلا، کاغذ کی قسمیں اہلکاروں اور شہزادوں کے نام پر معروف ہوئیں، اور شام، مصر اور اندلس میں کارخانے بنے۔ عثمانی بہت دیر تک کاغذ درآمد کرتے رہے، اور ان کا پہلا یقینی کارخانہ اٹھارھویں صدی کا ہے۔"
