craft:
  materials: [paper, textile, ink]
  techniques:
    ar: "تُنقع الخِرَق والحبال في ماء الجير زمناً طويلاً، ثم تُدقّ في هاون حجري بمدقات خشبية، ثم صارت تُطحن بحجر ثقيل يديره الماء كما تدور الطاحونة. وبعد ذلك يُهيأ سطح الورقة بالنشا أو بياض البيض أو الشب أو غراء السمك، ثم يُصقل بحجر الصوان أو الزجاج."
    en: "Rags and rope were soaked for a long time in limewater and beaten in a stone mortar with wooden pestles. Later a heavy stone turned by water, like a flour mill, did the beating. The sheet was then coated with starch, egg white, alum or fish glue, and burnished with flint or glass."
    ur: "چیتھڑے اور رسیاں دیر تک چونے کے پانی میں بھگوئی جاتیں اور پتھر کے کھرل میں لکڑی کے موسلوں سے کوٹی جاتیں۔ بعد میں پانی سے چلنے والا بھاری پتھر، آٹا پیسنے کی چکی کی طرح، یہ کام کرنے لگا۔ پھر ورق پر نشاستہ، انڈے کی سفیدی، پھٹکری یا مچھلی کا گوند لگایا جاتا اور چقماق یا شیشے سے چمکایا جاتا۔"
