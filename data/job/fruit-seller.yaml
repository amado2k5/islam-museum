summary:
  ar: "الفاكهجي بائع الفاكهة في دكانه وسوقه، وحرفته عند الشيزري أن يُباع الغلّ مغسولاً من السرقين خالياً من الحشائش والبقول، وأن تُقطَع أصول الخسّ والفجل، وألا تُغسَل البصلة والثومة الطريان لأن الماء يزيد حدّتهما ونتنهما، وألا يُخلَط بائت الدكان بطريّ النهار، وأن يُمنَع بيع البطيخ والخيار والتين الدودي وكل شديد النضج قد انشقّت قشرته. وفي موكب إسطنبول عدّ إوليا تجّار الفاكهة ⁦(يَمِشجيان)⁩ ثلاثة آلاف رجل بألفٍ وسبع دكاكين بيرهم بير البقّالين عازي ابن النباضي، يمرّون على عربات مزدانة بأنواع الفاكهة ويحملون أشجاراً مصنوعة من التفاح والمشمش على الأعمدة يحمل كل منها ثمانية أو عشرة، وكواشك نوافيرها جارية أطرافها مهدّلة بالفاكهة يقعد فيها الغلمان يفاوضون المتفرجين ويرمون إليهم الفاكهة، وبعضهم يلبس أثواباً من الكستناء ويمسك سبحاً من البرتقال والتفاح، ويصنعون سفناً من الفاكهة تجرّ كل واحدة منها ألف رجل مساميرها وصواريها وقعرها ومقدّمتها مزيّنة بنوى الثمار، فيحتشد التجار لدخولها وملء سلالهم بضجيج وخصومة تحاكي ضجيج المرفأ عند وصول كل سفينة فاكهة."
  en: "The fakihji sold fruit from shop and market, and al-Shayzari's rules for the greengrocers bind him to sell produce washed of manure and free of grass and weeds, the roots cut off the lettuces and radishes, fresh onions and garlic never washed because water increases their pungency and smell, nothing kept overnight mixed with the day's picking, and no worm-eaten melon, cucumber or fresh fig sold nor anything so over-ripe its skin has split. In Evliya's Istanbul procession the fruit-merchants (Yemishjian) were three thousand men with a thousand and seven shops, their patron the same as the grocers', Azi Ibn-en-nebadi; they passed on wagons adorned with all kinds of fruits, carrying artificial trees of apples and apricots on poles, each borne by eight or ten men, and koshks with playing fountains festooned on four sides with fruit, in which their boys sat bargaining with the spectators and throwing fruits to them; some wore robes made of chestnuts and held rosaries of oranges and apples, and they built artificial ships full of fruits, each towed by a thousand men, their nails, masts, head and stern ornamented with fruit-kernels — merchants crowding aboard to fill their baskets with a noise and quarrelling that faithfully represented the port's uproar at every fruit-ship's arrival, at which the emperor delighted and laughed."
  ur: "فاکہجی دکان اور بازار میں پھل بیچنے والا ہے، اور شیزری کے خضرفروشوں کے اصول اس پر بھی لاگو ہیں کہ پیداوار کھاد سے دھوئی ہوئی اور گھاس پھوس سے پاک ہو، سالاد اور مولیوں کی جڑیں کٹی ہوں، تازہ پیاز اور لہسن نہ دھوئے جائیں کہ پانی ان کی تیزی اور بو بڑھا دیتا ہے، رات کا بچا مال دن کے تازہ میں نہ ملے، اور کیڑے لگا تربوز، کھیرا یا تازہ انجیر اور اتنا پکا پھل جس کا چھلکا پھٹ گیا ہو فروخت نہ ہو۔ اولیاء کے استنبول کے جلوس میں پھل فروش ⁦(یمیشجیان)⁩ تین ہزار آدمی ایک ہزار سات دکانیں تھے، ان کا پیر وہی ہے جو بقّالوں کا: عازی ابن النباضی؛ وہ ہر قسم کے پھلوں سے سجی گاڑیوں پر نکلتے، بانسوں پر سیب اور خوبانی کے مصنوعی درخت اٹھائے جو ہر ایک کو آٹھ دس آدمی اٹھاتے، اور ایسے کوشک جن میں بہتے فوارے اور چاروں طرف لٹکے پھل، جن میں لڑکے بیٹھ دیکھنے والوں سے سودا کرتے اور ان پر پھل پھینکتے؛ کچھ اخروٹ شاہ بلوط کے لباس اور سنٹروں اور سیبوں کی تصبیحیں لیے؛ اور پھلوں سے بھرے مصنوعی جہاز بناتے جن میں سے ہر ایک کو ہزار آدمی گھسیٹتے، ان کی کیلیں، مستول، دم اور اگلا سرا پھلوں کے گٹھلیوں سے آراستہ — سوداگر بھیڑ لگا کر ان میں چڑھ کر اپنی ٹوکریاں بھریں، اور شور و جھگڑا بندرگاہ پر پھل کے جہاز کے اترنے کا اصل نقشہ پیش کرتا جس پر بادشاہ خوش ہو کر ہنستا۔"
  es: "El fakihji vendía fruta de la tienda y del mercado, y las reglas de al-Shayzari para los verduleros lo obligaban a vender productos lavados de estiércol y libres de hierba y maleza, las raíces de las lechugas y los rábanos cortadas, las cebollas y el ajo frescos nunca lavados porque el agua aumenta su picor y olor, nada guardado durante la noche mezclado con la cosecha del día, y ningún melón, pepino o higo fresco comido por gusanos, ni nada tan maduro que su piel se haya abierto. En la procesión de Estambul de Evliya, los fruteros (Yemishjian) eran tres mil hombres con mil siete tiendas, su patrón era el mismo que el de los verduleros, Azi Ibn-en-nebadi; Pasaban en carros adornados con toda clase de frutas, que llevaban árboles artificiales de manzanas y albaricoques sobre postes, cada uno cargado por ocho o diez hombres, y koshks con fuentes de agua adornadas por los cuatro costados con fruta, en las que sus muchachos se sentaban a negociar con los espectadores y arrojándoles frutas; algunos vestían túnicas hechas de castañas y sostenían rosarios de naranjas y manzanas, y construían barcos artificiales llenos de fruta, cada uno remolcado por mil hombres, con clavos, mástiles, proa y popa adornados con semillas de fruta; los mercaderes se agolpaban a bordo para llenar sus cestas con un ruido y riñas que representaban fielmente el alboroto del puerto a la llegada de cada barco frutero, ante lo cual el emperador se deleitaba y reía."
  fr: "Le fakihji vendait des fruits provenant de sa boutique et du marché, et les règles d'al-Shayzari pour les marchands de fruits et légumes l'obligeaient à vendre des produits lavés du fumier et exempts d'herbes et de mauvaises herbes: les racines des laitues et des radis étaient coupées, les oignons et l'ail frais n'étaient jamais lavés car l'eau augmentait leur piquant et leur odeur, rien n'était mélangé à la récolte du jour, et aucun melon, concombre ou figue fraîche véreux n'était vendu, ni aucun fruit trop mûr dont la peau était fendue. Dans le cortège d'Evliya à Istanbul, les marchands de fruits (Yemishjian) étaient trois mille hommes avec mille sept boutiques, leur protecteur étant le même que celui des épiciers, Azi Ibn-en-nebadi; ils passaient sur des chariots ornés de toutes sortes de fruits, portant des arbres artificiels de pommiers et d'abricotiers sur des poteaux, chacun porté par huit ou dix hommes, et des koshks avec des fontaines ornées de fruits sur quatre côtés, où leurs garçons étaient assis à marchander avec les spectateurs et à leur jeter des fruits; Certains portaient des robes de châtaignes et tenaient des chapelets d'oranges et de pommes; ils construisaient des navires artificiels remplis de fruits, chacun remorqué par mille hommes, leurs clous, leurs mâts, leur proue et leur poupe ornés de noyaux de fruits — les marchands se pressant à bord pour remplir leurs paniers dans un bruit et des querelles qui représentaient fidèlement le tumulte du port à l'arrivée de chaque navire fruitier, ce qui ravissait et faisait rire l'empereur."
