  techniques:
    ar: "يضبط الشيزري بيع الخضار والفاكهة: يؤمر الباعة أن يبيعوا غلالهم مغسولة من السرقين خالية من الحشائش والبقول، وتُقطَع أصول الخسّ والفجل، ويُنهَوا عن غسل البصل والثوم الطري لأن الماء يزيد حدّتهما ونتنهما، وما بات في الدكاكين لا يُخلَط بما قُطف في النهار، ويُمنَع بيع البطيخ والخيار والتين الدودي وما اشتدّ نضجه حتى انشقّت قشرته. ويصف إوليا عرض الطائفة في الموكب: أشجار تفاح ومشمش مصنوعة على أعمدة، وكواشك بناوافير جارية مهدّلة الأطراف بالفاكهة يفاوض منها الغلمان المتفرجين ويرمون الفاكهة، وسبح برتقال وتفاح وأثواب كستناء، وسفن فاكهة تجرّها ألف رجل مساميرها وصواريها من النوى، وتجار البطيخ ⁦(مناويان)⁩ ثلاثة آلاف بثلاثمئة دكان يبيعون عند المراسي أكواماً من البطيخ والقاوون ستة أشهر في السنة وينادون «ثلاث أوقيات بأقجة واحدة»."
    en: "Al-Shayzari polices the sale of vegetables and fruit: the sellers must offer their produce washed of manure and free of grass and weeds; the roots of lettuces and radishes are cut off; fresh onions and garlic are not washed, water increasing their pungency and offensive smell; what remains overnight in the shops is not mixed with the day's picking; and worm-eaten melons, cucumbers and fresh figs are barred, as is anything so over-ripe that its skin has split. Evliya describes the guild's display in procession: artificial trees of apples and apricots carried on poles, koshks with playing fountains festooned with fruit where boys bargain with the spectators and throw fruit to them, rosaries of oranges and apples and robes of chestnuts, and fruit-ships towed by a thousand men with masts and nails of kernels; the water-melon merchants (Menawian), three thousand men in three hundred shops, sold heaps of melons and water-melons at the landing-places for six months of the year, crying 'Three occas for one asper.'"
    ur: "شیزری سبزی اور پھل کی فروخت ضبط کرتا ہے: بیچنے والے پیداوار کھاد سے دھوئی اور گھاس پھوس سے پاک پیش کریں؛ سالاد اور مولیوں کی جڑیں کاٹی جائیں؛ تازہ پیاز اور لہسن نہ دھوئے جائیں کہ پانی ان کی تیزی اور بو بڑھا دیتا ہے؛ رات کا بچا مال دن کے تازہ میں نہ ملے؛ کیڑے لگے تربوز، کھیرے اور تازہ انجیر ممنوع اور اتنا پکا پھل جس کا چھلکا پھٹ گیا ہو بھی۔ اولیاء جلوس میں انجمن کی نمائش بیان کرتا ہے: بانسوں پر سیب اور خوبانی کے مصنوعی درخت، بہتے فواروں والے اور پھلوں سے لٹکتے کوشک جن میں لڑکے تماشائیوں سے سودا کرتے اور پھل پھینکتے، سنٹروں اور سیبوں کی تصبیحیں اور شاہ بلوط کے لباس، اور ہزار آدمی کے گھسیٹے پھلوں کے جہاز جن کے مستول اور کیلیں گٹھلیوں کی؛ تربوز فروش ⁦(مناویان)⁩ تین ہزار آدمی تین سو دکانیں گھاٹوں پر تربوزوں اور خربوزوں کے ڈھیر سال کے چھ مہینے بیچتے اور پکارتے «تین اوقے ایک آقچہ میں۔»"
