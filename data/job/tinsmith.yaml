summary:
  ar: "الصَّمْكَرِيّ مُقلِّع أواني النحاس، يكسو باطنها بالقصدير حتى تصلح للطعام والشراب. يوجب ابن الأخوة على النحّاسين أن يُعلِموا المشتري إن كان في الآنية مكانٌ مُلحَم، فإن كانت مقلَّعة كُتب عليها «عتيقة ملحومة» بقلم غليظ ليتبيّنه المشتري، وعلى صاحب شراب الشعير أن يجدّد تقليع آنيته كل ثلاثة أشهر. وفي إسطنبول عدّ إوليا القلعجية ⁦(صمّاك النحاس)⁩ خمسمئة رجل بمئة وستة دكاكين بيرهم ساريا الذي قلّده عليّ وكانت له واقعة نداء عمر من المدينة يوم الناهواند وقبره بالقاهرة، يمرّون بمطارق التركيع والتمليس والبسط ويضعون جذعاً في وسط الطريق تضرب عليه من أربعة عشر إلى ستة عشر رجلاً بكل قوتهم، وقد اخضرّت لحى شيوخهم واصفرّت من رطوبة النحاس؛ ومعهم صائغو القصدير ⁦(كلعجي)⁩ مئة رجل كلّهم يهود. ويصف لين بيوت القاهرة: منقد النحاس المقلّع الملآن جمراً، والطشت والإبريق المقلّعين، وصينية السُّفرة المقلّعة، وأطباق النحاس المقلّع، وفانوس القماش الشمعي رأسه وقاعدته من نحاس مقلّع."
  en: "The samkari tinned copper vessels, coating their insides with tin so that food and drink may be served from them. Ibn al-Ukhuwwa obliges the coppersmiths to inform the customer when an article of copper contains solder, and if it is tinned they must write 'old, soldered' on it with a thick pen so that the purchaser clearly realises it; and he compels the barley-water maker to renew the tinning of his vessels every three months. In Evliya's Istanbul the tinners (Kalaijian) were five hundred men in a hundred and six shops, their patron Sari, girded by Ali, whom Omar's cry from Medina reached on the day of Nahavand and whose tomb is at Cairo; they passed with all kinds of hammers for turning, cleansing and stretching, setting a large trunk in the middle of the road on which fourteen to sixteen men hammered with all their force, the seniors' beards turned green and sulphur-coloured by the damp of the brass; with them walked the tin-melters (Kalaiji), a hundred men, all Jews. Lane shows the Cairo house dressed in their work: the tinned-copper brazier full of burning charcoal, the tinned ewer and basin, the round tinned tray of the sofra, the tinned dishes, and the folding lantern of waxed cloth whose top and bottom are tinned copper."
  ur: "صمكری تانبے کے برتنوں کو اندر سے قلعی چڑھاتا ہے تاکہ کھانا اور مشروب ان میں پیش ہو سکے۔ ابن الاخوہ نحاسوں پر لازم کرتا ہے کہ خریدار کو بتائیں اگر تانبے کے برتن میں جوڑ ہو، اور اگر وہ قلعی شدہ ہو تو اس پر موٹے قلم سے «پرانا، جڑا ہوا» لکھیں تاکہ خریدار صاف جان لے؛ اور جو آبِ جو بنانے والے ہیں ان کے برتنوں کی قلعی ہر تین مہینے میں نئی کی جائے۔ اولیاء کے استنبول میں قلعی گر ⁦(کلعجیان)⁩ پانچ سو آدمی ایک سو چھ دکانیں تھے، ان کا پیر ساریا ہے جسے علی نے کمر بند پہنائی اور نہاوند کے روز مدینہ سے عمر کی آواز اسے پہنچی اور قاہرہ میں مدفون ہے؛ وہ ترکیب، صفائی اور تاننے کے ہتھوڑے لے کر چلتے اور راستے میں بڑا تنا رکھ کر چودہ سے سولہ آدمی پوری قوت سے ہتھوڑا چلاتے، اور بزرگوں کی داڑھیاں تانبے کی نمی سے سبز اور گندھکی رنگ ہو گئیں؛ ان کے ساتھ قلعی پگھلانے والے ⁦(کلعجی)⁩ سو آدمی سب یہود۔ لین قاہرہ کے گھر ان ہی کے کام سے سجا دکھاتا ہے: قلعی شدہ تانبے کی منقل جس میں جلتا کوئلہ، قلعی شدہ طشت اور لوٹا، سفرہ کی گول قلعی شدہ تھالی، قلعی شدہ تانبے کی پہلیں، اور موم شدہ کپڑے کا فولڈنگ فانوس جس کے اوپر نیچے قلعی شدہ تانبہ ہے۔"
  es: "Los samkari estañaban los recipientes de cobre, recubriendo sus interiores con estaño para que se pudiera servir comida y bebida en ellos. Ibn al-Ukhuwwa obliga a los caldereros a informar al cliente cuando un artículo de cobre contiene soldadura, y si está estañado deben escribir \"viejo, soldado\" en él con una pluma gruesa para que el comprador lo entienda claramente; y obliga al fabricante de agua de cebada a renovar el estañado de sus recipientes cada tres meses. En el Estambul de Evliya, los estañadores (Kalaijian) eran quinientos hombres en ciento seis talleres, su patrón Sari, ceñido por Ali, a quien llegó el grito de Omar desde Medina el día de Nahavand y cuya tumba está en El Cairo; pasaban con todo tipo de martillos para girar, limpiar y estirar, colocando un gran tronco en medio del camino sobre el cual catorce a dieciséis hombres martillaban con todas sus fuerzas, las barbas de los ancianos se volvían verdes y color azufre por la humedad del latón; Con ellos caminaban los fundidores de estaño (Kalaiji), un centenar de hombres, todos judíos. Lane muestra la casa de El Cairo decorada con los productos de su trabajo: el brasero de cobre estañado lleno de carbón encendido, la jarra y el lavabo estañados, la bandeja redonda estañada del sofra, los platos estañados y la linterna plegable de tela encerada cuya parte superior e inferior son de cobre estañado."
