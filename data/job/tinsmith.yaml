  techniques:
    ar: "يضبط ابن الأخوة والشيزري سوق النحّاسين: يُمنع خلط النحاس بمعدن «الحَبَق» الذي يستخرجه الصيّاغ وصاهرو الفضة في صهرهم لأنه يُصلِّب النحاس ويُنقص لينه، فإن صُنعت منه قدحٌ أو هاون انكسر بسهولة كالزجاج؛ ولا يُخلَط كسر آنية النحاس القديمة بالنحاس الجديد بل يُصهر كلٌّ على حدة ويُعمل على حدة؛ ومن باع قطعة نحاس فيها مكان ملحوم فإن كانت مقلّعة كتب عليها «عتيقة ملحومة» بقلم غليظ ليتبيّنه المشتري؛ ولا يُزاد في الرصاص على النحاس في الصهر فإن الهاون أو الطست المصنوع منه إذا وقع انكسر كالزجاج؛ وتُصنَع الأواني المسبوكة مصمتة لئلا يصيبها الضرر إن وقعت، وللأطباق والصحاف أوزان مقرّرة. وعلى صاحب شراب الشعير أن يغسل أوانيه كل يوم وأن يجدّد تقليعها كل ثلاثة أشهر."
    en: "Ibn al-Ukhuwwa and al-Shayzari police the coppersmiths' market: copper must not be mixed with the habag that the goldsmiths and silver-smelters draw off in smelting, for it hardens the copper and makes it less malleable, so that a drinking vessel or mortar moulded from it breaks easily like glass; broken old copper containers must not be mixed with unused copper, each being smelted and worked separately; whoever sells an article of copper containing solder must, if it is tinned, write 'old, soldered' on it with a thick pen so the purchaser clearly realises it; overmuch lead must not be added to the copper for smelting, for a mortar or bowl made of it breaks like glass if it falls; cast bowls must be made solid so that a fall does them no damage, and the bowls and trays have settled weights. The barley-water maker must wash his vessels every day and renew their tinning every three months."
    ur: "ابن الاخوہ اور شیزری نحاسوں کے بازار کو ضبط کرتے ہیں: تانبے میں وہ مادہ «حبق» نہ ملایا جائے جو زرگر اور چاندی پگھلانے والے پگھلانے پر نکالتے ہیں کہ وہ تانبہ سخت اور بے لچک کر دیتا ہے اور اس سے بنا پیالہ یا اوکھلی شیشے کی طرح ٹوٹ جاتی ہے؛ پرانے ٹوٹے تانبے کے برتن نئے تانبے میں نہ ملیں بلکہ ہر ایک الگ پگھلے اور الگ بنے؛ جو تانبے کا جڑا ہوا برتن بیچے اور وہ قلعی شدہ ہو تو اس پر موٹے قلم سے «پرانا، جڑا ہوا» لکھے تاکہ خریدار صاف جان لے؛ پگھلانے میں سیسہ بہت زیادہ نہ ملے کہ اس کا ہاون یا طست گر کر شیشے کی مانند ٹوٹ جائے؛ ڈھلائی برتن مضبوط بنائے جائیں کہ گرنے سے ضرر نہ پہنچیں، اور پیالوں اور تھالیوں کے اوزان مقرر ہیں۔ آبِ جو بنانے والے کو حکم ہے کہ برتن روز دھوئے اور ان کی قلعی ہر تین مہینے میں نئی کرے۔"
