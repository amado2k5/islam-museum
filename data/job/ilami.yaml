summary:
  ar: "الإعلامي العامل في وسيلة إعلام عامة — إذاعة وتلفاز وفضائية ثم منصة — مذيعاً أو مقدّماً أو محرراً أو مراسلاً؛ وجمعُه عند أهل الاختصاص «الإعلاميون». نقلت المهنة صوت المنادي والخطيب إلى ملايين المسامع دفعة واحدة: بدأت إذاعات العالم الإسلامي الحكومية في الثلاثينات ⁦(إذاعة القاهرة ١٩٣٤)⁩، ثم جاء التلفاز في الخمسينات والستينات، فالفضائيات العربية من التسعينات، فصار الواعظ والمقرئ والمذيع والمعلّق والمراسل وجوهاً وأسماعاً عامة، تُقاس مهارتهم بالمصداقية والحضور وإتقان اللغة، وتجمع على المهنة نقابات ومعاهد تدريب."
  en: "The ilami works in a public medium — radio, television, satellite channels and now platforms — as announcer, presenter, editor or correspondent; specialists call the collective 'the media people' (al-i'lamiyyun). The trade carried the voice of crier and preacher to millions of hearers at once: state radios of the Islamic world began in the 1930s (Cairo radio 1934), television came in the 1950s–60s, then Arab satellite channels from the 1990s, making the preacher, reciter, announcer, commentator and correspondent public voices whose skill is measured by credibility, presence and command of the language, organised in syndicates and training institutes."
  ur: "میڈیا کارکن کسی عوامی ذریعہ ابلاغ — ریڈیو، ٹیلی ویژن، سیٹلائٹ چینل اور اب پلیٹ فارم — میں مذیع، پیش کنندہ، مدیر یا نمائندہ ہوتا ہے؛ اہلِ فن انھیں «اعلامیوں» کہتے ہیں۔ اس پیشے نے منادی اور خطیب کی آواز ایک ساتھ لاکھوں سامعین تک پہنچائی: اسلامی دنیا میں سرکاری ریڈیو تیس کی دہائی میں ⁦(قاہرہ 1934)⁩، ٹیلی ویژن پچاس ساٹھ میں، پھر نوے کی دہائی سے عرب سیٹلائٹ چینل — اور مبلغ، قاری، مذیع، مبصر اور نمائندہ عوامی آواز بن گئے جن کی مہارت ساکھ، حضور اور زبان پر محیط ہے، اور جن کا انجمن اور تربیتی ادارے ہیں۔"
  es: "El ilami trabaja en un medio público —radio, televisión, canales vía satélite y ahora plataformas— como locutor, presentador, editor o corresponsal; los especialistas llaman al colectivo \"la gente de los medios\" (al-i'lamiyyun). Este oficio llevó la voz del pregonero y del predicador a millones de oyentes a la vez: las radios estatales del mundo islámico surgieron en la década de 1930 (Radio de El Cairo en 1934), la televisión llegó en las décadas de 1950 y 1960, y luego los canales vía satélite árabes a partir de la década de 1990, convirtiendo al predicador, recitador, locutor, comentarista y corresponsal en voces públicas cuya habilidad se mide por la credibilidad, la presencia y el dominio del idioma, organizados en sindicatos e institutos de formación."
  fr: "L'ilami travaille dans les médias publics – radio, télévision, chaînes satellitaires et désormais plateformes – en tant qu'annonceur, présentateur, rédacteur ou correspondant; les spécialistes désignent ce collectif comme « les gens des médias » (al-i'lamiyyun). Ce métier a permis de diffuser la voix du prédicateur et du crieur public auprès de millions d'auditeurs: les radios d'État du monde islamique ont vu le jour dans les années 1930 (Radio du Caire en 1934), la télévision est apparue dans les années 1950-1960, puis les chaînes satellitaires arabes à partir des années 1990, faisant du prédicateur, du récitant, de l'annonceur, du commentateur et du correspondant des voix publiques dont le talent se mesure à la crédibilité, à la présence et à la maîtrise de la langue, au sein de syndicats et d'instituts de formation."
  tr: "Kamu medya kuruluşlarında (radyo, televizyon, uydu kanalı ve daha sonra platformlar) çalışan bir medya profesyoneli, spiker, sunucu, editör veya muhabirdir; uzmanlara göre bunların çoğulu ise \"medya profesyonelleri\"dir. Bu meslek, arayan kişinin ve vaizin sesini milyonlarca kulağa aynı anda ulaştırdı: İslam dünyasının devlet radyoları 1930'larda (Kahire Radyosu 1934) başladı, ardından 1950'ler ve 1960'larda televizyon geldi ve 1990'lardan itibaren Arap uydu kanalları ortaya çıktı; böylece vaiz, okuyucu, spiker, yorumcu ve muhabir, güvenilirlik, varlık ve dil hakimiyetiyle ölçülen becerileriyle kamuoyunun tanıdığı yüzler ve kulaklar haline geldi ve meslek sendikalar ve eğitim kurumları tarafından yönetiliyor."
  id: "Seorang profesional media yang bekerja di media publik—radio, televisi, saluran satelit, dan kemudian platform—adalah penyiar, presenter, editor, atau reporter; dan bentuk jamaknya, menurut para ahli, adalah \"profesional media.\" Profesi ini membawa suara penceramah dan pengkhotbah ke jutaan telinga sekaligus: stasiun radio milik negara di dunia Islam dimulai pada tahun 1930-an (Radio Kairo 1934), kemudian televisi muncul pada tahun 1950-an dan 1960-an, dan kemudian saluran satelit Arab dari tahun 1990-an, sehingga pengkhotbah, pembaca Al-Quran, penyiar, komentator, dan reporter menjadi wajah dan telinga publik, yang keahliannya diukur dari kredibilitas, kehadiran, dan penguasaan bahasa, dan profesi ini diatur oleh serikat pekerja dan lembaga pelatihan."
