label: { ar: "المجلّد", en: "Bookbinder (mujallid)", ur: "جلد ساز ⁦(مجلّد)⁩", es: "Encuadernador (mujallid)", fr: "Relieur (mujallid)", tr: "Hacim", id: "Volume" }
