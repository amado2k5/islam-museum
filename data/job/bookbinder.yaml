  - { value: "Mujellidan", kind: latinized, lang: tr }
  - { value: "mücellit", kind: alternate, lang: tr }
summary:
  ar: "المجلّد هو من يجمع الكراريس ويشدّها بالغراء ويكسوها الألواح والجلد المزخرف. يذكر غرومان أن الجلاد صناعتهم في اليمن كانت مزدهرة حتى إن زبيداً عُرفت بجلدها الأحمر وصنعاء بعدة دبّاغات، وأن المقدسي الجغرافي المجلّد نفسه فُتن بصنعته هناك حتى أخذ على أجمل مجلداته دينارين عن المصحف الواحد، وأن كراريس اليمن كانت تُلصق بنشا القمح. وأحصى الفهرستُ أسماء مجلدين في بغداد المأمون، وفي تركيا قامت للمجلّدين طائفة معترف بها يُقال إنها أُسست في عهد بايزيد الثاني، ومرّت في موكب إوليا بأربعمئة رجل ومئة دكان."
  en: "The mujallid gathered the quires, glued them and cased the book in boards and decorated leather. Grohmann records how the South Arabian leather industry fed the craft — Zabid's red kid, San'a's tanneries, Ta'if's Cordovan and its praised bindings — and that the geographer al-Muqaddasi, himself a bookbinder, received as much as two dinars for a fine Qur'an binding on his Yemen journey, the quires being glued there with wheat-starch rather than the asphodel paste of Palestine. Ibn al-Nadim's Fihrist names bookbinders who worked in al-Ma'mun's library. In Turkey the bookbinders formed a recognised guild said to have been established under Bayezid II, and in Evliya's procession the Mujellidan pass four hundred men with a hundred shops."
  ur: "مجلّد جلدے جوڑ کر گلو سے باندھتا اور کتاب کو تختوں اور نقش دار چمڑے میں ملبوس کرتا تھا۔ گروہمان بتاتا ہے کہ جنوبی عرب کی چمڑے کی صنعت نے اس ہنر کو پرورش دی — زبید کا سرخ چمڑا، صنعا کی دباغ خانے، طائف کی قرطبی چمڑی اور اس کی معروف جلدیں — اور جغرافیہ دان المقدسی، جو خود مجلّد تھا، اپنے یمن کے سفر میں ایک نفیس جلد پر دو دینار تک پایا، وہاں جلدے گندم کے نشاستے سے جوڑی جاتی تھیں نہ کہ فلسطین کے شیرمردار ⁦(اسفوڈل)⁩ گوند سے۔ ابن الندیم کے فہرست میں مأمون کی لائبریری کے مجلدوں کے نام ہیں۔ ترکی میں جلد سازوں کی تسلیم شدہ انجمن تھی جسے بایزید ثانی کے عہد میں قائم کہا جاتا ہے، اور اولیہ کے جلوس میں مجلّدان چار سو آدمی اور سو دکانوں کے ساتھ گزرے۔"
  es: "El mujallid recogía los cuadernillos, los pegaba y encuadernaba el libro con tapas y cuero decorado. Grohmann relata cómo la industria del cuero del sur de Arabia alimentaba el oficio —el cabrito rojo de Zabid, las curtidurías de Saná, el cordobán de Taif y sus aclamadas encuadernaciones— y que el geógrafo al-Muqaddasi, él mismo encuadernador, recibió hasta dos dinares por una fina encuadernación del Corán durante su viaje a Yemen, donde los cuadernillos se pegaban con almidón de trigo en lugar de la pasta de asfódelo de Palestina. El Fihrist de Ibn al-Nadim menciona a encuadernadores que trabajaban en la biblioteca de al-Ma'mun. En Turquía, los encuadernadores formaron un gremio reconocido que se dice que se estableció bajo Bayezid II, y en la procesión de Evliya, los Mujellidan desfilan cuatrocientos hombres con cien talleres."
  fr: "Le mujallid rassemblait les cahiers, les collait et reliait le livre entre des cartons et du cuir orné. Grohmann rapporte comment l'industrie du cuir d'Arabie du Sud a alimenté cet artisanat: le chevreau rouge de Zabid, les tanneries de Sanaa, le cuir de Cordoue de Taïf et ses reliures réputées. Il raconte également que le géographe al-Muqaddasi, lui-même relieur, reçut jusqu'à deux dinars pour une belle reliure de Coran lors de son voyage au Yémen, les cahiers y étant collés avec de l'amidon de blé plutôt qu'avec la pâte d'asphodèle de Palestine. Le Fihrist d'Ibn al-Nadim mentionne des relieurs ayant travaillé dans la bibliothèque d'al-Ma'mun. En Turquie, les relieurs formèrent une guilde reconnue, dont la création remonterait à Bayezid II. Lors du défilé d'Evliya, on compte quatre cents hommes et une centaine d'ateliers de mujellid."
  tr: "Kitap ciltçisi, katipleri bir araya getiren, onları tutkalla ciltleyen ve tahtalarla ve süslü deriyle kaplayan kişidir. Grouman, Yemen'de kitap ciltçiliği mesleğinin o kadar geliştiğini, Zabid'in kırmızı derisiyle ve Sana'a'nın çok sayıda tabakhanesiyle tanındığını belirtir. Ayrıca coğrafyacı ve kitap ciltçisi el-Mukaddesi'nin orada bu zanaata o kadar hayran kaldığını, en güzel Kur'an ciltlerinin her biri için iki dinar aldığını ve Yemen'deki katiplerin buğday nişastasıyla ciltlendiğini kaydeder. Fihrist, el-Ma'mun'un Bağdat'ında iki kitap ciltçisinin adını listeler ve Türkiye'de, Bayezid II döneminde kurulduğu söylenen ve dört yüz adam ve yüz dükkânla kraliyet alayından geçen tanınmış bir kitap ciltçileri loncası kurulduğunu belirtir."
  id: "Penjilid buku adalah orang yang menyusun naskah-naskah, mengikatnya dengan lem, dan menutupinya dengan papan dan kulit yang dihias. Grouman menyebutkan bahwa perdagangan penjilidan buku berkembang pesat di Yaman, hingga Zabid terkenal dengan kulit merahnya dan Sana'a dengan banyaknya penyamakan kulit. Ia juga mencatat bahwa ahli geografi dan penjilid buku al-Muqaddasi sendiri begitu terpikat oleh kerajinan di sana sehingga ia mematok harga dua dinar untuk setiap jilid Al-Qur'an terbaiknya, dan bahwa naskah-naskah di Yaman diikat dengan pati gandum. Fihrist mencantumkan nama dua penjilid buku di Baghdad pada masa pemerintahan al-Ma'mun, dan di Turki, sebuah perkumpulan penjilid buku yang diakui didirikan, yang konon didirikan pada masa pemerintahan Bayezid II, dan yang melewati prosesi kerajaan dengan empat ratus orang dan seratus toko."
