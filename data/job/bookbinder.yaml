  techniques:
    ar: "يصف غرومان حرفة المجلّد من مادتها الأولى: جلود اليمن والطائف والمغرب، وألواح خشب الأرز أو لبابة البردي في مصر، ونشا القمح في اليمن مقابل غراء الأسفودل في فلسطين. وعند ابن النديم أسماء مجلدين من عصر المأمون لم يبقَ لهم عمل، لكن أغلفة نادرة بقيت: غلاف خشب أرز بفسيفساء عاج وعظم وأخشاب ملونة في متحف برلين، وأغلفة مصاحف المملوكية، ثم أغلفة العصر المغولي في إيران ذات البساطة الهندسية الشديدة من غير ذهب، ثم الجلد المثقوب فوق أرضية زرقاء مذهّبة في بغداد سنة 1407، وأغلفة التيموريين المنقوشة بالذهب حتى حُسب على أحد أغلفة سنة 838هـ خمسمئة وخمسون ألف ضربة نقش احتاجت سنتين أو ثلاثاً، وألواح الورق المفرّغ منتصف القرن السادس عشر، ثم الأغلفة المطلية على الورق المقوى المجصّص حتى عمل الحاج محمد تقي في 1270هـ ⁦(1854م)⁩. وفي إسطنبول مرّ المجلّدان أربعمئة رجل بمئة دكان، ومرّ المذهّبون يذهّبون المصاحف والكتب في دكاكينهم."
    en: "Grohmann traces the binder's craft from its raw material: the leathers of Yemen, Ta'if and the Maghreb, boards of cedar wood or of papyrus pulp in Egypt, wheat-starch paste in Yemen where Palestine used asphodel. Ibn al-Nadim names binders of al-Ma'mun's age whose work is lost, but rare covers survive: a cedar-wood cover inlaid with a mosaic of ivory, bone and coloured woods in the Berlin museum; the splendid Mamluk Qur'an bindings; the austere, goldless geometric covers made for Mongol princes of Persia; the perforated leather laid over blue and gold that appears at Baghdad in 1407; the Timurid tooled-gold covers on which one binding of 838 AH (1434) was calculated to carry some 550,000 impressions of the binder's tool, a work of two or three years; the panels of paper cut into delicate lace from the mid-sixteenth century; and the painted lacquer covers on gessoed papier-mâché down to Haji Muhammad Taqi's design of 1270 AH (1854). In Istanbul the bookbinders passed four hundred men with a hundred shops, and the gilders passed gilding Qur'ans and other books in theirs."
    ur: "گروہمان جلد ساز کے ہنر کو اس کے خام مال سے بیان کرتا ہے: یمن، طائف اور مغرب کے چمڑے، مصر میں دیار یا پاپیرس گٹے کی تختیاں، یمن میں گندم کا نشاستہ جہاں فلسطین میں شیرمردار کا گوند چلتا تھا۔ ابن الندیم مأمون کے عہد کے مجلدوں کے نام دیتا ہے جن کا کوئی کام باقی نہیں، مگر چند جلدیں بچی ہیں: برلن کے عجائب گھر میں عاج، ہڈی اور رنگین لکڑیوں کی موزائیک شدہ دیار کی جلد؛ مملوک مصحفوں کی نفیس جلدیں؛ ایران کے مغول شہزادوں کے لیے بنی بے زر ہندسی جلدیں؛ بغداد میں ۱۴۰۷ء کی نقشِ مثقوب چمڑی نیلی و زرینی زمین پر؛ تیموری زربفت جلدیں جن میں ۸۳۸ھ ⁦(۱۴۳۴ء)⁩ کی ایک جلد پر پانچ لاکھ پچاس ہزار ضربِ نقش شمار کیں گئیں، دو تین سال کا کام؛ سولہویں صدی کے وسط کی جالی دار کاغذی پٹیوں والی جلدیں؛ اور گیسو لیتیے پاپیے ماشے پر رنگین لاکر جلدیں تا حاجی محمد تقی کی ۱۲۷۰ھ ⁦(۱۸۵۴ء)⁩ کی جلد۔ استنبول میں مجلّد چار سو آدمی اور سو دکانوں کے ساتھ گزرے اور مذهّب کش اپنی دکانوں میں مصحف اور کتابیں مذهّب کرتے گزرے۔"
