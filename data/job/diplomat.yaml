training:
  mode: mixed
  certification: "The Prophet chose envoys for character and bearing — good looks, persuasiveness, quick understanding, honesty, learning and eloquence — and preferred men who already knew the country and its language, ordering Zayd b. Thabit to learn Hebrew. The Seljuk ideal in Nizam al-Mulk's Siyasatname and the Qarakhanid mirror Kutadgu Bilig ask for an envoy who is intelligent, learned, distinguished, brave, well-read and a speaker of many tongues."
  duration: "No fixed course: envoys were picked per mission from kadis, commanders, physicians and chancery men — the Ayyubids sent the khatib Shams al-Din al-Ba'labakki and the qadi Ziya al-Din al-Shahrazuri — until the Ottoman Translation Office ⁦(Bâbıâli Tercüme Odası, 1821)⁩ began training a Muslim diplomatic corps in earnest."
