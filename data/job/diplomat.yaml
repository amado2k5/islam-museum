places:
  - { place: place/medina, note: "The Prophet received embassies at the 'column of the delegations' in the mosque, had a house built for their lodging, ordered them met at the border and escorted, and among his deathbed instructions was not to neglect the envoys' care.", sources: [source/tdv-elci] }
  - { place: place/abyssinia, note: "True diplomatic activity began, the entry says, when the Prophet sent Amr b. Umayya al-Damri to the Najashi to frustrate the Meccan embassy demanding the surrender of the emigrant Muslims.", sources: [source/tdv-elci] }
  - { place: place/baghdad, note: "Under the Abbasids envoy exchange doubled as commerce and scholarship: al-Ma'mun sent a mission to Byzantium to bring back the classics for translation, and the caliph al-Qa'im sent the qadi al-qudat Mawardi as envoy to Tughril Beg.", sources: [source/tdv-elci] }
  - { place: place/cairo, note: "Mamluk Cairo, midway between the Far East and the Mediterranean, saw constant envoy traffic — Ilkhanid, Golden Horde, Timurid, Ottoman, Byzantine and papal; the Golden Horde embassy of 1314 arrived with 174 persons and rich gifts.", sources: [source/tdv-elci] }
  - { place: place/istanbul, note: "The Ottomans staged the envoy's reception in the Divan-i Hümayun and the Arz Odası as a theatre of power, hosted the first resident embassy (Venice, 1454) long before sending their own, and opened permanent embassies in London, Paris and Vienna only in 1793.", sources: [source/tdv-elci] }
