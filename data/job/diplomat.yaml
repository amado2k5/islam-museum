summary:
  ar: "السفير من يحمل رسالة سلطانه ويعود بجوابها؛ حرمة الرسول من أقدم قواعد العلاقات بين الدول، فالنبي قال لرسل مسيلمة: لولا أنكم رسل لأمرت بضرب أعناقكم. أرسل النبي ستة رسل برسائل الدعوة إلى حكام عصره بعد الحديبية، وازدهرت السفارة في العهدين الأموي والعباسي مع بيزنطة، ثم عند السلاجقة والغزنويين والأيوبيين والمماليك والعثمانيين، الذين جعلوا استقبال السفراء مهرجاناً لعرض قوة الدولة، ولم يقيموا سفارات دائمة في الغرب حتى أواخر القرن الثامن عشر."
  en: "The envoy carries his sovereign's letter and brings back the answer; the envoy's inviolability is one of the oldest rules between states — the Prophet told Musaylima's envoys that had they not been envoys he would have had them beheaded. After Hudaybiya he sent six envoys with his call to the rulers of his age; diplomacy flourished under the Umayyads and Abbasids with Byzantium, then under the Seljuks, Ghaznavids, Ayyubids, Mamluks and Ottomans, who turned the ambassador's reception into a display of state power, yet kept no permanent embassies in the West until the end of the eighteenth century."
  ur: "سفیر اپنے حکمران کا خط لے کر جاتا اور اس کا جواب لاتا ہے؛ قاصد کی حرمت ریاستوں کے تعلقات کے قدیم ترین اصولوں میں ہے — نبی نے مسیلمہ کے قاصدوں سے فرمایا کہ اگر تم قاصد نہ ہوتے تو تمہاری گردنیں ماروا دیتا۔ حدیبیہ کے بعد اس نے اپنے دور کے حکمرانوں کو دعوت کے خطوط چھ قاصدوں کے ذریعے بھیجے؛ اموی اور عباسی دور میں بازنطین کے ساتھ سفارتکاری پھلی، پھر سلجوقی، غزنوی، ایوبی، مملوک اور عثمانیوں کے ہاں، جنہوں نے سفیر کے استقبال کو ریاستی قوت کے مظاہرے کا موقع بنایا، مگر مغرب میں اٹھارویں صدی کے آخر تک مستقل سفارتخانے نہیں رکھے۔"
  es: "El enviado lleva la carta de su soberano y trae la respuesta; la inviolabilidad del enviado es una de las reglas más antiguas entre estados: el Profeta les dijo a los enviados de Musaylima que, de no haber sido enviados, los habría mandado decapitar. Después de Hudaybiya, envió seis enviados con su llamado a los gobernantes de su época; la diplomacia floreció bajo los Omeyas y los Abasíes con Bizancio, luego bajo los Selyúcidas, los Ghaznávidas, los Ayubíes, los Mamelucos y los Otomanos, quienes convirtieron la recepción del embajador en una demostración de poder estatal, pero no mantuvieron embajadas permanentes en Occidente hasta finales del siglo XVIII."
  fr: "L'envoyé porte la lettre de son souverain et rapporte la réponse; l'inviolabilité de l'envoyé est l'une des plus anciennes règles entre États – le Prophète avait dit aux envoyés de Musaylima que s'ils n'avaient pas été des envoyés, il les aurait fait décapiter. Après Hudaybiya, il envoya six envoyés avec son appel aux souverains de son époque; la diplomatie connut un essor important sous les Omeyyades et les Abbassides avec Byzance, puis sous les Seldjoukides, les Ghaznévides, les Ayyoubides, les Mamelouks et les Ottomans, qui firent de la réception de l'ambassadeur une démonstration de puissance étatique, sans toutefois établir d'ambassades permanentes en Occident avant la fin du XVIIIe siècle."
