id: job/mutawalli
class: job
label: { ar: "المتولّي ⁦(ناظر الوقف)⁩", en: "Waqf trustee (mutawalli)", ur: "متولّی ⁦(وقف کا منتظم)⁩" }
summary:
  ar: "المتولّي هو من يعيّنه الواقف أو القاضي لإدارة الوقف وفق شروط الواقف والشرع والأنظمة، فيُصلح عقاره ويؤجره بأجر المثل ويدفع أجور العاملين فيه ويحفظ حساباته. وله أجر معلوم يقدّره الواقف أو القاضي، ويُعزل إن خان أو أهمل. وفي الدولة العثمانية كان القضاة يعيّنون المتولّين، ثم تولّت الدولة إدارة الأوقاف بوزارة الأوقاف ثم بالمديرية العامة للأوقاف."
  en: "The mutawalli was appointed by the founder of a waqf, or by the judge, to run it according to the founder's conditions, the law and the regulations. He kept the buildings in repair, rented the property at its market value, paid the wages of the staff and kept the accounts. He received a fixed pay set by the founder or the judge, and was removed for embezzlement or neglect. In the Ottoman state judges appointed the trustees, and later the state ran the waqfs through a ministry of waqfs and then the General Directorate of Foundations."
  ur: "متولّی وہ شخص تھا جسے وقف کا بانی یا قاضی وقف کے انتظام کے لیے مقرر کرتا تھا، تاکہ وہ بانی کی شرائط، شریعت اور قواعد کے مطابق کام کرے۔ وہ عمارتوں کی مرمت کرتا، جائیداد کو مارکیٹ ریٹ پر کرائے پر دیتا، عملے کی تنخواہیں دیتا اور حساب رکھتا تھا۔ اسے بانی یا قاضی کی طے کردہ مقررہ تنخواہ ملتی تھی، اور خیانت یا غفلت پر معزول کیا جاتا تھا۔ عثمانی ریاست میں قاضی متولی مقرر کرتے تھے، اور بعد میں ریاست نے اوقاف کا انتظام وزارت اور پھر جنرل ڈائریکٹوریٹ آف فاؤنڈیشنز کے ذریعے سنبھالا۔"
