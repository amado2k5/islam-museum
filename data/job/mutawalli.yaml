id: job/mutawalli
class: job
label: { ar: "المتولّي ⁦(ناظر الوقف)⁩", en: "Waqf trustee (mutawalli)", ur: "متولّی ⁦(وقف کا منتظم)⁩", es: "Administrador de Waqf (mutawalli)", fr: "Administrateur du waqf (mutawalli)", tr: "Vakfın mütevellisi (vakfın yöneticisi)", id: "Wali amanat (pengawas dana abadi)" }
summary:
  ar: "المتولّي هو من يعيّنه الواقف أو القاضي لإدارة الوقف وفق شروط الواقف والشرع والأنظمة، فيُصلح عقاره ويؤجره بأجر المثل ويدفع أجور العاملين فيه ويحفظ حساباته. وله أجر معلوم يقدّره الواقف أو القاضي، ويُعزل إن خان أو أهمل. وفي الدولة العثمانية كان القضاة يعيّنون المتولّين، ثم تولّت الدولة إدارة الأوقاف بوزارة الأوقاف ثم بالمديرية العامة للأوقاف."
  en: "The mutawalli was appointed by the founder of a waqf, or by the judge, to run it according to the founder's conditions, the law and the regulations. He kept the buildings in repair, rented the property at its market value, paid the wages of the staff and kept the accounts. He received a fixed pay set by the founder or the judge, and was removed for embezzlement or neglect. In the Ottoman state judges appointed the trustees, and later the state ran the waqfs through a ministry of waqfs and then the General Directorate of Foundations."
  ur: "متولّی وہ شخص تھا جسے وقف کا بانی یا قاضی وقف کے انتظام کے لیے مقرر کرتا تھا، تاکہ وہ بانی کی شرائط، شریعت اور قواعد کے مطابق کام کرے۔ وہ عمارتوں کی مرمت کرتا، جائیداد کو مارکیٹ ریٹ پر کرائے پر دیتا، عملے کی تنخواہیں دیتا اور حساب رکھتا تھا۔ اسے بانی یا قاضی کی طے کردہ مقررہ تنخواہ ملتی تھی، اور خیانت یا غفلت پر معزول کیا جاتا تھا۔ عثمانی ریاست میں قاضی متولی مقرر کرتے تھے، اور بعد میں ریاست نے اوقاف کا انتظام وزارت اور پھر جنرل ڈائریکٹوریٹ آف فاؤنڈیشنز کے ذریعے سنبھالا۔"
  es: "El mutawalli era designado por el fundador de un waqf o por el juez para administrarlo según las condiciones del fundador, la ley y las normas. Se encargaba del mantenimiento de los edificios, alquilaba las propiedades a su valor de mercado, pagaba los salarios del personal y llevaba la contabilidad. Recibía un sueldo fijo establecido por el fundador o el juez, y era destituido por malversación o negligencia. En el Imperio Otomano, los jueces designaban a los fideicomisarios, y posteriormente el Estado administraba los waqfs a través de un Ministerio de Waqfs y, más tarde, de la Dirección General de Fundaciones."
  fr: "Le mutawalli était nommé par le fondateur d'un waqf, ou par le juge, pour le gérer conformément aux conditions du fondateur, à la loi et aux règlements. Il assurait l'entretien des bâtiments, louait les biens à leur valeur marchande, payait les salaires du personnel et tenait la comptabilité. Il percevait une rémunération fixe, fixée par le fondateur ou le juge, et était destitué en cas de détournement de fonds ou de négligence. Dans l'État ottoman, les juges nommaient les administrateurs, puis l'État gérait les waqfs par l'intermédiaire d'un ministère des waqfs, puis de la Direction générale des fondations."
  tr: "Mütevelli, vakfı kuran veya hakim tarafından vakfın şartlarına, İslami hukuka ve düzenlemelere göre vakfı yönetmek üzere atanan kişidir. Sorumlulukları arasında mülkün bakımı, adil piyasa fiyatından kiraya verilmesi, üzerinde çalışanların ücretlerinin ödenmesi ve hesaplarının tutulması yer alır. Kurucu veya hakim tarafından belirlenen sabit bir maaş alırlar ve zimmete para geçirme veya ihmalkarlık yapmaları halinde görevden alınırlar. Osmanlı döneminde mütevelliler hakimler tarafından atanır; daha sonra devlet, Vakıflar Bakanlığı ve ardından Vakıflar Genel Müdürlüğü aracılığıyla vakıfların yönetiminden sorumlu olmuştur."
  id: "Wali amanat adalah orang yang ditunjuk oleh pendiri atau hakim untuk mengelola wakaf sesuai dengan ketentuan pendiri, hukum Islam, dan peraturan yang berlaku. Tanggung jawab mereka meliputi pemeliharaan harta wakaf, menyewakannya dengan harga pasar yang wajar, membayar upah para pekerja, dan menjaga catatan keuangannya. Mereka menerima gaji tetap yang ditentukan oleh pendiri atau hakim dan akan diberhentikan jika melakukan penggelapan atau kelalaian. Pada era Ottoman, hakim menunjuk wali amanat; kemudian, negara mengambil alih tanggung jawab pengelolaan wakaf melalui Kementerian Wakaf, dan selanjutnya melalui Direktorat Jenderal Wakaf."
