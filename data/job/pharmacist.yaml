  techniques:
    ar: "صنعت الصيدليات نحو سبعين صنفاً من الأدوية: مساحيق ⁦(صَفوف)⁩ وأشربة ومعاجين وأقراصاً ⁦(أكراس)⁩ وفتائل، ومُرَّبعة الطعم والرائحة لتسهيل أخذها فما يُؤخذ بالفم يُمزج بالمطيّبات. ويفرّق بايتوب بين الأدوية المفردة ⁦(الدروج)⁩ وهي جوهر الأدوية المركّبة، والمركّبة التي تجمع أكثر من مفردة. وفي دكان الصيدلي العثماني قِسمان: واجهة لقبول المريض ومختبر خلف حاجز زجاجي خشبي، وعلى رفوفه قوارير خزفية من فرنسا للأدوية الجاهزة وفي الأدراج الدروج النباتية، وتُحفظ السُّميّات في خزائن خاصة. ومن أدوات التركيب التي رسمها الزهراوي قوالب خشب لعمل التنزو ⁦(الباستيل)⁩ ومصفاة ثلاثية الطبقات لتصفية عصارات الأعشاب."
    en: "The pharmacies made about seventy forms of medicine: powders, syrups, electuaries, pastilles (akras) and suppositories, flavoured to ease their taking, those used by mouth mixed with aromatics. Baytop distinguishes the simple drugs (drogs), the raw material of the compounds, from the compound drugs of more than one ingredient. The Ottoman pharmacist's shop had two parts — a reception and a laboratory behind a wooden glass partition; its polished shelves held porcelain drug jars from France and ready-made medicines, the drawers below herbal drogs, and poisons in special cabinets. Of the compounding tools drawn in al-Zahrawi's Tasrif there are wooden moulds for making pastilles and a three-layered sieve for straining the infusions of herbs."
    ur: "فارمیسیوں میں ستر قسم کی ادویہ بنتی تھیں: سفوف، شربت، معجون، قرص ⁦(اکراس)⁩ اور شیاف، چبائی جانے والی خوشبو دار مادوں سے ملائی جاتیں۔ بایطوپ سادہ ادویہ ⁦(ڈرُگ)⁩ — جو مرکبوں کا خام مادہ ہے — اور ایک سے زیادہ اجزا والی مرکب ادویہ میں فرق کرتا ہے۔ عثمانی صیدلے کی دکان کے دو حصے ہوتے — مریض لینے کا حصہ اور لکڑی کے شیشے بند خانے کے پیچھے لیبارٹری؛ پالش شدہ الماریوں میں فرانس کی چینی کی دوا دانیاں اور تیار ادویہ، نیچے درازوں میں جڑی بوٹیوں کے ڈرُگ، اور زہریلی ادویہ مخصوص الماریوں میں۔ الزہراوی کی تصریف میں ترکیب کے اوزاروں میں لکڑی کے باسٹیل سانچے اور جڑی بوٹیوں کے عرق چھاننے کی تین تہ چھلنی دکھائی گئی ہیں۔"
