summary:
  ar: "الصيدلاني هو من يركّب الأدوية المفردة في أدوية مركّبة ويبيعها. يقول طورهان بايتوب إن الصيدلة — وقد دخلت كلمتها العربية من السنسكريتية، وتسمّى أيضاً فنّ الإسبنجياري — كان يباشرها أولاً الأطباء أنفسهم يشترون جواهر الأدوية من الكُهّاش ⁦(العشّار)⁩ والعطّار، ثم انفصلت عن الطب في العصر العباسي من القرن الثالث الهجري، ويُروى أن أول صيدلية فتحت في بغداد سنة 148هـ ⁦(765م)⁩، وأن المأمون أخضع صنع الأدوية لرقابة الدولة. ومن القرن الثالث صارت الصيدليات تصنع نحو سبعين صنفاً من الأدوية: المساحيق والشرب والمعاجين والأقراص والحقن، تمزج بها المطيّبات. وتعدّ كتب الحسبة الصيدلاني أخطر الدكاكين: يعاين المحتسب أدويتهم كل أسبوع ويفصّل الشيزري غشّ الأفيون المصري والراوند الصيني والتباشير واللبان. وعند العثمانيين نشأت الصيدلية الحديثة ⁦(إجهانه)⁩ من منتصف القرن الثامن عشر، وأُخضع الصيادلة لامتحان هيئة من أساتذة مكتب الطبية وصار لهم تزكرة ورتبتان، ثم مدرسة."
  en: "The saydanan compounded the simple drugs into compound medicines and sold them. Turhan Baytop relates that pharmacy — saydele, a word Arabic took from Sanskrit, also called fenn-i ispenciyari — was first practised by the physicians themselves, who bought drug raw materials from the root-diggers and attars; the craft separated from medicine under the Abbasids in the ninth century, the first pharmacy is said to have opened in Baghdad in 148/765, and al-Ma'mun brought the making of medicines under state control. From that century the pharmacies produced about seventy forms of medicine — powders, syrups, electuaries, pastilles and suppositories — blended with flavourings. The hisba books treat the druggist's shop as the most dangerous of all: the muhtasib inspects their drugs weekly, and al-Shayzari details the adulteration of Egyptian opium, Chinese rhubarb, bamboo concrete and frankincense. Under the Ottomans the modern pharmacy (eczahane) arose from the mid-eighteenth century; pharmacists were examined by a board of the Mekteb-i Tıbbiyye teachers, licensed with a tezkire in two classes, and finally schooled in the empire's own pharmacy classes."
  ur: "صیدلانی سادہ ادویہ کی ترکیب بنا کر مرکب ادویہ بیچتا ہے۔ طورہان بایطوپ کے مطابق صیدلے — لفظ عربی میں سنسکرت سے آیا، فنِ اسپنچیاری بھی کہلایا — پہلے خود معالج کرتے تھے اور ادویہ کے خام مادے جڑ کاٹنے والوں اور عطاروں سے خریدتے؛ پھر عباسی عہد میں نویں صدی عیسوی میں یہ پیشہ طب سے الگ ہوا، پہلی فارمیسی 148ھ/765ء میں بغداد میں کھلی کہی جاتی ہے، اور مامون نے ادویہ سازی کو ریاستی نگرانی میں لایا۔ اسی صدی سے فارمیسیوں میں ستر قسم کی ادویہ — سفوف، شربت، معجون، قرص اور شیاف — خوشبو دار مادوں کے ساتھ بننے لگیں۔ حسبہ کی کتابیں دوا فروش کی دکان کو سب سے خطرناک مانتی ہیں: محتسب ہر ہفتے ان کی ادویہ جانچتا ہے اور الشیزری مصری افیون، چینی ریوند، تباشیر اور لوبان کی ملاوٹ تفصیل سے بتاتا ہے۔ عثمانیوں میں جدید فارمیسی ⁦(اجزاخانہ)⁩ اٹھارویں صدی کے وسط سے اٹھی؛ صیدلانیوں کا امتحان مکتبِ طبیہ کے اساتذہ کی مجلس کرتی، تذکرہ دو درجوں میں ملتا، اور پھر سلطنت کی اپنی صیدلانی درسگاہیں کھلیں۔"
  es: "El saydanan combinaba los medicamentos simples en preparados compuestos y los vendía. Turhan Baytop relata que la farmacia —saydele, palabra árabe derivada del sánscrito, también llamada fenn-i ispenciyari— fue practicada inicialmente por los propios médicos, quienes compraban las materias primas a los recolectores de raíces y a los fabricantes de attares; el oficio se separó de la medicina bajo el dominio de los abasíes en el siglo IX, se dice que la primera farmacia abrió en Bagdad en 148/765, y al-Ma'mun sometió la elaboración de medicamentos al control estatal. A partir de ese siglo, las farmacias producían alrededor de setenta formas de medicamentos —polvos, jarabes, electuarios, pastillas y supositorios— mezclados con saborizantes. Los libros de la hisba consideran la farmacia como el lugar más peligroso de todos: el muhtasib inspecciona sus medicamentos semanalmente, y al-Shayzari detalla la adulteración del opio egipcio, el ruibarbo chino, el hormigón de bambú y el incienso. Bajo el dominio otomano, la farmacia moderna (eczahane) surgió a mediados del siglo XVIII; los farmacéuticos eran examinados por una junta de maestros Mekteb-i Tıbbiyye, obtenían una licencia con un tezkire en dos clases y, finalmente, se formaban en las propias clases de farmacia del imperio."
  fr: "Le saydanan composait des médicaments à partir de plantes médicinales simples et les vendait. Turhan Baytop rapporte que la pharmacie – saydele, mot arabe emprunté au sanskrit, également appelé fenn-i ispenciyari – était initialement pratiquée par les médecins eux-mêmes, qui achetaient les matières premières auprès des cueilleurs de racines et les producteurs d'attars. Sous les Abbassides, au IXe siècle, l'artisanat se sépara de la médecine. La première pharmacie aurait ouvert ses portes à Bagdad en 148/765, et al-Ma'mun plaça la fabrication des médicaments sous le contrôle de l'État. À partir de ce siècle, les pharmacies produisaient environ soixante-dix formes de médicaments – poudres, sirops, électuaires, pastilles et suppositoires – aromatisés. Les ouvrages de la hisba décrivent la pharmacie comme le commerce le plus dangereux: le muhtasib inspecte les médicaments chaque semaine, et al-Shayzari décrit en détail la falsification de l'opium égyptien, de la rhubarbe chinoise, du béton de bambou et de l'encens. Sous les Ottomans, la pharmacie moderne (eczahane) est apparue au milieu du XVIIIe siècle; les pharmaciens étaient examinés par un conseil des enseignants Mekteb-i Tıbbiyye, agréés avec un tezkire en deux classes, et finalement formés dans les propres classes de pharmacie de l'empire."
  tr: "Eczacı, basit ilaçları bir araya getirerek bileşik ilaçlar üreten ve satan kişidir. Turhan Baytub, Arapçası Sanskritçe kökenli olan ve İspanyolların sanatı olarak da adlandırılan eczacılığın başlangıçta, tıbbi malzemeleri vergi tahsildarından ve parfümcüden satın alan hekimler tarafından uygulandığını belirtir. Daha sonra, Hicri üçüncü yüzyılda Abbasi döneminde tıptan ayrılmıştır. İlk eczanenin Hicri 148 yılında (Miladi 765) Bağdat'ta açıldığı ve el-Ma'mun'un ilaç üretimini devlet kontrolüne aldığı söylenir. Üçüncü yüzyıldan itibaren eczaneler, tatlandırıcılarla karıştırılmış yaklaşık yetmiş çeşit ilaç üretmiştir: tozlar, şuruplar, macunlar, tabletler ve enjeksiyonlar. Piyasa denetimi (hisbah) üzerine yazılmış kitaplar, eczacıları en tehlikeli kuruluşlar arasında sayar: piyasa müfettişi (muhtasib) ilaçlarını her hafta denetler ve el-Şeyzari, Mısır afyonu, Çin raventi, tebeşir ve tütsünün hileli karışımını ayrıntılı olarak anlatır. Osmanlılar arasında modern eczacılık (Ecahane) on sekizinci yüzyılın ortalarından itibaren ortaya çıkmış ve eczacılar Tıp Bürosu'ndan bir profesörler kurulu tarafından sınava tabi tutulmuş, kendilerine bir belge ve iki rütbe verilmiş, ardından da bir okula atanmışlardır."
  id: "Seorang apoteker adalah seseorang yang menggabungkan obat-obatan sederhana menjadi obat-obatan majemuk dan menjualnya. Turhan Baytub menyatakan bahwa farmasi—yang kata Arabnya berasal dari bahasa Sanskerta dan juga disebut seni Spanyol—awalnya dipraktikkan oleh para dokter sendiri, yang membeli bahan-bahan obat dari pemungut pajak dan pembuat parfum. Kemudian, farmasi terpisah dari kedokteran selama era Abbasiyah pada abad ketiga Hijriah. Dikatakan bahwa apotek pertama dibuka di Baghdad pada tahun 148 Hijriah (765 M), dan bahwa al-Ma'mun menundukkan pembuatan obat-obatan di bawah kendali negara. Sejak abad ketiga dan seterusnya, apotek memproduksi sekitar tujuh puluh jenis obat: bubuk, sirup, pasta, tablet, dan suntikan, yang dicampur dengan perasa. Buku-buku tentang pengawasan pasar (hisbah) menganggap apoteker sebagai salah satu lembaga yang paling berbahaya: inspektur pasar (muhtasib) memeriksa obat-obatan mereka setiap minggu, dan al-Shayzari merinci pemalsuan opium Mesir, rhubarb Cina, kapur, dan kemenyan. Di kalangan Ottoman, farmasi modern (Ejahane) muncul sejak pertengahan abad ke-18, dan para apoteker menjalani ujian oleh sekelompok profesor dari Kantor Medis, dan mereka diberi sertifikat dan dua tingkatan, kemudian melanjutkan pendidikan di sekolah."
