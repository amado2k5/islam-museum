  mode: apprenticeship
  certification: "Al-Farabi wrote his great treatise for performers who wished to reinforce practice with theory, holding that performance precedes theory in the art {cite:tdv-musiki}. Lane found that the professional style was difficult for those who had not made a regular study of the art, though children acquired the popular airs early {cite:lane-modern-egyptians}."
  duration: "In Ottoman usage the instrument players stood beside the singers inside the fasıl ensemble directed by the serhânende; Cantemir divided the performance into hânende, sâzende and mixed fasıls {cite:tdv-hanende}."
