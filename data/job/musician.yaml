summary:
  ar: "الموسيقي عازف الآلات ومؤدّي الفصول؛ سمّاه العرب مطرباً والأتراك سازنده، وسمّى أهل القاهرة عند لين حرفيّيهم بالعالاتي. عرف العباسيون موسيقيّي البلاط من أمثال إبراهيم وإسحاق الموصلي، وتناقل النظريّون من زلزل ويونس الكاتب إلى الفارابي العلمَ كما الإتقان. وفي إستانبول العثمانية أحصى أوليا جلبي فرقة المهتران — ثلاثمائة عضو يعترفون بجمشيد بيراً لهم — تعزف الفصول الثلاثة عند الظهر وقبل الفجر، وفرق الموسيقى في نواحي المدينة بنحو أربعة آلاف؛ وفي القاهرة الحديثة كان العالاتي يُستأجرون للأفراح ويُعامَلون معاملة منحطّة مع أن صوتهم يملأ الدور."
  en: "The musician plays the instruments and performs the suites; the Arabs called him mutrib, the Turks sâzende, and Lane's Cairenes called their professionals alâteeyeh. The Abbasids knew court musicians such as Ibrahim and Ishaq al-Mawsili, and the theorists from Zelzel and Yunus al-Katib to al-Farabi transmitted the science together with the practice. In Ottoman Istanbul Evliya counted the mehter corporation — three hundred men owning Jemshid as their pir — playing three fasıls at afternoon and before dawn, and some four thousand musicians in the town's jurisdictions; in nineteenth-century Cairo the alâteeyeh were hired for feasts and held in low esteem even as their playing filled the houses."
  ur: "موسیقار ساز بجانے اور فصلیں پیش کرنے والا ہے؛ عرب اسے مطرب، ترک سازندہ، اور لین کے قاہرین نے اپنے پیشہ ورانہ موسیقاروں کو عالاتی کہا۔ عباسیوں نے دربار کے موسیقار جیسے ابراہیم اور اسحاق موصلی کو پہچانا، اور نظریہ دانوں نے زلزل اور یونس کاتب سے فارابی تک علم کو مہارت کے ساتھ منتقل کیا۔ عثمانی استنبول میں اولیا چلبی نے مہتروں کی فرقہ گنی — تین سو آدمی جن کا پیر جمشید ہے — جو عصر اور صبح سے پہلے تین فصلیں بجاتے، اور شہر کی نواح میں تقریباً چار ہزار موسیقار؛ اور انیسویں صدی کے قاہرے میں عالاتی دعوتوں پر رکھے جاتے، مامون درجے کے سمجھے جاتے مگر ان کی دھن گھر بھرتی۔"
  es: "El músico toca los instrumentos y ejecuta las suites; los árabes lo llamaban mutrib, los turcos sâzende, y los cairotas de Lane llamaban a sus profesionales alâteeyeh. Los abasíes conocieron a músicos de la corte como Ibrahim e Ishaq al-Mawsili, y los teóricos desde Zelzel y Yunus al-Katib hasta al-Farabi transmitieron la ciencia junto con la práctica. En el Estambul otomano, Evliya contaba con la corporación mehter —trescientos hombres que tenían a Jemshid como su pir— que tocaba tres fasıls por la tarde y antes del amanecer, y unos cuatro mil músicos en las jurisdicciones de la ciudad; en el Cairo del siglo XIX, los alâteeyeh eran contratados para los banquetes y tenían poca estima, aunque su música llenaba las casas."
