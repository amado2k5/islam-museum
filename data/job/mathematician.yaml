summary:
  ar: "الرياضي هو من يشتغل بعلوم التعاليم — الحساب والهندسة والفلك والموسيقى — التي سمّاها المسلمون العلوم الرياضية أي ما يريّض الذهن ويعدّه للعلم الإلهي. نشأ هذا العمل في بغداد مطلع القرن التاسع مع حركة الترجمة عن اليونانية، وكتب الخوارزمي فيها كتاب الجبر والمقابلة ⁦(813–830م)⁩ فاستقلّ الجبر فرعاً قائماً بذاته، ثم طوّره ابن ترك وثابت بن قرة الذي أعاد تأسيس براهينه على قواعد هندسية وأبو كامل الذي أضاف إليه فصل التحليل غير المعيّن. وفي القرن الخامس عشر جدّد الكاشي بسمرقند في «مفتاح الحساب» و«زيج الخاقاني»."
  en: "The mathematician worked the ulûm-i teâlîm — arithmetic, geometry, astronomy and music — the sciences the Muslims called riyâzî, those that exercise the mind and prepare it for the divine science. The craft arose in early ninth-century Baghdad with the Greek translation movement; there al-Khwarizmi wrote his book of al-jabr wa'l-muqabala (813–830), in which algebra first stood forth as an independent branch, developed after him by Ibn Turk, by Thabit ibn Qurra who re-founded its proofs on geometric ground, and by Abu Kamil who added the chapter of indeterminate analysis. In the fifteenth century al-Kashi renewed the work at Samarkand in the Miftah al-hisab and the Zij-i Khaqani. Carra de Vaux credits the Muslims with making algebra an exact science and founding plane and spherical trigonometry."
  ur: "ریاضی دان وہ شخص تھا جو علومِ تعالیم — حساب، ہندسہ، فلکیات اور موسیقی — پر کام کرتا تھا، وہ علوم جنھیں مسلمانوں نے ریاضی کہا یعنی وہ جو ذہن کی مشق کر کے اسے الٰہی علم کے لیے تیار کریں۔ یہ کام نویں صدی عیسوی کے آغاز میں بغداد میں یونانی ترجمہ تحریک کے ساتھ اٹھا؛ خوارزمی نے وہاں الجبر والمقابلہ لکھی ⁦(813–830ء)⁩ جس میں جبر پہلی بار ایک آزاد شاخ کے طور پر ابھرا، پھر ابن ترک، ثابت بن قرہ — جس نے اس کے برہانوں کو ہندسی بنیادوں پر قائم کیا — اور ابو کامل نے اسے آگے بڑھایا، جس نے غیر متعین تحلیل کا باب جوڑا۔ پندرہویں صدی میں کاشی نے سمرقند میں مفتاح الحساب اور زیجِ خاقانی میں اس علم کو نیا دیا۔ کارا دو وو کے مطابق مسلمانوں نے جبر کو ایک دقیق علم بنایا اور مستوی و کروی مثلثیات کی بنیاد رکھی۔"
  es: "El matemático se dedicó a las ulûm-i teâlîm —aritmética, geometría, astronomía y música—, las ciencias que los musulmanes llamaban riyâzî, aquellas que ejercitan la mente y la preparan para la ciencia divina. Este arte surgió a principios del siglo IX en Bagdad con el movimiento de traducción griega; allí, al-Juarismi escribió su libro de al-jabr wa'l-muqabala (813-830), en el que el álgebra se presentó por primera vez como una rama independiente, desarrollada posteriormente por Ibn Turk, por Thabit ibn Qurra, quien refundó sus demostraciones sobre bases geométricas, y por Abu Kamil, quien añadió el capítulo de análisis indeterminado. En el siglo XV, al-Kashi retomó la obra en Samarcanda en el Miftah al-hisab y el Zij-i Khaqani. Carra de Vaux atribuye a los musulmanes el haber convertido el álgebra en una ciencia exacta y haber fundado la trigonometría plana y esférica."
  fr: "Le mathématicien travaillait les ulûm-i teâlîm — arithmétique, géométrie, astronomie et musique —, les sciences que les musulmans appelaient riyâzî, celles qui exercent l'esprit et le préparent à la science divine. Cette discipline apparut au début du IXe siècle à Bagdad avec le mouvement de traduction du grec; c'est là qu'al-Khwarizmi écrivit son ouvrage al-jabr wa'l-muqabala (813-830), dans lequel l'algèbre fut présentée pour la première fois comme une branche indépendante, développée après lui par Ibn Turk, par Thabit ibn Qurra qui en refonda les démonstrations sur des bases géométriques, et par Abu Kamil qui ajouta le chapitre sur l'analyse indéterminée. Au XVe siècle, al-Kashi reprit ces travaux à Samarcande dans le Miftah al-hisab et le Zij-i Khaqani. Carra de Vaux attribue aux musulmans le mérite d'avoir fait de l'algèbre une science exacte et d'avoir fondé la trigonométrie plane et sphérique."
