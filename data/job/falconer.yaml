training:
  mode: mixed
  certification: "Two lines. In the palace, devşirme acemi oğlanlar were picked, served a time at the Edirne, Galata and İbrahim Paşa palaces, and entered Enderun as doğancı şâkirdi to continue their training; the twelve senior doğancıs held the privileges of the treasury-room staff. In the provinces the craft ran in families — doğancılık generally passed father to son, falling to the nearest kinsman when there was no son — under berats renewed each accession."
  duration: "The bird had to be caught, manned and flown: the provincial raiser learned beside his father among the gürenceci, kayacı, kümeci, sayyâd, tuzakçı and yuvacı specialists."
