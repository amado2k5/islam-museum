summary:
  ar: "الدوغانجي يربّي الصقر — الدّوغان من كلمة تركية ⁦(توغان)⁩ — ويصيد به، ويسمّى أيضاً البازدار. كان صيد الجوارح قديماً قبل التاريخ، وعند دول الترك والإسلام قوّام للصيد: أمير شكار عند السلاجقة بمرتبة أمير، وعند مماليك مصر أمير عشرة مع حراسة الطير والهايوندار. وعند العثمانيين صارت الصقّارة دوغانجيلر: غرفة في إندرون يقودها الدوغانجي باشي من سنة 1478، وفي الولايات أكثر من ألفي مربٍّ موقوف معفى من الضرائب يتوارثها الآباء عن الأبناء، حتى ألغى محمود الثاني التنظيم سنة 1830."
  en: "The doğancı rears the falcon — doğan from Turkish togan — and hunts with it; he is also called bâzdâr. Falconry reaches back before history, and the Turkish-Islamic states kept hunt officers: the emîr-i şikâr of the Seljuks held amir's rank, and Mamluk Egypt had a hunt emir of ten with the hirâsetü't-tayr and hayvandar beside him. Under the Ottomans the falconers became the doğancıs: an Enderun ward led by the doğancıbaşı from 1478, and in the provinces more than two thousand timar-holding, tax-exempt bird-keepers whose berats passed father to son — until Mahmud II abolished the institution in 1830."
  ur: "دوغانجی شکرے کو پالتا اور اس سے شکار کرتا ہے — دوغان ترکی لفظ توغان سے — اور اسے بازدار بھی کہتے ہیں۔ بازداری تاریخ سے پہلے کی ہے، اور ترک-اسلامی سلطنتوں میں شکار کے افسر تھے: سلجوقوں کا امیرِ شکار امیر کے درجے کا تھا، اور مملوک مصر میں شکار کا امیر دہری جس کے ساتھ حراست الطیر اور حیوندار تھے۔ عثمانیوں میں بازدار دوغانجی بنے: 1478 سے اندرون کی کوٹھڑی جس کا سردار دوغانجی باشی، اور صوبوں میں دو ہزار سے زائد تیمار دار، محصول سے معاف پرندہ پال جن کی برات باپ سے بیٹے کو منتقل ہوتی تھی — یہاں تک کہ سلطان محمود ثانی نے 1830 میں یہ ادارہ ختم کیا۔"
