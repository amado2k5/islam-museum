summary:
  ar: "الضرّاب هو عامل دار الضرب ⁦(ضربخانة)⁩ الذي يسكّ الدينار من ذهب والدرهم من فضة والفلس من نحاس. يفصّل المدخل طواقم الصنّاع داخل الدار: السبّاك المُذيب والحدّاد المرمّم والمدّاد المُمرّر والقطّاع والغسّال والمجلّي والحلّال المُصفّي بالتيزاب والكوركجي وسيّد العيار، وخارجها الحقّاق ناقش السكة وخدم الالتزام من الملتزم إلى الكاتب والأمين."
  en: "The darrab is the mint craftsman who struck dinars of gold, dirhams of silver and fals of copper in the darphâne. The entry details the staff inside: the sebbâk melter, haddâd tool-repairer, meddâd bar-drawer, kattâ cutter, gassâl washer, polisher, hallâl refiner with nitric acid, körükçü bellows-man, zincirci collar-engraver and the sâhib-i ayâr who answered for weight and fineness — and outside, the hakkâk/sikkegen die-cutters serving the state under three-year iltizam contracts."
  ur: "ضراب دار الضرب ⁦(ضرب خانہ)⁩ کا کاریگر ہے جو سونے کا دینار، چاندی کا درہم اور تانبے کا فلس ٹھپتا تھا۔ مدخل اندر کا عملہ گناتا ہے: پگھلانے والا سباک، اوزار بنانے والا حداد، بار کھینچنے والا مداد، کاٹنے والا قطاع، دھونے والا غسال، چمکانے والا، تیزاب سے صاف کرنے والا حلال، دھونکنی والا کورکجی، زنجیر کندہ کرنے والا زنجرکلی اور صاحب عیار جو وزن اور خالص پن کا ذمہ دار تھا — اور باہر حقاق/سکہ گن ڈائی تراش جو ریاست کے لیے تین سالہ التزام کے تحت کام کرتے تھے۔"
  es: "El darrab es el artesano de la ceca que acuñaba dinares de oro, dirhams de plata y fals de cobre en el darphâne. La entrada detalla al personal del interior: el fundidor sebbâk, el reparador de herramientas haddâd, el estirador de barras meddâd, el cortador kattâ, el lavador gassâl, el pulidor, el refinador hallâl con ácido nítrico, el operario de fuelles körükçü, el grabador de collares zincirci y el sâhib-i ayâr que respondía por el peso y la pureza; y en el exterior, los troqueladores hakkâk/sikkegen que servían al estado con contratos iltizam de tres años."
