  techniques:
    ar: "كانت الضربة تمرّ بمراحل: يُذاب المعدن في البواتق على قياس السكة ثم يُصبّ قضباناً، فتُبسَّط إلى سماكة السكة وتُقطّع مربعات ثم تُدوَّر أقراصاً ⁦(pul)⁩ توضع بين قالبين؛ السفلي «كورسو» مثبّت على جذع والعلوي «جليك» يُضرب بالمطرقة. ويعدد المدخل صنّاع دار مصر في القرن الثامن عشر: السبّاك والحدّاد والمدّاد والقطّاع والغسّال والمجلّي والحلّال والكوركجي والزنجركلي، كلّهم يأخذ أجره من نوبة المعدن بترتيب سيّد العيار. ثم جاء آلة الرقّاس الميكانيكية عام ١٦٨٩م فنقلت الضرب من المطرقة إلى البُرغي."
    en: "Striking ran in stages: the metal was melted in crucibles to mint fineness, cast into bars, flattened to coin thickness, cut into squares and rounded into blanks (pul), then set between dies — the lower 'kürsü' fixed on a block, the upper 'çelik' struck with a hammer. The entry lists the eighteenth-century Egypt mint's crew — sebbâk, haddâd, meddâd, kattâ, gassâl, polisher, hallâl, körükçü, zincirci — each paid from the nevbet (a furnace-load of metal) by the sâhib-i ayâr. From 1689 the rakkas screw-press moved striking from the hammer to the screw."
    ur: "سکہ کئی مراحل سے گزرتا تھا: دھات کو سکہ عیار تک پگھلا کر سلاخیں ڈھالتے، سکہ موٹائی تک چپٹا کرتے، مربع کاٹ کر گول چپے ⁦(پل)⁩ بناتے اور دو ڈائیوں کے درمیان رکھتے تھے — نیچلی «کورسو» تنے پر جڑی، اوپر «چلک» ہتھوڑے سے ماری جاتی۔ مدخل اٹھارویں صدی کے مصر کے ضرب خانے کا عملہ گناتا ہے: سباک، حداد، مداد، قطاع، غسال، چمکانے والا، حلال، کورکجی، زنجرکلی — سب کی اجرت صاحب عیار نوبت ⁦(بھٹی بھر دھات)⁩ سے ادا کرتا تھا۔ ۱۶۸۹ء میں رقاس نامی سکرو پریس نے ہتھوڑے کی جگہ سکرو لگا دی۔"
