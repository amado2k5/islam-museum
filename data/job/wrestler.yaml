places:
  - { place: place/mecca, note: "In the Jahiliyya fairs wrestling matches were held widely; Umar was known for wrestling at the Ukaz fair, and the Prophet himself wrestled and defeated the famous pehlivan Rukana ibn Abd Yazid.", sources: [source/tdv-gures] }
  - { place: place/baghdad, note: "Under the Abbasids wrestling was a palace sport; the caliph al-Amin was devoted to it and al-Mu'tadid wrestled a lion, and the Buyid Mu'izz al-Dawla staged mass matches in Baghdad where winners took money and robes of honour.", sources: [source/tdv-gures] }
  - { place: place/konya, note: "Under the Seljuks wrestlers' tekkes were founded in many cities, Konya first of all.", sources: [source/tdv-gures] }
  - { place: place/bursa, note: "Orhan Bey opened the first Ottoman wrestlers' tekke at Bursa beside the Bey Sarayı inside the citadel.", sources: [source/tdv-gures] }
  - { place: place/edirne, note: "Murad I founded the second wrestlers' tekke at Edirne near the Ali Pasha market; the Kırkpınar games, begun by the legend of the forty ghazis, were held on the meadow by Edirne that today lies in Greece — the modern games continue at Sarayiçi, Edirne.", sources: [source/tdv-gures] }
  - { place: place/istanbul, note: "Istanbul held the Pehlivan Şücâ and Pehlivan Demir tekkes; Evliya counts three hundred greased pehlivans of the wrestlers' guild walking the guild procession before the emperor at the Alay Köşkü, and the palace kept a wrestlers' corps under Bayezid II.", sources: [source/evliya-narrative-hammer-v2, source/tdv-gures] }
  - { place: place/cairo, note: "In 1830s Cairo Lane saw the Egyptian musâre'een wrestle stripped and oiled, mostly for pay at festivals and processions.", sources: [source/lane-modern-egyptians] }
