summary:
  ar: "المصارع ⁦(بلهوان)⁩ بطل لعبة المصارعة، وهي من أقدم الرياضات في عالم الإسلام: كانت عند الترك القدماء من تدريبات الحرب وشعائر الأعياد والأعراس، وفي الجاهلية أقيمت المنافسات في الأسواق وكان عمر بن الخطاب يشتهر بمصارعته في سوق عكاظ. وفي العهد العباسي صار البلهوانات المشاهير موظفين في القصر، وعند السلاجقة انضمت القواعد التركية إلى الفارسية فدخلت كلمة «بلهوان» الفارسية التركية وصار بير الصنعة حمزة. وفي الدولة العثمانية أقام الأمراء تكايا المصارعين في بروسة وأدرنة ومانيسة وإسطنبول، وتنظّم البلهوانات جماعةً قصرية، وصارت «مصارعة الحضرة» أمام السلطان عادة الأعراس والأعياد، وكانت مصارعات قيرق بينار من أكبر مباريات العموم."
  en: "The wrestler, called pehlivan, was the hero of one of the oldest sports of the Islamic world. Among the ancient Turks wrestling was war-drill and festival rite; in the Jahiliyya the fairs held matches — Umar was famous for wrestling at Ukaz. Under the Abbasids famous pehlivans were taken onto the palace payroll; the Seljuks fused Turkish custom with Persian rules, the Persian word pehlivan entered Turkish and Hamza became the craft's pir. The Ottomans housed the wrestlers in their own tekkes at Bursa, Edirne, Manisa and Istanbul, kept a palace wrestlers' corps (cemaat-i küştigîran), staged the 'presence bouts' (huzur güreşleri) at weddings and festivals, and kept the great Kırkpınar fair-games where the winning başpehlivan took the golden belt."
  ur: "پہلوان کشتی کا بہادر کھلاڑی تھا — اسلامی دنیا کے قدیم ترین کھیلوں میں سے ایک کا ہیرو۔ قدیم ترکوں میں کشتی جنگی مشق اور جشن و شادی کی رسوم تھی؛ جاہلیت کی پنایروں میں مقابلے ہوتے اور عمر عکاظ کی کشتیوں میں مشہور تھے۔ عباسیوں کے عہد میں مشہور پہلوان محل میں ملازم بھرتی ہوئے؛ سلجوقوں نے ترک روایت کو فارسی قواعد سے ملایا، فارسی لفظ پہلوان ترکی میں آیا اور حمزہ صنعت کے پیر ٹھہرے۔ عثمانیوں نے بروسہ، ادرنہ، مانیسہ اور استنبول میں پہلوانوں کے ٹکے قائم کیے، محل میں کشتی گراں کی جماعت رکھی، شادیوں اور جشنوں پر «حضور کشتی» کروائی، اور قیرق پینار کے میلے جاری رکھا جہاں جیتنے والے باش پہلوان کو سنہری کمربند ملتا۔"
  es: "El luchador, llamado pehlivan, era el héroe de uno de los deportes más antiguos del mundo islámico. Entre los antiguos turcos, la lucha era un entrenamiento de guerra y un rito festivo; en la época preislámica (Jahiliyya), las ferias celebraban combates; Umar era famoso por luchar en Ukaz. Bajo los abasíes, los pehlivans más famosos se incorporaban a la nómina del palacio; los selyúcidas fusionaron la costumbre turca con las reglas persas, la palabra persa pehlivan pasó al turco y Hamza se convirtió en el pir del oficio. Los otomanos alojaban a los luchadores en sus propios tekkes en Bursa, Edirne, Manisa e Estambul, mantenían un cuerpo de luchadores en el palacio (cemaat-i küştigîran), organizaban los combates de presencia (huzur güreşleri) en bodas y festivales, y celebraban los grandes juegos de la feria de Kırkpınar, donde el başpehlivan ganador se llevaba el cinturón de oro."
