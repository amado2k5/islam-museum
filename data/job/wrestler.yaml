training:
  mode: apprenticeship
  certification: "The Ottoman wrestlers' tekke worked like a club: a successful, literate and authoritative 'şeyh' headed it, the resident wrestlers were called 'derviş' without any Sufi affiliation, and training ran on the open meydan in summer and a closed hall in winter; the tekkes lived off vakıf revenues settled by their founders."
  duration: "The wrestling craft of the tekke had its own lore — Evliya says the art was made to consist of forty arts, seventy rounds and one hundred and forty tricks a good wrestler must know."
