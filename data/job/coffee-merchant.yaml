  techniques:
    ar: "التقنية عند إوليا ولّين: التحميص في أفران التخنوسخانة الثلاثة، الطحن في مئة هاون لا تسكن أصواتها كالرعد، والميزان بالأوقية لحساب الأجر والعُشر. وعند لين: البنّ حديث التحميص مطحون يُلقى في ماء يغلي ويُحرَّك، تُعاد الكنكة على النار مرة أو مرتين حتى تغلي، ثم يُسكب الفنجان وهو رغو؛ ويُقدَّم الفنجان الخزفي الصغير ⁦(فنجان)⁩ في ظرف من فضة أو نحاس، وأحياناً تُذوَّب في الكنكة فصّة عنبر أو يُبخَّر الفنجان بالمصطكى."
    en: "The technique in Evliya and Lane: roasting in the three ovens of the Takhnus-khanah, grinding in a hundred mortars whose noise resembles thunder, weighing by the occa for the grinder's fee and the tithe. In Lane: the beans freshly roasted and pounded are thrown into boiling water and stirred, the pot returned to the fire once or twice until it simmers, then poured while the surface is yet creamy; the small porcelain fingan is offered in a zarf of silver or brass, and a carat of ambergris may be melted in the pot or the cup fumigated with mastic."
    ur: "اولیاء اور لین میں تکنیک: تخنوسخانہ کے تین تنوروں میں بھننا، سو ہاونوں میں پیسنا جن کی آواز گرج سی، اوقیہ کی تول جس سے اجر اور دہائی نکلتی۔ لین میں: تازہ بھنا کُٹا بن ابالتے پانی میں ڈال کر ہلایا، برتن ایک دو بار آگ پر رکھا کہ کھولے، پھر جب رغ ہو تو چھڑا؛ چھوٹا چینی کا فنجان چاندی یا پیتل کے ظرف میں پیش ہوتا، اور کبھی برتن میں قیراط برابر عنبر پگھلائی یا فنجان مستکی سے بھپارا جاتا۔"
