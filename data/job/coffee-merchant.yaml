summary:
  ar: "القَهوَجي تاجر البُنّ وطاحنه ومُحمّصه ومُقدّمه في القهوة. في موكب إسطنبول عدّ إوليا باعة البنّ ⁦(عطّاران قهوه)⁩ خمسمئة رجل بثلاثمئة دكان، تجّاراً كباراً لكلّ منهم ألف كيس رأس مال في مصر واليمن وصنعاء وعدن، يحملون في الموكب مئة حمل بنّ على العربات ويوزن بالقنطار، ويقول إوليا إنه لا يعرف شيخهم لأن القهوة مُحدَثة وإن شربها جاء من الشيخ الشاذلي. وفي التخنوسخانة يعمل ثلاثمئة رجل في طحن بنّ القسطنطينية كلها يذهب عشرها إلى الخزانة، مئة هاون تعمل دائماً وضجيجها كالرعد، يُدفَع عن كل أوقية بنّ مطحون ثلاثة آقجة للطاحن واثنتان للمفتّش، وبها ثلاثة أفران لتحميص البنّ. وفي خُصومة التجّار عند إوليا ردّ الجزّارون على تجّار مصر أن القهوة بدعة تقصّر النوم وقوّة الرجل، وبيوت القهوة بيوت فتنة، وأنها صُرِّح بتحريمها في مجموعات الفتاوى البزّازية والتترخانية، فأجاب التجّار أنهم يؤدّون عن سفنهم القادمة من مصر أحد عشر ألف كيس جمارك كل سنة. ويصف لين صنع القهوة المصرية: البنّ حديث التحميص مطحون يوضع في ماء يغلي ثم يُرفع وهي رغوية، قوية بلا سكر ولا لبن، وقد يُبخَّر الفنجان بالمصطكى أو يُعطَّر بالعنبر، ويُجلَب الفنجان للحوانيت من أقرب مقهى."
  en: "The kahveci traded, ground, roasted and served coffee. In Evliya's Istanbul procession the coffee-merchants (Attaran Kahve) were five hundred men in three hundred shops, great merchants each possessing a capital of a thousand purses in Egypt, Yemen, Sana'a and Aden; in the procession they load some hundred loads of coffee on wagons and weigh it out by the quintal, and Evliya says he does not know their sheykh, because coffee is a new invention, but the drinking of it comes from Sheikh Shazeli. At the Takhnus-khanah three hundred men grind coffee for all Constantinople, a tenth going to the Public Treasury; a hundred mortars are always at work with a noise like thunder, three aspers paid to the grinder and two to the Inspector for each occa of ground coffee, and three ovens roast the coffee there. In the merchants' dispute recorded by Evliya, the butchers answered the Egyptian merchants that coffee is an innovation which curtails sleep and the generating power in man, that coffee-houses are houses of confusion, and that it was declared illicit in the great fetwa collections called Bezazieh and Tartar-khanieh; the merchants replied that they pay no less than eleven thousand purses a year in customs on their fleet from Egypt. Lane describes the Egyptian making of coffee: the beans freshly roasted and pounded are put into boiling water, then poured while the surface is yet creamy, strong without sugar or milk, the cup sometimes fumigated with mastic or scented with ambergris, and fetched to the shops from the nearest coffee-shop."
  ur: "کاہوجی قہوہ کا تاجر، پیسنے، بھننے اور پروسنے والا ہے۔ اولیاء کے استنبول کے جلوس میں بن فروش ⁦(عطاران قہوہ)⁩ پانچ سو آدمی تین سو دکانیں تھے، بڑے تاجر جن میں سے ہر ایک کی مصر، یمن، صنعاء اور عدن میں ایک ہزار بکس سرمایہ؛ جلوس میں وہ گاڑیوں پر سو بوجھ بن چڑھاتے اور قنطار سے تولتے، اور اولیاء کہتا ہے کہ ان کا شیخ نہیں جانتا کہ قہوہ نئی چیز ہے، مگر اس کا پینا شیخ شاذلی سے آیا۔ تخنوسخانہ میں تین سو آدمی تمام قسطنطنیہ کے لیے بن پیسیں جس کا دہائی خزانہ کو جاتا؛ سو ہاون ہمیشہ چلتے جن کی آواز گرج جیسی، ہر اوقیہ پسے بن پر تین آقچہ پیسنے والے اور دو نگران کو، اور وہاں بن بھننے کے تین تنور۔ اولیاء کی تاجروں کی جھگڑے میں قصّابوں نے مصری تاجروں کو جواب دیا کہ قہوہ نئی چیز ہے جو نیند اور مرد کی قوت گھٹاتی، قہوہ خانے فتنے کے گھر، اور اسے بزازیہ اور تترخانیہ فتویٰ مجموعوں میں حرام کہا گیا؛ تاجروں نے جواب دیا کہ وہ مصر سے آنے والے بیڑے پر سالانہ گیارہ ہزار بکس محصول دیتے۔ لین مصری قہوہ بنانے کا طریقہ بتاتا ہے: تازہ بھنا کُٹا بن ابالتے پانی میں ڈالا جاتا، پھر جب سطح جھاگدار ہو چھڑایا، تیز بغیر شکر یا دودھ، کبھی فنجان مستکی سے بھپارا یا عنبر سے معطر کیا، اور دکانوں کے لیے قریب ترین قہوہ خانے سے منگوایا۔"
  es: "Los kahveci comerciaban, molían, tostaban y servían café. En la procesión de Evliya en Estambul, los comerciantes de café (Attaran Kahve) eran quinientos hombres en trescientas tiendas, grandes mercaderes que poseían cada uno un capital de mil bolsas en Egipto, Yemen, Sana'a y Adén; en la procesión cargan unos cien fardos de café en carros y lo pesan por quintales, y Evliya dice que no conoce a su sheykh, porque el café es un invento nuevo, pero el consumo de café viene del Sheikh Shazeli. En la Takhnus-khanah trescientos hombres muelen café para toda Constantinopla, una décima parte va al Tesoro Público; cien morteros están siempre en funcionamiento con un ruido como un trueno, se pagan tres aspers al molinillo y dos al inspector por cada occa de café molido, y tres hornos tuestan el café allí. En la disputa entre comerciantes registrada por Evliya, los carniceros respondieron a los comerciantes egipcios que el café es una innovación que reduce el sueño y la capacidad de generar energía en el hombre, que las cafeterías son casas de confusión y que fue declarado ilícito en las grandes recaudaciones de fetwa llamadas Bezazieh y Tartar-khanieh; los comerciantes replicaron que pagan no menos de once mil bolsas al año en aranceles por su flota procedente de Egipto. Lane describe la elaboración egipcia del café: los granos recién tostados y molidos se ponen en agua hirviendo, luego se vierten cuando la superficie aún está cremosa, fuerte sin azúcar ni leche, la taza a veces se fumiga con mástique o se perfuma con ámbar gris, y se lleva a las tiendas desde la cafetería más cercana."
