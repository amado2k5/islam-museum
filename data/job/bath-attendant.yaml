  techniques:
    ar: "يتولى الحمّامي تشغيل الحمّام: إشعال الكولهانة وتسخين الماء، وضبط الأجور، واستخدام الخدم ومحاسبتهم. ويعدد المدخل العاملين: التلّاك للرجال والناطر للنساء، وخدم الحمّام المعروفين بالكولهانجي والميدانجي والبشطمالجي والجقمجي والقهوجي، والغسّالين الذين يغسلون المناشف والبشطمالات ويعلّقونها على القفص للتنشيف."
    en: "The keeper ran the bath: firing the kulhane and heating the water, fixing the fees, and hiring and answering for the staff. The entry lists the tellak for men and the natar for women, the servants called hamam uşakları — kulhancı, meydancı, peştamalcı, çıkmacı, kahveci — and laundry workers who washed towels and peştamals and hung them to dry on the kafes."
    ur: "نگران حمام چلاتا ہے: کل خانے میں آگ جلا کر پانی گرم کرنا، اجرت مقرر کرنا، خادم رکھنا اور ان کی نگرانی کرنا۔ مدخل عملہ گناتا ہے: مردوں کے لیے دلاک ⁦(تلاک)⁩، عورتوں کے لیے ناطر، «حمام اوشاق» کہلانے والے خدمت گار — کلخانجی، میدانجی، پشتمالجی، چقماقی، قہوجی — اور دھوبی جو تولیے اور پشتمال دھو کر کافیس پر لٹکا کر سکھاتے تھے۔"
