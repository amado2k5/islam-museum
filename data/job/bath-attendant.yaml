summary:
  ar: "الحمّامي هو صاحب الحمّام أو مشغّله في العهد العثماني وما قبله: يشرف على تسخين الماء والوقود والأجور وخدم الحمّام من التلّاكين والنواطر وغيرهم. يذكر المدخل أن حمّامات المدن الإسلامية كانت كثيراً ما تكون وقفاً درّياً يخدم جمهور المسجد، وأن قاهرة القرن الثامن عشر عرفت لونجة للحمّامجية، وأن قوانين القضاء رتّبت العاملين تحت كفالة متسلسلة يمسك عنها أقدم الخدم، «سرنوبت تلّاك»."
  en: "The hammami is the owner or keeper who runs a public bath. The TDV entry shows city baths as waqf income-buildings serving mosque congregations, records an eighteenth-century Cairo bath-keepers' guild, and lists the staff under the keeper: the tellak washer in men's baths, the natar in women's, other bath servants and laundry workers, all bound under the kadılık nizamnamesi by chained surety with the senior servant, the sernöbet tellak, answerable."
  ur: "حمامی وہ مالک یا نگران ہے جو عوامی غسل خانے کو چلاتا ہے۔ ٹی ڈی وی کا مدخل شہر کے حماموں کو مسجد کی جماعت کی خدمت کرنے والا وقفی آمدنی عمارت بتاتا ہے، اٹھارویں صدی کے قاہرہ میں حمام والوں کی لونجہ درج کرتا ہے، اور نگران کے ماتحت عملہ گناتا ہے: مردوں کے حمام میں دلاک ⁦(تلاک)⁩، عورتوں کے حمام میں ناطر، دیگر خدمت گار اور دھونے سکھانے والے، جن سب کو قاضی کے نظام نامے نے زنجیری زمانت میں باندھا اور بڑے خادم «سر نوبت تلاک» کو جواب دار ٹھہرایا۔"
