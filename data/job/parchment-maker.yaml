summary:
  ar: "صانع الرُّقوق مُعِدُّ جلود البهائم صحفاً للكتابة: ينزع الشعر ويملّس الجلد حتى يقبل المداد، وكان الرُّقّ صحيفة المصاحف والدواوين قبل أن يعمّ الكاغد. عدّ إوليا الكيدرجية ⁦(صنّاع الرُّقوق)⁩ في إسطنبول ثلاثمئة رجل بثمانين دكاناً كلّهم يهود ومصنعهم عند خوجة باشا، وخلفهم مشى مصوّرو الرُّقوق ⁦(طورشجيان)⁩ يزيّنون دكاكينهم وأنفسهم بالرقوق المدهشة المصبوغة. ويصف أرنولد وغروهمان بقايا هذه الصنعة: مصحف مكتبة القاهرة المنسوب إلى الإمام جعفر بن محمد الصادق في مئتين وتسع ورقات من رقّ الغزلان، كُتب نحو سنة 720 م في تقدير شتيرن، وأوراق الرُّقوق التي لُزقت ظهور المصاحف وأغلفتها في مصر الفاطمية، والرقّ الأبيض الذي بقيت عليه مخطوطات بردية راينر. فلمّا راج الكاغد على صناعة الرُّقّ لم تمت، بل تحوّلت إلى صحف الفرمانات والمصاحف الجليلة."
  en: "The parchment-maker prepared the skins of animals into leaves for writing: he stripped the hair and dressed the skin until it took the ink, and the riqq was the leaf of Qur'an codices and chancery rolls before paper spread. Evliya counts the parchment-makers (Keiderjian) of Istanbul at three hundred men in eighty shops, all Jews, their manufactory at Khoja-pasha, and behind them walked the parchment-painters (Turshejian) adorning their shops and their own clothes with painted parchments. Arnold and Grohmann show what the craft left behind: the Cairo Library's codex ascribed to the Imam Ja'far b. Muhammad al-Sadiq on two hundred and nine leaves of gazelle parchment, dated by Stern to about 720 A.D.; the parchment leaves pasted into the covers of Fatimid-era Egyptian bindings; and the white parchments on which the Rainer-collection manuscripts survive. When paper rose the riqq trade did not die, but narrowed to the leaves of firmans and noble codices."
  ur: "رقّ ساز جانوروں کی کھالوں کو تحریر کے قابل صفحے بناتا تھا: بال اتار کر کھال کو اس وقت تک مہکاتا یہاں تک کہ سیاہی قبول کرے، اور کاغذ کے عام ہونے سے پہلے رق مصاحف اور فرمانوں کا کاغذ تھا۔ اولیاء استنبول کے رق سازوں ⁦(کیدرجیان)⁩ کو تین سو آدمی اسی دکانیں گنتا، سب یہودی، ان کی کارخانہ خوجہ پاشا کے پاس، اور ان کے پیچھے رقّ پر نقش بنانے والے ⁦(طورشجیان)⁩ چلے جو اپنی دکانیں اور اپنے کپڑے رنگین رقّوں سے سجاتے تھے۔ آرنلڈ اور گروہمان اس صنعت کی باقیات دکھاتے ہیں: قاہرہ لائبریری کا امام جعفر بن محمد صادق سے منسوب مصحف دو سو نو ہرن کے رق کے ورقوں پر، جسے شٹیرن نے تقریباً 720ء کا ٹھہرایا؛ فاطمی دور کی مصر کی جلدوں میں چسپاں رق کے ورق؛ اور وہ سفید رق جن پر رائنر ذخیرے کی کتابیں بچیں۔ جب کاغذ چلا تو رق کی صنعت مری نہیں بلکہ فرمانوں اور نفیس مصاحف کے صفحوں تک محدود ہو گئی۔"
  es: "El fabricante de pergaminos preparaba las pieles de los animales para convertirlas en hojas para escribir: les quitaba el pelo y las acondicionaba hasta que absorbían la tinta. El riqq era la hoja de los códices del Corán y los rollos de la cancillería antes de que se popularizara el papel. Evliya contabiliza a los fabricantes de pergaminos (Keiderjian) de Estambul en trescientos hombres repartidos en ochenta talleres, todos judíos, con su fábrica en Khoja-pasha. Tras ellos, caminaban los pintores de pergaminos (Turshejian), que adornaban sus talleres y sus propias vestimentas con pergaminos pintados. Arnold y Grohmann muestran el legado de este oficio: el códice de la Biblioteca de El Cairo atribuido al Imam Ja'far b. Muhammad al-Sadiq en doscientas nueve hojas de pergamino de gacela, datado por Stern alrededor del año 720 d. C.; las hojas de pergamino pegadas en las cubiertas de encuadernaciones egipcias de la época fatimí; y los pergaminos blancos en los que se conservan los manuscritos de la colección Rainer. Cuando surgió el papel, el comercio de riqq no murió, sino que se redujo a las hojas de firmans y códices nobles."
  fr: "Le parcheminier préparait les peaux d'animaux en feuilles pour l'écriture: il les épilait et les enduisait d'encre. Le riqq était la feuille utilisée pour les codex coraniques et les rouleaux de chancellerie avant l'apparition du papier. Evliya recense les parcheminiers (Keiderjian) d'Istanbul à trois cents hommes répartis dans quatre-vingts boutiques, tous juifs, leur atelier se trouvant à Khoja-pasha. Derrière eux, les peintres sur parchemin (Turshejian) ornaient leurs boutiques et leurs vêtements de parchemins peints. Arnold et Grohmann montrent l'héritage de cet artisanat: le codex de la Bibliothèque du Caire, attribué à l'imam Ja'far ben Muhammad al-Sadiq, composé de deux cent neuf feuilles de parchemin de gazelle et daté par Stern d'environ 720 apr. J.-C.; les feuilles de parchemin collées dans les couvertures des reliures égyptiennes de l'époque fatimide; et les parchemins blancs sur lesquels sont conservés les manuscrits de la collection Rainer. Lorsque le papier a fait son apparition, le commerce du riqq n'a pas disparu, mais s'est restreint aux feuilles de firmans et de codex nobles."
  tr: "Hayvan derilerini yazı yüzeyi olarak hazırlayan parşömen ustası, tüyleri temizler ve mürekkebi kabul etmesi için deriyi düzleştirirdi. Kağıt yaygınlaşmadan önce Kur'an ve resmi belgeler parşömen üzerine yazılıyordu. İstanbul'da Evliya Çıdarcı (parşömen ustası) seksen dükkânda üç yüz kişiden oluşuyordu ve hepsi Yahudiydi; atölyeleri Hoca Paşa'nın yakınındaydı. Onların arkasında, dükkanlarını ve kendilerini enfes renkli parşömenlerle süsleyen parşömen ressamları (Türşçiyan) dolaşıyordu. Arnold ve Grohmann bu zanaatın kalıntılarını şöyle anlatıyor: Kahire Kütüphanesi'ndeki İmam Cafer ibn Muhammed el-Sadık'a atfedilen ve Stern'in tahminine göre 720 civarında yazılmış, iki yüz dokuz sayfalık ceylan parşömeninden oluşan Kur'an; Fatımi Mısır'da Kur'an'ların arka ve kapaklarını bağlayan parşömen yaprakları; ve Rainer Papirüs el yazmalarının günümüze kadar ulaştığı beyaz parşömen. Kağıt, parşömen üretiminde yaygınlaştığında ortadan kaybolmadı, aksine hüküm sayfalarına ve yüce Kur'an'a dönüştü."
  id: "Pembuat perkamen, yang menyiapkan kulit hewan sebagai permukaan untuk menulis, akan menghilangkan bulu dan menghaluskan kulit agar dapat menerima tinta. Perkamen adalah dasar Al-Qur'an dan dokumen resmi sebelum kertas menjadi umum. Evliya Çıdarcı (pembuat perkamen) di Istanbul berjumlah tiga ratus orang di delapan puluh toko, semuanya Yahudi, dan bengkel mereka berada di dekat Khoja Pasha. Di belakang mereka berjalan para ilustrator perkamen (Türşçiyan), menghiasi toko dan diri mereka sendiri dengan perkamen berwarna indah. Arnold dan Grohmann menggambarkan sisa-sisa kerajinan ini: Al-Qur'an di Perpustakaan Kairo yang dikaitkan dengan Imam Ja'far ibn Muhammad al-Sadiq, terdiri dari dua ratus sembilan halaman perkamen kijang, ditulis sekitar tahun 720 M menurut perkiraan Stern; lembaran perkamen yang mengikat bagian belakang dan sampul Al-Qur'an di Mesir Fatimiyah; dan perkamen putih tempat manuskrip Papirus Rainer bertahan. Ketika kertas menjadi populer untuk pembuatan perkamen, kertas tidak punah, melainkan diubah menjadi halaman-halaman dekrit dan Al-Qur'an yang mulia."
