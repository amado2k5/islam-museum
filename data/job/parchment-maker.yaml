  techniques:
    ar: "يبقى من صنع الرُّقّ عندنا ما في الكتب لا ما في الرزنامة الحِرفية، لكن أثره قائم: يذكر أرنولد وغروهمان أن خشبتي الغلاف استُعملتا على عهد النبوة لضمّ الأوراق السائبة التي كُتبت عليها سُوَر القرآن، وأن فكرة الأغلفة الخشبية جاءت على الأرجح من الحبشة حيث كانت الكتب تجلَّد في أغلفة خشبية من قديم؛ ويصف مصحف جعفر الصادق المكتوب على مئتين وتسع ورقات من رقّ الغزلان وأغلفة الخشب المصمتة سنتمتراً بكسوة جلد بنيّ، وأوراق الرقّ الملصوقة داخل أغلفة المخطوطات المصرية الأولى، والرقّ الأصفر الجميل الذي يحفظ متوناً قبطية من القرن السابع، وحِزام الرقّ الذي تُشَدّ منه قطع في الزخرفة المفرّغة."
    en: "The making of parchment itself survives for us in books rather than in a guild manual, but its traces stand: Arnold and Grohmann relate that two wooden boards were used even in the Prophet's lifetime to enclose the loose leaves on which the sections of the Qur'an were written, and that the idea of wooden covers probably came from Abyssinia, where books had long been bound in wooden covers; they describe the Ja'far al-Sadiq codex written on 209 leaves of gazelle parchment, its centimetre-thick wooden boards in a brown leather cover; parchment leaves pasted inside the covers of early Egyptian manuscripts; the fine yellow parchment preserving Coptic texts of the seventh century; and the strips of parchment drawn through slits for openwork ornament."
    ur: "رق بنانے کی صنعت ہم تک دستورِ صنعت میں نہیں بلکہ کتابوں میں پہنچی، مگر اس کے آثار قائم ہیں: آرنلڈ اور گروہمان بتاتے ہیں کہ نبوت کے زمانے میں بھی دو لکڑی کی تختیاں قرآن کی سورتوں والے کھلے ورقوں کو جوڑنے کے لیے استعمال ہوتیں، اور لکڑی کی جلد کا تصور غالباً حبشہ سے آیا جہاں کتابیں پہلے سے لکڑی کی جلدوں میں بندتیں؛ وہ جعفر صادق کے مصحف کو بیان کرتے ہیں جو دو سو نو ہرن کے رق کے ورقوں پر ہے، ایک سینٹی میٹر موٹی لکڑی کی تختیوں میں بھوری چمڑے کی جلد؛ ابتدائی مصری کتابوں کی جلدوں کے اندر چسپاں رق کے ورق؛ ساتویں صدی کے قبطی متن سہولت سفید زرد رق پر؛ اور فریت کاری کے لیے شگافوں سے گزرنے والی رق کی پٹیاں۔"
