summary:
  ar: "صانع الرُّقوق مُعِدُّ جلود البهائم صحفاً للكتابة: ينزع الشعر ويملّس الجلد حتى يقبل المداد، وكان الرُّقّ صحيفة المصاحف والدواوين قبل أن يعمّ الكاغد. عدّ إوليا الكيدرجية ⁦(صنّاع الرُّقوق)⁩ في إسطنبول ثلاثمئة رجل بثمانين دكاناً كلّهم يهود ومصنعهم عند خوجة باشا، وخلفهم مشى مصوّرو الرُّقوق ⁦(طورشجيان)⁩ يزيّنون دكاكينهم وأنفسهم بالرقوق المدهشة المصبوغة. ويصف أرنولد وغروهمان بقايا هذه الصنعة: مصحف مكتبة القاهرة المنسوب إلى الإمام جعفر بن محمد الصادق في مئتين وتسع ورقات من رقّ الغزلان، كُتب نحو سنة 720 م في تقدير شتيرن، وأوراق الرُّقوق التي لُزقت ظهور المصاحف وأغلفتها في مصر الفاطمية، والرقّ الأبيض الذي بقيت عليه مخطوطات بردية راينر. فلمّا راج الكاغد على صناعة الرُّقّ لم تمت، بل تحوّلت إلى صحف الفرمانات والمصاحف الجليلة."
  en: "The parchment-maker prepared the skins of animals into leaves for writing: he stripped the hair and dressed the skin until it took the ink, and the riqq was the leaf of Qur'an codices and chancery rolls before paper spread. Evliya counts the parchment-makers (Keiderjian) of Istanbul at three hundred men in eighty shops, all Jews, their manufactory at Khoja-pasha, and behind them walked the parchment-painters (Turshejian) adorning their shops and their own clothes with painted parchments. Arnold and Grohmann show what the craft left behind: the Cairo Library's codex ascribed to the Imam Ja'far b. Muhammad al-Sadiq on two hundred and nine leaves of gazelle parchment, dated by Stern to about 720 A.D.; the parchment leaves pasted into the covers of Fatimid-era Egyptian bindings; and the white parchments on which the Rainer-collection manuscripts survive. When paper rose the riqq trade did not die, but narrowed to the leaves of firmans and noble codices."
  ur: "رقّ ساز جانوروں کی کھالوں کو تحریر کے قابل صفحے بناتا تھا: بال اتار کر کھال کو اس وقت تک مہکاتا یہاں تک کہ سیاہی قبول کرے، اور کاغذ کے عام ہونے سے پہلے رق مصاحف اور فرمانوں کا کاغذ تھا۔ اولیاء استنبول کے رق سازوں ⁦(کیدرجیان)⁩ کو تین سو آدمی اسی دکانیں گنتا، سب یہودی، ان کی کارخانہ خوجہ پاشا کے پاس، اور ان کے پیچھے رقّ پر نقش بنانے والے ⁦(طورشجیان)⁩ چلے جو اپنی دکانیں اور اپنے کپڑے رنگین رقّوں سے سجاتے تھے۔ آرنلڈ اور گروہمان اس صنعت کی باقیات دکھاتے ہیں: قاہرہ لائبریری کا امام جعفر بن محمد صادق سے منسوب مصحف دو سو نو ہرن کے رق کے ورقوں پر، جسے شٹیرن نے تقریباً 720ء کا ٹھہرایا؛ فاطمی دور کی مصر کی جلدوں میں چسپاں رق کے ورق؛ اور وہ سفید رق جن پر رائنر ذخیرے کی کتابیں بچیں۔ جب کاغذ چلا تو رق کی صنعت مری نہیں بلکہ فرمانوں اور نفیس مصاحف کے صفحوں تک محدود ہو گئی۔"
