summary:
  ar: "الشاعر من عبّر عن علمه وحدسه وعواطفه بكلام موزون محكم، وكانت له عند العرب قبل الإسلام منزلة ناطق القبيلة والمدافع عنها حتى صار من قال الشعر في القبيلة سيداً مأمولاً. رتّب اللغويون الشعراء طبقات منذ ابن سلام الجمحي، وكان شعراء الجاهلية يتسابقون في الأسواق الموسمية أمام حُكّام من الشعراء، ويذكر المدخل أن رواة كل شاعر كانوا يحفظون شعره ويبلّغونه، وأن كثيراً من الشعراء تتلمذوا على يد من سبقهم من الشعراء الكبار. وفي العصر العثماني قام الشاعر في بلاط السلاطين وأروقة الصوفية حتى صارت الصنعة في العصر الحديث صاحبة كراسي الأدب ومجالسها."
  en: "The sha'ir is the one who voices knowledge, intuition and emotion in measured, harmonious speech; in pre-Islamic Arabia the poet stood as his tribe's spokesman and champion, a position that could earn him the title sayyid, and a tribe without a poet was counted worthless. The philologists ranked poets in generations from Ibn Sallam al-Jumahi onward; the Jahiliyya poets competed at the seasonal fairs before poet-arbiters, while each poet's râvîs memorised and carried his verse, and many later poets were formed at the hand of the masters before them. In the Ottoman world the poet stood at the sultans' courts and in the Sufi lodges, and in modern times the office continues in the chairs and circles of literature."
  ur: "شاعر وہ ہے جو اپنے علم، وجدان اور احساس کو مزون اور محکم کلام میں ظاہر کرے؛ جاہلی عرب میں شاعر اپنی قوم کا ترجمان اور محافظ تھا اور یہ منصب اسے سید کا لقب بھی دلوا سکتا تھا، جس قوم کا شاعر نہ ہو وہ بے وقار سمجھی جاتی۔ ماہرین لغت نے ابن سلام الجمحی سے شاعروں کو طبقات میں بانٹا؛ جاہلی شاعر سالانہ میلوں میں شاعر حکام کے سامنے مقابلہ کرتے، ہر شاعر کے راوی اس کی شاعری یاد کر کے منتقل کرتے، اور بہت سے شاعر بزرگ اساتذہ کے ہاتھوں تربیت پاتے۔ عثمانی دنیا میں شاعر سلاطین کے دربار اور خانقاہوں میں موجود رہا اور عصر حاضر میں یہ پیشہ ادب کی نشستوں اور مجلسوں میں جاری ہے۔"
