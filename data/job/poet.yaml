training:
  mode: apprenticeship
  certification: "No diploma; a poet was made by memorising and transmitting the poetry of the ancients — the entry notes that many poets grew through the râvî experience of keeping and reciting older verse, and by long service at the side of a master poet; in the divan tradition the nazire custom of writing in imitation of an acknowledged master continued the same master-apprentice formation."
  duration: "Long formation beside a master and inside the tradition; the ŞİİR entry describes the rawi-school of the ancient Arabs as an usta-çırak (master-apprentice) method in which each poet's own râvîs memorised and transmitted his verse."
