places:
  - { place: place/ukaz, note: "At the seasonal fairs of Arabia the poets competed before arbiters who were themselves poets; the tradition names the seven Mu'allaqat poets — Imru' al-Qays, Tarafa, al-Harith ibn Hilliza, Amr ibn Kulthum, Zuhayr ibn Abi Sulma, Antara and Labid — among those chosen in these contests.", sources: [source/tdv-sair] }
  - { place: place/baghdad, note: "In the long Abbasid period the poets were classified by how far their verse could serve as linguistic proof: the muwallad (non-pure Arab), the muhdath (modern) and the muta'akhkhir (late) categories, with Bashshar ibn Burd reckoned the first of the muhdath poets.", sources: [source/tdv-sair] }
  - { place: place/istanbul, note: "The Ottoman sections treat the poet's place at the sultans' courts and in the divan tradition, where the nazire (imitation) custom formed young poets by modelling them on the masters.", sources: [source/tdv-sair, source/tdv-siir] }
