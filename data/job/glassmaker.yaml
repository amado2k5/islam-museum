  techniques:
    ar: "يذيب الزجّاج رمل السيليكا مع البوتاس أو الصودا والجير في ١٥٠٠–١٦٠٠ درجة، ثم يشكّل العجينة اللدنة في ١١٠٠–١٢٠٠ درجة نفخاً ببيبة النفخ — تقنية اكتُشفت في الشام في القرن الأول ق.م. — أو قولبة في القوالب أو كسماً وتراشيحاً. وللنوافذ المنقوشة ⁦(روزن)⁩ كان يُرسم النموذج على لوح، وتُقطع الزجاجات الملوّنة أكبر قليلاً وتُثبَّت في قالب طيني ثم يُصبّ عليها الجصّ السائل ليحيط بحوافها شبكةً جصية؛ وفي بايقوز صُنع زجاج الأوبال بإضافة رماد العظم وأكسيد القصدير إلى الحرمان، والجشم بولبول بغمس الفِسق في قالب من القضبان الملوّنة ثم نفخه من جديد."
    en: "The glassmaker melts silica sand with potash or soda and lime at 1500-1600°C, then works the hot gather at 1100-1200°C — blown on the blowpipe (a technique found in Syria in the first century BC), cast in moulds, or cut and engraved. For revzen stained-glass windows the design was drawn on a board, the coloured glasses cut oversize, bedded in a clay mould and flooded with liquid plaster so a plaster lattice gripped their edges. At Beykoz, opal glass was made with calcined bone ash and tin oxide in the batch, and çeşmibülbül by dipping the gather into a mould of coloured glass rods and blowing it again."
    ur: "شیشہ ساز سلیکا ریت کو پوتاش یا سوڈا اور چونے کے ساتھ ۱۵۰۰–۱۶۰۰ درجے پر پگھلائے پھر گرم لوندے کو ۱۱۰۰–۱۲۰۰ درجے پر پھونک نلے سے پھولاتا ⁦(یہ تکنیک شام میں پہلی صدی ق م میں ایجاد ہوئی)⁩، سانچے میں ڈھالتا یا تراشتا۔ رَوزن کھڑکیوں کے لیے نقش تختی پر کھینچا، رنگین شیشے بڑے کاٹے، مٹی کے سانچے میں بسائے اور پگھلا پلستر ڈالا جو کنارے پکڑ کر جالی بن گیا۔ بیکوز میں اوپل شیشہ ہڈی کی راکھ اور ٹن آکسائیڈ سے بنا، اور چشم بلبول لوندے کو رنگین سلاخوں کے سانچے میں ڈبو کر دوبارہ پھونکنے سے۔"
