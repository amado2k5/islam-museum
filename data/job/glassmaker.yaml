summary:
  ar: "الزجّاج ⁦(جامكَران)⁩ هو صانع الزجاج: يذيب رمل السيليكا مع البوتاس أو الصودا والجير في نحو ١٥٠٠–١٦٠٠ درجة ويشكّله وهو لدن نفخاً بالبيبة أو قولبة أو كسماً. يتابع المدخل الحرفة من قوارير مصر والشام القديمة إلى قناديل المساجد المملوكية المذهّبة والمينائية في حلب ودمشق والرقّة، ثم ورش بايقوز العثمانية من صنع محمد دده المولوي ومصنع البلّور بإنجيركوي، وفنّ الروزن المنقوش الذي تذكر دفاتر بناء السليمانية صنّاعه «جامكَران» عام ١٥٥٧م."
  en: "The glassmaker (zajjāj, Ottoman camcı/camger) melts silica sand with potash or soda and lime at 1500-1600°C and shapes the gather by blowing, casting or cutting. The entry follows the craft from ancient Egyptian and Syrian vessels to the gilded and enamelled mosque lamps Mamluk sultans ordered from Aleppo, Damascus and Raqqa, the Ottoman Beykoz workshops founded by the Mevlevi Mehmed Dede and the İncirköy crystal factory, and the revzen-i menkūş stained-glass craft whose 'camgerân' masters appear in the Süleymaniye construction registers of 1557."
  ur: "شیشہ ساز ⁦(زجاج، جمکران)⁩ سلیکا ریت کو پوتاش یا سوڈا اور چونے کے ساتھ ۱۵۰۰–۱۶۰۰ درجے پر پگھلا کر پھونک، سانچے یا تراش سے شکل دیتا ہے۔ مدخل پیشے کو قدیم مصری اور شامی برتنوں سے مملوک سلطانوں کے حلب، دمشق اور رقہ سے منگوائے سنہری اور مینا کاری مسجدی چراغوں تک، پھر درویش محمد دیدہ کے قائم کردہ بیکوز ورشوں اور انجرکوئی بلور فیکٹری تک، اور رَوزنِ منکوش کڑی کاری تک لے جاتا ہے جس کے «جمکران» استاد ۱۵۵۷ء کے سلیمانیہ تعمیراتی دفتروں میں درج ہیں۔"
  es: "El vidriero (zajjāj, en otomano camcı/camger) funde arena de sílice con potasa o sosa y cal a 1500-1600 °C y da forma a la masa soplando, fundiendo o cortando. La entrada recorre la historia de este oficio desde los antiguos recipientes egipcios y sirios hasta las lámparas de mezquita doradas y esmaltadas que los sultanes mamelucos encargaron a Alepo, Damasco y Raqqa, los talleres otomanos de Beykoz fundados por el mevleví Mehmed Dede y la fábrica de cristal de İncirköy, y el arte de las vidrieras revzen-i menkūş, cuyos maestros 'camgerân' aparecen en los registros de construcción de Süleymaniye de 1557."
  fr: "Le verrier (zajjāj, camcı/camger ottoman) fait fondre du sable siliceux avec de la potasse ou de la soude et de la chaux à 1500-1600 °C et façonne la pâte par soufflage, moulage ou découpe. Cet article retrace l'histoire de cet artisanat, depuis les vases de l'Égypte et de la Syrie antiques jusqu'aux lampes de mosquée dorées et émaillées commandées par les sultans mamelouks à Alep, Damas et Raqqa, en passant par les ateliers ottomans de Beykoz fondés par le Mevlevi Mehmed Dede et la cristallerie d'İncirköy, et l'art du vitrail revzen-i menkūş dont les maîtres verriers « camgerân » figurent dans les registres de construction de Süleymaniye de 1557."
  tr: "Cam ustası (Çakaran), silika kumunu potasyum veya soda ve kireçle yaklaşık 1500-1600 derece Celsius'ta eritir ve henüz şekillendirilebilir haldeyken üfleme, kalıplama veya döküm yoluyla şekillendirir. Giriş bölümü, bu zanaatın izini eski Mısır ve Levant şişelerinden, Halep, Şam ve Rakka'daki Memlük camilerinin yaldızlı ve mina tarzı lambalarına, ardından Osmanlı Baykoz atölyelerine (Mehmet Dede Mevlevi) ve İncirköy kristal fabrikasına ve 1557 yılında Süleymaniye yapı kayıtlarında adı geçen \"Çakaran\" ustalarının yer aldığı gravürlü cam sanatına kadar sürer."
  id: "Pembuat kaca (Camkaran) melelehkan pasir silika dengan kalium karbonat atau soda dan kapur pada suhu sekitar 1500–1600 derajat Celcius dan membentuknya selagi masih lunak dengan cara meniup, mencetak, atau menuang. Pendahuluan ini menelusuri kerajinan tersebut dari botol-botol Mesir kuno dan Levant hingga lampu-lampu berlapis emas dan bergaya mina dari masjid-masjid Mamluk di Aleppo, Damaskus, dan Raqqa, kemudian ke bengkel Baykoz Ottoman milik Mehmet Dede Mawlawi dan pabrik kristal İncirkoy, serta seni kaca berukir, yang pembuatnya, \"Camkaran,\" disebutkan dalam catatan bangunan Süleymaniye pada tahun 1557 M."
