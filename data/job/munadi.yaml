summary:
  ar: "المنادي هو صوت الدولة والجماعة قبل الآليات: ينادي في الأسواق والمساجد والطرق بالإعلانات والفرمانات ودعوات الاجتماع، وفي الحرب بالتعبئة والزحف، ومنه انشقّت مهن متخصصة — فالمؤذّن تخصّص بالنداء إلى الصلاة، والدلال بالنداء على السلع، ورسول السلطان بالحمل الشخصي للأمر. أقدم وظائف الكلمة المسموعة في الحياة العامة؛ نادى مؤذّن النبي «الصلاة جامعة» في يوم الأحزاب، وأذّن مؤذّن الفتح في مكة يوم الفتح، وظل المنادي في المدن الإسلامية يعلن الغرامات والأسعار الرسمية والأعياد والمناسبات حتى حلّت محله المطابع ثم الإذاعة."
  en: "The munadi was the voice of state and community before machines: he cried proclamations, edicts and calls to assemble in the markets, mosques and streets, and mobilisation in war. Specialised trades split off from him — the muezzin for the call to prayer, the auction-dallal for goods, the ruler's messenger for the personal carrying of orders. It is the oldest of the public spoken-word offices: the Prophet's crier called 'al-salatu jami'a' on the day of the Confederates and the crier of the conquest announced in Mecca, and the munadi went on proclaiming fines, official prices, festivals and occasions in Islamic cities until the press and then broadcasting took his place."
  ur: "منادی مشینوں سے پہلے ریاست اور جماعت کی آواز تھا: بازاروں، مسجدوں اور سڑکوں پر اعلانات، فرمان اور اجتماع کی دعوت دیتا اور جنگ میں نفیر عام کرتا۔ اسی سے مخصوص پیشے الگ ہوئے — اذان کے لیے مؤذّن، مالِ تجارت کے لیے دلال، اور حکمران کے حکم پہنچانے کے لیے رسول۔ عوامی بولے جانے والے مناصب میں یہ سب سے قدیم ہے: غزوہِ احزاب میں نبی کے منادی نے «الصلوٰۃ جامعہ» پکارا اور فتح مکہ کے دن منادی نے اعلان کیا؛ فیر مطبعہ اور بعد میں ریڈیو نے اس کی جگہ لی۔"
  es: "El munadi fue la voz del Estado y de la comunidad antes de la llegada de las máquinas: proclamaba edictos y convocaba a la asamblea en los mercados, mezquitas y calles, y movilizaba en tiempos de guerra. De él surgieron oficios especializados: el muecín para la llamada a la oración, el subastador para las mercancías, el mensajero del gobernante para la entrega personal de órdenes. Es el más antiguo de los cargos públicos de palabra hablada: el pregonero del Profeta, llamado «al-salatu jami'a», anunciaba el día de la Confederación y el pregonero de la conquista en La Meca, y el munadi continuó proclamando multas, precios oficiales, festivales y ocasiones en las ciudades islámicas hasta que la prensa y, posteriormente, la radiodifusión, lo reemplazaron."
  fr: "Avant l'avènement des machines, le munadi était la voix de l'État et de la communauté: il proclamait les édits, les proclamations et les appels à se rassembler sur les marchés, dans les mosquées et les rues, ainsi que les appels à la mobilisation en temps de guerre. Des fonctions spécialisées se sont développées à partir de lui: le muezzin pour l'appel à la prière, le dallal pour la vente aux enchères de marchandises, le messager du souverain pour la transmission personnelle des ordres. Il s'agit de la plus ancienne des fonctions publiques de transmission orale: le crieur du Prophète annonça « al-salatu jami'a » le jour de la Confédération et le crieur public proclama la conquête à La Mecque. Le munadi continua de proclamer les amendes, les prix officiels, les fêtes et les événements dans les villes islamiques jusqu'à ce que la presse, puis la radiodiffusion, prennent le relais."
