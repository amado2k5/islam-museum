  techniques:
    ar: "يصف إوليا أقسام الحرفة: فالسرّاجون يزيّنون دكاكينهم بالسروج المطّرزة والجِعاب وقوارير السفر، وصنّاع أشجار السروج ⁦(كَلطكجيان)⁩ ثلاثمئة بمئة دكان يعرضون أشجاراً شامية، وصنّاع جلّ السرج ⁦(مُبتِلجيان)⁩ مئة بخمسين دكاناً يحملون الجلل وأكياس السرج واللجام وأغماد المسدسات على الأعمدة، وصنّاع جلّ السرج المطّرز ⁦(تكلتجيان)⁩ مئة وخمسة بتسعةٍ وأربعين دكاناً، والسَّمَرية ⁦(تالندوزان)⁩ ألف بخمسمئة دكان يعرضون سروج الحمل على صغار الحمير والبغال والماعز، وصنّاع اللجم ⁦(جَوَنجيان)⁩ أربعمئة بمئة دكان يعرضون آلاف اللجم المطعّمة بالذهب والفضة ومنهم مئة استاذ ممتاز ملحقون بالإصطبلات السلطانية. وفي الموكب تمرّ الخيول مكسوّة بالزهور والمراكب."
    en: "Evliya splits the craft into its branches: the saddlers adorn their shops with embroidered saddles, holsters and field-bottles; the saddle-tree makers (Kaltakjian), three hundred men in a hundred shops, display Syrian saddle-trees; the saddle-cloth makers, a hundred men in fifty shops, carry cloths, saddle-bags, halters and pistol-cases on poles; the embroidered saddle-cloth makers (Tekeltijian) are a hundred and five men in forty-nine shops; the sumpter-saddle makers (Semerjian or Talanduzan), a thousand men in five hundred shops, lay small pack-saddles on young asses, mules and goats as they pass; and the bridle-makers (Jevanjian), four hundred men in a hundred shops, show thousands of bridles inlaid with gold and silver, a hundred of them excellent masters attached to the Imperial stables. In the procession the horses pass caparisoned in flowers and trappings."
    ur: "اولیاء اس ہنر کی شاخیں گنتا ہے: سراج اپنی دکانیں کڑھائی دار زینوں، پستول کے غلاف اور سفری مشکوں سے سجاتے ہیں؛ زین کے ڈھانچے بنانے والے ⁦(کلطکجیان)⁩ تین سو آدمی سو دکانیں شامی ڈھانچے دکھاتے ہیں؛ جلو بنانے والے سو آدمی پچاس دکانیں جل، زین کی تھیلیاں، رسیاں اور پستول غلاف بانسوں پر اٹھائے چلتے ہیں؛ کڑھائی دار جلو ساز ⁦(تکلتیجیان)⁩ ایک سو پانچ آدمی انچاس دکانیں؛ سمری زین ساز ⁦(تالندوزان)⁩ ہزار آدمی پانچ سو دکانیں چھوٹی سی زمہ، خچروں اور بکروں پر زینیں رکھ کر نکلتے ہیں؛ اور لگام ساز ⁦(جونجیان)⁩ چار سو آدمی سو دکانیں ہزاروں سونے چاندی جڑی لگامیں دکھاتے ہیں جن میں سو استاد شاہی استبل سے وابستہ ہیں۔ جلوس میں گھوڑے پھولوں اور جھالروں میں سجے نکلتے ہیں۔"
