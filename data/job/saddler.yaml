summary:
  ar: "السرّاج صانع السروج ورحالاتها ولجمها وحبالتها، ولأن الجيش لا يستغني عنه حازت طائفته عند العثمانيين التقدّم على سائر الطوائف. يعدّ إوليا جلبي في إسطنبول السرّاجين خمسة آلاف رجل بألفٍ وأربعٍ وثمانين دكاناً، بيرُهم أبو نصر خُسَيم البغدادي الذي تقلّده سلمان الفارسي، وتتفرّع عنهم طوائف صنّاع جلّ السرج وأشجار السروج والسَّمَرية ولُجُم الذهب والفضة؛ وكان لهم خانقاه حصينة بأربعة أبواب ومسجد بناها محمد الفاتح سنة 859 هـ لا يُقاس بها مصنع سرّاج في العرب ولا فارس، ويجتمعون كل عشرين سنة في مرج كاغذخانة في موسم عشرين يوماً."
  en: "The sarraj made saddles, pack-saddles, saddle-cloths and bridles; because a camp cannot do without them, the Ottoman saddlers took rank before every other corporation. Evliya Çelebi counts the Istanbul saddlers at five thousand men with 1,084 shops, their patron Abu Nasr Khusaym of Baghdad who was girded by Selman Pak; around them worked the saddle-cloth makers, saddle-tree makers, sumpter-saddle makers and the bridle-makers whose gold- and silver-inlaid work filled the shops. Their factory, a walled compound with four gates, a courtyard basin and a mosque built by Mehmed II in 859 AH, had no equal in Arabia or Persia, and the whole guild reassembled every twenty years in the meadows of Kaghid-khanah for a twenty-day season."
  ur: "سراج زین، پالان، جلوں اور لگام بنانے والا ہے؛ فوج کے لشکر اس کے بغیر نہ چل سکتی تھی اس لیے عثمانیوں میں اس کی انجمن کو سب سے پہلا درجہ ملا۔ اولیاء چلبی استنبول کے سراجوں کو پانچ ہزار آدمی اور ۱۰۸۴ دکانیں لکھتا ہے، ان کا پیر بغداد کا ابو نصر خسيم ہے جسے سلمان پاک نے کمر بند پہنائی؛ ان کے گرد جلو ساز، زین کے لکڑی کے ڈھانچے بنانے والے، سمری زین ساز اور سنہری چاندی کی جڑائی لگام بنانے والے تھے۔ ان کا کارخانہ چار دروازوں، صحن کے حوض اور مسجد والا قلعہ نما عمارت تھا جو محمد فاتح نے ۸۵۹ھ میں بنوایا اور عرب یا فارس میں اس کی ہمسر نہ تھی، اور پوری انجمن ہر بیس سال کاغذخانہ کے میدان میں جمع ہو کر بیس دن کی جشن مناتی۔"
  es: "El sarraj fabricaba sillas de montar, alforjas, mantillas y bridas; dado que un campamento no podía prescindir de ellas, los talabarteros otomanos tenían prioridad sobre cualquier otro gremio. Evliya Çelebi contabiliza a los talabarteros de Estambul en cinco mil hombres con 1084 talleres, cuyo patrón era Abu Nasr Khusaym de Bagdad, quien fue ceñido por Selman Pak; a su alrededor trabajaban los fabricantes de mantillas, armazones, sillas de montar y bridas, cuyas obras con incrustaciones de oro y plata llenaban los talleres. Su fábrica, un recinto amurallado con cuatro puertas, un estanque en el patio y una mezquita construida por Mehmed II en el año 859 de la Hégira, no tenía igual en Arabia ni en Persia, y todo el gremio se reunía cada veinte años en los prados de Kaghid-khanah durante una temporada de veinte días."
