craft:
  techniques:
    ar: "صنعة الدَّقَّاق صنعة تنقية وطحن وتوريد: تنخيل الحنطة قبل الطحن لإخراج الزوان والغبار، وندى الحب اليسير وهو يُطحَن ليبيضّ ويطيب؛ والرقابة على الدقيق من خلط دقيق الشعير والحمّص والفول والطحين على رحى غير مستوية وغبار الرحى؛ ويُستلَم بالوزن ويُسلَّم بالوزن، ولكل جرّ قرعة باسم صاحبه ومسكنه على المقبض، ولا اختلاط في بثوق الرحى، وموزّعو الدقيق للبيوت من أهل الأمانة. والتلِّيس ثلاثة بطّات كل بطّة خمسون رطلاً."
    en: "The flour-merchant's craft is cleaning, milling and delivering: the wheat sieved before milling to bring out the darnel and dust, and sprinkled lightly as it grinds so the flour comes out white and sweet; the flour guarded against sieved barley flour, chick-pea and bean flour, uneven-millstone milling and mill dust; flour received and delivered by weight; every jar with its gourd-label of owner and dwelling tied to the handle; no mingling in the mill-hopper; and household delivery by honourable, trustworthy men. The tillis sack is three battas, each batta fifty ratls."
    ur: "دقّاق کا ہنر صفائی، پیسائی اور پہنچائی ہے: پیسنے سے پہلے گندم چھانی جائے کہ زوان اور غبار نکلے، اور پستے وقت ہلکا سا بھیگوئی جائے کہ آٹا سفید اور پَک نکلے؛ آٹے کو چھنے جَو کے آٹے، چنے اور لوبیے کے آٹے، ٹیڑھی چکی کے پیسے اور چکی کی خاک سے بچایا جائے؛ آٹا تول کر لیا اور دیا جائے؛ ہر گھڑے پر مالک و پتہ لکھا تومبہ دستے سے بندھا؛ چکی کے کھپ میں اختلاط نہیں؛ اور گھروں کی ترسیل امانت داروں کے ذمے۔ تلیس کی بوری تین بطّہ ہوتی، ہر بطّہ پچاس رطل۔"
