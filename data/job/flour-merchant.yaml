summary:
  ar: "الدَّقَّاق بائع الدقيق ومورّد المطاحن والأفران، وصنفته جنباً إلى جنب مع الحَبّاب في كتب الحسبة. يأمر الشيزري أن تُنخَل الحنطة قبل طحنها فيُزال الزوان والغبار، وأن يُنَدّى الحب ندىً يسيراً وهو يُطحَن فيبيضّ ويطيب؛ وعلى المحتسب أن يحرس الدقيق من خلط دقيق الشعير المنخول به ودقيق الحمّص والفول وما طحن على رحى غير مستوية ومن غبار الرحى، فإن اشتبه فيهم حلّفهم. وللمصلحة العامة يفرض المحتسب عليهم قدراً يومياً من الدقيق يوزَّع على الدكاكين والأفران. ويفصّل ابن الأخوة الطريق من الرحى إلى البيت: يُنقّى الحب من التراب قبل الطحن وتُجدَّد المناخل دورياً، ويُمتحَن الدقيق من خلط دقيق الحمّص ويُمنع الطحن على فتات الرحى البالي؛ وترتاح بهائم الطحن ولا تُطحَن بها أكثر من وَيبة؛ وتُفحَص الموازين والمكاييل والجرار، ويُستَلَم الدقيق بالوزن ويُسلَّم بالوزن، وعلى كل جرّ اسم صاحبه ومسكنه مكتوباً في قرعة معلّقة بالمقبض لئلا يختلط بغيره، ولا يُخلَط دقيق شخص بغيره في بثوق الرحى؛ والذين يوصّلون الدقيق إلى البيوت لا بد أن يكونوا من أهل الشرف والأمانة لأنهم يدخلون البيوت ويخالطون الصبيان والإماء. وفي موكب إسطنبول عدّ إوليا تجار الدقيق ⁦(أونلِكجيان)⁩ ثلاثة آلاف رجل أكثرهم فلاحون مصريون، وجوههم وأعينهم وثيابهم كلها بيض من الدقيق، يمرّون على العربات رافعين الأكياس منادين «الله ينصر السلطان»، وبيرهم رمضان ابن الشيخ الشاذلي."
  en: "The daqqaq sold flour and fed the mills and bake-houses, standing in the hisba books beside the grain-merchant. Al-Shayzari orders that the wheat be sieved before milling so that the darnel and dust come out, and that the grain be lightly sprinkled while it is milled so that it comes out white and wholesome; the muhtasib must watch the flour against admixture with sieved barley flour, bean and chick-pea flour, flour milled on an uneven millstone and the dust of the mill — and if he doubts them he makes them swear. For the common good the muhtasib sets them a daily quota of flour to be distributed to the shops and bakeries. Ibn al-Ukhuwwa details the road from millstone to house: the grain cleansed of earth before grinding and the sieves renewed periodically; the flour tested against chick-pea flour and barred from milling on worn millstone-particles that harm men; the mill-beasts given their daily rest and never grinding more than a wayba; scales, measures and jars inspected; flour received and delivered by weight; every jar carrying its owner's name and dwelling written in a gourd tied to the handle so that it is not confused with another's; one person's flour never mingled with another's in the mill-hopper; and the men who deliver flour into houses required to be honourable and trustworthy, for they enter men's houses and converse with their children and slave-women. In Evliya's Istanbul procession the flour-merchants (Unilekjian) were three thousand men, mostly Egyptian peasants, their faces, eyes and dresses all white with flour, passing on wagons with the flour-bags in their hands crying 'May God give victory to the Sultan'; their patron is Ramazan the son of Sheikh Shadeli."
  ur: "دقّاق آٹا بیچتا اور چکیوں اور تنورخانوں کو فراہمی کرتا، کتبِ حسبہ میں حبّاب کے ساتھ اس کا باب آتا ہے۔ الشیزری حکم دیتا ہے کہ گندم پیسنے سے پہلے چھانی جائے کہ زوان اور غبار نکل جائے، اور پستے وقت دانے ہلکا سا بھیگویا جائے کہ آٹا سفید اور پَک نکلے؛ محتسب آٹے کی نگرانی کرے کہ اس میں چھنا جَو کا آٹا، چنے اور لوبیے کا آٹا، ٹیڑھی چکی کا پسا اور چکی کی خاک نہ ملی ہو، اور شک ہو تو قسم دلائے۔ فلاحِ عام کے لیے محتسب روز کا ایک مقررہ وزن مقرر کرے جو دکانوں اور تنورخانوں میں بانٹا جائے۔ ابن الاخوہ چکی سے گھر تک کا راستہ تفصیل دیتا ہے: پیسنے سے پہلے دانہ مٹی سے صاف، چھلنیاں وقتاً فوقتاً نئی؛ آٹا چنے کے آٹے کی ملاوٹ سے پرکھا جائے اور گھسی چکی کے ذروں پر پیسنا ممنوع؛ پیسنے والے جانوروں کو روز آرام اور ایک وقت میں ایک ویبہ سے زیادہ نہ؛ ترازو، ناپ اور گھڑے پرکھے جائیں؛ آٹا تول کر لیا اور دیا جائے؛ ہر گھڑے پر مالک کا نام اور پتہ تومبے میں لکھ کر دستے سے بندھا کہ دوسرے سے نہ ملے؛ ایک کے آٹے کا دوسرے کے ساتھ چکی کے کھپ میں اختلاط نہ ہو؛ اور گھروں تک آٹا پہنچانے والے ناموس اور امانت دار ہوں کہ وہ گھروں میں جاتے اور بچوں اور لونڈیوں سے ملتے ہیں۔ اولیاء کے استنبول کے جلوس میں آٹا فروش ⁦(اونلکجیان)⁩ تین ہزار آدمی تھے، اکثر مصری دہقان، جن کے چہرے، آنکھیں اور کپڑے سب آٹے سے سفید، گاڑیوں پر آٹے کی بوریاں اٹھائے «اللہ سلطان کو فتح دے» پکارتے نکلتے؛ ان کا پیر شیخ شاذلی کا بیٹا رمضان ہے۔"
  es: "El daqqaq vendía harina y abastecía los molinos y panaderías, de pie en los libros de hisba junto al comerciante de grano. Al-Shayzari ordena que el trigo sea tamizado antes de molerlo para que salgan la cizaña y el polvo, y que el grano sea rociado ligeramente mientras se muele para que salga blanco y sano; el muhtasib debe vigilar la harina para evitar que se mezcle con harina de cebada tamizada, harina de frijol y garbanzo, harina molida en una piedra de molino irregular y el polvo del molino, y si duda de ellos, los hace jurar. Para el bien común, el muhtasib les asigna una cuota diaria de harina para distribuir a las tiendas y panaderías. Ibn al-Ukhuwwa detalla el camino desde la piedra de molino hasta la casa: el grano limpiado de tierra antes de molerlo y los tamices renovados periódicamente; la harina probada contra la harina de garbanzo y prohibida de moler en las partículas desgastadas de la piedra de molino que dañan a los hombres; Las bestias del molino recibían su descanso diario y nunca molían más de un wayba; las balanzas, medidas y jarras eran inspeccionadas; la harina se recibía y entregaba por peso; cada jarra llevaba el nombre y la vivienda de su dueño escritos en una calabaza atada al asa para que no se confundiera con la de otro; la harina de una persona nunca se mezclaba con la de otra en la tolva del molino; y los hombres que entregaban harina a las casas debían ser honorables y dignos de confianza, pues entraban en las casas de los hombres y conversaban con sus hijos y mujeres esclavas. En la procesión de Evliya en Estambul, los comerciantes de harina (Unilekjian) eran tres mil hombres, en su mayoría campesinos egipcios, con los rostros, los ojos y las vestimentas completamente blancos de harina, pasando en carros con los sacos de harina en las manos gritando \"¡Que Dios dé la victoria al Sultán!\"; su patrón es Ramazan, hijo del jeque Shadeli."
  fr: "Le daqqaq vendait de la farine et approvisionnait les moulins et les boulangeries, figurant dans les registres de la hisba aux côtés du marchand de grains. Al-Shayzari ordonne que le blé soit tamisé avant la mouture afin d'éliminer l'ivraie et la poussière, et que le grain soit légèrement saupoudré pendant la mouture pour qu'il soit blanc et sain. Le muhtasib doit veiller à ce que la farine ne soit pas mélangée à de la farine d'orge tamisée, de la farine de fèves et de pois chiches, de la farine moulue sur une meule irrégulière ou à la poussière du moulin – et s'il a le moindre doute, il leur fait prêter serment. Pour le bien commun, le muhtasib leur fixe un quota quotidien de farine à distribuer aux boutiques et aux boulangeries. Ibn al-Ukhuwwa décrit en détail le processus, de la meule à la maison: le grain est nettoyé de toute terre avant la mouture et les tamis sont régulièrement remplacés; la farine est comparée à de la farine de pois chiches et ne doit pas être moulue sur des meules usées dont les particules sont nocives; les bêtes de somme bénéficient d'un repos quotidien et ne moulent jamais plus d'une wayba. Les balances, les mesures et les jarres étaient inspectées; la farine était reçue et livrée au poids; chaque jarre portait le nom et le domicile de son propriétaire inscrits sur une calebasse attachée à l'anse afin d'éviter toute confusion; la farine de chacun était toujours séparée de celle d'un autre dans la trémie du moulin; et les hommes qui livraient la farine à domicile devaient être honorables et dignes de confiance, car ils entraient dans les maisons et conversaient avec les enfants et les esclaves. Lors du cortège d'Evliya à Istanbul, les marchands de farine (Unilekjian) étaient trois mille hommes, pour la plupart des paysans égyptiens, le visage, les yeux et les vêtements couverts de farine, passant sur des chariots, les sacs de farine à la main, en criant: « Que Dieu donne la victoire au Sultan ! » Leur protecteur était Ramazan, fils du cheikh Shadeli."
