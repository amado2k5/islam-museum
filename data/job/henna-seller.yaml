  techniques:
    ar: "الصنعة عند ابن الأخوة ضبط الغشّ: تنقية الحنّاء من الرمل والدقيق الخشن، وكشف غشّ الرمل والزيت الحار بالتنخيل حتى يبقى على الغربال، والمغشوش أثقل. وعند إوليا الورشة دكان الترزيم: رزم الكِنا تُعجَن وتُغلَّف وتُوزَّع. وعند لين التحضير للاستعمال: ورق مطحون يُمزج بقليل ماء عجينة، تُفرد على الجلد وتُشدّ بكتّان ليلة كاملة، ويحوّل بعضهم لونها بعجينة الجير والسُّخام وزيت الكتّان إلى سواد أو زيتوني غامق."
    en: "The craft in Ibn al-Ukhuwwa is the policing of fraud: the henna cleared of sand and coarse flour, the adulteration with sand and hot oil detected by sifting until the residue stays on the sieve, the adulterated kind being the heavier. In Evliya the workshop is the packet-shop: bundles of kena kneaded, wrapped and distributed. In Lane the preparation for use: powdered leaf mixed with a little water into a paste, spread on the skin and bound in linen for a whole night, some then changing its tint with a paste of quicklime, smoke-black and linseed-oil to a black or blackish-olive hue."
    ur: "ابن الاخوہ میں پیشہ دھوکے کی ضبط ہے: حنا ریت اور موٹے آٹے سے صاف، ریت اور گرم تیل کی ملاوٹ چھاننے سے پکڑی جائے کہ باقی چھلنی پر رہے، اور ملی چیز وزنی۔ اولیاء میں ورکشاپ پٹارے کی دکان ہے: کینا کی گٹھلیاں گونده، لپیٹی اور بانٹی جاتیں۔ لین میں استعمال کی تیاری: کٹا پتہ تھوڑے پانی سے لےپ، جلد پر لگا کر کتان سے رات بھر بندا، بعض پھر چونے، کاجل اور السی کے تیل کے لیپ سے رنگ سیاہ یا سیاہ مائل زیتونی کرتے۔"
