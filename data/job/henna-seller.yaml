summary:
  ar: "الحَنّاء بائع ورق الحِنّاء ومطحونه للصبغ والتجميل. في موكب إسطنبول عدّ إوليا باعة الحنّاء ⁦(كيناجيان)⁩ خمسة وخمسين رجلاً بخمسة عشر دكاناً، بيرهم الإمام عطّار البلبيسي تلميذ أنس بن مالك، وهم في دكاكينهم يعجنون رزم الحنّاء ويُسمّى الكِنا، يفرّقون بعضها على المتفرّجين. والحنّاء من بضائع أسطول مصر عند إوليا: تأتي السفن بالأرز والعدس والقنب والسكر والحنّاء، ويحمل الحمّالون في الجمارك أحمال قطن أو حنّاء من أربعين إلى خمسين قنطاراً؛ وفي خصومة التجّار ردّ تجّار مصر على الجزّارين أنه لا يوجد حنّاء أجود من حنّاء مصر وأن استعمالها مقدّس بالسنّة فلا جواب لذلك. ويضبط ابن الأخوة باعة الحنّاء بفصل خاص: يُنصَب عليهم رجل من صنعتهم يعرف غشّهم، يُجبِرهم ألا يبيعوا إلا الحنّاء الخالية من العيوب والرمل والدقيق الخشن، ويُكشَف غشّ الرمل والزيت الحار بالتنخيل إذ يبقى الرمل أو الدقيق على الغربال، والمغشوش أثقل وزناً. ويصف لين استعمالها في مصر: يُسحَق ورق الحنّاء ويُمزج بقليل ماء عجينة تُفرد على راحة اليد وأطراف الأصابع والقدمين وتُشدّ بكتّان ليلة كاملة، فيبقى اللون الأحمر البرتقالي أياماً ويُجدَّد كل أسبوعين أو ثلاثة، وبعض النساء يحوّلنه إلى سواد بعجينة الجير والسُّخام وزيت الكتّان."
  en: "The hanna' sold the henna leaf and its powder for dye and adornment. In Evliya's Istanbul procession the henna-merchants (Kinajian) were fifty-five men in fifteen shops, their patron Imam Attar of Belbeis, a disciple of Anas ibn Malik; they are occupied in their shops making up packets of henna, called kena, some of which they distribute among the spectators. Henna is a cargo of the Egyptian fleet in Evliya: the ships bring rice, lentils, hemp, sugar and henna, and the custom-house porters lift loads of cotton or henna of forty to fifty quintals; in the merchants' dispute the Egyptians answer the butchers that no better henna is found than Egypt's, and that its use is sanctified by the Sunna, to which there is no reply. Ibn al-Ukhuwwa gives the henna-sellers their own chapter: a man of their own trade who knows their deceptions is set over them; he must compel them to sell nothing but henna free of faults and of sand and coarse flour; adulteration with sand and hot oil is detected by sifting, when the sand or flour remains on the sieve, and the adulterated kind is heavier. Lane describes its use in Egypt: the powdered leaf mixed with a little water is spread as a paste on the palm, the fingertips and the soles, bound tight in linen for a whole night, leaving an orange-red stain that lasts many days and is renewed each fortnight or three weeks; some women then turn it black with a paste of quicklime, smoke-black and linseed-oil."
  ur: "حنّا حنا کا پتہ اور اس کا چورا رنگ اور سنگار کے لیے بیچنے والا ہے۔ اولیاء کے استنبول کے جلوس میں حنا فروش ⁦(کناجیان)⁩ پچپن آدمی پندرہ دکانیں تھے، ان کا پیر امام عطّار بلبیسی ہے، انس بن مالک کا شاگرد؛ وہ اپنی دکانوں میں حنا یا کینا کے پٹارے بناتے اور بعض تماشائیوں میں بانٹتے۔ اولیاء میں حنا مصر کے بیڑے کا سودا ہے: جہاز چاول، مسور، سن، چینی اور حنا لاتے، اور محصول خانے کے ہمال چالیس سے پچاس قنطار کے کاٹن یا حنا کے بوجھ اٹھاتے؛ تاجروں کے جھگڑے میں مصری قصابوں کو جواب دیتے کہ مصر سے بہتر حنا کہیں نہیں ملتی اور اس کا استعمال سنت سے مقدس ہے جس کا کوئی جواب نہیں۔ ابن الاخوہ حنا فروشوں کو مستقل باب دیتا: ان پر ان ہی پیشے کا آدمی مقرر ہو جو ان کے دھوکے جانتا؛ وہ انہیں مجبور کرے کہ صرف بے عیب حنا بیچیں بغیر ریت اور موٹے آٹے؛ ریت اور گرم تیل کی ملاوٹ چھاننے سے پکڑی جاتی کہ ریت یا آٹا چھلنی پر رہ جائے، اور ملی چیز وزنی ہوتی۔ لین مصر میں اس کا استعمال بتاتا ہے: کٹا پتہ تھوڑے پانی سے مل کر لеп بن کر ہتھیلی، انگلیوں کے سرے اور تلووں پر لگتا، کتان سے رات بھر بندا، اورنج سرخ نشان کئی دن رہ کر ہر دو تین ہفتے تازہ ہوتا؛ بعض عورتیں پھر چونے، کاجل اور السی کے تیل کے لیپ سے اسے سیاہ کر دیتیں۔"
  es: "Los hanna' vendían la hoja de henna y su polvo para teñir y adornar. En la procesión de Estambul de Evliya, los comerciantes de henna (Kinajian) eran cincuenta y cinco hombres en quince tiendas, su patrón Imam Attar de Belbeis, un discípulo de Anas ibn Malik; están ocupados en sus tiendas haciendo paquetes de henna, llamados kena, algunos de los cuales distribuyen entre los espectadores. La henna es una carga de la flota egipcia en Evliya: los barcos traen arroz, lentejas, cáñamo, azúcar y henna, y los porteadores de la aduana levantan cargas de algodón o henna de cuarenta a cincuenta quintales; en la disputa de los comerciantes los egipcios responden a los carniceros que no se encuentra mejor henna que la de Egipto, y que su uso está santificado por la Sunna, a lo que no hay respuesta. Ibn al-Ukhuwwa dedica a los vendedores de henna su propio capítulo: un hombre de su mismo oficio que conoce sus engaños es puesto sobre ellos; Debe obligarlos a vender únicamente henna sin defectos, arena ni harina gruesa; la adulteración con arena y aceite caliente se detecta tamizando, cuando la arena o la harina permanecen en el tamiz, y la adulterada es más pesada. Lane describe su uso en Egipto: la hoja en polvo mezclada con un poco de agua se extiende como una pasta en la palma, las yemas de los dedos y las plantas de los pies, se envuelve firmemente en lino durante toda la noche, dejando una mancha rojo anaranjada que dura muchos días y se renueva cada quincena o tres semanas; algunas mujeres luego la vuelven negra con una pasta de cal viva, negro de humo y aceite de linaza."
  fr: "Les marchands de henné vendaient la feuille de henné et sa poudre pour la teinture et la parure. Lors du défilé d'Evliya à Istanbul, on comptait cinquante-cinq marchands de henné (Kinajian) répartis dans quinze boutiques, sous la protection de l'imam Attar de Belbeis, disciple d'Anas ibn Malik. Dans leurs échoppes, ils confectionnaient des sachets de henné, appelés kena, dont ils distribuaient une partie aux spectateurs. Le henné était une cargaison de la flotte égyptienne à Evliya: les navires transportaient du riz, des lentilles, du chanvre, du sucre et du henné, et les porteurs des douanes chargeaient quarante à cinquante quintaux de coton ou de henné. Lors des disputes entre marchands, les Égyptiens rétorquaient aux bouchers qu'on ne trouvait pas de meilleur henné que celui d'Égypte et que son usage était sanctifié par la Sunna, ce à quoi personne ne répondit. Ibn al-Ukhuwwa consacre un chapitre aux vendeurs de henné: un homme exerçant le même métier, connaissant leurs tromperies, est chargé de les surveiller. Il doit les contraindre à ne vendre que du henné sans défauts, sans sable ni farine grossière; la falsification avec du sable et de l’huile chaude se détecte par tamisage, lorsque le sable ou la farine restent sur le tamis, et que le henné falsifié est plus lourd. Lane décrit son usage en Égypte: la feuille en poudre mélangée à un peu d’eau est appliquée en pâte sur la paume, le bout des doigts et la plante des pieds, enveloppés dans du lin pendant toute une nuit, laissant une tache rouge orangé qui dure plusieurs jours et est renouvelée toutes les deux semaines ou toutes les trois semaines; certaines femmes la noircissent ensuite avec une pâte de chaux vive, de noir de fumée et d’huile de lin."
