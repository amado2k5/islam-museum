summary:
  ar: "اللوند جندي البحرية العثمانية الذي تقاتل به السفن الحربية: أصل الكلمة إيطالية «levantino» أي الجندي الشرقي استعملها البنادقة لبحّارة استقدموهم من سواحل ألبانيا وكرواتيا، ثم صار لونداً في التركية والفارسية. سُجّل شبّان سواحل الأناضول الغربي ومرمرة في الأسطول باسم لوند وعُرفوا بـ«لوند رومي»، ولكل سفينة نصيب منهم — مئة في الفرقاطة إلى أربعمئة في القليون — تحت آغا اللوندين وجاوشهم، يهاجمون في الحرب بقوارب اللوند ويأخذون أجراً، ومن كثرة شغبهم ألزمتهم الدولة بالكفلاء وبنت لهم ثكنات في أحياء إسطنبول."
  en: "The levent was the fighting sailor of the Ottoman fleet: the word came from the Italian levantino, 'eastern soldier', which the Venetians used for sea-soldiers drawn from the Albanian and Croatian coasts, and it passed into Turkish and Persian as levend. Young men raised on the western Anatolian and Marmara shores were enrolled in the fleet as levents — 'levend-i Rûmî' — and each ship carried its number, eighty to a hundred in a frigate and up to four hundred in a galleon, under their agha and chavush; they attacked in the levent boats and drew pay. So often did they turn to raiding merchantmen and plundering ashore that the state bound each man to a surety and built barracks for the 'native levents' in the quarters of Istanbul."
  ur: "لوند عثمانی بحریہ کا لڑنے والا ملاح تھا: لفظ اطالوی levantino یعنی «مشرقی سپاہی» سے آیا جو وینس کے لوگ البانیہ و کروشیا کے ساحلوں سے لائے گئے سمندری سپاہیوں کے لیے کہتے، اور ترکی و فارسی میں levend ہو گیا۔ مغربی اناطولیہ اور مرمرہ کے ساحلوں کے نوجوان لوند کے نام سے بیڑے میں بھرتی ہوتے اور «لوند رومی» کہلاتے؛ ہر جہاز میں ان کی مقررہ تعداد ہوتی — فرقاطے میں اسی سے سو اور گیلین میں چار سو تک — اپنے آغا اور چاؤش کے نیچے، وہ لوند کی کشتیوں سے حملہ کرتے اور تنخواہ پاتے۔ تجارتی جہازوں پر حملے اور ساحل پر لوٹ مار کے سبب حکومت نے ہر ایک پر کفیل لازم کیا اور استنبول کے محلوں میں «مقامی لوندوں» کے لیے بیرک بنوائے۔"
  es: "El levent era el marinero de combate de la flota otomana: la palabra provenía del italiano levantino, «soldado oriental», que los venecianos usaban para referirse a los marineros procedentes de las costas albanesas y croatas, y pasó al turco y al persa como levend. Jóvenes criados en las costas de Anatolia occidental y Mármara se alistaban en la flota como levents —«levend-i Rûmî»— y cada barco llevaba su número, de ochenta a cien en una fragata y hasta cuatrocientos en un galeón, bajo el mando de su agha y chavush; atacaban en las barcas de levent y recibían una paga. Con tanta frecuencia asaltaban barcos mercantes y saqueaban en tierra que el Estado obligaba a cada hombre a prestar fianza y construía barracones para los «levents nativos» en los barrios de Estambul."
  fr: "Le levent était le marin combattant de la flotte ottomane: ce mot provient de l’italien « levantino », « soldat de l’Est », terme employé par les Vénitiens pour désigner les marins recrutés sur les côtes albanaises et croates, et qui passa en turc et en persan sous la forme « levend ». Les jeunes hommes élevés sur les rivages de l’Anatolie occidentale et de la mer de Marmara étaient enrôlés dans la flotte comme levents – « levend-i Rûmî » – et chaque navire embarquait son effectif, de quatre-vingts à cent hommes sur une frégate et jusqu’à quatre cents sur un galion, sous les ordres de leur agha et chavush; ils attaquaient à bord des embarcations des levents et recevaient une solde. Ils se livraient si souvent au pillage des navires marchands et aux raids côtiers que l’État exigea une caution pour chaque homme et fit construire des casernes pour les « levents indigènes » dans les quartiers d’Istanbul."
  tr: "\"Lönd\" terimi, Osmanlı savaş gemilerinde savaşan deniz personeline verilen isimdir. Kökeni, Venediklilerin Arnavutluk ve Hırvatistan kıyılarından getirdikleri denizciler için kullandıkları \"Doğu askeri\" anlamına gelen İtalyanca \"levantino\" kelimesine dayanmaktadır. Daha sonra Türkçe ve Farsçada \"lönd\" halini almıştır. Batı Anadolu ve Marmara Denizi kıyılarından gelen genç erkekler, filoya \"lönd\" olarak kaydedilir ve \"Rumi Lönd\" olarak bilinirlerdi. Her gemide, bir fırkateynde yüz, bir kadırgada dört yüz olmak üzere, Lönd komutanı ve adamlarının komutasında bir grup Lönd bulunurdu. Lönd botlarıyla savaşa katılır ve ücret alırlardı. Sık sık çıkardıkları huzursuzluklar nedeniyle devlet, onlardan sponsor bulmalarını istedi ve İstanbul'un mahallelerinde onlar için kışlalar inşa etti."
  id: "Istilah \"lönd\" merujuk pada personel angkatan laut Ottoman yang bertempur di kapal perang. Asalnya dari bahasa Italia \"levantino,\" yang berarti \"prajurit Timur,\" sebuah istilah yang digunakan oleh orang Venesia untuk para pelaut yang mereka bawa dari pantai Albania dan Kroasia. Kemudian, istilah ini menjadi \"lönd\" dalam bahasa Turki dan Persia. Para pemuda dari pantai Anatolia barat dan Laut Marmara terdaftar dalam armada sebagai \"lönd\" dan dikenal sebagai \"Rumi Lönd.\" Setiap kapal memiliki sejumlah anggota—seratus orang di kapal fregat dan empat ratus orang di kapal galai—di bawah komando komandan Lönd dan anak buahnya. Mereka menyerang dalam perang menggunakan kapal Lönd dan menerima bayaran. Karena seringnya mereka membuat keributan, negara mengharuskan mereka untuk menyediakan sponsor dan membangun barak untuk mereka di sekitar Istanbul."
