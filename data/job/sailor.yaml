  certification: "The sea levents were raised from the coastal youth of western Anatolia and the Marmara, enrolled by name in the fleet and paid a wage; service ran under each ship's leventler ağası and leventler çavuşu, and after 1648 the levents and kalyoncu took the place of the azebs as the galleons multiplied. The state bound every levent to a kefil for his conduct ashore."
