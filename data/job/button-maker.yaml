  techniques:
    ar: "يفصّل إوليا نظام الطائفة: مصنع الدُّغمَجية تحت جامع السلطان سليمان بالساحة، وفيه تُصبّ قوالب نحاس شبابيك المساجد السلطانية وسائر القوالب، وقد بناه السلطان سليمان قبل الجامع نفسه لشدة الحاجة إليه، ويسكن فيه رئيس السبّاكين أبداً، أما الدكاكين فأكثر من ألف منتشرة في المدينة، ويُحسَب سبّاكو الصحاف في زملائهم فصار العدد ألفاً وثلاثمئة. ويشتّت العمل: فطائفة الأزرار القلعية تطرق القلع أزراراً وأبازيم، وطائفة الأزرار الحريرية تلفّ الحرير الطرابزوني على الزرّ، وبير زمن النبوة طلحة الذي كان يصنع أطباق النحاس وصحافه."
    en: "Evliya details the guild's arrangement: the Dogmeji factory stands below the mosque of Sultan Suleiman in the market-place; the moulds for the brass-work of the Imperial mosques' windows and other moulds are cast there, and Sultan Suleiman built it before the mosque itself on account of the great necessity for it; the chief of the founders always resides there, while the shops, more than a thousand, spread over the town, and the founders of plate are counted as their fellow-assistants so that the men are thirteen hundred. The work divides: the tin-button-makers hammer tin into buttons and buckles; the silk-button-makers wrap the button in Trebizond silk; and the patron of the Prophet's time, Talha, was himself a maker of brass plates and dishes."
    ur: "اولیاء انجمن کا نظام تفصیل سے بتاتا ہے: دغمجیوں کا کارخانہ جامع سلطان سلیمان کے نیچے بازار میں ہے؛ وہاں شاہی مسجدوں کی کھڑکیوں کے پیتل کے کام کے سانچے اور دوسرے سانچے ڈھالے جاتے، اور سلطان سلیمان نے شدید ضرورت کے سبب مسجد سے پہلے یہی کارخانہ بنوایا؛ مالکانِ گرم خانہ ہمیشہ وہیں رہتا ہے، جبکہ دکانیں ایک ہزار سے زائد سارے شہر میں پھیلی ہیں، اور پلیٹ ڈھالنے والے ان کے رفقائے کار گنے جاتے ہیں اس لیے گنتی تیرہ سو ہوتی ہے۔ کام بانٹا ہوا ہے: قلعی بٹن ساز قلعی کو بٹن اور بکسوا دھوکتے؛ ریشمی بٹن ساز بٹن کو طرابزونی ریشم میں لپیٹتے؛ اور نبوت کے زمانے کا پیر طلحہ خود پیتل کی پلیٹیں اور برتن بنانے والا تھا۔"
