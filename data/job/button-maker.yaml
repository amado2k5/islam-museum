summary:
  ar: "صانع الأزرار صبّ الزُّرّ معدناً وقلبَه حريراً، وكانت طائفته في إسطنبول ثلاث طوائف. عدّ إوليا الدُّغمَجية ⁦(صنّاع الأزرار)⁩ ألفاً وثلاثمئة رجل بدكاكين تزيد على الألف منتشرة في المدينة، مصنعهم تحت جامع السلطان سليمان في الساحة، بناه السلطان أولاً لما بُني الجامع لأن فيه تُصنع قوالب نحاس شبابيك المساجد السلطانية وغيرها، وفيه يسكن رئيس السبّاكين أبداً؛ بيرهم الأول كريم الكيميائي الذي اهتدى بالنحاس إلى أثر المسك، وبير زمن النبوة طلحة بن عبيد الله الذي أسلم بالمدينة وصار من العشرة وكان يصنع أطباق النحاس وصحافه، قبره بدمشق قرب بلال الحبشي. ومعهم صنّاع الأزرار القلعية ⁦(كلع دغمجيان)⁩ مئتان بمئة دكان بيرهم أبو المواهب الأنصاري الذي قلّده سلمان وقبره بجَبَلَّةَ في اليمن، يمرّون يعملون أزرار القلع وأبازيمها؛ وصنّاع الأزرار الحريرية ⁦(دغمجيان حرير)⁩ ستمئة بخمسين دكاناً يزيّنون دكاكينهم بأزرار حرير طرابزون."
  en: "The button-maker cast the zurr in metal and wrapped it in silk, and his guild in Istanbul was three guilds. Evliya counts the button-makers (Dogmeji) at thirteen hundred men with more than a thousand shops spread over the town; their factory stands below the mosque of Sultan Suleiman in the market-place, and when Suleiman erected the mosque he first built this factory, for here are made the moulds for the brass-work of the windows of the Imperial mosques and other moulds, and the chief of the founders always resides there. Their first patron was Karim the alchemist, who found the traces of musk by means of brass; in the Prophet's time their chief was Talha ibn Ubaydillah, converted at Medina and one of the ten, who made brass plates and dishes and is buried at Damascus near Bilal the Abyssinian. With them marched the tin-button-makers (Kalai Dogmejian), two hundred men in a hundred shops, their patron Abu-l-Mevahib al-Ansari, girded by Selman and buried at Jaballa in Yemen, working tin buttons and tin buckles in their shops; and the silk-button-makers, six hundred men in fifty shops, who adorned their shops with silk buttons of the Trebizond manufacture."
  ur: "بٹن ساز بٹن دھات میں ڈھالتا اور ریشم میں لپیٹتا، اور استنبول میں اس کی انجمن تین انجمنیں تھیں۔ اولیاء بٹن سازوں ⁦(دغمجی)⁩ کو تیرہ سو آدمی ایک ہزار سے زائد دکانیں گنتا جو سارے شہر میں پھیلی ہیں؛ ان کا کارخانہ جامع سلطان سلیمان کے نیچے بازار میں ہے، اور جب سلیمان نے مسجد بنوائی تو سب سے پہلے یہی کارخانہ بنایا کہ یہاں شاہی مسجدوں کی کھڑکیوں کے پیتل کے کام کے سانچے اور دوسرے سانچے بنتے ہیں، اور مالکانِ گرم خانہ ہمیشہ یہیں رہتا ہے۔ ان کا پہلا پیر کریم کیمیاگر ہے جس نے پیتل سے مشک کے نشان پائے؛ اور نبوت کے زمانے کا سردار طلحہ بن عبید اللہ ہے جو مدینہ میں مسلمان ہوا اور عشرۂ مبشرۃ میں شمار ہوا، وہ پیتل کی پلیٹیں اور برتن بناتا تھا اور دمشق میں بلال حبشی کے پاس مدفون ہے۔ ان کے ساتھ قلعی کے بٹن ساز ⁦(کلع دغمجیان)⁩ دو سو آدمی سو دکانیں، جن کا پیر ابو المواہب انصاری ہے جسے سلمان نے کمر بند پہنائی اور یمن کے جبلّہ میں مدفون ہے، وہ اپنی دکانوں میں قلعی کے بٹن اور بکسوا بناتے نکلتے؛ اور ریشمی بٹن ساز چھ سو آدمی پچاس دکانیں جو دکانیں طرابزون کے ریشمی بٹنوں سے سجاتے۔"
  es: "El fabricante de botones fundía el zurr en metal y lo envolvía en seda, y su gremio en Estambul estaba formado por tres gremios. Evliya cuenta a los fabricantes de botones (Dogmeji) en mil trescientos hombres con más de mil talleres repartidos por la ciudad; su fábrica se encuentra debajo de la mezquita del sultán Solimán en la plaza del mercado, y cuando Solimán erigió la mezquita, construyó primero esta fábrica, pues aquí se fabrican los moldes para los trabajos de latón de las ventanas de las mezquitas imperiales y otros moldes, y el jefe de los fundidores siempre reside allí. Su primer mecenas fue Karim el alquimista, quien encontró rastros de almizcle mediante el latón; en tiempos del Profeta, su jefe fue Talha ibn Ubaydillah, convertido en Medina y uno de los diez, que fabricaba platos y vajillas de latón y está enterrado en Damasco cerca de Bilal el Abisinio. Con ellos marchaban los fabricantes de botones de estaño (Kalai Dogmejian), doscientos hombres en cien talleres, cuyo patrón era Abu-l-Mevahib al-Ansari, ceñido por Selman y enterrado en Jaballa, Yemen, que trabajaban botones y hebillas de estaño en sus talleres; y los fabricantes de botones de seda, seiscientos hombres en cincuenta talleres, que adornaban sus tiendas con botones de seda de la manufactura de Trebisonda."
  fr: "Le fabricant de boutons coulait le bouton en métal et l'enveloppait de soie. Sa guilde à Istanbul comptait trois guildes. Evliya recense treize cents fabricants de boutons (Dogmeji) répartis dans plus de mille boutiques à travers la ville. Leur atelier se trouvait en contrebas de la mosquée du sultan Soliman, sur la place du marché. Lorsque Soliman fit construire la mosquée, il fit d'abord bâtir cet atelier, car c'est là que sont fabriqués les moules pour les ornements en laiton des fenêtres des mosquées impériales, ainsi que d'autres moules. Le chef des fondeurs y résidait en permanence. Leur premier mécène fut Karim l'alchimiste, qui découvrit des traces de musc grâce au laiton. À l'époque du Prophète, leur chef était Talha ibn Ubaydillah, converti à Médine et l'un des dix maîtres qui fabriquaient des assiettes et des plats en laiton. Il est enterré à Damas, près de Bilal l'Abyssin. Avec eux marchaient les fabricants de boutons en étain (Kalai Dogmejian), deux cents hommes dans une centaine de boutiques, leur patron Abu-l-Mevahib al-Ansari, ceint par Selman et enterré à Jaballa au Yémen, travaillant des boutons et des boucles en étain dans leurs boutiques; et les fabricants de boutons en soie, six cents hommes dans cinquante boutiques, qui ornaient leurs boutiques de boutons en soie de fabrication Trébizonde."
