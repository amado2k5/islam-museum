summary:
  ar: "الجرّاح هو من يعالج الجروح والدمامل والفتق، ويقلع الأسنان، ويفصد، ويختن، ويبتر. تطلب كتب الحسبة منه معرفة كتاب جالينوس المعروف بـ«قاطاجانس» في الجروح والمراهم وكتاب الزهراوي، ومعرفة التشريح حتى يتجنّب العضلات والعروق والشرايين والأعصاب حين يفتح الدمامل ويستأصل البواسير، وأن يحمل مباضع مستديرة ومربعة ومصلّبة الرؤوس وسكاكين ومنشار بتر ومِثقب أذن ومرهم اللاذن القاطع للدم. وعند العثمانيين كان الجرّاح يُعَدّ صاحب صنعة يتعلّمها في القصر ضمن أهل الحرف أو على يد أستاذ أو عن أبيه، ويعمل في البيمارستان والقصر والجيش أو في دكانه، ويرأسهم «سرجراحين خاصه» أي الجرّاح باشي، ويمتحنهم الحكيم باشي ويمنح المستحقّ إذناً مختوماً ويعاقب غير العارف."
  en: "The jerrah dressed wounds and boils, treated hernias, drew teeth, let blood, circumcised and amputated. The hisba manuals require him to know Galen's book known as Qatajanus on wounds and dressings, and al-Zahrawi's book, and the anatomy of the body so that he avoids the muscles, veins, arteries and nerves when he opens abscesses and excises haemorrhoids; his kit is lancets with round, square and cross-cut heads, knives, a frontal hatchet, an amputating saw, an ear-piercer and the storax or olibanum remedy that stanches blood. Among the Ottomans the surgeon counted as a craftsman, learning in the palace corps of the ehl-i hiref, beside a master, or from his father; he served in the hospital, palace, army or his own shop, answered to the sercerrahin-i hassa — the surgeon-chief — and was examined by the hekimbaşı, who granted the competent a sealed permit and punished the ignorant."
  ur: "جراح وہ ہے جو زخم اور پھوڑے سنوارتا، فتق کا علاج کرتا، دانت اُکھیڑتا، فصد کھولتا، ختنہ کرتا اور عضو کاٹتا ہے۔ حسبہ کی کتابیں اس سے جالینوس کی قاطاجانس نام کتاب اور الزہراوی کی کتاب اور بدن کی تشریح مانگتی ہیں تاکہ پھوڑے پھاڑتے اور ماسے کاٹتے وقت پٹھے، رگیں، شریانیں اور اعصاب بچائے؛ اس کے اوزار ہیں گول، چوکور اور صلیبی سرے والے نشر، چھریاں، پیشانی کی کلہاڑی، بترنے کی آری، کان بیدنے کا آلہ اور لوبانِ لاذن کی رُکاوٹ خون کی مرہم۔ عثمانیوں میں جراح صنعتکار شمار ہوتا، محل کے اہلِ حرف دستے میں، کسی استاد کے پاس یا باپ سے سیکھتا؛ بیمارستان، محل، لشکر یا اپنی دکان میں کام کرتا؛ سردار «سرجراحینِ خاصہ» یعنی جراح باشی تھا، اور حکیم باشی ان کا امتحان لے کر اہل کو مہربند اجازت نامہ دیتا اور نادان کو سزا دیتا تھا۔"
  es: "El jerrah curaba heridas y forúnculos, trataba hernias, extraía dientes, realizaba sangrías, circuncidaba y amputaba. Los manuales de la hisba le exigían conocer el libro de Galeno conocido como Qatajanus sobre heridas y curas, y el libro de al-Zahrawi, y la anatomía del cuerpo para evitar los músculos, venas, arterias y nervios cuando abría abscesos y extirpaba hemorroides; su kit consistía en lancetas con cabezas redondas, cuadradas y de corte transversal, cuchillos, un hacha frontal, una sierra de amputación, un perforador de orejas y el remedio de estoraque u olíbano que detenía la hemorragia. Entre los otomanos, el cirujano era considerado un artesano, que aprendía en el cuerpo palaciego del ehl-i hiref, junto a un maestro o de su padre; Prestaba sus servicios en el hospital, el palacio, el ejército o su propio taller, respondía ante el sercerrahin-i hassa —el cirujano jefe— y era examinado por el hekimbaşı, quien otorgaba un permiso sellado a los competentes y castigaba a los ignorantes."
  fr: "Le chirurgien (jerrah) soignait les plaies et les furoncles, traitait les hernies, extrayait les dents, pratiquait les saignées, circoncisait et amputait. Les manuels de la hisba exigeaient qu'il connaisse l'ouvrage de Galien, connu sous le nom de Qatajanus, sur les plaies et les pansements, ainsi que celui d'al-Zahrawi, et l'anatomie du corps afin d'éviter les muscles, les veines, les artères et les nerfs lors de l'ouverture d'abcès et de l'excision d'hémorroïdes. Son outillage comprenait des lancettes à têtes rondes, carrées et cruciformes, des couteaux, une hachette frontale, une scie à amputer, un perce-oreilles et le storax ou oliban, remède hémostatique. Chez les Ottomans, le chirurgien était considéré comme un artisan, formé au sein du corps palatin des ehl-i hiref, auprès d'un maître ou de son père. Il servait à l'hôpital, au palais, dans l'armée ou dans son propre magasin, répondait au sercerrahin-i hassa — le chirurgien-chef — et était examiné par le hekimbaşı, qui accordait aux compétents un permis scellé et punissait aux ignorants."
  tr: "Cerrah, yaraları, çıbanları ve fıtıkları tedavi eden, diş çeken, kan alan, sünnet eden ve ampütasyon yapan kişidir. Pazar müfettişlerinin kitaplarında, cerrahın Galen'in \"Katajans\" adlı yara ve merhem kitabına ve ayrıca El-Zahravi'nin kitabına aşina olması ve çıban açarken ve hemoroid çıkarırken kaslardan, damarlardan, atardamarlardan ve sinirlerden kaçınmak için anatomi bilgisine sahip olması gerektiği belirtilmektedir. Ayrıca yuvarlak, kare ve çapraz uçlu neşterler, bıçaklar, bir amputasyon testeresi, kulak matkabı ve kanamayı durdurmak için kulak merhemi taşıması gerekir. Osmanlılar arasında cerrah, mesleğini sarayda loncalar arasında, bir ustadan veya babasından öğrenmiş bir zanaatkar olarak kabul edilirdi. Hastanede, sarayda, orduda veya kendi dükkanında çalışırdı. Bunların başında \"Sarjrahin Khassa\" (Baş Cerrah) bulunuyordu ve bu kişi \"Hakim Bashi\" (Baş Hekim) tarafından inceleniyordu; Hakim Bashi, nitelikli olanlara mühürlü bir lisans veriyor, nitelikli olmayanları ise cezalandırıyordu."
  id: "Seorang ahli bedah adalah orang yang mengobati luka, bisul, dan hernia, mencabut gigi, melakukan flebotomi, sunat, dan amputasi. Buku-buku inspektorat pasar mengharuskannya untuk memahami buku Galen yang dikenal sebagai \"Qatajans\" tentang luka dan salep, serta buku Al-Zahrawi, dan memiliki pengetahuan tentang anatomi agar dapat menghindari otot, pembuluh darah, arteri, dan saraf saat membuka bisul dan mengangkat wasir. Ia juga harus membawa pisau bedah bulat, persegi, dan berkepala silang, pisau, gergaji amputasi, bor telinga, dan salep telinga untuk menghentikan pendarahan. Di kalangan Ottoman, seorang ahli bedah dianggap sebagai pengrajin, yang mempelajari keahliannya di istana di antara serikat pekerja, dari seorang ahli, atau dari ayahnya. Ia bekerja di rumah sakit, istana, tentara, atau di bengkelnya sendiri. Mereka dipimpin oleh \"Sarjrahin Khassa\" (Kepala Ahli Bedah), yang diperiksa oleh \"Hakim Bashi\" (Kepala Dokter), yang memberikan lisensi resmi kepada mereka yang memenuhi syarat dan menghukum mereka yang tidak memenuhi syarat."
