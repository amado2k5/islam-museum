summary:
  ar: "الجرّاح هو من يعالج الجروح والدمامل والفتق، ويقلع الأسنان، ويفصد، ويختن، ويبتر. تطلب كتب الحسبة منه معرفة كتاب جالينوس المعروف بـ«قاطاجانس» في الجروح والمراهم وكتاب الزهراوي، ومعرفة التشريح حتى يتجنّب العضلات والعروق والشرايين والأعصاب حين يفتح الدمامل ويستأصل البواسير، وأن يحمل مباضع مستديرة ومربعة ومصلّبة الرؤوس وسكاكين ومنشار بتر ومِثقب أذن ومرهم اللاذن القاطع للدم. وعند العثمانيين كان الجرّاح يُعَدّ صاحب صنعة يتعلّمها في القصر ضمن أهل الحرف أو على يد أستاذ أو عن أبيه، ويعمل في البيمارستان والقصر والجيش أو في دكانه، ويرأسهم «سرجراحين خاصه» أي الجرّاح باشي، ويمتحنهم الحكيم باشي ويمنح المستحقّ إذناً مختوماً ويعاقب غير العارف."
  en: "The jerrah dressed wounds and boils, treated hernias, drew teeth, let blood, circumcised and amputated. The hisba manuals require him to know Galen's book known as Qatajanus on wounds and dressings, and al-Zahrawi's book, and the anatomy of the body so that he avoids the muscles, veins, arteries and nerves when he opens abscesses and excises haemorrhoids; his kit is lancets with round, square and cross-cut heads, knives, a frontal hatchet, an amputating saw, an ear-piercer and the storax or olibanum remedy that stanches blood. Among the Ottomans the surgeon counted as a craftsman, learning in the palace corps of the ehl-i hiref, beside a master, or from his father; he served in the hospital, palace, army or his own shop, answered to the sercerrahin-i hassa — the surgeon-chief — and was examined by the hekimbaşı, who granted the competent a sealed permit and punished the ignorant."
  ur: "جراح وہ ہے جو زخم اور پھوڑے سنوارتا، فتق کا علاج کرتا، دانت اُکھیڑتا، فصد کھولتا، ختنہ کرتا اور عضو کاٹتا ہے۔ حسبہ کی کتابیں اس سے جالینوس کی قاطاجانس نام کتاب اور الزہراوی کی کتاب اور بدن کی تشریح مانگتی ہیں تاکہ پھوڑے پھاڑتے اور ماسے کاٹتے وقت پٹھے، رگیں، شریانیں اور اعصاب بچائے؛ اس کے اوزار ہیں گول، چوکور اور صلیبی سرے والے نشر، چھریاں، پیشانی کی کلہاڑی، بترنے کی آری، کان بیدنے کا آلہ اور لوبانِ لاذن کی رُکاوٹ خون کی مرہم۔ عثمانیوں میں جراح صنعتکار شمار ہوتا، محل کے اہلِ حرف دستے میں، کسی استاد کے پاس یا باپ سے سیکھتا؛ بیمارستان، محل، لشکر یا اپنی دکان میں کام کرتا؛ سردار «سرجراحینِ خاصہ» یعنی جراح باشی تھا، اور حکیم باشی ان کا امتحان لے کر اہل کو مہربند اجازت نامہ دیتا اور نادان کو سزا دیتا تھا۔"
