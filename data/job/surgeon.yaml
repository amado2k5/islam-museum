  techniques:
    ar: "يعدّ الشيزري وابن الأخوة أدوات الجرّاح: مباضع منها المستدير الرأس والمربع والمصلّب، وسكاكين، وفأس الجبين، ومنشار البتر، ومِثقب الأذن، وقاطع الورم، وعلقة، ولفافة للمراهم، ومرهم اللاذن ⁦(الأوليبانوم)⁩ الذي يقطع الدم. ويحذّران من مكر بعضهم: يُدخل عظماً في الجرح خفية ثم يُخرجه أمام الناس زاعماً أن مراهمه القاطعة أخرجته، ويصنع بعضهم مرهماً من جير مغسول بالزيت يصبغه بالمغرة حمراً وبالكركم والنيلة خضراً وبالفحم المسحوق سواداً."
    en: "Al-Shayzari and Ibn al-Ukhuwwa list the surgeon's tools: lancets with rounded, square and cross-cut heads, knives, a frontal hatchet, an amputating saw, an ear-piercer, a wen-cutter, leeches, a strip of cloth to wrap dressings, and the storax (olibanum) medicament that stops the flow of blood. They warn against the cheats: a man slips a bone into a wound and then draws it out before a crowd, claiming his cutting medicaments extracted it; others make plasters of lime washed in oil, dyed red with red earth, green with turmeric and indigo, black with powdered charcoal."
    ur: "الشیزری اور ابن الاخوہ جراح کے اوزار گنواتے ہیں: گول، چوکور اور صلیبی سرے والے نشر، چھریاں، پیشانی کی کلہاڑی، بترنے کی آری، کان بیدنے کا آلہ، گمڑی کاٹنے کا آلہ، جونکیں، مرہم لپیٹنے کا کپڑا اور لوبانِ لاذن کی خون روک دوا۔ دھوکھوں سے بھی خبردار کرتے ہیں: کوئی زخم میں چوری سے ہڈی ڈال کر بھیڑ کے سامنے نکالتا اور دعویٰ کرتا کہ اس کی کاٹنے والی دوا نے نکالی؛ بعض چونے کا مل تیل میں دھو کر لال مٹی سے سرخ، ہلدی و نیل سے سبز اور پسی راکھ سے سیاہ رنگتے۔"
