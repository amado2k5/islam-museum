places:
  - { place: place/medina, note: "Abu Hurayra, Aisha, Ibn Umar and Abu Sa'id al-Khudri lived in Medina; the entry also names the seven great jurists of the Successors and al-Zuhri among its scholars.", sources: [source/tdv-hadis] }
  - { place: place/mecca, note: "Among Companions named as serving hadith learning there: Ibn Abbas and Attab ibn Usayd. Among Successors: Mujahid, Ata ibn Abi Rabah and Amr ibn Dinar.", sources: [source/tdv-hadis] }
  - { place: place/kufa, note: "Companions named: Ali, Sa'd ibn Abi Waqqas and Ibn Mas'ud. Successors named: Alqama, Ibrahim al-Nakha'i and al-Sha'bi.", sources: [source/tdv-hadis] }
  - { place: place/basra, note: "Companions named: Anas ibn Malik, Abu Musa al-Ash'ari and Imran ibn Husayn. Successors named: al-Hasan al-Basri, Ibn Sirin and Qatada.", sources: [source/tdv-hadis] }
  - { place: place/damascus, note: "Companions named: Mu'adh ibn Jabal, Ubada ibn al-Samit and Abu al-Darda. Successors named: Abu Idris al-Khawlani and Umar ibn Abd al-Aziz. The first dar al-hadith is named here in the sixth century AH.", sources: [source/tdv-hadis] }
  - { place: place/baghdad, note: "The entry describes the Nizamiyya madrasas, the first of which was founded in Baghdad, and the dar al-hadith institutions of the sixth century AH, which it says appeared in Damascus first and then in Egypt and Baghdad.", sources: [source/tdv-hadis] }
