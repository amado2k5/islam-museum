names:
  - { value: "صاحب الحديث", kind: alternate }
  - { value: "muhaddis", kind: latinized, lang: tr }
summary:
  ar: "المحدّث هو من يروي الحديث بإسناده، ويحفظ متونه، ويعرف رواته ويحكم عليهم بالثقة أو الضعف. وكان لقباً علمياً يُنال بطول التحصيل والإجازة في الرواية، وارتبط في القرون الأولى بنقد الأسانيد والرواة، ثم انتقل تحصيله من الرحلة إلى دور الحديث."
  en: "The muhaddith is the scholar who narrates hadith with its chain of transmission, knows its texts by heart, and judges the narrators in the chain as reliable or weak. The title was earned by long study and a licence to narrate. From the first centuries it was tied to the criticism of chains and narrators, and later its learning moved from travel to dar al-hadith institutions."
  ur: "محدث وہ عالم ہے جو سند کے ساتھ حدیث روایت کرتا ہے، متن یاد رکھتا ہے، اور سند کے راویوں کو ثقہ یا ضعیف قرار دیتا ہے۔ یہ علمی لقب طویل تحصیل اور روایت کی اجازت سے ملتا تھا، اور بعد میں اس کی تعلیم سفر سے دار الحدیث کے اداروں میں منتقل ہوئی۔"
