training:
  mode: ijaza-chain
  certification: "No single certificate is described. The entries describe a chain of permission (ijaza) to narrate: a student heard the teacher, wrote from dictation, read the text back to the teacher, received a text handed over, or received a licence in a letter. The narration of each step had its own formula."
  duration: "Long study. The entries say a student might hear a thousand fascicles of hadith from scholars, and that the right to teach came only after a long and exhausting course of study."
