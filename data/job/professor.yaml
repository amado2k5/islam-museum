summary:
  ar: "المدرّس بمعنى الوظيفة هو صاحب كرسيّ التدريس في المدرسة، لا المعلّم عموماً: لقب استقرّ بعدما أنشأ نظام الملك المدارس النظامية في القرن الخامس الهجري، وكان التعيين رسمياً يقترن بمراسم وخلعة، وكان للمدرّس مدة خدمة وأجر. وفي المدرسة المستنصرية ببغداد ⁦(افتُتحت سنة 634هـ كما يذكر غيوم)⁩ قامت أربع مدارس فقهية للمذاهب السنية الأربعة على رأس كل منها أستاذ يتلقى راتباً شهرياً ويشرف على خمسة وسبعين فقيهاً يُخصَّص لكل منهم دينار ذهب في الشهر. وفي الدولة العثمانية صار المدرّس درجة في سلّم العلمية تُنال بالتدرّج في الرُّتب وبامتحان، ومنه ينتقل المدرّس إلى القضاء، حتى أُسقط اللقب سنة 1933؛ وكان الدرسيام مدرّساً مرخّصاً يقرأ الدروس العامة في المساجد الكبرى يُمتحن بعد الإجازة. وفي الأزهر كان من يكفّ للتدريس ينال إذنه من شيخ المسجد."
  en: "The professor, as an office rather than a calling, is the holder of a teaching chair in a madrasa — not the teacher in general. The title settled after Nizam al-Mulk founded the Nizamiyya madrasas in the fifth hijri century; appointment was official, attended by ceremony and a robe of honour, and the post carried a term of service and a salary. At Baghdad's Mustansiriyya — opened, Guillaume writes, in 1234 — four law-schools of the Sunni rites each stood under a professor drawing a monthly salary, in charge of seventy-five jurist-students to each of whom a gold dinar a month was assigned. In the Ottoman state the müderris became a grade in the learned hierarchy, won by rising through the ranks and by examination, and the road from the chair led to the judgeship, until the title was dropped in 1933; the dersiam was a licensed müderris giving public lessons in the great mosques, examined after his ijaza. At al-Azhar, Lane reports, whoever was competent became a professor by licence of the sheykh of the mosque."
  ur: "پروفیسر بطور منصب مدرسے کی تدریسی کرسی کا صاحب ہے، عمومی معلم نہیں۔ یہ لقب نظام الملک کی پانچویں صدی ہجری کی نظامیہ درس گاہوں کے بعد پکا ہوا؛ تقرری رسمی ہوتی، تقریب اور خلعت کے ساتھ، اور منصب کی میعاد اور تنخواہ ہوتی۔ بغداد کی مستنصریہ میں ⁦(گیوم کے بیان کے مطابق 1234ء میں کھلی)⁩ سنی مذاہب کے چار فقہی مدارس تھے، ہر ایک کے سروں پر ماہانہ تنخواہ دار پروفیسر، جس کے حوالے پچھتر فقیہ طلبہ ہوتے اور ہر طالب کو ماہانہ ایک دینار ملتا۔ عثمانی سلطنت میں مدرس علمیہ مدارج کا درجہ بنا، رتبوں کی ترقی اور امتحان سے ملتا، اور اس سے قضاء کی طرف راہ کھلتی، یہاں تک کہ 1933ء میں لقب ختم ہوا؛ درسیام وہ مستند مدرس تھا جو بڑی مسجدوں میں عام درس پڑھاتا اور اجازت کے بعد امتحان دیتا۔ لین لکھتا ہے کہ ازہر میں جو اہل ہوتا شيخ المسجد کے اجازت نامے سے استاد بن جاتا۔"
  es: "El profesor, entendido como cargo más que como vocación, es quien ocupa una cátedra en una madrasa, no el maestro en general. El título se consolidó después de que Nizam al-Mulk fundara las madrasas Nizamiyya en el siglo V de la Hégira; el nombramiento era oficial, con ceremonia y una túnica de honor, y el puesto conllevaba un período de servicio y un salario. En la Mustansiriyya de Bagdad —inaugurada, según escribe Guillaume, en 1234—, cuatro escuelas de derecho de rito sunita estaban cada una bajo la dirección de un profesor que percibía un salario mensual y estaba a cargo de setenta y cinco estudiantes de jurista, a cada uno de los cuales se le asignaba un dinar de oro al mes. En el Estado otomano, el müderris se convirtió en un grado dentro de la jerarquía académica, que se obtenía ascendiendo de rango y mediante exámenes, y el camino desde la cátedra conducía al cargo de juez, hasta que el título se abolió en 1933; el dersiam era un müderris con licencia que impartía clases públicas en las grandes mezquitas, examinado tras obtener su ijaza. En Al-Azhar, según informa Lane, cualquier persona competente se convertía en profesor con la autorización del jeque de la mezquita."
  fr: "Le professeur, en tant que fonction plutôt que vocation, désigne le titulaire d'une chaire d'enseignement dans une madrasa – et non l'enseignant en général. Ce titre s'est imposé après la fondation des madrasas Nizamiyya par Nizam al-Mulk au Ve siècle de l'Hégire; la nomination était officielle, marquée par une cérémonie et le port d'une robe d'honneur, et le poste s'accompagnait d'une durée déterminée et d'un salaire. À la Mustansiriyya de Bagdad – ouverte, selon Guillaume, en 1234 – quatre écoles de droit de rite sunnite étaient chacune placées sous l'autorité d'un professeur percevant un salaire mensuel et encadrant soixante-quinze étudiants en droit, chacun recevant un dinar d'or par mois. Dans l'Empire ottoman, le titre de müderris devint un grade au sein de la hiérarchie savante, obtenu par ascension professionnelle et par examen, et la voie menant à la magistrature, jusqu'à son abandon en 1933; le dersiam était un müderris agréé, dispensant des cours publics dans les grandes mosquées, et dont l'autorisation d'enseigner (ijaza) était obtenue après examen. À al-Azhar, rapporte Lane, quiconque était compétent devenait professeur par autorisation du cheikh de la mosquée."
  tr: "Mesleki anlamda \"mudarris\" (öğretmen) terimi, genel anlamda \"mu'allim\" (öğretmen) değil, bir okulda öğretim kürsüsü sahibini ifade eder. Bu unvan, Nizam el-Mulk'un Hicri 5. yüzyılda Nizamiyye okullarını kurmasından sonra yerleşmiştir. Atama resmiydi, törenler ve onur cübbesi eşliğinde yapılıyordu. Mudarrislerin belirli bir hizmet süresi ve maaşı vardı. Bağdat'taki Mustansiriya Okulu'nda (Guillaume'nin belirttiği gibi Hicri 634'te açıldı), her biri dört Sünni mezhebinden birini temsil eden dört fıkıh okulu kuruldu. Her okulun başında aylık maaş alan ve her birine aylık bir altın dinar tahsis edilen yetmiş beş fıkıhçıyı denetleyen bir profesör bulunuyordu. Osmanlı İmparatorluğu'nda mudarris unvanı, ilerleme ve sınav yoluyla elde edilen bir ilim kademesi haline geldi. Buradan sonra mudarrisler yargıya yükselebiliyordu. Bu unvan 1933'te kaldırıldı. \"Darsiyam\" (din öğretmeni), büyük camilerde halka açık dersler veren ve lisansını aldıktan sonra sınava giren lisanslı bir öğretmendi. El-Azhar'da ders vermek isteyenlerin cami şeyhinden izin almaları gerekiyordu."
  id: "Istilah \"mudarris\" (guru) dalam pengertian profesional merujuk pada pemegang kursi pengajar di sebuah sekolah, bukan sekadar \"mu'allim\" (guru) secara umum. Gelar ini mulai dikenal setelah Nizam al-Mulk mendirikan sekolah-sekolah Nizamiyya pada abad ke-5 Hijriah. Pengangkatan bersifat resmi, disertai upacara dan jubah kehormatan. Para mudarris memiliki masa jabatan tetap dan gaji. Di Sekolah Mustansiriya di Baghdad (dibuka pada tahun 634 Hijriah, seperti yang disebutkan oleh Guillaume), didirikan empat mazhab fiqh, masing-masing mewakili salah satu dari empat mazhab Sunni. Setiap mazhab dipimpin oleh seorang profesor yang menerima gaji bulanan dan mengawasi tujuh puluh lima ahli hukum, yang masing-masing diberi satu dinar emas per bulan. Di Kekaisaran Ottoman, gelar mudarris menjadi sebuah tingkatan dalam tangga keilmuan, yang dicapai melalui kemajuan dan ujian. Dari sana, para mudarris dapat maju ke bidang peradilan. Gelar ini dihapuskan pada tahun 1933. \"Darsiyam\" (guru agama) adalah guru berlisensi yang memberikan pelajaran umum di masjid-masjid besar dan diuji setelah menerima lisensinya. Di Al-Azhar, mereka yang ingin mengajar memerlukan izin dari syekh masjid."
