summary:
  ar: "الصابوني هو من يطبخ الزيت بالقلي والملح حتى يعتقد صابوناً ويبيعه للحمّامات والبيوت. يروي إوليا جلبي عن طائفة الصابونيين ⁦(صابونجيان)⁩ أن أوّل رئيسهم جمشيد الذي طال به العمر حتى أتقن ثلاثمئة صنعة، ظلّ يفكّر كيف يجعل الزيت صابوناً حتى سقطت من عينه دمعة في المرجل فاعتقد الصابون، فعرف أن الدموع مالحة وأن الماء المالح يثبّت الزيت صابوناً. وهم خمسمئة رجل بمئتي دكان، يجلبون الصابون من أريحا وعسقلان وإزمير وبوجاضة لعمارة القسطنطينية، وأجوده وأشدّه بياضاً وله رائحة مسك صابون طرابلس الشام والقدس ونابلس، وتجار صابون المسك مئة رجل بأربعين دكاناً. ويضبط المحتسب مادته: طحّانو الأشنان لا يطحنون إلا زهره، وبائعو السدر لا يخلطون صيفيّاً بلا شتوي ولا ورقاً من الأشجار، ويُغسل الجصّ والصابون عن بلاط الحمّام لئلا يزلّ المستحمّون."
  en: "The sabuni boils oil with alkali and salt until it sets into soap, and sells it to the baths and houses. Evliya tells of the soap-makers' guild (Sabunjian) that their first patron was Jemshid, who lived a thousand years and mastered three hundred arts: he long pondered how to fix oil into soap, until a tear of despair fell from his eye into the kettle and the soap at once took consistency, so he knew tears to be salt and found that salt water consolidates the oil into soap. They are five hundred men with two hundred shops, bringing soap from Jericho, Ascalon, Smyrna and Tenedos for the supply of Constantinople; the best and whitest, scented with musk, is the soap of Tripoli in Syria, Jerusalem and Nablus, and the musk-soap merchants are a hundred men with forty shops. The muhtasib watches the raw material — the millers of the alkali plant must grind nothing but its flower, and the lote-leaf sellers must not mix in garden leaves — and the bath tiles are scrubbed of soap lest the bathers slip."
  ur: "صابونی تیل کو الکلی اور نمک کے ساتھ پکا کر صابن بناتا اور حماموں اور گھروں کو بیچتا تھا۔ اولیاء چلبی صابن سازوں کی انجمن ⁦(صابونجیان)⁩ کے بارے میں کہتا ہے کہ ان کا پہلا سرپرست جمشید تھا جس نے ہزار سال جی کر تین سو فن سیکھے: وہ دیر تک سوچتا رہا کہ تیل کو صابن کیسے بنائے، یہاں تک کہ مایوسی میں اس کی آنکھ کا ایک آنسو دیگ میں گر پڑا اور صابن فوراً جم گیا، تو اسے معلوم ہوا کہ آنسو نمکین ہیں اور نمک کا پانی تیل کو صابن بنا دیتا ہے۔ وہ پانچ سو آدمی دو سو دکانوں کے ساتھ ہیں، اور اریحا، عسقلان، ازمیر اور تنیدوس سے قسطنطنیہ کے لیے صابن لاتے ہیں؛ اچھا ترین اور سفید ترین جس میں کستوری کی خوشبو ہو، شام کے طرابلس، یروشلم اور نابلس کا صابن ہے، اور کستوری صابن کے سوداگر ایک سو آدمی چالیس دکانوں کے ساتھ ہیں۔ محتسب خام مال کی نگرانی کرتا ہے: اشنان پیسنے والے صرف اس کا پھول پیسیں، اور سدر بیچنے والے باقی درختوں کے پتے نہ ملائیں؛ اور حمام کے فرش سے صابن مل کر صاف کیا جاتا ہے کہ نہنے والے نہ پھسلیں۔"
  es: "El sabuni hierve aceite con álcali y sal hasta que se solidifica y se convierte en jabón, y lo vende a baños y casas. Evliya cuenta sobre el gremio de fabricantes de jabón (Sabunjian) que su primer patrón fue Jemshid, quien vivió mil años y dominó trescientas artes: reflexionó durante mucho tiempo sobre cómo fijar el aceite para convertirlo en jabón, hasta que una lágrima de desesperación cayó de su ojo en la caldera y el jabón adquirió consistencia de inmediato, así que supo que las lágrimas eran sal y descubrió que el agua salada consolida el aceite en jabón. Son quinientos hombres con doscientos talleres, que traen jabón de Jericó, Ascalón, Esmirna y Ténedos para abastecer Constantinopla; el mejor y más blanco, perfumado con almizcle, es el jabón de Trípoli en Siria, Jerusalén y Nablus, y los comerciantes de jabón de almizcle son cien hombres con cuarenta talleres. El muhtasib vigila la materia prima: los molineros de la planta alcalina no deben moler nada más que su flor, y los vendedores de hojas de loto no deben mezclarla con hojas de jardín; además, se limpian los azulejos de los baños para quitarles el jabón, para que los bañistas no resbalen."
  fr: "Les saponaires font bouillir de l'huile avec de l'alcali et du sel jusqu'à ce qu'elle se transforme en savon, qu'ils vendent ensuite aux bains et aux particuliers. Evliya raconte que, selon la guilde des saponaires, leur premier protecteur fut Jemshid, qui vécut mille ans et maîtrisa trois cents arts. Longtemps, il réfléchit à la manière de transformer l'huile en savon, jusqu'à ce qu'une larme de désespoir coule de son œil dans la bouilloire et que le savon prenne aussitôt sa consistance. Il comprit alors que les larmes étaient du sel et découvrit que l'eau salée solidifiait l'huile en savon. Ils sont cinq cents, avec deux cents boutiques, et importent du savon de Jéricho, Ascalon, Smyrne et Ténédos pour approvisionner Constantinople. Le meilleur et le plus blanc, parfumé au musc, provient de Tripoli en Syrie, de Jérusalem et de Naplouse, et les marchands de savon musqué sont cent, avec quarante boutiques. Le muhtasib surveille la matière première — les meuniers de la plante alcaline ne doivent moudre que sa fleur, et les vendeurs de feuilles de lotus ne doivent pas y mélanger de feuilles de jardin — et les carreaux du bain sont nettoyés du savon pour éviter que les baigneurs ne glissent."
  tr: "Sabuncu, yağı tuz ve suyla kaynatıp sabun haline getiren ve daha sonra hamamlara ve evlere satan kişidir. Evliya Çelebi, sabunculuk tarikatının (Sabunjian) ilk liderinin, uzun bir ömür yaşamış ve üç yüz zanaatta ustalaşmış Cemşid olduğunu anlatır. Yağı sabuna nasıl dönüştüreceğini düşünürken, gözünden bir damla yaş kazanın içine düştü ve onu sabun sandı. Sonra gözyaşlarının tuzlu olduğunu ve tuzlu suyun yağı sabuna dönüştürdüğünü anladı. Beş yüz kişiden oluşan bu tarikatın iki yüz dükkanı vardı ve İstanbul'un inşası için Eriha, Aşkelon, İzmir ve Bojadja'dan sabun getiriyorlardı. En kaliteli, en beyaz ve en güzel kokulu sabunlar Trablus, Kudüs ve Nablus'tan geliyordu. Misk sabununda uzmanlaşmış yüz kişi ise kırk dükkana sahipti. Pazar müfettişi malzemelerini denetler: kül suyu değirmencileri sadece kül suyunu öğütecekler, hünnap satıcıları yaz hünnapını kış hünnapıyla veya ağaç yapraklarıyla karıştırmayacaklar ve banyo fayanslarındaki sıva ve sabun kalıntıları yıkanacak ki banyo yapanlar kaymasın."
  id: "Pembuat sabun adalah seseorang yang memasak minyak dengan garam dan air hingga menjadi sabun, yang kemudian dijualnya ke pemandian umum dan rumah-rumah. Evliya Çelebi menceritakan bahwa pemimpin pertama sekte sabun (Sabunjian) adalah Jamshid, yang hidup lama dan menguasai tiga ratus keahlian. Ia merenungkan bagaimana mengubah minyak menjadi sabun hingga setetes air mata jatuh dari matanya ke dalam kuali, yang dikiranya sebagai sabun. Kemudian ia menyadari bahwa air mata itu asin dan air garam dapat mengikat minyak menjadi sabun. Mereka berjumlah lima ratus orang dengan dua ratus toko, membawa sabun dari Yerikho, Ashkelon, Izmir, dan Bojadja untuk pembangunan Konstantinopel. Sabun terbaik, terputih, dan terharum berasal dari Tripoli, Yerusalem, dan Nablus. Seratus orang, yang mengkhususkan diri dalam sabun musk, memiliki empat puluh toko. Inspektur pasar mengatur barang dagangannya: para penggiling larutan alkali hanya boleh menggiling bunganya, dan para penjual kurma tidak boleh mencampur kurma musim panas dengan kurma musim dingin atau daun dari pohon, dan plester serta sabun harus dibersihkan dari ubin kamar mandi agar para pengguna tidak terpeleset."
