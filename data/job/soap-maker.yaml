  techniques:
    ar: "يحكي إوليا أصل الصناعة: دمعة جمشيد المالحة علّمته أن الماء المالح يعقد الزيت صابوناً، ولو وقع حيّ في المرجل لذاب وصار صابوناً. ويصف أصنافه: أجوده وأشدّه بياضاً برائحة مسك صابون طرابلس الشام والقدس ونابلس، ويُصنع صابون أبيض في سيلسترا ونيقوبولي وويدين رديء الرائحة لأنه من شحم الضأن، وصابون طرابلس الغرب يُحمل إلى القسطنطينية في قُلَّل كبيرة طيّب الرائحة حسن الغسل. ويضبط ابن الأخوة مادته الخام: طحّانو الأشنان لا يطحنون إلا الزهر قائماً، فبعضهم يخلطه بالترمس ويُجَرَّب ذلك؛ وبائعو السدر لا يطحنون ورقاً صيفيّاً بلا شتوي لأنه يحسّن اللون ويزيد النفع، ولا يخلطون ورق الصفصاف والتوت، وعلامة الغش أن تكون الرغوة صفراء لا بيضاء، وبعضهم يخلطه بمادة تلتصق بأصول الشعر ولا تنظف، وقِصَع الجيّد وزنها رطل وأوقيتان مصرية. ويأمر الشيزري أن يُفرك بلاط الحمّام بخشن لئلا يلتصق به صابون أو ورق السدر أو الخطمي فيُزلّ الناس."
    en: "Evliya recounts the craft's origin: Jemshid's salt tear taught him that salt water sets oil into soap, and if a living thing fell into the boiling kettle it would be destroyed and turned to soap. He describes its grades: the best and whitest, scented with musk, is the soap of Tripoli in Syria, Jerusalem and Nablus; white soap is also made at Silistria, Nicopolis and Widin but smells bad, being made from mutton grease; and the soap of Tripoli in Africa comes to Constantinople in large vases, smells agreeable and cleanses well. Ibn al-Ukhuwwa regulates the raw material: the millers of the alkali plant must grind only the flower as it stands, for some adulterate it with lupin, and the lote-leaf sellers must not grind summer leaves without the winter leaves, which brighten the colour and increase the effectiveness, nor mix in willow or mulberry leaves; the test of adulteration is the colour of the foam, white for good and yellow for fraud, and a jarful of the good leaf weighs a ratl and two Egyptian ounces. Al-Shayzari orders the bath tiles scrubbed with a rough material so that no soap, lote leaves or marsh mallow sticks to them and makes the bathers slip."
    ur: "اولیہ چلبی اس دستکاری کی اصل بیان کرتا ہے: جمشید کے نمکین آنسو نے اسے سکھایا کہ نمک کا پانی تیل کو صابن بنا دیتا ہے، اور دیگ میں کوئی جاندار گرے تو گھل کر صابن ہو جائے۔ وہ اس کی اقسام بتاتا ہے: اچھا ترین اور سفید ترین جس میں کستوری کی خوشبو ہو، شام کے طرابلس، یروشلم اور نابلس کا صابن ہے؛ سیلسترہ، نکوپولس اور ودین میں بھی سفید صابن بنتا ہے مگر بھیڑ کی چربی سے ہونے کی وجہ سے بدبودار ہے؛ اور افریقہ کے طرابلس کا صابن بڑے مٹکوں میں قسطنطنیہ آتا ہے، خوشبودار اور اچھی دھلائی والا۔ ابن الاخوہ خام مال ضبط کرتا ہے: اشنان پیسنے والے صرف اس کا پھول جوں کا توں پیسیں کہ بعض اس میں ترمس ملاتے ہیں اور اس کی آزمائش ہے؛ اور سدر بیچنے والے صرف گرمیوں کے پتے نہ پیسیں کہ سردیوں کے پتے رنگ نکھارتے اور نفع بڑھاتے ہیں، نہ بید یا شہتوت کے پتے ملائیں؛ ملاوٹ کی پہچان جھاگ کا رنگ ہے، اچھے کا سفید اور فریب کا زرد، اور اچھے پتے کا ایک مرتبان ایک رطل اور دو مصری اوقیہ تولتا ہے۔ الشیزری کا حکم ہے کہ حمام کے فرش کو خردل چیز سے رگڑا جائے کہ صابن، سدر یا خطمی کی پتے اس سے نہ لگ کر نہانے والوں کو پھسلائیں۔"
