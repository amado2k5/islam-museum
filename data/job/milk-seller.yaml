summary:
  ar: "اللبّان هو بائع اللبن في السوق، وله عند المحتسب باب قائم. يأمر ابن الأخوة أن تكون أوعية اللبّان مغطّاة ودكانه مبيّضاً مبلّطاً وسقفه جديداً لأن الذباب يحب مواضع اللبن، وأن تُسدّ أفواه الجرار بسداد من ليف نظيف، وأن تُغسل الأحواض والأواني كل يوم بليف جديد وماء نظيف لئلا يفسد اللبن سريعاً في الحر؛ ويجب أن يكون اللبن غنياً غير منزوع القشدة وإلا ذهب طعمه ودسمه، وبيع اللبن الممزوج بالماء محرّم تحريماً باتاً وعلامته أن يُطرح فيه غصن عدس الماء. ويضيف الشيزري اختباري المحتسب: غصن طحلب الماء يشرب الماء ويدع اللبن، والشعرة تُغمس في اللبن فإن لم يعلَق بها شيء فهو مخلوط بالماء وإن علقت قطرات فهو خالص. وفي إسطنبول إوليا لِبَنة الجواميس ألف رجل في مئتي دكان بيرهم سفيان الثوري، ولِبَنة الضأن ثمانمائة بيرهم شعيب، وباعة اللبن الحار بلا دكاكين ينادون في السحر «لبناً حاراً حلواً»."
  en: "The milk-seller sold milk in the market, and hisba gave him a chapter of his own. Ibn al-Ukhuwwa orders that the milk-seller's vessels be covered, his shop whitewashed and paved with a new roof — flies love the smell of milk — the mouths of the milk-jars stopped with clean palm-fibre, and the vats and containers washed out daily with fresh palm-fibre and clean water so the milk does not turn in the heat. The milk must be rich and unskimmed, else its taste and fatness are gone, and the sale of milk diluted with water is utterly forbidden: its test is to throw in a sprig of marsh-lentil. Al-Shayzari adds the muhtasib's tests — the sprig of water-moss that drinks the water and leaves the milk, and the hair dipped in: if nothing sticks, the milk is watered; if droplets cling, it is pure. In Evliya's Istanbul the buffalo milkmen were a thousand men in two hundred shops under the patronage of Sofian Thun, the sheep milkmen eight hundred under Jethro, and the warm-milk sellers without shops cried 'Hot and sweet milk' through the streets at dawn."
  ur: "دودھ فروش بازار میں دودھ بیچتا تھا اور محتسب کے ہاں اس کا الگ باب تھا۔ ابن الاخوہ حکم دیتا ہے کہ دودھ فروش کے برتن ڈھکے ہوں، دکان چونا لگا پتھر بچھا ہو اور چھت نئی، کیونکہ مکھیاں دودھ کی جگہیں چاہتی ہیں؛ دودھ کے گھڑوں کے منہ صاف کھجور کے ریشے سے بند ہوں، حوض اور برتن ہر روز نئے ریشے اور صاف پانی سے دھوئے جائیں کہ دودھ گرمی میں جلد نہ بگڑے؛ دودھ ملائی دار بغیر ملائی اتارے ہو، ورنہ ذائقہ اور چکنائی چلی جائے، اور پانی ملے دودھ کی فروخت سخت حرام: پہچان یہ کہ اس میں جھیل کی مسور کی ٹہنی ڈالی جائے۔ الشیزری محتسب کے دو اور امتحان لکھتا ہے: طحلب کی ٹہنی پانی پی کر دودھ چھوڑ دیتی ہے، اور بال دودھ میں بگھو کر نکالو — کچھ نہ لگے تو دودھ پانی ملا ہے، قطرے لگیں تو خالص۔ اولیاء کے استنبول میں بھینسوں کے دودھ والے دو سو دکانوں پر ایک ہزار آدمی تھے جن کا پیر سفیان ثوری، بھیڑ کے دودھ والے آٹھ سو جن کا پیر شعیب، اور بغیر دکان گرم دودھ بیچنے والے صبح سویری «گرم میٹھا دودھ» پکارتے پھرتے۔"
  es: "El vendedor de leche vendía leche en el mercado, y la hisba le dedicó un capítulo. Ibn al-Ukhuwwa ordena que se cubran los recipientes del vendedor de leche, se blanquee su tienda y se le ponga un techo nuevo —las moscas adoran el olor a leche—, que se tapen las bocas de las jarras con fibra de palma limpia, y que las tinas y los recipientes se laven diariamente con fibra de palma fresca y agua limpia para que la leche no se estropee con el calor. La leche debe ser rica y entera, de lo contrario pierde su sabor y su untuosidad, y la venta de leche diluida con agua está totalmente prohibida: su prueba consiste en echar una ramita de lenteja de agua. Al-Shayzari añade las pruebas del muhtasib: la ramita de musgo acuático que bebe el agua y deja la leche, y el cabello sumergido: si nada se adhiere, la leche está aguada; si se adhieren gotas, es pura. En el Estambul de Evliya, los lecheros de búfala eran mil hombres en doscientas tiendas bajo el patrocinio de Sofian Thun, los lecheros de oveja ochocientos bajo el de Jethro, y los vendedores de leche caliente sin tiendas pregonaban \"Leche caliente y dulce\" por las calles al amanecer."
  fr: "Le laitier vendait son lait au marché, et la hisba lui consacra un chapitre entier. Ibn al-Ukhuwwa ordonne que les récipients du laitier soient couverts, sa boutique blanchie à la chaux et dotée d'un toit neuf – les mouches raffolent de l'odeur du lait –, que les goulots des jarres soient bouchés avec de la fibre de palmier propre, et que les cuves et récipients soient lavés quotidiennement avec de la fibre de palmier fraîche et de l'eau propre afin que le lait ne tourne pas sous l'effet de la chaleur. Le lait doit être riche et entier, sinon il perd son goût et sa matière grasse, et la vente de lait dilué est formellement interdite: pour le vérifier, on y jette un brin de lentille d'eau. Al-Shayzari ajoute les tests des muhtasib: le brin de mousse d'eau qui absorbe l'eau et laisse le lait, et les cheveux trempés dedans: si rien n'adhère, le lait est dilué; si des gouttelettes restent, il est pur. Dans l'Istanbul d'Evliya, les laitiers de buffles étaient mille hommes répartis dans deux cents boutiques sous le patronage de Sofian Thun, les laitiers de brebis huit cents sous celui de Jethro, et les vendeurs de lait chaud sans boutique criaient « Lait chaud et sucré » dans les rues à l'aube."
  tr: "Sütçü, pazarda süt satan kişidir ve pazar müfettişinin ofisinde kendisine ayrılmış bir kapısı vardır. İbn el-Uhuvve, sütçünün kaplarının örtülmesini, dükkanının badanalanıp kiremitlenmesini ve çatısının yenilenmesini emreder, çünkü sinekler süte çekilir. Ayrıca, kapların ağızlarının temiz lifli tıkaçlarla kapatılmasını ve kapların ve kapların, sütün sıcakta çabuk bozulmasını önlemek için her gün taze lif ve temiz suyla yıkanmasını emreder. Süt, zengin ve kreması bozulmamış olmalıdır, aksi takdirde lezzetini ve zenginliğini kaybeder. Suyla karıştırılmış süt satmak kesinlikle yasaktır ve bunun işareti, içine bir nilüfer dalı konulmasıdır. El-Şeyzari, pazar müfettişinin testini ekler: bir nilüfer dalı suyu emer ve sütte kalır; bir saç teli süte batırılır ve hiçbir şey yapışmazsa suyla karıştırılmıştır, ancak birkaç damla yapışırsa saftır. İstanbul'da, Sufyan el-Sevri'nin adını taşıyan iki yüz dükkânda bin erkek manda sütü, Şuayb'ın adını taşıyan dükkânlarda ise sekiz yüz erkek koyun sütü satıyor. Dükkânsız sıcak süt satıcıları ise şafak vakti \"Sıcak, tatlı süt!\" diye bağırıyorlar."
  id: "Penjual susu adalah pedagang susu di pasar, dan ia memiliki pintu khusus di kantor pengawas pasar. Ibn al-Ukhuwwah memerintahkan agar wadah susu ditutup, tokonya dicat putih dan diberi genteng, serta atapnya baru, karena lalat tertarik pada susu. Ia juga memerintahkan agar mulut wadah ditutup rapat dengan sumbat serat bersih, dan agar baskom dan peralatan dicuci setiap hari dengan serat segar dan air bersih untuk mencegah susu cepat basi karena panas. Susu harus kental dan krimnya tetap utuh, jika tidak, susu akan kehilangan rasa dan kekentalannya. Menjual susu yang dicampur air sangat dilarang, dan tandanya adalah dengan menaruh setangkai bunga teratai di dalamnya. Al-Shayzari menambahkan tes pengawas pasar: setangkai bunga teratai akan menyerap air dan meninggalkan susu; sehelai rambut dicelupkan ke dalam susu, dan jika tidak ada yang menempel, berarti susu tersebut dicampur air, tetapi jika beberapa tetes menempel, berarti susu tersebut murni. Di Istanbul, terdapat seribu pria di dua ratus toko yang menjual susu kerbau, yang dinamai menurut nama Sufyan al-Thawri, dan delapan ratus pria di toko-toko yang menjual susu domba, yang dinamai menurut nama Shuaib. Para penjual susu panas tanpa toko berteriak di waktu subuh, \"Susu panas dan manis.\""
