craft:
  techniques:
    ar: "صنعة اللبّان صنعة حفظٍ وبيع: تغطية الأوعية، وسدّ أفواه الجرار بليف النخل النظيف، وتبييض الدكان وتبليطه وسقفه الجديد ضد الذباب، وغسل الأحواض كل يوم بليف جديد وماء نظيف حتى لا يفسد اللبن في الحر، وبيع اللبن غنياً بقشدته. وضد الغشّ علامات المحتسب: غصن عدس الماء عند ابن الأخوة، وعند الشيزري غصن طحلب الماء يفصل الماء عن اللبن، والشعرة المغموسة إن لم يعلق بها شيء فاللبن ممزوج وإن علقت قطرات فهو خالص."
    en: "The milk-seller's craft is keeping and selling: covered vessels, jar-mouths stopped with clean palm-fibre, a whitewashed, paved, newly roofed shop against the flies, vats washed daily with fresh fibre and clean water so the milk keeps in the heat, and milk sold rich with its cream. Against fraud the muhtasib had his signs: Ibn al-Ukhuwwa's sprig of marsh-lentil, and al-Shayzari's water-moss sprig that parts water from milk and the dipped hair — nothing clinging means watered milk, clinging droplets mean pure."
    ur: "دودھ فروش کا ہنر سنبھالنا اور بیچنا ہے: ڈھکے برتن، گھڑوں کے منہ میں صاف کھجور کا ریشہ، مکھیوں سے بچنے کو چونا لگی پتھر بچھی نئی چھت والی دکان، ہر روز نئے ریشے اور صاف پانی سے دھوتے حوض کہ دودھ گرمی میں نہ بگڑے، اور ملائی سمیت مالا دار دودھ کی فروخت۔ دھوکھے کے خلاف محتسب کی پہچانیں: ابن الاخوہ کی جھیل کی مسور کی ٹہنی، اور الشیزری کا طحلب جو پانی دودھ سے جدا کرے اور بگھویا بال — کچھ نہ لگے تو ملا ہوا، لگے قطرے تو خالص۔"
