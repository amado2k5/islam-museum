places:
  - place: place/medina
    note: "After the migration a school is attested at Medina; the entry describes the Badr captives who could write being freed in return for teaching ten Muslim children."
    sources: [source/tdv-mektep]
  - place: place/kufa
    note: "Dahhak ibn Muzahim built a large school here, which the entry says about 3000 children attended, and taught there without pay. His death is dated 105 AH (723); the school is undated."
    sources: [source/tdv-mektep]
  - place: place/baghdad
    note: "The Nizamiyya madrasa in Baghdad, in the reign of Alp Arslan. The entry records one dismissal of a müderris in his reign: Abu Ishaq al-Shirazi declined to teach there, Ibn al-Sabbagh was appointed, and was removed when al-Shirazi was persuaded."
    sources: [source/tdv-muderris]
  - place: place/bursa
    note: "Ahmed Pasha's first post, as müderris of the Muradiye Madrasa in Bursa, according to the TDV entry on him."
    sources: [source/tdv-ahmed-pasa-bursali]
  - place: place/istanbul
    note: "Mehmed II's first dar al-talim in Istanbul; the Sahn-i Seman madrasas; the public-lesson posts at the great mosques of the Fatih, the Suleymaniye and Bayezid; and the count of 1869 (eighty of 166 madrasas with 180 dersiams)."
    sources: [source/tdv-mektep, source/tdv-kadi-osmanli-ortayli, source/tdv-dersiam]
