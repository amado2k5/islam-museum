id: job/teacher
class: job
label: { ar: "المدرّس", en: "Teacher (mu'allim / mudarris)", ur: "مدرس" }
summary:
  ar: "المدرّس هو من يلقي الدرس على طلابه في المسجد أو المدرسة أو الكُتّاب. وتعرّفه موسوعة TDV بأنه العالم العالي الرتبة الذي يدرّس في المدرسة، وصارت الكلمة رسمية بعد أن أنشأ نظام الملك المدارس النظامية. وفي الدولة العثمانية صار المدرّس درجة في سلّم العلماء تُنال بالإجازة والتدرّج والامتحان، وكان معلّم الصبيان يعلّم القراءة والقرآن، وكان في الأغلب من خريجي المدارس."
  en: "The teacher gives lessons to pupils in a mosque, a madrasa or a kuttab. The TDV encyclopaedia defines the müderris as the high-ranking teacher who teaches in a madrasa; the word became official after Nizam al-Mulk founded the Nizamiyya madrasas. In the Ottoman period the post was a rank in the ranks of the learned, reached by licence, grades and examination. Teachers of children taught reading and the Qur'an, and were mostly madrasa graduates."
  ur: "استاد وہ شخص ہے جو مسجد، مدرسے یا کُتّاب میں شاگردوں کو درس دیتا ہے۔ TDV انسائیکلوپیڈیا مدرس کو مدرسے میں درس دینے والا اعلیٰ مرتبہ عالم کہتا ہے، اور یہ لفظ نظام الملک کے مدارس کے بعد رسمی ہوا۔ عثمانی دور میں یہ علماء کے مدارج میں ایک درجہ تھا جو اجازت، ترقی اور امتحان سے ملتا تھا۔"
