training:
  mode: mixed
  certification: "A licence (ijaza) from a teacher, and study in a madrasa. In the Ottoman period: a candidacy list kept by the kazasker, a graded climb through the madrasa ranks, and an examination before a board that included the kazasker, then an appointment by a tughra-sealed berat. The public-lesson title (dersiam) needed a further examination after the ijaza. Teachers of children before 1868 had no fixed certificate; from 1868 only graduates of the teachers' school could teach in sıbyan schools."
