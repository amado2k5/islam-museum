summary:
  ar: "القاصّ ⁦(وجمعه قصّاص)⁩ حكواتيّ واعظ يقصّ على العامة القصص الديني والعِبَر في المسجد والمجلس والسوق، فيلين قلوبهم ويعظهم؛ نشأت صناعته في خلافة عمر حين احتاج الناس إلى من يبسّط لهم الدين، وأوّل من قصّ بحسب الروايات عبيد بن عمير الليثي، وكان القصّاص الأوائل علماء ورجال ثقة. ثم انحطّت الصنعة: انتهازيون يختلقون الحكايات والإسرائيليات ويتكسّبون بها، فصنّف ابن الجوزي «القصّاص والمذكّرين» والسيوطي «تحذير الخواصّ من أكاذيب القصّاص»، ومنذ القرن الرابع الهجري حلّ لقبا الواعظ والمذكّر محل القاصّ."
  en: "The qass (plural qussas) was the storyteller-preacher who recited religious tales and cautionary stories to the common people in mosque, assembly and market, softening hearts and exhorting. His craft arose under the caliphate of Umar, when people needed the faith made plain; the first to 'tell' is said to have been Ubayd ibn Umayr al-Laythi, and the early qussas were scholars and trustworthy transmitters. Then the craft declined: opportunists invented tales and Isra'iliyyat to earn a living, so Ibn al-Jawzi wrote 'The Qussas and the Reminders' and al-Suyuti 'Warning the Elite against the Qussas' Lies', and from the fourth Islamic century the titles wa'iz and muzakkir replaced the qass."
  ur: "قاصّ ⁦(جمع قصّاص)⁩ وہ قصہ گو واعظ تھا جو مسجد، مجلس اور بازار میں عوام کو دینی قصے اور عبرت کی داستانیں سناتا، دل نرم کر کے نصیحت کرتا۔ یہ پیشہ عمر فاروق کے دور میں اس لیے پیدا ہوا کہ لوگوں کو آسان دین کی ضرورت تھی؛ روایات میں پہلا قاص عبید بن عمیر لیثی تھا اور ابتدائی قصّاص علماء اور معتبر راوی تھے۔ پھر پیشہ بگڑا: موقع پرستوں نے کسب کے لیے قصے اور اسرائیلیات گھڑ لئے، تب ابن الجوزی نے «القصّاص والمذکّرین» اور سیوطی نے «تحذیر الخواصّ من اکاذیب القصّاص» لکھی، اور چوتھی صدی ہجری سے واعظ اور مذکّر القاب قاص کی جگہ لینے لگے۔"
  es: "El qass (plural: qussas) era el narrador-predicador que recitaba cuentos religiosos e historias aleccionadoras al pueblo en la mezquita, la asamblea y el mercado, ablandando corazones y exhortando. Su oficio surgió bajo el califato de Umar, cuando la gente necesitaba que se les explicara la fe con claridad; se dice que el primero en \"contar\" fue Ubayd ibn Umayr al-Laythi, y los primeros qussas eran eruditos y transmisores de confianza. Luego, el oficio decayó: algunos oportunistas inventaron cuentos e Isra'iliyyat para ganarse la vida, por lo que Ibn al-Jawzi escribió \"Los Qussas y los Recordatorios\" y al-Suyuti \"Advirtiendo a la élite contra las mentiras de los Qussas\", y a partir del siglo IV islámico, los títulos de wa'iz y muzakkir reemplazaron al qass."
