summary:
  ar: "الحصّار هو من يضفر الحصر من القصب والبوص ويبيعها، والحصير بساط المساجد والبيوت. يضبط ابن الأخوة صنعة الحصّارين: ألا يُصبَغ من القصب إلا القُلْزُمي لأن الصبغ يُعفّن غيره ولا يتماسك، وألا يُصبَغ إلا بالفوّة القبرصية، وأن يُمتنع البَقَم لأنه يتغيّر لونه ويصفرّ إذا أصابه حامض، فإن غلت الفوّة وقلّت جاز ثلثاها بثلث بَقَم، وأن السواد يُصبَغ بماء الحديد والزاج، وأن تُنشَف الحصر في موضعها من المِرْبَد لئلا تضعف، وأن يكون الماء نقياً لأن الحصر يُصَلّى عليها في المساجد، وأن يُخاط جمعها بخيط الكتان، وألا تُقطَع حتى تُحكَم ضفرها، وتُباع بالأبيات وأفضلها مائة غرزة. وفي مصر تشالكرافت كان إنتاج السمر البلدي في الزقازيق وحدها نحو مائة ألف جنيه في السنة، وأضرب عمال الحصّاريّة في القاهرة في ٢٧ أبريل ١٩٠٧."
  en: "The hassar plaited the reed mats and sold them; the mat is the floor-covering of mosque and house alike. Ibn al-Ukhuwwa regulates the mat-makers' craft: no reeds but the qulzumi may be dyed, for dyeing rots the rest and they do not hold together; only Cyprus madder may be used, logwood being forbidden because it changes colour and yellows with anything acid — if madder is dear, two-thirds of it to one-third logwood; the black dye is made with iron-water and copperas; the mats are dried in the dye-pit on the spot so as not to weaken; the water must be pure because the mats are prayed upon in mosques; they are sewn with regular flax thread and not cut until properly plaited; they are sold by the bayt and the best have a hundred stitches. In Chalcraft's Egypt the production of samar baladi matting in Zaqaziq alone was worth about a hundred thousand pounds a year, and Cairo's mat-workers struck on 27 April 1907."
  ur: "حصار نرکل اور سرکنڈے کی چٹائیاں بُن کر بیچتا ہے؛ چٹائی مسجد اور گھر دونوں کا فرش ہے۔ ابن الاخوہ چٹائی سازوں کے پیشے کو ضبط کرتا ہے: رنگا صرف قلزمی نرکل جائے کہ رنگ باقی کو گلا دیتا ہے اور وہ مضبوط نہیں رہتے؛ رنگ صرف قبرصی مجیٹھ کا، سیاہ بقم ممنوع کہ رنگ بدلتا اور ترش چیز لگنے پر زرد ہو جاتا ہے — مجیٹھ مہنگی ہو تو دو حصہ مجیٹھ ایک حصہ بقم؛ سیاہ رنگ لوہے کے پانی اور زاگ سے؛ چٹائیاں اسی جگہ مربد میں خشک ہوں کہ کمزور نہ ہوں؛ پانی پاک ہو کہ ان پر مسجدوں میں نماز ہوتی ہے؛ سلائی سادے سن کے دھاگے سے؛ کاٹی نہ جائیں یہاں تک کہ بُنائی پکّی ہو؛ بیٹ کے حساب سے بکیں اور اچھی میں سو ٹانکے۔ چالکرافٹ کے مصر میں صرف زقازيق کے سمر بلدی چٹائیوں کی سالانہ پیداوار تقریباً ایک لکھ جنيه تھی، اور قاہرہ کے چٹائی مزدوروں نے ۲۷ اپریل ۱۹۰۷ کو ہڑتال کی۔"
