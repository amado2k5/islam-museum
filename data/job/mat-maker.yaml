craft:
  materials: []
  techniques:
    ar: "يفصّل ابن الأخوة أصباغ الحصر وأحكام ضفرها: القصب القُلْزُمي وحده يُصبَغ لأن الصبغ يُعفّن سواه، والفوّة القبرصية وحدها صبغاً جائزاً والبَقَم ممنوعاً لتغيّره واصفراره بالحوامض، فإن ندرت الفوّة أُجيز ثلثاها بثلث بَقَم، والسواد بماء الحديد والزاج، والتنشيف في المِرْبَد بمكانه لئلا تضعف الحصير، والماء نقياً لأن الناس يصلّون عليها في المساجد، والخياطة بخيط الكتان، ولا قَطْع قبل إحكام الضفر، وتُقدَّر بالأبيات وأعلاها مائة غرزة. ويحذّر الدلّالين من تنقيص المكيال إذا رأوا غرباء يشترون."
    en: "Ibn al-Ukhuwwa details the dyes and plaiting rules of the mats: only the qulzumi reed is dyed, for dyeing rots the others; only Cyprus madder is a lawful dye, logwood being barred for changing colour and yellowing with acids — when madder is scarce two-thirds madder to one-third logwood is allowed; black comes from iron-water and copperas; drying happens in the dye-pit where they stand lest the matting weaken; the water must be pure because people pray on these mats in the mosques; they are sewn with flax thread and never cut before the plaiting is firm; they are measured by the bayt, the best counting a hundred stitches. He also warns the criers not to give short measure when they see strangers buying."
    ur: "ابن الاخوہ چٹائیوں کے رنگ اور بُنائی کے اصول تفصیل سے بتاتا ہے: صرف قلزمی نرکل رنگا جاتا ہے کہ رنگ باقی کو گلا دیتا ہے؛ جائز رنگ صرف قبرصی مجیٹھ ہے، سیاہ بقم ممنوع کہ رنگ بدلتا اور ترشی سے زرد ہوتا ہے — مجیٹھ قلیل ہو تو دو حصہ مجیٹھ ایک حصہ بقم جائز؛ سیاہ رنگ لوہے کے پانی اور زاگ سے؛ خشک کرنا اسی جگہ مربد میں کہ چٹائی کمزور نہ ہو؛ پانی پاک کہ ان پر مسجدوں میں نماز ہوتی ہے؛ سن کے دھاگے سے سلائی؛ بُنائی پکّی ہوئے بغیر نہ کاٹی جائے؛ بیٹ کے حساب سے ناپی جائے اور اچھی میں سو ٹانکے۔ اور وہ دلالوں کو خبردار کرتا ہے کہ غریب الوطن خریداروں کو کم ناپ نہ دیں۔"
