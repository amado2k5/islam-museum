summary:
  ar: "الخبّاز من أهم أهل الحِرف عند المحتسب: يسجّل الشيزري أسماءهم ومواضع دكاكينهم في ديوانه، ويفرّقهم في طرق المدينة وسكناها لحاجة الناس إليهم، ويضبط نظافة العجن والخبز ويمنع غشّ الدقيق بالبقول والبورق. وفي القاهرة كان «الفرّان» يخبز ما تبعث به البيوت من خبز ولحم، وفي إسطنبول عدّ إوليا جلبي للخبّازين تسعمائة وتسعاً وتسعين دكاناً وبيرهم آدم."
  en: "The baker was among the most closely watched craftsmen under hisba: al-Shayzari has the muhtasib register bakers' names and shops, disperse the oven keepers through the town so no quarter lacks bread, enforce clean kneading and baking, and forbid the adulteration of flour with pulses or borax. In Cairo the farran baked the bread and meat households sent him, and in Istanbul Evliya counts nine hundred and ninety-nine bakers' shops, whose first patron, in guild lore, is Adam."
  ur: "محتسب کی نگاہ میں نان بائی اہم ترین کاریگروں میں تھا: الشیزری محتسب کو خبازوں کے نام اور دکانیں رجسٹر میں لکھنے، تنور والوں کو شہر بھر میں بکھیرنے تاکہ ہر محلے کو روٹی ملے، عجن اور پکائی کی صفائی پر اصرار اور بقول یا بورکس سے آٹے کی ملاوٹ پر پابندی کا حکم دیتا ہے۔ قاہرہ میں «فرّان» گھروں سے بھیجا ہوا آٹا اور گوشت پکاتا تھا، اور استنبول میں اولیاء چلبی خبازوں کی نوسو ننانوے دکانیں گنتا ہے جن کا صنعت کارانہ قصے میں پہلا پیر آدم ہے۔"
  es: "El panadero era uno de los artesanos más vigilados por la hisba: al-Shayzari ordenaba al muhtasib que registrara los nombres y las panaderías, que distribuyera a los encargados de los hornos por toda la ciudad para que ningún barrio careciera de pan, que impusiera una correcta amasada y horneado, y que prohibiera adulterar la harina con legumbres o bórax. En El Cairo, el farran horneaba el pan y la carne que le enviaban las familias, y en Estambul, Evliya contaba con novecientas noventa y nueve panaderías, cuyo primer patrón, según la tradición gremial, era Adán."
  fr: "Le boulanger figurait parmi les artisans les plus surveillés par la hisba: al-Shayzari fait recenser par les muhtasib les noms et les boutiques des boulangers, répartit les fourneaux dans toute la ville afin qu’aucun quartier ne manque de pain, impose des règles d’hygiène strictes pour le pétrissage et la cuisson, et interdit l’adultération de la farine avec des légumineuses ou du borax. Au Caire, le farran cuisait le pain et la viande que les familles lui envoyaient, et à Istanbul, Evliya compte neuf cent quatre-vingt-dix-neuf boulangeries, dont le premier patron, selon la tradition corporative, est Adam."
