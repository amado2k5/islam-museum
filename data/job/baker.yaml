craft:
  materials: [ceramic, brick]
  techniques:
    ar: "يضبط الشيزري صنعة الخباز: رفع سقف الدكان وفتح مداخن التنور ليخرج الدخان، ومسح التنور بخرقة نظيفة قبل الخبز، وتغطية أواني الماء وغسل مجامر العجن، وألا يعجن برجليه أو ركبتيه أو مرفقيه بل بثوب بلا أكمام أو ثوب صوف وأن يعتصب بعصابة بيضاء ويحلق شعر ذراعيه، ومن ينفخ الذباب عنه بالمذبّة. ويمنع غشّ الخبز بالجلبان والحمص والأرز والشويراني والبورق، ويأمر أن يُخبز بعد التخمير وأن يرشّ على القشرة الكمون والحبة السوداء والسمسم وحب المصطكى."
    en: "Al-Shayzari regulates the craft: raised shop ceilings and wide smoke-holes over the tannur, the oven wiped with a clean rag before baking, water containers covered and kneading troughs washed; the kneader must not use his feet, knees or elbows but wears a sleeveless or woollen gown, a white band on the forehead, shaves his arm hair, and someone fans the flies away. The bread must not be adulterated with vetch, chick-pea, rice or darnel flour or borax; it must be baked after rising and the crust sprinkled with white cumin, black cumin, sesame and mastic seeds."
    ur: "الشیزری دست کو ضبط کرتا ہے: دکان کی چھت بلند اور تنور پر دھوئیں کی وسیع روشندان، پکائی سے پہلے تنور صاف کپڑے سے پونچھنا، پانی کے برتن ڈھانپنا اور عجن کے حوض دھونا؛ آٹا گوندھنے والا پاؤں، گھٹنوں یا کہنیوں سے نہ گوندھے بلکہ بغیر آستین کا یا اونی کرتا پہنے، ماتھے پر سفید پٹی باندھے، بازو کے بال منڈوائے اور کوئی مکھیاں بھگائے۔ روٹی میں جؤ، چنے، چاول یا درمل کے آٹے اور بورکس کی ملاوٹ ممنوع؛ خمیر اٹھنے کے بعد پکائی جائے اور پرت پر سفید زیرہ، کلونجی، تل اور مصطکی کے دانے چھڑکے جائیں۔"
