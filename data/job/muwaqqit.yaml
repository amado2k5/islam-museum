summary:
  ar: "الموقّت هو الموظف في المؤسسات الدينية الذي يعيّن الوقت — وقبل كل شيء أوقات الصلاة — بالشمس والقمر والنجوم، ويسمّى علمه علم الميقات؛ أما الفلكي الذي يعمل فيه بحثاً علمياً فيسمّى الميقاتي. وضع الفلكيون منذ القرن التاسع جداول «الأوقات الخمسة» لكل درجة طول وكل يوم من السنة وجداول تعيين القبلة، وبلغ هذا العمل ذروته في دمشق القرن الرابع عشر. وكان الموقّت يعمل في الموقّتخانه؛ ومن أشهر العثمانيين مصطفى بن علي الموقّت الذي خدم طويلاً موقّتاً بجامع السلطان سليم ثم صار منجّم باشياً، وكتب بالتركية رسائل آلات الفلك فصارت مراجع الموقّتين إلى آخر الدولة."
  en: "The muwaqqit was the officer of the religious institution who fixed the times — above all the prayer times — by the sun, moon and stars; his science is ilm-i mikat, while the astronomer who pursued it as research was called mîkâtî. From the ninth century the astronomers prepared tables of the 'five times' (el-evkâtü'l-hamse) for every degree of longitude and every day of the year, together with qibla tables, and the work reached its height in fourteenth-century Damascus. The muwaqqit worked in the muvakkithane. The best-known Ottoman among them is Mustafa b. Ali el-Muvakkit, who served long as muvakkit of the Sultan Selim mosque before becoming müneccimbaşı, and whose Turkish treatises on the astronomical instruments became the muvakkits' handbooks to the end of the empire."
  ur: "موقّت مذہبی ادارے کا وہ مامور تھا جو سورج، چاند اور ستاروں سے وقت — بالخصوص اوقاتِ نماز — مقرر کرتا تھا؛ اس کا علم علمِ میقات کہلایا، جبکہ اسے تحقیق کے طور پر کرنے والا فلکیات دان میقاتی کہا گیا۔ نویں صدی عیسوی سے فلکیات دانوں نے ہر درجۂ طول اور سال کے ہر دن کے لیے «پانچ اوقات» کے جدول اور قبلہ کے جدول بنائے، اور یہ کام چودہویں صدی کے دمشق میں اپنے عروج پر پہنچا۔ موقّت موقّت خانے میں کام کرتا تھا۔ مشہور عثمانی موقّت مصطفیٰ بن علی الموقّت ہے جو برسوں جامع سلطان سلیم کا موقّت رہا، پھر منجّم باشی بنا، اور جس کی ترکی میں لکھی فلکی آلات کی رسالیاں سلطنت کے آخر تک موقّتوں کی رہنما کتابیں رہیں۔"
  es: "El muwaqqit era el funcionario de la institución religiosa que fijaba los horarios —sobre todo los de oración— según el sol, la luna y las estrellas; su ciencia se denominaba ilm-i mikat, mientras que al astrónomo que la estudiaba se le llamaba mîkâtî. Desde el siglo IX, los astrónomos elaboraron tablas de los «cinco tiempos» (el-evkâtü'l-hamse) para cada grado de longitud y cada día del año, junto con tablas de la qibla, y este trabajo alcanzó su apogeo en la Damasco del siglo XIV. El muwaqqit trabajaba en el muvakkithane. El otomano más conocido entre ellos es Mustafa b. Ali el-Muvakkit, quien sirvió durante mucho tiempo como muvakkit de la mezquita del sultán Selim antes de convertirse en müneccimbaşı, y cuyos tratados turcos sobre instrumentos astronómicos se convirtieron en los manuales de los muvakkits hasta el final del imperio."
