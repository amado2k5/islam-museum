id: job/shaykh-al-islam
class: job
label: { ar: "شيخ الإسلام", en: "Shaykh al-Islam", ur: "شیخ الاسلام" }
summary:
  ar: "شيخ الإسلام هو عنوان أعلى عالم في التنظيم العلمي العثماني ⁦(الإلمية)⁩، وقد ارتبط بمنصب مفتي إسطنبول. وكان للشيخ الإسلام الإفتاء في القضايا الدينية والسياسية والإدارية، وتعيين العلماء والمفتين، وحضور مجالس المشورة، وإعلان فتاوى عزل السلاطين في الأزمات. وألغي المنصب سنة 1924 مع الخلافة."
  en: "The Shaykh al-Islam was the title of the highest scholar in the Ottoman ilmiye, the religious-scholarly hierarchy, and it became the title of the Istanbul muftiship. The office gave fatwas on religious, political and administrative questions, appointed scholars and muftis, sat in the consultative councils, and issued fatwas in crises, including fatwas on deposing sultans. It ended in 1924 with the caliphate."
  ur: "شیخ الاسلام عثمانی علمی درجہ بندی (ilmiye) کے سب سے بڑے عالم کا لقب تھا، جو استنبول کے مفتی کے منصب سے وابستہ ہوا۔ یہ منصب دینی، سیاسی اور انتظامی سوالات پر فتوے دیتا، علماء اور مفتیوں کا تقرر کرتا، مشاورتی مجالس میں بیٹھتا، اور بحرانوں میں فتوے دیتا تھا۔ یہ منصب 1924ء میں خلافت کے خاتمے کے ساتھ ختم ہوا۔"
