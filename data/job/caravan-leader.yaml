summary:
  ar: "قائد القافلة هو من يسيّر قافلة البهائم الحاملة للبضائع والركّاب بين البلدان البعيدة، فيعرف طرقها ومواضع الماء والمنازل، ويقسّم السير نهاراً وليلاً، ويحرسها بأصحاب السلاح والمناوبين والبيرقدار الذي يمشي وراءه يلوّح بالراية عند الخطر، وعند النزول تُنزَل الأحمال وتُرتَّب البضائع حصناً للدفاع. كانت أقدم قوافل منظّمة معروفة قوافل تجّار آشور بين آشور وكانش، وحملت قوافل قريش تجارتها شتاءً وصيفاً، وبلغت قوافل الحج أحياناً مئة ألف راكب ودابة، وكان أصحاب الماء «التكاشفة» يُستخدمون أدلّاء في الصحارى حتى إن بعض البلدان اختاروا العميان لحدّة حواسّهم."
  en: "The caravan leader marched a train of pack animals carrying goods and travellers between distant towns: he knew the route, the wells and the halting-places, ordered the marches by day and night, and guarded the train with armed men, drummed watchmen and the bayraktar who rode behind him waving the banner when danger came; at halts the loads were stacked into a four-cornered breastwork. The first known regular caravan business ran donkey trains between Assur and Kanesh; the Quraysh caravans carried Mecca's trade winter and summer; hajj caravans could reach a hundred thousand souls and beasts; and desert guides called tekşif were hired to find water, some countries choosing blind men for the sharpness of their senses."
  ur: "قافلہ سالار دور دراز شہروں کے درمیان مال اور مسافر اٹھانے والے جانوروں کے قطار کو چلاتا تھا: راستہ، چشمے اور منزلیں جانتا، دن رات کے سفر کا انتظام کرتا، مسلح محافظوں، ڈھول بجانے والے چوکیداروں اور خطرے پر جھنڈا ہلانے والے بیرقدار سے قافلے کی حفاظت کراتا، اور پڑاؤ پر بوجھ چار کونے کی سنگل بناتا۔ پہلی معلوم باقاعدہ قافلہ بازی آشور اور کانیش کے درمیان گدھوں کے قطاروں سے چلی؛ قریش کے قافلے سردی گرمی میں مکہ کی تجارت اٹھاتے؛ حج قافلوں کی تعداد ایک لاکھ تک پہنچ جاتی؛ اور پانی کی تلاش کے لیے تکشف نامی رہنما رکھے جاتے، بعض ممالک میں ان کی حسّی کی تیزی کے سبب نابینا لوگ چنے جاتے۔"
  es: "El líder de la caravana dirigía un convoy de animales de carga que transportaban mercancías y viajeros entre pueblos distantes: conocía la ruta, los pozos y las paradas, ordenaba las marchas de día y de noche, y custodiaba el convoy con hombres armados, vigías que tocaban el tambor y el bayraktar que cabalgaba detrás de él ondeando el estandarte cuando había peligro; en las paradas, las cargas se apilaban formando un parapeto de cuatro esquinas. El primer negocio regular de caravanas conocido operaba con caravanas de burros entre Assur y Kanesh; las caravanas de los Quraysh transportaban el comercio de La Meca en invierno y verano; las caravanas del Hajj podían llegar a cien mil personas y animales; y se contrataba a guías del desierto llamados tekşif para encontrar agua, algunos países elegían a hombres ciegos por la agudeza de sus sentidos."
  fr: "Le chef de caravane menait un convoi d'animaux de bât transportant marchandises et voyageurs entre des villes éloignées: il connaissait la route, les puits et les haltes, organisait les marches jour et nuit et protégeait le convoi avec des hommes armés, des veilleurs au tambour et le bayraktar qui, chevauchant derrière lui, agitait l'étendard en cas de danger; aux haltes, les chargements étaient empilés en un rempart à quatre angles. Les premières caravanes régulières connues effectuaient des convois d'ânes entre Assur et Kanesh; les caravanes quraychites transportaient le commerce de La Mecque hiver comme été; les caravanes du hajj pouvaient transporter jusqu'à cent mille personnes et bêtes; et des guides du désert, appelés tekşif, étaient engagés pour trouver de l'eau, certains pays choisissant des aveugles pour leur acuité sensorielle."
  tr: "Kervan lideri, uzak diyarlar arasında mal ve yolcu taşıyan hayvan kervanına rehberlik eden kişidir. Güzergahları, su kaynaklarını ve mola yerlerini bilir, yolculuğu gündüz ve geceye böler ve silahlı adamlar, bekçiler ve tehlike anında arkasında sancak sallayan bir sancaktar ile kervanı korur. Duraklarda yükler boşaltılır ve mallar savunma için düzenlenir. Bilinen en eski organize kervanlar, Asur ve Kaneş arasında seyahat eden Asurlu tüccarların kervanlarıydı. Kureyş kervanları ticaretlerini hem kış hem de yaz aylarında sürdürürken, Hac kervanları bazen yüz bin kadar bin bin atlı ve hayvandan oluşabiliyordu. Çöllerde rehber olarak \"Takashifa\" olarak bilinen su taşıyıcıları çalıştırılırken, bazı ülkelerde keskin duyuları nedeniyle kör insanlar bile seçiliyordu."
  id: "Pemimpin kafilah adalah orang yang memandu kafilah hewan yang membawa barang dan penumpang antara negeri-negeri yang jauh. Ia mengetahui rute, sumber air, dan tempat peristirahatan, membagi perjalanan menjadi siang dan malam, dan menjaganya dengan orang-orang bersenjata, penjaga, dan pembawa panji yang berjalan di belakangnya, mengibarkan panji jika terjadi bahaya. Setelah berhenti, muatan diturunkan dan barang-barang diatur untuk pertahanan. Kafilah terorganisir tertua yang diketahui adalah kafilah pedagang Asyur antara Asyur dan Kanesh. Kafilah Quraisy melakukan perdagangan mereka baik di musim dingin maupun musim panas, dan kafilah Haji terkadang berjumlah hingga seratus ribu penunggang dan hewan. Pembawa air, yang dikenal sebagai \"Takashifa,\" dipekerjakan sebagai pemandu di padang pasir, dan di beberapa negara, orang buta bahkan dipilih karena indra mereka yang tajam."
