summary:
  ar: "الكيميائي هو من يشتغل بعلم الكيمياء — وقد سمّاه المتقدمون أيضاً علم الصنعة وعلم التدبير وعلم الحجر وعلم الميزان — ويعنى ببنى الأجسام وتفاعلاتها وتراكيبها الجديدة. دخل العلم المسلمين ميراثَ الإسكندرية القديمة، فكان خالد بن يزيد بن معاوية أول من اشتغل به إذ ترجم له كتب من اليونانية والقبطية، ثم أسسه جابر بن حيان في الكوفة فاستكشف معادن وحموضاً ووضع أقدم وصفة معروفة لإنتاج حمض النتريك، وبلغ به أبو بكر الرازي الذروة بمناهجه التجريبية وكتابه «سر الأسرار» الذي قسّم فيه المواد الكيميائية ورسم نحو عشرين آلة من آلات مخبره بقيت مستعملة إلى القرن التاسع عشر."
  en: "The chemist worked ilm al-kimya — also named by the early writers ilm al-san'a, ilm al-tadbir, ilm al-hajar and ilm al-mizan — the inquiry into the composition of bodies, their interactions and the making of new compounds. The science entered Islam as the heir of ancient Alexandria: Khalid ibn Yazid ibn Mu'awiya was the first Muslim to pursue it, having books translated from Greek and Coptic; Jabir ibn Hayyan founded it systematically at Kufa, discovering minerals and acids and giving the oldest known recipe for producing nitric acid; and Abu Bakr al-Razi carried it to its height with his experimental methods, his Kitab Sirr al-asrar classifying chemical substances and picturing some twenty instruments of his laboratory that stayed in use into the nineteenth century."
  ur: "کیمیا دان وہ شخص تھا جو علمِ کیمیا پر کام کرتا تھا — جسے قدیم مصنفین علمِ صنعت، علمِ تدبیر، علمِ حجر اور علمِ میزان بھی کہتے تھے — یعنی اجسام کی بناوٹ، ان کے باہمی عمل اور نئے مرکبات بنانے کا علم۔ یہ علم مسلمانوں کو قدیم اسکندریہ کے ورثے میں ملا: خالد بن یزید بن معاویہ پہلے مسلمان تھے جنھوں نے یونانی اور قبطی کتابوں کے ترجمے کرا کے اس میں دلچسپی لی؛ جابر بن حیان نے کوفہ میں اسے منظم بنیاد دی، معادن اور تیزاب دریافت کیے اور نائٹریک ایسڈ بنانے کی قدیم ترین معلوم نسخہ پیش کیا؛ اور ابو بکر رازی نے تجرباتی طریقوں سے اسے عروج تک پہنچایا، جن کی کتاب «سر الاسرار» میں کیمیائی اشیاء کی تقسیم اور ان کی لیبارٹری کے تقریباً بیس اوزاروں کے نقشے ہیں جو انیسویں صدی تک مستعمل رہے۔"
  es: "El químico se dedicó al ilm al-kimya —también denominado por los primeros escritores ilm al-san'a, ilm al-tadbir, ilm al-hajar e ilm al-mizan—, la investigación de la composición de los cuerpos, sus interacciones y la creación de nuevos compuestos. Esta ciencia se introdujo en el Islam como heredera de la antigua Alejandría: Khalid ibn Yazid ibn Mu'awiya fue el primer musulmán en cultivarla, haciendo traducir libros del griego y del copto; Jabir ibn Hayyan la fundó sistemáticamente en Kufa, descubriendo minerales y ácidos y proporcionando la receta más antigua conocida para producir ácido nítrico; y Abu Bakr al-Razi la llevó a su máximo esplendor con sus métodos experimentales, y su Kitab Sirr al-asrar clasificó las sustancias químicas e ilustró unos veinte instrumentos de su laboratorio que se mantuvieron en uso hasta el siglo XIX."
  fr: "Le chimiste travaillait sur l'ilm al-kimya — également appelé par les premiers auteurs ilm al-san'a, ilm al-tadbir, ilm al-hajar et ilm al-mizan — l'étude de la composition des corps, de leurs interactions et de la synthèse de nouveaux composés. Cette science entra dans l'Islam comme héritière de l'ancienne Alexandrie: Khalid ibn Yazid ibn Mu'awiya fut le premier musulman à s'y consacrer, faisant traduire des ouvrages du grec et du copte; Jabir ibn Hayyan la développa de manière systématique à Koufa, découvrant des minéraux et des acides et fournissant la plus ancienne recette connue pour la production d'acide nitrique; et Abu Bakr al-Razi la porta à son apogée grâce à ses méthodes expérimentales, son Kitab Sirr al-asrar classant les substances chimiques et illustrant une vingtaine d'instruments de son laboratoire qui restèrent en usage jusqu'au XIXe siècle."
  tr: "Kimyager, eski çağlarda zanaatkarlık bilimi, yönetim bilimi, taş bilimi ve denge bilimi olarak da adlandırılan kimya biliminde çalışan ve maddelerin yapıları, reaksiyonları ve yeni bileşimleriyle ilgilenen kişidir. Bu bilim, eski İskenderiye'den miras olarak Müslüman dünyasına girmiştir. Halid ibn Yazid ibn Muaviye, Yunanca ve Kıptice'den kitaplar çevirerek bu alanda çalışan ilk kişi olmuştur. Daha sonra Cabir ibn Hayyan, Kufa'da bu bilimi kurmuş, mineralleri ve asitleri incelemiş ve nitrik asit üretimi için bilinen en eski tarifi formüle etmiştir. Ebu Bekir el-Razi, deneysel yöntemleri ve kimyasal maddeleri sınıflandırdığı ve laboratuvarından yaklaşık yirmi aletin çizimini yaptığı \"Sırların Sırrı\" adlı kitabıyla bu bilimi zirveye taşımıştır; bu aletler 19. yüzyıla kadar kullanılmıştır."
  id: "Seorang ahli kimia adalah seseorang yang bekerja di bidang ilmu kimia—yang oleh orang-orang zaman dahulu juga disebut ilmu kerajinan, ilmu manajemen, ilmu batu, dan ilmu keseimbangan—dan berkaitan dengan struktur zat, reaksinya, dan komposisi baru. Ilmu ini memasuki dunia Muslim sebagai warisan dari Aleksandria kuno. Khalid ibn Yazid ibn Muawiyah adalah orang pertama yang menekuninya, menerjemahkan buku-buku dari bahasa Yunani dan Koptik. Kemudian Jabir ibn Hayyan mendirikannya di Kufa, di mana ia meneliti mineral dan asam serta merumuskan resep tertua yang diketahui untuk menghasilkan asam nitrat. Abu Bakr al-Razi membawanya ke puncak kejayaannya dengan metode eksperimentalnya dan bukunya \"Rahasia dari Segala Rahasia,\" di mana ia mengklasifikasikan zat-zat kimia dan menggambarkan sekitar dua puluh instrumen dari laboratoriumnya yang tetap digunakan hingga abad kesembilan belas."
