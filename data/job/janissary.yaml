training:
  mode: state-licence
  certification: "Entry ran through the state's own intake: pencik captives and later devşirme boys spent five to eight years 'on the Turk' in Anatolian and Rumelian households, then passed into the Acemi Ocağı at Gelibolu and Istanbul, and after a service term the registers show as fifteen to twenty years they 'went out to the gate' (kapıya çıkma) into the corps or palace services — a legal transition debated as manumission. Once in the ortas the janissary was bound to weekly musket drill under a 1552 order, though by the early seventeenth century drill lapsed except before great campaigns."
  duration: "Five to eight years in a Turkish household, then the Acemi Ocağı until 'going out'; the novice acemi oğlanı might then serve years more in palace gardens, dockyards or on the fleet before full enrolment."
