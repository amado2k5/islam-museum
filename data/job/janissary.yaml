summary:
  ar: "الإنكشاري جندي المشاة المأجور الدائم في الجيش العثماني، من أول الأمر مئة أو ألف أسير تحت أورخان ومراد الأول حتى صار أكثر من خمسين ألفاً في القرن السابع عشر. جُنّد أولاً من خُمس أسرى الحرب ⁦(البنجك)⁩ ثم بالدوشرمة: أولاد الرعايا النصارى يُربَّون في بيوت الترك خمس إلى ثماني سنين ثم يُسجَّلون في أوجاق الأجانب ⁦(الأجمي أوجاغي)⁩ فينقلون إلى الإنكشارية أو يُفرزون للقصر. نظّم الأوجاق في مئة وستة وتسعين أورتا ⁦(جمعت وسكبان وبولوك)⁩ تحت آغا الإنكشارية وديوانه المستقل إدارياً وقضائياً، وكانوا يتقاضون العلوفة كل ثلاثة أشهر. سلّحوا بالقوس في كوسوفا 1389 ثم بالبندقية من القرن الخامس عشر، فكسروا عدوهم في موهاج 1526 بالنيران المتتابعة، ثم تحلوا بالتجارة والسياسة ورفعوا القِدْر ⁦(قازان قالدرما)⁩ حتى أبادتهم الدولة في الواقعة الخيرية ⁦(وقعة خيرية)⁩ 14 حزيران 1826."
  en: "The janissary was the standing, salaried foot soldier of the Ottoman army — perhaps a thousand prisoners under Orhan and Murad I, more than fifty thousand by the seventeenth century. He was recruited first from the one-fifth share of war captives (pencik), then by the devşirme levy: Christian boys raised five to eight years in Turkish households, enrolled in the Acemi Ocağı and then passed 'out to the gate' as janissaries or selected for the palace. The corps stood in 196 ortas under three divisions — cemaat, sekban and bölük — commanded by the yeniçeri ağası and his autonomous ağa divanı, and drew the ulûfe every three months. Bow-armed at Kosovo in 1389, musket-armed from the fifteenth century, the janissaries broke the enemy with rolling volleys at Mohács in 1526, then turned to trade and politics, 'overturned the cauldron' in rising after rising, and were destroyed by the state in the Vak'a-i Hayriyye of 14 June 1826."
  ur: "ینکری عثمانی فوج کا مستقل تنخواہ دار پیادہ تھا — اورخان و مراد اول کے زمانے میں قریب ایک ہزار قیدیوں سے بڑھ کر سترہویں صدی میں پچاس ہزار سے زائد۔ پہلے جنگی قیدیوں کے پانچویں حصے ⁦(پنجیک)⁩ سے، پھر دوشیرمہ نظام سے بھرتی ہوا: مسیحی لڑکے ترک گھرانوں میں پانچ سے آٹھ سال پالتے، اجمی اجاق میں اندراج ہوتا، پھر «دروازے پر نکل» کر ینکری بنتا یا محل کے لیے چنا جاتا۔ دستہ 196 ارتوں میں تین شعبوں ⁦(جماعت، سکبان، بولوک)⁩ کے نیچے ینکری آغا اور اس کے خود مختار آغا دیوان کے ماتحت تھا اور تنخواہ ⁦(علوفہ)⁩ تین ماہ بعد ملتی۔ 1389 کے کوسوو میں کمان دار، پندرہویں صدی سے بندوقچی، انہوں نے 1526 میں موہاچ میں مسلسل گولی باری سے دشمن توڑا، پھر تجارت اور سیاست میں آئے، بغاوتوں میں «دیگ الٹتے» رہے، بالآخر 14 جون 1826 کو واقعہ خیریہ میں ریاست نے انہیں ختم کر دیا۔"
  es: "El jenízaro era el soldado de infantería permanente y asalariado del ejército otomano; quizás mil prisioneros bajo Orhan y Murad I, más de cincuenta mil en el siglo XVII. Se reclutaba primero de la quinta parte de los prisioneros de guerra (pencik), luego mediante el leva devşirme: niños cristianos criados de cinco a ocho años en hogares turcos, inscritos en el Acemi Ocağı y luego enviados a las puertas como jenízaros o seleccionados para el palacio. El cuerpo estaba formado por 196 ortas bajo tres divisiones —cemaat, sekban y bölük— comandadas por el yeniçeri ağası y su ağa divanı autónomo, y recibía el ulûfe cada tres meses. Armados con arcos en Kosovo en 1389, y con mosquetes desde el siglo XV, los jenízaros derrotaron al enemigo con descargas en Mohács en 1526, luego se dedicaron al comercio y la política, \"voltearon el caldero\" en levantamiento tras levantamiento, y fueron destruidos por el Estado en la Vak'a-i Hayriyye del 14 de junio de 1826."
  fr: "Le janissaire était le fantassin salarié de l'armée ottomane – environ un millier de prisonniers sous Orhan et Murad Ier, plus de cinquante mille au XVIIe siècle. Il était recruté d'abord parmi le cinquième des prisonniers de guerre (pencik), puis par la levée devşirme: des garçons chrétiens élevés de cinq à huit ans dans des familles turques, enrôlés dans l'Acemi Ocağı, puis envoyés au palais comme janissaires ou sélectionnés pour la cour. Le corps était organisé en 196 ortas, répartis en trois divisions – cemaat, sekban et bölük – commandées par le yeniçeri ağası et son ağa divanı autonome, et percevait l'ulûfe tous les trois mois. Armés d'arcs à Kosovo en 1389, puis de mousquets à partir du XVe siècle, les janissaires brisèrent l'ennemi par des volées roulantes à Mohács en 1526, puis se tournèrent vers le commerce et la politique, « renversèrent le chaudron » en se soulevant les uns après les autres, et furent finalement anéantis par l'État lors du Vak'a-i Hayriyye du 14 juin 1826."
