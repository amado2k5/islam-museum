  techniques:
    ar: "يفصّل ابن الأخوة عمل المعصرة: يُغسل السمسم ويُنقّى ويُحمّص ويُدقّ حتى يذهب قشره ثم يُطحَن، ولا ينزل العامل إلى المعصرة إلا وقد نظّف رجليه بالحجر، وعليه زيّ ضيّق الأكمام خشية العرق، وفمه مغطّى لئلا يسقط من بصاقه شيء عند الكلام، وتُغطّى الأحواض بحصير النخل عند فراغ العمل. ويحذّر من غشّ عاصري الزيتون الحار الذين يعصرون بذر القطن دون تحميص فيُخفي عيب الرائحة ويُمزج زيته بزيت الزيتون الحلو، وينبّه إلى أن زيت بذر القرطم يضرّ بالحبالى، وأن الجرار والمكاييل تُختبر."
    en: "Ibn al-Ukhuwwa details the pressman's work: the sesame is washed, cleansed, roasted and pounded until all the husk has gone, then ground; no workman descends to press it until he has cleaned his feet with a scrubbing-stone, wearing a narrow-sleeved coat against perspiration and with his mouth covered so that no spittle drops when he speaks; and the troughs are covered with palm-leaf mats when work has ceased. He warns against the hot olive-oil pressers who press unroasted cotton-seed so that its smell stays hidden and its oil can be mixed into sweet olive oil, notes that safflower-seed oil harms pregnant women, and orders the bottles and measures tested."
    ur: "ابن الاخوہ کولھو کے کام کی تفصیل دیتا ہے: تل دھوئے، صاف، بھنے اور کٹے جائیں یہاں تک کہ چھلکہ جدا ہو پھر پیسے جائیں؛ مزدور پتھر سے پاؤں صاف کیے، تنگ آستین پہنے کہ پسینہ نہ ٹپکے اور منہ ڈھانپے کہ بولتے وقت لعاب نہ گرے، کولھو میں اترے؛ اور کام مکنے پر حوض کھجور کے پتوں کی چٹائیوں سے ڈھانپے جائیں۔ وہ گرم زیتون کے تیل نچوڑنے والوں کے دھوکھے سے خبردار کرتا ہے جو بنا بھنے کپاس کے بیج نچوڑتے ہیں کہ بو چھپی رہے اور اس کا تیل شیریں زیتون کے تیل میں ملایا جا سکے، بتاتا ہے کہ قِرطم کے بیج کا تیل حاملہ عورتوں کو نقصان دیتا ہے، اور بوتلوں اور ناپوں کی جانچ کا حکم دیتا ہے۔"
