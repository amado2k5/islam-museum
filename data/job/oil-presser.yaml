summary:
  ar: "الزيّات هو صاحب المعصرة الذي يعصر السمسم والزيتون ويبيع الزيت. يضبط ابن الأخوة المعاصر: أن يُوكَل بها رجل أمين يعرف صناعتها، وألا يُعصَر السمسم إلا مغسولاً مُنقّى محمَّصاً مقشوراً ثم مطحوناً، وألا ينزل العامل إلى المعصرة إلا وقد غسل رجليه بالحجر ولبس زيّاً ضيّق الأكمام خشية العرق وغطّى فمه لئلا يسقط بصاقه، وأن تُغطّى الأحواض بحصير النخل بعد العمل، وأن تُقاس الجرار لأن وزنها ينقص في الصيف. وفي قاهرة لين كان الزيّات يبيع السمن والجبن والعسل مع الزيت، وفي إسطنبول إوليا لتجّار زيت بذر الكتان وزيت الزيتون طائفتان مسلّحتان."
  en: "The zayyat ran the oil press and sold the oil. Ibn al-Ukhuwwa regulates the presses: a trustworthy man who knows the craft must be set over them; sesame must be washed, cleansed, roasted, pounded free of husk and then ground before it is pressed; no workman may go down to press it until he has scrubbed his feet with a stone, wears a close-sleeved coat against sweat and covers his mouth lest spittle fall; the troughs must be covered with palm-leaf mats when work stops; and the jars measured, for their weight falls in summer. In Lane's Cairo the zayyat sold butter, cheese and honey as well as oil, and in Evliya's Istanbul the linseed-oil and olive-oil merchants marched as two armed guilds."
  ur: "زیات تیل کولھو کا مالک اور تیل فروش ہے۔ ابن الاخوہ کولھوؤں کو ضبط کرتا ہے: ان پر ایک ایمان دار، پیشہ جاننے والا مقرر ہو؛ تل دھو کر صاف، بھن کر بچھویا اور چھلکہ اتار کر پیسے جائیں پھر نچوڑے جائیں؛ مزدور پتھر سے پاؤں رگڑ کر، تنگ آستین پہن کر کہ پسینہ نہ ٹپکے اور منہ ڈھانپ کر کہ لعاب نہ گرے، کولھو پر اترے؛ کام مکنے پر کھجور کے پتوں کی چٹائیاں حوضوں پر ڈھانپی جائیں؛ اور مرتبان ناپے جائیں کہ گرمی میں وزن گھٹتا ہے۔ لین کے قاہرہ میں زیات تیل کے ساتھ مکھن، پنیر اور شہد بھی بیچتا تھا، اور اولیاء چلبی کے استنبول میں السی اور زیتون کے تیل فروش دو مسلح انجمنیں بناتے تھے۔"
  es: "El zayyat gestionaba la prensa de aceite y vendía el aceite. Ibn al-Ukhuwwa regulaba las prensas: debía ponerse a cargo un hombre de confianza que conociera el oficio; el sésamo debía lavarse, limpiarse, tostarse, descascarillarse y molerse antes de prensarlo; ningún trabajador podía bajar a prensarlo hasta que se hubiera frotado los pies con una piedra, llevara una chaqueta de mangas ajustadas para protegerse del sudor y se cubriera la boca para evitar que le cayera saliva; las artesas debían cubrirse con esteras de hojas de palma cuando se detuviera el trabajo; y las tinajas debían medirse, pues su peso disminuía en verano. En el Cairo de Lane, el zayyat vendía mantequilla, queso y miel, además de aceite, y en el Estambul de Evliya, los comerciantes de aceite de linaza y de aceite de oliva marchaban en dos gremios armados."
  fr: "La zayya gérait le pressoir à huile et vendait l'huile. Ibn al-Ukhuwwa réglemente le fonctionnement des pressoirs: un homme de confiance, connaissant le métier, doit en être responsable; le sésame doit être lavé, nettoyé, grillé, décortiqué puis moulu avant d'être pressé; aucun ouvrier ne peut descendre presser l'huile sans s'être frotté les pieds avec une pierre, avoir revêtu un manteau à manches serrées pour se protéger de la transpiration et s'être couvert la bouche pour éviter les projections de salive; les cuves doivent être recouvertes de nattes de feuilles de palmier à l'arrêt; et les jarres doivent être mesurées, car leur poids diminue en été. Dans le Caire de Lane, la zayya vendait du beurre, du fromage et du miel, ainsi que de l'huile, et dans l'Istanbul d'Evliya, les marchands d'huile de lin et d'huile d'olive défilaient comme deux guildes armées."
  tr: "Zeytinyağı tüccarı, susam ve zeytinleri sıkıp yağını satan zeytinyağı presinin sahibidir. Zeytinyağı presinin yeğeni, işletmenin işini bilen güvenilir bir adam tarafından yönetilmesini; susamın yıkanıp, temizlenip, kavrulup, kabuğu soyulup ve öğütüldükten sonra sıkılmasını; işçinin terlemeyi önlemek için dar kollu giysiler giyip, ağzını kapatarak ve ayaklarını taşla yıkadıktan sonra prese girmesini; iş bittikten sonra kapların palmiye yapraklarıyla örtülmesini; ve yazın ağırlıkları azaldığı için kapların ölçülmesini şart koşar. Kahire'de zeytinyağı tüccarları yağın yanı sıra tereyağı, peynir ve bal da satarken, İstanbul'da keten tohumu yağı ve zeytinyağı tüccarları için iki silahlı grup görevlendirilmişti."
  id: "Pedagang minyak adalah pemilik penggiling minyak yang menggiling wijen dan zaitun lalu menjual minyaknya. Keponakan pemilik penggiling minyak menetapkan bahwa penggilingan tersebut harus dikelola oleh orang yang dapat dipercaya dan memahami perdagangannya; bahwa wijen hanya boleh digiling setelah dicuci, dibersihkan, dipanggang, dikupas, dan kemudian digiling; bahwa pekerja hanya boleh memasuki penggilingan setelah mencuci kakinya dengan batu, mengenakan pakaian berlengan ketat untuk menghindari keringat, dan menutup mulutnya untuk mencegah air liur menetes; bahwa baskom ditutup dengan pelepah palem setelah pekerjaan selesai; dan bahwa guci diukur karena beratnya berkurang di musim panas. Di Kairo, pedagang minyak menjual ghee, keju, dan madu bersama dengan minyak, dan di Istanbul, dua kelompok bersenjata ditempatkan untuk mengawasi pedagang minyak biji rami dan minyak zaitun."
