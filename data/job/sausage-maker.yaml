craft:
  techniques:
    ar: "صنعة النقانقي تسير على خطوات مضبوطة عند الشيزري: لحم غنم صافٍ قليل الشحم يُفرم فرماً ناعماً على ألواح تقطيع نظيفة، ومذبّة تطرد الذباب أثناء الفرم، ولا يُخلط البصل ولا البهارات ولا التوابل إلا بحضور العارف ليضبط مقاديرها بالوزن، ثم الحشو في أمصار نظيفة، ثم القلي في زيت طريٍّ غير زنخ، وبعد القلي يُرشّ عليها البهار المطحون الصحيح المناسب. وقبل القلي يكشف المحتسب الغشّ بالنظر داخل النقانق — لحم الرؤوس المطبوخة أو الكبد والكلى والقلوب أو لحم الإبل والبقر العصبي — أما بعد أن تُشكّ على النار فيصعب، لأن الغشّ يخرج ويطهى."
    en: "The sausage-maker's craft runs on fixed steps in al-Shayzari: pure lean mutton minced finely on clean chopping-blocks, a fly-whisk working while the meat is minced, no onions, spices or seasonings mixed in except in the 'arif's presence so he can fix their weights, then stuffing into clean intestines, then frying in fresh oil that is not old or rancid, and a dusting of wholesome ground spices after frying. Before frying the muhtasib uncovers fraud by looking into the sausage — cooked head-meat, liver, kidneys and hearts, or tough camel and cow meat — but once they are skewered over the fire it is hard, for the adulterants come out and cook."
    ur: "الشیزری میں سوجقچی کی صنعت مقررہ مراحل پر چلتی ہے: خالص کم چکن خروفی گوشت صاف تختوں پر باریک کیما، کاتتے وقت مکھی بھگاؤ، پیاز و مصالحے صرف عارف کے سامنے وزن سے ملائے، پھر صاف آنتوں میں بھرنا، پھر تازہ نہ باسی نہ بگڑے تیل میں تلنا، اور تلے پر اچھے کُٹے مصالحے کی چھڑکائی۔ تلنے سے پہلے محتسب سوسج کے اندر جھانک کر دھوکہ پکڑتا — پکے سر کا گوشت، جگر گردے دل، یا اونٹ گائے کا تکڑا گوشت — مگر سیخ چڑھنے کے بعد مشکل، کہ ملا ہوا مال نکل کر پک جاتا۔"
