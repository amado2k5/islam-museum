summary:
  ar: "صانع النقانق هو من يفرم اللحم ويحشو به المصران ويقلي النقانق، وهو عند المحتسب من أكثر الصناع غشّاً. يقول ابن الأخوة إن الأحسن أن تكون مواضع صنعها قريبة من دكّة المحتسب لكثرة غشّها، وأن يُستعمل لحم الغنم النظيف السليم السمين فقط، وأن تُغيّر مقالي الطبخ بين حين وحين. ويفصّل الشيزري الصنعة: لحم صافٍ جيدٌ قليل الشحم يُفرم ناعماً على ألواح نظيفة ورجل بمذبّة يطرد الذباب، ولا تُخلط البصل والبهارات والتوابل إلا بحضور العارف ليعرف مقدارها بالوزن، ثم تُحشى في أمصار نظيفة؛ ثم يسرد غشّهم: لحم الرؤوس المطبوخة، والكبد والكلى والقلوب، واللحم العصبي الهزيل ولحم الإبل والبقر، ورشّ الماء على اللحم عند الفرم، وحشو السنبوسك بالسمك المشوي، والفول المنبّت المقشور والبصل؛ ويعرف المحتسب ذلك بالنظر داخل النقانق قبل قليها لأنها في المقلاة تُشكّ فيخرج الغشّ ويطهى على النار؛ والزيت الذي تُقلى فيه لا يكون عتيقاً زنخاً، وبعد القلي تُرشّ عليها البهارات الصحيحة المطحونة. وفي إسطنبول إوليا للسجقجية ثلاثون رجلاً في عشرة دكاكين يزيّنونها بالسجق المتبّل."
  en: "The sausage-maker minced meat, stuffed it into casings and fried the sausages — one of the most fraud-prone trades in the hisba books. Ibn al-Ukhuwwa says it is best that sausage-making places be near the muhtasib's booth, so many are their frauds; only clean, sound, fat mutton may be used, and the cooking-pans must be changed at intervals. Al-Shayzari gives the full craft: pure, good, lean meat minced finely on clean chopping-blocks, a man with a fly-whisk at the mincing, onions, spices and seasonings mixed in only in the 'arif's presence so he knows their weights, then stuffing into clean intestines. He lists their adulterations: the meat of cooked heads, liver, kidneys and hearts, tough scrawny meat or camel and cow meat mixed in, water sprinkled over the meat at mincing, sanbisak stuffed with grilled fish, shelled beansprouts and onion. The muhtasib learns the frauds by looking into the sausages before frying — once in the pan they are skewered and the adulterants come out and cook over the fire; the frying oil must be fresh and wholesome, and after frying wholesome ground spices are sprinkled over them. In Evliya's Istanbul the Sujukjian were thirty men in ten shops, adorning them with well-seasoned sausages."
  ur: "سوجقچی گوشت کیما کر کے آنتوں میں بھر کر سوسج تلتا تھا — حسبہ کی کتابوں میں سب سے زیادہ دھوکہ دینے والی صنعتوں میں سے۔ ابن الاخوہ کہتا ہے کہ سوسج بنانے کی جگہیں محتسب کی دکّہ کے قریب ہونی چاہییں کہ ان کے دھوکھے بہت ہیں؛ صرف صاف، صحت مند، چرب خروفی گوشت چلے اور پکانے کی کراہیاں وقفے وقفے سے بدلیں۔ الشیزری پوری صنعت لکھتا ہے: خالص اچھا کم چکن گوشت صاف تختوں پر باریک کیما، کاتتے وقت مکھی بھگانے والے کے ساتھ، پیاز، مصالحے اور بھونی چیزیں صرف عارف کی موجودگی میں وزن سے جانچ کر ملیں، پھر صاف آنتوں میں بھرا جائے۔ ان کے دھوکھے گنواتا ہے: پکے سر کا گوشت، جگر، گردے اور دل، تکڑا سکڑا گوشت یا اونٹ گائے کا گوشت ملانا، کیما کرتے پانی چھڑکنا، سنبوسک میں بُنا سمک بھرنا، چھلی انکڑی اور پیاز۔ محتسب تلنے سے پہلے سوسج کے اندر جھانک کر سب جان لیتا، کیونکہ کراہی میں ان پر سیخ چڑھا دی جاتی اور ملا ہوا مال نکل کر آگ پر پک جاتا؛ تلنے کا تیل نہ باسی نہ بگڑا ہو اور تلنے کے بعد اچھے کُٹے مصالحے چھڑکے جائیں۔ اولیاء کے استنبول میں سوجقچیان دس دکانوں پر تیس آدمی تھے جو دکانیں اچھی بُنی سوسجوں سے سجاتے تھے۔"
