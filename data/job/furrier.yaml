  techniques:
    ar: "يضبط ابن الأخوة بيع الفراء: ألا تُباع فراء الأغنام أو سواها إلا مدبوغة دبغاً حسناً ومخيّطة خياطةً ووصلاً صحيحين، ويمنع خلط القديم بالجديد وبيع المرقّع، ويمنع حمل البضاعة إلى البيوت ليُعطى منها الأقوياء دون الضعفاء، بل تُنقل إلى سوق الفرّائيين فتُباع جهراً. ويفصّل إوليا عرض الطائفة: دكاكين مزدانة بأنواع الفراء بمئات الألوف من القروش، وطائفة مستقلة لتجّار السمّور ⁦(صَمُّورجيان)⁩ ألف رجل كلّهم روم من سرفيه وفيورينا ولتشاستا وغوليكصري يجلبون الفراء من روسيا كل عام ويزيّنون دكاكينهم بالفراء وعظام السمك، وصنّاع قلانس السمّور ⁦(صمّور قلپقجيان)⁩ مئة وخمسة بثمانين دكاناً، وقلنصوة السمّور شعار بيت أمراء التتار من آل جنكيز."
    en: "Ibn al-Ukhuwwa polices the sale of furs: none of sheepskin or any other may be sold unless well tanned and properly stitched and seamed; old goods must not be mixed with new nor patched articles sold; goods must not be carried about the houses, where the strong would buy at the weak's expense, but brought to the furriers' suq and sold publicly. Evliya details the guild's display: shops adorned with furs of all kinds worth many hundred thousand piastres; a separate guild of sable-merchants (Samurjian), a thousand Greeks of Servia, Fiorina, Lachasta and Golikesri who bring fur from Russia every year and fit out their shops with furs and fish-bones; and the sable kalpak-makers (Samur Kalpakjian), a hundred and five men in eighty shops — the sable kalpak being the distinctive head-dress of the Tatar princes of the Jingiz family."
    ur: "ابن الاخوہ فر کی فروخت ضبط کرتا ہے: مینڈھی یا کوئی بھی کھال تب تک نہ بکے یہاں تک کہ اچھی دباغت اور درست سلائی و جوڑ والی ہو؛ پرانا مال نئے میں نہ ملے اور نہ پیوند والا بکے؛ مال گھروں میں نہ گھمایا جائے کہ طاقتور خرید لیں اور کمزور رہ جائے بلکہ فر فروشوں کے بازار میں کھلے عام بکے۔ اولیاء انجمن کی نمائش بتاتا ہے: لاکھوں قرش کی فر سے سجی دکانیں؛ سیبل فروشوں ⁦(صمّورجیان)⁩ کی الگ انجمن — ایک ہزار یونانی سرویا، فیورینا، لچاستہ اور گولیکسری کے جو ہر سال روس سے فر لاتے اور اپنی دکانیں فر اور مچھلی کی ہڈیوں سے سجاتے؛ اور سیبل کلپق ساز ⁦(صمّور کلپقجیان)⁩ ایک سو پانچ آدمی اسی دکانیں — سیبل کلپق چنگیزی خاندان کے تاتاری شہزادوں کا مخصوص سرتاج۔"
