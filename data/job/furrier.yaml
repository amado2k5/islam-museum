summary:
  ar: "الفرّاء صانع الفراء وثيابها، يدبغ الجلود ويخيطها ويبيعها في سوق الفرّائين. يضبط ابن الأخوة صنعته: ألا تُباع فراءٌ من جلود الضأن أو غيرها إلا حسنة الدبغ محكمة الخياطة والوصل، وألا يُخلط قديم بجديد ولا رُقعة بها، وألا تُحمَل البضاعة إلى الدور فتُباع لمن تقوى عليه دون الضعيف، بل تُخرج إلى سوق الفرّائين فتُباع جهراً. وفي موكب إسطنبول عدّ إوليا تجّار الفراء ⁦(كوركجيان)⁩ ألف رجل بخمسمئة دكان، بيرهم إدريس كبير الخيّاطين، وأول مبتدع للباس الفراء عندهم هُوشَنْك الذي لبس جلود الصيد ليتشبه بالوحوش؛ وتنازع الفرّاؤون والدبّاغون في التقدّم حتى قضى السلطان للفرّائيين لأن أعيان الدولة يلبسون الفراء؛ وكان فرّاؤو الروم في سوق محمود باشا موكباً مستقلاً يمشون في جلود الأسود والنمور والذئاب وقلانس السمّور، وبعضهم يُقاد بسلاسل على هيئة الوحوش والصيادين."
  en: "The farra' made furs and fur clothing, tanning, stitching and selling them in the furriers' suq. Ibn al-Ukhuwwa polices the craft: no furs of sheepskins or any other may be sold unless well tanned and properly stitched and seamed; no old goods may be mixed with new nor patched articles sold; goods must not be carried amongst the houses for sale but brought to the furriers' suq and sold publicly so that strong and weak may acquire them. In Evliya's Istanbul procession the fur-merchants (Kurkjian) were a thousand men with five hundred shops, their patron the same Idris as the tailors', the inventor of the fur-dress being Husheng who wore the hides of hunted beasts to roam the woods in animals' guise; the fur-makers contested rank with the tanners until the emperor decided for them because all the first men of the state dress in fur; and the Greek fur-makers of the Mahmud Pasha market marched as a separate procession in lions', leopards' and wolves' skins with sable kalpaks, some led in chains like wild men and hunting parties."
  ur: "فرّاء فر اور فر کے کپڑے بنانے، دباغت، سلائی اور فر فروشوں کے بازار میں فروخت کرنے والا ہے۔ ابن الاخوہ اس پیشے کو ضبط کرتا ہے: مینڈھی یا کسی اور کھال کی فر اس وقت تک نہ بکے یہاں تک کہ اچھی دباغت اور پکی سلائی والی ہو؛ پرانا مال نئے میں نہ ملایا جائے اور نہ پیوند والا بکے؛ مال گھروں میں گھما کر نہ بیچا جائے بلکہ فر فروشوں کے بازار میں لے جا کر کھلے عام بکے تاکہ کمزور اور زور آور دونوں خرید سکیں۔ اولیاء کے استنبول کے جلوس میں فر فروش ⁦(کورکجیان)⁩ ایک ہزار آدمی پانچ سو دکانیں تھے، ان کا پیر وہی ادریس ہے جو درزیوں کا؛ فر پہننے کا موجد ان کے نزدیک ہوشنگ ہے جو شکار کی کھالیں پہن کر جنگلوں میں درندوں سی صورت میں پھرتا تھا؛ فر سازوں اور دباغوں میں رتبے کی جھگڑا ایسے ہوا کہ بادشاہ نے فر سازوں کو ترجیح دی کہ دولت کے بڑے لوگ فر پہنتے ہیں؛ اور محمود پاشا بازار کے یونانی فر ساز الگ جلوس بناتے، شیر، چیتے اور بھیڑیوں کی کھالوں اور سیبل کی ٹوپیوں میں، کچھ زنجیروں میں جکڑے جنگلی آدمیوں اور شکار کے تماشے بنتے۔"
  es: "Los farra' fabricaban pieles y prendas de piel, curtiéndolas, cosiéndolas y vendiéndolas en el zoco de los peleteros. Ibn al-Ukhuwwa vigilaba el oficio: ninguna piel de oveja ni de ningún otro tipo podía venderse a menos que estuviera bien curtida y debidamente cosida y rematada; no se podían mezclar artículos viejos con nuevos ni vender artículos remendados; los artículos no debían transportarse entre las casas para su venta, sino que debían llevarse al zoco de los peleteros y venderse públicamente para que tanto fuertes como débiles pudieran adquirirlos. En la procesión de Estambul de Evliya, los comerciantes de pieles (Kurkjian) eran mil hombres con quinientas tiendas, su patrón era el mismo Idris que el de los sastres, el inventor del vestido de piel era Husheng, que vestía pieles de bestias cazadas para vagar por los bosques disfrazado de animales; los peleteros disputaban el rango con los curtidores hasta que el emperador decidió por ellos porque todos los primeros hombres del estado se vestían con pieles; y los peleteros griegos del mercado de Mahmud Pasha marcharon en una procesión aparte, ataviados con pieles de león, leopardo y lobo, y con kalpaks de marta cibelina; algunos iban encadenados como hombres salvajes y partidas de caza."
  fr: "Les fourreurs fabriquaient des fourrures et des vêtements de fourrure, les tannant, les cousant et les vendant au souk des fourreurs. Ibn al-Ukhuwwa réglementait cet artisanat: aucune fourrure, qu’elle soit de mouton ou autre, ne pouvait être vendue si elle n’était pas bien tannée, correctement cousue et assemblée; aucun article ancien ne pouvait être mélangé à du neuf, ni aucun article rapiécé vendu; les marchandises ne devaient pas être transportées de maison en maison pour être vendues, mais apportées au souk des fourreurs et vendues publiquement afin que riches et pauvres puissent s’en procurer. Lors du cortège d’Evliya à Istanbul, les marchands de fourrures (Kurkjian) étaient un millier d’hommes possédant cinq cents boutiques, sous le patronage du même Idris que celui des tailleurs. L’inventeur du vêtement de fourrure était Husheng, qui portait des peaux d’animaux chassés pour errer dans les bois sous l’apparence d’un animal. Les fourreurs se disputaient le rang avec les tanneurs jusqu’à ce que l’empereur tranche en leur faveur, car tous les hauts dignitaires de l’État s’habillaient de fourrure. et les fourreurs grecs du marché de Mahmud Pacha défilaient en procession séparée, vêtus de peaux de lions, de léopards et de loups, avec des kalpaks de zibeline, certains menés enchaînés comme des hommes sauvages et des groupes de chasse."
  tr: "Kürkçü, kürk ve kürk giysileri yapan, bunları tabaklayan, diken ve kürkçü pazarında satan kişidir. İbn el-Ukhuwwah, mesleğini şu şekilde düzenler: Sadece iyi tabaklanmış, iyi dikilmiş ve düzgün birleştirilmiş kürkler, ister koyun derisi olsun ister başka bir deri, satılmalıdır; eski kürkler yeni kürklerle karıştırılmamalı, yamalanmamalıdır; ve mallar zenginlere değil, yoksullara satılmak üzere evlere götürülmemeli, aksine kürkçü pazarına açıkça satılmak üzere getirilmelidir. İstanbul'da Evliya, kürk tüccarlarını (Kurkjian) bin kişi ve beş yüz dükkan olarak saymıştır. Pirham İdris baş terziydi ve aralarında kürk giymede ilk yenilikçi olan, vahşi hayvanlara benzemek için av derileri giyen Huşang'dı. Kürkçüler ve tabakçılar, kimin üstün olduğu konusunda çekişmeye girdiler, ta ki devlet ileri gelenleri kürk giydiği için sultan kürkçüler lehine hüküm verene kadar. Mahmud Paşa pazarındaki Romalı kürkçüler, aslan, kaplan, kurt derilerinden ve samur şapkalarından yapılmış giysiler içinde yürüyen bağımsız bir alay oluşturuyorlardı ve bazıları hayvan ve avcı biçiminde zincirlerle yönlendiriliyordu."
  id: "Pengrajin bulu, pembuat bulu dan pakaian bulu, menyamak, menjahit, dan menjualnya di pasar pengrajin bulu. Ibn al-Ukhuwwah mengatur kerajinannya: bahwa hanya bulu yang disamak dengan baik, dijahit dengan baik, dan disambung dengan benar, baik kulit domba atau lainnya, yang boleh dijual; bahwa bulu lama tidak boleh dicampur dengan bulu baru, juga tidak boleh ditambal; dan bahwa barang dagangan tidak boleh dibawa ke rumah-rumah untuk dijual kepada orang kaya daripada kepada orang miskin, tetapi lebih baik dibawa ke pasar pengrajin bulu untuk dijual secara terbuka. Dalam prosesi Istanbul, Evliya menghitung pedagang bulu (Kurkjian) sebanyak seribu orang dengan lima ratus toko. Pirham Idris adalah penjahit utama, dan inovator pertama dalam mengenakan bulu di antara mereka adalah Hushang, yang mengenakan kulit buruan untuk menyerupai binatang liar. Pengrajin bulu dan penyamak kulit berselisih tentang siapa yang memiliki kendali lebih besar sampai sultan memutuskan untuk memihak pengrajin bulu karena para pejabat negara mengenakan bulu. Para pedagang bulu Romawi di pasar Mahmud Pasha merupakan sebuah prosesi independen, berjalan mengenakan kulit singa, harimau, serigala, dan topi bulu cerpelai, dan beberapa di antara mereka dipimpin oleh rantai berbentuk binatang buas dan pemburu."
