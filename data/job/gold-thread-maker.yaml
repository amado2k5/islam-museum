summary:
  ar: "السرمكش هو ساحب الذهب خيطاً: يمُدّ الذهب عبر صفيحة السحب الحديدية حتى يصير سلكاً يُضفَر في السرمة والكلبدان. تروي الطائفة أن خالد بن نصر بن عبد الله — وأبوه نصر شيخ الصيّاغ — هو من اخترع سلك الذهب، وقد تقلّد الحزام على يد سلمان وهو مدفون بمكة. ويحكي إوليا عن معلم السلطان سليمان اليوناني قسطنطين، وهو صائغٌ ربّاه هو وسليم في طرابزون، أنه حين أغضبه الأمير غرّمه ألف عصاً — ثم أمره أن يسحب ذهبه في الصفيحة الحديدية ⁦(حدّلّي)⁩ حتى صار خمسمائة ذراعٍ سلكاً، فلفّها على قدمي سليمان مرتين في برّ قسَمه. وللمصنع ناظرٌ خامس من نواظر المدينة — آغا وكيا وكاتب وجاوش بدبلومات سلطانية — في معمل عظيم قرب باب برتنق عند أسفل طوقلي چشمه، وفيه أربعمائة رجل في صنوف العمل، يزيّنون دكاكينهم بالسرمة والكلبدان المصنوعة هيئة الشبكات، وتجّار السرمة والكلبدان مائة وخمسون في ثمانين دكاناً. وللدولة مخزنٌ أمين للسلك ⁦(أمانة سرمكش)⁩، وفي دار الضرب يقطع الكهله‌جي السلك قطعاً صغيرة للسكّ، ويحمل الرسل في رؤوسهم هالةً من سلك الذهب. وعند لين تُشَدّ أطراف غلاف الغليون الحريري بخيط الذهب المضفور بحرير ملوّن."
  en: "The sirmakesh drew gold into thread: the metal pulled through the steel draw-plate until it became wire, then twisted into sirma and kilabudan for embroidery. The guild tells that Khaled son of Nassr son of Abd-ullah — whose father Nassr is patron of the goldsmiths — invented gold-wire and was girded by Selman; he is buried at Mecca. Evliya recounts the famous story of Sultan Suleiman's master, the Greek goldsmith Constantine who brought him up together with Selim at Trebizond: angered by the prince, he fined him a thousand strokes — then ordered him to draw his gold through the steel plate (haddeli) into five hundred fathoms of wire and wrapped the five hundred gold-wires twice round Suleiman's feet to acquit himself of his oath. The fifth of the city's inspectors governs the gold-wire factory — agha, kyaya, clerk and chaushes all by imperial diploma — a great manufactory near the gate Partnak at the bottom of Tevekelli Cheshmeh, where four hundred men work at the different occupations of the fabric and adorn their shops with sirma and kilabudan made in the form of nets; the merchants of sirma and kilabudan are another hundred and fifty men in eighty shops. The state keeps a repository for gold-wire (Amanet sirmakesh); at the mint the Kehleji wire-drawers cut the wire into small pieces for the coinage; and the imperial couriers wear on the head a glory of gold-wire. In Lane's Cairo the silk covering of the long pipe-stick is confined at each extremity by gold thread intertwined with coloured silks."
  ur: "سرمہ کش سونے کو دھاگے تک کھینچنے والا ہے: دھات کوپھرنے والی فولادی تخت ⁦(حدلّی)⁩ سے گزار کر تار بناتا اور پھر سرمہ اور کلبدان میں بٹ کر کڑھائی کو دیتا۔ طائفہ کہتا کہ خالد بن نصر بن عبداللہ — جس کے باپ نصر زرگروں کے سرپرست ہیں — نے سنہری تار ایجاد کی اور سلمان نے اسے کمر باندھی؛ وہ مکہ میں مدفون ہے۔ اولیاء سلطان سلیمان کے استاد، یونانی زرگر قسطنطین — جس نے سلیمان اور سلیم کو طرابزون میں پالا — کا مشہور قصہ سناتا: شہزادے نے اسے ناراض کیا تو اس نے ہزار ڈنڈے کا جرم رکھا — پھر حکم دیا کہ اپنا سونا فولادی تخت سے کھینچ کر پانچ سو بام تار بنائے اور وہ پانچ سو سنہری تاریں سلیمان کے پاؤں پر دو بار لپیٹ کر اپنی قسم پوری کی۔ شہر کا پانچواں ناظر سنہری تار فیکٹری کا ہے — آغا، کیایا، کاتب اور چاوش سب سلطانی ڈپلومہ سے — بابِ برتنق کے قریب طوقلی چشمے کے نیچے ایک بڑا کارخانہ جہاں چار سو آدمی مختلف کاموں میں ہیں اور اپنی دکانیں جالوں کی صورت میں بُنے سرمہ اور کلبدان سے سجاتے ہیں؛ سرمہ و کلبدان کے تاجر ڈیڑھ سو آدمی اسی دکانوں میں ہیں۔ سلطنت کا سنہری تار کا امانت خانہ ⁦(أمانة سرمكش)⁩ ہے؛ ضرب خانے میں کہلہ‌جی تار کو چھوٹے ٹکڑے کاٹتے؛ شاہی قاصد سر پر سنہری تار کی ہالہ رکھتے۔ لین کے قاہرہ میں لمبی چلم کی لکڑی کے ریشمی غلاف کو دونوں سرے پر رنگین ریشم سے بٹی سنہری ڈوری سے باندھا جاتا۔"
  es: "El sirmakesh convertía el oro en hilo: el metal pasaba a través de la placa de acero hasta convertirse en alambre, que luego se retorcía para formar sirma y kilabudan para bordar. El gremio cuenta que Khaled, hijo de Nassr, hijo de Abd-ullah —cuyo padre, Nassr, era patrón de los orfebres— inventó el hilo de oro y fue ceñido por Selman; está enterrado en La Meca. Evliya relata la famosa historia del maestro del sultán Solimán, el orfebre griego Constantino, quien lo crió junto con Selim en Trebisonda: enfadado con el príncipe, le impuso una multa de mil golpes y luego le ordenó que pasara su oro a través de la placa de acero (haddeli) hasta formar quinientas brazas de alambre, y que envolviera los quinientos hilos de oro dos veces alrededor de los pies de Solimán para que este cumpliera su juramento. El quinto inspector de la ciudad dirige la fábrica de hilo de oro —agha, kyaya, escribano y chaushes, todos con diploma imperial— una gran manufactura cerca de la puerta Partnak, al pie de Tevekelli Cheshmeh, donde cuatrocientos hombres trabajan en las distintas tareas de la industria textil y adornan sus tiendas con sirma y kilabudan hechos en forma de redes; los comerciantes de sirma y kilabudan son otros ciento cincuenta hombres en ochenta tiendas. El estado mantiene un depósito de hilo de oro (Amanet sirmakesh); en la ceca, los trefiladores de Kehleji cortan el hilo en pequeños trozos para la acuñación de monedas; y los mensajeros imperiales llevan en la cabeza una gloriosa pieza de hilo de oro. En el Cairo de Lane, la cubierta de seda del largo bastón de pipa está sujeta en cada extremo por hilo de oro entrelazado con sedas de colores."
  fr: "Le sirmakesh transformait l'or en fil: le métal était tiré à travers une plaque d'acier jusqu'à devenir un fil, puis torsadé pour former le sirma et le kilabudan, utilisés pour la broderie. La guilde raconte que Khaled, fils de Nassr, lui-même fils d'Abd-ullah — dont le père, Nassr, était le protecteur des orfèvres — inventa le fil d'or et fut adoubé par Selman; il est enterré à La Mecque. Evliya relate la célèbre histoire du maître du sultan Soliman, l'orfèvre grec Constantin, qui l'éleva avec Selim à Trébizonde: irrité par le prince, il le condamna à une amende de mille coups de fouet, puis lui ordonna de tirer son or à travers une plaque d'acier (haddeli) jusqu'à obtenir cinq cents brasses de fil. Il enroula ensuite ces cinq cents fils d'or deux fois autour des pieds de Soliman pour s'acquitter de son serment. Le cinquième inspecteur de la ville dirige la manufacture de fil d'or – agha, kyaya, commis et chaushes, tous titulaires d'un diplôme impérial – une importante manufacture située près de la porte Partnak, au pied de Tevekelli Cheshmeh. Quatre cents hommes y travaillent aux différents corps de métier du tissu et ornent leurs boutiques de sirma et de kilabudan en forme de filets. Cent cinquante autres marchands de sirma et de kilabudan sont répartis dans quatre-vingts boutiques. L'État conserve un dépôt de fil d'or (Amanet sirmakesh). À l'atelier monétaire, les tréfileurs Kehleji découpent le fil en petits morceaux pour la frappe des pièces. Les courriers impériaux portent sur la tête une parure de fil d'or. Dans le Caire de Lane, le revêtement de soie de la longue canne à pipe est maintenu à chaque extrémité par un fil d'or entrelacé de soies colorées."
  tr: "\"Sarmakş\" kelimesi, altının iplik haline getirilmesi sürecini ifade eder: Altın, demir bir levhadan geçirilerek tel haline getirilir ve daha sonra \"sarmak\" ve \"kalbdan\" adı verilen ipliklere örülür. Rivayete göre, babası Nasr usta kuyumcu olan Halid ibn Nasr ibn Abdullah, altın teli icat etmiş ve Salman tarafından kendisine kemer hediye edilmiş ve Mekke'ye gömülmüştür. Evliya, Sultan Süleyman'ın Yunanlı öğretmeni ve Selim ile birlikte Trabzon'da yetiştirdikleri kuyumcu Konstantin'in, onu kızdırdığı için prens tarafından bin kırbaç cezasına çarptırıldığını anlatır. Ardından, yeminini yerine getirmek için altınını demir bir levhadan (haddali) geçirerek beş yüz arşın tel haline getirmesini ve bu teli Süleyman'ın ayaklarına iki kez sarmasını emretmiştir. Fabrikanın, şehrin gözetmenleri arasından seçilmiş beşinci bir gözetmeni vardı; Ağa, Kiya, Katib ve Ceviş'in hepsi imparatorluk diplomasına sahipti ve Tuklı Çeşme eteğindeki Burtanq Kapısı yakınlarındaki büyük bir atölyede çalışıyorlardı. Burada çeşitli mesleklerde çalışan dört yüz adam, dükkanlarını ağ şeklinde dokunmuş ipek ve brokar kumaşlarla süslüyorlardı. Seksen dükkanda yüz elli ipek ve brokar tüccarı yaşıyordu. Devletin tel için güvenli bir deposu (Sırmakş muhafızlığı) vardı ve darphanede, darphaneci telleri basım için küçük parçalara ayırıyordu. Haberciler başlarında altın telden haleler taşıyorlardı. Lin'de, ipek pipo kılıflarının uçları renkli ipeklerle örülmüş altın iplikle bağlanıyordu."
  id: "Kata \"sarmaksh\" merujuk pada proses menarik emas menjadi benang: emas ditarik melalui lempengan besi hingga menjadi kawat yang kemudian dikepang menjadi \"sarmak\" dan \"kalbdan.\" Tradisi menyatakan bahwa Khalid ibn Nasr ibn Abdullah—yang ayahnya, Nasr, adalah ahli pembuat perhiasan emas—menemukan kawat emas, dan bahwa ia diberi ikat pinggang itu oleh Salman dan dimakamkan di Mekah. Evliya menceritakan bahwa Konstantinus, guru Yunani Sultan Suleiman, seorang pembuat perhiasan emas yang ia dan Selim besarkan di Trabzon, didenda seribu cambukan oleh pangeran ketika ia membuatnya marah. Kemudian, ia memerintahkan Konstantinus untuk menarik emasnya melalui lempengan besi (haddali) hingga menjadi kawat sepanjang lima ratus hasta, yang kemudian ia lilitkan di kaki Suleiman dua kali untuk memenuhi sumpahnya. Pabrik itu memiliki pengawas kelima dari antara para pengawas kota—Agha, Kiya, Katib, dan Jawish, semuanya memiliki diploma kekaisaran—di sebuah bengkel besar dekat Gerbang Burtanq di kaki Tuqli Çeşme. Empat ratus orang bekerja di sana dalam berbagai bidang perdagangan, menghiasi toko mereka dengan sutra dan brokat yang ditenun dalam bentuk jaring. Seratus lima puluh pedagang sutra dan brokat tinggal di delapan puluh toko. Negara memiliki gudang yang aman untuk kawat (pengawasan Sirmaksh), dan di percetakan uang, pencetak uang memotong kawat menjadi potongan-potongan kecil untuk dicetak. Para utusan mengenakan lingkaran cahaya dari kawat emas di kepala mereka. Di Lin, ujung-ujung selongsong pipa sutra diikat dengan benang emas yang dikepang dengan sutra berwarna."
