  techniques:
    ar: "صنعة السرمكش هي سحب الذهب سلكاً وضفره خيوطاً. يُسحب الذهب في الصفيحة الحديدية ⁦(حدّلّي)⁩ حتى يصير سلكاً — وهي الحكاية التي ترويها الطائفة عن قسطنطين وسليمان — ثم يُصنع السلك سرمةً وكلبداناً في هيئة الشبكات تُزيَّن بها الدكاكين، ويُضفَر مع الحرير الملوّن في الكساوي والتطريز كما يصف لين غلاف الغليون. وللمصنع مخزنٌ أمين ⁦(أمانة سرمكش)⁩، وفي دار الضرب يشتغل الكهله‌جي — سمّيت كذلك لأنهم يقطعون السلك قطعاً صغيرة — مع النجّارين والصناع والسكّاكين والوزّانين. وشيخ الطائفة عندهم خالد بن نصر مخترعُ سلك الذهب، المتقلّد بيد سلمان، المدفون بمكة — كما تنقله الطائفة لا كما توثّقه الكتب."
    en: "The sirmakesh's craft is drawing gold into wire and plying it into thread. The gold is drawn through the steel plate (haddeli) until it becomes wire — the very feat in the guild's story of Constantine and Suleiman — then made into sirma and kilabudan in the form of nets to adorn the shops, and plied with coloured silks into coverings and embroidery as Lane describes on the pipe-stick. The factory has its own repository (Amanet sirmakesh); at the mint the Kehleji — so called because they cut the wire into small pieces — work beside the joiners, wire-makers, coiners and weighers. Their patron is Khaled son of Nassr, inventor of gold-wire, girded by Selman and buried at Mecca — as the guild tells it, not as the books attest."
    ur: "سرمہ کش کا ہنر سونے کو تار کھینچ کر دھاگہ بنانا ہے۔ سونے کو فولادی تخت ⁦(حدلّی)⁩ سے گزار کر تار بنایا جاتا — وہی کام جو قسطنطین اور سلیمان کے قصے میں ہے — پھر تار سے جال کی صورت میں سرمہ اور کلبدان بُنا جاتا، اور لین کے بیان کے مطابق رنگین ریشم سے بٹ کر غلاف اور کڑھائی بنائی جاتی۔ کارخانے کا اپنا امانت خانہ ⁦(أمانة سرمكش)⁩ ہے؛ ضرب خانے میں کہلہ‌جی — اس لیے کہ تار کو چھوٹے ٹکڑے کاٹتے — نجاروں، تار سازوں، سکہ سازوں اور تولنے والوں کے ساتھ کام کرتے۔ ان کا سرپرست خالد بن نصر ہے، سنہری تار کا موجد، جسے سلمان نے کمر باندھی اور جو مکہ میں مدفون ہے — جیسا کہ طائفہ کہتا ہے، نہ کہ کتابیں ثابت کرتی ہیں۔"
