places:
  - place: place/medina
    note: "In the Prophet's time cash from the public treasury was kept in his house and crops in an upper room of the mosque, according to the entry."
    sources: [source/tdv-hazinedar]
  - place: place/kufa
    note: "Abdullah ibn Masud held both the judgeship and the charge of the public treasury in Kufa under Umar, according to the entry."
    sources: [source/tdv-hazinedar]
  - place: place/baghdad
    note: "Under al-Mansur (754–775) a private treasury for the caliph was set up. Under the Buyids Adud al-Dawla paid his treasurer in advance and gave him clothing, and a treasurer was appointed to the Adudi hospital."
    sources: [source/tdv-hazinedar]
  - place: place/damascus
    note: "The deputy sultan of Damascus appointed four eunuch emirs to look after robes and gifts stored in the treasury, according to the entry."
    sources: [source/tdv-hazinedar]
  - place: place/cairo
    note: "Under the Mamluks the treasurer was one of the military offices of the sultan's household, with a chief (amir hazindar) and three divisions: robes, jewels and alms."
    sources: [source/tdv-hazinedar]
  - place: place/istanbul
    note: "In the Ottoman palace the chief treasurer (hazinedarbaşı) of the Enderun kept the inner treasury, the Bab-i Humayun and the robe stores."
    sources: [source/tdv-hazinedar]
