id: job/treasurer
class: job
label: { ar: "الخازن", en: "Treasurer (hazinedar)", ur: "خزانچی ⁦(ہزنیدار)⁩" }
summary:
  ar: "الخازن هو الموظف المكلّف بحفظ المال العام أو خزانة الحاكم وصرفه وقيده. ويرجع المنصب إلى صدر الإسلام، حين كان النبي والصحابة يحفظون بيت المال ويوزعونه. وتطور في الدولة العباسية إلى خزانة خاصة للخليفة، ثم صار في الدولة المملوكية وظيفة من وظائف الأمراء العسكريين، وفي الدولة العثمانية إلى رئاسة خزانة القصر في الإنديرون."
  en: "The treasurer was the official charged with keeping and paying out the public treasury or the ruler's private treasury, and with recording its goods. The office goes back to early Islam, when the Prophet and the Companions kept and distributed the public funds. Under the Abbasids a private treasury for the caliph was set up, and under the Mamluks the post became one of the military offices. In the Ottoman palace it became the chief treasurer of the Enderun."
  ur: "خزانچی وہ اہلکار تھا جو سرکاری خزانے یا حاکم کے ذاتی خزانے کی حفاظت، ادائیگی اور اندراج کا ذمہ دار تھا۔ یہ منصب صدرِ اسلام سے ملتا ہے، جب نبی کریم اور صحابہ سرکاری مال محفوظ رکھتے اور تقسیم کرتے تھے۔ عباسیوں کے دور میں خلیفہ کا ذاتی خزانہ قائم ہوا، مملوکوں کے ہاں یہ فوجی عہدوں میں شامل ہو گیا، اور عثمانی دربار کے اندرونی حصے ⁦(اندرون)⁩ میں یہ خزانہ داروں کے سربراہ کا منصب بن گیا۔"
