summary:
  ar: "العالم — جمعه علماء — صاحب العلم الشرعي المجيز من شيوخه، الذي يتولى التدريس والإفتاء والقضاء والخطابة بحسب درجته. ويصف لين القاهرة في ثلاثينيات القرن التاسع عشر: مجلس العلماء يشارك القاضي في المحاكمة، وطالب الأزهر إذا كمل نال إذن التدريس من شيخ المسجد وصار أستاذاً، ومنهم من صار قاضياً أو مفتياً أو إمام مسجد أو معلماً، ومنهم من بقي عمره في الأزهر يطمح إلى درجة كبار العلماء. ويذكر غيوم أن الطالب قبل الجامعات وبعدها كان يقطع ألف ميل أو أكثر طلباً لشيخ يجلس عند قدميه، وأن إجازة الأستاذ تشبه رخصة التدريس الوسيطة، وأن الأزهر يقسم طلابه في أروقة ويعيلهم بأوقاف المحسنين."
  en: "The alim — plural 'ulama — is the man formed in the religious sciences and licensed by his shaykhs, who then serves as teacher, mufti, judge or preacher according to his grade. Lane draws Cairo in the 1830s: a council of the 'ulama sat with the judge in the great trials; the Azhar student, when sufficiently advanced, took a licence to teach from the sheykh of the mosque and became a professor; some became kadis, muftis, imams or schoolmasters, some stayed all their lives in the Azhar aspiring to rank among the higher 'ulama. Guillaume records that before and after the universities a student would travel a thousand miles or more to sit at a chosen master's feet, that the Muslim professor's ijaza resembles the medieval licentia docendi, and that al-Azhar groups its students in communal riwaq quarters and supports them by pious benefactions."
  ur: "عالم — جمع علماء — دینی علوم میں تربیت یافتہ وہ شخص ہے جسے اس کے شیوخ اجازت دیں، پھر وہ اپنے درجے کے حساب سے تدریس، افتاء، قضاء یا وعظ سنبھالتا ہے۔ لین نے 1830ء کی دہائی کے قاہرہ کی تصویر کھینچی: بڑے مقدمات میں علماء کی مجلس قاضی کے ساتھ بیٹھتی؛ ازہر کا طالب پُرا ہونے پر شيخ المسجد سے تدریس کا اجازت نامہ لے کر استاد بنتا؛ کوئی قاضی، کوئی مفتی، کوئی امام یا مدرس بنتا، اور کوئی عمر بھر ازہر میں رہ کر بڑے علماء کا درجہ چاہتا۔ گیوم لکھتا ہے کہ جامعات سے پہلے اور بعد میں بھی طالب علم چنیدہ استاد کے قدموں میں بیٹھنے کو ہزار میل یا اس سے زیادہ کا سفر کرتا، کہ مسلم استاد کی اجازت قرونِ وسطی کے لائسنسیا ڈوچندی جیسی ہے، اور کہ ازہر اپنے طلبہ کو علاقائی رواقوں میں بانٹتا اور نیکوقات سے ان کا خرچ چلتا ہے۔"
  es: "El alim —plural: ulema— es el hombre formado en las ciencias religiosas y licenciado por sus shaykhs, que luego ejerce como maestro, muftí, juez o predicador según su rango. Lane describe El Cairo en la década de 1830: un consejo de ulemas se sentaba con el juez en los grandes juicios; el estudiante de Al-Azhar, cuando alcanzaba un nivel suficientemente avanzado, obtenía una licencia para enseñar del sheykh de la mezquita y se convertía en profesor; algunos llegaban a ser cadíes, muftíes, imanes o maestros de escuela, otros permanecían toda su vida en Al-Azhar aspirando a figurar entre los ulemas de mayor rango. Guillaume registra que, antes y después de la creación de las universidades, un estudiante viajaba mil millas o más para sentarse a los pies de un maestro elegido, que la ijaza del profesor musulmán se asemeja a la licentia docendi medieval, y que Al-Azhar agrupa a sus estudiantes en barrios comunitarios (riwaq) y los sustenta mediante donaciones piadosas."
  fr: "L'alim — pluriel oulama — est l'homme formé aux sciences religieuses et habilité par ses cheikhs, qui exerce ensuite les fonctions d'enseignant, de mufti, de juge ou de prédicateur selon son grade. Lane décrit le Caire des années 1830: un conseil d'oulémas siégeait avec le juge lors des grands procès; l'étudiant d'Al-Azhar, parvenu à un niveau suffisant, recevait une licence d'enseignement du cheikh de la mosquée et devenait professeur; certains devenaient cadis, muftis, imams ou maîtres d'école, d'autres restaient toute leur vie à Al-Azhar, aspirant à figurer parmi les oulémas les plus éminents. Guillaume rapporte qu'avant et après la création des universités, un étudiant pouvait parcourir mille kilomètres, voire plus, pour se consacrer à l'enseignement d'un maître choisi, que l'ijaza du professeur musulman s'apparente à la licentia docendi médiévale, et qu'Al-Azhar regroupe ses étudiants dans des quartiers communautaires (riwaq) et les soutient par des œuvres de bienfaisance."
  tr: "\"Âlim\" (çoğul: âlimler) terimi, dini bilgiye sahip ve hocalarından yetki almış, uzmanlık düzeyine göre ders verme, hukuki görüş bildirme, hakimlik yapma ve vaaz verme yetkisine sahip kişiyi ifade eder. Lane, 1830'lardaki Kahire'yi şöyle anlatıyor: \"Âlimler kurulu, hakimle birlikte davalara katılırdı. El-Azhar'daki eğitimini tamamlayan bir öğrenci, cami şeyhinden ders verme izni alır ve profesör olurdu. Bazıları hakim, müftü, imam veya öğretmen olurken, diğerleri El-Azhar'da ömür boyu kalıp kıdemli âlimler mertebesine ulaşmayı hedeflerdi.\" Guillaume, hem üniversiteden önce hem de sonra öğrencilerin, kendilerine danışacak bir âlim bulmak için bin mil veya daha fazla yol kat ettiklerini belirtiyor. Ayrıca, profesörün yetkisinin orta düzey bir öğretmenlik lisansına benzediğini ve El-Azhar'ın öğrencilerini bölümlere ayırıp hayırseverlerden gelen bağışlarla desteklediğini de ekliyor."
  id: "Istilah \"cendekiawan\" (jamak: para cendekiawan) merujuk kepada seseorang yang memiliki pengetahuan agama dan izin dari guru mereka, yang memenuhi syarat untuk mengajar, memberikan pendapat hukum, bertindak sebagai hakim, dan menyampaikan khutbah sesuai dengan tingkat keahlian mereka. Lane menggambarkan Kairo pada tahun 1830-an: \"Dewan cendekiawan berpartisipasi dengan hakim dalam persidangan. Setelah menyelesaikan studinya di Al-Azhar, seorang siswa akan menerima izin untuk mengajar dari syekh masjid dan menjadi profesor. Beberapa akan menjadi hakim, mufti, imam, atau guru, sementara yang lain akan tetap di Al-Azhar seumur hidup, bercita-cita untuk mencapai peringkat cendekiawan senior.\" Guillaume mencatat bahwa, baik sebelum maupun sesudah universitas, para siswa akan melakukan perjalanan seribu mil atau lebih untuk menemukan seorang syekh untuk duduk di kaki mereka. Ia juga menyebutkan bahwa izin seorang profesor mirip dengan lisensi mengajar tingkat menengah, dan bahwa Al-Azhar membagi siswanya menjadi beberapa bagian dan mendukung mereka dengan wakaf dari para dermawan."
