  techniques:
    ar: "يفصّل ابن الأخوة قواعد قفل الخشب: يُنصَب على صنّاعه من النجّارين رجل أمين خبير بالحرفة لأنها مهمّة، ففيها حفظ المال وصون الحريم؛ ويُمنعون من عمل مفتاح على مثال مفتاح آخر إلا إن كانا لشريكين معروفين بالأمانة؛ ولا يُثقَب رأس القطعة التي تثبت فيها الأسنان لئلا تُرمى، بل تُنقَر القطعة ويُحفَر للأسنان فيها موضع؛ وتكون أعالي الأسنان مربّعة وأسافلها مستديرة تُبرَد حتى تستوي أطرافها ملساء، وكذلك أسنان المفتاح لئلا تضرّ نتوءات القفل من فوق أو من تحت؛ وتُخالَف صور الأقفال بعضها عن بعض. ويصف لين قفل «الدبّة» الخشبي على أبواب القاهرة: مسامير حديد صغيرة تهبط في ثقوب المزلاج المتحرّك ما إن يُدفَع في حلقة الباب، وعلى المفتاح مسامير تدخل تلك الثقوب فترفع المسامير فينسحب المزلاج؛ طول قفل باب الدار نحو أربع عشرة بوصة وأقفال الحجرات والدواليب سبع أو ثمان أو تسع، وأقفال أبواب الحارات والمباني العامة من هذا الضرب."
    en: "Ibn al-Ukhuwwa details the rules of the wooden lock: the carpenters who make locks have an honest man experienced in their craft set over them, for it is an important one — in it lies the security of wealth and protection for the household; they must not make a key after the pattern of another's unless both are for partners known for their honour; the head of the piece in which the movable teeth are fixed must not be pierced lest the teeth be thrown out, but the piece morticed and a place hollowed for the teeth; the upper ends of the teeth squared, the other ends round, filed smooth and flat at the tip — and likewise the teeth of the key — so that the projecting parts of the lock are not harmed from above or below; and the locks themselves must be differentiated in pattern from one another. Lane describes the wooden dabbeh of the Cairo door: a number of small iron pins drop into corresponding holes in the sliding bolt as soon as it is pushed into the staple of the door-post, and the key carries pins that enter those holes and push the pins up so the bolt can be drawn back; the street-door lock is commonly about fourteen inches long, those of rooms and cupboards seven, eight or nine, and the locks of quarter-gates and public buildings are of the same kind."
    ur: "ابن الاخوہ لکڑی کے قفل کے اصول تفصیل سے بتاتا ہے: قفل بنانے والے بڑھئیوں پر ایماندار اور ہنر شناس نگران ہو کہ یہ اہم پیشہ ہے — اسی میں مال کی حفاظت اور گھر کی عصمت ہے؛ دوسرے کے نقشے پر چابی بنانا ممنوع سوائے معروف بہ امانت شراکت داروں کے؛ جس ٹکڑے میں متحرک دندانے بیٹھتے ہیں اس کا سرا سوراخ نہ ہو کہ دندانے باہر نہ گریں، بلکہ ٹکڑا کھود کر ان کے لیے جگہ نکالی جائے؛ دندانوں کے اوپری سرے چوکور، نیچے والے گول اور نوک مبرد سے ہموار؛ اسی طرح چابی کے دندانے بھی تاکہ قفل کے ابھرے حصے اوپر یا نیچے سے ضرر نہ پہنچائیں؛ اور قفلوں کے نقشے آپس میں مختلف رکھے جائیں۔ لین قاہرہ کے دروازے کے لکڑی کے «دبّہ» قفل کو بیان کرتا ہے: چھوٹے لوہے کے کیل دروازے کی چوکھٹ کی کُنڈی میں سلائیڈنگ بولٹ کے سوراخوں میں گر جاتے ہیں، اور چابی کی کِیلیاں ان سوراخوں میں گھس کر کیلوں کو اوپر دھکیلتی ہیں تب بولٹ کھِمچتا ہے؛ محلے کے دروازے کا قفل عام طور پر چودہ انچ، کوٹھڑیوں اور الماریوں کے سات، آٹھ یا نو انچ؛ اور حاروں اور عمومی عمارتوں کے دروازوں کے قفل بھی اسی قسم کے۔"
