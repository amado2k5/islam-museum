summary:
  ar: "القفّال صانع الأقفال ومفاتيحها، وصناعته أمانة لأن فيها حفظ الأموال وصون الحُرَم. يضبط ابن الأخوة النجّارين الذين يعملون الأقفال: أن يُقام عليهم رجل أمين خبير بصنعتهم، وأن يُمنعوا من عمل مفتاح على مثال مفتاح غيرهم إلا لشريكين معروفين بالأمانة، وألا يُثقَب رأس القطعة التي تثبت فيها الأسنان بل تُنقَر ويُجعَل للأسنان فيها مكان، وأن تكون أعالي الأسنان مربّعة وأطرافها مستديرة مبردة ملساء، وأن تُخالَف صور الأقفال بعضها عن بعض. وفي إسطنبول عدّ إوليا صنّاع الأقفال ألف رجل بخمسمئة دكان بيرهم داود وعزيز الدين صمالي الذي قلّده سلمان الفارسي وقبره بشيراز، يزيّنون دكاكينهم بالأقفال والمفاتيح والحلق والصغائر من عمل الحديد بعضها مذهّب وبعضها مقلّى، وبجوارهم صنّاع القفل الصغير ⁦(كليدجيان)⁩ مئتان بمئة دكان بيرهم زيد الهندي؛ وادّعى البياطرة التقدّم عليهم لكونهم ألزم الطوائف في الحرب فقُضي بجعلهم تبعاً لهم."
  en: "The qaffal made locks and their keys, and his craft is a trust, for in it lies the security of wealth and the protection of the household. Ibn al-Ukhuwwa regulates the carpenters who make locks: an honest man experienced in their craft is set over them; they are forbidden to make a key after the pattern of another's unless both keys are for partners known for their honour; the head of the piece holding the movable teeth must be morticed, not pierced, with a place hollowed for the teeth; the teeth squared at their upper ends, rounded and filed smooth at the tips; and the locks themselves differentiated in pattern from one another. In Evliya's Istanbul the locksmiths were a thousand men in five hundred shops under the patrons David and Aziz-ud-din Samahi, who was girded by Selman Pak and lies at Shiraz; they adorned their shops with locks, keys, rings and small ironwork, some gilt, some tinned. Beside them marched the locket-smiths (Kilidjian), two hundred men in a hundred shops, whose patron was Zeid the Indian; the farriers claimed precedence over the locksmiths as a guild indispensable in wartime, but were ranked as their assistants."
  ur: "قفل ساز قفل اور چابیاں بنانے والا ہے، اور یہ ہنر امانت ہے کہ اسی میں مال اور گھر کی حفاظت ہے۔ ابن الاخوہ قفل بنانے والے بڑھئیوں پر شرط لگاتا ہے: ان پر ایماندار اور ہنر شناس نگران مقرر ہو؛ کسی اور کی چابی کی نقشے پر چابی بنانا ممنوع سوائے شراکت دار معروف بہ امانت کے؛ جس ٹکڑے میں متحرک دندانے بیٹھتے ہیں اس کا سرا سوراخ نہ ہو بلکہ کھود کر دندانوں کی جگہ بنائی جائے؛ دندانوں کے اوپری سرے چوکور اور نوکیاں گول، مبرد سے صاف اور چمکیلی؛ اور قفلوں کے نقشے ایک دوسرے سے مختلف رکھے جائیں۔ اولیاء کے استنبول میں قفل ساز ایک ہزار آدمی پانچ سو دکانیں، ان کے پیر داؤد اور عزیز الدین صمالی ہیں جسے سلمان پاک نے کمر بند پہنائی اور شیراز میں مدفون ہے؛ وہ اپنی دکانیں قفلوں، چابیوں، حلقوں اور لوہے کے چھوٹے سامان سے سجاتے، کچھ زر بفت کچھ قلعی نشان؛ ساتھ لاکیٹ ساز ⁦(کلیدجیان)⁩ دو سو آدمی سو دکانیں جن کا پیر زید ہندی ہے؛ نعلبندوں نے قفل سازوں پر رتبے کا دعویٰ کیا کہ جنگ کے وقت وہ ناگزیر انجمن ہیں، مگر انہیں ان ہی کا تابع ٹھہرایا گیا۔"
  es: "El qaffal fabricaba cerraduras y sus llaves, y su oficio era un cargo de confianza, pues en él residía la seguridad de la riqueza y la protección del hogar. Ibn al-Ukhuwwa regulaba a los carpinteros que fabricaban cerraduras: un hombre honesto y experimentado en su oficio los supervisaba; tenían prohibido hacer una llave según el modelo de otro, a menos que ambas llaves fueran para socios conocidos por su honor; la cabeza de la pieza que sostiene los dientes móviles debía estar encajada, no perforada, con un hueco para los dientes; los dientes debían ser cuadrados en sus extremos superiores, redondeados y limados en las puntas; y las cerraduras mismas debían tener diseños diferentes entre sí. En el Estambul de Evliya, los cerrajeros eran mil hombres en quinientas tiendas bajo la tutela de los patrones David y Aziz-ud-din Samahi, quien fue ceñido por Selman Pak y yace en Shiraz; adornaban sus tiendas con cerraduras, llaves, anillos y pequeños objetos de hierro, algunos dorados, otros estañados. Junto a ellos marchaban los herreros de medallones (Kilidjian), doscientos hombres en cien talleres, cuyo patrón era Zeid el Indio; los herreros reclamaban precedencia sobre los cerrajeros como un gremio indispensable en tiempos de guerra, pero estaban clasificados como sus ayudantes."
  fr: "Le qaffal fabriquait des serrures et leurs clés, et son métier était une responsabilité précieuse, car il garantissait la sécurité des biens et la protection du foyer. Ibn al-Ukhuwwa réglementait le métier de serrurier: un homme honnête et expérimenté était placé à leur tête; il leur était interdit de reproduire une clé sur le modèle d'un autre, sauf si les deux clés étaient destinées à des associés reconnus pour leur honneur; la tête de la serrure devait être mortaisée, et non percée, avec un logement pour les dents; les dents étaient carrées à leur extrémité supérieure, arrondies et limées à leurs extrémités; et chaque serrure était unique. À Istanbul, sous le règne d'Evliya, on comptait mille serruriers répartis dans cinq cents boutiques, sous la protection de David et d'Aziz-ud-din Samahi, protégé par Selman Pak et résidant à Shiraz; leurs boutiques étaient ornées de serrures, de clés, d'anneaux et de petits objets en fer, certains dorés, d'autres étamés. À leurs côtés marchaient les artisans serruriers (Kilidjian), deux cents hommes dans une centaine d'ateliers, dont le patron était Zeid l'Indien; les maréchaux-ferrants revendiquaient la préséance sur les serruriers en tant que guilde indispensable en temps de guerre, mais étaient considérés comme leurs assistants."
  tr: "Çilingir, kilit ve anahtarların yapımcısıdır ve mesleği, serveti korumayı ve kutsal olanı muhafaza etmeyi içerdiği için güvenilir bir meslektir. İbn el-Ukhuwwah, kilit yapan marangozları şu şekilde düzenler: Başlarına güvenilir, mesleğinde uzman bir kişi atanmalı, güvenilirlikleriyle bilinen iki ortak dışında başkasının anahtarına dayanarak anahtar yapmaları engellenmeli, dişlerin takıldığı parçanın başı delinmemeli, bunun yerine oyulmalı ve dişler için yer açılmalı, dişlerin üst kısımları kare olmalı ve kenarları yuvarlak, törpülenmiş ve pürüzsüz olmalı ve kilitlerin tasarımları birbirinden farklı olmalıdır. İstanbul'da Evliya, Pirham Davud ve Aziz el-Din Samali'nin (Salman el-Farsi'nin taklit ettiği ve mezarı Şiraz'da bulunan) dükkanları da dahil olmak üzere bin çilingir ve beş yüz dükkan saymıştır. Dükkanlarını kilitler, anahtarlar, halkalar ve küçük demir işleriyle süslerler; bazıları yaldızlı, bazıları da fırınlanmış. Onların yanında, Pirham Zayd al-Hindi de dahil olmak üzere, yüz dükkân sahibi iki yüz küçük kilitçi (Kildjian) bulunmaktadır. Veterinerler, savaşta en çok yükümlülük altında olan mezhepler oldukları için onlardan üstün olduklarını iddia ettiler ve bu nedenle onların kendilerine bağlı hale getirilmesine karar verildi."
  id: "Tukang kunci adalah pembuat gembok dan anak kuncinya, dan keahliannya adalah keahlian yang dapat dipercaya karena melibatkan pelestarian kekayaan dan perlindungan terhadap hal-hal yang sakral. Ibn al-Ukhuwwah mengatur para tukang kayu yang membuat gembok: bahwa seorang pria yang dapat dipercaya, seorang ahli dalam keahlian mereka, harus ditunjuk sebagai pengawas mereka, bahwa mereka dilarang membuat anak kunci berdasarkan anak kunci orang lain kecuali untuk dua mitra yang dikenal dapat dipercaya, bahwa kepala bagian tempat gigi dipasang tidak boleh dilubangi tetapi dilubangi dan dibuat tempat untuk gigi, bahwa bagian atas gigi harus berbentuk persegi dan tepinya dibulatkan, diasah, dan dihaluskan, dan bahwa desain gembok berbeda satu sama lain. Di Istanbul, Evliya mencatat seribu tukang kunci dengan lima ratus toko, termasuk toko Pirham Dawud dan Aziz al-Din Samali, yang ditiru oleh Salman al-Farsi dan makamnya berada di Shiraz. Mereka menghiasi toko mereka dengan gembok, anak kunci, cincin, dan barang-barang besi kecil, beberapa dilapisi emas dan beberapa ditempa. Di sebelah mereka ada para pembuat kunci kecil (Kildjian), dua ratus orang dengan seratus toko, termasuk Pirham Zayd al-Hindi. Para dokter hewan mengklaim superioritas atas mereka karena mereka adalah sekte yang paling berkewajiban dalam perang, sehingga diputuskan bahwa mereka harus tunduk kepada mereka."
