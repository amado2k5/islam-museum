summary:
  ar: "القفّال صانع الأقفال ومفاتيحها، وصناعته أمانة لأن فيها حفظ الأموال وصون الحُرَم. يضبط ابن الأخوة النجّارين الذين يعملون الأقفال: أن يُقام عليهم رجل أمين خبير بصنعتهم، وأن يُمنعوا من عمل مفتاح على مثال مفتاح غيرهم إلا لشريكين معروفين بالأمانة، وألا يُثقَب رأس القطعة التي تثبت فيها الأسنان بل تُنقَر ويُجعَل للأسنان فيها مكان، وأن تكون أعالي الأسنان مربّعة وأطرافها مستديرة مبردة ملساء، وأن تُخالَف صور الأقفال بعضها عن بعض. وفي إسطنبول عدّ إوليا صنّاع الأقفال ألف رجل بخمسمئة دكان بيرهم داود وعزيز الدين صمالي الذي قلّده سلمان الفارسي وقبره بشيراز، يزيّنون دكاكينهم بالأقفال والمفاتيح والحلق والصغائر من عمل الحديد بعضها مذهّب وبعضها مقلّى، وبجوارهم صنّاع القفل الصغير ⁦(كليدجيان)⁩ مئتان بمئة دكان بيرهم زيد الهندي؛ وادّعى البياطرة التقدّم عليهم لكونهم ألزم الطوائف في الحرب فقُضي بجعلهم تبعاً لهم."
  en: "The qaffal made locks and their keys, and his craft is a trust, for in it lies the security of wealth and the protection of the household. Ibn al-Ukhuwwa regulates the carpenters who make locks: an honest man experienced in their craft is set over them; they are forbidden to make a key after the pattern of another's unless both keys are for partners known for their honour; the head of the piece holding the movable teeth must be morticed, not pierced, with a place hollowed for the teeth; the teeth squared at their upper ends, rounded and filed smooth at the tips; and the locks themselves differentiated in pattern from one another. In Evliya's Istanbul the locksmiths were a thousand men in five hundred shops under the patrons David and Aziz-ud-din Samahi, who was girded by Selman Pak and lies at Shiraz; they adorned their shops with locks, keys, rings and small ironwork, some gilt, some tinned. Beside them marched the locket-smiths (Kilidjian), two hundred men in a hundred shops, whose patron was Zeid the Indian; the farriers claimed precedence over the locksmiths as a guild indispensable in wartime, but were ranked as their assistants."
  ur: "قفل ساز قفل اور چابیاں بنانے والا ہے، اور یہ ہنر امانت ہے کہ اسی میں مال اور گھر کی حفاظت ہے۔ ابن الاخوہ قفل بنانے والے بڑھئیوں پر شرط لگاتا ہے: ان پر ایماندار اور ہنر شناس نگران مقرر ہو؛ کسی اور کی چابی کی نقشے پر چابی بنانا ممنوع سوائے شراکت دار معروف بہ امانت کے؛ جس ٹکڑے میں متحرک دندانے بیٹھتے ہیں اس کا سرا سوراخ نہ ہو بلکہ کھود کر دندانوں کی جگہ بنائی جائے؛ دندانوں کے اوپری سرے چوکور اور نوکیاں گول، مبرد سے صاف اور چمکیلی؛ اور قفلوں کے نقشے ایک دوسرے سے مختلف رکھے جائیں۔ اولیاء کے استنبول میں قفل ساز ایک ہزار آدمی پانچ سو دکانیں، ان کے پیر داؤد اور عزیز الدین صمالی ہیں جسے سلمان پاک نے کمر بند پہنائی اور شیراز میں مدفون ہے؛ وہ اپنی دکانیں قفلوں، چابیوں، حلقوں اور لوہے کے چھوٹے سامان سے سجاتے، کچھ زر بفت کچھ قلعی نشان؛ ساتھ لاکیٹ ساز ⁦(کلیدجیان)⁩ دو سو آدمی سو دکانیں جن کا پیر زید ہندی ہے؛ نعلبندوں نے قفل سازوں پر رتبے کا دعویٰ کیا کہ جنگ کے وقت وہ ناگزیر انجمن ہیں، مگر انہیں ان ہی کا تابع ٹھہرایا گیا۔"
