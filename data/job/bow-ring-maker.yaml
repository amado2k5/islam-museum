summary:
  ar: "صانع الزِّهغير يصوغ خاتم الإبهام الذي يُمسَك به وتر القوس عند الرمي. في موكب إسطنبول عدّ إوليا صنّاع الزهغير ⁦(زهغيرجيان)⁩، بيرهم أبو طابر سلفل بن سعد وقّاص الذي منَّه سلمان الفارسي بالحزام فافترسه أسد قرب الحلّة؛ وهم يزيّنون دكاكينهم بهذه الخواتم التي تُلبَس في الإبهام لثني السهام وإمساك الوتَر، مصنوعة من كل أنواع القرون وعظام السمك. ويوضح إلغود أن الرامي بالطريقة الشرقية يجذب الوتَر بإبهامه لا بأصابعه، فالخاتم يحميه من احتكاك الوتر؛ وأن كثيراً من الخواتم المزخرفة الباقية لم تكن للرمي العملي بل كان يلبسها ذوو القدر ليُعلِنوا أنهم رماة، إذ كان الاتقان في سلاح الرماية علامة مكانة؛ حتى إن أبناء سلاطين العثمانيين تَصْنَعوا عند صنّاع القسي، وروي أن السلطان محمد الثاني كان ماهراً في صنع خواتم الإبهام فكان يصوغ الخاتم بنفسه ويُهديه لمن أراد تكريمه."
  en: "The zehgirci made the archer's thumb-ring that grips the bowstring at the draw. In Evliya's Istanbul procession the bow-ring-makers (Zehgirjian) display these rings, worn on the thumb to bend the arrows and hold the string, made of all kinds of horn and fish-bone; their patron Abu Taber Selfal, son of Sa'd Wakkas, was girded by Selman Pak and torn by a lion near Helleh. Elgood explains the craft's purpose: in the eastern draw the archer pulls the string with the thumb, not the fingers, so the ring protects it from the string's chafe; and that many surviving ornamental thumb-rings, unsuited to real shooting, were worn by men of substance to show that they were archers, so esteemed were the crafts that supplied the bow. Sons of Ottoman sultans were apprenticed to bowyers in their youth, and Sultan Mehmet II (1595-1603), himself skilled in making thumb-rings, would fashion a ring with his own hands and present it to the man he wished especially to honour."
  ur: "زہگیرجی کماندار کی وہ انگوٹھی بناتا جس سے رمّانی کے وقت ڈور پکڑی جاتی۔ اولیاء کے استنبول کے جلوس میں انگٹھا ساز ⁦(زہگیرجیان)⁩ اپنی دکانیں انہی انگوٹھیوں سے سجاتے جو انگوٹھے پر پہن کر تیر چڑھانے اور ڈور سنبھالنے کے کام آتی ہیں اور ہر قسم کی سینگ اور مچھلی کی ہڈی سے بنتی ہیں؛ ان کا پیر ابو طابر سلفل بن سعد وقاص ہے جسے سلمان پاک نے کمر بند پہنایا اور ہلہ کے قریب شیر نے پھاڑ ڈالا۔ ایلگڈ ہنر کا مقصد بتاتا ہے: مشرقی ڈراء میں کماندار انگلیوں کی جگہ انگوٹھے سے ڈور کھینچتا، اس لیے انگوٹھی اسے ڈور کی رگڑ سے بچاتی؛ اور جو مزین انگوٹھیاں بچی ہیں وہ عملی رمائی کے لیے نہیں بلکہ صاحب حیثیت لوگ یہ دکھانے کو پہنتے کہ وہ کماندار ہیں، اتنا معزز تھا کماندار کو ساز دینے والا ہنر۔ عثمانی شہزادے کم عمری میں کمان سازوں کے پاس شاگرد رہے، اور سلطان محمد ثانی ⁦(1595ء-1603ء)⁩ خود انگوٹھی بنانے کا ماہر تھا، وہ اپنے ہاتھ سے انگوٹھی بنا کر اس شخص کو پیش کرتا جسے خاص اعزاز دینا چاہتا۔"
