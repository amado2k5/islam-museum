  techniques:
    ar: "الصنعة صياغة خاتم الإبهام من القرن وعظم السمك وأشباهها: يُقطَع ويُبرد ويُصقَل حتى يجلس في الإبهام ويمسك الوتَر عند جذبه بالطريقة الشرقية التي يُرمى فيها بالإبهام لا بالأصابع. ويصنع الحرفي ضربين: خاتم الرمي الخشن الذي يحتمي به من احتكاك الوتر، والخاتم المزخرف الذي يلبسه ذوو القدر شارة على الرماية. ويروي إلغود أن السلطان محمد الثاني صاغ الخواتم بيده هدايا تكريم."
    en: "The craft is the fashioning of the thumb-ring from horn, fish-bone and the like: cut, filed and polished until it sits on the thumb and hooks the string in the eastern draw, where the string is pulled by the thumb and not the fingers. The maker produced two kinds: the plain working ring that shields against the string's chafe, and the ornamented ring worn by men of rank as the badge of an archer. Elgood records that Sultan Mehmet II fashioned rings with his own hands as gifts of honour."
    ur: "ہنر سینگ، مچھلی کی ہڈی وغیرہ سے انگوٹھے کی انگوٹھی تراشنا ہے: کاٹ، رگڑ اور پالش کر کے ایسی بنانا جو انگوٹھے پر بیٹھے اور مشرقی ڈراء میں ڈور پکڑے جہاں ڈور انگوٹھے سے کھینچی جاتی۔ دستکار دو قسم بناتا: سادہ کام کی انگوٹھی جو ڈور کی رگڑ سے بچائے، اور مزین انگوٹھی جو صاحب حیثیت کمانداری کی نشانی کے طور پر پہنتے۔ ایلگڈ روایت رکھتا ہے کہ سلطان محمد ثانی اپنے ہاتھ سے انگوٹھیاں بنا کر اعزاز میں دیتا۔"
