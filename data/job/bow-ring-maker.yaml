summary:
  ar: "صانع الزِّهغير يصوغ خاتم الإبهام الذي يُمسَك به وتر القوس عند الرمي. في موكب إسطنبول عدّ إوليا صنّاع الزهغير ⁦(زهغيرجيان)⁩، بيرهم أبو طابر سلفل بن سعد وقّاص الذي منَّه سلمان الفارسي بالحزام فافترسه أسد قرب الحلّة؛ وهم يزيّنون دكاكينهم بهذه الخواتم التي تُلبَس في الإبهام لثني السهام وإمساك الوتَر، مصنوعة من كل أنواع القرون وعظام السمك. ويوضح إلغود أن الرامي بالطريقة الشرقية يجذب الوتَر بإبهامه لا بأصابعه، فالخاتم يحميه من احتكاك الوتر؛ وأن كثيراً من الخواتم المزخرفة الباقية لم تكن للرمي العملي بل كان يلبسها ذوو القدر ليُعلِنوا أنهم رماة، إذ كان الاتقان في سلاح الرماية علامة مكانة؛ حتى إن أبناء سلاطين العثمانيين تَصْنَعوا عند صنّاع القسي، وروي أن السلطان محمد الثاني كان ماهراً في صنع خواتم الإبهام فكان يصوغ الخاتم بنفسه ويُهديه لمن أراد تكريمه."
  en: "The zehgirci made the archer's thumb-ring that grips the bowstring at the draw. In Evliya's Istanbul procession the bow-ring-makers (Zehgirjian) display these rings, worn on the thumb to bend the arrows and hold the string, made of all kinds of horn and fish-bone; their patron Abu Taber Selfal, son of Sa'd Wakkas, was girded by Selman Pak and torn by a lion near Helleh. Elgood explains the craft's purpose: in the eastern draw the archer pulls the string with the thumb, not the fingers, so the ring protects it from the string's chafe; and that many surviving ornamental thumb-rings, unsuited to real shooting, were worn by men of substance to show that they were archers, so esteemed were the crafts that supplied the bow. Sons of Ottoman sultans were apprenticed to bowyers in their youth, and Sultan Mehmet II (1595-1603), himself skilled in making thumb-rings, would fashion a ring with his own hands and present it to the man he wished especially to honour."
  ur: "زہگیرجی کماندار کی وہ انگوٹھی بناتا جس سے رمّانی کے وقت ڈور پکڑی جاتی۔ اولیاء کے استنبول کے جلوس میں انگٹھا ساز ⁦(زہگیرجیان)⁩ اپنی دکانیں انہی انگوٹھیوں سے سجاتے جو انگوٹھے پر پہن کر تیر چڑھانے اور ڈور سنبھالنے کے کام آتی ہیں اور ہر قسم کی سینگ اور مچھلی کی ہڈی سے بنتی ہیں؛ ان کا پیر ابو طابر سلفل بن سعد وقاص ہے جسے سلمان پاک نے کمر بند پہنایا اور ہلہ کے قریب شیر نے پھاڑ ڈالا۔ ایلگڈ ہنر کا مقصد بتاتا ہے: مشرقی ڈراء میں کماندار انگلیوں کی جگہ انگوٹھے سے ڈور کھینچتا، اس لیے انگوٹھی اسے ڈور کی رگڑ سے بچاتی؛ اور جو مزین انگوٹھیاں بچی ہیں وہ عملی رمائی کے لیے نہیں بلکہ صاحب حیثیت لوگ یہ دکھانے کو پہنتے کہ وہ کماندار ہیں، اتنا معزز تھا کماندار کو ساز دینے والا ہنر۔ عثمانی شہزادے کم عمری میں کمان سازوں کے پاس شاگرد رہے، اور سلطان محمد ثانی ⁦(1595ء-1603ء)⁩ خود انگوٹھی بنانے کا ماہر تھا، وہ اپنے ہاتھ سے انگوٹھی بنا کر اس شخص کو پیش کرتا جسے خاص اعزاز دینا چاہتا۔"
  es: "Los zehgirci fabricaban el anillo para el pulgar del arquero que sujeta la cuerda del arco al tensarlo. En la procesión de Evliya en Estambul, los fabricantes de anillos para arcos (Zehgirjian) exhiben estos anillos, que se usan en el pulgar para doblar las flechas y sujetar la cuerda, hechos de todo tipo de cuerno y espina de pescado; su patrón, Abu Taber Selfal, hijo de Sa'd Wakkas, fue ceñido por Selman Pak y atacado por un león cerca de Helleh. Elgood explica el propósito de la artesanía: en el tensado oriental, el arquero tira de la cuerda con el pulgar, no con los dedos, por lo que el anillo lo protege del roce de la cuerda; y que muchos anillos ornamentales para el pulgar que aún se conservan, inadecuados para el tiro real, eran usados por hombres de posición social para demostrar que eran arqueros, tal era el prestigio de la artesanía que suministraba el arco. Los hijos de los sultanes otomanos eran aprendices de arqueros en su juventud, y el sultán Mehmet II (1595-1603), hábil en la fabricación de anillos para el pulgar, creaba un anillo con sus propias manos y se lo regalaba al hombre al que deseaba honrar especialmente."
  fr: "Les zehgirci fabriquaient l'anneau de pouce de l'archer, qui maintient la corde de l'arc lors de l'armement. Lors du défilé d'Evliya à Istanbul, les fabricants d'anneaux d'arc (zehgirjian) présentent ces anneaux, portés au pouce pour courber les flèches et maintenir la corde, confectionnés à partir de cornes et d'arêtes de poisson de toutes sortes. Leur mécène, Abu Taber Selfal, fils de Sa'd Wakkas, fut ceinturé par Selman Pak et déchiqueté par un lion près de Helleh. Elgood explique la fonction de cet artisanat: dans l'armement oriental, l'archer tire la corde avec le pouce, et non avec les doigts; l'anneau le protège donc du frottement de la corde. Il ajoute que de nombreux anneaux de pouce ornementaux, inadaptés au tir à l'arc, étaient portés par des hommes aisés pour afficher leur statut d'archers, tant les artisans qui fournissaient l'arc étaient estimés. Les fils des sultans ottomans étaient placés en apprentissage chez des archers dans leur jeunesse, et le sultan Mehmet II (1595-1603), lui-même habile dans la fabrication de bagues de pouce, façonnait une bague de ses propres mains et la présentait à l'homme qu'il souhaitait honorer tout particulièrement."
  tr: "Okçu, ok atarken yay kirişini tutmak için kullanılan başparmak yüzüğünü kendisi yapar. İstanbul'daki törende Evliya, Salman el-Farsi'nin kendisine bir kemer verdiği, ancak Hilla yakınlarında bir aslan tarafından parçalanan Pirham Ebu Tabir Salfal ibn Saad Vakkas da dahil olmak üzere okçu yüzük yapımcılarını (Zahirjian) saymıştır. Dükkanlarını, okları bükmek ve yay kirişini tutmak için başparmağa takılan, her türlü boynuz ve balık kemiğinden yapılmış bu yüzüklerle süslemişlerdir. Elgud, Doğu yöntemini kullanan okçunun, yay kirişini parmaklarıyla değil, başparmağıyla çektiğini, çünkü yüzüğün onu yay kirişinin sürtünmesinden koruduğunu açıklıyor. Ayrıca, günümüze ulaşan birçok dekoratif yüzükün pratik okçuluk için değil, güçlü kişilerin becerilerini ilan etmek için taktığını, çünkü okçulukta ustalığın bir statü göstergesi olduğunu ekliyor. Osmanlı sultanlarının oğulları bile yay yapımcıları tarafından eğitilirdi ve Sultan II. Muhammed'in başparmak yüzüğü yapımında yetenekli olduğu, bu nedenle yüzüğü kendisinin yapıp onurlandırmak istediği kişiye hediye ettiği rivayet edilir."
  id: "Pemanah membuat cincin ibu jari yang digunakan untuk memegang tali busur saat menembak. Dalam prosesi Istanbul, Evliya menghitung para pembuat alat panah (Zahirjian), termasuk Pirham Abu Tabir Salfal ibn Saad Waqqas, yang diberi ikat pinggang oleh Salman al-Farsi, hanya untuk kemudian dimangsa singa di dekat Hilla. Mereka menghiasi toko-toko mereka dengan cincin-cincin ini, yang dikenakan di ibu jari untuk membengkokkan anak panah dan memegang tali busur, yang dibuat dari berbagai jenis tanduk dan tulang ikan. Elgud menjelaskan bahwa pemanah, menggunakan metode Timur, menarik tali busur dengan ibu jarinya, bukan jari-jarinya, karena cincin tersebut melindunginya dari gesekan tali busur. Dia menambahkan bahwa banyak cincin dekoratif yang masih ada bukanlah untuk memanah secara praktis tetapi dikenakan oleh orang-orang berkuasa untuk menyatakan keahlian mereka, karena kemahiran dalam memanah merupakan tanda status. Bahkan putra-putra sultan Utsmaniyah pun dilatih oleh pembuat busur, dan dilaporkan bahwa Sultan Muhammad II mahir dalam membuat cincin ibu jari, sehingga ia akan membuat cincin itu sendiri dan memberikannya sebagai hadiah kepada siapa pun yang ingin ia hormati."
