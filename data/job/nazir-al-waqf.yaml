id: job/nazir-al-waqf
class: job
label: { ar: "ناظر الوقف", en: "Waqf supervisor (nazir)", ur: "ناظر وقف" }
names:
  - { value: "ناظر الأوقاف", kind: alternate }
  - { value: "nâzır", kind: latinized, lang: tr }
summary:
  ar: "ناظر الوقف هو من يراقب إدارة الوقف، ويُسمى عمله النظارة، في مقابل المتولي الذي يدير الوقف وتُسمى إدارته التولية. وفي أوقاف السلاطين والوزراء كانت النظارة تُشترط لكبار رجال الدولة، ثم صارت دواوين، حتى أنشأ محمود الثاني سنة 1826 نظارة الأوقاف الهمايونية، وصار ناظرها وزيراً في مجلس الوكلاء. وأُلغيت وكالة الشريعة والأوقاف في 3 مارس 1924 وصارت الأوقاف مديرية عامة تابعة لرئاسة الوزراء."
  en: "The nazir of a waqf supervised its administration. His work was called nezaret, set against the mutawalli, who managed the waqf, and whose work was called tevliyet. On the waqfs of sultans and viziers the supervision was stipulated for senior officers of state, and those charges grew into departments, until Mahmud II founded the imperial ministry of waqfs in 1826 and its nazir sat in the council of ministers. The Şer'iyye ve Evkaf ministry was abolished on 3 March 1924, and the waqfs became a directorate under the prime ministry."
  ur: "ناظر وقف وہ شخص تھا جو وقف کے انتظام کی نگرانی کرتا تھا۔ اس کام کو نظارة کہا جاتا تھا، جبکہ متولی خود انتظام کرتا تھا اور اس کے کام کو تولیت کہا جاتا تھا۔ سلاطین اور وزراء کے اوقاف میں یہ نگرانی اعلیٰ ریاستی عہدیداروں کے لیے مشروط ہوتی تھی، پھر یہ دفاتر بنے، یہاں تک کہ محمود ثانی نے 1826 میں شاہی اوقاف کی نظارة قائم کی اور اس کا ناظر وزراء کی مجلس میں شامل ہوا۔ 3 مارچ 1924 کو شریعت و اوقاف کی وزارت ختم ہوئی اور اوقاف وزیراعظم کے ماتحت ایک جنرل ڈائریکٹوریٹ بن گئے۔"
