  techniques:
    ar: "يضبط الشيزري دخول الوقود السوق: لا تُدخَل رِزَم الحطب وأكياس التبن وأواني الماء وسلال الزبل والرمل إلى السوق لما تُتلف من ثياب الناس، وإذا وقف حمّالو الحطب والتبن في الساحات أمرهم المحتسب أن يُنزلوا الأحمال عن دوابهم لأن الحمل يؤذيها وهي واقفة؛ ويأمر السقّائين وحمّالي الحطب أن يشدّوا أجراساً من حديد أو نحاس حول أعناق دوابهم ليُحدِثوا صوتاً في الأسواق والمحلات فيحذرهم العميان والصبيان والغافلون، وألا يحمّلوا البهائم فوق طاقتها ولا يسوقوها سوقاً عنيفاً تحت الحمل ولا يضربوها بقسوة ولا يتركوها قائمة في الدار محمّلة. وعند لين يتدفّأ بيت القاهرة إذا اقتضى الحال بمنقد النحاس المقلّع الملآن جمر الفحم، ويُقَدَّم إبريق القهوة أحياناً في إناء معلّق بثلاث سلاسل فيه جمر."
    en: "Al-Shayzari polices the entry of fuel into the market: bundles of firewood, sacks of straw, water-containers, baskets of dung and sand must not be taken in, because of the damage they do to people's clothes; when firewood- and straw-porters stop in the open squares the muhtasib orders them to take the loads off their animals, for the load hurts the beast while it stands; and he compels the water-carriers and firewood-carriers to tie bells of iron or brass round their animals' necks so that they make a noise in the markets and quarters and the blind, children and the inattentive are warned — the beasts must not be burdened beyond their strength, driven fiercely under their loads, beaten severely or left standing in a courtyard still loaded. In Lane's Cairo the house is warmed when needed by the tinned-copper mankal filled with burning charcoal, and the coffee-pot is sometimes brought in a vessel hung on three chains with burning charcoal in it."
    ur: "شیزری ایندھن کے بازار میں داخلے کو ضبط کرتا ہے: لکڑی کی گٹھریاں، بھوسے کی بوریاں، پانی کے برتن، کھاد کی ٹوکریاں اور ریت بازار میں نہ آئیں کہ لوگوں کے کپڑے خراب ہوتے ہیں؛ جب لکڑی اور بھوسہ ڈھونے والے چوکوں میں رکیں تو محتسب ان سے بوجھ اتارنے کو کہے کہ کھڑے جانور کو بوجھ تکلیف دیتا ہے؛ اور پانی اور لکڑی ڈھونے والے اپنے جانوروں کی گردن میں لوہے یا پیتل کی گھنٹیاں باندھیں تاکہ بازاروں اور محلوں میں آواز ہو اور اندھے، بچے اور غافل خبردار رہیں — جانور پر اس کی طاقت سے زیادہ بوجھ نہ ہو، نہ لدے ہوئے اسے تیز ہانکا جائے، نہ سخت مارا جائے، نہ لدے چھوڑا جائے۔ لین کے قاہرہ میں ضرورت پر گھر قلعی شدہ تانبے کی منقل سے تپایا جاتا جس میں کوئلہ جلتا، اور کبھی کافی کی لوٹی تین زنجیروں سے لٹکے برتن میں لائی جاتی جس میں جلتا کوئلہ ہوتا۔"
