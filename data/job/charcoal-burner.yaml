summary:
  ar: "الفَحَّام صانع الفحم وبائعه، وقود الحمّامات والمطابخ والمنقد. عدّ إوليا الكومورجية ⁦(الفحّامين)⁩ في إسطنبول ثمانمئة رجل بأربعمئة دكان، وصنّفهم أربعة أصناف: قوم يحملون الفحم من الجبال وجوههم سودٌ كالفحم لكنهم يكسبون دراهم بيضاء، ورجال مراكب الفحم وهم يونان غير مسلمين، وحفّاظ مخازن الفحم مسلمون وأرمن، ثم الباعة بالقسط ينادون الفحم في الأسواق، تُحمَل أكياسهم على خيل لسبوس وبغال قبرص ويمرّون يزنون الفحم وينادونه؛ بيرهم الأول آدم أول من أوقد ناراً، وبير زمن النبوة هارون الخيبري الذي قلّده سلمان وكان يحمل الفحم من خيبر وجبل أُحُد إلى المدينة حتى قتله أهل خيبر لإسلامه وقبره بوادي القرى. ويضبط الشيزري سوق الحطب والوقود: يُمنع إدخال رِزَم الحطب وأكياس التبن إلى السوق لما تُتلف من الثياب، ويأمر المحتسب حمّالي الحطب بأجراس حول رقاب دوابهم ليحذر العميان والصبيان، ولا يُثقَّل على البهيمة فوق طاقتها."
  en: "The fahham made charcoal and sold it, the fuel of the bath-fires, the kitchens and the brazier. Evliya counts the coalmen (Komurjian) of Istanbul at eight hundred men in four hundred shops, and sorts them into four kinds: the colliers who come from the mountains with faces black as coal yet earn white money; the men of the coal-ships, Greeks condemned to be black-faced in this world and the next; the keepers of the coal-magazines, partly Muslims and partly Armenians; and last the retailers who cry coals in the streets, their bags carried on Lesbian horses or Cyprian mules, passing while they weigh and cry. Their first patron, as the first who lighted a fire, is Adam; the patron of the Prophet's time is Harun of Khaybar, girded by Selman, who carried coals from Khaybar and Mount Ohod to Medina and gained his subsistence by the trade until the people of Khaybar put him to death for becoming a Muslim; his tomb is at Wadi-ul-kira. Al-Shayzari polices the fuel-bearers' market: bundles of firewood and sacks of straw must not be taken into the market for the harm they do to clothes; donkey-drivers and firewood-carriers must tie bells to their beasts' necks so that the blind, children and the inattentive are warned, and the beast must not be burdened beyond its strength."
  ur: "فحّام کوئلہ بنانے اور بیچنے والا ہے — حماموں، باورچی خانوں اور منقل کا ایندھن۔ اولیاء استنبول کے فحّاموں ⁦(کومورجیان)⁩ کو آٹھ سو آدمی چار سو دکانیں گنتا اور چار قسموں میں بانٹتا ہے: پہاڑوں سے آنے والے کوئلہ کش جن کے چہرے کوئلے سے کالے مگر سفید روپیہ کماتے؛ کوئلے کی کشتیوں کے آدمی یونانی غیر مسلم؛ کوئلہ ذخیروں کے نگہبان کچھ مسلمان کچھ آرمینی؛ اور آخر میں خوردہ فروش جو گلیوں میں کوئلہ پکار کر بیچتے، ان کی بوریاں لیسبوس کے گھوڑوں یا قبرصی خچروں پر اٹھتی اور وہ تولتے اور پکارتے نکلتے۔ ان کا پہلا پیر، بطور پہلا آگ جلانے والا، آدم ہے؛ اور نبوت کے زمانے کا پیر خیبر کا ہارون ہے جسے سلمان نے کمر بند پہنائی، وہ خیبر اور کوہِ احد سے مدینہ تک کوئلہ ڈھو کر گزر بسر کرتا یہاں تک کہ خیبر والوں نے اسلام قبول کرنے پر اسے قتل کیا؛ قبر وادی القرى میں ہے۔ شیزری ایندھن ڈھونے والوں کے بازار کو ضبط کرتا ہے: لکڑی کی گٹھری اور بھوسے کی بوریاں بازار میں نہ لائی جائیں کہ کپڑے خراب ہوتے ہیں؛ گدھا چلانے والے اور لکڑی ڈھونے والے اپنے جانوروں کی گردن میں گھنٹیاں باندھیں تاکہ اندھے، بچے اور غافل خبردار رہیں، اور جانور پر اس کی طاقت سے زیادہ بوجھ نہ ہو۔"
  es: "El fahham fabricaba carbón vegetal y lo vendía, combustible para los fuegos de los baños, las cocinas y el brasero. Evliya cuenta a los carboneros (Komurjian) de Estambul en ochocientos hombres en cuatrocientas tiendas, y los clasifica en cuatro tipos: los carboneros que vienen de las montañas con rostros negros como el carbón pero ganan dinero blanco; los hombres de los barcos carboneros, griegos condenados a tener el rostro negro en este mundo y en el próximo; los guardianes de los depósitos de carbón, en parte musulmanes y en parte armenios; y por último los comerciantes que pregonan carbón en las calles, sus sacos llevados en caballos lesbos o mulas chipriotas, pasando mientras pesan y pregonan. Su primer patrón, como el primero que encendió un fuego, es Adán; el patrón de la época del Profeta es Harún de Khaybar, ceñido por Selmán, que transportaba carbón de Khaybar y el monte Ohod a Medina y se ganaba la vida con el comercio hasta que la gente de Khaybar lo mandó matar por convertirse al Islam; Su tumba se encuentra en Wadi-ul-kira. Al-Shayzari vigila el mercado de los leñadores: no se deben llevar al mercado manojos de leña ni sacos de paja, ya que dañan la ropa; los arrieros y los leñadores deben atar campanas al cuello de sus animales para advertir a los ciegos, los niños y los distraídos, y no se debe sobrecargar al animal más allá de sus fuerzas."
  fr: "Les charbonniers fabriquaient et vendaient du charbon de bois, combustible pour les bains, les cuisines et les braseros. Evliya recense huit cents charbonniers (Komurjian) d'Istanbul, répartis dans quatre cents boutiques, et les classe en quatre catégories: les charbonniers venus des montagnes, le visage noir comme le charbon, mais gagnant de l'argent blanc; les hommes des navires charbonniers, Grecs condamnés à garder le visage noirci dans ce monde et dans l'autre; les gardiens des dépôts de charbon, en partie musulmans et en partie arméniens; et enfin les marchands qui crient « charbon ! » dans les rues, leurs sacs portés par des chevaux lesbiens ou des mules chypriotes, passant en pesant et en criant. Leur premier protecteur, comme le premier à avoir allumé un feu, est Adam; le protecteur du temps du Prophète est Harun de Khaybar, accompagné de Selman, qui transportait du charbon de Khaybar et du mont Ohod jusqu'à Médine et gagnait sa vie grâce à ce commerce jusqu'à ce que les habitants de Khaybar le mettent à mort pour s'être converti à l'islam. Son tombeau se trouve à Wadi-ul-Kira. Al-Shayzari fait respecter la réglementation du marché des porteurs de bois: les fagots de bois et les sacs de paille ne doivent pas y être apportés, car ils abîment les vêtements; les conducteurs d’ânes et les porteurs de bois doivent attacher des clochettes au cou de leurs bêtes afin d’avertir les aveugles, les enfants et les personnes inattentives, et les animaux ne doivent pas être surchargés au-delà de leurs forces."
  tr: "Hamamların, mutfakların ve sobaların yakıtı olan kömürü üreten ve satan Evliya Kömürcüler. İstanbul'da sekiz yüz kişiden oluşan ve dört yüz dükkânları bulunan kömürcüler dört kategoriye ayrılıyordu: Dağlardan kömür taşıyan, yüzleri kömür gibi simsiyah olan ama beyaz para kazananlar; Müslüman olmayan Rum kömür gemisi mürettebatı; Müslüman ve Ermeni kömür deposu sahipleri; ve Lesbos atları ve Kıbrıs katırları üzerinde çuvallarını taşıyarak pazarlarda kömürü tartıp fiyatını söyleyen kredili satıcılar; ilk liderleri ateşi ilk yakan Adem'di ve Peygamberimiz zamanındaki liderleri, Salman'ın taklit ettiği Harun Hayberi idi. Hayberi, Hayber halkı onu İslamiyetinden dolayı öldürene kadar Hayber ve Uhud Dağı'ndan Medine'ye kömür taşırdı ve mezarı Vadi-i Kura'dadır. El-Şezari, yakacak odun ve yakıt pazarını düzenler: Odun demetleri ve saman çuvallarının giysilere zarar vermesi nedeniyle pazara getirilmesi yasaktır. Pazar müfettişi, odun taşıyıcılarına, körleri ve çocukları uyarmak için hayvanlarının boyunlarına zil takmalarını ve hayvanları kapasitelerinin ötesinde yüklememelerini emreder."
  id: "Pembuat dan penjual arang, bahan bakar untuk pemandian, dapur, dan kompor. Evliya Çomurji (pembuat arang) di Istanbul berjumlah delapan ratus orang dengan empat ratus toko, dan mengklasifikasikan mereka ke dalam empat kategori: orang-orang yang membawa batu bara dari pegunungan, wajah mereka hitam seperti batu bara, tetapi mereka mendapatkan uang putih; orang-orang kapal batu bara, yang merupakan orang Yunani non-Muslim; penjaga gudang batu bara, yang merupakan Muslim dan Armenia; kemudian para penjual kredit yang meneriakkan harga batu bara di pasar, karung mereka dibawa di atas kuda Lesbos dan keledai Siprus, dan mereka lewat sambil menimbang batu bara dan meneriakkan harganya; pemimpin pertama mereka adalah Adam, orang pertama yang menyalakan api, dan pemimpin pada zaman Nabi adalah Harun al-Khaybari, yang ditiru oleh Salman, dan dia biasa membawa batu bara dari Khaybar dan Gunung Uhud ke Madinah sampai penduduk Khaybar membunuhnya karena keislamannya, dan makamnya berada di Wadi al-Qura. Al-Shayzari mengatur pasar kayu bakar dan bahan bakar: bundel kayu bakar dan karung jerami dilarang dibawa ke pasar karena dapat merusak pakaian. Inspektur pasar memerintahkan para pengangkut kayu bakar untuk memasang lonceng di leher hewan mereka untuk memperingatkan para tunanetra dan anak laki-laki, dan tidak membebani hewan secara berlebihan."
