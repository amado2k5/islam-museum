summary:
  ar: "المذهّب ⁦(müzehhib)⁩ صاحب فن التذهيب: تزيين المخطوطات والألواح والمرقعات بورق الذهب المسحوق وبالألوان — ظهريّات وسرلوحات وعناوين سور ودوَرك آيات وورود هوامش — في أساليب تغيّرت من هرات إلى قونية إلى إستانبول."
  en: "The illuminator (müzehhib) decorated manuscripts, calligraphy panels and albums with burnished gold leaf and colour — zahriye medallions, serlevha pages, sura-head panels, verse-stop rosettes and marginal ornament — in styles that shifted from Herat to Konya to Istanbul."
  ur: "مذہب ⁦(تذہیب کار)⁩ وہ کاریگر ہے جو مخطوطات، خطاطی کے تختوں اور مرقعوں کو کڑیا ہوا ورقِ زر اور رنگوں سے آراستہ کرتا ہے — ظہریہ مدالے، سرلوحہ صفحات، سورت سرخیاں، آیت کے گل اور حاشیے کی آرائش — ہرات سے قونیہ سے استنبول تک بدلتی طرزوں میں۔"
  es: "El iluminador (müzehhib) decoraba manuscritos, paneles de caligrafía y álbumes con pan de oro bruñido y color —medallones zahriye, páginas serlevha, paneles con cabeceras de sura, rosetas de parada de verso y ornamentación marginal— en estilos que variaban desde Herat hasta Konya y Estambul."
  fr: "L'enlumineur (müzehhib) décorait les manuscrits, les panneaux de calligraphie et les albums avec des feuilles d'or brunies et de la couleur — médaillons zahriye, pages serlevha, panneaux de tête de sura, rosettes de verset et ornements marginaux — dans des styles qui passaient d'Herat à Konya à Istanbul."
  tr: "Yaldızcı (müzehib), yaldızlama sanatının ustasıdır: Herat'tan Konya'ya ve İstanbul'a kadar değişen stillerde, el yazmalarını, tabletleri ve yamaları toz altın varak ve renklerle süsler; arka yüzleri, panelleri, sure başlıklarını, ayet dairelerini ve kenar güllerini dekore eder."
  id: "Sang ahli penyepuhan (müzehhib) adalah ahli dalam seni penyepuhan: menghias manuskrip, tablet, dan lembaran dengan bubuk emas dan warna — bagian belakang, panel, judul surah, lingkaran ayat, dan mawar di pinggir halaman — dengan gaya yang berubah dari Herat ke Konya hingga Istanbul."
