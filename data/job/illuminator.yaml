summary:
  ar: "المذهّب ⁦(müzehhib)⁩ صاحب فن التذهيب: تزيين المخطوطات والألواح والمرقعات بورق الذهب المسحوق وبالألوان — ظهريّات وسرلوحات وعناوين سور ودوَرك آيات وورود هوامش — في أساليب تغيّرت من هرات إلى قونية إلى إستانبول."
  en: "The illuminator (müzehhib) decorated manuscripts, calligraphy panels and albums with burnished gold leaf and colour — zahriye medallions, serlevha pages, sura-head panels, verse-stop rosettes and marginal ornament — in styles that shifted from Herat to Konya to Istanbul."
  ur: "مذہب ⁦(تذہیب کار)⁩ وہ کاریگر ہے جو مخطوطات، خطاطی کے تختوں اور مرقعوں کو کڑیا ہوا ورقِ زر اور رنگوں سے آراستہ کرتا ہے — ظہریہ مدالے، سرلوحہ صفحات، سورت سرخیاں، آیت کے گل اور حاشیے کی آرائش — ہرات سے قونیہ سے استنبول تک بدلتی طرزوں میں۔"
