id: job/architect
class: job
label: { ar: "المعمار", en: "Architect (mi'mar)", ur: "معمار" }
summary:
  ar: "المعمار هو من يضع تصميم البناء ويشرف على تنفيذه، وكان عليه أن يعرف الهندسة والبناء ومساحة الأرض. وفي الدولة العثمانية كان على رأس المعماريين في القصر «المِعْمارْباشي»، يتولى ديواناً يتولى المباني الحكومية والسلطانية ويرخّص لمن يبني خارجه. {cite:tdv-mimari p.91-95} {cite:tdv-mimarbasi p.90-91}"
  en: "The architect (mi'mar) designs a building and oversees its construction, and was expected to know geometry, building technique and the measurement of land. In the Ottoman state the chief of the architects in the palace, the mimarbaşı, led an office that carried out the state's and the sultan's buildings and licensed those who built outside it. {cite:tdv-mimari p.91-95} {cite:tdv-mimarbasi p.90-91}"
  ur: "معمار وہ شخص ہے جو عمارت کا نقشہ بناتا اور اس کی تعمیر کی نگرانی کرتا ہے، اور اسے ہندسہ، تعمیری فن اور زمین کی پیمائش جاننی ہوتی تھی۔ عثمانی ریاست میں محل کے معماروں کا سربراہ معمار باشی ہوتا تھا، جو ایک دفتر چلاتا جو سرکاری اور سلطانی عمارات کا کام کرتا اور دفتر سے باہر تعمیر کرنے والوں کو اجازت دیتا تھا۔ {cite:tdv-mimari p.91-95} {cite:tdv-mimarbasi p.90-91}"
