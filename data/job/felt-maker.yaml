summary:
  ar: "اللُّبّود من يلبّد الصوف لبداً فيصنع منه القلانس والعباءات والفرش وبيوت الشعر. يضبط ابن الأخوة مادته: لا يُستعمل صوف الميتة ويعرف بلينه ورائحته الخبيثة، ولا صوف الرؤوس ويعرف بخشونته، واللباد الأحمر وزنه أربعة أرطال والأزرق رطل ونصف، ويُمنع غسل اللباد في الحمّامات لأن رائحته تؤذي الناس. وفي إسطنبول إوليا لصنّاع اللباد ⁦(كتشه جيان)⁩ ألف رجل وخمسة بأربعمئة دكان بيرهم أبو سعيد الناعي الذي قلّده سلمان الفارسي، ولصنّاع عباءات وقلانس البُرْك مئة رجل بأربعين دكاناً عند سوق الخيل، وللبّادين ملحقين بالإنكشارية ستون بعشر دكاكين في الثكنتين يصنعون قلنسوة الإنكشارية؛ وقلانس كتشه التي تباع في سوق بيالة باشا لا يضاهي إتقانها إلا ما يُعمل في ماغنيزيا وقونية."
  en: "The lubbud matted wool into felt for caps, cloaks, mats and tents. Ibn al-Ukhuwwa polices his material: no wool of animals that died of themselves, known by its softness and ill odour, and no wool from heads, known by its roughness; a red felt weighs four ratls and a blue one a ratl and a half, and felt may not be washed in the baths because the smell injures people. In Evliya's Istanbul the felt-makers (Ketshejian) were a thousand and five men in four hundred shops under their patron Abu Said Nadi, who was girded by Selman Pak; the burk-makers made capots and caps of burk felt in a hundred men with forty shops at the horse-market; the Janissaries' felt-makers, sixty men in ten shops inside both barracks, produced the Janissary felt cap; and the keche caps sold in the market of Pialeh Pasha were worked so neatly that only Magnesia and Konia could rival them."
  ur: "لبّاد اون کو دبا کر نمدہ بناتا تھا جس سے ٹوپیاں، عبائیں، چٹائیاں اور خیمے تیار ہوتے۔ ابن الاخوہ اس کے مال کی نگرانی کرتا ہے: مردار کی اون حرام، جو نرمی اور بدبو سے پہچانی جائے، اور سر والی اون بھی نہیں جو خردری پن سے معلوم ہو؛ سرخ نمدہ چار رطل اور نیلا ڈیڑھ رطل وزن کا ہو، اور حمام میں نمدہ دھونا ممنوع کہ اس کی بو سے لوگوں کو تکلیف ہوتی ہے۔ اولیاء کے استنبول میں نمدہ ساز ⁦(کچہ جیان)⁩ ایک ہزار پانچ آدمی چار سو دکانیں جن کے پیر ابو سعید ناعی ہیں جنہیں سلمان پاک نے کمر بند پہنائی؛ برک ساز سو آدمی چالیس دکانیں گھوڑے کے بازار میں برک نمدے کے قبا اور ٹوپیاں بناتے؛ ینی چریوں کے نمدہ ساز ساٹھ آدمی دس دکانیں دونوں بیرک میں ینی چریوں کی نمدہ ٹوپی بناتے؛ اور پیالہ پاشا کے بازار میں بکنے والی کچہ ٹوپیاں اتنی باریک کاری کی ہیں کہ صرف مغنیسہ اور قونیہ ان کا ثانی ہیں۔"
  es: "El lubbud amasaba la lana para hacer fieltro para gorros, capas, esteras y tiendas. Ibn al-Ukhuwwa controlaba su material: no se usaba lana de animales que murieran por sí mismos, conocida por su suavidad y mal olor, ni lana de cabezas, conocida por su aspereza; un fieltro rojo pesaba cuatro ratls y uno azul un ratl y medio, y el fieltro no se podía lavar en los baños porque el olor perjudicaba a las personas. En el Estambul de Evliya, los fabricantes de fieltro (Ketshejian) eran mil cinco hombres en cuatrocientos talleres bajo su patrón Abu Said Nadi, quien estaba ceñido por Selman Pak; los fabricantes de burk hacían capots y gorros de fieltro burk en cien hombres con cuarenta talleres en el mercado de caballos; los fabricantes de fieltro de los jenízaros, sesenta hombres en diez talleres dentro de ambos cuarteles, producían el gorro de fieltro de los jenízaros; y los gorros keche que se vendían en el mercado de Pialeh Pasha estaban elaborados con tanta precisión que solo Magnesia y Konia podían rivalizar con ellos."
  fr: "Les feutriers transformaient la laine en feutre pour fabriquer des bonnets, des manteaux, des nattes et des tentes. Ibn al-Ukhuwwa contrôlait rigoureusement sa matière première: pas de laine d’animaux morts d’hypothermie, réputée pour sa douceur et sa mauvaise odeur, ni de laine de tête, connue pour sa rugosité; un feutre rouge pesait quatre ratls et un feutre bleu un ratl et demi, et le feutre ne devait pas être lavé dans les bains car son odeur était insupportable. À Istanbul, sous le règne d’Evliya, les feutriers (Ketshejian) étaient mille cinq hommes répartis dans quatre cents ateliers sous la tutelle d’Abu Said Nadi, lui-même protégé par Selman Pak; les fabricants de burk confectionnaient des capots et des bonnets en feutre de burk avec une centaine d’hommes et quarante ateliers au marché aux chevaux; les feutriers des janissaires, soixante hommes dans dix ateliers situés dans les deux casernes, produisaient le bonnet de feutre des janissaires. et les chapeaux keche vendus sur le marché de Pialeh Pasha étaient travaillés avec une telle précision que seuls Magnesia et Konia pouvaient rivaliser avec eux."
  tr: "Keçeci, yünü keçe haline getirerek şapka, pelerin, şilte ve çadır yapan kişidir. İbn el-Uhuvve, malzemesini şöyle belirtir: Yumuşaklığı ve kötü kokusuyla bilinen ölü hayvanların yünü kullanılmaz; kabalığıyla bilinen kafa yünü de kullanılmaz. Kırmızı keçe dört pound, mavi keçe ise bir buçuk pound ağırlığındadır. Keçenin kokusu rahatsız edici olduğu için hamamlarda yıkanması yasaktır. İstanbul'da, Salman el-Farsi'nin taklit ettiği Pirham Ebu Sa'id el-Na'i de dahil olmak üzere 400 dükkanda 1005 keçeci vardı. At pazarı yakınlarında 40 dükkanda 100 kepek ve pelerin yapımcısı bulunuyordu. Yeniçerilere bağlı keçeciler ise iki kışlada 10 dükkanda 60 kişiydi ve Yeniçeri şapkası yapıyorlardı. Piyale Paşa pazarında satılan Keçe şapkalarının kalitesi, yalnızca Magnesia ve Konya'da üretilen şapkalarla kıyaslanabilirdi."
  id: "Pembuat kain felt adalah orang yang mengolah wol menjadi kain felt untuk membuat topi, jubah, kasur, dan tenda. Ibn al-Ukhuwwah menyebutkan bahannya: wol dari hewan mati tidak digunakan, karena dikenal lembut dan berbau busuk, begitu pula wol dari kepala, karena dikenal kasar. Kain felt merah beratnya empat pon, dan kain felt biru beratnya satu setengah pon. Mencuci kain felt dilarang di pemandian umum karena baunya menyengat. Di Istanbul, pembuat kain felt (Keçejiyan) berjumlah 1.005 orang dengan 400 toko, termasuk Pirham Abu Sa'id al-Na'i, yang ditiru oleh Salman al-Farsi. Pembuat jubah dan topi Burk berjumlah 100 orang dengan 40 toko di dekat pasar kuda. Pembuat kain felt yang tergabung dalam Janissari berjumlah 60 orang dengan 10 toko di dua barak, yang membuat topi Janissari. Topi Keçe yang dijual di pasar Piyale Pasha hanya dapat disaingi kualitasnya oleh topi yang dibuat di Magnesia dan Konya."
