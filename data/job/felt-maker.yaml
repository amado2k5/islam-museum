  techniques:
    ar: "يحرّم ابن الأخوة صوف الميتة، يُعرف بلينه ونتن رائحته، وصوف الرؤوس، يُعرف بخشونته، ويوجب أن يزن اللباد الأحمر أربعة أرطال والأزرق رطلاً ونصفاً، وأن يكون خيط اللبدات كلها جيد الفتل، وأن يُبلّ الغراء من غير زغب الصوف، وينهى الحُذّاء واللبّادين عن غسل اللباد أو الجلد في الحمّامات لأن الناس يتأذّون بالرائحة. ويصف إوليا المنتجات: اللباد بأنواعه تعمل في الدكاكين أثناء الموكب، وعباءات وقلانس البُرْك، وقلنسوة الإنكشارية اللبادية، وتجّار اللباد الخشن ⁦(كبه جيان)⁩ ثلاثمئة بمئة دكان، ويذكر أن الياكمة التابعين للحمّام إذا ساروا مع العسكر صنعوا حمّامات من اللباد تُحمّى بالجمر للجيش حيث وجدوا موضعاً صالحاً."
    en: "Ibn al-Ukhuwwa bans the wool of animals that died of themselves, recognised by its softness and foul smell, and wool from heads, recognised by its roughness; he requires the red felt to weigh four ratls and the blue a ratl and a half, the thread of all felts to be well twisted, and the gum to be moistened free of wool-flock; and he forbids shoemakers and felt-makers to wash felt or leather in the baths because people are injured by the smell. Evliya shows the products: different kinds of felt worked in the shops as they pass, the burk capots and caps, the Janissary felt cap, and the coarse-felt merchants, three hundred men in a hundred shops; and he notes that the bath attendants, when they follow the camp, make baths out of felt heated with coals for the army wherever they find a suitable spot."
    ur: "ابن الاخوہ مردار کی اون ممنوع کرتا ہے جو نرمی اور بدبو سے پہچانی جائے، اور سر کی اون بھی جو خردری سے معلوم ہو؛ حکم ہے کہ سرخ نمدہ چار رطل اور نیلا ڈیڑھ رطل وزن کا ہو، ہر نمدے کا سوتر اچھے جوٹ کا ہو، اور گوند بغیر اون کے روئیں بگھوائی جائے؛ اور جُتی سازوں اور نمدہ سازوں کو حمام میں نمدہ یا چمڑا دھونے سے روکتا ہے کہ بو سے لوگوں کو نقصان پہنچتا ہے۔ اولیاء مصنوعات دکھاتا ہے: دکانوں میں چلتے ہی مختلف قسم کے نمدے بنتے ہیں، برک کے قبا اور ٹوپیاں، ینی چریوں کی نمدہ ٹوپی، اور موٹے نمدے کے سوداگر تین سو آدمی سو دکانیں؛ اور بتاتا ہے کہ حمام کے خادم لشکر کے ساتھ چلتے تو جہاں موزوں جگہ ملے فوج کے لیے نمدے کے حمام بنا کر انگاروں سے گرم کرتے۔"
