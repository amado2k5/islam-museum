summary:
  ar: "اللُّبّود من يلبّد الصوف لبداً فيصنع منه القلانس والعباءات والفرش وبيوت الشعر. يضبط ابن الأخوة مادته: لا يُستعمل صوف الميتة ويعرف بلينه ورائحته الخبيثة، ولا صوف الرؤوس ويعرف بخشونته، واللباد الأحمر وزنه أربعة أرطال والأزرق رطل ونصف، ويُمنع غسل اللباد في الحمّامات لأن رائحته تؤذي الناس. وفي إسطنبول إوليا لصنّاع اللباد ⁦(كتشه جيان)⁩ ألف رجل وخمسة بأربعمئة دكان بيرهم أبو سعيد الناعي الذي قلّده سلمان الفارسي، ولصنّاع عباءات وقلانس البُرْك مئة رجل بأربعين دكاناً عند سوق الخيل، وللبّادين ملحقين بالإنكشارية ستون بعشر دكاكين في الثكنتين يصنعون قلنسوة الإنكشارية؛ وقلانس كتشه التي تباع في سوق بيالة باشا لا يضاهي إتقانها إلا ما يُعمل في ماغنيزيا وقونية."
  en: "The lubbud matted wool into felt for caps, cloaks, mats and tents. Ibn al-Ukhuwwa polices his material: no wool of animals that died of themselves, known by its softness and ill odour, and no wool from heads, known by its roughness; a red felt weighs four ratls and a blue one a ratl and a half, and felt may not be washed in the baths because the smell injures people. In Evliya's Istanbul the felt-makers (Ketshejian) were a thousand and five men in four hundred shops under their patron Abu Said Nadi, who was girded by Selman Pak; the burk-makers made capots and caps of burk felt in a hundred men with forty shops at the horse-market; the Janissaries' felt-makers, sixty men in ten shops inside both barracks, produced the Janissary felt cap; and the keche caps sold in the market of Pialeh Pasha were worked so neatly that only Magnesia and Konia could rival them."
  ur: "لبّاد اون کو دبا کر نمدہ بناتا تھا جس سے ٹوپیاں، عبائیں، چٹائیاں اور خیمے تیار ہوتے۔ ابن الاخوہ اس کے مال کی نگرانی کرتا ہے: مردار کی اون حرام، جو نرمی اور بدبو سے پہچانی جائے، اور سر والی اون بھی نہیں جو خردری پن سے معلوم ہو؛ سرخ نمدہ چار رطل اور نیلا ڈیڑھ رطل وزن کا ہو، اور حمام میں نمدہ دھونا ممنوع کہ اس کی بو سے لوگوں کو تکلیف ہوتی ہے۔ اولیاء کے استنبول میں نمدہ ساز ⁦(کچہ جیان)⁩ ایک ہزار پانچ آدمی چار سو دکانیں جن کے پیر ابو سعید ناعی ہیں جنہیں سلمان پاک نے کمر بند پہنائی؛ برک ساز سو آدمی چالیس دکانیں گھوڑے کے بازار میں برک نمدے کے قبا اور ٹوپیاں بناتے؛ ینی چریوں کے نمدہ ساز ساٹھ آدمی دس دکانیں دونوں بیرک میں ینی چریوں کی نمدہ ٹوپی بناتے؛ اور پیالہ پاشا کے بازار میں بکنے والی کچہ ٹوپیاں اتنی باریک کاری کی ہیں کہ صرف مغنیسہ اور قونیہ ان کا ثانی ہیں۔"
