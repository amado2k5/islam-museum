  techniques:
    ar: "يذكر المدخل أن الحائك يشتري الغزل جاهزاً أو يغزل القطن الخام بنفسه، وأن الأنوال تتفاوت أحجامها، وأن المشط يُقاس بالجلة وهي أربعون سنّاً، وأن أمشاطاً من ثمان إلى ثلاث عشرة جلة كانت تُصنع وتُباع. وتُصنع الأنوال عند الحائكين أو تُطلب أو تُشترى جاهزة، وتُسعَّر في قائمة 1640م نول أدرنة بمئة وسبعين أقجة والنول البسيط بمئة وعشرين."
    en: "The entry says the weaver bought ready yarn or spun raw cotton himself, that looms differed in size, and that combs were counted in cile of forty teeth, with combs of eight to thirteen cile made and sold. Looms were made by the weavers, ordered or bought ready. The price list of 1640 gives an Edirne loom at 170 akce and a plain loom at 120."
    ur: "مدخل کہتا ہے کہ جولاہا بنا بنایا سوت خریدتا یا خام روئی خود کات لیتا تھا، کھڈیوں کے سائز مختلف ہوتے، اور کنگھیاں چالیس دندانوں کی چلہ سے ناپی جاتیں، جن میں آٹھ سے تیرہ چلہ تک کی کنگھیاں بنتی اور بکتی تھیں۔ کھڈیاں جولاہے خود بناتے، آرڈر دیتے یا بنی بنائی خریدتے؛ 1640ء کی نرخ فہرست میں ادرنہ کی کھڈی 170 اقچے اور سادہ کھڈی 120 اقچے کی ہے۔"
