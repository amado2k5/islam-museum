summary:
  ar: "يصف مدخل TDV الجلّاه، أي الحائك العثماني الذي نسج القطن غالباً. كان يشتري الغزل جاهزاً أو يغزل القطن الخام بنفسه، ويعمل بأمر البزازين، ولا يبيع قماشه في السوق بنفسه. وكان لحائكي المدينة طائفة يرأسها أخي بابا، ويراقب أهل الخبرة طول القماش وجودته. وتراجعت الحرفة أمام القطن الهندي ثم الأوروبي، وانهارت طوائفها في خمسينيات القرن التاسع عشر."
  en: "The TDV entry describes the cullah, the Ottoman weaver, who mostly wove cotton. He bought yarn ready-spun or spun raw cotton himself, worked to orders from the cloth merchants, and could not sell his cloth in the market himself. The weavers of a town formed a guild led by an ahi baba, and men of experience checked the length and quality of the cloth. The craft gave way to Indian and then European cotton, and its guilds collapsed in the 1850s."
  ur: "ٹی ڈی وی کا مدخل جلّاہ، یعنی عثمانی جولاہے، کو بیان کرتا ہے جو زیادہ تر روئی بنتا تھا۔ وہ بنا بنایا سوت خریدتا یا خام روئی خود کات لیتا، بزازوں کے آرڈر پر کام کرتا اور اپنا کپڑا خود بازار میں نہیں بیچ سکتا تھا۔ شہر کے جولاہوں کی جماعت کا سربراہ اخی بابا ہوتا، اور اہلِ خبرہ کپڑے کی لمبائی اور معیار جانچتے۔ یہ ہنر ہندوستانی اور پھر یورپی روئی کے سامنے ہار گیا اور اس کی جماعتیں 1850ء کی دہائی میں ٹوٹ گئیں۔"
