summary:
  ar: "صانع العود هو حِرفي الآلات الوترية، وقدوته صناعة العود نفسه: جسم من نحو عشرين شريحة خشبية هلالية، وصدر من لوح تِنّوب أو عرعر بسماكة مليمتر واحد تقوّيه عوارض «بالقون»، وفتحات صوت تُغلّف بزخارف الغل أو الكافس، وأوتار كانت من الأمعاء ثم من الحرير الملفوف بفضة أو نحاس. يتابع المدخل الصنعة من زلزل الذي فصل العنق عن الجسم، إلى زرياب الذي نشر ريشة النسر مضراباً في الأندلس، إلى ورش إستانبول في القرن التاسع عشر وأشهر صنّاعها مانول أوستا."
  en: "The oud maker built the short-necked lute of Islamic music: a bowl of some twenty crescent wood ribs, a soundboard of spruce or fir one millimetre thick braced by 'balkon' laths, sound holes covered with carved 'rose' or lattice, and strings once of gut then of silk wound with silver or copper. The entry follows the craft from Zelzel's separate neck, through Ziryāb's eagle-feather plectrum in al-Andalus, to the nineteenth-century Istanbul workshops whose most famous maker was Manol Usta."
  ur: "عود ساز قصیر گردن والا ساز بنانے والا کاریگر ہے: جسم تقریباً بیس ہلال نما لکڑی کی سلاخوں سے بنتا، صدائی تختہ ایک ملی میٹر موٹا تنو یا صنوبر کی تختی جسے «بالقون» سلاخیں مضبوط کرتی ہیں، صدائی سوراخ گل یا جالی کے تراشوں سے ڈھکتے، اور ڈور پہلے آنت کی پھر ریشم کی جس پر چاندی یا تانبے کی تار لپٹی۔ مدخل صنعت کو زلزل کی الگ گردن سے، زریاب کے عقابی پنکھ کے مضراب تک، اور انیسویں صدی کے استنبول کے ورشوں تک — جن میں مانول اوستا مشہور ترین تھا — لے جاتا ہے۔"
  es: "El fabricante de oud construyó el laúd de mástil corto de la música islámica: una caja de resonancia de unas veinte costillas de madera en forma de media luna, una tapa armónica de abeto o pino de un milímetro de grosor reforzada con listones de balcón, orificios de sonido cubiertos con una rosa tallada o celosía, y cuerdas que antes eran de tripa y luego de seda entorchadas con plata o cobre. La entrada sigue la tradición artesanal desde el mástil independiente de Zelzel, pasando por la púa de pluma de águila de Ziryāb en al-Ándalus, hasta los talleres de Estambul del siglo XIX, cuyo fabricante más famoso fue Manol Usta."
  fr: "Le luthier fabriquait le luth à manche court de la musique islamique: une caisse de résonance composée d’une vingtaine de côtes en bois en forme de croissant, une table d’harmonie en épicéa ou en sapin d’un millimètre d’épaisseur, renforcée par des lattes de balkon, des ouïes ornées de rosaces ou de treillis sculptés, et des cordes, d’abord en boyau puis en soie, filées d’argent ou de cuivre. L’article retrace l’histoire de cet art, depuis le manche séparé de Zelzel, en passant par le plectre en plume d’aigle de Ziryāb en al-Andalus, jusqu’aux ateliers d’Istanbul du XIXe siècle, dont le plus célèbre luthier fut Manol Usta."
  tr: "Ud yapımcısı, telli çalgılar ustasıdır ve modeli udun kendisidir: yaklaşık yirmi hilal şeklinde ahşap şeritten yapılmış bir gövde, bir milimetre kalınlığında, çapraz kirişlerle güçlendirilmiş köknar veya ardıç ağacından yapılmış bir ses tahtası, dekoratif kalıplarla kaplı ses delikleri ve başlangıçta bağırsaktan, daha sonra ise gümüş veya bakırla sarılmış ipekten yapılmış teller. Giriş bölümü, bu zanaatı, boynu gövdeden ayıran Zalzal'dan, Endülüs'te mızrap olarak kartal tüyü kullanan Ziryab'a, 19. yüzyıl İstanbul'unun atölyelerine ve en ünlü yapımcısı Manol Usta'ya kadar izler."
  id: "Pembuat oud adalah pengrajin alat musik gesek, dan modelnya adalah oud itu sendiri: badan yang terbuat dari sekitar dua puluh bilah kayu berbentuk bulan sabit, papan suara dari kayu cemara atau juniper setebal satu milimeter yang diperkuat dengan balok melintang, lubang suara yang ditutupi dengan cetakan dekoratif, dan senar yang awalnya terbuat dari usus hewan dan kemudian dari sutra yang dibungkus perak atau tembaga. Pendahuluan ini menelusuri kerajinan tersebut dari Zalzal, yang memisahkan leher dari badan, hingga Ziryab, yang menggunakan bulu elang sebagai plektrum di Andalusia, hingga bengkel-bengkel di Istanbul abad ke-19 dan pembuatnya yang paling terkenal, Manol Usta."
