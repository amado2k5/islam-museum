  techniques:
    ar: "يبني الصانع جسم العود من نحو عشرين شريحة خشبية هلالية، ويركّب العنق القصير بوتر خشبية، ويشكّل البُرغلوق منحنى على هيئة حرف ⁦S⁩ تدخل فيه بُرغيات الضبط من الجانب. صدر العود لوح من التِنّوب أو العرعر بسماكة مليمتر تقوّيه من أسفل عوارض «بالقون»، وفي الصدر ثلاث فتحات مستديرة تُغطّى بزخارف «الغل» أو الكافس. كانت الأوتار السفلية من الأمعاء والأخرى من حرير ملفوف بفضة أو نحاس، والمضراب أولاً من خشب ثم من ريش نسر منذ زرياب."
    en: "The maker builds the bowl from about twenty crescent-shaped wood ribs, sets the short neck in with a wedge and bends the pegbox into an 'S' curve taking the tuning pegs from the side. The soundboard is a spruce or fir board about one millimetre thick, braced beneath by 'balkon' laths, with three round holes covered by carved 'rose' or lattice work. The lower string courses were gut, the others silk wound with silver or copper, and the plectrum was first wood, then eagle feather from Ziryāb's day."
    ur: "ساز ساز جسم کو تقریباً بیس ہلال نما لکڑی کی سلاخوں سے بناتا، چھوٹی گردن کو گٹکی سے جوڑتا اور بُرگلوک کو S خط میں موڑ کر پہیے سائیڈ سے لگاتا ہے۔ صدائی تختہ تنو یا صنوبر کی تقریباً ایک ملی میٹر تختی ہے جسے نیچے «بالقون» سلاخیں سنبھالتی ہیں اور تین گول سوراخ گل یا جالی کے تراشوں سے بند ہوتے۔ نچلی ڈوریں آنت کی، باقی ریشم پر چاندی یا تانبے کی لپٹی ہوتی، اور مضراب پہلے لکڑی کا پھر زریاب کے زمانے سے عقابی پنکھ کا۔"
