summary:
  ar: "الشاه لقب الحاكم الفارسي الذي ورد الإسلام مع البويهيين والسلاجقة؛ من أصل سنسكريتي في «الحكم» مرّ بالأخمينيين الذين لقّبوا ملوكهم «شاهنشاه» ملك الملوك، ثم الساسانيين الذين جعلوا الشاه ظلّ الله على الأرض ومنعوا ذوي العاهات من رؤيته، ودخل الإسلام حين تلقّب عضد الدولة البويهي شاهنشاه في الخطبة والسكة، وأحياه الصفويون لقباً لحكّام إيران ثم القاجاريون."
  en: "Shah was the Persian ruler's title that entered Islam with the Buyids and Seljuks; from a Sanskrit root meaning 'to rule' it passed through the Achaemenids, who styled their kings 'shahanshah' — king of kings — and the Sasanians, who made the shah God's shadow on earth and barred the deformed from his sight, entering Islam when the Buyid Adud al-Dawla first bore shahanshah in khutba and coinage, then revived by the Safavids as the title of Iran's rulers and kept by the Qajars."
  ur: "شاہ فارسی حکمرانوں کا لقب تھا جو بوئیوں اور سلجوقیوں کے ساتھ اسلامی دنیا میں آیا؛ 'حکمرانی' کے سنسکرت مادہ سے ہخامنشیوں تک پہنچا جنھوں نے اپنے بادشاہوں کو 'شہنشاہ' یعنی بادشاہوں کا بادشاہ کہا، ساسانیوں نے شاہ کو زمین پر خدا کا سایہ ٹھہرایا اور معذوروں کو اس کا دیدار حرام کیا، اسلام میں اس وقت داخل ہوا جب بوئی عضد الدولہ نے پہلی بار خطبہ اور سِکّے میں شہنشاہ لکھوایا، پھر صفویوں نے ایرانی حکمرانوں کے لیے دوبارہ زندہ کیا اور قاجاروں نے قائم رکھا۔"
  es: "Shah era el título del gobernante persa que entró en el Islam con los Buyíes y los Selyúcidas; de una raíz sánscrita que significa \"gobernar\", pasó por los Aqueménidas, que denominaban a sus reyes \"shahanshah\" —rey de reyes— y los Sasánidas, que hicieron del shah la sombra de Dios en la tierra y prohibieron a los deformes su vista, entrando en el Islam cuando el Buyí Adud al-Dawla fue el primero en usar el título de shahanshah en la jutba y en las monedas, luego revivido por los Safávidas como el título de los gobernantes de Irán y mantenido por los Qajar."
  fr: "Le titre de Shah, porté par le souverain perse, entra dans l'islam avec les Bouyides et les Seldjoukides; issu d'une racine sanskrite signifiant « régner », il passa par les Achéménides, qui appelaient leurs rois « shahanshah » — roi des rois —, et les Sassanides, qui firent du shah l'ombre de Dieu sur terre et soustrayaient les difformes à sa vue. Ce titre entra dans l'islam lorsque le Bouyide Adud al-Dawla l'utilisa pour la première fois dans ses sermons et sur les pièces de monnaie, puis fut repris par les Safavides comme titre des souverains iraniens et conservé par les Qajars."
  tr: "Şah, Büveyhiler ve Selçuklularla birlikte İslam'a giren Pers hükümdarının unvanıdır; Sanskritçe kökenli olup \"yönetim\" anlamına gelir ve Ahamenişler döneminde krallarına \"Şahanshah\" (Kralların Kralı) diyenlerden, daha sonra Şah'ı yeryüzünde Tanrı'nın gölgesi olarak gören ve engellilerin onu görmesini engelleyen Sasaniler'e kadar uzanmıştır. Adud al-Dawla al-Buyid'in vaazlarında ve sikkelerinde Şahanshah unvanını benimsemesiyle İslam'a girmiş, Safeviler tarafından İran hükümdarları için bir unvan olarak yeniden canlandırılmış ve daha sonra Kaçarlar döneminde de kullanılmaya devam etmiştir."
  id: "Shah adalah gelar penguasa Persia yang masuk ke dalam Islam bersama Dinasti Buyid dan Seljuk; gelar ini berasal dari bahasa Sanskerta yang berarti \"pemerintahan\" dan diteruskan melalui Dinasti Akhemenid yang menyebut raja-raja mereka \"Shahanshah\" (Raja Diraja), kemudian Dinasti Sasanid yang menjadikan Shah sebagai bayangan Tuhan di bumi dan mencegah penyandang disabilitas untuk melihatnya, dan masuk ke dalam Islam ketika Adud al-Dawla al-Buyid mengadopsi gelar Shahanshah dalam khutbah dan pada mata uang, dan Dinasti Safawi menghidupkannya kembali sebagai gelar untuk penguasa Iran, kemudian Dinasti Qajar."
