summary:
  ar: "الحجّار هو من يقطع الحجر من المقالع ويهذّبه للبناء وينقش فيه والرخام. يقرن ابن الأخوة البنّائين بحرّاقي الجير وصنّاع الجبس فيحلفهم ألا يقبلوا رشوة على جير غير ناضج أو رديء. وفي موكب إسطنبول يسير قاطعو الحجارة ⁦(تاش كرسن)⁩ ألف رجل وساحبو الحجارة ⁦(تاش كشان)⁩ ألف من الأرمن سائقي الحمير، ويمرّ عمال الرخام ⁦(مرمربران)⁩ مئة وواحد وستون رجلاً ينقشون الساعات والنقوش على الرخام ويصنعون العمائم والأعمدة للقبور، ومعهم قطّاع حجر المسنّ مئة وواحد وخمسون. ويسبق الموكب في طليعة الجيش حفّارو الألغام وقاطعو الحجارة المسلّحون الذين يمهّدون الأرض وينسفون الأسوار. وفي قاهرة القرن التاسع عشر وقّع نقّاشو الحجر القاهريون عرائض على شيوخ طائفتهم لما كانوا يقتطعونه من أجورهم."
  en: "The hajjar cut stone at the quarry, dressed it for building and carved inscriptions in it and in marble. Ibn al-Ukhuwwa binds the masons with the lime-burners and gypsum-makers by an oath not to take bribes over underburnt or poor lime. In Evliya's procession the stone-cutters (Tash-kersen) march a thousand strong and the stone-draggers (Tash-keshan) a thousand Armenian ass-drivers; the marble workmen (Mermerberan), a hundred and sixty-one men, cut chronograms and inscriptions in marble and make turbans and pillars for tombs, and with them are a hundred and fifty-one whetstone-cutters. Ahead of the procession march the armed miners and stonecutters of the army's van, who level the ground and blow up walls. In nineteenth-century Cairo the stone masons petitioned against the shaykhs of their guild for the shares cut from their wages."
  ur: "حجّار کانوں سے پتھر کاٹ کر تعمیر کے لیے تراشتا اور اس میں اور سنگ مرمر میں کندہ کاری کرتا تھا۔ ابن الاخوہ مستریوں کو چونا بھٹھے والوں اور گچ سازوں کے ساتھ قسم باندھتا ہے کہ وہ ادھورے یا خراب چونے پر رشوت نہ لیں۔ اولیاء چلبی کے جلوس میں سنگ تراش ⁦(تاش کرسن)⁩ ایک ہزار اور پتھر گھسیٹنے والے ⁦(تاش کشان)⁩ ایک ہزار آرمینی گدھا چلا ئے ہوئے چلتے ہیں؛ سنگ مرمر کے کاریگر ⁦(مرمربران)⁩ ایک سو اکسٹھ آدمی سنگ مرمر پر کتبے اور نقش تراشتے اور قبروں کے لیے پگڑی اور ستون بناتے ہیں، اور ان کے ساتھ ایک سو اکیاون ساں کے پتھر کاٹنے والے ہیں۔ جلوس سے پہلے فوج کی پیش دستے کے مسلح کان کن اور سنگ تراش چلتے ہیں جو زمین برابر اور دیواریں اڑاتے ہیں۔ انیسویں صدی کے قاہرہ میں سنگ تراشوں نے اپنی انجمن کے شیخوں کی طرف سے اجرت میں سے کٹتی کے خلاف عرضیاں دیں۔"
