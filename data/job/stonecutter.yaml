craft:
  materials: [stone, marble]
  techniques:
    ar: "يأمر ابن الأخوة أن يستعمل العامل الزوايا والأثقال والخيوط ليقوم البناء مستوياً بلا ميل وإلا ضمن الخلل، وأن يحلف البنّاءون ألا يقبلوا من حرّاقي الجير وصنّاع الجبس رشوة أو هدية ليسكتوا عن الجير غير الناضج أو الرديء. ويصف إوليا ساحبي الحجارة وهم أرمن سائقو حمير يجذبون أحمالهم وينادون بعضهم بعضاً، وعمال الرخام يقطعون الساعات الشمسية والكتابات على الرخام ويصنعون عمائم وأعمدة لشواهد القبور، وقطّاع حجر المسنّ يمرّون بعربات محمّلة به. وفي قاهرة شالكرافت كان الحجر والرخام المستورد ثاني أكبر الواردات في الستينيات والسبعينيات وحوّله البنّاءون المصريون، وتعلّم بنّاؤو المدينة نحت الحجر ورصف الرخام على الطراز الأوروبي."
    en: "Ibn al-Ukhuwwa orders that the workman use angles, weights and lines so the building stands true, being liable for any fault, and that the masons swear not to take bribes or gifts from the lime-burners and gypsum-makers for their acquiescence when the lime is underburnt or bad. Evliya describes the stone-draggers, Armenian ass-drivers who drag their loads crying out to each other, the marble workmen who cut chronograms and inscriptions in marble and make turbans and pillars for funeral monuments, and the whetstone-cutters who pass with wagons full of whetstone. In Chalcraft's Cairo imported stone and marble was the second largest category of imports in the 1860s and 1870s and was transformed by Egyptian masons, who also picked up stone sculpting and marble paving in European styles."
    ur: "ابن الاخوہ کا حکم ہے کہ مزدور زاویہ، وزن اور ڈور استعمال کرے کہ عمارت سیدھی کھڑی ہو ورنہ نقص کی ذمہ داری اس پر ہے، اور مستری قسم کھائیں کہ وہ چونا بھٹھے والوں اور گچ سازوں سے ادھورے یا خراب چونے پر خاموشی کے عوض رشوت یا تحفہ نہ لیں۔ اولیہ چلبی پتھر گھسیٹنے والوں کی صورت کھینچتا ہے جو آرمینی گدھا چلا آدمی ہیں، اپنی بوجھ گھسیٹتے ایک دوسرے کو پکارتے ہیں، سنگ مرمر کے کاریگر سنگ مرمر پر کتبے اور نقش تراشتے اور قبروں کے لیے پگڑی اور ستون بناتے ہیں، اور ساں کاٹنے والے ساں بھرے ریڑھے لے چلتے ہیں۔ چالکرافٹ کے قاہرہ میں ساٹھ اور ستر کی دہائی میں درآمد شدہ پتھر اور سنگ مرمر درآمدات کا دوسرا بڑا خانہ تھا جسے مصری مستریوں نے تراشا، اور انہوں نے یورپی طرز پر سنگ تراشی اور سنگ مرمر کی فرش سازی بھی سیکھی۔"
