summary:
  ar: "العاشق شاعرُ سازٍ يعزف ويغنّي شعره أو شعر غيره ويروي الحكايات الشعبية. دخل الاسم الأدب التركي في القرن الخامس عشر، وكان قبله لقبَ شعراء التكايا بمعنى «عاشق الحق» كما عند يونس إمره، ثم صار منذ القرن السابع عشر اسم شعراء الساز المدنيّين. كان العاشق يدور البلاد بسازه، يقف في القرى والمدائن، يبارز أقرانه بالارتجال ويشارك في الفصول التي يديرها رئيس العاشقان، ولا يُصنع عاشقاً كاملاً إلا بسنين من الصحبة لدى أستاذ يعلّمه الشعر والموسيقى والحكاية وحسن العزف ثم يمنحه المخلّص الذي يختم صنعته."
  en: "The âşık is the saz poet who plays and sings his own or others' verse and tells the folk tales. The name entered Turkish literature in the fifteenth century, earlier a title of the tekke poets in the sense of 'God's lover' as with Yunus Emre, then from the seventeenth century the name of the secular saz poets. The âşık wandered the land with his instrument, stopped in villages and towns, duelled his rivals in improvisation and took his place in the fasıls run by the reis-i âşıkan; a finished âşık was made only by years in a master's company, learning poetry, music and tale-telling with good saz playing, until the master granted him the mahlas that sealed the craft."
  ur: "عاشق وہ ساز شاعر ہے جو اپنی یا دوسروں کی شاعری ساز کے ساتھ گاتا اور لوک کہانیاں سناتا ہے۔ یہ نام ترک ادب میں پندرہویں صدی میں آیا؛ پہلے یہ تکئے کے شاعروں کا لقب تھا یعنی «خدا کا عاشق» جیسے یونس امرے کے ہاں، پھر سترہویں صدی سے غیر مذهبی ساز شاعروں کا نام بنا۔ عاشق اپنا ساز اٹھائے دیہات اور قصبوں میں پھرتا، ہم پیشوں سے تلقائی نظم میں مقابلہ کرتا اور رئیسِ عاشقاں کے چلائے فصلوں میں شریک ہوتا؛ مکمل عاشق برسوں استاد کی صحبت سے بنتا، جو اسے شاعری، موسیقی، قصہ گوئی اور اچھا ساز سکھاتا، پھر مخلص عطا کر کے صنعت مہر کرتا۔"
  es: "El âşık es el poeta de saz que toca y canta sus propios versos o los de otros y narra cuentos populares. El nombre entró en la literatura turca en el siglo XV, primero como título de los poetas tekke en el sentido de \"amante de Dios\", como en el caso de Yunus Emre, y luego, a partir del siglo XVII, como nombre de los poetas de saz seculares. El âşık recorría el país con su instrumento, se detenía en pueblos y ciudades, se batía en duelo con sus rivales en improvisación y ocupaba su lugar en los fasıls dirigidos por el reis-i âşıkan; un âşık consumado se formaba solo tras años en compañía de un maestro, aprendiendo poesía, música y narración de cuentos con una buena interpretación del saz, hasta que el maestro le otorgaba el mahlas que sellaba el oficio."
  fr: "L'âşık est le poète de saz qui joue et chante ses propres vers ou ceux d'autres poètes et raconte des contes populaires. Ce terme apparaît dans la littérature turque au XVe siècle; il désignait auparavant les poètes tekke, au sens de « amoureux de Dieu », comme Yunus Emre, puis, à partir du XVIIe siècle, les poètes de saz profanes. L'âşık parcourait le pays avec son instrument, s'arrêtant dans les villages et les villes, se mesurant à ses rivaux en improvisation et prenant place dans les fasıls dirigés par le reis-i âşıkan. Un âşık accompli ne pouvait l'être qu'après des années passées auprès d'un maître, apprenant la poésie, la musique et l'art du conte tout en perfectionnant son jeu de saz, jusqu'à ce que le maître lui accorde le mahlas, scellant ainsi son art."
  tr: "Aşık, kendi şiirlerini veya başkalarının şiirlerini çalan ve söyleyen, halk masalları anlatan bir sazcıdır. Bu terim, daha önce Yunus Emre'nin eserlerinde olduğu gibi \"hakikat aşığı\" anlamına gelen bir Sufi tekke şairleri unvanı olarak kullanıldıktan sonra, on beşinci yüzyılda Türk edebiyatına girmiştir. On yedinci yüzyıldan itibaren ise şehirli sazcılar için kullanılan bir isim haline gelmiştir. Aşık, sazı ile birlikte köylerde ve şehirlerde dolaşarak, meslektaşlarıyla doğaçlama düellolar yapar ve aşıkhanenin başı tarafından yönetilen gösterilere katılırdı. Tam bir aşık, ancak kendisine şiir, müzik, hikaye anlatımı ve ustaca çalmayı öğreten ve daha sonra ona \"kurtarıcı\" unvanını veren bir ustayla yıllarca süren birliktelikten sonra oluşurdu."
  id: "'Ashiq adalah pemain saz yang memainkan dan menyanyikan puisi ciptaannya sendiri atau puisi orang lain, serta menceritakan kisah-kisah rakyat. Istilah ini masuk ke dalam sastra Turki pada abad ke-15, sebelumnya merupakan gelar bagi penyair perkumpulan Sufi, yang berarti \"pencinta kebenaran,\" seperti dalam karya Yunus Emre. Sejak abad ke-17 dan seterusnya, istilah ini menjadi sebutan untuk pemain saz perkotaan. 'Ashiq akan berkeliling negeri dengan saz-nya, tampil di desa-desa dan kota-kota, terlibat dalam duel improvisasi dengan rekan-rekannya, dan berpartisipasi dalam pertunjukan yang dipimpin oleh kepala 'ashiqan. Seorang 'ashiq yang sempurna baru bisa menjadi mahir setelah bertahun-tahun berlatih dengan seorang guru yang mengajarkan puisi, musik, bercerita, dan bermain saz dengan terampil, dan kemudian menganugerahinya gelar \"penyelamat,\" yang mengukuhkan keahliannya."
