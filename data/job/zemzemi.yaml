summary:
  ar: "الزمزمي خادم بئر زمزم وساقي حجاجها: استمراراً من سقاية عبد المطلب التي جمعت رعاية البئر إلى سقاية الحجاج وإطعامهم، صار الموظف المختص بشؤونها قرب البئر منذ فتح مكة، ولمّا عجز موظف واحد عن حاجة الحجاج أُقيم السقاء في أنحاء المسجد الحرام — في العهد العثماني سقاء لكل ولاية لحجيجها ورئيسهم غالباً من آل الزبير — وكان أربعون مستقياً من العرب بأيدٍ وأقدام مخضوبة بالحناء يتناوبون أربعة أربعة على البكرات والدلاء الحديدية كما رآهم أوليا جلبي، ويخزَّن الماء في الأحواض والخزانات ثم توزَّع منها الحجاج في مكة ومنى وعرفات، وسُمّيت رسائل هداياهم «الزوراق». وفي عصرنا زال مبنى البئر من الرواق وصارت السبّلات المبرّدة توزعها، وكثر عدد الزمزميين ليبلغوا الماء للحجاج حيثما كانوا."
  en: "The zemzemî served the well of Zemzem and watered its pilgrims: continuing Abd al-Muttalib's sikâye that joined the well's care to watering and feeding the pilgrims, a dedicated officer worked beside the well from soon after the conquest of Mecca, and when one officer could no longer suffice, sakas were posted around the mosque — in Ottoman times a saka for every province's pilgrims, their headman usually from the Al-i Zubayr — while forty henna-stained Arab water-drawers worked the iron pulleys and forked buckets in shifts of four, as Evliya saw. The water went into open basins, later closed reservoirs and pumps, then cooled sebils, and the zemzemîs' numbers grew so the water reached the pilgrims at Mecca, Mina and Arafat; the letters listing gifts sent to these water-distributing officials were called zevrak."
  ur: "زمزمی چاہِ زمزم کا خادم اور حاجیوں کا پانی پلانے والا ہے: عبدالمطلب کی سقایت سے جس نے چاہ کی دیکھ بھال کو حاجیوں کے پانی اور کھانے سے جوڑا، فتح مکہ کے فوراً بعد سے چاہ کے قریب مخصوص افسر کام کرتا، اور جب ایک افسر ناکافی ہوا تو مسجد کے گرد سقے رکھے گئے — عثمانی دور میں ہر صوبے کے حاجیوں کے لیے ایک سقہ، ان کا سردار عموماً آل زبیر سے — اور چالیس حنا رنگے عرب پانی کشید کرنے والے لوہے کی چرخیوں اور کانٹے دار بالٹیوں سے چار چار کے نوبت میں کام کرتے، جیسا کہ اولیاء چلبی نے دیکھا۔ پانی کھلے حوضوں، پھر بند ٹینکیوں اور پمپ، پھر ٹھنڈے سبیلوں سے پہنچتا، اور زمزمیوں کی تعداد بڑھائی گئی تاکہ مکہ، منا اور عرفات میں حاجیوں تک پانی پہنچے؛ ان پانی بانٹنے والوں کو بھیجی ہوئی تحائف کی فہرست والے خطوط «زوراق» کہلاتے۔"
  es: "El zemzemî servía al pozo de Zemzem y abastecía de agua a sus peregrinos: siguiendo la tradición de Abd al-Muttalib, que combinaba el cuidado del pozo con el suministro de agua y la alimentación de los peregrinos, un oficial dedicado trabajaba junto al pozo desde poco después de la conquista de La Meca, y cuando un solo oficial ya no era suficiente, se colocaban sakas alrededor de la mezquita —en la época otomana, un saka para los peregrinos de cada provincia, cuyo jefe solía ser del Al-i Zubayr— mientras cuarenta aguadores árabes, con la piel teñida de henna, manejaban las poleas de hierro y los cubos bifurcados en turnos de cuatro, como vio Evliya. El agua iba a parar a las pilas abiertas, luego a depósitos cerrados y bombas, después a los sebils refrigerados, y el número de zemzemîs creció de modo que el agua llegaba a los peregrinos de La Meca, Mina y Arafat; las cartas que enumeraban los regalos enviados a estos funcionarios distribuidores de agua se llamaban zevrak."
