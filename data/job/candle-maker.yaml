  techniques:
    ar: "يذكر الشيزري طرق غشّ الشمع: خلطه بشحم المعز وبالصمغ، ورشّ دقيق الفول أو الرمل الرخو أو الكحل المسحوق فيه وهو يُشكَّل، ثم يُحشى به قلب الشمعة ويُغلَّف بشمع خالص؛ والكشف أن تُوقد الشمعة فيُرى داخلها. ويصف إوليا معمل الشمع السلطاني داخل باب أودون ومئة رجل يصنعون شموع السلطان والوزراء، وأن كل شمعة تُصنع في المعمل السلطاني يجب أن تُختم بختم مفتش الشمعخانه، وأن من غشّ بحشو الشمعة من داخل بالشحم أو القار عوقب عقاباً شديداً."
    en: "Al-Shayzari lists the wax adulterations: mixing it with goat's tallow and with rosin, sprinkling bean flour, soft sand or ground kohl into it as it is shaped, then packing it inside the candle and covering it with pure wax; the test is to light the candle and see the inside. Evliya describes the imperial wax-factory inside the Odun gate whose hundred men make the Sultan's and vezirs' candles, the rule that every candle made at the imperial fabric must bear the wax-inspector's seal, and the severe punishment for cheating by filling the interior with tallow or tar."
    ur: "الشیزری موم میں میلاوٹ کے طریقے گنواتا ہے: بکری کی چربی اور رال ملانا، ڈھالتے وقت لوبیا کا آٹا، نرم ریت یا پسا سرمہ بچھانا، پھر اسے بتی کے اندر بھر کر اوپر خالص موم چڑھانا؛ جانچ یہ ہے کہ بتی جلا کر اندر دیکھا جائے۔ اولیاء شاہی موم کارخانے کو بتاتا ہے جو ادون دروازے کے اندر تھا اور جس کے سو آدمی سلطان اور وزیروں کی بتلیاں بناتے تھے، یہ ضابطہ کہ شاہی کارخانے کی ہر بتی پر موم کے ناظر کی مہر ضروری ہے، اور بتی کے اندر چربی یا قطران بھرنے والے دھوکہ باز کو سخت سزا۔"
