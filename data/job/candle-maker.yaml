summary:
  ar: "الشمّاع هو من يصنع الشموع من شمع العسل أو الشحم. يحذّر الشيزري في باب العطّارين من غشّ الشمع بشحم المعز والصمغ، وأن يرشّوا فيه وهو يُشكَّل دقيق الفول أو الرمل الرخو أو الكحل المسحوق ثم يُجعل داخل الشمعة ويُغلَّف بالشمع الخالص، وكشف ذلك أن تُوقد الشمعة فيُنظر داخلها. وفي إسطنبول إوليا جلبي لشمّاعي الشحم خمسة آلاف وخمسمئة رجل، ولشمّاعي الشمع معمل سلطاني واحد داخل باب أودون بأغا ومفتش ومئة رجل يصنعون كل شموع السلطان والوزراء، ولا تصحّ شمعة من معمل الدولة إلا بختم مفتش الشمعخانه."
  en: "The shamma' made candles of beeswax or tallow. In his apothecaries' chapter al-Shayzari warns that wax is adulterated with goat's tallow and rosin, and that bean flour, soft sand or ground kohl is sprinkled into it as it is shaped and then hidden inside the candle under pure wax — discovered by lighting the candle and looking inside. In Evliya's Istanbul the tallow-chandlers numbered five thousand five hundred men, while the wax-chandlers kept a single imperial establishment inside the Odun gate under an agha and an inspector whose hundred men made all the candles for the Sultan and the vezirs, and no imperial-factory candle was valid without the wax-inspector's seal."
  ur: "شماع موم یا چربی کی بتلیاں بناتا تھا۔ الشیزری عطاروں کے باب میں خبردار کرتا ہے کہ موم میں بکری کی چربی اور رال ملائی جاتی ہے اور ڈھالتے وقت اس میں لوبیا کا آٹا، نرم ریت یا پسا سرمہ بچھا کر اندر چھپا دیا جاتا ہے اور اوپر خالص موم چڑھا دیا جاتا ہے — اس کا پتہ بتی جلا کر اندر دیکھنے سے چلتا ہے۔ اولیاء چلبی کے استنبول میں چربی کے موم بتی ساز ساڑھے پانچ ہزار تھے، جبکہ موم کے شماعوں کا ایک شاہی ادارہ ادون دروازے کے اندر آغا اور ناظر کے ماتحت تھا جس کے سو آدمی سلطان اور وزیروں کی ساری بتلیاں بناتے تھے، اور شاہی کارخانے کی کوئی بتی موم کے ناظر کی مہر کے بغیر معتبر نہ تھی۔"
