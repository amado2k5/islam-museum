summary:
  ar: "الشمّاع هو من يصنع الشموع من شمع العسل أو الشحم. يحذّر الشيزري في باب العطّارين من غشّ الشمع بشحم المعز والصمغ، وأن يرشّوا فيه وهو يُشكَّل دقيق الفول أو الرمل الرخو أو الكحل المسحوق ثم يُجعل داخل الشمعة ويُغلَّف بالشمع الخالص، وكشف ذلك أن تُوقد الشمعة فيُنظر داخلها. وفي إسطنبول إوليا جلبي لشمّاعي الشحم خمسة آلاف وخمسمئة رجل، ولشمّاعي الشمع معمل سلطاني واحد داخل باب أودون بأغا ومفتش ومئة رجل يصنعون كل شموع السلطان والوزراء، ولا تصحّ شمعة من معمل الدولة إلا بختم مفتش الشمعخانه."
  en: "The shamma' made candles of beeswax or tallow. In his apothecaries' chapter al-Shayzari warns that wax is adulterated with goat's tallow and rosin, and that bean flour, soft sand or ground kohl is sprinkled into it as it is shaped and then hidden inside the candle under pure wax — discovered by lighting the candle and looking inside. In Evliya's Istanbul the tallow-chandlers numbered five thousand five hundred men, while the wax-chandlers kept a single imperial establishment inside the Odun gate under an agha and an inspector whose hundred men made all the candles for the Sultan and the vezirs, and no imperial-factory candle was valid without the wax-inspector's seal."
  ur: "شماع موم یا چربی کی بتلیاں بناتا تھا۔ الشیزری عطاروں کے باب میں خبردار کرتا ہے کہ موم میں بکری کی چربی اور رال ملائی جاتی ہے اور ڈھالتے وقت اس میں لوبیا کا آٹا، نرم ریت یا پسا سرمہ بچھا کر اندر چھپا دیا جاتا ہے اور اوپر خالص موم چڑھا دیا جاتا ہے — اس کا پتہ بتی جلا کر اندر دیکھنے سے چلتا ہے۔ اولیاء چلبی کے استنبول میں چربی کے موم بتی ساز ساڑھے پانچ ہزار تھے، جبکہ موم کے شماعوں کا ایک شاہی ادارہ ادون دروازے کے اندر آغا اور ناظر کے ماتحت تھا جس کے سو آدمی سلطان اور وزیروں کی ساری بتلیاں بناتے تھے، اور شاہی کارخانے کی کوئی بتی موم کے ناظر کی مہر کے بغیر معتبر نہ تھی۔"
  es: "Los shamma' fabricaban velas de cera de abeja o sebo. En su capítulo sobre boticarios, al-Shayzari advierte que la cera se adultera con sebo de cabra y colofonia, y que se le añade harina de habas, arena fina o kohl molido mientras se le da forma, para luego esconderla dentro de la vela bajo cera pura, lo cual se descubre encendiendo la vela y mirando dentro. En el Estambul de Evliya, los fabricantes de velas de sebo eran cinco mil quinientos hombres, mientras que los fabricantes de velas de cera mantenían un único establecimiento imperial dentro de la puerta de Odun bajo la dirección de un agha y un inspector cuyos cien hombres fabricaban todas las velas para el sultán y los vezirs, y ninguna vela de la fábrica imperial era válida sin el sello del inspector de cera."
  fr: "Les shamma' fabriquaient des bougies en cire d'abeille ou en suif. Dans son chapitre consacré aux apothicaires, al-Shayzari met en garde contre la falsification de la cire avec du suif de chèvre et de la colophane. De la farine de haricots, du sable fin ou du khôl en poudre y sont incorporés lors du façonnage, puis dissimulés sous de la cire pure – on les découvrait en allumant la bougie et en regardant à l'intérieur. À Istanbul, sous le règne d'Evliya, les fabricants de bougies en suif étaient au nombre de cinq mille cinq cents, tandis que les fabricants de bougies en cire disposaient d'un unique atelier impérial à l'intérieur de la porte d'Odun, sous la direction d'un agha et d'un inspecteur. Leurs cent hommes fabriquaient toutes les bougies pour le sultan et les vizirs, et aucune bougie de l'atelier impérial n'était valable sans le sceau de l'inspecteur de la cire."
  tr: "Mumcu, balmumundan veya don yağından mum yapan kişidir. Şeyzari, parfümcüler hakkındaki bölümünde, balmumunun keçi yağı ve zamk ile karıştırılmasına ve kalıplanırken fasulye unu, yumuşak kum veya toz sürme ile serpilmesine karşı uyarıda bulunur. Bu katkı maddesi daha sonra mumun içine yerleştirilir ve saf balmumu ile kapatılır. Katkı maddesinin varlığı, mumu yakıp içine bakarak anlaşılır. İstanbul'da Evliya Çelebi'nin beş bin beş yüz don yağı mumcusu vardı ve Odun Ağa Kapısı'nda, bir müfettiş ve yüz adamdan oluşan, sultan ve bakanlar için tüm mumları yapan bir kraliyet mum atölyesi bulunuyordu. Devlet atölyesinden çıkan hiçbir mum, mumcu müfettişinin mührü olmadan geçerli sayılmazdı."
  id: "Seorang pembuat lilin adalah seseorang yang membuat lilin dari lilin lebah atau lemak hewan. Al-Shayzari, dalam babnya tentang pembuat parfum, memperingatkan agar tidak mencampur lilin dengan lemak kambing dan getah, serta tidak menaburinya dengan tepung kacang, pasir halus, atau bubuk kohl saat sedang dibentuk. Campuran ini kemudian ditempatkan di dalam lilin dan disegel dengan lilin murni. Bukti pemalsuan terungkap dengan menyalakan lilin dan melihat ke dalamnya. Di Istanbul, Evliya Çelebi memiliki lima ribu lima ratus pembuat lilin lemak hewan, dan ada satu bengkel pembuat lilin kerajaan di dalam Gerbang Odun Agha, yang dikelola oleh seorang inspektur dan seratus orang yang membuat semua lilin untuk sultan dan para menteri. Tidak ada lilin dari bengkel negara yang dianggap sah tanpa segel inspektur pembuat lilin."
