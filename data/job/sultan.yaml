summary:
  ar: "السلطان لقب الحكّام المسلمين منذ القرن الخامس الهجري؛ كان أصل الكلمة اسماً مجرداً للسلطة، ويقال إن هارون الرشيد أول من أعطاها لقباً سياسياً لوزيره جعفر البرمكي، ثم عمّت مع غزنوي محمود وثبتت على النقود مع طغرل بك السلجوقي سنة ٤٣٥هـ، ومنها انتشرت في الأيوبيين والمماليك والإيلخانيين والعثمانيين."
  en: "Sultan was the standard title of Muslim rulers from the fifth/eleventh century; the word began as an abstract noun for power, Harun al-Rashid is said first to have bestowed it as a political title on his vizier Ja'far al-Barmaki, it spread with Mahmud of Ghazna, and was fixed on coinage with Tughril Beg in 435/1043-44, whence it passed to the Ayyubids, Mamluks, Ilkhanids and Ottomans."
  ur: "سلطان پانچویں ہجری صدی سے مسلم حکمرانوں کا معیاری لقب بنا؛ اصل میں یہ قوت و اختیار کے لیے محض اصطلاح تھی، ہارون الرشید نے پہلی بار اسے اپنے وزیر جعفر برمکی کو سیاسی لقب کے طور پر دیا، محمود غزنوی کے ساتھ پھیلا اور 435ھ میں طغرل بیگ کے سِکّوں پر ثبت ہوا، پھر ایوبیوں، مملوکوں، ایلخانیوں اور عثمانیوں میں رائج ہوا۔"
