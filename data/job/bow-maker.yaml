summary:
  ar: "القوّاس صانع القوس، وأشرف ما صنعه القوس المركّب: قلب من خشب مقسّم يحمل قرن الجاموس في البطن الذي يواجه الرامي ووتر الوتر الممشوط في الظهر، وبتوازن الثلاثة تنثني القوس انحناء الرجوع ⁦(الرفلِكس)⁩ بلا كسر. يكتب لاثام وباترسن أن الرماية عند أهل المشرق فريضة دينية وماركة المحارب الكامل، حتى سُجّل تتلمذ أبناء السلاطين العثمانيين عند القوّاسين وصنع السلطان محمد الثالث خواتم الإبهام بيده؛ وفي إسطنبول إوليا للقوّاسين ⁦(يائيجيان)⁩ خمسمئة رجل بمئتي دكان بيرهم محمد الأكبر بن أبي بكر الذي قلّده عليّ، ودكاكينهم عند سلطان بايزيد وضريح مراد باشا وغلطة وأسكدار، وكان السلطان بايزيد نفسه قوّاساً؛ وبجوارهم صنّاع النبل ⁦(أُقجي)⁩ ثلاثمئة بمئتي دكان بيرهم أبو محمد بن عمران القوّاس الذي كان يحمل قوس النبي ونبله، وصنّاع قسّي الجرخ ⁦(زنبركجيان)⁩ ثمانون بعشر دكاكين."
  en: "The qawwas made the bow, and the finest of his work was the composite bow: a core of spliced wood carrying water-buffalo horn on the belly that faces the archer and combed sinew on the back, the balance of the three letting the bow bend reflex without breaking. Latham and Paterson write that in the Muslim East archery was a religious duty and the mark of the accomplished warrior, so that the sons of Ottoman sultans are recorded as apprenticed to bowyers and Sultan Mehmet III himself fashioned thumb-rings. In Evliya's Istanbul the bow-makers (Yaijian) were five hundred men in two hundred shops under their patron Muhammad al-Akbar son of Abu Bakr, who was girded by Ali; their shops stood at Sultan Bayazid, at the monument of Murad Pasha, at Galata and Scutari, and Sultan Bayazid himself was a bow-maker; beside them marched the arrow-makers (Okji), three hundred men in two hundred shops, whose patron Abu Muhammad Ibn Umran al-Qawwas had charge of the Prophet's bow and arrows, and the crossbow-makers (Zenberekjian), eighty men in ten shops."
  ur: "قوّاس کمان بنانے والا ہے، اور اس کا نفیس ترین کام مرکب کمان ہے: ٹکڑوں میں جوڑی لکڑی کا مرکز جس کی اندرونی سطح — رانی والے پیٹ — پر مہیش کا سینگ اور باہر کی پشت پر کنگھی کی ہوئی پائے کی تہ ہوتی، تینوں کا توازن کمان کو ریفلکس میں مڑنے دیتا بغیر ٹوٹے۔ لاتھم اور پیٹرسن لکھتے ہیں کہ مشرقِ اسلام میں تیر اندازی دینی فرض اور کامل جنگجو کی نشانی تھی، یہاں تک کہ عثمانی سلطانوں کے بیٹوں کو کمان سازوں کے ہاں شاگرد لکھا گیا اور سلطان محمد سوم خود انگوٹھے کی زِہ بناتا۔ اولیاء کے استنبول میں کمان ساز ⁦(یایجیان)⁩ پانچ سو آدمی دو سو دکانیں جن کے پیر ابو بکر کے بیٹے محمد اکبر ہیں جنہیں علی نے کمر بند پہنائی؛ ان کی دکانیں سلطان بایزید، مراد پاشا کے مقبرے، غلطہ اور اسکدار میں تھیں اور خود سلطان بایزید بھی کمان ساز تھا؛ ان کے ساتھ تیر ساز ⁦(اوقجی)⁩ تین سو آدمی دو سو دکانیں جن کے پیر ابو محمد بن عمران قوّاس نبی کے کمان و تیر کا حامل تھا، اور جنجرخ ⁦(زنبرکجیان)⁩ اسی آدمی دس دکانیں۔"
  es: "El qawwas fabricaba el arco, y la mejor de sus obras era el arco compuesto: un núcleo de madera empalmada con cuerno de búfalo de agua en la parte inferior que mira al arquero y tendón peinado en la parte posterior, el equilibrio de los tres permitiendo que el arco se doblara por reflejo sin romperse. Latham y Paterson escriben que en el Oriente musulmán el tiro con arco era un deber religioso y la marca del guerrero consumado, de modo que se registra que los hijos de los sultanes otomanos fueron aprendices de arqueros y el propio sultán Mehmet III fabricaba anillos para los pulgares. En el Estambul de Evliya, los fabricantes de arcos (Yaijian) eran quinientos hombres en doscientos talleres bajo su patrón Muhammad al-Akbar hijo de Abu Bakr, quien fue ceñido por Ali; sus talleres estaban en Sultan Bayazid, en el monumento de Murad Pasha, en Galata y Scutari, y el propio sultán Bayazid era fabricante de arcos; Junto a ellos marchaban los fabricantes de flechas (Okji), trescientos hombres en doscientos talleres, cuyo patrón, Abu Muhammad Ibn Umran al-Qawwas, estaba a cargo del arco y las flechas del Profeta, y los fabricantes de ballestas (Zenberekjian), ochenta hombres en diez talleres."
