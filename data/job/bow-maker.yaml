  techniques:
    ar: "يشرح ماكويِن بناء القوس المركّب «جَهار خَم» الهندي من قوس مفكّك: قلب الخشب تسع قطع من خشب شجرة المطر متلاصقة بوصل ذيل السمكة حتى لا يُقطع النسيج، جانب البطن مفلطح ⁦(وعند العثمانيين محدّب)⁩ مخدّد مع القرن ليقوى الصمغ؛ قرن الجاموس الأسود سماكة ربع بوصة يغطي الأطراف المرنة ويرقّ إلى ثلاثة أجزاء من ستة عشر عند القبضة؛ والوتر ⁦(باي)⁩ من وتَر العرقوب للثور، يُكشط ويُجفّف فيُكسر بالمطرقة حتى يتليّن ثم يُمشّط بمشط حديدي حتى يصير كالكتّان الأبيض، أليافه من ثلاث إلى أربع عشرة بوصة، يُفرز بالطول لأن مناطق الانحناء يجب أن تُغطّى بليف واحد، وتُوزن حزم الوتر: أربعة دراهم للقبضة ودرهمان ونصف لكل طرف صلب ⁦(كوشه)⁩ وأربعة لكل ساعدة، مجموعه سبعة عشر درهماً للطبقة الواحدة وقد تبلغ الطبقات ثلاثاً. وعند لاثام وباترسن أساس القوس المركّب أن الخشب قالب الشكل، والقرن يحتمل الضغط في البطن، والوتر المبشور يحتمل الشدّ في الظهر؛ وأن الرامي الماهر يرى في تدريبه عبادة، وقد ظهرت القوس كثيراً في المنمنمات بين أيدي الملوك والأمراء، ولبس ذوو القدر خواتم الإبهام المزخرفة ليُعرفوا بالرماة."
    en: "McEwen explains the composite 'four-curved' bow from a dissected specimen: the wooden core of nine rain-tree pieces joined by fish-tail splices so the grain is never cut across, its belly side flattened (the Ottoman bowyers preferred it arched), and core and horn grooved together for the glue; the black water-buffalo horn a quarter inch thick covering the flexible limbs and thinning to three-sixteenths at the handle; the sinew (pay) taken from the Achilles tendon of an ox, scraped, dried, hammered soft, then dragged through an iron comb to white flax fineness, fibres three to fourteen inches sorted by length because the bending sections must be covered by a single length, the bundles weighed — four dirhams for the handle, two and a half for each rigid gusheh end, four for each limb, seventeen dirhams to a layer and up to three layers. Latham and Paterson give the principle: the wood gives the form, the horn takes compression on the belly, the shredded sinew takes the tension on the back; the skilled archer saw his training as a religious duty, the bow appears constantly in miniatures in the hands of kings and princes, and men of substance wore ornamental thumb-rings to be known as archers."
    ur: "مک ایون کاٹی گئی کمان سے مرکب «چہار خام» کی بناؤٹ بتاتا ہے: لکڑی کا مرکز بارش درخت کی نو ٹکڑیاں مچھلی دم جوڑ سے ملی ہوئیں تاکہ رسا نہ کٹے، پیٹ کی طرف چپٹا ⁦(عثمانی کمان ساز اسے محدب رکھتے)⁩ اور دونوں سطحیں گرہن بنائی ہوئیں تاکہ گوند مضبوط پکڑے؛ مہیش کا سیاہ سینگ چوتھائی انچ موٹا لچکدار بازوؤں پر اور دستے پر تین بٹہ سولہ تک پتلا؛ پائے ⁦(تندن)⁩ بیل کے پنڈلی کے رگ سے، کھرچ کر سکھا کر ہتھوڑے سے نرم، پھر لوہے کے کنگھی سے کھینچ کر سفید سن کی طرح — ریشے تین سے چودہ انچ، لمبائی کے حساب سے چھانٹے جاتے کہ موڑ والی جگہ ایک ہی ریشے سے ڈھکے، گٹھیاں تولی جاتیں: دستے کو چار درہم، ہر سخت سرے ⁦(گوشہ)⁩ کو ڈھائی، ہر بازو کو چار، کل سترہ درہم ایک تہ کا، اور تہیں تین تک ہوسکتی ہیں۔ لاتھم و پیٹرسن اصول بتاتے ہیں: لکڑی شکل دیتی، سینگ پیٹ پر دباؤ سہتا، کٹی پائے پشت پر کھچاؤ سہتی؛ ماہر تیر انداز اپنی مشق کو دینی فرض سمجھتا، مصوریاں کمان کو بادشاہوں اور امیروں کے ہاتھ میں دکھاتی ہیں، اور بڑے لوگ آرائشی انگوٹھے کی زِہ پہن کر خود کو کمان دار کہلواتے تھے۔"
