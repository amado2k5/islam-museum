  techniques:
    ar: "يصف كريستي صنعة الأسطرلابي: آلة يونانية الأصل أكملها بطلميوس الإسكندري وأتمّها المسلمون، وصلت أوروبا في القرن العاشر، وغرضها الأول في الشرق تعيين وقت الصلاة وقبلة مكة، ثم خدمت البحّارة حتى القرن السابع عشر. والأسطرلاب النفيس عمل فني مصنوع ومقوّس بدقة ومهارة عجيبة في شكل بقي قروناً بلا تغيير يذكر. وأقدم أسطرلاب مؤرّخ معروف صنعه أحمد ومحمود ابنا إبراهيم الأسطرلابي بأصفهان سنة 984، وصنع إبراهيم بن سعيد بطليطلة أسطرلاباً بإشرافه سنة 1066-1067، وصنع عبد الحميد الفارسي أسطرلاباً مزخرفاً سنة 1715. وعند كارا دو فو: الفزاري أول صانع مسلم للأسطرلاب، والزرقالي صانع الآلات المشهور مخترع الصفيحة وصاحب رسالتها التي ترجمها ملك ألفونسو مرتين إلى الإسبانية ونشر ريجيومونتانوس مسائل «الآلة النبيلة» عنها."
    en: "Christie describes the astrolabist's craft: an instrument of Greek invention perfected by the Muslims, reaching Europe in the tenth century; its principal use in the East was to fix the hour of prayer and the direction of Mecca, and it served mariners until the seventeenth century. A fine astrolabe is a beautiful work of art, made and engraved with amazing care and skill in a form that persisted for centuries without material change. The earliest dated example known was made by Ahmad and Mahmud, sons of Ibrahim the astrolabist of Isfahan, in 984; Ibrahim ibn Sa'id superintended a Toledo astrolabe in 1066-7; the Persian master 'Abd al-Hamid made a delicately ornamented one in 1715. Carra de Vaux adds al-Fazari, the first Muslim astrolabe-maker, and al-Zarqali, the famous instrument-maker who invented the safiha and wrote the treatise that King Alfonso twice translated into Romance and for which Regiomontanus later published problems on the 'noble instrument'."
    ur: "کرسٹی اسطرلابی کی صنعت بیان کرتا ہے: یونانی ایجاد جسے مسلمانوں نے تکمیل دی، دسویں صدی میں یورپ پہنچی؛ مشرق میں اس کا بنیادی کام نماز کے وقت اور قبلۂ مکہ کا تعین تھا، اور ملاحوں کے کام سترہویں صدی تک آئی۔ نفیس اسطرلاب ایک خوبصورت فنی کام ہے، حیرت انگیز احتیاط اور مہارت سے بنائی اور تراشی گئی شکل میں جو صدیوں بغیر بنیادی تبدیلی رہی۔ قدیم ترین مورخہ نمونہ اصفہان کے ابراہیم الاسطرلابی کے بیٹوں احمد اور محمود نے ۹۸۴ء میں بنایا؛ ابراہیم بن سعید نے طلیطلہ میں ۱۰۶۶-۶۷ء میں ایک اسطرلاب کی نگرانی کی؛ فارسی استاد عبدالحمید نے ۱۷۱۵ء میں نفیس منقوش اسطرلاب بنایا۔ کارا دو وو فزاری — پہلے مسلمان اسطرلاب ساز — اور زرقالی — مشہور آلات ساز، صفیحہ کے موجد جس کا رسالہ شاہ الفونسو نے دو بار ہسپانوی میں ترجمہ کرایا اور ریجیومونٹینس نے «نبیل آلہ» کے مسائل شائع کیے — کا اضافہ کرتا ہے۔"
