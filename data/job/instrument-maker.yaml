summary:
  ar: "صانع الآلات الفلكية هو من يقطرع النحاس وينقشه أسطرلاباتٍ وصفائح وكرات ذات حلق. يذكر كارا دو فو أن الفزاري كان أول مسلم صنع الأسطرلاب في عهد المأمون تقريباً، وأن ماشاء الله ⁦(ت 815م)⁩ كتب في الأسطرلاب والأرصاد، وأن الزرقالي ⁦(ت نحو 1087م)⁩ اشتهر صانعاً للآلات في طليطلة واخترع الصفيحة التي ألّف فيها رسالة خرج منها أدب كامل. ويعدّ كريستي الأسطرلابات المؤرّخة: أقدمها في أكسفورد صُنِع سنة 984 عمل مشترك لأحمد ومحمود ابني إبراهيم الأسطرلابي الأصفهاني، وأسطرلاب إبراهيم بن سعيد بطليطلة سنة 1066-1067، وأسطرلاب عبد الحميد الفارسي سنة 1715."
  en: "The instrument-maker cut and engraved brass into astrolabes, safiha plates and armillary spheres. Carra de Vaux records that al-Fazari was the first Muslim to construct an astrolabe, in the age of al-Mansur and al-Ma'mun; that Masha'allah (d. 815) wrote on the astrolabe and meteorology; and that al-Zarqali (d. c. 1087) of Toledo was famous as an instrument-maker and invented the safiha, on which he wrote a treatise that generated a whole literature. Christie lists the dated astrolabes: the earliest known, at Oxford, made in 984 by the brothers Ahmad and Mahmud sons of Ibrahim the astrolabist of Isfahan; the Toledo astrolabe of Ibrahim ibn Sa'id, 1066-7; and the ornamented Persian astrolabe of 'Abd al-Hamid, 1715."
  ur: "آلات فلکی ساز پیتل کاٹ اور تراش کر اسطرلاب، صفیحہ اور حلقی کرے بناتا تھا۔ کارا دو وو لکھتا ہے کہ فزاری پہلا مسلمان تھا جس نے اسطرلاب بنایا، منصور اور مأمون کے زمانے میں؛ ماشاءاللہ ⁦(۸۱۵ء)⁩ نے اسطرلاب اور موسمیات پر لکھا؛ اور طلیطلہ کا زرقالی ⁦(ت ۱۰۸۷ء)⁩ آلات سازی میں مشہور تھا اور اس نے صفیحہ ایجاد کی جس پر اس کی رسالہ ایک پورا ادب جنم دینے والا بنا۔ کرسٹی تاریخ شدہ اسطرلاب گنواتا ہے: آکسفورڈ میں قدیم ترین، ۹۸۴ء میں اصفہان کے اسطرلابی ابراہیم کے بیٹوں احمد اور محمود کی مشترکہ کاری؛ طلیطلہ میں ابراہیم بن سعید کا اسطرلاب ۱۰۶۶-۶۷ء؛ اور فارسی استاد عبدالحمید کا آراستہ اسطرلاب ۱۷۱۵ء۔"
