summary:
  ar: "الحَبَّاب تاجر الحبوب في السوق، وعليه من أبواب الحسبة ما على غيره من الباعة وأشدّ، لأن القوت قوت الناس. يجمع ابن الأخوة والشيزري قواعد بابه: لا يحتكر الحبوب، ولا يخلط الرديء بالجيد ولا القديم بالجديد فإن ذلك غشّ للناس، وإن غسل الحبّ لزمه تجفيفه ثم بيع كل صنف من الحنطة منفرداً؛ ومرّ النبي بصاحب طعام فأدخل يده في النَّبْرة فأصابت بللاً فقال: «ما هذا؟» قال: أصابته السماء يا رسول الله، قال: «أفلا جعلته فوق الطعام كي يراه الناس؟ من غشّ فليس مني». وتروي كتب الحسبة عن محتسب الفاطميين سليمان بن عزّة أنه جمع تجار الحبوب في موضع واحد وغلق الطرق إلا طريقاً واحداً وأغلق نحو مئة وخمسين مخزناً، فلما فسدت الحال أُعيد فتح المخازن حتى يعيش الناس بالخبز والحنطة إلى غلة أخرى. وعلى المحتسب أن يفاجئ أهل الموازين بالتفتيش، فمن الغشّ المدوَّن عند الشيزري أن ينقع بعضهم حبّ الحنطة والشعير في الزيت ويدسّ فيه أطراف الإبر ويجفّفه في الظل فيعود الحبّ كهيئته ولا يظهر عليه شيء، فيُغشّ به وزن الميزان."
  en: "The habbab dealt in grain in the market, and the hisba watched him more closely than most sellers, for grain is the people's sustenance. Ibn al-Ukhuwwa and al-Shayzari give his chapter its rules: he must not hoard grain, nor mix bad wheat with good nor old wheat with fresh — that is swindling the people — and if the grain must be washed it must be well dried, each kind of wheat sold separately. The Prophet himself once passed a man selling a heap of corn, put his hand into it and found wet grain below: 'What is this?' — 'The sky rained on it, Messenger of God' — 'Why did you not put it on top so the people could see it? Whoever deceives is not one of us.' The hisba books tell how the Fatimid muhtasib Sulayman ibn 'Azza gathered all the grain merchants in one place, closed every road but one, and shut some hundred and fifty granaries; when the supply broke down the granaries were opened again so that the country might 'thrive with bread and wheat until there is another crop.' The muhtasib must surprise the keepers of the balances with inspection, for al-Shayzari records a weights-fraud in which grains of wheat and barley are soaked in oil, the ends of needles buried in them and the grains dried in the shade, so that they look as they did and the balance is falsified."
  ur: "حبّاب بازار میں اناج کا سوداگر تھا اور محتسب اس پر دوسروں سے زیادہ نگاہ رکھتا، کیونکہ غلہ لوگوں کا قوت ہے۔ ابن الاخوہ اور الشیزری اس کے باب کے قاعدے لکھتے ہیں: غلہ ذخیرہ نہ کرے، نہ خراب گندم اچھی میں اور نہ پرانی نئی میں ملائے — یہ لوگوں کو دھوکہ ہے — اور غلہ دھونا پڑے تو اچھی طرح سکھائے اور ہر قسم کی گندم الگ بیچے۔ خود نبی اکرم ایک بار غلّے کے ڈھیر بیچنے والے کے پاس سے گزرے، ہاتھ اس میں ڈالا تو نیچے گیلا اناج ملا: «یہ کیا ہے؟» — «یا رسول اللہ، اس پر آسمان کی بارش پڑی» — «اسے اوپر کیوں نہیں رکھا کہ لوگ دیکھیں؟ جو دھوکہ دے وہ ہم میں سے نہیں۔» کتبِ حسبہ میں آتا ہے کہ فاطمی محتسب سلیمان بن عزّہ نے سارے غلہ فروشوں کو ایک جگہ جمع کیا، ایک کے سوا سب راستے بند کیے اور ڈیڑھ سو انبار بند کروا دیے؛ جب قوت ختم ہوئی تو انبار دوبارہ کھلوا دیے گئے تاکہ ملک اگلی فصل تک روٹی اور گندم سے آباد رہے۔ محتسب کو تولنے والوں کے ترازووں کی اچانک جانچ کرنی ہے، کہ الشیزری تول کا ایک دھوکہ لکھتا ہے: گندم اور جو کے دانے تیل میں بھگو کر ان میں سوئیوں کے سرے دبائے اور سائے میں سوکھائے جاتے، تو دانے ویسے دکھتے اور ترازو گڑبڑ ہو جاتی۔"
