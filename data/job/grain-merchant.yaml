craft:
  techniques:
    ar: "صنعة الحَبَّاب صنعة تخزين وتنقية ووزن: يُمنع الاحتكار، ويُمنع خلط الرديء بالجيد والقديم بالجديد؛ وإن اغتُسل الحبّ جُفِّف تجفيفاً تاماً وبِيعت كل حنطة على حدة. ومن غشّ الموازين الذي يكشفه الشيزري — حبّ منقوع في الزيت مدسوسة فيه أطراف الإبر — وعند ابن الأخوة التنبيه على موازين الحبّ ومكاييله، وعند الشيزري أطواف المحتسب على المكاييل: ثلاثة مقادير لكل دكان، وكشف الجصّ الملصق في قعر المكيال ودُهن العصير وعرق التين الممدود باطن المكيال. وفي إسطنبول كانت المخازن ⁦(كيلار)⁩ تستقبل الحبّ من موانئ البحر الأسود تحت آغات التفتيش."
    en: "The grain-merchant's craft is storing, cleaning and weighing: hoarding is barred, mixing bad with good or old with new is barred; washed grain must be fully dried and each wheat sold on its own. The frauds the muhtasib exposes include al-Shayzari's weights-fraud — grains soaked in oil with needle-ends buried in them — and, in Ibn al-Ukhuwwa and al-Shayzari alike, the scales and dry measures that had to be tested: three sizes of measure per shop, and the gypsum glued in the measure's bottom, the oil-dregs smeared on its sides and the fig-sap creamed inside it, all to be scraped out. In Istanbul the corn lay in the great magazines (kilar), filled from the Black Sea ports, under the Aghas of the Inspectorate."
    ur: "حبّاب کا ہنر ذخیرہ کرنا، صاف کرنا اور تولنا ہے: ذخیرہ اندوزی ممنوع، خراب کو اچھے اور پرانے کو نئے میں ملانا ممنوع؛ دھویا غلہ پورا سکھایا جائے اور ہر گندم الگ بکے۔ محتسب کے پکڑے دھوکوں میں الشیزری کا تول کا دھوکہ ہے — تیل میں بھگوئے دانے جن میں سوئیوں کے سرے دبے — اور ابن الاخوہ اور الشیزری دونوں تول اور پیمائش کی جانچ لکھتے ہیں: ہر دکان میں تین ناپ، اور ناپ کے تل میں چکا جِس، کناروں پر تیل کی میل اور اندر لگا انجیر کا دودھ — سب اترا جائے۔ استنبول میں غلہ عظیم انباروں ⁦(کیلار)⁩ میں بحرِ اسود کی بندرگاہوں سے بھرا کرتا، آغاؤں کی نگرانی میں۔"
