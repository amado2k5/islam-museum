    ar: "صنعة الندّاف هي الحلج المتكرر: يُحلَج القطن مرات حتى تخرج القشور السود والبذور المكسورة، ولا يُخلَط الجديد بالعتيق ولا الأحمر بالأبيض. ومن الغشّ وضعُ الرديء في أسفل الصفحة والنقي على الوجه، وتخزين المحلوج في المواضع الباردة الرطبة ليثقل وزنه، وخلطُ القطن غير المغزول بالكتان الممشّط. وشرطُ الصنعة العفة والديانة لأن أكثر المعاملة مع النساء اللاتي يأتين بالقطن ويستلمنه محلوجاً."
    en: "The naddaf's craft is the repeated carding: the cotton is carded over and over until the black husks and broken seeds come out of it, and the new is never mixed with the old nor the red with the white. The frauds are placing the poor cotton at the bottom of the pile with the pure on top, storing the carded cotton in cold damp places to raise its weight, and mixing unspun cotton into combed flax. The condition of the trade is chastity and honour, for most of the dealing is with the women who bring the cotton and take it back carded."
    ur: "نداف کی دستکاری بار بار کا پنتنا ہے: رُئی اتنی بار پنتی جاتی کہ سیاہ چھلکے اور ٹوٹے بیج نکل جائیں، اور نہ نئی پرانی میں نہ سرخ سفید میں ملائی جائے۔ دھوکے ہیں: بُری رُئی ڈھیر کے تلے اور اچھی اوپر رکھنا، پنٹی رُئی ٹھنڈی تر جگہ رکھ کر بھاری کرنا، اور اناپٹی رُئی مٹھے کتان میں ملانا۔ پیشے کی شرط پاک دامنی اور اعتبار ہے کہ اکثر معاملہ ان عورتوں سے ہے جو رُئی لائیں اور پنٹی ہوئی واپس لیں۔"
