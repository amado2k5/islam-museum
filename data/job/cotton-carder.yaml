summary:
  ar: "الندّاف هو حلّاج القطن في السوق: يجلس في دكانه يحلج القطن للغزل وللحشو. يحرّم ابن الأخوة والشيزري خلط القطن الجديد بالعتيق ولا الأحمر بالأبيض، ويأمران بتكرار الحلج حتى تخرج منه القشور السود والبذور المكسورة — لأن البذر إن بقي أظهر نفسه في الوزن، وإن بقي في جبّة أو بطانية ثم غُسلت ودُعكت قدّ ثوبَها، وإن بقي في الجبة أو القباء أكلته الفأر. ومن الغشّ أن يحلج الرديء الأحمر ويضعه في أسفل الصفحة ثم يغطّيه بالأبيض النقي فلا يظهر حتى يُغزل، وأن يضع القطن المحلوج في المواضع الباردة الرطبة فيثقل وزنه ويخفّ إذا جفّ — غشّاً يعمّهم كما يقول الشيزري. ويمنعان إجلسة النساء على أبواب الدكاكين ينتظرن انقضاء الحلج، ويمنعان محادثتهن؛ وعند ابن الأخوة لا يُولَّى هذه الصنعة إلا عفيفٌ ذو ديانة إذ أكثر معاملتهم مع النساء. وفي باب الغزّالين يصف الشيزري الكتّان: أجوده الغزّاوي المصري الأملس الورق، وأردؤه القصير الخشن الذي ينقطع من غير انتظار، ويحرّم خلط الجيّد بالرديء وكتّان نابلس بكتّان مصر، ومنهم من يخلط القطن غير المغزول بالكتّان الممشّط."
  en: "The naddaf is the market's cotton-carder, sitting in his shop carding cotton for spinning and for stuffing. Ibn al-Ukhuwwa and al-Shayzari forbid mixing new cotton with old and red with white, and order the carding repeated until the black husks and broken seeds are out of it — for any seed left shows itself in the weight, and if left in a jubba or blanket that is washed and crushed it cuts the article, and if left in the jubba or qaba the mice nibble at it. The frauds have names: some card the bad red cotton, lay it at the bottom of the pile and cover it with clean white, which does not show until it is spun; some store the carded cotton in cold damp places so it weighs more and lightens when it dries — a fraud they all practise, says al-Shayzari. Both manuals forbid letting women sit at the shop-doors waiting for the carding and forbid conversing with them; Ibn al-Ukhuwwa allows none to hold the trade unless chaste and honourable, for most of their dealings are with women. In the flax-spinners' chapter al-Shayzari grades the fibre: the finest flax is Giza's Egyptian, the smooth-leaved variety best and the short rough kind that snaps without warning the worst; mixing good with bad, Nablus flax with Egyptian, or unspun cotton into combed flax are all fraudulent."
  ur: "نداف بازار کا دھونکنی ہے، اپنی دکان پر بیٹھ کر رُئی کو بٹائی کے لیے اور بھرائی کے لیے پنتا ہے۔ ابن الاخوہ اور الشیزری نئی رُئی کو پرانی اور سرخ کو سفید میں ملانے سے روکتے اور بار بار پنتنے کا حکم دیتے تا کہ سیاہ چھلکے اور ٹوٹے بیج نکل جائیں — بیج رہے تو وزن میں ظاہر ہوتا، جبہ یا کمبل میں رہے تو دھونے اور گھسنے سے کپڑا کاٹتا، جبہ یا قبا میں رہے تو چوہے کُترتے۔ دھوکے نامدار: بعض بُری سرخ رُئی پنت کر ڈھیر کے تلے رکھ کر صاف سفید سے ڈھانپ دیتے جو گھسائی پر ظاہر ہوتی؛ بعض پنٹی رُئی ٹھنڈی تر جگہ رکھتے کہ بھاری ہو اور سوکھنے پر ہلکی — «یہ دھوکا ان سب کا ہے» کہتا الشیزری۔ دونوں کتابیں دکان کے دروازے پر عورتوں کے بیٹھنے اور ان سے بات کرنے سے منع کرتی؛ ابن الاخوہ اس پیشہ کو صرف پاک دامن اور معتبر کو دیتا کہ ان کا معاملہ اکثر عورتوں سے ہے۔ کتان گھسائیوں کے باب میں الشیزری ریشہ درجہ دیتا: بہترین کتان مصر کا جزائی، نرم پتوں والا اچھا اور چھوٹا کھردرا جو بلا اطلاع ٹوٹے برا؛ اچھے کو بُرے، نابلس کے کتان کو مصری، اور اناپٹی رُئی کو مٹھے کتان میں ملانا دھوکا۔"
  es: "El naddaf es el cardador de algodón del mercado, sentado en su tienda cardando algodón para hilar y para rellenar. Ibn al-Ukhuwwa y al-Shayzari prohíben mezclar algodón nuevo con viejo y rojo con blanco, y ordenan que se repita el cardado hasta que se eliminen las cáscaras negras y las semillas rotas, pues cualquier semilla restante se nota en el peso, y si queda en una jubba o manta que se lava y se arruga, corta la prenda, y si queda en la jubba o qaba, los ratones la roen. Los fraudes tienen nombres: algunos cardan el algodón rojo malo, lo colocan en el fondo del montón y lo cubren con blanco limpio, que no se ve hasta que se hila; algunos almacenan el algodón cardado en lugares fríos y húmedos para que pese más y se aligera al secarse, un fraude que todos practican, dice al-Shayzari. Ambos manuales prohíben que las mujeres se sienten en las puertas de las tiendas esperando el cardado y prohíben conversar con ellas; Ibn al-Ukhuwwa no permite que nadie se dedique a este oficio a menos que sea casto y honorable, ya que la mayoría de sus tratos son con mujeres. En el capítulo sobre los hilanderos de lino, al-Shayzari clasifica la fibra: el lino más fino es el egipcio de Giza, la variedad de hojas lisas es la mejor y la de hojas cortas y ásperas que se rompe sin previo aviso es la peor; mezclar lino bueno con malo, lino de Nablus con egipcio, o algodón sin hilar con lino peinado son prácticas fraudulentas."
