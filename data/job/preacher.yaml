summary:
  ar: "الواعظ هو من يلقي الموعظة والتذكير على الناس، وهو غير الخطيب صاحب خطبة الجمعة المفروضة وغير القاصّ راوي القصص، وإن اختلطت الأعمال تاريخياً. أولى النبي الوعظ مقاماً في رسالته وقصّ في خطبه أحياناً؛ وانتشرت القصص في الوعظ بعد مقتل عثمان حتى اعترض المحدثون على القصّاص وصنّف ابن الجوزي والسيوطي في زيفهم. ويصف لين القاهرة: على كل مسجد ناظر يعيّن العاملين الدينيين، وفي المساجد الكبرى إمامان أحدهما الخطيب الذي يخطب يوم الجمعة فيعتلي المنبر قابضاً على سيف خشبي ويلقي «خُطبة الوعظ»، ويقف المُركّي عند باب درج المنبر والمبلّغون على الدكّة يرددون. وفي كتاب ابن الأخوة للحسبة من أحكام الوعظ والخطيب: يُنكر على الخطيب ثوب أسود يغلبه حرير أو سيف مذهّب، ويُمنع الناس عن تخطّي رقاب المصلين، ويُنكر على الإمام إطالة الصلاة."
  en: "The wāʿiẓ delivers exhortation and reminder to the people — distinct from the khatib who holds the obligatory Friday khutba and from the qāss who tells the tales, though their work blurred historically. The Prophet gave wa'z a place in his mission and sometimes told exemplary stories in his sermons; tale-telling spread into preaching after the killing of Uthman until the hadith scholars objected to the qussās and Ibn al-Jawzi and al-Suyuti wrote against their fabrications. Lane draws Cairo: a nazir warden appoints each mosque's religious ministers, and the larger mosques keep two imams, one the khateeb who preaches on Friday — he mounts the pulpit grasping a wooden sword and delivers the 'khutbet el-wa'z' — while the murakkee stands at the pulpit-stairs door and the muballighs chant responses from the dikkeh. In Ibn al-Ukhuwwa's hisba book the preacherly rules run: the khatib's black silk-heavy robe or gilded sword is a misdemeanour to be denounced; stepping over worshippers' backs is forbidden; an imam who prolongs the ritual is denounced."
  ur: "واعظ وہ ہے جو لوگوں کو نصیحت اور تذکیر سناتا ہے — خطیب سے مختلف جس کا کام جمعہ کا فرض خطبہ ہے، اور قاص سے بھی جس کا کام قصے کہنا ہے، اگرچہ تاریخ میں ان کے کام مل گئے۔ نبی نے وعظ کو اپنی رسالت میں مقام دیا اور خطبوں میں کبھی عبرتناک قصے سنائے؛ عثمان کے قتل کے بعد وعظ میں قصہ گوئی پھیلی یہاں تک کہ محدثین نے قصاص پر اعتراض کیا اور ابن الجوزی و سیوطی نے ان کی وضع کردہ روایات پر کتابیں لکھیں۔ لین قاہرہ بیان کرتا ہے: ہر مسجد پر ایک ناظر وقف اہلکار مقرر کرتا ہے، بڑی مسجدوں میں دو ائمہ ہوتے ہیں جن میں سے ایک خطیب جمعہ کو خطبہ دیتا ہے — وہ لکڑی کی تلوار تھامے منبر پر چڑھتا اور 'خطبۃ الوعظ' پڑھتا ہے — مركّی منبر کی سیڑھیوں کے دروازے پر کھڑا ہوتا اور مبلّغ دکّہ پر جوابی ترانے گاتے ہیں۔ ابن الاخوہ کی حسبہ کتاب میں واعظانہ احکام یہ ہیں: خطیب کا ایسا سیاہ جامہ جس میں ریشم غالب ہو یا مذهّب تلوار معصیت ہے جسے انکار کرنا ہو؛ نمازیوں کی پشتوں سے اچھلنا ممنوع؛ اور امام جس نے نماز طول دی اس پر انکار ہوتا ہے۔"
  es: "El wāʿiẓ ofrece exhortaciones y recordatorios a la gente, distinto del khatib que pronuncia la jutba obligatoria del viernes y del qāss que cuenta los cuentos, aunque su función se fusionó históricamente. El Profeta dio un lugar al wa'z en su misión y a veces contaba historias ejemplares en sus sermones; la narración de cuentos se extendió a la predicación después del asesinato de Uthman hasta que los eruditos del hadiz objetaron a los qussās e Ibn al-Jawzi y al-Suyuti escribieron en contra de sus invenciones. Lane describe El Cairo: un nazir guardián nombra a los ministros religiosos de cada mezquita, y las mezquitas más grandes mantienen dos imanes, uno el khateeb que predica el viernes —sube al púlpito empuñando una espada de madera y pronuncia el 'khutbet el-wa'z'— mientras que el murakkee se sitúa en la puerta de la escalera del púlpito y los muballighs recitan respuestas desde el dikkeh. En el libro de hisba de Ibn al-Ukhuwwa, las reglas del predicador son las siguientes: la túnica pesada de seda negra o la espada dorada del khatib son una falta que debe ser denunciada; está prohibido pasar por encima de las espaldas de los fieles; un imán que prolonga el ritual es denunciado."
  fr: "Le wāʿiẓ (médisant) adresse des exhortations et des rappels au peuple, se distinguant ainsi du khatib (sermon obligatoire du vendredi) et du qāss (comédien), bien que leurs fonctions se soient historiquement confondues. Le Prophète a intégré le wa'z à sa mission et relatait parfois des histoires exemplaires dans ses sermons. Après la mort d'Uthman, la narration s'est répandue dans la prédication, jusqu'à ce que les spécialistes du hadith s'opposent aux qussās et qu'Ibn al-Jawzi et al-Suyuti dénoncent leurs inventions. Lane représente Le Caire: un nazir (gardien) nomme les ministres religieux de chaque mosquée, et les plus grandes mosquées ont deux imams: le khatib (médisant) qui prêche le vendredi – il monte en chaire, brandissant une épée de bois, et prononce le « khutbet el-wa'z » – tandis que le murakkee (sermon) se tient à la porte de l'escalier de la chaire et que les muballighs (chants religieux) chantent les réponses depuis la dikkeh (tribune). Dans le livre hisba d'Ibn al-Ukhuwwa, les règles prédicatrices sont les suivantes: la robe en soie noire lourde du khatib ou son épée dorée constituent une faute à dénoncer; il est interdit de marcher sur le dos des fidèles; un imam qui prolonge le rituel est dénoncé."
  tr: "Vaiz, insanlara hutbeler ve hatırlatmalar ileten kişidir. Cuma hutbesini veren hatipten ve tarihsel olarak iç içe geçmiş olsalar da hikaye anlatıcısından farklıdır. Peygamber Muhammed, mesajında tebliğ etmeye önemli bir yer vermiş ve zaman zaman hutbelerine hikaye anlatımını da dahil etmiştir. Osman'ın suikastından sonra hikaye anlatımı tebliğde yaygınlaşmış, hatta hadis âlimleri hikaye anlatıcılarını eleştirmiş ve İbn el-Cevzi ile el-Suyuti onların yanlışlığını ortaya koyan eserler yazmışlardır. Lane, Kahire'yi şöyle anlatıyor: Her caminin, dini personeli atayan bir gözetmeni vardır. Büyük camilerde iki imam bulunur; bunlardan biri Cuma hutbesini veren hatiptir. Tahta bir kılıç tutarak minbere çıkar ve hutbeyi verirken, okuyucu minberin basamaklarında durur ve platformdaki elçiler sözleri tekrarlar. İbn el-Ukhuwwah'ın kamu ahlakı üzerine yazdığı kitabında, vaaz ve hitabet kuralları hakkında şunlar belirtilmiştir: Hatibin ipek örtülü siyah cübbe giymesi veya yaldızlı kılıç taşıması hoş karşılanmaz. İnsanların ibadet edenlerin boyunlarının üzerinden geçmesi yasaktır ve imamın namazı uzatması hoş karşılanmaz."
  id: "Penceramah adalah orang yang menyampaikan khutbah dan pengingat kepada orang-orang. Ia berbeda dari orator yang menyampaikan khutbah Jumat wajib, dan juga dari pendongeng, meskipun peran-peran tersebut secara historis telah saling terkait. Nabi Muhammad memberikan tempat yang menonjol dalam dakwahnya dan kadang-kadang memasukkan cerita dalam khutbahnya. Bercerita menjadi meluas dalam dakwah setelah pembunuhan Utsman, sampai-sampai para ulama Hadits mengkritik para pendongeng, dan Ibn al-Jawzi dan al-Suyuti menulis uraian tentang kepalsuan mereka. Lane menggambarkan Kairo: Setiap masjid memiliki pengawas yang menunjuk personel keagamaan. Di masjid-masjid besar, ada dua imam, salah satunya adalah orator yang menyampaikan khutbah Jumat. Ia naik ke mimbar sambil memegang pedang kayu dan menyampaikan khutbah, sementara pembaca berdiri di kaki tangga mimbar, dan para utusan di mimbar mengulangi kata-kata tersebut. Dalam kitab Ibn al-Ukhuwwah tentang moralitas masyarakat, mengenai aturan berdakwah dan berpidato, disebutkan: Seorang orator tidak disukai mengenakan jubah hitam dengan lapisan sutra atau pedang berlapis emas. Orang-orang dilarang melangkahi leher orang yang sedang beribadah, dan imam tidak disukai memperpanjang salat."
