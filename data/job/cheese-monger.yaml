craft:
  techniques:
    ar: "صنعة الجبّان صنعة بيعٍ وحفظ: تُحفظ الأجبان في الكِدّان، ويُمنع بيع الباقي منها فيها مع الدهن والزيت الزنخ المتسوس، ويُقلَى الجبن في سيرج طري فقط ويُصفّى المحمّص من الدهن كله عند ابن الأخوة. وعند إوليا تزدان الدكاكين بالأصناف — الجبن والقشدة والقيمق المبسوط عليه الأعشاب العطرة — ويحمل الباعة الجوّالون أكياس الجبن الطري على الأكتاف ينادون باسمه."
    en: "The cheese-monger's craft is keeping and selling: cheeses stood in casks — the sale of the leftovers in them is forbidden, with rancid and maggoty fats — fried cheese goes only into fresh sesame oil and toasted cheese is drained of all fat, per Ibn al-Ukhuwwa. In Evliya the shops are dressed with the dairy kinds, the kaimak spread with odoriferous herbs, and the street sellers carry the soft fresh cheeses in white bags on their shoulders, crying the name."
    ur: "پنیر فروش کا ہنر سنوارنا اور بیچنا ہے: پنیر کپوں میں رکھا جاتا — ان میں بچا مال اور باسی کیڑا لگا چکنا مال بیچنا ممنوع — تلا پنیر صرف تازہ تل میں اور بھنا پنیر ساری چکنائی سے نچھالا جاتا، ابن الاخوہ کے مطابق۔ اولیاء میں دکانیں اقسام سے سجی ہوتی، ملائی پر خوشبو دار بوٹیاں بچھی، اور آوارہ فروش نرم تازہ پنیر کے سفید تھیلے کندھے پر اٹھا کر نام پکارتے۔"
