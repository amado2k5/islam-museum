summary:
  ar: "الجبّان هو بياع الجبن وسائر ألبان السوق. يذكر ابن الأخوة قلّالي الجبن في باب صغار البياعين: لا يُقلَى الجبن إلا بزيت سيرج طري، والجبن المحمّص يُصفّى من كل دهن. ويمنع الشيزري بياعي السمن أن يبيعوا جبناً باقياً في الكِدّان ⁦(البراميل)⁩ أو دهناً وزيتاً زنخاً فاسداً متسوساً لضرره بالناس، ويعلّم المحتسب علامة الزيت الذي أُدخنت فيه الأجبان: أنه دهنيّ يفحّ ويطقس على لهب السراج. وفي إسطنبول إوليا للجبّانين طائفة بيرها إبراهيم الذي حلب بحلب بقرة بيضاء اسمها ثريا شهب وصنع من لبنها كل أصناف الجبن والقشدة والزبد — ومن اسمها سُميت «حلب الشهبا» كما تروي الطائفة — وللقيمقجية مئة رجل في أربعين دكاناً يبسطون على القيمق الأعشاب العطرة، ولباعة جبن «طلمك پنير» ألبانيون يملؤون به أكياساً بيضاء يحملونها على الأكتاف وينادون «طلمك پنير»، وهو جبن طري حلو إذا مُزج بالعسل ووُضع على الخبز أكل منه المرء — والعلم عند الله — حتى يموت."
  en: "The cheese-monger sold cheese and the dairy produce of the market. Ibn al-Ukhuwwa's small-traders chapter rules the cheese-friers: cheese may be fried only in fresh sesame oil, and toasted cheese must be drained of all fat. Al-Shayzari forbids the butter-merchants to sell cheese left over in casks, or fat and oil gone rancid, putrefied or maggot-infested, for the harm they do people; and he teaches the muhtasib the sign of oil in which cheeses have stood — greasy, it crackles and spits over the lamp-flame. In Evliya's Istanbul the cheesemongers' patron is Abraham, who at Aleppo milked a white cow called Thuresh-sheheb and made of her milk every kind of cheese, curd, cream and butter — the town, in guild lore, takes its name Haleb-esh-shehba from that white cow — while the kaimak-merchants, a hundred men in forty shops, spread odoriferous herbs over their cream, and the sellers of Telmeh Penir, mostly Albanians, fill white bags with a cheese so fresh and sweet that mingled with honey on bread a man may eat of it, God knows, till he dies."
  ur: "پنیر فروش بازار کا پنیر اور دودھ کی دوسری تیاریوں کا بیوپاری تھا۔ ابن الاخوہ چھوٹے بیوپاریوں کے باب میں پنیر تلنے والوں کا ضابطہ لکھتا ہے: پنیر صرف تازہ تل کے تیل میں تلا جائے اور بھنا پنیر ساری چکنائی سے نچھالا جائے۔ الشیزری مکھن فروشوں کو کپوں میں بچا پنیر اور باسی، بگڑا یا کیڑے لگا چکنا مال بیچنے سے روکتا ہے کہ لوگوں کو نقصان ہے، اور محتسب کو اس تیل کی پہچان سکھاتا ہے جس میں پنیر رکھا رہا: چکنا ہے اور چراغ کی لو پر چٹچٹا کر چھڑکتا ہے۔ اولیاء کے استنبول میں پنیر فروشوں کا پیر ابراہیم ہے جس نے حلب میں تھریا شہب نامی سفید گائے دوہی اور اس کے دودھ سے ہر قسم کا پنیر، مثلا، بالائی اور مکھن بنایا — صنعت کے قصے میں شہر کا نام «حلب الشہبا» اسی سفید گائے سے پڑا — قیمقجی ایک سو آدمی چالیس دکانوں پر اپنی ملائی پر خوشبو دار بوٹیاں بچھاتے، اور «طلمہ پنیر» بیچنے والے اکثر البانی ہیں جو سفید تھیلے بھر کر کندھے پر اٹھا کر «طلمہ پنیر» پکارتے؛ اتنا تازہ میٹھا پنیر کہ شہد ملا کر روٹی پر رکھو تو آدمی — اللہ جانے — مرنے تک کھائے۔"
  fr: "Le fromager vendait du fromage et les produits laitiers du marché. Le chapitre d'Ibn al-Ukhuwwa consacré aux petits commerçants donne des instructions aux fromagers: le fromage ne peut être frit que dans de l'huile de sésame fraîche, et le fromage grillé doit être débarrassé de toute matière grasse. Al-Shayzari interdit aux marchands de beurre de vendre du fromage resté en fût, ou de la graisse et de l'huile rances, putréfiées ou infestées d'asticots, en raison du préjudice qu'elles causent; et il enseigne aux muhtasib le signe d'une huile ayant contenu du fromage: grasse, elle crépite et projette des vapeurs au-dessus de la flamme de la lampe. À Istanbul, dans l'Istanbul d'Evliya, le patron des fromagers est Abraham, qui à Alep trayait une vache blanche appelée Thuresh-sheheb et fabriquait avec son lait toutes sortes de fromages, de caillé, de crème et de beurre — la ville, selon la tradition des corporations, tire son nom de Haleb-esh-shehba de cette vache blanche — tandis que les marchands de kaimak, une centaine d'hommes dans quarante boutiques, répandent des herbes odorantes sur leur crème, et les vendeurs de Telmeh Penir, pour la plupart albanais, remplissent des sacs blancs d'un fromage si frais et si doux que, mêlé à du miel sur du pain, un homme pourrait en manger, Dieu sait, jusqu'à sa mort."
  es: "El quesero vendía queso y productos lácteos del mercado. El capítulo de Ibn al-Ukhuwwa sobre los pequeños comerciantes regula a los queseros: el queso solo puede freírse en aceite de sésamo fresco, y el queso tostado debe escurrirse de toda la grasa. Al-Shayzari prohíbe a los vendedores de mantequilla vender queso sobrante en barriles, o grasa y aceite rancios, putrefactos o infestados de gusanos, por el daño que causan a las personas; y enseña al muhtasib la señal del aceite en el que han reposado los quesos: grasiento, crepita y chisporrotea sobre la llama de la lámpara. En el Estambul de Evliya, el patrón de los vendedores de queso es Abraham, quien en Alepo ordeñaba una vaca blanca llamada Thuresh-sheheb y con su leche elaboraba todo tipo de quesos, cuajada, crema y mantequilla; la ciudad, según la tradición gremial, toma su nombre de Haleb-esh-shehba de esa vaca blanca. Mientras tanto, los comerciantes de kaimak, un centenar de hombres en cuarenta tiendas, esparcen hierbas aromáticas sobre su crema, y los vendedores de Telmeh Penir, en su mayoría albaneses, llenan bolsas blancas con un queso tan fresco y dulce que, mezclado con miel en pan, un hombre puede comerlo, Dios sabe, hasta morir."
