id: job/merchant
class: job
label: { ar: "التاجر", en: "Merchant (tajir)", ur: "تاجر" }
summary:
  ar: "التاجر هو من يتخذ تبادل السلع بقصد الربح مهنة، وجمعه تجّار. كانت مكة قبل الإسلام مركزاً للقوافل والأسواق، وتاجر فيها النبي محمد وخديجة بنت خويلد بالشراكة. ومن أهل التجارة من يشتري ويخزن ومن يستورد ومن يصدّر بوكلاء يشاركونه الربح، وتعرف الفقه في ذلك عقد المضاربة. وتحدد الموسوعة للتجارة أخلاقاً تحرّم الربا والغرر والغش، وتجعل تعلّم أحكامها واجباً على كل تاجر."
  en: "The merchant is someone who makes the exchange of goods for profit his trade; the plural is tujjar. Before Islam Mecca was a centre of caravans and markets, and the Prophet Muhammad and Khadija bint Khuwaylid traded there in partnership. Merchants bought and stored, imported and exported, often through agents who shared the profit; the jurists' name for that partnership is mudaraba. The Turkish encyclopaedia sets out ethical limits that forbid interest, deception and gharar, and makes learning the rules of trade an obligation on every merchant."
  ur: "تاجر وہ شخص ہے جو سامان کے تبادلے کو نفع کے لیے اپنا پیشہ بناتا ہے۔ اسلام سے پہلے مکہ قافلوں اور بازاروں کا مرکز تھا، جہاں نبی اور خدیجہ بنت خویلد شراکت سے تجارت کرتے تھے۔ مضاربت کی شراکت، جس میں سرمایہ ایک طرف سے اور محنت دوسری طرف سے ہوتی ہے، تجارت کا بنیادی ذریعہ رہی۔"
