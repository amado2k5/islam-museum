craft:
  materials: [textile]
  techniques:
    ar: "يصوّر إوليا الصنعة من مدخولها إلى عرضها: الريش مادة الصنّاع، ريش الغربان والنسور للمراوح والأعلام، وريش البلشون والكركي لسرغوج العمائم وقبعات القوقا؛ والدكان مكان القصّ والتركيب، والموكب ورشة ماشية إذ يمرّ الصنّاع وهم يعملون. وفي موكب الطبّاخين يحرّك الخدّام مراوح من ريش الطاووس فوق القدور والولائم، فالريش نفسه هو مادة الصنّاع أينما كان، في دكان المروحي أو في مظهر الطبّاخين."
    en: "Evliya pictures the craft from its intake to its display: feathers are the makers' material, ravens' and eagles' feathers for fans and plumes, heron and crane feathers for the sorguc of the turbans and the plumes of the ceremony caps called kuka; the shop is the place of trimming and mounting, and the procession is a walking workshop, for the makers pass while still at work. In the cooks' train, servants work fans of peacock's feathers over the pots and the dinners; the feather is the same makers' material wherever it turns, in the fan-maker's shop or in the cooks' display."
    ur: "اولیاء پیشے کو اس کی خام مال سے اس کے مظاہرے تک دکھاتا ہے: پر بنانے والوں کا سامان ہیں، کوؤں اور عقابوں کے پر پنکھوں اور جھنڈوں کے لیے، اور بلشون اور سارس کے پر پگڑی کے سرغوج اور قوقا ٹوپیوں کے کلغیوں کے لیے؛ دکان کٹائی اور جوڑائی کی جگہ ہے اور جلوس چلتی ورکشاپ ہے کہ بنانے والے کام کرتے گزرتے ہیں۔ طبّاخوں کے دستے میں نوکر ہانڈیوں اور کھانوں پر مور کے پروں کے پنکھے ہلاتے ہیں؛ پر وہی خام مال ہے جہاں بھی ملے، مروحی کی دکان ہو یا باورچیوں کی نمائش۔"
