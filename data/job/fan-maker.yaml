summary:
  ar: "المِروَحي صانع المراوح من ريش الغربان والنسور والطواويس. في موكب إسطنبول عدّ إوليا صنّاع المراوح ⁦(مِرواحجيان)⁩ مئة وخمسة رجال بثلاثين دكاناً، بيرهم يعقوب الطائفي الذي أهدى النبي مروحة من أجنحة الطير، وقلّده أنس بن مالك وقبره بالموصل، وهم يمرّون وهم يصنعون أنواع الأعلام والمراوح من ريش الغربان والنسور. وفي جوارهم صنّاع السُّرغوج ⁦(سُرغوجيان)⁩ خمسون رجلاً بأربعين دكاناً يصنعون معمّدات العمائم وريش القوقا من ريش البلشون والكركي لكولونيلات اليورق. وفي موكب الطبّاخين يرفع الخدّام مراوح من ريش الطاووس يحرّكونها فوق القدور بينما يُعدّ الطبّاخون الولائم."
  en: "The mirwahi made fans of the feathers of ravens, eagles and peacocks. In Evliya's Istanbul procession the fan-makers (Mirwahajian) were a hundred and five men in thirty shops; their patron was Jacob of Taif, who presented the Prophet with a fan of birds' wings, was girded and directed by Anas ibn Malik, and lies buried at Mosul; they passed making different kinds of plumes and fans of ravens' and eagles' feathers as they went. Beside them marched the sorguc-makers (Sorghujian), fifty men in forty shops, who made the feather-plumes of the turban and of the Janissary colonels' ceremony caps out of the feathers of herons and cranes. In the cooks' section of the same procession, fans of peacock's feathers are moved by servants over the stew-pans while the cooks dress dinners, among the tankards, basins and towels of the display."
  ur: "مروحی کوے، عقاب اور مور کے پروں کے پنکھے بنانے والا ہے۔ اولیاء کے استنبول کے جلوس میں مراوحہ ساز ⁦(مرواحجیان)⁩ ایک سو پانچ آدمی تیس دکانوں والے تھے؛ ان کا پیر یعقوب طائفی ہے جس نے نبی کو پرندے کے پروں کا پنکھا پیش کیا، انس بن مالک نے اسے کمر بند پہنائی، اور وہ موصل میں مدفون ہے؛ وہ چلتے ہوئے کوؤں اور عقابوں کے پروں کے جھنڈے اور پنکھے بناتے گئے۔ ان کے پہلو میں سرغوج ساز ⁦(سرغوجیان)⁩ پچاس آدمی چالیس دکانیں تھے جو پگڑی کے کلغی اور جنیسیری کرنلوں کی ٹوپیوں کے پر بلشون اور سارس کے پروں سے بناتے تھے۔ اسی جلوس کے طبّاخوں کے حصے میں نوکر دیگچوں پر مور کے پروں کے پنکھے ہلاتے ہیں جب باورچی دسترخوان تیار کرتے ہیں، اور شان کے طور پر لوٹے، طشت اور تولیے بھی دکھائے جاتے ہیں۔"
  es: "Los mirwahi fabricaban abanicos con plumas de cuervos, águilas y pavos reales. En la procesión de Evliya en Estambul, los fabricantes de abanicos (Mirwahajian) eran ciento cinco hombres en treinta talleres; su patrón era Jacob de Taif, quien obsequió al Profeta con un abanico de alas de pájaro, fue ceñido y dirigido por Anas ibn Malik, y yace enterrado en Mosul; pasaban haciendo diferentes tipos de plumas y abanicos de plumas de cuervos y águilas mientras avanzaban. Junto a ellos marchaban los fabricantes de sorguc (Sorghujian), cincuenta hombres en cuarenta talleres, que fabricaban los penachos de plumas del turbante y de las gorras ceremoniales de los coroneles jenízaros con plumas de garzas y grullas. En la sección de cocineros de la misma procesión, los sirvientes movían abanicos de plumas de pavo real sobre las ollas mientras los cocineros preparaban las cenas, entre las jarras, cuencos y toallas de la exhibición."
