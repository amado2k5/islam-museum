summary:
  ar: "المصلح من يعمل على إصلاح دين الناس ودنياهم — تعليماً وتوجيهاً وتنظيماً وتجديداً — من غير خروج على الجماعة؛ والفقهاء والمؤرخون يفرّقونه عن الثائر: فالبغي خروج بالقوة على الإمام، والإصلاح غيّر بالكلمة والعمل لا بالسلاح. من أوله مصلحو الدعوة الذين علّموا وكتّبوا وأنشأوا — عبد الحميد بن باديس والإخوان المصلحون في المغرب وجمعية العلماء في الجزائر — وصولاً إلى مصلحي الدولة العثمانية في التنظيمات، واليوم مصلحو التعليم والتعليم الشرعي والعمل الخيري؛ دورٌ كلمته الأولى البيان والتدريس، ويكتمل أثره بأن يُتَّبع."
  en: "The muslih works to mend people's faith and world — through teaching, guidance, organisation and renewal — without breaking away from the community; the jurists and historians distinguish him from the rebel, for baghy is a forcible rising against the imam while islah changes by word and work, not by arms. From the earliest reformers of the da'wah who taught, wrote and founded — Abd al-Hamid ibn Badis, the Moroccan reformists and the Association of Algerian Ulama — through the Ottoman Tanzimat statesmen, to today's reformers of schooling and charitable work: a role whose first instrument is statement and teaching, and whose effect is completed only when it is followed."
  ur: "مصلح وہ ہے جو لوگوں کے دین اور دنیا کی اصلاح — تعلیم، رہنمائی، تنظیم اور تجدید کے ذریعے — جماعت سے بغاوت کیے بغیر کرتا ہے؛ فقہا اور مؤرخین اسے باغی سے جدا کرتے ہیں، کیونکہ بغی امام کے خلاف قوت سے خروج ہے جبکہ اصلاح ہتھیار سے نہیں بلکہ کلام اور عمل سے تبدیل کرتی ہے۔ اولین دعوت مصلحین جو سکھایا، لکھا اور ادارے بنائے — عبدالحمید بن بادیس، مراکش کے مصلحین اور جمعیت علمائے الجزائر — سے عثمانی تنظیمات کے سیاست دانوں اور آج کے تعلیم و خیریہ مصلحین تک: ایسا کردار جس کا پہلا آلہ بیان اور تدریس ہے اور جس کا اثر تب کامل ہوتا ہے جب پیروی ہو۔"
  es: "El musulmán trabaja para restaurar la fe y el mundo de las personas —mediante la enseñanza, la guía, la organización y la renovación— sin separarse de la comunidad; los juristas e historiadores lo distinguen del rebelde, pues baghy es una sublevación violenta contra el imán, mientras que islah transforma mediante la palabra y la obra, no con las armas. Desde los primeros reformadores de la da'wah que enseñaron, escribieron y fundaron —Abd al-Hamid ibn Badis, los reformistas marroquíes y la Asociación de Ulemas Argelinos—, pasando por los estadistas otomanos de Tanzimat, hasta los reformadores actuales de la educación y la labor caritativa: un papel cuyo primer instrumento es la declaración y la enseñanza, y cuyo efecto solo se completa cuando se pone en práctica."
  fr: "Le musulman œuvre à la guérison de la foi et au bien-être de la société – par l’enseignement, le conseil, l’organisation et le renouveau – sans pour autant rompre avec la communauté. Les juristes et les historiens le distinguent du rebelle, car le baghy désigne un soulèvement violent contre l’imam, tandis que l’islah agit par la parole et les actes, non par les armes. Des premiers réformateurs de la da’wa qui enseignèrent, écrivirent et fondèrent des mouvements – Abd al-Hamid ibn Badis, les réformateurs marocains et l’Association des oulémas d’Algérie – aux hommes d’État ottomans du Tanzimat, jusqu’aux réformateurs actuels de l’éducation et des œuvres caritatives: un rôle dont le premier instrument est l’affirmation et l’enseignement, et dont l’effet n’est complet que lorsqu’il est mis en pratique."
  tr: "Reformcu, topluma isyan etmeden, eğitim, rehberlik, örgütlenme ve yenilenme yoluyla insanların dini ve dünyevi işlerini düzeltmek için çalışan kişidir. Alimler ve tarihçiler bunu isyandan ayırırlar: İsyan, yöneticiye karşı zorla yapılan bir ayaklanmadır, oysa reform, silahlarla değil, söz ve eylemlerle yapılan değişimdir. Bu, İslam'a davetin ilk reformcularından, örneğin Fas'taki Abdülhamid ibn Bedis ve Müslüman Kardeşler ile Cezayir Müslüman Alimler Birliği gibi, eğitim veren, yazan ve kurumlar kuranlardan, Tanzimat hareketi içindeki Osmanlı devletinin reformcularına ve günümüzdeki eğitim, İslami ilimler ve hayır işlerinin reformcularına kadar uzanır. Rolleri, açık açıklama ve talimatla başlar ve takip edildiğinde etkisi tamamlanır."
  id: "Seorang reformator adalah orang yang berupaya mereformasi urusan keagamaan dan duniawi masyarakat—melalui pendidikan, bimbingan, pengorganisasian, dan pembaharuan—tanpa memberontak terhadap masyarakat. Para cendekiawan dan sejarawan membedakan hal ini dari pemberontakan: pemberontakan adalah perlawanan paksa terhadap penguasa, sedangkan reformasi adalah perubahan melalui kata-kata dan perbuatan, bukan senjata. Hal ini mencakup para reformator awal dakwah Islam yang mengajar, menulis, dan mendirikan lembaga-lembaga—seperti Abd al-Hamid ibn Badis dan Ikhwanul Muslimin di Maroko dan Asosiasi Cendekiawan Muslim Aljazair—hingga para reformator negara Ottoman dalam gerakan Tanzimat, dan saat ini hingga para reformator pendidikan, studi Islam, dan kegiatan amal. Peran mereka dimulai dengan penjelasan dan pengajaran yang jelas, dan dampaknya akan sempurna ketika hal itu diikuti."
