summary:
  ar: "المصلح من يعمل على إصلاح دين الناس ودنياهم — تعليماً وتوجيهاً وتنظيماً وتجديداً — من غير خروج على الجماعة؛ والفقهاء والمؤرخون يفرّقونه عن الثائر: فالبغي خروج بالقوة على الإمام، والإصلاح غيّر بالكلمة والعمل لا بالسلاح. من أوله مصلحو الدعوة الذين علّموا وكتّبوا وأنشأوا — عبد الحميد بن باديس والإخوان المصلحون في المغرب وجمعية العلماء في الجزائر — وصولاً إلى مصلحي الدولة العثمانية في التنظيمات، واليوم مصلحو التعليم والتعليم الشرعي والعمل الخيري؛ دورٌ كلمته الأولى البيان والتدريس، ويكتمل أثره بأن يُتَّبع."
  en: "The muslih works to mend people's faith and world — through teaching, guidance, organisation and renewal — without breaking away from the community; the jurists and historians distinguish him from the rebel, for baghy is a forcible rising against the imam while islah changes by word and work, not by arms. From the earliest reformers of the da'wah who taught, wrote and founded — Abd al-Hamid ibn Badis, the Moroccan reformists and the Association of Algerian Ulama — through the Ottoman Tanzimat statesmen, to today's reformers of schooling and charitable work: a role whose first instrument is statement and teaching, and whose effect is completed only when it is followed."
  ur: "مصلح وہ ہے جو لوگوں کے دین اور دنیا کی اصلاح — تعلیم، رہنمائی، تنظیم اور تجدید کے ذریعے — جماعت سے بغاوت کیے بغیر کرتا ہے؛ فقہا اور مؤرخین اسے باغی سے جدا کرتے ہیں، کیونکہ بغی امام کے خلاف قوت سے خروج ہے جبکہ اصلاح ہتھیار سے نہیں بلکہ کلام اور عمل سے تبدیل کرتی ہے۔ اولین دعوت مصلحین جو سکھایا، لکھا اور ادارے بنائے — عبدالحمید بن بادیس، مراکش کے مصلحین اور جمعیت علمائے الجزائر — سے عثمانی تنظیمات کے سیاست دانوں اور آج کے تعلیم و خیریہ مصلحین تک: ایسا کردار جس کا پہلا آلہ بیان اور تدریس ہے اور جس کا اثر تب کامل ہوتا ہے جب پیروی ہو۔"
