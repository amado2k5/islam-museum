summary:
  ar: "الدلّال من يتوسّط بين البائع والمشتري حتى يتمّ البيع، ومنه في المدن الإسلامية صنفان: دلّال التجارة يجري بالبضاعة في الأسواق منادياً على الثمن حتى يقع العقد ويأخذ «الدلّالية»، ودلّال الأخبار يطوف الأسواق منادياً بالخبر والأمر السلطاني. عُرف السمسار والدلّال منذ عصر النبوة، وتخصّص الدلّالون بأصناف البضائع في فاطميين ومماليك، وتنظّموا في لجان عثمانية برأسهم الدلّال باشي والأمين، وكانت الدلّالة النساء يدخلن الحرملك بائعات القماش، وكان منهم دلّالو سوق الجوار."
  en: "The dallal stood between buyer and seller until the bargain was struck, and the Islamic city knew two kinds: the trade dallal who carried the goods up and down the market crying the last bid until the sale was made and taking his dellaliye fee, and the news dallal who proclaimed tidings and sultanic orders through the bazaars. Broker and crier are known from the prophetic age; the Fatimids let dallals deal only in certain goods, the Mamluks charged them two per cent on their sales, and the Ottomans organised them in guilds under a dellalbaşı and an emin, with women dellale selling cloth inside the harems and esirci dallals working the slave market."
  ur: "دلّال وہ تھا جو خریدار اور بیچنے والے کے درمیان معاملہ پورا کراتا۔ اسلامی شہر میں دو قسمیں ملتی ہیں: تجارتی دلّال جو بازار میں مال لے کر بولیاں پکارتا اور فروخت پر دلّالیہ اجرت لیتا، اور خبری دلّال جو بازاروں میں حکم اور خبر کا اعلان کرتا۔ یہ صنعت نبوی زمانے سے معلوم ہے؛ فاطمیوں میں دلّال صرف مخصوص جنسوں میں وساطت کرتے تھے، ممالیک کے یہاں فروخت کا دو فیصد دلّالیہ ملتا جس کا آدھا حصہ حکومت کو جاتا تھا، اور عثمانیوں میں یہ لوگ دلّال باشی اور امین کے نیچے انجمنوں میں منظم تھے، ان میں حرم میں کپڑا بیچنے والی دلّالے عورتیں اور بازارِ غلاماں کے اسرجی دلّال بھی شامل تھے۔"
