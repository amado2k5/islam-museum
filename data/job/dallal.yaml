training:
  mode: apprenticeship
  certification: "The dellal worked inside the guild: Mehmed II's kanunname has corrupt dellals dismissed by the simsars and their dellal berats taken, and the guild emins policed honesty; practising without a berth was forbidden, and a dellal might not broker outside the trade he was bound to. In fiqh the brokerage is a two-sided binding contract of hire: the fee must be known and lawful, and the Prophet's warning to the simsars of Baqi — to avoid oaths and empty talk — stands as the craft's charter."
