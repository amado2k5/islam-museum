summary:
  ar: "الدلّال من يتوسّط بين البائع والمشتري حتى يتمّ البيع، ومنه في المدن الإسلامية صنفان: دلّال التجارة يجري بالبضاعة في الأسواق منادياً على الثمن حتى يقع العقد ويأخذ «الدلّالية»، ودلّال الأخبار يطوف الأسواق منادياً بالخبر والأمر السلطاني. عُرف السمسار والدلّال منذ عصر النبوة، وتخصّص الدلّالون بأصناف البضائع في فاطميين ومماليك، وتنظّموا في لجان عثمانية برأسهم الدلّال باشي والأمين، وكانت الدلّالة النساء يدخلن الحرملك بائعات القماش، وكان منهم دلّالو سوق الجوار."
  en: "The dallal stood between buyer and seller until the bargain was struck, and the Islamic city knew two kinds: the trade dallal who carried the goods up and down the market crying the last bid until the sale was made and taking his dellaliye fee, and the news dallal who proclaimed tidings and sultanic orders through the bazaars. Broker and crier are known from the prophetic age; the Fatimids let dallals deal only in certain goods, the Mamluks charged them two per cent on their sales, and the Ottomans organised them in guilds under a dellalbaşı and an emin, with women dellale selling cloth inside the harems and esirci dallals working the slave market."
  ur: "دلّال وہ تھا جو خریدار اور بیچنے والے کے درمیان معاملہ پورا کراتا۔ اسلامی شہر میں دو قسمیں ملتی ہیں: تجارتی دلّال جو بازار میں مال لے کر بولیاں پکارتا اور فروخت پر دلّالیہ اجرت لیتا، اور خبری دلّال جو بازاروں میں حکم اور خبر کا اعلان کرتا۔ یہ صنعت نبوی زمانے سے معلوم ہے؛ فاطمیوں میں دلّال صرف مخصوص جنسوں میں وساطت کرتے تھے، ممالیک کے یہاں فروخت کا دو فیصد دلّالیہ ملتا جس کا آدھا حصہ حکومت کو جاتا تھا، اور عثمانیوں میں یہ لوگ دلّال باشی اور امین کے نیچے انجمنوں میں منظم تھے، ان میں حرم میں کپڑا بیچنے والی دلّالے عورتیں اور بازارِ غلاماں کے اسرجی دلّال بھی شامل تھے۔"
  es: "El dallal se interponía entre comprador y vendedor hasta que se cerraba el trato, y en la ciudad islámica se conocían dos tipos: el dallal comerciante, que transportaba las mercancías de un lado a otro del mercado pregonando la última puja hasta que se realizaba la venta y cobrando su comisión dellaliye, y el dallal de noticias, que proclamaba novedades y órdenes sultánicas por los bazares. Los intermediarios y pregoneros se conocen desde la época profética; los fatimíes permitían a los dallals comerciar solo con ciertos productos, los mamelucos les cobraban un dos por ciento sobre sus ventas, y los otomanos los organizaban en gremios bajo un dellalbaşı y un emin, con mujeres dellale vendiendo telas dentro de los harenes y esirci dallals trabajando en el mercado de esclavos."
  fr: "Le dallal servait d'intermédiaire entre l'acheteur et le vendeur jusqu'à la conclusion de la transaction. Dans les villes islamiques, on distinguait deux types de dallal: le dallal marchand, qui transportait les marchandises à travers le marché en criant la dernière enchère jusqu'à la vente et en percevant sa commission, et le dallal de nouvelles, qui proclamait les nouvelles et les ordres du sultanat dans les bazars. Les fonctions de courtier et de crieur public sont connues depuis l'époque prophétique. Les Fatimides limitaient le commerce des dallals à certains produits, les Mamelouks leur prélevaient deux pour cent sur leurs ventes, et les Ottomans les organisaient en guildes sous l'autorité d'un dellalbaşı et d'un émin. Les femmes dallal vendaient des tissus dans les harems et les esirci dallal géraient le marché aux esclaves."
  tr: "Komisyoncu, bir satış tamamlanana kadar alıcı ve satıcı arasında arabuluculuk yapan kişidir. İslam şehirlerinde iki tür komisyoncu vardı: Malları pazarlarda taşıyan, sözleşme kesinleşene ve komisyonunu alana kadar fiyatı yüksek sesle söyleyen tüccar komisyoncu; ve pazarlarda dolaşarak haberleri ve kraliyet fermanlarını duyuran haber komisyoncusu. Komisyoncular ve aracılar Peygamberimiz zamanından beri biliniyordu. Fatımi ve Memlük dönemlerinde komisyoncular belirli mal türlerinde uzmanlaşmış ve baş komisyoncu ve sekreterin başkanlık ettiği Osmanlı komitelerinde örgütlenmişlerdir. Kadın komisyoncular da kumaş satıcısı olarak haremde yer almış ve El-Cevara pazarında da komisyoncular bulunmuştur."
  id: "Seorang makelar adalah seseorang yang menjadi perantara antara pembeli dan penjual hingga transaksi jual beli selesai. Di kota-kota Islam, terdapat dua jenis makelar: makelar pedagang, yang membawa barang dagangan melalui pasar, meneriakkan harga hingga kontrak diselesaikan dan ia menerima komisinya; dan makelar berita, yang berkeliling pasar mengumumkan berita dan dekrit kerajaan. Makelar dan perantara telah dikenal sejak zaman Nabi. Makelar mengkhususkan diri pada jenis barang tertentu selama periode Fatimiyah dan Mamluk, dan mereka diorganisir menjadi komite Ottoman yang dipimpin oleh makelar utama dan sekretaris. Makelar perempuan juga memasuki harem sebagai penjual kain, dan terdapat makelar di pasar Al-Jawarah."
