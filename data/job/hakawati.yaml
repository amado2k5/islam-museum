training:
  mode: mouth-to-mouth
  certification: "The religious qāss needed permission — the scholars held that no one might preach kisas without the emir's licence, and required the qualities of piety and learning; Ibn al-Jawzi's Kitab al-Qussas wa'l-mudhakkirin is the entry's standing witness. The popular meddah learned by watching and serving the masters of the coffeehouse stage; his craft was memorised repertory, mimicry of voices and the patter of the tale."
  duration: "Apprenticeship in the listening-room; the ozan and meddah line was carried inside the community, in the aşiret life of the Turks and later in the coffeehouses."
