places:
  - { place: place/mecca, note: "The Prophet himself gave wa'z and counsel and told exemplary kisas in his sermons, and the meddahs count Hassan ibn Thabit — who praised the Prophet in verse — as the first of their craft; Evliya Çelebi names Suhayb al-Rumi (Abdulwahhab Gazi) as the meddahs' pir and places his tomb at Sivas.", sources: [source/tdv-kussas, source/tdv-meddah] }
  - { place: place/istanbul, note: "In Ottoman Istanbul the kıssahan told his tales in the markets, the mansions and the palace; as the tellers drifted from religious to secular matter they borrowed the imitation of voices and the freer anecdotes, while the meddah kept both the praise-repertory and the comic tale.", sources: [source/tdv-kissahan, source/tdv-meddah] }
  - { place: place/karbala, note: "The Iranian line of the craft split by repertory: the şahnâmehan recited the Shahnameh tales from memory, the rûzehan narrated the events of Karbala as a professional lamenter, and the perdedârî told the sorrows of the ahl al-bayt before a curtain.", sources: [source/tdv-kissahan] }
