summary:
  ar: "الحكواتي راوي القصص في الأسواق والمقاهي والقصور، وله أسماء على قدر اللسان والمقام: قصّة خوان ونقّال وشاهنامه خوان وروزه خوان ومدّاح. كان القصّ عند العرب الجاهليين مهنةً تروي أيام العرب وأخبارهم، ثم صار بعد مقتل عثمان قصصاً دينياً في المساجد حتى اعترض عليه المحدثون واشترطوا في القاصّ الإذن والصلاحية. وعند الترك ورث المدّاح عن الباقصي والأوزان حكايات البطولة يؤديها أمام الجمهور مقلّداً الأصوات والحركات، ويروي المدّاح أنساب صنعته إلى سوهيب الرومي وإلى حسّان بن ثابت الذي مادح النبي بالشعر."
  en: "The hakawati tells the tales in the markets, coffeehouses and palaces; his name shifts with tongue and setting: kissahan, nakkāl, şahnâmehan, rûzehan, meddâh. Among the Jahiliyya Arabs storytelling was already a trade recounting the ayyam and akhbar of the tribes; after the killing of Uthman it turned religious in the mosques, until the hadith scholars objected and demanded licence and qualification of the qāss. Among the Turks the meddah inherited the heroic tales of the baksı and the ozan, performing before the crowd with imitations of voices and movements, and the guild told its lineage from Suhayb al-Rumi and from Hassan ibn Thabit who praised the Prophet in verse."
  ur: "حکواتی بازاروں، قہہ خانوں اور محلوں میں قصے کہانیاں سنانے والا ہے؛ زبان اور مقام کے حساب سے اس کے نام بدلتے ہیں: قصّہ خوان، نقّال، شاہنامہ خوان، روزہ خوان، مدّاح۔ جاہلی عرب میں قصہ گوئی ایام عرب اور اخبار بیان کرنے کا پیشہ تھی؛ عثمان کے قتل کے بعد یہ مسجدوں میں دینی وعظ بن گئی، یہاں تک کہ محدثین نے اعتراض کیا اور قاص کے لیے اجازت و اہلیت شرط ٹھہری۔ ترکوں میں مدّاح باقصی اور اوزان کی ہیرو کہانیوں کا وارث بنا، وہ تماشائیوں کے سامنے آوازیں اور حرکات نقل کر کے پیش کرتا، اور یہ صنعت اپنا سلسلہ سہیب رومی اور حسّان بن ثابت سے جوڑتی ہے جس نے نبی کی مدح شعر میں کہی۔"
  es: "El hakawati cuenta los cuentos en los mercados, cafés y palacios; su nombre cambia según la lengua y el lugar: kissahan, nakkāl, şahnâmehan, rûzehan, meddâh. Entre los árabes de la época preislámica, la narración de cuentos ya era un oficio que relataba los ayyam y akhbar de las tribus; después del asesinato de Uthman, se volvió religiosa en las mezquitas, hasta que los eruditos del hadiz se opusieron y exigieron licencia y cualificación para el qāss. Entre los turcos, el meddah heredó los cuentos heroicos del baksı y el ozan, actuando ante la multitud con imitaciones de voces y movimientos, y el gremio contaba su linaje desde Suhayb al-Rumi y desde Hassan ibn Thabit, quien alabó al Profeta en verso."
  fr: "Le conteur hakawati narre les histoires sur les marchés, dans les cafés et les palais; son nom varie selon la langue et le lieu: kissahan, nakkāl, şahnâmehan, rûzehan, meddâh. Chez les Arabes de l’époque préislamique (Jahiliyya), la narration était déjà un métier, consistant à relater les ayyam et akhbar des tribus; après l’assassinat d’Uthman, elle prit une dimension religieuse dans les mosquées, jusqu’à ce que les érudits du hadith s’y opposent et exigent une réglementation et une qualification du qāss. Chez les Turcs, le meddah hérita des récits héroïques du baksı et de l’ozan, se produisant devant la foule avec des imitations de voix et de mouvements, et la guilde se réclamait de Suhayb al-Rumi et de Hassan ibn Thabit, qui louait le Prophète en vers."
