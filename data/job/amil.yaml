summary:
  ar: "العامل في تاريخ الدول الإسلامية موظف على العموم، وجابي ضريبة على الخصوص. من العهد النبوي كان يقدّر الزكاة وغيرها من موارد الدولة ويجبيها ويقسمها. ثم ضاقت الكلمة أو اتسعت بحسب العصر: والٍ، وجابي خراج، وفي القوانين العثمانية مأمور جباية أو ملتزم أو من يجبي باسم الملتزم. وكتب الفقه تفرد عامل الزكاة بشروط وأجر يُؤخذ من الزكاة."
  en: "In the history of Muslim states the amil was an official in general and a tax collector in particular. From the prophetic period he assessed, collected and divided zakat and the state's other revenues. The word then narrowed or widened by period: a governor, a collector of the land tax, and in the Ottoman codes a collector, a tax farmer, or a man collecting in a tax farmer's name. The law books treat the zakat amil apart, with conditions and a wage taken from the zakat."
  ur: "اسلامی ریاستوں کی تاریخ میں عامل عموماً ایک اہلکار تھا اور خصوصاً محصلِ ٹیکس۔ عہدِ نبوی سے وہ زکوٰۃ اور ریاست کی دوسری آمدنی کا تخمینہ لگاتا، وصول کرتا اور تقسیم کرتا تھا۔ پھر یہ لفظ دور کے لحاظ سے تنگ یا وسیع ہوا: والی، خراج کا محصل، اور عثمانی قوانین میں وصول کنندہ، ٹھیکیدار، یا ٹھیکیدار کے نام پر وصول کرنے والا۔ فقہ کی کتابیں عاملِ زکوٰۃ کو الگ شرائط اور زکوٰۃ سے ملنے والی اجرت کے ساتھ بیان کرتی ہیں۔"
  es: "En la historia de los estados musulmanes, el amil era un funcionario en general y un recaudador de impuestos en particular. Desde la época profética, evaluaba, recaudaba y distribuía el zakat y los demás ingresos del estado. El término se fue ampliando o restringiendo según la época: gobernador, recaudador del impuesto sobre la tierra, y en los códigos otomanos, recaudador, recaudador de impuestos o persona que recaudaba en nombre de un recaudador de impuestos. Los textos legales tratan al zakat amil por separado, con condiciones y un salario que se deducía del zakat."
  fr: "Dans l'histoire des États musulmans, l'amil désignait un fonctionnaire en général et un collecteur d'impôts en particulier. Dès l'époque prophétique, il était chargé d'évaluer, de collecter et de distribuer la zakat et les autres revenus de l'État. Le sens du terme a ensuite varié selon les périodes: gouverneur, collecteur de l'impôt foncier, et dans les codes ottomans, collecteur, fermier d'impôts, ou personne collectant au nom d'un fermier d'impôts. Les textes juridiques traitent l'amil de la zakat à part, en précisant les conditions et la rémunération prélevée sur la zakat."
  tr: "İslam devletlerinin tarihinde \"işçi\" terimi genellikle bir çalışanı, özellikle de vergi tahsildarını ifade eder. Peygamberimiz zamanından beri işçi, zekât ve diğer devlet gelirlerini değerlendirmek, toplamak ve dağıtmakla sorumluydu. Terim daha sonra döneme bağlı olarak daraldı veya genişledi: vali, vergi tahsildarı ve Osmanlı hukukunda vergi tahsildarı veya vergi tahsildarı adına tahsilat yapan kişi. İslam hukuk metinleri, zekât tahsildarlarının şartlarını ve zekât fonlarından alınan ücreti belirtir."
  id: "Dalam sejarah negara-negara Islam, istilah \"pekerja\" umumnya merujuk pada seorang karyawan, dan secara khusus pada pemungut pajak. Sejak zaman Nabi, pekerja bertanggung jawab untuk menilai, mengumpulkan, dan mendistribusikan Zakat dan pendapatan negara lainnya. Istilah tersebut kemudian menyempit atau meluas tergantung pada zamannya: gubernur, pemungut pajak, dan dalam hukum Ottoman, pemungut pajak, atau orang yang mengumpulkan atas nama pemungut pajak. Teks-teks yurisprudensi Islam menetapkan syarat dan biaya bagi pemungut Zakat, yang diambil dari dana Zakat."
