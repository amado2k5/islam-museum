  mode: state-licence
  certification: "The entry says Umar gave each amil a diploma that set out his duties and his powers, and told him the rules he was to keep. In the law books, al-Mawardi splits the zakat amil into one with full discretion and one limited to a stated charge. The entry says the jurists require the zakat amil to be of full legal capacity, trustworthy, knowing the rules of zakat, and free. It says being Muslim is required only of the amil with full discretion."
