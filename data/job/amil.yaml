summary:
  ar: "العامل في تاريخ الدول الإسلامية موظف على العموم، وجابي ضريبة على الخصوص. من العهد النبوي كان يقدّر الزكاة وغيرها من موارد الدولة ويجبيها ويقسمها. ثم ضاقت الكلمة أو اتسعت بحسب العصر: والٍ، وجابي خراج، وفي القوانين العثمانية مأمور جباية أو ملتزم أو من يجبي باسم الملتزم. وكتب الفقه تفرد عامل الزكاة بشروط وأجر يُؤخذ من الزكاة."
  en: "In the history of Muslim states the amil was an official in general and a tax collector in particular. From the prophetic period he assessed, collected and divided zakat and the state's other revenues. The word then narrowed or widened by period: a governor, a collector of the land tax, and in the Ottoman codes a collector, a tax farmer, or a man collecting in a tax farmer's name. The law books treat the zakat amil apart, with conditions and a wage taken from the zakat."
  ur: "اسلامی ریاستوں کی تاریخ میں عامل عموماً ایک اہلکار تھا اور خصوصاً محصلِ ٹیکس۔ عہدِ نبوی سے وہ زکوٰۃ اور ریاست کی دوسری آمدنی کا تخمینہ لگاتا، وصول کرتا اور تقسیم کرتا تھا۔ پھر یہ لفظ دور کے لحاظ سے تنگ یا وسیع ہوا: والی، خراج کا محصل، اور عثمانی قوانین میں وصول کنندہ، ٹھیکیدار، یا ٹھیکیدار کے نام پر وصول کرنے والا۔ فقہ کی کتابیں عاملِ زکوٰۃ کو الگ شرائط اور زکوٰۃ سے ملنے والی اجرت کے ساتھ بیان کرتی ہیں۔"
