summary:
  ar: "الجبّاص هو من يكسو الجدران بالجصّ والجير والمونة. يضع ابن الأخوة الجبّاصين في باب البنّائين ويضبط خلطتهم: ألا يزيدوا الجير في الجصّ الأبيض سعياً للسهولة في اللطخ، فإن زاد سقط الجصّ من الجدار عند ترميمه؛ ويضبط الجير نفسه فعلامة نضجه أن يصفرّ في التنّور قبل الطحن وأن يجفّ سريعاً إذا خُلط بالماء، ولا يُستعمل جير عتيق. ويحلف البنّاءون ألا يقبلوا رشوة حرّاقي الجير وصنّاع الجبس. وفي موكب إوليا يمرّ الجبّاصون ⁦(علچجيان)⁩ خمسمئة رجل بخمس وعشرين دكاناً يديرون طواحين جبسهم في المسير، ومعهم صنّاع المونة والكلس بأنواعه وصنّاع اللوقون لأعمال المياه، والمبيّضون ⁦(بداناجي)⁩ يحملون أحواض الغسالة وسيخاً طوالاً أطرافها فرش من شعر الخنزير يبيّضون بها الجدران. وفي قاهرة القرن التاسع عبر كان الجصّاصون بين مهاجري البناء من مالطة وإيطاليا واليونان."
  en: "The jabbas coated the walls with gypsum plaster, lime and mortar. Ibn al-Ukhuwwa puts the plasterers in the builders' chapter and regulates their mix: they must not add too much lime to the white plaster for ease of spreading, for with an excess it falls from the wall when the owner repairs it; and he regulates the lime itself — the mark of well-burnt lime is that it turns yellow in the kiln before grinding and dries quickly once mixed with water, and no old lime may be used. The masons swear not to take the lime-burners' and gypsum-makers' bribes. In Evliya's procession the plasterers (Alchejian) pass five hundred men with twenty-five shops, putting their plaster-mills in motion as they march, and with them the mortar-makers, the chalk-makers of every kind, the makers of water-proofing loqun, and the whitewashers (Badanaji) carrying troughs of marble-chalk wash and long poles tipped with swine-bristle brushes for whitening walls. In nineteenth-century Cairo the plasterers were among the building trades' migrants from Malta, Italy and Greece."
  ur: "جبّاص دیواروں پر گچ، چونہ اور مونة کی لیپ چڑھاتا تھا۔ ابن الاخوہ جبّاصوں کو مستریوں کے باب میں رکھ کر ان کی مِکس ضبط کرتا ہے: وہ سفید پلستر میں بکھانے کی آسانی کے لیے زیادہ چونہ نہ ملائیں کہ زیادہ ہونے پر مالک کی مرمت پر پلستر دیوار سے گر پڑتا ہے؛ اور چونے کو خود ضبط کرتا ہے: پکے چونے کی پہچان بھٹے میں پیسنے سے پہلے زرد ہونا اور پانی ملاتے ہی جلد سوکھنا ہے، اور پرانا چونہ استعمال نہ ہو۔ مستری قسم کھاتے ہیں کہ چونا بھٹھے والوں اور گچ سازوں کی رشوت نہ لیں۔ اولیہ چلبی کے جلوس میں جبّاص ⁦(علچیجیان)⁩ پانچ سو آدمی پچیس دکانوں کے ساتھ اپنی جبس کی چکیاں چلتے چلتے چلاتے ہیں، اور ان کے ساتھ مونة ساز، ہر قسم کے چاک ساز، پانی کے کاموں کا لیقون بنانے والے، اور سفیدی کرنے والے ⁦(بداناجی)⁩ جو سنگ مرمر کے چاک کی لیپ کے حوض اور سور کی کھال کے بالوں کی برش والی لمبی چھڑیاں اٹھا کر دیواریں سفید کرتے ہیں۔ انیسویں صدی کے قاہرہ میں جبّاص مالٹا، اٹلی اور یونان سے آئے تعمیری مہاجروں میں تھے۔"
