  materials: [stone]
  techniques:
    ar: "يضبط ابن الأخوة خلطة الجبّاصين: ألا يُزاد الجير في الجصّ الأبيض عند عجنه لتسهيل لطخه على الجدران، فإن كثر سقط الجصّ من الحائط حين يرمّمه صاحبه. ويضبط الجير نفسه: علامة الناضج أن يصفرّ في التنّور قبل أن يُطحن، وإذا خُلط بالماء وجُعل في إناء جفّ سريعاً وإلا فهو مغشوش، ولا يُستعمل جير عتيق ولا غير الجيد. ويحلف البنّاءون ألا يقبلوا رشوة أو هدية من حرّاقي الجير وصنّاع الجبس ليسكتوا عن رداءته. ولا يُطَلَّ الفرن إلا بطين نقي ممزوج بماء طاهر، لا بطين مأخوذ من دكاكينهم ممزوج بدم وروث. ويصف إوليا الجبّاصين يديرون طواحين جبسهم في الموكب، وصنّاع الكلس يكسرونه ويبيّضون وجوههم وثيابهم به، والمبيّضين يحملون أحواضاً فيها كلس الرخام ممزوجاً غسالةً وسيخاً طوالاً في أطرافها فرش يمسحون بها الجدران."
    en: "Ibn al-Ukhuwwa regulates the plasterers' mix: they must not add too much lime to the white plaster when it is being made into a paste for ease of spreading on walls, for with an excess of lime the plaster falls from the wall when the owner repairs it. He regulates the lime itself: the mark of well-burnt lime is that it turns yellow in the kiln before it is ground, and once mixed with water and placed in a vessel it dries quickly, otherwise it is adulterated; no old lime may be used, only the best. The masons swear not to take bribes or gifts from the lime-burners and gypsum-makers to stay silent about poor quality. Only clean earth mixed with pure water may be used to plaster the ovens, never earth taken from the shops mixed with blood and dung. Evliya describes the plasterers setting their plaster-mills in motion in the procession, the chalk-makers crunching chalk and whitening their faces and dress with it, and the whitewashers carrying troughs of marble chalk made into a wash and long poles tipped with brushes with which they whiten the walls."
    ur: "ابن الاخوہ جبّاصوں کی مِکس ضبط کرتا ہے: وہ سفید پلستر میں دیواروں پر بکھانے کی آسانی کے لیے زیادہ چونہ نہ ملائیں، کہ زیادہ چونے سے مالک کی مرمت پر پلستر دیوار سے گر پڑتا ہے۔ وہ چونے کو خود ضبط کرتا ہے: پکے چونے کی پہچان یہ ہے کہ بھٹے میں پیسنے سے پہلے زرد ہو، اور پانی میں ملاکر برتن میں رکھنے پر جلد سوکھ جائے ورنہ ملاوٹ ہے؛ نہ پرانا چونہ چلے نہ نااہل۔ مستری قسم کھاتے ہیں کہ وہ چونا بھٹھے والوں اور گچ سازوں سے خرابی پر خاموش رہنے کے لیے رشوت یا تحفہ نہ لیں۔ تنور پر صرف پاک مٹی صاف پانی ملا کر لیپ ہو، نہ کہ دکانوں کی مٹی جو خون اور لید ملی ہو۔ اولیہ چلبی جبّاصوں کو جلوس میں جبس کی چکیاں چلاتے، چاک سازوں کو چاک کٹتے اور اپنے چہرے اور کپڑے اس سے سفید کرتے، اور سفیدی کرنے والوں کو سنگ مرمر کے چاک کی لیپ بھرے حوض اور لمبی چھڑیں جن کے سروں پر برش ہیں اور جن سے وہ دیواریں سفید کرتے ہیں، بیان کرتا ہے۔"
