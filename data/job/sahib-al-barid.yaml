    status: historical
    note: "The entry says the Prophet sent letters by special messengers, and that a systematic postal service was set up by Muawiya (661–680). The widest range the entry supports runs from the Prophet's years to his reign. The title sahib al-barid is attested under the Umayyads."
    sources: [source/tdv-berid]
  status_today: replaced
places:
  - place: place/damascus
    note: "Muawiya was the first Umayyad caliph to set up a systematic postal service, with four million dirhams taken from the treasury for it, according to the entry."
    sources: [source/tdv-berid]
  - place: place/baghdad
    note: "Under the Abbasids the postal office (Diwan al-Barid) had about 930 stations, and the office also gathered intelligence. Al-Mahdi restored the link between Baghdad and Byzantine ports, according to the entry."
    sources: [source/tdv-berid]
  - place: place/cairo
    note: "Under the Mamluks Baybars revived the postal service, and the entry gives journey times of about four days from Cairo to Damascus and five to Aleppo."
    sources: [source/tdv-berid]
  - place: place/kufa
    note: "Under Umar post houses were built near Kufa for officials to stay in, according to the entry."
    sources: [source/tdv-berid]
