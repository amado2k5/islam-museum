id: job/sahib-al-barid
class: job
label: { ar: "صاحب البريد", en: "Postmaster and intelligence chief (sahib al-barid)", ur: "صاحبِ بَرید ⁦(ڈاک اور خفیہ اطلاعات کا سربراہ)⁩" }
summary:
  ar: "صاحب البريد هو رئيس مصلحة البريد والاستخبارات في الدولة الإسلامية، يتولى نقل أوامر الحاكم إلى الولاة وأخبارهم إليه، ويرفع إليه ما يعرفه من أحوال الرعية والعمال. وقد كان للمنصب تنظيم في الدولتين الأموية والعباسية وفي الدول التالية، ثم تغيّر مع الدولة العثمانية إلى البريد الحديث في القرن التاسع عشر."
  en: "The sahib al-barid was the head of the state postal and intelligence service. He carried the ruler's orders to the governors and their reports back, and he brought the ruler what he learned of the people and the officials. The post had a settled organisation under the Umayyads, the Abbasids and the states that followed. The Ottomans changed it into a modern postal service in the nineteenth century."
  ur: "صاحبِ بَرید ریاست کی سرکاری ڈاک اور خفیہ اطلاعات کی مصلحت کا سربراہ تھا۔ وہ حاکم کے احکام گورنروں تک پہنچاتا اور ان کی رپورٹیں واپس لاتا، اور رعایا اور عہدیداروں کے حالات سے حاکم کو آگاہ کرتا تھا۔ اموی، عباسی اور بعد کی ریاستوں میں اس منصب کا ایک مستقل نظام تھا، اور عثمانیوں نے انیسویں صدی میں اسے جدید ڈاک میں بدل دیا۔"
