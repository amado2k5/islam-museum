places:
  - { place: place/yemen, note: "Ibn Hawshab, called Mansur al-Yaman, founded the first Ismaili state in Yemen as a dai; the Tayyibi-Musta'li branch later made the dāʿī mutlaq the community's supreme authority in the imam's concealment, his seat at San'a and his counterpart of the Da'udi branch at Bombay.", sources: [source/tdv-dai] }
  - { place: place/cairo, note: "In the Fatimid state the dāʿī al-duʿāt held a rank equal to vizier for religious affairs, and Fatimid-era dais were trained in Qur'an, ta'wil, fiqh, all branches of hadith, da'wa theory, disputation, religious tales, philosophy — especially emanation — and logic.", sources: [source/tdv-dai] }
  - { place: place/alamut, note: "Among the Nizaris after the move to Iran, when no manifest imam was present the dai of Isfahan led the community; from Hasan Sabbah until the appearance of Hasan Ala Zikrihi's-Salam in 1164 the lords of Alamut stood as the hidden imam's natural dai, Hasan himself reckoned above the dailik as hujja.", sources: [source/tdv-dai] }
