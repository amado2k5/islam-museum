summary:
  ar: "الداعي من يدعو الناس إلى دينه أو مذهبه؛ وإن راج اللفظ في مذاهب شتى فأشهر استخدامه في الدعوة الإسماعيلية، حيث كان الداعي موظفاً يعينه الإمام في مرتبة بعد الحجة، ضمن سلسلة مراتب تبدأ بداعي الدعاة المتحدث باسم الإمام فداعي البلاغ فالمطلق فالمأذون فالمحدود فالجناح. تلقى الداعي تعليماً واسعاً في القرآن والتأويل والفقه والحديث ونظرية الدعوة والمناظرة والفلسفة، ولم يكن مجرد داعية: قبض العهد والبيعة باسم الإمام، وأدار، وقاد جيوشاً — منهم ابن حوشب في اليمن وأبو عبد الله الشيعي مؤسس دولة الفاطميين وأبو سعيد الجنابي في البحرين."
  en: "The dāʿī calls people to his religion or doctrine. The word circulated in several traditions, but its classic home is the Ismaili daʿwa, where the dai was an officer appointed by the imam in a rank below the hujja, inside a hierarchy running from the dāʿī al-duʿāt — the imam's spokesman — through the dāʿī al-balāgh, the dāʿī mutlaq, the dāʿī ma'zūn and the dāʿī mahdūd down to the janāḥ. He was schooled in Qur'an, ta'wil, fiqh, hadith, da'wa theory, disputation and philosophy, and he was no mere preacher: he took covenant and bay'a in the imam's name, administered and led armies — Ibn Hawshab in Yemen, Abu Abdallah al-Shi'i who prepared the Fatimid state, and Abu Sa'id al-Jannabi in Bahrain."
  ur: "داعی وہ ہے جو لوگوں کو اپنے دین یا مسلک کی طرف بلاتا ہے۔ لفظ کئی روایات میں آیا، مگر اس کا کلاسیکی گھر اسماعیلی دعوت ہے، جہاں داعی امام کا مقرر کردہ افسر تھا، حجت کے بعد کے درجے میں، داعی الدعات سے داعی البلاغ، داعی مطلق، داعی مأذون اور داعی محدود ہوتے ہوئے جناح تک کی درجہ بندی میں۔ وہ قرآن، تأویل، فقہ، حدیث، دعوت کے نظریے، مناظرے اور فلسفہ پڑھاتا، اور محض واعظ نہ تھا: امام کے نام پر عہد و بیعت لیتا، انتظام چلاتا اور فوج کی قیادت کرتا — یمن میں ابن حوشب، فاطمی ریاست کی بنیاد رکھنے والا ابو عبدالله الشیعی اور بحرین میں ابو سعید جنابی۔"
  es: "El dāʿī llama a la gente a su religión o doctrina. La palabra circuló en varias tradiciones, pero su hogar clásico es la daʿwa ismaelita, donde el dai era un oficial designado por el imán en un rango inferior al hujja, dentro de una jerarquía que va desde el dāʿī al-duʿāt —el portavoz del imán— pasando por el dāʿī al-balāgh, el dāʿī mutlaq, el dāʿī ma'zūn y el dāʿī mahdūd hasta el janāḥ. Se formó en el Corán, el ta'wil, el fiqh, el hadiz, la teoría de la da'wa, la argumentación y la filosofía, y no fue un simple predicador: hizo pacto y bay'a en nombre del imán, administró y dirigió ejércitos: Ibn Hawshab en Yemen, Abu Abdallah al-Shi'i, quien preparó el estado fatimí, y Abu Sa'id al-Jannabi en Bahréin."
  fr: "Le dāʿī appelle les gens à sa religion ou à sa doctrine. Ce terme a circulé dans plusieurs traditions, mais son usage classique se trouve dans la daʿwa ismaélienne, où le dai était un officier nommé par l'imam, d'un rang inférieur à celui de hujja, au sein d'une hiérarchie allant du dāʿī al-duʿāt — le porte-parole de l'imam — au dāʿī al-balāgh, au dāʿī mutlaq, au dāʿī ma'zūn et au dāʿī mahdūd, jusqu'au janāḥ. Il reçut une formation en Coran, ta'wil, fiqh, hadith, théorie de la da'wa, disputation et philosophie, et il n'était pas un simple prédicateur: il prêta serment d'allégeance au nom de l'imam, administra et dirigea des armées — Ibn Hawshab au Yémen, Abu Abdallah al-Shi'i qui prépara l'État fatimide, et Abu Sa'id al-Jannabi à Bahreïn."
  tr: "Da'i, insanları kendi dinine veya mezhebine çağıran kişidir. Bu terim çeşitli düşünce okullarında kullanılsa da, en yaygın kullanımı İsmailî misyonundadır. Burada Da'i, İmam tarafından Hujja'dan (iman delili) sonra gelen bir rütbede atanan bir yetkilidir. Bu hiyerarşi, Da'ilerin Da'i'si (İmam'ın sözcüsü) ile başlar, ardından Balagh Da'i'si (elçi), sonra Mutlaq (mutlak), sonra Ma'dhun (yetkili), sonra Muhaddud (sınırlı) ve son olarak Janah (kanat) gelir. Da'i, Kur'an, tefsiri, fıkıh, hadis, tebliğ teorisi, münazara ve felsefe konularında kapsamlı bir eğitim almıştır. O sadece bir davetçi değildi: İmam adına biat ve bağlılık yeminleri aldı ve orduları yönetti ve komuta etti; bunlar arasında Yemen'de İbn Havşab, Fatımi devletinin kurucusu Ebu Abdullah el-Şii ve Bahreyn'de Ebu Said el-Cennebi de vardı."
  id: "Da'i adalah orang yang menyeru orang-orang kepada agama atau sektenya. Meskipun istilah ini digunakan dalam berbagai aliran pemikiran, penggunaannya yang paling umum adalah dalam misi Ismaili, di mana Da'i adalah seorang pejabat yang ditunjuk oleh Imam dalam tingkatan setelah Hujja (bukti keimanan), dalam hierarki yang dimulai dengan Da'i Da'i (juru bicara Imam), kemudian Da'i Balagh (utusan), kemudian Mutlaq (mutlak), kemudian Ma'dhun (berwenang), kemudian Muhaddud (terbatas), dan akhirnya Janah (sayap). Da'i menerima pendidikan yang luas dalam Al-Quran, tafsirnya, fiqih, hadits, teori dakwah (misi), debat, dan filsafat. Dia bukan sekadar seorang Da'i: dia menerima janji setia dan sumpah loyalitas atas nama Imam, dan dia mengelola serta memimpin pasukan—di antaranya Ibn Hawshab di Yaman, Abu Abdullah al-Shi'i (pendiri negara Fatimiyah), dan Abu Sa'id al-Jannabi di Bahrain."
