  certification: "Appointed by the imam and answerable up the hierarchy; trained on a curriculum meant to leave him able to answer any questioner without embarrassment — the handbook al-Alim wa'l-ghulam attributed to Ibn Hawshab or his son Ja'far b. Mansur al-Yaman and Abu Hatim al-Razi's Kitab al-Zina served as the dais' manuals."
