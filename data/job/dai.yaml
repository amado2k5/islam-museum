summary:
  ar: "الداعي من يدعو الناس إلى دينه أو مذهبه؛ وإن راج اللفظ في مذاهب شتى فأشهر استخدامه في الدعوة الإسماعيلية، حيث كان الداعي موظفاً يعينه الإمام في مرتبة بعد الحجة، ضمن سلسلة مراتب تبدأ بداعي الدعاة المتحدث باسم الإمام فداعي البلاغ فالمطلق فالمأذون فالمحدود فالجناح. تلقى الداعي تعليماً واسعاً في القرآن والتأويل والفقه والحديث ونظرية الدعوة والمناظرة والفلسفة، ولم يكن مجرد داعية: قبض العهد والبيعة باسم الإمام، وأدار، وقاد جيوشاً — منهم ابن حوشب في اليمن وأبو عبد الله الشيعي مؤسس دولة الفاطميين وأبو سعيد الجنابي في البحرين."
  en: "The dāʿī calls people to his religion or doctrine. The word circulated in several traditions, but its classic home is the Ismaili daʿwa, where the dai was an officer appointed by the imam in a rank below the hujja, inside a hierarchy running from the dāʿī al-duʿāt — the imam's spokesman — through the dāʿī al-balāgh, the dāʿī mutlaq, the dāʿī ma'zūn and the dāʿī mahdūd down to the janāḥ. He was schooled in Qur'an, ta'wil, fiqh, hadith, da'wa theory, disputation and philosophy, and he was no mere preacher: he took covenant and bay'a in the imam's name, administered and led armies — Ibn Hawshab in Yemen, Abu Abdallah al-Shi'i who prepared the Fatimid state, and Abu Sa'id al-Jannabi in Bahrain."
  ur: "داعی وہ ہے جو لوگوں کو اپنے دین یا مسلک کی طرف بلاتا ہے۔ لفظ کئی روایات میں آیا، مگر اس کا کلاسیکی گھر اسماعیلی دعوت ہے، جہاں داعی امام کا مقرر کردہ افسر تھا، حجت کے بعد کے درجے میں، داعی الدعات سے داعی البلاغ، داعی مطلق، داعی مأذون اور داعی محدود ہوتے ہوئے جناح تک کی درجہ بندی میں۔ وہ قرآن، تأویل، فقہ، حدیث، دعوت کے نظریے، مناظرے اور فلسفہ پڑھاتا، اور محض واعظ نہ تھا: امام کے نام پر عہد و بیعت لیتا، انتظام چلاتا اور فوج کی قیادت کرتا — یمن میں ابن حوشب، فاطمی ریاست کی بنیاد رکھنے والا ابو عبدالله الشیعی اور بحرین میں ابو سعید جنابی۔"
