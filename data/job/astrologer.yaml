summary:
  ar: "المنجّم هو من يشتغل بعلم أحكام النجوم، وهو العلم القائم على الاعتقاد بأن مواقع النجوم وحركاتها تكوّن نظام إشارات يمكن منه استنباط علم الغائب والحال والماضي، وقد سمّاه الفارابي أحد علمي النجوم وفرّقه عن علم النجوم التعليمي وهو الفلك الرياضي. كان المنجّمون في العصر العباسي يقترنون بالخلفاء وقادة الجيوش يعيّنون اليوم والساعة التي يُعمل فيها الأمر أو يُترك، ومن منجّمي هارون الرشيد قنقة الهندي. وعند العثمانيين صار رئيسهم المنجّم باشي، وهو الموظف المكلّف بالشؤون المتعلقة بالفلك والتنجيم في الدولة، ومنهم مصطفى بن علي الموقّت الذي صار رئيس المنجّمين بعد سنة 967هـ ⁦(1560م)⁩ واشتهر عند العامة بكوجا ساعتجي."
  en: "The munajjim practised ilm-i ahkam-i nucum, the discipline resting on the belief that the positions and movements of the stars form a system of signs from which knowledge of the future, the present state and the past can be drawn; al-Farabi counts it one of the two sciences of the stars and separates it from ilm-i nujum-i ta'limi, mathematical astronomy proper. In the Abbasid age astrologers were attached to caliphs and army commanders to fix the day and hour on which a thing should or should not be done — Harun al-Rashid had the court astrologer Kanaka al-Hindi. Under the Ottomans their head was the müneccimbaşı, the official charged with astronomy and astrology affairs in the state; Mustafa b. Ali el-Muvakkit became reisülmüneccimin after 967/1560 and was popularly known as Koca Saatçi."
  ur: "منجّم وہ شخص تھا جو علمِ احکامِ نجوم پر کام کرتا تھا — وہ علم جو اس عقیدے پر قائم ہے کہ ستاروں کے مقام اور حرکتیں ایک علامتوں کا نظام بناتی ہیں جس سے مستقبل، حال اور ماضی کا علم حاصل کیا جا سکتا ہے؛ فارابی نے اسے علومِ نجوم میں سے ایک قرار دیا اور اسے ریاضیاتی فلکیات سے الگ کیا۔ عباسی عہد میں منجّم خلفا اور سپہ سالاروں کے ساتھ منسلک رہتے اور ہر کام کا موزوں دن اور گھڑی بتاتے — ہارون الرشید کے درباری منجّم قنقہ ہندی تھے۔ عثمانیوں میں ان کا سردار منجّم باشی تھا، ریاست کا وہ افسر جو فلکیات و نجوم کے معاملات دیکھتا تھا؛ مصطفیٰ بن علی الموقّت 967ھ/1560ء کے بعد رئیس المنجّمین بنا اور عوام میں کوجا ساعتچی کہلایا۔"
  es: "Los munajjim practicaban ilm-i ahkam-i nucum, una disciplina basada en la creencia de que las posiciones y los movimientos de las estrellas forman un sistema de signos a partir del cual se puede obtener conocimiento del futuro, del estado presente y del pasado; al-Farabi la considera una de las dos ciencias de las estrellas y la distingue de ilm-i nujum-i ta'limi, la astronomía matemática propiamente dicha. En la época abasí, los califas y los comandantes del ejército contaban con astrólogos para fijar el día y la hora en que se debía o no realizar una acción; Harun al-Rashid tenía como astrólogo de la corte a Kanaka al-Hindi. Bajo el dominio otomano, su jefe era el müneccimbaşı, el funcionario encargado de los asuntos de astronomía y astrología del estado; Mustafa b. Ali el-Muvakkit se convirtió en reisülmüneccimin después de 967/1560 y era conocido popularmente como Koca Saatçi."
  fr: "Les munajjim pratiquaient l'ilm-i ahkam-i nucum, discipline fondée sur la croyance que les positions et les mouvements des étoiles forment un système de signes permettant de connaître l'avenir, le présent et le passé. Al-Farabi la considère comme l'une des deux sciences des étoiles et la distingue de l'ilm-i nujum-i ta'limi, l'astronomie mathématique proprement dite. À l'époque abbasside, des astrologues étaient attachés aux califes et aux commandants militaires pour déterminer le jour et l'heure propices à telle ou telle action; Harun al-Rashid avait pour astrologue de cour Kanaka al-Hindi. Sous les Ottomans, cette fonction était confiée au müneccimbaşı, fonctionnaire chargé des affaires d'astronomie et d'astrologie au sein de l'État; Mustafa b. Ali el-Muvakkit devint reisülmüneccimin après 967/1560 et était communément appelé Koca Saatçi."
