  techniques:
    ar: "يفصّل الشيزري عمل البيطار: يعاين الكعب ويفحص الحافر قبل الجرد؛ إن كان الحافر معوجّاً جرد الجهة المقابلة ليستوي، وإن كانت قدم الدابة مستقيمة وضع المسامير الصغار خلفاً والكبار أماماً، وإن كانت بالعكس فبالعكس؛ لا يجرد كثيراً فيصيب اللحم، ولا يضع المسامير سائبة فتدخل الحصى والرمل، ولا يشدّها فيعذّب الدابة؛ الحدوة المطرّقة أثبت على الحافر، واللينة تأخذ المسامير الصلبة، والرفيعة خير من الغليظة. وإن احتاجت الدابة لفصد أمسك المبضع بين أصابعه ونصبه في كفه تاركاً مقدار نصف ظفر بارزاً، فشقّ العرق من أعلاه برفق ورفق؛ وفي الودجين — وهما خطران لمجاورتهما المريء — يربط العنق ربطاً محكماً حتى يبرزا ثم يفعل ما يريد. ويذكر أن أهل العلم أحصوا في كتب البيطرة ثلاثمائة وعشرين داءً للدوابّ، منها ضيق المريء وداء الأنف بإفراز وبغيره، والجنون وضعف الدماغ، والديدان في المعدة والمغص والسّداد، والسعال البارد والحار، ودم يفجر من الدبر والذكر، وداء الحلق، وعسر البول، وألم المفاصل، وحصى في الحوافر وورم القدم والداحسات وشقوق الحوافر، وشلل الوجه ودمع العينين وألم الأسنان؛ وعلى البيطار أن يعرف علاج كل منها وسببه، وأيها يبقي أثراً دائماً وأيها لا؛ ولا يُغفل المحتسب امتحانه في ذلك."
    en: "Al-Shayzari details the veterinarian's work: he examines the ankle and inspects the hoof before paring; if the hoof is crooked he pares the opposite side until it is even, and if the foot stands straight he sets small nails behind and large in front, reversing them if it stands the other way; he must not pare into the flesh, nor set the nails loose so stones and sand get in, nor so tight he tortures the animal; hammered shoes stick best to the hoof, soft shoes take hard nails, and thin nails are better than thick ones. For blood-letting he holds the scalpel between his fingers, its handle in his palm and half a fingernail of blade exposed, cutting the vein delicately on its upper side; for the jugular veins — dangerous because they lie beside the gullet — he binds the neck firmly so they stand out, then does as he intends. The learned count three hundred and twenty illnesses of the beasts: tightness in the gullet, nostril-disease with and without discharge, madness and weakness of the brain, stomach worms, colic, gripes, cold and hot coughs, blood bursting from the anus and the penis, throat disease, difficulty in urinating, pain in the joints, stones caught in the hooves, swelling of the foot, whitlows, split hooves, facial paralysis, watering eyes and toothache; the veterinarian must know the treatment and cause of each, and which leave lasting damage and which do not — and the muhtasib must not neglect to test him on all of it."
    ur: "الشیزری بیطار کا کام تفصیل سے بتاتا ہے: ٹخنی دیکھ کر اور سم جاںچ کر تراشتا ہے؛ سم ٹیڑھا ہو تو سامنے کی طرف تراش کر برابر کرتا، سیدھا پاؤں ہو تو چھوٹی میخیں پیچھے اور بڑی آگے، الٹا ہو تو الٹ؛ اتنا نہ تراشے کہ گوشت کٹے، نہ میخیں ڈھیلی کہ کنکریّ ریت گھسے، نہ اتنا کسے کہ جانور عذاب پائے؛ دھری نعل سم پر مضبوط، نرم نعل پر سخت میخیں، اور پتلی میخ موٹی سے بہتر۔ فصد کے لیے نشر انگلیوں میں اور دستہ ہتھیلی میں، آدھی ناخن نوک باہر، رگ اوپر سے نرمی سے چیرتا؛ شاہ رگ — حلق کے قریب خطرناک — کے لیے گردن مضبوط باندھتا کہ رگیں اُبھریں پھر کیا چاہے کرتا۔ علماء نے جانوروں کے تین سو بیس رزق ⁦(امراض)⁩ گنے ہیں: حلق کا تنگ ہونا، نک کے رواں اور غیر رواں مرض، دیوانگی اور دماغی کمزوری، پیٹ کے کیڑے، قولنج اور مروڑ، ٹھنڈی اور گرم کھانسی، مقعد اور عضو سے خون کا پھوٹنا، گلے کا مرض، پیشاب کی تکلیف، جوڑوں کا درد، سموں میں پتھر، پاؤں کی سوجن، داحسات، سم کے شگاف، چہرے کی فالج، آنکھوں کا بہنا اور دانت درد؛ بیطار کو ہر ایک کا علاج اور سبب جاننا ہوتا ہے اور کون سا دائمی نقصان چھوڑتا ہے کون سا نہیں — اور محتسب ان سب میں اس کا امتحان لینا نہیں بھولتا۔"
