summary:
  ar: "البيطار هو معالج الدوابّ ومُحدِث حدواتها. يقول الشيزري إن بيطرة علم شريف كتب فيه الفلاسفة رسائل، وهو أصعب من طب الناس لأن الدابّة لا تنطق بعلتها وألمها فلا يُعلَم مرضها إلا باللمس والنظر؛ فلا يباشرها إلا من دين يمنعه أن يضرّ الدابة بفصدٍ أو قطعٍ أو كيٍّ عن غير تجربة فيؤدي إلى موتها أو عطبها. ويعاين كعبها ويفحص حافرها قبل جَرْده، فإن كان معوَجّاً جرد الجهة المقابلة حتى يستوي، ولا يُفرط في الجرد فيصيب اللحم، ولا يضع المسامير سائبة فتتحرك الحدوة وتدخل الحصى والرمل، ولا يشدّها فيعذّبها؛ والحدوة المطرّقة أثبت، واللينة أحسن للمسامير الصلبة، والرفيع خير من الغليظ. وإن احتاجت لفصد أمسك المبضع بأصابعه ونصبه في كفه وترك منه مقدار نصف ظفر، فشقّ العرق من أعلاه برفق، ولا يشقّ الودجين إلا بعد أن يربط عنق الدابة ربطاً محكماً لتبرز. وفي إسطنبول إوليا طائفتان: حدّادو النعل خمسمئة بمائتي دكان، والنعلبندية ألف بمائة وخمسين دكاناً، من ألزم الطوائف في العسكر."
  en: "The baytar treats the beasts of burden and shoes their hooves. Al-Shayzari calls veterinary science an honourable one on which philosophers wrote treatises, harder than the medicine of men because the animal cannot speak its sickness and pain — its ailments are known only by touching and looking — so none may practise it who has not the religion to stop him harming the beast by inexperienced blood-letting, cutting or cautery, leading to its death or injury. He examines the animal's ankle and inspects the hoof before paring; if it is crooked he pares the opposite side until it is even, never cutting into the flesh; he sets the nails neither loose, lest the shoe shift and let in stones and sand, nor so tight as to torture the animal; hammered shoes hold best, soft shoes take hard nails, and thin nails are better than thick. If a vein must be opened he holds the scalpel between his fingers with its handle in his palm and half a fingernail of blade exposed, and cuts the vein delicately on its upper side; for the jugular veins he first binds the animal's neck firmly so they stand out. In Evliya's Istanbul there are two guilds: the horseshoe-smiths at five hundred men with two hundred shops, and the farriers proper at a thousand with a hundred and fifty — among the most indispensable guilds on campaign."
  ur: "بیطار جانوروں کا معالج اور ان کے نعل باندھنے والا ہے۔ الشیزری بیطاری علم کو عزت والا کہتا ہے جس پر فلاسفہ نے رسالے لکھے، اور انسانوں کے طب سے مشکل کہ جانور اپنی تکلیف بتا نہیں سکتا — بیماری صرف چھونے اور دیکھنے سے معلوم ہوتی ہے — اس لیے وہی کرے جس کا دین اسے ناتجربہ کار فصد، کاٹ یا داغ سے جانور کو نقصان پہنچانے یا مار ڈالنے سے روکے۔ وہ جانور کی ٹخنی دیکھتا اور سم جاںچ کر تراشتا؛ ٹیڑھی ہو تو سامنے کی طرف تراش کر برابر کرتا، گوشت تک نہ پہنچے؛ میخیں نہ ڈھیلی رکھتا کہ نعل ہل کر کنکریّ اور ریت داخل ہو نہ اتنا کستا کہ جانور عذاب پائے؛ پیتل دھری نعل بہترین چپکتی ہے، نرم نعل پر سخت میخیں، اور پتلی میخ موٹی سے بہتر۔ فصد کھولنی ہو تو نشر انگلیوں میں اور دستہ ہتھیلی میں رکھ کر آدھی ناخن برابر نوک نکالتا اور رگ کو اوپر سے نرمی سے چیرتا؛ گردن کی شاہ رگ کے لیے پہلے گردن مضبوط باندھتا کہ رگیں اُبھر آئیں۔ اولیاء چلبی کے استنبول میں دو طائفیں ہیں: نعل ساز پانچ سو آدمی دو سو دکانوں کے ساتھ، اور نعل بند ہزار آدمی ڈیڑھ سو دکانوں کے ساتھ — لشکر میں ناگزیر ترین طائفوں میں۔"
  es: "El baytar trata a las bestias de carga y herra sus cascos. Al-Shayzari llama a la ciencia veterinaria una ciencia honorable sobre la cual los filósofos escribieron tratados, más difícil que la medicina de los hombres porque el animal no puede hablar de su enfermedad y dolor —sus dolencias se conocen solo al tocar y mirar— por lo que nadie puede practicarla si no tiene la religión para impedirle dañar a la bestia con sangrías, cortes o cauterizaciones inexpertas, lo que lleva a su muerte o lesiones. Examina el tobillo del animal e inspecciona el casco antes de recortarlo; si está torcido, recorta el lado opuesto hasta que quede parejo, nunca cortando la carne; coloca los clavos ni flojos, para que la herradura no se mueva y deje entrar piedras y arena, ni tan apretados como para torturar al animal; las herraduras martilladas se sujetan mejor, las herraduras blandas usan clavos duros, y los clavos delgados son mejores que los gruesos. Si hay que abrir una vena, sostiene el bisturí entre sus dedos con su mango en la palma y media uña de la hoja expuesta, y corta la vena delicadamente en su lado superior; Para las venas yugulares, primero ata firmemente el cuello del animal para que queden bien visibles. En el Estambul de Evliya existen dos gremios: el de los herreros, con quinientos hombres y doscientos talleres, y el de los herreros propiamente dichos, con mil hombres y ciento cincuenta talleres, entre los gremios más indispensables en campaña."
  fr: "Le baytar soigne les bêtes de somme et ferre leurs sabots. Al-Shayzari qualifie la médecine vétérinaire de discipline honorable, sujet de traités philosophiques, plus ardue que la médecine humaine car l'animal ne peut exprimer sa maladie ni sa douleur; ses maux ne se perçoivent qu'au toucher et à l'œil nu. Nul ne peut donc la pratiquer sans la religion qui l'empêche de nuire à l'animal par des saignées, des incisions ou des cautérisations maladroites, pouvant entraîner sa mort ou des blessures. Il examine le jarret et inspecte le sabot avant de le parer; s'il est tordu, il pare le côté opposé jusqu'à ce qu'il soit droit, sans jamais entailler la chair. Il pose les clous ni trop lâches, de peur que le fer ne bouge et ne laisse entrer cailloux et sable, ni trop serrés au point de torturer l'animal. Les fers martelés tiennent mieux, les fers souples acceptent des clous durs, et les clous fins sont préférables aux épais. S'il faut ouvrir une veine, il tient le scalpel entre ses doigts, le manche dans la paume et la moitié de la lame découverte, et incise délicatement la veine sur sa face supérieure. Pour les veines jugulaires, il commence par ligaturer fermement le cou de l'animal afin qu'elles ressortent. À Istanbul, sous Evliya, on trouve deux corporations: celle des maréchaux-ferrants, forte de cinq cents hommes et de deux cents ateliers, et celle des maréchaux-ferrants proprement dits, qui compte un millier d'hommes et cent cinquante ateliers – parmi les corporations les plus indispensables en campagne."
  tr: "Nalcı, hayvanları tedavi eden ve nallarını yapan kişidir. Şeyzari, veteriner hekimliğin filozofların risaleler yazdığı asil bir bilim olduğunu ve hayvanın rahatsızlığını veya acısını ifade etmediği için insan tıbbından daha zor olduğunu, bu nedenle hastalığının ancak dokunma ve görme yoluyla teşhis edilebileceğini söyler. Bu nedenle, ancak dini bağlılığı onu deneyimsiz bir şekilde kan akıtma, kesme veya yakma gibi yöntemlerle hayvana zarar vermekten alıkoyan kişi onu tedavi etmelidir. Kesmeden önce topuğu inceler ve tırnağını kontrol eder. Eğer eğri ise, düzeltilene kadar karşı taraftan keser. Etine zarar vermemek için çok fazla kesmez, nalın hareket edip çakıl ve kumu sıkıştırmaması için çivileri gevşek yerleştirmez, acı vermemek için de çok fazla sıkmaz. Çekiçle dövülmüş nal daha sağlamdır, sert çiviler için yumuşak nal daha iyidir ve kalın naldan ziyade ince nal daha iyidir. Kan alma işlemi gerekliyse, neşteri parmaklarında tutar, avucuna yerleştirir, yaklaşık yarım tırnak uzunluğunda bir kısmını açıkta bırakır ve damarı yukarıdan nazikçe keserdi. Hayvanın boynu dışkılamayı önlemek için sıkıca bağlanana kadar şah damarlarını kesmezdi. İstanbul'da iki lonca vardı: beş yüz kişi ve iki yüz dükkandan oluşan ayakkabıcılar loncası ve bin kişi ve yüz elli dükkandan oluşan sandaletçiler loncası. Bunlar ordudaki en önemli loncalar arasındaydı."
  id: "Tukang sepatu kuda adalah orang yang merawat hewan dan membuat tapal kudanya. Al-Shayzari mengatakan bahwa kedokteran hewan adalah ilmu mulia yang telah ditulis oleh para filsuf dalam risalah-risalahnya, dan lebih sulit daripada kedokteran manusia karena hewan tidak mengungkapkan penyakit atau rasa sakitnya, sehingga penyakitnya hanya dapat didiagnosis dengan sentuhan dan penglihatan. Oleh karena itu, hanya seseorang yang komitmen agamanya mencegahnya untuk menyakiti hewan dengan mengeluarkan darah, memotong, atau membakar tanpa pengalaman yang boleh merawatnya. Ia memeriksa tumit dan kukunya sebelum memotongnya. Jika bengkok, ia memotong sisi yang berlawanan sampai lurus. Ia tidak memotong terlalu banyak, agar tidak merusak daging, juga tidak memasang paku terlalu longgar, agar tapal kuda tidak bergeser dan menjebak kerikil dan pasir, juga tidak mengencangkannya terlalu kencang, agar tidak menyebabkan rasa sakit. Tapal kuda yang ditempa lebih stabil, yang lunak lebih baik untuk paku yang keras, dan yang tipis lebih baik daripada yang tebal. Jika pengeluaran darah diperlukan, ia akan memegang pisau bedah di antara jari-jarinya, memposisikannya di telapak tangannya, menyisakan sekitar setengah panjang kuku jari, dan dengan lembut memotong pembuluh darah dari atas. Ia tidak akan memotong pembuluh darah jugularis sampai leher hewan tersebut diikat dengan aman untuk mencegah buang air besar. Di Istanbul, terdapat dua serikat pekerja: para pembuat sepatu, yang berjumlah lima ratus orang dengan dua ratus toko, dan para pembuat sandal, yang berjumlah seribu orang dengan seratus lima puluh toko. Ini adalah beberapa serikat pekerja terpenting di angkatan darat."
