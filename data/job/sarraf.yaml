training:
  mode: mixed
  certification: "No schooling: the craft passed from master to apprentice inside the Ottoman gedik, and a dead sarraf's berth generally went to his son. Outside the guild, practising money-changing needed the sultan's berat; the nineteenth-century corner sarrafs of Istanbul worked under permit notes that limited them to changing paper money up to 100 kuruş. Al-Shayzari's rule is that no one should take up money-changing until he has learned the law of usury, for the trade is dangerous to the religion of the ignorant."
