summary:
  ar: "الصرّاف هو من يبيع الذهب بالفضة ويعرف درجة صفائهما وما يقابلانه، فيزنهما بموازين دقيقة ويبدل بينهما بأجر؛ وكان الصرّافون في أسواق المدينة منذ عصر الهجرة، وتوسّعت مهنتهم حتى صاروا في العهد العثماني عصب المالية: يشترون النقد ويبيعونه، ينقلون الأموال ويحفظونها، يقرضون رجال الدولة، ويشغّلون أموال الأوقاف والأيتام، ثم صاروا أركان نظام الالتزام يدفعون للخزانة عن الملتزمين ويكفلونهم، حتى حظرت الدولة الصرّافة سنة 1916."
  en: "The sarraf knew the fineness of gold and silver and what each was worth, weighed them on fine balances and changed one for the other for a fee. Money-changers stood in the markets from the days of Medina; under the Ottomans the trade grew into the spine of state finance: sarrafs bought and sold coin, moved and guarded money, lent to statesmen, ran the funds of cash pious foundations and orphan trusts, and became pillars of the tax-farming system, paying the treasury and standing surety for tax-farmers, until the state banned money-changing in 1916."
  ur: "صرّاف وہ تھا جو سونے اور چاندی کی خالصیت اور ان کی قیمت جانتا، انہیں باریک ترازوؤں پر تولتا اور ایک کو دوسرے سے بدل کر اجرت لیتا۔ مدینہ کے بازاروں سے یہ صنعت چلتی آئی اور عثمانی دور میں مالی نظام کی ریڑھ کی ہڈی بن گئی: صرّاف سکے خریدتے بیچتے، رقوم منتقل اور محفوظ کرتے، حکمرانوں کو قرض دیتے، نقد اوقاف اور یتیم خانوں کی جائیدادیں چلاتے، اور التزام کے نظام کے ستون بن کر خزانے کو ملتزموں کی طرف سے ادائیگیاں کرتے اور ان کے کفیل ہوتے، یہاں تک کہ 1916 میں حکومت نے صرّافی پر پابندی لگا دی۔"
  es: "El sarraf conocía la pureza del oro y la plata y el valor de cada uno, los pesaba en balanzas de precisión y los cambiaba por una comisión. Los cambistas se instalaron en los mercados desde la época de Medina; bajo el dominio otomano, este comercio se convirtió en la columna vertebral de las finanzas estatales: los sarrafs compraban y vendían monedas, transportaban y custodiaban dinero, prestaban a estadistas, administraban los fondos de fundaciones religiosas y fideicomisos para huérfanos, y se convirtieron en pilares del sistema de recaudación de impuestos, pagando al tesoro público y sirviendo de fiador para los recaudadores, hasta que el estado prohibió el cambio de moneda en 1916."
  fr: "Le sarraf connaissait la pureté de l'or et de l'argent ainsi que leur valeur respective, les pesait sur des balances de précision et les échangeait contre une commission. Les changeurs de monnaie étaient présents sur les marchés depuis l'époque de Médine; sous les Ottomans, ce commerce devint l'épine dorsale des finances de l'État: les sarrafs achetaient et vendaient des pièces de monnaie, transportaient et gardaient l'argent, prêtaient aux hommes d'État, géraient les fonds des fondations caritatives et des orphelinats, et devinrent des piliers du système de perception des impôts, payant le trésor public et se portant garants pour les collecteurs d'impôts, jusqu'à ce que l'État interdise le change de monnaie en 1916."
  tr: "Para değiştirici, altını gümüşle değiştiren, saflığını ve karşılığını bilen kişidir. Hassas terazilerle tartar ve bir ücret karşılığında değiştirir. Para değiştiriciler Hicret zamanından beri şehir pazarlarında bulunuyordu ve meslekleri Osmanlı döneminde finansın bel kemiği haline gelene kadar genişledi: para alıp satıyor, para taşıyor ve saklıyor, devlet memurlarına borç veriyor ve vakıfların ve yetimlerin fonlarını yatırıyorlardı. Daha sonra vergi tahsildarlığı sisteminin temel direkleri haline geldiler, vergi mükellefleri adına hazineye ödeme yapıyor ve onları güvence altına alıyorlardı; ta ki devlet 1916'da para değiştiricileri yasaklayana kadar."
  id: "Penukar uang adalah orang yang menjual emas dengan perak dan mengetahui kemurnian serta nilai setaranya. Ia menimbang emas dan perak dengan timbangan yang akurat dan menukarkannya dengan imbalan biaya. Penukar uang telah ada di pasar kota sejak zaman Hijrah, dan profesi mereka berkembang hingga, pada era Ottoman, mereka menjadi tulang punggung keuangan: mereka membeli dan menjual mata uang, mengangkut dan menyimpan uang, meminjamkan uang kepada pejabat negara, dan menginvestasikan dana wakaf dan anak yatim. Kemudian mereka menjadi pilar sistem pengumpulan pajak, membayar kas negara atas nama para pemungut pajak dan menjamin mereka, hingga negara melarang penukar uang pada tahun 1916."
