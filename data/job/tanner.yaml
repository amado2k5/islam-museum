craft:
  materials: [leather, wood, textile]
  techniques:
    ar: "تُغسل الجلود ثم توضع في حفر الجير، ويُزال الشعر واللحم بسكين مخصوصة، وتُطبق بالعفص أو البلوط أو الزبل ثم تُكشط من جديد، ويتكرر ذلك حتى تبلغ الجودة المطلوبة، ثم تُلين بدهن الألية أو السمك وتُصبغ. وكان القرظ والرمان والشب أدوات الدباغة عند العرب الأوائل."
    en: "The hides were washed and laid in lime pits, and hair and flesh were scraped off with a special knife. They were layered with gall or acorn cups or with dung and scraped again, and this was repeated until the quality was right. The leather was then softened with tallow or fish oil and dyed. The early Arabs used acacia pods, pomegranate peel and alum."
    ur: "کھالوں کو دھو کر چونے کے گڑھوں میں رکھا جاتا اور خاص چھری سے بال اور گوشت اتارا جاتا۔ انہیں مازو یا بلوط کے پیالوں یا لید کے ساتھ تہ بہ تہ رکھ کر پھر کھرچا جاتا، اور یہ عمل مطلوبہ معیار تک دہرایا جاتا؛ پھر چربی یا مچھلی کے تیل سے نرم کر کے رنگا جاتا۔ ابتدائی عرب قرظ، انار کے چھلکے اور پھٹکری استعمال کرتے تھے۔"
