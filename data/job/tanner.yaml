  - { value: "دباغة", kind: alternate }
summary:
  ar: "الدباغ هو الذي يعالج جلود الحيوان حتى تصلح للاستعمال. تذكر موسوعة TDV أن العرب الأوائل دبغوا بالقَرَظ والرمان والشب، وأن قرطبة والمغرب صارتا من مراكز الجلد ومنهما أُخذ الاسمان الغربيان للجلد المدبوغ. وللفقهاء أحكام في جلود الميتة والخنزير، وفي إسطنبول العثمانية كان للدباغين طائفة ومحلّ مخصوص لتوزيع الجلود، وتُنسب حرفتهم في الأناضول إلى أخي أوران."
  en: "The tanner treated animal hides until they could be used. The TDV encyclopaedia says the early Arabs tanned with acacia pods, pomegranate peel and alum, and that Cordoba and Morocco became leather centres from which the two Western names for fine leather come. The jurists ruled on the hides of dead animals and of the pig, and in Ottoman Istanbul the tanners had a guild and a set place to share out the hides. Their craft is attached in Anatolia to Ahi Evran."
  ur: "چرم ساز جانوروں کی کھالوں کو قابلِ استعمال بناتا تھا۔ ٹی ڈی وی کا مدخل کہتا ہے کہ ابتدائی عربوں نے قرظ، انار کے چھلکے اور پھٹکری سے دباغت کی، اور قرطبہ اور مراکش چمڑے کے مراکز بنے جن سے عمدہ چمڑے کے دو مغربی نام نکلے۔ فقہا نے مردار اور خنزیر کی کھالوں کے احکام بتائے، اور عثمانی استنبول میں دباغوں کی ایک جماعت تھی جس کی کھالیں بانٹنے کی مخصوص جگہ تھی۔ اناطولیہ میں ان کا ہنر اخی ایوران سے جوڑا جاتا ہے۔"
