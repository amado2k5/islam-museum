summary:
  ar: "الدباغ هو الذي يعالج جلود الحيوان حتى تصلح للاستعمال. تذكر موسوعة TDV أن العرب الأوائل دبغوا بالقَرَظ والرمان والشب، وأن قرطبة والمغرب صارتا من مراكز الجلد ومنهما أُخذ الاسمان الغربيان للجلد المدبوغ. وللفقهاء أحكام في جلود الميتة والخنزير، وفي إسطنبول العثمانية كان للدباغين طائفة ومحلّ مخصوص لتوزيع الجلود، وتُنسب حرفتهم في الأناضول إلى أخي أوران."
  en: "The tanner treated animal hides until they could be used. The TDV encyclopaedia says the early Arabs tanned with acacia pods, pomegranate peel and alum, and that Cordoba and Morocco became leather centres from which the two Western names for fine leather come. The jurists ruled on the hides of dead animals and of the pig, and in Ottoman Istanbul the tanners had a guild and a set place to share out the hides. Their craft is attached in Anatolia to Ahi Evran."
  ur: "چرم ساز جانوروں کی کھالوں کو قابلِ استعمال بناتا تھا۔ ٹی ڈی وی کا مدخل کہتا ہے کہ ابتدائی عربوں نے قرظ، انار کے چھلکے اور پھٹکری سے دباغت کی، اور قرطبہ اور مراکش چمڑے کے مراکز بنے جن سے عمدہ چمڑے کے دو مغربی نام نکلے۔ فقہا نے مردار اور خنزیر کی کھالوں کے احکام بتائے، اور عثمانی استنبول میں دباغوں کی ایک جماعت تھی جس کی کھالیں بانٹنے کی مخصوص جگہ تھی۔ اناطولیہ میں ان کا ہنر اخی ایوران سے جوڑا جاتا ہے۔"
  es: "El curtidor trataba las pieles de los animales hasta que podían utilizarse. La enciclopedia TDV afirma que los primeros árabes curtían con vainas de acacia, cáscara de granada y alumbre, y que Córdoba y Marruecos se convirtieron en centros de curtido, de donde provienen los dos nombres occidentales para el cuero fino. Los juristas dictaminaban sobre las pieles de animales muertos y de cerdo, y en el Estambul otomano los curtidores tenían un gremio y un lugar establecido para repartir las pieles. Su oficio está vinculado en Anatolia al Ahi Evran."
  fr: "Le tanneur traitait les peaux d'animaux jusqu'à ce qu'elles soient utilisables. L'encyclopédie TDV indique que les premiers Arabes utilisaient des gousses d'acacia, des écorces de grenade et de l'alun pour le tannage, et que Cordoue et le Maroc devinrent des centres de production de cuir, à l'origine des deux appellations occidentales désignant le cuir fin. Les juristes statuaient sur les peaux d'animaux morts et de porc, et à Istanbul, sous l'Empire ottoman, les tanneurs étaient organisés en corporation et disposaient d'un lieu dédié à la distribution des peaux. En Anatolie, leur métier est associé à Ahi Evran."
  tr: "Tabakçı, hayvan derilerini işleyerek kullanılabilir hale getiren kişidir. TDV Ansiklopedisi, eski Arapların akasya, nar ve şap ile tabaklama yaptığını ve Kurtuba ile Fas'ın deri üretiminin merkezleri haline geldiğini, tabaklanmış deri için Batı'daki isimlerin de buradan geldiğini belirtmektedir. İslam hukukçularının ölü hayvan ve domuz derileriyle ilgili hükümleri vardır. Osmanlı İstanbul'unda tabakçıların bir loncası ve derilerin dağıtıldığı belirlenmiş bir alanı vardı ve Anadolu'daki bu zanaatın Oran'ın kardeşine atfedildiği söylenmektedir."
  id: "Seorang penyamak kulit adalah seseorang yang mengolah kulit hewan agar dapat digunakan. Ensiklopedia TDV menyatakan bahwa orang Arab kuno menyamak kulit dengan akasia, delima, dan tawas, dan bahwa Cordoba dan Maroko menjadi pusat produksi kulit, dari situlah nama-nama Barat untuk kulit yang disamak berasal. Para ahli hukum Islam memiliki fatwa mengenai kulit hewan mati dan babi. Di Istanbul pada masa Ottoman, para penyamak kulit memiliki serikat dan area khusus untuk mendistribusikan kulit, dan keahlian mereka di Anatolia dikaitkan dengan saudara laki-laki Oran."
