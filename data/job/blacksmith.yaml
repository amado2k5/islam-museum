  techniques:
    ar: "صنعة الحداد الطرق على السندان: ينهى الشيزري الحداد أن يطرق السكاكين والمقصات والكلّابات ونحوها من الحديد الرخو فيبيعها على أنها فولاذ، وألا يخلط المسامير المُقوَّمة المستعملة بالمطروقة الجديدة، وألا تُصنع السكاكين والمقصات والمواسي إلا من الفولاذ النقي. ويصف إوليا جلبي موكبهم: يُمرّون على عربات كبيرة يزيّنون دكاكينهم بالأزهار ويطرقون الحديد على السندان وينادون «يا داود»، وبعضهم يحمل قضبان الحديد على كتفه؛ وبيرهم الأول داود الذي يذكرون أنه كان يلين له الحديد، وفي زمن النبوة كان بيرهم أبو مسلم الحدادي."
    en: "The smith's craft is hammering iron on the anvil: al-Shayzari forbids him to hammer knives, scissors, pincers and the like from soft iron and sell them as steel, to mix straightened used nails with the newly forged, and requires knives, scissors and razors of pure steel only. Evliya describes their procession on great wagons, their shops dressed with flowers, striking iron on the anvil and crying 'O David', some carrying iron rods on their shoulders; in guild lore their first patron is David, to whom iron was soft, and their patron in the Prophet's time Abu Moslem al-Haddadi."
    ur: "لوہار کا دست لوہے پر ہتھوڑا چلانا ہے: الشیزری منع کرتا ہے کہ چھری، قینچی اور چمٹے نرم لوہے سے بنا کر فولاد کے نام پر بیچے، استعمال شدہ سیدھے میخوں کو نئے گاڑھے میں نہ ملائے، اور چھری، قینچے اور استرے صرف خالص فولاد کے ہوں۔ اولیاء چلبی ان کا جلوس بڑی گاڑیوں پر بیان کرتا ہے: دکانیں پھولوں سے سجی، آہن گران پر لوہا پیٹتے اور «یا داؤد» پکارتے، بعض کندھوں پر لوہے کی سلاخیں اٹھائے؛ صنعت کارانہ قصے میں پہلا پیر داؤد ہے جس کے لیے لوہا نرم تھا، اور نبوی زمانے کا پیر ابو مسلم حدادی۔"
