summary:
  ar: "الحدّاد يطرق الحديد في صنعته. ينهى الشيزري عن غشّه: ألا يُطرق السكين والمقص والكلّابة من الحديد الرخو فيُباع على أنه فولاذ، وألا تُخلط المسامير المُقوّمة بالمطروقة حديثاً، وأن تُصنع السكاكين والمقصات والمواسي من الفولاذ النقي. ويعدّ إوليا جلبي للحدّادين في إسطنبول ألف دكان، بيرهم داود ثم أبو مسلم الحدادي الذي تقلّد من سلمان، ويتقدّمون الطوائف في الموكب لضرورة صنعتهم في العسكر."
  en: "The blacksmith forged iron for a living. Al-Shayzari forbids his frauds: knives, scissors and pincers must not be hammered out of soft iron and sold as steel, straightened nails must not be mixed with newly forged ones, and knives, scissors and razors are to be made of pure steel. Evliya counts a thousand smiths' shops in Istanbul; in guild lore their patrons are David and then Abu Moslem al-Haddadi, girded by Selman, and they take precedence in the procession because the camp cannot do without their craft."
  ur: "لوہار لوہا گاڑھ کر روزی کماتا ہے۔ الشیزری اس کے دھوکوں سے روکتا ہے: چھری، قینچی اور چمٹا نرم لوہے سے بنا کر فولاد کہہ کر نہ بیچے، سیدھے کیے میخوں کو نئے گاڑھے میخوں میں نہ ملائے، اور چھری، قینچی اور استرے خالص فولاد کے بنائے جائیں۔ اولیاء چلبی استنبول میں لوہاروں کی ایک ہزار دکانیں گنتا ہے؛ صنعت کارانہ قصے میں ان کے پیر داؤد اور پھر ابو مسلم حدادی ہیں جو سلمان سے کمر بند ہوا، اور لشکر میں ان کے دست کی ضرورت کے سبب جلوس میں انھیں سبقت ملی۔"
