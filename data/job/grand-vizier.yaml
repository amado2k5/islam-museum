  certification: "Until the conquest of Istanbul the holders usually came from the learned career, and for more than seventy years from the Çandarlı family, through the kazaskerlik. From Mehmed II until the nineteenth century they usually came from the slave household's military and administrative career, with some exceptions from the scribal service. After Karlowitz in 1699 more came from the bureaucracy. After the Tanzimat they came from the civil service, often after several ministries and foreign posts. The entry describes no single examination."
