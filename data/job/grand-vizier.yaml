label: { ar: "الصدر الأعظم", en: "Grand vizier", ur: "صدر اعظم" }
names:
  - { value: "وزير أعظم", kind: alternate }
  - { value: "sadrazam", kind: latinized, lang: tr }
summary:
  ar: "الصدر الأعظم هو نائب السلطان في الدولة العثمانية، ورأس الوزراء والأمراء. بدأ استمراراً لوزارة السلاجقة، وثبت لقبه وصلاحياته في قانون محمد الفاتح، فكان وكيلاً مطلقاً في أمور الدين والدولة. يُعيَّن بتسليم الختم الهمايوني ويُعزل باسترداده. استقال آخر صدر أعظم، أحمد توفيق باشا، في 4 نوفمبر 1922، وتولى العمل رئيس وزراء حكومة أنقرة."
  en: "The grand vizier was the sultan's deputy in the Ottoman state, and the head of the viziers and the commanders. The office continued the Seljuk vizierate. Mehmed II's law fixed its title and powers: the holder was the absolute deputy in the affairs of religion and of the state. He was appointed when the imperial seal was given to him, and dismissed when it was taken back. The last grand vizier, Ahmed Tevfik Pasha, resigned on 4 November 1922, and the prime minister of the Ankara government took up the work."
  ur: "صدر اعظم عثمانی ریاست میں سلطان کا نائب اور وزراء و امرا کا سربراہ تھا۔ یہ منصب سلجوقی وزارت کی جاری شکل میں شروع ہوا۔ محمد فاتح کے قانون نے اس کا لقب اور اختیار طے کیا: وہ دین و ریاست کے معاملات میں مطلق وکیل تھا۔ شاہی مہر ملنے سے تقرری ہوتی تھی اور مہر واپس لینے سے معزولی۔ آخری صدر اعظم احمد توفیق پاشا نے 4 نومبر 1922 کو استعفیٰ دیا، اور انقرہ کی حکومت کے وزیراعظم نے یہ کام سنبھالا۔"
