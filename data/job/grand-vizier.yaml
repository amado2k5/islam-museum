    status: historical
    note: "The entry gives 1387 as the death of Çandarlı Kara Halil Hayreddin Pasha, whom it describes as having acted as a kind of chief vizier under Murad I. It does not date his appointment. The title vezir-i azam is stated as such in Mehmed II's organisation code, which the entry does not date. The word sadrazam becomes common from the second half of the sixteenth century."
