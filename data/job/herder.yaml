summary:
  ar: "الراعي يسوس الغنم والماعز والبقر والجاموس في المراعي. يعدّ إوليا جلبي في موكب الصنائع بإسطنبول طائفة الرعاة ⁦(جوبان)⁩ تسعمائة رجل، أول بيرهم موسى، وفي زمن النبي أعن بن شادق الذي شمّره سلمان الفارسي وقبره باليمن؛ ومعهم لبّانو الجواموس ألف رجل بمائتي دكان وبيرهم سفيان ثور، ولبّانو الضأن ثمانمائة رجل وبيرهم شعيب. ويمضي الرعاة في الموكب يطلقون البنادق ويعزفون الناي «قاوال» ويقودون كلاباً بحجم الحمير شرسة كالأسود، ينزل من نسلها كلب أهل الكهف، ويأكلون معها من الصحفة نفسها."
  en: "The herder pastures sheep, goats, oxen and buffaloes. Evliya Çelebi's guild procession counts the Shepherds (Choban) nine hundred men — their first patron Moses, and in the Prophet's time A'n ben Shadck girded by Selman Pak and buried in Yemen — beside the buffalo milkmen, a thousand men with two hundred shops under their patron Sofian Thun, and the sheeps'-milk sellers, eight hundred under Jethro. The shepherds march firing muskets and playing the kawal pipe, leading herd-dogs the size of asses and fierce as lions — the breed that descends, Evliya says, from the dog of the cave of the Seven Sleepers — and they eat from the same dish as their dogs."
  ur: "چرواہا بھیڑ بکریاں، گائے اور بھینس چراتا ہے۔ اولیاء چلبی کی دستکاروں کی جلوس میں چرواہوں ⁦(چوبان)⁩ کی جماعت نو سو آدمی ہے — ان کا پہلا پیر موسیٰ اور نبی کے زمانے میں اعن بن شادق جسے سلمان پاک نے کمربند باندھا اور جس کی قبر یمن میں ہے — ان کے ساتھ بھینسوں کے دودھ والے ایک ہزار آدمی اور دو سو دکانیں، پیر سفیان ثور، اور بھیڑوں کا دودھ بیچنے والے آٹھ سو، پیر شعیب۔ چرواہے جلوس میں بندوقیں چلاتے اور قاول بانسری بجاتے گزرتے ہیں، گدھے کے جسم اور شیر کی سی شرارت والے کتوں کو لے کر — اولیاء کے قول وہ نسل اصحابِ کہف کے کتے سے چلی — اور اپنے کتوں کے ساتھ ایک ہی تھالی سے کھاتے ہیں۔"
  es: "El pastor cuida ovejas, cabras, bueyes y búfalos. La procesión gremial de Evliya Çelebi cuenta con los pastores (Choban), novecientos hombres —su primer patrón fue Moisés, y en tiempos del Profeta, A'n ben Shadck, ceñido por Selman Pak y enterrado en Yemen—, junto a los lecheros de búfalas, mil hombres con doscientas tiendas bajo su patrón Sofian Thun, y los vendedores de leche de oveja, ochocientos bajo el mando de Jethro. Los pastores marchan disparando mosquetes y tocando la flauta kawal, guiando perros pastores del tamaño de asnos y feroces como leones —la raza que desciende, según Evliya, del perro de la cueva de los Siete Durmientes— y comen del mismo plato que sus perros."
  fr: "Le berger fait paître moutons, chèvres, bœufs et buffles. Le cortège de la guilde d'Evliya Çelebi compte neuf cents bergers (Choban) – leur premier protecteur étant Moïse, et, à l'époque du Prophète, A'n ben Shadck, protégé par Selman Pak et enterré au Yémen –, aux côtés des laitiers de buffles, mille hommes et deux cents échoppes sous la tutelle de leur protecteur Sofian Thun, et des huit cents vendeurs de lait de brebis sous l'autorité de Jethro. Les bergers défilent en tirant des coups de mousquet et en jouant du kawal, menant des chiens de berger de la taille d'ânes et féroces comme des lions – une race qui, selon Evliya, descend du chien de la grotte des Sept Dormants – et ils mangent dans le même plat que leurs chiens."
