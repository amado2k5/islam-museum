summary:
  ar: "المستشرق هو المتخصص الغربي في دراسة الشرق — لغاته وأديانها وعلومه وتاريخه وفنونه — ويذكر مدخل موسوعة TDV أن اللفظ تبدّل معناه عبر التاريخ: ففي 1683 دلّ على عضو الكنيسة الشرقية، وفي 1779 ظهر بمعنى المتخصص في دراسات الشرق في مقال عن إدوارد بوكوك، ودخلت «استشراق» قاموس الأكاديمية الفرنسية سنة 1838، وقابلها العربية «استشراق» والتركية «شرقيات» ثم «دوغو بيليمي». بدأت الصنعة بالترجمة الكنسية — فريق مجمع كلوني الذي ترجم القرآن سنة 1143 — ثم الكراسي التي قررها مجمع فيين سنة 1312، فكرسيّ غيوم بوستل للعربية في باريس سنة 1539 وكرسيّ إربينيوس في لايدن سنة 1613، حتى صارت في القرن التاسع عشر مهنة جمعيات ومجلات وكراسيّ: الجمعية الآسيوية بكلكتا 1784، سوسيتيه آزياتيك بباريس 1822، الجمعية الآسيوية الملكية بلندن 1823، مؤتمر المستشرقين الأول بباريس 1873. ويورد المدخل قراءات نقدية للصنعة تربطها بالتبشير وبالاستعمار، وأوسعها تعريف إدوارد سعيد."
  en: "The müsteşrik is the Western specialist in the study of the East — its languages, religions, sciences, history and arts. The TDV entry traces the word's shifting senses: in 1683 it meant a member of the Eastern church; the specialist sense appears in English in a 1779 essay on Edward Pococke; 'orientalisme' entered the Académie française dictionary in 1838; Arabic renders the field istishrāq and Turkish şarkiyat, later doğu bilimi. The craft began in church translation — the Cluny team whose Qur'an translation Robert of Ketton finished in 1143 — then the chairs decreed at the Council of Vienne in 1312, Postel's Arabic chair at Paris in 1539 and Erpenius's at Leiden in 1613, until in the nineteenth century it became a profession of societies, journals and professorships: the Asiatic Society of Bengal at Calcutta in 1784, the Société Asiatique at Paris in 1822, the Royal Asiatic Society at London in 1823, the first Orientalists' Congress at Paris in 1873. The entry also carries critical readings tying the discipline to missionary work and colonialism, most extensively Edward Said's definition."
  ur: "مستشرق مشرق کے مطالعے کا مغربی ماہر ہے — اس کی زبانیں، مذاہب، علوم، تاریخ اور فنون۔ TDV مدخل لفظ کے بدلتے معنی بیان کرتا ہے: 1683ء میں یہ مشرقی کلیسا کے رکن کو کہتے تھے؛ 1779ء میں ایڈورڈ پوکوک پر ایک مقالے میں ماہرِ مشرقیات کے معنی آئے؛ 1838ء میں 'اورینطالسم' فرانسیسی اکادمی کے لغت میں داخل ہوا؛ عربی میں استشراق اور ترکی میں شرقيات پھر دوغو بيليمي۔ پیشہ کلیسائی ترجمے سے شروع ہوا — کلونی کا وہ دستہ جس نے 1143ء میں قرآن کا ترجمہ مکمل کیا — پھر ویین کونسل 1312ء کے قرار کردہ کرسیاں، پیرس میں پوستیل کی عربی کرسی 1539ء اور لیڈن میں ارپینیوس کی 1613ء، یہاں تک کہ انیسویں صدی میں یہ جمعیتوں، جرائد اور کرسیوں کا پیشہ بنا: کلکتہ کی ایشیٹک سوسائٹی آف بنگال 1784ء، پیرس کی سوسیئے آزیاتیک 1822ء، لندن کی رائل ایشیٹک سوسائٹی 1823ء، پیرس میں پہلا مستشرقین کانگرس 1873ء۔ مدخل اس فن کی تنقیدی قراءتیں بھی لاتا ہے جو اسے تبشیر اور استعمار سے جوڑتی ہیں، سب سے وسيع ایڈورڈ سعید کی تعریف۔"
