  certification: "No guild licence: the field formed around university chairs — Paris 1539, Leiden 1613 — then the learned societies and their journals. The entry notes that Islamic studies long sat as a side-branch of Hebrew and biblical studies before becoming an independent discipline, and that Paris and Leiden trained the German orientalists through a kind of experts' chain of masters and pupils."
  duration: "University training in the Eastern languages, then entry into the societies and chairs; the entry describes the specialists' core work as learning and teaching Arabic and Islam's other languages, building grammars, lexicons and catalogues, and editing and translating the texts."
