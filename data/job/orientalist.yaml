summary:
  ar: "المستشرق هو المتخصص الغربي في دراسة الشرق — لغاته وأديانها وعلومه وتاريخه وفنونه — ويذكر مدخل موسوعة TDV أن اللفظ تبدّل معناه عبر التاريخ: ففي 1683 دلّ على عضو الكنيسة الشرقية، وفي 1779 ظهر بمعنى المتخصص في دراسات الشرق في مقال عن إدوارد بوكوك، ودخلت «استشراق» قاموس الأكاديمية الفرنسية سنة 1838، وقابلها العربية «استشراق» والتركية «شرقيات» ثم «دوغو بيليمي». بدأت الصنعة بالترجمة الكنسية — فريق مجمع كلوني الذي ترجم القرآن سنة 1143 — ثم الكراسي التي قررها مجمع فيين سنة 1312، فكرسيّ غيوم بوستل للعربية في باريس سنة 1539 وكرسيّ إربينيوس في لايدن سنة 1613، حتى صارت في القرن التاسع عشر مهنة جمعيات ومجلات وكراسيّ: الجمعية الآسيوية بكلكتا 1784، سوسيتيه آزياتيك بباريس 1822، الجمعية الآسيوية الملكية بلندن 1823، مؤتمر المستشرقين الأول بباريس 1873. ويورد المدخل قراءات نقدية للصنعة تربطها بالتبشير وبالاستعمار، وأوسعها تعريف إدوارد سعيد."
  en: "The müsteşrik is the Western specialist in the study of the East — its languages, religions, sciences, history and arts. The TDV entry traces the word's shifting senses: in 1683 it meant a member of the Eastern church; the specialist sense appears in English in a 1779 essay on Edward Pococke; 'orientalisme' entered the Académie française dictionary in 1838; Arabic renders the field istishrāq and Turkish şarkiyat, later doğu bilimi. The craft began in church translation — the Cluny team whose Qur'an translation Robert of Ketton finished in 1143 — then the chairs decreed at the Council of Vienne in 1312, Postel's Arabic chair at Paris in 1539 and Erpenius's at Leiden in 1613, until in the nineteenth century it became a profession of societies, journals and professorships: the Asiatic Society of Bengal at Calcutta in 1784, the Société Asiatique at Paris in 1822, the Royal Asiatic Society at London in 1823, the first Orientalists' Congress at Paris in 1873. The entry also carries critical readings tying the discipline to missionary work and colonialism, most extensively Edward Said's definition."
  ur: "مستشرق مشرق کے مطالعے کا مغربی ماہر ہے — اس کی زبانیں، مذاہب، علوم، تاریخ اور فنون۔ TDV مدخل لفظ کے بدلتے معنی بیان کرتا ہے: 1683ء میں یہ مشرقی کلیسا کے رکن کو کہتے تھے؛ 1779ء میں ایڈورڈ پوکوک پر ایک مقالے میں ماہرِ مشرقیات کے معنی آئے؛ 1838ء میں 'اورینطالسم' فرانسیسی اکادمی کے لغت میں داخل ہوا؛ عربی میں استشراق اور ترکی میں شرقيات پھر دوغو بيليمي۔ پیشہ کلیسائی ترجمے سے شروع ہوا — کلونی کا وہ دستہ جس نے 1143ء میں قرآن کا ترجمہ مکمل کیا — پھر ویین کونسل 1312ء کے قرار کردہ کرسیاں، پیرس میں پوستیل کی عربی کرسی 1539ء اور لیڈن میں ارپینیوس کی 1613ء، یہاں تک کہ انیسویں صدی میں یہ جمعیتوں، جرائد اور کرسیوں کا پیشہ بنا: کلکتہ کی ایشیٹک سوسائٹی آف بنگال 1784ء، پیرس کی سوسیئے آزیاتیک 1822ء، لندن کی رائل ایشیٹک سوسائٹی 1823ء، پیرس میں پہلا مستشرقین کانگرس 1873ء۔ مدخل اس فن کی تنقیدی قراءتیں بھی لاتا ہے جو اسے تبشیر اور استعمار سے جوڑتی ہیں، سب سے وسيع ایڈورڈ سعید کی تعریف۔"
  es: "El müsteşrik es el especialista occidental en el estudio de Oriente: sus lenguas, religiones, ciencias, historia y artes. La entrada del TDV rastrea los significados cambiantes de la palabra: en 1683 significaba un miembro de la iglesia oriental; el sentido de especialista aparece en inglés en un ensayo de 1779 sobre Edward Pococke; 'orientalisme' entró en el diccionario de la Académie française en 1838; el árabe traduce el campo como istishrāq y el turco como şarkiyat, más tarde doğu bilimi. El oficio comenzó con la traducción eclesiástica —el equipo de Cluny cuya traducción del Corán Robert de Ketton finalizó en 1143—, luego con las cátedras decretadas en el Concilio de Vienne en 1312, la cátedra árabe de Postel en París en 1539 y la de Erpenius en Leiden en 1613, hasta que en el siglo XIX se convirtió en una profesión con sociedades, revistas y cátedras: la Sociedad Asiática de Bengala en Calcuta en 1784, la Sociedad Asiática en París en 1822, la Real Sociedad Asiática en Londres en 1823, el primer Congreso de Orientalistas en París en 1873. La entrada también incluye lecturas críticas que vinculan la disciplina con el trabajo misionero y el colonialismo, siendo la definición de Edward Said la más extensa."
  fr: "Le müsteşrik est le spécialiste occidental de l'étude de l'Orient — ses langues, ses religions, ses sciences, son histoire et ses arts. L'entrée du TDV retrace l'évolution du sens du mot: en 1683, il désignait un membre de l'Église d'Orient; le sens de spécialiste apparaît en anglais dans un essai de 1779 sur Edward Pococke; « orientalisme » fait son entrée dans le dictionnaire de l'Académie française en 1838; l'arabe traduit ce domaine par istishrāq et le turc par şarkiyat, puis doğu bilimi. L'art de la traduction a débuté par la traduction ecclésiastique — l'équipe de Cluny dont la traduction du Coran fut achevée par Robert de Ketton en 1143 — puis par les chaires décrétées au concile de Vienne en 1312, la chaire d'arabe de Postel à Paris en 1539 et celle d'Erpenius à Leyde en 1613, jusqu'à devenir, au XIXe siècle, une profession structurée en sociétés, revues et chaires: la Société asiatique du Bengale à Calcutta en 1784, la Société asiatique à Paris en 1822, la Royal Asiatic Society à Londres en 1823, le premier Congrès des orientalistes à Paris en 1873. L'article comprend également des analyses critiques reliant cette discipline au travail missionnaire et au colonialisme, notamment la définition d'Edward Said."
  tr: "Oryantalist, Doğu'nun dilleri, dinleri, bilimleri, tarihi ve sanatları üzerine uzmanlaşmış Batılı bir bilim insanını ifade eder. TDV Ansiklopedisi'ndeki maddeye göre, terimin anlamı tarih boyunca değişmiştir: 1683'te Doğu Kilisesi üyesini ifade ederken, 1779'da Edward Pococke hakkındaki bir makalede Doğu bilimleri uzmanı anlamında kullanılmıştır. \"Oryantalizm\" terimi 1838'de Fransız Akademisi sözlüğüne girmiş ve Arapça \"istishraq\" ve Türkçe \"sharqiyat\" ve daha sonra \"dogu bilimi\" terimlerine eşdeğer olmuştur. Bu meslek, 1143'te Kur'an'ı tercüme eden Cluny Konseyi ekibiyle başlayan kilise tercümesiyle, ardından 1312'de Vienne Konseyi tarafından kurulan kürsülerle, 1539'da Paris'te Guillaume Postel'in Arapça Kürsüsü ve 1613'te Leiden'de Erpenius Kürsüsü ile devam etti ve on dokuzuncu yüzyılda dernekler, dergiler ve kürsüler haline geldi: 1784'te Kalküta'daki Asya Derneği, 1822'de Paris'teki Société Asiatique, 1823'te Londra'daki Kraliyet Asya Derneği, 1873'te Paris'teki Birinci Oryantalistler Kongresi. Giriş bölümü, mesleği misyonerlik çalışmaları ve sömürgecilikle ilişkilendiren eleştirel okumaları içeriyor; bunların en genişi Edward Said'in tanımıdır."
  id: "Orientalis adalah seorang spesialis Barat dalam studi tentang Timur—bahasa, agama, ilmu pengetahuan, sejarah, dan seninya. Entri dalam Ensiklopedia TDV menyatakan bahwa makna istilah tersebut telah berubah sepanjang sejarah: pada tahun 1683 istilah itu merujuk pada anggota Gereja Timur, dan pada tahun 1779 muncul dengan makna seorang spesialis dalam studi Oriental dalam sebuah artikel tentang Edward Pococke. \"Orientalisme\" masuk ke dalam kamus Akademi Prancis pada tahun 1838, dan setara dengan bahasa Arab \"istishraq\" dan bahasa Turki \"sharqiyat\" dan kemudian \"dogu bilimi.\" Keahlian ini berawal dari penerjemahan gerejawi—tim Konsili Cluny yang menerjemahkan Al-Qur'an pada tahun 1143—kemudian kursi-kursi yang didirikan oleh Konsili Vienne pada tahun 1312, Kursi Guillaume Postel untuk Bahasa Arab di Paris pada tahun 1539 dan Kursi Erpenius di Leiden pada tahun 1613, hingga pada abad kesembilan belas menjadi profesi yang terdiri dari perkumpulan, jurnal, dan kursi: Masyarakat Asia di Kalkuta 1784, Société Asiatique di Paris 1822, Royal Asiatic Society di London 1823, Kongres Orientalis Pertama di Paris 1873. Pendahuluan ini mencakup pembacaan kritis tentang keahlian tersebut yang menghubungkannya dengan pekerjaan misionaris dan kolonialisme, yang paling luas adalah definisi Edward Said."
