summary:
  ar: "ربّان السفينة قائدها في البحر، وهو عند المسعودي والمقدسي القبطان ⁦(الربّان أو الرئيس)⁩ إلى جانب الناخودة المالك، والديدبان الرقيب، والمعلّم رجل الخرائط والآلات الذي يضبط المسار، والإشتيام دليل الركاب. وعلى القدّوم العثمانية كان الرئيس يقف على النصف السفلي من السطح يراقب طاقماً قوامه نحو 330 رجلاً بين مقاتل ومجدّف وحبالي ودفّمان، يقودهم بالخريطة والبوصلة. وفي مصايد اللؤلؤ بالخليج كان الناخودة غالباً مالك المركب نفسه، يقود غوّاصيه وشدّاديه والمصلّي الذي يعفي الشدّادين عند الصلاة."
  en: "The ship's captain commanded at sea: in the lists of al-Mas'udi and al-Maqdisi the rubbân or reis is the captain beside the nâhudâ owner, the dîdebân lookout, the muallim who handles charts and instruments and fixes the course, and the iştiyâm, the passengers' adviser. On the Ottoman galley the reis stood the quarterdeck over a crew of about 330 — warriors, oarsmen, ropemen, helmsmen — leading them by chart and compass. In the Gulf pearl fishery the nakhoda was often the boat's own owner, commanding his divers, his rope-tenders and the 'prayer-man' who relieved the sebs when they stopped to pray."
  ur: "جہاز کا سردار سمندر میں اس کی قیادت کرتا ہے: مسعودی اور مقدسی کی گنتیوں میں ربّان یا رئیس قپتان ہے جس کے ساتھ ناخدا مالک، دیدبان چوکیدار، نقشے اور اوزار استعمال کرنے والا راستہ طے کرنے والا معلّم، اور مسافروں کے مشیر اِشتیام آتے ہیں۔ عثمانی قادِرغے پر رئیس بالائی عرشے پر کھڑا تقریباً ۳۳۰ آدمیوں کے دستے — جنگجو، چپو، رسہ کار، سکّان گیر — کو نقشے اور قطب نما سے چلاتا تھا۔ خلیج کی موتی گیری میں ناخدا اکثر خود کشتی کا مالک ہوتا، اپنے غواصوں، رسہ سنبھالنے والوں اور اس «مصلّی» کی قیادت کرتا جو سیبوں کی نماز کے وقت ان کے کام سنبھالتا۔"
  es: "El capitán del barco comandaba en alta mar: en las listas de al-Mas'udi y al-Maqdisi, el rubbân o reis es el capitán junto al nâhudâ propietario, el dîdebân vigía, el muallim que maneja cartas náuticas e instrumentos y fija el rumbo, y el iştiyâm, el consejero de los pasajeros. En la galera otomana, el reis se situaba en la popa sobre una tripulación de unos 330 hombres —guerreros, remeros, eslingas, timoneles— dirigiéndolos con cartas náuticas y brújula. En la pesca de perlas del Golfo, el nakhoda era a menudo el propio propietario del barco, al mando de sus buzos, sus eslingas y el «hombre de oración» que relevaba a los sebs cuando se detenían a rezar."
  fr: "En mer, le capitaine commandait le navire: dans les listes d’al-Mas’udi et d’al-Maqdisi, le rubbân ou reis est le capitaine aux côtés du propriétaire du nâhudâ, du dîdebân (veilleur), du muallim (chargé des cartes et des instruments et de la fixation du cap) et de l’iştiyâm (conseiller des passagers). Sur la galère ottomane, le reis dirigeait le gaillard d’arrière et un équipage d’environ 330 hommes – guerriers, rameurs, cordiers, timoniers – qu’il guidait à l’aide de cartes et de compas. Dans la pêche perlière du Golfe, le nakhoda était souvent le propriétaire du bateau, commandant ses plongeurs, ses cordiers et le « prêtre » qui relayait les sebs lorsqu’ils s’arrêtaient pour prier."
