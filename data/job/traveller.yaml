summary:
  ar: "السيّاح محترف الأسفار في العالم الإسلامي، وأسمى نموذج له أوليا جلبي الذي لقّب نفسه بأسمائه الثلاثة: أوليا وحافظ وسيّاح، وسمّى كتابه سياحتنامه. يذكر فون هامر أنه في ليلة عاشوراء من عامه الحادي والعشرين رأى في المنام في جامع آخي چلبي النبيَّ والصالحين، فأراد أن يسأل الشفاعة فسبق لسانه إلى السياحة، فقيل له: أُعطيت الشفاعة والسياحة معاً بصحة وسلام، وأمره سعد بن أبي وقاص أن يدون ما يرى من بلدان وقلاع وعجائب ومنتجات وفنون ومساحات أقاليم وطول أيامها فيذكرةً لائقة به. وخرج أوليا إلى أرجاء الدنيا وصار يذكر بين المسافرين دراويش تجوّلوا ثم اعتزلوا، وعجائز قاربت أعمارهم مئة وخمسين سنة، والمكّاريين والكرّائيين الذين يكرون الدواب للتجار والجنود وسائر المسافرين."
  en: "The seyyâh is the professional wayfarer of the Islamic world, and its standing model is Evliya Çelebi, who named himself by three names — Evliya, Hafiz, Siyyah — and called his work the Seyahatname, the history of the traveller. Von Hammer records that in the night of Ashura of his twenty-first year he saw in a dream, in the mosque of Akhî Çelebi, the Prophet and the saints; meaning to ask for intercession he slipped and asked for siyâhat, travelling, and was told that shifa'at and siyâhat were both granted him in health and peace. Sa'd ibn Abi Waqqas charged him to record the countries, castles, wonders, products, arts, provinces and day-lengths he would pass through, as a monument worthy of him. Evliya then went through the world, and his pages remember fellow travellers: wandering dervishes who retired after great journeys, centenarian travellers, and the mekkari and kiraji horse-jobbers who let mounts to merchants, soldiers and other travellers."
  ur: "سیّاح اسلامی دنیا کا پیشہ ور مسافر ہے، اور اس کی معیاری تصویر اولیاء چلبی ہے جس نے اپنے تین نام رکھے — اولیاء، حافظ، سیّاح — اور اپنی کتاب کا نام سیاحت نامہ، مسافر کی تاریخ۔ فون ہامر لکھتا ہے کہ اس کی اکیسویں سال کی عاشورہ کی رات اس نے آخی چلبی مسجد میں خواب میں نبی اور صالحین کو دیکھا؛ شفاعت مانگنا چاہتا تھا مگر زبان پھسل کر سیاحت مانگ بیٹھا، تو کہا گیا کہ شفاعت اور سیاحت دونوں اسے عافیت کے ساتھ عنایت ہوئیں۔ سعد بن ابی وقاص نے حکم دیا کہ وہ ممالک، قلعے، عجائبات، پیداواریں، فنون، صوبوں کی وسعت اور دنوں کی لمبائی قلم بند کرے تاکہ اس کے لائق یادگار رہے۔ پھر اولیاء دنیا بھر میں نکلا، اور اس کے صفحات اپنے ہم سفر مسافروں کو یاد رکھتے ہیں: بڑے سفر کے بعد خلوت گزین بنے درویش، ڈیڑھ سو سالہ بزرگ مسافر، اور مکاری و کرائی گھوڑے کرایہ دینے والے جو تاجروں، سپاہیوں اور دیگر مسافروں کو سواریاں دیتے۔"
  es: "El seyyâh es el viajero profesional del mundo islámico, y su modelo por excelencia es Evliya Çelebi, quien se identificó con tres nombres —Evliya, Hafiz, Siyyah— y llamó a su obra Seyahatname, la historia del viajero. Von Hammer relata que en la noche de Ashura de su vigésimo primer año, vio en un sueño, en la mezquita de Akhî Çelebi, al Profeta y a los santos; con la intención de pedir intercesión, se equivocó y pidió siyâhat, viajar, y se le dijo que tanto shifa'at como siyâhat le fueron concedidos en salud y paz. Sa'd ibn Abi Waqqas le encargó que registrara los países, castillos, maravillas, productos, artes, provincias y la duración de los días que recorrería, como un monumento digno de él. Evliya recorrió el mundo y en sus páginas recuerda a sus compañeros de viaje: derviches errantes que se retiraban tras grandes viajes, viajeros centenarios y los \"mekkari\" y \"kiraji\" que alquilaban monturas a comerciantes, soldados y otros viajeros."
  fr: "Le seyyâh est le voyageur professionnel du monde islamique, et son modèle par excellence est Evliya Çelebi, qui se nommait de trois noms — Evliya, Hafiz, Siyyah — et intitula son œuvre le Seyahatname, l'histoire du voyageur. Von Hammer rapporte que, la nuit d'Achoura de sa vingt et unième année, il vit en songe, dans la mosquée d'Akhî Çelebi, le Prophète et les saints; voulant implorer leur intercession, il laissa échapper une demande pour le siyâhat, le voyage, et on lui annonça que la shifa'at et le siyâhat lui étaient accordés, ainsi que la santé et la paix. Sa'd ibn Abi Waqqas lui confia la tâche de consigner par écrit les pays, les châteaux, les merveilles, les produits, les arts, les provinces et la durée du jour qu'il traverserait, comme un monument digne de lui. Evliya parcourut ensuite le monde, et ses pages évoquent ses compagnons de voyage: des derviches errants qui se retiraient après de longs périples, des voyageurs centenaires, et les loueurs de chevaux mekkari et kiraji qui louaient des montures aux marchands, aux soldats et aux autres voyageurs."
