summary:
  ar: "الإمام من يؤمّ الجماعة في الصلاة؛ بدأ وكيلاً عن النبي وعن الوالي، ثم استقلّت الإمامة وظيفةً تُعيَّن على المساجد منذ القرون الأولى. تطوّرت أجور الإمامة من مال بيت المال إلى أوقاف المساجد، وصار إمام المحلة في الدولة العثمانية موظّفاً ببراءة سلطانية من أهل العسكر، يراقب السكن والمواليد والوفيات وعقود النكاح ونظافة المحلة إلى جانب إقامة الصلاة، ثم نظّمت نيظامنامهات التوجيهات أواخر القرن التاسع عشر تعيينه بالامتحان."
  en: "The imam leads the congregation in prayer; the office began as a deputyship of the Prophet and of the governor, then became a mosque appointment of its own in the first centuries. Pay moved from the treasury to the mosques' waqfs, and in the Ottoman state the neighbourhood imam held a sultan's berat, counted among the askeri, and watched over residence, births, deaths, marriage contracts and the cleanliness of the quarter beside leading prayer; the appointment regulations of the late nineteenth century finally made his post an examined one."
  ur: "امام وہ شخص ہے جو جماعت کی نماز پڑھاتا ہے؛ یہ منصب نبی اور گورنر کی طرف سے نائب مقرر کرنے سے شروع ہوا اور ابتدائی صدیوں میں مسجدوں کی علیحدہ تقرری بن گیا۔ اس کی تنخواہ بیت المال سے مسجدوں کے اوقاف میں منتقل ہوئی، اور عثمانی سلطنت میں محلے کا امام سلطانی برات سے منصب پانے والا عسکری طبقے کا فرد تھا جو نماز کے علاوہ رہائش، پیدائش، وفات، نکاح اور محلے کی صفائی بھی دیکھتا تھا؛ انیسویں صدی کے آخر کے تعیناتی قوانین نے اس کا منصب امتحانی بنا دیا۔"
  es: "El imán dirige la congregación en la oración; el cargo comenzó como una delegación del Profeta y del gobernador, y luego se convirtió en un nombramiento propio de la mezquita en los primeros siglos. El salario pasó del tesoro público a los waqfs de las mezquitas, y en el estado otomano el imán del barrio ostentaba un berat del sultán, se contaba entre los askeri y velaba por la residencia, los nacimientos, las muertes, los contratos matrimoniales y la limpieza del barrio, además de dirigir la oración; las regulaciones de nombramiento de finales del siglo XIX finalmente convirtieron su puesto en uno examinado."
