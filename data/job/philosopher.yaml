summary:
  ar: "الفيلسوف عند العرب — الفلاسفة — من كان شأنه الأول الفلسفة لا علم الكلام، كما يعرّفه غيوم ناقلاً عن الشهرستاني أنهم جميعاً سلكوا سبيل أرسطو إلا في تفاصيل أخذوها من أفلاطون ومن قبله؛ ويبدأ الشهرستاني قائمته بالكندي وحنين بن إسحاق ويختمها بابن سينا الذي عدّه الأكثرون أثقبهم بصيرة. أخذ الفلاسفة إطارهم من فلسفة اليونان الجارية عند النصارى السريان وأهل حرّان، فكان الكندي — المولود نحو سنة 850 بالكوفة والمتعلم بالبصرة وبغداد — أول فيلسوف العرب وآخرهم كما يقول غيوم، وصحّح ترجمة «لاهوت أرسطو» لأحمد بن المعتصم. ولم يخلُ المقام من عداء: سُمّيت الفلسفة «حكمة ممزوجة بكفر»، ورويت حكاية فيلسوف رجع عن مذاهبه عند موته، ويذكر غيوم أن بعض أعلامهم دفع ثمن آرائه حياته أو حريته؛ وعن نسبة الكندي إلى المعتزلة يعرض كايا تصنيف فالتزر ودي بور ولا يجزم به."
  en: "The faylasūf among the Arabs — the falāsifa — is the one whose first interest is philosophy rather than kalam; Guillaume cites al-Shahrastani that they all followed the Aristotelian path save in details borrowed from Plato and the earlier philosophers, and his list runs from al-Kindi and Hunayn ibn Ishaq to Avicenna, whom the majority held the keenest of insight. They took their frame from the Greek philosophy current among the Syrian Christians and the pagans of Harran. Al-Kindi — born about 850 at Kufa, educated at Basra and Baghdad — was, in Guillaume's phrase, the first and last philosopher the Arabs produced, and he corrected the translation of the so-called Theology of Aristotle for Ahmad ibn al-Mu'tasim. The calling was not safe: philosophy was named 'wisdom mixed with unbelief', a tale circulated of a philosopher recanting on his deathbed, and Guillaume notes some of its exponents paid for their opinions with life or liberty; on al-Kindi's alleged Mu'tazilism Kaya reports Walzer's and de Boer's classifications without endorsing them."
  ur: "عربوں میں فیلسوف — فلاسفہ — وہ ہے جس کی پہلی دلچسپی فلسفہ ہے، علم کلام نہیں؛ گیوم شہرستانی سے نقل کرتا ہے کہ سب ارسطو کے راستے چلے سوائے چند جزئیات کے جو افلاطون اور پہلے حکماء سے لی گئیں، اور اس کی فہرست کندی اور حنین بن اسحاق سے ابن سینا تک چلتی ہے جسے اکثریت نے سب سے تیز بصیرت مانا۔ انہوں نے اپنا ڈھانچہ سریانی مسیحیوں اور حران کے باشندوں میں رائج یونانی فلسفے سے لیا۔ کندی — تقریباً 850ء میں کوفہ میں پیدا، بصرہ اور بغداد میں تعلیم یافتہ — گیوم کی اصطلاح میں عربوں کا پہلا اور آخری فیلسوف تھا، اور اس نے احمد بن معتصم کے لیے لاہوتِ ارسطو کے ترجمے کی تصحیح کی۔ یہ پیشہ بے خطر نہ تھا: فلسفہ کو 'کفر سے ملی جلی حکمت' کہا گیا، ایک فیلسوف کی وفات پر توبہ کی کہانی مشہور ہوئی، اور گیوم لکھتا ہے کہ بعض نے اپنی آراء کی قیمت جان یا آزادی سے ادا کی؛ کندی کی معتزلی نسبت پر کایا والزر اور دی بوئر کی درجہ بندیاں نقل کرتا مگر خود فیصلہ نہیں کرتا۔"
  es: "Entre los árabes, el faylasūf —el falāsifa— es aquel cuyo interés principal es la filosofía, más que el kalam. Guillaume cita a al-Shahrastani, quien afirma que todos siguieron el camino aristotélico, salvo en detalles tomados de Platón y los filósofos anteriores. Su lista abarca desde al-Kindi y Hunayn ibn Ishaq hasta Avicena, a quien la mayoría consideraba de gran perspicacia. Adoptaron su marco filosófico de la filosofía griega que circulaba entre los cristianos sirios y los paganos de Harrán. Al-Kindi —nacido alrededor del año 850 en Kufa, educado en Basora y Bagdad— fue, en palabras de Guillaume, el primer y último filósofo que produjeron los árabes, y corrigió la traducción de la llamada Teología de Aristóteles para Ahmad ibn al-Mu'tasim. La vocación no era segura: la filosofía fue tildada de \"sabiduría mezclada con incredulidad\", circuló la historia de un filósofo que se retractó en su lecho de muerte, y Guillaume señala que algunos de sus exponentes pagaron por sus opiniones con la vida o la libertad; sobre el supuesto mutazilismo de al-Kindi, Kaya recoge las clasificaciones de Walzer y de Boer sin respaldarlas."
  fr: "Le faylasūf parmi les Arabes — le falāsifa — est celui dont le premier intérêt est la philosophie plutôt que le kalam. Guillaume cite al-Shahrastani selon lequel ils suivirent tous la voie aristotélicienne, à quelques détails près empruntés à Platon et aux philosophes antérieurs. Sa liste va d'al-Kindi et Hunayn ibn Ishaq à Avicenne, dont la majorité considérait l'intuition la plus fine. Ils s'inspiraient de la philosophie grecque en vogue chez les chrétiens syriens et les païens de Harran. Al-Kindi — né vers 850 à Koufa, formé à Bassora et à Bagdad — fut, selon Guillaume, le premier et le dernier philosophe arabe. Il corrigea la traduction de la prétendue Théologie d'Aristote pour Ahmad ibn al-Mu'tasim. La vocation n'était pas sans danger: la philosophie était qualifiée de « sagesse mêlée d'incroyance », une histoire circulait à propos d'un philosophe se rétractant sur son lit de mort, et Guillaume note que certains de ses représentants ont payé leurs opinions de leur vie ou de leur liberté; sur le prétendu mu'tazilisme d'al-Kindi, Kaya rapporte les classifications de Walzer et de de Boer sans les approuver."
