  - { place: place/baghdad, note: "In Buyid Baghdad the supervision of the slave markets appears as a charge distinct from the hisba: al-Sarakhsi under al-Mu'tadid held 'the hisba, the inheritances and the slave market' (sūq al-raqīq), and a Buyid amir was likewise entrusted with hisba and the slave markets.", sources: [source/shayzari-nihaya-buckley] }
