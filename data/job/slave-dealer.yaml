summary:
  ar: "كان الجلّاب أو النخّاس أو الأسيرجي تاجر الرقيق والجواري في أسواق المدن الإسلامية: يعرض البضاعة البشرية للبيع بالمزاد في سوق الأسير، ويسجّل في دفتره اسم البائع وصفته حتى لا يُباع حرّ أو مسروق، ولا يبيع للذمّي، ولا يفرّق بين الأم وطفلها قبل سبع سنين — هكذا ينظّم كتاب الشيزري صنعته. اشترط الشيزري في التاجر أن يكون ثقة أميناً معروفاً بالصدق لأنه مسؤول عن عبيد الناس وجواريهم ويخلو بهم في داره؛ وفي القاهرة المملوكية وما بعدها كانت أسواق الرقيق ولاية منفصلة عن الحسبة يشرف عليها «ناظر الأسواق»، وعند العثمانيين صارت كلمات «أسيرجي وأسير تاجره وسوق الأسير وشيخ الأسيرجية» أسماء هذه الصنعة ولجنتها."
  en: "The slave-dealer — jallāb, nakhkhās, or in Ottoman usage esirci — traded men, women and children in the slave markets of the Islamic city. Al-Shayzari's manual sets the rules of his craft: he must be trustworthy and known for integrity, for he answers for other people's male and female slaves and is sometimes alone with them in his house; he must enter the seller's name and description in his register lest a freeman or a stolen person be sold; he may not sell to a dhimmi, nor separate a mother from her child under seven. In the Cairo of the Abbasid and Mamluk periods the slave market was a jurisdiction apart from the hisba, under its own nazir al-aswaq; the Ottomans named the trade's broker the esirci dellâlı and its guild head the esirciler şeyhi."
  ur: "جلّاب یا نخّاس — عثمانی اصطلاح میں اسرجی — اسلامی شہر کے بازارِ غلاماں میں مردوں، عورتوں اور بچوں کی تجارت کرتا تھا۔ الشیزری کی کتاب اس کے پیشے کے اصول بتاتی ہے: تاجر کا امین اور نیک نام ہونا شرط ہے کیونکہ وہ لوگوں کے غلاموں اور لونڈیوں کا ذمہ دار ہے اور کبھی ان سے تنہا گھر میں رہتا؛ ہر بیچنے والے کا نام اور ہلیہ اپنے دفتر میں لکھے تاکہ کوئی آزاد یا چرایا ہوا شخص فروخت نہ ہو؛ ذمی کو نہ بیچے اور ماں کو سات سال سے کم عمر بچے سے نہ جدا کرے۔ عباسی اور مملوک قاہرہ میں بازارِ رقیق حسبہ سے الگ دائرہ تھا جس کا اپنا ناظر الاسواق تھا، اور عثمانیوں میں اس صنعت کے دلّال کو اسرجی دلّالی اور انجمن کے سردار کو شيخ الاسرجیہ کہا جاتا تھا۔"
  es: "El traficante de esclavos —jallāb, nakhkhās o, en el uso otomano, esirci— comerciaba con hombres, mujeres y niños en los mercados de esclavos de la ciudad islámica. El manual de Al-Shayzari establece las reglas de su oficio: debe ser digno de confianza y conocido por su integridad, pues responde por los esclavos de otras personas, tanto hombres como mujeres, y a veces se encuentra a solas con ellos en su casa; debe anotar el nombre y la descripción del vendedor en su registro para evitar que se venda a un hombre libre o a una persona secuestrada; no puede vender a un dhimmi ni separar a una madre de su hijo menor de siete años. En el Cairo de los períodos abasí y mameluco, el mercado de esclavos era una jurisdicción aparte de la hisba, bajo su propio nazir al-aswaq; los otomanos llamaban al intermediario del comercio esirci dellâlı y al jefe de su gremio esirciler şeyhi."
