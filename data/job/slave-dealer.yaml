  certification: "No formal licence is described beyond the guild berth: Ottoman Istanbul knew the trade under the esirciler şeyhi, and the esirci dallals of the bedestans held berats like other dellals. Al-Shayzari's rules are the nearest thing to a code of the trade: register every seller's name and description, never sell to a dhimmi, never separate a mother from her child under seven, and keep the examined limits of modesty at the showing."
