id: job/mufti
class: job
label: { ar: "المفتي", en: "Mufti (jurisconsult)", ur: "مفتی" }
summary:
  ar: "المفتي هو العالم الذي يجيب عن مسألة فقهية بحكمها الشرعي، ويُسمّى جوابه الفتوى. ولم تكن الفتوى منصباً رسمياً في صدر الإسلام، إذ كان كل من بلغ العلم يفتي، ثم صار للمفتي موضع في الدولة والقضاء في العصور التالية، وفي الدولة العثمانية صار للشيخ الإسلام سلطة الفتوى، وصار للمفتين في الولايات والأقضية دور في الجواب عن أسئلة الناس."
  en: "The mufti was the scholar who answered a legal question with its ruling, and the answer was called a fatwa. In the early period the fatwa was not an office: anyone with the learning gave one. Later the mufti took a place in the state and the judiciary, and in the Ottoman state the shaykh al-islam held the authority to give fatwas, while muftis in the provinces answered the questions of ordinary people."
  ur: "مفتی وہ عالم تھا جو کسی فقہی مسئلے کا شرعی حکم بیان کرتا، اور اس جواب کو فتویٰ کہا جاتا تھا۔ صدرِ اسلام میں فتویٰ کوئی منصب نہ تھا، جو علم رکھتا وہ فتویٰ دیتا تھا۔ بعد کے ادوار میں مفتی ریاست اور عدلیہ میں جگہ پاتا، اور عثمانی ریاست میں شیخ الاسلام کو فتویٰ کا اختیار حاصل ہوا جبکہ صوبوں کے مفتی عام لوگوں کے سوالات کے جواب دیتے تھے۔"
