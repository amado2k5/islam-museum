places:
  - place: place/medina
    note: "The Prophet answered questions in Medina. The entry says Umar forbade the Companions to leave Medina, so that under the first two caliphs consensus could form there easily."
    sources: [source/tdv-fetva]
  - place: place/kufa
    note: "Under Uthman about two thousand Companions moved to cities such as Kufa, Basra and Damascus, and people there sought fatwas from them. Ibn Masud gave fatwas in Kufa, according to the entry."
    sources: [source/tdv-fetva]
  - place: place/damascus
    note: "Under Uthman some Companions settled in Damascus, and the local people asked them for fatwas, according to the entry."
    sources: [source/tdv-fetva]
  - place: place/baghdad
    note: "Under Harun al-Rashid Abu Yusuf gave fatwas and, with the title qadi al-qudat, also carried out judicial work, according to the entry."
    sources: [source/tdv-fetva]
