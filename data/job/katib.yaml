training:
  mode: apprenticeship
  certification: "In the Abbasid and later periods scribes were trained in writing, literature, law and the accounts; manuals of chancery art were written for them. In the Ottoman state, children of about eight to ten were taken as apprentices (shakird) into a chancery, learned writing and accounting from a senior scribe, and received a pen-name once able to write. In the nineteenth century the Tanzimat schools replaced this training."
