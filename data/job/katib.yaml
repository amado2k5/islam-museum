places:
  - place: place/medina
    note: "The Prophet's scribes wrote the revelation, treaties and letters to rulers in Medina, according to the entry."
    sources: [source/tdv-katip]
  - place: place/damascus
    note: "Muawiya is said to have set up the chancery (Diwan al-Rasail) as an institution, and the Umayyad scribes were chosen from among the local people of the provinces, according to the entry."
    sources: [source/tdv-katip]
  - place: place/baghdad
    note: "Under the Abbasids the divans were divided by function: letters, land tax, judge, army, police and public order. The chancery was the path to the vizierate."
    sources: [source/tdv-katip]
  - place: place/cairo
    note: "Under the Mamluks the chancery of letters (Diwan al-Insha) was headed by a senior secretary, and the Mamluk scribes wore a uniform marked with their rank, according to the entry."
    sources: [source/tdv-katip]
  - place: place/istanbul
    note: "The Ottoman central chanceries were in the imperial council, the treasury and the defterhane, and in the Bab-i Ali offices of the eighteenth century. Apprentices were trained inside them."
    sources: [source/tdv-katip]
