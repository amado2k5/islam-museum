label: { ar: "الكاتب", en: "Chancery secretary (katib)", ur: "کاتب (منشی)" }
summary:
  ar: "الكاتب هو موظف الدواوين الذي يكتب الرسائل والمراسيم والسجلات والحسابات ويحفظها، وقد كان في صدر الإسلام كاتب الوحي وكاتب رسائل النبي، ثم صار في الدولة الأموية والعباسية والفاطمية والمملوكية والعثمانية مهنة منظمة لها طبقات ومراتب وتعليم. وأشهر أنواعه كاتب الإنشاء ⁦(كاتب الرسائل)⁩ وكاتب الأموال ⁦(كاتب المال)⁩ وكاتب الجند وكاتب القاضي، وفي العثمانية الكاتب المتدرج من الشاكرد إلى الخليفة."
  en: "The katib was the official of the chanceries who wrote, copied and kept letters, decrees, registers and accounts. In early Islam the scribes of revelation and of the Prophet's letters held the office. Under the Umayyads, Abbasids, Fatimids, Mamluks and Ottomans it became an organised profession, with grades and training. Its main kinds were the scribe of letters (inşa), the scribe of revenue (amwal), the scribe of the army and the scribe of the judge. In the Ottoman state a katib rose from apprentice (shakird) to halife."
  ur: "کاتب دفتر کا وہ اہلکار تھا جو خطوط، فرامین، رجسٹر اور حساب لکھتا اور محفوظ رکھتا تھا۔ صدرِ اسلام میں وحی اور نبی کے خطوط کے کاتب اس منصب پر تھے۔ اموی، عباسی، فاطمی، مملوک اور عثمانی ادوار میں یہ ایک منظم پیشہ بن گیا جس کے درجے اور تربیت تھی۔ عثمانی ریاست میں کاتب شاگرد سے خلیفہ تک ترقی کرتا تھا۔"
