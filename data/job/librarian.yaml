summary:
  ar: "حافظ الكتب موظف مكتبات الأوقاف العثمانية، وسمّته بعض الوقفيات أمين الكتب أو خازنها. أشترطت وقفية الفاتح فيه أن يكون عارفاً بأسماء الكتب المعتبرة وبما يحتاجه المدرّسون والمعيدون والمستعدّون، ووصفته وقفية أخرى بأنه «رجل عارف صالح ذو معارف»؛ وعمله حفظ الكتب وإعارتها بضمان وتسجيل أسماء المستعيرين ومراقبة القراء كي لا تُقطع الصفحات أو تُتلف، ورفع المجلدات البالية إلى المتولي للترميم، ودوام في المكتبة بالذات أو بنظام المناوبة، مقابل أجر يومي ترقّى من أقجة أو أقجتين في عهد التأسيس إلى ١٢٠ أقجة لكبير الحفّاظ في مكتبة راغب باشا، مع سكن وطعام ومساعد يدعى اليماق."
  en: "The hafiz-i kutub is the officer of the Ottoman waqf libraries, called 'keeper of the books' (emin-i kütüb) or 'treasurer' (hazin) in some endowment deeds. Mehmed II's deed required a man who knew the names of the authoritative books and what the professors, teaching assistants and advanced students needed; another deed describes the appointee as 'a knowing, righteous, learned man'. His work was to guard the books, lend them against pledge and record borrowers' names, watch readers so pages were not cut or dirtied, report worn bindings to the mütevelli for repair, and attend the library in person or by rota — for a daily wage that rose from one or two akçe in the foundation era to 120 akçe for the chief keeper at the Ragıp Pasha library, plus housing, food from the imaret kitchen, and an assistant called the yamak."
  ur: "حافظ کتب عثمانی وقف کتب خانوں کا ملازم ہے، بعض وقف ناموں میں «امین کتب» یا «خازن» لکھا گیا۔ فاتح کے وقف نامے نے اس میں معتبر کتابوں کے ناموں اور مدرسین، معیدین اور مستعدین کی ضرورت کی کتابوں کی معرفت شرط ٹھہرائی؛ ایک اور وقف نامہ اسے «عارف، صالح، صاحب معارف» کہتا ہے۔ اس کا کام کتابوں کی حفاظت، رہن کے عوض عاریت دینا اور قرض لینے والوں کے نام درج کرنا، قارئین کی نگرانی تاکہ صفحات نہ کٹیں یا خراب نہ ہوں، ٹوٹے ہوتے جلدوں کی اطلاع متولی کو دینا، اور کتب خانے میں خود یا نوبت سے حاضری — اجرت جو تاسیس کے عہد میں روزانہ ایک دو اقچہ سے بڑھ کر راغب پاشا کتب خانے کے سرکاری حافظ کے لیے ١٢٠ اقچہ ہوئی، ساتھ میں رہائش، امارت کی رسوئی کا کھانا اور «یماق» نام کا معاون۔"
  es: "El hafiz-i kutub es el funcionario de las bibliotecas waqf otomanas, llamado «guardián de los libros» (emin-i kütüb) o «tesorero» (hazin) en algunos documentos de donación. El documento de Mehmed II exigía un hombre que conociera los nombres de los libros autorizados y las necesidades de los profesores, ayudantes de cátedra y estudiantes avanzados; otro documento describe al designado como «un hombre sabio, justo y erudito». Su trabajo consistía en custodiar los libros, prestarlos a cambio de una prenda y registrar los nombres de los prestatarios, vigilar a los lectores para que las páginas no se cortaran ni se ensuciaran, informar al mütevelli sobre las encuadernaciones desgastadas para su reparación y atender la biblioteca personalmente o por turnos, a cambio de un salario diario que pasó de uno o dos akçe en la época de la fundación a 120 akçe para el guardián principal de la biblioteca de Ragıp Pasha, además de vivienda, comida de la cocina del imaret y un asistente llamado yamak."
  fr: "Le hafiz-i kütüb est le responsable des bibliothèques waqf ottomanes, appelé « gardien des livres » (emin-i kütüb) ou « trésorier » (hazin) dans certains actes de donation. L'acte de Mehmed II exigeait un homme connaissant les ouvrages de référence et les besoins des professeurs, des assistants et des étudiants avancés; un autre acte décrit le titulaire comme « un homme instruit, intègre et savant ». Sa tâche consistait à veiller sur les livres, à les prêter contre gage et à consigner les noms des emprunteurs, à surveiller les lecteurs afin que les pages ne soient ni coupées ni salies, à signaler les reliures abîmées au mütevelli pour réparation, et à assurer la permanence à la bibliothèque, en personne ou par roulement. Sa rémunération journalière, qui passait d'un ou deux akçe à l'époque de la fondation, atteignit 120 akçe pour le conservateur en chef de la bibliothèque de Ragıp Pacha, en plus du logement, des repas fournis par la cuisine de l'imaret et d'un assistant appelé yamak."
