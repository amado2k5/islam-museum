places:
  - { place: place/istanbul, note: "The great independent libraries of the capital — Köprülü, Atıf Efendi, Ayasofya, Fatih, Nuruosmaniye, Ragıp Pasha — ran graded staffs of up to six keepers, first-second-third hafiz-i kutub, with daily wages reaching 80-120 akçe at the richest foundations.", sources: [source/tdv-hafiz-i-kutub] }
  - { place: place/edirne, note: "Bayezid II's 1488 külliye deed at Edirne is among the earliest to set qualities for the keeper — 'pious, faithful and trustworthy' — and its library paid the hafiz-i kutub two akçe a day, raised to four by century's end.", sources: [source/tdv-hafiz-i-kutub] }
  - { place: place/bursa, note: "In the early-period libraries such as Umur Bey's mosque library at Bursa (deed of 1440) no hafiz-i kutub was appointed at all — the mosque's muezzin kept the books for one akçe a day.", sources: [source/tdv-hafiz-i-kutub] }
