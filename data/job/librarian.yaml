training:
  mode: mixed
  certification: "Appointment lay with the waqf's mütevelli under the vakfiye's conditions: deeds asked for an emin and upright man 'knowing in the names of the books', some barred müderrises, kadis, imams, shaykhs and even craftsmen and merchants from the post, and one required candidates to be examined by the şeyhülislam before appointment. Custom also let a dead officer's post pass to even a minor son — an old Ottoman practice the eighteenth-century deeds began to hedge with conditions."
  duration: "Graded service: libraries with several keepers ranked them first, second and third hafiz-i kutub ('baş hafiz-i kutub' for the chief), with promotion into a freed upper rank; an apprentice class, the 'hafiz-i kutub yamağı' or later 'mülâzım', assisted at a lower wage."
