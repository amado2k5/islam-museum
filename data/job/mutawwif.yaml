summary:
  ar: "المطوّف مرشد الحجاج في مكة: يعنى بمساكنهم وطعامهم وصحّتهم ويعينهم على إتمام أركان الحج. صارت مهنة مغرية لأهل مكة لما يدفعه الوافدون، فاخذتها أسراً كثيرة قوتاً لها، ونظّم المطوّفون أنفسهم في طوائف مغلقة لكلٍّ منها شيخ مطوّفين معيّن، وعلى الجميع شيخ مشايخ يختاره الشيوخ. دخل الصبيّ الصنعة قيراقاً، ولمّا خبر الطريق أُدخل المهنة بمراسمٍ ووليمة «المعلمية»، ولبس المطوّف عمامة صفراء كبيرة وحزاماً عريضاً ورفع لواءً ملوّناً ليراه حجّاجه في الزحام ويكرّر لهم الدعاءات في كل شوط."
  en: "The mutawwif guided the pilgrims of Mecca: he saw to their lodging, food and health and helped them carry out the rites of the hajj. The fees pilgrims paid made the trade attractive to the people of Mecca, certain families took it up for a living, and a profession formed. The mutavvifs organised themselves in closed groups called taifes, each under an appointed shaykh al-mutavvifin, with a shaykh al-mashayikh chosen by the shaykhs over all. A boy entered as an apprentice, and after experience he was admitted to the craft in a ceremony recalling the akhi initiation, sealed by the 'muallimiye' feast he gave; on duty he wore a great yellow turban and a broad sash and carried a coloured banner on a staff so his pilgrims could find him in the crush, repeating the prayers of each circuit for them."
  ur: "مطوّف مکہ آنے والے حاجیوں کا رہنما تھا: ان کی رہائش، خوراک اور صحت کا خیال رکھتا اور حج کے ارکان کی تکمیل میں مدد دیتا۔ حاجیوں کی ادا کی ہوئی رقوم نے اس صنعت کو مکّیوں کے لیے پرکشش بنا دیا، بعض خاندانوں نے اسے روزی کا ذریعہ بنایا اور ایک پیشہ ور طبقہ وجود میں آیا۔ مطوّف بند طائفوں میں بٹے تھے، ہر طائفے کے سر پر مقرر کردہ شیخ المطوّفین اور سب کے اوپر شیخوں کا چنا ہوا شیخ المشائخ۔ لڑکا چیراغی سے صنعت میں داخل ہوتا، تجربے کے بعد اہلیت کی رسومات اور «معلمیہ» ضیافت کے ساتھ پیشے میں داخل ہوتا، اور فرض پر وہ بڑی زرد پگڑی، چوڑا کمر بند اور ڈنڈے پر رنگین علم لے کر حاجیوں کے سامنے چلتا اور ہر شوط کے دعائے ان سے دُہراتا۔"
