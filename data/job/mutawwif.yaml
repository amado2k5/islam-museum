summary:
  ar: "المطوّف مرشد الحجاج في مكة: يعنى بمساكنهم وطعامهم وصحّتهم ويعينهم على إتمام أركان الحج. صارت مهنة مغرية لأهل مكة لما يدفعه الوافدون، فاخذتها أسراً كثيرة قوتاً لها، ونظّم المطوّفون أنفسهم في طوائف مغلقة لكلٍّ منها شيخ مطوّفين معيّن، وعلى الجميع شيخ مشايخ يختاره الشيوخ. دخل الصبيّ الصنعة قيراقاً، ولمّا خبر الطريق أُدخل المهنة بمراسمٍ ووليمة «المعلمية»، ولبس المطوّف عمامة صفراء كبيرة وحزاماً عريضاً ورفع لواءً ملوّناً ليراه حجّاجه في الزحام ويكرّر لهم الدعاءات في كل شوط."
  en: "The mutawwif guided the pilgrims of Mecca: he saw to their lodging, food and health and helped them carry out the rites of the hajj. The fees pilgrims paid made the trade attractive to the people of Mecca, certain families took it up for a living, and a profession formed. The mutavvifs organised themselves in closed groups called taifes, each under an appointed shaykh al-mutavvifin, with a shaykh al-mashayikh chosen by the shaykhs over all. A boy entered as an apprentice, and after experience he was admitted to the craft in a ceremony recalling the akhi initiation, sealed by the 'muallimiye' feast he gave; on duty he wore a great yellow turban and a broad sash and carried a coloured banner on a staff so his pilgrims could find him in the crush, repeating the prayers of each circuit for them."
  ur: "مطوّف مکہ آنے والے حاجیوں کا رہنما تھا: ان کی رہائش، خوراک اور صحت کا خیال رکھتا اور حج کے ارکان کی تکمیل میں مدد دیتا۔ حاجیوں کی ادا کی ہوئی رقوم نے اس صنعت کو مکّیوں کے لیے پرکشش بنا دیا، بعض خاندانوں نے اسے روزی کا ذریعہ بنایا اور ایک پیشہ ور طبقہ وجود میں آیا۔ مطوّف بند طائفوں میں بٹے تھے، ہر طائفے کے سر پر مقرر کردہ شیخ المطوّفین اور سب کے اوپر شیخوں کا چنا ہوا شیخ المشائخ۔ لڑکا چیراغی سے صنعت میں داخل ہوتا، تجربے کے بعد اہلیت کی رسومات اور «معلمیہ» ضیافت کے ساتھ پیشے میں داخل ہوتا، اور فرض پر وہ بڑی زرد پگڑی، چوڑا کمر بند اور ڈنڈے پر رنگین علم لے کر حاجیوں کے سامنے چلتا اور ہر شوط کے دعائے ان سے دُہراتا۔"
  es: "El mutawwif guiaba a los peregrinos de La Meca: se ocupaba de su alojamiento, comida y salud, y les ayudaba a realizar los ritos del Hajj. Las tarifas que pagaban los peregrinos hicieron que el oficio resultara atractivo para la gente de La Meca; algunas familias lo adoptaron como medio de subsistencia y se formó una profesión. Los mutavvifs se organizaban en grupos cerrados llamados taifes, cada uno bajo la dirección de un shaykh al-mutavvifin designado, con un shaykh al-mashayikh elegido por los shaykhs para todos. Un niño ingresaba como aprendiz, y tras adquirir experiencia era admitido en el oficio en una ceremonia que recordaba la iniciación del akhi, sellada por el banquete 'muallimiye' que él mismo ofrecía; durante su servicio, vestía un gran turbante amarillo y una ancha faja, y portaba un estandarte de colores en un bastón para que sus peregrinos pudieran encontrarlo entre la multitud, repitiendo las oraciones de cada circuito para ellos."
  fr: "Le mutawwif guidait les pèlerins de La Mecque: il veillait à leur hébergement, leur nourriture et leur santé, et les aidait à accomplir les rites du hajj. Les honoraires versés par les pèlerins rendirent ce service attractif pour les Mecquois; certaines familles s’y consacrèrent pour vivre, et une profession se forma. Les mutawwifs s’organisaient en groupes fermés appelés taifes, chacun sous l’autorité d’un cheikh al-mutavvifin désigné, avec un cheikh al-mashayikh choisi par les cheikhs supérieurs. Un garçon entrait comme apprenti, et après avoir acquis de l’expérience, il était admis au métier lors d’une cérémonie rappelant l’initiation de l’akhi, scellée par le festin « muallimiye » qu’il offrait; en service, il portait un grand turban jaune et une large ceinture, et tenait une bannière colorée au bout d’un bâton afin que les pèlerins puissent le repérer dans la foule, récitant pour eux les prières de chaque circuit."
  tr: "Rehber (mutavif), Mekke'de hacıları yönlendiren kişidir: konaklamaları, yemekleri ve sağlıklarıyla ilgilenir ve Hac ibadetlerini tamamlamalarına yardımcı olur. Hacılardan alınan para nedeniyle Mekke halkı için cazip bir meslek haline geldi ve birçok aile bunu bir gelir kaynağı olarak benimsedi. Rehberler, her birinin kendi atanmış şeyhi olan ve şeyhler tarafından seçilen bir şeyhlerin şeyhinin yönetimi altında olan kapalı gruplar halinde örgütlendiler. Erkek çocuk bu mesleğe girer ve yolu öğrendikten sonra, \"başlangıç ziyafeti\" adı verilen bir tören ve ziyafetle resmen mesleğe tanıtılırdı. Rehber, büyük sarı bir sarık ve geniş bir kemer takar, hacılarının kalabalıkta onu görebilmesi için renkli bir sancak kaldırır ve her turda onlar için duaları tekrarlardı."
  id: "Mutawif adalah orang yang memimpin para peziarah di Mekah: ia mengurus akomodasi, makanan, dan kesehatan mereka, serta membantu mereka menyelesaikan ritual haji. Profesi ini menjadi menarik bagi penduduk Mekah karena uang yang dibayarkan oleh para peziarah, sehingga banyak keluarga menjadikannya sebagai sumber penghasilan. Para mutawwif mengorganisir diri mereka menjadi kelompok-kelompok tertutup, masing-masing dengan syekh yang ditunjuk, dan semuanya berada di bawah seorang syekh kepala yang dipilih oleh para syekh. Anak laki-laki memasuki profesi ini sejak kecil, dan ketika ia mempelajari caranya, ia secara resmi diperkenalkan pada profesi tersebut dengan sebuah upacara dan pesta yang disebut \"pesta inisiasi.\" Mutawif mengenakan sorban kuning besar dan ikat pinggang lebar, serta mengibarkan panji berwarna-warni agar para peziarah dapat melihatnya di tengah kerumunan, dan ia akan mengulang doa-doa untuk mereka di setiap putaran."
