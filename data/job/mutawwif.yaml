  certification: "The boy entered the trade as an apprentice in childhood; after a season of experience he was admitted to the profession before the assembled mutavwifs in a ceremony like the akhi passing from apprentice to master, and the new member closed the day by giving the 'muallimiye' feast. A 1965 Saudi circular asked that hajj servants be chosen for sound body and age, adequate knowledge and kindness to pilgrims; in later years the government fixed the mutavwifs' fees."
