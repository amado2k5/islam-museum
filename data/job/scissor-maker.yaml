summary:
  ar: "صانع المقصّات مطرّق الفولاذ مقصّاً، وصناعته فرع من صناعة الحداد تضبطها حُلّة الفولاذ لا الحديد الرخو. يمنع ابن الأخوة الحدادين أن يطرقوا السكاكين والمقصّات والكلّبات وأمثالها من الحديد الرخو الذي لا يصلح لها ثم يبيعوها على أنها فولاذ، فذلك غشّ، وأن لا يُدخِلوا المسامير المستوية المردودة في الجديدة حتى يظنّها المشتري جديدة، ومن فعل ذلك أُخرج من بين المسلمين؛ ولا يُستعمل في السكاكين والمقصّات والمواسي إلا فولاذ خالص. وعدّ إوليا المقراصجية ⁦(صنّاع المقصّات)⁩ في إسطنبول مئة رجل بثلاثين دكاناً، بيرهم باور الأوزبكي الذي قلّده سلمان وقبره ببلدة تيسّي قرب وليّ التركمان أحمد اليسويّ، ويزيّنون دكاكينهم بالمقصّات."
  en: "The scissor-maker hammered steel into shears, a branch of the smith's craft governed by the quality of the steel, not soft iron. Ibn al-Ukhuwwa forbids the blacksmiths to hammer out knives, scissors, pincers and the like from soft iron — useless for the purpose — and sell them as steel, which is fraud; rejected nails that have been straightened out must not be placed among new ones so that the purchaser takes them for new; whoever practises this illegality must be banished from amongst the Muslims, and only pure steel may be used for knives, scissors and razors. In Evliya's Istanbul the scissor-makers (Makrassjian) were a hundred men in thirty shops; their patron is Pawer the Uzbekian, girded by Selman Pak, buried in the town of Tissi near the saint of the Turcomans, Ahmed Yesevi, and they laid out their shops with scissors."
  ur: "قینچی ساز فولاد کو قینچی گاڑھتا ہے — لوہار کے پیشے کی ایک شاخ جس کا انحصار نرم لوہے پر نہیں فولاد کی پاکیزگی پر ہے۔ ابن الاخوہ لوہاروں کو منع کرتا ہے کہ چاقو، قینچیاں، چمٹے وغیرہ نرم لوہے سے گاڑھیں جو اس کام کے قابل نہیں اور فولاد کہہ کر بیچیں، یہ دھوکہ ہے؛ پھینکی ہوئی سیدھی کی گئی کیلیں نئیوں میں نہ ملائی جائیں کہ خریدار انہیں نئی سمجھ لے؛ جو یہ حرام کاری کرے وہ مسلمانوں سے خارج ہو؛ اور چاقو، قینچی اور استرے صرف خالص فولاد کے بنیں۔ اولیاء کے استنبول میں قینچی ساز ⁦(مقراصجیان)⁩ سو آدمی تیس دکانیں تھے؛ ان کا پیر ازبک پاور ہے جسے سلمان پاک نے کمر بند پہنائی اور ترکمانوں کے ولی احمد یسوی کے پاس تیسی بستی میں مدفون ہے، اور وہ اپنی دکانیں قینچیوں سے سجاتے تھے۔"
  es: "El fabricante de tijeras forjaba acero para convertirlo en cizallas, una rama del oficio de herrero regida por la calidad del acero, no por el hierro dulce. Ibn al-Ukhuwwa prohíbe a los herreros forjar cuchillos, tijeras, tenazas y similares con hierro dulce —inútil para tal fin— y venderlos como acero, lo cual es un fraude; los clavos rechazados que han sido enderezados no deben colocarse entre los nuevos para que el comprador los confunda con nuevos; quien practique esta ilegalidad debe ser desterrado de entre los musulmanes, y solo se puede usar acero puro para cuchillos, tijeras y navajas de afeitar. En el Estambul de Evliya, los fabricantes de tijeras (Makrassjian) eran cien hombres en treinta talleres; su patrón es Pawer el Uzbeki, ceñido por Selman Pak, enterrado en la ciudad de Tissi cerca del santo de los turcomanos, Ahmed Yesevi, y organizaban sus talleres con tijeras."
