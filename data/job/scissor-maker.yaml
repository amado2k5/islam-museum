  techniques:
    ar: "يفصّل ابن الأخوة والشيزري ضبط الفولاذ في حواسم الحداد: لا تُطرَق السكاكين والمقصّات والكلّبات ونظائرها من الحديد الرخو الذي لا يصلح لها ثم تُباع باسم الفولاذ، فذلك غشّ؛ ولا تُدخَل المسامير المستوية المردودة بين الجديدة دخولاً يُطمِّع المشتري أنها جديدة، وكذلك سائر أنواع المصنوعات الحديدية؛ ومن ركب هذا الحرام أُخرج من بين المسلمين؛ ويُقتصَر في السكاكين والمقصّات والمواسي على فولاذ خالص. وعند إوليا طائفة المقراصجية على حدة بمئة رجل وثلاثين دكاناً تزيّن دكاكينها بالمقصّات."
    en: "Ibn al-Ukhuwwa and al-Shayzari detail the policing of steel in the smiths' edged wares: knives, scissors, pincers and the like must not be hammered out of soft iron, useless for the purpose, and then sold as steel — that is fraud; rejected straightened nails must not be placed among new ones in a way that makes the purchaser unhesitatingly believe them new, and the same applies to all varieties of iron-ware; anyone who practises this illegality must be banished from amongst the Muslims; and only pure steel is to be used for knives, scissors and razors. In Evliya the scissor-makers are a guild apart, a hundred men in thirty shops adorning their shops with scissors."
    ur: "ابن الاخوہ اور شیزری لوہاروں کے دھاردار سامان میں فولاد کی پاسداری تفصیل دیتے ہیں: چاقو، قینچیاں، چمٹے وغیرہ نرم لوہے سے نہ گاڑھے جائیں جو اس کام کے قابل نہیں، پھر فولاد کہہ کر بیچے جائیں — یہ دھوکہ ہے؛ پھینکی سیدھی کیلیں نئیوں میں اس طرح نہ رکھی جائیں کہ خریدار بے شک انہیں نئی سمجھے، اور یہ حکم تمام لوہے کے سامان پر ہے؛ جو یہ حرام کاری کرے وہ مسلمانوں سے خارج ہو؛ اور چاقو، قینچی اور استرے صرف خالص فولاد کے ہوں۔ اولیاء کے نزدیک قینچی ساز الگ انجمن ہیں، سو آدمی تیس دکانیں جو اپنی دکانیں قینچیوں سے سجاتے ہیں۔"
