summary:
  ar: "شيخ التصوف هو المرشد الذي يربّي المريدين على طريق الطريقة؛ اكتسب اللقب معناه الصوفي من منتصف القرن الرابع الهجري في مؤلّفات السرّاج والكلاباذي والسلمي. الشيخ كامل المنهج يجمع الشريعة والطريقة والحقيقة، يربّي المريد بالتلقين والصحبة والنظر حتى يستوفي سيره، فيعطيه الإجازة ويلبسه خلافة الإرشاد ثم يصير خليفته حاملاً الطريقة من بعده؛ وتسمّيه الأمصار خواجه وأتا وإيشان وبابا ودده بابا."
  en: "The Sufi shaykh is the murshid who trains murids on the order's path; the title took on its Sufi sense from the middle of the fourth century AH in the works of al-Sarraj, al-Kalabadhi and al-Sulami. The complete shaykh joins shari'a, tariqa and haqiqa, trains the murid by instruction, companionship and gaze until his suluk is finished, then grants him the ijaza and the cloak of guidance and he becomes his khalifa carrying the order after him; the regions name him hoca, ata, ishan, baba and dede-baba."
  ur: "صوفی شیخ وہ مرشد ہے جو مریدوں کو سلسلے کے راستے پر تربیت دیتا ہے؛ یہ لقب چوتھی صدی ہجری کے وسط سے سراج، کلاباذی اور سلمی کی تصانیف میں صوفیانہ مفہوم پانے لگا۔ مکمل شیخ شریعت، طریقت اور حقیقت کو جمع کرتا ہے، مرید کی تلقین، صحبت اور نظر سے تربیت کرتا ہے، اور پورا ہونے پر اجازت اور خلافت کی کھڑقا دے کر اپنا خلیفہ بناتا ہے؛ علاقوں میں اسے خواجہ، آتا، ایشان، بابا اور ددہ بابا کہا جاتا ہے۔"
  es: "El shaykh sufí es el murshid que instruye a los murids en el camino de la orden; el título adquirió su sentido sufí a mediados del siglo IV d. C. en las obras de al-Sarraj, al-Kalabadhi y al-Sulami. El shaykh completo integra la sharia, la tariqa y la haqiqa, instruye al murid mediante la enseñanza, la compañía y la mirada hasta que completa su suluk, luego le otorga la ijaza y el manto de guía y se convierte en su khalifa, continuando la orden tras él; las regiones lo denominan hoca, ata, ishan, baba y dede-baba."
  fr: "Le cheikh soufi est le murshid qui forme les murids sur la voie de l'ordre; ce titre a acquis son sens soufi au milieu du IVe siècle de l'Hégire, notamment dans les œuvres d'al-Sarraj, d'al-Kalabadhi et d'al-Sulami. Le cheikh accompli unit la charia, la tariqa et la haqiqa, forme le murid par l'instruction, le partage et l'écoute attentive jusqu'à la fin de son suluk, puis lui confère l'ijaza et le manteau de la guidance. Le murid devient alors son khalifa, perpétuant ainsi l'ordre; selon les régions, on le nomme hoca, ata, ishan, baba ou dede-baba."
  tr: "Sufi şeyh, Sufi tarikatının yolunda müritleri eğiten rehberdir. Bu unvan, Hicri dördüncü yüzyılın ortalarında el-Sarraj, el-Kalabadhi ve el-Sulami'nin yazılarında Sufi anlamını kazanmıştır. Şeyh, Şeriat, Tarikat ve Hakikat'ı birleştiren eksiksiz bir rehberdir. Müritini, yolculuğunu tamamlayana kadar öğretim, arkadaşlık ve tefekkür yoluyla eğitir; bu noktada ona izin verir ve manevi rehberlik görevini ona bahşeder. Mürit daha sonra onun halefi olur ve yolu ondan sonra devam ettirir. Çeşitli bölgelerde ona Khawaja, Ata, Ishan, Baba ve Dede Baba denir."
  id: "Syekh Sufi adalah pembimbing yang melatih murid-murid di jalan tarekat Sufi. Gelar ini memperoleh makna Sufinya sejak pertengahan abad keempat Hijriah dalam tulisan-tulisan al-Sarraj, al-Kalabadhi, dan al-Sulami. Syekh adalah pembimbing yang lengkap, menggabungkan Syariah, Tariqa, dan Haqiqa. Ia melatih murid melalui pengajaran, persahabatan, dan kontemplasi hingga murid tersebut menyelesaikan perjalanannya, di mana ia memberikan izin dan menganugerahkan kepadanya jubah pembimbing spiritual. Murid tersebut kemudian menjadi penerusnya, melanjutkan jalan setelahnya. Di berbagai daerah, ia disebut Khawaja, Ata, Ishan, Baba, dan Dede Baba."
