summary:
  ar: "الملك لقب قديم في اللغات السامية ظهر في نقائش جنوب الجزيرة وشمالها قبل الإسلام، ثم أحجم المسلمون الأوائل عنه ورضوا بالخلافة وإمارة المؤمنين، حتى عاد مع السامانيين والبويهيين لقباً للحكام وانتشر في السلاجقة والزنكيين والأيوبيين والمماليك، وغدا لقباً لأمراء الأقاليم والوزراء حتى تضخم، ثم اندثر في العثمانيين وعاد في القرن العشرين مع ممالك الحجاز والعراق ومصر والمغرب وغيرها."
  en: "Malik (king) is an old Semitic title attested in pre-Islamic inscriptions of South and North Arabia. The first Muslims declined it in favour of khalifa and amir al-mu'minin; it returned with the Samanids and Buyids as a royal title, spread under the Seljuks, Zengids, Ayyubids and Mamluks, and was handed to provincial princes and viziers until it inflated. The Ottomans scarcely used it; in the twentieth century it revived as the standard title of the new kingdoms of the Hijaz, Iraq, Egypt, Morocco and others."
  ur: "ملک قدیم سامی زبانوں کا لقب ہے جو اسلام سے پہلے جنوبی و شمالی عرب کی کتبوں میں ملتا ہے۔ ابتدائی مسلمانوں نے اسے چھوڑ کر خلیفہ اور امیر المؤمنین اختیار کیا؛ پھر یہ سامانیوں اور بویہیوں کے ساتھ شاہی لقب بن کر لوٹا، سلجوقیوں، زنگیوں، ایوبیوں اور مملوکوں میں پھیلا، اور صوبائی شہزادوں اور وزیروں تک پہنچ کر اتنا عام ہوا کہ قدر گھٹ گئی۔ عثمانیوں نے کم ہی استعمال کیا؛ بیسویں صدی میں یہ حجاز، عراق، مصر اور مراکش کی نئی بادشاہتوں کا لقب بن کر زندہ ہوا۔"
  es: "Malik (rey) es un antiguo título semítico atestiguado en inscripciones preislámicas del sur y norte de Arabia. Los primeros musulmanes lo rechazaron en favor de khalifa y amir al-mu'minin; resurgió con los samaníes y buyíes como título real, se extendió bajo los selyúcidas, zengíes, ayubíes y mamelucos, y se otorgó a príncipes y visires provinciales hasta que se volvió ostentoso. Los otomanos apenas lo usaron; en el siglo XX, resurgió como título estándar de los nuevos reinos del Hiyaz, Irak, Egipto, Marruecos y otros."
  fr: "Malik (roi) est un ancien titre sémitique attesté dans des inscriptions préislamiques d'Arabie du Sud et du Nord. Les premiers musulmans le rejetèrent au profit de khalifa et d'émir des croyants; il réapparut comme titre royal sous les Samanides et les Bouyides, se répandit sous les Seldjoukides, les Zengides, les Ayyoubides et les Mamelouks, et fut attribué aux princes provinciaux et aux vizirs jusqu'à ce qu'il prenne une ampleur considérable. Les Ottomans l'utilisèrent peu; au XXe siècle, il fit son retour comme titre officiel des nouveaux royaumes du Hedjaz, d'Irak, d'Égypte, du Maroc et d'autres encore."
  tr: "Kral, İslamiyet öncesi dönemde yarımadanın güney ve kuzeyindeki yazıtlarda görülen, Semitik dillerde eski bir unvandır. İlk Müslümanlar daha sonra bu unvanı kullanmaktan vazgeçmiş ve Halifelik ve Müminlerin Emirliği ile yetinmişlerdir. Daha sonra Samaniler ve Büveyhiler döneminde hükümdarlar için bir unvan olarak geri dönmüş, Selçuklular, Zengidler, Eyyubiler ve Memlükler arasında yayılmış ve bölgesel prensler ve bakanlar için bir unvan haline gelmiştir. Zamanla şişmiş, Osmanlılar döneminde ortadan kaybolmuş ve yirminci yüzyılda Hicaz, Irak, Mısır, Fas ve diğer krallıklarla birlikte tekrar ortaya çıkmıştır."
  id: "Raja adalah gelar kuno dalam bahasa Semit yang muncul dalam prasasti di selatan dan utara semenanjung sebelum Islam. Umat Islam awal kemudian menghindari gelar ini dan puas dengan Kekhalifahan dan Emirat Kaum Beriman, hingga gelar ini kembali pada masa Dinasti Samanid dan Buyid sebagai gelar bagi para penguasa dan menyebar di kalangan Seljuk, Zengid, Ayyubiyah, dan Mamluk, serta menjadi gelar bagi para pangeran dan menteri daerah hingga akhirnya menjadi berlebihan, kemudian menghilang di masa Kesultanan Utsmaniyah dan kembali pada abad ke-20 dengan kerajaan-kerajaan Hijaz, Irak, Mesir, Maroko, dan lainnya."
