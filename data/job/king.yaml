places:
  - { place: place/medina, note: "After the Prophet's death the community did not adopt the royal title: the Rashidun, the Umayyads and the Abbasid heads of state called themselves khalifa, amir al-mu'minin and, rarely, imam.", sources: [source/tdv-melik] }
  - { place: place/bukhara, note: "The Samanids of Khurasan and Transoxiana were the first Muslim dynasty to take the malik title to mark a degree of independence: Nuh b. Nasr ⁦(943-954)⁩ struck 'al-Malik al-Mu'ayyad' on his coins.", sources: [source/tdv-melik] }
  - { place: place/baghdad, note: "In 429/1038 the Buyid amir Jalal al-Dawla asked the Abbasid caliph in Baghdad for permission to use 'shahanshah al-a'zam malik al-muluk', and the scholar-official Hezaresb offered 100,000 dinars for the malik title and was told it could be given only to Seljuk dynasts.", sources: [source/tdv-melik] }
  - { place: place/cairo, note: "Under the Fatimids malik belonged to amirs and above all to viziers — Ridwan b. Walakhshi took 'al-sayyid al-ajall al-malik al-afdal' in 530/1136 — and under the Mamluks the sultans compounded it: al-Malik al-Mu'izz Aybak, al-Muzaffar Qutuz, al-Qahir Baybars.", sources: [source/tdv-melik] }
  - { place: place/delhi, note: "Raziyya of Delhi, the only female ruler of Muslim India, preferred the malika title to the sultan used by the rest of her dynasty; Shajar al-Durr had likewise been styled malikat al-Islam in Mamluk Egypt.", sources: [source/tdv-melik] }
