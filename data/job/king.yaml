training:
  mode: hereditary-family
  certification: "Kingship ran in dynasties and was sealed by the marks of sovereignty the entry lists: the khutba read and coins struck in the ruler's name, the caliph's permission or investiture for a disputed title, and the ceremonial nevbet — the great sultan beat five watches a day while a provincial malik might beat no more than three."
  duration: "A malik ruling a province under a greater sultan kept a court modelled on the capital — his own vizier, treasury, commanders and divan — and his authority was confirmed or renewed by a new manshur whenever sultan or malik changed."
