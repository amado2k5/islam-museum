summary:
  ar: "القرسان بحّار مقاتل يغير على سفن العدو وسواحله خارج الأسطول النظامي؛ في العالم الإسلامي وُصف عمله حين يكون غزواً مشروعاً بأنه جزء من الجهاد ⁦(غزاة البحر)⁩، وحين يكون سلباً لغرض الغنيمة سُمّي فاعله حرامياً ولصّ البحر. من غارات الأندلسيين على سواحل فرنسا ودولة القراصنة في فركسنتوم إلى لوندات بيليكات إيجة وقبطانات بربروس وطورغوت وصالح ومراد ريّس تحت العثمانيين، كانت القرصنة وسيلة حرب ومعاشاً معاً، تطعم الأسطول بالقبطانات وترهب أعداءه حتى أقصى الأطلسي. حظّر مؤتمر باريس 1856 القرصنة جريمةً في القانون الدولي؛ وفي الفقه يبقى فرق بين الغزو المشروع والحرابة."
  en: "The corsair was the fighting sailor who raided enemy ships and shores outside the regular fleet. In the Islamic world his work was read two ways: as legitimate sea-gaza, a part of jihad — Ibn Khaldun used the hadith phrase 'the ghazis of the sea' (guzâtü'l-bahr) for corsairs — or, when it meant seizing goods for gain, as harami brigandage, 'the thieves of the sea'. Muslim corsairs raided from the first conquests: Andalusi exiles took Crete in 827, Maghrebi corsairs held Fraxinetum on the Provence coast for over eighty years, the Aegean beyliks' levents sailed under Karasi, Saruhan, Aydın and Menteşe, and the Ottoman age raised Kemal Reis, the Barbarossa brothers, Turgut, Seydi Ali, Sinan, Salih and Murad Reis to cruise the Mediterranean and out into the Atlantic as far as Iceland. The corsair filled the fleet with captains — Kâtib Çelebi advised every kapudan to consult the 'sea-wolves' — until the 1856 Paris congress made corsairing a crime in the law of nations."
  ur: "قزاق وہ لڑاکا ملاح تھا جو باقاعدہ بیڑے سے الگ دشمن جہازوں اور ساحلوں پر چھاپا مارتا۔ اسلامی دنیا میں اس کے کام کی دو قراءتیں تھیں: جائز بحری غزہ — ابن خلدون نے حدیث کے لفظ «غزاة البحر» قزاقوں کے لیے استعمال کیا — اور جب مقصد مال لوٹنا ہو تو حرامی قزاقی، «سمندر کے ڈاکو»۔ مسلمان قزاق ابتدائی فتوحات سے چھاپے مارتے رہے: 827 میں اندلسی جلاوطنوں نے کریٹ لیا، ماگریب قزاقوں نے پروونس ساحل پر فراکسینٹم اسی برس سے زائد قائم رکھا، ایجہ بیلیکوں کے لوند قرہ سی، صاروخان، آیدن اور منتشے کے تابع چلے، اور عثمانی دور نے کمال رئیس، بربروس بھائی، طورغوت، سیدی علی، سنان، صالح اور مراد رئیس کو اٹھایا جو بحیرہ روم سے بحر اوقیانوس اور آئس لینڈ تک گئے۔ قزاق بیڑے کو کپتان دیتے — کاتب چلبی نے ہر قپودان کو «سمندری بھیڑیوں» سے مشورے کا مشورہ دیا — یہاں تک کہ 1856 کی پیرس کانگریس نے قزاقی کو بین الاقوامی جرم قرار دیا۔"
  es: "El corsario era el marinero combatiente que asaltaba barcos y costas enemigas fuera de la flota regular. En el mundo islámico, su labor se interpretaba de dos maneras: como una legítima guerra marítima (sea-gaza), parte de la yihad —Ibn Khaldun utilizó la expresión hadiz «los gazis del mar» (guzâtü'l-bahr) para referirse a los corsarios— o, cuando significaba apoderarse de bienes para obtener ganancias, como un bandidaje ilícito (harami), «los ladrones del mar». Los corsarios musulmanes saquearon desde las primeras conquistas: los exiliados andalusíes tomaron Creta en 827, los corsarios magrebíes mantuvieron Fraxinetum en la costa de Provenza durante más de ochenta años, los levents de los beyliks del Egeo navegaron bajo el mando de Karasi, Saruhan, Aydın y Menteşe, y la era otomana elevó a Kemal Reis, los hermanos Barbarroja, Turgut, Seydi Ali, Sinan, Salih y Murad Reis para patrullar el Mediterráneo y adentrarse en el Atlántico hasta Islandia. Los corsarios llenaron la flota de capitanes —Kâtib Çelebi aconsejaba a cada kapudan que consultara a los «lobos del mar»— hasta que el congreso de París de 1856 convirtió el corso en un delito en el derecho internacional."
  fr: "Le corsaire était le marin combattant qui pillait les navires et les côtes ennemies en dehors de la flotte régulière. Dans le monde islamique, son activité était interprétée de deux manières: soit comme une activité maritime légitime (ghazi), composante du jihad – Ibn Khaldun utilisait l’expression hadith « les ghazis de la mer » (guzâtü’l-bahr) pour désigner les corsaires – soit, lorsqu’elle consistait à s’emparer de biens à des fins lucratives, comme un brigandage illicite (harami), les désignant comme « les voleurs de la mer ». Dès les premières conquêtes, les corsaires musulmans menèrent des raids: les exilés andalous s'emparèrent de la Crète en 827, les corsaires maghrébins contrôlèrent Fraxinetum sur la côte provençale pendant plus de quatre-vingts ans, les levents des beyliks égéens naviguèrent sous le commandement de Karasi, Saruhan, Aydın et Menteşe, et, à l'époque ottomane, Kemal Reis, les frères Barberousse, Turgut, Seydi Ali, Sinan, Salih et Murad Reis sillonnèrent la Méditerranée et l'Atlantique jusqu'en Islande. La corsarité occupait une place prépondérante dans les flottes – Kâtib Çelebi conseillait à chaque kapudan de consulter les « loups de mer » – jusqu'à ce que le congrès de Paris de 1856 érige la corsarité en crime de droit international."
