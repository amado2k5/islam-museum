  - { place: place/algiers, note: "In the Ottoman age the North African corsair bases — Algiers above all — fielded state-backed corsair groups that raided the European coasts and islands of the Mediterranean, becoming a standing problem of international relations in the eighteenth and nineteenth centuries.", sources: [source/tdv-korsan] }
  - { place: place/malta, note: "The entry records both the Muslim corsair strongholds and their mirror image: the knights based at Malta kept up corsair operations against Ottoman shipping in the sixteenth to eighteenth centuries, reaching as far as the Syrian coasts.", sources: [source/tdv-korsan] }
