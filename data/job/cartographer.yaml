summary:
  ar: "رسّام الخرائط هو من يرسم صور الأرض في الكتب الجغرافية وعلى الألواح الملكية. يذكر كريمرز أن الخوارزمي جرّب بطلميوس نحو 830م بخريطة رافقت نصّه وضاعت، وأن المأمون أمر سبعين عالماً برسم «صورة الأرض» وقياس درجة الطول في بادية الشام؛ وأن مدرسة البلخي في القرن العاشر أنتجت خرائط العالم الدائرية التي مركزها مكة يحيط بها المحيط، ونصوصها شرح لخرائطها عند الإسطخري وابن حوقل والمقدسي، وهي خرائط بلا صور آدميين ولا بهائم على خلاف خرائط أوروبا آنذاك؛ وأن الإدريسي رسم لروجر الثاني ملك صقلية سبعين خريطة تُركَّب مستطيلاً واحداً عرضه الأقاليم السبعة."
  en: "The cartographer drew the 'images' of the earth in geographical books and on royal plates. Kramers records that al-Khwarizmi adapted Ptolemy about 830 with a map that accompanied his text and is lost; that al-Ma'mun ordered seventy scholars to execute an 'image of the earth' and had a geographical degree measured in the Syrian desert; that the tenth-century Balkhi school produced circular world-maps centred on Mecca and girdled by the encircling ocean, their texts a commentary on the maps, in the works of al-Istakhri, Ibn Hawqal and al-Maqdisi — maps without pictures of men and animals, unlike contemporary European maps; and that al-Idrisi drew for Roger II of Sicily seventy maps which fit together into a single oblong quadrangle arranged by the seven climates."
  ur: "نقشہ ساز جغرافیائی کتب اور شاہی تختوں پر زمین کی «صورتیں» ترتیب دیتا تھا۔ کریمرز لکھتا ہے کہ خوارزمی نے ۸۳۰ء کے قریب بطلمیوس کی تالیف کے ساتھ ایک نقشہ لگایا جو کھو گیا؛ مأمون نے ستر علماء سے «صورتِ ارض» بنوائی اور صحرائے شام میں جغرافیائی درجے کی پیمائش کرائی؛ دسویں صدی کے بلخی مکتب نے مکہ کو مرکز رکھ کر گول عالمی نقشے بنائے جنہیں بحرِ محیط گھیرے تھا اور جن کا متن نقشوں کی شرح تھا — الاسطخری، ابن حوقل اور مقدسی کی تصانیف میں — اور ان نقشوں میں انسانوں اور جانوروں کی تصویریں نہیں تھیں برعکس اس زمانے کے یورپی نقشوں کے؛ اور الادریسی نے سسلی کے شاہ روجر دوم کے لیے ستر نقشے بنائے جو مل کر ایک لمبا چوکور بناتے ہیں اور سات اقالیم کی ترتیب رکھتے ہیں۔"
  es: "El cartógrafo dibujó las \"imágenes\" de la tierra en libros geográficos y en planchas reales. Kramers registra que al-Juarismi adaptó a Ptolomeo alrededor del año 830 con un mapa que acompañaba su texto y que se ha perdido; que al-Ma'mun ordenó a setenta eruditos que elaboraran una \"imagen de la tierra\" y mandó medir un grado geográfico en el desierto sirio; que la escuela balkhi del siglo X produjo mapas mundiales circulares centrados en La Meca y rodeados por el océano, cuyos textos eran un comentario sobre los mapas, en las obras de al-Istakhri, Ibn Hawqal y al-Maqdisi —mapas sin imágenes de hombres ni animales, a diferencia de los mapas europeos contemporáneos—; y que al-Idrisi dibujó para Roger II de Sicilia setenta mapas que encajaban en un único cuadrilátero oblongo organizado según los siete climas."
  fr: "Le cartographe dessinait des représentations de la Terre dans des ouvrages géographiques et sur des plaques royales. Kramers rapporte qu'al-Khwarizmi adapta Ptolémée vers 830 avec une carte qui accompagnait son texte et qui est aujourd'hui perdue; qu'al-Ma'mun ordonna à soixante-dix savants de réaliser une représentation de la Terre et obtint un diplôme de géographie mesuré dans le désert syrien; que l'école balkanique du Xᵉ siècle produisit des cartes du monde circulaires centrées sur La Mecque et entourées par l'océan, leurs textes servant de commentaires, dans les œuvres d'al-Istakhri, d'Ibn Hawqal et d'al-Maqdisi – des cartes sans représentation d'hommes ni d'animaux, contrairement aux cartes européennes contemporaines; et qu'al-Idrisi dessina pour Roger II de Sicile soixante-dix cartes qui s'emboîtaient en un seul quadrilatère oblong, organisé selon les sept climats."
  tr: "Haritacı, coğrafya kitaplarında ve kraliyet tabletlerinde Dünya'nın resimlerini çizen kişidir. Kramers, El-Harezmi'nin MS 830 civarında Batlamyus'u metnine eşlik eden ve kaybolan bir haritayla sınadığını; El-Ma'mun'un yetmiş bilginine \"Dünya'nın resmini\" çizmelerini ve Suriye Çölü'ndeki boylam derecesini ölçmelerini emrettiğini; onuncu yüzyılda El-Balki okulunun, Mekke merkezli ve okyanusla çevrili dairesel dünya haritaları ürettiğini ve metinlerinin El-İstakhri, İbn Havkal ve El-Mukaddesi tarafından yapılan harita açıklamaları olduğunu ve bu haritaların o zamanki Avrupa haritalarının aksine insan veya hayvan resimleri içermediğini; ve El-İdrisi'nin Sicilya Kralı II. Roger için, genişliği yedi iklim olan tek bir dikdörtgen halinde bir araya getirilmiş yetmiş harita çizdiğini belirtir."
  id: "Seorang kartografer adalah seseorang yang menggambar peta Bumi dalam buku-buku geografis dan di atas lempengan kerajaan. Kramers menyebutkan bahwa Al-Khwarizmi menguji Ptolemy sekitar tahun 830 M dengan peta yang menyertai teksnya dan hilang, dan bahwa Al-Ma'mun memerintahkan tujuh puluh sarjana untuk menggambar \"gambar Bumi\" dan mengukur derajat garis bujur di Gurun Suriah; dan bahwa sekolah Al-Balkhi pada abad kesepuluh menghasilkan peta dunia melingkar yang berpusat di Mekah yang dikelilingi oleh lautan, dan teks-teksnya merupakan penjelasan peta-peta tersebut oleh Al-Istakhri, Ibn Hawqal dan Al-Muqaddasi, dan ini adalah peta tanpa gambar manusia atau hewan, tidak seperti peta Eropa pada waktu itu; dan bahwa Al-Idrisi menggambar untuk Roger II, Raja Sisilia, tujuh puluh peta yang disusun menjadi satu persegi panjang yang lebarnya adalah tujuh iklim."
