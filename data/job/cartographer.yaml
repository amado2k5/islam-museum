summary:
  ar: "رسّام الخرائط هو من يرسم صور الأرض في الكتب الجغرافية وعلى الألواح الملكية. يذكر كريمرز أن الخوارزمي جرّب بطلميوس نحو 830م بخريطة رافقت نصّه وضاعت، وأن المأمون أمر سبعين عالماً برسم «صورة الأرض» وقياس درجة الطول في بادية الشام؛ وأن مدرسة البلخي في القرن العاشر أنتجت خرائط العالم الدائرية التي مركزها مكة يحيط بها المحيط، ونصوصها شرح لخرائطها عند الإسطخري وابن حوقل والمقدسي، وهي خرائط بلا صور آدميين ولا بهائم على خلاف خرائط أوروبا آنذاك؛ وأن الإدريسي رسم لروجر الثاني ملك صقلية سبعين خريطة تُركَّب مستطيلاً واحداً عرضه الأقاليم السبعة."
  en: "The cartographer drew the 'images' of the earth in geographical books and on royal plates. Kramers records that al-Khwarizmi adapted Ptolemy about 830 with a map that accompanied his text and is lost; that al-Ma'mun ordered seventy scholars to execute an 'image of the earth' and had a geographical degree measured in the Syrian desert; that the tenth-century Balkhi school produced circular world-maps centred on Mecca and girdled by the encircling ocean, their texts a commentary on the maps, in the works of al-Istakhri, Ibn Hawqal and al-Maqdisi — maps without pictures of men and animals, unlike contemporary European maps; and that al-Idrisi drew for Roger II of Sicily seventy maps which fit together into a single oblong quadrangle arranged by the seven climates."
  ur: "نقشہ ساز جغرافیائی کتب اور شاہی تختوں پر زمین کی «صورتیں» ترتیب دیتا تھا۔ کریمرز لکھتا ہے کہ خوارزمی نے ۸۳۰ء کے قریب بطلمیوس کی تالیف کے ساتھ ایک نقشہ لگایا جو کھو گیا؛ مأمون نے ستر علماء سے «صورتِ ارض» بنوائی اور صحرائے شام میں جغرافیائی درجے کی پیمائش کرائی؛ دسویں صدی کے بلخی مکتب نے مکہ کو مرکز رکھ کر گول عالمی نقشے بنائے جنہیں بحرِ محیط گھیرے تھا اور جن کا متن نقشوں کی شرح تھا — الاسطخری، ابن حوقل اور مقدسی کی تصانیف میں — اور ان نقشوں میں انسانوں اور جانوروں کی تصویریں نہیں تھیں برعکس اس زمانے کے یورپی نقشوں کے؛ اور الادریسی نے سسلی کے شاہ روجر دوم کے لیے ستر نقشے بنائے جو مل کر ایک لمبا چوکور بناتے ہیں اور سات اقالیم کی ترتیب رکھتے ہیں۔"
