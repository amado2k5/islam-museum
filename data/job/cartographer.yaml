craft:
  techniques:
    ar: "يميّز كريمرز بين جغرافيا الفلكيين وجغرافيا الكتّاب الرحّالة: فالفلكيون أمثال الفرغاني والبتاني وابن يونس والبيروني وضعوا جداول الطول والعرض على منهاج الأقاليم السبعة، بينما كتب «المسالك والممالك» وصفاً إدارياً وطرقاً عند ابن خرداذبه واليعقوبي وابن الفقيه وابن رسته. ثم جاءت مدرسة البلخي بمصاحبة الخرائط للنص: خريطة عالم دائرية مركزها مكة يحيط بها بحر محيط يدخل منه خليجان يكادان يلتقيان عند برزخ السويس، ثم خرائط الأقاليم بالترتيب؛ وهي خرائط بلا صور ذوات الأرواح على عادة المنع، وإن أخذت السواحل والأنهار أشكالاً اصطلاحية فجاءت البحر المتوسط عند الإسطخري دائرة أو قطعاً ناقصاً. وعمل الإدريسي لروجر الثاني سبعين خريطة جزءاً من أقاليم سبعة، وخريطة عالم دائرية تتقدمها، وخط ساحلها للبحر الأبيض أقرب إلى الحقيقة من كل سابقيه."
    en: "Kramers distinguishes the astronomers' geography from that of the writing travellers: the astronomers such as al-Farghani, al-Battani, Ibn Yunus and al-Biruni gave tables of longitude and latitude arranged by the seven climates, while the Books of Roads and Kingdoms — Ibn Khurradadhbih, al-Ya'qubi, Ibn al-Faqih, Ibn Rusta — gave administrative description and itineraries. Then the Balkhi school made the text a description of its maps: a circular world-map with Mecca at its centre girdled by the encircling ocean from which two gulfs enter and nearly meet at the isthmus of Suez, then the regional maps in their order. The maps carry no pictures of living beings, in keeping with the prohibition, though coasts and rivers take conventionalised forms, the Mediterranean in the Istakhri maps appearing as a circle or ellipse. Al-Idrisi made for Roger II seventy maps dividing the seven climates, preceded by a circular world-map, and his Mediterranean coast-line answered reality better than any previous Islamic map."
    ur: "کریمرز ماہرِ فلکیات کے جغرافیے کو مسافر مصنفوں کے جغرافیے سے الگ کرتا ہے: الفرغانی، البتانی، ابن یونس اور البیرونی جیسے منجّموں نے سات اقالیم کے منہج پر طول و عرض کے جدول دیے، جب کہ «مسالک و ممالک» کی کتب — ابن خردادبہ، الیعقوبی، ابن فقیہ، ابن رستہ — انتظامی تفصیل اور راستے بیان کرتی ہیں۔ پھر بلخی مکتب نے متن کو نقشوں کی شرح بنایا: گول عالمی نقشہ جس کے مرکز مکہ ہے اور بحرِ محیط اسے گھیرے ہے جس سے دو خلیجیں داخل ہو کر برخائے سوئس کے قریب ملتی ہیں، پھر علاقائی نقشے ترتیب سے۔ نقشوں میں جانداروں کی تصویر نہیں، ممنوعہ کے مطابق، لیکن ساحل اور دریا قراردادی شکلیں لیتے ہیں — اسطخری کے نقشوں میں بحیرہ روم دائرہ یا بیضہ ہے۔ الادریسی نے روجر دوم کے لیے سات اقالیم پر ستر نقشے بنائے جن سے پہلے گول عالمی نقشہ ہے، اور اس کا بحیرہ روم کا ساحل کسی بھی سابق اسلامی نقشے سے زیادہ حقیقت سے میل کھاتا ہے۔"
