training:
  mode: state-licence
  certification: "Appointment came by berat: Naima received a purse of gift-money, 120 akçe a day and a commission deed when the grand vizier set him to work on Şârihülmenârzâde's drafts. Appointees were sought for 'skill and learning, comprehension, continuous composition and occupation with the spread of the sciences'; the office was filled from the divan bureaux's inşa masters and poets or from the ilmiye, and the choice could be scrutinised at the top — Mahmud II hesitated over names until the 'capable and suitable' Sahaflar Şeyhizade Esad Efendi was chosen."
  duration: "The office ran continuously from Raşid Mehmed Efendi (d. 1148/1735); holders usually kept a primary post in the divan bureaux or the ilmiye and drew an extra allowance for the vak'anüvislik."
