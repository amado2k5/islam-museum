summary:
  ar: "المؤرّخ في الدولة العثمانية هو الوقعة نويس: الموظف الرسمي المكلّف بكتابة وقائع عصره ضمن دواوين الديوان الهمايوني. استُخدم اللقب أولاً لأدباء مثل طالعكي زاده ونركيسي، ثم صار وظيفة دائمة حين عيّن الصدر الأعظم أم جازادة حسين باشا نعيمة لتحرير مسودات شارح المنار زاده أحمد أفندي بأوقاف سنة وبرات وراتب قدره ١٢٠ أقجة يومياً، واستقرّت رسمياً منذ راشد محمد أفندي ⁦(ت ١١٤٨هـ)⁩؛ وكان الوقعة نويس يتلقى الأخبار والإحالات من دواوين الدولة، ويكمل نواقص سابقيه من مسوداتهم ووثائقهم، ويقدّم جزء كل سنة إلى السلطان عبر الصدارة."
  en: "The historian in the Ottoman state was the vak'anüvis: the official charged with writing the events of his age within the offices of the Divan-i Hümayun. The title was first used of literary figures like Talikizade and Nergisi, then became a permanent state service when Grand Vizier Amcazade Hüseyin Pasha appointed Naima to edit Şârihülmenârzâde Ahmed Efendi's draft histories with a grant, a berat and a daily salary of 120 akçe; from Raşid Mehmed Efendi (d. 1148 AH) it settled as a continuous office. The vak'anüvis received reports and ilmühaber minutes from the state's bureaux, completed his predecessors' gaps from their notes and papers, and submitted each year's fascicle to the sultan through the grand vizierate."
  ur: "سلطنت عثمانیہ میں مؤرخ «وقعہ نویس» کہلاتا تھا: دیوان ہمایوں کے دفاتر میں اپنے عہد کے واقعات لکھنے والا سرکاری ملازم۔ یہ لقب پہلے طالقی زادہ اور نرگیسی جیسے ادیبوں کے لیے بولا جاتا تھا، پھر مستقل ملازمت بنا جب صدراعظم امجازادہ حسین پاشا نے نعیمہ کو شارح المنار زادہ احمد افندی کی مسودات مرتب کرنے پر مقرر کیا، عطیہ، برات اور روزانہ ١٢٠ اقچہ تنخواہ کے ساتھ؛ راشد محمد افندی ⁦(وفات ١١٤٨ھ)⁩ سے یہ منصب مسلسل ہو گیا۔ وقعہ نویس کو سرکاری دفاتر سے اطلاعات اور علم حبر صورتیں ملتیں، اپنے پیشروں کی کمی بیشی ان کے نوٹوں اور کاغذات سے پوری کرتا، اور ہر سال کی جلد صدارت کے ذریعے سلطان کو پیش کرتا۔"
