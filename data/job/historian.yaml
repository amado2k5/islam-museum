summary:
  ar: "المؤرّخ في الدولة العثمانية هو الوقعة نويس: الموظف الرسمي المكلّف بكتابة وقائع عصره ضمن دواوين الديوان الهمايوني. استُخدم اللقب أولاً لأدباء مثل طالعكي زاده ونركيسي، ثم صار وظيفة دائمة حين عيّن الصدر الأعظم أم جازادة حسين باشا نعيمة لتحرير مسودات شارح المنار زاده أحمد أفندي بأوقاف سنة وبرات وراتب قدره ١٢٠ أقجة يومياً، واستقرّت رسمياً منذ راشد محمد أفندي ⁦(ت ١١٤٨هـ)⁩؛ وكان الوقعة نويس يتلقى الأخبار والإحالات من دواوين الدولة، ويكمل نواقص سابقيه من مسوداتهم ووثائقهم، ويقدّم جزء كل سنة إلى السلطان عبر الصدارة."
  en: "The historian in the Ottoman state was the vak'anüvis: the official charged with writing the events of his age within the offices of the Divan-i Hümayun. The title was first used of literary figures like Talikizade and Nergisi, then became a permanent state service when Grand Vizier Amcazade Hüseyin Pasha appointed Naima to edit Şârihülmenârzâde Ahmed Efendi's draft histories with a grant, a berat and a daily salary of 120 akçe; from Raşid Mehmed Efendi (d. 1148 AH) it settled as a continuous office. The vak'anüvis received reports and ilmühaber minutes from the state's bureaux, completed his predecessors' gaps from their notes and papers, and submitted each year's fascicle to the sultan through the grand vizierate."
  ur: "سلطنت عثمانیہ میں مؤرخ «وقعہ نویس» کہلاتا تھا: دیوان ہمایوں کے دفاتر میں اپنے عہد کے واقعات لکھنے والا سرکاری ملازم۔ یہ لقب پہلے طالقی زادہ اور نرگیسی جیسے ادیبوں کے لیے بولا جاتا تھا، پھر مستقل ملازمت بنا جب صدراعظم امجازادہ حسین پاشا نے نعیمہ کو شارح المنار زادہ احمد افندی کی مسودات مرتب کرنے پر مقرر کیا، عطیہ، برات اور روزانہ ١٢٠ اقچہ تنخواہ کے ساتھ؛ راشد محمد افندی ⁦(وفات ١١٤٨ھ)⁩ سے یہ منصب مسلسل ہو گیا۔ وقعہ نویس کو سرکاری دفاتر سے اطلاعات اور علم حبر صورتیں ملتیں، اپنے پیشروں کی کمی بیشی ان کے نوٹوں اور کاغذات سے پوری کرتا، اور ہر سال کی جلد صدارت کے ذریعے سلطان کو پیش کرتا۔"
  es: "El historiador en el estado otomano era el vak'anüvis: el funcionario encargado de escribir los acontecimientos de su época dentro de las oficinas del Divan-i Hümayun. El título se utilizó por primera vez para figuras literarias como Talikizade y Nergisi, y luego se convirtió en un servicio estatal permanente cuando el Gran Visir Amcazade Hüseyin Pasha nombró a Naima para editar los borradores de las historias de Şârihülmenârzâde Ahmed Efendi con una subvención, un berat y un salario diario de 120 akçe; a partir de Raşid Mehmed Efendi (m. 1148 AH) se estableció como un cargo permanente. El vak'anüvis recibía informes y actas de los ilmühaber de las oficinas estatales, completaba las lagunas de sus predecesores a partir de sus notas y documentos, y presentaba cada fascículo anual al sultán a través del gran visirato."
  fr: "L'historien de l'État ottoman était le vak'anüvis: le fonctionnaire chargé de consigner les événements de son époque au sein du Divan-i Hümayun. Ce titre fut d'abord attribué à des personnalités littéraires comme Talikizade et Nergisi, puis devint un service d'État permanent lorsque le grand vizir Amcazade Hüseyin Pacha nomma Naima pour éditer les ébauches d'histoires de Şârihülmenârzâde Ahmed Efendi, lui octroyant une subvention, un berat et un salaire journalier de 120 akçe. À partir de Raşid Mehmed Efendi (mort en 1148 AH), cette fonction fut pérennisée. Les vak'anüvis recevaient les rapports et les procès-verbaux de l'ilmühaber des bureaux de l'État, complétaient les travaux de leurs prédécesseurs à partir de leurs notes et documents, et soumettaient chaque année un fascicule au sultan par l'intermédiaire du grand vizirat."
  tr: "Osmanlı devletinde tarihçi, Vak'atnı idi: İmparatorluk Konseyi ofislerinde kendi döneminin tarihçelerini yazmakla görevli memur. Bu unvan ilk olarak Talakki Zadeh ve Narkisi gibi yazarlar için kullanılmış, daha sonra Sadrazam'ın Ümmü Cezade Hüseyin Paşa Naimeh'i Zadeh Ahmed Efendi'nin Şeriat el-Manar taslaklarını düzenlemekle görevlendirmesi ve ona bir yıllık vakıf maaşı ve günlük 120 akçe maaş vermesiyle kalıcı bir makam haline gelmiştir. Resmi olarak ise Raşid Muhammed Efendi (ö. 1148 Hicri) döneminden itibaren kurulmuştur; Vak'atnı, devlet dairelerinden haber ve yönlendirmeler alır, seleflerinin eksik taslaklarını ve belgelerini tamamlar ve her yıl bir bölümünü Sadrazamlık aracılığıyla Sultan'a sunardı."
  id: "Sejarawan di negara Utsmaniyah adalah Vak'atnı: pejabat yang bertugas menulis kronik zamannya di dalam kantor Dewan Kekaisaran. Gelar ini pertama kali digunakan untuk penulis seperti Talakki Zadeh dan Narkisi, kemudian menjadi posisi tetap ketika Wazir Agung menunjuk Umm Jazadeh Hussein Pasha Naimeh untuk menyunting draf Sharih al-Manar Zadeh Ahmed Efendi dengan tunjangan satu tahun dan gaji 120 akçe per hari, dan secara resmi ditetapkan sejak masa Rashid Muhammad Efendi (wafat 1148 H); Vak'atnı menerima berita dan rujukan dari kantor-kantor negara, menyelesaikan draf dan dokumen yang hilang dari pendahulunya, dan menyerahkan sebagian setiap tahun kepada Sultan melalui Wazir Agung."
