  certification: "The entry sets no diploma but a demanding kit of sciences: the exegete must command sarf, nahiv and balagha among the language sciences; asbab al-nuzul, nasikh-mansukh and muhkam-mutashabih among the Qur'anic sciences; hadith and history among the transmitted sciences; and logic and usul al-fiqh among the method sciences — and, in the Sunni understanding, must approach the text as God's word with the piety (taqwa) the task presumes."
  duration: "Long formation. The definition the entry gathers requires mastery of language, Qur'anic, transmitted and method sciences together; al-Suyuti reports the scholars' consensus that learning tafsir is fard kifaya."
