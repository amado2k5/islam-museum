summary:
  ar: "المفسّر صاحب صنعة تفسير القرآن: يشرح ألفاظه ومعانيه ويستخرج أحكامه متسلّحاً باللغة وعلوم القرآن والحديث والتاريخ وأصول الفقه. بدأت الصنعة بالنبي الذي فسّر لأصحابه، ثم حملها ابن عباس في مكة وأبي بن كعب في المدينة وابن مسعود في الكوفة إلى تلاميذهم، حتى كتب مقاتل بن سليمان أول تفسير كامل نحو سنة ١٥٠هـ، وتفرّعت الصنعة بعده بين التفسير بالمأثور والتفسير بالدراية، وصار المفسّرون اليوم أهل كراسي التفسير في كليات الشريعة والإلهيات."
  en: "The mufassir holds the craft of Qur'an commentary: explaining its words and meanings and drawing out its rulings armed with the language sciences, the Qur'anic sciences, hadith, history and legal theory. The craft began with the Prophet, who interpreted for his Companions, then passed through Ibn Abbas at Mecca, Ubayy ibn Ka'b at Medina and Ibn Mas'ud at Kufa to their students, until Muqatil ibn Sulayman wrote the first complete commentary about 150 AH; afterwards the craft branched into commentary by transmitted report and by reasoned insight, and today's mufassirs hold the tafsir chairs of the Sharia and theology faculties."
  ur: "مفسر تفسیر قرآن کے پیشے کا حامل ہے: لفظوں اور معانی کی وضاحت اور احکام کا استخراج، اس کے لیے وہ علوم لغت، علوم قرآن، حدیث، تاریخ اور اصول فقہ سے لیس ہوتا ہے۔ اس پیشے کا آغاز نبی سے ہوا جس نے صحابہ کے لیے قرآن کی تفسیر کی، پھر یہ علم ابن عباس کے ذریعے مکہ، اُبی بن کعب کے ذریعے مدینہ اور ابن مسعود کے ذریعے کوفہ سے ان کے شاگردوں تک پہنچا، یہاں تک کہ مقاتل بن سلیمان نے تقریباً ١٥٠ھ میں پہلی مکمل تفسیر لکھی؛ اس کے بعد پیشہ مأثوری اور درایتی تفسیر کی دو شاخوں میں بٹ گیا، اور آج مفسرین شریعت و الہیات کے دانشگاہوں میں تفسیر کی نشستوں پر فائز ہیں۔"
  es: "El mufassir domina el arte de la exégesis coránica: explica sus palabras y significados, y extrae sus preceptos, utilizando las ciencias lingüísticas, las ciencias coránicas, el hadiz, la historia y la teoría jurídica. Este arte se originó con el Profeta, quien interpretó para sus Compañeros, y luego pasó por Ibn Abbas en La Meca, Ubayy ibn Ka'b en Medina e Ibn Mas'ud en Kufa, transmitiéndolo a sus discípulos, hasta que Muqatil ibn Sulayman escribió el primer comentario completo alrededor del año 150 de la Hégira. Posteriormente, el arte se diversificó en la exégesis basada en relatos transmitidos y en la interpretación razonada, y hoy en día los mufassirs ocupan las cátedras de tafsir en las facultades de Sharia y teología."
  fr: "Le mufassir est un exégète du Coran qui explique ses mots et leurs significations, et en dégage les règles, en s'appuyant sur les sciences du langage, les sciences coraniques, le hadith, l'histoire et la théorie juridique. Cet art remonte au Prophète lui-même, qui interprétait pour ses Compagnons. Il se transmit ensuite à Ibn Abbas à La Mecque, à Ubayy ibn Ka'b à Médine et à Ibn Mas'ud à Koufa, puis à leurs élèves, jusqu'à ce que Muqatil ibn Sulayman rédige le premier commentaire complet vers 150 AH. Par la suite, l'exégèse se diversifia en commentaire par tradition orale et par analyse raisonnée. Aujourd'hui, les mufassirs enseignent le tafsir dans les facultés de charia et de théologie."
  tr: "Tefsirci, Kur'an'ı yorumlamada uzmanlaşmış kişidir: dil bilgisi, Kur'an ilimleri, hadis, tarih ve fıkıh ilkeleriyle donanmış olarak, kelimelerini ve anlamlarını açıklar ve hükümlerini çıkarır. Bu meslek, Peygamberimizle başlamış, o da sahabeleri için tefsir yapmış, ardından Mekke'de İbn Abbas, Medine'de Ubeyy ibn Ka'b ve Kufe'de İbn Mes'ud bunu öğrencilerine aktarmış, ta ki Mukatil ibn Süleyman Hicri 150 yılı civarında ilk tam tefsiri yazana kadar. Ondan sonra, bu meslek rivayetlere dayalı tefsir ve akıl yürütmeye dayalı tefsir olmak üzere ikiye ayrılmış ve günümüzde tefsirciler, Şeriat ve İlahiyat fakültelerinde tefsir kürsülerinin sahipleridir."
  id: "Penafsir adalah orang yang ahli dalam menafsirkan Al-Qur'an: ia menjelaskan kata-kata dan maknanya serta mengambil hukum-hukumnya, berbekal pengetahuan tentang bahasa, ilmu-ilmu Al-Qur'an, Hadits, sejarah, dan prinsip-prinsip fiqih. Keahlian ini dimulai oleh Nabi Muhammad SAW, yang menafsirkan Al-Qur'an untuk para sahabatnya, kemudian Ibnu Abbas di Mekah, Ubayi bin Ka'b di Madinah, dan Ibnu Mas'ud di Kufa meneruskannya kepada murid-murid mereka, hingga Muqatil bin Sulaiman menulis tafsir lengkap pertama sekitar tahun 150 H. Setelah beliau, keahlian ini bercabang antara penafsiran berdasarkan riwayat yang ditransmisikan dan penafsiran berdasarkan penalaran, dan saat ini para penafsir memegang jabatan profesor penafsiran di fakultas Syariah dan Teologi."
