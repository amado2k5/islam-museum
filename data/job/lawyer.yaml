places:
  - { place: place/medina, note: "Agency answered social needs in every society, the entry says, and the fiqh books made it a defined contract from the earliest schools; the hadith of Unays is cited by the Hanbalis as allowing agency even to prove hadd offences like drinking.", sources: [source/tdv-vekalet] }
  - { place: place/baghdad, note: "The four schools' definitions are recorded from their classics — the Hanafis taking the Samarkandi line 'entrusting the authority of legal transaction and its protection to the agent', the Shafi'is 'delegating to another a delegable act within one's competence', the Hanbalis and Malikis their own — making Baghdad's and the schools' fiqh the charter of the profession.", sources: [source/tdv-vekalet] }
  - { place: place/istanbul, note: "Ottoman codification kept the old rules: the Mecelle (art. 1467) held the agent entitled to a fee when it was stipulated at the contract or when he customarily worked for a fee.", sources: [source/tdv-vekalet] }
