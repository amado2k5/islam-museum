summary:
  ar: "الوكيل من فوّض إليه صاحب عملٍ القيام به نيابة عنه — شراءً وبيعاً وخصومة وزواجاً — بعقد الوكالة الذي رتّبه الفقهاء: إيجاب من الموكّل وقبول صريح أو ضمني، وأهلية في الطرفين، وموضوع داخل في اختصاص الموكّل معلوم مقدار ما تقتضيه الغاية. ومن الوكالة وكالة الدعوى التي يمثل فيها الوكيل موكّله أمام القاضي؛ لزمت الوكالة تدبير مصلحة الموكّل بأمانة، واستحق الأجرة عند اشتراطها أو جريان العرف بها، وانتهت بالعزل أو الاستقالة أو الموت أو فقد الأهلية."
  en: "The wakīl is the person his principal commissions to act for him — buying and selling, litigating, marrying — under the contract of agency (wakāla) as the jurists built it: offer by the principal, express or implied acceptance, capacity in both parties, and a mandate within the principal's own authority and known enough for its purpose. One form is litigation agency, in which the agent represents his principal before the kadi; the contract bound the agent to his principal's interest, earned him a fee when stipulated or customary, and ended with dismissal, resignation, death or loss of capacity."
  ur: "وکیل وہ شخص ہے جسے اس کا موکل کسی کام — خرید و فروخت، مقدمہ بازی، نکاح — کے لیے اپنی طرف سے مقرر کرے، عقدِ وکالت کے تحت جسے فقہاء نے ترتیب دیا: موکل کی طرف سے ایجاب، صریح یا ضمنی قبول، دونوں فریقوں کی اہلیت، اور موکل کے اپنے اختیار میں کوئی معلوم کام۔ اس کی ایک قسم دعویٰ کی وکالت ہے جس میں وکیل قاضی کے سامنے موکل کی نمائندگی کرتا ہے؛ عقد وکیل کو موکل کے مفاد کے حسن تدبیر کا پابند کرتا، شرط یا عرف پر اجر مستحق ٹھہراتا، اور عزل، استعفیٰ، موت یا اہلیت کے زوال سے ختم ہوتا۔"
  es: "El wakīl es la persona a quien su mandante encomienda la tarea de actuar en su nombre —comprar y vender, litigar, contraer matrimonio— en virtud del contrato de agencia (wakāla) tal como lo concibieron los juristas: oferta del mandante, aceptación expresa o tácita, capacidad jurídica de ambas partes y un mandato que se encuentra dentro de la autoridad del mandante y que es suficientemente conocido para su propósito. Una forma es la agencia litigante, en la que el agente representa a su mandante ante el kadi; el contrato vincula al agente a los intereses de su mandante, le otorga una comisión cuando así lo estipulaba o era costumbre, y finaliza con el despido, la renuncia, el fallecimiento o la pérdida de capacidad jurídica."
