training:
  mode: apprenticeship
  certification: "No licence is recorded in the entry — capacity, not a diploma, makes the agent: he must be capable of the transaction himself, and his authority comes from the principal's own. The profession's rules are the fiqh of the contract, learned within the schools."
  duration: "Per mandate: the wakāla is non-binding on either side, so a principal may dismiss at will and the agent may resign — save where a third party's right has attached — and it ends of itself at death, at loss of capacity, or when performance becomes impossible."
