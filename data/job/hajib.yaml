summary:
  ar: "الحاجب هو المسؤول في البلاط الذي يتحكم في الوصول إلى الحاكم: يقدّم إليه الموظفين والوفود والملتمسين، ويرتّب المراسم، وفي كثير من الدول صار من أقوى رجال الحكم، وقد اشتقّ اسمه من الفعل «حجب» أي منع ورَدّ. ويختلف موقعه من دولة إلى أخرى، فهو دون الوزير في الدولة العباسية، وأقوى من الوزير في الأندلس الأموية، وقائد كبير في الدولة السامانية والغزنوية، ثم صار في دولة المماليك رئيساً للمراسم وقضاء بعض الدعاوى، إلى أن أُلغي سنة 860هـ."
  en: "The hajib was the court official who controlled access to the ruler. He brought officials, delegations and petitioners before him and arranged the ceremonies. In many states he became one of the most powerful men in government. The name comes from the verb hajaba, to screen or block. His rank varied: below the vizier under the Abbasids, stronger than the vizier in Umayyad Spain, a senior commander under the Samanids and Ghaznavids, and in the Mamluk state the head of ceremony who also heard some cases, until the office was abolished in 860 AH."
  ur: "حاجب دربار کا وہ اہلکار تھا جو حاکم تک رسائی پر نگاہ رکھتا تھا۔ وہ عہدیداروں، وفود اور درخواست گزاروں کو حاکم کے سامنے لاتا اور تقریبات کا انتظام کرتا تھا۔ کئی ریاستوں میں یہ حکومت کے سب سے طاقتور لوگوں میں شامل ہو گیا۔ اس کا نام فعل «حجب» سے ہے، یعنی روکنا یا آڑ کرنا۔ عباسی دور میں اس کا مرتبہ وزیر سے کم تھا، اندلس کے اموی دور میں وزیر سے زیادہ بااختیار تھا، اور مملوک ریاست میں تقریبات کا سربراہ بن گیا جو کچھ مقدمات بھی سنتا تھا، یہاں تک کہ 860ھ میں یہ منصب ختم کر دیا گیا۔"
  es: "El hajib era el funcionario de la corte que controlaba el acceso al gobernante. Recibía ante él a funcionarios, delegaciones y peticionarios, y organizaba las ceremonias. En muchos estados, llegó a ser uno de los hombres más poderosos del gobierno. Su nombre proviene del verbo hajaba, que significa proteger o bloquear. Su rango variaba: por debajo del visir bajo los abasíes, con mayor rango que el visir en la España omeya, comandante de alto rango bajo los samaníes y los gaznávidas, y en el estado mameluco, jefe de ceremonias que también presidía algunos casos, hasta que el cargo fue abolido en el año 860 de la Hégira."
  fr: "Le hajib était le fonctionnaire de la cour qui contrôlait l'accès au souverain. Il recevait les officiels, les délégations et les pétitionnaires et organisait les cérémonies. Dans de nombreux États, il devint l'un des hommes les plus puissants du gouvernement. Son nom provient du verbe « hajaba », qui signifie « filtrer » ou « bloquer ». Son rang variait: inférieur au vizir sous les Abbassides, supérieur au vizir en Espagne omeyyade, commandant de haut rang sous les Samanides et les Ghaznévides, et, dans l'État mamelouk, chef des cérémonies qui instruisait également certaines affaires, jusqu'à l'abolition de cette fonction en 860 AH."
  tr: "Saray nazırı, hükümdara erişimi kontrol eden saray görevlisiydi: yetkilileri, heyetleri ve dilekçe sahiplerini ona sunar ve törenleri düzenlerdi. Birçok devlette, hükümetteki en güçlü figürlerden biri haline geldi. Adı, \"önlemek\" veya \"geri püskürtmek\" anlamına gelen \"hajaba\" fiilinden türemiştir. Konumu devletten devlete değişiyordu; Abbasi Halifeliği'nde vezirin altında, Emevi Endülüs'ünde vezirden daha güçlü ve Samanî ve Gaznevi devletlerinde yüksek rütbeli bir görevliydi. Daha sonra, Memlük Sultanlığı'nda törenlerin başı oldu ve bazı davalara baktı, ta ki bu görev 860 Hicri yılında kaldırılana kadar."
  id: "Chamberlain adalah pejabat di istana yang mengendalikan akses ke penguasa: ia memperkenalkan pejabat, delegasi, dan pemohon kepada penguasa, serta mengatur upacara-upacara. Di banyak negara bagian, ia menjadi salah satu tokoh paling berpengaruh dalam pemerintahan. Namanya berasal dari kata kerja \"hajaba,\" yang berarti mencegah atau menolak. Posisinya bervariasi dari satu negara bagian ke negara bagian lain; ia berada di bawah wazir di Kekhalifahan Abbasiyah, lebih berkuasa daripada wazir di Andalusia Umayyah, dan seorang pejabat tinggi di negara-negara Samanid dan Ghaznavid. Kemudian, di Kesultanan Mamluk, ia menjadi kepala upacara dan mengadili beberapa kasus, hingga posisi tersebut dihapuskan pada tahun 860 H."
