  certification: "No licence was granted. Under the Samanids, Ghaznavids and Seljuks the hajib was chosen from palace slave soldiers (ghulam) who rose through set ranks; Nizam al-Mulk describes a ladder of eight years and several ranks before the post. Under the Karakhanids and Khwarazmshahs the hajib was a trusted man chosen by the ruler."
