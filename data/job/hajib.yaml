places:
  - place: place/baghdad
    note: "Under the Abbasids the hajib and the vizier were the two leading figures at court. Under al-Muqtadir the palace had 700 hajibs, and the chief-of-hajibs post was created in 940, according to the entry."
    sources: [source/tdv-hacib]
  - place: place/cordoba
    note: "Under the Andalusian Umayyads the hajib was the chief of civil government and was sometimes called the nearest vizier. Ibn Abi Amir took the office for his own heir and in 981 took the title al-Mansur."
    sources: [source/tdv-hacib]
  - place: place/cairo
    note: "In the Mamluk state the chief hajib (hajib al-hujjab) brought envoys before the sultan, supervised military matters, and from al-Kamil Shaban heard some civil cases. The office was abolished in 860 AH (1456) under al-Ashraf Inal."
    sources: [source/tdv-hacib]
