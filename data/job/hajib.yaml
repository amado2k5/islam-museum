label: { ar: "الحاجب", en: "Chamberlain (hajib)", ur: "حاجب ⁦(درباری)⁩" }
summary:
  ar: "الحاجب هو المسؤول في البلاط الذي يتحكم في الوصول إلى الحاكم: يقدّم إليه الموظفين والوفود والملتمسين، ويرتّب المراسم، وفي كثير من الدول صار من أقوى رجال الحكم، وقد اشتقّ اسمه من الفعل «حجب» أي منع ورَدّ. ويختلف موقعه من دولة إلى أخرى، فهو دون الوزير في الدولة العباسية، وأقوى من الوزير في الأندلس الأموية، وقائد كبير في الدولة السامانية والغزنوية، ثم صار في دولة المماليك رئيساً للمراسم وقضاء بعض الدعاوى، إلى أن أُلغي سنة 860هـ."
  en: "The hajib was the court official who controlled access to the ruler. He brought officials, delegations and petitioners before him and arranged the ceremonies. In many states he became one of the most powerful men in government. The name comes from the verb hajaba, to screen or block. His rank varied: below the vizier under the Abbasids, stronger than the vizier in Umayyad Spain, a senior commander under the Samanids and Ghaznavids, and in the Mamluk state the head of ceremony who also heard some cases, until the office was abolished in 860 AH."
  ur: "حاجب دربار کا وہ اہلکار تھا جو حاکم تک رسائی پر نگاہ رکھتا تھا۔ وہ عہدیداروں، وفود اور درخواست گزاروں کو حاکم کے سامنے لاتا اور تقریبات کا انتظام کرتا تھا۔ کئی ریاستوں میں یہ حکومت کے سب سے طاقتور لوگوں میں شامل ہو گیا۔ اس کا نام فعل «حجب» سے ہے، یعنی روکنا یا آڑ کرنا۔ عباسی دور میں اس کا مرتبہ وزیر سے کم تھا، اندلس کے اموی دور میں وزیر سے زیادہ بااختیار تھا، اور مملوک ریاست میں تقریبات کا سربراہ بن گیا جو کچھ مقدمات بھی سنتا تھا، یہاں تک کہ 860ھ میں یہ منصب ختم کر دیا گیا۔"
