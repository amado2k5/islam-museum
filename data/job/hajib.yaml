    status: debated
    note: "The entry does not fix the origin. It reports that the Prophet kept a doorkeeper in some years, one named Abu Anasa in one source, and it records the debate over whether Muawiya (661–680) or Abd al-Malik (685–705) first set up the office. The range runs from the Prophet's years to the Umayyad caliphate, and the reports within it are the authors' own."
