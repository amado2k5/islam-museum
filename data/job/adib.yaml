summary:
  ar: "الأديب من جذر الأدب الذي يجمع معنيين: صاحب الخُلق الحسن وصاحب الأدبيات، فالأديب هو المؤدّب والكاتب الأدبي معاً. وكانت كلمة «أدب» قبل التنظيمات تدل على ما صار يُسمّى بعدها «أدبيات»، غير أن أدب الديوان كان نظماً في جملته ففضّلت عليه كلمة شعر. وصنعت الأديبَ صناعةُ الكلام: فنّ لا يحتاج مادة ولا آلة ولا مكاناً، مادته اللغة التي أصبحت من أرقى أدوات البشر، ويدخل في دائرة الأدب اليوم الشفهي والمكتوب، ومن علومه تاريخ الأدب وتراجم الأدباء ونقد النصوص وفلسفته ونفسه واجتماعه."
  en: "The adib takes his name from adab, a root that carries two senses at once: the person of fine conduct and the person of literature — the edîb is both the well-mannered and the literary man. Before the Tanzimat the word edeb covered what is now called edebiyat; yet because the divan literature was almost wholly verse, the word şiir was preferred for it. The literary man's craft is the art of the word: an art needing no material, tool or place, whose substance is language itself, the most developed instrument humanity has. The literary field today includes the oral and the written, and around it stand the literary sciences: literary history, biographies of the men of letters, textual criticism, and the philosophy, psychology and sociology of literature."
  ur: "ادیب کا نام ادب کی جڑ سے ہے جس میں دو معنی جمع ہیں: خوش اخلاق شخص اور ادب کا حامل — ادیب باؤدب بھی ہے اور صاحب قلم بھی۔ تنظیمات سے پہلے لفظ ادب اسی معنی میں آتا تھا جو اب ادبیات کہلائی؛ مگر دیوانی ادب تقریباً تمام نظم تھا اس لیے شعر کا لفظ ترجیح پایا۔ ادیب کی صنعت کلام کا فن ہے: ایسا فن جسے نہ مادہ چاہیے نہ آلہ نہ مکان، جس کا مادہ خود زبان ہے جو انسان کے سب سے مہذب اوزاروں میں ہے۔ ادبی دائرہ آج شفاہی اور تحریری دونوں کو شامل ہے اور اس کے گرد علوم ادب ہیں: تاریخ ادب، تراجم ادباء، تنقید متون اور ادب کی فلسفہ، نفسیات و سماجیات۔"
  es: "El adib toma su nombre de adab, una raíz que conlleva dos sentidos a la vez: la persona de buena conducta y la persona de literatura; el edîb es a la vez el hombre educado y el hombre de letras. Antes del Tanzimat, la palabra edeb abarcaba lo que hoy se llama edebiyat; sin embargo, dado que la literatura del diván era casi enteramente en verso, se prefería la palabra şiir para referirse a ella. El oficio del hombre de letras es el arte de la palabra: un arte que no necesita material, herramienta ni lugar, cuya sustancia es el lenguaje mismo, el instrumento más desarrollado de la humanidad. El campo literario actual incluye lo oral y lo escrito, y a su alrededor se encuentran las ciencias literarias: la historia de la literatura, las biografías de los hombres de letras, la crítica textual y la filosofía, la psicología y la sociología de la literatura."
  fr: "L'adib tire son nom d'adab, une racine à double sens: l'homme de bonne conduite et l'homme de lettres – l'edîb est à la fois l'homme courtois et l'homme de lettres. Avant les Tanzimat, le mot edeb désignait ce que l'on appelle aujourd'hui edebiyat; cependant, comme la littérature du divan était presque exclusivement en vers, on lui préférait le mot şiir. Le métier de l'homme de lettres est l'art du mot: un art qui ne requiert ni matériel, ni outil, ni lieu, et dont la substance est le langage lui-même, l'instrument le plus abouti de l'humanité. Le champ littéraire englobe aujourd'hui l'oral et l'écrit, et s'articulent autour de lui les sciences littéraires: histoire littéraire, biographies des hommes de lettres, critique textuelle, philosophie, psychologie et sociologie de la littérature."
