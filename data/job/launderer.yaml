    ar: "يفرض ابن الأخوة على القصّار قواعد الوديعة: لا يأخذ من الثياب المودعة ولا يلبسها ولا يأذن لعماله بلبسها ولا يرهنها، ويُكتب اسم المالك على كل ثوب، ثم يبحث في ضمانه إن هلك الثوب بعد غسله في يده أو أتلفه أجنبي أو مالكه أو أجيره. ويحدّث إوليا عن غسّالي كاغذخانة أنهم يغسلون القمصان والغسيل بغير صابون فتشتدّ بياضاً بعد غسلتين، وأن تجّار الهند يأتون بأطواقهم ⁦(أحمالهم)⁩ ليغمسوها في النهر مرة؛ ومزيلو البقع في ساحة بايزيد يملكون صنعة إخراج البقع من الثياب النفيسة بلا إضرار بلونها."
    en: "Ibn al-Ukhuwwa binds the fuller to the rules of the deposit: no taking from the stuffs entrusted to him, no wearing them, no letting his workmen wear them, no pledging them, and the owner's name written on every article; he then opens the questions of liability when a washed garment is destroyed in the fuller's keeping, whether the damage came from a third party, from the owner himself or from an employee. Evliya reports that the Kaghid-khanah washermen washed shirts and linen without soap yet they grew extremely white after two washings, Indian merchants bringing their bales to dip them once in the flood; and the stain-cleaners of Bayazid square possessed the art of taking stains out of precious cloth without hurting the colour."
