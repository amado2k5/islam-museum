summary:
  ar: "القصّار هو من يغسل الثياب ويدقّها وينظّفها، وبيده تخرج الملابس بيضاء من النهر أو من حوض الدقّ. يضع ابن الأخوة حدود الأمانة للقصّار: لا يسرق من الأثواب المودعة ولا يلبسها ولا يرهنها، ويكتب اسم صاحبها على كل قطعة، ويحرّر أحكام ضمان ما هلك في يده. وفي إسطنبول إوليا للغسّالين طائفة خمسمئة رجل بثلاثمئة دكان يغسلون الغسيل على عربات في الموكب، وبجانبهم مزيلو البقع ⁦(لكجيان)⁩ عشرون رجلاً بعشر دكاكين في ساحة بايزيد يزيلون البقعة من الثوب النفيس دون أن يضرّوا لونه، وعلى نهر كاغذخانة يغسل الغسّالون القمصان والغسيل بغير صابون فيخرج شديد البياض بعد غسلتين."
  en: "The qassar washed, beat and finished cloth and clothing, returning linen white from the river or the fulling trough. Ibn al-Ukhuwwa sets the boundaries of his trust: the fuller must not steal from the stuffs entrusted to him, nor wear them nor let his workmen wear them, nor pledge them, and the owner's name is to be written on every article; the manual then works through the compensation rules when a garment is damaged in his hands or by a third party. In Evliya's Istanbul the washermen were a guild of five hundred men in three hundred shops who washed linen on wagons as they marched, beside the stain-cleaners (Lekejian), twenty men in ten shops on Bayazid square, who could lift a stain from precious cloth without hurting its colour; and on the Kaghid-khanah river washermen washed shirts and linen without soap, yet they came out extremely white after two washings."
  ur: "قصّار کپڑے دھوتا، کُٹتا اور صاف کرتا تھا اور دھلی ہوئی چیزیں ندی یا کُندے سے دھل وائل لاتا۔ ابن الاخوہ امانت کی حدیں بتاتا ہے: دھوبی امانت میں رکھی چیزوں سے چوری نہ کرے، نہ پہنے، نہ اپنے کامکاروں کو پہننے دے اور نہ گروی رکھے، اور ہر کپڑے پر مالک کا نام لکھا جائے؛ پھر کتاب ان اصولوں کو کھولتی ہے کہ اس کے ہاتھ میں کپڑا برباد ہو تو تلافی کیسے ہو۔ اولیاء کے استنبول میں دھوبیوں کی انجمن پانچ سو آدمی اور تین سو دکانیں تھی جو جلوس میں گاڑیوں پر بیٹھ کر کپڑے دھوتی، اور داغ اتارنے والے ⁦(لکجیان)⁩ بیس آدمی دس دکانیں بایزید چوک میں قیمتی کپڑے سے داغ اتارتے بغیر رنگ بگاڑے؛ اور کاغذخانہ کے نالے پر دھوبی بغیر صابن قمیضیں دھوتے مگر دو دھلائی میں انتہائی سفید ہو جاتیں۔"
  es: "El qassar lavaba, batía y daba el acabado a la tela y la ropa, devolviendo el lino blanco del río o del batán. Ibn al-Ukhuwwa establece los límites de su confianza: el batán no debe robar de las telas que se le confían, ni usarlas ni permitir que sus trabajadores las usen, ni empeñarlas, y el nombre del propietario debe estar escrito en cada artículo; el manual luego detalla las reglas de compensación cuando una prenda se daña en sus manos o por un tercero. En el Estambul de Evliya, los lavanderos eran un gremio de quinientos hombres en trescientos talleres que lavaban el lino en carros mientras marchaban, junto con los quitamanchas (Lekejian), veinte hombres en diez talleres en la plaza Bayazid, que podían quitar una mancha de tela preciosa sin dañar su color; y en el río Kaghid-khanah, los lavanderos lavaban camisas y lino sin jabón, y aun así salían extremadamente blancos después de dos lavados."
