  mode: state-licence
  certification: "The kemankeş's licence was the ahz-ı kabza, 'taking the grip': hitting the marks and casting the pişrev arrow past 900 gez and the azmayiş past 800; the licensed archer entered the archers' register and was called tâlib-i menzil or müstahıkk-ı menzil. Breaking a menzil record and raising a stone pillar were governed by their own rules."
  duration: "The tâlimhâne drilled the solaks and kemankeşler of the kapıkulu; the tâlimhâneci instructor's duty to train them was written into the kanun."
