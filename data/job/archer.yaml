summary:
  ar: "الرامي صاحب القوس والسهم، وكان عند المسلمين أكثر من حرفة: ربط النبي القوة بالرمي ودعا إلى تعليم النشء إياه فاكتسب التصويب مكانة دينية، وعدّ ابن القيم الرماية فرعاً من فروع الفروسية الأربعة. وعند العثمانيين صار الكمانكش نظاماً مضبوطاً: لا يقبل أحد في سجل الرماة حتى يحقق «أخذ القبضة» ⁦(أخذ-ي قبضة)⁩ بإصابة الأهداف ورمي سهم البيشرو تسعمئة غز ⁦(gez)⁩ وسهم العزمايش ثمانمئة، وسجّل أوق ميداني أرقام المنزل بأعمدة، وكان الرماة يقرؤون الفاتحة والإخلاص ويذكرون سعد بن أبي وقاص بير الكمانكش قبل كل مباراة أو امتحان."
  en: "The archer — the Ottoman kemankeş, tîrendâz or solak — held a calling with a religious warrant: the Prophet glossed the command to prepare strength with 'shooting', called archery a father's duty to his child, and told Sa'd ibn Abi Waqqas 'shoot, Sa'd'. Ibn Qayyim counted archery one of the four branches of furusiyya. Under the Ottomans it became a regulated discipline: no one entered the archers' register until he had 'taken the grip' (ahz-ı kabza) — hitting the targets and casting the pişrev arrow past 900 gez and the azmayiş past 800 — after which he was named a 'candidate for the record' (tâlib-i menzil). The Okmeydanı ground kept the record pillars, Evliya saw the bowmen's convent there whose patron was Sa'd ibn Abi Waqqas, and the archers' prayer over each contest joined the Companions, the three masters of the shooting manuals and the kavsnâme authors."
  ur: "تیر انداز — عثمانی کمانکش، تیر انداز یا سولاق — ایک ایسا پیشہ تھا جسے دینی سند حاصل تھی: نبی نے «قوت» کی آیت کو رمی یعنی تیر اندازی سے بیان کیا، اسے والد کا حق قرار دیا اور سعد بن ابی وقاص سے «مارو سعد!» فرمایا۔ ابن قیم نے فروسیت کی چار شاخوں میں تیر اندازی شمار کی۔ عثمانیوں نے اسے منضبط نظام بنایا: رماوں کے رجسٹر میں داخلہ «اخذ قبضہ» پر موقوف تھا — ہدف مارنا اور پیشرو کا تیر 900 گیز اور عزمائش کا 800 گیز سے آگے پھینکنا — جس کے بعد وہ «منزل کا طالب» کہلاتا۔ اوق میدانی میں ریکارڈ کے ستون رکھتے تھے، اولیا نے وہاں تیر اندازوں کی ٹکیہ دیکھی جس کے پیر سعد بن ابی وقاص تھے، اور ہر مقابلے سے پہلے صحابہ، فنِ تیر اندازی کے تین استادوں اور قوسنامہ مصنفین کو دعاؤں میں یاد کیا جاتا۔"
