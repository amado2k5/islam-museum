summary:
  ar: "الخليفة رأس الدولة الإسلامية ومن يخلف النبي في تدبير شؤون الأمة؛ قام المنصب حين بايعت الصحابة أبا بكر في سقيفة بني ساعدة، وجُرّب فيه الاختيار والبيعة والشورى ثم استقر سلطنةً وراثية عند الأمويين والعباسيين والعثمانيين، حتى أُلغيت الخلافة في أنقرة سنة ١٩٢٤."
  en: "The caliph was the head of the Islamic polity, succeeding the Prophet in managing the community's affairs; the office began with the pledge to Abu Bakr at the Saqifa of Banu Sa'ida, moved through election, public bay'a and consultative succession, then settled as hereditary monarchy under the Umayyads, Abbasids and Ottomans, until the caliphate was abolished at Ankara in 1924."
  ur: "خلیفہ اسلامی ریاست کا سربراہ تھا جو نبی کے بعد امت کے معاملات چلاتا؛ منصب اس وقت قائم ہوا جب صحابہ نے سقیفہ بنی ساعدہ میں ابوبکر کی بیعت کی، پہلے انتخاب، بیعت اور شورٰی کے طریقے آزمائے گئے پھر اموی، عباسی اور عثمانی دور میں وراثی سلطنت بن گئی، بالآخر ۱۹۲۴ میں انقرہ میں خلافت منسوخ کر دی گئی۔"
