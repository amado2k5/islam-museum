summary:
  ar: "الصبّاغ هو من يصبغ الغزل والقماش للناس. يذكر الشيزري من غشّهم صبغ الحرير الأحمر بالحناء بدل الفوّة فيبدو الصبغ جيداً لامعاً فإذا عُرّض للشمس تغيّر وذهب بريقه، واسوداد الثياب بثمرات البلوط والزاج ليخرج أسود كحلياً ثم يزول سريعاً، ويأمرهم أن يكتبوا أسماء الناس على ثيابهم بالحبر لئلا تلتبس، وألا يبدّلوا ثياب الناس في الأعياد ويكروها لمن شاء. وفي قاهرة لين الصبّاغ من حرف السوق، وفي إسطنبول إوليا جلبي ثمانمئة رجل في خمسمئة دكان، ومعهم الضاربون الذين يدقّون القماش بالمطارق."
  en: "The sabbagh dyed thread and cloth for customers. Al-Shayzari records their frauds: dyeing red silk with henna instead of madder so that the colour looks bright but fades in the sun, and darkening cloth with oak apples and vitriol to a jet-black that wears off quickly. He orders them to write the owners' names on the clothes in ink, and forbids the practice of swapping customers' garments at festival time and renting them out. In Lane's Cairo the sabbagh stood among the market trades, and in Evliya's Istanbul the dyers numbered eight hundred men in five hundred shops, with seven hundred mallet-beaters who dressed the dyed linen."
  ur: "رنگریز لوگوں کے لیے سوتر اور کپڑا رنگتا تھا۔ الشیزری ان کے دھوکھے گنواتا ہے: سرخ ریشم کو مجیٹھ کے بجائے مہندی سے رنگنا جس سے رنگ روشن تو لگتا ہے مگر دھوپ میں پھیکا پڑ جاتا ہے، اور کپڑے کو بلوط کے گچھے اور زاگ سے سیاہ کرنا جو جلد اتر جاتا ہے۔ حکم ہے کہ وہ لوگوں کے نام سیاہی سے ان کے کپڑوں پر لکھیں، اور عیدوں میں لوگوں کے جوڑے بدل کر کرایے پر دینے سے باز رہیں۔ لین کے قاہرہ میں صباغ بازار کے پیشوں میں تھا، اور اولیاء چلبی کے استنبول میں رنگریز پانچ سو دکانوں پر آٹھ سو آدمی تھے اور ساتھ سات سو چوگان مارنے والے جو رنگا کپڑا دھوتے تھے۔"
  es: "El sabbagh teñía hilo y tela para sus clientes. Al-Shayzari documenta sus fraudes: teñir seda roja con henna en lugar de rubia, de modo que el color se ve brillante pero se desvanece con el sol, y oscurecer la tela con manzanas de roble y vitriolo hasta obtener un negro intenso que se desgasta rápidamente. Les ordena escribir los nombres de los dueños en las prendas con tinta y prohíbe la práctica de intercambiar las prendas de los clientes durante las festividades y alquilarlas. En el Cairo de Lane, el sabbagh se ubicaba entre los comercios del mercado, y en el Estambul de Evliya, los tintoreros sumaban ochocientos hombres en quinientos talleres, con setecientos batidores que preparaban el lino teñido."
  fr: "Le sabbagh teignait le fil et les tissus pour ses clients. Al-Shayzari relate leurs fraudes: teindre la soie rouge avec du henné au lieu de la garance, ce qui donnait une couleur vive mais éphémère au soleil; et noircir les tissus avec des pommes de chêne et du vitriol jusqu’à obtenir un noir de jais qui s’estompait rapidement. Il leur ordonne d’inscrire le nom des propriétaires à l’encre sur les vêtements et interdit la pratique consistant à échanger les vêtements des clients lors des fêtes et à les louer. Au Caire de Lane, le sabbagh se trouvait parmi les commerces du marché, et à Istanbul, sous Evliya, les teinturiers étaient au nombre de huit cents, répartis dans cinq cents boutiques, avec sept cents marteleurs qui apprêtaient le lin teint."
  tr: "Boyacı, insanlar için iplik ve kumaş boyayan kişidir. Şeyzari, kırmızı ipeği kök boyası yerine kına ile boyayarak onları aldatanlardan bahseder; bu şekilde boya güzel ve parlak görünür, ancak güneşe maruz kaldığında değişir ve parlaklığını kaybederdi. Ayrıca, koyu siyah bir renk elde etmek için meşe palamudu ve sülfürik asit ile kumaşları karartmaktan da bahseder; bu renk hızla solar. Karışıklığı önlemek için insanların isimlerini kumaşların üzerine mürekkeple yazmalarını ve bayramlarda insanların kıyafetlerini değiştirmemelerini, istedikleri kişiye kiralamalarını öğütler. Kahire'de boyacılık bir pazar ticaretiydi ve İstanbul'da Evliya Çelebi'nin beş yüz dükkânında sekiz yüz adamı ve kumaşı çekiçlerle döven işçileri vardı."
  id: "Tukang pewarna adalah orang yang mewarnai benang dan kain untuk orang lain. Al-Shayzari menyebutkan orang-orang yang menipu mereka dengan mewarnai sutra merah dengan henna alih-alih akar madder, sehingga pewarna tampak bagus dan berkilau, tetapi ketika terkena sinar matahari, warnanya berubah dan kehilangan kilaunya. Ia juga menyebutkan menghitamkan pakaian dengan biji ek dan vitriol untuk menghasilkan warna hitam pekat yang cepat pudar. Ia menginstruksikan mereka untuk menulis nama orang di pakaian mereka dengan tinta untuk menghindari kebingungan, dan untuk tidak menukar pakaian orang selama hari libur, tetapi menyewakannya kepada siapa pun yang mereka inginkan. Di Kairo, tukang pewarna adalah pedagang pasar, dan di Istanbul, Evliya Çelebi memiliki delapan ratus orang di lima ratus toko, bersama dengan para pemukul yang memukul kain dengan palu."
