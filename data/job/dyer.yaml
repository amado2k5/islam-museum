  techniques:
    ar: "يبيّن الشيزري علامات الصبغ المغشوش: حرير أحمر مصبوغ بالحناء لا الفوّة يبدو نيراً ثم يبهت في الشمس، وقماش مسوَّد بالعفص والزاج يخرج كحلياً ثم يزول الصبغ بعد يسير. ويأمر الصبّاغين أن يكتبوا أسماء الناس على ثيابهم بالحبر لئلا تلتبس، وأن يعرضوا الصبغ على عارفهم، وينهاهم عن تبديل ثياب الناس في المواسم والأعياد وإكارها لمن يتزيّن بها."
    en: "Al-Shayzari gives the signs of fraudulent dyeing: red silk dyed with henna rather than madder looks bright but changes and fades in the sun, and cloth darkened with oak apples and vitriol comes out an even jet-black that soon wears off. The dyers must write the customers' names on their clothes in ink so that none are confused, must show their dyes to their 'arif, and must not alter people's clothes at festivals and rent them out to revellers."
    ur: "الشیزری جعلی رنگ کی علامتیں بتاتا ہے: سرخ ریشم جو مجیٹھ کے بجائے مہندی سے رنگا گیا ہو روشن لگتا ہے مگر دھوپ میں بدل کر پھیکا ہو جاتا ہے، اور بلوط کے گچھے اور زاگ سے سیاہ کیا کپڑا یکساں کاہی سیاہ نکلتا ہے مگر جلد اتر جاتا ہے۔ رنگریز گاہکوں کے نام ان کے کپڑوں پر سیاہی سے لکھیں کہ خلط نہ ہوں، اپنے رنگ اپنے عارف کو دکھائیں، اور عیدوں کے موسم میں لوگوں کے جوڑے بدل کر سجنے والوں کو کرایے پر نہ دیں۔"
