summary:
  ar: "الصبّاغ هو من يصبغ الغزل والقماش للناس. يذكر الشيزري من غشّهم صبغ الحرير الأحمر بالحناء بدل الفوّة فيبدو الصبغ جيداً لامعاً فإذا عُرّض للشمس تغيّر وذهب بريقه، واسوداد الثياب بثمرات البلوط والزاج ليخرج أسود كحلياً ثم يزول سريعاً، ويأمرهم أن يكتبوا أسماء الناس على ثيابهم بالحبر لئلا تلتبس، وألا يبدّلوا ثياب الناس في الأعياد ويكروها لمن شاء. وفي قاهرة لين الصبّاغ من حرف السوق، وفي إسطنبول إوليا جلبي ثمانمئة رجل في خمسمئة دكان، ومعهم الضاربون الذين يدقّون القماش بالمطارق."
  en: "The sabbagh dyed thread and cloth for customers. Al-Shayzari records their frauds: dyeing red silk with henna instead of madder so that the colour looks bright but fades in the sun, and darkening cloth with oak apples and vitriol to a jet-black that wears off quickly. He orders them to write the owners' names on the clothes in ink, and forbids the practice of swapping customers' garments at festival time and renting them out. In Lane's Cairo the sabbagh stood among the market trades, and in Evliya's Istanbul the dyers numbered eight hundred men in five hundred shops, with seven hundred mallet-beaters who dressed the dyed linen."
  ur: "رنگریز لوگوں کے لیے سوتر اور کپڑا رنگتا تھا۔ الشیزری ان کے دھوکھے گنواتا ہے: سرخ ریشم کو مجیٹھ کے بجائے مہندی سے رنگنا جس سے رنگ روشن تو لگتا ہے مگر دھوپ میں پھیکا پڑ جاتا ہے، اور کپڑے کو بلوط کے گچھے اور زاگ سے سیاہ کرنا جو جلد اتر جاتا ہے۔ حکم ہے کہ وہ لوگوں کے نام سیاہی سے ان کے کپڑوں پر لکھیں، اور عیدوں میں لوگوں کے جوڑے بدل کر کرایے پر دینے سے باز رہیں۔ لین کے قاہرہ میں صباغ بازار کے پیشوں میں تھا، اور اولیاء چلبی کے استنبول میں رنگریز پانچ سو دکانوں پر آٹھ سو آدمی تھے اور ساتھ سات سو چوگان مارنے والے جو رنگا کپڑا دھوتے تھے۔"
