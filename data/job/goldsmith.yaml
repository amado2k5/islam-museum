summary:
  ar: "الصائغ ⁦(زرگر، قُيُمجي)⁩ حِرفي صياغة المعادن والأحجار الثمينة في حليٍّ وأدوات: من ورش قصر طوپ قاپو ⁦(٥٨ زرگراً عام ١٥٢٦م)⁩ إلى ثلاثة آلاف دكان في إستانبول في إحصاء أوليا جلبي، وكان السلاطين يتعلّمون الصنعة ويرعَون كبرى اجتماعاتها."
  en: "The goldsmith (sâigh, Ottoman zerger/kuyumcu) fashioned precious metals and stones into jewellery and objects: from the Topkapı workshop (58 zergers in 1526) to the ~3,000 Istanbul shops Evliya Çelebi counts; sultans learned the craft and sponsored its great twenty-year guild festival."
  ur: "سنار ⁦(صائغ، زرگر، قیومجی)⁩ قیمتی دھاتوں اور پتھروں کو زیورات اور اشیاء میں ڈھالنے والا کاریگر ہے: توپ قپو ورکشاپ ⁦(۱۵۲۶ء میں ۵۸ زرگر)⁩ سے اولیا چلبی کے شمار کردہ تقریباً تین ہزار استنبول دکانوں تک؛ سلاطین خود یہ پیشہ سیکھتے اور اس کے عظیم جشن کی سرپرستی کرتے تھے۔"
  es: "El orfebre (sâigh, zerger/kuyumcu otomano) transformaba metales y piedras preciosas en joyas y objetos: desde el taller de Topkapı (58 zergers en 1526) hasta los aproximadamente 3000 talleres de Estambul que cuenta Evliya Çelebi; los sultanes aprendieron el oficio y patrocinaron su gran festival gremial de veinte años."
