summary:
  ar: "المغنّي والمغنّية من يؤدّون بأصواتهم في الإنشاد المنفرد والجماعي؛ عند الترك خوانده، وعند العرب مغنّي ومغنّية، وعند الفرس گوينده وقوّال. قبل الإسلام كانت القينات — إماء المغنّيات — يحملن صناعة التغنّي، وعند العثمانيين صار الخوانده عمود الفصل: يقرأ الغزل والبسته والنقش والكار واليورك سمايي، ويقود الجماعة الصرهانده يضرب بالدف الوزن ويرتّب البرنامج. وفي القاهرة الحديثة وصف لين العوالم — مغنّيات مهرة يُجلسن خلف السياج المشبك — بأنهن أعذب ما سمعه من غناء، تُجمع لهنّ أحياناً أكثر من خمسين غينياً في الليلة الواحدة."
  en: "The singer gives voice in solo and ensemble performance: hânende in Turkish, mugannî and muganniye in Arabic, gûyende and kavvâl in Persian. Before Islam the kaynes — the singing-girls — carried the craft of artful song; in the Ottoman fasıl the hânende read the gazel, beste, nakış, kâr and yürük semâi, and the serhânende led the ensemble, beating the usul on the def and ordering the programme. In nineteenth-century Cairo Lane heard the celebrated ʿAwâlim — accomplished female singers seated behind the hareem lattice — judged their singing sweeter than any music he knew, and saw more than fifty guineas collected for one ʿālmeh in a night."
  ur: "گلوکار انفرادی اور جماعتی ادائیگی میں آواز دیتا ہے: ترکوں میں خوانندہ، عربوں میں مغنی و مغنیہ، فارسی میں گویندہ و قوّال۔ اسلام سے پہلے قینے — گانے والی لونڈیاں — فنِ تغنی کی حامل تھیں؛ عثمانی فصل میں خوانندہ غزل، بستہ، نقش، کار اور یورک سماعی پڑھتا، اور سرخوانندہ دف سے اصول پور کرتے ہوئے اجتماع کی قیادت اور پروگرام کی ترتیب کرتا۔ انیسویں صدی کے قاہرے میں لین نے مشہور عوالم سنی — جالی کے پردے کے پیچھے بیٹھی ماہر گانے والیاں — ان کا گانا اپنی سنی ہوئی ہر موسیقی پر فائز پایا، اور ایک عالمہ کے لیے ایک رات پچاس گنی سے زائد جمع ہوتے دیکھا۔"
  es: "La cantante da voz en interpretaciones solistas y en conjunto: hânende en turco, mugannî y muganniye en árabe, gûyende y kavvâl en persa. Antes del Islam, las kaynes —las cantantes— llevaban el arte del canto artístico; en el fasıl otomano, las hânende leían el gazel, beste, nakış, kâr y yürük semâi, y la serhânende dirigía el conjunto, marcando el usul en el def y ordenando el programa. En el Cairo del siglo XIX, Lane escuchó a las célebres ʿAwâlim —consumadas cantantes femeninas sentadas detrás de la celosía del hareem—, consideró que su canto era más dulce que cualquier música que conociera, y vio cómo se recaudaban más de cincuenta guineas por un ʿālmeh en una noche."
