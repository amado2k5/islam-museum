training:
  mode: apprenticeship
  certification: "The hânende needed a fine voice and real musical knowledge; Abdülkadir-i Merâgi held that singers bearing these qualities win the more esteem among learned musicians {cite:tdv-hanende}. Evliya's own singing-master was the Imperial favourite Tokatlı Dervish Omar Gulsheni, who taught him in the Imperial Harem and excelled in every makam {cite:evliya-narrative-hammer-v2}."
  duration: "The serhânende's command of repertory — adjusting the programme to conditions as the performance ran — marks mastery won inside the ensemble {cite:tdv-hanende}."
