summary:
  ar: "النائب من يتولى مسؤولية منصب مكان صاحبه لوقت مؤقت؛ أناب النبي ابن أم مكتوم ومحمد بن مسلمة على المدينة في غيابه، وتتابع النواب على الولاية والقضاء والتدريس والإمامة في الدول الإسلامية حتى صار لكل ديوان سلجوقي نائب يحتل ثاني المقامات، ولسلطان المماليك نواب في مصر والشام يحكمون باسمه. وفي العثمانيين كان النائب القاضي الشرعي المدرب في المدرسة يجلس محل القاضي في الكازا، برزت مدرسة «معلمخانه نواب» عام ١٨٥٥ لتأهيله، وانتهت الوظيفة بإلغاء المحاكم الشرعية."
  en: "The nāib carries an office's responsibility in the holder's place for a time. The Prophet left Ibn Umm Maktum and Muhammad b. Maslama as deputies in Medina, and deputies followed in governorships, judgesthips, professorships and imamates, until every Seljuk divan had a nāib in its second seat and the Mamluk sultan's nāibs ruled Egypt and Syria in his name. In Ottoman lands the nāib was the medrese-trained legist who sat for the kadı in the kaza; a dedicated school, Muallimhane-i Nüvvâb, opened in 1855 to qualify them, and the office ended with the abolition of the şerʿî courts."
  ur: "نائب وہ ہے جو عہدے کی ذمہ داری کچھ عرصے کے لیے اصل صاحب کی جگہ نبھاتا ہے۔ نبی نے مدینہ میں اپنی غیر موجودگی میں ابن ام مکتوم اور محمد بن مسلمہ کو نائب چھوڑا؛ پھر گورنری، قضا، تدریس اور امامت میں نواب رہے، یہاں تک کہ ہر سلجوقی دیوان میں نائب دوسرے درجے کا افسر تھا اور مملوک سلطان کے نائب مصر و شام میں اس کے نام پر حکومت کرتے تھے۔ عثمانیوں میں نائب مدرسہ پڑھا ہوا فقیہ تھا جو قضے میں قاضی کی جگہ بیٹھتا تھا؛ 1855ء میں معلم خانہ نواب مکتب کھلا، اور شرعی عدالتوں کے خاتمے کے ساتھ یہ عہدہ ختم ہوا۔"
