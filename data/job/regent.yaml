places:
  - { place: place/medina, note: "Whenever the Prophet left Medina he appointed a deputy — Ibn Umm Maktum, Abu Ruhm Kulthum b. Husayn or Muhammad b. Maslama — and the Rashidun kept the custom.", sources: [source/tdv-naib] }
  - { place: place/baghdad, note: "Appointed to Egypt to remove him from the centre, the Abbasid governor Bayik Bey sent his stepson Ahmad b. Tulun as his nāib — the accidental beginning of the Tulunids; with the qadi al-qudat office under Harun al-Rashid, judges won the right to name their own nāibs.", sources: [source/tdv-naib] }
  - { place: place/merv, note: "In the Great Seljuk divans and their provincial branches the nāib held the second seat after the divan chief, and a favoured divan nāib could eclipse the other dignitaries, even the vizier.", sources: [source/tdv-naib] }
  - { place: place/cairo, note: "Ayyubid and Mamluk nāibs of Egypt and Syria wielded the sultan's own powers — they appointed and dismissed in his name, consulting him only on the gravest matters, and the Syrian nāibs bore the title malik al-umara.", sources: [source/tdv-naib] }
  - { place: place/istanbul, note: "In eighteenth-century Istanbul about twenty-five nāibs sat: the Bab Mahkemesi nāib at the head, then the court nāibs of the Istanbul, Galata, Eyüp and Üsküdar jurisdictions, plus itinerant market and inspection nāibs such as the ayak, kapan, yağ and avarız nāibs.", sources: [source/tdv-naib] }
