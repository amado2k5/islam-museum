training:
  mode: formal-schooling
  certification: "An Ottoman nāib was an ilmiye man trained in the medrese to a level able to settle disputes in his own kaza; the kadı chose him and the kazasker of Anatolia or Rumelia confirmed him, in Istanbul the kadı of Istanbul. Nizam al-Mulk had earlier advised paying nāibs a treasury salary so they would neither burden the people nor resort to unlawful gain. From 1855 the Muallimhane-i Nüvvâb school — later Mekteb-i Nüvvâb (1883), Mekteb-i Kudât (1908) and Medresetü'l-kudât — trained kadıs and nāibs."
  duration: "Nāibs were generally appointed sine die, with periodic reshuffles; exceptionally a man held the same niyabet for twenty-five or thirty years."
