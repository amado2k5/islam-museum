training:
  mode: ijaza-chain
  certification: "The transmitter's warrant was the chain itself: a report counted only when received by one of the eight recognised ways of tahammul (receiving) from the traditionists, and the râvî's own reliability was fixed by the two tests of adala — Muslim, adult, sane, God-fearing and free of bad conduct — and dabt, perfect memorisation or carefully checked and preserved writing with no change of meaning."
  duration: "Lifelong. The entry describes students seeking out living râvîs and facing every hardship to learn the report from them; in the poetry tradition the râvî attached himself to one poet, memorised his verse and transmitted it as his recognised bearer."
