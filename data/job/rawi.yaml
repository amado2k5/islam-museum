places:
  - { place: place/mecca, note: "From the first generations the Companions counted it a religious duty to pass on what they had heard from the Prophet; the entry names Abdullah ibn Amr ibn al-As, Ibn Abbas, Ibn Umar, Abu Sa'id al-Khudri, Jabir ibn Abdullah and Anas ibn Malik among the Companions who laboured to preserve the reports against fabrication.", sources: [source/tdv-ravi] }
  - { place: place/medina, note: "The Followers' generation — Abu al-Aliya al-Riyahi, Sa'id ibn al-Musayyib, Ibrahim al-Nakha'i, al-Sha'bi and Muhammad ibn Sirin among them — began asking for the isnad and investigating the standing of the râvîs.", sources: [source/tdv-ravi] }
  - { place: place/baghdad, note: "Through the second century the hadith authorities — Ibn Shihab al-Zuhri, Malik ibn Anas, Sufyan al-Thawri, al-Shafi'i and their peers — travelled to learn reports from living râvîs, and biographical literature grew up to test their reliability.", sources: [source/tdv-ravi] }
