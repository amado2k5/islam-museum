summary:
  ar: "الراوية من حفظ ما سمعه وأدّاه بألفاظ الأداء المتعارفة. في الشعر العربي القديم كان لكل شاعر راوية أو رواة خاصون يحفظون شعره ويبلّغونه بمنهج الأستاذ والتلميذ حتى صارت الرواية مدرسة ذات تقاليد. وفي علم الحديث هو من تعلّم الحديث ونقله بسنده، ووُضعت لقبول روايته شرطتا العدالة والضبط، فمن استوفاهما سُمّي ثقةً، وصنّف العلماء الرواة طبقات: الصحابة ثم التابعون ثم تابعوهم، وأحصى الذهبي نحو ٢٤٢٤ راوياً وحافظاً حتى عصره في ثمانٍ وعشرين طبقة."
  en: "The rawi is the one who learns what he hears and passes it on with the received formulas of transmission. In ancient Arabic poetry every poet had his own râvî or râvîs who memorised and carried his verse by a master-apprentice method, until râvilik became a school with its own tradition. In the science of hadith the râvî is the one who learns a report and transmits it with its isnad; the scholars tested him by two qualities, adala (uprightness) and dabt (precision), and the one who fulfilled both was called thiqa (trustworthy). They arranged the transmitters in generations — Companions, Followers, then the followers of the Followers — and al-Dhahabi counted some 2,424 hadith memorisers and transmitters down to his own age in twenty-eight ranks."
  ur: "راوی وہ ہے جو سنا ہوا متن حفظ کر کے روایت کے مستقر الفاظ کے ساتھ آگے منتقل کرے۔ قدیم عربی شاعری میں ہر شاعر کا اپنا راوی یا راویاں ہوتے جو استاد شاگرد کے طریقے سے اس کا کلام یاد کر کے پہنچاتے، یہاں تک کہ روایت ایک روایت والا مکتب بن گئی۔ علم حدیث میں راوی وہ ہے جو حدیث سیکھ کر اسے سند سمیت نقل کرے؛ علماء نے اسے عدالت اور ضبط دو صفات سے آزمایا اور دونوں پوری کرنے والے کو ثقہ کہا، اور راووں کو طبقات میں رکھا: صحابہ، تابعین، تبع تابعین؛ ذہبی نے اپنے زمانے تک تقریباً ۲۴۲۴ حفاظ و راووں کو اٹھائیس طبقوں میں گنا۔"
  es: "El rawi es quien aprende lo que oye y lo transmite con las fórmulas de transmisión recibidas. En la poesía árabe antigua, cada poeta tenía su propio râvî o râvîs que memorizaban y transmitían su verso mediante el método maestro-aprendiz, hasta que el râvilik se convirtió en una escuela con su propia tradición. En la ciencia del hadiz, el râvî es quien aprende un relato y lo transmite con su isnad; los eruditos lo evaluaban mediante dos cualidades: adala (rectitud) y dabt (precisión), y quien cumplía ambas era llamado thiqa (digno de confianza). Organizaban a los transmisores por generaciones: Compañeros, Seguidores y luego los seguidores de los Seguidores. Al-Dhahabi contabilizó unos 2424 memorizadores y transmisores de hadices hasta su propia época, en veintiocho rangos."
