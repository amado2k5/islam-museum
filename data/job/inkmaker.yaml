summary:
  ar: "صانع الحبر ⁦(مُرَكَّبجي)⁩ هو الحِرفي الذي يُعدّ مواد الكتابة السائلة للخطّاطين والنسّاخ: أهمّها حبر الإس، وهو سُخام يُستخرج من حرق زيوت وشموع ثم يُمزج بمحلول الصمغ العربي ويُدقّ في هاون حجري أياماً حتى يذوب تماماً، ويُصفَّى ويُخفَّف بقوام مختلف لكل خط."
  en: "The inkmaker (mürekkepçi) prepared liquid writing materials for calligraphers and copyists, above all soot (is) ink: lampblack from controlled burning of oils and waxes, worked into a gum-arabic solution, pounded in a stone mortar for days until it dissolved, then strained and diluted to a different consistency for each script."
  ur: "روشنائی ساز ⁦(مُرکّبچی)⁩ وہ کاریگر ہے جو خطاطوں اور نساخوں کے لیے سیاہی تیار کرتا ہے؛ اہم ترین دھویں ⁦(اس)⁩ کی سیاہی ہے: کنٹرول شدہ حالت میں تیل اور موم جلا کر ملنے والا کالک جسے گوند عربی کے محلول میں پیس کر پتھر کی اوکھلی میں دنوں کُٹا جاتا، پھر چھان کر ہر خط کے لیے الگ قوام پر پتلا کیا جاتا۔"
  es: "El fabricante de tinta (mürekkepçi) preparaba materiales de escritura líquidos para calígrafos y copistas, sobre todo tinta de hollín (is): negro de humo procedente de la combustión controlada de aceites y ceras, mezclado con una solución de goma arábiga, machacado en un mortero de piedra durante días hasta que se disolvía, y luego colado y diluido a una consistencia diferente para cada escritura."
  fr: "L'encreur (mürekkepçi) préparait des matériaux d'écriture liquides pour les calligraphes et les copistes, notamment l'encre de suie: du noir de fumée provenant de la combustion contrôlée d'huiles et de cires, transformé en une solution de gomme arabique, pilée dans un mortier de pierre pendant des jours jusqu'à dissolution, puis filtrée et diluée à une consistance différente pour chaque écriture."
