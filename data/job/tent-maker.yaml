summary:
  ar: "الخَيَّامِيّ صانع الخيام والمضارب وصناعتها من أقدم الصنائع عند إوليا، إذ يجعل مبتدعها جمشيد الذي صنع أول خيمة، وبيرها زمن النبوة ناصر بن عبد الله المكيّ الخيّام الذي قلّده سلمان وصنع خيمة النبي من الإحرام أي ثياب الحجّ الغليظة. يمرّ الخيّامجية ⁦(صنّاع الخيام)⁩ في الموكب وقد نصبوا خياماً فاخرة على محفّات، وفي داخلها غلمان حسان يعملون ويمازح بعضهم بعضاً، وبعضهم يمدّ الشنّ ⁦(السایبان)⁩ والناموسيات ⁦(ناموسية)⁩؛ ومعهم صنّاع أطناب الخيام ⁦(طنبجيان)⁩ مئة رجل بأربعين دكاناً يزيّنون خيامهم بأطناب من القطن بألوان مختلفة. وفي إسطنبول حيٌّ يُسمّى محلة الأوتاقجية ⁦(الخياميين)⁩ نسبةً إلى خيّامي العسكر الذين نزلوا فيه حين خُيّطت الحرب على الروملي."
  en: "The khayyami made tents and pavilions, and in Evliya's telling the craft is among the oldest: its inventor is Jemshid, who made the first tent, and its patron in the Prophet's time is Nassir ibn Abdallah al-Makki the tent-maker, girded by Selman, who made the Prophet's tent of ihram — the coarse cloth of the pilgrim's dress. The tent-makers (Khaimejian) passed in the procession with fine tents dressed on litters, fine boys seen working inside them and playing tricks with each other, some busy setting up awnings and mosquito-nets (Sayeban, Namusie); with them marched the tent-rope-makers (Tanabjian), a hundred men in forty shops, adorning their tents with tent-ropes of cotton in different colours. And Istanbul kept a quarter named Mohalle Otakjian after the tent-pitchers of the army, who had their station there when war was made against Rumeli."
  ur: "خیمہ ساز خیمے اور ڈیرے بنانے والا ہے، اور اولیاء کی روایت میں یہ صنعت قدیم ترین میں ہے: اس کی ایجاد جمشید نے کی جس نے پہلا خیمہ بنایا، اور نبوت کے زمانے میں اس کا پیر ناصر بن عبد اللہ مکی خیمہ ساز ہے جسے سلمان نے کمر بند پہنائی اور جس نے نبی کا خیمہ احرام کے موٹے کپڑے سے بنایا۔ خیمہ ساز ⁦(خیمہ جیان)⁩ جلوس میں محفوں پر سجے خوبصورت خیمے لے کر چلے، جن میں حسین لڑکے کام کرتے اور آپس میں چھیڑ چھاڑ کرتے، کچھ سایہ بان ⁦(سایبان)⁩ اور مچھردانیاں ⁦(ناموسیہ)⁩ لگاتے؛ ان کے ساتھ خیمے کی رسیاں بنانے والے ⁦(طنبجیان)⁩ سو آدمی چالیس دکانیں جو اپنے خیموں کو مختلف رنگوں کی سوت کی رسیوں سے سجاتے۔ اور استنبول میں محلہ اوتاقجیان کا نام فوج کے خیمہ کُشوں کے پڑاؤ سے پڑا جب روملی پر جنگ تی ہوئی۔"
  es: "Los khayyami fabricaban tiendas y pabellones, y según Evliya, este oficio es uno de los más antiguos: su inventor es Jemshid, quien fabricó la primera tienda, y su patrón en tiempos del Profeta es Nassir ibn Abdallah al-Makki, el fabricante de tiendas, ceñido por Selman, quien hizo la tienda de ihram del Profeta —la tela tosca de la vestimenta del peregrino—. Los fabricantes de tiendas (Khaimejian) pasaban en la procesión con elegantes tiendas colocadas sobre literas, donde se veía a muchachos trabajando y jugando entre ellos, algunos ocupados instalando toldos y mosquiteras (Sayeban, Namusie); con ellos marchaban los fabricantes de cuerdas para tiendas (Tanabjian), un centenar de hombres en cuarenta talleres, adornando sus tiendas con cuerdas de algodón de diferentes colores. Y Estambul conservó un barrio llamado Mohalle Otakjian en honor a los montadores de tiendas de campaña del ejército, que tenían su base allí cuando se declaró la guerra contra Rumeli."
  fr: "Les khayami fabriquaient des tentes et des pavillons, et selon le récit d'Evliya, cet artisanat compte parmi les plus anciens: son inventeur serait Jemshid, qui confectionna la première tente, et son protecteur à l'époque du Prophète était Nassir ibn Abdallah al-Makki, le fabricant de tentes, secondé par Selman, qui réalisa la tente d'ihram du Prophète – le tissu grossier du vêtement du pèlerin. Les fabricants de tentes (Khaimejian) défilaient en procession avec de belles tentes transportées sur des litières; on y voyait de jeunes garçons s'affairer à l'intérieur, jouant et plaisantant, certains occupés à installer des auvents et des moustiquaires (Sayeban, Namusie); à leurs côtés marchaient les fabricants de cordes de tente (Tanabjian), une centaine d'hommes répartis dans quarante ateliers, ornant leurs tentes de cordes de coton de différentes couleurs. Istanbul conservait un quartier nommé Mohalle Otakjian en hommage aux monteurs de tentes de l'armée, qui y avaient leur poste lors de la guerre contre Rumeli."
