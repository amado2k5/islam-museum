  techniques:
    ar: "يصف إوليا عرض الطائفة: خيام فاخرة منصوبة على محفّات يُرى في داخلها الغلمان يشتغلون، وبعضهم يمدّ السایبان والناموسيات، وهي الظّلل والناموسيات التي تُكسو بها الخيام؛ وصنّاع الأطناب يزيّنون خيامهم بأطناب القطن الملوّنة المختلفة؛ وبير زمن النبوة ناصر المكيّ صنع خيمة النبي من قماش الإحرام الغليظ. ويبقى في المدينة أثر قديم لهم هو حيّ الأوتاقجية حيث كان معسكر خيّامي العسكر قبيل حروب الروملي، كما سُمّي حيّ الطوبجية بالمدفعجية."
    en: "Evliya describes the guild's display: fine tents dressed on litters, the boys seen working inside, some setting up the sayeban and namusie — the awnings and mosquito-nets with which tents are hung; the rope-makers adorning their tents with tent-ropes of cotton in different colours; and the patron of the Prophet's time, Nassir al-Makki, made the Prophet's tent of the coarse ihram cloth. The city keeps their old trace in the Otakjian quarter, where the army's tent-pitchers were stationed before the Rumeli wars, just as the Topjian quarter is named for the artillerymen."
    ur: "اولیاء انجمن کی نمائش بیان کرتا ہے: محفوں پر سجے خوبصورت خیمے جن کے اندر لڑکے کام کرتے دکھائی دیتے، کچھ سایبان اور ناموسیہ یعنی خیموں کی چھائیاں اور مچھردانیاں لگاتے؛ رسیاں بنانے والے اپنے خیمے مختلف رنگوں کی سوت کی رسیوں سے سجاتے؛ اور نبوت کے زمانے کا پیر ناصر مکی نے نبی کا خیمہ احرام کے موٹے کپڑے سے بنایا۔ شہر میں ان کا پرانا نشان اوتاقجیان کا محلہ ہے جہاں روملی کی جنگوں سے پہلے فوج کے خیمہ کش پڑاؤ کرتے، جیسے توپجیان محلہ توپ خانوں کے نام پر ہے۔"
