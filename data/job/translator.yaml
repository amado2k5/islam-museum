training:
  mode: mixed
  certification: "The entry describes no single diploma. Zayd ibn Thabit is reported to have learned the languages from speakers around him, including the Persian envoy, the Prophet's chamberlain and the Prophet's servants. Venice founded a school for young interpreters in 1551, and France followed. The Ottoman chief interpreter had eight young language clerks. After 1821 a translation office was formed beside the divan clerks, and later the civil-service school taught languages, though the entry says it never became clear whether that office was training officials or diplomats."
