summary:
  ar: "المترجم ينقل الكلام من لسان إلى لسان. والمدخل يغلب لفظ الترجمان على النقل الشفهي، ولفظ المترجم على نقل الكتب. والكلمة عربية، وتُقال في التركية ترجمان، وفي التركية الحديثة بكلمة جديدة. وقد احتاجت الدول إلى هذا العمل في السياسة والتجارة والقضاء والجباية، وفي نقل كتب اليونانية والسريانية والفارسية والسنسكريتية إلى العربية، ثم في ديوان السلاطين العثمانيين."
  en: "The translator carries speech from one language into another. The entry uses tercüman chiefly for interpreting by speech, and mütercim for the translation of books. The word is Arabic. Turkish says tercüman, and modern Turkish has a newer word for the same work. States used it in politics, trade, law and tax collection, in the rendering of Greek, Syriac, Persian and Sanskrit books into Arabic, and later in the Ottoman imperial divan."
  ur: "مترجم بات کو ایک زبان سے دوسری زبان میں لے جاتا ہے۔ مدخل ترجمان زیادہ تر زبانی ترجمہ کے لیے استعمال کرتا ہے اور مترجم کتابوں کے ترجمہ کے لیے۔ یہ لفظ عربی ہے۔ ترکی میں ترجمان کہا جاتا ہے، اور جدید ترکی میں اسی کام کے لیے ایک نیا لفظ ہے۔ ریاستوں نے اسے سیاست، تجارت، عدالت اور محصول میں استعمال کیا، یونانی، سریانی، فارسی اور سنسکرت کتابوں کو عربی میں لانے میں، اور بعد میں عثمانی دیوان میں۔"
