summary:
  ar: "الجزّار ⁦(القصّاب، اللحّام)⁩ حِرفي الذبح والسلخ وبيع اللحم في المدن الإسلامية؛ لأن اللحم غذاء أساسي سريع الفساد خضع عمله لأشدّ رقابات الحسبة: شروط القصّاب، حضور المُحتسِب عند الذبح، قواعد السلخ والنظافة، ومنع خلط الأنواع والأقدم بالجديد."
  en: "The butcher (qassâb, jazzâr, lahhâm) slaughtered, skinned and sold meat in Islamic cities; because meat is a staple that spoils quickly the trade drew the strictest hisba supervision: qualifications of the butcher, the muhtasib's presence at slaughter, rules of skinning and cleanliness, and bans on mixing species or old with fresh."
  ur: "قصاب ⁦(جزّار، لحّام)⁩ اسلامی شہروں میں ذبح، کھال اتارنے اور گوشت بیچنے والا کاریگر ہے؛ گوشت بنیادی اور جلد خراب ہونے والی خوراک ہونے کے سبب اس پیشے پر حسابے کی سخت ترین نگرانی رہی: قصاب کی شرائط، ذبح پر محتسب کی موجودگی، کھال اتارنے اور صفائی کے اصول، اور نسلوں یا پرانے-تازہ گوشت ملانے کی ممانعت۔"
