summary:
  ar: "القارئ حرفة تلاوة القرآن ونقل القراءات وتعليمها؛ انطلقت من أصحاب النبي الذين أُرسلوا مُعلّمي قرآن إلى الأمصار، ثم صار القرّاء صفوة أهل العلم في مكة والمدينة والكوفة والبصرة ودمشق ومنهم انبثقت القراءات السبع والعشر. أخذ المقرئ القراءة مشافهةً بإسناد متصل، وعلّم في حلقات الجوامع ⁦(السبع والتصدير)⁩ وفي الكتاتيب والمدارس ودور القرّاء، وخدم قارئ الجند في الثغور والعسكر، وتصدّر مهنته شيخ القراءة ورئيس القرّاء."
  en: "The qari is the professional reciter, transmitter and teacher of the Qur'an's readings; the line began with the Companions sent out as Qur'an teachers, and the qurra became the scholarly elite of Mecca, Medina, Kufa, Basra and Damascus, from whom the seven and ten readings stem. The muqri took his recitation mouth to mouth on an unbroken isnad, taught in the mosque circles (the sab' and tasdir), the kuttab, the madrasas and the dar al-qurra, served as qari al-jund on the frontier and in the army, and rose under a shaykh al-qiraa and a reisülkurra."
  ur: "قاری قرآن کی تلاوت، قراءتوں کی روایت اور تعلیم کا پیشہ ور ہے؛ اس کا آغاز ان صحابہ سے ہوا جو قرآن کے معلم بنا کر اطراف میں بھیجے گئے، پھر قرّاء مکہ، مدینہ، کوفہ، بصرہ اور دمشق کے علمی پیشوا بنے جن سے سات اور دس قراءتیں نکلیں۔ مقرئ مسلسل سند سے منہ سے منہ قراءت لیتا اور مسجدوں کے حلقوں ⁦(سبع اور تصدیر)⁩، کتّابوں، مدارس اور دارالقرّا میں پڑھاتا، سرحد اور لشکر میں قارئ الجند کی خدمت کرتا، اور اس پیشے کی سرکردہ شخصیات شیخ القراءة اور رئیس القرّا تھے۔"
  es: "El qari es el recitador, transmisor y maestro profesional de las lecturas del Corán; la tradición comenzó con los Compañeros enviados como maestros del Corán, y el qurra se convirtió en la élite erudita de La Meca, Medina, Kufa, Basora y Damasco, de quienes provienen las siete y diez lecturas. El muqri transmitía su recitación de boca en boca mediante una cadena de transmisión ininterrumpida (isnad), enseñaba en los círculos de la mezquita (el sab' y el tasdir), el kuttab, las madrasas y el dar al-qurra, servía como qari al-jund en la frontera y en el ejército, y ascendía bajo la tutela de un shaykh al-qiraa y un reisülkurra."
  fr: "Le qari est le récitant professionnel, transmetteur et enseignant des lectures du Coran. Cette tradition remonte aux Compagnons envoyés comme enseignants du Coran, et les qurra formèrent l'élite savante de La Mecque, Médine, Koufa, Bassora et Damas, dont sont issues les sept et dix lectures. Le muqri transmettait sa récitation oralement, suivant une chaîne de transmission ininterrompue (isnad), enseignait dans les mosquées (sab' et tasdir), les kuttab, les madrasas et les dar al-qurra, officiait comme qari al-jund à la frontière et dans l'armée, et progressait sous la tutelle d'un cheikh al-qiraa et d'un reisülkurra."
  tr: "Kur'an okuma, ayetlerini aktarma ve öğretme mesleği, çeşitli bölgelere Kur'an öğretmeni olarak gönderilen Peygamberin sahabeleriyle başlamıştır. Daha sonra Kur'an okuyucuları, Mekke, Medine, Kufe, Basra ve Şam'da seçkin alimler arasına girmiş ve yedi ve on şeriat ayetleri onlardan çıkmıştır. Kur'an okuyucusu, ayetleri kesintisiz bir isnad zinciriyle sözlü olarak öğrenmiştir. Camilerde (yedi ayet ve son ayet) Kur'an dersleri vermiş, Kur'an okullarında ve Kur'an okuma merkezlerinde eğitim vermiştir. Ayrıca sınır bölgelerinde ve askeri kamplarda ordunun Kur'an okuyucusu olarak görev yapmış ve mesleği, Şeyh-i Tefsir ve Baş Tefsirci unvanıyla zirveye ulaşmıştır."
  id: "Profesi melafalkan Al-Quran, menyampaikan bacaannya, dan mengajarkannya bermula dari para sahabat Nabi yang diutus sebagai guru Al-Quran ke berbagai wilayah. Para pelafal kemudian menjadi ulama terkemuka di Mekah, Madinah, Kufa, Basra, dan Damaskus, dan dari merekalah muncul tujuh dan sepuluh bacaan kanonik. Pelafal mempelajari bacaan secara lisan dengan sanad yang tidak terputus. Ia mengajar di majelis studi masjid (tujuh bacaan dan bacaan terakhir), di sekolah-sekolah Al-Quran, dan di pusat-pusat pelafalan Al-Quran. Ia juga bertugas sebagai pelafal tentara di daerah perbatasan dan kamp militer, dan profesinya mencapai puncaknya dengan gelar Syekh Pelafalan dan Kepala Pelafal."
