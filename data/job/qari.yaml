places:
  - { place: place/medina, note: "The Prophet sent Mus'ab ibn Umayr to Medina as Qur'an teacher after the first Aqaba pledge, and Ibn Sa'd's report of Mahrama ibn Nawfal's 'dar al-qurra' house shows the name was already used for a place of recitation in the Prophet's time.", sources: [source/tdv-darulkurra] }
  - { place: place/damascus, note: "Abu al-Darda, the 'qari of al-Sham', taught circles of more than 1,500 at the Umayyad Mosque; Damascus later held the first independent dar al-qurra, the Rishaiyya founded by Risha ibn Nazif about the turn of the fifth century AH, and several more named after their qurra masters.", sources: [source/tdv-darulkurra] }
  - { place: place/kufa, note: "Kufa was one of the great reading centres: Asim ibn Bahdala, Hamza ibn Habib, al-Kisa'i and al-A'mash gave the city four of the ten canonical readings.", sources: [source/tdv-kiraat] }
