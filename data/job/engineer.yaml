summary:
  ar: "المهندس عند المسلمين كان عمله في علم الحِيَل، أي التقنية الميكانيكية: عرّفه الفارابي فرعاً عملياً من العلوم الرياضية يثبت مطابقة معطيات الرياضيات لحقائق الطبيعة، فيدخل فيه الهندسة الإنشائية والرصد وآلات الموسيقى والروافع، وضيّقه الخوارزمي في صنع الرافعات والمنجنيقات والآلات المائية والأوتوماتا. وكتب بنو موسى «كتاب الحيل» في القرن التاسع يصفون فيه نحو مئة آلة أكثرها آنية أوتوماتيكية مع منظومات ضبط ذاتي، وكتب الجزري سنة 1206م في بلاط الأرتقيين بحصن كيفا أهم كتب الميكانيكا. ثم عاد الاسم مدرسةً: فُتحت المهندسخانه البرّي الهمايون في هسكوي سنة 1795م تخرّج مهندسي الجيش بالهندسة والمساحة والتحصين وحساب التفاضل."
  en: "The engineer's work in the Islamic world belonged to ilm al-hiyal, mechanical technology: al-Farabi defined it as the practical branch of the mathematical sciences demonstrating the fit between mathematical data and physical fact — construction engineering, observation, musical instruments and levers all within it — while al-Khwarizmi narrowed it to levers, mangonels, hydraulic machines, water screws and automata. The Banu Musa wrote the Kitab al-Hiyal in the ninth century describing about a hundred devices, mostly automatic vessels, with self-acting control mechanisms, and al-Jazari wrote the greatest mechanical book at the Artukid court of Hisn Kayfa in 1206. The name returned as a school: the Mühendishâne-i Berrî-i Hümâyun opened at Hasköy in 1795 to graduate army engineers through geometry, surveying, fortification and the calculus."
  ur: "اسلامی دنیا میں مہندس کا کام علمِ حِیل یعنی میکانیکی ٹیکنالوجی تھا: فارابی نے اسے ریاضی علوم کی عملی شاخ قرار دیا جو ریاضی کے معطوں اور طبیعیات کی حقیقتوں کی مطابقت دکھائے — تعمیری ہندسہ، مشاہدہ، ساز اور لیور سب اس میں آتے ہیں — جبکہ خوارزمی نے اسے لیور، منجنیق، پانی کی مشینیں اور خودکار آلات تک محدود کیا۔ بنو موسیٰ نے نویں صدی میں کتاب الحیل لکھی جس میں تقریباً سو آلات — اکثر خودکار برتن — خودکار کنٹرول میکانزم کے ساتھ بیان ہوئے، اور الجزری نے 1206ء میں آرتوقیوں کے دربار حصن کیفا میں میکانکیات کی سب سے بڑی کتاب لکھی۔ پھر یہ نام ایک مدرسے کی صورت میں لوٹا: 1795ء میں ہسکوئے میں مهندسخانۂ برئ ہمایوں کھلا جو فوجی انجینیر ہندسہ، سروے، قلعہ بندی اور حسابِ تفاضل سے تیار کرتا۔"
  es: "El trabajo del ingeniero en el mundo islámico pertenecía al ilm al-hiyal, la tecnología mecánica: al-Farabi la definió como la rama práctica de las ciencias matemáticas que demostraba la correspondencia entre los datos matemáticos y los hechos físicos —ingeniería de la construcción, observación, instrumentos musicales y palancas, todo incluido en ella—, mientras que al-Juarismi la limitó a palancas, mangoneles, máquinas hidráulicas, tornillos de agua y autómatas. Los Banu Musa escribieron el Kitab al-Hiyal en el siglo IX, describiendo alrededor de un centenar de dispositivos, en su mayoría recipientes automáticos, con mecanismos de control de acción propia, y al-Jazari escribió el libro de mecánica más importante en la corte artúquida de Hisn Kayfa en 1206. El nombre resurgió como escuela: el Mühendishâne-i Berrî-i Hümâyun abrió sus puertas en Hasköy en 1795 para graduar ingenieros militares en geometría, topografía, fortificación y cálculo."
