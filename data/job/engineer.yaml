training:
  mode: mixed
  certification: "The hiyal masters learned in the scholarly way — the Banu Musa were mathematicians, astronomers and translators before they were mechanicians — and al-Jazari wrote under Artukid patronage. From 1795 the mühendis was made by the state school: four classes taught hat, arithmetic, geometry and technical drawing, then surveying, fortification, conic sections, the calculus, mechanics and astronomy, entirely by Turkish teachers; graduates entered the new army as 'mansûre mühendisi' with engineer ranks, and from 1841 the mühendis alayı."
