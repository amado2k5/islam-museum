summary:
  ar: "الإبرجي صانع إبر الخياطة وإبر الأكياس، وحرفته عند ابن الأخوة قائمة على صدق المعدن: يُنصَب عليهم أمين من صنفهم يمنع خلط إبر الفولاذ بإبر الحديد الرخو — لأن الحديد إذا سُنّ خُلِط بفولاذ دمشق — ويُحلَّفون على التمييز بينهما؛ وأجود الإبر «الخيّاطية» المسمّاة المسَوَّدة تُسَنّ ثلاثاً وتُصقَل وأجودها مستدير الثقب؛ ويُلزَمون بتسخين الإبر وتشديدها فالفولاذ بالتسخين والتشديد يصلُب بينما سواه يلين؛ وإبر الأكياس تجوز من الفولاذ ومن الحديد الرخو وتُسمّى بأنواع على عدد ما في الرطل. وفي موكب إسطنبول عدّ إوليا صنّاع الإبر ⁦(إغنجيان)⁩ مئتي رجل بخمسة وخمسين دكاناً بيرهم أبو القاسم العطّار مجهول القبر، يزيّنون دكاكينهم بأنواع الإبر والدبابيس — الإبرة والإغنة والسوزن والسندق — ويمرّون نادين: «إبر إبر لخياطة ما انخرق»."
  en: "The ibraji made sewing-needles and sack-needles, and in Ibn al-Ukhuwwa's manual his craft rests on honesty of metal: a trusty man of their own craft is set over them to prevent the mixing of steel needles with soft-iron ones — for soft iron once sharpened can be passed off as Damascus steel — and the makers are sworn to keep each kind distinct. The best are the 'tailoring' needles they call al-Musawwada, sharpened three times and polished, the finest with round eyes; the makers must be compelled to heat the needles and temper them, for steel when heated and tempered hardens while other metal softens; sack-needles may be of steel or soft iron, and are named by the number contained in a ratl. In Evliya's Istanbul procession the needle-makers (Ignehjian) were two hundred men with fifty-five shops under their patron Abul Kassem Alatar, whose tomb is unknown; they adorned their shops with the kinds of needles and pins — the ibrah, ignah, suzen and sundok — and passed crying 'Needles, needles, to sew what is torn.'"
  ur: "ابرجی سلائی اور بورے سیونے کی سوئیاں بنانے والا ہے، اور ابن الاخوہ کی کتاب میں اس کا پیشہ دھات کی راست بازی پر کھڑا ہے: ان ہی میں سے ایک امین نگران مقرر ہو جو فولادی سوئیوں کو نرم لوہے کی سوئیوں میں ملنے سے روکے — کہ نرم لوہا تیز کرنے پر دمشقی فولاد سمجھا جا سکتا ہے — اور بنانے والوں سے قسم لی جائے کہ ہر قسم الگ رکھیں۔ بہترین سوئیاں «درزی» سوئیاں ہیں جو انہیں «مسودہ» کہتے ہیں: تین بار سیدھی کی جائیں اور چمکائی جائیں، اچھی سوئی کا ناکہ گول ہو؛ بنانے والوں پر لازم ہے سوئیاں تپائیں اور آب دیں کہ فولاد تپا کر آب دینے سے سخت ہوتا اور دوسری دھات نرم؛ بورے کی سوئیاں فولاد یا نرم لوہے دونوں کی ہوسکتی ہیں اور رطل میں گنتی کے حساب سے ناموں میں بٹی ہوتی ہیں۔ اولیاء کے استنبول کے جلوس میں سوئی ساز ⁦(ایغنجیان)⁩ دو سو آدمی پچپن دکانیں تھے، پیر ابوالقاسم عطار جس کا مزار معلوم نہیں؛ وہ اپنی دکانیں ہر قسم کی سوئیوں اور پنوں — ابرہ، ایغنہ، سوزن اور سندوق — سے سجاتے اور چلتے پکارتے: «سوئیاں سوئیاں، پھٹی سلنے کو۔»"
  es: "Los ibraji fabricaban agujas de coser y agujas para sacos, y en el manual de Ibn al-Ukhuwwa su oficio se basa en la honestidad del metal: un hombre de confianza de su mismo oficio los supervisa para evitar la mezcla de agujas de acero con las de hierro dulce —pues el hierro dulce una vez afilado puede hacerse pasar por acero de Damasco— y los fabricantes juran mantener cada tipo distinto. Las mejores son las agujas de sastre que llaman al-Musawwada, afiladas tres veces y pulidas, las mejores con ojos redondos; los fabricantes deben ser obligados a calentar las agujas y templarlas, ya que el acero, al calentarse y templarse, se endurece mientras que otros metales se ablandan; las agujas para sacos pueden ser de acero o hierro dulce, y se nombran por el número contenido en un ratl. En la procesión de Estambul de Evliya, los fabricantes de agujas (Ignehjian) eran doscientos hombres con cincuenta y cinco talleres bajo su patrón Abul Kassem Alatar, cuya tumba es desconocida; Adornaban sus tiendas con agujas y alfileres —ibrah, ignah, suzen y sundok— y pasaban gritando: «¡Agujas, agujas, para coser lo que está roto!»."
