  techniques:
    ar: "يفصّل ابن الأخوة ضبط الإبر: إبر الفولاذ تُميَّز عن إبر الحديد الرخو لأن الحديد المسنون يُشتبه بفولاذ دمشق، والصنّاع يُحلَّفون على عدم الخلط؛ والمسَوَّدة الخيّاطية تُسَنّ ثلاث مرات وتُصقَل وأفضلها مستديرة الثقب؛ والإبر تُسخَّن وتُشدَّد إذ الفولاذ بهما يصلُب وسواه يلين؛ وإبر الأكياس من فولاذ أو حديد رخو وتُعَدّ أنواعاً بحسب ما في الرطل منها. وبجوار الإبرجية يذكر إوليا صنّاع «الهِدّة» — صفيحة فولاذ بمئات الثقوب تُجَرّ عبرها أسلاك الذهب والفضة — بيرهم سعد الدين المصري الذي تقلّده سلمان وقبره ببلبيس لا قانَوي الصائغ كما يُظن، وصنّاع الأسلاك ⁦(تِلجيان)⁩ مئتين بأربعين دكاناً يمرّون يجرّون أسلاك الحديد والنحاس بالجَوَالِس ⁦(العجلات)⁩."
    en: "Ibn al-Ukhuwwa details the policing of needles: steel needles are kept distinct from soft-iron ones because sharpened soft iron passes for Damascus steel, and the makers are sworn against mixing; the 'tailoring' musawwada needles are sharpened three times and polished, the best having round eyes; needles must be heated and tempered, since steel hardens under this treatment while other metal softens; sack-needles are of steel or soft iron, sorted into kinds by the count in a ratl. Beside the needle-makers Evliya records the heddeh-smiths — makers of the steel plate pierced with a hundred holes through which gold and silver wire is drawn — whose true patron was Sa'd-ud-din the Egyptian, girded by Selman and buried at Belbeis, and not the Seljuk gold-beater Kanewi as some supposed; and the wire-makers (Teljian), two hundred men in forty shops, who passed drawing iron and brass wires by means of wheels."
    ur: "ابن الاخوہ سوئیوں کی نگرانی تفصیل دیتا ہے: فولادی سوئیاں نرم لوہے کی سوئیوں سے الگ رکھی جائیں کہ سیدھی ہوئی نرم لوہا دمشقی فولاد سمجھی جاتی، اور بنانے والے قسم کھائیں کہ نہ ملائیں؛ درزی «مسودہ» سوئیاں تین بار سیدھی کی جائیں اور چمکائی جائیں، اچھی سوئی کا ناکہ گول؛ سوئیاں تپائی اور آب دی جائیں کہ اس سے فولاد سخت اور دوسری دھات نرم ہوتی ہے؛ بورے کی سوئیاں فولاد یا نرم لوہے کی، رطل کی گنتی سے انواع میں بٹی۔ ابرجیوں کے ساتھ اولیاء «ہِدّہ» سازوں کو لکھتا ہے — فولاد کی تختیاں جن میں سو سوراخ ہوتے اور جن سے سونے چاندی کی تاریں کھینچی جاتی ہیں — جن کا اصل پیر سعد الدین مصری ہے جسے سلمان نے کمر بند پہنائی اور بلبيس میں مدفون ہے، نہ کہ سلجوکوں کا زربفت کاری کرنے والا قانوی جیسا کچھ سمجھتے ہیں؛ اور تار ساز ⁦(تلجیان)⁩ دو سو آدمی چالیس دکانیں جو پہیوں سے لوہے اور پیتل کی تاریں کھینچتے نکلتے۔"
