id: job/calligrapher
class: job
label: { ar: "الخطّاط", en: "Calligrapher (khattat)", ur: "خطاط" }
names:
  - { value: "hattat", kind: latinized, lang: tr }
summary:
  ar: "الخطّاط هو من يكتب الخط العربي كتابةً فنية ويعلّمها، ملتزماً بمقياس النقطة وبأنواع الخط الكبرى وقواعد الشكل والتركيب. ظهر الخط فناً قائماً بذاته في العصر الأموي، وتحددت أساليبه الكبرى في بغداد العباسية، وبلغت صناعته مكانة عالية في إسطنبول العثمانية. وما زالت الممارسة قائمة، وأدرجتها اليونسكو في قائمة التراث غير المادي عام 2021."
  en: "The khattat (calligrapher) writes the Arabic script as an art and teaches it, keeping to the measure of the dot and to the principal hands with their rules of form and composition. The script became an art in its own right under the Umayyads, its main styles were set in Abbasid Baghdad, and its craft reached a high standing in Ottoman Istanbul. The practice is still alive, and UNESCO listed it as intangible heritage in 2021."
  ur: "خطاط وہ شخص ہے جو عربی رسم الخط کو فن کے طور پر لکھتا اور سکھاتا ہے، نقطے کے پیمانے اور بڑے خطوط کے قواعد کی پابندی کرتا ہے۔ یہ فن اموی دور میں مستقل حیثیت اختیار کر گیا، عباسی بغداد میں اس کے بڑے انداز متعین ہوئے، اور عثمانی استنبول میں اس کا مقام بہت بلند ہوا۔ یہ فن آج بھی زندہ ہے، اور یونیسکو نے 2021 میں اسے غیر مادی ثقافتی ورثے میں شامل کیا۔"
