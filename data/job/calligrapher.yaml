era:
  origins: early-caliphate
  first_attested:
    edtf: "0661/0750"
    precision: decade
    status: historical
    note: "The DİA entry names Khalid ibn Abi al-Hayyaj, famous in the Umayyad period, as the earliest figure the sources name as a calligrapher, and gives no year for him. It dates Malik ibn Dinar (d. 131/748) as the first known member of the copyists' trade (verrāq), the trade from which calligraphy grew. The range is the Umayyad period, the widest the entry supports."
    sources: [source/tdv-hat, source/tdv-hattat]
  status_today: living
places:
  - place: place/damascus
    note: "Under the Umayyads the cursive exercise hand (meşk) grew and was copied fast in Damascus, and new hand styles began to arise from it."
    sources: [source/tdv-hat]
  - place: place/baghdad
    note: "Under the Abbasids interest in books grew, above all in Baghdad, where the copyists also sold writing materials. Ibn Muqla (d. 328/940) bound the proportioned hand to fixed rules, and Ibn al-Bawwab (d. 413/1022) changed his path."
    sources: [source/tdv-hat, source/tdv-hattat]
  - place: place/istanbul
    note: "From the late fifteenth century Istanbul was the centre of the art, and the Ottoman court calligraphers worked there."
    sources: [source/tdv-hat, source/tdv-hattat]
regions: [levant-iraq, egypt-nile, maghreb, andalus-europe, anatolia-balkans, persia-central-asia]
organization:
  organized: mixed
training:
  mode: mixed
  certification: "Master-pupil practice (meşk) ended by a written licence (icâzetnâme) that allowed the pupil to sign his own work. In the Ottoman period the licence was given at a ceremony before a jury of calligraphers. From 1914 the School of Calligraphers (Medresetü'l-hattâtîn) issued its own licence."
craft:
  materials: [parchment, paper, leather, ink, gold]
  techniques:
    ar: "يُكتب الخط بقلم القصب والمداد الأسود، وتُقاس الحروف بوحدة النقطة، وهي معيار ثابت لكل نوع، وتُضبط الأسطر بأداة تُسمى المِسطر. وتُنقل الكتابة الكبيرة (الجلي) بثقب الحروف بإبرة على ورقة الأصل ثم نفضها بالفحم أو الطباشير، ويُكتب الذهب مداداً أو ورقاً."
    en: "The hand is written with a reed pen and black soot ink. Letters are measured in units of a diamond-shaped dot, which is a fixed measure for each hand, and lines are set with a ruler called the mistar. Large jali work is transferred by pricking the outline of the letters through a sheet and dusting charcoal or chalk through the holes. Gold is applied as ink or as leaf."
    ur: "خط سرکنڈے کے قلم اور سیاہ روشنائی سے لکھا جاتا ہے۔ حروف نقطے کی اکائی سے ناپے جاتے ہیں، جو ہر خط کا مقررہ پیمانہ ہے، اور سطریں مِسطر نامی آلے سے قائم کی جاتی ہیں۔ جلی خط کو اصل کاغذ پر حروف کے خاکے میں سوئی سے سوراخ کر کے کوئلے یا چاک کے سفوف سے منتقل کیا جاتا ہے۔ سونا روشنائی یا ورق کی صورت میں لگایا جاتا ہے۔"
  initiation:
    ar: "يختم التكوين بإجازة مكتوبة تُعطى في حفل أمام لجنة من الخطاطين. يكتب المرشح نسخة على أسلوب قديم اختاره أستاذه، ويصدّق أعضاء اللجنة الكتابة بعبارة مكتوبة بالعربية. ويُعطى المرشح تخلّصاً يُتفق عليه قبل الحفل، فيُذكر في الإجازة، وتُكتب فيها أيضاً عبارة تُثبت اسم الأستاذ."
    en: "Training closes with a written licence given at a ceremony before a jury of calligraphers. The candidate copies an old master's piece chosen by his teacher, the jury endorses the copy in writing in Arabic, and a pen name agreed beforehand is given during the ceremony and written into the licence, which also names the master."
    ur: "تربیت کا اختتام ایک تحریری اجازت نامے پر ہوتا ہے جو خطاطوں کی جیوری کے سامنے ایک تقریب میں دیا جاتا ہے۔ امیدوار استاد کے منتخب کردہ کسی پرانے استاد کے نمونے کی نقل کرتا ہے، جیوری عربی میں تحریری تصدیق کرتی ہے، اور پہلے سے طے شدہ تخلص تقریب میں دیا جاتا ہے اور اجازت نامے میں لکھا جاتا ہے۔"
  marks:
    ar: "يبدأ توقيع الخطاط بفعل الكتابة مثل «كتبه» أو «نسخه» أو «رقمه»، ويذكر نفسه بصفة متواضعة مع أبيه وأستاذه، ويطلب لنفسه المغفرة. وتُوقَّع التمارين بعبارة «مشقه»، والنسخ المنقولة بعبارة «قلّده»، وكثيراً ما ترك الخطاطون أعمالهم دون توقيع تواضعاً."
    en: "A signature opens with a verb of writing, such as 'he wrote it' (ketebehû), and the maker names himself humbly, often with his father and his master. Practice pieces are signed 'he practised it' (meşekahû) and copies 'he imitated it' (kalledehû). Many masters left work unsigned out of modesty."
    ur: "خطاط کے دستخط کا آغاز لکھنے کے فعل سے ہوتا ہے، جیسے «کتبہ»، اور وہ اپنے آپ کو عاجزی کے ساتھ اپنے والد اور استاد کے ساتھ ذکر کرتا ہے۔ مشق کی تحریر «مشقہ» اور نقل «قلّدہ» سے دستخط کی جاتی ہے۔ کئی استاد عاجزی میں بغیر دستخط کے کام چھوڑ گئے۔"
