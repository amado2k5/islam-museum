places:
  - { place: place/gallipoli, note: "Gelibolu was the kapudan's first seat: every kapudan from Sarıca Pasha (1390) to Barbarossa commanded the fleet as sancak beyi of Gelibolu, and the Cezâyir-i Bahr-i Sefîd eyalet's centre was later moved from Rhodes back to Gelibolu.", sources: [source/tdv-kapudan-pasa] }
  - { place: place/istanbul, note: "The kapudan pasha had his own divanhâne inside the Istanbul dockyard (Tersane), received the sultan's hil'at at the Yalı Köşkü when the fleet sailed and returned, drew the Galata mukâtaa among his revenues, and in winter returned to the capital while his derya beys guarded the coasts.", sources: [source/tdv-kapudan-pasa] }
  - { place: place/algiers, note: "The eyalet created for Barbaros Hayreddin in 1534 was Cezâyir-i Bahr-i Sefîd — the 'Algiers of the White (Aegean) Sea' — whose beylerbeyi was thereafter the kapudan pasha; the eyalet's six sancaks ran from Gelibolu to Eğriboz, Karlı-ili, İnebahtı, Rhodes and Midilli.", sources: [source/tdv-kapudan-pasa] }
