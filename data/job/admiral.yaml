summary:
  ar: "أمير البحر العثماني ⁦(قبودان باشا، ثم قبودان دريا)⁩ قائد الأسطول ومدبّر شؤون البحرية. أولهم على الأرجح سارجة باشا الذي كلفه يلدرم بايزيد سنة 1390 بإنشاء الترسانة والأسطول بصفته بيه گليبولو، وظل القبودانون بمقام صنجق بيه گليبولو حتى عيّن سليمان القانوني خير الدين بربروس سنة 1534 بيلر بيه جزائر بحر سفيد فصار اللقب باشا. كان يجوب البحر كل صيف لحماية السواحل والجزر وتجارة البحر من الكفار والحرامي واللوند، ثم يعود إلى إسطنبول في الشتاء؛ ويشرف على الترسانة ودفاترها، ويعيّن دريا بيلر وقبودان وريّس، وينصب قضاءه حيث نزل. ألغي اللقب سنة 1867 مع تأسيس نظارة البحرية."
  en: "The kapudan pasha — the Italian capitán turned Ottoman, later styled kapudân-ı deryâ — was head and administrator of the Ottoman sea power. The first was probably Sarıca Pasha, whom Bayezid I charged in 1390 with building the dockyard and fleet as sancak beyi of Gelibolu; the kapudans kept the Gelibolu sancak rank until Süleyman made Barbaros Hayreddin beylerbeyi of Cezâyir-i Bahr-i Sefîd in 1534, when the title rose to pasha. He put to sea every year to guard the coasts, islands and sea trade against infidel, harami and levent ships, wintering back in Istanbul; he oversaw the dockyard and its accounts, appointed the derya beys, kapudans and reises, granted the eyalet's timars, and held court wherever he landed. In the sailing-ship age he flew three lanterns and three flags from his başkapudane galleon. The title died with the founding of the Bahriye Nezâreti in 1867."
  ur: "قپودان پاشا — اطالوی capitán کا عثمانی روپ، بعد میں قپودانِ دریا — عثمانی بحری قوت کا سردار اور منتظم تھا۔ پہلا غالباً سارجا پاشا تھا جسے بایزید اول نے 1390 میں گلیبولو کے صنجق بیگی کے طور پر ترسانہ اور بیڑا بنانے کا حکم دیا؛ قپودان 1534 تک گلیبولو صنجق بیگ کے مرتبے پر رہے جب سلیمان نے بربروس خیر الدین کو جزائر بحر سفید کا بیلربیگی بنایا اور لقب پاشا ہوا۔ وہ ہر سال سمندر میں نکل کر ساحل، جزائر اور سمندری تجارت کی حفاظت کرتا اور موسم گزرنے پر استنبول لوٹتا؛ ترسانہ اور اس کے حسابوں کی نگرانی، دریا بیگوں، قپودانوں اور رئیسوں کی تقرری، ایالت کے تیمار دینا اور جہاں اترتا عدالت لگانا اس کے کام تھے۔ جہاز رانی کے زمانے میں اس کے بڑے گیلین باشقپودانے پر تین فانوس اور تین جھنڈے ہوتے۔ 1867 میں بحریہ نظارت کے قیام سے لقب ختم ہوا۔"
  es: "El kapudan pasha —el capitán italiano convertido en otomano, más tarde llamado kapudân-ı deryâ— era el jefe y administrador del poder naval otomano. El primero fue probablemente Sarıca Pasha, a quien Bayezid I encargó en 1390 la construcción del astillero y la flota como sancak beyi de Gelibolu; los kapudans mantuvieron el rango de sancak de Gelibolu hasta que Süleyman nombró a Barbaros Hayreddin beylerbeyi de Cezâyir-i Bahr-i Sefîd en 1534, momento en el que el título ascendió a pasha. Zarpaba cada año para proteger las costas, las islas y el comercio marítimo contra barcos infieles, harami y levent, pasando el invierno en Estambul; supervisaba el astillero y sus cuentas, nombraba a los derya beys, kapudans y reises, otorgaba los timars del eyalet y celebraba corte dondequiera que desembarcara. En la época de los veleros, izaba tres faroles y tres banderas en su galeón başkapudane. El título desapareció con la fundación del Bahriye Nezâreti en 1867."
  fr: "Le kapudan pacha — le capitán italien devenu ottoman, plus tard appelé kapudân-ı deryâ — était à la tête et administrateur de la puissance maritime ottomane. Le premier fut probablement Sarıca Pacha, à qui Bayezid Ier confia en 1390 la construction du chantier naval et de la flotte en tant que sancak beyi de Gelibolu. Les kapudans conservèrent ce rang jusqu'à ce que Soliman le nomme Barbaros Hayreddin beylerbeyi de Cezâyir-i Bahr-i Sefîd en 1534, date à laquelle le titre s'éleva à celui de pacha. Chaque année, il prenait la mer pour protéger les côtes, les îles et le commerce maritime contre les navires infidèles, harami et levent, et hivernait à Istanbul. Il supervisait le chantier naval et ses comptes, nommait les derya beys, les kapudans et les reises, accordait les timars de l'eyalet et tenait cour partout où il débarquait. À l'époque des voiliers, il arborait trois lanternes et trois drapeaux sur son galion başkapudane. Ce titre disparut avec la fondation de la Bahriye Nezâreti en 1867."
