training:
  mode: state-licence
  certification: "The office carried a berat: early kapudans held the Gelibolu sancak beyi rank, then after Barbarossa the beylerbeyi and eventually vezir rank. Lutfi Pasha held the kapudan should be chosen old, corsair-bred and sea-tried, and Kâtib Çelebi advised even a landsman kapudan to consult veteran corsairs on the sea and sea war; in practice the post went by court appointment to seamen and palace men alike."
  duration: "Appointment, not schooling — promotion from sancak beyi to beylerbeyi and vezir."
