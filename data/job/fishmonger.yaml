  techniques:
    ar: "يفصّل الشيزري طريقة القلّالي: تُغسَل السلال والأطباق كل يوم ويُرشّ الملح المطحون فيها كل ليلة بعد الغسل، ومثلها كفاف الميزان لئلا تنبعث منها رائحة كريهة فتتغير رائحة السمك الطازج وطعمه؛ وتُغسَل السمكة غسلاً جيداً بعد شقّها وتنظيفها وكشط جلدها وقشورها ثم يُرشّ عليها الملح والدقيق — لكل عشرة أرطال سمك رطل دقيق — ثم تُجفّف وتُقلَى؛ ولا يُخلَط البائت بالطازج وعلامة الطازج احمرار الخياشيم؛ ويفتقد العريف القِدر كل ساعة في غيبة المحتسب خشية أن يُقلَى بزيت مخلوط بدهن بطن السمكة، وأفضل ما يُقلَى به زيت السيرج، ولا يُقلَى بزيت مستعمل فاحت نتنه ولا تُخرَج من المقلاة حتى تستوي دون إحراق؛ ويضيف ابن الأخوة أن سمك البلاد البعيدة والبائت لا تُكشَط قشوره حتى يُحفَظ بالملح وخاصة الرؤوس والأفواه حيث يبدأ الدود، والفسد يُرمى خارج البلد."
    en: "Al-Shayzari details the fryers' method: the baskets and trays that carry the fish are washed daily and ground salt sprinkled in them every night after washing, and likewise the palm-leaf weighing pans, which otherwise give off an offensive smell that taints the fresh fish's smell and taste; the fish is thoroughly washed after being sliced open, cleaned and scraped of skin and scales, then sprinkled with salt and flour — one ratl of flour to every ten ratls of fish — dried and fried; stale is never mixed with fresh, the sign of the fresh being red gills; when the muhtasib is absent the 'arif checks the pan every hour lest the fish be fried in oil mixed with the fat of the fish's stomach — sesame oil is the best frying oil, used and rancid oil is barred, and the fish is not lifted until properly cooked without burning; Ibn al-Ukhuwwa adds that imported or unsold fish keeps its scales until protected with salt, especially the heads and mouths where maggots appear first, and rotten fish is thrown on the rubbish heaps outside the town."
    ur: "شیزری تلنے والوں کا طریقہ تفصیل سے بتاتا ہے: مچھلی کی ٹوکریاں اور تھالیاں روز دھوئی جائیں اور رات کو دھونے کے بعد ان میں کُٹا نمک چھڑکا جائے، اور اسی طرح کھجور پتوں کے تول کے کانٹے بھی، کہ نہ دھونے سے ان میں بُو پڑتی جو تازہ مچھلی کی خوشبو اور ذائقہ خراب کر دیتی؛ مچھلی کو چیر کر اندر سے صاف اور کھال و کھپچی کھرچ کر اچھی طرح دھویا جائے پھر نمک اور آٹا چھڑکا جائے — دس رطل مچھلی پر ایک رطل آٹا — خشک کر کے تلی جائے؛ باسی تازہ میں نہ ملے، تازہ کی علامت گلپھڑوں کی سرخی؛ محتسب کی غیر حاضری میں عارف ہر گھنٹے کڑاہی جانچے کہ کہیں مچھلی اس کے پیٹ کی چربی ملے تیل میں نہ تلی جائے — تل کا تیل بہترین، باسی بوبو تیل ممنوع — اور پکے بغیر نہ اٹاری جائے اور نہ جلائی جائے؛ ابن الاخوہ مزید کہتا ہے کہ بیرونی یا فروخت نہ ہوئی مچھلی کی کھپچی رہنے دی جائے اور نمک سے بچائی جائے خصوصاً سر اور مونہ جہاں کیڑے پہلے پڑتے ہیں، اور بِگڑی ہوئی شہر کے باہر کچرے پر پھینکی جائے۔"
