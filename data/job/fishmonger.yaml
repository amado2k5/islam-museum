summary:
  ar: "السمّاك بائع السمك لا صيّاده، وحرفته عند أهل الحسبة قائمة على النظافة والطزاجة. يأمر الشيزري وابن الأخوة قلّالي السمك بغسل سلالهم وأطباقهم كل يوم ورشّ الملح فيها كل ليلة، وبغسل كفاف ميزانهم لئلا يفوح منها نتن يفسد رائحة السمك الطازج؛ ولا يُخلَط طازج ببائت، وعلامة الطازج أن منخره وخياشيمه حمر؛ والزيت المقلى فيه زيت العصفر أو السيرج الطري؛ والسمك المشوي يُعدّ بحضور أمين المحتسب؛ وسمك البلاد البعيدة أو البائت في الدكاكين لا تُكشَط قشوره حتى يُحفَظ بالملح وخاصة الرؤوس والأفواه حيث ينشأ الدود أولاً، والفسد منه يُرمى على المزابل خارج البلد. وفي موكب إسطنبول عدّ إوليا السمّاكين ⁦(إكيليكصاتجيان)⁩ ثلاثة آلاف رجل دكاكينهم في غلطة والفنر وجبّة آلت وباب الدقيق والباب الجديد وبير باشا وقاسم باشا وخاص كوي وطوبخانة وبشكتاش، ومرّ الصيادون بدكاكين محمولة على المَحافّ تعرض آلاف الأسماك وعجائب البحر: دلفينات مقيّدة وأفراس بحر وحيتان صيدوها قبل الموكب بأيام محمولة على عربات تجرّها ثمانية وسبعون جاموساً."
  en: "The sammak sold fish rather than catching it, and in the hisba books his trade rests on cleanliness and freshness. Al-Shayzari and Ibn al-Ukhuwwa order the fish-fryers to wash their baskets and trays every day and sprinkle salt in them every night, and to wash their weighing pans, for neglected scales breathe a stench that corrupts the fresh fish's smell; stale fish is never mixed with fresh, the mark of the fresh being the red nose and gills; the frying oil is saffron-seed oil or fresh sesame — for every ten ratls of fish one ratl of flour before frying; baked fish is prepared in the presence of the muhtasib's trusted agent; and fish brought from a distant city or left unsold keeps its scales until it has been made safe with salt, especially the heads and mouths where the worms breed first, the corrupted fish thrown on the dung-hills outside the town. In Evliya's Istanbul procession the fishmongers (Ikiliksatajian) were three thousand men whose shops stood at Galata, Fener, Jubbeh Alt, the Flour-hall, the New-gate, Pir Pasha, Kassim Pasha, Khass-koi, Top-khanah and Beshik-tash; the fishermen marched with their shops borne on litters showing thousands of fish and monsters of the sea — dolphins in chains, sea-horses and whales caught days before, loaded on wagons drawn by seventy-eight buffaloes."
  ur: "سمّاک مچھلی بیچنے والا ہے نہ کہ پکڑنے والا، اور حسبہ کی کتابوں میں اس کا پیشہ صفائی اور تازگی پر کھڑا ہے۔ شیزری اور ابن الاخوہ مچھلی تلنے والوں کو حکم دیتے ہیں کہ ٹوکریاں اور تھالیاں روز دھوئیں اور ہر رات نمک چھڑکیں، اور تول کے کانٹے بھی دھوئیں کہ بے دھونے کانٹوں کی بُو تازہ مچھلی کی خوشبو بگاڑ دے؛ باسی کو تازہ میں نہ ملایا جائے، تازہ کی نشانی سرخ ناک اور گلپھڑے؛ تلنے کا تیل زعفران کے بیج یا تازہ تل کا — ہر دس رطل مچھلی پر ایک رطل آٹا لگا کر تلیں؛ بھنی مچھلی محتسب کے معتمد آدمی کے سامنے تیار ہو؛ دور کے شہر سے آئی یا دکانوں میں رہ گئی مچھلی کی کھپچی نہ اتاری جائے یہاں تک کہ نمک سے محفوظ ہو، خصوصاً سر اور مونہ جہاں کیڑے پہلے پڑتے، اور بِگڑی ہوئی شہر سے باہر کچرے پر ڈالی جائے۔ اولیاء کے استنبول کے جلوس میں مچھلی فروش ⁦(ایکیلیکصاتجیان)⁩ تین ہزار آدمی تھے جن کی دکانیں غلطہ، فنیر، جبہ آلت، ان کپانی، ینی قپی، پیر پاشا، قاسم پاشا، خاص کوئی، طوپ خانہ اور بشک‌طاش میں تھیں؛ ماہیگیر اپنی دکانیں مہافوں پر اٹھائے نکلے جن پر ہزاروں مچھلیاں اور سمندر کے عجائبات — زنجیروں میں ڈولفنیں، سمندری گھوڑے اور وہیل — چند دن پہلے پکڑی ہوئی، اٹھتر بھینسوں کی گاڑیوں پر لدی۔"
  es: "El sammak vendía pescado en lugar de pescarlo, y en los libros de la hisba su oficio se basa en la limpieza y la frescura. Al-Shayzari e Ibn al-Ukhuwwa ordenan a los freidores de pescado que laven sus cestas y bandejas todos los días y les espolvoreen sal todas las noches, y que laven sus ollas de pesaje, pues las básculas descuidadas desprenden un hedor que corrompe el olor del pescado fresco; el pescado rancio nunca se mezcla con el fresco, la señal del fresco es la nariz y las branquias rojas; el aceite para freír es aceite de semillas de azafrán o sésamo fresco: por cada diez ratls de pescado, un ratl de harina antes de freír; el pescado al horno se prepara en presencia del agente de confianza del muhtasib; y el pescado traído de una ciudad lejana o que queda sin vender conserva sus escamas hasta que se haya curado con sal, especialmente las cabezas y las bocas donde se reproducen primero los gusanos, el pescado contaminado se arroja a los montones de estiércol fuera de la ciudad. En la procesión de Evliya en Estambul, los vendedores de pescado (Ikiliksatajian) eran tres mil hombres cuyas tiendas estaban ubicadas en Galata, Fener, Jubbeh Alt, el Salón de la Harina, la Puerta Nueva, Pir Pasha, Kassim Pasha, Khass-koi, Top-khanah y Beshik-tash; los pescadores marchaban con sus tiendas transportadas en literas que mostraban miles de peces y monstruos marinos: delfines encadenados, caballitos de mar y ballenas capturadas días antes, cargados en carros tirados por setenta y ocho búfalos."
  fr: "Le sammak vendait le poisson au lieu de le pêcher, et dans les livres de la hisba, son commerce repose sur la propreté et la fraîcheur. Al-Shayzari et Ibn al-Ukhuwwa ordonnent aux poissonniers de laver quotidiennement leurs paniers et plateaux et de les saler chaque soir, ainsi que de laver leurs bassines de pesée, car des écailles négligées dégagent une odeur nauséabonde qui altère le parfum du poisson frais; le poisson avarié n’est jamais mélangé au poisson frais, ce dernier se reconnaissant dans son nez et ses branchies rouges; l’huile de friture est de l’huile de graines de safran ou de l’huile de sésame frais – pour dix ratls de poisson, un ratl de farine avant la friture; le poisson cuit au four est préparé en présence de l’agent de confiance du muhtasib; et le poisson provenant d’une ville lointaine ou invendu conserve ses écailles jusqu’à ce qu’il soit désinfecté au sel, en particulier la tête et la bouche où les vers se développent en premier; le poisson avarié est jeté sur les tas de fumier à l’extérieur de la ville. Dans le cortège d'Evliya à Istanbul, les poissonniers (Ikiliksatajian) étaient trois mille hommes dont les boutiques se trouvaient à Galata, Fener, Jubbeh Alt, la Halle à la farine, la Porte Neuve, Pir Pasha, Kassim Pasha, Khass-koi, Top-khanah et Beshik-tash; les pêcheurs défilaient avec leurs boutiques portées sur des litières montrant des milliers de poissons et de monstres marins — des dauphins enchaînés, des hippocampes et des baleines pêchés quelques jours auparavant, chargés sur des chariots tirés par soixante-dix-huit buffles."
  tr: "Balıkçı değil, balık satıcısı balık tüccarıdır ve pazar müfettişlerine göre mesleği temizlik ve tazeliğe dayanmaktadır. Şeyzari ve İbn el-Ukhuwwa, balık kızartıcılarına sepetlerini ve kaplarını her gün yıkamalarını, her gece tuz serpmelerini ve pullarını yıkamalarını emreder; böylece taze balığın kokusunu bozacak kötü bir koku oluşmaz; taze balık bayat balıkla karıştırılmamalıdır ve tazeliğin işareti burun deliklerinin ve solungaçlarının kırmızı olmasıdır; kızartıldığı yağ aspir yağı veya taze susam yağı olmalıdır; ızgara balık pazar müfettişinin sekreterinin huzurunda hazırlanmalıdır; uzak ülkelerden gelen balıklar veya dükkanlardaki bayat balıklar, özellikle kurtların ilk ortaya çıktığı baş ve ağız kısımları olmak üzere, tuzla korunana kadar kazınmamalıdır ve bozulmuş balıklar şehrin dışındaki çöplüklere atılmalıdır. İstanbul'daki balıkçı alayında, balıkçı Evliya (Ekliksatçı), Galata, Fener, Cebbe Alt, Bab-e Dakık, Bab-e Yeni, Pir Paşa, Kasım Paşa, Hasköy, Tophane ve Beşiktaş'ta dükkanları bulunan üç bin balıkçı saydı. Balıkçılar, alaydan günler önce yakaladıkları binlerce balığı ve deniz harikalarını sergileyen, yetmiş sekiz manda tarafından çekilen arabalarda taşınan zincirlenmiş yunusları, deniz atlarını ve balinaları sergileyen eyer çantaları taşıyan dükkanların önünden geçtiler."
  id: "Pedagang ikan adalah penjual ikan, bukan nelayan, dan profesinya, menurut inspektur pasar, didasarkan pada kebersihan dan kesegaran. Al-Shayzari dan Ibn al-Ukhuwwa memerintahkan para penggoreng ikan untuk mencuci keranjang dan piring mereka setiap hari dan menaburkan garam di dalamnya setiap malam, dan mencuci sisiknya agar tidak ada bau busuk yang keluar darinya yang akan merusak aroma ikan segar; dan ikan segar tidak boleh dicampur dengan ikan busuk, dan tanda kesegarannya adalah lubang hidung dan insangnya berwarna merah; dan minyak yang digunakan untuk menggorengnya adalah minyak bunga matahari atau minyak wijen segar; dan ikan bakar disiapkan di hadapan sekretaris inspektur pasar; dan ikan dari negeri yang jauh atau ikan busuk di toko-toko tidak boleh dikerok sampai diawetkan dengan garam, terutama kepala dan mulutnya tempat cacing pertama kali muncul, dan ikan busuk dibuang ke tempat pembuangan sampah di luar kota. Dalam prosesi Istanbul, Evliya, pedagang ikan (Ekliksatcian), menghitung tiga ribu orang yang tokonya berada di Galata, Fener, Cebbe Alt, Bab-e Dakık, Bab-e Yeni, Pir Pasha, Kasım Pasha, Haskoy, Tophane, dan Beşiktaş. Para nelayan melewati toko-toko yang dibawa di atas tas pelana yang memamerkan ribuan ikan dan keajaiban laut: lumba-lumba, kuda laut, dan paus yang dirantai yang telah mereka tangkap beberapa hari sebelum prosesi, dibawa di atas gerobak yang ditarik oleh tujuh puluh delapan kerbau."
