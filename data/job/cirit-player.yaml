summary:
  ar: "لاعب الجريد فارس لعبة الحرب المصغّرة: يقف فريقان كل منهما عشرة إلى خمسة عشر فارساً على مئة متر فيرمي أحدهم رمحه غير المسنّن ⁦(الجريد أو الجفغن)⁩ على خصم ثم يهرب، فتدور المباراة هجوماً ومطاردة ساعة ونصفاً في شوطين. أصل اللعبة وسط آسيا، وكانت من أحب الرياضات في كل الدول التركية وفي البلاط العباسي الذي غلب عليه الترك، وعند العثمانيين صارت معلّمة: علّم القصر الجندية ⁦(ركوب الخيل)⁩ فتنظمت رياضةً، ولعبها سلاطين كأحمد الأول ومراد الرابع الذي احتفظ بأربعمئة جواد مدرّب لها، وظلت لعبة الإنكشارية وتدريبهم حتى أُلغوا فخفّ بريقها."
  en: "The cirit player rode in the little war: two teams of ten to fifteen horsemen faced off a hundred metres apart, and the game began when one rider hurled his blunt javelin — the cirit or çevgen, from Arabic cerîd, a stripped palm-stick — at a chosen opponent and galloped away. Born on the Central Asian steppe, cirit was the favourite sport of every Turkish state and of the Turk-influenced Abbasid court; the Ottomans loved it more, taught cündilik (riding) at the palace and made it an organised branch, and sultans like Ahmed I and Murad IV — who kept up to four hundred specially trained horses — played it themselves. It was the janissaries' chief game and drill, and lost its standing when their corps was abolished; in Upper Egypt Lane watched the same gereed played by peasant horsemen at weddings and saint-tomb feasts."
  ur: "جریت باز چھوٹی جنگ کا سوار تھا: دس سے پندرہ سواروں کی دو ٹیمیں سو میٹر کے فاصلے پر کھڑی ہوتیں اور کھیل تب شروع ہوتا جب ایک سوار اپنی بے نوک نیزہ ⁦(جریت یا چیوگان، عربی جرید سے — چھلکا اتارا کھجور کا تنا)⁩ کسی خاص حریف پر پھینک کر بھاگتا۔ وسط ایشیا میں جنم لینے والا یہ کھیل ہر ترک سلطنت اور ترک اثر یافتہ عباسی دربار کا پسندیدہ کھیل تھا؛ عثمانیوں نے محل میں جندلیت ⁦(سواری)⁩ پڑھا کر اسے منظم شعبہ بنایا، اور احمد اول اور مراد رابع جیسے سلاطین خود کھیلتے — مراد رابع نے اس کے لیے چار سو تربیت یافتہ گھوڑے رکھے۔ یہ ینکریوں کی اصل مشق تھی اور اُن کے ختم ہونے کے ساتھ زوال پایا؛ لین نے اوپر مصر میں دیہاتی سواروں کو وہی گرید شادیوں اور بزرگوں کے مزار کے جشنوں پر کھیلتے دیکھا۔"
  es: "El jugador de cirit cabalgaba en la pequeña guerra: dos equipos de diez a quince jinetes se enfrentaban a cien metros de distancia, y el juego comenzaba cuando un jinete lanzaba su jabalina sin filo —el cirit o çevgen, del árabe cerîd, un palo de palma despojado— a un oponente elegido y galopaba lejos. Nacido en la estepa de Asia Central, el cirit era el deporte favorito de todos los estados turcos y de la corte abasí, influenciada por los turcos; los otomanos lo apreciaban aún más, enseñaban cündilik (equitación) en el palacio y lo convirtieron en una rama organizada, y sultanes como Ahmed I y Murad IV —que mantenían hasta cuatrocientos caballos especialmente entrenados— lo practicaban ellos mismos. Era el principal juego y ejercicio de los jenízaros, y perdió su importancia cuando se abolió su cuerpo; en el Alto Egipto, Lane observó el mismo gereed practicado por jinetes campesinos en bodas y fiestas de tumbas de santos."
  fr: "Le joueur de cirit participait à une petite guerre: deux équipes de dix à quinze cavaliers s'affrontaient à une centaine de mètres de distance. La partie commençait lorsqu'un cavalier lançait son javelot émoussé – le cirit ou çevgen, de l'arabe cerîd, un bâtonnet de palmier écorcé – sur un adversaire choisi, puis s'enfuyait au galop. Né dans la steppe d'Asie centrale, le cirit était le sport favori de tous les États turcs et de la cour abbasside, sous influence turque. Les Ottomans l'appréciaient davantage encore, enseignaient l'équitation (cündilik) au palais et en firent une discipline organisée. Des sultans comme Ahmed Ier et Murad IV – qui possédaient jusqu'à quatre cents chevaux spécialement entraînés – y jouaient eux-mêmes. C'était le principal jeu et exercice des janissaires, et il perdit de son importance avec la suppression de leur corps. En Haute-Égypte, Lane observa le même gereed pratiqué par des cavaliers paysans lors de mariages et de fêtes funéraires."
  tr: "\"El-Cerid\" oyunu, minyatür bir savaş oyunudur: Her biri on ila on beş atlıdan oluşan iki takım, yüz metre mesafede durur. Atlılardan biri, bilenmemiş mızrağını (El-Cerid veya El-Cafgan) rakibine fırlatır ve ardından kaçar. Maç, iki yarıdan oluşan ve bir buçuk saat süren, saldırı ve kovalamacadan oluşur. Oyun Orta Asya'da ortaya çıkmış ve tüm Türk devletlerinde ve Türklerin egemen olduğu Abbasi sarayında en sevilen sporlardan biri olmuştur. Osmanlılar arasında bir eğitim aracı haline gelmiştir: Saray, askerlere (at binmeyi) öğretmiş, böylece bir spor olarak organize edilmiştir. I. Ahmed ve IV. Murad gibi sultanlar bu oyunu oynamış, Murad IV ise bu oyun için eğitilmiş dört yüz at beslemiştir. Yeniçerilerin kaldırılmasına kadar onların oyunu ve eğitimi olarak kalmış, daha sonra popülaritesi azalmıştır."
  id: "Permainan \"Al-Jarid\" adalah permainan perang miniatur: dua tim yang masing-masing terdiri dari sepuluh hingga lima belas penunggang kuda berdiri pada jarak seratus meter. Salah satu dari mereka melemparkan tombak tumpulnya (Al-Jarid atau Al-Jafgan) ke lawan dan kemudian melarikan diri. Pertandingan terdiri dari serangan dan pengejaran, berlangsung selama satu setengah jam dalam dua babak. Permainan ini berasal dari Asia Tengah dan merupakan salah satu olahraga yang paling digemari di semua negara Turkik dan di istana Abbasiyah, yang didominasi oleh orang Turki. Di kalangan Ottoman, permainan ini menjadi alat pelatihan: istana melatih para prajurit (menunggang kuda), sehingga permainan ini diorganisir sebagai olahraga. Sultan seperti Ahmed I dan Murad IV memainkannya, yang terakhir memelihara empat ratus kuda yang dilatih untuk permainan ini. Permainan ini tetap menjadi permainan Janissari dan pelatihan mereka hingga mereka dihapuskan, setelah itu popularitasnya menurun."
