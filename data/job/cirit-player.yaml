training:
  mode: apprenticeship
  certification: "No licence; the craft was horsemanship itself — the palace taught cündilik, and both riders and horses required, the entry says, 'a most serious training': the figures were sudden starts and checks, evading the cast by emptying the saddle, picking a javelin from the ground at full tilt, and catching an incoming cirit in the air."
  duration: "Two periods of about an hour and a half made a match; the Ottoman sultans who played it were drilled with their own cirit masters."
