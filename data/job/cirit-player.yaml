summary:
  ar: "لاعب الجريد فارس لعبة الحرب المصغّرة: يقف فريقان كل منهما عشرة إلى خمسة عشر فارساً على مئة متر فيرمي أحدهم رمحه غير المسنّن ⁦(الجريد أو الجفغن)⁩ على خصم ثم يهرب، فتدور المباراة هجوماً ومطاردة ساعة ونصفاً في شوطين. أصل اللعبة وسط آسيا، وكانت من أحب الرياضات في كل الدول التركية وفي البلاط العباسي الذي غلب عليه الترك، وعند العثمانيين صارت معلّمة: علّم القصر الجندية ⁦(ركوب الخيل)⁩ فتنظمت رياضةً، ولعبها سلاطين كأحمد الأول ومراد الرابع الذي احتفظ بأربعمئة جواد مدرّب لها، وظلت لعبة الإنكشارية وتدريبهم حتى أُلغوا فخفّ بريقها."
  en: "The cirit player rode in the little war: two teams of ten to fifteen horsemen faced off a hundred metres apart, and the game began when one rider hurled his blunt javelin — the cirit or çevgen, from Arabic cerîd, a stripped palm-stick — at a chosen opponent and galloped away. Born on the Central Asian steppe, cirit was the favourite sport of every Turkish state and of the Turk-influenced Abbasid court; the Ottomans loved it more, taught cündilik (riding) at the palace and made it an organised branch, and sultans like Ahmed I and Murad IV — who kept up to four hundred specially trained horses — played it themselves. It was the janissaries' chief game and drill, and lost its standing when their corps was abolished; in Upper Egypt Lane watched the same gereed played by peasant horsemen at weddings and saint-tomb feasts."
  ur: "جریت باز چھوٹی جنگ کا سوار تھا: دس سے پندرہ سواروں کی دو ٹیمیں سو میٹر کے فاصلے پر کھڑی ہوتیں اور کھیل تب شروع ہوتا جب ایک سوار اپنی بے نوک نیزہ ⁦(جریت یا چیوگان، عربی جرید سے — چھلکا اتارا کھجور کا تنا)⁩ کسی خاص حریف پر پھینک کر بھاگتا۔ وسط ایشیا میں جنم لینے والا یہ کھیل ہر ترک سلطنت اور ترک اثر یافتہ عباسی دربار کا پسندیدہ کھیل تھا؛ عثمانیوں نے محل میں جندلیت ⁦(سواری)⁩ پڑھا کر اسے منظم شعبہ بنایا، اور احمد اول اور مراد رابع جیسے سلاطین خود کھیلتے — مراد رابع نے اس کے لیے چار سو تربیت یافتہ گھوڑے رکھے۔ یہ ینکریوں کی اصل مشق تھی اور اُن کے ختم ہونے کے ساتھ زوال پایا؛ لین نے اوپر مصر میں دیہاتی سواروں کو وہی گرید شادیوں اور بزرگوں کے مزار کے جشنوں پر کھیلتے دیکھا۔"
