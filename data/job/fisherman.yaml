  certification: "The Istanbul fisherman learned his gear inside the guild and the family — Evliya notes the karatia Greeks holding their exemption by descent, and the fish-raiser trades of the shore passing their licences and standings down. The muhtasib's rules reached the trade through the fish-fryers' chapter: daily washing of baskets and trays, fresh fish never mingled with overnight stock, corrupt fish thrown outside the town."
