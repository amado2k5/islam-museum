summary:
  ar: "الصيّاد يصطاد السمك بالشباك والسنانير والدّلايات. يعدّ إوليا جلبي صيّادي إسطنبول عشر طوائف: صيّادو الصرای ثلاثمائة تحت أمين المصيد الإمبراطوري الذي يُزارع بسبعة ملايين أقچة في السنة وبيرهم يونس، ومراقبو الدّاليان سبعمائة يفرّعون السمك إلى الشبكة من الصواري العالية، وأصحاب الإغرب ثلاثمائة، وصيّادو القراطية والشبك والسَّتشمة والخيط والحراب والقدور والسلال؛ وبعض اليونان المعفّين الذين فتح أجدادهم باب بتري لمحمد الفاتح كانوا يصطادون الدلافين دواءً للسلطان."
  en: "The fisherman takes fish with nets, lines, harpoons and lookout towers. Evliya counts ten fishermen's guilds of Istanbul: the Serai balıkjis, three hundred under the inspector of the Imperial fishery farmed each year for seven million aspers, their patron Jonas; seven hundred dalian watchmen who scare the swordfish into nets from high masts by dropping stones; three hundred men on the great ığrıp net with two hundred dragging each wing; and the karatia, common-net, satshma, line, harpoon, pot and basket fishers. Ten Greek fishermen whose ancestors opened the Petri gate to Mehmed II paid no tithe and were bound to hunt dolphins for the Sultan's medicine."
  ur: "ماہی گیر جال، کنڈی، برچھی اور دیکھ بھال برجوں سے مچھلی پکڑتا ہے۔ اولیاء چلبی استنبول کے ماہی گیروں کی دس جماعتیں گنتا ہے: سرائے کے بلقجی تین سو، شاہی مصیّد کے ناظر کے ماتحت جو ہر سال ستر لاکھ آقچہ میں ٹھیکے پر دی جاتی، پیر یونس؛ سات سو دلیان نگران جو اونچے مستول سے پتھر ڈال کر تلوار مچھلی کو جال میں ڈالتے؛ تین سو اغرب جال کے آدمی جن کے دونوں پہلو دو سو آدمی گھسیٹتے؛ اور قراطیہ، عام جال، ساچمہ، ڈوری، برچھی، ہانڈی اور ٹوکری والے۔ دس یونانی ماہی گیر جن کے باپ دادا نے محمد فاتح کے لیے پتری دروازہ کھولا، عشر نہ دیتے اور سلطان کی دوا کے لیے ڈولفن کا شکار کرتے۔"
  es: "El pescador captura peces con redes, líneas, arpones y torres de vigilancia. Evliya cuenta diez gremios de pescadores de Estambul: los Serai balıkjis, trescientos bajo el inspector de la pesca imperial que cultivaban cada año siete millones de aspers, su patrón Jonas; setecientos vigías dalian que asustan al pez espada hacia las redes desde mástiles altos arrojando piedras; trescientos hombres en la gran red ığrıp con doscientos arrastrando cada ala; y los pescadores karatia, de red común, satshma, de línea, arpón, olla y cesta. Diez pescadores griegos cuyos antepasados abrieron la puerta de Petri a Mehmed II no pagaban el diezmo y estaban obligados a cazar delfines para la medicina del sultán."
  fr: "Le pêcheur capture le poisson à l'aide de filets, de lignes, de harpons et de tours de guet. Evliya recense dix guildes de pêcheurs à Istanbul: les Serai balıkjis, trois cents hommes placés sous l'autorité de l'inspecteur des pêches impériales, dont la production annuelle s'élevait à sept millions d'aspers, leur protecteur; sept cents guetteurs daliens qui, du haut des mâts, effraient les espadons en jetant des pierres dans les filets; trois cents hommes travaillant sur le grand filet ığrıp, deux cents tirant chaque aile; et les pêcheurs utilisant des karatia, des filets communs, des satshma, des lignes, des harpons, des casiers et des paniers. Dix pêcheurs grecs, dont les ancêtres avaient ouvert la porte de Petri à Mehmed II, étaient exemptés de dîme et tenus de chasser les dauphins pour la médecine du sultan."
  tr: "Balıkçı, ağlarla, oltalarla ve takımlarla balık tutar. Evliya Çelebi, İstanbul balıkçılarını on gruba ayırır: yılda yedi milyon akçe ödenen imparatorluk balıkçılık sorumlusu Pirhem Yunus'un emrindeki sarayın üç yüz balıkçısı; yüksek direklerden balıkları ağa ayıran dalyanın yedi yüz bekçisi; üç yüz büyük balıkçı; karatiya, ağ, sahma, misina, mızrak, kap ve sepet balıkçıları; ve ataları Fatih Sultan Mehmed için Bab-i Petri'yi açıp Sultan için ilaç olarak yunus balığı yakalayan bazı istisna Rumlar."
  id: "Nelayan menangkap ikan dengan jaring, kail, dan alat pancing. Evliya Çelebi mengelompokkan nelayan Istanbul menjadi sepuluh kelompok: tiga ratus nelayan istana di bawah pengawas perikanan kekaisaran yang dibayar tujuh juta akçe per tahun dan Pirhem Yunus, tujuh ratus penjaga dalyan yang memisahkan ikan ke dalam jaring dari tiang-tiang tinggi, tiga ratus pemilik yang melanggar aturan, nelayan karatiya, jaring, sachma, tali pancing, tombak, panci, dan keranjang; dan beberapa orang Yunani yang dikecualikan yang nenek moyangnya membuka Bab-i-Petri untuk Mehmed Sang Penakluk yang biasa menangkap lumba-lumba sebagai obat untuk Sultan."
