label: { ar: "قاضي العسكر ⁦(الكازاسكر)⁩", en: "Kazasker (chief military judge)", ur: "قاضی عسکر" }
summary:
  ar: "الكازاسكر هو قاضي العسكر، أي من يتولى الخصومات بين الجند، ومن أعلى قضاة الدولة العثمانية، وعضو الديوان الهمايوني، ومسؤول عن جانب من التعيينات والعزل والتعليم في الطبقة العلمية. وقد عُرف في صدر الإسلام قاضياً للجيش، ثم صار مؤسسة رسمية في الدولة العثمانية، وينقسم منصبه إلى كازاسكر رومللي وكازاسكر الأناضول."
  en: "The kazasker was the chief military judge: he heard disputes among soldiers, sat in the Ottoman imperial council (Divan-i Humayun), and was responsible for part of the appointments, dismissals and training of the scholarly class. The office began as an army judgeship in early Islam and became a formal institution in the Ottoman state, divided between the kazasker of Rumelia and the kazasker of Anatolia."
  ur: "قاضی عسکر فوج کے جھگڑوں کا فیصلہ کرنے والا چیف جج تھا۔ وہ عثمانی دیوانِ ہمایوں کا رکن تھا اور علمی طبقے کے کچھ تقرر، معزولی اور تربیت کا ذمہ دار تھا۔ یہ منصب صدرِ اسلام میں فوجی قاضی کی حیثیت سے شروع ہوا اور عثمانی ریاست میں باقاعدہ ادارہ بنا، جو رومیلی اور اناطولیہ کے قاضی عسکر میں تقسیم ہوا۔"
