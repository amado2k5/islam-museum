places:
  - place: place/istanbul
    note: "The kazaskers sat in the imperial council in Istanbul, and their courts met in their houses. Their registers (rûznâmçe) survive in the Istanbul muftiship's archive, according to the entry."
    sources: [source/tdv-kazasker]
  - place: place/bursa
    note: "Candarli Kara Halil Hayreddin Pasha, the first Ottoman kazasker, had been judge of Bursa before the post, according to the entry."
    sources: [source/tdv-kazasker]
  - place: place/amasya
    note: "During the interregnum Mehmed Celebi set up his seat at Amasya and appointed Candarli Ibrahim as kazasker, which led to two kazaskers for a time until 816 AH (1413 CE), according to the entry."
    sources: [source/tdv-kazasker]
  - place: place/konya
    note: "In the Anatolian Seljuk period the judges of Konya held the offices of chief judge and kazasker together, according to the entry."
    sources: [source/tdv-kazasker]
