  techniques:
    ar: "الصنعة عند إوليا تقطير وحفظ وعرض: ماء الورد وماء اللبان والعنبر والياسمين تُملأ آنية النحاس والجُلّابدانات وتُزيَّن بها الدكاكين، ثم تصبّ غير مقيّدة على الناس في الموكب؛ والشربت والجُلّاب والسهلب الممزوج بماء الورد تُباع بلا دكان، تُحمَل صهاريجها على النار وكؤوسها الصينية والكوتاهية على الأطباق المثقوبة. وعند ابن الأخوة امتحان السلعة: غشّ ماء الورد الدمشقي يُعرَف باختباراته، والشراب يُغلَّى ويُمزج بمدقّات مستديرة."
    en: "The craft in Evliya is distilling, keeping and display: rose-water and the waters of frankincense, amber and jasmine fill the bronze vessels and the gulabdan vases that dress the shops, then pour unmeasured upon the crowd in the procession; sherbet, julep and rose-water-seasoned salep are sold without shops, their small cauldrons carried on the fire and their china and Kutahia cups on the pierced round trays. In Ibn al-Ukhuwwa the craft is the test of the wares: the adulteration of Damascene rose-water is known by its proofs, and the syrups are boiled and mixed with round pestles."
    ur: "اولیاء میں پیشہ عرق کشی، ذخیرہ اور نمائش ہے: گلاب اور لوبان، عنبر اور چنبیلی کے عرق کانسی کے برتنوں اور گلابدان میں بھرے دکانیں سجاتے، پھر جلوس میں بے ناپ لوگوں پر گرائے جاتے؛ شربت، گلاب اور گلاب ملا سہلب بغیر دکان بکتا، چھوٹی دیگچیاں آگ پر اٹھائی اور چینی اور کوتاہیہ کے پیالے سوراخ دار گول تختوں پر۔ ابن الاخوہ میں پیشہ مال کی جانچ ہے: دمشقی گلاب کی ملاوٹ اس کے امتحانوں سے پہچانی جاتی، اور شربت ابال کر گول دستوں سے ملایا جاتا۔"
