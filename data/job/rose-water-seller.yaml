summary:
  ar: "بائع ماء الورد تاجر المياه المقطّرة من الورد واللبان والعنبر والياسمين. في موكب إسطنبول عدّ إوليا باعة ماء الورد ⁦(گُلابجيان)⁩ سبعين رجلاً بأحد وأربعين دكاناً، وتبيع نساء أدرنة ماء الورد في آنية نحاسية كبيرة أمام البزستان القديم، وبيرهم عطر الدين الهندي المدفون ببلدة دِيو في الهند، كان يهدي النبي أنواع الطيب فقلّده عليّ وجعله بيراً، وهم يمرّون يصبّون ماء الورد وماء اللبان على المتفرّجين صبّاً. ومنهم باعة الشربات بلا دكاكين ثلاثمئة يبيعون الشربات والجُلّاب، وباعة الثعلب ⁦(سهلب)⁩ ينادون «خذوا الثعلب الممزوج بماء الورد، راحة للروح وصحّة للبدن»، وبير تجّار الشربات الحارّة والبلودة والمحلّبي والثعلب والجُلّاب هو مُقَبِّل زِرّين الذي قلّده حمزة وكان يقصّر له أيام الشتاء الطويلة بطبخ الشربات الحارّ فقُطِّع معه يوم أُحد ودُفن قربه خارج المدينة شمالاً. ويحذّر ابن الأخوة من غشّ ماء الورد الدمشقي ويفصّل امتحانه، ويذكر شراب الورد والزنبق والجُلّاب في باب أصحاب الشراب."
  en: "The gulabji traded in distilled waters of rose, frankincense, amber and jasmine. In Evliya's Istanbul procession the rose-water merchants (Gulabjian) were seventy men in forty-one shops, and women of Adrianople sell rose-water in large bronze vessels before the old Beze-stan; their patron is Atr-ud-din the Indian, buried at the town of Div in India, who used to present the Prophet with every kind of scent and was girded and made a pir by Ali; they pass pouring rose-water and frankincense-water in large streams on the spectators. Of the same family are the sherbet-sellers, three hundred men with no shops, who sell sherbet and gulab; the salep-merchants who cry 'Take salep seasoned with rose-water, rest for the soul, health for the body'; and the patron of the warm-sherbet, jelly, cream, salep and julep merchants is Mokabbil Zerrin, girded by Hamza, for whom he shortened the long winter days cooking warm sherbet, and who was cut to pieces with Hamza at the battle of Ohod and buried near him north of Medina. Ibn al-Ukhuwwa warns against the adulteration of Damascene rose-water and gives its tests, and names the syrups of roses and lilies and the julep among the syrup-makers' wares."
  ur: "گلاب جی گلاب، لوبان، عنبر اور چنبیلی کے عرقیات کا تاجر ہے۔ اولیاء کے استنبول کے جلوس میں گلاب فروش ⁦(گلابجیان)⁩ ستر آدمی ایک تالیس دکانیں تھے، اور ادرنہ کی عورتیں پرانے بزستان کے سامنے بڑے کانسی کے برتنوں میں گلاب بیچتی ہیں؛ ان کا پیر عطرالدین ہندی ہے جو ہندوستان کے شہر دیو میں مدفون، نبی کو ہر قسم کی خوشبو پیش کرتا اور علی نے اسے کمر بند پہنا کر پیر بنایا؛ وہ چلتے تماشائیوں پر گلاب اور لوبان کا پانی نہر کی طرح گراتے۔ اسی خاندان سے ہیں شربت فروش تین سو بغیر دکانوں کے جو شربت اور گلاب بیچتے؛ سہلب فروش جو پکارتے «سہلب لو گلاب ملا، روح کو راحت، تن کو صحت»؛ اور گرم شربت، جیلی، محلبی، سہلب اور گلاب فروشوں کا پیر مقبّل زرّین ہے جسے حمزہ نے کمر بند پہنائی، جس کے لیے وہ لمبی سردی کے دن گرم شربت پکا کر گھٹاتا اور احد کے دن حمزہ کے ساتھ ٹکڑے ٹکڑے ہوا اور مدینہ کے باہر شمال میں اس کے پاس دفن ہے۔ ابن الاخوہ دمشقی گلاب کے ملاوٹ سے خبردار کرتا اور اس کی جانچ بتاتا، اور شربت سازوں کی اشیاء میں گلاب اور زنبق کے شربت اور جلاب کا ذکر کرتا ہے۔"
  es: "Los gulabji comerciaban con aguas destiladas de rosa, incienso, ámbar y jazmín. En la procesión de Evliya en Estambul, los comerciantes de agua de rosas (Gulabjian) eran setenta hombres en cuarenta y un tiendas, y las mujeres de Adrianópolis venden agua de rosas en grandes recipientes de bronce frente al antiguo Beze-stan; su patrón es Atr-ud-din el indio, enterrado en la ciudad de Div en la India, quien solía presentar al Profeta todo tipo de perfumes y fue ceñido y convertido en pir por Ali; pasan vertiendo agua de rosas y agua de incienso en grandes chorros sobre los espectadores. De la misma familia son los vendedores de sorbete, trescientos hombres sin tiendas, que venden sorbete y gulab; los comerciantes de salep que gritan 'Toma salep sazonado con agua de rosas, descanso para el alma, salud para el cuerpo'; Y el patrón de los comerciantes de sorbete caliente, gelatina, crema, salep y julep es Mokabbil Zerrin, ceñido por Hamza, para quien acortó los largos días de invierno cocinando sorbete caliente, y que fue descuartizado junto con Hamza en la batalla de Ohod y enterrado cerca de él al norte de Medina. Ibn al-Ukhuwwa advierte contra la adulteración del agua de rosas de Damasco y describe sus pruebas, y menciona los jarabes de rosas y lirios y el julep entre los productos de los fabricantes de jarabes."
  fr: "Les gulabji faisaient commerce d'eaux distillées de rose, d'encens, d'ambre et de jasmin. Lors du cortège d'Evliya à Istanbul, on comptait soixante-dix marchands d'eau de rose (Gulabjian) dans quarante et une boutiques. À Andrinople, devant le vieux Beze-stan, les femmes vendaient de l'eau de rose dans de grands récipients en bronze. Leur protecteur était Atr-ud-din l'Indien, enterré à Div, en Inde, qui offrait au Prophète toutes sortes de parfums et fut ceint et transformé en pir par Ali. Ils défilaient en déversant de larges flots d'eau de rose et d'eau d'encens sur les spectateurs. De la même famille appartenaient les vendeurs de sherbet, trois cents hommes sans boutique, qui vendaient du sherbet et du gulab; les marchands de salep criaient: « Prenez du salep parfumé à l'eau de rose, repos pour l'âme, santé pour le corps ! » Le protecteur des marchands de sorbet chaud, de gelée, de crème, de salep et de julep est Mokabbil Zerrin, protégé par Hamza, pour qui il abrégeait les longues journées d'hiver en préparant du sorbet chaud. Mokabbil Zerrin fut tué avec Hamza à la bataille d'Ohod et enterré près de lui, au nord de Médine. Ibn al-Ukhuwwa met en garde contre la falsification de l'eau de rose de Damas, en décrit les tests et cite les sirops de rose et de lys ainsi que le julep parmi les produits des fabricants de sirops."
