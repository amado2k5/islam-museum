  techniques:
    ar: "آلات الكحّال كما في كتابي الحسبة: شنابير لإزالة الصَّبَل والظفرة عن بياض العين، وكاشطة لإزالة القشور عن الأجفان من داخلها، ومباضع للفصد، وعلبة لمكاحل الكحل. ومن غشّ المتجوّلين: شياف أساسه نشا وصمغ يُصبغ بالزنجفر أحمر وبالكركم والنيلة أخضر وبعصارة قرن الأكاسيا أسود وبالزعفران أصفر، وشيافات من الخشخاش القرني بعجينة الصمغ، وكحل من أحجار الميروبالان المحروقة والفلفل."
    en: "The oculist's kit in the hisba books: hooks for removing the sabal film and the pterygium from the white of the eye, a scour for lifting the rust-like scabs inside the lids, lancets for bleeding, and a case of kuhl-pencils. The itinerants' frauds: salves on a base of starch and gum dyed red with vermilion, green with turmeric and indigo, black with the juice of acacia-pods and yellow with saffron; pastes of the horned poppy; and kuhls of burnt myrobalan stones with pepper."
    ur: "حسبہ کی کتابوں میں کحّال کے اوزار: آنکھ کی سفیدی سے صبل کا پردہ اور ناخونہ اُتارنے کی آؤڑیں، پلکوں کے اندر کی زنگ نما خربچ اترنے کا آلہ، فصد کے نشر اور سرمہ دان۔ راہ چلتوں کے دھوکھے: نشاستہ اور گوند کی بنیاد کے انجن جنھیں زنجفر سے سرخ، ہلدی و نیل سے سبز، ببول کی پھلی کے رس سے سیاہ اور زعفران سے پیلا رنگتے ہیں؛ سیرے والے خشخاش کے گوند ملے انجن؛ اور جلے ہرے کے گولیوں اور مرچ کے سرمے۔"
