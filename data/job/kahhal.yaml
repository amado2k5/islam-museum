summary:
  ar: "الكحّال هو طبيب العيون: يعالج الأغشية والظفرة والرمد، ويركّب الكحل والشيافات. يأمر ابن الأخوة والشيزري المحتسب أن يمتحن الكحّالين في كتاب حنين بن إسحاق «المقالات العشر في العين»: فمن عرف طبقات العين السبع وأخلاطها الثلاثة وأمراضها الثلاثة وتشعّباتها، وعرف تركيب الأكحال ومزج الأدوية، أُذن له في علاج العيون؛ وعليه ألا يُهمل آلات صناعته من شنابير لقلع الصَّبَل والظفرة، ومباضع للفصد، وعلبة مكاحل. ويحذّر الكتابان من كحّالي الطريق الذين لا دين لهم ولا تجربة: يصنعون أكحالاً من نشا وصمغ يصبغونها بالزنجفر والكركم والنيلة وقرن الأكاسيا والزعفران، ومن الخشخاش القرني والميروبالان المحروق مع الفلفل. وفي إسطنبول إوليا ثمانون كحّالاً في أربعين دكاناً، يعرضون في الموكب أدهانهم ومكاحلهم وآلاتهم تحت راية الكحّال باشي خلف الحكيم باشي."
  en: "The kahhal is the eye-doctor: he treats films, pterygia and ophthalmia, and compounds the kuhls and collyria. Ibn al-Ukhuwwa and al-Shayzari order the muhtasib to examine the oculists on Hunayn ibn Ishaq's 'Ten Treatises on the Eye': whoever knows the eye's seven layers, its three humours, the three diseases and their ramifications, and how to compound the kuhls and mix the drugs, is licensed to treat eyes; he must not neglect the instruments of his craft — hooks for removing sabal and pterygium, a scour for scabs, lancets for bleeding, and a case of kuhl-pencils. Both manuals warn against the oculists of the roads, who have neither honesty nor experience: they make salves of starch and gum dyed red with vermilion, green with turmeric and indigo, black with acacia-pods and yellow with saffron, or pastes of the horned poppy and of burnt myrobalan stones with pepper. In Evliya's Istanbul eighty oculists keep forty shops and show their unguents, collyria and instruments on litters in the procession, under the kohhal-bashı behind the hekimbaşı."
  ur: "کحّال آنکھوں کا معالج ہے: پردے، ناخونے اور رمد کا علاج کرتا، سرمے اور انجن ترکیب دیتا ہے۔ ابن الاخوہ اور الشیزری محتسب کو حکم دیتے ہیں کہ کحّالوں کا امتحان حنین بن اسحاق کی «عین کے دس مقالات» پر لے: جو آنکھ کی سات تہیں، تین اخلاط، تین بیماریاں اور ان کی شاخیں جانتا ہو اور سرمے ترکیب دینا اور ادویہ ملانا آتا ہو، اسے علاج کی اجازت ملے؛ اور اسے اپنے پیشے کے اوزار — صبل اور ناخونہ اُتارنے کی آؤڑیں، خربچ اترنے کا آلہ، فصد کے نشر اور سرما دان — فراموش نہ کرنے چاہئیں۔ دونوں کتابیں راہ چلتے کحّالوں سے خبردار کرتی ہیں کہ نہ ان میں دیانت ہے نہ تجربہ: نشاستے اور گوند کے سرمے بناتے اور زنجفر سے سرخ، ہلدی و نیل سے سبز، ببول کی پھلیوں سے سیاہ اور زعفران سے پیلے رنگتے، یا سیرے والے خشخاش اور جلے ہرے کے گولیوں اور مرچ کے انجن بناتے ہیں۔ اولیاء چلبی کے استنبول میں اسی کحّال چالیس دکانوں میں ہیں اور جلوس میں سواریاں پر اپنے انجن، سرمے اور اوزار دکھاتے، کحّال باشی کے تحت حکیم باشی کے پیچھے چلتے ہیں۔"
