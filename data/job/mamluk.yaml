training:
  mode: state-licence
  certification: "The candidate was bought young — preferably a steppe youth of courage, strength and build — through the dâr al-raqîq markets and brought to Egypt at the treasury's expense; in the tābaka school of the Cairo Citadel he learned Sunni doctrine and then arms under strict seclusion, and on completing the course he was manumitted by his purchaser and enrolled in the guard. A sultan's death returned the untrained küttâbiye to the bayt al-māl for the next sultan to buy again, with qadis present."
  duration: "The full tābaka course; boys bought unfinished (küttâbiye/kitâbiye) might pass between sultans before ever earning freedom."
