  - { place: place/cairo-citadel, note: "The mamluk bought for the sultan entered the tābaka barracks-school of the Cairo Citadel, where he was taught Sunni religion then military science under a discipline that forbade him even to converse with an emir; on finishing he was manumitted, given his equipment and joined the khāssa guard.", sources: [source/tdv-memluk] }
  - { place: place/baghdad, note: "The great slave markets where the dealers first offered their mamluks to the Islamic world were the dâr al-raqîq of Fustat and Baghdad; the slave-traders, exempted from the taxes on other merchants, formed the link between the steppe homeland and the Mamluk state.", sources: [source/tdv-memluk] }
  - { place: place/delhi, note: "The mamluks founded a dynasty of their own name in India as well — the Delhi sultanate's slave dynasty held power for close on a century.", sources: [source/tdv-memluk] }
