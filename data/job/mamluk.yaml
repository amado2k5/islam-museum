summary:
  ar: "المملوك جنديٌّ مأجور يُختار من الأسرى والعبيد فيُربَّى ويُدرَّب ثم يُلحق بحرس الحاكم حتى صار المماليك طبقة أرستقراطية تحكم بالسلطة. أخذت الدول الإسلامية بهم منذ الأمويين، وكثُر نظامهم تحت المعتصم الذي جمع ثلاثين ألف مملوك تركي وبنى لهم سامرّاء، ثم عمّت الطولونيين والإخشيديين والفاطميين والأيوبيين حتى أقام المماليك دولتهم في مصر 1250–1517 وبقيت نفوذهم إلى مذبحة القلعة 1811. كان التاجر ⁦(الحجة)⁩ يشتري الغلام التركي أو الشركسي الفتّاك في دار الرقيق بفستاط وبغداد، فيدخل طبقة قلعة القاهرة يتعلم الدين والفروسية في انضباط صارم، ثم يُعتق ويخدم معتقه ⁦(المولى)⁩ وإخوته الخشداشية؛ ونسل المملوك لا يرث المنزلة فهي أرستقراطية جيل واحد."
  en: "The mamluk was a paid soldier chosen from captives and slaves, specially raised and trained, then taken into the ruler's guard — until the mamluks became an aristocratic class that held power itself. Islamic states took to them from the Umayyads; the system swelled under al-Mu'tasim, who gathered thirty thousand Turkish mamluks and built Samarra for them, then ran through the Tulunids, Ikhshidids, Fatimids and Ayyubids until the mamluks raised their own sultanate in Egypt, 1250–1517, keeping influence to the citadel massacre of 1811. The slave-dealer (the 'hoja') bought the hardy Turkish or Circassian youth at the dâr al-raqîq markets of Fustat and Baghdad; the boy entered the tābaka school of the Cairo Citadel, learned religion and horsemanship under a discipline that barred him even from speaking with an emir, then was freed and served his manumitter (mawlā, ustādh) and his barrack-mates of the huşdaşiye. A mamluk's son could not be a mamluk: the rank was an aristocracy of one generation."
  ur: "مملوک وہ تنخواہ دار سپاہی تھا جو قیدیوں اور غلاموں میں سے چنا، خاص تربیت پا کر حکمران کے حفاظتی دستے میں داخل ہوتا — یہاں تک کہ ممالیک خود اقتدار سنبھالنے والی اشرافیہ بن گئے۔ اسلامی ریاستیں انہیں اموی دور سے اپناتی رہیں؛ معتصم نے تیس ہزار ترک ممالیک جمع کیے اور ان کے لیے سامرا بسایا، پھر طولونی، اخشیدی، فاطمی اور ایوبی ہوتے ہوئے ممالیک نے 1250–1517 مصر میں اپنی سلطنت قائم کی اور 1811 قلعہ قتل عام تک اثر رکھا۔ غلام تاجر ⁦(حجّہ)⁩ فسطاط و بغداد کے دار الرقیق بازاروں سے دلاور ترک یا چرکسی نوجوان خریدتا؛ لڑکا قلعہ قاہرہ کے طبقہ مدرسے میں دین اور سواری سخت نظم میں سیکھتا، پھر آزاد ہو کر اپنے معتق ⁦(مولیٰ، استاذ)⁩ اور خشداشیہ ساتھیوں کی خدمت کرتا۔ مملوک کا بیٹا مملوک نہ ہوتا: مرتبت ایک ہی نسل کی اشرافیہ تھی۔"
  es: "El mameluco era un soldado asalariado elegido entre cautivos y esclavos, especialmente criado y entrenado, y luego incorporado a la guardia del gobernante, hasta que los mamelucos se convirtieron en una clase aristocrática que detentaba el poder por sí misma. Los estados islámicos los adoptaron de los omeyas; el sistema creció bajo al-Mu'tasim, quien reunió a treinta mil mamelucos turcos y construyó Samarra para ellos, luego pasó por los tuluníes, los ikhshidíes, los fatimíes y los ayubíes hasta que los mamelucos establecieron su propio sultanato en Egipto, 1250-1517, manteniendo la influencia hasta la masacre de la ciudadela de 1811. El traficante de esclavos (el 'hoja') compraba a los jóvenes turcos o circasianos robustos en los mercados dâr al-raqîq de Fustat y Bagdad; El muchacho ingresó en la escuela tābaka de la Ciudadela de El Cairo, aprendió religión y equitación bajo una disciplina que le prohibía incluso hablar con un emir, luego fue liberado y sirvió a su manumitter (mawlā, ustādh) y a sus compañeros de barracón del huşdaşiye. El hijo de un mameluco no podía ser mameluco: ese rango era una aristocracia de una sola generación."
