training:
  mode: ijaza-chain
  certification: "The science passed teacher to student in tabaqat: the Basra chain runs Abu al-Aswad, then the 'second al-Khalil' generation of Nasr ibn Asim's peers, then Yunus and Sibawayhi's generation, down to al-Mubarrad's seventh tabaqa. Grammar entered the madrasa syllabi in the fifth century AH, when the heritage became set course-books — the epitomes and the sharh tradition on Sibawayhi's Kitab were themselves written because the masterwork was too hard even for scholars."
