summary:
  ar: "النحوي صاحب علم النحو: قواعد تركيب الجملة العربية وحركات الإعراب. وُلدت الصنعة في البصرة حين وضع أبو الأسود الدؤلي ⁦(ت ٦٩هـ)⁩ أسسها بإرشاد علي — بعد أن فشا اللحن في القراءة والكلام — ثم ربّتها طبقات مدرسة البصرة على يد الخليل وسيبويه صاحب «الكتاب»، وقابلتها مدرسة الكوفة بالرؤاسي والكسائي والفرّاء، وجمعت مدرسة بغداد بينهما؛ ودرّس النحويون في الحلقات ثم جعلت المدارس كتبهم من «المفصّل» للزمخشري إلى «الألفية» لابن مالك متوناً للدروس، ولا يزال النحو مادةً في كليات العربية والإلهيات."
  en: "The nahwi holds the science of nahiv: the rules of Arabic sentence structure and the i'rab endings. The craft was born at Basra when Abu al-Aswad al-Du'ali (d. 69 AH) laid its foundations on Ali's guidance — after errors of lahn spread in recitation and speech — and the generations of the Basra school reared it through al-Khalil and Sibawayhi of the Kitab, rivalled by the Kufa school of al-Ru'asi, al-Kisa'i and al-Farra, then merged in the Baghdad school. The grammarians taught in study circles, then the madrasas made their books — al-Zamakhshari's Mufassal to Ibn Malik's Alfiyya — into set texts, and nahiv remains a subject in the Arabic and theology faculties."
  ur: "نحوی علم نحو کا حامل ہے: عربی جملے کے ترکیبی قواعد اور اعراب کی حرکات۔ یہ پیشہ بصرہ میں پیدا ہوا جب ابوالاسود دؤلی ⁦(وفات ٦٩ھ)⁩ نے علی کی رہنمائی سے اس کی بنیاد رکھی — قراءت اور کلام میں لحن کے پھیلنے کے بعد — اور بصرہ مکتب کی طبقات نے خلیل اور صاحب کتاب العین سیبویہ کے ذریعے اسے پروان چڑھایا، جس کے مدمقابل کوفہ مکتب رؤاسی، کسائی اور فراء کے ساتھ تھا، پھر بغداد مکتب نے دونوں کو ملا لیا۔ نحوی حلقوں میں پڑھاتے رہے، پھر مدارس نے ان کی کتابوں — زمخشری کے «مفصل» سے ابن مالک کی «الفیہ» تک — کو نصابی متن بنا لیا، اور نحو آج بھی عربی و الہیات کی دانشگاہوں کا مضمون ہے۔"
