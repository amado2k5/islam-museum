  - { place: place/basra, note: "Grammar was founded at Basra by Abu al-Aswad al-Du'ali (d. 69/688); because Iraq-Basra was where the corruption of the tongue ran deepest, the language and grammar work was done there by the Basra school — al-Khalil, Yunus ibn Habib, Sibawayhi and al-Akhfash al-Awsat among them.", sources: [source/tdv-nahiv] }
  - { place: place/kufa, note: "The Kufa school of grammar was founded by al-Ru'asi and his uncle Mu'adh ibn Muslim al-Harra, and its scholars — al-Kisa'i and al-Farra among them — wrote the school's first grammar books.", sources: [source/tdv-nahiv] }
  - { place: place/baghdad, note: "Scholars who merged the two schools' views founded the Baghdad school in the second half of the third century AH, which dispersed by the middle of the fourth.", sources: [source/tdv-nahiv] }
