summary:
  ar: "المصوّر أو النقّاش هو من يرسم منمنمات المخطوطات ويزيّن صفحاتها بالألوان والذهب. يذكر أرنولد أن المصوّر كان يضيف لقب «مذهّب» ⁦(مضهّب، عامل الذهب)⁩ إلى اسمه فخراً، وأن كبار المصوّرين كانوا حدثاً ديوانياً يتناقله المؤرخون: بهزاداً صاحب هراة الذي ولّاه شاه إسماعيل سنة 1522 إدارة الخزانة السلطانية على النسّاخ والمصوّرين والمذهّبين ورسّامي الهوامش وخالطي الذهب وضاربيه وغاسلي اللازورد، وتلميذه درويش محمد النقّاش الذي بدأ صانع ألوان زيتية قبل أن يلحق به. وفي موكب إسطنبول مرّت طائفة النقّاشين بألف رجل باعتراف إوليا، أما مصوّرو الصور ⁦(نقّاشان مصوّران)⁩ فعشرون رجلاً بأربع دكاكين لا بير شرعي لهم لأن تصوير الصور محظور في الشريعة عندهم."
  en: "The musawwir or naqqash painted the miniatures of manuscripts and decorated their pages in colour and gold. Arnold records that a painter would add the appellation mudhahhib, the worker in gold, to his name as a claim to respect, and that the great painters were court events whom the historians record: Bihzad of Herat, whom Shah Isma'il in 1522 made director of the royal library over the copyists, painters, gilders, margin-drawers, gold mixers, gold-beaters and washers of lapis lazuli; and his pupil Darwish Muhammad Naqqash, who had been a maker of oil-colours before attaching himself to the master. In Evliya's Istanbul procession the painters' guild (Nakkashan) passes a thousand strong, while the portrait-painters (Nakkashan Musaviran) are twenty men with four shops and have no legal patron because, Evliya says, portrait-painting is prohibited by their law."
  ur: "مصوّر یا نقّاش مخطوطوں کی منی ایچر مرتب کرتا اور صفحات رنگ و زر سے آراستہ کرتا تھا۔ آرنلڈ لکھتا ہے کہ مصوّر اپنے نام کے ساتھ «مذهّب» ⁦(زر کار)⁩ کا لقب فخر سے جوڑتا تھا، اور بڑے مصوّر درباری واقعہ ہوتے جنہیں مؤرخ درج کرتے تھے: ہرات کا بہزاد جسے شاہ اسماعیل نے ۱۵۲۲ء میں شاہی خزانۂ کتب کا ناظم بنایا، نسخہ نویسوں، مصوّروں، مذهّبوں، حاشیہ رساموں، زر ملانے والوں، زر کوٹنے والوں اور لاجورد دھونے والوں پر؛ اور اس کا شاگرد درویش محمد نقّاش جو پہلے روغنی رنگ ساز تھا پھر استاد سے جُڑا۔ اولیہ کے استنبول جلوس میں نقّاشوں کی انجمن ہزار آدمی کے ساتھ گزرتی ہے، جب کہ مصوّروں ⁦(نقّاشان مصوّران)⁩ کی تعداد بیس آدمی اور چار دکانیں ہیں، جن کا کوئی شرعی بزرگ نہیں کیونکہ ان کے قانون میں صورت سازی منع ہے۔"
  es: "El musawwir o naqqash pintaba las miniaturas de los manuscritos y decoraba sus páginas con color y oro. Arnold registra que un pintor añadía el apelativo mudhahhib, el trabajador del oro, a su nombre como muestra de respeto, y que los grandes pintores eran figuras de la corte que los historiadores registran: Bihzad de Herat, a quien el Shah Isma'il nombró en 1522 director de la biblioteca real, supervisando a los copistas, pintores, doradores, dibujantes de márgenes, mezcladores de oro, batidores de oro y lavadores de lapislázuli; y su discípulo Darwish Muhammad Naqqash, quien había sido fabricante de pinturas al óleo antes de unirse al maestro. En la procesión de Estambul de Evliya, el gremio de pintores (Nakkashan) cuenta con mil miembros, mientras que los retratistas (Nakkashan Musaviran) son veinte hombres con cuatro talleres y no tienen un mecenas legal porque, según Evliya, la pintura de retratos está prohibida por su ley."
