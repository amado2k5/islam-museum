  techniques:
    ar: "يقسم أرنولد صناعة التصوير إلى مراتب ورشة متخصصة: الناسخ ثم المذهّب عامل الذهب الذي يضيف المصوّرون اسمه إلى أسمائهم فخراً، ورسّام المقدمة ⁦(الفرّاش عند بلوكه في الألواح المذهّبة)⁩ ورسّام الوجوه ⁦(جهره‌نما)⁩ في الورشة المغولية حيث يشترك أكثر من مصوّر في الصورة الواحدة، وخالطو الذهب وضاربوه وغاسلو اللازورد في خزانة شاه إسماعيل بإدارة بهزاد. ويروي غرومان عن أقدم المنمنمات العربية التي نجت من الكوارث، وأرنولد عن ورشة هراة: تلميذ بهزاد درويش محمد النقّاش الذي كان صانع ألوان زيتية ثم لحق به حتى ائتمنه على عمله. وفي إسطنبول ألف نقّاش لهم أقبية في علوية خانة الأرسلان ومئة دكان أخرى، وعربات الموكب تحمل أعمال أشهر المصوّرين، ولا بير شرعي لمصوّري الصور لأن تصوير الصور محظور عندهم، وإن كانوا قد رسموا على رايات الحرب وملاحم البطولة."
    en: "Arnold divides the painter's craft among a workshop of specialists: the copyist, then the mudhahhib, the worker in gold, whose title painters proudly attached to their own names; the farrash who sketched the design and the chihra-nama who painted the faces in the Mughal workshop where more than one painter worked on a single picture; the gold mixers, gold-beaters and washers of lapis lazuli of Shah Isma'il's library under Bihzad's direction. Grohmann recounts the early Arab miniatures that survived the catastrophes; Arnold describes the Herat workshop, where Bihzad's pupil Darwish Muhammad Naqqash had been a maker of oil-colours before the master undertook his training and entrusted his own work to him. In Istanbul the Nakkashan were a thousand men with cells in the lion-house and a hundred shops, their litters in the procession carrying works of the most famous painters; the portrait-painters had no legal patron because portrait-painting was prohibited, though they painted the battles of heroes on standards and in their shops."
    ur: "آرنلڈ مصوّر کی صنعت کو ماہرین کی ورکشاپ میں بانٹتا ہے: نسخہ نویس، پھر مذهّب یعنی زر کار جس کا لقب مصوّر اپنے نام سے فخر سے جوڑتے تھے؛ مغل ورکشاپ میں فرّاش جو ابتدائی خاکہ کھینچتا اور چہرہ نما جو چہرے رنگتا، ایک تصویر پر کئی مصوّر کام کرتے؛ اور شاہ اسماعیل کی لائبریری میں زر ملانے والے، زر کوٹنے والے اور لاجورد دھونے والے بہزاد کی نگرانی میں۔ گروہمان وہ قدیم عربی منی ایچر بیان کرتا ہے جو آفتوں سے بچیں؛ آرنلڈ ہرات کی ورکشاپ بیان کرتا ہے جہاں بہزاد کے شاگرد درویش محمد نقّاش پہلے روغنی رنگ ساز تھا، پھر استاد نے اسے تربیت دی اور اپنا کام اس پر سونپا۔ استنبول میں نقّاش ہزار آدمی تھے جن کے خانے خانۂ ارسلان کے اوپر والے حصے میں اور سو دکانیں تھیں؛ جلوس کی سواریاں مشہور مصوّروں کے کام اٹھاتی تھیں؛ مصوّروں کا کوئی شرعی بزرگ نہ تھا کیونکہ صورت سازی منع تھی، بہرحال وہ جھنڈوں اور دکانوں پر بہادروں کی لڑائیاں رنگتے تھے۔"
