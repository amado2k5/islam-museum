places:
  - { place: place/baghdad, note: "Grohmann shows the early Arabic miniature tradition rests on Manichaean painting and late-antique book art, the fragments of early Arab miniatures being precious survivors of catastrophes.", sources: [source/arnold-grohmann-islamic-book-1929] }
  - { place: place/samarqand, note: "Herat under Sultan Husayn Bayqara (1468-1505) was Bihzad's home court under the patronage of Mir Ali Shir; after the Uzbeg conquest in 1507 he passed, like the other palace artists, to the new master, and in 1522 Shah Isma'il made him director of the royal library over the whole book workshop.", sources: [source/arnold-grohmann-islamic-book-1929] }
