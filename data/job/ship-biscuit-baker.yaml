craft:
  techniques:
    ar: "صنعة الپكسيماتجي صنعة الخبّاز الموجّهة للسفر: يُعجن الدقيق ويُخبز حتى يجفّ تماماً فيحمل البحر والسفر الطويل بلا فساد. وعند إوليا تعمل الأفران المئة والخمسة في غلطة وكُني چشمة ويَني كوي لسفن البحر الأسود خاصة، ويبلغ حجم الصنعة أن تُحمل في الموكب أقراص بقسماط وزن القنطار والقنطارين؛ وفي قاهرة لين يُباع البسكويت الفاخر بالقنطار كما تُباع البضائع المخزّنة."
    en: "The peksimatçı's craft is the baker's craft aimed at the journey: dough kneaded and baked dry until it can carry sea and long travel without spoiling. In Evliya the hundred and five ovens work at Galata, Kuni-cheshmeh and Yeni-köi, above all for the Black Sea ships, and the trade is big enough that biscuits weighing one or two quintals are carried in the procession; in Lane's Cairo fine biscuit sells by the quintal like the other stored goods."
    ur: "پیکسماتچی کا ہنر نان بائی کا ہنر ہے جو سفر کے لیے ہو: آٹا گوندھ کر اتنا پکانا کہ سمندر اور طویل سفر میں خشک رہے بغیر بگڑے۔ اولیاء میں ایک سو پنج تنور غلطہ، کونی چشمہ اور یینی کوئی میں بحیرہ اسود کے جہازوں کے لیے خاص طور پر چلتے، اور صنعت اتنی بڑی کہ جلوس میں ایک دو قنطار وزنی بسکٹ اٹھائے جاتے؛ لین کے قاہرہ میں عمدہ بسکٹ دوسرے ذخیرہ مال کی طرح قنطار کے بھاؤ بکتا ہے۔"
