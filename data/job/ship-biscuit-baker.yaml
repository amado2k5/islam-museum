summary:
  ar: "الپكسيماتجي هو خبّاز البقسماط، خبز السفن المجفّف الذي لا يفسد في البحر. يعدّ إوليا جلبي لخبّازي البقسماط في إسطنبول ألف رجل بمئة وخمسة أفران، ويقول إنهم أهم الناس وقت الحرب؛ أفرانهم في غلطة وكُني چشمة ويَني كوي، ويمرّون في الموكب يخبزون البقسماط ويوزّعون على الناس أكياساً مملوءة، وتُحمل على ظهور الحمّالين أقراص بقسماط وزن القنطار والقنطارين لتزيين المسير. بيرهم — كبيرهم عند الخبّازين — آدم، وفي زمن النبي يعقوب المحزري الذي تقلّد الحزام من أنس بن مالك. وعلى ساحل غلطة مئة دار لخبّازي البقسماط، لأن السفن التي تبحر في البحر الأسود تأخذ بقسماطها كله من غلطة وذلك الموضع. وعند لين في القاهرة يُباع «البسكويت الفاخر» بالقنطار في أسواق المدينة."
  en: "The peksimatçı baked the ship's biscuit — the dried, twice-keeping bread that does not spoil at sea. Evliya counts a thousand biscuit-bakers with a hundred and five ovens in Istanbul, 'most interesting personages in war-time': their bake-houses stand at Galata, Kuni-cheshmeh and Yeni-köi, they pass in the procession baking biscuits and handing out filled bags to the crowd, and porters carry biscuits of one or two quintals' weight to adorn the march. Their patron, like the bread-bakers', is Adam, and in the Prophet's time James Muhziri, girded by Ins Ben Malek. On the Galata seashore stand a hundred biscuit-bakers' houses, for the ships that navigate the Black Sea take all their biscuit from Galata and that place. In Lane's Cairo 'fine biscuit' is sold by the quintal in the city markets."
  ur: "پیکسماتچی بحر کا بسکٹ پکاتا تھا — سوکھی دوبارہ پکی روٹی جو سمندر میں نہ بگڑے۔ اولیاء چلبی استنبول میں ایک سو پنج تنوروں پر ایک ہزار بسکٹ پکانے والے گنتا ہے، «جنگ کے وقت سب سے دلچسپ ہستیاں»: ان کی بھٹی ہاؤس غلطہ، کونی چشمہ اور یینی کوئی میں ہیں، جلوس میں بسکٹ پکاتے اور لوگوں میں بھری تھیلیاں بانٹتے گزرتے، اور زینت کے لیے ایک دو قنطار وزنی بسکٹ بوجھیل اٹھاتے۔ ان کا پیر روٹی پکانے والوں کی طرح آدم ہے، اور نبی کے زمانے میں جیمس محزری جس نے انس بن مالک سے کمر بند باندھی۔ غلطہ کے ساحل پر بسکٹ پکانے والوں کے سو مکان ہیں، کیونکہ بحیرہ اسود میں چلنے والے جہاز اپنا سارا بسکٹ غلطہ اور اسی جگہ سے لیتے ہیں۔ لین کے قاہرہ میں «عمدہ بسکٹ» بازار میں قنطار کے بھاؤ بکتا ہے۔"
  es: "El peksimatçı horneaba la galleta del barco: el pan seco, de doble conservación, que no se estropea en el mar. Evliya cuenta con mil panaderos de galletas con ciento cinco hornos en Estambul, «personajes de lo más interesantes en tiempos de guerra»: sus panaderías se encuentran en Galata, Kuni-cheshmeh y Yeni-köi, pasan en procesión horneando galletas y repartiendo bolsas llenas a la multitud, y los porteadores llevan galletas de uno o dos quintales para adornar la marcha. Su patrón, como el de los panaderos, es Adam, y en tiempos del Profeta James Muhziri, ceñido por Ins Ben Malek. En la costa de Galata se encuentran cien casas de panaderos de galletas, pues los barcos que navegan por el Mar Negro se abastecen de galletas en Galata y sus alrededores. En el Cairo de Lane, la «galleta fina» se vende por quintales en los mercados de la ciudad."
