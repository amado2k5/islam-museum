craft:
  materials: []
  techniques:
    ar: "يأمر ابن الأخوة أن تُنقّى الحبوب من التراب قبل طحنها وأن تُجدَّد المناخل دورياً، وأن يتفقد المحتسب الدقيق خشية خلطه بدقيق الحمص وأشباهه، وأن يمنع الطحن على فتات الرحى البالي لما فيه من ضرر للناس. ويضيف الشيزري أن التجار لا يخلطون القمح الرديء بالجيد ولا العتيق بالجديد، وأنه إن غسل الحبوب وجب تجفيفها، وأن يُرشّ قليل من الماء على القمح عند الطحن فيبيضّ الدقيق ويصحّ، وأن يؤدي الطحّانون حصة يومية من الدقيق إلى الدكاكين والأفران. ويصف إوليا مطاحن العربات التي تديرها عجلاتها وهي تسير، ومطاحن الخيل التي لا شفيع لها لأنها تعذّب البهائم."
    en: "Ibn al-Ukhuwwa orders that the grain be cleansed of earth before grinding and the sieves periodically renewed; the muhtasib must examine the flour against admixture with chick-pea flour and the like, and must stop milling on the worn particles of the millstone, which harm people. Al-Shayzari adds that merchants must not mix bad wheat with good nor old with new; washed grain must be well dried; a little water sprinkled on the wheat while milling makes the flour white and wholesome; and the millers must produce a daily quota of flour for the shops and bakeries. Evliya describes wagon-mills turned by their own wheels as they go, and the horse-mills that have no patron saint because no saint will patronise the tormenting of animals."
    ur: "ابن الاخوہ کا حکم ہے کہ اناج پیسنے سے پہلے مٹی سے صاف کیا جائے اور چھلنیاں وقتاً فوقتاً نئی کی جائیں؛ محتسب آٹے کی جانچ کرے کہ چنے وغیرہ کا آٹا نہ ملا ہو، اور گھسے ہوئے چکی پتھر کے ریزے پر پیسنا روکے کہ اس سے نقصان ہے۔ الشیزری کہتا ہے کہ سوداگر خراب گندم اچھی میں اور پرانی نئی میں نہ ملائیں؛ دھلا اناج خشک ہو؛ پیستے وقت گندم پر ہلکا پانی چھڑکنے سے آٹا سفید اور صحت بخش ہوتا ہے؛ اور چکی والے روز کا مقررہ آٹا دکانوں اور تنوروں کو دیں۔ اولیہ چلبی گاڑی چکیوں کا ذکر کرتا ہے جو اپنے پہیوں سے چلتے چلتے پیستی ہیں، اور گھوڑچکیوں کا جن کا کوئی سرپرست بزرگ نہیں کہ کوئی بزرگ جانوروں کی تکلیف کی سفارش نہیں کرتا۔"
