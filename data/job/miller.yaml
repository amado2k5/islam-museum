summary:
  ar: "الطحّان هو من يطحن الحبوب بالرحى أو الطاحون ويسلّم الدقيق إلى الأفران والناس. تضبط كتب الحسبة صنعته: أن يُنقّي الحبوب من التراب والزوان قبل طحنها، وأن تُجدَّد المناخل، وألا يُخلط دقيق الشعير أو الحمص أو الفول بالدقيق، وألا يُطحَن على رحى بالية تسقط فتاتها في الدقيق، وأن تُسلَّم حصص الدقيق للأفران كل يوم، وأن تُراعَى راحة البهائم التي تدير الرحى. وفي إسطنبول إوليا جلبي للطحّانين طائفة تسير بمطاحن الخيل على عربات وتطحن وهي تمضي."
  en: "The tahhan ground grain on the millstone or at the mill and delivered flour to the bakeries and to people's houses. The hisba manuals regulate the trade: the grain must be cleansed of earth and darnel before grinding, the sieves renewed, no barley, bean or chick-pea flour mixed in, no milling on a worn millstone whose grit falls into the flour, a daily quota of flour delivered to the bakers' shops, and the mill animals given their rest. In Evliya's Istanbul the millers marched as a guild whose wagon-mills ground flour as they moved."
  ur: "طحان وہ ہے جو چکی یا پیسنے کی گاڑی پر اناج پیس کر آٹا نان بائیوں اور گھروں تک پہنچاتا ہے۔ حسبہ کی کتابیں اس کے پیشے کو ضبط کرتی ہیں: اناج پیسنے سے پہلے مٹی اور زوان سے صاف ہو، چھلنیاں نئی ہوں، جو، مٹر یا چنے کا آٹا نہ ملایا جائے، گھسی ہوئی چکی کے پتھر پر نہ پیسا جائے جس کا ریزہ آٹے میں گرے، نان بائیوں کو روز کا مقررہ آٹا پہنچے، اور چکی چلانے والے جانوروں کو آرام ملے۔ اولیاء چلبی کے استنبول میں چکی والے انجمن بنا کر چلتے تھے جن کی گاڑیوں پر لدی چکیاں چلتے چلتے آٹا پیستی تھیں۔"
  es: "El tahhan molía el grano en la piedra de molino o en el molino y distribuía la harina a las panaderías y a los hogares. Los manuales de la hisba regulaban el comercio: el grano debía limpiarse de tierra y cizaña antes de molerlo, los tamices debían renovarse, no debía mezclarse harina de cebada, judías o garbanzos, no debía molerse en una piedra de molino desgastada cuya arena cayera en la harina, debía entregarse una cuota diaria de harina a las panaderías y los animales del molino debían descansar. En el Estambul de Evliya, los molineros marchaban como un gremio cuyos molinos de carro molían la harina mientras se desplazaban."
  fr: "Les meuniers moudraient le grain sur la meule ou au moulin et livraient la farine aux boulangeries et aux particuliers. Les manuels de la hisba réglementaient ce commerce: le grain devait être débarrassé de la terre et de l’ivraie avant d’être moulu, les tamis remplacés, sans mélange de farine d’orge, de fève ou de pois chiche, sans mouture sur une meule usée dont les impuretés se retrouvent dans la farine, un quota quotidien de farine livré aux boulangeries et les animaux du moulin bénéficiant d’un repos suffisant. À Istanbul, sous le règne d’Evliya, les meuniers se déplaçaient en corporation et leurs moulins ambulants moudraient la farine en mouvement."
