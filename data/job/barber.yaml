summary:
  ar: "الحلّاق يحلق الرأس واللحية ويزيّن، وكان عند المصريين يقوم بعملية الختان في موكب يحمل فيه غلامه «الهمل». يصف الشيزري الحلّاق بأنه «صاحب الحمّام» خفيف اليد نشيطاً موساه مبلولة حادة، لا يقف تلقاء الرأس ولا يأكل ما يُنتن النَّفَس، ويعدّ إوليا جلبي طوائف الحلّاقين في إسطنبول: أولهم إبراهيم الذي حلق بمنى، وثانيهم سلمان الفارسي، ومنهم حلّاقو الختان والحلّاقون المشاة."
  en: "The barber shaved head and beard and groomed; among the Egyptians he also performed circumcision, led by his servant carrying the heml in the procession. Al-Shayzari describes the barber, 'that is, the bathhouse attendant', as needing a light touch and a wet, sharp razor, not standing before the head and avoiding foods that foul the breath, and Evliya lists Istanbul's barber guilds: first patron Abraham who shaved at Mina, second Selman Pak, with separate guilds of circumcision barbers and barbers on foot."
  ur: "نائی سر اور داڑھی منڈاتا اور سنوارتا ہے؛ مصریوں میں وہ ختنہ بھی کرتا تھا جبکہ جلوس میں اس کا نوکر «ہمل» اٹھائے چلتا۔ الشیزری نائی کو، یعنی حمام کا خادم، ہلکے ہاتھ اور تر تیز موسے والا کہتا ہے جو سر کے سامنے نہ کھڑا ہو اور بدبو دار کھانا نہ کھائے، اور اولیاء چلبی استنبول کی نائی انجمنیں گنتا ہے: پہلا پیر ابراہیم جو منیٰ پر سر منڈوایا، دوسرا سلمان پاک، اور ختنہ کرنے والے نائیوں اور پیدل نائیوں کی الگ انجمنیں۔"
