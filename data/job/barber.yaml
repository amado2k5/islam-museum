craft:
  materials: [brass, leather]
  techniques:
    ar: "يأمر الشيزري أن يكون الحلّاق خفيف اليد نشيطاً ماهراً بالحلاقة، موساه مبلولة حادة، وألا يقف مقابل الرأس ومواضع الشعر، ولا يأكل بصلاً ولا ثوماً ولا كرّاثاً لئلا يُنتن نفسه على الناس وهو يحلقهم، وأن يقصّ شعر الجبهة والصدغين على ما يجب، ولا يحلق شعر الصبي إلا بإذن وليّه، ولا يقصّ عارض اللحية الأول ولا لحية المخنّث الكاملة. وعند لين يجري الحلّاق في موكب الختان وخلفه غلامه يحمل «الهمل» الذي يوضع على رأسه قلنسوة تجمع النقوط، ثم يجري العملية في بيت منفرد ويذهب بالصبي إلى الحمّام بعد نحو أسبوع."
    en: "Al-Shayzari requires the barber to have a light touch, be nimble and proficient at shaving, his razor wet and sharp; he should not stand directly in front of the head nor eat onion, garlic or leek lest his breath offend the customer; he cuts the hair of forehead and temples as required, does not cut a boy's hair without his guardian's leave, nor the first beard or the full beard of an effeminate man. In Lane's Cairo the barber walks in the circumcision procession behind his servant who bears the heml, on whose top a cap gathers the guests' nukoot; he then performs the operation in a private room and takes the boy to the bath about a week later."
    ur: "الشیزری کے مطابق نائی ہلکے ہاتھ، چست اور حلاقت میں ماہر ہو، اس کا موسہ گیلا اور تیز ہو؛ سر کے سامنے نہ کھڑا ہو اور نہ پیاز، لہسن یا گندنا کھائے کہ سوتے وقت سانس کی بو ناخوش کرے؛ ماتھے اور کنپٹیوں کے بال مطابق کاٹے، سرپرست کی اجازت کے بغیر لڑکے کے بال نہ کاٹے، اور نہ پہلی آنچل داڑھی اور نہ مخنث کی پوری داڑھی چھوئے۔ لین کے قاہرہ میں نائی ختنہ جلوس میں اپنے نوکر کے پیچھے چلتا جو «ہمل» اٹھائے ہوتا، جس کی نوک پر رکھے ٹوپ میں مہمان نقوط ڈالتے؛ پھر وہ الگ کمرے میں عمل کرتا اور تقریباً ہفتہ بعد لڑکے کو حمام لے جاتا۔"
