summary:
  ar: "التركَشجي يصنع الجُعبة التي تُحمَل فيها السهام. في موكب إسطنبول عدّ إوليا ثلاث طوائف متجاورة: صنّاع الجُعب ⁦(تركشجيان)⁩ ستون رجلاً بثلاثين دكاناً بيرهم طوختمش خان الجنكيزي وحمزة عمّ النبي الذي أُحزِم من يد النبي نفسه وقبره عند سفح أُحُد بالمدينة؛ وصنّاع الجُدلج ⁦(جودلجيان)⁩ وهي جعبة خاصة، اثنا عشر رجلاً بدكانين بيرهم تلميذ لحمزة مدفون بعينتاب؛ وصنّاع الجاب ⁦(جابجيان)⁩ ثلاثون رجلاً بعشر دكاكين كلهم أرناؤوط، والجاب كالجودلج غلاف للقوس والسهام. وهي صنعة سروجية في الأصل: جلد يُقطَع ويُخاط ويُشدّ ليحمل ثلاثين سهماً كما يذكر نيكول في عدة الفارس المملوكي — قوسان وثلاثون سهماً في جعبة جلدية وكيس فيه أوتار احتياطية — ويذكر إلغود أن صنّاع السلاح في كرمان كانوا يصوغون الجُعب وغيرها على النمط المحلي."
  en: "The tirkeşci made the quiver that carries the arrows. In Evliya's Istanbul procession three neighbouring guilds march together: the quiver-makers (Tirkeshjian), sixty men in thirty shops, their patrons old Tokhtamish khan of the Jenguiz family and Hamza, the Prophet's uncle, who received the girdle from the Prophet himself and is buried at the foot of mount Ohod at Medina; the makers of a particular kind of quiver called Gudelej, twelve men in two shops, patronised by a disciple of Hamza buried at Aintab; and the workmen of the Jab, thirty men in ten shops, all Albanese — the jab, like the gudelej, a case for bow and arrows. It is a saddler's craft at root: leather cut, sewn and stiffened to carry thirty shafts, as Nicolle lists in the Mamluk horseman's kit — two bows, thirty arrows in a leather quiver, a pouch with spare strings — and Elgood records that the armourers of Kerman forged quivers and other weapons after the local fashion."
  ur: "ترکشجی تیر رکھنے والا ترکش بناتا ہے۔ اولیاء کے استنبول کے جلوس میں تین ملتق طائفے ایک ساتھ چلتے: ترکش ساز ⁦(ترکشجیان)⁩ ساٹھ آدمی تیس دکانیں، پیر بوڑھا طوختمش خان چنگیزی خاندان سے اور عمِ نبی حمزہ جسے خود نبی نے کمر بند پہنایا اور مدینہ میں احد کے دامن میں دفن ہے؛ جدلج ساز ⁦(جودلجیان)⁩ — ایک خاص قسم کا ترکش — بارہ آدمی دو دکانیں، پیر حمزہ کا ایک شاگرد جو عینتاب میں دفن؛ اور جاب بنانے والے ⁦(جابجیان)⁩ تیس آدمی دس دکانیں سب البانی — جاب بھی جدلج کی طرح کمان اور تیر کا غلاف ہے۔ بنیاد میں یہی سراج کا ہنر ہے: چمڑا کاٹ کر سلائی اور سخت کیا جاتا کہ تیس تیر سنوارے، جیسا نیکول مملوک سوار کے ساز میں گنواتا ہے — دو کمان، چمڑے کے ترکش میں تیس تیر، اور اضافی ڈوروں کی تھیلی — اور ایلگڈ روایت رکھتا ہے کہ کرمان کے اسلحہ ساز ترکش اور دوسرے ہتھیار مقامی روش پر بناتے تھے۔"
