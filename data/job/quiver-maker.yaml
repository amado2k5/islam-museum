craft:
  materials: [leather]
  techniques:
    ar: "الصنعة من صنائع السروج: جلد يُقطَع على قياس السهام ويُخاط ويُكوَّن ويُشدّ في صندوق أو غلاف يعلّق بالركب أو المنطقة، وأصنافه عند إسطنبول ثلاثة: التركش العام، والجُدلج، والجاب غلاف القوس والسهام معاً. وفي عدة الفارس التي يعدّدها نيكول جعبة جلدية فيها ثلاثون سهماً وكيس للأوتار الاحتياطية."
    en: "The craft is a saddler's work: leather cut to the arrows' measure, sewn, shaped and stiffened into a case hung at the saddle or the belt. Istanbul knew three kinds — the common tirkeş quiver, the gudelej, and the jab, a combined case for bow and arrows together. In the horseman's kit Nicolle enumerates, the leather quiver holds thirty arrows beside a pouch of spare strings."
    ur: "ہنر سراج کا کام ہے: چمڑا تیروں کے ناپ سے کاٹا، سلائی، ڈھالا اور سخت کیا جاتا کہ زین یا کمر بند سے لٹکنے والا غلاف بنے۔ استنبول میں تین اقسام — عام ترکش، جدلج، اور جاب جو کمان اور تیر دونوں کا غلاف ہے۔ نیکول کے گنوائے سوار کے ساز میں چمڑے کا ترکش تیس تیر اور اضافی ڈوروں کی تھیلی کے ساتھ رکھتا ہے۔"
