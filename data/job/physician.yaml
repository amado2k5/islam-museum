places:
  - place: place/baghdad
    start: { edtf: "0908" }
    end: { edtf: "0932" }
    note: "In the reign of al-Muqtadir (908 to 932) the head of physicians examined the practitioners of the city and licensed those who passed; the entry gives the number from Ibn Abi Usaybia as about 860 in Baghdad."
    sources: [source/tdv-hekimbasi]
  - place: place/cordoba
    note: "Under the Umayyads of al-Andalus the physicians formed an office attached to the market-supervision office (ihtisab), headed by a shaykh of physicians."
    sources: [source/tdv-hekimbasi]
  - place: place/cairo
    note: "In the Fatimid and Ayyubid period the head of physicians was appointed by the deputy ruler and was ranked first among the professions, according to the entry's citation of Qalqashandi."
    sources: [source/tdv-hekimbasi]
  - place: place/damascus
    note: "The entry states that the licensing before the head of physicians was still in use in Damascus in the early tenth century."
    sources: [source/tdv-hekimbasi]
  - place: place/istanbul
    start: { edtf: "1481" }
    end: { edtf: "1850" }
    note: "The Ottoman chief physician (hekimbaşı) headed the palace and state medical services from the reign of Bayezid II; in 1850 the office was reduced to the palace chief physician and its wider powers ended."
    sources: [source/tdv-hekimbasi, source/tdv-tip-osmanli]
  - place: place/bursa
    start: { edtf: "1399" }
    note: "The Yıldırım Dârüşşifâ in Bursa, the first Ottoman dârüşşifâ listed by the entry, dated 1399."
    sources: [source/tdv-tip-osmanli]
  - place: place/salerno
    start: { edtf: "1197" }
    end: { edtf: "1250" }
    note: "The entry says the office of chief physician was kept in Salerno under Frederick II (1197 to 1250), and later in Spain and other parts of Europe."
    sources: [source/tdv-hekimbasi]
