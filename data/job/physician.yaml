id: job/physician
class: job
label: { ar: "الطبيب", en: "Physician (tabib)", ur: "طبیب" }
summary:
  ar: "الطبيب من يمارس تشخيص الأمراض ومعالجتها بعلم الطب. عرف المسلمون مهنته بالتعلّم والتجربة وملازمة الأطباء المجرّبين، ثم صارت في الدولة العباسية تُمنح بامتحان أمام رئيس الأطباء وإجازة، وفي الدولة العثمانية تقوم على المدرسة الطبية والدار الشفاء والإذن الرسمي والحكيم باشي. وهي اليوم مهنة حديثة تحكمها الجامعات والتراخيص الوطنية."
  en: "The physician is the person who diagnoses and treats illness by the science of medicine. Muslims learned the craft by study, practice and apprenticeship to experienced physicians. In the Abbasid state a practitioner was admitted after an examination before the head of physicians, and in the Ottoman state the craft rested on the madrasa, the dârüşşifâ hospital, an official permit and the chief physician. Today it is a modern profession governed by universities and national licensing."
  ur: "طبیب وہ ہے جو علمِ طب کے ذریعے بیماری کی تشخیص اور علاج کرے۔ مسلمانوں نے یہ فن مطالعے، تجربے اور تجربہ کار طبیبوں کی شاگردی سے سیکھا۔ عباسی دور میں رئیس الاطباء کے امتحان اور اجازت کے بعد پریکٹس کی اجازت ملتی تھی، اور عثمانی دور میں یہ مدرسے، دارالشفاء اور حکیم باشی کی سند پر قائم تھا۔"
