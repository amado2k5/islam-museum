  techniques:
    ar: "نوعا الزليج: فسيفساء خزفية تُركّب من مربعات وسداسيات وقطع منتظمة صغيرة، أو موزاييك حقيقي تُقطّع البلاطات فيه وتُرصّ كما تُرصّ مكعبات الرخام والزجاج. والتقنية الأدقّ: تُرسَم الكتابة ثم يُقطَع بالإزميل والمطرقة ما حول الحروف عبر الميناء حتى الطين الأحمر، فيبقى نقش أسود على أرضية طينية، ويتطلب العمل مهارة بالغة حتى لا يتكسّر ميناء الحروف نفسها؛ ثم تُطلى الخلفية بلون آخر أو تُترك. وصنّاع فاس يقصّون بلاطاتهم بمطارق فولاذية وهم قعود على الأرض."
    en: "Two kinds of zellij: ceramic mosaic built from small squares, hexagons and other regular shapes, and a true mosaic in which tiles are cut and laid in pattern like marble or glass tesserae. The finer technique: the inscription is laid out, then the surface around the letters is cut through the enamel back to the terra-cotta with chisels or sharp hammers, leaving a black inscription on a terra-cotta ground — work demanding extreme skill lest the enamel of the letters chip; the background may then be enamelled another colour or left plain. The Fez tile-setters trim their tiles with steel hammers, working seated on the ground."
    ur: "زلیج دو طرح کا: ایک جلی چوکور، چھ کونے اور دیگر منظم شکلوں کے چھوٹے ٹکڑوں سے بنتا موزیک، اور دوسرا حقیقی موزیک جس میں کاشیاں سنگِ مرمر یا شیشے کے خانوں کی طرح کاٹ کر نقش میں بٹھائی جاتی ہیں۔ باریک ترین طریقہ: کتبہ بچھایا جاتا ہے پھر حروف کے گرد سطح کو چھینی یا تیز ہتھوڑے سے جل کے اندر سیاہ مٹی تک کاٹا جاتا ہے تاکہ مٹی کی زمین پر سیاہ کتبہ ابھرے — اتنی مہارت درکار کہ خود حروف کا جل نہ ٹوٹے؛ پس منظر کو دوسرا رنگ دیا جا سکتا ہے یا چھوڑا۔ فس کے ٹائل تراش زمین پر بیٹھے فولادی ہتھوڑوں سے کاشیاں تراشتە ہیں۔"
