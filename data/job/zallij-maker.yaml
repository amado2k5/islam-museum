summary:
  ar: "الزليجي صانع الزليج المغربي: يقطّع البلاطات المزجّجة بمطرقة فولاذية حادة إلى قطع هندسية دقيقة ثم يجمعها نقشاً على فرشات الأرض والجدران والنافرات. وفي فاس وحدها عُدّت الحرفة بمئات الصنّاع، ولا يزال رنين مطارقهم يتردد في أزقتها وأروقة بيوتها كما وصفه غالّوتي؛ أصل الفن أقدم من ذلك بكثير، إذ وثّق مؤرخ فاس في القرن الرابع عشر الميلادي اعتناء الأهل بالبناء بالبلاطات المطليّة بالميناء والرخام، وبلغ الزليج في المدارس المرينية ذروته. وفي تلمسان كانت جدران المساجد تُكسى ببلاطات الفاينس منذ القرن الرابع عشر، وكثير منها من صنع أندلسي."
  en: "The zelliji makes Moroccan glazed-tile mosaic: he cuts glazed tiles with a sharp steel hammer into precise geometric pieces and lays them into pattern on floors, wall-dados and fountains. In Fez alone the craft numbered several hundred practitioners, and the ringing of the tile-setters' hammers still echoes through its lanes and courtyards as Gallotti described; the art itself is far older — the chronicler of Fez writing about 1325 records that the city's builders already prized enamelled tiles, marble and sculpture, and zellij reached its height in the Marinid madrasas. At Tlemcen mosque walls wore faience revetments from the fourteenth century, much of it of Andalusian manufacture."
  ur: "زلیجی مراکشی جلی کاشیوں کا موزیک بناتا ہے: وہ جلی اینٹوں کو تیز فولادی ہتھوڑے سے ہندسی ٹکڑوں میں تراش کر فرش، دیواروں کی پٹی اور چشموں پر نقش میں بٹھاتا ہے۔ صرف فس میں اس ہنر کے کئی سو کاریگر تھے اور ٹائل تراشوں کی ہتھوڑیوں کی گونج اب بھی گلیوں اور صحنوں میں سنائی دیتی ہے جیسا کہ گالوتی نے لکھا؛ ہنر اس سے بھی قدیم ہے — ۱۳۲۵ء کے قریب فس کا مورخ لکھتا ہے کہ شہر کے معمار جلی کاشی، سنگِ مرمر اور تراشے کو شوق سے استعمال کرتے تھے، اور مرینی مدرسوں میں زلیج عروج پر پہنچا۔ تلمسان میں مسجدوں کی دیواریں چودہویں صدی سے جلی کاشی پہنتی تھیں جن کا بڑا حصہ اندلسی ساخت تھا۔"
  es: "El zelliji crea mosaicos marroquíes de azulejos vidriados: corta los azulejos con un afilado martillo de acero en piezas geométricas precisas y los coloca formando patrones en suelos, zócalos y fuentes. Solo en Fez, este oficio contaba con varios cientos de practicantes, y el sonido de los martillos de los colocadores de azulejos aún resuena por sus callejones y patios, como describió Gallotti; el arte en sí es mucho más antiguo: el cronista de Fez, que escribió alrededor de 1325, registra que los constructores de la ciudad ya apreciaban los azulejos esmaltados, el mármol y la escultura, y el zelliji alcanzó su máximo esplendor en las madrasas mariníes. En la mezquita de Tlemcen, las paredes lucían revestimientos de loza del siglo XIV, muchos de ellos de fabricación andaluza."
