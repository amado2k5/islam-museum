  techniques:
    ar: "ينظّم الشيزري سَبك النحاس: لا يُخلَط بمادة الهَبَج التي يستخرجها الصاغة وسبّاكو الفضة لأنه يصلّبه ويُنقص ليونته، فالقدح أو الهاون المصبوب منه ينكسر كالزجاج؛ ولا تُخلَط كسر الأنية النحاسية بالنحاس الجديد بل يُسبك كلّ على حدة ويُعمل على حدة. ويصف إوليا معمل النحّاسين عند باب الأيازمة ومصفّي النحاس وهم يصهرون القطع الصغار بمنفاخ من جلد الجاموس يعمل كل منفاخ بعشرة رجال."
    en: "Al-Shayzari regulates the smelting: copper must not be mixed with the habag extracted by goldsmiths and silver-smelters, for it hardens the metal and takes away its malleability, so a cast cup or mortar breaks like glass; broken copper vessels must not be mixed with unused copper but each smelted separately and worked separately. Evliya describes the kettle-makers' factory at the Ayazmah gate and the brass-purifiers melting small pieces of brass with buffalo-skin bellows, each bellows worked by ten men raising a heat no one can come near."
    ur: "الشیزری تانبے کی دھلائی کا ضابطہ دیتا ہے: اس میں ہیج نہ ملایا جائے جو سنار اور چاندی ساز ذوب کرتے وقت نکالتے ہیں، کہ وہ دھات کو سخت اور نرمی سے محروم کر دیتا ہے اور ڈھلا کٹورا یا ہاون شیشے کی طرح ٹوٹتا ہے؛ ٹوٹے برتن نئے تانبے میں نہ ملیں بلکہ ہر ایک الگ پگھلے اور الگ تیار ہو۔ اولیاء ایازمہ دروازے پر ہنڈیا سازوں کا کارخانہ اور پیتل صاف کرنے والے بتاتا ہے جو بھینس کی کھال کی دھونکنیوں سے چھوٹے ٹکڑے پگھلاتے ہیں، ہر دھونکنی دس آدمی چلاتے اور اتنی گرمی کہ قریب آنا ممکن نہ ہو۔"
