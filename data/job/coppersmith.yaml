summary:
  ar: "النحّاس هو من يصوغ النحاس قدوراً وآنية. يمنع الشيزري النحّاسين من خلط النحاس بمادة تسمّى الهَبَج يستخرجها الصيّاغ وسبّاكو الفضة عند السبك، لأنه يجعل النحاس صلباً غير ليّن فإذا صُبّت منه قدح أو هاون كُسر كالزجاج، ويأمر ألا يخلطوا كسر آنية النحاس بالجديد بل يُسبك كلّ على حدة ويُعمل على حدة. وفي إسطنبول إوليا جلبي لصنّاع القدور أربعة آلاف رجل في تسعمئة دكان، ومعملهم بناء عظيم أقامه محمد الثاني عند باب الأيازمة، ومن رفقائهم مصفّو النحاس بمنفاخ من جلد الجاموس وملمّعو القدور."
  en: "The nahhas worked copper into pots and vessels. Al-Shayzari forbids mixing copper with a substance called habag which goldsmiths and silver-smelters extract when they smelt, for it hardens the copper and makes it brittle, so that a cup or mortar cast from it breaks like glass; broken copper vessels must not be mixed with unused copper but each smelted and worked separately. In Evliya's Istanbul the kettle-makers numbered four thousand men in nine hundred shops, their factory a great building raised by Mehmed II at the Ayazmah gate, and with them marched the brass-purifiers melting in buffalo-skin bellows and the kettle-polishers."
  ur: "نحاس تانبے کو دے گچیوں اور برتنوں میں ڈھالتا تھا۔ الشیزری تانبے میں ہیج ملانے سے منع کرتا ہے، وہ مادہ جو سنار اور چاندی ملانے والے ذوب کرتے وقت نکالتے ہیں، کہ وہ تانبے کو سخت اور بھربھرا کر دیتا ہے اور اس سے بنی کٹوری یا ہاون شیشے کی طرح ٹوٹ جاتی ہے؛ ٹوٹے تانبے کے برتن نئے تانبے میں نہ ملائے جائیں بلکہ ہر ایک الگ پگھلا کر الگ تیار ہو۔ اولیاء چلبی کے استنبول میں ہنڈیا ساز نو سو دکانوں پر چار ہزار آدمی تھے، ان کا کارخانہ محمد ثانی کا بنایا عظیم عمارت ایازمہ دروازے پر تھا، اور ان کے ساتھ پھونکنیوں والے پیتل صاف کرنے والے اور ہنڈیاں چمکانے والے چلتے تھے۔"
  es: "Los nahhas trabajaban el cobre para fabricar ollas y vasijas. Al-Shayzari prohibía mezclar el cobre con una sustancia llamada habag, que los orfebres y plateros extraían al fundirlo, pues endurecía el cobre y lo volvía quebradizo, de modo que una taza o un mortero hecho con ella se rompía como el vidrio; las vasijas de cobre rotas no debían mezclarse con el cobre sin usar, sino que cada una debía fundirse y trabajarse por separado. En el Estambul de Evliya, los fabricantes de calderos sumaban cuatro mil hombres en novecientos talleres; su fábrica era un gran edificio erigido por Mehmed II en la puerta de Ayazmah, y con ellos marchaban los purificadores de latón que fundían el metal en fuelles de piel de búfalo y los pulidores de calderos."
  fr: "Les nahhas travaillaient le cuivre pour en faire des pots et des récipients. Al-Shayzari interdit de mélanger le cuivre avec une substance appelée habag, extraite par les orfèvres et les argentiers lors de la fusion, car elle durcit le cuivre et le rend cassant, de sorte qu'une coupe ou un mortier moulé avec ce matériau se brise comme du verre; les récipients en cuivre cassés ne doivent pas être mélangés avec du cuivre neuf, mais chaque pièce doit être fondue et travaillée séparément. À Istanbul, sous le règne d'Evliya, les fabricants de chaudrons étaient quatre mille hommes répartis dans neuf cents ateliers. Leur usine était un grand bâtiment construit par Mehmed II à la porte d'Ayazmah, et c'est là que travaillaient les purificateurs de laiton, qui fondaient le cuivre dans des soufflets en peau de buffle, et les polisseurs de chaudrons."
