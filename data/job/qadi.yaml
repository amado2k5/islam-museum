label: { ar: "القاضي", en: "Qadi (judge)", ur: "قاضی" }
summary:
  ar: "القاضي هو من تعيّنه السلطة المختصة للفصل في الخصومات والدعاوى بين الناس بالأحكام الشرعية. بدأ القضاء في زمن النبي، وصار منصباً تعيّنه الدولة في عهد عمر، ثم تنظّم في العهد العباسي بقاضي القضاة، وبلغ في الدولة العثمانية ترتيباً دقيقاً بالتكوين في المدارس وتعيين البراءات. وهو اليوم، في أغلب الدول، موظف في نظام قضائي حديث أو يعمل في الأحوال الشخصية."
  en: "The qadi is the person appointed by the competent authority to settle disputes between people by the rules of the sharia. The office began in the Prophet's time, became a state appointment under Umar, was organised under a chief judge in the Abbasid period, and reached a close Ottoman system of training and imperial appointment. Today it has mostly been absorbed into modern court systems or survives in personal-status matters."
  ur: "قاضی وہ شخص ہے جسے مجاز اتھارٹی شریعت کے مطابق لوگوں کے جھگڑے اور مقدمات نمٹانے کے لیے مقرر کرتی ہے۔ یہ منصب نبی کے زمانے میں شروع ہوا، عمر کے دور میں ریاستی تقرری بنا، عباسی دور میں قاضی القضاة کے تحت منظم ہوا، اور عثمانی دور میں تعلیم اور شاہی فرمان کے ذریعے تقرری کا باقاعدہ نظام بنا۔"
