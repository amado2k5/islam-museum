label: { ar: "القاضي", en: "Qadi (judge)", ur: "قاضی", es: "Qadi (juez)", fr: "Qadi (juge)", tr: "yargıç", id: "hakim" }
summary:
  ar: "القاضي هو من تعيّنه السلطة المختصة للفصل في الخصومات والدعاوى بين الناس بالأحكام الشرعية. بدأ القضاء في زمن النبي، وصار منصباً تعيّنه الدولة في عهد عمر، ثم تنظّم في العهد العباسي بقاضي القضاة، وبلغ في الدولة العثمانية ترتيباً دقيقاً بالتكوين في المدارس وتعيين البراءات. وهو اليوم، في أغلب الدول، موظف في نظام قضائي حديث أو يعمل في الأحوال الشخصية."
  en: "The qadi is the person appointed by the competent authority to settle disputes between people by the rules of the sharia. The office began in the Prophet's time, became a state appointment under Umar, was organised under a chief judge in the Abbasid period, and reached a close Ottoman system of training and imperial appointment. Today it has mostly been absorbed into modern court systems or survives in personal-status matters."
  ur: "قاضی وہ شخص ہے جسے مجاز اتھارٹی شریعت کے مطابق لوگوں کے جھگڑے اور مقدمات نمٹانے کے لیے مقرر کرتی ہے۔ یہ منصب نبی کے زمانے میں شروع ہوا، عمر کے دور میں ریاستی تقرری بنا، عباسی دور میں قاضی القضاة کے تحت منظم ہوا، اور عثمانی دور میں تعلیم اور شاہی فرمان کے ذریعے تقرری کا باقاعدہ نظام بنا۔"
  es: "El cadí es la persona designada por la autoridad competente para dirimir disputas entre particulares según las normas de la sharia. Este cargo se originó en tiempos del Profeta, se convirtió en un nombramiento estatal bajo el reinado de Umar, se organizó bajo la figura de un juez principal durante el período abasí y llegó a formar parte de un sistema otomano de formación y nombramiento imperial. Hoy en día, su función se ha integrado mayoritariamente en los sistemas judiciales modernos o se mantiene en asuntos relacionados con el estado civil."
  fr: "Le cadi est la personne désignée par l'autorité compétente pour régler les litiges entre personnes selon les règles de la charia. Cette fonction remonte à l'époque du Prophète, devint une nomination d'État sous Umar, fut organisée sous l'autorité d'un juge en chef durant la période abbasside, et se constitua sous le système ottoman de formation et de nomination impériale. Aujourd'hui, elle est en grande partie intégrée aux systèmes judiciaires modernes ou subsiste dans le domaine des affaires de statut personnel."
  tr: "Hakim, yetkili makam tarafından İslam hukukuna göre insanlar arasındaki anlaşmazlıkları ve iddiaları karara bağlamak üzere atanan kişidir. Yargı sistemi Peygamberimiz döneminde başlamış ve Ömer döneminde devlet tarafından atanan bir makam haline gelmiştir. Daha sonra Abbasi döneminde Başyargıç atanmasıyla resmileştirilmiş, Osmanlı İmparatorluğu'nda ise okullarda eğitim ve hakimlerin atanması yoluyla kesin bir yapıya kavuşmuştur. Günümüzde çoğu ülkede hakimler modern bir yargı sistemi içinde çalışmakta veya kişisel statü konularında görev yapmaktadır."
  id: "Hakim adalah seseorang yang ditunjuk oleh otoritas yang berwenang untuk mengadili perselisihan dan klaim antar individu sesuai dengan hukum Islam. Lembaga peradilan dimulai pada masa Nabi Muhammad SAW, dan menjadi jabatan yang ditunjuk negara pada masa pemerintahan Umar. Kemudian, lembaga ini diformalkan pada era Abbasiyah dengan pengangkatan Ketua Mahkamah Agung, dan di Kekaisaran Ottoman, lembaga ini mencapai struktur yang tepat melalui pelatihan di sekolah-sekolah dan pengangkatan hakim. Saat ini, di sebagian besar negara, hakim dipekerjakan dalam sistem peradilan modern atau bekerja dalam urusan status pribadi."
