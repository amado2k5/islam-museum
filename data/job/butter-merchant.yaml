summary:
  ar: "السمّان أو الزيّات هو تاجر الدسم في السوق: يبيع السمن والزيت والجبن والعسل والمخللات والخل. يجعل الشيزري باباً كاملاً لبياعي السمن: يفتّش المحتسب مكاييلهم وأرطالهم وموازينهم، ويحرّم خلط الرديء بالجيّد، وخلط التمر العتيق بالجديد، ورشّ الماء على التمر والزبيب ليثقلا، وصبّ الزيت على الزبيب ليحسُن لونه، وسقى التمر بماء قصب السكر الممزوج بالماء الحار، وتغليش الزيت الفاسد بزيت القرطم — وعلامته دخان خانق على النار — وخلط الزيت بزيتٍ أُدخنت فيه الأجبان — وعلامته أنه يفحّ ويطقس على لهب السراج — وتغليش الخلّ بالماء — وعلامتها أن الخلّ الصافي يفور إذا سُكب على الأرض، وأن غصن طحلب الماء يشرب الماء ويترك الخلّ. ويحذّر ابن الأخوة «صغار البياعين» من خلط البضائع، ويفتّش قلّالي الجبن حتى لا يُقلي إلا بزيت سيرج طري، ويراقب مخللاتهم وعسل النحل الذي يُغشّ بالصمغ. وفي إسطنبول إوليا مراقبٌ سادس لمخزن السمن يأخذ عشر السمن الطري والمذاب وكل صنوف الزيت وتُؤجَّر وظيفته بسبعة ملايين أقجة في السنة، وتحته تجار السمن ألفٌ وتجار الزيت ألفٌ ومئتان وخمسة وثمانون في ستمائة دكان. وعند لين «الزيّات» في القاهرة يبيع الزيت والسمن والجبن والعسل معاً."
  en: "The samman or zayyat was the market's dealer in fats: butter and clarified butter, oil, cheese, honey, pickles and vinegar. Al-Shayzari gives the sellers of clarified butter a whole chapter: the muhtasib must inspect their measures, ratls and scales, and forbid them to mix poor goods with good, old dates with new, to sprinkle water on dates and dried grapes to raise the weight, or oil on the dried grapes to brighten their colour, to wet dates with sugar-cane juice thinned with hot water, or to recondition stale oil with safflower oil — betrayed by a choking smoke on the fire — or oil in which cheese has stood in casks — betrayed by a greasy crackle over the lamp-flame — or to thin vinegar with water, betrayed because pure vinegar froths when poured on the ground while a sprig of water-moss drinks the water and leaves the vinegar. Ibn al-Ukhuwwa's chapter on the small traders warns against mixing stocks, orders the cheese-friers to use only fresh sesame oil, and watches their pickles and the bees' honey adulterated with gum. In Evliya's Istanbul a sixth inspector governs the butter magazine, taking the tithe of fresh and melted butter and every kind of oil, an inspectorship farmed for seven million aspers a year; below him stand a thousand butter-merchants and twelve hundred and eighty-five oil-merchants in six hundred shops. Lane's Cairo oilman — the zeiyat — still sells oil, butter, cheese and honey from one shop."
  ur: "سمان یا زیات بازار کا دسمہ فروش ہے: مکھن، گھی، تیل، پنیر، شہد، اچار اور سرکہ۔ الشیزری گھی فروخت کرنے والوں کا الگ باب لکھتا ہے: محتسب ان کے پیمانے، رطل اور ترازو جانچے؛ بُرے کو اچھے میں، پرانے کھجوروں کو نئی میں ملانے، کھجوروں اور کشمش پر پانی چھڑک کر وزن بڑھانے، کشمش پر تیل ڈال کر رنگ نکھارنے، کھجوروں کو گنے کے رس اور گرم پانی سے تر کرنے، باسی تیل کو قرطم کے تیل سے ٹھیک کرنے — جس کی پہچان آگ پر دم گھٹنے والا دھواں ہے — اور اس تیل سے جس میں پنیر کپوں میں رکھا رہا — جس کی پہچان چراغ کی لو پر چٹچٹاہٹ ہے — اور سرکے میں پانی ملانے سے منع کرے، کیونکہ خالص سرکہ زمین پر اُٹھایا جھاگتا ہے اور طحلب کی ٹہنی پانی پی کر سرکہ چھوڑ دیتی ہے۔ ابن الاخوہ چھوٹے بیوپاریوں کے باب میں مال ملانے سے روکتا، پنیر تلنے والوں کو صرف تازہ تل کا تیل چلانے کا حکم دیتا اور ان کے اچار اور صمغ سے ملاوٹ والے شہد پر نظر رکھتا ہے۔ اولیاء کے استنبول میں چھٹا ناظر مکھن کے ذخیرے کا ہے جو تازہ اور پگھلے مکھن اور ہر قسم کے تیل کا دہائی لیتا اور وہ منصب سالانہ ستر لاکھ اقچہ ٹھیکے پر دیا جاتا؛ اس کے نیچے ہزار مکھن فروش اور بارہ سو پچاسی تیل فروش چھ سو دکانوں میں ہیں۔ لین کا قاہرین «زیات» ایک ہی دکان سے تیل، مکھن، پنیر اور شہد بیچتا ہے۔"
  es: "El samman o zayyat era el comerciante del mercado de grasas: mantequilla y mantequilla clarificada, aceite, queso, miel, encurtidos y vinagre. Al-Shayzari dedica un capítulo entero a los vendedores de mantequilla clarificada: el muhtasib debe inspeccionar sus medidas, ratls y balanzas, y prohibirles mezclar productos de mala calidad con buenos, dátiles viejos con nuevos, rociar agua sobre los dátiles y las uvas pasas para aumentar su peso, o aceite sobre las uvas pasas para realzar su color, mojar los dátiles con jugo de caña de azúcar diluido con agua caliente, o reacondicionar aceite rancio con aceite de cártamo —lo cual se delata por un humo asfixiante en el fuego— o aceite en el que el queso ha reposado en barriles —lo cual se delata por un crepitar grasiento sobre la llama de la lámpara— o diluir vinagre con agua, lo cual se delata porque el vinagre puro hace espuma al verterlo en el suelo, mientras que una ramita de musgo acuático bebe el agua y deja el vinagre. El capítulo de Ibn al-Ukhuwwa sobre los pequeños comerciantes advierte contra la mezcla de existencias, ordena a los queseros que utilicen únicamente aceite de sésamo fresco y vigila que sus encurtidos y la miel de las abejas no estén adulterados con goma. En el Estambul de Evliya, un sexto inspector dirige el almacén de mantequilla, recaudando el diezmo de la mantequilla fresca y derretida y de todo tipo de aceite; un puesto de inspector que generaba siete millones de áspers al año. Bajo su mando se encuentran mil comerciantes de mantequilla y mil doscientos ochenta y cinco comerciantes de aceite en seiscientas tiendas. El comerciante de aceite de El Cairo de Lane —el zeiyat— todavía vende aceite, mantequilla, queso y miel en una sola tienda."
  fr: "Le samman ou zayyat était le marchand de matières grasses du marché: beurre et ghee, huile, fromage, miel, cornichons et vinaigre. Al-Shayzari consacre un chapitre entier aux vendeurs de ghee: les muhtasib doivent inspecter leurs mesures, leurs ratls et leurs balances, et leur interdire de mélanger des produits de mauvaise qualité avec des produits de bonne qualité, des dattes anciennes avec des dattes fraîches, d’arroser les dattes et les raisins secs d’eau pour en augmenter le poids, ou d’huiler les raisins secs pour en raviver la couleur, d’humidifier les dattes avec du jus de canne à sucre dilué à l’eau chaude, ou de reconditionner de l’huile rance avec de l’huile de carthame — ce qui se manifeste par une fumée épaisse au-dessus du feu — ou de l’huile dans laquelle du fromage a reposé en fûts — ce qui se manifeste par un crépitement gras au-dessus de la flamme de la lampe — ou de diluer le vinaigre avec de l’eau, ce qui se manifeste par le fait que le vinaigre pur mousse lorsqu’on le verse sur le sol tandis qu’un brin de mousse d’eau absorbe l’eau et laisse le vinaigre. Le chapitre d'Ibn al-Ukhuwwa consacré aux petits commerçants met en garde contre le mélange des stocks, ordonne aux fromagers d'utiliser uniquement de l'huile de sésame fraîche et veille à ce que leurs conserves et leur miel ne soient pas frelatés à la gomme. À Istanbul, dans le roman d'Evliya, un sixième inspecteur gère le magasin de beurre, prélevant la dîme du beurre frais et fondu ainsi que de toutes sortes d'huiles; cette charge d'inspecteur rapporte sept millions d'aspers par an. Sous ses ordres se trouvent un millier de marchands de beurre et mille deux cent quatre-vingt-cinq marchands d'huile, répartis dans six cents boutiques. Au Caire, dans le roman de Lane, le marchand d'huile – le zeiyat – vend encore de l'huile, du beurre, du fromage et du miel dans une seule et même boutique."
  tr: "Tereyağı satıcısı veya yağ tüccarı, pazardaki yağ tüccarıdır: tereyağı, yağ, peynir, bal, turşu ve sirke satar. El-Şeyzari, tereyağı satıcıları için ayrı bir bölüm ayırır: pazar müfettişi onların ölçülerini, ağırlıklarını ve kilolarını kontrol eder ve kötüyü iyiyle karıştırmayı, eski hurmaları yenileriyle karıştırmayı, hurma ve kuru üzümleri ağırlaştırmak için üzerlerine su serpmeyi, renklerini iyileştirmek için kuru üzümlere yağ dökmeyi, hurmaları sıcak suyla karıştırılmış şeker kamışı suyuyla sulamayı, bozulmuş yağı aspir yağıyla kaynatmayı (bunun işareti ateşte boğucu duman çıkarmasıdır), yağı peynir tütsülenmiş yağla karıştırmayı (bunun işareti lamba alevinde cızırtı ve çıtırtı çıkarmasıdır) ve sirkeyi suyla kaynatmayı (bunun işareti saf sirkenin yere döküldüğünde köpürmesi ve bir su yosunu dalının suyu içip sirkeyi bırakmasıdır) yasaklar. Yeğen, küçük çaplı tüccarları malları karıştırmamaları konusunda uyarıyor, peynir kızartma makinelerini sadece taze susam yağıyla kızartma yaptıklarından emin olmak için denetliyor ve sık sık sakızla karıştırılan turşularını ve ballarını izliyor. İstanbul'da, taze ve eritilmiş tereyağının ve her türlü yağın onda birini alan, tereyağı deposunun altıncı bir gözetmeni var. Bu pozisyon için yıllık yedi milyon akçe ödeniyor ve altında altı yüz dükkânda bin tereyağı tüccarı ve bin iki yüz seksen beş yağ tüccarı bulunuyor. Kahire'deki Len'in \"Zayyat\"ında yağ, tereyağı, peynir ve bal birlikte satılıyor."
  id: "Penjual mentega atau pedagang minyak adalah pedagang lemak di pasar: ia menjual mentega, minyak, keju, madu, acar, dan cuka. Al-Shayzari membuat satu bab khusus untuk penjual mentega: inspektur pasar memeriksa takaran, berat, dan timbangan mereka, dan melarang mencampur yang buruk dengan yang baik, mencampur kurma tua dengan yang baru, menyiram air pada kurma dan kismis agar lebih berat, menuangkan minyak pada kismis untuk memperbaiki warnanya, menyirami kurma dengan air tebu yang dicampur dengan air panas, merebus minyak busuk dengan minyak safflower—tandanya adalah asap yang menyesakkan di atas api—mencampur minyak dengan minyak yang telah digunakan untuk mengasapi keju—tandanya adalah mendesis dan berderak di atas nyala lampu—dan merebus cuka dengan air—tandanya adalah cuka murni akan berbusa ketika dituangkan ke tanah, dan sebatang lumut air akan meminum airnya dan meninggalkan cuka. Keponakan itu memperingatkan para pedagang kecil agar tidak mencampur barang dagangan, memeriksa para penggoreng keju untuk memastikan mereka hanya menggoreng dengan minyak wijen segar, dan memantau acar dan madu mereka, yang sering dicampur dengan getah. Di Istanbul, ada pengawas keenam gudang mentega yang mengambil sepersepuluh dari mentega segar dan cair serta semua jenis minyak. Posisinya dibayar tujuh juta akçe per tahun, dan di bawahnya ada seribu pedagang mentega dan seribu dua ratus delapan puluh lima pedagang minyak di enam ratus toko. Di \"Zayyat\" milik Len di Kairo, minyak, mentega, keju, dan madu dijual bersama."
