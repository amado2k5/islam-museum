craft:
  techniques:
    ar: "صنعة السمّان هي حفظ الدسم وبيعه بلا غشّ. يفرض الشيزري تفتيش المكاييل والأرطال والموازين، ويحرّم خلط الرديء بالجيّد والعتيق بالجديد، ورشّ الماء على التمر والزبيب وصبّ الزيت على الزبيب، وسقى التمر بماء القصب الممزوج بالحار، وتغليش الزيت الفاسد بزيت القرطم — علامته الدخان الخانق — وخلط الزيت بزيت أُدخنت فيه الأجبان — علامته أنه يفحّ ويطقس على لهب السراج — وتغليش الخلّ بالماء — علامتها فَوَران الخلّ الصافي إذا سُكب على الأرض وشربُ غصن الطحلب للماء. ويضيف ابن الأخوة اختبار الكبريت في الخلّ، وتجربة الخبز الحار والفتيلة والليمون في الزيت، وتفقّد قلّالي الجبن ليُقلي بزيت سيرج طري، وتصريف الجبن المشوي من مائه الحار، ومراقبة المخللات والمُرّيّ الذي لا يُطبخ على النار، وعسل النحل المغشوش بالصمغ، وحفظ البضائع في أواني الخزف، والمِنَشّة على الذباب، ونظافة الثياب والأيدي والآنية والموازين، وتفقّد الحوانيت المنفردة عن الأسواق. وعند إوليا يأخذ مراقب مخزن السمن العشرَ من السمن الطري والمذاب وكل صنوف الزيت، وتحته المشرفون ⁦(ديدبان)⁩ والسماسرة ⁦(سمسار)⁩ وجامعو الرسوم."
    en: "The butter-merchant's craft is keeping and selling fats without fraud. Al-Shayzari requires inspection of their measures, ratls and scales, and forbids mixing poor with good and old with new: no sprinkling water on dates and dried grapes, no oil poured on the grapes for a brighter colour, no wetting dates with thinned sugar-cane juice; and he lists the tests — reconditioned oil smokes chokingly on the fire, oil adulterated with the cask-oil of cheeses crackles and spits over the lamp-flame, pure vinegar froths when poured on the ground and a sprig of water-moss drinks the added water, and the same moss separates milk mixed with water. Ibn al-Ukhuwwa adds the sulphur test for vinegar, warm bread, a burning wick and lemon-juice for oil, the watch on cheese-friers to fry in fresh sesame oil only, the draining of toasted cheese, the pickles and the murri that must not be cooked over fire, bees' honey adulterated with gum, goods kept in earthenware vessels, the whisk against flies, clean clothes, hands, vessels and scales, and special observation of shops apart from the suqs. In Evliya the butter-magazine inspector takes the tithe of fresh and melted butter and all oils, with overseers (dideban), brokers (simsar) and duty-collectors beneath him."
    ur: "سمان کا ہنر دسمہ کو بغیر ملاوٹ سنوار کر بیچنا ہے۔ الشیزری پیمانوں، رطلوں اور ترازوؤں کی جانچ لازم کرتا اور بُرے کو اچھے، پرانے کو نئے میں ملانے سے روکتا: کھجور اور کشمش پر پانی نہ چھڑکا جائے، کشمش پر رنگ کے لیے تیل نہ ڈالا جائے، کھجوروں کو گنے کے پتلے رس سے تر نہ کیا جائے؛ اور آزمائشیں بتاتا — بگڑا تیل آگ پر دم گھونٹنے والا دھواں دیتا، پنیر کے کپوں کے تیل سے ملا تیل چراغ کی لو پر چٹختا اور پھٹکتا، خالص سرکہ زمین پر جھاگتا اور طحلب کی ٹہنی ملا پانی پی جاتی، وہی ٹہنی پانی ملی دہی الگ کر دیتی۔ ابن الاخوہ سرکے کے لیے گندھک کی آزمائش، تیل کے لیے گرم روٹی، جلتی بتی اور لیموں، پنیر تلنے والوں کو صرف تازہ تل کے تیل میں تلنے کا حکم، بھنے پنیر کا گرم پانی نتھارنا، اچار اور وہ مُرّی جو آگ پر نہ پکائی جائے، صمغ ملا شہد، خزف کے برتنوں میں مال، مکھیوں کے لیے جھاڑ، صاف کپڑے، ہاتھ، برتن اور ترازو، اور بازار سے الگ دکانوں کی خاص نگرانی لکھتا ہے۔ اولیاء میں مکھن ذخیرے کا ناظر تازہ اور پگھلے مکھن اور ہر تیل کا دہائی لیتا اور نیچے نگران ⁦(ديدبان)⁩، دلال ⁦(سمسار)⁩ اور محصول وصول کرنے والے ہیں۔"
