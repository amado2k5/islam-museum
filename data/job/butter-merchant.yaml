summary:
  ar: "السمّان أو الزيّات هو تاجر الدسم في السوق: يبيع السمن والزيت والجبن والعسل والمخللات والخل. يجعل الشيزري باباً كاملاً لبياعي السمن: يفتّش المحتسب مكاييلهم وأرطالهم وموازينهم، ويحرّم خلط الرديء بالجيّد، وخلط التمر العتيق بالجديد، ورشّ الماء على التمر والزبيب ليثقلا، وصبّ الزيت على الزبيب ليحسُن لونه، وسقى التمر بماء قصب السكر الممزوج بالماء الحار، وتغليش الزيت الفاسد بزيت القرطم — وعلامته دخان خانق على النار — وخلط الزيت بزيتٍ أُدخنت فيه الأجبان — وعلامته أنه يفحّ ويطقس على لهب السراج — وتغليش الخلّ بالماء — وعلامتها أن الخلّ الصافي يفور إذا سُكب على الأرض، وأن غصن طحلب الماء يشرب الماء ويترك الخلّ. ويحذّر ابن الأخوة «صغار البياعين» من خلط البضائع، ويفتّش قلّالي الجبن حتى لا يُقلي إلا بزيت سيرج طري، ويراقب مخللاتهم وعسل النحل الذي يُغشّ بالصمغ. وفي إسطنبول إوليا مراقبٌ سادس لمخزن السمن يأخذ عشر السمن الطري والمذاب وكل صنوف الزيت وتُؤجَّر وظيفته بسبعة ملايين أقجة في السنة، وتحته تجار السمن ألفٌ وتجار الزيت ألفٌ ومئتان وخمسة وثمانون في ستمائة دكان. وعند لين «الزيّات» في القاهرة يبيع الزيت والسمن والجبن والعسل معاً."
  en: "The samman or zayyat was the market's dealer in fats: butter and clarified butter, oil, cheese, honey, pickles and vinegar. Al-Shayzari gives the sellers of clarified butter a whole chapter: the muhtasib must inspect their measures, ratls and scales, and forbid them to mix poor goods with good, old dates with new, to sprinkle water on dates and dried grapes to raise the weight, or oil on the dried grapes to brighten their colour, to wet dates with sugar-cane juice thinned with hot water, or to recondition stale oil with safflower oil — betrayed by a choking smoke on the fire — or oil in which cheese has stood in casks — betrayed by a greasy crackle over the lamp-flame — or to thin vinegar with water, betrayed because pure vinegar froths when poured on the ground while a sprig of water-moss drinks the water and leaves the vinegar. Ibn al-Ukhuwwa's chapter on the small traders warns against mixing stocks, orders the cheese-friers to use only fresh sesame oil, and watches their pickles and the bees' honey adulterated with gum. In Evliya's Istanbul a sixth inspector governs the butter magazine, taking the tithe of fresh and melted butter and every kind of oil, an inspectorship farmed for seven million aspers a year; below him stand a thousand butter-merchants and twelve hundred and eighty-five oil-merchants in six hundred shops. Lane's Cairo oilman — the zeiyat — still sells oil, butter, cheese and honey from one shop."
  ur: "سمان یا زیات بازار کا دسمہ فروش ہے: مکھن، گھی، تیل، پنیر، شہد، اچار اور سرکہ۔ الشیزری گھی فروخت کرنے والوں کا الگ باب لکھتا ہے: محتسب ان کے پیمانے، رطل اور ترازو جانچے؛ بُرے کو اچھے میں، پرانے کھجوروں کو نئی میں ملانے، کھجوروں اور کشمش پر پانی چھڑک کر وزن بڑھانے، کشمش پر تیل ڈال کر رنگ نکھارنے، کھجوروں کو گنے کے رس اور گرم پانی سے تر کرنے، باسی تیل کو قرطم کے تیل سے ٹھیک کرنے — جس کی پہچان آگ پر دم گھٹنے والا دھواں ہے — اور اس تیل سے جس میں پنیر کپوں میں رکھا رہا — جس کی پہچان چراغ کی لو پر چٹچٹاہٹ ہے — اور سرکے میں پانی ملانے سے منع کرے، کیونکہ خالص سرکہ زمین پر اُٹھایا جھاگتا ہے اور طحلب کی ٹہنی پانی پی کر سرکہ چھوڑ دیتی ہے۔ ابن الاخوہ چھوٹے بیوپاریوں کے باب میں مال ملانے سے روکتا، پنیر تلنے والوں کو صرف تازہ تل کا تیل چلانے کا حکم دیتا اور ان کے اچار اور صمغ سے ملاوٹ والے شہد پر نظر رکھتا ہے۔ اولیاء کے استنبول میں چھٹا ناظر مکھن کے ذخیرے کا ہے جو تازہ اور پگھلے مکھن اور ہر قسم کے تیل کا دہائی لیتا اور وہ منصب سالانہ ستر لاکھ اقچہ ٹھیکے پر دیا جاتا؛ اس کے نیچے ہزار مکھن فروش اور بارہ سو پچاسی تیل فروش چھ سو دکانوں میں ہیں۔ لین کا قاہرین «زیات» ایک ہی دکان سے تیل، مکھن، پنیر اور شہد بیچتا ہے۔"
