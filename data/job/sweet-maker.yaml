  techniques:
    ar: "يذكر الشيزري من حلوياتهم النطيف والباسنود والزلابية والخبيص والسابونية والكشكنانج الذي يُخبز في التنّور، ويأمر أن تُطهى الحلوى نضجاً وأن يمسك الصانع مذبّة الذباب. ومن غشّهم خلط عسل النحل بعصير العنب وعلامته رائحة العنب عند الطبخ، ومزج قطّارة قصب السكر بالشراب وعلامته ترسّبه في أسفل الإناء، وتكثيف النطيف بالسميد والأصفر بفتات الخبز والزلابية بسكر القصب المذاب بدل العسل؛ وعلامة جملة ذلك أن الحلوى تطفو على وجه الماء."
    en: "Al-Shayzari names among their confections natif, basandid, zulabiyya, khabis, sabuniyya and the kishkananij baked in the tannur, orders the sweets cooked through and the maker to keep a fly-whisk in hand. Their frauds include mixing bees' honey with grape pulp — known by its smell of grapes when cooked — stirring cane-juice syrup (qattara) into syrup, known because it settles at the bottom of the vessel, thickening natif with semolina and the yellow sort with breadcrumbs, and cooking zulabiyya in dissolved cane sugar instead of honey; the general sign of these adulterations is that the confection floats on water."
    ur: "الشیزری ان کی مٹھائیوں میں نطیف، باسنود، زلابیہ، خبیص، سابونیہ اور تنور میں پکنے والی کشکنانج گنواتا ہے، اور حکم ہے کہ حلو اچھی طرح پکائی جائے اور بنانے والا مکھی بھگانے کا بچھوا ہاتھ میں رکھے۔ دھوکھوں میں ہے شہد میں انگور کا رس ملانا جس کی پہچان پکتے وقت انگور کی بو ہے، شراب میں گنے کا عرق ⁦(قطارہ)⁩ ملانا جو برتن کے تل میں بیٹھ جاتا ہے، نطیف کو سوجی اور زرد حلو کو روٹی کے چورے سے گاڑھا کرنا، اور زلابیہ کو شہد کے بجائے گلے ہوئے شکر میں پکانا؛ ان سب کی عام علامت یہ ہے کہ حلو پانی پر تیرتی ہے۔"
