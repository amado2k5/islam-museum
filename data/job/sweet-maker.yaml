summary:
  ar: "الحلواني هو صانع الحلوى بالعسل والسكر والدقيق والمكسرات. يقرّ الشيزري بكثرة أنواع الحلويات واختلاف مقاديرها فيُسنِد معرفتها إلى العارف، ويأمر أن تُطهى الحلوى نضجاً لا نيئاً ولا محروقاً وأن يمسك الصانع المذبّة ليطرد الذباب، ثم يسرد غشّهم: خلط العسل بعصير العنب، ومزج القطّارة بالشراب، وتكثيف الحلوى بالدقيق والنشا ودقيق الأرز والعدس وقشور السمسم، وعلامة ذلك أنها تطفو على الماء. وفي إسطنبول إوليا جلبي للحلواجية طوائف منها أربعمئة رجل في مئة وسبعين دكاناً وخمسمئة حلواني بلا دكاكين يحملون الصحاف على رؤوسهم."
  en: "The halwani made sweets from honey, sugar, flour and nuts. Al-Shayzari concedes that confectionery kinds and measures are beyond counting and leaves their detail to the 'arif; the confection must be cooked through, neither raw nor burnt, and the maker must keep a fly-whisk in hand. He then lists their frauds: honey mixed with grape pulp, cane juice stirred into syrup, sweets thickened with flour, cornstarch, rice and lentil flour and sesame husks — betrayed, he says, when the sweet floats on water. In Evliya's Istanbul the halva-makers numbered four hundred men in a hundred and seventy shops, with five hundred more hawking trays on their heads."
  ur: "حلوائی شہد، شکر، آٹے اور خشک میوے سے مٹھائیاں بناتا تھا۔ الشیزری مانتا ہے کہ حلو کی اقسام اور ان کے ناپ شمار سے باہر ہیں اور ان کی جانچ عارف کے سپرد کرتا ہے؛ حلو اچھی طرح پکی ہو، نہ کچی نہ جلی، اور بنانے والے کے ہاتھ میں مکھی بھگانے کا بچھوا ہو۔ پھر ان کے دھوکھے گنواتا ہے: شہد میں انگور کا رس، شربت میں گنے کا عرق، حلو کو آٹے، کارن اسٹارچ، چاول و مسور کے آٹے اور تل کی بھوسی سے گاڑھا کرنا — اور پہچان یہ کہ حلو پانی پر تیرتی ہے۔ اولیاء چلبی کے استنبول میں حلوہ ساز ایک سو ستر دکانوں پر چار سو آدمی تھے اور مزید پانچ سو اپنے سر پر سینیاں اٹھا کر پھرتے تھے۔"
  es: "El halwani preparaba dulces con miel, azúcar, harina y nueces. Al-Shayzari reconoce que la variedad y las medidas de los dulces son incontables y deja los detalles al 'arif; el dulce debe estar bien cocido, ni crudo ni quemado, y el fabricante debe tener siempre a mano un espantamoscas. A continuación, enumera sus fraudes: miel mezclada con pulpa de uva, jugo de caña disuelto en jarabe, dulces espesados con harina, almidón de maíz, harina de arroz y lentejas y cáscaras de sésamo; se delatan, dice, cuando el dulce flota en el agua. En el Estambul de Evliya, los fabricantes de halva sumaban cuatrocientos hombres en ciento setenta tiendas, con quinientos más que vendían bandejas sobre sus cabezas."
  fr: "Les halwanis confectionnaient des douceurs à base de miel, de sucre, de farine et de noix. Al-Shayzari reconnaît que les variétés et les quantités de confiseries sont innombrables et laisse le soin aux 'arif d'en définir les détails; la confiserie doit être parfaitement cuite, ni crue ni brûlée, et le fabricant doit toujours avoir un chasse-mouches à portée de main. Il énumère ensuite leurs fraudes: du miel mélangé à de la pulpe de raisin, du jus de canne incorporé à du sirop, des douceurs épaissies avec de la farine, de la fécule de maïs, de la farine de riz et de lentilles et des coques de sésame – trahies, dit-il, lorsque la douceur flotte sur l'eau. À Istanbul, sous le règne d'Evliya, les fabricants de halva étaient quatre cents hommes répartis dans cent soixante-dix boutiques, et cinq cents autres vendaient ambulamment leurs plateaux sur la tête."
  tr: "Şekerci, bal, şeker, un ve kuruyemişlerden tatlı yapan kişidir. El-Şeyzari, tatlıların bolluğunu ve oranlarındaki çeşitliliği kabul ederek, bunların hazırlanmasıyla ilgili bilgiyi uzmanlara bırakır. Tatlıların iyice pişirilmesi, ne çiğ ne de yanmış olmaması gerektiğini ve şekercinin sinekleri uzaklaştırmak için sinek kovucu kullanması gerektiğini belirtir. Ardından, aldatıcı uygulamalarını sıralar: balı üzüm suyuyla karıştırmak, şurubu pekmezle birleştirmek ve tatlıları un, nişasta, pirinç unu, mercimek ve susam kabuğuyla koyulaştırmak; bunların işareti, tatlıların suda yüzmesidir. İstanbul'da şekerciler, 170 dükkânda 400 kişiden oluşan loncalar halinde örgütlenmişti ve dükkânsız 500 şekerci de tepsilerini başlarında taşıyarak çalışıyordu."
  id: "Seorang pembuat manisan adalah pembuat kue-kue yang terbuat dari madu, gula, tepung, dan kacang-kacangan. Al-Shayzari mengakui banyaknya jenis manisan dan variasi proporsinya, mendelegasikan pengetahuan tentang pembuatannya kepada ahlinya. Ia menginstruksikan agar manisan dimasak hingga matang, tidak mentah maupun gosong, dan agar pembuat manisan menggunakan pengocok lalat untuk mengusir lalat. Kemudian ia mencantumkan praktik-praktik penipuan mereka: mencampur madu dengan jus anggur, menggabungkan sirup dengan molase, dan mengentalkan manisan dengan tepung, pati, tepung beras, lentil, dan sekam wijen, yang cirinya adalah manisan tersebut mengapung di air. Di Istanbul, para pembuat manisan diorganisir menjadi serikat, termasuk empat ratus pria di seratus tujuh puluh toko, dan lima ratus pembuat manisan tanpa toko, yang membawa nampan mereka di atas kepala."
