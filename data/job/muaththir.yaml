summary:
  ar: "المؤثّر — ويشيع جمعه «المؤثرون» — من يبني جمهوراً على منصات التواصل فيوجّه رأيه وذوقه وشراءه ودعوته بالمحتوى المنتظم؛ والمهنة أحدث حلقة في سلسلة الكلمة العامة التي بدأت بالمنادي والخطيب ثم الصحفي والمذيع، إلا أنها بلا بوابة مهنية: لا تعيين ولا براءة ولا نقابة، بل حسابٌ يقوم على الثقة والمتابعة والخوارزمية. في الفضاء الإسلامي ظهر الداعية المؤثر والواعظ المقطعي والمعلّم المصوَّر على يوتيوب وتيك توك وإنستغرام وسناب شات، يقاس عمله بالمشاهدة والمشاركة والأثر المقروء لا بالمرتّب الوقفي، وتثير مهنته أسئلة الإعلان الخفي والمصداقية والمسؤولية عن المتابعين."
  en: "The muaththir — commonly plural muaththirun, 'influencers' — builds an audience on social platforms and steers its opinion, taste, buying and devotion through regular content; the newest link in the chain of public speech that began with crier and preacher, then journalist and broadcaster, except it has no professional gate: no appointment, no berat, no syndicate — an account resting on trust, followers and the algorithm. In the Islamic space the da'wah influencer, the clip preacher and the teaching creator on YouTube, TikTok, Instagram and Snapchat measure their work by views, shares and readership rather than a waqf salary, and the trade raises questions of hidden advertising, credibility and responsibility to followers."
  ur: "مؤثر — جس کا شائع جمع «مؤثرون» ہے — وہ ہے جو سماجی پلیٹ فارم پر سامعین بناتا اور مسلسل مواد سے ان کی رائے، ذوق، خرید اور دعوت پر اثر ڈالتا ہے؛ یہ عوامی کلام کی اس زنجیر کی تازہ کڑی ہے جو منادی اور خطیب سے ہوتی ہوئی صحافی اور مذیع تک آئی، مگر اس کا کوئی پیشہ ورانہ دروازہ نہیں: نہ تعیناتی، نہ برات، نہ انجمن — صرف اعتماد، پیروکار اور الگورتھم پر قائم اکاؤنٹ۔ اسلامی فضا میں یوٹیوب، ٹک ٹاک، انسٹاگرام اور سنیپ چیٹ پر داعی، قصیر ویڈیو واعظ اور معلم کنندہ ظاہر ہوئے جن کا کام تنخواہ سے نہیں بلکہ دیکھے جانے، بانٹے جانے اور اثر سے ناپا جاتا ہے، اور پیشہ پوشیدہ اشتہار، ساکھ اور پیروکاروں کی ذمہ داری کے سوالات اٹھاتا ہے۔"
