summary:
  ar: "المؤثّر — ويشيع جمعه «المؤثرون» — من يبني جمهوراً على منصات التواصل فيوجّه رأيه وذوقه وشراءه ودعوته بالمحتوى المنتظم؛ والمهنة أحدث حلقة في سلسلة الكلمة العامة التي بدأت بالمنادي والخطيب ثم الصحفي والمذيع، إلا أنها بلا بوابة مهنية: لا تعيين ولا براءة ولا نقابة، بل حسابٌ يقوم على الثقة والمتابعة والخوارزمية. في الفضاء الإسلامي ظهر الداعية المؤثر والواعظ المقطعي والمعلّم المصوَّر على يوتيوب وتيك توك وإنستغرام وسناب شات، يقاس عمله بالمشاهدة والمشاركة والأثر المقروء لا بالمرتّب الوقفي، وتثير مهنته أسئلة الإعلان الخفي والمصداقية والمسؤولية عن المتابعين."
  en: "The muaththir — commonly plural muaththirun, 'influencers' — builds an audience on social platforms and steers its opinion, taste, buying and devotion through regular content; the newest link in the chain of public speech that began with crier and preacher, then journalist and broadcaster, except it has no professional gate: no appointment, no berat, no syndicate — an account resting on trust, followers and the algorithm. In the Islamic space the da'wah influencer, the clip preacher and the teaching creator on YouTube, TikTok, Instagram and Snapchat measure their work by views, shares and readership rather than a waqf salary, and the trade raises questions of hidden advertising, credibility and responsibility to followers."
  ur: "مؤثر — جس کا شائع جمع «مؤثرون» ہے — وہ ہے جو سماجی پلیٹ فارم پر سامعین بناتا اور مسلسل مواد سے ان کی رائے، ذوق، خرید اور دعوت پر اثر ڈالتا ہے؛ یہ عوامی کلام کی اس زنجیر کی تازہ کڑی ہے جو منادی اور خطیب سے ہوتی ہوئی صحافی اور مذیع تک آئی، مگر اس کا کوئی پیشہ ورانہ دروازہ نہیں: نہ تعیناتی، نہ برات، نہ انجمن — صرف اعتماد، پیروکار اور الگورتھم پر قائم اکاؤنٹ۔ اسلامی فضا میں یوٹیوب، ٹک ٹاک، انسٹاگرام اور سنیپ چیٹ پر داعی، قصیر ویڈیو واعظ اور معلم کنندہ ظاہر ہوئے جن کا کام تنخواہ سے نہیں بلکہ دیکھے جانے، بانٹے جانے اور اثر سے ناپا جاتا ہے، اور پیشہ پوشیدہ اشتہار، ساکھ اور پیروکاروں کی ذمہ داری کے سوالات اٹھاتا ہے۔"
  es: "El muaththir —generalmente en plural muaththirun, «influencers»— crea una audiencia en plataformas sociales y dirige su opinión, gusto, compras y devoción a través de contenido regular; el eslabón más reciente en la cadena de la expresión pública que comenzó con el pregonero y el predicador, luego el periodista y el locutor, solo que sin barreras profesionales: sin nombramiento, sin berat, sin sindicato; una cuenta que se basa en la confianza, los seguidores y el algoritmo. En el ámbito islámico, el influencer de la da'wah, el predicador de vídeos y el creador de enseñanzas en YouTube, TikTok, Instagram y Snapchat miden su trabajo por visualizaciones, comparticiones y lectores en lugar de un salario waqf, y este oficio plantea interrogantes sobre publicidad encubierta, credibilidad y responsabilidad hacia los seguidores."
  fr: "Le muaththir — souvent désigné au pluriel par muaththirun, « influenceur » — se constitue une audience sur les réseaux sociaux et oriente ses opinions, ses goûts, ses achats et sa dévotion grâce à un contenu régulier. Dernier maillon de la chaîne de la parole publique, initiée par le crieur public et le prédicateur, puis le journaliste et l'animateur, il se distingue par l'absence de cadre professionnel: pas de nomination, pas de berat, pas de syndicat — un compte qui repose sur la confiance, les abonnés et les algorithmes. Dans le milieu islamique, l'influenceur de la da'wah, le prédicateur en vidéo et le créateur de contenu pédagogique sur YouTube, TikTok, Instagram et Snapchat mesurent leur travail en vues, partages et audience plutôt qu'en revenus d'un waqf (fondation religieuse). Ce commerce soulève des questions de publicité déguisée, de crédibilité et de responsabilité envers les abonnés."
  tr: "Bir etkileyici (influencer) veya \"etkileyiciler\", sosyal medya platformlarında bir kitle oluşturan, tutarlı içerik aracılığıyla onların görüşlerini, zevklerini, satın alımlarını ve etkileşimlerini şekillendiren kişidir. Bu meslek, hatip ve vaizle başlayan, ardından gazeteci ve yayıncıyla devam eden kamu söylemi zincirinin en son halkasıdır. Ancak, profesyonel bir çerçeveden yoksundur: atama yok, sertifika yok, sendika yok, sadece güvene, takipçilere ve algoritmalara dayalı bir hesap. İslam dünyasında, etkili vaiz, kısa metin vaizi ve video öğretmeni YouTube, TikTok, Instagram ve Snapchat'te ortaya çıkmıştır. Çalışmaları, bağış gelirleriyle değil, izlenme, paylaşım ve okunabilir etkiyle ölçülür. Bu meslek, gizli reklamcılık, güvenilirlik ve takipçilere karşı sorumluluk konularında soruları gündeme getiriyor."
  id: "Seorang influencer—atau \"para influencer\"—adalah seseorang yang membangun audiens di platform media sosial, membentuk opini, selera, pembelian, dan jangkauan mereka melalui konten yang konsisten. Profesi ini merupakan mata rantai terbaru dalam wacana publik, yang dimulai dengan orator dan pendakwah, kemudian jurnalis dan penyiar. Namun, profesi ini tidak memiliki kerangka kerja profesional: tidak ada penunjukan, tidak ada sertifikasi, tidak ada serikat pekerja, hanya akun yang didasarkan pada kepercayaan, pengikut, dan algoritma. Di dunia Islam, pendakwah berpengaruh, pendakwah singkat, dan guru video telah muncul di YouTube, TikTok, Instagram, dan Snapchat. Karya mereka diukur berdasarkan jumlah penayangan, berbagi, dan dampak yang dapat dibaca, bukan berdasarkan pendapatan mereka. Profesi ini menimbulkan pertanyaan tentang iklan terselubung, kredibilitas, dan tanggung jawab terhadap pengikut."
