summary:
  ar: "الخزاف هنا صانع البلاطات المزجّجة التي تكسو جدران العمارة الإسلامية. تصف موسوعة TDV تطور ذلك من خزف سامراء ذي البريق المعدني إلى فسيفساء القاشاني المقطوعة عند السلاجقة، ثم الألوان المطلية تحت الطلاء في إزنيق، ثم انتقال المركز إلى كوتاهية. وتسمي من التوقيعات مرندلي وتوسلي ومحمد المجنون وعلي بن إلياس علي البروسوي، ولا تصف الأفران ولا الطوائف."
  en: "The potter here is the maker of the glazed tiles that clothe the walls of Islamic architecture. The TDV encyclopaedia follows the craft from the lustre ware of Samarra to the cut tile mosaic of the Seljuks, the underglaze colours of Iznik and the move of the centre to Kutahya. It names the makers Merendli, the Tusi master, Muhammad al-Majnun and Ali ibn Ilyas Ali of Bursa, and it does not describe kilns or guilds."
  ur: "یہاں کمہار سے مراد ان چمکدار ٹائلوں کا کاریگر ہے جو اسلامی عمارتوں کی دیواروں کو ڈھانپتی ہیں۔ ٹی ڈی وی کا مدخل اس ہنر کو سامرا کے دھاتی چمک والے برتنوں سے سلجوقیوں کی کٹی ہوئی ٹائل موزیک، ازنیق کے شیشے کے نیچے کے رنگوں اور مرکز کے کوتاہیہ منتقل ہونے تک دیکھتا ہے۔ وہ مرندلی، طوس کے استاد، محمد المجنون اور بورصہ کے علی بن الیاس علی کے نام لیتا ہے، اور بھٹیوں یا جماعتوں کا حال نہیں بتاتا۔"
