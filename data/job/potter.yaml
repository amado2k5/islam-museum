  techniques:
    ar: "من التقنيات التي يذكرها المدخل: البريق المعدني بأكاسيد الفضة والنحاس على طلاء أبيض أو أرجواني أو فيروزي، وفسيفساء القاشاني المقطوعة وتُثبت بالجص، والمينائي بسبعة ألوان تُرسم فوق طلاء مشوي ثم يعاد شيّها، والنقش بالحز، والطلاء الملون على جسم أحمر بحدود بارزة تمنع جريان الألوان، والأبيض والأزرق تحت طلاء شفاف، ثم الرسم تحت الطلاء مع أحمر المرجان من النصف الثاني للقرن السادس عشر."
    en: "The entry names these techniques: lustre painted in silver and copper oxides over a white, purple or turquoise glaze; cut tile mosaic set in plaster; mina'i, with seven colours painted over a fired glaze and fired again; incised tile; coloured glaze on a red body with raised outlines to keep the colours from running; blue-and-white under a clear glaze; and painting under the glaze, with coral red added from the second half of the sixteenth century."
    ur: "مدخل یہ تکنیکیں بیان کرتا ہے: سفید، ارغوانی یا فیروزی شیشے پر چاندی اور تانبے کے آکسائیڈ سے دھاتی چمک؛ گچ میں جمی کٹی ہوئی ٹائل موزیک؛ مینائی، جس میں پکے ہوئے شیشے پر سات رنگ بنا کر دوبارہ پکایا جاتا ہے؛ کھدی ہوئی ٹائل؛ سرخ جسم پر ابھری ہوئی حدوں کے ساتھ رنگین شیشہ تاکہ رنگ نہ بہیں؛ شفاف شیشے کے نیچے نیلا سفید؛ اور سولھویں صدی کے دوسرے نصف سے مرجانی سرخ کے ساتھ شیشے کے نیچے نقاشی۔"
