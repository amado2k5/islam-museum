era:
  origins: prophetic
  first_attested:
    edtf: "0610/0632"
    precision: decade
    status: historical
    note: "The entry says the root occurs about twenty times in the Qur'an, mostly in the sense of understanding deeply, and that in the Prophet's own time a faqih was described as an understanding, conscious and upright scholar of religion. The technical sense, the discipline of practical law, appears from the late second Islamic century (about the late eighth century CE), so the first-attested range is the widest the entry's account of the root supports."
    sources: [source/tdv-fakih, source/tdv-fikih]
  status_today: transformed
places:
  - place: place/medina
    note: "The Hijazi group of jurists worked from the practice of Medina, which they treated as a living Sunna; Malik taught there. The entry gives no date for the group's peak."
    sources: [source/tdv-fikih]
  - place: place/kufa
    note: "The Iraqi group relied more on opinion. Ibn Mas'ud settled in Kufa and served there as teacher, judge and mufti, and the Iraqi jurists took their learning from him and from Ali's circle."
    sources: [source/tdv-fikih]
  - place: place/iraq
    start: { edtf: "0846" }
    end: { edtf: "0946" }
    note: "In the first Abbasid period as the entry periodises it (846 to 946), judges in Iraq ruled by the Hanafi school, in Syria and the Maghreb by the Maliki school, and in Egypt by the Shafi'i school. A judge who heard a case from a litigant of another school appointed a deputy of that litigant's school for the case."
    sources: [source/tdv-fikih]
