training:
  mode: ijaza-chain
  certification: "Oral permission from a master to give fatwas and to teach, granted after study. From the medrese period, a written ijaza for teaching and fatwa (iftā and tedris) after an examination, which in the Ottoman state qualified the holder as judge or mufti. In Egypt (1872) and in the Istanbul Darulhilafe medreses (1914) the general ijaza became an official diploma. The Imami tradition added the marja's office, described in the article."
