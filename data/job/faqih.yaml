id: job/faqih
class: job
label: { ar: "الفقيه", en: "Jurist (faqih)", ur: "فقیہ" }
summary:
  ar: "الفقيه هو العالم بالأحكام العملية للشريعة، يستنبطها من أدلتها أو ينقلها عن مذهب معتمد، فيفتي بها ويعلّمها. كان اللفظ في الصدر الأول يدل على الفهم العميق للدين عامة، ثم استقر منذ أواخر القرن الثاني الهجري على علم الفقه، ومع نشوء المذاهب صار الفقيه غالباً تلميذاً لإمام مذهب ينقل قوله ويدافع عنه. والفقيه غير القاضي: يعرف الحكم ويُفتي به، أما القاضي فيحكم في الخصومة بولاية يتولاها."
  en: "The jurist (faqih) is the scholar of the practical rules of the sharia. He derives a rule from its sources, or takes it from an accepted school, and then gives opinions and teaches. In the earliest period the word meant a deep understanding of religion in general. From the late second Islamic century it named the discipline of law, and once the schools took shape a jurist was usually a student who transmitted and defended the teaching of a school's founder. A jurist is not a judge: he knows the rule and gives opinions; the judge settles a dispute under an appointment."
  ur: "فقیہ وہ عالم ہے جو شریعت کے عملی احکام جانتا ہے، انہیں ماخذ سے نکالتا ہے یا کسی معتبر مذہب سے لیتا ہے، پھر فتویٰ دیتا اور پڑھاتا ہے۔ ابتدائی دور میں لفظ دین کی عمومی گہری سمجھ کے لیے آتا تھا، اور دوسری صدی ہجری کے آخر سے یہ فقہ کے علم کا نام بن گیا۔ فقیہ قاضی نہیں: وہ حکم جانتا اور فتویٰ دیتا ہے، جبکہ قاضی مقرر ہو کر جھگڑا نمٹاتا ہے۔"
