summary:
  ar: "لاعب خيال الظل — قره‌گوزچي، خيالي — يقيم وحده العرض كله: يحرّك الصور خلف الستارة المضاءة بمهارة يده، ويمنح كل شخصية صوتها من المرأة والطفل إلى اللهجات العثمانية، فيكون الممثّل والمخرج ومصمّم الرقصات، ويقصّ الجلد ويلوّنه رسّاماً للتصاوير. دخل العرض بلاد العثمانيين في القرن السادس عشر من مصر؛ يحدّث ابن إياس أن لاعباً مملوكياً مثّل أمام ياووز سلطان سليم مشهد إعدام طومان باي على جزيرة الروضة، فأعجبه وأراد لابنه أن يشاهده، وجاء مع السلطان نحو ستمائة فنان مصري إلى إستانبول. وفي القرن التالي صنع الترك التصاوير من جلد شفاف مفصّل يتحرّك، وظهر اسم قره‌گوز لأول مرة."
  en: "The shadow puppeteer — karagözcü, hayâlî — mounts the whole show alone: moving the figures behind the lit screen with his hands, giving every person its voice from woman and child to the dialects of the empire, so that he is at once actor, director and choreographer, and the painter who cuts and colours the leather figures. The play entered Ottoman lands from Egypt in the sixteenth century: Ibn Iyas tells that a Mamluk shadow-player performed before Selim I the hanging of Tumanbay on Roda island, which pleased the sultan so much that he wanted his son to see it, and some six hundred Egyptian artists came with him to Istanbul. In the next century Turkish artists made the figures translucent, jointed leather, and the name Karagöz appeared for the first time."
  ur: "سایہ باز — قرہ‌گوزچی، خیالی — سارا تماشہ تنہا چلاتا ہے: روشن پردے کے پیچھے ہاتھ کی مہارت سے پتلے حرکت دیتا، ہر کردار کو اس کی آواز دیتا — عورت اور بچے سے لے کر سلطنت کی بولیوں تک — وہی اداکار، ڈائریکٹر، کوریوگرافر اور چمڑے کے پتلے کاٹ کر رنگنے والا مصور ہے۔ یہ کھیل سولہویں صدی میں مصر سے عثمانی ملک آیا: ابن ایاس کے مطابق ایک مملوک سایہ باز نے سلطان سلیم کے سامنے روضہ جزیرے پر طومان بائی کی پھانسی دکھائی، جو اسے بہت بھائی اور اس نے چاہا کہ بیٹا بھی دیکھے، اور اس کے ساتھ تقریباً چھ سو مصری فنکار استنبول آئے۔ اگلی صدی میں ترک فنکاروں نے پتلے شفاف، جوڑ دار چمڑے کے بنائے اور قرہ‌گوز نام پہلی بار نمودار ہوا۔"
