  certification: "Evliya lists among the Constantinople guilds the Shebbazan, night-players who represented the ombres chinoises, and the Khial-tassvirjian who performed with painted figures; the karagözcü's own skill joined acting, direction, choreography and figure-making in one hand {cite:evliya-narrative-hammer-v2} {cite:tdv-karagoz}."
  duration: "Every play runs in four independent parts — mukaddime, muhâvere, fasıl and bitiş — which each karagözcü reshapes to his own taste; mastery is measured in the handling of these parts and the voices {cite:tdv-karagoz}."
