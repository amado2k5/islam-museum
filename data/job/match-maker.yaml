summary:
  ar: "الفتيلجي يغزل فتيل البندقية الناري — الحبل البطيء الاحتراق الذي يُشعَل في قفل الفتيل لإطلاق البارود. في موكب إسطنبول عدّ إوليا صنّاع الفتيل ⁦(فتيلجيان)⁩ خمسين رجلاً بثلاثين دكاناً، بيرهم النبي — يقول إوليا لأنه أول من أحرق حبلاً على هيئة فتيل — وهم يمرّون يغزلون فتائل من سبعة خيوط قطنية؛ ويتبعهم رئيس صنّاع القِسيّ ورئيس البندقجية مع مشايخهم وكياهيهم وجاوشهم على الخيل العربية، ومعاونو رئيس البندقجية كلهم عسكريون، فالفتيل سلاح لا حلية. ويصف إلغود في فصل أسلحة بخارا البندقية ذات فتيل ⁦(ملتوق)⁩ ذات الشوكة الطويلة المعلّقة بالسبطانة لتكون مسنداً — وهي البندقية التي كان فتيلها يُقتَطع من مثل هؤلاء الصنّاع."
  en: "The fitilji twisted the gunner's match — the slow-burning cord clamped in the matchlock's jaws to fire the powder. In Evliya's Istanbul procession the match-makers (Fitiljian) were fifty men in thirty shops; their patron is the Prophet — because, Evliya says, he first burned a rope in the shape of a match — and they pass twisting matches of seven cotton strings. They march among the arms-makers: after them come the head of the shaft-makers and the head of the gun-makers with their seniors, sheykhs, kyayas and chaushes on Arabian horses, and the gun-makers' assistants are all military men — the match was a munition, not an ornament. Elgood's account of Bukharan arms describes the matchlock (miltyk), its long fork attached to the barrel as a rest — the very gun whose burning cord was cut from cord such as these makers twisted."
  ur: "فتیلجی توپچی کا فتیتا مروڑتا ہے — وہ آہستہ جلنے والی رسی جو فتیتہ دار بندوق کے چڑیا میں کس کر بارود جلاتی ہے۔ اولیاء کے استنبول کے جلوس میں فتیتا ساز ⁦(فتیلجیان)⁩ پچاس آدمی تیس دکانیں ہیں؛ اولیاء کے بقول ان کا پیر نبی ہے کیونکہ اسی نے پہلے رسی کو فتیتے کی شکل میں جلایا، اور وہ سات سوترے دھاگوں کے فتیتے مروڑتے نکلتے۔ انہی کے پیچھے ساختہ سازوں کے سردار اور بندوق سازوں کے سردار اپنے بزرگوں، شیخوں، قیّہوں اور چاوشوں کے ساتھ عرب گھوڑوں پر آتے، اور بندوق ساز سردار کے معاون سب فوجی ہیں — فتیتا اسلحہ ہے، زینت نہیں۔ ایلگڈ بخارا کے اسلحے میں فتیتہ دار بندوق ⁦(ملتوق)⁩ بتاتا ہے جس کے نال سے ایک لمبی کانٹا آرا چوکی لگی ہوتی — وہی بندوق جس کی جلتی رسی ایسے ہی دستکاروں کے مروڑے رسیوں سے کٹی جاتی۔"
