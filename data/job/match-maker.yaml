  techniques:
    ar: "الصنعة غزل الفتيل: سبعة خيوط قطنية تُفتَل حبلاً بطيء الاحتراق يُشعَل طرفه ويُثَبَّت في فكّ قفل الفتيل حتى يصل إلى مقبض البارود فيطلق النار. وعند إوليا يعرض الصنّاع غزلهم وهم يمرّون في الموكب بين صنّاع القِسيّ والبنادق."
    en: "The craft is the twisting of the match: seven cotton strings laid into a slow-burning cord whose lit end is clamped in the jaws of the matchlock until it reaches the powder pan and fires. In Evliya the makers show their twisting as they pass in the procession between the shaft-makers and the gun-makers."
    ur: "ہنر فتیتہ مروڑنا ہے: سات سوترے دھاگے ایسی آہستہ جلنے والی رسی میں لپیٹے جاتے جس کا دہکتا سرا فتیتہ دار قفل کے چڑیا میں کسا جاتا یہاں تک کہ بارود کے طشتری تک پہنچ کر فائر کرے۔ اولیاء میں دستکار جلوس میں چلتے ہوئے اپنی مروڑ دکھاتے، ساختہ سازوں اور بندوق سازوں کے درمیان۔"
