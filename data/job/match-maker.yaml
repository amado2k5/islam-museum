summary:
  ar: "الفتيلجي يغزل فتيل البندقية الناري — الحبل البطيء الاحتراق الذي يُشعَل في قفل الفتيل لإطلاق البارود. في موكب إسطنبول عدّ إوليا صنّاع الفتيل ⁦(فتيلجيان)⁩ خمسين رجلاً بثلاثين دكاناً، بيرهم النبي — يقول إوليا لأنه أول من أحرق حبلاً على هيئة فتيل — وهم يمرّون يغزلون فتائل من سبعة خيوط قطنية؛ ويتبعهم رئيس صنّاع القِسيّ ورئيس البندقجية مع مشايخهم وكياهيهم وجاوشهم على الخيل العربية، ومعاونو رئيس البندقجية كلهم عسكريون، فالفتيل سلاح لا حلية. ويصف إلغود في فصل أسلحة بخارا البندقية ذات فتيل ⁦(ملتوق)⁩ ذات الشوكة الطويلة المعلّقة بالسبطانة لتكون مسنداً — وهي البندقية التي كان فتيلها يُقتَطع من مثل هؤلاء الصنّاع."
  en: "The fitilji twisted the gunner's match — the slow-burning cord clamped in the matchlock's jaws to fire the powder. In Evliya's Istanbul procession the match-makers (Fitiljian) were fifty men in thirty shops; their patron is the Prophet — because, Evliya says, he first burned a rope in the shape of a match — and they pass twisting matches of seven cotton strings. They march among the arms-makers: after them come the head of the shaft-makers and the head of the gun-makers with their seniors, sheykhs, kyayas and chaushes on Arabian horses, and the gun-makers' assistants are all military men — the match was a munition, not an ornament. Elgood's account of Bukharan arms describes the matchlock (miltyk), its long fork attached to the barrel as a rest — the very gun whose burning cord was cut from cord such as these makers twisted."
  ur: "فتیلجی توپچی کا فتیتا مروڑتا ہے — وہ آہستہ جلنے والی رسی جو فتیتہ دار بندوق کے چڑیا میں کس کر بارود جلاتی ہے۔ اولیاء کے استنبول کے جلوس میں فتیتا ساز ⁦(فتیلجیان)⁩ پچاس آدمی تیس دکانیں ہیں؛ اولیاء کے بقول ان کا پیر نبی ہے کیونکہ اسی نے پہلے رسی کو فتیتے کی شکل میں جلایا، اور وہ سات سوترے دھاگوں کے فتیتے مروڑتے نکلتے۔ انہی کے پیچھے ساختہ سازوں کے سردار اور بندوق سازوں کے سردار اپنے بزرگوں، شیخوں، قیّہوں اور چاوشوں کے ساتھ عرب گھوڑوں پر آتے، اور بندوق ساز سردار کے معاون سب فوجی ہیں — فتیتا اسلحہ ہے، زینت نہیں۔ ایلگڈ بخارا کے اسلحے میں فتیتہ دار بندوق ⁦(ملتوق)⁩ بتاتا ہے جس کے نال سے ایک لمبی کانٹا آرا چوکی لگی ہوتی — وہی بندوق جس کی جلتی رسی ایسے ہی دستکاروں کے مروڑے رسیوں سے کٹی جاتی۔"
  es: "El fitilji retorcía la mecha del artillero: la cuerda de combustión lenta sujeta a las mandíbulas del arcabuz para encender la pólvora. En la procesión de Estambul de Evliya, los fabricantes de mechas (Fitiljian) eran cincuenta hombres en treinta talleres; su patrón era el Profeta —porque, según Evliya, fue el primero en quemar una cuerda con forma de mecha— y pasaban retorciendo mechas de siete cuerdas de algodón. Marchaban entre los fabricantes de armas: tras ellos venían el jefe de los fabricantes de astas y el jefe de los fabricantes de armas con sus superiores, jeques, kyayas y chaushes en caballos árabes, y los ayudantes de los fabricantes de armas eran todos militares: la mecha era una munición, no un adorno. El relato de Elgood sobre las armas de Bujará describe el arcabuz (miltyk), con su larga horquilla unida al cañón como apoyo: el mismo arma cuya cuerda ardiente se cortaba de una cuerda como la que retorcían estos fabricantes."
  fr: "Le fitilji tordait l'allumette du canonnier — la cordelette à combustion lente serrée dans les mâchoires de la mèche pour enflammer la poudre. Dans le cortège d'Evliya à Istanbul, les fabricants d'allumettes (Fitiljian) étaient cinquante hommes répartis dans trente ateliers; leur protecteur est le Prophète — car, selon Evliya, c'est lui qui, le premier, brûla une cordelette en forme d'allumette — et ils se passent des allumettes torsadées à partir de sept brins de coton. Ils défilent parmi les fabricants d'armes: après eux viennent le chef des fabricants de canons et le chef des armuriers, accompagnés de leurs supérieurs, cheikhs, kyayas et chaushes, montés sur des chevaux arabes; les assistants des armuriers sont tous des militaires — l'allumette était une munition, non un ornement. Le récit d'Elgood sur les armes de Boukhara décrit la mèche (miltyk), sa longue fourche fixée au canon servant de support — cette même arme dont la cordelette incandescente était taillée dans une cordelette semblable à celles que ces fabricants tordaient."
  tr: "Fitil yapımcısı, barutu serbest bırakmak için kilitleme piminde yakılan yavaş yanan kordon olan silahın ateşleme pimini döndürür. İstanbul alayında Evliya, aralarında Peygamber Pirham'ın da bulunduğu otuz dükkânda elli fitil yapımcısı (Fatijiyan) saydı; Evliya, Pirham'ın fitil şeklinde kordonu ilk yakan kişi olduğunu söyler. Bu kişiler yedi pamuk ipliğinden fitil örerek geçiyorlardı. Onları baş okçu ve baş tüfekçi, şeyhleri, süvarileri ve Arap atlarına binmiş askerleri takip ediyordu. Baş tüfekçinin yardımcılarının hepsi askerdi, çünkü fitil bir silahtı, süs eşyası değil. Buhara silahları bölümünde Elgud, namluya destek görevi gören uzun bir çatal takılı fitil yapımcısı tüfeğini (Maltuq) anlatır; bu tüfeğin fitili bu tür fitil yapımcılarından kesilmişti."
  id: "Pembuat sumbu memutar pin pemicu senjata—tali yang terbakar perlahan yang dinyalakan di pin pengunci untuk melepaskan bubuk mesiu. Dalam prosesi Istanbul, Evliya menghitung lima puluh pembuat sumbu (Fatijiyan) di tiga puluh toko, termasuk Pirham sang Nabi—Evliya mengatakan, karena dialah yang pertama membakar tali dalam bentuk sumbu—saat mereka lewat sambil memintal sumbu dari tujuh helai benang katun. Mereka diikuti oleh pembuat busur utama dan penembak jitu utama, bersama dengan para syekh mereka, kavaleri, dan tentara yang menunggang kuda Arab. Asisten penembak jitu utama semuanya adalah tentara, karena sumbu adalah senjata, bukan hiasan. Dalam bab tentang senjata Bukhara, Elgud menggambarkan senapan pembuat sumbu (Maltuq) dengan cabang panjang yang terpasang pada laras untuk berfungsi sebagai penyangga—senapan yang sumbunya dipotong dari pembuat sumbu semacam itu."
