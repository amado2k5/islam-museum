id: job/astronomer
class: job
label: { ar: "الفلكي", en: "Astronomer", ur: "ماہر فلکیات" }
summary:
  ar: "الفلكي هو من يرصد حركات الأجرام السماوية ويحسبها، ويضع نتائجها في جداول تُسمّى الأزياج. عُرف هذا العلم في الإسلام بعلم الفلك وعلم الهيئة، وفُرِّق بينه وبين أحكام النجوم الذي يعمل به المنجّم. وقامت مراصد في مراغة وسمرقند وإسطنبول لهذا العمل، ورعاها الحكام أحياناً، وكان منصب المنجّم باشي في الدولة العثمانية يتولى شؤون الفلك والتنجيم معاً."
  en: "The astronomer watches the movements of the heavenly bodies, calculates them, and sets the results in tables called zijes. In Islam the science was known as ilm al-falak and ilm al-hay'a, and it was kept apart from astrology, the work of the munajjim. Observatories at Maragha, Samarkand and Istanbul were built for this work, and rulers sometimes paid for them. In the Ottoman state the office of müneccimbaşı covered both astronomy and astrology."
  ur: "فلکیات دان وہ شخص ہے جو آسمانی اجسام کی حرکات کا مشاہدہ کرتا اور ان کا حساب لگاتا ہے، اور نتائج کو زیج کہلانے والی جدولوں میں درج کرتا ہے۔ اسلام میں اس علم کو علم الفلک اور علم الہیئت کہا گیا، اور یہ احکامِ نجوم سے الگ رہا جن پر منجم کا کام تھا۔ مراغہ، سمرقند اور استنبول کی رصدگاہیں اسی کام کے لیے بنیں، اور حکمرانوں نے ان کی سرپرستی کی۔"
