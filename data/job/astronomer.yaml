places:
  - place: place/raqqa
    start: { edtf: "0877" }
    end: { edtf: "0919" }
    note: "Al-Battani observed here between 877 and 919 CE, and corrected many of Ptolemy's numerical values from his own observations."
    sources: [source/tdv-ilm-i-felek]
  - place: place/baghdad
    note: "Under the caliph al-Ma'mun, observations were made in the Shammasiyya quarter of Baghdad, and the astronomers were gathered there. The entry gives no year."
    sources: [source/tdv-ilm-i-felek]
  - place: place/damascus
    note: "Under al-Ma'mun, observations were also made on the hill of Qasiyun, north of Damascus. The entry gives no year."
    sources: [source/tdv-ilm-i-felek]
  - place: place/maragha
    note: "Hulagu built a new observatory at Maragha in Azerbaijan and put Nasir al-Din al-Tusi in charge of it. The entry places it within Hulagu's reign (1256–1265) and gives twelve years of observations, but does not date the building."
    sources: [source/tdv-ilm-i-felek, source/tdv-semerkant-rasathanesi]
  - place: place/samarqand
    start: { edtf: "142X" }
    note: "Ulugh Beg founded the Samarkand observatory while ruler of Transoxiana. Construction is dated by the entry to 1420–21, and completion to 1421 or 1427; the entry finds it reasonable to place completion in the first half of the 1420s."
    sources: [source/tdv-semerkant-rasathanesi]
  - place: place/istanbul
    start: { edtf: "1575/1577" }
    end: { edtf: "1580" }
    note: "The Istanbul observatory on the Tophane slopes is dated by the Samarkand entry to 1575, and by the Takiyyüddin entry to 985 AH (1577). It was destroyed by royal decree in 987 AH (22 January 1580). The Takiyyüddin entry calls it the only observatory in Ottoman history."
    sources: [source/tdv-takiyyuddin-er-rasid, source/tdv-semerkant-rasathanesi]
