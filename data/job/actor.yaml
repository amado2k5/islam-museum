training:
  mode: mouth-to-mouth
  certification: "A tulûat play with no written text: the subjects passed from master to apprentice, the players holding the kanava in mind and improvising the words; the Pîşekâr, at once player, stager and author, opened the meydan with the pastal clapper and closed it begging pardon for faults {cite:tdv-orta-oyunu}. Evliya's companies of boys included accomplished mukallids whose mimicking kept the feasts laughing {cite:evliya-narrative-hammer-v2}."
  duration: "The play has four parts — giriş, muhâvere (arazbar and tekerleme), fasıl and bitiş — learned inside the kol by playing them {cite:tdv-orta-oyunu}."
