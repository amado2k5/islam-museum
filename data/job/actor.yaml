summary:
  ar: "ممثّل الأورطا أويونو يلعب في الميدان وسط الجمهور بلا خشبة ولا ستارة ولا ديكور، في تقليدٍ يُسمّى أيضاً كول أويونو وميدان أويونو وميدان صوحن وزهوري. عُرفت اللعبة في إستانبول القرن التاسع عشر؛ أول شهادتها في سرنامه لبيب عام 1834 وسرنامه حضر عام 1836. الممثلون يحملون في ذاكرتهم «قناوة» اللعبة — مخططها — ويقولون كلامهم ارتجالاً، فهي ساحةُ قولٍ لا فعل؛ بطلاها البيشكار، وهو ممثل ومخرج وكاتب في آن، والقاووقلو، المهرّج الأكبر. يدخل كلٌّ على هوى الزُّرنا، يُعرف الشخصية قبل كلامها بموسيقاها وملبسها ومشيتها."
  en: "The orta oyunu actor plays in the open meydan among the crowd, without stage, curtain or décor, in a theatre also called kol oyunu, meydan oyunu, meydân-ı sühan and zuhûrî. It is first attested in Istanbul of the nineteenth century — named in Lebîb's Sûrnâme of 1834 and Hızır's of 1836 — and grew common from the century's second half. The players carry the play's 'kanava', its outline, in their heads and speak their lines improvised, so the play is a field of speech rather than action; its two heroes are the Pîşekâr — actor, stage-manager and author in one — and the Kavuklu, the chief comic. Each type enters to its own music on the zurna, known before it speaks by its dress and gait."
  ur: "اورتا اویونو کا اداکار کھلے میدان میں تماشائیوں کے درمیان کھیلتا ہے، بغیر اسٹیج، پردے اور سجاوٹ کے؛ اسے کول اویونو، میدان اویونو، میدانِ سخن اور زہوری بھی کہتے ہیں۔ یہ انیسویں صدی کے استنبول میں پہلی بار شہادت پاتا ہے — لبیب کی سرنامہ ۱۸۳۴ء اور حضر کی ۱۸۳۶ء میں — اور صدی کے دوسرے حصے سے عام ہوا۔ اداکار کھیل کا «کناوہ» یعنی خاکہ ذہن میں رکھتے اور باتیں ارتجالاً کہتے، اس لیے یہ فعل کا نہیں قول کا میدان ہے؛ اس کے دو ہیرو پیشکار ہیں — اداکار، اسٹیج منیجر اور مصنف ایک ہی میں — اور قاووقلو، مرکزی مزاحیہ کردار۔ ہر نمونہ زرنا کی اپنی دھن پر داخل ہوتا، اپنی پوشاک اور چال سے بولنے سے پہلے پہچانا جاتا۔"
  es: "El actor de orta oyunu actúa en el meydan al aire libre, entre la multitud, sin escenario, telón ni decorado, en un teatro también llamado kol oyunu, meydan oyunu, meydân-ı sühan y zuhûrî. Se documenta por primera vez en Estambul en el siglo XIX —mencionado en el Sûrnâme de Lebîb de 1834 y en el de Hızır de 1836— y se popularizó a partir de la segunda mitad del siglo. Los actores llevan en la cabeza el «kanava» de la obra, su esquema, y recitan sus diálogos de forma improvisada, por lo que la obra es un campo de diálogo más que de acción; sus dos héroes son el Pîşekâr —actor, director de escena y autor a la vez— y el Kavuklu, el cómico principal. Cada tipo entra con su propia música en la zurna, y se le reconoce antes de hablar por su vestimenta y su andar."
  fr: "L'acteur d'orta oyunu joue dans le meydan, au milieu du public, sans scène, rideau ni décor, dans un théâtre également appelé kol oyunu, meydan oyunu, meydân-ı sühan ou zuhûrî. Attesté pour la première fois à Istanbul au XIXe siècle – mentionné dans le Sûrnâme de Lebîb (1834) et celui de Hızır (1836) – il se répandit à partir de la seconde moitié du siècle. Les comédiens mémorisent le « kanava », le synopsis de la pièce, et improvisent leurs répliques; la pièce est donc un espace de parole plutôt que d'action. Ses deux figures principales sont le Pîşekâr – à la fois acteur, metteur en scène et auteur – et le Kavuklu, le principal comédien. Chaque personnage entre en scène au son de sa propre musique, le zurna, reconnaissable avant même de parler à ses vêtements et à sa démarche."
