summary:
  ar: "الصَّغري دبّاغ ومُعدّ جلد السَّغْر، وهو الجلد الحبيبي الخشن من جلد سمك القرش والراي أو من جلد الحياز تحت السرج، يُكسى به مقابض السيوف وأغمادها لإحكام القبضة. في موكب إسطنبول عدّ إوليا صنّاع السَّغْر ⁦(صغريجيان)⁩ مئة وخمسين رجلاً بخمسين دكاناً، بيرهم جدّ أح أوران دده الشيخ سراج الدين البلحصاوي الذي منَّه سلمان باك بالحزام وقبره قرب غزة في خرائب عسقلان؛ وكان للصغريين خصومة كبرى مع الدبّاغين حُكم فيها لصالحهم بأن يُعَدّوا معاونين لصنّاع السيوف، ويزيّنون دكاكينهم على محفّات بسَغْر مختلف الألوان، ومعملهم قائم داخل قاعة الدقيق. ويلتقي هذا القرار بما تُظهره قطع السلاح: يصف إلغود أغماد سيوف من خشب تُكسى بالسَّغْر المنعقد بمقابض فضية، وسيوفاً من غنائم فيينا في كراكوف أغمادها مكسوّة بالسَّغْر أو المخمل مطعّمة باليشم والفيروز."
  en: "The saghriji tanned and dressed shagreen — the hard granular leather of shark and ray skin, or of the horse's croup under the saddle — used to cover sword-grips and scabbards for a sure hold. In Evliya's Istanbul procession the shagreen-makers (Saghrijian) were a hundred and fifty men in fifty shops; their patron was the grandsire of Ah-averan-dedeh, the sheikh Serraj-ud-din of Pahsa, girded by Selman Pak and buried near Ghaza in the ruins of Ascalon. They fought a great contest with the tanners, decided in their favour, that they should be counted as assistants to the sword-makers; they adorn their shops on litters with shagreen of different colours, and their manufactory stands inside the Flour-hall. The verdict is borne out by surviving arms: Elgood describes Bukharan scabbards with a wooden core covered with shagreen under silver mounts, and swords from the Vienna booty at Cracow whose sheaths are clad in shagreen or velvet, inlaid with jade and turquoise."
  ur: "صغری سگر یعنی شگرین چمڑے کا دباغ اور تیار کرنے والا ہے — شارک اور رے مچھلی کی دانے دار کھل یا سرج کے نیچے گھوڑے کی پٹھ کی کھال — جس سے تلواروں کے دستے اور میان ڈھانپے جاتے تاکہ گرفت مضبوط رہے۔ اولیاء کے استنبول کے جلوس میں صغری ⁦(صغریجیان)⁩ ایک سو پچاس آدمی پچاس دکانیں ہیں؛ ان کا پیر اح اوران ددہ کا دادا شیخ سراج الدین بلحصوی ہے جسے سلمان پاک نے کمر بند پہنایا اور غزہ کے قریب عسقلان کی ویرانیوں میں دفن ہے۔ دباغوں سے ان کا بڑا جھگڑا تھا جو اس فیصلے پر ہوا کہ وہ تلوار سازوں کے معاون شمار ہوں؛ وہ اپنی دکانیں ڈولوں پر مختلف رنگوں کی شگرین سے سجاتے اور ان کا کارخانہ آٹے کی عمارت کے اندر ہے۔ یہ فیصلہ بچے ہوئے اسلحے سے ثابت ہوتا: ایلگڈ بخاری میان بتا تا ہے جن کا لکڑی کا اندر شگرین سے چاندنی کی نوبوں تلے ڈھانپا گیا، اور کراکوف میں ویانا کے مالِ غنیمت کی وہ تلواریں جن کے میان شگرین یا مخمّل سے ملبوس یاقوتی اور فیروزے کے جڑاؤ ہیں۔"
  es: "Los saghriji curtían y preparaban la piel de raya (el cuero duro y granulado de la piel de tiburón y raya, o de la grupa del caballo bajo la silla de montar) que se usaba para cubrir las empuñaduras y vainas de las espadas para un agarre seguro. En la procesión de Estambul de Evliya, los fabricantes de piel de raya (Saghrijian) eran ciento cincuenta hombres en cincuenta talleres; su patrón era el abuelo de Ah-averan-dedeh, el jeque Serraj-ud-din de Pahsa, ceñido por Selman Pak y enterrado cerca de Ghaza en las ruinas de Ascalón. Libraron una gran contienda con los curtidores, que se resolvió a su favor, y se decidió que debían ser considerados ayudantes de los fabricantes de espadas; adornan sus talleres sobre literas con piel de raya de diferentes colores, y su manufactura se encuentra dentro del Salón de la Harina. El veredicto se ve corroborado por las armas que han sobrevivido: Elgood describe vainas bujarianas con un núcleo de madera recubierto de piel de raya bajo monturas de plata, y espadas del botín de Viena en Cracovia cuyas vainas están revestidas de piel de raya o terciopelo, con incrustaciones de jade y turquesa."
