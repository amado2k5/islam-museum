  techniques:
    ar: "الصنعة دباغة جلد السَّغْر وصقله: يُستعمَل الجلد الحبيبي لسمك القرش والراي — أو جلد الحياز مدبغاً بالبذور المضغوطة في سطحه ثم مقشراً — ويُصَبغ ويُصقَل فيخر بألوان مختلفة، ثم يُكسى به خشب المقبض والغمد لئلا تنزلق اليد. وعند إوليا تُعرَض أنواع السَّغْر الملوَّنة على محفّات الدكاكين في الموكب."
    en: "The craft is the tanning and finishing of shagreen: the granular skin of shark and ray — or croup leather worked with seeds pressed into its surface and shaved off — dyed and polished to different colours, then laid over the wooden grip and scabbard so the hand does not slip. In Evliya the coloured kinds of shagreen are displayed on litters in the procession."
    ur: "ہنر شگرین کی دباغت اور پالش ہے: شارک اور رے کی دانے دار کھال — یا پٹھ کی کھال جس کی سطح میں بیج دبو کر تراشے جائیں — رنگ کر پالش کیا جاتا مختلف رنگوں میں، پھر لکڑی کے دستے اور میان پر چڑھایا جاتا تاکہ ہاتھ نہ پھسلے۔ اولیاء میں رنگین شگرین کی اقسام جلوس میں ڈولوں پر سجی دکھائی جاتی ہیں۔"
