summary:
  ar: "الناطق الرسمي من يتكلّم بلسان الدولة أو السلطان أو الخليفة فيُبلّغ موقفها للداخل والخارج؛ والوظيفة قديمة اللباس حديثة الاسم: كان «خطيب النبي» ثابت بن قيس ينوب عنه في جواب الوفود والردّ على الشعراء، وحمل رسله — عمرو بن أمية الضمري ودحية الكلبي وحاطب بن أبي بلتعة وعبد الله بن حذافة والأربعة والأربعون — رسالات الدولة الفتية إلى الملوك، وكان صاحب البريد لسان الخليفة في الأقاليم، ثم صار للسلاطين من يعلن مراسيمهم وللجيوش من يعلن أخبارها، حتى استقر في القرن العشرين منصب «الناطق الرسمي» باسم الحكومة أو الرئاسة أو الجيش أو الحركة — تكليفٌ بالكلام نيابةً عن الغير، يُقاس بالأمانة والضبط والبيان."
  en: "The natiq rasmi speaks with the tongue of the state, the sultan or the caliph, declaring its position inward and outward — an old office in a new name. The Prophet's own spokesman, Thabit ibn Qays, answered delegations and poets for him; his envoys — Amr ibn Umayya al-Damri, Dihya al-Kalbi, Hatib ibn Abi Balta'a, Abdullah ibn Hudhafa and the rest of the forty-eight — carried the young state's letters to kings; the sahib al-barid was the caliph's tongue in the provinces; sultans had men to proclaim their decrees and armies their announcers — until in the twentieth century the office settled as the 'official spokesman' of government, presidency, army or movement: speech commissioned on another's behalf, measured by faithfulness, restraint and statement."
  ur: "سرکاری ترجمان وہ ہے جو ریاست، سلطان یا خلیفہ کی زبان سے بولتا اور اس کا موقف اندرون و بیرون ملک پہنچاتا ہے — پرانا منصب نیا نام۔ نبی کے ترجمان ثابت بن قیس اس کی طرف سے وفود اور شعرا کا جواب دیتے تھے؛ اس کے سفیر — عمرو بن امیہ الضمری، دحیہ الکلبی، حاطب بن ابی بلتعہ، عبداللہ بن حذافہ اور بقیہ اڑتالیس — نوجوان ریاست کے خطوط بادشاہوں تک پہنچائے؛ صاحبِ برید صوبوں میں خلیفہ کی زبان تھا؛ سلطانوں کے فرمان اعلان کرنے والے اور لشکروں کے اعلان کرنے والے رہے، یہاں تک کہ بیسویں صدی میں حکومت، صدارت، لشکر یا تحریک کے «سرکاری ترجمان» کا منصب قائم ہوا — دوسرے کی طرف سے بولنے کی ذمہ داری، جسے امانت، ضبط اور وضاحت سے ناپا جاتا ہے۔"
  es: "El natiq rasmi habla en nombre del estado, del sultán o del califa, proclamando su posición tanto interna como externamente: un cargo antiguo con un nombre nuevo. El propio portavoz del Profeta, Thabit ibn Qays, respondía a las delegaciones y a los poetas en su nombre; sus enviados —Amr ibn Umayya al-Damri, Dihya al-Kalbi, Hatib ibn Abi Balta'a, Abdullah ibn Hudhafa y los cuarenta y ocho restantes— llevaban las cartas del joven estado a los reyes; el sahib al-barid era la voz del califa en las provincias; los sultanes tenían hombres para proclamar sus decretos y los ejércitos, sus anunciadores, hasta que en el siglo XX el cargo se consolidó como el de \"portavoz oficial\" del gobierno, la presidencia, el ejército o el movimiento: un discurso encargado en nombre de otro, que se caracterizaba por la fidelidad, la moderación y la claridad."
  fr: "Le natiq rasmi parle au nom de l'État, du sultan ou du calife, proclamant sa position tant intérieure qu'extérieure – une fonction ancienne sous une nouvelle appellation. Le porte-parole du Prophète, Thabit ibn Qays, répondait en son nom aux délégations et aux poètes; ses envoyés – Amr ibn Umayya al-Damri, Dihya al-Kalbi, Hatib ibn Abi Balta'a, Abdullah ibn Hudhafa et les quarante-huit autres – portaient les lettres du jeune État aux rois; le sahib al-barid était le porte-parole du calife dans les provinces; les sultans disposaient d'hommes pour proclamer leurs décrets et leurs armées pour les proclamer – jusqu'à ce qu'au XXe siècle, cette fonction s'impose comme celle de « porte-parole officiel » du gouvernement, de la présidence, de l'armée ou d'un mouvement: un discours commandité au nom d'autrui, jugé sur la fidélité, la retenue et la pertinence de l'affirmation."
