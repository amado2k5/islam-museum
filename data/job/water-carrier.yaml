summary:
  ar: "السقّاء يحمل ماء الشرب إلى البيوت والمارة. يصف لين سقّائي القاهرة وهم يجلبون ماء النيل بالجِمال في قِرب البقر «الري» وبالحمير وعلى الظهور في قربة الماعز «القِربة»، وصيحتهم «يا عوّض الله»، والسقّاء شربة بكوزه النحاسي، والهمالية الدراويش بأباريقهم الفخارية. ويأمر الشيزري أن يتوغلوا في النهر بعيداً عن المواضع القذرة وأن يُقيّد جرس على الدابة، وبير سقّائي إسطنبول عند إوليا جلبي سلمان الكوفي."
  en: "The saqqa carried drinking water to houses and passers-by. Lane describes Cairo's sakkas drawing Nile water with camels bearing the pair of ox-hide bags called rei, with asses and on their own backs in the goatskin kirbeh, their cry 'O may God compensate me'; the sakka sharbeh with his brass spout and cup; and the dervish hemalees with their porous ibreek jars. Al-Shayzari orders them to wade far into the river away from dirty places and to bell their animals, and Evliya gives Istanbul's water-carriers their patron Selman of Cufa."
  ur: "سقہ گھروں اور راہگیروں تک پینے کا پانی پہنچاتا ہے۔ لین قاہرہ کے سقّوں کو بیان کرتا ہے جو اونٹوں پر «ری» کہلانے والی بیل کھال کی جوڑی، گدھوں پر اور اپنی پیٹھ پر بکری کی کھال «قربہ» میں دریائے نیل کا پانی لاتے تھے، ان کی پکار «یا عوّض اللہ»؛ پیتل کے نل اور پیالے والا «سقّہ شربہ»؛ اور درویش ہمالی اپنے سوراخ دار ابریق کے ساتھ۔ الشیزری انہیں دریا میں گندے مقامات سے دور اترنے اور جانوروں کی گردن میں گھنٹی باندھنے کا حکم دیتا ہے، اور استنبول کے سقّوں کا پیر اولیاء چلبی کے ہاں سلمان کوفی ہے۔"
  es: "Los saqqa llevaban agua potable a las casas y a los transeúntes. Lane describe a los sakkas de El Cairo sacando agua del Nilo con camellos que llevaban el par de bolsas de piel de buey llamadas rei, con asnos y a sus espaldas con el kirbeh de piel de cabra, su grito «¡Oh, que Dios me compense!»; el sakka sharbeh con su caño y copa de latón; y los hemalees derviches con sus cántaros ibreek porosos. Al-Shayzari les ordena que se adentren en el río lejos de los lugares sucios y que pongan cascabeles a sus animales, y Evliya da a los aguadores de Estambul a su patrón Selman de Cufa."
  fr: "Les saqqas transportaient l'eau potable aux maisons et aux passants. Lane décrit les sakkas du Caire puisant l'eau du Nil avec des chameaux portant les deux outres en peau de bœuf appelées rei, avec des ânes et sur leur propre dos dans le kirbeh en peau de chèvre, en criant « Ô Dieu, que Dieu me délivre ! »; le sakka sharbeh avec son bec et sa coupe en laiton; et les derviches hemalees avec leurs jarres poreuses ibreek. Al-Shayzari leur ordonne de patauger loin dans le fleuve, loin des endroits sales, et de sonner les cloches de leurs animaux, et Evliya donne aux porteurs d'eau d'Istanbul leur protecteur Selman de Cufa."
