craft:
  materials: [leather, ceramic, brass]
  techniques:
    ar: "حمل السقّاء الماء في قِرب من جلود البقر والماعز: زوج القِرب الواسع على البعير «الري» وقربة الماعز على الحمار أو على ظهر السقّاء «القِربة»، وسقّاء الشربة يصبّ من قربته ذات المزهر النحاسي في كوب نحاسي أو «كُلّة» خزفية، والهمالي يحمل على ظهره «الإبريق» الفخاري المسامي الذي يبرد الماء. ويأمر الشيزري أن يتوغل السقّاء في النهر بعيداً عن الشط والمواضع القذرة وموارد الدواب ومصارف الحمّامات، وأن تُستعمل القربة الجديدة أياماً في ماء البناء حتى يذهب طعم الدبغ والقار، وأن تُعلّق الأجراس في أعناق الدواب لتنبه العميان والصبيان."
    en: "The saqqa carried water in skins of ox and goat hide: the camel bore the pair of wide bags called rei, the ass or the carrier himself the goatskin kirbeh; the sakka sharbeh poured from his skin through a brass spout into a brass cup or earthen kulleh, and the hemalee bore on his back the porous ibreek jar that cools the water. Al-Shayzari orders the carrier to wade far into the river away from the bank, dirty places, animal watering points and bath outlets, a new skin to be used for days on builders' water until the tan and pitch taste passes, and bells on the animals' necks to warn the blind and children."
    ur: "سقہ بیل اور بکری کی کھال کی مشکوں میں پانی لاتا تھا: اونٹ «ری» کہلانے والی کشادہ مشکوں کی جوڑی اٹھاتا، گدھا یا خود سقہ بکری کی «قربہ»؛ «سقّہ شربہ» اپنی مشک سے پیتل کے نل کے ذریعے پیتل کے پیالے یا مٹی کے «کُلّہ» میں پانی ڈھالتا، اور ہمالی اپنی پیٹھ پر سوراخ دار «ابریق» اٹھاتا جو پانی ٹھنڈا رکھتا۔ الشیزری حکم دیتا ہے کہ سقہ کنارے، گندے مقامات، چراگاہ اور حمام کی نکاسی سے دور دریا میں اترے، نئی مشک کئی دن تعمیری پانی کے لیے استعمال ہو یہاں تک کہ دباغت اور رال کی بو نکل جائے، اور جانوروں کی گردن میں گھنٹیاں باندھی جائیں تاکہ اندھے اور بچے خبردار رہیں۔"
