summary:
  ar: "مرحلة من رحلة ابن جبير إلى الحج: خرج من غرناطة في شوال سنة 578 على طريق البر إلى جزيرة طريف، ثم ركب البحر وبلغ الإسكندرية بعد عاصفة ورجوع إلى البر في أواخر ذي القعدة. ومن الإسكندرية سار في الدلتا على ضفاف النيل حتى دخل القاهرة في ذي الحجة. يواصل النص بعد ذلك الصعود إلى قوص، وهذا الجزء غير مدرج هنا لأن قوص لا ملف مكان لها بعد."
