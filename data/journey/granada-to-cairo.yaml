label: { ar: "من غرناطة إلى القاهرة في رحلة ابن جبير إلى الحج", en: "From Granada to Cairo on Ibn Jubayr's pilgrimage road", es: "Desde Granada hasta El Cairo por la ruta de peregrinación de Ibn Jubayr", fr: "De Grenade au Caire, sur le chemin de pèlerinage d'Ibn Jubayr", ur: "ابن جبیر کی زیارت کے راستے پر غرناطہ سے قاہرہ تک" }
summary:
  ar: "مرحلة من رحلة ابن جبير إلى الحج: خرج من غرناطة في شوال سنة 578 على طريق البر إلى جزيرة طريف، ثم ركب البحر وبلغ الإسكندرية بعد عاصفة ورجوع إلى البر في أواخر ذي القعدة. ومن الإسكندرية سار في الدلتا على ضفاف النيل حتى دخل القاهرة في ذي الحجة. يواصل النص بعد ذلك الصعود إلى قوص، وهذا الجزء غير مدرج هنا لأن قوص لا ملف مكان لها بعد."
  en: "A stage of Ibn Jubayr's pilgrimage journey. He left Granada in Shawwal 578 by land to the island of Tarifa, then took ship and reached Alexandria after a storm and a return to land in late Dhu al-Qa'dah. From Alexandria he travelled through the Delta along the banks of the Nile until he entered Cairo in Dhu al-Hijja. The text continues after this with the ascent to Qus, but that part is not included here, because Qus does not yet have a place file."
  es: "Una etapa del viaje de peregrinación de Ibn Jubayr. Partió de Granada en Shawwal 578 por tierra hacia la isla de Tarifa, luego embarcó y llegó a Alejandría tras una tormenta y un regreso a tierra a finales de Dhu al-Qa'dah. Desde Alejandría viajó a través del delta a lo largo de las orillas del Nilo hasta llegar a El Cairo en Dhu al-Hijja. El texto continúa después con el ascenso a Qus, pero esa parte no se incluye aquí, ya que Qus aún no tiene un registro de lugar."
  fr: "Une étape du pèlerinage d'Ibn Jubayr. Il quitta Grenade en Shawwal 578 par voie terrestre jusqu'à l'île de Tarifa, puis prit le bateau et atteignit Alexandrie après une tempête et un retour à terre à la fin du mois de Dhu al-Qa'dah. D'Alexandrie, il traversa le delta du Nil jusqu'à son arrivée au Caire en Dhu al-Hijja. Le texte se poursuit ensuite avec l'ascension de Qos, mais cette partie n'est pas incluse ici, car Qos ne possède pas encore de fiche de localisation."
  ur: "ابن جبیر کے سفر حج کا ایک مرحلہ۔ وہ شوال 578 میں غرناطہ سے بذریعہ زمینی جزیرہ طاریفا گیا، پھر جہاز لے کر اسکندریہ پہنچا اور ذوالقعدہ کے اواخر میں طوفان اور واپسی کے بعد اسکندریہ پہنچا۔ اسکندریہ سے اس نے دریائے نیل کے کنارے ڈیلٹا کا سفر کیا یہاں تک کہ وہ ذی الحجہ میں قاہرہ میں داخل ہوا۔ اس کے بعد یہ عبارت قُس کی طرف چڑھائی کے ساتھ جاری ہے، لیکن وہ حصہ یہاں شامل نہیں ہے، کیونکہ قُس کے پاس ابھی جگہ کی فائل نہیں ہے۔"
