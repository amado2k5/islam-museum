id: journey/mutah-march
class: journey
kind: military_campaign
label: { ar: "مسير جيش مؤتة", en: "The army's march to Mu'tah" }
summary:
  ar: "مسير الجيش الإسلامي الثلاثة آلاف من المدينة إلى مؤتة في جمادى الأولى سنة 8هـ، بحسب ما يذكره الرحيق: توديع النبي له عند ثنية الوداع، ثم الشمال حتى معان، فليلتان فيها، ثم أرض البلقاء حيث لقي جموع هرقل عند مشارف ثم عسكر في مؤتة؛ المواضع كما يذكرها المؤلف دون ترتيب إضافي."
  en: "The march of the Muslim army of three thousand from Medina to Mu'tah in Jumada al-Ula of year 8 AH, according to what al-Raheeq mentions: the Prophet's farewell to it at Thaniyat al-Wada', then north as far as Ma'an, where it spent two nights, then the land of al-Balqa', where it met the massed forces of Heraclius at Mashari', and then it camped at Mu'tah. The places are given as the author names them, without further ordering."
wings: []
travelers: [person/zayd-ibn-haritha, person/jafar-ibn-abi-talib, person/abd-allah-ibn-rawaha]
periods: [period/prophetic-era]
