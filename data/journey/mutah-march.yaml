legs:
  - { from: place/medina, to: place/maan, events: [event/mutah-dispatch-of-army], note: "خرج النبي مشيّعاً الجيش حتى بلغ ثنية الوداع فوقف وودّعهم، ثم تحرك الجيش نحو الشمال حتى نزل معان من أرض الشام (الرحيق ص388). لم يذكر النص يوماً للخروج." }
  - { from: place/maan, to: place/mutah, events: [event/mutah-halt-at-maan, event/battle-of-mutah], note: "أقام الجيش بمعان ليلتين، ثم تحرك إلى أرض العدو فلقيته جموع هرقل بقرية مشارف من قرى البلقاء (المحطة المسماة بالمشارف لا إحداثيات لها في الملف فلم تُدرج هنا)، ثم دنا العدو فانحاز المسلمون إلى مؤتة فعسكروا وتعبأوا للقتال (الرحيق ص389)." }
