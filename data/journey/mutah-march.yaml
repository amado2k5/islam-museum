id: journey/mutah-march
class: journey
kind: military_campaign
label: { ar: "مسير جيش مؤتة", en: "The army's march to Mu'tah", es: "La marcha del ejército hacia Mu'tah", fr: "La marche de l'armée vers Mu'tah", ur: "فوج کا متعہ کی طرف مارچ", tr: "Mu'tah'ın ordusunun yürüyüşü", id: "Pawai pasukan Mu'tah" }
summary:
  ar: "مسير الجيش الإسلامي الثلاثة آلاف من المدينة إلى مؤتة في جمادى الأولى سنة 8هـ، بحسب ما يذكره الرحيق: توديع النبي له عند ثنية الوداع، ثم الشمال حتى معان، فليلتان فيها، ثم أرض البلقاء حيث لقي جموع هرقل عند مشارف ثم عسكر في مؤتة؛ المواضع كما يذكرها المؤلف دون ترتيب إضافي."
  en: "The march of the Muslim army of three thousand from Medina to Mu'tah in Jumada al-Ula of year 8 AH, according to what al-Raheeq mentions: the Prophet's farewell to it at Thaniyat al-Wada', then north as far as Ma'an, where it spent two nights, then the land of al-Balqa', where it met the massed forces of Heraclius at Mashari', and then it camped at Mu'tah. The places are given as the author names them, without further ordering."
  es: "La marcha del ejército musulmán de tres mil hombres desde Medina hasta Mu'tah en Jumada al-Ula del año 8 de la Hégira, según lo que menciona al-Raheeq: la despedida del Profeta en Thaniyat al-Wada', luego hacia el norte hasta Ma'an, donde pasaron dos noches, después a la tierra de al-Balqa', donde se encontraron con las fuerzas de Heraclio en Mashari', y finalmente acamparon en Mu'tah. Los lugares se mencionan tal como los nombra el autor, sin ningún orden en particular."
  fr: "La marche de l'armée musulmane de trois mille hommes de Médine à Mu'tah, en Jumada al-Ula de l'an 8 de l'Hégire, telle que rapportée par al-Raheeq: les adieux du Prophète à l'armée à Thaniyat al-Wada', puis le cap au nord jusqu'à Ma'an, où elle passa deux nuits, puis le pays d'al-Balqa', où elle affronta les forces d'Héraclius à Mashari', avant de camper à Mu'tah. Les lieux sont énumérés tels que l'auteur les nomme, sans autre ordre."
  ur: "8 ہجری کے جمادی الاول میں مدینہ سے موتہ کی طرف مسلمانوں کے تین ہزار لشکر کا مارچ، جس کا تذکرہ الرحیق نے کیا ہے: رسول اللہ نے اسے ثنیات الوداع، پھر شمال میں معن تک، جہاں اس نے دو راتیں گزاریں، پھر سرزمین البلقاء، پھر اس نے مسہری کے مقام پر لشکر کشی کی، جہاں اس نے لشکر کشی کی۔ متعہ۔ جگہیں مزید ترتیب دیئے بغیر، مصنف کے نام کے طور پر دی گئی ہیں۔"
  tr: "El-Rahiq'in aktardığına göre, Hicri 8. yılda Cemâdeü'l-Ula'da üç bin kişilik İslam ordusunun Medine'den Mu'te'ye yürüyüşü şöyledir: Peygamber, Thaniyatü'l-Vada'da ona veda etti, ardından kuzeye, Ma'an'a gitti ve orada iki gece geçirdi, sonra Belka topraklarına gitti ve orada Heraklius'un ordularıyla karşılaştı, daha sonra Mu'te'de kamp kurdu; yazarın bahsettiği yerler, ek bir sıralama olmaksızın bu şekilde aktarılmıştır."
  id: "Perjalanan tiga ribu pasukan Islam dari Madinah ke Mu’tah pada Jumada al-Ula, 8 H, menurut apa yang disebutkan oleh al-Raheeq: Nabi berpamitan kepada mereka di Thaniyat al-Wada’, kemudian ke utara menuju Ma’an, tempat beliau bermalam selama dua malam, kemudian ke tanah Balqa’ tempat beliau bertemu dengan pasukan Heraclius di pinggirannya, lalu beliau berkemah di Mu’tah; tempat-tempat tersebut sebagaimana disebutkan oleh penulis tanpa urutan tambahan."
