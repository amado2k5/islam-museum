label:
  ar: طريق الحرير
  en: The Silk Road
  ur: شاہراہِ ریشم
  es: "La Ruta de la Seda"
summary:
  ar: "شبكة الطرق البرية والبحرية التي ربطت الصين بآسيا الوسطى وفارس والعراق والشام قرونًا، وسار عليها الحرير والتوابل والورق والعلوم والدعوات؛ ويصف ياقوت في معجم البلدان حواضر الطريق من مرو وبخارى إلى سمرقند وما وراء النهر {cite:mujam-al-buldan-sader-1995}، وتلخص دائرة المعارف الإسلامية تاريخ الطريق ودور المسلمين في تجارته {cite:encyclopaedia-of-islam-2}."
  en: "The network of overland and sea roads that linked China to Central Asia, Persia, Iraq and al-Sham for centuries, carrying silk, spices, paper, sciences and faiths; Yaqut's Mu'jam al-Buldan describes the road's cities from Merv and Bukhara to Samarkand and Transoxiana {cite:mujam-al-buldan-sader-1995}, and the Encyclopaedia of Islam surveys the road's history and the Muslims' role in its trade {cite:encyclopaedia-of-islam-2}."
  ur: "وہ زمینی اور بحری راستوں کا جال جو صدیوں تک چین کو وسط ایشیا، فارس، عراق اور شام سے جوڑتا رہا اور جس پر ریشم، مصالحے، کاغذ، علوم اور دعوتیں سفر کرتیں؛ یعقوت کا معجم البلدان مرو اور بخارا سے سمرقند اور ماوراء النہر تک کے راستے کے شہروں کو بیان کرتا ہے {cite:mujam-al-buldan-sader-1995}، اور دائرہ معارفِ اسلامیہ اس راستے کی تاریخ اور مسلمانوں کے تجارتی کردار کا جائزہ لیتی ہے {cite:encyclopaedia-of-islam-2}."
  es: "La red de rutas terrestres y marítimas que unió China con Asia Central, Persia, Irak y al-Sham durante siglos, transportando seda, especias, papel, ciencias y religiones; el Mu'jam al-Buldan de Yaqut describe las ciudades de la ruta desde Merv y Bukhara hasta Samarcanda y Transoxiana {cite:mujam-al-buldan-sader-1995}, y la Enciclopedia del Islam examina la historia de la ruta y el papel de los musulmanes en su comercio {cite:encyclopaedia-of-islam-2}."
