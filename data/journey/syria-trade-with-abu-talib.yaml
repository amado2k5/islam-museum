label: { ar: "رحلة أبي طالب بالفتى إلى بصرى", en: "Abu Talib's journey with the youth to Busra", es: "El viaje de Abu Talib con los jóvenes a Busra", fr: "Le voyage d'Abu Talib avec les jeunes à Busra", ur: "ابو طالب کا نوجوانوں کے ساتھ بصرہ کا سفر", tr: "Ebu Talib'in çocukla birlikte Busra'ya yolculuğu", id: "Perjalanan Abu Talib bersama anak laki-laki itu ke Busra." }
summary:
  ar: "رحلة تجارية لأبي طالب بالفتى محمد إلى الشام حتى بصرى، حيث عرف الراهب بحيرا خاتم النبوة وأوصى بردّه إلى مكة، فعاد به عمه مع بعض غلمانه ⁦(الرحيق ص58-59)⁩."
  en: "A trade journey by Abu Talib with the youth Muhammad to al-Sham, as far as Busra, where the monk Bahira recognised the seal of prophethood and advised that he be sent back to Mecca, so his uncle returned with him, with some of his servants (al-Raheeq al-Makhtum, pp. 58-59)."
  es: "Un viaje comercial de Abu Talib con el joven Muhammad a al-Sham, hasta Busra, donde el monje Bahira reconoció el sello de la profecía y aconsejó que lo enviaran de regreso a La Meca, por lo que su tío regresó con él, con algunos de sus sirvientes (al-Raheeq al-Makhtum, pp. 58-59)."
  fr: "Un voyage commercial d'Abu Talib avec le jeune Muhammad jusqu'au Levant, jusqu'à Busra, où le moine Bahira reconnut le sceau de la prophétie et conseilla de le renvoyer à La Mecque, alors son oncle retourna avec lui, avec certains de ses serviteurs (al-Raheeq al-Makhtum, pp. 58-59)."
  ur: "ابو طالب کا نوجوان محمد کے ساتھ الشام کا تجارتی سفر، بصرہ تک، جہاں راہب بحیرہ نے نبوت کی مہر کو تسلیم کیا اور مشورہ دیا کہ اسے مکہ واپس بھیج دیا جائے، چنانچہ اس کے چچا اپنے کچھ خادموں کے ساتھ اس کے ساتھ واپس آئے ⁦(الرحیق المختوم، صفحہ 58-59)⁩۔"
  tr: "Ebu Talib, genç Muhammed ile birlikte Suriye'ye, Busra'ya kadar bir ticaret yolculuğu yaptı. Orada keşiş Bahira, peygamberliğin mührünü tanıdı ve Mekke'ye geri dönmesini tavsiye etti. Bunun üzerine amcası, bazı hizmetkarlarıyla birlikte onu geri getirdi (El-Rahik, s. 58-59)."
  id: "Abu Talib melakukan perjalanan dagang dengan anak laki-laki bernama Muhammad ke Suriah hingga Busra, di mana biarawan Bahira mengenali tanda kenabian tersebut dan menyarankan agar ia dikembalikan ke Mekah, sehingga pamannya membawanya kembali bersama beberapa pelayannya (Al-Raheeq, hlm. 58-59)."
