  en: "A trade journey by Abu Talib with the youth Muhammad to al-Sham, as far as Busra, where the monk Bahira recognised the seal of prophethood and advised that he be sent back to Mecca, so his uncle returned with him, with some of his servants (al-Raheeq al-Makhtum, pp. 58-59)."
