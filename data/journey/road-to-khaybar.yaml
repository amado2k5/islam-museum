id: journey/road-to-khaybar
class: journey
label: { en: "The road to Khaybar", ar: "درب خيبر", es: "El camino a Khaybar", fr: "La route de Khaybar", ur: "خیبر کا راستہ", tr: "Haybar Yolu", id: "Jalur Khaibar" }
summary:
  en: "The march of the Prophet's army from Medina to Khaybar in the rest of Muharram, year 7 AH, by the stages al-Raheeq gives from Ibn Ishaq: Jabal 'Asr, al-Sahba, the valley of al-Raji', then the guided approach from the north, and the halt at al-Sahba near Khaybar."
  ar: "مسير جيش النبي من المدينة إلى خيبر في بقية المحرم سنة 7هـ، بالمواضع التي يرويها الرحيق عن ابن إسحاق: جبل عصر، فالصهباء، فوادي الرجيع، ثم الاقتراب بالدليل من جهة الشمال، ونزول الصهباء القريبة من خيبر."
  es: "La marcha del ejército del Profeta desde Medina hasta Khaybar durante el resto de Muharram, año 7 AH, por las etapas que al-Raheeq da de Ibn Ishaq: Jabal 'Asr, al-Sahba, el valle de al-Raji', luego el acercamiento guiado desde el norte y la parada en al-Sahba cerca de Khaybar."
  fr: "La marche de l'armée du Prophète de Médine à Khaybar pendant le reste du mois de Muharram de l'an 7 AH, selon les étapes décrites par al-Raheeq d'après Ibn Ishaq: Jabal 'Asr, al-Sahba, la vallée d'al-Raji', puis l'approche guidée depuis le nord, et l'arrêt à al-Sahba près de Khaybar."
  ur: "مدینہ سے خیبر تک رسول اللہ کی فوج کا مارچ 7 ہجری کے بقیہ محرم میں، جن مراحل کو الرحیق ابن اسحاق سے بیان کرتے ہیں: جبل عصر، الصحابہ، وادی الراجی، پھر شمال کی طرف سے ہدایت والا راستہ، اور خیبر کے قریب الصحابہ میں رک جانا۔"
  tr: "Peygamberin ordusu, Hicri 7. yılın Muharrem ayının geri kalanında Medine'den Hayber'e doğru, İbn İshak'tan rivayet edilen Rahiq'in anlattığı yerlerden geçerek ilerledi: Önce Cebel-i Asr, sonra Sahbe, sonra Raciy Vadisi, daha sonra kuzeyden bir rehber eşliğinde yaklaşarak Hayber'e yakın olan Sahbe'ye indiler."
  id: "Pasukan Nabi bergerak dari Madinah ke Khaybar pada sisa bulan Muharram tahun 7 Hijriah, melalui tempat-tempat yang diriwayatkan oleh Al-Raheeq dari Ibnu Ishaq: Jabal Asr, kemudian Al-Sahba, kemudian Wadi Al-Rajee, lalu mendekat dengan pemandu dari utara, dan turun ke Al-Sahba, yang dekat dengan Khaybar."
