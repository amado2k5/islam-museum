id: journey/road-to-khaybar
class: journey
label: { en: "The road to Khaybar", ar: "درب خيبر" }
summary:
  en: "The march of the Prophet's army from Medina to Khaybar in the rest of Muharram, year 7 AH, by the stages al-Raheeq gives from Ibn Ishaq: Jabal 'Asr, al-Sahba, the valley of al-Raji', then the guided approach from the north, and the halt at al-Sahba near Khaybar."
  ar: "مسير جيش النبي من المدينة إلى خيبر في بقية المحرم سنة 7هـ، بالمواضع التي يرويها الرحيق عن ابن إسحاق: جبل عصر، فالصهباء، فوادي الرجيع، ثم الاقتراب بالدليل من جهة الشمال، ونزول الصهباء القريبة من خيبر."
