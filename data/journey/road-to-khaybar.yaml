legs:
  - from: place/medina
    to: place/khaybar
    start: { hijri: "0007-01", status: historical, note: "في بقية المحرم سنة 7هـ بعد العودة من الحديبية (الرحيق ص365)" }
    mode: "مسير الجيش"
    events: [event/battle-of-khaybar]
    note: "على جبل عصر ثم الصهباء ثم نزل واديَ الرجيع، وكان بينه وبين غطفان يوم وليلة؛ ثم سلك بالدليلين طريقاً من جهة الشمال يقطع طريق فرار اليهود إلى الشام، فوقفا عند مفرق الطرق حتى اختار النبي طريق مرحب (الرحيق ص366). وفي الطريق أحاديث الرجز والتكبير والمسير ليلاً (البخاري 2/603). وبالصهباء من أدنى خيبر صلى العصر، ثم بات الجيش قريباً من خيبر ولم تشعر به اليهود (الرحيق ص366-367). المواضع المذكورة لم تُطابق اليوم على الأرض؛ والمسافة إلى خيبر تُذكر في الرحيق ستين إلى ثمانين ميلاً شمال المدينة (ص364)."
    sources: [source/mubarakpuri-raheeq, source/sahih-al-bukhari]
