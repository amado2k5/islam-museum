id: journey/nakhla-expedition-ibn-jahsh
class: journey
kind: military_campaign
label: { ar: "سرية عبد الله بن جحش إلى نخلة", en: "The expedition of Abdullah ibn Jahsh to Nakhla", es: "La expedición de Abdullah ibn Jahsh a Nakhla", fr: "L'expédition d'Abdullah ibn Jahsh à Nakhla" }
summary:
  ar: "بعث النبي عبد الله بن جحش في رجب سنة 2هـ في اثني عشر رجلاً من المهاجرين، وكتب له كتاباً ألا ينظر فيه حتى يسير يومين؛ فإذا فيه أن يمضي حتى ينزل نخلة بين مكة والطائف ليرصد عير قريش ⁦(الرحيق ص200)⁩."
  en: "The Prophet sent Abdullah ibn Jahsh in Rajab of year 2 AH with twelve men of the Muhajirun, and wrote him a letter instructing him not to read it until he had travelled two days. When he looked at it, it said that he should continue until he reached Nakhla, between Mecca and al-Ta'if, to watch for the Quraysh caravan (al-Raheeq, p. 200)."
  es: "El Profeta envió a Abdullah ibn Jahsh en Rajab del año 2 de la Hégira con doce hombres de los Muhajirun, y le escribió una carta indicándole que no la leyera hasta que hubiera viajado dos días. Cuando la leyó, decía que debía continuar hasta llegar a Nakhla, entre La Meca y al-Ta'if, para vigilar la caravana de los Quraysh (al-Raheeq, p. 200)."
  fr: "Le Prophète envoya Abdullah ibn Jahsh en Rajab de l'an 2 de l'Hégire avec douze hommes des Muhajirun, et lui remit une lettre lui recommandant de ne la lire qu'après deux jours de voyage. Lorsqu'il la lut, il y fut indiqué qu'il devait poursuivre sa route jusqu'à Nakhla, entre La Mecque et Taïf, afin d'y surveiller la caravane des Quraysh (al-Raheeq, p. 200)."
