summary:
  ar: "طريق ابن بطوطة من القاهرة إلى عيذاب على البحر الأحمر في سفره إلى الحجاز، عبر الصعيد: بوش ومنية القائد ومنلوى ومنفلوط وأخميم والأقصر وأرمنت وأسنا وأدفو، ثم المطوانى وحميثرا، ثم خمسة عشر يوماً من حميثرا إلى عيذاب. يذكر الكتاب المحطات بأسمائها مع ما يلقاه فيها."
