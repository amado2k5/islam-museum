label: { ar: "من القاهرة إلى عيذاب على درب الصعيد", en: "Cairo to Aydhab by the Upper Egypt road", es: "De El Cairo a Aydhab por la carretera del Alto Egipto", fr: "Du Caire à Aydhab par la route de Haute-Égypte", ur: "قاہرہ تا ایذاب بالائی مصر کی سڑک کے ذریعے", tr: "Yukarı Mısır güzergahı üzerinden Kahire'den Aydab'a", id: "Dari Kairo ke Aydhabha melalui rute Mesir Hulu" }
summary:
  ar: "طريق ابن بطوطة من القاهرة إلى عيذاب على البحر الأحمر في سفره إلى الحجاز، عبر الصعيد: بوش ومنية القائد ومنلوى ومنفلوط وأخميم والأقصر وأرمنت وأسنا وأدفو، ثم المطوانى وحميثرا، ثم خمسة عشر يوماً من حميثرا إلى عيذاب. يذكر الكتاب المحطات بأسمائها مع ما يلقاه فيها."
  en: "Ibn Battuta's road from Cairo to Aydhab on the Red Sea, on his journey to the Hijaz, through Upper Egypt: Bush, Minyat al-Qa'id, Manlawi, Manfalut, Akhmim, Luxor, Armant, Asna and Edfu, then al-Mutawani and Humaythara, then fifteen days from Humaythara to Aydhab. The book names the stations with what he encounters at each."
  es: "El viaje de Ibn Battuta desde El Cairo hasta Aydhab, a orillas del Mar Rojo, en su travesía por el Hiyaz, a través del Alto Egipto: Bush, Minyat al-Qa'id, Manlawi, Manfalut, Akhmim, Luxor, Armant, Asna y Edfu, luego al-Mutawani y Humaythara, y finalmente quince días desde Humaythara hasta Aydhab. El libro describe las estaciones y lo que encuentra en cada una."
  fr: "Le récit du voyage d'Ibn Battuta du Caire à Aydhab, sur la mer Rouge, lors de son périple vers le Hedjaz à travers la Haute-Égypte: Bush, Minyat al-Qa'id, Manlawi, Manfalut, Akhmim, Louxor, Armant, Asna et Edfou, puis al-Mutawani et Humaythara, et enfin quinze jours de marche d'Humaythara à Aydhab. Le livre décrit chaque étape et ce qu'il y découvre."
  ur: "ابن بطوطہ کا قاہرہ سے بحیرہ احمر کے کنارے ایذاب تک کا راستہ، حجاز کے سفر پر، بالائی مصر سے ہوتا ہوا: بش، منیات القاعد، منلوی، منفالوت، اخمیم، لکسور، ارمنت، اسنا اور ادفو، پھر المتوانی اور حمیطرہ، پھر حذمہ سے پندرہ دن۔ کتاب ان اسٹیشنوں کے نام بتاتی ہے جس کا وہ ہر ایک پر سامنا کرتا ہے۔"
  tr: "İbn Battuta'nın Kahire'den Kızıldeniz kıyısındaki Eydabe'ye, Yukarı Mısır üzerinden Hicaz'a yaptığı yolculuktaki güzergahı şöyledir: Bush, Munyat al-Qaid, Manlawi, Manfalut, Akhmim, Luksor, Armant, Esna, Edfu, ardından el-Matwani ve Humaythra, daha sonra Humaythra'dan Eydabe'ye on beş gün. Kitap, durakların isimlerini ve her birinde karşılaştığı şeyleri ayrıntılı olarak anlatıyor."
  id: "Rute Ibn Battuta dari Kairo ke Aydhab di Laut Merah, dalam perjalanannya ke Hijaz, melalui Mesir Hulu: Bush, Munyat al-Qaid, Manlawi, Manfalut, Akhmim, Luxor, Armant, Esna, Edfu, kemudian al-Matwani dan Humaythra, lalu lima belas hari dari Humaythra ke Aydhab. Buku ini menyebutkan nama-nama tempat persinggahan dan apa yang ia temui di setiap tempat."
