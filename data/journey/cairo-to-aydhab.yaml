  - { from: place/cairo, to: place/aydhab, mode: "على ظهر الدواب والجمال", note: "خرج من القاهرة على طريق الصعيد برسم الحجاز، وبات ليلة الخروج بالرباط الذي بناه الصاحب تاج الدين بن حنا بدير الطين، ثم مرّ بمنية القائد وبوش (ص26–27). من الصعيد: منلوى ومنفلوط وأخميم (ص28–29)، ثم الأقصر وأرمنت وأسنا وأدفو، فالمطوانى حيث اكترى الجمال وسافر مع طائفة من العرب (ص30). في حميثرا زار قبر أبي الحسن الشاذلي (ص30)، ومن حميثرا خمسة عشر يوماً حتى عيذاب (ص30–31)؛ ولا يذكر الكتاب التواريخ اليومية لكل منزل.", sources: [source/rihla-ibn-battuta-1958] }
