id: journey/hudaybiyya-march
class: journey
kind: pilgrimage_route
label: { ar: "مسير النبي إلى الحديبية", en: "The march to al-Hudaybiyya", es: "La marcha hacia al-Hudaybiyya", fr: "La marche vers al-Hudaybiyya", ur: "الحدیبیہ کی طرف مارچ", tr: "Peygamberin Hudeybiye yolculuğu", id: "Perjalanan Nabi ke Al-Hudaybiyah" }
summary:
  ar: "مسير النبي من المدينة إلى الحديبية في ذي القعدة سنة 6هـ معتمراً بمن معه، عبر ذي الحليفة ثم قرب عسفان، ثم بطريق وعر بين الشعاب على ثنية المرار حتى أقصى الحديبية. بلغ الحديبية والمشركون يجمعون الخيل عند كراع الغميم على الطريق الرئيسي، فتنكّب النبي الطريق."
  en: "The Prophet's march from Medina to al-Hudaybiyya in Dhu al-Qa'da of year 6 AH, on pilgrimage with those who followed him: past Dhu al-Hulayfa, near Usfan, then by a rough track between the hills over Thaniyyat al-Mirar to the far end of al-Hudaybiyya."
  es: "La marcha del Profeta desde Medina hasta al-Hudaybiyya en Dhu al-Qa'da del año 6 AH, en peregrinación con aquellos que lo siguieron: pasando por Dhu al-Hulayfa, cerca de Usfan, luego por un sendero accidentado entre las colinas, pasando por Thaniyyat al-Mirar hasta el extremo de al-Hudaybiyya."
  fr: "La marche du Prophète de Médine à al-Hudaybiyya en Dhu al-Qa'da de l'an 6 AH, en pèlerinage avec ceux qui le suivaient: passant par Dhu al-Hulayfa, près d'Usfan, puis par un chemin accidenté entre les collines de Thaniyyat al-Mirar jusqu'à l'extrémité d'al-Hudaybiyya."
  ur: "6 ہجری کی ذی القعدہ میں مدینہ سے الحدیبیہ کی طرف نبی کا سفر، اپنے پیروکاروں کے ساتھ حج پر: ماضی ذی الحلیفہ، عسفان کے قریب، پھر ثنیہۃ المرار کی پہاڑیوں کے درمیان ایک ناہموار راستے سے الحدیبیہ کے آخری سرے تک۔"
  tr: "Peygamberimizin Hicretin 6. yılında Zilhicce ayında, sahabeleriyle birlikte Umre yapmak üzere Medine'den Hudeybiye'ye yaptığı yolculuk, Zül-Huleyfe'den geçerek Usfan yakınlarından, ardından Thaniyat-ı Murar'daki dağ geçitleri arasındaki engebeli bir yoldan Hudeybiye'nin en uç noktasına kadar uzandı. Hudeybiye'ye vardığında, müşriklerin ana yol üzerindeki Kara' el-Ghamim'de atlarını topladıklarını gördü, bu yüzden Peygamberimiz farklı bir yoldan gitti."
  id: "Perjalanan Nabi dari Madinah ke Hudaybiyyah pada bulan Dzul Qi'dah tahun ke-6 Hijrah, saat melaksanakan Umrah bersama para sahabatnya, melewati Dzul Hulayfah, kemudian dekat Usfan, lalu menyusuri jalan terjal di antara celah-celah gunung di Thaniyat al-Murar hingga mencapai titik terjauh Hudaybiyyah. Beliau tiba di Hudaybiyyah dan mendapati kaum musyrik sedang mengumpulkan kuda-kuda mereka di Kara' al-Ghamim di jalan utama, sehingga Nabi mengambil rute yang berbeda."
