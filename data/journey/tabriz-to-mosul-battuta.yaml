legs:
  - { from: place/tabriz, to: place/baghdad, mode: "عودة", note: "بعد وصول الرحالة إلى تبريز ومقابلته للسلطان في محلة السلطان، أمر له بالزاد والركوب مع المحمل، وكتب إلى أمير بغداد؛ فعاد إلى بغداد. لا يصف النص طريق العودة، ويذكر أن الركب لم يسافر بعد وأن الباقي من الوقت أزيد من شهرين (ص147)." , sources: [source/rihla-ibn-battuta-1958] }
  - { from: place/baghdad, to: place/samarra, mode: "مسير", note: "من بغداد إلى منزل على نهر دجلة يسقي قرى كثيرة، ثم بعد يومين قرية كبيرة، ثم موضع على شط دجلة قرب حصن المعشوق، وسر من رأى شرقه (ص147). ذكر النص أن الخراب استولى على سامراء فلم يبق منها إلا القليل (ص147)." , sources: [source/rihla-ibn-battuta-1958] }
  - { from: place/samarra, to: place/tikrit, mode: "مسير", note: "مرحلة واحدة من موضع المعشوق قرب سامراء إلى تكريت (ص147–148)." , sources: [source/rihla-ibn-battuta-1958] }
  - { from: place/tikrit, to: place/mosul, mode: "مسير", note: "مرحلتان إلى قرية المقر على دجلة، ثم موضع القيارة وعيون القار، ثم مرحلتان إلى الموصل (ص148). ذكر النص أيضا عيون القار في القيارة (ص148)." , sources: [source/rihla-ibn-battuta-1958] }
  - { from: place/mosul, to: place/nasibin, mode: "مسير", note: "من الموصل إلى عين الرصد على جسر، ثم المويلحة، ثم جزيرة ابن عمر، ثم مرحلتان إلى نصيبين (ص149)." , sources: [source/rihla-ibn-battuta-1958] }
  - { from: place/mosul, to: place/baghdad, mode: "عودة", note: "بعد ماردين وعودته من عند قاضيها، رحل عائدا إلى بغداد فوصل إلى الموصل، ووجد ركب الحجاج خارجها متوجها إلى بغداد، ثم وصل إلى بغداد (ص151). لا يفصل النص الطريق من الموصل إلى بغداد." , sources: [source/rihla-ibn-battuta-1958] }
