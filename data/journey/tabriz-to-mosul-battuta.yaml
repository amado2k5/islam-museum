waypoints:
  - {"place": "place/tabriz", "day": 1, "day_note": "رقم المحطة في ترتيب النص، لا يدل على عدد الأيام ما لم يذكره النص.", "title": {"ar": "تبريز"}, "narrative": {"ar": "وصل إلى تبريز بعد عشرة أيام، ونزل بخارجها في موضع يعرف بالشام عند قبر قازان وزاويته. دخل المدينة ومرّ بأسواقها وبالمسجد الجامع (ص147). ثم أدخله الأمير على السلطان في محلته، فأمر له بالزاد والركوب، وكتب إلى أمير بغداد (ص147)."}, "sources": ["source/rihla-ibn-battuta-1958"]}
  - {"place": "place/baghdad", "day": 2, "day_note": "رقم المحطة في ترتيب النص، لا يدل على عدد الأيام ما لم يذكره النص.", "title": {"ar": "بغداد: العودة والخروج شمالا"}, "narrative": {"ar": "عاد إلى بغداد ومعه كتاب السلطان، وكان الوقت قبل سفر الركب أزيد من شهرين، فقصد الموصل وديار بكر لمشاهدتهما ثم يعود إلى بغداد قبل سفر الركب (ص147)."}, "sources": ["source/rihla-ibn-battuta-1958"]}
  - {"place": "place/samarra", "day": 3, "day_note": "رقم المحطة في ترتيب النص، لا يدل على عدد الأيام ما لم يذكره النص.", "title": {"ar": "سامراء"}, "narrative": {"ar": "نزل قرب حصن المعشوق على شط دجلة، وسامراء شرقه. يصفها النص بأنها معتدلة الهواء حسنة الموقع رغم الخراب الذي استولى عليها، وفيها مشهد صاحب الزمان (ص147–148)."}, "sources": ["source/rihla-ibn-battuta-1958"]}
  - {"place": "place/tikrit", "day": 4, "day_note": "رقم المحطة في ترتيب النص، لا يدل على عدد الأيام ما لم يذكره النص.", "title": {"ar": "تكريت"}, "narrative": {"ar": "وصفها النص بأنها مدينة كبيرة فسيحة الأسواق كثيرة الجوامع، أهلها موصوفون بحسن الأخلاق، وفيها قلعة حصينة على شط دجلة (ص148)."}, "sources": ["source/rihla-ibn-battuta-1958"]}
  - {"place": "place/mosul", "day": 5, "day_note": "رقم المحطة في ترتيب النص، لا يدل على عدد الأيام ما لم يذكره النص.", "title": {"ar": "الموصل: المدينة والمزار"}, "narrative": {"ar": "وصفها النص بأنها مدينة عتيقة كثيرة الخصب، وقلعتها الحدباء، وأسوارها المتعددة، وربضها الكبير بالجوامع والحمامات والأسواق. زار فيها مشهد النبي جرجيس، وتل النبي يونس ومحرابه، وذكر أن أهلها أهل مكارم وحسن استقبال للغريب (ص148–149). ويذكر النص أن خرابا قرب الموصل يقال إنه موضع نينوى (ص149)."}, "sources": ["source/rihla-ibn-battuta-1958"]}
  - {"place": "place/nasibin", "day": 6, "day_note": "رقم المحطة في ترتيب النص، لا يدل على عدد الأيام ما لم يذكره النص.", "title": {"ar": "نصيبين"}, "narrative": {"ar": "وصفها النص بأنها مدينة عظيمة عتيقة خرب أكثرها، في بسيط واسع فيه المياه الجارية والبساتين، ويصنع فيها ماء الورد. ويذكر أن نهرها يدخل المدينة ويجري في شوارعها وصحن جامعها، وفيها مارستان ومدرستان (ص149–150). ونقل بيت أبي نواس عنها (ص150)."}, "sources": ["source/rihla-ibn-battuta-1958"]}
  - {"place": "place/mosul", "day": 7, "day_note": "رقم المحطة في ترتيب النص، لا يدل على عدد الأيام ما لم يذكره النص.", "title": {"ar": "الموصل: العودة"}, "narrative": {"ar": "عاد إلى الموصل في طريقه إلى بغداد، فوجد ركب الحجاج خارجها متجها إلى بغداد (ص151)."}, "sources": ["source/rihla-ibn-battuta-1958"]}
  - {"place": "place/baghdad", "day": 8, "day_note": "رقم المحطة في ترتيب النص، لا يدل على عدد الأيام ما لم يذكره النص.", "title": {"ar": "بغداد: الوصول الأخير"}, "narrative": {"ar": "وصل إلى بغداد ووجد الحاج في أهبة الرحيل، فطلب من أميرها ما أمر له به السلطان من الزاد والمركوب والرفقة (ص151). يتوقف هذا الجزء عند الاستعداد للحج، والنص بعد ذلك يحكي الحج وأحداثه (ص151–152)."}, "sources": ["source/rihla-ibn-battuta-1958"]}
