label: { ar: "من تبريز إلى الموصل وديار بكر ثم العودة إلى بغداد" }
summary:
  ar: "طريق ابن بطوطة بعد وصوله إلى تبريز: العودة إلى بغداد، ثم سامراء وتكريت والموصل، فنصيبين، ثم سنجار ودارا وماردين في طريقه إلى ديار بكر، فالعودة إلى الموصل وبغداد. يذكر النص المحطات بأسمائها، ولا يذكر تواريخ يومية لكل منزل، والمسافات بالمراحل حيث وردت."
wings: [time, place, people]
