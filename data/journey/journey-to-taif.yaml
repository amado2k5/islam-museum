    start: { edtf: "0619-05~", calendar: julian, precision: month, status: tradition, note: "شوال سنة 10 من النبوة؛ الموافقة الميلادية تقدير الرحيق (ص125)." }
    mode: "سيراً على الأقدام"
    events: [event/journey-to-taif]
    note: "نحو ستين ميلاً ماشياً، ومعه زيد بن حارثة، يدعو كل قبيلة يمر بها فلا تجيبه واحدة (الرحيق ص125)."
  - from: place/taif
    to: place/taif
    mode: "إقامة"
    note: "أقام عشرة أيام يلقى أشراف ثقيف، فردّوه جميعاً؛ ثم لما خرج أغروا به سفهاءهم وعبيدهم فرجموه حتى اختضبت نعلاه بالدم، ويقيه زيد بنفسه حتى شُجّ رأسه (الرحيق ص125)."
  - from: place/taif
    to: place/wadi-nakhla
    mode: "لم يذكر النص وسيلة السفر"
    note: "انتهى الرجم به إلى حائط لعتبة وشيبة ابني ربيعة على ثلاثة أميال من الطائف؛ فدعا تحت ظل حبلة عنب، فأرسل ابنا ربيعة إليه بعنب مع غلامهما عداس الذي أسلم. ثم رجع في طريق مكة، فبلغ قرن المنازل فعرض عليه ملك الجبال أن يطبق الأخشبين فأبى، ثم وصل وادي نخلة (الرحيق ص125-127؛ البخاري بدء الخلق)."
    sources: [source/mubarakpuri-raheeq, source/sahih-al-bukhari]
  - from: place/wadi-nakhla
    to: place/mecca
    mode: "لم يذكر النص وسيلة السفر"
    note: "أقام بوادي نخلة أياماً، فاستمع إليه نفر من الجن وآمنوا (الأحقاف 29-31، الجن 1؛ الرحيق ص127-128). ثم دنا من مكة، فأجاره المطعم بن عدي، فدخل المسجد الحرام وصلى ركعتين (الرحيق ص128-129؛ ابن هشام)."
    sources: [source/mubarakpuri-raheeq, source/ibn-hisham-sira]
