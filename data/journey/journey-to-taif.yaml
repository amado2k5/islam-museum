    date: { edtf: "0619-05~", calendar: julian, precision: month, status: tradition, note: "شوال سنة 10 من النبوة (الرحيق ص125)." }
    title: { ar: "الخروج من مكة بعد عام الحزن" }
    narrative:
      ar: "بعد وفاة أبي طالب ثم خديجة في السنة العاشرة اشتدّ أذى قريش على النبي، فخرج إلى الطائف يرجو أن يجيبوه أو يؤوه وينصروه على قومه، فلم يجد من يؤويه ولا من ينصره (الرحيق ص117). وخرج ماشياً ومعه مولاه زيد بن حارثة (ص125)."
    events: [event/year-of-sorrow]
    sources: [source/mubarakpuri-raheeq]
  - place: place/taif
    day: 2
    day_status: debated
    day_note: "لا يحدد الرحيق يوم الوصول؛ الرقم ترتيب نسبي، والإقامة عشرة أيام."
    title: { ar: "الطائف: الإخوة الثلاثة وعشرة أيام من الرد" }
    narrative:
      ar: "قصد النبي ثلاثة إخوة من رؤساء ثقيف: عبد ياليل ومسعود وحبيب أبناء عمرو بن عمير؛ فعرض عليهم الإسلام والنصرة، فردّ كل واحد منهم ردّاً يقطع الطريق على الحجة، وقال أحدهم إنه لو كان رسولاً فهو أعظم خطراً من أن يُرَدّ عليه الكلام. ثم أقام عشرة أيام يلقى أشرافهم، فردّوه جميعاً وأغروا به السفهاء (الرحيق ص125)."
    events: [event/journey-to-taif]
    sources: [source/mubarakpuri-raheeq, source/ibn-hisham-sira]
  - place: place/wadi-nakhla
    day: 12
    day_status: debated
    day_note: "بعد عشرة أيام الإقامة بالطائف؛ لا يحدد الرحيق مدة السير والإقامة في الطريق."
    title: { ar: "وادي نخلة: نفر من الجن يستمعون القرآن" }
    narrative:
      ar: "أقام النبي بوادي نخلة أياماً، فصرف الله إليه نفراً من الجن استمعوا القرآن ثم رجعوا إلى قومهم منذرين، ولم يكن النبي يعلم بحضورهم حتى أخبره الله بذلك بالآيات (الأحقاف 29-31، الجن 1؛ الرحيق ص127-128)."
    sources: [source/mubarakpuri-raheeq]
  - place: place/mecca
    day: 14
    day_status: debated
    day_note: "لا يحدد الرحيق عدد الأيام بين نخلة ومكة."
    title: { ar: "العودة إلى مكة في جوار المطعم بن عدي" }
    narrative:
      ar: "لما دنا من مكة أرسل إلى المطعم بن عدي يطلب جواره، فأجاره، فأعلن المطعم أمام قريش أنه قد أجار محمداً فلا يهجه أحد؛ فدخل المسجد الحرام واستلم الركن وصلى ركعتين، ثم انصرف إلى بيته وأبناء المطعم وقومه بالسلاح حوله حتى دخل (الرحيق ص128-129)."
    sources: [source/mubarakpuri-raheeq]
