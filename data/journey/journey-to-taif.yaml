label: { ar: "درب الطائف" }
summary:
  ar: "مسير النبي ماشياً من مكة إلى الطائف في شوال سنة 10 من النبوة، ومعه زيد بن حارثة؛ ثم إقامته بالطائف عشرة أيام، وعودته عن طريق وادي نخلة إلى مكة في جوار المطعم بن عدي. لا تُذكر هنا إلا المواضع التي سمّاها الرحيق ولها مدخل في المعجم، ولا يذكر الرحيق أيام السير."
