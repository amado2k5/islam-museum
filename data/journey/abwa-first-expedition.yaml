label: { ar: "غزوة الأبواء ⁦(ودان)⁩ أول غزوات النبي", en: "The expedition to al-Abwa (Waddan), the first of the Prophet's campaigns", es: "La expedición a al-Abwa (Waddan), la primera de las campañas del Profeta.", fr: "L'expédition à al-Abwa (Waddan), la première des campagnes du Prophète", ur: "ابوا ⁦(ودان)⁩ کی طرف غزوہ جو کہ رسول اللہ کی پہلی مہم ہے۔" }
summary:
  ar: "خرج النبي في صفر سنة 2هـ في سبعين رجلاً من المهاجرين، يعترض عيراً لقريش، حتى بلغ ودان فلم يلق كيداً، واستخلف على المدينة سعد بن عبادة، وعقد فيها معاهدة مع بني ضمرة. غاب خمس عشرة ليلة ⁦(الرحيق ص198)⁩."
  en: "The Prophet set out in Safar of year 2 AH with seventy men of the Muhajirun, intending to intercept a Quraysh caravan. He reached Waddan without meeting any opposition, left Sa'd ibn 'Ubadah in charge of Medina, and made a treaty there with Banu Damra. He was away for fifteen nights (al-Raheeq, p. 198)."
  es: "El Profeta partió en Safar del año 2 de la Hégira con setenta hombres de los Muhajirun, con la intención de interceptar una caravana de los Quraysh. Llegó a Waddan sin encontrar resistencia, dejó a Sa'd ibn 'Ubadah al mando de Medina y allí firmó un tratado con los Banu Damra. Estuvo ausente quince noches (al-Raheeq, p. 198)."
  fr: "Le Prophète partit en Safar de l'an 2 de l'Hégire avec soixante-dix hommes de la tribu des Muhajirun, dans l'intention d'intercepter une caravane qurayshite. Il atteignit Waddan sans rencontrer d'opposition, confia Médine à Sa'd ibn 'Ubadah et y conclut un traité avec les Banu Damra. Il fut absent pendant quinze nuits (al-Raheeq, p. 198)."
  ur: "نبی کریم صفر 2 ہجری میں مہاجرین کے ستر آدمیوں کے ساتھ قریش کے قافلے کو روکنے کے لیے روانہ ہوئے۔ وہ بغیر کسی مخالفت کے ودان پہنچا، سعد بن عبادہ کو مدینہ کا انچارج چھوڑ دیا اور وہاں بنو دمرہ سے معاہدہ کیا۔ وہ پندرہ راتوں تک دور رہا ⁦(الرحیق، صفحہ 198)⁩۔"
