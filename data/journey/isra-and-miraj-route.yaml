id: journey/isra-and-miraj-route
class: journey
kind: travel
label: { ar: "درب الإسراء", en: "The Isra route", es: "La ruta de Isra", fr: "La route d'Isra", ur: "اسرا کا راستہ" }
summary:
  ar: "المسار الأرضي للإسراء بالنبي ليلاً على البراق من المسجد الحرام بمكة إلى المسجد الأقصى في بيت المقدس، كما يرويه الرحيق؛ ولا يذكر النص محطات بينهما. أما العروج إلى السماوات فليس مساراً جغرافياً ولم يُدرج هنا."
  en: "The earthly leg of the Isra: the Prophet's night journey on the Buraq from al-Masjid al-Haram in Mecca to al-Masjid al-Aqsa in Jerusalem, as al-Raheeq narrates it. The text gives no halting places between them. The ascent through the heavens is not a geographic route and is not listed here."
  es: "La etapa terrenal del Isra: el viaje nocturno del Profeta en el Buraq desde la Mezquita Sagrada de La Meca hasta la Mezquita de Al-Aqsa en Jerusalén, según lo narra al-Raheeq. El texto no menciona lugares de descanso intermedios. El ascenso a través de los cielos no es una ruta geográfica y, por lo tanto, no se incluye aquí."
  fr: "L'étape terrestre de l'Isra: le voyage nocturne du Prophète sur le Buraq, de la Mosquée sacrée de La Mecque à la Mosquée Aqsa à Jérusalem, tel que relaté par al-Raheeq. Le texte ne mentionne aucune halte entre les deux. L'ascension céleste ne correspond pas à un itinéraire géographique et n'est donc pas décrite ici."
  ur: "اسراء کی زمینی ٹانگ: مکہ میں مسجد الحرام سے یروشلم میں مسجد الاقصی تک براق پر نبی کا رات کا سفر، جیسا کہ الرحیق نے بیان کیا ہے۔ متن ان کے درمیان کوئی رکنے کی جگہ نہیں دیتا ہے۔ آسمانوں کے ذریعے چڑھائی کوئی جغرافیائی راستہ نہیں ہے اور یہاں درج نہیں ہے۔"
