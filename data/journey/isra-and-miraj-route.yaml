    title: { ar: "الإسراء من المسجد الحرام", en: "Setting out from al-Masjid al-Haram" }
    narrative:
      ar: "أُسري بالنبي ليلاً من المسجد الحرام، بجسده على الصحيح، راكباً على البراق بصحبة جبريل (الرحيق ص138)."
      en: "The Prophet was taken by night from al-Masjid al-Haram, in body according to the sounder view, riding the Buraq with Jibril (al-Raheeq p. 138)."
