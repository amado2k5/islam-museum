label: { ar: "درب الإسراء", en: "The Isra route" }
summary:
  ar: "المسار الأرضي للإسراء بالنبي ليلاً على البراق من المسجد الحرام بمكة إلى المسجد الأقصى في بيت المقدس، كما يرويه الرحيق؛ ولا يذكر النص محطات بينهما. أما العروج إلى السماوات فليس مساراً جغرافياً ولم يُدرج هنا."
  en: "The earthly leg of the Isra: the Prophet's night journey on the Buraq from al-Masjid al-Haram in Mecca to al-Masjid al-Aqsa in Jerusalem, as al-Raheeq narrates it. The text gives no halting places between them. The ascent through the heavens is not a geographic route and is not listed here."
