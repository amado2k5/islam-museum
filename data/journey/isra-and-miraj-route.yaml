    title: { ar: "المسجد الأقصى والصلاة بالأنبياء", en: "Al-Aqsa and the prayer with the prophets" }
    narrative:
      ar: "نزل النبي في بيت المقدس وصلى بالأنبياء إماماً، وربط البراق بحلقة باب المسجد، ثم عُرج به تلك الليلة من بيت المقدس إلى السماء الدنيا (الرحيق ص138)."
      en: "He landed in Jerusalem, led the prophets in prayer, tied the Buraq to the ring of a door of the mosque, and was then ascended that night from Jerusalem to the lowest heaven (al-Raheeq p. 138)."
