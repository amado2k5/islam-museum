id: journey/dumat-al-jandal-expedition
class: journey
label: { ar: "بعث خالد إلى دومة الجندل", en: "Sending Khalid to Dumat al-Jandal", es: "Envío de Khalid a Dumat al-Jandal", fr: "Envoi de Khalid à Dumat al-Jandal", ur: "خالد کو دمت الجندل بھیجنا", tr: "Halid, Dumat al-Jandal'a gönderildi", id: "Khalid diutus ke Dumat al-Jandal" }
summary:
  ar: "بعث النبي خالد بن الوليد من تبوك إلى أكيدر بن عبد الملك صاحب دومة الجندل؛ فأُخذ أكيدر وهو يخرج لصيد البقر في ليلة مقمرة، ثم صالحه النبي على الجزية. النص لا يذكر طريق الذهاب ولا مدته."
  en: "The Prophet sent Khalid ibn al-Walid from Tabuk to Ukaydir ibn 'Abd al-Malik, ruler of Dumat al-Jandal. Ukaydir was seized as he was going out to hunt cattle on a moonlit night, and the Prophet then concluded a settlement with him on payment of the jizya. The text does not mention the route of the outward journey or its duration."
  es: "El Profeta envió a Khalid ibn al-Walid desde Tabuk hasta Ukaydir ibn 'Abd al-Malik, gobernante de Dumat al-Jandal. Ukaydir fue apresado cuando salía a cazar ganado en una noche de luna llena, y el Profeta llegó a un acuerdo con él mediante el pago de la jizya. El texto no menciona la ruta del viaje de ida ni su duración."
  fr: "Le Prophète envoya Khalid ibn al-Walid de Tabuk auprès d'Ukaydir ibn 'Abd al-Malik, souverain de Dumat al-Jandal. Ukaydir fut arrêté alors qu'il partait chasser le bétail par une nuit de pleine lune, et le Prophète conclut alors un accord avec lui moyennant le paiement de la jizya. Le texte ne précise ni l'itinéraire du voyage aller ni sa durée."
  ur: "نبی نے خالد بن الولید کو تبوک سے دمت الجندل کے حکمران عقیدیر بن عبد الملک کے پاس بھیجا۔ عقیدیر کو اس وقت پکڑ لیا گیا جب وہ چاندنی رات میں مویشیوں کے شکار کے لیے نکلا تھا، اور پھر نبی نے جزیہ کی ادائیگی پر اس کے ساتھ معاہدہ کیا۔ متن میں ظاہری سفر کے راستے یا اس کی مدت کا ذکر نہیں ہے۔"
  tr: "Peygamberimiz Halid ibn el-Velid'i Tebük'ten Dumat el-Cendal hükümdarı Ukaydir ibn Abd el-Malik'e gönderdi. Ukaydir, ay ışığı altında sığır avlarken yakalandı ve Peygamberimiz cizye (vergi) karşılığında onunla barıştı. Metinde seferin güzergahı veya süresi belirtilmemektedir."
  id: "Nabi Muhammad SAW mengutus Khalid bin al-Walid dari Tabuk kepada Ukaydir bin Abd al-Malik, penguasa Dumat al-Jandal. Ukaydir ditangkap saat berburu ternak di malam yang diterangi bulan, dan Nabi kemudian berdamai dengannya dengan imbalan jizya (upeti). Teks tersebut tidak menyebutkan rute yang ditempuh atau durasi ekspedisi."
