label: { ar: "من بغداد إلى المدينة على طريق الحاج العراقي", en: "From Baghdad to Medina on the Iraqi pilgrim road" }
summary:
  ar: "مقطع من رحلة ابن جبير: من بغداد إلى الحلة ثم الكوفة، ثم مع الحاج العراقي على طريق البادية عبر المنازل والمصانع إلى الحاجر فالمدينة. النص لا يذكر سنة هذا المقطع في موضعه، ولا يُدرج هنا إلا المحطات التي يسميها بالترتيب."
