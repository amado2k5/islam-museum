legs:
  - { from: place/baghdad, to: place/kufa, mode: "طريق الحاج البري من بغداد", note: "من بغداد إلى الحلة مروراً بالقرية وبالقنطرة والقراش وزريران على شط الفرات، ثم عبور الجسر إلى الحلة، ثم سير الحاج إلى الكوفة. النص يذكر أيام الأسبوع دون تحديد سنة، فلا يُثبت هنا تاريخ هجري (الصفحات 205–212).", sources: [source/rihla-ibn-jubayr-1907] }
  - { from: place/kufa, to: place/medina, mode: "طريق الحاج البري عبر البادية", note: "من الكوفة إلى العقبة ثم واقصة والغرعاء والشقرق وزبالة والهيثمين، ثم بركة المرجوم والبيداء وزرود وستميرة، ثم النقرناة، ثم الحاجر، ثم المدينة حيث أقاموا خمسة أيام (الصفحات 213–219).", sources: [source/rihla-ibn-jubayr-1907] }
