id: journey/first-migration-to-abyssinia
class: journey
label: { ar: "درب الهجرة الأولى إلى الحبشة", en: "The first migration to Abyssinia", es: "La primera migración a Abisinia", fr: "La première migration vers l'Abyssinie", ur: "حبشہ کی طرف پہلی ہجرت", tr: "Habeşistan'a ilk göç yolu", id: "Rute migrasi pertama ke Abyssinia" }
summary:
  ar: "خرج أول فوج من المسلمين في رجب سنة خمس من النبوة، اثنا عشر رجلاً وأربع نسوة، تسللاً إلى ميناء شعيبة فأقلتهم سفينتان تجاريتان إلى الحبشة، ثم رجع بعضهم إلى مكة في شوال على خبر باطل فعاد بعضهم إلى الحبشة، وأرسلت قريش وفداً بالهدايا إلى النجاشي."
  en: "The first group of Muslims left Mecca in Rajab of the fifth year of prophethood, twelve men and four women, slipping to the port of Shu'ayba, where two trading ships carried them to Abyssinia. Some returned to Mecca on false news and went back; Quraysh then sent a delegation with gifts to the Negus."
  es: "El primer grupo de musulmanes partió de La Meca en Rajab del quinto año de la profecía, doce hombres y cuatro mujeres, dirigiéndose sigilosamente al puerto de Shu'ayba, donde dos barcos mercantes los transportaron a Abisinia. Algunos regresaron a La Meca con noticias falsas; entonces, los Quraysh enviaron una delegación con regalos al Negus."
  fr: "Le premier groupe de musulmans quitta La Mecque en Rajab de la cinquième année de la prophétie; il s’agissait de douze hommes et quatre femmes qui gagnèrent clandestinement le port de Shu’ayba, d’où deux navires marchands les emmenèrent en Abyssinie. Certains retournèrent à La Mecque suite à de fausses nouvelles et repartirent. Les Qurayshites envoyèrent alors une délégation avec des présents au Négus."
  ur: "مسلمانوں کا پہلا گروہ نبوت کے پانچویں سال رجب میں مکہ سے نکلا، بارہ مرد اور چار عورتیں، شعبی کی بندرگاہ پر پھسل گئیں، جہاں سے دو تجارتی جہاز انہیں حبشہ لے گئے۔ بعض جھوٹی خبروں پر مکہ واپس چلے گئے۔ اس کے بعد قریش نے نجاشی کے پاس تحفے کے ساتھ ایک وفد بھیجا۔"
  tr: "Peygamberliğin beşinci yılı olan Receb ayında, on iki erkek ve dört kadından oluşan ilk Müslüman grubu gizlice Şuaybe limanına gitti. İki ticaret gemisi onları Habeşistan'a götürdü. Daha sonra bir kısmı yanlış haberlere dayanarak Şevval ayında Mekke'ye döndü, bir kısmı da tekrar Habeşistan'a gitti. Kureyş, Negus'a hediyelerle dolu bir heyet gönderdi."
  id: "Kelompok Muslim pertama berangkat pada bulan Rajab, tahun kelima kenabian, terdiri dari dua belas laki-laki dan empat perempuan, menyelinap ke pelabuhan Syu'aiyah. Dua kapal dagang membawa mereka ke Abyssinia. Kemudian sebagian dari mereka kembali ke Mekah pada bulan Syawal berdasarkan berita palsu, dan sebagian lagi kembali ke Abyssinia. Quraisy mengirimkan delegasi dengan hadiah kepada Negus."
