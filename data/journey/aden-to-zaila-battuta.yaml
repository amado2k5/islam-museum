label: { ar: "من عدن إلى زيلع في البحر في رحلة ابن بطوطة", en: "From Aden to Zeila by sea on Ibn Battuta's journey", es: "Desde Adén hasta Zeila por mar en el viaje de Ibn Battuta", fr: "D'Aden à Zeila par la mer, le voyage d'Ibn Battuta", ur: "ابن بطوطہ کے سفر میں سمندر کے راستے عدن سے زیلہ تک" }
summary:
  ar: "مرحلة بحرية في رحلة ابن بطوطة: بعد أن أقام في عدن وتعرف إلى قضاتها وعلمائها، سافر منها في البحر أربعة أيام حتى وصل إلى زيلع، مدينة البربرة من السودان، وهم شافعية المذهب."
  en: "A sea stage of Ibn Battuta's journey. After he stayed in Aden and became acquainted with its judges and scholars, he sailed from it by sea for four days until he reached Zeila, a city of the Barbara from the Sudan, whose people follow the Shafi'i school of law."
  es: "Una etapa marítima del viaje de Ibn Battuta. Tras su estancia en Adén, donde conoció a sus jueces y eruditos, zarpó por mar durante cuatro días hasta llegar a Zeila, una ciudad de los bárbaros del Sudán, cuyos habitantes siguen la escuela jurídica shafi'í."
  fr: "Une étape maritime du voyage d'Ibn Battuta. Après avoir séjourné à Aden et fait la connaissance de ses juges et de ses érudits, il embarqua pendant quatre jours jusqu'à Zeila, une ville des Barbes du Soudan, dont les habitants suivent l'école de droit chaféite."
  ur: "ابن بطوطہ کے سفر کا ایک سمندری مرحلہ۔ عدن میں قیام کرنے کے بعد اور اس کے قاضیوں اور علماء سے واقفیت حاصل کرنے کے بعد، اس نے اس سے چار دن تک سمندری سفر کیا یہاں تک کہ وہ سوڈان سے تعلق رکھنے والے باربرا کے شہر زیلا پہنچے، جس کے لوگ شافعی مکتبِ قانون کی پیروی کرتے ہیں۔"
