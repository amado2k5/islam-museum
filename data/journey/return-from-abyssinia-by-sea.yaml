label: { ar: "عودة مهاجري الحبشة إلى خيبر", en: "The emigrants' return from Abyssinia to Khaybar", es: "El regreso de los emigrantes de Abisinia a Khaybar", fr: "Le retour des émigrants d'Abyssinie à Khaybar", ur: "حبشہ سے خیبر کی طرف مہاجرین کی واپسی۔", tr: "Habeşistanlı göçmenlerin Hayber'e dönüşü", id: "Kembalinya para migran Abyssinia ke Khaybar" }
summary:
  ar: "رحلة المهاجرين من أرض الحبشة إلى النبي بخيبر في سفينتين حملهما النجاشي مع عمرو بن أمية الضمري، بعد الحديبية. لا يسمّي ابن إسحاق الميناء ولا الطريق، ويقول إنهم قدموا والنبي بخيبر."
  en: The emigrants' voyage from Abyssinia to the Prophet at Khaybar in the two ships the Negus provided, with Amr ibn Umayya al-Damri, after al-Hudaybiyya. Ibn Ishaq names neither the port nor the route, and says they arrived while the Prophet was at Khaybar.
  es: "El viaje de los emigrantes desde Abisinia hasta Khaybar para encontrarse con el Profeta en los dos barcos que el Negus proporcionó, con Amr ibn Umayya al-Damri a bordo, tras la visita de al-Hudaybiyya. Ibn Ishaq no menciona ni el puerto ni la ruta, y afirma que llegaron mientras el Profeta se encontraba en Khaybar."
  fr: "Le voyage des émigrants d'Abyssinie jusqu'au Prophète à Khaybar, à bord des deux navires fournis par le Négus, fut relaté par Amr ibn Umayya al-Damri, après al-Hudaybiyya. Ibn Ishaq ne mentionne ni le port ni la route, et précise qu'ils arrivèrent alors que le Prophète se trouvait à Khaybar."
  ur: "حبشہ سے نبی کی طرف مہاجرین کا سفر ان دو بحری جہازوں میں جو نجاشی نے عمرو بن امیہ الدمری کے ساتھ الحدیبیہ کے بعد فراہم کیے تھے۔ ابن اسحاق نہ تو بندرگاہ کا نام بتاتے ہیں اور نہ راستے کا، اور کہتے ہیں کہ وہ اس وقت پہنچے جب رسول اللہ خیبر میں تھے۔"
  tr: "Hudeybiye Antlaşması'ndan sonra, Habeşistan'dan Hayber'deki Peygamber'in yanına göç edenlerin yolculuğu, Negus tarafından sağlanan iki gemiyle ve Amr ibn Umayya al-Damri'nin eşliğinde gerçekleşti. İbn İshak, limanı veya güzergahı belirtmez ve Peygamber Hayber'deyken oraya vardıklarını söyler."
  id: "Perjalanan para migran dari Abyssinia menuju Nabi di Khaybar berlangsung dengan dua kapal yang disediakan oleh Negus, didampingi oleh Amr ibn Umayya al-Damri, setelah Perjanjian Hudaybiyya. Ibn Ishaq tidak menyebutkan pelabuhan atau rutenya, dan mengatakan bahwa mereka tiba ketika Nabi berada di Khaybar."
