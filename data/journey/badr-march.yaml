label: { ar: "مسير جيش المدينة إلى بدر", en: "The Medina army's march to Badr" }
summary:
  ar: "مسير الجيش الإسلامي من المدينة إلى بدر في رمضان 2هـ: من نقب المدينة إلى بئر الروحاء، فانحرافاً عن طريق مكة عند النازية إلى رحقان ومضيق الصفراء، فذي أفران فالأصافير فالدّبّة، حتى نزول الماء ببدر (الرحيق ص205–211)."
  en: "The Muslim army's route from Medina to Badr in Ramadan 2 AH: out of Medina's pass to Bir al-Rawha, off the Mecca road at al-Naziya to Rahqan and the Safra pass, then Dhi Afran, al-Asafir and al-Dabba, to the wells of Badr."
wings: [time, place, people]
periods: [period/prophetic-era]
regions: [arabia]
travelers: [person/muhammad, person/abu-bakr, person/umar-ibn-al-khattab, person/ali-ibn-abi-talib, person/hamza, person/musab-ibn-umayr]
legs:
  - { from: place/medina, to: place/bir-al-rawha, mode: march, note: "خرج من نقب المدينة على الطريق الرئيسي المؤدي إلى مكة حتى بئر الروحاء، وردّ منها أبا لبابة بن عبد المنذر واستعمله على المدينة (الرحيق ص205)", sources: [source/mubarakpuri-raheeq] }
  - { from: place/bir-al-rawha, to: place/rahqan, mode: march, note: "ترك طريق مكة بيساره وانحرف ذات اليمين على النازية، ثم جزع وادي رحقان بين النازية ومضيق الصفراء (الرحيق ص205)", sources: [source/mubarakpuri-raheeq] }
  - { from: place/rahqan, to: place/al-safra, mode: march, note: "مر على مضيق الصفراء وانصب حتى قرب من الصفراء، وبعث منها بسباس بن عمرو وعدي بن أبي الزغباء الجهنيين يتجسسان أخبار العير ببدر (الرحيق ص205)", sources: [source/mubarakpuri-raheeq] }
  - { from: place/al-safra, to: place/dhi-afran, mode: march, note: "بوادي ذي أفران بلغته أخبار العير والنفير معاً، وفيه عقد المجلس الاستشاري (الرحيق ص208–210)", sources: [source/mubarakpuri-raheeq] }
  - { from: place/dhi-afran, to: place/al-dabba, mode: march, note: "سلك على ثنايا يقال لها الأصافير ثم انحط إلى بلد يقال له الدّبّة، وترك الحنان بيمينه (الرحيق ص210)", sources: [source/mubarakpuri-raheeq] }
  - { from: place/al-dabba, to: place/badr, mode: march, note: "نزل قريباً من بدر، ثم سبق إلى مائها بمشورة الحباب بن المنذر فنزل على أدنى ماء من العدو وصنع الحِياض وغوَّر ما عداها من القلب (الرحيق ص210–211)", sources: [source/mubarakpuri-raheeq, source/ibn-hisham-sira] }
