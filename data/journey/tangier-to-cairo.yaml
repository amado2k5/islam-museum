label: { ar: "من تلمسان إلى القاهرة في رحلة ابن بطوطة من المغرب", en: "From Tlemcen to Cairo on Ibn Battuta's road from the Maghreb" }
summary:
  ar: "طريق ابن بطوطة من المغرب إلى القاهرة في أول رحلته: من تلمسان عبر الجزائر وبجاية وقسنطينة وبونة إلى تونس، ثم سوسة وصفاقس وقابس وطرابلس، ثم الساحل الليبي إلى الإسكندرية، ومنها عبر الدلتا إلى دمياط وصعوداً في النيل إلى القاهرة. يذكر الكتاب مولده بطنجة، ولا يصف في هذا المقطع طريقه من طنجة إلى تلمسان."
wings: []
periods: [period/mongol-post-mongol]
regions: [maghreb, egypt-nile]
travelers: [person/ibn-battuta-muhammad]
legs:
  - { from: place/tlemcen, to: place/atrabulus, mode: "على ظهر الدواب", note: "وصل تلمسان ووافق بها رسولي ملك إفريقية، فلحقهما إلى مليانة (ص5)؛ ثم الجزائر وبجاية (ص5)، فقسنطينة وبونة (ص6)، فتونس فأقام بها وشهد عيد الفطر (ص7)، وخرج منها في أواخر ذي القعدة على الساحل إلى سوسة ثم صفاقس (ص7)، فقابس فأقام بها عشرة أيام لتوالي المطر (ص8)، ثم طرابلس (ص8). لم يُذكر تاريخ الوصول إلى تلمسان ولا غيرها من هذه المدن بيوم وشهر في هذا القسم. الأسماء الواردة بين تلمسان وطرابلس لا توجد لها ملفات مكان بعد؛ انظر ملاحظات الترقيم.", sources: [source/rihla-ibn-battuta-1958] }
  - { from: place/atrabulus, to: place/alexandria, end: { hijri: "0726-05-01", precision: day, status: historical, note: "أول جمادى الأولى؛ السنة من قوله إنه خرج من طرابلس في أواخر المحرم من عام ستة وعشرين (ص8)" }, mode: "على ظهر الدواب مع ركب من المصامدة", note: "خرج من طرابلس في أواخر المحرم من عام ستة وعشرين، ومرّ بمسلاتة ومسراتة وقصور سرت (ص8)، فقصر برصيصا، ثم قبة سلام، ثم الإسكندرية في أول جمادى الأولى (ص8). ولم تُذكر أيام كل مرحلة بين طرابلس والإسكندرية.", sources: [source/rihla-ibn-battuta-1958] }
  - { from: place/alexandria, to: place/dimyat, mode: "على ظهر الدواب", note: "من الإسكندرية إلى قرية تروجه على نصف يوم منها (ص14)، ثم دمنهور (ص14)، ثم فوة وقد قصد زاويتها (ص14–15)، ثم دمياط (ص17). في الطريق ذكر أخباراً عن الإسكندرية وعلمائها (ص9–13). لم يُذكر تاريخ الرحلة بين هذه المواضع.", sources: [source/rihla-ibn-battuta-1958] }
  - { from: place/dimyat, to: place/cairo, mode: "على ظهر الدواب ثم في النيل صاعداً", note: "من دمياط إلى فارسكور (ص18)، ثم أشمون الرمان (ص18)، ثم سمنود (ص18)؛ ومن سمنود ركب النيل صاعداً إلى مصر، وذكر المدن والقرى المتصلة على الشاطئ بين الإسكندرية ومصر (ص19)، ثم وصل مدينة مصر (ص19).", sources: [source/rihla-ibn-battuta-1958] }
sources: [source/rihla-ibn-battuta-1958]
