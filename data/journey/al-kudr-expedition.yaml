label: { ar: "غزوة بني سليم بالكدر", en: "The expedition against Banu Sulaym at al-Kudr", es: "La expedición contra Banu Sulaym en al-Kudr", fr: "L'expédition contre Banu Sulaym à al-Kudr", ur: "القدر میں بنو سلیم کے خلاف مہم" }
summary:
  ar: "خرج النبي من المدينة في مائتي راكب إلى منازل بني سليم في الكدر، ففروا وتركوا خمسمائة بعير، ثم أقام في ديارهم ثلاثة أيام ورجع إلى المدينة."
  en: "The Prophet set out from Medina with two hundred riders to the dwellings of Banu Sulaym at al-Kudr. They fled and left behind five hundred camels. He then stayed in their dwellings for three days and returned to Medina."
  es: "El Profeta partió de Medina con doscientos jinetes hacia las moradas de Banu Sulaym en al-Kudr. Estos huyeron, dejando atrás quinientos camellos. Luego, permaneció en sus moradas durante tres días y regresó a Medina."
  fr: "Le Prophète partit de Médine avec deux cents cavaliers pour se rendre aux demeures des Banu Sulaym à al-Kudr. Ceux-ci prirent la fuite, abandonnant cinq cents chameaux. Il séjourna alors trois jours chez eux avant de retourner à Médine."
  ur: "نبی کریم مدینہ سے دو سو سواروں کے ساتھ بنو سلیم کے مکانات القدر کی طرف روانہ ہوئے۔ وہ بھاگے اور اپنے پیچھے پانچ سو اونٹ چھوڑ گئے۔ پھر تین دن تک ان کے مکانوں میں رہے اور مدینہ واپس آگئے۔"
