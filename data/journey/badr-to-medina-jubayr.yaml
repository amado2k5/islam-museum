  - { from: place/al-rawha, to: place/medina, end: { hijri: "0580-01-03", precision: day, status: historical, note: "يوم الاثنين الثالث لمحرم سنة ثمانين وخمسمائة، الصفحة 233 مع رأس صفحة 234" }, mode: "مسير بري", note: "يذكر النص بعد الروحاء: شعب علي (ليلة الأحد)، ثم ثربان، ثم البيداء، ثم وادي العقيق (ضحى الاثنين) ومنه يرى المسافر منارة قباء، ثم المدينة بعد الظهر. لا يتضح من النص ترتيب هذه المحطات بالنسبة للروحاء على وجه قطعي، فلا تُعد سلسلة متصلة.", sources: [source/rihla-ibn-jubayr-1907] }
