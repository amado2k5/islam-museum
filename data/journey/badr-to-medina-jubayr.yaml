label: { ar: "من بدر إلى المدينة في رحلة ابن جبير", en: "From Badr to Medina on Ibn Jubayr's road", es: "Desde Badr hasta Medina por el camino de Ibn Jubayr", fr: "De Badr à Médine par la route d'Ibn Jubayr", ur: "بدر سے مدینہ تک ابن جبیر کی سڑک پر", tr: "İbn Cübeyr'in Yolculuğunda Bedir'den Medine'ye", id: "Dari Badr ke Madinah dalam Perjalanan Ibnu Jubayr" }
summary:
  ar: "مقطع من رحلة ابن جبير: من بدر إلى الصفراء ثم الروحاء، فالمدينة يوم الاثنين الثالث من محرم سنة 580 بعد مسير نحو ثلاثة أيام. تذكر الرحلة محطات الطريق بالترتيب الذي يعرضه النص، وتفصل الأيام بين محطاته."
  en: "An excerpt from Ibn Jubayr's journey: from Badr to al-Safra, then al-Rawha, and then Medina on Monday, the third of Muharram 580, after about three days of travel. The journey lists the stations of the road in the order the text presents them, and it marks the days between its stations."
  es: "Un fragmento del viaje de Ibn Jubayr: de Badr a al-Safra, luego a al-Rawha y finalmente a Medina el lunes 3 de Muharram del año 580, tras aproximadamente tres días de viaje. El relato enumera las estaciones del camino en el orden en que aparecen en el texto e indica los días transcurridos entre ellas."
  fr: "Extrait du récit de voyage d'Ibn Jubayr: de Badr à al-Safra, puis al-Rawha, et enfin Médine, le lundi 3 Muharram 580, après environ trois jours de marche. Le récit énumère les étapes du voyage dans l'ordre où elles apparaissent dans le texte et indique les jours entre chaque étape."
  ur: "ابن جبیر کے سفر سے ایک اقتباس: بدر سے الصفرا، پھر الروح، اور پھر مدینہ منورہ، سوموار، 3 محرم 580، تقریباً تین دن کے سفر کے بعد۔ سفر میں سڑک کے اسٹیشنوں کی فہرست اسی ترتیب سے ہوتی ہے جس ترتیب سے متن انہیں پیش کرتا ہے، اور یہ اپنے اسٹیشنوں کے درمیان کے دنوں کو نشان زد کرتا ہے۔"
  tr: "İbn Cübeyr'in yolculuğundan bir alıntı: Hicri 580 yılının Muharrem ayının üçüncü günü Pazartesi günü, yaklaşık üç günlük bir yolculuğun ardından Bedir'den Safra'ya, oradan da Ravha'ya ve son olarak Medine'ye. Anlatıda, yol boyunca yapılan duraklar metinde belirtilen sırayla ve her durak arasındaki günlerle birlikte zikredilmiştir."
  id: "Cuplikan dari perjalanan Ibnu Jubayr: Dari Badr ke As-Safra, kemudian Ar-Rawha, lalu Madinah pada hari Senin, tanggal 3 Muharram 580 H, setelah perjalanan sekitar tiga hari. Catatan tersebut menyebutkan tempat-tempat persinggahan di sepanjang jalan sesuai urutan yang disajikan dalam teks, dengan selang waktu beberapa hari di antara setiap persinggahan."
