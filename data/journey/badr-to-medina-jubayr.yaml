summary:
  ar: "مقطع من رحلة ابن جبير: من بدر إلى الصفراء ثم الروحاء، فالمدينة يوم الاثنين الثالث من محرم سنة 580 بعد مسير نحو ثلاثة أيام. تذكر الرحلة محطات الطريق بالترتيب الذي يعرضه النص، وتفصل الأيام بين محطاته."
