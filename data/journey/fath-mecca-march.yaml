id: journey/fath-mecca-march
class: journey
kind: military_campaign
label: { ar: "مسيرة فتح مكة", en: "The march of the Conquest of Mecca", es: "La marcha de la conquista de La Meca", fr: "La marche de la conquête de La Mecque", ur: "فتح مکہ کا مارچ", tr: "Mekke'nin fethi", id: "Penaklukan Mekah" }
summary:
  ar: "مسيرة جيش الفتح بعشرة آلاف مقاتل من المدينة إلى مكة في رمضان 8هـ ⁦(يناير 630م)⁩: الخروج لعشر مضين من رمضان واستخلاف أبي رهم الغفاري، فالنزول بالكديد والإفطار، ثم التعسكر بمر الظهران وإيقاد النيران، فذي طوى وتقسيم ألوية الدخول، حتى دخول مكة."
  en: "The march of the ten-thousand-strong army of the Conquest from Medina to Mecca in Ramadan 8 AH (January 630 CE): departing Medina on 10 Ramadan, breaking fast at al-Kudayd, encamping with 10,000 fires at Marr al-Zahran, halting at Dhu Tuwa to divide columns, and entering Mecca."
  es: "La marcha del ejército de la Conquista, compuesto por diez mil hombres, desde Medina hasta La Meca en el Ramadán del año 8 de la Hégira (enero de 630 d. C.): partiendo de Medina el 10 de Ramadán, rompiendo el ayuno en al-Kudayd, acampando con 10.000 hogueras en Marr al-Zahran, deteniéndose en Dhu Tuwa para dividir las columnas y entrando en La Meca."
  fr: "La marche de l'armée de dix mille hommes de la Conquête de Médine à La Mecque en Ramadan 8 AH (janvier 630 CE): départ de Médine le 10 Ramadan, rupture du jeûne à al-Kudayd, campement avec 10 000 feux à Marr al-Zahran, halte à Dhu Tuwa pour diviser les colonnes et entrée à La Mecque."
  ur: "رمضان المبارک 8 ہجری ⁦(جنوری 630 عیسوی)⁩ میں مدینہ سے مکہ تک فتح کے دس ہزار پر مشتمل لشکر کا مارچ: 10 رمضان کو مدینہ سے روانگی، القدید میں روزہ افطار کرتے ہوئے، مرر الظہران میں 10،000 فائر کے ساتھ ڈیرے ڈالے، ذوالحجہ میں رکے اور ذوالحسن میں داخل ہوئے۔"
  tr: "Hicri 8. Ramazan ayında (Ocak 630) on bin savaşçıdan oluşan fetih ordusunun Medine'den Mekke'ye yürüyüşü: Ramazan'ın onuncu günü yola çıkıp Ebu Rahm el-Gıfari'yi vekil olarak atamaları, ardından Kadid'de durup oruçlarını açmaları, sonra Mer el-Zehran'da kamp kurup ateş yakmaları, ardından Zituve'ye gidip giriş birliklerini ayırmaları ve nihayetinde Mekke'ye girmeleri."
  id: "Perjalanan pasukan penaklukan dengan sepuluh ribu pejuang dari Madinah ke Mekah pada bulan Ramadan tanggal 8 H (Januari 630 M): Berangkat pada tanggal sepuluh Ramadan dan menunjuk Abu Rahm al-Ghifari sebagai wakilnya, kemudian berhenti di al-Kadid dan berbuka puasa, kemudian berkemah di Mar al-Zahran dan menyalakan api, kemudian Dhi Tuwa dan membagi pasukan untuk memasuki Mekah, hingga memasuki Mekah."
