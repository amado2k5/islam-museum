label: { ar: "غزوة ذي أمر", en: "The expedition to Dhu Amarr", es: "La expedición a Dhu Amarr", fr: "L'expédition à Dhu Amarr", ur: "ذو عمار کی مہم", tr: "Dhi Amr Muharebesi", id: "Pertempuran Dhi Amr" }
summary:
  ar: "خرج النبي في المحرم سنة 3هـ في نحو أربعمائة وخمسين مقاتلاً، فوصل إلى الماء المسمى ذي أمر، حيث تجمع بنو ثعلبة ومحارب فتفرقوا، ثم رجع إلى المدينة."
  en: "The Prophet set out in Muharram of year 3 AH with about four hundred and fifty fighters and reached the water called Dhu Amarr, where Banu Tha'laba and Muharib had gathered; they dispersed, and he returned to Medina."
  es: "El Profeta partió en Muharram del año 3 AH con unos cuatrocientos cincuenta guerreros y llegó al río Dhu Amarr, donde se habían reunido Banu Tha'laba y Muharib; ellos se dispersaron y él regresó a Medina."
  fr: "Le Prophète partit en Muharram de l'an 3 de l'Hégire avec environ quatre cent cinquante combattants et atteignit l'eau appelée Dhu Amarr, où Banu Tha'laba et Muharib s'étaient rassemblés; ils se dispersèrent, et il retourna à Médine."
  ur: "نبی 3 ہجری کے محرم میں تقریباً ساڑھے چار سو جنگجوؤں کے ساتھ روانہ ہوئے اور ذو عمار نامی پانی پر پہنچے جہاں بنو ثعلبہ اور محارب جمع تھے۔ وہ منتشر ہو گئے اور وہ مدینہ واپس چلا گیا۔"
  tr: "Peygamberimiz, Hicri 3. yılın Muharrem ayında yaklaşık dört yüz elli savaşçıyla yola çıktı ve Beni Tha'labah ile Muharib kabilelerinin toplandığı Zı'mr denilen suya ulaştı, sonra dağıldı ve ardından Medine'ye döndü."
  id: "Nabi berangkat pada bulan Muharram tahun 3 Hijriah dengan sekitar empat ratus lima puluh pejuang, dan beliau sampai di perairan yang disebut Dhi Amr, tempat Bani Tha'labah dan Muharib berkumpul dan kemudian bubar, lalu beliau kembali ke Madinah."
