label: { ar: "من صقلية إلى غرناطة في رحلة ابن جبير عائداً", en: "From Sicily to Granada on Ibn Jubayr's return road" }
summary:
  ar: "مرحلة من رحلة ابن جبير عائداً من الحج: من مسينة في صقلية بالزورق إلى شغلودي، ثم برّاً إلى حضرة صقلية (بالرمو) ومنها إلى طرابنش. انتظر في طرابنش شهوراً لأن ملك صقلية منع خروج المراكب، ثم ركب البحر من جهة جزيرة الراهب، فبلغ جزيرة بابسة (إيبيزا) ثم قرطاجنّة، ومن هناك سار برّاً حتى بلغ منزله بغرناطة."
  en: "A stage of Ibn Jubayr's journey home from the Hajj: by boat from Messina in Sicily to Cefalu, then by land to Palermo, the seat of Sicily, and from there to Trapani. He waited in Trapani for months because the king of Sicily had banned ships from leaving, then put to sea from Jazirat al-Rahib (the Monk's Island), reaching the island of Babsa (Ibiza), then Cartagena, and from there travelled overland until he reached his home in Granada."
