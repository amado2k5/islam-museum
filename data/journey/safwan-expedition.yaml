label: { ar: "غزوة سفوان", en: "The expedition of Safwan", es: "La expedición de Safwan", fr: "L'expédition de Safwan" }
summary:
  ar: "خرج النبي في ربيع الأول سنة 2هـ في سبعين رجلاً لمطاردة كرز بن جابر الفهري الذي أغار على مراعي المدينة، حتى بلغ وادي سفوان من ناحية بدر، فلم يدركه فرجع دون حرب، واستخلف زيد بن حارثة."
  en: "The Prophet set out in Rabi' al-Awwal of the year 2 AH with seventy men to pursue Kurz ibn Jabir al-Fihri, who had raided the pastures of Medina. He reached the valley of Safwan on the Badr side but did not catch him, and returned without fighting. He appointed Zayd ibn Haritha as his deputy."
  es: "El Profeta partió en Rabi' al-Awwal del año 2 de la Hégira con setenta hombres para perseguir a Kurz ibn Jabir al-Fihri, quien había saqueado los pastos de Medina. Llegó al valle de Safwan, en la orilla de Badr, pero no logró capturarlo y regresó sin combatir. Designó a Zayd ibn Haritha como su lugarteniente."
  fr: "Le Prophète partit en Rabi' al-Awwal de l'an 2 de l'Hégire avec soixante-dix hommes à la poursuite de Kurz ibn Jabir al-Fihri, qui avait pillé les pâturages de Médine. Il atteignit la vallée de Safwan, du côté de Badr, mais ne parvint pas à le rattraper et revint sans combattre. Il nomma Zayd ibn Haritha comme adjoint."
