id: journey/ubaydah-batn-rabigh
class: journey
kind: military_campaign
label: { ar: "سرية عبيدة بن الحارث إلى بطن رابغ", en: "The expedition of Ubayda ibn al-Harith to Batn Rabigh", es: "La expedición de Ubayda ibn al-Harith a Batn Rabigh", fr: "L'expédition d'Ubayda ibn al-Harith à Batn Rabigh", ur: "عبیدہ بن حارث کی بطن ربیع کی طرف غزوہ", tr: "Ubeyde ibn el-Hâris'in Rabigh vadisine seferi", id: "Ekspedisi Ubaidah bin al-Harits ke lembah Rabigh" }
summary:
  ar: "بعث النبي عبيدة بن الحارث في شوال سنة 1هـ في ستين راكباً من المهاجرين، فلقي أبا سفيان في مائتين على بطن رابغ، ولم يقع قتال."
  en: "The Prophet sent Ubayda ibn al-Harith in Shawwal of the year 1 AH with sixty riders from the Muhajirun. At Batn Rabigh he met Abu Sufyan with two hundred men, and no fighting took place."
  es: "El Profeta envió a Ubayda ibn al-Harith en Shawwal del año 1 AH con sesenta jinetes de los Muhajirun. En Batn Rabigh se encontró con Abu Sufyan, quien contaba con doscientos hombres, y no hubo combate."
  fr: "Le Prophète envoya Ubayda ibn al-Harith en Shawwal de l'an 1 de l'Hégire avec soixante cavaliers des Muhajirun. À Batn Rabigh, il rencontra Abu Sufyan et ses deux cents hommes, et aucun combat ne s'engagea."
  ur: "رسول اللہ نے 1 ہجری کے شوال میں عبیدہ بن حارث کو مہاجرین کے ساٹھ سواروں کے ساتھ بھیجا۔ بطن ربیغ میں اس کی ملاقات دو سو آدمیوں کے ساتھ ابو سفیان سے ہوئی اور کوئی لڑائی نہیں ہوئی۔"
  tr: "Peygamberimiz, Hicri 1. yılın Şevval ayında Ubeyde ibn el-Harith'i Muhacirlerden altmış süvariyle birlikte gönderdi ve o, Rabiğ vadisinde Ebu Sufyan ile iki yüz adamla karşılaştı; herhangi bir çatışma yaşanmadı."
  id: "Nabi Muhammad SAW mengutus Ubaidah bin al-Harith pada bulan Syawal tahun 1 Hijriah bersama enam puluh penunggang kuda dari kaum Muhajirin, dan ia bertemu dengan Abu Sufyan bersama dua ratus orang di lembah Rabigh, dan tidak terjadi pertempuran."
