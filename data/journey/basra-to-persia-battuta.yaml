id: journey/basra-to-persia-battuta
class: journey
kind: travel
label: { ar: "من البصرة إلى فارس وعراق العجم على طريق ابن بطوطة", en: "From Basra to Persia and back to Baghdad by Ibn Battuta's road" }
summary:
  ar: "طريق ابن بطوطة من البصرة إلى الأبلة وعبادان، ثم في البحر إلى ماجول، ومنها برّاً عبر رامز وتستر وإيذج إلى أصفهان، ثم شيراز، ثم كازرون والزيدين والحويزاء إلى الكوفة، فالحلة وكربلاء وبغداد، ومنها مع محلة السلطان أبي سعيد إلى تبريز، ثم عودة إلى بغداد. يذكر الكتاب المحطات بأسمائها ويفصّل في شيراز، ولا يذكر تواريخ يومية لكل منزل."
wings: []
periods: [period/mongol-post-mongol]
regions: [levant-iraq, persia-central-asia]
travelers: [person/ibn-battuta-muhammad]
legs:
  - { from: place/basra, to: place/ubulla, mode: "في صنبوق، وهو القارب الصغير، على ساحل البصرة", note: "ركب من ساحل البصرة صنبوقاً إلى الأبلة، ومرّ في الطريق ببساتين متصلة ونخيل، ثم بمتعبد سهل بن عبد الله التستري (ص117).", sources: [source/rihla-ibn-battuta-1958] }
  - { from: place/ubulla, to: place/abbadan, mode: "في مركب صغير في الخليج", note: "ركب بعد المغرب مركباً صغيراً لرجل من أهل الأبلة في الخليج الخارج من بحر فارس، فصبح عبادان (ص117–118).", sources: [source/rihla-ibn-battuta-1958] }
  - { from: place/abbadan, to: place/tustar, mode: "بحراً أربعة أيام، ثم على الدواب ستة أيام", note: "من عبادان ركب البحر إلى بلدة ماجول فبلغها بعد أربعة أيام، ومن ماجول اكترى دابة ممن يجلبون الحبوب من رامز، وسار ثلاثاً في صحراء يسكنها الأكراد حتى مدينة رامز، ثم ثلاثاً في بسيط فيه قرى، ثم بلغ تستر (ص118–120). ماجول ورامز لا توجدان بعد في data/place.", sources: [source/rihla-ibn-battuta-1958] }
  - { from: place/tustar, to: place/ayadhaj, mode: "على الدواب في جبال شامخة", note: "سافر من تستر ثلاثاً في جبال شامخة، وفي كل منزل زاوية تقدّم الطعام والعلف للوارد، حتى بلغ إيذج (ص121–122).", sources: [source/rihla-ibn-battuta-1958] }
  - { from: place/ayadhaj, to: place/isfahan, mode: "على الدواب", note: "رحل من إيذج بعد أيام، فنزل مدرسة السلاطين ومدرسة كريو الرخ، وهي آخر بلاد الملك، ثم مرّ ببلدة اشتركان وبمدينة فيروزان، ثم بلغ أصفهان (ص124). اشتركان وفيروزان لا توجدان بعد في data/place.", sources: [source/rihla-ibn-battuta-1958] }
  - { from: place/isfahan, to: place/shiraz, mode: "على الدواب عبر الصحراء", note: "قصد أصفهان شيراز لزيارة مجد الدين، وبينهما عشرة أيام، فمرّ ببلدة كليل ثم بقرية إصوماء، ثم بصحراء دشت الروم ثم بمايين، حتى بلغ شيراز (ص126–127). كليل وإصوماء ومايين لا توجد بعد في data/place.", sources: [source/rihla-ibn-battuta-1958] }
  - { from: place/shiraz, to: place/kazarun, mode: "على الدواب، مسيرة يومين", note: "خرج من شيراز برسم زيارة أبي إسحاق الكازروني، وهي على مسيرة يومين، فنزل في أولها ببلاد يسكنها قوم من الأعاجم، ووصل كازرون عشيّ اليوم الثاني (ص136). بقي في شيراز عدة صفحات قبل الخروج (ص127–136).", sources: [source/rihla-ibn-battuta-1958] }
  - { from: place/kazarun, to: place/kufa, mode: "برّاً ثم برية بلا ماء إلا في موضع واحد", note: "من كازرون مرّ بمدينة الزيدين، ثم بالحويزاء، ومنها قصد الكوفة في برية ليس بها ماء إلا في موضع يسمى الطرفاوي، فوصلها بعد اليوم الثاني (ص137). الزيدين والحويزاء لا توجدان بعد في data/place.", sources: [source/rihla-ibn-battuta-1958] }
  - { from: place/kufa, to: place/baghdad, mode: "برّاً", note: "من الكوفة نزل بئر ملاحة، ثم مدينة الحلة، ثم سافر إلى كربلاء مشهد الحسين، ومنها إلى بغداد (ص138–139). بئر ملاحة والحلة وكربلاء لا توجد بعد في data/place.", sources: [source/rihla-ibn-battuta-1958] }
  - { from: place/baghdad, to: place/tabriz, mode: "مع محلة السلطان أبي سعيد، عشرة أيام", note: "خرج من بغداد في محلة السلطان أبي سعيد، صحبة الأمير علاء الدين محمد، وسافر عشرة أيام حتى تبريز، ونزل بخارجها (ص146–147). يصف الكتاب ترتيب الرحيل في المحلة (ص146).", sources: [source/rihla-ibn-battuta-1958] }
  - { from: place/tabriz, to: place/baghdad, mode: "بتدبير من السلطان، على الطريق مع المحمل", note: "أقام في تبريز، ثم طلب الإذن بالحجاز، فأمر له السلطان بالزاد والركوب مع المحمل، وكتب له إلى أمير بغداد، فعاد إلى بغداد (ص147).", sources: [source/rihla-ibn-battuta-1958] }
