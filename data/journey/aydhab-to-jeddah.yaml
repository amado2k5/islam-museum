label: { ar: "من عيذاب إلى جدة في طريق الحج", en: "From Aydhab to Jeddah on the pilgrimage road", es: "Desde Aydhab hasta Yeda en la ruta de peregrinación", fr: "D'Aydhab à Djeddah sur la route du pèlerinage" }
summary:
  ar: "مرحلة من رحلة ابن جبير إلى الحج: مكث في عيذاب نحو ثلاثة وعشرين يوماً ثم ركب الجلبة للعبور إلى جدة، بعد أن وصل عيذاب من قوص بطريق الصحراء الذي يسلكه الحجاج على الإبل مع الأدلاء. تصف الرحلة صعوبة هذا الطريق وهلاك كثير من الحجاج فيه."
  en: "A stage of Ibn Jubayr's pilgrimage journey. He stayed in Aydhab for about twenty-three days, then boarded a jalba vessel to cross to Jeddah, having reached Aydhab from Qus by the desert road that pilgrims take on camels with guides. The journey describes the hardship of this road and the death of many pilgrims on it."
  es: "Una etapa del viaje de peregrinación de Ibn Jubayr. Permaneció en Aydhab durante unos veintitrés días, luego embarcó en una embarcación tipo jalba para cruzar a Yeda, tras haber llegado a Aydhab desde Qus por el camino del desierto que los peregrinos recorren en camello con guías. El relato describe las dificultades de este camino y la muerte de muchos peregrinos en él."
  fr: "Une étape du pèlerinage d'Ibn Jubayr. Il séjourna à Aydhab pendant environ vingt-trois jours, puis embarqua sur une djellaba pour rejoindre Djeddah, après avoir rejoint Aydhab depuis Qus par la route du désert empruntée par les pèlerins à dos de chameau accompagnés de guides. Le récit décrit les difficultés de cette route et la mort de nombreux pèlerins qui y périrent."
