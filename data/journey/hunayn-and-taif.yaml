id: journey/hunayn-and-taif
class: journey
kind: military_campaign
label: { ar: "من مكة إلى حنين فالطائف ثم العودة", en: "From Mecca to Hunayn, Ta'if and back" }
summary:
  ar: "مسير النبي بعد فتح مكة في شوال سنة 8هـ: من مكة إلى وادي حنين حيث كانت المعركة، ثم مطاردة فلول هوازن وثقيف إلى أوطاس والطائف، وحصار الطائف، ثم العودة إلى الجعرانة فالعمرة فالمدينة. يذكر الرحيق المسافات الكبرى دون أن يرتب كل المنازل، فلا تُذكر هنا إلا المواضع التي سماها النص."
  en: "The march after the conquest of Mecca in Shawwal 8 AH: from Mecca to the valley of Hunayn where the battle took place, the pursuit of the Hawazin and Thaqif remnants to Awtas and Ta'if, the siege of Ta'if, then the return by way of al-Ji'rana, the umra and Medina. The book names only the stops it gives, so only those are listed."
wings: []
periods: [period/prophetic-era]
regions: [arabia]
travelers: [person/muhammad]
legs:
  - { from: place/mecca, to: place/wadi-hunayn, start: { hijri: "0008-10-06", status: historical, note: "خرج النبي من مكة في اثني عشر ألفاً وترك عتاب بن أسيد عليها (الرحيق ص414)" }, end: { hijri: "0008-10-10", status: historical, note: "ليلة الأربعاء لعشر خلون من شوال (الرحيق ص415)" }, mode: "مسير الجيش", events: [event/battle-of-hunayn], note: "في الطريق مرّوا بسدرة ذات أنواط فسألوا أن يُجعل لهم مثلها، فأنكر النبي ذلك (الرحيق ص415؛ الحاشية: سنن الترمذي). ولم يقطع النص المسير بين مكة وحنين بمنازل مرتبة. وقد كان مالك بن عوف قد سبق الجيش فبيّت كمائنه في الوادي والمضايق (الرحيق ص415).", sources: [source/mubarakpuri-raheeq] }
  - { from: place/wadi-hunayn, to: place/awtas, mode: "طائفة من المطاردين بقيادة أبي عامر الأشعري", events: [event/expedition-to-awtas], note: "بعد الهزيمة ثم ردّ المسلمين، توجهت فلول العدو إلى الطائف ونخلة وأوطاس؛ فأُرسلت إلى أوطاس طائفة يقودها أبو عامر الأشعري فانهزم جيش المشركين هناك (الرحيق ص417). ينص الكتاب على وجهة الطائفة لا على المسير نفسه، وكان أوطاس موضع تجمع العدو قبل المعركة (الرحيق ص413).", sources: [source/mubarakpuri-raheeq] }
  - { from: place/al-jirana, to: place/taif, start: { hijri: "0008-10", status: historical, note: "في نفس الشهر الذي كانت فيه حنين (الرحيق ص418)" }, mode: "مسير الجيش", events: [event/journey-to-taif], note: "بعد جمع الغنائم بالجعرانة؛ قدّم خالد بن الوليد طليعة في ألف رجل. مرّ النبي على النخلة اليمانية ثم قرن المنازل ثم لية، وفيها حصن مالك بن عوف فأمر بهدمه، ثم نزل قريباً من حصن الطائف فعسكر وفرض الحصار (الرحيق ص418). اختلف أهل السير في مدة الحصار (الرحيق ص418؛ فتح الباري 8/45).", sources: [source/mubarakpuri-raheeq, source/fath-al-bari, source/zad-al-maad] }
  - { from: place/taif, to: place/al-jirana, mode: "رجوع", events: [event/siege-of-taif], note: "عزم النبي على رفع الحصار لما طال واستعصى الحصن، ونادى النبي بالرحيل، فلما ارتحلوا قال: آيبون تائبون عابدون لربنا حامدون (الرحيق ص419). بعد الرفع مكث النبي بالجعرانة بضع عشرة ليلة يقسم الغنائم (الرحيق ص419-420).", sources: [source/mubarakpuri-raheeq] }
  - { from: place/al-jirana, to: place/mecca, mode: "عمرة", events: [event/umrah-of-jirana], note: "بعد فراغ قسمة الغنائم أهلّ بالعمرة من الجعرانة فأداها (الرحيق ص422). الرحيق لا يذكر ترتيب المرور بمكة، وإنما يذكر أداء العمرة.", sources: [source/mubarakpuri-raheeq] }
  - { from: place/mecca, to: place/medina, start: { hijri: "0008-11", status: historical, note: "قبل انتهاء الشهر بست ليال (الرحيق ص422)" }, mode: "انصراف", note: "انصرف راجعاً إلى المدينة بعد أن ولّى على مكة عتاب بن أسيد. لم يذكر النص منازل الطريق بين مكة والمدينة (الرحيق ص422).", sources: [source/mubarakpuri-raheeq] }
