id: journey/hunayn-and-taif
class: journey
kind: military_campaign
label: { ar: "من مكة إلى حنين فالطائف ثم العودة", en: "From Mecca to Hunayn, Ta'if and back", es: "De La Meca a Hunayn, Ta'if y de regreso.", fr: "De La Mecque à Hunayn, Taïf et retour", ur: "مکہ سے حنین، طائف اور پیچھے", tr: "Mekke'den Huneyn'e, oradan Taif'e, sonra tekrar geri.", id: "Dari Mekah ke Hunayn, lalu Taif, kemudian kembali lagi." }
summary:
  ar: "مسير النبي بعد فتح مكة في شوال سنة 8هـ: من مكة إلى وادي حنين حيث كانت المعركة، ثم مطاردة فلول هوازن وثقيف إلى أوطاس والطائف، وحصار الطائف، ثم العودة إلى الجعرانة فالعمرة فالمدينة. يذكر الرحيق المسافات الكبرى دون أن يرتب كل المنازل، فلا تُذكر هنا إلا المواضع التي سماها النص."
  en: "The march after the conquest of Mecca in Shawwal 8 AH: from Mecca to the valley of Hunayn where the battle took place, the pursuit of the Hawazin and Thaqif remnants to Awtas and Ta'if, the siege of Ta'if, then the return by way of al-Ji'rana, the umra and Medina. The book names only the stops it gives, so only those are listed."
  es: "La marcha tras la conquista de La Meca en Shawwal del año 8 de la Hégira: desde La Meca hasta el valle de Hunayn, donde tuvo lugar la batalla; la persecución de los restos de los Hawazin y los Thaqif hasta Awtas y Ta'if; el asedio de Ta'if; y el regreso por Al-Ji'rana; la Umrah y Medina. El libro solo menciona las paradas que indica, por lo que solo se enumeran estas."
  fr: "La marche après la conquête de La Mecque en Shawwal 8 AH: de La Mecque à la vallée de Hunayn où eut lieu la bataille, la poursuite des Hawazin et des Thaqif restants jusqu’à Awtas et Taïf, le siège de Taïf, puis le retour par al-Jirana, la umra et Médine. Le livre ne mentionne que les étapes indiquées; seules celles-ci sont donc répertoriées."
  ur: "شوال 8 ہجری میں فتح مکہ کے بعد کا مارچ: مکہ سے حنین کی وادی تک جہاں جنگ ہوئی، ہوازن اور ثقیف کا تعاقب اوطاس اور طائف تک باقیات، طائف کا محاصرہ، پھر الجیرانہ، عمرہ اور مدینہ کے راستے واپسی۔ کتاب صرف ان ہی اسٹاپوں کے نام دیتی ہے جو یہ دیتا ہے، اس لیے صرف وہی درج ہیں۔"
  tr: "Peygamberimizin Hicretin 8. yılının Şevval ayında Mekke'nin fethinden sonraki yolculuğu: Mekke'den savaşın gerçekleştiği Huneyn vadisine, ardından Havazin ve Sakif kabilelerinin kalıntılarının Avtas ve Taif'e kadar takibi, Taif kuşatması, ardından Ciranah'a dönüş, Umre ve nihayet Medine. El-Rahik kitabı, tüm durakları listelemeden ana mesafeleri belirtir; burada sadece metinde adı geçen yerler zikredilmiştir."
  id: "Perjalanan Nabi setelah penaklukan Mekah pada bulan Syawal tahun ke-8 Hijrah: dari Mekah ke lembah Hunayn tempat pertempuran terjadi, kemudian pengejaran sisa-sisa suku Hawazin dan Thaqif ke Awṭās dan Ta'if, pengepungan Ta'if, kemudian kembali ke al-Ji'ranah, kemudian Umrah, dan akhirnya Madinah. Kitab al-Raheeq menyebutkan jarak-jarak utama tanpa mencantumkan semua tempat persinggahan; hanya tempat-tempat yang disebutkan dalam teks yang disebutkan di sini."
