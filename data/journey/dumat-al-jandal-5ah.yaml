label: { ar: "مسير النبي إلى دومة الجندل سنة 5هـ", en: "The Prophet's march to Dumat al-Jandal in 5 AH" }
summary:
  ar: "خرج النبي في ألف من أصحابه من المدينة لخمس ليال بقين من ربيع الأول سنة 5هـ، بدليل من بني عذرة يُقال له مذكور، يسير الليل ويكمن النهار؛ فأصاب من ماشية أهل دومة ورعائها، ففرّ أهلها ولم يجد المسلمون بها أحداً، ثم رجع إلى المدينة بعد أن وادع عيينة بن حصن. والمحطات ترتيب الدرب لا عدد أيامه (الرحيق ص299-300)."
  en: "The Prophet set out from Medina with a thousand of his companions, five nights before the end of Rabi' al-Awwal of year 5 AH, with a guide from Banu Udhra called Madhkur, who travelled by night and hid by day. He took some of the livestock and herders of the people of Dumat, who fled, and the Muslims found no one there. He then returned to Medina after making a truce with Uyayna ibn Hisn. The stations are the order of the road, not the number of its days (al-Raheeq, pp. 299-300)."
