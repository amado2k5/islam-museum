id: journey/dumat-al-jandal-5ah
class: journey
kind: military_campaign
label: { ar: "مسير النبي إلى دومة الجندل سنة 5هـ", en: "The Prophet's march to Dumat al-Jandal in 5 AH", es: "La marcha del Profeta hacia Dumat al-Jandal en el año 5 de la Hégira.", fr: "La marche du Prophète vers Dumat al-Jandal en l'an 5 de l'Hégire", ur: "5 ہجری میں دمت الجندل کی طرف پیغمبر کا کوچ" }
summary:
  ar: "خرج النبي في ألف من أصحابه من المدينة لخمس ليال بقين من ربيع الأول سنة 5هـ، بدليل من بني عذرة يُقال له مذكور، يسير الليل ويكمن النهار؛ فأصاب من ماشية أهل دومة ورعائها، ففرّ أهلها ولم يجد المسلمون بها أحداً، ثم رجع إلى المدينة بعد أن وادع عيينة بن حصن. والمحطات ترتيب الدرب لا عدد أيامه ⁦(الرحيق ص299-300)⁩."
  en: "The Prophet set out from Medina with a thousand of his companions, five nights before the end of Rabi' al-Awwal of year 5 AH, with a guide from Banu Udhra called Madhkur, who travelled by night and hid by day. He took some of the livestock and herders of the people of Dumat, who fled, and the Muslims found no one there. He then returned to Medina after making a truce with Uyayna ibn Hisn. The stations are the order of the road, not the number of its days (al-Raheeq, pp. 299-300)."
  es: "El Profeta partió de Medina con mil de sus compañeros, cinco noches antes del final de Rabi' al-Awwal del año 5 AH, acompañado por un guía de Banu Udhra llamado Madhkur, quien viajó de noche y se ocultó de día. Tomó parte del ganado y los pastores de la gente de Dumat, quienes huyeron, y los musulmanes no encontraron a nadie allí. Luego regresó a Medina tras hacer una tregua con Uyayna ibn Hisn. Las estaciones indican el orden del camino, no la duración del mismo (al-Raheeq, págs. 299-300)."
  fr: "Le Prophète partit de Médine avec mille compagnons, cinq nuits avant la fin de Rabi' al-Awwal de l'an 5 de l'Hégire, accompagné d'un guide de la tribu des Banu Udhra nommé Madhkur, qui voyageait de nuit et se cachait le jour. Il emmena avec lui du bétail et des bergers des habitants de Dumat, qui prirent la fuite, et les musulmans ne trouvèrent personne sur place. Il retourna ensuite à Médine après avoir conclu une trêve avec Uyayna ibn Hisn. Les étapes correspondent à l'ordre du voyage, et non au nombre de jours (al-Raheeq, pp. 299-300)."
  ur: "رسول اللہ اپنے ایک ہزار صحابہ کے ساتھ 5 ہجری کے ربیع الاول کے اختتام سے پانچ رات قبل مدینہ سے روانہ ہوئے، بنو عذرا کے ایک رہنما کے ساتھ جس کا نام مدقور تھا، جو رات کو سفر کرتا تھا اور دن کو چھپتا تھا۔ اس نے دمت کے لوگوں کے کچھ مویشی اور چرواہے لیے جو بھاگ گئے اور مسلمانوں کو وہاں کوئی نہ ملا۔ اس کے بعد وہ عیینہ بن حسن کے ساتھ صلح کر کے مدینہ واپس آیا۔ اسٹیشن سڑک کی ترتیب ہیں، اس کے دنوں کی تعداد نہیں ⁦(الرحیق، صفحہ 299-300)⁩۔"
