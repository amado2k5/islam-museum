label: { ar: "غزوة بواط", en: "The expedition to Buwat", es: "La expedición a Buwat", fr: "L'expédition à Buwat", ur: "بوات کی مہم", tr: "Buwat Muharebesi", id: "Pertempuran Buwat" }
summary:
  ar: "خرج النبي في ربيع الأول سنة 2هـ في مائتين من أصحابه يعترض عير قريش، فيها أمية بن خلف ومائة من قريش، فبلغ بواطاً ولم يلق كيداً، واستخلف على المدينة سعد بن معاذ ⁦(الرحيق ص199)⁩."
  en: "The Prophet set out in Rabi' al-Awwal of year 2 AH with two hundred of his companions, intending to intercept a Quraysh caravan in which were Umayya ibn Khalaf and a hundred men of Quraysh. He reached Buwat without meeting any opposition, and left Sa'd ibn Mu'adh in charge of Medina (al-Raheeq, p. 199)."
  es: "El Profeta partió en Rabi' al-Awwal del año 2 AH con doscientos de sus compañeros, con la intención de interceptar una caravana de los Quraysh en la que viajaban Umayya ibn Khalaf y cien hombres de los Quraysh. Llegó a Buwat sin encontrar resistencia y dejó a Sa'd ibn Mu'adh al mando de Medina (al-Raheeq, p. 199)."
  fr: "Le Prophète partit en Rabi' al-Awwal de l'an 2 de l'Hégire avec deux cents compagnons, dans l'intention d'intercepter une caravane qurayshite où se trouvaient Umayya ibn Khalaf et une centaine d'hommes qurayshites. Il atteignit Buwat sans rencontrer d'opposition et laissa Sa'd ibn Mu'adh à la tête de Médine (al-Raheeq, p. 199)."
  ur: "رسول اللہ سنہ 2 ہجری کے ربیع الاول میں اپنے دو سو صحابہ کے ساتھ قریش کے ایک قافلے کو روکنے کا ارادہ رکھتے تھے جس میں امیہ بن خلف اور قریش کے سو آدمی تھے۔ وہ بغیر کسی مخالفت کے بوات پہنچ گئے اور سعد بن معاذ کو مدینہ کا انچارج چھوڑ دیا ⁦(الرحیق، صفحہ 199)⁩۔"
  tr: "Peygamberimiz, Hicri 2. yılın Rebiü'l-Evvel ayında, içinde Ümeyye ibn Halef ve yüz Kureyşlinin bulunduğu bir Kureyş kervanını durdurmak için iki yüz sahabesiyle birlikte yola çıktı. Buvat'a ulaştı ve herhangi bir ihanetle karşılaşmadı. Medine'de kendisine vekil olarak Sa'd ibn Mu'azh'ı atadı (El-Rahik, s. 199)."
  id: "Nabi Muhammad SAW berangkat pada bulan Rabi' al-Awwal tahun 2 Hijriah bersama dua ratus sahabatnya untuk mencegat kafilah Quraisy, yang di dalamnya terdapat Umayyah bin Khalaf dan seratus orang Quraisy. Beliau sampai di Buwat dan tidak menemui pengkhianatan apa pun, lalu beliau menunjuk Sa'd bin Mu'adh sebagai wakilnya di Madinah (Al-Raheeq, hlm. 199)."
