label: { ar: "رحلة تجارة خديجة إلى الشام مع ميسرة", en: "Khadija's trade journey to al-Sham with Maysara" }
summary:
  ar: "رحلة تجارية في مال خديجة بنت خويلد إلى الشام، خرج فيها النبي ومعه غلامها ميسرة، فرجع إلى مكة فرأت خديجة من أمانته وبركة ماله ما لم تر قبل (الرحيق ص60)."
  en: "A trade journey to al-Sham with the property of Khadija bint Khuwaylid, in which the Prophet set out with her servant Maysara. On his return to Mecca, Khadija saw in his trustworthiness and in the blessing of her wealth what she had not seen before (al-Raheeq al-Makhtum, p. 60)."
wings: []
periods: [period/pre-islamic-arabia]
