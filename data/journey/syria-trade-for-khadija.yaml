label: { ar: "رحلة تجارة خديجة إلى الشام مع ميسرة", en: "Khadija's trade journey to al-Sham with Maysara", es: "El viaje comercial de Khadija a al-Sham con Maysara", fr: "Le voyage commercial de Khadija au Levant avec Maysara", ur: "خدیجہ کا میسرہ کے ساتھ الشام کا تجارتی سفر" }
summary:
  ar: "رحلة تجارية في مال خديجة بنت خويلد إلى الشام، خرج فيها النبي ومعه غلامها ميسرة، فرجع إلى مكة فرأت خديجة من أمانته وبركة ماله ما لم تر قبل ⁦(الرحيق ص60)⁩."
  en: "A trade journey to al-Sham with the property of Khadija bint Khuwaylid, in which the Prophet set out with her servant Maysara. On his return to Mecca, Khadija saw in his trustworthiness and in the blessing of her wealth what she had not seen before (al-Raheeq al-Makhtum, p. 60)."
  es: "Un viaje comercial a Al-Sham con las propiedades de Jadiya bint Khuwaylid, en el que el Profeta partió con su sirvienta Maysara. A su regreso a La Meca, Jadiya vio en su fidelidad y en la bendición de su riqueza algo que no había visto antes (al-Raheeq al-Makhtum, p. 60)."
  fr: "Un voyage commercial au Levant avec les biens de Khadija bint Khuwaylid, au cours duquel le Prophète partit avec sa servante Maysara. À son retour à La Mecque, Khadija reconnut en sa loyauté et dans la bénédiction de ses richesses ce qu'elle n'avait jamais vu auparavant (al-Raheeq al-Makhtum, p. 60)."
  ur: "خدیجہ بنت خویلد کی جائیداد کے ساتھ الشام کا تجارتی سفر، جس میں نبی اپنی خادمہ میسرہ کے ساتھ روانہ ہوئے۔ مکہ واپسی پر، خدیجہ نے اپنی امانت داری اور اپنے مال کی برکت میں وہ کچھ دیکھا جو اس نے پہلے نہیں دیکھا تھا ⁦(الرحیق المختوم، صفحہ 60)⁩۔"
