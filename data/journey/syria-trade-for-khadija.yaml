travelers: [person/muhammad, person/maysara]
legs:
  - { from: place/mecca, to: place/al-sham, mode: "تجارة في مال خديجة", note: "عرضت خديجة أن يخرج في مالها إلى الشام تاجراً بأفضل ما تعطي غيره من التجار، فخرج ومعه غلامها ميسرة حتى قدم الشام (الرحيق ص60). لم يذكر النص موضعاً بعينه في الشام." }
  - { from: place/al-sham, to: place/mecca, note: "ولما رجع إلى مكة رأت خديجة في مالها من الأمانة والبركة ما لم تر قبل، وأخبرها ميسرة بما رأى فيه (الرحيق ص60-61)." }
