label: { ar: "غزوة ذي العشيرة", en: "The expedition of Dhu al-Ushayra" }
summary:
  ar: "خرج النبي في جمادى الأولى سنة 2هـ في مائة وخمسين، ويقال مائتين، من المهاجرين، يعترض عير قريش العائدة من الشام، فبلغ ذا العشيرة فوجد العير قد فاتته بأيام، وهي التي صارت سبباً لغزوة بدر الكبرى."
  en: "The Prophet set out in Jumada al-Ula of year 2 AH with a hundred and fifty, or it is said two hundred, of the Muhajirun, intending to intercept the Quraysh caravan returning from Syria. He reached Dhu al-Ushayra and found that the caravan had got ahead of him by some days. That caravan became the cause of the Great Battle of Badr."
