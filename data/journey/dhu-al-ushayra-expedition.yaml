label: { ar: "غزوة ذي العشيرة", en: "The expedition of Dhu al-Ushayra", es: "La expedición de Dhu al-Ushayra", fr: "L'expédition de Dhu al-Ushayra", ur: "غزوہ ذی العشرہ" }
summary:
  ar: "خرج النبي في جمادى الأولى سنة 2هـ في مائة وخمسين، ويقال مائتين، من المهاجرين، يعترض عير قريش العائدة من الشام، فبلغ ذا العشيرة فوجد العير قد فاتته بأيام، وهي التي صارت سبباً لغزوة بدر الكبرى."
  en: "The Prophet set out in Jumada al-Ula of year 2 AH with a hundred and fifty, or it is said two hundred, of the Muhajirun, intending to intercept the Quraysh caravan returning from Syria. He reached Dhu al-Ushayra and found that the caravan had got ahead of him by some days. That caravan became the cause of the Great Battle of Badr."
  es: "El Profeta partió en Jumada al-Ula del año 2 de la Hégira con ciento cincuenta, o según se dice, doscientos, de los Muhajirun, con la intención de interceptar la caravana de los Quraysh que regresaba de Siria. Llegó a Dhu al-Ushayra y descubrió que la caravana se le había adelantado varios días. Dicha caravana fue la causa de la Gran Batalla de Badr."
  fr: "Le Prophète partit en Jumada al-Ula de l'an 2 de l'Hégire avec cent cinquante, voire deux cents, de Muhajirun, dans l'intention d'intercepter la caravane des Quraysh revenant de Syrie. Il atteignit Dhu al-Ushaira et constata que la caravane l'avait devancé de quelques jours. Cette caravane fut à l'origine de la grande bataille de Badr."
  ur: "نبی کریم جمعۃ الوداع سنہ 2 ہجری میں ایک سو پچاس یا دو سو مہاجرین کے ساتھ شام سے واپس آنے والے قریش کے قافلے کو روکنے کے لیے روانہ ہوئے۔ وہ ذو عشرہ پہنچا اور دیکھا کہ قافلہ کچھ دن پہلے اس سے آگے نکل چکا ہے۔ یہی قافلہ بدر کی عظیم جنگ کا سبب بنا۔"
