label: { ar: "مطاردة قريش إلى حمراء الأسد", en: "The pursuit of Quraysh to Hamra al-Asad" }
summary:
  ar: "من الرجوع عن أحد إلى المدينة، ثم خروج النبي في صباح الأحد الثامن من شوال سنة 3هـ إلى حمراء الأسد على بعد ثمانية أميال جنوب المدينة، وإقامته فيها ثلاثة أيام، ثم رجوعه؛ والمحطات وفق ما ترويه كتب المغازي في الرحيق ص284-287."
  en: "From the return from Uhud to Medina, then the Prophet's departure on the morning of Sunday, the eighth of Shawwal of year 3 AH, to Hamra al-Asad, eight miles south of Medina; his stay there for three days; and then his return. The stations follow what the books of campaigns relate (al-Raheeq, pp. 284-287)."
