  - { from: place/medina, to: place/hamra-al-asad, start: { hijri: "0003-10-08", calendar: julian, precision: day, status: tradition, note: "صباح الأحد الثامن من شوال سنة 3هـ (الرحيق ص284)" }, mode: "مسير", note: "ندب النبي الناس إلى المسير لقاء العدو، ولا يخرج معه إلا من شهد القتال؛ استأذن جابر بن عبد الله فأذن له؛ بلغوا حمراء الأسد على ثمانية أميال من المدينة فعسكروا (الرحيق ص284-285)." }
