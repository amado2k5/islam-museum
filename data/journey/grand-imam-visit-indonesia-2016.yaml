summary:
  ar: "زيارة رسمية قام بها الإمام الأكبر أ.د. أحمد الطيب إلى جمهورية إندونيسيا من 20 إلى 27 فبراير 2016م، بدأت بسفره من القاهرة صباح السبت {cite:rihla-imam-akbar-indonesia-azhar p. 51}، وتضمنت لقاء الرئيس جوكو ويدودو في جاكرتا يوم الاثنين 22 فبراير {cite:rihla-imam-akbar-indonesia-azhar p. 56}، وخطاباً موجهاً إلى المسلمين في آسيا والعالم يوم 23 فبراير {cite:rihla-imam-akbar-indonesia-azhar p. 79}، وتكريماً بالدكتوراه الفخرية في مالانج يوم 24 فبراير {cite:rihla-imam-akbar-indonesia-azhar p. 112}، وزيارة معهد دار السلام كونتور يوم 25 فبراير {cite:rihla-imam-akbar-indonesia-azhar p. 132}. وعاد إلى القاهرة يوم السبت 27 فبراير {cite:rihla-imam-akbar-indonesia-azhar p. 145}."
  en: "Official visit by the Grand Imam to Indonesia from 20 to 27 February 2016: meeting President Widodo in Jakarta (22 Feb), a global address at Sharif Hidayatullah State Islamic University (23 Feb), an honorary doctorate at Malang (24 Feb), a visit to Darussalam Gontor (25 Feb), and return to Cairo (27 Feb). The book is the only source so far."
  es: "Visita oficial del Gran Imán a Indonesia del 20 al 27 de febrero de 2016: encuentro con el presidente Widodo en Yakarta (22 de febrero), discurso internacional en la Universidad Islámica Estatal Sharif Hidayatullah (23 de febrero), doctorado honoris causa en Malang (24 de febrero), visita a Darussalam Gontor (25 de febrero) y regreso a El Cairo (27 de febrero). El libro es la única fuente disponible hasta el momento."
  fr: "Visite officielle du Grand Imam en Indonésie du 20 au 27 février 2016: rencontre avec le président Widodo à Jakarta (22 février), discours international à l’Université islamique d’État Sharif Hidayatullah (23 février), remise d’un doctorat honoris causa à Malang (24 février), visite à Darussalam Gontor (25 février) et retour au Caire (27 février). À ce jour, cet ouvrage est la seule source disponible."
  ur: "20 سے 27 فروری 2016 تک امام اعظم کا انڈونیشیا کا سرکاری دورہ: جکارتہ میں صدر ودودو سے ملاقات ⁦(22 فروری)⁩، شریف ہدایت اللہ اسٹیٹ اسلامک یونیورسٹی میں عالمی خطاب ⁦(23 فروری)⁩، ملنگ میں اعزازی ڈاکٹریٹ ⁦(24 فروری)⁩، دارالسلام گونٹور کا دورہ ⁦(25 فروری)⁩، اور 2 فروری کو واپسی ⁦(27 فروری)⁩ کتاب اب تک واحد ذریعہ ہے۔"
  tr: "Büyük İmam Dr. Ahmed Al-Tayeb'in 20-27 Şubat 2016 tarihleri arasında Endonezya Cumhuriyeti'ne yaptığı resmi ziyaret, Cumartesi sabahı Kahire'den ayrılmasıyla başladı {cite:rihla-imam-akbar-indonesia-azhar s. 51} ve 22 Şubat Pazartesi günü Jakarta'da Cumhurbaşkanı Joko Widodo ile bir görüşmeyi {cite:rihla-imam-akbar-indonesia-azhar s. 56}, 23 Şubat'ta Asya ve dünyadaki Müslümanlara hitaben bir konuşmayı {cite:rihla-imam-akbar-indonesia-azhar s. 79} ve 24 Şubat'ta Malang'da fahri doktora unvanının verilmesini {cite:rihla-imam-akbar-indonesia-azhar s. 59} içerdi. 112} ve 25 Şubat'ta Darussalam Gontor Enstitüsü'nü ziyaret etti {cite:rihla-imam-akbar-indonesia-azhar s. 132}. 27 Şubat Cumartesi günü Kahire'ye döndü {cite:rihla-imam-akbar-indonesia-azhar s. 145}."
  id: "Kunjungan resmi Imam Besar, Dr. Ahmed Al-Tayeb, ke Republik Indonesia dari tanggal 20 hingga 27 Februari 2016, dimulai dengan keberangkatannya dari Kairo pada Sabtu pagi {cite:rihla-imam-akbar-indonesia-azhar hlm. 51}, dan termasuk pertemuan dengan Presiden Joko Widodo di Jakarta pada Senin, 22 Februari {cite:rihla-imam-akbar-indonesia-azhar hlm. 56}, pidato yang ditujukan kepada umat Muslim di Asia dan dunia pada tanggal 23 Februari {cite:rihla-imam-akbar-indonesia-azhar hlm. 79}, pemberian gelar doktor kehormatan di Malang pada tanggal 24 Februari {cite:rihla-imam-akbar-indonesia-azhar hlm. 112}, dan kunjungan ke Institut Darussalam Gontor pada tanggal 25 Februari {cite:rihla-imam-akbar-indonesia-azhar hlm. 132}. Dia kembali ke Kairo pada hari Sabtu, 27 Februari {cite:rihla-imam-akbar-indonesia-azhar p. 145}."
