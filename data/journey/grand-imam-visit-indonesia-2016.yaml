label:
  ar: زيارة الإمام الأكبر أحمد الطيب إلى إندونيسيا (2016م)
  en: "Grand Imam Ahmad al-Tayyib's visit to Indonesia (2016)"
summary:
  ar: "زيارة رسمية قام بها الإمام الأكبر أ.د. أحمد الطيب إلى جمهورية إندونيسيا من 20 إلى 27 فبراير 2016م، بدأت بسفره من القاهرة صباح السبت {cite:rihla-imam-akbar-indonesia-azhar p. 51}، وتضمنت لقاء الرئيس جوكو ويدودو في جاكرتا يوم الاثنين 22 فبراير {cite:rihla-imam-akbar-indonesia-azhar p. 56}، وخطاباً موجهاً إلى المسلمين في آسيا والعالم يوم 23 فبراير {cite:rihla-imam-akbar-indonesia-azhar p. 79}، وتكريماً بالدكتوراه الفخرية في مالانج يوم 24 فبراير {cite:rihla-imam-akbar-indonesia-azhar p. 112}، وزيارة معهد دار السلام كونتور يوم 25 فبراير {cite:rihla-imam-akbar-indonesia-azhar p. 132}. وعاد إلى القاهرة يوم السبت 27 فبراير {cite:rihla-imam-akbar-indonesia-azhar p. 145}."
  en: "Official visit by the Grand Imam to Indonesia from 20 to 27 February 2016: meeting President Widodo in Jakarta (22 Feb), a global address at Sharif Hidayatullah State Islamic University (23 Feb), an honorary doctorate at Malang (24 Feb), a visit to Darussalam Gontor (25 Feb), and return to Cairo (27 Feb). The book is the only source so far."
