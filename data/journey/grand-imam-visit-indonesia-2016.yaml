label:
  ar: زيارة الإمام الأكبر أحمد الطيب إلى إندونيسيا ⁦(2016م)⁩
  en: "Grand Imam Ahmad al-Tayyib's visit to Indonesia (2016)"
  es: "Visita del gran imán Ahmad al-Tayyib a Indonesia (2016)"
  fr: "Visite du grand imam Ahmad al-Tayyib en Indonésie (2016)"
  ur: "عظیم الشان امام احمد الطیب کا دورہ انڈونیشیا (2016)"
