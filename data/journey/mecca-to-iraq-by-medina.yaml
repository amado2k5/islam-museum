travelers: [person/ibn-battuta-muhammad]
legs:
  - { from: place/mecca, to: place/badr, mode: "على ظهر الدواب مع ركب العراق", note: "خرج من مكة في العشرين من ذي الحجة بعد طواف الوداع إلى بطن مر، ثم عسفان وخليص ووادي السمك، فنزل بدر (ص106–107).", sources: [source/rihla-ibn-battuta-1958] }
  - { from: place/badr, to: place/medina, mode: "على ظهر الدواب مع ركب العراق", note: "من بدر إلى الصفراء، ثم مسيرة ثلاثة أيام إلى المدينة، فأقام بها ستة أيام (ص107).", sources: [source/rihla-ibn-battuta-1958] }
  - { from: place/medina, to: place/al-qadisiyya, mode: "على ظهر الدواب مع ركب العراق", note: "من المدينة إلى وادي المروس ثم أرض نجد: العسيلة والثقرة والقارورة والحاجر، ثم سميرة والجبل المخروق ووادي الكروش وحصن فيد، ثم الأجفر وزرود والثعلبية وبركة المرجوم، ثم المشقوق والتنانير وزمالة والهيشمين وعقبة الشيطان وواقصة ولورة والمساجد ومنارة القرون والعذيب، فالقادسية (ص107–109). بعد القادسية نزل مشهد علي بالنجف، وذكر أن الكوفة وبغداد أمامه في الطريق، ولم يذكر أنه دخلهما في هذا الموضع (ص109).", sources: [source/rihla-ibn-battuta-1958] }
