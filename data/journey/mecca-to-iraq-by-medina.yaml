id: journey/mecca-to-iraq-by-medina
class: journey
kind: pilgrimage_route
label: { ar: "من مكة إلى العراق مروراً بالمدينة مع ركب العراق", en: "Mecca to Iraq by way of Medina with the Iraqi caravan" }
summary:
  ar: "طريق ابن بطوطة من مكة إلى العراق بعد الحج، مع ركب العراق: خرج من مكة بعد طواف الوداع إلى بطن مر، ثم عسفان وخليص وبدر والصفراء إلى المدينة، ومكث بها ستة أيام، ثم سار إلى وادي المروس ونجد، فحصن فيد وزرود والثعلبية، حتى القادسية ثم النجف. يذكر الكتاب المنازل ومواردها ومصانع زبيدة على الطريق."
