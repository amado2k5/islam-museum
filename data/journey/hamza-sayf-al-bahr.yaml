label: { ar: "سرية حمزة إلى سيف البحر", en: "The expedition of Hamza to Sayf al-Bahr", es: "La expedición de Hamza a Sayf al-Bahr", fr: "L'expédition de Hamza à Sayf al-Bahr" }
summary:
  ar: "بعث النبي حمزة بن عبد المطلب في رمضان سنة 1هـ في ثلاثين رجلاً من المهاجرين يعترض عيراً لقريش جاءت من الشام، فبلغوا سيف البحر من ناحية العيص، وحجز مجدي بن عمرو بين الفريقين فلم يقتتلوا."
  en: "The Prophet sent Hamza ibn 'Abd al-Muttalib in Ramadan of year 1 AH with thirty men of the Muhajirun to intercept a Quraysh caravan that had come from Syria. They reached Sayf al-Bahr on the side of al-'Is, and Majdi ibn 'Amr stepped between the two parties so that they did not fight."
  es: "El Profeta envió a Hamza ibn 'Abd al-Muttalib en Ramadán del año 1 de la Hégira con treinta hombres de los Muhajirun para interceptar una caravana de los Quraysh que venía de Siria. Llegaron a Sayf al-Bahr, en territorio de los Is, y Majdi ibn 'Amr se interpuso entre ambos bandos para evitar el combate."
  fr: "Le Prophète envoya Hamza ibn 'Abd al-Muttalib, durant le Ramadan de l'an 1 de l'Hégire, avec trente hommes des Muhajirun, intercepter une caravane quraychite venue de Syrie. Ils atteignirent Sayf al-Bahr, du côté d'al-'Is, et Majdi ibn 'Amr s'interposa entre les deux camps pour éviter le combat."
