label: { ar: "سرية حمزة إلى سيف البحر", en: "The expedition of Hamza to Sayf al-Bahr" }
summary:
  ar: "بعث النبي حمزة بن عبد المطلب في رمضان سنة 1هـ في ثلاثين رجلاً من المهاجرين يعترض عيراً لقريش جاءت من الشام، فبلغوا سيف البحر من ناحية العيص، وحجز مجدي بن عمرو بين الفريقين فلم يقتتلوا."
  en: "The Prophet sent Hamza ibn 'Abd al-Muttalib in Ramadan of year 1 AH with thirty men of the Muhajirun to intercept a Quraysh caravan that had come from Syria. They reached Sayf al-Bahr on the side of al-'Is, and Majdi ibn 'Amr stepped between the two parties so that they did not fight."
