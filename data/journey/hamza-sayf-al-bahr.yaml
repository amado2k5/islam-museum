id: journey/hamza-sayf-al-bahr
class: journey
kind: military_campaign
label: { ar: "سرية حمزة إلى سيف البحر", en: "The expedition of Hamza to Sayf al-Bahr", es: "La expedición de Hamza a Sayf al-Bahr", fr: "L'expédition de Hamza à Sayf al-Bahr", ur: "حمزہ کی سیف البحر کی طرف غزوہ", tr: "Hamza'nın deniz kıyısına gizli görevi", id: "Misi rahasia Hamza ke pantai laut" }
summary:
  ar: "بعث النبي حمزة بن عبد المطلب في رمضان سنة 1هـ في ثلاثين رجلاً من المهاجرين يعترض عيراً لقريش جاءت من الشام، فبلغوا سيف البحر من ناحية العيص، وحجز مجدي بن عمرو بين الفريقين فلم يقتتلوا."
  en: "The Prophet sent Hamza ibn 'Abd al-Muttalib in Ramadan of year 1 AH with thirty men of the Muhajirun to intercept a Quraysh caravan that had come from Syria. They reached Sayf al-Bahr on the side of al-'Is, and Majdi ibn 'Amr stepped between the two parties so that they did not fight."
  es: "El Profeta envió a Hamza ibn 'Abd al-Muttalib en Ramadán del año 1 de la Hégira con treinta hombres de los Muhajirun para interceptar una caravana de los Quraysh que venía de Siria. Llegaron a Sayf al-Bahr, en territorio de los Is, y Majdi ibn 'Amr se interpuso entre ambos bandos para evitar el combate."
  fr: "Le Prophète envoya Hamza ibn 'Abd al-Muttalib, durant le Ramadan de l'an 1 de l'Hégire, avec trente hommes des Muhajirun, intercepter une caravane quraychite venue de Syrie. Ils atteignirent Sayf al-Bahr, du côté d'al-'Is, et Majdi ibn 'Amr s'interposa entre les deux camps pour éviter le combat."
  ur: "رسول اللہ نے حمزہ بن عبدالمطلب کو رمضان المبارک 1 ہجری میں مہاجرین کے تیس آدمیوں کے ساتھ شام سے آنے والے قریش کے قافلے کو روکنے کے لیے بھیجا تھا۔ وہ العیس کی طرف سے سیف البحر پہنچے اور ماجدی بن عمرو نے دونوں فریقوں کے درمیان قدم رکھا تاکہ وہ لڑائی نہ کریں۔"
  tr: "Peygamberimiz, Hicri 1. yılın Ramazan ayında Hamza bin Abdülmuttalib'i, Levant'tan gelen Kureyş kervanını durdurmak üzere Muhacirlerden otuz adamla birlikte gönderdi. Kervan, Ay Nehri kıyısındaki sahile ulaştı ve Majdi bin Amr, iki grup arasında çatışma çıkmaması için araya girdi."
  id: "Nabi Muhammad SAW mengutus Hamza bin Abdul Muttalib bersama tiga puluh orang dari kaum Muhajirin untuk mencegat kafilah Quraisy yang datang dari Levant. Mereka sampai di tepi pantai di sisi Al-Ais, dan Majdi bin Amr melerai kedua kelompok tersebut agar mereka tidak saling bertempur."
