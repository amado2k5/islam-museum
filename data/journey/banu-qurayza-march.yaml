  - { from: place/bir-ana, to: place/banu-qurayza-fortresses, mode: "مسير", events: [event/siege-of-banu-qurayza], note: "تحرك المسلمون نحو قريظة أرسالاً حتى تلاحقوا بالنبي، وهم ثلاثة آلاف والخيل ثلاثون فرساً؛ أدركتهم صلاة العصر في الطريق فصلوها هناك، فاختلف فهمهم للأمر ولم يعنّف النبي أحداً من الطائفتين؛ ثم نازلوا حصون بني قريظة وفرضوا الحصار ⁦(الرحيق ص314)⁩." }
waypoints:
  - place: place/medina
    day: 1
    day_status: tradition
    day_note: "اليوم الذي رجع فيه النبي من الأحزاب، والنص لا يعيّن يوماً بالرقم؛ الترتيب هنا ترتيب المحطة ⁦(الرحيق ص314)⁩."
    title: { ar: "الندب إلى بني قريظة" }
    narrative:
      ar: "بعد رجوع المسلمين من الخندق ووضعهم السلاح، جاء جبريل عند الظهر في بيت أم سلمة فأمر النبي بالمسير إلى بني قريظة. نادى النبي في الناس، واستعمل ابن أم مكتوم على المدينة، وأعطى الراية علي بن أبي طالب وقدّمه ⁦(الرحيق ص314)⁩."
    sources: [source/mubarakpuri-raheeq]
