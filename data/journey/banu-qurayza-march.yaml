id: journey/banu-qurayza-march
class: journey
kind: military_campaign
label: { ar: "مسير الجيش إلى بني قريظة", en: "The army's march to Banu Qurayza" }
summary:
  ar: "من المدينة بعد رجوع المسلمين من الخندق في ذي القعدة سنة 5هـ، إلى بئر أنا من آبار بني قريظة ثم إلى حصونهم؛ وفق ما ترويه كتب السيرة في الرحيق ص314-315."
  en: "From Medina, after the Muslims returned from the Trench in Dhu al-Qa'dah of year 5 AH, to the well of Anaa, one of the wells of Banu Qurayza, and then to their fortresses, following what the books of sira relate (al-Raheeq, pp. 314-315)."
wings: []
periods: [period/prophetic-era]
regions: [arabia]
travelers: [person/muhammad, person/ali-ibn-abi-talib]
legs:
  - { from: place/medina, to: place/bir-ana, start: { hijri: "0005-11", calendar: julian, precision: month, status: tradition, note: "ذي القعدة سنة 5هـ، في اليوم الذي رجع فيه النبي من الأحزاب (الرحيق ص314، ص318)" }, mode: "مسير", events: [event/siege-of-banu-qurayza], note: "أمر جبريل بالمسير إلى بني قريظة عند الظهر؛ أذّن النبي في الناس ألا يصلي العصر أحد إلا في بني قريظة، واستعمل ابن أم مكتوم على المدينة، ودفع الراية إلى علي؛ فنزل النبي على بئر من آبار قريظة يقال لها بئر أنا (الرحيق ص314)." }
  - { from: place/bir-ana, to: place/banu-qurayza-fortresses, mode: "مسير", events: [event/siege-of-banu-qurayza], note: "تحرك المسلمون نحو قريظة أرسالاً حتى تلاحقوا بالنبي، وهم ثلاثة آلاف والخيل ثلاثون فرساً؛ أدركتهم صلاة العصر في الطريق فصلوها هناك، فاختلف فهمهم للأمر ولم يعنّف النبي أحداً من الطائفتين؛ ثم نازلوا حصون بني قريظة وفرضوا الحصار (الرحيق ص314)." }
waypoints:
