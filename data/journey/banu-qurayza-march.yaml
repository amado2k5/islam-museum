id: journey/banu-qurayza-march
class: journey
kind: military_campaign
label: { ar: "مسير الجيش إلى بني قريظة", en: "The army's march to Banu Qurayza", es: "La marcha del ejército hacia Banu Qurayza", fr: "La marche de l'armée vers Banu Qurayza", ur: "بنو قریظہ کی طرف فوج کا مارچ", tr: "Ordunun Banu Qurayza'ya yürüyüşü", id: "Perjalanan pasukan menuju Banu Qurayza" }
summary:
  ar: "من المدينة بعد رجوع المسلمين من الخندق في ذي القعدة سنة 5هـ، إلى بئر أنا من آبار بني قريظة ثم إلى حصونهم؛ وفق ما ترويه كتب السيرة في الرحيق ص314-315."
  en: "From Medina, after the Muslims returned from the Trench in Dhu al-Qa'dah of year 5 AH, to the well of Anaa, one of the wells of Banu Qurayza, and then to their fortresses, following what the books of sira relate (al-Raheeq, pp. 314-315)."
  es: "Desde Medina, después de que los musulmanes regresaron de la Trinchera en Dhu al-Qa'dah del año 5 AH, al pozo de Anaa, uno de los pozos de Banu Qurayza, y luego a sus fortalezas, siguiendo lo que relatan los libros de la sira (al-Raheeq, pp. 314-315)."
  fr: "De Médine, après le retour des musulmans du Fossé en Dhu al-Qa'dah de l'an 5 AH, au puits d'Anaa, l'un des puits des Banu Qurayza, puis à leurs forteresses, suivant ce que racontent les livres de sira (al-Raheeq, pp. 314-315)."
  ur: "مدینہ سے، 5 ہجری میں ذوالقعدہ میں خندق سے مسلمانوں کی واپسی کے بعد، بنو قریظہ کے کنوؤں میں سے ایک کنوئیں عنا کی طرف، اور پھر ان کے قلعوں کی طرف، جو سیرت کی کتابوں کے مطابق ہے ⁦(الرحیق، صفحہ 314-315)⁩۔"
  tr: "Hicri 5. yılda Zilhicce'de hendekten döndükten sonra şehirden, Beni Kurayza'nın kuyularından biri olan Ene kuyusuna, oradan da kalelerine; Al-Rahiq adlı biyografi kitabının 314-315. sayfalarında anlatılanlara göre."
  id: "Dari kota setelah kaum Muslim kembali dari parit di Dzul Qi'dah pada tahun 5 Hijriah, ke sumur Ana, salah satu sumur Bani Quraisy, kemudian ke benteng-benteng mereka; menurut apa yang diriwayatkan oleh kitab-kitab biografi dalam Al-Raheeq, hlm. 314-315."
