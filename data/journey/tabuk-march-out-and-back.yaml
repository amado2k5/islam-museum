summary:
  ar: "مسير النبي من المدينة إلى تبوك في رجب سنة تسع ورجوعه، بحسب المواضع التي ذكرها ابن إسحاق: ثنية الوداع حيث ضرب عسكره، والجرف حيث لحق به علي، والحجر، وتبوك حيث أقام بضع عشرة ليلة، ووادي المشقق في طريق العودة. لا يرتّب ابن إسحاق كل المنازل، وسيُكمل مقطع العودة (ذو أوان) في الدفعة 7."
