label: { ar: "درب زبيدة — طريق الحج من الكوفة إلى مكة", en: "Darb Zubayda — the pilgrim road from Kufa to Mecca", es: "Darb Zubayda: el camino de peregrinación de Kufa a La Meca.", fr: "Darb Zubayda — la route de pèlerinage de Kufa à La Mecque", ur: "درب زبیدہ - کوفہ سے مکہ تک حاجیوں کی سڑک" }
summary:
  ar: "طريق الحج من الكوفة إلى مكة الذي سجله قدامة بن جعفر في منزلة البريد بسككه ومنازله ومسافاته بالأميال وما في كل منزل من البرك والآبار والمنابر: من مدينة السلام إلى الكوفة فالقادسية فالعذيب — وكانت مسلحة بين العرب وفارس في حد البرية بها حائطان — ثم المغيثة والقرعاء وواقصة والعقبة والقاع وزبالة العامرة والشقوق وقبر العبادي والثعلبية والخزيمية المسورة التي فيها منبر وحمام وكانت تسمى زرود ورملها أحمر، والأجفر وفيد وفيها منزل العامل وقناة وزروع ومنبر، وتوز والحاجر ومعدن النقرة والربذة كثيرة الماء والمنبر ومعدن بني سليم، ثم طريق الحجاز إلى مكة {cite:masalik-mamalik-ibn-khurdadhbih pp. 193-194}."
  en: "The pilgrim road from Kufa to Mecca as registered by Qudama ibn Ja'far in the barid chapter — its relay stations, mileages and each halt's cisterns, wells and minbars: from Madinat al-Salam to Kufa, al-Qadisiyya and al-Udhayb (the frontier picket between Arabs and Persians with its twin walls), then al-Maghitha, al-Qar'a, Waqisa, al-Aqaba, al-Qa', populous Zubala, al-Shiquq, Qabr al-Abbadi, al-Tha'labiyya, walled al-Khuzaymiyya with its minbar and hammam (once called Zarud, its sand red), al-Ajfar, Fayd with the governor's lodge and canal and minbar, Tawz, al-Hajir, Ma'dan al-Nuqra, al-Rabadha with abundant water, Ma'dan Bani Sulaym, and on through the Hijaz road to Mecca {cite:masalik-mamalik-ibn-khurdadhbih pp. 193-194}."
  es: "El camino de peregrinación de Kufa a La Meca registrado por Qudama ibn Ja'far en el capítulo bárido: sus estaciones de relevo, kilometraje y cisternas, pozos y minbares de cada parada: de Madinat al-Salam a Kufa, al-Qadisiyya y al-Udhayb (el piquete fronterizo entre árabes y persas con sus muros gemelos), luego al-Maghitha, al-Qar'a, Waqisa, al-Aqaba, al-Qa', la populosa Zubala, al-Shiquq, Qabr al-Abbadi, al-Tha'labiyya, la amurallada al-Khuzaymiyya con su minbar y hammam (antes llamado Zarud, su arena roja), al-Ajfar, Fayd con la cabaña del gobernador, su canal y su minbar, Tawz, al-Hajir, Ma'dan al-Nuqra, al-Rabadha con abundante agua, Ma'dan Bani Sulaym, y luego por el camino de Hijaz hacia La Meca {cita:masalik-mamalik-ibn-khurdadhbih págs. 193-194}."
  fr: "La route de pèlerinage de Koufa à La Mecque telle qu'enregistrée par Qudama ibn Ja'far dans le chapitre barid - ses relais, ses kilométrages et les citernes, puits et minbars de chaque halte: de Madinat al-Salam à Kufa, al-Qadisiyya et al-Udhayb (le piquet frontière entre Arabes et Perses avec ses murs jumeaux), puis al-Maghitha, al-Qar'a, Waqisa, al-Aqaba, al-Qa', la populeuse Zubala, al-Shiquq, Qabr al-Abbadi, al-Tha'labiyya, al-Khuzaymiyya fortifiée avec son minbar et son hammam (autrefois appelé Zarud, son sable rouge), al-Ajfar, Fayd avec la loge du gouverneur, son canal et son minbar, Tawz, al-Hajir, Ma'dan al-Nuqra, al-Rabadha avec de l'eau abondante, Ma'dan Bani Sulaym, et à travers le Route du Hijaz vers la Mecque {cite: masalik-mamalik-ibn-khurdadhbih pp. 193-194}."
  ur: "کوفہ سے مکہ تک حجاج کا راستہ جیسا کہ قدامہ ابن جعفر نے بارد باب میں درج کیا ہے - اس کے ریلے اسٹیشنز، میل اور ہر ٹھکانے کے حوض، کنوئیں اور منبر: مدینۃ السلام سے کوفہ، القدسیہ اور الذیب ⁦(سرحدی دھرنا)⁩، اس کے بعد عربوں اور اس کے ساتھیوں کے درمیان فصیل۔ القرعہ، وقاصہ، العقبہ، القع، آبادی والا زبالا، الشیق، قبر العبادی، الثعلبیہ، دیوار والا خزیمیہ اس کے منبر اور حمام کے ساتھ ⁦(جو کبھی زرد کہلاتا تھا، اس کی ریت سرخ)⁩، الاجفر اور لووردج کے ساتھ، الغفار اور گویرن، توز، الہاجر، مدن النقرہ، الرابع جس میں وافر پانی ہے، معدن بنی سلیم، اور حجاز کے راستے مکہ جانے والی سڑک {حوالہ: مسالک ممالک ابن خردابیح صفحہ 193-194}۔"
