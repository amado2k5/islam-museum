label: { ar: "من صنعاء إلى عدن في رحلة ابن بطوطة", en: "From Sanaa to Aden on Ibn Battuta's journey", es: "Desde Sanaa hasta Adén en el viaje de Ibn Battuta", fr: "Le voyage d'Ibn Battuta de Sanaa à Aden", ur: "ابن بطوطہ کے سفر میں صنعاء سے عدن تک", tr: "İbn Battuta'nın Yolculuğunda Sana'a'dan Aden'e", id: "Dari Sana'a ke Aden dalam Perjalanan Ibn Battuta" }
summary:
  ar: "مرحلة من رحلة ابن بطوطة في اليمن: بعد أن أقام في صنعاء وزار جامعها، سافر منها إلى عدن، وهي مرسى على ساحل البحر تحفها الجبال ولا زرع فيها ولا شجر، وتعتمد على الصهاريج لمياه المطر."
  en: "A stage of Ibn Battuta's journey in Yemen. After staying in Sanaa and visiting its great mosque, he travelled from there to Aden, a harbour on the sea coast ringed by mountains, with no crops or trees, which relies on cisterns for rainwater."
  es: "Una etapa del viaje de Ibn Battuta por Yemen. Tras alojarse en Saná y visitar su gran mezquita, viajó desde allí a Adén, un puerto costero rodeado de montañas, sin cultivos ni árboles, que depende de cisternas para el agua de lluvia."
  fr: "Une étape du voyage d'Ibn Battuta au Yémen. Après un séjour à Sanaa et la visite de sa grande mosquée, il se rendit à Aden, un port côtier entouré de montagnes, sans cultures ni arbres, qui dépend de citernes pour l'eau de pluie."
  ur: "ابن بطوطہ کے یمن میں سفر کا ایک مرحلہ۔ صنعا میں قیام کرنے اور اس کی عظیم مسجد کا دورہ کرنے کے بعد، وہ وہاں سے عدن کا سفر کیا، جو کہ پہاڑوں سے گھرے ہوئے سمندری ساحل پر ایک بندرگاہ ہے، جس میں کوئی فصل یا درخت نہیں ہیں، جو بارش کے پانی کے لیے حوضوں پر انحصار کرتے ہیں۔"
  tr: "İbn Battuta'nın Yemen yolculuğunun bir aşaması: Sana'a'da kaldıktan ve oradaki camiyi ziyaret ettikten sonra, oradan dağlarla çevrili, ekin ve ağaç bulunmayan ve yağmur suyu ihtiyacını sarnıçlardan karşılayan bir liman kenti olan Aden'e gitti."
  id: "Salah satu tahapan perjalanan Ibn Battuta di Yaman: Setelah tinggal di Sana'a dan mengunjungi masjidnya, ia melanjutkan perjalanan dari sana ke Aden, sebuah pelabuhan di tepi laut yang dikelilingi pegunungan dan tidak memiliki lahan pertanian atau pepohonan, serta bergantung pada penampungan air hujan."
