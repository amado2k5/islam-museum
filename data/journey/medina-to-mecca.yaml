summary:
  ar: "طريق ابن بطوطة من المدينة إلى مكة في حجته الأولى مع ركب الشام: خرج من المدينة فنزل قرب ذي الحليفة فأحرم بالحج، ثم الروحاء فالصفراء فبدر، ثم البزواء ورابغ وخليص وعسفان وبطن مر، حتى دخل مكة صباحاً. يذكر الكتاب المحطات بأسمائها مع ما يلقاه فيها."
