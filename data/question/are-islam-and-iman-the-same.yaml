id: question/are-islam-and-iman-the-same
class: question
label: { ar: "هل الإسلام والإيمان شيء واحد؟", en: "Are islam and iman one and the same?", ur: "کیا اسلام اور ایمان ایک ہی چیز ہیں؟" }
question: { ar: "هل يدل اسم الإسلام واسم الإيمان على معنى واحد، أم يفترقان؟", en: "Do the names islam and iman denote one meaning, or do they differ?", ur: "کیا اسلام اور ایمان کے نام ایک ہی معنی پر دلالت کرتے ہیں، یا دونوں الگ ہیں؟" }
issue: { ar: "حديث سعد بن أبي وقاص «أو مسلم» وقول الزهري في آية الحجرات 14، كما يرويهما أبو داود ويشرحهما الخطابي.", en: "Sa'd ibn Abi Waqqas's report 'or a Muslim' and al-Zuhri's comment on al-Hujurat 14, as Abu Dawud relates them and al-Khattabi explains them." }
summary:
  ar: "يروي أبو داود حديث سعد أنه قال للنبي: أعطِ فلاناً فإنه مؤمن، فقال: «أو مسلم»، وقول الزهري في الآية «قل لم تؤمنوا ولكن قولوا أسلمنا»: نرى أن الإسلام الكلمة والإيمان العمل؛ ويحكي الخطابي أن قوماً جعلوهما شيئاً واحداً استدلالاً بآيتي الذاريات 35–36، وأن رجلين من كبار أهل العلم تناظرا في ذلك وصنّف أحدهما على الآخر كتاباً نحو مئتي ورقة، ويرى هو أن الصحيح تقييد الكلام لا إطلاقه: فالمسلم قد يكون مؤمناً في بعض الأحوال دون بعض، والمؤمن مسلم في كل حال {cite:sunan-abi-dawud-ibn-hazm-1997-v5 p. 42-43}."
  en: "Abu Dawud relates Sa'd's report that he told the Prophet, 'Give so-and-so, for he is a believer,' and was answered, 'Or a Muslim,' and al-Zuhri's comment on the verse 'say: you do not believe, but say: we have submitted': 'we hold that islam is the word and iman the deed'; al-Khattabi relates that others made them one, citing al-Dhariyat 35–36, that two leading scholars disputed the matter and one wrote a book of some two hundred leaves against the other, and holds that the right course is to qualify rather than generalise: a Muslim may be a believer in some states and not others, while a believer is a Muslim in every state {cite:sunan-abi-dawud-ibn-hazm-1997-v5 p. 42-43}."
  ur: "ابو داؤد سعد کی حدیث روایت کرتے ہیں کہ انہوں نے نبی سے کہا: فلاں کو دیجیے، وہ مومن ہے، تو فرمایا: «یا مسلم»، اور آیت «کہو تم ایمان نہیں لائے بلکہ کہو ہم نے اسلام قبول کیا» پر زہری کا قول: ہمارا خیال ہے کہ اسلام کلمہ ہے اور ایمان عمل؛ خطابی بتاتے ہیں کہ کچھ لوگوں نے الذاریات 35–36 سے استدلال کر کے دونوں کو ایک کہا، کہ دو بڑے اہلِ علم نے اس پر مناظرہ کیا اور ایک نے دوسرے کے رد میں تقریباً دو سو ورق کی کتاب لکھی، اور ان کی اپنی رائے یہ ہے کہ درست یہ ہے کہ بات کو مقید کیا جائے، مطلق نہ رکھا جائے: مسلمان کبھی بعض حالات میں مومن ہوتا ہے اور بعض میں نہیں، اور مومن ہر حال میں مسلمان ہے {cite:sunan-abi-dawud-ibn-hazm-1997-v5 p. 42-43}۔"
short_answer:
  ar: "ثلاثة مواقف في هذا الموضع: الزهري يفرّق (الإسلام الكلمة والإيمان العمل)، وآخرون يجعلونهما واحداً، والخطابي يقيّد: الإيمان التصديق والإسلام الانقياد، وكل مؤمن مسلم وليس كل مسلم مؤمناً في كل حال."
  en: "Three positions here: al-Zuhri distinguishes them (islam the word, iman the deed), others make them one, and al-Khattabi qualifies: iman is assent and islam submission; every believer is a Muslim, but not every Muslim is a believer in every state."
  ur: "یہاں تین موقف ہیں: زہری فرق کرتے ہیں (اسلام کلمہ، ایمان عمل)، دوسرے دونوں کو ایک کہتے ہیں، اور خطابی قید لگاتے ہیں: ایمان تصدیق ہے اور اسلام انقیاد؛ ہر مومن مسلمان ہے مگر ہر مسلمان ہر حال میں مومن نہیں۔"
