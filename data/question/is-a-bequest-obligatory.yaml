    stance: { ar: "الوصية ليست فرضاً، ولا تجب للقرابة", en: "A bequest is not obligatory, nor owed to relatives", ur: "وصیت فرض نہیں، نہ رشتہ داروں کے لیے واجب ہے" }
    summary: { ar: "يحكي ابن حزم أن من قالوا ليست فرضاً احتجوا برواية يحيى القطان عن عبيد الله بن عمر «له شيء يريد أن يوصي فيه» فردّوا الأمر إلى إرادته، وبأن النبي لم يوص، وبأن ابن عمر وحاطباً لم يوصيا، وبأقوال ابن عباس وعلي وعائشة فيمن ترك مالاً قليلاً؛ وأن من لم يوجبها للقرابة احتجوا بحديث الذي أعتق ستة أعبد عند موته فأقرع النبي بينهم، وهي وصية لغير الأقارب، وبوصية عبد الرحمن بن عوف لأمهات المؤمنين ولأهل بدر.", en: "Ibn Hazm reports that those who hold it not obligatory argued from Yahya al-Qattan's version through 'Ubayd Allah ibn 'Umar, 'something he wishes to bequeath', which leaves it to his wish; from the fact that the Prophet made no bequest; from reports that Ibn 'Umar and Hatib made none; and from sayings of Ibn 'Abbas, 'Ali and 'A'isha about one who leaves little property; and that those who do not require it for relatives argued from the man who freed six slaves at his death, among whom the Prophet drew lots, a bequest to non-relatives, and from 'Abd al-Rahman ibn 'Awf's bequests to the Mothers of the Believers and to the veterans of Badr.", ur: "ابن حزم نقل کرتے ہیں کہ جو اسے فرض نہیں سمجھتے انہوں نے یحییٰ قطان کی عبید اللہ بن عمر سے روایت «جس میں وہ وصیت کرنا چاہے» سے دلیل لی جو اسے اس کی مرضی پر چھوڑتی ہے؛ اس سے کہ نبی نے وصیت نہیں کی؛ ان روایات سے کہ ابن عمر اور حاطب نے وصیت نہیں کی؛ اور تھوڑا مال چھوڑنے والے کے بارے میں ابن عباس، علی اور عائشہ کے اقوال سے؛ اور جو رشتہ داروں کے لیے اسے واجب نہیں کرتے انہوں نے اس شخص کی حدیث سے دلیل لی جس نے موت کے وقت چھ غلام آزاد کیے اور نبی نے ان میں قرعہ ڈالا، جو غیر رشتہ داروں کے لیے وصیت ہے، اور عبد الرحمن بن عوف کی امہات المؤمنین اور اہلِ بدر کے لیے وصیت سے۔" }
    holders: [person/abu-hanifa, person/malik-ibn-anas, person/al-shafii, person/ibrahim-al-nakhai, person/sufyan-al-thawri, person/al-awzai-abd-al-rahman]
