    summary: { ar: "يحتج ابن حزم برواية مالك ويونس وعمرو بن الحارث لحديث ابن عمر بلفظ الإيجاب، وبأن ابن عمر لم يبت ليلة منذ سمعه إلا ووصيته عنده، وبتشديد طلحة والزبير فيها، وهو قول ابن أبي أوفى وطاوس والشعبي؛ ويوجب الوصية للقرابة غير الوارثين لرقّ أو كفر أو حجب، ومنهم الوالدان الكافران أو المملوكان، بآية البقرة 180 التي يرى أنه نُسخ منها الوارثون وبقي من لا يرث، كما قال قتادة ومسلم بن يسار والعلاء بن زياد وإياس بن معاوية، وبه قال إسحاق وأبو سليمان؛ فإن لم يوص أُعطوا ما رآه الورثة أو الوصي.", en: "Ibn Hazm argues from the versions of Ibn 'Umar's report transmitted by Malik, Yunus and 'Amr ibn al-Harith in the wording of obligation, from Ibn 'Umar's never spending a night after hearing it without his will beside him, and from Talha's and al-Zubayr's strictness about it, the view also of Ibn Abi Awfa, Tawus and al-Sha'bi; he requires a bequest for relatives who do not inherit because of slavery, unbelief or exclusion, including unbelieving or enslaved parents, by al-Baqara 180, from which in his view the heirs were abrogated while the non-inheriting remained, as Qatada, Muslim ibn Yasar, al-'Ala' ibn Ziyad and Iyas ibn Mu'awiya said and as Ishaq and Abu Sulayman held; if the deceased made none, they are given what the heirs or executor see fit.", ur: "ابن حزم ابن عمر کی حدیث کی ان روایات سے استدلال کرتے ہیں جو مالک، یونس اور عمرو بن الحارث نے وجوب کے الفاظ میں نقل کیں، اس سے کہ ابن عمر نے اسے سننے کے بعد کوئی رات اپنی وصیت پاس رکھے بغیر نہیں گزاری، اور طلحہ و زبیر کی اس بارے میں سختی سے، اور یہی ابن ابی اوفیٰ، طاؤس اور شعبی کا قول ہے؛ وہ ان رشتہ داروں کے لیے وصیت واجب کرتے ہیں جو غلامی، کفر یا حجب کی وجہ سے وارث نہیں، جن میں کافر یا غلام والدین بھی ہیں، سورۂ بقرہ 180 کی بنا پر جس سے ان کے نزدیک وارث منسوخ ہوئے اور غیر وارث باقی رہے، جیسا کہ قتادہ، مسلم بن یسار، علاء بن زیاد اور ایاس بن معاویہ نے کہا اور اسحاق و ابو سلیمان کا قول ہے؛ اگر میت نے وصیت نہ کی ہو تو انہیں وہ دیا جائے جو ورثا یا وصی مناسب سمجھیں۔" }
