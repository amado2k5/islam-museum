id: question/is-a-bequest-obligatory
class: question
label: { ar: "هل الوصية فرض، وهل تجب للأقارب غير الوارثين؟", en: "Is making a bequest obligatory, and is it owed to non-inheriting relatives?", ur: "کیا وصیت فرض ہے، اور کیا غیر وارث رشتہ داروں کے لیے واجب ہے؟" }
question: { ar: "هل يجب على من ترك مالاً أن يوصي، وهل يجب عليه أن يوصي لقرابته الذين لا يرثون؟", en: "Must one who leaves property make a bequest, and must he make one for relatives who do not inherit?", ur: "کیا مال چھوڑنے والے پر وصیت کرنا واجب ہے، اور کیا اس پر اپنے غیر وارث رشتہ داروں کے لیے وصیت واجب ہے؟" }
issue: { ar: "حديث ابن عمر «ما حق امرئ مسلم له شيء يوصي فيه يبيت ليلتين إلا ووصيته عنده مكتوبة» ورواية «يريد أن يوصي فيه»، وآية الوصية للوالدين والأقربين في البقرة 180 وما نُسخ منها، كما يعرضها ابن حزم.", en: "Ibn 'Umar's report 'it is not right for a Muslim who has something to bequeath to spend two nights without his will written down with him' and the version 'something he wishes to bequeath', and the verse on bequests to parents and relatives in al-Baqara 180 and what was abrogated of it, as Ibn Hazm sets them out.", ur: "ابن عمر کی حدیث «کسی مسلمان کے لیے جس کے پاس وصیت کے لائق کچھ ہو، یہ درست نہیں کہ دو راتیں گزارے مگر اس کی وصیت اس کے پاس لکھی ہو» اور روایت «جس میں وہ وصیت کرنا چاہے»، اور سورۂ بقرہ 180 میں والدین اور رشتہ داروں کے لیے وصیت کی آیت اور اس کا منسوخ حصہ، جیسا کہ ابن حزم انہیں پیش کرتے ہیں۔" }
summary:
  ar: "يحكي ابن حزم في «المحلى» أن أبا حنيفة ومالكاً والشافعي والنخعي لا يرون الوصية فرضاً، ولا يوجبونها للقرابة غير الوارثين، وهو قول الزهري وسالم وسليمان بن يسار وعمرو بن دينار وابن سيرين والأوزاعي والثوري؛ ويرى هو مع داود وأصحابه أن الوصية فرض على كل من ترك مالاً، وأنه يجب عليه أن يوصي لقرابته الذين لا يرثون، وأن من مات ولم يوص وجب أن يُتصدق عنه بما تيسر {cite:muhalla-dar-ibn-hazm-2016-v12 p.7} {cite:muhalla-dar-ibn-hazm-2016-v12 p.8} {cite:muhalla-dar-ibn-hazm-2016-v12 p.13} {cite:muhalla-dar-ibn-hazm-2016-v12 p.16}."
  en: "Ibn Hazm reports in al-Muhalla that Abu Hanifa, Malik, al-Shafi'i and al-Nakha'i do not hold a bequest obligatory nor require one for non-inheriting relatives, the view also of al-Zuhri, Salim, Sulayman ibn Yasar, 'Amr ibn Dinar, Ibn Sirin, al-Awza'i and al-Thawri; he holds, with Dawud and his school, that a bequest is obligatory on everyone who leaves property, that he must bequeath to relatives who do not inherit, and that if someone dies without a bequest something must be given in charity on his behalf {cite:muhalla-dar-ibn-hazm-2016-v12 p.7} {cite:muhalla-dar-ibn-hazm-2016-v12 p.8} {cite:muhalla-dar-ibn-hazm-2016-v12 p.13} {cite:muhalla-dar-ibn-hazm-2016-v12 p.16}."
  ur: "ابن حزم «المحلی» میں نقل کرتے ہیں کہ ابو حنیفہ، مالک، شافعی اور نخعی وصیت کو فرض نہیں سمجھتے، نہ غیر وارث رشتہ داروں کے لیے اسے واجب کرتے ہیں، اور یہی زہری، سالم، سلیمان بن یسار، عمرو بن دینار، ابن سیرین، اوزاعی اور ثوری کا قول ہے؛ وہ خود داؤد اور ان کے اصحاب کے ساتھ کہتے ہیں کہ مال چھوڑنے والے ہر شخص پر وصیت فرض ہے، اس پر اپنے غیر وارث رشتہ داروں کے لیے وصیت لازم ہے، اور جو وصیت کیے بغیر مرے اس کی طرف سے کچھ صدقہ کرنا واجب ہے {cite:muhalla-dar-ibn-hazm-2016-v12 p.7} {cite:muhalla-dar-ibn-hazm-2016-v12 p.8} {cite:muhalla-dar-ibn-hazm-2016-v12 p.13} {cite:muhalla-dar-ibn-hazm-2016-v12 p.16}۔"
short_answer:
  ar: "أبو حنيفة ومالك والشافعي ⁦(كما يحكيهم ابن حزم)⁩: الوصية ليست فرضاً، وله أن يوصي لغير قرابته؛ ابن حزم وداود: فرض على كل من ترك مالاً، وتجب للقرابة غير الوارثين."
  en: "Abu Hanifa, Malik and al-Shafi'i (as Ibn Hazm reports them): a bequest is not obligatory, and one may bequeath to non-relatives; Ibn Hazm and Dawud: it is obligatory for everyone who leaves property, and is owed to non-inheriting relatives."
  ur: "ابو حنیفہ، مالک اور شافعی ⁦(ابن حزم کی نقل کے مطابق)⁩: وصیت فرض نہیں، اور غیر رشتہ داروں کے لیے بھی کر سکتا ہے؛ ابن حزم اور داؤد: مال چھوڑنے والے ہر شخص پر فرض ہے، اور غیر وارث رشتہ داروں کے لیے واجب ہے۔"
