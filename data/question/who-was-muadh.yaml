id: question/who-was-muadh
class: question
label:
  ar: من كان معاذ بن جبل؟
  en: Who was Muadh ibn Jabal?
summary:
  ar: معاذ بن جبل أعلم الأمة بالحلال والحرام؛ بعثه النبي قاضيًا ومعلمًا إلى اليمن؛ مات شابًا في طاعون
    عمواس 639 وقد أجمع علماء زمانه على فقهه.
  en: "Muadh ibn Jabal, the most learned of the community in what is lawful and unlawful; the Prophet sent him as a judge and teacher to Yemen. He died young in the plague of Amwas in 639, and the scholars of his time agreed on his jurisprudence."
question:
  ar: من كان معاذ بن جبل؟
short_answer:
  ar: معاذ بن جبل أعلم الأمة بالحلال والحرام؛ بعثه النبي قاضيًا ومعلمًا إلى اليمن؛ مات شابًا في طاعون
    عمواس 639 وقد أجمع علماء زمانه على فقهه.
long_answer:
  ar: '[[person/muadh-ibn-jabal|معاذ]] الأنصاري الخزرجي؛ أسلم ليلة العقبة الثانية؛ بعثه النبي لليمن فقال
    له كيف تحكم فأجاب بالكتاب ثم السنة ثم الاجتهاد فضرب على صدره وقال الحمد لله الذي وفق رسول رسول الله؛
    مات في عمواس وعمره ثمانية وثلاثون. {cite:wikidata}'
