id: question/financial-penalties-tazir-bil-mal
class: question
label:
  ar: هل يجوز التعزير بأخذ المال أو إتلافه؟
  en: May a discretionary penalty take or destroy property?
  ur: کیا تعزیر میں مال لینا یا تلف کرنا جائز ہے؟
summary:
  ar: 'مسألة يعقد لها ابن تيمية فصلاً في «الحسبة في الإسلام»: يقرر أن التعزير بالعقوبات المالية مشروع في مواضع مخصوصة في مذهب مالك في المشهور عنه، ومذهب أحمد، والشافعي في قول، ويسوق شواهده من السنة وفعل الخلفاء، ويرد على من أطلق القول بنسخها؛ ويقسم العقوبة المالية إلى إتلاف وتغيير وتمليك، ويحكي في المغشوش من الطعام قول من أجاز التصدق به وكره إتلافه {cite:hisba-ibn-taymiyya-ilmiyya p. 49} {cite:hisba-ibn-taymiyya-ilmiyya p. 50} {cite:hisba-ibn-taymiyya-ilmiyya p. 51} {cite:hisba-ibn-taymiyya-ilmiyya p. 52}.'
  en: 'A question to which Ibn Taymiyya devotes a section of al-Hisba fi al-Islam: he holds that discretionary punishment by financial penalties is lawful in specific cases in the well-known view of Malik, in Ahmad''s school and in one view of al-Shafi''i, cites precedents from the sunna and the caliphs, and rejects those who declared them abrogated without qualification; he divides financial penalties into destruction, alteration and transfer, and on adulterated food reports those who allowed giving it in charity and disliked destroying it.'
  ur: 'ایک مسئلہ جس کے لیے ابن تیمیہ «الحسبۃ فی الاسلام» میں ایک فصل باندھتے ہیں: وہ بیان کرتے ہیں کہ مالی سزاؤں سے تعزیر مخصوص مواقع پر مالک کے مشہور قول، احمد کے مذہب اور شافعی کے ایک قول میں مشروع ہے، سنت اور خلفا کے عمل سے نظائر لاتے ہیں، اور مطلقاً منسوخ کہنے والوں کو رد کرتے ہیں؛ وہ مالی سزا کو اتلاف، تغییر اور تملیک میں تقسیم کرتے ہیں، اور ملاوٹ والے کھانے کے بارے میں ان کا قول نقل کرتے ہیں جنہوں نے اسے صدقہ کرنا جائز اور تلف کرنا مکروہ کہا۔'
