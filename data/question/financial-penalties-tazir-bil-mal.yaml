  stance:
    ar: 'في المغشوش من الطعام: التصدق به أولى من إتلافه'
    en: 'On adulterated food: giving it in charity is better than destroying it'
    ur: 'ملاوٹ والے کھانے میں: اسے صدقہ کرنا تلف کرنے سے بہتر ہے'
  summary:
    ar: يحكي ابن تيمية أن طائفة من العلماء أفتت بأن الطعام المغشوش يُتصدق به على الفقراء، وأن طائفة جوزت التصدق به وكرهت إتلافه، ويرى أن عمر إنما أتلف اللبن لأن الفقراء في المدينة كانوا في زمنه قليلين أو معدومين.
    en: Ibn Taymiyya reports that some scholars ruled that adulterated food be given to the poor, and some allowed giving it in charity and disliked destroying it; he explains that Umar destroyed the milk because in his time the poor in Medina were few or none.
    ur: ابن تیمیہ نقل کرتے ہیں کہ علما کی ایک جماعت نے فتویٰ دیا کہ ملاوٹ والا کھانا فقرا کو صدقہ کیا جائے، اور ایک جماعت نے صدقہ جائز اور تلف کرنا مکروہ کہا؛ وہ وضاحت کرتے ہیں کہ عمر نے دودھ اس لیے بہایا کہ ان کے زمانے میں مدینہ میں فقرا کم یا نہ ہونے کے برابر تھے۔
