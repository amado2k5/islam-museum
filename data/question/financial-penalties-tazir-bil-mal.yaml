question:
  ar: هل للحاكم أو المحتسب أن يعاقب بإتلاف المال أو أخذه؟
  en: May the ruler or market inspector punish by destroying or taking property?
  ur: کیا حاکم یا محتسب مال تلف کر کے یا لے کر سزا دے سکتا ہے؟
issue:
  ar: مشروعية العقوبات المالية في التعزير، وهل هي منسوخة.
  en: Whether financial penalties are lawful as discretionary punishment, and whether they are abrogated.
  ur: تعزیر میں مالی سزاؤں کی مشروعیت، اور کیا وہ منسوخ ہیں۔
short_answer:
  ar: يرى ابن تيمية أنها مشروعة في مواضع مخصوصة، محكمة غير منسوخة، وينسب ذلك إلى المشهور عن مالك ومذهب أحمد وقول للشافعي، ويرد على مدعي النسخ.
  en: Ibn Taymiyya holds them lawful in specific cases and unabrogated, ascribing this to the well-known view of Malik, Ahmad's school and one view of al-Shafi'i, and rejects the claim of abrogation.
  ur: ابن تیمیہ کے نزدیک یہ مخصوص مواقع پر مشروع اور غیر منسوخ ہیں؛ وہ اسے مالک کے مشہور قول، احمد کے مذہب اور شافعی کے ایک قول کی طرف منسوب کرتے ہیں، اور نسخ کے دعوے کو رد کرتے ہیں۔
perspectives:
- tradition: sunni
  id: sunni-mashrua
  standing: main
  stance:
    ar: العقوبات المالية مشروعة في مواضع مخصوصة وغير منسوخة
    en: Financial penalties are lawful in specific cases and not abrogated
    ur: مالی سزائیں مخصوص مواقع پر مشروع اور غیر منسوخ ہیں
  summary:
    ar: 'قول ابن تيمية، وينسبه إلى مذهب مالك في المشهور عنه ومذهب أحمد والشافعي في قول؛ ومن شواهده عنده: إباحة سلب من يصطاد في حرم المدينة، وكسر دنان الخمر، وأمر ابن عمر بحرق الثوبين المعصفرين، وكسر قدور لحوم الحمر يوم خيبر ثم الإذن بالإراقة، وهدم مسجد الضرار، وتضعيف الغرم على سارق ما ليس في حرز، وأخذ شطر مال مانع الزكاة، وتحريق عثمان المصاحف المخالفة، وتحريق عمر حانوت الخمر وقصر سعد، وإراقته اللبن المشوب بالماء للبيع.'
    en: Ibn Taymiyya's view, which he ascribes to the well-known position of Malik, Ahmad's school and one view of al-Shafi'i; his precedents include permitting the seizure of the gear of one who hunts in the Medina sanctuary, breaking wine jars, ordering Ibn Umar to burn two saffron-dyed garments, breaking the pots of donkey meat at Khaybar and then allowing them to be emptied instead, demolishing the Mosque of Dirar, doubling the fine on one who steals what is not secured, taking half the wealth of one who withholds zakat, Uthman burning the dissenting copies of the Qur'an, and Umar burning a wine shop and Sa'd's palace and pouring away milk watered for sale.
    ur: 'ابن تیمیہ کا قول، جسے وہ مالک کے مشہور مذہب، احمد کے مذہب اور شافعی کے ایک قول کی طرف منسوب کرتے ہیں؛ ان کے نظائر میں: حرمِ مدینہ میں شکار کرنے والے کا سامان لینے کی اجازت، شراب کے مٹکے توڑنا، ابن عمر کو دو زعفرانی کپڑے جلانے کا حکم، خیبر میں گدھے کے گوشت کی ہانڈیاں توڑنے کا حکم پھر انڈیلنے کی اجازت، مسجدِ ضرار کو گرانا، غیر محفوظ مال کے چور پر تاوان دگنا کرنا، زکاۃ نہ دینے والے کا آدھا مال لینا، عثمان کا مخالف مصاحف جلانا، اور عمر کا شراب کی دکان اور سعد کا محل جلانا اور فروخت کے لیے پانی ملا دودھ بہا دینا۔'
