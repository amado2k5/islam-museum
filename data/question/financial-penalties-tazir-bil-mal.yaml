  stance:
    ar: العقوبات المالية منسوخة (كما يحكيه ابن تيمية عن مخالفيه)
    en: Financial penalties are abrogated (as Ibn Taymiyya reports of his opponents)
    ur: مالی سزائیں منسوخ ہیں (جیسا کہ ابن تیمیہ اپنے مخالفین سے نقل کرتے ہیں)
  summary:
    ar: يحكي ابن تيمية أن من الناس من قال إن العقوبات المالية منسوخة وأطلق ذلك عن أصحاب مالك وأحمد، ويرى أنه غلط على مذهبهما، وأن مدعي النسخ ليس معهم حجة من كتاب ولا سنة إلا دعوى الإجماع على ترك العمل. ولم تُذكر هنا حجج هذا القول من كتب أصحابه.
    en: Ibn Taymiyya reports that some said financial penalties are abrogated and attributed this without qualification to the followers of Malik and Ahmad; he holds this a misrepresentation of their schools and says those claiming abrogation have no proof from Book or sunna beyond a claimed consensus on abandoning the practice. The arguments for this view from its own holders' books are not given here.
    ur: ابن تیمیہ نقل کرتے ہیں کہ بعض نے کہا کہ مالی سزائیں منسوخ ہیں اور اسے مطلقاً مالک اور احمد کے اصحاب کی طرف منسوب کیا؛ ان کے نزدیک یہ ان کے مذہب پر غلطی ہے، اور نسخ کے دعوے داروں کے پاس کتاب و سنت سے کوئی دلیل نہیں سوائے ترکِ عمل پر اجماع کے دعوے کے۔ اس قول کے دلائل اس کے قائلین کی کتب سے یہاں نہیں دیے گئے۔
