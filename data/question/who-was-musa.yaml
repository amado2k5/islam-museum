id: question/who-was-musa
class: question
label:
  ar: من كان موسى؟
  en: Who was Musa?
  es: "¿Quién era Musa?"
  fr: "Qui était Moussa ?"
  ur: "موسیٰ کون تھے؟"
summary:
  ar: موسى بن عمران كليم الله؛ أعظم أنبياء بني إسرائيل وصاحب التوراة والمعجزات التسع ونجاة بني إسرائيل
    من فرعون.
  en: "Musa son of Imran, Kalim Allah; the greatest of the prophets of the Children of Israel, bearer of the Torah and the nine miracles, and the one through whom the Children of Israel were delivered from Pharaoh."
  es: "Musa, hijo de Imran, Kalim Allah; el más grande de los profetas de los Hijos de Israel, portador de la Torá y de los nueve milagros, y aquel por medio del cual los Hijos de Israel fueron liberados del Faraón."
  fr: "Moïse, fils d'Imran, Kalim Allah; le plus grand des prophètes des Enfants d'Israël, porteur de la Torah et des neuf miracles, et celui par qui les Enfants d'Israël furent délivrés de Pharaon."
  ur: "موسیٰ بن عمران، کلیم اللہ؛ بنی اسرائیل کے انبیاء میں سب سے بڑے، تورات کے علمبردار اور نو معجزات، اور وہ جس کے ذریعے بنی اسرائیل کو فرعون سے نجات ملی۔"
question:
  ar: من كان موسى؟
short_answer:
  ar: موسى بن عمران كليم الله؛ أعظم أنبياء بني إسرائيل وصاحب التوراة والمعجزات التسع ونجاة بني إسرائيل
    من فرعون.
long_answer:
  ar: '[[person/musa|موسى]] نبي الله وكليمه؛ أرسله إلى فرعون فأيده بالآيات التسع ونجى به بني إسرائيل وشق
    له البحر؛ أوحى إليه التوراة وقصصه أوسع قصص الأنبياء في القرآن. {cite:wikidata}'
