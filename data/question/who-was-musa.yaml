  en: Who was Musa?
  es: "¿Quién era Musa?"
summary:
  ar: موسى بن عمران كليم الله؛ أعظم أنبياء بني إسرائيل وصاحب التوراة والمعجزات التسع ونجاة بني إسرائيل
    من فرعون.
  en: "Musa son of Imran, Kalim Allah; the greatest of the prophets of the Children of Israel, bearer of the Torah and the nine miracles, and the one through whom the Children of Israel were delivered from Pharaoh."
