label:
  ar: ما قونية؟
  en: What is Konya?
  es: "¿Qué es Konya?"
  fr: "Qu'est-ce que Konya ?"
  ur: "کونیا کیا ہے؟"
summary:
  ar: قونية مدينة تركية؛ عاصمة سلاجقة الروم ثم دار جلال الدين الرومي ومدفنه ومركز الطريقة المولوية ودروانها.
  en: "Konya is a Turkish city. It was the capital of the Seljuks of Rum, then the home and burial place of Jalal al-Din Rumi, and the centre of the Mevlevi order and its whirling ritual (devran)."
  es: "Konya es una ciudad turca. Fue la capital de los selyúcidas de Rum, luego el hogar y lugar de sepultura de Jalal al-Din Rumi, y el centro de la orden mevleví y su ritual giratorio (devran)."
  fr: "Konya est une ville turque. Elle fut la capitale des Seldjoukides de Roum, puis la demeure et le lieu de sépulture de Jalal al-Din Rumi, et le centre de l'ordre Mevlevi et de son rituel de danse des derviches tourneurs (devran)."
  ur: "قونیہ ترکی کا ایک شہر ہے۔ یہ روم کے سلجوقوں کا دارالحکومت تھا، پھر جلال الدین رومی کا گھر اور تدفین کی جگہ، اور میلوی حکم اور اس کی گھومنے والی رسم ⁦(دیوران)⁩ کا مرکز تھا۔"
