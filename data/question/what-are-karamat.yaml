id: question/what-are-karamat
class: question
label:
  ar: ما كرامات الأولياء؟
  en: What are the karamat of the saints?
  es: "¿Cuáles son los karamat de los santos?"
  fr: "Quels sont les karamat des saints ?"
  ur: "اولیاء کرام کی کرامتیں کیا ہیں؟"
summary:
  ar: الكرامة أمر خارق يجريه الله على يد وليّ صالح؛ أثبتها أهل السنة خلافًا للمعتزلة وميزها الفقهاء عن
    المعجزة والسحر.
  en: "A karama is an extraordinary event that God brings about through a righteous friend of God (wali). Ahl al-Sunna affirmed it, in disagreement with the Mu'tazila, and jurists distinguished it from the miracle (mu'jiza) and from sorcery (sihr)."
  es: "Un karama es un acontecimiento extraordinario que Dios realiza a través de un amigo justo de Dios (wali). Los sunitas lo afirmaron, en desacuerdo con los mu'tazilíes, y los juristas lo distinguieron del milagro (mu'jiza) y de la hechicería (sihr)."
  fr: "Un karama est un événement extraordinaire que Dieu suscite par l'intermédiaire d'un pieux ami de Dieu (wali). Les sunnites l'ont affirmé, contrairement aux mu'tazilites, et les juristes l'ont distingué du miracle (mu'jiza) et de la sorcellerie (sihr)."
  ur: "ایک کرامت ایک غیر معمولی واقعہ ہے جو خدا خدا کے ایک صالح دوست ⁦(ولی)⁩ کے ذریعے لاتا ہے۔ اہل سنت نے معتزلہ سے اختلاف کرتے ہوئے اس کی تصدیق کی ہے اور فقہاء نے اسے معجزہ ⁦(مجیزہ)⁩ اور سحر ⁦(سحر)⁩ سے ممتاز کیا ہے۔"
question:
  ar: ما كرامات الأولياء؟
short_answer:
  ar: الكرامة أمر خارق يجريه الله على يد وليّ صالح؛ أثبتها أهل السنة خلافًا للمعتزلة وميزها الفقهاء عن
    المعجزة والسحر.
long_answer:
  ar: '[[concept/karamat-al-awliya|كرامة الولي]] خارق عادة يظهر على يد عبد صالح بغير تحدٍّ؛ أثبتها أهل
    السنة بالنقل والآثار وردّوا على منكريها؛ الولي عندهم كل مؤمن تقي لا يشترط فيه إظهار الكرامة. {cite:wikidata}'
