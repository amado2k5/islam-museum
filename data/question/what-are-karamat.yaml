long_answer:
  ar: '[[concept/karamat-al-awliya|كرامة الولي]] خارق عادة يظهر على يد عبد صالح بغير تحدٍّ؛ أثبتها أهل
    السنة بالنقل والآثار وردّوا على منكريها؛ الولي عندهم كل مؤمن تقي لا يشترط فيه إظهار الكرامة. {cite:wikidata}'
