id: question/what-was-fath-constantinople
class: question
label:
  ar: ما فتح القسطنطينية 1453؟
  en: What was the conquest of Constantinople in 1453?
  es: "¿Qué fue la conquista de Constantinopla en 1453?"
  fr: "Qu'est-ce que la conquête de Constantinople en 1453 ?"
  ur: "1453 میں قسطنطنیہ کی فتح کیا تھی؟"
summary:
  ar: فتح محمد الثاني القسطنطينية 1453 بعد حصار 53 يومًا؛ أنهى الإمبراطورية البيزنطية وحقق بشارة النبي
    وبدأ العصر العثماني.
  en: "The conquest of Constantinople by Mehmed II in 1453, after a siege of 53 days; it ended the Byzantine Empire, fulfilled the Prophet's glad tidings, and began the Ottoman era."
  es: "La conquista de Constantinopla por Mehmed II en 1453, tras un asedio de 53 días, puso fin al Imperio Bizantino, cumplió la buena nueva del Profeta y dio comienzo a la era otomana."
  fr: "La conquête de Constantinople par Mehmed II en 1453, après un siège de 53 jours, mit fin à l'Empire byzantin, accomplit la bonne nouvelle du Prophète et marqua le début de l'ère ottomane."
  ur: "53 دن کے محاصرے کے بعد 1453 میں محمود دوم کی طرف سے قسطنطنیہ کی فتح؛ اس نے بازنطینی سلطنت کا خاتمہ کیا، پیغمبر کی بشارت کو پورا کیا، اور عثمانی دور کا آغاز ہوا۔"
question:
  ar: ما فتح القسطنطينية 1453؟
short_answer:
  ar: فتح محمد الثاني القسطنطينية 1453 بعد حصار 53 يومًا؛ أنهى الإمبراطورية البيزنطية وحقق بشارة النبي
    وبدأ العصر العثماني.
long_answer:
  ar: '[[event/conquest-constantinople-857|فتح القسطنطينية]] تحقيق بشارة نبوية بعد ثمانية قرون من المحاولات؛
    حاصرها محمد الفاتح 1453 بالمدافع العظمى ونقل سفنه برًا إلى القرن الذهبي؛ دخلها 29 مايو فعمّرها عاصمة
    الإسلام. {cite:wikidata}'
