long_answer:
  ar: '[[person/shajar-al-durr|شجر الدر]] جارية أرمنية تزوجها الصالح أيوب؛ بعد موته أخفت وفاته حتى وصول
    جيش عين جالوت ثم قتلت توران شاه فبويعت سلطانة مصر 1250 في أول حكم امرأة في التاريخ الإسلامي بعد دلهي؛
    تنازلت فتزوجت عز الدين أيبك، وقتلت مقتولة. {cite:wikidata}'
