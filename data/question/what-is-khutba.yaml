id: question/what-is-khutba
class: question
label:
  ar: "ما الخطبة؟"
  en: What is the khutba?
  es: "¿Qué es la jutba?"
  fr: "Qu'est-ce que la khutba ?"
  ur: "خطبہ کیا ہے؟"
summary:
  ar: "الخطبة موعظة تقال قبل صلاة الجمعة وفي العيدين، وتتضمن حمد الله ووعظ المسلمين ودعاءهم."
  en: "The khutba is an address given before the Friday prayer and on the two Eid prayers. It includes praise of God, admonition of the Muslims, and supplication for them."
  es: "La jutba es un sermón que se pronuncia antes de la oración del viernes y en las dos oraciones del Eid. Incluye alabanzas a Dios, exhortaciones a los musulmanes y súplicas por ellos."
  fr: "La khutba est un sermon prononcé avant la prière du vendredi et lors des deux prières de l'Aïd. Elle comprend des louanges à Dieu, des exhortations aux musulmans et des supplications pour eux."
  ur: "خطبہ جمعہ کی نماز سے پہلے اور عیدین کی دو نمازوں پر دیا جانے والا خطاب ہے۔ اس میں خدا کی حمد، مسلمانوں کی نصیحت اور ان کے لیے دعا شامل ہے۔"
wings: []
question:
  ar: "ما الخطبة؟"
short_answer:
  ar: "الخطبة موعظة تقال قبل صلاة الجمعة وفي العيدين، وتتضمن حمد الله ووعظ المسلمين ودعاءهم."
long_answer:
  ar: |
    الخطبة شرط في صحة صلاة الجمعة عند جمهور الفقهاء، ويرتبط بها نص سورة الجمعة {cite:tanzil-quran}.
    ويعرض مدخل [[practice/khutba|الخطبة]] موضعها وصورتها، وترتبط ب[[practice/adhan|الأذان]] وب[[practice/salah|الصلاة]].

