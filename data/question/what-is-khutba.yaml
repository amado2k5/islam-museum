label:
  ar: "ما الخطبة؟"
  en: What is the khutba?
summary:
  ar: "الخطبة موعظة تقال قبل صلاة الجمعة وفي العيدين، وتتضمن حمد الله ووعظ المسلمين ودعاءهم."
  en: "The khutba is an address given before the Friday prayer and on the two Eid prayers. It includes praise of God, admonition of the Muslims, and supplication for them."
