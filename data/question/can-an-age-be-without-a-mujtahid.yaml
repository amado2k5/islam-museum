id: question/can-an-age-be-without-a-mujtahid
class: question
label: { ar: "هل يجوز خلو العصر من مجتهد؟", en: "Can an age be without an independent reasoner (mujtahid)?", ur: "کیا کوئی زمانہ مجتہد سے خالی ہو سکتا ہے؟" }
summary:
  ar: "مسألة أصولية يعرضها الشوكاني في «إرشاد الفحول»: هل يجوز أن يخلو زمان من مجتهد قائم بحجج الله؟ يحكي عن الحنابلة وأبي إسحاق والزبيري المنع، ويختاره ابن دقيق العيد إلى أشراط الساعة، ويحكي الزركشي عن الأكثرين الجواز، وبه جزم صاحب «المحصول»، وقال الغزالي إن العصر خلا من المجتهد المستقل؛ ويرد الشوكاني على القائلين بالخلو ويرى الاجتهاد أيسر على المتأخرين. {cite:irshad-al-fuhul-dar-al-fikr p.255} {cite:irshad-al-fuhul-dar-al-fikr p.256}"
  en: "A question of legal theory set out by al-Shawkani in Irshad al-Fuhul: may a time be empty of any independent reasoner upholding God's proofs? He reports that the Hanbalis, Abu Ishaq and al-Zubayri denied it, and that Ibn Daqiq al-Id chose that view up to the great signs of the Hour; al-Zarkashi reports that most allowed it, the author of al-Mahsul affirmed it, and al-Ghazali said the age had become empty of the independent mujtahid. Al-Shawkani answers those who held the age empty and argues that ijtihad is easier for later scholars."
  ur: "اصولِ فقہ کا ایک مسئلہ جسے شوکانی «ارشاد الفحول» میں بیان کرتے ہیں: کیا کوئی زمانہ اللہ کی حجتوں کو قائم کرنے والے مجتہد سے خالی ہو سکتا ہے؟ وہ حنابلہ، ابو اسحاق اور زبیری سے عدمِ جواز نقل کرتے ہیں، اور ابن دقیق العید نے قیامت کی بڑی نشانیوں تک یہی قول اختیار کیا؛ زرکشی اکثر سے جواز نقل کرتے ہیں، «المحصول» کے مصنف نے یہی قطعی کہا، اور غزالی نے کہا کہ زمانہ مجتہدِ مستقل سے خالی ہو گیا۔ شوکانی خلو کے قائلین کا رد کرتے ہیں اور اجتہاد کو متأخرین کے لیے آسان سمجھتے ہیں۔"
question: { ar: "هل يجوز أن يخلو زمان من مجتهد؟", en: "Can an age be without an independent reasoner?" }
issue: { ar: "هل يلزم أن يوجد في كل عصر مجتهد يقوم بفرض الاجتهاد، أم يجوز أن يخلو العصر منه فيكتفي الناس بالنقل عن الأئمة السابقين؟" }
short_answer:
  ar: "قولان يحكيهما الشوكاني: المنع (الحنابلة وأبو إسحاق والزبيري، واختاره ابن دقيق العيد)، والجواز (الأكثرون فيما يحكيه الزركشي، وصاحب المحصول، والغزالي والقفال والرافعي في وقوع الخلو)؛ ويرى الشوكاني أن القول بالخلو لا يصح."
  en: "Two views reported by al-Shawkani: it cannot (the Hanbalis, Abu Ishaq and al-Zubayri, chosen by Ibn Daqiq al-Id), and it can (most, as al-Zarkashi reports, the author of al-Mahsul, and al-Ghazali, al-Qaffal and al-Rafi'i on its having happened); al-Shawkani holds the claim of an empty age to be unfounded."
