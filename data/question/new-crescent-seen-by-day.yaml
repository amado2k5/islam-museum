id: question/new-crescent-seen-by-day
class: question
label:
  ar: 'إذا رُئي الهلال نهاراً: أهو لليلة الماضية أم المقبلة؟'
  en: When the new crescent is seen by day, does it belong to the past night or the coming one?
  ur: دن میں ہلال نظر آئے تو کیا وہ گزشتہ رات کا ہے یا آنے والی کا؟
summary:
  ar: 'مسألة في الصيام يحكيها ابن رشد: اتفقوا على أن الهلال إذا رُئي بالعشي فالشهر من اليوم التالي، واختلفوا إذا رُئي أول ما رُئي في سائر النهار؛ فالجمهور، مالك والشافعي وأبو حنيفة، على أنه لليوم المستقبل، وقال أبو يوسف والثوري وابن حبيب: إن رُئي قبل الزوال فهو لليلة الماضية. ويرد ابن رشد الخلاف إلى ترك اعتبار التجربة فيما سبيله التجربة والرجوع إلى أثرين مرويين عن عمر، ويقرر أن القياس والتجربة يقتضيان ألا يُرى القمر قبل مغيب الشمس، ولا فرق بين ما قبل الزوال وما بعده {cite:bidaya-bakri-bayt-al-afkar p. 326} {cite:bidaya-bakri-bayt-al-afkar p. 327}.'
  en: 'A question on fasting reported by Ibn Rushd: all agree that a crescent seen in the evening makes the month begin the next day; they differ when it is first seen at other times of the day. The majority - Malik, al-Shafi''i and Abu Hanifa - hold it belongs to the coming day; Abu Yusuf, al-Thawri and Ibn Habib say that if seen before noon it belongs to the past night. Ibn Rushd traces the disagreement to neglecting experience in a matter whose path is experience, and to two reports from Umar; he states that reasoning and experience show the moon is not seen before sunset, with no difference between before and after noon.'
  ur: 'روزے کا ایک مسئلہ جسے ابن رشد بیان کرتے ہیں: سب کا اتفاق ہے کہ شام کو ہلال دیکھا جائے تو مہینہ اگلے دن سے ہے؛ اختلاف اس میں ہے کہ دن کے کسی اور وقت پہلی بار دیکھا جائے۔ جمہور — مالک، شافعی اور ابو حنیفہ — کے نزدیک یہ آنے والے دن کا ہے؛ ابو یوسف، ثوری اور ابن حبیب کہتے ہیں کہ زوال سے پہلے دیکھا جائے تو گزشتہ رات کا ہے۔ ابن رشد اختلاف کو اس بات کی طرف لوٹاتے ہیں کہ جس معاملے کا راستہ تجربہ ہے اس میں تجربے کو چھوڑ دیا گیا، اور عمر سے مروی دو آثار؛ اور کہتے ہیں کہ قیاس اور تجربہ بتاتے ہیں کہ سورج غروب ہونے سے پہلے چاند نظر نہیں آتا، اور زوال سے پہلے اور بعد میں کوئی فرق نہیں۔'
