  id: ibn-rushd-tajriba
  standing: secondary
  stance:
    ar: 'ابن رشد: المعتبر التجربة ومغيب الشمس، لا الزوال'
    en: 'Ibn Rushd: what counts is experience and sunset, not noon'
    ur: 'ابن رشد: معتبر تجربہ اور غروبِ آفتاب ہے، زوال نہیں'
  summary:
    ar: يقول ابن رشد إن الذي يقتضيه القياس والتجربة أن القمر لا يُرى والشمس لم تغب إلا وهو بعيد منها، لأنه يكون حينئذ أكبر من قوس الرؤية، ويستبعد أن يبلغ من الكبر أن يُرى والشمس لم تغب، فلا فرق بين ما قبل الزوال وما بعده، وإنما المعتبر مغيب الشمس.
    en: Ibn Rushd says reasoning and experience show that the moon is not seen while the sun has not set unless it is far from it, being then beyond the arc of visibility, and he thinks it unlikely to grow large enough to be seen before sunset; so there is no difference between before and after noon, and what counts is sunset.
    ur: ابن رشد کہتے ہیں کہ قیاس اور تجربے کا تقاضا یہ ہے کہ سورج غروب نہ ہوا ہو تو چاند نظر نہیں آتا مگر جب وہ اس سے دور ہو، کیونکہ تب وہ قوسِ رؤیت سے بڑا ہوتا ہے؛ اور وہ اسے بعید سمجھتے ہیں کہ وہ اتنا بڑا ہو کہ غروب سے پہلے نظر آئے؛ لہٰذا زوال سے پہلے اور بعد میں فرق نہیں، اصل اعتبار غروبِ آفتاب کا ہے۔
