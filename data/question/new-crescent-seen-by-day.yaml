  summary: { ar: "يرى ابن حزم أن الهلال إذا رئي قبل الزوال فهو من البارحة، فيصوم الناس بقية يومهم إن كان أول رمضان ويفطرون إن كان آخره، وإن رئي بعد الزوال فهو لليلة المقبلة؛ ويحتج بعموم «صوموا لرؤيته وأفطروا لرؤيته» بعد إخراج ما بعد الزوال بالإجماع، وبأن الهلال لا يرى قبل الزوال والشمس دونه إلا وقد أهل من البارحة، وبآثار عن عمر وعلي وسلمان بن ربيعة.", en: "Ibn Hazm holds that a crescent seen before noon belongs to the previous night, so people fast the rest of their day if it is the start of Ramadan and break the fast if it is the end, while one seen after noon belongs to the coming night; he argues from the general command 'fast when you see it and break the fast when you see it', after setting aside the after-noon case by consensus, from the point that the crescent cannot be seen before noon with the sun before it unless it rose the previous evening, and from reports from 'Umar, 'Ali and Salman ibn Rabi'a.", ur: "ابن حزم کے نزدیک چاند زوال سے پہلے دیکھا جائے تو گزشتہ رات کا ہے، چنانچہ رمضان کا آغاز ہو تو لوگ باقی دن روزہ رکھیں اور آخر ہو تو افطار کر لیں، اور زوال کے بعد دیکھا جائے تو آنے والی رات کا ہے؛ وہ «اسے دیکھ کر روزہ رکھو اور اسے دیکھ کر افطار کرو» کے عموم سے استدلال کرتے ہیں، جبکہ زوال کے بعد والی صورت اجماع سے خارج ہے، نیز اس سے کہ سورج کے سامنے ہوتے ہوئے زوال سے پہلے چاند اسی وقت دکھائی دیتا ہے جب وہ گزشتہ شام نکل چکا ہو، اور عمر، علی اور سلمان بن ربیعہ کے آثار سے۔" }
