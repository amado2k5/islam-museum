  stance:
    ar: قبل الزوال لليلة الماضية، وبعده للآتية
    en: Before noon it belongs to the past night, after noon to the coming one
    ur: زوال سے پہلے گزشتہ رات کا، بعد میں آنے والی کا
  summary:
    ar: 'قول أبي يوسف من أصحاب أبي حنيفة والثوري وابن حبيب من أصحاب مالك، ويستند إلى الأثر المفسَّر عن عمر الذي رواه الثوري: إذا رأيتم الهلال نهاراً قبل الزوال فأفطروا، وإذا رأيتموه بعد الزوال فلا تفطروا.'
    en: 'The view of Abu Yusuf among Abu Hanifa''s followers, al-Thawri, and Ibn Habib among Malik''s, resting on the specific report from Umar transmitted by al-Thawri: if you see the crescent by day before noon break the fast, and if after noon do not.'
    ur: 'ابو حنیفہ کے اصحاب میں ابو یوسف، ثوری، اور مالک کے اصحاب میں ابن حبیب کا قول، جو عمر کے اس مفسر اثر پر مبنی ہے جسے ثوری نے روایت کیا: دن میں زوال سے پہلے ہلال دیکھو تو افطار کرو، اور زوال کے بعد دیکھو تو نہیں۔'
