question:
  ar: هل تُبنى بداية الشهر أو نهايته على رؤية الهلال نهاراً قبل الزوال؟
  en: Can the start or end of the month be based on seeing the crescent by day before noon?
  ur: کیا زوال سے پہلے دن میں ہلال دیکھنے پر مہینے کا آغاز یا اختتام رکھا جا سکتا ہے؟
issue:
  ar: اعتبار وقت رؤية الهلال في النهار لدخول الشهر وخروجه.
  en: Whether the time of day at which the crescent is seen matters for the start and end of the month.
  ur: مہینے کے آغاز و اختتام کے لیے دن میں ہلال دیکھنے کے وقت کا اعتبار۔
short_answer:
  ar: 'الجمهور: هو لليوم المقبل مطلقاً؛ أبو يوسف والثوري وابن حبيب: قبل الزوال لليلة الماضية؛ وابن رشد يرجّح التجربة ولا يفرّق بين ما قبل الزوال وما بعده.'
  en: 'The majority: it belongs to the coming day in all cases; Abu Yusuf, al-Thawri and Ibn Habib: before noon it belongs to the past night; Ibn Rushd prefers experience and makes no distinction between before and after noon.'
  ur: 'جمہور: ہر حال میں آنے والے دن کا؛ ابو یوسف، ثوری اور ابن حبیب: زوال سے پہلے ہو تو گزشتہ رات کا؛ ابن رشد تجربے کو ترجیح دیتے ہیں اور زوال سے پہلے اور بعد میں فرق نہیں کرتے۔'
perspectives:
- tradition: sunni
  id: sunni-jumhur
  standing: main
  stance:
    ar: هو لليوم المقبل كحكم رؤيته بالعشي
    en: It belongs to the coming day, like a sighting in the evening
    ur: یہ آنے والے دن کا ہے، جیسے شام کی رؤیت
  summary:
    ar: 'مذهب مالك والشافعي وأبي حنيفة وجمهور أصحابهم، ويستند إلى الأثر العام عن عمر الذي رواه الأعمش عن أبي وائل: أتانا كتاب عمر ونحن بخانقين أن الأهلة بعضها أكبر من بعض، فإذا رأيتم الهلال نهاراً فلا تفطروا حتى يشهد رجلان أنهما رأياه بالأمس.'
    en: 'The view of Malik, al-Shafi''i, Abu Hanifa and most of their followers, resting on the general report from Umar transmitted by al-A''mash from Abu Wa''il: Umar''s letter reached us at Khaniqin that crescents differ in size, so if you see the crescent by day do not break the fast until two men testify they saw it the evening before.'
    ur: 'مالک، شافعی، ابو حنیفہ اور ان کے اکثر اصحاب کا مذہب، جو عمر کے اس عام اثر پر مبنی ہے جسے اعمش نے ابو وائل سے روایت کیا: ہم خانقین میں تھے کہ عمر کا خط آیا کہ ہلال بعض بعض سے بڑے ہوتے ہیں، تو دن میں ہلال دیکھو تو روزہ نہ توڑو جب تک دو آدمی گواہی نہ دیں کہ انہوں نے کل شام اسے دیکھا۔'
