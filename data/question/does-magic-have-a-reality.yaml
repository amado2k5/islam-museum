id: question/does-magic-have-a-reality
class: question
label: { ar: "هل للسحر حقيقة؟", en: "Does magic have a reality?", ur: "کیا جادو کی کوئی حقیقت ہے؟" }
summary:
  ar: "عقد اللالكائي في شرح أصول اعتقاد أهل السنة باباً «في أن السحر له حقيقة» استدل فيه بآيات السحر وبأن عمر وعثمان وجندباً وعائشة وحفصة أمروا بقتل الساحر، وروى حديث سحر النبي وحديث السبع الموبقات وكتاب عمر في قتل السحرة؛ ويحكي محققه أن جمهور العلماء على أن للسحر حقيقة وتأثيراً، وأن المعتزلة وغيرهم من أهل الكلام قالوا إنه تخييل لا حقيقة له."
  en: "In Sharh Usul I'tiqad Ahl al-Sunna al-Lalaka'i has a chapter 'that magic has a reality', arguing from the Qur'anic verses on magic and from Umar, Uthman, Jundab, Aisha and Hafsa ordering sorcerers to be killed, and transmitting the hadith of the Prophet being bewitched, the hadith of the seven destroying sins and Umar's letter ordering sorcerers killed. His editor reports that most scholars hold magic to be real and effective, while the Mu'tazila and other theologians held it to be illusion without reality."
  ur: "شرح اصول اعتقاد اہل السنہ میں لالکائی کا ایک باب «جادو کی حقیقت ہے» کے عنوان سے ہے، جس میں وہ جادو کی آیات سے، اور اس سے کہ عمر، عثمان، جندب، عائشہ اور حفصہ نے جادوگر کو قتل کرنے کا حکم دیا، استدلال کرتے ہیں، اور نبی پر جادو کی حدیث، سات ہلاکت خیز گناہوں کی حدیث اور جادوگروں کے قتل کے بارے میں عمر کا خط روایت کرتے ہیں۔ ان کے محقق بیان کرتے ہیں کہ جمہور علما کے نزدیک جادو حقیقی اور مؤثر ہے، جبکہ معتزلہ اور دوسرے متکلمین نے اسے بے حقیقت تخیل کہا۔"
question: { ar: "هل للسحر حقيقة وتأثير، أم هو تخييل؟", en: "Does magic have a reality and an effect, or is it illusion?", ur: "کیا جادو کی حقیقت اور اثر ہے، یا یہ محض تخیل ہے؟" }
issue:
  ar: "هل يؤثر السحر في الأبدان والقلوب فيمرض ويقتل ويفرق بين الزوجين، أم هو خداع للأعين؟ وما حكم الساحر؟"
  en: "Does magic act on bodies and hearts – causing illness, death and separation of spouses – or is it a deception of the eyes? And what is the ruling on the sorcerer?"
  ur: "کیا جادو جسموں اور دلوں پر اثر کرتا ہے – بیمار کرتا، مارتا اور میاں بیوی میں جدائی ڈالتا ہے – یا آنکھوں کا دھوکا ہے؟ اور جادوگر کا حکم کیا ہے؟"
short_answer:
  ar: "اللالكائي ومحققه ⁦(أهل السنة)⁩: للسحر حقيقة وتأثير، وهو محرم، والساحر يُقتل في آثار عن الصحابة. المعتزلة وغيرهم من أهل الكلام كما يحكيهم المحقق: السحر تخييل لا تأثير له."
  en: "Al-Lalaka'i and his editor (Sunni): magic is real and effective and forbidden, and in reports from Companions the sorcerer is put to death. The Mu'tazila and other theologians, as the editor reports them: magic is illusion with no effect."
  ur: "لالکائی اور ان کے محقق (اہلِ سنت): جادو حقیقی اور مؤثر اور حرام ہے، اور صحابہ کے آثار میں جادوگر کو قتل کیا جاتا ہے۔ معتزلہ اور دوسرے متکلمین، جیسا محقق بیان کرتے ہیں: جادو بے اثر تخیل ہے۔"
