    stance: { ar: "للسحر حقيقة، ويؤثر في القلوب والأبدان", en: "Magic has a reality and acts on hearts and bodies", ur: "جادو کی حقیقت ہے اور یہ دلوں اور جسموں پر اثر کرتا ہے" }
    summary: { ar: "يستدل اللالكائي بآيات تعليم الشياطين السحر وسحرة فرعون، وبأمر عمر وعثمان وجندب وعائشة وحفصة بقتل الساحر؛ ويضيف محققه أن الله أمر بالاستعاذة من النفاثات في العقد ولولا أن للسحر حقيقة لم يأمر بذلك، وينقل قول النووي إن الصحيح أن له حقيقة وبه قطع الجمهور.", en: "Al-Lalaka'i argues from the verses on the devils teaching magic and on Pharaoh's sorcerers, and from Umar, Uthman, Jundab, Aisha and Hafsa ordering sorcerers killed; his editor adds that God commanded seeking refuge from 'those who blow on knots', which He would not have done were magic unreal, and quotes al-Nawawi that the sound view, held firmly by the majority, is that it is real.", ur: "لالکائی شیاطین کے جادو سکھانے اور فرعون کے جادوگروں کی آیات سے، اور عمر، عثمان، جندب، عائشہ اور حفصہ کے جادوگر کے قتل کے حکم سے استدلال کرتے ہیں؛ ان کے محقق مزید کہتے ہیں کہ اللہ نے گرہوں میں پھونکنے والیوں سے پناہ مانگنے کا حکم دیا، اور اگر جادو کی حقیقت نہ ہوتی تو یہ حکم نہ دیتا، اور نووی کا قول نقل کرتے ہیں کہ صحیح یہ ہے کہ اس کی حقیقت ہے اور جمہور نے یہی قطعیت سے کہا۔" }
