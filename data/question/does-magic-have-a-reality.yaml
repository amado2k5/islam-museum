    summary: { ar: "في نقل محقق شرح أصول الاعتقاد: ذهب بعض المخالفين، وهو قول أهل الكلام من المعتزلة وغيرهم، إلى أن السحر خدع ومخاريق يخيل بها الساحر إلى المسحور الشيء بخلاف ما هو به، كمن يرى السراب فيظنه ماء، وأنه لا تأثير له في مرض ولا قتل ولا حل ولا عقد. والقول بحاجة إلى عرضه من كتب المعتزلة.", en: "As the editor of Sharh Usul al-I'tiqad reports: some opponents – the view of the Mu'tazili theologians and others – held that magic is tricks and deceptions by which the sorcerer makes a thing appear to the bewitched other than it is, as one who sees a mirage takes it for water, and that it has no effect in illness, killing, binding or loosing. The view needs to be set out from Mu'tazili books.", ur: "شرح اصول الاعتقاد کے محقق کی نقل میں: بعض مخالفین – معتزلہ اور دوسرے متکلمین کا قول – کہتے ہیں کہ جادو فریب اور شعبدے ہیں جن سے جادوگر مسحور کو چیز اس کی اصل کے خلاف دکھاتا ہے، جیسے سراب دیکھنے والا اسے پانی سمجھتا ہے، اور یہ کہ بیماری، قتل، باندھنے یا کھولنے میں اس کا کوئی اثر نہیں۔ اس قول کو معتزلہ کی کتابوں سے پیش کرنا باقی ہے۔" }
