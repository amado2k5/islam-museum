id: question/who-was-khadija
class: question
label:
  ar: من كانت خديجة؟
  en: Who was Khadija?
  es: "¿Quién era Khadija?"
  fr: "Qui était Khadija ?"
summary:
  ar: خديجة بنت خويلد أولى زوجات النبي وأول من آمن به؛ كانت تاجرة مكة العظيمة ووقفت معه خمس عشرة سنة حتى
    وفاتها قبل الهجرة.
  en: "Khadija bint Khuwaylid, the first of the Prophet's wives and the first to believe in him, was Mecca's great merchant; she stood by him for fifteen years until her death before the Hijra."
  es: "Khadija bint Khuwaylid, la primera de las esposas del Profeta y la primera en creer en él, fue una gran comerciante de La Meca; permaneció a su lado durante quince años hasta su muerte antes de la Hégira."
  fr: "Khadija bint Khuwaylid, la première des épouses du Prophète et la première à croire en lui, était une grande marchande de La Mecque; elle lui resta fidèle pendant quinze ans jusqu'à sa mort avant l'Hégire."
question:
  ar: من كانت خديجة؟
short_answer:
  ar: خديجة بنت خويلد أولى زوجات النبي وأول من آمن به؛ كانت تاجرة مكة العظيمة ووقفت معه خمس عشرة سنة حتى
    وفاتها قبل الهجرة.
long_answer:
  ar: '[[person/khadija|خديجة بنت خويلد]] سيدة قريش وكبيرة تجارها؛ زوّجت النبي مالها قبل البعثة فآمنت
    به أول الناس ووقفت معه في الحصار والأذى، وتوفيت قبل الهجرة بثلاث سنين في عام الحزن. أم المؤمنين وأم
    معظم أولاده. {cite:wikidata}'
