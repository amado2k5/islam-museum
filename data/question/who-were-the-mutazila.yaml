id: question/who-were-the-mutazila
class: question
label:
  ar: من كان المعتزلة؟
  en: Who were the Mutazila?
  es: "¿Quiénes eran los Mutazila?"
  fr: "Qui étaient les Mutazila ?"
  ur: "معتزلہ کون تھے؟"
summary:
  ar: المعتزلة فرقة كلامية قديمة قالت بالعدل والتوحيد والمنزلة بين المنزلتين وخلق القرآن؛ بلغت دولتهم
    في المأمون ثم هزمهم أهل السنة.
  en: "The Mutazila were an early school of theology. They held to divine justice, the unity of God, the intermediate position between two positions, and the createdness of the Qur'an. Their power peaked under al-Ma'mun, and then Ahl al-Sunna defeated them."
  es: "Los mutazilíes fueron una de las primeras escuelas teológicas. Defendían la justicia divina, la unidad de Dios, la posición intermedia entre dos posturas y la creación del Corán. Su poder alcanzó su apogeo bajo el liderazgo de al-Ma'mun, y posteriormente fueron derrotados por los sunitas."
  fr: "Les Mutaziles constituaient une école théologique ancienne. Ils défendaient la justice divine, l'unicité de Dieu, la position intermédiaire entre deux doctrines et la création du Coran. Leur influence atteignit son apogée sous al-Ma'mun, avant d'être vaincus par les Ahl al-Sunna."
  ur: "معتزلہ دینیات کا ابتدائی مکتب تھا۔ وہ خدائی انصاف، خدا کی وحدانیت، دو عہدوں کے درمیان درمیانی حیثیت اور قرآن کی تخلیق پر قائم تھے۔ ان کی طاقت مامون کے تحت عروج پر تھی اور پھر اہل سنت نے انہیں شکست دی۔"
question:
  ar: من كان المعتزلة؟
short_answer:
  ar: المعتزلة فرقة كلامية قديمة قالت بالعدل والتوحيد والمنزلة بين المنزلتين وخلق القرآن؛ بلغت دولتهم
    في المأمون ثم هزمهم أهل السنة.
long_answer:
  ar: المعتزلة من أقدم الفرق الكلامية؛ انطلقت من واصل بن عطاء وعمرو بن عبيد بالبصرة وبلغت دولتها القصوى
    بمحنتها في خلق القرآن زمن المأمون والمعتصم والواثق. قالت بالمنزلة بين المنزلتين للفاسق وخلق الأفعال
    والقرآن؛ خالفها أهل السنة والجماعة وعادت مدرسة نقدها جدلًا كلاميًا عند الجميع. {cite:wikidata}
