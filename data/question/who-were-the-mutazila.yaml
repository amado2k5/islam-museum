question:
  ar: من كان المعتزلة؟
short_answer:
  ar: المعتزلة فرقة كلامية قديمة قالت بالعدل والتوحيد والمنزلة بين المنزلتين وخلق القرآن؛ بلغت دولتهم
    في المأمون ثم هزمهم أهل السنة.
long_answer:
  ar: المعتزلة من أقدم الفرق الكلامية؛ انطلقت من واصل بن عطاء وعمرو بن عبيد بالبصرة وبلغت دولتها القصوى
    بمحنتها في خلق القرآن زمن المأمون والمعتصم والواثق. قالت بالمنزلة بين المنزلتين للفاسق وخلق الأفعال
    والقرآن؛ خالفها أهل السنة والجماعة وعادت مدرسة نقدها جدلًا كلاميًا عند الجميع. {cite:wikidata}
