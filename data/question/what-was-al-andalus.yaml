question:
  ar: ما الأندلس؟
short_answer:
  ar: الأندلس هو شبه الجزيرة الإيبيرية تحت الحكم الإسلامي 711–1492؛ قرون من الحضارة في قرطبة وغرناطة وطليطلة
    انتهت بسقوط غرناطة.
long_answer:
  ar: الأندلس هو الاسم الإسلامي للأندلس الحالية؛ فتحها طارق بن زياد وموسى بن نصير 711 وبقيت تحت حكم مسلم
    نحو ثمانية قرون. أعظم أزمانها قرطبة في العصر الأموي، وآخرها مملكة غرناطة التي سقطت 1492؛ خلّفت الأندلس
    حوارًا عميقًا في العلم والفلسفة والعمارة والزراعة والأدب بين الحضارات. {cite:wikidata}
