id: question/is-shortening-the-prayer-on-a-journey-obligatory
class: question
label: { ar: "هل قصر الصلاة في السفر فرض، وفي أي سفر يكون؟", en: "Is shortening the prayer on a journey obligatory, and on what journey?", ur: "کیا سفر میں نماز کا قصر فرض ہے، اور کس سفر میں؟" }
question: { ar: "هل يجب على المسافر أن يصلي الرباعية ركعتين أم هو مخيّر، وهل يختص القصر بسفر الطاعة، وما أقل مسافته ومدة الإقامة التي تقطعه؟", en: "Must the traveller pray the four-unit prayers as two, or may he choose; is shortening limited to journeys of obedience; and what are its minimum distance and the length of stay that ends it?", ur: "کیا مسافر پر چار رکعت والی نمازیں دو پڑھنا واجب ہے یا اسے اختیار ہے؛ کیا قصر صرف اطاعت کے سفر کے ساتھ خاص ہے؛ اور اس کی کم سے کم مسافت اور اسے ختم کرنے والی مدتِ قیام کیا ہے؟" }
issue: { ar: "حديث عائشة «فرضت الصلاة ركعتين ثم أقرت صلاة السفر»، وحديث يعلى بن أمية عن عمر «صدقة تصدق الله بها عليكم»، ولفظ نفي الحرج في آية النساء 101، وتعارض الآثار في المسافة، كما يعرضها ابن حزم.", en: "'A'isha's report that prayer was first prescribed as two units and the travel prayer was left so, Ya'la ibn Umayya's report from 'Umar, 'a charity God has given you', the wording of al-Nisa' 101, which negates blame, and the conflicting reports on distance, as Ibn Hazm sets them out.", ur: "عائشہ کی حدیث کہ نماز پہلے دو رکعت فرض ہوئی پھر سفر کی نماز اسی پر برقرار رہی، یعلی بن امیہ کی عمر سے روایت «یہ صدقہ ہے جو اللہ نے تم پر کیا»، سورۂ نساء 101 کے الفاظ جو گناہ کی نفی کرتے ہیں، اور مسافت کے بارے میں متعارض آثار، جیسا کہ ابن حزم انہیں پیش کرتے ہیں۔" }
summary:
  ar: "يجعل ابن حزم في «المحلى» صلاة المسافر ركعتين فرضاً في كل سفر، طاعة كان أو معصية أو مباحاً، ويبطل صلاة من أتم عالماً، ويحد السفر بميل فصاعداً والإقامة القاطعة له بأكثر من عشرين يوماً؛ ويحكي أن أبا حنيفة يوجب القصر في كل سفر، وأن مالكاً يأمر من أتم بالإعادة في الوقت، وأن الشافعي يراه مباحاً، وأن مالكاً والشافعي لا يقصران إلا في سفر مباح، ويحكي تحديداتهم للمسافة بالأيام والأميال {cite:muhalla-dar-ibn-hazm-2016-v4 p.569} {cite:muhalla-dar-ibn-hazm-2016-v4 p.580} {cite:muhalla-dar-ibn-hazm-2016-v5 p.5}."
  en: "In al-Muhalla Ibn Hazm makes the traveller's two units an obligation on every journey, whether of obedience, of disobedience or neither, voids the prayer of one who knowingly prays four, and sets the journey at a mile or more and the stay that ends it at more than twenty days; he reports that Abu Hanifa makes shortening obligatory on every journey, that Malik has one who prayed four repeat within the time, that al-Shafi'i holds it permitted, that Malik and al-Shafi'i shorten only on a permitted journey, and he reports their limits of distance in days and miles {cite:muhalla-dar-ibn-hazm-2016-v4 p.569} {cite:muhalla-dar-ibn-hazm-2016-v4 p.580} {cite:muhalla-dar-ibn-hazm-2016-v5 p.5}."
  ur: "ابن حزم «المحلی» میں مسافر کی دو رکعتوں کو ہر سفر میں فرض قرار دیتے ہیں، خواہ اطاعت کا ہو، نافرمانی کا یا دونوں میں سے کوئی نہیں، جان بوجھ کر چار پڑھنے والے کی نماز باطل کہتے ہیں، اور سفر کی حد ایک میل یا زیادہ اور اسے ختم کرنے والے قیام کی حد بیس دن سے زیادہ رکھتے ہیں؛ وہ نقل کرتے ہیں کہ ابو حنیفہ ہر سفر میں قصر واجب کرتے ہیں، مالک چار پڑھنے والے کو وقت کے اندر اعادے کا حکم دیتے ہیں، شافعی اسے مباح سمجھتے ہیں، اور مالک و شافعی صرف مباح سفر میں قصر کرتے ہیں، اور وہ دنوں اور میلوں میں ان کی مسافت کی حدیں نقل کرتے ہیں {cite:muhalla-dar-ibn-hazm-2016-v4 p.569} {cite:muhalla-dar-ibn-hazm-2016-v4 p.580} {cite:muhalla-dar-ibn-hazm-2016-v5 p.5}۔"
short_answer:
  ar: "كما يحكيهم ابن حزم: أبو حنيفة: القصر فرض في كل سفر، ومسافته ثلاثة أيام؛ مالك: من أتم أعاد في الوقت، ولا قصر في سفر معصية؛ الشافعي: القصر مباح في السفر المباح، ومسافته ستة وأربعون ميلاً؛ ابن حزم الظاهري: فرض في كل سفر من ميل فصاعداً."
  en: "As Ibn Hazm reports them: Abu Hanifa: shortening is obligatory on every journey, of three days; Malik: one who prays four repeats within the time, and there is no shortening on a journey of disobedience; al-Shafi'i: shortening is permitted on a permitted journey of forty-six miles; Ibn Hazm the Zahiri: it is obligatory on every journey of a mile or more."
  ur: "ابن حزم کی نقل کے مطابق: ابو حنیفہ: ہر سفر میں قصر فرض ہے، اور مسافت تین دن؛ مالک: چار پڑھنے والا وقت کے اندر لوٹائے، اور نافرمانی کے سفر میں قصر نہیں؛ شافعی: مباح سفر میں قصر مباح ہے، مسافت چھیالیس میل؛ ابن حزم ظاہری: ایک میل یا زیادہ کے ہر سفر میں فرض۔"
perspectives:
  - tradition: sunni-hanafi
    id: hanafi-obligatory
    standing: main
    stance: { ar: "القصر فرض في كل سفر طاعة أو معصية، ومسافته ثلاثة أيام", en: "Shortening is obligatory on every journey, of obedience or disobedience, of three days' travel", ur: "قصر ہر سفر میں فرض ہے، اطاعت کا ہو یا نافرمانی کا، اور مسافت تین دن کی ہے" }
    summary: { ar: "يحكي ابن حزم أن أبا حنيفة جعل القصر في كل سفر طاعة أو معصية فرضاً، فمن أتم ولم يقعد بعد الركعتين مقدار التشهد بطلت صلاته وأعاد أبداً، وحد السفر بمسيرة ثلاثة أيام، وفي المسافة بما بين الكوفة والمدائن، وفسر الثلاث بسير الأقدام والأثقال والإبل.", en: "Ibn Hazm reports that Abu Hanifa made shortening obligatory on every journey, of obedience or disobedience, so that one who prays four without sitting for the length of the testimony after two units has a void prayer and must repeat it at any time; he set the journey at three days' travel, or in distance the stretch between Kufa and al-Mada'in, and explained the three days as the pace of walkers, loads and camels.", ur: "ابن حزم نقل کرتے ہیں کہ ابو حنیفہ نے ہر سفر میں، اطاعت کا ہو یا نافرمانی کا، قصر کو فرض قرار دیا، چنانچہ جو چار پڑھے اور دو رکعت کے بعد تشہد کی مقدار نہ بیٹھے اس کی نماز باطل ہے اور ہمیشہ لوٹائے؛ انہوں نے سفر کی حد تین دن کی مسافت رکھی، اور مسافت میں کوفہ اور مدائن کے درمیان کا فاصلہ، اور تین دن کی تفسیر پیدل، بوجھ اور اونٹوں کی رفتار سے کی۔" }
    holders: [person/abu-hanifa]
