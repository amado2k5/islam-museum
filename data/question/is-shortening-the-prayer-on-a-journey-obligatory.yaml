  - tradition: sunni
    id: zahiri-ibn-hazm-every-journey-one-mile
    standing: secondary
    stance: { ar: "الظاهرية (ابن حزم): ركعتان فرض في كل سفر من ميل فصاعداً", en: "Zahiri (Ibn Hazm): two units are obligatory on every journey of a mile or more", ur: "ظاہری (ابن حزم): ایک میل یا زیادہ کے ہر سفر میں دو رکعت فرض ہیں" }
    summary: { ar: "يرى ابن حزم أن صلاة السفر ركعتان فرضاً بقول النبي «صلاة السفر ركعتان» وبأمره بقبول صدقة الله، في كل سفر بلا تخصيص، فمن أتم عالماً بطلت صلاته، ومن أتم ساهياً سجد للسهو؛ ويحد السفر بميل فصاعداً ويستشهد بآثار عن عمر وعلي ودحية وابن مسعود وابن عمر وأنس وشرحبيل بن السمط؛ ويخالف داود وأصحابه في قصرهم القصر على الحج والعمرة والجهاد؛ ويجعل من أقام عشرين يوماً فأقل يقصر، فإن زاد أتم.", en: "Ibn Hazm holds the travel prayer to be two units by obligation, by the Prophet's words 'the travel prayer is two units' and his order to accept God's charity, on every journey without exception, so that one who knowingly prays four has a void prayer and one who does so by mistake makes the prostration of forgetfulness; he sets a journey at a mile or more, citing reports from 'Umar, 'Ali, Dihya, Ibn Mas'ud, Ibn 'Umar, Anas and Shurahbil ibn al-Simt; he departs from Dawud and his followers, who limited shortening to the pilgrimage, the lesser pilgrimage and jihad; and he has one who stays twenty days or less shorten, and complete if he stays longer.", ur: "ابن حزم کے نزدیک سفر کی نماز فرضاً دو رکعت ہے، نبی کے فرمان «سفر کی نماز دو رکعت ہے» اور اللہ کے صدقے کو قبول کرنے کے حکم کی بنا پر، ہر سفر میں بغیر تخصیص کے؛ جو جان بوجھ کر چار پڑھے اس کی نماز باطل ہے اور جو بھول کر پڑھے وہ سجدۂ سہو کرے؛ وہ سفر کی حد ایک میل یا زیادہ رکھتے ہیں اور عمر، علی، دحیہ، ابن مسعود، ابن عمر، انس اور شرحبیل بن سمط کے آثار پیش کرتے ہیں؛ وہ داؤد اور ان کے اصحاب سے اختلاف کرتے ہیں جو قصر کو حج، عمرہ اور جہاد تک محدود رکھتے تھے؛ اور بیس دن یا کم ٹھہرنے والا قصر کرے، زیادہ ٹھہرے تو پوری پڑھے۔" }
