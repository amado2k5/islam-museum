  - tradition: sunni-maliki
    id: maliki-repeat-in-time
    standing: main
    stance: { ar: "من أتم أعاد في الوقت، ولا قصر في سفر معصية", en: "One who prays four repeats within the time; no shortening on a journey of disobedience", ur: "چار پڑھنے والا وقت کے اندر لوٹائے؛ نافرمانی کے سفر میں قصر نہیں" }
    summary: { ar: "يحكي ابن حزم أن مالكاً قال: من أتم في السفر فعليه الإعادة في الوقت، وأنه لا يرى القصر إلا في سفر مباح، وأن الروايات عنه في المسافة اختلفت: يوم وليلة، وثمانية وأربعون ميلاً، وخمسة وأربعون، واثنان وأربعون، وأربعون، وستة وثلاثون، كما ذكرها إسماعيل بن إسحاق.", en: "Ibn Hazm reports that Malik said one who prays four on a journey must repeat within the time, that he allowed shortening only on a permitted journey, and that the reports from him on the distance differ: a day and a night, forty-eight miles, forty-five, forty-two, forty and thirty-six, as Isma'il ibn Ishaq recorded them.", ur: "ابن حزم نقل کرتے ہیں کہ مالک نے کہا کہ سفر میں چار پڑھنے والا وقت کے اندر لوٹائے، کہ وہ صرف مباح سفر میں قصر کے قائل تھے، اور مسافت کے بارے میں ان سے روایات مختلف ہیں: ایک دن رات، اڑتالیس میل، پینتالیس، بیالیس، چالیس اور چھتیس، جیسا کہ اسماعیل بن اسحاق نے ذکر کیا۔" }
