  - tradition: sunni-shafii
    id: shafii-permitted
    standing: main
    stance: { ar: "القصر مباح ومن شاء أتم، في السفر المباح", en: "Shortening is permitted and one may pray four, on a permitted journey", ur: "قصر مباح ہے اور جو چاہے پوری پڑھے، مباح سفر میں" }
    summary: { ar: "يحكي ابن حزم أن الشافعي قال: القصر مباح ومن شاء أتم، ولا قصر إلا في سفر مباح، وأنه حد المسافة بستة وأربعين ميلاً، وأن الشافعية احتجوا بأن الآية جاءت بلفظ نفي الجناح وهو يوجب الإباحة لا الفرض، وبخبر عائشة أنها كانت تتم في السفر.", en: "Ibn Hazm reports that al-Shafi'i said shortening is permitted and one may pray four, that there is no shortening except on a permitted journey, that he set the distance at forty-six miles, and that the Shafi'is argued that the verse is worded as a negation of blame, which implies permission, not obligation, and from the report that 'A'isha prayed four on journeys.", ur: "ابن حزم نقل کرتے ہیں کہ شافعی نے کہا کہ قصر مباح ہے اور جو چاہے پوری پڑھے، اور قصر صرف مباح سفر میں ہے، کہ انہوں نے مسافت چھیالیس میل مقرر کی، اور شافعیہ نے دلیل دی کہ آیت گناہ کی نفی کے الفاظ سے آئی جو اباحت کا تقاضا کرتے ہیں نہ کہ فرض کا، اور عائشہ کی اس روایت سے کہ وہ سفر میں پوری پڑھتی تھیں۔" }
