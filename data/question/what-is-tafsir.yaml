question:
  ar: ما التفسير؟
short_answer:
  ar: التفسير هو كشف معاني القرآن وأسبابه وأحكامه؛ ماتراثه مدون من الطبري والزمخشري والرازي وابن كثير
    إلى العصر الحديث.
long_answer:
  ar: التفسير علم بيان معاني القرآن الكريم ولغته وأسباب نزوله وأحكامه ومقاصده؛ أقدم مدونه تفسير الطبري،
    ومن أنواعه التفسير بالمأثور والرأي واللغوي والموضوعي والاجتماعي. {cite:wikidata}
