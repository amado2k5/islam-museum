question:
  ar: ما الطلاق؟
short_answer:
  ar: الطلاق هو حل عقد النكاح بصيغة خاصة؛ أبغض الحلال إلى الله في الحديث، وله عند الفقهاء أحكام العدة
    والرجعة والخلع.
long_answer:
  ar: الطلاق هو فراق الزوجية بحل العقد الشرعي؛ أباحه الشرع لأقصى الحاجة ونظمه بأحكام العدة والرجعة والنشوز
    والخلع والحضانة والنفقة. اختلف الفقهاء في صوره المحرمة كالثلاث بلفظ واحد وطلاق الغضب. {cite:wikidata}
