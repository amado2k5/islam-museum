id: question/what-is-talaq
class: question
label:
  ar: ما الطلاق؟
  en: What is talaq?
  es: "¿Qué es el talaq?"
  fr: "Qu'est-ce que le talaq ?"
  ur: "طلاق کیا ہے؟"
  tr: "Boşanma nedir?"
  id: "Apa itu perceraian?"
summary:
  ar: الطلاق هو حل عقد النكاح بصيغة خاصة؛ أبغض الحلال إلى الله في الحديث، وله عند الفقهاء أحكام العدة
    والرجعة والخلع.
  en: Talaq is the dissolution of the marriage contract by a specific formula. In a hadith it is the most disliked of lawful things to God, and according to the jurists it carries rules on the waiting period, return and khul'.
  es: "El talaq es la disolución del contrato matrimonial mediante una fórmula específica. En un hadiz, se menciona como una de las acciones lícitas más reprobables para Dios, y según los juristas, conlleva normas sobre el período de espera, el retorno y el khul'."
  fr: "Le talaq est la dissolution du contrat de mariage selon une formule précise. Un hadith le désigne comme la chose licite la plus détestée de Dieu, et selon les juristes, il comporte des règles relatives au délai d'attente, au retour et au khul'."
  ur: "طلاق ایک مخصوص فارمولے کے ذریعہ عقد نکاح کو تحلیل کرنا ہے۔ ایک حدیث میں یہ اللہ کے نزدیک حلال چیزوں میں سب سے زیادہ ناپسندیدہ ہے اور فقہاء کے نزدیک اس میں عدت، واپسی اور خلع کے احکام ہیں۔"
  tr: "Boşanma, evlilik sözleşmesinin özel bir biçimde feshedilmesidir; hadislerde Allah huzurunda en çok sevilmediği helal eylemdir ve hukukçulara göre bekleme süreleri, dönüş ve hula' (khul') ile ilgili hükümler vardır."
  id: "Perceraian adalah pembubaran kontrak pernikahan dalam bentuk khusus; tindakan halal yang paling tidak disukai di hadapan Allah dalam hadis, dan menurut ahli hukum, ada aturan tentang masa tunggu, kepulangan, dan khula' (khul')."
question:
  ar: ما الطلاق؟
short_answer:
  ar: الطلاق هو حل عقد النكاح بصيغة خاصة؛ أبغض الحلال إلى الله في الحديث، وله عند الفقهاء أحكام العدة
    والرجعة والخلع.
long_answer:
  ar: الطلاق هو فراق الزوجية بحل العقد الشرعي؛ أباحه الشرع لأقصى الحاجة ونظمه بأحكام العدة والرجعة والنشوز
    والخلع والحضانة والنفقة. اختلف الفقهاء في صوره المحرمة كالثلاث بلفظ واحد وطلاق الغضب. {cite:wikidata}
