label:
  ar: لماذا تهم القدس المسلمين؟
  en: Why does Jerusalem matter to Muslims?
summary:
  ar: القدس مدينة مقدسة عند اليهود والنصارى والمسلمين، وهي أولى القبلتين عند المسلمين، وفي التراث أن منها كانت الإسراء.
  en: "Jerusalem is a holy city for Jews, Christians and Muslims. For Muslims it is the first of the two qiblas, and according to tradition the Isra' (Night Journey) began from it."
wings: []
question:
  ar: لماذا تهم القدس المسلمين؟
short_answer:
  ar: القدس مدينة مقدسة عند اليهود والنصارى والمسلمين، وهي أولى القبلتين عند المسلمين، وفي التراث أن منها كانت الإسراء.
long_answer:
  ar: |
    القدس مدينة مقدسة عند اليهود والنصارى والمسلمين، وفيها مواضع مقدسة لكل منهم. وعند المسلمين هي أولى القبلتين، أي كانت قبلة الصلاة قبل تحويلها إلى مكة، كما يذكر مدخل [[place/jerusalem|القدس]].
    وفي التراث الإسلامي أن الإسراء بدأ منها، وهي مرتبطة بالمسجد الأقصى، ويعرض المدخل ذلك بوصفه رواية في التراث.
    ويرتبط الاهتمام بها بمكة والمدينة، وهما مدينتا الحرمين، كما يعرض مدخلا [[place/mecca|مكة]] و[[place/medina|المدينة]].
