  - tradition: sufi
    id: sarraj-no-takfir
    standing: secondary
    stance:
      ar: "رأي صوفي: لا يجوز تكفيره، فالعبارة تحتمل الحكاية عن الله ولم تثبت عند أهل بيته: قول أبي نصر السراج"
      en: "A Sufi view: he may not be declared an unbeliever, for the phrase can be a quotation of God and his family did not confirm it: the view of Abu Nasr al-Sarraj"
      ur: "ایک صوفی رائے: ان کی تکفیر جائز نہیں، کیونکہ عبارت اللہ کی حکایت ہو سکتی ہے اور ان کے گھر والوں نے اس کی تصدیق نہیں کی: ابو نصر سراج کا قول"
    summary:
      ar: "يذكر السراج في «اللمع» أنه ناظر ابن سالم بالبصرة لما قال إن فرعون لم يقل ما قاله أبو يزيد، فقال له: لا يصح أن تكفره إذا لم تشهد على اعتقاده، لأنه يحتمل أن يكون للكلام مقدمات يحكي فيها عن الله، كما لو سمعنا رجلاً يتلو آية فيها كلام الله عن نفسه؛ وأنه قصد بسطام فسأل جماعة من أهل بيت أبي يزيد فأنكروا الحكاية، وأن علماء ناحيته يتبركون بتربته ويعدّونه من أجلة العباد والزهاد. وينقل ابن الجوزي هذه المناظرة نفسها عن السراج."
      en: "In al-Luma', al-Sarraj says he debated Ibn Salim at Basra when Ibn Salim said Pharaoh never said what Abu Yazid said, and told him: you cannot declare him an unbeliever unless you can testify to his belief, for the words may have had a preamble in which he was quoting God, as when we hear a man recite a verse in which God speaks of Himself; he went to Bistam and asked members of Abu Yazid's family, who denied the story; and the scholars of his region seek blessing at his grave and count him among the greatest worshippers and ascetics. Ibn al-Jawzi quotes the same debate from al-Sarraj."
      ur: "«اللمع» میں سراج کہتے ہیں کہ انہوں نے بصرہ میں ابن سالم سے مناظرہ کیا جب ابن سالم نے کہا کہ فرعون نے وہ بات نہیں کہی جو ابو یزید نے کہی، اور ان سے کہا: جب تک آپ ان کے اعتقاد پر گواہی نہ دے سکیں ان کی تکفیر درست نہیں، کیونکہ ممکن ہے اس کلام کی کوئی تمہید ہو جس میں وہ اللہ کی بات نقل کر رہے ہوں، جیسے ہم کسی کو ایسی آیت پڑھتے سنیں جس میں اللہ اپنے بارے میں فرماتا ہے؛ وہ بسطام گئے اور ابو یزید کے گھر والوں سے پوچھا تو انہوں نے حکایت کا انکار کیا؛ اور ان کے علاقے کے علما ان کی قبر سے برکت لیتے اور انہیں بڑے عابدوں اور زاہدوں میں شمار کرتے ہیں۔ ابن الجوزی یہی مناظرہ سراج سے نقل کرتے ہیں۔"
