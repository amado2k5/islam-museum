    summary:
      ar: "يروي ابن الجوزي عن جعفر الخلدي أنه قيل للجنيد إن أبا يزيد يقول «سبحاني سبحاني»، فقال: إن الرجل مستهلك في شهود الجلال، فنطق بما استهلكه، أذهله الحق عن رؤيته إياه فلم يشهد إلا الحق فنعته."
      en: "Ibn al-Jawzi relates from Ja'far al-Khuldi that al-Junayd was told Abu Yazid says \"Glory be to me, glory be to me\", and replied: the man is absorbed in witnessing majesty and spoke of what absorbed him; God made him oblivious of seeing himself, so that he witnessed only God and described Him."
