      en: "If \"Glory be to me\" is authentic, the narrator may not have understood and he may have been quoting God; al-Junayd's reading is rejected, and his other claims are ugly: the view of Ibn al-Jawzi"
      ur: "اگر «سبحانی» صحیح ہو تو شاید راوی نہ سمجھا اور وہ اللہ کی بات نقل کر رہے تھے؛ جنید کی تاویل مردود ہے، اور ان کے باقی دعوے قبیح ہیں: ابن الجوزی کا قول"
    summary:
      ar: "يروي ابن الجوزي بإسناده عن خادم أبي يزيد أنه سمعه يقول «سبحاني سبحاني ما أعظم شأني»، ثم يقول: هذا إن صح عنه فربما لم يفهم الراوي، لأنه يحتمل أن يكون ذكر تمجيد الحق نفسه فقال حكاية عن الله لا عن نفسه؛ ويعدّ تأويل الجنيد «من الخرافات»، ويسوق دعاوى أخرى مروية عنه ثم يقول إن ما تقدم من دعاويه «ما يخفى قبحها»."
      en: "Ibn al-Jawzi relates with his chain from Abu Yazid's servant that he heard him say \"Glory be to me, glory be to me, how great is my state\", and then says: if this is authentic, perhaps the narrator did not understand, since he may have mentioned God's glorification of Himself and spoken it as a quotation of God, not of himself; he calls al-Junayd's interpretation \"fables\", relates other claims reported from Abu Yazid, and says that the ugliness of the claims he has quoted \"is not hidden\"."
      ur: "ابن الجوزی اپنی سند سے ابو یزید کے خادم سے روایت کرتے ہیں کہ اس نے انہیں «سبحانی سبحانی ما اعظم شانی» کہتے سنا، پھر کہتے ہیں: اگر یہ ان سے صحیح ہو تو شاید راوی نہ سمجھا، کیونکہ ممکن ہے انہوں نے اللہ کی اپنی تمجید کا ذکر کیا ہو اور اسے اللہ کی حکایت کے طور پر کہا ہو نہ کہ اپنی طرف سے؛ وہ جنید کی تاویل کو «خرافات» کہتے ہیں، ابو یزید سے مروی دوسرے دعوے لاتے ہیں، اور کہتے ہیں کہ ان دعووں کی قباحت «چھپی نہیں»۔"
