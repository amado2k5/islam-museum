  - tradition: other
    id: ibn-salim-takfir
    standing: other
    stance:
      ar: "قوله أشد من قول فرعون، ويلزمه الكفر: قول ابن سالم البصري كما يحكيه السراج"
      en: "His words are worse than Pharaoh's and entail unbelief: the view of Ibn Salim of Basra as al-Sarraj reports it"
      ur: "ان کی بات فرعون کی بات سے بھی سخت ہے اور اس سے کفر لازم آتا ہے: ابن سالم بصری کا قول، جیسا کہ سراج بیان کرتے ہیں"
    summary:
      ar: "يحكي السراج أن ابن سالم كان يقول في مجلسه بالبصرة إن فرعون قال إنه الرب، والرب اسم يسمى به المخلوق، وأبو يزيد قال «سبحاني»، وسبحان اسم لا يجوز أن يسمى به غير الله، فيلزمه الكفر؛ وأنه كان يكفّره أيضاً بقوله «ضربت خيمتي بإزاء العرش»، وأن ابن سالم مع جلالته كان يسرف في الطعن عليه."
      en: "Al-Sarraj reports that Ibn Salim used to say in his circle at Basra that Pharaoh claimed to be lord, and 'lord' is a name that can be given to a creature, while Abu Yazid said \"Glory be to me\", and subhan is a name that may be given to none but God, so it entails unbelief; that he also declared him an unbeliever for saying \"I pitched my tent facing the Throne\"; and that, for all his standing, Ibn Salim went too far in attacking him."
      ur: "سراج بیان کرتے ہیں کہ ابن سالم بصرہ میں اپنی مجلس میں کہتے تھے کہ فرعون نے رب ہونے کا دعویٰ کیا، اور رب ایسا نام ہے جو مخلوق کو بھی دیا جاتا ہے، جبکہ ابو یزید نے «سبحانی» کہا، اور سبحان ایسا نام ہے جو اللہ کے سوا کسی کو نہیں دیا جا سکتا، لہٰذا کفر لازم آتا ہے؛ کہ وہ «میں نے اپنا خیمہ عرش کے سامنے لگایا» کہنے پر بھی ان کی تکفیر کرتے تھے؛ اور کہ ابن سالم اپنی جلالتِ قدر کے باوجود ان پر طعن میں حد سے بڑھ جاتے تھے۔"
