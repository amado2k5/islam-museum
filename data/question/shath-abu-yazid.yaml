id: question/shath-abu-yazid
class: question
label:
  ar: "كيف تُفهم شطحات أبي يزيد البسطامي مثل «سبحاني»؟"
  en: "How are Abu Yazid al-Bistami's ecstatic sayings, such as \"Glory be to me\", to be understood?"
  ur: "ابو یزید بسطامی کے شطحیات، جیسے «سبحانی»، کو کیسے سمجھا جائے؟"
summary:
  ar: "تُروى عن أبي يزيد البسطامي عبارات مثل «سبحاني سبحاني ما أعظم شأني»، فعدّها ابن عقيل ومن وافقه موجبة لقتل قائلها، وقال ابن الجوزي إنها إن صحت فلعل الراوي لم يفهم وإنه كان يحكي عن الله، وعدّ تأويل الجنيد لها بالاستهلاك في شهود الجلال «من الخرافات»؛ وأنكر السراج تكفيره، ونقل أن أهل بيته ببسطام لم يعرفوا الحكاية {cite:talbis-iblis-muniriyya-1928 p. 347} {cite:talbis-iblis-muniriyya-1928 p. 348} {cite:luma-sarraj-jadir-dar-al-fath p. 525} {cite:luma-sarraj-jadir-dar-al-fath p. 526}."
  en: "Sayings such as \"Glory be to me, glory be to me, how great is my state\" are reported from Abu Yazid al-Bistami. Ibn 'Aqil held that whoever says such things deserves death; Ibn al-Jawzi said that if they are authentic the narrator may have misunderstood and he may have been quoting God, and called al-Junayd's reading of them as absorption in witnessing divine majesty \"fables\"; al-Sarraj rejected declaring him an unbeliever and reported that his family in Bistam did not know the story {cite:talbis-iblis-muniriyya-1928 p. 347} {cite:talbis-iblis-muniriyya-1928 p. 348} {cite:luma-sarraj-jadir-dar-al-fath p. 525} {cite:luma-sarraj-jadir-dar-al-fath p. 526}."
  ur: "ابو یزید بسطامی سے «سبحانی سبحانی ما اعظم شانی» جیسی عبارتیں مروی ہیں۔ ابن عقیل کے نزدیک ایسی بات کہنے والا قتل کا مستحق ہے؛ ابن الجوزی نے کہا کہ اگر یہ صحیح ہوں تو شاید راوی نہ سمجھا اور وہ اللہ کی بات نقل کر رہے تھے، اور جنید کی اس تاویل کو کہ وہ جلال کے مشاہدے میں مستغرق تھے «خرافات» کہا؛ سراج نے ان کی تکفیر کا انکار کیا اور نقل کیا کہ بسطام میں ان کے گھر والے یہ حکایت نہیں جانتے تھے {cite:talbis-iblis-muniriyya-1928 p. 347} {cite:talbis-iblis-muniriyya-1928 p. 348} {cite:luma-sarraj-jadir-dar-al-fath p. 525} {cite:luma-sarraj-jadir-dar-al-fath p. 526}۔"
wings: [ideas, people]
themes: [spirituality-and-sufism, creed, takfir-and-its-critics]
periods: [period/abbasid-early]
regions: [persia-central-asia, levant-iraq]
question:
  ar: "هل تدل عبارة «سبحاني» المروية عن أبي يزيد على كفر قائلها، أم تُحمل على وجه آخر، أم لا تصح عنه أصلاً؟"
  en: "Does the phrase \"Glory be to me\" reported from Abu Yazid show unbelief in its speaker, should it be read another way, or is it not authentically his at all?"
  ur: "کیا ابو یزید سے مروی عبارت «سبحانی» کہنے والے کے کفر پر دلالت کرتی ہے، یا اسے کسی اور معنی پر محمول کیا جائے، یا یہ ان سے ثابت ہی نہیں؟"
issue:
  ar: "الحكم على الشطحات المروية عن أبي يزيد البسطامي: ثبوتها، ومعناها، وحكم قائلها."
  en: "Judging the ecstatic sayings reported from Abu Yazid al-Bistami: their authenticity, their meaning, and the status of the one who said them."
  ur: "ابو یزید بسطامی سے مروی شطحیات کا حکم: ان کا ثبوت، معنی، اور کہنے والے کا حکم۔"
short_answer:
  ar: "عند ابن عقيل قائل مثلها زنديق؛ وعند ابن الجوزي هي إن صحت محتملة للحكاية عن الله ودعاويه الأخرى ظاهرة القبح؛ وعند الجنيد كما يروى عنه هي نطق المستهلك في شهود الجلال؛ وعند السراج لا يجوز تكفيره بحكاية لا تعرف إرادته فيها."
  en: "For Ibn 'Aqil whoever says such things is a heretic; for Ibn al-Jawzi, if authentic, they may be a quotation of God, while Abu Yazid's other claims are plainly ugly; for al-Junayd, as reported, they are the speech of one absorbed in witnessing majesty; for al-Sarraj he cannot be declared an unbeliever on a report whose intent is unknown."
  ur: "ابن عقیل کے نزدیک ایسی بات کہنے والا زندیق ہے؛ ابن الجوزی کے نزدیک اگر صحیح ہوں تو اللہ کی حکایت ہو سکتی ہیں، جبکہ ان کے دوسرے دعوے صاف طور پر قبیح ہیں؛ جنید کے نزدیک، جیسا کہ ان سے مروی ہے، یہ جلال کے مشاہدے میں مستغرق کی بات ہے؛ سراج کے نزدیک ایسی حکایت پر تکفیر جائز نہیں جس کا مقصد معلوم نہ ہو۔"
sensitivity: contested
perspectives:
  - tradition: sunni-hanbali
    id: ibn-aqil-zandaqa
    standing: main
    stance:
      ar: "قائل مثل هذه الدعاوى زنديق يجب قتله: قول ابن عقيل كما ينقله ابن الجوزي"
      en: "Whoever makes such claims is a heretic who must be killed: the view of Ibn 'Aqil as Ibn al-Jawzi quotes it"
      ur: "ایسے دعوے کرنے والا زندیق ہے جسے قتل کرنا واجب ہے: ابن عقیل کا قول، جیسا کہ ابن الجوزی نقل کرتے ہیں"
    summary:
      ar: "ينقل ابن الجوزي عن ابن عقيل أنه حُكي عن أبي يزيد قوله في النار إنه لو رآها لأطفأها بطرف مرقعته، فقال ابن عقيل: من قال هذا كائناً من كان فهو زنديق يجب قتله، لأن الاستهانة بالشيء ثمرة الجحد."
      en: "Ibn al-Jawzi quotes Ibn 'Aqil on the report that Abu Yazid said of the Fire that if he saw it he would put it out with the edge of his patched robe: whoever says this, whoever he may be, is a heretic who must be killed, for making light of a thing is the fruit of denying it."
      ur: "ابن الجوزی ابن عقیل سے اس روایت پر نقل کرتے ہیں کہ ابو یزید نے آگ کے بارے میں کہا کہ اگر وہ اسے دیکھیں تو اپنی گدڑی کے کنارے سے بجھا دیں: جو بھی یہ کہے، کوئی بھی ہو، زندیق ہے جسے قتل کرنا واجب ہے، کیونکہ کسی چیز کو ہلکا سمجھنا اس کے انکار کا پھل ہے۔"
