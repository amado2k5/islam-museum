id: question/what-is-jerusalem-city
class: question
label:
  ar: ما القدس وبيت المقدس؟
  en: What are Jerusalem and Bayt al-Maqdis?
  es: "¿Qué son Jerusalén y Bayt al-Maqdis?"
  fr: "Que sont Jérusalem et Bayt al-Maqdis ?"
summary:
  ar: القدس مدينة الأنبياء والمسجد الأقصى وقبة الصخرة؛ أولى القبلتين وثالث الحرمين ومسرى النبي وفتحها
    عمر 638 وحررها صلاح الدين 1187.
  en: "Jerusalem is the city of the prophets, home of the Al-Aqsa Mosque and the Dome of the Rock. It is the first of the two qiblas, the third of the sacred sanctuaries, and the site of the Prophet's night journey. Umar conquered it in 638, and Saladin liberated it in 1187."
  es: "Jerusalén es la ciudad de los profetas, hogar de la Mezquita de Al-Aqsa y la Cúpula de la Roca. Es la primera de las dos qiblas, el tercero de los santuarios sagrados y el lugar del viaje nocturno del Profeta. Umar la conquistó en 638 y Saladino la liberó en 1187."
  fr: "Jérusalem est la ville des prophètes, abritant la mosquée Al-Aqsa et le Dôme du Rocher. Elle est la première des deux qiblas, le troisième des lieux saints et le lieu du voyage nocturne du Prophète. Umar la conquit en 638 et Saladin la libéra en 1187."
question:
  ar: ما القدس وبيت المقدس؟
short_answer:
  ar: القدس مدينة الأنبياء والمسجد الأقصى وقبة الصخرة؛ أولى القبلتين وثالث الحرمين ومسرى النبي وفتحها
    عمر 638 وحررها صلاح الدين 1187.
long_answer:
  ar: '[[place/jerusalem|القدس]] ثالث الحرمين الشرفين وأولى القبلتين ومسطرة الإسراء والمعراج؛ فيها المسجد
    الأقصى وقبة الصخرة؛ فتحها عمر بن الخطاب 638 وحررها صلاح الدين 1187 وظلت مركز الجهاد والجهاد الشعبي
    إلى اليوم. {cite:wikidata}'
