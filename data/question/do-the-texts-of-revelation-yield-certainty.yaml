    summary: { ar: "يفرق ابن القيم بين اليقين بمراد المتكلم واليقين بأن ما أراده حق، ويرى أن نفي الأول قادح في تحكيم الوحي، ونفي الثاني قادح في تصديقه؛ ويستدل بأن مراد آيات الحج والصيام وعامة ألفاظ القرآن معلوم بالتواتر كما علم لفظها.", en: "Ibn al-Qayyim distinguishes certainty about what the speaker meant from certainty that what he meant is true; denying the first undermines taking revelation as judge, and denying the second undermines belief in it. He argues that the meaning of the verses on pilgrimage and fasting, and of most of the Qur'an, is known by mass transmission as its wording is.", ur: "ابن القیم متکلم کی مراد کے یقین اور اس مراد کے حق ہونے کے یقین میں فرق کرتے ہیں؛ پہلے کا انکار وحی کو حَکَم بنانے میں طعن ہے اور دوسرے کا انکار اس کی تصدیق میں۔ وہ دلیل دیتے ہیں کہ حج اور روزے کی آیات اور قرآن کے اکثر الفاظ کی مراد اسی طرح تواتر سے معلوم ہے جیسے ان کے الفاظ۔" }
