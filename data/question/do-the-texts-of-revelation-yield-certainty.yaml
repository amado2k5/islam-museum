id: question/do-the-texts-of-revelation-yield-certainty
class: question
label: { ar: "هل تفيد نصوص الوحي اليقين؟", en: "Do the texts of revelation yield certainty?", ur: "کیا نصوصِ وحی یقین دیتے ہیں؟" }
summary:
  ar: "قال الرازي في «محصل أفكار المتقدمين والمتأخرين» إن الدليل اللفظي لا يفيد اليقين إلا عند تيقن أمور عشرة، منها عصمة رواة الألفاظ وعدم المجاز والاشتراك وعدم المعارض العقلي؛ وجعل ابن القيم هذا القول أول «الطواغيت الأربع» في «الصواعق المرسلة» ورده من ثلاثة وسبعين وجهاً، ناقلاً جواب ابن تيمية أن معرفة مراد المتكلم تحصل بما يعرف به مراده، ومنه التواتر."
  en: "Al-Razi said in Muhassal Afkar al-Mutaqaddimin wa'l-Muta'akhkhirin that verbal proof gives certainty only when ten things are certain, among them the reliability of the transmitters of the words, the absence of figurative and ambiguous use and the absence of a rational objection. Ibn al-Qayyim made this the first of the 'four idols' in al-Sawa'iq al-Mursala and answered it in seventy-three aspects, quoting Ibn Taymiyya's reply that a speaker's meaning is known by whatever makes it known, including mass transmission."
question: { ar: "هل تفيد نصوص الوحي اليقين؟", en: "Do the texts of revelation yield certainty?", ur: "کیا نصوصِ وحی یقین دیتے ہیں؟" }
issue: { ar: "هل يحصل اليقين بمراد الله ورسوله من النصوص، أم أن الأدلة اللفظية ظنية لتوقفها على مقدمات ظنية؟", en: "Can one be certain of what God and His Messenger meant by the texts, or are verbal proofs only probable because they depend on probable premises?", ur: "کیا نصوص سے اللہ اور رسول کی مراد کا یقین حاصل ہوتا ہے، یا لفظی دلائل ظنی ہیں کیونکہ وہ ظنی مقدمات پر موقوف ہیں؟" }
short_answer:
  ar: "الرازي: لا يفيد الدليل اللفظي اليقين إلا بعد تيقن عشرة أمور، فإذا كان المنتج ظنياً فالنتيجة أولى. ابن تيمية وابن القيم: لا يتوقف على هذه العشرة، بل على ما يُعرف به مراد المتكلم، وعامة معاني القرآن معلوم مرادها بالتواتر كما علم لفظها."
  en: "Al-Razi: verbal proof gives certainty only after ten things are certain; if the premises are probable, so is the conclusion. Ibn Taymiyya and Ibn al-Qayyim: it does not depend on these ten but on whatever makes the speaker's meaning known, and the meaning of most of the Qur'an is known by mass transmission, as its wording is."
  ur: "رازی: لفظی دلیل دس امور کے یقینی ہونے کے بعد ہی یقین دیتی ہے؛ اگر مقدمات ظنی ہوں تو نتیجہ بدرجۂ اولیٰ۔ ابن تیمیہ اور ابن القیم: یہ ان دس پر موقوف نہیں بلکہ اس پر جس سے متکلم کی مراد معلوم ہو، اور قرآن کے اکثر معانی کی مراد اسی طرح تواتر سے معلوم ہے جیسے اس کے الفاظ۔"
