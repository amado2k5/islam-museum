label:
  ar: من كان مالكولم إكس؟
  en: Who was Malcolm X?
  es: "¿Quién fue Malcolm X?"
  fr: "Qui était Malcolm X ?"
  ur: "میلکم ایکس کون تھا؟"
  tr: "Malcolm X kimdi?"
