summary:
  ar: مالكولم إكس (1925–1965) داعية أمريكي أفريقي في أمة الإسلام تحول إلى الإسلام السني بعد حجه، فاغتيل
    1965 وصار رمزًا عالميًا للحقوق المدنية.
  en: "Malcolm X (1925–1965), an African American preacher in the Nation of Islam who turned to Sunni Islam after his pilgrimage, was assassinated in 1965 and became a global symbol of civil rights."
  es: "Malcolm X (1925-1965), un predicador afroamericano de la Nación del Islam que se convirtió al islam sunita tras su peregrinación, fue asesinado en 1965 y se convirtió en un símbolo mundial de los derechos civiles."
  fr: "Malcolm X (1925-1965), prédicateur afro-américain de la Nation of Islam qui s'est converti à l'islam sunnite après son pèlerinage, a été assassiné en 1965 et est devenu un symbole mondial des droits civiques."
  ur: "میلکم ایکس (1925–1965)، نیشن آف اسلام میں ایک افریقی امریکی مبلغ جو اپنی زیارت کے بعد سنی اسلام کی طرف متوجہ ہوا، 1965 میں قتل کر دیا گیا اور شہری حقوق کی عالمی علامت بن گیا۔"
  tr: "Malcolm X (1925–1965), hac yolculuğundan sonra Sünni İslam'a geçen ve 1965'te suikasta uğramış ve küresel bir sivil haklar sembolü haline gelen Afrikalı Amerikalı bir vaizdi."
  id: "Malcolm X (1925–1965) adalah seorang pengkhotbah Afrika-Amerika dalam Nation of Islam yang memeluk Islam Sunni setelah melakukan ibadah haji, dibunuh pada tahun 1965, dan menjadi simbol global hak-hak sipil."
question:
  ar: من كان مالكولم إكس؟
short_answer:
  ar: مالكولم إكس (1925–1965) داعية أمريكي أفريقي في أمة الإسلام تحول إلى الإسلام السني بعد حجه، فاغتيل
    1965 وصار رمزًا عالميًا للحقوق المدنية.
long_answer:
  ar: '[[person/malcolm-x|مالكولم إكس]] نشأ فقيرًا يتيمًا فدخل السجن فاعتنق أمة الإسلام وصار أشهر دعاتها،
    ثم انشق عنها 1964 وأسلم الإسلام السني بعد حجه الذي كتب فيه رسالته الشهيرة عن الأخوة بين الأعراق. اغتيل
    في نيويورك 1965. {cite:wikidata}'
