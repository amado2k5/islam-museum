question:
  ar: ما البرزخ؟
short_answer:
  ar: 'البرزخ هو الحاجز بين الدنيا والآخرة: حياة القبور بعد الموت؛ يسأل فيه الميت عن ربه ونبيه ودينه عند
    أهل السنة.'
long_answer:
  ar: البرزخ هو العالم بين الموت والبعث؛ آية سورة المؤمنون «ومن ورائهم برزخ إلى يوم يبعثون». عند أهل السنة
    حياة القبر وسؤال الملكين ونعيم القبر وعذابه حق، ويستدلون بأحاديث صحيحة. {cite:wikidata}
