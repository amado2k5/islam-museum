label:
  ar: ما البرزخ؟
  en: What is the barzakh?
summary:
  ar: 'البرزخ هو الحاجز بين الدنيا والآخرة: حياة القبور بعد الموت؛ يسأل فيه الميت عن ربه ونبيه ودينه عند
    أهل السنة.'
  en: "The barzakh is the barrier between this world and the Hereafter: life in the grave after death, in which the dead person is questioned about his Lord, his Prophet and his religion, according to Ahl al-Sunna."
question:
  ar: ما البرزخ؟
short_answer:
  ar: 'البرزخ هو الحاجز بين الدنيا والآخرة: حياة القبور بعد الموت؛ يسأل فيه الميت عن ربه ونبيه ودينه عند
    أهل السنة.'
long_answer:
  ar: البرزخ هو العالم بين الموت والبعث؛ آية سورة المؤمنون «ومن ورائهم برزخ إلى يوم يبعثون». عند أهل السنة
    حياة القبر وسؤال الملكين ونعيم القبر وعذابه حق، ويستدلون بأحاديث صحيحة. {cite:wikidata}
