id: question/why-fast-in-ramadan
class: question
label:
  ar: لماذا يصوم المسلمون في رمضان؟
  en: Why do Muslims fast in Ramadan?
  es: "¿Por qué ayunan los musulmanes en Ramadán?"
  fr: "Pourquoi les musulmans jeûnent-ils pendant le Ramadan ?"
  ur: "مسلمان رمضان کے روزے کیوں رکھتے ہیں؟"
  tr: "Müslümanlar neden Ramazan ayında oruç tutar?"
  id: "Mengapa Muslim berpuasa selama Ramadan?"
summary:
  ar: الصيام في شهر رمضان فريضة من أركان الإسلام، والقرآن يربطها بالتقوى؛ وهذا جواب مختصر عن سبب الصيام في هذا الشهر بالذات.
  en: "Fasting in the month of Ramadan is an obligation and one of the pillars of Islam, and the Qur'an links it to taqwa (God-consciousness). This is a brief answer to why fasting is kept in this particular month."
  es: "El ayuno durante el mes de Ramadán es una obligación y uno de los pilares del Islam, y el Corán lo vincula con la taqwa (la conciencia de Dios). Esta es una breve explicación de por qué se practica el ayuno durante este mes en particular."
  fr: "Le jeûne du mois de Ramadan est une obligation et l'un des piliers de l'islam, et le Coran l'associe à la taqwa (la piété). Voici une brève explication de la raison pour laquelle le jeûne est observé durant ce mois particulier."
  ur: "رمضان کے مہینے میں روزہ ایک فرض اور اسلام کے ستونوں میں سے ایک ہے، اور قرآن اسے تقویٰ سے جوڑتا ہے۔ یہ مختصر جواب ہے کہ اس مہینے میں روزے کیوں رکھے جاتے ہیں۔"
  tr: "Ramazan ayında oruç tutmak İslam'ın bir yükümlülüğüdür ve Kur'an bunu takvayla ilişkilendirir; bu, bu ayda oruç tutma sebebine kısa bir cevaptır."
  id: "Berpuasa di bulan Ramadan adalah kewajiban Islam, dan Al-Qur'an mengaitkannya dengan kesalehan; ini adalah jawaban singkat atas alasan puasa di bulan ini."
