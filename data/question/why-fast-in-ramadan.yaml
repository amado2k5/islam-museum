label:
  ar: لماذا يصوم المسلمون في رمضان؟
  en: Why do Muslims fast in Ramadan?
summary:
  ar: الصيام في شهر رمضان فريضة من أركان الإسلام، والقرآن يربطها بالتقوى؛ وهذا جواب مختصر عن سبب الصيام في هذا الشهر بالذات.
  en: "Fasting in the month of Ramadan is an obligation and one of the pillars of Islam, and the Qur'an links it to taqwa (God-consciousness). This is a brief answer to why fasting is kept in this particular month."
wings: []
question:
  ar: لماذا يصوم المسلمون في رمضان؟
short_answer:
  ar: صيام شهر رمضان فريضة على المسلمين، وهو من أركان الإسلام الخمسة. والقرآن يربطه بالتقوى، ويذكر أنه نزل فيه القرآن.
long_answer:
  ar: |
    صيام رمضان هو الإمساك عن الطعام والشراب وسائر المفطرات من الفجر إلى غروب الشمس في شهر رمضان، وهو من [[concept/five-pillars|أركان الإسلام الخمسة]] {cite:sahih-al-bukhari 8}.

    أصل الفريضة في القرآن. تذكر [[passage/quran-2-183|البقرة 183]] أن الصيام كُتب على المؤمنين كما كُتب على من قبلهم، وأنه يُراد به التقوى.

    وتذكر [[passage/quran-2-185|البقرة 185]] أن شهر رمضان هو الشهر الذي أُنزل فيه القرآن، ومن هنا ارتبط الشهر بالصيام والقراءة.

    ويتعلق بالصيام أيضاً معانٍ اجتماعية وروحية كثيرة، كالتقشف في الطعام والصدقة وقيام الليل، وتفصيل ذلك في مدخل [[practice/sawm-ramadan|صيام رمضان]].

    والصيام مرتبط بالرؤية أو الحساب القمري بحسب ما يذهب إليه كل مذهب في إثبات الشهر، وهذا من مواضع الاختلاف الفقهي التي لا يقدم فيها هذا المدخل حكماً.
