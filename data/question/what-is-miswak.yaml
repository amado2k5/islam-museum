id: question/what-is-miswak
class: question
label:
  ar: "ما السواك؟"
  en: What is the miswak?
summary:
  ar: "السواك تنظيف الفم بعود من شجر الأراك؛ سنة في فم النبي ظلت وسيلة نظافة يومية في بيوت كثيرة إلى اليوم."
  en: "The miswak is cleaning the mouth with a twig from the arak tree. It is a Sunnah practised by the Prophet, and it remained a daily cleaning practice in many households up to today."
