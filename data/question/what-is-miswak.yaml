id: question/what-is-miswak
class: question
label:
  ar: "ما السواك؟"
  en: What is the miswak?
  es: "¿Qué es el miswak?"
  fr: "Qu'est-ce que le miswak ?"
  ur: "مسواک کیا ہے؟"
  tr: "Miswak nedir?"
  id: "Apa itu miswak?"
summary:
  ar: "السواك تنظيف الفم بعود من شجر الأراك؛ سنة في فم النبي ظلت وسيلة نظافة يومية في بيوت كثيرة إلى اليوم."
  en: "The miswak is cleaning the mouth with a twig from the arak tree. It is a Sunnah practised by the Prophet, and it remained a daily cleaning practice in many households up to today."
  es: "El miswak consiste en limpiar la boca con una ramita del árbol de arak. Es una Sunnah practicada por el Profeta y sigue siendo una práctica de limpieza diaria en muchos hogares hasta el día de hoy."
  fr: "Le miswak consiste à se nettoyer la bouche avec une brindille de l'arbre à arak. C'est une sunna pratiquée par le Prophète, et elle est restée une pratique d'hygiène quotidienne dans de nombreux foyers jusqu'à nos jours."
  ur: "مسواک عرق کے درخت کی ٹہنی سے منہ صاف کرنا ہے۔ یہ ایک سنت ہے جس پر نبی نے عمل کیا ہے، اور یہ آج تک بہت سے گھرانوں میں روزانہ صفائی کا عمل ہے۔"
  tr: "Miswak, arak ağacından yapılmış bir çubukla ağız temizleme yöntemidir; Peygamber'in ağzında bir gelenek olup, günümüzde birçok evde günlük temizlik yöntemi olarak kullanılmaktadır."
  id: "Miswak adalah bentuk pembersihan mulut dengan tongkat yang terbuat dari pohon arak; tradisi di mulut Nabi yang tetap menjadi metode pembersihan harian di banyak rumah hingga hari ini."
