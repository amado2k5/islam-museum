label:
  ar: ما زكاة الفطر؟
  en: What is zakat al-fitr?
summary:
  ar: 'زكاة الفطر هي صدقة واجبة في آخر رمضان: صاع من طعام عن كل نفس، تدفع للفقراء قبل صلاة العيد طهرة
    للصائم.'
  en: "Zakat al-fitr is an obligatory charity at the end of Ramadan: a sa' of food for each person, paid to the poor before the Eid prayer as a purification for the fasting person."
question:
  ar: ما زكاة الفطر؟
short_answer:
  ar: 'زكاة الفطر هي صدقة واجبة في آخر رمضان: صاع من طعام عن كل نفس، تدفع للفقراء قبل صلاة العيد طهرة
    للصائم.'
long_answer:
  ar: '[[practice/zakat-al-fitr|زكاة الفطر]] هي صدقة فرضها الإسلام في رمضان: صاع من قوت البلد عن كل نفس
    صغيرًا وكبيرًا، تخرج قبل صلاة [[practice/eid-al-fitr|عيد الفطر]] ليطعم بها الفقراء يوم العيد؛ وصفها
    الحديث طهرة للصائم من اللغو والرفث. {cite:wikidata}'
