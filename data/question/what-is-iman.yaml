class: question
label:
  ar: ما الإيمان في الإسلام؟
  en: What is iman in Islam?
summary:
  ar: الإيمان التصديق بأركان العقيدة، وهي الإيمان بالله وملائكته وكتبه ورسله واليوم الآخر والقدر، كما بيّنها النبي في حديث جبريل.
  en: "Iman is affirmation of the articles of belief: belief in God, His angels, His books, His messengers, the Last Day and divine decree, as the Prophet explained them in the Hadith of Gabriel."
wings: []
question:
  ar: ما الإيمان في الإسلام؟
short_answer:
  ar: الإيمان التصديق بأركان العقيدة، وهي الإيمان بالله وملائكته وكتبه ورسله واليوم الآخر والقدر، كما بيّنها النبي في حديث جبريل.
long_answer:
  ar: |
    الإيمان في الإسلام تصديق القلب بأركان العقيدة، كما بيّنها النبي في حديث جبريل: أن يؤمن الإنسان بالله وملائكته وكتبه ولقائه ورسله وبالبعث {cite:sahih-al-bukhari 50}. ويعرض مدخل [[concept/iman|الإيمان]] تفاصيلها.
    ويرتبط الإيمان بالإسلام، والإسلام الأعمال الظاهرة، والإيمان أصل الاعتقاد، كما يعرض مدخل [[concept/islam-din|الإسلام]].
    وأصل العقيدة في التوحيد، وهو مدخل [[concept/tawhid|التوحيد]]، وتتفرع منه أركان الإيمان.
