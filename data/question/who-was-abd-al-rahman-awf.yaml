id: question/who-was-abd-al-rahman-awf
class: question
label:
  ar: من كان عبد الرحمن بن عوف؟
  en: Who was Abd al-Rahman ibn Awf?
  es: "¿Quién fue Abd al-Rahman ibn Awf?"
  fr: "Qui était Abd al-Rahman ibn Awf ?"
  ur: "عبدالرحمٰن بن عوف کون تھے؟"
summary:
  ar: عبد الرحمن بن عوف من العشرة المبشرين وأغنى التجار وأتقاهم؛ اختير عثمان خليفة على يديه في الشورى؛
    أنفق وأنفق حتى دخل الجنة بإذن الله.
  en: "Abd al-Rahman ibn Awf was one of the Ten promised Paradise, the richest of the merchants and the most pious of them. In the shura, Uthman was chosen caliph through him. He spent and spent until he entered Paradise, by God's leave."
  es: "Abd al-Rahman ibn Awf fue uno de los Diez a quienes se les prometió el Paraíso, el más rico y piadoso de los mercaderes. En la shura, Uthman fue elegido califa gracias a él. Gastó sin cesar hasta que, con el permiso de Dios, entró en el Paraíso."
  fr: "Abd al-Rahman ibn Awf était l'un des Dix promis au Paradis, le plus riche des marchands et le plus pieux d'entre eux. Lors de la shura, Uthman fut choisi comme calife par son intermédiaire. Il dépensa sans compter jusqu'à ce que, par la grâce de Dieu, il entre au Paradis."
  ur: "عبدالرحمٰن بن عوف ان دس جنتیوں میں سے تھے جن کا وعدہ کیا گیا تھا، تاجروں میں سب سے زیادہ امیر اور سب سے زیادہ متقی تھے۔ شوریٰ میں ان کے ذریعے عثمان کو خلیفہ منتخب کیا گیا۔ اس نے خرچ کیا اور خرچ کیا یہاں تک کہ وہ خدا کے حکم سے جنت میں داخل ہوا۔"
question:
  ar: من كان عبد الرحمن بن عوف؟
short_answer:
  ar: عبد الرحمن بن عوف من العشرة المبشرين وأغنى التجار وأتقاهم؛ اختير عثمان خليفة على يديه في الشورى؛
    أنفق وأنفق حتى دخل الجنة بإذن الله.
long_answer:
  ar: '[[person/abd-al-rahman-ibn-awf|عبد الرحمن بن عوف]] هاجر بلا مال فأعاره الأنصاري سوقه فأسس تجارة
    عظيمة؛ جمع ماله مع تقواه فكان ينفق قوافل كاملة في سبيل الله؛ ولي الشورى بعد عمر فبايع عثمان؛ مات 32هـ.
    {cite:wikidata}'
