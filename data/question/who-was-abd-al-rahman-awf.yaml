id: question/who-was-abd-al-rahman-awf
class: question
label:
  ar: من كان عبد الرحمن بن عوف؟
  en: Who was Abd al-Rahman ibn Awf?
summary:
  ar: عبد الرحمن بن عوف من العشرة المبشرين وأغنى التجار وأتقاهم؛ اختير عثمان خليفة على يديه في الشورى؛
    أنفق وأنفق حتى دخل الجنة بإذن الله.
  en: "Abd al-Rahman ibn Awf was one of the Ten promised Paradise, the richest of the merchants and the most pious of them. In the shura, Uthman was chosen caliph through him. He spent and spent until he entered Paradise, by God's leave."
question:
  ar: من كان عبد الرحمن بن عوف؟
short_answer:
  ar: عبد الرحمن بن عوف من العشرة المبشرين وأغنى التجار وأتقاهم؛ اختير عثمان خليفة على يديه في الشورى؛
    أنفق وأنفق حتى دخل الجنة بإذن الله.
long_answer:
  ar: '[[person/abd-al-rahman-ibn-awf|عبد الرحمن بن عوف]] هاجر بلا مال فأعاره الأنصاري سوقه فأسس تجارة
    عظيمة؛ جمع ماله مع تقواه فكان ينفق قوافل كاملة في سبيل الله؛ ولي الشورى بعد عمر فبايع عثمان؛ مات 32هـ.
