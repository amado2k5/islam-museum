summary:
  ar: يحيى بن شرف النووي (1233–1277) شافعي دمشق؛ صاحب الأربعين ورياض الصالحين وشرح صحيح مسلم، من أحب فقهاء
    المسلمين عمرًا.
  tr: "Yahya ibn Şeraf el-Nawawi (1233–1277), Şam'dan bir Şafiiydi; Al-Arba'in, Riyad al-Salihin ve hayatının en sevilen Müslüman hukukçularından biri olan Sahih Muslim üzerine tefsir eserlerinin yazarıdır."
  id: "Yahya ibn Sharaf al-Nawawi (1233–1277) adalah seorang Shafi'i dari Damaskus; penulis Al-Arba'in, Riyad al-Salihin, dan komentar tentang Sahih Muslim, salah satu ahli hukum Muslim yang paling dicintai dalam hidupnya."
question:
  ar: من كان النووي؟
short_answer:
  ar: يحيى بن شرف النووي (1233–1277) شافعي دمشق؛ صاحب الأربعين ورياض الصالحين وشرح صحيح مسلم، من أحب فقهاء
    المسلمين عمرًا.
long_answer:
  ar: '[[person/al-nawawi|الإمام النووي]] الدمشقي النوّاوي؛ عاش 45 سنة فقط وترك من التراث ما يعجز عنه
    أضعاف عمره: الأربعون النووية ورياض الصالحين والمنهاج وشرح مسلم. زاهد عابد وقف مع المظلوم ورفض وظائف
    السلاطين؛ كتبه أشهر كتب العبادة عند عموم المسلمين. {cite:wikidata}'
