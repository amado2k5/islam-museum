id: question/who-was-ali
class: question
label:
  ar: من كان علي بن أبي طالب؟
  en: Who was Ali ibn Abi Talib?
  es: "¿Quién fue Ali ibn Abi Talib?"
  fr: "Qui était Ali ibn Abi Talib ?"
  ur: "علی ابن ابی طالب کون تھے؟"
  tr: "Ali ibn Abi Talib kimdi?"
  id: "Siapakah Ali ibn Abi Talib?"
summary:
  ar: علي بن أبي طالب رابع الخلفاء وابن عم النبي وزوج فاطمة؛ أول الأطفال إسلامًا، وحكمه انشغل بالفتنة
    حتى اغتيل 661.
  en: "Ali ibn Abi Talib was the fourth caliph, cousin of the Prophet and husband of Fatima. He was the first of the children to embrace Islam. His rule was consumed by civil strife until he was assassinated in 661."
  es: "Ali ibn Abi Talib fue el cuarto califa, primo del Profeta y esposo de Fátima. Fue el primero de sus hijos en convertirse al islam. Su reinado estuvo marcado por la inestabilidad política hasta su asesinato en el año 661."
  fr: "Ali ibn Abi Talib fut le quatrième calife, cousin du Prophète et époux de Fatima. Il fut le premier de ses fils à se convertir à l'islam. Son règne fut marqué par des luttes intestines jusqu'à son assassinat en 661."
  ur: "علی ابن ابی طالب چوتھے خلیفہ، پیغمبر کے چچازاد بھائی اور فاطمہ کے شوہر تھے۔ وہ اسلام قبول کرنے والے بچوں میں سب سے پہلے تھے۔ 661 میں اس کا قتل ہونے تک اس کی حکمرانی کو خانہ جنگی نے کھا لیا۔"
  tr: "Ali bin Ebi Talib, dördüncü halife, Peygamber'in kuzeni ve Fatimah'ın eşiydi; İslam'ı benimseyen ilk çocuktu ve yönetimi 661'de suikasta uğrayana kadar isyanla meşguldü."
  id: "Ali ibn Abi Talib adalah khalifah keempat, sepupu Nabi, dan suami Fatimah; anak pertama yang memeluk Islam, dan pemerintahannya dipenuhi dengan hasutan hingga ia dibunuh pada tahun 661."
question:
  ar: من كان علي بن أبي طالب؟
short_answer:
  ar: علي بن أبي طالب رابع الخلفاء وابن عم النبي وزوج فاطمة؛ أول الأطفال إسلامًا، وحكمه انشغل بالفتنة
    حتى اغتيل 661.
long_answer:
  ar: '[[person/ali-ibn-abi-talib|علي بن أبي طالب]] ابن عم النبي وزوج فاطمة وأبو الحسن والحسين؛ من أول
    المسلمين ومن أشجع الفرسان وأعلم الصحابة. خليفته خمس سنين شغلها الخلاف الأهلي: الجمل وصفين والخوارج،
    حتى اغتاله ابن ملجم في الكوفة 661. عند الشيعة هو الإمام الأول والوصي. {cite:wikidata}'
