long_answer:
  ar: '[[person/ali-ibn-abi-talib|علي بن أبي طالب]] ابن عم النبي وزوج فاطمة وأبو الحسن والحسين؛ من أول
    المسلمين ومن أشجع الفرسان وأعلم الصحابة. خليفته خمس سنين شغلها الخلاف الأهلي: الجمل وصفين والخوارج،
    حتى اغتاله ابن ملجم في الكوفة 661. عند الشيعة هو الإمام الأول والوصي. {cite:wikidata}'
