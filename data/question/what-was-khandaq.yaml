id: question/what-was-khandaq
class: question
label:
  ar: ما غزوة الخندق والأحزاب؟
  en: What were the Battles of the Trench and the Confederates?
  es: "¿Qué fueron las Batallas de las Trincheras y la Guerra de Secesión?"
  fr: "Que furent les batailles des tranchées et des Confédérés ?"
  ur: "خندق اور کنفیڈریٹس کی لڑائیاں کیا تھیں؟"
  tr: "Siper ve Konfederasyon Savaşı nedir?"
  id: "Apa itu Pertempuran Parit dan Konfederasi?"
summary:
  ar: الخندق شوال 5هـ/627م؛ حاصر الأحزاب المدينة فحفر سلمان خندقًا حولها وصمد المسلمون شهرًا حتى صرف الله
    الأحزاب بريح وبرد.
  en: "The Trench, Shawwal 5 AH / 627 CE; the Confederates besieged Medina, Salman dug a trench around it, and the Muslims held out for a month until God turned back the Confederates with a wind and cold."
  es: "La trinchera, Shawwal 5 AH / 627 CE; los confederados sitiaron Medina, Salman cavó una trinchera a su alrededor y los musulmanes resistieron durante un mes hasta que Dios hizo retroceder a los confederados con viento y frío."
  fr: "Le Fossé, Shawwal 5 AH / 627 CE; les Confédérés assiégèrent Médine, Salman creusa un fossé autour d'elle, et les musulmans tinrent bon pendant un mois jusqu'à ce que Dieu repousse les Confédérés par un vent et un froid."
  ur: "خندق، شوال 5 ہجری / 627 عیسوی؛ کنفیڈریٹس نے مدینہ کا محاصرہ کیا، سلمان نے اس کے ارد گرد ایک خندق کھودی، اور مسلمان ایک ماہ تک کھڑے رہے یہاں تک کہ خدا نے کنفیڈریٹس کو ہوا اور سردی کے ساتھ واپس کر دیا۔"
  tr: "Shawwal Hengeri 5 Hicri / 627 AD; Konfederasyonlar Medine'yi kuşattı, bu yüzden Salman etrafına bir hendek kazdı ve Müslümanlar bir ay direndi, ta ki Tanrı Konfederasyonları rüzgar ve soğukla temizleene kadar."
  id: "Parit Shawwal 5 AH / 627 M; Konfederasi mengepung Madinah, jadi Salman menggali parit di sekitarnya, dan Muslim bertahan selama sebulan sampai Tuhan membersihkan Konfederasi dengan angin dan dingin."
question:
  ar: ما غزوة الخندق والأحزاب؟
short_answer:
  ar: الخندق شوال 5هـ/627م؛ حاصر الأحزاب المدينة فحفر سلمان خندقًا حولها وصمد المسلمون شهرًا حتى صرف الله
    الأحزاب بريح وبرد.
long_answer:
  ar: '[[event/battle-of-the-trench|الخندق]] حصار عشرة آلاف من قريش وغطفان ويهود قريظة للمدينة؛ اقترح
    سلمان حفر الخندق فصمدت المدينة بلا قتال كبير حتى بعث الله الريح فتفرق الأحزاب؛ بعدها انتهى خطر قريظة
    وقويت شوكة الإسلام. {cite:wikidata}'
