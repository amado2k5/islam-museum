long_answer:
  ar: '[[person/muawiya-ibn-abi-sufyan|معاوية]] من أشراف قريش ومن أواخر المسلمين في الفتح؛ واليه عمر وعثمان
    على الشام عشرين سنة ثم خليفة عشرين أخرى فأسس الأموية ونقل العاصمة دمشق. عند أهل السنة صحابي كاتب وحي،
    وعند الشيعة مقاتل وصيّ النبي؛ له موقف المؤرخ المختلف. {cite:wikidata}'
