id: question/who-was-muawiya
class: question
label:
  ar: من كان معاوية بن أبي سفيان؟
  en: Who was Muawiya ibn Abi Sufyan?
  es: "¿Quién fue Muawiya ibn Abi Sufyan?"
  fr: "Qui était Muawiya ibn Abi Sufyan ?"
summary:
  ar: معاوية بن أبي سفيان مؤسس الدولة الأموية؛ كاتب وحي ووالي الشام ثم خليفة عشرين سنة؛ شخصية إجماعية
    عند السنة ومختلفة عند الشيعة.
  en: "Muawiya ibn Abi Sufyan, founder of the Umayyad state; a scribe of revelation, governor of Syria and then caliph for twenty years. He is regarded with consensus by Sunnis and viewed differently by Shia."
  es: "Muawiya ibn Abi Sufyan, fundador del estado omeya, fue escriba de la revelación, gobernador de Siria y califa durante veinte años. Es considerado por unanimidad por los sunitas, mientras que los chiítas tienen opiniones diferentes al respecto."
  fr: "Muawiya ibn Abi Sufyan, fondateur de l'État omeyyade, fut scribe de révélation, gouverneur de Syrie puis calife pendant vingt ans. Il fait l'objet d'un consensus parmi les sunnites et d'une vision différente chez les chiites."
question:
  ar: من كان معاوية بن أبي سفيان؟
short_answer:
  ar: معاوية بن أبي سفيان مؤسس الدولة الأموية؛ كاتب وحي ووالي الشام ثم خليفة عشرين سنة؛ شخصية إجماعية
    عند السنة ومختلفة عند الشيعة.
long_answer:
  ar: '[[person/muawiya-ibn-abi-sufyan|معاوية]] من أشراف قريش ومن أواخر المسلمين في الفتح؛ واليه عمر وعثمان
    على الشام عشرين سنة ثم خليفة عشرين أخرى فأسس الأموية ونقل العاصمة دمشق. عند أهل السنة صحابي كاتب وحي،
    وعند الشيعة مقاتل وصيّ النبي؛ له موقف المؤرخ المختلف. {cite:wikidata}'
