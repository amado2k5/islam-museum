long_answer:
  ar: 'المنارة هي البرج الملحق بالمسجد الذي يرفع منه المؤذن الأذان. نشأت في العصر الأموي على الأرجح، ثم
    تنوعت مدارسها: الصومعة المربعة المغربية، والمنارة المخروطية العباسية في سامراء (الملوية)، والمآذن
    المملوكية المتدرجة، والمآذن العثمانية القلمية الرشيقة. {cite:wikidata}'
