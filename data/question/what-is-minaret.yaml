id: question/what-is-minaret
class: question
label:
  ar: ما المنارة؟
  en: What is the minaret?
  es: "¿Qué es el minarete?"
  fr: "Qu'est-ce qu'un minaret ?"
  ur: "مینار کیا ہے؟"
summary:
  ar: المنارة هي برج المسجد الذي يرفع منه الأذان؛ أول منارة إسلامية في العهد الأموي ثم تنوعت أشكالها من
    صومعة مراكش إلى مآذن إسطنبول.
  en: "The minaret is the tower of the mosque from which the call to prayer is given. The first Islamic minaret dates from the Umayyad period, and its forms then varied, from the minaret of Marrakesh to the minarets of Istanbul."
  es: "El minarete es la torre de la mezquita desde donde se realiza la llamada a la oración. El primer minarete islámico data del período omeya, y sus formas variaron posteriormente, desde el minarete de Marrakech hasta los minaretes de Estambul."
  fr: "Le minaret est la tour de la mosquée d'où est lancé l'appel à la prière. Le premier minaret islamique date de la période omeyyade, et ses formes ont ensuite varié, du minaret de Marrakech aux minarets d'Istanbul."
  ur: "مینار مسجد کا وہ مینار ہے جہاں سے اذان دی جاتی ہے۔ پہلا اسلامی مینار اموی دور کا ہے، اور اس کے بعد اس کی شکلیں مراکش کے مینار سے استنبول کے میناروں تک مختلف تھیں۔"
question:
  ar: ما المنارة؟
short_answer:
  ar: المنارة هي برج المسجد الذي يرفع منه الأذان؛ أول منارة إسلامية في العهد الأموي ثم تنوعت أشكالها من
    صومعة مراكش إلى مآذن إسطنبول.
long_answer:
  ar: 'المنارة هي البرج الملحق بالمسجد الذي يرفع منه المؤذن الأذان. نشأت في العصر الأموي على الأرجح، ثم
    تنوعت مدارسها: الصومعة المربعة المغربية، والمنارة المخروطية العباسية في سامراء \u2066\u2066\u2066⁦(الملوية)⁩\u2069\u2069\u2069، والمآذن
    المملوكية المتدرجة، والمآذن العثمانية القلمية الرشيقة. {cite:wikidata}'
