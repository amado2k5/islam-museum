id: question/what-is-mihrab
class: question
label:
  ar: ما المحراب؟
  en: What is the mihrab?
  es: "¿Qué es el mihrab?"
  fr: "Qu'est-ce que le mihrab ?"
  ur: "محراب کیا ہے؟"
summary:
  ar: المحراب هو التجويف في جدار القبلة يعلم به المسلمون اتجاه الصلاة؛ من أقدم عناصر عمارة المسجد وأكثرها
    إبداعًا فنيًا.
  en: "The mihrab is the recess in the qibla wall by which Muslims know the direction of prayer. It is among the oldest elements of mosque architecture and the most artistically inventive."
  es: "El mihrab es el hueco en el muro de la qibla que permite a los musulmanes conocer la dirección de la oración. Es uno de los elementos más antiguos de la arquitectura de las mezquitas y el más ingenioso artísticamente."
  fr: "Le mihrab est la niche pratiquée dans le mur de la qibla qui permet aux musulmans de s'orienter pour la prière. Il compte parmi les éléments les plus anciens de l'architecture des mosquées et est sans doute l'un des plus ingénieux sur le plan artistique."
  ur: "محراب قبلہ کی دیوار میں وہ جگہ ہے جس سے مسلمان نماز کی سمت جانتے ہیں۔ یہ مسجد فن تعمیر کے قدیم ترین عناصر میں سے ہے اور فنکارانہ طور پر سب سے زیادہ اختراعی ہے۔"
question:
  ar: ما المحراب؟
short_answer:
  ar: المحراب هو التجويف في جدار القبلة يعلم به المسلمون اتجاه الصلاة؛ من أقدم عناصر عمارة المسجد وأكثرها
    إبداعًا فنيًا.
long_answer:
  ar: 'المحراب هو التجويف أو العلامة في جدار القبلة الذي يقف أمامه الإمام ويستدل به المصلون على اتجاه
    مكة. ظهر المحراب المجوف في المسجد النبوي زمن الوليد بن عبد الملك، ثم صار محراب كل مسجد بابًا للفن:
    محاريب إزنيق الخزفية وكاشان اللاجوردية والمحراب المغربي الخشبي والمحراب الصلاحي الحجرية. {cite:wikidata}'
