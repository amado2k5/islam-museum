short_answer:
  ar: المحراب هو التجويف في جدار القبلة يعلم به المسلمون اتجاه الصلاة؛ من أقدم عناصر عمارة المسجد وأكثرها
    إبداعًا فنيًا.
long_answer:
  ar: 'المحراب هو التجويف أو العلامة في جدار القبلة الذي يقف أمامه الإمام ويستدل به المصلون على اتجاه
    مكة. ظهر المحراب المجوف في المسجد النبوي زمن الوليد بن عبد الملك، ثم صار محراب كل مسجد بابًا للفن:
    محاريب إزنيق الخزفية وكاشان اللاجوردية والمحراب المغربي الخشبي والمحراب الصلاحي الحجرية. {cite:wikidata}'
