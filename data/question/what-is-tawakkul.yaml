question:
  ar: ما التوكل؟
short_answer:
  ar: التوكل هو اعتماد القلب على الله مع الأخذ بالأسباب؛ سنّته اعقلها وتوكل، فهو عبادة لا ترك للعمل.
long_answer:
  ar: التوكل هو صدق اعتماد القلب على الله في جلب المنافع ودفع المضار؛ قال النبي للأعرابي اعقل ناقتك وتوكل.
    هو وسط بين التفويض المطلق الذي يسقط الأسباب وبين الاعتماد المجرد على الأسباب الذي يُنسي المسبب. {cite:wikidata}
