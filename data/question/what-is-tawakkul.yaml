id: question/what-is-tawakkul
class: question
label:
  ar: ما التوكل؟
  en: What is tawakkul?
  es: "¿Qué es el tawakkul?"
  fr: "Qu'est-ce que le tawakkul ?"
  ur: "توکل کیا ہے؟"
  tr: "Tanrı'ya güvenmek nedir?"
  id: "Apa itu ketergantungan pada Tuhan?"
summary:
  ar: التوكل هو اعتماد القلب على الله مع الأخذ بالأسباب؛ سنّته اعقلها وتوكل، فهو عبادة لا ترك للعمل.
  en: Tawakkul is the heart's reliance on God together with taking the means. Its way is 'tie it and then rely', so it is worship and not the abandonment of effort.
  es: "Tawakkul es la confianza del corazón en Dios, junto con la utilización de los medios necesarios. Su método consiste en «atar y luego confiar», por lo que se trata de adoración y no de abandonar el esfuerzo."
  fr: "Le tawakkul est la confiance absolue en Dieu, associée à la mise en œuvre des moyens nécessaires. Sa démarche consiste à « s'en remettre à Dieu », il s'agit donc d'adoration et non d'abandon de l'effort."
  ur: "توکل اسباب کے ساتھ دل کا خدا پر بھروسہ ہے۔ اس کا طریقہ یہ ہے کہ باندھو اور پھر بھروسہ کرو، تو یہ عبادت ہے نہ کہ کوشش کو ترک کرنا۔"
  tr: "Tevakkul, kalbin Allah'a güvenerek gerekli araçları almasıdır; sünneti akılcı ve güvenmektir. Eylemden vazgeçmeyen bir ibadet eylemidir."
  id: "Tawakkul adalah ketergantungan hati kepada Allah sambil mengambil cara yang diperlukan; Sunnahnya adalah rasional dan percaya. Ini adalah tindakan ibadah yang tidak meninggalkan tindakan."
question:
  ar: ما التوكل؟
short_answer:
  ar: التوكل هو اعتماد القلب على الله مع الأخذ بالأسباب؛ سنّته اعقلها وتوكل، فهو عبادة لا ترك للعمل.
long_answer:
  ar: التوكل هو صدق اعتماد القلب على الله في جلب المنافع ودفع المضار؛ قال النبي للأعرابي اعقل ناقتك وتوكل.
    هو وسط بين التفويض المطلق الذي يسقط الأسباب وبين الاعتماد المجرد على الأسباب الذي يُنسي المسبب. {cite:wikidata}
