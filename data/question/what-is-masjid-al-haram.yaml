id: question/what-is-masjid-al-haram
class: question
label:
  ar: "ما المسجد الحرام؟"
  en: What is al-Masjid al-Haram?
  es: "¿Qué es al-Masjid al-Haram?"
  fr: "Qu'est-ce que la Mosquée sacrée (al-Masjid al-Haram) ?"
  ur: "مسجد الحرام کیا ہے؟"
  tr: "Kutsal Cami nedir?"
  id: "Apa itu Masjidil Suci?"
summary:
  ar: "المسجد الحرام مسجد مكة الذي فيه الكعبة، وهو قبلة المسلمين ومحط مناسك الحج والعمرة."
  en: "The Masjid al-Haram is the mosque of Mecca in which the Kaaba stands. It is the qibla of the Muslims and the place where the rites of Hajj and Umrah are performed."
  es: "La Mezquita Sagrada (Masjid al-Haram) es la mezquita de La Meca donde se encuentra la Kaaba. Es la qibla de los musulmanes y el lugar donde se realizan los ritos del Hajj y la Umrah."
  fr: "La Masjid al-Haram est la mosquée de La Mecque où se dresse la Kaaba. Elle est la qibla des musulmans et le lieu où se déroulent les rites du Hajj et de la Omra."
  ur: "مسجد الحرام مکہ کی وہ مسجد ہے جس میں کعبہ کھڑا ہے۔ یہ مسلمانوں کا قبلہ ہے اور وہ جگہ ہے جہاں حج اور عمرہ کے مناسک ادا کیے جاتے ہیں۔"
  tr: "Kutsal Camii, Kabe'yi barındıran Mekke Camidi'dir ve Müslümanların kıblesi ile Hac ve Umre ayinlerinin yapıldığı yerdir."
  id: "Masjid Suci adalah Masjid Mekah, yang menjadi tempat Ka'bah, dan merupakan Qibla umat Islam serta tempat upacara Haji dan Umrah."
