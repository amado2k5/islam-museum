  en: What is al-Masjid al-Haram?
summary:
  ar: "المسجد الحرام مسجد مكة الذي فيه الكعبة، وهو قبلة المسلمين ومحط مناسك الحج والعمرة."
  en: "The Masjid al-Haram is the mosque of Mecca in which the Kaaba stands. It is the qibla of the Muslims and the place where the rites of Hajj and Umrah are performed."
