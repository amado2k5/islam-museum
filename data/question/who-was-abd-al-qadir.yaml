long_answer:
  ar: '[[person/abd-al-qadir-al-jazairi|عبد القادر الجزائري]] أمير المقاومة الجزائرية 1832–1847 ضد الاحتلال
    الفرنسي وشيخ قادرية؛ بعد استسلامه نفي فعاش دمشق فحمى مسيحييها في أحداث 1860 فأكرمته أوروبا؛ من رموز
    الجهاد والنبل في العالم الإسلامي. {cite:wikidata}'
