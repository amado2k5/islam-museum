summary:
  ar: عبد القادر بن محيي الدين الجزائري (1808–1883) أمير المقاومة الجزائرية؛ قاد خمس عشرة سنة ضد الاحتلال
    الفرنسي ثم عاش في دمشق محميًا للمسيحيين.
  en: "Abd al-Qadir ibn Muhyi al-Din al-Jaza'iri (1808–1883) was the Emir of the Algerian resistance. He led it for fifteen years against the French occupation, then lived in Damascus as a protector of the Christians."
  es: "Abd al-Qadir ibn Muhyi al-Din al-Jaza'iri (1808-1883) fue el emir de la resistencia argelina. La dirigió durante quince años contra la ocupación francesa y luego vivió en Damasco como protector de los cristianos."
  fr: "Abd al-Qadir ibn Muhyi al-Din al-Jaza'iri (1808-1883) fut l'émir de la résistance algérienne. Il la dirigea pendant quinze ans contre l'occupation française, puis vécut à Damas comme protecteur des chrétiens."
  ur: "عبد القادر ابن محی الدین الجزائری (1808–1883) الجزائر کی مزاحمت کا امیر تھا۔ اس نے فرانس کے قبضے کے خلاف پندرہ سال تک اس کی قیادت کی، پھر دمشق میں عیسائیوں کے محافظ کے طور پر مقیم رہے۔"
