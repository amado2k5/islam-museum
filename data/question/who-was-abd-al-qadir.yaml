label:
  ar: من كان عبد القادر الجزائري؟
  en: Who was Abd al-Qadir al-Jazairi?
  es: "¿Quién fue Abd al-Qadir al-Jazairi?"
  fr: "Qui était Abd al-Qadir al-Jazairi ?"
