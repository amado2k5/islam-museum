id: question/did-al-jawhari-originate-the-method-of-al-sihah
class: question
label:
  ar: "هل الجوهري مبتكر منهج الصحاح أم سبقه إليه غيره؟"
  en: "Did al-Jawhari originate the arrangement of al-Sihah, or did others precede him?"
  ur: "کیا جوہری صحاح کے منہج کے موجد ہیں یا ان سے پہلے کوئی اور؟"
summary:
  ar: "يرتب الصحاح الألفاظ على أبواب بحسب آخر حروف الأصل. وقد نازع حمد الجاسر في نسبة هذا المنهج إلى الجوهري، وأثبت أن البندنيجي (ت 284هـ) رتّب «كتاب التقفية» على أواخر الكلمات قبله بنحو قرن، وتابعه خليل إبراهيم العطية، وادعى المستشرق كرنكو أن الجوهري أخذ مواد خاله الفارابي في «ديوان الأدب»؛ ويرد محقق الصحاح أحمد عبد الغفور عطار بأن الجوهري مبتكر منهجه."
  en: "Al-Sihah arranges words in chapters by the last radical of the root. Hamad al-Jasir disputed crediting al-Jawhari with this method, showing that al-Bandaniji (d. 284 AH) had arranged his Kitab al-Taqfiya by word endings about a century earlier, and Khalil Ibrahim al-Atiyya followed him; the orientalist Krenkow claimed al-Jawhari took his uncle al-Farabi's material in Diwan al-Adab. Al-Sihah's editor, Ahmad Abd al-Ghafur Attar, replies that al-Jawhari originated his method."
  ur: "صحاح الفاظ کو اصل کے آخری حرف کے لحاظ سے ابواب میں ترتیب دیتی ہے۔ حمد الجاسر نے اس منہج کو جوہری سے منسوب کرنے پر اعتراض کیا اور دکھایا کہ بندنیجی (م 284ھ) نے تقریباً ایک صدی پہلے «کتاب التقفیہ» کو الفاظ کے آخر پر ترتیب دیا، اور خلیل ابراہیم العطیہ نے ان کی پیروی کی؛ مستشرق کرنکو نے دعویٰ کیا کہ جوہری نے اپنے ماموں فارابی کی «دیوان الادب» کا مواد لیا۔ صحاح کے محقق احمد عبد الغفور عطار جواب دیتے ہیں کہ جوہری اپنے منہج کے موجد ہیں۔"
question:
  ar: "من ابتكر ترتيب المعجم العربي على أواخر الأصول؟"
  en: "Who first arranged an Arabic dictionary by the last radical of the root?"
  ur: "عربی لغت کو اصل کے آخری حرف پر سب سے پہلے کس نے ترتیب دیا؟"
short_answer:
  ar: "يرى عطار أنه الجوهري، وأن البندنيجي لم يؤلف معجمًا بل كتابًا في القوافي، وأن الفارابي وضع بعض أسس المنهج؛ ويرى الجاسر والعطية أن البندنيجي سبقه؛ ويتهمه كرنكو بالأخذ عن الفارابي."
  en: "Attar holds it was al-Jawhari, that al-Bandaniji wrote a rhyme book rather than a dictionary, and that al-Farabi laid some foundations; al-Jasir and al-Atiyya hold that al-Bandaniji preceded him; Krenkow accused him of taking from al-Farabi."
  ur: "عطار کے نزدیک جوہری، اور بندنیجی نے لغت نہیں بلکہ قوافی کی کتاب لکھی، اور فارابی نے منہج کی کچھ بنیادیں رکھیں؛ جاسر اور العطیہ کے نزدیک بندنیجی ان سے پہلے تھے؛ کرنکو نے ان پر فارابی سے لینے کا الزام لگایا۔"
