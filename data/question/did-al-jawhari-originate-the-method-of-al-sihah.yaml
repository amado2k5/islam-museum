  - tradition: sunni
    id: jasir-bandaniji-first
    standing: secondary
    stance: { ar: "البندنيجي سبق الجوهري إلى ترتيب التقفية بنحو قرن", en: "Al-Bandaniji preceded al-Jawhari in arrangement by endings by about a century", ur: "بندنیجی تقریباً ایک صدی پہلے آخری حروف کی ترتیب تک پہنچ چکے تھے" }
    summary:
      ar: "أثبت حمد الجاسر في مجلة «العرب»، بحسب ما ينقله بكري شيخ أمين، أن أبا بشر اليمان البندنيجي (ت 284هـ) سبق الجوهري في منهج التقفية بنحو مائة سنة، مع صور مخطوط «كتاب التقفية»، وقال إن الكتاب مغمور قلّ أن يُذكر؛ وتابعه محقق الكتاب خليل إبراهيم العطية في أن المبتكر هو البندنيجي {cite:sihah-attar-1979-v1 p.18} {cite:sihah-attar-1979-v1 p.24}."
      en: "Hamad al-Jasir showed in the journal al-Arab, as Bakri Shaykh Amin reports, that Abu Bishr al-Yaman al-Bandaniji (d. 284 AH) preceded al-Jawhari in the rhyme arrangement by about a hundred years, with photographs of the manuscript of Kitab al-Taqfiya, while noting that the book was obscure and seldom mentioned; its editor Khalil Ibrahim al-Atiyya followed him in crediting al-Bandaniji {cite:sihah-attar-1979-v1 p.18} {cite:sihah-attar-1979-v1 p.24}."
      ur: "حمد الجاسر نے رسالہ «العرب» میں، بکری شیخ امین کی روایت کے مطابق، دکھایا کہ ابو بشر الیمان البندنیجی (م 284ھ) قافیہ کی ترتیب میں جوہری سے تقریباً سو سال پہلے تھے، «کتاب التقفیہ» کے مخطوطے کی تصاویر کے ساتھ، اور کہا کہ یہ کتاب گمنام ہے؛ کتاب کے محقق خلیل ابراہیم العطیہ نے بندنیجی کو موجد ماننے میں ان کی پیروی کی {cite:sihah-attar-1979-v1 p.18} {cite:sihah-attar-1979-v1 p.24}۔"
