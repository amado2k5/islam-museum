  - tradition: academic
    id: krenkow-borrowing-from-farabi
    standing: secondary
    stance: { ar: "أخذ الجوهري مواد «ديوان الأدب» لخاله الفارابي", en: "Al-Jawhari took the material of his uncle al-Farabi's Diwan al-Adab", ur: "جوہری نے اپنے ماموں فارابی کی «دیوان الادب» کا مواد لیا" }
    summary:
      ar: "يذكر عطار أن المستشرق فريتس كرنكو سبق الجاسر في إنكار الابتكار على الجوهري، وادعى أنه أخذ في صحاحه مواد كتاب الفارابي، ولعل منشأ ذلك قول ياقوت إنه رأى نسخة من «ديوان الأدب» بخط الجوهري ذكر فيها أنه قرأها على أبي إبراهيم بفاراب؛ ويرده عطار بأن الفرق بين المعجمين كبير في المنهج والترتيب وعدد المواد. وكلام كرنكو هنا منقول عن خصمه {cite:sihah-attar-1979-scan-b p.6} {cite:sihah-attar-1979-scan-b p.7}."
      en: "Attar reports that the orientalist Fritz Krenkow had preceded al-Jasir in denying al-Jawhari's originality, claiming that he took the material of al-Farabi's book into al-Sihah, perhaps prompted by Yaqut's statement that he saw a copy of Diwan al-Adab in al-Jawhari's hand recording that he read it with Abu Ibrahim at Farab; Attar answers that the two dictionaries differ greatly in method, arrangement and number of entries. Krenkow's view is given here only as reported by his opponent {cite:sihah-attar-1979-scan-b p.6} {cite:sihah-attar-1979-scan-b p.7}."
      ur: "عطار بتاتے ہیں کہ مستشرق فرٹز کرنکو جاسر سے پہلے جوہری کے ابتکار کا انکار کر چکے تھے، اور دعویٰ کیا کہ انہوں نے صحاح میں فارابی کی کتاب کا مواد لیا، شاید یاقوت کے اس قول کی بنا پر کہ انہوں نے جوہری کے ہاتھ کا «دیوان الادب» کا نسخہ دیکھا جس میں لکھا تھا کہ انہوں نے اسے فاراب میں ابو ابراہیم سے پڑھا؛ عطار جواب دیتے ہیں کہ دونوں لغات منہج، ترتیب اور مواد کی تعداد میں بہت مختلف ہیں۔ کرنکو کی رائے یہاں صرف ان کے مخالف کی نقل سے ہے {cite:sihah-attar-1979-scan-b p.6} {cite:sihah-attar-1979-scan-b p.7}۔"
