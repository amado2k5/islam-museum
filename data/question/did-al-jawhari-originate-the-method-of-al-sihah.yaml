issue:
  ar: "أسبقية الجوهري في منهج ترتيب الصحاح"
  en: "Al-Jawhari's priority in the arrangement of al-Sihah"
  ur: "صحاح کی ترتیب کے منہج میں جوہری کی اولیت"
sensitivity: contested
perspectives:
  - tradition: sunni
    id: attar-jawhari-originated
    standing: main
    stance: { ar: "الجوهري مبتكر منهجه، ولم يطلع على كتاب البندنيجي", en: "Al-Jawhari originated his method and never saw al-Bandaniji's book", ur: "جوہری اپنے منہج کے موجد ہیں اور انہوں نے بندنیجی کی کتاب نہیں دیکھی" }
    summary:
      ar: "يقول عطار إن البندنيجي ألّف كتابًا في التقفية لا معجمًا، ورتب الكلمات على صورتها الظاهرة دون أصولها ولا أوائلها، وإن الجوهري اعتمد لام الكلمة ثم الحرف الأول فالثاني فالثالث، وإن البندنيجي وكتابه مغموران فلم يطلع عليه الجوهري ولا معاصروه، والسبق في الزمن لا ينفي الابتكار؛ ويقر بأن الفارابي وضع بعض أسس منهج الصحاح وأن الجوهري أربى عليه {cite:sihah-attar-1979-v1 p.30} {cite:sihah-attar-1979-v1 p.32} {cite:sihah-attar-1979-v1 p.35} {cite:sihah-attar-1979-v1 p.36} {cite:sihah-attar-1979-scan-b p.6} {cite:sihah-attar-1979-scan-b p.7}."
      en: "Attar says al-Bandaniji wrote a book on rhyming, not a dictionary, ordering words by their surface form rather than their roots or first letters, whereas al-Jawhari used the final radical and then the first, second and third letters; that al-Bandaniji and his book were obscure, so neither al-Jawhari nor his contemporaries saw it, and priority in time does not cancel originality; and he grants that al-Farabi laid some foundations of the method, which al-Jawhari far surpassed {cite:sihah-attar-1979-v1 p.30} {cite:sihah-attar-1979-v1 p.32} {cite:sihah-attar-1979-v1 p.35} {cite:sihah-attar-1979-v1 p.36} {cite:sihah-attar-1979-scan-b p.6} {cite:sihah-attar-1979-scan-b p.7}."
      ur: "عطار کہتے ہیں کہ بندنیجی نے قافیہ کی کتاب لکھی، لغت نہیں، اور الفاظ کو ان کی ظاہری صورت پر ترتیب دیا، اصل یا پہلے حروف پر نہیں، جبکہ جوہری نے لامِ کلمہ پھر پہلا، دوسرا اور تیسرا حرف لیا؛ بندنیجی اور ان کی کتاب گمنام تھے اس لیے جوہری اور ان کے معاصرین نے اسے نہیں دیکھا، اور زمانی سبقت ابتکار کی نفی نہیں کرتی؛ اور وہ مانتے ہیں کہ فارابی نے منہج کی کچھ بنیادیں رکھیں جن سے جوہری بہت آگے نکل گئے {cite:sihah-attar-1979-v1 p.30} {cite:sihah-attar-1979-v1 p.32} {cite:sihah-attar-1979-v1 p.35} {cite:sihah-attar-1979-v1 p.36} {cite:sihah-attar-1979-scan-b p.6} {cite:sihah-attar-1979-scan-b p.7}۔"
