label:
  ar: ما الحج؟
  en: What is the Hajj?
  es: "¿Qué es el Hajj?"
  fr: "Qu'est-ce que le Hajj ?"
  ur: "حج کیا ہے؟"
  tr: "Hac nedir?"
  id: "Apa itu Haji?"
summary:
  ar: الحج قصد البيت الحرام بمكة لأداء مناسك مخصوصة، وهو فريضة على من استطاع إليه سبيلاً؛ وهذا جواب مختصر عن معناه وأصله.
  en: "Hajj is the intention to visit the Sacred House in Mecca to perform its specific rites, and it is an obligation on whoever is able to make the journey. This is a short answer about its meaning and origin."
  es: "El Hajj es la intención de visitar la Casa Sagrada de La Meca para realizar sus ritos específicos, y es una obligación para quien pueda emprender el viaje. Esta es una breve explicación sobre su significado y origen."
  fr: "Le Hajj est le pèlerinage à La Mecque, la Maison Sacrée, pour y accomplir ses rites spécifiques. C'est une obligation pour quiconque en a les moyens. Voici une brève explication de sa signification et de son origine."
  ur: "حج مکہ میں مقدس گھر کی زیارت کے لیے اس کے مخصوص عبادات کی نیت سے جانا ہے، اور جو شخص سفر کرنے کی استطاعت رکھتا ہو اس پر یہ فرض ہے۔ یہ اس کے معنی اور اصل کے بارے میں ایک مختصر جواب ہے۔"
