label:
  ar: ما الحج؟
  en: What is the Hajj?
summary:
  ar: الحج قصد البيت الحرام بمكة لأداء مناسك مخصوصة، وهو فريضة على من استطاع إليه سبيلاً؛ وهذا جواب مختصر عن معناه وأصله.
  en: "Hajj is the intention to visit the Sacred House in Mecca to perform its specific rites, and it is an obligation on whoever is able to make the journey. This is a short answer about its meaning and origin."
wings: []
question:
  ar: ما الحج؟
short_answer:
  ar: الحج قصد البيت الحرام بمكة في أيام محددة من السنة لأداء مناسك مخصوصة، وهو فريضة على المسلم القادر عليه مرة في العمر، وهو من أركان الإسلام الخمسة.
long_answer:
  ar: |
    الحج هو قصد البيت الحرام بمكة المكرمة في أشهر الحج لأداء مناسك مخصوصة، وهو من [[concept/five-pillars|أركان الإسلام الخمسة]] {cite:sahih-al-bukhari 8}.

    أصل الفريضة في القرآن. تذكر [[passage/quran-3-97|آل عمران 97]] أن الحج حق لله على الناس، لمن استطاع إليه سبيلاً. وتأمر [[passage/quran-22-27|الحج 27]] بالأذان بالحج في الناس.

    وتُؤدى المناسك في أيام محددة، ويُفرق بينه وبين العمرة، وهي زيارة للبيت تُؤدى في أي وقت من السنة. وهذا التفريق من التفاصيل الفقهية التي تُعرض في مدخل [[practice/hajj|الحج]].

    ومن أهم ما يُسأل عنه أن الحج فريضة على القادر مرة واحدة في العمر، وأن الاستطاعة تشمل القدرة الجسدية والمالية، وهذا متفق عليه بين المذاهب في أصله وإن اختلفت في تفاصيله.
