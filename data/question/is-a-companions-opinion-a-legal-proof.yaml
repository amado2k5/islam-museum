id: question/is-a-companions-opinion-a-legal-proof
class: question
label: { ar: "هل قول الصحابي حجة؟", en: "Is a Companion's opinion a legal proof?", ur: "کیا صحابی کا قول حجت ہے؟" }
summary:
  ar: "يحتج ابن قيم الجوزية في «إعلام الموقعين» بوجوب الاقتداء بالصحابة، ويرى قول الصحابي الذي لم يخالفه غيره حجة مقدمة على القياس، ويحكي قول من يرى أنه ليس بحجة، وما يتفرع على القولين إذا خالف قول الصحابي القياس."
  en: "In I'lam al-Muwaqqi'in, Ibn Qayyim al-Jawziyya argues that following the Companions is obligatory and that a Companion's uncontested opinion is a proof that comes before analogy; he also reports the view that it is not a proof, and how each side treats a Companion's opinion that goes against analogy."
question: { ar: "هل قول الصحابي حجة؟", en: "Is a Companion's opinion a legal proof?" }
issue: { ar: "هل يحتج بقول الصحابي إذا لم يُعرف له مخالف، وما منزلته من القياس، وهل يلحق به التابعي؟" }
short_answer:
  ar: "ابن القيم ومن وافقه: حجة، وترتيب الأدلة القرآن ثم السنة ثم قول الصحابي ثم القياس؛ وآخرون: ليس بحجة، ولهم في مخالفته القياس قولان."
  en: "Ibn al-Qayyim and those who agree: it is a proof, and the order of proofs is Qur'an, Sunna, Companion's opinion, then analogy. Others: it is not a proof, and they hold two views when it goes against analogy."
