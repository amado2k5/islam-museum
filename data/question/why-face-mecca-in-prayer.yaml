class: question
label:
  ar: لماذا يتجه المسلمون إلى مكة في الصلاة؟
  en: Why do Muslims face Mecca in prayer?
summary:
  ar: يتجه المسلمون في صلاتهم إلى الكعبة في مكة، وكانت القبلة الأولى للصلاة في القدس قبل أن تتحول إلى الكعبة.
  en: "Muslims face the Kaaba in Mecca in their prayers. The first qibla for prayer was in Jerusalem, before it was changed to the Kaaba."
wings: []
question:
  ar: لماذا يتجه المسلمون إلى مكة في الصلاة؟
short_answer:
  ar: يتجه المسلمون في صلاتهم إلى الكعبة في مكة، وكانت القبلة الأولى للصلاة في القدس قبل أن تتحول إلى الكعبة.
long_answer:
  ar: |
    يتجه المسلمون في صلاتهم إلى الكعبة في المسجد الحرام بمكة، ويسمى هذا الاتجاه القبلة، وهو معروف في [[place/mecca|مكة]].
    وفي التراث أن القبلة الأولى كانت نحو القدس، ثم تحولت إلى الكعبة، كما يعرض مدخل [[place/jerusalem|القدس]].
    وتفصيل أحكام القبلة في الصلاة وكيفية تحديدها تُعرض في مدخل [[practice/salah|الصلاة]].
