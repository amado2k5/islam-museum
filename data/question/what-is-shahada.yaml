id: question/what-is-shahada
class: question
label:
  ar: ما الشهادة في الإسلام؟
  en: What is the shahada in Islam?
  es: "¿Qué es la shahada en el Islam?"
  fr: "Qu'est-ce que la shahada en islam ?"
  ur: "اسلام میں شہادت کیا ہے؟"
summary:
  ar: الشهادة أن لا إله إلا الله وأن محمداً رسول الله، وهي أول الأركان وبها يدخل الإنسان في الإسلام.
  en: The shahada is the testimony that there is no god but God and that Muhammad is the Messenger of God. It is the first of the pillars, and by it a person enters Islam.
  es: "La shahada es el testimonio de que no hay más dios que Dios y que Mahoma es su Mensajero. Es el primero de los pilares y, mediante él, una persona ingresa al Islam."
  fr: "La shahada est la profession de foi qui atteste qu'il n'y a de dieu que Dieu et que Muhammad est Son Messager. C'est le premier des piliers de l'islam, et par elle, on entre dans l'islam."
  ur: "شہادت اس بات کی گواہی ہے کہ اللہ کے سوا کوئی معبود نہیں اور محمد اللہ کے رسول ہیں۔ یہ ستونوں میں سے پہلا ستون ہے اور اس سے آدمی اسلام میں داخل ہوتا ہے۔"
wings: []
question:
  ar: ما الشهادة في الإسلام؟
short_answer:
  ar: الشهادة أن لا إله إلا الله وأن محمداً رسول الله، وهي أول الأركان وبها يدخل الإنسان في الإسلام.
long_answer:
  ar: |
    الشهادة في الإسلام هي قول: لا إله إلا الله، وأن محمداً رسول الله. وهي أول ما يذكره حديث «بُني الإسلام على خمس» {cite:sahih-al-bukhari 8}.
    ومعنى الشهادة الإقرار بالقلب واللسان معاً، وتفصيلها في مدخل [[concept/shahada|الشهادة]].
    وترتبط الشهادة بأصل التوحيد، وهو مدخل [[concept/tawhid|التوحيد]]، وبأركان الإسلام الخمسة كما في [[concept/five-pillars|أركان الإسلام]].
