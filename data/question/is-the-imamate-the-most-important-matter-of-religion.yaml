id: question/is-the-imamate-the-most-important-matter-of-religion
class: question
label: { ar: "هل الإمامة أهم مسائل الدين؟", en: "Is the imamate the most important matter of religion?", ur: "کیا امامت دین کا سب سے اہم مسئلہ ہے؟" }
summary:
  ar: "قرر ابن المطهر الحلي في مقدمة منهاج الكرامة أن الإمامة أهم المطالب في أحكام الدين وأشرف مسائل المسلمين، ورد عليه ابن تيمية بأن الإيمان بالله ورسوله أهم منها في كل زمان، وأن النبي كان يقبل الإسلام بالتوبة والصلاة والزكاة دون ذكر الإمامة."
  en: "In the introduction to Minhaj al-Karama, Ibn al-Mutahhar al-Hilli stated that the imamate is the most important matter in the rules of religion; Ibn Taymiyya replied that faith in God and His Messenger is more important at every time, and that the Prophet accepted Islam on repentance, prayer and zakat without mentioning the imamate."
question: { ar: "هل الإمامة أهم مسائل الدين؟", en: "Is the imamate the most important matter of religion?" }
issue: { ar: "ما رتبة مسألة الإمامة بين أصول الدين ومسائله؟" }
short_answer:
  ar: "عند الإمامية كما يعرضها الحلي هي أهم المطالب وأشرف المسائل؛ وعند ابن تيمية الإيمان بالله ورسوله أهم منها، والإمامة طاعة لله ورسوله تابعة لهما."
  en: "For the Imamiyya as al-Hilli presents them it is the most important question; for Ibn Taymiyya faith in God and His Messenger ranks above it, and obeying the imam is part of obeying God and His Messenger."
