perspectives:
  - tradition: sunni
    id: meccan-early
    standing: main
    stance: { ar: "مكية من أوائل ما نزل", en: "Meccan, among the earliest revelations", ur: "مکی، ابتدائی نازل ہونے والی سورتوں میں سے" }
    summary:
      ar: "يقول طنطاوي إنه الراجح عند المحققين، وينقل عن القرطبي ترجيحه بأن الصلاة فُرضت بمكة ولم يُحفظ في الإسلام صلاة بغير الفاتحة {cite:tafsir-tantawi-wasit p.11} {cite:tafsir-tantawi-wasit p.12}. ويذكر الشوكاني من أدلته رواية الواحدي والثعلبي عن علي أنها نزلت بمكة، وحديث عمرو بن شرحبيل في أوائل الوحي، ورواية ابن الأنباري عن عبادة {cite:fath-al-qadir-dar-al-marifa p.12}."
      en: "Tantawi calls it the preferred view of careful scholars and quotes al-Qurtubi's argument that prayer was prescribed in Mecca and no prayer without al-Fatiha is known in Islam {cite:tafsir-tantawi-wasit p.11} {cite:tafsir-tantawi-wasit p.12}. Al-Shawkani lists among its proofs the report of al-Wahidi and al-Tha'labi from Ali that it came down in Mecca, the report of Amr ibn Shurahbil about the first revelations, and Ibn al-Anbari's report from Ubada {cite:fath-al-qadir-dar-al-marifa p.12}."
      ur: "طنطاوی اسے محققین کا راجح قول کہتے ہیں اور قرطبی کی یہ دلیل نقل کرتے ہیں کہ نماز مکہ میں فرض ہوئی اور اسلام میں فاتحہ کے بغیر کوئی نماز محفوظ نہیں {cite:tafsir-tantawi-wasit p.11} {cite:tafsir-tantawi-wasit p.12}۔ شوکانی اس کے دلائل میں واحدی اور ثعلبی کی علی سے روایت کہ یہ مکہ میں نازل ہوئی، ابتدائی وحی کے بارے میں عمرو بن شرحبیل کی روایت، اور عبادہ سے ابن الانباری کی روایت ذکر کرتے ہیں {cite:fath-al-qadir-dar-al-marifa p.12}۔"
