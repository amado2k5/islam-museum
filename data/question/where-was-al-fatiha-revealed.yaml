      ar: "يذكر الشوكاني أن من قال إنها مدنية استدل برواية مجاهد عن أبي هريرة أن إبليس رنّ حين أُنزلت الفاتحة وأنها أُنزلت بالمدينة، وبقول مجاهد نفسه من طرق إنها نزلت بالمدينة {cite:fath-al-qadir-dar-al-marifa p.12}."
      en: "Al-Shawkani notes that those who held it Medinan relied on Mujahid's report from Abu Hurayra that Iblis cried out when al-Fatiha was revealed and that it was revealed in Medina, and on Mujahid's own saying, through several chains, that it came down in Medina {cite:fath-al-qadir-dar-al-marifa p.12}."
      ur: "شوکانی بتاتے ہیں کہ مدنی کہنے والوں نے مجاہد کی ابو ہریرہ سے روایت سے استدلال کیا کہ جب فاتحہ نازل ہوئی تو ابلیس چیخا اور یہ مدینہ میں نازل ہوئی، اور خود مجاہد کے اس قول سے جو کئی طرق سے ہے کہ یہ مدینہ میں نازل ہوئی {cite:fath-al-qadir-dar-al-marifa p.12}۔"
    holders: [person/mujahid-ibn-jabr]
