    summary:
      ar: "قيل نزلت مرة بمكة حين فُرضت الصلاة ومرة بالمدينة حين حُوّلت القبلة، كما يحكيه طنطاوي؛ ويذكره الشوكاني جمعًا بين الروايات المتعارضة {cite:tafsir-tantawi-wasit p.11} {cite:fath-al-qadir-dar-al-marifa p.12}."
      en: "It is said it came down once in Mecca when prayer was prescribed and once in Medina when the qibla was changed, as Tantawi reports; al-Shawkani gives it as a reconciliation of the conflicting reports {cite:tafsir-tantawi-wasit p.11} {cite:fath-al-qadir-dar-al-marifa p.12}."
      ur: "کہا گیا ہے کہ یہ ایک بار مکہ میں نماز فرض ہونے پر اور ایک بار مدینہ میں قبلہ بدلنے پر نازل ہوئی، جیسا کہ طنطاوی نقل کرتے ہیں؛ شوکانی اسے متعارض روایات میں تطبیق کے طور پر ذکر کرتے ہیں {cite:tafsir-tantawi-wasit p.11} {cite:fath-al-qadir-dar-al-marifa p.12}۔"
