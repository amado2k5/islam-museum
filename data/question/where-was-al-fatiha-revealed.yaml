id: question/where-was-al-fatiha-revealed
class: question
label:
  ar: "أين نزلت سورة الفاتحة: بمكة أم بالمدينة؟"
  en: "Where was Surat al-Fatiha revealed: in Mecca or in Medina?"
  ur: "سورۂ فاتحہ کہاں نازل ہوئی: مکہ میں یا مدینہ میں؟"
summary:
  ar: "اختلف المفسرون في مكان نزول الفاتحة على ثلاثة أقوال: أنها مكية، وأنها مدنية، وأنها نزلت مرتين؛ والراجح عند المحققين كما يقول طنطاوي أنها مكية من أوائل ما نزل، ويسرد الشوكاني الروايات التي استند إليها كل قول."
  en: "Commentators differ on where al-Fatiha was revealed, with three views: Meccan, Medinan, or revealed twice. The preferred view among careful scholars, Tantawi says, is that it is Meccan and among the earliest revelations; al-Shawkani lists the reports each view relied on."
  ur: "فاتحہ کے مقامِ نزول میں مفسرین کے تین اقوال ہیں: مکی، مدنی، یا دو بار نازل ہوئی۔ طنطاوی کے بقول محققین کے نزدیک راجح یہ ہے کہ یہ مکی ہے اور ابتدائی نازل ہونے والی سورتوں میں سے ہے؛ شوکانی ہر قول کی بنیاد بننے والی روایات گنواتے ہیں۔"
question:
  ar: "هل سورة الفاتحة مكية أم مدنية؟"
  en: "Is Surat al-Fatiha Meccan or Medinan?"
  ur: "کیا سورۂ فاتحہ مکی ہے یا مدنی؟"
short_answer:
  ar: "أكثر المفسرين على أنها مكية؛ ورُوي عن مجاهد أنها مدنية؛ وجمع بعضهم بين الروايات بأنها نزلت مرتين."
  en: "Most commentators hold it Meccan; Mujahid is reported to have said it is Medinan; some reconcile the reports by saying it came down twice."
  ur: "اکثر مفسرین اسے مکی مانتے ہیں؛ مجاہد سے منقول ہے کہ یہ مدنی ہے؛ بعض نے روایات کو یوں جمع کیا کہ یہ دو بار نازل ہوئی۔"
