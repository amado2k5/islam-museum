id: question/what-was-timbuktu
class: question
label:
  ar: ما تمبكتو؟
  en: What was Timbuktu?
  es: "¿Qué era Tombuctú?"
  fr: "Qu'était Tombouctou ?"
  ur: "ٹمبکٹو کیا تھا؟"
summary:
  ar: تمبكتو عاصمة العلم في الساحل الأفريقي؛ ذروتها بسلطنة مالي ثم سونغاي؛ جامعاتها ومخطوطاتها ومدارسها
    أشهر مراكز الإسلام الأفريقي.
  en: "Timbuktu was a center of learning on the African Sahel. Its height came under the Mali and then the Songhai sultanates. Its universities, manuscripts and schools were among the best-known centers of African Islam."
  es: "Tombuctú fue un centro de aprendizaje en el Sahel africano. Su apogeo se produjo bajo los sultanatos de Malí y posteriormente de Songhai. Sus universidades, manuscritos y escuelas figuraban entre los centros más reconocidos del islam africano."
  fr: "Tombouctou était un centre intellectuel majeur du Sahel africain. Son apogée se situait sous les sultanats du Mali puis du Songhaï. Ses universités, ses manuscrits et ses écoles figuraient parmi les centres les plus réputés de l'islam africain."
  ur: "ٹمبکٹو افریقی ساحل پر سیکھنے کا مرکز تھا۔ اس کی اونچائی مالی اور پھر سونگھائی سلطنتوں کے تحت آئی۔ اس کی یونیورسٹیاں، مخطوطات اور اسکول افریقی اسلام کے سب سے مشہور مراکز میں سے تھے۔"
question:
  ar: ما تمبكتو؟
short_answer:
  ar: تمبكتو عاصمة العلم في الساحل الأفريقي؛ ذروتها بسلطنة مالي ثم سونغاي؛ جامعاتها ومخطوطاتها ومدارسها
    أشهر مراكز الإسلام الأفريقي.
long_answer:
  ar: '[[place/timbuktu|تمبكتو]] مدينة مالي على النيجر؛ في عهد مانسا موسى صارت عاصمة تجارة الذهب والملح
    وفي عهد أسكيا محمد عاصمة العلم: جامعا سيدي يحيى وجنقريبر ومدارس ومكتبات بلغت مخطوطاتها مئات الآلاف؛
    سقطت بغزو المغرب 1591 وبقيت ذاكرتها حية في مخطوطاتها. {cite:wikidata}'
