short_answer:
  ar: تمبكتو عاصمة العلم في الساحل الأفريقي؛ ذروتها بسلطنة مالي ثم سونغاي؛ جامعاتها ومخطوطاتها ومدارسها
    أشهر مراكز الإسلام الأفريقي.
long_answer:
  ar: '[[place/timbuktu|تمبكتو]] مدينة مالي على النيجر؛ في عهد مانسا موسى صارت عاصمة تجارة الذهب والملح
    وفي عهد أسكيا محمد عاصمة العلم: جامعا سيدي يحيى وجنقريبر ومدارس ومكتبات بلغت مخطوطاتها مئات الآلاف؛
    سقطت بغزو المغرب 1591 وبقيت ذاكرتها حية في مخطوطاتها. {cite:wikidata}'
