  - tradition: sunni
    id: editor-abridgement
    standing: secondary
    stance: { ar: "السيوطي اختصر البرهان", en: "Al-Suyuti abridged al-Burhan", ur: "سیوطی نے البرہان کا اختصار کیا" }
    summary:
      ar: "يقول محقق طبعة دار الحديث إن البرهان أوسع وأشمل من الإتقان ومن «مناهل العرفان»، وإنه وإن زعم صاحب الإتقان أنه أتى بما لم يأت به غيره، فإن من طالع الكتابين وجد أن السيوطي اختصر البرهان، ويرى ذلك السمة الغالبة على كتب السيوطي {cite:burhan-dar-al-hadith-2006 p.5}."
      en: "The editor of the Dar al-Hadith edition says al-Burhan is broader and more comprehensive than al-Itqan and than Manahil al-Irfan, and that although the author of al-Itqan claimed to bring what no one else had, whoever reads both books finds that al-Suyuti abridged al-Burhan — which he sees as the dominant feature of al-Suyuti's books {cite:burhan-dar-al-hadith-2006 p.5}."
      ur: "دار الحدیث ایڈیشن کے محقق کہتے ہیں کہ البرہان الاتقان اور «مناہل العرفان» سے زیادہ وسیع اور جامع ہے، اور اگرچہ صاحبِ الاتقان نے دعویٰ کیا کہ وہ وہ لائے جو کوئی اور نہ لایا، مگر جو دونوں کتابیں پڑھے وہ پائے گا کہ سیوطی نے البرہان کا اختصار کیا — اور وہ اسے سیوطی کی کتابوں کی غالب خصوصیت سمجھتے ہیں {cite:burhan-dar-al-hadith-2006 p.5}۔"
    sources: [source/burhan-dar-al-hadith-2006]
  - tradition: academic
    id: thesis-built-on
    standing: main
    stance: { ar: "بنى أغلب أبوابه عليه مع زيادة في التفريع والأمثلة", en: "He built most of his chapters on it, with more subdivision and examples", ur: "اپنے اکثر ابواب اسی پر قائم کیے، زیادہ تفریع اور مثالوں کے ساتھ" }
    summary:
      ar: "ترى ليلى محمد مسعود أن السيوطي استفاد من البرهان استفادة عظيمة، فبنى عليه أغلب أبوابه ونقل منه نحو ثلاثة وسبعين نوعًا، وأن اختلاف العدد يرجع إلى كثرة تقسيمه، فأسباب النزول عند الزركشي في ثلاثة أنواع وعند السيوطي في أربعة عشر؛ وتذكر خمسة أنواع انفرد بها الزركشي، منها التصريف ومعاضدة السنة للكتاب، وأنواعًا انفرد بها السيوطي، منها ما نزل على لسان بعض الصحابة {cite:thaqafat-al-mufassir-zarkashi-alexandria p.143} {cite:thaqafat-al-mufassir-zarkashi-alexandria p.144}."
      en: "Layla Muhammad Mas'ud finds that al-Suyuti drew heavily on al-Burhan, building most of his chapters on it and taking some seventy-three types from it, the difference in count coming from his finer subdivision — the occasions of revelation are three types in al-Zarkashi and fourteen in al-Suyuti; she lists five types found only in al-Zarkashi, among them morphology and the Sunna's support of the Book, and types found only in al-Suyuti, among them what was revealed in agreement with the words of some Companions {cite:thaqafat-al-mufassir-zarkashi-alexandria p.143} {cite:thaqafat-al-mufassir-zarkashi-alexandria p.144}."
      ur: "لیلیٰ محمد مسعود کے مطابق سیوطی نے البرہان سے بہت استفادہ کیا، اپنے اکثر ابواب اسی پر قائم کیے اور اس سے تقریباً تہتر انواع لیں، اور تعداد کا فرق ان کی زیادہ تقسیم سے ہے — اسبابِ نزول زرکشی کے ہاں تین انواع میں اور سیوطی کے ہاں چودہ میں ہیں؛ وہ پانچ انواع گنواتی ہیں جو صرف زرکشی کے ہاں ہیں، جن میں تصریف اور کتاب کے لیے سنت کی تائید ہیں، اور کچھ جو صرف سیوطی کے ہاں ہیں، جن میں وہ ہے جو بعض صحابہ کی زبان پر نازل ہوا {cite:thaqafat-al-mufassir-zarkashi-alexandria p.143} {cite:thaqafat-al-mufassir-zarkashi-alexandria p.144}۔"
