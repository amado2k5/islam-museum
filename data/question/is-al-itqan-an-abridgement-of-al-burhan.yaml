    summary:
      ar: "ينقل البحث عن مقدمة الإتقان أن السيوطي خطر له بعد «التحبير» أن يؤلف كتابًا مبسوطًا وهو يظن أنه متفرد بذلك، حتى بلغه أن الزركشي ألف فيه كتابًا حافلًا يسمى البرهان فطلبه حتى وقف عليه، فازداد به سرورًا وقوي عزمه، فوضع الإتقان «ورتبت أنواعه ترتيبًا أنسب من ترتيب البرهان» {cite:thaqafat-al-mufassir-zarkashi-alexandria p.142} {cite:thaqafat-al-mufassir-zarkashi-alexandria p.143}."
      en: "The thesis quotes al-Itqan's introduction: after al-Tahbir it occurred to al-Suyuti to write a full book, thinking himself alone in this, until he learned that al-Zarkashi had written a rich book on it called al-Burhan; he sought it out, was delighted by it, his resolve grew, and he wrote al-Itqan, 'and I arranged its types more fittingly than the arrangement of al-Burhan' {cite:thaqafat-al-mufassir-zarkashi-alexandria p.142} {cite:thaqafat-al-mufassir-zarkashi-alexandria p.143}."
      ur: "مقالہ الاتقان کے مقدمے سے نقل کرتا ہے کہ «التحبیر» کے بعد سیوطی کو ایک مبسوط کتاب لکھنے کا خیال آیا اور وہ سمجھتے تھے کہ وہ اس میں منفرد ہیں، یہاں تک کہ انہیں خبر ملی کہ زرکشی نے اس پر البرہان نامی جامع کتاب لکھی ہے؛ انہوں نے اسے تلاش کیا، اس سے بہت خوش ہوئے، ان کا عزم پختہ ہوا، اور انہوں نے الاتقان لکھی، «اور میں نے اس کی انواع کو البرہان کی ترتیب سے زیادہ مناسب ترتیب دی» {cite:thaqafat-al-mufassir-zarkashi-alexandria p.142} {cite:thaqafat-al-mufassir-zarkashi-alexandria p.143}۔"
