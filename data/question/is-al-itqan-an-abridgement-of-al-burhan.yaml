id: question/is-al-itqan-an-abridgement-of-al-burhan
class: question
label:
  ar: "هل «الإتقان» للسيوطي اختصار لـ«البرهان» للزركشي؟"
  en: "Is al-Suyuti's al-Itqan an abridgement of al-Zarkashi's al-Burhan?"
  ur: "کیا سیوطی کی «الاتقان» زرکشی کی «البرہان» کا اختصار ہے؟"
summary:
  ar: "يذكر السيوطي أنه كان يظن نفسه منفردًا بوضع كتاب جامع في علوم القرآن حتى بلغه البرهان فطلبه، وأنه رتب أنواع الإتقان ترتيبًا أنسب من ترتيبه؛ ويرى محقق طبعة دار الحديث للبرهان أن السيوطي اختصره؛ وتجد رسالة ماجستير بجامعة الإسكندرية أنه بنى أغلب أبوابه عليه مع زيادة في التفريع والأمثلة وأنواع انفرد بها كل منهما."
  en: "Al-Suyuti says he thought himself the first to write a comprehensive book on the Qur'anic sciences until he heard of al-Burhan and sought it out, and that he arranged the types of al-Itqan better than al-Burhan; the editor of the Dar al-Hadith edition of al-Burhan holds that al-Suyuti abridged it; an Alexandria University MA thesis finds that he built most of his chapters on it, with more subdivision and examples, and types unique to each book."
  ur: "سیوطی کہتے ہیں کہ وہ خود کو علومِ قرآن پر جامع کتاب لکھنے میں منفرد سمجھتے تھے یہاں تک کہ انہیں البرہان کی خبر ملی اور انہوں نے اسے تلاش کیا، اور یہ کہ انہوں نے الاتقان کی انواع کو البرہان سے بہتر ترتیب دی؛ دار الحدیث ایڈیشنِ البرہان کے محقق کے نزدیک سیوطی نے اس کا اختصار کیا؛ اور جامعہ اسکندریہ کا ایک ایم اے مقالہ بتاتا ہے کہ انہوں نے اپنے اکثر ابواب اسی پر قائم کیے، زیادہ تفریع اور مثالوں کے ساتھ، اور ہر کتاب میں کچھ منفرد انواع ہیں۔"
question:
  ar: "ما صلة «الإتقان» بـ«البرهان»: اختصار، أم بناء عليه، أم تأليف مستقل؟"
  en: "What is al-Itqan's relation to al-Burhan: an abridgement, a work built on it, or an independent book?"
  ur: "الاتقان کا البرہان سے کیا تعلق ہے: اختصار، اس پر تعمیر، یا مستقل تالیف؟"
short_answer:
  ar: "السيوطي يقرّ بأنه وقف على البرهان قبل أن يكتب الإتقان وأنه رتّب أنواعه أحسن منه؛ والمحقق أحمد بن علي يراه اختصارًا له؛ والدراسة الأكاديمية تراه بناءً عليه مع زيادات."
  en: "Al-Suyuti acknowledges that he came upon al-Burhan before writing al-Itqan and that he arranged its types better; the editor Ahmad ibn Ali calls it an abridgement; the academic study calls it a work built on al-Burhan with additions."
  ur: "سیوطی تسلیم کرتے ہیں کہ الاتقان لکھنے سے پہلے انہیں البرہان ملی اور انہوں نے انواع کو اس سے بہتر ترتیب دی؛ محقق احمد بن علی اسے اس کا اختصار کہتے ہیں؛ اور علمی مطالعہ اسے اضافوں کے ساتھ اس پر قائم تالیف کہتا ہے۔"
