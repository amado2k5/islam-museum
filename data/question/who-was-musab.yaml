long_answer:
  ar: '[[person/musab-ibn-umayr|مصعب]] أجمل فتيان قريش وأنعمهم فآمن فهجرته أمه؛ أرسله النبي مبعوثًا أول
    للمدينة فأسلمت على يديه الأوس والخزرج؛ حمل راية المسلمين يوم أُحد فقطعت يداه ومات يقرأ ومكرر آية الرسل.
