id: question/who-was-musab
class: question
label:
  ar: من كان مصعب بن عمير؟
  en: Who was Musab ibn Umayr?
  es: "¿Quién fue Musab ibn Umayr?"
  fr: "Qui était Musab ibn Umayr ?"
  ur: "مصعب بن عمیر کون تھے؟"
  tr: "Mus'ab bin Umair kimdi?"
  id: "Siapakah Mus'ab bin Umair?"
summary:
  ar: مصعب بن عمير أول سفير في الإسلام؛ بعثه النبي إلى المدينة يعلمها القرآن قبل الهجرة؛ استشهد حامل الراية
    يوم أُحد.
  en: "Musab ibn Umayr, the first envoy in Islam; the Prophet sent him to Medina to teach its people the Qur'an before the Hijra, and he was martyred carrying the banner at the Battle of Uhud."
  es: "Musab ibn Umayr, el primer enviado del Islam; el Profeta lo envió a Medina para enseñar el Corán a su gente antes de la Hégira, y murió como mártir portando el estandarte en la batalla de Uhud."
  fr: "Musab ibn Umayr, le premier envoyé de l'Islam; le Prophète l'envoya à Médine pour enseigner le Coran à ses habitants avant l'Hégire, et il fut martyrisé en portant l'étendard lors de la bataille d'Uhud."
  ur: "مصعب بن عمیر، اسلام میں پہلا ایلچی؛ نبی نے انہیں ہجرت سے پہلے اپنے لوگوں کو قرآن سکھانے کے لیے مدینہ بھیجا، اور وہ جنگ احد میں جھنڈا اٹھائے ہوئے شہید ہو گئے۔"
  tr: "Mus'ab bin Umair İslam'a ilk elçiydi; Peygamber onu Hicre öncesi Kur'an'ı öğretmesi için Medine'ye gönderdi; sancaktar Uhud gününde şehit edildi."
  id: "Mus'ab ibn Umair adalah utusan pertama untuk Islam; Nabi mengirimnya ke Madinah untuk mengajarkan Al-Qur'an sebelum Hijrah; pembawa panji itu gugur pada hari Uhud."
question:
  ar: من كان مصعب بن عمير؟
short_answer:
  ar: مصعب بن عمير أول سفير في الإسلام؛ بعثه النبي إلى المدينة يعلمها القرآن قبل الهجرة؛ استشهد حامل الراية
    يوم أُحد.
long_answer:
  ar: '[[person/musab-ibn-umayr|مصعب]] أجمل فتيان قريش وأنعمهم فآمن فهجرته أمه؛ أرسله النبي مبعوثًا أول
    للمدينة فأسلمت على يديه الأوس والخزرج؛ حمل راية المسلمين يوم أُحد فقطعت يداه ومات يقرأ ومكرر آية الرسل.
    {cite:wikidata}'
