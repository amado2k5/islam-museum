short_answer:
  ar: الحروب الصليبية حملات عسكرية لاتينية على الشام والقدس 1096–1291؛ أسست ممالك صليبية وانتهت بطردهم
    من عكا على يد المماليك.
long_answer:
  ar: الحروب الصليبية سلسلة حملات عسكرية لاتينية ردّ عليها المسلمون قرنين؛ بدأت بسقوط القدس 1099 ومذبحة
    أهلها، فردّها عماد الدين زنكي ونور الدين وصلاح الدين في حطين 1187، واستكملها المماليك بطرد آخر معاقلهم
    في عكا 1291. {cite:wikidata}
