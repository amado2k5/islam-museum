label:
  ar: ما الحروب الصليبية؟
  en: What were the Crusades?
summary:
  ar: الحروب الصليبية حملات عسكرية لاتينية على الشام وبيت المقدس، بدأت بسقوط أنطاكية 1097–1098 وبيت المقدس 1099، وانتهت بطرد الصليبيين من المشرق (حسن إبراهيم حسن، ص 238، 243).
  en: "The Crusades were Latin military campaigns against Syria and Jerusalem. They began with the fall of Antioch in 1097–1098 and of Jerusalem in 1099, and ended with the expulsion of the Crusaders from the East (Hasan Ibrahim Hasan, pp. 238, 243)."
question:
  ar: ما الحروب الصليبية؟
short_answer:
  ar: الحروب الصليبية حملات عسكرية لاتينية على الشام وبيت المقدس، بدأت بسقوط بيت المقدس سنة 1099م، وانتهت بطرد الصليبيين من المشرق.
long_answer:
  ar: الحروب الصليبية حملات عسكرية لاتينية على الشام وبيت المقدس. دخل الصليبيون أنطاكية عنوة سنة 1098م، ثم بيت المقدس في يونيو 1099م، ووقعت فيها مذبحة كبيرة (حسن إبراهيم حسن، ص 238). ردّها المسلمون بقيادة صلاح الدين، فهزم الصليبيين في حطين سنة 1187م، ودخل بيت المقدس في 27 رجب 583هـ بعد أن طلب الصليبيون الصلح (ص 110، 111). وانتهت الحروب الصليبية بطرد الصليبيين من المشرق (ص 243). {cite:tarikh-islam-hasan-ibrahim p.238}
