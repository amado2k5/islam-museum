id: question/credibility-of-ibn-battuta
class: question
label: { ar: "هل تُصدَّق أخبار ابن بطوطة عن عجائب الهند؟", en: "Should Ibn Battuta's tales of India be believed?", ur: "کیا ہند کے عجائب کے بارے میں ابن بطوطہ کی خبریں مانی جائیں؟" }
summary:
  ar: "يحكي ابن خلدون، في نص نقله مصحح طبعة القاهرة سنة 1322هـ في ذيل الجزء الأول من الرحلة، أن الناس في دولة أبي عنان تناجوا بتكذيب ابن بطوطة فيما يحدّث به عن ملك الهند، وأن الوزير فارس بن ودرار نهاه عن إنكار ما لم يره، ثم يقرر ابن خلدون قاعدة الإمكان بحسب المادة؛ ويقرر ابن جزي في خطبة الرحلة أنه أورد ما حكاه ابن بطوطة دون أن يبحث عن حقيقته، ويقسم ابن بطوطة أن ما نقله من كرم سلطان الهند حق."
  en: "Ibn Khaldun, in a passage the corrector of the 1322 AH Cairo edition quotes in an appendix to part one of the Rihla, relates that at Abu Inan's court people whispered that Ibn Battuta was lying about the king of India, that the vizier Faris ibn Wadrar warned him not to deny what he had not seen, and then states his rule of what is possible given a thing's nature; Ibn Juzayy says in his preface that he set down Ibn Battuta's stories without investigating them, and Ibn Battuta swears that what he reports of the Indian sultan's generosity is true."
question: { ar: "هل تُصدَّق أخبار ابن بطوطة عن عجائب الهند؟", en: "Should Ibn Battuta's tales of India be believed?" }
issue: { ar: "كيف تلقّى معاصرو ابن بطوطة ما رواه من عجائب البلاد، وبأي ميزان يُحكم على الخبر الغريب؟" }
short_answer:
  ar: "ابن بطوطة: ما ينقله من كرم سلطان الهند حق شاهده؛ ابن جزي: نقل الحكايات كما رُويت دون اختبار؛ ابن خلدون: أهل الدولة تناجوا بتكذيبه، والوزير فارس بن ودرار حذّر من إنكار ما لم يُرَ، والميزان عنده الإمكان بحسب طبيعة الشيء."
  en: "Ibn Battuta: what he reports of the Indian sultan's generosity is truth he witnessed. Ibn Juzayy: he recorded the stories as told, without testing them. Ibn Khaldun: courtiers whispered that he lied; the vizier Faris ibn Wadrar warned against denying what one has not seen; his own yardstick is possibility according to a thing's nature."
