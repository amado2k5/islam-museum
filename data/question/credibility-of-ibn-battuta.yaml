    summary: { ar: "يذكر ابن خلدون أن ابن بطوطة كان يحدّث في دولة أبي عنان بعجائب ملك الهند، كإحصائه أهل مدينته وفرض أرزاقهم ستة أشهر، ونثره الدراهم والدنانير بالمجانيق، فتناجى الناس بتكذيبه، وأنه لقي الوزير فارس بن ودرار فأراه إنكار ذلك، فحذّره الوزير أن ينكر ما لم يره فيكون كابن الوزير الذي نشأ في السجن فظن كل لحم لحم فأر؛ ثم يقرر أن المرء يميّز الممكن من الممتنع بعقله، وأن المراد الإمكان بحسب مادة الشيء لا الإمكان العقلي المطلق.", en: "Ibn Khaldun relates that at Abu Inan's court Ibn Battuta told of the marvels of the king of India, such as counting the people of his city and paying them six months' provisions, and scattering dirhams and dinars from catapults, so that people whispered he was lying; Ibn Khaldun met the vizier Faris ibn Wadrar and expressed his doubts, and the vizier warned him not to deny what he had not seen, lest he be like the vizier's son raised in prison who thought every meat was mouse meat; Ibn Khaldun then lays down that one should distinguish the possible from the impossible by sound reason, meaning possibility according to a thing's matter, not absolute logical possibility." }
