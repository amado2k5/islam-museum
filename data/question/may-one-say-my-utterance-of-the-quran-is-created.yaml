    stance: { ar: "لا يقال لفظي بالقرآن مخلوق، ولا يسع الوقف بعد ما تكلم الناس", en: "One may not say 'my utterance of the Qur'an is created', nor suspend judgement once people have spoken", ur: "نہ یہ کہا جائے کہ قرآن کے ساتھ میرا تلفظ مخلوق ہے، نہ لوگوں کے بات کرنے کے بعد توقف کی گنجائش ہے" }
    summary: { ar: "سئل عمن قال التلاوة مخلوقة وألفاظنا بالقرآن مخلوقة والقرآن كلام الله ليس بمخلوق فقال: يجانب، وهو قول المبتدع، وهذا كلام الجهمية؛ وفي الواقفة واللفظية: من كان يخاصم ويعرف بالكلام فهو جهمي، ومن لم يعرف بالكلام يجانب حتى يرجع، ومن لم يكن له علم يسأل ويتعلم.", en: "Asked about one who says recitation is created, our utterances of the Qur'an are created and the Qur'an is God's uncreated speech, he said: he is to be shunned; this is the innovator's view and the speech of the Jahmiyya. On the Waqifa and the Lafziyya: whoever disputes and is known for theology is a Jahmi; whoever is not known for it is shunned until he returns; whoever has no knowledge is to ask and learn.", ur: "ان سے اس شخص کے بارے میں پوچھا گیا جو کہے کہ تلاوت مخلوق ہے، قرآن کے ساتھ ہمارے الفاظ مخلوق ہیں اور قرآن اللہ کا غیر مخلوق کلام ہے، تو فرمایا: اس سے دوری اختیار کی جائے، یہ بدعتی کا قول اور جہمیہ کا کلام ہے۔ واقفہ اور لفظیہ کے بارے میں: جو جھگڑا کرے اور کلام میں معروف ہو وہ جہمی ہے؛ جو کلام میں معروف نہ ہو اس سے رجوع تک دوری اختیار کی جائے؛ اور جس کے پاس علم نہ ہو وہ پوچھے اور سیکھے۔" }
