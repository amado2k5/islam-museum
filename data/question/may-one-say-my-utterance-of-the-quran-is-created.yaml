id: question/may-one-say-my-utterance-of-the-quran-is-created
class: question
label: { ar: "هل يقال: لفظي بالقرآن مخلوق؟ وهل يسع الوقف في خلق القرآن؟", en: "May one say 'my utterance of the Qur'an is created', or suspend judgement on its createdness?", ur: "کیا کہا جائے کہ «قرآن کے ساتھ میرا تلفظ مخلوق ہے»، یا اس کے مخلوق ہونے میں توقف کیا جائے؟" }
summary:
  ar: "بعد محنة خلق القرآن ظهر قولان عدّهما أحمد بن حنبل فيما يروى عنه من فرق الجهمية: قول «اللفظية» إن القرآن كلام الله غير مخلوق لكن ألفاظنا به وتلاوتنا مخلوقة، وينسب إلى حسين الكرابيسي، وقول «الواقفة» الذين يقولون كلام الله ولا يقولون مخلوق ولا غير مخلوق. يروي ابنه عبد الله في كتاب السنة إنكاره للقولين وتفصيله في حكم أصحابهما."
  en: "After the inquisition over the createdness of the Qur'an two positions appeared that Ahmad ibn Hanbal, in reports from him, counted among the branches of the Jahmiyya: that of the 'Lafziyya', that the Qur'an is God's uncreated speech but our utterance and recitation of it are created – attributed to Husayn al-Karabisi – and that of the 'Waqifa', who say 'God's speech' but neither 'created' nor 'uncreated'. His son Abd Allah's Kitab al-Sunna relates his rejection of both and his distinctions in judging those who held them."
question: { ar: "هل يقال: لفظي بالقرآن مخلوق؟ وهل يسع الوقف في خلق القرآن؟", en: "May one say 'my utterance of the Qur'an is created', or suspend judgement on its createdness?", ur: "کیا کہا جائے کہ «قرآن کے ساتھ میرا تلفظ مخلوق ہے»، یا اس کے مخلوق ہونے میں توقف کیا جائے؟" }
issue: { ar: "حكم القول بخلق اللفظ بالقرآن، والتوقف في كون القرآن مخلوقاً أو غير مخلوق.", en: "The ruling on saying that one's utterance of the Qur'an is created, and on suspending judgement whether the Qur'an is created or not.", ur: "قرآن کے تلفظ کو مخلوق کہنے، اور قرآن کے مخلوق یا غیر مخلوق ہونے میں توقف کرنے کا حکم۔" }
short_answer:
  ar: "أحمد بن حنبل فيما يرويه ابنه: القولان من قول جهم، ويجانب صاحبهما؛ ومن كان منهم يحسن الكلام فهو جهمي، والجاهل يُعلَّم. اللفظية والواقفة كما ينقلهم خصومهم: التلاوة مخلوقة والمتلو غير مخلوق، أو السكوت عن الوصف."
  en: "Ahmad ibn Hanbal as his son reports him: both views come from Jahm's doctrine and their holders are to be shunned; one of them versed in theology is a Jahmi, and the ignorant person is to be taught. The Lafziyya and the Waqifa as their opponents report them: recitation is created and what is recited is not, or silence about the description."
  ur: "احمد بن حنبل، ان کے بیٹے کی روایت میں: دونوں قول جہم کے قول سے ہیں اور ان کے قائل سے دوری اختیار کی جائے؛ ان میں جو کلام جانتا ہو وہ جہمی ہے، اور جاہل کو سکھایا جائے۔ لفظیہ اور واقفہ، ان کے مخالفین کی نقل میں: تلاوت مخلوق ہے اور متلو غیر مخلوق، یا وصف سے خاموشی۔"
