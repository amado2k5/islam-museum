id: question/riwayat-ahl-al-bida
class: question
label:
  ar: "هل تُقبل رواية أهل البدع؟"
  en: "Is narration from people of innovation accepted?"
summary:
  ar: "مسألة في نقد الرواة: إذا كان الراوي صادقاً حافظاً لكنه على بدعة في الاعتقاد، كالتشيع أو القدر أو رأي الخوارج، فهل يُروى عنه؟ ينقل الذهبي في مقدمة «ميزان الاعتدال» عن ابن سيرين أن المتقدمين صاروا بعد الفتنة يأخذون حديث أهل السنة ويتركون حديث أهل البدع، ويقسم هو البدعة إلى صغرى يُحتمل أصحابها لصدقهم وكبرى لا يُحتج بأصحابها."
  en: "A question in the criticism of transmitters: if a transmitter is truthful and retentive but holds an innovation in belief, such as Shi'ism, the Qadari view or the view of the Kharijites, is he narrated from? In the introduction to Mizan al-I'tidal al-Dhahabi reports from Ibn Sirin that after the civil strife the early scholars took the hadith of the people of the Sunna and left that of the people of innovation, and he himself divides innovation into a lesser kind, whose holders are borne with for their truthfulness, and a greater kind, whose holders are not relied on."
wings: [ideas, words]
themes: [scripture-and-its-sciences, sects-and-schools]
question:
  ar: "هل تُقبل رواية الراوي الصادق إذا كان على بدعة؟"
  en: "Is a truthful transmitter's narration accepted if he holds an innovation?"
issue:
  ar: "أثر بدعة الراوي في قبول حديثه عند نقاد أهل السنة، والفرق بين البدعة الصغرى والكبرى."
  en: "How a transmitter's innovation bears on accepting his hadith among Sunni critics, and the difference between lesser and greater innovation."
short_answer:
  ar: "نقاد أهل السنة لم يقفوا موقفاً واحداً: نُقل عن ابن سيرين ترك حديث أهل البدع بعد الفتنة، ونُقل عن الحسن النهي عن مجالستهم، ويرى الذهبي أن البدعة الصغرى كالتشيع بلا غلو لا تُسقط الصادق، وأن البدعة الكبرى كالرفض الكامل والدعاء إليه تُسقط الاحتجاج به."
  en: "Sunni critics did not take a single position: Ibn Sirin is reported as describing the leaving of the hadith of the people of innovation after the strife, al-Hasan is reported as forbidding sitting with them, and al-Dhahabi holds that a lesser innovation, such as Shi'ism without excess, does not bring down a truthful man, while a greater innovation, such as complete rafd and calling to it, removes him from being relied on."
perspectives:
  - tradition: sunni
    id: sunni-ibn-sirin-isnad
    standing: main
    stance:
      ar: "بعد الفتنة يؤخذ حديث أهل السنة ويُترك حديث أهل البدع"
      en: "After the strife, the hadith of the people of the Sunna is taken and that of the people of innovation is left"
    summary:
      ar: "ينقل الذهبي عن عاصم الأحول عن محمد بن سيرين أن الناس لم يكونوا يسألون عن الإسناد، فلما وقعت الفتنة طلبوا تسمية الرجال، فمن كان من أهل السنة أخذوا حديثه ومن كان من أهل البدع تركوه؛ ويذكر عن الحسن النهي عن مجالسة أهل الأهواء والسماع منهم."
      en: "Al-Dhahabi reports, through Asim al-Ahwal, Muhammad ibn Sirin's account that people did not ask about chains until the strife came, after which they asked for the men to be named, taking the hadith of those of the people of the Sunna and leaving that of the people of innovation; he also reports al-Hasan forbidding sitting with the people of caprice and hearing from them."
    holders: [person/muhammad-ibn-sirin]
    evidence:
      - { ref: source/mizan-itidal-azimabadi-v1, note: { ar: "مقدمة الميزان، الطبعة الحجرية، ص 6–7 من المسح.", en: "Introduction to the Mizan, lithograph, PDF pp. 6–7." } }
    sources: [source/mizan-itidal-azimabadi-v1]
  - tradition: sunni
    id: sunni-dhahabi-lesser-greater
    standing: main
    stance:
      ar: "البدعة الصغرى لا تُسقط الصادق، والكبرى تُسقط الاحتجاج"
      en: "A lesser innovation does not bring down a truthful man; a greater one removes him from being relied on"
    summary:
      ar: "يقسم الذهبي البدعة إلى صغرى كالتشيع بغلو أو بلا غلو، وكانت كثيرة في التابعين وتابعيهم مع الدين والورع والصدق، فلو رُدّ حديثهم لذهبت جملة من الآثار؛ وكبرى كالرفض الكامل والغلو فيه والحط على أبي بكر وعمر والدعاء إليه، فلا يُحتج بأصحابها. وبهذا يفسر توثيق أحمد وابن معين وأبي حاتم لأبان بن تغلب مع تشيعه."
      en: "Al-Dhahabi divides innovation into the lesser, such as Shi'ism with or without excess, which was widespread among the Successors and their followers together with religion, piety and truthfulness, so that rejecting their hadith would lose a body of reports; and the greater, such as complete rafd, excess in it, disparaging Abu Bakr and Umar and calling to it, whose holders are not relied on. In this way he explains why Ahmad, Ibn Ma'in and Abu Hatim declared Aban ibn Taghlib trustworthy despite his Shi'ism."
    holders: [person/al-dhahabi]
    evidence:
