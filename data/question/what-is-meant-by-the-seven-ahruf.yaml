id: question/what-is-meant-by-the-seven-ahruf
class: question
label:
  ar: ما المراد بالأحرف السبعة؟
  en: What is meant by the seven ahruf?
  ur: سات احرف سے کیا مراد ہے؟
summary:
  ar: "اختلف العلماء في معنى «أنزل القرآن على سبعة أحرف» حتى بلغ بعضهم خمسة وثلاثين قولاً عند ابن حبان وأربعين عند غيره؛ ومن أشهرها سبعة أوجه من الاختلاف في القراءة، أو سبعة ألفاظ مترادفة للمعنى الواحد، أو سبع لغات للعرب، أو سبعة أصناف من المعاني، وقيل العدد للتكثير، وقيل الحديث مشكل {cite:itqan-suyuti p. 328} {cite:manahil-irfan-sabt p. 173} {cite:manahil-irfan-sabt p. 193}."
  en: "Scholars differed over the meaning of 'the Qur'an was revealed in seven ahruf' until the number of views reached thirty-five in Ibn Hibban and forty in others; among the best known are seven kinds of variation in reading, seven synonymous wordings for one meaning, seven dialects of the Arabs, seven kinds of content, the number as a figure of plenty, and the view that the hadith is unclear {cite:itqan-suyuti p. 328} {cite:manahil-irfan-sabt p. 173} {cite:manahil-irfan-sabt p. 193}."
  ur: "«قرآن سات احرف پر نازل ہوا» کے معنی میں علماء میں اختلاف ہوا یہاں تک کہ ابن حبان کے ہاں پینتیس اور دوسروں کے ہاں چالیس اقوال تک پہنچا؛ مشہور ترین میں سے ہیں: قراءت کے اختلاف کی سات صورتیں، ایک معنی کے سات مترادف الفاظ، عرب کی سات لغات، معانی کی سات اقسام، عدد کا کثرت کے لیے ہونا، اور یہ کہ حدیث مشکل ہے {cite:itqan-suyuti p. 328} {cite:manahil-irfan-sabt p. 173} {cite:manahil-irfan-sabt p. 193}۔"
question:
  ar: ما المقصود بقول النبي إن القرآن أُنزل على سبعة أحرف؟
  en: What did the Prophet mean in saying the Qur'an was revealed in seven ahruf?
  ur: نبی کے اس قول کا کیا مطلب ہے کہ قرآن سات احرف پر نازل ہوا؟
short_answer:
  ar: "لا قول فصل: يختار السبت سبعة أوجه من وجوه الاختلاف في القراءة، ويرى جمهور الفقهاء والمحدثين، فيما ينسب إليهم، سبعة ألفاظ لمعنى واحد، ويردّ ابن الجزري القول بلغات متفرقة بأن عمر وهشاماً قرشيان، ويتفق العلماء على أن المراد ليس القراءات السبع المشهورة."
  en: "There is no decisive view: al-Sabt chooses seven kinds of variation in reading; the majority of jurists and hadith scholars, as ascribed to them, hold seven wordings for one meaning; Ibn al-Jazari answers the dialect view by noting Umar and Hisham were both Qurashi; and scholars agree it does not mean the seven famous readings."
  ur: "کوئی فیصلہ کن قول نہیں: سبت قراءت کے اختلاف کی سات صورتیں اختیار کرتے ہیں؛ جمہور فقہاء و محدثین، جو ان کی طرف منسوب ہے، ایک معنی کے سات الفاظ کہتے ہیں؛ ابن الجزری لغات والے قول کا جواب دیتے ہیں کہ عمر و ہشام دونوں قریشی تھے؛ اور علماء متفق ہیں کہ اس سے مراد مشہور سات قراءتیں نہیں۔"
