issue:
  ar: معنى «سبعة أحرف» في حديث نزول القرآن
  en: The meaning of 'seven ahruf' in the hadith on the revelation of the Qur'an
  ur: نزولِ قرآن کی حدیث میں «سبعہ احرف» کا مفہوم
perspectives:
- tradition: sunni
  id: seven-kinds-of-variation
  standing: main
  stance:
    ar: سبعة أوجه يرجع إليها كل اختلاف في القراءة
    en: Seven kinds of variation to which every difference of reading returns
    ur: قراءت کے ہر اختلاف کی طرف لوٹنے والی سات صورتیں
  summary:
    ar: "يختار خالد السبت قول أبي الفضل الرازي: اختلاف الأسماء إفراداً وتثنية وجمعاً وتذكيراً وتأنيثاً، واختلاف تصريف الأفعال، واختلاف وجوه الإعراب، والاختلاف بالنقص والزيادة، وبالتقديم والتأخير، وبالإبدال، واختلاف اللهجات كالفتح والإمالة. وهي قريبة من وجوه سبعة لابن قتيبة؛ ويقول السبت إن الأوفى استقراءً هو الرازي، ثم يقترح أن الأفضل ترك حصر الأوجه والتمثيل لها، لأن تحديدها بالاستقراء لا يستوفي ما نزل {cite:manahil-irfan-sabt p. 173} {cite:manahil-irfan-sabt p. 174} {cite:manahil-irfan-sabt p. 178}."
    en: "Khalid al-Sabt chooses the view of Abu al-Fadl al-Razi: difference of nouns in singular, dual, plural, masculine and feminine; difference in the conjugation of verbs; difference of case endings; difference by omission and addition; by advancing and delaying; by substitution; and difference of dialect such as fath and imala. It is close to Ibn Qutayba's seven kinds; al-Sabt says al-Razi is the fullest in induction, then suggests it is better to leave off fixing the kinds and only exemplify them, since fixing them by induction cannot cover all that was revealed {cite:manahil-irfan-sabt p. 173} {cite:manahil-irfan-sabt p. 174} {cite:manahil-irfan-sabt p. 178}."
    ur: "خالد السبت ابو الفضل رازی کا قول اختیار کرتے ہیں: اسماء کا اختلاف افراد، تثنیہ، جمع، تذکیر و تانیث میں؛ افعال کی تصریف کا اختلاف؛ اعراب کی وجوہ کا اختلاف؛ کمی اور زیادتی سے اختلاف؛ تقدیم و تاخیر سے؛ ابدال سے؛ اور لہجوں کا اختلاف جیسے فتح اور امالہ۔ یہ ابن قتیبہ کی سات وجوہ سے قریب ہے؛ سبت کہتے ہیں کہ رازی استقراء میں سب سے مکمل ہیں، پھر تجویز کرتے ہیں کہ بہتر ہے وجوہ کی حصر بندی چھوڑ کر ان کی مثالیں دی جائیں، کیونکہ استقراء سے ان کی تحدید اس سب کو نہیں سمیٹتی جو نازل ہوا {cite:manahil-irfan-sabt p. 173} {cite:manahil-irfan-sabt p. 174} {cite:manahil-irfan-sabt p. 178}۔"
  sources:
  - source/manahil-irfan-sabt
  holders:
  - person/ibn-qutayba
- tradition: sunni
  id: seven-synonymous-wordings
  standing: secondary
  stance:
    ar: سبعة ألفاظ مترادفة للمعنى الواحد
    en: Seven synonymous wordings for one meaning
    ur: ایک معنی کے سات مترادف الفاظ
  summary:
    ar: "ينسبه السبت إلى جمهور أهل الفقه والحديث، منهم سفيان وابن وهب وابن جرير الطبري والطحاوي، ويحتج بحديث أبي بكرة «كلها شاف كاف ما لم تختم آية عذاب برحمة»، وبأن أبياً كان يقرأ بمرادفات، وبأن ابن عبد البر عدّه ضرب مثل. ويجيب السبت بأن الأمثلة ليست حصراً، وأن هذا المذهب يلزم منه أن الباقي حرف واحد من السبعة وقد ذهبت ستة {cite:manahil-irfan-sabt p. 189} {cite:manahil-irfan-sabt p. 190} {cite:manahil-irfan-sabt p. 158}."
    en: "Al-Sabt ascribes it to the majority of the people of jurisprudence and hadith, including Sufyan, Ibn Wahb, Ibn Jarir al-Tabari and al-Tahawi, who argue from the hadith of Abu Bakra 'each is healing and sufficient so long as a verse of punishment is not sealed with mercy', and from Ubayy's reading synonyms; Ibn Abd al-Barr counted it an example. Al-Sabt replies that the examples are not a limit and that this view requires that of the seven only one harf survives, six having gone {cite:manahil-irfan-sabt p. 189} {cite:manahil-irfan-sabt p. 190} {cite:manahil-irfan-sabt p. 158}."
    ur: "سبت اسے جمہور اہلِ فقہ و حدیث کی طرف منسوب کرتے ہیں، جن میں سفیان، ابن وہب، ابن جریر طبری اور طحاوی شامل ہیں، جو ابو بکرہ کی حدیث «ہر ایک شفا بخش اور کافی ہے جب تک عذاب کی آیت کو رحمت سے ختم نہ کیا جائے» اور ابی کے مرادفات پڑھنے سے دلیل لاتے ہیں؛ ابن عبد البر نے اسے مثال کے طور پر لیا۔ سبت جواب دیتے ہیں کہ مثالیں حصر نہیں، اور اس مذہب سے لازم آتا ہے کہ سات میں سے ایک ہی حرف باقی ہو اور چھ جاتے رہے {cite:manahil-irfan-sabt p. 189} {cite:manahil-irfan-sabt p. 190} {cite:manahil-irfan-sabt p. 158}۔"
  sources:
  - source/manahil-irfan-sabt
  holders:
  - person/al-tabari
- tradition: sunni
  id: seven-arab-dialects
  standing: secondary
  stance:
    ar: سبع لغات من لغات العرب
    en: Seven dialects of the Arabs
    ur: عرب کی سات لغات
  summary:
    ar: "يقول أبو عبيد: قريش وهذيل وثقيف وهوازن وكنانة وتميم واليمن؛ وقيل سبع لغات من مضر: قريش وكنانة وأسد وهذيل وتميم وضبة وقيس؛ وقيل خمس في أكناف هوازن ولغتان لجميع العرب. ويرد ابن الجزري والسبت بأن عمر وهشام بن حكيم قرشيان من لغة واحدة وقبيلة واحدة ومع ذلك اختلفا، وبأن علة جمع عثمان الاختلاف نفسه، وبأن في لغات مضر ما يُنزّه عنه القرآن كالكشكشة والتمتمة {cite:nashr-dahman-damascus-1345-v1 p. 34} {cite:manahil-irfan-sabt p. 192} {cite:manahil-irfan-sabt p. 193}."
    en: "Abu Ubayd names Quraysh, Hudhayl, Thaqif, Hawazin, Kinana, Tamim and Yemen; another list is seven dialects of Mudar: Quraysh, Kinana, Asad, Hudhayl, Tamim, Dabba and Qays; another is five from the sides of Hawazin and two common to all the Arabs. Ibn al-Jazari and al-Sabt reply that Umar and Hisham ibn Hakim were both Qurashi, of one idiom and tribe, yet differed; that the cause of Uthman's collection was the very disagreement; and that Mudar's dialects include features the Qur'an is above, such as kashkasha and tamtama {cite:nashr-dahman-damascus-1345-v1 p. 34} {cite:manahil-irfan-sabt p. 192} {cite:manahil-irfan-sabt p. 193}."
    ur: "ابو عبید کہتے ہیں: قریش، ہذیل، ثقیف، ہوازن، کنانہ، تمیم اور یمن؛ ایک اور قول مضر کی سات لغات ہیں: قریش، کنانہ، اسد، ہذیل، تمیم، ضبہ اور قیس؛ اور ایک اور قول: ہوازن کے اطراف میں پانچ اور دو تمام عرب کی۔ ابن الجزری اور سبت جواب دیتے ہیں کہ عمر اور ہشام بن حکیم دونوں قریشی تھے، ایک لغت اور قبیلے کے، پھر بھی مختلف ہوئے؛ عثمان کے جمع کا سبب خود یہی اختلاف تھا؛ اور مضر کی لغات میں ایسی چیزیں ہیں جن سے قرآن پاک ہے جیسے کشکشہ اور تمتمہ {cite:nashr-dahman-damascus-1345-v1 p. 34} {cite:manahil-irfan-sabt p. 192} {cite:manahil-irfan-sabt p. 193}۔"
  sources:
  - source/nashr-dahman-damascus-1345-v1
  - source/manahil-irfan-sabt
  holders:
  - person/abu-ubayd-al-qasim-ibn-sallam
- tradition: sunni
  id: seven-kinds-of-content
  standing: secondary
  stance:
    ar: "سبعة أصناف من المعاني: أمر ونهي ووعد ووعيد وحلال وحرام وغيرها"
    en: "Seven kinds of content: command, prohibition, promise, warning, lawful, forbidden and others"
    ur: "معانی کی سات اقسام: امر، نہی، وعد، وعید، حلال، حرام وغیرہ"
  summary:
    ar: "تتعدد تعيينات الأصناف: أمر ونهي وحلال وحرام ومحكم ومتشابه وأمثال؛ أو وعد ووعيد وحلال وحرام ومواعظ وأمثال واحتجاج؛ أو محكم ومتشابه وناسخ ومنسوخ وخصوص وعموم وقصص؛ وغيرها، حتى بلغ بعضهم أربعين قولاً؛ ويستدلون بحديث «نزل القرآن من سبعة أبواب على سبعة أحرف: حلال وحرام ومحكم ومتشابه وأمثال وآمر وزاجر». ويردّ السبت بأن سياق الأحاديث يدل على أن الاختلاف كان في القراءة لا في هذه الأصناف، وبأنه لا سند صحيح لحصرها بذلك. ويجيب ابن الجزري عن الحديث بثلاثة أوجه، منها أن هذه السبعة غير الأحرف المذكورة في الأحاديث الأخرى {cite:manahil-irfan-sabt p. 193} {cite:manahil-irfan-sabt p. 194} {cite:nashr-dahman-damascus-1345-v1 p. 35}."
    en: "The assignments of the kinds vary: command, prohibition, lawful, forbidden, clear and ambiguous, parables; or promise, warning, lawful, forbidden, exhortations, parables, argument; or clear and ambiguous, abrogating and abrogated, particular and general, stories; and others, until some reached forty views; they rely on the hadith 'the Qur'an came down from seven doors in seven ahruf: lawful, forbidden, clear, ambiguous, parables, commanding, forbidding'. Al-Sabt replies that the context of the hadiths shows the difference was in the reading, not in such kinds, and that no sound chain limits the ahruf to them. Ibn al-Jazari answers the hadith in three ways, among them that these seven are not the ahruf mentioned in the other hadiths {cite:manahil-irfan-sabt p. 193} {cite:manahil-irfan-sabt p. 194} {cite:nashr-dahman-damascus-1345-v1 p. 35}."
    ur: "اقسام کی تعیین میں اختلاف ہے: امر، نہی، حلال، حرام، محکم، متشابہ، امثال؛ یا وعد، وعید، حلال، حرام، مواعظ، امثال، احتجاج؛ یا محکم و متشابہ، ناسخ و منسوخ، خصوص و عموم، قصص؛ اور دوسرے، یہاں تک کہ بعض نے چالیس اقوال گنے؛ وہ اس حدیث سے استدلال کرتے ہیں «قرآن سات دروازوں سے سات احرف پر اترا: حلال، حرام، محکم، متشابہ، امثال، آمر اور زاجر»۔ سبت جواب دیتے ہیں کہ احادیث کا سیاق بتاتا ہے کہ اختلاف قراءت میں تھا نہ کہ ان اقسام میں، اور ان میں حصر کی کوئی صحیح سند نہیں۔ ابن الجزری حدیث کا جواب تین طرح دیتے ہیں جن میں سے ایک یہ ہے کہ یہ سات ان احرف سے الگ ہیں جو دوسری احادیث میں مذکور ہیں {cite:manahil-irfan-sabt p. 193} {cite:manahil-irfan-sabt p. 194} {cite:nashr-dahman-damascus-1345-v1 p. 35}۔"
  sources:
  - source/manahil-irfan-sabt
  - source/nashr-dahman-damascus-1345-v1
- tradition: sunni
  id: seven-as-plenty
  standing: secondary
  stance:
    ar: السبعة كناية عن الكثرة لا حقيقة العدد
    en: Seven stands for plenty, not a literal number
    ur: سات سے مراد کثرت ہے نہ کہ حقیقی عدد
  summary:
    ar: "يعرض السبت قول من جعل «السبعة» كناية عن الكثرة في الآحاد كما تُستعمل السبعون في العشرات والسبعمائة في المئات، ويردّه بما قدمه من شواهد؛ وينقل ابن الجزري هذا القول ويقول: «وهذا جيد لولا أن الحديث يأباه»، ويذكر أن الأكثرين قالوا إن أصول قبائل العرب تنتهي إلى سبعة أو إن اللغات الفصحى سبع، «وكلاهما دعوى» {cite:manahil-irfan-sabt p. 188} {cite:nashr-dahman-damascus-1345-v1 p. 35}."
    en: "Al-Sabt records the view that seven stands for plenty among the units, as seventy is used for tens and seven hundred for hundreds, and answers it by the evidence he gave earlier; Ibn al-Jazari relays it and says 'this is good were it not that the hadith refuses it', adding that most said the roots of the Arab tribes come to seven, or that the eloquent dialects are seven, 'and both are claims' {cite:manahil-irfan-sabt p. 188} {cite:nashr-dahman-damascus-1345-v1 p. 35}."
    ur: "سبت وہ قول بیان کرتے ہیں جس میں «سات» اکائیوں میں کثرت سے کنایہ ہے، جیسے ستر دہائیوں میں اور سات سو سیکڑوں میں بولا جاتا ہے، اور اپنے پہلے شواہد سے اس کا رد کرتے ہیں؛ ابن الجزری یہ قول نقل کرتے ہیں اور کہتے ہیں «یہ اچھا ہوتا اگر حدیث اسے نہ ٹھکراتی»، اور بتاتے ہیں کہ اکثر نے کہا عرب قبائل کی اصل سات تک پہنچتی ہے یا فصیح لغات سات ہیں، «اور دونوں دعوے ہیں» {cite:manahil-irfan-sabt p. 188} {cite:nashr-dahman-damascus-1345-v1 p. 35}۔"
  sources:
  - source/manahil-irfan-sabt
  - source/nashr-dahman-damascus-1345-v1
- tradition: sunni
  id: hadith-is-unclear
  standing: secondary
  stance:
    ar: الحديث مشكل لا يُعرف معناه
    en: The hadith is unclear and its meaning cannot be known
    ur: حدیث مشکل ہے اور اس کا معنی معلوم نہیں ہو سکتا
  summary:
    ar: "يذكر السبت أول الأقوال الأخرى: أن الحديث مشكل لأن لفظ «أحرف» جمع حرف والحرف مشترك لفظي بين معان كثيرة، ويذكر رواية عن ابن حبان أن الخلاف بلغ خمسة وثلاثين قولاً؛ ويردّه بأن المشترك اللفظي يتعين معناه بالقرينة، وسياق الروايات يدل على أن المراد الوجه {cite:manahil-irfan-sabt p. 187} {cite:manahil-irfan-sabt p. 188} {cite:itqan-suyuti p. 328}."
    en: "Al-Sabt gives as the first of the other views that the hadith is unclear because 'ahruf' is the plural of 'harf' and 'harf' is a word with many senses; Ibn Hibban is reported as putting the views at thirty-five; al-Sabt answers that a word with several senses is fixed by context, and the context of the reports shows the sense is 'mode' {cite:manahil-irfan-sabt p. 187} {cite:manahil-irfan-sabt p. 188} {cite:itqan-suyuti p. 328}."
    ur: "سبت دوسرے اقوال میں سب سے پہلے یہ بتاتے ہیں کہ حدیث مشکل ہے کیونکہ «احرف» حرف کی جمع ہے اور «حرف» کئی معانی میں مشترک لفظ ہے؛ ابن حبان سے مروی ہے کہ اختلاف پینتیس اقوال تک پہنچا؛ سبت جواب دیتے ہیں کہ مشترک لفظ کا معنی قرینے سے متعین ہوتا ہے، اور روایات کا سیاق بتاتا ہے کہ مراد «وجہ» ہے {cite:manahil-irfan-sabt p. 187} {cite:manahil-irfan-sabt p. 188} {cite:itqan-suyuti p. 328}۔"
