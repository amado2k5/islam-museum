      en: "Some held that they do occur in it, and that being few they do not take the Qur'an out of being clear Arabic, nor the Prophet out of speaking his people's tongue; they gave examples they ascribed to Abyssinian, Turkish, Greek, Persian and Syriac. {cite:jami-ahkam-quran-resala-v1 p.110} {cite:jami-ahkam-quran-resala-v1 p.111}"
