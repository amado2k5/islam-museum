id: question/does-the-quran-contain-non-arabic-words
class: question
label:
  ar: "هل في القرآن ألفاظ من غير لغة العرب؟"
  en: "Does the Qur'an contain words from languages other than Arabic?"
  ur: "کیا قرآن میں عربی کے علاوہ دوسری زبانوں کے الفاظ ہیں؟"
  es: "¿Contiene el Corán palabras de idiomas distintos del árabe?"
  fr: "Le Coran contient-il des mots provenant d'autres langues que l'arabe ?"
  tr: "Kur'an'da Arapça dışında başka kelimeler var mı?"
  id: "Apakah ada kata-kata dalam Al-Quran selain bahasa Arab?"
summary:
  ar: "لا خلاف عند القرطبي في أن القرآن ليس فيه كلام مركب على غير أساليب العرب، وأن فيه أعلامًا أعجمية كإسرائيل وجبريل؛ والخلاف في الألفاظ المفردة غير الأعلام: نفاها الباقلاني والطبري وجعلاها مما توافقت فيه اللغات، وأثبتها آخرون قليلة لا تخرجه عن العربية، وجعلها ابن عطية أعجمية الأصل عرّبتها العرب."
  en: "For al-Qurtubi there is no disagreement that the Qur'an contains no speech composed in non-Arab styles and that it contains foreign proper names such as Isra'il and Jibril; the disagreement is over single words other than names: al-Baqillani and al-Tabari deny them, calling them words in which languages coincided; others accept a few that do not stop the Qur'an being Arabic; Ibn Atiyya holds they were foreign in origin and Arabized by the Arabs."
  ur: "قرطبی کے نزدیک اس میں کوئی اختلاف نہیں کہ قرآن میں غیر عرب اسالیب پر مرکب کلام نہیں اور اس میں اسرائیل اور جبریل جیسے عجمی اعلام ہیں؛ اختلاف اعلام کے سوا مفرد الفاظ میں ہے: باقلانی اور طبری ان کا انکار کرتے اور انہیں زبانوں کا اتفاق قرار دیتے ہیں، دوسرے چند الفاظ مانتے ہیں جو قرآن کو عربی ہونے سے خارج نہیں کرتے، اور ابن عطیہ انہیں اصلاً عجمی مانتے ہیں جنہیں عربوں نے معرب کر لیا۔"
  es: "Para al-Qurtubi no hay desacuerdo en que el Corán no contiene discursos compuestos en estilos no árabes y que contiene nombres propios extranjeros como Isra'il y Jibril; el desacuerdo radica en palabras sueltas que no son nombres propios: al-Baqillani y al-Tabari las niegan, llamándolas palabras en las que coincidieron lenguas; otros aceptan algunas que no impiden que el Corán sea árabe; Ibn Atiyya sostiene que eran de origen extranjero y que los árabes las arabizaron."
  fr: "Pour al-Qurtubi, il n'y a pas de désaccord sur le fait que le Coran ne contient aucun discours composé dans des styles non arabes et qu'il contient des noms propres étrangers tels qu'Isra'il et Jibril; le désaccord porte sur des mots isolés autres que les noms: al-Baqillani et al-Tabari les nient, les considérant comme des mots dont les langues ont coïncidé; d'autres en acceptent quelques-uns qui ne remettent pas en cause le caractère arabe du Coran; Ibn Atiyya soutient qu'ils étaient d'origine étrangère et arabisés par les Arabes."
  tr: "Kurtubi ile Kurtubi ile ilgili olarak, Kur'an'ın Araplar dışında bileşik konuşma içermediği ve İsra'il ile Cebrail gibi yabancı isimler içerdiği konusunda bir anlaşmazlık yoktur; özel isimler dışındaki tekil kelimelerle ilgili anlaşmazlık, el-Baqillani ve el-Taberi'nin bunları kabul edilebilir diller olarak reddetmeleri, ancak Arapçadan sapmayan birkaç kişinin onları doğrulamasıdır. İbn Etiyyah onları yabancı orijinal olarak Araplar tarafından Araplaştırmıştır."
  id: "Tidak ada perbedaan pendapat dengan Al-Qurtubi bahwa Al-Qur'an tidak mengandung bahasa gabungan selain bahasa Arab, dan bahwa Al-Qur'an mengandung nama asing seperti Isra'il dan Gabriel; perbedaan pendapat mengenai kata tunggal selain nama yang benar adalah bahwa al-Baqillani dan al-Tabari menyangkalnya, menganggapnya sebagai bahasa yang menyenangkan, sementara beberapa lainnya mengonfirmasi bahwa kata-kata tersebut tidak menyimpang dari bahasa Arab. Ibn Atiyyah menjadikannya asli asing, diarabadikan oleh orang Arab."
question:
  ar: "هل وقعت في القرآن ألفاظ مفردة غير الأعلام من غير كلام العرب؟"
  en: "Are there single words, other than proper names, in the Qur'an that do not come from the speech of the Arabs?"
  ur: "کیا قرآن میں اعلام کے سوا ایسے مفرد الفاظ ہیں جو عربوں کے کلام سے نہیں؟"
short_answer:
  ar: "ثلاثة أقوال سنية ينقلها القرطبي: النفي مع القول بتوافق اللغات ⁦(الباقلاني والطبري)⁩، والإثبات مع القلة ⁦(بعضهم)⁩، والتعريب ⁦(ابن عطية)⁩."
  en: "Al-Qurtubi reports three Sunni views: denial, with the languages coinciding (al-Baqillani and al-Tabari); acceptance of a few (some scholars); and Arabization (Ibn Atiyya)."
  ur: "قرطبی تین سنی اقوال نقل کرتے ہیں: انکار، زبانوں کے اتفاق کے قول کے ساتھ ⁦(باقلانی اور طبری)⁩؛ چند الفاظ کا اقرار ⁦(بعض علماء)⁩؛ اور تعریب ⁦(ابن عطیہ)⁩۔"
