    summary:
      ar: "ذهب القاضي أبو بكر بن الطيب ([[person/al-baqillani|الباقلاني]]) و[[person/al-tabari|الطبري]] وغيرهما إلى أن ذلك لا يوجد في القرآن، وأن القرآن عربي صريح، وما وجد فيه من الألفاظ التي تنسب إلى سائر اللغات إنما اتفق فيها أن تواردت اللغات عليها، فتكلمت بها العرب والفرس والحبشة وغيرهم. {cite:jami-ahkam-quran-resala-v1 p.110}"
      en: "Qadi Abu Bakr ibn al-Tayyib ([[person/al-baqillani|al-Baqillani]]), [[person/al-tabari|al-Tabari]] and others held that such words are not found in the Qur'an, which is pure Arabic; the words ascribed to other languages are ones in which the languages happened to coincide, so that Arabs, Persians, Abyssinians and others all used them. {cite:jami-ahkam-quran-resala-v1 p.110}"
      ur: "قاضی ابو بکر ابن الطیب ([[person/al-baqillani|باقلانی]])، [[person/al-tabari|طبری]] اور دیگر کا موقف تھا کہ ایسے الفاظ قرآن میں نہیں، قرآن خالص عربی ہے؛ جو الفاظ دوسری زبانوں کی طرف منسوب ہیں ان میں اتفاقاً زبانیں ایک ہو گئیں، چنانچہ عرب، فارسی، حبشی اور دوسرے سب انہیں بولتے تھے۔ {cite:jami-ahkam-quran-resala-v1 p.110}"
