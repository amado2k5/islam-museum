    summary:
      ar: "ينقل القرطبي عن [[person/ibn-atiyah-al-andalusi|ابن عطية]] أن حقيقة العبارة عن هذه الألفاظ أنها في الأصل أعجمية، لكن العرب استعملتها وعرّبتها فهي عربية بهذا الوجه، لمخالطة العرب سائر الألسنة بالتجارات ورحلتي قريش والأسفار إلى الشام والحبشة والحيرة؛ وأن ما ذهب إليه الطبري من اتفاق اللغتين في لفظة لفظة بعيد، بل إحداهما أصل والأخرى فرع في الأكثر، مع جواز الاتفاق قليلًا شاذًّا. {cite:jami-ahkam-quran-resala-v1 p.111}"
      en: "Al-Qurtubi cites [[person/ibn-atiyah-al-andalusi|Ibn Atiyya]]: the true account of these words is that they were foreign in origin, but the Arabs used and Arabized them, so they are Arabic in that sense, through the Arabs' contact with other tongues in trade, Quraysh's two journeys, and travels to Syria, Abyssinia and al-Hira; al-Tabari's view that two languages coincided word for word is far-fetched — mostly one is the origin and the other derived, though a rare coincidence is possible. {cite:jami-ahkam-quran-resala-v1 p.111}"
      ur: "قرطبی [[person/ibn-atiyah-al-andalusi|ابن عطیہ]] سے نقل کرتے ہیں کہ ان الفاظ کی اصل حقیقت یہ ہے کہ وہ اصلاً عجمی تھے، مگر عربوں نے انہیں استعمال کیا اور معرب کر لیا، تو اس اعتبار سے وہ عربی ہیں، تجارت، قریش کے دو سفروں اور شام، حبشہ اور حیرہ کے سفروں میں دوسری زبانوں سے میل جول کی وجہ سے؛ اور طبری کا یہ قول کہ دو زبانیں لفظ بلفظ متفق ہو گئیں بعید ہے — اکثر ایک اصل اور دوسری فرع ہے، اگرچہ کبھی کبھار اتفاق ممکن ہے۔ {cite:jami-ahkam-quran-resala-v1 p.111}"
