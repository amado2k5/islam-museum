id: question/does-the-quran-contain-non-arabic-words
class: question
label:
  ar: "هل في القرآن ألفاظ من غير لغة العرب؟"
  en: "Does the Qur'an contain words from languages other than Arabic?"
  ur: "کیا قرآن میں عربی کے علاوہ دوسری زبانوں کے الفاظ ہیں؟"
summary:
  ar: "لا خلاف عند القرطبي في أن القرآن ليس فيه كلام مركب على غير أساليب العرب، وأن فيه أعلامًا أعجمية كإسرائيل وجبريل؛ والخلاف في الألفاظ المفردة غير الأعلام: نفاها الباقلاني والطبري وجعلاها مما توافقت فيه اللغات، وأثبتها آخرون قليلة لا تخرجه عن العربية، وجعلها ابن عطية أعجمية الأصل عرّبتها العرب."
  en: "For al-Qurtubi there is no disagreement that the Qur'an contains no speech composed in non-Arab styles and that it contains foreign proper names such as Isra'il and Jibril; the disagreement is over single words other than names: al-Baqillani and al-Tabari deny them, calling them words in which languages coincided; others accept a few that do not stop the Qur'an being Arabic; Ibn Atiyya holds they were foreign in origin and Arabized by the Arabs."
  ur: "قرطبی کے نزدیک اس میں کوئی اختلاف نہیں کہ قرآن میں غیر عرب اسالیب پر مرکب کلام نہیں اور اس میں اسرائیل اور جبریل جیسے عجمی اعلام ہیں؛ اختلاف اعلام کے سوا مفرد الفاظ میں ہے: باقلانی اور طبری ان کا انکار کرتے اور انہیں زبانوں کا اتفاق قرار دیتے ہیں، دوسرے چند الفاظ مانتے ہیں جو قرآن کو عربی ہونے سے خارج نہیں کرتے، اور ابن عطیہ انہیں اصلاً عجمی مانتے ہیں جنہیں عربوں نے معرب کر لیا۔"
question:
  ar: "هل وقعت في القرآن ألفاظ مفردة غير الأعلام من غير كلام العرب؟"
  en: "Are there single words, other than proper names, in the Qur'an that do not come from the speech of the Arabs?"
  ur: "کیا قرآن میں اعلام کے سوا ایسے مفرد الفاظ ہیں جو عربوں کے کلام سے نہیں؟"
short_answer:
  ar: "ثلاثة أقوال سنية ينقلها القرطبي: النفي مع القول بتوافق اللغات (الباقلاني والطبري)، والإثبات مع القلة (بعضهم)، والتعريب (ابن عطية)."
  en: "Al-Qurtubi reports three Sunni views: denial, with the languages coinciding (al-Baqillani and al-Tabari); acceptance of a few (some scholars); and Arabization (Ibn Atiyya)."
  ur: "قرطبی تین سنی اقوال نقل کرتے ہیں: انکار، زبانوں کے اتفاق کے قول کے ساتھ (باقلانی اور طبری)؛ چند الفاظ کا اقرار (بعض علماء)؛ اور تعریب (ابن عطیہ)۔"
