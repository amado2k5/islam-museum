id: question/what-is-adab
class: question
label:
  ar: ما الأدب في الإسلام؟
  en: What is adab in Islam?
  es: "¿Qué es el adab en el Islam?"
  fr: "Qu'est-ce que l'adab en Islam ?"
  ur: "اسلام میں ادب کیا ہے؟"
summary:
  ar: الأدب حسن الخلق وحسن المعاملة والتواضع ورفض السفه؛ أدب العالم بطلبه وأدب المعلم وأدب الطريق؛ مدار
    الإسلام عند السلف.
  en: "Adab is good character, good conduct, humility and rejection of folly. It includes the adab of the seeker of knowledge, the adab of the teacher and the adab of the road. In the view of the early scholars (al-salaf), it is the pivot of Islam."
  es: "Adab se refiere al buen carácter, la buena conducta, la humildad y el rechazo a la necedad. Incluye el adab del buscador de conocimiento, el adab del maestro y el adab del camino. Para los primeros sabios (al-salaf), es el pilar del Islam."
  fr: "L'adab désigne le bon caractère, la bonne conduite, l'humilité et le rejet de la folie. Il englobe l'adab du chercheur de science, l'adab du maître et l'adab du chemin. Pour les premiers savants (al-salaf), il constitue le pilier de l'islam."
  ur: "ادب اچھا کردار، حسن اخلاق، عاجزی اور حماقت کا رد ہے۔ اس میں طالب علم کا ادب، استاد کا ادب اور سڑک کا ادیب شامل ہے۔ ابتدائی علماء ⁦(السلف)⁩ کے نزدیک یہ اسلام کا محور ہے۔"
question:
  ar: ما الأدب في الإسلام؟
short_answer:
  ar: الأدب حسن الخلق وحسن المعاملة والتواضع ورفض السفه؛ أدب العالم بطلبه وأدب المعلم وأدب الطريق؛ مدار
    الإسلام عند السلف.
long_answer:
  ar: '[[concept/adab|الأدب]] من أعمق مصطلحات الإسلام: أدب مع الله بالتوحيد وأدب مع رسوله بالاتباع وأدب
    مع الناس بمكارم الأخلاق؛ جمع الأدب المفرد للبخاري والآداب الشرعية لابن مفلح مدونات السلوك المسلم.
    {cite:wikidata}'
