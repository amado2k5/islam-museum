label:
  ar: "ما السعي؟"
  en: What is the sai?
summary:
  ar: "السعي مشي بين الصفا والمروة سبعاً في الحج والعمرة، إحياءً لذكرى هاجر وهي تطلب الماء لابنها إسماعيل."
  en: Sai is walking between al-Safa and al-Marwa seven times during hajj and umrah, in commemoration of Hajar searching for water for her son Ismail.
