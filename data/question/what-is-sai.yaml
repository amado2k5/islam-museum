id: question/what-is-sai
class: question
label:
  ar: "ما السعي؟"
  en: What is the sai?
  es: "¿Qué es el sai?"
  fr: "Qu'est-ce que le sai ?"
  ur: "سائی کیا ہے؟"
summary:
  ar: "السعي مشي بين الصفا والمروة سبعاً في الحج والعمرة، إحياءً لذكرى هاجر وهي تطلب الماء لابنها إسماعيل."
  en: Sai is walking between al-Safa and al-Marwa seven times during hajj and umrah, in commemoration of Hajar searching for water for her son Ismail.
  es: "Sai camina entre al-Safa y al-Marwa siete veces durante el Hajj y la Umrah, en conmemoración de Hajar buscando agua para su hijo Ismail."
  fr: "Sai parcourt sept fois à pied l'entre-salat d'al-Safa et d'al-Marwa durant le hajj et l'umra, en commémoration de la recherche d'eau par Hajar pour son fils Ismail."
  ur: "سائی اپنے بیٹے اسماعیل کے لیے پانی کی تلاش میں حجر کی یاد میں سات مرتبہ حج اور عمرہ کے دوران الصفا اور المروہ کے درمیان چل رہی ہیں۔"
wings: []
question:
  ar: "ما السعي؟"
short_answer:
  ar: "السعي مشي بين الصفا والمروة سبعاً في الحج والعمرة، إحياءً لذكرى هاجر وهي تطلب الماء لابنها إسماعيل."
long_answer:
  ar: |
    نص القرآن على الصفا والمروة من شعائر الله في سورة البقرة {cite:tanzil-quran}.
    ويعرض مدخل [[practice/sai|السعي]] هيئته، ويرتبط ب[[practice/hajj|الحج]] وب[[practice/tawaf|الطواف]] في المناسك.

