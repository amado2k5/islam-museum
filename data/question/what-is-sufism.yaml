id: question/what-is-sufism
class: question
label:
  ar: ما التصوف؟
  en: What is Sufism?
  es: "¿Qué es el sufismo?"
  fr: "Qu'est-ce que le soufisme ?"
  ur: "تصوف کیا ہے؟"
summary:
  ar: التصوف هو التراث الروحي الإسلامي في تزكية النفس والإخلاص؛ نظمته طرائق مثل القادرية والنقشبندية والشاذلية
    والمولوية.
  en: Sufism is the Islamic spiritual heritage of purifying the soul and sincerity. It was organized by Sufi paths (turuq) such as the Qadiriyya, Naqshbandiyya, Shadhiliyya and Mawlawiyya.
  es: "El sufismo es la herencia espiritual islámica de la purificación del alma y la sinceridad. Fue organizado por caminos sufíes (turuq) como Qadiriyya, Naqshbandiyya, Shadhiliyya y Mawlawiyya."
  fr: "Le soufisme est l'héritage spirituel islamique de purification de l'âme et de la sincérité. Il était organisé par des voies soufies (turuq) telles que la Qadiriyya, la Naqshbandiyya, la Shadhiliyya et la Mawlawiyya."
  ur: "تصوف روح اور خلوص کو پاک کرنے کا اسلامی روحانی ورثہ ہے۔ اس کا اہتمام صوفی راستوں جیسے قادریہ، نقشبندیہ، شدھیلیہ اور مولویوں نے کیا تھا۔"
question:
  ar: ما التصوف؟
short_answer:
  ar: التصوف هو التراث الروحي الإسلامي في تزكية النفس والإخلاص؛ نظمته طرائق مثل القادرية والنقشبندية والشاذلية
    والمولوية.
long_answer:
  ar: '[[concept/tasawwuf|التصوف]] هو تيار التزكية والإحسان في الإسلام؛ يرمّزه الصوف لباسًا للزهاد الأوائل.
    بلوره أعلام كالحارث المحاسبي والجنيد والغزالي، ثم انتظمت طرائقه: القادرية والنقشبندية والشاذلية والمولوية
    وغيرها، وله في الإسلام أنصار ومنتقدون عبر التاريخ. {cite:wikidata}'
