    والمولوية.
long_answer:
  ar: '[[concept/tasawwuf|التصوف]] هو تيار التزكية والإحسان في الإسلام؛ يرمّزه الصوف لباسًا للزهاد الأوائل.
    بلوره أعلام كالحارث المحاسبي والجنيد والغزالي، ثم انتظمت طرائقه: القادرية والنقشبندية والشاذلية والمولوية
    وغيرها، وله في الإسلام أنصار ومنتقدون عبر التاريخ. {cite:wikidata}'
