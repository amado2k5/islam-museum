id: question/who-was-fatima
class: question
label:
  ar: من كانت فاطمة؟
  en: Who was Fatima?
  es: "¿Quién fue Fátima?"
  fr: "Qui était Fatima ?"
  ur: "فاطمہ کون تھیں؟"
  tr: "Fatima kimdi?"
  id: "Siapa Fatima?"
summary:
  ar: فاطمة الزهراء بنت النبي وزوج علي بن أبي طالب وأم الحسن والحسين؛ ماتت شابة بعد أبيها بستة أشهر عند
    الأكثر.
  en: "Fatima al-Zahra, daughter of the Prophet and wife of Ali ibn Abi Talib, mother of al-Hasan and al-Husayn; she died young, about six months after her father according to most accounts."
  es: "Fátima al-Zahra, hija del Profeta y esposa de Ali ibn Abi Talib, madre de al-Hasan y al-Husayn; murió joven, unos seis meses después que su padre, según la mayoría de los relatos."
  fr: "Fatima al-Zahra, fille du Prophète et épouse d'Ali ibn Abi Talib, mère d'al-Hasan et d'al-Husayn; elle mourut jeune, environ six mois après son père selon la plupart des récits."
  ur: "فاطمہ الزہرہ، پیغمبر کی بیٹی اور علی ابن ابی طالب کی بیوی، حسن اور حسین کی والدہ؛ زیادہ تر اکاؤنٹس کے مطابق وہ اپنے والد کے تقریباً چھ ماہ بعد جوان ہو کر مر گئی۔"
  tr: "Fatimah al-Zahra, Peygamber'in kızı, Ali bin Ebu Talib'in eşi ve el-Hasan ile el-Hüseyin'in annesi; çoğunluğa göre babasından altı ay küçük öldü."
  id: "Fatimah al-Zahra, putri Nabi, suami Ali ibn Abi Talib, dan ibu al-Hasan serta al-Husayn; ia meninggal enam bulan lebih muda dari ayahnya, menurut mayoritas."
question:
  ar: من كانت فاطمة؟
short_answer:
  ar: فاطمة الزهراء بنت النبي وزوج علي بن أبي طالب وأم الحسن والحسين؛ ماتت شابة بعد أبيها بستة أشهر عند
    الأكثر.
long_answer:
  ar: '[[person/fatima|فاطمة الزهراء]] بنت النبي من خديجة وأقرب أولاده إليه؛ تزوجها علي بن أبي طالب ومنها
    نسل أهل البيت بالحسن والحسين. توفيت بعد وفاة النبي بشهور في روايات مختلفة؛ ولها منزلة عظيمة عند المسلمين
    جميعًا وعند الشيعة خاصة. {cite:wikidata}'
