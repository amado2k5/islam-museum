long_answer:
  ar: '[[person/fatima|فاطمة الزهراء]] بنت النبي من خديجة وأقرب أولاده إليه؛ تزوجها علي بن أبي طالب ومنها
    نسل أهل البيت بالحسن والحسين. توفيت بعد وفاة النبي بشهور في روايات مختلفة؛ ولها منزلة عظيمة عند المسلمين
    جميعًا وعند الشيعة خاصة. {cite:wikidata}'
