id: question/who-was-ibrahim-prophet
class: question
label:
  ar: من كان إبراهيم الخليل؟
  en: Who was Abraham, the Friend of God?
  es: "¿Quién fue Abraham, el amigo de Dios?"
  fr: "Qui était Abraham, l'ami de Dieu ?"
  ur: "ابراہیم، خدا کا دوست کون تھا؟"
summary:
  ar: إبراهيم خليل الله وأبو الأنبياء؛ كسر أصنام قومه ونجا من نار نمرود وبنى الكعبة بإسماعيل وقامت من
    ذريته النبوة كلها.
  en: "Ibrahim, the Friend of God and father of the prophets; he broke his people's idols, was saved from the fire of Nimrod, built the Ka'ba with Ismail, and all of prophethood came from his descendants."
  es: "Ibrahim, el amigo de Dios y padre de los profetas, destruyó los ídolos de su pueblo, se salvó del fuego de Nimrod, construyó la Kaaba con Ismail, y toda la profecía provino de sus descendientes."
  fr: "Ibrahim, l'ami de Dieu et père des prophètes; il brisa les idoles de son peuple, fut sauvé du feu de Nimrod, construisit la Kaaba avec Ismaël, et toute la prophétie est issue de sa descendance."
  ur: "ابراہیم، خدا کا دوست اور انبیاء کا باپ؛ اس نے اپنی قوم کے بتوں کو توڑا، نمرود کی آگ سے بچایا، اسمٰعیل کے ساتھ کعبہ بنوایا، اور تمام نبوت اسی کی اولاد سے ہوئی۔"
question:
  ar: من كان إبراهيم الخليل؟
short_answer:
  ar: إبراهيم خليل الله وأبو الأنبياء؛ كسر أصنام قومه ونجا من نار نمرود وبنى الكعبة بإسماعيل وقامت من
    ذريته النبوة كلها.
long_answer:
  ar: '[[person/ibrahim|إبراهيم]] خليل الرحمن؛ حاجّ قومه في التوحيد وألقوه في النار فكانت بردًا وسلامًا؛
    هاجر إلى الشام ومصر وفلسطين وبنى الكعبة بابنه إسماعيل وذبح ابنه فداءً؛ من ذريته الأنبياء ومحمد آخرهم.
    {cite:wikidata}'
