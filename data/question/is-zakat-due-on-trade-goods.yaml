id: question/is-zakat-due-on-trade-goods
class: question
label: { ar: "هل تجب الزكاة في عروض التجارة؟", en: "Is zakat due on trade goods?", ur: "کیا تجارتی سامان پر زکاۃ واجب ہے؟" }
question: { ar: "هل في السلع المعدّة للبيع زكاة تقوّم وتخرج كل عام، أم لا زكاة إلا في الأصناف التي جاء بها النص؟", en: "Is there zakat on goods held for sale, valued and paid each year, or is zakat due only on the kinds named in the texts?", ur: "کیا فروخت کے لیے رکھے گئے سامان پر زکاۃ ہے جس کی ہر سال قیمت لگا کر ادائیگی ہو، یا زکاۃ صرف ان اقسام میں ہے جن کا نص میں ذکر ہے؟" }
issue: { ar: "حديث سمرة «كان يأمرنا أن نخرج الصدقة من الذي نعد للبيع» وآثار عمر وابن عباس وابن عمر، مقابل حديث «ليس على المسلم في عبده ولا في فرسه صدقة»، كما يعرضها ابن حزم.", en: "Samura's report 'he used to order us to pay the alms on what we prepare for sale' and the reports from 'Umar, Ibn 'Abbas and Ibn 'Umar, against the hadith 'there is no alms on a Muslim for his slave or his horse', as Ibn Hazm sets them out.", ur: "سمرہ کی روایت «آپ ہمیں حکم دیتے تھے کہ جو ہم بیچنے کے لیے تیار کرتے ہیں اس سے صدقہ نکالیں» اور عمر، ابن عباس اور ابن عمر کے آثار، بمقابلہ حدیث «مسلمان پر اس کے غلام اور گھوڑے میں صدقہ نہیں»، جیسا کہ ابن حزم انہیں پیش کرتے ہیں۔" }
summary:
  ar: "يحكي ابن حزم في «المحلى» أن أبا حنيفة ومالكاً والشافعي في أحد قوليه يوجبون الزكاة في العروض المتخذة للتجارة، ويستدلون بحديث سمرة وآثار عن عمر وابن عباس وابن عمر، ويرى هو أن الزكاة لا تجب إلا في ثمانية أصناف: الذهب والفضة والقمح والشعير والتمر والإبل والبقر والغنم، وأنه لا زكاة في عروض التجارة أصلاً {cite:muhalla-dar-ibn-hazm-2016-v5 p.349} {cite:muhalla-dar-ibn-hazm-2016-v5 p.385} {cite:muhalla-dar-ibn-hazm-2016-v5 p.392}."
  en: "Ibn Hazm reports in al-Muhalla that Abu Hanifa, Malik and al-Shafi'i, in one of his two views, require zakat on goods held for trade, arguing from Samura's report and from reports from 'Umar, Ibn 'Abbas and Ibn 'Umar; he holds that zakat is due only on eight kinds of wealth, gold, silver, wheat, barley, dates, camels, cattle and sheep and goats, and that there is no zakat on trade goods at all {cite:muhalla-dar-ibn-hazm-2016-v5 p.349} {cite:muhalla-dar-ibn-hazm-2016-v5 p.385} {cite:muhalla-dar-ibn-hazm-2016-v5 p.392}."
  ur: "ابن حزم «المحلی» میں نقل کرتے ہیں کہ ابو حنیفہ، مالک اور شافعی اپنے ایک قول میں تجارت کے لیے رکھے گئے سامان پر زکاۃ واجب کرتے ہیں، اور سمرہ کی روایت اور عمر، ابن عباس اور ابن عمر کے آثار سے استدلال کرتے ہیں؛ ان کے نزدیک زکاۃ صرف آٹھ قسم کے مال میں واجب ہے: سونا، چاندی، گندم، جو، کھجور، اونٹ، گائے اور بھیڑ بکری، اور تجارتی سامان پر بالکل زکاۃ نہیں {cite:muhalla-dar-ibn-hazm-2016-v5 p.349} {cite:muhalla-dar-ibn-hazm-2016-v5 p.385} {cite:muhalla-dar-ibn-hazm-2016-v5 p.392}۔"
short_answer:
  ar: "أبو حنيفة ومالك والشافعي ⁦(كما يحكيهم ابن حزم)⁩: تجب فيها الزكاة، مع اختلافهم في التفصيل؛ ابن حزم الظاهري: لا زكاة فيها."
  en: "Abu Hanifa, Malik and al-Shafi'i (as Ibn Hazm reports them): zakat is due on them, with differences of detail; Ibn Hazm the Zahiri: there is no zakat on them."
  ur: "ابو حنیفہ، مالک اور شافعی (ابن حزم کی نقل کے مطابق): ان پر زکاۃ واجب ہے، تفصیل میں اختلاف کے ساتھ؛ ابن حزم ظاہری: ان پر زکاۃ نہیں۔"
