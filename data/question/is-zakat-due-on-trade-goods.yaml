    summary: { ar: "يرى ابن حزم أن حديث سمرة ساقط لجهالة رواته، ولو صح لم يكن فيه أن تلك الصدقة هي الزكاة المفروضة، وأن أثر حماس عن مجهولين، وأثر أبي قلابة مرسل، وأثر عبد الرحمن بن عبد القاري ليس فيه أن الأموال كانت عروضاً، وأن قول ابن عمر صحيح لكن لا حجة في قول أحد دون النبي؛ ويحتج بأن النبي أسقط الزكاة عما دون النصاب، وقال «ليس على المسلم في عبده ولا في فرسه صدقة إلا صدقة الفطر»، ولم يبيّن زكاة للتجارة، والإجماع على أن حكم كل عرض كحكم الخيل والرقيق.", en: "Ibn Hazm holds that Samura's report is worthless because its transmitters are unknown, and that even if sound it would not show that the alms in it is the obligatory zakat; that the Himas report comes from unknown men, Abu Qilaba's is broken, and 'Abd al-Rahman ibn 'Abd al-Qari's does not say the wealth was trade goods; and that Ibn 'Umar's saying is sound but no one's word below the Prophet's is proof. He argues that the Prophet exempted what is below the minimum, said 'there is no alms on a Muslim for his slave or his horse except the alms of the fast-breaking', and stated no zakat for trade, and that there is consensus that every good has the ruling of horses and slaves.", ur: "ابن حزم کے نزدیک سمرہ کی روایت اپنے راویوں کی جہالت کی وجہ سے ساقط ہے، اور صحیح بھی ہو تو اس میں یہ نہیں کہ وہ صدقہ فرض زکاۃ تھا؛ حماس والا اثر نامعلوم لوگوں سے ہے، ابو قلابہ کا مرسل ہے، اور عبد الرحمن بن عبد القاری والے میں یہ نہیں کہ مال تجارتی سامان تھا؛ ابن عمر کا قول صحیح ہے مگر نبی کے سوا کسی کا قول حجت نہیں۔ وہ استدلال کرتے ہیں کہ نبی نے نصاب سے کم پر زکاۃ ساقط کی، فرمایا «مسلمان پر اس کے غلام اور گھوڑے میں صدقہ نہیں سوائے صدقۂ فطر کے»، اور تجارت کی کوئی زکاۃ بیان نہیں کی، اور اس پر اجماع ہے کہ ہر سامان کا حکم گھوڑوں اور غلاموں جیسا ہے۔" }
