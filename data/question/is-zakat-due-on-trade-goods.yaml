    summary: { ar: "يحكي ابن حزم أن أبا حنيفة ومالكاً والشافعي في أحد قوليه أوجبوا الزكاة في العروض المتخذة للتجارة، واحتجوا بحديث سمرة بن جندب أن النبي كان يأمرهم أن يخرجوا الصدقة من الذي يعدون للبيع، وبأن عمر كان يجمع أموال التجار فيحسبها ويأخذ زكاتها، وبأمره حماساً أن يقوّم جعابه وأدمه ويؤدي زكاتها، وبقول ابن عباس لا بأس بالتربص حتى يبيع والزكاة واجبة فيه، وبقول ابن عمر ليس في العروض زكاة إلا أن تكون للتجارة، وبأن الزكاة موضوعة فيما ينمى من الأموال؛ ويذكر اختلافهم في التفصيل، كتفريق مالك بين المدير وغيره.", en: "Ibn Hazm reports that Abu Hanifa, Malik and al-Shafi'i in one of his two views required zakat on goods held for trade, arguing from Samura ibn Jundab's report that the Prophet ordered them to pay the alms on what they prepared for sale; from 'Umar's practice of gathering the merchants' wealth, reckoning it and taking its zakat; from his order to Himas to value his quivers and hides and pay their zakat; from Ibn 'Abbas's saying that one may wait until he sells, the zakat being due on it; from Ibn 'Umar's saying that there is no zakat on goods unless they are for trade; and from the principle that zakat is laid on wealth that grows; he notes their differences of detail, such as Malik's distinction between the trader who turns his stock over and one who does not.", ur: "ابن حزم نقل کرتے ہیں کہ ابو حنیفہ، مالک اور شافعی نے اپنے ایک قول میں تجارتی سامان پر زکاۃ واجب کی، اور سمرہ بن جندب کی روایت سے دلیل لی کہ نبی انہیں بیچنے کے لیے تیار کیے گئے مال سے صدقہ نکالنے کا حکم دیتے تھے؛ عمر کے عمل سے کہ وہ تاجروں کا مال جمع کر کے حساب لگاتے اور زکاۃ لیتے تھے؛ ان کے حماس کو حکم سے کہ اپنے ترکش اور چمڑوں کی قیمت لگا کر زکاۃ دے؛ ابن عباس کے قول سے کہ بیچنے تک انتظار میں حرج نہیں اور اس میں زکاۃ واجب ہے؛ ابن عمر کے قول سے کہ سامان میں زکاۃ نہیں سوائے تجارت والے کے؛ اور اس اصول سے کہ زکاۃ بڑھنے والے مال پر رکھی گئی ہے؛ وہ تفصیل میں ان کے اختلاف کا بھی ذکر کرتے ہیں، جیسے مالک کا مال گھمانے والے اور دوسرے تاجر میں فرق۔" }
