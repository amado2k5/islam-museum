id: question/what-is-mecca
class: question
label:
  ar: ما مكة المكرمة؟
  en: What is Mecca?
  es: "¿Qué es La Meca?"
  fr: "Qu'est-ce que La Mecque ?"
  ur: "مکہ کیا ہے؟"
  tr: "Mekke nedir?"
  id: "Apa itu Mekah?"
summary:
  ar: مكة أم القرى؛ مولد النبي وموطن الكعبة والحرم وقبلة المسلمين ومحج البيت العتيق؛ في وادي غير ذي زرع
    عند مورده زمزم.
  en: "Mecca is Umm al-Qura. It is the birthplace of the Prophet, the home of the Kaaba and the Haram, the qibla of the Muslims, and the destination of pilgrimage to the Ancient House. It lies in a valley without cultivation, at the spring of Zamzam."
  es: "La Meca es Umm al-Qura. Es el lugar de nacimiento del Profeta, donde se encuentran la Kaaba y el Haram, la qibla de los musulmanes y el destino de la peregrinación a la Casa Antigua. Se ubica en un valle sin cultivar, junto al manantial de Zamzam."
  fr: "La Mecque est Umm al-Qura. C'est le lieu de naissance du Prophète, la demeure de la Kaaba et du Haram, la qibla des musulmans et le lieu de pèlerinage vers la Maison antique. Elle se situe dans une vallée inculte, à la source de Zamzam."
  ur: "مکہ ام القریٰ ہے۔ یہ پیغمبر کی جائے پیدائش، کعبہ اور حرم کا گھر ہے، مسلمانوں کا قبلہ ہے، اور قدیم گھر کی زیارت کی منزل ہے۔ یہ زمزم کے موسم بہار میں بغیر کاشت کے ایک وادی میں واقع ہے۔"
  tr: "Şehirlerin anası; Peygamber'in doğum yeri, Kabe'nin evi, Haram, Müslümanların kıblesi ve Kadim Ev'in hac yeri; kaynağı Zamzam'da ekim yapılmayan bir vadi."
  id: "Mekah, ibu kota; tempat kelahiran Nabi, rumah Ka'bah, Haram, Qibla umat Muslim, dan tempat ziarah Rumah Kuno; di sebuah lembah tanpa pertanian di sumbernya, Zamzam."
question:
  ar: ما مكة المكرمة؟
short_answer:
  ar: مكة أم القرى؛ مولد النبي وموطن الكعبة والحرم وقبلة المسلمين ومحج البيت العتيق؛ في وادي غير ذي زرع
    عند مورده زمزم.
long_answer:
  ar: '[[place/mecca|مكة]] أقدس مدن الإسلام؛ فيها الكعبة والمسجد الحرام ومقام إبراهيم وزمزم والمشاعر.
    منها بعث النبي وهاجر منها ثم فتحها سنة 8هـ؛ حرمة دمها نص القرآن والسنة ويحرم على غير المسلم دخول حرمها.
    {cite:wikidata}'
