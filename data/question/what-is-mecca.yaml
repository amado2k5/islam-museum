long_answer:
  ar: '[[place/mecca|مكة]] أقدس مدن الإسلام؛ فيها الكعبة والمسجد الحرام ومقام إبراهيم وزمزم والمشاعر.
    منها بعث النبي وهاجر منها ثم فتحها سنة 8هـ؛ حرمة دمها نص القرآن والسنة ويحرم على غير المسلم دخول حرمها.
