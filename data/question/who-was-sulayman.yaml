question:
  ar: من كان سليمان القانوني؟
short_answer:
  ar: سليمان الأول القانوني/العظيم (1494–1566) عاشر سلاطين العثمان؛ بلغت دولته ذروتها من بلغراد إلى البصرة
    في حكمه ستة وأربعين سنة.
long_answer:
  ar: '[[person/sulayman-al-qanuni|سليمان القانوني]] عاشر السلاطين العثمانيين وأطولهم حكمًا؛ فتح بلغراد
    ورودس والعراق وبلغ فيينا؛ بنى له معمار سنان عقود المساجد والقناطر؛ عرف في أوروبا بالعظيم وفي العثمانيين
    بالقانوني. {cite:wikidata}'
