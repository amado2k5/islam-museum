label:
  ar: من كان سليمان القانوني؟
  en: Who was Suleiman the Magnificent?
  es: "¿Quién fue Solimán el Magnífico?"
  fr: "Qui était Soliman le Magnifique ?"
  ur: "سلیمان عظیم کون تھا؟"
summary:
  ar: سليمان الأول القانوني/العظيم (1494–1566) عاشر سلاطين العثمان؛ بلغت دولته ذروتها من بلغراد إلى البصرة
    في حكمه ستة وأربعين سنة.
  en: "Suleiman I, known as al-Qanuni or the Magnificent (1494–1566), the tenth Ottoman sultan; his state reached its height from Belgrade to Basra in his forty-six-year reign."
  es: "Solimán I, conocido como al-Qanuni o el Magnífico (1494-1566), fue el décimo sultán otomano; su estado alcanzó su apogeo desde Belgrado hasta Basora durante sus cuarenta y seis años de reinado."
  fr: "Soliman Ier, connu sous le nom d'al-Qanuni ou le Magnifique (1494-1566), le dixième sultan ottoman; son État atteignit son apogée de Belgrade à Bassora au cours de ses quarante-six ans de règne."
  ur: "سلیمان اول، القانونی یا شاندار (1494-1566) کے نام سے جانا جاتا ہے، دسویں عثمانی سلطان؛ اس کی ریاست اپنے اڑتالیس سالہ دور حکومت میں بلغراد سے بصرہ تک عروج پر پہنچ گئی۔"
question:
  ar: من كان سليمان القانوني؟
short_answer:
  ar: سليمان الأول القانوني/العظيم (1494–1566) عاشر سلاطين العثمان؛ بلغت دولته ذروتها من بلغراد إلى البصرة
    في حكمه ستة وأربعين سنة.
long_answer:
  ar: '[[person/sulayman-al-qanuni|سليمان القانوني]] عاشر السلاطين العثمانيين وأطولهم حكمًا؛ فتح بلغراد
    ورودس والعراق وبلغ فيينا؛ بنى له معمار سنان عقود المساجد والقناطر؛ عرف في أوروبا بالعظيم وفي العثمانيين
    بالقانوني. {cite:wikidata}'
