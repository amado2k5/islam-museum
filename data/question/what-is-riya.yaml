question:
  ar: ما الرياء؟
short_answer:
  ar: الرياء هو طلب السمعة والمكانة بالعبادة؛ شرك خفي عند العلماء وآفة تبطل الأعمال الصالحة.
long_answer:
  ar: الرياء هو إرادة سماع الناس أو رؤيتهم بالعمل بدل الله؛ سماه بعض السلف شركًا خفيًا لأنه عبادة لغير
    الله. تُبطل به الأعمال أو تنقص ثوابتها، ويستدل بالحديث القدسي «أنا أغنى الشركاء عن الشرك» وأحاديث
    أول تسع جهنم. {cite:wikidata}
