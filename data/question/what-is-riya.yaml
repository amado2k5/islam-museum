label:
  ar: ما الرياء؟
  en: What is riya?
  es: "¿Qué es Riya?"
  fr: "Qu'est-ce que riya ?"
summary:
  ar: الرياء هو طلب السمعة والمكانة بالعبادة؛ شرك خفي عند العلماء وآفة تبطل الأعمال الصالحة.
  en: "Riya is seeking reputation and standing through worship. Scholars regard it as a hidden form of shirk, a blight that nullifies good deeds."
  es: "Riya busca prestigio y reconocimiento a través del culto. Los eruditos lo consideran una forma oculta de shirk (idolatría), una plaga que anula las buenas acciones."
  fr: "Le riya consiste à rechercher la réputation et le prestige par le culte. Les érudits le considèrent comme une forme cachée de shirk, un fléau qui annule les bonnes actions."
question:
  ar: ما الرياء؟
short_answer:
  ar: الرياء هو طلب السمعة والمكانة بالعبادة؛ شرك خفي عند العلماء وآفة تبطل الأعمال الصالحة.
long_answer:
  ar: الرياء هو إرادة سماع الناس أو رؤيتهم بالعمل بدل الله؛ سماه بعض السلف شركًا خفيًا لأنه عبادة لغير
    الله. تُبطل به الأعمال أو تنقص ثوابتها، ويستدل بالحديث القدسي «أنا أغنى الشركاء عن الشرك» وأحاديث
    أول تسع جهنم. {cite:wikidata}
