id: question/was-muawiya-a-scribe-of-the-revelation
class: question
label: { ar: "هل كان معاوية من كتّاب الوحي؟", en: "Was Mu'awiya a scribe of the revelation?", ur: "کیا معاویہ کاتبِ وحی تھے؟", es: "¿Fue Mu'awiya un escriba de la revelación?", fr: "Mu'awiya était-il un scribe de la révélation ?", tr: "Muawiya Vahiy Kitabı'ndan mıydı?", id: "Apakah Muawiya berasal dari Kitab Wahyu?" }
summary:
  ar: "أنكر ابن المطهر الحلي تسمية معاوية كاتب الوحي وقال إنه لم يكتب من الوحي كلمة، وإنه كان باليمن يوم الفتح يطعن على النبي ويعيّر أباه بإسلامه بأبيات؛ ورد ابن تيمية بأن هذا قول بلا حجة، وبأن الأبيات مكذوبة على معاوية، وبأن كثيراً ممن عادوا النبي أسلموا وحسن إسلامهم."
  en: "Al-Hilli rejected calling Mu'awiya a scribe of the revelation, saying he never wrote a word of it, and that on the day of the conquest of Mecca he was in Yemen reviling the Prophet and taunting his father in verse for embracing Islam; Ibn Taymiyya replied that this was a claim without proof, that the verses were forged in Mu'awiya's name, and that many who had been hostile to the Prophet became sincere Muslims."
  es: "Al-Hilli rechazó llamar a Mu'awiya escriba de la revelación, diciendo que nunca escribió ni una palabra de ella, y que el día de la conquista de La Meca estaba en Yemen insultando al Profeta y burlándose de su padre en verso por haber abrazado el Islam; Ibn Taymiyya respondió que esa era una afirmación sin pruebas, que los versos fueron falsificados en nombre de Mu'awiya, y que muchos que habían sido hostiles al Profeta se convirtieron en musulmanes sinceros."
  fr: "Al-Hilli rejeta l'idée de qualifier Mu'awiya de scribe de la révélation, affirmant qu'il n'en avait jamais écrit un seul mot et que, le jour de la conquête de La Mecque, il se trouvait au Yémen, injuriant le Prophète et raillant son père en vers pour s'être converti à l'islam. Ibn Taymiyya répliqua que cette affirmation était sans fondement, que les versets avaient été forgés au nom de Mu'awiya et que beaucoup de ceux qui avaient été hostiles au Prophète étaient devenus de sincères musulmans."
  ur: "الحلی نے معاویہ کو وحی کا کاتب کہنے کو رد کرتے ہوئے کہا کہ اس نے کبھی اس کا ایک لفظ بھی نہیں لکھا، اور یہ کہ فتح مکہ کے دن وہ یمن میں تھا کہ پیغمبر کو گالی دے رہا تھا اور اپنے والد کو اسلام قبول کرنے پر آیت میں طعنہ دے رہا تھا۔ ابن تیمیہ نے جواب دیا کہ یہ بغیر ثبوت کے دعویٰ ہے کہ آیات معاویہ کے نام پر جعل کی گئی ہیں اور بہت سے لوگ جنہوں نے رسول اللہ سے دشمنی کی تھی وہ مخلص مسلمان ہو گئے۔"
  tr: "İbn el-Mutahhar el-Hilli, Muaviye'yi vahiy kâtipi olarak adlandırdığını reddetti, tek bir vahiy kelimesi bile yazmadığını ve fetih günü Yemen'de Peygamber'i eleştirmek ve babasını İslam için alay etmek için Yemen'de olduğunu söyledi; İbn Teymiyye ise bunun asılsız bir ifade olduğunu, ayetlerin Muaviye'ye karşı uydurulduğunu ve Peygamber'e karşı olanların çoğunun İslam'ı benimsediğini ve İslam'larının iyi olduğunu söyledi."
  id: "Ibn al-Mutahhar al-Hilli membantah menyebut Muawiyah sebagai juru wahyu, mengatakan bahwa ia tidak menulis satu kata pun wahyu, dan bahwa ia berada di Yaman pada hari penaklukan untuk mengkritik Nabi dan mengejek ayahnya atas Islam dengan ayat-ayat; Ibn Taymiyyah menjawab bahwa pernyataan itu tidak berdasar, bahwa ayat-ayat tersebut dibuat-buat melawan Muawiyah, dan bahwa banyak dari mereka yang menentang Nabi memeluk Islam dan bahwa Islam mereka baik."
question: { ar: "هل كان معاوية من كتّاب الوحي؟", en: "Was Mu'awiya a scribe of the revelation?" }
issue: { ar: "هل كتب معاوية بن أبي سفيان الوحي أو الرسائل للنبي، وكيف كان حاله يوم فتح مكة؟" }
short_answer:
  ar: "ابن تيمية: نفي كتابته الوحي قول بلا علم، والشعر المنسوب إليه مكذوب؛ الحلي، كما ينقله ابن تيمية: لم يكتب كلمة من الوحي، وكان معادياً يوم الفتح."
  en: "Ibn Taymiyya: denying that he wrote revelation is a claim without knowledge, and the poem ascribed to him is forged. Al-Hilli, as Ibn Taymiyya quotes him: he wrote no word of revelation and was hostile on the day of the conquest."
