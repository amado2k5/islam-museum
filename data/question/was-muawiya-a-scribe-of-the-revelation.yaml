id: question/was-muawiya-a-scribe-of-the-revelation
class: question
label: { ar: "هل كان معاوية من كتّاب الوحي؟", en: "Was Mu'awiya a scribe of the revelation?", ur: "کیا معاویہ کاتبِ وحی تھے؟" }
summary:
  ar: "أنكر ابن المطهر الحلي تسمية معاوية كاتب الوحي وقال إنه لم يكتب من الوحي كلمة، وإنه كان باليمن يوم الفتح يطعن على النبي ويعيّر أباه بإسلامه بأبيات؛ ورد ابن تيمية بأن هذا قول بلا حجة، وبأن الأبيات مكذوبة على معاوية، وبأن كثيراً ممن عادوا النبي أسلموا وحسن إسلامهم."
  en: "Al-Hilli rejected calling Mu'awiya a scribe of the revelation, saying he never wrote a word of it, and that on the day of the conquest of Mecca he was in Yemen reviling the Prophet and taunting his father in verse for embracing Islam; Ibn Taymiyya replied that this was a claim without proof, that the verses were forged in Mu'awiya's name, and that many who had been hostile to the Prophet became sincere Muslims."
question: { ar: "هل كان معاوية من كتّاب الوحي؟", en: "Was Mu'awiya a scribe of the revelation?" }
issue: { ar: "هل كتب معاوية بن أبي سفيان الوحي أو الرسائل للنبي، وكيف كان حاله يوم فتح مكة؟" }
short_answer:
  ar: "ابن تيمية: نفي كتابته الوحي قول بلا علم، والشعر المنسوب إليه مكذوب؛ الحلي، كما ينقله ابن تيمية: لم يكتب كلمة من الوحي، وكان معادياً يوم الفتح."
  en: "Ibn Taymiyya: denying that he wrote revelation is a claim without knowledge, and the poem ascribed to him is forged. Al-Hilli, as Ibn Taymiyya quotes him: he wrote no word of revelation and was hostile on the day of the conquest."
