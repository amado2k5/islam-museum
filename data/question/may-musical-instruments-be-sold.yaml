id: question/may-musical-instruments-be-sold
class: question
label: { ar: "هل يجوز بيع آلات المعازف؟", en: "May musical instruments be sold?", ur: "کیا آلاتِ موسیقی کی خرید و فروخت جائز ہے؟" }
question: { ar: "هل بيع المزامير والعيدان والمعازف والطنابير، وبيع المغنيات، حلال أم حرام، وهل يضمن من كسرها؟", en: "Is selling pipes, lutes, stringed and other instruments, and singing slave-girls, lawful or forbidden, and is one who breaks such instruments liable?", ur: "کیا بانسری، عود، معازف اور طنبور کی بیع، اور گانے والی لونڈیوں کی بیع، حلال ہے یا حرام، اور کیا انہیں توڑنے والا ضامن ہے؟" }
issue: { ar: "صحة الأحاديث الواردة في تحريم المعازف وبيع المغنيات، ومنها حديث أبي عامر أو أبي مالك الأشعري عند البخاري، وتفسير «لهو الحديث» في آية لقمان 6 بالغناء عن ابن مسعود وابن عباس وغيرهما، كما يعرضها ابن حزم ويرد عليها.", en: "The soundness of the hadiths forbidding instruments and the sale of singing girls, including the report of Abu 'Amir or Abu Malik al-Ash'ari in al-Bukhari, and the explanation of 'idle talk' in Luqman 6 as singing by Ibn Mas'ud, Ibn 'Abbas and others, as Ibn Hazm sets them out and answers them.", ur: "آلاتِ موسیقی اور گانے والیوں کی بیع کی حرمت کی احادیث کی صحت، جن میں بخاری میں ابو عامر یا ابو مالک اشعری کی روایت ہے، اور سورۂ لقمان 6 میں «لہو الحدیث» کی تفسیر گانے سے جو ابن مسعود، ابن عباس وغیرہ سے مروی ہے، جیسا کہ ابن حزم انہیں پیش کر کے ان کا جواب دیتے ہیں۔" }
summary:
  ar: "يرى ابن حزم في «المحلى» أن بيع الشطرنج والمزامير والعيدان والمعازف والطنابير حلال، وأن من كسر شيئاً منها ضمنه، وكذلك بيع المغنيات وابتياعهن، ويحكي أن أبا حنيفة يرى الضمان على كاسرها؛ ويسوق الأحاديث التي احتج بها المانعون ويضعّفها كلها، ومنها حديث البخاري الذي يراه منقطعاً، ويرد تفسير لهو الحديث بالغناء، بينما ينقل محققو طبعته رد ابن حجر على دعوى الانقطاع وتصحيح غيره لبعض هذه الأحاديث {cite:muhalla-dar-ibn-hazm-2016-v10 p.548} {cite:muhalla-dar-ibn-hazm-2016-v10 p.558} {cite:muhalla-dar-ibn-hazm-2016-v10 p.560}."
  en: "Ibn Hazm holds in al-Muhalla that selling chess sets, pipes, lutes, stringed instruments and tanburs is lawful, that whoever breaks one is liable for it, and that buying and selling singing girls is likewise lawful, reporting that Abu Hanifa also held the breaker liable; he sets out the hadiths cited by those who forbid and weakens all of them, including al-Bukhari's report, which he considers disconnected, and rejects the explanation of 'idle talk' as singing, while the editors of his edition cite Ibn Hajar's reply to the charge of disconnection and others' authentication of some of these hadiths {cite:muhalla-dar-ibn-hazm-2016-v10 p.548} {cite:muhalla-dar-ibn-hazm-2016-v10 p.558} {cite:muhalla-dar-ibn-hazm-2016-v10 p.560}."
  ur: "ابن حزم «المحلی» میں کہتے ہیں کہ شطرنج، بانسری، عود، معازف اور طنبور کی بیع حلال ہے، ان میں سے کچھ توڑنے والا ضامن ہے، اور گانے والی لونڈیوں کی خرید و فروخت بھی حلال ہے، اور نقل کرتے ہیں کہ ابو حنیفہ بھی توڑنے والے پر ضمان کے قائل ہیں؛ وہ منع کرنے والوں کی پیش کردہ احادیث لا کر سب کو ضعیف قرار دیتے ہیں، جن میں بخاری کی روایت بھی ہے جسے وہ منقطع سمجھتے ہیں، اور لہو الحدیث کی گانے سے تفسیر کو رد کرتے ہیں، جبکہ ان کے ایڈیشن کے محققین انقطاع کے دعوے پر ابن حجر کا جواب اور بعض احادیث کی دوسروں کی تصحیح نقل کرتے ہیں {cite:muhalla-dar-ibn-hazm-2016-v10 p.548} {cite:muhalla-dar-ibn-hazm-2016-v10 p.558} {cite:muhalla-dar-ibn-hazm-2016-v10 p.560}۔"
short_answer:
  ar: "المانعون (كما يعرضهم ابن حزم ومحققو طبعته): المعازف وبيع المغنيات محرمة بالأحاديث وتفسير الصحابة؛ ابن حزم الظاهري: بيعها حلال ويضمن كاسرها، ولا يصح في التحريم حديث."
  en: "Those who forbid (as Ibn Hazm and his editors present them): instruments and the sale of singing girls are forbidden by the hadiths and the Companions' explanation; Ibn Hazm the Zahiri: selling them is lawful and the breaker is liable, and no sound hadith forbids them."
  ur: "منع کرنے والے (جیسا کہ ابن حزم اور ان کے محققین پیش کرتے ہیں): آلاتِ موسیقی اور گانے والیوں کی بیع احادیث اور صحابہ کی تفسیر سے حرام ہے؛ ابن حزم ظاہری: ان کی بیع حلال ہے اور توڑنے والا ضامن ہے، اور حرمت میں کوئی صحیح حدیث نہیں۔"
