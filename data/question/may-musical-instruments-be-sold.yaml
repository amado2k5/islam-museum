    summary: { ar: "يحتج المانعون، كما يعرضهم ابن حزم، بأحاديث منها حديث عقبة بن عامر «كل شيء يلهو به الرجل باطل إلا...»، وحديث عائشة في تحريم المغنية وبيعها وثمنها، وحديث أبي أمامة «لا يحل بيع المغنيات ولا شراؤهن»، وحديث أبي عامر أو أبي مالك الأشعري عند البخاري «ليكونن من أمتي قوم يستحلون الحر والحرير والخمر والمعازف»، وبتفسير ابن مسعود وابن عباس ومجاهد وعكرمة لهو الحديث بالغناء، وبقول ابن عباس: الدف حرام والمعازف حرام والمزمار حرام، وقول النخعي: الغناء ينبت النفاق في القلب. وينقل المحققون رد ابن حجر في «فتح الباري» على دعوى انقطاع حديث البخاري، وتصحيح ابن القيم وتحسين ابن تيمية والألباني لبعض طرق هذا الباب.", en: "Those who forbid, as Ibn Hazm presents them, cite hadiths including 'Uqba ibn 'Amir's 'everything a man amuses himself with is futile except...', 'A'isha's report that God forbade the singing girl, her sale and her price, Abu Umama's 'it is not lawful to sell or buy singing girls', and the report of Abu 'Amir or Abu Malik al-Ash'ari in al-Bukhari, 'there will be people of my community who make lawful fornication, silk, wine and instruments'; and they cite the explanation of 'idle talk' as singing by Ibn Mas'ud, Ibn 'Abbas, Mujahid and 'Ikrima, Ibn 'Abbas's saying that the tambourine, instruments and the pipe are forbidden, and al-Nakha'i's saying that singing grows hypocrisy in the heart. The editors cite Ibn Hajar's reply in Fath al-Bari to the charge that al-Bukhari's report is disconnected, and Ibn al-Qayyim's, Ibn Taymiyya's and al-Albani's acceptance of some chains on this subject.", ur: "منع کرنے والے، جیسا کہ ابن حزم انہیں پیش کرتے ہیں، احادیث سے استدلال کرتے ہیں جن میں عقبہ بن عامر کی «آدمی جس چیز سے بھی دل بہلائے وہ باطل ہے سوائے...»، عائشہ کی روایت کہ اللہ نے گانے والی، اس کی بیع اور اس کی قیمت حرام کی، ابو امامہ کی «گانے والیوں کی خرید و فروخت جائز نہیں»، اور بخاری میں ابو عامر یا ابو مالک اشعری کی روایت «میری امت میں ایسے لوگ ہوں گے جو زنا، ریشم، شراب اور معازف کو حلال کر لیں گے» شامل ہیں؛ نیز ابن مسعود، ابن عباس، مجاہد اور عکرمہ کی لہو الحدیث کی گانے سے تفسیر، ابن عباس کا قول کہ دف، معازف اور بانسری حرام ہیں، اور نخعی کا قول کہ گانا دل میں نفاق اگاتا ہے۔ محققین فتح الباری میں ابن حجر کا بخاری کی روایت کے انقطاع کے دعوے پر جواب، اور اس باب کی بعض سندوں کو ابن القیم، ابن تیمیہ اور البانی کا قبول کرنا نقل کرتے ہیں۔" }
