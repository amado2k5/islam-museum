    summary: { ar: "يرى ابن حزم أن الله خلق ما في الأرض جميعاً وأحل البيع وفصّل ما حرم، ولم يأت نص بتحريم بيع شيء من ذلك؛ ويضعّف الأحاديث كلها بجهالة رواتها أو ضعفهم أو انقطاعها، ويقول إنه لو صح منها شيء من طريق الثقات لأخذ به؛ ويرى أن آية لهو الحديث ذمّت من اشتراه ليضل عن سبيل الله ويتخذها هزواً، لا من اشتراه ليروّح نفسه؛ ويجعل الحكم بحديث «إنما الأعمال بالنيات»، ويستشهد بأن ابن عمر لما سمع مزماراً وضع أصبعيه في أذنيه كما رأى النبي يفعل ولم ينه نافعاً عن سماعه، فيراه تجنباً لمباح، وبأنه سعى في بيع جارية مغنية لعبد الله بن جعفر وإن سمّى غناءها مزمور الشيطان.", en: "Ibn Hazm holds that God created all that is on earth for people, made sale lawful and set out in detail what He forbade, and that no text forbids selling any of these things; he weakens all the hadiths by unknown, weak or disconnected transmission, saying he would have accepted any of them had it come through trustworthy narrators; he reads the verse on 'idle talk' as condemning one who buys it to lead people from God's path and mock it, not one who buys it to refresh himself; he makes the ruling follow the hadith 'actions are by intentions'; and he cites Ibn 'Umar, who on hearing a pipe put his fingers in his ears as he had seen the Prophet do but did not forbid Nafi' to listen, which Ibn Hazm reads as avoiding something permitted, and who acted in the sale of a singing girl for 'Abd Allah ibn Ja'far, though he called her singing the devil's piping.", ur: "ابن حزم کے نزدیک اللہ نے زمین کی سب چیزیں پیدا کیں، بیع حلال کی اور جو حرام کیا اس کی تفصیل دی، اور ان میں سے کسی کی بیع کی حرمت میں کوئی نص نہیں آئی؛ وہ تمام احادیث کو راویوں کی جہالت، ضعف یا انقطاع کی بنا پر ضعیف قرار دیتے ہیں، اور کہتے ہیں کہ اگر ان میں سے کوئی ثقہ راویوں سے صحیح ہوتی تو وہ اسے لیتے؛ وہ لہو الحدیث کی آیت کو اس شخص کی مذمت سمجھتے ہیں جو اسے اللہ کی راہ سے گمراہ کرنے اور مذاق بنانے کے لیے خریدے، نہ کہ اس کی جو دل بہلانے کے لیے خریدے؛ حکم کو حدیث «اعمال کا دار و مدار نیتوں پر ہے» کے تابع رکھتے ہیں؛ اور ابن عمر سے استشہاد کرتے ہیں جنہوں نے بانسری سن کر کانوں میں انگلیاں ڈال لیں جیسا نبی کو کرتے دیکھا تھا مگر نافع کو سننے سے منع نہیں کیا، جسے ابن حزم مباح سے پرہیز سمجھتے ہیں، اور جنہوں نے عبد اللہ بن جعفر کے لیے گانے والی لونڈی کی بیع میں کوشش کی، اگرچہ اس کے گانے کو شیطان کی بانسری کہا۔" }
