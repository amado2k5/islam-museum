id: question/what-is-istikhara
class: question
label:
  ar: "ما الاستخارة؟"
  en: What is istikhara?
summary:
  ar: "الاستخارة ركعتان ودعاء يطلب فيهما المسلم الخيرة من الله في أمر يتردد فيه؛ علّمها النبي أصحابه كما يعلمهم السورة."
  en: "Istikhara is two units of prayer followed by a supplication in which a Muslim asks God for what is better in a matter he is undecided about. The Prophet taught it to his Companions just as he taught them a surah."
wings: []
question:
  ar: "ما الاستخارة؟"
short_answer:
  ar: "الاستخارة ركعتان ودعاء يطلب فيهما المسلم الخيرة من الله في أمر يتردد فيه؛ علّمها النبي أصحابه كما يعلمهم السورة."
long_answer:
  ar: |
    الاستخارة من السنن الصحيحة، ودعاؤها في صحيح البخاري عن جابر {cite:sahih-al-bukhari}.
    ويعرض مدخل [[practice/istikhara|الاستخارة]] صفتها ووقتها.

