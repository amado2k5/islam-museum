id: question/what-is-istikhara
class: question
label:
  ar: "ما الاستخارة؟"
  en: What is istikhara?
  es: "¿Qué es istikhara?"
  fr: "Qu'est-ce que l'istikhara ?"
  ur: "استخارہ کیا ہے؟"
summary:
  ar: "الاستخارة ركعتان ودعاء يطلب فيهما المسلم الخيرة من الله في أمر يتردد فيه؛ علّمها النبي أصحابه كما يعلمهم السورة."
  en: "Istikhara is two units of prayer followed by a supplication in which a Muslim asks God for what is better in a matter he is undecided about. The Prophet taught it to his Companions just as he taught them a surah."
  es: "La oración de Istikhara consta de dos súplicas seguidas de una oración en la que el musulmán pide a Dios la mejor opción en un asunto sobre el que no está seguro. El Profeta se la enseñó a sus Compañeros, al igual que les enseñó una sura."
  fr: "L'istikhara consiste en deux unités de prière suivies d'une invocation au cours de laquelle un musulman demande à Dieu ce qui est le mieux dans une situation sur laquelle il hésite. Le Prophète l'a enseignée à ses Compagnons, tout comme il leur a enseigné une sourate."
  ur: "استخارہ دعا کی دو اکائیاں ہیں جس کے بعد ایک دعا ہے جس میں ایک مسلمان اللہ سے مانگتا ہے کہ اس معاملے میں کیا بہتر ہے جس کے بارے میں اس کا فیصلہ نہیں ہے۔ نبی نے اسے اپنے صحابہ کو اس طرح سکھایا جس طرح آپ نے انہیں ایک سورت سکھائی تھی۔"
