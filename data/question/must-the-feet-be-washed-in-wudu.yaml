    summary: { ar: "في نقل ابن تيمية: يرى الحلي أن الله نص في كتابه على مسح الرجلين، ويروي عن ابن عباس «عضوان مغسولان وعضوان ممسوحان»، ويرى أن الجمهور غيروا ذلك وأوجبوا الغسل؛ والفرض عند الإمامية كما يحكيه ابن تيمية مسحهما إلى الكعبين اللذين هما مجتمع الساق والقدم عند معقد الشراك.", en: "As Ibn Taymiyya reports: al-Hilli holds that God stated in His Book that the feet are wiped, relates from Ibn Abbas 'two limbs washed and two wiped', and holds that the majority changed this and made washing obligatory; the Imami obligation, as Ibn Taymiyya relates it, is to wipe them to the ka'bayn, the meeting of shin and foot where the sandal strap is tied.", ur: "ابن تیمیہ کی نقل میں: حلی کے نزدیک اللہ نے اپنی کتاب میں پاؤں کے مسح کی تصریح کی ہے، وہ ابن عباس سے «دو عضو دھوئے جاتے ہیں اور دو کا مسح ہوتا ہے» روایت کرتے ہیں، اور کہتے ہیں کہ جمہور نے اسے بدل کر دھونا واجب کر دیا؛ امامیہ کے نزدیک فرض، جیسا ابن تیمیہ بیان کرتے ہیں، کعبین تک مسح ہے جو پنڈلی اور قدم کے ملنے کی جگہ، تسمہ باندھنے کے مقام پر ہیں۔" }
