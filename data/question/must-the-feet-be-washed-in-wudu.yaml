id: question/must-the-feet-be-washed-in-wudu
class: question
label: { ar: "هل تُغسل الرجلان في الوضوء أم تُمسحان؟", en: "Are the feet washed or wiped in ablution?", ur: "وضو میں پاؤں دھوئے جائیں یا ان پر مسح کیا جائے؟" }
summary:
  ar: "عدّ ابن المطهر الحلي إيجاب غسل الرجلين تغييراً لما نص عليه القرآن من المسح، وردّ ابن تيمية في منهاج السنة بأن غسل الرجلين منقول بالتواتر العملي عن النبي، وأن لفظ المسح في الآية يحتمل المسح العام الذي يدخل فيه الغسل، وأن قراءة النصب نص في الغسل."
  en: "Ibn al-Mutahhar al-Hilli counted the obligation to wash the feet as a change to the wiping that the Qur'an states; Ibn Taymiyya replied in Minhaj al-Sunna that washing the feet is transmitted from the Prophet by mass practice, that the word 'wipe' in the verse can mean the general wiping of which washing is one kind, and that the accusative reading is explicit for washing."
  ur: "ابن المطہر حلی نے پاؤں دھونے کے وجوب کو قرآن میں مذکور مسح کی تبدیلی قرار دیا؛ ابن تیمیہ نے منہاج السنہ میں جواب دیا کہ پاؤں دھونا نبی سے عملی تواتر کے ساتھ منقول ہے، آیت میں مسح کا لفظ اس عام مسح کا احتمال رکھتا ہے جس کی ایک قسم دھونا ہے، اور نصب والی قراءت دھونے میں صریح ہے۔"
question: { ar: "هل تُغسل الرجلان في الوضوء أم تُمسحان؟", en: "Are the feet washed or wiped in ablution?", ur: "وضو میں پاؤں دھوئے جائیں یا ان پر مسح کیا جائے؟" }
issue:
  ar: "ما فرض الرجلين في الوضوء بحسب آية المائدة وقراءتيها، وهل يُقدَّم ظاهر لفظ المسح أم المنقول من فعل النبي؟"
  en: "What is the obligation for the feet in ablution according to the verse of al-Ma'ida and its two readings, and does the apparent sense of 'wipe' take precedence over what is transmitted of the Prophet's practice?"
  ur: "سورۂ مائدہ کی آیت اور اس کی دو قراءتوں کے مطابق وضو میں پاؤں کا فرض کیا ہے، اور کیا لفظِ مسح کا ظاہر مقدم ہے یا نبی کے عمل کی منقول روایت؟"
short_answer:
  ar: "ابن تيمية (أهل السنة): الغسل، بالسنة المتواترة وبقراءة النصب، والمسح على الخفين ثابت كذلك. الإمامية كما ينقلهم: الفرض مسح الرجلين إلى الكعبين، أي معقد الشراك."
  en: "Ibn Taymiyya (Sunni): washing, by the mass-transmitted Sunna and the accusative reading; wiping over leather socks is likewise established. The Imamiyya as he reports them: the obligation is to wipe the feet to the ka'bayn, meaning the place where the sandal strap is tied."
  ur: "ابن تیمیہ (اہلِ سنت): دھونا، متواتر سنت اور نصب والی قراءت کی بنا پر؛ موزوں پر مسح بھی اسی طرح ثابت ہے۔ امامیہ، جیسا وہ نقل کرتے ہیں: فرض یہ ہے کہ پاؤں پر کعبین تک، یعنی تسمہ باندھنے کی جگہ تک، مسح کیا جائے۔"
perspectives:
  - tradition: sunni-hanbali
    id: ibn-taymiyya-minhaj-washing
    standing: main
    stance: { ar: "الرجلان المكشوفتان تُغسلان، والمسح على الخفين سنة متواترة", en: "Bare feet are washed, and wiping over leather socks is a mass-transmitted Sunna", ur: "کھلے پاؤں دھوئے جاتے ہیں، اور موزوں پر مسح متواتر سنت ہے" }
    summary: { ar: "يحتج ابن تيمية بأن الذين نقلوا وضوء النبي قولاً وفعلاً أكثر من الذين نقلوا لفظ الآية، وبحديث «ويل للأعقاب»، وبأن المسح جنس يدخل فيه الغسل، وبأن قوله «إلى الكعبين» يدل على عظمين ناتئين في كل رجل، وبأن قراءة النصب عطف على الوجوه والأيدي.", en: "Ibn Taymiyya argues that those who transmitted the Prophet's ablution in word and deed outnumber those who transmitted the wording of the verse; he cites the hadith 'Woe to the heels', holds that 'wiping' is a genus that includes washing, that 'to the ka'bayn' points to two protruding bones in each foot, and that the accusative reading joins the feet to the faces and hands.", ur: "ابن تیمیہ دلیل دیتے ہیں کہ جنہوں نے نبی کا وضو قول و عمل سے نقل کیا وہ آیت کے الفاظ نقل کرنے والوں سے زیادہ ہیں؛ وہ حدیث «ایڑیوں کے لیے ہلاکت» پیش کرتے ہیں، کہتے ہیں کہ مسح ایک جنس ہے جس میں دھونا داخل ہے، «الی الکعبین» ہر پاؤں میں دو ابھری ہڈیوں پر دلالت کرتا ہے، اور نصب والی قراءت پاؤں کو چہروں اور ہاتھوں پر عطف کرتی ہے۔" }
    holders: [person/ibn-taymiyya]
    evidence: [{ ref: source/minhaj-sunna-shamela, note: { ar: "منهاج السنة، نسخة الشاملة ص 1129–1133", en: "Minhaj al-Sunna, Shamela export pp. 1129–1133" } }]
    sources: [source/minhaj-sunna-shamela]
  - tradition: sunni
    id: zahiri-ibn-hazm-washing-by-sunna
    standing: secondary
    stance: { ar: "الظاهرية (ابن حزم): القرآن نزل بالمسح، والغسل فرض بالسنة الزائدة الناسخة", en: "Zahiri (Ibn Hazm): the Qur'an came with wiping, and washing is obligatory by the Sunna, which adds to it and abrogates it", ur: "ظاہری (ابن حزم): قرآن مسح کے ساتھ نازل ہوا، اور دھونا اس سنت سے فرض ہے جو اس پر اضافہ کرتی اور اسے منسوخ کرتی ہے" }
    summary: { ar: "يرى ابن حزم في «المحلى» أن آية المائدة نزلت بالمسح، سواء قرئ لفظ الأرجل في الآية بالخفض أو بالنصب، لأنها عطف على الرؤوس لفظاً أو موضعاً، ويحكي المسح عن علي وابن عباس والحسن وعكرمة والشعبي والطبري؛ لكنه يوجب الغسل لحديث عبد الله بن عمرو «ويل للأعقاب من النار» الذي أمر فيه النبي بإسباغ الوضوء في الرجلين، ويراه زائداً على ما في الآية وناسخاً له، والأخذ بالزائد واجب.", en: "In al-Muhalla Ibn Hazm holds that the verse of al-Ma'ida came with wiping, whether the word for the feet in the verse is read in the genitive or the accusative, since it is joined to 'your heads' either in form or in position, and he reports wiping from 'Ali, Ibn 'Abbas, al-Hasan, 'Ikrima, al-Sha'bi and al-Tabari; yet he makes washing obligatory because of 'Abd Allah ibn 'Amr's report 'woe to the heels from the Fire', in which the Prophet ordered full ablution of the feet, and he takes it as adding to what is in the verse and abrogating it, the addition being binding.", ur: "ابن حزم «المحلی» میں کہتے ہیں کہ سورۂ مائدہ کی آیت مسح کے ساتھ نازل ہوئی، خواہ آیت میں پاؤں کا لفظ زیر سے پڑھا جائے یا زبر سے، کیونکہ وہ لفظاً یا محلاً «رؤوسکم» پر معطوف ہے، اور وہ مسح کا قول علی، ابن عباس، حسن، عکرمہ، شعبی اور طبری سے نقل کرتے ہیں؛ لیکن وہ عبد اللہ بن عمرو کی حدیث «ایڑیوں کے لیے آگ سے ہلاکت ہے» کی بنا پر دھونا واجب قرار دیتے ہیں، جس میں نبی نے پاؤں میں پورا وضو کرنے کا حکم دیا، اور اسے آیت پر اضافہ اور اس کا ناسخ سمجھتے ہیں، اور اضافے کو لینا واجب ہے۔" }
