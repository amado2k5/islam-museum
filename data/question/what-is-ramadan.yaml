id: question/what-is-ramadan
class: question
label:
  ar: "ما شهر رمضان؟"
  en: What is the month of Ramadan?
  es: "¿Qué es el mes de Ramadán?"
  fr: "Qu'est-ce que le mois du Ramadan ?"
  ur: "رمضان کا مہینہ کیا ہے؟"
  tr: "Ramazan nedir?"
  id: "Apa itu Ramadan?"
summary:
  ar: "رمضان التاسع من شهور السنة الهجرية، يصوم فيه المسلمون من الفجر إلى غروب الشمس، وفيه أنزل القرآن كما يذكر القرآن نفسه."
  en: "Ramadan is the ninth month of the Hijri year. Muslims fast in it from dawn to sunset, and the Quran was revealed in it, as the Quran itself mentions."
  es: "Ramadán es el noveno mes del calendario islámico. Los musulmanes ayunan en él desde el amanecer hasta el atardecer, y el Corán fue revelado durante este mes, como el propio Corán menciona."
  fr: "Le Ramadan est le neuvième mois de l'année hégirienne. Les musulmans jeûnent durant ce mois, de l'aube au coucher du soleil, et c'est durant ce mois que le Coran a été révélé, comme le mentionne le Coran lui-même."
  ur: "رمضان ہجری سال کا نواں مہینہ ہے۔ مسلمان اس میں فجر سے غروب آفتاب تک روزہ رکھتے ہیں، اور اس میں قرآن نازل ہوا، جیسا کہ خود قرآن نے ذکر کیا ہے۔"
  tr: "Ramazan, Hicri yılının dokuzuncu ayıdır; bu ay Müslümanların gün doğumundan gün batımına kadar oruç tutar ve Kur'an, Kur'an'ın kendisinde belirtildiği gibi vahyedilmiştir."
  id: "Ramadan adalah bulan kesembilan dalam tahun Hijriah, di mana umat Muslim berpuasa dari fajar hingga matahari terbenam, di mana Al-Qur'an diwahyukan seperti yang disebutkan oleh Al-Qur'an itu sendiri."
