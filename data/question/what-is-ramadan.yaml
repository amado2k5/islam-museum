label:
  ar: "ما شهر رمضان؟"
  en: What is the month of Ramadan?
summary:
  ar: "رمضان التاسع من شهور السنة الهجرية، يصوم فيه المسلمون من الفجر إلى غروب الشمس، وفيه أنزل القرآن كما يذكر القرآن نفسه."
  en: "Ramadan is the ninth month of the Hijri year. Muslims fast in it from dawn to sunset, and the Quran was revealed in it, as the Quran itself mentions."
