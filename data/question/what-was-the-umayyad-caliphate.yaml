question:
  ar: ما الدولة الأموية؟
short_answer:
  ar: الدولة الأموية (661–750) أول ملك وراثي في الإسلام؛ عاصمتها دمشق وبلغت من الأندلس إلى السند؛ أسقطها
    العباسيون في الزاب.
long_answer:
  ar: الدولة الأموية أسسها معاوية بن أبي سفيان بعد عام الجماعة 661؛ عاصمتها دمشق وتسعون سنة امتدت فيها
    الفتوح من الأندلس إلى نهر جيحون والسند، وعرفت بنظام الديوان والعربية الإدارية والمساجد الكبرى؛ انتهت
    بثورة العباسيين ومعركة الزاب 750. {cite:wikidata}
