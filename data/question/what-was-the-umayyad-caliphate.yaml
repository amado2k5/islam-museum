label:
  ar: ما الدولة الأموية؟
  en: What was the Umayyad caliphate?
  es: "¿Qué fue el califato omeya?"
  fr: "Qu'était-ce que le califat omeyyade ?"
summary:
  ar: الدولة الأموية (661–750) أول ملك وراثي في الإسلام؛ عاصمتها دمشق وبلغت من الأندلس إلى السند؛ أسقطها
    العباسيون في الزاب.
  en: "The Umayyad Caliphate (661–750) was the first hereditary dynasty in Islam. Its capital was Damascus, and its reach extended from al-Andalus to Sind. The Abbasids overthrew it at the Zab."
  es: "El Califato Omeya (661-750) fue la primera dinastía hereditaria del Islam. Su capital era Damasco y su dominio se extendía desde al-Ándalus hasta Sind. Los abasíes lo derrocaron en el Zab."
  fr: "Le califat omeyyade (661-750) fut la première dynastie héréditaire de l'islam. Sa capitale était Damas et son influence s'étendait d'al-Andalus au Sind. Les Abbassides le renversèrent au Zab."
question:
  ar: ما الدولة الأموية؟
short_answer:
  ar: الدولة الأموية (661–750) أول ملك وراثي في الإسلام؛ عاصمتها دمشق وبلغت من الأندلس إلى السند؛ أسقطها
    العباسيون في الزاب.
long_answer:
  ar: الدولة الأموية أسسها معاوية بن أبي سفيان بعد عام الجماعة 661؛ عاصمتها دمشق وتسعون سنة امتدت فيها
    الفتوح من الأندلس إلى نهر جيحون والسند، وعرفت بنظام الديوان والعربية الإدارية والمساجد الكبرى؛ انتهت
    بثورة العباسيين ومعركة الزاب 750. {cite:wikidata}
