short_answer:
  ar: آدم أبو البشر وأول نبي؛ خلقه الله بيده وأسجد له الملائكة وأسكنه الجنة ثم أهبطه إلى الأرض خليفة.
long_answer:
  ar: '[[person/adam|آدم]] أول الخلق من البشر؛ خلقه الله من طين ونفخ فيه الروح وعلمه الأسماء كلها وأسجد
    له الملائكة فأبى إبليس؛ أسكنه الجنة فأكل من الشجرة فتاب الله عليه وأهبطه إلى الأرض خليفة؛ منه تناسل
    البشر كلهم. {cite:wikidata}'
