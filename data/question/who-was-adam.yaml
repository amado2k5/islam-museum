id: question/who-was-adam
class: question
label:
  ar: من كان آدم؟
  en: Who was Adam?
  es: "¿Quién era Adán?"
  fr: "Qui était Adam ?"
  ur: "آدم کون تھا؟"
  tr: "Adam kimdi?"
  id: "Siapa Adam?"
summary:
  ar: آدم أبو البشر وأول نبي؛ خلقه الله بيده وأسجد له الملائكة وأسكنه الجنة ثم أهبطه إلى الأرض خليفة.
  en: "Adam was the father of humankind and the first prophet. God created him with His own hand, had the angels prostrate before him, settled him in the Garden, and then sent him down to earth as a vicegerent (khalifa)."
  es: "Adán fue el padre de la humanidad y el primer profeta. Dios lo creó con su propia mano, hizo que los ángeles se postraran ante él, lo instaló en el Jardín y luego lo envió a la tierra como vicerregente (khalifa)."
  fr: "Adam fut le père de l'humanité et le premier prophète. Dieu le créa de sa propre main, fit prosterner les anges devant lui, l'établit dans le Jardin, puis l'envoya sur terre comme vicaire (khalifa)."
  ur: "آدم بنی نوع انسان کے باپ اور پہلے نبی تھے۔ خدا نے اسے اپنے ہاتھ سے پیدا کیا، فرشتوں کو اس کے آگے سجدہ کیا، اسے باغ میں بسایا، اور پھر اسے خلیفہ بنا کر زمین پر اتارا۔"
  tr: "Adem insanlığın babası ve ilk peygamberdir; Allah onu eliyle yarattı, melekler ona secde etti, o da Cennet'te yerleşti, sonra onu bir vekil olarak yeryüzüne gönderdi."
  id: "Adam adalah bapa umat manusia dan nabi pertama; Allah menciptakannya dengan tangan-Nya, dan para malaikat sujud kepadanya, dan Ia menetap di Surga, lalu mengirimnya ke bumi sebagai wakil bawah."
question:
  ar: من كان آدم؟
short_answer:
  ar: آدم أبو البشر وأول نبي؛ خلقه الله بيده وأسجد له الملائكة وأسكنه الجنة ثم أهبطه إلى الأرض خليفة.
long_answer:
  ar: '[[person/adam|آدم]] أول الخلق من البشر؛ خلقه الله من طين ونفخ فيه الروح وعلمه الأسماء كلها وأسجد
    له الملائكة فأبى إبليس؛ أسكنه الجنة فأكل من الشجرة فتاب الله عليه وأهبطه إلى الأرض خليفة؛ منه تناسل
    البشر كلهم. {cite:wikidata}'
