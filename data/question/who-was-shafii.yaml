class: question
label:
  ar: من كان الشافعي؟
  en: Who was al-Shafii?
  es: "¿Quién fue al-Shafii?"
  fr: "Qui était al-Shafii ?"
  ur: "الشافعی کون تھا؟"
summary:
  ar: محمد بن إدريس الشافعي (767–820) إمام الأصول؛ وضع الرسالة في أصول الفقه ونشر مذهبه من مكة إلى بغداد
    إلى مصر.
  en: "Muhammad ibn Idris al-Shafii (767–820), imam of legal theory; he wrote al-Risala on the foundations of jurisprudence and spread his school from Mecca to Baghdad and then to Egypt."
  es: "Muhammad ibn Idris al-Shafii (767–820), imán de la teoría jurídica; escribió al-Risala sobre los fundamentos de la jurisprudencia y difundió su escuela desde La Meca hasta Bagdad y luego a Egipto."
  fr: "Muhammad ibn Idris al-Shafii (767–820), imam de la théorie juridique; il a écrit al-Risala sur les fondements de la jurisprudence et a étendu son école de La Mecque à Bagdad puis à l'Égypte."
  ur: "محمد بن ادریس الشافعی (767-820)، قانونی نظریہ کے امام؛ اس نے فقہ کی بنیادوں پر الرسالہ لکھا اور مکہ سے بغداد اور پھر مصر تک اپنے مکتب کو پھیلایا۔"
question:
  ar: من كان الشافعي؟
short_answer:
  ar: محمد بن إدريس الشافعي (767–820) إمام الأصول؛ وضع الرسالة في أصول الفقه ونشر مذهبه من مكة إلى بغداد
    إلى مصر.
long_answer:
  ar: '[[person/al-shafii|الإمام الشافعي]] من فقر غزة إلى إمام المنهج؛ تتلمذ على مالك في المدينة ثم بلغ
    بغداد فتتلمذ له محمد بن الحسن ورفع منظومة أصول الفقه في الرسالة. مذهبه الأقوى في مصر واليمن وجنوب
    شرق آسيا وكردستان والشام. {cite:wikidata}'
