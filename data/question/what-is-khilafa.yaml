short_answer:
  ar: الخلافة هي قيادة الأمة بعد النبي؛ قام بها الراشدون ثم الدول الأموية والعباسية والعثمانية حتى إلغائها
    1924.
long_answer:
  ar: الخلافة هي رئاسة الأمة العامة في الدين والدنيا بعد النبي؛ أولاها عهد [[concept/khilafa-rashida|الخلافة
    الراشدة]] 632–661 (أبو بكر فعمر فعثمان فعلي)، ثم صارت ملكًا وراثيًا في الأموية والعباسية والعثمانية.
    ألغتها تركيا 1924 فافترقت فيها الآراء الحديثة. {cite:wikidata}
