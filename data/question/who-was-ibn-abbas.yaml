id: question/who-was-ibn-abbas
class: question
label:
  ar: من كان ابن عباس؟
  en: Who was Ibn Abbas?
  es: "¿Quién fue Ibn Abbas?"
  fr: "Qui était Ibn Abbas ?"
  ur: "ابن عباس کون تھے؟"
summary:
  ar: عبد الله بن عباس ابن عم النبي؛ حبر الأمة وترجمان القرآن وأعلم الصحابة بالتفسير رغم صغر سنه.
  en: "Abd Allah ibn Abbas, cousin of the Prophet, was the learned man of the community and interpreter of the Qur'an, the most knowledgeable of the Companions in tafsir despite his young age."
  es: "Abd Allah ibn Abbas, primo del Profeta, era el hombre más erudito de la comunidad y el intérprete del Corán, el más versado de los Compañeros en tafsir a pesar de su corta edad."
  fr: "Abd Allah ibn Abbas, cousin du Prophète, était l'homme savant de la communauté et l'interprète du Coran, le plus savant des Compagnons en matière de tafsir malgré son jeune âge."
  ur: "عبداللہ بن عباس، رسول اللہ کے چچا زاد بھائی، کمیونٹی کے عالم اور مفسر قرآن تھے، اپنی چھوٹی عمر کے باوجود تفسیر میں صحابہ میں سب سے زیادہ علم رکھتے تھے۔"
question:
  ar: من كان ابن عباس؟
short_answer:
  ar: عبد الله بن عباس ابن عم النبي؛ حبر الأمة وترجمان القرآن وأعلم الصحابة بالتفسير رغم صغر سنه.
long_answer:
  ar: '[[person/abdullah-ibn-abbas|ابن عباس]] ابن عم النبي؛ دعا له بالفقه في الدين وتأويل التنزيل. من
    أصغر كبار الصحابة سنًا وأسعدهم بالعلم؛ نسب إليه أعظم تفسير مبكر وتروى عنه طبقات التابعين. توفي في
    الطائف 68هـ. {cite:wikidata}'
