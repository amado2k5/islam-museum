long_answer:
  ar: '[[person/abdullah-ibn-abbas|ابن عباس]] ابن عم النبي؛ دعا له بالفقه في الدين وتأويل التنزيل. من
    أصغر كبار الصحابة سنًا وأسعدهم بالعلم؛ نسب إليه أعظم تفسير مبكر وتروى عنه طبقات التابعين. توفي في
