id: question/how-did-the-prophet-live-before-prophethood
class: question
label:
  ar: كيف عاش النبي قبل البعثة؟
  en: How did the Prophet live before prophethood?
summary:
  ar: "يتيم نشأ في بادية بني سعد ثم في حجر جده فعمه، رعى الغنم وسافر في التجارة وتزوج خديجة في الخامسة والعشرين، وعُرف في قومه بالأمين واعتزل عبادة الأوثان، في عرض الرحيق المختوم."
question:
  ar: كيف عاش النبي قبل البعثة؟
short_answer:
  ar: "يتيم نشأ في بادية بني سعد ثم في حجر جده فعمه، رعى الغنم وسافر في التجارة وتزوج خديجة في الخامسة والعشرين، وعُرف في قومه بالأمين واعتزل عبادة الأوثان، في عرض الرحيق المختوم."
long_answer:
  ar: |
    يعرض الرحيق المختوم أربعين عاماً قبل النبوة: مولده بمكة عام الفيل، ورضاعه عند ثويبة ثم في بادية بني سعد عند حليمة، كما في [[event/year-of-the-elephant-and-birth|المولد]] و[[concept/istirda-al-badiya|الاسترضاع في البادية]] {cite:mubarakpuri-raheeq p.54} {cite:mubarakpuri-raheeq p.55}. ثم يتمه من أمه في السادسة ومن جده في الثامنة وكفالة عمه أبي طالب، كما في [[event/death-of-amina|وفاة آمنة]] و[[event/death-of-abd-al-muttalib|وفاة عبد المطلب]] {cite:mubarakpuri-raheeq p.57} {cite:mubarakpuri-raheeq p.58}.
    وفي شبابه رحلة الشام مع عمه ولقاء بحيرا، وحضور حرب الفجار وحلف الفضول، ورعي الغنم، ثم التجارة في مال خديجة والزواج منها في الخامسة والعشرين، كما في [[event/bahira-encounter|لقاء بحيرا]] و[[event/hilf-al-fudul|حلف الفضول]] و[[event/marriage-to-khadija|الزواج من خديجة]] {cite:mubarakpuri-raheeq p.58} {cite:mubarakpuri-raheeq p.59} {cite:mubarakpuri-raheeq p.60} {cite:mubarakpuri-raheeq p.61}.
    وفي الخامسة والثلاثين حكّمته قريش في وضع الحجر الأسود عند [[event/rebuilding-of-the-kaaba|بناء الكعبة]] {cite:mubarakpuri-raheeq p.62}. ويجمل المؤلف صورته: صامت متأمل، نافر من الأوثان لا يحضر لها عيداً، صادق أمين حتى سمّاه قومه [[concept/al-amin|الأمين]] {cite:mubarakpuri-raheeq p.63} {cite:mubarakpuri-raheeq p.64}.
