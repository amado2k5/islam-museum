  - tradition: sunni
    id: restraint-limit-to-the-earth-and-sound-reports
    standing: main
    stance: { ar: "التقيّد بما صحّ نقله، ولا يُبنى على أخبار الغيب بلا إسناد صحيح", en: "Keep to what is soundly transmitted; do not build on unseen reports without a sound chain", ur: "جو صحیح منقول ہو اسی پر رہنا؛ بلا صحیح سند غیبی اخبار پر بنا نہ کرنا" }
    summary: { ar: "ينقل القرطبي عن الفراء أن المراد ما بُثّ في الأرض دون السماء، ويختم كلامه في الأرضين بأن الله أعلم بما استأثر بعلمه؛ ويقول ابن كثير إن ما يُروى عن أحوال الأرضين مما لم يصح سنده إلى معصوم مردود على قائله، ويصف رواية «الأرض البيضاء» عن ابن أبي الدنيا بأنها مرسل منكر جداً، ويحمل أثر ابن عباس في أن في كل أرض نبياً، إن صح، على أنه من الإسرائيليات.", en: "Al-Qurtubi reports from al-Farra' that what is meant is what was dispersed on the earth, not in the heaven, and ends his discussion of the earths by saying God knows best what He kept to Himself; Ibn Kathir says reports about the earths whose chain does not reach an infallible are rejected from whoever says them, calls Ibn Abi al-Dunya's 'white earth' report mursal and very objectionable, and takes Ibn Abbas's report of a prophet in each earth, if sound, to be from the Isra'iliyyat.", ur: "قرطبی فراء سے نقل کرتے ہیں کہ مراد وہ ہے جو زمین میں پھیلایا گیا، آسمان میں نہیں، اور زمینوں کی بحث اس پر ختم کرتے ہیں کہ جو علم اللہ نے اپنے لیے رکھا اسے وہی بہتر جانتا ہے؛ ابن کثیر کہتے ہیں کہ زمینوں کے احوال کی وہ خبریں جن کی سند معصوم تک نہ پہنچے کہنے والے پر مردود ہیں، ابن ابی الدنیا کی «سفید زمین» کی روایت کو مرسل اور بہت منکر کہتے ہیں، اور ابن عباس کے اس اثر کو کہ ہر زمین میں ایک نبی ہے، اگر ثابت ہو تو اسرائیلیات پر محمول کرتے ہیں۔" }
