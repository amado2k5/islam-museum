  - tradition: academic
    id: modern-literature-live-theological-question
    standing: secondary
    stance: { ar: "الأدبيات الحديثة تعالج الموضوع سؤالاً لاهوتياً وثقافياً حياً", en: "Modern literature treats it as a live theological and cultural question", ur: "جدید ادب اسے ایک زندہ الٰہیاتی اور ثقافتی سوال سمجھتا ہے" }
    summary: { ar: "يصف ملخص ناشر برانديس تاجبخش عن Cambridge سنة 2026 أنه يعرض الحياة خارج الأرض والنظر الديني والثقافي إليها مع عناية بالمنظورات الإسلامية، ويبدأ بتاريخ جدل تعدد العوالم في العالم المسيحي ثم ينتقل إلى القرآن والحديث؛ ويصف ملخص ناشر كتاب «اللاهوت الإسلامي والحياة خارج الأرض» بتحرير شعيب أحمد مالك ويورغ ماتياس ديترمان عن Bloomsbury سنة 2024 أنه يجمع مواقف سنية وشيعية من سياقات إسلامية مختلفة ومقارنات مع المسيحية. وللموضوع أيضاً دراسة لديترمان سنة 2021 وفصل لوينتراوب سنة 2014. لم يقرأ المتحف حجج هذه الأعمال بعد.", en: "The publisher's abstract of Parandis Tajbakhsh's study (Cambridge, 2026) says it surveys extraterrestrial life and religious and cultural views of it with attention to Islamic perspectives, beginning with the history of the plurality-of-worlds debate in Christendom and then turning to the Qur'an and hadith; that of Islamic Theology and Extraterrestrial Life, ed. Shoaib Ahmed Malik and Jörg Matthias Determann (Bloomsbury, 2024), says it gathers Sunni and Shi'i positions from different Muslim contexts and comparisons with Christianity. There are also a study by Determann (2021) and a chapter by Weintraub (2014). The museum has not yet read these works' arguments.", ur: "پرندیس تاجبخش کی تصنیف Cambridge سنہ 2026ء کے ناشر کا خلاصہ کہتا ہے کہ وہ زمین سے باہر زندگی اور اس کے بارے میں مذہبی و ثقافتی نظریات کا جائزہ لیتی ہے، اسلامی نقطہ ہائے نظر پر توجہ کے ساتھ، اور مسیحی دنیا میں تعدد عوالم کی بحث کی تاریخ سے شروع ہو کر قرآن و حدیث کی طرف آتی ہے؛ «اسلامی الٰہیات اور زمین سے باہر زندگی» بتحقیق شعیب احمد ملک و یورگ ماتھیاس ڈیترمان Bloomsbury سنہ 2024ء کے ناشر کا خلاصہ کہتا ہے کہ وہ مختلف مسلم سیاقوں سے سنی اور شیعہ مواقف اور مسیحیت سے موازنے جمع کرتی ہے۔ ڈیترمان کا ایک مطالعہ سنہ 2021ء اور وائن ٹراؤب کا ایک باب سنہ 2014ء بھی ہے۔ میوزیم نے ابھی ان تصانیف کے دلائل نہیں پڑھے۔" }
