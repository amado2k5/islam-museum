id: question/is-there-life-beyond-earth
class: question
tags: [cosmos-browser, cosmos-beyond-earth]
label: { ar: "هل توجد حياة خارج الأرض؟", en: "Is there life beyond the earth?", ur: "کیا زمین سے باہر زندگی ہے؟", es: "¿Existe vida más allá de la Tierra?" }
summary:
  ar: "لا نص صريح في ما قرأه المتحف على كائنات في كوكب آخر؛ ويقرأ المفسرون آية الدابة في الشورى 29 بأنها مخلوقات في السماء والأرض، أكثر من سُمّي من سكان السماء فيها الملائكة، وزاد ابن كثير الجن، وفتح الرازي احتمال أنواع من الحيوان في السماوات وقدرة الله على عوالم أخرى، وقيّد الفراء الآية بالأرض في نقل القرطبي، وتحفّظ ابن كثير على أخبار بلا إسناد صحيح."
  en: "No plain text read by the museum speaks of beings on another planet. The commentators read the creature verse of al-Shura 42:29 as creatures in the heaven and the earth, the heaven's inhabitants they name being mostly angels; Ibn Kathir adds jinn, al-Razi leaves open kinds of animal in the heavens and God's power over other worlds, al-Farra' limits the verse to the earth in al-Qurtubi's report, and Ibn Kathir holds back from reports without a sound chain."
  ur: "میوزیم کی پڑھی ہوئی کسی صریح نص میں کسی اور سیارے کے باشندوں کا ذکر نہیں۔ مفسرین سورۂ شوریٰ 42:29 کی «دابّہ» والی آیت کو آسمان و زمین کی مخلوقات سمجھتے ہیں، جن میں آسمان کے باشندوں میں زیادہ تر فرشتوں کا نام لیا گیا؛ ابن کثیر جنوں کا اضافہ کرتے ہیں، رازی آسمانوں میں حیوانات کی اقسام اور اللہ کی قدرت سے دوسرے عوالم کا امکان کھلا رکھتے ہیں، قرطبی کی نقل میں فراء آیت کو زمین تک محدود کرتے ہیں، اور ابن کثیر بلا صحیح سند اخبار سے رک جاتے ہیں۔"
  es: "Ningún texto llano leído por el museo habla de seres en otro planeta. Los comentaristas interpretan el versículo sobre las criaturas de al-Shura 42:29 como criaturas en el cielo y la tierra, nombrando principalmente ángeles a los habitantes del cielo; Ibn Kathir añade genios, al-Razi deja abierta la posibilidad de mencionar tipos de animales en los cielos y el poder de Dios sobre otros mundos, al-Farra' limita el versículo a la tierra en el relato de al-Qurtubi, e Ibn Kathir se abstiene de incluir relatos sin una cadena de transmisión fiable."
question: { ar: "هل في الكون مخلوقات حية غير الإنسان والجن والملائكة، تقيم خارج الأرض؟", en: "Does the universe hold living creatures other than humans, jinn and angels, dwelling beyond the earth?", ur: "کیا کائنات میں انسان، جن اور فرشتوں کے سوا ایسی زندہ مخلوقات ہیں جو زمین سے باہر رہتی ہوں؟" }
issue:
  ar: "تذكر آيات أن الله بثّ في السماوات والأرض من دابة، وأنه يخلق ما لا يعلمه الناس، فهل تدل على مخلوقات حية خارج الأرض سوى الملائكة والجن، أم يُكتفى بما نصّت عليه المصادر؟"
  en: "Verses say God dispersed creatures in the heavens and the earth and creates what people do not know. Do they point to living creatures beyond the earth apart from angels and jinn, or should one keep to what the sources state?"
  ur: "آیات بتاتی ہیں کہ اللہ نے آسمانوں اور زمین میں جاندار پھیلائے اور وہ پیدا کرتا ہے جو لوگ نہیں جانتے؛ کیا یہ فرشتوں اور جنوں کے سوا زمین سے باہر زندہ مخلوقات پر دلالت کرتی ہیں، یا جو مصادر میں صراحتاً ہے اسی پر اکتفا کیا جائے؟"
short_answer:
  ar: "المفسرون الذين قُرئوا: الآيات تتحدث عن مخلوقات في السماء والأرض، وفي سكان السماء الملائكة عند مجاهد والطبري، والملائكة والجن والإنس وسائر الحيوان عند ابن كثير، ويرى الرازي أنه لا يبعد أن تكون في السماوات أنواع حيوان وأن الله قادر على عوالم أخرى دون أن يثبت وقوعها. ويقيّد الفراء الدابة بالأرض في نقل القرطبي، ويردّ ابن كثير الأخبار غير الصحيحة عن المخلوقات الغيبية. الأدبيات الحديثة تعالج الموضوع سؤالاً لاهوتياً حياً، ولم يقرأ المتحف حججها بعد."
  en: "The commentators read: the verses speak of creatures in the heaven and the earth; the heaven's inhabitants are the angels for Mujahid and al-Tabari, and angels, jinn, people and all animals for Ibn Kathir; al-Razi holds it not far-fetched that there are kinds of animal in the heavens and that God is able to create other worlds, without asserting that they exist. Al-Farra', in al-Qurtubi's report, limits the word to the earth, and Ibn Kathir rejects unsound reports about unseen creatures. Modern literature treats it as a live theological question; the museum has not yet read its arguments."
  ur: "پڑھے گئے مفسرین: آیات آسمان و زمین کی مخلوقات کا ذکر کرتی ہیں؛ آسمان کے باشندے مجاہد اور طبری کے ہاں فرشتے ہیں، ابن کثیر کے ہاں فرشتے، جن، انسان اور تمام حیوانات؛ رازی کے نزدیک یہ بعید نہیں کہ آسمانوں میں حیوانات کی اقسام ہوں اور اللہ دوسرے عوالم پر قادر ہے، ان کے واقع ہونے کے دعوے کے بغیر۔ قرطبی کی نقل میں فراء لفظ کو زمین تک محدود کرتے ہیں، اور ابن کثیر غیبی مخلوقات کی غیر صحیح خبروں کو رد کرتے ہیں۔ جدید ادب اسے ایک زندہ الٰہیاتی سوال سمجھتا ہے؛ میوزیم نے ابھی اس کے دلائل نہیں پڑھے۔"
