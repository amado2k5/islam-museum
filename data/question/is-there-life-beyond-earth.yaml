  - tradition: sunni
    id: exegetes-creatures-in-heavens-include-more
    standing: main
    stance: { ar: "الدابة في الشورى 29 مخلوقات في السماء والأرض، وسكان السماء ملائكة وجن عند بعض المفسرين، ويُفتح باب أنواع أخرى", en: "The creatures of al-Shura 42:29 are in the heaven and the earth, the heaven's being angels and, for some, jinn, with the door left open to other kinds", ur: "شوریٰ 42:29 کی مخلوقات آسمان و زمین میں ہیں، آسمان کی فرشتے اور بعض کے نزدیک جن، اور دوسری اقسام کا دروازہ کھلا" }
    summary: { ar: "يروي الطبري عن مجاهد أن الدابة الناس والملائكة، ويقول ابن كثير إن اللفظ يشمل الملائكة والجن والإنس وسائر الحيوان، ويذكر الرازي أن الله لا يبعد أن يكون خلق في السماوات أنواعاً من الحيوان يمشون مشي الناس على الأرض، ويقول في الفاتحة إن الله قادر على ألف ألف عالم خارج هذا العالم مع ضعف أدلة الفلاسفة على وحدته؛ وكلامه في القدرة والإمكان لا في الإخبار بالوقوع.", en: "Al-Tabari reports from Mujahid that the creatures are people and angels; Ibn Kathir says the word covers angels, jinn, people and all animals; al-Razi says it is not far-fetched that God created in the heavens kinds of animal that walk as people do on the earth, and in al-Fatiha says God is able to create a thousand thousand worlds outside this one, the philosophers' arguments for its unity being weak; he speaks of power and possibility, not of what has occurred.", ur: "طبری مجاہد سے روایت کرتے ہیں کہ جاندار سے مراد انسان اور فرشتے ہیں؛ ابن کثیر کہتے ہیں کہ لفظ فرشتوں، جنوں، انسانوں اور تمام حیوانات کو شامل ہے؛ رازی کہتے ہیں کہ یہ بعید نہیں کہ اللہ نے آسمانوں میں حیوانات کی ایسی اقسام پیدا کی ہوں جو انسانوں کی طرح زمین پر چلتی ہوں، اور فاتحہ میں کہتے ہیں کہ اللہ اس عالَم سے باہر ایک ہزار ہزار عالَم پیدا کر سکتا ہے اور اس کی وحدت پر فلسفیوں کے دلائل کمزور ہیں؛ ان کا کلام قدرت اور امکان میں ہے، واقع ہونے کی خبر میں نہیں۔" }
