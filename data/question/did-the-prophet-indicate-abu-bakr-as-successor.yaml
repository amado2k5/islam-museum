id: question/did-the-prophet-indicate-abu-bakr-as-successor
class: question
label: { ar: "هل أشار النبي إلى خلافة أبي بكر؟", en: "Did the Prophet point to Abu Bakr as his successor?", ur: "کیا نبی نے ابو بکر کی خلافت کی طرف اشارہ کیا؟", es: "¿Señaló el Profeta a Abu Bakr como su sucesor?", fr: "Le Prophète a-t-il désigné Abou Bakr comme son successeur ?", tr: "Peygamber, Ebu Bekir halifeliğinden mi bahsetti?", id: "Apakah Nabi merujuk pada kekhalifahan Abu Bakr?" }
summary:
  ar: "ينقل الحلي عن أهل السنة أن النبي لم ينص على إمام ومات عن غير وصية وأن أبا بكر تولى بمبايعة عمر برضا أربعة، ويرى أن خلافة الثلاثة باطلة؛ ويرى ابن تيمية أن النبي أرشد الأمة إلى خلافة أبي بكر ودلها عليها بأحاديث كحديث المرأة «فإن لم تجديني فأتي أبا بكر» وبتقديمه للصلاة بالناس."
  en: "Al-Hilli reports the Sunni view as holding that the Prophet designated no imam and that Abu Bakr took office by Umar's pledge with the consent of four, and himself holds the three caliphates invalid; Ibn Taymiyya holds that the Prophet guided the community to Abu Bakr's caliphate through reports such as that of the woman told 'if you do not find me, go to Abu Bakr' and by putting him forward to lead the prayer."
  es: "Al-Hilli informa que la opinión sunita sostiene que el Profeta no designó a ningún imán y que Abu Bakr asumió el cargo por la promesa de Umar con el consentimiento de cuatro, y él mismo considera inválidos los tres califatos; Ibn Taymiyya sostiene que el Profeta guió a la comunidad hacia el califato de Abu Bakr a través de relatos como el de la mujer a la que se le dijo \"si no me encontráis, id a Abu Bakr\" y proponiéndolo para dirigir la oración."
  fr: "Al-Hilli rapporte que, selon l'opinion sunnite, le Prophète n'a désigné aucun imam et qu'Abou Bakr a accédé au califat par l'engagement d'Omar avec le consentement de quatre personnes, et considère lui-même les trois califats comme invalides; Ibn Taymiyya soutient que le Prophète a guidé la communauté vers le califat d'Abou Bakr par des récits tels que celui de la femme à qui il a été dit: « Si vous ne me trouvez pas, allez voir Abou Bakr », et en le désignant pour diriger la prière."
  ur: "الحلّی نے سنیوں کے نظریہ کو یہ کہتے ہوئے بیان کیا ہے کہ نبی نے کوئی امام نہیں مقرر کیا اور ابوبکر نے چار لوگوں کی رضامندی سے عمر کے عہد سے عہدہ سنبھالا، اور خود تینوں خلافت کو باطل قرار دیتا ہے۔ ابن تیمیہ کا خیال ہے کہ رسول اللہ نے امت کو ابوبکر کی خلافت کی طرف رہنمائی کی جیسے کہ عورت نے کہا کہ اگر تم مجھے نہ پاؤ تو ابوبکر کے پاس جاؤ۔"
  tr: "El-Hilli, Ehl-sünnet'ten Peygamber'in bir imam atamadığını ve vasiyetsiz öldüğünü, Ebu Bekir'in ise dört kişinin izniyle Ömer'e bağlılık yemini ederek göreve başladığını bildirir. Üç kişinin halifeliğinin geçersiz olduğuna inanır; İbn Teymiye, Peygamber'in milleti Ebu Bekir halifeliğine yönlendirdiğine ve kadının 'Beni bulamazsanız, Ebu Bekir'i getirin' gibi hadislerle ve halkı dua ederek yönlendirdiğine inanır."
  id: "Al-Hilli melaporkan dari Ahl al-Sunnah bahwa Nabi tidak mengangkat imam dan wafat tanpa wasiat, dan Abu Bakr menjabat dengan bersumpah setia kepada Umar dengan persetujuan empat orang lainnya. Ia percaya bahwa kekhalifahan ketiganya tidak sah; Ibn Taymiyyah percaya bahwa Nabi membimbing bangsa ke kekhalifahan Abu Bakr dan membimbingnya dengan hadits seperti hadits wanita itu: 'Jika engkau tidak menemukan aku, bawalah Abu Bakr,' dan dengan memimpin umat dalam doa."
question: { ar: "هل أشار النبي إلى خلافة أبي بكر؟", en: "Did the Prophet point to Abu Bakr as his successor?" }
issue: { ar: "هل ثبتت خلافة أبي بكر بنص أو إشارة من النبي، أم بالاختيار وحده، أم أن النص كان لعلي؟" }
short_answer:
  ar: "ابن تيمية: أرشد إليها ودلّ عليها دون عهد مكتوب، والأمة اختارت من علمت أنه الأحق؛ الحلي: النص كان لعلي، وخلافة من تقدمه باطلة."
  en: "Ibn Taymiyya: the Prophet guided to it and indicated it without a written appointment, and the community chose the one it knew to be most deserving. Al-Hilli: the designation was for Ali, and the caliphates before him were invalid."
