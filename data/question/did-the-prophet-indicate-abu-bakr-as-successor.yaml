id: question/did-the-prophet-indicate-abu-bakr-as-successor
class: question
label: { ar: "هل أشار النبي إلى خلافة أبي بكر؟", en: "Did the Prophet point to Abu Bakr as his successor?", ur: "کیا نبی نے ابو بکر کی خلافت کی طرف اشارہ کیا؟" }
summary:
  ar: "ينقل الحلي عن أهل السنة أن النبي لم ينص على إمام ومات عن غير وصية وأن أبا بكر تولى بمبايعة عمر برضا أربعة، ويرى أن خلافة الثلاثة باطلة؛ ويرى ابن تيمية أن النبي أرشد الأمة إلى خلافة أبي بكر ودلها عليها بأحاديث كحديث المرأة «فإن لم تجديني فأتي أبا بكر» وبتقديمه للصلاة بالناس."
  en: "Al-Hilli reports the Sunni view as holding that the Prophet designated no imam and that Abu Bakr took office by Umar's pledge with the consent of four, and himself holds the three caliphates invalid; Ibn Taymiyya holds that the Prophet guided the community to Abu Bakr's caliphate through reports such as that of the woman told 'if you do not find me, go to Abu Bakr' and by putting him forward to lead the prayer."
question: { ar: "هل أشار النبي إلى خلافة أبي بكر؟", en: "Did the Prophet point to Abu Bakr as his successor?" }
issue: { ar: "هل ثبتت خلافة أبي بكر بنص أو إشارة من النبي، أم بالاختيار وحده، أم أن النص كان لعلي؟" }
short_answer:
  ar: "ابن تيمية: أرشد إليها ودلّ عليها دون عهد مكتوب، والأمة اختارت من علمت أنه الأحق؛ الحلي: النص كان لعلي، وخلافة من تقدمه باطلة."
  en: "Ibn Taymiyya: the Prophet guided to it and indicated it without a written appointment, and the community chose the one it knew to be most deserving. Al-Hilli: the designation was for Ali, and the caliphates before him were invalid."
