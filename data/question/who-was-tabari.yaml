short_answer:
  ar: ابن جرير الطبري (838–923) إمام المؤرخين والمفسرين؛ صاحب تاريخ الرسل والملوك وجامع البيان في تفسير
    القرآن.
long_answer:
  ar: '[[person/al-tabari|الطبري]] الطبرستاني البغدادي؛ عاش بين مكة ومصر والشام وبغداد وجمع علوم عصره:
    تفسيره جامع البيان أصل التفسير بالمأثور، وتاريخه أشمل سجل للعالم الإسلامي إلى سنة 302هـ، وله فقه مذهبه
    الخاص وإن لم يبقَ له أتباع. {cite:wikidata}'
