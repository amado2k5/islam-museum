summary:
  ar: ابن جرير الطبري (838–923) إمام المؤرخين والمفسرين؛ صاحب تاريخ الرسل والملوك وجامع البيان في تفسير
    القرآن.
  en: "Ibn Jarir al-Tabari (838–923), imam of historians and exegetes; author of the History of the Prophets and Kings and of Jami al-Bayan on the interpretation of the Qur'an."
  es: "Ibn Jarir al-Tabari (838–923), imán de historiadores y exegetas; autor de la Historia de los Profetas y los Reyes y de Jami al-Bayan sobre la interpretación del Corán."
  fr: "Ibn Jarir al-Tabari (838–923), imam des historiens et exégètes; auteur de l'Histoire des Prophètes et des Rois et du Jami al-Bayan sur l'interprétation du Coran."
  ur: "ابن جریر الطبری (838-923)، مورخین اور مفسرین کا امام؛ انبیاء اور بادشاہوں کی تاریخ اور قرآن کی تفسیر پر جامع البیان کے مصنف۔"
  tr: "İbn Jarir al-Tabari (838–923), önde gelen tarihçi ve yorumcuydu; Tarikh al-Rusul wal-Muluk wa Jami' al-Bayan fi Tafsir al-Qur'an'ın yazarıdır."
  id: "Ibn Jarir al-Tabari (838–923) adalah sejarawan dan komentator terkemuka; penulis Tarikh al-Rusul wal-Muluk wa Jami' al-Bayan fi Tafsir al-Qur'an."
question:
  ar: من كان الطبري؟
short_answer:
  ar: ابن جرير الطبري (838–923) إمام المؤرخين والمفسرين؛ صاحب تاريخ الرسل والملوك وجامع البيان في تفسير
    القرآن.
long_answer:
  ar: '[[person/al-tabari|الطبري]] الطبرستاني البغدادي؛ عاش بين مكة ومصر والشام وبغداد وجمع علوم عصره:
    تفسيره جامع البيان أصل التفسير بالمأثور، وتاريخه أشمل سجل للعالم الإسلامي إلى سنة 302هـ، وله فقه مذهبه
    الخاص وإن لم يبقَ له أتباع. {cite:wikidata}'
