label:
  ar: من كان الطبري؟
  en: Who was al-Tabari?
  es: "¿Quién fue al-Tabari?"
  fr: "Qui était al-Tabari ?"
  ur: "الطبری کون تھا؟"
  tr: "El-Tabari kimdi?"
