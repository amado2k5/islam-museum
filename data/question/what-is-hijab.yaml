id: question/what-is-hijab
class: question
label:
  ar: ما الحجاب؟
  en: What is the hijab?
  es: "¿Qué es el hiyab?"
  fr: "Qu'est-ce que le hijab ?"
  ur: "حجاب کیا ہے؟"
  tr: "Başörtüsü nedir?"
  id: "Apa itu hijab?"
summary:
  ar: الحجاب هو ستر المرأة المسلمة لزينتها عن غير محارمها؛ من فروض اللباس عند جمهور العلماء وتتنوع صوره
    عبر الثقافات.
  en: "Hijab is a Muslim woman's covering of her adornment from those who are not her mahram (unmarriageable kin). According to the majority of scholars it is one of the obligations of dress, and its forms vary across cultures."
  es: "El hiyab es la vestimenta que usa la mujer musulmana para cubrirse y protegerse de quienes no son sus mahram (parientes con quienes no puede contraer matrimonio). Según la mayoría de los eruditos, es una de las obligaciones de la vestimenta, y sus formas varían según las culturas."
  fr: "Le hijab est le voile que porte une femme musulmane pour se protéger des regards indiscrets de ceux qui ne sont pas ses mahrams (membres de sa famille avec lesquels le mariage est interdit). Selon la majorité des érudits, il s'agit d'une obligation vestimentaire, et ses formes varient selon les cultures."
  ur: "حجاب ایک مسلمان عورت کی زینت کا پردہ ہے جو اس کے محرم ⁦(غیر شادی شدہ رشتہ دار)⁩ نہیں ہیں۔ جمہور علماء کے نزدیک یہ لباس کے فرائض میں سے ایک ہے، اور اس کی شکلیں مختلف ثقافتوں میں مختلف ہوتی ہیں۔"
  tr: "Başörtüsü, bir Müslüman kadının kendini mahramları dışındaki kişilerden giydirmek için kullandığı örtüdür; çoğu alimin tarafından dini bir giyim zorunluluğu olarak kabul edilir ve biçimleri kültürlere göre değişiklik gösterir."
  id: "Hijab adalah penutup wanita Muslim untuk menghias dirinya dari orang lain selain mahramnya; menurut mayoritas ulama, ini dianggap sebagai kewajiban keagamaan dalam berpakaian, dan bentuknya berbeda-beda antar budaya."
question:
  ar: ما الحجاب؟
short_answer:
  ar: الحجاب هو ستر المرأة المسلمة لزينتها عن غير محارمها؛ من فروض اللباس عند جمهور العلماء وتتنوع صوره
    عبر الثقافات.
long_answer:
  ar: الحجاب في الشرع هو ستر المرأة المسلمة البالغة زينتها عن غير محارمها؛ حددته آيتا النور والأحزاب واختلف
    الفقهاء في تفاصيله ككشف الوجه والكفين. أما في لغة العصر فيُستعمل غطاء الرأس خاصة، وتتنوع أشكاله من
    الحجاب إلى النقاب إلى الشادور حسب البلدان. {cite:wikidata}
