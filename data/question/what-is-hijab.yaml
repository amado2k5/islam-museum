long_answer:
  ar: الحجاب في الشرع هو ستر المرأة المسلمة البالغة زينتها عن غير محارمها؛ حددته آيتا النور والأحزاب واختلف
    الفقهاء في تفاصيله ككشف الوجه والكفين. أما في لغة العصر فيُستعمل غطاء الرأس خاصة، وتتنوع أشكاله من
    الحجاب إلى النقاب إلى الشادور حسب البلدان. {cite:wikidata}
