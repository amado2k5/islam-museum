question:
  ar: ما ليلة القدر؟
short_answer:
  ar: ليلة القدر هي ليلة نزول القرآن في رمضان وهي خير من ألف شهر؛ تطلب في العشر الأواخر وأرجاها الوترية
    عند الأكثر.
long_answer:
  ar: ليلة القدر هي الليلة التي بدأ فيها نزول القرآن، قال تعالى إنها خير من ألف شهر. ورد في السنّة أنها
    في العشر الأواخر من رمضان وأرجاها الليالي الوترية وفيها ليلة السابع والعشرين عند كثير من العلماء؛
    يتحراها المسلمون بالقيام والدعاء. {cite:wikidata}
