id: question/what-is-laylat-al-qadr
class: question
label:
  ar: ما ليلة القدر؟
  en: What is Laylat al-Qadr?
  es: "¿Qué es Laylat al-Qadr?"
  fr: "Qu'est-ce que Laylat al-Qadr ?"
  ur: "لیلۃ القدر کیا ہے؟"
  tr: "Kararname Gecesi nedir?"
  id: "Apa itu Malam Dekrit?"
summary:
  ar: ليلة القدر هي ليلة نزول القرآن في رمضان وهي خير من ألف شهر؛ تطلب في العشر الأواخر وأرجاها الوترية
    عند الأكثر.
  en: "The Night of Power is the night in Ramadan when the Quran was revealed, and it is better than a thousand months. It is sought in the last ten nights, and according to most scholars its most hoped-for nights are the odd ones."
  es: "La Noche del Destino es la noche de Ramadán en que se reveló el Corán, y es mejor que mil meses. Se busca durante las últimas diez noches, y según la mayoría de los eruditos, las noches más anheladas son las impares."
  fr: "La Nuit du Destin est la nuit du Ramadan durant laquelle le Coran a été révélé, et elle est meilleure que mille mois. On l'attend avec impatience parmi les dix dernières nuits du mois, et selon la plupart des savants, les nuits impaires sont les plus propices."
  ur: "شب قدر رمضان المبارک کی وہ رات ہے جس میں قرآن نازل ہوا اور یہ ہزار مہینوں سے بہتر ہے۔ یہ آخری عشرہ کی راتوں میں تلاش کی جاتی ہے اور اکثر علماء کے نزدیک اس کی سب سے زیادہ امید کی جانے والی راتیں طاق راتیں ہیں۔"
  tr: "Leylat Kadir, Kur'an'ın Ramazan ayında indirildiği gecedir ve bin aydan daha iyidir; son on gecede aranır ve çoğu insan bunu tuhaf bir namaz olarak görür."
  id: "Laylat al-Qadr adalah malam ketika Al-Qur'an diwahyukan di bulan Ramadan, dan itu lebih baik daripada seribu bulan; ia dicari pada sepuluh malam terakhir, dan kebanyakan orang menganggapnya sebagai solat yang jarang."
question:
  ar: ما ليلة القدر؟
short_answer:
  ar: ليلة القدر هي ليلة نزول القرآن في رمضان وهي خير من ألف شهر؛ تطلب في العشر الأواخر وأرجاها الوترية
    عند الأكثر.
long_answer:
  ar: ليلة القدر هي الليلة التي بدأ فيها نزول القرآن، قال تعالى إنها خير من ألف شهر. ورد في السنّة أنها
    في العشر الأواخر من رمضان وأرجاها الليالي الوترية وفيها ليلة السابع والعشرين عند كثير من العلماء؛
    يتحراها المسلمون بالقيام والدعاء. {cite:wikidata}
