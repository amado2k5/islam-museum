id: question/who-are-ahl-al-bayt
class: question
label:
  ar: من أهل البيت؟
  en: Who are the Ahl al-Bayt?
  es: "¿Quiénes son los Ahl al-Bayt?"
  fr: "Qui sont les Ahl al-Bayt ?"
  ur: "اہل بیت کون ہیں؟"
summary:
  ar: أهل البيت قرابة النبي الذين حرّمت عليهم الصدقة وذهب الله عنهم الرجس؛ عند السنة علي وفاطمة والحسن
    والحسين وعمهم وبنيهم.
  en: "The Ahl al-Bayt are the Prophet's kin, for whom charity is forbidden and from whom God removed impurity. In the Sunni view they are Ali, Fatima, al-Hasan and al-Husayn, and their uncle and their sons."
  es: "Los Ahl al-Bayt son los parientes del Profeta, para quienes la caridad está prohibida y de quienes Dios eliminó la impureza. Según la visión sunita, son Ali, Fátima, al-Hasan y al-Husayn, así como su tío y sus hijos."
  fr: "Les Ahl al-Bayt sont les proches du Prophète, pour lesquels l'aumône est interdite et dont Dieu a purifié les âmes. Selon la tradition sunnite, il s'agit d'Ali, Fatima, al-Hasan et al-Husayn, ainsi que de leur oncle et de leurs fils."
  ur: "اہل بیت پیغمبر کے وہ رشتے دار ہیں جن پر صدقہ حرام ہے اور جن سے خدا نے نجاست کو دور کیا ہے۔ سنیوں کے نزدیک وہ علی، فاطمہ، الحسن اور الحسین، اور ان کے چچا اور ان کے بیٹے ہیں۔"
question:
  ar: من أهل البيت؟
short_answer:
  ar: أهل البيت قرابة النبي الذين حرّمت عليهم الصدقة وذهب الله عنهم الرجس؛ عند السنة علي وفاطمة والحسن
    والحسين وعمهم وبنيهم.
long_answer:
  ar: '[[group/ahl-al-bayt|أهل البيت]] عند جمهور أهل السنة آية التطهير نزلت في النساء ثم أدخل النبي عليًا
    وفاطمة وابنيهما في الكساء؛ لهم حقوق المودة والأفضلية؛ عند الشيعة هم أهل العصمة خاصة والأئمة من صلب
    الحسين. {cite:wikidata}'
