id: question/did-uthman-banish-abu-dharr
class: question
label: { ar: "هل نفى عثمان أبا ذر إلى الربذة؟", en: "Did Uthman banish Abu Dharr to al-Rabadha?", ur: "کیا عثمان نے ابو ذر کو ربذہ جلاوطن کیا؟" }
summary:
  ar: "اختلف المؤرخون في نزول أبي ذر الغفاري الربذة في خلافة عثمان بعد خلافه مع معاوية بالشام في آية الكنز: فمن الأخبار ما يجعله نفياً من عثمان، ويرجح الصلابي، ناقلاً عن البخاري والحسن البصري وابن سيرين وابن العربي، أنه نزلها باختياره بإذن عثمان، ويرد الربط بين رأي أبي ذر وابن سبأ."
  en: "Historians differ over Abu Dharr al-Ghifari's move to al-Rabadha under Uthman after his dispute with Mu'awiya in Syria over the verse on hoarding: some reports make it a banishment by Uthman, while al-Sallabi, citing al-Bukhari, al-Hasan al-Basri, Ibn Sirin and Ibn al-Arabi, holds that he settled there by choice with Uthman's leave, and rejects the link drawn between Abu Dharr's view and Ibn Saba."
question: { ar: "هل نفى عثمان أبا ذر إلى الربذة؟", en: "Did Uthman banish Abu Dharr to al-Rabadha?", ur: "کیا عثمان نے ابو ذر کو ربذہ جلاوطن کیا؟" }
issue: { ar: "هل كان نزول أبي ذر الربذة نفياً قسرياً من الخليفة أم اختياراً منه بإذنه، وهل تأثر رأيه في المال بابن سبأ؟", en: "Was Abu Dharr's move to al-Rabadha a forced banishment by the caliph or his own choice with the caliph's leave, and was his view on wealth influenced by Ibn Saba?" }
short_answer:
  ar: "الصلابي ومن ينقل عنهم من أهل السنة: نزلها باختياره بإذن عثمان، وأخبار النفي ضعيفة؛ ومن الأخبار التاريخية كالتي في الكامل لابن الأثير ما يذكر أن عثمان نفاه، وبنى عليه ابن المطهر الحلي من الإمامية."
  en: "Al-Sallabi and the Sunni authorities he quotes: he went by choice with Uthman's leave, and the banishment reports are weak. Some historical reports, such as the one in Ibn al-Athir's al-Kamil, say Uthman banished him, and the Imami scholar Ibn al-Mutahhar al-Hilli built on that."
