    summary: { ar: "في نقل الصلابي: قارب أحمد أمين بين رأي أبي ذر ورأي مزدك، واحتمل أن يكون ابن سبأ تلقاه من مزدكية العراق فاعتنقه أبو ذر بحسن نية؛ وعظّم سعيد الأفغاني في «عائشة والسياسة» دور ابن سبأ؛ ويرد الصلابي ذلك بأن أخبار خلاف أبي ذر ومعاوية عند البخاري وابن كثير وكتب التراجم لا تذكر ابن سبأ، وبأن ظهور ابن سبأ في البصرة نحو سنة 32 كان بعد مناظرة أبي ذر لمعاوية سنة 30 ووفاته بالربذة سنة 31 أو 32.", en: "As al-Sallabi reports it: Ahmad Amin compared Abu Dharr's view with Mazdak's and thought Ibn Saba might have taken it from the Mazdakites of Iraq and Abu Dharr adopted it in good faith; Sa'id al-Afghani in 'A'isha wa-l-Siyasa magnified Ibn Saba's role. Al-Sallabi replies that the accounts of the dispute in al-Bukhari, Ibn Kathir and the biographical works do not mention Ibn Saba, and that Ibn Saba's appearance in Basra around 32 AH came after Abu Dharr's debate with Mu'awiya in 30 and his death at al-Rabadha in 31 or 32." }
