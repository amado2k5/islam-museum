    summary: { ar: "يستند الصلابي إلى رواية البخاري عن زيد بن وهب: كتب معاوية يشكو أبا ذر فاستقدمه عثمان، فلما كثر عليه الناس قال له عثمان إن شئت تنحيت فكنت قريباً؛ وإلى رواية عند ابن حجر أن أبا ذر قال لعثمان ائذن لي بالربذة فأذن له؛ وإلى قول الحسن البصري «معاذ الله» لمن سأله أأخرجه عثمان، وإنكار ابن سيرين ذلك؛ ويرى أن رواية النفي عند ابن سعد فيها بريدة بن سفيان الأسلمي الذي ضعفه ابن حجر.", en: "Al-Sallabi relies on al-Bukhari's report from Zayd ibn Wahb: Mu'awiya wrote complaining of Abu Dharr, Uthman summoned him, and when people crowded around him Uthman said, if you wish, withdraw and stay nearby; on a report in Ibn Hajar that Abu Dharr asked Uthman's leave to go to al-Rabadha and was granted it; on al-Hasan al-Basri's 'God forbid!' to one who asked whether Uthman expelled him, and Ibn Sirin's denial; he holds that the banishment report in Ibn Sa'd contains Burayda ibn Sufyan al-Aslami, whom Ibn Hajar judged weak." }
