id: question/who-was-talha
class: question
label:
  ar: من كان طلحة بن عبيد الله؟
  en: Who was Talha ibn Ubayd Allah?
  es: "¿Quién fue Talha ibn Ubayd Allah?"
  fr: "Qui était Talha ibn Ubayd Allah ?"
  ur: "طلحہ بن عبید اللہ کون تھے؟"
  tr: "Talha ibn Ubeyd Allah kimdi?"
  id: "Siapakah Talha ibn Ubayd Allah?"
summary:
  ar: طلحة بن عبيد الله الفياض؛ من العشرة المبشرين وصاحب يوم أُحد الذي وقى النبي بنفسه؛ قتل في الجمل 656.
  en: "Talha ibn Ubayd Allah al-Fayyad, one of the Ten Given Glad Tidings of Paradise, and the man of the Day of Uhud who shielded the Prophet with his own body; killed at the Battle of the Camel in 656."
  es: "Talha ibn Ubayd Allah al-Fayyad, uno de los Diez Anunciadores del Paraíso, y el hombre del Día de Uhud que protegió al Profeta con su propio cuerpo; murió en la Batalla del Camello en 656."
  fr: "Talha ibn Ubayd Allah al-Fayyad, l'un des Dix Annonciateurs de la Bonne Nouvelle du Paradis, et l'homme du Jour d'Uhud qui protégea le Prophète de son propre corps; tué à la Bataille du Chameau en 656."
  ur: "طلحہ بن عبید اللہ الفیاد، جنت کی دس بشارتوں میں سے ایک، اور احد کے دن کا وہ شخص جس نے نبی کو اپنے جسم سے ڈھال دیا۔ 656 میں اونٹ کی جنگ میں مارا گیا۔"
  tr: "Talha ibn Ubeyd Allah el-Fayyad; Uhud Günü'nün on müjdesinden biri ve Peygamber'i kendi güvenliğiyle koruyan; 656 yılında Deve'de öldürüldü."
  id: "Talha ibn Ubayd Allah al-Fayyad; salah satu dari sepuluh kabar gembira dan sahabat Hari Uhud yang melindungi Nabi dengan keselamatannya sendiri; ia dibunuh di Unta tahun 656."
question:
  ar: من كان طلحة بن عبيد الله؟
short_answer:
  ar: طلحة بن عبيد الله الفياض؛ من العشرة المبشرين وصاحب يوم أُحد الذي وقى النبي بنفسه؛ قتل في الجمل 656.
long_answer:
  ar: '[[person/talha-ibn-ubaydullah|طلحة]] من العشرة المبشرين وأكرم التجار؛ أصاب يوم أُحد تسعا وثلاثين
