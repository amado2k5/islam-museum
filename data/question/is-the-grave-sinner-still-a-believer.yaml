id: question/is-the-grave-sinner-still-a-believer
class: question
label: { ar: "هل يخرج مرتكب الكبيرة من الإيمان؟", en: "Does a grave sin take a person out of faith?", ur: "کیا کبیرہ گناہ کرنے والا ایمان سے نکل جاتا ہے؟" }
question: { ar: "ما معنى حديث «لا يزني الزاني حين يزني وهو مؤمن»، وهل يكفر صاحب الكبيرة؟", en: "What does 'the adulterer is not a believer while he commits adultery' mean, and does one who commits a grave sin become an unbeliever?", ur: "حدیث «زانی جب زنا کرتا ہے تو وہ مومن نہیں ہوتا» کا کیا مطلب ہے، اور کیا کبیرہ گناہ والا کافر ہو جاتا ہے؟" }
issue: { ar: "تأويل أحاديث نفي الإيمان عن مرتكب الكبيرة، وأحاديث «لا ترجعوا بعدي كفاراً» و«أيما رجل أكفر رجلاً»، في كتاب السنة من سنن أبي داود.", en: "How to read the reports that deny faith to one who commits a grave sin, and 'do not turn after me into unbelievers' and 'whoever calls a Muslim an unbeliever', in the Book of the Sunna of Abu Dawud." }
summary:
  ar: "يروي أبو داود حديث أبي هريرة «لا يزني الزاني حين يزني وهو مؤمن… والتوبة معروضة بعد»، وحديثه «إذا زنى الرجل خرج منه الإيمان كان عليه كالظلة»؛ ويقول الخطابي إن الخوارج ومن يكفّر المسلمين بالذنوب يحتجون به على غير وجهه، وإن له عند العلماء تأويلين: أنه نهي في صورة خبر، أو وعيد يراد به الزجر ونفي الكمال دون رفع حقيقة الإيمان {cite:sunan-abi-dawud-ibn-hazm-1997-v5 p. 44-45}."
  en: "Abu Dawud relates Abu Hurayra's report 'the adulterer is not a believer while he commits adultery… and repentance remains open afterwards', and his report 'when a man commits adultery faith leaves him and is over him like a canopy'; al-Khattabi says the Kharijites and those who declare Muslims unbelievers for sins cite it wrongly, and that scholars read it in two ways: as a prohibition in the form of a statement, or as a threat meant to deter, denying the perfection of faith but not removing its reality {cite:sunan-abi-dawud-ibn-hazm-1997-v5 p. 44-45}."
  ur: "ابو داؤد ابو ہریرہ کی حدیث «زانی جب زنا کرتا ہے تو مومن نہیں ہوتا… اور توبہ اس کے بعد بھی پیش ہے» اور ان کی حدیث «جب آدمی زنا کرتا ہے تو ایمان اس سے نکل کر سائبان کی طرح اس کے اوپر ہوتا ہے» روایت کرتے ہیں؛ خطابی کہتے ہیں کہ خوارج اور گناہوں کی بنا پر مسلمانوں کی تکفیر کرنے والے اس سے غلط استدلال کرتے ہیں، اور علما کے ہاں اس کی دو تاویلیں ہیں: یہ خبر کی صورت میں نہی ہے، یا وعید ہے جس سے زجر اور کمال کی نفی مقصود ہے نہ کہ ایمان کی حقیقت کا خاتمہ {cite:sunan-abi-dawud-ibn-hazm-1997-v5 p. 44-45}۔"
short_answer:
  ar: "عند الخطابي ومن ذكرهم من العلماء: لا يخرج من الإيمان، والحديث نهي أو وعيد ينفي الكمال؛ ويذكر أن الخوارج يحتجون به على التكفير بالذنب."
  en: "For al-Khattabi and the scholars he cites: he does not leave faith; the report is a prohibition or a threat denying perfection; he notes that the Kharijites cite it to declare sinners unbelievers."
  ur: "خطابی اور ان کے ذکر کردہ علما کے نزدیک: وہ ایمان سے نہیں نکلتا؛ حدیث نہی یا وعید ہے جو کمال کی نفی کرتی ہے؛ وہ بتاتے ہیں کہ خوارج اس سے گناہ پر تکفیر کا استدلال کرتے ہیں۔"
perspectives:
  - tradition: sunni
    id: khattabi-not-out-of-faith
    standing: main
    stance: { ar: "نفي الإيمان هنا نهي أو وعيد ينفي الكمال لا الحقيقة", en: "The denial of faith here is a prohibition or a threat denying perfection, not reality" }
    summary: { ar: "يذكر الخطابي للحديث وجهين عند العلماء: أن معناه النهي وإن كانت صورته الخبر، أي لا يزنِ المؤمن ولا يسرق لأن هذه الأفعال لا تليق بالمؤمنين؛ أو أنه كلام وعيد يراد به الردع والزجر، كقوله «لا إيمان لمن لا أمانة له»، على معنى نفي الفضيلة وسلب الكمال دون رفع الإيمان وإبطاله؛ ويذكر تأويلاً ثالثاً من حديث «خرج منه الإيمان كان عليه كالظلة». ويفسّر «لا ترجعوا بعدي كفاراً» بالمتكفّرين بالسلاح أو بالفرق المتقاتلة المضاهية للكفار، وينقل عن موسى بن هارون أنهم أهل الردة.", en: "Al-Khattabi gives two scholarly readings: it is a prohibition in the form of a statement — a believer should not commit adultery or steal, as these acts do not befit believers — or a threat meant to deter, like 'there is no faith in one who has no trustworthiness', denying excellence and perfection without removing or annulling faith; he adds a third reading from the report 'faith leaves him and is over him like a canopy'. He reads 'do not turn after me into unbelievers' as men cloaked in weapons, or as factions killing one another like unbelievers, and relays from Musa ibn Harun that the apostates fought by Abu Bakr are meant." }
