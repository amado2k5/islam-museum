id: question/how-were-arabs-ruled-before-islam
class: question
label:
  ar: كيف كان العرب يُحكمون قبل الإسلام؟
  en: How were the Arabs ruled before Islam?
  es: "¿Cómo se gobernaba a los árabes antes del Islam?"
  fr: "Comment les Arabes étaient-ils gouvernés avant l'islam ?"
  ur: "اسلام سے پہلے عربوں کی حکومت کیسے تھی؟"
summary:
  ar: لم يكن للعرب ملك واحد؛ كانت ملوك متوجة تابعة للفرس أو الروم في اليمن والحيرة والشام، ورؤساء قبائل مستقلون في البوادي، وحكومة دينية في مكة تقوم على مناصب موزعة بين بطون قريش.
  en: "The Arabs did not have one king. There were crowned kings subject to the Persians or the Romans in Yemen, al-Hira and Syria, independent tribal chiefs in the deserts, and in Mecca a religious government whose offices were distributed among the clans of Quraysh."
  es: "Los árabes no tenían un solo rey. Había reyes coronados sometidos a los persas o a los romanos en Yemen, al-Hira y Siria, jefes tribales independientes en los desiertos y, en La Meca, un gobierno religioso cuyos cargos se distribuían entre los clanes de Quraysh."
  fr: "Les Arabes n'avaient pas un seul roi. Il y avait des rois couronnés, soumis aux Perses ou aux Romains au Yémen, à al-Hira et en Syrie, des chefs tribaux indépendants dans les déserts, et à La Mecque un gouvernement religieux dont les fonctions étaient réparties entre les clans de Quraysh."
  ur: "عربوں کا ایک بھی بادشاہ نہیں تھا۔ یمن، الحیرہ اور شام میں فارس یا رومیوں کے تابع بادشاہ، صحراؤں میں آزاد قبائلی سردار، اور مکہ میں ایک مذہبی حکومت تھی جس کے دفتر قریش کے قبیلوں میں تقسیم تھے۔"
