id: question/how-were-arabs-ruled-before-islam
class: question
label:
  ar: كيف كان العرب يُحكمون قبل الإسلام؟
  en: How were the Arabs ruled before Islam?
summary:
  ar: لم يكن للعرب ملك واحد؛ كانت ملوك متوجة تابعة للفرس أو الروم في اليمن والحيرة والشام، ورؤساء قبائل مستقلون في البوادي، وحكومة دينية في مكة تقوم على مناصب موزعة بين بطون قريش.
  en: "The Arabs did not have one king. There were crowned kings subject to the Persians or the Romans in Yemen, al-Hira and Syria, independent tribal chiefs in the deserts, and in Mecca a religious government whose offices were distributed among the clans of Quraysh."
wings: []
question:
  ar: كيف كان العرب يُحكمون قبل الإسلام؟
short_answer:
  ar: لم يكن للعرب ملك واحد؛ كانت ملوك متوجة تابعة للفرس أو الروم في اليمن والحيرة والشام، ورؤساء قبائل مستقلون في البوادي، وحكومة دينية في مكة تقوم على مناصب موزعة بين بطون قريش.
long_answer:
  ar: |
    يقسّم الرحيق المختوم حكام الجزيرة عند بزوغ الإسلام قسمين: ملوك متوجون لكنهم في الحقيقة غير مستقلين، وهم ملوك اليمن وآل غسان وملوك الحيرة، ورؤساء قبائل لهم ما للملوك من الحكم ومعظمهم على تمام الاستقلال {cite:mubarakpuri-raheeq p.23}.
    كان ملك الحيرة تابعاً للفرس يحرس تخومهم من البادية، وملوك غسان عمالاً للروم على عرب الشام، وتبعية القبائل المجاورة لهما اسمية لا فعلية، أما قبائل الداخل فحرة مطلقة، والقبيلة حكومة مصغرة أساسها العصبية يطيع فيها القوم سيدهم في السلم والحرب، كما يعرض مدخل [[concept/pre-islamic-political-condition|الحالة السياسية]] {cite:mubarakpuri-raheeq p.26} {cite:mubarakpuri-raheeq p.27} {cite:mubarakpuri-raheeq p.32}.
    وفي مكة حكومة دينية تحترمها العرب لأنها سدنة البيت، قامت على مناصب وزعها قصي بن كلاب وبطون قريش بينهم، كما يعرض مدخل [[concept/manasib-quraysh|مناصب قريش]] {cite:mubarakpuri-raheeq p.31} {cite:mubarakpuri-raheeq p.34}.
