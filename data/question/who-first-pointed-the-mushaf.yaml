      ur: "زبیدی «الطبقات» میں مبرد تک سند سے نقل کرتے ہیں کہ سب سے پہلے [[person/abu-al-aswad-al-duali|ابو الاسود دؤلی]] نے مصحف پر نقطے لگائے، اور ذکر کرتے ہیں کہ ابن سیرین کے پاس ایک مصحف تھا جس پر یحییٰ بن یعمر نے ان کے لیے نقطے لگائے؛ ابو الفرج کہتے ہیں کہ [[person/ziyad-ibn-abi-sufyan|زیاد بن ابی سفیان]] نے ابو الاسود کو مصحف پر نقطے لگانے کا حکم دیا۔ {cite:muharrar-wajiz-dar-ibn-hazm p.27}"
