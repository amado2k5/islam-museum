    summary:
      ar: "روي أن [[person/abd-al-malik-ibn-marwan|عبد الملك بن مروان]] أمر بشكل المصحف ونقطه، فتجرد لذلك [[person/al-hajjaj-ibn-yusuf|الحجاج]] بواسط وزاد تحزيبه، وأمر وهو والي العراق [[person/al-hasan-al-basri|الحسن]] و[[person/yahya-ibn-yamur|يحيى بن يعمر]] بذلك، وألّف إثره كتابًا في القراءات جمع فيه ما روي من اختلاف الناس فيما وافق الخط، ومشى الناس عليه زمنًا حتى ألف [[person/ibn-mujahid|ابن مجاهد]] كتابه. {cite:muharrar-wajiz-dar-ibn-hazm p.27}"
      en: "It is reported that [[person/abd-al-malik-ibn-marwan|Abd al-Malik ibn Marwan]] ordered the vowelling and dotting of the codex; [[person/al-hajjaj-ibn-yusuf|al-Hajjaj]] devoted himself to it at Wasit and added its division into parts, and as governor of Iraq set [[person/al-hasan-al-basri|al-Hasan]] and [[person/yahya-ibn-yamur|Yahya ibn Ya'mar]] to the task; afterwards he wrote a book on the readings gathering the reported variants that agree with the script, which people followed for a long time until [[person/ibn-mujahid|Ibn Mujahid]] wrote his. {cite:muharrar-wajiz-dar-ibn-hazm p.27}"
      ur: "روایت ہے کہ [[person/abd-al-malik-ibn-marwan|عبد الملک بن مروان]] نے مصحف پر اعراب اور نقطے لگانے کا حکم دیا؛ [[person/al-hajjaj-ibn-yusuf|حجاج]] نے واسط میں یہ کام کیا اور احزاب کی تقسیم بڑھائی، اور عراق کے والی کی حیثیت سے [[person/al-hasan-al-basri|حسن]] اور [[person/yahya-ibn-yamur|یحییٰ بن یعمر]] کو اس پر لگایا؛ پھر اس نے قراءات پر ایک کتاب لکھی جس میں رسم کے موافق منقول اختلافات جمع کیے، اور لوگ ایک عرصے تک اسی پر چلے یہاں تک کہ [[person/ibn-mujahid|ابن مجاہد]] نے اپنی کتاب لکھی۔ {cite:muharrar-wajiz-dar-ibn-hazm p.27}"
