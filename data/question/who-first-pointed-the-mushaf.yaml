id: question/who-first-pointed-the-mushaf
class: question
label:
  ar: "من أول من نقط المصحف وشكله؟"
  en: "Who first pointed and vowelled the codex of the Qur'an?"
  ur: "مصحف پر سب سے پہلے نقطے اور اعراب کس نے لگائے؟"
summary:
  ar: "يذكر ابن عطية في مقدمة «المحرر الوجيز» أن المصحف كان غير مشكول ولا منقوط، ثم ينقل ثلاث روايات في أول من نقطه: أن عبد الملك بن مروان أمر به فتولاه الحجاج بواسط مع الحسن ويحيى بن يعمر، وأن أوله أبو الأسود الدؤلي بأمر زياد، وأن أوله نصر بن عاصم؛ ويذكر في التعشير المأمون أو الحجاج."
  en: "In the introduction to al-Muharrar al-Wajiz Ibn Atiyya says the codex was at first neither vowelled nor dotted, then reports three accounts of who first dotted it: that Abd al-Malik ibn Marwan ordered it and al-Hajjaj undertook it at Wasit with al-Hasan and Yahya ibn Ya'mar; that the first was Abu al-Aswad al-Du'ali, at Ziyad's order; and that the first was Nasr ibn Asim. For the marking of tens he names al-Ma'mun or al-Hajjaj."
  ur: "ابن عطیہ «المحرر الوجیز» کے مقدمے میں کہتے ہیں کہ مصحف ابتدا میں نہ اعراب والا تھا نہ نقطوں والا، پھر اس پر سب سے پہلے نقطے لگانے والے کے بارے میں تین روایات نقل کرتے ہیں: عبد الملک بن مروان نے حکم دیا اور حجاج نے واسط میں حسن اور یحییٰ بن یعمر کے ساتھ یہ کام کیا؛ سب سے پہلے ابو الاسود دؤلی نے زیاد کے حکم سے کیا؛ اور سب سے پہلے نصر بن عاصم نے کیا۔ دہائیوں کی علامت کے بارے میں وہ مامون یا حجاج کا نام لیتے ہیں۔"
question:
  ar: "من نقط المصحف وشكله أولًا، وبأمر من؟"
  en: "Who first dotted and vowelled the codex, and on whose order?"
  ur: "مصحف پر پہلے نقطے اور اعراب کس نے، اور کس کے حکم سے لگائے؟"
short_answer:
  ar: "ثلاث روايات ينقلها ابن عطية: الحجاج بأمر عبد الملك، أو أبو الأسود الدؤلي بأمر زياد، أو نصر بن عاصم."
  en: "Ibn Atiyya reports three accounts: al-Hajjaj at Abd al-Malik's order; Abu al-Aswad al-Du'ali at Ziyad's order; or Nasr ibn Asim."
  ur: "ابن عطیہ تین روایات نقل کرتے ہیں: عبد الملک کے حکم سے حجاج؛ زیاد کے حکم سے ابو الاسود دؤلی؛ یا نصر بن عاصم۔"
