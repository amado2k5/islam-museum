id: question/what-is-sadaqa
class: question
label:
  ar: "ما الصدقة في الإسلام؟"
  en: What is sadaqa in Islam?
summary:
  ar: "الصدقة في الإسلام أوسع من الصدقة بالمال، وتشمل كل عمل من الخير، وهي غير الزكاة المفروضة التي لها شروط ومصارف."
  en: "In Islam, sadaqa is broader than giving money: it includes every act of goodness. It is distinct from the obligatory zakat, which has its own conditions and recipients."
wings: []
question:
  ar: "ما الصدقة في الإسلام؟"
short_answer:
  ar: "الصدقة في الإسلام أوسع من الصدقة بالمال، وتشمل كل عمل من الخير، وهي غير الزكاة المفروضة التي لها شروط ومصارف."
long_answer:
  ar: |
    الصدقة في الإسلام أوسع من الصدقة بالمال، فقد دل النبي فقراء الصحابة على صدقات أخرى حين ظنوا أن لا صدقة إلا بالمال، كما يعرض مدخل [[concept/sadaqa|الصدقة]] ذلك {cite:sahih-al-bukhari 50}.
    أما [[practice/zakat|الزكاة]] فمفروضة بشروط ومصارف محددة، أما الصدقة فتطوع يثاب عليه صاحبه.
    ويرتبط هذا الباب بالإحسان، وهو مدخل [[concept/ihsan|الإحسان]]، إذ الصدقة من صور الإحسان إلى الناس.
