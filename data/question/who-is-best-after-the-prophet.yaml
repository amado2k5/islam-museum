id: question/who-is-best-after-the-prophet
class: question
label:
  ar: "من خير هذه الأمة بعد نبيها؟"
  en: "Who is the best of this community after its Prophet?"
summary:
  ar: "مسألة التفضيل بين الصحابة كما تعرضها أبواب «فضائل الصحابة» لأحمد بن حنبل: روايات عن علي بن أبي طالب أن خير الأمة بعد نبيها أبو بكر ثم عمر، وروايات عن ابن عمر أنهم كانوا في حياة النبي يقدمون أبا بكر ثم عمر ثم عثمان ثم لا يفاضلون، مع أحكام المحقق على أسانيدها؛ ولم تُضف بعد المواقف الأخرى من مصادرها."
  en: "The question of ranking the Companions as presented in the chapters of Ahmad ibn Hanbal's Fada'il al-Sahaba: reports from Ali ibn Abi Talib that the best of the community after its Prophet are Abu Bakr then Umar, and reports from Ibn Umar that in the Prophet's lifetime they ranked Abu Bakr, then Umar, then Uthman and then made no further distinction — with the editor's grading of their chains. Other positions are still to be added from their own sources."
question:
  ar: "من خير هذه الأمة بعد نبيها، وهل يُفاضَل بين الصحابة؟"
  en: "Who is the best of this community after its Prophet, and are the Companions ranked?"
issue:
  ar: "ترتيب الأفضلية بين كبار الصحابة، ولا سيما أبو بكر وعمر وعثمان وعلي."
  en: "The order of merit among the leading Companions, especially Abu Bakr, Umar, Uthman and Ali."
short_answer:
  ar: "يروي أحمد بن حنبل في «فضائل الصحابة» بأسانيد عدة عن علي قوله إن خير هذه الأمة بعد نبيها أبو بكر ثم عمر، وعن ابن عمر أنهم كانوا يقدّمون أبا بكر ثم عمر ثم عثمان ثم لا يفاضلون؛ وصحح المحقق كثيراً من هذه الأسانيد وضعّف بعضها."
  en: "In Fada'il al-Sahaba Ahmad ibn Hanbal narrates through many chains Ali's statement that the best of this community after its Prophet are Abu Bakr then Umar, and Ibn Umar's report that they ranked Abu Bakr, then Umar, then Uthman, and then made no distinction; the editor graded many of these chains sound and some weak."
perspectives:
  - tradition: sunni
    id: sunni-ali-report
    standing: main
    stance:
      ar: "أبو بكر ثم عمر، كما يُروى عن علي وعمر"
      en: "Abu Bakr, then Umar — as reported from Ali and Umar"
    summary:
      ar: "يجمع أحمد بن حنبل باباً لقول علي وغيره «خير هذه الأمة بعد نبيها أبو بكر وعمر»، وباباً آخر بعنوان «باب خير هذه الأمة بعد نبيها» يكرر فيه الروايات عن علي من طرق أبي جحيفة وعبد خير وغيرهما، وفي بعضها «ولو شئت أن أسمي الثالث لسميته»؛ ويروي فيه عن عمر أن أبا بكر خير الناس بعد رسول الله. وحسّن المحقق وصحّح عدداً من هذه الطرق وضعّف أخرى."
      en: "Ahmad ibn Hanbal devotes one chapter to the saying of Ali and others, 'The best of this community after its Prophet are Abu Bakr and Umar', and another, 'Chapter on the best of this community after its Prophet', repeating the reports from Ali through Abu Juhayfa, Abd Khayr and others — some adding 'had I wished to name the third I would have named him' — and a report from Umar that Abu Bakr was the best of people after the Messenger of God. The editor graded several of these routes good or sound and others weak."
