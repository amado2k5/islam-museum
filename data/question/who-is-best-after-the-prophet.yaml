      en: "Abu Bakr, then Umar, then Uthman, then no ranking — as reported from Ibn Umar"
    summary:
      ar: "يروي أحمد وابنه عبد الله عن نافع وسالم عن عبد الله بن عمر أنهم كانوا في زمن النبي يقولون: أبو بكر ثم عمر ثم عثمان، ثم يتركون التفاضل بين البقية؛ وصحح المحقق أسانيد عدة منها، وضعّف طريق العمري ورواية ابن سيرين في المعنى نفسه."
      en: "Ahmad and his son Abd Allah narrate from Nafi' and Salim, from Abd Allah ibn Umar, that in the Prophet's time they used to say: Abu Bakr, then Umar, then Uthman, and then left off ranking the rest. The editor graded several of these chains sound, and graded weak the route through al-Umari and Ibn Sirin's report to the same effect."
