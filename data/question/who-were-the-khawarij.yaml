question:
  ar: من كان الخوارج؟
short_answer:
  ar: الخوارج أول فرقة انشقت عن الأمة بعد صفين؛ كفّرت أصحاب الكبائر وقاتلت الخلفاء؛ بقيت منها الإباضية
    في عمان والمغرب.
long_answer:
  ar: 'الخوارج نشأت من معسكر علي بعد التحكيم في صفين؛ قالت بالحكم لله ورفضت عليًا وعثمان وكفّرت مرتكبي
    الكبائر؛ قاتلت الخلفاء قرنًا حتى افترقت فصائلًا: الأزارقة والنجدات والصفرية والإباضية؛ الإباضية اليوم
    مذهب قائم في عمان وأجزاء المغرب مختلف عن تكفير أسلافه. {cite:wikidata}'
