id: question/who-were-the-khawarij
class: question
label:
  ar: من كان الخوارج؟
  en: Who were the Khawarij?
  es: "¿Quiénes eran los jariyíes?"
  fr: "Qui étaient les Kharijites ?"
summary:
  ar: الخوارج أول فرقة انشقت عن الأمة بعد صفين؛ كفّرت أصحاب الكبائر وقاتلت الخلفاء؛ بقيت منها الإباضية
    في عمان والمغرب.
  en: "The Khawarij were the first sect to split from the community after Siffin. They declared those who committed grave sins to be unbelievers and fought the caliphs. Of them, the Ibadis remain, in Oman and the Maghrib."
  es: "Los jariyíes fueron la primera secta en separarse de la comunidad después de Siffin. Declararon infieles a quienes cometían pecados graves y lucharon contra los califas. De ellos, los ibadíes permanecen en Omán y el Magreb."
  fr: "Les Kharijites furent la première secte à se séparer de la communauté après Siffin. Ils déclarèrent mécréants ceux qui commettaient des péchés graves et combattirent les califes. De leurs descendants subsistent les Ibadites, à Oman et au Maghreb."
question:
  ar: من كان الخوارج؟
short_answer:
  ar: الخوارج أول فرقة انشقت عن الأمة بعد صفين؛ كفّرت أصحاب الكبائر وقاتلت الخلفاء؛ بقيت منها الإباضية
    في عمان والمغرب.
long_answer:
  ar: 'الخوارج نشأت من معسكر علي بعد التحكيم في صفين؛ قالت بالحكم لله ورفضت عليًا وعثمان وكفّرت مرتكبي
    الكبائر؛ قاتلت الخلفاء قرنًا حتى افترقت فصائلًا: الأزارقة والنجدات والصفرية والإباضية؛ الإباضية اليوم
    مذهب قائم في عمان وأجزاء المغرب مختلف عن تكفير أسلافه. {cite:wikidata}'
