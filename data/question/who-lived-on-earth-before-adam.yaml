id: question/who-lived-on-earth-before-adam
class: question
tags: [cosmos-browser, cosmos-before-adam]
label: { ar: "من سكن الأرض قبل آدم؟", en: "Who lived on earth before Adam?", ur: "آدم سے پہلے زمین پر کون رہتا تھا؟", es: "¿Quiénes vivieron en la Tierra antes de Adán?", fr: "Qui vivait sur terre avant Adam ?" }
summary:
  ar: "سؤال الملائكة في [[passage/quran-2-30|البقرة 30]] عن جعل من يفسد ويسفك الدماء فتح ثلاثة اتجاهات عند المفسرين: أن الجن سكنوا الأرض قبل آدم فأفسدوا، وأن الملائكة علمت بإخبار الله أو استدلت من معنى الخلافة، وأن النص لا يذكر شيئًا قبل آدم؛ والطبري لم يتبنَّ الأول لأنه لم يجد فيه ما يقطع العذر {cite:tafsir-tabari-shakir-v01 PDF pp. 454-475}."
  en: "The angels' question in [[passage/quran-2-30|al-Baqara 30]] about placing one who will corrupt and shed blood opened three lines among the exegetes: that the jinn lived on earth before Adam and corrupted it; that the angels knew because God told them or reasoned from the meaning of vicegerency; and that the text says nothing about anything before Adam. Al-Tabari did not adopt the first because he found nothing that excludes excuse {cite:tafsir-tabari-shakir-v01 PDF pp. 454-475}."
  ur: "[[passage/quran-2-30|البقرہ 30]] میں فرشتوں کے اس سوال نے کہ کیا ایسے کو بنائے گا جو فساد کرے اور خون بہائے، مفسرین کے ہاں تین رخ کھولے: آدم سے پہلے جن زمین پر رہے اور فساد کیا؛ فرشتوں کو اللہ نے بتایا تھا یا انہوں نے خلافت کے معنی سے استدلال کیا؛ اور یہ کہ نص آدم سے پہلے کے بارے میں خاموش ہے۔ طبری نے پہلا رخ اختیار نہ کیا کیونکہ ان کے نزدیک اس میں کوئی ایسی بات نہ تھی جو عذر ختم کرے {cite:tafsir-tabari-shakir-v01 PDF pp. 454-475}۔"
  es: "La pregunta de los ángeles en [[passage/quran-2-30|al-Baqara 30]] acerca de colocar a alguien que corromperá y derramará sangre abrió tres líneas entre los exegetas: que los genios vivieron en la tierra antes de Adán y la corrompieron; que los ángeles lo sabían porque Dios se lo dijo o razonó a partir del significado de la vicerregencia; y que el texto no dice nada sobre nada anterior a Adán. Al-Tabari no adoptó la primera opción porque no encontró nada que excluyera la excusa {cite:tafsir-tabari-shakir-v01 PDF pp. 454-475}."
  fr: "La question des anges dans le verset 30 du Coran (al-Baqara 30) concernant la désignation d'un être susceptible de corrompre et de verser le sang a donné lieu à trois interprétations parmi les exégètes: soit les djinns vivaient sur terre avant Adam et l'ont corrompue; soit les anges le savaient parce que Dieu le leur avait révélé ou l'avait déduit du sens de la vicariat; soit le texte ne mentionne rien d'antérieur à Adam. Al-Tabari a rejeté la première interprétation, n'y trouvant aucun argument qui l'exclue (voir: Tafsir Tabari Shakir, vol. 1, PDF, p. 454-475)."
question: { ar: "من سكن الأرض قبل آدم، وكيف علمت الملائكة بالفساد؟", en: "Who held the earth before Adam, and how did the angels know of corruption?", ur: "آدم سے پہلے زمین پر کون تھا، اور فرشتوں کو فساد کا علم کیسے ہوا؟" }
issue:
  ar: "يخبر الله الملائكة أنه جاعل في الأرض خليفة، فيسألون عمن يفسد ويسفك الدماء، ولم يكن آدم قد خُلق ولا ذريته. فمن أين علموا؟ وهل كان على الأرض قبله خلق؟"
  en: "God tells the angels He will place a vicegerent on earth, and they ask about one who will corrupt and shed blood, though neither Adam nor his offspring yet existed. How did they know, and was there a creation on earth before him?"
  ur: "اللہ فرشتوں کو بتاتا ہے کہ وہ زمین میں خلیفہ بنانے والا ہے، اور وہ فساد اور خونریزی کرنے والے کے بارے میں پوچھتے ہیں، حالانکہ نہ آدم پیدا ہوئے تھے نہ ان کی اولاد۔ انہیں علم کہاں سے ہوا، اور کیا ان سے پہلے زمین پر کوئی مخلوق تھی؟"
short_answer:
  ar: "الطبري بسند الضحاك عن ابن عباس: الجن أول من سكن الأرض فأفسدوا؛ ولم يتبنَّه الطبري لعدم ما يقطع العذر. القرطبي والسدي وقتادة: إخبار الله أو استنباط من معنى الخليفة. ابن زيد في رواية الطبري: لم يكن في الأرض خلق قبل آدم."
  en: "Al-Tabari, by al-Dahhak's chain from Ibn Abbas: the jinn first dwelt on earth and corrupted it; al-Tabari did not adopt it for want of what excludes excuse. Al-Qurtubi, al-Suddi and Qatada: God told them, or they inferred it from the sense of 'vicegerent'. Ibn Zayd in al-Tabari's report: there was no creature on earth before Adam."
  ur: "طبری میں ضحاک کی سند سے ابن عباس: زمین پر پہلے جن بسے اور فساد کیا؛ طبری نے عذر ختم کرنے والی دلیل نہ ہونے کے باعث اسے اختیار نہیں کیا۔ قرطبی، سدی اور قتادہ: اللہ نے بتایا تھا، یا انہوں نے «خلیفہ» کے معنی سے سمجھا۔ ابن زید طبری کی روایت میں: آدم سے پہلے زمین پر کوئی مخلوق نہ تھی۔"
