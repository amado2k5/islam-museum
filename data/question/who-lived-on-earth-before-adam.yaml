    standing: main
    stance: { ar: "الجن سكنوا الأرض قبل آدم فأفسدوا فقيس عليهم", en: "The jinn dwelt on earth before Adam and corrupted it; the angels compared", ur: "آدم سے پہلے جن زمین پر رہے اور فساد کیا؛ فرشتوں نے ان پر قیاس کیا" }
    summary:
      ar: "روى الطبري عن الضحاك عن ابن عباس أن أول من سكن الأرض الجن فأفسدوا وسفكوا الدماء فبعث الله إبليس في جند من الملائكة فألحقهم بجزائر البحور؛ وعن الربيع بن أنس أن قومًا من الجن كفروا فقاتلتهم الملائكة. وروى ابن كثير عن مجاهد عن عبد الله بن عمرو أنهم كانوا قبل آدم بألفي سنة. وفي هامش تحقيق الطبري أن إسناده ضعيف وأن الحاكم روى ما يشبهه عن مجاهد عن ابن عباس وصححه ووافقه الذهبي."
      en: "Al-Tabari relates from al-Dahhak on Ibn Abbas that the first to dwell on earth were the jinn, who corrupted it and shed blood, so God sent Iblis with a force of angels who drove them to the islands of the seas; and from al-Rabi' ibn Anas that a group of the jinn disbelieved and the angels fought them. Ibn Kathir relays from Mujahid on Abd Allah ibn Amr that they were there two thousand years before Adam. The editor's note on al-Tabari says his chain is weak and that al-Hakim has a similar report from Mujahid on Ibn Abbas which he and al-Dhahabi called sound."
      ur: "طبری ضحاک سے ابن عباس کی روایت لاتے ہیں کہ زمین پر سب سے پہلے جن بسے، فساد کیا اور خون بہایا، تو اللہ نے ابلیس کو فرشتوں کے لشکر کے ساتھ بھیجا جس نے انہیں سمندری جزیروں تک دھکیل دیا؛ اور ربیع بن انس سے کہ جنوں کی ایک جماعت نے کفر کیا اور فرشتوں نے ان سے جنگ کی۔ ابن کثیر مجاہد سے عبد اللہ بن عمرو کی روایت لاتے ہیں کہ وہ آدم سے دو ہزار سال پہلے تھے۔ تحقیقِ طبری کے حاشیے میں ہے کہ طبری کی سند ضعیف ہے اور حاکم نے مجاہد کے واسطے سے ابن عباس سے ملتی جلتی روایت لا کر اسے صحیح کہا اور ذہبی نے موافقت کی۔"
    holders: [person/abdullah-ibn-abbas, person/al-dahhak-ibn-muzahim, person/mujahid-ibn-jabr, person/al-rabi-ibn-anas]
