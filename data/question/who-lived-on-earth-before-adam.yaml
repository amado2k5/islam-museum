  - tradition: sunni
    id: texts-silent-before-adam
    standing: secondary
    stance: { ar: "لا خبر قاطع عما قبل آدم؛ وفي رواية لم يكن في الأرض خلق", en: "No conclusive report on what came before Adam; in one report the earth held no creature", ur: "آدم سے پہلے کے بارے میں کوئی قطعی خبر نہیں؛ ایک روایت میں زمین پر کوئی مخلوق نہ تھی" }
    summary:
      ar: "يقرر الطبري أن الخبر عما مضى لا يُعلم إلا بمجيء يقطع العذر ويمتنع معه الكذب والخطأ، وأن هذا ليس موجودًا في رواية الضحاك ولا في قول ابن زيد، فاختار ما يدل عليه ظاهر التنزيل. وفي رواية ابن زيد عنده أن الله قال للملائكة إنه يريد أن يخلق في الأرض خلقًا وليس له يومئذ خلق إلا الملائكة والأرض ليس فيها خلق؛ وفي قول ابن إسحاق أن الخليفة ساكن وعامر خلف ليس من الملائكة."
      en: "Al-Tabari states that knowledge of the past comes only by a report that excludes excuse and rules out lying and error, and that this is not present in al-Dahhak's report or in Ibn Zayd's statement, so he chose what the plain sense of the text indicates. In Ibn Zayd's report in his book, God told the angels He meant to create something on earth, there being then no creation except the angels and the earth holding no creature; Ibn Ishaq has the vicegerent as a dweller and settler, a successor not from the angels."
      ur: "طبری لکھتے ہیں کہ گزرے ہوئے کا علم ایسی روایت سے ہوتا ہے جو عذر ختم کرے اور جس میں جھوٹ اور خطا ناممکن ہو، اور یہ ضحاک کی روایت اور ابن زید کے قول میں نہیں، اس لیے انہوں نے وہ اختیار کیا جس پر ظاہرِ تنزیل دلالت کرتا ہے۔ ان کے ہاں ابن زید کی روایت میں اللہ نے فرشتوں سے کہا کہ وہ زمین میں مخلوق پیدا کرنا چاہتا ہے، اس وقت فرشتوں کے سوا کوئی مخلوق نہ تھی اور زمین میں کوئی جاندار نہ تھا؛ ابن اسحاق کے ہاں خلیفہ ایک آباد کار، فرشتوں کے علاوہ جانشین ہے۔"
