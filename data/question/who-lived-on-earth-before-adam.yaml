  - tradition: sunni
    id: angels-knew-or-inferred
    standing: main
    stance: { ar: "الملائكة علمت بإخبار الله أو استنتجت من معنى الخلافة", en: "The angels knew because God told them, or inferred from the sense of vicegerency", ur: "فرشتوں کو اللہ نے بتایا یا انہوں نے خلافت کے معنی سے سمجھا" }
    summary:
      ar: "عند السدي عن ابن مسعود وابن عباس وناس من الصحابة أن الله أخبرهم أن للخليفة ذرية يفسدون ويقتل بعضهم بعضًا، وبه قال قتادة والحسن في بعض الروايات؛ وعند القرطبي أنهم فهموا من لفظ الخليفة أن في بني آدم من يفسد فعمّموا، ونقل عن ثعلب قولًا يقارن الجن. وعدّ الطبري سؤالهم استخبارًا لا إنكارًا. وحذّر ابن كثير من الإسرائيليات في إسناد السدي المشهور."
      en: "In al-Suddi's account from Ibn Mas'ud, Ibn Abbas and other Companions, God told them that the vicegerent would have offspring who corrupt and kill one another; Qatada and, in some reports, al-Hasan say likewise. Al-Qurtubi has that they understood from the word vicegerent that some of Adam's kind would corrupt, and generalised; he relays a view of Tha'lab that sets the jinn as the comparison. Al-Tabari read their question as asking for information, not objecting. Ibn Kathir cautions about Israelite material in al-Suddi's well-known chain."
      ur: "سدی کے بیان میں ابن مسعود، ابن عباس اور دیگر صحابہ سے ہے کہ اللہ نے بتایا تھا کہ خلیفہ کی اولاد فساد کرے گی اور ایک دوسرے کو قتل کرے گی؛ قتادہ اور بعض روایات میں حسن بھی یہی کہتے ہیں۔ قرطبی کے مطابق انہوں نے «خلیفہ» کے لفظ سے سمجھا کہ بنی آدم میں فساد کرنے والے ہوں گے اور حکم عام کر دیا؛ وہ ثعلب کا ایک قول نقل کرتے ہیں جس میں جنوں سے موازنہ ہے۔ طبری نے ان کے سوال کو اعتراض نہیں بلکہ معلومات طلب کرنا سمجھا۔ ابن کثیر سدی کی مشہور سند میں اسرائیلیات سے خبردار کرتے ہیں۔"
    holders: [person/abdullah-ibn-masud, person/qatada-ibn-diama, person/al-qurtubi, person/ahmad-ibn-yahya-tha-lab, person/al-tabari]
