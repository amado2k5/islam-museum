question:
  ar: من كان البيروني؟
short_answer:
  ar: أبو الريحان البيروني (973–1048) خوارزمي موسوعي؛ من أعظم علماء عصره في الفلك والجغرافيا والمقارنة
    بين الأديان والثقافات.
long_answer:
  ar: '[[person/al-biruni-muhammad-ibn-ahmad|البيروني]] من خوارزم؛ رحل إلى الهند مع محمود الغزنوي فكتب
    «تحقيق ما للهند» موسوعة في دياناتها وفلسفاتها وعدّ رائد الدراسات المقارنة، وله «الآثار الباقية» و«القانون
    المسعودي» في الفلك والجغرافيا والرياضيات. {cite:wikidata}'
