summary:
  ar: أبو الريحان البيروني (973–1048) خوارزمي موسوعي؛ من أعظم علماء عصره في الفلك والجغرافيا والمقارنة
    بين الأديان والثقافات.
  en: "Abu al-Rayhan al-Biruni (973–1048) was a Khwarazmian polymath and one of the greatest scholars of his age in astronomy, geography and the comparative study of religions and cultures."
  es: "Abu al-Rayhan al-Biruni (973–1048) fue un polímata jorezmita y uno de los más grandes eruditos de su época en astronomía, geografía y el estudio comparativo de religiones y culturas."
  fr: "Abu al-Rayhan al-Biruni (973–1048) était un polymathe khwarezmien et l'un des plus grands érudits de son époque en astronomie, en géographie et en étude comparative des religions et des cultures."
  ur: "ابو الریحان البیرونی (973–1048) خوارزمیہ کا ایک کثیر الثقافتی تھا اور فلکیات، جغرافیہ اور مذاہب اور ثقافتوں کے تقابلی مطالعہ میں اپنے دور کے سب سے بڑے اسکالرز میں سے ایک تھا۔"
  tr: "Ebu el-Rayhan el-Biruni (973–1048), ansiklopedik bir Harezmiydi; döneminin astronomi, coğrafya ve dinler ile kültürler arasındaki karşılaştırma alanlarındaki en büyük bilginlerinden biriydi."
  id: "Abu al-Rayhan al-Biruni (973–1048) adalah seorang Khwarizmi ensiklopedis; salah satu sarjana terbesar pada zamannya dalam astronomi, geografi, dan perbandingan antara agama dan budaya."
question:
  ar: من كان البيروني؟
short_answer:
  ar: أبو الريحان البيروني (973–1048) خوارزمي موسوعي؛ من أعظم علماء عصره في الفلك والجغرافيا والمقارنة
    بين الأديان والثقافات.
long_answer:
  ar: '[[person/al-biruni-muhammad-ibn-ahmad|البيروني]] من خوارزم؛ رحل إلى الهند مع محمود الغزنوي فكتب
    «تحقيق ما للهند» موسوعة في دياناتها وفلسفاتها وعدّ رائد الدراسات المقارنة، وله «الآثار الباقية» و«القانون
    المسعودي» في الفلك والجغرافيا والرياضيات. {cite:wikidata}'
