label:
  ar: من كان البيروني؟
  en: Who was al-Biruni?
  es: "¿Quién fue al-Biruni?"
  fr: "Qui était al-Biruni ?"
  ur: "البیرونی کون تھا؟"
  tr: "Al-Biruni kimdi?"
