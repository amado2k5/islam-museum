long_answer:
  ar: '[[person/isa-ibn-maryam|عيسى بن مريم]] نبي الله ورسوله إلى بني إسرائيل؛ ولد من مريم العذراء معجزة
    بلا أب وتكلم في المهد وأنزل الله عليه الإنجيل؛ لم يُصلب عند المسلمين بل رفعه الله وينزل آخر الزمان
    في أكثر الروايات؛ ينتظره المسلمون والنصارى معًا. {cite:wikidata}'
