id: question/who-was-isa
class: question
label:
  ar: من كان عيسى بن مريم؟
  en: Who was Isa ibn Maryam?
  es: "¿Quién fue Isa ibn Maryam?"
  fr: "Qui était Isa ibn Maryam ?"
  ur: "عیسیٰ ابن مریم کون تھے؟"
summary:
  ar: عيسى بن مريم كلمة الله وروح منه؛ ولد من غير أب وأنزل عليه الإنجيل وأحيا الموتى بإذن الله ورفعه الله
    إليه.
  en: "Isa ibn Maryam, the Word of God and a spirit from Him; he was born without a father, the Gospel was revealed to him, he brought the dead to life by God's leave, and God raised him up to Himself."
  es: "Isa ibn Maryam, la Palabra de Dios y un espíritu procedente de Él; nació sin padre, el Evangelio le fue revelado, resucitó a los muertos con el permiso de Dios, y Dios lo elevó hacia Sí mismo."
  fr: "Isa ibn Maryam, la Parole de Dieu et un esprit venant de Lui; il naquit sans père, l'Évangile lui fut révélé, il ressuscita les morts par la permission de Dieu, et Dieu l'éleva auprès de Lui."
  ur: "عیسیٰ ابن مریم، خدا کا کلام اور اس کی طرف سے ایک روح؛ وہ بغیر باپ کے پیدا ہوا، اس پر انجیل نازل ہوئی، اس نے خدا کے حکم سے مردوں کو زندہ کیا، اور خدا نے اسے اپنے پاس اٹھایا۔"
question:
  ar: من كان عيسى بن مريم؟
short_answer:
  ar: عيسى بن مريم كلمة الله وروح منه؛ ولد من غير أب وأنزل عليه الإنجيل وأحيا الموتى بإذن الله ورفعه الله
    إليه.
long_answer:
  ar: '[[person/isa-ibn-maryam|عيسى بن مريم]] نبي الله ورسوله إلى بني إسرائيل؛ ولد من مريم العذراء معجزة
    بلا أب وتكلم في المهد وأنزل الله عليه الإنجيل؛ لم يُصلب عند المسلمين بل رفعه الله وينزل آخر الزمان
    في أكثر الروايات؛ ينتظره المسلمون والنصارى معًا. {cite:wikidata}'
