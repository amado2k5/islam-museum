question: { ar: "لماذا سُمّيت السنة التاسعة للهجرة سنة الوفود؟" }
short_answer: { ar: "لأن وفود القبائل العربية ضربت إلى النبي من كل وجه في تلك السنة بعد فتح مكة وغزوة تبوك وإسلام ثقيف؛ ويقول ابن هشام عن أبي عبيدة إن ذلك كان في سنة تسع وإنها كانت تسمى سنة الوفود." }
long_answer:
  ar: |
    يروي ابن إسحاق أن النبي لما افتتح مكة وفرغ من تبوك وأسلمت ثقيف وبايعت، ضربت إليه وفود العرب من كل وجه، وينقل ابن هشام عن أبي عبيدة أن ذلك في سنة تسع وأنها كانت تسمى سنة الوفود {cite:ibn-hisham-saqqa 4/205}.

    ويفسّر ابن إسحاق ذلك بأن العرب كانت تتربص بالإسلام أمر قريش، لأن قريشاً كانت إمام الناس وأهل البيت الحرام وقادة العرب، وهي التي نصبت لحرب النبي؛ فلما فُتحت مكة ودانت له قريش عرفت العرب أن لا طاقة لها بحربه، فدخلت في الدين أفواجاً {cite:ibn-hisham-saqqa 4/205}.

    ومن الوفود التي يرويها في هذه السنة: [[event/delegation-of-banu-tamim|وفد بني تميم]] ومفاخرتهم، ووفد بني عامر الذي وقعت فيه [[event/assassination-attempt-of-amir-and-arbad|مؤامرة عامر وأربد]]، و[[event/delegation-of-dimam-ibn-thalaba|ضمام بن ثعلبة]] عن بني سعد بن بكر، و[[event/delegation-of-abd-al-qays|وفد عبد القيس]]، و[[event/delegation-of-banu-hanifa|وفد بني حنيفة]] ومعهم مسيلمة؛ وتفصيل الباقي في [[event/year-of-delegations|عام الوفود]].
