class: question
label:
  ar: من هم العرب البائدة والعاربة والمستعربة؟
  en: Who are the extinct, pure, and Arabized Arabs?
summary:
  ar: قسّم المؤرخون العرب بحسب السلالات إلى بائدة انقطعت أخبارها كعاد وثمود، وعاربة من نسل قحطان مهدها اليمن، ومستعربة من نسل إسماعيل تسمى العدنانية ومنها قريش.
  en: "Historians divided the Arabs by lineage into three groups: the extinct Arabs, whose accounts are lost, such as 'Ad and Thamud; the pure Arabs, descended from Qahtan, whose homeland was Yemen; and the Arabized Arabs, descended from Ishmael and called the Adnanites, among whom were the Quraysh."
wings: []
question:
  ar: من هم العرب البائدة والعاربة والمستعربة؟
short_answer:
  ar: قسّم المؤرخون العرب بحسب السلالات إلى بائدة انقطعت أخبارها كعاد وثمود، وعاربة من نسل قحطان مهدها اليمن، ومستعربة من نسل إسماعيل تسمى العدنانية ومنها قريش.
long_answer:
  ar: |
    قسّم المؤرخون أقوام العرب ثلاثة أقسام بحسب السلالات: العرب البائدة وهم القدامى الذين لم تُعرف تفاصيل كافية عن تاريخهم مثل عاد وثمود وطسم وجديس، والعرب العاربة المنحدرون من يعرب بن يشجب بن قحطان وتسمى القحطانية، والعرب المستعربة المنحدرون من إسماعيل وتسمى العدنانية {cite:mubarakpuri-raheeq p.16}.
    مهد العاربة اليمن، وأشهر قبائلها حمير وكهلان، وهاجرت بطون كهلان عن اليمن فانتشرت في الجزيرة، كما يعرض مدخل [[group/qahtan|قحطان]] {cite:mubarakpuri-raheeq p.16}.
    والمستعربة من ذرية إسماعيل الذي أسكنه أبوه إبراهيم بمكة، ومن ولده قيدار جاء عدنان ومعد، ومن معد تفرعت ربيعة ومضر ومنها قريش، كما يعرض مدخل [[group/adnan|عدنان]] {cite:mubarakpuri-raheeq p.20}.
