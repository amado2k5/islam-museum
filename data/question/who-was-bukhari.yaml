    كتاب بعد القرآن.
long_answer:
  ar: '[[person/al-bukhari|الإمام البخاري]] من بخارى؛ طاف على شيوخ الحديث وانتقى صحيحه من مئات آلاف الآثار.
    صحيح البخاري عند أهل السنة أصح كتاب بعد كتاب الله؛ صنف أيضًا الأدب المفرد والتاريخ الكبير. توفي في
    خرتنك قرب سمرقند. {cite:wikidata}'
