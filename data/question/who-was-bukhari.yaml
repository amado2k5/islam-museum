id: question/who-was-bukhari
class: question
label:
  ar: من كان الإمام البخاري؟
  en: Who was Imam al-Bukhari?
  es: "¿Quién fue el Imam al-Bujari?"
  fr: "Qui était l'imam al-Bukhari ?"
  ur: "امام بخاری کون تھے؟"
  tr: "İmam el-Buhari kimdi?"
  id: "Siapakah Imam al-Bukhari?"
summary:
  ar: محمد بن إسماعيل البخاري (810–870) إمام الحديث؛ جمع صحيحه في ست عشرة سنة من ستمئة ألف حديث فصار أصح
    كتاب بعد القرآن.
  en: "Muhammad ibn Isma'il al-Bukhari (810–870) was an imam of hadith; he compiled his Sahih over sixteen years from six hundred thousand hadiths, so that it became the most authentic book after the Qur'an."
  es: "Muhammad ibn Isma'il al-Bukhari (810-870) fue un imán de hadices; compiló su Sahih a lo largo de dieciséis años a partir de seiscientos mil hadices, de modo que se convirtió en el libro más auténtico después del Corán."
  fr: "Muhammad ibn Isma'il al-Bukhari (810-870) était un imam du hadith; il a compilé son Sahih sur seize ans à partir de six cent mille hadiths, de sorte qu'il est devenu le livre le plus authentique après le Coran."
  ur: "محمد بن اسماعیل البخاری (810-870) حدیث کے امام تھے۔ اس نے اپنی صحاح کو سولہ سال میں چھ لاکھ احادیث سے مرتب کیا، تاکہ یہ قرآن کے بعد سب سے مستند کتاب بن گئی۔"
  tr: "Muhammed bin İsmail el-Buhari (810–870) hadis imamı idi; Sahih'ini on altı yüz bin hadisten on altı yıl boyunca derledi ve Kur'an'dan sonra en özgün kitap yaptı."
  id: "Muhammad ibn Ismail al-Bukhari (810–870) adalah seorang imam hadits; ia menyusun Sahihnya selama enam belas tahun dari enam ratus ribu hadits, menjadikannya kitab paling otentik setelah Al-Qur'an."
question:
  ar: من كان الإمام البخاري؟
short_answer:
  ar: محمد بن إسماعيل البخاري (810–870) إمام الحديث؛ جمع صحيحه في ست عشرة سنة من ستمئة ألف حديث فصار أصح
    كتاب بعد القرآن.
long_answer:
  ar: '[[person/al-bukhari|الإمام البخاري]] من بخارى؛ طاف على شيوخ الحديث وانتقى صحيحه من مئات آلاف الآثار.
    صحيح البخاري عند أهل السنة أصح كتاب بعد كتاب الله؛ صنف أيضًا الأدب المفرد والتاريخ الكبير. توفي في
    خرتنك قرب سمرقند. {cite:wikidata}'
