label:
  ar: "ما القدر في الإسلام؟"
  en: What is qadar in Islam?
summary:
  ar: "القدر في العقيدة الإسلامية أن الله خلق الخلق بعلمه، وقدّر لهم أقداراً وآجالاً، وأن كل شيء يجري بمشيئته. وهذا من أركان الإيمان بالقدر."
  en: "In Islamic belief, qadar means that God created creation with His knowledge, decreed for them their measures and their terms, and that everything proceeds by His will. This is one of the articles of faith concerning qadar."
wings: []
question:
  ar: "ما القدر في الإسلام؟"
short_answer:
  ar: "القدر في العقيدة الإسلامية أن الله خلق الخلق بعلمه، وقدّر لهم أقداراً وآجالاً، وأن كل شيء يجري بمشيئته. وهذا من أركان الإيمان بالقدر."
long_answer:
  ar: |
    القدر هو الإيمان بأن الله خلق كل شيء وعلم ما يكون قبل أن يكون، وقدّر الأشياء وآجالها بمشيئته، كما تعرض العقيدة الطحاوية في مدخل [[concept/qadar|القدر]].
    ويرتبط القدر بالإيمان، وهو مدخل [[concept/iman|الإيمان]]، إذ هو أحد أركانه في حديث جبريل {cite:sahih-al-bukhari 50}.
    وتتعدد الأقوال في تفسير العلاقة بين قدر الله وفعل الإنسان، وتعرضها كتب الكلام، ولهذا يعرض هذا المدخل الأصل المتفق عليه دون تفصيل الخلاف.
