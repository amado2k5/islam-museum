id: question/what-is-qadar
class: question
label:
  ar: "ما القدر في الإسلام؟"
  en: What is qadar in Islam?
  es: "¿Qué es el qadar en el Islam?"
  fr: "Qu'est-ce que le qadar en Islam ?"
  ur: "اسلام میں قدر کیا ہے؟"
  tr: "İslam'da kader nedir?"
  id: "Apa itu takdir dalam Islam?"
summary:
  ar: "القدر في العقيدة الإسلامية أن الله خلق الخلق بعلمه، وقدّر لهم أقداراً وآجالاً، وأن كل شيء يجري بمشيئته. وهذا من أركان الإيمان بالقدر."
  en: "In Islamic belief, qadar means that God created creation with His knowledge, decreed for them their measures and their terms, and that everything proceeds by His will. This is one of the articles of faith concerning qadar."
  es: "En la creencia islámica, qadar significa que Dios creó la creación con Su conocimiento, decretó para ella sus medidas y sus condiciones, y que todo procede según Su voluntad. Este es uno de los artículos de fe relativos al qadar."
  fr: "En islam, le qadar signifie que Dieu a créé la création en toute connaissance de cause, a décrété pour elle ses dimensions et son échéance, et que tout se déroule selon Sa volonté. C'est l'un des articles de foi relatifs au qadar."
  ur: "اسلامی عقیدہ میں، قدر کا مطلب یہ ہے کہ خدا نے مخلوق کو اپنے علم سے پیدا کیا، ان کے لیے ان کے پیمانوں اور شرائط کا تعین کیا، اور یہ کہ ہر چیز اس کی مرضی سے ہوتی ہے۔ یہ قدر کے متعلق ایمان کے مضامین میں سے ایک ہے۔"
  tr: "İslami inançta kader, Tanrı'nın yaratılışları bilgisiyle yarattığı, onlar için önceden belirlenmiş ve hayatlarını atadığı ve her şeyin O'nun iradesiyle gerçekleştiğidir. Bu, kaderin inancının temel taşlarından biridir."
  id: "Predestinasi dalam ajaran Islam adalah bahwa Allah menciptakan ciptaan dengan pengetahuan-Nya, telah ditakdirkan untuk mereka dan menentukan hidup mereka, dan bahwa segala sesuatu terjadi atas kehendak-Nya. Ini adalah salah satu pilar iman dalam predestinasi."
