id: question/who-was-dawud
class: question
label:
  ar: من كان داود؟
  en: Who was Dawud?
  es: "¿Quién era Dawud?"
  fr: "Qui était Dawud ?"
  ur: "داؤد کون تھا؟"
summary:
  ar: داود نبي الله وملك بني إسرائيل؛ قتل جالوت بمقلاعه وأنزل عليه الزبور وألان الله له الحديد وسبحت الجبال
    معه.
  en: "Dawud was a prophet of God and king of the Children of Israel; he killed Goliath with his sling, the Psalms (al-Zabur) were revealed to him, God softened iron for him, and the mountains glorified God along with him."
  es: "Dawud fue profeta de Dios y rey de los Hijos de Israel; mató a Goliat con su honda, le fueron revelados los Salmos (al-Zabur), Dios ablandó el hierro para él, y las montañas glorificaron a Dios junto con él."
  fr: "Dawud était un prophète de Dieu et roi des Enfants d'Israël; il tua Goliath avec sa fronde, les Psaumes (al-Zabur) lui furent révélés, Dieu adoucit le fer pour lui et les montagnes glorifièrent Dieu avec lui."
  ur: "داؤد خدا کے نبی اور بنی اسرائیل کے بادشاہ تھے۔ اس نے جالوت کو اس کے گلے سے مار ڈالا، اس پر زبور ⁦(الزبور)⁩ نازل ہوئی، اللہ نے اس کے لیے لوہا نرم کر دیا، اور پہاڑوں نے اس کے ساتھ اللہ کی تسبیح کی۔"
question:
  ar: من كان داود؟
short_answer:
  ar: داود نبي الله وملك بني إسرائيل؛ قتل جالوت بمقلاعه وأنزل عليه الزبور وألان الله له الحديد وسبحت الجبال
    معه.
long_answer:
  ar: '[[person/dawud|داود]] نبي ملك؛ قتل جالوت الشاب وأحسن في الملك والحكم؛ ألان الله له الحديد يصنع
    الدروع وأنزل عليه الزبور فكان يتلوه فتسبح معه الجبال والطير؛ من أسرع الخلق صيامًا وقيامًا في الحديث.
    {cite:wikidata}'
