id: question/what-is-zuhd
class: question
label:
  ar: ما الزهد؟
  en: What is zuhd?
  es: "¿Qué es zuhd?"
  fr: "Qu'est-ce que zuhd ?"
summary:
  ar: الزهد هو ترك ما لا ينفع في الآخرة ورغبة عن زخرف الدنيا؛ صفة النبي والصالحين وباب من أبواب التزكية
    عند العلماء.
  en: "Zuhd is abstaining from what does not benefit one in the afterlife and turning away from the adornments of this world; it is a quality of the Prophet and the righteous, and in the view of scholars one of the paths of self-purification."
  es: "El zuhd consiste en abstenerse de aquello que no beneficia a uno en la otra vida y apartarse de los adornos de este mundo; es una cualidad del Profeta y de los justos, y en opinión de los eruditos, uno de los caminos de la purificación personal."
  fr: "Le zuhd consiste à s'abstenir de ce qui ne profite pas dans l'au-delà et à se détourner des ornements de ce monde; c'est une qualité du Prophète et des justes, et de l'avis des savants, l'une des voies de la purification de soi."
question:
  ar: ما الزهد؟
short_answer:
  ar: الزهد هو ترك ما لا ينفع في الآخرة ورغبة عن زخرف الدنيا؛ صفة النبي والصالحين وباب من أبواب التزكية
    عند العلماء.
long_answer:
  ar: '[[concept/zuhd|الزهد]] في الشرع ليس ترك الدنيا كلها بل ترك التعلق بها؛ قال ابن تيمية الزهد ترك
    ما لا ينفع في الآخرة والورع ترك ما تخاف ضرره في الآخرة؛ من مدارج السالكين وصفة الزهاد كأحمد وابن المبارك
    والفضيل. {cite:wikidata}'
