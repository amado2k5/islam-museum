    summary:
      ar: "ابن تيمية: أهل العلم بالحديث لا يعتمدون على مجرد تصحيح الحاكم وإن كان غالب ما يصححه صحيحاً، فهو في المصححين بمنزلة الثقة الذي يكثر غلطه؛ وابن القيم في «الفروسية» أشد من ذلك، فيرى أن الحفاظ لا يعبؤون بتصحيحه ولا يدل على حسن الحديث."
      en: "Ibn Taymiyya: hadith specialists do not rely on al-Hakim's authentication alone, even though most of what he declares sound is sound; among authenticators he is like a trustworthy narrator who makes many mistakes. Ibn al-Qayyim, in al-Furusiyya, goes further: the hadith masters pay no regard to his authentication, which does not even show a hadith to be hasan."
      ur: "ابن تیمیہ: ماہرینِ حدیث صرف حاکم کی تصحیح پر اعتماد نہیں کرتے، اگرچہ ان کی صحیح قرار دی ہوئی اکثر احادیث صحیح ہیں؛ تصحیح کرنے والوں میں وہ اس ثقہ راوی کی طرح ہیں جس سے غلطیاں زیادہ ہوتی ہیں۔ ابن القیم «الفروسیہ» میں اس سے آگے بڑھ کر کہتے ہیں کہ حفاظ ان کی تصحیح کی پروا نہیں کرتے، اور اس سے حدیث کا حسن ہونا بھی ثابت نہیں ہوتا۔"
