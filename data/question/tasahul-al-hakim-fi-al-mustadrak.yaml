  - tradition: sunni
    id: sunni-ibn-al-salah-tawassut
    standing: main
    stance: { ar: "التوسط: ما انفرد به حسن ما لم تظهر علة", en: "Middle course: what he alone authenticated is hasan unless a defect appears", ur: "درمیانی راہ: جسے صرف انہوں نے صحیح کہا وہ حسن ہے جب تک علت ظاہر نہ ہو" }
    summary:
      ar: "ابن الصلاح، كما ينقله ابن كثير: الحاكم واسع الخطو في شرط الصحيح متساهل بالقضاء به، فالأولى التوسط في أمره؛ فما لم نجد فيه تصحيحاً لغيره من الأئمة فإن لم يكن صحيحاً فهو حسن يحتج به، إلا أن تظهر فيه علة توجب ضعفه."
      en: "Ibn al-Salah, as Ibn Kathir quotes him: al-Hakim takes wide strides in the condition of soundness and is lax in pronouncing it, so the better course is a middle one; what no other imam has authenticated is, if not sound, then hasan and usable as proof, unless a defect appears that makes it weak."
      ur: "ابن الصلاح، جیسا کہ ابن کثیر نقل کرتے ہیں: حاکم شرطِ صحیح میں وسیع قدم رکھتے اور اس کا حکم لگانے میں متساہل ہیں، اس لیے بہتر درمیانی راہ ہے؛ جسے کسی دوسرے امام نے صحیح نہ کہا ہو وہ اگر صحیح نہیں تو حسن اور قابلِ حجت ہے، الا یہ کہ کوئی ایسی علت ظاہر ہو جو اسے ضعیف کر دے۔"
