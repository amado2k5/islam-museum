    summary:
      ar: "الحاكم في خطبة المستدرك: يُخرج أحاديث رواتها ثقات احتج بمثلها الشيخان أو أحدهما، والزيادة من الثقات مقبولة، والشيخان لم يدّعيا حصر الصحيح فيما أخرجاه."
      en: "Al-Hakim in the preface: he brings out hadiths whose narrators are trustworthy, of the kind the two masters or one of them relied on; additions by trustworthy narrators are accepted; and the two masters never claimed that sound hadith was confined to what they included."
      ur: "حاکم المستدرک کے خطبے میں: وہ ایسی احادیث نکالتے ہیں جن کے راوی ثقہ ہیں اور ویسے راویوں سے شیخین یا ان میں سے ایک نے حجت پکڑی؛ ثقات کا اضافہ مقبول ہے؛ اور شیخین نے کبھی صحیح کو اپنی درج کردہ احادیث تک محدود ہونے کا دعویٰ نہیں کیا۔"
    holders: [person/al-hakim-al-nisaburi]
