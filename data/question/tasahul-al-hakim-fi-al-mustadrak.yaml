id: question/tasahul-al-hakim-fi-al-mustadrak
class: question
label:
  ar: "كيف يُعامَل تصحيح الحاكم في «المستدرك»؟"
  en: "How should al-Hakim's authentications in the Mustadrak be treated?"
  ur: "المستدرک میں حاکم کی تصحیح کو کیسے برتا جائے؟"
summary:
  ar: "قدّم الحاكم «المستدرك» على أنه أحاديث بأسانيد احتج الشيخان بمثلها {cite:mustadrak-haramayn-1997-v1 p. 40}، واتفق نقاد الحديث بعده على أنه تساهل في التصحيح، واختلفوا في قدر ذلك وفيما يُصنع بما انفرد بتصحيحه: فتوسط ابن الصلاح، وقدّر الذهبي نسباً لما يصح منه، وقسّمه ابن حجر أقساماً، ورأى ابن تيمية أن مجرد تصحيحه لا يُعتمد {cite:mustadrak-haramayn-1997-v1 p. 9-16}."
  en: "Al-Hakim presented the Mustadrak as hadiths with chains of the kind the two masters relied on {cite:mustadrak-haramayn-1997-v1 p. 40}; later hadith critics agreed that he was lax in authentication but differed on how far, and on what to do with hadiths only he declared sound: Ibn al-Salah took a middle course, al-Dhahabi estimated proportions, Ibn Hajar divided the book into classes, and Ibn Taymiyya held that his authentication alone is not relied on {cite:mustadrak-haramayn-1997-v1 p. 9-16}."
  ur: "حاکم نے المستدرک کو ایسی احادیث کے طور پر پیش کیا جن کی اسانید ویسی ہیں جن سے شیخین نے حجت پکڑی {cite:mustadrak-haramayn-1997-v1 p. 40}؛ بعد کے ناقدین متفق تھے کہ وہ تصحیح میں متساہل تھے، مگر اس کی مقدار اور ان احادیث کے بارے میں اختلاف کیا جنہیں صرف انہوں نے صحیح کہا: ابن الصلاح نے درمیانی راہ لی، ذہبی نے تناسب کا اندازہ لگایا، ابن حجر نے کتاب کو اقسام میں بانٹا، اور ابن تیمیہ کے نزدیک صرف ان کی تصحیح پر اعتماد نہیں کیا جاتا {cite:mustadrak-haramayn-1997-v1 p. 9-16}۔"
wings: [ideas, words]
themes: [scripture-and-its-sciences]
question:
  ar: "إذا انفرد الحاكم بتصحيح حديث في المستدرك، فما درجة ذلك الحديث؟"
  en: "When al-Hakim alone declares a hadith in the Mustadrak sound, what grade does that hadith have?"
  ur: "جب المستدرک میں کسی حدیث کو صرف حاکم صحیح کہیں تو اس حدیث کا درجہ کیا ہے؟"
issue:
  ar: "هل يكفي حكم الحاكم بأن الحديث «صحيح على شرط الشيخين» أو «صحيح الإسناد» للاحتجاج به دون نظر مستقل؟"
  en: "Is al-Hakim's verdict that a hadith is 'sound on the two masters' condition' or 'sound in chain' enough to rely on it without independent examination?"
  ur: "کیا حاکم کا یہ حکم کہ حدیث «شیخین کی شرط پر صحیح» یا «صحیح الاسناد» ہے، آزادانہ جانچ کے بغیر اس سے استدلال کے لیے کافی ہے؟"
short_answer:
  ar: "لا يكتفي جمهور النقاد بمجرد تصحيحه: فمنهم من جعل ما انفرد به حسناً ما لم تظهر علة ⁦(ابن الصلاح)⁩، ومنهم من رأى أن قسماً كبيراً منه دون الصحيح وأن فيه موضوعات ⁦(الذهبي، ابن كثير، ابن حجر)⁩، ومنهم من صرّح بأن تصحيحه وحده لا يُعتمد ⁦(ابن تيمية، ابن القيم)⁩."
  en: "Most critics do not accept his authentication on its own: some treat what only he declared sound as hasan unless a defect appears (Ibn al-Salah); some hold that a large part falls below sound and that it contains fabrications (al-Dhahabi, Ibn Kathir, Ibn Hajar); some state outright that his authentication alone is not relied on (Ibn Taymiyya, Ibn al-Qayyim)."
  ur: "اکثر ناقدین صرف ان کی تصحیح پر اکتفا نہیں کرتے: بعض اس حدیث کو جسے صرف انہوں نے صحیح کہا، علت ظاہر نہ ہو تو حسن مانتے ہیں ⁦(ابن الصلاح)⁩؛ بعض کے نزدیک اس کا بڑا حصہ صحیح سے کم ہے اور اس میں موضوعات ہیں ⁦(ذہبی، ابن کثیر، ابن حجر)⁩؛ اور بعض صاف کہتے ہیں کہ صرف ان کی تصحیح پر اعتماد نہیں کیا جاتا ⁦(ابن تیمیہ، ابن القیم)⁩۔"
