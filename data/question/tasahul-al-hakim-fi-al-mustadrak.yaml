    standing: main
    stance: { ar: "يُنظر في كل حديث؛ ففيه الصحيح والحسن والضعيف والموضوع", en: "Each hadith must be examined: it holds the sound, the good, the weak and the fabricated", ur: "ہر حدیث کو جانچنا ہوگا: اس میں صحیح، حسن، ضعیف اور موضوع سب ہیں" }
    summary:
      ar: "الذهبي: ما على شرطهما أو شرط أحدهما نحو الثلث أو النصف بحسب الروايتين عنه، ونحو الربع صالح الإسناد، والباقي مناكير، وفيه نحو مائة موضوع؛ وابن كثير يعدد فيه الصحيح والحسن والضعيف والموضوع؛ وابن حجر يقسمه ثلاثة أقسام بحسب احتجاج الشيخين برواته، ويرى عمدته ما أخرجا لرواته في المتابعات، وأكثره لا ينزل عن الحسن، وينقل الاعتذار بأنه صنّفه في آخر عمره."
      en: "Al-Dhahabi: what meets their condition or that of one of them is about a third, or about half in the other version quoted from him, about a quarter has fair chains, the rest is objectionable, and some hundred hadiths are fabricated; Ibn Kathir lists the sound, the good, the weak and the fabricated in it; Ibn Hajar divides it into three classes by whether the two masters relied on its narrators, finds its mainstay in narrators they used only for corroboration, most of which is not below hasan, and passes on the excuse that al-Hakim compiled it late in life."
      ur: "ذہبی: جو ان کی یا ان میں سے ایک کی شرط پر ہے وہ تقریباً ایک تہائی ہے، یا ان سے منقول دوسری روایت کے مطابق تقریباً نصف؛ تقریباً ایک چوتھائی کی سند صالح ہے، باقی منکر ہے، اور تقریباً سو احادیث موضوع ہیں؛ ابن کثیر اس میں صحیح، حسن، ضعیف اور موضوع گنواتے ہیں؛ ابن حجر اسے اس لحاظ سے تین اقسام میں بانٹتے ہیں کہ شیخین نے اس کے راویوں سے حجت پکڑی یا نہیں، اس کا اصل سرمایہ ان راویوں کو قرار دیتے ہیں جنہیں شیخین نے صرف متابعات میں لیا، جن کا اکثر حصہ حسن سے کم نہیں، اور یہ عذر نقل کرتے ہیں کہ حاکم نے اسے آخر عمر میں لکھا۔"
