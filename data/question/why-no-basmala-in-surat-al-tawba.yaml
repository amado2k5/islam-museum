id: question/why-no-basmala-in-surat-al-tawba
class: question
label:
  ar: "لماذا لا تبدأ سورة التوبة بالبسملة؟"
  en: "Why does Surat al-Tawba not open with the basmala?"
  ur: "سورۂ توبہ بسملہ سے کیوں شروع نہیں ہوتی؟"
summary:
  ar: "سورة التوبة ⁦(براءة)⁩ وحدها من سور المصحف لا تُكتب في أولها البسملة. يلخص القرطبي خمسة أقوال في السبب، ثم يصحح أن البسملة لم تُكتب لأن جبريل لم ينزل بها؛ ويعتمد طنطاوي هذا القول ويضعّف الأقوال الخمسة."
  en: "Surat al-Tawba (Bara'a) is the only sura of the mushaf at whose head the basmala is not written. Al-Qurtubi summarises five explanations and then holds that it was not written because Gabriel did not bring it down; Tantawi adopts that view and judges the five explanations weak."
  ur: "مصحف کی سورتوں میں صرف سورۂ توبہ (براءت) کے آغاز میں بسملہ نہیں لکھی جاتی۔ قرطبی اس کی پانچ توجیہات بیان کر کے یہ قول صحیح قرار دیتے ہیں کہ یہ اس لیے نہیں لکھی گئی کہ جبریل اسے لے کر نازل نہیں ہوئے؛ طنطاوی یہی قول اختیار کرتے ہیں اور پانچوں توجیہات کو کمزور سمجھتے ہیں۔"
question:
  ar: "لماذا لم تُكتب البسملة في أول سورة التوبة؟"
  en: "Why was the basmala not written at the head of Surat al-Tawba?"
  ur: "سورۂ توبہ کے آغاز میں بسملہ کیوں نہیں لکھی گئی؟"
short_answer:
  ar: "الرأي الذي يصححه القرطبي ويعتمده طنطاوي أن ذلك توقيف: لم ينزل بها جبريل في هذه السورة، ولم يأمر النبي بكتابتها؛ وتُروى أقوال أخرى في الحكمة أو السبب يعدّها طنطاوي اجتهادات أو روايات ضعيفة."
  en: "The view al-Qurtubi holds correct and Tantawi adopts is that it rests on revelation: Gabriel did not bring the basmala down with this sura and the Prophet did not order it written. Other explanations of its reason or wisdom are reported, which Tantawi treats as reasoned guesses or weak reports."
  ur: "قرطبی جسے صحیح کہتے ہیں اور طنطاوی جسے اختیار کرتے ہیں وہ یہ ہے کہ یہ توقیفی معاملہ ہے: جبریل اس سورت کے ساتھ بسملہ لے کر نازل نہیں ہوئے اور نبی نے اسے لکھنے کا حکم نہیں دیا۔ اس کی وجہ یا حکمت میں دوسری توجیہات بھی منقول ہیں جنہیں طنطاوی اجتہادی توجیہات یا کمزور روایات سمجھتے ہیں۔"
