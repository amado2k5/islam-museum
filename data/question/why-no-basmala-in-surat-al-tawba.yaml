issue:
  ar: "ما سبب ترك البسملة في أول سورة التوبة؟"
  en: "What is the reason the basmala is absent at the head of Surat al-Tawba?"
  ur: "سورۂ توبہ کے آغاز میں بسملہ نہ ہونے کی وجہ کیا ہے؟"
sensitivity: contested
perspectives:
  - tradition: sunni
    id: tawqif-gabriel-did-not-bring-it
    standing: main
    stance:
      ar: "توقيف: لم ينزل بها جبريل ولم يأمر النبي بكتابتها"
      en: "Revelation-fixed: Gabriel did not bring it and the Prophet did not order it written"
      ur: "توقیفی: جبریل اسے نہیں لائے اور نبی نے اسے لکھنے کا حکم نہیں دیا"
    summary:
      ar: "قال القرطبي بعد سرد الأقوال: الصحيح أن التسمية لم تُكتب لأن جبريل ما نزل بها في هذه السورة؛ وقال الفخر الرازي إن وضع السورة بعد الأنفال وحذف البسملة كانا وحيًا؛ وقال الجلال إن النبي لم يأمر بذلك؛ وقال الجمل إن عدم البيان في موضع البيان بيان للعدم. واعتمد طنطاوي هذا القول {cite:tafsir-tantawi-wasit p.2502}."
      en: "After listing the views, al-Qurtubi said the correct one is that the basmala was not written because Gabriel did not bring it down in this sura; Fakhr al-Din al-Razi said that placing the sura after al-Anfal and omitting the basmala were both by revelation; al-Jalal said the Prophet did not order it; al-Jamal said that silence where a statement was due is itself a statement of absence. Tantawi adopts this view {cite:tafsir-tantawi-wasit p.2502}."
      ur: "اقوال گنوانے کے بعد قرطبی نے کہا: صحیح یہ ہے کہ بسملہ اس لیے نہیں لکھی گئی کہ جبریل اس سورت میں اسے لے کر نازل نہیں ہوئے؛ فخر الدین رازی نے کہا کہ سورت کو انفال کے بعد رکھنا اور بسملہ حذف کرنا دونوں وحی سے تھے؛ الجلال نے کہا کہ نبی نے اس کا حکم نہیں دیا؛ الجمل نے کہا کہ بیان کے موقع پر بیان نہ ہونا عدم کا بیان ہے۔ طنطاوی یہی قول اختیار کرتے ہیں {cite:tafsir-tantawi-wasit p.2502}۔"
    holders: [person/al-qurtubi, person/fakhr-al-din-al-razi, person/muhammad-sayyid-tantawi]
    sources: [source/tafsir-tantawi-wasit]
  - tradition: sunni
    id: custom-of-revoking-treaties
    standing: secondary
    stance:
      ar: "حكمة: كانت العرب لا تكتب البسملة في كتب نقض العهود"
      en: "Wisdom: the Arabs left the basmala out of letters revoking treaties"
      ur: "حکمت: عرب عہد توڑنے کے خطوط میں بسملہ نہیں لکھتے تھے"
    summary:
      ar: "قول أول يحكيه القرطبي: كان من عادة العرب إذا أرادت نقض عهد أن تكتب كتابًا بلا بسملة، فلما نزلت براءة بنقض العهود بعث بها النبي علي بن أبي طالب فقرأها في الموسم بلا بسملة على عادتهم. ويعدّه طنطاوي تعليلًا عقليًّا اجتهاديًّا لا يُعتمد عليه في السبب {cite:tafsir-tantawi-wasit p.2501} {cite:tafsir-tantawi-wasit p.2502}."
      en: "A first view reported by al-Qurtubi: when the Arabs wished to revoke a treaty they wrote a letter without the basmala; when Bara'a came down revoking the treaties, the Prophet sent Ali ibn Abi Talib, who read it at the pilgrimage season without the basmala, following their custom. Tantawi counts it a reasoned explanation of wisdom, not a basis for the cause {cite:tafsir-tantawi-wasit p.2501} {cite:tafsir-tantawi-wasit p.2502}."
      ur: "قرطبی کا نقل کردہ پہلا قول: عرب جب کوئی عہد توڑنا چاہتے تو بغیر بسملہ کے خط لکھتے؛ جب براءت عہد توڑنے کے ساتھ نازل ہوئی تو نبی نے علی بن ابی طالب کو بھیجا جنہوں نے موسمِ حج میں اسے ان کی عادت کے مطابق بغیر بسملہ کے پڑھا۔ طنطاوی اسے حکمت کی ایک عقلی توجیہ سمجھتے ہیں، سبب کی بنیاد نہیں {cite:tafsir-tantawi-wasit p.2501} {cite:tafsir-tantawi-wasit p.2502}۔"
    sources: [source/tafsir-tantawi-wasit]
  - tradition: sunni
    id: uthman-joined-anfal-and-baraa
    standing: secondary
    stance:
      ar: "رواية عن عثمان: لم يبين النبي أنها من الأنفال فقُرنتا بلا بسملة"
      en: "Report from Uthman: the Prophet did not make clear whether it belonged to al-Anfal, so the two were joined without a basmala"
      ur: "عثمان سے روایت: نبی نے واضح نہیں کیا کہ یہ انفال کا حصہ ہے، اس لیے دونوں بغیر بسملہ کے ملا دی گئیں"
    summary:
      ar: "روى النسائي والترمذي من طريق يزيد الفارسي عن ابن عباس أنه سأل عثمان لم قرنوا الأنفال ببراءة ولم يكتبوا بينهما البسملة، فقال إن قصتها شبيهة بقصتها وقُبض النبي ولم يبين أنها منها. ونقل طنطاوي عن أحد المحققين ⁦(أحمد شاكر في تحقيق المسند)⁩ أن إسناده ضعيف جدًا ولا أصل له لأنه يدور على يزيد الفارسي الذي يكاد يكون مجهولًا {cite:tafsir-tantawi-wasit p.2501} {cite:tafsir-tantawi-wasit p.2503}."
      en: "Al-Nasa'i and al-Tirmidhi report, through Yazid al-Farisi from Ibn Abbas, that he asked Uthman why they had joined al-Anfal to Bara'a without writing the basmala between them, and Uthman said their stories were alike and the Prophet died without making clear that it belonged to it. Tantawi quotes a verifying scholar (Ahmad Shakir, in his edition of the Musnad) that the chain is very weak and baseless, since it turns on Yazid al-Farisi, who is almost unknown {cite:tafsir-tantawi-wasit p.2501} {cite:tafsir-tantawi-wasit p.2503}."
      ur: "نسائی اور ترمذی یزید الفارسی کے طریق سے ابن عباس سے روایت کرتے ہیں کہ انہوں نے عثمان سے پوچھا کہ انفال کو براءت کے ساتھ کیوں ملایا اور درمیان میں بسملہ کیوں نہیں لکھی، تو عثمان نے کہا کہ دونوں کا قصہ ملتا جلتا ہے اور نبی کی وفات ہو گئی اور انہوں نے واضح نہیں کیا کہ یہ اس کا حصہ ہے۔ طنطاوی ایک محقق (مسند کی تحقیق میں احمد شاکر) سے نقل کرتے ہیں کہ اس کی سند بہت ضعیف اور بے اصل ہے، کیونکہ یہ یزید الفارسی پر گھومتی ہے جو تقریباً مجہول ہیں {cite:tafsir-tantawi-wasit p.2501} {cite:tafsir-tantawi-wasit p.2503}۔"
    holders: [person/ahmad-muhammad-shakir]
