  - tradition: sunni-maliki
    id: beginning-was-lost
    standing: secondary
    stance:
      ar: "سقط أولها فسقطت البسملة معه"
      en: "Its opening was lost and the basmala with it"
      ur: "اس کا ابتدائی حصہ ساقط ہوا اور اس کے ساتھ بسملہ بھی"
    summary:
      ar: "قول ثالث يرويه ابن وهب وابن القاسم وابن عبد الحكم عن مالك: لما سقط أول السورة سقطت معه البسملة، ويُروى عن ابن عجلان وسعيد بن جبير أنها كانت تعدل سورة البقرة. ويرده طنطاوي بأنه لا دليل عليه ولا سند، وأن الالتفات إليه يمس قداسة القرآن {cite:tafsir-tantawi-wasit p.2501} {cite:tafsir-tantawi-wasit p.2503}."
      en: "A third view, reported by Ibn Wahb, Ibn al-Qasim and Ibn Abd al-Hakam from Malik: when the beginning of the sura fell away, the basmala fell away with it; Ibn Ajlan and Sa'id ibn Jubayr are reported to have said it had been as long as al-Baqara. Tantawi rejects it as having no evidence or chain and as touching the sanctity of the Qur'an {cite:tafsir-tantawi-wasit p.2501} {cite:tafsir-tantawi-wasit p.2503}."
      ur: "تیسرا قول جو ابن وہب، ابن القاسم اور ابن عبد الحکم نے مالک سے روایت کیا: جب سورت کا ابتدائی حصہ ساقط ہوا تو اس کے ساتھ بسملہ بھی ساقط ہو گئی؛ ابن عجلان اور سعید بن جبیر سے منقول ہے کہ یہ سورۂ بقرہ کے برابر تھی۔ طنطاوی اسے رد کرتے ہیں کہ اس پر نہ کوئی دلیل ہے نہ سند، اور اس کی طرف توجہ قرآن کی تقدیس کو مجروح کرتی ہے {cite:tafsir-tantawi-wasit p.2501} {cite:tafsir-tantawi-wasit p.2503}۔"
    holders: [person/malik-ibn-anas]
    sources: [source/tafsir-tantawi-wasit]
  - tradition: sunni
    id: one-sura-or-two
    standing: secondary
    stance:
      ar: "اختلف الصحابة: سورة واحدة أم سورتان؟ فتُركت فرجة بلا بسملة"
      en: "The Companions differed whether they were one sura or two, so a gap was left without a basmala"
      ur: "صحابہ میں اختلاف ہوا کہ ایک سورت ہے یا دو، اس لیے بغیر بسملہ کے فاصلہ چھوڑا گیا"
    summary:
      ar: "قول رابع يحكيه القرطبي عن خارجة وأبي عصمة: لما كُتب المصحف في خلافة عثمان اختلف الصحابة في الأنفال وبراءة أهما سورة واحدة أم سورتان، فتُركت بينهما فرجة لمن قال سورتان، وتُركت البسملة لمن قال سورة واحدة. ويضعّفه طنطاوي بأنهما عُرفتا سورتين مستقلتين منذ عهد النبي ولكل منهما موضوعها: الأنفال لبدر والتوبة لتبوك {cite:tafsir-tantawi-wasit p.2501} {cite:tafsir-tantawi-wasit p.2503}."
      en: "A fourth view reported by al-Qurtubi from Kharija and Abu Isma: when the mushaf was written under Uthman, the Companions differed over whether al-Anfal and Bara'a were one sura or two, so a gap was left for those who said two and the basmala omitted for those who said one. Tantawi judges it weak, since the two have been known as separate suras since the Prophet's time and each has its own subject: al-Anfal Badr, al-Tawba Tabuk {cite:tafsir-tantawi-wasit p.2501} {cite:tafsir-tantawi-wasit p.2503}."
      ur: "چوتھا قول جو قرطبی نے خارجہ اور ابو عصمہ سے نقل کیا: جب عثمان کے دور میں مصحف لکھا گیا تو صحابہ میں اختلاف ہوا کہ انفال اور براءت ایک سورت ہیں یا دو؛ چنانچہ دو کہنے والوں کے لیے فاصلہ چھوڑا گیا اور ایک کہنے والوں کے لیے بسملہ ترک کی گئی۔ طنطاوی اسے کمزور سمجھتے ہیں کیونکہ دونوں نبی کے زمانے سے دو الگ سورتیں معروف ہیں اور ہر ایک کا اپنا موضوع ہے: انفال کا بدر اور توبہ کا تبوک {cite:tafsir-tantawi-wasit p.2501} {cite:tafsir-tantawi-wasit p.2503}۔"
    sources: [source/tafsir-tantawi-wasit]
  - tradition: sunni
    id: basmala-is-safety
    standing: secondary
    stance:
      ar: "البسملة أمان، وبراءة نزلت بالسيف"
      en: "The basmala is a safe-conduct, and Bara'a came down with the sword"
      ur: "بسملہ امان ہے، اور براءت تلوار کے ساتھ نازل ہوئی"
    summary:
      ar: "قول خامس يُروى عن ابن عباس أنه سأل علي بن أبي طالب فأجابه بأن البسملة أمان وبراءة نزلت بالسيف ليس فيها أمان؛ ونحوه قول المبرد إن التسمية افتتاح للخير وأول السورة وعيد ونقض عهود. ويعدّه طنطاوي، كالقول الأول، بيانًا للحكمة لا للسبب {cite:tafsir-tantawi-wasit p.2502}."
      en: "A fifth view reported from Ibn Abbas, who asked Ali ibn Abi Talib and was told that the basmala is a safe-conduct and Bara'a came down with the sword and holds no safe-conduct; similar is al-Mubarrad's saying that the basmala opens what is good, while the start of this sura is a warning and a revoking of treaties. Tantawi, as with the first view, treats it as an account of wisdom, not of the cause {cite:tafsir-tantawi-wasit p.2502}."
      ur: "پانچواں قول ابن عباس سے منقول ہے کہ انہوں نے علی بن ابی طالب سے پوچھا تو انہوں نے فرمایا کہ بسملہ امان ہے اور براءت تلوار کے ساتھ نازل ہوئی، اس میں امان نہیں؛ اسی طرح مبرد کا قول ہے کہ تسمیہ خیر کا افتتاح ہے اور اس سورت کا آغاز وعید اور عہود توڑنے پر ہے۔ طنطاوی، پہلے قول کی طرح، اسے سبب نہیں بلکہ حکمت کا بیان سمجھتے ہیں {cite:tafsir-tantawi-wasit p.2502}۔"
