label:
  ar: ما الإسراء والمعراج؟
  en: What are the Isra and Miraj?
summary:
  ar: الإسراء والمعراج رحلة ليلية للنبي محمد من المسجد الحرام إلى المسجد الأقصى ثم صعوده إلى السماوات، ويرويها التراث، وفيها فرضت الصلوات الخمس.
  en: "The Isra and Miraj are a night journey of the Prophet Muhammad from the Sacred Mosque to the Al-Aqsa Mosque, then his ascent through the heavens. The tradition narrates it, and in it the five daily prayers were enjoined."
wings: []
question:
  ar: ما الإسراء والمعراج؟
short_answer:
  ar: الإسراء والمعراج رحلة ليلية للنبي محمد من المسجد الحرام إلى المسجد الأقصى ثم صعوده إلى السماوات، ويرويها التراث، وفيها فرضت الصلوات الخمس.
long_answer:
  ar: |
    الإسراء والمعراج رحلة ليلية للنبي محمد، بدأت من المسجد الحرام في مكة إلى المسجد الأقصى في القدس، ثم عروجه إلى السماوات، كما يعرض مدخل [[event/isra-and-miraj|الإسراء والمعراج]].
    يذكر التراث أن الصلوات الخمس فُرضت في هذه الرحلة، وهي مرتبطة بالصلاة في [[practice/salah|الصلاة]].
    ويعرض المدخل الرواية بوصفها رواية من التراث، مع ذكر ما اختلف فيه العلماء من تفاصيلها وزمنها.
