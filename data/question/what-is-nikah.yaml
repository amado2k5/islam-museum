label:
  ar: ما النكاح؟
  en: What is nikah?
  es: "¿Qué es el nikah?"
  fr: "Qu'est-ce que le nikah ?"
summary:
  ar: النكاح هو العقد الشرعي للزواج في الإسلام؛ أركانه الإيجاب والقبول والولي والشهود عند جمهور المذاهب.
  en: "Nikah is the valid legal contract of marriage in Islam. According to the majority of schools, its pillars are offer, acceptance, the guardian (wali) and the witnesses."
  es: "El nikah es el contrato legal válido de matrimonio en el Islam. Según la mayoría de las escuelas, sus pilares son la oferta, la aceptación, el tutor (wali) y los testigos."
  fr: "Le nikah est le contrat de mariage légal et valide en islam. Selon la majorité des écoles de pensée, ses piliers sont l'offre, l'acceptation, le tuteur (wali) et les témoins."
question:
  ar: ما النكاح؟
short_answer:
  ar: النكاح هو العقد الشرعي للزواج في الإسلام؛ أركانه الإيجاب والقبول والولي والشهود عند جمهور المذاهب.
long_answer:
  ar: النكاح عقد الزواج الشرعي يحلل به العشرة والنسب؛ أركانه عند الجمهور الإيجاب والقبول والولي والشاهدان
    ولا محل للسر فيه عند مالك. ورد في السنّة فضل المهر اليسير والوليمة والإعلان، وتتنوع صور احتفائه عبر
    الثقافات الإسلامية. {cite:wikidata}
