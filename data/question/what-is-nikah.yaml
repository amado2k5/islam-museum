question:
  ar: ما النكاح؟
short_answer:
  ar: النكاح هو العقد الشرعي للزواج في الإسلام؛ أركانه الإيجاب والقبول والولي والشهود عند جمهور المذاهب.
long_answer:
  ar: النكاح عقد الزواج الشرعي يحلل به العشرة والنسب؛ أركانه عند الجمهور الإيجاب والقبول والولي والشاهدان
    ولا محل للسر فيه عند مالك. ورد في السنّة فضل المهر اليسير والوليمة والإعلان، وتتنوع صور احتفائه عبر
    الثقافات الإسلامية. {cite:wikidata}
