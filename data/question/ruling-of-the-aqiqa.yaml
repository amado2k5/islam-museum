  summary:
    ar: 'قول طائفة منهم الظاهرية، أخذاً بظاهر حديث سمرة «كل غلام مرتهن بعقيقته، تُذبح عنه يوم سابعه»؛ وينقل المحقق قول ابن حزم في المحلى: العقيقة فرض واجب يُجبر الإنسان عليها إذا فضل له عن قوته مقدارها.'
    en: 'The view of a group including the Zahiris, taking the hadith of Samura at face value: "every boy is in pledge for his aqiqa, slaughtered for him on his seventh day"; the editor quotes Ibn Hazm in al-Muhalla: the aqiqa is a binding duty to which a person is compelled if he has its price beyond his sustenance.'
    ur: 'ظاہریہ سمیت ایک گروہ کا قول، سمرہ کی حدیث کے ظاہر کو لیتے ہوئے: «ہر بچہ اپنے عقیقے کے بدلے گروی ہے، ساتویں دن اس کی طرف سے ذبح کیا جائے»؛ محقق ابن حزم کا المحلیٰ سے قول نقل کرتے ہیں: عقیقہ فرض واجب ہے، اگر اپنی خوراک سے اس کی مقدار بچ جائے تو آدمی کو اس پر مجبور کیا جائے۔'
