  standing: main
  stance:
    ar: العقيقة سنة
    en: The aqiqa is a sunna
    ur: عقیقہ سنت ہے
  summary:
    ar: قول الجمهور، فهموا من حديث «من وُلد له ولد فأحب أن ينسك عن ولده فليفعل» الندب؛ ويحيل محقق طبعة ابن ونيس في ذلك إلى كتب المالكية والشافعية والحنابلة.
    en: The majority view, reading recommendation in the hadith "whoever has a child born and wishes to offer a sacrifice for the child, let him do so"; the editor of the Ibn Wanis edition refers here to the Maliki, Shafi'i and Hanbali manuals.
    ur: جمہور کا قول، جنہوں نے حدیث «جس کے ہاں بچہ پیدا ہو اور وہ اس کی طرف سے قربانی کرنا چاہے تو کرے» سے ندب سمجھا؛ ابن ونیس ایڈیشن کے محقق یہاں مالکیہ، شافعیہ اور حنابلہ کی کتب کا حوالہ دیتے ہیں۔
