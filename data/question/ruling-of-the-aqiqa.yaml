question:
  ar: هل العقيقة عن المولود واجبة أم سنة أم مباحة؟
  en: Is the aqiqa for a newborn obligatory, a sunna, or merely permitted?
  ur: نومولود کا عقیقہ واجب ہے، سنت ہے یا محض مباح؟
issue:
  ar: درجة مشروعية العقيقة.
  en: The degree to which the aqiqa is prescribed.
  ur: عقیقے کی مشروعیت کا درجہ۔
short_answer:
  ar: 'الظاهرية: واجبة؛ الجمهور: سنة؛ أبو حنيفة: ليست فرضاً ولا سنة، بحسب ما يحكيه ابن رشد.'
  en: 'Zahiris: obligatory; the majority: a sunna; Abu Hanifa: neither obligatory nor sunna - as Ibn Rushd reports.'
  ur: 'ابن رشد کے بیان کے مطابق ظاہریہ: واجب؛ جمہور: سنت؛ ابو حنیفہ: نہ فرض نہ سنت۔'
perspectives:
- tradition: sunni
