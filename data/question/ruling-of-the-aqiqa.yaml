id: question/ruling-of-the-aqiqa
class: question
label:
  ar: ما حكم العقيقة؟
  en: What is the ruling on the aqiqa?
  ur: عقیقے کا حکم کیا ہے؟
summary:
  ar: 'أول ما يعقده ابن رشد في كتاب العقيقة، وهو ستة أبواب: حكمها، ومحلها، ومن يُعق عنه وكم، ووقتها، وسنها وصفتها، وحكم لحمها. فذهبت طائفة منهم الظاهرية إلى أنها واجبة، والجمهور إلى أنها سنة، وأبو حنيفة إلى أنها ليست فرضاً ولا سنة، وقيل إن تحصيل مذهبه أنها تطوع. ويرد ابن رشد الخلاف إلى تعارض مفهوم الآثار: حديث سمرة «كل غلام مرتهن بعقيقته» وظاهره الوجوب، وحديث «لا أحب العقوق» وظاهره الندب أو الإباحة {cite:bidaya-ibn-wanis-v4 p. 6} {cite:bidaya-ibn-wanis-v4 p. 7}.'
  en: 'The first issue in Ibn Rushd''s book of the aqiqa, which has six chapters: its ruling, the animal, for whom it is offered and how many, its time, the animal''s age and description, and the ruling on its meat. A group including the Zahiris hold it obligatory, the majority a sunna, and Abu Hanifa neither obligatory nor sunna - and it is said his position amounts to its being voluntary. Ibn Rushd traces the disagreement to conflicting understandings of the reports: the hadith of Samura "every boy is in pledge for his aqiqa", which on its face means obligation, and the hadith "I do not like uquq", which on its face means recommendation or permission.'
  ur: 'ابن رشد کی کتاب العقیقہ کا پہلا مسئلہ، جس کے چھ ابواب ہیں: اس کا حکم، جانور، کس کی طرف سے اور کتنے، وقت، جانور کی عمر و صفت، اور گوشت کا حکم۔ ظاہریہ سمیت ایک گروہ اسے واجب، جمہور سنت، اور ابو حنیفہ نہ فرض نہ سنت کہتے ہیں — اور کہا گیا ہے کہ ان کے مذہب کا حاصل یہ ہے کہ وہ نفل ہے۔ ابن رشد اختلاف کو آثار کے مفہوم کے تعارض کی طرف لوٹاتے ہیں: سمرہ کی حدیث «ہر بچہ اپنے عقیقے کے بدلے گروی ہے» جس کا ظاہر وجوب ہے، اور حدیث «میں عقوق کو پسند نہیں کرتا» جس کا ظاہر ندب یا اباحت ہے۔'
