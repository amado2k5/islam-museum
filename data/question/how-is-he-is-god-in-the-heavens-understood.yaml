id: question/how-is-he-is-god-in-the-heavens-understood
class: question
label:
  ar: "كيف يُفهم قوله في سورة الأنعام إنه الله في السماوات وفي الأرض؟"
  en: "How is 'He is God in the heavens and on earth' in Surat al-An'am understood?"
  ur: "سورۂ انعام میں «وہی اللہ ہے آسمانوں میں اور زمین میں» کو کیسے سمجھا جاتا ہے؟"
summary:
  ar: "يذكر ابن جزي في التسهيل ثلاثة أوجه في تعلق «في السماوات وفي الأرض» بالآية الثالثة من سورة الأنعام: أن يتعلق بمعنى اسم الله، أي هو الإله فيهما، ويرجحه بأنه أرجح وأفصح لأن اسم الله جامع للصفات؛ وأن يكون المعنى أنه فيهما بعلمه، ويرجحه سياق الكلام في الاطلاع والعلم؛ وأن يتعلق بمحذوف تقديره المعبود فيهما."
  en: "In al-Tashil Ibn Juzayy gives three ways of attaching 'in the heavens and on earth' in the third verse of al-An'am: to the meaning of the name 'God', i.e. He is the God in both, which he calls preferable and more eloquent because the name 'God' gathers all the attributes; that He is in them by His knowledge, which the context about His awareness and knowledge supports; and to an omitted word meaning 'the One worshipped' in them."
  ur: "ابن جزی التسہیل میں سورۂ انعام کی تیسری آیت میں «آسمانوں میں اور زمین میں» کے تعلق کی تین صورتیں بیان کرتے ہیں: اسمِ «اللہ» کے معنی سے، یعنی وہ دونوں میں معبود ہے، جسے وہ زیادہ راجح اور فصیح کہتے ہیں کیونکہ اسمِ اللہ تمام صفات کا جامع ہے؛ یہ کہ وہ ان میں اپنے علم سے ہے، جس کی تائید اطلاع و علم والا سیاق کرتا ہے؛ اور ایک محذوف لفظ سے جس کا معنی «معبود» ہے۔"
question:
  ar: "بمَ يتعلق «في السماوات وفي الأرض» في الآية، وما معناه؟"
  en: "What does 'in the heavens and on earth' attach to in the verse, and what does it mean?"
  ur: "آیت میں «آسمانوں میں اور زمین میں» کا تعلق کس سے ہے، اور اس کا کیا معنی ہے؟"
short_answer:
  ar: "يرجح ابن جزي أنه يتعلق بمعنى اسم الله فيكون المعنى: هو الإله في السماوات وفي الأرض، ويذكر أن القول بأنه فيهما بعلمه يرجحه السياق."
  en: "Ibn Juzayy prefers attaching it to the meaning of the name 'God', so the sense is 'He is the God in the heavens and on earth', and notes that the reading 'in them by His knowledge' is supported by the context."
  ur: "ابن جزی اسے اسمِ اللہ کے معنی سے متعلق کرنے کو ترجیح دیتے ہیں، یعنی «وہی آسمانوں اور زمین میں معبود ہے»، اور کہتے ہیں کہ «ان میں اپنے علم سے» والے قول کی سیاق تائید کرتا ہے۔"
