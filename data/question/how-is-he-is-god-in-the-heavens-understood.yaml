    id: name-of-god
    standing: main
    stance: { ar: "يتعلق بمعنى اسم الله: هو الإله فيهما", en: "It attaches to the name: He is the God in both", ur: "اسمِ اللہ کے معنی سے متعلق: وہ دونوں میں معبود ہے" }
    summary:
      ar: "يقول ابن جزي إن «في السماوات» يتعلق بمعنى اسم الله، فالمعنى كقوله في آية الزخرف إنه الذي في السماء إله وفي الأرض إله، كما يقال: أمير المؤمنين الخليفة في المشرق والمغرب؛ وهو عنده أرجح وأفصح، لأن اسم الله جامع للصفات كلها من العلم والقدرة والحكمة فجمعها مع الإيجاز {cite:tashil-maktaba-tijariyya-1355-j2 p.5}."
      en: "Ibn Juzayy says 'in the heavens' attaches to the meaning of the name 'God', so the sense is like the verse of al-Zukhruf that He is the One who is God in heaven and God on earth, as one says 'the Commander of the Faithful is caliph in the east and the west'; for him this is preferable and more eloquent, because the name 'God' gathers all the attributes — knowledge, power, wisdom — and so combines them with brevity {cite:tashil-maktaba-tijariyya-1355-j2 p.5}."
      ur: "ابن جزی کہتے ہیں کہ «آسمانوں میں» اسمِ اللہ کے معنی سے متعلق ہے، پس معنی سورۂ زخرف کی اس آیت کی طرح ہے کہ وہی آسمان میں معبود اور زمین میں معبود ہے، جیسے کہا جاتا ہے: امیر المؤمنین مشرق و مغرب میں خلیفہ ہیں؛ ان کے نزدیک یہ زیادہ راجح اور فصیح ہے، کیونکہ اسمِ اللہ تمام صفات — علم، قدرت، حکمت — کا جامع ہے اور یوں اختصار کے ساتھ انہیں جمع کرتا ہے {cite:tashil-maktaba-tijariyya-1355-j2 p.5}۔"
