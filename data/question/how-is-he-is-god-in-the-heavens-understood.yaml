    summary:
      ar: "وقيل يتعلق بمحذوف تقديره: المعبود في السماوات وفي الأرض، وهذا المحذوف صفة لله، واسم الله على هذا القول وعلى الأول خبر المبتدأ {cite:tashil-maktaba-tijariyya-1355-j2 p.5}."
      en: "It is also said it attaches to an omitted word meaning 'the One worshipped in the heavens and on earth', an epithet of God; on this view and the first, the name 'God' is the predicate {cite:tashil-maktaba-tijariyya-1355-j2 p.5}."
      ur: "یہ بھی کہا گیا کہ یہ ایک محذوف سے متعلق ہے جس کی تقدیر «آسمانوں اور زمین میں معبود» ہے، اور یہ محذوف اللہ کی صفت ہے؛ اس قول پر اور پہلے پر اسمِ اللہ خبر ہے {cite:tashil-maktaba-tijariyya-1355-j2 p.5}۔"
