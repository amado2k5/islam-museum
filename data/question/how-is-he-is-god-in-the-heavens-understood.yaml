  - tradition: sunni
    id: by-knowledge
    standing: secondary
    stance: { ar: "هو فيهما بعلمه", en: "He is in them by His knowledge", ur: "وہ ان میں اپنے علم سے ہے" }
    summary:
      ar: "وقيل المعنى أنه في السماوات والأرض بعلمه، كقوله في سورة الحديد إنه معكم أينما كنتم؛ ويقول ابن جزي إن هذا يترجح بأن سياق الكلام في اطلاع الله وعلمه، لقوله بعدها إنه يعلم سركم وجهركم {cite:tashil-maktaba-tijariyya-1355-j2 p.5}."
      en: "It is also said the meaning is that He is in the heavens and the earth by His knowledge, like the verse of al-Hadid that He is with you wherever you are; Ibn Juzayy says this is supported by the context, which is about God's awareness and knowledge, since the verse goes on to say He knows what you conceal and what you reveal {cite:tashil-maktaba-tijariyya-1355-j2 p.5}."
      ur: "یہ بھی کہا گیا کہ معنی یہ ہے کہ وہ آسمانوں اور زمین میں اپنے علم سے ہے، جیسے سورۂ حدید کی آیت کہ وہ تمہارے ساتھ ہے جہاں بھی تم ہو؛ ابن جزی کہتے ہیں کہ اس کی تائید سیاق سے ہوتی ہے جو اللہ کی اطلاع اور علم کے بارے میں ہے، کیونکہ آیت آگے کہتی ہے کہ وہ تمہارا چھپا اور کھلا جانتا ہے {cite:tashil-maktaba-tijariyya-1355-j2 p.5}۔"
