id: question/akhdh-al-ujra-ala-al-tahdith
class: question
label:
  ar: "هل يجوز أخذ الأجرة على رواية الحديث؟"
  en: "May a transmitter take payment for teaching hadith?"
summary:
  ar: "مسألة في آداب الرواية جمع فيها الخطيب البغدادي في «الكفاية» بابين: باب «كراهة أخذ الأجر على التحديث ومن قال لا يُسمع من فاعل ذلك»، ونقل فيه عن الحسن وحماد بن سلمة وأبي العالية وإسحاق بن راهويه وأحمد بن حنبل وأبي حاتم المنع أو ترك الكتابة عن الآخذ؛ وباب «ذكر بعض أخبار من كان يأخذ العوض على التحديث»، وذكر فيه أن غير واحد من السلف ترخص فيه. وعلّل المنع بتنزيه الراوي عن سوء الظن، لأن بعض الآخذين عُثر على تزيّده وادعائه ما لم يسمع لأجل ما كان يُعطى {cite:kifaya-khatib-hyderabad-1357 p. 153-156}."
  en: "A question of the ethics of transmission on which al-Khatib al-Baghdadi gathers two chapters in al-Kifaya: one on 'the dislike of taking payment for teaching hadith, and those who said one should not hear from a man who does so', citing al-Hasan, Hammad ibn Salama, Abu al-Aliya, Ishaq ibn Rahawayh, Ahmad ibn Hanbal and Abu Hatim; and one recording those who took compensation, noting that several early scholars allowed it. He explains the prohibition as protecting the transmitter from suspicion, since some who took payment were found adding to their reports and claiming what they had not heard for the sake of what they were given."
wings: [ideas, words]
themes: [scripture-and-its-sciences, education, ethics-and-character]
question:
  ar: "هل يُكتب الحديث عمن يأخذ أجراً على التحديث؟"
  en: "Should hadith be written from someone who takes payment for teaching it?"
issue:
  ar: "حكم أخذ الأجرة على رواية الحديث وأثره في قبول رواية الآخذ."
  en: "The ruling on taking payment for narrating hadith, and its effect on accepting the narrator."
short_answer:
  ar: "كرهه جماعة من السلف ومنعوا الكتابة عن الآخذ، منهم إسحاق بن راهويه وأحمد وأبو حاتم، وترخص فيه آخرون، فأُثر عن طاوس ومجاهد وأبي نعيم الفضل بن دكين أخذ العوض؛ ويرى الخطيب أن المنع تنزيه للراوي عن سوء الظن."
  en: "A number of early scholars disliked it and refused to write from a narrator who took payment, among them Ishaq ibn Rahawayh, Ahmad and Abu Hatim; others allowed it, and taking compensation is reported of Tawus, Mujahid and Abu Nu'aym al-Fadl ibn Dukayn; al-Khatib sees the prohibition as protecting the narrator from suspicion."
perspectives:
  - tradition: sunni
    id: sunni-man
    standing: main
    stance: { ar: "يُكره، ولا يُكتب عن الآخذ", en: "Disliked; one does not write from the narrator who takes payment" }
    summary:
      ar: "ردّ الحسن الهدية لما جلس يحدّث؛ وخيّر حماد بن سلمة تلميذه بين قبول هديته وترك تحديثه أو تحديثه ورد الهدية؛ وعن أبي العالية: علّم مجاناً كما عُلّمت مجاناً؛ وقال إسحاق بن راهويه وأبو حاتم: لا يُكتب عنه، وقال أحمد: لا ولا كرامة؛ وشكا سليمان بن حرب من فساد القضاء والحديث بأخذ المحدثين الدراهم؛ ويعلل الخطيب المنع بتنزيه الراوي عن سوء الظن، لأن بعض الآخذين عُثر على تزيّده."
      en: "Al-Hasan returned a gift when he sat to teach; Hammad ibn Salama made a student choose between his gift being accepted and no more teaching, or teaching and the gift returned; Abu al-Aliya: teach freely as you were taught freely; Ishaq ibn Rahawayh and Abu Hatim: one does not write from him, and Ahmad: no, and no honour; Sulayman ibn Harb lamented that judgeship and hadith were both corrupted, the traditionists taking dirhams; al-Khatib explains the prohibition as shielding the narrator from suspicion, since some who took payment were found adding to their reports."
