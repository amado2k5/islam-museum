id: question/akhdh-al-ujra-ala-al-tahdith
class: question
label:
  ar: "هل يجوز أخذ الأجرة على رواية الحديث؟"
  en: "May a transmitter take payment for teaching hadith?"
  es: "¿Puede un transmisor recibir un pago por enseñar hadices?"
  fr: "Un transmetteur peut-il être rémunéré pour l'enseignement des hadiths ?"
  ur: "کیا کوئی ٹرانسمیٹر حدیث پڑھانے کے لیے ادائیگی لے سکتا ہے؟"
summary:
  ar: "مسألة في آداب الرواية جمع فيها الخطيب البغدادي في «الكفاية» بابين: باب «كراهة أخذ الأجر على التحديث ومن قال لا يُسمع من فاعل ذلك»، ونقل فيه عن الحسن وحماد بن سلمة وأبي العالية وإسحاق بن راهويه وأحمد بن حنبل وأبي حاتم المنع أو ترك الكتابة عن الآخذ؛ وباب «ذكر بعض أخبار من كان يأخذ العوض على التحديث»، وذكر فيه أن غير واحد من السلف ترخص فيه. وعلّل المنع بتنزيه الراوي عن سوء الظن، لأن بعض الآخذين عُثر على تزيّده وادعائه ما لم يسمع لأجل ما كان يُعطى {cite:kifaya-khatib-hyderabad-1357 p. 153-156}."
  en: "A question of the ethics of transmission on which al-Khatib al-Baghdadi gathers two chapters in al-Kifaya: one on 'the dislike of taking payment for teaching hadith, and those who said one should not hear from a man who does so', citing al-Hasan, Hammad ibn Salama, Abu al-Aliya, Ishaq ibn Rahawayh, Ahmad ibn Hanbal and Abu Hatim; and one recording those who took compensation, noting that several early scholars allowed it. He explains the prohibition as protecting the transmitter from suspicion, since some who took payment were found adding to their reports and claiming what they had not heard for the sake of what they were given."
  es: "La cuestión de la ética de la transmisión es abordada por al-Khatib al-Baghdadi en dos capítulos de al-Kifaya: uno sobre «la aversión a recibir pago por enseñar hadices y quienes afirmaron que no se debe escuchar a quien lo hace», citando a al-Hasan, Hammad ibn Salama, Abu al-Aliya, Ishaq ibn Rahawayh, Ahmad ibn Hanbal y Abu Hatim; y otro que recoge a quienes aceptaban compensación, señalando que varios eruditos antiguos lo permitían. Explica la prohibición como una forma de proteger al transmisor de la sospecha, ya que algunos que recibían pago fueron descubiertos añadiendo información a sus relatos y afirmando haber oído cosas que no habían escuchado, solo por lo que habían recibido."
  fr: "Al-Khatib al-Baghdadi consacre deux chapitres de son ouvrage al-Kifaya à la question de l'éthique de la transmission du hadith: le premier traite de la réticence à accepter une rémunération pour l'enseignement de ce texte, et de ceux qui affirment qu'il ne faut pas écouter un homme qui le fait, citant al-Hasan, Hammad ibn Salama, Abu al-Aliya, Ishaq ibn Rahawayh, Ahmad ibn Hanbal et Abu Hatim; le second recense ceux qui ont perçu une compensation, en précisant que plusieurs savants des premiers temps l'ont autorisée. Il explique cette interdiction par la nécessité de protéger le transmetteur de tout soupçon, car certains de ceux qui acceptaient une rémunération complétaient leurs récits et prétendaient avoir entendu ce qu'ils n'avaient pas entendu, uniquement pour obtenir gain de cause."
  ur: "نشر کی اخلاقیات کا ایک سوال جس پر الخطیب البغدادی نے الکفایہ میں دو ابواب جمع کیے ہیں: ایک 'حدیث پڑھانے کے لیے معاوضہ لینے کی ناپسندیدگی، اور وہ لوگ جو کہتے ہیں کہ ایسا کرنے والے شخص سے نہیں سننا چاہیے'، الحسن، حماد بن سلمہ، ابو العالیہ، اسحاق بن حنبل، ابو حنبل، اور ابو حنبل کا حوالہ دیتے ہوئے اور ایک نے ان لوگوں کو ریکارڈ کیا جنہوں نے معاوضہ لیا، نوٹ کرتے ہوئے کہ کئی ابتدائی علماء نے اس کی اجازت دی۔ وہ ٹرانسمیٹر کو شک سے بچانے کے طور پر ممانعت کی وضاحت کرتا ہے، کیونکہ کچھ جنہوں نے ادائیگی کی تھی وہ اپنی رپورٹوں میں اضافہ کرتے ہوئے پائے گئے تھے اور دعوی کرتے تھے کہ انہوں نے جو کچھ دیا گیا تھا اس کی خاطر انہوں نے نہیں سنا تھا۔"
wings: [ideas, words]
