    stance: { ar: "ترخّص فيه غير واحد من السلف", en: "Several early scholars allowed it" }
    summary:
      ar: "حمل طاوس عكرمة على نجيب ثمنه ستون ديناراً وقال: ألا أشتري علم هذا العبد بستين ديناراً؟ وكان مجاهد يكلّف طالبه عملاً ثم يحدّثه؛ وكان أبو نعيم الفضل بن دكين يأخذ الدراهم الصحاح ويأخذ صرفاً على المكسّرة؛ وكان يعقوب بن إبراهيم لا يحدّث بحديث بعينه إلا بدينار، كما يحكي النسائي."
      en: "Tawus mounted Ikrima on a thoroughbred camel worth sixty dinars, saying: shall I not buy this slave's learning for sixty dinars? Mujahid would give a student a task and then teach him; Abu Nu'aym al-Fadl ibn Dukayn took sound dirhams and charged an exchange fee on broken ones; Ya'qub ibn Ibrahim would narrate a particular hadith only for a dinar, as al-Nasa'i relates."
