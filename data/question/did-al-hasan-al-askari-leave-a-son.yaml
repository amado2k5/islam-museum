    summary: { ar: "في نقل ابن تيمية: يقول الحلي إن ولد الحسن العسكري هو المهدي محمد، ويروي عن ابن الجوزي بإسناده إلى ابن عمر حديث «يخرج في آخر الزمان رجل من ولدي اسمه كاسمي وكنيته كنيتي يملأ الأرض عدلاً كما ملئت جوراً»؛ ويحكي ابن تيمية أن الإمامية يقولون إنه دخل السرداب بسامرا صغيراً، واختلفوا في سنه: سنتان أو ثلاث أو خمس. ويورد المحقق في الحاشية رواية الكليني في الكافي لما جرى عند وفاة الحسن العسكري.", en: "As Ibn Taymiyya reports: al-Hilli says that al-Hasan al-Askari's son is the Mahdi Muhammad, and relates from Ibn al-Jawzi, with his chain to Ibn Umar, the hadith 'A man of my descendants will come forth at the end of time; his name is my name and his kunya my kunya; he will fill the earth with justice as it was filled with injustice'. Ibn Taymiyya relates that the Imamiyya say he entered the cellar at Samarra as a child, differing on his age – two, three or five years. In a footnote the editor gives al-Kulayni's account in al-Kafi of what happened at al-Hasan al-Askari's death.", ur: "ابن تیمیہ کی نقل میں: حلی کہتے ہیں کہ حسن عسکری کے بیٹے ہی مہدی محمد ہیں، اور ابن الجوزی سے ان کی سند کے ساتھ ابن عمر کی حدیث روایت کرتے ہیں: «آخر زمانے میں میری اولاد میں سے ایک شخص نکلے گا جس کا نام میرا نام اور کنیت میری کنیت ہوگی، وہ زمین کو عدل سے بھر دے گا جیسے وہ ظلم سے بھری ہوگی»۔ ابن تیمیہ بیان کرتے ہیں کہ امامیہ کہتے ہیں کہ وہ بچپن میں سامرا کے سرداب میں داخل ہوئے، اور ان کی عمر میں اختلاف کرتے ہیں: دو، تین یا پانچ سال۔ محقق نے حاشیے میں حسن عسکری کی وفات کے وقت کے واقعات کے بارے میں کلینی کی الکافی والی روایت درج کی ہے۔" }
