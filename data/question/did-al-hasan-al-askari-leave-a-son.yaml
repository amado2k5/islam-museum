id: question/did-al-hasan-al-askari-leave-a-son
class: question
label: { ar: "هل أعقب الحسن العسكري؟ المهدي المنتظر عند الإمامية في منهاج السنة", en: "Did al-Hasan al-Askari leave a son? The awaited Mahdi of the Imamiyya in Minhaj al-Sunna", ur: "کیا حسن عسکری کی اولاد تھی؟ منہاج السنہ میں امامیہ کے مہدیِ منتظر" }
summary:
  ar: "ذكر ابن المطهر الحلي أن الإمام الثاني عشر محمد بن الحسن هو المهدي الموعود في الحديث، فردّ ابن تيمية بأن الطبري وعبد الباقي بن قانع وغيرهما من أهل الأنساب ذكروا أن الحسن العسكري لم يكن له نسل، وبأن صبياً يتيماً لا يكون إماماً معصوماً، وبأن غيبته لم يحصل بها شيء من مقاصد الإمامة، وبأن بقاءه هذه المدة خلاف العادة."
  en: "Ibn al-Mutahhar al-Hilli stated that the twelfth imam, Muhammad ibn al-Hasan, is the Mahdi promised in the hadith. Ibn Taymiyya replied that al-Tabari, Abd al-Baqi ibn Qani' and other genealogists and historians recorded that al-Hasan al-Askari had no offspring; that an orphaned child cannot be an infallible imam; that his occultation achieved none of the purposes of the imamate; and that his living so long contradicts the course of nature."
  ur: "ابن المطہر حلی نے کہا کہ بارہویں امام محمد بن حسن ہی وہ مہدی ہیں جن کا حدیث میں وعدہ ہے؛ ابن تیمیہ نے جواب دیا کہ طبری، عبد الباقی بن قانع اور دوسرے ماہرینِ انساب و تاریخ نے ذکر کیا کہ حسن عسکری کی کوئی اولاد نہ تھی، ایک یتیم بچہ معصوم امام نہیں ہو سکتا، اس کی غیبت سے امامت کا کوئی مقصد حاصل نہیں ہوا، اور اتنی مدت تک اس کا زندہ رہنا عادت کے خلاف ہے۔"
question: { ar: "هل أعقب الحسن العسكري، وهل ابنه هو المهدي المنتظر؟", en: "Did al-Hasan al-Askari leave a son, and is that son the awaited Mahdi?", ur: "کیا حسن عسکری کا بیٹا تھا، اور کیا وہی مہدیِ منتظر ہے؟" }
issue:
  ar: "هل ثبت للحسن العسكري ولد، وهل يصح أن يكون الإمام المعصوم صبياً غائباً، وهل ينطبق حديث المهدي على محمد بن الحسن؟"
  en: "Is it established that al-Hasan al-Askari had a son, can the infallible imam be an absent child, and does the Mahdi hadith apply to Muhammad ibn al-Hasan?"
  ur: "کیا حسن عسکری کا بیٹا ہونا ثابت ہے، کیا معصوم امام غائب بچہ ہو سکتا ہے، اور کیا حدیثِ مہدی محمد بن حسن پر صادق آتی ہے؟"
short_answer:
  ar: "ابن تيمية (أهل السنة): لم يعقب الحسن العسكري عند أهل الأنساب، والمنتظر لا وجود له أو لا منفعة فيه. الإمامية كما ينقلهم: ولده محمد المهدي هو الموعود في حديث «يخرج في آخر الزمان رجل من ولدي»، وقد دخل السرداب بسامرا صغيراً."
  en: "Ibn Taymiyya (Sunni): according to the genealogists al-Hasan al-Askari left no son; the awaited one either does not exist or is of no benefit. The Imamiyya as he reports them: his son Muhammad al-Mahdi is the one promised in the hadith 'A man of my descendants will come forth at the end of time', and he entered the cellar at Samarra as a child."
  ur: "ابن تیمیہ (اہلِ سنت): ماہرینِ انساب کے مطابق حسن عسکری کا کوئی بیٹا نہ تھا؛ منتظر یا موجود ہی نہیں یا اس میں کوئی فائدہ نہیں۔ امامیہ، جیسا وہ نقل کرتے ہیں: ان کے بیٹے محمد مہدی ہی حدیث «آخر زمانے میں میری اولاد میں سے ایک شخص نکلے گا» کے موعود ہیں، اور وہ بچپن میں سامرا کے سرداب میں داخل ہوئے۔"
