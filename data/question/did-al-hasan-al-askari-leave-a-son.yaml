    summary: { ar: "يحتج ابن تيمية بما ذكره الطبري وابن قانع، وبأن الطفل اليتيم يستحق الحضانة والحجر في ماله بنص القرآن فكيف يكون إماماً معصوماً، وبأن المؤمنين به لم ينتفعوا به في دين ولا دنيا، وبأن الظلم كان في زمن آبائه ولم يحتجبوا، وبأن أحداً لا يُعرف ولد في الإسلام وعاش مائة وعشرين سنة، مستدلاً بحديث انخرام القرن على رأس مائة سنة.", en: "Ibn Taymiyya argues from what al-Tabari and Ibn Qani' recorded; that an orphaned child is owed custody and the restriction of his property by the text of the Qur'an, so how could he be an infallible imam; that those who believe in him have gained nothing from him in religion or worldly life; that there was injustice in his forefathers' time and they did not go into hiding; and that no one is known to have been born in Islam and lived a hundred and twenty years, citing the hadith that the generation would be gone at the head of a hundred years.", ur: "ابن تیمیہ طبری اور ابن قانع کے بیان سے دلیل لیتے ہیں؛ اور یہ کہ یتیم بچہ قرآن کی نص کے مطابق حضانت اور اپنے مال میں حجر کا مستحق ہے تو وہ معصوم امام کیسے ہو سکتا ہے؛ اس پر ایمان رکھنے والوں کو اس سے نہ دین میں فائدہ ہوا نہ دنیا میں؛ اس کے آبا کے زمانے میں بھی ظلم تھا اور وہ روپوش نہیں ہوئے؛ اور اسلام میں پیدا ہونے والا کوئی شخص ایک سو بیس سال جیتا معلوم نہیں، اور اس پر سو سال کے سرے پر نسل کے ختم ہونے کی حدیث سے استدلال کرتے ہیں۔" }
