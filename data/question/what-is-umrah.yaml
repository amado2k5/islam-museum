long_answer:
  ar: 'العمرة هي زيارة [[building/masjid-al-haram|المسجد الحرام]] في أي وقت من السنة: إحرام من الميقات،
    فطواف حول الكعبة، فسعي بين الصفا والمروة، فتقصير أو حلق. تسمى الحج الأصغر لأنها تقتصر على هذه الأعمال
