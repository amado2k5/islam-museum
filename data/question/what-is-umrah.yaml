id: question/what-is-umrah
class: question
label:
  ar: ما العمرة؟
  en: What is umrah?
  es: "¿Qué es la Umrah?"
  fr: "Qu'est-ce que la umra ?"
  ur: "عمرہ کیا ہے؟"
  tr: "Umre nedir?"
  id: "Apa itu Umrah?"
summary:
  ar: العمرة هي زيارة البيت الحرام بالإحرام والطواف والسعي والتقصير في أي وقت من السنة، وتسمى الحج الأصغر.
  en: Umrah is visiting the Sacred House with ihram, tawaf, sai and taqsir, at any time of the year, and it is called the lesser hajj.
  es: "La Umrah consiste en visitar la Casa Sagrada con ihram, tawaf, sai y taqsir, en cualquier época del año, y se la conoce como el Hajj menor."
  fr: "La Omra consiste à visiter la Maison Sacrée avec l'ihram, le tawaf, le sa'i et le taqsir, à n'importe quel moment de l'année, et elle est appelée le petit hajj."
  ur: "عمرہ سال کے کسی بھی وقت احرام، طواف، سعی اور تعزیرات کے ساتھ بیت المقدس کی زیارت کرنا ہے اور اسے چھوٹا حج کہا جاتا ہے۔"
  tr: "Umre, İhram, Tevaf, Sey'i yaparak ve yılın herhangi bir zamanında saçını kısaltarak kutsal evi ziyaret etmektir ve buna Küçük Hac denir."
  id: "Umrah adalah kunjungan ke Rumah Suci dengan memasuki Ihram, Tawaf, Sa'i, dan memendekkan rambut kapan saja sepanjang tahun, dan disebut Haji Kecil."
question:
  ar: ما العمرة؟
short_answer:
  ar: العمرة هي زيارة البيت الحرام بالإحرام والطواف والسعي والتقصير في أي وقت من السنة، وتسمى الحج الأصغر.
long_answer:
  ar: 'العمرة هي زيارة [[building/masjid-al-haram|المسجد الحرام]] في أي وقت من السنة: إحرام من الميقات،
    فطواف حول الكعبة، فسعي بين الصفا والمروة، فتقصير أو حلق. تسمى الحج الأصغر لأنها تقتصر على هذه الأعمال
    دون الوقوف بعرفة. {cite:wikidata}'
