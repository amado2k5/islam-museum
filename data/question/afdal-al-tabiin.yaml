      ar: "عن أحمد بن حنبل: أفضل التابعين ابن المسيب، فلما قيل له: فعلقمة والأسود؟ قال: هو وهما؛ وهو قول أهل المدينة فيما حكاه ابن خفيف."
      en: "Ahmad ibn Hanbal: the best Successor is Ibn al-Musayyab; asked about Alqama and al-Aswad he said: he and they; this is also the Medinan view as Ibn Khafif reports it."
