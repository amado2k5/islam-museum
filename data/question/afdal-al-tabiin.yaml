question:
  ar: "أيّ التابعين أفضل؟"
  en: "Which of the Successors was the most excellent?"
issue:
  ar: "اختلاف الأقوال في تفضيل بعض التابعين على بعض، وأثر حديث أويس في المسألة."
  en: "The differing views on ranking the Successors, and the bearing of the hadith about Uways on the question."
short_answer:
  ar: "عن أحمد: ابن المسيب، وعنه غيره؛ وعند أهل المدينة ابن المسيب، وعند أهل الكوفة أويس، وعند أهل البصرة الحسن؛ ورجّح العراقي أويساً لحديث مسلم، وفرّق البلقيني بين الأفضلية في الزهد والورع (أويس) والأفضلية في حفظ الحديث والأثر (سعيد)."
  en: "From Ahmad: Ibn al-Musayyab, with other reports; for Medina Ibn al-Musayyab, for Kufa Uways, for Basra al-Hasan; al-Iraqi preferred Uways on the strength of Muslim's hadith, and al-Bulqini distinguished excellence in asceticism and scrupulousness (Uways) from excellence in preserving hadith and reports (Sa'id)."
