id: question/afdal-al-tabiin
class: question
label:
  ar: "من أفضل التابعين؟"
  en: "Who was the best of the Successors?"
summary:
  ar: "مسألة يجمع السيوطي أقوالها في «تدريب الراوي»: عن أحمد أن أفضلهم سعيد بن المسيب، وعنه أقوال أخرى في قيس وأبي عثمان النهدي وعلقمة ومسروق؛ وحكى ابن خفيف أن أهل المدينة يقولون ابن المسيب، وأهل الكوفة أويس القرني، وأهل البصرة الحسن، واستحسنه ابن الصلاح؛ ورجّح العراقي قول الكوفيين لحديث عمر في صحيح مسلم في أويس، وجمع البلقيني بأن الأفضل في الزهد والورع أويس وفي حفظ الخبر والأثر سعيد {cite:tadrib-rawi-awwama-v5 p. 257-260}."
  en: "A question whose views al-Suyuti gathers in Tadrib al-Rawi: Ahmad is reported to have named Sa'id ibn al-Musayyab as the best, with other reports from him naming Qays, Abu Uthman al-Nahdi, Alqama and Masruq; Ibn Khafif reported that the people of Medina said Ibn al-Musayyab, those of Kufa Uways al-Qarani and those of Basra al-Hasan, which Ibn al-Salah approved; al-Iraqi preferred the Kufan view because of Umar's hadith about Uways in Sahih Muslim, and al-Bulqini reconciled them: best in asceticism and scrupulousness Uways, best in preserving reports Sa'id."
