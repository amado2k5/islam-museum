id: question/afdal-al-tabiin
class: question
label:
  ar: "من أفضل التابعين؟"
  en: "Who was the best of the Successors?"
  es: "¿Quién fue el mejor de los sucesores?"
  fr: "Qui était le meilleur des Successeurs ?"
  ur: "جانشینوں میں سب سے بہتر کون تھا؟"
  tr: "En iyi takipçiler kimler?"
  id: "Siapa pengikut terbaik?"
summary:
  ar: "مسألة يجمع السيوطي أقوالها في «تدريب الراوي»: عن أحمد أن أفضلهم سعيد بن المسيب، وعنه أقوال أخرى في قيس وأبي عثمان النهدي وعلقمة ومسروق؛ وحكى ابن خفيف أن أهل المدينة يقولون ابن المسيب، وأهل الكوفة أويس القرني، وأهل البصرة الحسن، واستحسنه ابن الصلاح؛ ورجّح العراقي قول الكوفيين لحديث عمر في صحيح مسلم في أويس، وجمع البلقيني بأن الأفضل في الزهد والورع أويس وفي حفظ الخبر والأثر سعيد {cite:tadrib-rawi-awwama-v5 p. 257-260}."
  en: "A question whose views al-Suyuti gathers in Tadrib al-Rawi: Ahmad is reported to have named Sa'id ibn al-Musayyab as the best, with other reports from him naming Qays, Abu Uthman al-Nahdi, Alqama and Masruq; Ibn Khafif reported that the people of Medina said Ibn al-Musayyab, those of Kufa Uways al-Qarani and those of Basra al-Hasan, which Ibn al-Salah approved; al-Iraqi preferred the Kufan view because of Umar's hadith about Uways in Sahih Muslim, and al-Bulqini reconciled them: best in asceticism and scrupulousness Uways, best in preserving reports Sa'id."
  es: "Una cuestión cuyas opiniones al-Suyuti reúne en Tadrib al-Rawi: se dice que Ahmad nombró a Sa'id ibn al-Musayyab como el mejor, con otros informes suyos que nombran a Qays, Abu Uthman al-Nahdi, Alqama y Masruq; Ibn Khafif informó que la gente de Medina dijo Ibn al-Musayyab, los de Kufa Uways al-Qarani y los de Basra al-Hasan, lo cual Ibn al-Salah aprobó; al-Iraqi prefirió la opinión de Kufa debido al hadiz de Umar sobre Uways en Sahih Muslim, y al-Bulqini los reconcilió: el mejor en ascetismo y escrupulosidad Uways, el mejor en preservar informes Sa'id."
  fr: "Une question dont al-Suyuti rassemble les points de vue dans Tadrib al-Rawi: Ahmad aurait désigné Sa'id ibn al-Musayyab comme le meilleur, tandis que d'autres sources le citent Qays, Abu Uthman al-Nahdi, Alqama et Masruq; Ibn Khafif rapporte que les habitants de Médine citaient Ibn al-Musayyab, ceux de Koufa Uways al-Qarani et ceux de Bassora al-Hasan, opinion approuvée par Ibn al-Salah; al-Iraqi privilégiait l'avis de Koufa en raison du hadith d'Umar concernant Uways dans Sahih Muslim, et al-Bulqini les a conciliés: Uways était le meilleur en ascétisme et en scrupulosité, Sa'id le meilleur pour la préservation des récits."
  ur: "ایک سوال جس کے خیالات السیوطی نے تدریب الراوی میں جمع کیے ہیں: احمد کے بارے میں منقول ہے کہ انہوں نے سعید بن المسیب کو سب سے افضل قرار دیا ہے، ان سے دیگر روایتوں میں قیس، ابو عثمان النہدی، علقمہ اور مسروق کا نام لیا گیا ہے۔ ابن خفیف نے بیان کیا کہ مدینہ والوں نے ابن المسیب، کوفہ اویس القرانی اور بصرہ الحسن والوں نے کہا، جسے ابن الصلاح نے منظور کیا۔ عراقی نے صحیح مسلم میں اویس کے بارے میں عمر کی حدیث کی وجہ سے کوفان کے نقطہ نظر کو ترجیح دی، اور البقینی نے ان کے ساتھ صلح کی: سب سے بہتر عیاشی اور بے حیائی میں اویس، روایتوں کو محفوظ کرنے میں سب سے بہتر۔"
  tr: "El-Suyuti'nin 'Tadrib al-Rawi'de derlediği bir soru: Ahmed, aralarında en iyisinin Seyid bin Musayyib olduğunu ve Kays, Ebu Osman el-Nahdi, Alkama ve Mesruk hakkında kendisinden diğer görüşler olduğunu anlatmıştır; İbn Khafif ise Medine halkının İbn el-Museyyib, Kufe halkının Uways al-Qarni, Basra halkının ise el-Hasan dediğini ve İbn el-Salah'ın bunu onayladığını anlatmıştır. El-Iraqi, Emümar'ın hadislerine Kufanların Sev'deki Sahih Muslim in Uways'teki görüşünü tercih etmiş, el-Balqini, en iyi asketizm ve takvanın Uways' olduğunu, haber ve gelenekleri ezberlemede ise Sa'id olduğunu (cite:tadrib-rawi-awwama-v5 s. 257-260} derlemiştir."
  id: "Sebuah pertanyaan yang disusun al-Suyuti dalam 'Tadrib al-Rawi': Ahmad mengatakan yang terbaik di antara mereka adalah Sa'id ibn al-Musayyib, dan pendapat lain darinya mengenai Qays, Abu Uthman al-Nahdi, Alqama, dan Masruq; Ibn Khafif menceritakan bahwa masyarakat Madinah mengucapkan Ibn al-Musayyib, masyarakat Kufa mengatakan Uways al-Qarni, dan rakyat Basra mengatakan al-Hasan, dan Ibn al-Salah menyetujuinya. Al-Iraqi lebih memilih pandangan Kufan tentang hadits Umar dalam Sahih Muslim dalam Uways, dan al-Balqini menyusun bahwa yang terbaik dalam asketisme dan kesalehan adalah Uways, dan dalam menghafal laporan serta tradisi adalah Sa'id {cite:tadrib-rawi-awwama-v5 hlm. 257-260}."
