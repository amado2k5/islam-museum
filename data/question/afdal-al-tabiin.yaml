    id: sunni-uways
    standing: main
    stance: { ar: "أويس القرني", en: "Uways al-Qarani" }
    summary:
      ar: "قول أهل الكوفة فيما حكاه ابن خفيف؛ وقال العراقي: الصحيح بل الصواب ما ذهب إليه أهل الكوفة، لحديث عمر في صحيح مسلم: «إن خير التابعين رجل يقال له أويس»، وهذا قاطع للنزاع عنده، وحمل تفضيل أحمد لغيره على أنه لعله لم يبلغه الحديث أو لم يصح عنده أو أراد الأفضلية في العلم. ويرى المحقق عوامة أن أحمد روى الحديث في مسنده، فيتعين الاحتمال الأخير."
      en: "The Kufan view as Ibn Khafif reports it; al-Iraqi said the correct, indeed the right, view is the Kufans', because of Umar's hadith in Sahih Muslim: 'The best of the Successors is a man called Uways', which for him settles the dispute; he explained Ahmad's other preference as perhaps not having received the hadith, or not finding it sound, or meaning excellence in knowledge. The editor Awwama notes that Ahmad himself narrates the hadith in his Musnad, so only the last explanation stands."
