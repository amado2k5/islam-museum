      ar: "قال البلقيني: الأحسن أن يقال: الأفضل من حيث الزهد والورع أويس، ومن حيث حفظ الخبر والأثر سعيد؛ ويرى عوامة أن التفرقة بين الأفضلية والخيرية هي المتعينة، وينقل قول الذهبي في أويس: ليس في التابعين أحد أفضل منه، وأما أن يكون أحد مثله في الفضل فيمكن كسعيد بن المسيب."
      en: "Al-Bulqini: it is best to say that in asceticism and scrupulousness the best is Uways, and in preserving reports Sa'id; Awwama holds that distinguishing excellence from goodness is the right course, and quotes al-Dhahabi on Uways: no Successor is better than he, though another may equal him in merit, such as Sa'id ibn al-Musayyab."
