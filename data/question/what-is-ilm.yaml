label:
  ar: "ما العلم في الإسلام؟"
  en: What is knowledge in Islam?
summary:
  ar: "العلم في الإسلام باب واسع من أبواب الفضل: طلبه فريضة في مشهور الأثر، وعظّم القرآن أهله في قوله عن رفع أهل العلم درجات."
  en: "Knowledge in Islam is a broad gate of virtue. Seeking it is an obligation according to a well-known report, and the Qur'an honoured its people when it spoke of God raising those who have knowledge in rank."
