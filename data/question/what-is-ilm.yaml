id: question/what-is-ilm
class: question
label:
  ar: "ما العلم في الإسلام؟"
  en: What is knowledge in Islam?
  es: "¿Qué es el conocimiento en el Islam?"
  fr: "Qu'est-ce que la connaissance en Islam ?"
summary:
  ar: "العلم في الإسلام باب واسع من أبواب الفضل: طلبه فريضة في مشهور الأثر، وعظّم القرآن أهله في قوله عن رفع أهل العلم درجات."
  en: "Knowledge in Islam is a broad gate of virtue. Seeking it is an obligation according to a well-known report, and the Qur'an honoured its people when it spoke of God raising those who have knowledge in rank."
  es: "En el Islam, el conocimiento es una amplia puerta de virtud. Buscarlo es una obligación según un relato bien conocido, y el Corán honró a su pueblo cuando habló de que Dios eleva a quienes poseen conocimiento."
  fr: "En islam, la connaissance est une voie royale vers la vertu. La rechercher est une obligation, selon un hadith bien connu, et le Coran honore les musulmans en évoquant la manière dont Dieu élève en rang ceux qui possèdent le savoir."
