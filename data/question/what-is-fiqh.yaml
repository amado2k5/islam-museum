question:
  ar: ما الفقه؟
short_answer:
  ar: الفقه هو علم تفريع الأحكام العملية من أدلتها؛ تبلور في مذاهب كبرى منها الحنفي والمالكي والشافعي
    والحنبلي والجعفري.
long_answer:
  ar: الفقه هو علم استنباط الأحكام الشرعية العملية من أدلتها التفصيلية؛ صنّفه فقهاء الإسلام في كتب العبادات
    والمعاملات والأحوال والقضاء. ونشأت فيه مذاهب فقهية اجتهادية متداولة إلى اليوم منها الحنفي والمالكي
    والشافعي والحنبلي، وعند الشيعة الجعفري والزيدي والإباضي. {cite:wikidata}
