id: question/what-is-fiqh
class: question
label:
  ar: ما الفقه؟
  en: What is fiqh?
  es: "¿Qué es el fiqh?"
summary:
  ar: الفقه هو علم تفريع الأحكام العملية من أدلتها؛ تبلور في مذاهب كبرى منها الحنفي والمالكي والشافعي
    والحنبلي والجعفري.
  en: "Fiqh is the science of deriving practical rulings from their evidence. It took shape in major schools of law, among them the Hanafi, Maliki, Shafi'i, Hanbali and Ja'fari schools."
  es: "El fiqh es la ciencia de derivar dictámenes prácticos a partir de las pruebas. Se desarrolló en las principales escuelas jurídicas, entre ellas la hanafi, la malikí, la shafi'i, la hanbali y la jafari."
question:
  ar: ما الفقه؟
short_answer:
  ar: الفقه هو علم تفريع الأحكام العملية من أدلتها؛ تبلور في مذاهب كبرى منها الحنفي والمالكي والشافعي
    والحنبلي والجعفري.
long_answer:
  ar: الفقه هو علم استنباط الأحكام الشرعية العملية من أدلتها التفصيلية؛ صنّفه فقهاء الإسلام في كتب العبادات
    والمعاملات والأحوال والقضاء. ونشأت فيه مذاهب فقهية اجتهادية متداولة إلى اليوم منها الحنفي والمالكي
    والشافعي والحنبلي، وعند الشيعة الجعفري والزيدي والإباضي. {cite:wikidata}
