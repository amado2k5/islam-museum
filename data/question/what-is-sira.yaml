id: question/what-is-sira
class: question
label:
  ar: "ما السيرة النبوية؟"
  en: What is the Prophetic sira?
  es: "¿Qué es la sira profética?"
  fr: "Qu'est-ce que la sira prophétique ?"
  ur: "سیرت نبوی کیا ہے؟"
  tr: "Peygamberlik biyografisi nedir?"
  id: "Apa itu biografi Prophetic?"
summary:
  ar: "السيرة النبوية علم أخبار حياة النبي من مولده إلى وفاته، ومن أقدم كتبها سيرة ابن هشام المروية عن ابن إسحاق."
  en: The Prophetic sira is the science of reports on the life of the Prophet from his birth to his death. One of its oldest books is the Sira of Ibn Hisham, transmitted on the authority of Ibn Ishaq.
  es: "La sira profética es la ciencia que recopila relatos sobre la vida del Profeta desde su nacimiento hasta su muerte. Uno de sus libros más antiguos es la Sira de Ibn Hisham, transmitida por Ibn Ishaq."
  fr: "La Sira prophétique est la science des récits relatifs à la vie du Prophète, de sa naissance à sa mort. L'un de ses ouvrages les plus anciens est la Sira d'Ibn Hisham, transmise par Ibn Ishaq."
  ur: "سیرت نبوی کی پیدائش سے لے کر ان کی وفات تک کی زندگی پر رپورٹوں کی سائنس ہے۔ اس کی قدیم ترین کتابوں میں سے ایک سیرت ابن ہشام ہے جو ابن اسحاق کی سند سے نقل ہوئی ہے۔"
  tr: "Peygamberlik Biyografisi, Peygamber'in doğumdan ölümüne kadar olan yaşamının bilimidir ve en erken kitaplarından biri, İbn İshaq'tan anlatılan İbn Hisham'ın biyografisidir."
  id: "Biografi Nabi adalah ilmu tentang kehidupan Nabi dari lahir hingga kematian, dan di antara buku-buku awalnya adalah biografi Ibn Hisham, yang dinarasikan dari Ibn Ishaq."
wings: []
question:
  ar: "ما السيرة النبوية؟"
short_answer:
  ar: "السيرة النبوية علم أخبار حياة النبي من مولده إلى وفاته، ومن أقدم كتبها سيرة ابن هشام المروية عن ابن إسحاق."
long_answer:
  ar: |
    كتب العلماء في السيرة منذ القرن الثاني للهجرة، ومن أشهر مدوناتها [[work/sira-ibn-ishaq-ibn-hisham|السيرة النبوية لابن هشام]].
    وتتصل السيرة بحياة [[person/muhammad|محمد]] وبأحداثها من الوحي إلى الفتح، ويعرض المدخل أبوابها.

