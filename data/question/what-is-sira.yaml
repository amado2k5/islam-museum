label:
  ar: "ما السيرة النبوية؟"
  en: What is the Prophetic sira?
summary:
  ar: "السيرة النبوية علم أخبار حياة النبي من مولده إلى وفاته، ومن أقدم كتبها سيرة ابن هشام المروية عن ابن إسحاق."
  en: The Prophetic sira is the science of reports on the life of the Prophet from his birth to his death. One of its oldest books is the Sira of Ibn Hisham, transmitted on the authority of Ibn Ishaq.
wings: []
question:
  ar: "ما السيرة النبوية؟"
short_answer:
  ar: "السيرة النبوية علم أخبار حياة النبي من مولده إلى وفاته، ومن أقدم كتبها سيرة ابن هشام المروية عن ابن إسحاق."
long_answer:
  ar: |
    كتب العلماء في السيرة منذ القرن الثاني للهجرة، ومن أشهر مدوناتها [[work/sira-ibn-ishaq-ibn-hisham|السيرة النبوية لابن هشام]].
    وتتصل السيرة بحياة [[person/muhammad|محمد]] وبأحداثها من الوحي إلى الفتح، ويعرض المدخل أبوابها.

