id: question/what-was-hudaybiyya
class: question
label:
  ar: ما صلح الحديبية؟
  en: What was the Treaty of Hudaybiyya?
  es: "¿Qué fue el Tratado de Hudaybiyya?"
  fr: "Qu'est-ce que le traité d'Hudaybiyya ?"
  ur: "معاہدہ حدیبیہ کیا تھا؟"
  tr: "Hudaybiyyah'ın faydası nedir?"
  id: "Apa gunanya Hudaybiyyah?"
summary:
  ar: الحديبية ذو القعدة 6هـ/628م؛ صلح بين النبي وقريش ظاهره المشقة وباطنه الفتح؛ سماه القرآن فتحًا مبينًا.
  en: "Hudaybiyya, Dhu al-Qa'da 6 AH / 628 CE; a treaty between the Prophet and Quraysh whose outward appearance was hardship and whose inner reality was victory; the Qur'an called it a clear victory."
  es: "Hudaybiyya, Dhu al-Qa'da 6 AH / 628 CE; un tratado entre el Profeta y los Quraysh cuya apariencia externa era de adversidad y cuya realidad interna era de victoria; el Corán lo llamó una victoria clara."
  fr: "Hudaybiyya, Dhu al-Qa'da 6 AH / 628 CE; un traité entre le Prophète et les Quraysh dont l'apparence extérieure était celle de l'épreuve et la réalité intérieure celle de la victoire; le Coran l'a qualifié de victoire éclatante."
  ur: "حدیبیہ، ذی القعدہ 6 ہجری / 628 عیسوی؛ نبی اور قریش کے درمیان ایک معاہدہ جس کی ظاہری شکل مشکل تھی اور جس کی باطنی حقیقت فتح تھی۔ قرآن نے اسے واضح فتح قرار دیا۔"
  tr: "El-Hudeybiyyah, Zulüd-Kı'de 6 Hâm/628 M.S; Peygamber ile Kureyş arasında yapılan bir antlaşma, görünüşte zorluk ama gizli bir fetih; Kur'an bunu açık bir fetih olarak adlandırmıştır."
  id: "Al-Hudaybiyyah, Dhu al-Qi'dah 6 H/628 M; sebuah perjanjian antara Nabi dan Quraisy, tampaknya kesulitan namun penaklukan tersembunyi; Al-Qur'an menyebutnya sebagai penaklukan yang jelas."
question:
  ar: ما صلح الحديبية؟
short_answer:
  ar: الحديبية ذو القعدة 6هـ/628م؛ صلح بين النبي وقريش ظاهره المشقة وباطنه الفتح؛ سماه القرآن فتحًا مبينًا.
long_answer:
  ar: '[[event/treaty-of-hudaybiyya|صلح الحديبية]] قرب مكة؛ منع المشركون المسلمين العمرة فصالحوهم بشروط
    تبدو للبعض مجحفة: ردّ من جاء مسلمًا بلا إذن والرجوع بلا عمرة؛ أنزل الله فيها إنا فتحنا لك فتحًا مبينًا؛
    في عهدها دخلت مكة كلها في الإسلام. {cite:wikidata}'
