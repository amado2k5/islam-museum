long_answer:
  ar: '[[event/treaty-of-hudaybiyya|صلح الحديبية]] قرب مكة؛ منع المشركون المسلمين العمرة فصالحوهم بشروط
    تبدو للبعض مجحفة: ردّ من جاء مسلمًا بلا إذن والرجوع بلا عمرة؛ أنزل الله فيها إنا فتحنا لك فتحًا مبينًا؛
    في عهدها دخلت مكة كلها في الإسلام. {cite:wikidata}'
