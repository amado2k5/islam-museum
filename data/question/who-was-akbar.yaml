short_answer:
  ar: أكبر (1542–1605) ثالث أباطرة المغول في الهند؛ وسع الإمبراطورية وتزوج من الراجبوت وأسس سياسة الصلح
    الكلي والدين الإلهي المثير للجدل.
long_answer:
  ar: '[[person/jalal-al-din-akbar|أكبر]] حكم الهند المغولية 1556–1605 فوحّدها إدارياً وعسكرياً، وألغى
    الجزية وصالح الراجبوت، وأسس «دين الإله» المختلط الذي رفضه علماء عصره ومنهم أحمد السرهندي؛ يعد في التراجم
    حاكمًا عظيمًا وفي التاريخ الديني رجلًا مثيرًا للجدل. {cite:wikidata}'
