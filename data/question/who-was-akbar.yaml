id: question/who-was-akbar
class: question
label:
  ar: من كان جلال الدين أكبر؟
  en: Who was Jalal al-Din Akbar?
  es: "¿Quién fue Jalal al-Din Akbar?"
  fr: "Qui était Jalal al-Din Akbar ?"
  ur: "جلال الدین اکبر کون تھا؟"
  tr: "Celaluddin en büyüğü kimdi?"
  id: "Siapa Jalaluddin yang terbesar?"
summary:
  ar: أكبر (1542–1605) ثالث أباطرة المغول في الهند؛ وسع الإمبراطورية وتزوج من الراجبوت وأسس سياسة الصلح
    الكلي والدين الإلهي المثير للجدل.
  en: "Akbar (1542–1605) was the third Mughal emperor in India. He expanded the empire and married Rajput women, and he established the policy of sulh-i kull and the controversial Din-i Ilahi."
  es: "Akbar (1542-1605) fue el tercer emperador mogol de la India. Expandió el imperio, se casó con mujeres rajput y estableció la política de sulh-i kull y el controvertido Din-i Ilahi."
  fr: "Akbar (1542-1605) fut le troisième empereur moghol en Inde. Il agrandit l'empire, épousa des femmes rajputs et instaura la politique du sulh-i kull et le controversé Din-i Ilahi."
  ur: "اکبر (1542-1605) ہندوستان کا تیسرا مغل بادشاہ تھا۔ اس نے سلطنت کو وسعت دی اور راجپوت عورتوں سے شادی کی، اور اس نے سلجھے کل اور متنازعہ دین الٰہی کی پالیسی قائم کی۔"
  tr: "Akbar (1542–1605), Hindistan'daki üçüncü Babür imparatoruydu; imparatorluğu genişletti, bir Rajput ile evlendi ve tam uzlaşma ile tartışmalı ilahi din politikası kurdu."
  id: "Akbar (1542–1605) adalah kaisar Mughal ketiga di India; ia memperluas kekaisaran, menikahi seorang Rajput, dan menetapkan kebijakan rekonsiliasi total serta agama ilahi yang kontroversial."
question:
  ar: من كان جلال الدين أكبر؟
short_answer:
  ar: أكبر (1542–1605) ثالث أباطرة المغول في الهند؛ وسع الإمبراطورية وتزوج من الراجبوت وأسس سياسة الصلح
    الكلي والدين الإلهي المثير للجدل.
long_answer:
  ar: '[[person/jalal-al-din-akbar|أكبر]] حكم الهند المغولية 1556–1605 فوحّدها إدارياً وعسكرياً، وألغى
    الجزية وصالح الراجبوت، وأسس «دين الإله» المختلط الذي رفضه علماء عصره ومنهم أحمد السرهندي؛ يعد في التراجم
    حاكمًا عظيمًا وفي التاريخ الديني رجلًا مثيرًا للجدل. {cite:wikidata}'
