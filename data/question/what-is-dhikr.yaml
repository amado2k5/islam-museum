label:
  ar: "ما الذكر في الإسلام؟"
  en: What is dhikr in Islam?
summary:
  ar: "الذكر استحضار الله بالقلب واللسان، وهو من أبواب العبادة التي يُكثر فيها المسلم، وقد جمع العلماء فيه كتباً عدة."
  en: "Dhikr is the remembrance of God in the heart and on the tongue. It is one of the forms of worship a Muslim practises often, and scholars have compiled many books on it."
