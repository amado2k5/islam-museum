id: question/what-is-dhikr
class: question
label:
  ar: "ما الذكر في الإسلام؟"
  en: What is dhikr in Islam?
  es: "¿Qué es el dhikr en el Islam?"
  fr: "Qu'est-ce que le dhikr en Islam ?"
summary:
  ar: "الذكر استحضار الله بالقلب واللسان، وهو من أبواب العبادة التي يُكثر فيها المسلم، وقد جمع العلماء فيه كتباً عدة."
  en: "Dhikr is the remembrance of God in the heart and on the tongue. It is one of the forms of worship a Muslim practises often, and scholars have compiled many books on it."
  es: "El dhikr es el recuerdo de Dios en el corazón y en la lengua. Es una de las formas de adoración que los musulmanes practican con frecuencia, y los eruditos han recopilado muchos libros sobre ello."
  fr: "Le dhikr est l'invocation de Dieu dans le cœur et sur la langue. C'est une forme d'adoration fréquemment pratiquée par les musulmans, et de nombreux ouvrages lui ont été consacrés par les érudits."
