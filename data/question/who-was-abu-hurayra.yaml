id: question/who-was-abu-hurayra
class: question
label:
  ar: من كان أبو هريرة؟
  en: Who was Abu Hurayra?
  es: "¿Quién fue Abu Hurayra?"
  fr: "Qui était Abou Hourayra ?"
  ur: "ابو ہریرہ کون تھے؟"
  tr: "Abu Huraira kimdi?"
  id: "Siapakah Abu Huraira?"
summary:
  ar: أبو هريرة الدوسي من أكثر الصحابة رواية للحديث رغم متأخر إسلامه؛ صحب النبي أربع سنين وروى عنه آلاف
    الأحاديث.
  en: "Abu Hurayra al-Dawsi was among the Companions who narrated the most hadith, despite having embraced Islam late. He accompanied the Prophet for four years and narrated thousands of hadiths from him."
  es: "Abu Hurayra al-Dawsi fue uno de los Compañeros que más hadices narró, a pesar de haberse convertido al Islam tardíamente. Acompañó al Profeta durante cuatro años y narró miles de hadices de él."
  fr: "Abou Hourayra al-Dawsi compte parmi les Compagnons ayant rapporté le plus grand nombre de hadiths, bien qu'il se soit converti tardivement à l'islam. Il accompagna le Prophète pendant quatre ans et rapporta de lui des milliers de hadiths."
  ur: "ابوہریرہ الدوسی ان صحابہ میں سے تھے جنہوں نے دیر سے اسلام قبول کرنے کے باوجود سب سے زیادہ حدیثیں بیان کیں۔ وہ چار سال رسول اللہ کے ساتھ رہے اور آپ سے ہزاروں احادیث روایت کیں۔"
  tr: "Ebu Hureyre el-Dawsi, daha sonra İslam'a geçmesine rağmen en çok hadis anlatan sahabeler arasındadır; dört yıl boyunca Peygamber'e eşlik etti ve ondan binlerce hadis aktardı."
  id: "Abu Huraira al-Dawsi adalah salah satu para sahabat yang paling banyak menceritakan hadis meskipun kemudian ia masuk Islam; ia menemani Nabi selama empat tahun dan menceritakan ribuan hadis darinya."
question:
  ar: من كان أبو هريرة؟
short_answer:
  ar: أبو هريرة الدوسي من أكثر الصحابة رواية للحديث رغم متأخر إسلامه؛ صحب النبي أربع سنين وروى عنه آلاف
    الأحاديث.
long_answer:
  ar: '[[person/abu-hurayra|أبو هريرة]] عبد الرحمن بن صخر الدوسي؛ أسلم سنة خيبر فصحب النبي أربع سنين فقط،
    ومع ذلك روى عنه من الحديث ما لا يضاهيه كثير من الصحابة؛ نسب إليه نحو خمسة آلاف حديث في الروايات. توفي
    59هـ. {cite:wikidata}'
