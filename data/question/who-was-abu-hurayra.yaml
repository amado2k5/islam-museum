    الأحاديث.
long_answer:
  ar: '[[person/abu-hurayra|أبو هريرة]] عبد الرحمن بن صخر الدوسي؛ أسلم سنة خيبر فصحب النبي أربع سنين فقط،
    ومع ذلك روى عنه من الحديث ما لا يضاهيه كثير من الصحابة؛ نسب إليه نحو خمسة آلاف حديث في الروايات. توفي
    59هـ. {cite:wikidata}'
