id: question/who-was-harun-al-rashid
class: question
label:
  ar: من كان هارون الرشيد؟
  en: Who was Harun al-Rashid?
  es: "¿Quién fue Harun al-Rashid?"
  fr: "Qui était Harun al-Rashid ?"
  ur: "ہارون الرشید کون تھا؟"
  tr: "Harun el-Reşid kimdi?"
  id: "Siapakah Harun al-Rashid?"
summary:
  ar: هارون الرشيد (763–809) خامس الخلفاء العباسيين؛ بلغت الدولة في عهده ذروة عزّها وشهرتها في قصص ألف
    ليلة.
  en: "Harun al-Rashid (763–809) was the fifth Abbasid caliph; the state reached the height of its power in his time, and its renown is linked to the stories of One Thousand and One Nights."
  es: "Harun al-Rashid (763-809) fue el quinto califa abasí; el estado alcanzó la cima de su poder durante su mandato, y su renombre está vinculado a los cuentos de Las mil y una noches."
  fr: "Harun al-Rashid (763-809) fut le cinquième calife abbasside; l'État atteignit l'apogée de sa puissance à son époque, et sa renommée est liée aux contes des Mille et Une Nuits."
  ur: "ہارون الرشید (763-809) پانچویں عباسی خلیفہ تھے۔ ریاست اپنے دور میں اپنی طاقت کے عروج کو پہنچی اور اس کی شہرت ایک ہزار اور ایک راتوں کی کہانیوں سے جڑی ہوئی ہے۔"
  tr: "Harun el-Reşid (763–809) beşinci Abbasi halifesiydi; onun saltanatı sırasında devlet, Bin Bir Gece Masalları hikâyelerinde en üst döneme ulaştı."
  id: "Harun al-Rashid (763–809) adalah khalifah Abbasiyah kelima; selama pemerintahannya, negara ini mencapai puncak kejayaan dan ketenarannya dalam kisah Seribu Satu Malam."
question:
  ar: من كان هارون الرشيد؟
short_answer:
  ar: هارون الرشيد (763–809) خامس الخلفاء العباسيين؛ بلغت الدولة في عهده ذروة عزّها وشهرتها في قصص ألف
    ليلة.
long_answer:
  ar: '[[person/harun-al-rashid|هارون الرشيد]] أشهر خلفاء بني العباس؛ حكم ربع قرن من بغداد في أزهى عصورها
    واشتهر في التراجم بالعدل والصلاح وفي المخيال بقصص ألف ليلة وليلة؛ مات في طوس سنة 193هـ. {cite:wikidata}'
