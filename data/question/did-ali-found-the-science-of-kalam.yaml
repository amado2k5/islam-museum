id: question/did-ali-found-the-science-of-kalam
class: question
label: { ar: "هل علم الكلام مأخوذ عن علي؟", en: "Does the science of kalam go back to Ali?", ur: "کیا علمِ کلام علی سے ماخوذ ہے؟" }
summary:
  ar: "ذكر ابن المطهر الحلي في فضائل علي أن علم الكلام أصله من خطبه وأن الناس تلاميذه فيه، فرد ابن تيمية بأن هذا الكلام لم يعرفه الصحابة والتابعون، وأنه ظهر بعد المائة الأولى من جهة الجعد بن درهم والجهم بن صفوان ثم أصحاب عمرو بن عبيد، وأن خطب علي الثابتة ليس فيها شيء من أصول المعتزلة."
  en: "Among Ali's virtues al-Hilli listed that the science of kalam derives from his sermons and that all people are his pupils in it; Ibn Taymiyya replied that this kalam was unknown to the Companions and Successors, appeared after the first century through al-Ja'd ibn Dirham and al-Jahm ibn Safwan and then the circle of Amr ibn Ubayd, and that Ali's authenticated sermons contain none of the Mu'tazila's principles."
question: { ar: "هل علم الكلام مأخوذ عن علي؟", en: "Does the science of kalam go back to Ali?" }
issue: { ar: "من أين نشأ علم الكلام، وهل تصح نسبته إلى علي بن أبي طالب؟" }
short_answer:
  ar: "الحلي، كما ينقله ابن تيمية: أصله من علي؛ ابن تيمية: لا، بل ظهر بعد المائة الأولى، وما يُنقل عن علي من أصول المعتزلة كذب عليه."
  en: "Al-Hilli, as Ibn Taymiyya quotes him: it goes back to Ali. Ibn Taymiyya: no, it appeared after the first century, and any Mu'tazili principle ascribed to Ali is falsely ascribed."
