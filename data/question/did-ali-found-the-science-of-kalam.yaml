id: question/did-ali-found-the-science-of-kalam
class: question
label: { ar: "هل علم الكلام مأخوذ عن علي؟", en: "Does the science of kalam go back to Ali?", ur: "کیا علمِ کلام علی سے ماخوذ ہے؟", es: "¿La ciencia del kalam se remonta a Ali?", fr: "La science du kalam remonte-t-elle à Ali ?", tr: "Konuşma bilimi Ali'den mi alındı?", id: "Apakah ilmu bicara diambil dari Ali?" }
summary:
  ar: "ذكر ابن المطهر الحلي في فضائل علي أن علم الكلام أصله من خطبه وأن الناس تلاميذه فيه، فرد ابن تيمية بأن هذا الكلام لم يعرفه الصحابة والتابعون، وأنه ظهر بعد المائة الأولى من جهة الجعد بن درهم والجهم بن صفوان ثم أصحاب عمرو بن عبيد، وأن خطب علي الثابتة ليس فيها شيء من أصول المعتزلة."
  en: "Among Ali's virtues al-Hilli listed that the science of kalam derives from his sermons and that all people are his pupils in it; Ibn Taymiyya replied that this kalam was unknown to the Companions and Successors, appeared after the first century through al-Ja'd ibn Dirham and al-Jahm ibn Safwan and then the circle of Amr ibn Ubayd, and that Ali's authenticated sermons contain none of the Mu'tazila's principles."
  es: "Entre las virtudes de Ali, al-Hilli mencionó que la ciencia del kalam deriva de sus sermones y que todas las personas son sus discípulos en ella; Ibn Taymiyya respondió que este kalam era desconocido para los Compañeros y Sucesores, apareció después del primer siglo a través de al-Ja'd ibn Dirham y al-Jahm ibn Safwan y luego el círculo de Amr ibn Ubayd, y que los sermones autenticados de Ali no contienen ninguno de los principios de los Mu'tazila."
  fr: "Parmi les vertus d'Ali, al-Hilli mentionne que la science du kalam découle de ses sermons et que tous les hommes sont ses élèves en la matière; Ibn Taymiyya répond que ce kalam était inconnu des Compagnons et des Successeurs, qu'il est apparu après le premier siècle par l'intermédiaire d'al-Ja'd ibn Dirham et d'al-Jahm ibn Safwan, puis dans le cercle d'Amr ibn Ubayd, et que les sermons authentifiés d'Ali ne contiennent aucun des principes des Mu'tazilites."
  ur: "علی کے فضائل میں سے الہلی نے درج کیا کہ کلام کی سائنس ان کے خطبات سے ماخوذ ہے اور تمام لوگ اس میں ان کے شاگرد ہیں۔ ابن تیمیہ نے جواب دیا کہ یہ کلام صحابہ کرام اور جانشینوں کو معلوم نہیں تھا، پہلی صدی کے بعد الجعد بن درہم اور الجہم بن صفوان اور پھر عمرو بن عبید کے حلقہ کے ذریعے ظاہر ہوا، اور یہ کہ علی کے مستند خطبات میں معتزلہ کا کوئی اصول نہیں ہے۔"
  tr: "İbn al-Mutahhar al-Hilli, Fada'il Ali'de teolojinin kendi vaazlarından doğduğunu ve insanların onun öğrencileri olduğunu belirtmiştir. İbn Teymiyye, bu teolojinin Sahabeler ve Takipçiler tarafından bilinmediğini, birinci yüzyıldan sonra Amr bin Ubeyd'in sahabeleri olan el-Ca'd ibn Dirham, el-Jahm ibn Safvan tarafından ortaya çıktığını ve Ali'nin özgün vaazlarının Mu'tazilite ilkelerinden hiçbir şey içermediğini yanıtlamıştır."
  id: "Ibn al-Mutahhar al-Hilli menyebutkan dalam Fada'il Ali bahwa teologi berasal dari khotbahnya dan orang-orang adalah muridnya di dalamnya. Ibn Taymiyyah menjawab bahwa teologi ini tidak diketahui oleh Para Sahabat dan Pengikut, dan bahwa setelah abad pertama muncul dari pihak al-Ja'd ibn Dirham, al-Jahm ibn Safwan, kemudian para sahabat Amr ibn Ubayd, dan bahwa khotbah otentik Ali tidak mengandung apa pun dari prinsip-prinsip Mu'tazilite."
question: { ar: "هل علم الكلام مأخوذ عن علي؟", en: "Does the science of kalam go back to Ali?" }
issue: { ar: "من أين نشأ علم الكلام، وهل تصح نسبته إلى علي بن أبي طالب؟" }
short_answer:
  ar: "الحلي، كما ينقله ابن تيمية: أصله من علي؛ ابن تيمية: لا، بل ظهر بعد المائة الأولى، وما يُنقل عن علي من أصول المعتزلة كذب عليه."
  en: "Al-Hilli, as Ibn Taymiyya quotes him: it goes back to Ali. Ibn Taymiyya: no, it appeared after the first century, and any Mu'tazili principle ascribed to Ali is falsely ascribed."
