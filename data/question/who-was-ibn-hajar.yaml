  en: "Ahmad ibn Hajar al-Asqalani (1372–1449), the hafiz of Egypt, was chief judge and the author of Fath al-Bari, the greatest commentary on al-Bukhari, as well as Lisan al-Mizan and Taqrib al-Tahdhib."
question:
  ar: من كان ابن حجر العسقلاني؟
short_answer:
  ar: أحمد بن حجر العسقلاني (1372–1449) حافظ مصر؛ قاضي القضاة وصاحب فتح الباري أعظم شروح البخاري ولسان
    الميزان وتقريب التهذيب.
long_answer:
  ar: '[[person/ibn-hajar-al-asqalani|ابن حجر العسقلاني]] شافعي مصري من أصل عسقلان؛ أمير المؤمنين في الحديث
    عند متأخري المحدثين؛ ألّف فتح الباري شرحًا لصحيح البخاري بقي أكمل الشروح، ولسان الميزان وتهذيب التهذيب
    والإصابة في تمييز الصحابة ونحو مئة وخمسين مصنفًا. {cite:wikidata}'
