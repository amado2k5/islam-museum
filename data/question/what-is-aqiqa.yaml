id: question/what-is-aqiqa
class: question
label:
  ar: "ما العقيقة؟"
  en: What is the aqiqa?
  es: "¿Qué es el aqiqa?"
  fr: "Qu'est-ce que l'aqiqa ?"
  ur: "عقیقہ کیا ہے؟"
  tr: "Aqiqah nedir?"
  id: "Apa itu Aqiqah?"
summary:
  ar: "العقيقة ذبح شاتين عن الغلام وشاة عن الجارية يوم السابع من الولادة، مع الحلق والتسمية، وهي سنة عند الجمهور."
  en: "The aqiqa is the sacrifice of two sheep for a boy and one for a girl on the seventh day after birth, together with shaving the head and naming the child. According to the majority of scholars, it is a sunna."
  es: "El aqiqa consiste en el sacrificio de dos ovejas por cada niño y una por cada niña al séptimo día de su nacimiento, junto con el afeitado de la cabeza y la imposición del nombre al niño. Según la mayoría de los eruditos, es una sunna."
  fr: "L'aqiqa consiste à sacrifier deux moutons pour un garçon et un pour une fille le septième jour après la naissance, en rasant la tête de l'enfant et en lui donnant un nom. Selon la majorité des savants, il s'agit d'une sunna."
  ur: "عقیقہ یہ ہے کہ پیدائش کے ساتویں دن لڑکے کی طرف سے دو اور لڑکی کی طرف سے ایک بکری کی قربانی، سر منڈوانے اور بچے کا نام رکھنے کے ساتھ۔ جمہور علماء کے نزدیک یہ سنت ہے۔"
  tr: "Akikah, doğumdan sonraki yedinci günde bir erkek için iki koyun ve genç bir kız için bir koyun kesmek, tıraş olmak ve isim yapmak anlamına gelir; bu çoğunluğa göre bir sünnettir."
  id: "Aqiqah adalah menyembelih dua domba untuk seorang anak laki-laki dan seekor domba untuk seorang anak perempuan pada hari ketujuh setelah lahir, bersama dengan mencukur dan membuat nama, yang menurut mayoritas adalah Sunnah."
