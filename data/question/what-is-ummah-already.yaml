question:
  ar: ما الأمة في الإسلام؟
short_answer:
  ar: الأمة جماعة المسلمين في العالم؛ رباطها العقيدة لا الدم ولا الأرض، وهي عند القرآن أمة واحدة وإن تعددت
    دولها.
long_answer:
  ar: 'الأمة في القرآن جماعة أهل الإيمان: «إن هذه أمتكم أمة واحدة». رباطها العقيدة والأخوة فلا فرق لعربي
    على أعجمي فيها؛ وتعبر كل الحدود فتجمع قرابة ملياري مسلم اليوم، وتقابلها في التاريخ الإسلامي فكرة الأمة
    الواحدة وسياسات الدول المتعددة. {cite:wikidata}'
