id: question/what-is-fez
class: question
label:
  ar: ما فاس؟
  en: What is Fez?
  es: "¿Qué es Fez?"
  fr: "Qu'est-ce qu'un fez ?"
  ur: "Fez کیا ہے؟"
summary:
  ar: فاس عاصمة الإدريسيين والعلم في المغرب؛ فيها القرويين أقدم جامعة مستمرة في العالم ومدينتها القديمة
    أكبر مدينة وسطية حية بلا سيارات.
  en: "Fez is the capital of the Idrisids and of learning in Morocco. It has al-Qarawiyyin, the oldest continuously operating university in the world, and its old city is the largest living medieval city without cars."
  es: "Fez es la capital de los Idrisíes y del saber en Marruecos. Alberga al-Qarawiyyin, la universidad en funcionamiento continuo más antigua del mundo, y su casco antiguo es la mayor ciudad medieval habitada sin coches."
  fr: "Fès est la capitale des Idrissides et du savoir au Maroc. Elle abrite l'université Al-Qarawiyyin, la plus ancienne université au monde encore en activité, et sa vieille ville est la plus grande cité médiévale habitée sans voitures."
  ur: "فیز مراکش میں ادریسیوں اور سیکھنے کا دارالحکومت ہے۔ اس میں القارویین ہے، جو دنیا کی سب سے پرانی یونیورسٹی ہے جو مسلسل کام کرتی ہے، اور اس کا پرانا شہر قرون وسطیٰ کا سب سے بڑا زندہ شہر ہے جس میں کاریں نہیں ہیں۔"
question:
  ar: ما فاس؟
short_answer:
  ar: فاس عاصمة الإدريسيين والعلم في المغرب؛ فيها القرويين أقدم جامعة مستمرة في العالم ومدينتها القديمة
    أكبر مدينة وسطية حية بلا سيارات.
long_answer:
  ar: '[[place/fez|فاس]] أسسها الإدريسيون 789 على ضفتي الوادي؛ أوقفت فاطمة الفهري جامع القرويين فصارت
    عاصمة العلم والفقه المالكي في المغرب آلاف سنة؛ مدينتها القديمة فاس البالي أعظم مدينة تاريخية حية في
    العالم. {cite:wikidata}'
