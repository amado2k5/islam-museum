question:
  ar: ما الصلاة؟
short_answer:
  ar: 'الصلاة هي الركن الثاني من أركان الإسلام: خمس صلوات مفروضة في اليوم يقف فيها المسلم بين يدي الله
    بالقيام والركوع والسجود.'
long_answer:
  ar: الصلاة هي الركن الثاني من أركان الإسلام؛ يصلي المسلم خمس صلوات في اليوم والليلة في أوقات محددة،
    ويجتمع لها في [[practice/salat-al-jumua|الجمعة]] كل أسبوع. تبدأ بالطهارة وتتضمن القيام والركوع والسجود
    وقراءة القرآن، وتستقبل [[concept/mihrab|قبلة الكعبة]] في كل الأرض. {cite:wikidata}
