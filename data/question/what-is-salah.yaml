id: question/what-is-salah
class: question
label:
  ar: ما الصلاة؟
  en: What is salah?
  es: "¿Qué es el salah?"
  fr: "Qu'est-ce que la salah ?"
  ur: "صلاۃ کیا ہے؟"
summary:
  ar: 'الصلاة هي الركن الثاني من أركان الإسلام: خمس صلوات مفروضة في اليوم يقف فيها المسلم بين يدي الله
    بالقيام والركوع والسجود.'
  en: "Salah is the second pillar of Islam: five obligatory prayers each day, in which the Muslim stands before God through standing, bowing and prostration."
  es: "El Salah es el segundo pilar del Islam: cinco oraciones obligatorias diarias, en las que el musulmán se presenta ante Dios poniéndose de pie, inclinándose y postrándose."
  fr: "La Salat est le deuxième pilier de l'Islam: cinq prières obligatoires par jour, au cours desquelles le musulman se tient devant Dieu en se tenant debout, en s'inclinant et en se prosternant."
  ur: "نماز اسلام کا دوسرا ستون ہے: ہر روز پانچ فرض نمازیں، جن میں مسلمان کھڑے ہونے، رکوع اور سجدہ کے ذریعے خدا کے سامنے کھڑا ہوتا ہے۔"
question:
  ar: ما الصلاة؟
short_answer:
  ar: 'الصلاة هي الركن الثاني من أركان الإسلام: خمس صلوات مفروضة في اليوم يقف فيها المسلم بين يدي الله
    بالقيام والركوع والسجود.'
long_answer:
  ar: الصلاة هي الركن الثاني من أركان الإسلام؛ يصلي المسلم خمس صلوات في اليوم والليلة في أوقات محددة،
    ويجتمع لها في [[practice/salat-al-jumua|الجمعة]] كل أسبوع. تبدأ بالطهارة وتتضمن القيام والركوع والسجود
    وقراءة القرآن، وتستقبل [[concept/mihrab|قبلة الكعبة]] في كل الأرض. {cite:wikidata}
