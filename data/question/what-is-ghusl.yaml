id: question/what-is-ghusl
class: question
label:
  ar: "ما الغسل؟"
  en: What is ghusl?
summary:
  ar: "الغسل طهارة كبرى بعموم البدن بالماء بعد الجنابة والحيض والنفاس، وهو شرط في صحة الصلاة لمن كان على حدث أكبر."
  en: "Ghusl is the major ritual purification of the whole body with water after janaba (major ritual impurity), menstruation and postpartum bleeding. It is a condition for the validity of prayer for one who is in a major state of impurity."
