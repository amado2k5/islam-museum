id: question/are-the-prophets-protected-from-sin
class: question
label: { ar: "هل الأنبياء معصومون من الذنوب؟", en: "Are the prophets protected from sin?", ur: "کیا انبیا گناہوں سے معصوم ہیں؟" }
summary:
  ar: "يقرر ابن تيمية في المجلد العاشر من مجموع الفتاوى أن الأنبياء معصومون فيما يخبرون به عن الله وفي تبليغ رسالاته باتفاق الأمة، وأن العصمة في غير التبليغ موضع نزاع، وأن قول جمهور الناس الموافق لآثار السلف إثبات العصمة من الإقرار على الذنوب لا من وقوعها، وأن التوبة ترفع صاحبها إلى أعظم مما كان عليه."
  en: "In volume ten of Majmu' al-Fatawa Ibn Taymiyya states that the prophets are protected in what they report from God and in conveying His messages, by the agreement of the community; that protection in other matters is disputed; and that the view of most people, agreeing with the reports from the early generations, is that they are protected from being left to persist in sins rather than from ever committing them, repentance raising them higher than before."
  ur: "مجموع الفتاویٰ کی دسویں جلد میں ابن تیمیہ کہتے ہیں کہ انبیا اللہ کی طرف سے خبر دینے اور اس کے پیغامات پہنچانے میں امت کے اتفاق سے معصوم ہیں؛ تبلیغ کے سوا دوسرے امور میں عصمت مختلف فیہ ہے؛ اور جمہور کا قول، جو سلف کے آثار کے موافق ہے، یہ ہے کہ وہ گناہوں پر برقرار رکھے جانے سے معصوم ہیں، ان کے صدور سے نہیں، اور توبہ انہیں پہلے سے بلند کر دیتی ہے۔"
question: { ar: "هل الأنبياء معصومون من الذنوب؟", en: "Are the prophets protected from sin?", ur: "کیا انبیا گناہوں سے معصوم ہیں؟" }
issue:
  ar: "ما حدود عصمة الأنبياء: أهي في التبليغ وحده، أم من الكبائر والصغائر، أم من الإقرار عليها؟ وهل تثبت بالعقل أو بالسمع؟"
  en: "What are the limits of the prophets' protection: conveying the message only, all major and minor sins, or being left to persist in them? And is it established by reason or by revelation?"
  ur: "انبیا کی عصمت کی حدود کیا ہیں: صرف تبلیغ میں، تمام کبیرہ و صغیرہ گناہوں سے، یا ان پر برقرار رکھے جانے سے؟ اور کیا یہ عقل سے ثابت ہے یا نقل سے؟"
short_answer:
  ar: "ابن تيمية: العصمة في التبليغ متفق عليها، وفي غيره قول الجمهور وآثار السلف العصمة من الإقرار على الذنب، مع التوبة منه. القائلون بالعصمة المطلقة كما يحكيهم: الذنوب تنافي الكمال والتأسي بهم يقتضي ألا يقع منهم ذنب."
  en: "Ibn Taymiyya: protection in conveying is agreed; beyond it, the majority and the early reports affirm protection from being left in a sin, which is followed by repentance. Those who affirm protection from all sins, as he reports them: sins contradict perfection, and following their example requires that no sin occur from them."
  ur: "ابن تیمیہ: تبلیغ میں عصمت متفق علیہ ہے؛ اس کے علاوہ جمہور اور سلف کے آثار گناہ پر برقرار رکھے جانے سے عصمت ثابت کرتے ہیں، جس کے بعد توبہ ہوتی ہے۔ مطلق عصمت کے قائلین، جیسا وہ نقل کرتے ہیں: گناہ کمال کے منافی ہیں، اور ان کی اقتدا کا تقاضا ہے کہ ان سے کوئی گناہ نہ ہو۔"
