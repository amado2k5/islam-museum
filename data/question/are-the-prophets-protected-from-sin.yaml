    summary: { ar: "في نقل ابن تيمية: احتج القائلون بالعصمة بأن التأسي بالأنبياء مشروع، وذلك لا يجوز مع تجويز كون أفعالهم ذنوباً، وبحجج عقلية منها أن الذنوب تنافي الكمال، وأنها ممن عظمت عليه النعمة أقبح، وأنها توجب التنفير. ولا يسميهم ابن تيمية في هذا الموضع، ويحتاج القول إلى عرضه من كتب أصحابه.", en: "As Ibn Taymiyya reports: those who affirm protection argued that following the prophets' example is prescribed, which would not be permissible if their acts could be sins, and gave rational arguments – that sins contradict perfection, that they are uglier in one on whom great favour has been bestowed, and that they repel people. Ibn Taymiyya does not name them in this passage; the view needs to be set out from its holders' books.", ur: "ابن تیمیہ کی نقل میں: عصمت کے قائلین نے دلیل دی کہ انبیا کی اقتدا مشروع ہے، اور یہ اس صورت میں جائز نہ ہوتی اگر ان کے افعال گناہ ہو سکتے، اور عقلی دلائل دیے – کہ گناہ کمال کے منافی ہیں، جس پر بڑی نعمت ہو اس سے زیادہ قبیح ہیں، اور لوگوں کو متنفر کرتے ہیں۔ ابن تیمیہ اس مقام پر ان کا نام نہیں لیتے؛ اس قول کو اس کے قائلین کی کتابوں سے پیش کرنا باقی ہے۔" }
