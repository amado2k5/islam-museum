    stance: { ar: "العصمة في التبليغ ثابتة بالاتفاق، وفي غيره العصمة من الإقرار على الذنوب", en: "Protection in conveying is agreed; elsewhere, protection from being left to persist in sins", ur: "تبلیغ میں عصمت متفق علیہ ہے؛ اس کے علاوہ گناہوں پر برقرار رکھے جانے سے عصمت" }
    summary: { ar: "يرى ابن تيمية أن العصمة فيما يبلغونه عن الله هي التي يحصل بها مقصود النبوة، وأن من سب نبياً قُتل باتفاق الفقهاء بخلاف غيرهم، وأن حجج القائلين بالعصمة إذا حُررت لا تدل إلا على العصمة من الإقرار، فالتأسي مشروع فيما أقروا عليه دون ما رجعوا عنه، والتوبة النصوح ترفع صاحبها، ويستشهد بقول بعض السلف إن داود كان بعد التوبة خيراً منه قبل الخطيئة.", en: "Ibn Taymiyya holds that protection in what they convey from God is what achieves the purpose of prophethood; that whoever reviles a prophet is put to death by the jurists' agreement, unlike others; that the arguments for protection, when examined, show only protection from being left in a sin, since following their example applies to what they were left upon, not what they turned back from; and that sincere repentance raises one higher – citing an early saying that David after repenting was better than before his sin.", ur: "ابن تیمیہ کے نزدیک اللہ کی طرف سے تبلیغ میں عصمت ہی سے نبوت کا مقصد حاصل ہوتا ہے؛ جو کسی نبی کو گالی دے وہ فقہاء کے اتفاق سے قتل کیا جاتا ہے، دوسروں کے برعکس؛ عصمت کے قائلین کے دلائل، جانچنے پر، صرف گناہ پر برقرار نہ رکھے جانے کی عصمت پر دلالت کرتے ہیں، کیونکہ اقتدا ان چیزوں میں ہے جن پر وہ برقرار رہے، نہ کہ جن سے رجوع کیا؛ اور خالص توبہ آدمی کو بلند کرتی ہے – اور وہ سلف کا قول پیش کرتے ہیں کہ داود توبہ کے بعد خطا سے پہلے سے بہتر تھے۔" }
