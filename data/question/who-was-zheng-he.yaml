short_answer:
  ar: جنغ خه (1371–1433) أميرال مسلم صيني قاد سبع حملات بحرية عظمى إلى جنوب شرق آسيا والهند والجزيرة العربية
    وشرق أفريقيا.
long_answer:
  ar: '[[person/zheng-he|جنغ خه]] (ما هي) مسلم يوناني الأصل في بلاط يونغله؛ قاد سبع رحلات لأساطيل الكنوز
    1405–1433 بأضخم سفن خشبية في التاريخ حتى شرق أفريقيا وجدة والخليج، وترك أعمدة وقبور وأثرًا في ذاكرة
    مسلمي الصين والمحيط الهندي. {cite:wikidata}'
