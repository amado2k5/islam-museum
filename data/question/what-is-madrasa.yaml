long_answer:
  ar: '[[concept/madrasa|المدرسة]] هي مؤسسة التعليم التي انتظمت التعليم الإسلامي منذ القرن الخامس الهجري؛
    قامت على الوقف فوفرت السكن والإعاشة والتدريس مجانًا. من أشهرها النظامية في بغداد، والأزهر في القاهرة،
    والقرويين في فاس، ومدارس بخارى وسمرقند وديوبند وندوة العلماء في الهند. {cite:wikidata}'
