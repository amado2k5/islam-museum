id: question/what-is-madrasa
class: question
label:
  ar: ما المدرسة الإسلامية؟
  en: What is the Islamic madrasa?
  es: "¿Qué es una madrasa islámica?"
  fr: "Qu'est-ce qu'une madrasa islamique ?"
summary:
  ar: المدرسة هي مؤسسة التعليم الإسلامية التاريخية؛ من نظامية بغداد النظامية إلى الأزهر والقرويين والزيتونة
    إلى اليوم.
  en: "The madrasa is the historical Islamic institution of learning, from the Nizamiyya of Baghdad to al-Azhar, al-Qarawiyyin and al-Zaytuna, and up to today."
  es: "La madrasa es la institución islámica histórica de enseñanza, desde la Nizamiyya de Bagdad hasta al-Azhar, al-Qarawiyyin y al-Zaytuna, y hasta nuestros días."
  fr: "La madrasa est l'institution historique d'enseignement islamique, de la Nizamiyya de Bagdad à al-Azhar, al-Qarawiyyin et al-Zaytuna, et jusqu'à nos jours."
question:
  ar: ما المدرسة الإسلامية؟
short_answer:
  ar: المدرسة هي مؤسسة التعليم الإسلامية التاريخية؛ من نظامية بغداد النظامية إلى الأزهر والقرويين والزيتونة
    إلى اليوم.
long_answer:
  ar: '[[concept/madrasa|المدرسة]] هي مؤسسة التعليم التي انتظمت التعليم الإسلامي منذ القرن الخامس الهجري؛
    قامت على الوقف فوفرت السكن والإعاشة والتدريس مجانًا. من أشهرها النظامية في بغداد، والأزهر في القاهرة،
    والقرويين في فاس، ومدارس بخارى وسمرقند وديوبند وندوة العلماء في الهند. {cite:wikidata}'
