id: question/is-tawatur-a-condition-of-a-valid-reading
class: question
label:
  ar: هل يُشترط التواتر في القراءة الصحيحة؟
  en: Must a valid Qur'an reading be mass-transmitted (mutawatir)?
  ur: کیا صحیح قراءت کے لیے تواتر شرط ہے؟
summary:
  ar: 'مسألة يعرضها ابن الجزري في «النشر» عند ذكره أركان القراءة الصحيحة الثلاثة: موافقة العربية ولو بوجه، وموافقة أحد المصاحف العثمانية ولو احتمالاً، وصحة السند؛ ويذكر أن بعض المتأخرين شرط التواتر في الركن الثالث ولم يكتف بصحة السند، ويرد ذلك، ويذكر أنه كان يجنح إليه ثم ظهر له فساده، وينقل قول أبي شامة والجعبري {cite:nashr-dahman-damascus-1345-v1 p. 19} {cite:nashr-dahman-damascus-1345-v1 p. 23}.'
  en: A question Ibn al-Jazari treats in al-Nashr when setting out the three pillars of a valid reading - agreement with Arabic in at least one way, agreement with one of the Uthmanic copies even potentially, and a sound chain; he notes that some later scholars required mass transmission in the third pillar rather than a sound chain, rejects this, says he once inclined to it before seeing it was wrong, and quotes Abu Shama and al-Ja'bari.
  ur: ایک مسئلہ جسے ابن الجزری «النشر» میں صحیح قراءت کے تین ارکان کے ضمن میں پیش کرتے ہیں — کسی ایک وجہ سے عربی کی موافقت، عثمانی مصاحف میں سے کسی کی احتمالاً موافقت، اور صحتِ سند؛ وہ بتاتے ہیں کہ بعض متاخرین نے تیسرے رکن میں صحتِ سند کافی نہ سمجھ کر تواتر کی شرط لگائی، اسے رد کرتے ہیں، کہتے ہیں کہ وہ پہلے اس کی طرف مائل تھے پھر اس کا فساد ظاہر ہوا، اور ابو شامہ اور جعبری کے اقوال نقل کرتے ہیں۔
