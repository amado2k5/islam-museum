- tradition: sunni
  id: sunni-abu-shama
  standing: secondary
  stance:
    ar: القطع فيما اجتمعت عليه الطرق واستفاض
    en: Certainty attaches to what all paths agree on and is widespread
    ur: قطعیت اسی میں ہے جس پر طرق متفق اور مشہور ہوں
  summary:
    ar: ينقل ابن الجزري عن أبي شامة في «المرشد» أنه أنكر ما شاع على ألسنة جماعة من المتأخرين أن كل فرد مما روي عن السبعة متواتر، وقال إن القطع بكونه منزلاً إنما هو فيما اجتمعت على نقله عنهم الطرق واتفقت عليه الفرق من غير نكير مع شهرته واستفاضته.
    en: Ibn al-Jazari quotes Abu Shama in al-Murshid rejecting the claim, common among some later reciters, that every single item transmitted from the seven is mass-transmitted, and holding that certainty of its revelation applies to what all the paths transmitted from them agree on, without objection, and is well known and widespread.
    ur: ابن الجزری ابو شامہ کا «المرشد» سے قول نقل کرتے ہیں کہ انہوں نے اس بات کو رد کیا جو بعض متاخر قراء میں مشہور تھی کہ سات سے مروی ہر جزئی متواتر ہے، اور کہا کہ اس کے منزل ہونے کا قطع اسی میں ہے جس کی نقل پر ان سے تمام طرق متفق ہوں، بلا انکار، اور وہ مشہور و مستفیض ہو۔
