question:
  ar: هل يكفي في قبول القراءة صحة سندها مع موافقة الرسم والعربية، أم يشترط تواترها؟
  en: Is a sound chain, with agreement with the script and Arabic, enough to accept a reading, or must it be mass-transmitted?
  ur: کیا قراءت کی قبولیت کے لیے رسم اور عربی کی موافقت کے ساتھ صحتِ سند کافی ہے، یا تواتر شرط ہے؟
issue:
  ar: شرط النقل في ضابط القراءة المقبولة.
  en: The transmission requirement in the criterion of an accepted reading.
  ur: مقبول قراءت کے ضابطے میں نقل کی شرط۔
short_answer:
  ar: عند ابن الجزري تكفي صحة السند مع الركنين الآخرين؛ وشرط بعض المتأخرين التواتر؛ ويقصر أبو شامة القطع على ما اجتمعت عليه الطرق واستفاض؛ ويجعل الجعبري الشرط واحداً هو صحة النقل.
  en: For Ibn al-Jazari a sound chain with the other two pillars suffices; some later scholars required mass transmission; Abu Shama limits certainty to what all the paths agree on and is widely spread; al-Ja'bari makes the single condition sound transmission.
  ur: 'ابن الجزری کے نزدیک باقی دو ارکان کے ساتھ صحتِ سند کافی ہے؛ بعض متاخرین نے تواتر کی شرط لگائی؛ ابو شامہ قطعیت کو اس تک محدود کرتے ہیں جس پر تمام طرق متفق اور مشہور ہوں؛ اور جعبری کے نزدیک شرط ایک ہی ہے: صحتِ نقل۔'
perspectives:
- tradition: sunni
  id: sunni-sihhat-al-sanad
  standing: main
  stance:
    ar: تكفي صحة السند مع موافقة العربية والرسم
    en: A sound chain with agreement with Arabic and the script suffices
    ur: عربی اور رسم کی موافقت کے ساتھ صحتِ سند کافی ہے
  summary:
    ar: قول ابن الجزري، ويذكر أنه الصحيح عند أئمة التحقيق من السلف والخلف وأن الداني صرح به؛ ويحتج بأن التواتر إذا ثبت لم يُحتج معه إلى الركنين الآخرين، وأن اشتراطه في كل حرف ينفي كثيراً من الأحرف الثابتة عن الأئمة السبعة وغيرهم؛ ويريد بصحة السند أن يروي القراءة العدل الضابط عن مثله إلى منتهاها مع شهرتها عند أئمة الشأن.
    en: Ibn al-Jazari's view, which he calls the correct one among the leading verifiers early and late and says al-Dani stated; he argues that if mass transmission were established the other two pillars would be unnecessary, and that requiring it for every variant would exclude many variants established from the seven imams and others; by a sound chain he means that the reading is transmitted by upright, precise narrators back to its source and is well known among the masters of the field.
    ur: ابن الجزری کا قول، جسے وہ سلف و خلف کے ائمۂ تحقیق کے نزدیک صحیح کہتے ہیں اور بتاتے ہیں کہ دانی نے اس کی صراحت کی؛ ان کی دلیل یہ ہے کہ اگر تواتر ثابت ہو تو باقی دو ارکان کی ضرورت نہیں رہتی، اور ہر حرف میں تواتر کی شرط ائمۂ سبعہ وغیرہ سے ثابت بہت سے حروف کو خارج کر دے گی؛ صحتِ سند سے ان کی مراد یہ ہے کہ قراءت کو عادل و ضابط راوی اپنے جیسے سے آخر تک روایت کرے اور وہ اہلِ فن کے ہاں مشہور ہو۔
