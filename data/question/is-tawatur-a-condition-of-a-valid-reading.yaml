- tradition: sunni
  id: sunni-tawatur
  standing: secondary
  stance:
    ar: يشترط التواتر، ولا يثبت قرآن بالآحاد
    en: Mass transmission is required; Qur'an is not established by solitary reports
    ur: تواتر شرط ہے؛ آحاد سے قرآن ثابت نہیں ہوتا
  summary:
    ar: قول بعض المتأخرين كما يحكيه ابن الجزري، شرطوا التواتر في ركن النقل وقالوا إن القرآن لا يثبت إلا بالتواتر؛ ويذكر ابن الجزري أنه كان يجنح إليه قبلُ. ولم تُذكر هنا أسماء قائليه ولا حججهم من كتبهم.
    en: 'The view of some later scholars as Ibn al-Jazari reports it: they required mass transmission in the pillar of transmission and held that the Qur''an is established only by mass transmission; Ibn al-Jazari says he himself once inclined to it. The names of its holders and their arguments from their own books are not given here.'
    ur: 'بعض متاخرین کا قول جیسا کہ ابن الجزری نقل کرتے ہیں: انہوں نے نقل کے رکن میں تواتر کی شرط لگائی اور کہا کہ قرآن صرف تواتر سے ثابت ہوتا ہے؛ ابن الجزری کہتے ہیں کہ وہ خود پہلے اس کی طرف مائل تھے۔ اس کے قائلین کے نام اور ان کی کتب سے دلائل یہاں نہیں دیے گئے۔'
