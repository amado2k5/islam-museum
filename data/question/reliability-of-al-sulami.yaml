      en: "Knowledgeable about narrators but not strong in hadith: the view of al-Dhahabi"
      ur: "رجال کا عارف مگر حدیث میں قوی نہیں: ذہبی کا قول"
    summary:
      ar: "ينقل المحقق عن الذهبي أن للسلمي سؤالات للدارقطني عن أحوال المشايخ والرواة «سؤال عارف»، وأنه «ليس بالقوي في الحديث»، ويعدّه المحقق خير ما قيل فيه."
      en: "The editor quotes al-Dhahabi that al-Sulami put questions to al-Daraqutni about the states of shaykhs and narrators 'as one who knows', and that he is 'not strong in hadith'; the editor considers this the best thing said of him."
      ur: "محقق ذہبی سے نقل کرتے ہیں کہ سلمی نے دارقطنی سے مشائخ اور راویوں کے احوال کے بارے میں «جاننے والے کی طرح» سوالات کیے، اور یہ کہ وہ «حدیث میں قوی نہیں»؛ محقق اسے ان کے بارے میں سب سے بہتر قول سمجھتے ہیں۔"
