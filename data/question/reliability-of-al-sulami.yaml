id: question/reliability-of-al-sulami
class: question
label:
  ar: "هل كان أبو عبد الرحمن السلمي ثقة في الحديث؟"
  en: "Was Abu 'Abd al-Rahman al-Sulami reliable in hadith?"
  ur: "کیا ابو عبد الرحمن سلمی حدیث میں ثقہ تھے؟"
summary:
  ar: "اتهمه معاصره محمد بن يوسف القطان بأنه غير ثقة وأنه كان يضع للصوفية الأحاديث، فردّ الخطيب البغدادي بأن قدره عند أهل بلده جليل وأنه صاحب حديث مجوّد، وصحّح ابن السبكي قول الخطيب، وقال الذهبي إنه ليس بالقوي في الحديث؛ وهذه الأقوال كما يجمعها محقق «طبقات الصوفية» {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 44} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 45} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 46}."
  en: "His contemporary Muhammad ibn Yusuf al-Qattan accused him of being unreliable and of fabricating hadith for the Sufis; al-Khatib al-Baghdadi answered that his standing among his townsmen was great and that he was a careful hadith scholar, Ibn al-Subki endorsed al-Khatib, and al-Dhahabi said he was not strong in hadith — the views as the editor of Tabaqat al-Sufiyya gathers them {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 44} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 45} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 46}."
  ur: "ان کے معاصر محمد بن یوسف قطان نے ان پر غیر ثقہ ہونے اور صوفیہ کے لیے احادیث گھڑنے کا الزام لگایا؛ خطیب بغدادی نے جواب دیا کہ اپنے شہر والوں میں ان کا مرتبہ بلند تھا اور وہ محتاط محدث تھے، ابن السبکی نے خطیب کے قول کی تائید کی، اور ذہبی نے کہا کہ وہ حدیث میں قوی نہیں — یہ اقوال جیسا کہ «طبقات الصوفیہ» کے محقق جمع کرتے ہیں {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 44} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 45} {cite:tabaqat-sufiyya-sulami-khanji-1986 p. 46}۔"
wings: [people, ideas]
