question:
  ar: "ما منزلة أبي عبد الرحمن السلمي عند نقاد الحديث؟"
  en: "How did the hadith critics rate Abu 'Abd al-Rahman al-Sulami?"
  ur: "ناقدینِ حدیث کے نزدیک ابو عبد الرحمن سلمی کا کیا مقام تھا؟"
issue:
  ar: "تهمة القطان للسلمي بالوضع وردود العلماء عليها."
  en: "Al-Qattan's charge of fabrication against al-Sulami and the scholars' responses."
  ur: "قطان کا سلمی پر وضع کا الزام اور اس پر علما کے جوابات۔"
short_answer:
  ar: "اتهمه القطان بالوضع؛ ودفع الخطيب ذلك ووثّقه ابن السبكي؛ وتوسط الذهبي فقال: ليس بالقوي في الحديث."
  en: "Al-Qattan accused him of fabrication; al-Khatib rejected this and Ibn al-Subki called him reliable; al-Dhahabi took a middle position: not strong in hadith."
  ur: "قطان نے وضع کا الزام لگایا؛ خطیب نے اسے رد کیا اور ابن السبکی نے ثقہ کہا؛ ذہبی نے درمیانی رائے دی: حدیث میں قوی نہیں۔"
sensitivity: contested
perspectives:
  - tradition: sunni
    id: qattan-unreliable
    standing: main
    stance:
      ar: "غير ثقة، وكان يضع للصوفية الأحاديث: قول محمد بن يوسف القطان"
      en: "Unreliable, and he fabricated hadith for the Sufis: the view of Muhammad ibn Yusuf al-Qattan"
      ur: "غیر ثقہ، اور صوفیہ کے لیے احادیث گھڑتے تھے: محمد بن یوسف قطان کا قول"
    summary:
      ar: "حدّث القطان الخطيب البغدادي بأن السلمي غير ثقة، لم يسمع من الأصم إلا يسيراً، فلما مات الحاكم ابن البيّع حدّث عن الأصم بتاريخ يحيى بن معين وبأشياء كثيرة سواه، وأنه كان يضع للصوفية الأحاديث."
      en: "Al-Qattan told al-Khatib al-Baghdadi that al-Sulami was unreliable, had heard only a little from al-Asamm, and after the death of al-Hakim Ibn al-Bayyi' narrated from al-Asamm Yahya ibn Ma'in's Ta'rikh and much else, and that he fabricated hadith for the Sufis."
      ur: "قطان نے خطیب بغدادی سے کہا کہ سلمی غیر ثقہ تھے، اصم سے تھوڑا ہی سنا تھا، اور حاکم ابن البیع کی وفات کے بعد اصم سے یحییٰ بن معین کی تاریخ اور بہت کچھ روایت کرنے لگے، اور صوفیہ کے لیے احادیث گھڑتے تھے۔"
    evidence:
