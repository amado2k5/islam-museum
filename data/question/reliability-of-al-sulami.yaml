      ar: "قد يكون وضع عبارات صوفية على ألسنة القوم: رأي بعض الباحثين المعاصرين كما يحكيه المحقق"
      en: "He may have put Sufi sayings into the mouths of the masters: the view of some contemporary researchers as the editor reports it"
      ur: "ممکن ہے انہوں نے صوفیانہ عبارتیں مشائخ کی زبان پر رکھ دی ہوں: بعض معاصر محققین کی رائے جیسا کہ محقق بیان کرتے ہیں"
    summary:
      ar: "يذكر المحقق أن بعض الباحثين المعاصرين لم يستبعد أن يكون السلمي وضع كثيراً من عبارات الصوفية على ألسنتهم بما يناسب مشاربهم، ويرى المحقق أن هذا الاتهام «مغالى فيه»، وأن في كتبه الصحيح والحسن والضعيف والموضوع كغيره ممن ألفوا في الحديث ولم يتفرغوا له."
      en: "The editor mentions that some contemporary researchers did not rule out that al-Sulami put many Sufi sayings into the masters' mouths to suit their leanings; the editor calls this charge 'exaggerated', saying his books contain sound, fair, weak and fabricated hadith alike, as with others who wrote on hadith without devoting themselves to it."
      ur: "محقق ذکر کرتے ہیں کہ بعض معاصر محققین نے یہ بعید نہیں سمجھا کہ سلمی نے بہت سی صوفیانہ عبارتیں ان کے مشربوں کے مطابق مشائخ کی زبان پر رکھ دیں؛ محقق اس الزام کو «مبالغہ آمیز» کہتے ہیں، کہ ان کی کتابوں میں صحیح، حسن، ضعیف اور موضوع سب ہیں، جیسا کہ ان دوسروں کی کتابوں میں جنہوں نے حدیث پر لکھا مگر اس کے لیے فارغ نہ ہوئے۔"
