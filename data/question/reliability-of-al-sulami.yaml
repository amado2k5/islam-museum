  - tradition: sunni
    id: khatib-subki-reliable
    standing: main
    stance:
      ar: "جليل القدر صاحب حديث مجوّد، وهو ثقة: قول الخطيب البغدادي وابن السبكي"
      en: "Of great standing and a careful hadith scholar, and reliable: the view of al-Khatib al-Baghdadi and Ibn al-Subki"
      ur: "بلند مرتبہ، محتاط محدث، اور ثقہ: خطیب بغدادی اور ابن السبکی کا قول"
    summary:
      ar: "علّق الخطيب على قول القطان بأن قدر أبي عبد الرحمن عند أهل بلده جليل، ومحله في طائفته كبير، وكان مع ذلك صاحب حديث مجوّداً؛ وقال صاحب طبقات الشافعية إن قول الخطيب هو الصحيح وإن أبا عبد الرحمن ثقة ولا عبرة بكلام القطان."
      en: "Al-Khatib commented on al-Qattan's words that Abu 'Abd al-Rahman's standing among his townsmen was great and his place in his community high, and that he was moreover a careful hadith scholar; the author of Tabaqat al-Shafi'iyya said al-Khatib's view is correct, Abu 'Abd al-Rahman is reliable, and al-Qattan's words count for nothing."
      ur: "خطیب نے قطان کے قول پر تبصرہ کیا کہ ابو عبد الرحمن کا اپنے شہر والوں میں مرتبہ بلند اور اپنی جماعت میں مقام بڑا تھا، اور وہ اس کے ساتھ محتاط محدث تھے؛ طبقات الشافعیہ کے مصنف نے کہا کہ خطیب کا قول درست ہے، ابو عبد الرحمن ثقہ ہیں اور قطان کی بات کا کوئی اعتبار نہیں۔"
