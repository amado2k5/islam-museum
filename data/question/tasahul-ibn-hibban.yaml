  - tradition: sunni
    id: sunni-ibn-hibban-nafsuh
    standing: main
    stance: { ar: "شرطه خمس خصال في كل راوٍ، والاعتبار حَكَم في المتكلَّم فيهم", en: "Five qualities in every narrator, with corroboration deciding the disputed ones", ur: "ہر راوی میں پانچ خصلتیں، اور متکلم فیہ راویوں میں اعتبار فیصلہ کن" }
    summary:
      ar: "ابن حبان في خطبته: لم يحتج إلا بحديث اجتمع في كل شيخ من رواته العدالة والصدق والعقل والعلم والتعري من التدليس، ويحتج بمن قدح فيه بعضهم إذا صح عنده بالاعتبار أنه ثقة، ويترك من صح عنده أنه غير عدل وإن وثقه بعضهم."
      en: "Ibn Hibban in his preface: he relied only on hadiths in which every shaykh had probity, truthfulness, understanding, knowledge and freedom from tadlis; he used narrators some had criticised once corroboration showed him they were trustworthy, and left those he found not upright even if some had vouched for them."
      ur: "ابن حبان اپنے خطبے میں: انہوں نے صرف اسی حدیث سے حجت پکڑی جس کے ہر شیخ میں عدالت، صدق، سمجھ، علم اور تدلیس سے خلو ہو؛ جن پر بعض نے جرح کی ان سے حجت پکڑی جب اعتبار سے ان کا ثقہ ہونا ثابت ہوا، اور جن کا غیر عادل ہونا ثابت ہوا انہیں چھوڑا خواہ بعض نے ان کی توثیق کی ہو۔"
