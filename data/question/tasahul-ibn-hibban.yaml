    standing: main
    stance: { ar: "يقارب الحاكم في التساهل، والحاكم أشد", en: "Close to al-Hakim in laxity, al-Hakim being laxer", ur: "تساہل میں حاکم کے قریب، مگر حاکم زیادہ متساہل" }
    summary:
      ar: "ابن الصلاح: الحاكم واسع الخطو في شرط الصحيح متساهل في القضاء به، ويقاربه في حكمه صحيح ابن حبان؛ والعراقي: لم يرد ترجيح المستدرك، بل المقاربة في التساهل، والحاكم أشد تساهلاً منه."
      en: "Ibn al-Salah: al-Hakim takes wide strides in the condition of soundness and is lax in pronouncing it, and Ibn Hibban's Sahih comes close to it in standing; al-'Iraqi: he did not mean that the Mustadrak ranks higher, only that they are close in laxity, al-Hakim being the laxer."
      ur: "ابن الصلاح: حاکم شرطِ صحیح میں وسیع قدم رکھتے اور اس کا حکم لگانے میں متساہل ہیں، اور صحیح ابن حبان حکم میں اس کے قریب ہے؛ عراقی: ان کی مراد المستدرک کو ترجیح دینا نہیں تھی، بلکہ تساہل میں قربت، اور حاکم زیادہ متساہل ہیں۔"
