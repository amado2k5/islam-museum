    stance: { ar: "لا بد من النظر في أحاديثه", en: "His hadiths still need examining", ur: "ان کی احادیث کو بھی جانچنا ضروری ہے" }
    summary:
      ar: "السخاوي: مقاربته الحاكم في التساهل تقتضي النظر في أحاديثه أيضاً، لأنه غير متقيد بالمعدَّلين وربما أخرج للمجهولين، ومذهبه إدراج الحسن في الصحيح؛ وعلى كل حال فلا بد من النظر للتمييز، حتى في صحيح ابن خزيمة."
      en: "Al-Sakhawi: being close to al-Hakim in laxity means his hadiths too must be examined, since he does not restrict himself to accredited narrators, sometimes includes unknown ones, and holds that hasan belongs within sound; in any case examination is needed to tell them apart, even in Ibn Khuzayma's Sahih."
      ur: "سخاوی: حاکم سے تساہل میں قربت کا تقاضا ہے کہ ان کی احادیث کو بھی جانچا جائے، کیونکہ وہ معدَّل راویوں تک محدود نہیں، بعض اوقات مجہول راویوں سے روایت لیتے ہیں، اور ان کا مذہب حسن کو صحیح میں داخل کرنا ہے؛ بہرحال امتیاز کے لیے جانچ ضروری ہے، صحیح ابن خزیمہ میں بھی۔"
