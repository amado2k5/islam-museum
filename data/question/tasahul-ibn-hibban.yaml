      en: "Al-Hazimi: Ibn Hibban is more capable in hadith than al-Hakim; Ibn Kathir: Ibn Khuzayma and Ibn Hibban committed themselves to soundness, and are far better than the Mustadrak and cleaner in chains and texts."
      ur: "حازمی: ابن حبان حدیث میں حاکم سے زیادہ پختہ ہیں؛ ابن کثیر: ابن خزیمہ اور ابن حبان نے صحت کا التزام کیا، اور وہ المستدرک سے بہت بہتر اور سند و متن میں زیادہ صاف ہیں۔"
