  - tradition: sunni
    id: sunni-ibn-hajar-wafa
    standing: main
    stance: { ar: "ليس تساهلاً بل اصطلاح، وقد وفّى بشروطه", en: "Not laxity but a convention, and he kept to his conditions", ur: "تساہل نہیں بلکہ اصطلاح، اور انہوں نے اپنی شرطیں پوری کیں" }
    summary:
      ar: "ابن حجر، كما ينقله السخاوي والسيوطي والبقاعي: إن كان التساهل باعتبار وجود الحسن في كتابه فهي مشاحة في الاصطلاح لأنه يسميه صحيحاً، وإن كان باعتبار خفة شروطه فإنه يجعل الراوي الذي لم يُعرف فيه جرح ولا تعديل، وشيخه والراوي عنه ثقتان، ولم يأت بمنكر، ثقة؛ وهذا دون شرط الحاكم، والحاصل أن ابن حبان وفّى بالتزام شروطه ولم يوفّ الحاكم."
      en: "Ibn Hajar, as al-Sakhawi, al-Suyuti and al-Biqa'i quote him: if the charge of laxity rests on the presence of hasan hadith in his book, that is a dispute over terms, since he calls it sound; if it rests on his light conditions, he counts as trustworthy a narrator with no known discreditation or accreditation whose teacher and student are both trustworthy and who brings nothing objectionable; this falls short of al-Hakim's stated condition, but in sum Ibn Hibban kept to his conditions and al-Hakim did not."
      ur: "ابن حجر، جیسا کہ سخاوی، سیوطی اور بقاعی نقل کرتے ہیں: اگر تساہل کی نسبت ان کی کتاب میں حسن کی موجودگی کی بنا پر ہے تو یہ اصطلاح کا جھگڑا ہے کیونکہ وہ اسے صحیح کہتے ہیں؛ اور اگر ان کی ہلکی شرطوں کی بنا پر ہے تو وہ اس راوی کو ثقہ مانتے ہیں جس پر نہ جرح معلوم ہو نہ تعدیل، جس کا شیخ اور شاگرد دونوں ثقہ ہوں اور جس نے کوئی منکر روایت نہ کی ہو؛ یہ حاکم کی بیان کردہ شرط سے کم ہے، مگر حاصل یہ کہ ابن حبان نے اپنی شرطوں کا التزام پورا کیا اور حاکم نے نہیں۔"
