id: question/tasahul-ibn-hibban
class: question
label:
  ar: "هل تساهل ابن حبان في تصحيح الحديث؟"
  en: "Was Ibn Hibban lax in authenticating hadith?"
  ur: "کیا ابن حبان حدیث کی تصحیح میں متساہل تھے؟"
summary:
  ar: "قال ابن الصلاح إن صحيح ابن حبان يقارب المستدرك في حكمه، ففهم منه بعضهم أنه مثله في التساهل؛ وفسّره العراقي بأنه أخف تساهلاً من الحاكم، ووافقه الحازمي وابن كثير على أنه أمكن وأنظف أسانيد؛ ونازع ابن حجر في نسبته إلى التساهل إلا من جهة إدخاله الحسن في الصحيح وخفة شرطه في الراوي غير المعروف بجرح ولا تعديل، وقال إنه وفّى بشروطه ولم يوفّ الحاكم {cite:sahih-ibn-hibban-shakir-maarif-v1 p. 11-15}."
  en: "Ibn al-Salah said that Ibn Hibban's Sahih comes close to the Mustadrak in standing, which some took to mean equally lax; al-'Iraqi explained it as less lax than al-Hakim, and al-Hazimi and Ibn Kathir agreed that it is firmer and cleaner in chains; Ibn Hajar disputed the charge of laxity except insofar as he counted hasan hadith as sound and set a light condition for a narrator known neither for discreditation nor for accreditation, and said he kept to his conditions where al-Hakim did not {cite:sahih-ibn-hibban-shakir-maarif-v1 p. 11-15}."
  ur: "ابن الصلاح نے کہا کہ صحیح ابن حبان حکم میں المستدرک کے قریب ہے، جس سے بعض نے سمجھا کہ وہ تساہل میں اسی جیسی ہے؛ عراقی نے اس کی تشریح یہ کی کہ وہ حاکم سے کم متساہل ہیں، اور حازمی اور ابن کثیر نے بھی کہا کہ وہ زیادہ پختہ اور سند میں صاف ہیں؛ ابن حجر نے ان کی طرف تساہل کی نسبت سے اختلاف کیا سوائے اس پہلو کے کہ وہ حسن کو صحیح میں شامل کرتے ہیں اور اس راوی کے لیے ہلکی شرط رکھتے ہیں جس پر نہ جرح معلوم ہو نہ تعدیل، اور کہا کہ انہوں نے اپنی شرطیں پوری کیں اور حاکم نے نہیں {cite:sahih-ibn-hibban-shakir-maarif-v1 p. 11-15}۔"
wings: [ideas, words]
themes: [scripture-and-its-sciences]
question:
  ar: "ما منزلة تصحيح ابن حبان بين أئمة الصحيح المجرد؟"
  en: "How does Ibn Hibban's authentication rank among the compilers of sound-only collections?"
  ur: "صحیح مجرد کے جامعین میں ابن حبان کی تصحیح کا کیا مقام ہے؟"
issue:
  ar: "هل إدخال ابن حبان حديث رواة لم يُعرف فيهم جرح ولا تعديل، وتسميته الحسن صحيحاً، تساهل في التصحيح أم اصطلاح له وفّى به؟"
  en: "Is Ibn Hibban's inclusion of narrators known for neither discreditation nor accreditation, and his calling hasan hadith sound, laxity in authentication, or a convention of his own that he kept to?"
  ur: "کیا ابن حبان کا ایسے راویوں کی حدیث لینا جن پر نہ جرح معلوم ہو نہ تعدیل، اور حسن کو صحیح کہنا، تصحیح میں تساہل ہے یا ان کی اپنی اصطلاح جس کی انہوں نے پابندی کی؟"
short_answer:
  ar: "يتفق من نقل عنهم شاكر على أنه دون صحيح ابن خزيمة وفوق المستدرك، ويختلفون في تسمية صنيعه تساهلاً: فمنهم من يقرنه بالحاكم في التساهل مع تخفيفه (ابن الصلاح، العراقي)، ومنهم من يرى أن ذلك مشاحة في الاصطلاح وأنه وفّى بشرطه (ابن حجر، ومن بعده شاكر)."
  en: "Those Shakir quotes agree that it ranks below Ibn Khuzayma's Sahih and above the Mustadrak, but differ over whether to call his practice laxity: some pair him with al-Hakim in laxity, to a lesser degree (Ibn al-Salah, al-'Iraqi); others see a dispute over terms only and hold that he kept to his condition (Ibn Hajar, and after him Shakir)."
  ur: "شاکر جن سے نقل کرتے ہیں وہ متفق ہیں کہ یہ صحیح ابن خزیمہ سے کم اور المستدرک سے بلند ہے، مگر اس پر اختلاف ہے کہ ان کے طریقے کو تساہل کہا جائے یا نہیں: بعض انہیں کم درجے میں تساہل میں حاکم کے ساتھ رکھتے ہیں (ابن الصلاح، عراقی)، اور بعض اسے صرف اصطلاح کا جھگڑا سمجھتے ہیں اور کہتے ہیں کہ انہوں نے اپنی شرط پوری کی (ابن حجر، اور ان کے بعد شاکر)۔"
