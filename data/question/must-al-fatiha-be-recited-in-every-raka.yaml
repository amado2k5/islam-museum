    id: other-quran-suffices
    standing: secondary
    stance: { ar: "لا تتعين، ويجزئ غيرها من القرآن", en: "Not fixed; other Qur'an suffices", ur: "متعین نہیں؛ دوسرا قرآن کافی" }
    summary:
      ar: "قال أبو حنيفة والثوري والأوزاعي: إن تركها عامدًا في صلاته كلها وقرأ غيرها أجزأه، على اختلاف عن الأوزاعي؛ وقال أبو يوسف ومحمد بن الحسن: أقله ثلاث آيات أو آية طويلة كآية الدين {cite:jami-ahkam-quran-resala-v1 p.181}. ويرد القرطبي على الكوفيين قولهم إن الفاتحة لا تتعين وإنها وغيرها سواء {cite:jami-ahkam-quran-resala-v1 p.189}."
      en: "Abu Hanifa, al-Thawri and al-Awza'i: if one deliberately leaves it out of the whole prayer and recites something else, it suffices — with a variant report from al-Awza'i; Abu Yusuf and Muhammad ibn al-Hasan: the minimum is three verses or one long verse such as the verse of debt {cite:jami-ahkam-quran-resala-v1 p.181}. Al-Qurtubi answers the Kufans' view that al-Fatiha is not fixed and is equal to any other part of the Qur'an {cite:jami-ahkam-quran-resala-v1 p.189}."
      ur: "ابو حنیفہ، ثوری اور اوزاعی: اگر کوئی پوری نماز میں جان بوجھ کر اسے چھوڑ دے اور کچھ اور پڑھے تو کافی ہے — اوزاعی سے مختلف روایت کے ساتھ؛ ابو یوسف اور محمد بن حسن: کم از کم تین آیات یا ایک لمبی آیت جیسے آیتِ دین {cite:jami-ahkam-quran-resala-v1 p.181}۔ قرطبی کوفیوں کے اس قول کا جواب دیتے ہیں کہ فاتحہ متعین نہیں اور قرآن کے کسی اور حصے کے برابر ہے {cite:jami-ahkam-quran-resala-v1 p.189}۔"
