id: question/must-al-fatiha-be-recited-in-every-raka
class: question
label:
  ar: "هل تتعين قراءة الفاتحة في كل ركعة من الصلاة؟"
  en: "Must al-Fatiha be recited in every rak'a of the prayer?"
  ur: "کیا نماز کی ہر رکعت میں سورۂ فاتحہ پڑھنا متعین ہے؟"
summary:
  ar: "يعرض القرطبي في «الجامع لأحكام القرآن» اختلاف الفقهاء في وجوب الفاتحة: مالك وأصحابه يعيّنونها للإمام والمنفرد في كل ركعة، والحسن البصري وأكثر أهل البصرة يكتفون بها مرة في الصلاة، وأبو حنيفة والثوري والأوزاعي يجيزون غيرها من القرآن، والطبري يوجب بدلها مثلها، ويختار القرطبي تعيينها في كل ركعة."
  en: "In al-Jami' li-Ahkam al-Qur'an al-Qurtubi sets out the jurists' disagreement on al-Fatiha: Malik and his school require it of the imam and the one praying alone in every rak'a; al-Hasan al-Basri and most Basrans hold once in the prayer suffices; Abu Hanifa, al-Thawri and al-Awza'i allow other Qur'an in its place; al-Tabari requires an equal substitute; al-Qurtubi prefers that it is required in every rak'a."
  ur: "قرطبی «الجامع لاحکام القرآن» میں فاتحہ کے وجوب پر فقہاء کا اختلاف بیان کرتے ہیں: مالک اور ان کے اصحاب اسے امام اور منفرد کے لیے ہر رکعت میں متعین کرتے ہیں؛ حسن بصری اور اکثر اہلِ بصرہ کے نزدیک نماز میں ایک بار کافی ہے؛ ابو حنیفہ، ثوری اور اوزاعی اس کی جگہ دوسرا قرآن جائز سمجھتے ہیں؛ طبری اس کے برابر بدل لازم کرتے ہیں؛ اور قرطبی ہر رکعت میں تعیین کو ترجیح دیتے ہیں۔"
question:
  ar: "هل الفاتحة ركن متعين في كل ركعة، أم تكفي مرة، أم يجزئ عنها غيرها من القرآن؟"
  en: "Is al-Fatiha a fixed requirement in every rak'a, is once enough, or may other Qur'an take its place?"
  ur: "کیا فاتحہ ہر رکعت میں متعین رکن ہے، یا ایک بار کافی ہے، یا اس کی جگہ دوسرا قرآن کافی ہے؟"
short_answer:
  ar: "ثلاثة اتجاهات سنية يذكرها القرطبي: التعيين في كل ركعة (مالك، والشافعي وأحمد، واختيار القرطبي)، والاكتفاء بمرة (الحسن البصري)، وإجزاء غيرها (أبو حنيفة والثوري والأوزاعي)، مع قول الطبري بالبدل المماثل."
  en: "Al-Qurtubi gives three Sunni lines: required in every rak'a (Malik, al-Shafi'i and Ahmad, and al-Qurtubi's choice), once suffices (al-Hasan al-Basri), other Qur'an suffices (Abu Hanifa, al-Thawri, al-Awza'i), with al-Tabari's view of an equal substitute."
  ur: "قرطبی تین سنی رجحانات بیان کرتے ہیں: ہر رکعت میں تعیین (مالک، شافعی و احمد، اور قرطبی کا اختیار)، ایک بار کافی (حسن بصری)، دوسرا قرآن کافی (ابو حنیفہ، ثوری، اوزاعی)، نیز طبری کا برابر بدل کا قول۔"
