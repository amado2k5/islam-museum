perspectives:
  - tradition: sunni
    id: every-raka
    standing: main
    stance: { ar: "متعينة في كل ركعة", en: "Required in every rak'a", ur: "ہر رکعت میں متعین" }
    summary:
      ar: "قال مالك وأصحابه: هي متعينة للإمام والمنفرد في كل ركعة؛ ونقل ابن خويز منداد أن قول مالك لم يختلف في أن من نسيها في ركعة من صلاة ركعتين بطلت صلاته، واختلف قوله في الرباعية والثلاثية {cite:jami-ahkam-quran-resala-v1 p.180} {cite:jami-ahkam-quran-resala-v1 p.181}. وهو قول الشافعي وأحمد، ويختاره القرطبي لحديث «لا صلاة لمن لم يقرأ فيها بفاتحة الكتاب» وحديث «فهي خداج» {cite:jami-ahkam-quran-resala-v1 p.183}."
      en: "Malik and his school: it is required of the imam and the one praying alone in every rak'a; Ibn Khuwayz Mandad reports that Malik never varied in holding that whoever forgot it in one rak'a of a two-rak'a prayer had an invalid prayer, though he varied on three- and four-rak'a prayers {cite:jami-ahkam-quran-resala-v1 p.180} {cite:jami-ahkam-quran-resala-v1 p.181}. This is the view of al-Shafi'i and Ahmad, and al-Qurtubi prefers it on the hadith 'there is no prayer for one who does not recite al-Fatiha in it' and the hadith that such a prayer is 'deficient' {cite:jami-ahkam-quran-resala-v1 p.183}."
      ur: "مالک اور ان کے اصحاب: یہ امام اور منفرد پر ہر رکعت میں متعین ہے؛ ابن خویز منداد نقل کرتے ہیں کہ مالک کا قول اس میں کبھی مختلف نہیں ہوا کہ دو رکعت والی نماز کی ایک رکعت میں جو اسے بھول جائے اس کی نماز باطل ہے، البتہ تین اور چار رکعت والی نماز میں ان کا قول مختلف رہا {cite:jami-ahkam-quran-resala-v1 p.180} {cite:jami-ahkam-quran-resala-v1 p.181}۔ یہی شافعی اور احمد کا قول ہے، اور قرطبی اسے حدیث «اس کی نماز نہیں جس نے اس میں فاتحہ نہ پڑھی» اور حدیثِ «خداج» کی بنا پر ترجیح دیتے ہیں {cite:jami-ahkam-quran-resala-v1 p.183}۔"
