    id: once-suffices
    standing: secondary
    stance: { ar: "تكفي مرة في الصلاة", en: "Once in the prayer suffices", ur: "نماز میں ایک بار کافی" }
    summary:
      ar: "قال الحسن البصري وأكثر أهل البصرة والمغيرة بن عبد الرحمن المخزومي: إذا قرأ بأم القرآن مرة واحدة في الصلاة أجزأه، لأنها صلاة قرئ فيها بأم القرآن؛ ويرى القرطبي أن سبب الخلاف احتمال الحديث: لا صلاة لمن لم يقرأ بها في كل ركعة، أو في أكثر الركعات {cite:jami-ahkam-quran-resala-v1 p.181}."
      en: "Al-Hasan al-Basri, most Basrans and al-Mughira ibn Abd al-Rahman al-Makhzumi: if one recites the Mother of the Book once in the prayer it suffices, since it is a prayer in which it was recited; al-Qurtubi traces the disagreement to what the hadith may mean — no prayer without it in every rak'a, or in most rak'as {cite:jami-ahkam-quran-resala-v1 p.181}."
      ur: "حسن بصری، اکثر اہلِ بصرہ اور مغیرہ بن عبد الرحمن مخزومی: اگر نماز میں ایک بار ام القرآن پڑھ لی تو کافی ہے، کیونکہ یہ ایسی نماز ہے جس میں وہ پڑھی گئی؛ قرطبی اختلاف کا سبب حدیث کے احتمال کو قرار دیتے ہیں — ہر رکعت میں اس کے بغیر نماز نہیں، یا اکثر رکعتوں میں {cite:jami-ahkam-quran-resala-v1 p.181}۔"
