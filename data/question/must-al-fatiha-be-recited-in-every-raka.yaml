    id: equal-substitute
    standing: secondary
    stance: { ar: "تُقرأ في كل ركعة، فإن لم تُقرأ فمثلها عددًا", en: "Recited in every rak'a, or else an equal amount", ur: "ہر رکعت میں پڑھی جائے، ورنہ اس کے برابر" }
    summary:
      ar: "قال الطبري: يقرأ المصلي بأم القرآن في كل ركعة، فإن لم يقرأ بها لم يجزه إلا مثلها من القرآن عدد آيها وحروفها؛ وقال ابن عبد البر: هذا لا معنى له، لأن النص عليها خصها بالحكم، ومحال أن يأتي بالبدل من تركها وهو قادر عليها {cite:jami-ahkam-quran-resala-v1 p.182}."
      en: "Al-Tabari: the one praying recites the Mother of the Book in every rak'a, and if he does not, nothing suffices but an equal amount of the Qur'an in verses and letters; Ibn Abd al-Barr: this makes no sense, for naming it singled it out for the ruling, and one who could recite it cannot offer a substitute for it {cite:jami-ahkam-quran-resala-v1 p.182}."
      ur: "طبری: نمازی ہر رکعت میں ام القرآن پڑھے، اور اگر نہ پڑھے تو آیات اور حروف کی تعداد میں اس کے برابر قرآن کے سوا کچھ کافی نہیں؛ ابن عبد البر: اس کا کوئی معنی نہیں، کیونکہ اس کی تصریح نے اسے حکم کے ساتھ خاص کیا، اور جو اسے پڑھنے پر قادر ہو وہ اس کا بدل نہیں لا سکتا {cite:jami-ahkam-quran-resala-v1 p.182}۔"
