class: question
label:
  ar: كيف بدأ الوحي؟
summary:
  ar: "بالرؤيا الصادقة ستة أشهر، ثم بمجيء الملك في غار حراء بأوائل سورة العلق في رمضان وللنبي أربعون سنة، ثم فترة قصيرة، ثم نزول أوائل المدثر بأمر القيام والإنذار، في عرض الرحيق المختوم."
question:
  ar: كيف بدأ الوحي؟
short_answer:
  ar: "بالرؤيا الصادقة ستة أشهر، ثم بمجيء الملك في غار حراء بأوائل سورة العلق في رمضان وللنبي أربعون سنة، ثم فترة قصيرة، ثم نزول أوائل المدثر بأمر القيام والإنذار، في عرض الرحيق المختوم."
long_answer:
  ar: |
    يعرض الرحيق المختوم بدء الوحي على مراحل: خلوة النبي في [[place/ghar-hira|غار حراء]] قبل البعثة بثلاث سنين، ثم الرؤيا الصادقة ستة أشهر، ثم مجيء الملك في رمضان بأوائل سورة العلق كما في حديث عائشة، كما في [[event/first-revelation|بدء الوحي]] {cite:mubarakpuri-raheeq p.65} {cite:mubarakpuri-raheeq p.66} {cite:mubarakpuri-raheeq p.67}.
    ثم رجوعه إلى خديجة وورقة بن نوفل، ثم [[event/fatrat-al-wahy|فترة الوحي]] التي يرجّح المؤلف أنها أيام، ثم [[event/second-revelation-al-muddaththir|نزول المدثر]] بأمر القيام والإنذار وتتابع الوحي بعده {cite:mubarakpuri-raheeq p.68} {cite:mubarakpuri-raheeq p.69} {cite:mubarakpuri-raheeq p.70}.
    ويقيّد المؤلف أن في شهر البعثة ويومها خلافاً بين المؤرخين، وأن ترجيحه ليوم 21 رمضان اجتهاد منه، ويستطرد في [[concept/maratib-al-wahy|مراتب الوحي]] عن ابن القيم {cite:mubarakpuri-raheeq p.66} {cite:mubarakpuri-raheeq p.70}.
