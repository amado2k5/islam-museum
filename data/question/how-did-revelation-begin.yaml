id: question/how-did-revelation-begin
class: question
label:
  ar: كيف بدأ الوحي؟
  en: How did revelation begin?
  es: "¿Cómo comenzó la revelación?"
  fr: "Comment l'Apocalypse a-t-elle commencé ?"
  ur: "وحی کا آغاز کیسے ہوا؟"
  tr: "İlham nasıl başladı?"
  id: "Bagaimana inspirasi dimulai?"
summary:
  ar: "بالرؤيا الصادقة ستة أشهر، ثم بمجيء الملك في غار حراء بأوائل سورة العلق في رمضان وللنبي أربعون سنة، ثم فترة قصيرة، ثم نزول أوائل المدثر بأمر القيام والإنذار، في عرض الرحيق المختوم."
  en: "It began with true dreams for six months, then with the angel's coming to the cave of Hira in Ramadan, bringing the opening verses of Surat al-Alaq when the Prophet was forty years old; then a short pause, then the descent of the opening verses of al-Muddaththir, with the command to arise and warn, as presented in al-Raheeq al-Makhtum."
  es: "Comenzó con sueños verdaderos durante seis meses, luego con la llegada del ángel a la cueva de Hira en Ramadán, trayendo los versículos iniciales de la Sura al-Alaq cuando el Profeta tenía cuarenta años; luego una breve pausa, luego el descenso de los versículos iniciales de al-Muddaththir, con la orden de levantarse y advertir, como se presenta en al-Raheeq al-Makhtum."
  fr: "Tout commença par de véritables rêves pendant six mois, puis par la venue de l'ange dans la grotte de Hira pendant le Ramadan, apportant les premiers versets de la sourate al-Alaq lorsque le Prophète avait quarante ans; puis une courte pause, puis la descente des premiers versets d'al-Muddaththir, avec l'ordre de se lever et d'avertir, comme présenté dans al-Raheeq al-Makhtum."
  ur: "اس کا آغاز چھ ماہ کے سچے خوابوں سے ہوا، پھر رمضان میں فرشتے کا غار حرا میں آنا، سورۃ العلق کی ابتدائی آیات لانا جب نبی کی عمر چالیس سال تھی۔ پھر ایک مختصر وقفہ، پھر المدثر کی ابتدائی آیات کا نزول، اٹھنے اور تنبیہ کرنے کے حکم کے ساتھ، جیسا کہ الرحیق المختم میں پیش کیا گیا ہے۔"
  tr: "Gerçek vizyonla altı ay boyunca, ardından Ramazan ayında El-'Alaq Suresi'nin başında Hira Mağarası'nda kralın gelmesiyle ve Peygamber kırk yıl yaşadı, ardından kısa bir dönem, ardından ilk Örtülü dönem ayağa kalkma ve uyarı emriyle, mühürlü nektar sergisi yaptı."
  id: "Dengan penglihatan sejati selama enam bulan, kemudian kedatangan raja di Gua Hira pada awal Surah Al-'Alaq di bulan Ramadan, dan Nabi hidup selama empat puluh tahun, kemudian singkat, kemudian pertama kali Tertutup dengan perintah berdiri dan memperingatkan, dalam pertunjukan nektar yang tersegel."
question:
  ar: كيف بدأ الوحي؟
short_answer:
  ar: "بالرؤيا الصادقة ستة أشهر، ثم بمجيء الملك في غار حراء بأوائل سورة العلق في رمضان وللنبي أربعون سنة، ثم فترة قصيرة، ثم نزول أوائل المدثر بأمر القيام والإنذار، في عرض الرحيق المختوم."
long_answer:
  ar: |
    يعرض الرحيق المختوم بدء الوحي على مراحل: خلوة النبي في [[place/ghar-hira|غار حراء]] قبل البعثة بثلاث سنين، ثم الرؤيا الصادقة ستة أشهر، ثم مجيء الملك في رمضان بأوائل سورة العلق كما في حديث عائشة، كما في [[event/first-revelation|بدء الوحي]] {cite:mubarakpuri-raheeq p.65} {cite:mubarakpuri-raheeq p.66} {cite:mubarakpuri-raheeq p.67}.
    ثم رجوعه إلى خديجة وورقة بن نوفل، ثم [[event/fatrat-al-wahy|فترة الوحي]] التي يرجّح المؤلف أنها أيام، ثم [[event/second-revelation-al-muddaththir|نزول المدثر]] بأمر القيام والإنذار وتتابع الوحي بعده {cite:mubarakpuri-raheeq p.68} {cite:mubarakpuri-raheeq p.69} {cite:mubarakpuri-raheeq p.70}.
    ويقيّد المؤلف أن في شهر البعثة ويومها خلافاً بين المؤرخين، وأن ترجيحه ليوم 21 رمضان اجتهاد منه، ويستطرد في [[concept/maratib-al-wahy|مراتب الوحي]] عن ابن القيم {cite:mubarakpuri-raheeq p.66} {cite:mubarakpuri-raheeq p.70}.
