class: question
label:
  ar: كيف كان المجتمع العربي قبل الإسلام؟
  en: What was Arab society like before Islam?
summary:
  ar: مجتمع قبلي أساسه العصبية؛ المرأة معززة في الأشراف ومهانة في أوساط أخرى، وفيه أنكحة متعددة والوأد وشيوع الزنا، ومعاشه التجارة في الأشهر الحرم والرعي، وفيه أخلاق كريمة كالكرم والوفاء وعزة النفس، في عرض الرحيق المختوم.
  en: "A tribal society founded on group solidarity (asabiyya): women were honoured among the nobles and humiliated in other circles; there were several forms of marriage, the burying of daughters alive, and the spread of zina; livelihood came from trade in the sacred months and from herding; and it had noble qualities such as generosity, loyalty and self-respect, as presented in al-Raheeq al-Makhtum."
