question:
  ar: كيف كان المجتمع العربي قبل الإسلام؟
short_answer:
  ar: مجتمع قبلي أساسه العصبية؛ المرأة معززة في الأشراف ومهانة في أوساط أخرى، وفيه أنكحة متعددة والوأد وشيوع الزنا، ومعاشه التجارة في الأشهر الحرم والرعي، وفيه أخلاق كريمة كالكرم والوفاء وعزة النفس، في عرض الرحيق المختوم.
long_answer:
  ar: |
    يصف الرحيق المختوم مجتمعاً تتنوع أوساطه: كانت المرأة في الأشراف محترمة مصونة لها حرية الإرادة، وكانت في أوساط أخرى أنواع من الاختلاط وأنكحة أربعة في حديث عائشة، وتعدد بلا حد، والطلاق بيد الرجال، وشيوع للزنا، كما يعرض مدخل [[concept/social-condition-jahiliyya|الحالة الاجتماعية]] {cite:mubarakpuri-raheeq p.43} {cite:mubarakpuri-raheeq p.44}.
    وكان أساس النظام الاجتماعي العصبية القبلية، والعلاقة بين القبائل مفككة تخففها الأشهر الحرم، وفيهم من يئد البنات وإن لم يكن ذلك سائداً {cite:mubarakpuri-raheeq p.45}.
    ومعاشهم التجارة التي لا تتيسر إلا في الأشهر الحرم وأسواقها كعكاظ، والزراعة والرعي، مع فقر عام، كما يعرض مدخل [[concept/economic-condition-jahiliyya|الحالة الاقتصادية]] {cite:mubarakpuri-raheeq p.46}؛ وكانت فيهم أخلاق كريمة: الكرم والوفاء بالعهد وعزة النفس والمضي في العزائم والصدق، كما يعرض مدخل [[concept/jahili-virtues|أخلاق أهل الجاهلية]] {cite:mubarakpuri-raheeq p.46} {cite:mubarakpuri-raheeq p.47}.
