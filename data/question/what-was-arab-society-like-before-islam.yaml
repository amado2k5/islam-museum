id: question/what-was-arab-society-like-before-islam
class: question
label:
  ar: كيف كان المجتمع العربي قبل الإسلام؟
  en: What was Arab society like before Islam?
  es: "¿Cómo era la sociedad árabe antes del Islam?"
  fr: "À quoi ressemblait la société arabe avant l'islam ?"
summary:
  ar: مجتمع قبلي أساسه العصبية؛ المرأة معززة في الأشراف ومهانة في أوساط أخرى، وفيه أنكحة متعددة والوأد وشيوع الزنا، ومعاشه التجارة في الأشهر الحرم والرعي، وفيه أخلاق كريمة كالكرم والوفاء وعزة النفس، في عرض الرحيق المختوم.
  en: "A tribal society founded on group solidarity (asabiyya): women were honoured among the nobles and humiliated in other circles; there were several forms of marriage, the burying of daughters alive, and the spread of zina; livelihood came from trade in the sacred months and from herding; and it had noble qualities such as generosity, loyalty and self-respect, as presented in al-Raheeq al-Makhtum."
  es: "Una sociedad tribal fundada en la solidaridad grupal (asabiyya): las mujeres eran honradas entre los nobles y humilladas en otros círculos; existían varias formas de matrimonio, el entierro de hijas vivas y la propagación del zina; el sustento provenía del comercio en los meses sagrados y del pastoreo; y poseía cualidades nobles como la generosidad, la lealtad y el respeto a sí misma, como se presenta en al-Raheeq al-Makhtum."
  fr: "Une société tribale fondée sur la solidarité de groupe (asabiyya): les femmes étaient honorées parmi les nobles et humiliées dans les autres milieux; il existait plusieurs formes de mariage, l’enterrement vivant des filles et la diffusion de la zina; les moyens de subsistance provenaient du commerce pendant les mois sacrés et de l’élevage; et elle possédait des qualités nobles telles que la générosité, la loyauté et le respect de soi, comme présenté dans al-Raheeq al-Makhtum."
