  - tradition: sunni
    id: sunni-khadija
    standing: main
    stance: { ar: "خديجة", en: "Khadija" }
    summary:
      ar: "قال النووي زيادة على ابن الصلاح: وهو الصواب عند جماعة من المحققين، وروي عن ابن عباس والزهري، وهو قول قتادة وابن إسحاق، وادعى الثعلبي فيه الإجماع وأن الخلاف فيمن بعدها؛ وقال ابن عبد البر: اتفقوا على أن خديجة أول من آمن ثم علي، وأن أبا بكر أول من أظهر إسلامه."
      en: "Al-Nawawi, adding to Ibn al-Salah, called it correct according to a group of verifiers; it is reported from Ibn Abbas and al-Zuhri and is the view of Qatada and Ibn Ishaq; al-Tha'labi claimed consensus on it, the dispute being over who came after her; Ibn Abd al-Barr said they agreed that Khadija was first to believe, then Ali, and that Abu Bakr was the first to make his Islam public."
