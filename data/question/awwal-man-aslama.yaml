id: question/awwal-man-aslama
class: question
label:
  ar: "من أول من أسلم؟"
  en: "Who was the first to accept Islam?"
summary:
  ar: "مسألة اختلف فيها أهل الحديث والسير: من أول الناس إسلاماً بعد بعثة النبي؟ جمع السيوطي في «تدريب الراوي» أقوال من قال أبو بكر، ومن قال علي، ومن قال زيد بن حارثة، ومن قال خديجة، وأقوالاً أخرى، ثم نقل الجمع الذي اختاره ابن الصلاح والنووي: من الرجال الأحرار أبو بكر، ومن الصبيان علي، ومن النساء خديجة، ومن الموالي زيد، ومن العبيد بلال {cite:tadrib-rawi-awwama-v5 p. 211-222}."
  en: "A question on which hadith and sira scholars differ: who was the first person to accept Islam after the Prophet's call? In Tadrib al-Rawi al-Suyuti gathers those who said Abu Bakr, those who said Ali, those who said Zayd ibn Haritha, those who said Khadija, and other views, then reports the reconciliation chosen by Ibn al-Salah and al-Nawawi: of free men Abu Bakr, of boys Ali, of women Khadija, of freedmen Zayd, of slaves Bilal."
wings: [people, time]
themes: [converts-and-leavers]
periods: [period/prophetic-era]
question:
  ar: "أيّ الصحابة سبق إلى الإسلام أولاً؟"
  en: "Which of the Companions was first to embrace Islam?"
issue:
  ar: "اختلاف الروايات في أول من أسلم، ووجه الجمع بينها."
  en: "The differing reports on who first accepted Islam, and how they are reconciled."
short_answer:
  ar: "قيل أبو بكر، وقيل علي، وقيل زيد بن حارثة، وقيل خديجة وهو الصواب عند جماعة من المحققين كما قال النووي؛ والأورع عند ابن الصلاح والنووي أن يقال: من الرجال الأحرار أبو بكر، ومن الصبيان علي، ومن النساء خديجة، ومن الموالي زيد، ومن العبيد بلال، ويحكى هذا الجمع عن أبي حنيفة."
  en: "Some said Abu Bakr, some Ali, some Zayd ibn Haritha, and some Khadija, which al-Nawawi called correct according to a group of verifiers; the most scrupulous course, for Ibn al-Salah and al-Nawawi, is to say: of free men Abu Bakr, of boys Ali, of women Khadija, of freedmen Zayd, of slaves Bilal, a reconciliation also reported from Abu Hanifa."
perspectives:
  - tradition: sunni
    id: sunni-abu-bakr
    standing: main
    stance: { ar: "أبو بكر", en: "Abu Bakr" }
    summary:
      ar: "قاله ابن عباس وحسان والشعبي والنخعي في آخرين، واستُدل له بحديث عمرو بن عبسة في مسلم: معه يومئذ أبو بكر وبلال، وبأبيات حسان «وأول الناس منهم صدّق الرسلا»؛ ويذكر المحقق عوامة أنه نُسب إلى الجمهور بل ادُّعي عليه الإجماع."
      en: "Held by Ibn Abbas, Hassan, al-Sha'bi and al-Nakha'i among others, supported by the hadith of Amr ibn Abasa in Muslim that with the Prophet that day were Abu Bakr and Bilal, and by Hassan's verses calling Abu Bakr the first of men to believe the Messenger; the editor Awwama notes it has been ascribed to the majority and even claimed as consensus."
