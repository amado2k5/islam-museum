    summary:
      ar: "قال الزهري: زيد بن حارثة؛ وذكر عمر بن شبة أن خالد بن سعيد بن العاص أسلم قبل علي، وحكى المسعودي قولين بخباب بن الأرت وبلال؛ وقال العراقي: ينبغي أن يقال إن أول من آمن من الرجال ورقة بن نوفل، لحديث بدء الوحي."
      en: "Al-Zuhri said Zayd ibn Haritha; Umar ibn Shabba said Khalid ibn Sa'id ibn al-As accepted Islam before Ali; al-Mas'udi reported views naming Khabbab ibn al-Aratt and Bilal; al-Iraqi said one should say the first man to believe was Waraqa ibn Nawfal, on the strength of the hadith of the beginning of revelation."
