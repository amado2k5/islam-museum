    id: sunni-ali
    standing: main
    stance: { ar: "علي بن أبي طالب", en: "Ali ibn Abi Talib" }
    summary:
      ar: "رواه الطبراني بسند صحيح عن ابن عباس، ورُوي عن زيد بن أرقم والمقداد وأبي أيوب وأنس وجابر وأبي سعيد وغيرهم، وادعى الحاكم إجماع أهل التواريخ عليه ونوزع في ذلك."
      en: "Reported by al-Tabarani with a sound chain from Ibn Abbas, and from Zayd ibn Arqam, al-Miqdad, Abu Ayyub, Anas, Jabir, Abu Sa'id and others; al-Hakim claimed the historians agreed on it, and this was disputed."
