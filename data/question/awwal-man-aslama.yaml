    summary:
      ar: "قال ابن الصلاح وتبعه النووي: الأورع أن يقال: من الرجال الأحرار أبو بكر، ومن الصبيان علي، ومن النساء خديجة، ومن الموالي زيد، ومن العبيد بلال؛ قال البرماوي: ويحكى هذا الجمع عن أبي حنيفة، وأخرجه عنه الحاكم كما يقول السيوطي."
