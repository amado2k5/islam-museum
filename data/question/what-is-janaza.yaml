id: question/what-is-janaza
class: question
label:
  ar: "ما صلاة الجنازة؟"
  en: What is the funeral prayer?
  es: "¿Cuál es la oración fúnebre?"
  fr: "Quelle est la prière funéraire ?"
  ur: "نماز جنازہ کیا ہے؟"
summary:
  ar: "صلاة الجنازة دعاء للميت وقوفاً بلا ركوع ولا سجود، أربع تكبيرات بالفاتحة والصلاة على النبي والدعاء، وهي فريضة كفاية."
  en: "The funeral prayer is supplication for the deceased, performed standing without bowing or prostration. It consists of four takbirs, with the Fatiha, blessings upon the Prophet and supplication, and it is a collective obligation (fard kifaya)."
  es: "La oración fúnebre es una súplica por el difunto, que se realiza de pie, sin inclinarse ni postrarse. Consta de cuatro takbirs, con la Fatiha, bendiciones sobre el Profeta y súplica, y es una obligación colectiva (fard kifaya)."
  fr: "La prière funéraire est une invocation pour le défunt, accomplie debout sans s'incliner ni se prosterner. Elle comprend quatre takbirs, la Fatiha, les bénédictions sur le Prophète et l'invocation, et constitue une obligation collective (fard kifaya)."
  ur: "نماز جنازہ میت کے لیے دعا ہے، بغیر رکوع و سجود کے کھڑے ہو کر ادا کی جاتی ہے۔ یہ چار تکبیروں پر مشتمل ہے جس میں فاتحہ، درود رسول اور دعا ہے اور یہ ایک اجتماعی فریضہ ہے۔"
wings: []
question:
  ar: "ما صلاة الجنازة؟"
short_answer:
  ar: "صلاة الجنازة دعاء للميت وقوفاً بلا ركوع ولا سجود، أربع تكبيرات بالفاتحة والصلاة على النبي والدعاء، وهي فريضة كفاية."
long_answer:
  ar: |
    صلاة الجنازة من حقوق الميت في الشرع، وصفاتها وردت في الصحيحين {cite:sahih-al-bukhari}.
    ويعرض مدخل [[practice/salat-al-janaza|صلاة الجنازة]] صفتها وحكمها.

