id: question/what-is-janaza
class: question
label:
  ar: "ما صلاة الجنازة؟"
  en: What is the funeral prayer?
summary:
  ar: "صلاة الجنازة دعاء للميت وقوفاً بلا ركوع ولا سجود، أربع تكبيرات بالفاتحة والصلاة على النبي والدعاء، وهي فريضة كفاية."
  en: "The funeral prayer is supplication for the deceased, performed standing without bowing or prostration. It consists of four takbirs, with the Fatiha, blessings upon the Prophet and supplication, and it is a collective obligation (fard kifaya)."
wings: []
question:
  ar: "ما صلاة الجنازة؟"
short_answer:
  ar: "صلاة الجنازة دعاء للميت وقوفاً بلا ركوع ولا سجود، أربع تكبيرات بالفاتحة والصلاة على النبي والدعاء، وهي فريضة كفاية."
long_answer:
  ar: |
    صلاة الجنازة من حقوق الميت في الشرع، وصفاتها وردت في الصحيحين {cite:sahih-al-bukhari}.
    ويعرض مدخل [[practice/salat-al-janaza|صلاة الجنازة]] صفتها وحكمها.

