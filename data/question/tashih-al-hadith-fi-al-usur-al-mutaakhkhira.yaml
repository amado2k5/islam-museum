id: question/tashih-al-hadith-fi-al-usur-al-mutaakhkhira
class: question
label:
  ar: "هل يجوز للمتأخر أن يصحح حديثاً لم يصححه الأئمة؟"
  en: "May a later scholar declare a hadith sound that the earlier imams did not?"
summary:
  ar: "مسألة في علوم الحديث أثارها ابن الصلاح: إذا وُجد في أجزاء الحديث حديث صحيح الإسناد لم يخرجه الشيخان ولم ينص إمام معتمد على صحته، فهل يُجزم بصحته؟ ذهب ابن الصلاح إلى المنع لتعذر الاستقلال بإدراك الصحيح في عصره، وخالفه النووي وغيره كما ينقل المحقق نور الدين عتر {cite:muqaddima-ibn-salah-itr p. 16-17}."
  en: "A question in the hadith sciences raised by Ibn al-Salah: when a hadith with a sound-looking chain turns up in the hadith booklets, not in the two Sahihs and not declared sound by any recognised imam, may one affirm that it is sound? Ibn al-Salah held that one may not, since independent recognition of the sound had become impracticable in his age; al-Nawawi and others disagreed, as the editor Nur al-Din Itr reports."
wings: [ideas, words]
themes: [scripture-and-its-sciences]
question:
  ar: "هل بقي بابُ الحكم بصحة الحديث بالنظر في إسناده مفتوحاً للمتأخرين؟"
  en: "Does the door to judging a hadith sound by examining its chain remain open to later scholars?"
issue:
  ar: "هل ينحصر معرفة الصحيح والحسن بعد عصر الرواية فيما نص عليه الأئمة في كتبهم المعتمدة؟"
  en: "After the age of transmission, is knowledge of the sound and the good confined to what the imams stated in their recognised books?"
short_answer:
  ar: "قال ابن الصلاح: لا نتجاسر على جزم الحكم بصحته، وآل الأمر إلى الاعتماد على ما نص عليه أئمة الحديث في تصانيفهم المعتمدة المشهورة؛ وقال النووي: الأظهر جوازه لمن تمكن وقويت معرفته، وذكر العراقي أن عمل أهل الحديث على ما رجحه النووي."
  en: "Ibn al-Salah said that one should not venture to affirm its soundness, and that the matter had come to rest on what the hadith imams stated in their recognised, widely known works; al-Nawawi said it is more evident that this is allowed to one who is capable and of strong knowledge, and al-Iraqi said the practice of hadith scholars follows al-Nawawi's preference."
perspectives:
  - tradition: sunni
    id: sunni-ibn-al-salah-man
    standing: main
    stance: { ar: "المنع: الاعتماد على تنصيص الأئمة", en: "Not allowed: rely on the imams' statements" }
    summary:
      ar: "ابن الصلاح: تعذر في هذه الأعصار الاستقلال بإدراك الصحيح بمجرد اعتبار الأسانيد، لأنه ما من إسناد إلا وفي رجاله من اعتمد في روايته على ما في كتابه عرياً عما يشترط في الصحيح من الحفظ والضبط والإتقان، فصار معظم المقصود من الأسانيد المتداولة إبقاء سلسلة الإسناد."
      en: "Ibn al-Salah: in these ages independent recognition of the sound by examining chains alone has become impracticable, because every chain includes men who relied on what was in their books without the memory, precision and mastery required for the sound; the chief purpose of the chains in circulation has become to keep the chain of transmission alive."
    holders: [person/ibn-al-salah]
    sources: [source/muqaddima-ibn-salah-itr]
  - tradition: sunni
    id: sunni-nawawi-jawaz
    standing: main
    stance: { ar: "الجواز لمن تمكن", en: "Allowed to the capable" }
    summary:
      ar: "النووي، كما ينقله المحقق عتر: الأظهر عندي جوازه لمن تمكن وقويت معرفته؛ وقال العراقي إن ما رجحه النووي هو الذي عليه عمل أهل الحديث. ويرى المحقق أن الأحوط أن يقال «صحيح الإسناد» ولا يُطلق التصحيح."
      en: "Al-Nawawi, as the editor Itr quotes him: to me it is more evident that it is allowed to one who is capable and of strong knowledge; al-Iraqi said that al-Nawawi's preference is what hadith scholars act on. The editor adds that the more cautious course is to say 'sound in chain' rather than declare the hadith sound outright."
