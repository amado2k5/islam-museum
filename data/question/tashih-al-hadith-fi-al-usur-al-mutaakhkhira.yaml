    sources: [source/muqaddima-ibn-salah-itr]
  - tradition: sunni
    id: sunni-suyuti-tawfiq
    standing: secondary
    stance: { ar: "التوفيق بين القولين", en: "Reconciling the two views" }
    summary:
      ar: "السيوطي في رسالة «التنقيح لمسألة التصحيح»، كما يلخصها عتر: التصحيح الذي منعه ابن الصلاح هو الحكم بأن الحديث صحيح لذاته، والذي أجازه الآخرون هو الحكم بأنه صحيح لغيره، وبنى ذلك على استقراء صنيعهم."
      en: "Al-Suyuti, in his treatise al-Tanqih li-Mas'alat al-Tashih, as Itr summarises it: the authentication Ibn al-Salah forbade is judging a hadith sound in itself, and what the others allowed is judging it sound through other support; he based this on a survey of their practice."
