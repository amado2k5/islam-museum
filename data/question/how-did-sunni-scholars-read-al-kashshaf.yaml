    stance: { ar: "من أحسن التفاسير في اللغة والإعراب والبلاغة", en: "Among the best commentaries for language, grammar and rhetoric", ur: "لغت، اعراب اور بلاغت میں بہترین تفسیروں میں سے" }
    summary:
      ar: "يقول ابن خلدون إن من أحسن ما اشتمل عليه هذا الفن من التفاسير كتاب الكشاف، ويدعو إلى اغتنام مطالعته لغرابة فنونه في اللسان؛ ويقول التاج السبكي إنه كتاب عظيم في بابه ومصنفه إمام في فنه؛ ويرى المعتني خليل مأمون شيحا أنه من خير ما يُرجع إليه في البلاغة رغم نزعته الاعتزالية، وأن أغلب التفاسير بعده أخذت منه {cite:kashshaf-dar-al-marifa-shiha-2009 p.12} {cite:kashshaf-dar-al-marifa-shiha-2009 p.13}."
      en: "Ibn Khaldun says that among the best commentaries in this art is al-Kashshaf, and urges reading it for the rarity of its linguistic arts; Taj al-Din al-Subki calls it a great book in its field and its author a master of his art; its editor Khalil Ma'mun Shiha holds it among the best references for rhetoric despite its Mu'tazili bent, and says most later commentaries drew on it {cite:kashshaf-dar-al-marifa-shiha-2009 p.12} {cite:kashshaf-dar-al-marifa-shiha-2009 p.13}."
      ur: "ابن خلدون کہتے ہیں کہ اس فن کی بہترین تفسیروں میں الکشاف ہے اور زبان میں اس کے نادر فنون کی وجہ سے اس کے مطالعے کو غنیمت سمجھنے کی دعوت دیتے ہیں؛ تاج الدین سبکی اسے اپنے باب میں عظیم کتاب اور مصنف کو اپنے فن کا امام کہتے ہیں؛ معتنی خلیل مامون شیحا اسے اعتزالی رجحان کے باوجود بلاغت کے بہترین مراجع میں شمار کرتے اور کہتے ہیں کہ بعد کی اکثر تفسیروں نے اس سے لیا {cite:kashshaf-dar-al-marifa-shiha-2009 p.12} {cite:kashshaf-dar-al-marifa-shiha-2009 p.13}۔"
