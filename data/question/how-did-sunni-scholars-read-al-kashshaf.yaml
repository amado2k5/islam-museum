      ur: "ابن المنیر مالکی، قاضیِ اسکندریہ، نے «الانتصاف فیما تضمنہ الکشاف من الاعتزال» کے نام سے حاشیہ لکھا، جس میں زمخشری سے بحث کی اور ان کے اعتزالی اقوال کا رد کیا؛ اپنی سختی کے باوجود وہ کئی جگہ ان کی دقتِ نظر اور بلاغی نکات کی خوبی کا اعتراف کرتے ہیں {cite:kashshaf-dar-al-marifa-shiha-2009 p.13} {cite:kashshaf-dar-al-marifa-shiha-2009 p.16}۔"
