    summary:
      ar: "كتب ابن المنير المالكي، قاضي الإسكندرية، حاشية سماها «الانتصاف فيما تضمنه الكشاف من الاعتزال» جادل فيها الزمخشري ورد أقواله الاعتزالية، وكان شديدًا عليه، لكنه يعترف في مواضع بدقة نظره ومحاسن نكته البلاغية {cite:kashshaf-dar-al-marifa-shiha-2009 p.13} {cite:kashshaf-dar-al-marifa-shiha-2009 p.16}."
