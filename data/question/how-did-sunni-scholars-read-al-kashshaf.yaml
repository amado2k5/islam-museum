  - tradition: other
    id: mutazili-self-description
    standing: other
    stance: { ar: "رأي المعتزلة كما يعبّر عنه الزمخشري: أهل العدل والتوحيد", en: "The Mu'tazili view as al-Zamakhshari states it: the people of justice and divine unity", ur: "معتزلہ کی رائے جیسا کہ زمخشری بیان کرتے ہیں: اہلِ عدل و توحید" }
    summary:
      ar: "يقول الزمخشري في مقدمته إنه ألّفه لإخوانه «من أفاضل الفئة الناجية العدلية» الجامعين بين علم العربية والأصول الدينية، وبطلب من «علماء العدل والتوحيد»، ويفسر «أولي العلم» في آية الشهادة بأنهم الذين يثبتون وحدانيته وعدله بالحجج، «وهم علماء العدل والتوحيد»؛ وهذا كلامه في وصف مذهبه، يورده المعتني ناقدًا {cite:kashshaf-dar-al-marifa-shiha-2009 p.12} {cite:kashshaf-dar-al-marifa-shiha-2009 p.15}."
      en: "In his preface al-Zamakhshari says he wrote it for his brethren 'among the best of the saved, justice-upholding party', who combine Arabic with the principles of religion, at the request of 'the scholars of justice and divine unity'; and he explains 'those endowed with knowledge' in the verse of testimony as those who establish God's unity and justice by proofs, 'the scholars of justice and divine unity'. These are his words about his own school, quoted critically by the editor {cite:kashshaf-dar-al-marifa-shiha-2009 p.12} {cite:kashshaf-dar-al-marifa-shiha-2009 p.15}."
      ur: "زمخشری اپنے مقدمے میں کہتے ہیں کہ انہوں نے یہ کتاب اپنے بھائیوں کے لیے لکھی جو «نجات یافتہ عدلی جماعت کے فضلا» ہیں اور عربی اور اصولِ دین کو جمع کرتے ہیں، «علمائے عدل و توحید» کی درخواست پر؛ اور آیتِ شہادت میں «اولو العلم» کی تفسیر ان لوگوں سے کرتے ہیں جو دلائل سے اللہ کی وحدانیت اور عدل ثابت کرتے ہیں، «اور وہ علمائے عدل و توحید ہیں»۔ یہ اپنے مسلک کے بارے میں ان کے الفاظ ہیں، جنہیں معتنی تنقیداً نقل کرتے ہیں {cite:kashshaf-dar-al-marifa-shiha-2009 p.12} {cite:kashshaf-dar-al-marifa-shiha-2009 p.15}۔"
