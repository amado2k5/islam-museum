id: question/how-did-sunni-scholars-read-al-kashshaf
class: question
label:
  ar: "كيف تعامل علماء أهل السنة مع «الكشاف» على ما فيه من الاعتزال؟"
  en: "How did Sunni scholars treat al-Kashshaf, given its Mu'tazili content?"
  ur: "اہلِ سنت کے علما نے الکشاف کے اعتزالی مواد کے باوجود اس سے کیسا معاملہ کیا؟"
summary:
  ar: "الكشاف للزمخشري تفسير معتزلي الاعتقاد، يصف صاحبه أهل مذهبه بأهل العدل والتوحيد؛ ومع ذلك أثنى عليه كثير من علماء أهل السنة لبلاغته وعنايته بعلمي المعاني والبيان، وكتبوا عليه الحواشي، وتعقّبه ابن المنير المالكي في «الانتصاف» فردّ ما فيه من الاعتزال."
  en: "Al-Zamakhshari's al-Kashshaf is a commentary of Mu'tazili creed whose author calls his school 'the people of justice and divine unity'; yet many Sunni scholars praised it for its rhetoric and mastery of ma'ani and bayan, wrote glosses on it, and Ibn al-Munayyir the Maliki answered its Mu'tazili content in al-Intisaf."
  ur: "زمخشری کی الکشاف معتزلی عقیدے کی تفسیر ہے جس کے مصنف اپنے مسلک والوں کو «اہلِ عدل و توحید» کہتے ہیں؛ اس کے باوجود اہلِ سنت کے بہت سے علما نے اس کی بلاغت اور علمِ معانی و بیان میں مہارت کی تعریف کی، اس پر حواشی لکھے، اور ابن المنیر مالکی نے «الانتصاف» میں اس کے اعتزالی مواد کا جواب دیا۔"
question:
  ar: "هل يُنتفع بالكشاف مع اعتزال صاحبه، وكيف؟"
  en: "Can al-Kashshaf be used despite its author's Mu'tazilism, and how?"
  ur: "کیا مصنف کے اعتزال کے باوجود الکشاف سے فائدہ اٹھایا جا سکتا ہے، اور کیسے؟"
short_answer:
  ar: "يثني عليه ابن خلدون والسبكي وغيرهما في البلاغة واللغة، ويتعقّبه ابن المنير في العقيدة، ويرى المعتني بطبعته أنه من خير المراجع في البلاغة رغم نزعته الاعتزالية؛ أما الزمخشري فيعدّ مذهبه مذهب أهل العدل والتوحيد."
  en: "Ibn Khaldun, al-Subki and others praise its rhetoric and language, Ibn al-Munayyir answers it on creed, and its modern editor ranks it among the best references for rhetoric despite its Mu'tazili bent; al-Zamakhshari himself counts his school the people of justice and divine unity."
  ur: "ابن خلدون، سبکی وغیرہ اس کی بلاغت و لغت کی تعریف کرتے ہیں، ابن المنیر عقیدے میں اس کا تعاقب کرتے ہیں، اور اس کے جدید معتنی اسے اعتزالی رجحان کے باوجود بلاغت کے بہترین مراجع میں سمجھتے ہیں؛ جبکہ زمخشری اپنے مسلک کو اہلِ عدل و توحید کا مسلک سمجھتے ہیں۔"
