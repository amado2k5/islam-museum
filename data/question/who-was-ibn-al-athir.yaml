id: question/who-was-ibn-al-athir
class: question
label:
  ar: من كان ابن الأثير؟
  en: Who was Ibn al-Athir?
  es: "¿Quién fue Ibn al-Athir?"
  fr: "Qui était Ibn al-Athir ?"
  ur: "ابن اثیر کون تھا؟"
  tr: "İbn el-Atirler kimdi?"
  id: "Siapakah Ibn al-Atheer?"
summary:
  ar: عز الدين ابن الأثير (1160–1233) مؤرخ موصلي؛ صاحب الكامل في التاريخ أشمل تاريخ إسلامي حوادثي من الخلق
    إلى عصره.
  en: "Izz al-Din Ibn al-Athir (1160–1233), a historian of Mosul, wrote al-Kamil fi al-Tarikh, the most comprehensive annalistic Islamic history from the creation to his time."
  es: "Izz al-Din Ibn al-Athir (1160–1233), historiador de Mosul, escribió al-Kamil fi al-Tarikh, la historia analística islámica más completa desde la creación hasta su época."
  fr: "Izz al-Din Ibn al-Athir (1160–1233), historien de Mossoul, a écrit al-Kamil fi al-Tarikh, l'histoire islamique annalistique la plus complète depuis la création jusqu'à son époque."
  ur: "عزالدین ابن الاثیر (1160-1233)، موصل کے ایک مورخ نے الکامل فی التاریخ لکھی، جو کہ تخلیق سے لے کر اپنے زمانے تک سب سے زیادہ جامع تجزیاتی اسلامی تاریخ ہے۔"
  tr: "İzzeddin bin el-Athir (1160–1233), Musulili bir tarihçiydi; yaratılıştan kendi dönemine kadar İslam olaylarının en kapsamlı tarihi olan El-Kamil fi el-Tarikh'in yazarıdır."
  id: "Izz al-Din ibn al-Athir (1160–1233) adalah seorang sejarawan Mosuli; penulis Al-Kamil fi al-Tarikh, sejarah Islam paling komprehensif tentang peristiwa dari penciptaan hingga zamannya."
question:
  ar: من كان ابن الأثير؟
short_answer:
  ar: عز الدين ابن الأثير (1160–1233) مؤرخ موصلي؛ صاحب الكامل في التاريخ أشمل تاريخ إسلامي حوادثي من الخلق
    إلى عصره.
long_answer:
  ar: '[[person/ibn-al-athir-izz-al-din|ابن الأثير الجزري]] من موصل؛ كتب الكامل في التاريخ مرتبًا الحوادث
    بالسنين من بدء الخليقة إلى 628هـ، وأسد الغابة في معرفة الصحابة، والتاريخ الباهر في الدولة الأتابكية؛
    يعد تاريخه أدق المصادر الحوادثية عند المحدثين. {cite:wikidata}'
