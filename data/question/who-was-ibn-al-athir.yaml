long_answer:
  ar: '[[person/ibn-al-athir-izz-al-din|ابن الأثير الجزري]] من موصل؛ كتب الكامل في التاريخ مرتبًا الحوادث
    بالسنين من بدء الخليقة إلى 628هـ، وأسد الغابة في معرفة الصحابة، والتاريخ الباهر في الدولة الأتابكية؛
    يعد تاريخه أدق المصادر الحوادثية عند المحدثين. {cite:wikidata}'
