id: question/may-one-say-i-am-a-believer-god-willing
class: question
label: { ar: "هل يقول المسلم: أنا مؤمن إن شاء الله؟", en: "May a Muslim say: I am a believer, God willing?", ur: "کیا مسلمان کہے: میں ان شاء اللہ مومن ہوں؟" }
summary:
  ar: "مسألة الاستثناء في الإيمان: يرى ابن بطة العكبري أن من صفة أهل العلم أن يقول الرجل «أنا مؤمن إن شاء الله» لا على وجه الشك بل إشفاقاً وتركاً لتزكية النفس، ويذكر محقق كتابه أن للعلماء فيه ثلاثة أقوال: الإيجاب، والمنع لأنه يوهم الشك، والتفصيل."
  en: "The question of the exception in faith: Ibn Batta al-Ukbari holds that it is a mark of people of knowledge to say 'I am a believer, God willing', not out of doubt but out of apprehension and refusal to praise oneself; his editor notes that scholars hold three views: that it is required, that it is forbidden because it suggests doubt, and a distinction between the two."
question: { ar: "هل يقول المسلم: أنا مؤمن إن شاء الله؟", en: "May a Muslim say: I am a believer, God willing?" }
issue: { ar: "حكم الاستثناء في الإيمان، أي قول: أنا مؤمن إن شاء الله، ومعناه." }
short_answer:
  ar: "عند ابن بطة ومن وافقه من أهل الحديث: يستثني إشفاقاً لا شكاً؛ ويحكي محقق الإبانة قولاً بإيجابه وقولاً بمنعه لأنه يقتضي الشك، وقولاً وسطاً يجيزه باعتبار ويمنعه باعتبار."
  en: "For Ibn Batta and the hadith scholars who agree with him, one makes the exception out of apprehension, not doubt; the Ibana's editor reports a view that it is required, a view that it is forbidden because it implies doubt, and a middle view that allows it in one sense and forbids it in another."
