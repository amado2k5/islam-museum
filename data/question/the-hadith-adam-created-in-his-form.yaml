  - tradition: sunni
    id: pronoun-to-adam
    standing: main
    stance: { ar: "الضمير لآدم", en: "The pronoun refers to Adam" }
    summary: { ar: "يعدّ ابن حجر، كما ينقل المحقق، أقوالاً تجعل الضمير لآدم: أنه خُلق على صورته التي بقي عليها حتى أُهبط ومات، أو أنه خُلق تاماً من أول أمره ردّاً على الدهرية والطبائعيين والقدرية؛ وينقل إنكار المازري ومن تبعه صحة زيادة «على صورة الرحمن»، وأنها على تقدير صحتها تُحمل على ما يليق بالباري.", en: "Ibn Hajar, as the editor quotes him, lists views referring the pronoun to Adam: that he was created in the form he kept until he was sent down and died, or that he was created complete from the start, against the eternalists, the naturalists and the Qadariyya; and he reports that al-Maziri and those who followed him denied that the addition 'in the form of the All-Merciful' is sound, and that if it is sound it is to be taken in a way befitting the Creator." }
