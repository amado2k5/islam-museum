    id: ibn-khuzayma-the-one-struck
    standing: main
    stance: { ar: "الضمير للمضروب، و«صورة الرحمن» إضافة خلق", en: "The pronoun refers to the one struck; 'the form of the All-Merciful' is the ascription of a creation" }
    summary: { ar: "يقول ابن خزيمة إن بعض من لم يتحرّ العلم توهم أن «على صورته» صورة الرحمن، وإن الهاء كناية عن المضروب والمشتوم: فإن وجه آدم شبيه وجوه بنيه، فمن قال لأحد «قبح الله وجهك ووجه من أشبه وجهك» قبّح وجه آدم. ويعلّ رواية ابن عمر بمخالفة الثوري الأعمشَ بإرساله، وتدليس الأعمش، وتدليس حبيب بن أبي ثابت؛ ثم يقول إن صحت فالإضافة فيها من إضافة الخلق إلى الله، ويحذّر من حملها على صفات الذات لأنه يضاهي قول المشبهة.", en: "Ibn Khuzayma says that some who did not seek knowledge carefully imagined 'in his form' meant the form of the All-Merciful, whereas the pronoun stands for the person struck and cursed: Adam's face resembles the faces of his children, so whoever says to someone 'God make ugly your face and the face of whoever resembles you' has made ugly the face of Adam. He faults Ibn 'Umar's version for al-Thawri's contrary mursal transmission, al-A'mash's tadlis and Habib ibn Abi Thabit's tadlis; then says that if it is sound, the ascription is that of a creation to God, and warns that taking it as an attribute of the Essence resembles the view of the anthropomorphists." }
