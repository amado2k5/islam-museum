  - tradition: sunni
    id: affirm-form-as-befits-god
    standing: main
    stance: { ar: "الحديث صحيح، وتُثبت الصورة لله على ما يليق به", en: "The report is sound, and the form is affirmed of God as befits Him" }
    summary: { ar: "ينقل المحقق عن ابن حجر أن ابن أبي عاصم والطبراني أخرجا لفظ «صورة الرحمن» برجال ثقات، وأن لفظ أبي هريرة «فإن صورة وجه الإنسان على صورة وجه الرحمن» يردّ التأويل الأول، وعن حرب الكرماني أن إسحاق بن راهويه قال: صح أن الله خلق آدم على صورة الرحمن، وأن أحمد صححه، وأن أحمد كذّب من قال «على صورة الرجل» وجعله قول الجهمية؛ وعن ابن قتيبة أن الصورة ليست بأعجب من اليدين والأصابع والعين، يؤمن بالجميع بلا كيفية ولا حد. وعلى هذا يرى المحقق أن تأويل ابن خزيمة بعيد، وينقل عن قوام السنة التيمي: أخطأ ابن خزيمة في حديث الصورة ولا يُطعن عليه في ذلك.", en: "The editor quotes Ibn Hajar that Ibn Abi 'Asim and al-Tabarani transmitted the wording 'the form of the All-Merciful' with trustworthy men, and that Abu Hurayra's wording 'the form of a man's face is upon the form of the face of the All-Merciful' rules out the first interpretation; Harb al-Kirmani that Ishaq ibn Rahwayh said it is sound that God created Adam in the form of the All-Merciful, and that Ahmad declared it sound and called false the view 'in the form of the man', calling it the view of the Jahmiyya; and Ibn Qutayba that the form is no stranger than the Hands, the Fingers and the Eye, all of which he believes in without modality or limit. On this basis the editor finds Ibn Khuzayma's interpretation far-fetched, and quotes Qiwam al-Sunna al-Taymi: Ibn Khuzayma erred on the hadith of the form, and is not to be faulted for that." }
