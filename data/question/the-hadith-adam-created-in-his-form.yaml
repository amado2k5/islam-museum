id: question/the-hadith-adam-created-in-his-form
class: question
label: { ar: "ما معنى حديث «خلق الله آدم على صورته»؟", en: "What does the report 'God created Adam in his form' mean?", ur: "حدیث «اللہ نے آدم کو اس کی صورت پر پیدا کیا» کا کیا مطلب ہے؟" }
question: { ar: "إلى من يعود الضمير في «على صورته»: إلى آدم، أم إلى المضروب، أم إلى الله على ما يليق به؟ وما حكم لفظ «على صورة الرحمن»؟", en: "To whom does the pronoun in 'in his form' refer — to Adam, to the person struck, or to God in a manner befitting Him? And what of the wording 'in the form of the All-Merciful'?", ur: "«اس کی صورت پر» میں ضمیر کس کی طرف لوٹتی ہے: آدم کی طرف، مارے جانے والے کی طرف، یا اللہ کی طرف اس کی شان کے لائق؟ اور «رحمن کی صورت پر» کے الفاظ کا کیا حکم ہے؟" }
issue: { ar: "حديث النهي عن ضرب الوجه وتقبيحه «فإن الله خلق آدم على صورته»، ولفظ ابن عمر «فإن ابن آدم خلق على صورة الرحمن»، وتأويل ابن خزيمة لهما في كتاب التوحيد وردّ محققه عليه.", en: "The report forbidding striking or cursing the face 'for God created Adam in his form', Ibn 'Umar's wording 'for the son of Adam was created in the form of the All-Merciful', Ibn Khuzayma's interpretation of both in Kitab al-Tawhid, and his editor's reply." }
summary:
  ar: "يروي ابن خزيمة حديث «إذا قاتل أحدكم فليجتنب الوجه فإن الله خلق آدم على صورته» ويجعل الضمير للمضروب، ويعلّ لفظ «على صورة الرحمن» بثلاث علل، ثم يقول إن صح فالإضافة فيه إضافة خلق؛ ويخطّئه محققه، ناقلاً عن ابن حجر الأقوال في مرجع الضمير، وعن أحمد وإسحاق تصحيح الحديث، وعن قوام السنة التيمي أن ابن خزيمة أخطأ فيه ولا يُطعن عليه بذلك {cite:kitab-al-tawhid-ibn-khuzayma-shahwan-1988 p. 84-90} {cite:kitab-al-tawhid-ibn-khuzayma-shahwan-1988-study p. 69}."
  en: "Ibn Khuzayma narrates 'When one of you fights, let him avoid the face, for God created Adam in his form' and refers the pronoun to the person struck; he finds three defects in the wording 'in the form of the All-Merciful' and says that, if it is sound, the ascription in it is the ascription of a created thing to its Creator. His editor holds him mistaken, quoting Ibn Hajar's survey of the views on the pronoun, Ahmad's and Ishaq's authentication of the report, and Qiwam al-Sunna al-Taymi's remark that Ibn Khuzayma erred on it and is not to be faulted for that {cite:kitab-al-tawhid-ibn-khuzayma-shahwan-1988 p. 84-90} {cite:kitab-al-tawhid-ibn-khuzayma-shahwan-1988-study p. 69}."
  ur: "ابن خزیمہ حدیث «جب تم میں سے کوئی لڑے تو چہرے سے بچے، کیونکہ اللہ نے آدم کو اس کی صورت پر پیدا کیا» روایت کر کے ضمیر کو مارے جانے والے کی طرف لوٹاتے ہیں؛ «رحمن کی صورت پر» کے الفاظ میں تین علتیں بتاتے ہیں اور کہتے ہیں کہ اگر صحیح ہو تو اس میں اضافت مخلوق کی اضافت ہے۔ ان کے محقق انہیں غلطی پر سمجھتے ہیں، اور ضمیر کے مرجع میں ابن حجر کے اقوال، احمد اور اسحاق کی تصحیح، اور قوام السنہ تیمی کا یہ قول نقل کرتے ہیں کہ ابن خزیمہ نے اس میں غلطی کی اور اس کی وجہ سے ان پر طعن نہیں کیا جاتا {cite:kitab-al-tawhid-ibn-khuzayma-shahwan-1988 p. 84-90} {cite:kitab-al-tawhid-ibn-khuzayma-shahwan-1988-study p. 69}۔"
short_answer:
  ar: "عند ابن خزيمة: الضمير للمضروب، و«صورة الرحمن» إن صحت إضافة خلق. وعند أحمد وإسحاق وابن قتيبة ومن تبعهم، كما ينقل المحقق: الحديث صحيح، وتُثبت الصورة لله على ما يليق به بلا كيف ولا تشبيه. وذكر ابن حجر أقوالاً أخرى في مرجع الضمير إلى آدم."
  en: "For Ibn Khuzayma the pronoun refers to the person struck, and 'the form of the All-Merciful', if sound, is the ascription of a creation. For Ahmad, Ishaq, Ibn Qutayba and those who follow them, as the editor quotes them, the report is sound and the form is affirmed of God as befits Him, without modality or likeness. Ibn Hajar records further views referring the pronoun to Adam."
  ur: "ابن خزیمہ کے نزدیک ضمیر مارے جانے والے کی طرف ہے، اور «رحمن کی صورت» اگر صحیح ہو تو مخلوق کی اضافت ہے۔ احمد، اسحاق، ابن قتیبہ اور ان کے متبعین کے نزدیک، جیسا کہ محقق نقل کرتے ہیں، حدیث صحیح ہے اور صورت اللہ کے لیے اس کی شان کے لائق، بلا کیف و تشبیہ، ثابت ہے۔ ابن حجر نے ضمیر کو آدم کی طرف لوٹانے کے مزید اقوال ذکر کیے ہیں۔"
