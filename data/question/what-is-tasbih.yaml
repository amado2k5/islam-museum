long_answer:
  ar: 'التسبيح هو ذكر الله بقول «سبحان الله» تنزيهًا له؛ يأتي في القرآن أمرًا ووصفًا لسجد الملائكة والخلق.
    تعلّم المسلمون من السنّة نظام التسبيح بعد الصلوات: ثلاثًا وثلاثين تسبيحة وحمدًا وتكبيرًا عند كثير
    من المذاهب، ويُعد من أسهل الأذكار وأعمقها معنى. {cite:wikidata}'
