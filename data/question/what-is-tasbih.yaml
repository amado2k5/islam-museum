id: question/what-is-tasbih
class: question
label:
  ar: ما التسبيح؟
  en: What is tasbih?
  es: "¿Qué es tasbih?"
  fr: "Qu'est-ce que le tasbih ?"
summary:
  ar: التسبيح هو قول سبحان الله؛ صيغة الذكر الأشهر بعد الصلاة وفي كل وقت، وتعّد تسبيحات الثلاث والثلاثين
    بعد الصلاة سنّة عند كثيرين.
  en: Tasbih is saying 'Subhan Allah'. It is the best-known formula of remembrance after prayer and at all times, and according to many, the thirty-three glorifications after prayer are a sunna.
  es: "Tasbih es decir 'Subhan Allah'. Es la fórmula de recuerdo más conocida después de la oración y en todo momento, y según muchos, las treinta y tres glorificaciones después de la oración son una sunna."
  fr: "Le tasbih consiste à dire « Subhan Allah ». C'est la formule d'invocation la plus connue après la prière et à réciter en tout temps, et selon de nombreux observateurs, les trente-trois glorifications après la prière constituent une sunna."
question:
  ar: ما التسبيح؟
short_answer:
  ar: التسبيح هو قول سبحان الله؛ صيغة الذكر الأشهر بعد الصلاة وفي كل وقت، وتعّد تسبيحات الثلاث والثلاثين
    بعد الصلاة سنّة عند كثيرين.
long_answer:
  ar: 'التسبيح هو ذكر الله بقول «سبحان الله» تنزيهًا له؛ يأتي في القرآن أمرًا ووصفًا لسجد الملائكة والخلق.
    تعلّم المسلمون من السنّة نظام التسبيح بعد الصلوات: ثلاثًا وثلاثين تسبيحة وحمدًا وتكبيرًا عند كثير
    من المذاهب، ويُعد من أسهل الأذكار وأعمقها معنى. {cite:wikidata}'
