short_answer:
  ar: الشريعة هي الإطار المعياري الإسلامي الجامع للعبادة والمعاملة والأخلاق؛ مصادرها القرآن والسنة وتطبّقها
    مذاهب الفقه.
long_answer:
  ar: الشريعة هي النظام المعياري الذي ينطلق من القرآن والسنة ويشمل العبادات والمعاملات والأحوال الشخصية
    والقضاء. تفصيل أحكامها عمل [[concept/fiqh|الفقه]] الذي تنوعت فيه المذاهب؛ أما القوانين الحديثة فتأخذ
    منها ومن غيرها حسب الدول. {cite:wikidata}
