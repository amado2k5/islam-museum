id: question/what-is-ihsan
class: question
label:
  ar: ما الإحسان في الإسلام؟
  en: What is ihsan in Islam?
  es: "¿Qué es ihsan en el Islam?"
  fr: "Qu'est-ce que l'ihsan en Islam ?"
  ur: "اسلام میں احسان کیا ہے؟"
  tr: "İslam'da İhsan (İhsan) nedir?"
  id: "Apa itu Ihsan (Ihsan) dalam Islam?"
summary:
  ar: الإحسان مرتبة من مراتب الدين الثلاث، وهو أن يعبد الإنسان الله كأنه يراه، فإن لم يكن يراه فإن الله يراه.
  en: "Ihsan is one of the three levels of religion: to worship God as though you see Him, and if you do not see Him, then He sees you."
  es: "Ihsan es uno de los tres niveles de la religión: adorar a Dios como si lo vieras, y si no lo ves, entonces Él te ve a ti."
  fr: "L'Ihsan est l'un des trois niveaux de la religion: adorer Dieu comme si vous le voyiez, et si vous ne le voyez pas, alors il vous voit."
  ur: "احسان دین کے تین درجوں میں سے ایک ہے: خدا کی عبادت اس طرح کرو گویا تم اسے دیکھ رہے ہو اور اگر تم اسے نہیں دیکھ رہے تو وہ تمہیں دیکھ رہا ہے۔"
  tr: "İhsan, dinin üç seviyesinden biridir; bir kişi Tanrı'yı görüyormuş gibi ibadet eder; eğer görmüyorsa, Tanrı O'nu görür."
  id: "Ihsan adalah salah satu dari tiga tingkat agama, yaitu seseorang menyembah Tuhan seolah-olah ia melihat-Nya; jika ia tidak melihat-Nya, maka Allah melihat-Nya."
