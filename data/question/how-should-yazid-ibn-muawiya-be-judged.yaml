id: question/how-should-yazid-ibn-muawiya-be-judged
class: question
label: { ar: "كيف يُحكم على يزيد بن معاوية؟", en: "How should Yazid ibn Mu'awiya be judged?", ur: "یزید بن معاویہ کے بارے میں کیا رائے رکھی جائے؟" }
summary:
  ar: "يقسم ابن تيمية في منهاج السنة الناس في يزيد بن معاوية إلى طرفين ووسط: من يجعله صحابياً أو خليفة راشداً أو نبياً، ومن يجعله كافراً منافقاً قصد الثأر لقتلى بدر، والوسط عنده أنه ملك من ملوك المسلمين؛ ويرى أن يزيد لم يأمر بقتل الحسين لكنه لم ينتصر له ولم يقتص من قاتليه."
  en: "In Minhaj al-Sunna Ibn Taymiyya divides people's views of Yazid ibn Mu'awiya into two extremes and a middle: those who make him a Companion, a rightly guided caliph or a prophet; those who make him a hidden unbeliever seeking revenge for the dead of Badr; and the middle, for him, that he was one of the kings of the Muslims. He holds that Yazid did not order al-Husayn's killing but neither avenged him nor punished his killers."
  ur: "منہاج السنہ میں ابن تیمیہ یزید بن معاویہ کے بارے میں لوگوں کو دو انتہاؤں اور ایک درمیانی گروہ میں تقسیم کرتے ہیں: جو اسے صحابی، خلیفۂ راشد یا نبی بناتے ہیں؛ جو اسے بدر کے مقتولوں کا بدلہ لینے والا چھپا کافر سمجھتے ہیں؛ اور درمیانی رائے، ان کے نزدیک، کہ وہ مسلمانوں کے بادشاہوں میں سے ایک بادشاہ تھا۔ وہ کہتے ہیں کہ یزید نے حسین کے قتل کا حکم نہیں دیا مگر نہ ان کی مدد کا بدلہ لیا نہ قاتلوں کو سزا دی۔"
question: { ar: "كيف يُحكم على يزيد بن معاوية؟", en: "How should Yazid ibn Mu'awiya be judged?", ur: "یزید بن معاویہ کے بارے میں کیا رائے رکھی جائے؟" }
issue:
  ar: "هل كان يزيد صالحاً مُعظَّماً، أم كافراً منافقاً، أم ملكاً من ملوك المسلمين له ما له وعليه ما عليه؟ وما مسؤوليته عن قتل الحسين؟"
  en: "Was Yazid a righteous man to be revered, a hidden unbeliever, or a Muslim king with merits and faults? And what was his responsibility for the killing of al-Husayn?"
  ur: "کیا یزید قابلِ تعظیم نیک آدمی تھا، چھپا ہوا کافر تھا، یا مسلمانوں کا ایک بادشاہ جس کی خوبیاں بھی تھیں اور خامیاں بھی؟ اور حسین کے قتل میں اس کی ذمہ داری کیا تھی؟"
short_answer:
  ar: "ابن تيمية ⁦(أهل السنة)⁩: ملك من ملوك المسلمين، لا صحابي ولا كافر؛ لم يأمر بقتل الحسين ولم ينتصر له. الطرفان كما يحكيهما: تعظيمه إلى حد جعله من الصحابة أو الأنبياء، أو تكفيره بأبيات تُنسب إليه."
  en: "Ibn Taymiyya (Sunni): one of the kings of the Muslims, neither a Companion nor an unbeliever; he did not order al-Husayn's killing nor avenge him. The two extremes as he relates them: revering him to the point of making him a Companion or prophet, or declaring him an unbeliever on the strength of verses attributed to him."
  ur: "ابن تیمیہ ⁦(اہلِ سنت)⁩: مسلمانوں کے بادشاہوں میں سے ایک، نہ صحابی نہ کافر؛ اس نے حسین کے قتل کا حکم نہیں دیا اور نہ ان کا بدلہ لیا۔ دونوں انتہائیں، جیسا وہ بیان کرتے ہیں: اس کی ایسی تعظیم کہ اسے صحابی یا نبی بنا دیا جائے، یا اس سے منسوب اشعار کی بنا پر اس کی تکفیر۔"
perspectives:
  - tradition: sunni-hanbali
    id: ibn-taymiyya-minhaj-yazid-middle
    standing: main
    stance: { ar: "يزيد ملك من ملوك المسلمين وخليفة من الخلفاء الملوك", en: "Yazid was one of the kings of the Muslims, a caliph of the kingly kind", ur: "یزید مسلمانوں کے بادشاہوں میں سے ایک، بادشاہ خلفا میں سے ایک خلیفہ تھا" }
    summary: { ar: "يرى ابن تيمية أن القولين المتطرفين باطلان يعلم بطلانهما كل عاقل، وأن ما نقله غير واحد أن يزيد لم يأمر بقتل الحسين بل ساءه ذلك ولعن ابن زياد، لكنه لم ينتصر للحسين ولا أمر بقتل قاتله ولا أخذ بثأره، وأن رواية نكته بالقضيب على ثنايا الحسين قدام يزيد إسنادها مجهول والثابت في الصحيح أنها كانت عند عبيد الله بن زياد.", en: "Ibn Taymiyya holds that both extreme views are false, as any rational person knows; that several authorities report that Yazid did not order al-Husayn's killing but was grieved by it and cursed Ibn Ziyad, yet did not avenge al-Husayn, order his killer's death or take revenge for him; and that the report of striking al-Husayn's teeth with a rod in Yazid's presence has an unknown chain, while what is established in the Sahih is that it happened before Ubayd Allah ibn Ziyad.", ur: "ابن تیمیہ کے نزدیک دونوں انتہائی قول باطل ہیں جن کا بطلان ہر عقلمند جانتا ہے؛ کئی لوگوں نے نقل کیا کہ یزید نے حسین کے قتل کا حکم نہیں دیا بلکہ اسے اس سے رنج ہوا اور اس نے ابن زیاد پر لعنت کی، مگر نہ حسین کی مدد کا بدلہ لیا، نہ ان کے قاتل کے قتل کا حکم دیا، نہ ان کا قصاص لیا؛ اور یزید کے سامنے حسین کے دانتوں پر چھڑی مارنے کی روایت کی سند مجہول ہے، جبکہ صحیح میں ثابت ہے کہ یہ عبید اللہ بن زیاد کے سامنے ہوا۔" }
