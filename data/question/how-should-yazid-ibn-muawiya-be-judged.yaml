    summary: { ar: "في نقل ابن تيمية: قوم يعتقدون أنه كان كافراً منافقاً في الباطن، وأنه قصد أخذ ثأر قتلى بدر من أقاربه، ويستدلون بأبيات تنسب إليه حين أشرفت رؤوس القتلى، وبتمثله بشعر ابن الزبعرى «ليت أشياخي ببدر شهدوا».", en: "As Ibn Taymiyya reports: some people believe that he was a hidden unbeliever who meant to avenge his kinsmen killed at Badr, citing verses attributed to him when the heads of the slain came into view, and his quoting Ibn al-Ziba'ra's verse 'Would that my elders at Badr had witnessed'.", ur: "ابن تیمیہ کی نقل میں: کچھ لوگ سمجھتے ہیں کہ وہ باطن میں کافر منافق تھا جس نے بدر میں مارے گئے اپنے رشتہ داروں کا بدلہ لینا چاہا، اور وہ اس سے منسوب ان اشعار سے دلیل لیتے ہیں جو اس نے مقتولوں کے سر سامنے آنے پر کہے، اور ابن الزبعری کے شعر «کاش میرے بدر والے بزرگ دیکھتے» سے اس کے تمثل سے۔" }
