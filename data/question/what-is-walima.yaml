id: question/what-is-walima
class: question
label:
  ar: "ما الوليمة؟"
  en: What is the walima?
summary:
  ar: "الوليمة طعام العرس؛ أمر النبي به فقال «أولم ولو بشاة»، وتتسع أعرافه بين البلدان من مائدة بيت إلى موسم قوم."
  en: The walima is the wedding feast. The Prophet commanded it, saying 'Hold a walima, even if only with a sheep', and its customs vary between lands, from a household's table to a people's festive season.
wings: []
question:
  ar: "ما الوليمة؟"
short_answer:
  ar: "الوليمة طعام العرس؛ أمر النبي به فقال «أولم ولو بشاة»، وتتسع أعرافه بين البلدان من مائدة بيت إلى موسم قوم."
long_answer:
  ar: |
    الوليمة سنة مؤكدة في الحديث، وهي من أعراف الفرح التي اختلفت صورها باختلاف المسلمين {cite:sahih-al-bukhari}.
    ويعرض مدخل [[practice/walima|الوليمة]] موضعها في الشرع والعرف.

