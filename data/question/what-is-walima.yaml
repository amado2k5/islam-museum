id: question/what-is-walima
class: question
label:
  ar: "ما الوليمة؟"
  en: What is the walima?
  es: "¿Qué es la walima?"
  fr: "Qu'est-ce que la walima ?"
summary:
  ar: "الوليمة طعام العرس؛ أمر النبي به فقال «أولم ولو بشاة»، وتتسع أعرافه بين البلدان من مائدة بيت إلى موسم قوم."
  en: The walima is the wedding feast. The Prophet commanded it, saying 'Hold a walima, even if only with a sheep', and its customs vary between lands, from a household's table to a people's festive season.
  es: "La walima es el banquete nupcial. El Profeta la ordenó diciendo: \"Celebrad una walima, aunque sea con una oveja\", y sus costumbres varían según el país, desde la mesa familiar hasta la temporada festiva de un pueblo."
  fr: "La walima est le festin de mariage. Le Prophète l'a prescrit en disant: « Organisez une walima, même avec un simple mouton », et ses coutumes varient selon les pays, allant de la table familiale à la période festive d'un peuple."
wings: []
question:
  ar: "ما الوليمة؟"
short_answer:
  ar: "الوليمة طعام العرس؛ أمر النبي به فقال «أولم ولو بشاة»، وتتسع أعرافه بين البلدان من مائدة بيت إلى موسم قوم."
long_answer:
  ar: |
    الوليمة سنة مؤكدة في الحديث، وهي من أعراف الفرح التي اختلفت صورها باختلاف المسلمين {cite:sahih-al-bukhari}.
    ويعرض مدخل [[practice/walima|الوليمة]] موضعها في الشرع والعرف.

