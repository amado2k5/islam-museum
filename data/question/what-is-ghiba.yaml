id: question/what-is-ghiba
class: question
label:
  ar: ما الغيبة؟
  en: What is ghiba?
  es: "¿Qué es ghiba?"
  fr: "Qu'est-ce que ghiba ?"
  ur: "غیبہ کیا ہے؟"
  tr: "Sırtüstü isbarat nedir?"
  id: "Apa itu fitnah?"
summary:
  ar: الغيبة هي ذكر أخيك بما يكرهه في غيبته؛ من كبائر الذنوب عند العلماء وقرّبها القرآن بأكل لحم الميت.
  en: "Backbiting (ghiba) is speaking of your brother in his absence in a way he would dislike. Scholars count it among the major sins, and the Qur'an likened it to eating the flesh of the dead."
  es: "La calumnia (ghiba) consiste en hablar mal de tu hermano en su ausencia de una manera que le desagrade. Los eruditos la consideran uno de los pecados mayores, y el Corán la compara con comer la carne de un muerto."
  fr: "La médisance (ghiba) consiste à parler de son frère en son absence d'une manière qui lui déplairait. Les savants la considèrent comme un péché majeur, et le Coran l'a comparée à la consommation de chair humaine."
  ur: "غیبت یہ ہے کہ آپ کے بھائی کے بارے میں اس کی غیر موجودگی میں اس طرح بات کرنا کہ وہ ناپسند کرے گا۔ علماء نے اسے کبیرہ گناہوں میں شمار کیا ہے اور قرآن نے اسے مردہ کا گوشت کھانے سے تشبیہ دی ہے۔"
  tr: "Arkadan iğneleme, kardeşinize sırtından bahsederken neyi sevmediğini hatırlatmaktır; alimlere göre en büyük günahlardan biridir ve Kur'an bunu ölülerin etini yemeye daha da yaklaştırır."
  id: "Menyempuh adalah mengingatkan saudaramu tentang apa yang tidak disukainya saat menghina; di antara dosa besar menurut para ulama, dan Al-Qur'an mendekatkan kepada makan daging orang mati."
question:
  ar: ما الغيبة؟
short_answer:
  ar: الغيبة هي ذكر أخيك بما يكرهه في غيبته؛ من كبائر الذنوب عند العلماء وقرّبها القرآن بأكل لحم الميت.
long_answer:
  ar: الغيبة هي ذكرك أخاك المسلم في غيبته بما يكرهه ولو كان حقًّا؛ قال تعالى أوحّلها بأكل لحم الميت. حدّدها
    حديث الرسول ذكرك أخاك بما يكره، ومن صورها النميمة والسخرية والمحاكاة والنقل للإفساد. {cite:wikidata}
