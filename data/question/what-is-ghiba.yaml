id: question/what-is-ghiba
class: question
label:
  ar: ما الغيبة؟
  en: What is ghiba?
summary:
  ar: الغيبة هي ذكر أخيك بما يكرهه في غيبته؛ من كبائر الذنوب عند العلماء وقرّبها القرآن بأكل لحم الميت.
  en: "Backbiting (ghiba) is speaking of your brother in his absence in a way he would dislike. Scholars count it among the major sins, and the Qur'an likened it to eating the flesh of the dead."
question:
  ar: ما الغيبة؟
short_answer:
  ar: الغيبة هي ذكر أخيك بما يكرهه في غيبته؛ من كبائر الذنوب عند العلماء وقرّبها القرآن بأكل لحم الميت.
long_answer:
  ar: الغيبة هي ذكرك أخاك المسلم في غيبته بما يكرهه ولو كان حقًّا؛ قال تعالى أوحّلها بأكل لحم الميت. حدّدها
    حديث الرسول ذكرك أخاك بما يكره، ومن صورها النميمة والسخرية والمحاكاة والنقل للإفساد. {cite:wikidata}
