id: question/what-is-ijma
class: question
label:
  ar: ما الإجماع؟
  en: What is ijma?
  es: "¿Qué es ijma?"
  fr: "Qu'est-ce que l'ijma ?"
  ur: "اجماع کیا ہے؟"
  tr: "Ortak görüş nedir?"
  id: "Apa konsensusnya?"
summary:
  ar: الإجماع هو اتفاق مجتهدي الأمة على حكم شرعي؛ ثالث الأصول عند جمهور الأصوليين وحجته آثار نبوية في
    عصمة الأمة.
  en: "Ijma is the agreement of the community's qualified scholars on a legal ruling. It is the third source of jurisprudence according to the majority of jurists, and its proof is prophetic reports about the community being preserved from error."
  es: "El ijma es el consenso de los eruditos cualificados de la comunidad sobre una decisión jurídica. Constituye la tercera fuente de jurisprudencia según la mayoría de los juristas, y su validez se fundamenta en relatos proféticos que atestiguan que la comunidad se ha mantenido libre de errores."
  fr: "L'ijma est le consensus des savants qualifiés d'une communauté sur une décision juridique. Elle constitue la troisième source de jurisprudence selon la majorité des juristes, et sa preuve réside dans les récits prophétiques attestant que la communauté est préservée de l'erreur."
  ur: "اجماع ایک قانونی حکم پر کمیونٹی کے اہل علماء کا معاہدہ ہے۔ جمہور فقہاء کے نزدیک یہ فقہ کا تیسرا ماخذ ہے اور اس کا ثبوت امت کے گمراہی سے محفوظ رہنے کے بارے میں پیشن گوئی ہے۔"
  tr: "Uzlaşma, ümmetin hukukçularının hukuki bir karar üzerindeki uzlaşısıdır; usul âlimlerinin çoğunluğuna göre üçüncü ilkedir ve kanıtı, ümmetin yanılmazlığı üzerindeki peygamberlik etkileridir."
  id: "Konsensus adalah konsensus para ahli hukum Ummah mengenai suatu putusan hukum; ini adalah prinsip ketiga menurut mayoritas ulama usul, dan buktinya adalah efek nubuat terhadap ketidaksalahan umat."
question:
  ar: ما الإجماع؟
short_answer:
  ar: الإجماع هو اتفاق مجتهدي الأمة على حكم شرعي؛ ثالث الأصول عند جمهور الأصوليين وحجته آثار نبوية في
    عصمة الأمة.
long_answer:
  ar: الإجماع عند أصوليي السنة هو اتفاق مجتهدي العصر على حكم شرعي؛ حجته أحاديث عصمة الأمة من الضلال. يصعب
    تحقيقه في العصور المتأخرة فاكتفي الفقهاء بإجماعات القرون الأولى وقواعد الضرورة. {cite:wikidata}
