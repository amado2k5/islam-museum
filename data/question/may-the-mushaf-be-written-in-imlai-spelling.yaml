  id: rasm-is-conventional
  standing: secondary
  stance:
    ar: الرسم اصطلاحي لا توقيفي فتجوز مخالفته
    en: The rasm is conventional, not fixed by revelation, so departing from it is permitted
    ur: رسم اصطلاحی ہے توقیفی نہیں، اس لیے اس کی مخالفت جائز ہے
  summary:
    ar: "ينسب السبت هذا الرأي إلى ابن خلدون في مقدمته، ويتحمس له القاضي أبو بكر في «الانتصار» إذ يقول إن الله لم يفرض على الأمة في الكتابة شيئاً، ولم يأخذ على كتّاب القرآن رسماً بعينه، وليس في نص الكتاب ولا السنة ولا الإجماع ولا القياس ما يوجب ذلك، وإن الخطوط علامات ورسوم تجري مجرى الإشارات والرموز، فكل رسم دال على الكلمة مفيد لوجه قراءتها تجب صحته. ويناقش السبت هذا المذهب بأدلة الجمهور وبأن قول الباقلاني «اختلفت خطوط المصاحف» لا يُسلَّم بعد قيام الإجماع {cite:manahil-irfan-sabt p. 321} {cite:manahil-irfan-sabt p. 322}."
    en: "Al-Sabt ascribes this view to Ibn Khaldun in his Muqaddima, and al-Qadi Abu Bakr [al-Baqillani] held to it in al-Intisar, saying that God imposed nothing on the community in writing, and fixed for the writers of the Qur'an no particular rasm; nothing in the text, the sunna, consensus or analogy requires it; scripts are signs and marks that work like gestures and symbols, so any sign that points to the word and the way to read it is correct and must be accepted. Al-Sabt answers with the majority's evidence and that al-Baqillani's 'the scripts of the codices differed' cannot be conceded once consensus was formed {cite:manahil-irfan-sabt p. 321} {cite:manahil-irfan-sabt p. 322}."
    ur: "سبت یہ رائے ابن خلدون کی طرف ان کے مقدمے کے حوالے سے منسوب کرتے ہیں، اور قاضی ابو بکر [باقلانی] «الانتصار» میں اس کے پرجوش حامی ہیں، کہتے ہیں کہ اللہ نے امت پر کتابت میں کچھ فرض نہ کیا اور قرآن کے لکھنے والوں پر کوئی خاص رسم لازم نہ کی؛ نہ نصِ کتاب، نہ سنت، نہ اجماع، نہ قیاس اس کا موجب ہیں؛ خطوط علامات اور نقوش ہیں جو اشاروں اور رموز کی طرح چلتے ہیں، پس جو نقش کلمے پر دلالت کرے اور اس کے پڑھنے کی صورت بتائے اس کی صحت واجب ہے۔ سبت جمہور کے دلائل سے اور اس بات سے جواب دیتے ہیں کہ باقلانی کا «مصاحف کے خطوط مختلف رہے» اجماع قائم ہونے کے بعد تسلیم نہیں {cite:manahil-irfan-sabt p. 321} {cite:manahil-irfan-sabt p. 322}۔"
