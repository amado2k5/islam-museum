issue:
  ar: مرجعية الرسم العثماني في كتابة المصاحف
  en: The authority of the Uthmanic rasm in writing codices
  ur: مصاحف کی کتابت میں رسمِ عثمانی کی مرجعیت
perspectives:
- tradition: sunni
  id: must-keep-uthmani-rasm
  standing: main
  stance:
    ar: يجب الالتزام بالرسم العثماني ولا تجوز مخالفته
    en: The Uthmanic rasm must be kept and may not be departed from
    ur: رسمِ عثمانی کی پابندی لازم ہے اور مخالفت جائز نہیں
  summary:
    ar: "مذهب الجمهور؛ ومنه قول مالك: لا، إلا على الكتبة الأولى، وقول أحمد بتحريم مخالفة خط مصحف عثمان في واو أو ياء أو ألف، وقول البيهقي إن من كتب مصحفاً ينبغي أن يحافظ على الهجاء الذي كتبوا به. ويقول الداني إنه لا مخالف لمالك من علماء الأمة. ويحتج السبت بإجماع الصحابة على الكتابة بهذا الرسم زمن عثمان، وبأن فتح الباب لمخالفته ذريعة إلى التلاعب بالقرآن والاختلاف فيه لاختلاف قواعد الرسم من قطر لآخر، وبأن مصطلح الكتابة معرض للتغيير {cite:manahil-irfan-sabt p. 317} {cite:manahil-irfan-sabt p. 318} {cite:itqan-suyuti p. 2199}."
    en: "The majority view, including Malik's: no, only the first writing; Ahmad's forbidding departure from the script of Uthman's codex in a waw, ya' or alif; and al-Bayhaqi's that whoever writes a codex should keep to the spelling in which they wrote. Al-Dani says no scholar of the community differs with Malik. Al-Sabt argues from the Companions' consensus on writing with this rasm in Uthman's time, that opening the door to departing from it is a means to tampering with the Qur'an and dispute because spelling rules differ from land to land, and that writing conventions are open to change {cite:manahil-irfan-sabt p. 317} {cite:manahil-irfan-sabt p. 318} {cite:itqan-suyuti p. 2199}."
    ur: "جمہور کا مذہب؛ اس میں مالک کا قول: نہیں، سوائے پہلی کتابت کے؛ احمد کا قول کہ مصحفِ عثمان کے خط کی کسی واو، یاء یا الف میں مخالفت حرام ہے؛ اور بیہقی کا قول کہ جو مصحف لکھے اسے اس ہجا پر قائم رہنا چاہیے جس پر انھوں نے لکھا۔ دانی کہتے ہیں کہ امت کے علماء میں مالک کا کوئی مخالف نہیں۔ سبت دلیل لاتے ہیں کہ عثمان کے وقت صحابہ نے اسی رسم پر اجماع کیا، اور اس کی مخالفت کا دروازہ کھولنا قرآن سے چھیڑ چھاڑ اور اختلاف کا ذریعہ ہے کیونکہ رسم کے قواعد ملک ملک میں مختلف ہیں، اور کتابت کی اصطلاح تبدیلی کی زد میں ہے {cite:manahil-irfan-sabt p. 317} {cite:manahil-irfan-sabt p. 318} {cite:itqan-suyuti p. 2199}۔"
