- tradition: sunni
  id: common-reader-vs-the-learned
  standing: secondary
  stance:
    ar: للعامة بالاصطلاح الشائع وللعارفين بالرسم الأول
    en: The common reader in current convention, the first rasm kept for the learned
    ur: عام لوگوں کے لیے رائج اصطلاح، اور رسمِ اول جاننے والوں کے لیے
  summary:
    ar: "يميل صاحب «البرهان» إلى ما يُفهم من كلام العز بن عبد السلام من أنه يجوز بل يجب كتابة المصحف الآن لعامة الناس على الاصطلاحات المعروفة الشائعة عندهم، ولا تجوز كتابته لهم بالرسم الأول لئلا يوقع في تغيير من الجهال، مع المحافظة على الرسم العثماني أثراً نفيساً بأيدي العارفين. ويقيّده الزركشي نفسه: لا ينبغي إجراء هذا على إطلاقه لئلا يؤدي إلى دروس العلم، وشيء أحكمه القدماء لا يُترك مراعاة لجهل الجاهلين {cite:manahil-irfan-sabt p. 322}."
    en: "The author of al-Burhan inclines to what is understood from the words of al-Izz ibn Abd al-Salam: that it is allowed, even required, to write the codex now for the common people in the well-known conventions current among them, and not allowed to write it for them in the first rasm, lest the ignorant alter it, while still keeping the Uthmanic rasm as a precious relic in the hands of the learned. Al-Zarkashi himself limits it: this should not be applied without limit lest knowledge be lost; what the ancients set firm is not abandoned out of regard for the ignorant {cite:manahil-irfan-sabt p. 322}."
    ur: "«البرہان» کے مصنف اس بات کی طرف مائل ہیں جو عز بن عبد السلام کے کلام سے سمجھی جاتی ہے کہ اب عام لوگوں کے لیے مصحف کو ان کی معروف رائج اصطلاحات میں لکھنا جائز بلکہ واجب ہے، اور انھیں رسمِ اول میں لکھ کر دینا جائز نہیں تاکہ جاہل تبدیلی نہ کر بیٹھیں، جبکہ رسمِ عثمانی کو جاننے والوں کے ہاتھ میں ایک نفیس ورثے کے طور پر محفوظ رکھا جائے۔ خود زرکشی اسے محدود کرتے ہیں: اسے بے قید جاری نہ کیا جائے ورنہ علم مٹ جائے گا، اور جو چیز پرانوں نے مضبوط کی اسے جاہلوں کی رعایت میں چھوڑا نہیں جاتا {cite:manahil-irfan-sabt p. 322}۔"
