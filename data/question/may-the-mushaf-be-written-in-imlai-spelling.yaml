id: question/may-the-mushaf-be-written-in-imlai-spelling
class: question
label:
  ar: هل يجوز كتابة المصحف بالرسم الإملائي؟
  en: May the mushaf be written in ordinary (imla'i) spelling?
  ur: کیا مصحف کو عام املا ⁦(رسمِ املائی)⁩ میں لکھنا جائز ہے؟
summary:
  ar: "يعرض خالد السبت ثلاثة آراء: وجوب الالتزام بالرسم العثماني، وهو مذهب الجمهور وعن مالك وأحمد؛ وأن الرسم اصطلاحي لا توقيفي فتجوز مخالفته، وينسبه إلى ابن خلدون والباقلاني؛ وما يُفهم من كلام العز بن عبد السلام من جواز كتابته للعامة بالاصطلاح الشائع مع حفظ الرسم الأول للعارفين {cite:manahil-irfan-sabt p. 317} {cite:manahil-irfan-sabt p. 321} {cite:manahil-irfan-sabt p. 322}."
  en: "Khalid al-Sabt sets out three views: the obligation to keep the Uthmanic rasm, the majority view and reported from Malik and Ahmad; that the rasm is conventional, not fixed by revelation, so departing from it is allowed, which he ascribes to Ibn Khaldun and al-Baqillani; and what is understood from al-Izz ibn Abd al-Salam, that it may be written for the common reader in current convention while the first rasm is preserved for the learned {cite:manahil-irfan-sabt p. 317} {cite:manahil-irfan-sabt p. 321} {cite:manahil-irfan-sabt p. 322}."
  ur: "خالد السبت تین آراء بیان کرتے ہیں: رسمِ عثمانی کی پابندی لازم، جو جمہور کا مذہب ہے اور مالک و احمد سے منقول؛ رسم اصطلاحی ہے توقیفی نہیں اس لیے اس کی مخالفت جائز، جسے وہ ابن خلدون اور باقلانی کی طرف منسوب کرتے ہیں؛ اور وہ جو عز بن عبد السلام کے کلام سے سمجھا جاتا ہے کہ عام لوگوں کے لیے رائج اصطلاح میں لکھنا جائز ہے اور رسمِ اول جاننے والوں کے ہاں محفوظ رہے {cite:manahil-irfan-sabt p. 317} {cite:manahil-irfan-sabt p. 321} {cite:manahil-irfan-sabt p. 322}۔"
question:
  ar: هل يجوز، أو يجب، أن يُكتب المصحف اليوم على الهجاء المعتاد بدل الرسم العثماني؟
  en: May, or must, the mushaf today be written in the usual spelling instead of the Uthmanic rasm?
  ur: کیا آج مصحف کو عثمانی رسم کی جگہ معروف ہجا میں لکھنا جائز، یا واجب ہے؟
short_answer:
  ar: الجمهور على لزوم الرسم العثماني؛ وقال الباقلاني وينسب إلى ابن خلدون إنه اصطلاحي يجوز غيره؛ وفصّل العز بن عبد السلام بين العامة والعارفين، ويقيّد الزركشي هذا التفصيل بألا يؤدي إلى اندراس العلم.
  en: The majority hold the Uthmanic rasm binding; al-Baqillani, and Ibn Khaldun by attribution, held it conventional so that another may be used; al-Izz ibn Abd al-Salam distinguished the common reader from the learned, and al-Zarkashi limits this so that it does not lead to the loss of knowledge.
  ur: جمہور رسمِ عثمانی کو لازم کہتے ہیں؛ باقلانی نے، اور ابن خلدون کی طرف نسبت سے، اسے اصطلاحی کہا کہ دوسرا بھی جائز ہے؛ عز بن عبد السلام نے عام لوگوں اور جاننے والوں میں فرق کیا، اور زرکشی اس تفصیل کو اس شرط سے محدود کرتے ہیں کہ علم مٹ نہ جائے۔
