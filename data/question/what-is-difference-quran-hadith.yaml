id: question/what-is-difference-quran-hadith
class: question
label:
  ar: "ما الفرق بين القرآن والحديث؟"
  en: What is the difference between the Quran and hadith?
  es: "¿Cuál es la diferencia entre el Corán y el hadiz?"
  fr: "Quelle est la différence entre le Coran et les hadiths ?"
  ur: "قرآن اور حدیث میں کیا فرق ہے؟"
summary:
  ar: "القرآن كلام الله المنزل الذي يتعبد بتلاوته، والحديث ما نقل عن النبي من قول وفعل وتقرير يُؤخذ به على ضوابط الإسناد والمتن."
  en: "The Quran is the revealed speech of God, recited as an act of worship. Hadith is what was transmitted from the Prophet in saying, action and tacit approval, and it is accepted according to the rules governing its chain of transmission (isnad) and its text (matn)."
  es: "El Corán es la palabra revelada de Dios, recitada como acto de adoración. El Hadiz es lo que fue transmitido del Profeta en palabras, acciones y aprobación tácita, y se acepta según las reglas que rigen su cadena de transmisión (isnad) y su texto (matn)."
  fr: "Le Coran est la parole révélée de Dieu, récitée comme un acte d'adoration. Le hadith est ce qui a été transmis du Prophète par la parole, l'action et l'approbation tacite, et il est accepté selon les règles qui régissent sa chaîne de transmission (isnad) et son texte (matn)."
  ur: "قرآن خدا کی نازل کردہ تقریر ہے، جسے عبادت کے طور پر پڑھا جاتا ہے۔ حدیث وہ ہے جو رسول اللہ سے قول و فعل اور ظاہری منظوری میں منقول ہو اور اسے اس کی سند اور اس کے متن ⁦(متن)⁩ کے احکام کے مطابق قبول کیا جاتا ہے۔"
wings: []
question:
  ar: "ما الفرق بين القرآن والحديث؟"
short_answer:
  ar: "القرآن كلام الله المنزل الذي يتعبد بتلاوته، والحديث ما نقل عن النبي من قول وفعل وتقرير يُؤخذ به على ضوابط الإسناد والمتن."
long_answer:
  ar: |
    القرآن [[work/quran|كتاب الله]] المنزل، والحديث علم آخر بضوابطه يسمى [[concept/al-hadith-al-nabawi|الحديث النبوي]] وله مصطلح خاص في [[concept/mustalah-al-hadith|مصطلح الحديث]].
    ومن الحديث ما هو [[concept/hadith-qudsi|حديث قدسي]] يرويه النبي عن ربه بلفظه، فلا يعد من القرآن ولا يتعبد بتلاوته.

