id: question/what-is-difference-quran-hadith
class: question
label:
  ar: "ما الفرق بين القرآن والحديث؟"
  en: What is the difference between the Quran and hadith?
summary:
  ar: "القرآن كلام الله المنزل الذي يتعبد بتلاوته، والحديث ما نقل عن النبي من قول وفعل وتقرير يُؤخذ به على ضوابط الإسناد والمتن."
  en: "The Quran is the revealed speech of God, recited as an act of worship. Hadith is what was transmitted from the Prophet in saying, action and tacit approval, and it is accepted according to the rules governing its chain of transmission (isnad) and its text (matn)."
wings: []
question:
  ar: "ما الفرق بين القرآن والحديث؟"
short_answer:
  ar: "القرآن كلام الله المنزل الذي يتعبد بتلاوته، والحديث ما نقل عن النبي من قول وفعل وتقرير يُؤخذ به على ضوابط الإسناد والمتن."
long_answer:
  ar: |
    القرآن [[work/quran|كتاب الله]] المنزل، والحديث علم آخر بضوابطه يسمى [[concept/al-hadith-al-nabawi|الحديث النبوي]] وله مصطلح خاص في [[concept/mustalah-al-hadith|مصطلح الحديث]].
    ومن الحديث ما هو [[concept/hadith-qudsi|حديث قدسي]] يرويه النبي عن ربه بلفظه، فلا يعد من القرآن ولا يتعبد بتلاوته.

