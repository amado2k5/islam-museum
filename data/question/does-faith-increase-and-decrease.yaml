id: question/does-faith-increase-and-decrease
class: question
label: { ar: "هل يزيد الإيمان وينقص؟", en: "Does faith increase and decrease?", ur: "کیا ایمان بڑھتا اور گھٹتا ہے؟" }
question: { ar: "هل الإيمان شيء واحد لا يتفاضل، أم له شعب يزيد بها وينقص ويتفاضل فيه الناس؟", en: "Is faith a single thing that admits no degrees, or does it have branches by which it grows and shrinks and people differ in it?", ur: "کیا ایمان ایک ہی چیز ہے جس میں کمی بیشی نہیں، یا اس کی شاخیں ہیں جن سے وہ بڑھتا گھٹتا ہے اور لوگ اس میں مختلف درجے رکھتے ہیں؟" }
issue: { ar: "مسألة دخول الأعمال في مسمى الإيمان وتفاضله، كما يبوّب لها أبو داود في كتاب السنة ⁦(«باب في رد الإرجاء» و«باب الدليل على زيادة الإيمان ونقصانه»)⁩ ويشرحها الخطابي.", en: "Whether deeds are part of what 'faith' names and whether it has degrees, as Abu Dawud arranges it in the Book of the Sunna ('refuting irja'' and 'the proof that faith increases and decreases') and al-Khattabi explains it." }
summary:
  ar: "يجعل أبو داود في كتاب السنة باباً «في رد الإرجاء» يروي فيه حديث «الإيمان بضع وسبعون شعبة… والحياء شعبة من الإيمان» وحديث وفد عبد القيس الذي عدّ فيه الصلاة والزكاة والصوم وأداء الخمس من الإيمان، ثم «باب الدليل على زيادة الإيمان ونقصانه»؛ ويرى الخطابي أن الإيمان الشرعي اسم لمعنى ذي شعب وأجزاء له أعلى وأدنى، وأن في الباب إثبات التفاضل في الإيمان وتباين المؤمنين في درجاته {cite:sunan-abi-dawud-ibn-hazm-1997-v5 p. 39-42}."
  en: "In the Book of the Sunna Abu Dawud has a chapter 'refuting irja'' with the report 'faith has seventy-odd branches… and modesty is a branch of faith' and the report of the delegation of 'Abd al-Qays, in which prayer, zakat, fasting and paying the fifth are counted as faith, followed by 'the proof that faith increases and decreases'; al-Khattabi holds that faith in the religious sense names a reality with branches and parts, higher and lower, and that the chapter establishes degrees in faith and differences of rank among believers {cite:sunan-abi-dawud-ibn-hazm-1997-v5 p. 39-42}."
  ur: "ابو داؤد کتاب السنہ میں «ارجاء کے رد میں» ایک باب رکھتے ہیں جس میں حدیث «ایمان کی ستر سے زیادہ شاخیں ہیں… اور حیا ایمان کی ایک شاخ ہے» اور وفدِ عبد القیس کی حدیث ہے جس میں نماز، زکاۃ، روزہ اور خمس کی ادائیگی کو ایمان میں شمار کیا گیا، پھر «ایمان کے بڑھنے اور گھٹنے کی دلیل کا باب»؛ خطابی کے نزدیک شرعی ایمان ایسی حقیقت کا نام ہے جس کی شاخیں اور اجزا ہیں، اعلیٰ اور ادنیٰ، اور اس باب سے ایمان میں تفاضل اور مومنوں کے درجات کا فرق ثابت ہوتا ہے {cite:sunan-abi-dawud-ibn-hazm-1997-v5 p. 39-42}۔"
short_answer:
  ar: "عند أبي داود والخطابي: نعم، الإيمان ذو شعب يتفاضل فيه المؤمنون؛ ولم يُعرض هنا قول المرجئة من مصادرهم."
  en: "For Abu Dawud and al-Khattabi: yes, faith has branches and believers differ in it; the Murji'a view is not presented here from their own sources."
  ur: "ابو داؤد اور خطابی کے نزدیک: ہاں، ایمان شاخوں والا ہے اور مومن اس میں مختلف درجے رکھتے ہیں؛ مرجئہ کا قول یہاں ان کے اپنے مصادر سے پیش نہیں کیا گیا۔"
perspectives:
  - tradition: sunni
    id: abu-dawud-khattabi-branches
    standing: main
    stance: { ar: "الإيمان قول وعمل ذو شعب، يزيد وينقص", en: "Faith is word and deed, with branches; it increases and decreases" }
    summary: { ar: "يبوّب أبو داود للرد على الإرجاء ولزيادة الإيمان ونقصانه؛ ويقول الخطابي إن الاسم يتعلق ببعض شعب الإيمان كما يتعلق بكلها، والحقيقة تقتضي جميعها، كالصلاة الشرعية؛ وإن النبي في حديث وفد عبد القيس جعل الصلاة والزكاة والصوم وخمس الغنيمة من الإيمان، ولا يخالف ذلك حديث «أمرت أن أقاتل الناس حتى يقولوا لا إله إلا الله» لأن الكلمة شعار الدخول، والتفصيل لا يناقض الجملة.", en: "Abu Dawud gives chapters refuting irja' and on the increase and decrease of faith; al-Khattabi says the name 'faith' attaches to some of its branches as it does to all of them, while its full reality requires all, as with the canonical prayer; in the report of 'Abd al-Qays the Prophet counted prayer, zakat, fasting and the fifth of the spoils as faith, which does not conflict with 'I was commanded to fight people until they say there is no god but God', since that phrase is the badge of entry and the detailed account does not contradict the summary." }
