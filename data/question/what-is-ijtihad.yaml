id: question/what-is-ijtihad
class: question
label:
  ar: ما الاجتهاد؟
  en: What is ijtihad?
  es: "¿Qué es el ijtihad?"
  fr: "Qu'est-ce que l'ijtihad ?"
summary:
  ar: الاجتهاد هو بذل الجهد لاستنباط الحكم من الأدلة؛ مقيّده المفتي الفقيه ومطلقه من يبلغ رتبة أهلية التفريع
    الشرعي.
  en: "Ijtihad is the exertion of effort to derive a ruling from the sources. The restricted form belongs to the jurist-mufti who issues fatwas; the unrestricted form belongs to one who reaches the rank of competence for legal derivation."
  es: "El ijtihad es el esfuerzo por obtener una resolución a partir de las fuentes. La forma restringida corresponde al jurista-muftí que emite fatuas; la forma no restringida corresponde a quien alcanza el rango de competencia para la derivación legal."
  fr: "L'ijtihad est l'effort déployé pour déduire une décision des sources. Sa forme restreinte est celle du juriste-mufti qui émet des fatwas; sa forme non restreinte est celle de celui qui atteint le rang de compétence requis pour l'interprétation juridique."
question:
  ar: ما الاجتهاد؟
short_answer:
  ar: الاجتهاد هو بذل الجهد لاستنباط الحكم من الأدلة؛ مقيّده المفتي الفقيه ومطلقه من يبلغ رتبة أهلية التفريع
    الشرعي.
long_answer:
  ar: الاجتهاد هو بذل الفقيه وسعه في استنباط الحكم الشرعي من نصوصه وأدلته؛ منه اجتهاد إنشاء مذهب واجتهاد
    انتساب واجتهاد مسألة. أجمع العلماء على مشروعيته واختلفوا في أهليته وشروطه ومصيره في العصور المتأخرة.
