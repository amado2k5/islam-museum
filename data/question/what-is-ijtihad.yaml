long_answer:
  ar: الاجتهاد هو بذل الفقيه وسعه في استنباط الحكم الشرعي من نصوصه وأدلته؛ منه اجتهاد إنشاء مذهب واجتهاد
    انتساب واجتهاد مسألة. أجمع العلماء على مشروعيته واختلفوا في أهليته وشروطه ومصيره في العصور المتأخرة.
