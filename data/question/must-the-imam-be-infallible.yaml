id: question/must-the-imam-be-infallible
class: question
label: { ar: "هل يجب أن يكون الإمام معصوماً؟", en: "Must the imam be infallible?", ur: "کیا امام کا معصوم ہونا ضروری ہے؟" }
summary:
  ar: "جعل ابن المطهر الحلي عصمة الإمام أول أدلته العقلية على إمامة علي، مستنداً إلى حاجة الاجتماع البشري وإلى اللطف الواجب على الله، ورد ابن تيمية بأن المعصوم الواجب الطاعة هو الرسول، وأن المقصود من الإمام لا يحصل بإمام غائب."
  en: "Ibn al-Mutahhar al-Hilli made the imam's infallibility his first rational proof of Ali's imamate, grounding it in the needs of human society and in the favour (lutf) he held God must grant; Ibn Taymiyya replied that the infallible one whose obedience is due is the Messenger, and that the purpose of an imam is not achieved by a hidden one."
question: { ar: "هل يجب أن يكون الإمام معصوماً؟", en: "Must the imam be infallible?" }
issue: { ar: "هل العصمة شرط في الإمام، وهل يجب على الله نصب إمام معصوم لطفاً بالعباد؟" }
short_answer:
  ar: "الإمامية كما يعرضها الحلي: نعم، الإمام معصوم منصوص عليه لطفاً من الله؛ ابن تيمية: العصمة للرسول، ولا يُحتاج إلى إمام معصوم بعده، والإمام الغائب لا يحقق مقصود الإمامة."
  en: "The Imamiyya as al-Hilli presents them: yes, the imam is infallible and designated as a divine favour. Ibn Taymiyya: infallibility belongs to the Messenger, no infallible imam is needed after him, and a hidden imam does not fulfil the purpose of the imamate."
