id: question/must-the-imam-be-infallible
class: question
label: { ar: "هل يجب أن يكون الإمام معصوماً؟", en: "Must the imam be infallible?", ur: "کیا امام کا معصوم ہونا ضروری ہے؟", es: "¿Debe ser infalible el imán?", fr: "L'imam doit-il être infaillible ?" }
summary:
  ar: "جعل ابن المطهر الحلي عصمة الإمام أول أدلته العقلية على إمامة علي، مستنداً إلى حاجة الاجتماع البشري وإلى اللطف الواجب على الله، ورد ابن تيمية بأن المعصوم الواجب الطاعة هو الرسول، وأن المقصود من الإمام لا يحصل بإمام غائب."
  en: "Ibn al-Mutahhar al-Hilli made the imam's infallibility his first rational proof of Ali's imamate, grounding it in the needs of human society and in the favour (lutf) he held God must grant; Ibn Taymiyya replied that the infallible one whose obedience is due is the Messenger, and that the purpose of an imam is not achieved by a hidden one."
  es: "Ibn al-Mutahhar al-Hilli hizo de la infalibilidad del imán su primera prueba racional del imamato de Ali, fundamentándola en las necesidades de la sociedad humana y en el favor (lutf) que él creía que Dios debía conceder; Ibn Taymiyya respondió que el infalible a quien se debe obediencia es el Mensajero, y que el propósito de un imán no se logra mediante uno oculto."
  fr: "Ibn al-Mutahhar al-Hilli a fait de l'infaillibilité de l'imam sa première preuve rationnelle de l'imamat d'Ali, la fondant sur les besoins de la société humaine et sur la faveur (lutf) que Dieu devait accorder; Ibn Taymiyya a répondu que l'infaillible à qui l'obéissance est due est le Messager, et que le but d'un imam n'est pas atteint par un imam caché."
  ur: "ابن المطہر ہلی نے امام کی عصمت کو علی کی امامت کا پہلا عقلی ثبوت قرار دیا، اسے انسانی معاشرے کی ضرورتوں اور اس کے حق میں ⁦(لطف)⁩ کے مطابق خدا کو عطا کرنا ضروری قرار دیا۔ ابن تیمیہ نے جواب دیا کہ جس معصوم کی اطاعت واجب ہے وہ رسول ہے اور امام کا مقصد پوشیدہ سے حاصل نہیں ہوتا۔"
question: { ar: "هل يجب أن يكون الإمام معصوماً؟", en: "Must the imam be infallible?" }
issue: { ar: "هل العصمة شرط في الإمام، وهل يجب على الله نصب إمام معصوم لطفاً بالعباد؟" }
short_answer:
  ar: "الإمامية كما يعرضها الحلي: نعم، الإمام معصوم منصوص عليه لطفاً من الله؛ ابن تيمية: العصمة للرسول، ولا يُحتاج إلى إمام معصوم بعده، والإمام الغائب لا يحقق مقصود الإمامة."
  en: "The Imamiyya as al-Hilli presents them: yes, the imam is infallible and designated as a divine favour. Ibn Taymiyya: infallibility belongs to the Messenger, no infallible imam is needed after him, and a hidden imam does not fulfil the purpose of the imamate."
