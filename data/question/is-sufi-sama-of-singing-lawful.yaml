    id: permitters-of-sama-as-reported-by-ibn-qayyim
    standing: secondary
    stance: { ar: "السماع مباح، وقد يكون قربة لمن كانت محبته رحمانية", en: "Sama' is permitted, and may be a devotion for one whose love is for God", ur: "سماع مباح ہے، اور جس کی محبت رحمانی ہو اس کے لیے عبادت بھی ہو سکتا ہے" }
    summary: { ar: "في نقل ابن القيم وحده، ودون تسمية قائليه: احتج المجيزون بأن الصوت الطيب مستلذ طبعاً ونعمة من الله، وأن الطفل يسكن إليه والإبل يخف عليها السير بالحداء، وأن الله ذم الصوت الفظيع ووصف سماع أهل الجنة، وبأحاديث التغني بالقرآن وثناء النبي على صوت أبي موسى، وإقراره غناء الجاريتين يوم العيد، وإذنه في اللهو في العرس، وسماعه الحداء وقصيدة كعب بن زهير وشعر أمية وحسان؛ وبأن ابن عمر وعبد الله بن جعفر وأهل المدينة رخصوا فيه، وأن أولياء حضروه، وأن أصوات الطيور مباحة إجماعاً، وأن السماع يحرك المحب إلى محبوبه فيكون قربة إن كانت المحبة رحمانية. هذا عرض خصمهم لحججهم، ويحتاج إلى مصادر أصحاب هذا القول أنفسهم.", en: "In Ibn al-Qayyim's report alone, without naming those who held it: the permitters argued that a fine voice is naturally pleasing and a blessing from God, that a child is calmed by it and camels' journey is eased by chanting, that God blamed the ugly voice and described the hearing of Paradise; they cited the hadiths on beautifying the Qur'an with the voice, the Prophet's praise of Abu Musa's voice, his allowing the two girls' singing on the feast day, his permitting entertainment at weddings, and his hearing of chants, of Ka'b ibn Zuhayr's ode and of the poetry of Umayya and Hassan; and they said that Ibn Umar, Abd Allah ibn Ja'far and the people of Medina allowed it, that saints attended it, that birdsong is agreed to be permitted, and that hearing moves the lover towards his beloved, so it is a devotion if the love is for God. This is their opponent's presentation of their arguments; it needs the holders' own sources.", ur: "صرف ابن القیم کی نقل میں، اور قائلین کا نام لیے بغیر: جائز کہنے والوں نے دلیل دی کہ اچھی آواز طبعاً لذیذ اور اللہ کی نعمت ہے، بچہ اس سے سکون پاتا ہے اور حُدا سے اونٹوں کا سفر آسان ہوتا ہے، اللہ نے بری آواز کی مذمت کی اور اہلِ جنت کے سماع کا ذکر کیا؛ انہوں نے قرآن کو آواز سے سنوارنے کی احادیث، نبی کی ابو موسیٰ کی آواز کی تعریف، عید کے دن دو لڑکیوں کا گانا برقرار رکھنے، شادی میں لہو کی اجازت دینے، اور آپ کے حُدا، کعب بن زہیر کے قصیدے اور امیہ و حسان کے اشعار سننے سے استدلال کیا؛ اور کہا کہ ابن عمر، عبد اللہ بن جعفر اور اہلِ مدینہ نے اس کی رخصت دی، اولیاء اس میں حاضر ہوئے، پرندوں کی آوازیں بالاجماع مباح ہیں، اور سماع محب کو اس کے محبوب کی طرف حرکت دیتا ہے، چنانچہ اگر محبت رحمانی ہو تو عبادت ہے۔ یہ ان کے مخالف کی طرف سے ان کے دلائل کی پیشکش ہے؛ اس قول کے قائلین کے اپنے مصادر درکار ہیں۔" }
