id: question/is-sufi-sama-of-singing-lawful
class: question
label: { ar: "هل سماع الغناء والأبيات قربة في طريق السالكين؟", en: "Is listening to singing and poetry (sama') a devotion on the spiritual path?", ur: "کیا گانا اور اشعار سننا (سماع) سلوک کی راہ میں عبادت ہے؟" }
summary:
  ar: "في منزلة السماع من مدارج السالكين يميز ابن قيم الجوزية بين سماع القرآن، وهو السماع الممدوح، وسماع مذموم من الغناء والمعازف، وسماع مباح لا يُحمد ولا يُذم، ويرى أن تحريم المباح قول على الله بلا علم وأن جعل الغناء قربة ابتداع؛ ويحكي حجج من أباح السماع الصوفي ثم يرد عليها بثلاث قواعد."
  en: "In the station of hearing in Madarij al-Salikin, Ibn Qayyim al-Jawziyya distinguishes the praised hearing of the Qur'an, a blameworthy hearing of singing and instruments, and a permitted hearing that is neither praised nor blamed; he holds that forbidding the permitted is speaking about God without knowledge and that making singing a devotion is innovation. He reports the arguments of those who permitted Sufi sama' and answers them with three rules."
  ur: "مدارج السالکین کی منزلِ سماع میں ابن قیم الجوزیہ قرآن کے قابل تعریف سماع، گانے اور آلاتِ موسیقی کے مذموم سماع، اور ایسے مباح سماع میں فرق کرتے ہیں جو نہ قابل تعریف ہے نہ قابل مذمت؛ ان کے نزدیک مباح کو حرام کہنا اللہ پر بغیر علم بات کہنا ہے اور گانے کو عبادت بنانا بدعت ہے۔ وہ صوفیانہ سماع کو جائز کہنے والوں کے دلائل نقل کرتے ہیں اور پھر تین قواعد سے ان کا جواب دیتے ہیں۔"
question: { ar: "هل سماع الغناء والأبيات قربة في طريق السالكين؟", en: "Is listening to singing and poetry (sama') a devotion on the spiritual path?", ur: "کیا گانا اور اشعار سننا (سماع) سلوک کی راہ میں عبادت ہے؟" }
issue:
  ar: "هل يجوز اتخاذ سماع الغناء والقصائد بالدف والمزمار طريقاً يُتقرب به إلى الله وتُستنزل به الأحوال، أم أن السماع المشروع في الطريق هو سماع القرآن، وما حكم السماع المباح؟"
  en: "May listening to songs and poems with tambourine and pipe be taken as a means of drawing near to God and of bringing on spiritual states, or is the hearing prescribed for the path that of the Qur'an – and what of hearing that is merely permitted?"
  ur: "کیا دف اور بانسری کے ساتھ گانے اور قصیدے سننے کو اللہ کے قرب کا ذریعہ اور احوال طاری کرنے کا طریقہ بنانا جائز ہے، یا راہِ سلوک میں مشروع سماع قرآن کا سماع ہے – اور محض مباح سماع کا کیا حکم ہے؟"
short_answer:
  ar: "ابن القيم: السماع الممدوح سماع القرآن، والسماع الغنائي بالآلات مذموم ولا يكون قربة، والمباح كإنشاد الشعر الحسن والحداء يبقى مباحاً لا يُتعبد به. المجيزون كما يحكيهم: الصوت الحسن نعمة ومستلذ طبعاً، والنبي سمع الشعر والحداء وأقر غناء الجاريتين يوم العيد، وحضره أولياء، وهو يقوي المحبة الرحمانية."
  en: "Ibn al-Qayyim: the praised hearing is that of the Qur'an; musical singing with instruments is blameworthy and cannot be a devotion; the permitted, such as good poetry and camel-driving chants, stays permitted but is not an act of worship. The permitters as he reports them: a beautiful voice is a blessing and naturally pleasing, the Prophet heard poetry and chants and allowed the two girls' singing on the feast day, saints attended it, and it strengthens love of God."
  ur: "ابن القیم: قابل تعریف سماع قرآن کا ہے؛ آلات کے ساتھ گانے کا سماع مذموم ہے اور عبادت نہیں ہو سکتا؛ مباح، جیسے اچھے اشعار اور حُدا، مباح ہی رہتا ہے مگر اسے عبادت نہیں بنایا جاتا۔ جائز کہنے والے، جیسا وہ نقل کرتے ہیں: اچھی آواز نعمت اور طبعاً لذیذ ہے، نبی نے اشعار اور حُدا سنا اور عید کے دن دو لڑکیوں کا گانا برقرار رکھا، اولیاء اس میں حاضر ہوئے، اور یہ اللہ کی محبت کو قوی کرتا ہے۔"
perspectives:
  - tradition: sunni-hanbali
    id: ibn-qayyim-madarij-sama-quran
    standing: main
    stance: { ar: "السماع المشروع في الطريق سماع القرآن؛ الغناء بالآلات مذموم ولا يكون قربة، والمباح لا يُحرم ولا يُتعبد به", en: "The hearing prescribed for the path is that of the Qur'an; singing with instruments is blameworthy and no devotion; the permitted is neither forbidden nor made worship", ur: "راہِ سلوک میں مشروع سماع قرآن کا ہے؛ آلات کے ساتھ گانا مذموم ہے اور عبادت نہیں؛ مباح نہ حرام ہے نہ عبادت بنایا جاتا ہے" }
    summary: { ar: "يقسم ابن القيم المسموع ثلاثة أضرب: ما يحبه الله وهو سماع آياته، وما يبغضه كالباطل واللغو والغناء، وما هو مباح لا يحبه ولا يبغضه؛ ويقول إن من حرّم الثالث قال على الله ما لا يعلم، ومن جعله ديناً وقربة شرع ديناً لم يأذن به الله. ويستشهد بقول ابن مسعود إن الغناء ينبت النفاق في القلب، ويجيب عن حجج المجيزين بأن اللذة لا تدل على حكم، وأن أصوات الطيور لا تقاس على الغناء بالآلات، وأن أحاديث الشعر والحداء ليست في محل النزاع؛ ثم يضع ثلاث قواعد: الذوق والحال محكوم عليهما لا حاكمان، والمرد عند النزاع إلى الوحي، وما غلبت مفسدته وأفضى إلى الحرام فهو محرم.", en: "Ibn al-Qayyim divides what is heard into three: what God loves, the hearing of His verses; what He hates, such as falsehood, idle talk and singing; and the permitted, which He neither loves nor hates. Whoever forbids the third, he says, speaks about God without knowledge; whoever makes it religion and devotion legislates a religion God has not permitted. He cites Ibn Mas'ud's saying that singing grows hypocrisy in the heart, and answers the permitters: pleasure indicates no ruling, birdsong cannot be compared to singing with instruments, and the hadiths on poetry and chants are not where the dispute lies. He then sets three rules: taste and state are judged, not judges; in a dispute the reference is revelation; and what carries a preponderant harm and leads to the forbidden is forbidden.", ur: "ابن القیم سنی جانے والی چیز کو تین قسموں میں بانٹتے ہیں: جو اللہ کو محبوب ہے، یعنی اس کی آیات کا سماع؛ جو اسے ناپسند ہے، جیسے باطل، لغو اور گانا؛ اور مباح، جسے وہ نہ پسند کرتا ہے نہ ناپسند۔ ان کے بقول جو تیسری قسم کو حرام کہے وہ اللہ پر بغیر علم بات کہتا ہے، اور جو اسے دین اور عبادت بنائے وہ ایسا دین گھڑتا ہے جس کی اللہ نے اجازت نہیں دی۔ وہ ابن مسعود کا قول نقل کرتے ہیں کہ گانا دل میں نفاق اگاتا ہے، اور جائز کہنے والوں کو جواب دیتے ہیں: لذت کسی حکم پر دلالت نہیں کرتی، پرندوں کی آوازوں پر آلات والے گانے کو قیاس نہیں کیا جا سکتا، اور اشعار اور حُدا کی احادیث محلِ نزاع نہیں۔ پھر وہ تین قواعد رکھتے ہیں: ذوق اور حال محکوم ہیں، حاکم نہیں؛ نزاع میں رجوع وحی کی طرف ہے؛ اور جس میں فساد غالب ہو اور جو حرام تک لے جائے وہ حرام ہے۔" }
