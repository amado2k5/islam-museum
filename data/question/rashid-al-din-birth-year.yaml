id: question/rashid-al-din-birth-year
class: question
label:
  ar: "متى وُلد رشيد الدين؟"
  en: "When was Rashid al-Din born?"
  ur: "رشید الدین کب پیدا ہوئے؟"
  fr: "Quand Rashid al-Din est-il né ?"
  es: "¿Cuándo nació Rashid al-Din?"
  tr: "Rashid al-Din ne zaman doğdu?"
  id: "Kapan Rashid al-Din lahir?"
summary:
  ar: "يذكر الصقاعي أن رشيد الدين توفي في الثمانين من عمره، فيكون ميلاده سنة 638 هـ بحسب هذه الرواية، والخشاب يرى الدعوى غير دقيقة، ويرجح شهادة رشيد الدين نفسه أنه كان في حوالي الستين سنة 705 هـ، فيستنبط ميلاده سنة 645 هـ، أي نحو 1247 م {cite:jami-al-tawarikh-khashshab-1960 p. 34}. وتاريخ وفاته سنة 718 هـ معروف عند الخشاب {cite:jami-al-tawarikh-khashshab-1960 p. 34}."
  en: "Al-Saqa'i says that Rashid al-Din died at eighty, which by that account puts his birth in 638 AH. The translator finds that claim imprecise and prefers Rashid's own statement that he was about sixty in 705 AH, which gives a birth in 645 AH, about 1247 CE {cite:jami-al-tawarikh-khashshab-1960 p. 34}. The translator takes his death in 718 AH as certain {cite:jami-al-tawarikh-khashshab-1960 p. 34}."
  es: "Al-Saqa'i dice que Rashid al-Din murió a los ochenta años, lo que sitúa su nacimiento en 638 de la Hégira según ese relato. El traductor considera imprecisa esa afirmación y prefiere la declaración del propio Rashid de que tenía unos sesenta años en 705 de la Hégira, lo que da un nacimiento en 645 de la Hégira, hacia 1247 d. C. {cite:jami-al-tawarikh-khashshab-1960 p. 34}. El traductor da por cierta su muerte en 718 de la Hégira {cite:jami-al-tawarikh-khashshab-1960 p. 34}."
  fr: "Al-Saqa'i affirme que Rashid al-Din mourut à quatre-vingts ans, ce qui place sa naissance en 638 de l'Hégire selon ce récit. Le traducteur juge ce calcul imprécis et préfère la déclaration de Rashid lui-même, qui dit avoir environ soixante ans en 705 de l'Hégire, ce qui donne une naissance en 645 de l'Hégire, vers 1247 de notre ère {cite:jami-al-tawarikh-khashshab-1960 p. 34}. Le traducteur tient sa mort en 718 de l'Hégire pour certaine {cite:jami-al-tawarikh-khashshab-1960 p. 34}."
  ur: "الصقاعی کہتے ہیں کہ رشید الدین اسی برس کی عمر میں فوت ہوئے، اس بیان کے مطابق ان کی پیدائش 638ھ میں ہوئی۔ مترجم اس دعوے کو غیر درست سمجھتے ہیں اور رشید الدین کے اپنے بیان کو ترجیح دیتے ہیں کہ 705ھ میں وہ تقریباً ساٹھ برس کے تھے، جس سے پیدائش 645ھ، یعنی تقریباً 1247ء بنتی ہے {cite:jami-al-tawarikh-khashshab-1960 p. 34}۔ مترجم کے نزدیک ان کی وفات 718ھ میں یقینی ہے {cite:jami-al-tawarikh-khashshab-1960 p. 34}۔"
  tr: "El-Sukai, Raşiddin'in seksen yaşında öldüğünü belirtir, bu nedenle bu anlatıma göre doğumunun 638 Hicri yılıdır. El-Khesap bu iddiayı yanlış bulur ve Raşidddin kendisi de onun yaklaşık altmış yaşında olduğunu 705 Hicri yılında, yani yaklaşık 1247 M.S. olduğunu savunur {atıf:jami-al-tawarikh-khashshab-1960 s. 34}. Ölüm tarihi 718 Hicri tarafından bilinmektedir {cite:jami-al-tawarikh-khashshab-1960 s. 34}."
  id: "Al-Suqa'i menyebutkan bahwa Rashid al-Din meninggal pada usia delapan puluh tahun, jadi menurut catatan ini, kelahirannya adalah 638 H. Al-Khashab menganggap klaim ini tidak akurat, dan Rashid al-Din sendiri mendukung bahwa ia berusia sekitar enam puluh tahun pada 705 H, menyimpulkan kelahirannya sekitar 645 H, sekitar 1247 M {cite:jami-al-tawarikh-khashshab-1960 hlm. 34}. Tanggal kematiannya pada 718 H. diketahui oleh al-Khashab {cite:jami-al-tawarikh-khashshab-1960 hlm. 34}."
question:
  ar: "في أي سنة هجرية وُلد رشيد الدين، وما الشهادة الأوثق؟"
  en: "In what Hijri year was Rashid al-Din born, and which testimony is more reliable?"
  ur: "رشید الدین کی ولادت کس ہجری سال میں ہوئی، اور کون سی شہادت زیادہ معتبر ہے؟"
  fr: "En quelle année hégirienne Rashid al-Din est-il né, et quel témoignage est le plus sûr ?"
  es: "¿En qué año de la Hégira nació Rashid al-Din, y qué testimonio es más fiable?"
issue:
  ar: "قولان: الصقاعي يذكر أنه مات في الثمانين، ورشيد الدين يذكر أنه كان نحو الستين سنة في 705 هـ. والكتاب لا يذكر تاريخ الميلاد مباشرة."
  en: "Two accounts: al-Saqa'i says he died at eighty, while Rashid says that in 705 AH he was about sixty. The book gives no direct date of birth."
  ur: "دو بیانات ہیں: الصقاعی کہتے ہیں کہ وہ اسی برس کی عمر میں فوت ہوئے، جبکہ رشید الدین کہتے ہیں کہ 705ھ میں وہ تقریباً ساٹھ برس کے تھے۔ کتاب پیدائش کی براہِ راست تاریخ نہیں دیتی۔"
  fr: "Deux récits : al-Saqa'i dit qu'il mourut à quatre-vingts ans, tandis que Rashid dit qu'il avait environ soixante ans en 705 de l'Hégire. Le livre ne donne pas de date de naissance directe."
  es: "Dos relatos: al-Saqa'i dice que murió a los ochenta años, mientras Rashid dice que en 705 de la Hégira tenía unos sesenta. El libro no da una fecha de nacimiento directa."
short_answer:
  ar: "يرجّح المترجم شهادة رشيد الدين أنه وُلد نحو 645 هـ، ويرى ما ذكره الصقاعي غير دقيق."
  en: "The translator prefers Rashid's own testimony and places his birth around 645 AH, judging al-Saqa'i's figure imprecise."
  ur: "مترجم رشید الدین کی اپنی شہادت کو ترجیح دیتے ہیں اور ان کی پیدائش تقریباً 645ھ بتاتے ہیں، جبکہ الصقاعی کی بات کو غیر درست سمجھتے ہیں۔"
  fr: "Le traducteur préfère le témoignage de Rashid et place sa naissance vers 645 de l'Hégire, jugeant imprécis le chiffre d'al-Saqa'i."
  es: "El traductor prefiere el testimonio de Rashid y sitúa su nacimiento hacia 645 de la Hégira, considerando impreciso el dato de al-Saqa'i."
