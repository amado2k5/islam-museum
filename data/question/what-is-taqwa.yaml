id: question/what-is-taqwa
class: question
label:
  ar: ما التقوى؟
  en: What is taqwa?
  es: "¿Qué es la taqwa?"
  fr: "Qu'est-ce que la taqwa ?"
  ur: "تقویٰ کیا ہے؟"
summary:
  ar: التقوى أن يجعل العبد بينه وبين ما يخافه ويحذره وقاية تقيه منه، وهي معنى يكرره القرآن في الأمر بالعبادة.
  en: Taqwa is the servant placing between himself and what he fears and guards against a protection that shields him from it. The Quran repeats this meaning when it commands worship.
  es: "Taqwa es el siervo que interpone entre sí mismo y aquello que teme, protegiéndolo de ello. El Corán reitera este significado cuando ordena la adoración."
  fr: "La piété (taqwa) consiste pour le serviteur à se protéger de ce qu'il craint, en instaurant une protection qui le préserve. Le Coran reprend cette idée lorsqu'il prescrit l'adoration."
  ur: "تقویٰ وہ ہے جو بندہ اپنے اور جس چیز سے ڈرتا ہے اس کے درمیان رکھتا ہے اور اس حفاظت سے حفاظت کرتا ہے جو اسے اس سے بچاتی ہے۔ جب قرآن عبادت کا حکم دیتا ہے تو اس معنی کو دہراتا ہے۔"
wings: []
question:
  ar: ما التقوى؟
short_answer:
  ar: التقوى أن يجعل العبد بينه وبين ما يخافه ويحذره وقاية تقيه منه، وهي معنى يكرره القرآن في الأمر بالعبادة.
long_answer:
  ar: |
    التقوى في اللغة والشرع أن يجعل الإنسان بينه وبين ما يخشاه وقاية، وفي الإسلام هي خوف الله وطاعته، كما يعرض مدخل [[concept/taqwa|التقوى]].
    ويربط القرآن الصيام بالتقوى في [[passage/quran-2-183|البقرة 183]]، فيُعد الصوم من وسائل التقوى كما يعرض مدخل [[practice/sawm-ramadan|صيام رمضان]].
    وهي معنى يتفرع منه كثير من الأخلاق والعبادات، ويعرض مدخل [[concept/iman|الإيمان]] صلتها بالعقيدة.
