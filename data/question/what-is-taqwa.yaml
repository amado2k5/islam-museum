id: question/what-is-taqwa
class: question
label:
  ar: ما التقوى؟
  en: What is taqwa?
summary:
  ar: التقوى أن يجعل العبد بينه وبين ما يخافه ويحذره وقاية تقيه منه، وهي معنى يكرره القرآن في الأمر بالعبادة.
  en: Taqwa is the servant placing between himself and what he fears and guards against a protection that shields him from it. The Quran repeats this meaning when it commands worship.
wings: []
question:
  ar: ما التقوى؟
short_answer:
  ar: التقوى أن يجعل العبد بينه وبين ما يخافه ويحذره وقاية تقيه منه، وهي معنى يكرره القرآن في الأمر بالعبادة.
long_answer:
  ar: |
    التقوى في اللغة والشرع أن يجعل الإنسان بينه وبين ما يخشاه وقاية، وفي الإسلام هي خوف الله وطاعته، كما يعرض مدخل [[concept/taqwa|التقوى]].
    ويربط القرآن الصيام بالتقوى في [[passage/quran-2-183|البقرة 183]]، فيُعد الصوم من وسائل التقوى كما يعرض مدخل [[practice/sawm-ramadan|صيام رمضان]].
    وهي معنى يتفرع منه كثير من الأخلاق والعبادات، ويعرض مدخل [[concept/iman|الإيمان]] صلتها بالعقيدة.
