id: question/what-was-yarmuk
class: question
label:
  ar: ما معركة اليرموك؟
  en: What was the Battle of Yarmuk?
  es: "¿Qué fue la Batalla de Yarmuk?"
  fr: "Qu'était-ce que la bataille de Yarmouk ?"
  ur: "یرموک کی جنگ کیا تھی؟"
summary:
  ar: اليرموك رجب 15هـ/أغسطس 636م؛ هزم فيها خالد بن الوليد الروم هزيمة كبرى فُتحت بها الشام وأُسقطت دولة
    هرقل منها.
  en: "Yarmuk, Rajab 15 AH / August 636 CE, was a battle in which Khalid ibn al-Walid inflicted a great defeat on the Byzantines. It opened Syria to the conquest and brought Heraclius's rule there to an end."
  es: "La batalla de Yarmuk, celebrada en Rajab del año 15 de la Hégira (agosto de 636 d. C.), fue una batalla en la que Khalid ibn al-Walid infligió una gran derrota a los bizantinos. Esta victoria abrió Siria a la conquista y puso fin al reinado de Heraclio en la región."
  fr: "La bataille de Yarmouk, le 15 Rajab de l'Hégire (août 636), vit Khalid ibn al-Walid infliger une lourde défaite aux Byzantins. Elle ouvrit la Syrie à la conquête et mit fin au règne d'Héraclius dans ce pays."
  ur: "یرموک، رجب 15 ہجری / اگست 636 عیسوی، ایک جنگ تھی جس میں خالد بن الولید نے بازنطینیوں کو زبردست شکست دی۔ اس نے شام کو فتح کے لیے کھول دیا اور وہاں ہرقل کی حکمرانی کا خاتمہ کیا۔"
question:
  ar: ما معركة اليرموك؟
short_answer:
  ar: اليرموك رجب 15هـ/أغسطس 636م؛ هزم فيها خالد بن الوليد الروم هزيمة كبرى فُتحت بها الشام وأُسقطت دولة
    هرقل منها.
long_answer:
  ar: '[[event/battle-of-yarmuk|اليرموك]] أعظم فتوح عمر؛ التقى فيها جيش خالد وقوامه نحو أربعين ألفًا بجيش
    هرقل المئتين ألفًا؛ انتصر المسلمون وفتحوا دمشق فالشام فالقدس؛ يوم وقفت نساء المسلمين بأعمدة الخيام
    فرددن الفارين. {cite:wikidata}'
