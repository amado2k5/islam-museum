long_answer:
  ar: '[[event/battle-of-yarmuk|اليرموك]] أعظم فتوح عمر؛ التقى فيها جيش خالد وقوامه نحو أربعين ألفًا بجيش
    هرقل المئتين ألفًا؛ انتصر المسلمون وفتحوا دمشق فالشام فالقدس؛ يوم وقفت نساء المسلمين بأعمدة الخيام
    فرددن الفارين. {cite:wikidata}'
