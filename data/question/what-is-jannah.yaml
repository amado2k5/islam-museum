question:
  ar: ما الجنة؟
short_answer:
  ar: الجنة هي دار النعيم الأبدي للمؤمنين؛ وصفها القرآن بأنهارها وقصورها ونعيم لا عين رأت، وأعلاها الفردوس.
long_answer:
  ar: الجنة هي دار الآخرة الخالدة للمؤمنين وعدهم الله بها؛ ورد في القرآن وصفها بأنهار من ماء ولبن وعسل
    وخمر غير مسكر، ودرجات أعلاها الفردوس الأعلى، وفيها رؤية الله التي هي أعلى النعيم عند أهل السنة. {cite:wikidata}
