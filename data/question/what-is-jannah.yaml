id: question/what-is-jannah
class: question
label:
  ar: ما الجنة؟
  en: What is Jannah?
  es: "¿Qué es Jannah?"
  fr: "Qu'est-ce que le Paradis ?"
  ur: "جنت کیا ہے؟"
summary:
  ar: الجنة هي دار النعيم الأبدي للمؤمنين؛ وصفها القرآن بأنهارها وقصورها ونعيم لا عين رأت، وأعلاها الفردوس.
  en: "Jannah is the everlasting abode of bliss for believers. The Qur'an describes its rivers, its palaces and a bliss no eye has seen, and its highest level is al-Firdaws."
  es: "El Paraíso es la morada eterna de la dicha para los creyentes. El Corán describe sus ríos, sus palacios y una dicha que ningún ojo ha visto, y su nivel más elevado es el Firdaws."
  fr: "Le Paradis est la demeure éternelle de félicité pour les croyants. Le Coran décrit ses fleuves, ses palais et une félicité que nul œil n'a jamais vue, et son niveau suprême est al-Firdaws."
  ur: "جنت مومنوں کے لیے ہمیشہ کی خوشیوں کا ٹھکانہ ہے۔ قرآن اس کے دریاؤں، اس کے محلات اور ایسی نعمتوں کو بیان کرتا ہے جو کسی آنکھ نے نہ دیکھا ہو، اور اس کا بلند ترین درجہ الفردوس ہے۔"
question:
  ar: ما الجنة؟
short_answer:
  ar: الجنة هي دار النعيم الأبدي للمؤمنين؛ وصفها القرآن بأنهارها وقصورها ونعيم لا عين رأت، وأعلاها الفردوس.
long_answer:
  ar: الجنة هي دار الآخرة الخالدة للمؤمنين وعدهم الله بها؛ ورد في القرآن وصفها بأنهار من ماء ولبن وعسل
    وخمر غير مسكر، ودرجات أعلاها الفردوس الأعلى، وفيها رؤية الله التي هي أعلى النعيم عند أهل السنة. {cite:wikidata}
