id: question/who-are-ansar-and-muhajirun
class: question
label:
  ar: "من الأنصار والمهاجرون؟"
  en: Who are the Ansar and the Muhajirun?
  es: "¿Quiénes son los Ansar y los Muhajirun?"
  fr: "Qui sont les Ansar et les Muhajirun ?"
  ur: "انصار اور مہاجرین کون ہیں؟"
  tr: "Destekçiler ve göçmenler kimler?"
  id: "Siapa pendukung dan para emigran?"
summary:
  ar: "المهاجرون مسلمو مكة الذين هاجروا إلى المدينة، والأنصار مسلمو يثرب الذين آووهم ونصروهم، وقد ورد الفريقان في القرآن والسيرة."
  en: "The Muhajirun were the Muslims of Mecca who migrated to Medina, and the Ansar were the Muslims of Yathrib who sheltered and supported them. Both groups are mentioned in the Qur'an and in the sira literature."
  es: "Los Muhajirun eran los musulmanes de La Meca que emigraron a Medina, y los Ansar eran los musulmanes de Yathrib que los acogieron y apoyaron. Ambos grupos se mencionan en el Corán y en la literatura sira."
  fr: "Les Muhajirun étaient les musulmans de La Mecque qui ont émigré à Médine, et les Ansar étaient les musulmans de Yathrib qui les ont accueillis et soutenus. Ces deux groupes sont mentionnés dans le Coran et dans la littérature sira."
  ur: "مہاجرین مکہ کے مسلمان تھے جنہوں نے مدینہ کی طرف ہجرت کی اور انصار یثرب کے مسلمان تھے جنہوں نے ان کو پناہ دی اور مدد کی۔ دونوں گروہوں کا تذکرہ قرآن اور سیرت ادب میں ہے۔"
  tr: "Muhacirun, Medine'ye göç eden Mekke'nin Müslümanlarıdır ve Ensar, onları sığınak eden ve destekleyen Yatribli Müslümanlardır. Her iki grup da Kur'an'da ve Peygamber'in biyografisinde geçer."
  id: "Muhajirun adalah Muslim Mekah yang bermigrasi ke Madinah, dan Ansar adalah Muslim Yathrib yang melindungi dan mendukung mereka. Kedua kelompok tersebut disebutkan dalam Al-Qur'an dan biografi Nabi."
