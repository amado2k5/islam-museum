label:
  ar: "من الأنصار والمهاجرون؟"
  en: Who are the Ansar and the Muhajirun?
summary:
  ar: "المهاجرون مسلمو مكة الذين هاجروا إلى المدينة، والأنصار مسلمو يثرب الذين آووهم ونصروهم، وقد ورد الفريقان في القرآن والسيرة."
  en: "The Muhajirun were the Muslims of Mecca who migrated to Medina, and the Ansar were the Muslims of Yathrib who sheltered and supported them. Both groups are mentioned in the Qur'an and in the sira literature."
