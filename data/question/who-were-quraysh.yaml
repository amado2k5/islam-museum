long_answer:
  ar: '[[group/quraysh|قريش]] ولد إسماعيل في النسب المشهور؛ ملكوا مكة وسدانة البيت والسقاية والرفادة والإيلاف؛
    منهم أبو بكر وعمر وعثمان وعلي وأكابر الصحابة، وفي الحديث الأئمة من قريش إذا عملوا بالدين. {cite:wikidata}'
