id: question/who-were-quraysh
class: question
label:
  ar: من كانت قريش؟
  en: Who were the Quraysh?
  es: "¿Quiénes eran los Quraysh?"
  fr: "Qui étaient les Quraysh ?"
  ur: "قریش کون تھے؟"
  tr: "Qurayşlar kimdi?"
  id: "Siapa Quraysh?"
summary:
  ar: قريش قبيلة مكة وسدنة الكعبة؛ منها النبي والخلفاء الأربعة ومعظم صناديد الإسلام؛ قيل منها الخلفاء
    إلى يوم القيامة عند أكثر الفقهاء.
  en: "Quraysh was the tribe of Mecca and the keepers of the Kaaba. The Prophet, the four caliphs and most of the leading figures of Islam were from it. It is said, according to most jurists, that the caliphs will be from Quraysh until the Day of Resurrection."
  es: "Los Quraysh eran la tribu de La Meca y los guardianes de la Kaaba. El Profeta, los cuatro califas y la mayoría de las figuras más importantes del Islam pertenecían a esta tribu. Según la mayoría de los juristas, los califas serán de los Quraysh hasta el Día de la Resurrección."
  fr: "Les Qurayshites étaient la tribu de La Mecque et les gardiens de la Kaaba. Le Prophète, les quatre califes et la plupart des figures majeures de l'islam en étaient issus. Selon la plupart des juristes, les califes seront tous issus des Qurayshites jusqu'au Jour de la Résurrection."
  ur: "قریش مکہ کا قبیلہ اور کعبہ کے محافظ تھے۔ نبی، چاروں خلفاء اور اسلام کی بیشتر اہم شخصیات اسی سے تھیں۔ اکثر فقہاء کے نزدیک یہ کہا جاتا ہے کہ قیامت تک خلیفہ قریش سے ہوں گے۔"
  tr: "Qureyş, Mekke'nin kabilesi ve Kabe'nin koruyucularıdır; aralarında Peygamber, dört halife ve İslam'ın en önde gelen figürleri vardır; çoğu hukukçuya göre kıyamet gününe kadar halife olarak adlandırılırlar."
  id: "Quraisy adalah suku Mekah dan penjaga Ka'bah; di antaranya adalah Nabi, empat khalifah, dan tokoh Islam yang paling menonjol; mereka disebut khalifah hingga Hari Penghakiman menurut sebagian besar ahli hukum."
question:
  ar: من كانت قريش؟
short_answer:
  ar: قريش قبيلة مكة وسدنة الكعبة؛ منها النبي والخلفاء الأربعة ومعظم صناديد الإسلام؛ قيل منها الخلفاء
    إلى يوم القيامة عند أكثر الفقهاء.
long_answer:
  ar: '[[group/quraysh|قريش]] ولد إسماعيل في النسب المشهور؛ ملكوا مكة وسدانة البيت والسقاية والرفادة والإيلاف؛
    منهم أبو بكر وعمر وعثمان وعلي وأكابر الصحابة، وفي الحديث الأئمة من قريش إذا عملوا بالدين. {cite:wikidata}'
