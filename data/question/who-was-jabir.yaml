long_answer:
  ar: '[[person/jabir-ibn-hayyan|جابر بن حيان]] ينسب إليه تأسيس الكيمياء علمًا تجريبيًا؛ من مصنفاته وصف
    التقطير والتصعيد وأدوات المختبر والأحماض المعدنية، وفي التراث اللاتيني اشتهر باسم Geber. تاريخه الدقيق
    محل خلاف بين الباحثين لكن أثر مدرسته محل إجماع. {cite:wikidata}'
