id: question/what-was-tabuk
class: question
label:
  ar: ما غزوة تبوك؟
  en: What was the expedition of Tabuk?
  es: "¿En qué consistió la expedición de Tabuk?"
  fr: "Quelle était l'expédition de Tabuk ?"
  ur: "تبوک کی مہم کیا تھی؟"
  tr: "Tabuk Muharebesi neydi?"
  id: "Apa itu Pertempuran Tabuk?"
summary:
  ar: تبوك رجب 9هـ/630م آخر غزوات النبي؛ خرج ثلاثون ألفًا في العسرة والحر لملاقاة الروم فلم يلقَ أحدًا
    وأظهرت المنافقين.
  en: "Tabuk, Rajab 9 AH / 630 CE, the last of the Prophet's expeditions; thirty thousand set out in hardship and heat to meet the Byzantines, but met no one there, and it exposed the hypocrites."
  es: "Tabuk, Rajab 9 AH / 630 CE, la última de las expediciones del Profeta; treinta mil personas partieron en condiciones difíciles y bajo un calor sofocante para encontrarse con los bizantinos, pero no encontraron a nadie allí, lo que puso al descubierto la hipocresía."
  fr: "Tabuk, Rajab 9 AH / 630 CE, la dernière des expéditions du Prophète; trente mille hommes partirent dans la difficulté et la chaleur pour rencontrer les Byzantins, mais n'y rencontrèrent personne, et cela démasqua les hypocrites."
  ur: "تبوک، رجب 9 ہجری / 630 عیسوی، نبی کی آخری مہمات؛ تیس ہزار سختی اور گرمی میں بازنطینیوں سے ملنے کے لیے نکلے، لیکن وہاں کسی سے نہیں ملے، اور اس نے منافقوں کو بے نقاب کر دیا۔"
  tr: "Tabuk, Recep 9 Hicri / 630 M.S. Peygamber'in son seferi; otuz bin kişi zorluk ve sıcaklık içinde Romalılarla yüzleşmeye çıktı, ancak kimseyle karşılaşmadılar ve münafıkları ortaya çıkardılar."
  id: "Tabuk, Rajab 9 AH / 630 M, kampanye terakhir Nabi; tiga puluh ribu pergi dalam kesulitan dan panas untuk menghadapi Romawi, tetapi mereka tidak bertemu siapa pun dan membongkar para munafik."
question:
  ar: ما غزوة تبوك؟
short_answer:
  ar: تبوك رجب 9هـ/630م آخر غزوات النبي؛ خرج ثلاثون ألفًا في العسرة والحر لملاقاة الروم فلم يلقَ أحدًا
    وأظهرت المنافقين.
long_answer:
  ar: '[[event/expedition-to-tabuk|تبوك]] آخر غزوات النبي وأقصاها؛ أعلن وجهته لملاقاة جموع الروم فبعث
    ثلاثين ألفًا في حر شديد وعسرة؛ عاد بلا قتال وقد تثبتت ثغور الشمال؛ كشفت الغزوة المنافقين ونزلت فيها
    سورة التوبة بأكملها. {cite:wikidata}'
