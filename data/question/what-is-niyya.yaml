id: question/what-is-niyya
class: question
label:
  ar: "ما النية في العبادة؟"
  en: What is niyya in worship?
  es: "¿Qué es niyya en la adoración?"
  fr: "Que signifie niyya dans le culte ?"
  ur: "عبادت میں نیا کیا ہے؟"
  tr: "İbadetin amacı nedir?"
  id: "Apa maksud dalam ibadah?"
summary:
  ar: "النية القصد الذي يقع عنه العمل، وفي الحديث المشهور أن الأعمال بالنيات. ويفرق العلماء بين نية تميز العبادات بعضها عن بعض، ونية تُعرف بها وجه القربة."
  en: "Niyya is the intention that an action is directed by. As the well-known hadith says, actions are by intentions. Scholars distinguish an intention that tells acts of worship apart from one another, and an intention by which an act is recognised as sought for nearness to God."
  es: "Niyya es la intención que guía una acción. Como afirma el conocido hadiz, las acciones se realizan con intención. Los eruditos distinguen entre la intención que diferencia los actos de adoración y la intención mediante la cual un acto se reconoce como una búsqueda de cercanía a Dios."
  fr: "La niyya est l'intention qui guide une action. Comme le dit un hadith bien connu, les actions sont guidées par les intentions. Les savants distinguent l'intention qui distingue les actes de dévotion les uns des autres, et l'intention par laquelle un acte est reconnu comme un moyen de se rapprocher de Dieu."
  ur: "نیا وہ ارادہ ہے جس کے ذریعہ عمل کی ہدایت کی جاتی ہے۔ جیسا کہ مشہور حدیث ہے کہ اعمال کا دارومدار نیتوں پر ہے۔ علماء ایک ایسے ارادے میں فرق کرتے ہیں جو عبادت کے اعمال کو ایک دوسرے سے الگ بتاتا ہے، اور ایک ایسا ارادہ جس کے ذریعے کسی عمل کو خدا کے قرب کی تلاش کے طور پر پہچانا جاتا ہے۔"
  tr: "Niyet, eylemin gerçekleştirildiği niyettir ve bilinen hadislerde eylemler niyetlerle yargılanır. Âlimler, ibadet eylemlerini birbirinden ayıran niyet ile bağlılık yönünün bilindiği niyet arasında ayrım yaparlar."
  id: "Niat adalah niat dari mana tindakan dilakukan, dan dalam hadits yang terkenal, tindakan dinilai berdasarkan niat. Para ulama membedakan antara niat yang digunakan untuk membedakan satu sama lain dari tindakan ibadah, dan niat yang digunakan untuk mengetahui aspek pengabdian."
wings: []
question:
  ar: "ما النية في العبادة؟"
short_answer:
  ar: "النية القصد الذي يقع عنه العمل، وفي الحديث المشهور أن الأعمال بالنيات. ويفرق العلماء بين نية تميز العبادات بعضها عن بعض، ونية تُعرف بها وجه القربة."
long_answer:
  ar: |
    النية القصد والإرادة التي يقع عنها العمل، وقد جاء في الحديث الصحيح أن الأعمال بالنيات {cite:sahih-al-bukhari 1}، وتفصيل معناها في مدخل [[concept/niyya|النية]].
    وتجمع النية بين العبادة والإخلاص، ومن معانيها ما يبينه المدخل من تمييز العبادات بعضها عن بعض.
    ومن أراد أن يرى أثرها في العبادات، كالصلاة والصيام، يبدأ بمدخل [[practice/salah|الصلاة]] ومدخل [[practice/sawm-ramadan|صيام رمضان]].
