id: question/what-is-niyya
class: question
label:
  ar: "ما النية في العبادة؟"
  en: What is niyya in worship?
  es: "¿Qué es niyya en la adoración?"
summary:
  ar: "النية القصد الذي يقع عنه العمل، وفي الحديث المشهور أن الأعمال بالنيات. ويفرق العلماء بين نية تميز العبادات بعضها عن بعض، ونية تُعرف بها وجه القربة."
  en: "Niyya is the intention that an action is directed by. As the well-known hadith says, actions are by intentions. Scholars distinguish an intention that tells acts of worship apart from one another, and an intention by which an act is recognised as sought for nearness to God."
  es: "Niyya es la intención que guía una acción. Como afirma el conocido hadiz, las acciones se realizan con intención. Los eruditos distinguen entre la intención que diferencia los actos de adoración y la intención mediante la cual un acto se reconoce como una búsqueda de cercanía a Dios."
wings: []
question:
  ar: "ما النية في العبادة؟"
short_answer:
  ar: "النية القصد الذي يقع عنه العمل، وفي الحديث المشهور أن الأعمال بالنيات. ويفرق العلماء بين نية تميز العبادات بعضها عن بعض، ونية تُعرف بها وجه القربة."
long_answer:
  ar: |
    النية القصد والإرادة التي يقع عنها العمل، وقد جاء في الحديث الصحيح أن الأعمال بالنيات {cite:sahih-al-bukhari 1}، وتفصيل معناها في مدخل [[concept/niyya|النية]].
    وتجمع النية بين العبادة والإخلاص، ومن معانيها ما يبينه المدخل من تمييز العبادات بعضها عن بعض.
    ومن أراد أن يرى أثرها في العبادات، كالصلاة والصيام، يبدأ بمدخل [[practice/salah|الصلاة]] ومدخل [[practice/sawm-ramadan|صيام رمضان]].
