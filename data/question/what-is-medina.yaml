id: question/what-is-medina
class: question
label:
  ar: ما المدينة المنورة؟
  en: What is Medina?
  es: "¿Qué es Medina?"
  fr: "Qu'est-ce que Médine ?"
  ur: "مدینہ کیا ہے؟"
summary:
  ar: المدينة يثرب قبلاً؛ دار الهجرة وأول دولة الإسلام ومسجد النبي وقبره؛ عاصمة الخلفاء حتى علي وبقي فيها
    علم الصحابة والتابعين.
  en: "Medina, formerly called Yathrib, is the city of the Hijra and the first state of Islam, and it holds the Mosque of the Prophet and his grave. It was the capital of the caliphs up to Ali, and the knowledge of the Companions and the Successors remained there."
  es: "Medina, antiguamente llamada Yathrib, es la ciudad de la Hégira y el primer estado del Islam. En ella se encuentran la Mezquita del Profeta y su tumba. Fue la capital de los califas hasta Ali, y allí se conservó el conocimiento de los Compañeros y los Sucesores."
  fr: "Médine, anciennement Yathrib, est la ville de l'Hégire et le premier État de l'Islam. Elle abrite la mosquée du Prophète et son tombeau. Capitale des califes jusqu'à Ali, elle a conservé le savoir des Compagnons et de leurs successeurs."
  ur: "مدینہ، جسے پہلے یثرب کہا جاتا تھا، ہجرت کا شہر اور اسلام کی پہلی ریاست ہے، اور اس میں مسجد نبوی اور آپ کی قبر ہے۔ یہ علی تک خلفاء کا دارالخلافہ تھا اور صحابہ کرام اور جانشینوں کا علم وہیں رہا۔"
question:
  ar: ما المدينة المنورة؟
short_answer:
  ar: المدينة يثرب قبلاً؛ دار الهجرة وأول دولة الإسلام ومسجد النبي وقبره؛ عاصمة الخلفاء حتى علي وبقي فيها
    علم الصحابة والتابعين.
long_answer:
  ar: '[[place/medina|المدينة]] هاجر إليها النبي سنة 622 فصارت عاصمة الإسلام الأولى؛ فيها مسجده وقبره
    وقباء والبقيع ودار القرآن والفقه الأولى؛ بقيت مدرسة المدينة مصدر الموطأ والسيرة والحديث. {cite:wikidata}'
