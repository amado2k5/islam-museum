id: question/is-the-order-of-the-suras-fixed-by-revelation
class: question
label:
  ar: "هل ترتيب سور القرآن توقيفي أم اجتهادي؟"
  en: "Is the order of the suras fixed by revelation or by the Companions' judgement?"
  ur: "کیا قرآن کی سورتوں کی ترتیب توقیفی ہے یا اجتہادی؟"
summary:
  ar: "يحكي القرطبي في مقدمة تفسيره قولين في ترتيب السور على ما هي عليه في المصحف: أنه يحتمل أن يكون اجتهادًا من الصحابة، وهو ما ذكره القاضي أبو بكر بن الطيب، مع الاتفاق عنده على أن ترتيب الآيات من النبي؛ وأنه توقيف من النبي، وهو قول مالك وأبي بكر بن الأنباري وغيرهما. ويميل طنطاوي إلى أنه توقيفي."
  en: "In the introduction to his commentary al-Qurtubi reports two views on the order of the suras as they stand in the mushaf: that it may have been the Companions' own judgement, as the judge Abu Bakr ibn al-Tayyib said, while the order of verses within suras came from the Prophet; and that it was fixed by the Prophet, the view of Malik, Abu Bakr ibn al-Anbari and others. Tantawi inclines to the view that it is fixed by revelation."
  ur: "قرطبی اپنی تفسیر کے مقدمے میں مصحف میں موجود سورتوں کی ترتیب کے بارے میں دو اقوال نقل کرتے ہیں: کہ یہ صحابہ کا اجتہاد ہو سکتی ہے، جیسا کہ قاضی ابو بکر بن الطیب نے کہا، جبکہ سورتوں کے اندر آیات کی ترتیب نبی کی طرف سے ہے؛ اور کہ یہ نبی کی طرف سے توقیفی ہے، جو مالک، ابو بکر بن الانباری وغیرہ کا قول ہے۔ طنطاوی توقیفی ہونے کی طرف مائل ہیں۔"
question:
  ar: "هل رُتّبت سور المصحف بأمر النبي أم باجتهاد الصحابة؟"
  en: "Were the suras of the mushaf arranged by the Prophet's instruction or by the Companions' judgement?"
  ur: "کیا مصحف کی سورتیں نبی کے حکم سے ترتیب دی گئیں یا صحابہ کے اجتہاد سے؟"
short_answer:
  ar: "قولان عند أهل السنة يحكيهما القرطبي: الاجتهاد في ترتيب السور مع التوقيف في ترتيب الآيات، والتوقيف في الجميع؛ ويرجح طنطاوي التوقيف."
  en: "Two Sunni views reported by al-Qurtubi: judgement in the order of the suras with revelation in the order of the verses, or revelation for both; Tantawi prefers the latter."
  ur: "اہلِ سنت کے دو اقوال جو قرطبی نقل کرتے ہیں: سورتوں کی ترتیب میں اجتہاد اور آیات کی ترتیب میں توقیف، یا دونوں میں توقیف؛ طنطاوی دوسرے کو ترجیح دیتے ہیں۔"
