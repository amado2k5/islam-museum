perspectives:
  - tradition: sunni
    id: tawqif-from-the-prophet
    standing: main
    stance: { ar: "توقيف من النبي كترتيب الآيات", en: "Fixed by the Prophet, like the order of the verses", ur: "نبی کی طرف سے توقیفی، آیات کی ترتیب کی طرح" }
    summary:
      ar: "قال قوم من أهل العلم إن تأليف السور على ما في مصحفنا كان عن توقيف من النبي، وإن اختلاف مصاحف أبيّ وعلي وابن مسعود كان قبل العرض الأخير؛ وروى ابن وهب عن مالك أن القرآن أُلّف على ما كانوا يسمعونه من النبي؛ وقال أبو بكر بن الأنباري إن اتساق السور كاتساق الآيات والحروف، كله عن النبي عن ربه {cite:jami-ahkam-quran-resala-v1 p.98}. ويقول طنطاوي إن الذي تميل إليه النفس أن ترتيب السور توقيفي {cite:tafsir-tantawi-wasit p.2330}."
      en: "Some scholars said that the arrangement of the suras as in our mushaf was fixed by the Prophet, and that the differing order of the codices of Ubayy, Ali and Ibn Mas'ud predates the final review; Ibn Wahb reports Malik as saying that the Qur'an was arranged as they used to hear it from the Prophet; Abu Bakr ibn al-Anbari said that the sequence of the suras is like that of the verses and letters, all from the Prophet from his Lord {cite:jami-ahkam-quran-resala-v1 p.98}. Tantawi says that the view the mind inclines to is that the order of the suras is fixed by revelation {cite:tafsir-tantawi-wasit p.2330}."
      ur: "بعض اہلِ علم نے کہا کہ ہمارے مصحف میں سورتوں کی ترتیب نبی کی طرف سے توقیفی تھی، اور ابی، علی اور ابن مسعود کے مصاحف کی مختلف ترتیب آخری عرضے سے پہلے کی تھی؛ ابن وہب مالک سے روایت کرتے ہیں کہ قرآن اسی ترتیب پر جمع ہوا جیسے وہ نبی سے سنتے تھے؛ ابو بکر بن الانباری نے کہا کہ سورتوں کا تسلسل آیات اور حروف کے تسلسل کی طرح ہے، سب نبی سے ان کے رب کی طرف سے {cite:jami-ahkam-quran-resala-v1 p.98}۔ طنطاوی کہتے ہیں کہ دل جس طرف مائل ہوتا ہے وہ یہ ہے کہ سورتوں کی ترتیب توقیفی ہے {cite:tafsir-tantawi-wasit p.2330}۔"
