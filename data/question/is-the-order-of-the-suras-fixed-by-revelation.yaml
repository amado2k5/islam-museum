    standing: secondary
    stance: { ar: "ترتيب السور اجتهاد من الصحابة، وترتيب الآيات توقيف", en: "The order of the suras was the Companions' judgement; that of the verses was from the Prophet", ur: "سورتوں کی ترتیب صحابہ کا اجتہاد، آیات کی ترتیب توقیفی" }
    summary:
      ar: "قال القاضي أبو بكر بن الطيب إن السلف اختلفوا في ترتيب السور في مصاحفهم، وإنه يحتمل أن يكون الترتيب الحالي اجتهادًا من الصحابة؛ وذكر مكي أن ترتيب الآيات ووضع البسملة في أوائل السور من النبي، ويقول القرطبي: هذا أصح ما قيل في ذلك. ولما سئل ربيعة لم قُدّمت البقرة وآل عمران وقد نزل قبلهما بضع وثمانون سورة، قال: أُلّف القرآن على علم ممن ألّفه، وقد اجتمعوا على العلم بذلك {cite:jami-ahkam-quran-resala-v1 p.96} {cite:jami-ahkam-quran-resala-v1 p.97}."
      en: "The judge Abu Bakr ibn al-Tayyib said that the early generations differed in the order of the suras in their codices, and that the present order may have been the Companions' judgement; Makki said that the order of the verses and the placing of the basmala at the heads of suras came from the Prophet, and al-Qurtubi calls this the soundest thing said on the matter. When Rabi'a was asked why al-Baqara and Al Imran come first though some eighty suras were revealed before them, he said the Qur'an was arranged with knowledge by those who arranged it, and they agreed upon it {cite:jami-ahkam-quran-resala-v1 p.96} {cite:jami-ahkam-quran-resala-v1 p.97}."
      ur: "قاضی ابو بکر بن الطیب نے کہا کہ سلف نے اپنے مصاحف میں سورتوں کی ترتیب میں اختلاف کیا، اور ممکن ہے موجودہ ترتیب صحابہ کا اجتہاد ہو؛ مکی نے کہا کہ آیات کی ترتیب اور سورتوں کے آغاز میں بسملہ رکھنا نبی کی طرف سے تھا، اور قرطبی اسے اس بارے میں سب سے صحیح قول کہتے ہیں۔ جب ربیعہ سے پوچھا گیا کہ بقرہ اور آلِ عمران پہلے کیوں ہیں حالانکہ ان سے پہلے اسی سے زیادہ سورتیں نازل ہوئیں، تو انہوں نے کہا کہ قرآن کو جمع کرنے والوں نے علم کی بنیاد پر جمع کیا اور وہ اس پر متفق ہوئے {cite:jami-ahkam-quran-resala-v1 p.96} {cite:jami-ahkam-quran-resala-v1 p.97}۔"
