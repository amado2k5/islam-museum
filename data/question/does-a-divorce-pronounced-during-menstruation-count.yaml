id: question/does-a-divorce-pronounced-during-menstruation-count
class: question
label: { ar: "هل يقع الطلاق في الحيض؟", en: "Does a divorce pronounced during menstruation take effect?", ur: "کیا حیض کی حالت میں دی گئی طلاق واقع ہوتی ہے؟" }
question: { ar: "من طلق امرأته المدخول بها وهي حائض، أو في طهر جامعها فيه، هل يلزمه ذلك الطلاق ويُحسب عليه؟", en: "If a man divorces a wife with whom the marriage was consummated while she is menstruating, or in a period of purity in which he had intercourse with her, does the divorce bind him and count against him?", ur: "اگر کوئی شخص اپنی مدخولہ بیوی کو حیض کی حالت میں، یا ایسے طہر میں جس میں اس سے مباشرت کی ہو، طلاق دے تو کیا وہ طلاق اس پر لازم ہو کر شمار ہوگی؟" }
issue: { ar: "حديث ابن عمر حين طلق امرأته وهي حائض فقال النبي «مره فليراجعها»، وما ورد في بعض رواياته من أنها حُسبت تطليقة، مع اتفاقهم على أن طلاق الحائض بدعة منهي عنه، كما يعرضها ابن حزم.", en: "Ibn 'Umar's divorcing his wife while she menstruated and the Prophet's words 'tell him to take her back', with the statement in some versions that it was counted as a divorce, alongside the agreement that divorcing a menstruating wife is a forbidden innovation, as Ibn Hazm sets them out.", ur: "ابن عمر کا اپنی بیوی کو حیض میں طلاق دینا اور نبی کا فرمان «اسے کہو کہ رجوع کرے»، اور بعض روایات میں یہ بیان کہ اسے ایک طلاق شمار کیا گیا، اس اتفاق کے ساتھ کہ حائضہ کو طلاق دینا ممنوع بدعت ہے، جیسا کہ ابن حزم انہیں پیش کرتے ہیں۔" }
summary:
  ar: "يحكي ابن حزم في «المحلى» أن بعض القائلين بوقوع الطلاق في الحيض ادعى أنه إجماع، ويرد عليه بأن الخلاف موجود، ويرى هو أن الطلاق في الحيض أو في طهر جامعها فيه لا يلزم ولا يُعتد به، لأنه تعدٍّ لحدود الله، ويروي عدم الاعتداد به عن ابن عمر وطاوس وخلاس بن عمرو، وتحريمه عن ابن عباس، بينما يحتج الموقعون بروايات «حُسبت عليّ تطليقة» وبآثار عن ابن عمر وزيد بن ثابت وعثمان {cite:muhalla-dar-ibn-hazm-2016-v13 p.397} {cite:muhalla-dar-ibn-hazm-2016-v13 p.398} {cite:muhalla-dar-ibn-hazm-2016-v13 p.399} {cite:muhalla-dar-ibn-hazm-2016-v13 p.400}."
  en: "Ibn Hazm reports in al-Muhalla that some who hold that a divorce during menstruation takes effect claimed consensus for it, and answers that the disagreement exists; he holds that a divorce during menstruation, or in a period of purity in which intercourse took place, does not bind and is not counted, being a transgression of God's limits, and relates the view that it is not counted from Ibn 'Umar, Tawus and Khilas ibn 'Amr and its prohibition from Ibn 'Abbas, while those who hold it effective argue from the versions saying 'it was counted against me as one divorce' and from reports from Ibn 'Umar, Zayd ibn Thabit and 'Uthman {cite:muhalla-dar-ibn-hazm-2016-v13 p.397} {cite:muhalla-dar-ibn-hazm-2016-v13 p.398} {cite:muhalla-dar-ibn-hazm-2016-v13 p.399} {cite:muhalla-dar-ibn-hazm-2016-v13 p.400}."
  ur: "ابن حزم «المحلی» میں نقل کرتے ہیں کہ حیض میں طلاق کے وقوع کے بعض قائلین نے اس پر اجماع کا دعویٰ کیا، اور جواب دیتے ہیں کہ اختلاف موجود ہے؛ ان کے نزدیک حیض میں، یا جس طہر میں مباشرت ہوئی اس میں دی گئی طلاق لازم نہیں اور شمار نہیں ہوتی، کیونکہ یہ اللہ کی حدود سے تجاوز ہے، اور وہ اس کے شمار نہ ہونے کا قول ابن عمر، طاؤس اور خلاس بن عمرو سے اور اس کی حرمت ابن عباس سے نقل کرتے ہیں، جبکہ وقوع کے قائلین «مجھ پر ایک طلاق شمار کی گئی» والی روایات اور ابن عمر، زید بن ثابت اور عثمان کے آثار سے استدلال کرتے ہیں {cite:muhalla-dar-ibn-hazm-2016-v13 p.397} {cite:muhalla-dar-ibn-hazm-2016-v13 p.398} {cite:muhalla-dar-ibn-hazm-2016-v13 p.399} {cite:muhalla-dar-ibn-hazm-2016-v13 p.400}۔"
short_answer:
  ar: "الموقعون ⁦(كما يحكيهم ابن حزم ومحققو طبعته)⁩: يقع الطلاق مع الإثم ويؤمر بالمراجعة؛ ابن حزم الظاهري: لا يقع ولا يُعتد به."
  en: "Those who hold it effective (as Ibn Hazm and his editors present them): the divorce takes effect though sinful, and he is ordered to take her back; Ibn Hazm the Zahiri: it does not take effect and is not counted."
  ur: "وقوع کے قائلین ⁦(جیسا کہ ابن حزم اور ان کے محققین پیش کرتے ہیں)⁩: طلاق گناہ کے ساتھ واقع ہو جاتی ہے اور رجوع کا حکم ہے؛ ابن حزم ظاہری: واقع نہیں ہوتی اور شمار نہیں ہوتی۔"
perspectives:
  - tradition: sunni
    id: effective-with-order-to-take-back
    standing: main
    stance: { ar: "يقع الطلاق ويؤمر برجعتها", en: "The divorce takes effect and he is ordered to take her back", ur: "طلاق واقع ہو جاتی ہے اور اسے رجوع کا حکم دیا جاتا ہے" }
    summary: { ar: "يحتج الموقعون، كما يعرضهم ابن حزم، برواية ابن أبي ذئب ومالك عن نافع وفي آخرها «وهي واحدة»، وبرواية الزبيدي عن الزهري عن سالم عن أبيه «فراجعتها وحُسبت لها التطليقة التي طلقتها»، وبقول ابن عمر «ما يمنعني أن أعتد بها» و«فمه أرأيت إن عجز واستحمق»، وبجواب نافع لابن جريج أنها حُسبت، وبآثار عن زيد بن ثابت وعثمان؛ ويذكر المحققون أن البخاري ترجم للحديث بأنه إذا خالف وقع الطلاق ويؤمر برجعتها.", en: "Those who hold it effective, as Ibn Hazm presents them, argue from Ibn Abi Dhi'b's and Malik's version from Nafi', ending 'and it is one', from al-Zubaydi's version from al-Zuhri from Salim from his father, 'I took her back and the divorce I had pronounced was counted for her', from Ibn 'Umar's words 'what prevents me from counting it?' and 'what of it, if he was helpless and foolish?', from Nafi''s answer to Ibn Jurayj that it was counted, and from reports from Zayd ibn Thabit and 'Uthman; the editors note that al-Bukhari headed the hadith with the rule that if he goes against the command the divorce takes effect and he is ordered to take her back.", ur: "وقوع کے قائلین، جیسا کہ ابن حزم انہیں پیش کرتے ہیں، ابن ابی ذئب اور مالک کی نافع سے روایت سے استدلال کرتے ہیں جس کے آخر میں ہے «اور یہ ایک ہے»، زبیدی کی زہری عن سالم عن ابیہ روایت سے «میں نے رجوع کیا اور جو طلاق میں نے دی تھی وہ شمار کی گئی»، ابن عمر کے اقوال «مجھے اسے شمار کرنے سے کیا روکتا ہے؟» اور «تو کیا، اگر وہ عاجز رہا اور حماقت کی؟» سے، ابن جریج کو نافع کے جواب سے کہ وہ شمار ہوئی، اور زید بن ثابت اور عثمان کے آثار سے؛ محققین بتاتے ہیں کہ بخاری نے اس حدیث پر یہ عنوان باندھا کہ اگر خلاف کرے تو طلاق واقع ہو جاتی ہے اور اسے رجوع کا حکم دیا جاتا ہے۔" }
    sources: [source/muhalla-dar-ibn-hazm-2016-v13]
  - tradition: sunni
    id: zahiri-ibn-hazm-not-counted
    standing: secondary
    stance: { ar: "الظاهرية ⁦(ابن حزم)⁩: لا يلزم الطلاق في الحيض ولا في طهر جامعها فيه", en: "Zahiri (Ibn Hazm): a divorce during menstruation or in a period of purity with intercourse does not bind", ur: "ظاہری ⁦(ابن حزم)⁩: حیض میں یا مباشرت والے طہر میں طلاق لازم نہیں ہوتی" }
    summary: { ar: "يرى ابن حزم أن الله بيّن في آية الطلاق 1 أن طلاق المدخول بها يكون للعدة، وأن ذلك حدود الله ومن تعداها ظلم نفسه، وأن ما خالف أمر النبي رد بحديث «من عمل عملاً ليس عليه أمرنا فهو رد»؛ ويروي عن ابن عمر «لا يُعتد بذلك»، وعن ابن عباس أن طلاق الحائض حرام، وعن ابن مسعود وطاوس وخلاس نحوه؛ ويرى أن الإجماع منعقد على أنه بدعة، فلا يجيز إمضاء ما أقروا أنه بدعة، ويضعّف حديث «من طلق في بدعة ألزمناه بدعته» ويرد بقية الحجج.", en: "Ibn Hazm holds that in al-Talaq 1 God explained that divorcing a wife with whom marriage was consummated is to be for her waiting period, that these are God's limits and whoever transgresses them wrongs himself, and that what goes against the Prophet's command is rejected by the hadith 'whoever does a deed not in accord with our matter, it is rejected'; he relates from Ibn 'Umar 'it is not counted', from Ibn 'Abbas that divorcing a menstruating wife is forbidden, and similar views from Ibn Mas'ud, Tawus and Khilas; he holds that there is consensus that it is an innovation, so what they themselves admit to be an innovation cannot be made effective; he weakens the hadith 'whoever divorces by innovation, we bind him to his innovation' and answers the other arguments.", ur: "ابن حزم کے نزدیک اللہ نے سورۂ طلاق 1 میں بیان کیا کہ مدخولہ کو طلاق اس کی عدت کے لیے دی جائے، یہ اللہ کی حدود ہیں اور جو ان سے تجاوز کرے وہ اپنے اوپر ظلم کرتا ہے، اور جو نبی کے حکم کے خلاف ہو وہ حدیث «جس نے کوئی ایسا کام کیا جو ہمارے طریقے پر نہیں وہ مردود ہے» سے رد ہے؛ وہ ابن عمر سے «اسے شمار نہیں کیا جائے گا»، ابن عباس سے کہ حائضہ کو طلاق دینا حرام ہے، اور ابن مسعود، طاؤس اور خلاس سے اسی طرح روایت کرتے ہیں؛ ان کے نزدیک اس کے بدعت ہونے پر اجماع ہے، تو جسے وہ خود بدعت مانتے ہیں اسے نافذ نہیں کیا جا سکتا؛ وہ حدیث «جس نے بدعت کے طور پر طلاق دی ہم اسے اس کی بدعت کا پابند کریں گے» کو ضعیف کہتے ہیں اور باقی دلائل کا جواب دیتے ہیں۔" }
