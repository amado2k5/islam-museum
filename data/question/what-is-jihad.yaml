question:
  ar: ما الجهاد؟
short_answer:
  ar: الجهاد هو بذل الجهد في مرضاة الله؛ عنده معانٍ متدرجة من جهاد النفس إلى جهاد الأيدي والقتال في سبيل
    الله في كتب الفقه.
long_answer:
  ar: الجهاد لفظ جامع لبذل الجهد في سبيل الله؛ عده الفقهاء في كتب الأحكام جهاد نفس وشيطان ومال ولسان ويد،
    وله من القتال في سبيل الله أحكامه في شروطه وآدابه وغاياته. أما في استعمال العصر السياسي فتنوعت معانيه
    وتنازعتها أطياف العلماء. {cite:wikidata}
