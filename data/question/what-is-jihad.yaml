id: question/what-is-jihad
class: question
label:
  ar: ما الجهاد؟
  en: What is jihad?
  es: "¿Qué es la yihad?"
  fr: "Qu'est-ce que le djihad ?"
  ur: "جہاد کیا ہے؟"
summary:
  ar: الجهاد هو بذل الجهد في مرضاة الله؛ عنده معانٍ متدرجة من جهاد النفس إلى جهاد الأيدي والقتال في سبيل
    الله في كتب الفقه.
  en: "Jihad is the exertion of effort in seeking God's pleasure. The books of jurisprudence give it graded meanings, from the struggle against the self to the struggle by hand and fighting in the way of God."
  es: "La yihad es el esfuerzo por buscar la complacencia de Dios. Los libros de jurisprudencia le otorgan distintos significados, desde la lucha contra uno mismo hasta la lucha cuerpo a cuerpo y el combate en el camino de Dios."
  fr: "Le jihad est l'effort déployé pour obtenir l'agrément de Dieu. Les ouvrages de jurisprudence lui attribuent différentes significations, allant de la lutte contre soi-même au combat direct et à la lutte pour la cause divine."
  ur: "جہاد خدا کی خوشنودی حاصل کرنے کی کوشش ہے۔ فقہ کی کتابیں اس کے درجہ بندی کے معنی دیتی ہیں، نفس کے خلاف جدوجہد سے لے کر ہاتھ سے جدوجہد اور راہ خدا میں لڑنے تک۔"
question:
  ar: ما الجهاد؟
short_answer:
  ar: الجهاد هو بذل الجهد في مرضاة الله؛ عنده معانٍ متدرجة من جهاد النفس إلى جهاد الأيدي والقتال في سبيل
    الله في كتب الفقه.
long_answer:
  ar: الجهاد لفظ جامع لبذل الجهد في سبيل الله؛ عده الفقهاء في كتب الأحكام جهاد نفس وشيطان ومال ولسان ويد،
    وله من القتال في سبيل الله أحكامه في شروطه وآدابه وغاياته. أما في استعمال العصر السياسي فتنوعت معانيه
    وتنازعتها أطياف العلماء. {cite:wikidata}
