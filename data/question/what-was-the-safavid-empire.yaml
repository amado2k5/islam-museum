question:
  ar: ما الدولة الصفوية؟
short_answer:
  ar: الدولة الصفوية (1501–1736) سلطنة إيرانية جعلت الشيعة الاثني عشرية مذهب الدولة؛ عاصمتها أصفهان في
    أزهى عصور العمارة الإيرانية.
long_answer:
  ar: الدولة الصفوية أسسها إسماعيل الصفوي 1501 وأعلن التشيع الاثني عشري مذهبًا للدولة في إيران السنية
    الأكثر؛ بلغت ذروتها بشاه عباس وبناء أصفهان الجامع؛ قاومت العثمانيين في صراع طويل على العراق والقوقاز
    حتى أسقطها الأفغان 1722 ثم أفشل قاجار. {cite:wikidata}
