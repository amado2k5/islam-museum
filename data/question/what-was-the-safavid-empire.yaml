label:
  ar: ما الدولة الصفوية؟
  en: What was the Safavid Empire?
  es: "¿Qué fue el Imperio Safávida?"
  fr: "Qu'était-ce que l'empire safavide ?"
  ur: "صفوی سلطنت کیا تھی؟"
summary:
  ar: الدولة الصفوية (1501–1736) سلطنة إيرانية جعلت الشيعة الاثني عشرية مذهب الدولة؛ عاصمتها أصفهان في
    أزهى عصور العمارة الإيرانية.
  en: "The Safavid Empire (1501–1736) was an Iranian sultanate that made Twelver Shi'ism the religion of the state; its capital was Isfahan, during the most splendid age of Iranian architecture."
  es: "El Imperio Safávida (1501-1736) fue un sultanato iraní que convirtió el chiismo duodecimano en la religión del estado; su capital fue Isfahán, durante la época de mayor esplendor de la arquitectura iraní."
  fr: "L'empire safavide (1501-1736) était un sultanat iranien qui avait fait du chiisme duodécimain la religion d'État; sa capitale était Ispahan, durant l'âge le plus splendide de l'architecture iranienne."
  ur: "صفوی سلطنت (1501–1736) ایک ایرانی سلطنت تھی جس نے بارہویں شیعہ مذہب کو ریاست کا مذہب بنایا تھا۔ اس کا دارالحکومت اصفہان تھا، ایرانی فن تعمیر کے سب سے شاندار دور میں۔"
question:
  ar: ما الدولة الصفوية؟
short_answer:
  ar: الدولة الصفوية (1501–1736) سلطنة إيرانية جعلت الشيعة الاثني عشرية مذهب الدولة؛ عاصمتها أصفهان في
    أزهى عصور العمارة الإيرانية.
long_answer:
  ar: الدولة الصفوية أسسها إسماعيل الصفوي 1501 وأعلن التشيع الاثني عشري مذهبًا للدولة في إيران السنية
    الأكثر؛ بلغت ذروتها بشاه عباس وبناء أصفهان الجامع؛ قاومت العثمانيين في صراع طويل على العراق والقوقاز
    حتى أسقطها الأفغان 1722 ثم أفشل قاجار. {cite:wikidata}
