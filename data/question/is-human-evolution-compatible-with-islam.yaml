id: question/is-human-evolution-compatible-with-islam
class: question
label:
  ar: "هل تتعارض نظرية التطور مع الإسلام في خلق الإنسان؟"
  en: "Does the theory of evolution conflict with Islam on the creation of humans?"
  ur: "کیا نظریۂ ارتقا انسان کی تخلیق کے بارے میں اسلام سے متصادم ہے؟"
summary:
  ar: "سؤال تتعدد فيه الآراء؛ ومنها رأي مصطفى محمود في «حوار مع صديقي الملحد» أن القرآن يروي الخلق على مراحل وأطوار، وأن التطور حقيقة لكن تفسير داروين المادي وقوله بأصل واحد لكل الأنواع غير لازمين {cite:mm-hiwar-ma-sadiqi-al-mulhid-awda-1986 p. 124} {cite:mm-hiwar-ma-sadiqi-al-mulhid-awda-1986 p. 132}."
  en: "A question with several views; among them Mostafa Mahmoud's, in Hiwar ma'a Sadiqi al-Mulhid, that the Qur'an tells of creation in stages and phases, and that evolution is a fact while Darwin's materialist explanation and single common origin of all species are not required {cite:mm-hiwar-ma-sadiqi-al-mulhid-awda-1986 p. 124} {cite:mm-hiwar-ma-sadiqi-al-mulhid-awda-1986 p. 132}."
  ur: "ایک سوال جس میں کئی آرا ہیں؛ ان میں مصطفیٰ محمود کی رائے، «حوار مع صدیقی الملحد» میں، کہ قرآن تخلیق کو مراحل اور اطوار میں بیان کرتا ہے، اور ارتقا حقیقت ہے جبکہ ڈارون کی مادی توجیہ اور تمام انواع کی ایک مشترک اصل ضروری نہیں {cite:mm-hiwar-ma-sadiqi-al-mulhid-awda-1986 p. 124} {cite:mm-hiwar-ma-sadiqi-al-mulhid-awda-1986 p. 132}۔"
question:
  ar: "هل تتعارض نظرية التطور مع الإسلام في خلق الإنسان؟"
  en: "Does the theory of evolution conflict with Islam on the creation of humans?"
  ur: "کیا نظریۂ ارتقا انسان کی تخلیق کے بارے میں اسلام سے متصادم ہے؟"
issue:
  ar: "هل يقبل القرآن تصور خلق الإنسان عبر أطوار طويلة، وهل يلزم من التشابه التشريحي القول بأصل واحد للأنواع كلها؟"
  en: "Does the Qur'an admit human creation through long stages, and does anatomical resemblance require a single common origin for all species?"
  ur: "کیا قرآن طویل اطوار کے ذریعے انسان کی تخلیق کا تصور قبول کرتا ہے، اور کیا تشریحی مشابہت سے تمام انواع کی ایک اصل ماننا لازم آتا ہے؟"
short_answer:
  ar: "يرى مصطفى محمود أن القرآن يصف الخلق على مراحل، وأن داروين أصاب في التشابه التشريحي والتطور وأخطأ في التفسير المادي وفي الأصل الواحد لكل الأنواع؛ وبقية الآراء لم تُوثّق بعد في هذا المدخل {cite:mm-hiwar-ma-sadiqi-al-mulhid-awda-1986 p. 129} {cite:mm-hiwar-ma-sadiqi-al-mulhid-awda-1986 p. 132}."
  en: "Mostafa Mahmoud holds that the Qur'an describes creation in stages, and that Darwin was right on anatomical resemblance and evolution and wrong on the materialist explanation and on one origin for all species; other views are not yet documented in this entry {cite:mm-hiwar-ma-sadiqi-al-mulhid-awda-1986 p. 129} {cite:mm-hiwar-ma-sadiqi-al-mulhid-awda-1986 p. 132}."
  ur: "مصطفیٰ محمود کی رائے ہے کہ قرآن تخلیق کو مراحل میں بیان کرتا ہے، اور ڈارون تشریحی مشابہت اور ارتقا میں درست اور مادی توجیہ اور تمام انواع کی ایک اصل میں غلط تھے؛ باقی آرا اس مدخل میں ابھی درج نہیں {cite:mm-hiwar-ma-sadiqi-al-mulhid-awda-1986 p. 129} {cite:mm-hiwar-ma-sadiqi-al-mulhid-awda-1986 p. 132}۔"
sensitivity: contested
perspectives:
  - tradition: sunni
    id: mostafa-mahmoud
    standing: main
    stance:
      ar: "الخلق على أطوار؛ التطور حقيقة ومراحله لغز؛ يُرفض التفسير المادي وحده والأصل الواحد لكل الأنواع ⁦(رأي كاتب معاصر)⁩"
      en: "Creation in stages; evolution is a fact and its stages a riddle; the purely materialist explanation and one origin for all species are rejected (a modern writer's view)"
      ur: "تخلیق اطوار میں؛ ارتقا حقیقت اور اس کے مراحل معما؛ صرف مادی توجیہ اور تمام انواع کی ایک اصل رد (جدید ادیب کی رائے)"
    summary:
      ar: "يستشهد بآيات الخلق من طين ثم سلالة ثم تسوية ونفخ الروح، ويقول إن «ثم» بالزمن الإلهي قد تعني ملايين السنين، وإن التشابه التشريحي يدل على وحدة الخالق لا على أصل واحد بالضرورة، ويرد على صراع البقاء بالجمال وعلى الطفرات بالتدبير."
      en: "He cites the verses of creation from clay, then an extract, then fashioning and the breathing of the spirit, says that 'then' in divine time may mean millions of years, that anatomical resemblance shows one Creator but not necessarily one ancestor, and answers the struggle for survival with beauty and random mutation with design."
      ur: "وہ مٹی، پھر خلاصے، پھر تسویہ اور روح پھونکنے کی آیات سے استشہاد کرتے ہیں، کہتے ہیں کہ الٰہی زمانے میں «پھر» لاکھوں برس ہو سکتا ہے، کہ تشریحی مشابہت ایک خالق کی دلیل ہے مگر لازماً ایک اصل کی نہیں، اور بقا کی کشمکش کا جواب حسن سے اور اتفاقی تغیر کا جواب تدبیر سے دیتے ہیں۔"
