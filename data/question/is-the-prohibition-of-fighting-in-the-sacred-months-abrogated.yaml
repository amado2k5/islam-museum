    summary:
      ar: "قال الشنقيطي عند الآية الخامسة من سورة براءة إنه ظهر له بعدُ أن أصوب القولين وأولاهما بالصواب أن تحريم الأشهر الحرم باق لم يُنسخ، وقال عند الآية الرابعة والثلاثين إن الذي تحققه بعد ذلك وصار يجزم به أنها باقية التحريم إلى الآن {cite:athar-shinqiti-adwa-ataat-2019-v1 p.38}."
      en: "At the fifth verse of Surat Bara'a al-Shinqiti said it later became clear to him that the sounder and more correct of the two views is that the prohibition of the sacred months remains and was not abrogated; at the thirty-fourth verse he said that what he later verified and came to hold firmly is that they remain prohibited to this day {cite:athar-shinqiti-adwa-ataat-2019-v1 p.38}."
      ur: "شنقیطی نے سورۂ براءۃ کی پانچویں آیت پر کہا کہ بعد میں ان پر واضح ہوا کہ دونوں قولوں میں زیادہ درست یہ ہے کہ حرمت والے مہینوں کی حرمت باقی ہے، منسوخ نہیں ہوئی؛ اور چونتیسویں آیت پر کہا کہ بعد میں جس کی انہوں نے تحقیق کی اور جس پر وہ پختہ ہو گئے وہ یہ ہے کہ ان کی حرمت آج تک باقی ہے {cite:athar-shinqiti-adwa-ataat-2019-v1 p.38}۔"
