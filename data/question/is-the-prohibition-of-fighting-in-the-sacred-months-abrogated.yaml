id: question/is-the-prohibition-of-fighting-in-the-sacred-months-abrogated
class: question
label:
  ar: "هل نُسخ تحريم القتال في الأشهر الحرم؟"
  en: "Has the prohibition of fighting in the sacred months been abrogated?"
  ur: "کیا حرمت والے مہینوں میں لڑائی کی ممانعت منسوخ ہو چکی ہے؟"
summary:
  ar: "كان محمد الأمين الشنقيطي يرى زمنًا طويلًا أن تحريم القتال في الأشهر الحرم منسوخ وينصر ذلك، ثم ظهر له أن أصوب القولين أن تحريمها باق لم يُنسخ، فصرّح برجوعه في تفسير سورة براءة؛ ويسوق كاتب ترجمته ذلك مثالًا على رجوعه إلى الحق إذا ظهر له."
  en: "For a long time Muhammad al-Amin al-Shinqiti held that the prohibition of fighting in the sacred months had been abrogated and argued for it; later it became clear to him that the sounder view is that the prohibition remains and was not abrogated, and he declared his change of view in his commentary on Surat Bara'a. His biographer gives this as an example of his returning to what he saw as right."
  ur: "محمد الامین الشنقیطی طویل عرصے تک یہ سمجھتے اور اس کی حمایت کرتے رہے کہ حرمت والے مہینوں میں لڑائی کی ممانعت منسوخ ہو چکی ہے؛ بعد میں ان پر واضح ہوا کہ زیادہ درست قول یہ ہے کہ یہ حرمت باقی ہے اور منسوخ نہیں ہوئی، اور انہوں نے سورۂ براءۃ کی تفسیر میں اپنے رجوع کا اعلان کیا۔ ان کے سوانح نگار اسے حق کی طرف رجوع کی مثال کے طور پر پیش کرتے ہیں۔"
question:
  ar: "هل بقي تحريم القتال في الأشهر الحرم أم نُسخ؟"
  en: "Does the prohibition of fighting in the sacred months still stand, or was it abrogated?"
  ur: "کیا حرمت والے مہینوں میں لڑائی کی ممانعت باقی ہے یا منسوخ ہو گئی؟"
short_answer:
  ar: "فيه قولان عند أهل السنة كما يحكيهما الشنقيطي: النسخ، وكان قوله الأول، وبقاء التحريم، وهو ما رجع إليه وجزم به."
  en: "There are two Sunni views as al-Shinqiti presents them: abrogation, his earlier view, and the prohibition still standing, the view he moved to and held firmly."
  ur: "شنقیطی کے بیان کے مطابق اہلِ سنت کے دو قول ہیں: نسخ، جو ان کا پہلا قول تھا، اور حرمت کا باقی رہنا، جس کی طرف انہوں نے رجوع کیا اور جس پر وہ پختہ ہوئے۔"
