id: question/what-is-zakat
class: question
label:
  ar: ما الزكاة؟
  en: What is zakat?
  es: "¿Qué es el zakat?"
  fr: "Qu'est-ce que la zakat ?"
summary:
  ar: الزكاة صدقة واجبة على المسلم القادر بشروط مخصوصة، وهي من أركان الإسلام، وقد ذكرها القرآن مقترنة بالصلاة.
  en: "Zakat is an obligatory charity due from a Muslim who has the means, under specific conditions; it is one of the pillars of Islam, and the Qur'an mentions it alongside prayer."
  es: "El zakat es una caridad obligatoria que debe entregar todo musulmán que tenga los medios, bajo ciertas condiciones; es uno de los pilares del Islam, y el Corán lo menciona junto con la oración."
  fr: "La zakat est une aumône obligatoire due par un musulman qui en a les moyens, sous certaines conditions; c'est l'un des piliers de l'islam, et le Coran la mentionne au même titre que la prière."
wings: []
question:
  ar: ما الزكاة؟
short_answer:
  ar: الزكاة صدقة واجبة على المسلم القادر بشروط مخصوصة، وهي من أركان الإسلام، وقد ذكرها القرآن مقترنة بالصلاة.
long_answer:
  ar: |
    الزكاة صدقة مفروضة، وهي من [[concept/five-pillars|أركان الإسلام الخمسة]] {cite:sahih-al-bukhari 8}، ذكرها القرآن مقترنة بالصلاة في مواضع كثيرة.
    وتُعطى الزكاة لمستحقيها وفق مصارف حددها القرآن في آية الصدقات، ومنها المؤلفة قلوبهم. ويفصل مدخل [[practice/zakat|الزكاة]] شروط الوجوب والمصارف.
    وتختلف الصدقة عن الزكاة: فالزكاة واجبة بشروطها، والصدقة في الإسلام أوسع من المال، كما يبين مدخل [[concept/sadaqa|الصدقة]].
