label:
  ar: ما الزكاة؟
  en: What is zakat?
summary:
  ar: الزكاة صدقة واجبة على المسلم القادر بشروط مخصوصة، وهي من أركان الإسلام، وقد ذكرها القرآن مقترنة بالصلاة.
  en: "Zakat is an obligatory charity due from a Muslim who has the means, under specific conditions; it is one of the pillars of Islam, and the Qur'an mentions it alongside prayer."
