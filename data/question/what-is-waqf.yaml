short_answer:
  ar: الوقف هو حبس الأصل وتسبيل ثمرته في وجوه البر؛ به قامت المساجد والمدارس والمستشفيات والأسبلة في الحضارة
    الإسلامية.
long_answer:
  ar: الوقف (الحبس) هو تحبيس مال يُنتفع بريعه في وجه خيري دائم؛ جعله الفقهاء من أصدق الصدقة الجارية. به
    أُقيمت المساجد والمدارس والبيمارستانات والرباطات والأسبلة والقناطر؛ وكانت أوقافًا عظيمة أوقاف السلاطين
    والأمراء والأمهات والتجار عبر العالم الإسلامي. {cite:wikidata}
