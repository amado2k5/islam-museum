id: question/what-is-waqf
class: question
label:
  ar: ما الوقف؟
  en: What is the waqf?
  es: "¿Qué es el waqf?"
  fr: "Qu'est-ce que le waqf ?"
  ur: "وقف کیا ہے؟"
summary:
  ar: الوقف هو حبس الأصل وتسبيل ثمرته في وجوه البر؛ به قامت المساجد والمدارس والمستشفيات والأسبلة في الحضارة
    الإسلامية.
  en: Waqf is the holding of a principal asset and the devotion of its yield to works of charity. Mosques, schools, hospitals and public fountains in Islamic civilization were established and sustained by it.
  es: "El waqf consiste en la tenencia de un bien principal y la dedicación de sus rendimientos a obras de caridad. Mezquitas, escuelas, hospitales y fuentes públicas en la civilización islámica se establecieron y mantuvieron gracias a él."
  fr: "Le waqf est la détention d'un bien principal et l'affectation de ses revenus à des œuvres de charité. Dans la civilisation islamique, les mosquées, les écoles, les hôpitaux et les fontaines publiques ont été fondés et entretenus grâce à ce système."
  ur: "وقف ایک بنیادی اثاثہ کا انعقاد اور اس کی پیداوار کو فلاحی کاموں کے لیے وقف کرنا ہے۔ اسلامی تہذیب میں مساجد، سکول، ہسپتال اور عوامی چشمے اسی کے ذریعے قائم اور برقرار رہے۔"
question:
  ar: ما الوقف؟
short_answer:
  ar: الوقف هو حبس الأصل وتسبيل ثمرته في وجوه البر؛ به قامت المساجد والمدارس والمستشفيات والأسبلة في الحضارة
    الإسلامية.
long_answer:
  ar: الوقف ⁦(الحبس)⁩ هو تحبيس مال يُنتفع بريعه في وجه خيري دائم؛ جعله الفقهاء من أصدق الصدقة الجارية. به
    أُقيمت المساجد والمدارس والبيمارستانات والرباطات والأسبلة والقناطر؛ وكانت أوقافًا عظيمة أوقاف السلاطين
    والأمراء والأمهات والتجار عبر العالم الإسلامي. {cite:wikidata}
