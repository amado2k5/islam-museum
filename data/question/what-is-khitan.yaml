  ar: "ما الختان؟"
  en: What is khitan?
  es: "¿Qué es el khitan?"
  fr: "Qu'est-ce que le khitan ?"
summary:
  ar: "الختان إزالة قلفة الذكر، وهو من سنن الفطرة عند الفقهاء وعادة راسخة في الشرع والعرف تختلف صورها بين البلدان."
  en: "Circumcision is the removal of the male foreskin. Jurists count it among the practices of the natural disposition (fitra), and it is an established custom in both religious law and local custom, whose forms vary between countries."
  es: "La circuncisión es la extirpación del prepucio masculino. Los juristas la consideran una práctica propia de la naturaleza innata (fitra), y es una costumbre establecida tanto en el derecho religioso como en las tradiciones locales, cuyas formas varían entre países."
  fr: "La circoncision est l'ablation du prépuce chez l'homme. Les juristes la considèrent comme une pratique conforme à la nature (fitra) et elle constitue une coutume établie tant en droit religieux que dans les coutumes locales, dont les modalités varient selon les pays."
