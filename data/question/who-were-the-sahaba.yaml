id: question/who-were-the-sahaba
class: question
label:
  ar: من الصحابة؟
  en: Who are the Sahaba?
  es: "¿Quiénes son los Sahaba?"
  fr: "Qui sont les Sahaba ?"
summary:
  ar: الصحابة هم من لقي النبي مؤمنًا به ومات على الإسلام؛ قادوا الفتوح والتدوين ونقلوا الدين للأجيال بعده.
  en: "The Sahaba are those who met the Prophet while believing in him and died in Islam. They led the conquests and the compilation, and transmitted the religion to the generations after them."
  es: "Los Sahaba son aquellos que conocieron al Profeta creyendo en él y murieron en el Islam. Lideraron las conquistas y la recopilación de textos sagrados, y transmitieron la religión a las generaciones posteriores."
  fr: "Les Sahaba sont ceux qui ont rencontré le Prophète en croyant en lui et qui sont morts en musulmans. Ils ont mené les conquêtes et la compilation, et ont transmis la religion aux générations suivantes."
question:
  ar: من الصحابة؟
short_answer:
  ar: الصحابة هم من لقي النبي مؤمنًا به ومات على الإسلام؛ قادوا الفتوح والتدوين ونقلوا الدين للأجيال بعده.
long_answer:
  ar: 'الصحابة هم جيل لقي النبي مؤمنًا به ومات مسلمًا؛ منهم أهل بيته وأزواجه والمهاجرون والأنصار وأهل
    بدر والبيعة. قادوا الجيل الانتقالي: الخلفاء الأربعة، وأهل الشورى، وحملة القرآن والحديث، وفاتحو الأمصار،
    ومنهم انبثقت طبقة التابعين. {cite:wikidata}'
