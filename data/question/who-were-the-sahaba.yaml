short_answer:
  ar: الصحابة هم من لقي النبي مؤمنًا به ومات على الإسلام؛ قادوا الفتوح والتدوين ونقلوا الدين للأجيال بعده.
long_answer:
  ar: 'الصحابة هم جيل لقي النبي مؤمنًا به ومات مسلمًا؛ منهم أهل بيته وأزواجه والمهاجرون والأنصار وأهل
    بدر والبيعة. قادوا الجيل الانتقالي: الخلفاء الأربعة، وأهل الشورى، وحملة القرآن والحديث، وفاتحو الأمصار،
    ومنهم انبثقت طبقة التابعين. {cite:wikidata}'
