id: question/why-is-riba-forbidden
class: question
label:
  ar: "لماذا يحرّم الإسلام الربا؟"
  en: Why does Islam forbid riba?
  es: "¿Por qué el Islam prohíbe la usura?"
  fr: "Pourquoi l'islam interdit-il le riba (l'usure) ?"
  ur: "اسلام سود کو کیوں حرام کرتا ہے؟"
  tr: "İslam neden tefeciliği yasaklıyor?"
  id: "Mengapa Islam melarang riba?"
summary:
  ar: "القرآن يبيح البيع ويحرّم الربا، كما في آية البقرة 275، والربا محرم في الشريعة، وتفصيل أحكامه وأنواعه يحتاج إلى كتب الفقه."
  en: "The Qur'an permits sale and forbids riba, as in al-Baqara 275, and riba is forbidden in the Sharia. Its detailed rulings and types are a matter for the books of jurisprudence."
  es: "El Corán permite la venta y prohíbe la usura, como se menciona en al-Baqara 275, y la usura está prohibida en la Sharia. Sus normas y tipos específicos se tratan en los libros de jurisprudencia."
  fr: "Le Coran autorise la vente et interdit l'usure (riba), comme indiqué dans la sourate Al-Baqara, verset 275, et l'usure est prohibée par la charia. Ses règles et ses formes détaillées relèvent des ouvrages de jurisprudence."
  ur: "قرآن بیچنے کی اجازت دیتا ہے اور سود کو حرام قرار دیتا ہے، جیسا کہ البقرہ 275 میں ہے، اور شریعت میں سود کو حرام قرار دیا گیا ہے۔ اس کے تفصیلی احکام اور اقسام فقہ کی کتابوں کا معاملہ ہے۔"
  tr: "Kur'an, Al-Baqarah 275 ayetinde belirtildiği gibi satışa izin verir ve tefeciliği yasaklar. Şeriat'ta tefecilik yasaktır ve hükümlerinin ve türlerinin ayrıntılı olarak açıklanması için fıkıh kitapları gereklidir."
  id: "Al-Qur'an mengizinkan penjualan dan melarang riba, sebagaimana dinyatakan dalam ayat Al-Baqarah 275. Riba dilarang dalam Syariah, dan merinci aturan serta jenisnya memerlukan buku fiq."
wings: []
question:
  ar: "لماذا يحرّم الإسلام الربا؟"
short_answer:
  ar: "القرآن يبيح البيع ويحرّم الربا، كما في آية البقرة 275، والربا محرم في الشريعة، وتفصيل أحكامه وأنواعه يحتاج إلى كتب الفقه."
long_answer:
  ar: |
    يذكر القرآن أن الله أحلّ البيع وحرّم الربا، كما في [[passage/quran-2-275|البقرة 275]]، وهذا أصل تحريم الربا في الإسلام.
    وتحريم الربا من الأحكام التي يسأل عنها الناس كثيراً في المعاملات المالية الحديثة، ويرتبط بباب الحلال والحرام في [[concept/halal-haram|الحلال والحرام]].
    وأحكام الربا التفصيلية وأنواعه وصوره في المعاملات المعاصرة محل بحث في الفقه، ولهذا يعرض هذا المدخل الأصل دون تفصيل صور المعاملات.
