label:
  ar: "لماذا يحرّم الإسلام الربا؟"
  en: Why does Islam forbid riba?
summary:
  ar: "القرآن يبيح البيع ويحرّم الربا، كما في آية البقرة 275، والربا محرم في الشريعة، وتفصيل أحكامه وأنواعه يحتاج إلى كتب الفقه."
  en: "The Qur'an permits sale and forbids riba, as in al-Baqara 275, and riba is forbidden in the Sharia. Its detailed rulings and types are a matter for the books of jurisprudence."
wings: []
question:
  ar: "لماذا يحرّم الإسلام الربا؟"
short_answer:
  ar: "القرآن يبيح البيع ويحرّم الربا، كما في آية البقرة 275، والربا محرم في الشريعة، وتفصيل أحكامه وأنواعه يحتاج إلى كتب الفقه."
long_answer:
  ar: |
    يذكر القرآن أن الله أحلّ البيع وحرّم الربا، كما في [[passage/quran-2-275|البقرة 275]]، وهذا أصل تحريم الربا في الإسلام.
    وتحريم الربا من الأحكام التي يسأل عنها الناس كثيراً في المعاملات المالية الحديثة، ويرتبط بباب الحلال والحرام في [[concept/halal-haram|الحلال والحرام]].
    وأحكام الربا التفصيلية وأنواعه وصوره في المعاملات المعاصرة محل بحث في الفقه، ولهذا يعرض هذا المدخل الأصل دون تفصيل صور المعاملات.
