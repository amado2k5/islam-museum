id: question/who-was-yusuf
class: question
label:
  ar: من كان يوسف الصديق؟
  en: Who was Yusuf the truthful?
  es: "¿Quién era Yusuf el veraz?"
  fr: "Qui était Yusuf le véridique ?"
  ur: "یوسف سچا کون تھا؟"
  tr: "Yusuf el-Siddik kimdi?"
  id: "Siapakah Yusuf al-Siddiq?"
summary:
  ar: يوسف بن يعقوب نبي الله؛ رموه إخوته في الجب وباعوه عبدا فاشتراه عزيز مصر فصبر على الفتنة والسجن حتى
    ولي خزائن مصر.
  en: "Yusuf ibn Yaqub, a prophet of God. His brothers threw him into the well and sold him as a slave. The al-Aziz of Egypt bought him, and he endured the trial and prison until he was given charge of the treasuries of Egypt."
  es: "Yusuf ibn Yaqub, profeta de Dios, fue arrojado a un pozo por sus hermanos, quienes lo vendieron como esclavo. Al-Aziz, de Egipto, lo compró, y soportó el juicio y la prisión hasta que se le encomendó la administración de los tesoros de Egipto."
  fr: "Yusuf ibn Yaqub, prophète de Dieu, fut jeté dans un puits par ses frères et vendu comme esclave. Les al-Aziz d'Égypte l'achetèrent, et il subit le procès et la prison jusqu'à ce qu'il soit nommé responsable des trésors d'Égypte."
  ur: "یوسف بن یعقوب، خدا کے نبی۔ اس کے بھائیوں نے اسے کنویں میں پھینک دیا اور اسے غلام بنا کر بیچ دیا۔ مصر کے العزیز نے اسے خرید لیا، اور اس نے مقدمے اور قید کی صعوبتیں برداشت کیں یہاں تک کہ اسے مصر کے خزانوں کی ذمہ داری سونپی گئی۔"
  tr: "Yusuf bin Yaqub Tanrı'nın peygamberiydi; kardeşleri onu çukura attı ve köle olarak sattı, fakat Mısır prensi onu satın aldı, böylece Mısır hazinesini ele geçirene kadar sınavlara ve hapislere katlandı."
  id: "Yusuf ibn Yaqub adalah nabi Tuhan; saudara-saudaranya melemparkannya ke dalam lubang dan menjualnya sebagai budak, tetapi pangeran Mesir membelinya, sehingga ia menanggung ujian dan penjara sampai mengambil alih harta Mesir."
question:
  ar: من كان يوسف الصديق؟
short_answer:
  ar: يوسف بن يعقوب نبي الله؛ رموه إخوته في الجب وباعوه عبدا فاشتراه عزيز مصر فصبر على الفتنة والسجن حتى
    ولي خزائن مصر.
long_answer:
  ar: '[[person/yusuf|يوسف]] بن يعقوب بن إسحاق بن إبراهيم؛ قصته أحسن القصص في القرآن سورة كاملة؛ رأى أحد
    عشر كوكبًا والشمس والقمر له ساجدين فكان ما رأى؛ ملك خزائن مصر في سنين الرجح والشدة وعف عمّا فعل إخوته.
    {cite:wikidata}'
