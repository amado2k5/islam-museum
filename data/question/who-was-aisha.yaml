id: question/who-was-aisha
class: question
label:
  ar: من كانت عائشة؟
  en: Who was Aisha?
  es: "¿Quién era Aisha?"
  fr: "Qui était Aisha ?"
  ur: "عائشہ کون تھی؟"
summary:
  ar: عائشة بنت أبي بكر أم المؤمنين ومن أكثر رواة الحديث وفقهاء الصحابة؛ عاشت مع النبي تسع سنين ونقلت
    عنه أحاديث كثيرة.
  en: "Aisha bint Abi Bakr, Mother of the Believers, was among the most prolific narrators of hadith and one of the Companions most learned in jurisprudence. She lived with the Prophet for nine years and narrated many hadiths from him."
  es: "Aisha bint Abi Bakr, Madre de los Creyentes, fue una de las narradoras más prolíficas de hadices y una de las Compañeras más eruditas en jurisprudencia. Vivió con el Profeta durante nueve años y narró muchos hadices de él."
  fr: "Aïcha bint Abi Bakr, la Mère des Croyants, fut l'une des rapporteuses de hadiths les plus prolifiques et l'une des Compagnons les plus érudites en matière de jurisprudence. Elle vécut auprès du Prophète pendant neuf ans et rapporta de nombreux hadiths de lui."
  ur: "عائشہ بنت ابی بکر، مومنین کی والدہ، حدیث کی سب سے مشہور راویوں میں سے تھیں اور فقہ میں سب سے زیادہ علم رکھنے والی صحابہ میں سے تھیں۔ وہ نو سال تک نبی کے ساتھ رہیں اور آپ سے بہت سی احادیث روایت کیں۔"
question:
  ar: من كانت عائشة؟
short_answer:
  ar: عائشة بنت أبي بكر أم المؤمنين ومن أكثر رواة الحديث وفقهاء الصحابة؛ عاشت مع النبي تسع سنين ونقلت
    عنه أحاديث كثيرة.
long_answer:
  ar: '[[person/aisha|عائشة بنت أبي بكر]] زوج النبي وأحد أعلم الصحابة؛ روى عنها نحو ألفي حديث وكان كبار
    الصحابة يسألونها في الأحكام. عاشت بعد النبي أربعة عقود فرأت الفتن والخلافة ودرّست المدينة أجيالًا
    حتى وفاتها 58هـ. {cite:wikidata}'
