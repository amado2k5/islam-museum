long_answer:
  ar: '[[person/aisha|عائشة بنت أبي بكر]] زوج النبي وأحد أعلم الصحابة؛ روى عنها نحو ألفي حديث وكان كبار
    الصحابة يسألونها في الأحكام. عاشت بعد النبي أربعة عقود فرأت الفتن والخلافة ودرّست المدينة أجيالًا
    حتى وفاتها 58هـ. {cite:wikidata}'
