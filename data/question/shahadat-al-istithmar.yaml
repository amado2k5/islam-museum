id: question/shahadat-al-istithmar
class: question
label:
  ar: "هل عائد شهادات الاستثمار وودائع التوفير ذات الربح المحدد ربا؟"
  en: "Is the fixed return on investment certificates and savings deposits riba?"
  ur: "کیا سرمایہ کاری سرٹیفکیٹ اور بچت کھاتوں کا مقررہ منافع ربا ہے؟"
summary:
  ar: "مسألة معاصرة نشأت مع البنوك وصناديق التوفير وشهادات الاستثمار ذات العائد المحدد سلفاً. يعرضها أحمد شلبي في «الاقتصاد في الفكر الإسلامي» ويذهب إلى إباحة هذا العائد، وينقل مثله عن علماء من الأزهر ومجمع البحوث الإسلامية، ويذكر أن بعض الباحثين يرونه حراماً. {cite:iqtisad-fikr-islami-shalabi-1993 p.123} {cite:iqtisad-fikr-islami-shalabi-1993 p.141} {cite:iqtisad-fikr-islami-shalabi-1993 p.145}"
  en: "A modern question that arose with banks, savings funds and investment certificates paying a return fixed in advance. Ahmad Shalabi treats it in al-Iqtisad fi al-Fikr al-Islami and holds the return permissible, reporting the same from scholars of al-Azhar and the Islamic Research Academy, and noting that some researchers hold it forbidden."
  ur: "ایک جدید مسئلہ جو بینکوں، بچت فنڈز اور پیشگی مقررہ منافع والے سرمایہ کاری سرٹیفکیٹوں کے ساتھ پیدا ہوا۔ احمد شلبی «الاقتصاد فی الفکر الاسلامی» میں اس پر بحث کرتے ہیں اور اس منافع کو جائز کہتے ہیں، اور ازہر اور مجمع البحوث الاسلامیہ کے علماء سے یہی نقل کرتے ہیں، اور بتاتے ہیں کہ بعض محققین اسے حرام سمجھتے ہیں۔"
wings: [ideas, today]
themes: [trade-and-finance]
sensitivity: contested
question:
  ar: "هل يحل عائد شهادات الاستثمار وودائع التوفير المحدد سلفاً، أم هو من الربا؟"
  en: "Is a return fixed in advance on investment certificates and savings deposits lawful, or is it riba?"
  ur: "کیا سرمایہ کاری سرٹیفکیٹ اور بچت کھاتوں پر پیشگی مقررہ منافع حلال ہے یا ربا؟"
issue:
  ar: "حكم العائد المحدد سلفاً على الأموال المودعة في البنوك وصناديق التوفير وشهادات الاستثمار."
  en: "The ruling on a return fixed in advance on money deposited in banks, savings funds and investment certificates."
  ur: "بینکوں، بچت فنڈز اور سرمایہ کاری سرٹیفکیٹ میں جمع رقم پر پیشگی مقررہ منافع کا حکم۔"
perspectives:
  - tradition: sunni
    id: prohibition
    stance: { ar: "حرام، لأنه ربح بلا عمل ولا مخاطرة ⁦(كما يحكيه شلبي)⁩", en: "Forbidden, as profit without work or risk (as Shalabi reports it)", ur: "حرام، کیونکہ یہ محنت اور خطرے کے بغیر منافع ہے (جیسا شلبی نقل کرتے ہیں)" }
    summary:
      ar: "يذكر شلبي أن بعض الباحثين يرون هذه المعاملة حراماً، وأن من يميلون إلى تحريمها يعلّلون بأن المال جلب ربحاً بلا عمل، أو بلا مخاطرة. ولم يُنقل هنا هذا القول من كتب أصحابه ولا من قرارات المجامع الفقهية التي تبنّته (needs_source). {cite:iqtisad-fikr-islami-shalabi-1993 p.140} {cite:iqtisad-fikr-islami-shalabi-1993 p.141}"
      en: "Shalabi notes that some researchers hold this dealing forbidden, and that those inclined to prohibit it argue that the money earned profit without work, or without risk. This view is not given here from its holders' own books or from the resolutions of fiqh academies that adopted it (needs_source)."
      ur: "شلبی بتاتے ہیں کہ بعض محققین اس معاملے کو حرام سمجھتے ہیں، اور اس کی حرمت کی طرف مائل لوگ یہ علت بیان کرتے ہیں کہ مال نے محنت کے بغیر، یا خطرے کے بغیر منافع کمایا۔ یہ قول یہاں اس کے قائلین کی اپنی کتابوں سے یا ان فقہی مجامع کی قراردادوں سے نقل نہیں ہوا جنہوں نے اسے اختیار کیا (needs_source)۔"
    sources: [source/iqtisad-fikr-islami-shalabi-1993]
  - tradition: sunni
    id: permission-shalabi
    stance: { ar: "حلال، رأي شلبي ومن نقل عنهم", en: "Lawful: Shalabi's view and those he cites", ur: "حلال: شلبی اور جن سے وہ نقل کرتے ہیں ان کی رائے" }
    summary:
      ar: "يرى شلبي أن الربا المحرم مرتبط بالقروض، وأن هذه المعاملات لا نص على تحريمها والأصل في العقود الإباحة، ويقيسها على المضاربة وعلى إجارة الدور والأرض، ويذكر تعويض انهيار العملة؛ وينقل القول بالإباحة عن علي الخفيف ويس سويلم في مؤتمر مجمع البحوث الإسلامية سنة 1972، وعبد المنعم النمر، وعبد الرحمن عيسى، وعن لجنة البحوث الفقهية بمجمع البحوث الإسلامية التي قرر أغلب ممثلي المذاهب الأربعة فيها سنة 1976 أن أرباح شهادات استثمار البنك الأهلي ليست من قبيل الربا. ويرى أن الخلاف فيها سائغ، وأن القطع بالتحريم لا يحترم رأي الآخرين. {cite:iqtisad-fikr-islami-shalabi-1993 p.13} {cite:iqtisad-fikr-islami-shalabi-1993 p.124} {cite:iqtisad-fikr-islami-shalabi-1993 p.140} {cite:iqtisad-fikr-islami-shalabi-1993 p.141} {cite:iqtisad-fikr-islami-shalabi-1993 p.144} {cite:iqtisad-fikr-islami-shalabi-1993 p.145}"
      en: "Shalabi holds that forbidden riba is tied to loans, that no text forbids these dealings and contracts are permissible in principle, compares them with silent partnership and with renting houses and land, and points to compensation for currency collapse; he reports the permissive view from Ali al-Khafif and Yasin Suwaylim at the Islamic Research Academy conference of 1972, from Abd al-Mun'im al-Nimr and Abd al-Rahman Isa, and from the Academy's committee for juristic research, where in 1976 most representatives of the four schools decided that the profits of the National Bank's investment certificates are not riba. He considers disagreement on it legitimate and says that categorical prohibition does not respect others' views."
      ur: "شلبی کی رائے میں حرام ربا قرضوں سے متعلق ہے، ان معاملات کی حرمت پر کوئی نص نہیں اور عقود میں اصل اباحت ہے؛ وہ انہیں مضاربہ اور مکانوں اور زمین کے کرایے پر قیاس کرتے ہیں اور کرنسی کی گراوٹ کے معاوضے کا ذکر کرتے ہیں؛ وہ جواز کا قول علی الخفیف اور یٰسین سویلم سے، 1972 میں مجمع البحوث الاسلامیہ کی کانفرنس میں، عبد المنعم النمر اور عبد الرحمن عیسیٰ سے، اور مجمع کی فقہی تحقیق کمیٹی سے نقل کرتے ہیں، جس میں 1976 میں چاروں مذاہب کے اکثر نمائندوں نے طے کیا کہ بنک الاہلی کے سرمایہ کاری سرٹیفکیٹ کا منافع ربا نہیں۔ ان کے نزدیک اس میں اختلاف جائز ہے، اور قطعی حرمت کا قول دوسروں کی رائے کا احترام نہیں کرتا۔"
