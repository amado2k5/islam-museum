label:
  ar: ما الهجرة، ولماذا يبدأ التقويم الإسلامي بها؟
  en: What is the Hijra, and why does the Islamic calendar begin with it?
summary:
  ar: الهجرة انتقال النبي محمد وأصحابه من مكة إلى المدينة سنة 622م، ومنها يُعدّ التقويم الهجري.
  en: "The Hijra was the migration of the Prophet Muhammad and his Companions from Mecca to Medina in 622 CE. The Hijri calendar is counted from it."
wings: []
question:
  ar: ما الهجرة، ولماذا يبدأ التقويم الإسلامي بها؟
short_answer:
  ar: الهجرة انتقال النبي محمد وأصحابه من مكة إلى المدينة سنة 622م، ومنها يُعدّ التقويم الهجري.
long_answer:
  ar: |
    الهجرة هي انتقال النبي محمد ومن معه من المسلمين من مكة إلى المدينة، وقعت سنة 622م. ومنها يُعدّ التقويم الهجري، كما يعرض مدخل [[event/hijra|الهجرة]].
    وهي حدث محوري في السيرة، إذ تحولت بعدها الجماعة المسلمة إلى مجتمع في المدينة له تنظيمه الخاص، كما يعرض مدخل [[place/medina|المدينة]].
    وتفاصيل الرحلة وروايتها تُعرض في سياقها التاريخي، ويُنظر في [[event/hijra-departure|خروج الهجرة]] لرواية الخروج.
