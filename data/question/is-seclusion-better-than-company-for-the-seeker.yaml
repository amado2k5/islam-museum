id: question/is-seclusion-better-than-company-for-the-seeker
class: question
label: { ar: "هل الأفضل للسالك العزلة أم الخلطة؟", en: "Is seclusion or company better for the seeker?", ur: "سالک کے لیے عزلت بہتر ہے یا میل جول؟" }
summary:
  ar: "سئل ابن تيمية: هل الأفضل للسالك العزلة أو الخلطة؟ فأجاب بأن الناس تنازعوا فيها نزاعاً كلياً أو حالياً، وأن الخلطة تكون واجبة أو مستحبة إذا كان فيها تعاون على البر والتقوى ومنهياً عنها إذا كانت تعاوناً على الإثم، وأن لا بد للعبد من أوقات ينفرد فيها، وأن اختيار المخالطة مطلقاً خطأ واختيار الانفراد مطلقاً خطأ."
  en: "Ibn Taymiyya was asked whether seclusion or company is better for the seeker. He answered that people disputed over it either in general or according to circumstances; that company is obligatory or recommended when it is cooperation in righteousness and piety and forbidden when it is cooperation in sin; that the servant needs times of solitude; and that choosing company absolutely is a mistake, as is choosing solitude absolutely."
question: { ar: "هل الأفضل للسالك العزلة أم الخلطة؟", en: "Is seclusion or company better for the seeker?", ur: "سالک کے لیے عزلت بہتر ہے یا میل جول؟" }
issue: { ar: "المفاضلة بين اعتزال الناس ومخالطتهم في طريق العبادة والسلوك.", en: "Weighing withdrawal from people against mixing with them on the path of worship.", ur: "عبادت و سلوک کی راہ میں لوگوں سے الگ رہنے اور ان سے ملنے جلنے کا موازنہ۔" }
short_answer:
  ar: "ابن تيمية: لا تفضيل مطلق؛ الخلطة في العبادات الجامعة والتعاون على البر مأمور بها، والانفراد للدعاء والذكر ومحاسبة النفس لا بد منه، وتقدير ما يصلح لكل إنسان يحتاج إلى نظر خاص."
  en: "Ibn Taymiyya: there is no absolute preference; company in communal worship and cooperation in good is commanded, solitude for supplication, remembrance and self-examination is indispensable, and what suits each person needs particular judgement."
  ur: "ابن تیمیہ: کوئی مطلق ترجیح نہیں؛ اجتماعی عبادات اور نیکی میں تعاون کے لیے میل جول کا حکم ہے، دعا، ذکر اور محاسبۂ نفس کے لیے تنہائی ناگزیر ہے، اور ہر شخص کے لیے کیا بہتر ہے اس کے لیے خاص غور درکار ہے۔"
