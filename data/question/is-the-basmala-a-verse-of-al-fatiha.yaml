    stance: { ar: "عن أحمد روايتان", en: "Two narrations from Ahmad", ur: "احمد سے دو روایتیں" }
    summary:
      ar: "يقول ابن الجوزي إن عن أحمد روايتين في كونها آية كاملة، وروايتين في كونها من الفاتحة؛ وإن من عدّها من الفاتحة أوجب قراءتها في الصلاة إذا قال بوجوب الفاتحة، ومن لم يعدّها جعل قراءتها سنة، إلا مالكًا فلا يستحبها؛ وإن جماعة نقلوا عن أحمد أنه لا يسن الجهر بها، وهو قول أبي بكر وعمر وعثمان وعلي وابن مسعود وغيرهم ومن التابعين الحسن والشعبي وسعيد بن جبير، وبه قال مالك وأبو حنيفة، وذهب الشافعي إلى أن الجهر مسنون {cite:zad-al-masir-maktab-islami-v1 p.7} {cite:zad-al-masir-maktab-islami-v1 p.8}."
      en: "Ibn al-Jawzi says there are two narrations from Ahmad on whether it is a complete verse and two on whether it is part of al-Fatiha; whoever counts it part of al-Fatiha makes reciting it in prayer obligatory where he holds al-Fatiha obligatory, and whoever does not counts it a sunna — except Malik, who does not recommend reciting it in prayer; and a group report from Ahmad that saying it aloud is not a sunna, the view of Abu Bakr, Umar, Uthman, Ali, Ibn Mas'ud and others and, among the Successors, al-Hasan, al-Sha'bi and Sa'id ibn Jubayr, held also by Malik and Abu Hanifa, while al-Shafi'i held that saying it aloud is a sunna {cite:zad-al-masir-maktab-islami-v1 p.7} {cite:zad-al-masir-maktab-islami-v1 p.8}."
      ur: "ابن الجوزی کہتے ہیں کہ اس کے مکمل آیت ہونے میں احمد سے دو روایتیں ہیں اور فاتحہ کا حصہ ہونے میں بھی دو؛ جو اسے فاتحہ کا حصہ مانے وہ نماز میں اس کی قراءت واجب کہتا ہے اگر فاتحہ کو واجب کہے، اور جو نہ مانے وہ اس کی قراءت کو سنت کہتا ہے — سوائے مالک کے، جو نماز میں اس کی قراءت مستحب نہیں سمجھتے؛ اور ایک جماعت احمد سے نقل کرتی ہے کہ اسے جہراً پڑھنا سنت نہیں، جو ابو بکر، عمر، عثمان، علی، ابن مسعود وغیرہم اور تابعین میں حسن، شعبی اور سعید بن جبیر کا قول ہے، اور یہی مالک اور ابو حنیفہ کا قول ہے، جبکہ شافعی کے نزدیک جہر مسنون ہے {cite:zad-al-masir-maktab-islami-v1 p.7} {cite:zad-al-masir-maktab-islami-v1 p.8}۔"
