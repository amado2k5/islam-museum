id: question/is-the-basmala-a-verse-of-al-fatiha
class: question
label:
  ar: "هل البسملة آية من الفاتحة؟"
  en: "Is the basmala a verse of al-Fatiha?"
  ur: "کیا بسملہ سورۂ فاتحہ کی آیت ہے؟"
summary:
  ar: "يحكي البيضاوي في «أنوار التنزيل» أن البسملة من الفاتحة عند قراء مكة والكوفة وفقهائهما وابن المبارك والشافعي، وأن قراء المدينة والبصرة والشام وفقهاءها ومالكًا والأوزاعي خالفوهم، وأن أبا حنيفة لم ينص فيها بشيء فظُن أنها ليست من السورة عنده، وأن محمد بن الحسن سئل عنها فقال: ما بين الدفتين كلام الله؛ ويحتج للقول الأول بأحاديث، ويذكر الإجماع على أن ما بين الدفتين كلام الله والاتفاق على إثباتها في المصاحف."
  en: "Al-Baydawi reports in Anwar al-Tanzil that the basmala is part of al-Fatiha for the readers and jurists of Mecca and Kufa, Ibn al-Mubarak and al-Shafi'i; that the readers and jurists of Medina, Basra and Syria, Malik and al-Awza'i disagreed; that Abu Hanifa said nothing explicit, so it was thought that for him it is not part of the sura; and that Muhammad ibn al-Hasan, asked about it, said what lies between the two covers is God's speech. He argues for the first view from hadith and notes the consensus that what lies between the covers is God's speech and the agreement to write it in the copies of the Qur'an."
  ur: "بیضاوی «انوار التنزیل» میں بیان کرتے ہیں کہ مکہ اور کوفہ کے قراء و فقہا، ابن المبارک اور شافعی کے نزدیک بسملہ فاتحہ کا حصہ ہے؛ مدینہ، بصرہ اور شام کے قراء و فقہا، مالک اور اوزاعی نے اختلاف کیا؛ ابو حنیفہ نے اس میں کوئی صراحت نہیں کی، اس لیے سمجھا گیا کہ ان کے نزدیک یہ سورت کا حصہ نہیں؛ اور محمد بن الحسن سے پوچھا گیا تو کہا: دونوں گتوں کے درمیان جو کچھ ہے وہ اللہ کا کلام ہے۔ وہ پہلے قول کے حق میں احادیث سے استدلال کرتے ہیں اور اس پر اجماع ذکر کرتے ہیں کہ دونوں گتوں کے درمیان اللہ کا کلام ہے اور مصاحف میں اسے لکھنے پر اتفاق ہے۔"
question:
  ar: "هل البسملة آية من الفاتحة، وما مذاهب القراء والفقهاء فيها؟"
  en: "Is the basmala a verse of al-Fatiha, and what are the readers' and jurists' positions?"
  ur: "کیا بسملہ سورۂ فاتحہ کی آیت ہے، اور اس میں قراء و فقہا کے مسالک کیا ہیں؟"
short_answer:
  ar: "مسألة خلافية بين مذاهب أهل السنة: هي من الفاتحة عند الشافعي وقراء مكة والكوفة، وليست منها عند مالك والأوزاعي وقراء المدينة والبصرة والشام، ولم ينص أبو حنيفة فيها بشيء؛ والاتفاق على أنها مكتوبة في المصاحف وأن ما بين الدفتين كلام الله."
  en: "It is disputed among the Sunni schools: part of al-Fatiha for al-Shafi'i and the readers of Mecca and Kufa; not part of it for Malik, al-Awza'i and the readers of Medina, Basra and Syria; Abu Hanifa said nothing explicit; all agree it is written in the copies of the Qur'an and that what lies between the covers is God's speech."
  ur: "یہ اہلِ سنت کے مسالک میں مختلف فیہ ہے: شافعی اور مکہ و کوفہ کے قراء کے نزدیک فاتحہ کا حصہ؛ مالک، اوزاعی اور مدینہ، بصرہ و شام کے قراء کے نزدیک نہیں؛ ابو حنیفہ نے صراحت نہیں کی؛ اور سب متفق ہیں کہ یہ مصاحف میں لکھی ہے اور دونوں گتوں کے درمیان اللہ کا کلام ہے۔"
