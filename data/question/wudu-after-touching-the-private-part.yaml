    stance: { ar: "الأمر فيه على الاستحباب", en: "The command is one of recommendation" }
    summary: { ar: "كان مالك بن أنس يذهب إلى أن الأمر بالوضوء من مس الذكر على الاستحباب لا على الإيجاب.", en: "Malik ibn Anas held that the command to perform ablution after touching it is a recommendation, not an obligation." }
