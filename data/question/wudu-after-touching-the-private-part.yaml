    standing: secondary
    stance: { ar: "الظاهرية ⁦(ابن حزم)⁩: ينقض مسّه عمداً بأي شيء إلا بالفخذ والساق والرجل، ولا ينقض نسياناً ولا من فوق ثوب", en: "Zahiri (Ibn Hazm): deliberate touching with anything except thigh, shin or foot breaks it; not by forgetfulness or through cloth" }
    summary: { ar: "يرى ابن حزم في «المحلى» أن مسّ الرجل ذكره والمرأة فرجها عمداً بباطن اليد أو ظاهرها أو الذراع يوجب الوضوء، وكذلك مسّ فرج غيره عمداً بأي عضو، ولا معنى للذة، ولا ينقض المسّ نسياناً أو بغلبة أو من فوق ثوب؛ ويحتج بحديث بسرة، ويرى حديث طلق صحيحاً لكنه منسوخ لأنه موافق لما كان الناس عليه قبل الأمر بالوضوء من مس الفرج." }
