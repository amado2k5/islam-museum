id: question/wudu-after-touching-the-private-part
class: question
label: { ar: "هل ينقض مسُّ الذكر الوضوء؟", en: "Does touching the private part break ablution?", ur: "کیا شرمگاہ چھونے سے وضو ٹوٹ جاتا ہے؟" }
question: { ar: "هل يجب الوضوء على من مسّ ذكره؟", en: "Must one who touches his private part renew his ablution?", ur: "کیا شرمگاہ چھونے والے پر وضو واجب ہے؟" }
issue: { ar: "تعارض حديث بسرة بنت صفوان «من مسّ ذكره فليتوضأ» وحديث طلق بن علي «هل هو إلا بضعة منه»، كما يعرضهما أبو داود والخطابي.", en: "The conflict between Busra bint Safwan's report 'whoever touches his private part, let him perform ablution' and Talq ibn 'Ali's 'is it anything but a piece of him?', as Abu Dawud and al-Khattabi present them." }
summary:
  ar: "روى أبو داود في «باب الوضوء من مس الذكر» حديث بسرة بنت صفوان «من مسّ ذكره فليتوضأ»، وفي «باب الرخصة في ذلك» حديث طلق «هل هو إلا مضغة منه أو بضعة منه»؛ ويحكي الخطابي أن الوضوء منه قول عمر وسعد وابن عمر وابن عباس وأبي هريرة والأوزاعي والشافعي وأحمد وإسحاق، وأن علياً وابن مسعود وعماراً وحذيفة وأبا الدرداء لم يروه ناقضاً وهو قول أبي حنيفة وأصحابه والثوري، وأن مالكاً جعله على الاستحباب {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 94-96}."
  en: "In the 'chapter on ablution after touching the private part' Abu Dawud gives Busra bint Safwan's report, 'whoever touches his private part, let him perform ablution', and in the 'chapter on the permission' Talq's report, 'is it anything but a morsel or piece of him?'; al-Khattabi relates that renewing ablution was the view of 'Umar, Sa'd, Ibn 'Umar, Ibn 'Abbas, Abu Hurayra, al-Awza'i, al-Shafi'i, Ahmad and Ishaq, that 'Ali, Ibn Mas'ud, 'Ammar, Hudhayfa and Abu al-Darda' did not consider it to break ablution — the view of Abu Hanifa, his companions and al-Thawri — and that Malik held it recommended {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 94-96}."
  ur: "ابو داؤد «شرمگاہ چھونے سے وضو کا باب» میں بسرہ بنت صفوان کی حدیث «جو اپنی شرمگاہ چھوئے وہ وضو کرے» اور «اس کی رخصت کا باب» میں طلق کی حدیث «وہ اس کے جسم کا ایک ٹکڑا ہی تو ہے» لاتے ہیں؛ خطابی بتاتے ہیں کہ وضو کا قول عمر، سعد، ابن عمر، ابن عباس، ابو ہریرہ، اوزاعی، شافعی، احمد اور اسحاق کا ہے، کہ علی، ابن مسعود، عمار، حذیفہ اور ابو الدرداء اسے ناقض نہیں سمجھتے تھے — اور یہی ابو حنیفہ، ان کے اصحاب اور ثوری کا قول ہے — اور مالک اسے مستحب قرار دیتے تھے {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 94-96}۔"
short_answer:
  ar: "ثلاثة أقوال عند أهل السنة كما يحكيها الخطابي: ينقض ⁦(الشافعي بباطن الكف، وأحمد والأوزاعي بأي موضع من اليد)⁩، لا ينقض ⁦(أبو حنيفة وأصحابه والثوري)⁩، يُستحب الوضوء منه ⁦(مالك)⁩."
  en: "Three Sunni views as al-Khattabi relates them: it breaks ablution (al-Shafi'i with the inside of the palm; Ahmad and al-Awza'i with any part of the hand), it does not (Abu Hanifa, his companions and al-Thawri), ablution is recommended (Malik)."
  ur: "خطابی کے بیان کے مطابق اہلِ سنت کے تین قول: وضو ٹوٹ جاتا ہے (شافعی: ہتھیلی کے اندرونی حصے سے؛ احمد اور اوزاعی: ہاتھ کے کسی حصے سے)، نہیں ٹوٹتا (ابو حنیفہ، ان کے اصحاب اور ثوری)، وضو مستحب ہے (مالک)۔"
perspectives:
  - tradition: sunni-shafii
    id: shafii-palm
    standing: main
    stance: { ar: "ينقض الوضوء إذا مسّه بباطن الكف", en: "It breaks ablution when touched with the inside of the palm" }
    summary: { ar: "مذهب الشافعي إيجاب الوضوء من مس الذكر، إلا أنه لا يرى نقض الطهارة إلا أن يمسه بباطن كفه؛ وهو قول جماعة من السلف منهم عمر وسعد بن أبي وقاص وابن عمر وابن عباس وأبو هريرة. ويحتجون بأن خبر بسرة متأخر لأن أبا هريرة رواه وهو متأخر الإسلام، وطلق قدم في أول الهجرة والمسجد يُبنى، وإنما يؤخذ بآخر الأمرين، ويتأولون خبر طلق على المس من وراء حائل.", en: "Al-Shafi'i requires ablution after touching the private part, but holds that purity is broken only when it is touched with the inside of the palm; this was held by early authorities including 'Umar, Sa'd ibn Abi Waqqas, Ibn 'Umar, Ibn 'Abbas and Abu Hurayra. They argue that Busra's report is the later one, since Abu Hurayra, a late convert, also related it, while Talq came at the beginning of the Hijra when the mosque was being built, and the later of two rulings is followed; they interpret Talq's report as touching through a barrier." }
    holders: [person/al-shafii, person/umar-ibn-al-khattab, person/saad-ibn-abi-waqqas, person/abdullah-ibn-umar, person/abdullah-ibn-abbas, person/abu-hurayra]
    sources: [source/sunan-abi-dawud-ibn-hazm-1997-v1]
  - tradition: sunni-hanbali
    id: ahmad-any-part
    standing: main
    stance: { ar: "ينقض بأي موضع من اليد", en: "It breaks ablution when touched with any part of the hand" }
    summary: { ar: "قال الأوزاعي وأحمد: إذا مسه بساعده أو بظهر كفه انتقض طهره كما لو مسه ببطن كفه سواء؛ وفي مناظرة أحمد ويحيى بن معين، كما يرويها الخطابي عن ابن المنذر، اتفقا على إسقاط الاحتجاج بخبري بسرة وطلق معاً، ثم احتج أحمد بأثر ابن عمر فلم يمكن يحيى دفعه.", en: "Al-Awza'i and Ahmad said that touching it with the forearm or the back of the hand breaks purity just as touching it with the palm does; in the discussion between Ahmad and Yahya ibn Ma'in, which al-Khattabi relates from Ibn al-Mundhir, the two agreed to set aside both reports, Busra's and Talq's, and then Ahmad argued from Ibn 'Umar's practice, which Yahya could not answer." }
    holders: [person/ahmad-ibn-hanbal, person/al-awzai-abd-al-rahman, person/ishaq-ibn-rahwayh]
    sources: [source/sunan-abi-dawud-ibn-hazm-1997-v1]
  - tradition: sunni-hanafi
    id: hanafi-no
    standing: main
    stance: { ar: "لا ينقض الوضوء", en: "It does not break ablution" }
    summary: { ar: "كان علي بن أبي طالب وعبد الله بن مسعود وعمار وحذيفة وأبو الدرداء لا يرون مسه ناقضاً للطهر، وإليه ذهب أبو حنيفة وأصحابه، وهو قول سفيان الثوري؛ ودليلهم حديث طلق بن علي: «وهل هو إلا مضغة منه أو بضعة منه».", en: "'Ali ibn Abi Talib, 'Abd Allah ibn Mas'ud, 'Ammar, Hudhayfa and Abu al-Darda' did not consider touching it to break purity; Abu Hanifa and his companions followed this, and it was the view of Sufyan al-Thawri; their evidence is Talq ibn 'Ali's report, 'is it anything but a morsel or piece of him?'" }
    holders: [person/abu-hanifa, person/sufyan-al-thawri, person/ali-ibn-abi-talib, person/abdullah-ibn-masud, person/ammar-ibn-yasir, person/hudhayfa-ibn-al-yaman, person/abu-al-darda]
