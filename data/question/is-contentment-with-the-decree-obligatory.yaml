id: question/is-contentment-with-the-decree-obligatory
class: question
label: { ar: "هل الرضا بالقضاء واجب أم مستحب؟", en: "Is contentment with God's decree obligatory or recommended?", ur: "کیا قضا پر رضا واجب ہے یا مستحب؟", es: "¿Es obligatorio o recomendable estar conforme con el decreto de Dios?", fr: "L’acceptation du décret divin est-elle obligatoire ou recommandée ?", tr: "Yargıya rıza vermek zorunlu mu yoksa tavsiye edilen mi?", id: "Apakah memberikan persetujuan kepada pengadilan wajib atau disarankan?" }
summary:
  ar: "يحكي ابن تيمية أن العلماء والمشايخ من أصحاب أحمد وغيرهم تنازعوا في الرضا بالقضاء على قولين: واجب فيكون من أعمال المقتصدين، أو مستحب فيكون من أعمال المقربين؛ ويرى أن القرآن لم يأت إلا بمدح الراضين بالمصائب لا بإيجاب ذلك، وأن الرضا بما أمر الله به واجب، وأن الرضا بالمنهيات لا يشرع عند أكثر العلماء."
  en: "Ibn Taymiyya reports that the scholars and shaykhs of Ahmad's school and others disputed over contentment with the decree in two views: obligatory, making it a work of those who keep the middle way, or recommended, making it a work of those brought near. He holds that the Qur'an only praises those content with calamities and does not require it, that contentment with what God commands is obligatory, and that most scholars hold contentment with forbidden things is not lawful."
  es: "Ibn Taymiyya relata que los eruditos y jeques de la escuela de Ahmad y otras escuelas debatieron sobre la conformidad con el decreto divino, adoptando dos posturas: obligatoria, considerándola una práctica de quienes siguen el camino medio, o recomendable, considerándola una práctica de quienes se acercan a Dios. Sostiene que el Corán solo alaba a quienes se contentan con las calamidades y no lo exige; que la conformidad con lo que Dios ordena es obligatoria; y que la mayoría de los eruditos consideran que la conformidad con lo prohibido no es lícita."
  fr: "Ibn Taymiyya rapporte que les savants et les cheikhs de l'école d'Ahmad, ainsi que d'autres, ont débattu de la question de l'acceptation du décret selon deux points de vue: soit l'acceptation était obligatoire, l'incitant à suivre la voie du juste milieu, soit elle était recommandée, l'incitant à se rapprocher de Dieu. Il soutient que le Coran ne fait que louer ceux qui acceptent les épreuves sans l'exiger, que l'acceptation des commandements divins est obligatoire et que la plupart des savants considèrent que l'acceptation des choses interdites est illicite."
  ur: "ابن تیمیہ کا بیان ہے کہ مکتب احمد کے علماء اور شیوخ اور دیگر نے اس فرمان پر قناعت کے بارے میں دو باتوں میں اختلاف کیا ہے: واجب، اس کو درمیانی راستہ اختیار کرنے والوں کا کام بنانا، یا مستحب، مقربوں کا کام بنانا۔ اس کا خیال ہے کہ قرآن صرف مصیبتوں کے ساتھ ان کی تعریف کرتا ہے اور اس کا تقاضا نہیں کرتا، خدا کے حکم پر قناعت واجب ہے، اور اکثر علماء حرام چیزوں پر قناعت کرتے ہیں، یہ جائز نہیں ہے۔"
  tr: "İbn Teymiyye, Ahmed'in sahabelerinden ve diğerlerinden alimler ve şeyhlerin fermanın kabulüne iki görüşle karşı çıktığını rivayet eder: zorunlu, yani ılımlıların eylemleri arasında yer alır, ya da yakınlarının eylemleri arasında tavsiye edilir; Kur'an'ın sadece felaketlerle yetinenleri övmek için geldiğine, onları zorunlu kılmak için değil, Allah'ın emriyle yetinmenin zorunlu olduğuna ve yasakların kabulünün çoğu alimin tarafından yasalaştırılmadığına inanır."
  id: "Ibn Taymiyyah menceritakan bahwa para ulama dan sheikh dari para sahabat Ahmad dan lainnya memperdebatkan penerimaan titah tersebut berdasarkan dua pendapat: wajib, sehingga itu termasuk dalam tindakan kaum moderat, atau direkomendasikan karena merupakan tindakan mereka yang dekat dengan mereka; ia percaya bahwa Al-Qur'an hanya datang untuk memuji mereka yang puas dengan bencana, bukan untuk mewajibkan mereka, dan bahwa puas dengan apa yang Allah perintahkan adalah kewajiban, dan bahwa penerimaan larangan tidak diatur oleh undang-undang menurut sebagian besar ulama."
question: { ar: "هل الرضا بالقضاء واجب أم مستحب؟", en: "Is contentment with God's decree obligatory or recommended?", ur: "کیا قضا پر رضا واجب ہے یا مستحب؟" }
issue: { ar: "حكم الرضا بما يقضيه الله على العبد من المصائب، والفرق بينه وبين الرضا بالمأمورات والرضا بالمنهيات.", en: "The ruling on contentment with the calamities God decrees for the servant, and how it differs from contentment with what is commanded and with what is forbidden.", ur: "اللہ کی طرف سے بندے پر مقدر مصائب پر رضا کا حکم، اور اس کا مامورات اور ممنوعات پر رضا سے فرق۔" }
short_answer:
  ar: "قولان في أصحاب أحمد وغيرهم: الوجوب والاستحباب. ابن تيمية: الرضا بالمصائب ممدوح غير واجب، والصبر عليها واجب؛ والرضا بالمأمور واجب؛ والرضا بالمنهيات لا يشرع."
  en: "Two views among Ahmad's school and others: obligatory and recommended. Ibn Taymiyya: contentment with calamities is praised but not obligatory, while patience with them is obligatory; contentment with what is commanded is obligatory; contentment with forbidden things is not lawful."
  ur: "احمد کے اصحاب وغیرہ میں دو قول: وجوب اور استحباب۔ ابن تیمیہ: مصائب پر رضا قابلِ تعریف ہے واجب نہیں، اور ان پر صبر واجب ہے؛ مامور پر رضا واجب ہے؛ ممنوعات پر رضا مشروع نہیں۔"
