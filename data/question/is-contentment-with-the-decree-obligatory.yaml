id: question/is-contentment-with-the-decree-obligatory
class: question
label: { ar: "هل الرضا بالقضاء واجب أم مستحب؟", en: "Is contentment with God's decree obligatory or recommended?", ur: "کیا قضا پر رضا واجب ہے یا مستحب؟" }
summary:
  ar: "يحكي ابن تيمية أن العلماء والمشايخ من أصحاب أحمد وغيرهم تنازعوا في الرضا بالقضاء على قولين: واجب فيكون من أعمال المقتصدين، أو مستحب فيكون من أعمال المقربين؛ ويرى أن القرآن لم يأت إلا بمدح الراضين بالمصائب لا بإيجاب ذلك، وأن الرضا بما أمر الله به واجب، وأن الرضا بالمنهيات لا يشرع عند أكثر العلماء."
  en: "Ibn Taymiyya reports that the scholars and shaykhs of Ahmad's school and others disputed over contentment with the decree in two views: obligatory, making it a work of those who keep the middle way, or recommended, making it a work of those brought near. He holds that the Qur'an only praises those content with calamities and does not require it, that contentment with what God commands is obligatory, and that most scholars hold contentment with forbidden things is not lawful."
question: { ar: "هل الرضا بالقضاء واجب أم مستحب؟", en: "Is contentment with God's decree obligatory or recommended?", ur: "کیا قضا پر رضا واجب ہے یا مستحب؟" }
issue: { ar: "حكم الرضا بما يقضيه الله على العبد من المصائب، والفرق بينه وبين الرضا بالمأمورات والرضا بالمنهيات.", en: "The ruling on contentment with the calamities God decrees for the servant, and how it differs from contentment with what is commanded and with what is forbidden.", ur: "اللہ کی طرف سے بندے پر مقدر مصائب پر رضا کا حکم، اور اس کا مامورات اور ممنوعات پر رضا سے فرق۔" }
short_answer:
  ar: "قولان في أصحاب أحمد وغيرهم: الوجوب والاستحباب. ابن تيمية: الرضا بالمصائب ممدوح غير واجب، والصبر عليها واجب؛ والرضا بالمأمور واجب؛ والرضا بالمنهيات لا يشرع."
  en: "Two views among Ahmad's school and others: obligatory and recommended. Ibn Taymiyya: contentment with calamities is praised but not obligatory, while patience with them is obligatory; contentment with what is commanded is obligatory; contentment with forbidden things is not lawful."
  ur: "احمد کے اصحاب وغیرہ میں دو قول: وجوب اور استحباب۔ ابن تیمیہ: مصائب پر رضا قابلِ تعریف ہے واجب نہیں، اور ان پر صبر واجب ہے؛ مامور پر رضا واجب ہے؛ ممنوعات پر رضا مشروع نہیں۔"
