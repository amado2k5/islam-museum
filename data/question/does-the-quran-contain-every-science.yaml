id: question/does-the-quran-contain-every-science
class: question
label:
  ar: "هل اشتمل القرآن على أصول كل العلوم؟"
  en: "Does the Qur'an contain the roots of every science?"
  ur: "کیا قرآن ہر علم کی اصل پر مشتمل ہے؟"
summary:
  ar: "نقل الزركشي في أول البرهان عن أبي بكر بن العربي أن علوم القرآن تبلغ عدد كلمه مضروبًا في أربعة، وقال السيوطي في نوع «العلوم المستنبطة من القرآن» إن كتاب الله اشتمل على كل شيء، فما من باب ولا مسألة هي أصل إلا وفي القرآن ما يدل عليها؛ وتنقد رسالة ماجستير بجامعة الإسكندرية هذا الرأي وترى في القرآن إشارات مجملة لا نظريات علمية."
  en: "At the start of al-Burhan al-Zarkashi's tradition of counting the Qur'anic sciences goes back to Abu Bakr ibn al-Arabi, who numbered them as the Qur'an's words times four; al-Suyuti, in the type 'sciences derived from the Qur'an', says God's Book contains everything, so that there is no root chapter or question of any science without something in the Qur'an pointing to it; an Alexandria University MA thesis criticises this view, seeing in the Qur'an broad indications rather than scientific theories."
  ur: "البرہان کے آغاز میں زرکشی کے ہاں علومِ قرآن کی گنتی ابو بکر ابن العربی تک جاتی ہے، جنہوں نے انہیں قرآن کے کلمات کی تعداد ضرب چار شمار کیا؛ سیوطی «قرآن سے مستنبط علوم» کی نوع میں کہتے ہیں کہ کتاب اللہ ہر چیز پر مشتمل ہے، اور کسی علم کا کوئی بنیادی باب یا مسئلہ ایسا نہیں جس پر قرآن میں دلالت نہ ہو؛ جامعہ اسکندریہ کا ایک ایم اے مقالہ اس رائے پر تنقید کرتا ہے اور قرآن میں علمی نظریات کے بجائے مجمل اشارات دیکھتا ہے۔"
question:
  ar: "هل في القرآن أصول العلوم كلها، ومنها علوم الطبيعة والصنائع؟"
  en: "Are the roots of all sciences, including the natural sciences and crafts, in the Qur'an?"
  ur: "کیا قرآن میں تمام علوم کی اصل ہے، بشمول طبعی علوم اور صنعتوں کے؟"
short_answer:
  ar: "يرى السيوطي أن القرآن اشتمل على كل شيء من أصول العلوم؛ وترى الدراسة الأكاديمية المذكورة أنه تشريع فيه إشارات مجملة تدل على إعجازه لا كتاب علم تؤخذ منه كل العلوم."
  en: "Al-Suyuti holds that the Qur'an contains the roots of every science; the academic study cited holds that it is guidance containing broad indications that show its inimitability, not a book of science from which every science is taken."
  ur: "سیوطی کے نزدیک قرآن ہر علم کی اصل پر مشتمل ہے؛ مذکورہ علمی مطالعے کے نزدیک یہ ہدایت ہے جس میں مجمل اشارات اس کے اعجاز پر دلالت کرتے ہیں، نہ کہ علم کی ایسی کتاب جس سے تمام علوم لیے جائیں۔"
