  - tradition: sunni
    id: ibn-al-arabi-count
    standing: secondary
    stance: { ar: "علوم القرآن لا تُحصى، وأصولها توحيد وتذكير وأحكام", en: "The Qur'anic sciences are countless; their roots are divine unity, reminder and rulings", ur: "علومِ قرآن بے شمار ہیں؛ ان کی اصل توحید، تذکیر اور احکام ہے" }
    summary:
      ar: "في تقديم محمد رزق ساطور لطبعة دار الحديث: ذكر القاضي أبو بكر بن العربي في «قانون التأويل» أن علوم القرآن خمسون علمًا وأربعمائة وسبعة آلاف وسبعون ألفًا على عدد كلم القرآن مضروبة في أربعة، وأن علومه ثلاثة أقسام: توحيد وتذكير وأحكام؛ وبكلمته بدأ الزركشي البرهان {cite:burhan-dar-al-hadith-2006 p.11}."
      en: "In Muhammad Rizq Satur's foreword to the Dar al-Hadith edition: al-Qadi Abu Bakr ibn al-Arabi said in Qanun al-Ta'wil that the Qur'anic sciences number 77,450, the count of the Qur'an's words multiplied by four, and that they fall into three divisions: divine unity, reminder and rulings; al-Zarkashi opened al-Burhan with his words {cite:burhan-dar-al-hadith-2006 p.11}."
      ur: "دار الحدیث ایڈیشن پر محمد رزق ساطور کے پیش لفظ میں: قاضی ابو بکر ابن العربی نے «قانون التاویل» میں کہا کہ علومِ قرآن 77450 ہیں، قرآن کے کلمات کی تعداد ضرب چار، اور ان کی تین قسمیں ہیں: توحید، تذکیر اور احکام؛ زرکشی نے البرہان کا آغاز انہی کے قول سے کیا {cite:burhan-dar-al-hadith-2006 p.11}۔"
    sources: [source/burhan-dar-al-hadith-2006]
  - tradition: academic
    id: thesis-critique
    standing: main
    stance: { ar: "في القرآن إشارات مجملة تدل على إعجازه، لا نظريات علمية", en: "The Qur'an has broad indications showing its inimitability, not scientific theories", ur: "قرآن میں مجمل اشارات ہیں جو اعجاز پر دال ہیں، نہ کہ علمی نظریات" }
    summary:
      ar: "ترى ليلى محمد مسعود أن السيوطي لم يكن موفقًا في هذا الرأي، فالقرآن تشريع للمسلمين، وفي آياته إشارات مجملة قد يُفهم بعضها مبادئ للعلوم، لا نظريات علمية قد تصح يومًا وتتغير يومًا؛ وطالب الطب والهندسة والصنائع لا يكتفي بتلاوة القرآن عن البحث عنها عند أربابها، وما وُجد من إشارة إلى مسلّمة علمية فهو دليل على إعجازه لا على أنه كتاب علم {cite:thaqafat-al-mufassir-zarkashi-alexandria p.146}."
      en: "Layla Muhammad Mas'ud judges that al-Suyuti was not well advised in this view: the Qur'an is law and guidance for Muslims, and its verses hold broad indications, some of which may be read as principles of the sciences, not scientific theories that may hold one day and change the next; a student of medicine, engineering or the crafts cannot do without seeking them from their practitioners, and any indication of an established scientific fact is evidence of its inimitability, not of its being a book of science {cite:thaqafat-al-mufassir-zarkashi-alexandria p.146}."
      ur: "لیلیٰ محمد مسعود کے نزدیک سیوطی اس رائے میں درست نہیں: قرآن مسلمانوں کے لیے شریعت ہے، اس کی آیات میں مجمل اشارات ہیں جن میں سے بعض کو علوم کے مبادی سمجھا جا سکتا ہے، نہ کہ علمی نظریات جو کبھی درست اور کبھی بدل جائیں؛ طب، ہندسہ اور صنعتوں کا طالب علم انہیں ان کے ماہرین سے حاصل کیے بغیر قرآن کی تلاوت پر اکتفا نہیں کر سکتا، اور کسی مسلمہ علمی حقیقت کی طرف اشارہ اس کے اعجاز کی دلیل ہے، نہ کہ اس کے علمی کتاب ہونے کی {cite:thaqafat-al-mufassir-zarkashi-alexandria p.146}۔"
    sources: [source/thaqafat-al-mufassir-zarkashi-alexandria]
