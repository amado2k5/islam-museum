  - tradition: sunni
    id: suyuti-everything
    standing: main
    stance: { ar: "اشتمل كتاب الله على كل شيء من أصول العلوم", en: "God's Book contains every root of the sciences", ur: "کتاب اللہ علوم کی ہر اصل پر مشتمل ہے" }
    summary:
      ar: "ينقل البحث عن الإتقان قول السيوطي: «قد اشتمل كتاب الله العزيز على كل شيء؛ أما أنواع العلوم فليس منها باب ولا مسألة هي أصل إلا وفي القرآن ما يدل عليها»، ويذكر أنه عدّ فيه عجائب المخلوقات وبدء الخلق وأخبار الأمم وشعب الإيمان وأنواع الكبائر {cite:thaqafat-al-mufassir-zarkashi-alexandria p.145} {cite:thaqafat-al-mufassir-zarkashi-alexandria p.146}."
      en: "The thesis quotes al-Suyuti in al-Itqan: 'God's mighty Book contains everything; as for the kinds of sciences, there is no chapter or root question of them without something in the Qur'an pointing to it', and notes that he counted in it the wonders of creation, the beginning of creation, the reports of past nations, the branches of faith and the kinds of major sins {cite:thaqafat-al-mufassir-zarkashi-alexandria p.145} {cite:thaqafat-al-mufassir-zarkashi-alexandria p.146}."
      ur: "مقالہ الاتقان سے سیوطی کا قول نقل کرتا ہے: «کتاب اللہ ہر چیز پر مشتمل ہے؛ رہیں علوم کی انواع، تو ان کا کوئی باب یا بنیادی مسئلہ ایسا نہیں جس پر قرآن میں دلالت نہ ہو»، اور بتاتا ہے کہ انہوں نے اس میں عجائبِ مخلوقات، آغازِ تخلیق، گزشتہ امتوں کی خبریں، شعبِ ایمان اور کبائر کی انواع شمار کیں {cite:thaqafat-al-mufassir-zarkashi-alexandria p.145} {cite:thaqafat-al-mufassir-zarkashi-alexandria p.146}۔"
