  en: "The Ottoman Empire was a Turkish Islamic sultanate that lasted six centuries, 1299–1922; it peaked with the conquest of Constantinople in 1453 and the reign of Suleiman the Lawgiver."
  es: "El Imperio Otomano fue un sultanato turco islámico que duró seis siglos, de 1299 a 1922; alcanzó su apogeo con la conquista de Constantinopla en 1453 y el reinado de Solimán el Legislador."
  fr: "L'Empire ottoman était un sultanat islamique turc qui a duré six siècles, de 1299 à 1922; son apogée fut atteint avec la conquête de Constantinople en 1453 et le règne de Soliman le Législateur."
question:
  ar: ما الدولة العثمانية؟
short_answer:
  ar: الدولة العثمانية سلطنة إسلامية تركية استمرت ستة قرون 1299–1922؛ بلغت ذروتها في فتح القسطنطينية 1453
    وحكم سليمان القانوني.
long_answer:
  ar: الدولة العثمانية من أطول دول الإسلام عمرًا؛ قام بها عثمان بن أرطغرل في الأناضول 1299، ففتحت القسطنطينية
    1453 وبلغت من الجزائر إلى اليمن ومن فيينا إلى مكة. ألغيت الخلافة منها 1924 وحلت محلها الجمهورية التركية.
