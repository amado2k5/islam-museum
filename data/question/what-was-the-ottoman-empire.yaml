long_answer:
  ar: الدولة العثمانية من أطول دول الإسلام عمرًا؛ قام بها عثمان بن أرطغرل في الأناضول 1299، ففتحت القسطنطينية
    1453 وبلغت من الجزائر إلى اليمن ومن فيينا إلى مكة. ألغيت الخلافة منها 1924 وحلت محلها الجمهورية التركية.
