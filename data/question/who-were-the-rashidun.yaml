long_answer:
  ar: 'الراشدون هم الخلفاء الأربعة الأوائل بعد وفاة النبي: [[person/abu-bakr-al-siddiq|أبو بكر الصديق]]
    الذي وحّد الردة، ف[[person/umar-ibn-al-khattab|عمر بن الخطاب]] فاتح الأمصار وصاحب الدواوين، ف[[person/uthman-ibn-affan|عثمان
    بن عفان]] جامع المصحف، ف[[person/ali-ibn-abi-talib|علي بن أبي طالب]] وبه انتهى العهد الراشدي. {cite:wikidata}'
