question:
  ar: ما المسجد؟
short_answer:
  ar: المسجد هو بيت عبادة المسلمين الجامع؛ أوله مسجد قباء ثم مسجد النبي، وتجمع فيه الصلوات والتعليم والاجتماع
    والقضاء عبر التاريخ.
long_answer:
  ar: المسجد هو بيت العبادة الجامع للمسلمين؛ أول مسجد بُني في الإسلام مسجد قباء ثم مسجد النبي بالمدينة.
    تكوّن المسجد التاريخي من المصلى المقبّل وجدار القبلة والمحراب والمنبر والصحن والمنارة، ودار فيه التعليم
    والفتوى والاجتماع الأهلي. يقود الصلاة فيه [[concept/imam-masjid|الإمام]] ويرفع الأذان فيه [[concept/muezzin|المؤذن]].
    {cite:wikidata}
