id: question/what-is-mosque
class: question
label:
  ar: ما المسجد؟
  en: What is the mosque?
  es: "¿Qué es la mezquita?"
  fr: "Qu'est-ce qu'une mosquée ?"
  ur: "مسجد کیا ہے؟"
summary:
  ar: المسجد هو بيت عبادة المسلمين الجامع؛ أوله مسجد قباء ثم مسجد النبي، وتجمع فيه الصلوات والتعليم والاجتماع
    والقضاء عبر التاريخ.
  en: "The mosque is the congregational house of worship of the Muslims. The first was the Quba Mosque, then the Mosque of the Prophet. Throughout history, prayer, teaching, assembly and judgement have all been held in it."
  es: "La mezquita es el lugar de culto colectivo de los musulmanes. La primera fue la Mezquita de Quba, seguida de la Mezquita del Profeta. A lo largo de la historia, en ella se han celebrado oraciones, enseñanzas, asambleas y juicios."
  fr: "La mosquée est le lieu de culte communautaire des musulmans. La première fut la mosquée de Quba, puis la mosquée du Prophète. De tout temps, la prière, l'enseignement, les réunions et les jugements s'y sont déroulés."
  ur: "مسجد مسلمانوں کی اجتماعی عبادت گاہ ہے۔ پہلے مسجد قبا، پھر مسجد نبوی۔ پوری تاریخ میں، نماز، تعلیم، مجلس اور فیصلہ سب اس میں ہوتے رہے ہیں۔"
question:
  ar: ما المسجد؟
short_answer:
  ar: المسجد هو بيت عبادة المسلمين الجامع؛ أوله مسجد قباء ثم مسجد النبي، وتجمع فيه الصلوات والتعليم والاجتماع
    والقضاء عبر التاريخ.
long_answer:
  ar: المسجد هو بيت العبادة الجامع للمسلمين؛ أول مسجد بُني في الإسلام مسجد قباء ثم مسجد النبي بالمدينة.
    تكوّن المسجد التاريخي من المصلى المقبّل وجدار القبلة والمحراب والمنبر والصحن والمنارة، ودار فيه التعليم
    والفتوى والاجتماع الأهلي. يقود الصلاة فيه [[concept/imam-masjid|الإمام]] ويرفع الأذان فيه [[concept/muezzin|المؤذن]].
    {cite:wikidata}
