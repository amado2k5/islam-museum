id: question/what-are-angels
class: question
label:
  ar: ما الملائكة؟
  en: What are angels?
  es: "¿Qué son los ángeles?"
  fr: "Que sont les anges ?"
  ur: "فرشتے کیا ہیں؟"
  tr: "Melekler kimdir?"
  id: "Siapakah malaikat?"
summary:
  ar: الملائكة عباد الله من نور ينفذون أوامره؛ منهم جبرائيل بالوحي وميكائيل بالرزق وإسرافيل بالصور وملك
    الموت وحراس النار والجنة.
  en: "The angels are servants of God made of light who carry out His commands. They include Jibril, charged with revelation; Mika'il, charged with provision; Israfil, charged with the trumpet; the Angel of Death; and the guardians of the Fire and of Paradise."
  es: "Los ángeles son siervos de Dios, hechos de luz, que ejecutan Sus mandamientos. Entre ellos se encuentran Jibril, encargado de la revelación; Mika'il, encargado de la provisión; Israfil, encargado de la trompeta; el Ángel de la Muerte; y los guardianes del Fuego y del Paraíso."
  fr: "Les anges sont des serviteurs de Dieu faits de lumière qui exécutent ses ordres. Parmi eux figurent Jibril, chargé de la révélation; Mikaïl, chargé de pourvoir aux besoins; Israfil, chargé du son de la trompette; l’Ange de la Mort; et les gardiens du Feu et du Paradis."
  ur: "فرشتے نور سے بنے خدا کے بندے ہیں جو اس کے احکام پر عمل کرتے ہیں۔ ان میں جبریل بھی شامل ہیں، جن پر وحی کا الزام ہے۔ میکائیل، رزق کا الزام؛ اسرافیل، صور کا الزام؛ موت کا فرشتہ؛ اور آگ اور جنت کے محافظ۔"
  tr: "Melekler, Tanrı'nın emirlerini yerine getiren hizmetkârlarıdır; aralarında vahiyle Cebrail, erzakla Mikail, lastiklerle İsrafil, Ölüm Meleği ve Cehennem ile Cennet'in koruyucuları vardır."
  id: "Para malaikat adalah hamba Allah yang melaksanakan perintah-Nya; di antara mereka adalah Gabriel melalui wahyu, Mikhael melalui perbekalan makanan, Israel melalui ban, Malaikat Maut, dan penjaga Neraka serta Surga."
question:
  ar: ما الملائكة؟
short_answer:
  ar: الملائكة عباد الله من نور ينفذون أوامره؛ منهم جبرائيل بالوحي وميكائيل بالرزق وإسرافيل بالصور وملك
    الموت وحراس النار والجنة.
long_answer:
  ar: الملائكة من الغيب المؤمن به في الإسلام؛ خلقهم الله من نور لا يعصونه فيما أمرهم ويفعلون ما يؤمرون.
    منهم جبريل أمين الوحي وميكائيل وإسرافيل وملك الموت ومونكر ونكير وحملة العرش. {cite:wikidata}
