question:
  ar: هل يجوز بناء الحكم على مصلحة مناسبة لم يشهد لها أصل معين من الكتاب أو السنة أو الإجماع؟
  en: May a ruling be built on a suitable interest that no specific base in the Book, the sunna or consensus attests?
  ur: کیا کسی ایسی مناسب مصلحت پر حکم کی بنیاد رکھی جا سکتی ہے جس کی کتاب، سنت یا اجماع میں کوئی معین اصل گواہی نہ دے؟
issue:
  ar: حجية الاستدلال المرسل (المصالح التي لا يشهد لها أصل معين) وضوابطه.
  en: Whether unattested interests are a proof, and on what conditions.
  ur: مرسل مصالح کی حجیت اور اس کی شرائط۔
short_answer:
  ar: 'ثلاثة مذاهب بحسب الجويني: الرد (الباقلاني)، والأخذ المطلق (منسوب إلى مالك)، والأخذ بشرط القرب من معاني الأصول (الشافعي ومعظم الحنفية)، وهو الذي يرتضيه الجويني.'
  en: 'Three positions according to al-Juwayni: rejection (al-Baqillani), unrestricted acceptance (attributed to Malik), and acceptance if close to the meanings of the bases (al-Shafi''i and most Hanafis), which al-Juwayni himself endorses.'
  ur: 'جوینی کے مطابق تین مذاہب: رد (باقلانی)، مطلق قبول (مالک کی طرف منسوب)، اور اصول کے معانی سے قرب کی شرط پر قبول (شافعی اور اکثر حنفیہ)، جسے جوینی خود پسند کرتے ہیں۔'
perspectives:
- tradition: sunni
  id: sunni-shafii-taqrib
  standing: main
  stance:
    ar: يُحتج به بشرط قربه من معاني الأصول الثابتة
    en: It is a proof if close to the meanings of established bases
    ur: یہ حجت ہے بشرطیکہ ثابت اصول کے معانی سے قریب ہو
  summary:
    ar: 'ينسبه الجويني إلى الشافعي ومعظم أصحاب أبي حنيفة: يعتمدون الاستدلال وإن لم يستند إلى حكم متفق عليه في أصل، لكن لا يجيزون البعد والإفراط، وإنما يعلقون الأحكام بمصالح شبيهة بالمصالح المعتبرة وفاقاً؛ واستدل الشافعي بأنه لا تخلو واقعة عن حكم الله، وأن المنصوصات ومعانيها لا تقع من متسع الشريعة إلا «غرفة من بحر»، وأن الصحابة كانوا يخوضون في وجوه الرأي من غير طلب الأصول.'
    en: 'Al-Juwayni ascribes it to al-Shafi''i and most followers of Abu Hanifa: they rely on inference even without an agreed base, but do not allow remoteness or excess, attaching rulings only to interests resembling those agreed to be valid; al-Shafi''i argued that no event lacks a ruling of God, that the texts and their meanings are only "a handful from the sea" of the law, and that the Companions reasoned without seeking bases.'
    ur: 'جوینی اسے شافعی اور اکثر حنفیہ کی طرف منسوب کرتے ہیں: وہ استدلال پر اعتماد کرتے ہیں خواہ کسی اصل میں متفق علیہ حکم پر مستند نہ ہو، مگر دوری اور افراط کی اجازت نہیں دیتے، اور احکام کو صرف ان مصالح سے وابستہ کرتے ہیں جو بالاتفاق معتبر مصالح سے مشابہ ہوں؛ شافعی نے استدلال کیا کہ کوئی واقعہ اللہ کے حکم سے خالی نہیں، کہ نصوص اور ان کے معانی شریعت کی وسعت میں «سمندر سے ایک چلو» ہیں، اور صحابہ اصول تلاش کیے بغیر رائے کے وجوہ میں غور کرتے تھے۔'
