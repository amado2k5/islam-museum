id: question/is-unattested-inference-istidlal-a-proof
class: question
label:
  ar: هل يُحتج بالاستدلال المرسل (المصلحة غير المستندة إلى أصل)؟
  en: Is unattested inference (istidlal, a ruling on an interest with no specific base) a valid proof?
  ur: کیا مرسل استدلال (کسی معین اصل سے غیر مستند مصلحت) حجت ہے؟
summary:
  ar: 'مسألة يعقد لها إمام الحرمين الجويني «كتاب الاستدلال» في «البرهان»، ويعرّف الاستدلال بأنه معنى مشعر بالحكم مناسب له فيما يقتضيه الفكر العقلي من غير وجدان أصل متفق عليه؛ ويحكي فيه ثلاثة مذاهب: رده عند القاضي الباقلاني وطوائف من متكلمي الأصحاب، والأخذ به مطلقاً منسوباً إلى مالك، والأخذ به بشرط قربه من معاني الأصول الثابتة وهو عنده المعروف من مذهب الشافعي ومعظم أصحاب أبي حنيفة {cite:burhan-juwayni-mostafa p. 674} {cite:burhan-juwayni-mostafa p. 675}.'
  en: 'A question to which Imam al-Haramayn al-Juwayni devotes the book of inference in al-Burhan, defining istidlal as a meaning that suggests and suits a ruling to rational reflection without an agreed base; he reports three positions: rejection, by al-Qadi al-Baqillani and groups of the Ash''ari theologians; acceptance without restriction, attributed to Malik; and acceptance on condition that it be close to the meanings of established bases, which he calls the known position of al-Shafi''i and most followers of Abu Hanifa.'
  ur: 'ایک مسئلہ جس کے لیے امام الحرمین جوینی «البرہان» میں «کتاب الاستدلال» باندھتے ہیں؛ وہ استدلال کی تعریف یوں کرتے ہیں: ایسا معنی جو عقلی غور و فکر کے مطابق حکم کی طرف اشارہ کرے اور اس کے مناسب ہو، بغیر کسی متفق علیہ اصل کے؛ اور تین مذاہب نقل کرتے ہیں: قاضی باقلانی اور اصحاب کے متکلمین کے گروہوں کے نزدیک اس کا رد؛ مالک کی طرف منسوب مطلق قبول؛ اور اس شرط پر قبول کہ وہ ثابت اصول کے معانی سے قریب ہو، جو ان کے نزدیک شافعی اور اکثر حنفیہ کا معروف مذہب ہے۔'
