- tradition: sunni
  id: sunni-baqillani-radd
  standing: secondary
  stance:
    ar: لا يُحتج به، ويُقتصر على المعنى الذي له أصل
    en: It is not a proof; only meanings with a base count
    ur: یہ حجت نہیں؛ صرف وہ معنی معتبر ہے جس کی اصل ہو
  summary:
    ar: 'مذهب القاضي الباقلاني وطوائف من متكلمي الأصحاب كما يحكيه الجويني: احتج بأن الكتاب والسنة والإجماع والقياس المستند إليها هي المتلقاة بالقبول، وأن المعاني إذا لم تُضبط بالأصول اتسع الأمر ورجع الشرع إلى اتباع وجوه الرأي وحكمة الحكماء، واختلف باختلاف الزمان والمكان.'
    en: 'The position of al-Qadi al-Baqillani and groups of the school''s theologians, as al-Juwayni reports: he argued that the Book, the sunna, consensus and analogy based on them are what is accepted, and that meanings not bounded by bases would let the law dissolve into following opinion and the wisdom of sages, varying with time and place.'
    ur: 'قاضی باقلانی اور اصحاب کے متکلمین کے گروہوں کا مذہب، جیسا کہ جوینی نقل کرتے ہیں: ان کی دلیل یہ ہے کہ کتاب، سنت، اجماع اور ان پر مبنی قیاس ہی مقبول ہیں، اور اگر معانی اصول سے منضبط نہ ہوں تو معاملہ پھیل جائے گا اور شریعت رائے کے وجوہ اور حکما کی حکمت کی پیروی بن جائے گی، جو زمان و مکان کے ساتھ بدلے گی۔'
