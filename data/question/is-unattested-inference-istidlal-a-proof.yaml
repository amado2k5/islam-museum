  id: sunni-malik-itlaq
  standing: secondary
  stance:
    ar: يُحتج بوجوه الاستصلاح قربت من النص أو بعدت (كما ينسبه الجويني إلى مالك)
    en: Interests count whether near to or far from the texts (as al-Juwayni attributes to Malik)
    ur: استصلاح کے وجوہ معتبر ہیں، نص سے قریب ہوں یا دور (جیسا کہ جوینی مالک کی طرف منسوب کرتے ہیں)
  summary:
    ar: ينسب الجويني إلى مالك القول بجواز اتباع وجوه الاستصلاح قربت من موارد النص أو بعدت ما لم يصد عنها أصل، ويصفه بأنه «أفرط» في ذلك فأثبت مصالح بعيدة عن المألوف، ويقيد ذلك بقوله «إن صح ما روي عنه». وهذا وصف الجويني لمذهب مالك لا عرض المالكية لمذهبهم، ولم يُذكر هنا كلام المالكية من كتبهم.
    en: Al-Juwayni attributes to Malik the view that interests may be followed whether near to or far from the texts, so long as no base excludes them, and describes him as having "gone to excess", affirming interests remote from the familiar; he qualifies this with "if what is reported of him is sound". This is al-Juwayni's characterisation of Malik's school, not the Malikis' own account, which is not given here.
    ur: جوینی مالک کی طرف یہ قول منسوب کرتے ہیں کہ استصلاح کے وجوہ کی پیروی جائز ہے، خواہ نص کے مواقع سے قریب ہوں یا دور، جب تک کوئی اصل انہیں نہ روکے، اور انہیں اس میں «افراط» کرنے والا کہتے ہیں کہ انہوں نے مانوس سے دور مصالح ثابت کیں؛ اور اسے «اگر ان سے مروی بات صحیح ہو» سے مقید کرتے ہیں۔ یہ مالک کے مذہب کی جوینی کی تصویر ہے، مالکیہ کا اپنا بیان نہیں، جو یہاں نہیں دیا گیا۔
