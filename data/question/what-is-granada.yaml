long_answer:
  ar: '[[place/granada|غرناطة]] آخر معاقل الأندلس؛ حكمها بنو نصر وبنوا الحمراء والعامرة والبستان؛ قاومت
    قرنين ونصف حتى سلمها أبو عبد الله الصغير للكاثوليكيين 1492 فختم بسقوطها عصر الأندلس. {cite:wikidata}'
