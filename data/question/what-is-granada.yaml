id: question/what-is-granada
class: question
label:
  ar: ما غرناطة؟
  en: What is Granada?
  es: "¿Qué es Granada?"
  fr: "Qu'est-ce que Grenade ?"
  ur: "گریناڈا کیا ہے؟"
summary:
  ar: غرناطة آخر ممالك الأندلس؛ إمارة بني الأحمر 1238–1492 وبها قصر الحمراء درة العمارة الإسلامية؛ سقوطها
    ختم ثمانية قرون إسلامية في إيبيريا.
  en: "Granada was the last kingdom of al-Andalus: the emirate of the Banu al-Ahmar (Nasrids), 1238–1492, home of the Alhambra, the jewel of Islamic architecture. Its fall closed eight Islamic centuries in Iberia."
  es: "Granada fue el último reino de al-Ándalus: el emirato de los Banu al-Ahmar (Nasríes), entre 1238 y 1492, hogar de la Alhambra, la joya de la arquitectura islámica. Su caída puso fin a ocho siglos islámicos en la península ibérica."
  fr: "Grenade fut le dernier royaume d'al-Andalus: l'émirat des Banu al-Ahmar (Nasrides), de 1238 à 1492, berceau de l'Alhambra, joyau de l'architecture islamique. Sa chute marqua la fin de huit siècles d'islam en Ibérie."
  ur: "غرناطہ الاندلس کی آخری بادشاہی تھی: بنو الاحمر ⁦(نصریوں)⁩ کی امارت، 1238-1492، الہمبرا کا گھر، اسلامی فن تعمیر کا زیور۔ اس کے زوال نے آئبیریا میں آٹھ اسلامی صدیوں کو بند کر دیا۔"
