question:
  ar: ما الفتوى؟
short_answer:
  ar: الفتوى هي إخبار بالحكم الشرعي في واقعة؛ يصدرها المفتي المؤهل ولا تلزم كالقضاء بل تلزم من التزم بها.
long_answer:
  ar: الفتوى هي الجواب الشرعي عن مسألة يسألها المستفتي؛ فصلها الفقهاء من القضاء فالمفتي يخبر بالحكم ولا
    يلزم به. صارت الفتاوى مدونة عظمى في التاريخ الإسلامي وتصدرها اليوم مجالس ودور إفتاء في العالم. {cite:wikidata}
