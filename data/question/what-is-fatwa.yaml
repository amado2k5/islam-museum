id: question/what-is-fatwa
class: question
label:
  ar: ما الفتوى؟
  en: What is a fatwa?
  es: "¿Qué es una fatua?"
  fr: "Qu'est-ce qu'une fatwa ?"
  ur: "فتویٰ کیا ہے؟"
  tr: "Fetva nedir?"
  id: "Apa itu fatwa?"
summary:
  ar: الفتوى هي إخبار بالحكم الشرعي في واقعة؛ يصدرها المفتي المؤهل ولا تلزم كالقضاء بل تلزم من التزم بها.
  en: "A fatwa is a statement of the sharia ruling on a particular case, issued by a qualified mufti. Unlike a judicial ruling, it does not bind by itself; it binds those who choose to follow it."
  es: "Una fatwa es una declaración de la sharia sobre un caso particular, emitida por un muftí cualificado. A diferencia de una resolución judicial, no es vinculante por sí misma; vincula a quienes deciden seguirla."
  fr: "Une fatwa est un avis juridique (ou avis religieux) émis par un mufti qualifié, énonçant la doctrine de la charia relative à un cas particulier. Contrairement à une décision judiciaire, elle n'est pas contraignante en soi; elle lie ceux qui choisissent de la suivre."
  ur: "فتویٰ کسی خاص معاملے پر شرعی حکم کا بیان ہے، جو کسی مستند مفتی کے ذریعے جاری کیا جاتا ہے۔ عدالتی فیصلے کے برعکس، یہ خود پابند نہیں ہوتا ہے۔ یہ ان لوگوں کو پابند کرتا ہے جو اس کی پیروی کرنے کا انتخاب کرتے ہیں۔"
  tr: "Fetva, nitelikli bir müfti tarafından verilen bir davada dini bir hükmün bildirimidir ve yargı gibi bağlayıcı değildir, ona uyanları zorunlu kılar."
  id: "Fatwa adalah pemberitahuan tentang putusan agama dalam kasus yang dikeluarkan oleh mufti yang berkualifikasi dan tidak mengikat seperti pengadilan, melainkan mewajibkan mereka yang mematuhinya."
question:
  ar: ما الفتوى؟
short_answer:
  ar: الفتوى هي إخبار بالحكم الشرعي في واقعة؛ يصدرها المفتي المؤهل ولا تلزم كالقضاء بل تلزم من التزم بها.
long_answer:
  ar: الفتوى هي الجواب الشرعي عن مسألة يسألها المستفتي؛ فصلها الفقهاء من القضاء فالمفتي يخبر بالحكم ولا
    يلزم به. صارت الفتاوى مدونة عظمى في التاريخ الإسلامي وتصدرها اليوم مجالس ودور إفتاء في العالم. {cite:wikidata}
