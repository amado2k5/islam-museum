  id: rasm-is-tawqifi
  standing: secondary
  stance:
    ar: الرسم توقيف من النبي
    en: The rasm was laid down by the Prophet
    ur: رسم نبی سے توقیفاً ہے
  summary:
    ar: "يذكر السبت أن بعض القائلين بوجوب الكتابة بالرسم العثماني يرون أن مبنى ذلك على التوقيف من النبي، ويحتجون بأدلة لا تنهض بإثبات هذا المدّعى بحسب قوله؛ ولم أقف في ما قرأت على أسماء القائلين ولا نصوصهم، فلا أنسب القول إلى أحد {cite:manahil-irfan-sabt p. 319}."
    en: "Al-Sabt notes that some of those who hold writing by the Uthmanic rasm obligatory see its basis as laid down by the Prophet, relying on proofs that, by his account, do not establish the claim; I found in what I read neither the names of those who said it nor their texts, so I attribute the view to no one {cite:manahil-irfan-sabt p. 319}."
    ur: "سبت بتاتے ہیں کہ رسمِ عثمانی پر لکھنے کو واجب کہنے والوں میں سے بعض سمجھتے ہیں کہ اس کی بنیاد نبی کی طرف سے توقیف ہے، اور ایسے دلائل لاتے ہیں جو ان کے بقول اس دعوے کو ثابت نہیں کرتے؛ میں نے جو پڑھا اس میں نہ کہنے والوں کے نام ملے نہ ان کی عبارتیں، اس لیے یہ قول کسی کی طرف منسوب نہیں کرتا {cite:manahil-irfan-sabt p. 319}۔"
  sources:
  - source/manahil-irfan-sabt
- tradition: sunni
  id: unperfected-writing-followed-for-blessing
  standing: secondary
  stance:
    ar: كتابة العرب الأولى غير المستحكمة، اتُّبعت تبركاً
    en: The early Arabs' unperfected writing, followed for blessing
    ur: ابتدائی عربوں کی غیر پختہ کتابت جس کی تبرکاً پیروی ہوئی
  summary:
    ar: "يقول ابن خلدون إن الخط العربي لأول الإسلام كان غير بالغ الغاية من الإحكام والإتقان لمكان العرب من البداوة، وإن الصحابة رسموا المصحف بخطوطهم فخالف كثير من رسومهم أقيسة رسوم صناعة الخط، ثم اقتفى التابعون رسمهم تبركاً، فاتُّبع وأُثبت رسماً. ويرد على من يعلّل بأن ما خالف الأصول له وجه، كقولهم في زيادة ألف في كلمة إنه تنبيه على أن الذبح لم يقع، وفي زيادة ياء في كلمة إنه تنبيه على كمال القدرة، فيقول إنه لا أصل له إلا التحكم المحض، وإن ما حملهم على ذلك اعتقادهم أن في ذلك تنزيهاً للصحابة عن نقص إجادة الخط، وإن الخط ليس كمالاً في حقهم لأنه من الصنائع المعاشية {cite:muqaddima-ibn-khaldun p. 417} {cite:muqaddima-ibn-khaldun p. 418}."
    en: "Ibn Khaldun says the Arabic script at the beginning of Islam was not at the height of firmness and skill because the Arabs were bedouin, and the Companions wrote the codex in their own hands, so much of their spelling departed from the analogies of the writer's art, then the Successors followed their writing for blessing, so it was followed and fixed as rasm. He answers those who explain that what departs from the rules has a reason, as when they say an added alif in one word is an alert that the slaughter did not occur, and an added ya' in another an alert to perfection of power, by saying it has no basis but sheer arbitrariness, that what moved them was the belief that this shields the Companions from lack of skill in writing, and that writing is not a perfection for them since it is a craft of livelihood {cite:muqaddima-ibn-khaldun p. 417} {cite:muqaddima-ibn-khaldun p. 418}."
    ur: "ابن خلدون کہتے ہیں کہ اسلام کے آغاز میں عربی خط انتہائی پختگی اور مہارت کو نہیں پہنچا تھا کیونکہ عرب بدوی تھے، اور صحابہ نے مصحف اپنے خطوط میں رسم کیا، اس لیے ان کے بہت سے رسوم فنِ کتابت کے قیاسات کے خلاف رہے، پھر تابعین نے ان کے رسم کی تبرکاً پیروی کی تو وہ متبع اور رسم کے طور پر قائم ہوا۔ وہ ان لوگوں کا جواب دیتے ہیں جو توجیہ کرتے ہیں کہ جو اصول کے خلاف ہے اس کی کوئی وجہ ہے، جیسے ایک کلمے میں الف کے اضافے کو اس پر تنبیہ کہنا کہ ذبح واقع نہ ہوا، اور دوسرے میں یاء کے اضافے کو کمالِ قدرت پر تنبیہ، تو وہ کہتے ہیں کہ اس کی کوئی اصل نہیں سوائے محض تحکم کے، اور انھیں اس پر اس اعتقاد نے ابھارا کہ اس میں صحابہ کو کتابت کی مہارت کی کمی سے پاک رکھنا ہے، حالانکہ خط ان کے حق میں کمال نہیں کیونکہ یہ معاشی صنعتوں میں سے ہے {cite:muqaddima-ibn-khaldun p. 417} {cite:muqaddima-ibn-khaldun p. 418}۔"
