id: question/is-the-rasm-tawqifi
class: question
label:
  ar: هل الرسم العثماني توقيفي؟
  en: Is the Uthmanic rasm tawqifi?
  ur: کیا رسمِ عثمانی توقیفی ہے؟
  es: "¿Es el rasm utmánico tawqifi?"
  fr: "Le rasm uthmanique est-il tawqifi ?"
  tr: "Osmanlı Kutsal Kitabı Yasaklayıcı mı?"
  id: "Apakah Kitab Suci Ottoman Terlalu Membatasi?"
summary:
  ar: "يقول خالد السبت إن من أوجب الرسم العثماني من يرى أنه توقيف من النبي، ولا تنهض أدلتهم؛ والأرجح عنده أنه لم يكن بتوقيف؛ ويرى ابن خلدون أن الصحابة كتبوا بخطوطهم غير المستحكمة فخالف كثير من رسومهم أقيسة الخط، وأن تعليل ذلك بمعان لا أصل له إلا التحكم؛ ويعلّل المراكشي اختلاف الحروف بحسب اختلاف معاني الكلمات {cite:manahil-irfan-sabt p. 319} {cite:muqaddima-ibn-khaldun p. 418} {cite:itqan-suyuti p. 2196}."
  en: "Khalid al-Sabt says some who made the Uthmanic rasm obligatory see it as laid down by the Prophet, though their proofs do not stand; he judges it more likely not to have been; Ibn Khaldun holds that the Companions wrote in their unperfected hands, so much of their spelling departs from the analogies of writing, and that explaining it by hidden meanings has no basis but sheer arbitrariness; al-Marrakushi explains the differences in letters by differences in the meanings of the words {cite:manahil-irfan-sabt p. 319} {cite:muqaddima-ibn-khaldun p. 418} {cite:itqan-suyuti p. 2196}."
  ur: "خالد السبت کہتے ہیں کہ رسمِ عثمانی کو واجب کہنے والوں میں بعض اسے نبی کی طرف سے توقیف سمجھتے ہیں، اور ان کے دلائل کافی نہیں؛ ان کے نزدیک راجح یہ ہے کہ وہ توقیفی نہ تھا؛ ابن خلدون کہتے ہیں کہ صحابہ نے اپنے غیر پختہ خطوط میں لکھا اس لیے ان کے بہت سے رسوم خط کے قیاسات کے خلاف رہے، اور اس کی مخفی معانی سے توجیہ کی کوئی اصل نہیں سوائے محض تحکم کے؛ اور مراکشی حروف کے فرق کو کلمات کے معانی کے فرق سے بیان کرتے ہیں {cite:manahil-irfan-sabt p. 319} {cite:muqaddima-ibn-khaldun p. 418} {cite:itqan-suyuti p. 2196}۔"
  es: "Khalid al-Sabt dice que algunos que hicieron obligatorio el rasm utmánico lo ven como establecido por el Profeta, aunque sus pruebas no se sostienen; él juzga que es más probable que no lo haya sido; Ibn Khaldun sostiene que los Compañeros escribieron con sus manos imperfectas, por lo que gran parte de su ortografía se aparta de las analogías de la escritura, y que explicarlo por significados ocultos no tiene fundamento más que pura arbitrariedad; al-Marrakushi explica las diferencias en las letras por diferencias en los significados de las palabras {cite:manahil-irfan-sabt p. 319} {cite:muqaddima-ibn-khaldun p. 418} {cite:itqan-suyuti p. 2196}."
  fr: "Khalid al-Sabt rapporte que certains de ceux qui ont rendu obligatoire le rasm uthmanien le considèrent comme établi par le Prophète, bien que leurs arguments ne soient pas convaincants; il estime plus probable qu'il ne l'ait pas été. Ibn Khaldun soutient que les Compagnons écrivaient de leur main encore imparfaite, ce qui explique pourquoi une grande partie de leur orthographe s'écarte des analogies de l'écriture, et que l'expliquer par des significations cachées relève de la pure arbitraire. Al-Marrakushi explique les différences de lettres par des différences de sens des mots {cite:manahil-irfan-sabt p. 319} {cite:muqaddima-ibn-khaldun p. 418} {cite:itqan-suyuti p. 2196}."
  tr: "Halid el-Sabt, en zorunlu Osmanlı yazıtlarının arasında bunu Peygamber'den bir ara vermiş olarak görenler olduğunu ve kanıtlarının geçerli olmadığını; daha olası görüşün bunun duraksamayla olmadığını belirtir. İbn Haldun, Sahabelerin kararsız yazı yazılarıyla yazdıklarını, bu yüzden birçok yazı sisteminin standart yazılardan farklı olduğunu ve bunu ustalıktan başka bir temeli olmayan anlamlarla açıklamalarını sağlar. El-Marrakuşi, harflerdeki farkı {cite:manahil-irfan-sabt s. 319} {cite:muqaddima-ibn-khaldun s. 418} {cite:itqan-suyuti s. 2196}} kelimelerin farklı anlamlarına göre açıklar."
  id: "Khalid al-Sabt mengatakan bahwa di antara aksara Ottoman yang paling wajib adalah mereka yang melihatnya sebagai pausal dari Nabi, dan bukti mereka tidak valid; pandangan yang lebih mungkin adalah bahwa itu bukan karena pausement. Ibn Khaldun percaya bahwa para Sahabat menulis dengan aksara mereka yang tidak stabil, sehingga banyak aksara mereka berbeda dari aksara standar, dan menjelaskan ini dengan makna yang tidak memiliki dasar selain penguasaan. Al-Marrakushi menjelaskan perbedaan huruf menurut makna kata {cite:manahil-irfan-sabt hlm. 319} {cite:muqaddima-ibn-khaldun hlm. 418} {cite:itqan-suyuti hlm. 2196}."
question:
  ar: هل كتب الصحابة المصحف على رسم أُخذ عن النبي توقيفاً، أم هو اصطلاحهم في الكتابة؟
  en: Did the Companions write the codex in a rasm taken from the Prophet as laid down, or in their own writing convention?
  ur: کیا صحابہ نے مصحف اس رسم پر لکھا جو نبی سے توقیفاً لیا گیا تھا، یا ان کی اپنی کتابت کی اصطلاح تھی؟
short_answer:
  ar: "لا قول فصل في ما قرأت: السبت يرجّح أنه غير توقيفي، وابن خلدون يرى أنه كتابة العرب الأولى غير المستحكمة، والمراكشي يرى أن اختلاف الأحرف في الخط له معان؛ ويرد ابن خلدون هذا التعليل."
  en: "There is no decisive view in what I read: al-Sabt favours its not being tawqifi, Ibn Khaldun takes it as the unperfected writing of the early Arabs, and al-Marrakushi holds that the differences of letters in the script carry meanings, which Ibn Khaldun rejects."
  ur: "جو میں نے پڑھا اس میں کوئی فیصلہ کن قول نہیں: سبت راجح کہتے ہیں کہ یہ توقیفی نہیں، ابن خلدون اسے ابتدائی عربوں کی غیر پختہ کتابت سمجھتے ہیں، اور مراکشی کہتے ہیں کہ خط میں حروف کا فرق معانی رکھتا ہے، جسے ابن خلدون رد کرتے ہیں۔"
