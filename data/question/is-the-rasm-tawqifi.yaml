  stance:
    ar: غير توقيفي لكن يُلتزم به لإجماع الصحابة والأمة
    en: Not tawqifi, yet to be kept by the consensus of the Companions and the community
    ur: توقیفی نہیں مگر صحابہ اور امت کے اجماع کی بنا پر لازم
  summary:
    ar: "يقول السبت: ذهب آخرون، وهو الأرجح، إلى أن ذلك لم يكن بتوقيف من الشارع، وإنما ينبغي التزام الرسم العثماني للأدلة المذكورة في صدر المسألة، وهي إجماع الصحابة ثم الأمة، وسدّ ذريعة التلاعب {cite:manahil-irfan-sabt p. 319} {cite:manahil-irfan-sabt p. 320}."
    en: "Al-Sabt says others, and this is the more likely, held that it was not laid down by the Lawgiver, but that the Uthmanic rasm is to be kept for the proofs given at the head of the question: the Companions' consensus and then the community's, and closing the door to tampering {cite:manahil-irfan-sabt p. 319} {cite:manahil-irfan-sabt p. 320}."
    ur: "سبت کہتے ہیں: دوسروں نے، اور یہی زیادہ راجح ہے، کہا کہ یہ شارع کی طرف سے توقیف نہ تھا، بلکہ رسمِ عثمانی کی پابندی ان دلائل سے ہونی چاہیے جو مسئلے کے آغاز میں ہیں، یعنی صحابہ کا اجماع پھر امت کا، اور چھیڑ چھاڑ کا دروازہ بند کرنا {cite:manahil-irfan-sabt p. 319} {cite:manahil-irfan-sabt p. 320}۔"
  sources:
  - source/manahil-irfan-sabt
