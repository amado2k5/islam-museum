  id: letter-forms-follow-meanings
  standing: secondary
  stance:
    ar: اختلاف الحروف في الخط بحسب اختلاف معاني الكلمات
    en: Differences of letters in the script follow differences in the meanings of words
    ur: خط میں حروف کا فرق کلمات کے معانی کے فرق کے مطابق ہے
  summary:
    ar: "يذكر السيوطي أن أبا العباس المراكشي ألّف في توجيه ما خالف قواعد الخط كتاباً سماه «عنوان الدليل في مرسوم خط التنزيل» بيّن فيه أن هذه الأحرف إنما اختلف حالها في الخط بحسب اختلاف أحوال معاني كلماتها؛ ومن ذلك تعليله حذف الواو من أربعة أفعال بسرعة وقوع الفعل وسهولته على الفاعل وشدة قبول المنفعل المتأثر به. ويقول ابن خلدون إن مثل هذه التعليلات «لا أصل له إلا التحكم المحض» {cite:itqan-suyuti p. 2196} {cite:itqan-suyuti p. 2212} {cite:muqaddima-ibn-khaldun p. 418}."
    en: "Al-Suyuti says Abu al-Abbas al-Marrakushi wrote a book to explain what departs from the rules of writing, 'Unwan al-Dalil fi Marsum Khatt al-Tanzil, showing that these letters differ in the script only according to differences in the states of the meanings of their words; so he explains the dropping of the waw from four verbs by the swiftness of the act, its ease for the doer and the full acceptance by the one affected. Ibn Khaldun says such explanations have 'no basis but sheer arbitrariness' {cite:itqan-suyuti p. 2196} {cite:itqan-suyuti p. 2212} {cite:muqaddima-ibn-khaldun p. 418}."
    ur: "سیوطی بتاتے ہیں کہ ابو العباس مراکشی نے خط کے قواعد کے خلاف چیزوں کی توجیہ میں «عنوان الدلیل فی مرسوم خط التنزیل» لکھی جس میں بتایا کہ ان حروف کا خط میں فرق ان کے کلمات کے معانی کے احوال کے فرق کے مطابق ہے؛ اسی لیے وہ چار افعال سے واو کے حذف کی توجیہ فعل کے جلد واقع ہونے، فاعل پر اس کی آسانی اور متاثر ہونے والے کے پوری طرح قبول کرنے سے کرتے ہیں۔ ابن خلدون کہتے ہیں کہ ایسی توجیہات کی «محض تحکم کے سوا کوئی اصل نہیں» {cite:itqan-suyuti p. 2196} {cite:itqan-suyuti p. 2212} {cite:muqaddima-ibn-khaldun p. 418}۔"
