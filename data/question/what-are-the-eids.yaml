long_answer:
  ar: 'للمسلمين عيدان سنويان: [[practice/eid-al-fitr|عيد الفطر]] أول شوال بعد صوم رمضان وتخرج قبل صلاته
    [[practice/zakat-al-fitr|زكاة الفطر]]، و[[practice/eid-al-adha|عيد الأضحى]] يوم العاشر من ذي الحجة
    موافقًا ليوم النحر في الحج وتذبح فيه الأضاحي. ولكلٍّ صلاة جامعة صباحية في المساجد والمصليات. {cite:wikidata}'
