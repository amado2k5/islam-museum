id: question/what-was-the-last-revelation
class: question
label:
  ar: "ما آخر ما نزل من القرآن؟"
  en: "What was the last part of the Qur'an to be revealed?"
  ur: "قرآن کا سب سے آخر میں نازل ہونے والا حصہ کون سا ہے؟"
summary:
  ar: "يجمع ابن الجوزي في «زاد المسير» الروايات في آخر ما نزل: عن ابن عباس في أفراد البخاري أنها آية الربا، وفي أفراد مسلم أن آخر سورة نزلت جميعًا سورة النصر، ومن طريق الضحاك عنه أنها آية «واتقوا يومًا» من البقرة، وبه قال سعيد بن جبير وأبو صالح؛ وعن البراء أن آخر آية نزلت آية الكلالة وآخر سورة براءة؛ وعن أبي بن كعب أن آخرها خاتمة سورة التوبة."
  en: "In Zad al-Masir Ibn al-Jawzi gathers the reports on the last revelation: from Ibn Abbas, in a report only al-Bukhari has, the verse of usury, and in one only Muslim has, that the last sura revealed whole was al-Nasr; through al-Dahhak from him, the verse of al-Baqara on the Day of return, held also by Sa'id ibn Jubayr and Abu Salih; from al-Bara', the verse of kalala as the last verse and Bara'a as the last sura; and from Ubayy ibn Ka'b, the closing verses of Surat al-Tawba."
  ur: "ابن الجوزی «زاد المسیر» میں آخری نزول کی روایات جمع کرتے ہیں: ابن عباس سے، ایک روایت میں جو صرف بخاری میں ہے، آیتِ ربا، اور ایک میں جو صرف مسلم میں ہے، کہ آخری سورت جو پوری اتری سورۂ نصر تھی؛ ضحاک کے طریق سے ان سے، سورۂ بقرہ کی یومِ رجوع والی آیت، جو سعید بن جبیر اور ابو صالح کا بھی قول ہے؛ براء سے، آیتِ کلالہ آخری آیت اور براءۃ آخری سورت؛ اور ابی بن کعب سے، سورۂ توبہ کی آخری آیات۔"
question:
  ar: "أي آية أو سورة كانت آخر ما نزل من القرآن؟"
  en: "Which verse or sura was the last to be revealed?"
  ur: "کون سی آیت یا سورت سب سے آخر میں نازل ہوئی؟"
short_answer:
  ar: "اختلفت الروايات عن الصحابة: آية الربا، أو آية «واتقوا يومًا» من البقرة، أو آية الكلالة، أو خاتمة التوبة؛ وفي السور: النصر أو براءة."
  en: "The Companions' reports differ: the verse of usury, the verse of al-Baqara on the Day of return, the verse of kalala, or the end of al-Tawba; among suras, al-Nasr or Bara'a."
  ur: "صحابہ کی روایات مختلف ہیں: آیتِ ربا، سورۂ بقرہ کی یومِ رجوع والی آیت، آیتِ کلالہ، یا سورۂ توبہ کا اختتام؛ سورتوں میں: نصر یا براءۃ۔"
