id: question/what-was-the-last-revelation
class: question
label:
  ar: "ما آخر ما نزل من القرآن؟"
  en: "What was the last part of the Qur'an to be revealed?"
  ur: "قرآن کا سب سے آخر میں نازل ہونے والا حصہ کون سا ہے؟"
  es: "¿Cuál fue la última parte del Corán que se reveló?"
  fr: "Quelle fut la dernière partie du Coran à être révélée ?"
  tr: "Kur'an'dan en son vahiy nedir?"
  id: "Apa wahyu terbaru dari Al-Quran?"
summary:
  ar: "يجمع ابن الجوزي في «زاد المسير» الروايات في آخر ما نزل: عن ابن عباس في أفراد البخاري أنها آية الربا، وفي أفراد مسلم أن آخر سورة نزلت جميعًا سورة النصر، ومن طريق الضحاك عنه أنها آية «واتقوا يومًا» من البقرة، وبه قال سعيد بن جبير وأبو صالح؛ وعن البراء أن آخر آية نزلت آية الكلالة وآخر سورة براءة؛ وعن أبي بن كعب أن آخرها خاتمة سورة التوبة."
  en: "In Zad al-Masir Ibn al-Jawzi gathers the reports on the last revelation: from Ibn Abbas, in a report only al-Bukhari has, the verse of usury, and in one only Muslim has, that the last sura revealed whole was al-Nasr; through al-Dahhak from him, the verse of al-Baqara on the Day of return, held also by Sa'id ibn Jubayr and Abu Salih; from al-Bara', the verse of kalala as the last verse and Bara'a as the last sura; and from Ubayy ibn Ka'b, the closing verses of Surat al-Tawba."
  ur: "ابن الجوزی «زاد المسیر» میں آخری نزول کی روایات جمع کرتے ہیں: ابن عباس سے، ایک روایت میں جو صرف بخاری میں ہے، آیتِ ربا، اور ایک میں جو صرف مسلم میں ہے، کہ آخری سورت جو پوری اتری سورۂ نصر تھی؛ ضحاک کے طریق سے ان سے، سورۂ بقرہ کی یومِ رجوع والی آیت، جو سعید بن جبیر اور ابو صالح کا بھی قول ہے؛ براء سے، آیتِ کلالہ آخری آیت اور براءۃ آخری سورت؛ اور ابی بن کعب سے، سورۂ توبہ کی آخری آیات۔"
  es: "En Zad al-Masir, Ibn al-Jawzi reúne los informes sobre la última revelación: de Ibn Abbas, en un informe que solo tiene al-Bukhari, el versículo de la usura, y en uno que solo tiene Muslim, que la última sura revelada completa fue al-Nasr; a través de al-Dahhak de él, el versículo de al-Baqara sobre el Día del Retorno, sostenido también por Sa'id ibn Jubayr y Abu Salih; de al-Bara', el versículo de kalala como el último versículo y Bara'a como la última sura; y de Ubayy ibn Ka'b, los versículos finales de Surat al-Tawba."
  fr: "Dans Zad al-Masir, Ibn al-Jawzi rassemble les récits relatifs à la dernière révélation: d’Ibn Abbas, dans un récit que seul al-Bukhari possède, le verset de l’usure, et dans un autre que seul Muslim possède, selon lequel la dernière sourate révélée intégralement était al-Nasr; par l’intermédiaire d’al-Dahhak, d’après lui, le verset d’al-Baqara sur le Jour du retour, également tenu pour acquis par Sa’id ibn Jubayr et Abu Salih; d’al-Bara’, le verset de kalala comme dernier verset et Bara’a comme dernière sourate; et d’Ubayy ibn Ka’b, les versets de conclusion de la sourate al-Tawba."
  tr: "İbn al-Jawzi, 'Zad al-Masir'de vahyedilenlerin sonunda rivayetleri toplar: İbn Abbas'tan 'Furud al-Buharari'de bunun tefecilik ayeti olduğu; 'Furud Müslim'de son indirilen surenin En-Nasr suresi olduğu belirtilir. El-Dahhak'tan 'Ve bir gün kork' ayeti Al-Bakarah'dan, Sa'id bin Cübeyr ve Ebu Salih'in söylediği gibi; el-Bara'dan son ayetin 'el-Kalala' ayeti ve son inkar suresi olduğunu; ve Ebu bin Ka'b'dan son ayetin Tevbe suresinin sonu olduğunu belirtir."
  id: "Ibn al-Jawzi mengumpulkan riwayat di akhir apa yang diwahyukan dalam 'Zad al-Masir': dari Ibn Abbas dalam 'Furud al-Bukhari' bahwa itu adalah ayat riba; dalam 'Furud Muslim' surah terakhir yang diwahyukan adalah Surah An-Nasr. Dari al-Dahhak adalah ayat 'Dan takut suatu hari' dari Al-Baqarah, seperti yang dikatakan oleh Sa'id ibn Jubayr dan Abu Salih; dari al-Bara' bahwa ayat terakhir diwahyukan sebagai ayat 'al-Kalala' dan surah terakhir penyangkalan; dan dari Abu ibn Ka'b bahwa ayat terakhir adalah akhir Surah At-Tawbah."
question:
  ar: "أي آية أو سورة كانت آخر ما نزل من القرآن؟"
  en: "Which verse or sura was the last to be revealed?"
  ur: "کون سی آیت یا سورت سب سے آخر میں نازل ہوئی؟"
short_answer:
  ar: "اختلفت الروايات عن الصحابة: آية الربا، أو آية «واتقوا يومًا» من البقرة، أو آية الكلالة، أو خاتمة التوبة؛ وفي السور: النصر أو براءة."
  en: "The Companions' reports differ: the verse of usury, the verse of al-Baqara on the Day of return, the verse of kalala, or the end of al-Tawba; among suras, al-Nasr or Bara'a."
  ur: "صحابہ کی روایات مختلف ہیں: آیتِ ربا، سورۂ بقرہ کی یومِ رجوع والی آیت، آیتِ کلالہ، یا سورۂ توبہ کا اختتام؛ سورتوں میں: نصر یا براءۃ۔"
