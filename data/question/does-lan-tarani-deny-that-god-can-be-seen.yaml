issue:
  ar: "رؤية الله وتفسير «لن تراني»"
  en: "The vision of God and the reading of 'You will not see Me'"
  ur: "اللہ کی رؤیت اور «لن ترانی» کی تفسیر"
sensitivity: contested
perspectives:
  - tradition: sunni-maliki
    id: ibn-al-munayyir-intisaf
    standing: main
    stance: { ar: "الرؤية جائزة عقلًا، والخبر منع وقوعها في الدنيا", en: "Seeing God is rationally possible; revelation ruled out its happening in this world", ur: "رؤیت عقلاً جائز ہے؛ خبر نے دنیا میں اس کے وقوع کو روکا" }
    summary:
      ar: "يقول [[person/ibn-al-munayyir|ابن المنير]] إن الوجود هو المصحح للرؤية، وإن استبعاد رؤية ما ليس في جهة أمر وهمي، فكما يُعرف الله لا في جهة يُرى لا في جهة؛ وإن موسى طلب الرؤية لنفسه لعلمه بجوازها، وإن إنكاره على قومه كان لعبادة العجل في قول أكثر المفسرين، أو لاقتراحهم آية بعد أن أخبرهم أنها لا تقع في الدنيا. {cite:kashshaf-dar-al-marifa-shiha-2009 p.384} ويرد قول الزمخشري إنه سأل ليبكّتهم: فإن كانوا مؤمنين بموسى كفاهم خبره، وإن كانوا كفارًا به لم يفدهم منع الله إياه لأنهم لا يصدقونه. {cite:kashshaf-dar-al-marifa-shiha-2009 p.385} ويرى أن «لن» تشارك «لا» في النفي وتزيد التأكيد ولا تدل على استحالة المنفي عقلًا، مستشهدًا بآيات نفت بها أمورًا جائزة عقلًا، وأن تعليق الرؤية على استقرار الجبل تعليق على أمر ممكن في نفسه. {cite:kashshaf-dar-al-marifa-shiha-2009 p.385}"
      en: "[[person/ibn-al-munayyir|Ibn al-Munayyir]] argues that existence is what makes a thing visible, and that thinking it unlikely that what is not in a direction can be seen is mere fancy: as God is known without being in a direction, He can be seen without being in a direction; Moses asked to see Him for himself, knowing it was possible, and his rebuke of his people was for worshipping the calf, as most exegetes hold, or for demanding a sign after being told it would not occur in this world. {cite:kashshaf-dar-al-marifa-shiha-2009 p.384} He answers al-Zamakhshari's claim that Moses asked to silence them: if they believed in Moses his word sufficed, and if they did not, God's refusal to him would not convince them, since they would not believe his report of it. {cite:kashshaf-dar-al-marifa-shiha-2009 p.385} He holds that 'lan' shares negation with 'la' and adds emphasis without implying rational impossibility, citing verses where it negates things rationally possible, and that making the vision depend on the mountain staying in place makes it depend on something possible in itself. {cite:kashshaf-dar-al-marifa-shiha-2009 p.385}"
      ur: "[[person/ibn-al-munayyir|ابن المنیر]] کہتے ہیں کہ وجود ہی رؤیت کو ممکن بناتا ہے، اور جو جہت میں نہ ہو اس کی رؤیت کو بعید سمجھنا محض وہم ہے: جیسے اللہ کو جہت کے بغیر جانا جاتا ہے ویسے ہی جہت کے بغیر دیکھا جا سکتا ہے؛ موسیٰ نے جواز جان کر اپنے لیے رؤیت مانگی، اور قوم پر ان کی نکیر اکثر مفسرین کے قول میں بچھڑے کی عبادت پر تھی، یا اس پر کہ بتائے جانے کے بعد بھی کہ دنیا میں یہ نہ ہوگا انہوں نے نشانی کا مطالبہ کیا۔ {cite:kashshaf-dar-al-marifa-shiha-2009 p.384} وہ زمخشری کے اس دعوے کا جواب دیتے ہیں کہ موسیٰ نے انہیں لاجواب کرنے کے لیے پوچھا: اگر وہ موسیٰ پر ایمان رکھتے تھے تو ان کی خبر کافی تھی، اور اگر نہیں تو اللہ کا انکار انہیں قائل نہ کرتا کیونکہ وہ موسیٰ کی اس خبر کو بھی نہ مانتے۔ {cite:kashshaf-dar-al-marifa-shiha-2009 p.385} ان کے نزدیک «لن» نفی میں «لا» کے ساتھ شریک ہے اور تاکید بڑھاتا ہے، مگر منفی کے عقلاً محال ہونے پر دلالت نہیں کرتا — وہ ایسی آیات سے استشہاد کرتے ہیں جن میں اس سے عقلاً جائز امور کی نفی ہوئی — اور رؤیت کو پہاڑ کے ٹھہرنے پر معلق کرنا ایک فی نفسہ ممکن امر پر تعلیق ہے۔ {cite:kashshaf-dar-al-marifa-shiha-2009 p.385}"
