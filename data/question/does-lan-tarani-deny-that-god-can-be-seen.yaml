    stance: { ar: "الرؤية بالحاسة ممتنعة، وسأل موسى ليبكّت قومه", en: "Vision by a sense is impossible; Moses asked to silence his people", ur: "حس کے ذریعے رؤیت محال ہے؛ موسیٰ نے قوم کو لاجواب کرنے کے لیے پوچھا" }
    summary:
      ar: "يقرر [[person/al-zamakhshari|الزمخشري]]، على مذهب [[group/mutazila|المعتزلة]] الذي يصرح به، أن موسى من أعلم الناس بأن الله متعالٍ عن الرؤية التي هي إدراك ببعض الحواس، لأن ذلك إنما يصح فيما كان في جهة؛ وأنه إنما سأل الرؤية ليبكّت الذين اشترطوا لإيمانهم أن يروا الله جهرة، وليسمعوا النص من عند الله باستحالة ذلك. {cite:kashshaf-dar-al-marifa-shiha-2009 p.384} {cite:kashshaf-dar-al-marifa-shiha-2009 p.385} ويرى أن «لن» تأكيد للنفي الذي في «لا»، وأن المعنى أن المنفي مناف لصفاته، وأن النظر إلى الجبل نظر آخر يريه عظم ما أقدم عليه، وأن تعليق الرؤية على استقرار الجبل حين يُدكّ تعليق بما لا يكون. {cite:kashshaf-dar-al-marifa-shiha-2009 p.385}"
      en: "[[person/al-zamakhshari|Al-Zamakhshari]], on the [[group/mutazila|Mu'tazili]] doctrine he openly holds, says Moses was among those who knew best that God is above being seen — vision being perception by a sense, possible only of what is in a direction; he asked only to silence those who made seeing God openly the condition of their belief, so that they would hear from God Himself that it is impossible. {cite:kashshaf-dar-al-marifa-shiha-2009 p.384} {cite:kashshaf-dar-al-marifa-shiha-2009 p.385} For him 'lan' strengthens the negation in 'la', meaning that what is denied is incompatible with God's attributes; looking at the mountain is a different look that shows Moses the gravity of what he had ventured; and making the vision depend on the mountain staying in place as it is levelled makes it depend on what will not be. {cite:kashshaf-dar-al-marifa-shiha-2009 p.385}"
      ur: "[[person/al-zamakhshari|زمخشری]]، [[group/mutazila|معتزلہ]] کے مذہب پر جسے وہ کھل کر اختیار کرتے ہیں، کہتے ہیں کہ موسیٰ سب سے بڑھ کر جانتے تھے کہ اللہ اس رؤیت سے بلند ہے جو کسی حس سے ادراک ہے، کیونکہ وہ صرف جہت میں موجود چیز کی ہو سکتی ہے؛ انہوں نے صرف ان لوگوں کو لاجواب کرنے کے لیے رؤیت مانگی جنہوں نے اپنے ایمان کو اللہ کو علانیہ دیکھنے سے مشروط کیا تھا، تاکہ وہ اللہ کی طرف سے اس کے محال ہونے کی نص سن لیں۔ {cite:kashshaf-dar-al-marifa-shiha-2009 p.384} {cite:kashshaf-dar-al-marifa-shiha-2009 p.385} ان کے نزدیک «لن» «لا» کی نفی کی تاکید ہے، یعنی منفی اللہ کی صفات کے منافی ہے؛ پہاڑ کی طرف دیکھنا ایک اور نظر ہے جو موسیٰ کو ان کے اقدام کی سنگینی دکھاتی ہے؛ اور رؤیت کو پہاڑ کے ٹوٹتے وقت اس کے ٹھہرنے پر معلق کرنا ایک ناممکن پر تعلیق ہے۔ {cite:kashshaf-dar-al-marifa-shiha-2009 p.385}"
