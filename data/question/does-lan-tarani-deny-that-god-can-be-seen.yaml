id: question/does-lan-tarani-deny-that-god-can-be-seen
class: question
label:
  ar: "هل ينفي قوله «لن تراني» جواز رؤية الله؟ الزمخشري وابن المنير"
  en: "Does 'You will not see Me' deny that God can be seen? Al-Zamakhshari and Ibn al-Munayyir"
  ur: "کیا «لن ترانی» اللہ کی رؤیت کے جواز کی نفی کرتا ہے؟ زمخشری اور ابن المنیر"
summary:
  ar: "في تفسير سؤال موسى الرؤية في الأعراف: 143 يرى الزمخشري في «الكشاف»، على مذهب المعتزلة، أن موسى سأل ليبكّت قومه وأن «لن» تؤكد نفي ما ينافي صفات الله؛ ويرد عليه ابن المنير في «الانتصاف»، على مذهب أهل السنة، بأن الرؤية جائزة عقلًا، وأن موسى سألها لنفسه لعلمه بجوازها، وأن الخبر منع وقوعها في الدنيا."
  en: "Commenting on Moses' request to see God in al-A'raf 143, al-Zamakhshari in al-Kashshaf, on the Mu'tazili view, holds that Moses asked in order to silence his people and that 'lan' strengthens the denial of what is incompatible with God's attributes; Ibn al-Munayyir answers in al-Intisaf, on the Sunni view, that seeing God is rationally possible, that Moses asked for himself knowing this, and that revelation ruled out its happening in this world."
  ur: "الاعراف: 143 میں موسیٰ کے رؤیت کے سوال کی تفسیر میں زمخشری «الکشاف» میں، معتزلہ کے مذہب پر، کہتے ہیں کہ موسیٰ نے اپنی قوم کو لاجواب کرنے کے لیے پوچھا اور «لن» اس کی نفی کی تاکید ہے جو اللہ کی صفات کے منافی ہے؛ ابن المنیر «الانتصاف» میں، اہلِ سنت کے مذہب پر، جواب دیتے ہیں کہ رؤیت عقلاً جائز ہے، موسیٰ نے اسے جائز جان کر اپنے لیے مانگا، اور خبر نے دنیا میں اس کے وقوع کو روک دیا۔"
question:
  ar: "لماذا سأل موسى الرؤية، وماذا يفيد النفي بـ«لن» في جوابه: الاستحالة أم عدم الوقوع في الدنيا؟"
  en: "Why did Moses ask to see God, and what does the negation with 'lan' in the answer convey — impossibility, or that it will not happen in this world?"
  ur: "موسیٰ نے رؤیت کیوں مانگی، اور جواب میں «لن» کی نفی کیا بتاتی ہے — محال ہونا، یا دنیا میں واقع نہ ہونا؟"
short_answer:
  ar: "ابن المنير ⁦(سني مالكي)⁩: جائزة لا تقع في الدنيا، وسأل موسى لنفسه؛ الزمخشري ⁦(معتزلي)⁩: ممتنعة، وسأل ليبكّت قومه."
  en: "Ibn al-Munayyir (Sunni, Maliki): possible but not to occur in this world, and Moses asked for himself; al-Zamakhshari (Mu'tazili): impossible, and Moses asked to silence his people."
  ur: "ابن المنیر (سنی مالکی): جائز مگر دنیا میں واقع نہیں، اور موسیٰ نے اپنے لیے مانگی؛ زمخشری (معتزلی): محال، اور موسیٰ نے قوم کو لاجواب کرنے کے لیے مانگی۔"
