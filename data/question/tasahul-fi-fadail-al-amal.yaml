id: question/tasahul-fi-fadail-al-amal
class: question
label:
  ar: "هل يُتساهل في أسانيد أحاديث فضائل الأعمال؟"
  en: "Is leniency allowed in the chains of reports on virtuous deeds?"
  es: "¿Se permite la indulgencia en las cadenas de informes sobre actos virtuosos?"
  fr: "La clémence est-elle permise dans les chaînes de rapports sur les actes vertueux ?"
  ur: "کیا اعمال صالحہ کی خبروں کی زنجیروں میں نرمی کی اجازت ہے؟"
  tr: "Eylemlerin erdemlerinin anlatımlarının zincirlerinde hoşgörülü mü olur?"
  id: "Apakah dia bersikap lunak dalam rantai narasi tentang kebajikan perbuatan?"
summary:
  ar: "مسألة في علم الرواية: هل يُشترط في أحاديث الترغيب والمواعظ وفضائل الأعمال ما يُشترط في أحاديث الحلال والحرام من ثقة الرواة؟ عقد لها الخطيب البغدادي في «الكفاية» باب «التشدد في أحاديث الأحكام والتجوز في فضائل الأعمال»، ونقل فيه عن سفيان الثوري وابن عيينة وأحمد بن حنبل وأبي زكريا العنبري التفريق بين ما يُحِلّ ويحرّم ويوجب حكماً وما كان في ترغيب أو ترهيب أو رقائق {cite:kifaya-khatib-hyderabad-1357 p. 133-134}."
  en: "A question of transmission: must reports of encouragement, admonition and virtuous deeds meet the same standard of trustworthy transmitters as reports on the lawful and unlawful? Al-Khatib al-Baghdadi gives it a chapter in al-Kifaya, 'strictness in legal hadith and leniency in virtuous deeds', quoting Sufyan al-Thawri, Ibn Uyayna, Ahmad ibn Hanbal and Abu Zakariyya al-Anbari distinguishing what makes lawful, forbids or establishes a ruling from what concerns encouragement, warning or heart-softening."
  es: "Una cuestión de transmisión: ¿deben los relatos de aliento, amonestación y buenas acciones cumplir con el mismo estándar de transmisores confiables que los relatos sobre lo lícito y lo ilícito? Al-Khatib al-Baghdadi le dedica un capítulo en al-Kifaya, \"rigurosidad en los hadices legales y indulgencia en las buenas acciones\", citando a Sufyan al-Thawri, Ibn Uyayna, Ahmad ibn Hanbal y Abu Zakariyya al-Anbari, quienes distinguen lo que hace lícito, prohíbe o establece una norma de lo que concierne al aliento, la advertencia o el ablandamiento del corazón."
  fr: "La question de la transmission se pose: les hadiths encourageants, les exhortations et les récits de bonnes actions doivent-ils être transmis selon les mêmes critères de fiabilité que les hadiths relatifs au licite et à l’illicite ? Al-Khatib al-Baghdadi y consacre un chapitre de son ouvrage al-Kifaya, intitulé « Rigueur dans les hadiths juridiques et souplesse dans les bonnes actions », citant Sufyan al-Thawri, Ibn Uyayna, Ahmad ibn Hanbal et Abu Zakariyya al-Anbari. Ces derniers distinguent ce qui rend licite, interdit ou établit une règle, de ce qui relève de l’encouragement, de l’avertissement ou de la bienveillance."
  ur: "ترسیل کا ایک سوال: کیا حوصلہ افزائی، نصیحت اور نیک اعمال کی رپورٹیں ثقہ ٹرانسمیٹر کے اسی معیار پر پورا اترتی ہیں جو حلال اور ناجائز کی رپورٹیں ہیں؟ الخطیب البغدادی نے اسے الکفایہ میں ایک باب دیا ہے، 'قانونی حدیث میں سختی اور نیک کاموں میں نرمی'، سفیان الثوری، ابن عیینہ، احمد بن حنبل اور ابو زکریا الانباری کا حوالہ دیتے ہوئے اس بات کی تمیز کرتے ہیں کہ کس چیز کو حلال یا حرام قرار دینے کی ترغیب دی جاتی ہے۔ دل کو نرم کرنے والا."
  tr: "Rivayet Biliminde Bir Soru: Teşvik, öğüt ve eylem erdemleri hadislerinde, neyin yasal ve yasak olduğuna dair hadislerdeki kadar güvenilir olması gerekir mi? El-Hatib el-Bağdadi, \"El-Kifayah\"da bunun için \"Hükümlerin Hadislerinde Katılık ve Eylemin Erdemlerinde İzinlilik\" başlıklı bölümü kurmuş; burada Sufyan el-Thawri, İbn Uyayn, Ahmed ibn Hanbal ve Ebu Zekeriye el-Anbari'den alıntı yaparak neyin mücaiz, yasak ve hüküm gerektiren ile neyin teşvik edilen, caydırılmış veya ince olduğunu ayırt etmiştir. {atıf:Kifaya-Khatib-Hyderabad-1357, s. 133-134}."
  id: "Pertanyaan dalam Ilmu Narasi: Apakah dalam hadits dorongan, peringatan, dan kebajikan perbuatan diwajibkan untuk sama dapat dipercayanya seperti dalam hadis tentang apa yang sah dan tidak sah? Al-Khatib al-Baghdadi menetapkan dalam \"Al-Kifayah\" bab \"Ketatnya dalam Hadis Keputusan dan Kelayakan dalam Kebajikan Perbuatan,\" di mana ia mengutip Sufyan al-Thawri, Ibn Uyaynah, Ahmad ibn Hanbal, dan Abu Zakariya al-Anbari untuk membedakan antara apa yang diperbolehkan, dilarang, dan mengandung keputusan, serta apa yang dianjurkan, dihalangi, atau halus. {cite:Kifaya-Khatib-Hyderabad-1357, hlm. 133-134}."
