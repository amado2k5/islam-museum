  - tradition: sunni
    id: sunni-ibn-mahdi
    standing: secondary
    stance: { ar: "لا يُشتغل بكتابة أحاديث الضعفاء", en: "One should not busy oneself writing the hadith of weak men" }
    summary:
      ar: "عبد الرحمن بن مهدي، في الخبر الذي يسوقه الخطيب قبل الباب مباشرة: لا ينبغي للرجل أن يشغل نفسه بكتابة أحاديث الضعاف، فأقل ما فيه أن يفوته بقدر ما يكتب منها من حديث الثقات."
      en: "Abd al-Rahman ibn Mahdi, in the report al-Khatib gives just before the chapter: a man should not busy himself writing the hadiths of the weak, for the least of it is that he misses as much of the hadith of the trustworthy as he writes of theirs."
