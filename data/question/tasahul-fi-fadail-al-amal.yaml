id: question/tasahul-fi-fadail-al-amal
class: question
label:
  ar: "هل يُتساهل في أسانيد أحاديث فضائل الأعمال؟"
  en: "Is leniency allowed in the chains of reports on virtuous deeds?"
summary:
  ar: "مسألة في علم الرواية: هل يُشترط في أحاديث الترغيب والمواعظ وفضائل الأعمال ما يُشترط في أحاديث الحلال والحرام من ثقة الرواة؟ عقد لها الخطيب البغدادي في «الكفاية» باب «التشدد في أحاديث الأحكام والتجوز في فضائل الأعمال»، ونقل فيه عن سفيان الثوري وابن عيينة وأحمد بن حنبل وأبي زكريا العنبري التفريق بين ما يُحِلّ ويحرّم ويوجب حكماً وما كان في ترغيب أو ترهيب أو رقائق {cite:kifaya-khatib-hyderabad-1357 p. 133-134}."
  en: "A question of transmission: must reports of encouragement, admonition and virtuous deeds meet the same standard of trustworthy transmitters as reports on the lawful and unlawful? Al-Khatib al-Baghdadi gives it a chapter in al-Kifaya, 'strictness in legal hadith and leniency in virtuous deeds', quoting Sufyan al-Thawri, Ibn Uyayna, Ahmad ibn Hanbal and Abu Zakariyya al-Anbari distinguishing what makes lawful, forbids or establishes a ruling from what concerns encouragement, warning or heart-softening."
wings: [ideas, words]
themes: [scripture-and-its-sciences]
question:
  ar: "هل يُتساهل في رواة أحاديث فضائل الأعمال ما لا يُتساهل في رواة أحاديث الأحكام؟"
  en: "May the transmitters of reports on virtuous deeds be treated more leniently than those of legal reports?"
issue:
  ar: "التفريق بين أحاديث الأحكام وأحاديث الترغيب والترهيب في شروط الرواة."
  en: "Distinguishing legal reports from reports of encouragement and warning in the conditions required of transmitters."
short_answer:
  ar: "نقل الخطيب عن غير واحد من السلف أن أحاديث التحليل والتحريم لا تُحمل إلا عمن برئ من التهمة، وأن أحاديث الترغيب والمواعظ يجوز كتبها عن سائر المشايخ؛ وقال أحمد: إذا روينا في الحلال والحرام تشددنا في الأسانيد، وإذا روينا في فضائل الأعمال تساهلنا."
  en: "Al-Khatib reports from several early scholars that reports on the lawful and unlawful may be carried only from men free of suspicion, while reports of encouragement and admonition may be written from shaykhs generally; Ahmad said: when we narrate on the lawful and unlawful we are strict about chains, and when we narrate on virtuous deeds we are lenient."
perspectives:
  - tradition: sunni
    id: sunni-tafriq
    standing: main
    stance: { ar: "التشدد في الأحكام والتساهل في الفضائل", en: "Strictness in legal reports, leniency in virtues" }
    summary:
      ar: "سفيان الثوري: لا تأخذوا علم الحلال والحرام إلا من الرؤساء المشهورين بالعلم، ولا بأس بما سوى ذلك من المشايخ؛ ابن عيينة: لا تسمعوا من بقية ما كان في سنة، واسمعوا منه ما كان في ثواب وغيره؛ أحمد بن حنبل: نتشدد في أسانيد الحلال والحرام والسنن والأحكام، ونتساهل في فضائل الأعمال وما لا يضع حكماً ولا يرفعه، وأحاديث الرقاق يُحتمل أن يُتساهل فيها حتى يجيء شيء فيه حكم؛ أبو زكريا العنبري: الخبر الذي لا يحرّم حلالاً ولا يحلّ حراماً ولا يوجب حكماً يُغمض عنه ويُتساهل في رواته."
      en: "Sufyan al-Thawri: take the knowledge of the lawful and unlawful only from leaders known for learning; there is no harm in other shaykhs for the rest; Ibn Uyayna: do not hear from Baqiyya what concerns a sunna, but hear from him what concerns reward and the like; Ahmad ibn Hanbal: we are strict in the chains of the lawful and unlawful, sunnas and rulings, and lenient in virtuous deeds and what neither sets nor lifts a ruling, and heart-softening reports may be treated leniently until something with a ruling comes; Abu Zakariyya al-Anbari: a report that neither forbids the lawful, permits the forbidden nor establishes a ruling is passed over and its transmitters treated leniently."
    holders: [person/sufyan-al-thawri, person/sufyan-ibn-uyayna, person/ahmad-ibn-hanbal, person/al-khatib-al-baghdadi-ahmad]
