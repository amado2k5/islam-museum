id: question/what-is-ihram
class: question
label:
  ar: ما الإحرام؟
  en: What is ihram?
  es: "¿Qué es el ihram?"
  fr: "Qu'est-ce que l'ihram ?"
  ur: "احرام کیا ہے؟"
  tr: "İhram nedir?"
  id: "Apa itu Ihram?"
summary:
  ar: الإحرام هو نية الدخول في نسك الحج أو العمرة مع لباسها الموحد واجتناب محظوراتها؛ يبدأ من المواقيت
    المكانية.
  en: "Ihram is the intention to enter the rites of Hajj or Umrah, with their uniform garb and abstention from what is forbidden in them. It begins at the fixed places of entry (mawaqit)."
  es: "El ihram es la intención de participar en los ritos del Hajj o la Umrah, con su vestimenta uniforme y absteniéndose de lo que está prohibido en ellos. Comienza en los lugares de entrada establecidos (mawaqit)."
  fr: "L'ihram est l'intention d'accomplir les rites du Hajj ou de la Omra, en revêtant les vêtements uniformes et en s'abstenant de ce qui y est interdit. Il débute aux points d'entrée fixes (mawaqit)."
  ur: "احرام حج یا عمرہ کے مناسک میں یکساں لباس کے ساتھ داخل ہونے کا ارادہ ہے اور ان چیزوں سے پرہیز کرنا ہے جو ان میں حرام ہیں۔ یہ داخلے کے مقررہ مقامات سے شروع ہوتا ہے۔"
  tr: "İhram, hac veya umre ayinine üniforma giysiyle girilmek ve yasaklarından kaçınmak amacıyla yapılır; mekânsal mikatlardan başlar."
  id: "Ihram adalah niat untuk memasuki ritual Haji atau Umrah dengan mengenakan pakaian seragam dan menghindari larangannya; ritual ini dimulai dari miqat spasial."
question:
  ar: ما الإحرام؟
short_answer:
  ar: الإحرام هو نية الدخول في نسك الحج أو العمرة مع لباسها الموحد واجتناب محظوراتها؛ يبدأ من المواقيت
    المكانية.
long_answer:
  ar: 'الإحرام هو الدخول في نسك الحج أو العمرة بالنية مع لباس خاص: رداء وإزار أبيضان للرجال، والثياب المعتادة
    للنساء بلا برقع ولا قفازين، واجتناب الطيب والحلق والنكاح والصيد. يبدأ من مواقيت مكانية حددتها السنّة
    عند مداخل مكة. {cite:wikidata}'
