    المكانية.
long_answer:
  ar: 'الإحرام هو الدخول في نسك الحج أو العمرة بالنية مع لباس خاص: رداء وإزار أبيضان للرجال، والثياب المعتادة
    للنساء بلا برقع ولا قفازين، واجتناب الطيب والحلق والنكاح والصيد. يبدأ من مواقيت مكانية حددتها السنّة
    عند مداخل مكة. {cite:wikidata}'
