id: question/who-was-yunus
class: question
label:
  ar: من كان يونس ذا النون؟
  en: Who was Yunus, the one of the whale?
  es: "¿Quién era Yunus, el de la ballena?"
  fr: "Qui était Yunus, celui de la baleine ?"
  ur: "وہیل مچھلی میں سے یونس کون تھا؟"
  tr: "Yunus Rahibe kimdi?"
  id: "Siapa Yunus si Biarawati?"
summary:
  ar: يونس بن متى ذو النون؛ غضب على قومه فركب السفينة فابتلعه الحوت فنادى في الظلمات فنجاه الله وآمنت
    له نينوى كلها.
  en: "Yunus ibn Matta, Dhu al-Nun. He was angry with his people and boarded a ship. A fish swallowed him, and he called out in the darknesses, and God saved him. All of Nineveh then believed in him."
  es: "Yunus ibn Matta, Dhu al-Nun. Enojado con su pueblo, embarcó en un navío. Un pez lo tragó, clamó en la oscuridad y Dios lo salvó. Toda Nínive creyó en él."
  fr: "Yunus ibn Matta, Dhu al-Nun. Il était en colère contre son peuple et embarqua sur un navire. Un poisson l'avala, et il appela à l'aide dans les ténèbres; Dieu le sauva. Alors, toute la ville de Ninive crut en lui."
  ur: "یونس بن متہ، ذو النون۔ وہ اپنے لوگوں سے ناراض ہو کر جہاز میں سوار ہو گیا۔ ایک مچھلی نے اسے نگل لیا، اور اس نے اندھیرے میں پکارا، اور خدا نے اسے بچا لیا۔ تب نینوہ کے تمام لوگ اس پر ایمان لائے۔"
  tr: "Yunus ibn Mata Dhu al-Nun; halkına kızdı, gemiye bindi ve balina onu yuttu. Karanlıkta seslendi, Tanrı onu kurtardı ve tüm Ninovalılar ona inandı."
  id: "Yunus ibn Mata Dhu al-Nun; ia menjadi marah kepada rakyatnya, sehingga ia naik ke kapal, dan paus menelannya. Ia berseru dalam kegelapan, dan Tuhan menyelamatkannya, dan seluruh Niniwe percaya kepadanya."
question:
  ar: من كان يونس ذا النون؟
short_answer:
  ar: يونس بن متى ذو النون؛ غضب على قومه فركب السفينة فابتلعه الحوت فنادى في الظلمات فنجاه الله وآمنت
    له نينوى كلها.
long_answer:
  ar: '[[person/yunus|يونس]] أرسل إلى نينوى فغادرها غاضبًا قبل أذن الله؛ التقمه الحوت فنادى لا إله إلا
    أنت سبحانك إني كنت من الظالمين فنجاه؛ عاد فوجد قومه كلهم آمنوا وهم أول أمة آمنت جملة. {cite:wikidata}'
