    stance: { ar: "الآية نزلت في علي حين تصدق بخاتمه راكعاً، والولي المتصرف", en: "The verse was revealed about Ali when he gave his ring while bowing; wali means the one with authority", ur: "آیت علی کے بارے میں نازل ہوئی جب انہوں نے رکوع میں انگوٹھی دی؛ ولی کا معنی صاحبِ تصرف ہے" }
    summary: { ar: "في نقل ابن تيمية: يقول الحلي إنهم أجمعوا على نزولها في علي، ويروي من تفسير الثعلبي بإسناده إلى أبي ذر أن سائلاً سأل في المسجد فلم يعطه أحد، وكان علي راكعاً فأومأ إليه بخنصره وفيها خاتم، فدعا النبي بدعاء موسى في هارون، فنزلت الآية؛ وينقل عن ابن المغازلي الواسطي الشافعي نزولها في علي، ويرى أن الولي هو المتصرف وقد أثبت الله له الولاية كما أثبتها لنفسه ولرسوله.", en: "As Ibn Taymiyya reports: al-Hilli says there is consensus that it was revealed about Ali, and relates from al-Tha'labi's commentary, with a chain to Abu Dharr, that a beggar asked in the mosque and no one gave him anything; Ali, bowing, pointed his little finger, which bore a ring, towards him; the Prophet prayed with Moses' prayer for Aaron, and the verse was revealed. He also cites Ibn al-Maghazili al-Wasiti the Shafi'i for its revelation about Ali, and holds that wali means the one with authority, which God affirmed for Ali as He affirmed it for Himself and His Messenger.", ur: "ابن تیمیہ کی نقل میں: حلی کہتے ہیں کہ اس پر اجماع ہے کہ یہ علی کے بارے میں نازل ہوئی، اور تفسیرِ ثعلبی سے ابو ذر تک سند کے ساتھ روایت کرتے ہیں کہ ایک سائل نے مسجد میں سوال کیا اور کسی نے کچھ نہ دیا؛ علی رکوع میں تھے اور انہوں نے اپنی چھوٹی انگلی، جس میں انگوٹھی تھی، اس کی طرف بڑھائی؛ نبی نے ہارون کے لیے موسیٰ والی دعا کی، اور آیت نازل ہوئی۔ وہ ابن المغازلی واسطی شافعی سے بھی اس کا علی کے بارے میں نزول نقل کرتے ہیں، اور کہتے ہیں کہ ولی کا معنی صاحبِ تصرف ہے جسے اللہ نے علی کے لیے ثابت کیا جیسے اپنے اور اپنے رسول کے لیے۔" }
