id: question/does-the-verse-of-wilaya-refer-to-ali
class: question
label: { ar: "هل نزلت آية «إنما وليكم الله ورسوله» في علي؟", en: "Was the verse 'Your friend is only God and His Messenger' revealed about Ali?", ur: "کیا آیت «تمہارا دوست تو بس اللہ اور اس کا رسول ہے» علی کے بارے میں نازل ہوئی؟" }
summary:
  ar: "جعل ابن المطهر الحلي آية المائدة 55 أول براهينه القرآنية على إمامة علي، ونقل الإجماع على نزولها فيه حين تصدق بخاتمه وهو راكع، وجعل الولي فيها المتصرف؛ وردّ ابن تيمية في منهاج السنة بأن القصة موضوعة عند أهل الحديث، وأن «الذين» صيغة جمع، وأن إيتاء الزكاة في الركوع ليس ممدوحاً عند أحد، وأن سياق الآيات في النهي عن موالاة الكفار والأمر بموالاة المؤمنين."
  en: "Ibn al-Mutahhar al-Hilli made al-Ma'ida 5:55 the first of his Qur'anic proofs of Ali's imamate, claiming consensus that it was revealed about him when he gave his ring in charity while bowing in prayer, and taking wali in it to mean the one with authority. Ibn Taymiyya replied in Minhaj al-Sunna that the story is fabricated according to the hadith scholars, that 'those who' is plural, that giving zakat while bowing is praised by no scholar, and that the context of the verses concerns forbidding alliance with unbelievers and commanding alliance among believers."
  ur: "ابن المطہر حلی نے سورۂ مائدہ کی آیت 55 کو علی کی امامت پر اپنی پہلی قرآنی دلیل بنایا، اس پر اجماع نقل کیا کہ یہ ان کے بارے میں نازل ہوئی جب انہوں نے رکوع میں اپنی انگوٹھی صدقہ کی، اور اس میں ولی کا معنی صاحبِ تصرف لیا؛ ابن تیمیہ نے منہاج السنہ میں جواب دیا کہ محدثین کے نزدیک یہ قصہ موضوع ہے، «الذین» جمع کا صیغہ ہے، رکوع میں زکوٰۃ دینا کسی عالم کے نزدیک قابلِ تعریف نہیں، اور آیات کا سیاق کفار سے دوستی کی ممانعت اور مومنوں سے دوستی کے حکم کا ہے۔"
question: { ar: "هل نزلت آية الولاية في علي، وهل تدل على إمامته؟", en: "Was the verse of friendship revealed about Ali, and does it indicate his imamate?", ur: "کیا آیتِ ولایت علی کے بارے میں نازل ہوئی، اور کیا یہ ان کی امامت پر دلالت کرتی ہے؟" }
issue:
  ar: "هل ثبتت قصة التصدق بالخاتم في الركوع، وهل «الذين آمنوا» في الآية فرد معين أم عموم المؤمنين، وهل الولي فيها المتصرف أم الموالي؟"
  en: "Is the story of the ring given in charity while bowing established; are 'those who believe' in the verse one particular person or the believers in general; and does wali mean the one with authority or the friend?"
  ur: "کیا رکوع میں انگوٹھی صدقہ کرنے کا قصہ ثابت ہے؛ کیا آیت میں «الذین آمنوا» کوئی خاص شخص ہے یا عام مومن؛ اور کیا ولی کا معنی صاحبِ تصرف ہے یا دوست؟"
short_answer:
  ar: "ابن تيمية ⁦(أهل السنة)⁩: القصة موضوعة، والآية في موالاة المؤمنين عامة في سياق النهي عن موالاة اليهود والنصارى. الإمامية كما ينقلهم: نزلت في علي بإجماع، والولي المتصرف، فهي نص على إمامته."
  en: "Ibn Taymiyya (Sunni): the story is fabricated; the verse is about alliance among believers in general, in the context of forbidding alliance with Jews and Christians. The Imamiyya as he reports them: it was revealed about Ali by consensus, and wali means the one with authority, so it designates his imamate."
  ur: "ابن تیمیہ (اہلِ سنت): قصہ موضوع ہے؛ آیت یہود و نصاریٰ سے دوستی کی ممانعت کے سیاق میں عام مومنوں کی باہمی دوستی کے بارے میں ہے۔ امامیہ، جیسا وہ نقل کرتے ہیں: یہ اجماعاً علی کے بارے میں نازل ہوئی، اور ولی کا معنی صاحبِ تصرف ہے، لہٰذا یہ ان کی امامت پر نص ہے۔"
perspectives:
  - tradition: sunni-hanbali
    id: ibn-taymiyya-minhaj-wilaya-verse
    standing: main
    stance: { ar: "الآية عامة في موالاة المؤمنين، وقصة الخاتم موضوعة", en: "The verse concerns alliance among believers in general; the ring story is fabricated", ur: "آیت عام مومنوں کی باہمی دوستی کے بارے میں ہے؛ انگوٹھی کا قصہ موضوع ہے" }
    summary: { ar: "يرى ابن تيمية أن عزو الخبر إلى تفسير الثعلبي لا يقوم به حجة لأن الثعلبي يروي الموضوعات، وأن أهل العلم بالحديث أجمعوا على أن القصة موضوعة، وأن «الذين» صيغة جمع لا تصدق على واحد، وأن الصدقة في الصلاة لو كانت مشروعة لم تختص بالركوع، وأن إعطاء الخاتم لا يجزئ في الزكاة عند كثير من الفقهاء، وأن سياق الآيات من النهي عن موالاة اليهود والنصارى إلى الأمر بموالاة الله ورسوله والمؤمنين.", en: "Ibn Taymiyya holds that attributing the report to al-Tha'labi's commentary proves nothing, since al-Tha'labi transmits fabrications; that the hadith scholars agree the story is fabricated; that 'those who' is a plural that cannot apply to one person; that charity during prayer, were it prescribed, would not be confined to bowing; that giving a ring does not count as zakat for many jurists; and that the context runs from forbidding alliance with Jews and Christians to commanding alliance with God, His Messenger and the believers.", ur: "ابن تیمیہ کے نزدیک ثعلبی کی تفسیر کی طرف نسبت سے حجت قائم نہیں ہوتی کیونکہ ثعلبی موضوع روایات نقل کرتے ہیں؛ محدثین کا اجماع ہے کہ قصہ موضوع ہے؛ «الذین» جمع کا صیغہ ہے جو ایک شخص پر صادق نہیں آتا؛ نماز میں صدقہ اگر مشروع ہوتا تو رکوع کے ساتھ خاص نہ ہوتا؛ بہت سے فقہاء کے نزدیک انگوٹھی دینا زکوٰۃ میں کافی نہیں؛ اور سیاق یہود و نصاریٰ سے دوستی کی ممانعت سے اللہ، اس کے رسول اور مومنوں سے دوستی کے حکم تک چلتا ہے۔" }
