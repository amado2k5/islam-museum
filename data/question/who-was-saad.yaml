id: question/who-was-saad
class: question
label:
  ar: من كان سعد بن أبي وقاص؟
  en: Who was Saad ibn Abi Waqqas?
  es: "¿Quién fue Saad ibn Abi Waqqas?"
  fr: "Qui était Saad ibn Abi Waqqas ?"
  ur: "سعد ابن ابی وقاص کون تھے؟"
  tr: "Sa'd ibn Ebi Vaqqas kimdi?"
  id: "Siapakah Sa'd ibn Abi Waqqas?"
summary:
  ar: سعد بن أبي وقاص أول من رمى بسهم في سبيل الله ومجاب الدعوة؛ قائد القادسية وفاتح فارس ومؤسس الكوفة.
  en: "Saad ibn Abi Waqqas, the first to shoot an arrow in the cause of God and one whose supplications are answered; commander at al-Qadisiyya, conqueror of Persia and founder of Kufa."
  es: "Saad ibn Abi Waqqas, el primero en disparar una flecha en la causa de Dios y aquel cuyas súplicas son respondidas; comandante en al-Qadisiyya, conquistador de Persia y fundador de Kufa."
  fr: "Saad ibn Abi Waqqas, le premier à tirer une flèche pour la cause de Dieu et celui dont les supplications sont exaucées; commandant à al-Qadisiyya, conquérant de la Perse et fondateur de Kufa."
  ur: "سعد بن ابی وقاص، سب سے پہلے خدا کی راہ میں تیر مارنے والے اور جن کی دعا قبول ہوتی ہے۔ القدسیہ کا کمانڈر، فارس کا فاتح اور کوفہ کا بانی۔"
  tr: "Sa'd ibn Abi Wakkas, Allah'ın yoluna ilk ok atan ve çağrıyı kabul eden kişiydi; Kadisiyyah'ın komutanı, Perslerin fatihi ve Kufe'nin kurucusuydu."
  id: "Sa'd ibn Abi Waqqas adalah yang pertama menembakkan panah ke jalan Allah dan menerima panggilan itu; komandan Qadisiyyah, penakluk Persia, dan pendiri Kufa."
question:
  ar: من كان سعد بن أبي وقاص؟
short_answer:
  ar: سعد بن أبي وقاص أول من رمى بسهم في سبيل الله ومجاب الدعوة؛ قائد القادسية وفاتح فارس ومؤسس الكوفة.
long_answer:
  ar: '[[person/saad-ibn-abi-waqqas|سعد]] من السابقين الأوائل ومن العشرة المبشرين؛ قاد جيش القادسية ففتح
    فارس وأسس الكوفة 638؛ كان النبي يقول له ارم فداك أبي وأمي؛ مات في العقيق 55هـ آخر من مات من العشرة.
