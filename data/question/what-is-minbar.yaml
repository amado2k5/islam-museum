id: question/what-is-minbar
class: question
label:
  ar: ما المنبر؟
  en: What is the minbar?
  es: "¿Qué es el minbar?"
  fr: "Qu'est-ce que le minbar ?"
  ur: "منبر کیا ہے؟"
  tr: "Vaaz kürsüsü nedir?"
  id: "Apa itu mimbar?"
summary:
  ar: المنبر هو منصة الخطبة التي يصعدها الخطيب في الجمعة؛ بدأ ثلاث درجات في مسجد النبي فصار من أعظم فنون
    الخشب الإسلامي.
  en: "The minbar is the platform from which the preacher ascends to deliver the Friday sermon. It began as three steps in the Prophet's mosque and became one of the greatest arts of Islamic woodwork."
  es: "El minbar es la plataforma desde la que el predicador asciende para pronunciar el sermón del viernes. Comenzó como tres escalones en la mezquita del Profeta y se convirtió en una de las mayores expresiones artísticas de la ebanistería islámica."
  fr: "Le minbar est la plateforme d'où le prédicateur monte pour prononcer le sermon du vendredi. À l'origine composé de trois marches dans la mosquée du Prophète, il est devenu l'un des plus beaux exemples d'art de la menuiserie islamique."
  ur: "منبر وہ پلیٹ فارم ہے جہاں سے مبلغ جمعہ کا خطبہ دینے کے لیے چڑھتا ہے۔ یہ مسجد نبوی میں تین قدموں سے شروع ہوا اور اسلامی لکڑی کے کام کے عظیم ترین فنون میں سے ایک بن گیا۔"
  tr: "Vaaz kürsüsü, vaizin Cuma günü yükseldiği vaazın platformudur; Peygamber Camii'nde üç basamakla başlamış ve en büyük İslami ahşap işçiliği sanatlarından biri olmuştur."
  id: "Mimbar adalah panggung untuk khotbah yang dinaiki pengkhotbah pada hari Jumat; mimbar ini memulai tiga langkah di Masjid Nabi dan menjadi salah satu seni pertukangan kayu Islam yang terbesar."
question:
  ar: ما المنبر؟
short_answer:
  ar: المنبر هو منصة الخطبة التي يصعدها الخطيب في الجمعة؛ بدأ ثلاث درجات في مسجد النبي فصار من أعظم فنون
    الخشب الإسلامي.
long_answer:
  ar: 'المنبر هو الدرج التي يخطب منها الإمام يوم الجمعة. كان منبر النبي ثلاث درجات من طمأثة أو جذع، فلما
    كبرت المساجد صارت المنابر أعمالًا فنية كبرى: منبر الكوتبية المؤكسج بقرطبة ومنبر الناصر محمد ومنبر
    صلاح الدين في الأقصى الذي أحرق 1969. {cite:wikidata}'
