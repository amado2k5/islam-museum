    الخشب الإسلامي.
long_answer:
  ar: 'المنبر هو الدرج التي يخطب منها الإمام يوم الجمعة. كان منبر النبي ثلاث درجات من طمأثة أو جذع، فلما
    كبرت المساجد صارت المنابر أعمالًا فنية كبرى: منبر الكوتبية المؤكسج بقرطبة ومنبر الناصر محمد ومنبر
    صلاح الدين في الأقصى الذي أحرق 1969. {cite:wikidata}'
