id: question/what-is-hadith
class: question
label:
  ar: "ما الحديث النبوي؟"
  en: What is the Prophetic hadith?
  es: "¿Qué es el hadiz profético?"
  fr: "Qu'est-ce qu'un hadith prophétique ?"
  ur: "حدیث نبوی کیا ہے؟"
  tr: "Peygamberlik Hadis nedir?"
  id: "Apa itu Hadis Nabi?"
summary:
  ar: "الحديث النبوي ما نُقل عن النبي من قول أو فعل أو تقرير، وهو المصدر الثاني للتشريع بعد القرآن عند المسلمين."
  en: "The Prophetic hadith is what was transmitted from the Prophet in word, deed or tacit approval. For Muslims it is the second source of legislation after the Qur'an."
  es: "El hadiz profético es lo que el Profeta transmitió de palabra, obra o aprobación tácita. Para los musulmanes, es la segunda fuente de legislación después del Corán."
  fr: "Le hadith prophétique désigne ce qui a été transmis par le Prophète, que ce soit par la parole, par l'acte ou par une approbation tacite. Pour les musulmans, il constitue la deuxième source de législation après le Coran."
  ur: "حدیث نبوی وہ ہے جو رسول اللہ سے قول، فعل یا ظاہری منظوری میں منتقل ہوئی ہو۔ مسلمانوں کے لیے یہ قرآن کے بعد قانون سازی کا دوسرا ذریعہ ہے۔"
  tr: "Peygamberlik hadisi, Peygamber'den söylenen, eylem veya onay şeklinde aktarılan bir şeydir ve Müslümanlar arasında Kur'an'dan sonra ikinci yasal düzenleme kaynağıdır."
  id: "Hadis nabi adalah apa yang telah diwariskan dari Nabi dalam hal ucapan, tindakan, atau persetujuan, dan merupakan sumber legislasi kedua setelah Al-Qur'an di kalangan umat Islam."
