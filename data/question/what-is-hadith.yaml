id: question/what-is-hadith
class: question
label:
  ar: "ما الحديث النبوي؟"
  en: What is the Prophetic hadith?
summary:
  ar: "الحديث النبوي ما نُقل عن النبي من قول أو فعل أو تقرير، وهو المصدر الثاني للتشريع بعد القرآن عند المسلمين."
  en: "The Prophetic hadith is what was transmitted from the Prophet in word, deed or tacit approval. For Muslims it is the second source of legislation after the Qur'an."
wings: []
question:
  ar: "ما الحديث النبوي؟"
short_answer:
  ar: "الحديث النبوي ما نُقل عن النبي من قول أو فعل أو تقرير، وهو المصدر الثاني للتشريع بعد القرآن عند المسلمين."
long_answer:
  ar: |
    جُمع الحديث في دواوين كبرى ك[[work/sahih-al-bukhari|صحيح البخاري]] وصحيح مسلم، ونشأ لخدمته علم [[concept/mustalah-al-hadith|مصطلح الحديث]].
    ويعرض مدخل [[concept/al-hadith-al-nabawi|الحديث النبوي]] معناه ومصنفاته، ويرتبط ب[[work/quran|القرآن]] في أصول التشريع.

