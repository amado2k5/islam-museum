id: question/what-was-the-golden-age
class: question
label:
  ar: ما العصر الذهبي للإسلام؟
  en: What was the Islamic Golden Age?
  es: "¿Qué fue la Edad de Oro del Islam?"
  fr: "Qu’est-ce que l’âge d’or islamique ?"
  ur: "اسلامی سنہری دور کیا تھا؟"
  tr: "İslam'ın Altın Çağı nedir?"
  id: "Apa itu Zaman Keemasan Islam?"
summary:
  ar: العصر الذهبي قرون الازدهار العلمي من بغداد العباسية إلى الأندلس وفاطمية مصر؛ ترجم فيها التراث وأنتج
    العلماء في الطب والفلك والرياضيات.
  en: "The Golden Age: centuries of scientific flourishing, from Abbasid Baghdad to al-Andalus and Fatimid Egypt; in it the heritage was translated and scholars produced work in medicine, astronomy and mathematics."
  es: "La Edad de Oro: siglos de florecimiento científico, desde el Bagdad abasí hasta al-Ándalus y el Egipto fatimí; en ella se tradujo el legado y los eruditos produjeron obras en medicina, astronomía y matemáticas."
  fr: "L'âge d'or: des siècles d'épanouissement scientifique, de Bagdad abbasside à al-Andalus et à l'Égypte fatimide; durant cette période, l'héritage fut traduit et les savants produisirent des ouvrages en médecine, en astronomie et en mathématiques."
  ur: "سنہری دور: عباسی بغداد سے لے کر الاندلس اور فاطمی مصر تک سائنسی ترقی کی صدیوں؛ اس میں ورثے کا ترجمہ کیا گیا اور علما نے طب، فلکیات اور ریاضی میں کام کیا۔"
  tr: "Altın Çağ: Abbasi Bağdat'tan Endülüs ve Fatımi Mısır'a kadar yüzyıllar süren bilimsel refah; bu dönemde miras aktarıldı ve tıp, astronomi ve matematik alanlarında bilim insanları yetiştirildi."
  id: "Zaman Keemasan: Berabad-abad kemakmuran ilmiah dari Baghdad Abbasiyah hingga Mesir al-Andalus dan Fatimiyah; selama periode ini, warisan diterjemahkan dan para sarjana di bidang kedokteran, astronomi, dan matematika dihasilkan."
question:
  ar: ما العصر الذهبي للإسلام؟
short_answer:
  ar: العصر الذهبي قرون الازدهار العلمي من بغداد العباسية إلى الأندلس وفاطمية مصر؛ ترجم فيها التراث وأنتج
    العلماء في الطب والفلك والرياضيات.
long_answer:
  ar: العصر الذهبي مصطلح لعصور الازدهار العلمي في بغداد وقرطبة والقاهرة والقيروان؛ شهدت دار الحكمة والترجمات
    الكبرى والقانون في الطب والجبر والبصريات والكيمياء. يقول النقاد إنه صورة مبسطة لعصور متباينة، لكن
    يبقى إرث علمي عميق. {cite:wikidata}
