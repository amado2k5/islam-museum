question:
  ar: ما العصر الذهبي للإسلام؟
short_answer:
  ar: العصر الذهبي قرون الازدهار العلمي من بغداد العباسية إلى الأندلس وفاطمية مصر؛ ترجم فيها التراث وأنتج
    العلماء في الطب والفلك والرياضيات.
long_answer:
  ar: العصر الذهبي مصطلح لعصور الازدهار العلمي في بغداد وقرطبة والقاهرة والقيروان؛ شهدت دار الحكمة والترجمات
    الكبرى والقانون في الطب والجبر والبصريات والكيمياء. يقول النقاد إنه صورة مبسطة لعصور متباينة، لكن
    يبقى إرث علمي عميق. {cite:wikidata}
