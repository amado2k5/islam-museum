id: question/is-the-default-ruling-of-things-permissibility
class: question
label: { ar: "هل الأصل في الأشياء الإباحة؟", en: "Is the default ruling of things permissibility?", ur: "کیا اشیا میں اصل اباحت ہے؟" }
summary:
  ar: "مسألة أصولية يختم بها الشوكاني «إرشاد الفحول»: ما لم يرد فيه دليل يخصه أو يخص نوعه، هل الأصل فيه الإباحة أو المنع أو التوقف؟ يحكي الإباحة عن جماعة من الفقهاء والشافعية وعن محمد بن عبد الله بن عبد الحكم، والمنع عن غيرهم، والوقف عن الأشعري وأبي بكر الصيرفي وبعض الشافعية، والتفصيل عن الرازي: الأصل في المنافع الإذن وفي المضار المنع. {cite:irshad-al-fuhul-dar-al-fikr p.286} {cite:irshad-al-fuhul-dar-al-fikr p.287}"
  en: "A question of legal theory with which al-Shawkani closes Irshad al-Fuhul: where no proof addresses a thing or its kind, is the default permissibility, prohibition or suspension of judgement? He reports permissibility from a group of jurists and Shafi'is and from Muhammad ibn Abd Allah ibn Abd al-Hakam, prohibition from others, suspension from al-Ash'ari, Abu Bakr al-Sayrafi and some Shafi'is, and a distinction from al-Razi: the default for benefits is permission and for harms prohibition."
  ur: "اصولِ فقہ کا ایک مسئلہ جس پر شوکانی «ارشاد الفحول» ختم کرتے ہیں: جس چیز یا اس کی نوع کے بارے میں کوئی خاص دلیل نہ ہو، کیا اس میں اصل اباحت ہے، ممانعت ہے یا توقف؟ وہ اباحت فقہا اور شافعیہ کی ایک جماعت اور محمد بن عبد اللہ بن عبد الحکم سے، ممانعت دوسروں سے، توقف اشعری، ابو بکر صیرفی اور بعض شافعیہ سے، اور رازی سے تفصیل نقل کرتے ہیں: منافع میں اصل اجازت اور مضرّات میں ممانعت ہے۔"
question: { ar: "ما الأصل فيما سكت عنه الشرع ولم يرد فيه دليل يخصه؟", en: "What is the default for what the law is silent on?" }
issue: { ar: "إذا لم يرد في شيء من الأعيان أو المنافع دليل يخصه أو يخص نوعه، فهل يحكم فيه بالإباحة أو بالمنع حتى يرد الدليل أو يتوقف؟" }
short_answer:
  ar: "ثلاثة أقوال وتفصيل يحكيها الشوكاني: الإباحة، والمنع، والوقف، والتفصيل بين المنافع والمضار؛ ويسوق أدلة القائلين بالإباحة ويجيب عن أدلة القائلين بالمنع."
  en: "Three positions and a distinction, as al-Shawkani reports them: permissibility, prohibition, suspension, and the distinction between benefits and harms; he gives the proofs of those who hold permissibility and answers those who hold prohibition."
