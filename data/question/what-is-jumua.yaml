long_answer:
  ar: '[[practice/salat-al-jumua|صلاة الجمعة]] هي الاجتماع الأسبوعي للمسلمين يوم الجمعة وقت الظهر؛ تتقدمها
    خطبتان يصعد فيهما الإمام [[concept/minbar|المنبر]]، وهي ركعتان جهرية جماعة. ورد في فضلها أحاديث كثيرة
    وفرضها القرآن في سورتها المسماة باسمها. {cite:wikidata}'
