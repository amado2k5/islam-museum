id: question/what-is-jumua
class: question
label:
  ar: ما صلاة الجمعة؟
  en: What is the Friday prayer?
  es: "¿Cuál es la oración del viernes?"
  fr: "Qu'est-ce que la prière du vendredi ?"
  ur: "جمعہ کی نماز کیا ہے؟"
  tr: "Cuma namazı nedir?"
  id: "Apa itu doa Jumat?"
summary:
  ar: صلاة الجمعة هي صلاة الظهر الأسبوعية الجامعة يوم الجمعة؛ يسبقها خطبتان وهي واجبة على الرجال عند أكثر
    الفقهاء.
  en: "Friday prayer is the weekly congregational noon prayer held on Friday, preceded by two sermons. According to most jurists it is obligatory for men."
  es: "La oración del viernes es la oración congregacional semanal del mediodía que se celebra los viernes, precedida por dos sermones. Según la mayoría de los juristas, es obligatoria para los hombres."
  fr: "La prière du vendredi est la prière communautaire hebdomadaire de midi, célébrée le vendredi et précédée de deux sermons. Selon la plupart des juristes, elle est obligatoire pour les hommes."
  ur: "جمعہ کی نماز ہفتہ وار اجتماعی دوپہر کی نماز ہے جو جمعہ کو منعقد ہوتی ہے، اس سے پہلے دو خطبات ہوتے ہیں۔ اکثر فقہاء کے نزدیک یہ مردوں کے لیے واجب ہے۔"
  tr: "Cuma namazı, Cuma günleri haftalık birleşik Dhuhr duasıdır; iki vaazdan önce yapılır ve çoğu hukukçuya göre erkekler için zorunludur."
  id: "Doa Jumat adalah doa gabungan mingguan Dhuhr pada hari Jumat; didahului oleh dua khotbah dan menurut sebagian besar ahli hukum wajib bagi pria."
question:
  ar: ما صلاة الجمعة؟
short_answer:
  ar: صلاة الجمعة هي صلاة الظهر الأسبوعية الجامعة يوم الجمعة؛ يسبقها خطبتان وهي واجبة على الرجال عند أكثر
    الفقهاء.
long_answer:
  ar: '[[practice/salat-al-jumua|صلاة الجمعة]] هي الاجتماع الأسبوعي للمسلمين يوم الجمعة وقت الظهر؛ تتقدمها
    خطبتان يصعد فيهما الإمام [[concept/minbar|المنبر]]، وهي ركعتان جهرية جماعة. ورد في فضلها أحاديث كثيرة
    وفرضها القرآن في سورتها المسماة باسمها. {cite:wikidata}'
