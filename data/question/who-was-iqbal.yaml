class: question
label:
  ar: من كان محمد إقبال؟
  en: Who was Muhammad Iqbal?
  es: "¿Quién fue Muhammad Iqbal?"
  fr: "Qui était Muhammad Iqbal ?"
  ur: "محمد اقبال کون تھے؟"
  tr: "Muhammed İkbal kimdi?"
  id: "Siapakah Muhammad Iqbal?"
summary:
  ar: محمد إقبال (1877–1938) شاعر وفيلسوف هندي بالأردية والفارسية؛ دعا لإحياء الذات الإسلامية ويعد الأب
    الروحي لفكرة باكستان.
  en: "Muhammad Iqbal (1877–1938), an Indian poet and philosopher writing in Urdu and Persian, called for the revival of the Islamic self and is considered the spiritual father of the idea of Pakistan."
  es: "Muhammad Iqbal (1877-1938), poeta y filósofo indio que escribía en urdu y persa, abogó por el resurgimiento de la identidad islámica y es considerado el padre espiritual de la idea de Pakistán."
  fr: "Muhammad Iqbal (1877-1938), poète et philosophe indien écrivant en ourdou et en persan, a appelé à la renaissance de l'identité islamique et est considéré comme le père spirituel de l'idée du Pakistan."
  ur: "محمد اقبال (1877-1938)، اردو اور فارسی میں لکھنے والے ایک ہندوستانی شاعر اور فلسفی نے اسلامی خودی کے احیاء پر زور دیا اور انہیں پاکستان کے تصور کا روحانی باپ سمجھا جاتا ہے۔"
  tr: "Muhammad Iqbal (1877–1938), Urduca ve Farsça dilinde Hintli bir şair ve filozoftu; İslami benliğin yeniden canlandırılmasını savundu ve Pakistan fikrinin manevi babası olarak kabul edilir."
  id: "Muhammad Iqbal (1877–1938) adalah seorang penyair dan filsuf India dalam bahasa Urdu dan Persia; ia memperjuangkan kebangkitan diri Islam dan dianggap sebagai bapak spiritual gagasan Pakistan."
question:
  ar: من كان محمد إقبال؟
short_answer:
  ar: محمد إقبال (1877–1938) شاعر وفيلسوف هندي بالأردية والفارسية؛ دعا لإحياء الذات الإسلامية ويعد الأب
    الروحي لفكرة باكستان.
long_answer:
  ar: '[[person/muhammad-iqbal|محمد إقبال]] من أعظم شعراء الإسلام الحديث؛ درس الفلسفة في كامبريدج وميونخ
    ثم دعا في شعره الفارسي والأردي إلى إحياء الأمة واجتهادها. في خطبته الشهيرة 1930 طرح فكرة دولة لمسلمي
    الهند الشمالية الغربية التي تحققت لاحقًا بباكستان. {cite:wikidata}'
