long_answer:
  ar: '[[person/muhammad-iqbal|محمد إقبال]] من أعظم شعراء الإسلام الحديث؛ درس الفلسفة في كامبريدج وميونخ
    ثم دعا في شعره الفارسي والأردي إلى إحياء الأمة واجتهادها. في خطبته الشهيرة 1930 طرح فكرة دولة لمسلمي
