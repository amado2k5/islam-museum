id: question/who-was-ibn-battuta
class: question
label:
  ar: من كان ابن بطوطة؟
  en: Who was Ibn Battuta?
  es: "¿Quién fue Ibn Battuta?"
  fr: "Qui était Ibn Battuta ?"
  ur: "ابن بطوطہ کون تھا؟"
  tr: "İbn Battuta kimdi?"
  id: "Siapakah Ibn Battuta?"
summary:
  ar: ابن بطوطة (1304–1369) أعظم رحالة العصور الوسطى؛ قطع نحو 120 ألف كم عبر العالم الإسلامي في ثلاثة
    عقود فكتب تحفة النظار.
  en: "Ibn Battuta (1304–1369) was the greatest traveller of the Middle Ages; he covered some 120,000 km across the Islamic world in three decades and wrote the Tuhfat al-Nuzzar."
  es: "Ibn Battuta (1304-1369) fue el mayor viajero de la Edad Media; recorrió unos 120.000 km por el mundo islámico en tres décadas y escribió el Tuhfat al-Nuzzar."
  fr: "Ibn Battuta (1304-1369) fut le plus grand voyageur du Moyen Âge; il parcourut quelque 120 000 km à travers le monde islamique en trois décennies et écrivit le Tuhfat al-Nuzzar."
  ur: "ابن بطوطہ (1304–1369) قرون وسطیٰ کا سب سے بڑا مسافر تھا۔ اس نے تین دہائیوں میں اسلامی دنیا میں تقریباً 120,000 کلومیٹر کا فاصلہ طے کیا اور تحفۃ النضر لکھی۔"
  tr: "İbn Battuta (1304–1369), Orta Çağ'ın en büyük gezginiydi; İslam dünyasında otuz yıl boyunca yaklaşık 120.000 km yol kat etti ve Tuhfat al-Nuzar'ı yazdı."
  id: "Ibn Battuta (1304–1369) adalah pelancong terbesar pada Abad Pertengahan; ia menempuh sekitar 120.000 km melintasi dunia Islam dalam tiga dekade dan menulis Tuhfat al-Nuzar."
question:
  ar: من كان ابن بطوطة؟
short_answer:
  ar: ابن بطوطة (1304–1369) أعظم رحالة العصور الوسطى؛ قطع نحو 120 ألف كم عبر العالم الإسلامي في ثلاثة
    عقود فكتب تحفة النظار.
long_answer:
  ar: '[[person/ibn-battuta|ابن بطوطة]] الطنجي؛ خرج للحج 1325 فلم يعد ثلاثين سنة: بلغ الصين والنيجر والأندلس
    وقاضيًا في المالديف ودلهي؛ أملى رحلته تحفة النظار في غرائب الأمصار فصارت أعظم كتاب جغرافي اجتماعي
    للعالم الإسلامي. {cite:wikidata}'
