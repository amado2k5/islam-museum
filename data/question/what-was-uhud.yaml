long_answer:
  ar: '[[event/battle-of-uhud|أُحد]] معركة قريش للثأر من بدر؛ هزم المسلمون أولًا ثم رمى الرماة جبلهم للغنيمة
    فالتفت خالد بخيله فكانت الهزيمة؛ استشهد حمزة وسبعون من أصحاب النبي وجُرح النبي؛ درسها في القرآن طاعة
