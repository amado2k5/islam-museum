id: question/what-is-haya
class: question
label:
  ar: ما الحياء؟
  en: What is haya?
  es: "¿Qué es haya?"
  fr: "Qu'est-ce que la haya ?"
  ur: "حیا کیا ہے؟"
summary:
  ar: الحياء خلق الإسلام؛ حبس النفس عن القبيح خشية الملم؛ قال النبي الحياء شعبة من الإيمان والحياء لا
    يأتي إلا بخير.
  en: "Haya (modesty) is a virtue of Islam: restraining oneself from what is shameful out of fear of blame. The Prophet said, 'Modesty is a branch of faith, and modesty brings only good.'"
  es: "La modestia (Haya) es una virtud del Islam: abstenerse de lo vergonzoso por temor a la censura. El Profeta dijo: «La modestia es una rama de la fe, y la modestia solo trae beneficios»."
  fr: "La pudeur (haya) est une vertu de l'islam: s'abstenir de ce qui est honteux par crainte du blâme. Le Prophète a dit: « La pudeur est une branche de la foi, et la pudeur n'apporte que du bien. »"
  ur: "حیا ⁦(حیا)⁩ اسلام کی ایک خوبی ہے: الزام کے خوف سے اپنے آپ کو شرمناک چیزوں سے روکنا۔ نبی نے فرمایا، 'حیا ایمان کی ایک شاخ ہے، اور حیا صرف بھلائی لاتی ہے۔'"
question:
  ar: ما الحياء؟
short_answer:
  ar: الحياء خلق الإسلام؛ حبس النفس عن القبيح خشية الملم؛ قال النبي الحياء شعبة من الإيمان والحياء لا
    يأتي إلا بخير.
long_answer:
  ar: '[[concept/haya|الحياء]] خلق محمود يحمل صاحبه على ترك القبيح وأداء الحق؛ من الإيمان عند النص، وصوره
    حياء من الله بمراقبته وحياء من الناس بترك الفواحش؛ ليس ضعفًا بل كمال عند العلماء. {cite:wikidata}'
