id: question/who-was-uthman
class: question
label:
  ar: من كان عثمان بن عفان؟
  en: Who was Uthman ibn Affan?
  es: "¿Quién fue Uthman ibn Affan?"
  fr: "Qui était Uthman ibn Affan ?"
  ur: "عثمان بن عفان کون تھے؟"
  tr: "Osman ibn Affan kimdi?"
  id: "Siapakah Uthman ibn Affan?"
summary:
  ar: عثمان بن عفان ثالث الخلفاء؛ من أهل بدر وزوج ابنتي النبي، وجمع القرآن في مصحف واحد، واغتيل في فتنة
    آخر عهده 656.
  en: "Uthman ibn Affan was the third caliph. He was among the people of Badr and married two of the Prophet's daughters. He compiled the Qur'an into a single codex (mushaf). He was assassinated in a strife at the end of his reign, in 656."
  es: "Uthman ibn Affan fue el tercer califa. Pertenecía al pueblo de Badr y se casó con dos de las hijas del Profeta. Compiló el Corán en un único códice (mushaf). Fue asesinado en una contienda al final de su reinado, en el año 656."
  fr: "Uthman ibn Affan fut le troisième calife. Originaire de Badr, il épousa deux des filles du Prophète. Il compila le Coran en un seul codex (mushaf). Il fut assassiné lors d'une rixe à la fin de son règne, en 656."
  ur: "عثمان بن عفان تیسرے خلیفہ تھے۔ وہ بدر کے لوگوں میں سے تھے اور انہوں نے رسول اللہ کی دو بیٹیوں سے شادی کی۔ اس نے قرآن کو ایک ہی ضابطہ ⁦(مصحف)⁩ میں مرتب کیا۔ اسے 656 میں اپنے دور حکومت کے آخر میں ایک جھگڑے میں قتل کر دیا گیا۔"
  tr: "Usman bin Affan, üçüncü halife; Badr halkından ve Peygamber'in iki kızının eşi. Kur'an'ı tek bir Muşaf halinde derledi ve saltanatının sonunda 656 Hicri yılında bir sıkıntıda suikasta uğradı."
  id: "Uthman ibn Affan, khalifah ketiga; dari bangsa Badr dan suami dua putri Nabi. Ia menyusun Al-Qur'an menjadi satu Mushaf dan dibunuh dalam kesusahan pada akhir pemerintahannya pada tahun 656 H."
question:
  ar: من كان عثمان بن عفان؟
short_answer:
  ar: عثمان بن عفان ثالث الخلفاء؛ من أهل بدر وزوج ابنتي النبي، وجمع القرآن في مصحف واحد، واغتيل في فتنة
    آخر عهده 656.
long_answer:
  ar: '[[person/uthman-ibn-affan|عثمان بن عفان]] من أقدم المهاجرين وراوية الحبشة الأولى وتزوج رقية ثم
    أم كلثوم. خليفته اثنتا عشرة سنة: استكمل الفتوح وبنى الأسطول وجمع الناس على مصحف واحد؛ ثم أحاطت به
    الفتنة فقُتل في داره 656 فكانت شرارة الفتنة الكبرى. {cite:wikidata}'
