  - tradition: academic
    id: babakr-critique
    standing: secondary
    stance: { ar: "لم يلتزم الطبري مبدأه، واشتط في رد قراءات صحيحة", en: "Al-Tabari did not keep his own principle and was harsh in rejecting sound readings", ur: "طبری اپنے اصول پر قائم نہ رہے اور صحیح قراءتوں کے رد میں سختی کی" }
    summary:
      ar: "يرى أحمد خالد بابكر أن الطبري لم يلتزم في «جامع البيان» المبدأ الذي رسمه في كتاب القراءات، فكان يحكّم اللغة في القراءات، وربما اشتط فوصف قراءات أجمعت الأمة على صحتها بعدم الفصاحة {cite:qiraat-inda-al-tabari-thesis-umm-al-qura p.1365}؛ ومن أمثلته رده قراءة ابن عامر في [[passage/quran-6-137|الأنعام: 137]] لأنها تفصل بين المتضايفين، وقراءة حمزة في [[passage/quran-3-181|آل عمران: 181]] لانفراده بها، وقراءة ابن كثير وأبي عمرو في [[passage/quran-6-105|الأنعام: 105]] {cite:qiraat-inda-al-tabari-thesis-umm-al-qura p.1381} {cite:qiraat-inda-al-tabari-thesis-umm-al-qura p.1382}. ويلتمس له عذرًا في أنه يحاول أن يبين موافقة الوجوه للعربية، وهو أحد شروط القبول، لكنه يسأل: هل له عذر في تضعيف ما أجمعت الأمة على صحته نقلًا وعربية مع موافقته للرسم؟ {cite:qiraat-inda-al-tabari-thesis-umm-al-qura p.1376} {cite:qiraat-inda-al-tabari-thesis-umm-al-qura p.1377}"
      en: "Ahmad Khalid Babakr finds that in Jami' al-Bayan al-Tabari did not keep the principle he set out in his book on the readings: he made language the judge of the readings and was at times harsh, calling readings the community accepted as sound lacking in eloquence {cite:qiraat-inda-al-tabari-thesis-umm-al-qura p.1365}. Examples are his rejection of Ibn Amir's reading in [[passage/quran-6-137|al-An'am 137]] because it separates the two terms of a genitive construction, of Hamza's in [[passage/quran-3-181|Al Imran 181]] because Hamza alone read it, and of Ibn Kathir's and Abu Amr's in [[passage/quran-6-105|al-An'am 105]] {cite:qiraat-inda-al-tabari-thesis-umm-al-qura p.1381} {cite:qiraat-inda-al-tabari-thesis-umm-al-qura p.1382}. He offers the excuse that al-Tabari was trying to show that the variants agree with Arabic, one of the conditions of acceptance, but asks whether there is any excuse for weakening what the community accepted as sound in transmission and in Arabic, and in agreement with the script {cite:qiraat-inda-al-tabari-thesis-umm-al-qura p.1376} {cite:qiraat-inda-al-tabari-thesis-umm-al-qura p.1377}."
      ur: "احمد خالد بابکر کے مطابق «جامع البیان» میں طبری اس اصول پر قائم نہ رہے جو انہوں نے کتاب القراءات میں طے کیا تھا: انہوں نے لغت کو قراءتوں پر حاکم بنایا اور بعض اوقات سختی سے امت کی مقبول صحیح قراءتوں کو غیر فصیح کہا {cite:qiraat-inda-al-tabari-thesis-umm-al-qura p.1365}۔ مثالوں میں [[passage/quran-6-137|الانعام: 137]] میں ابن عامر کی قراءت کا رد ہے کیونکہ اس میں مضاف اور مضاف الیہ کے درمیان فصل ہے، [[passage/quran-3-181|آل عمران: 181]] میں حمزہ کی قراءت کا رد ان کے تفرد کی بنا پر، اور [[passage/quran-6-105|الانعام: 105]] میں ابن کثیر اور ابو عمرو کی قراءت کا رد {cite:qiraat-inda-al-tabari-thesis-umm-al-qura p.1381} {cite:qiraat-inda-al-tabari-thesis-umm-al-qura p.1382}۔ وہ یہ عذر پیش کرتے ہیں کہ طبری وجوہ کی عربیت سے موافقت دکھانا چاہتے تھے جو قبولیت کی ایک شرط ہے، مگر پوچھتے ہیں کہ کیا اس کا کوئی عذر ہے کہ جو نقل اور عربیت میں امت کے نزدیک صحیح اور رسم کے موافق ہو اسے ضعیف کہا جائے؟ {cite:qiraat-inda-al-tabari-thesis-umm-al-qura p.1376} {cite:qiraat-inda-al-tabari-thesis-umm-al-qura p.1377}"
