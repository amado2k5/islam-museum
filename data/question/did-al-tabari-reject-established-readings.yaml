  - tradition: sunni
    id: ibn-al-jazari-transmission
    standing: main
    stance: { ar: "صحة النقل هي الركن الأساس، وما صح نقله وافق العربية والرسم", en: "Sound transmission is the chief pillar; what is soundly transmitted agrees with Arabic and the script", ur: "صحتِ نقل بنیادی رکن ہے؛ جو صحیح منقول ہو وہ عربیت اور رسم کے موافق ہوتا ہے" }
    summary:
      ar: "ينقل البحث عن [[person/ibn-al-jazari|ابن الجزري]] في «النشر» أن أئمة القراء لا يعملون في حروف القرآن على الأفشى في اللغة والأقيس في العربية بل على الأثبت في الأثر، وأن موافقة العربية «ولو بوجه» أحد شروط القبول، وأن بعض علماء القراءات جعلوا الشرط صحة النقل وحدها {cite:qiraat-inda-al-tabari-thesis-umm-al-qura p.92} {cite:qiraat-inda-al-tabari-thesis-umm-al-qura p.1376}؛ وأن إضافة الحروف إلى أئمة القراء إضافة اختيار ودوام ولزوم، لا إضافة اختراع ورأي واجتهاد {cite:qiraat-inda-al-tabari-thesis-umm-al-qura p.1378} {cite:qiraat-inda-al-tabari-thesis-umm-al-qura p.1379}."
      en: "The thesis cites [[person/ibn-al-jazari|Ibn al-Jazari]]'s al-Nashr: the imams of the readings do not act on what is most widespread in the language or most regular in grammar but on what is best established in transmission; agreement with Arabic 'even in one respect' is one of the conditions of acceptance, and some scholars of the readings made sound transmission the only condition {cite:qiraat-inda-al-tabari-thesis-umm-al-qura p.92} {cite:qiraat-inda-al-tabari-thesis-umm-al-qura p.1376}; and the attribution of readings to their imams is one of choice, constancy and adherence, not of invention, opinion or personal reasoning {cite:qiraat-inda-al-tabari-thesis-umm-al-qura p.1378} {cite:qiraat-inda-al-tabari-thesis-umm-al-qura p.1379}."
      ur: "مقالہ [[person/ibn-al-jazari|ابن الجزری]] کی «النشر» سے نقل کرتا ہے کہ ائمۂ قراءت قرآن کے حروف میں لغت میں زیادہ رائج یا عربیت میں زیادہ قیاسی پر نہیں بلکہ اثر میں زیادہ ثابت پر عمل کرتے ہیں؛ عربیت سے «کسی ایک وجہ سے بھی» موافقت قبولیت کی شرطوں میں سے ایک ہے، اور بعض علمائے قراءات نے صرف صحتِ نقل کو شرط قرار دیا {cite:qiraat-inda-al-tabari-thesis-umm-al-qura p.92} {cite:qiraat-inda-al-tabari-thesis-umm-al-qura p.1376}؛ اور حروف کی ائمۂ قراءت کی طرف نسبت اختیار، دوام اور التزام کی نسبت ہے، ایجاد، رائے یا اجتہاد کی نہیں {cite:qiraat-inda-al-tabari-thesis-umm-al-qura p.1378} {cite:qiraat-inda-al-tabari-thesis-umm-al-qura p.1379}۔"
