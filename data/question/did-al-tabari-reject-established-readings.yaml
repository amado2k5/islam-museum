issue:
  ar: "معيار قبول القراءة: صحة النقل أم موافقة العربية والرسم والأكثرية"
  en: "The standard for accepting a reading: sound transmission, or agreement with Arabic, the script and the majority"
  ur: "قراءت کی قبولیت کا معیار: صحتِ نقل، یا عربیت، رسم اور اکثریت سے موافقت"
sensitivity: contested
perspectives:
  - tradition: sunni
    id: tabari-own-standard
    standing: main
    stance: { ar: "ما صح وافق الرسم لا يُخطّأ قارئه، لكن المختار ما وافق الرسم وأكثر القراء والأفصح", en: "A sound reading agreeing with the script is not to be faulted, but the preferred one agrees with the script, most readers and the most eloquent Arabic", ur: "رسم کے موافق صحیح قراءت کے قاری کو غلط نہیں کہا جائے گا، مگر مختار وہ ہے جو رسم، اکثر قراء اور افصح عربی کے موافق ہو" }
    summary:
      ar: "ينقل مكي في «الإبانة» عن كتاب الطبري في القراءات أن كل ما صح أن النبي علّمه أمته من الأحرف السبعة فليس لأحد أن يخطّئ من قرأ به موافقًا لخط المصحف، وما خالف الخط لا يُقرأ به ويُتوقف عنه {cite:qiraat-inda-al-tabari-thesis-umm-al-qura p.1364}. وفي «جامع البيان» يقول إن ما شذ عن القراءة التي نقلتها الأمة نقلًا ظاهرًا مستفيضًا رأي مخالف للحق وإن كان له وجه في العربية {cite:qiraat-inda-al-tabari-thesis-umm-al-qura p.1376} {cite:qiraat-inda-al-tabari-thesis-umm-al-qura p.1377}، ويرد قراءة انفرد بها قارئ أو اثنان أو ثلاثة لمخالفتها الحجة من القراء {cite:qiraat-inda-al-tabari-thesis-umm-al-qura p.1382}."
      en: "Makki's al-Ibana quotes al-Tabari's book on the readings: whatever is soundly known to have been taught by the Prophet to his community among the seven ahruf, no one may fault the one who reads it in agreement with the script of the codex, and what departs from the script is not read and is left aside {cite:qiraat-inda-al-tabari-thesis-umm-al-qura p.1364}. In Jami' al-Bayan he says that a reading departing from what the community transmitted openly and widely is a view contrary to the truth, even if it has a basis in Arabic {cite:qiraat-inda-al-tabari-thesis-umm-al-qura p.1376} {cite:qiraat-inda-al-tabari-thesis-umm-al-qura p.1377}, and he rejects readings held by one, two or three readers for going against the authoritative body of readers {cite:qiraat-inda-al-tabari-thesis-umm-al-qura p.1382}."
      ur: "مکی کی «الابانہ» طبری کی کتاب القراءات سے نقل کرتی ہے کہ احرفِ سبعہ میں سے جو کچھ صحیح طور پر ثابت ہو کہ نبی نے اپنی امت کو سکھایا، اسے رسمِ مصحف کے موافق پڑھنے والے کو کوئی غلط نہیں کہہ سکتا، اور جو رسم کے خلاف ہو وہ نہیں پڑھا جاتا اور اس سے توقف کیا جاتا ہے {cite:qiraat-inda-al-tabari-thesis-umm-al-qura p.1364}۔ «جامع البیان» میں وہ کہتے ہیں کہ جو قراءت امت کی ظاہر و مستفیض منقول قراءت سے ہٹی ہو وہ حق کے خلاف رائے ہے، اگرچہ عربیت میں اس کی کوئی وجہ ہو {cite:qiraat-inda-al-tabari-thesis-umm-al-qura p.1376} {cite:qiraat-inda-al-tabari-thesis-umm-al-qura p.1377}، اور وہ ایک، دو یا تین قراء کی منفرد قراءت کو معتبر قراء کی جماعت کے خلاف ہونے کی بنا پر رد کرتے ہیں {cite:qiraat-inda-al-tabari-thesis-umm-al-qura p.1382}۔"
