id: question/did-al-tabari-reject-established-readings
class: question
label:
  ar: "هل ردّ الطبري في «جامع البيان» قراءات ثابتة؟"
  en: "Did al-Tabari reject established readings in Jami' al-Bayan?"
  ur: "کیا طبری نے «جامع البیان» میں ثابت قراءتیں رد کیں؟"
summary:
  ar: "قرر الطبري في كتابه «القراءات» ألا يُخطّأ من قرأ بما صح موافقًا لخط المصحف، لكنه في «جامع البيان» حكم على القراءات بموافقة الرسم واتفاق أكثر القراء والأفصح من كلام العرب، فردّ قراءات انفرد بها بعض من صاروا من السبعة؛ ويقرر ابن الجزري أن صحة النقل هي الركن الأساس، ويرى أحمد خالد بابكر أن الطبري لم يلتزم مبدأه واشتط أحيانًا."
  en: "In his book on the readings al-Tabari laid down that no one reading a sound reading that agrees with the script of the codex is to be faulted, yet in Jami' al-Bayan he judged readings by the script, the agreement of most readers and the most eloquent Arabic, and rejected readings held by single readers later counted among the Seven; Ibn al-Jazari holds that sound transmission is the chief pillar, and Ahmad Khalid Babakr finds that al-Tabari did not keep his own principle and was at times harsh."
  ur: "طبری نے اپنی کتاب «القراءات» میں طے کیا کہ جو صحیح قراءت رسمِ مصحف کے موافق ہو اس کے پڑھنے والے کو غلط نہ کہا جائے، مگر «جامع البیان» میں انہوں نے قراءتوں کو رسم، اکثر قراء کے اتفاق اور افصح عربی سے پرکھا، اور ان قراءتوں کو رد کیا جو بعد میں سبعہ میں شمار ہونے والے بعض قراء نے تنہا پڑھیں؛ ابن الجزری کے نزدیک صحتِ نقل بنیادی رکن ہے، اور احمد خالد بابکر کے مطابق طبری اپنے اصول پر قائم نہ رہے اور بعض اوقات سختی کی۔"
question:
  ar: "ما معيار الطبري في قبول القراءة وردها، وهل خالف به قراءات أجمعت عليها الأمة؟"
  en: "What was al-Tabari's standard for accepting or rejecting a reading, and did it lead him to oppose readings the community accepted?"
  ur: "قراءت کو قبول یا رد کرنے میں طبری کا معیار کیا تھا، اور کیا اس کی وجہ سے انہوں نے امت کی مقبول قراءتوں کی مخالفت کی؟"
short_answer:
  ar: "الطبري نفسه يجعل موافقة الرسم وإجماع الحجة من القراء والأفصح في العربية معيارًا؛ وابن الجزري يجعل صحة النقل الأصل؛ والبحث الأكاديمي يرى في بعض أحكام الطبري مخالفة لقراءات صحيحة نقلًا وعربية."
  en: "Al-Tabari himself takes agreement with the script, the consensus of the authoritative readers and the most eloquent Arabic as his standard; Ibn al-Jazari makes sound transmission the root; the academic study sees some of al-Tabari's judgements as opposing readings sound in transmission and in Arabic."
  ur: "طبری خود رسم سے موافقت، معتبر قراء کے اجماع اور افصح عربی کو معیار بناتے ہیں؛ ابن الجزری صحتِ نقل کو اصل قرار دیتے ہیں؛ علمی مطالعہ طبری کے بعض فیصلوں کو نقل اور عربیت دونوں میں صحیح قراءتوں کی مخالفت سمجھتا ہے۔"
