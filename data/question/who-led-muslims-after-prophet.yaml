id: question/who-led-muslims-after-prophet
class: question
label:
  ar: من تولى قيادة المسلمين بعد وفاة النبي؟
  en: Who led the Muslims after the Prophet's death?
summary:
  ar: بعد وفاة النبي اختار المسلمون أبا بكر في السقيفة ثم عمر ثم عثمان ثم علي، وهذا هو الترتيب الذي تعده السنة. أما الشيعة فيرون أن النبي نص على علي، وتتعدد قراءات المؤرخين لهذه الوقائع.
  en: "After the Prophet's death, the Muslims chose Abu Bakr at the Saqifa, then Umar, then Uthman, then Ali. This is the order recognized in the Sunni tradition. The Shia believe that the Prophet designated Ali, and historians read these events in several ways."
wings: []
question:
  ar: من تولى قيادة المسلمين بعد وفاة النبي؟
issue:
  ar: من تولى قيادة الأمة بعد وفاة النبي، وبأي طريق تثبت الإمامة؟
short_answer:
  ar: بعد وفاة النبي اختار المسلمون أبا بكر في السقيفة ثم عمر ثم عثمان ثم علي، وهذا هو الترتيب الذي تعده السنة. أما الشيعة فيرون أن النبي نص على علي، وتتعدد قراءات المؤرخين لهذه الوقائع.
long_answer:
  ar: 'بعد وفاة النبي اجتمع المسلمون في [[event/saqifa|السقيفة]] واختاروا أبا بكر خليفة. ثم تولى عمر، ثم عثمان، ثم علي، وهم الخلفاء الراشدون عند أهل السنة، كما يعرض مدخل [[concept/khilafa-rashida|الخلافة الراشدة]].


    ويرى الشيعة أن النبي نص على علي في [[event/ghadir-khumm|غدير خم]]، وأن الإمامة بعده حق لعلي وذريته، وهذا موضع خلاف جوهري بين المذهبين.


    والمؤرخون يعرضون الوقائع ويختلفون في قراءتها: هل كان الاختيار اختياراً بالشورى، أم صراعاً على السلطة، أم تنازعاً على النص. وفصل هذه المواقف في المدخل نفسه دون ترجيح.


    وترتبط هذه المسألة بأحداث لاحقة مثل [[event/battle-of-the-camel|وقعة الجمل]] و[[event/battle-of-siffin|وقعة صفين]]، ومن أراد المزيد يبدأ بمدخل [[group/shia|الشيعة]].

    '
