id: question/who-was-zubayr
class: question
label:
  ar: من كان الزبير بن العوام؟
  en: Who was al-Zubayr ibn al-Awwam?
  es: "¿Quién fue al-Zubayr ibn al-Awwam?"
  fr: "Qui était al-Zubayr ibn al-Awwam ?"
  ur: "زبیر بن العوام کون تھے؟"
  tr: "El-Zubeyr ibn El-Avvem kimdi?"
  id: "Siapakah Al-Zubayr ibn Al-Awwam?"
summary:
  ar: الزبير بن العوام حواري النبي وابن عمته صفية؛ أول من سلّ سيفًا في سبيل الله ومن العشرة المبشرين؛
    قتل في وادي السباع بعد الجمل.
  en: "al-Zubayr ibn al-Awwam, a close companion (hawari) of the Prophet and son of his aunt Safiyya. He was the first to draw a sword in the cause of God, and he was one of the ten given glad tidings of Paradise. He was killed in Wadi al-Siba after the Battle of the Camel."
  es: "Al-Zubayr ibn al-Awwam, compañero cercano (hawari) del Profeta e hijo de su tía Safiyya, fue el primero en desenvainar una espada por la causa de Dios y uno de los diez a quienes se les anunció la buena nueva del Paraíso. Murió en Wadi al-Siba tras la Batalla del Camello."
  fr: "Al-Zubayr ibn al-Awwam, un proche compagnon (hawari) du Prophète et fils de sa tante Safiyya, fut le premier à prendre les armes pour la cause de Dieu et l'un des dix à recevoir la bonne nouvelle du Paradis. Il périt à Wadi al-Siba après la bataille du Chameau."
  ur: "الزبیر بن العوام، رسول اللہ کے قریبی ساتھی ⁦(حواری)⁩ اور ان کی خالہ صفیہ کے بیٹے۔ وہ پہلا شخص تھا جس نے خدا کی راہ میں تلوار چلائی اور وہ جنت کی بشارت دینے والے دس لوگوں میں سے ایک تھا۔ اونٹ کی لڑائی کے بعد وادی السبع میں مارا گیا۔"
  tr: "El-Zubeyr bin el-Avvam, Peygamber'in sahabesi ve kuzeni Safiyyah; Allah davasında ilk kılıç çeken ve müjde alan on kişiden biri; Deve'den sonra Vadi el-Siba'da öldürüldü."
  id: "Al-Zubayr ibn Al-Awwam, sahabat dan sepupu Nabi, Safiyyah; yang pertama menghunus pedang demi Tuhan dan di antara sepuluh orang yang menerima kabar baik; ia dibunuh di Wadi al-Siba' setelah unta."
question:
  ar: من كان الزبير بن العوام؟
short_answer:
  ar: الزبير بن العوام حواري النبي وابن عمته صفية؛ أول من سلّ سيفًا في سبيل الله ومن العشرة المبشرين؛
    قتل في وادي السباع بعد الجمل.
long_answer:
  ar: '[[person/zubayr-ibn-al-awwam|الزبير]] ابن صفية عمة النبي؛ أسلم صغيرًا وقاتل كل المعارك؛ من العشرة
    المبشرين وطلحه الشريك؛ انسحب من الجمل بذمة علي فقتله عمرو بن جرموز في طريق المدينة؛ دفن في وادي السباع.
    {cite:wikidata}'
