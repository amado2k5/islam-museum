id: question/who-was-zubayr
class: question
label:
  ar: من كان الزبير بن العوام؟
  en: Who was al-Zubayr ibn al-Awwam?
summary:
  ar: الزبير بن العوام حواري النبي وابن عمته صفية؛ أول من سلّ سيفًا في سبيل الله ومن العشرة المبشرين؛
    قتل في وادي السباع بعد الجمل.
  en: "al-Zubayr ibn al-Awwam, a close companion (hawari) of the Prophet and son of his aunt Safiyya. He was the first to draw a sword in the cause of God, and he was one of the ten given glad tidings of Paradise. He was killed in Wadi al-Siba after the Battle of the Camel."
question:
  ar: من كان الزبير بن العوام؟
short_answer:
  ar: الزبير بن العوام حواري النبي وابن عمته صفية؛ أول من سلّ سيفًا في سبيل الله ومن العشرة المبشرين؛
    قتل في وادي السباع بعد الجمل.
long_answer:
  ar: '[[person/zubayr-ibn-al-awwam|الزبير]] ابن صفية عمة النبي؛ أسلم صغيرًا وقاتل كل المعارك؛ من العشرة
    المبشرين وطلحه الشريك؛ انسحب من الجمل بذمة علي فقتله عمرو بن جرموز في طريق المدينة؛ دفن في وادي السباع.
