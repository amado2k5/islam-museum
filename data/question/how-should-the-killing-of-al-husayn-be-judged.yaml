id: question/how-should-the-killing-of-al-husayn-be-judged
class: question
label: { ar: "كيف يُنظر إلى مقتل الحسين وإلى يوم عاشوراء؟", en: "How should the killing of al-Husayn and the day of Ashura be regarded?", ur: "حسین کی شہادت اور یومِ عاشورا کو کس نظر سے دیکھا جائے؟" }
summary:
  ar: "يقسم ابن تيمية في منهاج السنة الناس في قتل الحسين إلى طرفين ووسط: من قال قُتل بحق لأنه أراد تفريق الجماعة، ومن جعله الإمام الواجب الطاعة، والوسط عنده قول أهل السنة إنه قُتل مظلوماً شهيداً ولم يكن متولياً لأمر الأمة؛ ويعدّ المشروع عند المصيبة الصبر والاسترجاع، ويذم بدعتي الحزن والنوح والسرور والفرح يوم عاشوراء."
  en: "In Minhaj al-Sunna Ibn Taymiyya divides views of al-Husayn's killing into two extremes and a middle: that he was killed rightly for seeking to split the community; that he was the imam whose obedience was due; and the middle, which he names the Sunni view, that he was killed wrongfully as a martyr and was not the ruler of the community. He holds that patience and saying 'We belong to God' are what is prescribed at a calamity, and condemns both the mourning and lamentation and the rejoicing that were introduced on Ashura."
  ur: "منہاج السنہ میں ابن تیمیہ حسین کے قتل کے بارے میں لوگوں کو دو انتہاؤں اور ایک درمیانی گروہ میں تقسیم کرتے ہیں: جو کہتے ہیں کہ وہ حق پر قتل ہوئے کیونکہ جماعت کو توڑنا چاہتے تھے؛ جو انہیں واجب الاطاعت امام مانتے ہیں؛ اور درمیانی رائے جسے وہ اہلِ سنت کا قول کہتے ہیں کہ وہ مظلوم شہید ہوئے اور امت کے حاکم نہیں تھے۔ وہ مصیبت کے وقت صبر اور انا للہ کہنے کو مشروع سمجھتے ہیں، اور عاشورا کے دن غم و نوحہ اور خوشی و سرور دونوں نئی رسموں کی مذمت کرتے ہیں۔"
question: { ar: "كيف يُنظر إلى مقتل الحسين وإلى يوم عاشوراء؟", en: "How should the killing of al-Husayn and the day of Ashura be regarded?", ur: "حسین کی شہادت اور یومِ عاشورا کو کس نظر سے دیکھا جائے؟" }
issue:
  ar: "هل قُتل الحسين بحق أم مظلوماً، وهل كان الإمام الواجب الطاعة؟ وما المشروع للمسلم في ذكرى مقتله يوم عاشوراء؟"
  en: "Was al-Husayn killed rightly or wrongfully, and was he the imam whose obedience was due? And what is prescribed for a Muslim on the anniversary of his killing on Ashura?"
  ur: "کیا حسین حق پر قتل ہوئے یا ظلماً، اور کیا وہ واجب الاطاعت امام تھے؟ اور عاشورا کے دن ان کی شہادت کی یاد میں مسلمان کے لیے کیا مشروع ہے؟"
short_answer:
  ar: "ابن تيمية (أهل السنة): قُتل مظلوماً شهيداً ولم يكن ولي الأمر، والمشروع الصبر والاسترجاع وصيام عاشوراء، لا النوح ولا الفرح. الطرفان كما يحكيهما: قُتل بحق لتفريقه الجماعة؛ أو كان الإمام الذي لا تصح جمعة ولا جهاد إلا بإذنه."
  en: "Ibn Taymiyya (Sunni): he was killed wrongfully as a martyr and was not the ruler; what is prescribed is patience, saying 'We belong to God', and fasting Ashura – neither lamentation nor rejoicing. The two extremes as he relates them: he was killed rightly for splitting the community; or he was the imam without whose leave no Friday prayer or jihad is valid."
  ur: "ابن تیمیہ (اہلِ سنت): وہ مظلوم شہید ہوئے اور حاکم نہیں تھے؛ مشروع صبر، انا للہ کہنا اور عاشورا کا روزہ ہے، نہ نوحہ نہ خوشی۔ دونوں انتہائیں، جیسا وہ بیان کرتے ہیں: وہ جماعت توڑنے کی وجہ سے حق پر قتل ہوئے؛ یا وہ ایسے امام تھے جن کی اجازت کے بغیر نہ جمعہ صحیح ہے نہ جہاد۔"
