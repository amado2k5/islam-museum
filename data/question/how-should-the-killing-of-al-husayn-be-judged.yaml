    standing: main
    stance: { ar: "قُتل الحسين مظلوماً شهيداً ولم يكن متولياً لأمر الأمة", en: "Al-Husayn was killed wrongfully as a martyr and was not the ruler of the community", ur: "حسین مظلوم شہید ہوئے اور امت کے حاکم نہیں تھے" }
    summary: { ar: "يرى ابن تيمية أن حديث «من جاءكم وأمركم على رجل واحد» لا يتناول الحسين لأنه لما بلغه ما فُعل بمسلم بن عقيل ترك طلب الأمر وطلب أن يذهب إلى يزيد أو إلى الثغر أو إلى بلده فلم يمكّنوه؛ وأن الواجب عند المصيبة الصبر والاسترجاع، وأن لطم الخدود وشق الجيوب والنياحة محرمة، وأن بدعة الحزن وبدعة السرور يوم عاشوراء كلتاهما بدعة لم يستحبها أحد من الأئمة الأربعة، والمستحب صيامه.", en: "Ibn Taymiyya holds that the hadith 'Whoever comes to you when your affair is united under one man' does not apply to al-Husayn, since when he heard what had been done to Muslim ibn Aqil he gave up seeking power and asked to go to Yazid, to the frontier or to his own town, but was not allowed; that at a calamity patience and saying 'We belong to God' are due; that slapping cheeks, tearing garments and lamentation are forbidden; and that the innovations of grief and of rejoicing on Ashura are both innovations recommended by none of the four imams, what is recommended being to fast it.", ur: "ابن تیمیہ کے نزدیک حدیث «جو تمہارے پاس آئے جبکہ تمہارا معاملہ ایک شخص پر متفق ہو» حسین پر صادق نہیں آتی، کیونکہ جب انہیں مسلم بن عقیل کے ساتھ ہونے والا سلوک معلوم ہوا تو انہوں نے حکومت کی طلب چھوڑ دی اور یزید کے پاس، سرحد پر یا اپنے شہر جانے کی درخواست کی مگر انہیں اجازت نہ دی گئی؛ مصیبت کے وقت صبر اور انا للہ کہنا واجب ہے؛ رخسار پیٹنا، گریبان چاک کرنا اور نوحہ حرام ہیں؛ اور عاشورا کے دن غم اور خوشی کی دونوں رسمیں بدعت ہیں جنہیں ائمۂ اربعہ میں سے کسی نے مستحب نہیں کہا، مستحب اس دن کا روزہ ہے۔" }
