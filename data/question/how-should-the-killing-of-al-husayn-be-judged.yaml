    stance: { ar: "الحسين هو الإمام الواجب الطاعة", en: "Al-Husayn was the imam whose obedience was due", ur: "حسین واجب الاطاعت امام تھے" }
    summary: { ar: "في نقل ابن تيمية: الطرف الآخر يقول إن الحسين كان الإمام الواجب طاعته الذي لا ينفذ أمر من أمور الإيمان إلا به، ولا تُصلّى جماعة ولا جمعة إلا خلف من يوليه، ولا يُجاهد عدو إلا بإذنه؛ والكلام في سياق الرد على الإمامية. ويحكي ابن تيمية أن الحزن والنوح يوم عاشوراء أحدثه المنتصرون للحسين، ويصف ما يصحبه بأوصاف قاسية من عنده. والموقف بحاجة إلى عرضه من كتب الإمامية.", en: "As Ibn Taymiyya reports: the other extreme says that al-Husayn was the imam whose obedience was due, without whom no matter of faith is carried out, behind none but whose appointee congregational and Friday prayer are prayed, and without whose leave no enemy is fought; the passage is part of his reply to the Imamiyya. Ibn Taymiyya relates that mourning and lamentation on Ashura were introduced by partisans of al-Husayn and describes what accompanies them in harsh terms of his own. The position needs to be set out from Imami books.", ur: "ابن تیمیہ کی نقل میں: دوسری انتہا یہ کہتی ہے کہ حسین واجب الاطاعت امام تھے جن کے بغیر ایمان کا کوئی معاملہ نافذ نہیں ہوتا، جماعت اور جمعہ صرف ان کے مقرر کردہ کے پیچھے پڑھا جاتا ہے، اور ان کی اجازت کے بغیر کسی دشمن سے جہاد نہیں ہوتا؛ یہ عبارت امامیہ پر رد کے سیاق میں ہے۔ ابن تیمیہ بیان کرتے ہیں کہ عاشورا کا غم اور نوحہ حسین کے حامیوں نے شروع کیا، اور اس کے ساتھ ہونے والی باتوں کو اپنی طرف سے سخت الفاظ میں بیان کرتے ہیں۔ اس موقف کو امامیہ کی کتابوں سے پیش کرنا باقی ہے۔" }
