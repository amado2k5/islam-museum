    summary: { ar: "في نقل ابن تيمية: أحد الطرفين يقول إن الحسين قُتل بحق لأنه جاء وأمر المسلمين على رجل واحد فأراد أن يفرق جماعتهم، ويحتج بالحديث الصحيح في قتل من فعل ذلك؛ وقال بعضهم إنه أول خارج خرج في الإسلام على ولاة الأمر. ولا يسمي ابن تيمية أصحاب هذا القول هنا.", en: "As Ibn Taymiyya reports: one extreme says that al-Husayn was killed rightly because he came when the Muslims' affair was united under one man and sought to divide them, citing the sound hadith on killing whoever does so; some of them said he was the first in Islam to rise against those in authority. Ibn Taymiyya does not name the holders of this view here.", ur: "ابن تیمیہ کی نقل میں: ایک انتہا یہ کہتی ہے کہ حسین حق پر قتل ہوئے کیونکہ وہ ایسے وقت آئے جب مسلمانوں کا معاملہ ایک شخص پر متفق تھا اور انہوں نے ان کی جماعت توڑنا چاہی، اور اس پر ایسے شخص کے قتل کی صحیح حدیث سے دلیل لیتی ہے؛ ان میں سے بعض نے کہا کہ وہ اسلام میں حکمرانوں کے خلاف خروج کرنے والے پہلے شخص تھے۔ ابن تیمیہ یہاں اس قول کے قائلین کا نام نہیں لیتے۔" }
    evidence: [{ ref: source/minhaj-sunna-shamela, note: { ar: "منهاج السنة، نسخة الشاملة ص 1358", en: "Minhaj al-Sunna, Shamela export p. 1358" } }]
