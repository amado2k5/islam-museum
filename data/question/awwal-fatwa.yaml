question:
  ar: "ما أقدم فتوى معروفة في الإسلام، ومن أول من أفتى؟"
  en: "What is the oldest known fatwa in Islam, and who was the first to give one?"
issue:
  ar: "هل للفتوى أولٌّ يُنسب إليه؟ والإشكال أن الفتوى بدت عملاً قبل أن تصير اصطلاحاً ومنصباً."
  en: "Can a 'first' be named for the fatwa, given that the practice existed before the term and the office did?"
short_answer:
  ar: "أول الفتوى عملاً أجوبة النبي عن أسئلة أصحابه في المدينة؛ وأول المفتين من البشر بعده الصحابة الذين كثرت فتاواهم — ومن أشهرهم سبعة: عمر وعلي وابن مسعود وابن عمر وابن عباس وزيد بن ثابت وعائشة — ولم يكن بينهم منصب مفتٍ معين لأن الفتوى لم تكن منصباً أصلاً؛ وأقدم المدونات الجامعة لفتاوى الصحابة المصنفات الحديثية كمصنف عبد الرزاق ومصنف ابن أبي شيبة."
  en: "The first fatwa in practice was the Prophet's answers to his Companions' questions in Medina; the first fatwa-givers after him were the Companions whose fatwas were many — famously seven: Umar, Ali, Ibn Masud, Ibn Umar, Ibn Abbas, Zayd ibn Thabit and Aisha — none of whom held an office of mufti because no such office existed; and the earliest written collections preserving Companion fatwas are the hadith musannafs such as those of Abd al-Razzaq and Ibn Abi Shayba."
