id: question/awwal-fatwa
class: question
label:
  ar: "ما أول فتوى في الإسلام ومن أفتى أولاً؟"
  en: "What was the first fatwa in Islam, and who gave fatwa first?"
  es: "¿Cuál fue la primera fatwa en el Islam y quién la emitió primero?"
  fr: "Quelle fut la première fatwa en islam, et qui l'a émise en premier ?"
summary:
  ar: "مسألة «أول فتوى» لا تحسمها المصادر باسم واحد، لأن الفتوى في صدر الإسلام لم تكن منصباً ولا وثيقة مستقلة. فقد كان الناس يسألون النبي في المدينة فيجيبهم، فكانت أجوبته أول صورة للفتوى عملاً، وإن كان اصطلاح «الفتوى» لم يشع إلا في القرون اللاحقة كما تبين موسوعة TDV الإسلامية في مدخل «فتوى». وبعده أفتى الصحابة، وكان كل من بلغ العلم يفتي بلا إذن ولا منصب؛ وتذكر المصادر سبعة من الصحابة كثرت فتاواهم: عمر وعلي وابن مسعود وابن عمر وابن عباس وزيد بن ثابت وعائشة. ولما انتشر الصحابة في الأمصار في عهد عثمان صار الناس يسألونهم في الكوفة والبصرة ودمشق، ومنهم عبد الله بن مسعود في الكوفة. وأما أول من نصب للإفتاء منصباً فإن المدخل يوثق تحول المنصب عبر العصور وصولاً إلى قاضي القضاة أبي يوسف ثم منصب شيخ الإسلام في الدولة العثمانية، لا إلى مفتٍ أول بعينه {cite:tdv-fetva}."
  en: "The sources do not settle 'the first fatwa' with one name, because in early Islam a fatwa was neither an office nor a standalone document. People asked the Prophet questions in Medina and he answered them, so his answers were the first form of ifta' in practice, though the technical term 'fatwa' only became common in later centuries, as the TDV Islamic Encyclopedia's 'Fetva' entry explains. After him the Companions answered, and anyone with learning could give a fatwa without licence or post; the sources name seven Companions whose fatwas were many: Umar, Ali, Ibn Masud, Ibn Umar, Ibn Abbas, Zayd ibn Thabit and Aisha. When the Companions spread to the garrison cities under Uthman, people sought their answers in Kufa, Basra and Damascus, among them Abdullah ibn Masud in Kufa. As for the first person to hold fatwa as an office, the entry documents the office's transformation across the centuries — Abu Yusuf combining fatwa with the title qadi al-qudat, then the Ottoman shaykh al-islam — rather than naming a first office-holder."
  es: "Las fuentes no identifican a la primera fatwa con un solo nombre, ya que en los inicios del Islam una fatwa no era ni un cargo ni un documento independiente. La gente le hacía preguntas al Profeta en Medina y él las respondía, por lo que sus respuestas fueron la primera forma de ifta en la práctica, aunque el término técnico «fatwa» solo se popularizó en siglos posteriores, como explica la entrada «Fetva» de la Enciclopedia Islámica TDV. Después de él, los Compañeros respondieron, y cualquiera con conocimientos podía emitir una fatwa sin licencia ni cargo; las fuentes mencionan a siete Compañeros cuyas fatwas fueron numerosas: Umar, Ali, Ibn Masud, Ibn Umar, Ibn Abbas, Zayd ibn Thabit y Aisha. Cuando los Compañeros se extendieron a las ciudades guarnición bajo el mando de Uthman, la gente buscaba sus respuestas en Kufa, Basora y Damasco, entre ellos Abdullah ibn Masud en Kufa. En cuanto a la primera persona en ostentar el cargo de fatwa, la entrada documenta la transformación del cargo a lo largo de los siglos —Abu Yusuf combinó fatwa con el título de qadi al-qudat, y luego el de shaykh al-islam otomano— en lugar de nombrar a un primer titular del cargo."
  fr: "Les sources ne désignent pas avec certitude la « première fatwa », car aux débuts de l'islam, une fatwa n'était ni une fonction officielle ni un document indépendant. À Médine, les gens posaient des questions au Prophète, qui y répondait. Ses réponses constituaient ainsi la première forme d'ifta' en pratique, même si le terme technique de « fatwa » ne s'est répandu que plus tard, comme l'explique l'article « Fetva » de l'Encyclopédie islamique TDV. Après lui, ce furent les Compagnons qui répondirent, et toute personne instruite pouvait émettre une fatwa sans autorisation ni poste officiel. Les sources citent sept Compagnons dont les fatwas furent nombreuses: Umar, Ali, Ibn Mas'ud, Ibn Umar, Ibn Abbas, Zayd ibn Thabit et Aïcha. Lorsque les Compagnons s'installèrent dans les villes de garnison sous Uthman, on vint consulter leurs conseils à Koufa, Bassora et Damas, notamment auprès d'Abdullah ibn Mas'ud à Koufa. Quant à la première personne à avoir détenu la fatwa en tant que fonction, l'entrée documente la transformation de cette fonction au fil des siècles — Abu Yusuf combinant la fatwa avec le titre de qadi al-qudat, puis le cheikh ottoman al-islam — plutôt que de nommer un premier titulaire de cette fonction."
