id: question/rashid-al-din-jewish-origin
class: question
label:
  ar: "هل كان رشيد الدين من أصل يهودي؟"
  en: "Was Rashid al-Din of Jewish origin?"
  ur: "کیا رشید الدین کا اصل یہودی تھا؟"
  fr: "Rashid al-Din était-il d'origine juive ?"
  es: "¿Era Rashid al-Din de origen judío?"
summary:
  ar: "يقرر الصقاعي، وهو كاتب مسيحي كما يذكر الهامش، أن رشيد الدين كان يهودي الأصل والدين، ويعرض رشيد الدين نفسه أن التهمة من خصومه، ويرى الخشاب أن الشهادة الواحدة لا تكفي للجزم، وأن أسلاف رشيد الدين قد يكونون من اليهود الذين أسلموا {cite:jami-al-tawarikh-khashshab-1960 p. 33}{cite:jami-al-tawarikh-khashshab-1960 p. 34}{cite:jami-al-tawarikh-khashshab-1960 p. 36}."
  en: "The Christian scribe al-Saqa'i, as a footnote identifies him, states that Rashid al-Din was of Jewish origin and religion. Rashid al-Din himself says that his enemies spread the charge, and the translator finds a single witness too weak to decide it. He finds it not improbable that Rashid's ancestors were Jews who converted, though he holds that the grandfather and father were Muslims {cite:jami-al-tawarikh-khashshab-1960 p. 33}{cite:jami-al-tawarikh-khashshab-1960 p. 34}{cite:jami-al-tawarikh-khashshab-1960 p. 36}."
  es: "El escriba cristiano al-Saqa'i, según identifica una nota a pie de página, afirma que Rashid al-Din era de origen y religión judíos. Rashid al-Din dice que sus enemigos difundieron la acusación, y el traductor considera que un solo testimonio es insuficiente para decidirlo. Considera no improbable que los antepasados de Rashid fueran judíos conversos, aunque sostiene que el abuelo y el padre eran musulmanes {cite:jami-al-tawarikh-khashshab-1960 p. 33}{cite:jami-al-tawarikh-khashshab-1960 p. 34}{cite:jami-al-tawarikh-khashshab-1960 p. 36}."
  fr: "Le scribe chrétien al-Saqa'i, comme l'identifie une note, affirme que Rashid al-Din était d'origine et de religion juives. Rashid al-Din lui-même dit que ses ennemis ont répandu l'accusation, et le traducteur juge qu'un seul témoin est trop faible pour trancher. Il juge non improbable que les ancêtres de Rashid aient été des juifs convertis, tout en tenant le grand-père et le père pour musulmans {cite:jami-al-tawarikh-khashshab-1960 p. 33}{cite:jami-al-tawarikh-khashshab-1960 p. 34}{cite:jami-al-tawarikh-khashshab-1960 p. 36}."
  ur: "ایک عیسائی کاتب الصقاعی، جیسا کہ حاشیے میں بتایا گیا ہے، کہتے ہیں کہ رشید الدین اصلاً اور مذہباً یہودی تھے۔ رشید الدین خود کہتے ہیں کہ یہ الزام ان کے دشمنوں نے پھیلایا، اور مترجم کے نزدیک ایک گواہ فیصلے کے لیے کافی نہیں۔ مترجم کے نزدیک یہ بات بعید از امکان نہیں کہ رشید الدین کے اجداد یہودی تھے جو مسلمان ہوئے، البتہ وہ دادا اور والد کو مسلمان سمجھتے ہیں {cite:jami-al-tawarikh-khashshab-1960 p. 33}{cite:jami-al-tawarikh-khashshab-1960 p. 34}{cite:jami-al-tawarikh-khashshab-1960 p. 36}۔"
question:
  ar: "هل كان رشيد الدين يهودياً أو من أسرة يهودية، وهل أسلم؟"
  en: "Was Rashid al-Din himself a Jew, or from a Jewish family, and did he convert?"
  ur: "کیا رشید الدین خود یہودی تھے یا یہودی خاندان سے تھے، اور کیا انہوں نے اسلام قبول کیا؟"
  fr: "Rashid al-Din était-il lui-même juif, ou issu d'une famille juive, et s'est-il converti ?"
  es: "¿Era el propio Rashid al-Din judío, o procedía de una familia judía, y se convirtió?"
issue:
  ar: "تنقل المصادر قولين متعارضين: أن رشيد الدين كان يهودياً أسلم، أو أن التهمة مفتراة عليه من خصومه؛ والكتاب لا ينقل شاهداً ثالثاً ولا وثيقة من أسرته تحسم المسألة."
  en: "The sources give two opposed accounts: that Rashid al-Din was a Jew who converted, or that the charge was invented against him by enemies. The book cites no third witness and no family document that settles it."
  ur: "مآخذ دو متضاد بیان دیتے ہیں: کہ رشید الدین یہودی تھے جنہوں نے اسلام قبول کیا، یا یہ کہ یہ الزام ان کے دشمنوں نے گھڑا۔ کتاب کوئی تیسرا گواہ یا خاندانی دستاویز پیش نہیں کرتی جو اسے طے کرے۔"
  fr: "Les sources donnent deux récits opposés : Rashid al-Din était un juif converti, ou l'accusation fut inventée par ses ennemis. Le livre ne cite ni troisième témoin ni document familial qui tranche."
  es: "Las fuentes dan dos relatos opuestos: que Rashid al-Din era un judío converso, o que la acusación fue inventada por sus enemigos. El libro no cita un tercer testigo ni un documento familiar que lo resuelva."
short_answer:
  ar: "لا يحسم الكتاب المسألة: الصقاعي وحده يقرر الأصل اليهودي، ورشيد الدين يعزو التهمة إلى خصومه، والمترجم يرى أن أسلافه البعيدين قد يكونون من اليهود الذين أسلموا، ويرى أن جده وأباه كانا مسلمين."
  en: "The book does not settle it: al-Saqa'i alone asserts the Jewish origin, Rashid al-Din blames his enemies for the charge, and the translator thinks his remoter ancestors may have been Jewish converts, while holding that his grandfather and father were Muslims."
  ur: "کتاب اس مسئلے کو طے نہیں کرتا: صرف الصقاعی یہودی اصل کا دعویٰ کرتے ہیں، رشید الدین اس الزام کو اپنے دشمنوں کی طرف منسوب کرتے ہیں، اور مترجم کا خیال ہے کہ ان کے دور کے اجداد یہودی تھے جنہوں نے اسلام قبول کیا، جبکہ دادا اور والد مسلمان تھے۔"
  fr: "Le livre ne tranche pas : al-Saqa'i seul affirme l'origine juive, Rashid al-Din en accuse ses ennemis, et le traducteur pense que ses ancêtres éloignés ont pu être des juifs convertis, tout en tenant son grand-père et son père pour musulmans."
  es: "El libro no lo resuelve: solo al-Saqa'i afirma el origen judío, Rashid al-Din atribuye la acusación a sus enemigos, y el traductor piensa que sus antepasados lejanos pudieron ser judíos conversos, aunque sostiene que su abuelo y su padre eran musulmanes."
