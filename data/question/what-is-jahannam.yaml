id: question/what-is-jahannam
class: question
label:
  ar: ما جهنم؟
  en: What is Jahannam?
  es: "¿Qué es Jahannam?"
  fr: "Qu'est-ce que Jahannam ?"
summary:
  ar: جهنم هي نار الآخرة وعذاب الله للكافرين والمذنبين؛ وصفها القرآن بدركات وسلاسل وحميم وعذاب أبدي أو
    محدود في أهل الكبائر.
  en: "Jahannam is the fire of the Hereafter and God's punishment for disbelievers and wrongdoers. The Qur'an describes it with its levels, chains and boiling water, and with punishment that is eternal, or limited for the people of grave sins."
  es: "El Jahannam es el fuego del Más Allá y el castigo divino para los incrédulos y malhechores. El Corán lo describe con sus niveles, cadenas y agua hirviendo, y con un castigo eterno, o limitado para quienes cometen pecados graves."
  fr: "L'Enfer (Jahannam) est le feu de l'au-delà et le châtiment divin infligé aux mécréants et aux injustes. Le Coran le décrit avec ses différents niveaux, ses chaînes et son eau bouillante, et évoque un châtiment éternel ou limité pour ceux qui ont commis des péchés graves."
question:
  ar: ما جهنم؟
short_answer:
  ar: جهنم هي نار الآخرة وعذاب الله للكافرين والمذنبين؛ وصفها القرآن بدركات وسلاسل وحميم وعذاب أبدي أو
    محدود في أهل الكبائر.
long_answer:
  ar: 'جهنم هي النار الموعودة للكافرين والظالمين؛ ورد ذكرها في القرآن بأسماء ودركات مختلفة: النار والسعير
    والحطمة والهاوية. عند أهل السنة أهل الكبائر من المسلمين لا يخلدون فيها بل يخرجون بشفاعة ورحمة الله.
