question:
  ar: ما جهنم؟
short_answer:
  ar: جهنم هي نار الآخرة وعذاب الله للكافرين والمذنبين؛ وصفها القرآن بدركات وسلاسل وحميم وعذاب أبدي أو
    محدود في أهل الكبائر.
long_answer:
  ar: 'جهنم هي النار الموعودة للكافرين والظالمين؛ ورد ذكرها في القرآن بأسماء ودركات مختلفة: النار والسعير
    والحطمة والهاوية. عند أهل السنة أهل الكبائر من المسلمين لا يخلدون فيها بل يخرجون بشفاعة ورحمة الله.
