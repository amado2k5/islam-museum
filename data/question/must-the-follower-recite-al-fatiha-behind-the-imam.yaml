    stance: { ar: "لا يقرأ شيئًا", en: "He recites nothing", ur: "کچھ نہ پڑھے" }
    summary:
      ar: "قال ابن وهب وأشهب وابن عبد الحكم وابن حبيب والكوفيون: لا يقرأ المأموم شيئًا، جهر إمامه أو أسر، لعموم حديث «فقراءة الإمام له قراءة»، ولقول جابر: من صلى ركعة لم يقرأ فيها بأم القرآن فلم يصل إلا وراء الإمام. {cite:jami-ahkam-quran-resala-v1 p.183}"
      en: "Ibn Wahb, Ashhab, Ibn Abd al-Hakam, Ibn Habib and the Kufans: the follower recites nothing, whether his imam is loud or silent, on the general hadith 'the imam's recitation is his recitation' and Jabir's saying that whoever prays a rak'a without the Mother of the Book has not prayed, unless behind the imam. {cite:jami-ahkam-quran-resala-v1 p.183}"
      ur: "ابن وہب، اشہب، ابن عبد الحکم، ابن حبیب اور کوفی: مقتدی کچھ نہ پڑھے، امام جہر کرے یا سر، حدیث «امام کی قراءت اس کی قراءت ہے» کے عموم اور جابر کے اس قول کی بنا پر کہ جس نے کوئی رکعت ام القرآن کے بغیر پڑھی اس نے نماز نہیں پڑھی، سوائے امام کے پیچھے۔ {cite:jami-ahkam-quran-resala-v1 p.183}"
