    summary:
      ar: "المشهور من مذهب مالك: لا ينبغي للمأموم أن يدع القراءة خلف إمامه في صلاة السر، فإن فعل فقد أساء ولا شيء عليه؛ وإذا جهر الإمام فلا قراءة بالفاتحة ولا غيرها، لقوله تعالى في [[passage/quran-7-204|الأعراف: 204]] بالاستماع والإنصات، وحديث «ما لي أنازع القرآن»، و«إذا قرأ فأنصتوا»، و«من كان له إمام فقراءة الإمام له قراءة». {cite:jami-ahkam-quran-resala-v1 p.182}"
      en: "Malik's well-known view: the follower should not omit recitation behind his imam in silent prayers — if he does, he has done ill but owes nothing; when the imam recites aloud there is no recitation of al-Fatiha or anything else, on the command to listen and be silent in [[passage/quran-7-204|al-A'raf 204]], the hadith 'why am I contended with in the Qur'an?', 'when he recites, be silent', and 'whoever has an imam, the imam's recitation is his recitation'. {cite:jami-ahkam-quran-resala-v1 p.182}"
      ur: "مالک کا مشہور مذہب: مقتدی سری نماز میں امام کے پیچھے قراءت نہ چھوڑے — چھوڑ دے تو برا کیا مگر اس پر کچھ لازم نہیں؛ اور جب امام جہر کرے تو نہ فاتحہ پڑھے نہ کچھ اور، [[passage/quran-7-204|الاعراف: 204]] میں سننے اور خاموش رہنے کے حکم، حدیث «مجھ سے قرآن میں کیوں کھینچا تانی کی جاتی ہے»، «جب وہ پڑھے تو خاموش رہو»، اور «جس کا امام ہو تو امام کی قراءت اس کی قراءت ہے» کی بنا پر۔ {cite:jami-ahkam-quran-resala-v1 p.182}"
