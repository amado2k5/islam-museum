    stance: { ar: "يقرأ الفاتحة في كل ركعة جهر الإمام أو أسر", en: "He recites al-Fatiha in every rak'a, whether the imam is loud or silent", ur: "ہر رکعت میں فاتحہ پڑھے، امام جہر کرے یا سر" }
    summary:
      ar: "قال الشافعي فيما حكاه عنه [[person/al-buwayti|البويطي]]، وأحمد بن حنبل: لا تجزئ أحدًا صلاة حتى يقرأ بفاتحة الكتاب في كل ركعة، إمامًا كان أو مأمومًا، جهر إمامه أو أسر. {cite:jami-ahkam-quran-resala-v1 p.183} ويصحح القرطبي هذا القول، وهو قول مالك في الرواية الأخرى، لأن الفاتحة متعينة في كل ركعة لكل أحد على العموم. {cite:jami-ahkam-quran-resala-v1 p.183} وكان الشافعي بالعراق يقول كمشهور مذهب مالك، وله بمصر فيما يجهر فيه الإمام قولان حكاهما ابن المنذر. {cite:jami-ahkam-quran-resala-v1 p.183}"
      en: "Al-Shafi'i, as [[person/al-buwayti|al-Buwayti]] reports him, and Ahmad ibn Hanbal: no one's prayer is valid until he recites al-Fatiha in every rak'a, imam or follower, whether his imam recites aloud or silently. {cite:jami-ahkam-quran-resala-v1 p.183} Al-Qurtubi judges this the sound view — also Malik's view in his other narration — since al-Fatiha is required in every rak'a of everyone without exception. {cite:jami-ahkam-quran-resala-v1 p.183} In Iraq al-Shafi'i had held Malik's well-known view, and in Egypt he had two views on prayers the imam recites aloud, as Ibn al-Mundhir reports. {cite:jami-ahkam-quran-resala-v1 p.183}"
      ur: "شافعی، جیسا [[person/al-buwayti|بویطی]] ان سے نقل کرتے ہیں، اور احمد بن حنبل: کسی کی نماز اس وقت تک درست نہیں جب تک وہ ہر رکعت میں فاتحہ نہ پڑھے، امام ہو یا مقتدی، اس کا امام جہر کرے یا سر۔ {cite:jami-ahkam-quran-resala-v1 p.183} قرطبی اسی کو صحیح قول قرار دیتے ہیں — جو دوسری روایت میں مالک کا بھی قول ہے — کیونکہ فاتحہ ہر ایک پر ہر رکعت میں عموماً متعین ہے۔ {cite:jami-ahkam-quran-resala-v1 p.183} عراق میں شافعی مالک کے مشہور قول پر تھے، اور مصر میں جہری نماز کے بارے میں ان کے دو قول تھے، جیسا ابن المنذر نقل کرتے ہیں۔ {cite:jami-ahkam-quran-resala-v1 p.183}"
