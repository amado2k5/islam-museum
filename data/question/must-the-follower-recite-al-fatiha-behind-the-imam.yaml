id: question/must-the-follower-recite-al-fatiha-behind-the-imam
class: question
label:
  ar: "هل يقرأ المأموم الفاتحة خلف الإمام؟"
  en: "Does the follower recite al-Fatiha behind the imam?"
  ur: "کیا مقتدی امام کے پیچھے فاتحہ پڑھے؟"
summary:
  ar: "يعرض القرطبي ثلاثة مذاهب سنية في قراءة المأموم: المشهور عن مالك أنه يقرأ فيما أسر فيه الإمام ولا يقرأ فيما جهر، والشافعي في رواية البويطي وأحمد أنه يقرأ الفاتحة في كل ركعة جهر الإمام أو أسر، وابن وهب وأشهب وابن عبد الحكم وابن حبيب والكوفيون أنه لا يقرأ شيئًا؛ ويختار القرطبي قول الشافعي وأحمد."
  en: "Al-Qurtubi sets out three Sunni positions on the follower's recitation: Malik's well-known view that he recites when the imam recites silently and not when he recites aloud; al-Shafi'i (as al-Buwayti reports) and Ahmad, that he recites al-Fatiha in every rak'a whether the imam is loud or silent; and Ibn Wahb, Ashhab, Ibn Abd al-Hakam, Ibn Habib and the Kufans, that he recites nothing. Al-Qurtubi prefers the view of al-Shafi'i and Ahmad."
  ur: "قرطبی مقتدی کی قراءت پر تین سنی مذاہب بیان کرتے ہیں: مالک کا مشہور قول کہ امام سری پڑھے تو مقتدی پڑھے اور جہری میں نہ پڑھے؛ شافعی (بویطی کی روایت میں) اور احمد کہ وہ ہر رکعت میں فاتحہ پڑھے، امام جہر کرے یا سر؛ اور ابن وہب، اشہب، ابن عبد الحکم، ابن حبیب اور کوفی کہ وہ کچھ نہ پڑھے۔ قرطبی شافعی اور احمد کے قول کو اختیار کرتے ہیں۔"
question:
  ar: "إذا صلى المرء خلف إمام، فهل يقرأ الفاتحة؟ وهل يفرق بين الصلاة الجهرية والسرية؟"
  en: "When one prays behind an imam, does one recite al-Fatiha, and does it matter whether the imam recites aloud or silently?"
  ur: "جب کوئی امام کے پیچھے نماز پڑھے تو کیا فاتحہ پڑھے، اور کیا جہری اور سری نماز میں فرق ہے؟"
short_answer:
  ar: "يتفقون على أن من أدرك الإمام راكعًا يركع ولا يقرأ؛ ثم يختلفون: يقرأ في السرية دون الجهرية ⁦(المشهور عن مالك)⁩، أو يقرأ دائمًا ⁦(الشافعي وأحمد، واختيار القرطبي)⁩، أو لا يقرأ مطلقًا ⁦(الكوفيون وبعض المالكية)⁩."
  en: "They agree that one who joins the imam in the bowing bows without reciting; beyond that, the follower recites in silent prayers only (Malik's well-known view), always (al-Shafi'i and Ahmad, al-Qurtubi's choice), or never (the Kufans and some Malikis)."
  ur: "اس پر اتفاق ہے کہ جو امام کو رکوع میں پائے وہ رکوع کرے اور قراءت نہ کرے؛ اس کے بعد اختلاف ہے: صرف سری نماز میں پڑھے (مالک کا مشہور قول)، ہمیشہ پڑھے (شافعی و احمد، قرطبی کا اختیار)، یا کبھی نہ پڑھے (کوفی اور بعض مالکی)۔"
