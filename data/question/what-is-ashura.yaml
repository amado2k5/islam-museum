id: question/what-is-ashura
class: question
label:
  ar: ما عاشوراء؟
  en: What is Ashura?
  es: "¿Qué es Ashura?"
  fr: "Qu'est-ce qu'Ashura ?"
  ur: "عاشورا کیا ہے؟"
  tr: "Ashura nedir?"
  id: "Apa itu Ashura?"
summary:
  ar: عاشوراء هو العاشر من محرم؛ صامه النبي شكرًا لنجاة موسى وسنه، واستشهد فيه الحسين بن علي فصار يومًا
    مهمًا للشيعة خاصة.
  en: "Ashura is the tenth of Muharram. The Prophet fasted it in thanks for the deliverance of Musa and prescribed it as a sunna. Al-Husayn ibn Ali was martyred on that day, which made it a day of particular importance for the Shia."
  es: "Ashura es el décimo día de Muharram. El Profeta ayunó ese día en agradecimiento por la liberación de Musa y lo prescribió como una sunna. Al-Husayn ibn Ali fue martirizado ese día, lo que lo convirtió en una fecha de especial importancia para los chiítas."
  fr: "Achoura est le dixième jour de Muharram. Le Prophète observa le jeûne ce jour-là en remerciement de la délivrance de Moïse et le prescrivit comme sunna. Al-Husayn ibn Ali fut martyrisé ce jour-là, ce qui en fait un jour particulièrement important pour les chiites."
  ur: "عاشورہ محرم کی دسویں تاریخ ہے۔ نبی نے اسے موسیٰ کی نجات کے شکر میں روزہ رکھا اور اسے سنت قرار دیا۔ اس دن الحسین ابن علی کو شہید کیا گیا تھا جس کی وجہ سے یہ دن شیعوں کے لیے خاص اہمیت کا حامل تھا۔"
  tr: "Aşura Muharremin onuncusudur; Peygamber, Musa'nın kurtuluşu ve sünneti için şükranla oruç tuttu ve bu gün Hüseyin bin Ali şehit edildi, bu da Şiiler için özellikle önemli bir gün oldu."
  id: "Ashura adalah tanggal kesepuluh Muharram; Nabi berpuasa sebagai tanda syukur atas keselamatan Musa dan Sunnah-nya, dan pada hari ini, Husayn ibn Ali gugur, menjadikannya hari yang sangat penting bagi Syiah."
question:
  ar: ما عاشوراء؟
short_answer:
  ar: عاشوراء هو العاشر من محرم؛ صامه النبي شكرًا لنجاة موسى وسنه، واستشهد فيه الحسين بن علي فصار يومًا
    مهمًا للشيعة خاصة.
long_answer:
  ar: عاشوراء هو اليوم العاشر من شهر محرم؛ صامه النبي وصحبه حين بلغهم أن اليهود يصومونه لنجاة موسى، وسنّ
    صيامه مع يوم قبله أو بعده. وقد استشهد فيه الحسين بن علي سنة 61هـ في كربلاء، فصار ذكرى مركزية عند الشيعة
    بمجالس العزاء والزيارات. {cite:wikidata}
