question:
  ar: ما عاشوراء؟
short_answer:
  ar: عاشوراء هو العاشر من محرم؛ صامه النبي شكرًا لنجاة موسى وسنه، واستشهد فيه الحسين بن علي فصار يومًا
    مهمًا للشيعة خاصة.
long_answer:
  ar: عاشوراء هو اليوم العاشر من شهر محرم؛ صامه النبي وصحبه حين بلغهم أن اليهود يصومونه لنجاة موسى، وسنّ
    صيامه مع يوم قبله أو بعده. وقد استشهد فيه الحسين بن علي سنة 61هـ في كربلاء، فصار ذكرى مركزية عند الشيعة
    بمجالس العزاء والزيارات. {cite:wikidata}
