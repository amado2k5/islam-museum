id: question/did-the-prophet-see-his-lord
class: question
label: { ar: "هل رأى النبي ربه في الدنيا؟", en: "Did the Prophet see his Lord in this world?", ur: "کیا نبی نے دنیا میں اپنے رب کو دیکھا؟" }
question: { ar: "هل رأى النبي ربه ليلة المعراج، وإن رآه فهل كانت الرؤية بالعين أم بالقلب؟", en: "Did the Prophet see his Lord on the night of the Ascension, and if so, was it with the eyes or with the heart?", ur: "کیا نبی نے معراج کی رات اپنے رب کو دیکھا، اور اگر دیکھا تو آنکھ سے یا دل سے؟" }
issue: { ar: "مسألة خلافية بين أهل السنة وقع الخلاف فيها بين الصحابة أنفسهم: يُروى الإثبات عن ابن عباس وأصحابه وأبي ذر، والنفي عن عائشة وابن مسعود، وعن أبي هريرة القولان، كما يعرضها ابن خزيمة في كتاب التوحيد ومحققه الشهوان.", en: "A question on which Sunni scholars differ, and on which the Companions themselves differed: affirmation is reported from Ibn 'Abbas and his circle and from Abu Dharr, denial from 'A'isha and Ibn Mas'ud, and both from Abu Hurayra, as Ibn Khuzayma's Kitab al-Tawhid and its editor al-Shahwan set it out." }
summary:
  ar: "يعقد ابن خزيمة في كتاب التوحيد باباً في إثبات رؤية النبي ربه وأن الله خصه بها كما خص إبراهيم بالخلة، وباباً في أخبار عائشة في نفيها؛ ويقول محققه إن المسألة خلافية بين أهل السنة، وإن العلماء بعد الصحابة ثلاث طوائف: من أثبت الرؤية بالبصر، ومن نفاها وأثبت الرؤية القلبية، ومن توقف {cite:kitab-al-tawhid-ibn-khuzayma-shahwan-1988 p. 477-479} {cite:kitab-al-tawhid-ibn-khuzayma-shahwan-1988 p. 548}."
  en: "In Kitab al-Tawhid Ibn Khuzayma has a chapter affirming the Prophet's vision of his Lord, a distinction God gave him as He gave Abraham His close friendship, and a chapter on 'A'isha's reports denying it; his editor says the question is disputed among Sunnis, and that after the Companions scholars fell into three groups: those who affirmed a vision with the eyes, those who denied it and affirmed a vision of the heart, and those who suspended judgement {cite:kitab-al-tawhid-ibn-khuzayma-shahwan-1988 p. 477-479} {cite:kitab-al-tawhid-ibn-khuzayma-shahwan-1988 p. 548}."
  ur: "کتاب التوحید میں ابن خزیمہ ایک باب نبی کے اپنے رب کو دیکھنے کے اثبات پر باندھتے ہیں، کہ اللہ نے انہیں یہ خصوصیت دی جیسے ابراہیم کو خلت دی، اور ایک باب عائشہ کی نفی والی روایات پر؛ محقق کہتے ہیں کہ یہ مسئلہ اہلِ سنت میں مختلف فیہ ہے، اور صحابہ کے بعد علما تین گروہ ہوئے: آنکھ سے رؤیت ماننے والے، اسے نہ ماننے اور دل سے رؤیت ماننے والے، اور توقف کرنے والے {cite:kitab-al-tawhid-ibn-khuzayma-shahwan-1988 p. 477-479} {cite:kitab-al-tawhid-ibn-khuzayma-shahwan-1988 p. 548}۔"
short_answer:
  ar: "أهل السنة فيها على أقوال: الإثبات ⁦(ومال إليه ابن خزيمة على قول ابن عباس)⁩، والرؤية بالقلب دون البصر ⁦(وبها جمع ابن حجر بين قولي ابن عباس وعائشة، ورجحها المحقق)⁩، والنفي على قول عائشة وابن مسعود، والتوقف ⁦(ورجحه القرطبي في المفهم)⁩."
  en: "Sunni scholars hold several views: affirmation (towards which Ibn Khuzayma leans, following Ibn 'Abbas); a vision of the heart, not the eyes (by which Ibn Hajar reconciled Ibn 'Abbas and 'A'isha, and which the editor prefers); denial, following 'A'isha and Ibn Mas'ud; and suspension (preferred by al-Qurtubi in al-Mufhim)."
  ur: "اہلِ سنت کے اس میں کئی اقوال ہیں: اثبات ⁦(جس کی طرف ابن خزیمہ ابن عباس کے قول پر مائل ہیں)⁩؛ آنکھ کے بجائے دل سے رؤیت ⁦(جس سے ابن حجر نے ابن عباس اور عائشہ کے اقوال میں تطبیق دی اور محقق نے اسے ترجیح دی)⁩؛ عائشہ اور ابن مسعود کے قول پر نفی؛ اور توقف ⁦(جسے قرطبی نے المفہم میں ترجیح دی)⁩۔"
