  - tradition: sunni
    id: vision-of-the-heart
    standing: main
    stance: { ar: "رآه بقلبه لا ببصره", en: "He saw Him with his heart, not with his eyes" }
    summary: { ar: "ينقل المحقق عن ابن حجر الجمع بين إثبات ابن عباس ونفي عائشة بحمل النفي على رؤية البصر والإثبات على رؤية القلب، وأن روايات ابن عباس المطلقة تُحمل على المقيدة بالفؤاد؛ وعن ابن القيم أن أحمد قال مرة رأى محمد ربه ومرة بفؤاده، وأن من حكى عنه «بعيني رأسه» تصرّف في الحكاية. ويرى المحقق أن هذا هو الصحيح، وأن آية النجم في رؤية جبريل.", en: "The editor quotes Ibn Hajar reconciling Ibn 'Abbas's affirmation and 'A'isha's denial by taking the denial as of eyesight and the affirmation as of the heart, the unqualified reports from Ibn 'Abbas being read by those qualified 'with his heart'; and Ibn al-Qayyim that Ahmad said once 'Muhammad saw his Lord' and once 'with his heart', and that whoever reported him as saying 'with the eyes of his head' altered the report. The editor holds this view correct, and reads the verse of al-Najm as the vision of Gabriel." }
    holders: [person/ibn-hajar-al-asqalani, person/ibn-qayyim-al-jawziyya, person/ahmad-ibn-hanbal, person/abu-dharr-al-ghifari]
    sources: [source/kitab-al-tawhid-ibn-khuzayma-shahwan-1988]
  - tradition: sunni
    id: denial-aisha
    standing: main
    stance: { ar: "لم يره في الدنيا", en: "He did not see Him in this world" }
    summary: { ar: "يُروى النفي عن عائشة وابن مسعود؛ واستدلت عائشة بالشورى 51 والأنعام 103. ويقول المحقق إن استدلالها لم يُسلَّم، وإن ابن خزيمة ناقشه في موضعه، وإن نفيها لا يُفهم منه استحالة الرؤية؛ وينقل عن القاضي عياض أن الرؤية جائزة عقلاً وثابتة للمؤمنين في الآخرة، وأنه ليس في وقوعها للنبي بعينه نص قاطع.", en: "Denial is reported from 'A'isha and Ibn Mas'ud; 'A'isha argued from al-Shura 51 and al-An'am 103. The editor says her argument was not accepted, that Ibn Khuzayma discusses it in its place, and that her denial does not imply that a vision is impossible; he quotes al-Qadi 'Iyad that the vision is rationally possible and established for the believers in the hereafter, and that there is no decisive text that the Prophet saw Him with his eyes." }
    holders: [person/aisha, person/abdullah-ibn-masud]
    sources: [source/kitab-al-tawhid-ibn-khuzayma-shahwan-1988]
  - tradition: sunni-maliki
    id: suspension
    standing: main
    stance: { ar: "التوقف", en: "Suspending judgement" }
    summary: { ar: "يذكر المحقق طائفة توقفت لأنه ليس في الباب دليل قاطع، وغاية ما استُدل به للطائفتين ظواهر متعارضة قابلة للتأويل، والمسألة اعتقادية لا بد فيها من دليل قطعي؛ وقد رجح القرطبي هذا القول في «المفهم».", en: "The editor mentions a group that suspended judgement because there is no decisive proof on the matter, the evidence on each side being apparent meanings that conflict and admit interpretation, while a question of creed needs decisive proof; al-Qurtubi preferred this view in al-Mufhim." }
