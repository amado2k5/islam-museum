    stance: { ar: "النبي رأى ربه، على ما أخبر ابن عباس", en: "The Prophet saw his Lord, as Ibn 'Abbas reported" }
    summary: { ar: "يروي ابن خزيمة قول ابن عباس: أتعجبون أن تكون الخلة لإبراهيم والكلام لموسى والرؤية لمحمد؛ ويرى أن قوله في النجم 18 رؤية جبريل كما في أخبار ابن مسعود، وأن تفسير النبي للنجم 13 بأنه رأى جبريل على صورته ثابت، لكنه يقول إنه جائز أن يكون النبي قد رأى ربه على ما أخبر ابن عباس، وإن لفظ خبر أبي ذر يحتمل النفي والإثبات. ويقول المحقق إن المؤلف يميل في هذا الموضع إلى الإثبات.", en: "Ibn Khuzayma narrates Ibn 'Abbas's saying, 'Do you wonder that close friendship should be Abraham's, speech Moses' and the vision Muhammad's?'; he takes al-Najm 18 as the vision of Gabriel, as in Ibn Mas'ud's reports, and accepts as established the Prophet's own explanation of al-Najm 13 as seeing Gabriel in his true form, yet says it is possible that the Prophet saw his Lord as Ibn 'Abbas reported, and that the wording of Abu Dharr's report can bear both denial and affirmation. The editor says the author here leans towards affirmation." }
