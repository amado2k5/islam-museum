question:
  ar: ما فتح مكة؟
short_answer:
  ar: فتح مكة رمضان 8هـ/630م؛ دخلها النبي بعشرة آلاف في غير قتال يذكر وأعلن العفو العام وطهّر الكعبة من
    الأصنام.
long_answer:
  ar: فتح مكة رمضان سنة ثمان؛ نكثت قريش صلح الحديبية فسار النبي إليها بعشرة آلاف ودخلها شبه سلمية؛ قال
    لأهلها اذهبوا فأنتم الطلقاء وطهّر الكعبة من 360 صنمًا وأذّن بلال فوقها؛ أكملت بذلك رسالته. {cite:wikidata}
