label:
  ar: ما فتح مكة؟
  en: What was the conquest of Mecca?
  es: "¿Qué fue la conquista de La Meca?"
summary:
  ar: فتح مكة رمضان 8هـ/630م؛ دخلها النبي بعشرة آلاف في غير قتال يذكر وأعلن العفو العام وطهّر الكعبة من
    الأصنام.
  en: "The conquest of Mecca, Ramadan 8 AH / 630 CE; the Prophet entered it with ten thousand men without any notable fighting, proclaimed a general amnesty, and cleansed the Ka'ba of idols."
  es: "La conquista de La Meca, Ramadán 8 AH / 630 d. C.; el Profeta entró en ella con diez mil hombres sin que se produjeran combates destacables, proclamó una amnistía general y purificó la Kaaba de ídolos."
question:
  ar: ما فتح مكة؟
short_answer:
  ar: فتح مكة رمضان 8هـ/630م؛ دخلها النبي بعشرة آلاف في غير قتال يذكر وأعلن العفو العام وطهّر الكعبة من
    الأصنام.
long_answer:
  ar: فتح مكة رمضان سنة ثمان؛ نكثت قريش صلح الحديبية فسار النبي إليها بعشرة آلاف ودخلها شبه سلمية؛ قال
    لأهلها اذهبوا فأنتم الطلقاء وطهّر الكعبة من 360 صنمًا وأذّن بلال فوقها؛ أكملت بذلك رسالته. {cite:wikidata}
