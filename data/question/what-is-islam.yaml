id: question/what-is-islam
class: question
label:
  ar: ما الإسلام؟
  en: What is Islam?
  es: "¿Qué es el Islam?"
  fr: "Qu'est-ce que l'islam ?"
summary:
  ar: الإسلام اسم الدين الذي جاء به النبي محمد، ومعناه في الحديث المشهور أن يعبد الإنسان الله وحده، ويقيم الصلاة، ويؤدي الزكاة، ويصوم رمضان، ويحج البيت لمن استطاع.
  en: "Islam is the name of the religion brought by the Prophet Muhammad. In the well-known hadith its meaning is that a person worships God alone, performs the prayer, pays zakat, fasts in Ramadan and makes the pilgrimage to the House for whoever is able."
  es: "Islam es el nombre de la religión traída por el profeta Mahoma. En el conocido hadiz, su significado es que una persona adora solo a Dios, realiza la oración, paga el zakat, ayuna en Ramadán y realiza la peregrinación a la Casa de Dios, según sus posibilidades."
  fr: "L'islam est le nom de la religion apportée par le prophète Mahomet. Selon un hadith bien connu, il signifie que l'on adore Dieu seul, que l'on accomplit la prière, que l'on s'acquitte de la zakat, que l'on jeûne pendant le ramadan et que l'on effectue le pèlerinage à la Maison sacrée pour ceux qui en ont les moyens."
