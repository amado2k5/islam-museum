    summary: { ar: "إن أريد بالمتعارضين القطعيان فلا يمكن تعارضهما، وإن أريد الظنيان قدّم الراجح، وإن كان أحدهما قطعياً قدّم لكونه قطعياً لا لكونه عقلياً؛ والقسمة الرباعية غير منحصرة؛ والعقل أصل في علمنا بصحة الشرع لا في ثبوته في نفس الأمر.", en: "If the conflicting proofs are both certain they cannot conflict; if both probable, the stronger is preferred; if one is certain it is preferred for being certain, not for being rational; the fourfold division is not exhaustive; and reason is the root of our knowing revelation's truth, not of its truth in itself.", ur: "اگر دونوں قطعی ہوں تو تعارض ممکن نہیں؛ اگر دونوں ظنی ہوں تو راجح مقدم؛ اگر ایک قطعی ہو تو وہ قطعی ہونے کی وجہ سے مقدم ہے، عقلی ہونے کی وجہ سے نہیں؛ چہار گانہ تقسیم منحصر نہیں؛ اور عقل ہمارے شرع کی صحت جاننے کی اصل ہے، اس کے فی نفسہ ثبوت کی نہیں۔" }
