id: question/must-reason-be-preferred-when-it-conflicts-with-revelation
class: question
label: { ar: "هل يقدَّم العقل إذا عارض النقل؟", en: "Must reason be preferred when it conflicts with revelation?", ur: "کیا عقل وحی سے ٹکرائے تو اسے مقدم کیا جائے؟" }
summary:
  ar: "مسألة «القانون الكلي»: قرر الرازي وأتباعه، وسبقهم الغزالي والجويني والباقلاني، أن الدليل العقلي القاطع يقدَّم على ظاهر النقل عند التعارض لأن العقل أصل النقل، ثم يتأول النقل أو يفوَّض؛ ورد ابن تيمية في «درء تعارض العقل والنقل» بأن القطعيين لا يتعارضان، وأن المقدم هو القطعي أو الراجح أياً كان، وأن العقل أصل في علمنا بالشرع لا في ثبوته."
  en: "The question of the 'universal law': al-Razi and his followers, anticipated by al-Ghazali, al-Juwayni and al-Baqillani, held that certain rational proof takes precedence over the apparent sense of a text when they conflict, since reason is the root of transmission, and the text is then interpreted or its meaning left to God. Ibn Taymiyya replied in Dar' Ta'arud al-'Aql wa'l-Naql that two certain proofs never conflict, that whichever is certain or stronger is preferred, and that reason is the root of our knowledge of revelation, not of its truth."
question: { ar: "هل يقدَّم العقل إذا عارض النقل؟", en: "Must reason be preferred when it conflicts with revelation?", ur: "کیا عقل وحی سے ٹکرائے تو اسے مقدم کیا جائے؟" }
issue: { ar: "إذا ظهر تعارض بين دليل عقلي ودليل سمعي في مسائل الاعتقاد، فأيهما يقدَّم، وهل التعارض ممكن أصلاً؟", en: "When a rational and a scriptural proof appear to conflict in matters of belief, which is preferred, and is such a conflict possible at all?", ur: "اگر عقیدے کے مسائل میں عقلی اور سمعی دلیل میں تعارض ظاہر ہو تو کسے مقدم کیا جائے، اور کیا ایسا تعارض ممکن بھی ہے؟" }
short_answer:
  ar: "الرازي وأتباعه ⁦(أشاعرة)⁩: يقدَّم العقل القاطع ويُتأول النقل أو يفوَّض. ابن تيمية ⁦(حنبلي)⁩: لا تعارض بين قطعيين، ويقدَّم القطعي أو الراجح لكونه كذلك لا لكونه عقلياً. الفلاسفة كابن سينا وابن رشد كما يعرضهم المحقق: ظاهر الشرع خطاب للجمهور، ويُتأول إذا خالف البرهان."
  en: "Al-Razi and his followers (Ash'ari): certain reason is preferred and the text is interpreted or its meaning left to God. Ibn Taymiyya (Hanbali): two certain proofs never conflict; the certain or stronger one is preferred as such, not for being rational. Philosophers such as Ibn Sina and Ibn Rushd, as the editor presents them: the apparent sense of revelation addresses the masses and is interpreted where it conflicts with demonstration."
  ur: "رازی اور ان کے پیروکار (اشاعرہ): قطعی عقل مقدم ہے اور نقل کی تاویل یا تفویض کی جائے۔ ابن تیمیہ (حنبلی): دو قطعی دلائل میں تعارض نہیں؛ قطعی یا راجح اپنی اسی حیثیت سے مقدم ہے، عقلی ہونے سے نہیں۔ ابن سینا اور ابن رشد جیسے فلاسفہ، محقق کی پیشکش میں: شرع کا ظاہر عوام سے خطاب ہے اور برہان کے خلاف ہو تو اس کی تاویل کی جائے۔"
