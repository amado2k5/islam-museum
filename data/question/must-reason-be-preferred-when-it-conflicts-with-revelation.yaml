    summary: { ar: "في «أساس التقديس» وغيره: إذا قامت الدلائل العقلية القطعية على شيء ووجدت أدلة نقلية يشعر ظاهرها بخلافه، بطلت الأقسام إلا أن يقطع بمقتضى العقل ويحكم بأن النقل غير صحيح أو أن المراد غير ظاهره، فيتأول أو يفوَّض؛ وسبقه الغزالي في «قانون التأويل» والجويني في «الإرشاد».", en: "In Asas al-Taqdis and elsewhere: if certain rational proofs establish something and transmitted proofs seem on their face to say otherwise, every option fails except to hold to what reason requires and judge that the text is either not authentic or not meant in its apparent sense, then interpret it or leave its meaning to God; al-Ghazali in Qanun al-Ta'wil and al-Juwayni in al-Irshad preceded him.", ur: "«اساس التقدیس» وغیرہ میں: اگر قطعی عقلی دلائل کسی بات پر قائم ہوں اور نقلی دلائل کا ظاہر اس کے خلاف ہو تو تمام صورتیں باطل ہیں سوائے اس کے کہ عقل کے تقاضے پر قطع کیا جائے اور نقل کو یا غیر صحیح یا غیر ظاہر مراد قرار دیا جائے، پھر تاویل یا تفویض کی جائے؛ غزالی «قانون التاویل» میں اور جوینی «الارشاد» میں ان سے پہلے یہ کہہ چکے تھے۔" }
