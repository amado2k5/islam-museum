id: question/what-is-qibla
class: question
label:
  ar: ما القبلة؟
  en: What is the qibla?
  es: "¿Qué es la qibla?"
  fr: "Qu'est-ce que la qibla ?"
  ur: "قبلہ کیا ہے؟"
summary:
  ar: القبلة هي جهة الكعبة المشرفة التي يتوجه إليها المسلمون في صلاتهم؛ تحولت إليها من بيت المقدس في المدينة.
  en: "The qibla is the direction of the Noble Kaaba that Muslims face in prayer. It was changed from Bayt al-Maqdis (Jerusalem) to the Kaaba while the community was in Medina."
  es: "La qibla es la dirección de la Noble Kaaba hacia la que se orientan los musulmanes al rezar. Su orientación cambió de Bayt al-Maqdis (Jerusalén) a la Kaaba cuando la comunidad se encontraba en Medina."
  fr: "La qibla est la direction de la Noble Kaaba vers laquelle les musulmans se tournent pour prier. Elle a été changée de Bayt al-Maqdis (Jérusalem) à la Kaaba lorsque la communauté était à Médine."
  ur: "قبلہ خانہ کعبہ کی وہ سمت ہے جس کا رخ مسلمان نماز میں کرتے ہیں۔ اسے بیت المقدس ⁦(یروشلم)⁩ سے کعبہ میں تبدیل کر دیا گیا جب کہ یہ کمیونٹی مدینہ میں تھی۔"
question:
  ar: ما القبلة؟
short_answer:
  ar: القبلة هي جهة الكعبة المشرفة التي يتوجه إليها المسلمون في صلاتهم؛ تحولت إليها من بيت المقدس في المدينة.
long_answer:
  ar: القبلة هي اتجاه [[building/masjid-al-haram|الكعبة]] الذي يستقبله المسلمون في صلاتهم من كل أرض. صلّى
    المسلمون نحو بيت المقدس نحو سنة ونصف بعد الهجرة ثم أُمروا بالتحول إلى الكعبة. ويعرف اتجاهها في كل
    مسجد [[concept/mihrab|بالمحراب]]، وقد بذل العلماء في تحديدها علوم الفلك والأسطرلاب. {cite:wikidata}
