question:
  ar: ما القبلة؟
short_answer:
  ar: القبلة هي جهة الكعبة المشرفة التي يتوجه إليها المسلمون في صلاتهم؛ تحولت إليها من بيت المقدس في المدينة.
long_answer:
  ar: القبلة هي اتجاه [[building/masjid-al-haram|الكعبة]] الذي يستقبله المسلمون في صلاتهم من كل أرض. صلّى
    المسلمون نحو بيت المقدس نحو سنة ونصف بعد الهجرة ثم أُمروا بالتحول إلى الكعبة. ويعرف اتجاهها في كل
    مسجد [[concept/mihrab|بالمحراب]]، وقد بذل العلماء في تحديدها علوم الفلك والأسطرلاب. {cite:wikidata}
