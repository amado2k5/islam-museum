id: question/adad-al-sahaba
class: question
label:
  ar: "كم كان عدد الصحابة؟"
  en: "How many Companions were there?"
  ur: "صحابہ کی تعداد کتنی تھی؟"
summary:
  ar: "ينقل الذهبي في مقدمة «تجريد أسماء الصحابة» أقوالاً تقيس أشياء مختلفة: قول الشافعي إن المسلمين عند وفاة النبي ستون ألفاً، وقول أبي زرعة إن من رآه وسمع منه زيادة على مائة ألف، وقول الحاكم إن الرواة عنه أربعة آلاف، ثم يرى هو أن الرواة نحو ألف وخمسمائة وأن المذكورين في كتابه نحو ثمانية آلاف {cite:tajrid-darbirr-v1 p. 67}."
  en: "In the preface to Tajrid Asma' al-Sahaba al-Dhahabi quotes figures that measure different things: al-Shafi'i's that the Muslims at the Prophet's death numbered sixty thousand, Abu Zur'a's that more than a hundred thousand saw and heard him, and al-Hakim's that four thousand narrated from him; his own view is that the narrators were about fifteen hundred and that those named in his book come to about eight thousand {cite:tajrid-darbirr-v1 p. 67}."
  ur: "ذہبی «تجرید اسماء الصحابہ» کے مقدمے میں ایسے اعداد نقل کرتے ہیں جو مختلف چیزیں ناپتے ہیں: شافعی کا قول کہ نبی کی وفات کے وقت مسلمان ساٹھ ہزار تھے، ابو زرعہ کا کہ ایک لاکھ سے زیادہ نے آپ کو دیکھا اور سنا، اور حاکم کا کہ چار ہزار نے آپ سے روایت کی؛ ان کی اپنی رائے یہ ہے کہ راوی تقریباً پندرہ سو تھے اور ان کی کتاب میں مذکور تقریباً آٹھ ہزار ہیں {cite:tajrid-darbirr-v1 p. 67}۔"
wings: [ideas, people]
themes: [scripture-and-its-sciences]
question:
  ar: "كم بلغ عدد من صحب النبي، وكم منهم روى عنه؟"
  en: "How many people were Companions of the Prophet, and how many of them narrated from him?"
  ur: "کتنے لوگ نبی کے صحابی تھے، اور ان میں سے کتنوں نے آپ سے روایت کی؟"
issue:
  ar: "تتفاوت الأعداد المنقولة بين أربعة آلاف ومائة ألف وزيادة؛ فهل هي أقوال متعارضة أم تقيس أشياء مختلفة: المسلمين جملة، ومن رأى النبي، ومن روى عنه، ومن دُوّنت تراجمهم؟"
  en: "The figures range from four thousand to over a hundred thousand: are they conflicting claims, or do they measure different things — all Muslims, those who saw the Prophet, those who narrated from him, and those whose biographies were recorded?"
  ur: "منقول اعداد چار ہزار سے ایک لاکھ سے زیادہ تک ہیں: کیا یہ متعارض اقوال ہیں، یا مختلف چیزیں ناپتے ہیں — تمام مسلمان، نبی کو دیکھنے والے، آپ سے روایت کرنے والے، اور جن کے تراجم مدوّن ہوئے؟"
short_answer:
  ar: "يجمع الذهبي هذه الأقوال جنباً إلى جنب: فالأعداد الكبيرة لمن أسلم أو رأى النبي، والأعداد الصغيرة لمن روى عنه أو عُرفت ترجمته، ويقدّر الرواة بنحو ألف وخمسمائة لا يبلغون ألفين، والمذكورين في الكتب بنحو ثمانية آلاف أكثرهم لا يُعرفون."
  en: "Al-Dhahabi sets these statements side by side: the large figures concern those who became Muslim or saw the Prophet, the small ones those who narrated from him or whose biographies are known; he puts the narrators at about fifteen hundred, never reaching two thousand, and those recorded in the books at about eight thousand, most of them little known."
  ur: "ذہبی ان اقوال کو ساتھ ساتھ رکھتے ہیں: بڑے اعداد ان کے ہیں جو مسلمان ہوئے یا جنہوں نے نبی کو دیکھا، اور چھوٹے ان کے جنہوں نے روایت کی یا جن کا ترجمہ معلوم ہے؛ وہ راویوں کو تقریباً پندرہ سو بتاتے ہیں جو دو ہزار تک کبھی نہیں پہنچتے، اور کتابوں میں مذکور افراد کو تقریباً آٹھ ہزار، جن میں اکثر غیر معروف ہیں۔"
