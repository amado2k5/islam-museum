short_answer:
  ar: أبو الحسن المسعودي (نحو 896–956) مؤرخ وجغرافي بغدادي؛ صاحب مروج الذهب ومن رواد التاريخ الثقافي المقارن.
long_answer:
  ar: '[[person/al-masudi|المسعودي]] رحالة مؤرخ جاب الهند وفارس والجزيرة ومصر والشام؛ كتب مروج الذهب ومعادن
    الجوهر والتنبيه والإشراف في تاريخ الأمم والطبيعة والأديان؛ وصف بأنه هرودوت العرب لجمعه التاريخ بالرحلة
    والمشاهدة. {cite:wikidata}'
