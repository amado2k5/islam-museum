summary:
  ar: أبو الحسن المسعودي ⁦(نحو 896–956)⁩ مؤرخ وجغرافي بغدادي؛ صاحب مروج الذهب ومن رواد التاريخ الثقافي المقارن.
  en: "Abu al-Hasan al-Masudi (c. 896–956), a historian and geographer from Baghdad, author of Muruj al-Dhahab (The Meadows of Gold), and one of the pioneers of comparative cultural history."
  es: "Abu al-Hasan al-Masudi (c. 896–956), historiador y geógrafo de Bagdad, autor de Muruj al-Dhahab (Los prados de oro) y uno de los pioneros de la historia cultural comparada."
  fr: "Abu al-Hasan al-Masudi (vers 896-956), historien et géographe de Bagdad, auteur de Muruj al-Dhahab (Les Prairies d'Or), et l'un des pionniers de l'histoire culturelle comparée."
  ur: "ابو الحسن المسعودی (c. 896-956)، بغداد کے ایک مورخ اور جغرافیہ دان، مروج الذہاب ⁦(سونے کے میدان)⁩ کے مصنف، اور تقابلی ثقافتی تاریخ کے علمبرداروں میں سے ایک۔"
  tr: "Abu al-Hasan al-Mas'udi (yaklaşık 896–956), Bağdadlı bir tarihçi ve coğrafyacıydı; Muruj al-Dhahab'ın sahibi ve karşılaştırmalı kültürel tarihin öncüsüydü."
  id: "Abu al-Hasan al-Mas'udi (sekitar 896–956) adalah seorang sejarawan dan ahli geografi Baghdadi; pemilik Muruj al-Dhahab dan pelopor sejarah budaya komparatif."
question:
  ar: من كان المسعودي؟
short_answer:
  ar: أبو الحسن المسعودي ⁦(نحو 896–956)⁩ مؤرخ وجغرافي بغدادي؛ صاحب مروج الذهب ومن رواد التاريخ الثقافي المقارن.
long_answer:
  ar: '[[person/al-masudi|المسعودي]] رحالة مؤرخ جاب الهند وفارس والجزيرة ومصر والشام؛ كتب مروج الذهب ومعادن
    الجوهر والتنبيه والإشراف في تاريخ الأمم والطبيعة والأديان؛ وصف بأنه هرودوت العرب لجمعه التاريخ بالرحلة
    والمشاهدة. {cite:wikidata}'
