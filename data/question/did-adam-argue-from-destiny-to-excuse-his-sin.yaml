id: question/did-adam-argue-from-destiny-to-excuse-his-sin
class: question
label: { ar: "هل احتج آدم على موسى بالقدر لدفع الملام عن الذنب؟", en: "Did Adam argue from destiny against Moses to excuse his sin?", ur: "کیا آدم نے موسیٰ کے مقابل گناہ کی ملامت دور کرنے کے لیے تقدیر سے استدلال کیا؟" }
summary:
  ar: "في الصحيحين حديث محاجة آدم وموسى وفيه «فحج آدم موسى». يذكر ابن تيمية أن كثيراً من الناس ظنوا أن آدم احتج بالقدر على نفي الملام عن الذنب، فصاروا ثلاثة أحزاب: فريق كذّب الحديث كأبي علي الجبائي، وفريق تأوله تأويلات يراها فاسدة، وفريق جعله حجة لسقوط الملام عن العصاة؛ ويرى هو أن الاحتجاج كان في المصيبة لا في الذنب، لأن آدم كان قد تاب وغُفر له."
  en: "The two Sahihs relate the debate of Adam and Moses, ending 'So Adam prevailed over Moses'. Ibn Taymiyya says many took it that Adam argued from destiny to deny blame for his sin, and so split into three parties: one rejected the hadith, such as Abu Ali al-Jubba'i; one interpreted it in ways he holds unsound; and one made it a proof that sinners are free of blame. His own view is that the argument concerned the calamity, not the sin, since Adam had already repented and been forgiven."
question: { ar: "هل احتج آدم على موسى بالقدر لدفع الملام عن الذنب؟", en: "Did Adam argue from destiny against Moses to excuse his sin?", ur: "کیا آدم نے موسیٰ کے مقابل گناہ کی ملامت دور کرنے کے لیے تقدیر سے استدلال کیا؟" }
issue: { ar: "معنى قوله «فحج آدم موسى»، وهل يصح الاحتجاج بالقدر على المعاصي.", en: "The meaning of 'So Adam prevailed over Moses', and whether one may argue from destiny to excuse sins.", ur: "«آدم موسیٰ پر غالب آ گئے» کا مطلب، اور کیا گناہوں کے لیے تقدیر سے دلیل لانا درست ہے۔" }
short_answer:
  ar: "ابن تيمية: الاحتجاج بالقدر يصح في المصائب لا في الذنوب؛ لام موسى آدم على المصيبة التي لحقته وذريته، وآدم كان قد تاب، والمصيبة مقدرة، فحجه. أبو المظفر السمعاني: ساغ لهما ذلك لأنهما نبيان خُصّا بعلم الحقائق. المعتزلة كالجبائي: ردّوا الحديث."
  en: "Ibn Taymiyya: arguing from destiny is valid for calamities, not for sins; Moses blamed Adam for the calamity that befell him and his offspring, Adam had repented, and the calamity was decreed, so Adam prevailed. Abu al-Muzaffar al-Sam'ani: it was allowed to them as two prophets given knowledge of realities. Mu'tazilis such as al-Jubba'i: they rejected the hadith."
  ur: "ابن تیمیہ: تقدیر سے استدلال مصائب میں درست ہے، گناہوں میں نہیں؛ موسیٰ نے آدم کو اس مصیبت پر ملامت کی جو انہیں اور ان کی اولاد کو پہنچی، آدم توبہ کر چکے تھے اور مصیبت مقدر تھی، اس لیے وہ غالب آئے۔ ابو المظفر سمعانی: یہ ان دونوں کے لیے جائز تھا کیونکہ وہ حقائق کے علم سے مخصوص دو نبی تھے۔ معتزلہ جیسے جبائی: انہوں نے حدیث کو رد کیا۔"
