    summary: { ar: "في نقل ابن تيمية: يقول كثير من متأخري الصوفية المدعين للحقيقة إن الحديث في حق من شهد توحيد الربوبية فرأى أن لا فاعل إلا الله، فلا يستحسن حسنة ولا يستقبح سيئة؛ ويقول إنه قول طائفة من أهل العلم أيضاً، ويرده.", en: "As Ibn Taymiyya reports: many later Sufis claiming the reality say the hadith concerns one who has witnessed the unity of lordship and sees no agent but God, so that he neither approves good nor condemns evil; he says some people of knowledge also held it, and rejects it.", ur: "ابن تیمیہ کی نقل میں: حقیقت کے دعوے دار بہت سے متاخر صوفیہ کہتے ہیں کہ حدیث اس شخص کے بارے میں ہے جس نے توحیدِ ربوبیت کا شہود کیا اور اللہ کے سوا کوئی فاعل نہیں دیکھتا، چنانچہ نہ نیکی کو اچھا سمجھتا ہے نہ برائی کو برا؛ وہ کہتے ہیں کہ بعض اہلِ علم کا بھی یہ قول ہے، اور اسے رد کرتے ہیں۔" }
