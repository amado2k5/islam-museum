question:
  ar: من كان جابر بن عبد الله؟
short_answer:
  ar: جابر بن عبد الله الأنصاري (ت. 697م) آخر من مات من الصحابة في المدينة؛ شهد بيعة العقبة وسبع عشرة
    غزوة وروى 1540 حديثًا.
long_answer:
  ar: '[[person/jabir-ibn-abdullah|جابر بن عبد الله]] من صبيان الأنصار في بيعة العقبة وصار أعمق الصحابة
    فقهًا في فرائض ومواريث؛ شهد المعارك كلها إلا بدرًا وأُحد لرضا النبي ببقائه في أبويه؛ عمي آخر عمره
    ومات في المدينة فصلى عليه الحجاج وقيل آخر من مات من الصحابة. {cite:wikidata}'
