id: question/who-was-jabir-ibn-abdullah
class: question
label:
  ar: من كان جابر بن عبد الله؟
  en: Who was Jabir ibn Abdullah?
  es: "¿Quién fue Jabir ibn Abdullah?"
  fr: "Qui était Jabir ibn Abdullah ?"
  ur: "جابر بن عبداللہ کون تھے؟"
  tr: "Cabir ibn Abdullah kimdi?"
  id: "Siapakah Jabir ibn Abdullah?"
summary:
  ar: جابر بن عبد الله الأنصاري ⁦(ت. 697م)⁩ آخر من مات من الصحابة في المدينة؛ شهد بيعة العقبة وسبع عشرة
    غزوة وروى 1540 حديثًا.
  en: "Jabir ibn Abd Allah al-Ansari (d. 697 CE) was the last of the Companions to die in Medina; he witnessed the Pledge of al-Aqaba and seventeen campaigns and narrated 1540 hadiths."
  es: "Jabir ibn Abd Allah al-Ansari (fallecido en el año 697 d. C.) fue el último de los Compañeros en morir en Medina; presenció el Juramento de al-Aqaba y diecisiete campañas, y narró 1540 hadices."
  fr: "Jabir ibn Abd Allah al-Ansari (mort en 697 CE) fut le dernier des Compagnons à mourir à Médine; il fut témoin du Serment d'al-Aqaba et de dix-sept campagnes et a rapporté 1540 hadiths."
  ur: "جابر بن عبد اللہ الانصاری ⁦(متوفی 697 عیسوی)⁩ مدینہ میں وفات پانے والے آخری صحابہ تھے۔ اس نے بیعت عقبہ اور سترہ مہمات دیکھی اور 1540 احادیث بیان کیں۔"
  tr: "Cabir bin Abdullah el-Ensari (ö. 697), Medine'de ölen son sahabeydi; Akeba yeminini ve on yedi savaşı tanıklık etti, 1.540 hadis rivayet etti."
  id: "Jabir ibn Abdullah al-Ansari (wafat 697 M) adalah sahabat terakhir yang meninggal di Madinah; ia menyaksikan ikrar Aqabah dan tujuh belas peperangan, menceritakan 1.540 hadits."
question:
  ar: من كان جابر بن عبد الله؟
short_answer:
  ar: جابر بن عبد الله الأنصاري ⁦(ت. 697م)⁩ آخر من مات من الصحابة في المدينة؛ شهد بيعة العقبة وسبع عشرة
    غزوة وروى 1540 حديثًا.
long_answer:
  ar: '[[person/jabir-ibn-abdullah|جابر بن عبد الله]] من صبيان الأنصار في بيعة العقبة وصار أعمق الصحابة
    فقهًا في فرائض ومواريث؛ شهد المعارك كلها إلا بدرًا وأُحد لرضا النبي ببقائه في أبويه؛ عمي آخر عمره
    ومات في المدينة فصلى عليه الحجاج وقيل آخر من مات من الصحابة. {cite:wikidata}'
