label:
  ar: ما الآخرة في الإسلام؟
  en: What is the afterlife in Islam?
summary:
  ar: الآخرة عقيدة الحياة بعد الموت، وفيها البعث والحساب والجنة والنار، وهي من بنود العقيدة التي تعرض في الكتب الكلامية والحديثية.
  en: The afterlife is the belief in life after death, which includes resurrection, reckoning, Paradise and Hell. It is one of the articles of belief treated in works of theology and hadith.
wings: []
question:
  ar: ما الآخرة في الإسلام؟
short_answer:
  ar: الآخرة عقيدة الحياة بعد الموت، وفيها البعث والحساب والجنة والنار، وهي من بنود العقيدة التي تعرض في الكتب الكلامية والحديثية.
long_answer:
  ar: |
    الآخرة في الإسلام الحياة بعد الموت، وتشمل عذاب القبر، والبعث، والحساب، والصراط، والميزان، والجنة والنار، كما تعرض بنود العقيدة الطحاوية في مدخل [[concept/akhira|الآخرة]].
    وتُعدّ الآخرة جزءاً من الإيمان، إذ هي أحد أركانه، كما يعرض مدخل [[concept/iman|الإيمان]].
    والتفاصيل في الآخرة تختلف فيها الروايات والشروح، ويعرض مدخل [[concept/akhira|الآخرة]] الأصول دون تفصيل الخلافات.
