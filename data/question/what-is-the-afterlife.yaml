id: question/what-is-the-afterlife
class: question
label:
  ar: ما الآخرة في الإسلام؟
  en: What is the afterlife in Islam?
  es: "¿Qué es la vida después de la muerte en el Islam?"
  fr: "Qu'est-ce que l'au-delà en Islam ?"
  ur: "اسلام میں بعد کی زندگی کیا ہے؟"
summary:
  ar: الآخرة عقيدة الحياة بعد الموت، وفيها البعث والحساب والجنة والنار، وهي من بنود العقيدة التي تعرض في الكتب الكلامية والحديثية.
  en: The afterlife is the belief in life after death, which includes resurrection, reckoning, Paradise and Hell. It is one of the articles of belief treated in works of theology and hadith.
  es: "La creencia en la vida después de la muerte abarca la resurrección, el juicio final, el Paraíso y el Infierno. Es uno de los temas tratados en obras de teología y hadices."
  fr: "L'au-delà est la croyance en une vie après la mort, incluant la résurrection, le jugement dernier, le paradis et l'enfer. C'est un des articles de foi traités dans les ouvrages de théologie et les hadiths."
  ur: "بعد کی زندگی موت کے بعد کی زندگی کا عقیدہ ہے جس میں قیامت، حساب، جنت اور جہنم شامل ہیں۔ یہ عقیدہ کے مضامین میں سے ایک ہے جس کا علاج الہیات اور حدیث کے کاموں میں کیا گیا ہے۔"
wings: []
question:
  ar: ما الآخرة في الإسلام؟
short_answer:
  ar: الآخرة عقيدة الحياة بعد الموت، وفيها البعث والحساب والجنة والنار، وهي من بنود العقيدة التي تعرض في الكتب الكلامية والحديثية.
long_answer:
  ar: |
    الآخرة في الإسلام الحياة بعد الموت، وتشمل عذاب القبر، والبعث، والحساب، والصراط، والميزان، والجنة والنار، كما تعرض بنود العقيدة الطحاوية في مدخل [[concept/akhira|الآخرة]].
    وتُعدّ الآخرة جزءاً من الإيمان، إذ هي أحد أركانه، كما يعرض مدخل [[concept/iman|الإيمان]].
    والتفاصيل في الآخرة تختلف فيها الروايات والشروح، ويعرض مدخل [[concept/akhira|الآخرة]] الأصول دون تفصيل الخلافات.
