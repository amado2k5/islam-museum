  id: zahiri-ibn-hazm-all-trained-predators
  standing: secondary
  stance: { ar: "الظاهرية ⁦(ابن حزم)⁩: الكلب وسائر سباع ذوات الأربع والطير سواء إذا عُلّمت، ويحرم ما أكل منه الجارح", en: "Zahiri (Ibn Hazm): the dog and all other four-legged and bird predators are alike once trained, and prey the predator has eaten from is forbidden", ur: "ظاہری (ابن حزم): کتا اور تمام چوپائے اور پرندے شکاری جانور تربیت کے بعد برابر ہیں، اور جس شکار سے شکاری جانور نے کھا لیا وہ حرام ہے" }
  summary: { ar: "يرى ابن حزم أن الكلب وغيره من سباع ذوات الأربع والبازي وغيره من سباع الطير سواء في حل ما قتلت إذا كانت معلمة، والمعلم عنده ما لا ينطلق حتى يطلقه صاحبه وإذا أخذ وقتل لم يأكل، فيحل ما صاده في أول مرة يظهر فيها ذلك، وهو قول أبي ثور خلافاً لداود؛ ويحل ما قتله بجرح أو رض أو صدم أو خنق، ويحرم ما أكل منه، خلافاً لمالك، ولأبي حنيفة في البازي.", en: "Ibn Hazm holds that the dog and other four-legged predators, and the falcon and other birds of prey, are alike: what they kill is lawful once they are trained; for him a trained predator is one that does not set off until its owner sends it and, having caught and killed, does not eat; what it catches on the first occasion it shows this is lawful, which is Abu Thawr's view against Dawud's; prey killed by wounding, crushing, striking or strangling is lawful; prey it has eaten from is forbidden, against Malik, and against Abu Hanifa for the falcon.", ur: "ابن حزم کے نزدیک کتا اور دوسرے چوپائے شکاری، اور باز اور دوسرے شکاری پرندے برابر ہیں: تربیت یافتہ ہوں تو ان کا مارا ہوا حلال ہے؛ ان کے نزدیک تربیت یافتہ وہ ہے جو مالک کے چھوڑے بغیر نہ دوڑے اور پکڑ کر مارنے کے بعد نہ کھائے؛ جس پہلی بار یہ ظاہر ہو اس کا شکار حلال ہے، جو ابو ثور کا قول ہے نہ کہ داؤد کا؛ زخم، کچلنے، ٹکر یا گلا گھونٹنے سے مارا گیا شکار حلال ہے؛ اور جس سے اس نے کھا لیا وہ حرام ہے، مالک کے برخلاف، اور باز کے بارے میں ابو حنیفہ کے برخلاف۔" }
