question:
  ar: هل يحل صيد البازي والصقر والفهد وسائر الجوارح المعلَّمة إذا قتلت الصيد؟
  en: Is game killed by a trained hawk, falcon, cheetah or other trained animal lawful?
  ur: کیا سدھائے ہوئے باز، شکرے، چیتے وغیرہ کا مارا ہوا شکار حلال ہے؟
issue:
  ar: 'من آلات ذكاة الصيد: هل تختص بالكلب؟'
  en: 'Among the instruments that make game lawful: is it restricted to the dog?'
  ur: 'شکار کی ذکاۃ کے آلات: کیا یہ کتے تک محدود ہے؟'
short_answer:
  ar: 'مالك وفقهاء الأمصار: كل جارح يقبل التعليم آلة لذكاة الصيد؛ ومجاهد وقوم: الكلب وحده؛ وبعضهم: الكلب والبازي.'
  en: 'Malik and the jurists of the cities: any animal that accepts training is an instrument of lawful hunting; Mujahid and others: the dog alone; some: the dog and the goshawk.'
  ur: 'مالک اور فقہائے امصار: ہر وہ شکاری جانور جو تعلیم قبول کرے؛ مجاہد وغیرہ: صرف کتا؛ بعض: کتا اور باز۔'
