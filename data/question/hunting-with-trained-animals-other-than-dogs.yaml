id: question/hunting-with-trained-animals-other-than-dogs
class: question
label:
  ar: هل يُصاد بالجوارح غير الكلاب؟
  en: May one hunt with trained animals other than dogs?
  ur: کیا کتوں کے علاوہ سدھائے ہوئے جانوروں سے شکار جائز ہے؟
summary:
  ar: 'مسألة من كتاب الصيد يحكيها ابن رشد: اتفقوا على الاصطياد بالكلاب المعلَّمة، وكره قوم الكلب الأسود البهيم، واختلفوا فيما عدا الكلب من جوارح السباع والطير؛ فأجاز مالك وأصحابه وفقهاء الأمصار كل ما قبل التعليم، وهو مروي عن ابن عباس، وقال قوم منهم مجاهد: لا اصطياد بغير الكلب إلا ما أُدركت ذكاته، واستثنى بعضهم البازي وحده {cite:bidaya-abbadi-dar-al-salam-v3 p. 12} {cite:bidaya-abbadi-dar-al-salam-v3 p. 13}.'
  en: 'A question from the book of hunting reported by Ibn Rushd: all agree on hunting with trained dogs, some disliked the jet-black dog, and they differed over trained beasts and birds other than the dog. Malik, his followers and the jurists of the great cities allowed everything that accepts training, a view reported from Ibn Abbas; a group including Mujahid said there is no hunting with anything but the dog except what is caught alive and slaughtered; and some excepted the goshawk alone.'
  ur: 'کتاب الصید کا ایک مسئلہ جسے ابن رشد بیان کرتے ہیں: سدھائے ہوئے کتوں سے شکار پر اتفاق ہے، بعض نے بالکل سیاہ کتے کو مکروہ کہا، اور کتے کے سوا شکاری درندوں اور پرندوں میں اختلاف ہوا۔ مالک، ان کے اصحاب اور فقہائے امصار نے ہر اس جانور کو جائز کہا جو تعلیم قبول کرے، اور یہ ابن عباس سے مروی ہے؛ مجاہد سمیت ایک گروہ نے کہا کہ کتے کے سوا کسی سے شکار نہیں مگر جو زندہ پا کر ذبح کر لیا جائے؛ اور بعض نے صرف باز کو مستثنیٰ کیا۔'
wings:
