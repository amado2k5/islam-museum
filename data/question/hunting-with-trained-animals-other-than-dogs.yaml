    ar: كل ما قبل التعليم من الجوارح آلة لذكاة الصيد
    en: Every animal that accepts training is an instrument of lawful hunting
    ur: ہر سدھایا جا سکنے والا شکاری جانور شکار کی ذکاۃ کا آلہ ہے
  summary:
    ar: مذهب مالك وأصحابه وفقهاء الأمصار، ومروي عن ابن عباس، حتى السنور كما قال ابن شعبان؛ ويستند إلى عموم آية الجوارح.
    en: The view of Malik, his followers and the jurists of the great cities, reported from Ibn Abbas - even the cat, as Ibn Sha'ban said - resting on the general wording of the verse on trained hunting animals.
    ur: مالک، ان کے اصحاب اور فقہائے امصار کا مذہب، ابن عباس سے مروی — حتیٰ کہ بلی بھی، جیسا کہ ابن شعبان نے کہا — جو شکاری جانوروں کی آیت کے عموم پر مبنی ہے۔
