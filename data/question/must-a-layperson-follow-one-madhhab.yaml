id: question/must-a-layperson-follow-one-madhhab
class: question
label: { ar: "هل يلزم العامي أن يتمذهب بمذهب واحد؟", en: "Must a layperson keep to a single school of law?", ur: "کیا عام آدمی پر ایک ہی مذہب کی پابندی لازم ہے؟" }
summary:
  ar: "يحكي ابن قيم الجوزية في «إعلام الموقعين» في لزوم التمذهب للعامي مذهبين: أنه لا يلزمه، وهو ما يراه الصواب، وأنه يلزمه، ومنهم من قال يلزمه مذهب عالم ما، ومنهم من خصه بأحد المذاهب الأربعة، ويرى ابن القيم القولين الأخيرين أبعد."
  en: "In I'lam al-Muwaqqi'in, Ibn Qayyim al-Jawziyya reports two positions on whether a layperson must adhere to a school: that he need not, which Ibn al-Qayyim holds to be right, and that he must, either to some scholar's school or to one of the four schools, which he considers further from the truth."
question: { ar: "هل يلزم العامي أن يتمذهب بمذهب واحد؟", en: "Must a layperson keep to a single school of law?" }
issue: { ar: "هل يجب على من ليس من أهل النظر أن ينتسب إلى مذهب فقهي معيّن فيأخذ بأقواله كلها؟" }
short_answer:
  ar: "ابن القيم: لا يلزمه، بل لا يصح للعامي مذهب، وعليه اتباع الحق بحسب الإمكان دون تتبع الرخص؛ ويحكي من قال بلزوم مذهب عالم أو أحد الأربعة."
  en: "Ibn al-Qayyim: he need not; a layperson cannot truly have a school, and must follow the truth as far as he can without hunting for concessions. He reports others who required a scholar's school or one of the four."
