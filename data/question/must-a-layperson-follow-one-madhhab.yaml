id: question/must-a-layperson-follow-one-madhhab
class: question
label: { ar: "هل يلزم العامي أن يتمذهب بمذهب واحد؟", en: "Must a layperson keep to a single school of law?", ur: "کیا عام آدمی پر ایک ہی مذہب کی پابندی لازم ہے؟", es: "¿Debe un ciudadano común atenerse a una sola escuela de derecho?", fr: "Un profane doit-il se conformer à une seule école de droit ?" }
summary:
  ar: "يحكي ابن قيم الجوزية في «إعلام الموقعين» في لزوم التمذهب للعامي مذهبين: أنه لا يلزمه، وهو ما يراه الصواب، وأنه يلزمه، ومنهم من قال يلزمه مذهب عالم ما، ومنهم من خصه بأحد المذاهب الأربعة، ويرى ابن القيم القولين الأخيرين أبعد."
  en: "In I'lam al-Muwaqqi'in, Ibn Qayyim al-Jawziyya reports two positions on whether a layperson must adhere to a school: that he need not, which Ibn al-Qayyim holds to be right, and that he must, either to some scholar's school or to one of the four schools, which he considers further from the truth."
  es: "En I'lam al-Muwaqqi'in, Ibn Qayyim al-Jawziyya expone dos posturas sobre si un laico debe adherirse a una escuela: que no necesita hacerlo, lo cual Ibn al-Qayyim considera correcto, y que debe hacerlo, ya sea a la escuela de algún erudito o a una de las cuatro escuelas, lo cual él considera más alejado de la verdad."
  fr: "Dans I'lam al-Muwaqqi'in, Ibn Qayyim al-Jawziyya rapporte deux positions sur la question de savoir si un laïc doit adhérer à une école: qu'il n'y est pas tenu, ce qu'Ibn al-Qayyim considère comme juste, et qu'il le doit, soit à l'école d'un savant, soit à l'une des quatre écoles, ce qu'il considère comme plus éloigné de la vérité."
  ur: "علم الموقعین میں ابن قیم الجوزیہ نے اس بارے میں دو موقف بیان کیے ہیں کہ آیا ایک عام آدمی کو کسی مکتب کی پابندی کرنی چاہیے: اسے اس کی ضرورت نہیں ہے، جسے ابن القیم صحیح کہتے ہیں، اور یہ کہ اسے چاہیے کہ وہ کسی علمی مکتب سے ہو یا ان چار مکاتب میں سے کسی ایک کو، جسے وہ حق سے آگے سمجھتا ہے۔"
question: { ar: "هل يلزم العامي أن يتمذهب بمذهب واحد؟", en: "Must a layperson keep to a single school of law?" }
issue: { ar: "هل يجب على من ليس من أهل النظر أن ينتسب إلى مذهب فقهي معيّن فيأخذ بأقواله كلها؟" }
short_answer:
  ar: "ابن القيم: لا يلزمه، بل لا يصح للعامي مذهب، وعليه اتباع الحق بحسب الإمكان دون تتبع الرخص؛ ويحكي من قال بلزوم مذهب عالم أو أحد الأربعة."
  en: "Ibn al-Qayyim: he need not; a layperson cannot truly have a school, and must follow the truth as far as he can without hunting for concessions. He reports others who required a scholar's school or one of the four."
