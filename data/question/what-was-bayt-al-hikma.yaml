label:
  ar: ما بيت الحكمة؟
  en: What was the Bayt al-Hikma?
  es: "¿Qué fue el Bayt al-Hikma?"
  fr: "Qu'était-ce que le Bayt al-Hikma ?"
summary:
  ar: بيت الحكمة مكتبة بغداد ومرصد المأمون؛ أكبر مؤسسة علمية في عصرها جمعت الترجمة والتأليف والرصد في
    القرنين الثالث والرابع الهجريين.
  en: "The House of Wisdom, the library of Baghdad and the observatory of al-Ma'mun; the largest scholarly institution of its time, which brought together translation, composition and observation in the third and fourth centuries AH."
  es: "La Casa de la Sabiduría, la biblioteca de Bagdad y el observatorio de al-Ma'mun; la mayor institución académica de su época, que reunió traducción, composición y observación en los siglos III y IV de la Hégira."
  fr: "La Maison de la Sagesse, la bibliothèque de Bagdad et l'observatoire d'al-Ma'mun; la plus grande institution savante de son temps, qui réunissait la traduction, la composition et l'observation aux IIIe et IVe siècles de l'Hégire."
question:
  ar: ما بيت الحكمة؟
short_answer:
  ar: بيت الحكمة مكتبة بغداد ومرصد المأمون؛ أكبر مؤسسة علمية في عصرها جمعت الترجمة والتأليف والرصد في
    القرنين الثالث والرابع الهجريين.
long_answer:
  ar: '[[building/bayt-al-hikma|بيت الحكمة]] خزانة كتب الخلفاء العباسيين في بغداد؛ بلغت أوجها بالمأمون فصارت
    مركز الترجمة الكبرى لليونانية والفارسية والهندية ومرصدًا ومجمعًا للعلماء كالخوارزمي وحنين بن إسحاق؛
    دمرت مع بغداد 1258 على رواية الغزو. {cite:wikidata}'
