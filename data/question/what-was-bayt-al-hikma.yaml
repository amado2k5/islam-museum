long_answer:
  ar: '[[building/bayt-al-hikma|بيت الحكمة]] خزانة كتب الخلفاء العباسيين في بغداد؛ بلغت أوجها بالمأمون فصارت
    مركز الترجمة الكبرى لليونانية والفارسية والهندية ومرصدًا ومجمعًا للعلماء كالخوارزمي وحنين بن إسحاق؛
