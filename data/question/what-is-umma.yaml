question:
  ar: ما الأمة؟
short_answer:
  ar: الأمة هي جماعة المؤمنين الواحدة عابرة الأجناس والأمصار؛ وحدة عقدية لا عرقية من عهد وثيقة المدينة
    إلى اليوم.
long_answer:
  ar: الأمة هي جماعة أهل القبلة الواحدة بربط الإيمان لا الدم ولا اللسان؛ قررتها [[concept/umma|وثيقة المدينة]]
    «أنهم أمة من دون الناس». توسّعت مدلولاتها من جماعة المسلمين إلى الأمة الإسلامية العالمية في الأدبيات
    الحديثة، وبقيت وحدة لا مركزية في دول شتى. {cite:wikidata}
