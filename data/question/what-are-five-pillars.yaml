id: question/what-are-five-pillars
class: question
label:
  ar: "ما أركان الإسلام الخمسة؟"
  en: What are the five pillars of Islam?
summary:
  ar: "أركان الإسلام الخمسة كما يذكرها الحديث الصحيح: شهادة أن لا إله إلا الله وأن محمداً رسول الله، وإقام الصلاة، وإيتاء الزكاة، وصوم رمضان، وحج البيت لمن استطاع."
  en: "The five pillars of Islam, as the authentic hadith lists them, are: the testimony that there is no god but God and that Muhammad is the Messenger of God; establishing the prayer; giving zakat; fasting in Ramadan; and pilgrimage to the House for those able to make it."
wings: []
question:
  ar: "ما أركان الإسلام الخمسة؟"
short_answer:
  ar: "أركان الإسلام الخمسة كما يذكرها الحديث الصحيح: شهادة أن لا إله إلا الله وأن محمداً رسول الله، وإقام الصلاة، وإيتاء الزكاة، وصوم رمضان، وحج البيت لمن استطاع."
long_answer:
  ar: |
    أركان الإسلام الخمسة هي الأعمال التي بُني عليها الإسلام في الحديث الصحيح {cite:sahih-al-bukhari 8}، وتفصيلها في مدخل [[concept/five-pillars|أركان الإسلام الخمسة]].
    وهي: الشهادة، ثم [[practice/salah|الصلاة]]، ثم [[practice/zakat|الزكاة]]، ثم [[practice/sawm-ramadan|صيام رمضان]]، ثم [[practice/hajj|الحج]] لمن استطاع إليه سبيلاً.
    والركن الأول هو [[concept/shahada|الشهادة]]، وهو الباب الذي يدخل منه المسلم إلى الإسلام، ويرتبط به [[concept/tawhid|التوحيد]] أصل العقيدة.
