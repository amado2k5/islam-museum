    summary:
      ar: "تعقد رسالة «جهود الألوسي البلاغية» مسألة بعنوان «الألوسي سلفي العقيدة في الجملة»، وتقدم لها بالتحذير من التسرع في الحكم على عقائد العلماء وحمل كلامهم على أحسن المحامل، وتنقل عن ابن تيمية والذهبي وابن القيم في معاملة العلماء الذين جمعوا بين الخطأ والصواب، ثم تعقد «وقفات مع الألوسي في بعض مسائل الاعتقاد»؛ وتذكر في ترجمته أنه قرأ على خالد النقشبندي مسألة الصفات وأخذ عنه الطريقة النقشبندية {cite:juhud-al-alusi-al-balaghiyya-thesis p.52} {cite:juhud-al-alusi-al-balaghiyya-thesis p.54} {cite:juhud-al-alusi-al-balaghiyya-thesis p.55} {cite:juhud-al-alusi-al-balaghiyya-thesis p.56} {cite:juhud-al-alusi-al-balaghiyya-thesis p.30}."
      en: "The thesis Juhud al-Alusi al-Balaghiyya has a section titled 'al-Alusi was Salafi in creed on the whole', prefaced by a warning against hasty judgements on scholars' beliefs and a call to read their words in the best light, with quotations from Ibn Taymiyya, al-Dhahabi and Ibn al-Qayyim on dealing with scholars who combined error and right; it then has 'pauses with al-Alusi on some questions of creed'; its biography records that he studied the question of the attributes with Khalid al-Naqshbandi and took the Naqshbandi path from him {cite:juhud-al-alusi-al-balaghiyya-thesis p.52} {cite:juhud-al-alusi-al-balaghiyya-thesis p.54} {cite:juhud-al-alusi-al-balaghiyya-thesis p.55} {cite:juhud-al-alusi-al-balaghiyya-thesis p.56} {cite:juhud-al-alusi-al-balaghiyya-thesis p.30}."
      ur: "مقالہ «جہود الآلوسی البلاغیہ» میں «آلوسی مجموعی طور پر سلفی العقیدہ» کے عنوان سے ایک مسئلہ ہے، جس سے پہلے علما کے عقائد پر جلد بازی سے حکم لگانے سے تنبیہ اور ان کے کلام کو بہترین محمل پر رکھنے کی تاکید ہے، اور خطا و صواب کو جمع کرنے والے علما سے معاملے پر ابن تیمیہ، ذہبی اور ابن القیم کے اقوال ہیں؛ پھر «بعض مسائلِ اعتقاد میں آلوسی کے ساتھ توقفات» ہیں؛ اور اس کے سوانح میں ہے کہ انہوں نے خالد نقشبندی سے مسئلۂ صفات پڑھا اور طریقۂ نقشبندیہ لیا {cite:juhud-al-alusi-al-balaghiyya-thesis p.52} {cite:juhud-al-alusi-al-balaghiyya-thesis p.54} {cite:juhud-al-alusi-al-balaghiyya-thesis p.55} {cite:juhud-al-alusi-al-balaghiyya-thesis p.56} {cite:juhud-al-alusi-al-balaghiyya-thesis p.30}۔"
