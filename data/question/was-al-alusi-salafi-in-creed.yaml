id: question/was-al-alusi-salafi-in-creed
class: question
label:
  ar: "هل كان الألوسي سلفي العقيدة؟"
  en: "Was al-Alusi Salafi in creed?"
  ur: "کیا آلوسی عقیدے میں سلفی تھے؟"
summary:
  ar: "يصفه الزركلي بأنه «سلفي الاعتقاد مجتهد»، وتقرر رسالة دكتوراه حديثة أنه سلفي العقيدة في الجملة مع وقفات معه في بعض مسائل الاعتقاد، وتنقل قوله إن الأسلم ترك التأويل إلا ما أوّله السلف؛ وفي سيرته أنه أخذ الطريقة النقشبندية عن خالد النقشبندي وقرأ عليه مسألة الصفات."
  en: "Al-Zirikli calls him 'Salafi in belief, a mujtahid'; a recent doctoral thesis concludes that he was Salafi in creed on the whole while pausing over him on some points, quoting his words that the safest course is to leave figurative reinterpretation except where the early generations reinterpreted; his biography also records that he took the Naqshbandi path from Khalid al-Naqshbandi and studied the question of the attributes with him."
  ur: "زرکلی انہیں «عقیدے میں سلفی، مجتہد» کہتے ہیں؛ ایک حالیہ پی ایچ ڈی مقالہ اس نتیجے پر پہنچتا ہے کہ وہ مجموعی طور پر سلفی العقیدہ تھے، اگرچہ بعض مسائلِ اعتقاد میں ان پر توقف کرتا ہے، اور ان کا یہ قول نقل کرتا ہے کہ سب سے محفوظ راستہ تاویل ترک کرنا ہے سوائے اس کے جس کی سلف نے تاویل کی؛ ان کی سیرت میں یہ بھی ہے کہ انہوں نے خالد نقشبندی سے طریقۂ نقشبندیہ لیا اور ان سے مسئلۂ صفات پڑھا۔"
question:
  ar: "ما موقع الألوسي من مذاهب أهل السنة في الاعتقاد؟"
  en: "Where does al-Alusi stand among the Sunni schools of creed?"
  ur: "اعتقاد میں اہلِ سنت کے مسالک میں آلوسی کا مقام کیا ہے؟"
short_answer:
  ar: "يصفه الزركلي ورسالة الدكتوراه المذكورة بأنه سلفي العقيدة في الجملة، ويستدلان بكلامه في ترك التأويل واتباع الحديث الصحيح؛ وتذكر الرسالة نفسها صلته بالطريقة النقشبندية ووقفات معه في بعض المسائل."
  en: "Al-Zirikli and the doctoral thesis cited call him Salafi in creed on the whole, citing his words on leaving reinterpretation and following sound hadith; the same thesis records his link to the Naqshbandi path and pauses over him on some points."
  ur: "زرکلی اور مذکورہ پی ایچ ڈی مقالہ انہیں مجموعی طور پر سلفی العقیدہ کہتے ہیں اور تاویل ترک کرنے اور صحیح حدیث کی پیروی کے بارے میں ان کے اقوال سے استدلال کرتے ہیں؛ یہی مقالہ طریقۂ نقشبندیہ سے ان کے تعلق اور بعض مسائل میں ان پر توقف کا ذکر کرتا ہے۔"
