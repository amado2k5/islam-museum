    summary:
      ar: "تنقل الرسالة عن «روح المعاني» قوله: «وأنت تعلم أن الأسلم ترك التأويل؛ فإنه قول على الله تعالى من غير علم، ولا نؤول إلا ما أوّله السلف، ونتبعهم فيما كانوا عليه، فإن أوّلوا أوّلنا وإن فوّضوا فوّضنا»، وقوله: «إذا صح الحديث فهو مذهبي» {cite:juhud-al-alusi-al-balaghiyya-thesis p.56}."
      en: "The thesis quotes him in Ruh al-Ma'ani: 'You know that the safest is to leave reinterpretation, for it is speaking about God without knowledge; we reinterpret only what the early generations reinterpreted and follow them in what they held: if they reinterpreted, we reinterpret, and if they consigned the meaning to God, we consign', and: 'If the hadith is sound, it is my school' {cite:juhud-al-alusi-al-balaghiyya-thesis p.56}."
      ur: "مقالہ «روح المعانی» سے ان کا قول نقل کرتا ہے: «تم جانتے ہو کہ سب سے محفوظ تاویل ترک کرنا ہے، کیونکہ وہ اللہ کے بارے میں بغیر علم کے بات کہنا ہے؛ ہم صرف اسی کی تاویل کرتے ہیں جس کی سلف نے کی، اور ان کے طریقے پر چلتے ہیں: اگر انہوں نے تاویل کی تو ہم کریں گے، اور اگر تفویض کی تو ہم تفویض کریں گے»، اور: «جب حدیث صحیح ہو تو وہی میرا مذہب ہے» {cite:juhud-al-alusi-al-balaghiyya-thesis p.56}۔"
