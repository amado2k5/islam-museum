class: question
label:
  ar: لماذا لا يشرب المسلمون الخمر؟
  en: Why do Muslims not drink alcohol?
summary:
  ar: الخمر محرمة في الإسلام، وهذا الحكم أحد أشهر الأحكام التي يعرفها الناس عن الشريعة، وتفصيل أدلته وأحكامه في مدخل الخمر.
  en: "Wine (khamr) is forbidden in Islam. This ruling is one of the best-known rulings people know of the Sharia, and its evidence and detailed rulings are set out in the entry on khamr."
wings: []
question:
  ar: لماذا لا يشرب المسلمون الخمر؟
short_answer:
  ar: الخمر محرمة في الإسلام، وهذا الحكم أحد أشهر الأحكام التي يعرفها الناس عن الشريعة، وتفصيل أدلته وأحكامه في مدخل الخمر.
long_answer:
  ar: |
    يحرّم الإسلام الخمر والمسكرات، وهو من أشهر الأحكام التي يسأل عنها الناس. وتفصيل الحكم وأدلته ومعانيه في مدخل [[concept/khamr|الخمر]].
    والمدخل يعرض ما ورد عن الخمر في النصوص والتراث، ويذكر أن الفقهاء عدّوا المسكرات كلها في معنى الخمر في الحكم، كما يعرض [[concept/muskir|المسكر]] بوصفه وصفاً للحكم.
    ويجمع هذا السؤال بين الفقه والحياة اليومية، فيرتبط بالحلال والحرام في الطعام والشراب، وهو ما يعرضه [[concept/halal-haram|الحلال والحرام]].
