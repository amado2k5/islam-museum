question:
  ar: ما الغزو المغولي؟
short_answer:
  ar: الغزو المغولي حملات جنكيز خان وأحفاده على العالم الإسلامي 1219–1260؛ دمرت بغداد 1258 وأوقفها المسلمون
    في عين جالوت 1260.
long_answer:
  ar: الغزو المغولي أعظم كارثة في التاريخ الإسلامي؛ أسقط هولاكو بغداد وأنهى الخلافة العباسية 1258. ردّ
    المسلمون الغزو في عين جالوت 1260 على يد المماليك، واعتنق أحفاد خانوات المغول الإسلام لاحقًا فتبدل
    وجه المنطقة. {cite:wikidata}
