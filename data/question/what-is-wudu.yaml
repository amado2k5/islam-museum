id: question/what-is-wudu
class: question
label:
  ar: "ما الوضوء؟"
  en: What is wudu?
  es: "¿Qué es el wudu?"
  fr: "Qu'est-ce que le wudu ?"
  ur: "وضو کیا ہے؟"
  tr: "Abdest alma nedir?"
  id: "Apa itu wudhu?"
summary:
  ar: "الوضوء طهارة مائية صغرى فرضها القرآن قبل الصلاة: غسل الوجه واليدين إلى المرفقين ومسح الرأس وغسل الرجلين."
  en: "Wudu is the minor water purification that the Qur'an made obligatory before prayer: washing the face and the hands up to the elbows, wiping the head, and washing the feet."
  es: "El wudu es la purificación menor con agua que el Corán hizo obligatoria antes de la oración: lavarse la cara y las manos hasta los codos, pasarse las manos por la cabeza y lavarse los pies."
  fr: "Les ablutions (wudu) sont les petites purifications par l'eau que le Coran a rendues obligatoires avant la prière: se laver le visage et les mains jusqu'aux coudes, s'essuyer la tête et se laver les pieds."
  ur: "وضو وہ معمولی پانی کا طہارت ہے جسے قرآن نے نماز سے پہلے فرض کیا ہے: چہرے اور ہاتھوں کو کہنیوں تک دھونا، سر کا مسح کرنا اور پاؤں کا دھونا۔"
  tr: "Destme, Kur'an'da namaz öncesi önerilen küçük bir su arındırmadır: yüz ve ellerin dirseklere kadar yıkanması, başın silinmesi ve ayakların yıkanması."
  id: "Wudhu adalah pemurnian air kecil yang ditetapkan oleh Al-Qur'an sebelum shalat: mencuci wajah dan tangan hingga siku, mengelap kepala, dan mencuci kaki."
