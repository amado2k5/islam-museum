label:
  ar: "ما الوضوء؟"
  en: What is wudu?
summary:
  ar: "الوضوء طهارة مائية صغرى فرضها القرآن قبل الصلاة: غسل الوجه واليدين إلى المرفقين ومسح الرأس وغسل الرجلين."
  en: "Wudu is the minor water purification that the Qur'an made obligatory before prayer: washing the face and the hands up to the elbows, wiping the head, and washing the feet."
