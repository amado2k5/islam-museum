id: question/why-did-al-zuhri-write-down-hadith
class: question
label: { ar: "لماذا كتب الزهري الحديث؟", en: "Why did al-Zuhri write hadith down?", ur: "زہری نے حدیث کیوں لکھی؟" }
question: { ar: "ما معنى قول الزهري «كنا نكره كتاب العلم حتى أكرهنا عليه هؤلاء الأمراء»، وماذا يدل عليه في تدوين الحديث وصلته بالأمويين؟", en: "What does al-Zuhri's saying 'we used to dislike writing down knowledge until these rulers compelled us to it' mean, and what does it show about the recording of hadith and his ties with the Umayyads?", ur: "زہری کے قول «ہم علم لکھنے کو ناپسند کرتے تھے یہاں تک کہ ان امرا نے ہمیں اس پر مجبور کیا» کا کیا مطلب ہے، اور یہ تدوینِ حدیث اور امویوں سے ان کے تعلق کے بارے میں کیا بتاتا ہے؟" }
issue: { ar: "رواية ابن سعد لقول الزهري في كتابة العلم، وقراءة محقق القسم المتمم لها، ونقده لقراءة المستشرق جولدتسيهر كما يصفها.", en: "Ibn Sa'd's report of al-Zuhri's saying on writing knowledge down, the reading of it by the editor of the completing section, and his criticism of the orientalist Goldziher's reading as he describes it." }
summary:
  ar: "يروي ابن سعد عن معمر عن الزهري قوله: «كنا نكره كتاب العلم حتى أكرهنا عليه هؤلاء الأمراء، فرأينا أن لا نمنعه أحداً من المسلمين»، ويروي عن صالح بن كيسان أنه والزهري كتبا السنن، ثم كتب الزهري ما جاء عن الصحابة ولم يكتب صالح «فأنجح وضيّعت»؛ ويقرأ المحقق القول على أن الزهري كان يكره الكتابة لئلا يتّكل الناس على الكتب، ثم كتب بعد إلحاح هشام بن عبد الملك ليملي على ولده، وينتقد جولدتسيهر لأنه نقل القول مبتوراً ليوحي بأن الزهري كان يخدم رغبات الحكام {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987 p. 162} {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987 p. 168-169}."
  en: "Ibn Sa'd relates from Ma'mar that al-Zuhri said: 'We used to dislike writing down knowledge until these rulers compelled us to it; then we decided not to withhold it from any Muslim.' He also relates from Salih ibn Kaysan that he and al-Zuhri wrote down the sunan; al-Zuhri then wrote down what came from the Companions too and Salih did not — 'he succeeded and I lost'. The editor reads the saying to mean that al-Zuhri disliked writing lest people rely on books, and began writing when Hisham ibn 'Abd al-Malik pressed him to dictate for his sons. He criticises Goldziher for quoting the saying cut short, to suggest that al-Zuhri served the rulers' wishes {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987 p. 162} {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987 p. 168-169}."
  ur: "ابن سعد معمر کے واسطے سے زہری کا قول روایت کرتے ہیں: «ہم علم لکھنے کو ناپسند کرتے تھے یہاں تک کہ ان امرا نے ہمیں اس پر مجبور کیا، تو ہم نے طے کیا کہ کسی مسلمان سے اسے نہ روکیں»۔ اور صالح بن کیسان سے روایت کرتے ہیں کہ انہوں نے اور زہری نے سنن لکھیں، پھر زہری نے صحابہ سے منقول باتیں بھی لکھیں اور صالح نے نہیں — «وہ کامیاب ہوئے اور میں نے ضائع کیا»۔ محقق اس قول کو یوں پڑھتے ہیں کہ زہری لکھنا اس لیے ناپسند کرتے تھے کہ لوگ کتابوں پر انحصار نہ کریں، پھر ہشام بن عبد الملک کے اصرار پر ان کے بیٹوں کو املا کرانے کے لیے لکھنا شروع کیا۔ وہ گولڈزیہر پر تنقید کرتے ہیں کہ انہوں نے قول کو کاٹ کر نقل کیا تاکہ یہ تاثر دیں کہ زہری حکام کی خواہشات پوری کرتے تھے {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987 p. 162} {cite:tabaqat-ibn-sad-qism-mutammim-mansur-1987 p. 168-169}۔"
short_answer:
  ar: "عند المحقق وفي قراءة أهل السنة التي يعرضها: كره الزهري الكتابة لئلا يُتّكل على الكتب، ثم كتب بطلب هشام ثم بذل ما كتبه لكل المسلمين؛ وعند جولدتسيهر كما يصفه المحقق: القول دليل على أن الأمراء استعملوا الزهري في كتابة أحاديث توافق رغباتهم."
  en: "For the editor, in the Sunni reading he presents: al-Zuhri disliked writing lest people rely on books, wrote at Hisham's request, and then made what he had written available to every Muslim. For Goldziher, as the editor describes him: the saying shows that the rulers used al-Zuhri to write down reports that suited their wishes."
  ur: "محقق کے نزدیک، اس سنی قراءت میں جو وہ پیش کرتے ہیں: زہری کتابت کو اس لیے ناپسند کرتے تھے کہ کتابوں پر انحصار نہ ہو، ہشام کی درخواست پر لکھا، اور پھر لکھا ہوا ہر مسلمان کے لیے عام کر دیا۔ گولڈزیہر کے نزدیک، جیسا کہ محقق بیان کرتے ہیں: یہ قول دکھاتا ہے کہ امرا نے زہری سے اپنی خواہش کے مطابق احادیث لکھوائیں۔"
perspectives:
  - tradition: sunni
    id: reluctance-then-public
    standing: main
    stance: { ar: "كره الكتابة خشية الاتكال على الكتب، ثم كتب وأتاح العلم للجميع", en: "He disliked writing lest people rely on books, then wrote and made the knowledge available to all" }
    summary: { ar: "يرى المحقق أن الزهري كان لا يرغب في كتابة الأحاديث لكي لا يتكل الناس على الكتب ويبقى اعتمادهم على ذاكرتهم، ثم شرع في الكتابة بعد إلحاح هشام بن عبد الملك ليملي على ولده، ثم خرج إلى الناس بقوله المشهور، وتمامه «فرأينا أن لا نمنعه أحداً من المسلمين». ويروي ابن سعد أن هشاماً صيّره مع ولده يعلمهم ويفقههم ويحدثهم، وأن يزيد بن عبد الملك ولّاه القضاء.", en: "The editor holds that al-Zuhri did not want hadith written lest people rely on books rather than memory, began writing when Hisham ibn 'Abd al-Malik pressed him to dictate for his sons, and then went out to people with his well-known saying, whose full form ends 'then we decided not to withhold it from any Muslim'. Ibn Sa'd relates that Hisham placed him with his sons to teach them law and hadith, and that Yazid ibn 'Abd al-Malik made him a judge." }
