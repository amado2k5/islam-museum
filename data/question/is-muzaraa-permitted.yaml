  stance:
    ar: المزارعة إجارة بعوض مجهول فلا تجوز
    en: Sharecropping is hire for an unknown wage and is not allowed
    ur: مزارعت نامعلوم اجرت پر اجارہ ہے، لہٰذا ناجائز
  summary:
    ar: يحكي ابن تيمية أن طائفة من العلماء ظنت هذه المشاركة من باب الإجارات بعوض مجهول فقالوا القياس يقتضي تحريمها؛ فمنهم من حرّم المساقاة والمزارعة وأباح المضاربة للحاجة، كما يقول أبو حنيفة. ولم تُذكر هنا أدلة هذا القول من كتب الحنفية.
    en: Ibn Taymiyya reports that some scholars took this partnership for hire with an unknown wage and said analogy requires forbidding it; some of them forbade orchard-share and sharecropping while allowing silent partnership (mudaraba) out of need, as Abu Hanifa says. The arguments for this view from Hanafi books are not given here.
    ur: ابن تیمیہ نقل کرتے ہیں کہ بعض علما نے اس شراکت کو نامعلوم اجرت پر اجارہ سمجھا اور کہا کہ قیاس اس کی حرمت کا تقاضا کرتا ہے؛ ان میں سے بعض نے مساقات اور مزارعت کو حرام اور ضرورت کی وجہ سے مضاربت کو جائز کہا، جیسا کہ ابو حنیفہ کہتے ہیں۔ اس قول کے دلائل حنفی کتب سے یہاں نہیں دیے گئے۔
