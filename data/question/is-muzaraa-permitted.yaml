id: question/is-muzaraa-permitted
class: question
label:
  ar: هل تجوز المزارعة؟
  en: Is sharecropping (muzara'a) permitted?
  ur: کیا مزارعت جائز ہے؟
summary:
  ar: 'مسألة يستطرد إليها ابن تيمية في «الحسبة في الإسلام»: يرى أن المزارعة جائزة في أصح قولي العلماء، وأنها عمل المسلمين على عهد النبي وخلفائه، ومذهب فقهاء الحديث وجماعة من فقهاء الأمصار؛ ويحكي أن طائفة ظنتها من باب الإجارة بعوض مجهول فحرّمتها قياساً، منهم أبو حنيفة، ومنهم من أباح المساقاة وأباح المزارعة تبعاً لها كمالك والشافعي {cite:hisba-ibn-taymiyya-ilmiyya p. 26} {cite:hisba-ibn-taymiyya-ilmiyya p. 27}.'
  en: 'A question Ibn Taymiyya digresses to in al-Hisba fi al-Islam: he holds sharecropping lawful in the sounder of the scholars'' two views, the practice of Muslims under the Prophet and his successors, and the view of the hadith jurists and a number of jurists of the great cities; he reports that some took it for hire with an unknown wage and forbade it by analogy, among them Abu Hanifa, while others allowed orchard-share (musaqat) and allowed sharecropping as a dependent of it, like Malik and al-Shafi''i.'
  ur: 'ایک مسئلہ جس کی طرف ابن تیمیہ «الحسبۃ فی الاسلام» میں استطراد کرتے ہیں: ان کے نزدیک مزارعت علما کے دو قولوں میں زیادہ صحیح کے مطابق جائز ہے، نبی اور ان کے خلفا کے دور میں مسلمانوں کا عمل، اور فقہائے حدیث اور فقہائے امصار کی ایک جماعت کا مذہب؛ وہ نقل کرتے ہیں کہ ایک گروہ نے اسے نامعلوم اجرت پر اجارہ سمجھ کر قیاساً حرام کہا، جن میں ابو حنیفہ ہیں، اور بعض نے مساقات کو جائز کہا اور مزارعت کو اس کے تابع جائز رکھا، جیسے مالک اور شافعی۔'
