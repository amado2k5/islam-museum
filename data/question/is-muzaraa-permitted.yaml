  standing: main
  stance:
    ar: المزارعة جائزة، وهي من باب المشاركة
    en: Sharecropping is lawful, being a form of partnership
    ur: مزارعت جائز ہے، کیونکہ یہ شراکت ہے
  summary:
    ar: يرى ابن تيمية أنها عمل المسلمين على عهد النبي وخلفائه، وعليها آل أبي بكر وآل عثمان وآل علي، وقول ابن مسعود، ومذهب أحمد وإسحاق وداود والبخاري وابن خزيمة وابن المنذر والليث وابن أبي ليلى وأبي يوسف ومحمد بن الحسن؛ ويستدل بمعاملة النبي أهل خيبر بشطر ما يخرج منها، ويحمل النهي عن المخابرة على اشتراط زرع بقعة معينة لرب الأرض، ويرى أن جمهور السلف عدّوها مشاركة لا إجارة، فإذا فسدت وجب نصيب المثل لا أجرة المثل.
    en: Ibn Taymiyya holds it was the practice of Muslims under the Prophet and his successors, of the households of Abu Bakr, Uthman and Ali, the view of Ibn Mas'ud, and the school of Ahmad, Ishaq, Dawud, al-Bukhari, Ibn Khuzayma, Ibn al-Mundhir, al-Layth, Ibn Abi Layla, Abu Yusuf and Muhammad ibn al-Hasan; he cites the Prophet's arrangement with the people of Khaybar for part of the produce, reads the prohibition of mukhabara as concerning a condition reserving a particular plot for the landowner, and says most early scholars treated it as partnership, not hire, so that if it is invalid a fair share, not a fair wage, is due.
    ur: ابن تیمیہ کے نزدیک یہ نبی اور ان کے خلفا کے دور میں مسلمانوں کا عمل تھا، ابو بکر، عثمان اور علی کے گھرانوں کا عمل، ابن مسعود کا قول، اور احمد، اسحاق، داود، بخاری، ابن خزیمہ، ابن المنذر، لیث، ابن ابی لیلیٰ، ابو یوسف اور محمد بن الحسن کا مذہب؛ وہ اہلِ خیبر سے پیداوار کے حصے پر نبی کے معاملے سے استدلال کرتے ہیں، مخابرہ کی ممانعت کو زمین کے مالک کے لیے کسی معین ٹکڑے کی شرط پر محمول کرتے ہیں، اور کہتے ہیں کہ اکثر سلف نے اسے اجارہ نہیں بلکہ شراکت سمجھا، لہٰذا فاسد ہو تو اجرتِ مثل نہیں بلکہ حصۂ مثل واجب ہے۔
