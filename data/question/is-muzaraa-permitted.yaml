question:
  ar: هل يجوز أن يدفع صاحب الأرض أرضه لمن يزرعها بجزء شائع مما يخرج منها؟
  en: May a landowner give his land to someone to farm for a common share of the produce?
  ur: کیا زمین کا مالک اپنی زمین کسی کو پیداوار کے ایک مشاع حصے پر کاشت کے لیے دے سکتا ہے؟
issue:
  ar: 'تكييف المزارعة: مشاركة أم إجارة بعوض مجهول.'
  en: 'How sharecropping is classed: a partnership, or hire for an unknown wage.'
  ur: 'مزارعت کی نوعیت: شراکت یا نامعلوم اجرت پر اجارہ۔'
short_answer:
  ar: يرى ابن تيمية جوازها، وينسبه إلى جمهور السلف وفقهاء الحديث؛ ويحكي منعها عن أبي حنيفة، وإجازتها تبعاً للمساقاة عن مالك والشافعي.
  en: Ibn Taymiyya holds it lawful, ascribing this to most of the early generations and the hadith jurists; he reports that Abu Hanifa forbade it and that Malik and al-Shafi'i allowed it as dependent on orchard-share.
  ur: ابن تیمیہ اسے جائز کہتے ہیں اور اسے اکثر سلف اور فقہائے حدیث کی طرف منسوب کرتے ہیں؛ اور ابو حنیفہ سے ممانعت، اور مالک و شافعی سے مساقات کے تابع ہونے کی صورت میں جواز نقل کرتے ہیں۔
