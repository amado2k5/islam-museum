  id: sunni-tabaan
  standing: secondary
  stance:
    ar: تجوز المساقاة، والمزارعة تبعاً لها
    en: Orchard-share is allowed, and sharecropping as a dependent of it
    ur: مساقات جائز ہے، اور مزارعت اس کے تابع
  summary:
    ar: 'يحكي ابن تيمية أن منهم من أباح المساقاة إما مطلقاً كقول مالك والقديم للشافعي، أو على النخل والعنب كالجديد للشافعي، لأن الشجر لا يمكن إجارتها، وأباحوا ما يُحتاج إليه من المزارعة تبعاً للمساقاة: كقول الشافعي إذا كانت الأرض أغلب، أو قدّروا ذلك بالثلث كقول مالك.'
    en: Ibn Taymiyya reports that some allowed orchard-share either generally, as Malik and al-Shafi'i's old view, or on palms and vines only, as al-Shafi'i's new view, since trees cannot be hired out, and allowed what sharecropping is needed as a dependent of it - as al-Shafi'i says where the land is the larger part, or limiting it to a third, as Malik says.
    ur: ابن تیمیہ نقل کرتے ہیں کہ بعض نے مساقات کو یا تو مطلقاً جائز کہا، جیسے مالک اور شافعی کا قدیم قول، یا صرف کھجور اور انگور پر، جیسے شافعی کا جدید قول، کیونکہ درختوں کا اجارہ ممکن نہیں؛ اور ضرورت بھر مزارعت کو اس کے تابع جائز رکھا — جیسے شافعی کا قول جب زمین زیادہ ہو، یا اسے تہائی سے محدود کیا، جیسے مالک کا قول۔
