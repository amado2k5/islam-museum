id: question/may-ramadan-be-fasted-on-a-journey
class: question
label: { ar: "هل يصح صوم رمضان في السفر؟", en: "Is the Ramadan fast valid on a journey?", ur: "کیا سفر میں رمضان کا روزہ درست ہے؟" }
question: { ar: "هل المسافر في رمضان مخيّر بين الصوم والفطر، أم يلزمه الصوم، أم يلزمه الفطر ولا يجزئه صومه؟", en: "Is the traveller in Ramadan free to fast or not, bound to fast, or bound to break the fast, so that his fasting does not count?", ur: "کیا رمضان میں مسافر کو روزہ رکھنے یا نہ رکھنے کا اختیار ہے، یا اس پر روزہ لازم ہے، یا روزہ چھوڑنا لازم ہے اور اس کا روزہ کافی نہیں؟" }
issue: { ar: "آية البقرة 185 في المريض والمسافر، وحديث جابر «أولئك العصاة»، وحديث «ليس من البر الصوم في السفر»، وحديث حمزة بن عمرو الأسلمي في التخيير، كما يعرضها ابن حزم.", en: "The verse al-Baqara 185 on the sick and the traveller, Jabir's report 'those are the disobedient', the hadith 'it is not piety to fast on a journey', and the report of Hamza ibn 'Amr al-Aslami giving the choice, as Ibn Hazm sets them out.", ur: "سورۂ بقرہ 185 کی آیت جو بیمار اور مسافر کے بارے میں ہے، جابر کی حدیث «یہی نافرمان ہیں»، حدیث «سفر میں روزہ رکھنا نیکی نہیں»، اور حمزہ بن عمرو اسلمی کی اختیار والی حدیث، جیسا کہ ابن حزم انہیں پیش کرتے ہیں۔" }
summary:
  ar: "يحكي ابن حزم في «المحلى» خمسة أقوال: يلزم من دخل عليه رمضان مقيماً أن يصومه وإن سافر، ويُخيَّر والصوم أفضل وهو قول أبي حنيفة ومالك والشافعي، ويُخيَّر والأمران سواء، ويُخيَّر والفطر أفضل، ولا يجزئه الصوم ولا بد له من الفطر؛ ويأخذ هو بالأخير، ويجعل الفطر فرضاً على كل مسافر جاوز ميلاً، ويرى صوم رمضان في السفر غير مجزئ {cite:muhalla-dar-ibn-hazm-2016-v6 p.302} {cite:muhalla-dar-ibn-hazm-2016-v6 p.310}."
  en: "Ibn Hazm reports five views in al-Muhalla: one whom Ramadan reaches at home must fast it even if he travels; he may choose, fasting being better, the view of Abu Hanifa, Malik and al-Shafi'i; he may choose, both being equal; he may choose, breaking being better; and his fast does not count and he must break it. He takes the last, making breaking the fast obligatory on every traveller who has gone a mile, and holds that a Ramadan fast kept on a journey does not count {cite:muhalla-dar-ibn-hazm-2016-v6 p.302} {cite:muhalla-dar-ibn-hazm-2016-v6 p.310}."
  ur: "ابن حزم «المحلی» میں پانچ اقوال نقل کرتے ہیں: جس پر رمضان گھر میں آ جائے وہ سفر کرے تب بھی روزہ رکھے؛ اسے اختیار ہے اور روزہ افضل ہے، یہ ابو حنیفہ، مالک اور شافعی کا قول ہے؛ اختیار ہے اور دونوں برابر ہیں؛ اختیار ہے اور افطار افضل ہے؛ اور اس کا روزہ کافی نہیں، افطار لازم ہے۔ وہ آخری قول اختیار کرتے ہیں، ایک میل سے آگے بڑھنے والے ہر مسافر پر افطار فرض قرار دیتے ہیں، اور سفر میں رکھے گئے رمضان کے روزے کو ناکافی سمجھتے ہیں {cite:muhalla-dar-ibn-hazm-2016-v6 p.302} {cite:muhalla-dar-ibn-hazm-2016-v6 p.310}۔"
short_answer:
  ar: "أبو حنيفة ومالك والشافعي (كما يحكيهم ابن حزم): يُخيَّر، والصوم أفضل؛ ابن حزم الظاهري: الفطر فرض ولا يجزئ صوم رمضان في السفر."
  en: "Abu Hanifa, Malik and al-Shafi'i (as Ibn Hazm reports them): he may choose, and fasting is better; Ibn Hazm the Zahiri: breaking the fast is obligatory and a Ramadan fast on a journey does not count."
  ur: "ابو حنیفہ، مالک اور شافعی (ابن حزم کی نقل کے مطابق): اختیار ہے اور روزہ افضل ہے؛ ابن حزم ظاہری: افطار فرض ہے اور سفر میں رمضان کا روزہ کافی نہیں۔"
perspectives:
  - tradition: sunni
    id: jumhur-choice-fasting-better
    standing: main
    stance: { ar: "يُخيَّر المسافر، والصوم أفضل", en: "The traveller may choose, and fasting is better", ur: "مسافر کو اختیار ہے، اور روزہ افضل ہے" }
    summary: { ar: "يحكي ابن حزم أن أبا حنيفة ومالكاً والشافعي أجازوا الصوم والفطر واختاروا الصوم، واحتجوا بآية البقرة 184 في أن الصوم خير، وبحديث سلمة بن المحبق «من كانت له حمولة يأوي إلى شبع فليصم رمضان حيث أدركه»، وبأخبار أبي سعيد وأبي الدرداء وجابر في صوم النبي في السفر، وبآثار عن عائشة وأبي موسى وأنس وعثمان بن أبي العاص وابن عباس وغيرهم؛ ويحكي أن مالكاً والشافعي لا يريان الفطر في سفر المعصية، وأن أبا حنيفة يسوي بين الأسفار.", en: "Ibn Hazm reports that Abu Hanifa, Malik and al-Shafi'i allowed fasting and breaking the fast and preferred fasting, arguing from al-Baqara 184, which says fasting is better, from Salama ibn al-Muhabbaq's report 'whoever has a mount that brings him to sufficiency, let him fast Ramadan wherever it reaches him', from the reports of Abu Sa'id, Abu al-Darda' and Jabir on the Prophet's fasting on journeys, and from reports from 'A'isha, Abu Musa, Anas, 'Uthman ibn Abi al-'As, Ibn 'Abbas and others; he adds that Malik and al-Shafi'i do not allow breaking the fast on a journey of disobedience, while Abu Hanifa treats all journeys alike.", ur: "ابن حزم نقل کرتے ہیں کہ ابو حنیفہ، مالک اور شافعی نے روزہ رکھنا اور چھوڑنا دونوں جائز رکھے اور روزہ کو ترجیح دی، اور سورۂ بقرہ 184 کی آیت کہ روزہ بہتر ہے، سلمہ بن محبق کی روایت «جس کے پاس سواری ہو جو اسے آسودگی تک پہنچا دے وہ جہاں رمضان پائے روزہ رکھے»، سفر میں نبی کے روزے کے بارے میں ابو سعید، ابو الدرداء اور جابر کی روایات، اور عائشہ، ابو موسیٰ، انس، عثمان بن ابی العاص، ابن عباس وغیرہ کے آثار سے استدلال کیا؛ وہ مزید بتاتے ہیں کہ مالک اور شافعی نافرمانی کے سفر میں افطار جائز نہیں سمجھتے، جبکہ ابو حنیفہ سب سفروں کو برابر رکھتے ہیں۔" }
