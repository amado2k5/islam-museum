    summary: { ar: "يرويه ابن حزم عن علي بن أبي طالب وعبيدة السلماني وابن عباس، احتجاجاً بآية البقرة 185 في من شهد الشهر، وعن عائشة أنها نهت عن السفر في رمضان، وعن خيثمة وأبي مجلز وإبراهيم النخعي وعروة بن الزبير نحو ذلك.", en: "Ibn Hazm relates it from 'Ali ibn Abi Talib, 'Abida al-Salmani and Ibn 'Abbas, arguing from al-Baqara 185 on whoever witnesses the month; from 'A'isha that she forbade travel in Ramadan; and similar views from Khaythama, Abu Mijlaz, Ibrahim al-Nakha'i and 'Urwa ibn al-Zubayr.", ur: "ابن حزم اسے علی بن ابی طالب، عبیدہ سلمانی اور ابن عباس سے، سورۂ بقرہ 185 کی بنا پر جو مہینہ پانے والے کے بارے میں ہے، روایت کرتے ہیں؛ عائشہ سے کہ انہوں نے رمضان میں سفر سے منع کیا؛ اور خیثمہ، ابو مجلز، ابراہیم نخعی اور عروہ بن زبیر سے اسی طرح کے اقوال۔" }
