  - tradition: sunni
    id: zahiri-ibn-hazm-must-break
    standing: secondary
    stance: { ar: "الظاهرية (ابن حزم): الفطر فرض على المسافر، ولا يجزئه صوم رمضان في السفر", en: "Zahiri (Ibn Hazm): breaking the fast is obligatory for the traveller, and a Ramadan fast on a journey does not count", ur: "ظاہری (ابن حزم): مسافر پر افطار فرض ہے، اور سفر میں رمضان کا روزہ کافی نہیں" }
    summary: { ar: "يرى ابن حزم أن من سافر في رمضان أي سفر كان ففرض عليه الفطر إذا جاوز ميلاً، ويقضي في أيام أخر، وله أن يصوم ذلك اليوم تطوعاً أو عن واجب آخر؛ ويحتج بأن الله لم يفرض على المسافر إلا عدة من أيام أخر، وبقول النبي في الذين صاموا عام الفتح «أولئك العصاة»، وبحديث «ليس من البر الصوم في السفر»، وبآثار عن عمر وعبد الرحمن بن عوف وعائشة وأبي هريرة وابن عباس وابن عمر وجماعة من التابعين.", en: "Ibn Hazm holds that whoever travels in Ramadan, on any journey, must break the fast once he has gone a mile and make it up on other days, though he may fast that day voluntarily or for another obligation; he argues that God imposed on the traveller only a number of other days, from the Prophet's words about those who fasted in the year of the Conquest, 'those are the disobedient', from the hadith 'it is not piety to fast on a journey', and from reports from 'Umar, 'Abd al-Rahman ibn 'Awf, 'A'isha, Abu Hurayra, Ibn 'Abbas, Ibn 'Umar and a number of Successors.", ur: "ابن حزم کے نزدیک جو رمضان میں کسی بھی سفر پر نکلے، ایک میل سے آگے بڑھتے ہی اس پر افطار فرض ہے اور وہ دوسرے دنوں میں قضا کرے، البتہ وہ اس دن نفل یا کسی دوسرے واجب کا روزہ رکھ سکتا ہے؛ وہ استدلال کرتے ہیں کہ اللہ نے مسافر پر صرف دوسرے دنوں کی گنتی فرض کی، فتح مکہ کے سال روزہ رکھنے والوں کے بارے میں نبی کے فرمان «یہی نافرمان ہیں» سے، حدیث «سفر میں روزہ رکھنا نیکی نہیں» سے، اور عمر، عبد الرحمن بن عوف، عائشہ، ابو ہریرہ، ابن عباس، ابن عمر اور تابعین کی ایک جماعت کے آثار سے۔" }
