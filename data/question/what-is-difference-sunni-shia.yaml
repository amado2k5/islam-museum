id: question/what-is-difference-sunni-shia
class: question
label:
  ar: ما الفرق بين السنة والشيعة؟
  en: What is the difference between Sunnis and Shia?
summary:
  ar: 'الاختلاف الأساسي بين السنة والشيعة في مسألة الإمامة بعد النبي: هل تُعلم بالنص أم بالاختيار والشورى، وفي من يُقدَّم. وتتفرع عنه اختلافات في الفقه والتاريخ والعقيدة.'
  en: "The basic difference between Sunnis and Shia concerns the imamate after the Prophet: whether it is known by explicit text or by choice and consultation, and who is to be put forward. Differences in jurisprudence, history and creed branch out from it."
wings: []
question:
  ar: ما الفرق بين السنة والشيعة؟
issue:
  ar: على من تقوم الإمامة بعد النبي، وكيف يُفهم أصل الشرعية في الأمة؟
short_answer:
  ar: 'الاختلاف الأساسي بين السنة والشيعة في مسألة الإمامة بعد النبي: هل تُعلم بالنص أم بالاختيار والشورى، وفي من يُقدَّم. وتتفرع عنه اختلافات في الفقه والتاريخ والعقيدة.'
long_answer:
  ar: 'الاختلاف بين السنة والشيعة في الأصل يتعلق بالإمامة، أي من يقود الأمة بعد النبي ومن أي طريق تثبت له الشرعية. وهذه المسألة تفصيلها في مدخل [[group/shia|الشيعة]] ومدخل [[concept/khilafa-rashida|الخلافة الراشدة]].


    ويعرض المدخل المنظورات الثلاثة كما يذكرها أصحابها: منظور أهل السنة، ومنظور الشيعة الاثني عشرية، ثم منظور المؤرخين. ويرتبط بالحدث الأشهر عند الشيعة في [[event/ghadir-khumm|غدير خم]]، وبالحدث الأشهر عند السنة في [[event/saqifa|السقيفة]].


    المنظورات مذكورة للتعريف بها لا للترجيح بينها، والتفاصيل الفقهية والكلامية تُعرض في مداخلها.

    '
