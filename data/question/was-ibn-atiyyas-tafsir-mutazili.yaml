id: question/was-ibn-atiyyas-tafsir-mutazili
class: question
label:
  ar: "هل في تفسير ابن عطية ميل إلى الاعتزال؟"
  en: "Does Ibn Atiyya's commentary lean towards the Mu'tazila?"
  ur: "کیا ابن عطیہ کی تفسیر میں اعتزال کی طرف میلان ہے؟"
summary:
  ar: "وُجّهت إلى «المحرر الوجيز» تهمة الاعتزال: فابن تيمية يراه أتبع للسنة من الكشاف لكنه يأخذ بأقوال من يسميهم المحققين من أهل الكلام، وابن عرفة المالكي، فيما نقله ابن حجر الهيتمي، يراه أخطر من الكشاف لأنه يدسّ الاعتزال؛ ويرد عبد الوهاب فايد التهمة ويثبت موافقته لأهل السنة."
  en: "Al-Muharrar al-Wajiz has been charged with Mu'tazili leanings: Ibn Taymiyya held it closer to the Sunna than al-Kashshaf but following those it calls 'the verifiers', theologians of the kalam schools; Ibn Arafa the Maliki, as quoted by Ibn Hajar al-Haytami, held it more dangerous than al-Kashshaf because it slips Mu'tazilism in; Abd al-Wahhab Fayid rejects the charge and argues that it follows the Sunni position."
  ur: "المحرر الوجیز پر اعتزال کا الزام لگایا گیا: ابن تیمیہ اسے الکشاف سے زیادہ سنت کے قریب مانتے ہیں مگر کہتے ہیں کہ یہ اہلِ کلام کے ان لوگوں کے اقوال لیتی ہے جنہیں یہ محققین کہتی ہے؛ ابن عرفہ مالکی، ابن حجر ہیتمی کی نقل کے مطابق، اسے الکشاف سے زیادہ خطرناک سمجھتے ہیں کیونکہ یہ اعتزال کو چپکے سے داخل کرتی ہے؛ عبد الوہاب فاید اس الزام کو رد کر کے اس کی اہلِ سنت سے موافقت ثابت کرتے ہیں۔"
question:
  ar: "هل في المحرر الوجيز لابن عطية ميل إلى الاعتزال؟"
  en: "Is there a Mu'tazili tendency in Ibn Atiyya's al-Muharrar al-Wajiz?"
  ur: "کیا ابن عطیہ کی المحرر الوجیز میں اعتزالی رجحان ہے؟"
short_answer:
  ar: "اختلف فيه أهل السنة: ابن تيمية يراه أتبع للسنة من الكشاف مع أخذه بطرق المتكلمين في بعض المواضع، وابن عرفة يتهمه بدسّ الاعتزال، ويرد عبد الوهاب فايد التهمة."
  en: "Sunni scholars differ: Ibn Taymiyya finds it closer to the Sunna than al-Kashshaf while following the theologians' methods in places, Ibn Arafa accuses it of slipping in Mu'tazilism, and Abd al-Wahhab Fayid rejects the charge."
  ur: "اہلِ سنت میں اختلاف ہے: ابن تیمیہ اسے الکشاف سے زیادہ سنت کے قریب مگر بعض مقامات پر متکلمین کے طریقوں کا پیرو سمجھتے ہیں، ابن عرفہ اس پر اعتزال داخل کرنے کا الزام لگاتے ہیں، اور عبد الوہاب فاید اس الزام کو رد کرتے ہیں۔"
