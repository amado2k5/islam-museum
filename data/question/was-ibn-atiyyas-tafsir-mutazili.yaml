  - tradition: sunni
    id: fayid-charge-rejected
    standing: secondary
    stance: { ar: "التهمة لا أساس لها، وهو على مذهب أهل السنة ويرد على المعتزلة", en: "The charge is baseless; he follows the Sunni position and refutes the Mu'tazila", ur: "الزام بے بنیاد ہے؛ وہ اہلِ سنت کے مسلک پر ہیں اور معتزلہ کا رد کرتے ہیں" }
    summary:
      ar: "ناقش عبد الوهاب فايد التهمة في «منهج ابن عطية في تفسير القرآن» وبيّن أنها لا تعتمد على أساس صحيح، وأن ابن عطية يتمشى مع مذهب أهل السنة ويرد على آراء المعتزلة، وانتهى إلى أنها «مرفوضة شكلًا وموضوعًا»؛ ويوافقه مجد مكي. ويصفه ابن جزي بأنه «محافظ على السنة» {cite:muharrar-wajiz-dar-ibn-hazm p.7} {cite:muharrar-wajiz-dar-ibn-hazm p.8}."
      en: "Abd al-Wahhab Fayid examined the charge in Manhaj Ibn Atiyya fi Tafsir al-Qur'an, showed that it has no sound basis, that Ibn Atiyya keeps to the Sunni position and refutes Mu'tazili views, and concluded that it is 'rejected in form and substance'; Majd Makki agrees. Ibn Juzayy describes him as 'mindful of the Sunna' {cite:muharrar-wajiz-dar-ibn-hazm p.7} {cite:muharrar-wajiz-dar-ibn-hazm p.8}."
      ur: "عبد الوہاب فاید نے «منہج ابن عطیہ فی تفسیر القرآن» میں اس الزام کا جائزہ لے کر دکھایا کہ اس کی کوئی صحیح بنیاد نہیں، ابن عطیہ اہلِ سنت کے مسلک پر چلتے اور معتزلہ کی آرا کا رد کرتے ہیں، اور نتیجہ نکالا کہ یہ «شکلاً اور موضوعاً مسترد» ہے؛ مجد مکی ان سے متفق ہیں۔ ابن جزی انہیں «سنت کا پاسدار» کہتے ہیں {cite:muharrar-wajiz-dar-ibn-hazm p.7} {cite:muharrar-wajiz-dar-ibn-hazm p.8}۔"
