perspectives:
  - tradition: sunni-hanbali
    id: ibn-taymiyya-better-than-kashshaf-but
    standing: main
    stance: { ar: "أتبع للسنة من الكشاف، لكنه يترك أقوال السلف أحيانًا ويأخذ بأقوال المتكلمين", en: "Closer to the Sunna than al-Kashshaf, but at times leaves the early generations for the theologians", ur: "الکشاف سے زیادہ سنت کے قریب، مگر کبھی سلف کو چھوڑ کر متکلمین کو لیتی ہے" }
    summary:
      ar: "قال ابن تيمية في مقدمة أصول التفسير إن تفسير ابن عطية وأمثاله أتبع للسنة والجماعة وأسلم من البدعة من الكشاف، لكنه يدع ما نقله ابن جرير عن السلف ويذكر ما يزعم أنه قول المحققين، ويعني بهم طائفة من أهل الكلام قرروا أصولهم بطرق من جنس طرق المعتزلة وإن كانوا أقرب إلى السنة؛ وقال في الفتاوى إنه خير من الكشاف بكثير وأبعد عن البدع وإن اشتمل على بعضها، «بل لعله أرجح هذه التفاسير» {cite:muharrar-wajiz-dar-ibn-hazm p.7} {cite:muharrar-wajiz-dar-ibn-hazm p.12}."
      en: "Ibn Taymiyya said in his introduction to the principles of tafsir that the commentary of Ibn Atiyya and its like is more faithful to the Sunna and the community and safer from innovation than al-Kashshaf, but that it leaves aside what Ibn Jarir transmitted from the early generations and gives what it claims is the view of 'the verifiers', meaning a group of theologians who established their principles by methods of the same kind as the Mu'tazila, though nearer to the Sunna; in his Fatawa he called it far better than al-Kashshaf and further from innovation, though containing some, 'indeed perhaps the most preferable of these commentaries' {cite:muharrar-wajiz-dar-ibn-hazm p.7} {cite:muharrar-wajiz-dar-ibn-hazm p.12}."
      ur: "ابن تیمیہ نے اصولِ تفسیر کے مقدمے میں کہا کہ ابن عطیہ اور اس جیسی تفسیریں الکشاف سے زیادہ سنت و جماعت کی پیرو اور بدعت سے محفوظ ہیں، مگر یہ ابن جریر کے سلف سے منقول اقوال چھوڑ دیتی ہیں اور اسے ذکر کرتی ہیں جسے وہ محققین کا قول کہتی ہیں، یعنی اہلِ کلام کا ایک گروہ جس نے اپنے اصول معتزلہ کے طرز کے طریقوں سے قائم کیے اگرچہ وہ سنت کے زیادہ قریب ہیں؛ اور فتاویٰ میں کہا کہ یہ الکشاف سے بہت بہتر اور بدعات سے زیادہ دور ہے اگرچہ کچھ پر مشتمل ہے، «بلکہ شاید ان تفسیروں میں سب سے راجح» {cite:muharrar-wajiz-dar-ibn-hazm p.7} {cite:muharrar-wajiz-dar-ibn-hazm p.12}۔"
