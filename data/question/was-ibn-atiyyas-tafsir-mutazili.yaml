    stance: { ar: "أخطر من الكشاف لأنه يدس الاعتزال وصاحبه معروف بالسنة", en: "More dangerous than al-Kashshaf, slipping Mu'tazilism in under a Sunni name", ur: "الکشاف سے زیادہ خطرناک، سنی نام کے تحت اعتزال داخل کرتی ہے" }
    summary:
      ar: "نقل ابن حجر الهيتمي في «الفتاوى الحديثية» عن ابن عرفة المالكي أن تفسير ابن عطية أخطر من الكشاف، لأن اعتزال الزمخشري مشهور فالناس على حذر منه، أما ابن عطية فعُرف أنه سني لكنه يدسّ الاعتزال في تفسيره {cite:muharrar-wajiz-dar-ibn-hazm p.7}."
      en: "Ibn Hajar al-Haytami quotes Ibn Arafa the Maliki in al-Fatawa al-Hadithiyya: Ibn Atiyya's commentary is more dangerous than al-Kashshaf, because al-Zamakhshari's Mu'tazilism is well known and readers are on guard, whereas Ibn Atiyya was known as a Sunni but slips Mu'tazilism into his commentary {cite:muharrar-wajiz-dar-ibn-hazm p.7}."
      ur: "ابن حجر ہیتمی «الفتاوی الحدیثیہ» میں ابن عرفہ مالکی سے نقل کرتے ہیں کہ ابن عطیہ کی تفسیر الکشاف سے زیادہ خطرناک ہے، کیونکہ زمخشری کا اعتزال مشہور ہے اس لیے لوگ محتاط رہتے ہیں، جبکہ ابن عطیہ سنی کے طور پر معروف تھے مگر اپنی تفسیر میں اعتزال داخل کرتے ہیں {cite:muharrar-wajiz-dar-ibn-hazm p.7}۔"
