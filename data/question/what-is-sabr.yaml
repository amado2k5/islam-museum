id: question/what-is-sabr
class: question
label:
  ar: ما الصبر؟
  en: What is sabr?
  es: "¿Qué es el sable?"
  fr: "Qu'est-ce que le sabr ?"
  ur: "صابر کیا ہے؟"
  tr: "Sabır nedir?"
  id: "Apa itu kesabaran?"
summary:
  ar: الصبر هو حبس النفس عن الجزع واللسان عن الشكوى؛ نصف الإيمان عند الجمهور وثمرته الأجر بغير حساب.
  en: Sabr is restraining the self from distress and the tongue from complaint; according to the majority it is half of faith, and its fruit is reward without reckoning.
  es: "Sabr consiste en refrenar el egoísmo y la lengua la queja; según la mayoría, es la mitad de la fe, y su fruto es una recompensa sin medida."
  fr: "La sabr consiste à se retenir de souffrir et à ne pas se plaindre; selon la majorité, c'est la moitié de la foi, et son fruit est une récompense imméritée."
  ur: "صبر نفس کو تکلیف سے اور زبان کو شکایت سے روکتا ہے۔ جمہور کے نزدیک یہ نصف ایمان ہے اور اس کا پھل بے حساب اجر ہے۔"
  tr: "Sabır, ruhu panikten, dili şikayetten alıkoymaktır; çoğunluğa göre inancın yarısı ve meyvesi ölçüsüz ödüldür."
  id: "Kesabaran adalah menahan jiwa dari panik dan lidah dari keluhan; setengah dari iman menurut mayoritas dan hasilnya adalah ganjaran tanpa batas."
question:
  ar: ما الصبر؟
short_answer:
  ar: الصبر هو حبس النفس عن الجزع واللسان عن الشكوى؛ نصف الإيمان عند الجمهور وثمرته الأجر بغير حساب.
long_answer:
  ar: 'الصبر في القرآن ثلاثة أوجه عند ابن القيم: صبر على الطاعة وصبر عن المعصية وصبر على القضاء. ورد في
    جزائه «إنما يوفى الصابرون أجرهم بغير حساب» وعدّته السنة نصف الإيمان والمفتاح إلى الجنة. {cite:wikidata}'
