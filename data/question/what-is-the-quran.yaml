id: question/what-is-the-quran
class: question
label:
  ar: ما القرآن؟
  en: What is the Quran?
  es: "¿Qué es el Corán?"
  fr: "Qu'est-ce que le Coran ?"
  ur: "قرآن کیا ہے؟"
  tr: "Kur'an nedir?"
  id: "Apa itu Al-Quran?"
summary:
  ar: القرآن الكريم كلام الله المنزل على النبي محمد، والمسلمون يقرؤونه في الصلاة وفي غيرها، وهو المرجع الأول في العقيدة والأحكام.
  en: The Noble Quran is the speech of God revealed to the Prophet Muhammad. Muslims recite it in prayer and outside it, and it is the primary reference for belief and rulings.
  es: "El Sagrado Corán es la palabra de Dios revelada al profeta Mahoma. Los musulmanes lo recitan en la oración y fuera de ella, y es la principal referencia para la fe y las normas."
  fr: "Le Noble Coran est la parole de Dieu révélée au Prophète Muhammad. Les musulmans le récitent pendant la prière et en dehors, et il constitue la référence principale en matière de croyance et de règles."
  ur: "نوبل قرآن خدا کا کلام ہے جو حضرت محمد پر نازل ہوا۔ مسلمان اسے نماز میں اور اس کے باہر پڑھتے ہیں، اور یہ عقیدہ اور احکام کا بنیادی حوالہ ہے۔"
  tr: "Kutsal Kur'an, Allah'ın Peygamber Muhammed'e inhyettiği bir sözdür ve Müslümanlar bunu namazda ve başka yerlerde okarlar. İnanç ve hükümlerde birincil referans kaynağıdır."
  id: "Al-Qur'an adalah firman Allah yang diwahyukan kepada Nabi Muhammad, dan umat Muslim membacanya dalam doa dan di tempat lain. Al-Qur'an adalah referensi utama dalam kredo dan keputusan."
