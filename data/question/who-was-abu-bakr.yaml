id: question/who-was-abu-bakr
class: question
label:
  ar: من كان أبو بكر الصديق؟
  en: Who was Abu Bakr al-Siddiq?
  es: "¿Quién fue Abu Bakr al-Siddiq?"
  fr: "Qui était Abou Bakr al-Siddiq ?"
  ur: "ابو بکر صدیق کون تھے؟"
  tr: "Abu Bakr al-Siddiq kimdi?"
  id: "Siapakah Abu Bakr al-Siddiq?"
summary:
  ar: أبو بكر الصديق أول الخلفاء؛ من أوائل الرجال إسلامًا وصاحب الهجرة، وحكم سنتين فوحّد المرتدين ونقل
    الفتوح للعراق والشام.
  en: "Abu Bakr al-Siddiq was the first caliph. He was one of the first men to embrace Islam and the companion on the Hijra. He ruled for two years, united the Muslims against the apostates, and extended the conquests to Iraq and Syria."
  es: "Abu Bakr al-Siddiq fue el primer califa. Fue uno de los primeros en abrazar el islam y compañero de los musulmanes en la Hégira. Gobernó durante dos años, unió a los musulmanes contra los apóstatas y extendió las conquistas a Irak y Siria."
  fr: "Abou Bakr al-Siddiq fut le premier calife. Il fut l'un des premiers à se convertir à l'islam et un compagnon de l'Hégire. Il régna pendant deux ans, unifia les musulmans contre les apostats et étendit les conquêtes jusqu'en Irak et en Syrie."
  ur: "حضرت ابوبکر صدیقؓ پہلے خلیفہ تھے۔ وہ اسلام قبول کرنے والے پہلے مردوں میں سے تھے اور ہجرت پر صحابی تھے۔ اس نے دو سال حکومت کی، مسلمانوں کو مرتدین کے خلاف متحد کیا، اور عراق اور شام تک فتوحات کا سلسلہ بڑھایا۔"
  tr: "Ebu Bekir el-Siddiq, İslam'a en erken gelenlerden biri ve göçün başlatıcılarından biri olan ilk halifeydi. İki yıl hüküm sürdü, dinden dönenleri birleştirdi ve fetihleri Irak ve Levant'a aktardı."
  id: "Abu Bakr al-Siddiq adalah khalifah pertama; salah satu orang paling awal dalam Islam dan inisiator migrasi. Ia memerintah selama dua tahun, menyatukan para murtad, dan memindahkan penaklukan ke Irak dan Levant."
