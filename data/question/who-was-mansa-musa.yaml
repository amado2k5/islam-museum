long_answer:
  ar: '[[person/mansa-musa|مانسا موسى]] سلطان إمبراطورية مالي في أوجها؛ حجّته المشهورة 1324–1325 وزّعت
    ذهبًا غيّر أسعار القاهرة سنين، وأوقف على تمبكتو مساجدها ومدارسها فصارت عاصمة العلم في الساحل؛ من رموز
    الإسلام الأفريقي. {cite:wikidata}'
