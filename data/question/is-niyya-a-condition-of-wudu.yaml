id: question/is-niyya-a-condition-of-wudu
class: question
label:
  ar: هل النية شرط في صحة الوضوء؟
  en: Is intention a condition for a valid ablution?
  ur: کیا نیت وضو کے صحیح ہونے کی شرط ہے؟
summary:
  ar: 'مسألة يذكرها ابن رشد أولى مسائل أفعال الوضوء: اتفق علماء الأمصار على اشتراط النية في العبادات، واختلفوا في الوضوء؛ فاشترطها الشافعي ومالك وأحمد وأبو ثور وداود، ولم يشترطها أبو حنيفة والثوري. ويرد ابن رشد الخلاف إلى تردد الوضوء بين العبادة المحضة غير معقولة المعنى، كالصلاة، والعبادة المعقولة المعنى، كغسل النجاسة {cite:bidaya-bakri-bayt-al-afkar p. 22} {cite:bidaya-bakri-bayt-al-afkar p. 23}.'
  en: 'The first question Ibn Rushd treats under the acts of ablution: the jurists of the great cities agree that acts of worship require intention, but differ over ablution; al-Shafi''i, Malik, Ahmad, Abu Thawr and Dawud make it a condition, Abu Hanifa and al-Thawri do not. Ibn Rushd traces the disagreement to ablution hesitating between pure worship whose rationale is not grasped, like prayer, and worship whose rationale is understood, like washing off filth.'
  ur: 'ابن رشد وضو کے افعال میں سب سے پہلے یہ مسئلہ لاتے ہیں: فقہائے امصار کا اتفاق ہے کہ عبادات میں نیت شرط ہے، مگر وضو میں اختلاف ہے؛ شافعی، مالک، احمد، ابو ثور اور داود اسے شرط مانتے ہیں، ابو حنیفہ اور ثوری نہیں۔ ابن رشد اختلاف کو اس بات کی طرف لوٹاتے ہیں کہ وضو عبادتِ محضہ (جیسے نماز) اور معقول المعنی عبادت (جیسے نجاست دھونا) کے درمیان متردد ہے۔'
