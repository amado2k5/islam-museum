question:
  ar: هل يصح وضوء من غسل أعضاءه دون أن ينوي الوضوء؟
  en: Is the ablution of someone who washes the limbs without intending ablution valid?
  ur: جو شخص وضو کی نیت کے بغیر اعضا دھو لے کیا اس کا وضو صحیح ہے؟
issue:
  ar: اشتراط النية في الوضوء بعد الاتفاق على اشتراطها في العبادات.
  en: Whether intention is required for ablution, given agreement that it is required for acts of worship.
  ur: عبادات میں نیت کی شرط پر اتفاق کے بعد وضو میں نیت کی شرط۔
short_answer:
  ar: اشترطها الشافعي ومالك وأحمد وأبو ثور وداود، ولم يشترطها أبو حنيفة والثوري، بحسب ما يحكيه ابن رشد.
  en: Al-Shafi'i, Malik, Ahmad, Abu Thawr and Dawud require it; Abu Hanifa and al-Thawri do not, as Ibn Rushd reports.
  ur: ابن رشد کے بیان کے مطابق شافعی، مالک، احمد، ابو ثور اور داود اسے شرط مانتے ہیں؛ ابو حنیفہ اور ثوری نہیں مانتے۔
