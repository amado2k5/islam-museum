    ar: النية ليست شرطاً في صحة الوضوء
    en: Intention is not a condition of a valid ablution
    ur: نیت وضو کے صحیح ہونے کی شرط نہیں
  summary:
    ar: مذهب أبي حنيفة والثوري، ووجهه عند ابن رشد إلحاق الوضوء بالعبادة المفهومة المعنى كغسل النجاسة، وهي لا تفتقر إلى النية.
    en: The view of Abu Hanifa and al-Thawri; its rationale, as Ibn Rushd gives it, is that ablution is like worship whose meaning is understood, such as washing off filth, which needs no intention.
    ur: ابو حنیفہ اور ثوری کا مذہب؛ ابن رشد کے مطابق اس کی وجہ وضو کو معقول المعنی عبادت جیسے نجاست دھونے کے ساتھ ملانا ہے، جس میں نیت کی ضرورت نہیں۔
