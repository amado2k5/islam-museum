  stance:
    ar: النية شرط في صحة الوضوء
    en: Intention is a condition of a valid ablution
    ur: نیت وضو کے صحیح ہونے کی شرط ہے
  summary:
    ar: مذهب الشافعي ومالك وأحمد وأبي ثور وداود، ومستنده عند ابن رشد الاتفاق على اشتراط النية في العبادات، بالآية في الإخلاص وحديث «إنما الأعمال بالنيات»، مع إلحاق الوضوء بالعبادة المحضة.
    en: The view of al-Shafi'i, Malik, Ahmad, Abu Thawr and Dawud; its basis, as Ibn Rushd gives it, is the agreed requirement of intention in acts of worship - the verse on sincerity and the hadith "actions are only by intentions" - with ablution counted as pure worship.
    ur: شافعی، مالک، احمد، ابو ثور اور داود کا مذہب؛ ابن رشد کے مطابق اس کی بنیاد عبادات میں نیت کی متفقہ شرط ہے — اخلاص کی آیت اور حدیث «اعمال کا دار و مدار نیتوں پر ہے» — اور وضو کو عبادتِ محضہ میں شمار کرنا۔
