    summary:
      ar: "القول الرابع عند الرازي، ولم يسمّ قائله: أن الكل ممكن والأدلة النقلية ضعيفة ومتعارضة، فوجب التوقف وترك القطع {cite:mafatih-al-ghayb-dar-al-fikr-1401-j3 p.4}."
      en: "Al-Razi's fourth view, whose holders he does not name: all are possible and the transmitted evidence is weak and conflicting, so one must suspend judgement and not decide {cite:mafatih-al-ghayb-dar-al-fikr-1401-j3 p.4}."
      ur: "رازی کے ہاں چوتھا قول، جس کے قائلین کا نام وہ نہیں لیتے: سب ممکن ہیں اور نقلی دلائل کمزور اور متعارض ہیں، اس لیے توقف لازم ہے اور قطعی فیصلہ نہیں {cite:mafatih-al-ghayb-dar-al-fikr-1401-j3 p.4}۔"
    sources: [source/mafatih-al-ghayb-dar-al-fikr-1401-j3]
  - tradition: other
    id: garden-on-earth
    standing: other
    stance: { ar: "جنة في الأرض", en: "A garden on earth", ur: "زمین پر ایک باغ" }
    summary:
      ar: "قول أبي القاسم البلخي وأبي مسلم الأصفهاني، وحملا الإهباط على الانتقال من بقعة إلى بقعة، واحتجا بست حجج، منها أنها لو كانت جنة الخلد لما لحق آدم غرور إبليس، ولما خرج منها من دخلها، ولما وصل إليها إبليس بعد لعنه، وأن الله خلق آدم في الأرض ولم يذكر نقله إلى السماء {cite:mafatih-al-ghayb-dar-al-fikr-1401-j3 p.3} {cite:mafatih-al-ghayb-dar-al-fikr-1401-j3 p.4}."
      en: "Held by Abu al-Qasim al-Balkhi and Abu Muslim al-Isfahani, who read the 'going down' as moving from one place to another and gave six arguments, among them that had it been the Garden of eternity Iblis's deception could not have reached Adam, whoever enters it would not leave, Iblis could not have reached it after being cursed, and God created Adam on earth without any mention of moving him to heaven {cite:mafatih-al-ghayb-dar-al-fikr-1401-j3 p.3} {cite:mafatih-al-ghayb-dar-al-fikr-1401-j3 p.4}."
      ur: "ابو القاسم بلخی اور ابو مسلم اصفہانی کا قول، جنہوں نے «اترنے» کو ایک جگہ سے دوسری جگہ منتقل ہونے پر محمول کیا اور چھ دلائل دیے، جن میں یہ کہ اگر یہ جنتِ خلد ہوتی تو ابلیس کا فریب آدم تک نہ پہنچتا، جو اس میں داخل ہو وہ نکلتا نہیں، لعنت کے بعد ابلیس وہاں نہ پہنچ سکتا، اور اللہ نے آدم کو زمین پر پیدا کیا اور آسمان پر منتقل کرنے کا ذکر نہیں {cite:mafatih-al-ghayb-dar-al-fikr-1401-j3 p.3} {cite:mafatih-al-ghayb-dar-al-fikr-1401-j3 p.4}۔"
    sources: [source/mafatih-al-ghayb-dar-al-fikr-1401-j3]
