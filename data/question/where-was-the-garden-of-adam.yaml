    summary:
      ar: "قول الجبائي، واستدل بالأمر بالهبوط منها، وجعل الإهباط الأول من السماء السابعة إلى الأولى والثاني من السماء إلى الأرض {cite:mafatih-al-ghayb-dar-al-fikr-1401-j3 p.4}."
      en: "Held by al-Jubba'i, who argued from the command to go down from it, taking the first descent as from the seventh heaven to the first and the second from heaven to earth {cite:mafatih-al-ghayb-dar-al-fikr-1401-j3 p.4}."
      ur: "جبائی کا قول، جنہوں نے اس سے اترنے کے حکم سے استدلال کیا، اور پہلے اترنے کو ساتویں آسمان سے پہلے آسمان کی طرف اور دوسرے کو آسمان سے زمین کی طرف قرار دیا {cite:mafatih-al-ghayb-dar-al-fikr-1401-j3 p.4}۔"
