id: question/where-was-the-garden-of-adam
class: question
label:
  ar: "أين كانت الجنة التي أُسكنها آدم؟"
  en: "Where was the Garden in which Adam was settled?"
  ur: "آدم کو جس جنت میں بسایا گیا وہ کہاں تھی؟"
summary:
  ar: "يعرض الرازي في تفسير آية إسكان آدم الجنة من سورة البقرة أربعة أقوال: أنها جنة في الأرض، وهو قول أبي القاسم البلخي وأبي مسلم الأصفهاني مع ست حجج؛ وأنها في السماء السابعة، وهو قول الجبائي؛ وأنها دار الثواب، وهو قول جمهور أصحابه؛ والتوقف لأن الكل ممكن والأدلة النقلية ضعيفة متعارضة."
  en: "In his commentary on the verse of al-Baqara about Adam being settled in the Garden, al-Razi sets out four views: a garden on earth, held by Abu al-Qasim al-Balkhi and Abu Muslim al-Isfahani with six arguments; a garden in the seventh heaven, held by al-Jubba'i; the abode of reward itself, held by most of his own school; and suspending judgement, since all are possible and the transmitted evidence is weak and conflicting."
  ur: "رازی سورۂ بقرہ کی اس آیت کی تفسیر میں، جس میں آدم کو جنت میں بسانے کا ذکر ہے، چار اقوال بیان کرتے ہیں: زمین پر ایک باغ، ابو القاسم بلخی اور ابو مسلم اصفہانی کا قول چھ دلائل کے ساتھ؛ ساتویں آسمان پر ایک باغ، جبائی کا قول؛ خود دارِ ثواب، ان کے اکثر اصحاب کا قول؛ اور توقف، کیونکہ سب ممکن ہیں اور نقلی دلائل کمزور اور متعارض ہیں۔"
question:
  ar: "هل الجنة التي أُسكنها آدم هي جنة الخلد أم جنة أخرى؟"
  en: "Was the Garden Adam was settled in the Garden of eternity or another garden?"
  ur: "آدم کو جس جنت میں بسایا گیا کیا وہ جنتِ خلد تھی یا کوئی اور باغ؟"
short_answer:
  ar: "قول جمهور أصحاب الرازي أنها دار الثواب، وخالفهم البلخي وأبو مسلم فجعلاها في الأرض، والجبائي فجعلها في السماء السابعة، وتوقف قوم لتعارض الأدلة."
  en: "Most of al-Razi's school held it was the abode of reward; al-Balkhi and Abu Muslim placed it on earth, al-Jubba'i in the seventh heaven, and some suspended judgement because the evidence conflicts."
  ur: "رازی کے اکثر اصحاب کے نزدیک یہ دارِ ثواب تھی؛ بلخی اور ابو مسلم نے اسے زمین پر، جبائی نے ساتویں آسمان پر رکھا، اور بعض نے دلائل کے تعارض کی وجہ سے توقف کیا۔"
