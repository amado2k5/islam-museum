perspectives:
  - tradition: sunni
    id: abode-of-reward
    standing: main
    stance: { ar: "هي دار الثواب", en: "It was the abode of reward", ur: "یہ دارِ ثواب تھی" }
    summary:
      ar: "يقول الرازي إنه قول جمهور أصحابه، ودليله أن الألف واللام في لفظ «الجنة» لا يفيدان العموم لأن سكنى جميع الجنان محال، فوجب صرفها إلى المعهود، والجنة المعهودة بين المسلمين هي دار الثواب {cite:mafatih-al-ghayb-dar-al-fikr-1401-j3 p.4}."
      en: "Al-Razi says this is the view of most of his school, arguing that the definite article in 'the Garden' cannot mean every garden, since living in all gardens is impossible, so it must refer to the known one, and the Garden known among Muslims is the abode of reward {cite:mafatih-al-ghayb-dar-al-fikr-1401-j3 p.4}."
      ur: "رازی کہتے ہیں کہ یہ ان کے اکثر اصحاب کا قول ہے، اور دلیل یہ کہ «الجنۃ» میں الف لام عموم کا فائدہ نہیں دیتا کیونکہ تمام باغوں میں رہنا محال ہے، اس لیے اسے معہود کی طرف پھیرنا لازم ہے، اور مسلمانوں میں معہود جنت دارِ ثواب ہے {cite:mafatih-al-ghayb-dar-al-fikr-1401-j3 p.4}۔"
    sources: [source/mafatih-al-ghayb-dar-al-fikr-1401-j3]
