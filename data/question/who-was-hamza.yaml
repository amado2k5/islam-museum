id: question/who-was-hamza
class: question
label:
  ar: من كان حمزة بن عبد المطلب؟
  en: Who was Hamza ibn Abd al-Muttalib?
  es: "¿Quién fue Hamza ibn Abd al-Muttalib?"
  fr: "Qui était Hamza ibn Abd al-Muttalib ?"
  ur: "حمزہ بن عبدالمطلب کون تھے؟"
  tr: "Hamza ibn Abd al-Muttalib kimdi?"
  id: "Siapakah Hamza ibn Abd al-Muttalib?"
summary:
  ar: حمزة عم النبي وسيد الشهداء؛ من أشجع فرسان بدر وأُحد فاستشهد في أُحد سنة 625 ومثّل المشركون بجثته.
  en: "Hamza ibn Abd al-Muttalib, uncle of the Prophet and Master of the Martyrs, was among the bravest horsemen at Badr and Uhud; he was martyred at Uhud in 625, and the polytheists mutilated his body."
  es: "Hamza ibn Abd al-Muttalib, tío del Profeta y Maestro de los Mártires, fue uno de los jinetes más valientes en Badr y Uhud; fue martirizado en Uhud en el año 625, y los politeístas mutilaron su cuerpo."
  fr: "Hamza ibn Abd al-Muttalib, oncle du Prophète et Maître des Martyrs, était parmi les cavaliers les plus braves à Badr et Uhud; il fut martyrisé à Uhud en 625, et les polythéistes mutilèrent son corps."
  ur: "حمزہ بن عبدالمطلب، رسول اللہ کے چچا اور شہداء کے سردار، بدر اور احد کے بہادر گھڑ سواروں میں سے تھے۔ 625ء میں احد کے مقام پر شہید ہوئے اور مشرکین نے ان کے جسم کو مسخ کر دیا۔"
  tr: "Peygamber'in amcası ve şehitlerin ustası Hamza, Badr ve Uhud'un en cesur şövalyelerinden biriydi; 625 Hicri yılında Uhud'da şehit edildi ve putperestler tarafından cesediyle birlikte sakatlandı."
  id: "Hamza, paman Nabi dan guru para syahid, adalah salah satu ksatria paling berani dari Badr dan Uhud, yang menjadi martir di Uhud pada tahun 625 H, dan dimutilasi oleh para musyrik dengan tubuhnya."
question:
  ar: من كان حمزة بن عبد المطلب؟
short_answer:
  ar: حمزة عم النبي وسيد الشهداء؛ من أشجع فرسان بدر وأُحد فاستشهد في أُحد سنة 625 ومثّل المشركون بجثته.
long_answer:
  ar: '[[person/hamza|حمزة بن عبد المطلب]] عم النبي وأخوه من الرضاعة؛ أسلم فأعزّ الله به قريشًا. من أبطال
    بدر، وفي أُحد قتله وحشي بن حرب برمحه فاستشهد، وقال فيه النبي إنه سيد الشهداء يوم القيامة. {cite:wikidata}'
