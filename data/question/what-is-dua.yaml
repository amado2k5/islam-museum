label:
  ar: "ما الدعاء؟"
  en: What is dua?
summary:
  ar: "الدعاء تضرع العبد إلى الله بالمسألة، وقد ورد في القرآن الأمر به ووعد الإجابة، وجعله العلماء مخ العبادة."
  en: "Dua is the servant's humble turning to God in request. The Quran commands it and promises a response, and scholars have called it the essence of worship."
