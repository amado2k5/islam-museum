id: question/what-is-dua
class: question
label:
  ar: "ما الدعاء؟"
  en: What is dua?
  es: "¿Qué es dua?"
  fr: "Qu'est-ce que la dua ?"
  ur: "دعا کیا ہے؟"
summary:
  ar: "الدعاء تضرع العبد إلى الله بالمسألة، وقد ورد في القرآن الأمر به ووعد الإجابة، وجعله العلماء مخ العبادة."
  en: "Dua is the servant's humble turning to God in request. The Quran commands it and promises a response, and scholars have called it the essence of worship."
  es: "La súplica (Dua) es la humilde intercesión del siervo a Dios. El Corán la ordena y promete una respuesta, y los eruditos la consideran la esencia de la adoración."
  fr: "La dua est l'hommage humble que le serviteur adresse à Dieu pour le supplier. Le Coran l'ordonne et promet une réponse; les savants la considèrent comme l'essence même de l'adoration."
  ur: "دعا ہے بندے کا عاجزی سے خدا کی طرف رجوع کرنا۔ قرآن اس کا حکم دیتا ہے اور جواب کا وعدہ کرتا ہے، اور علماء نے اسے عبادت کا جوہر قرار دیا ہے۔"
wings: []
question:
  ar: "ما الدعاء؟"
short_answer:
  ar: "الدعاء تضرع العبد إلى الله بالمسألة، وقد ورد في القرآن الأمر به ووعد الإجابة، وجعله العلماء مخ العبادة."
long_answer:
  ar: |
    الدعاء عبادة بذاتها، وله آداب وردت في السنة كاستقبال القبلة ورفع اليدين {cite:tanzil-quran} {cite:sahih-al-bukhari}.
    ويعرض مدخل [[practice/dua|الدعاء]] معناه وآدابه، ويرتبط ب[[practice/dhikr|الذكر]] وب[[practice/salah|الصلاة]].

