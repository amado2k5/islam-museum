id: question/who-was-al-khansa
class: question
label:
  ar: من كانت الخنساء؟
  en: Who was al-Khansa?
  es: "¿Quién era al-Khansa?"
  fr: "Qui était al-Khansa ?"
summary:
  ar: تماضر بنت عمرو الخنساء ⁦(نحو 575–645)⁩ شاعرة مكة/اليمامة؛ سيدة الرثاء في الشعر العربي وأسلمت مع بنيها
    فاستشهدوا في القادسية.
  en: "Tumadir bint Amr, known as al-Khansa (c. 575–645), was a poet of Mecca/al-Yamama and the foremost master of elegy in Arabic poetry. She embraced Islam along with her sons, and they were martyred at al-Qadisiyya."
  es: "Tumadir bint Amr, conocida como al-Khansa (c. 575–645), fue una poetisa de La Meca/al-Yamama y la principal maestra de la elegía en la poesía árabe. Se convirtió al islam junto con sus hijos, y ambos fueron martirizados en al-Qadisiyya."
  fr: "Tumadir bint Amr, connue sous le nom d'al-Khansa (vers 575-645), était une poétesse de La Mecque/al-Yamama et la plus grande maîtresse de l'élégie dans la poésie arabe. Elle se convertit à l'islam avec ses fils, et ils furent martyrisés à al-Qadisiyya."
question:
  ar: من كانت الخنساء؟
short_answer:
  ar: تماضر بنت عمرو الخنساء ⁦(نحو 575–645)⁩ شاعرة مكة/اليمامة؛ سيدة الرثاء في الشعر العربي وأسلمت مع بنيها
    فاستشهدوا في القادسية.
long_answer:
  ar: '[[person/al-khansa|الخنساء]] من بني سليم؛ أشهر شاعرات العرب في الرثاء بإخوتها صخر ومعاوية. أسلمت
    مع قومها وأرسلت أبناءها الأربعة إلى القادسية فاستشهدوا جميعًا فصبرت واحتسبت؛ مدحت النبي بقصيدتها المشهورة.
    {cite:wikidata}'
