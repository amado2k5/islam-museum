  en: "Tumadir bint Amr, known as al-Khansa (c. 575–645), was a poet of Mecca/al-Yamama and the foremost master of elegy in Arabic poetry. She embraced Islam along with her sons, and they were martyred at al-Qadisiyya."
question:
  ar: من كانت الخنساء؟
short_answer:
  ar: تماضر بنت عمرو الخنساء (نحو 575–645) شاعرة مكة/اليمامة؛ سيدة الرثاء في الشعر العربي وأسلمت مع بنيها
    فاستشهدوا في القادسية.
long_answer:
  ar: '[[person/al-khansa|الخنساء]] من بني سليم؛ أشهر شاعرات العرب في الرثاء بإخوتها صخر ومعاوية. أسلمت
    مع قومها وأرسلت أبناءها الأربعة إلى القادسية فاستشهدوا جميعًا فصبرت واحتسبت؛ مدحت النبي بقصيدتها المشهورة.
