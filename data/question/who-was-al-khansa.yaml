  ar: من كانت الخنساء؟
  en: Who was al-Khansa?
summary:
  ar: تماضر بنت عمرو الخنساء (نحو 575–645) شاعرة مكة/اليمامة؛ سيدة الرثاء في الشعر العربي وأسلمت مع بنيها
