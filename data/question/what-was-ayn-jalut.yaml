id: question/what-was-ayn-jalut
class: question
label:
  ar: ما معركة عين جالوت؟
  en: What was the Battle of Ayn Jalut?
  es: "¿Qué fue la Batalla de Ayn Jalut?"
  fr: "Qu'était-ce que la bataille d'Ayn Jalut ?"
  ur: "عین جالوت کی جنگ کیا تھی؟"
  tr: "Ain Jalut Savaşı nedir?"
  id: "Apa itu Pertempuran Ain Jalut?"
summary:
  ar: عين جالوت 658هـ/1260م؛ أول هزيمة كبرى للمغول؛ قادها المماليك بقيادة قطز وبيبرس فوقفت الزحف المغولي
    عن الشام ومصر.
  en: "Ayn Jalut, 658 AH / 1260 CE; the first major defeat of the Mongols, led by the Mamluks under Qutuz and Baybars, which halted the Mongol advance on Syria and Egypt."
  es: "Ayn Jalut, 658 AH / 1260 d. C.; la primera gran derrota de los mongoles, liderada por los mamelucos bajo el mando de Qutuz y Baybars, que detuvo el avance mongol sobre Siria y Egipto."
  fr: "Ayn Jalut, 658 AH / 1260 CE; la première grande défaite des Mongols, menée par les Mamelouks sous Qutuz et Baybars, qui stoppa l'avancée mongole sur la Syrie et l'Égypte."
  ur: "عین جالوت، 658ھ / 1260 عیسوی؛ منگولوں کی پہلی بڑی شکست، جس کی قیادت مملوکوں نے قطوز اور بیبارس کے تحت کی، جس نے شام اور مصر پر منگول کی پیش قدمی کو روک دیا۔"
  tr: "Ayn Celut 658 Hicri / 1260 M.S.; Moğolların ilk büyük yenilgisi; Memlükler tarafından Qutuz ve Baybars komutasında, Moğolların Levant ve Mısır'dan ilerleyişini durdurdu."
  id: "Ain Jalut 658 AH / 1260 M; kekalahan besar pertama Mongol; dipimpin oleh Mamluk yang dipimpin oleh Qutuz dan Baybars, menghentikan kemajuan Mongol dari Levant dan Mesir."
question:
  ar: ما معركة عين جالوت؟
short_answer:
  ar: عين جالوت 658هـ/1260م؛ أول هزيمة كبرى للمغول؛ قادها المماليك بقيادة قطز وبيبرس فوقفت الزحف المغولي
    عن الشام ومصر.
long_answer:
  ar: '[[event/ayn-jalut-658|عين جالوت]] غزة فلسطين؛ التقى المماليك بقطز وركن الدين بيبرس بجيش كتبغا المغولي؛
    أول هزيمة ناجزة للمغول منذ خروجهم من منغوليا؛ ثبتت بها مصر والحجاز وأهلت المماليك لحكم مصر والشام
    قرنين ونصف. {cite:wikidata}'
