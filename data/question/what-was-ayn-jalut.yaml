    عن الشام ومصر.
long_answer:
  ar: '[[event/ayn-jalut-658|عين جالوت]] غزة فلسطين؛ التقى المماليك بقطز وركن الدين بيبرس بجيش كتبغا المغولي؛
    أول هزيمة ناجزة للمغول منذ خروجهم من منغوليا؛ ثبتت بها مصر والحجاز وأهلت المماليك لحكم مصر والشام
    قرنين ونصف. {cite:wikidata}'
