id: question/what-is-ikhlas
class: question
label:
  ar: ما الإخلاص؟
  en: What is ikhlas?
summary:
  ar: الإخلاص هو تصفية النية لله دون رياء؛ شرط قبول العمل وأصله؛ سورة الإخلاص تعدل ثلث القرآن في الفضائل.
  en: "Ikhlas is purifying one's intention for God alone, without showing off. It is a condition for the acceptance of deeds and their foundation. Surat al-Ikhlas is said to equal a third of the Qur'an in merit."
question:
  ar: ما الإخلاص؟
short_answer:
  ar: الإخلاص هو تصفية النية لله دون رياء؛ شرط قبول العمل وأصله؛ سورة الإخلاص تعدل ثلث القرآن في الفضائل.
long_answer:
  ar: الإخلاص هو إفراد الله بالقصد في العبادة والعمل؛ به تتفاوت الأعمال في الآخرة لا بكثرتها. مرتبط بسورة
    الإخلاص التي تصف الوحدانية المطلقة والتي روي في فضلها ما يعدل ثلث القرآن. {cite:wikidata}
