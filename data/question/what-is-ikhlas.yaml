id: question/what-is-ikhlas
class: question
label:
  ar: ما الإخلاص؟
  en: What is ikhlas?
  es: "¿Qué es ikhlas?"
  fr: "Qu'est-ce que l'ikhlas ?"
  ur: "اخلاص کیا ہے؟"
summary:
  ar: الإخلاص هو تصفية النية لله دون رياء؛ شرط قبول العمل وأصله؛ سورة الإخلاص تعدل ثلث القرآن في الفضائل.
  en: "Ikhlas is purifying one's intention for God alone, without showing off. It is a condition for the acceptance of deeds and their foundation. Surat al-Ikhlas is said to equal a third of the Qur'an in merit."
  es: "La sinceridad (Ikhlas) consiste en purificar la intención únicamente para Dios, sin ostentación. Es una condición para la aceptación de las obras y su fundamento. Se dice que la sura Al-Ikhlas tiene un valor equivalente a un tercio del Corán."
  fr: "L'ikhlas consiste à purifier son intention envers Dieu seul, sans ostentation. C'est une condition nécessaire à l'acceptation des actes et à leur fondement. On dit que la sourate al-Ikhlas équivaut à un tiers du Coran en mérite."
  ur: "اخلاص صرف خدا کے لیے اپنی نیت کو بغیر دکھاوے کے پاک کرنا ہے۔ یہ اعمال کی قبولیت اور ان کی بنیاد کے لیے شرط ہے۔ سورۃ اخلاص کو فضیلت میں تہائی قرآن کے برابر کہا جاتا ہے۔"
question:
  ar: ما الإخلاص؟
short_answer:
  ar: الإخلاص هو تصفية النية لله دون رياء؛ شرط قبول العمل وأصله؛ سورة الإخلاص تعدل ثلث القرآن في الفضائل.
long_answer:
  ar: الإخلاص هو إفراد الله بالقصد في العبادة والعمل؛ به تتفاوت الأعمال في الآخرة لا بكثرتها. مرتبط بسورة
    الإخلاص التي تصف الوحدانية المطلقة والتي روي في فضلها ما يعدل ثلث القرآن. {cite:wikidata}
