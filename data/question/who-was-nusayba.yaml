id: question/who-was-nusayba
class: question
label:
  ar: من كانت نسيبة بنت كعب؟
  en: Who was Nusayba bint Kab?
  es: "¿Quién era Nusayba bint Kab?"
  fr: "Qui était Nusayba bint Kab ?"
  ur: "نصیبہ بنت کعب کون تھیں؟"
  tr: "Nusaybah bint Ka'b kimdi?"
  id: "Siapa Nusaybah bint Ka'b?"
summary:
  ar: نسيبة بنت كعب الأنصارية أم عمارة؛ من أوائل المبايعات بالعقبة وقاتلت في أُحد بترت جراحها اثني عشر
    أثرًا دفاعًا عن النبي.
  en: "Nusayba bint Kab al-Ansariyya, known as Umm Umara; one of the first women to pledge allegiance at al-Aqaba. She fought at Uhud in defence of the Prophet, and her wounds bore twelve marks."
  es: "Nusayba bint Kab al-Ansariyya, conocida como Umm Umara, fue una de las primeras mujeres en jurar lealtad en Aqaba. Luchó en Uhud en defensa del Profeta y sus heridas presentaban doce marcas."
  fr: "Nusayba bint Kab al-Ansariyya, connue sous le nom d'Umm Umara, fut l'une des premières femmes à prêter allégeance à al-Aqaba. Elle combattit à Uhud pour défendre le Prophète et ses blessures portèrent douze marques."
  ur: "نصیبہ بنت کب الانصاریہ، ام عمارہ کے نام سے مشہور؛ عقبہ میں بیعت کرنے والی پہلی خواتین میں سے ایک۔ وہ احد میں رسول اللہ کے دفاع میں لڑیں اور ان کے زخموں پر بارہ نشانات تھے۔"
  tr: "Nusaybah bint Ka'b al-Ansariyyah, ümmü Amarah, Akabe'deki en erken vaahhüdlerden biriydi ve Uhud'da savaştı; burada yaraları kesilmiş ve Peygamber'i savunan on iki eser kesildi."
  id: "Nusaybah bint Ka'b al-Ansariyyah, um Amarah, adalah salah satu yang pertama berjanji di Aqaba dan bertempur di Uhud, di mana lukanya diamputasi dua belas artefak yang membela Nabi."
question:
  ar: من كانت نسيبة بنت كعب؟
short_answer:
  ar: نسيبة بنت كعب الأنصارية أم عمارة؛ من أوائل المبايعات بالعقبة وقاتلت في أُحد بترت جراحها اثني عشر
    أثرًا دفاعًا عن النبي.
long_answer:
  ar: '[[person/nusayba-bint-kab|نسيبة بنت كعب]] من بايعات العقبة الثانية؛ حملت السيف يوم أُحد فدافعت
    عن النبي حتى كسرت درعها وأثبت جراحها في صدرها اثنا عشر أثرًا؛ شهدت معارك اليمامة فقطعت يدها، وقتلت
    مسيلمة على رواية. {cite:wikidata}'
