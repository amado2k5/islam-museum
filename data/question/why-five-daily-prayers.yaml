id: question/why-five-daily-prayers
class: question
label:
  ar: لماذا يصلي المسلمون خمس صلوات في اليوم؟
  en: Why do Muslims pray five times a day?
  es: "¿Por qué los musulmanes rezan cinco veces al día?"
  fr: "Pourquoi les musulmans prient-ils cinq fois par jour ?"
  ur: "مسلمان دن میں پانچ وقت کی نماز کیوں پڑھتے ہیں؟"
  tr: "Müslümanlar neden günde beş namaz kılıyor?"
  id: "Mengapa Muslim shalat lima kali sehari?"
summary:
  ar: الصلاة المفروضة خمس مرات في اليوم والليلة، والقرآن يجعلها وقتاً محدداً على المؤمنين؛ وهذا جواب مختصر عن سبب هذا العدد وأصله.
  en: "The obligatory prayer is performed five times in the day and night, and the Qur'an makes it an obligation at set times for believers. This is a brief answer about the reason for this number and its origin."
  es: "La oración obligatoria se realiza cinco veces al día y cinco veces a la noche, y el Corán la establece como una obligación para los creyentes en momentos específicos. Esta es una breve explicación sobre el motivo de este número y su origen."
  fr: "La prière obligatoire est accomplie cinq fois par jour et cinq fois par nuit, et le Coran en fait une obligation à heures fixes pour les croyants. Voici une brève explication de ce nombre et de son origine."
  ur: "فرض نماز دن اور رات میں پانچ مرتبہ ادا کی جاتی ہے، اور قرآن اسے مومنوں کے لیے مقررہ اوقات میں فرض قرار دیتا ہے۔ یہ اس نمبر کی وجہ اور اس کی اصل کے بارے میں ایک مختصر جواب ہے۔"
  tr: "Zorunlu namaz gece ve gündüz beş kez yapılır ve Kur'an bunu müminler için belirli bir zaman olarak belirler; bu, bu sayının nedeni ve kökenine kısa bir cevaptır."
  id: "Shalat wajib dilakukan lima kali sehari dan malam, dan Al-Qur'an menetapkan waktu tertentu untuk umat beriman; ini adalah jawaban singkat atas alasan dan asal usul angka tersebut."
