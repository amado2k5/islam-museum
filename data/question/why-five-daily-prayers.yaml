label:
  ar: لماذا يصلي المسلمون خمس صلوات في اليوم؟
  en: Why do Muslims pray five times a day?
summary:
  ar: الصلاة المفروضة خمس مرات في اليوم والليلة، والقرآن يجعلها وقتاً محدداً على المؤمنين؛ وهذا جواب مختصر عن سبب هذا العدد وأصله.
  en: "The obligatory prayer is performed five times in the day and night, and the Qur'an makes it an obligation at set times for believers. This is a brief answer about the reason for this number and its origin."
