question:
  ar: لماذا يصلي المسلمون خمس صلوات في اليوم؟
short_answer:
  ar: الصلاة المفروضة في الإسلام خمس مرات في اليوم والليلة، وهي من أركان الإسلام الخمسة. والقرآن يصفها بأنها «كتاباً موقوتاً» أي فريضة لها أوقات محددة، والسنة بيّنت هذه الأوقات بالفعل وبالقول.
long_answer:
  ar: |
    الصلاة في الإسلام عبادة تتكرر كل يوم، وتُؤدى في خمسة أوقات: الفجر، والظهر، والعصر، والمغرب، والعشاء. وهي من [[concept/five-pillars|أركان الإسلام الخمسة]] {cite:sahih-al-bukhari 8}.

    أصل الفريضة في القرآن. تذكر [[passage/quran-4-103|سورة النساء 103]] أن الصلاة فُرضت على المؤمنين «كتاباً موقوتاً»، أي لها أوقات محددة لا تُترك.

    أما عدد الصلوات وأوقاتها فيُعرف من السنة النبوية، ومن أشهر ما روي فيها أن جبريل صلّى بالنبي في أول الوقت وآخره في اليومين، وأن ذلك بيان لأوقات الصلاة {cite:sahih-al-bukhari 50}. وقد نقل العلماء هذا الحديث لبيان المواقيت، وهم متفقون على الخمس في أصل الفريضة.

    هذا المعنى يُراد به أن الصلاة تذكير متكرر بالعبادة في أوقات متفرقة من اليوم، لا أن كل مسلم يؤديها بالطريقة نفسها. فالمذاهب الفقهية تختلف في تفاصيل الأوقات وفي بعض الأحكام، وهذا ما يُعرض في مدخل [[practice/salah|الصلاة]].

    وتعرّف الصلاة النافلة في الحديث بأنها غير المفروضة، فلا تُعد الصلوات الاختيارية من الخمس.
