  en: The difference between the seven ahruf and the seven readings
  ur: سات احرف اور سات قراءتوں کا فرق
perspectives:
- tradition: sunni
  id: not-the-same
  standing: main
  stance:
    ar: الأحرف السبعة غير القراءات السبع
    en: The seven ahruf are not the seven readings
    ur: سات احرف سات قراءتوں سے الگ ہیں
  summary:
    ar: "يقول أبو شامة: ظن قوم أن القراءات السبع الموجودة الآن هي التي أُريدت في الحديث خلاف إجماع أهل العلم قاطبةً. ويقول أبو العباس بن عمار: فعل مسبّع هذه السبعة ما لا ينبغي له وأشكل على العامة. ويقول مكي: من ظن أن قراءة هؤلاء كنافع وعاصم هي الأحرف السبعة فقد غلط غلطاً عظيماً، ويلزم من هذا أن ما خرج عنها مما ثبت عن أئمة آخرين ووافق الخط ألا يكون قرآناً. ويقول ابن تيمية في جواب ينقله ابن الجزري: لا نزاع بين العلماء المعتبرين أن الأحرف السبعة ليست قراءات القراء السبعة {cite:itqan-suyuti p. 525} {cite:itqan-suyuti p. 526} {cite:nashr-dahman-damascus-1345-v1 p. 48}."
    en: "Abu Shama says: some people thought the seven readings found now are those intended in the hadith, against the consensus of all the people of knowledge. Abu al-Abbas ibn Ammar says: whoever made them seven did what he should not have and confused the common people. Makki says: whoever thinks the reading of these men, Nafi' and Asim and the rest, is the seven ahruf has made a great mistake, and it would follow that what lies outside it, established from other imams and agreeing with the script, would not be Qur'an. Ibn Taymiyya says, in a reply Ibn al-Jazari quotes: there is no dispute among reputable scholars that the seven ahruf are not the readings of the seven readers {cite:itqan-suyuti p. 525} {cite:itqan-suyuti p. 526} {cite:nashr-dahman-damascus-1345-v1 p. 48}."
    ur: "ابو شامہ کہتے ہیں: کچھ لوگوں کا یہ گمان کہ اب موجود سات قراءتیں ہی حدیث میں مراد ہیں، تمام اہلِ علم کے اجماع کے خلاف ہے۔ ابو العباس بن عمار کہتے ہیں: ان سات کو سات بنانے والے نے وہ کیا جو اسے نہیں کرنا چاہیے تھا اور عوام کو الجھا دیا۔ مکی کہتے ہیں: جس نے گمان کیا کہ نافع اور عاصم وغیرہ کی قراءت ہی سات احرف ہے اس نے بڑی غلطی کی، اور اس سے لازم آئے گا کہ جو اس سے باہر ہو، دوسرے ائمہ سے ثابت ہو اور خط کے موافق ہو، قرآن نہ ہو۔ ابن تیمیہ، اس جواب میں جسے ابن الجزری نقل کرتے ہیں، کہتے ہیں: معتبر علماء میں کوئی نزاع نہیں کہ سات احرف ساتوں قاریوں کی قراءتیں نہیں {cite:itqan-suyuti p. 525} {cite:itqan-suyuti p. 526} {cite:nashr-dahman-damascus-1345-v1 p. 48}۔"
