id: question/are-the-seven-readings-the-seven-ahruf
class: question
label:
  ar: هل القراءات السبع هي الأحرف السبعة؟
  en: Are the seven readings the seven ahruf?
  ur: کیا سات قراءتیں ہی سات احرف ہیں؟
  es: "¿Son las siete lecturas los siete ahruf?"
  fr: "Les sept lectures sont-elles les sept ahruf ?"
  tr: "Yedi okuma yedi harf mi?"
  id: "Apakah tujuh pembacaan itu tujuh huruf?"
summary:
  ar: "ينص العلماء على أن الأحرف السبعة ليست قراءات القراء السبعة؛ فأبو شامة يعدّ الظن بذلك مخالفاً لإجماع أهل العلم، ومكي يعدّه غلطاً عظيماً، وابن تيمية يقول إن ابن مجاهد جمعها موافقةً للعدد لا اعتقاداً أنها هي؛ وتبقى مسألة: هل القراءات المتواترة اليوم كل الأحرف أم بعضها {cite:itqan-suyuti p. 525} {cite:itqan-suyuti p. 526} {cite:nashr-dahman-damascus-1345-v1 p. 49}."
  en: "Scholars state that the seven ahruf are not the readings of the seven readers; Abu Shama counts the opinion otherwise as against the consensus of the people of knowledge, Makki as a great mistake, and Ibn Taymiyya says Ibn Mujahid gathered them to match the number, not believing they are the ahruf; what remains is whether the readings mass-transmitted today are all or part of the ahruf {cite:itqan-suyuti p. 525} {cite:itqan-suyuti p. 526} {cite:nashr-dahman-damascus-1345-v1 p. 49}."
  ur: "علماء صراحت کرتے ہیں کہ سات احرف ساتوں قاریوں کی قراءتیں نہیں؛ ابو شامہ اس کے برعکس گمان کو اہلِ علم کے اجماع کے خلاف کہتے ہیں، مکی اسے بڑی غلطی، اور ابن تیمیہ کہتے ہیں کہ ابن مجاہد نے انھیں عدد کی موافقت کے لیے جمع کیا نہ اس اعتقاد سے کہ یہی احرف ہیں؛ باقی سوال یہ ہے کہ آج متواتر قراءتیں تمام احرف ہیں یا بعض {cite:itqan-suyuti p. 525} {cite:itqan-suyuti p. 526} {cite:nashr-dahman-damascus-1345-v1 p. 49}۔"
  es: "Los eruditos afirman que los siete ahruf no son las lecturas de los siete lectores; Abu Shama considera que la opinión contraria es contraria al consenso de la gente de conocimiento, Makki la considera un gran error, e Ibn Taymiyya dice que Ibn Mujahid los reunió para que coincidieran con el número, sin creer que fueran los ahruf; lo que queda es si las lecturas transmitidas masivamente hoy son todas o parte de los ahruf {cite:itqan-suyuti p. 525} {cite:itqan-suyuti p. 526} {cite:nashr-dahman-damascus-1345-v1 p. 49}."
  fr: "Les savants affirment que les sept ahruf ne sont pas les lectures des sept lecteurs; Abu Shama considère l’opinion contraire comme allant à l’encontre du consensus des gens de science, Makki comme une grave erreur, et Ibn Taymiyya dit qu’Ibn Mujahid les a rassemblés pour correspondre au nombre, ne croyant pas qu’il s’agisse des ahruf; ce qui reste à déterminer, c’est si les lectures transmises massivement aujourd’hui sont la totalité ou une partie des ahruf {cite:itqan-suyuti p. 525} {cite:itqan-suyuti p. 526} {cite:nashr-dahman-damascus-1345-v1 p. 49}."
  tr: "Âlimler, yedi harfin yedi okunanın yedi okuması olmadığını belirtir; Ebu Şama bu varsayımı alimlerin uzlaşmasına aykırı olarak görürken, Makki bunu büyük bir hata olarak görür. İbn Teymiyye, İbn Mücahit'in bunları sayıya göre topladığını, aynı olduklarına inanmadığını söyler. Soru şu ki: Bugünkü mutewatir okumaları tüm harfler mi yoksa bazı {cite:itqan-suyuti, s. 525} {cite:itqan-suyuti, s. 526} {cite:nashr-dahman-damascus-1345-v1, s. 49}?"
  id: "Para ulama menyatakan bahwa tujuh surat tersebut bukanlah tujuh bacaan dari tujuh pembaca; Abu Shama menganggap asumsi ini bertentangan dengan konsensus para ulama, dan Makki menganggapnya sebagai kesalahan besar. Ibn Taymiyyah mengatakan bahwa Ibn Mujahid mengumpulkannya sesuai angka, tidak percaya bahwa mereka sama. Pertanyaannya tetap: Apakah bacaan mutawatir saat ini semua huruf atau beberapa {cite:itqan-suyuti, hlm. 525} {cite:itqan-suyuti, hlm. 526} {cite:itqan-suyuti, hlm. 526} {cite:nashr-dahman-damascus-1345-v1, hlm. 49}."
question:
  ar: هل تعني قراءات نافع وابن كثير وأبي عمرو وابن عامر وعاصم وحمزة والكسائي الأحرف السبعة التي ورد بها الحديث؟
  en: Do the readings of Nafi', Ibn Kathir, Abu Amr, Ibn Amir, Asim, Hamza and al-Kisa'i stand for the seven ahruf in the hadith?
  ur: کیا نافع، ابن کثیر، ابو عمرو، ابن عامر، عاصم، حمزہ اور کسائی کی قراءتیں وہی سات احرف ہیں جو حدیث میں آئے؟
short_answer:
  ar: "لا عند من ذكرهم السيوطي وابن الجزري: الأحرف سبقت القراء، والسبعة اختيار أحدثه ابن مجاهد؛ والخلاف الباقي في أن القراءات الثابتة هي كل الأحرف أو بعضها."
  en: "No, for those cited by al-Suyuti and Ibn al-Jazari: the ahruf came before the readers, and the seven is a selection Ibn Mujahid introduced; the remaining dispute is whether the established readings are all or some of the ahruf."
  ur: "نہیں، ان کے نزدیک جنھیں سیوطی اور ابن الجزری نقل کرتے ہیں: احرف قراء سے پہلے تھے اور سات ایک انتخاب ہے جو ابن مجاہد نے شروع کیا؛ باقی اختلاف اس میں ہے کہ ثابت قراءتیں تمام احرف ہیں یا بعض۔"
