  id: ibn-mujahid-matched-the-number
  standing: secondary
  stance:
    ar: جمع ابن مجاهد السبعة موافقةً لعدد الحروف لا اعتقاداً بأنها هي
    en: Ibn Mujahid collected the seven to match the number of ahruf, not believing they are the ahruf
    ur: ابن مجاہد نے سات کو احرف کی تعداد کے موافق جمع کیا نہ یہ اعتقاد رکھ کر کہ یہی احرف ہیں
  summary:
    ar: "ينقل ابن الجزري جواب ابن تيمية أن أول من جمعها ابن مجاهد ليكون ذلك موافقاً لعدد الحروف التي أُنزل عليها القرآن، لا لاعتقاده واعتقاد غيره أن القراءات السبع هي الحروف السبعة أو أن هؤلاء المعينين لا يجوز القراءة بغير قراءتهم؛ ويذكر مكي في الاقتصار أسباباً: كثرة الرواة وقصر الهمم وتيسير الحفظ، وأن المصاحف التي أرسلها عثمان كانت خمسة {cite:nashr-dahman-damascus-1345-v1 p. 49} {cite:itqan-suyuti p. 527}."
    en: "Ibn al-Jazari relays Ibn Taymiyya's answer that the first to gather them was Ibn Mujahid, to match the number of ahruf the Qur'an was revealed in, not from his belief and anyone's that the seven readings are the seven ahruf or that these named men are the only ones one may read after; Makki gives reasons for the limiting: the number of transmitters, the shortening of effort, ease of memorizing, and that the codices Uthman sent were five {cite:nashr-dahman-damascus-1345-v1 p. 49} {cite:itqan-suyuti p. 527}."
    ur: "ابن الجزری ابن تیمیہ کا جواب نقل کرتے ہیں کہ انھیں پہلی بار ابن مجاہد نے اس لیے جمع کیا کہ وہ ان حروف کی تعداد کے موافق ہو جن پر قرآن اترا، نہ ان کے اور دوسروں کے اس اعتقاد سے کہ سات قراءتیں ہی سات حروف ہیں یا انھی معین لوگوں کی قراءت کے سوا پڑھنا جائز نہیں؛ مکی اقتصار کے اسباب بتاتے ہیں: راویوں کی کثرت، ہمتوں کی کمی، حفظ کی آسانی، اور یہ کہ عثمان نے جو مصاحف بھیجے وہ پانچ تھے {cite:nashr-dahman-damascus-1345-v1 p. 49} {cite:itqan-suyuti p. 527}۔"
