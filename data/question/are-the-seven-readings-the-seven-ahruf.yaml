  id: readings-hold-only-some-ahruf
  standing: secondary
  stance:
    ar: القراءات المتواترة اليوم تحتوي بعض الأحرف لا كلها
    en: The readings mass-transmitted today hold some of the ahruf, not all
    ur: آج کی متواتر قراءتوں میں بعض احرف ہیں سب نہیں
  summary:
    ar: "يقول ابن الجزري إن من عنده أنه لا يجوز للأمة ترك شيء من الأحرف السبعة يدعي أنها مستمرة النقل بالتواتر إلى اليوم، ويردّه بأن القراءات المشهورة اليوم عن السبعة والعشرة والثلاثة عشر بالنسبة إلى ما كان مشهوراً في الأعصار الأولى «قلّ من كثر ونزر من بحر». ويختار السبت أن المصاحف العثمانية اشتملت على بعض الأحرف السبعة لا كلها {cite:nashr-dahman-damascus-1345-v1 p. 43} {cite:manahil-irfan-sabt p. 184}."
    en: "Ibn al-Jazari says that whoever holds the community may not leave any of the seven ahruf claims they have been continuously transmitted to this day by mass transmission, and answers that the readings famous today from the seven, the ten and the thirteen are, compared to what was famous in the earliest ages, 'a drop of a flood and a little of a sea'. Al-Sabt chooses that the Uthmanic codices held some of the seven ahruf, not all {cite:nashr-dahman-damascus-1345-v1 p. 43} {cite:manahil-irfan-sabt p. 184}."
    ur: "ابن الجزری کہتے ہیں کہ جس کے نزدیک امت کے لیے سات احرف میں سے کسی کو چھوڑنا جائز نہیں وہ دعویٰ کرتا ہے کہ وہ آج تک تواتر سے منقول چلے آ رہے ہیں، اور وہ اس کا جواب دیتے ہیں کہ آج سبعہ، عشرہ اور تیرہ سے مشہور قراءتیں ابتدائی ادوار میں جو مشہور تھا اس کے مقابلے میں «بہت میں سے تھوڑی اور سمندر میں سے ذرا سی» ہیں۔ سبت اختیار کرتے ہیں کہ مصاحفِ عثمانیہ سات احرف میں سے بعض پر مشتمل تھے سب پر نہیں {cite:nashr-dahman-damascus-1345-v1 p. 43} {cite:manahil-irfan-sabt p. 184}۔"
