id: question/what-is-damascus
class: question
label:
  ar: ما دمشق؟
  en: What is Damascus?
  es: "¿Qué es Damasco?"
  fr: "Qu'est-ce que Damas ?"
  ur: "دمشق کیا ہے؟"
  tr: "Şam nedir?"
  id: "Apa itu Damaskus?"
summary:
  ar: دمشق الشام أقدم عاصمة مستمرة في التاريخ؛ عاصمة الأمويين ستة وتسعين سنة وبها الجامع الأموي ومقامات
    آل البيت ومدرسة ابن تيمية وابن عساكر.
  en: "Damascus, al-Sham, is the oldest continuous capital in history. It was the capital of the Umayyads for ninety-six years, and it has the Umayyad Mosque, the shrines of the Ahl al-Bayt, and the school of Ibn Taymiyya and Ibn 'Asakir."
  es: "Damasco, o al-Sham, es la capital continua más antigua de la historia. Fue la capital de los Omeyas durante noventa y seis años y alberga la Mezquita Omeya, los santuarios de Ahl al-Bayt y la escuela de Ibn Taymiyya e Ibn 'Asakir."
  fr: "Damas, al-Sham, est la plus ancienne capitale ayant exercé une activité continue dans l'histoire. Elle fut la capitale des Omeyyades pendant quatre-vingt-seize ans et abrite la mosquée des Omeyyades, les sanctuaires des Ahl al-Bayt et l'école d'Ibn Taymiyya et d'Ibn 'Asakir."
  ur: "دمشق، الشام، تاریخ کا سب سے قدیم مسلسل دارالحکومت ہے۔ یہ چھیانوے سال تک بنو امیہ کا دارالخلافہ رہا اور اس میں اموی مسجد، اہل بیت کے مزارات اور ابن تیمیہ اور ابن عساکر کا مکتب ہے۔"
  tr: "Şam, tarihin en eski kesintisiz olarak kurulmuş başkentidir; doksan altı yıldır Emevi başkentidir ve Emevi Camii, Ehl-Beyt'in türbeleri, İbn Teymiye mezhebleri ve İbn Asakir'in mezhebini barındırır."
  id: "Damaskus adalah ibu kota tertua yang terus berdiri dalam sejarah; ibu kota Umayyah selama sembilan puluh enam tahun, dan di sini terdapat Masjid Umayyah, makam Ahl al-Bayt, sekolah-sekolah Ibn Taymiyyah, dan Ibn Asakir."
question:
  ar: ما دمشق؟
short_answer:
  ar: دمشق الشام أقدم عاصمة مستمرة في التاريخ؛ عاصمة الأمويين ستة وتسعين سنة وبها الجامع الأموي ومقامات
    آل البيت ومدرسة ابن تيمية وابن عساكر.
long_answer:
  ar: '[[place/damascus|دمشق]] من أقدم مدن الدنيا؛ اختارها معاوية عاصمة الخلافة الأموية وبنى فيها الوليد
    جامعها الأموي؛ كانت مركز الجهاد في عهد نور الدين وصلاح الدين ومدرسة العلم في ابن تيمية وابن قدامة
    والنووي وابن كثير. {cite:wikidata}'
