    id: ibn-al-munayyir-intisaf
    standing: main
    stance: { ar: "الختم فعل الله، ولا حادث إلا بقدرته", en: "The seal is God's act; nothing comes to be except by His power", ur: "مہر اللہ کا فعل ہے؛ کوئی حادث اس کی قدرت کے بغیر نہیں" }
    summary:
      ar: "يعدّ [[person/ibn-al-munayyir|ابن المنير]] على تأويل الزمخشري ستة مآخذ، منها: مخالفة دليل الوحدانية الذي يقتضي ألا حادث إلا بقدرة الله، والامتناع من قبول الحق من الحوادث؛ ومخالفة النقل كالنصوص التي تجعل الله خالق كل شيء، والختم في الآية مسند إلى الله نصًّا؛ والغلط في قياس الغائب على الشاهد في القبح؛ والجهل بحقيقة الظلم، إذ هو التصرف في ملك الغير بغير إذنه، وكل شيء ملك لله. {cite:kashshaf-dar-al-marifa-shiha-2009 p.42} ويقابل حجة المعتزلة بأن تمكين العبد من الفواحش مع العلم بأنه يفعلها قبيح في الشاهد أيضًا، فإن قالوا إن لله فيه حكمة استأثر بها قيل لهم: فما المانع أن تكون الأفعال مخلوقة لله ويعاقب العبد عليها لحكمة استأثر بها؟ ويرى أن التفرقة الضرورية بين الحركة الاختيارية والقسرية تخرج المرء من الجبر، ودليل الوحدانية يمنعه من الاعتزال. {cite:kashshaf-dar-al-marifa-shiha-2009 p.42}"
      en: "[[person/ibn-al-munayyir|Ibn al-Munayyir]] counts six faults in al-Zamakhshari's reading, among them: it goes against the proof of God's oneness, which requires that nothing comes to be except by His power, refusing the truth being one of the things that come to be; it goes against the revealed texts that make God the Creator of all things, and the verse itself ascribes the sealing to God explicitly; it wrongly measures the unseen by the seen in what is evil; and it misunderstands injustice, which is disposing of another's property without leave, whereas all things are God's. {cite:kashshaf-dar-al-marifa-shiha-2009 p.42} He turns the Mu'tazili argument back: enabling a servant to commit abominations while knowing he will commit them is also evil among humans; if they say God has a wisdom in it known to Him alone, then why may acts not be created by God and the servant punished for them for a wisdom known to Him alone? The self-evident difference between chosen and forced movement keeps one from determinism, and the proof of oneness keeps one from the Mu'tazili position. {cite:kashshaf-dar-al-marifa-shiha-2009 p.42}"
      ur: "[[person/ibn-al-munayyir|ابن المنیر]] زمخشری کی تاویل پر چھ اعتراضات گنواتے ہیں، جن میں: یہ وحدانیت کی اس دلیل کے خلاف ہے جس کا تقاضا ہے کہ کوئی حادث اللہ کی قدرت کے بغیر نہیں، اور حق قبول کرنے سے انکار بھی حوادث میں سے ہے؛ یہ ان نصوص کے خلاف ہے جو اللہ کو ہر چیز کا خالق قرار دیتی ہیں، اور آیت خود مہر کو صراحتاً اللہ کی طرف منسوب کرتی ہے؛ یہ قبح میں غائب کو حاضر پر قیاس کرنے کی غلطی ہے؛ اور یہ ظلم کی حقیقت سے ناواقفی ہے، کیونکہ ظلم دوسرے کی ملک میں بلا اجازت تصرف ہے اور ہر چیز اللہ کی ملک ہے۔ {cite:kashshaf-dar-al-marifa-shiha-2009 p.42} وہ معتزلہ کی دلیل انہی پر لوٹاتے ہیں: کسی بندے کو یہ جانتے ہوئے بدکاری پر قدرت دینا کہ وہ کرے گا، انسانوں میں بھی برا ہے؛ اگر وہ کہیں کہ اس میں اللہ کی ایک حکمت ہے جو وہی جانتا ہے، تو کہا جائے گا: پھر کیا مانع ہے کہ افعال اللہ کے پیدا کیے ہوئے ہوں اور بندے کو ان پر کسی ایسی حکمت سے سزا ملے جو وہی جانتا ہے؟ اختیاری اور جبری حرکت کا بدیہی فرق آدمی کو جبر سے بچاتا ہے، اور وحدانیت کی دلیل اعتزال سے۔ {cite:kashshaf-dar-al-marifa-shiha-2009 p.42}"
