id: question/who-seals-the-hearts-in-al-baqara-7
class: question
label:
  ar: "من الخاتم على القلوب في البقرة: 7؟ الزمخشري وابن المنير"
  en: "Who seals the hearts in al-Baqara 7? Al-Zamakhshari and Ibn al-Munayyir"
  ur: "البقرہ: 7 میں دلوں پر مہر کون لگاتا ہے؟ زمخشری اور ابن المنیر"
summary:
  ar: "يرى الزمخشري، على مذهب المعتزلة، أن الختم على القلوب مجاز، وأن إسناده إلى الله تنبيه على رسوخ الصفة أو إسناد إلى المسبِّب لأن الخاتم حقيقةً الشيطان أو الكافر، تنزيهًا لله عن فعل القبيح؛ ويرد ابن المنير، على مذهب أهل السنة، بأن الامتناع من قبول الحق حادث لا يقع إلا بقدرة الله، وأن الختم مسند إليه نصًّا."
  en: "Al-Zamakhshari, on the Mu'tazili view, holds that the sealing of hearts is figurative, and that ascribing it to God either signals how entrenched the trait is or ascribes the act to its enabler, the real sealer being Satan or the disbeliever — so as to keep God clear of doing what is evil; Ibn al-Munayyir answers, on the Sunni view, that refusing the truth is an event that occurs only by God's power and that the verse ascribes the sealing to God explicitly."
  ur: "زمخشری، معتزلہ کے مذہب پر، کہتے ہیں کہ دلوں پر مہر مجاز ہے، اور اسے اللہ کی طرف منسوب کرنا یا اس صفت کی پختگی پر تنبیہ ہے یا سبب بننے والے کی طرف نسبت ہے، کیونکہ حقیقت میں مہر لگانے والا شیطان یا کافر ہے — تاکہ اللہ کو برے فعل سے منزہ رکھا جائے؛ ابن المنیر، اہلِ سنت کے مذہب پر، جواب دیتے ہیں کہ حق قبول کرنے سے انکار ایک حادث ہے جو صرف اللہ کی قدرت سے واقع ہوتا ہے، اور آیت میں مہر صراحتاً اللہ کی طرف منسوب ہے۔"
question:
  ar: "هل الختم على القلوب فعل الله حقيقة، أم هو مجاز يُسند إليه والفاعل غيره؟"
  en: "Is the sealing of hearts truly God's act, or a figure of speech ascribing to Him what another does?"
  ur: "کیا دلوں پر مہر حقیقتاً اللہ کا فعل ہے، یا مجاز ہے جس میں دوسرے کا فعل اس کی طرف منسوب ہے؟"
short_answer:
  ar: "ابن المنير ⁦(سني مالكي)⁩: فعل الله، إذ لا حادث إلا بقدرته؛ الزمخشري ⁦(معتزلي)⁩: مجاز، والله منزه عن المنع من قبول الحق."
  en: "Ibn al-Munayyir (Sunni, Maliki): God's act, for nothing comes to be except by His power; al-Zamakhshari (Mu'tazili): a figure of speech, God being above preventing anyone from accepting the truth."
  ur: "ابن المنیر ⁦(سنی مالکی)⁩: اللہ کا فعل، کیونکہ کوئی حادث اس کی قدرت کے بغیر نہیں؛ زمخشری ⁦(معتزلی)⁩: مجاز، اللہ حق قبول کرنے سے روکنے سے منزہ ہے۔"
