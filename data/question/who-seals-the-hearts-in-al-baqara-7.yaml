    summary:
      ar: "يقول [[person/al-zamakhshari|الزمخشري]]: لا ختم ولا تغشية على الحقيقة، وإنما هو من باب المجاز، استعارةً أو تمثيلًا: فقلوبهم لا ينفذ فيها الحق لإعراضهم واستكبارهم كأنها مختوم عليها. {cite:kashshaf-dar-al-marifa-shiha-2009 p.41} ويسأل: لِمَ أسند الختم إلى الله وإسناده إليه يدل على المنع من قبول الحق وهو قبيح، والله يتعالى عن فعل القبيح لعلمه بقبحه وغناه عنه؟ ويجيب بأن الإسناد إليه تنبيه على أن هذه الصفة في رسوخها كالشيء الخلقي، أو هو تمثيل كقولهم «سال به الوادي»، أو إسناد إلى المسبِّب: فالشيطان أو الكافر هو الخاتم في الحقيقة، لكن الله لما أقدره ومكّنه أُسند إليه. {cite:kashshaf-dar-al-marifa-shiha-2009 p.42} {cite:kashshaf-dar-al-marifa-shiha-2009 p.43}"
      en: "[[person/al-zamakhshari|Al-Zamakhshari]]: there is no real seal or covering; it is figurative, by metaphor or by likeness — their hearts do not let the truth in because of their turning away and arrogance, as if sealed. {cite:kashshaf-dar-al-marifa-shiha-2009 p.41} He asks why the sealing is ascribed to God, since ascribing it to Him implies preventing acceptance of the truth, which is evil, and God is far above doing evil, knowing it to be evil and having no need of it. His answer: ascribing it to God signals that the trait is as entrenched as something inborn; or it is a likeness, as one says 'the valley carried him off'; or it is ascription to the enabler — Satan or the disbeliever is the real sealer, but since God gave him the power and the means, the act is ascribed to God. {cite:kashshaf-dar-al-marifa-shiha-2009 p.42} {cite:kashshaf-dar-al-marifa-shiha-2009 p.43}"
      ur: "[[person/al-zamakhshari|زمخشری]]: حقیقت میں نہ مہر ہے نہ پردہ؛ یہ مجاز ہے، استعارہ یا تمثیل کے طور پر — ان کے اعراض اور تکبر کی وجہ سے حق ان کے دلوں میں داخل نہیں ہوتا، گویا ان پر مہر لگی ہو۔ {cite:kashshaf-dar-al-marifa-shiha-2009 p.41} وہ پوچھتے ہیں کہ مہر اللہ کی طرف کیوں منسوب ہوئی، جبکہ اس نسبت کا مطلب حق قبول کرنے سے روکنا ہے جو برا ہے، اور اللہ برے فعل سے بلند ہے کیونکہ وہ اس کی برائی جانتا اور اس سے بے نیاز ہے۔ ان کا جواب: اللہ کی طرف نسبت اس پر تنبیہ ہے کہ یہ صفت فطری چیز کی طرح راسخ ہے؛ یا یہ تمثیل ہے، جیسے کہا جاتا ہے «وادی اسے بہا لے گئی»؛ یا سبب بننے والے کی طرف نسبت ہے — حقیقت میں مہر لگانے والا شیطان یا کافر ہے، مگر چونکہ اللہ نے اسے قدرت اور موقع دیا، فعل اللہ کی طرف منسوب ہوا۔ {cite:kashshaf-dar-al-marifa-shiha-2009 p.42} {cite:kashshaf-dar-al-marifa-shiha-2009 p.43}"
