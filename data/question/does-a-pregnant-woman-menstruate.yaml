  id: ibn-rushd-tafsil
  standing: secondary
  stance:
    ar: 'ابن رشد: يكون مرة حيضاً ومرة دم علة'
    en: 'Ibn Rushd: sometimes menstruation, sometimes the blood of illness'
    ur: 'ابن رشد: کبھی حیض، کبھی بیماری کا خون'
  summary:
    ar: يرى ابن رشد أن الدم يكون مرة دم حيض إذا كانت قوة المرأة وافرة والجنين صغيراً، على ما حكاه بقراط وجالينوس وسائر الأطباء، ومرة دم علة لضعف الجنين ومرضه التابع لضعفها، وهو في الأكثر دم علة.
    en: Ibn Rushd holds that it is sometimes menstrual blood, when the woman's strength is ample and the foetus small, as Hippocrates, Galen and other physicians report, and sometimes the blood of illness from weakness of the foetus following her own weakness - most often the latter.
    ur: ابن رشد کے نزدیک یہ کبھی حیض کا خون ہوتا ہے جب عورت کی قوت وافر اور جنین چھوٹا ہو، جیسا کہ بقراط، جالینوس اور دوسرے اطبا نے بیان کیا، اور کبھی جنین کی کمزوری اور بیماری کا خون جو ماں کی کمزوری کے تابع ہو — اور زیادہ تر یہی دوسرا ہوتا ہے۔
