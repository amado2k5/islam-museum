id: question/does-a-pregnant-woman-menstruate
class: question
label:
  ar: هل تحيض الحامل؟
  en: Does a pregnant woman menstruate?
  ur: کیا حاملہ عورت کو حیض آتا ہے؟
summary:
  ar: 'مسألة يقول ابن رشد إن الفقهاء اختلفوا فيها قديماً وحديثاً: هل الدم الذي تراه الحامل حيض أم استحاضة؟ فذهب مالك والشافعي في أصح قوليه إلى أن الحامل تحيض، وذهب أبو حنيفة وأحمد والثوري إلى أنها لا تحيض وأن الدم دم فساد وعلة، وأجمعوا على أن ما تراه عند الطلق دم نفاس. ويرد ابن رشد الخلاف إلى عسر الوقوف على ذلك بالتجربة واختلاط الأمرين، مستعيناً بما حكاه بقراط وجالينوس {cite:bidaya-bakri-bayt-al-afkar p. 71} {cite:bidaya-bakri-bayt-al-afkar p. 72}.'
  en: 'A question on which, Ibn Rushd says, jurists have differed of old and of late: is the blood a pregnant woman sees menstruation or irregular bleeding? Malik, and al-Shafi''i in the sounder of his two views, hold that a pregnant woman menstruates; Abu Hanifa, Ahmad and al-Thawri hold that she does not and the blood is that of disorder and illness; all agree that blood seen with labour pains is lochia. Ibn Rushd traces the disagreement to the difficulty of settling it by experience and the mixing of the two cases, drawing on Hippocrates and Galen.'
  ur: 'ابن رشد کہتے ہیں کہ اس مسئلے میں فقہا پہلے بھی اور بعد میں بھی مختلف رہے: حاملہ کو نظر آنے والا خون حیض ہے یا استحاضہ؟ مالک اور شافعی (اپنے زیادہ صحیح قول میں) کے نزدیک حاملہ کو حیض آتا ہے؛ ابو حنیفہ، احمد اور ثوری کے نزدیک نہیں، اور یہ فساد و بیماری کا خون ہے؛ سب کا اتفاق ہے کہ دردِ زہ کے وقت کا خون نفاس ہے۔ ابن رشد اختلاف کو تجربے سے اس کی تعیین کی دشواری اور دونوں صورتوں کے خلط کی طرف لوٹاتے ہیں، اور بقراط و جالینوس سے مدد لیتے ہیں۔'
