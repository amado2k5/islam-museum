    ar: الحامل تحيض
    en: A pregnant woman menstruates
    ur: حاملہ کو حیض آتا ہے
  summary:
    ar: مذهب مالك والشافعي في أصح قوليه وغيرهما؛ ولمالك وأصحابه في انتقال الحامل إذا تمادى بها الدم من الحيض إلى الاستحاضة أقوال يصفها ابن رشد بالمضطربة، منها أن تضعّف أكثر أيام الحيض بعدد أشهر الحمل.
    en: The view of Malik, al-Shafi'i in the sounder of his views, and others; Malik and his followers have views on when a pregnant woman whose bleeding continues passes from menstruation to irregular bleeding that Ibn Rushd calls inconsistent, among them multiplying the maximum days of menstruation by the months of pregnancy.
    ur: مالک، شافعی (زیادہ صحیح قول) اور دوسروں کا مذہب؛ مالک اور ان کے اصحاب کے ہاں اس بارے میں کہ خون جاری رہے تو حاملہ کب حیض سے استحاضہ میں منتقل ہوتی ہے، کئی اقوال ہیں جنہیں ابن رشد مضطرب کہتے ہیں، جن میں حمل کے مہینوں کی تعداد سے حیض کے زیادہ سے زیادہ دن دگنے کرنا شامل ہے۔
