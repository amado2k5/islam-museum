  standing: secondary
  stance: { ar: "الظاهرية ⁦(ابن حزم)⁩: دم الحامل ليس حيضاً ولا نفاساً ولا يمنع شيئاً", en: "Zahiri (Ibn Hazm): a pregnant woman's blood is neither menstruation nor post-natal bleeding and prevents nothing", ur: "ظاہری ⁦(ابن حزم)⁩: حاملہ کا خون نہ حیض ہے نہ نفاس، اور کسی چیز سے نہیں روکتا" }
  summary: { ar: "يقول ابن حزم في «المحلى» إن كل دم تراه الحامل ما لم تضع آخر ولد في بطنها فليس حيضاً ولا نفاساً، لأنها لم تضع حملها بعد، ولا إجماع على أنه حيض أو نفاس، فلا يسقط عنها ما ثبت وجوبه من الصلاة والصوم، ولا ما ثبتت إباحته من الجماع، إلا بنص ثابت.", en: "Ibn Hazm says in al-Muhalla that any blood a pregnant woman sees before she delivers the last child in her womb is neither menstruation nor post-natal bleeding, since she has not yet delivered and there is no consensus that it is either; so what is established as obligatory for her, prayer and fasting, and what is established as permitted, intercourse, does not lapse without a firm text.", ur: "ابن حزم «المحلی» میں کہتے ہیں کہ حاملہ اپنے پیٹ کا آخری بچہ جننے سے پہلے جو خون دیکھے وہ نہ حیض ہے نہ نفاس، کیونکہ اس نے ابھی حمل نہیں جنا اور اس کے حیض یا نفاس ہونے پر اجماع نہیں؛ اس لیے جو چیز اس پر واجب ثابت ہے یعنی نماز اور روزہ، اور جو مباح ثابت ہے یعنی جماع، وہ کسی ثابت نص کے بغیر ساقط نہیں ہوتی۔" }
