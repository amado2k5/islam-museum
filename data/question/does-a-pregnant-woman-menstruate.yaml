question:
  ar: هل يأخذ الدم الذي تراه الحامل أحكام الحيض؟
  en: Does the blood a pregnant woman sees take the rulings of menstruation?
  ur: کیا حاملہ کو نظر آنے والا خون حیض کے احکام رکھتا ہے؟
issue:
  ar: 'تكييف الدم الذي تراه الحامل: حيض أم دم علة.'
  en: 'How to classify the blood a pregnant woman sees: menstruation or the blood of illness.'
  ur: 'حاملہ کے خون کی نوعیت: حیض یا بیماری کا خون۔'
short_answer:
  ar: عند مالك والشافعي في أصح قوليه هو حيض، وعند أبي حنيفة وأحمد والثوري ليس بحيض، بحسب ما يحكيه ابن رشد.
  en: For Malik and al-Shafi'i (sounder view) it is menstruation; for Abu Hanifa, Ahmad and al-Thawri it is not, as Ibn Rushd reports.
  ur: ابن رشد کے بیان کے مطابق مالک اور شافعی (زیادہ صحیح قول) کے نزدیک حیض ہے؛ ابو حنیفہ، احمد اور ثوری کے نزدیک نہیں۔
