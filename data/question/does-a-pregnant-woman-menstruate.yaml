    ar: الحامل لا تحيض، والدم دم فساد وعلة
    en: A pregnant woman does not menstruate; the blood is that of disorder
    ur: حاملہ کو حیض نہیں آتا، یہ فساد کا خون ہے
  summary:
    ar: مذهب أبي حنيفة وأحمد والثوري وغيرهم، إلا أن يصيبها الطلق فيكون نفاساً بالإجماع.
    en: The view of Abu Hanifa, Ahmad, al-Thawri and others, except when labour begins, when by consensus it is lochia.
    ur: ابو حنیفہ، احمد، ثوری وغیرہ کا مذہب، سوائے اس کے کہ دردِ زہ شروع ہو جائے تو بالاجماع نفاس ہے۔
