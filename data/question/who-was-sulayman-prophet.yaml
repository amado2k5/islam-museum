short_answer:
  ar: سليمان بن داود نبي ملك؛ سخر الله له الريح والجن وعلمه منطق الطير وحكم مملكة عظيمة وبنى بيت المقدس.
long_answer:
  ar: '[[person/sulayman|سليمان]] وريث داود نبوة وملكًا؛ سخر له الله الريح تجري بأمره والجن يعملون له
    وعلمه منطق الطير؛ قصته مع ملكة سبأ والنمل والحكم بين المرأتين في القرآن؛ مات قائمًا على عصاه فما علمت
    به الجن حتى أكلتها الأرضة. {cite:wikidata}'
