id: question/who-was-sulayman-prophet
class: question
label:
  ar: من كان سليمان؟
  en: Who was Sulayman?
  es: "¿Quién era Sulayman?"
  fr: "Qui était Sulayman ?"
  ur: "سلیمان کون تھا؟"
  tr: "Süleyman kimdi?"
  id: "Siapakah Salomo?"
summary:
  ar: سليمان بن داود نبي ملك؛ سخر الله له الريح والجن وعلمه منطق الطير وحكم مملكة عظيمة وبنى بيت المقدس.
  en: "Sulayman son of Dawud, a prophet and king; God subjected the wind and the jinn to him, taught him the speech of birds, gave him a great kingdom to rule, and he built Bayt al-Maqdis."
  es: "Sulayman, hijo de Dawud, fue profeta y rey; Dios sometió al viento y a los genios a su dominio, le enseñó el lenguaje de los pájaros, le dio un gran reino para gobernar y construyó Bayt al-Maqdis."
  fr: "Sulayman, fils de Dawud, prophète et roi; Dieu lui soumit le vent et les djinns, lui enseigna le langage des oiseaux, lui donna un grand royaume à gouverner et il construisit Bayt al-Maqdis."
  ur: "سلیمان بن داؤد، ایک نبی اور بادشاہ؛ خدا نے ہوا اور جنات کو اس کے تابع کر دیا، اسے پرندوں کی بولی سکھائی، اسے حکومت کرنے کے لیے ایک عظیم سلطنت عطا کی، اور اس نے بیت المقدس کی تعمیر کی۔"
  tr: "Davut'un oğlu Süleyman krallık peygamberiydi; Tanrı ona rüzgarı ve cinleri boyun eğdirdi, kuşların dilini öğretti, büyük bir krallığa hükmetti ve Kudüs'ü inşa etti."
  id: "Salomo putra Daud adalah nabi kerajaan; Allah menundukkan angin dan jin kepadanya, mengajarinya bahasa burung, memerintah kerajaan besar, dan membangun Yerusalem."
question:
  ar: من كان سليمان؟
short_answer:
  ar: سليمان بن داود نبي ملك؛ سخر الله له الريح والجن وعلمه منطق الطير وحكم مملكة عظيمة وبنى بيت المقدس.
long_answer:
  ar: '[[person/sulayman|سليمان]] وريث داود نبوة وملكًا؛ سخر له الله الريح تجري بأمره والجن يعملون له
    وعلمه منطق الطير؛ قصته مع ملكة سبأ والنمل والحكم بين المرأتين في القرآن؛ مات قائمًا على عصاه فما علمت
    به الجن حتى أكلتها الأرضة. {cite:wikidata}'
