id: question/what-is-taraweeh
class: question
label:
  ar: "ما التراويح؟"
  en: What is taraweeh?
  es: "¿Qué es el taraweeh?"
  fr: "Qu'est-ce que le taraweeh ?"
  ur: "تراویح کیا ہے؟"
  tr: "Taraweeh nedir?"
  id: "Apa itu Taraweeh?"
summary:
  ar: "التراويح قيام ليلة رمضان بعد العشاء في جماعة، وهي سنة مؤكدة عند أهل السنة تشتد في العشر الأواخر."
  en: Taraweeh is the congregational night prayer of Ramadan, performed after isha. According to Ahl al-Sunna it is a confirmed sunna, and it intensifies in the last ten nights.
  es: "Taraweeh es la oración nocturna en congregación del Ramadán, que se realiza después de Isha. Según Ahl al-Sunna, es una sunna confirmada y se intensifica en las últimas diez noches."
  fr: "Tarawih est la prière nocturne collective du Ramadan, accomplie après la prière d'Isha. Selon les Ahl al-Sunna, il s'agit d'une sunna confirmée, dont l'importance est accrue durant les dix dernières nuits."
  ur: "تراویح رمضان کی رات کی اجتماعی نماز ہے جو عشاء کے بعد ادا کی جاتی ہے۔ اہل سنت کے نزدیک یہ ثابت سنت ہے اور آخری عشرہ میں اس میں شدت آتی ہے۔"
  tr: "Teravih, cemaatte İşa'dan sonra Ramazan gecesi namazıdır; Sünniler arasında onaylanmış bir sünnettir ve son on gece boyunca daha da yoğunlaşır."
  id: "Taraweeh adalah shalat malam Ramadan setelah Isha dalam jamaah, yang merupakan Sunnah yang dikonfirmasi di antara umat Sunni dan diperkuat selama sepuluh malam terakhir."
