label:
  ar: "ما التراويح؟"
  en: What is taraweeh?
summary:
  ar: "التراويح قيام ليلة رمضان بعد العشاء في جماعة، وهي سنة مؤكدة عند أهل السنة تشتد في العشر الأواخر."
  en: Taraweeh is the congregational night prayer of Ramadan, performed after isha. According to Ahl al-Sunna it is a confirmed sunna, and it intensifies in the last ten nights.
