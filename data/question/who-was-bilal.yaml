label:
  ar: من كان بلال بن رباح؟
  en: Who was Bilal ibn Rabah?
  es: "¿Quién fue Bilal ibn Rabah?"
  fr: "Qui était Bilal ibn Rabah ?"
  ur: "بلال بن رباح کون تھے؟"
summary:
  ar: بلال بن رباح حبشي مسلم أعتقه أبو بكر من العذاب؛ أول مؤذن في الإسلام ومن أحب الصحابة إلى النبي.
  en: "Bilal ibn Rabah was an Abyssinian Muslim whom Abu Bakr freed from torment; the first muezzin in Islam and one of the Companions most beloved to the Prophet."
  es: "Bilal ibn Rabah fue un musulmán abisinio a quien Abu Bakr liberó del tormento; fue el primer muecín del Islam y uno de los Compañeros más queridos por el Profeta."
  fr: "Bilal ibn Rabah était un musulman abyssinien qu'Abu Bakr a libéré du châtiment; le premier muezzin de l'islam et l'un des Compagnons les plus chers au Prophète."
  ur: "بلال بن رباح ایک حبشی مسلمان تھے جنہیں ابوبکر نے عذاب سے آزاد کیا تھا۔ اسلام میں سب سے پہلے مؤذن اور نبی کو سب سے زیادہ محبوب صحابہ میں سے ایک۔"
question:
  ar: من كان بلال بن رباح؟
short_answer:
  ar: بلال بن رباح حبشي مسلم أعتقه أبو بكر من العذاب؛ أول مؤذن في الإسلام ومن أحب الصحابة إلى النبي.
long_answer:
  ar: '[[person/bilal-ibn-rabah|بلال بن رباح]] عبد حبشي عُذّب في مكة ليثنيه عن إسلامه فيقول أحد أحد، فأعتقه
    أبو بكر. اختاره النبي مؤذنًا أول للإسلام وظل معه حتى وفاته؛ من رموز الأذان والمساواة في الإسلام. {cite:wikidata}'
