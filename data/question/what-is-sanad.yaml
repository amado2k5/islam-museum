question:
  ar: ما السند والإسناد؟
short_answer:
  ar: السند هو سلسلة رواة الحديث إلى النبي؛ بها بنى المسلمون علم تصحيح الآثار وهو فريد في تاريخ النقل
    البشري.
long_answer:
  ar: السند هو سلسلة الرواة التي تنقل الحديث من راويه إلى رسول الله؛ فرّعت عليه علوم الرجال والجرح والتعديل
    والعلل. يعد الإسناد من خصائص الأمة فحصت به الأخبار صدقًا وكذبًا على نحو لا مثيل له في الحضارات. {cite:wikidata}
