question:
  ar: ما سلطنة دلهي؟
short_answer:
  ar: سلطنة دلهي (1206–1526) ممالك مسلمة متعاقبة في شمال الهند؛ أدخلت الإسلام دولةً إلى الهند وأقامت العمارة
    السلطانية وقوطوب منار.
long_answer:
  ar: سلطنة دلهي أسسها قطب الدين أيبك مملوك محمد الغوري 1206؛ تعاقبت عليها ممالك المماليك والخلجية والطغلقية
    والسيدية واللودية حتى بابر المغولي 1526؛ في عهدها بنيت منارة قطب وانتشر الإسلام في شمال الهند وصار
    الفارسي لسان الدواوين. {cite:wikidata}
