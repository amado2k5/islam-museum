id: question/what-was-the-delhi-sultanate
class: question
label:
  ar: ما سلطنة دلهي؟
  en: What was the Delhi Sultanate?
  es: "¿Qué era el Sultanato de Delhi?"
  fr: "Qu'était-ce que le sultanat de Delhi ?"
  ur: "دہلی کی سلطنت کیا تھی؟"
  tr: "Delhi Sultanlığı nedir?"
  id: "Apa itu Kesultanan Delhi?"
summary:
  ar: سلطنة دلهي (1206–1526) ممالك مسلمة متعاقبة في شمال الهند؛ أدخلت الإسلام دولةً إلى الهند وأقامت العمارة
    السلطانية وقوطوب منار.
  en: "The Delhi Sultanate (1206-1526), a succession of Muslim kingdoms in northern India; it brought Islam into India as a state power and built sultanate architecture, including the Qutb Minar."
  es: "El Sultanato de Delhi (1206-1526), una sucesión de reinos musulmanes en el norte de la India, introdujo el Islam en la India como poder estatal y construyó arquitectura sultanatal, incluido el Qutb Minar."
  fr: "Le sultanat de Delhi (1206-1526), une succession de royaumes musulmans dans le nord de l'Inde; il a introduit l'islam en Inde en tant que puissance étatique et a construit une architecture de sultanat, dont le Qutb Minar."
  ur: "دہلی سلطنت (1206-1526)، شمالی ہندوستان میں مسلم سلطنتوں کی جانشینی؛ اس نے اسلام کو ایک ریاستی طاقت کے طور پر ہندوستان میں لایا اور قطب مینار سمیت سلطانی فن تعمیر کی تعمیر کی۔"
  tr: "Delhi Sultanlığı (1206–1526), kuzey Hindistan'da ardışık Müslüman krallıklardı; İslam Hindistan'a bir devlet getirdi ve Sultanlık ile Minar Kutbu'nu kurdu."
  id: "Kesultanan Delhi (1206–1526) adalah kerajaan-kerajaan Muslim berturut-turut di India utara; Islam memperkenalkan sebuah negara ke India dan mendirikan Kesultanan serta Kutub Minar."
question:
  ar: ما سلطنة دلهي؟
short_answer:
  ar: سلطنة دلهي (1206–1526) ممالك مسلمة متعاقبة في شمال الهند؛ أدخلت الإسلام دولةً إلى الهند وأقامت العمارة
    السلطانية وقوطوب منار.
long_answer:
  ar: سلطنة دلهي أسسها قطب الدين أيبك مملوك محمد الغوري 1206؛ تعاقبت عليها ممالك المماليك والخلجية والطغلقية
    والسيدية واللودية حتى بابر المغولي 1526؛ في عهدها بنيت منارة قطب وانتشر الإسلام في شمال الهند وصار
    الفارسي لسان الدواوين. {cite:wikidata}
