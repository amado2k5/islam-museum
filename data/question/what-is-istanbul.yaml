id: question/what-is-istanbul
class: question
label:
  ar: ما إسطنبول والقسطنطينية؟
  en: What are Istanbul and Constantinople?
  es: "¿Qué son Estambul y Constantinopla?"
  fr: "Que sont Istanbul et Constantinople ?"
  ur: "استنبول اور قسطنطنیہ کیا ہیں؟"
  tr: "İstanbul ve Konstantinopolis nedir?"
  id: "Apa itu Istanbul dan Konstantinopel?"
summary:
  ar: إسطنبول القسطنطينية قبل الفتح؛ فتحها محمد الثاني 1453 فصارت عاصمة العثمانيين خمسة قرون وبها آيا
    صوفيا والسليمانية والتوب قابي.
  en: "Istanbul is Constantinople before its conquest. Mehmed II conquered it in 1453, and it served as the Ottoman capital for five centuries. It is home to Hagia Sophia, the Süleymaniye and Topkapı."
  es: "Estambul era como Constantinopla antes de su conquista. Mehmed II la conquistó en 1453 y sirvió como capital otomana durante cinco siglos. Alberga Santa Sofía, el Palacio de Süleymaniye y el Palacio de Topkapi."
  fr: "Istanbul s'appelait Constantinople avant sa conquête. Mehmed II la conquit en 1453 et elle fut la capitale ottomane pendant cinq siècles. Elle abrite la basilique Sainte-Sophie, le palais Süleymaniye et le palais de Topkapı."
  ur: "استنبول فتح سے پہلے قسطنطنیہ ہے۔ محمد دوم نے اسے 1453 میں فتح کیا، اور اس نے پانچ صدیوں تک عثمانی دارالحکومت کے طور پر کام کیا۔ یہ ہاگیا صوفیہ، سلیمانی اور توپکاپی کا گھر ہے۔"
  tr: "İstanbul, fetihten önce Konstantinopolis'ti; 1453'te II. Mehmed tarafından fethedildi ve beş yüzyıl boyunca Osmanlıların başkenti oldu ve Ayasofya, Süleymanya ile Topkapı'yı kapsıyordu."
  id: "Istanbul adalah Konstantinopel sebelum penaklukan; kota ini ditaklukkan oleh Mehmed II pada tahun 1453, menjadikannya ibu kota Ottoman selama lima abad dan mencakup Hagia Sophia, Suleymania, dan Topkapi."
question:
  ar: ما إسطنبول والقسطنطينية؟
short_answer:
  ar: إسطنبول القسطنطينية قبل الفتح؛ فتحها محمد الثاني 1453 فصارت عاصمة العثمانيين خمسة قرون وبها آيا
    صوفيا والسليمانية والتوب قابي.
long_answer:
  ar: '[[place/istanbul|إسطنبول]] القسطنطينية الرومية التي بشّر النبي بفتحها؛ حقق ذلك محمد الفاتح 1453
    فجعلها عاصمة الخلافة العثمانية؛ مدينة الجوامع العظمى والبازارات والبوسفور وآخر مقر للخلافة حتى 1924.
    {cite:wikidata}'
