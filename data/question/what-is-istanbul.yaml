    صوفيا والسليمانية والتوب قابي.
long_answer:
  ar: '[[place/istanbul|إسطنبول]] القسطنطينية الرومية التي بشّر النبي بفتحها؛ حقق ذلك محمد الفاتح 1453
    فجعلها عاصمة الخلافة العثمانية؛ مدينة الجوامع العظمى والبازارات والبوسفور وآخر مقر للخلافة حتى 1924.
