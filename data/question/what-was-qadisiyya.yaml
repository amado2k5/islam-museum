summary:
  ar: القادسية 15هـ/636م؛ هزم فيها سعد بن أبي وقاص رستم الفرس وفتح المدائن وانتهت بها الدولة الساسانية.
  en: "Qadisiyya, 15 AH / 636 CE; Sa'd ibn Abi Waqqas defeated Rustam of Persia there and conquered al-Mada'in, and the Sasanian state came to an end with it."
  es: "Qadisiyya, 15 AH / 636 d. C.; Sa'd ibn Abi Waqqas derrotó allí a Rustam de Persia y conquistó al-Mada'in, y con ello llegó a su fin el estado sasánida."
  fr: "Qadisiyya, 15 AH / 636 CE; Sa'd ibn Abi Waqqas y vainquit Rustam de Perse et conquit al-Mada'in, et l'État sassanide prit fin avec cela."
  ur: "قادسیہ، 15ھ / 636 عیسوی؛ سعد ابن ابی وقاص نے وہاں فارس کے رستم کو شکست دے کر المدائن کو فتح کیا اور اس کے ساتھ ہی ساسانی ریاست کا خاتمہ ہوا۔"
question:
  ar: ما معركة القادسية؟
short_answer:
  ar: القادسية 15هـ/636م؛ هزم فيها سعد بن أبي وقاص رستم الفرس وفتح المدائن وانتهت بها الدولة الساسانية.
long_answer:
  ar: '[[event/battle-of-al-qadisiyya|القادسية]] معركة العراق الكبرى؛ قادها سعد بن أبي وقاص ضد رستم فرخزاد
    وفيها الفيلة والأيام الأربعة؛ انتصر المسلمون ودخلوا المدائن عاصمة كسرى وانهارت الدولة الساسانية بعد
    نهاوند. {cite:wikidata}'
