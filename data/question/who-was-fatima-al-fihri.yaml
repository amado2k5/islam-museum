id: question/who-was-fatima-al-fihri
class: question
label:
  ar: من كانت فاطمة الفهري؟
  en: Who was Fatima al-Fihri?
  es: "¿Quién fue Fátima al-Fihri?"
  fr: "Qui était Fatima al-Fihri ?"
  ur: "فاطمہ الفہری کون تھیں؟"
  tr: "Fatima Al-Fahri kimdi?"
  id: "Siapakah Fatima Al-Fahri?"
summary:
  ar: فاطمة الفهري امرأة من قيروان هاجرت إلى فاس وأوقفت أموالها على بناء جامع القرويين نحو 859؛ يوصف بأنه
    أقدم جامعة مستمرة في العالم.
  en: "Fatima al-Fihri was a woman from Qayrawan who migrated to Fez and devoted her wealth to building the al-Qarawiyyin mosque around 859; it is described as the oldest continuously operating university in the world."
  es: "Fatima al-Fihri fue una mujer de Qayrawan que emigró a Fez y dedicó su fortuna a la construcción de la mezquita al-Qarawiyyin alrededor del año 859; se la describe como la universidad en funcionamiento continuo más antigua del mundo."
  fr: "Fatima al-Fihri était une femme originaire de Qayrawan qui a émigré à Fès et a consacré sa fortune à la construction de la mosquée al-Qarawiyyin vers 859; elle est décrite comme la plus ancienne université au monde encore en activité."
  ur: "فاطمہ الفہری قیروان سے تعلق رکھنے والی ایک خاتون تھیں جنہوں نے 859 کے آس پاس فیز کی طرف ہجرت کی اور اپنی دولت القرویین مسجد کی تعمیر کے لیے وقف کر دی۔ اسے دنیا کی سب سے قدیم مسلسل کام کرنے والی یونیورسٹی کے طور پر بیان کیا جاتا ہے۔"
  tr: "Fatima el-Fihri, Kairouan'dan bir kadındı; Fes'e göç etmiş ve yaklaşık 859 yılında Karawiyyin Camii'nin inşası için fon sağlamıştır; dünyanın en eski kesintisiz üniversitesi olarak tanımlanır."
  id: "Fatima al-Fihri adalah seorang wanita dari Kairouan yang bermigrasi ke Fez dan menginvestasikan dana untuk pembangunan Masjid Qarawiyyin sekitar tahun 859; masjid ini digambarkan sebagai universitas tertua yang berkelanjutan di dunia."
question:
  ar: من كانت فاطمة الفهري؟
short_answer:
  ar: فاطمة الفهري امرأة من قيروان هاجرت إلى فاس وأوقفت أموالها على بناء جامع القرويين نحو 859؛ يوصف بأنه
    أقدم جامعة مستمرة في العالم.
long_answer:
  ar: '[[person/fatima-al-fihri|فاطمة الفهري]] هاجرت مع أهلها من القيروان إلى فاس، ولما ورثت مالًا كثيرًا
    بنت جامع القرويين نحو 245هـ/859م وأوقفت عليه أملاكها. صار الجامع مركز العلم في المغرب ويُذكر في مصادر
    غربية كأقدم مؤسسة تعليمية مستمرة العمل في العالم. {cite:wikidata}'
