long_answer:
  ar: '[[person/fatima-al-fihri|فاطمة الفهري]] هاجرت مع أهلها من القيروان إلى فاس، ولما ورثت مالًا كثيرًا
    بنت جامع القرويين نحو 245هـ/859م وأوقفت عليه أملاكها. صار الجامع مركز العلم في المغرب ويُذكر في مصادر
    غربية كأقدم مؤسسة تعليمية مستمرة العمل في العالم. {cite:wikidata}'
