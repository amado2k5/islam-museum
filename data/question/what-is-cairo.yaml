long_answer:
  ar: '[[place/cairo|القاهرة]] أسسها الفاطميون 969 شمال الفسطاط عاصمة لخلافتهم؛ فيها الأزهر من أقدم جامعات
    العالم المستمرة وقلعة الجبل وشوارع المماليك بمساجدها وأسواقها؛ صارت بعد بغداد عاصمة العالم الإسلامي
    إلى اليوم. {cite:wikidata}'
