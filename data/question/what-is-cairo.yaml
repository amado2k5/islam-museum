label:
  ar: ما القاهرة؟
  en: What is Cairo?
  es: "¿Qué es El Cairo?"
  fr: "Qu'est-ce que le Caire ?"
  ur: "قاہرہ کیا ہے؟"
  tr: "Kahire nedir?"
  id: "Apa itu Kairo?"
summary:
  ar: القاهرة المعزية قاهرة المعز لدين الله الفاطمي؛ أسسها جوهر 969 وبها الأزهر أعظم جامعات الإسلام الباقية
    وقلعة صلاح الدين ومتحف العمارة المملوكية.
  en: "Al-Qahira al-Mu'izziyya is the city of al-Mu'izz li-Din Allah al-Fatimi. Jawhar founded it in 969. It has al-Azhar, the greatest surviving university of Islam, the Citadel of Salah al-Din, and a museum of Mamluk architecture."
  es: "Al-Qahira al-Mu'izziyya es la ciudad de al-Mu'izz li-Din Allah al-Fatimi. Jawhar lo fundó en 969. Tiene al-Azhar, la mayor universidad del Islam que se conserva, la ciudadela de Salah al-Din y un museo de arquitectura mameluca."
  fr: "Al-Qahira al-Mu'izziyya est la ville d'al-Mu'izz li-Din Allah al-Fatimi. Jawhar l'a fondée en 969. Elle abrite al-Azhar, la plus grande université islamique survivante, la citadelle de Salah al-Din et un musée d'architecture mamelouke."
  ur: "القاہرہ المعزیہ المعز ل الدین اللہ فاطمی کا شہر ہے۔ جوہر نے 969 میں اس کی بنیاد رکھی۔ اس میں الازہر، اسلام کی سب سے بڑی زندہ بچ جانے والی یونیورسٹی، صلاح الدین کا قلعہ، اور مملوک فن تعمیر کا ایک میوزیم ہے۔"
  tr: "Kahire, el-Muizz li-Din Allah el-Fatimi'nin fatihidir; 969 yılında Jawhar'da kurulmuş olup, hayatta kalan en büyük İslami üniversite, Salah-al-Din Kalesi ve Memlük Mimarlık Müzesi'ni barındırır."
  id: "Kairo adalah penakluk al-Mu'izz li-Din Allah al-Fatimi; kota ini didirikan di Jawhar pada tahun 969 dan berisi Al-Azhar, universitas Islam terbesar yang masih ada, Benteng Salah al-Din, serta Museum Arsitektur Mamluk."
