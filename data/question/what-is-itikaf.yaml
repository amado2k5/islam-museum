id: question/what-is-itikaf
class: question
label:
  ar: "ما الاعتكاف؟"
  en: What is itikaf?
  es: "¿Qué es el itikaf?"
  fr: "Qu'est-ce que l'itikaf ?"
  ur: "اعتکاف کیا ہے؟"
summary:
  ar: "الاعتكاف لبث في المسجد للعبادة والانقطاع عن الشواغل، ويشتهر في العشر الأواخر من رمضان."
  en: "I'tikaf is staying in the mosque for worship and withdrawal from preoccupations. It is best known in the last ten nights of Ramadan."
  es: "El itikaf consiste en permanecer en la mezquita para orar y alejarse de las preocupaciones. Se practica principalmente durante las últimas diez noches de Ramadán."
  fr: "L'itikaf consiste à séjourner à la mosquée pour prier et se retirer du monde. Cette pratique est surtout connue durant les dix dernières nuits du Ramadan."
  ur: "اعتکاف مسجد میں عبادت اور مشغولیات سے دستبردار ہونے کو کہتے ہیں۔ رمضان المبارک کے آخری عشرہ کی راتوں میں سب سے زیادہ جانا جاتا ہے۔"
wings: []
question:
  ar: "ما الاعتكاف؟"
short_answer:
  ar: "الاعتكاف لبث في المسجد للعبادة والانقطاع عن الشواغل، ويشتهر في العشر الأواخر من رمضان."
long_answer:
  ar: |
    ورد الاعتكاف في سورة البقرة، وكان النبي يعتكف العشر الأواخر حتى توفي {cite:tanzil-quran} {cite:sahih-al-bukhari}.
    ويعرض مدخل [[practice/itikaf|الاعتكاف]] هيئته ووقته، ويرتبط ب[[practice/sawm-ramadan|الصوم]] وبشهر رمضان.

