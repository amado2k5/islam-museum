    stance: { ar: "بدأ طلب الفقه وهو ابن ست وعشرين" }
    summary: { ar: "ذكر المؤرخون أنه كان ابن ست وعشرين حين ركع بعد العصر في المسجد بعد صلاة جنازة فنُبّه أنه ليس وقت صلاة، فحزن وسأل أستاذه أن يدله على دار الفقيه أبي عبد الله ابن دحون، فقرأ عليه الموطأ وعلى غيره نحواً من ثلاثة أعوام ثم بدأ المناظرة؛ وتروى قصة أخرى أنه اعترض في درس على جواب فقهي فقيل له: هذا العلم ليس من منتحلاتك، فعكف على الطلب." }
    evidence: [{ ref: source/muhalla-dar-ibn-hazm-2016-v1, note: { ar: "بنقل محققي المحلى، PDF ص 25–26" } }]
