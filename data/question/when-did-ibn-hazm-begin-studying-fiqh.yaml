id: question/when-did-ibn-hazm-begin-studying-fiqh
class: question
label: { ar: "متى بدأ ابن حزم طلب الفقه؟", en: "When did Ibn Hazm begin to study law?", ur: "ابن حزم نے فقہ کی طلب کب شروع کی؟" }
summary:
  ar: "تروي كتب التراجم قصة أن ابن حزم دخل مسجداً بعد صلاة جنازة فركع بعد العصر فقيل له اجلس ليس ذا وقت صلاة، وكان ابن ست وعشرين سنة، فقصد الفقيه ابن دحون فقرأ عليه الموطأ؛ ويرد محمد أبو زهرة ومحمد المنوني أن تكون هذه السن صحيحة، ويرجح أبو زهرة أنها ست عشرة وأن في الرواية تصحيفاً. {cite:muhalla-dar-ibn-hazm-2016-v1 p.25} {cite:muhalla-dar-ibn-hazm-2016-v1 p.26} {cite:muhalla-dar-ibn-hazm-2016-v1 p.27}"
  en: "Biographers tell how Ibn Hazm, after a funeral prayer, prayed two rak'as in a mosque after the afternoon prayer and was told to sit, it not being a time for prayer, when he was twenty-six; he then went to the jurist Ibn Dahhun and read the Muwatta' with him. Muhammad Abu Zahra and Muhammad al-Manuni reject that age, Abu Zahra suggesting sixteen and a copyist's slip."
  ur: "تذکرہ نگار بیان کرتے ہیں کہ ابن حزم نے ایک جنازے کے بعد مسجد میں عصر کے بعد نفل پڑھنے شروع کیے تو ان سے کہا گیا بیٹھ جاؤ، یہ نماز کا وقت نہیں، اور اس وقت وہ چھبیس سال کے تھے؛ پھر وہ فقیہ ابن دحون کے پاس گئے اور ان سے مؤطا پڑھی۔ محمد ابو زہرہ اور محمد منونی اس عمر کو رد کرتے ہیں، اور ابو زہرہ سولہ سال کو ترجیح دیتے اور نقل میں تصحیف کا امکان بتاتے ہیں۔"
question: { ar: "هل بدأ ابن حزم طلب الفقه في السادسة والعشرين؟", en: "Did Ibn Hazm begin to study law at twenty-six?" }
issue: { ar: "رواية تأخر ابن حزم في طلب الفقه إلى السادسة والعشرين، ومدى اتفاقها مع ما ثبت من سماعه المبكر للحديث." }
short_answer:
  ar: "الرواية المشهورة تجعله ابن ست وعشرين؛ ويردها أبو زهرة والمنوني بحجج من سيرته، ويرى أبو زهرة أنها ست عشرة؛ ويذكر محققو «المحلى» أن الذهبي جعل أول سماعه سنة 399هـ."
  en: "The well-known report gives twenty-six; Abu Zahra and al-Manuni reject it on grounds from his life, Abu Zahra proposing sixteen; the editors of al-Muhalla note that al-Dhahabi dates his first hearing to 399 AH."
perspectives:
