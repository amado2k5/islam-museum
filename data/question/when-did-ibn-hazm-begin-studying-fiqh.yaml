    id: abu-zahra-sixteen
    standing: secondary
    stance: { ar: "السن لا تصح، والأقرب أنها ست عشرة" }
    summary: { ar: "يرى محمد أبو زهرة أن هذه السن لا تتفق مع السياق التاريخي، لأنه ثبت أنه تلقى الحديث عن أحمد بن الجسور، وأنه كان يُذهب به إلى مجالس كبار العلماء، ومن بلغ السادسة والعشرين ومرتبة الوزارة لا يُذكر له مربٍّ يرشده؛ فالأقرب أن يكون في السادسة عشرة وأن في الكلام تصحيفاً من النساخ؛ ووافقه محمد المنوني في «شيوخ ابن حزم» بحجج خمس، ويذكر المحققون أن الذهبي جعل أول سماعه سنة 399هـ، فيكون بين الخامسة عشرة والسادسة عشرة." }
    evidence: [{ ref: source/muhalla-dar-ibn-hazm-2016-v1, note: { ar: "PDF ص 26–27" } }]
