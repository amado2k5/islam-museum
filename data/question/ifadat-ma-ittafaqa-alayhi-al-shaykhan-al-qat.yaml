id: question/ifadat-ma-ittafaqa-alayhi-al-shaykhan-al-qat
class: question
label:
  ar: "هل يفيد ما اتفق عليه البخاري ومسلم القطع بصحته؟"
  en: "Does what al-Bukhari and Muslim agree on yield certainty of its soundness?"
  es: "¿Acaso la coincidencia entre al-Bukhari y Muslim garantiza su validez?"
  fr: "Ce sur quoi al-Bukhari et Muslim s'accordent-ils permet-il d'avoir la certitude de sa validité ?"
  ur: "کیا بخاری اور مسلم کا اتفاق ہے کہ اس کے صحیح ہونے کا یقین ہے؟"
  tr: "El-Buhari'nin üzerinde anlaştığı ve Müslümanların gerçek olarak kabul ettiği şey geçerli midir?"
  id: "Apakah apa yang disepakati Al-Bukhari dan yang telah disepakati Muslim sebagai otentik itu sah?"
summary:
  ar: "مسألة في علوم الحديث: قرر ابن الصلاح أن ما اتفق عليه الشيخان مقطوع بصحته والعلم اليقيني النظري واقع به، لتلقي الأمة له بالقبول، وذكر أنه كان يميل أولاً إلى القول المخالف؛ وتعقبه النووي بأن المحققين والأكثرين على أنه يفيد الظن ما لم يتواتر، كما ينقل المحقق عتر {cite:muqaddima-ibn-salah-itr p. 28-29}."
  en: "A question in the hadith sciences: Ibn al-Salah held that what the two Shaykhs agree on is certainly sound and yields reasoned certain knowledge, because the community received it with acceptance, and said he had first inclined to the opposite view; al-Nawawi answered that the verifiers and the majority hold it yields probability unless mass-transmitted, as the editor Itr quotes."
  es: "Una cuestión en las ciencias del hadiz: Ibn al-Salah sostenía que aquello en lo que coinciden los dos jeques es ciertamente sólido y produce un conocimiento razonado y cierto, porque la comunidad lo recibió con aceptación, y dijo que inicialmente se había inclinado por la opinión contraria; al-Nawawi respondió que los verificadores y la mayoría sostienen que produce probabilidad a menos que se transmita masivamente, como cita el editor Itr."
  fr: "Une question en sciences du hadith: Ibn al-Salah soutenait que ce sur quoi les deux cheikhs s’accordent est certainement authentique et apporte une connaissance certaine et raisonnée, car la communauté l’a reçu avec acceptation, et disait avoir d’abord penché pour l’avis contraire; al-Nawawi a répondu que les vérificateurs et la majorité considèrent que cela apporte une probabilité, sauf si c’est transmis à grande échelle, comme le cite l’éditeur Itr."
  ur: "علم حدیث میں ایک سوال: ابن الصلاح کا خیال ہے کہ جس چیز پر دونوں شیوخ کا اتفاق ہے وہ یقینی طور پر صحیح ہے اور اس سے کچھ خاص علم حاصل ہوتا ہے، کیونکہ کمیونٹی نے اسے قبولیت کے ساتھ حاصل کیا، اور کہا کہ وہ پہلے مخالف نظریہ کی طرف مائل تھے؛ النووی نے جواب دیا کہ تصدیق کنندگان اور اکثریت کے نزدیک اس کا امکان پیدا ہوتا ہے جب تک کہ بڑے پیمانے پر منتقل نہ کیا جائے جیسا کہ ایڈیٹر Itr کا حوالہ ہے۔"
  tr: "Hadis Bilimlerinde Bir Mesele: İbn al-Salah, iki şeyhin üzerinde anlaştığı şeyin özgünlüğünün kesin olduğunu ve belirli teorik bilgilerin geçerli olduğunu, çünkü ümmetin kabul edeceğini ortaya koydu. Başlangıçta karşıt görüşe eğilimli olduğunu belirtti; el-Nawawi ise doğrulayıcıların ve çoğunluğun, mütevatir (toplu iletim) olmadıkça varsayımı doğruladığına inandığını belirtti; bu, araştırmacı Attar tarafından bildirildiği gibi {atı:mukaddima-ibn-salah-itr s. 28-29} tarafından bildirilmiştir."
  id: "Sebuah Masalah dalam Ilmu Hadis: Ibn al-Salah menetapkan bahwa apa yang disepakati kedua Syaikh pasti akan keasliannya dan bahwa pengetahuan teoretis tertentu valid, seperti yang diterima oleh Umatyah. Ia menyebutkan bahwa awalnya ia cenderung berlawanan; dan al-Nawawi menindaklanjutinya dengan mengatakan bahwa para verifiator dan mayoritas percaya bahwa hal itu mengonfirmasi dugaan kecuali itu adalah mutawatir (transmisi massal), sebagaimana dilaporkan oleh peneliti Attar {cite:muqaddima-ibn-salah-itr hlm. 28-29}."
