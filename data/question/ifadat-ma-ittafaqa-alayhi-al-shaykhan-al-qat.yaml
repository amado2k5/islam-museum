id: question/ifadat-ma-ittafaqa-alayhi-al-shaykhan-al-qat
class: question
label:
  ar: "هل يفيد ما اتفق عليه البخاري ومسلم القطع بصحته؟"
  en: "Does what al-Bukhari and Muslim agree on yield certainty of its soundness?"
summary:
  ar: "مسألة في علوم الحديث: قرر ابن الصلاح أن ما اتفق عليه الشيخان مقطوع بصحته والعلم اليقيني النظري واقع به، لتلقي الأمة له بالقبول، وذكر أنه كان يميل أولاً إلى القول المخالف؛ وتعقبه النووي بأن المحققين والأكثرين على أنه يفيد الظن ما لم يتواتر، كما ينقل المحقق عتر {cite:muqaddima-ibn-salah-itr p. 28-29}."
  en: "A question in the hadith sciences: Ibn al-Salah held that what the two Shaykhs agree on is certainly sound and yields reasoned certain knowledge, because the community received it with acceptance, and said he had first inclined to the opposite view; al-Nawawi answered that the verifiers and the majority hold it yields probability unless mass-transmitted, as the editor Itr quotes."
wings: [ideas, words]
themes: [scripture-and-its-sciences]
question:
  ar: "هل تلقي الأمة للصحيحين بالقبول يرفع أحاديثهما المتفق عليها من الظن إلى القطع؟"
  en: "Does the community's acceptance of the two Sahihs raise their agreed hadith from probability to certainty?"
issue:
  ar: "أخبار الآحاد في الصحيحين: هل تفيد العلم أم الظن؟"
  en: "Single-chain reports in the two Sahihs: do they yield knowledge or probability?"
short_answer:
  ar: "قال ابن الصلاح: هذا القسم جميعه مقطوع بصحته، لأن ظن المعصوم من الخطأ لا يخطئ والأمة في إجماعها معصومة، ويلحق به ما انفرد به أحدهما إلا أحرفاً يسيرة تكلم عليها بعض النقاد كالدارقطني؛ وقال النووي: خالفه المحققون والأكثرون فقالوا يفيد الظن ما لم يتواتر."
  en: "Ibn al-Salah said this whole category is certainly sound, because the probable judgement of one protected from error does not err and the community in its consensus is protected; what only one of the two reports belongs with it, except a few places criticised by critics such as al-Daraqutni. Al-Nawawi said the verifiers and the majority disagreed with him and held that it yields probability unless mass-transmitted."
perspectives:
  - tradition: sunni
    id: sunni-ibn-al-salah-qat
    standing: main
    stance: { ar: "يفيد العلم اليقيني النظري", en: "It yields reasoned certain knowledge" }
    summary:
      ar: "ابن الصلاح: ما اتفق عليه البخاري ومسلم مقطوع بصحته، واتفاق الأمة عليه لازم من ذلك لتلقيها ما اتفقا عليه بالقبول، والإجماع المبني على الاجتهاد حجة مقطوع بها؛ ويقول إنه كان يميل إلى القول الآخر ويحسبه قوياً ثم بان له خلافه."
      en: "Ibn al-Salah: what al-Bukhari and Muslim agree on is certainly sound, and the community's agreement on it follows from its acceptance of what they agreed on; consensus built on independent reasoning is a decisive proof. He says he had inclined to the other view and thought it strong, then saw otherwise."
