  - tradition: sunni
    id: sunni-nawawi-zann
    standing: main
    stance: { ar: "يفيد الظن ما لم يتواتر", en: "It yields probability unless mass-transmitted" }
    summary:
      ar: "النووي في «التقريب» وشرح مسلم، كما ينقله عتر: أحاديث الصحيحين آحاد والآحاد إنما تفيد الظن، ويفترق الصحيحان عن غيرهما في أن ما فيهما صحيح لا يحتاج إلى نظر، ولا يلزم من إجماع الأمة على العمل بما فيهما إجماعهم على القطع بأنه من كلام النبي."
      en: "Al-Nawawi, in al-Taqrib and his commentary on Muslim, as Itr quotes him: the hadith of the two Sahihs are single-chain reports, which yield only probability; the two books differ from others in that what they contain is sound without need of examination, and the community's consensus on acting on them does not entail consensus that it is certainly the Prophet's words."
