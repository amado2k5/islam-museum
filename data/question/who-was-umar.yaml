long_answer:
  ar: '[[person/umar-ibn-al-khattab|عمر بن الخطاب]] أسلم قبل الهجرة بسنين فقوّى به المسلمون. خليفة عشر
    سنين فتحت فيها فارس ومصر والشام والقدس؛ أسس الدواوين والأمصار والتقويم الهجري والقضاء. اغتيل 644 وهو
    أعظم الخلفاء عند أهل السنة بعد أبي بكر. {cite:wikidata}'
