perspectives:
  - tradition: sunni
    id: known-only-to-god
    standing: main
    stance: { ar: "من المتشابه الذي لا يعلمه إلا الله", en: "Among the ambiguous known only to God", ur: "متشابہ جسے صرف اللہ جانتا ہے" }
    summary:
      ar: "القول الأول عند [[person/ibn-al-jawzi|ابن الجوزي]]: أنها من المتشابه الذي لا يعلمه إلا الله؛ وينقل عن أبي بكر الصديق أن لله في كل كتاب سرًّا وسرّه في القرآن أوائل السور، وإلى هذا ذهب [[person/amir-al-shabi|الشعبي]] وأبو صالح وابن زيد. {cite:zad-al-masir-dar-al-kitab-al-arabi-2001-v1 p.25} وبه يأخذ [[person/al-baghawi-al-husayn-ibn-muhammad|البغوي]]، فيؤمن بظاهرها ويكل العلم فيها إلى الله. {cite:tahdhib-tafsir-baghawi-tayba-2009 p.11}"
      en: "[[person/ibn-al-jawzi|Ibn al-Jawzi]]'s first view: they are among the ambiguous known only to God; he cites Abu Bakr al-Siddiq that God has a secret in every book and His secret in the Qur'an is the openings of the suras — the view of [[person/amir-al-shabi|al-Sha'bi]], Abu Salih and Ibn Zayd. {cite:zad-al-masir-dar-al-kitab-al-arabi-2001-v1 p.25} [[person/al-baghawi-al-husayn-ibn-muhammad|Al-Baghawi]] takes this view, believing in them as they stand and leaving their knowledge to God. {cite:tahdhib-tafsir-baghawi-tayba-2009 p.11}"
      ur: "[[person/ibn-al-jawzi|ابن الجوزی]] کا پہلا قول: یہ متشابہ ہیں جنہیں صرف اللہ جانتا ہے؛ وہ ابو بکر صدیق سے نقل کرتے ہیں کہ ہر کتاب میں اللہ کا ایک راز ہے اور قرآن میں اس کا راز سورتوں کے آغاز ہیں — یہ [[person/amir-al-shabi|شعبی]]، ابو صالح اور ابن زید کا قول ہے۔ {cite:zad-al-masir-dar-al-kitab-al-arabi-2001-v1 p.25} [[person/al-baghawi-al-husayn-ibn-muhammad|بغوی]] یہی قول لیتے ہیں، ان کے ظاہر پر ایمان رکھتے اور ان کا علم اللہ کے سپرد کرتے ہیں۔ {cite:tahdhib-tafsir-baghawi-tayba-2009 p.11}"
    holders: [person/amir-al-shabi, person/al-baghawi-al-husayn-ibn-muhammad]
    sources: [source/zad-al-masir-dar-al-kitab-al-arabi-2001-v1, source/tahdhib-tafsir-baghawi-tayba-2009]
  - tradition: sunni
    id: letters-of-names
    standing: secondary
    stance: { ar: "حروف من أسماء الله", en: "Letters of God's names", ur: "اللہ کے ناموں کے حروف" }
    summary:
      ar: "القول الثاني: أنها حروف من أسماء إذا أُلّفت كانت أسماء من أسماء الله؛ وينقل عن [[person/ali-ibn-abi-talib|علي بن أبي طالب]] أنها أسماء مقطعة لو علم الناس تأليفها علموا اسم الله الذي إذا دُعي به أجاب، وعن ابن عباس أن بعضها اسم الرحمن على الهجاء، وإلى نحوه ذهب [[person/abu-al-aliya-al-riyahi|أبو العالية]] و[[person/al-rabi-ibn-anas|الربيع بن أنس]]. {cite:zad-al-masir-dar-al-kitab-al-arabi-2001-v1 p.25}"
      en: "Second view: they are letters of names which, when put together, form names of God; he cites [[person/ali-ibn-abi-talib|Ali ibn Abi Talib]] that they are separated names whose combination, if people knew it, would give the name of God by which prayer is answered, and Ibn Abbas that some of them spell 'al-Rahman'; [[person/abu-al-aliya-al-riyahi|Abu al-Aliya]] and [[person/al-rabi-ibn-anas|al-Rabi' ibn Anas]] held something similar. {cite:zad-al-masir-dar-al-kitab-al-arabi-2001-v1 p.25}"
      ur: "دوسرا قول: یہ ناموں کے حروف ہیں جنہیں جوڑا جائے تو اللہ کے نام بنتے ہیں؛ وہ [[person/ali-ibn-abi-talib|علی بن ابی طالب]] سے نقل کرتے ہیں کہ یہ کٹے ہوئے نام ہیں جن کی ترکیب اگر لوگ جان لیں تو اللہ کا وہ نام جان لیں جس سے دعا قبول ہوتی ہے، اور ابن عباس سے کہ ان میں سے بعض ہجے میں «الرحمن» ہیں؛ [[person/abu-al-aliya-al-riyahi|ابو العالیہ]] اور [[person/al-rabi-ibn-anas|ربیع بن انس]] کا قول بھی اسی کے قریب ہے۔ {cite:zad-al-masir-dar-al-kitab-al-arabi-2001-v1 p.25}"
    holders: [person/ali-ibn-abi-talib, person/abu-al-aliya-al-riyahi, person/al-rabi-ibn-anas]
    sources: [source/zad-al-masir-dar-al-kitab-al-arabi-2001-v1]
  - tradition: sunni
    id: oath
    standing: secondary
    stance: { ar: "حروف أقسم الله بها", en: "Letters by which God swears", ur: "حروف جن کی اللہ نے قسم کھائی" }
    summary:
      ar: "القول الثالث: أنها حروف أقسم الله بها، عن ابن عباس وعكرمة؛ ويجوّز [[person/ibn-qutayba|ابن قتيبة]] أن يكون أقسم بالحروف كلها واقتصر على بعضها كما يقال «تعلمت أ ب ت ث» يراد سائر الحروف، لشرفها ولأنها مباني كتبه المنزلة؛ ويقدّر [[person/ibn-al-anbari-abu-bakr|ابن الأنباري]] جواب القسم محذوفًا. {cite:zad-al-masir-dar-al-kitab-al-arabi-2001-v1 p.25}"
      en: "Third view: they are letters by which God swears, from Ibn Abbas and Ikrima; [[person/ibn-qutayba|Ibn Qutayba]] allows that He swore by all the letters while naming some, as one says 'I learned a-b-t-th' meaning the whole alphabet, for their nobility and because they are the building blocks of His revealed books; [[person/ibn-al-anbari-abu-bakr|Ibn al-Anbari]] supplies an omitted answer to the oath. {cite:zad-al-masir-dar-al-kitab-al-arabi-2001-v1 p.25}"
      ur: "تیسرا قول: یہ حروف ہیں جن کی اللہ نے قسم کھائی، ابن عباس اور عکرمہ سے؛ [[person/ibn-qutayba|ابن قتیبہ]] جائز رکھتے ہیں کہ اس نے تمام حروف کی قسم کھائی اور بعض کا ذکر کیا، جیسے کہا جائے «میں نے ا ب ت ث سیکھا» اور مراد پوری حروفِ تہجی ہو، ان کے شرف کی وجہ سے اور اس لیے کہ یہ اس کی نازل کردہ کتابوں کی بنیاد ہیں؛ [[person/ibn-al-anbari-abu-bakr|ابن الانباری]] قسم کا جواب محذوف مانتے ہیں۔ {cite:zad-al-masir-dar-al-kitab-al-arabi-2001-v1 p.25}"
    holders: [person/ikrima-mawla-ibn-abbas, person/ibn-qutayba, person/ibn-al-anbari-abu-bakr]
