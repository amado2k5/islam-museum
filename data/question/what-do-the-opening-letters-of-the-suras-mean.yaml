id: question/what-do-the-opening-letters-of-the-suras-mean
class: question
label:
  ar: "ما معنى الحروف المقطعة في أوائل السور؟"
  en: "What do the separated letters at the opening of suras mean?"
  ur: "سورتوں کے آغاز میں حروفِ مقطعات کا کیا معنی ہے؟"
summary:
  ar: "يجمع ابن الجوزي في «زاد المسير» ستة أقوال في الحروف المقطعة: أنها من المتشابه الذي لا يعلمه إلا الله، أو حروف من أسماء الله، أو حروف أقسم الله بها، أو إشارة إلى أن القرآن مؤلف من حروف كلامهم تنبيهًا على إعجازه، أو أسماء للسور، أو من الرمز الذي تستعمله العرب؛ وكلها أقوال سنية منسوبة إلى قائليها."
  en: "In Zad al-Masir Ibn al-Jawzi gathers six views on the separated letters: that they are among the ambiguous known only to God; letters of God's names; letters by which God swears; a pointer that the Qur'an is made of the very letters of the Arabs' speech, to show its inimitability; names of the suras; or the shorthand the Arabs used in speech — all Sunni views, each attributed to those who held it."
  ur: "ابن الجوزی «زاد المسیر» میں حروفِ مقطعات پر چھ اقوال جمع کرتے ہیں: یہ متشابہ ہیں جنہیں صرف اللہ جانتا ہے؛ اللہ کے ناموں کے حروف ہیں؛ ایسے حروف ہیں جن کی اللہ نے قسم کھائی؛ اس طرف اشارہ ہیں کہ قرآن انہی حروف سے بنا ہے جن سے عرب کلام کرتے ہیں، تاکہ اس کا اعجاز ظاہر ہو؛ سورتوں کے نام ہیں؛ یا عربوں کا رمز ہیں — سب سنی اقوال، ہر ایک اپنے قائلین کی طرف منسوب۔"
question:
  ar: "هل للحروف المقطعة معنى يُعلم، وما هو؟"
  en: "Do the separated letters have a knowable meaning, and if so what?"
  ur: "کیا حروفِ مقطعات کا کوئی قابلِ فہم معنی ہے، اور وہ کیا ہے؟"
short_answer:
  ar: "من العلماء من يرد علمها إلى الله، ومنهم من يفسرها: أسماءً أو قسمًا أو تنبيهًا على الإعجاز أو أسماء للسور أو رمزًا؛ ويجمعها ابن الجوزي في ستة أقوال."
  en: "Some scholars leave their knowledge to God; others interpret them — as names, oaths, a pointer to inimitability, names of suras, or shorthand; Ibn al-Jawzi gathers six views."
  ur: "بعض علماء ان کا علم اللہ کے سپرد کرتے ہیں؛ دوسرے ان کی تفسیر کرتے ہیں — نام، قسم، اعجاز کی طرف اشارہ، سورتوں کے نام، یا رمز؛ ابن الجوزی چھ اقوال جمع کرتے ہیں۔"
