    summary:
      ar: "القول السادس: أنها من الرمز الذي تستعمله العرب في كلامها، يكتفي الرجل فيه بحرف من الكلمة، ويستشهدون بأبيات من الشعر؛ وإليه ذهب [[person/al-akhfash-al-awsat-said|الأخفش]] و[[person/al-zajjaj|الزجاج]] وابن الأنباري. {cite:zad-al-masir-dar-al-kitab-al-arabi-2001-v1 p.26}"
      en: "Sixth view: they are the shorthand the Arabs used in speech, where one letter stands for a word, supported with lines of poetry; [[person/al-akhfash-al-awsat-said|al-Akhfash]], [[person/al-zajjaj|al-Zajjaj]] and Ibn al-Anbari held it. {cite:zad-al-masir-dar-al-kitab-al-arabi-2001-v1 p.26}"
      ur: "چھٹا قول: یہ وہ رمز ہیں جو عرب اپنے کلام میں استعمال کرتے تھے، جس میں ایک حرف پورے لفظ کی جگہ آتا ہے، اور اس پر اشعار سے استشہاد کیا جاتا ہے؛ [[person/al-akhfash-al-awsat-said|اخفش]]، [[person/al-zajjaj|زجاج]] اور ابن الانباری کا یہی قول ہے۔ {cite:zad-al-masir-dar-al-kitab-al-arabi-2001-v1 p.26}"
