  - tradition: sunni
    id: inimitability
    standing: secondary
    stance: { ar: "إشارة إلى أن القرآن مؤلف من حروف كلامهم تنبيهًا على إعجازه", en: "A pointer that the Qur'an is made of their own letters, showing its inimitability", ur: "اشارہ کہ قرآن انہی کے حروف سے بنا ہے، اس کے اعجاز کی تنبیہ" }
    summary:
      ar: "القول الرابع، قاله [[person/al-farra|الفراء]] و[[person/qutrub|قطرب]]: أنه أشار بما ذكر من الحروف إلى سائرها، والمعنى أن القرآن مؤلف من هذه الحروف التي يؤلفون منها كلامهم، فما بالهم يعجزون عن معارضته؟ {cite:zad-al-masir-dar-al-kitab-al-arabi-2001-v1 p.25} وقريب منه ما ينقله [[person/badr-al-din-al-zarkashi|الزركشي]] عن القاضي أبي بكر أنها جاءت على نصف حروف المعجم تحديًا لمن زعم أن القرآن ليس بآية. {cite:burhan-dar-al-hadith-2006 p.119}"
      en: "Fourth view, held by [[person/al-farra|al-Farra]] and [[person/qutrub|Qutrub]]: by the letters named He points to the rest; the meaning is that the Qur'an is composed of the very letters from which they compose their speech — so why can they not rival it? {cite:zad-al-masir-dar-al-kitab-al-arabi-2001-v1 p.25} Close to this is what [[person/badr-al-din-al-zarkashi|al-Zarkashi]] reports from Qadi Abu Bakr, that they come as half the alphabet as a challenge to whoever claims the Qur'an is no sign. {cite:burhan-dar-al-hadith-2006 p.119}"
      ur: "چوتھا قول، [[person/al-farra|فراء]] اور [[person/qutrub|قطرب]] کا: ذکر کردہ حروف سے باقی کی طرف اشارہ ہے؛ مطلب یہ کہ قرآن انہی حروف سے بنا ہے جن سے وہ اپنا کلام بناتے ہیں — پھر وہ اس کے مقابلے سے کیوں عاجز ہیں؟ {cite:zad-al-masir-dar-al-kitab-al-arabi-2001-v1 p.25} اسی کے قریب وہ ہے جو [[person/badr-al-din-al-zarkashi|زرکشی]] قاضی ابو بکر سے نقل کرتے ہیں کہ یہ حروفِ معجم کے نصف پر آئے، اس کے لیے چیلنج کے طور پر جو کہے کہ قرآن معجزہ نہیں۔ {cite:burhan-dar-al-hadith-2006 p.119}"
    holders: [person/al-farra, person/qutrub]
    sources: [source/zad-al-masir-dar-al-kitab-al-arabi-2001-v1, source/burhan-dar-al-hadith-2006]
  - tradition: sunni
    id: names-of-suras
    standing: secondary
    stance: { ar: "أسماء للسور", en: "Names of the suras", ur: "سورتوں کے نام" }
    summary:
      ar: "القول الخامس: أنها أسماء للسور، يروى عن [[person/zayd-ibn-aslam|زيد بن أسلم]] وابنه وأبي فاختة سعيد بن علاقة. {cite:zad-al-masir-dar-al-kitab-al-arabi-2001-v1 p.26} وفي حاشية المحقق عن ابن كثير أن الزمخشري قال إن عليه إطباق الأكثر. {cite:zad-al-masir-dar-al-kitab-al-arabi-2001-v1 p.25}"
      en: "Fifth view: they are names of the suras, reported from [[person/zayd-ibn-aslam|Zayd ibn Aslam]], his son and Abu Fakhita Sa'id ibn Ilaqa. {cite:zad-al-masir-dar-al-kitab-al-arabi-2001-v1 p.26} The editor's note cites Ibn Kathir that al-Zamakhshari said most scholars agree on this. {cite:zad-al-masir-dar-al-kitab-al-arabi-2001-v1 p.25}"
      ur: "پانچواں قول: یہ سورتوں کے نام ہیں، [[person/zayd-ibn-aslam|زید بن اسلم]]، ان کے بیٹے اور ابو فاختہ سعید بن علاقہ سے مروی۔ {cite:zad-al-masir-dar-al-kitab-al-arabi-2001-v1 p.26} محقق کا حاشیہ ابن کثیر سے نقل کرتا ہے کہ زمخشری کے بقول اکثر اسی پر متفق ہیں۔ {cite:zad-al-masir-dar-al-kitab-al-arabi-2001-v1 p.25}"
