id: question/what-was-the-seljuk-empire
class: question
label:
  ar: ما الدولة السلجوقية؟
  en: What was the Seljuk Empire?
  es: "¿Qué fue el Imperio Selyúcida?"
  fr: "Qu'était-ce que l'Empire seldjoukide ?"
summary:
  ar: الدولة السلجوقية (1037–1194) سلطنة تركية سنية حمت الخلافة العباسية؛ في عهدها نظام الملك والمدارس
    النظامية ومعركة ملاذكرد 1071.
  en: "The Seljuk Empire (1037–1194) was a Sunni Turkish sultanate that protected the Abbasid caliphate. Its era saw Nizam al-Mulk and the Nizamiyya madrasas, and the Battle of Manzikert (Malazgirt) in 1071."
  es: "El Imperio selyúcida (1037-1194) fue un sultanato turco suní que protegió al califato abasí. Durante su época, gobernaron Nizam al-Mulk y las madrasas Nizamiyya, y tuvo lugar la batalla de Manzikert (Malazgirt) en 1071."
  fr: "L'empire seldjoukide (1037-1194) était un sultanat turc sunnite qui protégeait le califat abbasside. Son époque fut marquée par Nizam al-Mulk et les médersas Nizamiyya, ainsi que par la bataille de Manzikert (Malazgirt) en 1071."
question:
  ar: ما الدولة السلجوقية؟
short_answer:
  ar: الدولة السلجوقية (1037–1194) سلطنة تركية سنية حمت الخلافة العباسية؛ في عهدها نظام الملك والمدارس
    النظامية ومعركة ملاذكرد 1071.
long_answer:
  ar: الدولة السلجوقية جاء بها طغرل بك إلى بغداد 1055 خليفة للعسكر على الخلافة العباسية؛ بلغت ذروتها بألب
    أرسلان وملكشاه ووزيرهما نظام الملك مؤسس المدارس النظامية؛ ملاذكرد 1071 فتحت الأناضول للأتراك وتفككت
    بعد ملكشاه إلى سلطنات أصغرها سلاجقة الروم. {cite:wikidata}
