question:
  ar: ما الدولة السلجوقية؟
short_answer:
  ar: الدولة السلجوقية (1037–1194) سلطنة تركية سنية حمت الخلافة العباسية؛ في عهدها نظام الملك والمدارس
    النظامية ومعركة ملاذكرد 1071.
long_answer:
  ar: الدولة السلجوقية جاء بها طغرل بك إلى بغداد 1055 خليفة للعسكر على الخلافة العباسية؛ بلغت ذروتها بألب
    أرسلان وملكشاه ووزيرهما نظام الملك مؤسس المدارس النظامية؛ ملاذكرد 1071 فتحت الأناضول للأتراك وتفككت
    بعد ملكشاه إلى سلطنات أصغرها سلاجقة الروم. {cite:wikidata}
