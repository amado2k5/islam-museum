    summary: { ar: "في نقل ابن تيمية: يقول الحلي إن أبا بكر منع فاطمة إرثها فقالت له: أترث أباك ولا أرث أبي؟ وإنه التجأ إلى رواية انفرد بها وكان هو الغريم لها لأن الصدقة تحل له، وإن آية المواريث لم تخص الأمة دون النبي، وإن القرآن ذكر أن سليمان ورث داود وأن زكريا طلب ولياً يرثه.", en: "As Ibn Taymiyya reports: al-Hilli says that Abu Bakr withheld Fatima's inheritance and she said to him, 'Do you inherit from your father and I not inherit from mine?'; that he relied on a report he alone transmitted and was himself her adversary, since charity was lawful for him; that the inheritance verse did not single out the community to the exclusion of the Prophet; and that the Qur'an states that Solomon inherited from David and that Zechariah asked for an heir.", ur: "ابن تیمیہ کی نقل میں: حلی کہتے ہیں کہ ابو بکر نے فاطمہ کو میراث سے روکا تو انہوں نے کہا: کیا آپ اپنے باپ کے وارث ہوں اور میں اپنے باپ کی وارث نہ ہوں؟ اور یہ کہ انہوں نے ایسی روایت کا سہارا لیا جس میں وہ منفرد تھے اور وہ خود فریق تھے کیونکہ صدقہ ان کے لیے حلال تھا؛ میراث کی آیت نے امت کو نبی سے الگ خاص نہیں کیا؛ اور قرآن نے ذکر کیا کہ سلیمان داود کے وارث ہوئے اور زکریا نے وارث مانگا۔" }
