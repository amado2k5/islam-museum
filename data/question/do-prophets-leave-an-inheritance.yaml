    summary: { ar: "يقول ابن تيمية إن الحديث رواه أبو بكر وعمر وعثمان وعلي وطلحة والزبير وسعد وعبد الرحمن بن عوف والعباس وأزواج النبي وأبو هريرة، وإن أبا بكر لم يدّع المال لنفسه ولا لأهله فشهادته لجهة عامة، وإنه من باب الرواية لا الشهادة، وإن الله صان الأنبياء عن أن يورّثوا الدنيا لئلا يُقدح في نبوتهم.", en: "Ibn Taymiyya says that the hadith was transmitted by Abu Bakr, Umar, Uthman, Ali, Talha, al-Zubayr, Sa'd, Abd al-Rahman ibn Awf, al-Abbas, the Prophet's wives and Abu Hurayra; that Abu Bakr claimed the property neither for himself nor his family, so his testimony was for a general cause; that the matter belongs to transmission, not testimony; and that God protected the prophets from bequeathing worldly goods so that their prophethood would not be impugned.", ur: "ابن تیمیہ کہتے ہیں کہ یہ حدیث ابو بکر، عمر، عثمان، علی، طلحہ، زبیر، سعد، عبد الرحمن بن عوف، عباس، ازواجِ نبی اور ابو ہریرہ نے روایت کی؛ ابو بکر نے مال نہ اپنے لیے مانگا نہ اپنے گھر والوں کے لیے، اس لیے ان کی گواہی ایک عام مصرف کے حق میں تھی؛ یہ معاملہ روایت کا ہے، گواہی کا نہیں؛ اور اللہ نے انبیا کو دنیا کی وراثت چھوڑنے سے بچایا تاکہ ان کی نبوت پر طعن نہ ہو۔" }
