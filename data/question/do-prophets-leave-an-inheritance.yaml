id: question/do-prophets-leave-an-inheritance
class: question
label: { ar: "هل يورَث الأنبياء؟ ميراث فاطمة بين الحلي وابن تيمية", en: "Do prophets leave an inheritance? Fatima's claim between al-Hilli and Ibn Taymiyya", ur: "کیا انبیا کی وراثت تقسیم ہوتی ہے؟ فاطمہ کا مطالبہ، حلی اور ابن تیمیہ کے درمیان" }
summary:
  ar: "عاب ابن المطهر الحلي أبا بكر بمنع فاطمة ميراثها من النبي، وقال إنه انفرد برواية «لا نورث» وكان خصماً لها وإن القرآن يخالفها؛ وردّ ابن تيمية في منهاج السنة بأن الحديث رواه جماعة من كبار الصحابة، وأن أبا بكر لم يأخذ المال لنفسه، وأن آية المواريث خطاب للأمة لا يدخل فيه النبي."
  en: "Ibn al-Mutahhar al-Hilli faulted Abu Bakr for withholding Fatima's inheritance from the Prophet, saying that he alone transmitted 'We are not inherited from', that he was her adversary, and that the Qur'an contradicts the report; Ibn Taymiyya replied in Minhaj al-Sunna that a group of senior Companions transmitted the hadith, that Abu Bakr took nothing of the property for himself, and that the inheritance verse addresses the community and does not include the Prophet."
  ur: "ابن المطہر حلی نے ابو بکر پر اعتراض کیا کہ انہوں نے فاطمہ کو نبی کی میراث سے روکا، کہا کہ «ہماری وراثت نہیں ہوتی» کی روایت میں وہ منفرد تھے، وہ خود ان کے فریق تھے اور قرآن اس روایت کے خلاف ہے؛ ابن تیمیہ نے منہاج السنہ میں جواب دیا کہ یہ حدیث کبار صحابہ کی ایک جماعت نے روایت کی، ابو بکر نے مال اپنے لیے نہیں لیا، اور میراث کی آیت امت سے خطاب ہے جس میں نبی داخل نہیں۔"
question: { ar: "هل يورَث الأنبياء؟", en: "Do prophets leave an inheritance?", ur: "کیا انبیا کی وراثت تقسیم ہوتی ہے؟" }
issue:
  ar: "هل يدخل النبي في عموم آية المواريث، وهل يصح حديث «لا نورث ما تركنا صدقة»، وهل كان أبو بكر خصماً لفاطمة في دعواها؟"
  en: "Is the Prophet included in the general wording of the inheritance verse, is the hadith 'We are not inherited from; what we leave is charity' sound, and was Abu Bakr Fatima's adversary in her claim?"
  ur: "کیا نبی میراث کی آیت کے عموم میں داخل ہیں، کیا حدیث «ہماری وراثت نہیں ہوتی، جو ہم چھوڑیں وہ صدقہ ہے» صحیح ہے، اور کیا ابو بکر فاطمہ کے دعوے میں ان کے فریق تھے؟"
short_answer:
  ar: "ابن تيمية ⁦(أهل السنة)⁩: لا يورث الأنبياء، والحديث ثابت عن جماعة من الصحابة، وما تركه النبي صدقة. الإمامية كما ينقلهم: فاطمة ترث أباها بعموم القرآن، وتوريث سليمان داود وزكريا شاهد على ذلك."
  en: "Ibn Taymiyya (Sunni): prophets are not inherited from; the hadith is established from a group of Companions and what the Prophet left is charity. The Imamiyya as he reports them: Fatima inherits from her father by the general wording of the Qur'an, and the verses on Solomon inheriting from David and on Zechariah bear this out."
  ur: "ابن تیمیہ (اہلِ سنت): انبیا کی وراثت تقسیم نہیں ہوتی؛ یہ حدیث صحابہ کی ایک جماعت سے ثابت ہے اور نبی کا ترکہ صدقہ ہے۔ امامیہ، جیسا وہ نقل کرتے ہیں: فاطمہ قرآن کے عموم سے اپنے والد کی وارث ہیں، اور سلیمان کے داود کے وارث ہونے اور زکریا کی آیات اس کی گواہ ہیں۔"
