    العرب المستعربة ومحمد.
long_answer:
  ar: '[[person/ismail|إسماعيل]] البكر بإبراهيم؛ تركه الله وأمه هاجر في وادي مكة فنبعت زمزم وسكنت جرهم؛
    فداه الله بالذبح العظيم وبنى الكعبة مع أبيه؛ من نسله عدنان فقريش فالنبي محمد آخر الأنبياء. {cite:wikidata}'
