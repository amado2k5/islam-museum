id: question/who-was-ismail
class: question
label:
  ar: من كان إسماعيل؟
  en: Who was Ismail?
  es: "¿Quién era Ismail?"
  fr: "Qui était Ismaïl ?"
  ur: "اسماعیل کون تھا؟"
  tr: "İshmael kimdi?"
  id: "Siapa Ishmael?"
summary:
  ar: إسماعيل بن إبراهيم الذبيح؛ تركه أبوه رضيعًا في مكة ففجر الله زمزم وبنى الكعبة مع أبيه وجاءت من نسله
    العرب المستعربة ومحمد.
  en: "Ismail ibn Ibrahim, known as al-Dhabih; his father left him as an infant in Mecca, God caused Zamzam to gush forth, he helped build the Ka'ba with his father, and from his line came the Arabized Arabs and Muhammad."
  es: "Ismail ibn Ibrahim, conocido como al-Dhabih; su padre lo abandonó cuando era un bebé en La Meca, Dios hizo que brotara el agua de Zamzam, ayudó a construir la Kaaba con su padre, y de su linaje surgieron los árabes arabizados y Mahoma."
  fr: "Ismail ibn Ibrahim, connu sous le nom d'al-Dhabih; son père l'abandonna bébé à La Mecque, Dieu fit jaillir Zamzam, il aida à construire la Kaaba avec son père, et de sa lignée sont issus les Arabes arabisés et Mahomet."
  ur: "اسماعیل ابن ابراہیم، الذہبیح کے نام سے جانا جاتا ہے؛ اس کے والد نے اسے مکہ میں بچپن میں چھوڑ دیا، خدا نے زمزم کو اگایا، اس نے اپنے والد کے ساتھ مل کر کعبہ کی تعمیر میں مدد کی، اور ان کی نسل سے عربی عرب اور محمد آئے۔"
  tr: "İsmail bin İbrahim el-Dhubhi; babası onu bebekken Mekke'de bıraktı, bu yüzden Allah Zemzam'ı patlattı ve babasıyla birlikte Kabe'yi inşa etti. Onun soyundan Araplaşmış Araplar ve Muhammed geldi."
  id: "Ismail ibn Ibrahim al-Dhubhi; ayahnya meninggalkannya saat bayi di Mekah, sehingga Tuhan membuat Zamzam muncul dan membangun Ka'bah bersama ayahnya. Dari garis keturunannya lahirlah Arab yang telah diarabadikan dan Muhammad."
question:
  ar: من كان إسماعيل؟
