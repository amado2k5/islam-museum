summary:
  ar: صلاح الدين يوسف بن أيوب (1137–1193) مؤسس الأيوبية؛ وحّد مصر والشام وحرر القدس في حطين 1187.
  en: "Salah al-Din Yusuf ibn Ayyub (1137–1193), founder of the Ayyubid dynasty; he unified Egypt and Syria and liberated Jerusalem, with the victory at Hattin in 1187."
  es: "Salah al-Din Yusuf ibn Ayyub (1137-1193), fundador de la dinastía ayubí; unificó Egipto y Siria y liberó Jerusalén con la victoria en Hattin en 1187."
  fr: "Salah al-Din Yusuf ibn Ayyub (1137–1193), fondateur de la dynastie ayyoubide; il unifia l'Égypte et la Syrie et libéra Jérusalem, avec la victoire de Hattin en 1187."
  ur: "صلاح الدین یوسف ابن ایوب (1137-1193)، ایوبی خاندان کے بانی؛ اس نے مصر اور شام کو متحد کیا اور 1187 میں حطین میں فتح کے ساتھ یروشلم کو آزاد کرایا۔"
  tr: "Salah al-Din Yusuf bin Eyyub (1137–1193), Eyyubiliğin kurucusuydu; Mısır ile Şam'ı birleştirdi ve 1187'de Hattin'de Kudüs'ü özgürleştirdi."
  id: "Salah al-Din Yusuf ibn Ayyub (1137–1193) adalah pendiri Ayyubidisme; ia menyatukan Mesir dan Levant serta membebaskan Yerusalem di Hattin pada tahun 1187."
question:
  ar: من كان صلاح الدين الأيوبي؟
short_answer:
  ar: صلاح الدين يوسف بن أيوب (1137–1193) مؤسس الأيوبية؛ وحّد مصر والشام وحرر القدس في حطين 1187.
long_answer:
  ar: '[[person/salah-al-din-yusuf-ibn-ayyub|صلاح الدين]] الكردي التكريتي؛ قاد جيش عماد الدين زنكي فأسس
    الدولة الأيوبية في مصر والشام. انتصر في حطين 1187 واسترد القدس من الصليبيين؛ عُرف بالنبل حتى في أعدائه،
    وحكمه بقي مثال الفروسية الإسلامية. {cite:wikidata}'
