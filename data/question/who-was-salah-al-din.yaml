long_answer:
  ar: '[[person/salah-al-din-yusuf-ibn-ayyub|صلاح الدين]] الكردي التكريتي؛ قاد جيش عماد الدين زنكي فأسس
    الدولة الأيوبية في مصر والشام. انتصر في حطين 1187 واسترد القدس من الصليبيين؛ عُرف بالنبل حتى في أعدائه،
    وحكمه بقي مثال الفروسية الإسلامية. {cite:wikidata}'
