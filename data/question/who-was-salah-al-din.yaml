label:
  ar: من كان صلاح الدين الأيوبي؟
  en: Who was Salah al-Din al-Ayyubi?
  es: "¿Quién fue Salah al-Din al-Ayyubi?"
  fr: "Qui était Salah al-Din al-Ayyubi ?"
  ur: "صلاح الدین ایوبی کون تھا؟"
  tr: "Salah al-Din el-Eyyubi kimdi?"
