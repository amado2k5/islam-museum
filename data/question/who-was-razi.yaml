summary:
  ar: أبو بكر الرازي (865–925) طبيب فارسي؛ رئيس بيمارستان بغداد ومؤلف الحاوي، ووصف الجدري والحصبة أول
    وصف سريري دقيق.
  en: "Abu Bakr al-Razi (865–925), a Persian physician; head of the hospital of Baghdad and author of al-Hawi. His description of smallpox and measles was the first precise clinical description."
  es: "Abu Bakr al-Razi (865-925), médico persa, director del hospital de Bagdad y autor de al-Hawi. Su descripción de la viruela y el sarampión fue la primera descripción clínica precisa."
  fr: "Abou Bakr al-Razi (865-925), médecin persan, directeur de l'hôpital de Bagdad et auteur d'al-Hawi, a rédigé la première description clinique précise de la variole et de la rougeole."
  ur: "ابوبکر الرازی (865-925)، ایک فارسی طبیب؛ بغداد کے ہسپتال کے سربراہ اور الحوی کے مصنف۔ چیچک اور خسرہ کے بارے میں اس کی تفصیل پہلی درست طبی وضاحت تھی۔"
  tr: "Ebu Bekir el-Razi (865–925), Bağdat hastanesinin başkanı ve çiçek hastalığı ile kızamık hakkında ilk doğru klinik tanımını yapan El-Hawi'nin yazarı olan bir İranlı hekimdi."
  id: "Abu Bakr al-Razi (865–925) adalah seorang dokter Persia; kepala rumah sakit Baghdad dan penulis Al-Hawi, yang deskripsi klinis pertamanya yang akurat tentang cacar dan campak dibuat."
question:
  ar: من كان الرازي؟
short_answer:
  ar: أبو بكر الرازي (865–925) طبيب فارسي؛ رئيس بيمارستان بغداد ومؤلف الحاوي، ووصف الجدري والحصبة أول
    وصف سريري دقيق.
long_answer:
  ar: '[[person/al-razi-abu-bakr|الرازي]] من أعظم أطباء التاريخ؛ قاد مستشفيات الري وبغداد وجمع في الحاوي
    تراث الطب كله بملاحظاته، وفرّق في رسالته بين الجدري والحصبة أول مرة. عرف في الغرب باسم Rhazes وبقي
    الحاوي مرجعًا إلى عصر النهضة. {cite:wikidata}'
