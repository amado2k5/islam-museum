question:
  ar: من كان الرازي؟
short_answer:
  ar: أبو بكر الرازي (865–925) طبيب فارسي؛ رئيس بيمارستان بغداد ومؤلف الحاوي، ووصف الجدري والحصبة أول
    وصف سريري دقيق.
long_answer:
  ar: '[[person/al-razi-abu-bakr|الرازي]] من أعظم أطباء التاريخ؛ قاد مستشفيات الري وبغداد وجمع في الحاوي
    تراث الطب كله بملاحظاته، وفرّق في رسالته بين الجدري والحصبة أول مرة. عرف في الغرب باسم Rhazes وبقي
    الحاوي مرجعًا إلى عصر النهضة. {cite:wikidata}'
