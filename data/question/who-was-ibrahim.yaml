id: question/who-was-ibrahim
class: question
label:
  ar: من هو إبراهيم في الإسلام؟
  en: Who is Abraham in Islam?
  es: "¿Quién es Abraham en el Islam?"
  fr: "Qui est Abraham en Islam ?"
  ur: "اسلام میں ابراہیم کون ہے؟"
summary:
  ar: إبراهيم أبو الأنبياء عند المسلمين، وفي السيرة أنه أسكن هاجر وابنه إسماعيل في وادي مكة، وهو معروف بأنه بنى الكعبة مع ابنه، وفق الرواية المعروفة.
  en: "Ibrahim is the father of the prophets according to Muslims; in the sira tradition he settled Hajar and his son Ismail in the valley of Mecca, and he is known, according to the familiar account, to have built the Ka'ba with his son."
  es: "Según los musulmanes, Ibrahim es el padre de los profetas; en la tradición sira, estableció a Hajar y a su hijo Ismail en el valle de La Meca, y se sabe, según el relato popular, que construyó la Kaaba con su hijo."
  fr: "Selon les musulmans, Ibrahim est le père des prophètes; selon la tradition sira, il a installé Hajar et son fils Ismaïl dans la vallée de La Mecque, et il est connu, selon le récit répandu, pour avoir construit la Kaaba avec son fils."
  ur: "مسلمانوں کے نزدیک ابراہیم انبیاء کا باپ ہے۔ سیرت کی روایت میں اس نے حجر اور اس کے بیٹے اسماعیل کو مکہ کی وادی میں آباد کیا، اور مشہور روایت کے مطابق، اس نے اپنے بیٹے کے ساتھ کعبہ کی تعمیر کی تھی۔"
