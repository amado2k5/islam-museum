class: question
label:
  ar: من هو إبراهيم في الإسلام؟
  en: Who is Abraham in Islam?
summary:
  ar: إبراهيم أبو الأنبياء عند المسلمين، وفي السيرة أنه أسكن هاجر وابنه إسماعيل في وادي مكة، وهو معروف بأنه بنى الكعبة مع ابنه، وفق الرواية المعروفة.
  en: "Ibrahim is the father of the prophets according to Muslims; in the sira tradition he settled Hajar and his son Ismail in the valley of Mecca, and he is known, according to the familiar account, to have built the Ka'ba with his son."
wings: []
question:
  ar: من هو إبراهيم في الإسلام؟
short_answer:
  ar: إبراهيم أبو الأنبياء عند المسلمين، وفي السيرة أنه أسكن هاجر وابنه إسماعيل في وادي مكة، وهو معروف بأنه بنى الكعبة مع ابنه، وفق الرواية المعروفة.
long_answer:
  ar: |
    إبراهيم نبي من أنبياء الله، ويعده المسلمون أباً للأنبياء، كما يعرض مدخل [[person/ibrahim|إبراهيم]]. وفي رواية السيرة أنه انتقل من العراق إلى حران ثم فلسطين، وأسكن هاجر وإسماعيل في وادي مكة.
    ويرتبط إبراهيم بالكعبة في التراث، إذ يذكر التراث أنه بناها مع ابنه، ويعرض ذلك مدخل [[place/mecca|مكة]].
    وهو موضع اتفاق بين المسلمين في مكانته، وتفاصيل قصته تعرض وفق روايات التراث.
