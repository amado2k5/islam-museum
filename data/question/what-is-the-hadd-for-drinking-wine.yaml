id: question/what-is-the-hadd-for-drinking-wine
class: question
label: { ar: "ما حدّ شارب الخمر، وهل يُقتل في الرابعة؟", en: "What is the hadd for drinking wine, and is the drinker executed at the fourth offence?", ur: "شراب پینے والے کی حد کیا ہے، اور کیا چوتھی بار اسے قتل کیا جائے؟" }
question: { ar: "هل لشرب الخمر حدّ مقدّر بالسنة، وهل هو أربعون أم ثمانون، وهل يُقتل الشارب إذا حُدّ ثلاثاً ثم شرب الرابعة؟", en: "Does drinking wine carry a punishment fixed by the Sunna; is it forty lashes or eighty; and is the drinker executed if, after three punishments, he drinks a fourth time?", ur: "کیا شراب نوشی کی سنت سے مقرر حد ہے؛ کیا وہ چالیس کوڑے ہے یا اسی؛ اور کیا تین بار حد لگنے کے بعد چوتھی بار پینے والے کو قتل کیا جائے؟" }
issue: { ar: "روايات جلد النبي الشاربَ بالأيدي والنعال والجريد، وجلد أبي بكر وعمر أربعين ثم زيادة عمر إلى ثمانين، وحديث معاوية في قتل الشارب في الرابعة وما رُوي في نسخه، كما يعرضها ابن حزم.", en: "The reports of the Prophet's having drinkers beaten with hands, sandals and palm stalks, of Abu Bakr and 'Umar giving forty lashes and 'Umar's later raising it to eighty, and Mu'awiya's report on executing the drinker at the fourth offence and what is related about its abrogation, as Ibn Hazm sets them out.", ur: "نبی کے شرابی کو ہاتھوں، جوتوں اور کھجور کی چھڑیوں سے مارنے کی روایات، ابو بکر اور عمر کے چالیس کوڑے اور پھر عمر کے اسی تک بڑھانے کی روایات، اور چوتھی بار شرابی کو قتل کرنے کے بارے میں معاویہ کی حدیث اور اس کے نسخ کے بارے میں مروی باتیں، جیسا کہ ابن حزم انہیں پیش کرتے ہیں۔" }
summary:
  ar: "يحكي ابن حزم في «المحلى» أربعة أقوال في حد الخمر: لم يفرض النبي فيه حداً وإنما فرضه من بعده، ولا حد فيه، وحده ثمانون، وحده أربعون؛ ويأخذ هو بالأربعين مع الشافعي وداود، ويرى زيادة عمر تعزيراً لا حداً؛ ويحكي أن مالكاً والشافعي وأبا حنيفة لا يرون قتل الشارب في الرابعة، ويرى هو قتله لصحة الأمر به عنده وعدم صحة نسخه {cite:muhalla-dar-ibn-hazm-2016-v16 p.400} {cite:muhalla-dar-ibn-hazm-2016-v16 p.403} {cite:muhalla-dar-ibn-hazm-2016-v16 p.405} {cite:muhalla-dar-ibn-hazm-2016-v16 p.413}."
  en: "Ibn Hazm reports four views in al-Muhalla on the punishment for wine: the Prophet fixed none and later authorities did; there is none; it is eighty lashes; it is forty. He takes forty, with al-Shafi'i and Dawud, regarding 'Umar's addition as discretionary punishment, not hadd; he reports that Malik, al-Shafi'i and Abu Hanifa do not hold the drinker executed at the fourth offence, while he holds that he is, because in his view the command is sound and its abrogation is not {cite:muhalla-dar-ibn-hazm-2016-v16 p.400} {cite:muhalla-dar-ibn-hazm-2016-v16 p.403} {cite:muhalla-dar-ibn-hazm-2016-v16 p.405} {cite:muhalla-dar-ibn-hazm-2016-v16 p.413}."
  ur: "ابن حزم «المحلی» میں شراب کی حد کے بارے میں چار اقوال نقل کرتے ہیں: نبی نے کوئی حد مقرر نہیں کی، بعد والوں نے کی؛ اس میں کوئی حد نہیں؛ اس کی حد اسی کوڑے ہے؛ اس کی حد چالیس ہے۔ وہ شافعی اور داؤد کے ساتھ چالیس کو اختیار کرتے ہیں، اور عمر کے اضافے کو تعزیر سمجھتے ہیں نہ کہ حد؛ وہ نقل کرتے ہیں کہ مالک، شافعی اور ابو حنیفہ چوتھی بار شرابی کے قتل کے قائل نہیں، جبکہ وہ خود قتل کے قائل ہیں، کیونکہ ان کے نزدیک اس کا حکم صحیح ہے اور نسخ صحیح نہیں {cite:muhalla-dar-ibn-hazm-2016-v16 p.400} {cite:muhalla-dar-ibn-hazm-2016-v16 p.403} {cite:muhalla-dar-ibn-hazm-2016-v16 p.405} {cite:muhalla-dar-ibn-hazm-2016-v16 p.413}۔"
short_answer:
  ar: "كما يحكيهم ابن حزم: الشافعي: أربعون؛ وأثبت معاوية الثمانين بعد زيادة عمر؛ ومالك والشافعي وأبو حنيفة: لا قتل في الرابعة. ابن حزم الظاهري: أربعون، ويُقتل في الرابعة."
  en: "As Ibn Hazm reports them: al-Shafi'i: forty; Mu'awiya fixed eighty after 'Umar's addition; Malik, al-Shafi'i and Abu Hanifa: no execution at the fourth offence. Ibn Hazm the Zahiri: forty, and execution at the fourth."
  ur: "ابن حزم کی نقل کے مطابق: شافعی: چالیس؛ عمر کے اضافے کے بعد معاویہ نے اسی کو مستقل کیا؛ مالک، شافعی اور ابو حنیفہ: چوتھی بار قتل نہیں۔ ابن حزم ظاہری: چالیس، اور چوتھی بار قتل۔"
perspectives:
  - tradition: sunni
    id: jumhur-no-execution
    standing: main
    stance: { ar: "لا يُقتل الشارب وإن تكرر منه الشرب", en: "The drinker is not executed, however often he drinks", ur: "شرابی کو قتل نہیں کیا جائے گا، خواہ بار بار پیے" }
    summary: { ar: "يحكي ابن حزم أن مالكاً والشافعي وأبا حنيفة وغيرهم قالوا لا قتل عليه، وذكروا ذلك عن عمر بن الخطاب وسعد بن أبي وقاص، واحتجوا بحديث جابر في نسخ الأمر بقتل الشارب في الرابعة، وبأن عمر جلد أبا محجن في الخمر ثماني مرات، وبخبر زيد بن أسلم في رجل جُلد مراراً على عهد النبي ولم يُقتل.", en: "Ibn Hazm reports that Malik, al-Shafi'i, Abu Hanifa and others said the drinker is not executed, citing this from 'Umar ibn al-Khattab and Sa'd ibn Abi Waqqas, and argued from Jabir's report that the command to execute at the fourth offence was abrogated, from 'Umar's flogging Abu Mihjan eight times for wine, and from Zayd ibn Aslam's report of a man flogged repeatedly in the Prophet's time and not executed.", ur: "ابن حزم نقل کرتے ہیں کہ مالک، شافعی، ابو حنیفہ وغیرہ نے کہا کہ اس پر قتل نہیں، اور یہ عمر بن الخطاب اور سعد بن ابی وقاص سے نقل کیا، اور جابر کی اس روایت سے استدلال کیا کہ چوتھی بار قتل کا حکم منسوخ ہو گیا، عمر کے ابو محجن کو شراب پر آٹھ بار کوڑے لگانے سے، اور زید بن اسلم کی اس شخص کے بارے میں روایت سے جسے نبی کے زمانے میں بار بار کوڑے لگے اور قتل نہیں کیا گیا۔" }
    holders: [person/malik-ibn-anas, person/al-shafii, person/abu-hanifa]
    sources: [source/muhalla-dar-ibn-hazm-2016-v16]
  - tradition: sunni-shafii
    id: shafii-forty
    standing: main
    stance: { ar: "الحد أربعون", en: "The hadd is forty lashes", ur: "حد چالیس کوڑے ہے" }
    summary: { ar: "يحكي ابن حزم أن الأربعين قول الشافعي وأبي سليمان وأصحابهما، وأنها قول أبي بكر وعمر وعثمان وعلي والحسن بن علي وعبد الله بن جعفر بحضرة الصحابة، وأن عمر زاد إلى ثمانين حين عتا الناس وفسقوا، وأن عثمان جلد الحدين كليهما، وأن معاوية أثبت الثمانين.", en: "Ibn Hazm reports that forty is the view of al-Shafi'i, Abu Sulayman and their followers, and of Abu Bakr, 'Umar, 'Uthman, 'Ali, al-Hasan ibn 'Ali and 'Abd Allah ibn Ja'far in the presence of the Companions; that 'Umar raised it to eighty when people grew insolent and dissolute; that 'Uthman applied both forty and eighty; and that Mu'awiya fixed eighty.", ur: "ابن حزم نقل کرتے ہیں کہ چالیس شافعی، ابو سلیمان اور ان کے اصحاب کا قول ہے، اور ابو بکر، عمر، عثمان، علی، حسن بن علی اور عبد اللہ بن جعفر کا صحابہ کی موجودگی میں؛ کہ جب لوگ سرکش اور فاسق ہو گئے تو عمر نے اسی تک بڑھایا؛ کہ عثمان نے چالیس اور اسی دونوں لگائے؛ اور معاویہ نے اسی کو مستقل کیا۔" }
    holders: [person/al-shafii]
