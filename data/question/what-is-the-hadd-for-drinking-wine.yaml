  - tradition: sunni
    id: zahiri-ibn-hazm-forty-and-execution
    standing: secondary
    stance: { ar: "الظاهرية (ابن حزم): الحد أربعون، ويُقتل الشارب في الرابعة", en: "Zahiri (Ibn Hazm): the hadd is forty, and the drinker is executed at the fourth offence", ur: "ظاہری (ابن حزم): حد چالیس ہے، اور شرابی کو چوتھی بار قتل کیا جائے گا" }
    summary: { ar: "يرى ابن حزم أن زيادة عمر ومن زاد معه تعزير لا حد واجب، ويلزم من جعلها حداً أن يجعل تحريق بيت الخمّار ونفي الشارب حداً لأن عمر فعلهما؛ ويحتج لقتل الشارب في الرابعة بحديث معاوية «إذا شربوا الخمر فاجلدوهم... ثم إن شربوا فاقتلوهم» وبأثر عبد الله بن عمرو، ويضعّف حديث جابر في النسخ لأنه لم يصله عن ابن المنكدر إلا ضعيفان، ويرى أثر قبيصة في أبي محجن منقطعاً، وخبر زيد بن أسلم لا يبين أنه كان بعد الأمر بالقتل، ويقرر أن الأمر لا يُترك بدعوى النسخ إلا بنص أو إجماع أو تاريخ ثابت.", en: "Ibn Hazm holds that 'Umar's addition and that of those who added with him was discretionary punishment, not an obligatory hadd; whoever makes it a hadd must equally make burning the wine-seller's house and banishing the drinker a hadd, since 'Umar did both. For executing the drinker at the fourth offence he argues from Mu'awiya's report, 'if they drink wine, flog them... then if they drink, kill them', and from a report from 'Abd Allah ibn 'Amr; he weakens Jabir's report of abrogation because only two weak men transmit it connected from Ibn al-Munkadir, takes Qabisa's report on Abu Mihjan as disconnected, and notes that Zayd ibn Aslam's report does not show it came after the command to execute; a command, he holds, may not be set aside by a claim of abrogation without a text, a consensus or a firm date.", ur: "ابن حزم کے نزدیک عمر اور ان کے ساتھ اضافہ کرنے والوں کا اضافہ تعزیر تھا، لازم حد نہیں؛ جو اسے حد بنائے اسے شراب فروش کا گھر جلانا اور شرابی کو جلاوطن کرنا بھی حد بنانا ہوگا، کیونکہ عمر نے دونوں کیے۔ چوتھی بار قتل کے لیے وہ معاویہ کی حدیث «اگر وہ شراب پئیں تو انہیں کوڑے لگاؤ... پھر اگر پئیں تو انہیں قتل کرو» اور عبد اللہ بن عمرو کے اثر سے استدلال کرتے ہیں؛ وہ نسخ والی جابر کی روایت کو ضعیف کہتے ہیں کیونکہ ابن المنکدر سے اسے متصل صرف دو ضعیف راوی نقل کرتے ہیں، ابو محجن کے بارے میں قبیصہ کے اثر کو منقطع، اور زید بن اسلم کی روایت کو اس سے خالی سمجھتے ہیں کہ یہ قتل کے حکم کے بعد ہوا؛ ان کے نزدیک کوئی حکم نسخ کے دعوے سے نہیں چھوڑا جا سکتا جب تک نص، اجماع یا ثابت تاریخ نہ ہو۔" }
