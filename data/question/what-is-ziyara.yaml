id: question/what-is-ziyara
class: question
label:
  ar: "ما زيارة القبور؟"
  en: What is visiting graves?
  es: "¿Qué es visitar tumbas?"
  fr: "Qu'est-ce que la visite des tombes ?"
  ur: "قبروں کی زیارت کیا ہے؟"
  tr: "Mezar ziyareti nedir?"
  id: "Apa itu kunjungan makam?"
summary:
  ar: "زيارة القبور للدعاء والتذكر بالموت؛ أباحها النبي بعد نهي أول، وتختلف أعرافها بين البلدان ويرفض العلماء ما داخلها من تجاوز."
  en: "Visiting graves is for prayer for the dead and remembrance of death; the Prophet permitted it after an earlier prohibition, its customs differ between countries, and scholars reject the excesses that occur within it."
  es: "La visita a las tumbas tiene como finalidad la oración por los difuntos y el recuerdo de la muerte; el Profeta lo permitió tras una prohibición anterior, sus costumbres difieren entre países y los eruditos rechazan los excesos que se producen en ella."
  fr: "La visite des tombes est un acte de prière pour les défunts et de recueillement en mémoire de la mort; le Prophète l'a autorisée après une interdiction antérieure, ses coutumes diffèrent selon les pays, et les érudits rejettent les excès qui s'y produisent."
  ur: "قبروں کی زیارت مرنے والوں کے لیے دعا اور موت کی یاد کے لیے ہے۔ نبی نے پہلے کی ممانعت کے بعد اس کی اجازت دی، اس کے رواج ملکوں میں مختلف ہیں، اور علماء اس کے اندر ہونے والی زیادتیوں کو رد کرتے ہیں۔"
  tr: "Peygamber, ilk yasaktan sonra mezarları ziyaret ederek dua ve ölüm anmasına izin vermiştir; gelenekleri ülkeler arasında farklılık gösterir ve alimler bu yasaklar içinde herhangi bir ihlali reddeder."
  id: "Mengunjungi makam untuk memohon dan mengenang kematian diizinkan oleh Nabi setelah larangan awal, dan adatnya berbeda antar negara, dan para ulama menolak segala pelanggaran di dalamnya."
wings: []
question:
  ar: "ما زيارة القبور؟"
short_answer:
  ar: "زيارة القبور للدعاء والتذكر بالموت؛ أباحها النبي بعد نهي أول، وتختلف أعرافها بين البلدان ويرفض العلماء ما داخلها من تجاوز."
long_answer:
  ar: |
    زيارة القبور مشروعة في مشهور قول العلماء، وفي صحيح مسلم إباحتها بعد نهيها أولاً {cite:sahih-muslim}.
    ويعرض مدخل [[practice/ziyarat-al-qubur|زيارة القبور]] موضعها من الشرع وما دخلها من اختلاف في العرف.

