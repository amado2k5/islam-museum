id: question/attribution-of-futuh-al-sham-waqidi
class: question
label:
  ar: "هل «فتوح الشام» المطبوع من تأليف الواقدي؟"
  en: "Is the printed Futuh al-Sham the work of al-Waqidi?"
summary:
  ar: "يُطبع «فتوح الشام» باسم الواقدي (ت 207هـ)، ويقول مصحح طبعة دار الكتب العلمية إنه كتاب فتوح الشام الذي ذكره ابن النديم في مصنفاته {cite:futuh-al-sham-ilmiyya-1997-v1 p.4}؛ وفي متنه نقول عن المسعودي والطبري وابن خلكان وذي النون المصري وقراءات للكتاب في مجالس لاحقة {cite:futuh-al-sham-ilmiyya-1997-v2 p.200} {cite:futuh-al-sham-ilmiyya-1997-v2 p.203} {cite:futuh-al-sham-ilmiyya-1997-v1 p.231}؛ ويرى بحث أكاديمي أن أصله للواقدي ثم أعيد تحريره بين القرنين الثاني عشر والثالث عشر الميلاديين {cite:dehghani-farsani-futuh-al-sham-thesis abstract}."
  en: "The Futuh al-Sham is printed under the name of al-Waqidi (d. 207 AH), and the editor of the Dar al-Kutub al-Ilmiyya edition identifies it with the Futuh al-Sham that Ibn al-Nadim lists among his works; its text quotes al-Mas'udi, al-Tabari, Ibn Khallikan and Dhu al-Nun al-Misri and records later readings of the book; an academic study holds that it is at root al-Waqidi's but was redacted between the 12th and 13th centuries CE."
wings: [words, ideas]
themes: [history-writing-and-social-thought, conquest-and-its-debates]
question:
  ar: "هل يصح أن يُنسب نص «فتوح الشام» المتداول إلى الواقدي؟"
  en: "Can the circulating text of Futuh al-Sham be ascribed to al-Waqidi?"
issue:
  ar: "نسبة الكتاب إلى مؤلفه، والتمييز بين أصل محتمل وزيادات لاحقة."
  en: "The ascription of the book to its author, and the distinction between a possible original and later additions."
short_answer:
  ar: "تنسبه الطبعة المتداولة إلى الواقدي، وتذكر الفهارس القديمة له كتاباً في فتوح الشام؛ لكن النص الحاضر يذكر رجالاً وكتباً متأخرة عنه، ويرى بحث أكاديمي أنه أصل للواقدي غُيّر في تحرير لاحق، فلا يُنسب كل ما فيه إليه."
  en: "The circulating edition ascribes it to al-Waqidi, and the old bibliographies list a book on the conquests of Syria among his works; but the present text names men and books later than him, and an academic study holds that it is an original of al-Waqidi's altered in a later redaction, so that not all of it can be ascribed to him."
perspectives:
  - tradition: sunni
    id: edition-ascription
    standing: main
    stance: { ar: "الكتاب للواقدي كما في الطبعة", en: "The book is al-Waqidi's, as the edition presents it" }
    summary:
      ar: "على غلاف الطبعة أنه «تأليف أبي عبد الله محمد بن عمر بن واقد الواقدي المتوفى سنة 207هـ»، وفي مقدمة المصحح عبد اللطيف عبد الرحمن قائمة مصنفات الواقدي من الفهرست لابن النديم، وفيها «كتاب فتوح الشام»، ويعلّق: «وهو الذي بين أيدينا». ولا تناقش الطبعة مخطوطات الكتاب ولا ما في متنه من أسماء متأخرة."
      en: "The edition's title page reads 'by Abu Abd Allah Muhammad ibn Umar ibn Waqid al-Waqidi, d. 207 AH', and the introduction by its editor Abd al-Latif Abd al-Rahman lists al-Waqidi's works from Ibn al-Nadim's al-Fihrist, among them 'Kitab Futuh al-Sham', with the comment: 'and it is the one before us'. The edition does not discuss the manuscripts or the later names in the text."
    sources: [source/futuh-al-sham-ilmiyya-1997-v1]
  - tradition: academic
    id: redaction
    standing: secondary
    stance: { ar: "أصله للواقدي ثم أعيد تحريره في القرنين 12–13م", en: "At root al-Waqidi's, redacted in the 12th-13th centuries CE" }
    summary:
      ar: "يذكر يونس دهقاني فارساني (أطروحة جامعة غوتنغن) أن الكتاب عُدّ منحولاً منذ أكثر من قرنين، ويرى أنه في جوهره «فتوح الشام» الأصلي للواقدي، غُيّر شكله وبعض مضمونه في تحرير لاحق يرجّح أنه بين القرنين الثاني عشر والثالث عشر الميلاديين، لأن نقول ابن عساكر من الأصل تختلف عن النص الحاضر، ولأن أقدم نسخة معروفة منه كُتبت سنة 678هـ/1279م؛ ويقترح أن هذا التحرير ربما خدم أغراضاً دينية زمن الحروب الصليبية في مصر أو الشام."
      en: "Yoones Dehghani Farsani (Göttingen dissertation) notes that the book has been considered a forgery for more than two centuries, and argues that it is essentially al-Waqidi's original Futuh al-Sham, changed in form and partly in content in a later redaction, probably between the 12th and 13th centuries CE, since Ibn Asakir's quotations from the original differ from the present text and the oldest known manuscript was copied in 678/1279; he suggests the redaction may have served religious aims during the Crusades, in Egypt or Syria."
    sources: [source/dehghani-farsani-futuh-al-sham-thesis]
long_answer:
  ar: "النص نفسه يحمل علامات على من تناقله بعد الواقدي: ففي خبر بيت المقدس يقول «الواقدي» إنهم كانوا يقرؤون الفتوح عند قبر أبي حنيفة على عبادة بن عوف الدينوري، ثم يُلحق بالكتاب سجعاً قاله عبادة {cite:futuh-al-sham-ilmiyya-1997-v1 p.231} {cite:futuh-al-sham-ilmiyya-1997-v1 p.232}؛ وفي خبر البهنسا يسمّي من أخذ عنهم: المسعودي وأبا جعفر الطبري (مكتوباً «الطبراني») وابن خلكان «في تاريخ البداية والنهاية» {cite:futuh-al-sham-ilmiyya-1997-v2 p.200} {cite:futuh-al-sham-ilmiyya-1997-v2 p.203}، ويقدّم له راوٍ مصري يقول إنه انتخب هذا الكتاب بعد زيارته جبانة البهنسا {cite:futuh-al-sham-ilmiyya-1997-v2 p.203} {cite:futuh-al-sham-ilmiyya-1997-v2 p.204}، ويختم برؤيا لذي النون المصري الذي أُحضر إلى المتوكل بعد زمن الواقدي {cite:futuh-al-sham-ilmiyya-1997-v2 p.291} {cite:tarikh-khulafa-minhaj-1434 p. 543}. وهذه العلامات تتفق مع القول بتحرير لاحق، ولا تحسم بنفسها هل في الكتاب أصل للواقدي."
  en: "The text itself bears marks of those who handed it on after al-Waqidi: in the Jerusalem account 'al-Waqidi' says they used to read the Futuh at the tomb of Abu Hanifa before Ubada ibn Awf al-Dinawari, and then attaches to the book a rhymed passage of Ubada's; in the al-Bahnasa account it names its authorities as al-Mas'udi, Abu Ja'far al-Tabari (spelled 'al-Tabarani') and Ibn Khallikan 'in the history al-Bidaya wa-l-nihaya'; an Egyptian narrator introduces that account, saying he selected this book after visiting the al-Bahnasa cemetery; and it ends with a dream of Dhu al-Nun al-Misri, who was brought before al-Mutawakkil after al-Waqidi's time. These marks fit the view of a later redaction, and do not by themselves settle whether an original of al-Waqidi's lies within the book."
