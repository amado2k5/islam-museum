question:
  ar: ما الدولة العباسية؟
short_answer:
  ar: الدولة العباسية (750–1258) خلافة بني العباس من بغداد؛ عصرها الذهبي في العلم والترجمة والتجارة ثم
    ممالكها المتتابعة حتى بغداد المغول.
long_answer:
  ar: الدولة العباسية خلفت الأموية بدعوى الرضا من آل محمد؛ نقلت العاصمة بغداد وبنت فيها بيت الحكمة وعصر
    الترجمة والتصنيف؛ ضعفت خلافتها الفعلية منذ منتصف القرن الثالث الهجري لصالح الأمراء والسلاطين حتى أسقطها
    هولاكو 1258. {cite:wikidata}
