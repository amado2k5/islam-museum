id: question/what-was-the-abbasid-caliphate
class: question
label:
  ar: ما الدولة العباسية؟
  en: What was the Abbasid caliphate?
  es: "¿Qué fue el califato abasí?"
  fr: "Qu'était-ce que le califat abbasside ?"
  ur: "عباسی خلافت کیا تھی؟"
summary:
  ar: الدولة العباسية (750–1258) خلافة بني العباس من بغداد؛ عصرها الذهبي في العلم والترجمة والتجارة ثم
    ممالكها المتتابعة حتى بغداد المغول.
  en: "The Abbasid caliphate (750-1258), the caliphate of the Banu al-Abbas from Baghdad; its golden age was in learning, translation and trade, and then came its successive kingdoms, down to Mongol Baghdad."
  es: "El califato abasí (750-1258), el califato de los Banu al-Abbas de Bagdad, tuvo su época dorada en el aprendizaje, la traducción y el comercio, y luego vinieron sus sucesivos reinos, hasta llegar al Bagdad mongol."
  fr: "Le califat abbasside (750-1258), le califat des Banu al-Abbas de Bagdad; son âge d'or fut celui de l'apprentissage, de la traduction et du commerce, puis vinrent ses royaumes successifs, jusqu'à Bagdad mongol."
  ur: "عباسی خلافت (750-1258)، بغداد سے بنو العباس کی خلافت؛ اس کا سنہری دور سیکھنے، ترجمہ اور تجارت میں تھا، اور پھر اس کی یکے بعد دیگرے سلطنتیں، منگول بغداد تک آئیں۔"
question:
  ar: ما الدولة العباسية؟
short_answer:
  ar: الدولة العباسية (750–1258) خلافة بني العباس من بغداد؛ عصرها الذهبي في العلم والترجمة والتجارة ثم
    ممالكها المتتابعة حتى بغداد المغول.
long_answer:
  ar: الدولة العباسية خلفت الأموية بدعوى الرضا من آل محمد؛ نقلت العاصمة بغداد وبنت فيها بيت الحكمة وعصر
    الترجمة والتصنيف؛ ضعفت خلافتها الفعلية منذ منتصف القرن الثالث الهجري لصالح الأمراء والسلاطين حتى أسقطها
    هولاكو 1258. {cite:wikidata}
