    التصوف ومؤسس تقليد المولوية.
long_answer:
  ar: '[[person/jalal-al-din-rumi|جلال الدين الرومي]] من أشهر شخصيات التراث الروحي الإسلامي؛ هاجر من بلخ
    قبل المغول فاستقر في قونية حيث درّس الفقه ثم التقى شمس تبريز ففاضت شاعريته. ترك المثنوي والديوان الكبير
    وفيه ما معناه، وأسس أتباعه من بعده الطريقة المولوية بدروانها المشهور. {cite:wikidata}'
