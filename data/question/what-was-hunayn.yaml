id: question/what-was-hunayn
class: question
label:
  ar: ما غزوة حنين؟
  en: What was the Battle of Hunayn?
  es: "¿Qué fue la batalla de Hunayn?"
  fr: "Qu'était-ce que la bataille de Hunayn ?"
  ur: "جنگ حنین کیا تھی؟"
  tr: "Hunayn Muharebesi neydi?"
  id: "Apa itu Pertempuran Hunayn?"
summary:
  ar: حنين 8هـ/630م بعد فتح مكة؛ واجه هوازن وثقيف فزاغ المسلمون أولًا لكثرتهم ثم نصرهم الله وأسروا أموالهم
    وسباياهم حتى الطائف.
  en: "Hunayn, 8 AH / 630 CE, after the conquest of Mecca; it was fought against Hawazin and Thaqif, and the Muslims at first wavered because of their large numbers, then God granted them victory, and they seized the property and captives of the enemy, as far as al-Ta'if."
  es: "Hunayn, 8 AH / 630 CE, después de la conquista de La Meca; se libró contra Hawazin y Thaqif, y los musulmanes al principio vacilaron debido a su gran número, luego Dios les concedió la victoria, y se apoderaron de las propiedades y los cautivos del enemigo, hasta al-Ta'if."
  fr: "Hunayn, 8 AH / 630 CE, après la conquête de La Mecque; elle fut livrée contre Hawazin et Thaqif, et les musulmans hésitèrent d'abord en raison de leur grand nombre, puis Dieu leur accorda la victoire, et ils s'emparèrent des biens et des captifs de l'ennemi, jusqu'à al-Ta'if."
  ur: "حنین، 8 ہجری / 630 عیسوی، فتح مکہ کے بعد؛ اس کا مقابلہ ہوازن اور ثقیف سے ہوا اور مسلمانوں نے پہلے تو اپنی زیادہ تعداد کی وجہ سے ڈگمگا دی، پھر اللہ تعالیٰ نے انہیں فتح عطا فرمائی اور طائف تک دشمن کے املاک اور قیدیوں پر قبضہ کر لیا۔"
  tr: "Hunayn, 8 Hicri / 630 AD, Mekke'nin fethinden sonra Hawazin ve Thaqif ile karşılaştı; bu yüzden Müslümanlar sayıca fazla oldukları için önce isyan ettiler, sonra Allah onları destekledi ve servetlerini ve esirlerini Taif'e kadar ele geçirdi."
  id: "Hunayn, 8 H / 630 M, setelah penaklukan Mekah, menghadapi Hawazin dan Thaqif, sehingga Muslim awalnya memberontak karena jumlah mereka, kemudian Tuhan mendukung mereka dan merebut kekayaan serta tawanan mereka hingga Taif."
question:
  ar: ما غزوة حنين؟
short_answer:
  ar: حنين 8هـ/630م بعد فتح مكة؛ واجه هوازن وثقيف فزاغ المسلمون أولًا لكثرتهم ثم نصرهم الله وأسروا أموالهم
    وسباياهم حتى الطائف.
long_answer:
  ar: '[[event/battle-of-hunayn|حنين]] في وادي بين مكة والطائف بعد الفتح؛ أسلت هوازن وثقيف بكل أموالهم
    فقال بعض المسلمين لن نغلب من قلة فهزمهم الله أولًا ثم ردهم؛ قسّم النبي الغنائم المؤلفة قلوبهم وردّ
    السبي بعد وفادة هوازن مسلمة. {cite:wikidata}'
