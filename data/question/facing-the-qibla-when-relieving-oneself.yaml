    id: open-country-only
    standing: main
    stance: { ar: "النهي في الصحارى، ولا بأس به في الأبنية", en: "The prohibition is for open country; within buildings there is no harm" }
    summary: { ar: "ذهب ابن عمر إلى أن النهي إنما جاء في الصحارى، وكذلك قال الشعبي، وإليه ذهب مالك والشافعي؛ ويرجّحه الخطابي لأن فيه جمعاً بين الأخبار المختلفة واستعمالها على وجوهها كلها، ويحكي في علّته أن الفضاء موضع صلاة ومتعبد للملائكة والإنس والجن، والقاعد فيه مستهدف للأبصار، وهذا مأمون في الأبنية.", en: "Ibn 'Umar held that the prohibition concerns open country only, as did al-Sha'bi, and Malik and al-Shafi'i followed this; al-Khattabi prefers it because it reconciles the differing reports and uses each of them, and gives as its reason that open ground is a place of prayer and worship for angels, humans and jinn where one sitting is exposed to view, which is not the case within buildings." }
