id: question/facing-the-qibla-when-relieving-oneself
class: question
label: { ar: "هل يُنهى عن استقبال القبلة عند قضاء الحاجة في كل مكان؟", en: "Is facing the qibla when relieving oneself forbidden everywhere?", ur: "کیا قضائے حاجت کے وقت قبلہ رخ ہونا ہر جگہ منع ہے؟", es: "¿Está prohibido en todas partes orientarse hacia la qibla al hacer las necesidades?", fr: "Est-il interdit partout de se tourner vers la qibla pour faire ses besoins ?", tr: "Her yerde kendini rahatlatırken Kıble ile yüzleşmek yasak mı?", id: "Apakah dilarang menghadapi Qibla saat buang air di mana-mana?" }
question: { ar: "هل يُنهى عن استقبال القبلة واستدبارها عند قضاء الحاجة في الصحراء والبنيان جميعاً، أم في الفضاء وحده؟", en: "Is facing or turning one's back to the qibla when relieving oneself forbidden both in open country and within buildings, or only in the open?", ur: "کیا قضائے حاجت کے وقت قبلہ کی طرف منہ یا پیٹھ کرنا صحرا اور عمارتوں دونوں میں منع ہے، یا صرف کھلی جگہ میں؟" }
issue: { ar: "تعارض ظاهري بين أحاديث النهي ⁦(سلمان، أبو هريرة، أبو أيوب)⁩ وأحاديث الرخصة ⁦(ابن عمر، جابر)⁩ في سنن أبي داود.", en: "An apparent conflict in Abu Dawud's Sunan between the reports of prohibition (Salman, Abu Hurayra, Abu Ayyub) and those of permission (Ibn 'Umar, Jabir)." }
summary:
  ar: "يروي أبو داود في «باب كراهية استقبال القبلة عند قضاء الحاجة» أحاديث النهي عن سلمان وأبي هريرة وأبي أيوب، ثم في «باب الرخصة في ذلك» حديث ابن عمر أنه رأى النبي على لبنتين مستقبل بيت المقدس لحاجته، وحديث جابر أنه رآه قبل وفاته بعام يستقبلها؛ ويحكي الخطابي قولين: تعميم النهي في الصحارى والأبنية ⁦(أبو أيوب وسفيان الثوري)⁩، وقصره على الصحارى ⁦(ابن عمر والشعبي ومالك والشافعي)⁩، ويرجّح الثاني لأنه يجمع بين الأخبار {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 19-22}."
  en: "In the 'chapter on the dislike of facing the qibla when relieving oneself' Abu Dawud gives the reports of prohibition from Salman, Abu Hurayra and Abu Ayyub, then in the 'chapter on the permission' Ibn 'Umar's report that he saw the Prophet on two bricks facing Jerusalem while relieving himself, and Jabir's that he saw him facing the qibla a year before he died; al-Khattabi relates two views — the prohibition applies in open country and buildings alike (Abu Ayyub, Sufyan al-Thawri), or only in open country (Ibn 'Umar, al-Sha'bi, Malik, al-Shafi'i) — and prefers the second because it reconciles the reports {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 19-22}."
  ur: "ابو داؤد «قضائے حاجت کے وقت قبلہ رخ ہونے کی کراہت کا باب» میں سلمان، ابو ہریرہ اور ابو ایوب سے ممانعت کی حدیثیں لاتے ہیں، پھر «اس کی رخصت کا باب» میں ابن عمر کی حدیث کہ انہوں نے نبی کو دو اینٹوں پر بیت المقدس کی طرف رخ کیے قضائے حاجت کرتے دیکھا، اور جابر کی حدیث کہ انہوں نے آپ کو وفات سے ایک سال پہلے قبلہ رخ دیکھا؛ خطابی دو قول نقل کرتے ہیں — ممانعت صحرا اور عمارتوں دونوں میں ⁦(ابو ایوب، سفیان ثوری)⁩، یا صرف صحرا میں ⁦(ابن عمر، شعبی، مالک، شافعی)⁩ — اور دوسرے کو ترجیح دیتے ہیں کیونکہ یہ روایات کو جمع کرتا ہے {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 19-22}۔"
  es: "En el capítulo sobre la aversión a mirar hacia la qibla al hacer sus necesidades, Abu Dawud presenta los informes de prohibición de Salman, Abu Hurayra y Abu Ayyub; luego, en el capítulo sobre el permiso, el informe de Ibn Umar de que vio al Profeta sobre dos ladrillos mirando hacia Jerusalén mientras hacía sus necesidades, y el de Jabir de que lo vio mirando hacia la qibla un año antes de su muerte; al-Khattabi relata dos puntos de vista: la prohibición se aplica tanto en campo abierto como en edificios (Abu Ayyub, Sufyan al-Thawri), o solo en campo abierto (Ibn Umar, al-Sha'bi, Malik, al-Shafi'i), y prefiere el segundo porque concilia los informes {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 19-22}."
  fr: "Dans le chapitre sur l'interdiction de se tourner vers la qibla pour faire ses besoins, Abou Dawoud rapporte les témoignages de Salman, Abou Hourayra et Abou Ayyoub concernant cette interdiction. Puis, dans le chapitre sur la permission, il cite le témoignage d'Ibn 'Umar, qui affirme avoir vu le Prophète assis sur deux briques, face à Jérusalem, en train de faire ses besoins, et celui de Jabir, qui affirme l'avoir vu face à la qibla un an avant sa mort. Al-Khattabi rapporte deux avis: l'interdiction s'applique aussi bien en terrain découvert que dans les bâtiments (Abou Ayyoub, Sufyan al-Thawri), ou seulement en terrain découvert (Ibn 'Umar, al-Sha'bi, Malik, al-Shafi'i). Il privilégie le second, car il concilie les témoignages {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 19-22}."
  tr: "Ebu Davud, \"İhtiyaçları Tatmin Ederken Kıbleyle Yüzleşmenin Hoşnutsuzluğu Üzerine Bölüm\"de Selman, Ebu Hureyre ve Ebu Eyyub'u yasaklayan hadisleri, ardından İbn Ömer'in hadisini \"O Taviz\" bölümünde Peygamber'i Kudüs'e bakan iki tuğla üzerinde gördüğünü ve Cabir'in hadisinde ölümünden bir yıl önce onu aldığını anlatır. El-Hattabi iki görüş anlatır: yasağı çöllerde ve binalarda genelleştirmek (Ebu Eyub ve Sufyan el-Thawri) ve bunu çöllerle sınırlamak (İbn Ömer, El-Şaabi, Malik ve El-Şafii). İkincisini tercih eder çünkü bu haberler {atıf:sunan-abi-davud-ibn-hazm-1997-v1 s. 19-22}"
  id: "Abu Dawood menceritakan dalam \"Bab tentang Ketidaksukaan Menghadapi Qibla Saat Memenuhi Kebutuhan\" hadits yang melarang Salman, Abu Huraira, dan Abu Ayyub, lalu dalam \"Bab tentang Konsesi dalam Itu\" hadis Ibn Umar yang mengatakan ia melihat Nabi di atas dua batu bata menghadap Yerusalem untuk kebutuhannya, dan hadis Jabir bahwa ia melihatnya setahun sebelum kematiannya untuk menerimanya. Al-Khattabi menceritakan dua pendapat: menggeneralisasi larangan di gurun dan bangunan (Abu Ayyub dan Sufyan al-Thawri), dan membatasinya hanya pada gurun (Ibn Umar, Al-Shaabi, Malik, dan Al-Shafi'i). Ia lebih memilih yang kedua karena menggabungkan laporan {cite:sunan-abi-dawud-ibn-hazm-1997-v1 hlm. 19-22}."
short_answer:
  ar: "قولان عند أهل السنة كما يحكيهما الخطابي: النهي عام ⁦(أبو أيوب، الثوري)⁩، أو خاص بالفضاء دون البنيان ⁦(ابن عمر، الشعبي، مالك، الشافعي)⁩، والخطابي يرجّح الثاني."
  en: "Two Sunni views as al-Khattabi relates them: the prohibition is general (Abu Ayyub, al-Thawri), or limited to open country and not buildings (Ibn 'Umar, al-Sha'bi, Malik, al-Shafi'i); al-Khattabi prefers the second."
  ur: "خطابی کے بیان کے مطابق اہلِ سنت کے دو قول: ممانعت عام ہے ⁦(ابو ایوب، ثوری)⁩، یا صرف کھلی جگہ کے لیے ہے عمارتوں کے لیے نہیں ⁦(ابن عمر، شعبی، مالک، شافعی)⁩؛ خطابی دوسرے کو ترجیح دیتے ہیں۔"
