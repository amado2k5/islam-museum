id: question/facing-the-qibla-when-relieving-oneself
class: question
label: { ar: "هل يُنهى عن استقبال القبلة عند قضاء الحاجة في كل مكان؟", en: "Is facing the qibla when relieving oneself forbidden everywhere?", ur: "کیا قضائے حاجت کے وقت قبلہ رخ ہونا ہر جگہ منع ہے؟" }
question: { ar: "هل يُنهى عن استقبال القبلة واستدبارها عند قضاء الحاجة في الصحراء والبنيان جميعاً، أم في الفضاء وحده؟", en: "Is facing or turning one's back to the qibla when relieving oneself forbidden both in open country and within buildings, or only in the open?", ur: "کیا قضائے حاجت کے وقت قبلہ کی طرف منہ یا پیٹھ کرنا صحرا اور عمارتوں دونوں میں منع ہے، یا صرف کھلی جگہ میں؟" }
issue: { ar: "تعارض ظاهري بين أحاديث النهي (سلمان، أبو هريرة، أبو أيوب) وأحاديث الرخصة (ابن عمر، جابر) في سنن أبي داود.", en: "An apparent conflict in Abu Dawud's Sunan between the reports of prohibition (Salman, Abu Hurayra, Abu Ayyub) and those of permission (Ibn 'Umar, Jabir)." }
summary:
  ar: "يروي أبو داود في «باب كراهية استقبال القبلة عند قضاء الحاجة» أحاديث النهي عن سلمان وأبي هريرة وأبي أيوب، ثم في «باب الرخصة في ذلك» حديث ابن عمر أنه رأى النبي على لبنتين مستقبل بيت المقدس لحاجته، وحديث جابر أنه رآه قبل وفاته بعام يستقبلها؛ ويحكي الخطابي قولين: تعميم النهي في الصحارى والأبنية (أبو أيوب وسفيان الثوري)، وقصره على الصحارى (ابن عمر والشعبي ومالك والشافعي)، ويرجّح الثاني لأنه يجمع بين الأخبار {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 19-22}."
  en: "In the 'chapter on the dislike of facing the qibla when relieving oneself' Abu Dawud gives the reports of prohibition from Salman, Abu Hurayra and Abu Ayyub, then in the 'chapter on the permission' Ibn 'Umar's report that he saw the Prophet on two bricks facing Jerusalem while relieving himself, and Jabir's that he saw him facing the qibla a year before he died; al-Khattabi relates two views — the prohibition applies in open country and buildings alike (Abu Ayyub, Sufyan al-Thawri), or only in open country (Ibn 'Umar, al-Sha'bi, Malik, al-Shafi'i) — and prefers the second because it reconciles the reports {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 19-22}."
  ur: "ابو داؤد «قضائے حاجت کے وقت قبلہ رخ ہونے کی کراہت کا باب» میں سلمان، ابو ہریرہ اور ابو ایوب سے ممانعت کی حدیثیں لاتے ہیں، پھر «اس کی رخصت کا باب» میں ابن عمر کی حدیث کہ انہوں نے نبی کو دو اینٹوں پر بیت المقدس کی طرف رخ کیے قضائے حاجت کرتے دیکھا، اور جابر کی حدیث کہ انہوں نے آپ کو وفات سے ایک سال پہلے قبلہ رخ دیکھا؛ خطابی دو قول نقل کرتے ہیں — ممانعت صحرا اور عمارتوں دونوں میں (ابو ایوب، سفیان ثوری)، یا صرف صحرا میں (ابن عمر، شعبی، مالک، شافعی) — اور دوسرے کو ترجیح دیتے ہیں کیونکہ یہ روایات کو جمع کرتا ہے {cite:sunan-abi-dawud-ibn-hazm-1997-v1 p. 19-22}۔"
short_answer:
  ar: "قولان عند أهل السنة كما يحكيهما الخطابي: النهي عام (أبو أيوب، الثوري)، أو خاص بالفضاء دون البنيان (ابن عمر، الشعبي، مالك، الشافعي)، والخطابي يرجّح الثاني."
  en: "Two Sunni views as al-Khattabi relates them: the prohibition is general (Abu Ayyub, al-Thawri), or limited to open country and not buildings (Ibn 'Umar, al-Sha'bi, Malik, al-Shafi'i); al-Khattabi prefers the second."
  ur: "خطابی کے بیان کے مطابق اہلِ سنت کے دو قول: ممانعت عام ہے (ابو ایوب، ثوری)، یا صرف کھلی جگہ کے لیے ہے عمارتوں کے لیے نہیں (ابن عمر، شعبی، مالک، شافعی)؛ خطابی دوسرے کو ترجیح دیتے ہیں۔"
perspectives:
