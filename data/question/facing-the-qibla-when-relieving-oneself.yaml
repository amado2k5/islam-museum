    summary: { ar: "ذهب أبو أيوب الأنصاري إلى تعميم النهي والتسوية بين الصحارى والأبنية، وهو مذهب سفيان الثوري؛ وفي حديثه عند أبي داود أنهم قدموا الشام فوجدوا مراحيض بنيت قبل القبلة فكانوا ينحرفون عنها ويستغفرون الله. ويرى الخطابي أن في هذا القول تعطيلاً لبعض الأخبار.", en: "Abu Ayyub al-Ansari held the prohibition to be general, making no distinction between open country and buildings, and this was the view of Sufyan al-Thawri; in his report in Abu Dawud they came to Syria, found latrines built facing the qibla, and would turn away from it and ask God's forgiveness. Al-Khattabi considers that this view leaves some reports unused." }
