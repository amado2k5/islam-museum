    أتباعًا في العالم الإسلامي.
long_answer:
  ar: '[[person/abu-hanifa|أبو حنيفة]] من تاجرة الكوفة إلى إمام المذهب الأوسع في الإسلام؛ درّس الفقه بالرأي
    والقياس فتتلمذ له أبو يوسف ومحمد بن الحسن. امتحن في عهد المنصور بالقضاء فأبى فسجن وضرب حتى مات؛ مذهبه
    الأكثر انتشارًا في تركيا وآسيا والهند. {cite:wikidata}'
