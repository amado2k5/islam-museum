id: question/who-was-abu-hanifa
class: question
label:
  ar: من كان أبو حنيفة؟
  en: Who was Abu Hanifa?
  es: "¿Quién fue Abu Hanifa?"
  fr: "Qui était Abu Hanifa ?"
  ur: "ابو حنیفہ کون تھے؟"
  tr: "Abu Hanifa'nın kimdi?"
  id: "Siapakah Abu Hanifa?"
summary:
  ar: النعمان بن ثابت أبو حنيفة (699–767) إمام الفقه الرأي في الكوفة؛ أول أئمة المذاهب الأربعة وأكثرها
    أتباعًا في العالم الإسلامي.
  en: "Al-Nu'man ibn Thabit, Abu Hanifa (699–767), was the imam of reasoned jurisprudence (ra'y) in Kufa. He was the first of the imams of the four schools of law and the one with the most followers in the Muslim world."
  es: "Al-Nu'man ibn Thabit, Abu Hanifa (699-767), fue el imán de la jurisprudencia razonada (ra'y) en Kufa. Fue el primero de los imanes de las cuatro escuelas de derecho y el que contó con más seguidores en el mundo musulmán."
  fr: "Al-Nu'man ibn Thabit, dit Abu Hanifa (699-767), fut l'imam de la jurisprudence raisonnée (ra'y) à Koufa. Il fut le premier des imams des quatre écoles de droit et celui qui compta le plus grand nombre de disciples dans le monde musulman."
  ur: "النعمان بن ثابت، ابو حنیفہ (699-767)، کوفہ میں معقول فقہ ⁦(رعی)⁩ کے امام تھے۔ وہ قانون کے چار مکاتب کے اماموں میں سے پہلے اور مسلم دنیا میں سب سے زیادہ پیروکاروں کے ساتھ تھے۔"
  tr: "Al-Nu'man ibn Thabit Abu Hanifa (699–767), Kufe'nin önde gelen hukukçusuydu; İslam dünyasındaki dört düşünce okulundan ilki ve en çok takip edilen okuldur."
  id: "Al-Nu'man ibn Thabit Abu Hanifa (699–767) adalah ahli hukum terkemuka di Kufa; yang pertama dan paling banyak mengikuti dari empat aliran pemikiran di dunia Islam."
question:
  ar: من كان أبو حنيفة؟
short_answer:
  ar: النعمان بن ثابت أبو حنيفة (699–767) إمام الفقه الرأي في الكوفة؛ أول أئمة المذاهب الأربعة وأكثرها
    أتباعًا في العالم الإسلامي.
long_answer:
  ar: '[[person/abu-hanifa|أبو حنيفة]] من تاجرة الكوفة إلى إمام المذهب الأوسع في الإسلام؛ درّس الفقه بالرأي
    والقياس فتتلمذ له أبو يوسف ومحمد بن الحسن. امتحن في عهد المنصور بالقضاء فأبى فسجن وضرب حتى مات؛ مذهبه
    الأكثر انتشارًا في تركيا وآسيا والهند. {cite:wikidata}'
