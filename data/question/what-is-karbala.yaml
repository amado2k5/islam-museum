long_answer:
  ar: '[[place/karbala|كربلاء]] على الفرات غرب بغداد؛ استشهد فيها الحسين بن علي بن أبي طالب وأهل بيته
    وصحبه يوم عاشوراء 680 في موقعة غيّرت التاريخ الإسلامي؛ فيها قبره وقبة الإمام الحسين أعظم مزارات الشيعة
