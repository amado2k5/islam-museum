question:
  ar: من كان فخر الدين الرازي؟
short_answer:
  ar: فخر الدين الرازي (1149–1209) إمام الكلام والتفسير؛ صاحب مفاتيح الغيب أكمل تفاسير عصره جدلًا وفلسفة.
long_answer:
  ar: '[[person/fakhr-al-din-al-razi|فخر الدين الرازي]] من علماء الخوارزمية؛ جمع في تفسيره مفاتيح الغيب
    التفسير بالنقل والعقل والفلسفة والتصوف فصار موسوعة الدراسات القرآنية في عصره، وله مؤلفات في الأصول
    والكلام والفلسفة والطب. {cite:wikidata}'
