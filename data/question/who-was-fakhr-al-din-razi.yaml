id: question/who-was-fakhr-al-din-razi
class: question
label:
  ar: من كان فخر الدين الرازي؟
  en: Who was Fakhr al-Din al-Razi?
  es: "¿Quién fue Fakhr al-Din al-Razi?"
  fr: "Qui était Fakhr al-Din al-Razi ?"
  ur: "فخرالدین الرازی کون تھا؟"
  tr: "Fahriddin el-Razi kimdi?"
  id: "Siapa Fakhr al-Din al-Razi?"
summary:
  ar: فخر الدين الرازي (1149–1209) إمام الكلام والتفسير؛ صاحب مفاتيح الغيب أكمل تفاسير عصره جدلًا وفلسفة.
  en: "Fakhr al-Din al-Razi (1149–1209) was an imam of kalam and tafsir; he was the author of Mafatih al-Ghayb, the most complete exegesis of his age in dialectic and philosophy."
  es: "Fakhr al-Din al-Razi (1149–1209) fue un imán de kalam y tafsir; fue el autor de Mafatih al-Ghayb, la exégesis más completa de su época en dialéctica y filosofía."
  fr: "Fakhr al-Din al-Razi (1149–1209) était un imam de kalam et de tafsir; il était l'auteur de Mafatih al-Ghayb, l'exégèse la plus complète de son époque en dialectique et en philosophie."
  ur: "فخر الدین الرازی (1149-1209) کلام اور تفسیر کے امام تھے۔ وہ مفاتیح الغیب کے مصنف تھے، جو جدلیاتی اور فلسفہ میں اپنی عمر کی سب سے مکمل تفسیر ہے۔"
  tr: "Fakhr al-Din al-Razi (1149–1209), teoloji ve tefsir alanının önde gelen âlimiydi; Mafatih al-Ghayb'ın yazarıydı ve hem münazara hem de felsefe alanında döneminin tefsirini tamamladı."
  id: "Fakhr al-Din al-Razi (1149–1209) adalah sarjana terkemuka dalam bidang teologi dan eksegesis; penulis Mafatih al-Ghayb, yang menyelesaikan eksposisi zamannya baik dalam debat maupun filsafat."
question:
  ar: من كان فخر الدين الرازي؟
short_answer:
  ar: فخر الدين الرازي (1149–1209) إمام الكلام والتفسير؛ صاحب مفاتيح الغيب أكمل تفاسير عصره جدلًا وفلسفة.
long_answer:
  ar: '[[person/fakhr-al-din-al-razi|فخر الدين الرازي]] من علماء الخوارزمية؛ جمع في تفسيره مفاتيح الغيب
    التفسير بالنقل والعقل والفلسفة والتصوف فصار موسوعة الدراسات القرآنية في عصره، وله مؤلفات في الأصول
    والكلام والفلسفة والطب. {cite:wikidata}'
