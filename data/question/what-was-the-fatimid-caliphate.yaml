id: question/what-was-the-fatimid-caliphate
class: question
label:
  ar: ما الدولة الفاطمية؟
  en: What was the Fatimid caliphate?
  es: "¿Qué fue el califato fatimí?"
  fr: "Qu'était-ce que le califat fatimide ?"
summary:
  ar: الدولة الفاطمية (909–1171) خلافة إسماعيلية شمال أفريقية ثم مصرية؛ أسست القاهرة والأزهر وحكمت نحو
    قرنين ونصف.
  en: "The Fatimid caliphate (909-1171), an Isma'ili caliphate first in North Africa and then in Egypt; it founded Cairo and al-Azhar, and ruled for about two and a half centuries."
  es: "El califato fatimí (909-1171), un califato ismaelita que primero estuvo en el norte de África y luego en Egipto, fundó El Cairo y Al-Azhar, y gobernó durante aproximadamente dos siglos y medio."
  fr: "Le califat fatimide (909-1171), un califat ismaélien d'abord en Afrique du Nord puis en Égypte; il a fondé le Caire et al-Azhar, et a régné pendant environ deux siècles et demi."
question:
  ar: ما الدولة الفاطمية؟
short_answer:
  ar: الدولة الفاطمية (909–1171) خلافة إسماعيلية شمال أفريقية ثم مصرية؛ أسست القاهرة والأزهر وحكمت نحو
    قرنين ونصف.
long_answer:
  ar: الدولة الفاطمية قام بها عبيد الله المهدي بالمغرب 909 ثم نقلها المعز لدين الله إلى مصر فأسس القاهرة
    والجامع الأزهر 970؛ ادّعت النسب إلى فاطمة بنت النبي وحكمت بمذهبها الإسماعيلي دولة عظمى في البحر المتوسط
    حتى أسقطها صلاح الدين 1171. {cite:wikidata}
