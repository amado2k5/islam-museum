question:
  ar: ما الدولة الفاطمية؟
short_answer:
  ar: الدولة الفاطمية (909–1171) خلافة إسماعيلية شمال أفريقية ثم مصرية؛ أسست القاهرة والأزهر وحكمت نحو
    قرنين ونصف.
long_answer:
  ar: الدولة الفاطمية قام بها عبيد الله المهدي بالمغرب 909 ثم نقلها المعز لدين الله إلى مصر فأسس القاهرة
    والجامع الأزهر 970؛ ادّعت النسب إلى فاطمة بنت النبي وحكمت بمذهبها الإسماعيلي دولة عظمى في البحر المتوسط
    حتى أسقطها صلاح الدين 1171. {cite:wikidata}
