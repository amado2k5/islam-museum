  fr: "Ibn Sina (980-1037), philosophe et médecin, est l'auteur du Canon de la médecine, une référence occidentale depuis des siècles, et d'al-Shifa' en philosophie; l'un des plus grands esprits de l'histoire."
question:
  ar: من كان ابن سينا؟
short_answer:
  ar: ابن سينا (980–1037) فيلسوف وطبيب؛ صاحب القانون في الطب المرجع الغربي قرونًا والشفاء في الفلسفة؛
    من أعظم عقول التاريخ.
long_answer:
  ar: '[[person/ibn-sina|ابن سينا]] الأفشني؛ حفظ القرآن طفلًا وطبّ شابًا وصنّف القانون في الطب الذي درّسه
    الغرب حتى القرن السابع عشر والشفاء في الفلسفة. يعد من أعظم العلماء في التاريخ وإن اختلف في نسبته إلى
    السنّة. {cite:wikidata}'
