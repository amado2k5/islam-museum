label:
  ar: من كان نوح؟
  en: Who was Nuh?
summary:
  ar: نوح أول الرسل أولي العزم؛ دعا قومه ألف سنة إلا خمسين فلم يؤمن إلا قليل، وبنى السفينة بأمر الله فنجا
    المؤمنون بالطوفان.
  en: "Nuh, the first of the Messengers of Steadfast Resolve; he called his people for a thousand years less fifty, and only a few believed. He built the ark by God's command, and the believers were saved from the Flood."
question:
