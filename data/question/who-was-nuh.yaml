long_answer:
  ar: '[[person/nuh|نوح]] أول رسول إلى أهل الأرض؛ دعا قومه للتوحيد تسعمئة وخمسين سنة فأبى أكثرهم؛ أمره
    الله ببناء السفينة فنجا فيها هو ومن آمن معه ومن كل زوجين اثنين؛ قصته في هود ونوح ونحو ثلاثين موضعًا
    من القرآن. {cite:tanzil-quran}'
