id: question/who-was-nuh
class: question
label:
  ar: من كان نوح؟
  en: Who was Nuh?
  es: "¿Quién era Nuh?"
  fr: "Qui était Nuh ?"
summary:
  ar: نوح أول الرسل أولي العزم؛ دعا قومه ألف سنة إلا خمسين فلم يؤمن إلا قليل، وبنى السفينة بأمر الله فنجا
    المؤمنون بالطوفان.
  en: "Nuh, the first of the Messengers of Steadfast Resolve; he called his people for a thousand years less fifty, and only a few believed. He built the ark by God's command, and the believers were saved from the Flood."
  es: "Noé, el primero de los Mensajeros de la Firmeza, llamó a su pueblo durante mil años menos cincuenta, pero solo unos pocos creyeron. Construyó el arca por mandato de Dios, y los creyentes se salvaron del Diluvio."
  fr: "Noé, le premier des Messagers à la résolution inébranlable, appela son peuple pendant mille ans moins cinquante, et seuls quelques-uns crurent. Il construisit l'arche sur l'ordre de Dieu, et les croyants furent sauvés du Déluge."
question:
  ar: من كان نوح؟
short_answer:
  ar: نوح أول الرسل أولي العزم؛ دعا قومه ألف سنة إلا خمسين فلم يؤمن إلا قليل، وبنى السفينة بأمر الله فنجا
    المؤمنون بالطوفان.
long_answer:
  ar: '[[person/nuh|نوح]] أول رسول إلى أهل الأرض؛ دعا قومه للتوحيد تسعمئة وخمسين سنة فأبى أكثرهم؛ أمره
    الله ببناء السفينة فنجا فيها هو ومن آمن معه ومن كل زوجين اثنين؛ قصته في هود ونوح ونحو ثلاثين موضعًا
    من القرآن. {cite:tanzil-quran}'
