label:
  ar: ما الذي كان يدين به العرب قبل الإسلام؟
  en: What did the Arabs believe before Islam?
summary:
  ar: كان أكثر العرب على الشرك وعبادة الأصنام مع بقايا من دين إبراهيم كالحج والطواف، وكان فيهم يهود في يثرب وخيبر وتيماء واليمن، ونصارى في نجران والشام والحيرة، ومجوس في عراق العرب والبحرين، وبقايا من الصابئة.
  en: "Most Arabs practised polytheism and idol worship, though remnants of the religion of Ibrahim survived, such as the hajj and the circumambulation of the House. Jews lived in Yathrib, Khaybar, Tayma and Yemen; Christians in Najran, Syria and al-Hira; Magians in the Arab lands of Iraq and in Bahrain; and there were remnants of the Sabians."
