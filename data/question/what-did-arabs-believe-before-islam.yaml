question:
  ar: ما الذي كان يدين به العرب قبل الإسلام؟
short_answer:
  ar: كان أكثر العرب على الشرك وعبادة الأصنام مع بقايا من دين إبراهيم كالحج والطواف، وكان فيهم يهود في يثرب وخيبر وتيماء واليمن، ونصارى في نجران والشام والحيرة، ومجوس في عراق العرب والبحرين، وبقايا من الصابئة.
long_answer:
  ar: |
    يذكر الرحيق المختوم أن معظم العرب كانوا على دين إبراهيم بدعوة إسماعيل حتى طال عليهم الأمد، فجاء عمرو بن لحي بهبل من الشام ودعا أهل مكة إلى الشرك، فكثرت الأصنام حتى صار في كل بيت صنم، وصار الشرك أكبر مظهر من مظاهر دين أهل الجاهلية، كما يعرض مدخل [[concept/diyanat-al-jahiliyya|ديانات العرب]] {cite:mubarakpuri-raheeq p.35} {cite:mubarakpuri-raheeq p.36}.
    وبقيت فيهم بقايا من دين إبراهيم كتعظيم البيت والطواف به والحج والعمرة والوقوف بعرفة، وإن ابتدعوا فيها بدعاً {cite:mubarakpuri-raheeq p.38}.
    ووجدت اليهودية والنصرانية والمجوسية والصابئية سبيلاً إلى ربوع العرب: اليهود في يثرب وخيبر وتيماء واليمن، والنصارى في نجران وعند الغساسنة وتغلب وطيء، والمجوس بجوار الفرس في العراق والبحرين، وبقايا الصابئة معهم، كما يعرض مدخلا [[concept/judaism-in-arabia|اليهودية]] و[[concept/christianity-in-arabia|النصرانية]] {cite:mubarakpuri-raheeq p.39} {cite:mubarakpuri-raheeq p.40} {cite:mubarakpuri-raheeq p.41}.
