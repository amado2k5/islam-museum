id: question/what-is-adhan
class: question
label:
  ar: "ما الأذان؟"
  en: What is the adhan?
  es: "¿Qué es el adhan?"
  fr: "Qu'est-ce que l'adhan ?"
  ur: "اذان کیا ہے؟"
  tr: "Ezan nedir?"
  id: "Apa panggilan untuk berdoa?"
summary:
  ar: "الأذان نداء علني للصلاة بصيغة ثابتة: الله أكبر، الشهادتان، حي على الصلاة وحي على الفلاح."
  en: "The adhan is a public call to prayer in a fixed form: Allahu akbar, the two testimonies of faith, hayya 'ala al-salah, and hayya 'ala al-falah."
  es: "El adhan es una llamada pública a la oración en una forma fija: Allahu akbar, los dos testimonios de fe, hayya 'ala al-salah, y hayya 'ala al-falah."
  fr: "L'adhan est un appel public à la prière sous une forme fixe: Allahu akbar, les deux témoignages de foi, hayya 'ala al-salah, et hayya 'ala al-falah."
  ur: "اذان ایک مقررہ شکل میں نماز کے لیے ایک عوامی اذان ہے: اللہ اکبر، ایمان کی دو شہادتیں، حی علی الصلاۃ، اور حیا علی الفلاح۔"
  tr: "Ezan ise belirli bir biçimde halka açık bir ezan çağrısıdır: Allahu Ekber, iki şahitlik, hyhya 'ala al-salat, hyhya ala al-falah."
  id: "Seruan salat adalah seruan salat publik dalam bentuk tetap: Allahu Akbar, dua kesaksian, hyhya 'ala al-salat, hyhya ala al-falah."
wings: []
question:
  ar: "ما الأذان؟"
short_answer:
  ar: "الأذان نداء علني للصلاة بصيغة ثابتة: الله أكبر، الشهادتان، حي على الصلاة وحي على الفلاح."
long_answer:
  ar: |
    الأذان شعيرة ظاهرة من شعائر الإسلام، يعلن دخول وقت الصلاة ويدعو إليها {cite:sahih-al-bukhari}.
    ويعرض مدخل [[practice/adhan|الأذان]] صيغته ووقته، ويرتبط ب[[practice/salah|الصلاة]] التي ينادي إليها.

