label:
  ar: "ما الأذان؟"
  en: What is the adhan?
summary:
  ar: "الأذان نداء علني للصلاة بصيغة ثابتة: الله أكبر، الشهادتان، حي على الصلاة وحي على الفلاح."
  en: "The adhan is a public call to prayer in a fixed form: Allahu akbar, the two testimonies of faith, hayya 'ala al-salah, and hayya 'ala al-falah."
wings: []
question:
  ar: "ما الأذان؟"
short_answer:
  ar: "الأذان نداء علني للصلاة بصيغة ثابتة: الله أكبر، الشهادتان، حي على الصلاة وحي على الفلاح."
long_answer:
  ar: |
    الأذان شعيرة ظاهرة من شعائر الإسلام، يعلن دخول وقت الصلاة ويدعو إليها {cite:sahih-al-bukhari}.
    ويعرض مدخل [[practice/adhan|الأذان]] صيغته ووقته، ويرتبط ب[[practice/salah|الصلاة]] التي ينادي إليها.

