short_answer:
  ar: مالك بن أنس (711–795) إمام دار الهجرة؛ جمع الموطأ فكان أول مدوّن للفقه والحديث في المدينة ومنهجه
    عمل أهلها.
long_answer:
  ar: '[[person/malik-ibn-anas|الإمام مالك]] مدني صرف؛ لم يفارق المدينة إلا للحج ودرّسها نحو سبعين سنة.
    صنّف الموطأ فصار أشهر مدوّن للسنة والفقه؛ مذهبه الغالب في المغرب والأندلس والسودان والخليج. {cite:wikidata}'
