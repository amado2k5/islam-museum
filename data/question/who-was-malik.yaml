id: question/who-was-malik
class: question
label:
  ar: من كان مالك بن أنس؟
  en: Who was Malik ibn Anas?
  es: "¿Quién fue Malik ibn Anas?"
  fr: "Qui était Malik ibn Anas ?"
  ur: "مالک بن انس کون تھے؟"
  tr: "Malik ibn Anas kimdi?"
  id: "Siapakah Malik ibn Anas?"
summary:
  ar: مالك بن أنس (711–795) إمام دار الهجرة؛ جمع الموطأ فكان أول مدوّن للفقه والحديث في المدينة ومنهجه
    عمل أهلها.
  en: "Malik ibn Anas (711–795), Imam of the Abode of Migration; he compiled the Muwatta, making him the first to compile jurisprudence and hadith in Medina, and his approach was the practice of its people."
  es: "Malik ibn Anas (711–795), Imán de la Morada de la Emigración; compiló el Muwatta, convirtiéndose así en el primero en recopilar jurisprudencia y hadices en Medina, y su enfoque era la práctica de sus habitantes."
  fr: "Malik ibn Anas (711–795), Imam de la Maison de l'Émigration; il a compilé le Muwatta, ce qui fait de lui le premier à compiler la jurisprudence et les hadiths à Médine, et son approche était la pratique de son peuple."
  ur: "مالک ابن انس (711-795)، ہجرت کے گھر کے امام؛ اس نے موطا کو مرتب کیا، جس سے وہ مدینہ میں فقہ اور حدیث کو مرتب کرنے والے پہلے شخص تھے، اور اس کا طریقہ وہاں کے لوگوں کا طرز عمل تھا۔"
  tr: "Malik ibn Anas (711–795), Göç Evi'nin imamı idi; Muwatta'yı derledi ve Medine'deki ilk hukuk ve hadis derleyicisi oldu; metodolojisi halkı tarafından da takip edildi."
  id: "Malik ibn Anas (711–795) adalah Imam dari Rumah Migrasi; ia menyusun Muwatta, menjadikannya penyusun pertama fiqhis dan hadis di Madinah, dan metodologinya diikuti oleh masyarakatnya."
question:
  ar: من كان مالك بن أنس؟
short_answer:
  ar: مالك بن أنس (711–795) إمام دار الهجرة؛ جمع الموطأ فكان أول مدوّن للفقه والحديث في المدينة ومنهجه
    عمل أهلها.
long_answer:
  ar: '[[person/malik-ibn-anas|الإمام مالك]] مدني صرف؛ لم يفارق المدينة إلا للحج ودرّسها نحو سبعين سنة.
    صنّف الموطأ فصار أشهر مدوّن للسنة والفقه؛ مذهبه الغالب في المغرب والأندلس والسودان والخليج. {cite:wikidata}'
