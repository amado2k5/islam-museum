    stance: { ar: "الحديث صحيح، وهو تشبيه في الاستخلاف على المدينة لا يدل على الخلافة بعد الموت", en: "The hadith is sound, a comparison in deputising over Medina that does not indicate succession after death", ur: "حدیث صحیح ہے، مدینہ پر نیابت میں تشبیہ ہے جو موت کے بعد خلافت پر دلالت نہیں کرتی" }
    summary: { ar: "يقول ابن تيمية إن الحديث ثابت في الصحيحين، قاله النبي لعلي في غزوة تبوك لما خرج إليه يبكي ويقول أتخلفني مع النساء والصبيان، فبين له أن جنس الاستخلاف كرامة وأمانة لا نقص، إذ فعله موسى بهارون. ويرى أن التشبيه يكون بحسب السياق لا في كل شيء، كما شبه النبي أبا بكر بإبراهيم وعيسى وعمر بنوح وموسى؛ وأن النبي استخلف على المدينة غير علي في غزوات كثيرة وفي حجة الوداع بعد تبوك؛ وأن عليا كان بعدها مأموراً مع أبي بكر في حج سنة تسع؛ وأن الاستخلاف في الحياة نيابة ووكالة، أما بعد الموت فولاية مستقلة.", en: "Ibn Taymiyya says the hadith is established in the two Sahihs: the Prophet said it to Ali at Tabuk when Ali came out to him weeping, 'Are you leaving me behind with the women and children?', showing him that being made deputy is an honour and a trust, not a slight, since Moses did it with Aaron. A comparison holds as far as its context requires, not in everything – as the Prophet likened Abu Bakr to Abraham and Jesus and Umar to Noah and Moses. The Prophet left others than Ali in charge of Medina in many campaigns and in the Farewell Pilgrimage after Tabuk; after Tabuk Ali served under Abu Bakr in the pilgrimage of the year 9; and deputising in life is agency, whereas appointment after death is independent authority.", ur: "ابن تیمیہ کہتے ہیں کہ حدیث صحیحین میں ثابت ہے: نبی نے تبوک کے موقع پر علی سے یہ فرمایا جب وہ روتے ہوئے نکلے کہ کیا آپ مجھے عورتوں اور بچوں کے ساتھ چھوڑ رہے ہیں؟ اور انہیں بتایا کہ نائب بنایا جانا عزت اور امانت ہے، کمی نہیں، کیونکہ موسیٰ نے ہارون کے ساتھ یہی کیا۔ تشبیہ سیاق کے مطابق ہوتی ہے، ہر چیز میں نہیں – جیسے نبی نے ابو بکر کو ابراہیم اور عیسیٰ سے اور عمر کو نوح اور موسیٰ سے تشبیہ دی۔ نبی نے بہت سے غزوات میں اور تبوک کے بعد حجۃ الوداع میں علی کے سوا دوسروں کو مدینہ پر نائب بنایا؛ تبوک کے بعد سنہ 9 کے حج میں علی ابو بکر کے ماتحت تھے؛ اور زندگی میں نیابت وکالت ہے، جبکہ موت کے بعد تقرری مستقل ولایت۔" }
