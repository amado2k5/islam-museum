    summary: { ar: "في نقل ابن تيمية: يقول الحلي إن الاستثناء في الحديث يدل على أنه أثبت لعلي جميع منازل هارون من موسى، ومن منازل هارون أنه كان خليفة لموسى ولو عاش بعده لكان خليفته، وإلا لزم النقص؛ ولأنه استخلفه مع وجوده وغيبته مدة يسيرة فبعد موته وطول الغيبة أولى. ويضيف الحلي في دليله الرابع أنه استخلفه على المدينة ولم يعزله فيكون خليفته فيها وفي غيرها. هذا عرض خصمه لحجته، ويحتاج إلى نص الحلي في كتابه منهاج الكرامة وإلى مصادر الإمامية أنفسهم.", en: "As Ibn Taymiyya quotes him: al-Hilli says the exception in the hadith shows that it gives Ali all of Aaron's ranks with Moses; one of them was that Aaron was Moses' deputy and, had he outlived him, would have been his successor – otherwise there would be a demotion; and since the Prophet appointed him while present and for a short absence, all the more so after his death and the long absence. In his fourth proof al-Hilli adds that the Prophet appointed him over Medina and never removed him, so he remained his deputy there and elsewhere. This is his opponent's presentation of his argument; it needs al-Hilli's own text in Minhaj al-Karama and the Imami sources themselves.", ur: "ابن تیمیہ کی نقل میں: حلی کہتے ہیں کہ حدیث میں استثنا ظاہر کرتا ہے کہ علی کو موسیٰ کے ساتھ ہارون کے تمام مراتب دیے گئے؛ ان میں سے ایک یہ تھا کہ ہارون موسیٰ کے نائب تھے اور اگر ان کے بعد زندہ رہتے تو ان کے خلیفہ ہوتے، ورنہ درجہ گھٹانا لازم آتا؛ اور چونکہ نبی نے انہیں اپنی موجودگی میں اور مختصر غیر موجودگی کے لیے نائب بنایا تو موت اور طویل غیر موجودگی کے بعد بدرجۂ اولیٰ۔ اپنی چوتھی دلیل میں حلی مزید کہتے ہیں کہ نبی نے انہیں مدینہ پر نائب بنایا اور کبھی معزول نہیں کیا، لہٰذا وہ وہاں اور دوسری جگہوں پر ان کے نائب رہے۔ یہ ان کے مخالف کی طرف سے ان کی دلیل کی پیشکش ہے؛ اس کے لیے منہاج الکرامہ میں حلی کا اپنا متن اور امامیہ کے اپنے مصادر درکار ہیں۔" }
