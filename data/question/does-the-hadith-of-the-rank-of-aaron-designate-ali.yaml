id: question/does-the-hadith-of-the-rank-of-aaron-designate-ali
class: question
label: { ar: "هل يدل حديث «أنت مني بمنزلة هارون من موسى» على خلافة علي؟", en: "Does the hadith 'You are to me as Aaron was to Moses' designate Ali as successor?", ur: "کیا حدیث «تم میرے لیے ایسے ہو جیسے ہارون موسیٰ کے لیے» علی کی خلافت پر دلالت کرتی ہے؟" }
summary:
  ar: "جعل ابن المطهر الحلي حديث المنزلة ثالث أدلته الحديثية على إمامة علي: أثبت له منازل هارون كلها إلا النبوة، ومنها الخلافة. ويرد ابن تيمية في منهاج السنة بأن الحديث ثابت في الصحيحين لكنه قيل في استخلافه على المدينة في غزوة تبوك تطييباً لقلبه، وأن التشبيه لا يقتضي المساواة من كل وجه، وأن الاستخلاف في الحياة غير الاستخلاف بعد الموت."
  en: "Ibn al-Mutahhar al-Hilli made the hadith of the rank (manzila) the third of his hadith proofs for Ali's imamate: it gives him all of Aaron's ranks except prophethood, among them succession. Ibn Taymiyya replies in Minhaj al-Sunna that the hadith is established in the two Sahihs but was said when Ali was left in charge of Medina during the Tabuk campaign, to console him; that a comparison does not entail equality in every respect; and that deputising in life is not succession after death."
  ur: "ابن المطہر حلی نے حدیثِ منزلت کو علی کی امامت پر اپنی حدیثی دلیلوں میں تیسری دلیل بنایا: اس میں انہیں نبوت کے سوا ہارون کے سب مراتب دیے گئے، جن میں خلافت بھی ہے۔ ابن تیمیہ منہاج السنہ میں جواب دیتے ہیں کہ حدیث صحیحین میں ثابت ہے مگر یہ غزوۂ تبوک میں مدینہ پر انہیں نائب بنانے کے موقع پر ان کی دل جوئی کے لیے فرمائی گئی؛ تشبیہ ہر لحاظ سے برابری کا تقاضا نہیں کرتی؛ اور زندگی میں نیابت موت کے بعد کی خلافت نہیں۔"
question: { ar: "هل يدل حديث «أنت مني بمنزلة هارون من موسى» على خلافة علي؟", en: "Does the hadith 'You are to me as Aaron was to Moses' designate Ali as successor?", ur: "کیا حدیث «تم میرے لیے ایسے ہو جیسے ہارون موسیٰ کے لیے» علی کی خلافت پر دلالت کرتی ہے؟" }
issue:
  ar: "هل قول النبي لعلي «أنت مني بمنزلة هارون من موسى إلا أنه لا نبي بعدي» يثبت له منازل هارون كلها ومنها الخلافة بعد الموت، أم هو تشبيه في الاستخلاف على المدينة مدة الغيبة في غزوة تبوك؟"
  en: "Does the Prophet's saying to Ali, 'You are to me as Aaron was to Moses, except that there is no prophet after me', give him all of Aaron's ranks, including succession after death, or is it a comparison limited to being left in charge of Medina during the Tabuk campaign?"
  ur: "کیا نبی کا علی سے یہ فرمانا «تم میرے لیے ایسے ہو جیسے ہارون موسیٰ کے لیے، مگر یہ کہ میرے بعد کوئی نبی نہیں» انہیں ہارون کے تمام مراتب، بشمول موت کے بعد خلافت، دیتا ہے، یا یہ غزوۂ تبوک کی غیر موجودگی کے دوران مدینہ پر نیابت تک محدود تشبیہ ہے؟"
short_answer:
  ar: "ابن تيمية ⁦(أهل السنة)⁩: الحديث صحيح، وهو تشبيه في الاستخلاف على المدينة يوم تبوك تطييباً لقلب علي، ولا يدل على أفضلية ولا إمامة. الحلي كما ينقله ابن تيمية: الاستثناء يثبت له جميع منازل هارون، ومنها الخلافة، وإذا استخلفه في غيبة قصيرة فبعد الموت أولى."
  en: "Ibn Taymiyya (Sunni): the hadith is sound; it is a comparison in being left in charge of Medina at Tabuk, to console Ali, and indicates neither superiority nor imamate. Al-Hilli as Ibn Taymiyya quotes him: the exception gives Ali all of Aaron's ranks, among them succession; if he deputised him for a short absence, all the more after death."
  ur: "ابن تیمیہ (اہلِ سنت): حدیث صحیح ہے؛ یہ تبوک کے موقع پر مدینہ کی نیابت میں تشبیہ ہے، علی کی دل جوئی کے لیے، اور نہ افضلیت پر دلالت کرتی ہے نہ امامت پر۔ حلی، جیسا ابن تیمیہ نقل کرتے ہیں: استثنا علی کو ہارون کے تمام مراتب دیتا ہے جن میں خلافت بھی ہے؛ اگر مختصر غیر موجودگی میں نائب بنایا تو موت کے بعد بدرجۂ اولیٰ۔"
perspectives:
  - tradition: sunni-hanbali
    id: ibn-taymiyya-minhaj-manzila
