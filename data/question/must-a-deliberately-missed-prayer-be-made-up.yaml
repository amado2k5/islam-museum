  - tradition: sunni
    id: zahiri-ibn-hazm-no-making-up
    standing: secondary
    stance: { ar: "الظاهرية ⁦(ابن حزم)⁩: لا يقدر على قضائها أبداً، فليتب وليكثر من التطوع", en: "Zahiri (Ibn Hazm): it can never be made up; he should repent and do much voluntary prayer", ur: "ظاہری ⁦(ابن حزم)⁩: اس کی قضا کبھی ممکن نہیں؛ توبہ کرے اور کثرت سے نفل پڑھے" }
    summary: { ar: "يرى ابن حزم أن العامد لا يقدر على قضاء ما ترك، لأن الله جعل لكل صلاة وقتاً محدود الطرفين فلا فرق بين من صلاها قبله ومن صلاها بعده، ولأن القضاء إيجاب شرع لا يكون إلا بنص، ولأن الويل والغي لا يلحقان من أدرك الصلاة، ولأن ما فات لا سبيل إلى إدراكه؛ ويفرّق بين العامد والناسي والنائم والسكران، فوقت هؤلاء ممتد غير منقض، ويرد قياس العامد على الناسي بأنه قياس الشيء على ضده.", en: "Ibn Hazm holds that the deliberate abandoner cannot make up what he left, because God gave each prayer a time fixed at both ends, so that praying after it is no different from praying before it; because making up is a new obligation that only a text can impose; because the threats of woe and ruin would not apply to one who still catches the prayer; and because what is missed cannot be caught. He distinguishes the deliberate from the forgetful, the sleeper and the drunk, whose time stays open, and rejects the analogy of the deliberate with the forgetful as an analogy of a thing with its opposite.", ur: "ابن حزم کے نزدیک جان بوجھ کر چھوڑنے والا قضا نہیں کر سکتا، کیونکہ اللہ نے ہر نماز کا وقت دونوں طرف سے مقرر کیا ہے، تو وقت کے بعد پڑھنا وقت سے پہلے پڑھنے جیسا ہے؛ کیونکہ قضا ایک نئی شرعی ذمہ داری ہے جو صرف نص سے ثابت ہو سکتی ہے؛ کیونکہ ہلاکت اور گمراہی کی وعید اس پر نہیں جو نماز پا لے؛ اور کیونکہ جو فوت ہو گیا اسے پانے کی کوئی راہ نہیں۔ وہ اسے بھولنے والے، سونے والے اور نشے والے سے الگ کرتے ہیں جن کا وقت کھلا رہتا ہے، اور جان بوجھ کر چھوڑنے والے کو بھولنے والے پر قیاس کو کسی چیز کا اس کی ضد پر قیاس قرار دے کر رد کرتے ہیں۔" }
