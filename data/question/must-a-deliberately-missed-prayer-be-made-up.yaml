id: question/must-a-deliberately-missed-prayer-be-made-up
class: question
label: { ar: "هل تُقضى الصلاة المتروكة عمداً حتى خرج وقتها؟", en: "Is a prayer deliberately left until its time has passed made up?", ur: "کیا جان بوجھ کر وقت نکلنے تک چھوڑی گئی نماز کی قضا کی جائے؟" }
question: { ar: "من تعمد ترك صلاة فرض حتى خرج وقتها، هل يقضيها أم لا يقدر على قضائها؟", en: "Must one who deliberately leaves an obligatory prayer until its time has passed make it up, or can it no longer be made up?", ur: "جس نے فرض نماز جان بوجھ کر وقت نکلنے تک چھوڑ دی، کیا وہ اس کی قضا کرے، یا اب اس کی قضا ممکن ہی نہیں؟" }
issue: { ar: "اتفقوا كما يحكي ابن حزم على أن الناسي والنائم والسكران يصلون الصلاة متى ذكروا، واختلفوا في العامد: هل يقاس على الناسي فيقضي، أم أن الوقت المحدود شرط لا تصح الصلاة بعده؟", en: "As Ibn Hazm reports, all agree that one who forgot, slept through it or was drunk prays it whenever he remembers; they differ over one who left it deliberately: is he treated like the forgetful and makes it up, or is the fixed time a condition after which the prayer is not valid?", ur: "ابن حزم کے بیان کے مطابق سب متفق ہیں کہ بھولنے والا، سونے والا اور نشے والا جب یاد آئے نماز پڑھ لے؛ اختلاف جان بوجھ کر چھوڑنے والے میں ہے: کیا اسے بھولنے والے پر قیاس کر کے قضا کا حکم دیا جائے، یا مقررہ وقت ایسی شرط ہے جس کے بعد نماز صحیح نہیں؟" }
summary:
  ar: "يحكي ابن حزم في «المحلى» أن أبا حنيفة ومالكاً والشافعي يوجبون على من تعمد ترك الصلاة حتى خرج وقتها أن يقضيها، ويرى هو أنه لا يقدر على قضائها أبداً، فليكثر من التطوع والخير ويتب ويستغفر، ويحتج بآيات الويل لمن سها عن صلاته ولمن أضاعها، وبأن لكل صلاة وقتاً محدود الطرفين، وبآثار عن عمر وابنه وسلمان وابن مسعود وسعد والقاسم بن محمد وعمر بن عبد العزيز وغيرهم {cite:muhalla-dar-ibn-hazm-2016-v3 p.304} {cite:muhalla-dar-ibn-hazm-2016-v3 p.309}."
  en: "Ibn Hazm reports in al-Muhalla that Abu Hanifa, Malik and al-Shafi'i require one who deliberately left a prayer until its time passed to make it up, while he holds that it can never be made up, so the person should do much good and voluntary prayer, repent and ask forgiveness; he argues from the verses threatening those heedless of their prayer and those who neglect it, from the point that each prayer has a time fixed at both ends, and from reports from 'Umar and his son, Salman, Ibn Mas'ud, Sa'd, al-Qasim ibn Muhammad, 'Umar ibn 'Abd al-'Aziz and others {cite:muhalla-dar-ibn-hazm-2016-v3 p.304} {cite:muhalla-dar-ibn-hazm-2016-v3 p.309}."
  ur: "ابن حزم «المحلی» میں نقل کرتے ہیں کہ ابو حنیفہ، مالک اور شافعی اس شخص پر قضا واجب کرتے ہیں جس نے نماز جان بوجھ کر وقت نکلنے تک چھوڑ دی، جبکہ ان کے نزدیک اس کی قضا کبھی ممکن نہیں، لہٰذا وہ کثرت سے نیکی اور نفل نماز ادا کرے، توبہ اور استغفار کرے؛ وہ ان آیات سے استدلال کرتے ہیں جن میں نماز سے غافل اور اسے ضائع کرنے والوں کے لیے وعید ہے، اس سے کہ ہر نماز کا وقت دونوں طرف سے مقرر ہے، اور عمر اور ان کے بیٹے، سلمان، ابن مسعود، سعد، قاسم بن محمد، عمر بن عبد العزیز وغیرہ کے آثار سے {cite:muhalla-dar-ibn-hazm-2016-v3 p.304} {cite:muhalla-dar-ibn-hazm-2016-v3 p.309}۔"
short_answer:
  ar: "أبو حنيفة ومالك والشافعي ⁦(كما يحكيهم ابن حزم)⁩: يقضيها بعد خروج الوقت؛ ابن حزم الظاهري: لا قضاء له، وإنما التوبة والإكثار من التطوع."
  en: "Abu Hanifa, Malik and al-Shafi'i (as Ibn Hazm reports them): he makes it up after the time has passed; Ibn Hazm the Zahiri: there is no making up, only repentance and much voluntary prayer."
  ur: "ابو حنیفہ، مالک اور شافعی ⁦(ابن حزم کی نقل کے مطابق)⁩: وقت نکلنے کے بعد قضا کرے؛ ابن حزم ظاہری: قضا نہیں، صرف توبہ اور کثرت سے نفل۔"
perspectives:
  - tradition: sunni
    id: jumhur-make-up
    standing: main
    stance: { ar: "يقضيها بعد خروج الوقت", en: "He makes it up after the time has passed", ur: "وقت نکلنے کے بعد اس کی قضا کرے" }
    summary: { ar: "يحكي ابن حزم أن أبا حنيفة ومالكاً والشافعي قالوا: يقضيها بعد خروج الوقت، وأن مالكاً وأبا حنيفة قالا: من تعمد ترك خمس صلوات فأقل صلاها قبل الحاضرة وإن خرج وقت الحاضرة، فإن كانت أكثر من خمس بدأ بالحاضرة؛ ويحكي من حججهم قياس العامد على الناسي. ويذكر المحققون في الحاشية من حجة الشافعية، عن «المجموع» للنووي، حديث أمر المجامع في نهار رمضان بصوم يوم مع الكفارة، وأن القضاء إذا وجب على الناسي فالعامد أولى.", en: "Ibn Hazm reports that Abu Hanifa, Malik and al-Shafi'i said he makes it up after the time has passed, and that Malik and Abu Hanifa said that one who deliberately left five prayers or fewer prays them before the current prayer even if its time runs out, while with more than five he begins with the current one; among their arguments he reports the analogy of the deliberate with the forgetful. The editors add, from al-Nawawi's al-Majmu', the Shafi'i argument from the order to one who had intercourse by day in Ramadan to fast a day along with the expiation, and the point that if making up is due from the forgetful it is due all the more from the deliberate.", ur: "ابن حزم نقل کرتے ہیں کہ ابو حنیفہ، مالک اور شافعی نے کہا کہ وہ وقت نکلنے کے بعد قضا کرے، اور مالک و ابو حنیفہ کے نزدیک جس نے پانچ یا کم نمازیں جان بوجھ کر چھوڑیں وہ انہیں حاضر نماز سے پہلے پڑھے خواہ حاضر کا وقت نکل جائے، اور پانچ سے زیادہ ہوں تو حاضر سے شروع کرے؛ ان کے دلائل میں وہ جان بوجھ کر چھوڑنے والے کو بھولنے والے پر قیاس کرنا ذکر کرتے ہیں۔ محققین حاشیے میں نووی کی «المجموع» سے شافعیہ کی یہ دلیل نقل کرتے ہیں کہ رمضان کے دن میں جماع کرنے والے کو کفارے کے ساتھ ایک دن کا روزہ رکھنے کا حکم ہوا، اور یہ کہ جب بھولنے والے پر قضا واجب ہے تو جان بوجھ کر چھوڑنے والے پر بدرجۂ اولیٰ۔" }
    holders: [person/abu-hanifa, person/malik-ibn-anas, person/al-shafii]
