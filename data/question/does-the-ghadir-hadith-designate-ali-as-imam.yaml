id: question/does-the-ghadir-hadith-designate-ali-as-imam
class: question
label: { ar: "هل يدل حديث الغدير على إمامة علي؟", en: "Does the hadith of Ghadir designate Ali as imam?", ur: "کیا حدیثِ غدیر علی کی امامت پر دلالت کرتی ہے؟" }
summary:
  ar: "جعل ابن المطهر الحلي حديث غدير خم «من كنت مولاه فعلي مولاه» خبراً متواتراً نزلت معه آية التبليغ، والمولى فيه الأولى بالتصرف، فهو عنده نص على إمامة علي؛ وردّ ابن تيمية في منهاج السنة بأن آية التبليغ نزلت قبل حجة الوداع بمدة، وأن أصل الحديث مختلف في صحته وزيادته «اللهم وال من والاه» كذب عنده، وأنه إن صح فالمولى فيه ضد المعادي لا الخليفة."
  en: "Ibn al-Mutahhar al-Hilli presented the hadith of Ghadir Khumm, 'Of whomever I am mawla, Ali is his mawla', as a mass-transmitted report that came with the verse 'Convey what has been sent down to you', mawla meaning the one with greater right to authority, and so as an explicit designation of Ali's imamate. Ibn Taymiyya replied in Minhaj al-Sunna that the verse was revealed long before the Farewell Pilgrimage, that the core hadith's authenticity is disputed and its addition 'O God, befriend whoever befriends him' is in his view false, and that if sound, mawla in it is the opposite of enemy, not successor."
  ur: "ابن المطہر حلی نے غدیرِ خم کی حدیث «جس کا میں مولا ہوں اس کے علی مولا ہیں» کو متواتر خبر قرار دیا جس کے ساتھ آیتِ تبلیغ نازل ہوئی، اور اس میں مولا کا معنی تصرف کا زیادہ حق دار بتایا، پس ان کے نزدیک یہ علی کی امامت پر نص ہے؛ ابن تیمیہ نے منہاج السنہ میں جواب دیا کہ آیتِ تبلیغ حجۃ الوداع سے بہت پہلے نازل ہوئی، اصل حدیث کی صحت میں اختلاف ہے اور «اے اللہ اس سے دوستی رکھ جو اس سے دوستی رکھے» کا اضافہ ان کے نزدیک جھوٹ ہے، اور اگر صحیح ہو تو مولا یہاں دشمن کی ضد ہے، خلیفہ نہیں۔"
question: { ar: "هل يدل حديث الغدير على إمامة علي؟", en: "Does the hadith of Ghadir designate Ali as imam?", ur: "کیا حدیثِ غدیر علی کی امامت پر دلالت کرتی ہے؟" }
issue:
  ar: "ما ثبوت حديث «من كنت مولاه فعلي مولاه» وزياداته، ومتى نزلت آية التبليغ، وهل معنى المولى فيه الأولى بالتصرف أم المحب الناصر؟"
  en: "How well established is the hadith 'Of whomever I am mawla, Ali is his mawla' and its additions, when was the verse of conveying revealed, and does mawla in it mean the one with greater right to authority or the friend and helper?"
  ur: "حدیث «جس کا میں مولا ہوں اس کے علی مولا ہیں» اور اس کے اضافوں کا ثبوت کیا ہے، آیتِ تبلیغ کب نازل ہوئی، اور کیا اس میں مولا کا معنی تصرف کا زیادہ حق دار ہے یا محب و مددگار؟"
short_answer:
  ar: "ابن تيمية (أهل السنة): إن لم يقله النبي فلا كلام، وإن قاله فلم يرد به الخلافة؛ والموالاة ضد المعاداة. الإمامية كما ينقلهم: خبر متواتر، والمولى الأولى بالتصرف بدليل «ألست أولى منكم بأنفسكم»."
  en: "Ibn Taymiyya (Sunni): if the Prophet did not say it there is nothing to discuss; if he did, he did not mean the caliphate – being mawla is the opposite of enmity. The Imamiyya as he reports them: a mass-transmitted report, mawla meaning the one with greater right to authority, as shown by 'Am I not closer to you than yourselves?'."
  ur: "ابن تیمیہ (اہلِ سنت): اگر نبی نے یہ نہیں فرمایا تو بحث ہی نہیں، اور اگر فرمایا تو اس سے خلافت مراد نہیں – موالات عداوت کی ضد ہے۔ امامیہ، جیسا وہ نقل کرتے ہیں: یہ متواتر خبر ہے، اور مولا کا معنی تصرف کا زیادہ حق دار ہے، جس کی دلیل «کیا میں تمہاری جانوں سے زیادہ قریب نہیں» ہے۔"
perspectives:
  - tradition: sunni-hanbali
    id: ibn-taymiyya-minhaj-ghadir
    standing: main
    stance: { ar: "الحديث لا يدل على الخلافة، والمولى فيه الولي ضد العدو", en: "The hadith does not indicate the caliphate; mawla in it is the friend, opposite of the enemy", ur: "حدیث خلافت پر دلالت نہیں کرتی؛ اس میں مولا دوست ہے، دشمن کی ضد" }
    summary: { ar: "يقول ابن تيمية إن آية التبليغ (المائدة 67) من أوائل ما نزل بالمدينة، وإن آية إكمال الدين نزلت بعرفة قبل الغدير بتسعة أيام، وإن النبي لم يذكر إمامة علي في خطبة حجة الوداع وهي المجمع العام؛ ويحكي أن البخاري وإبراهيم الحربي وطائفة طعنوا في «من كنت مولاه» وأن أحمد والترمذي حسّناه، ويرى أن زيادة «اللهم وال من والاه» كذب.", en: "Ibn Taymiyya says that the verse 'Convey what has been sent down to you' is among the earliest revealed in Medina, that the verse of the perfecting of religion was revealed at Arafa nine days before Ghadir, and that the Prophet did not mention Ali's imamate in his Farewell Pilgrimage sermon, the general assembly; he relates that al-Bukhari, Ibrahim al-Harbi and others criticised 'Of whomever I am mawla' while Ahmad and al-Tirmidhi judged it hasan, and holds that the addition 'O God, befriend whoever befriends him' is false.", ur: "ابن تیمیہ کہتے ہیں کہ آیت «جو آپ کی طرف نازل کیا گیا اسے پہنچا دیجیے» مدینہ میں ابتدائی نازل ہونے والی آیات میں سے ہے، تکمیلِ دین کی آیت غدیر سے نو دن پہلے عرفہ میں نازل ہوئی، اور نبی نے حجۃ الوداع کے خطبے میں، جو عام اجتماع تھا، علی کی امامت کا ذکر نہیں کیا؛ وہ بیان کرتے ہیں کہ بخاری، ابراہیم حربی اور ایک جماعت نے «جس کا میں مولا ہوں» پر طعن کیا جبکہ احمد اور ترمذی نے اسے حسن کہا، اور «اے اللہ اس سے دوستی رکھ جو اس سے دوستی رکھے» کے اضافے کو جھوٹ سمجھتے ہیں۔" }
