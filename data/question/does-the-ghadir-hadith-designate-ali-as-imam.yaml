    summary: { ar: "في نقل ابن تيمية: يقول الحلي إن النبي لما نزلت آية التبليغ خطب الناس في غدير خم فقال: ألست أولى منكم بأنفسكم؟ قالوا: بلى، قال: من كنت مولاه فعلي مولاه، اللهم وال من والاه وعاد من عاداه، وانصر من نصره واخذل من خذله، فقال عمر: بخ بخ، أصبحت مولاي ومولى كل مؤمن ومؤمنة؛ والمراد بالمولى الأولى بالتصرف لتقدم التقرير بقوله «ألست أولى منكم بأنفسكم».", en: "As Ibn Taymiyya reports: al-Hilli says that when the verse of conveying was revealed the Prophet addressed the people at Ghadir Khumm: 'Am I not closer to you than yourselves?' They said yes. He said: 'Of whomever I am mawla, Ali is his mawla; O God, befriend whoever befriends him, be hostile to whoever is hostile to him, help whoever helps him and forsake whoever forsakes him'; and Umar said, 'Bravo, you have become my mawla and the mawla of every believing man and woman'. Mawla here means the one with greater right to authority, because of the preceding affirmation 'Am I not closer to you than yourselves?'.", ur: "ابن تیمیہ کی نقل میں: حلی کہتے ہیں کہ جب آیتِ تبلیغ نازل ہوئی تو نبی نے غدیرِ خم میں لوگوں سے خطاب کیا: کیا میں تمہاری جانوں سے زیادہ قریب نہیں؟ انہوں نے کہا: کیوں نہیں؛ فرمایا: جس کا میں مولا ہوں اس کے علی مولا ہیں، اے اللہ اس سے دوستی رکھ جو اس سے دوستی رکھے اور اس سے دشمنی رکھ جو اس سے دشمنی رکھے، اس کی مدد کر جو اس کی مدد کرے اور اسے چھوڑ دے جو اسے چھوڑے؛ اور عمر نے کہا: مبارک ہو، آپ میرے اور ہر مومن مرد و عورت کے مولا ہو گئے۔ یہاں مولا سے مراد تصرف کا زیادہ حق دار ہے کیونکہ پہلے «کیا میں تمہاری جانوں سے زیادہ قریب نہیں» کا اقرار لیا گیا۔" }
