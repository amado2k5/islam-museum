id: question/what-was-badr
class: question
label:
  ar: ما غزوة بدر الكبرى؟
  en: What was the greater Battle of Badr?
  es: "¿Cuál fue la gran batalla de Badr?"
  fr: "Quelle fut la plus grande bataille de Badr ?"
summary:
  ar: بدر الكبرى 17 رمضان 2هـ/624م أول معارك الإسلام الفاصلة؛ نصر فيها 313 مسلمًا على ألف من قريش وقتل
    فيها صناديد الشرك.
  en: "The Greater Badr, 17 Ramadan 2 AH / 624 CE; the first decisive battle of Islam, in which 313 Muslims were granted victory over a thousand of Quraysh, and in which the chieftains of polytheism were killed."
  es: "La Gran Batalla de Badr, 17 de Ramadán del año 2 de la Hégira / 624 d. C.; la primera batalla decisiva del Islam, en la que 313 musulmanes obtuvieron la victoria sobre mil Quraysh, y en la que murieron los jefes del politeísmo."
  fr: "La Grande Bataille de Badr, 17 Ramadan 2 AH / 624 CE; la première bataille décisive de l'Islam, au cours de laquelle 313 musulmans remportèrent la victoire sur un millier de Quraysh, et au cours de laquelle les chefs du polythéisme furent tués."
question:
  ar: ما غزوة بدر الكبرى؟
short_answer:
  ar: بدر الكبرى 17 رمضان 2هـ/624م أول معارك الإسلام الفاصلة؛ نصر فيها 313 مسلمًا على ألف من قريش وقتل
    فيها صناديد الشرك.
long_answer:
  ar: '[[event/badr-battle-day|بدر]] أول معركة عظمى في الإسلام؛ خرج النبي في ثلاثمئة وثلاثة عشر رجلًا
    فلاقى جيش قريش الألف فنصره الله؛ قتل فيها أبو جهل وعتبة وشيبة واستشهد أربعة عشر من المسلمين؛ سمى القرآن
    يومها يوم الفرقان. {cite:wikidata}'
