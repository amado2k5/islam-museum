long_answer:
  ar: '[[event/badr-battle-day|بدر]] أول معركة عظمى في الإسلام؛ خرج النبي في ثلاثمئة وثلاثة عشر رجلًا
    فلاقى جيش قريش الألف فنصره الله؛ قتل فيها أبو جهل وعتبة وشيبة واستشهد أربعة عشر من المسلمين؛ سمى القرآن
