id: question/who-was-ibn-taymiyya
class: question
label:
  ar: من كان ابن تيمية؟
  en: Who was Ibn Taymiyya?
  es: "¿Quién fue Ibn Taymiyya?"
  fr: "Qui était Ibn Taymiyya ?"
summary:
  ar: تقي الدين ابن تيمية (1263–1328) فقيه حنبلي جدلي؛ من أعمق منظري التراث السني وملهم الإصلاحات الحديثة؛
    سجن مرارًا حتى مات في القلعة.
  en: "Taqi al-Din Ibn Taymiyya (1263–1328), a polemical Hanbali jurist, is among the most profound theorists of the Sunni heritage and an inspiration to modern reform; he was imprisoned repeatedly and died in the citadel."
  es: "Taqi al-Din Ibn Taymiyya (1263-1328), un polémico jurista hanbalí, se encuentra entre los teóricos más profundos de la tradición suní y es una inspiración para la reforma moderna; fue encarcelado repetidamente y murió en la ciudadela."
  fr: "Taqi al-Din Ibn Taymiyya (1263–1328), juriste hanbalite polémiste, est parmi les théoriciens les plus profonds de l'héritage sunnite et une source d'inspiration pour la réforme moderne; il a été emprisonné à plusieurs reprises et est mort dans la citadelle."
question:
  ar: من كان ابن تيمية؟
short_answer:
  ar: تقي الدين ابن تيمية (1263–1328) فقيه حنبلي جدلي؛ من أعمق منظري التراث السني وملهم الإصلاحات الحديثة؛
    سجن مرارًا حتى مات في القلعة.
long_answer:
  ar: '[[person/ibn-taymiyya|ابن تيمية]] الحراني الدمشقي؛ فقيه حنبلي موسوعي ردّ على الفلاسفة والمتكلمين
    والصوفية معًا ودعا إلى اجتهاد جديد. خاض محنًا وسجن مرارًا ومات في قلعة دمشق؛ ميراثه شق الفكر الإسلامي
    الحديث نصفين بين مؤيد ومعارض. {cite:wikidata}'
