long_answer:
  ar: '[[person/ibn-taymiyya|ابن تيمية]] الحراني الدمشقي؛ فقيه حنبلي موسوعي ردّ على الفلاسفة والمتكلمين
    والصوفية معًا ودعا إلى اجتهاد جديد. خاض محنًا وسجن مرارًا ومات في قلعة دمشق؛ ميراثه شق الفكر الإسلامي
    الحديث نصفين بين مؤيد ومعارض. {cite:wikidata}'
