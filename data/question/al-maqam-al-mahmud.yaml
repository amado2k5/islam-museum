id: question/al-maqam-al-mahmud
class: question
label: { ar: "ما المقام المحمود؟", en: "What is the Praiseworthy Station (al-maqam al-mahmud)?", ur: "مقامِ محمود کیا ہے؟" }
question: { ar: "ما المراد بالمقام المحمود في الإسراء 79: الشفاعة، أم إجلاس النبي على العرش كما رُوي عن مجاهد، أم كلاهما؟", en: "What is meant by the Praiseworthy Station in al-Isra' 79: intercession, the seating of the Prophet on the Throne as reported from Mujahid, or both?", ur: "الاسراء 79 میں مقامِ محمود سے کیا مراد ہے: شفاعت، یا مجاہد سے مروی نبی کو عرش پر بٹھانا، یا دونوں؟" }
issue: { ar: "أثر مجاهد في تفسير المقام المحمود بأن الله يقعد النبي معه على العرش، وموقف الحنابلة الأوائل منه ومن منكريه، كما يعرضه الخلال في كتاب السنة ومحققه.", en: "Mujahid's report explaining the Praiseworthy Station as God seating the Prophet with Him on the Throne, and the early Hanbalis' stance on it and on those who rejected it, as al-Khallal's Kitab al-Sunna and its editor present it." }
summary:
  ar: "يعقد الخلال في كتاب السنة باب «ذكر المقام المحمود» يجمع فيه روايات أثر مجاهد «يقعده معه على العرش» في تفسير الإسراء 79، وأقوال أصحاب أحمد في قبوله وفي الإنكار على من ردّه، وكتاباً كتبه له شيوخه ببغداد لما أنكره قوم بطرسوس سنة 292هـ؛ ويذكر الباب أن قول المسلمين إن المقام المحمود الشفاعة لا يُدفع، وينقل المحقق عن ابن حجر رد الأقوال كلها إلى الشفاعة العامة، وعن غيره الجمع بين القولين {cite:kitab-al-sunna-khallal-al-hamdan-2018 p. 145-147} {cite:kitab-al-sunna-khallal-al-hamdan-2018 p. 171} {cite:kitab-al-sunna-khallal-al-hamdan-2018 p. 188-189}."
  en: "In Kitab al-Sunna al-Khallal has a chapter on the Praiseworthy Station gathering the versions of Mujahid's report 'He will seat him with Him on the Throne' on al-Isra' 79, the sayings of Ahmad's followers accepting it and condemning those who rejected it, and a letter his Baghdad teachers wrote when some in Tarsus rejected it in 292 AH; the chapter says the Muslims' view that the Station is intercession is not denied, and the editor quotes Ibn Hajar reducing all the views to the general intercession and another scholar reconciling the two {cite:kitab-al-sunna-khallal-al-hamdan-2018 p. 145-147} {cite:kitab-al-sunna-khallal-al-hamdan-2018 p. 171} {cite:kitab-al-sunna-khallal-al-hamdan-2018 p. 188-189}."
  ur: "خلال کتاب السنہ میں «مقامِ محمود کا ذکر» کا باب رکھتے ہیں جس میں الاسراء 79 کی تفسیر میں مجاہد کے اثر «وہ انہیں اپنے ساتھ عرش پر بٹھائے گا» کی روایات، اسے قبول کرنے اور اس کے منکرین پر نکیر کرنے کے بارے میں احمد کے اصحاب کے اقوال، اور وہ خط ہے جو ان کے بغداد کے شیوخ نے لکھا جب 292ھ میں طرسوس میں کچھ لوگوں نے اس کا انکار کیا؛ باب کہتا ہے کہ مسلمانوں کا یہ قول کہ مقامِ محمود شفاعت ہے رد نہیں کیا جاتا، اور محقق ابن حجر سے تمام اقوال کو عام شفاعت کی طرف لوٹانا اور ایک اور عالم سے دونوں قولوں کی تطبیق نقل کرتے ہیں {cite:kitab-al-sunna-khallal-al-hamdan-2018 p. 145-147} {cite:kitab-al-sunna-khallal-al-hamdan-2018 p. 171} {cite:kitab-al-sunna-khallal-al-hamdan-2018 p. 188-189}۔"
short_answer:
  ar: "عند الخلال ومن نقل عنهم من الحنابلة الأوائل: يدخل فيه إقعاد النبي على العرش مع إثبات الشفاعة؛ وعند ابن حجر كما ينقله المحقق: ترجع الأقوال كلها إلى الشفاعة العامة؛ وجمع بعضهم بين القولين."
  en: "For al-Khallal and the early Hanbalis he quotes: it includes the Prophet's seating on the Throne, with intercession affirmed too; for Ibn Hajar, as the editor quotes him: all the views come back to the general intercession; some reconcile the two."
  ur: "خلال اور ان کے نقل کردہ ابتدائی حنابلہ کے نزدیک: اس میں نبی کا عرش پر بٹھایا جانا شامل ہے اور شفاعت بھی ثابت ہے؛ ابن حجر کے نزدیک، جیسا کہ محقق نقل کرتے ہیں: تمام اقوال عام شفاعت کی طرف لوٹتے ہیں؛ بعض نے دونوں کو جمع کیا۔"
