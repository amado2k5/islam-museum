    id: ibn-hajar-general-intercession
    standing: main
    stance: { ar: "ترجع الأقوال كلها إلى الشفاعة العامة", en: "All the views come back to the general intercession" }
    summary: { ar: "ينقل المحقق عن ابن حجر في «فتح الباري» أنه بعد ذكر أقوال العلماء قال: يمكن ردّ الأقوال كلها إلى الشفاعة العامة، فإعطاء لواء الحمد، والثناء على ربه، وكلامه بين يديه، وجلوسه على كرسيه، صفات للمقام المحمود الذي يشفع فيه ليقضي بين الخلق؛ وعن القصاب أن التفسير المرفوع «هو المقام الذي أشفع لأمتي» لا يدفع تفسير مجاهد.", en: "The editor quotes Ibn Hajar in Fath al-Bari that after listing the scholars' views he said all can be reduced to the general intercession: the banner of praise, his praise of his Lord, his speech before Him and his sitting on His Kursi are all features of the Station in which he intercedes for the judgement of creation; and al-Qassab that the report from the Prophet, 'it is the station in which I intercede for my community', does not rule out Mujahid's explanation." }
    holders: [person/ibn-hajar-al-asqalani]
    sources: [source/kitab-al-sunna-khallal-al-hamdan-2018]
