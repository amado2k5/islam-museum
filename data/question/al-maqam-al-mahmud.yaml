    summary: { ar: "يجمع الخلال روايات أثر مجاهد من طريق ليث وغيره، وينقل عن أحمد أن العلماء تلقوه بالقبول وأنه رُوي عن ابن عباس أيضاً، وعن الصاغاني وأبي داود وعبد الله بن أحمد وغيرهم أنهم ما علموا أحداً يرده إلا من يسمونهم الجهمية؛ ويقول الكتاب المكتوب إليه من بغداد إن الجلوس في وقت والشفاعة في وقت، وإنهم لا يدفعون أن المقام المحمود الشفاعة.", en: "Al-Khallal gathers Mujahid's report through Layth and others, quotes Ahmad that scholars accepted it and that it was also related from Ibn 'Abbas, and quotes al-Saghani, Abu Dawud, 'Abd Allah ibn Ahmad and others that they knew of no one who rejected it except those they call Jahmiyya; the letter sent to him from Baghdad says the seating is at one time and the intercession at another, and that they do not deny the Station is intercession." }
