    summary: { ar: "يذكر الخلال أن قوماً من أصحاب من يسميه «الترمذي المبتدع» أنكروا الباب بطرسوس، ويصف المحقق والمصادر التي ينقلها منكريه بأوصاف شديدة كالتجهم والبدعة. هذا الموقف معروض هنا بلسان خصومه، ولم تُنقل حجج أصحابه من كتبهم بعد.", en: "Al-Khallal says that some followers of a man he calls 'al-Tirmidhi the innovator' rejected the chapter in Tarsus, and the editor and the authorities he quotes describe those who rejected it in harsh terms such as Jahmism and innovation. This position is given here in its opponents' words; its holders' own arguments have not yet been taken from their books." }
