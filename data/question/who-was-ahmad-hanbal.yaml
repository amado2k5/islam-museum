    في المحنة فضرب.
long_answer:
  ar: '[[person/ahmad-ibn-hanbal|الإمام أحمد]] من بغداد؛ صحب الشافعي وصار إمام أهل الحديث. امتحن في محنة
    خلق القرآن فثبت وضرب وحبس حتى استقام له الأمر في عهد المتوكل؛ مسنده من أعظم موسوعات الحديث ومذهبه
