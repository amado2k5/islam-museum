label:
  ar: من كان أحمد بن حنبل؟
  en: Who was Ahmad ibn Hanbal?
summary:
  ar: أحمد بن حنبل (780–855) إمام السنّة؛ جمع مسنده من نحو أربعين ألف حديث وثبت على القول بقدم القرآن
    في المحنة فضرب.
  en: "Ahmad ibn Hanbal (780–855) was the imam of the Sunna. He compiled his Musnad from about forty thousand hadiths. During the mihna he held firm to the view that the Qur'an is eternal, and he was flogged."
