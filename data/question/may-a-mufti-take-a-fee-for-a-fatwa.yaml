id: question/may-a-mufti-take-a-fee-for-a-fatwa
class: question
label: { ar: "هل يأخذ المفتي أجرة أو هدية على فتواه؟", en: "May a mufti take a fee or a gift for a fatwa?", ur: "کیا مفتی فتوے پر اجرت یا ہدیہ لے سکتا ہے؟" }
summary:
  ar: "يفرق ابن قيم الجوزية في إعلام الموقعين بين ثلاث صور: الأجرة على الفتوى ولا تجوز عنده لأنها تبليغ عن الله ورسوله، والهدية وفيها تفصيل بحسب سببها، والرزق من بيت المال ويجوز للمحتاج وفي الغني وجهان؛ ويحكي قول بعض المتأخرين بجواز الأجرة على الخط دون الجواب ويرده."
  en: "In I'lam al-Muwaqqi'in Ibn Qayyim al-Jawziyya distinguishes three cases: a fee for the fatwa, which he holds unlawful because a fatwa is conveying from God and His Messenger; a gift, judged according to its cause; and a stipend from the public treasury, lawful for one in need, with two views for one who is not. He reports, and rejects, the view of some later scholars that a fee may be taken for the written answer though not for the answer itself."
  ur: "اعلام الموقعین میں ابن قیم الجوزیہ تین صورتوں میں فرق کرتے ہیں: فتوے پر اجرت، جو ان کے نزدیک ناجائز ہے کیونکہ فتویٰ اللہ اور اس کے رسول کی طرف سے تبلیغ ہے؛ ہدیہ، جس کا حکم اس کے سبب کے مطابق ہے؛ اور بیت المال سے وظیفہ، جو محتاج کے لیے جائز ہے اور غنی کے بارے میں دو آرا ہیں۔ وہ بعض متاخرین کا یہ قول نقل کر کے رد کرتے ہیں کہ تحریر پر اجرت لی جا سکتی ہے اگرچہ جواب پر نہیں۔"
question: { ar: "هل يأخذ المفتي أجرة أو هدية على فتواه؟", en: "May a mufti take a fee or a gift for a fatwa?", ur: "کیا مفتی فتوے پر اجرت یا ہدیہ لے سکتا ہے؟" }
issue:
  ar: "هل الفتوى عمل يجوز أخذ العوض عليه، وما الفرق بين الأجرة والهدية والرزق من بيت المال؟"
  en: "Is giving a fatwa work for which compensation may be taken, and how do a fee, a gift and a stipend from the treasury differ?"
  ur: "کیا فتویٰ دینا ایسا کام ہے جس پر معاوضہ لیا جا سکے، اور اجرت، ہدیے اور بیت المال کے وظیفے میں کیا فرق ہے؟"
short_answer:
  ar: "ابن القيم: لا تجوز الأجرة، والهدية تُقبل إن لم تكن بسبب الفتوى وتحرم إن كانت ليفتيه بما لا يفتي به غيره وتكره إن كانت بسبب الفتوى المعتادة، والرزق من بيت المال جائز للمحتاج. بعض المتأخرين كما يحكيهم: له أخذ الأجرة على الخط كأجرة الناسخ."
  en: "Ibn al-Qayyim: no fee; a gift may be accepted if not occasioned by the fatwa, is unlawful if given to obtain a fatwa others would not give, and disliked if occasioned by an ordinary fatwa; a treasury stipend is lawful for one in need. Some later scholars as he reports them: a fee may be taken for the handwriting, like a copyist's wage."
  ur: "ابن القیم: اجرت جائز نہیں؛ ہدیہ قبول ہے اگر فتوے کے سبب نہ ہو، حرام ہے اگر ایسا فتویٰ لینے کے لیے ہو جو دوسرے نہ دیں، اور مکروہ ہے اگر عام فتوے کے سبب ہو؛ بیت المال کا وظیفہ محتاج کے لیے جائز ہے۔ بعض متاخرین، جیسا وہ نقل کرتے ہیں: تحریر پر کاتب کی اجرت کی طرح اجرت لی جا سکتی ہے۔"
perspectives:
