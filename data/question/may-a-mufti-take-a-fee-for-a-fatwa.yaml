    stance: { ar: "لا تجوز الأجرة على الفتوى، والجواب يلزم المفتي مجاناً بلفظه وخطه", en: "No fee may be taken for a fatwa; the mufti owes the answer free, in speech and in writing", ur: "فتوے پر اجرت جائز نہیں؛ مفتی پر جواب زبانی اور تحریری دونوں طرح مفت لازم ہے" }
    summary: { ar: "يرى ابن القيم أن الفتيا منصب تبليغ عن الله ورسوله فلا تجوز المعاوضة عليه، كمن قال لا أعلمك الوضوء أو الصلاة إلا بأجرة، ويلزمه رد العوض؛ وأن الجواب يلزمه مجاناً بلفظه وخطه، ولا يلزمه الورق والحبر؛ ويفصّل في الهدية بحسب سببها، ويجيز الرزق من بيت المال للمحتاج، ويرى القاضي أولى بالمنع من المفتي.", en: "Ibn al-Qayyim holds that giving fatwas is an office of conveying from God and His Messenger, for which no compensation may be taken – like saying 'I will not teach you ablution or prayer except for a fee' – and that any payment must be returned; the mufti owes the answer free, in speech and in writing, though not the paper and ink. He distinguishes gifts by their cause, allows a treasury stipend to one in need, and holds the judge even more strictly barred than the mufti.", ur: "ابن القیم کے نزدیک فتویٰ دینا اللہ اور اس کے رسول کی طرف سے تبلیغ کا منصب ہے جس پر معاوضہ جائز نہیں – جیسے کوئی کہے کہ میں تمہیں وضو یا نماز اجرت کے بغیر نہیں سکھاؤں گا – اور معاوضہ واپس کرنا لازم ہے؛ مفتی پر جواب زبانی اور تحریری مفت لازم ہے، اگرچہ کاغذ اور سیاہی نہیں۔ وہ ہدیے میں اس کے سبب کے لحاظ سے تفصیل کرتے ہیں، محتاج کے لیے بیت المال کا وظیفہ جائز کہتے ہیں، اور قاضی کو مفتی سے بھی زیادہ ممانعت کا حق دار سمجھتے ہیں۔" }
