    summary: { ar: "في نقل ابن القيم: قال بعض المتأخرين إن أجاب المفتي بالخط فله أن يقول للسائل لا يلزمني أن أكتب لك خطي إلا بأجرة، وجعلوه بمنزلة أجرة الناسخ، لأن الخط قدر زائد على الجواب. ويذكر المحقق في الحاشية أن هذا مذهب الحنفية وأبي حاتم القزويني من الشافعية.", en: "As Ibn al-Qayyim reports: some later scholars said that if the mufti answers in writing he may tell the questioner, 'I am not obliged to write for you except for a fee', treating it like a copyist's wage, since the writing is something over and above the answer. The editor notes that this is the Hanafi view and that of Abu Hatim al-Qazwini among the Shafi'is.", ur: "ابن القیم کی نقل میں: بعض متاخرین نے کہا کہ اگر مفتی تحریری جواب دے تو سائل سے کہہ سکتا ہے کہ اجرت کے بغیر تمہارے لیے لکھنا مجھ پر لازم نہیں، اور اسے کاتب کی اجرت کی طرح قرار دیا، کیونکہ تحریر جواب سے زائد چیز ہے۔ محقق حاشیے میں ذکر کرتے ہیں کہ یہ احناف اور شافعیہ میں سے ابو حاتم قزوینی کا مذہب ہے۔" }
