long_answer:
  ar: '[[event/battle-of-mutah|مؤتة]] في البلقاء جنوب الأردن؛ خرج ثلاثة آلاف مسلم ضد مئة ألف من الروم
    وعربها؛ قتل القادة الثلاثة المتعاقبون فأخذ الراية خالد بن الوليد ونظر في خطة الانسحاب المنظم فأنقذ
