id: question/what-was-mutah
class: question
label:
  ar: ما معركة مؤتة؟
  en: What was the Battle of Mutah?
  es: "¿Qué fue la Batalla de Mutah?"
  fr: "Qu'était-ce que la bataille de Mutah ?"
  ur: "متعہ کی جنگ کیا تھی؟"
  tr: "Mu'tah Savaşı nedir?"
  id: "Apa itu Pertempuran Mu'tah?"
summary:
  ar: مؤتة جمادى الأولى 8هـ/629م؛ أول لقاء مسلم بالروم؛ استشهد فيها القادة الثلاثة زيد وجعفر وعبد الله
    بن رواحة ونجا بالجيش خالد.
  en: "Mu'ta, Jumada al-Ula 8 AH / 629 CE; the first encounter between Muslims and the Byzantines; the three commanders Zayd, Ja'far and Abdullah ibn Rawaha were martyred there, and Khalid brought the army to safety."
  es: "Mu'ta, Jumada al-Ula 8 AH / 629 CE; el primer encuentro entre musulmanes y bizantinos; los tres comandantes Zayd, Ja'far y Abdullah ibn Rawaha fueron martirizados allí, y Khalid puso al ejército a salvo."
  fr: "Mu'ta, Jumada al-Ula 8 AH / 629 CE; la première rencontre entre les musulmans et les Byzantins; les trois commandants Zayd, Ja'far et Abdullah ibn Rawaha y furent martyrisés, et Khalid mit l'armée en sécurité."
  ur: "موطا، جمادی الاول 8 ہجری / 629 عیسوی؛ مسلمانوں اور بازنطینیوں کے درمیان پہلا مقابلہ؛ تینوں سپہ سالار زید، جعفر اور عبداللہ بن رواحہ وہیں شہید ہو گئے اور خالد نے فوج کو محفوظ مقام پر پہنچا دیا۔"
  tr: "Mu'tah Cumedül-Avvel 8 Hicri / 629 M.S.; bir Müslümanın Romalılarla ilk karşılaşması; bu karşılaşmada üç komutan Zaid, Cafer ve Abdullah ibn Rawaha şehit edildi ve Halid orduyla birlikte hayatta kaldı."
  id: "Mu'tah Jumada al-Awwal 8 H / 629 M; pertemuan pertama seorang Muslim dengan Romawi; di dalamnya, tiga komandan Zaid, Ja'far, dan Abdullah ibn Rawaha gugur sebagai syahid, dan Khalid selamat bersama pasukannya."
question:
  ar: ما معركة مؤتة؟
short_answer:
  ar: مؤتة جمادى الأولى 8هـ/629م؛ أول لقاء مسلم بالروم؛ استشهد فيها القادة الثلاثة زيد وجعفر وعبد الله
    بن رواحة ونجا بالجيش خالد.
long_answer:
  ar: '[[event/battle-of-mutah|مؤتة]] في البلقاء جنوب الأردن؛ خرج ثلاثة آلاف مسلم ضد مئة ألف من الروم
    وعربها؛ قتل القادة الثلاثة المتعاقبون فأخذ الراية خالد بن الوليد ونظر في خطة الانسحاب المنظم فأنقذ
    الجيش؛ بكى النبي ودعا لهم. {cite:wikidata}'
