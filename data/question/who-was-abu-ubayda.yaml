id: question/who-was-abu-ubayda
class: question
label:
  ar: من كان أبو عبيدة بن الجراح؟
  en: Who was Abu Ubayda ibn al-Jarrah?
  es: "¿Quién fue Abu Ubayda ibn al-Jarrah?"
  fr: "Qui était Abu Ubayda ibn al-Jarrah ?"
  ur: "ابو عبیدہ بن الجراح کون تھے؟"
  tr: "Ebu Ubeyde bin el-Cerrah kimdi?"
  id: "Siapakah Abu Ubaidah ibn al-Jarrah?"
summary:
  ar: أبو عبيدة أمين هذه الأمة؛ من العشرة المبشرين وقائد فتح الشام؛ خليفة خالد على الجيش ومات بطاعون عمواس
    639.
  en: "Abu Ubayda was the trustee of this community. He was one of the Ten promised Paradise and the commander of the conquest of Syria, and he succeeded Khalid as commander of the army. He died in the plague of Amwas in 639."
  es: "Abu Ubayda fue el administrador de esta comunidad. Fue uno de los Diez a quienes se les prometió el Paraíso y comandante de la conquista de Siria, sucediendo a Khalid al mando del ejército. Falleció durante la peste de Amwas en el año 639."
  fr: "Abou Oubayda était le responsable de cette communauté. Il figurait parmi les Dix élus du Paradis et commandait la conquête de la Syrie. Il succéda à Khalid à la tête de l'armée. Il mourut de la peste d'Amwas en 639."
  ur: "ابو عبیدہ اس جماعت کے معتمد تھے۔ وہ جنت کے دس وعدوں میں سے ایک تھا اور شام کی فتح کا کمانڈر تھا، اور وہ خالد کے بعد فوج کا کمانڈر بنا۔ اس کا انتقال 639 میں طاعون امواس میں ہوا۔"
  tr: "Bu ulusun vekili Abu Ubeyde; on misyonerden biri ve el-Şam'ın fethi komutanı; Halid'in ordu üzerindeki halifesi, 639'da Amwas vebası nedeniyle öldü."
  id: "Abu Ubaidah, wali negara ini; salah satu dari sepuluh misionaris, dan komandan penaklukan al-Sham; khalifah Khalid atas tentara, yang meninggal karena wabah Amwas pada tahun 639."
question:
  ar: من كان أبو عبيدة بن الجراح؟
short_answer:
  ar: أبو عبيدة أمين هذه الأمة؛ من العشرة المبشرين وقائد فتح الشام؛ خليفة خالد على الجيش ومات بطاعون عمواس
    639.
long_answer:
  ar: '[[person/abu-ubayda-ibn-al-jarrah|أبو عبيدة]] من السابقين الأوائل والعشرة؛ سماه النبي أمين هذه
    الأمة؛ قاد فتح دمشق وحمص وبيت المقدس بعد عزل خالد؛ مات في طاعون عمواس 639 ومعه معاذ بن جبل وكثير من
    الصحابة. {cite:wikidata}'
