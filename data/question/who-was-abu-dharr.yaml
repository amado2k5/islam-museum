question:
  ar: من كان أبو ذر الغفاري؟
short_answer:
  ar: أبو ذر جندب بن جنادة؛ رابع أو خامس المسلمين وأشدهم صدقًا وقومًا بالحق؛ أوصى به النبي ونفي إلى الربذة
    فمات فيها.
long_answer:
  ar: '[[person/abu-dharr-al-ghifari|أبو ذر]] من السابقين جدًّا؛ نهى النبي عنه الاستهزاء فقال ما تحت أديم
    السماء ولا فوقه أصدق لهجة من أبي ذر؛ أنكر كنز المال وعابه فنفاه عثمان للربذة فمات فيها وحيدًا على
    سنة نبيه. {cite:wikidata}'
