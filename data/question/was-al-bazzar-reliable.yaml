id: question/was-al-bazzar-reliable
class: question
label: { ar: "هل كان البزار ثقة؟", en: "Was al-Bazzar reliable?", ur: "کیا بزار ثقہ تھے؟" }
summary:
  ar: "اختلفت أقوال نقاد الحديث في الحافظ أبي بكر البزار (ت 292هـ): وثّقه وأثنى على حفظه الخطيب البغدادي وأبو الشيخ والسمعاني وغيرهم، ونقل الدارقطني أنه يخطئ في الإسناد والمتن لأنه حدّث بالمسند بمصر من حفظه، وأن النسائي جرحه، وقال الدارقطني في موضع آخر: ثقة يخطئ كثيراً ويتكل على حفظه. {cite:musnad-bazzar-anas-thesis-1413 p.28} {cite:musnad-bazzar-anas-thesis-1413 p.29} {cite:musnad-bazzar-anas-thesis-1413 p.30}"
  en: "Hadith critics differed over al-Hafiz Abu Bakr al-Bazzar (d. 292 AH): al-Khatib al-Baghdadi, Abu al-Shaykh, al-Sam'ani and others called him trustworthy and praised his memory, while al-Daraqutni reported that he erred in chains and texts because he related the Musnad in Egypt from memory, and that al-Nasa'i criticised him; elsewhere al-Daraqutni called him trustworthy but often mistaken, relying on his memory."
  ur: "حافظ ابو بکر بزار (م 292ھ) کے بارے میں ناقدینِ حدیث کے اقوال مختلف ہیں: خطیب بغدادی، ابو الشیخ، سمعانی وغیرہ نے انہیں ثقہ کہا اور ان کے حافظے کی تعریف کی، جبکہ دارقطنی نے نقل کیا کہ وہ سند اور متن میں غلطی کرتے تھے کیونکہ انہوں نے مصر میں مسند حافظے سے بیان کی، اور نسائی نے ان پر جرح کی؛ دارقطنی نے ایک اور جگہ کہا: ثقہ، بہت غلطی کرتے، اپنے حافظے پر بھروسا کرتے۔"
question: { ar: "كيف حكم نقاد الحديث على البزار؟", en: "How did hadith critics judge al-Bazzar?" }
issue: { ar: "هل يُقبل حديث البزار مطلقاً، أم يُتوقف فيما أخطأ فيه حين حدّث بمسنده من حفظه بمصر؟" }
short_answer:
  ar: "الأكثرون على توثيقه والثناء على حفظه، ونُقل عن النسائي جرحه، وفسّره أبو أحمد الحاكم والدارقطني بالخطأ في الإسناد والمتن بسبب التحديث من الحفظ؛ وترى دراسة معاصرة أن ذلك لا يغضّ من قيمته."
  en: "Most called him trustworthy and praised his memory; criticism is reported from al-Nasa'i, explained by Abu Ahmad al-Hakim and al-Daraqutni as errors in chains and texts from relating by memory; a modern study holds that this does not lessen his worth."
