id: question/was-al-bazzar-reliable
class: question
label: { ar: "هل كان البزار ثقة؟", en: "Was al-Bazzar reliable?", ur: "کیا بزار ثقہ تھے؟", es: "¿Era fiable al-Bazzar?", fr: "Al-Bazzar était-il fiable ?", tr: "Bazzar güvenilir miydi?", id: "Apakah Bazzar dapat dipercaya?" }
summary:
  ar: "اختلفت أقوال نقاد الحديث في الحافظ أبي بكر البزار ⁦(ت 292هـ)⁩: وثّقه وأثنى على حفظه الخطيب البغدادي وأبو الشيخ والسمعاني وغيرهم، ونقل الدارقطني أنه يخطئ في الإسناد والمتن لأنه حدّث بالمسند بمصر من حفظه، وأن النسائي جرحه، وقال الدارقطني في موضع آخر: ثقة يخطئ كثيراً ويتكل على حفظه. {cite:musnad-bazzar-anas-thesis-1413 p.28} {cite:musnad-bazzar-anas-thesis-1413 p.29} {cite:musnad-bazzar-anas-thesis-1413 p.30}"
  en: "Hadith critics differed over al-Hafiz Abu Bakr al-Bazzar (d. 292 AH): al-Khatib al-Baghdadi, Abu al-Shaykh, al-Sam'ani and others called him trustworthy and praised his memory, while al-Daraqutni reported that he erred in chains and texts because he related the Musnad in Egypt from memory, and that al-Nasa'i criticised him; elsewhere al-Daraqutni called him trustworthy but often mistaken, relying on his memory."
  ur: "حافظ ابو بکر بزار ⁦(م 292ھ)⁩ کے بارے میں ناقدینِ حدیث کے اقوال مختلف ہیں: خطیب بغدادی، ابو الشیخ، سمعانی وغیرہ نے انہیں ثقہ کہا اور ان کے حافظے کی تعریف کی، جبکہ دارقطنی نے نقل کیا کہ وہ سند اور متن میں غلطی کرتے تھے کیونکہ انہوں نے مصر میں مسند حافظے سے بیان کی، اور نسائی نے ان پر جرح کی؛ دارقطنی نے ایک اور جگہ کہا: ثقہ، بہت غلطی کرتے، اپنے حافظے پر بھروسا کرتے۔"
  es: "Los críticos de los hadices discreparon sobre al-Hafiz Abu Bakr al-Bazzar (fallecido en el año 292 de la Hégira): al-Khatib al-Baghdadi, Abu al-Shaykh, al-Sam'ani y otros lo consideraron digno de confianza y elogiaron su memoria, mientras que al-Daraqutni informó que se equivocó en las cadenas y los textos porque relató el Musnad en Egipto de memoria, y que al-Nasa'i lo criticó; en otro lugar, al-Daraqutni lo consideró digno de confianza pero a menudo equivocado, basándose en su memoria."
  fr: "Les critiques de hadiths divergent au sujet d'al-Hafiz Abu Bakr al-Bazzar (mort en 292 AH): al-Khatib al-Baghdadi, Abu al-Shaykh, al-Sam'ani et d'autres le qualifient de digne de confiance et louent sa mémoire, tandis qu'al-Daraqutni rapporte qu'il s'est trompé dans les chaînes de transmission et les textes parce qu'il a relaté le Musnad en Égypte de mémoire, et qu'al-Nasa'i le critique; ailleurs, al-Daraqutni le qualifie de digne de confiance mais souvent erroné, se fiant à sa mémoire."
  tr: "Hadis eleştirmenlerinin görüşleri, hadis âlimi Ebu Bekir el-Bazzar (ö. 292 H) hakkında farklılık gösterir: el-Hatib el-Bağdadi, Ebu el-Şeyh, el-Sam'ani ve diğerleri tarafından doğrulanmış ve övülmüştür. El-Daraqutni, zincirde ve metinde hata yaptığını çünkü Mısır'daki Müsnedi ezbercisinden anlattığını ve el-Nasa'i'nin onu eleştirdiğini bildirmiştir. El-Daraqutni başka bir yerde şöyle demiştir: Güvenilir birçok hata yapar ve ezberine dayanır. {alıntı:musnad-bazzar-anas-tez-1413 s.28} {alıntı:musnad-bazzar-anas-tez-1413 s.29} {cite:musnad-bazzar-anas-tez-1413 s.30}"
  id: "Pendapat para kritikus hadis berbeda mengenai ulama hadis Abu Bakr al-Bazzar (wafat 292 H): ia disahkan dan dipuji oleh al-Khatib al-Baghdadi, Abu al-Sheikh, al-Sam'ani, dan lainnya. Al-Daraqutni melaporkan bahwa ia melakukan kesalahan dalam rantai dan teks karena ia menceritakan Musnad di Mesir dari pengapalnya, dan bahwa al-Nasa'i mengkritiknya. Al-Daraqutni berkata di tempat lain: Terpercaya sering melakukan kesalahan dan mengandalkan hafalannya. {cite:musnad-bazzar-anas-thesis-1413 hlm.28} {cite:musnad-bazzar-anas-thesis-1413 hlm.29} {cite:musnad-bazzar-anas-thesis-1413 hlm.30}"
question: { ar: "كيف حكم نقاد الحديث على البزار؟", en: "How did hadith critics judge al-Bazzar?" }
issue: { ar: "هل يُقبل حديث البزار مطلقاً، أم يُتوقف فيما أخطأ فيه حين حدّث بمسنده من حفظه بمصر؟" }
short_answer:
  ar: "الأكثرون على توثيقه والثناء على حفظه، ونُقل عن النسائي جرحه، وفسّره أبو أحمد الحاكم والدارقطني بالخطأ في الإسناد والمتن بسبب التحديث من الحفظ؛ وترى دراسة معاصرة أن ذلك لا يغضّ من قيمته."
  en: "Most called him trustworthy and praised his memory; criticism is reported from al-Nasa'i, explained by Abu Ahmad al-Hakim and al-Daraqutni as errors in chains and texts from relating by memory; a modern study holds that this does not lessen his worth."
