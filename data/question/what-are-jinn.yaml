question:
  ar: ما الجن؟
short_answer:
  ar: الجن عالم مستور من مخلوقات الله العاقلة المكلفة؛ يخالطون البشر ويؤمنون ويكفرون، وسورة الجن وردت
    خبر إسلامهم.
long_answer:
  ar: الجن مخلوقات عاقلة مكلفة من نار يخفى أعيننا عنها عادة؛ آمن فريق منهم بمحمد وكفر آخرون، ومنهم المؤمن
    والفاسق. تدور فيهم آيات وأحاديث وسورتان (الجن والأحقاف) ولهم في التراث الشعبي حضور كثيف. {cite:wikidata}
