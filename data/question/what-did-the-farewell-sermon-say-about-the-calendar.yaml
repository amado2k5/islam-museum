summary: { ar: "جواب عن فقرة النسيء في خطبة الوداع كما يرويها ابن إسحاق: زيادة في الكفر، واستدارة الزمان، وعدة الشهور اثنا عشر منها أربعة حرم.", en: "An answer on the calendar passage of the Farewell Sermon as Ibn Ishaq transmits it: intercalation as an increase in unbelief, time having come round, and the twelve months with four sacred." }
wings: []
question: { ar: "ماذا قالت خطبة الوداع عن النسيء والتقويم؟" }
short_answer: { ar: "قال النبي في خطبة الوداع إن النسيء زيادة في الكفر، يُضل به الذين كفروا يحلّون الشهر الحرام عاماً ويحرّمونه عاماً ليواطئوا عدة ما حرّم الله، وإن الزمان قد استدار كهيئته يوم خلق الله السماوات والأرض، وإن عدة الشهور عند الله اثنا عشر شهراً منها أربعة حرم: ثلاثة متوالية ورجب مضر الذي بين جمادى وشعبان." }
long_answer:
  ar: |
    يروي ابن إسحاق في خطبة النبي بحجة الوداع فقرة في التقويم: إن [[concept/nasi|النسيء]] زيادة في الكفر، يُضل به الذين كفروا، يحلّونه عاماً ويحرّمونه عاماً ليواطئوا عدة ما حرّم الله فيحلّوا ما حرّم الله ويحرّموا ما أحلّ الله {cite:ibn-hisham-saqqa 4/251}.

    ثم قال إن الزمان قد استدار كهيئته يوم خلق الله السماوات والأرض، وإن عدة الشهور عند الله اثنا عشر شهراً، منها أربعة حرم: ثلاثة متوالية، ورجب مضر الذي بين جمادى وشعبان {cite:ibn-hisham-saqqa 4/251}.

    ويفسّر محققو طبعة 1936 قوله «رجب مضر» بأن ربيعة كانت تحرّم رمضان وتسميه رجباً، فبيّن النبي أنه رجب مضر لا رجب ربيعة {cite:ibn-hisham-saqqa 4/251}. والفقرة قريبة من آيتي [[passage/quran-9-36|التوبة 36]] و[[passage/quran-9-37|التوبة 37]]، ويذكر ابن إسحاق نزول آية النسيء في سياق براءة {cite:ibn-hisham-saqqa 4/193}. انظر [[event/farewell-sermon-at-arafat|خطبة الوداع]] و[[work/farewell-sermon|نص الخطبة]].
