    standing: secondary
    stance: { ar: "الظاهرية ⁦(ابن حزم وداود)⁩: لا ربا في البيع والسلم إلا في الأصناف الستة", en: "Zahiri (Ibn Hazm and Dawud): there is no riba in sales and forward sales except in the six commodities", ur: "ظاہری (ابن حزم اور داؤد): بیع اور سلم میں ربا صرف چھ اشیا میں ہے" }
    summary: { ar: "يرى ابن حزم أن الله فصّل ما حرّم، فما فصّل تحريمه على لسان رسوله فهو حرام، وما لم يفصّله فهو حلال، فلا ربا في البيع إلا في الستة التي ذكرها النبي، ويعدّ معه طاوساً وقتادة وعثمان البتي وأبا سليمان داود وجميع أصحابه؛ ويرد العلل كلها بأنها دعاوى بلا برهان ينقض بعضها بعضاً، ويجعل الربا في القرض عاماً في كل شيء، فلا يُرد إلا مثل ما أُقرض نوعاً ومقداراً.", en: "Ibn Hazm holds that God has set out in detail what He forbade, so what is detailed as forbidden through His Messenger is forbidden and what is not is lawful; hence there is no sales riba except in the six the Prophet named, and he counts with him Tawus, Qatada, 'Uthman al-Batti, Abu Sulayman Dawud and all his school. He rejects all the proposed causes as unproven claims that undermine one another, and makes riba in loans general to everything, so that only the like of what was lent, in kind and amount, may be returned.", ur: "ابن حزم کے نزدیک اللہ نے جو حرام کیا اس کی تفصیل بیان کر دی، تو جس کی حرمت اس کے رسول کی زبان پر تفصیل سے آئی وہ حرام ہے اور جس کی نہیں آئی وہ حلال ہے؛ اس لیے بیع میں ربا صرف ان چھ میں ہے جن کا نبی نے ذکر کیا، اور وہ اپنے ساتھ طاؤس، قتادہ، عثمان البتی، ابو سلیمان داؤد اور اپنے تمام اصحاب کو شمار کرتے ہیں۔ وہ تمام علتوں کو بے دلیل دعوے قرار دے کر رد کرتے ہیں جو ایک دوسرے کو توڑتے ہیں، اور قرض میں ربا کو ہر چیز میں عام رکھتے ہیں، چنانچہ صرف وہی لوٹایا جائے جو جنس اور مقدار میں قرض دیا گیا۔" }
