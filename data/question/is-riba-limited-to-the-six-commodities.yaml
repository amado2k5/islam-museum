id: question/is-riba-limited-to-the-six-commodities
class: question
label: { ar: "هل يقتصر ربا البيوع على الأصناف الستة؟", en: "Is the riba of sales limited to the six commodities?", ur: "کیا بیع کا ربا چھ اشیا تک محدود ہے؟" }
question: { ar: "هل الأصناف الستة المذكورة في حديث الربا ⁦(الذهب والفضة والقمح والشعير والتمر والملح)⁩ هي وحدها ما يقع فيه ربا البيع، أم يقاس عليها ما شاركها في علة؟", en: "Are the six commodities named in the hadith on riba (gold, silver, wheat, barley, dates and salt) the only goods in which sales riba occurs, or are other goods that share their cause included by analogy?", ur: "کیا ربا کی حدیث میں مذکور چھ اشیا (سونا، چاندی، گندم، جو، کھجور اور نمک) ہی وہ چیزیں ہیں جن میں بیع کا ربا ہوتا ہے، یا ان کی علت میں شریک دوسری چیزیں قیاس سے شامل ہیں؟" }
issue: { ar: "هل نصّ الحديث على الأصناف الستة حصرٌ لمحل الربا، أم دلالة على علة يُلحق بها ما سواها؟ وما تلك العلة: الطعم، أو الادخار والاقتيات، أو الكيل والوزن؟", en: "Does the hadith's naming of six commodities fix the scope of riba, or point to a cause that extends it to other goods? And what is that cause: being food, being stored staple food, or being measured by volume or weight?", ur: "کیا حدیث میں چھ اشیا کا ذکر ربا کے محل کو محدود کرتا ہے، یا کسی علت کی طرف اشارہ ہے جس سے دوسری چیزیں ملحق ہوں؟ اور وہ علت کیا ہے: کھانا ہونا، ذخیرہ ہونے والی خوراک ہونا، یا ناپ اور تول؟" }
summary:
  ar: "يحكي ابن حزم في «المحلى» أن وقوع الربا في البيع والسلم في الأصناف الستة إجماع، وأنهم اختلفوا فيما عداها: فمالك يجعل العلة الادخار فيما يؤكل مع الثمنية، والشافعي الطعم مع الثمنية، وأبو حنيفة وأصحابه الكيل والوزن؛ ويرى هو ومعه داود وطاوس وقتادة وعثمان البتي أنه لا ربا في البيع إلا في الستة، والقرض وحده يقع فيه الربا في كل شيء {cite:muhalla-dar-ibn-hazm-2016-v10 p.299} {cite:muhalla-dar-ibn-hazm-2016-v10 p.301} {cite:muhalla-dar-ibn-hazm-2016-v10 p.302} {cite:muhalla-dar-ibn-hazm-2016-v10 p.319}."
  en: "Ibn Hazm reports in al-Muhalla that riba occurs in sales and forward sales of the six commodities by consensus, and that scholars differ over other goods: Malik makes the cause being stored food together with being a currency, al-Shafi'i being food together with being a currency, and Abu Hanifa and his followers being measured by volume or weight; he holds, with Dawud, Tawus, Qatada and 'Uthman al-Batti, that there is no sales riba except in the six, while in loans riba occurs in everything {cite:muhalla-dar-ibn-hazm-2016-v10 p.299} {cite:muhalla-dar-ibn-hazm-2016-v10 p.301} {cite:muhalla-dar-ibn-hazm-2016-v10 p.302} {cite:muhalla-dar-ibn-hazm-2016-v10 p.319}."
  ur: "ابن حزم «المحلی» میں نقل کرتے ہیں کہ چھ اشیا کی بیع اور سلم میں ربا کا ہونا اجماعی ہے، اور ان کے علاوہ میں اختلاف ہے: مالک علت ذخیرہ ہونے والی خوراک اور ثمنیت کو، شافعی خوراک اور ثمنیت کو، اور ابو حنیفہ اور ان کے اصحاب ناپ اور تول کو قرار دیتے ہیں؛ وہ خود، داؤد، طاؤس، قتادہ اور عثمان البتی کے ساتھ، کہتے ہیں کہ بیع میں ربا صرف چھ میں ہے، جبکہ قرض میں ربا ہر چیز میں ہے {cite:muhalla-dar-ibn-hazm-2016-v10 p.299} {cite:muhalla-dar-ibn-hazm-2016-v10 p.301} {cite:muhalla-dar-ibn-hazm-2016-v10 p.302} {cite:muhalla-dar-ibn-hazm-2016-v10 p.319}۔"
short_answer:
  ar: "الأئمة الثلاثة كما يحكيهم ابن حزم: يقاس على الستة ما شاركها في العلة، على اختلافهم فيها؛ ابن حزم وداود: لا ربا في البيع إلا في الستة."
  en: "The three imams as Ibn Hazm reports them: goods sharing the cause of the six are included, though they differ on the cause; Ibn Hazm and Dawud: there is no sales riba except in the six."
  ur: "تینوں ائمہ، ابن حزم کی نقل کے مطابق: چھ کی علت میں شریک چیزیں شامل ہیں، اگرچہ علت میں اختلاف ہے؛ ابن حزم اور داؤد: بیع میں ربا صرف چھ میں ہے۔"
perspectives:
  - tradition: sunni-hanafi
    id: hanafi-measure-and-weight
    standing: main
    stance: { ar: "العلة الكيل والوزن", en: "The cause is being measured by volume or weight", ur: "علت ناپ اور تول ہے" }
    summary: { ar: "يحكي ابن حزم أن أبا حنيفة وأصحابه جعلوا علة الربا الكيل والوزن في جنس واحد أو جنسين: فالمكيل بنوعه كيلاً بكيل يداً بيد، وبنوع آخر من المكيلات متفاضلاً يداً بيد لا نسيئة، والموزون كذلك، ويجوز بيع المكيل بالموزون متفاضلاً ونسيئة، وأن بعض متأخريهم عدل إلى «الكيل أو الوزن فيما يتعين» لانتقاض العلة في الذهب والفضة.", en: "Ibn Hazm reports that Abu Hanifa and his followers made the cause of riba being measured by volume or weight within one kind or two kinds: a measured good is sold for its own kind measure for measure, hand to hand, and for another measured kind with excess hand to hand but not on credit, and likewise for weighed goods, while a measured good may be sold for a weighed one with excess and on credit; some of their later scholars moved to 'volume or weight in what is specified' because the cause broke down for gold and silver.", ur: "ابن حزم نقل کرتے ہیں کہ ابو حنیفہ اور ان کے اصحاب نے ربا کی علت ایک یا دو جنسوں میں ناپ اور تول کو قرار دیا: ناپی جانے والی چیز اپنی جنس کے بدلے برابر ناپ سے ہاتھوں ہاتھ، اور دوسری ناپی جانے والی جنس کے بدلے کمی بیشی کے ساتھ ہاتھوں ہاتھ مگر ادھار نہیں، اور تولی جانے والی بھی اسی طرح، جبکہ ناپی جانے والی چیز کو تولی جانے والی کے بدلے کمی بیشی اور ادھار پر بیچنا جائز ہے؛ ان کے بعض متاخرین نے سونے چاندی میں علت ٹوٹنے کی وجہ سے «متعین چیز میں ناپ یا تول» کی طرف رجوع کیا۔" }
