    summary: { ar: "يرى ابن تيمية أن مالكاً لا يُعرف أنه كان معصوم الدم، وأن غاية ما يقال إنه كان معصوماً وقتله خالد بتأويل، وهذا لا يبيح قتل خالد، كما أنكر النبي على أسامة قتل من قال لا إله إلا الله ولم يوجب عليه قوداً ولا دية، وتبرأ مما صنع خالد ببني جذيمة ولم يقتله. ويعارض الطاعن بقتلة عثمان الذين لم يقتص منهم علي، ويرى أن رأي عمر مسألة اجتهاد، وأن خبر تزوج خالد بامرأته ليلة قتله لا يُعرف ثبوته، وأنه لو ثبت ففيه تأويل يمنع الحد لاختلاف الفقهاء في عدة امرأة المرتد والكافر.", en: "Ibn Taymiyya holds that Malik is not known to have had inviolable blood; at most it can be said that he did, and that Khalid killed him on an interpretation – which does not make Khalid liable to death, just as the Prophet rebuked Usama for killing a man who had said 'there is no god but God' without imposing retaliation or blood-money, and disowned what Khalid did to the Banu Jadhima without executing him. He turns the charge against the accuser by pointing to Uthman's killers, whom Ali did not punish; holds Umar's view to be a matter of independent judgement; and says the report that Khalid married Malik's wife the night he was killed is not known to be established – and, even if it were, the jurists' disagreement over the waiting period of an apostate's or unbeliever's widow would provide an interpretation averting any penalty.", ur: "ابن تیمیہ کے نزدیک یہ معلوم نہیں کہ مالک کا خون محفوظ تھا؛ زیادہ سے زیادہ یہ کہا جا سکتا ہے کہ تھا اور خالد نے تاویل کی بنا پر قتل کیا – جس سے خالد قتل کے مستحق نہیں ہوتے، جیسے نبی نے اسامہ کو لا الٰہ الا اللہ کہنے والے کے قتل پر ملامت کی مگر قصاص یا دیت لازم نہ کی، اور بنو جذیمہ کے ساتھ خالد کے فعل سے براءت کی مگر انہیں قتل نہ کیا۔ وہ اعتراض کرنے والے کے سامنے قاتلینِ عثمان کو پیش کرتے ہیں جن سے علی نے قصاص نہ لیا؛ عمر کی رائے کو اجتہادی مسئلہ قرار دیتے ہیں؛ اور کہتے ہیں کہ یہ خبر کہ خالد نے قتل کی رات مالک کی بیوی سے شادی کی، ثابت معلوم نہیں – اور اگر ثابت ہو تو بھی مرتد یا کافر کی بیوہ کی عدت میں فقہا کا اختلاف ایسی تاویل فراہم کرتا ہے جو حد کو روک دے۔" }
