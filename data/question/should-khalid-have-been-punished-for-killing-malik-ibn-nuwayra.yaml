    summary: { ar: "في نقل ابن تيمية: يقول الحلي إن أبا بكر أهمل حدود الله فلم يقتص من خالد ولا حده حين قتل مالك بن نويرة وكان مسلماً، وتزوج امرأته ليلة قتله، وإن عمر أشار بقتله؛ ويقول في موضع سابق إن خالداً قتل مالكاً صبراً وهو مسلم وعرس بامرأته، وإنهم سموا بني حنيفة أهل ردة لأنهم لم يحملوا الزكاة إلى أبي بكر. هذا عرض خصمه لحجته، ويحتاج إلى نص الحلي في منهاج الكرامة وإلى مصادر الإمامية أنفسهم.", en: "As Ibn Taymiyya quotes him: al-Hilli says Abu Bakr neglected God's penalties, neither retaliating against Khalid nor punishing him when he killed Malik ibn Nuwayra, a Muslim, and married his wife the night he was killed, though Umar advised that Khalid be killed. In an earlier passage he says Khalid killed Malik in captivity while he was a Muslim and took his wife, and that the Banu Hanifa were called apostates because they did not bring their alms to Abu Bakr. This is his opponent's presentation of his argument; it needs al-Hilli's own text in Minhaj al-Karama and the Imami sources themselves.", ur: "ابن تیمیہ کی نقل میں: حلی کہتے ہیں کہ ابو بکر نے اللہ کی حدود کو نظر انداز کیا، نہ خالد سے قصاص لیا نہ انہیں سزا دی جب انہوں نے مسلمان مالک بن نویرہ کو قتل کیا اور اسی رات ان کی بیوی سے شادی کی، حالانکہ عمر نے خالد کے قتل کا مشورہ دیا۔ ایک سابقہ مقام پر وہ کہتے ہیں کہ خالد نے مالک کو مسلمان ہوتے ہوئے قید میں قتل کیا اور ان کی بیوی کو لے لیا، اور یہ کہ بنو حنیفہ کو مرتد اس لیے کہا گیا کہ انہوں نے اپنی زکات ابو بکر کو نہ دی۔ یہ ان کے مخالف کی طرف سے ان کی دلیل کی پیشکش ہے؛ اس کے لیے منہاج الکرامہ میں حلی کا اپنا متن اور امامیہ کے اپنے مصادر درکار ہیں۔" }
