id: question/should-khalid-have-been-punished-for-killing-malik-ibn-nuwayra
class: question
label: { ar: "هل كان على أبي بكر أن يقتص من خالد بن الوليد لقتله مالك بن نويرة؟", en: "Should Abu Bakr have punished Khalid ibn al-Walid for killing Malik ibn Nuwayra?", ur: "کیا ابو بکر کو مالک بن نویرہ کے قتل پر خالد بن ولید سے قصاص لینا چاہیے تھا؟" }
summary:
  ar: "عدّ ابن المطهر الحلي من مطاعنه على أبي بكر أنه لم يقتص من خالد بن الوليد ولا حدّه حين قتل مالك بن نويرة وهو مسلم وتزوج امرأته ليلة قتله. ويجيب ابن تيمية في منهاج السنة بأن خالداً قتله متأولاً لأنه رآه مرتداً، وأن المتأول لا يُقتل كما لم يقتل النبي أسامة ولا خالداً في بني جذيمة، وأن رأي عمر في قتله اجتهاد، وأن خبر الزواج لا يُعرف ثبوته."
  en: "Ibn al-Mutahhar al-Hilli counted among his charges against Abu Bakr that he neither retaliated against Khalid ibn al-Walid nor punished him when Khalid killed Malik ibn Nuwayra, a Muslim, and married his wife the night he was killed. Ibn Taymiyya answers in Minhaj al-Sunna that Khalid killed him on an interpretation, believing him an apostate; that one who kills on an interpretation is not executed, as the Prophet executed neither Usama nor Khalid over the Banu Jadhima; that Umar's view that Khalid be killed was a matter of independent judgement; and that the marriage report is not known to be established."
  ur: "ابن المطہر حلی نے ابو بکر پر اپنے اعتراضات میں یہ شمار کیا کہ انہوں نے خالد بن ولید سے نہ قصاص لیا نہ حد لگائی جب خالد نے مالک بن نویرہ کو، جو مسلمان تھے، قتل کیا اور اسی رات ان کی بیوی سے شادی کی۔ ابن تیمیہ منہاج السنہ میں جواب دیتے ہیں کہ خالد نے انہیں تاویل کی بنا پر، مرتد سمجھ کر، قتل کیا؛ تاویل کرنے والے کو قتل نہیں کیا جاتا، جیسے نبی نے نہ اسامہ کو قتل کیا نہ بنو جذیمہ کے معاملے میں خالد کو؛ خالد کے قتل کے بارے میں عمر کی رائے اجتہادی تھی؛ اور شادی کی خبر کا ثبوت معلوم نہیں۔"
question: { ar: "هل كان على أبي بكر أن يقتص من خالد بن الوليد لقتله مالك بن نويرة؟", en: "Should Abu Bakr have punished Khalid ibn al-Walid for killing Malik ibn Nuwayra?", ur: "کیا ابو بکر کو مالک بن نویرہ کے قتل پر خالد بن ولید سے قصاص لینا چاہیے تھا؟" }
issue:
  ar: "هل كان مالك بن نويرة معصوم الدم حين قُتل، وهل يوجب قتله القود أو الحد على خالد، وهل في ترك أبي بكر ذلك مطعن؟"
  en: "Was Malik ibn Nuwayra's blood inviolable when he was killed, did his killing require retaliation or a penalty against Khalid, and is Abu Bakr's not imposing one a ground for censure?"
  ur: "کیا قتل کے وقت مالک بن نویرہ کا خون محفوظ تھا، کیا ان کے قتل پر خالد پر قصاص یا حد واجب تھی، اور کیا ابو بکر کے ایسا نہ کرنے میں کوئی قابلِ اعتراض بات ہے؟"
short_answer:
  ar: "ابن تيمية ⁦(أهل السنة)⁩: خالد قتله متأولاً، ولم تثبت عصمة دمه، والحدود تدرأ بالشبهات، ورأي عمر اجتهاد لا يُلزم أبا بكر، وخبر الزواج غير ثابت. الحلي كما ينقله ابن تيمية: كان مالك مسلماً قُتل صبراً، وتزوج خالد امرأته، فأهمل أبو بكر حدود الله وقد أشار عليه عمر بقتله."
  en: "Ibn Taymiyya (Sunni): Khalid killed him on an interpretation; Malik's inviolability was not established; penalties are averted by doubt; Umar's view was independent judgement not binding on Abu Bakr; and the marriage report is unproven. Al-Hilli as Ibn Taymiyya quotes him: Malik was a Muslim killed in captivity, Khalid married his wife, and Abu Bakr neglected God's penalties though Umar advised that Khalid be killed."
  ur: "ابن تیمیہ ⁦(اہلِ سنت)⁩: خالد نے تاویل کی بنا پر قتل کیا؛ مالک کے خون کا محفوظ ہونا ثابت نہیں؛ حدود شبہات سے ٹل جاتی ہیں؛ عمر کی رائے اجتہاد تھی جو ابو بکر پر لازم نہیں؛ اور شادی کی خبر ثابت نہیں۔ حلی، جیسا ابن تیمیہ نقل کرتے ہیں: مالک مسلمان تھے جنہیں قید میں قتل کیا گیا، خالد نے ان کی بیوی سے شادی کی، اور ابو بکر نے اللہ کی حدود کو نظر انداز کیا حالانکہ عمر نے خالد کے قتل کا مشورہ دیا تھا۔"
