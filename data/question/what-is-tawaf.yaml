id: question/what-is-tawaf
class: question
label:
  ar: "ما الطواف؟"
  en: What is tawaf?
summary:
  ar: "الطواف دوران بالكعبة سبعاً ابتداءً وانتهاءً بالحجر الأسود، وهو ركن في الحج والعمرة ويستحب عند دخول المسجد الحرام."
  en: Tawaf is circling the Kaaba seven times, beginning and ending at the Black Stone. It is a pillar of hajj and umrah, and it is recommended on entering the Sacred Mosque.
