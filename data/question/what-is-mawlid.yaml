long_answer:
  ar: 'المولد النبوي هو الاحتفاء بذكرى مولد النبي في الثاني عشر من ربيع الأول عند الجمهور؛ انتشر من القرن
    الرابع الهجري في مصر الفاطمية وفي أربيل زمن المظفر. يختلف العلماء فيه: المبيحون يستدلون بشكر النعمة
    وقراءة السيرة والصلاة عليه، والمنكرون يعدونه بدعة ما كان في صدر الإسلام. {cite:wikidata}'
