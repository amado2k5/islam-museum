id: question/what-is-mawlid
class: question
label:
  ar: ما المولد النبوي؟
  en: What is the Mawlid?
  es: "¿Qué es el Mawlid?"
  fr: "Qu'est-ce que le Mawlid ?"
  ur: "میلاد کیا ہے؟"
summary:
  ar: المولد النبوي هو الاحتفال بمولد النبي في ربيع الأول؛ انتشر من العصر الفاطمي واختلاف فيه العلماء
    بين مبيح ومنكر.
  en: "The Mawlid is the celebration of the Prophet's birth in Rabi al-Awwal. It spread from the Fatimid period, and scholars have disagreed about it, between those who permit it and those who reject it."
  es: "El Mawlid es la celebración del nacimiento del Profeta en Rabi al-Awwal. Se extendió desde el período fatimí, y los eruditos han discrepado al respecto, dividiéndose entre quienes lo permiten y quienes lo rechazan."
  fr: "Le Mawlid est la célébration de la naissance du Prophète au mois de Rabi al-Awwal. Cette pratique s'est répandue depuis la période fatimide et a fait l'objet de controverses parmi les savants, certains l'autorisant et d'autres la rejetant."
  ur: "میلاد ربیع الاول میں نبی کی ولادت کا جشن ہے۔ یہ فاطمی دور سے پھیلی ہے، اور علماء نے اس کے بارے میں، اس کی اجازت دینے والوں اور اسے رد کرنے والوں کے درمیان اختلاف کیا ہے۔"
question:
  ar: ما المولد النبوي؟
short_answer:
  ar: المولد النبوي هو الاحتفال بمولد النبي في ربيع الأول؛ انتشر من العصر الفاطمي واختلاف فيه العلماء
    بين مبيح ومنكر.
long_answer:
  ar: 'المولد النبوي هو الاحتفاء بذكرى مولد النبي في الثاني عشر من ربيع الأول عند الجمهور؛ انتشر من القرن
    الرابع الهجري في مصر الفاطمية وفي أربيل زمن المظفر. يختلف العلماء فيه: المبيحون يستدلون بشكر النعمة
    وقراءة السيرة والصلاة عليه، والمنكرون يعدونه بدعة ما كان في صدر الإسلام. {cite:wikidata}'
