  - tradition: sunni-ashari
    id: jalalayn-text
    standing: main
    stance: { ar: "تفسير بعض الصفات بلوازمها مع تفويض الاستواء", en: "Some attributes read by what they entail; the rising left to God", ur: "بعض صفات کی تفسیر لوازم سے، استوا میں تفویض" }
    summary:
      ar: "في نص الجلالين: الرحمة «إرادة الخير لأهله» في الفاتحة، واليد في آية البيعة من سورة الفتح «أي هو تعالى مطلع على مبايعتهم فيجازيهم عليها»، والاستواء على العرش في سورة يونس «استواءً يليق به». والمحلي شافعي، والسيوطي يصف تكملته بأنها مستفادة من قسم المحلي وأنه عليه في الآيات المتشابهة «الاعتماد والمعول» {cite:tafsir-jalalayn-dar-al-marifa-uthmani p.23} {cite:tafsir-jalalayn-dar-al-marifa-uthmani p.700} {cite:tafsir-jalalayn-dar-al-marifa-uthmani p.286} {cite:tafsir-jalalayn-lithograph-1278 p.369}."
      en: "In the Jalalayn text: mercy is 'willing good for those who deserve it' in al-Fatiha; the 'hand' in the verse of the pledge in Surat al-Fath means 'that is, He knows of their pledge and will requite them for it'; and the rising over the Throne in Surat Yunus is 'a rising befitting Him'. Al-Suyuti says his completion is drawn from al-Mahalli's part, on which he 'relies and depends' in the ambiguous (mutashabih) verses {cite:tafsir-jalalayn-dar-al-marifa-uthmani p.23} {cite:tafsir-jalalayn-dar-al-marifa-uthmani p.700} {cite:tafsir-jalalayn-dar-al-marifa-uthmani p.286} {cite:tafsir-jalalayn-lithograph-1278 p.369}."
      ur: "جلالین کے متن میں: سورۂ فاتحہ میں رحمت «اہل کے لیے ارادۂ خیر» ہے؛ سورۂ فتح کی آیتِ بیعت میں «ید» کا مطلب ہے «یعنی اللہ ان کی بیعت پر مطلع ہے اور انہیں اس کی جزا دے گا»؛ اور سورۂ یونس میں عرش پر استوا «ایسا استوا جو اس کے لائق ہے»۔ سیوطی کہتے ہیں کہ ان کا تکملہ محلی کے حصے سے ماخوذ ہے، جس پر متشابہ آیات میں ان کا «اعتماد اور بھروسا» ہے {cite:tafsir-jalalayn-dar-al-marifa-uthmani p.23} {cite:tafsir-jalalayn-dar-al-marifa-uthmani p.700} {cite:tafsir-jalalayn-dar-al-marifa-uthmani p.286} {cite:tafsir-jalalayn-lithograph-1278 p.369}۔"
