    summary:
      ar: "ينبّه محمد محمد تامر في مقدمة طبعته على أنه وقع في هذا التفسير بعض المخالفات الخاصة بآيات الأسماء والصفات، فيها بعض الموافقة لأقوال الأشاعرة أو الجهمية أو المعتزلة أو غيرهم، وأن ما عليه أهل السنة والجماعة إثبات ما أثبته الله لنفسه وما أثبته له رسوله بما يليق به، من غير تشبيه ولا تأويل ولا تعطيل {cite:tafsir-jalalayn-tamir-maktabat-al-iman p.3}."
      en: "In the introduction to his edition Muhammad Muhammad Tamir warns that this commentary contains some departures in the verses on the names and attributes, agreeing in part with the Ash'aris, the Jahmiyya, the Mu'tazila or others, and that what Ahl al-Sunna wa'l-Jama'a hold is to affirm what God affirmed of Himself and what His Messenger affirmed of Him, as befits Him, without likening, figurative reinterpretation or negation {cite:tafsir-jalalayn-tamir-maktabat-al-iman p.3}."
      ur: "محمد محمد تامر اپنے ایڈیشن کے مقدمے میں تنبیہ کرتے ہیں کہ اس تفسیر میں اسما و صفات کی آیات میں کچھ مخالفتیں ہیں، جن میں اشاعرہ، جہمیہ، معتزلہ یا دوسروں کے اقوال سے کچھ موافقت ہے، اور اہلِ سنت و الجماعت کا مسلک یہ ہے کہ جو اللہ نے اپنے لیے ثابت کیا اور جو اس کے رسول نے اس کے لیے ثابت کیا اسے اس کی شان کے مطابق، تشبیہ، تاویل اور تعطیل کے بغیر ثابت کیا جائے {cite:tafsir-jalalayn-tamir-maktabat-al-iman p.3}۔"
