id: question/how-does-tafsir-al-jalalayn-treat-the-divine-attributes
class: question
label:
  ar: "كيف يفسر «تفسير الجلالين» آيات الصفات؟"
  en: "How does Tafsir al-Jalalayn explain the verses on the divine attributes?"
  ur: "تفسیر الجلالین صفاتِ الٰہی کی آیات کی تفسیر کیسے کرتی ہے؟"
summary:
  ar: "يفسّر الجلالان بعض الصفات بلوازمها، كتفسير الرحمة بإرادة الخير لأهله، واليد في آية البيعة باطلاعه تعالى على مبايعتهم ومجازاته عليها، ويقولان في الاستواء على العرش «استواءً يليق به»؛ ويرى مراجع طبعة مكتبة الإيمان أن في الكتاب مخالفات في آيات الأسماء والصفات فيها موافقة لأقوال الأشاعرة أو غيرهم، وأن الحق عند أهل السنة والجماعة الإثبات بلا تشبيه ولا تأويل ولا تعطيل."
  en: "The two Jalals explain some attributes by what they entail — mercy as willing good for those who deserve it, the 'hand' in the verse of the pledge as God's knowledge of their pledge and His requital of it — and say of the rising over the Throne 'a rising befitting Him'. The reviser of the Maktabat al-Iman edition holds that the book contains departures in the verses on the names and attributes that agree with the Ash'aris or others, and that the truth for Ahl al-Sunna wa'l-Jama'a is affirmation without likening, figurative reinterpretation or negation."
  ur: "دونوں جلال بعض صفات کی تفسیر ان کے لوازم سے کرتے ہیں — رحمت کو اہل کے لیے ارادۂ خیر، اور آیتِ بیعت میں «ید» کو ان کی بیعت پر اللہ کی اطلاع اور اس کی جزا — اور عرش پر استوا کے بارے میں کہتے ہیں «ایسا استوا جو اس کے لائق ہے»۔ مکتبۃ الایمان ایڈیشن کے مراجع کے نزدیک کتاب میں اسما و صفات کی آیات میں ایسی مخالفتیں ہیں جن میں اشاعرہ یا دوسروں کے اقوال سے موافقت ہے، اور اہلِ سنت و الجماعت کے ہاں حق تشبیہ، تاویل اور تعطیل کے بغیر اثبات ہے۔"
question:
  ar: "هل يجري تفسير الجلالين في الصفات على طريقة الإثبات أم على التأويل؟"
  en: "Does Tafsir al-Jalalayn follow affirmation or figurative reinterpretation in the attributes?"
  ur: "کیا تفسیر الجلالین صفات میں اثبات کے طریقے پر ہے یا تاویل کے؟"
short_answer:
  ar: "يجمع بين الأمرين: يؤوّل بعض الصفات بلوازمها ويفوّض في الاستواء بعبارة «يليق به»؛ ويعدّ مراجع طبعة مكتبة الإيمان التأويل فيه مخالفة لمنهج أهل السنة والجماعة في الإثبات."
  en: "It does both: it reads some attributes by what they entail and leaves the rising to God with the phrase 'befitting Him'; the reviser of the Maktabat al-Iman edition counts the reinterpretations a departure from the Sunni method of affirmation."
  ur: "دونوں: بعض صفات کی تاویل لوازم سے کرتی ہے اور استوا میں «اس کے لائق» کے الفاظ سے تفویض کرتی ہے؛ مکتبۃ الایمان ایڈیشن کے مراجع اس کی تاویلات کو اثبات کے سنی منہج سے مخالفت سمجھتے ہیں۔"
