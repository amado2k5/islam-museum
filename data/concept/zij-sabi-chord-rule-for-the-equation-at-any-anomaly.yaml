id: concept/zij-sabi-chord-rule-for-the-equation-at-any-anomaly
class: concept
kind: scientific
label: { ar: "قاعدة الأوتار للتعديل عند أي بعد", en: "The chord rule for the equation at any anomaly", ur: "کسی بھی بُعد پر تعدیل کے لیے وتروں کا قاعدہ", es: "La regla de la cuerda para la ecuación en cualquier anomalía", fr: "La règle des cordes pour l'équation à toute anomalie", tr: "İp ayar tabanı her mesafede", id: "Basis penyesuaian senar pada jarak berapa pun" }
summary:
  ar: "يصف البتاني عملاً بالحساب للتعديل: يؤخذ وتر الحاصة ووتر ما يبقى لتمامها إلى حد معلوم، ويضرب كل واحد من الوترين في نصف قطر فلك التدوير للكوكب، ويقسم الناتج على نصف القطر، ثم يضم إلى ستين ما يخرج لوتر التمام، ويربع، ويضاف إليه مربع ما خرج للوتر الأول، ويؤخذ الجذر ويحفظ، ثم يضرب ما خرج للتمام في نصف القطر ويقسم على الجذر المحفوظ، وتؤخذ قوسه {cite:zij-sabi-nallino-byblion pp.76-77}."
  en: "Al-Battani describes a calculation for the equation: the chord of the argument and the chord of what remains to complete it to a known limit are taken, each is multiplied by the radius of the planet's epicycle and the product divided by the radius; what comes out for the complement chord is added to sixty and squared, the square of what came out for the first chord is added to it, the root is taken and kept; then the complement figure is multiplied by the radius, divided by the kept root, and its arc taken {cite:zij-sabi-nallino-byblion pp.76-77}."
  ur: "البتانی تعدیل کے لیے ایک حسابی عمل بیان کرتے ہیں: حاصہ کا وتر اور اس کے باقی کا وتر، ایک معلوم حد تک تمام کرنے کے لیے، لیے جاتے ہیں، ان میں سے ہر ایک کو ستارے کے فلکِ تدویر کے نصف قطر سے ضرب دے کر حاصل کو نصف قطر پر تقسیم کیا جاتا ہے؛ تمام کے وتر کے لیے جو نکلے اسے ساٹھ میں جمع کر کے مربع کیا جاتا ہے، اس میں پہلے وتر کے لیے نکلے ہوئے کا مربع جمع کیا جاتا ہے، جذر لے کر محفوظ کیا جاتا ہے؛ پھر تمام کے حاصل کو نصف قطر سے ضرب دے کر محفوظ جذر پر تقسیم کر کے اس کی قوس لی جاتی ہے {cite:zij-sabi-nallino-byblion pp.76-77}۔"
  es: "Al-Battani describe un cálculo para la ecuación: se toma la cuerda del argumento y la cuerda de lo que queda para completarlo hasta un límite conocido, cada una se multiplica por el radio del epiciclo del planeta y el producto se divide por el radio; lo que sale para la cuerda complementaria se suma a sesenta y se eleva al cuadrado, se le suma el cuadrado de lo que salió para la primera cuerda, se toma la raíz y se guarda; luego la figura del complemento se multiplica por el radio, se divide por la raíz guardada y se toma su arco {cite:zij-sabi-nallino-byblion pp.76-77}."
  fr: "Al-Battani décrit un calcul pour l'équation: on prend la corde de l'argument et la corde restante pour la compléter jusqu'à une limite connue, on multiplie chacune par le rayon de l'épicycle de la planète et le produit est divisé par le rayon; ce qui reste pour la corde complémentaire est ajouté à soixante et mis au carré, le carré de ce qui reste pour la première corde est ajouté à celui-ci, la racine est prise et conservée; puis la figure complémentaire est multipliée par le rayon, divisée par la racine conservée, et son arc est pris {cite:zij-sabi-nallino-byblion pp.76-77}."
  tr: "El-Battani, düzeltme için bir hesaplama yöntemi şöyle açıklıyor: Küresel düzlemin kirişi ve tamamlanması için kalan kiriş bilinen bir sınıra kadar alınır ve her iki kiriş de gezegenin yörüngesinin yarıçapı ile çarpılır, sonuç yarıçapa bölünür, ardından tamamlanma kirişi için elde edilen değere altmış eklenir ve karesi alınır, ilk kiriş için elde edilen değerin karesi de buna eklenir ve kök alınır ve saklanır, daha sonra tamamlanma için elde edilen değer yarıçapla çarpılır ve saklanan köke bölünür ve yayı alınır. {cite:zij-sabi-nallino-byblion pp.76-77}"
  id: "Al-Battani menjelaskan perhitungan untuk penyesuaian: Tali busur bidang bola dan tali busur yang tersisa untuk penyelesaiannya diambil hingga batas yang diketahui, dan masing-masing dari kedua tali busur tersebut dikalikan dengan jari-jari orbit planet, dan hasilnya dibagi dengan jari-jari, kemudian ditambahkan dengan enam puluh hasil yang diperoleh untuk tali busur penyelesaian, dan dikuadratkan, dan kuadrat dari hasil yang diperoleh untuk tali busur pertama ditambahkan kepadanya, dan akarnya diambil dan disimpan, kemudian hasil yang diperoleh untuk penyelesaian dikalikan dengan jari-jari dan dibagi dengan akar yang disimpan, dan busurnya diambil {cite:zij-sabi-nallino-byblion pp.76-77}."
