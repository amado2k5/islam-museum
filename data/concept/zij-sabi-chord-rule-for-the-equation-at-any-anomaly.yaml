label: { ar: "قاعدة الأوتار للتعديل عند أي بعد", en: "The chord rule for the equation at any anomaly", ur: "کسی بھی بُعد پر تعدیل کے لیے وتروں کا قاعدہ", es: "La regla de la cuerda para la ecuación en cualquier anomalía" }
summary:
  ar: "يصف البتاني عملاً بالحساب للتعديل: يؤخذ وتر الحاصة ووتر ما يبقى لتمامها إلى حد معلوم، ويضرب كل واحد من الوترين في نصف قطر فلك التدوير للكوكب، ويقسم الناتج على نصف القطر، ثم يضم إلى ستين ما يخرج لوتر التمام، ويربع، ويضاف إليه مربع ما خرج للوتر الأول، ويؤخذ الجذر ويحفظ، ثم يضرب ما خرج للتمام في نصف القطر ويقسم على الجذر المحفوظ، وتؤخذ قوسه {cite:zij-sabi-nallino-byblion pp.76-77}."
  en: "Al-Battani describes a calculation for the equation: the chord of the argument and the chord of what remains to complete it to a known limit are taken, each is multiplied by the radius of the planet's epicycle and the product divided by the radius; what comes out for the complement chord is added to sixty and squared, the square of what came out for the first chord is added to it, the root is taken and kept; then the complement figure is multiplied by the radius, divided by the kept root, and its arc taken {cite:zij-sabi-nallino-byblion pp.76-77}."
  ur: "البتانی تعدیل کے لیے ایک حسابی عمل بیان کرتے ہیں: حاصہ کا وتر اور اس کے باقی کا وتر، ایک معلوم حد تک تمام کرنے کے لیے، لیے جاتے ہیں، ان میں سے ہر ایک کو ستارے کے فلکِ تدویر کے نصف قطر سے ضرب دے کر حاصل کو نصف قطر پر تقسیم کیا جاتا ہے؛ تمام کے وتر کے لیے جو نکلے اسے ساٹھ میں جمع کر کے مربع کیا جاتا ہے، اس میں پہلے وتر کے لیے نکلے ہوئے کا مربع جمع کیا جاتا ہے، جذر لے کر محفوظ کیا جاتا ہے؛ پھر تمام کے حاصل کو نصف قطر سے ضرب دے کر محفوظ جذر پر تقسیم کر کے اس کی قوس لی جاتی ہے {cite:zij-sabi-nallino-byblion pp.76-77}۔"
  es: "Al-Battani describe un cálculo para la ecuación: se toma la cuerda del argumento y la cuerda de lo que queda para completarlo hasta un límite conocido, cada una se multiplica por el radio del epiciclo del planeta y el producto se divide por el radio; lo que sale para la cuerda complementaria se suma a sesenta y se eleva al cuadrado, se le suma el cuadrado de lo que salió para la primera cuerda, se toma la raíz y se guarda; luego la figura del complemento se multiplica por el radio, se divide por la raíz guardada y se toma su arco {cite:zij-sabi-nallino-byblion pp.76-77}."
