label:
  ar: "الدين (في الفقه)"
  en: "Debt (dayn) in fiqh"
  ur: "قرض یا دین (فقہی احکام)"
summary:
  ar: "الدين في اصطلاح الفقهاء لزوم حق في الذمة، ويشمل المال وغيره كالصلاة الفائتة والزكاة، ويجب من سبب يقتضيه كالعقد أو الإتلاف أو الجناية أو الزكاة أو النفقة أو الأداء عن الغير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8310} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8318} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8319} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8320} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8321} وتتعلق الديون بذمة المدين لا بأمواله، إلا ما استوثق منه بالرهن، أو ما تعلق بمال المفلس أو المريض مرض الموت أو التركة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8314} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8315} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8316}"
  en: "In fiqh a debt is a binding right in the obligor's liability; it covers money and other things, such as a missed prayer or zakat, and arises from a contract, a wrong, damage, a legal trigger, paying for another, or a benefit done without permission. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8310} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8318} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8319} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8320} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8321} A debt attaches to the debtor's liability and not to his property, except where it is secured by a pledge, where the debtor is bankrupt or dying ill, or where it falls on the estate. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8314} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8315} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8316}"
  ur: "فقہاء کے نزدیک دین وہ حق ہے جو ذمہ میں لازم ہو، اور اس کے اسباب میں عقد، اتلاف، جنایت، زکوٰۃ، نفقہ اور دوسرے کی طرف سے ادائیگی شامل ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8310} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8318} دین کا تعلق مدیون کی ذمہ داری سے ہوتا ہے، اس کے اموال سے نہیں، سوائے مخصوص صورتوں کے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8314}"
