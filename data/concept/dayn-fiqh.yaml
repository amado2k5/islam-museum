label:
  ar: "الدين ⁦(في الفقه)⁩"
  en: "Debt (dayn) in fiqh"
  ur: "قرض یا دین ⁦(فقہی احکام)⁩"
  es: "Deuda (dayn) en fiqh"
  fr: "Dette (dayn) en fiqh"
  tr: "Din (Fıkıh alanında)"
  id: "Agama (dalam Jurisprudensi)"
summary:
  ar: "الدين في اصطلاح الفقهاء لزوم حق في الذمة، ويشمل المال وغيره كالصلاة الفائتة والزكاة، ويجب من سبب يقتضيه كالعقد أو الإتلاف أو الجناية أو الزكاة أو النفقة أو الأداء عن الغير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8310} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8318} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8319} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8320} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8321} وتتعلق الديون بذمة المدين لا بأمواله، إلا ما استوثق منه بالرهن، أو ما تعلق بمال المفلس أو المريض مرض الموت أو التركة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8314} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8315} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8316}"
  en: "In fiqh a debt is a binding right in the obligor's liability; it covers money and other things, such as a missed prayer or zakat, and arises from a contract, a wrong, damage, a legal trigger, paying for another, or a benefit done without permission. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8310} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8318} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8319} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8320} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8321} A debt attaches to the debtor's liability and not to his property, except where it is secured by a pledge, where the debtor is bankrupt or dying ill, or where it falls on the estate. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8314} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8315} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8316}"
  ur: "فقہاء کے نزدیک دین وہ حق ہے جو ذمہ میں لازم ہو، اور اس کے اسباب میں عقد، اتلاف، جنایت، زکوٰۃ، نفقہ اور دوسرے کی طرف سے ادائیگی شامل ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8310} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8318} دین کا تعلق مدیون کی ذمہ داری سے ہوتا ہے، اس کے اموال سے نہیں، سوائے مخصوص صورتوں کے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8314}"
  es: "En fiqh, una deuda es un derecho vinculante para la responsabilidad del deudor; abarca dinero y otras cosas, como una oración omitida o el zakat, y surge de un contrato, un agravio, un daño, un detonante legal, el pago por otra persona o un beneficio realizado sin permiso. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8310} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8318} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8319} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8320} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8321} Una deuda se adjunta a la responsabilidad del deudor y no a su propiedad, excepto cuando está garantizada por una prenda, cuando el deudor está en bancarrota o muriendo enfermo, o cuando recae sobre la herencia. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8314} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8315} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8316}"
  fr: "En droit islamique (fiqh), une dette est un droit contraignant qui engage la responsabilité du débiteur; elle couvre l'argent et d'autres choses, comme une prière manquée ou la zakat, et résulte d'un contrat, d'un tort, d'un dommage, d'un déclencheur légal, du paiement pour autrui ou d'un avantage obtenu sans autorisation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8310} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8318} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8319} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8320} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8321} Une dette s'attache à la responsabilité du débiteur et non à ses biens, sauf lorsqu'elle est garantie par un gage, lorsque le débiteur est en faillite ou mourant d'une maladie, ou lorsqu'elle tombe sur la succession. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8314} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8315} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8316}"
  tr: "Hukukçuların terminolojisinde, borç borç içinde bir haktır ve para ile kaçırılmış namazlar ve zekat gibi diğer konuları da kapsar. Zorunlu bir nedenle zorunludur; örneğin sözleşme, imha, ağır suç, zekat, nafaka veya başkaları adına ödeme gibi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8310} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8318} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8319} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8320} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8321} Borçlar, borçlunun borcu ile ilgilidir, parası ile değil; ipotekle güvence altına alınanlar veya iflas, hasta veya ölmekte olan kişinin mal varlığı ya da mal varlığı hariç. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8314} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8315} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8316}"
  id: "Dalam istilah ahli hukum, utang adalah hak dalam utang, dan termasuk uang serta hal-hal lain seperti doa yang terlewat dan zakat. Utang wajib karena alasan yang memerlukannya, seperti kontrak, penghancuran, kejahatan, zakat, pemeliharaan, atau pembayaran atas nama orang lain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8310} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8318} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8319} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8320} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8321} Utang berkaitan dengan kewajiban debitur, bukan uangnya, kecuali yang dijamin dengan hipotek, atau yang berkaitan dengan properti orang yang bangkrut, sakit, atau sekarat, atau harta warisan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8314} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8315} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8316}"
