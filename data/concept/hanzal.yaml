summary:
  ar: "الحنظل ذكر وأنثى؛ الذكر ليفي أقوى، والأنثى رخوة بيضاء، والمختار الأبيض اللين، ويجب أن يُسحق بعناية وأن يُصلَح بالكثيراء لا بالصمغ؛ وهو حار في الثالثة يابس، ويُذكر له تحليل وتقطيع وتنفيع الأورام والنفض، ومنه سمّية تحتاج إلى الحذر، والمقادير محذوفة."
  en: "Hanzal has a male and a female kind. The male is fibrous and stronger; the female is soft and white, and the white soft kind is preferred. It must be crushed with care and corrected with tragacanth rather than gum. It is hot in the third degree and dry. The book lists uses for dissolving, cutting, ripening swellings and for purging, and it is also a dangerous poison; the measured amounts are left out."
  ur: "حنظل کی دو قسمیں ہیں، نر اور مادہ؛ نر ریشے دار اور زیادہ قوی ہے، مادہ نرم اور سفید؛ مختار سفید اور نرم ہے۔ اسے احتیاط سے پیسنا اور صمغ کے بجائے کثیرا سے درست کرنا چاہیے۔ یہ تیسرے درجے میں گرم اور خشک ہے، اور کتاب اسے تحلیل، کاٹنے، سوجن پکانے اور اسہال کے لیے بتاتی ہے، اور یہ خطرناک زہر بھی ہے؛ مقداریں حذف ہیں۔"
  es: "El hanzal tiene dos variedades: masculina y femenina. La masculina es fibrosa y más resistente; la femenina es suave y blanca, siendo esta última la preferida. Debe triturarse con cuidado y corregirse con tragacanto en lugar de goma. Es caliente, de tercer grado, y seca. El libro enumera sus usos para disolver, cortar, curar hinchazones y purgar, y también es un veneno peligroso; las cantidades medidas no se especifican."
  fr: "Il existe deux variétés de Hanzal: la variété mâle et la variété femelle. La variété mâle est fibreuse et plus résistante; la variété femelle est douce et blanche, et c’est cette dernière qui est préférable. Il faut la broyer avec précaution et la corriger avec de la gomme adragante plutôt qu’avec de la gomme. Elle est chaude au troisième degré et sèche. L’ouvrage mentionne ses usages pour dissoudre, couper, faire mûrir les gonflements et pour purger, mais aussi comme poison dangereux; les doses précises ne sont pas indiquées."
  tr: "Kobra erkek ve dişidir; erkek daha güçlü liflidir, dişi yumuşak ve beyazdır, seçilen beyaz ise yumuşaktır. Dikkatlice ezilmeli ve sakız yerine birçok türle işlenmelidir; üçüncü yılda sıcak ve kurudur, analiz, kesim ve tümörlerin faydalı tedavisi ile silkeleme için belirtilir. Bundan kaynaklanan toksisitedir ve içerikler çıkarılır."
  id: "Kobra adalah jantan dan betina; jantan lebih kuat berserat, betina lembut dan putih, dan putih pilihan lembut. Kobra harus dihancurkan dengan hati-hati dan diolah dengan berbagai jenis, bukan dengan permen kain; pada tahun ketiga panas dan kering, dan disebutkan untuk analisis, pemotongan, dan pengobatan tumor serta pengocaran yang bermanfaat. Dari sini, toksisitas yang memerlukan kehati-hatian, dan bahan-bahannya dihilangkan."
