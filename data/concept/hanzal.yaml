summary:
  ar: "الحنظل ذكر وأنثى؛ الذكر ليفي أقوى، والأنثى رخوة بيضاء، والمختار الأبيض اللين، ويجب أن يُسحق بعناية وأن يُصلَح بالكثيراء لا بالصمغ؛ وهو حار في الثالثة يابس، ويُذكر له تحليل وتقطيع وتنفيع الأورام والنفض، ومنه سمّية تحتاج إلى الحذر، والمقادير محذوفة."
  en: "Hanzal has a male and a female kind. The male is fibrous and stronger; the female is soft and white, and the white soft kind is preferred. It must be crushed with care and corrected with tragacanth rather than gum. It is hot in the third degree and dry. The book lists uses for dissolving, cutting, ripening swellings and for purging, and it is also a dangerous poison; the measured amounts are left out."
  ur: "حنظل کی دو قسمیں ہیں، نر اور مادہ؛ نر ریشے دار اور زیادہ قوی ہے، مادہ نرم اور سفید؛ مختار سفید اور نرم ہے۔ اسے احتیاط سے پیسنا اور صمغ کے بجائے کثیرا سے درست کرنا چاہیے۔ یہ تیسرے درجے میں گرم اور خشک ہے، اور کتاب اسے تحلیل، کاٹنے، سوجن پکانے اور اسہال کے لیے بتاتی ہے، اور یہ خطرناک زہر بھی ہے؛ مقداریں حذف ہیں۔"
