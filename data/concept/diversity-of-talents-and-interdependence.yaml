id: concept/diversity-of-talents-and-interdependence
class: concept
kind: belief
label: { ar: "تنوع المواهب والتكامل الاجتماعي", en: "Diversity of talents and social interdependence", ur: "صلاحیتوں کا تنوع اور سماجی باہمی انحصار" }
summary:
  ar: "يرى الشعراوي أن الله وزع المواهب على الخلق ولم يجمعها في إنسان واحد، ليتكامل العالم ويحتاج بعضه إلى بعض، وأن التفاضل ضروري لينشأ التكامل، وأن الناس بخير ما تباينوا، وأن التنافس على الموهبة الواحدة يفسد المجتمع {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1143} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1144}."
  en: "Sha'rawi holds that God distributed talents among creatures and did not gather them in one person, so that the world completes itself and each part needs the others. Difference of rank is needed for complementarity, people are best when they differ, and rivalry over one shared talent corrupts society {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1143} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1144}."
  ur: "شعراوی کے نزدیک اللہ نے صلاحیتیں مخلوق میں بانٹیں اور ایک شخص میں جمع نہیں کیں، تاکہ دنیا مکمل ہو اور ایک حصہ دوسرے کا محتاج ہو۔ ان کے نزدیک تفاضل تکمیل کے لیے ضروری ہے، لوگ اختلاف میں بہتر ہیں، اور ایک ہی صلاحیت پر مقابلہ سماج کو بگاڑ دیتا ہے {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1143} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1144}۔"
