id: concept/diversity-of-talents-and-interdependence
class: concept
kind: belief
label: { ar: "تنوع المواهب والتكامل الاجتماعي", en: "Diversity of talents and social interdependence", ur: "صلاحیتوں کا تنوع اور سماجی باہمی انحصار", es: "Diversidad de talentos e interdependencia social", fr: "Diversité des talents et interdépendance sociale", tr: "Yetenek çeşitliliği ve sosyal entegrasyon", id: "Keberagaman bakat dan integrasi sosial" }
summary:
  ar: "يرى الشعراوي أن الله وزع المواهب على الخلق ولم يجمعها في إنسان واحد، ليتكامل العالم ويحتاج بعضه إلى بعض، وأن التفاضل ضروري لينشأ التكامل، وأن الناس بخير ما تباينوا، وأن التنافس على الموهبة الواحدة يفسد المجتمع {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1143} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1144}."
  en: "Sha'rawi holds that God distributed talents among creatures and did not gather them in one person, so that the world completes itself and each part needs the others. Difference of rank is needed for complementarity, people are best when they differ, and rivalry over one shared talent corrupts society {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1143} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1144}."
  ur: "شعراوی کے نزدیک اللہ نے صلاحیتیں مخلوق میں بانٹیں اور ایک شخص میں جمع نہیں کیں، تاکہ دنیا مکمل ہو اور ایک حصہ دوسرے کا محتاج ہو۔ ان کے نزدیک تفاضل تکمیل کے لیے ضروری ہے، لوگ اختلاف میں بہتر ہیں، اور ایک ہی صلاحیت پر مقابلہ سماج کو بگاڑ دیتا ہے {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1143} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1144}۔"
  es: "Sha'rawi sostiene que Dios distribuyó los talentos entre las criaturas y no los concentró en una sola persona, de modo que el mundo se completa a sí mismo y cada parte necesita de las demás. La diferencia de rango es necesaria para la complementariedad, las personas son mejores cuando difieren, y la rivalidad por un talento compartido corrompe la sociedad {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1143} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1144}."
  fr: "Sha'rawi soutient que Dieu a réparti les talents entre les créatures et ne les a pas concentrés en une seule personne, afin que le monde soit complet et que chaque partie ait besoin des autres. La différence de rang est nécessaire à la complémentarité, les individus s'épanouissent dans la diversité, et la rivalité autour d'un talent partagé corrompt la société {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1143} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1144}."
  tr: "Al-Shaarawi, Tanrı'nın yetenekleri yaratılış arasında dağıttığına ve onları bir kişide toplamadığına, böylece dünyanın mükemmel olması ve bazılarının birbirine ihtiyaç duyması için bir arada toplamadığına, entegrasyonun ortaya çıkması için ayrımcılığın gerekli olduğuna, insanların farklılıklarından daha iyi olduğuna ve tek bir yetenek için rekabetin toplumu yozlaştırdığına inanır {cite:tafsir-sharawi-khawatir-scan-vol-2 s.1143} {cite:tafsir-sharawi-khawatir-scan-vol-vol-2 s.1144}."
  id: "Al-Shaarawi percaya bahwa Tuhan membagikan bakat di antara ciptaan dan tidak mengumpulkannya dalam satu orang, agar dunia menjadi sempurna dan beberapa saling membutuhkan, bahwa diferensiasi diperlukan agar integrasi tercipta, bahwa manusia lebih baik daripada yang berbeda, dan bahwa persaingan atas satu bakat merusak masyarakat {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1143} {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1144}."
