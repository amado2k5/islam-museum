label: { ar: "مخطط هشت بهشت ⁦(المخطط التساعي)⁩", en: "Hasht bihisht (nine-part) plan", ur: "ہشت بہشت ⁦(نو حصوں والا)⁩ نقشہ", es: "Plan hasht bihisht (nueve partes)", fr: "Plan Hasht bihisht (en neuf parties)" }
summary:
  ar: "مخطط تيموري يقسم مثمناً أو مربعاً مشطوفاً بأربعة خطوط متقاطعة إلى تسعة أجزاء حول غرفة وسطى مقببة، طُبّق في ضريح همايون وتاج محل {cite:rezavi-iranian-influence-indian-architecture-2002 p.138}."
  en: "A Timurid layout dividing an octagon or chamfered square by four crossing lines into nine units around a central domed chamber, applied in Humayun's tomb and the Taj Mahal {cite:rezavi-iranian-influence-indian-architecture-2002 p.138}."
  es: "Un diseño timúrida que divide un octágono o cuadrado achaflanado por cuatro líneas que se cruzan en nueve unidades alrededor de una cámara central abovedada, aplicado en la tumba de Humayun y el Taj Mahal {cite:rezavi-iranian-influence-indian-architecture-2002 p.138}."
  fr: "Un agencement timouride divisant un octogone ou un carré chanfreiné par quatre lignes croisées en neuf unités autour d'une chambre centrale à coupole, appliqué dans le tombeau d'Humayun et le Taj Mahal {cite:rezavi-iranian-influence-indian-architecture-2002 p.138}."
  ur: "ایک مرکزی گنبد والے چیمبر کے ارد گرد ایک آکٹون یا چیمفرڈ مربع کو چار کراسنگ لائنوں سے تقسیم کرنے والا تیموری ترتیب، ہمایوں کے مقبرے اور تاج محل میں لاگو کیا گیا ہے"
