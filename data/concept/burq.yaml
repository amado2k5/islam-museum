summary:
  ar: "أقوى من الملح ومن جنسه، لكن ليس فيه قبض، ويجلو بقوة ويغسل. أجوده الأرمني الخفيف الأبيض، والأفريقي جلاؤه صِرف. ينقي ويقطع الأخلاط الغليظة، وينفع من الحكة والجرب وأمراض الجلد، وينفع من الفالج، ويستعمل في الأذن للصمم، ويفيد في القتل للدود، وينفع من خناق الفطر، وهو رديء للمعدة {cite:canon-ibn-sina-print-v1 p.389}، {cite:canon-ibn-sina-print-v1 p.390}."
  en: "Stronger than salt and of its kind, but without astringency. It polishes strongly and washes. The best kind is the light white Armenian; the African kind is purely polishing. It cleanses and cuts thick humours, helps itch, scabies and skin conditions, helps paralysis, is dropped into the ear for deafness, and kills worms. The book says it is harmful to the stomach {cite:canon-ibn-sina-print-v1 p.389}, {cite:canon-ibn-sina-print-v1 p.390}."
  fr: "Plus fort que le sel et de même nature, mais sans astringence. Il polit et lave fortement. Le meilleur serait l’arménien léger et blanc ; l’africain est purement polissant. Selon le livre, il nettoierait et couperait les humeurs épaisses, aiderait démangeaisons, gale, affections cutanées et paralysie ; instillé dans l’oreille, il aiderait la surdité et tuerait les vers. Le livre le dit nuisible à l’estomac {cite:canon-ibn-sina-print-v1 p.389}, {cite:canon-ibn-sina-print-v1 p.390}."
  ur: "یہ نمک سے زیادہ قوی اور اسی جنس کا ہے، مگر اس میں قبض نہیں۔ یہ زور سے جلا دیتا اور دھوتا ہے۔ سب سے اچھا ہلکا سفید ارمنی ہے؛ افریقی کی جلا خالص ہے۔ یہ گاڑھی رطوبتوں کو صاف اور کاٹتا ہے، کھجلی، خارش اور جلدی امراض میں نفع دیتا ہے، فالج میں موافق ہے، بہرے پن میں کان میں ڈالا جاتا ہے، اور کیڑے مارتا ہے۔ کتاب کے مطابق یہ معدے کے لیے نقصان دہ ہے {cite:canon-ibn-sina-print-v1 p.389}، {cite:canon-ibn-sina-print-v1 p.390}۔"
  es: "Más fuerte que la sal y de su tipo, pero sin astringencia. Pule con fuerza y lava. La mejor variedad es la armenia blanca clara; la africana es puramente pulidora. Limpia y disuelve los humores espesos, alivia el picor, la sarna y las afecciones cutáneas, ayuda con la parálisis, se aplica en el oído para la sordera y mata los parásitos intestinales. El libro dice que es perjudicial para el estómago {cite:canon-ibn-sina-print-v1 p.389}, {cite:canon-ibn-sina-print-v1 p.390}."
