id: "concept/al-asbab-al-muharrika-lil-sar"
class: "concept"
kind: "scientific"
label:
  ar: "الأسباب المحرّكة للصرع"
  en: "The causes that provoke epilepsy"
  fr: "Les causes qui provoquent l’épilepsie"
  ur: "صرع کو بھڑکانے والے اسباب"
  es: "Las causas que provocan la epilepsia"
summary:
  ar: "الأسباب المحرّكة للصرع عند ابن سينا: الانتقال إلى هواء معين، كل حرّ مفرط شمسي أو ناري وكل برد، كثرة الأمطار وريحا الشمال والجنوب، الروائح، مطالعة الحركات السريعة الدائرة، طول اللبث في الحمام، سوء الهضم والسهر والآلام النفسانية والانفعالات الحسية القوية {cite:canon-ibn-sina-print-v2 p.125} {cite:canon-ibn-sina-print-v2 p.126}"
  en: "Ibn Sina's provoking causes of epilepsy: moving to a certain air, excessive solar or fire heat and cold, much rain and the north and south winds together, smells, watching swift turning motions, long stays in the bath, indigestion, sleeplessness, strong psychic pains and strong sensory impressions {cite:canon-ibn-sina-print-v2 p.125} {cite:canon-ibn-sina-print-v2 p.126}"
  fr: "Ibn Sina cite parmi les causes susceptibles de déclencher les crises d’épilepsie le passage à un certain type d’air, la chaleur excessive du soleil ou du feu et le froid, les pluies abondantes, les vents du nord et du sud lorsqu’ils soufflent ensemble, les odeurs, la vue de mouvements de rotation rapides, les longs séjours au bain, l’indigestion, l’insomnie, les souffrances psychiques et les impressions sensorielles intenses {cite:canon-ibn-sina-print-v2 p.125} {cite:canon-ibn-sina-print-v2 p.126}"
  ur: "ابن سینا کے نزدیک صرع کو بھڑکانے والے اسباب: کسی خاص ہوا کی طرف منتقلی، مفرط شمسی یا آگ کی گرمی اور سردی، زیادہ بارشیں اور شمالی و جنوبی ہوائیں یکساں، بوئیں، تیز گھومتی حرکتوں کو دیکھنا، حمام میں دیر تک رہنا، سوء ہضم، بیداری، سخت نفسانی تکلیفیں اور سخت حسی جھٹکے {cite:canon-ibn-sina-print-v2 p.125} {cite:canon-ibn-sina-print-v2 p.126}۔"
  es: "Causas que provocan epilepsia según Ibn Sina: moverse a cierta atmósfera, calor excesivo solar o por fuego y frío intenso, mucha lluvia y vientos del norte y del sur combinados, olores, observar movimientos rápidos, largas estancias en el baño, indigestión, insomnio, fuertes dolores psíquicos y fuertes impresiones sensoriales {cite:canon-ibn-sina-print-v2 p.125} {cite:canon-ibn-sina-print-v2 p.126}"
