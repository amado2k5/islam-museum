summary:
  ar: "يقول ابن سينا إن الحركة الخفيفة على الطعام مناسبة، وإن الأعراض النفسانية والحركات البدنية الفادحة تمنع الهضم، وإنه يؤكل في الشتاء من الحبوب الأغذى وفي الصيف بالضد، وإن الأولى أن يمسك المرء وفي النفس بعض بقية شهوة، مع حفظ العادة، وإن شر الأكل ما أثقل المعدة وشر الشراب ما جاوز الاعتدال {cite:canon-ibn-sina-print-v1 p.229}."
  en: "Ibn Sina says light movement after eating is fitting while heavy emotions and heavy bodily exertion prevent digestion; in winter one eats the more nourishing grains, in summer the opposite; and one should stop while some appetite is left, keeping to habit, since the worst eating is what burdens the stomach and the worst drinking what exceeds moderation {cite:canon-ibn-sina-print-v1 p.229}."
