id: concept/stopping-short-of-fullness-and-winter-and-summer-foods
class: concept
kind: scientific
label: { ar: "ترك الامتلاء وأغذية الشتاء والصيف", en: "Stopping short of fullness, and winter and summer foods", ur: "پیٹ بھرنے سے پہلے رک جانا اور سردی گرمی کی غذائیں", es: "Sin llegar a la saciedad, y alimentos de invierno y verano.", fr: "S'arrêter avant d'être rassasié, et les aliments d'hiver et d'été", tr: "Tokluk ve Kış ile Yaz Yiyecekleri", id: "Meninggalkan Rasa Kenyang serta Makanan Musim Dingin dan Musim Panas" }
summary:
  ar: "يقول ابن سينا إن الحركة الخفيفة على الطعام مناسبة، وإن الأعراض النفسانية والحركات البدنية الفادحة تمنع الهضم، وإنه يؤكل في الشتاء من الحبوب الأغذى وفي الصيف بالضد، وإن الأولى أن يمسك المرء وفي النفس بعض بقية شهوة، مع حفظ العادة، وإن شر الأكل ما أثقل المعدة وشر الشراب ما جاوز الاعتدال {cite:canon-ibn-sina-print-v1 p.229}."
  en: "Ibn Sina says light movement after eating is fitting while heavy emotions and heavy bodily exertion prevent digestion; in winter one eats the more nourishing grains, in summer the opposite; and one should stop while some appetite is left, keeping to habit, since the worst eating is what burdens the stomach and the worst drinking what exceeds moderation {cite:canon-ibn-sina-print-v1 p.229}."
  es: "Ibn Sina dice que el movimiento ligero después de comer es apropiado, mientras que las emociones intensas y el esfuerzo físico intenso impiden la digestión; en invierno se comen los cereales más nutritivos, en verano lo contrario; y uno debe parar cuando aún queda algo de apetito, manteniendo el hábito, ya que lo peor que se come es lo que sobrecarga el estómago y lo peor que se bebe es lo que excede la moderación {cite:canon-ibn-sina-print-v1 p.229}."
  fr: "Ibn Sina dit que les mouvements légers après avoir mangé sont appropriés tandis que les émotions fortes et les efforts physiques importants empêchent la digestion; en hiver, on mange les céréales les plus nourrissantes, en été l'inverse; et il faut s'arrêter lorsqu'il reste un peu d'appétit, en restant fidèle à ses habitudes, car le pire aliment est celui qui surcharge l'estomac et le pire breuvage celui qui dépasse la modération {cite:canon-ibn-sina-print-v1 p.229}."
  ur: "ابن سینا کا کہنا ہے کہ کھانے کے بعد ہلکی ہلکی حرکت مناسب ہے جبکہ بھاری جذبات اور بھاری جسمانی مشقت ہاضمے کو روکتی ہے۔ سردیوں میں کوئی زیادہ غذائیت بخش اناج کھاتا ہے، گرمیوں میں اس کے برعکس؛ اور عادت کو برقرار رکھتے ہوئے جب بھوک باقی رہ جائے تو رکنا چاہیے، کیونکہ بدترین کھانا وہ ہے جو معدے پر بوجھ ڈالتا ہے اور بدترین پینا وہ ہے جو اعتدال سے زیادہ ہو۔"
  tr: "İbn Sina, hafif hareketin yemekle uygun olduğunu, psikolojik belirtiler ve şiddetli fiziksel hareketlerin sindirimi engellediğini söyler. Kışın ve yazın besleyici tahıllar yer, tam tersi yer. Bir kişinin ruhunda kalan bazı arzuları bastırırken alışkanlığı koruması tercih edilir. En kötüsü mideyi ağırlaştırır, en kötüsü ise ölçülü olmayı aştığında içmektir {cite:canon-ibn-sina-print-v1 s.229}."
  id: "Ibn Sina mengatakan bahwa gerakan ringan saat makan adalah tepat, dan bahwa gejala psikologis serta gerakan fisik yang berat menghambat pencernaan. Ia makan biji-bijian bergizi di musim dingin dan di musim panas dengan kebalikannya. Lebih baik bagi seseorang untuk menahan sisa keinginan dalam jiwa sambil tetap mempertahankan kebiasaan. Yang terburuk dari makan adalah yang membuat perut menjadi berat, dan yang terburuk adalah minum ketika melebihi batas {cite:canon-ibn-sina-print-v1 hlm.229}."
