id: concept/qada-wa-al-diyana
class: concept
kind: legal
label:
  ar: "القضاء والديانة"
  en: "Judicial ruling and religious truth (qada and diyana)"
  ur: "قضا اور دیانت"
summary:
  ar: "يفرّق الشعراوي بين حكم القضاء، وهو ما يثبت بالبينة في مجلس القاضي، وبين حكم الديانة، وهو ما يكون بين العبد وربه. فقد يحكم القاضي بظاهر البينة ثم يبقى الحكم الديني على حاله: إذا سدّد المدين دينه فلا يحل للورثة أن يطالبوا به مرة أخرى، ويرى أن حِلم الله عن المخالف لا يدل على الإباحة {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2034}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2035}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2036}."
  en: "Al-Sha'rawi separates judicial ruling, which rests on evidence before a judge, from religious truth, which concerns a person before God. A judge may rule on the apparent evidence while the religious position stays the same: if a debtor has paid, heirs may not claim the debt again. He adds that God's forbearance toward a wrongdoer does not mean the act is lawful {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2034}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2035}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2036}."
  ur: "شعراوی قضائی فیصلے (جو گواہی اور ثبوت پر مبنی ہو) اور دیانت کے حکم (جو بندے اور اللہ کے درمیان ہو) میں فرق کرتے ہیں۔ ان کے مطابق اگر مقروض ادا کر چکا ہو تو وارث دوبارہ مطالبہ نہیں کر سکتے، اور اللہ کا حلم کسی کام کے جائز ہونے کی دلیل نہیں {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2034}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2035}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2036}۔"
wings: [ideas]
themes: [family-marriage-kinship]
issue:
  ar: "هل يغيّر حكم القاضي ما هو حلال أو حرام عند الله؟"
  en: "Does a judge's ruling change what is lawful or unlawful before God?"
  ur: "کیا قاضی کا فیصلہ اللہ کے نزدیک حلال یا حرام کو بدل دیتا ہے؟"
perspectives:
  - tradition: sunni
    id: sunni-sharawi-judge-and-conscience
    stance:
      ar: "حكم القاضي يقوم على البينة الظاهرة، ولا يحل الحرام ولا يحرم الحلال عند الله"
      en: "A judge rules on apparent evidence, and a ruling does not make the unlawful lawful before God"
      ur: "قاضی ظاہری ثبوت پر فیصلہ کرتا ہے، اور اس کا فیصلہ اللہ کے نزدیک حرام کو حلال نہیں کرتا"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يستند الشعراوي إلى حديث أم سلمة في القضاء بالبينة، ويقول إن القاضي يحكم بالظاهر وإن الديانة مسألة بين العبد وربه {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2035}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2036}. (الحديث مذكور في حاشية الكتاب بأسماء مخرجيه، ولم يُنقل متنه هنا.)"
      en: "Sha'rawi relies on the report of Umm Salama about judging by evidence, and holds that the judge rules on what is apparent while religion concerns the person before God {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2035}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2036}. (The report is named in the book's footnote; its wording is not reproduced here.)"
      ur: "شعراوی ام سلمہ کی روایت سے استدلال کرتے ہیں کہ قاضی ظاہری ثبوت پر فیصلہ کرتا ہے، جبکہ دیانت بندے اور اللہ کے درمیان معاملہ ہے {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2035}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2036}۔ (روایت کا متن یہاں نقل نہیں کیا گیا۔)"
    sources: [source/tafsir-sharawi-khawatir-scan-vol-2]
