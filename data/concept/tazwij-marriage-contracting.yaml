  en: "Tazwij (contracting a marriage, and who may contract it)"
  ur: "تزویج (نکاح کرانا اور ولایت)"
summary:
  ar: "التزويج عقد يفيد ملك استمتاع الرجل بالمرأة وحل استمتاع المرأة بالرجل على وجه مشروع. وحكمه يختلف باختلاف حال الشخص: فرض أو واجب أو حرام أو مكروه أو مندوب أو مباح. والحر البالغ الرشيد يزوج نفسه، والصغير والمجنون يزوجهما الولي بالإجبار، وفي تزويج المرأة نفسها خلاف: جمهور الفقهاء يشترطون الولي، والحنفية يجيزون للبالغة العاقلة أن تعقد لنفسها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5022} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5023} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5024} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5025}"
  en: "Tazwij is a contract that gives a man enjoyment of a woman and makes lawful her enjoyment by him in a lawful way. Its ruling varies with the person: obligatory, forbidden, disliked, recommended or permitted. A free, adult, sound-minded man may contract his own marriage; a minor or a madman is contracted by his guardian by compulsion. On a woman contracting her own marriage the jurists differ: most require a guardian, while the Hanafis let an adult sane woman contract for herself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5022} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5023} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5024} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5025}"
