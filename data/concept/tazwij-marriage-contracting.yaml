id: concept/tazwij-marriage-contracting
class: concept
kind: legal
label:
  ar: "التزويج"
  en: "Tazwij (contracting a marriage, and who may contract it)"
  ur: "تزویج ⁦(نکاح کرانا اور ولایت)⁩"
  es: "Tazwij (contraer matrimonio y quién puede contraerlo)"
  fr: "Tazwij (contracter un mariage et qui peut le contracter)"
summary:
  ar: "التزويج عقد يفيد ملك استمتاع الرجل بالمرأة وحل استمتاع المرأة بالرجل على وجه مشروع. وحكمه يختلف باختلاف حال الشخص: فرض أو واجب أو حرام أو مكروه أو مندوب أو مباح. والحر البالغ الرشيد يزوج نفسه، والصغير والمجنون يزوجهما الولي بالإجبار، وفي تزويج المرأة نفسها خلاف: جمهور الفقهاء يشترطون الولي، والحنفية يجيزون للبالغة العاقلة أن تعقد لنفسها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5022} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5023} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5024} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5025}"
  en: "Tazwij is a contract that gives a man enjoyment of a woman and makes lawful her enjoyment by him in a lawful way. Its ruling varies with the person: obligatory, forbidden, disliked, recommended or permitted. A free, adult, sound-minded man may contract his own marriage; a minor or a madman is contracted by his guardian by compulsion. On a woman contracting her own marriage the jurists differ: most require a guardian, while the Hanafis let an adult sane woman contract for herself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5022} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5023} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5024} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5025}"
  es: "El tazwij es un contrato que otorga al hombre el disfrute de la mujer y legitima el disfrute de ella por parte del hombre de forma legal. Su dictamen varía según la persona: puede ser obligatorio, prohibido, desaconsejable, recomendado o permitido. Un hombre libre, adulto y en pleno uso de sus facultades mentales puede contraer su propio matrimonio; un menor o un demente es obligado a contraerlo por su tutor. Respecto a que una mujer contraiga su propio matrimonio, los juristas difieren: la mayoría exige un tutor, mientras que los hanafíes permiten que una mujer adulta y cuerda contrate por sí misma. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5022} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5023} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5024} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5025}"
  fr: "Le tazwij est un contrat qui permet à un homme de jouir de la femme et qui légalise cette jouissance par lui, selon la loi. Son statut varie selon la personne: il peut être obligatoire, interdit, déconseillé, recommandé ou permis. Un homme libre, majeur et sain d’esprit peut contracter son propre mariage; un mineur ou une personne atteinte de troubles mentaux est contraint de contracter un tel mariage par son tuteur. Concernant le mariage d’une femme, les juristes divergent: la plupart exigent un tuteur, tandis que les hanafites autorisent une femme majeure et saine d’esprit à contracter pour elle-même."
  ur: "تجویج ایک ایسا معاہدہ ہے جو مرد کو عورت سے لطف اندوز کرتا ہے اور اس کے مزے کو حلال طریقے سے حلال کرتا ہے۔ اس کا حکم فرد کے لحاظ سے مختلف ہوتا ہے: واجب، حرام، ناپسندیدہ، سفارش یا اجازت۔ ایک آزاد، بالغ، اچھی سوچ والا آدمی اپنی شادی خود کر سکتا ہے۔ نابالغ یا دیوانے کو اس کے سرپرست نے مجبوری میں معاہدہ کیا ہے۔ عورت اپنی مرضی سے عقد کرنے کے بارے میں فقہاء کا اختلاف ہے: اکثر کو سرپرست کی ضرورت ہوتی ہے، جب کہ احناف ایک بالغ سمجھدار عورت کو اپنے لیے عقد کرنے دیتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5022} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5023} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5024} صفحہ 5025}"
