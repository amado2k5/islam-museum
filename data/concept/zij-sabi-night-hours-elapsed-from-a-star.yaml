id: concept/zij-sabi-night-hours-elapsed-from-a-star
class: concept
kind: scientific
label: { ar: "ما مضى من الليل من ساعة قياس الكوكب", en: "The hours of the night elapsed, from the measurement of a star", ur: "ستارے کی پیمائش سے رات کی گزری ہوئی ساعات", es: "Las horas de la noche transcurrieron, según la medición de una estrella.", fr: "Les heures de la nuit s'écoulèrent, depuis la mesure d'une étoile", tr: "Gezegenin ölçüm saatine göre gecenin nasıl geçtiği henüz bilinmiyor.", id: "Apa yang telah berlalu sepanjang malam menurut jam pengukur planet ini?" }
summary:
  ar: "يميّز النص بين كوكب طلع نهاراً وكوكب طلع ليلاً، فإن كان الجزء الطالع معه بين درجة الشمس ونظيرتها فقد طلع نهاراً، وإن كان بين النظير والشمس فقد طلع ليلاً. وفي الحالين يُحسب ما دار من الفلك منذ غروب الشمس إلى ساعة القياس، ثم يُقسم على أزمان ساعات الليل فيخرج ما مضى من الليل بساعات زمانية، وإن قُسم على خمس عشرة خرج بساعات معتدلة. {cite:zij-sabi-nallino-byblion p.55}."
  en: "The text separates a star that rose by day from one that rose by night: if the part rising with it lies between the Sun's degree and its opposite it rose by day, and if between the opposite and the Sun it rose by night. In both cases the part of the sphere that has turned since sunset up to the time of measurement is found and divided by the times of the night hours, which gives what has passed of the night in seasonal hours, and divided by fifteen it gives equal hours. {cite:zij-sabi-nallino-byblion p.55}."
  ur: "متن اس ستارے کو جو دن میں طلوع ہوا اس سے الگ کرتا ہے جو رات میں طلوع ہوا: اگر اس کے ساتھ طالع جزء سورج کے درجے اور اس کے نظیر کے درمیان ہو تو وہ دن میں طلوع ہوا، اور اگر نظیر اور سورج کے درمیان ہو تو رات میں۔ دونوں صورتوں میں سورج کے غروب سے پیمائش کی ساعت تک فلک کا گھوما ہوا حصہ نکالا جاتا ہے اور رات کی ساعتوں کے ازمان پر تقسیم کیا جاتا ہے تو رات کا گزرا ہوا حصہ زمانی ساعتوں میں نکلتا ہے، اور پندرہ پر تقسیم کریں تو معتدل ساعتوں میں۔ {cite:zij-sabi-nallino-byblion p.55}۔"
  es: "El texto distingue entre una estrella que salió de día y una que salió de noche: si la parte que sale con ella se encuentra entre el grado del Sol y su opuesto, salió de día; y si se encuentra entre el opuesto y el Sol, salió de noche. En ambos casos, se calcula la parte de la esfera que ha girado desde la puesta del sol hasta el momento de la medición y se divide por las horas de la noche, lo que da como resultado el tiempo transcurrido de la noche en horas estacionales; y dividido por quince, da como resultado horas iguales. {cite:zij-sabi-nallino-byblion p.55}."
  fr: "Le texte distingue une étoile qui s'est levée de jour de celle qui s'est levée de nuit: si la portion de la sphère qui se lève avec elle se situe entre le degré du Soleil et son opposé, elle s'est levée de jour; si elle se situe entre l'opposé et le Soleil, elle s'est levée de nuit. Dans les deux cas, on calcule la portion de la sphère qui a tourné depuis le coucher du soleil jusqu'au moment de la mesure, puis on la divise par la durée de la nuit, ce qui donne le nombre d'heures écoulées en heures saisonnières. Divisé par quinze, cela donne le nombre d'heures. {cite:zij-sabi-nallino-byblion p.55}."
  tr: "Metin, gündüz yükselen bir gezegen ile gece yükselen bir gezegen arasında ayrım yapmaktadır. Yükselen kısım güneş ile karşı tarafı arasındaysa, gündüz yükselmiştir; karşı tarafı ile güneş arasındaysa, gece yükselmiştir. Her iki durumda da, gök cisminin gün batımından ölçüm anına kadar olan yörünge periyodu hesaplanır, ardından gece saatlerine bölünerek geçen süre saat olarak elde edilir. Bu değer on beşe bölünürse, eşdeğer saat sayısı elde edilir. {cite:zij-sabi-nallino-byblion s.55}."
  id: "Teks tersebut membedakan antara planet yang terbit di siang hari dan planet yang terbit di malam hari. Jika bagian yang terbit berada di antara matahari dan pasangannya, maka planet tersebut terbit di siang hari; jika berada di antara pasangannya dan matahari, maka planet tersebut terbit di malam hari. Dalam kedua kasus tersebut, periode orbit benda langit dari matahari terbenam hingga waktu pengukuran dihitung, kemudian dibagi dengan jumlah jam malam untuk mendapatkan waktu yang telah berlalu dalam jam. Jika ini dibagi dengan lima belas, maka akan menghasilkan jumlah jam yang setara. {cite:zij-sabi-nallino-byblion p.55}."
