label:
  ar: "أحمد"
  en: "Ahmad (a name of the Prophet, and a personal name)"
summary:
  ar: "أحمد اسم من أسماء النبي وعلم يتسمى به المسلمون، وهو صيغة تفضيل من «حمد»، ويرتبط في القرآن بقول عيسى ببشارة رسول اسمه أحمد، وكان مسلمون يطبقون على النبي بشارة الفارقليط في القرن الأول الهجري، ولم يصبح علمًا عند المسلمين إلا نحو سنة 125هـ {cite:encyclopaedia-of-islam-2 vol. 1 p. 289}."
  en: "Ahmad is one of the names of the Prophet and a personal name used by Muslims. It is an elative of hamd, 'praise', and it is linked in the Qur'an with the announcement by Jesus of a messenger named Ahmad. The name is used as a personal name by Muslims only from about 125/740 {cite:encyclopaedia-of-islam-2 vol. 1 p. 289}."
