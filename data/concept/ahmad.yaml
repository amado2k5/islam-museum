label:
  ar: "أحمد"
  en: "Ahmad (a name of the Prophet, and a personal name)"
  fr: "Ahmad (un nom du Prophète et un prénom)"
  es: "Ahmad (nombre del Profeta y nombre propio)"
  ur: "احمد ⁦(نبی کا ایک نام، اور ایک ذاتی نام)⁩"
  tr: "Ahmed"
  id: "Ahmed"
summary:
  ar: "أحمد اسم من أسماء النبي وعلم يتسمى به المسلمون، وهو صيغة تفضيل من «حمد»، ويرتبط في القرآن بقول عيسى ببشارة رسول اسمه أحمد، وكان مسلمون يطبقون على النبي بشارة الفارقليط في القرن الأول الهجري، ولم يصبح علمًا عند المسلمين إلا نحو سنة 125هـ {cite:encyclopaedia-of-islam-2 vol. 1 p. 289}."
  en: "Ahmad is one of the names of the Prophet and a personal name used by Muslims. It is an elative of hamd, 'praise', and it is linked in the Qur'an with the announcement by Jesus of a messenger named Ahmad. The name is used as a personal name by Muslims only from about 125/740 {cite:encyclopaedia-of-islam-2 vol. 1 p. 289}."
  fr: "Ahmad est l’un des noms du Prophète et un prénom porté par des musulmans. C’est un élatif de hamd, « louange ». Le Coran l’associe à l’annonce, par Jésus, d’un messager nommé Ahmad. Ce prénom n’est attesté parmi les musulmans qu’à partir de 125 H / 740 environ {cite:encyclopaedia-of-islam-2 vol. 1 p. 289}."
  es: "Ahmad es uno de los nombres del Profeta y un nombre propio utilizado por los musulmanes. Es un derivado de hamd, que significa «alabanza», y en el Corán se relaciona con el anuncio de Jesús sobre un mensajero llamado Ahmad. Los musulmanes lo utilizan como nombre propio desde aproximadamente el año 125/740 a. C. (cita: encyclopaedia-of-islam-2 vol. 1 p. 289)."
  ur: "احمد پیغمبر کے ناموں میں سے ایک اور ایک ذاتی نام ہے جسے مسلمان استعمال کرتے ہیں۔ یہ حمد، 'تعریف' کا ایک لفظ ہے، اور اسے قرآن میں احمد نامی ایک رسول کے عیسیٰ کے اعلان کے ساتھ جوڑا گیا ہے۔ اس نام کو صرف مسلمانوں نے ذاتی نام کے طور پر استعمال کیا ہے تقریباً 125/740 {حوالہ: انسائیکلوپیڈیا-آف-اسلام-2 جلد۔ 1 ص۔ 289}۔"
  tr: "Ahmed, Peygamber'in adı ve Müslümanlar tarafından kullanılan özel bir isimdir. 'Hamd'ın tercih biçimidir ve Kur'an'da İsa'nın Ahmed adlı bir elçiye müjdesini vermesiyle bağlantılıdır. Müslümanlar, birinci yüzyılda Peygamber'e Faraqilit'in müjdesini verirlerdi, ancak bu bilgi Müslümanlar arasında yaklaşık 125 Hicri yılına kadar bilinmemiştir {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 289}."
  id: "Ahmed adalah nama Nabi dan nama yang digunakan oleh umat Muslim. Nama ini adalah bentuk 'Hamd' yang paling disukai dan dikaitkan dalam Al-Qur'an dengan Yesus yang menyampaikan kabar gembira kepada seorang rasul bernama Ahmed. Orang Muslim biasa memberikan kabar gembira Faraqilit kepada Nabi pada abad pertama, tetapi pengetahuan ini tidak diketahui di kalangan Muslim hingga sekitar tahun 125 H {cite:Encyclopaedia-of-Islam-2, vol. 1, hlm. 289}."
