id: concept/muallim
class: concept
kind: legal
label:
  ar: المُعَلِّم
  en: Teacher (mu'allim)
  ur: معلم (استاد)
summary:
  ar: "المعلم في اللغة اسم فاعل من علّم، وهو من يتخذ التعليم مهنة، وقد يُطلق على من يعلّم صنعة برع فيها، وكان هذا اللقب من أرفع الدرجات في نظام الصناع. وتتناول المادة فضل المعلم وأجره وحكم أخذ الأجرة على التعليم، وما يُعطى للمعلم زيادة على الأجرة، ووجوب تحري الحلال في الأجر، وصفات المعلم وآدابه مع المتعلم وفي معاملة الصبيان، وما يتعين عليه من الدروس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14789} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14790} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14791} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14792} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14793} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14794} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14795} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14796} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14797} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14798}"
  en: "In the Kuwaiti encyclopedia's account a mu'allim is one who takes teaching as a profession, and the word also covers a person who teaches a craft in which he excels. The entry sets out the merit of teaching, whether a teacher may take a fee, the schools' rulings on fees for teaching crafts and religious learning, the duty to earn only lawful pay, the teacher's character and conduct towards pupils, and the lessons he must give. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14789} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14790} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14791} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14792} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14793} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14794} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14795} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14796} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14797} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14798}"
  ur: "معلم لغت میں اسم فاعل ہے، یعنی جو تعلیم کو پیشہ بنائے، اور اس کا اطلاق اس شخص پر بھی ہوتا ہے جو کوئی ہنر سکھائے جس میں وہ ماہر ہو۔ اس مدخل میں معلم کی فضیلت، اجرت لینے کا حکم، حلال کمائی کا وجوب، معلم کے اخلاق اور بچوں کے ساتھ سلوک، اور اس پر لازم دروس کا بیان ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14789} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14790} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14796}"
