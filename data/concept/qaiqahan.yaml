  en: "Qaiqahan (a gum)"
  ur: "قیقہن"
summary:
  ar: "القيقهن في الكتاب صمغ كريه الطعم يجلب من بلاد العرب، وفيه تغرية يسيرة، وينقي آثار القروح، ولا يعدله شيء في وجع الأسنان وتساقط اللثة، ويجلو البصر وينفع من الربو {cite:canon-ibn-sina-print-v1 p.653}"
  en: "Qaiqahan is in the book a gum of unpleasant taste brought from the land of the Arabs, with a slight gluing power; it cleanses the marks of ulcers, nothing equals it for toothache and receding gums, and it clears the sight and benefits asthma {cite:canon-ibn-sina-print-v1 p.653}"
  ur: "قیقہن کتاب میں ایک ناگوار ذائقے کا گوند ہے جو عرب کے علاقوں سے لایا جاتا ہے، اس میں ہلکی چپکانے والی قوت ہے؛ قرحوں کے نشان صاف کرتا ہے، دانت کے درد اور مسوڑھوں کے گرنے میں کوئی چیز اس کے برابر نہیں، اور بینائی کو جلا دیتا اور دمے میں نافع ہے {cite:canon-ibn-sina-print-v1 p.653}۔"
