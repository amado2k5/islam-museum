label: { ar: "القروح: التجفيف وإلحام الشفتين عند ابن سينا", en: "Ulcers: the aim of drying and joining the lips in the Canon", ur: "قانون میں زخم: خشک کرنا اور کناروں کو ملانا", es: "Úlceras: el objetivo de secar y unir los labios en el Canon", fr: "Ulcères: l'objectif est de sécher et de joindre les lèvres dans le Canon", tr: "Yaralar: İbn Sina'ya göre Dudakların Kurutulması ve Kaynak Yapılması", id: "Luka: Mengeringkan dan Mengelas Bibir Menurut Ibn Sina" }
summary:
  ar: "يبين ابن سينا أن الغرض في مداواة القروح هو التجفيف، ويفرق بين النقي والعفن، والمفردة والمركبة، والصغيرة والكبيرة، وما يذهب منها من الجلد أو اللحم {cite:canon-ibn-sina-print-v1 p.307}."
  en: "Ibn Sina says the aim in treating ulcers is drying, and distinguishes the clean from the foul, the simple from the compound, the small from the large, and what has lost skin from what has lost flesh {cite:canon-ibn-sina-print-v1 p.307}."
  es: "Ibn Sina dice que el objetivo en el tratamiento de las úlceras es el secado, y distingue lo limpio de lo sucio, lo simple de lo compuesto, lo pequeño de lo grande, y lo que ha perdido piel de lo que ha perdido carne {cite:canon-ibn-sina-print-v1 p.307}."
  fr: "Ibn Sina dit que le but du traitement des ulcères est l'assèchement, et distingue le propre du sale, le simple du composé, le petit du grand, et ce qui a perdu la peau de ce qui a perdu la chair {cite:canon-ibn-sina-print-v1 p.307}."
  ur: "ابن سینا کا کہنا ہے کہ السر کے علاج کا مقصد خشک ہونا ہے، اور صاف کو ناپاک سے، سادہ کو مرکب سے، چھوٹے کو بڑے سے، اور جلد کو کھو جانے والے کو گوشت سے الگ کرتا ہے۔"
  tr: "İbn Sina, ülserlerin tedavisinin amacının kurutmak olduğunu, saf ve küflü, tekli ve bileşik, küçük ve büyük olanı ve deri veya etten geleni ayırt etmek olduğunu açıklar {cite:canon-ibn-sina-print-v1 s.307}."
  id: "Ibn Sina menjelaskan bahwa tujuan pengobatan tukak lambung adalah mengeringkan, membedakan antara murni dan berjamur, tunggal dan majemuk, kecil dan besar, serta apa yang berasal dari kulit atau daging {cite:canon-ibn-sina-print-v1 hlm.307}."
