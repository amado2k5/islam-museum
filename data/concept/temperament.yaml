label: { ar: "المزاج", en: "Temperament (al-mizaj)" }
summary:
  ar: "المزاج عند ابن سينا كيفية حاصلة من تفاعل الكيفيات المتضادة إذا وُقف على حدّها {cite:canon-ibn-sina-print-v1 p.19}. والكيفيات الأولية في الأركان أربع: الحرارة والبرودة والرطوبة واليبوسة {cite:canon-ibn-sina-print-v1 p.19}. ويُعرض المزاج في التعليم الثالث من الفن الأول، وهو ثلاثة فصول {cite:canon-ibn-sina-print-v1 p.19}."
  en: "For Ibn Sina a temperament (mizaj) is a state that results from the interaction of opposite qualities, once its definition is grasped {cite:canon-ibn-sina-print-v1 p.19}. The primary qualities in the elements are four: heat, cold, moisture and dryness {cite:canon-ibn-sina-print-v1 p.19}. It is treated in the third section of Book I, Fann 1, in three chapters {cite:canon-ibn-sina-print-v1 p.19}."
