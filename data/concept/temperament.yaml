summary:
  ar: "المزاج عند ابن سينا كيفية حاصلة من تفاعل الكيفيات المتضادة {cite:canon-ibn-sina-print p.5}. ويُسأل عنه في مقدمات الطب: هل هو، وما هو، وكم هو {cite:canon-ibn-sina-print p.4}. يُعرض في التعليم الثالث من الفن الأول، وهو ثلاثة فصول {cite:canon-ibn-sina-print p.5}."
  en: "For Ibn Sina a temperament (mizaj) is a state that results from the interaction of opposite qualities {cite:canon-ibn-sina-print p.5}. In the principles of medicine the physician asks whether it exists, what it is and how many there are {cite:canon-ibn-sina-print p.4}. It is treated in the third section of Book I, Fann 1, in three chapters {cite:canon-ibn-sina-print p.5}."
