id: concept/temperament
class: concept
kind: scientific
label: { ar: "المزاج", en: "Temperament (al-mizaj)", es: "Temperamento (al-mizaj)", fr: "Tempérament (al-mizaj)", ur: "مزاج ⁦(المزاج)⁩", tr: "Ruh hali", id: "Suasana hati" }
summary:
  ar: "المزاج عند ابن سينا كيفية حاصلة من تفاعل الكيفيات المتضادة إذا وُقف على حدّها {cite:canon-ibn-sina-print-v1 p.19}. والكيفيات الأولية في الأركان أربع: الحرارة والبرودة والرطوبة واليبوسة {cite:canon-ibn-sina-print-v1 p.19}. ويُعرض المزاج في التعليم الثالث من الفن الأول، وهو ثلاثة فصول {cite:canon-ibn-sina-print-v1 p.19}."
  en: "For Ibn Sina a temperament (mizaj) is a state that results from the interaction of opposite qualities, once its definition is grasped {cite:canon-ibn-sina-print-v1 p.19}. The primary qualities in the elements are four: heat, cold, moisture and dryness {cite:canon-ibn-sina-print-v1 p.19}. It is treated in the third section of Book I, Fann 1, in three chapters {cite:canon-ibn-sina-print-v1 p.19}."
  es: "Para Ibn Sina, un temperamento (mizaj) es un estado que resulta de la interacción de cualidades opuestas, una vez que se comprende su definición {cite:canon-ibn-sina-print-v1 p.19}. Las cualidades primarias en los elementos son cuatro: calor, frío, humedad y sequedad {cite:canon-ibn-sina-print-v1 p.19}. Se trata en la tercera sección del Libro I, Fann 1, en tres capítulos {cite:canon-ibn-sina-print-v1 p.19}."
  fr: "Pour Ibn Sina, un tempérament (mizaj) est un état résultant de l'interaction de qualités opposées, une fois sa définition comprise {cite:canon-ibn-sina-print-v1 p.19}. Les qualités primaires des éléments sont au nombre de quatre: la chaleur, le froid, l'humidité et la sécheresse {cite:canon-ibn-sina-print-v1 p.19}. Ce sujet est traité dans la troisième section du Livre I, Fann 1, en trois chapitres {cite:canon-ibn-sina-print-v1 p.19}."
  ur: "ابن سینا کے لیے ایک مزاج ⁦(میزج)⁩ ایک ایسی کیفیت ہے جو مخالف صفات کے تعامل سے پیدا ہوتی ہے، جب اس کی تعریف کو سمجھ لیا جائے تو {حوالہ: کینون ابن سینا پرنٹ v1 صفحہ 19}۔ عناصر میں بنیادی خصوصیات چار ہیں: گرمی، سردی، نمی اور خشکی اس کا علاج کتاب اول، فان 1 کے تیسرے حصے میں تین ابواب میں کیا گیا ہے {حوالہ: کینن ابن سینا پرنٹ v1 صفحہ 19}۔"
  tr: "İbn Sina'nın görüşüne göre mizaç, zıt niteliklerin etkileşiminden elde edilen bir moddur; eğer sınırında durursa {cite:canon-ibn-sina-print-v1 s.19}. Sütunlardaki temel nitelikler dörddür: sıcaklık, soğuk, nem ve kuruluk; {cite:canon-ibn-sina-print-v1 s.19}. Ruh hali, birinci sanatın üçüncü öğretisinde sunulur; bu öğreti üç bölümden oluşur: {cite:canon-ibn-sina-print-v1 s.19}."
  id: "Temperamen menurut pandangan Avicenna adalah mode yang diperoleh dari interaksi kualitas yang berlawanan jika berada pada batasnya {cite:canon-ibn-sina-print-v1 hlm.19}. Kualitas utama dalam pilar-pilar adalah empat: panas, dingin, kelembapan, dan kekeringan {cite:canon-ibn-sina-print-v1 hlm.19}. Suasana disajikan dalam ajaran ketiga seni pertama, yang terdiri dari tiga bab {cite:canon-ibn-sina-print-v1 hlm.19}."
