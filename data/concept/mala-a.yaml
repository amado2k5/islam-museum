label: { ar: "المَلاءة", en: "Solvency (mala'a) in the law of debt", ur: "مَلاءَۃ (مالی استطاعت)" }
summary:
  ar: "الملاءة في اللغة الغنى والقدرة، ويقال للمليء الغني الثقة. وفي اصطلاح الفقهاء هي الغنى واليسار، وقد فسرها أحمد بأنها تعتبر في المال والقول والبدن. وتترتب عليها أحكام في زكاة الدين، وأخذ الشفيع للمشفوع، والضمان، وأداء الدين، وحبس المدين، وإثبات اليسار والإعسار، والمنع من السفر، والنفقة على الزوجة والأقارب."
  en: "In the lexicon mala'a is wealth and capacity, and a solvent man is a rich, trustworthy one. For the jurists it is wealth and means; Ahmad defined it as capacity in property, speech and body. It bears on the zakat on debts, the shuf'a, suretyship, payment of debts, imprisonment of debtors, proof of solvency or insolvency, travel of debtors, and maintenance of wives and relatives."
  ur: "ملاءَۃ کا مطلب مالی استطاعت اور غنا ہے۔ فقہاء کے نزدیک اس پر زکات، شفعہ، ضمان، ادائے دین، قید اور نفقہ کے احکام مبنی ہیں۔"
