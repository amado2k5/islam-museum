label: { ar: "الحَمِيّة", en: "Hamiyya (diet and abstention in illness)", ur: "حَمِيّہ ⁦(علاج میں پرہیز)⁩", es: "Hamiyya (dieta y abstinencia en caso de enfermedad)", fr: "Hamiyya (régime alimentaire et abstinence en cas de maladie)", tr: "Beslenme", id: "Diet" }
summary:
  ar: "الحمية في اللغة المنع، وحمى المريض ما يضره، وهي نوع من التداوي وهو مشروع، لحديث أسامة بن شريك في أن الله لم يضع داء إلا وضع له دواء إلا الهرم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7331} وقال ابن القيم إن الأصل في الحمية ما في آية التيمم من منع المريض من استعمال الماء، وفي حديث أم المنذر أن النبي نهى عليا عن الطعام وأمر بالشعير والسلق، وعن عمر أنه كان يحمي المريض حتى يمتص النوى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7331} ويراعى في الحمية أصول الطب والتجربة الصحيحة، ويرجع فيها إلى مصطلح «تداوي». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7332} "
  en: "Hamiyya lexically means prohibition, to keep the sick from what harms him, and it is a lawful form of treatment on the hadith that God sent a cure for every disease except old age. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7331} Ibn al-Qayyim takes as its root the Quranic permission to tayammum for the sick, who is kept from water; the narration of Umm al-Mundhir relates the Prophet's order to Ali to avoid food and to take barley and soup; and Umar kept a sick man from food until he sucked a date-stone. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7331} Diet must follow the principles of medicine and sound experience. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7332} "
  ur: "حمیہ لغت میں منع کرنے کو کہتے ہیں، یعنی مریض کو وہ چیز روکنا جو اسے نقصان دے؛ یہ علاج کی ایک جائز صورت ہے، اس حدیث کی بنا پر کہ اللہ نے کوئی بیماری نہیں اتاری جس کا علاج نہ ہو سوائے بڑھاپے کے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7331} ابن القیم کے نزدیک اس کی اصل وہ آیت ہے جس میں مریض کو پانی کے استعمال سے روک کر تیمم کی اجازت دی گئی، اور ام المنذر کی روایت میں نبی نے علی کو کھانے سے روک کر جو اور سلق کھلانے کا حکم دیا؛ عمر کے بارے میں منقول ہے کہ وہ مریض کو گٹھلی چوسنے تک روکتے تھے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7331} حمیہ میں طب کے اصولوں اور صحیح تجربے کا لحاظ رکھا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7332} "
  es: "Hamiyya significa léxicamente prohibición, mantener al enfermo alejado de lo que le perjudica, y es una forma lícita de tratamiento según el hadiz que afirma que Dios envió una cura para cada enfermedad excepto la vejez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7331} Ibn al-Qayyim toma como raíz el permiso coránico para realizar el tayammum al enfermo, al que se le impide beber agua; la narración de Umm al-Mundhir relata la orden del Profeta a Ali de evitar la comida y tomar cebada y sopa; y Umar mantuvo a un enfermo sin comer hasta que chupó un hueso de dátil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7331} La dieta debe seguir los principios de la medicina y la experiencia sólida. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7332}"
  fr: "Le terme « hamiyya » signifie littéralement interdiction, c'est-à-dire préserver le malade de ce qui lui nuit. Il s'agit d'un traitement licite, fondé sur le hadith selon lequel Dieu a envoyé un remède pour toute maladie, à l'exception de la vieillesse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7331} Ibn al-Qayyim s'appuie sur la permission coranique de pratiquer le tayammum (abstinence) pour le malade, qui est alors privé d'eau. Le récit d'Umm al-Mundhir rapporte l'ordre du Prophète à Ali de s'abstenir de nourriture et de consommer de l'orge et du bouillon. Umar, quant à lui, a privé un malade de nourriture jusqu'à ce qu'il suce un noyau de datte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7331} L'alimentation doit respecter les principes de la médecine et l'expérience clinique. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7332}"
  tr: "Dilbilimde diyet önleme anlamına gelir ve hastaya zarar veren şey ateştir. Bu, Usama bin Şerik'in hadisine dayanarak, Allah'ın hastalık getirmediği, sadece yaşlılık dışında bir tedavi koyduğunu belirten bir tedavi türüdür. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7331} İbn al-Qayyim, diyetin asıl ilkesinin, tayammum ayetinde hastanın su kullanmasını engellemesi olduğunu söylemiştir. Ümmü Mundir'in hadisinde, Peygamber Ali'ye yemek yemesini yasaklamış, arpa ve kaynatmayı emretmiş, Ömer ise tohumlar emilene kadar hastayı korumak için kullandığını söylemiştir. {cit:fiqh-mawsua-kuwaitiyya-noor-v3 s.7331} Diyet, tıbbın ilkelerine ve doğru deneyime uyar, 'tasavvi' (tedavi) terimine atıfta bulunur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7332}"
  id: "Dalam linguistik, diet berarti pencegahan, dan demam bagi pasien adalah yang merugikan mereka. Ini adalah jenis pengobatan yang diresepkan, berdasarkan hadits Usama ibn Sharik bahwa Allah tidak memperkenalkan penyakit kecuali Dia memberikan obat untuk penyakit itu kecuali usia tua. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7331} Ibn al-Qayyim mengatakan bahwa prinsip asli diet adalah apa yang tercantum dalam ayat tentang tayammum yang mencegah pasien menggunakan air. Dalam hadits um al-Mundhir, Nabi melarang Ali makan dan memerintahkan jelai serta merebus, dan dari Umar bahwa ia melindungi pasien sampai bijinya diserap. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7331} Diet mematuhi prinsip pengobatan dan pengalaman yang benar, merujuk pada istilah 'tadawawi' (pengobatan). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7332}"
