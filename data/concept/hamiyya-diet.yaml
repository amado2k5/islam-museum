label: { ar: "الحَمِيّة", en: "Hamiyya (diet and abstention in illness)", ur: "حَمِيّہ (علاج میں پرہیز)" }
summary:
  ar: "الحمية في اللغة المنع، وحمى المريض ما يضره، وهي نوع من التداوي وهو مشروع، لحديث أسامة بن شريك في أن الله لم يضع داء إلا وضع له دواء إلا الهرم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7331} وقال ابن القيم إن الأصل في الحمية ما في آية التيمم من منع المريض من استعمال الماء، وفي حديث أم المنذر أن النبي نهى عليا عن الطعام وأمر بالشعير والسلق، وعن عمر أنه كان يحمي المريض حتى يمتص النوى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7331} ويراعى في الحمية أصول الطب والتجربة الصحيحة، ويرجع فيها إلى مصطلح «تداوي». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7332} "
  en: "Hamiyya lexically means prohibition, to keep the sick from what harms him, and it is a lawful form of treatment on the hadith that God sent a cure for every disease except old age. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7331} Ibn al-Qayyim takes as its root the Quranic permission to tayammum for the sick, who is kept from water; the narration of Umm al-Mundhir relates the Prophet's order to Ali to avoid food and to take barley and soup; and Umar kept a sick man from food until he sucked a date-stone. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7331} Diet must follow the principles of medicine and sound experience. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7332} "
  ur: "حمیہ لغت میں منع کرنے کو کہتے ہیں، یعنی مریض کو وہ چیز روکنا جو اسے نقصان دے؛ یہ علاج کی ایک جائز صورت ہے، اس حدیث کی بنا پر کہ اللہ نے کوئی بیماری نہیں اتاری جس کا علاج نہ ہو سوائے بڑھاپے کے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7331} ابن القیم کے نزدیک اس کی اصل وہ آیت ہے جس میں مریض کو پانی کے استعمال سے روک کر تیمم کی اجازت دی گئی، اور ام المنذر کی روایت میں نبی نے علی کو کھانے سے روک کر جو اور سلق کھلانے کا حکم دیا؛ عمر کے بارے میں منقول ہے کہ وہ مریض کو گٹھلی چوسنے تک روکتے تھے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7331} حمیہ میں طب کے اصولوں اور صحیح تجربے کا لحاظ رکھا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7332} "
