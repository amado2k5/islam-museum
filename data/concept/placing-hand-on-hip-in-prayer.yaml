label:
  ar: "التخصر"
  en: "Placing the hand on the hip (takhassur)"
  ur: "تخصّر (کمر پر ہاتھ رکھنا)"
summary:
  ar: "التخصر وضع اليد على الخاصرة، وهو في الصلاة مكروه عند جمهور الفقهاء كراهة تنزيه، ومكروه تحريما عند الحنفية لمنافاته هيئة الصلاة المأثورة. ويجوز عند الحاجة بقدرها، ويُكره في غير الصلاة لأنه فعل المتكبرين. وفي خطبة الجمعة يُستحب للخطيب الاتكاء على عصا أو قوس عند المالكية والشافعية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4812} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4813} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4814}"
  en: "Takhassur is placing the hand on the side of the hip. In prayer most jurists regard it as disliked (makruh tanzihi), while the Hanafis hold it disliked as unlawful (makruh tahrimi), since it departs from the transmitted form of prayer. It is allowed in a real need, to the extent of the need. Outside prayer it is disliked as the manner of the proud. For the Friday sermon, leaning on a staff or bow is recommended by the Malikis, Shafi'is and Hanbalis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4812} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4813} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4814}"
