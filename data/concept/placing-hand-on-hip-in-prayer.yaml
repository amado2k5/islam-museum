id: concept/placing-hand-on-hip-in-prayer
class: concept
kind: legal
label:
  ar: "التخصر"
  en: "Placing the hand on the hip (takhassur)"
  ur: "تخصّر ⁦(کمر پر ہاتھ رکھنا)⁩"
  es: "Colocar la mano en la cadera (takhassur)"
  fr: "Placer la main sur la hanche (takhassur)"
summary:
  ar: "التخصر وضع اليد على الخاصرة، وهو في الصلاة مكروه عند جمهور الفقهاء كراهة تنزيه، ومكروه تحريما عند الحنفية لمنافاته هيئة الصلاة المأثورة. ويجوز عند الحاجة بقدرها، ويُكره في غير الصلاة لأنه فعل المتكبرين. وفي خطبة الجمعة يُستحب للخطيب الاتكاء على عصا أو قوس عند المالكية والشافعية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4812} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4813} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4814}"
  en: "Takhassur is placing the hand on the side of the hip. In prayer most jurists regard it as disliked (makruh tanzihi), while the Hanafis hold it disliked as unlawful (makruh tahrimi), since it departs from the transmitted form of prayer. It is allowed in a real need, to the extent of the need. Outside prayer it is disliked as the manner of the proud. For the Friday sermon, leaning on a staff or bow is recommended by the Malikis, Shafi'is and Hanbalis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4812} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4813} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4814}"
  es: "Takhassur consiste en colocar la mano en el costado de la cadera. En la oración, la mayoría de los juristas lo consideran desaconsejable (makruh tanzihi), mientras que los hanafíes lo consideran ilícito (makruh tahrimi), ya que se aparta de la forma transmitida de la oración. Se permite en caso de necesidad real, hasta el límite de dicha necesidad. Fuera de la oración, se considera desaconsejable por ser propio de personas orgullosas. Para el sermón del viernes, los malikíes, shafiíes y hanbalíes recomiendan apoyarse en un bastón o arco. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4812} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4813} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4814}"
  fr: "Le takhassur consiste à poser la main sur la hanche. Pendant la prière, la plupart des juristes le considèrent comme déconseillé (makruh tanzihi), tandis que les hanafites le déconseillent et le jugent illicite (makruh tahrimi), car il s'écarte de la forme transmise de la prière. Il est permis en cas de réelle nécessité, dans la limite de cette nécessité. En dehors de la prière, il est déconseillé car perçu comme une attitude orgueilleuse. Pour le sermon du vendredi, les malikites, les chaféites et les hanbalites recommandent de s'appuyer sur un bâton ou un arc."
