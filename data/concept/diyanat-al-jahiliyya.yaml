label: { ar: "ديانات العرب في الجاهلية", en: "Religions of Jahiliyya Arabia", es: "Religiones de la Arabia preislámica", fr: "Religions de l'Arabie préislamique", ur: "جاہلیت عرب کے مذاہب" }
summary:
  ar: "صنف المسعودي العرب في جاهليتهم فرقاً: فمنهم الموحد المقر بخالقه المصدق بالبعث والنشور وقد دعا في الفترة قس بن ساعدة الإيادي ورئاب الشني وبحيرا الراهب وكان من عبد القيس، ومنهم من أقر بالخالق وأثبت حدوث العالم وأقر بالبعث وأنكر الرسل وعكف على الأصنام يقولون ما نعبدهم إلا ليقربونا إلى الله زلفى فحجوا إليها ونحروا لها البدن وأحلوا لها وحرموا، ومنهم من أقر بالخالق وكذب بالرسل والبعث ومال إلى قول أهل الدهر القائلين ما هي إلا حياتنا الدنيا نموت ونحيا وما يهلكنا إلا الدهر {cite:muruj-al-dhahab p. 442}. وكانت لهم مذاهب في النفوس فمنهم من جعل النفس هي الدم والروح الهواء في باطن الجسم {cite:muruj-al-dhahab p. 467-468}"
  en: "Al-Mas'udi's taxonomy of the Arabs before Islam: unitarians affirming the Creator and resurrection — with the intermission-preachers Quss ibn Sa'ida, Ri'ab al-Shanni and Bahira the monk of Abd al-Qays; idolaters who acknowledged creation and resurrection yet denied the prophets and sought nearness through idols; and materialists denying resurrection and messengers alike {cite:muruj-al-dhahab p. 442}."
  es: "La taxonomía de Al-Mas'udi sobre los árabes antes del Islam: unitarios que afirmaban al Creador y la resurrección —con los predicadores intervinientes Quss ibn Sa'ida, Ri'ab al-Shanni y Bahira, el monje de Abd al-Qays—; idólatras que reconocían la creación y la resurrección pero negaban a los profetas y buscaban la cercanía a través de ídolos; y materialistas que negaban tanto la resurrección como a los mensajeros {cite:muruj-al-dhahab p. 442}."
  fr: "La taxonomie des Arabes avant l'Islam selon Al-Mas'udi: les unitariens affirmant le Créateur et la résurrection — avec les prédicateurs intermittents Quss ibn Sa'ida, Ri'ab al-Shanni et Bahira, le moine d'Abd al-Qays; les idolâtres qui reconnaissaient la création et la résurrection mais niaient les prophètes et recherchaient la proximité à travers les idoles; et les matérialistes niant la résurrection et les messagers {cite: muruj-al-dhahab p. 442}."
  ur: "اسلام سے پہلے عربوں کی المسعودی کی درجہ بندی: خالق اور قیامت کا اثبات کرنے والے - وقفہ کے مبلغین قس ابن سعیدہ، ریاب الشنی اور بحیرہ عبد القیس کے راہب کے ساتھ؛ وہ بت پرست جنہوں نے تخلیق اور قیامت کو تسلیم کیا لیکن انبیاء کا انکار کیا اور بتوں کے ذریعے قرب تلاش کیا۔ اور مادیت پسند قیامت اور رسولوں کا یکساں انکار کرتے ہیں 442}۔"
