label: { ar: "ديانات العرب في الجاهلية", en: "Religions of Jahiliyya Arabia" }
summary:
  ar: "صنف المسعودي العرب في جاهليتهم فرقاً: فمنهم الموحد المقر بخالقه المصدق بالبعث والنشور وقد دعا في الفترة قس بن ساعدة الإيادي ورئاب الشني وبحيرا الراهب وكان من عبد القيس، ومنهم من أقر بالخالق وأثبت حدوث العالم وأقر بالبعث وأنكر الرسل وعكف على الأصنام يقولون ما نعبدهم إلا ليقربونا إلى الله زلفى فحجوا إليها ونحروا لها البدن وأحلوا لها وحرموا، ومنهم من أقر بالخالق وكذب بالرسل والبعث ومال إلى قول أهل الدهر القائلين ما هي إلا حياتنا الدنيا نموت ونحيا وما يهلكنا إلا الدهر {cite:muruj-al-dhahab p. 442}.، وكانت لهم مذاهب في النفوس فمنهم من جعل النفس هي الدم والروح الهواء في باطن الجسم {cite:muruj-al-dhahab p. 467-468}"
  en: "Al-Mas'udi's taxonomy of the Arabs before Islam: unitarians affirming the Creator and resurrection — with the intermission-preachers Quss ibn Sa'ida, Ri'ab al-Shanni and Bahira the monk of Abd al-Qays; idolaters who acknowledged creation and resurrection yet denied the prophets and sought nearness through idols; and materialists denying resurrection and messengers alike {cite:muruj-al-dhahab p. 442}."
