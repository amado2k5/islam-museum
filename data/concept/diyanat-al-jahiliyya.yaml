class: concept
kind: doctrine
label: { ar: "ديانات العرب في الجاهلية", en: "Religions of Jahiliyya Arabia", es: "Religiones de la Arabia preislámica", fr: "Religions de l'Arabie préislamique", ur: "جاہلیت عرب کے مذاہب", tr: "İslam Öncesi Dönemde Arap Dinleri", id: "Agama Arab di Era Pra-Islam" }
summary:
  ar: "صنف المسعودي العرب في جاهليتهم فرقاً: فمنهم الموحد المقر بخالقه المصدق بالبعث والنشور وقد دعا في الفترة قس بن ساعدة الإيادي ورئاب الشني وبحيرا الراهب وكان من عبد القيس، ومنهم من أقر بالخالق وأثبت حدوث العالم وأقر بالبعث وأنكر الرسل وعكف على الأصنام يقولون ما نعبدهم إلا ليقربونا إلى الله زلفى فحجوا إليها ونحروا لها البدن وأحلوا لها وحرموا، ومنهم من أقر بالخالق وكذب بالرسل والبعث ومال إلى قول أهل الدهر القائلين ما هي إلا حياتنا الدنيا نموت ونحيا وما يهلكنا إلا الدهر {cite:muruj-al-dhahab p. 442}. وكانت لهم مذاهب في النفوس فمنهم من جعل النفس هي الدم والروح الهواء في باطن الجسم {cite:muruj-al-dhahab p. 467-468}"
  en: "Al-Mas'udi's taxonomy of the Arabs before Islam: unitarians affirming the Creator and resurrection — with the intermission-preachers Quss ibn Sa'ida, Ri'ab al-Shanni and Bahira the monk of Abd al-Qays; idolaters who acknowledged creation and resurrection yet denied the prophets and sought nearness through idols; and materialists denying resurrection and messengers alike {cite:muruj-al-dhahab p. 442}."
  es: "La taxonomía de Al-Mas'udi sobre los árabes antes del Islam: unitarios que afirmaban al Creador y la resurrección —con los predicadores intervinientes Quss ibn Sa'ida, Ri'ab al-Shanni y Bahira, el monje de Abd al-Qays—; idólatras que reconocían la creación y la resurrección pero negaban a los profetas y buscaban la cercanía a través de ídolos; y materialistas que negaban tanto la resurrección como a los mensajeros {cite:muruj-al-dhahab p. 442}."
  fr: "La taxonomie des Arabes avant l'Islam selon Al-Mas'udi: les unitariens affirmant le Créateur et la résurrection — avec les prédicateurs intermittents Quss ibn Sa'ida, Ri'ab al-Shanni et Bahira, le moine d'Abd al-Qays; les idolâtres qui reconnaissaient la création et la résurrection mais niaient les prophètes et recherchaient la proximité à travers les idoles; et les matérialistes niant la résurrection et les messagers {cite: muruj-al-dhahab p. 442}."
  ur: "اسلام سے پہلے عربوں کی المسعودی کی درجہ بندی: خالق اور قیامت کا اثبات کرنے والے - وقفہ کے مبلغین قس ابن سعیدہ، ریاب الشنی اور بحیرہ عبد القیس کے راہب کے ساتھ؛ وہ بت پرست جنہوں نے تخلیق اور قیامت کو تسلیم کیا لیکن انبیاء کا انکار کیا اور بتوں کے ذریعے قرب تلاش کیا۔ اور مادیت پسند قیامت اور رسولوں کا یکساں انکار کرتے ہیں 442}۔"
  tr: "El-Mes'udi, İslam öncesi dönemde Arapları gruplara ayırmıştır: bunlar arasında Yaratıcısını kabul eden ve diriliş ile dirilişi onaylayan tek tanrılılar vardır. Bu dönemde, Qas ibn Sa'idah al-Ayadi, Ra'ab al-Shani ve Abdül-Kays'tan Bahira al-Raheb vardır. Bunlar arasında, Yaratıcıyı kabul eden, dünyanın varlığını onaylayan, dirilişi kabul eden, elçileri reddeden ve putlara adayanlar, 'Biz onları sadece Allah'a aşağılayıcı bir şekilde yaklaştırmak için ibadet ederiz.' diyenlerdir. Onlar ona hac yaptılar, onun için beden kurban ettiler, izin verdiler ve yasakladılar. Diğerleri Yaratıcıyı kabul etti ve elçileri ve dirilişi reddetti, zamanın ahlından, 'Bu bizim dünyevi hayatımızdan başka bir şey değildir; ölür yaşarız, ve bizi yok eden zaman dışında hiçbir şey yoktur.' dediler. {alıntı:Muruj-al-dhahab, s. 442}. Ruhlarında farklı öğretiler vardı; aralarında ruhu kan, ruhu ise bedenin içindeki havayı yapanlar da vardı {atıf:Muruj-al-dhahab s. 467-468}"
  id: "Al-Mas'udi mengklasifikasikan orang Arab pada era pra-Islam mereka ke dalam kelompok-kelompok: di antaranya adalah monoteis yang mengakui Penciptanya dan menegaskan kebangkitan serta kebangkitan. Pada masa itu, Qas ibn Sa'idah al-Ayadi, Ra'ab al-Shani, dan Bahira al-Raheb, yang berasal dari Abd al-Qays. Di antara mereka adalah mereka yang mengakui Sang Pencipta, menegaskan keberadaan dunia, mengakui kebangkitan, menolak utusan, dan mengabdikan diri kepada berhala, berkata, 'Kami hanya menyembah mereka untuk mendekatkan kami kepada Allah dengan cara yang memalukan.' Mereka melakukan ibadah haji ke sana, mengorbankan tubuh untuk itu, mengizinkan, dan melarangnya. Yang lain mengakui Sang Pencipta dan menolak utusan serta kebangkitan, condong pada kata-kata orang-orang pada zamannya, yang berkata, 'Ini tidak lain adalah kehidupan duniawi kami; kami mati dan hidup, dan tidak ada yang menghancurkan kami kecuali waktu.' {cite:Muruj-al-dhahab, hlm. 442}. Mereka memiliki doktrin yang berbeda dalam jiwa mereka; di antara mereka adalah mereka yang menjadikan jiwa sebagai darah dan roh menjadi udara di dalam tubuh {cite:Muruj-al-dhahab hlm. 467-468}"
