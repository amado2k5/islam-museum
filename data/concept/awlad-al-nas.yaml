id: concept/awlad-al-nas
class: concept
kind: term
label:
  ar: "أولاد الناس"
  en: "Awlad al-Nas (sons of the people, in the Mamluk army)"
  fr: "Awlad al-Nas (les fils du peuple, dans l’armée mamelouke)"
  es: "Awlad al-Nas (hijos del pueblo, en el ejército mameluco)"
summary:
  ar: "لقب في الجيش المملوكي يُطلق على أبناء الأمراء والمماليك الأحرار المولودين في السلطنة، وهم في مرتبة أدنى من المماليك الخلص، ويضمّهم تشكيل الحلقة. وقد أغدق السلطان الناصر حسن ⁦(748-752هـ)⁩ عليهم الإمرة، لكن مكانتهم تدهورت مع الحلقة، ومالت الطبقة كلها إلى التقوى والاشتغال بالفقه {cite:encyclopaedia-of-islam-2 vol. 1 p. 814}."
  en: "The term in the Mamluk army for the sons of amirs and mamluks, born free and Muslim within the sultanate, who bore Arab names and were excluded from the pure mamluk units, being joined to the halka. Under sultan al-Nasir Hasan (748-752 AH) they were occasionally favoured; in the course of time they declined with the halka, and many turned to piety and to theology or law {cite:encyclopaedia-of-islam-2 vol. 1 p. 814}."
  fr: "Terme de l’armée mamelouke désignant les fils d’émirs et de mamelouks, nés libres et musulmans dans le sultanat, qui portaient des noms arabes et étaient exclus des unités purement mameloukes, étant rattachés à la halka. Sous le sultan al-Nasir Hasan (748-752 H), ils furent occasionnellement favorisés ; au fil du temps, ils déclinèrent avec la halka, et beaucoup se tournèrent vers la piété, la théologie ou le droit {cite:encyclopaedia-of-islam-2 vol. 1 p. 814}."
  es: "El término utilizado en el ejército mameluco para referirse a los hijos de emires y mamelucos, nacidos libres y musulmanes dentro del sultanato, que llevaban nombres árabes y eran excluidos de las unidades puramente mamelucas, al ser incorporados a la halka. Bajo el sultán al-Nasir Hasan (748-752 AH) fueron favorecidos ocasionalmente; con el tiempo, su influencia disminuyó junto con la de la halka, y muchos se volcaron a la piedad, la teología o el derecho {cite:encyclopaedia-of-islam-2 vol. 1 p. 814}."
