id: concept/awlad-al-nas
class: concept
kind: term
label:
  ar: "أولاد الناس"
  en: "Awlad al-Nas (sons of the people, in the Mamluk army)"
summary:
  ar: "لقب في الجيش المملوكي يُطلق على أبناء الأمراء والمماليك الأحرار المولودين في السلطنة، وهم في مرتبة أدنى من المماليك الخلص، ويضمّهم تشكيل الحلقة. وقد أغدق السلطان الناصر حسن (748-752هـ) عليهم الإمرة، لكن مكانتهم تدهورت مع الحلقة، ومالت الطبقة كلها إلى التقوى والاشتغال بالفقه {cite:encyclopaedia-of-islam-2 vol. 1 p. 814}."
  en: "The term in the Mamluk army for the sons of amirs and mamluks, born free and Muslim within the sultanate, who bore Arab names and were excluded from the pure mamluk units, being joined to the halka. Under sultan al-Nasir Hasan (748-752 AH) they were occasionally favoured; in the course of time they declined with the halka, and many turned to piety and to theology or law {cite:encyclopaedia-of-islam-2 vol. 1 p. 814}."
