id: concept/dhabaih-fiqh
class: concept
kind: legal
label:
  ar: "الذبائح (في الفقه)"
  en: "Slaughter (dhaba'ih): the lawful killing of animals for food in fiqh"
  ur: "ذبائح (فقہی احکام: جانور کو حلال طریقے سے ذبح کرنا)"
summary:
  ar: "الذبح في الاصطلاح قطع الحلق أو اللبة، والذكاة أعم منه، فهي السبب الموصل لحل أكل الحيوان البري اختيارا أو اضطرارا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8379} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8380} وتنقسم الذكاة إلى اختيارية بالذبح أو النحر، واضطرارية بالجرح عند العجز، وتختص ذكاة ما لا نفس له سائلة بخلاف، وتتبع ذكاة الجنين ذكاة أمه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8381} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8383} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8410} ويشترط لصحة الذبح أن يكون المذبوح حيا وأن يزهق بالذبح، وألا يكون صيد حرم، وأن يكون الذابح عاقلا مسلما أو كتابيا، وأن تكون الآلة قاطعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8388} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8392} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8397} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8403} وتجب التسمية عند الجمهور مع القدرة والتذكر، وتختلف المذاهب في حكم الناسي والجاهل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8397} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8398} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8399}"
  en: "In the terms of the jurists, slaughter is the cutting of the throat or the lower neck; dhaka is the wider term, the means that makes the flesh of a land animal lawful to eat, by choice or by necessity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8379} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8380} Slaughter is either chosen (cutting the throat or, for the camel, the lower neck) or forced (wounding an animal that cannot be caught); fish and locusts need no slaughter, and a fetus follows its mother's slaughter. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8382} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8383} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8410} For a valid slaughter the animal must be alive, the death must come from the cut, it must not be a game animal of the sanctuary, the slaughterer must be sane and a Muslim or a People of the Book, and the blade must cut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8388} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8392} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8397} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8403} The majority require the invocation of God's name when it is remembered and possible, and the schools differ on the forgetful and the ignorant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8397} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8398} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8399}"
  ur: "فقہاء کے نزدیک ذبح حلق یا لبہ کاٹنے کو کہتے ہیں، اور ذکاۃ وہ عمل ہے جس سے خشکی کے جانور کا گوشت حلال ہوتا ہے، اختیاری ہو یا اضطراری۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8379} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8381} صحتِ ذبح کے لیے جانور زندہ ہو، آلہ تیز ہو، اور ذابح عاقل مسلمان یا کتابی ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8388} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8392}"
