id: concept/dhurriya-fiqh
class: concept
kind: legal
label:
  ar: "الذرية ⁦(في الفقه)⁩"
  en: "Dhurriyya (descendants in the rulings, especially in endowments)"
  ur: "ذریت ⁦(فقہی احکام)⁩"
  es: "Dhurriyya (descendientes en los dictámenes, especialmente en las donaciones)"
  fr: "Dhurriyya (descendants dans les décisions, notamment en matière de dotations)"
  tr: "Çocuklar (Hukuk Felsefesinde)"
  id: "Keturunan (dalam Yurisprudensi)"
summary:
  ar: "الذرية في اللغة النسل والولد، وقيل تطلق على الآباء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8416} وذهب جمهور الفقهاء إلى أن الذرية تتناول البنين والبنات، فإذا وقف على ذريته دخل أولاد البنات، وخالف الخرقي من الحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8417} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8418}"
  en: "In lexicon dhurriyya means offspring, and is sometimes used for ancestors. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8416} The majority hold that dhurriyya covers sons and daughters, so an endowment to one's descendants includes the children of daughters; al-Kharaqi of the Hanbalis excludes them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8417} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8418}"
  ur: "ذریت لغت میں اولاد کو کہتے ہیں۔ جمہور کے نزدیک وقف میں ذریت میں بیٹیوں کی اولاد بھی داخل ہے، جبکہ خرقی حنبلی اس سے اختلاف کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8417} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8418}"
  es: "En el léxico, dhurriyya significa descendencia y, a veces, se utiliza para referirse a los antepasados. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8416} La mayoría sostiene que dhurriyya cubre hijos e hijas, por lo que una dotación a los descendientes de uno incluye a los hijos de las hijas; al-Kharaqi de los Hanbalis los excluye. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8417} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8418}"
  fr: "Dans le lexique, dhurriyya signifie progéniture et est parfois utilisé pour désigner les ancêtres. {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.8416} La majorité soutient que la dhurriyya couvre les fils et les filles, donc une dotation à ses descendants inclut les enfants des filles; al-Kharaqi des Hanbalis les exclut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8417} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8418}"
  tr: "Dilde 'yavru' çocuklar ve oğullar anlamına gelir ve babaları ifade ettiği söylenir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8416} Hukukçuların çoğu, 'yavru' kelimesinin oğullar ve kızları ifade ettiğini savunur; çocuklar söz konusu olduğunda ise kızların oğullarını kapsar ve al-Khurqi Hanbalilerden farklıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8417} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8418}"
  id: "Dalam bahasa ini, 'keturunan' berarti anak laki-laki, dan dikatakan merujuk pada ayah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8416} Mayoritas ahli hukum berpendapat bahwa 'keturunan' merujuk pada anak laki-laki dan perempuan; ketika berbicara tentang keturunan, itu termasuk anak laki-laki dari anak perempuan, dan al-Khurqi berbeda dari Hanbali. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8417} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8418}"
