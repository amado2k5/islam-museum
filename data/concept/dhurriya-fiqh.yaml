label:
  ar: "الذرية (في الفقه)"
  en: "Dhurriyya (descendants in the rulings, especially in endowments)"
  ur: "ذریت (فقہی احکام)"
summary:
  ar: "الذرية في اللغة النسل والولد، وقيل تطلق على الآباء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8416} وذهب جمهور الفقهاء إلى أن الذرية تتناول البنين والبنات، فإذا وقف على ذريته دخل أولاد البنات، وخالف الخرقي من الحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8417} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8418}"
  en: "In lexicon dhurriyya means offspring, and is sometimes used for ancestors. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8416} The majority hold that dhurriyya covers sons and daughters, so an endowment to one's descendants includes the children of daughters; al-Kharaqi of the Hanbalis excludes them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8417} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8418}"
  ur: "ذریت لغت میں اولاد کو کہتے ہیں۔ جمہور کے نزدیک وقف میں ذریت میں بیٹیوں کی اولاد بھی داخل ہے، جبکہ خرقی حنبلی اس سے اختلاف کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8417} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8418}"
