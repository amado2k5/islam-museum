- tradition: sunni-ashari
  id: maqalat-ashari
  stance:
    ar: شفاعة النبي لأهل الكبائر من أمته، وإخراج الله قوماً من الموحدين من النار
    en: The Prophet's intercession for those of his community who committed grave sins, and God bringing some monotheists out of the Fire
  summary:
    ar: يذكر الأشعري أنهم يقرون بشفاعة رسول الله وأنها لأهل الكبائر من أمته، ويؤمنون بأن الله يخرج قوماً من الموحدين من النار على ما جاءت به الروايات.
    en: Al-Ash'ari reports they affirm the intercession of the Messenger of God and that it is for those of his community who committed grave sins, and they believe God brings some of the monotheists out of the Fire as the reports came.
