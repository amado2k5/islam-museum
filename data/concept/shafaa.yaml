- tradition: sunni-hanbali
  id: lumat-al-itiqad
  stance:
    ar: شفاعة النبي في أهل الكبائر وشفاعات للأنبياء والمؤمنين والملائكة، ولا تنفع الكافر
    en: The Prophet's intercession for grave sinners, with intercessions of the prophets, believers and angels, which do not benefit the unbeliever
  summary:
    ar: يقول ابن قدامة إن النبي «يشفع فيمن دخل النار من أمته من أهل الكبائر، فيخرجون بشفاعته»، وإن «لسائر الأنبياء والمؤمنين والملائكة شفاعات»، وإنه «لا تنفع الكافر شفاعة الشافعين».
    en: Ibn Qudama says the Prophet intercedes for those of his community who entered the Fire for grave sins and they come out by his intercession, that the other prophets, the believers and the angels have intercessions, and that the intercession of intercessors does not benefit the unbeliever.
  holders:
  - person/ibn-qudama-al-maqdisi
  - work/lumat-al-itiqad
  evidence:
  - ref: source/lumat-al-itiqad
    note:
      ar: ص 34
      en: p. 34
  sources:
  - source/lumat-al-itiqad
- tradition: sunni-hanbali
  id: aqida-wasitiyya
  stance:
    ar: للنبي ثلاث شفاعات، منها شفاعة فيمن استحق النار، ويخرج الله أقواماً منها بغير شفاعة
    en: The Prophet has three intercessions, one for those who deserved the Fire, and God brings people out of it without intercession
  summary:
    ar: 'يذكر ابن تيمية أن للنبي ثلاث شفاعات: في أهل الموقف حتى يُقضى بينهم، وفي أهل الجنة أن يدخلوها، وهاتان خاصتان به، والثالثة فيمن استحق النار وهي له ولسائر النبيين والصديقين وغيرهم، ويقول إن الله يخرج من النار أقواماً بغير شفاعة بفضله ورحمته.'
    en: 'Ibn Taymiyya says the Prophet has three intercessions: for the people of the standing place so that judgement is passed, and for the people of Paradise to enter it, these two being his alone, and a third for those who deserved the Fire which he shares with the other prophets, the truthful and others; and God brings people out of the Fire without intercession by His favour and mercy.'
  holders:
