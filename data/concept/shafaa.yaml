issue:
  ar: من يشفع، ولمن تكون الشفاعة؟
  en: Who intercedes, and for whom is intercession?
perspectives:
- tradition: sunni-hanafi
  id: aqida-tahawiyya
  stance:
    ar: الشفاعة التي ادّخرها الله لأمة النبي حق، وأهل الكبائر يخرجون برحمته وشفاعة الشافعين
    en: The intercession God has kept for the Prophet's community is true, and those of grave sins come out by His mercy and the intercessors
  summary:
    ar: يقول الطحاوي إن الشفاعة التي ادّخرها الله لأمة النبي حق، وإن أهل الكبائر من الموحدين لا يخلدون في النار ويخرجون برحمة الله وشفاعة الشافعين من أهل طاعته.
