id: concept/shafaa
education:
  did_you_know:
    ar: "الشفاعة في الاعتقاد الطحاوي حقّ ادّخرها الله لأمة النبي، وبها يُخرج أهل الكبائر من الموحدين من النار برحمة الله."
    en: "Intercession in Tahawi's creed is a true gift God stored for the Prophet's community, by which grave sinners among the monotheists leave the Fire by His mercy."
    ur: "عقیدۂ طحاویہ میں شفاعت اللہ کا محفوظ تحفہ ہے جو نبی کی امت کے لیے ہے، جس سے موحد بڑے گنہگار اس کی رحمت سے جہنم سے نکالے جاتے ہیں۔"
    sources: [source/aqida-tahawiyya, source/aqida-wasitiyya]
class: concept
kind: doctrine
label:
  ar: الشفاعة
  en: Intercession
summary:
  ar: إيمان الطحاوي بأن الشفاعة التي ادّخرها الله لأمة النبي حق، وبأن أهل الكبائر من الموحدين يُخرَجون من النار برحمة الله وشفاعة الشافعين. وفي مسلم قال النبي «أنا سيد ولد آدم يوم القيامة وأول من ينشق عنه القبر وأول شافع وأول مشفع» {cite:sahih-muslim 2278}.
  en: al-Tahawi's belief that the intercession God has kept for the Prophet's community is true, and that those of the monotheists who committed grave sins are brought out of the Fire by God's mercy and the intercession of intercessors.
