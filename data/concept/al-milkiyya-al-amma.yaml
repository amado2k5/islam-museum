id: concept/al-milkiyya-al-amma
class: concept
kind: legal
label:
  ar: الملكية العامة
  en: "Public ownership (al-milkiyya al-amma)"
  ur: "عوامی ملکیت ⁦(الملکیۃ العامہ)⁩"
summary:
  ar: "يعرّف قعدات الملكية العامة بأنها ما تحتكره الدولة أو الأمة أو الشعب ليوزعه على الناس بالعدل، ومنها الأرض التي لا يجوز لفرد أن يستفرد بها أو يطرد الناس منها {cite:qadan-manhaj-iqtisad-quran p. 153}. ومن بنودها عنده المياه والأنهار والبحار، والمعادن، وثروات النفط والغاز، والمرافق العامة كالمطارات والسكك الحديدية والكهرباء {cite:qadan-manhaj-iqtisad-quran p. 154}. ويرى أن الكلأ والماء والنار كانت في دولة الإسلام الأولى ملكاً مشتركاً، وأن المحسوبية والرشوة والظلم هي ما أدى إلى احتكار المواد الأساسية {cite:qadan-manhaj-iqtisad-quran p. 154}."
  en: "Zaydan Qa'dat defines public ownership as what the state, nation or people keep at their disposal to distribute fairly, including land that no individual may take for himself; among its items he lists waters, minerals, oil and gas and public utilities. Al-Tahir Qana treats it as one of three kinds of property, owned by the community as a whole, which owns the thing while the individual owns its use."
  ur: "زیدان قعدات عوامی ملکیت کی تعریف کرتے ہیں کہ یہ وہ ہے جسے ریاست، امت یا قوم انصاف سے بانٹنے کے لیے اپنے تصرف میں رکھے، جس میں وہ زمین بھی شامل ہے جسے کوئی فرد اپنے لیے مخصوص نہیں کر سکتا؛ اس کی مدوں میں وہ پانی، معدنیات، تیل و گیس اور عوامی سہولیات شمار کرتے ہیں۔ الطاہر قانہ اسے ملکیت کی تین قسموں میں سے ایک سمجھتے ہیں، جس کی مالک پوری امت ہے: امت عین کی مالک ہے اور فرد منفعت کا۔"
