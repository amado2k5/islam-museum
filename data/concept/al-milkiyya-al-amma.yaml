id: concept/al-milkiyya-al-amma
class: concept
kind: legal
tags: [islamic-economy-browser, islamic-economy-money]
label:
  ar: الملكية العامة
  en: "Public ownership (al-milkiyya al-amma)"
  fr: "La propriété publique (al-milkiyya al-amma)"
  ur: "عوامی ملکیت ⁦(الملکیۃ العامہ)⁩"
  es: "Propiedad pública (al-milkiyya al-amma)"
  tr: "kamu mülkiyeti"
  id: "properti publik"
summary:
  ar: "يعرّف قعدات الملكية العامة بأنها ما تحتكره الدولة أو الأمة أو الشعب ليوزعه على الناس بالعدل، ومنها الأرض التي لا يجوز لفرد أن يستفرد بها أو يطرد الناس منها {cite:qadan-manhaj-iqtisad-quran p. 153}. ومن بنودها عنده المياه والأنهار والبحار، والمعادن، وثروات النفط والغاز، والمرافق العامة كالمطارات والسكك الحديدية والكهرباء {cite:qadan-manhaj-iqtisad-quran p. 154}. ويرى أن الكلأ والماء والنار كانت في دولة الإسلام الأولى ملكاً مشتركاً، وأن المحسوبية والرشوة والظلم هي ما أدى إلى احتكار المواد الأساسية {cite:qadan-manhaj-iqtisad-quran p. 154}."
  en: "Zaydan Qa'dat defines public ownership as what the state, nation or people keep at their disposal to distribute fairly, including land that no individual may take for himself; among its items he lists waters, minerals, oil and gas and public utilities. Al-Tahir Qana treats it as one of three kinds of property, owned by the community as a whole, which owns the thing while the individual owns its use."
  fr: "Zaydan Qa'dat définit la propriété publique comme ce que l'État, la nation ou le peuple gardent à leur disposition pour le répartir équitablement, notamment les terres que nul ne peut s'approprier. Il y range les eaux, les ressources minières, le pétrole, le gaz et les équipements et services publics. Pour al-Tahir Qana, c'est l'une des trois formes de propriété : la communauté dans son ensemble possède la chose, tandis que l'individu n'en détient que l'usage."
  ur: "زیدان قعدات عوامی ملکیت کی تعریف کرتے ہیں کہ یہ وہ ہے جسے ریاست، امت یا قوم انصاف سے بانٹنے کے لیے اپنے تصرف میں رکھے، جس میں وہ زمین بھی شامل ہے جسے کوئی فرد اپنے لیے مخصوص نہیں کر سکتا؛ اس کی مدوں میں وہ پانی، معدنیات، تیل و گیس اور عوامی سہولیات شمار کرتے ہیں۔ الطاہر قانہ اسے ملکیت کی تین قسموں میں سے ایک سمجھتے ہیں، جس کی مالک پوری امت ہے: امت عین کی مالک ہے اور فرد منفعت کا۔"
  es: "Zaydan Qa'dat define la propiedad pública como aquello que el Estado, la nación o el pueblo mantienen a su disposición para distribuir equitativamente, incluyendo la tierra que ningún individuo puede tomar para sí mismo; entre sus bienes enumera el agua, los minerales, el petróleo, el gas y los servicios públicos. Al-Tahir Qana la considera uno de los tres tipos de propiedad, perteneciente a la comunidad en su conjunto, que es propietaria del bien, mientras que el individuo es propietario de su uso."
  tr: "Kamu mülkiyeti, devletin, ulusun veya halkın insanlara adil şekilde dağıtmak için tekelleştirdiği şeyler olarak tanımlanır; buna hiçbir bireyin tekelleştiremeyeceği veya sürdüremeyeceği arazi dahildir. Kendisine göre bu maddeler arasında sular, nehirler, denizler, mineraller, petrol ve gaz kaynakları ile havaalanları, demiryolları ve elektrik gibi kamu tesisleri bulunur {atıf:qadan-manhaj-iqtisad-kur'an s. 154}}. Erken İslam devletinde otlak, su ve ateşin ortak mülk olduğuna ve ayrıcalık, rüşvet ve adaletsizliğin temel malzemelerin tekelini sağladığını savunur {cite:qadan-manhaj-iqtisad-kur'an s. 154}."
  id: "Properti publik didefinisikan sebagai hal-hal yang dimonopoli oleh negara, bangsa, atau rakyat untuk didistribusikan secara adil kepada masyarakat; ini termasuk tanah yang tidak dapat dimonopoli atau dipelihara oleh individu. Menurutnya, barang-barang tersebut meliputi air, sungai, laut, mineral, sumber daya minyak dan gas, serta fasilitas publik seperti bandara, rel kereta, dan listrik {kutipan: qadan-manhaj-iqtisad-qur'an hlm. 154}}. Ia berpendapat bahwa pada masa awal negara Islam, padang rumput, air, dan api adalah milik bersama, dan bahwa hak istimewa, suap, dan ketidakadilan memastikan monopoli bahan dasar {cite: qadan-manhaj-iqtisad-qur'an hlm. 154}."
