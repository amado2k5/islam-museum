label:
  ar: الملكية العامة
  en: "Public ownership (al-milkiyya al-amma)"
summary:
  ar: "يعرّف قعدات الملكية العامة بأنها ما تحتكره الدولة أو الأمة أو الشعب ليوزعه على الناس بالعدل، ومنها الأرض التي لا يجوز لفرد أن يستفرد بها أو يطرد الناس منها {cite:qadan-manhaj-iqtisad-quran p. 153}. ومن بنودها عنده المياه والأنهار والبحار، والمعادن، وثروات النفط والغاز، والمرافق العامة كالمطارات والسكك الحديدية والكهرباء {cite:qadan-manhaj-iqtisad-quran p. 154}. ويرى أن الكلأ والماء والنار كانت في دولة الإسلام الأولى ملكاً مشتركاً، وأن المحسوبية والرشوة والظلم هي ما أدى إلى احتكار المواد الأساسية {cite:qadan-manhaj-iqtisad-quran p. 154}."
