id: concept/malakat-al-lugha
class: concept
kind: term
label: { ar: "ملكة اللغة", en: "The linguistic habitus" }
summary:
  ar: "نظرية ابن خلدون في تعلم اللسان العربي: المعاني المقصودة لكل أحد متيسرة لا تحتاج إلى تكلف صناعة، وتأليف الكلام للعبارة عنها هو المحتاج للصناعة وهو بمثابة القوالب للمعاني كما أن الأواني التي يغترف بها الماء من البحر منها الذهب والفضة والصدف والزجاج والخزف والماء واحد في نفسه وتختلف الجودة بالأواني لا بالماء، وملكة اللسان لا تحصل إلا بكثرة الحفظ وعلى قدر جودة المحفوظ وطبقته تكون جودة الملكة، فمن كان محفوظه من أشعار حبيب أو العتابي أو ابن المعتز أو ابن هانئ أو الشريف الرضي أو رسائل ابن المقفع أو سهل بن هارون أو ابن الزيات أو البديع أو الصابئ كانت ملكته أجود وأعلى مقاماً ممن يحفظ أشعار المتأخرين مثل ابن سهل أو ابن النبيه أو ترسل البيساني أو العماد الأصبهاني لنزول طبقة هؤلاء عن أولئك، والملكة الشعرية تنشأ بحفظ الشعر وملكة الكتابة بحفظ الأسجاع والترسيل والعلمية بمخالطة العلوم والفقهية بمخالطة الفقه وتنظير المسائل، ولهذا كان الفقهاء والنحاة والمتكلمون قاصرين في البلاغة لأن ما يسبق إلى محفوظهم من القوانين العلمية والعبارات الفقهية الخارجة عن أسلوب البلاغة، وروى أبو القاسم بن رضوان كاتب العلمة بالدولة المرينية أنه أنشد أبا العباس بن شعيب كاتب السلطان أبي الحسن مطلع قصيدة ابن النحوي لم أدر حيني وقيفتي بالأطلال فقال على البديهة هذا شعر فقيه لقوله ما الفرق إذ هي من عبارات الفقهاء وليست من أساليب كلام العرب {cite:muqaddima-ibn-khaldun p. 614-616}."
  en: "Eloquence is a habitus fed by what one memorises — water in vessels of gold or clay — so faqihs' verse betrays itself {cite:muqaddima-ibn-khaldun p. 614-616}."
