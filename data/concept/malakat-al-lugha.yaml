label: { ar: "ملكة اللغة", en: "The linguistic habitus", es: "El habitus lingüístico", fr: "L'habitus linguistique", ur: "لسانی عادت", tr: "dil kraliçesi", id: "ratu bahasa" }
summary:
  ar: "نظرية ابن خلدون في تعلم اللسان العربي: المعاني المقصودة لكل أحد متيسرة لا تحتاج إلى تكلف صناعة، وتأليف الكلام للعبارة عنها هو المحتاج للصناعة وهو بمثابة القوالب للمعاني كما أن الأواني التي يغترف بها الماء من البحر منها الذهب والفضة والصدف والزجاج والخزف والماء واحد في نفسه وتختلف الجودة بالأواني لا بالماء، وملكة اللسان لا تحصل إلا بكثرة الحفظ وعلى قدر جودة المحفوظ وطبقته تكون جودة الملكة، فمن كان محفوظه من أشعار حبيب أو العتابي أو ابن المعتز أو ابن هانئ أو الشريف الرضي أو رسائل ابن المقفع أو سهل بن هارون أو ابن الزيات أو البديع أو الصابئ كانت ملكته أجود وأعلى مقاماً ممن يحفظ أشعار المتأخرين مثل ابن سهل أو ابن النبيه أو ترسل البيساني أو العماد الأصبهاني لنزول طبقة هؤلاء عن أولئك، والملكة الشعرية تنشأ بحفظ الشعر وملكة الكتابة بحفظ الأسجاع والترسيل والعلمية بمخالطة العلوم والفقهية بمخالطة الفقه وتنظير المسائل، ولهذا كان الفقهاء والنحاة والمتكلمون قاصرين في البلاغة لأن ما يسبق إلى محفوظهم من القوانين العلمية والعبارات الفقهية الخارجة عن أسلوب البلاغة، وروى أبو القاسم بن رضوان كاتب العلمة بالدولة المرينية أنه أنشد أبا العباس بن شعيب كاتب السلطان أبي الحسن مطلع قصيدة ابن النحوي لم أدر حيني وقيفتي بالأطلال فقال على البديهة هذا شعر فقيه لقوله ما الفرق إذ هي من عبارات الفقهاء وليست من أساليب كلام العرب {cite:muqaddima-ibn-khaldun p. 614-616}."
  en: "Eloquence is a habitus fed by what one memorises — water in vessels of gold or clay — so faqihs' verse betrays itself {cite:muqaddima-ibn-khaldun p. 614-616}."
  es: "La elocuencia es un hábito alimentado por lo que uno memoriza —agua en vasijas de oro o arcilla—, por lo que el verso de los faqihs se delata a sí mismo {cite:muqaddima-ibn-khaldun p. 614-616}."
  fr: "L'éloquence est un habitus nourri par ce que l'on mémorise — l'eau dans des vases d'or ou d'argile — ainsi le vers des faqihs se trahit lui-même {cite:muqaddima-ibn-khaldun p. 614-616}."
  ur: "فصاحت و بلاغت ایک عادت ہے جسے یاد کیا جاتا ہے - سونے یا مٹی کے برتنوں میں پانی - لہذا فقیہہ کی آیت اپنے آپ کو دھوکہ دیتی ہے۔ 614-616}۔"
  tr: "İbn Haldun'un Arapça öğrenme teorisi: Amaçlanan anlamlar herkes için erişilebilirdir ve hiçbir çaba gerektirmez. Bunları ifade etmek için konuşma yapmak sanat gerektirir ve anlamlar için şablon görevi görür. Ayrıca, denizden su çekmek için kullanılan kaplar arasında altın, gümüş, kabuklar, cam, seramik ve su vardır. Kalite kaplar arasında farklılık gösterir, su değil. Dil ustalığı ancak kapsamlı ezberle sağlanır ve korunanın kalitesi, ezberlenen eserin kalitesi kadar iyidir. Yani, Habib veya Al-Atabi'nin şiirlerini ezberleyen kişi Ya da İbn el-Mu'tazz, İbn Hani, el-Şerif el-Radi, İbn el-Muqaffa', Sahl bin Harun, İbn el-Zayyat, el-Badi veya el-Sabi, İbn Sahl, İbn el-Nabih, Tarsal el-Baysani veya el-İmad el-İsfahani gibi sonraki alimlerin şiirlerini ezberleyenlerden daha yüksek ve üstün bir rütbeye sahipti; çünkü onların soyundan gelmiştir. Şiir yetenek, şiir ezberlemeden, uyak ve aktarımı ezberleyerek yazabilme yeteneğinden ve bilimleri fıkıh ile harmanlayarak ve teorisel meseleleri harmanlayarak bilimsel bilgiden doğar. Bu nedenle, hukukçular, dilbilgiciler ve ilahiyatçılar sınırlı kalmıştı Çünkü onlardan önce gelen şey, retorik üslubunun dışındaki bilimsel yasalar ve fıkıh ifadeleridir. Marinid devletindeki âlimin kâtipi Ebu al-Kasım bin Ridvan, İbn el-Nehvi'nin şiirinin başında Sultan Ebu Hasan'ın kâtipi Ebu Abbas bin Şuayb'a, 'Enkazlarla ilgili tökezlememi fark edemedim' dediğini anlatmıştır. Şöyle dedi: 'Bu bir hukukçunun sezgisel şiiridir,' ve şöyle dedi: 'Farkı nedir? Bunlar Arapça konuşma tarzları arasında değil, hukukçuların ifadeleri arasındadır.' {alıntı:mukaddima-ibn haldun, s. 614-616}."
  id: "Teori Ibn Khaldun dalam mempelajari bahasa Arab: Makna yang dimaksud dapat diakses oleh semua orang dan tidak memerlukan usaha apapun. Menyusun ucapan untuk mengungkapkannya membutuhkan kerajinan dan berfungsi sebagai template untuk makna. Selain itu, wadah yang digunakan untuk mengambil air dari laut meliputi emas, perak, kerang, kaca, keramik, dan air adalah satu pada dirinya sendiri. Kualitasnya berbeda antara wadah, bukan air. Penguasaan bahasa hanya dicapai melalui hafalan yang mendalam, dan kualitas yang diawetkan sama baiknya dengan kualitas karya yang dihafal. Jadi, siapa pun yang menghafal puisi Habib atau Al-Atabi Atau Ibn al-Mu'tazz, Ibn Hani, al-Sharif al-Radi, Ibn al-Muqaffa', Sahl ibn Harun, Ibn al-Zayyat, al-Badi', atau al-Sabi memiliki pangkat yang lebih tinggi dan superior dibandingkan mereka yang menghafal puisi ulama kemudian seperti Ibn Sahl, Ibn al-Nabih, Tarsal al-Baysani, atau al-Imad al-Isfahani, karena keturunan dari mereka. Bakat puisi muncul dari menghafal puisi, kemampuan menulis dengan menghafal rima dan transmisi, serta pengetahuan ilmiah melalui perpaduan ilmu pengetahuan dengan hukum dan teori isu. Karena alasan ini, ahli hukum, tata bahasa, dan teolog terbatas dalam Retorika karena yang mendahuluinya adalah hukum ilmiah dan ekspresi yurisprudensi di luar gaya retorika. Abu al-Qasim ibn Ridwan, juru tulis ulama di negara Marinid, menceritakan bahwa ia membacakan kepada Abu al-Abbas ibn Shu'ayb, juru tulis Sultan Abu al-Hasan, di awal puisi Ibn al-Nahwi, 'Aku tidak bisa mengenali batu sandungan dengan reruntuhan.' Ia berkata, 'Ini adalah puisi intuitif seorang ahli hukum,' seperti yang ia katakan: 'Apa bedanya? Ini adalah antara ungkapan para ahli hukum dan bukan di antara gaya bahasa Arab.' {cite:muqaddima-ibn-khaldun, hlm. 614-616}."
