summary:
  ar: "يذكر ابن سينا صبياً لا ينام ولا يزال يبكي ويدمدم، ويضطر إلى إرقاده، فينوّم بقشور الخشخاش وبزره ودهن الخس ودهن الخشخاش على الصدغ، أو بمعجون من بذور عدة مع سكر، وقد يضاف إليه شيء من الأفيون {cite:canon-ibn-sina-print-v1 p.218}."
  en: "Ibn Sina mentions a child who does not sleep and keeps crying and murmuring so that putting it to sleep becomes necessary, treated with poppy husks and seed, lettuce oil and poppy oil on the temple, or a paste of many seeds with sugar, to which a little opium may be added {cite:canon-ibn-sina-print-v1 p.218}."
