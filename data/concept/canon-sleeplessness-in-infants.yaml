label: { ar: "الأرق عند الصبيان وما ينوّمهم عند ابن سينا", en: "Sleeplessness in infants and what makes them sleep in the Canon", ur: "قانون میں بچوں کی بے خوابی اور نیند لانے والی چیزیں", es: "El insomnio en los bebés y qué les hace dormir en el Canon", fr: "L'insomnie chez les nourrissons et ce qui les fait dormir dans le Canon" }
summary:
  ar: "يذكر ابن سينا صبياً لا ينام ولا يزال يبكي ويدمدم، ويضطر إلى إرقاده، فينوّم بقشور الخشخاش وبزره ودهن الخس ودهن الخشخاش على الصدغ، أو بمعجون من بذور عدة مع سكر، وقد يضاف إليه شيء من الأفيون {cite:canon-ibn-sina-print-v1 p.218}."
  en: "Ibn Sina mentions a child who does not sleep and keeps crying and murmuring so that putting it to sleep becomes necessary, treated with poppy husks and seed, lettuce oil and poppy oil on the temple, or a paste of many seeds with sugar, to which a little opium may be added {cite:canon-ibn-sina-print-v1 p.218}."
  es: "Ibn Sina menciona a un niño que no duerme y sigue llorando y murmurando, por lo que se hace necesario acostarlo, tratado con cáscaras y semillas de amapola, aceite de lechuga y aceite de amapola en la sien, o una pasta de muchas semillas con azúcar, a la que se puede añadir un poco de opio {cite:canon-ibn-sina-print-v1 p.218}."
  fr: "Ibn Sina mentionne un enfant qui ne dort pas et ne cesse de pleurer et de murmurer, au point qu'il est nécessaire de l'endormir, traité avec des coques et des graines de pavot, de l'huile de laitue et de l'huile de pavot sur la tempe, ou une pâte de nombreuses graines avec du sucre, à laquelle on peut ajouter un peu d'opium {cite:canon-ibn-sina-print-v1 p.218}."
