id: concept/hariqa-al-lisan
class: concept
kind: scientific
label:
  ar: حرقة اللسان
  en: Burning of the tongue
  ur: زبان کی جلن
  es: "Ardor en la lengua"
summary:
  ar: قد تكون حرقة اللسان بسبب حرارة في فم المعدة أو الدماغ لا تبلغ أن تكون حمى أو بسبب تناول أشياء حريفة ومالحة ومرة وحلوة والعطش الشديد ويكون لأسباب أعظم من ذلك مثل الحميات الحارة والأورام الباطنة، وعلاج ذلك في الجملة أنه يجب أن يمنع من يشكو ذلك وخصوصاً من المرضى أن ينام على القفا ومن أن يديم فغر الفم ويلزم استعمال الحبوب المتخذة من بزور المبردة من هذا الجنس ويمسك في الفم الألعبة المعلومة والعصارات المبردة المرطبة ثم يتعهد بأن يدهن ويمضمض من هذا الجنس ومن الناس من يعالج ذلك بدلكه بالنعناع ⁦(قول منسوب إلى بعض الناس)⁩ {cite:canon-ibn-sina-print-v2 p.260}
  en: 'The tongue''s burning may come from a heat in the mouth of the stomach or the brain short of being a fever, from taking sharp, salty, bitter and sweet things and severe thirst, and from greater causes such as the hot fevers and the inward tumours. Its treatment in sum: the complainant — especially the sick — is kept from sleeping on his back and from lasting mouth-gaping, and is held to the pills made of the cooling seeds of this kind; the known mucilages and the cooling moistening juices are held in the mouth, then oils and rinses of this kind are kept up; some people treat it by rubbing it with mint (a saying ascribed to some people; the other names left out) {cite:canon-ibn-sina-print-v2 p.260}'
  ur: 'زبان کی جلن معدے کے منہ یا دماغ کی گرمی سے ہو سکتی ہے جو بخار کی حد تک نہ پہنچے، یا حریف، نمکین، کڑوی اور میٹھی چیزوں کے تناول اور شدید پیاس سے، اور اس سے بڑے اسباب سے جیسے گرم بخار اور اندرونی ورم؛ اس کا علاج مجموعاً یہ ہے کہ شکایت کرنے والے کو خصوصاً مریضوں کو پیٹھ کے بل سونے اور منہ مسلسل کھلے رکھنے سے روکا جائے، اور اسی جنس کے ٹھنڈے بیجوں سے بنی گولیاں استعمال کرائی جائیں اور معلوم لعاب دار چیزیں اور ٹھنڈے تر عصارے منہ میں رکھے جائیں، پھر اسی جنس کے تیل اور مضمضے قائم رہیں؛ اور بعض لوگ اس کا علاج پودینے سے مالنے سے کرتے ہیں ⁦(بعض لوگوں سے منسوب قول؛ باقی نام مطروح)⁩ {cite:canon-ibn-sina-print-v2 p.260}'
  es: "El ardor de lengua puede deberse a un calor en la boca, el estómago o el cerebro que no llega a ser fiebre, a la ingesta de alimentos picantes, salados, amargos y dulces, a una sed intensa y a causas mayores como fiebres altas y tumores internos. Su tratamiento, en resumen: se evita que el afectado —especialmente el enfermo— duerma boca arriba y mantenga la boca abierta durante mucho tiempo, y se le administran pastillas hechas con semillas refrescantes de este tipo; se mantienen en la boca los mucílagos conocidos y los jugos refrescantes e hidratantes, y luego se realizan enjuagues bucales con aceites de este tipo; algunas personas lo tratan frotándolo con menta (un dicho atribuido a algunas personas; se omiten los otros nombres) {cite:canon-ibn-sina-print-v2 p.260}"
