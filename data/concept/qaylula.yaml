id: concept/qaylula
class: concept
kind: legal
label:
  ar: "قَيْلُولَة"
  en: "Midday rest (qaylula)"
  ur: "دوپہر کی نیند ⁦(قیلولہ)⁩"
  es: "Descanso del mediodía (qaylula)"
  fr: "Repos de midi (qaylula)"
  tr: "şekerleme"
  id: "tidur siang"
summary:
  ar: "القيلولة في اللغة النوم نصف النهار، وفي الاصطلاح النوم قبل الزوال أو في وسط النهار. ونومها مستحب، وقد ورد الأمر بها، وتعليل ذلك بأن الشياطين لا تقيل، وأنها تعين على قيام الليل كما يعين السحور على صيام النهار. ووقتها من الأوقات التي تكشف فيها عادة الناس عن أبدانهم، فنص الكتاب على ثلاثة أوقات يستأذن فيها الأطفال والخدم، وهي قبل الفجر وظهيرة وبعد العشاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13147} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13148}"
  en: "In the lexicon qaylula is sleeping in the middle of the day; the jurists use it in the same sense, meaning a nap before noon or around midday. The nap is recommended, and the sources give as reasons that devils do not nap and that it helps with night prayer, as suhur helps with fasting. Midday is one of three times when people commonly uncover themselves, and the Qur'an sets these times for permission before entering; the Companions disagreed on whether that ruling still applies. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13147} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13148}"
  ur: "لغت میں قیلولہ دن کے وسط میں سونے کو کہتے ہیں، اور فقہاء اس لفظ کو اسی معنی میں لیتے ہیں یعنی زوال سے پہلے یا دوپہر کے قریب کی نیند۔ یہ نیند مستحب ہے، اور اس کی علت بیان کی گئی ہے کہ شیاطین قیلولہ نہیں کرتے، اور یہ رات کی نماز میں مدد دیتی ہے جیسے سحری روزے میں مدد دیتی ہے۔ دوپہر ان تین اوقات میں سے ایک ہے جن میں لوگ عموماً بے پردگی میں ہوتے ہیں، اور قرآن نے ان اوقات میں داخل ہونے سے پہلے اجازت لینے کا حکم دیا؛ صحابہ کا اختلاف ہے کہ یہ حکم باقی ہے یا منسوخ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13147} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13148}"
  es: "En el léxico, qaylula significa dormir a mediodía; los juristas lo usan en el mismo sentido, refiriéndose a una siesta antes del mediodía o alrededor de esa hora. Se recomienda la siesta, y las fuentes dan como razones que los demonios no duermen la siesta y que ayuda con la oración nocturna, al igual que el suhur ayuda con el ayuno. El mediodía es uno de los tres momentos en que la gente suele descubrirse, y el Corán establece estos momentos como permitidos antes de entrar; los Compañeros discreparon sobre si esa norma sigue vigente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13147} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13148}"
  fr: "Dans le lexique, qaylula signifie dormir en milieu de journée; les juristes l'emploient dans le même sens, c'est-à-dire une sieste avant midi ou aux alentours de midi. La sieste est recommandée, et les sources avancent comme raisons que les démons ne dorment pas et qu'elle facilite la prière nocturne, tout comme le suhur facilite le jeûne. Midi est l'un des trois moments où l'on se découvre généralement, et le Coran fixe ces moments pour obtenir la permission d'entrer; les Compagnons étaient en désaccord sur la validité de cette règle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13147} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13148}"
  tr: "Dilbilimde şekerleme, öğle vakti uyumak anlamına gelirken, terminolojide öğleden önce veya gün ortasında uyumak anlamına gelir. Uykusu tavsiye edilir ve şeytanların sıkıntı yaratmadığı, gece kalkmanın da gündüz orucuna yardımcı olduğu gibi sabah kalmanın yardımcı olduğu şeklinde açıklanmıştır. Bu zaman, insanların genellikle bedenlerini açtığı zamanlardan biridir. Kur'an, çocukların ve hizmetçilerin izin istediği üç kez belirtmiştir: şafak öncesi, öğle ve işa'dan sonra. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.13147} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13148}"
  id: "Dalam linguistik, tidur siang berarti tidur siang, dan dalam istilah itu berarti tidur sebelum tengah hari atau tengah hari. Tidur siang dianjurkan, dan telah diperintahkan, dijelaskan dengan mengatakan bahwa setan tidak menyebabkan kesusahan, dan membantu berdiri di malam hari seperti suhoor membantu berpuasa di siang hari. Waktunya adalah salah satu waktu ketika orang biasanya membuka tubuh mereka. Al-Qur'an telah menetapkan tiga kali di mana anak-anak dan pelayan meminta izin: sebelum fajar, tengah hari, dan setelah Isha. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13147} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13148}"
