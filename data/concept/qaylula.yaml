id: concept/qaylula
class: concept
kind: legal
label:
  ar: "قَيْلُولَة"
  en: "Midday rest (qaylula)"
  ur: "دوپہر کی نیند (قیلولہ)"
summary:
  ar: "القيلولة في اللغة النوم نصف النهار، وفي الاصطلاح النوم قبل الزوال أو في وسط النهار. ونومها مستحب، وقد ورد الأمر بها، وتعليل ذلك بأن الشياطين لا تقيل، وأنها تعين على قيام الليل كما يعين السحور على صيام النهار. ووقتها من الأوقات التي تكشف فيها عادة الناس عن أبدانهم، فنص الكتاب على ثلاثة أوقات يستأذن فيها الأطفال والخدم، وهي قبل الفجر وظهيرة وبعد العشاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13147} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13148}"
  en: "In the lexicon qaylula is sleeping in the middle of the day; the jurists use it in the same sense, meaning a nap before noon or around midday. The nap is recommended, and the sources give as reasons that devils do not nap and that it helps with night prayer, as suhur helps with fasting. Midday is one of three times when people commonly uncover themselves, and the Qur'an sets these times for permission before entering; the Companions disagreed on whether that ruling still applies. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13147} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13148}"
  ur: "لغت میں قیلولہ دن کے وسط میں سونے کو کہتے ہیں، اور فقہاء اس لفظ کو اسی معنی میں لیتے ہیں یعنی زوال سے پہلے یا دوپہر کے قریب کی نیند۔ یہ نیند مستحب ہے، اور اس کی علت بیان کی گئی ہے کہ شیاطین قیلولہ نہیں کرتے، اور یہ رات کی نماز میں مدد دیتی ہے جیسے سحری روزے میں مدد دیتی ہے۔ دوپہر ان تین اوقات میں سے ایک ہے جن میں لوگ عموماً بے پردگی میں ہوتے ہیں، اور قرآن نے ان اوقات میں داخل ہونے سے پہلے اجازت لینے کا حکم دیا؛ صحابہ کا اختلاف ہے کہ یہ حکم باقی ہے یا منسوخ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13147} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13148}"
