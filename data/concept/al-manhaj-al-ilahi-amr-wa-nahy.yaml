id: concept/al-manhaj-al-ilahi-amr-wa-nahy
class: concept
kind: ethical
label:
  ar: "المنهج الإلهي: الأمر والنهي"
  en: "The divine method: commands and prohibitions"
  fr: "La méthode divine : ordres et interdictions"
  ur: "الٰہی منہج: حکم اور ممانعت"
  es: "El método divino: mandamientos y prohibiciones"
  tr: "İlahi Yöntem: Emir ve Yasaklama"
  id: "Metode Ilahi: Perintah dan Larangan"
summary:
  ar: "يرى الشعراوي أن أول درس في المنهج الإلهي للإنسان هو الأمر والنهي، وأن المباح في منهج السماء كثير والممنوع قليل، وأن النهي عن القرب من المحرم أبلغ في الوقاية، وأن ظلم النفس أن يعطيها الإنسان شهوة عاجلة تحرمه نعيما دائما {cite:tafsir-sharawi-khawatir-scan p.261} {cite:tafsir-sharawi-khawatir-scan p.264} {cite:tafsir-sharawi-khawatir-scan p.265}."
  en: "Sha'rawi holds that the first lesson of the divine method for humanity is command and prohibition, that what is permitted in the revealed method is abundant and what is forbidden is little, that forbidding approach to the unlawful protects better than forbidding the act alone, and that wronging oneself is giving the self a passing desire that deprives it of lasting bliss {cite:tafsir-sharawi-khawatir-scan p.261} {cite:tafsir-sharawi-khawatir-scan p.264} {cite:tafsir-sharawi-khawatir-scan p.265}."
  fr: "Sha'rawi estime que la première leçon de la méthode divine pour l’humanité est l’ordre et l’interdiction, que ce qui est permis dans la méthode révélée est abondant et ce qui est interdit peu de chose, qu’interdire de s’approcher de l’illicite protège mieux qu’interdire le seul acte, et que se faire tort à soi-même, c’est accorder à son âme un désir passager qui la prive d’une félicité durable {cite:tafsir-sharawi-khawatir-scan p.261} {cite:tafsir-sharawi-khawatir-scan p.264} {cite:tafsir-sharawi-khawatir-scan p.265}."
  ur: "شعراوی کے نزدیک انسان کے لیے الٰہی منہج کا پہلا سبق حکم اور ممانعت ہے۔ آسمانی منہج میں جائز چیزیں بہت ہیں اور ممنوع تھوڑی۔ حرام کے قریب جانے سے منع کرنا بچاؤ میں زیادہ کارگر ہے، اور اپنے آپ پر ظلم یہ ہے کہ انسان نفس کو وقتی خواہش دے جو اسے دائمی نعمت سے محروم کر دے {cite:tafsir-sharawi-khawatir-scan p.261} {cite:tafsir-sharawi-khawatir-scan p.264} {cite:tafsir-sharawi-khawatir-scan p.265}۔"
  es: "Sha'rawi sostiene que la primera lección del método divino para la humanidad es el mandato y la prohibición, que lo que está permitido en el método revelado es abundante y lo que está prohibido es poco, que prohibir el acercamiento a lo ilícito protege mejor que prohibir solo el acto, y que hacerse daño a uno mismo es darle al yo un deseo pasajero que lo priva de la dicha duradera {cite:tafsir-sharawi-khawatir-scan p.261} {cite:tafsir-sharawi-khawatir-scan p.264} {cite:tafsir-sharawi-khawatir-scan p.265}."
  tr: "El-Şaarawi, ilahi yöntemin insanlar için ilk dersinin emir ve yasaklama olduğunu, göksel yöntemde izin verilenin çok, yasak olanın az olduğunu, yasak olana yakınlığın yasaklanmasının önlemede daha belirgin olduğunu ve ruha ani bir arzu vermenin ona sonsuz mutluluktan mahrum bırakmanın haksızlık olduğunu düşünür {cite:tafsir-sharawi-khawatir-scan s.261} {cite:tafsir-sharawi-khawatir-scan s.264} {cite:tafsir-sharawi-khawatir-scan s.265}."
  id: "Al-Shaarawi percaya bahwa pelajaran pertama dari metode ilahi bagi manusia adalah perintah dan larangan, bahwa dalam metode surgawi apa yang diperbolehkan adalah banyak, yang dilarang sedikit, larangan mendekati sesuatu yang dilarang lebih jelas dalam pencegahan, dan bahwa memberi jiwa keinginan mendadak adalah tidak adil untuk merampas kebahagiaan abadi {cite:tafsir-sharawi-khawatir-scan hlm.261} {cite:tafsir-sharawi-khawatir-scan hlm.264} {cite:tafsir-sharawi-khawatir-scan hlm.265}."
