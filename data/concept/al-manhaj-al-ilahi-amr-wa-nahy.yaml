id: concept/al-manhaj-al-ilahi-amr-wa-nahy
class: concept
kind: ethical
label:
  ar: "المنهج الإلهي: الأمر والنهي"
  en: "The divine method: commands and prohibitions"
  ur: "الٰہی منہج: حکم اور ممانعت"
summary:
  ar: "يرى الشعراوي أن أول درس في المنهج الإلهي للإنسان هو الأمر والنهي، وأن المباح في منهج السماء كثير والممنوع قليل، وأن النهي عن القرب من المحرم أبلغ في الوقاية، وأن ظلم النفس أن يعطيها الإنسان شهوة عاجلة تحرمه نعيما دائما {cite:tafsir-sharawi-khawatir-scan p.261} {cite:tafsir-sharawi-khawatir-scan p.264} {cite:tafsir-sharawi-khawatir-scan p.265}."
  en: "Sha'rawi holds that the first lesson of the divine method for humanity is command and prohibition, that what is permitted in the revealed method is abundant and what is forbidden is little, that forbidding approach to the unlawful protects better than forbidding the act alone, and that wronging oneself is giving the self a passing desire that deprives it of lasting bliss {cite:tafsir-sharawi-khawatir-scan p.261} {cite:tafsir-sharawi-khawatir-scan p.264} {cite:tafsir-sharawi-khawatir-scan p.265}."
  ur: "شعراوی کے نزدیک انسان کے لیے الٰہی منہج کا پہلا سبق حکم اور ممانعت ہے۔ آسمانی منہج میں جائز چیزیں بہت ہیں اور ممنوع تھوڑی۔ حرام کے قریب جانے سے منع کرنا بچاؤ میں زیادہ کارگر ہے، اور اپنے آپ پر ظلم یہ ہے کہ انسان نفس کو وقتی خواہش دے جو اسے دائمی نعمت سے محروم کر دے {cite:tafsir-sharawi-khawatir-scan p.261} {cite:tafsir-sharawi-khawatir-scan p.264} {cite:tafsir-sharawi-khawatir-scan p.265}۔"
