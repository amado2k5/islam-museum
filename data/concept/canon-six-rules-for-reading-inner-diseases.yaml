id: concept/canon-six-rules-for-reading-inner-diseases
class: concept
kind: scientific
label:
  ar: "القوانين الستة للاستدلال على الأمراض الباطنة عند ابن سينا"
  en: "The six rules for reading inner diseases in the Canon"
  fr: "Six règles d’interprétation des maladies internes dans le Canon"
  ur: "اندرونی امراض سے استدلال کے چھ قوانین، قانون کے مطابق"
  es: "Las seis reglas para leer las enfermedades internas en el Canon"
  tr: "İbn Sina'ya göre İç Hastalıkların Tanımlanmasına İlişkin Altı Yasa"
  id: "Enam Undang-Undang untuk Mengidentifikasi Penyakit Dalam Menurut Avicenna"
summary:
  ar: "بعد التشريح يعتمد الطبيب عند ابن سينا ستة قوانين في الاستدلال على الأمراض الباطنة: من مضار الأفعال، ومما يستفرغ، ومن الوجع، ومن الورم، ومن الوضع، ومن الأعراض الظاهرة المناسبة {cite:canon-ibn-sina-print-v1 p.156}."
  en: "Once anatomy is known, Ibn Sina has the physician rest on six rules for reading inner diseases: from harm to functions, from what is evacuated, from pain, from swelling, from position, and from related outward symptoms {cite:canon-ibn-sina-print-v1 p.156}."
  fr: "Après connaissance de l’anatomie, Ibn Sina fonde l’interprétation des maladies internes sur six règles : atteinte fonctionnelle, évacuations, douleur, gonflement, position et symptômes extérieurs associés {cite:canon-ibn-sina-print-v1 p.156}."
  es: "Una vez que se conoce la anatomía, Ibn Sina hace que el médico se base en seis reglas para leer las enfermedades internas: del daño a las funciones, de lo que se evacua, del dolor, de la hinchazón, de la posición y de los síntomas externos relacionados {cite:canon-ibn-sina-print-v1 p.156}."
  ur: "ایک بار اناٹومی کا علم ہو جانے کے بعد، ابن سینا کے پاس طبیب کو اندرونی بیماریوں کو پڑھنے کے لیے چھ اصولوں پر آرام ملتا ہے: نقصان سے افعال تک، جو نکالا جاتا ہے، درد سے، سوجن سے، پوزیشن سے، اور متعلقہ ظاہری علامات سے۔"
  tr: "Otopsiden sonra, doktor İbn Sina'ya göre altı yasaya dayanarak iç hastalıkları çıkarır: eylemlerden kaynaklanan zararlar, kusmaya neden olan zararlar, ağrı, tümörler, doğumdan ve uygun belirgin belirtiler {cite:canon-ibn-sina-print-v1 s.156}."
  id: "Setelah otopsi, dokter mengandalkan enam hukum menurut Avicenna untuk menyimpulkan penyakit dalam: bahaya dari tindakan, penyebab muntah, rasa sakit, tumor, sejak lahir, dan gejala yang tampak sesuai {cite:canon-ibn-sina-print-v1 hlm.156}."
