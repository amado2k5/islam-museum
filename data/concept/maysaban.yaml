summary:
  ar: "الميسبان في الكتاب طبعه كالمعتدل، مليّن، يلين الصدر والحلق، ويسكن العطش وخصوصاً مع بزره، ويلين البطن {cite:canon-ibn-sina-print-v1 p.600}."
  en: "Maysaban is in the book of a temperament like the moderate, softening; it softens the chest and throat, calms thirst, especially with its seed, and softens the belly {cite:canon-ibn-sina-print-v1 p.600}."
  ur: "میسبان کتاب میں معتدل جیسے مزاج کا ہے، نرم کرنے والا؛ سینے اور حلق کو نرم کرتا ہے، پیاس بجھاتا ہے خاص طور پر اپنے بیج کے ساتھ، اور پیٹ کو نرم کرتا ہے {cite:canon-ibn-sina-print-v1 p.600}۔"
  es: "Maysaban está en el libro de un temperamento como el moderado, suavizante; suaviza el pecho y la garganta, calma la sed, especialmente con su semilla, y suaviza el vientre {cite:canon-ibn-sina-print-v1 p.600}."
  fr: "Maysaban est dans le livre d'un tempérament comme le modéré, adoucissant; il adoucit la poitrine et la gorge, calme la soif, surtout avec sa graine, et adoucit le ventre {cite:canon-ibn-sina-print-v1 p.600}."
