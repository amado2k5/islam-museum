  en: "Melancholia"
  ur: "مالنخولیا"
summary:
  ar: "يعرّف ابن سينا المالنخوليا بأنها تغيّر الظنون والفكر عن المجرى الطبيعي إلى الفساد والخوف لمزاج سوداوي يوحش روح الدماغ، ويذكر نسبتها إلى المانيا وأن سببها في الدماغ نفسه أو من خارجه {cite:canon-ibn-sina-print-v2 p.103}"
  en: "Ibn Sina defines melancholia as a change of the opinions and thought from their natural course into corruption and fear, from a black-bile temperament that frightens the pneuma of the brain; he relates it to mania and says its cause lies in the brain itself or outside it {cite:canon-ibn-sina-print-v2 p.103}"
  ur: "ابن سینا مالنخولیا کو یوں بیان کرتا ہے کہ گمان اور فکر اپنی فطری راہ سے ہٹ کر فساد اور خوف کی طرف چلے جاتے ہیں، سوداوی مزاج کی وجہ سے جو دماغ کی روح کو وحشت زدہ کرتا ہے؛ وہ اسے مانیا سے نسبت دیتا ہے اور کہتا ہے کہ اس کا سبب دماغ ہی میں ہے یا اس سے باہر {cite:canon-ibn-sina-print-v2 p.103}۔"
