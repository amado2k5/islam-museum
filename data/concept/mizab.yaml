id: concept/mizab
class: concept
kind: legal
label: { ar: "المِيزَاب", en: "The roof spout (mizab) and the rulings on it", ur: "پرنالہ (میزاب) اور اس کے احکام" }
summary:
  ar: "الميزاب قناة أو أنبوبة يصرف بها الماء من سطح بناء أو موضع عال. وأجاز جمهور الفقهاء إخراجه إلى الطريق الأعظم، واستدلوا بقضية عمر مع العباس، ومنع الحنابلة ذلك إلا بإذن الإمام. وفي الخصومة في إخراجه ورفعه وفي حق إجراء مائه خلاف بين الحنفية وغيرهم. ويجزئ الوضوء والغسل بماء الميزاب إذا وصل الماء إلى الشعر والبشرة مع النية عند الجمهور. وإذا سقط الميزاب المخرج إلى الطريق على إنسان فأتلفه فعليه الضمان عند جمهور الفقهاء، مع تفصيل عند الحنفية والشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15364} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15365} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15366} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15367} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15368}"
  en: "A roof spout (mizab) is a pipe that carries water off a roof or a high place. Most jurists allow a spout to project onto the main road, citing the case of Umar and al-Abbas; the Hanbalis forbid it without the imam's leave. The jurists differ on who may dispute its projection, its removal, and the right to its flow. Purification with water from a spout is valid, most jurists hold, when the water reaches hair and skin with intention. If a projecting spout falls on a person and kills or injures him, most jurists hold the spout's owner liable, with distinctions among the Hanafis and Shafi'is. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15364} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15365} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15366} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15367} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15368}"
  ur: "پرنالہ وہ نالی یا نلکی ہے جس سے کسی چھت یا بلند جگہ سے پانی بہایا جائے۔ جمہور کے نزدیک اسے عام راستے کی طرف نکالنا جائز ہے، جبکہ حنابلہ امام کی اجازت کے بغیر منع کرتے ہیں۔ پرنالے کے پانی سے وضو اور غسل کا جواز، اور اس کے گرنے سے ضمان کے احکام میں فقہاء کا اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15364} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15365} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15367}"
