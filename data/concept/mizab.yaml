label: { ar: "المِيزَاب", en: "The roof spout (mizab) and the rulings on it", ur: "پرنالہ ⁦(میزاب)⁩ اور اس کے احکام", es: "El desagüe del tejado (mizab) y las normas que lo rigen.", fr: "La gouttière (mizab) et les règles qui s'y rapportent", tr: "Oluk", id: "Talang" }
summary:
  ar: "الميزاب قناة أو أنبوبة يصرف بها الماء من سطح بناء أو موضع عال. وأجاز جمهور الفقهاء إخراجه إلى الطريق الأعظم، واستدلوا بقضية عمر مع العباس، ومنع الحنابلة ذلك إلا بإذن الإمام. وفي الخصومة في إخراجه ورفعه وفي حق إجراء مائه خلاف بين الحنفية وغيرهم. ويجزئ الوضوء والغسل بماء الميزاب إذا وصل الماء إلى الشعر والبشرة مع النية عند الجمهور. وإذا سقط الميزاب المخرج إلى الطريق على إنسان فأتلفه فعليه الضمان عند جمهور الفقهاء، مع تفصيل عند الحنفية والشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15364} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15365} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15366} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15367} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15368}"
  en: "A roof spout (mizab) is a pipe that carries water off a roof or a high place. Most jurists allow a spout to project onto the main road, citing the case of Umar and al-Abbas; the Hanbalis forbid it without the imam's leave. The jurists differ on who may dispute its projection, its removal, and the right to its flow. Purification with water from a spout is valid, most jurists hold, when the water reaches hair and skin with intention. If a projecting spout falls on a person and kills or injures him, most jurists hold the spout's owner liable, with distinctions among the Hanafis and Shafi'is. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15364} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15365} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15366} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15367} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15368}"
  ur: "پرنالہ وہ نالی یا نلکی ہے جس سے کسی چھت یا بلند جگہ سے پانی بہایا جائے۔ جمہور کے نزدیک اسے عام راستے کی طرف نکالنا جائز ہے، جبکہ حنابلہ امام کی اجازت کے بغیر منع کرتے ہیں۔ پرنالے کے پانی سے وضو اور غسل کا جواز، اور اس کے گرنے سے ضمان کے احکام میں فقہاء کا اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15364} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15365} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15367}"
  es: "Un desagüe de techo (mizab) es una tubería que conduce el agua de lluvia desde un tejado o un lugar elevado. La mayoría de los juristas permiten que un desagüe sobresalga hacia la vía principal, citando el caso de Umar y al-Abbas; los hanbalíes lo prohíben sin el permiso del imán. Los juristas difieren en cuanto a quién puede disputar su proyección, su remoción y el derecho al flujo del agua. La purificación con agua de un desagüe es válida, según la mayoría de los juristas, cuando el agua entra en contacto con el cabello y la piel con intención. Si un desagüe que sobresale cae sobre una persona y la mata o la hiere, la mayoría de los juristas responsabilizan al propietario del desagüe, con distinciones entre los hanafíes y los shafiíes. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15364} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15365} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15366} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15367} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15368}"
  fr: "Une gouttière (mizab) est un tuyau permettant d'évacuer l'eau d'un toit ou d'un lieu élevé. La plupart des juristes autorisent sa présence sur la voie publique, se référant aux cas d'Umar et d'al-Abbas; les hanbalites l'interdisent sans l'autorisation de l'imam. Les juristes divergent quant aux personnes habilitées à contester sa présence, son retrait et le droit à l'eau qui s'écoule. La purification par l'eau d'une gouttière est valable, selon la plupart des juristes, lorsque l'eau entre en contact avec les cheveux et la peau intentionnellement. Si une gouttière tombe sur une personne et la tue ou la blesse, la plupart des juristes tiennent le propriétaire de la gouttière pour responsable, avec des distinctions entre les écoles hanafite et chaféite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15364} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15365} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15366} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15367} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15368}"
  tr: "Misbah, bir binanın veya yüksek bir yerin çatısından suyun boşaltıldığı bir kanal veya borudur. Hukukçuların çoğu, Abbas ile Ömer vakasını örnekleyerek suyun büyük yola çıkarılmasına izin vermiştir ve Hanbaliler bunu ancak İmam izni olmadan yasaklardı. Hanafiyler ile diğerleri arasında, suyun çıkarılması ve kaldırılması ile suyun kullanım hakkı konusunda anlaşmazlık vardır. Misbah'tan gelen su ile birlikte wudu ve ghusl, su saç ve deriye niyetle ulaşırsa çoğunluğa göre yeterlidir. Yolda kullanılan gider bir kişinin üzerine düşer ve zarar verirse, kişi çoğunluk hukukçulara göre sorumludur; ayrıntılar ise Hanafi ve Şafiilere göre geçerlidir. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.15364} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15365} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15366} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15367} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15368}"
  id: "Misbah adalah saluran atau pipa yang dialirkan air dari atap bangunan atau tempat tinggi. Mayoritas ahli hukum mengizinkan air tersebut dialihkan ke jalan yang lebih besar, dengan alasan kasus Umar dengan Abbas, dan Hanbal melarang hal ini kecuali dengan izin Imam. Ada perbedaan pendapat antara Hanafi dan lainnya mengenai perselisihan tentang pengambilan dan pengangkatan, serta hak menggunakan airnya. Wudu dan ghusl dengan air dari misbah sudah cukup jika air mencapai rambut dan kulit dengan niat menurut mayoritas. Jika saluran pembuangan yang digunakan untuk jalan jatuh menimpa seseorang dan merusaknya, orang tersebut bertanggung jawab menurut mayoritas ahli hukum, dengan rincian menurut Hanafi dan Shafi'i. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15364} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15365} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15366} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15367} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15368}"
