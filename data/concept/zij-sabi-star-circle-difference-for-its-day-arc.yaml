label: { ar: "اختلاف دائرة الكوكب في حساب قوس نهاره", en: "The difference of a star's circle in finding its day arc", ur: "ستارے کے دائرے کا اختلاف اور اس کی قوسِ نہار", es: "La diferencia del círculo de una estrella al calcular su arco diurno", fr: "La différence du cercle d'une étoile dans la recherche de son arc diurne" }
summary:
  ar: "يبدأ الباب التاسع عشر بمعرفة قوس نهار أي كوكب في كل بلد، وهو ما يطلع من فلك معدل النهار منذ طلوع الكوكب إلى غروبه. وأول الخطوات اختلاف يخرج من ضرب وتر بعد الكوكب عن معدل النهار في وتر عرض البلد، ثم القسمة على وتر تمام عرض البلد، ثم الضرب في نصف القطر والقسمة على وتر تمام بعد الكوكب، وقوس الناتج هو الاختلاف المطلوب. {cite:zij-sabi-nallino-byblion pp.52-53}."
  en: "Chapter 19 teaches how to find the day arc of any star in any place, meaning the part of the equator's circle that rises from the star's rising to its setting. The first step is a difference obtained by multiplying the chord of the star's distance from the equator by the chord of the latitude of the place, dividing by the chord of the complement of the latitude, multiplying by the radius and dividing by the chord of the complement of the star's distance; the arc of the result is the difference sought. {cite:zij-sabi-nallino-byblion pp.52-53}."
  ur: "انیسویں باب میں کسی بھی شہر میں کسی بھی ستارے کی قوسِ نہار معلوم کرنے کا طریقہ ہے، یعنی معدل النہار کے دائرے کا وہ حصہ جو ستارے کے طلوع سے غروب تک اٹھتا ہے۔ پہلا قدم ایک اختلاف ہے جو ستارے کے معدل النہار سے بعد کے وتر کو شہر کے عرض کے وتر سے ضرب دے کر، عرض کے تمام کے وتر پر تقسیم کر کے، نصف قطر سے ضرب دے کر اور ستارے کے بعد کے تمام کے وتر پر تقسیم کر کے نکلتا ہے؛ نتیجے کی قوس مطلوبہ اختلاف ہے۔ {cite:zij-sabi-nallino-byblion pp.52-53}۔"
  es: "El capítulo 19 enseña cómo hallar el arco diurno de cualquier estrella en cualquier lugar, es decir, la parte del círculo ecuatorial que se extiende desde el oriente de la estrella hasta su ocaso. El primer paso consiste en calcular la diferencia multiplicando la cuerda de la distancia de la estrella al ecuador por la cuerda de la latitud del lugar, dividiendo el resultado por la cuerda del complemento de la latitud, multiplicando por el radio y dividiendo nuevamente por la cuerda del complemento de la distancia de la estrella; el arco resultante es la diferencia buscada. {cite:zij-sabi-nallino-byblion pp.52-53}."
  fr: "Le chapitre 19 explique comment calculer l'arc diurne d'une étoile quelconque en un lieu donné, c'est-à-dire la portion du cercle équatorial qui s'élève entre le lever et le coucher de l'étoile. La première étape consiste à calculer la différence en multipliant la corde reliant l'étoile à l'équateur par la corde correspondant à la latitude du lieu, en divisant par la corde du complémentaire de la latitude, en multipliant ensuite par le rayon et en divisant par la corde du complémentaire de la distance à l'étoile; l'arc ainsi obtenu correspond à la différence recherchée. {cite:zij-sabi-nallino-byblion pp.52-53}."
