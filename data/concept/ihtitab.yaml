summary:
  ar: "الاحتطاب جمع الحطب، وحكمه التكليفي كحكم الاحتشاش، غير أنه يخالفه في أمرين: يباح قطع الإذخر والعوسج في الحرم في الاحتشاش دون الاحتطاب، وأجاز بعض العلماء علف الدواب في الاحتشاش دون الاحتطاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1732}"
  en: "Ihtitab is gathering firewood. Its legal ruling is that of ihtishash, but it differs on two points: cutting idhkhir and the 'awsaj inside the sanctuary is allowed for grass but not for wood, and some allow grass to feed animals but not wood. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1732}"
