label: { ar: "احتطاب", en: "Gathering firewood (ihtitab)", es: "Recoger leña (ihtitab)", fr: "Ramasser du bois de chauffage (ihtitab)", ur: "لکڑیاں جمع کرنا ⁦(احتیاط)⁩" }
summary:
  ar: "الاحتطاب جمع الحطب، وحكمه التكليفي كحكم الاحتشاش، غير أنه يخالفه في أمرين: يباح قطع الإذخر والعوسج في الحرم في الاحتشاش دون الاحتطاب، وأجاز بعض العلماء علف الدواب في الاحتشاش دون الاحتطاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1732}"
  en: "Ihtitab is gathering firewood. Its legal ruling is that of ihtishash, but it differs on two points: cutting idhkhir and the 'awsaj inside the sanctuary is allowed for grass but not for wood, and some allow grass to feed animals but not wood. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1732}"
  es: "Ihtitab es la recolección de leña. Su norma legal es la de ihtishash, pero difiere en dos puntos: cortar idhkhir y el 'awsaj dentro del santuario está permitido para obtener hierba, pero no para madera, y algunos permiten que la hierba alimente a los animales, pero no la madera. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1732}"
  fr: "L'ihtitab consiste à ramasser du bois de chauffage. Son statut juridique est celui de l'ihtishash, mais il diffère sur deux points: la coupe de l'idhkhir et de l'awsaj à l'intérieur du sanctuaire est autorisée pour l'herbe, mais pas pour le bois; et certains autorisent l'herbe pour nourrir les animaux, mais pas le bois. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1732}"
  ur: "احطاب لکڑیاں اکٹھا کر رہا ہے۔ اس کا شرعی حکم احتشاش کا ہے، لیکن اس میں دو باتوں سے اختلاف ہے: احد کو کاٹنا اور حرم کے اندر عوسج کو گھاس کے لیے جائز ہے لیکن لکڑی کے لیے نہیں، اور کچھ لوگ گھاس کو جانوروں کو کھلانے کی اجازت دیتے ہیں لیکن لکڑی نہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص1732}"
