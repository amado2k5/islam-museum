perspectives:
  - tradition: sunni
    id: sunni-khatib
    standing: main
    stance: { ar: "الصحابة كلهم عدول، لا يحتاجون إلى تعديل أحد", en: "All the Companions are of probity and need no one's vindication" }
    summary:
      ar: "الخطيب البغدادي: عدالتهم ثابتة معلومة بتعديل الله لهم وإخباره عن طهارتهم، وبثناء النبي عليهم، ولو لم يرد فيهم شيء لأوجبت حالهم من الهجرة والجهاد والنصرة القطع بعدالتهم؛ ولا تسقط إلا بثبوت ارتكاب ما لا يحتمل إلا قصد المعصية، وقد برأهم الله من ذلك؛ وما جرى بينهم من القتال محمول على التأويل والاجتهاد. وينقل عن أبي زرعة الرازي أن من ينتقص أحداً منهم إنما يريد أن يجرح شهود الكتاب والسنة."
      en: "Al-Khatib al-Baghdadi: their probity is established and known by God's vindication and His telling of their purity, and by the Prophet's praise; even without this, their emigration, struggle and support would require certainty of their probity; it would fall only on proof of an act that admits no reading but intended sin, from which God has cleared them; the fighting among them is understood as interpretation and independent judgement. He reports Abu Zur'a al-Razi saying that whoever disparages any of them seeks to wound the witnesses of the Book and the Sunna."
    holders: [person/al-khatib-al-baghdadi-ahmad, person/abu-zura-al-razi]
    sources: [source/kifaya-khatib-hyderabad-1357]
  - tradition: other
    id: other-as-reported-by-khatib
    standing: other
    stance: { ar: "عدولٌ إلى وقت الحروب، ثم يُبحث عن حال من شارك فيها", en: "Of probity until the wars, after which those who took part must be examined" }
    summary:
      ar: "رأي تحكيه «الكفاية» عن طائفة يسميها الخطيب من أهل البدع: أن حال الصحابة كانت مرضية إلى وقت الحروب التي سُفكت فيها الدماء بينهم، فسقطت عدالة أهل تلك الحروب، ولما اختلطوا بأهل النزاهة وجب البحث عن الرواة منهم. لم يُعرض هنا من مصادر أصحاب هذا الرأي أنفسهم بعد."
      en: "A view that al-Kifaya reports from a group al-Khatib calls people of innovation: the Companions' state was approved until the wars in which they shed one another's blood, so those who fought lost their probity, and since they were mixed with the blameless, the transmitters among them must be examined. Not yet set out here from that group's own sources."
    sources: [source/kifaya-khatib-hyderabad-1357]
