id: concept/adalat-al-sahaba
class: concept
kind: term
label: { ar: "عدالة الصحابة", en: "The probity of the Companions ('adalat al-sahaba)" }
summary:
  ar: "أصل عند أهل السنة في علم الحديث: أن الصحابة كلهم عدول بتعديل الله ورسوله، فلا يُبحث عن عدالة الصحابي الذي يرفع الحديث إلى النبي، وإنما يُبحث عمن دونه. قرره الخطيب البغدادي في «الكفاية» واستدل له بآيات من القرآن وأحاديث في فضل القرن الأول، وبحالهم من الهجرة والجهاد والنصرة، وقال إنه مذهب كافة العلماء ومن يعتد بقوله من الفقهاء، وحكى خلاف طائفة يسميها من أهل البدع رأت سقوط عدالة من شارك في الحروب بينهم {cite:kifaya-khatib-hyderabad-1357 p. 46-49}."
  en: "A Sunni principle of hadith science: all the Companions are of established probity by the vindication of God and His Messenger, so the probity of the Companion who carries a hadith to the Prophet is not investigated, only that of those after him. Al-Khatib al-Baghdadi sets it out in al-Kifaya, citing Qur'anic verses, hadiths on the merit of the first generation, and their record of emigration, struggle and support; he calls it the position of all the scholars and of the jurists whose word counts, and reports the dissent of a group he calls people of innovation, who held that those who took part in the wars among them lost their probity."
