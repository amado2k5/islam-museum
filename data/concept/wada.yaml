summary:
  ar: "الودع هو الصدف، وهو جاذب للسلاء والشوك، ومسحوقه يقلع الثآليل المركوزة والمتعلقة. {cite:canon-ibn-sina-print-v1 p.455}"
  en: "Wada is the shell. It draws out splinters and thorns, and its powder removes embedded and hanging warts. {cite:canon-ibn-sina-print-v1 p.455}"
  ur: "ودع سیپی یعنی صدف ہے۔ یہ کانٹے اور پھانسیں کھینچتی ہے، اور اس کا سفوف جمے ہوئے اور لٹکے ہوئے مسّوں کو ہٹاتا ہے۔ {cite:canon-ibn-sina-print-v1 p.455}"
  es: "Wada es la concha. Extrae astillas y espinas, y su polvo elimina verrugas incrustadas y colgantes. {cite:canon-ibn-sina-print-v1 p.455}"
  fr: "Wada est la coquille. Elle extrait les échardes et les épines, et sa poudre enlève les verrues incrustées et pendantes. {cite:canon-ibn-sina-print-v1 p.455}"
  tr: "Birikintiler, idrar ve dikenleri çeken kabuklardır ve tozu yoğun ve yapışmış siğilleri temizler. {kaynak:kanon-ibn-sina-print-v1 s.455}"
  id: "Endapan adalah cangkang, yang menarik urin dan duri, dan bubuknya menghilangkan kutil yang terkonsentrasi dan menempel. {cite:canon-ibn-sina-print-v1 hlm.455}"
