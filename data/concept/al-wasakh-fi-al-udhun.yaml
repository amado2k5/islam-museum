label:
  ar: "الوسخ في الأذن والسدة الكائنة منه"
  en: "Dirt in the ear and the occlusion it makes"
  ur: "کان میں میل اور اس سے ہونے والا سد"
summary:
  ar: "علاج الوسخ في الأذن الخفيف تقطير ما يعرف فيها خاصة ليلاً ودخول الحمام ووضع الأذن على الأرض الحارة ليذوب الوسخ، ومنها ما يتخذ منه فتيلة ومنها ما يصب ومنها ما يذاب ويقطر، والفتائل القوية لا تستعمل إلا بعد الاستفراغ؛ وقد زعم قوم أن الكافور شديد النفع من الطرش ويشبه أن يكون للمراري، وما جرب زيت العقارب فإنه يبرئ الصمم ⁦⁦(أسماء الأدوية والفتائل ومقاديرها لا تحمل، والأقوال منقولة كأقوال منسوبة)⁩⁩ {cite:canon-ibn-sina-print-v2 p.229}"
  en: "The light treatment of ear dirt: dropping the known oil in it, especially at night, entering the bath and laying the ear on the hot ground so the dirt melts; some is made into tents, some poured, some dissolved and dropped — the strong tents are used only after evacuation. Some have claimed camphor is strongly beneficial in hardness of hearing, likely for the bilious kind; scorpion oil, when tried, cures deafness ⁦(drug and tent names and measures are not carried; the sayings are transmitted as attributed)⁩ {cite:canon-ibn-sina-print-v2 p.229}"
  ur: "کان کی میل کا ہلکا علاج: اس میں معروف تیل ٹپکانا خصوصاً رات میں، حمام میں جانا اور کان کو گرم زمین پر رکھنا تاکہ میل پگھل جائے؛ بعض سے فتیلہ بنایا جاتا ہے، بعض ڈالا جاتا ہے، بعض گھول کر ٹپکایا جاتا ہے — اور قوی فتیلے صرف استفراغ کے بعد استعمال ہوتے ہیں؛ اور بعض لوگوں نے کہا کہ کافور سختی سماعت میں نہایت مفید ہے اور غالباً مراری کے لیے ہے؛ اور بچھو کا تیل آزمانے پر بہرہ پن شفا دیتا ہے ⁦⁦(ادویہ اور فتیلوں کے نام اور مقدار منقول نہیں؛ اقوال منسوب کے طور پر منقول)⁩⁩ {cite:canon-ibn-sina-print-v2 p.229}"
