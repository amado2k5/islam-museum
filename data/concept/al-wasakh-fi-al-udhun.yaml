id: "concept/al-wasakh-fi-al-udhun"
class: "concept"
kind: "scientific"
label:
  ar: "الوسخ في الأذن والسدة الكائنة منه"
  en: "Dirt in the ear and the occlusion it makes"
  fr: "Dépôt dans l’oreille et obstruction qui en résulte"
  ur: "کان میں میل اور اس سے ہونے والا سد"
  es: "Suciedad en el oído y la obstrucción que produce."
  tr: "Kulaktaki kir ve ondan çıkan tıkaç"
  id: "Lilin telinga dan sumbat keluar dari situ"
summary:
  ar: "علاج الوسخ في الأذن الخفيف تقطير ما يعرف فيها خاصة ليلاً ودخول الحمام ووضع الأذن على الأرض الحارة ليذوب الوسخ، ومنها ما يتخذ منه فتيلة ومنها ما يصب ومنها ما يذاب ويقطر، والفتائل القوية لا تستعمل إلا بعد الاستفراغ؛ وقد زعم قوم أن الكافور شديد النفع من الطرش ويشبه أن يكون للمراري، وما جرب زيت العقارب فإنه يبرئ الصمم ⁦⁦(أسماء الأدوية والفتائل ومقاديرها لا تحمل، والأقوال منقولة كأقوال منسوبة)⁩⁩ {cite:canon-ibn-sina-print-v2 p.229}"
  en: "The light treatment of ear dirt: dropping the known oil in it, especially at night, entering the bath and laying the ear on the hot ground so the dirt melts; some is made into tents, some poured, some dissolved and dropped — the strong tents are used only after evacuation. Some have claimed camphor is strongly beneficial in hardness of hearing, likely for the bilious kind; scorpion oil, when tried, cures deafness ⁦(drug and tent names and measures are not carried; the sayings are transmitted as attributed)⁩ {cite:canon-ibn-sina-print-v2 p.229}"
  fr: "Le traitement doux décrit dans le Canon consiste à instiller l’huile connue dans l’oreille, surtout la nuit, puis à entrer au bain et à poser l’oreille contre le sol chaud pour faire fondre le dépôt. Certains remèdes se préparent en mèches, d’autres se versent, d’autres encore se dissolvent avant d’être instillés. Les mèches fortes ne s’emploient qu’après évacuation. Certains ont prétendu que le camphre était très bénéfique en cas de surdité, probablement de type bilieux, et que l’huile de scorpion avait guéri la surdité à l’essai (les noms et les doses des remèdes et des mèches ne sont pas repris ; ces dires sont rapportés avec leur attribution) {cite:canon-ibn-sina-print-v2 p.229}"
  ur: "کان کی میل کا ہلکا علاج: اس میں معروف تیل ٹپکانا خصوصاً رات میں، حمام میں جانا اور کان کو گرم زمین پر رکھنا تاکہ میل پگھل جائے؛ بعض سے فتیلہ بنایا جاتا ہے، بعض ڈالا جاتا ہے، بعض گھول کر ٹپکایا جاتا ہے — اور قوی فتیلے صرف استفراغ کے بعد استعمال ہوتے ہیں؛ اور بعض لوگوں نے کہا کہ کافور سختی سماعت میں نہایت مفید ہے اور غالباً مراری کے لیے ہے؛ اور بچھو کا تیل آزمانے پر بہرہ پن شفا دیتا ہے ⁦⁦(ادویہ اور فتیلوں کے نام اور مقدار منقول نہیں؛ اقوال منسوب کے طور پر منقول)⁩⁩ {cite:canon-ibn-sina-print-v2 p.229}"
  es: "El tratamiento ligero para la suciedad del oído: dejar caer el aceite conocido, especialmente por la noche, entrar en el baño y apoyar el oído sobre el suelo caliente para que la suciedad se derrita; parte se usa para hacer compresas, parte se vierte, parte se disuelve y se deja caer; las compresas resistentes se usan solo después de la evacuación. Algunos han afirmado que el alcanfor es muy beneficioso para la sordera, probablemente de tipo biliar; el aceite de escorpión, cuando se prueba, cura la sordera (no se conservan los nombres de los medicamentos ni de las compresas; los dichos se transmiten tal como se atribuyen) {cite:canon-ibn-sina-print-v2 p.229}"
  tr: "Hafif kulaktaki kir tedavisi, özellikle gece bilinenin damıtılması, banyoya girilmesi ve kulağın sıcak zemine konarak toprağın çözülmesini içerir. Bazı fitil kullanılır, bazıları dökülür, bazıları çözülür ve damlatılır. Güçlü fitiller sadece kusma sonrası kullanılır; bazıları kafurun sağır için çok faydalı olduğunu ve safra kesesi yağına benzediğini iddia etmiştir. Akrep yağını deneyen kişi sağırlığı iyileştirir (ilaç ve fitil isimleri kabul edilmez, görüşler atfedilenler gibi aktarılır) {atıf:kanon-ibn-sina-print-v2 s.229}"
  id: "Perlakuan kotoran telinga ringan melibatkan distilasi apa yang diketahui terutama di malam hari, mandi, dan meletakkan telinga di permukaan hangat untuk melarutkan tanah. Beberapa supositoria digunakan, beberapa digugurkan, beberapa dicairkan dan diteteskan. Supositoria kuat hanya digunakan setelah muntah; beberapa mengklaim bahwa kamper sangat bermanfaat bagi orang tuli dan menyerupai minyak kantong empedu. Seseorang yang mencoba minyak kalajengking menyembuhkan tuli (nama obat dan supositoria tidak diterima, pendapat disampaikan sebagai atribusi) {kutipan: kanon-ibn-sina-print-v2 hlm.229}"
