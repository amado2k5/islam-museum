label:
  ar: "النفخ في الصور"
  en: "The Trumpet blasts"
  ur: "صور میں پھونک"
summary:
  ar: "نفخ إسرافيل في الصور نفختين: نفخة الفزع والصعق فصعق من في السماوات ومن في الأرض إلا من شاء الله، ثم نفخة البعث فإذا هم من الأجداث إلى ربهم ينسلون {cite:sahih-muslim} {cite:tafsir-ibn-kathir}."
  en: "Israfil's two blasts on the Trumpet: the blast of terror and swooning — all in the heavens and earth swoon save whom God wills — then the blast of resurrection, and they slip from the graves to their Lord {cite:sahih-muslim} {cite:tafsir-ibn-kathir}."
  ur: "اسرافیل کا صور میں دو بار پھونکنا: فزع اور بے ہوشی کی پھونک جس سے زمین و آسمان والے بیہوش ہوں، پھر بعث کی پھونک جس پر لوگ قبروں سے اپنے رب کی طرف دوڑیں {cite:sahih-muslim} {cite:tafsir-ibn-kathir}۔"
