id: concept/nafkhat-as-sur
class: concept
kind: belief
label:
  ar: "النفخ في الصور"
  en: "The Trumpet blasts"
  ur: "صور میں پھونک"
  es: "La trompeta suena"
  fr: "La trompette retentit"
  tr: "Fotoğrafları üfleme"
  id: "Meniup gambar"
summary:
  ar: "نفخ إسرافيل في الصور نفختين: نفخة الفزع والصعق فصعق من في السماوات ومن في الأرض إلا من شاء الله، ثم نفخة البعث فإذا هم من الأجداث إلى ربهم ينسلون {cite:sahih-muslim} {cite:tafsir-ibn-kathir}."
  en: "Israfil's two blasts on the Trumpet: the blast of terror and swooning — all in the heavens and earth swoon save whom God wills — then the blast of resurrection, and they slip from the graves to their Lord {cite:sahih-muslim} {cite:tafsir-ibn-kathir}."
  ur: "اسرافیل کا صور میں دو بار پھونکنا: فزع اور بے ہوشی کی پھونک جس سے زمین و آسمان والے بیہوش ہوں، پھر بعث کی پھونک جس پر لوگ قبروں سے اپنے رب کی طرف دوڑیں {cite:sahih-muslim} {cite:tafsir-ibn-kathir}۔"
  es: "Los dos toques de trompeta de Israfil: el toque de terror y desmayo —todos en los cielos y en la tierra se desmayan salvo quien Dios quiere— luego el toque de resurrección, y se deslizan de las tumbas a su Señor {cite:sahih-muslim} {cite:tafsir-ibn-kathir}."
  fr: "Les deux coups de trompette d'Israfil: le coup de terreur et d'évanouissement — tous dans les cieux et sur la terre s'évanouissent sauf ceux que Dieu veut — puis le coup de résurrection, et ils glissent des tombes vers leur Seigneur {cite:sahih-muslim} {cite:tafsir-ibn-kathir}."
  tr: "İsrail'in borazanı çalması ikidir: korku ve şok, göklerde ve yeryüzünde olanlara, Allah istediği hariç, sonra diriliş esprisi geldi ve işte onlar Rabbilerinin atalarından geldiler {cite:sahih-muslim} {cite:tafsir-ibn-kathir}."
  id: "Tiupan terompet oleh Israfil ada dua: ledakan teror dan kejutan, sehingga ia mengenai siapa pun yang di langit dan siapa pun yang ada di bumi kecuali yang Allah kehendaki, lalu tiupan kebangkitan, dan lihatlah, mereka berasal dari leluhur Tuhan mereka {cite:sahih-muslim} {cite:tafsir-ibn-kathir}."
