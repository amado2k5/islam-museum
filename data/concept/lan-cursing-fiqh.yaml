id: concept/lan-cursing-fiqh
class: concept
kind: legal
label:
  ar: "اللَّعْن"
  en: "Cursing (la'n), fiqh rulings"
  ur: "لعنت (فقہی احکام)"
summary:
  ar: "اللعن في اللغة الإبعاد والطرد من الخير، وقيل الطرد والإبعاد من الله، ومن الخلق السب والدعاء، وكانت العرب تحيي ملوكها بقولها «أبيت اللعن»، أي أبيت أن تأتي ما تُلعن عليه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13643}. والسب شتم الغير مشافهة بما يكره، وقال العز بن عبد السلام إن اللعن أبلغ في القبح من السب المطلق {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13643} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13644}."
  en: "La'n, in lexicon, is expulsion and removal from good, or from God, and from people it is abuse and invocation; the Arabs used to greet their kings with abaytu l-la'n, you have refused what would bring you a curse. Sabb is abuse by direct speech of what is disliked, and al-Izz ibn Abd al-Salam held that cursing is stronger in ugliness than general abuse {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13643} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13644}."
  ur: "لعن لغت میں دور کرنے اور خیر سے محروم کرنے کو کہتے ہیں، اور بعض کے نزدیک اللہ کی طرف سے دور کرنا، اور مخلوق کی طرف سے گالی اور بددعا؛ عرب اپنے بادشاہوں کو یوں سلام کرتے تھے «أبيت اللعن»، یعنی آپ اس چیز سے انکار کریں جس پر لعنت ہو۔ سب کسی کو منہ پر ناپسندیدہ بات کہنا ہے، اور عز بن عبد السلام کے نزدیک لعنت مطلق سب سے زیادہ قبیح ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13643} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13644}۔"
