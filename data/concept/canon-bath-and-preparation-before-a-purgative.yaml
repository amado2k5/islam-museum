id: concept/canon-bath-and-preparation-before-a-purgative
class: concept
kind: scientific
label:
  ar: "الحمام والإعداد قبل المسهل عند ابن سينا"
  en: "The bath and preparation before a purgative in the Canon"
  fr: "Bain et préparation avant purgatif dans le Canon"
  ur: "مسہل سے پہلے حمام اور تیاری قانون میں"
  es: "El baño y la preparación antes de un purgante en el Canon"
  tr: "İbn Sina'ya göre Eserden önce banyo ve hazırlık"
  id: "Mandi dan persiapan sebelum easer menurut Ibn Sina"
summary:
  ar: "يقرر ابن سينا أن لين الطبيعة قبل الإسهال قانون جيد فيه أمان إلا فيمن هو شديد الاستعداد للذرب، وأن الحمام قبل المسهل بأيام ملطف ومن المعدات الجيدة، ولا يدخل الحمام بعد الدواء لأنه يجذب المادة إلى الخارج فيصلح لحبس الإسهال لا للمعونة عليه {cite:canon-ibn-sina-print-v1 p.279}."
  en: "Ibn Sina sets down that softening nature before purging is a good rule that brings safety, except for someone strongly inclined to loose flux, that a bath some days before the purgative thins the humour and is a good preparation, and that the bath is not entered after the drug, since it draws matter outward and so serves to stop purging rather than help it {cite:canon-ibn-sina-print-v1 p.279}."
  fr: "Ibn Sina juge l’assouplissement de la nature avant purge généralement sûr, sauf forte tendance aux flux relâchés. Le bain quelques jours avant fluidifierait l’humeur et préparerait bien ; après le remède, il attirerait la matière vers l’extérieur, arrêtant la purge plutôt que l’aidant {cite:canon-ibn-sina-print-v1 p.279}."
  es: "Ibn Sina establece que suavizar la naturaleza antes de la purga es una buena regla que brinda seguridad, excepto para alguien con una fuerte tendencia a perder flujo, que un baño unos días antes del purgante diluye el humor y es una buena preparación, y que no se debe entrar al baño después del medicamento, ya que extrae la materia hacia afuera y, por lo tanto, sirve para detener la purga en lugar de ayudarla {cite:canon-ibn-sina-print-v1 p.279}."
  ur: "ابن سینا نے بیان کیا ہے کہ صاف کرنے سے پہلے نرمی کی فطرت ایک اچھا قاعدہ ہے جو حفاظت کا باعث ہے، سوائے اس کے کہ جو ڈھیلے بہاؤ کی طرف مائل ہو، یہ کہ طہارت سے کچھ دن پہلے غسل مزاح کو کم کرتا ہے اور ایک اچھی تیاری ہے، اور یہ کہ دوائی کے بعد غسل داخل نہیں ہوتا ہے، کیونکہ یہ مادے کو باہر کی طرف کھینچتا ہے اور اس سے اسے صاف کرنے سے روکنے میں مدد ملتی ہے۔ {حوالہ: کینن ابن سینا پرنٹ v1 صفحہ 279}۔"
  tr: "İbn Sina, ishal öncesi doğayı yumuşatmanın iyi bir kural olduğunu, boşalmaya çok hazır olanlar dışında güvenli olduğunu ve müshil kullanmadan önce güvercinlerin yatıştırıcı ve iyi donanımlı olduğunu belirtir. İlaçtan sonra güvercinlere girilmemelidir çünkü madde dışa doğru çekilir, böylece ishalin kontrolü için uygun olur, yardımcı olmaz {cite:canon-ibn-sina-print-v1 s.279}."
  id: "Ibn Sina menyatakan bahwa melunakkan sifat sebelum diare adalah aturan yang baik dan aman kecuali bagi mereka yang sangat siap untuk ejakulasi, dan merpati sebelum pencahar menenangkan serta dilengkapi dengan baik. Merpati tidak boleh dimasukkan setelah diobat karena hal itu menarik zat keluar, sehingga cocok untuk menahan diare, bukan membantu {cite:canon-ibn-sina-print-v1 hlm.279}."
