label: { ar: "الحمام والإعداد قبل المسهل عند ابن سينا", en: "The bath and preparation before a purgative in the Canon", ur: "مسہل سے پہلے حمام اور تیاری قانون میں" }
summary:
  ar: "يقرر ابن سينا أن لين الطبيعة قبل الإسهال قانون جيد فيه أمان إلا فيمن هو شديد الاستعداد للذرب، وأن الحمام قبل المسهل بأيام ملطف ومن المعدات الجيدة، ولا يدخل الحمام بعد الدواء لأنه يجذب المادة إلى الخارج فيصلح لحبس الإسهال لا للمعونة عليه {cite:canon-ibn-sina-print-v1 p.279}."
  en: "Ibn Sina sets down that softening nature before purging is a good rule that brings safety, except for someone strongly inclined to loose flux, that a bath some days before the purgative thins the humour and is a good preparation, and that the bath is not entered after the drug, since it draws matter outward and so serves to stop purging rather than help it {cite:canon-ibn-sina-print-v1 p.279}."
