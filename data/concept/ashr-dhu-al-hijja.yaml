label:
  ar: "عشر ذي الحجة"
  en: "The first ten days of Dhu al-Hijja"
  ur: "ذوالحجہ کے پہلے دس دن"
summary:
  ar: "عشر ذي الحجة هو العدد الذي يبدأ من أول الشهر إلى العاشر منه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11625}. وذهب الفقهاء إلى أن أيامها ولياليها أيام شريفة مفضلة يضاعف فيها العمل، ويستحب فيها الاجتهاد في العبادة وفعل الخير، وهي أفضل أيام السنة لما ورد في الحديث، ويرى جمهور المفسرين أن المقصود بالقسم في سورة الفجر هذه العشر {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11625}. ويستحب صيام التسع الأول منها دون العاشر، وهو يوم النحر الذي لا يجوز صيامه باتفاق {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11625}. ويستحب صوم يوم عرفة لغير الحاج، والجمهور يرون أنه يكفر الصغائر دون الكبائر {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11625} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11626}."
  en: "The first ten days of Dhu al-Hijja are the period from the first of the month to its tenth day {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11625}. The jurists hold that its days and nights are noble and that deeds done in them are multiplied; striving in worship and doing good are recommended, and the most scholars of Qur'anic commentary take the oath in the Surat al-Fajr to refer to these days {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11625}. Fasting the first nine days is recommended; fasting on the tenth, the day of sacrifice, is not permitted by agreement {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11625}. Fasting on the day of Arafat is recommended for those who are not pilgrims, and the majority hold that it expiates minor sins but not major ones {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11625} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11626}."
