id: concept/ashr-dhu-al-hijja
class: concept
kind: legal
label:
  ar: "عشر ذي الحجة"
  en: "The first ten days of Dhu al-Hijja"
  fr: "Les dix premiers jours de Dhu al-Hijja"
  ur: "ذوالحجہ کے پہلے دس دن"
  es: "Los primeros diez días de Dhu al-Hijja"
summary:
  ar: "عشر ذي الحجة هو العدد الذي يبدأ من أول الشهر إلى العاشر منه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11625}. وذهب الفقهاء إلى أن أيامها ولياليها أيام شريفة مفضلة يضاعف فيها العمل، ويستحب فيها الاجتهاد في العبادة وفعل الخير، وهي أفضل أيام السنة لما ورد في الحديث، ويرى جمهور المفسرين أن المقصود بالقسم في سورة الفجر هذه العشر {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11625}. ويستحب صيام التسع الأول منها دون العاشر، وهو يوم النحر الذي لا يجوز صيامه باتفاق {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11625}. ويستحب صوم يوم عرفة لغير الحاج، والجمهور يرون أنه يكفر الصغائر دون الكبائر {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11625} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11626}."
  en: "The first ten days of Dhu al-Hijja are the period from the first of the month to its tenth day {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11625}. The jurists hold that its days and nights are noble and that deeds done in them are multiplied; striving in worship and doing good are recommended, and the most scholars of Qur'anic commentary take the oath in the Surat al-Fajr to refer to these days {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11625}. Fasting the first nine days is recommended; fasting on the tenth, the day of sacrifice, is not permitted by agreement {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11625}. Fasting on the day of Arafat is recommended for those who are not pilgrims, and the majority hold that it expiates minor sins but not major ones {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11625} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11626}."
  fr: "Les dix premiers jours de Dhu al-Hijja vont du premier au dixième jour du mois {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11625}. Les juristes estiment que leurs jours et leurs nuits sont nobles et que les œuvres y voient leur récompense multipliée ; l’effort dans le culte et la bienfaisance sont recommandés, et la plupart des exégètes rapportent à ces jours le serment de la sourate al-Fajr {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11625}. Jeûner les neuf premiers jours est recommandé ; jeûner le dixième, jour du sacrifice, est unanimement interdit {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11625}. Le jeûne du jour d’Arafat est recommandé aux non-pèlerins ; la majorité estime qu’il expie les péchés mineurs, non les majeurs {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11625} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11626}."
  es: "Los primeros diez días de Dhu al-Hijja son el período desde el primer día del mes hasta el décimo {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11625}. Los juristas sostienen que sus días y noches son nobles y que las obras realizadas en ellos se multiplican; se recomienda esforzarse en la adoración y hacer el bien, y la mayoría de los eruditos de la exégesis coránica juran en la Sura al-Fajr referirse a estos días {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11625}. Se recomienda ayunar los primeros nueve días; ayunar el décimo, el día del sacrificio, no está permitido por acuerdo {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11625}. Se recomienda ayunar el día de Arafat a quienes no son peregrinos, y la mayoría sostiene que expía los pecados menores pero no los mayores {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11625} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11626}."
  ur: "ذی الحجہ کے پہلے دس دن مہینے کی پہلی تاریخ سے دسویں تاریخ تک کا عرصہ ہے فقہاء کا خیال ہے کہ اس کے دن اور راتیں بابرکت ہیں اور ان میں کیے گئے اعمال کئی گنا زیادہ ہیں۔ عبادت میں کوشش کرنے اور نیکی کرنے کی سفارش کی گئی ہے، اور تفسیر قرآن کے اکثر علماء سورۃ الفجر میں ان دنوں کا حوالہ دیتے ہیں {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 11625}۔ پہلے نو دن روزہ رکھنے کی سفارش کی جاتی ہے۔ دسویں یعنی قربانی کے دن کا روزہ معاہدے کی رو سے جائز نہیں ہے۔ عرفات کے دن کا روزہ ان لوگوں کے لیے مستحب ہے جو حاجی نہیں ہیں، اور جمہور کا خیال ہے کہ اس سے چھوٹے گناہوں کا کفارہ ہو جاتا ہے لیکن کبیرہ نہیں۔"
