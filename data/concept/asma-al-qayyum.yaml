summary:
  ar: 'القيوم: القائم بنفسه المقيم لغيره القائم على كل نفس بما كسبت. الاسم رقم 63 في التعداد الوارد في حديث الترمذي عن أسماء الله الحسنى.'
  en: al-Qayyum — The Sustainer. Name 63 in the enumeration of the most beautiful names in the Tirmidhi hadith.
  fr: "al-Qayyum — Celui qui soutient toute chose. Nom 63 dans l’énumération des plus beaux noms du hadith de Tirmidhi."
  ur: 'القيوم: قیوم — خود قائم اور دوسروں کو قائم رکھنے والا، ہر جان پر نگران۔ اسمائے حسنیٰ کی ترمذی والی گنتی میں نمبر 63۔'
  es: "al-Qayyum — El Sustentador. Nombre número 63 en la enumeración de los nombres más bellos en el hadiz de Tirmidhi."
  tr: "El-Kayyum: Kendini Sürdüren, Başkalarını Sürdüren, Kazandığı Değere Göre Her Ruhun Sürdürenidir. El-Tirmidi'nin Allah'ın İsimleri hakkındaki hadislerde adı 63."
  id: "Al-Qayyum: Penopang diri-Nya, Penopang orang lain, Penopang setiap jiwa sesuai dengan apa yang diperolehnya. Nama nomor 63 dalam daftar yang disebutkan dalam hadits Al-Tirmidhi tentang Nama-nama Allah."
