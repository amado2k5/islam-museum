label: { ar: "الصيف وأمراضه عند ابن سينا", en: "Summer and its diseases in the Canon", ur: "گرمی کا موسم اور اس کی بیماریاں قانون میں", es: "El verano y sus enfermedades en el Canon", fr: "L'été et ses maladies dans le Canon" }
summary:
  ar: "يعرض ابن سينا فعل الصيف في الأخلاط والقوة، وقصر مدد الأمراض فيه، وأمراض القيظ، وفروق الصيف الربيعي والجنوبي والشمالي {cite:canon-ibn-sina-print-v1 p.120}."
  en: "Ibn Sina sets out what summer does to the humours and the strength, why diseases run short in it, the diseases of the burning heat, and how a spring-like, a southern and a northern summer differ {cite:canon-ibn-sina-print-v1 p.120}."
  es: "Ibn Sina expone lo que el verano hace a los humores y a la fuerza, por qué las enfermedades disminuyen en él, las enfermedades del calor abrasador y en qué se diferencian un verano primaveral, uno del sur y uno del norte {cite:canon-ibn-sina-print-v1 p.120}."
  fr: "Ibn Sina décrit ce que l'été fait aux humeurs et à la force, pourquoi les maladies s'aggravent pendant cette période, les maladies de la chaleur brûlante et comment un été printanier, un été du sud et un été du nord diffèrent {cite:canon-ibn-sina-print-v1 p.120}."
  ur: "ابن سینا یہ بتاتا ہے کہ موسم گرما مزاح اور طاقت پر کیا اثر ڈالتا ہے، بیماریاں اس میں کیوں کم رہتی ہیں، جلتی ہوئی گرمی کی بیماریاں، اور موسم بہار کی طرح، جنوبی اور شمالی موسم گرما میں کیسے فرق ہوتا ہے {حوالہ: canon-ibn-sina-print-v1 p.120}۔"
