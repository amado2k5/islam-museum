label: { ar: "الجهاربغ ⁦(البستان الرباعي)⁩", en: "Chaharbagh (four-part garden)", ur: "چہار باغ", es: "Chaharbagh (jardín de cuatro partes)", fr: "Chaharbagh (jardin en quatre parties)", tr: "Al-Jaharbagh (Dört Çeyrek Bahçesi)", id: "Al-Jaharbagh (Kebun Empat Perempat)" }
summary:
  ar: "البستان الرباعي ذو القنوات المتقاطعة، عنصر إيراني أدخله بابر إلى الهند فصار إطاراً للمقابر المغولية ونموذجاً لتخطيط المدن {cite:rezavi-iranian-influence-indian-architecture-2002 p.129} {cite:rezavi-iranian-influence-indian-architecture-2002 p.130}."
  en: "The four-quartered garden with crossing water channels, an Iranian element brought to India by Babur that became the setting of Mughal tombs and a model for city planning {cite:rezavi-iranian-influence-indian-architecture-2002 p.129} {cite:rezavi-iranian-influence-indian-architecture-2002 p.130}."
  es: "El jardín dividido en cuatro cuadrantes con canales de agua que se cruzan, un elemento iraní traído a la India por Babur que se convirtió en el escenario de las tumbas mogolas y un modelo para la planificación urbana {cite:rezavi-iranian-influence-indian-architecture-2002 p.129} {cite:rezavi-iranian-influence-indian-architecture-2002 p.130}."
  fr: "Le jardin en quatre parties avec des canaux d'eau croisés, un élément iranien apporté en Inde par Babur qui est devenu le cadre des tombeaux moghols et un modèle pour l'urbanisme {cite:rezavi-iranian-influence-indian-architecture-2002 p.129} {cite:rezavi-iranian-influence-indian-architecture-2002 p.130}."
  ur: "پانی کے گزرنے والے راستوں کے ساتھ چار چوتھائی باغ، بابر کی طرف سے ہندوستان لایا گیا ایک ایرانی عنصر جو مغلوں کے مقبروں کی ترتیب اور شہر کی منصوبہ بندی کا ایک نمونہ بن گیا {حوالہ:ریزوی-ایرانی-اثر-انڈین-آرکیٹیکچر-2002 p.129}"
  tr: "Dört kanallı bahçe, Babür tarafından Hindistan'a getirilen İran unsurudur ve Babür mezarlarının çerçevesi ile kentsel planlama modeli olmuştur {cite:rezavi-iranian-influence-indian-architecture-2002 s.129} {cite:rezavi-iranian-influence-indian-architecture-2002 s.130}."
  id: "Taman empat saluran adalah elemen Iran yang diperkenalkan oleh Babur ke India, yang kemudian menjadi kerangka bagi makam Mughal dan model perencanaan kota {cite:rezavi-iranian-influence-indian-architecture-2002 hlm.129} {cite:rezavi-iranian-influence-indian-architecture-2002 hlm.130}."
