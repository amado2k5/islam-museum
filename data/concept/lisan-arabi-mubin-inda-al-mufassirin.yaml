label:
  ar: "اللسان العربي المبين عند المفسرين: معنى «مبين» في آيات النحل والشعراء"
  en: "The clear Arabic tongue in the commentators: what mubin means in the verses of al-Nahl and al-Shu'ara"
  ur: "عربی مبین کی زبان مفسرین کے ہاں: النحل اور الشعراء کی آیات میں مبین کا مفہوم"
  fr: "La langue arabe claire chez les commentateurs : le sens de mubin dans les versets d'al-Nahl et d'al-Shu'ara"
  es: "La lengua árabe clara en los comentaristas: el sentido de mubin en los versículos de al-Nahl y al-Shu'ara"
  tr: "Yorumculara göre Arapça açıktır: Arıların ve şairlerin dizelerinde \"berrak\" kelimesinin anlamı"
  id: "Bahasa Arab jelas menurut para komentator: Makna \"jelas\" dalam bait-bait lebah dan penyair"
summary:
  ar: "يفهم المفسرون كلمة مبين في قوله لسان عربي مبين اسم فاعل من أبان، أي ما هو فصيح واضح لا غموض فيه، وصفاً للوسيلة وحجة على من زعم أن بشراً أعجمياً علّم النبي. ويذكر الملخص الطبري وابن كثير والقرطبي وابن عاشور، ولكل تقريره: الطبري يجمع وضوح اللغة ووضوح الرسالة، وابن كثير يؤكد استحالة صدور هذه الفصاحة عن أعجمي، وابن عاشور يرى في تقديم عربي على مبين إبرازاً لأصالة اللغة ولإعجاز بلاغتها."
  en: "The commentators take mubin in the phrase a clear Arabic tongue as the active participle of abana, meaning eloquent, lucid and without obscurity, a description of the medium and an argument against the claim that a foreign human taught the Prophet. The summary names al-Tabari, Ibn Kathir, al-Qurtubi and Ibn Ashur: al-Tabari joins clarity of language to clarity of message, Ibn Kathir stresses the impossibility of such eloquence coming from a foreigner, and Ibn Ashur finds in the precedence of Arabic over clear a stress on the language's native character and the inimitable eloquence."
  ur: "مفسرین آیت میں لسان عربی مبین کے لفظ مبین کو أبان کا اسم فاعل سمجھتے ہیں، یعنی فصیح، واضح اور غموض سے خالی، جو ذریعے کی صفت ہے اور اس دعوے کے خلاف حجت کہ کسی عجمی انسان نے نبی کو سکھایا۔ خلاصہ طبری، ابن کثیر، قرطبی اور ابن عاشور کا ذکر کرتا ہے: طبری زبان کی وضاحت اور پیغام کی وضاحت دونوں کو جمع کرتے ہیں، ابن کثیر اس فصاحت کے کسی عجمی سے صادر ہونے کے محال ہونے پر زور دیتے ہیں، اور ابن عاشور عربی کو مبین پر مقدم رکھنے میں زبان کی اصالت اور بلاغت کے اعجاز کا اظہار دیکھتے ہیں۔"
  fr: "Les commentateurs prennent mubin dans l'expression une langue arabe claire comme le participe actif d'abana, éloquent, limpide et sans obscurité, une description du moyen et un argument contre l'idée qu'un humain étranger ait instruit le Prophète. Le résumé nomme al-Tabari, Ibn Kathir, al-Qurtubi et Ibn Ashur : al-Tabari joint la clarté de la langue à celle du message, Ibn Kathir souligne l'impossibilité qu'une telle éloquence vienne d'un étranger, et Ibn Ashur voit dans la précédence d'arabe sur clair un accent sur le caractère natif de la langue et sur son éloquence inimitable."
  es: "Los comentaristas toman mubin en la expresión una lengua árabe clara como participio activo de abana, elocuente, límpido y sin oscuridad, una descripción del medio y un argumento contra la idea de que un humano extranjero instruyera al Profeta. El resumen nombra a al-Tabari, Ibn Kathir, al-Qurtubi e Ibn Ashur: al-Tabari une la claridad de la lengua a la del mensaje, Ibn Kathir subraya la imposibilidad de que tal elocuencia venga de un extranjero, e Ibn Ashur ve en la precedencia de árabe sobre claro un énfasis en el carácter nativo de la lengua y en su elocuencia inimitable."
  tr: "Tefsirciler, 'lisan arab mabin' ifadesindeki 'mubin' kelimesini 'aban'dan gelen aktif bir ortaç olarak anlarlar; bu, Peygamber'i Arap olmayan birinin öğrettiğini iddia edenlere karşı araçların ve kanıtların tanımı ve kanıtı anlamına gelir. El-Muhtesar, el-Tabari, İbn Kathir, el-Kurtubi ve İbn Asur'dan bahseder ve her bir raporu için şöyle olur: el-Taberi, dilin açıklığını mesajın netliğiyle birleştirir, İbn Kathir bu hitabetin Arap olmayan birinden gelmesinin imkansızlığını savunur ve İbn Aşur 'mubin'in Arapça girişini dilin özgünlüğüne ve onun mucizevi hitabetine vurgu olarak görür."
  id: "Para ahli tafsir memahami kata 'mubin' dalam frasa 'lisan arab mabin' sebagai partisip aktif dari 'aban,' yang berarti sesuatu yang fasih dan jelas tanpa ambiguitas, sebagai deskripsi cara dan bukti terhadap mereka yang mengklaim bahwa orang non-Arab mengajar Nabi. Al-Mukhtasar menyebut al-Tabari, Ibn Kathir, al-Qurtubi, dan Ibn Ashur, dan untuk setiap laporannya: al-Tabari menggabungkan kejelasan bahasa dengan kejelasan pesan, Ibn Kathir menegaskan ketidakmungkinan kefasihan ini datang dari orang non-Arab, dan Ibn Ashur melihat pengantar bahasa Arab terhadap 'mubin' sebagai penekanan pada keaslian bahasa dan sifat ajaib dari keindahannya."
