issue:
  ar: "ماذا يعني وصف لسان القرآن بأنه عربي مبين؟"
  en: "What does it mean that the tongue of the Qur'an is described as clear Arabic?"
  ur: "قرآن کی زبان کو عربی مبین کہنے کا کیا مطلب ہے؟"
  fr: "Que signifie que la langue du Coran soit décrite comme arabe clair ?"
  es: "¿Qué significa que la lengua del Corán se describa como árabe claro?"
perspectives:
  - tradition: sunni
    id: mubin-as-clarity-of-language-and-message
    stance:
      ar: "مبين وصف للغة والرسالة معاً: لغة فصيحة معروفة عند العرب، وحجة على قول المشركين."
      en: "Mubin describes both the language and the message: a pure eloquent Arabic known to the Arabs, and an answer to the claim of the opponents."
      ur: "مبین زبان اور پیغام دونوں کی صفت ہے: عربوں کی جانی پہچانی فصیح عربی، اور مخالفین کے دعوے کا جواب۔"
      fr: "Mubin décrit à la fois la langue et le message : un arabe pur et éloquent connu des Arabes, et une réponse aux opposants."
      es: "Mubin describe a la vez la lengua y el mensaje: un árabe puro y elocuente conocido por los árabes, y una respuesta a los opositores."
    holders: [person/al-tabari, person/ibn-kathir]
    summary:
      ar: "عند الطبري في جامع البيان، على آيتي النحل والشعراء، يدل مبين على وضوح اللغة ووضوح الرسالة، والتقابل مع أعجمي يبيّن أن القرآن بالعربية الفصيحة المعروفة عند العرب. وعند ابن كثير في تفسير القرآن العظيم، على آية الشعراء، نزل بعربية تامة فصيحة ليكون بيّناً لا يترك عذراً ويقيم الحجة، وعلى آية النحل يؤكد استحالة أن تصدر هذه الفصاحة عن أعجمي قليل العربية {cite:research-summary-quran-arabic-classical-tafsir-2026 on section a}."
      en: "For al-Tabari in Jami' al-bayan, on the verses of al-Nahl and al-Shu'ara, mubin denotes both the clarity of the language and the lucidity of the message, and the contrast with a'jami shows the Qur'an to be in the pure, eloquent Arabic known to the Arabs. For Ibn Kathir in Tafsir al-Qur'an al-azim, on the verse of al-Shu'ara, it was sent down in perfect and eloquent Arabic so that it be quite clear, leaving no room for excuses and establishing clear proof; on the verse of al-Nahl he stresses the impossibility that such eloquence could come from a foreigner with limited Arabic {cite:research-summary-quran-arabic-classical-tafsir-2026 on section a}."
      ur: "طبری جامع البیان میں النحل اور الشعراء کی آیتوں پر کہتے ہیں کہ مبین زبان کی وضاحت اور پیغام کی وضاحت دونوں پر دلالت کرتا ہے، اور اعجمی سے تقابل ظاہر کرتا ہے کہ قرآن اس فصیح عربی میں ہے جو عربوں کے ہاں معروف ہے۔ ابن کثیر تفسیر القرآن العظیم میں الشعراء کی آیت پر کہتے ہیں کہ وہ کامل اور فصیح عربی میں نازل ہوا تاکہ بالکل واضح ہو، عذر کی گنجائش نہ چھوڑے اور حجت قائم کرے؛ النحل کی آیت پر وہ زور دیتے ہیں کہ ایسی فصاحت کسی کم عربی جاننے والے عجمی سے صادر ہونا محال ہے {cite:research-summary-quran-arabic-classical-tafsir-2026 on section a}۔"
      fr: "Pour al-Tabari, dans Jami' al-bayan, sur les versets d'al-Nahl et d'al-Shu'ara, mubin dénote à la fois la clarté de la langue et la limpidité du message, et le contraste avec a'jami montre que le Coran est dans l'arabe pur et éloquent connu des Arabes. Pour Ibn Kathir, dans Tafsir al-Qur'an al-azim, sur le verset d'al-Shu'ara, il fut révélé en arabe parfait et éloquent pour être tout à fait clair, ne laissant aucune excuse et établissant la preuve ; sur celui d'al-Nahl il souligne l'impossibilité qu'une telle éloquence vienne d'un étranger à l'arabe limité {cite:research-summary-quran-arabic-classical-tafsir-2026 on section a}."
      es: "Para al-Tabari, en Jami' al-bayan, sobre los versículos de al-Nahl y al-Shu'ara, mubin denota a la vez la claridad de la lengua y la limpidez del mensaje, y el contraste con a'jami muestra que el Corán está en el árabe puro y elocuente conocido por los árabes. Para Ibn Kathir, en Tafsir al-Qur'an al-azim, sobre el versículo de al-Shu'ara, descendió en árabe perfecto y elocuente para ser del todo claro, sin dejar excusa y estableciendo la prueba; sobre el de al-Nahl subraya la imposibilidad de que tal elocuencia venga de un extranjero de árabe limitado {cite:research-summary-quran-arabic-classical-tafsir-2026 on section a}."
    sources: [source/research-summary-quran-arabic-classical-tafsir-2026]
  - tradition: sunni
    id: mubin-as-native-character-and-eloquence
    stance:
      ar: "تقديم عربي على مبين يبرز أصالة اللغة، ومبين يبرز إعجاز فصاحتها، وتعالج الأحكام اللغوية في مقدمة التفسير."
      en: "The precedence of Arabic over clear highlights the language's native character, and mubin underscores its inimitable eloquence; related linguistic points are treated in the introduction."
      ur: "عربی کا مبین پر مقدم ہونا زبان کی اصالت اور مبین اس کی فصاحت کے اعجاز کو نمایاں کرتا ہے؛ متعلقہ لسانی نکات مقدمے میں آتے ہیں۔"
      fr: "La précédence d'arabe sur clair met en relief le caractère natif de la langue, et mubin souligne son éloquence inimitable ; les points linguistiques connexes sont traités dans l'introduction."
      es: "La precedencia de árabe sobre claro resalta el carácter nativo de la lengua, y mubin subraya su elocuencia inimitable; los puntos lingüísticos afines se tratan en la introducción."
    holders: [person/al-qurtubi, person/muhammad-al-tahir-ibn-ashur]
    summary:
      ar: "يعالج القرطبي في الجامع لأحكام القرآن الآيات في مواضعها ويلخص المسائل اللغوية المتصلة بها في المقدمة، مشدداً على وضوح اللسان لسامعيه. ويرى ابن عاشور في التحرير والتنوير أن مبين يفيد الفصاحة وجلاء التعبير، وأن تقديم عربي على مبين يبرز أصالة اللغة ويبرز مبين إعجاز فصاحتها {cite:research-summary-quran-arabic-classical-tafsir-2026 on section a}."
      en: "Al-Qurtubi in al-Jami' li-ahkam al-Qur'an treats the verses in place and summarises the related linguistic points in the introduction, emphasising clarity for the audience. Ibn Ashur in al-Tahrir wa-l-tanwir says mubin conveys high articulacy and expressive clarity, and that the precedence of Arabic over clear highlights the language's native character while mubin underscores its inimitable eloquence {cite:research-summary-quran-arabic-classical-tafsir-2026 on section a}."
      ur: "قرطبی الجامع لاحکام القرآن میں آیات کو ان کے مقامات پر دیکھتے ہیں اور متعلقہ لسانی مسائل کا خلاصہ مقدمے میں دیتے ہیں اور سامعین کے لیے زبان کی وضاحت پر زور دیتے ہیں۔ ابن عاشور التحریر والتنویر میں کہتے ہیں کہ مبین اعلیٰ ابلاغ اور اظہار کی وضاحت کا مفہوم دیتا ہے، اور عربی کا مبین پر مقدم ہونا زبان کی اصالت اور مبین اس کی فصاحت کے اعجاز کو نمایاں کرتا ہے {cite:research-summary-quran-arabic-classical-tafsir-2026 on section a}۔"
      fr: "Al-Qurtubi, dans al-Jami' li-ahkam al-Qur'an, traite les versets à leur place et résume les points linguistiques connexes dans l'introduction, en insistant sur la clarté pour l'auditoire. Ibn Ashur, dans al-Tahrir wa-l-tanwir, dit que mubin porte une haute articulation et une clarté d'expression, et que la précédence d'arabe sur clair met en relief le caractère natif de la langue tandis que mubin souligne son éloquence inimitable {cite:research-summary-quran-arabic-classical-tafsir-2026 on section a}."
      es: "Al-Qurtubi, en al-Jami' li-ahkam al-Qur'an, trata los versículos en su lugar y resume los puntos lingüísticos afines en la introducción, haciendo hincapié en la claridad para el auditorio. Ibn Ashur, en al-Tahrir wa-l-tanwir, dice que mubin transmite alta articulación y claridad expresiva, y que la precedencia de árabe sobre claro resalta el carácter nativo de la lengua mientras mubin subraya su elocuencia inimitable {cite:research-summary-quran-arabic-classical-tafsir-2026 on section a}."
