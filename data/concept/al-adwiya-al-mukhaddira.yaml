id: concept/al-adwiya-al-mukhaddira
class: concept
kind: scientific
label:
  ar: الأدوية المخدرة للأسنان
  en: The numbing drugs for the teeth
  ur: دانتوں کی مخدر ادویہ
summary:
  ar: الأدوية المخدرة قد تستعمل على الوجوه المذكورة في التحليل لكن الأولى أن تكون ملطوخة أو ملصقة أو محشوة على أنها قد تستعمل مضمضات وبخورات، ومنها ما يقطر في الأذن من الجانب الوجع، ومنها ما يبخر به ويمسك في الفم وقد يسقى المخدرات فيأخذ منه في فمه فينام فينضج مرضه ويسكن ألمه ⁦(الأسماء والمقادير مطروحة)⁩، ومن جملة ما يخدر من غير أذى الماء المبرد بالثلج تبريداً بالغاً يؤخذ بالفم أخذاً بعد أخذ حتى يخدر السن فيسكن الوجع البتة وإن كان ربما زاد في الابتداء {cite:canon-ibn-sina-print-v2 p.273}
  en: The numbing drugs may be used on the routes named under dissolution, though it is better they be smeared, pasted or stuffed, while they may also serve as mouthwashes and fumigations; among them what is dripped into the ear on the aching side, what is fumed and held in the mouth, and what the tooth-sufferer is given to drink, taking it into his mouth until he sleeps, his illness maturing and his pain calming (names and measures left out). Among what numbs without harm is water chilled hard by snow, taken mouthful after mouthful until the tooth numbs and the pain calms altogether — though it may first increase it {cite:canon-ibn-sina-print-v2 p.273}
  ur: مخدر ادویہ تحلیل میں بتائے ہوئے راستوں پر استعمال ہو سکتی ہیں مگر بہتر یہ ہے کہ وہ ملی ہوئی، لگی ہوئی یا بھری ہوئی ہوں، بہرحال وہ کلانے اور دھونیوں کے طور پر بھی استعمال ہوتی ہیں؛ ان میں وہ ہے جو درد والے جانب کان میں ٹپکائی جائے، جو دھونی دی کر منہ میں رکھی جائے، اور وہ جو دانت مبتلا کو پلائی جائے تو وہ اسے منہ میں لے کر سو جائے تاکہ اس کا مرض پک جائے اور درد سکون پائے ⁦(نام اور مقداریں مطروح)⁩؛ اور بے ضرر بےحس کرنے والوں میں برف سے بہت زیادہ ٹھنڈا کیا ہوا پانی ہے جو منہ میں ایک ایک وغیرہ لیا جائے یہاں تک کہ دانت بےحس ہو جائے اور درد بالکل سکون پائے، اگرچہ شروع میں بڑھا بھی سکتا ہے {cite:canon-ibn-sina-print-v2 p.273}
