id: concept/simhaq
class: concept
kind: legal
label:
  ar: "السِّمْحاق"
  en: "Simhaq (a head wound reaching the membrane over the skull)"
summary:
  ar: "السمحاق قشرة رقيقة فوق عظم الرأس تفصل اللحم عن العظم، وهي في اصطلاح جمهور الفقهاء الشجة التي تصل إلى تلك القشرة فتقطع اللحم ولا تصل إلى العظم، ويسميها المالكية الملطاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9823} وهي من الشجاج التي لا دية فيها ولا أرش مقدر عند الجمهور، فتجب فيها حكومة عدل عمدا كانت أو خطأ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9824} وقال المالكية، وهو قول عند الشافعية ورواية عن محمد من الحنفية، يجب فيها القصاص في العمد لإمكان ضبطها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9824}"
  en: "The simhaq is a thin membrane above the skull bone that separates flesh from bone. In the usage of most jurists it is a head wound that reaches that membrane, cutting the flesh without reaching the bone; the Malikis call it mulatta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9823} Among the wounds of the head it has no fixed blood-money or fixed arsh for the majority, so a just assessment (hukuma) is owed for it, whether intentional or by error. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9824} The Malikis, and a view among the Shafi'is and a report from a Hanafi jurist named Muhammad, hold that retaliation (qisas) is due for it when intentional, since it can be measured. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9824}"
