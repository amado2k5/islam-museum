id: concept/simhaq
class: concept
kind: legal
label:
  ar: "السِّمْحاق"
  en: "Simhaq (a head wound reaching the membrane over the skull)"
  es: "Simhaq (una herida en la cabeza que alcanza la membrana que recubre el cráneo)"
  fr: "Simhaq (une blessure à la tête atteignant la membrane recouvrant le crâne)"
  ur: "سمحق ⁦(سر کا زخم جو کھوپڑی کے اوپر کی جھلی تک پہنچتا ہے)⁩"
summary:
  ar: "السمحاق قشرة رقيقة فوق عظم الرأس تفصل اللحم عن العظم، وهي في اصطلاح جمهور الفقهاء الشجة التي تصل إلى تلك القشرة فتقطع اللحم ولا تصل إلى العظم، ويسميها المالكية الملطاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9823} وهي من الشجاج التي لا دية فيها ولا أرش مقدر عند الجمهور، فتجب فيها حكومة عدل عمدا كانت أو خطأ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9824} وقال المالكية، وهو قول عند الشافعية ورواية عن محمد من الحنفية، يجب فيها القصاص في العمد لإمكان ضبطها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9824}"
  en: "The simhaq is a thin membrane above the skull bone that separates flesh from bone. In the usage of most jurists it is a head wound that reaches that membrane, cutting the flesh without reaching the bone; the Malikis call it mulatta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9823} Among the wounds of the head it has no fixed blood-money or fixed arsh for the majority, so a just assessment (hukuma) is owed for it, whether intentional or by error. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9824} The Malikis, and a view among the Shafi'is and a report from a Hanafi jurist named Muhammad, hold that retaliation (qisas) is due for it when intentional, since it can be measured. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9824}"
  es: "El simhaq es una membrana delgada sobre el cráneo que separa la carne del hueso. En la mayoría de los juristas, se considera herida de cabeza aquella que alcanza dicha membrana, cortando la carne sin llegar al hueso; los malikíes la denominan mulatta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9823} Entre las heridas de cabeza, no tiene una indemnización fija por sangre ni un arsh fijo para la mayoría, por lo que se debe una justa evaluación (hukuma), ya sea intencional o por error. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9824} Los malikíes, una opinión entre los shafi'íes y un informe de un jurista hanafí llamado Muhammad, sostienen que se debe una represalia (qisas) cuando es intencional, ya que puede medirse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9824}"
  fr: "Le simhaq est une fine membrane située au-dessus de l'os du crâne, séparant la chair de l'os. Pour la plupart des juristes, il s'agit d'une blessure à la tête qui atteint cette membrane, coupant la chair sans atteindre l'os; les Malikites la nomment mulatta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9823} Parmi les blessures à la tête, il n'existe pas de compensation fixe pour le sang ou pour l'arsh pour la majorité des juristes; une juste évaluation (hukuma) est donc due, qu'elle soit intentionnelle ou accidentelle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9824} Les Malikites, ainsi qu'une opinion chez les Shafi'ites et un rapport d'un juriste hanafite nommé Muhammad, estiment que la vengeance (qisas) est due lorsqu'elle est intentionnelle, car elle peut être quantifiée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9824}"
  ur: "سمحق کھوپڑی کی ہڈی کے اوپر ایک پتلی جھلی ہے جو ہڈی سے گوشت کو الگ کرتی ہے۔ اکثر فقہاء کے استعمال میں یہ سر کا زخم ہے جو اس جھلی تک پہنچتا ہے، ہڈی تک پہنچائے بغیر گوشت کاٹتا ہے۔ مالکی اسے ملطہ کہتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 9823} سر کے زخموں میں سے اس میں جمہور کے لیے کوئی مقررہ خون یا مقررہ عرش نہیں ہے، اس لیے اس کے لیے عدل کا تعین ⁦(حکمہ)⁩ واجب ہے، خواہ جان بوجھ کر ہو یا غلطی سے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 9824} مالکیہ، اور شافعیوں کا ایک قول اور محمد نامی حنفی فقیہ کی ایک روایت، یہ مانتے ہیں کہ قصاص ⁦(قصاص)⁩ قصاص واجب ہے، کیونکہ اس کی پیمائش کی جا سکتی ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص9824}"
