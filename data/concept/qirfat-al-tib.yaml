summary:
  ar: "قرفة الطيب في الكتاب قرفة القرنفل، قشور غلاظ في لون القرفة وطعمها طعم القرنفل، وهي أضعف أفعالا منه، حارة يابسة في الثالثة {cite:canon-ibn-sina-print-v1 p.643}"
  en: "Qirfat al-tib is in the book the bark of the clove, thick husks of the colour of cinnamon with the taste of the clove, weaker in action than the clove, hot and dry in the third degree {cite:canon-ibn-sina-print-v1 p.643}"
  ur: "قرفۃ الطیب کتاب میں قرنفل کی چھال ہے، موٹے چھلکے جو دار چینی کے رنگ کے اور قرنفل کے ذائقے کے ہیں، عمل میں قرنفل سے کمزور، تیسرے درجے میں گرم خشک {cite:canon-ibn-sina-print-v1 p.643}۔"
  es: "Qirfat al-tib es en el libro la corteza del clavo, cáscaras gruesas del color de la canela con sabor a clavo, más débil en acción que el clavo, caliente y seco en tercer grado {cite:canon-ibn-sina-print-v1 p.643}"
