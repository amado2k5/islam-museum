summary:
  ar: "الجنس السادس سرعة انفعال العضو: إن سخن سريعاً فهو حار المزاج وإن برد سريعاً فبارد، ويجيب ابن سينا عن اعتراض أن الشيء ينفعل عن ضده، ثم يبين دور الحرارة الغريزية آلة للطبيعة في دفع الضرر وحفظ الرطوبات من العفونة {cite:canon-ibn-sina-print-v1 pp.161-162}."
  en: "The sixth genus is how quickly an organ is acted on: if it warms quickly it is hot in temperament, if it cools quickly, cold. Ibn Sina answers the objection that a thing is acted on by its opposite, then explains the innate heat as nature's instrument for warding off harm and keeping the humours from rotting {cite:canon-ibn-sina-print-v1 pp.161-162}."
