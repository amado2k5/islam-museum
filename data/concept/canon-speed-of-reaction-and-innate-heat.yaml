label: { ar: "سرعة انفعال الأعضاء والحرارة الغريزية عند ابن سينا", en: "Speed of reaction and the innate heat in the Canon", ur: "اعضا کا جلد منفعل ہونا اور حرارتِ غریزی، قانون کے مطابق", es: "Velocidad de reacción y calor intrínseco en el cañón", fr: "Rapidité de réaction et chaleur intrinsèque du canon", tr: "İbn Sina'ya göre organ tahrişinin ve doğuştan gelen ısının hızı", id: "Kecepatan iritasi organ dan panas bawaan menurut Avicenna" }
summary:
  ar: "الجنس السادس سرعة انفعال العضو: إن سخن سريعاً فهو حار المزاج وإن برد سريعاً فبارد، ويجيب ابن سينا عن اعتراض أن الشيء ينفعل عن ضده، ثم يبين دور الحرارة الغريزية آلة للطبيعة في دفع الضرر وحفظ الرطوبات من العفونة {cite:canon-ibn-sina-print-v1 pp.161-162}."
  en: "The sixth genus is how quickly an organ is acted on: if it warms quickly it is hot in temperament, if it cools quickly, cold. Ibn Sina answers the objection that a thing is acted on by its opposite, then explains the innate heat as nature's instrument for warding off harm and keeping the humours from rotting {cite:canon-ibn-sina-print-v1 pp.161-162}."
  es: "El sexto género se refiere a la rapidez con que un órgano es afectado: si se calienta rápidamente, es de temperamento caliente; si se enfría rápidamente, es frío. Ibn Sina responde a la objeción de que una cosa es afectada por su opuesto y luego explica el calor innato como el instrumento de la naturaleza para prevenir daños y evitar que los humores se pudran {cite:canon-ibn-sina-print-v1 pp.161-162}."
  fr: "Le sixième genre concerne la rapidité avec laquelle un organe est affecté: s’il se réchauffe rapidement, il est de tempérament chaud; s’il se refroidit rapidement, il est de tempérament froid. Ibn Sina répond à l’objection selon laquelle une chose est affectée par son contraire, puis explique la chaleur innée comme l’instrument naturel permettant de se protéger du mal et d’empêcher la putréfaction des humeurs {cite:canon-ibn-sina-print-v1 pp.161-162}."
  ur: "چھٹی نسل یہ ہے کہ کسی عضو پر کتنی جلدی عمل کیا جاتا ہے: اگر یہ جلدی گرم ہو جائے تو یہ مزاج میں گرم ہے، اگر یہ جلدی ٹھنڈا ہو جائے تو سرد۔ ابن سینا اس اعتراض کا جواب دیتے ہیں کہ کسی چیز پر اس کے برعکس عمل کیا جاتا ہے، پھر فطری حرارت کو نقصان سے بچانے اور مزاح کو سڑنے سے روکنے کے لیے فطرت کا آلہ قرار دیتے ہیں۔"
  tr: "Altıncı tür: organın hızlı tepkisi: hızlı ısınırsa sıcak sinirlenir; hızlı soğursa soğuktur. İbn Sina, bir şeyin zıttına tepki verdiği itirazına yanıt verir, ardından içgüdüsel ısının küften kaynaklanan hasarı itme ve nemi korumada doğal bir makine rolünü açıklar {cite:canon-ibn-sina-print-v1 s.161-162}."
  id: "Jenis keenam: reaksi cepat organ: jika cepat panas, organ menjadi panas; jika cepat dingin, maka dingin. Ibn Sina menanggapi keberatan bahwa sesuatu bereaksi terhadap lawannya, lalu menjelaskan peran panas naluriah sebagai mesin alami dalam menolak kerusakan dan menjaga kelembapan dari jamur {cite:canon-ibn-sina-print-v1 hlm.161-162}."
