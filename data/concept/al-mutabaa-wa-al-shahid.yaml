id: concept/al-mutabaa-wa-al-shahid
class: concept
kind: term
label: { ar: "المتابعة والشاهد والاعتبار", en: "Corroboration (mutaba'a), supporting report (shahid) and the search for them (i'tibar)", ur: "متابعت، شاہد اور اعتبار" }
summary:
  ar: "المتابعة عند ابن حجر أن يوجد للحديث الذي ظُنّ فرداً نسبياً من وافق راويه من رواية الصحابي نفسه، تامة إن كانت للراوي نفسه وقاصرة إن كانت لشيخه فمن فوقه؛ والشاهد متن يُروى من حديث صحابي آخر يشبهه لفظاً ومعنى أو معنى فقط؛ والاعتبار تتبّع الطرق من الجوامع والمسانيد والأجزاء للوصول إليهما {cite:nuzhat-al-nazar-itr-bushra-2011 p. 68-71}. الاعتبار عند ابن الصلاح هو النظر في حال الحديث: هل تفرد به راويه أو لا، وهل هو معروف أو لا. ومثّل له ابن حبان بحديث يرويه حماد بن سلمة عن أيوب عن ابن سيرين عن أبي هريرة، فيُنظر هل رواه ثقة غير أيوب عن ابن سيرين، ثم غير ابن سيرين عن أبي هريرة، ثم صحابي غير أبي هريرة. فالمتابعة التامة أن يرويه غير حماد عن أيوب، والقاصرة ما كان أبعد من ذلك، والشاهد أن يُروى حديث آخر بمعناه؛ فإن لم يوجد شيء من ذلك تحقق التفرد المطلق. وقد يدخل في المتابعات والشواهد من لا يحتج به وحده {cite:muqaddima-ibn-salah-itr p. 82-85}."
  en: "For Ibn Hajar corroboration (mutaba'a) is finding, for a report thought to be relatively solitary, someone who agrees with its narrator within the same Companion's report, complete if it is for the narrator himself and partial if for his teacher or someone above; the supporting report (shahid) is a text transmitted from another Companion resembling it in wording and meaning or in meaning alone; and i'tibar is tracing the routes in the collections, musnads and booklets to find them {cite:nuzhat-al-nazar-itr-bushra-2011 p. 68-71}. For Ibn al-Salah i'tibar is examining a hadith to see whether its narrator is alone in it and whether it is known. Ibn Hibban illustrated it with a hadith of Hammad ibn Salama from Ayyub from Ibn Sirin from Abu Hurayra: one looks for a trustworthy narrator other than Ayyub from Ibn Sirin, then someone other than Ibn Sirin from Abu Hurayra, then a Companion other than Abu Hurayra. A complete corroboration (mutaba'a) is another narrator from Ayyub; a partial one lies further up; a supporting report (shahid) is a different hadith with the same meaning; if none is found the report is absolutely solitary. Narrators not relied on alone may still serve in corroborations and supporting reports."
  ur: "ابن حجر کے نزدیک متابعت یہ ہے کہ جس حدیث کو نسبی فرد سمجھا گیا اس کے راوی کی موافقت اسی صحابی کی روایت میں کوئی اور کرے؛ راوی کی اپنی موافقت ہو تو تامہ اور اس کے شیخ یا اوپر کی ہو تو قاصرہ؛ شاہد وہ متن ہے جو کسی دوسرے صحابی سے لفظ و معنی یا صرف معنی میں مشابہ روایت ہو؛ اور اعتبار جوامع، مسانید اور اجزا میں طرق کی تلاش ہے تاکہ ان تک پہنچا جائے {cite:nuzhat-al-nazar-itr-bushra-2011 p. 68-71}۔"
