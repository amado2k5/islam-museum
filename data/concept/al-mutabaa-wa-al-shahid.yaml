label: { ar: "المتابعة والشاهد والاعتبار", en: "Corroboration (mutaba'a), supporting report (shahid) and the search for them (i'tibar)", fr: "La corroboration (mutaba'a), le récit à l'appui (shahid) et leur recherche (i'tibar)", ur: "متابعت، شاہد اور اعتبار", es: "Corroboración (mutaba'a), informe de apoyo (shahid) y la búsqueda de ellos (i'tibar)", tr: "Takip, Tanık ve Değerlendirme", id: "Tindak Lanjut, Saksi, dan Evaluasi" }
summary:
  ar: "المتابعة عند ابن حجر أن يوجد للحديث الذي ظُنّ فرداً نسبياً من وافق راويه من رواية الصحابي نفسه، تامة إن كانت للراوي نفسه وقاصرة إن كانت لشيخه فمن فوقه؛ والشاهد متن يُروى من حديث صحابي آخر يشبهه لفظاً ومعنى أو معنى فقط؛ والاعتبار تتبّع الطرق من الجوامع والمسانيد والأجزاء للوصول إليهما {cite:nuzhat-al-nazar-itr-bushra-2011 p. 68-71}. الاعتبار عند ابن الصلاح هو النظر في حال الحديث: هل تفرد به راويه أو لا، وهل هو معروف أو لا. ومثّل له ابن حبان بحديث يرويه حماد بن سلمة عن أيوب عن ابن سيرين عن أبي هريرة، فيُنظر هل رواه ثقة غير أيوب عن ابن سيرين، ثم غير ابن سيرين عن أبي هريرة، ثم صحابي غير أبي هريرة. فالمتابعة التامة أن يرويه غير حماد عن أيوب، والقاصرة ما كان أبعد من ذلك، والشاهد أن يُروى حديث آخر بمعناه؛ فإن لم يوجد شيء من ذلك تحقق التفرد المطلق. وقد يدخل في المتابعات والشواهد من لا يحتج به وحده {cite:muqaddima-ibn-salah-itr p. 82-85}."
  en: "For Ibn Hajar corroboration (mutaba'a) is finding, for a report thought to be relatively solitary, someone who agrees with its narrator within the same Companion's report, complete if it is for the narrator himself and partial if for his teacher or someone above; the supporting report (shahid) is a text transmitted from another Companion resembling it in wording and meaning or in meaning alone; and i'tibar is tracing the routes in the collections, musnads and booklets to find them {cite:nuzhat-al-nazar-itr-bushra-2011 p. 68-71}. For Ibn al-Salah i'tibar is examining a hadith to see whether its narrator is alone in it and whether it is known. Ibn Hibban illustrated it with a hadith of Hammad ibn Salama from Ayyub from Ibn Sirin from Abu Hurayra: one looks for a trustworthy narrator other than Ayyub from Ibn Sirin, then someone other than Ibn Sirin from Abu Hurayra, then a Companion other than Abu Hurayra. A complete corroboration (mutaba'a) is another narrator from Ayyub; a partial one lies further up; a supporting report (shahid) is a different hadith with the same meaning; if none is found the report is absolutely solitary. Narrators not relied on alone may still serve in corroborations and supporting reports."
  fr: "Pour Ibn Hajar, la corroboration (mutaba'a) consiste à trouver, pour un récit que l'on croyait relativement isolé, quelqu'un qui s'accorde avec son transmetteur dans le récit du même Compagnon, complète si elle porte sur le transmetteur lui-même et partielle si elle porte sur son maître ou quelqu'un de plus haut ; le récit à l'appui (shahid) est un texte transmis d'un autre Compagnon qui lui ressemble par la formulation et le sens ou par le sens seul ; et l'i'tibar est le fait de suivre les voies dans les recueils, les musnads et les fascicules pour les trouver {cite:nuzhat-al-nazar-itr-bushra-2011 p. 68-71}. Pour Ibn al-Salah, l'i'tibar est l'examen d'un hadith pour voir si son transmetteur y est seul et s'il est connu. Ibn Hibban l'illustra par un hadith de Hammad ibn Salama d'après Ayyub d'après Ibn Sirin d'après Abu Hurayra : on cherche un transmetteur digne de confiance autre qu'Ayyub d'après Ibn Sirin, puis quelqu'un d'autre qu'Ibn Sirin d'après Abu Hurayra, puis un Compagnon autre qu'Abu Hurayra. Une corroboration complète (mutaba'a) est un autre transmetteur d'après Ayyub ; une partielle se situe plus haut ; un récit à l'appui (shahid) est un hadith différent de même sens ; si rien n'est trouvé, le récit est absolument isolé. Des transmetteurs sur lesquels on ne s'appuie pas seuls peuvent encore servir dans les corroborations et les récits à l'appui."
  ur: "ابن حجر کے نزدیک متابعت یہ ہے کہ جس حدیث کو نسبی فرد سمجھا گیا اس کے راوی کی موافقت اسی صحابی کی روایت میں کوئی اور کرے؛ راوی کی اپنی موافقت ہو تو تامہ اور اس کے شیخ یا اوپر کی ہو تو قاصرہ؛ شاہد وہ متن ہے جو کسی دوسرے صحابی سے لفظ و معنی یا صرف معنی میں مشابہ روایت ہو؛ اور اعتبار جوامع، مسانید اور اجزا میں طرق کی تلاش ہے تاکہ ان تک پہنچا جائے {cite:nuzhat-al-nazar-itr-bushra-2011 p. 68-71}۔"
  es: "Para Ibn Hajar, la corroboración (mutaba'a) consiste en encontrar, para un relato que se considera relativamente solitario, a alguien que esté de acuerdo con su narrador dentro del relato del mismo Compañero, completa si se trata del propio narrador y parcial si se trata de su maestro o alguien superior; el relato de apoyo (shahid) es un texto transmitido por otro Compañero que se asemeja a él en la redacción y el significado, o solo en el significado; e i'tibar es rastrear las rutas en las colecciones, musnads y folletos para encontrarlos {cite:nuzhat-al-nazar-itr-bushra-2011 p. 68-71}. Para Ibn al-Salah, i'tibar es examinar un hadiz para ver si su narrador está solo en él y si es conocido. Ibn Hibban lo ilustró con un hadiz de Hammad ibn Salama, transmitido por Ayyub, de Ibn Sirin, de Abu Hurayra: se busca un narrador fidedigno distinto de Ayyub, de Ibn Sirin; luego, otro distinto de Ibn Sirin, de Abu Hurayra; y finalmente, un Compañero distinto de Abu Hurayra. Una corroboración completa (mutaba'a) es otro narrador de Ayyub; una parcial se encuentra más arriba; un relato de apoyo (shahid) es un hadiz diferente con el mismo significado; si no se encuentra ninguno, el relato es absolutamente único. Los narradores en los que no se confía exclusivamente pueden servir como corroboraciones y relatos de apoyo."
  tr: "İbn Hajar'a göre, hadisin rivayetçinin kendisiyle aynı sahabenin rivayetinden elde edilen bir göreceli birey olarak görüldüğü, anlatıcının kendisi için ise tamamlanmış, öğretmeni için ise sınırlı, onun üzerinde olduğu düşünülür; kanıt, başka bir sahabeden anlatılan ve sadece ifade, anlam veya anlam olarak ona benzeyen bir metindir; ve onlara ulaşmak için derlemeler, musnadlar ve parçalar zincirlerini takip etmek önemlidir {alıntı:] Nuzhat-al-Nazar-itr-Bushra-2011, s. 68-71}. İbn al-Salah'a göre dikkate alınacak bir şey, hadisin halini incelemektir: rivayetçinin tek başına anlatıp anlatmadığı, bilinip bilinmediği bir hadistir. İbn Hibban, ona Ebu Hureyre'den Ayyub'dan İbn Sirin'den Hammad ibn Salamah tarafından rivayet edilen bir hadis ile örneklemiştir; bu yüzden bu hadisin İbn Sirin'den, sonra Ebu Hureyre'den İbn Sirin'den, ardından Ebu Hureyre'den başka bir sahabeden başka bir hadise ait olup olmadığını kontrol etmelidir. Tam takip olarak, Hammad dışında biri bunu Ayyub'dan anlatır ve sınırlı rivayet bundan ötedir. Kanıt, başka bir hadisi anlamıyla birlikte anlattığıdır; eğer bunun hiçbir şeyi bulunmazsa, mutlak benzerlik tespit edilir. Takip ve kanıtlar arasında tek başına kullanılmayan başka deliller de dahil edilebilir {atıf:muqaddima-ibn-salah-itr s. 82-85}."
  id: "Menurut Ibn Hajar, hadis dipandang sebagai individu relatif yang diperoleh dari narator sendiri dan narator itu sendiri, sedangkan bagi narator dianggap lengkap, dan bagi guru, ia terbatas dan di atasnya; bukti adalah teks yang diceritakan oleh sahabat lain dan hanya menyerupai dirinya dalam ekspresi, makna, atau makna; dan untuk mencapainya, penting mengikuti rangkaian kompilasi, musnad, dan fragmen {kutipan:] Nuzhat-al-Nazar-itr-Bushra-2011, hlm. 68-71}. Menurut Ibn al-Salah, satu hal yang perlu dipertimbangkan adalah memeriksa keadaan hadits: apakah narator yang menceritakannya sendiri diketahui atau tidak. Ibn Hibban memberinya contoh dengan hadis yang diceritakan oleh Hammad ibn Salamah dari Abu Huraira, Ayyub, Ibn Sirin; oleh karena itu, ia harus memeriksa apakah hadis ini berasal dari hadis lain dari Ibn Sirin, lalu dari Abu Huraira ke Ibn Sirin, dan kemudian dari sahabat lain Abu Huraira. Sebagai tindak lanjut lengkap, seseorang selain Hammad menceritakan ini dari Ayyub, dan narasi terbatas itu melampaui itu. Buktinya adalah bahwa ia menceritakan hadis lain dengan maknanya; jika tidak ditemukan apa pun darinya, maka kemiripan mutlak terbukti. Di antara bukti-bukti berikut ini juga dapat dimasukkan {sitasi: Muqaddima-ibn-Salah-itr hlm. 82-85}."
