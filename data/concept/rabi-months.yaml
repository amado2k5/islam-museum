label:
  ar: "شهرا ربيع الأول وربيع الآخر"
  en: "The two Rabi' months (Rabi' al-Awwal and Rabi' al-Akhir: the birth and the hijra)"
summary:
  ar: "ربيع الأول ثالث شهور السنة وربيع الآخر رابعها، سميا بموسم الربيع الذي كانا يقعان فيه حين سميت الشهور. وفي ربيع الأول على المشهور ولد النبي، وفيه خرج مهاجرا ووصل المدينة يوم الاثنين الثاني عشر منه. {cite:mubarakpuri-raheeq} {cite:athar-baqiya-thaqafa-2008}"
  en: "Rabi' al-Awwal is the third month and Rabi' al-Akhir the fourth, named after the spring season in which they fell when the months were named. In Rabi' al-Awwal, on the prevalent report, the Prophet was born, and in it he set out on the hijra and reached Medina on Monday the twelfth. {cite:mubarakpuri-raheeq} {cite:athar-baqiya-thaqafa-2008}"
  ur: "ربیع الاول تیسرا اور ربیع الآخر چوتھا مہینہ ہے، انہیں اس موسمِ بہار کے نام پر رکھا گیا جس میں وہ اس وقت آتے تھے جب مہینوں کے نام رکھے گئے۔ ربیع الاول میں مشہور قول کے مطابق نبی کریم پیدا ہوئے اور اسی میں ہجرت کے لیے نکلے اور پیر کے دن بارہویں کو مدینہ پہنچے۔ {cite:mubarakpuri-raheeq} {cite:athar-baqiya-thaqafa-2008}"
