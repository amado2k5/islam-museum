id: concept/iqrar
class: concept
kind: legal
label: { ar: "إقرار", en: "Iqrar (confession or acknowledgement of a right)" }
summary:
  ar: "الإقرار لغة الاعتراف، وهو في اصطلاح جمهور الفقهاء الإخبار عن ثبوت حق للغير على المخبِر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3185} ويفترق عن الدعوى والشهادة في أن الإقرار إخبار عن حق سابق على المخبر ويقتصر حكمه عليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3186} وهو واجب في حقوق العباد، وحجيته ثابتة بالكتاب والسنة والإجماع والمعقول، ومن السنة رجم ماعز والغامدية بإقرارهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3186} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3187} وأثره ظهور ما أُقر به، أي ثبوت الحق فيما مضى لا إنشاؤه ابتداء، وحجيته قاصرة على المقر وحده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3187} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3188} ويشترط في المقر العقل والاختيار وعدم التهمة، ويشترط في المقر له أن يكون معلوما، وفي المقر به أن يكون له قيمة، ويصح الإقرار بالمجهول ويجبر المقر على بيانه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3189} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3192} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3195} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3199} وقد يدخل على الإقرار ما يقدح فيه من الاستثناء المتصل والتعليق على المشيئة والرجوع، واختلف الفقهاء في أثر الرجوع، فالجمهور يعتبرونه في حقوق الله التي تسقط بالشبهة ولا يعتبرونه في حقوق العباد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3203} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3204} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3211} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3212}"
  en: "Iqrar means acknowledgement in the lexical sense, and in the majority's technical sense it is the report that a right belongs to another person against the one who reports it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3185} It differs from a claim and from testimony in that iqrar reports a right that existed before the speaker and its ruling is limited to him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3186} It is obligatory in rights of people, and its authority rests on the Qur'an, the Sunna, consensus and reason; the Sunna gives the stoning of Ma'iz and of the Ghamidiyya on their own confession. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3186} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3187} Its effect is to show what was acknowledged, that is, to establish the right in the past and not to create it from the start, and its force is limited to the one who confesses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3187} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3188} The confessor must be sane, free in choosing, and not under suspicion; the recipient must be known, and the thing acknowledged must have value; an acknowledgement of an unspecified thing is valid, and the confessor is required to specify it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3189} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3192} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3195} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3199} Qualifications such as an exception, a conditional clause tied to a will, or a later retraction can affect it; the majority accept retraction in rights of God that fall away under doubt, and do not accept it in rights of people. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3203} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3204} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3211} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3212}"
