id: concept/iqrar
class: concept
kind: legal
label: { ar: "إقرار", en: "Iqrar (confession or acknowledgement of a right)", es: "Iqrar (confesión o reconocimiento de un derecho)", fr: "Iqrar (aveu ou reconnaissance d'un droit)" }
summary:
  ar: "الإقرار لغة الاعتراف، وهو في اصطلاح جمهور الفقهاء الإخبار عن ثبوت حق للغير على المخبِر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3185} ويفترق عن الدعوى والشهادة في أن الإقرار إخبار عن حق سابق على المخبر ويقتصر حكمه عليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3186} وهو واجب في حقوق العباد، وحجيته ثابتة بالكتاب والسنة والإجماع والمعقول، ومن السنة رجم ماعز والغامدية بإقرارهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3186} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3187} وأثره ظهور ما أُقر به، أي ثبوت الحق فيما مضى لا إنشاؤه ابتداء، وحجيته قاصرة على المقر وحده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3187} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3188} ويشترط في المقر العقل والاختيار وعدم التهمة، ويشترط في المقر له أن يكون معلوما، وفي المقر به أن يكون له قيمة، ويصح الإقرار بالمجهول ويجبر المقر على بيانه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3189} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3192} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3195} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3199} وقد يدخل على الإقرار ما يقدح فيه من الاستثناء المتصل والتعليق على المشيئة والرجوع، واختلف الفقهاء في أثر الرجوع، فالجمهور يعتبرونه في حقوق الله التي تسقط بالشبهة ولا يعتبرونه في حقوق العباد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3203} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3204} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3211} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3212}"
  en: "Iqrar means acknowledgement in the lexical sense, and in the majority's technical sense it is the report that a right belongs to another person against the one who reports it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3185} It differs from a claim and from testimony in that iqrar reports a right that existed before the speaker and its ruling is limited to him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3186} It is obligatory in rights of people, and its authority rests on the Qur'an, the Sunna, consensus and reason; the Sunna gives the stoning of Ma'iz and of the Ghamidiyya on their own confession. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3186} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3187} Its effect is to show what was acknowledged, that is, to establish the right in the past and not to create it from the start, and its force is limited to the one who confesses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3187} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3188} The confessor must be sane, free in choosing, and not under suspicion; the recipient must be known, and the thing acknowledged must have value; an acknowledgement of an unspecified thing is valid, and the confessor is required to specify it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3189} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3192} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3195} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3199} Qualifications such as an exception, a conditional clause tied to a will, or a later retraction can affect it; the majority accept retraction in rights of God that fall away under doubt, and do not accept it in rights of people. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3203} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3204} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3211} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3212}"
  es: "Iqrar significa reconocimiento en el sentido léxico, y en el sentido técnico de la mayoría es el informe de que un derecho pertenece a otra persona frente a quien lo informa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3185} Se diferencia de una reclamación y de un testimonio en que iqrar informa un derecho que existía antes del hablante y su dictamen se limita a él. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3186} Es obligatorio en los derechos de las personas, y su autoridad se basa en el Corán, la Sunna, el consenso y la razón; la Sunna da la lapidación de Ma'iz y de los Ghamidiyya sobre su propia confesión. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3186} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3187} Su efecto es mostrar lo que fue reconocido, es decir, establecer el derecho en el pasado y no crearlo desde el principio, y su fuerza se limita a quien confiesa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3187} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3188} El confesor debe ser cuerdo, libre en su elección y no estar bajo sospecha; el receptor debe ser conocido, y la cosa reconocida debe tener valor; un reconocimiento de una cosa no especificada es válido, y el confesor está obligado a especificarla. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3189} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3192} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3195} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3199} Las calificaciones tales como una excepción, una cláusula condicional ligada a un testamento o una retractación posterior pueden afectarlo; la mayoría acepta la retractación en derechos de Dios que caen en duda, y no la acepta en derechos de las personas. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3203} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3204} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3211} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3212}"
  fr: "L'iqrar signifie reconnaissance au sens littéral, et au sens technique majoritaire, il s'agit de la déclaration selon laquelle un droit appartient à autrui, à l'encontre de celui qui la déclare. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3185} Elle diffère d'une revendication et d'un témoignage en ce qu'elle rapporte un droit antérieur à celui qui la rapporte et que sa portée lui est limitée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3186} Elle est obligatoire en matière de droits des personnes, et son autorité repose sur le Coran, la Sunna, le consensus et la raison; la Sunna justifie la lapidation de Ma'iz et des Ghamidiyya par leurs propres aveux. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3186} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3187} Son effet est de constater ce qui a été reconnu, c'est-à-dire d'établir un droit antérieur et non de le créer ex nihilo, et sa portée est limitée à celui qui confesse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3187} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3188} Le confesseur doit être sain d'esprit, libre de ses choix et ne pas être soupçonné; le destinataire doit être connu et la chose reconnue doit avoir une valeur; la reconnaissance d'une chose non spécifiée est valable, et le confesseur est tenu de la préciser. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3189} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3192} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3195} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3199} Des qualifications telles qu'une exception, une clause conditionnelle liée à un testament ou une rétractation ultérieure peuvent l'affecter; la majorité accepte la rétractation dans les droits de Dieu qui tombent en cas de doute, et ne l'accepte pas dans les droits des personnes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3203} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3204} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3211} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3212}"
