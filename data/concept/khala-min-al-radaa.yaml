id: concept/khala-min-al-radaa
class: concept
kind: legal
label:
  ar: "الخالة من الرضاعة"
  en: "The maternal milk-aunt (khala min al-radaa)"
  ur: "رضاعی خالہ"
  es: "La tía lechera materna (khala min al-radaa)"
summary:
  ar: "الخالة من الرضاعة من تحرم بالرضاع كما تحرم بالنسب، لقوله تعالى وأمهاتكم اللاتي أرضعنكم وأخواتكم من الرضاعة وقوله يحرم من الرضاع ما يحرم من النسب، فأخت المرضعة خالة من الرضاعة لولدها من الثدي، وكذلك العمة من الرضاعة، فيثبت لهن التحريم في النكاح ويترتب على ذلك ما يترتب على الخالة والعمة النسبيتين."
  en: "The maternal milk-aunt is she who becomes forbidden through suckling as she is forbidden through lineage, by the verse — and your mothers who suckled you and your sisters through suckling — and by the report that what is forbidden by suckling is forbidden by lineage: the sister of the wet-nurse is a maternal milk-aunt to the child of her breast, and likewise the paternal milk-aunt, so the prohibition in marriage holds for them and what follows upon the blood aunt follows upon them."
  ur: "رضاعی خالہ وہ ہے جو دودھ پلانے سے حرام ہو جیسے نسب سے حرام ہوتی ہے — آیت کے مطابق: اور تمہاری وہ مائیں جنہوں نے تمہیں دودھ پلایا اور رضاعت میں تمہاری بہنیں — اور حدیث کے مطابق: دودھ سے وہی حرام ہوتا ہے جو نسب سے حرام ہوتا ہے؛ پس دایہ کی بہن اس کے بچے کی رضاعی خالہ ہے، اور اسی طرح رضاعی پھوپھی، تاکہ نکاح میں ان پر وہی تحریم ثابت ہو جو نسبی خالہ اور پھوپھی پر ہے۔"
  es: "La tía de leche materna es aquella que se vuelve prohibida por la lactancia como se le prohíbe por el linaje, según el versículo —y vuestras madres que os amamantaron a vosotros y a vuestras hermanas— y por el relato de que lo que se prohíbe por la lactancia se prohíbe por el linaje: la hermana de la nodriza es una tía de leche materna para el niño de su pecho, y de igual modo la tía de leche paterna, por lo que la prohibición en el matrimonio se aplica a ellas y lo que sigue a la tía de sangre se aplica a ellas."
