id: concept/zij-sabi-combined-lunar-equation-from-the-tables
class: concept
kind: scientific
label: { ar: "التعديل المركّب للقمر من الجداول", en: "The combined lunar equation from the tables", ur: "جداول سے چاند کا مرکب تعدیل", es: "La ecuación lunar combinada de las tablas", fr: "L'équation lunaire combinée des tables", tr: "Ayın tablolardan elde edilen bileşik ayarlaması", id: "Penyesuaian komposit bulan dari tabel" }
summary:
  ar: "يبين البتاني أن الحاصل من الجدول الثالث هو تعديل الخاصة، وأن الحاصل من الجدول الرابع هو تعديل البُعد، فإن كانت الخاصة المعدّلة أقل من مائة وثمانين درجة زِيد التعديل المركّب على وسط القمر، وإن كانت أكثر نُقص منه. {cite:zij-sabi-nallino-byblion p.112}."
  en: "Al-Battani explains that the figure from the third table is the equation of the anomaly and the figure from the fourth table is the equation of the elongation. If the corrected anomaly is less than a hundred and eighty degrees the composite equation is added to the Moon's mean place, and if it is more it is subtracted. {cite:zij-sabi-nallino-byblion p.112}."
  ur: "البتانی بتاتے ہیں کہ تیسرے جدول کا حاصل خاصے کا تعدیل ہے اور چوتھے جدول کا حاصل بُعد کا تعدیل۔ اگر تعدیل شدہ خاصہ ایک سو اسی درجے سے کم ہو تو مرکب تعدیل چاند کے اوسط میں جمع کیا جاتا ہے، اور زیادہ ہو تو گھٹایا جاتا ہے۔ {cite:zij-sabi-nallino-byblion p.112}۔"
  es: "Al-Battani explica que la cifra de la tercera tabla es la ecuación de la anomalía y la de la cuarta, la de la elongación. Si la anomalía corregida es menor de ciento ochenta grados, se suma la ecuación compuesta a la posición media de la Luna, y si es mayor, se resta. {cite:zij-sabi-nallino-byblion p.112}."
  fr: "Al-Battani explique que la valeur du troisième tableau correspond à l'équation de l'anomalie et celle du quatrième tableau à l'équation de l'élongation. Si l'anomalie corrigée est inférieure à 180 degrés, on ajoute l'équation composite à la position moyenne de la Lune; si elle est supérieure, on la soustrait. {cite:zij-sabi-nallino-byblion p.112}"
  tr: "El-Battani, üçüncü tablodan elde edilen sonucun özelliğin ayarlanması, dördüncü tablodan elde edilen sonucun ise mesafenin ayarlanması olduğunu açıklıyor. Ayarlanmış özellik yüz seksen dereceden az ise, birleşik ayarlama ayın merkezine eklenir; daha fazla ise, ondan çıkarılır. {cite:zij-sabi-nallino-byblion s.112}"
  id: "Al-Battani menjelaskan bahwa hasil dari tabel ketiga adalah penyesuaian properti, dan hasil dari tabel keempat adalah penyesuaian jarak. Jika properti yang disesuaikan kurang dari seratus delapan puluh derajat, penyesuaian gabungan ditambahkan ke pusat bulan, dan jika lebih, dikurangi darinya. {cite:zij-sabi-nallino-byblion p.112}."
