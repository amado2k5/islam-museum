id: concept/zij-sabi-combined-lunar-equation-from-the-tables
class: concept
kind: scientific
label: { ar: "التعديل المركّب للقمر من الجداول", en: "The combined lunar equation from the tables", ur: "جداول سے چاند کا مرکب تعدیل" }
summary:
  ar: "يبين البتاني أن الحاصل من الجدول الثالث هو تعديل الخاصة، وأن الحاصل من الجدول الرابع هو تعديل البُعد، فإن كانت الخاصة المعدّلة أقل من مائة وثمانين درجة زِيد التعديل المركّب على وسط القمر، وإن كانت أكثر نُقص منه. {cite:zij-sabi-nallino-byblion p.112}."
  en: "Al-Battani explains that the figure from the third table is the equation of the anomaly and the figure from the fourth table is the equation of the elongation. If the corrected anomaly is less than a hundred and eighty degrees the composite equation is added to the Moon's mean place, and if it is more it is subtracted. {cite:zij-sabi-nallino-byblion p.112}."
  ur: "البتانی بتاتے ہیں کہ تیسرے جدول کا حاصل خاصے کا تعدیل ہے اور چوتھے جدول کا حاصل بُعد کا تعدیل۔ اگر تعدیل شدہ خاصہ ایک سو اسی درجے سے کم ہو تو مرکب تعدیل چاند کے اوسط میں جمع کیا جاتا ہے، اور زیادہ ہو تو گھٹایا جاتا ہے۔ {cite:zij-sabi-nallino-byblion p.112}۔"
