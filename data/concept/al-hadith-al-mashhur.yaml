id: concept/al-hadith-al-mashhur
class: concept
kind: term
label: { ar: "الحديث المشهور", en: "The well-known report (mashhur)", ur: "مشہور حدیث" }
term: { ar: "المشهور؛ والمستفيض عند جماعة من الفقهاء", en: "al-mashhur; al-mustafid" }
summary:
  ar: "المشهور عند المحدثين ما له طرق محصورة بأكثر من اثنين ولم يبلغ التواتر، وهو أول أقسام الآحاد في «نزهة النظر»؛ سمي بذلك لوضوحه، وهو المستفيض عند جماعة من الفقهاء، ومنهم من فرّق بينهما؛ ويطلق المشهور أيضاً على ما اشتهر على الألسنة ولو لم يكن له إسناد {cite:nuzhat-al-nazar-itr-bushra-2011 p. 42-43}."
  en: "Among hadith scholars the mashhur is a report with a limited number of chains above two that does not reach mass transmission, the first kind of solitary report in Nuzhat al-Nazar; it is so called for its clarity, some jurists call it mustafid, others distinguish the two, and the word is also used for what is current on people's tongues even without a chain {cite:nuzhat-al-nazar-itr-bushra-2011 p. 42-43}."
  ur: "محدثین کے نزدیک مشہور وہ حدیث ہے جس کے دو سے زیادہ محدود طرق ہوں اور تواتر تک نہ پہنچے، اور یہ «نزہۃ النظر» میں آحاد کی پہلی قسم ہے؛ اسے وضوح کی وجہ سے یہ نام دیا گیا، بعض فقہا اسے مستفیض کہتے ہیں، بعض دونوں میں فرق کرتے ہیں، اور یہ لفظ ان باتوں کے لیے بھی بولا جاتا ہے جو زبانوں پر مشہور ہوں چاہے ان کی کوئی سند نہ ہو {cite:nuzhat-al-nazar-itr-bushra-2011 p. 42-43}۔"
