id: concept/itqan-fil-amal
class: concept
kind: ethical
tags: [akhlaq-browser, akhlaq-itqan]
label:
  ar: "إتقان العمل"
  en: "Doing work well (itqan al-amal)"
  ur: "کام میں اتقان"
  es: "Hacer bien el trabajo (itqan al-amal)"
  fr: "Bien travailler (itqan al-amal)"
summary:
  ar: "يتناول الشيخ عمر عبد الكافي إتقان العمل وأداء الواجب تجاه جهة العمل بوصفهما من الأمانة والعبادة، ويقارن بين الموظف المخلص الذي يحرص على وقته وراتبه والموظف الذي يؤدي الحد الأدنى، ويذكر التأخر عن العمل وخدمة الناس بالعمل."
  en: "Sheikh Omar Abdelkafy's teaching on doing work well and fulfilling one's duty to the employer, as part of trust and worship: he compares a sincere employee who guards his time and salary with one who does the minimum, and speaks of lateness at work and of work done in the service of people."
  ur: "شیخ عمر عبدالکافی کی تعلیم: کام کو اچھی طرح انجام دینا اور ادارے کا حق ادا کرنا، امانت اور عبادت کے طور پر۔ وہ اس ملازم کا موازنہ کرتے ہیں جو اپنے وقت اور تنخواہ کا خیال رکھتا ہے، اس ملازم سے جو کم سے کم کام کرتا ہے، اور کام میں تاخیر اور لوگوں کی خدمت کے طور پر کام کی بات کرتے ہیں۔"
  es: "La enseñanza del jeque Omar Abdelkafy sobre cómo hacer bien el trabajo y cumplir con el deber para con el empleador, como parte de la confianza y la veneración, consiste en comparar a un empleado sincero que cuida su tiempo y su salario con uno que hace lo mínimo, y habla de la impuntualidad en el trabajo y del trabajo realizado al servicio de los demás."
  fr: "L'enseignement du cheikh Omar Abdelkafy sur le fait de bien faire son travail et de remplir ses devoirs envers son employeur, dans le cadre de la confiance et du culte: il compare un employé sincère qui préserve son temps et son salaire à celui qui se contente du minimum, et parle des retards au travail et du travail accompli au service des autres."
