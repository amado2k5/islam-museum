label:
  ar: "إتقان العمل"
  en: "Doing work well (itqan al-amal)"
  ur: "کام میں اتقان"
summary:
  ar: "يتناول الشيخ عمر عبد الكافي إتقان العمل وأداء الواجب تجاه جهة العمل بوصفهما من الأمانة والعبادة، ويقارن بين الموظف المخلص الذي يحرص على وقته وراتبه والموظف الذي يؤدي الحد الأدنى، ويذكر التأخر عن العمل وخدمة الناس بالعمل."
  en: "Sheikh Omar Abdelkafy's teaching on doing work well and fulfilling one's duty to the employer, as part of trust and worship: he compares a sincere employee who guards his time and salary with one who does the minimum, and speaks of lateness at work and of work done in the service of people."
  ur: "شیخ عمر عبدالکافی کی تعلیم: کام کو اچھی طرح انجام دینا اور ادارے کا حق ادا کرنا، امانت اور عبادت کے طور پر۔ وہ اس ملازم کا موازنہ کرتے ہیں جو اپنے وقت اور تنخواہ کا خیال رکھتا ہے، اس ملازم سے جو کم سے کم کام کرتا ہے، اور کام میں تاخیر اور لوگوں کی خدمت کے طور پر کام کی بات کرتے ہیں۔"
