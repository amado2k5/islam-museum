id: "concept/intithar-sha-r-al-ayn"
class: "concept"
kind: "scientific"
label:
  ar: "انتثار شعر العين"
  en: "Shedding of the eyelashes (intithar sha'r al-'ayn)"
  ur: "پلک کے بالوں کا جھڑنا"
  es: "Caída de las pestañas (intithar sha'r al-'ayn)"
  fr: "Chute des cils (intithar sha'r al-'ayn)"
summary:
  ar: "ينتثر شعر العين إما بسبب المادة إن قلت كآخر الأمراض الحادة الصعبة أو فسدت كداء الثعلب، وإما بسبب الموضع إن كانت آفة ظاهرة من صلابة أو ورم أو تأكل يدل عليه حمرة ولذع شديد {cite:canon-ibn-sina-print-v2 p.199}"
  en: "The eyelashes shed either from a failure of matter — its scarcity as at the end of severe acute diseases, or its corruption as in alopecia — or from a local lesion: a manifest hardness, swelling or corrosion, indicated by redness and strong stinging {cite:canon-ibn-sina-print-v2 p.199}"
  ur: "پلک کے بال یا تو مادہ کی وجہ سے جھڑتے ہیں — اس کی قلت جیسے سخت حاد امراض کے آخر میں، یا اس کا فساد جیسے داء الثعلب میں — یا مقام کی وجہ سے: ظاہر سختی، ورم یا کھایا ہوا حصہ، جس کی علامت سرخی اور تیز جھنکار ہے {cite:canon-ibn-sina-print-v2 p.199}۔"
  es: "Las pestañas se caen bien por una deficiencia de materia —su escasez, como al final de enfermedades agudas graves, o su corrupción, como en la alopecia— o bien por una lesión local: una dureza, hinchazón o corrosión manifiesta, indicada por enrojecimiento y fuerte escozor {cite:canon-ibn-sina-print-v2 p.199}"
  fr: "La chute des cils est due soit à une défaillance de la matière — sa rareté comme à la fin de maladies aiguës graves, ou sa corruption comme dans l'alopécie — soit à une lésion locale: une induration, un gonflement ou une corrosion manifeste, indiqués par une rougeur et une forte sensation de brûlure {cite:canon-ibn-sina-print-v2 p.199}"
