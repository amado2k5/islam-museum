tags: [bunuwwa-browser]
kind: ethical
label:
  ar: البر
  en: Righteousness (birr)
  fr: "Droiture (birr)"
  es: "Rectitud (birr)"
  ur: "راستبازی ⁦(برر)⁩"
  tr: "Arazi"
  id: "Tanah"
summary:
  ar: "البر والإثم في الحديث السابع والعشرين من الأربعين معرفتان تعريفاً وجدانياً مع الخلق: ففي حديث النواس بن سمعان عند مسلم (2553) «البر حسن الخلق، والإثم ما حاك في نفسك وكرهت أن يطلع عليه الناس» — فالبر محض خلق، والإثم قلق داخلي مع كراهية اطلاع الناس عليه؛ وفي حديث وابصة بن معبد عند أحمد والدارمي جاء الأمر «استفت نفسك» ونكت بأصابعه الثلاث في صدره: البر ما اطمأن إليه القلب واطمأنت إليه النفس، والإثم ما حاك في القلب وتردد في الصدر وإن أفتاك الناس وأفتوك — فجعل استقرار النفس وانشراح الصدر علامة للبر وترددهما علامة للإثم حتى مع فتيا المفتين؛ وتؤيده طريق أبي أمامة «إذا حاك في صدرك شيء فدعه» وطريق أبي ثعلبة الخشني في سكون النفس واطمئنان القلب ولو مع فتوى المفتين، وكلا الإسنادين جيد عند ابن رجب."
  en: "In the twenty-seventh hadith of the Forty, righteousness (birr) and sin (ithm) are defined through conscience and character together: in al-Nawwas ibn Sam'an's report in Muslim (2553), 'righteousness is good character, and sin is what wavers in your soul and you dislike for people to see it' — righteousness reduced to sheer character, and sin marked by inner unease joined to dislike of public exposure; and in Wabisa ibn Ma'bad's report in Ahmad and al-Darimi, the Prophet commanded 'consult your own soul' while poking his chest with three fingers: righteousness is what the heart and soul are at peace with, and sin is what wavers in the heart and hesitates in the breast even if people give verdict upon verdict — inner rest and expansiveness made the sign of righteousness, and inner hesitation the sign of sin even against the muftis' rulings; Abu Umama's route 'if something wavers in your breast, leave it' and Abu Tha'laba al-Khushani's report on the soul resting and the heart being at peace even in the face of muftis' verdicts corroborate it, both chains sound for Ibn Rajab."
  fr: "Dans le vingt-septième hadith des Quarante, droiture (birr) et péché (ithm) sont définis par conscience et caractère. Le récit d’al-Nawwas ibn Sam'an chez Muslim (2553) associe droiture et bon caractère, péché et trouble intérieur qu’on déteste exposer. Celui de Wabisa ibn Ma'bad chez Ahmad et al-Darimi invite à consulter son âme, le Prophète touchant sa poitrine de trois doigts : la droiture apaise cœur et âme, le péché les trouble malgré les avis successifs qui le permettent. Paix intérieure et ouverture signalent ainsi la droiture, hésitation le péché, même contre les muftis. Les voies d’Abu Umama, invitant à délaisser ce qui trouble la poitrine, et d’Abu Tha'laba al-Khushani, sur l’apaisement malgré les fatwas, le corroborent ; Ibn Rajab juge les deux chaînes solides."
  es: "En el vigésimo séptimo hadiz de los Cuarenta, la rectitud (birr) y el pecado (ithm) se definen a través de la conciencia y el carácter juntos: en el relato de al-Nawwas ibn Sam'an en Muslim (2553), 'la rectitud es buen carácter, y el pecado es lo que vacila en tu alma y no te gusta que la gente lo vea' — la rectitud reducida al carácter puro, y el pecado marcado por la inquietud interior unida al desagrado de la exposición pública; y en el relato de Wabisa ibn Ma'bad en Ahmad y al-Darimi, el Profeta ordenó 'consulta tu propia alma' mientras se tocaba el pecho con tres dedos: la rectitud es con lo que el corazón y el alma están en paz, y el pecado es lo que vacila en el corazón y duda en el pecho incluso si la gente da veredicto tras veredicto — el descanso interior y la expansión hicieron de la señal de rectitud, y la vacilación interior la señal de pecado incluso en contra de las decisiones de los muftíes; La ruta de Abu Umama, que dice \"si algo vacila en tu pecho, déjalo\", y el relato de Abu Tha'laba al-Khushani sobre el descanso del alma y la paz del corazón incluso ante los veredictos de los muftíes lo corroboran; ambas cadenas son fiables para Ibn Rajab."
  ur: "چالیسویں حدیث کی ستائیسویں حدیث میں نیکی اور گناہ کو ایک ساتھ ضمیر اور کردار کے ذریعے بیان کیا گیا ہے: مسلم (2553) میں النواس بن سمعان کی رپورٹ میں ہے کہ 'نیکی اچھا کردار ہے، اور گناہ وہ ہے جو آپ کے دل میں ڈگمگاتا ہے اور آپ اسے ناپسند کرتے ہیں - لوگوں کے لیے نیکی اور کردار کو کم کرنا'۔ عوامی نمائش کی ناپسندیدگی میں شامل ہونے والی اندرونی بے چینی سے نشان زد؛ اور احمد و الدارمی میں وبیصہ بن معبد کی روایت میں ہے کہ نبی نے اپنے سینے کو تین انگلیوں سے ٹھونستے ہوئے اپنے نفس سے مشورہ کرنے کا حکم دیا: نیکی وہ ہے جس سے دل و جان کو سکون ملے، اور گناہ وہ ہے جس سے دل میں لرزش پیدا ہو اور سینہ میں ہچکچاہٹ پیدا ہو، خواہ لوگ حق پر فیصلہ دیں، سکون اور عدل پر۔ اور باطنی ہچکچاہٹ مفتیوں کے احکام کے خلاف بھی گناہ کی علامت ہے۔ ابو امامہ کا راستہ 'اگر کوئی چیز تمہارے سینے میں ڈگمگاتی ہے تو اسے چھوڑ دو' اور ابو ثعلبہ خشنی کی روح کے سکون اور مفتیوں کے فیصلوں کے باوجود دل کے سکون کے بارے میں رپورٹ اس کی تصدیق کرتی ہے، ابن رجب کے لیے دونوں زنجیریں لگتی ہیں۔"
  tr: "Kırk hadisin yirmi yedincisindeki doğruluk ve günah, yaratılışla ilgili iki duygusal tanımdır: Müslüman'daki El-Nuwas bin Sam'an'ın (2553) hadisinde \"Doğruluk iyi karakterdir, günah ise kendine ördüğün ve insanların görmesini istemediğin şeydir.\" — doğruluk tamamen bir karakterdir, günah ise insanların onu görmekten hoşlanmamasıyla birlikte içsel bir kaygıdır; ve Vebaseh ibn Ma'bad'ın Ahmed ve El-Derimi ile hadislerinde şu emir geçer: \"Kendine danış,\" ve üç parmağıyla göğsüne işaret etti: Doğruluk, kalbin rahatladığı ve ruhun teselli verdiği şeydir; günah ise kalbe işlenip göğste tereddüt eden şeydir; insanlar sana fetva verse ve fetva verse bile—bu yüzden ruhun istikrarını ve kalbin açılmasını doğruluk işareti, tereddüdüt ise günah işareti yaptı, hatta müftülerin fetvalarıyla bile. Bu, Ebu Umem'in (göğsüne bir şey dokunmuşsa, bırak) ve Ebu Tehaleba el-Haşni'nin ruhu ve huzuru yatıştırma yolu, hatta müfti fetvalarıyla bile desteklenir. İbn Receb'e göre her iki aktarım zinciri de iyidir."
  id: "Kebenaran dan dosa dalam hadis kedua puluh tujuh dari empat puluh hadis adalah dua definisi emosional dalam penciptaan: Dalam hadis Al-Nuwas ibn Sam'an dalam Muslim (2553), \"Kebenaran adalah watak yang baik, dan dosa adalah apa yang telah kamu tenun dalam dirimu dan tidak suka dilihat orang.\" — kebenaran murni sebuah karakter, dan dosa adalah kecemasan batin bersama dengan ketidaksukaan orang untuk melihatnya; dan dalam hadis Wabasah ibn Ma'bad bersama Ahmad dan Al-Darimi, perintah disebutkan: \"Berkonsultasilah dengan dirimu sendiri,\" dan dia menunjuk dengan tiga jarinya di dadanya: Kebenaran adalah apa yang hati temukan sebagai jaminan dan jiwa menenangkan, sedangkan dosa adalah apa yang terjalin ke dalam hati dan diragukan di dada, meskipun orang memberi fatwa dan fatwa—maka dia menjadikan kestabilan jiwa dan pembukaan hati sebagai tanda kebenaran, dan keraguan mereka sebagai tanda dosa, bahkan dengan fatwa mufti. Hal ini didukung oleh pandangan Abu Umamah (jika sesuatu terjalin di dadamu, tinggalkan), dan cara Abu Tha'labah al-Khashni dalam menenangkan jiwa dan ketenangan hati, bahkan dengan fatwa mufti. Kedua rantai transmisi itu baik menurut Ibn Rajab."
