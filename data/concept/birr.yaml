id: concept/birr
class: concept
kind: ethical
label:
  ar: البر
  en: Righteousness (birr)
summary:
  ar: "البر والإثم في الحديث السابع والعشرين من الأربعين معرفتان تعريفاً وجدانياً مع الخلق: ففي حديث النواس بن سمعان عند مسلم (2553) «البر حسن الخلق، والإثم ما حاك في نفسك وكرهت أن يطلع عليه الناس» — فالبر محض خلق، والإثم قلق داخلي مع كراهية اطلاع الناس عليه؛ وفي حديث وابصة بن معبد عند أحمد والدارمي جاء الأمر «استفت نفسك» ونكت بأصابعه الثلاث في صدره: البر ما اطمأن إليه القلب واطمأنت إليه النفس، والإثم ما حاك في القلب وتردد في الصدر وإن أفتاك الناس وأفتوك — فجعل استقرار النفس وانشراح الصدر علامة للبر وترددهما علامة للإثم حتى مع فتيا المفتين؛ وتؤيده طريق أبي أمامة «إذا حاك في صدرك شيء فدعه» وطريق أبي ثعلبة الخشني «البر ما سكنت إليه النفس واطمأن إليه القلب… وإن أفتاك المفتون»، وكلا الإسنادين جيد عند ابن رجب."
  en: "In the twenty-seventh hadith of the Forty, righteousness (birr) and sin (ithm) are defined through conscience and character together: in al-Nawwas ibn Sam'an's report in Muslim (2553), 'righteousness is good character, and sin is what wavers in your soul and you dislike for people to see it' — righteousness reduced to sheer character, and sin marked by inner unease joined to dislike of public exposure; and in Wabisa ibn Ma'bad's report in Ahmad and al-Darimi, the Prophet commanded 'consult your own soul' while poking his chest with three fingers: righteousness is what the heart and soul are at peace with, and sin is what wavers in the heart and hesitates in the breast even if people give verdict upon verdict — inner rest and expansiveness made the sign of righteousness, and inner hesitation the sign of sin even against the muftis' rulings; Abu Umama's route 'if something wavers in your breast, leave it' and Abu Tha'laba al-Khushani's 'righteousness is what the soul rests in and the heart is at peace with … even if the muftis give you verdicts' corroborate it, both chains sound for Ibn Rajab."
