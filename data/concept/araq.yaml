label:
  ar: "العَرَق"
  en: "Sweat and its ruling on purity (araq)"
  fr: "La sueur et son statut de pureté (araq)"
  ur: "عرق"
  es: "El sudor y su dictamen sobre la pureza (araq)"
summary:
  ar: "العرق في اللغة ما يجري من أصول الشعر من ماء الجلد، ويستعمله الفقهاء بمعنيين: ما يرشح من البدن، ونوع من المسكرات يقطر من الخمر {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11568}. وعرق الإنسان طاهر عند الفقهاء مطلقاً، لا فرق بين المسلم والكافر، أو الصاحي والسكران، أو الطاهر والحائض والجنب {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11569}. وفي عرق الحيوان قسم الحنفية الأعراق إلى طاهر ونجس ومكروه ومشكوك فيه، فالطاهر عرق المأكول والفرس، والنجس عرق الكلب والخنزير وسباع البهائم، والمكروه عرق الهرة والدجاجة المخلاة وسباع الطير وسواكن البيوت، والمشكوك فيه عرق الحمار والبغل {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11569} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11570}. وذهب المالكية إلى طهارة عرق كل حيوان حي، والشافعية والحنابلة يجعلون حكم العرق تابعاً لحكم الحيوان، مع اختلافهم في تحديد الحيوانات النجسة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11570} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11571}. وأما العرق المستقطر من الخمر فحكمه حكم الخمر، فهو نجس، ويحد شاربه، وعليه المعتمد عند الحنفية {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11571}."
  en: "In the lexicon, araq is the water that flows from the roots of the hair through the skin. Jurists use it in two senses: what exudes from the body, and a spirit distilled from wine {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11568}. Human sweat is pure for all jurists, whether from a Muslim or a non-Muslim, a sober or intoxicated person, or someone in a state of menstruation or major impurity {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11569}. For animal sweat the Hanafis divide it into pure, impure, disliked and doubtful: pure is that of edible animals and the horse; impure that of the dog, the pig and predatory beasts; disliked that of the cat, a free hen, predatory birds and house vermin; doubtful that of the donkey and the mule {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11569} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11570}. The Malikis hold that the sweat of every living animal is pure, whether it lives on land or sea and even if it is a dog or a pig {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11570}. The Shafi'is and Hanbalis make the sweat follow the animal: pure if the animal is pure; the Shafi'is treat all animals as pure except the dog and the pig, and the Hanbalis list the impure animals by name {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11570} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11571}. The spirit distilled from wine has the ruling of wine: it is impure, and whoever drinks it is liable to the prescribed punishment, which on the preferred view applies even to a single drop {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11571}."
  fr: "Dans le lexique, araq désigne l’eau qui s’écoule depuis la racine des poils à travers la peau. Les juristes l’emploient dans deux sens : ce qui suinte du corps et un alcool distillé à partir du vin {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11568}. La sueur humaine est pure pour tous les juristes, qu’elle provienne d’un musulman ou d’un non-musulman, d’une personne sobre ou ivre, ou d’une personne en état de menstruation ou d’impureté majeure {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11569}. Pour la sueur animale, les hanafites distinguent le pur, l’impur, le réprouvé et le douteux : celle des animaux comestibles et du cheval est pure ; celle du chien, du porc et des bêtes prédatrices est impure ; celle du chat, de la poule laissée en liberté, des oiseaux de proie et de la vermine domestique est réprouvée ; celle de l’âne et du mulet est douteuse {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11569} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11570}. Les malikites considèrent la sueur de tout animal vivant comme pure, qu’il vive sur terre ou en mer, même s’il s’agit d’un chien ou d’un porc {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11570}. Les chaféites et les hanbalites font dépendre le statut de la sueur de celui de l’animal : elle est pure si l’animal est pur ; les chaféites considèrent tous les animaux comme purs à l’exception du chien et du porc, tandis que les hanbalites énumèrent nommément les animaux impurs {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11570} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11571}. L’alcool distillé à partir du vin relève de la même règle que le vin : il est impur, et quiconque en boit est passible de la peine prescrite, qui s’applique, selon l’avis privilégié, même pour une seule goutte {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11571}."
  es: "En el léxico, araq es el agua que fluye desde las raíces del cabello a través de la piel. Los juristas lo usan en dos sentidos: lo que exuda del cuerpo y un espíritu destilado del vino {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11568}. El sudor humano es puro para todos los juristas, ya sea de un musulmán o un no musulmán, una persona sobria o intoxicada, o alguien en estado de menstruación o impureza mayor {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11569}. Para el sudor animal, los hanafíes lo dividen en puro, impuro, desagradable y dudoso: puro es el de los animales comestibles y el caballo; impuro el del perro, el cerdo y las bestias depredadoras; desagradable el del gato, una gallina libre, aves depredadoras y alimañas domésticas; dudoso que el del asno y la mula {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11569} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11570}. Los malikíes sostienen que el sudor de todo animal vivo es puro, ya sea que viva en tierra o mar e incluso si es un perro o un cerdo {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11570}. Los shafi'ís y hanbalíes hacen que el sudor siga al animal: puro si el animal es puro; Los shafi'ís consideran puros a todos los animales excepto al perro y al cerdo, y los hanbalíes enumeran los animales impuros por nombre {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11570} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11571}. El aguardiente destilado del vino tiene la misma regla que el vino: es impuro, y quien lo bebe es responsable del castigo prescrito, que según la opinión preferida se aplica incluso a una sola gota {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11571}."
  ur: "لغت میں عرق وہ پانی ہے جو بالوں کی جڑوں سے جلد کے ذریعے بہتا ہے۔ فقہاء اسے دو معنوں میں استعمال کرتے ہیں: جسم سے کیا نکلتا ہے، اور شراب سے کشید روح انسانی پسینہ تمام فقہاء کے لیے پاک ہے، خواہ وہ مسلمان ہو یا غیر مسلم، نفیس ہو یا نشہ میں مبتلا ہو، یا حیض کی حالت میں ہو یا بڑی نجاست میں ہو۔ حنفیہ جانوروں کے پسینے کے لیے اسے خالص، ناپاک، ناپسندیدہ اور مشتبہ میں تقسیم کرتے ہیں: خالص کھانے والے جانور اور گھوڑے کا۔ کتے، سور اور شکاری درندوں کی ناپاک۔ بلی، ایک آزاد مرغی، شکاری پرندے اور گھریلو کیڑے کو ناپسند کیا۔ گدھے اور خچر کے بارے میں شک ہے {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 11569} مالکیوں کا خیال ہے کہ ہر جاندار کا پسینہ پاک ہے خواہ وہ خشکی پر رہتا ہو یا سمندر میں اور خواہ کتا ہو یا سور۔ شافعی اور حنبلی پسینہ کو جانور کے پیچھے کرتے ہیں: اگر جانور پاک ہو تو پاک۔ شافعی کتے اور خنزیر کے علاوہ تمام جانوروں کو پاک سمجھتے ہیں اور حنبلی ناپاک جانوروں کو نام کے ساتھ درج کرتے ہیں۔ شراب سے کشید کی جانے والی روح میں شراب کا حکم ہے: وہ نجس ہے، اور جو اسے پیتا ہے اس پر مقررہ سزا ہے، جو کہ ترجیحی نقطہ نظر سے ایک قطرہ پر بھی لاگو ہوتی ہے۔"
