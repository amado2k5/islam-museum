  en: "Sweat and its ruling on purity (araq)"
  ur: "عرق"
summary:
  ar: "العرق في اللغة ما يجري من أصول الشعر من ماء الجلد، ويستعمله الفقهاء بمعنيين: ما يرشح من البدن، ونوع من المسكرات يقطر من الخمر {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11568}. وعرق الإنسان طاهر عند الفقهاء مطلقاً، لا فرق بين المسلم والكافر، أو الصاحي والسكران، أو الطاهر والحائض والجنب {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11569}. وفي عرق الحيوان قسم الحنفية الأعراق إلى طاهر ونجس ومكروه ومشكوك فيه، فالطاهر عرق المأكول والفرس، والنجس عرق الكلب والخنزير وسباع البهائم، والمكروه عرق الهرة والدجاجة المخلاة وسباع الطير وسواكن البيوت، والمشكوك فيه عرق الحمار والبغل {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11569} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11570}. وذهب المالكية إلى طهارة عرق كل حيوان حي، والشافعية والحنابلة يجعلون حكم العرق تابعاً لحكم الحيوان، مع اختلافهم في تحديد الحيوانات النجسة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11570} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11571}. وأما العرق المستقطر من الخمر فحكمه حكم الخمر، فهو نجس، ويحد شاربه، وعليه المعتمد عند الحنفية {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11571}."
  en: "In the lexicon, araq is the water that flows from the roots of the hair through the skin. Jurists use it in two senses: what exudes from the body, and a spirit distilled from wine {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11568}. Human sweat is pure for all jurists, whether from a Muslim or a non-Muslim, a sober or intoxicated person, or someone in a state of menstruation or major impurity {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11569}. For animal sweat the Hanafis divide it into pure, impure, disliked and doubtful: pure is that of edible animals and the horse; impure that of the dog, the pig and predatory beasts; disliked that of the cat, a free hen, predatory birds and house vermin; doubtful that of the donkey and the mule {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11569} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11570}. The Malikis hold that the sweat of every living animal is pure, whether it lives on land or sea and even if it is a dog or a pig {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11570}. The Shafi'is and Hanbalis make the sweat follow the animal: pure if the animal is pure; the Shafi'is treat all animals as pure except the dog and the pig, and the Hanbalis list the impure animals by name {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11570} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11571}. The spirit distilled from wine has the ruling of wine: it is impure, and whoever drinks it is liable to the prescribed punishment, which on the preferred view applies even to a single drop {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11571}."
