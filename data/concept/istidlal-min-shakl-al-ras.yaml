id: concept/istidlal-min-shakl-al-ras
class: concept
kind: scientific
label:
  ar: "الاستدلال من شكل الرأس"
  en: "Inference from the shape of the head"
  ur: "سر کی شکل سے استدلال"
  es: "Inferencia a partir de la forma de la cabeza"
summary:
  ar: "يرجع ابن سينا في شكل الرأس إلى باب عظم القحف، ويقول إن رداءة الشكل في جزء تضر بخواص أفعال ذلك الجزء من الدماغ، ناقلاً عن جالينوس {cite:canon-ibn-sina-print-v2 p.19}"
  en: "Ibn Sina refers the shape of the head to the chapter on the bone of the skull and says that badness of shape in a part harms the particular acts of that part of the brain, reporting Galen {cite:canon-ibn-sina-print-v2 p.19}"
  ur: "ابن سینا سر کی شکل کے لیے کھوپڑی کی ہڈی کے باب کا حوالہ دیتا ہے اور کہتا ہے کہ کسی حصے میں شکل کی خرابی دماغ کے اس حصے کے مخصوص افعال کو نقصان دیتی ہے، جالینوس سے نقل کرتے ہوئے {cite:canon-ibn-sina-print-v2 p.19}۔"
  es: "Ibn Sina hace referencia a la forma de la cabeza en el capítulo sobre el hueso del cráneo y afirma que una mala forma en una parte perjudica las funciones específicas de esa parte del cerebro, citando a Galeno {cite:canon-ibn-sina-print-v2 p.19}."
