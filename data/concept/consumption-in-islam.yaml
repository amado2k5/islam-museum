label:
  ar: "ضوابط الاستهلاك"
  en: "Rules of consumption"
  es: "Reglas de consumo"
  fr: "Règles de consommation"
  ur: "کھپت کے قواعد"
  tr: "Tüketim kontrolleri"
  id: "Kontrol konsumsi"
summary:
  ar: "يضع المؤلف للاستهلاك ضوابط تبدأ بالنفس ثم الأهل ثم الأقارب ثم المحتاجين، وتراعي ترتيب الضروريات والحاجيات والتحسينيات، ولا تشمل المحرمات كالحرير والذهب للرجال وآنية الذهب والفضة، وتقع بين التقتير والإسراف، وتتحدد بالقدرة المالية {cite:usul-iqtisad-islami-0660 p. 183} {cite:usul-iqtisad-islami-0660 p. 184}."
  tr: "Yazar, tüketim için önce kendisi, sonra aile, sonra akrabalar, sonra ihtiyaç sahipleri ile başlar; ihtiyaçların, ihtiyaçların ve iyileştirmelerin düzenlenmesini dikkate alır. Bu kurallar ipek, erkekler için altın veya altın ve gümüş kaplar gibi yasakları içermez. Cimrilik ile savurganlık arasında kalır ve maddi yetenek ile belirlenir {cite:usul-iqtisad-islami-0660 s. 183} {cite:usul-iqtisad-islami-0660 s. 184}."
  id: "Penulis menetapkan aturan konsumsi mulai dari diri sendiri, kemudian keluarga, kemudian kerabat, kemudian mereka yang membutuhkan, dengan mempertimbangkan pengaturan kebutuhan, kebutuhan, dan perbaikan. Aturan tersebut tidak mencakup larangan seperti sutra, emas untuk pria, atau wadah emas dan perak. Aturan tersebut berada di antara kepelitan dan kemewahan, dan ditentukan oleh kemampuan finansial {cite:usul-iqtisad-islami-0660 hlm. 183} {cite:usul-iqtisad-islami-0660 hlm. 184}."
