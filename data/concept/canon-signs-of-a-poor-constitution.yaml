id: concept/canon-signs-of-a-poor-constitution
class: concept
kind: scientific
label:
  ar: "علامات سوء الخلقة عند ابن سينا"
  en: "Signs of a poorly formed constitution in the Canon"
  fr: "Signes d’une constitution mal formée dans le Canon"
  ur: "بری ساخت کی علامات قانون میں"
  es: "Signos de una constitución mal formada en el Canon"
summary:
  ar: "في الفصل الخامس يصف ابن سينا من ليس جيد الحال في خلقته، وهو من لا تتشابه أمزجة أعضائه، ويربط بين تفاوت بنيته وردائة فهمه وعقله {cite:canon-ibn-sina-print-v1 p.164}."
  en: "In the fifth chapter Ibn Sina describes the person whose constitution is not good, one whose organs do not share a like temperament, and ties the unevenness of build to poor understanding and intellect {cite:canon-ibn-sina-print-v1 p.164}."
  fr: "Au chapitre 5, Ibn Sina décrit la constitution jugée mauvaise, dont les organes n’ont pas un tempérament semblable, et relie disproportion corporelle et faiblesse de compréhension et d’intellect {cite:canon-ibn-sina-print-v1 p.164}."
  es: "En el quinto capítulo, Ibn Sina describe a la persona cuya constitución no es buena, aquella cuyos órganos no comparten un temperamento similar, y relaciona la asimetría de la constitución con una comprensión e intelecto deficientes {cite:canon-ibn-sina-print-v1 p.164}."
  ur: "پانچویں باب میں ابن سینا نے اس شخص کی وضاحت کی ہے جس کا آئین اچھا نہیں ہے، جس کے اعضاء ایک جیسا نہیں ہیں، اور تعمیر کی ناہمواری کو ناقص فہم و دانش سے جوڑتا ہے {حوالہ: کینون ابن سینا پرنٹ-v1 صفحہ 164}۔"
