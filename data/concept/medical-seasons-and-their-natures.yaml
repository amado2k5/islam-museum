summary:
  ar: "يبين ابن سينا أن الفصول عند الأطباء غيرها عند المنجمين، فالربيع هو الزمان الذي لا يحوج في البلاد المعتدلة إلى إدفاء أو ترويح يعتد به، ومزاجه المعتدل، والصيف حار يابس، والشتاء بارد رطب، والخريف قريب من الاعتدال في الحرارة وغير معتدل في الرطوبة {cite:canon-ibn-sina-print-v1 pp.114-117}."
  en: "Ibn Sina shows that the seasons of the physicians differ from those of the astronomers: spring is the time that in temperate lands needs no notable warming or ventilation and its temperament is the moderate, summer is hot and dry, winter cold and moist, and autumn near moderate in heat but not in moisture {cite:canon-ibn-sina-print-v1 pp.114-117}."
