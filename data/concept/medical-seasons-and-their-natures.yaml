id: concept/medical-seasons-and-their-natures
class: concept
kind: scientific
label: { ar: "الفصول وطباعها عند الأطباء عند ابن سينا", en: "The medical seasons and their natures in the Canon", ur: "قانون میں اطبا کے موسم اور ان کی طبیعتیں", es: "Las estaciones médicas y su naturaleza en el Canon", fr: "Les saisons médicales et leur nature dans le Canon" }
summary:
  ar: "يبين ابن سينا أن الفصول عند الأطباء غيرها عند المنجمين، فالربيع هو الزمان الذي لا يحوج في البلاد المعتدلة إلى إدفاء أو ترويح يعتد به، ومزاجه المعتدل، والصيف حار يابس، والشتاء بارد رطب، والخريف قريب من الاعتدال في الحرارة وغير معتدل في الرطوبة {cite:canon-ibn-sina-print-v1 pp.114-117}."
  en: "Ibn Sina shows that the seasons of the physicians differ from those of the astronomers: spring is the time that in temperate lands needs no notable warming or ventilation and its temperament is the moderate, summer is hot and dry, winter cold and moist, and autumn near moderate in heat but not in moisture {cite:canon-ibn-sina-print-v1 pp.114-117}."
  es: "Ibn Sina muestra que las estaciones de los médicos difieren de las de los astrónomos: la primavera es la época que en tierras templadas no necesita calentamiento ni ventilación notables y su temperamento es moderado, el verano es caluroso y seco, el invierno frío y húmedo, y el otoño es casi moderado en calor pero no en humedad {cite:canon-ibn-sina-print-v1 pp.114-117}."
  fr: "Ibn Sina montre que les saisons des médecins diffèrent de celles des astronomes: le printemps est la saison qui, dans les pays tempérés, ne nécessite aucun réchauffement ni ventilation notable et dont le tempérament est modéré, l'été est chaud et sec, l'hiver froid et humide, et l'automne est presque modéré en chaleur mais pas en humidité {cite:canon-ibn-sina-print-v1 pp.114-117}."
  ur: "ابن سینا سے پتہ چلتا ہے کہ ماہرین فلکیات کے موسموں سے طبیبوں کے موسم مختلف ہیں: موسم بہار وہ وقت ہے جب معتدل زمینوں میں کسی قابل ذکر گرمی یا ہوا کی ضرورت نہیں ہوتی ہے اور اس کا مزاج معتدل ہے، گرما گرم اور خشک، موسم سرما میں سرد اور مرطوب، اور خزاں گرمی میں اعتدال کے قریب ہے لیکن نمی میں نہیں ہے: صفحہ 114-117}۔"
