label:
  ar: "أسباب الصرع"
  en: "Causes of epilepsy"
  fr: "Causes de l’épilepsie"
  ur: "صرع کے اسباب"
summary:
  ar: "أسباب الصرع عند ابن سينا: خلط غير كامل يحدث سدّة في بطن الدماغ أو أصول منابت العصب، أو حركة موجية في الخلط، أو غليان حرارة مفرطة، أو ريح غليظة محتبسة في منافذ الروح، أو قبض الدماغ لدفع المؤذي {cite:canon-ibn-sina-print-v2 p.118} {cite:canon-ibn-sina-print-v2 p.119} {cite:canon-ibn-sina-print-v2 p.120}"
  en: "Ibn Sina's causes of epilepsy: an incompleteness of humour making an obstruction in a brain ventricle or the nerve roots, a wave-like motion in the humour, an excessive boiling heat, a thick wind held in the pneuma passages (Aristotle's view), or a contraction of the brain to expel the harmful {cite:canon-ibn-sina-print-v2 p.118} {cite:canon-ibn-sina-print-v2 p.119} {cite:canon-ibn-sina-print-v2 p.120}"
  fr: "Les causes de l’épilepsie selon Ibn Sina : une insuffisance d’humeur obstruant un ventricule cérébral ou les racines nerveuses, un mouvement ondulatoire de l’humeur, une chaleur excessive en ébullition, un vent épais retenu dans les voies du pneuma (avis d’Aristote), ou une contraction du cerveau pour expulser le nuisible {cite:canon-ibn-sina-print-v2 p.118} {cite:canon-ibn-sina-print-v2 p.119} {cite:canon-ibn-sina-print-v2 p.120}"
  ur: "ابن سینا کے نزدیک صرع کے اسباب: نامکمل خلط جو دماغ کے بطن یا اعصاب کی جڑوں میں سدا پیدا کرے، خلط میں لہر نما حرکت، حرارت کا غلیان، منافذ الروح میں محبوس موٹی ہوا ⁦(ارسطو کی رائے)⁩، یا دماغ کا نقصان پہنچانے والے کو دفع کرنے کے لیے سکڑنا {cite:canon-ibn-sina-print-v2 p.118} {cite:canon-ibn-sina-print-v2 p.119} {cite:canon-ibn-sina-print-v2 p.120}۔"
