id: concept/nataf
class: concept
kind: legal
label: { ar: "النَّتْف", en: "Plucking hair or feathers (nataf)", ur: "نتف ⁦(بال یا پر اکھاڑنا)⁩", es: "Arrancarse el pelo o las plumas (nataf)", fr: "Arracher les poils ou les plumes (nataf)", tr: "yökme", id: "memetik" }
summary:
  ar: "النتف في اللغة نزع الشعر والريش، وهو يفرق عن الحلق بأن الحلق بالموسى، وعن الاستحداد الذي هو حلق العانة، وعن الحف الذي هو أخذ الشعر بالخيط. ويحرم على المحرم قبل التحلل نتف شعر أي موضع من البدن، وتجب فيه الفدية، ودليله قوله تعالى في الحلق. ومن نتف ريش صيد في الحرم أو المحرم ضمنه، وتفصل أحكام ضمان الصيد المنتوف وضمان نفسه إن هلك. واختلف الفقهاء في نتف شعر وجه المرأة، فقيل داخل في النمص المنهي عنه، وخالفهم آخرون. ونتف شعر الإبط من خصال الفطرة، لحديث أبي هريرة في الفطرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15488} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15489} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15490} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15491} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15492}"
  en: "Natf, in the lexicon, is to pluck hair, wool or feathers. It differs from shaving with a blade (halq), from shaving the pubic area (istihdad), and from removing hair with thread (hafh), though each removes hair. A pilgrim in the state of ihram may not pluck hair from any part of the body before he leaves it, and must pay a ransom (fidya) if he does; the ban is drawn by analogy from the verse on shaving the head. Plucking the feathers of game in the sacred enclosure makes one liable for their value, and the rules cover the owing of the game, its death and the liability for the plucker's own act. Scholars differ on plucking a woman's facial hair, with some counting it as the forbidden removal of hair (namas), and others disagreeing. Plucking the hair of the armpit is among the practices of natural disposition (fitra), from the hadith of Abu Hurayra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15488} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15489} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15490} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15491} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15492}"
  ur: "نتف یعنی بال یا پر اکھاڑنا۔ احرام والے کے لیے تحلل سے پہلے بدن کے کسی حصے کے بال نوچنا حرام ہے اور اس پر فدیہ لازم ہے۔ بغل کے بال نوچنا فطرت کی سنتوں میں سے ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15488} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15489} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15490} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15491} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15492}"
  es: "En el léxico, natf significa arrancar pelo, lana o plumas. Se diferencia de afeitarse con una cuchilla (halq), de afeitarse la zona púbica (istihdad) y de depilarse con hilo (hafh), aunque todas implican la eliminación de vello. Un peregrino en estado de ihram no puede arrancarse el vello de ninguna parte del cuerpo antes de abandonarlo, y debe pagar un rescate (fidya) si lo hace; la prohibición se deriva por analogía del versículo sobre afeitarse la cabeza. Arrancar las plumas de la caza en el recinto sagrado hace responsable de su valor, y las reglas abarcan la deuda con la caza, su muerte y la responsabilidad por el propio acto del desplumador. Los eruditos discrepan sobre arrancar el vello facial de una mujer: algunos lo consideran una depilación prohibida (namas), mientras que otros discrepan. Arrancarse el vello de las axilas se encuentra entre las prácticas de la disposición natural (fitra), según el hadiz de Abu Hurayra. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15488} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15489} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15490} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15491} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15492}"
  fr: "Dans le lexique, « natf » signifie arracher des poils, de la laine ou des plumes. Cela diffère du rasage à la lame (halq), du rasage du pubis (istihdad) et de l'épilation au fil (hafh), bien que chaque acte implique l'épilation. Un pèlerin en état d'ihram ne peut s'épiler aucune partie du corps avant de quitter le lieu saint et doit payer une rançon (fidya) s'il le fait; cette interdiction est établie par analogie avec le verset relatif au rasage de la tête. Plumer du gibier dans l'enceinte sacrée engage la responsabilité du pèlerin quant à sa valeur, et les règles couvrent la dette envers le gibier, sa mort et la responsabilité de l'auteur de l'acte. Les savants divergent quant à l'épilation du visage chez la femme: certains la considèrent comme une épilation interdite (namas), tandis que d'autres sont d'un avis contraire. L'épilation des aisselles fait partie des pratiques de la disposition naturelle (fitra), selon le hadith d'Abu Hurayra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15488} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15489} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15490} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15491} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15492}"
  tr: "Dil dilinde yolma, tüy ve tüy koparmak anlamına gelir; tıraş ise musa ile tıraş olmaktan, kasık kıllarını tıraş etmek ve 'ihf' yani saç iplikle tutulmasından ayırt edilir. İhramda olan kişinin vücudunun herhangi bir yerinden saç koparması yasaktır ve bunun için fidya gereklidir. Kanıt olarak 'Yüce Olan' ayeti tıraş ile ilgilidir. Kutsal alanda veya içinde ihram halindeyken avlanan tüyleri koparan kişi, yırtılan avın sorumluluğu ve ölürse kendi hayatı hakkında kararlar ayrıntılı olarak belirtilmiştir. Hukukçular kadının yüz kıllarını yökme konusunda farklı görüşler sergilemiştir; yasak ön saçların altında olduğu söylenirken, diğerleri buna katılmamıştır. Koltuk altı kıllarını yolmak, Ebu Huraira'nın doğal eğilimle ilgili hadislerine dayanan doğal bir özelliktir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.15488} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15489} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15490} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15491} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15492}"
  id: "Mencabut bulu dalam bahasa berarti mencabut rambut dan bulu, dan dibedakan dengan mencukur dengan musa, mencukur bulu kemaluan, dan 'ihf', yaitu memegang rambut dengan benang. Dilarang bagi orang di ihram untuk mencabut rambut dari bagian tubuh mana pun sebelum mematahkannya, dan fidya diperlukan untuk itu. Buktinya adalah ayat 'Yang Maha Kuasa tentang mencukur.' Siapa pun yang memetik bulu berburu di tempat suci atau di dalam keadaan ihram di dalamnya, putusan tentang tanggung jawab perburuan yang robek dan nyawanya sendiri jika meninggal dirinci. Para ahli hukum berbeda pendapat mengenai mencabut rambut wajah wanita; dikatakan itu termasuk di bawah rambut depan yang dilarang, sementara yang lain tidak setuju. Mencabut bulu ketiak adalah sifat alami, berdasarkan hadits Abu Huraira mengenai sifat alami. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15488} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15489} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15490} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15491} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15492}"
