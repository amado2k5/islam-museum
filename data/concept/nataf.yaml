id: concept/nataf
class: concept
kind: legal
label: { ar: "النَّتْف", en: "Plucking hair or feathers (nataf)", ur: "نتف (بال یا پر اکھاڑنا)" }
summary:
  ar: "النتف في اللغة نزع الشعر والريش، وهو يفرق عن الحلق بأن الحلق بالموسى، وعن الاستحداد الذي هو حلق العانة، وعن الحف الذي هو أخذ الشعر بالخيط. ويحرم على المحرم قبل التحلل نتف شعر أي موضع من البدن، وتجب فيه الفدية، ودليله قوله تعالى في الحلق. ومن نتف ريش صيد في الحرم أو المحرم ضمنه، وتفصل أحكام ضمان الصيد المنتوف وضمان نفسه إن هلك. واختلف الفقهاء في نتف شعر وجه المرأة، فقيل داخل في النمص المنهي عنه، وخالفهم آخرون. ونتف شعر الإبط من خصال الفطرة، لحديث أبي هريرة في الفطرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15488} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15489} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15490} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15491} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15492}"
  en: "Natf, in the lexicon, is to pluck hair, wool or feathers. It differs from shaving with a blade (halq), from shaving the pubic area (istihdad), and from removing hair with thread (hafh), though each removes hair. A pilgrim in the state of ihram may not pluck hair from any part of the body before he leaves it, and must pay a ransom (fidya) if he does; the ban is drawn by analogy from the verse on shaving the head. Plucking the feathers of game in the sacred enclosure makes one liable for their value, and the rules cover the owing of the game, its death and the liability for the plucker's own act. Scholars differ on plucking a woman's facial hair, with some counting it as the forbidden removal of hair (namas), and others disagreeing. Plucking the hair of the armpit is among the practices of natural disposition (fitra), from the hadith of Abu Hurayra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15488} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15489} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15490} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15491} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15492}"
  ur: "نتف یعنی بال یا پر اکھاڑنا۔ احرام والے کے لیے تحلل سے پہلے بدن کے کسی حصے کے بال نوچنا حرام ہے اور اس پر فدیہ لازم ہے۔ بغل کے بال نوچنا فطرت کی سنتوں میں سے ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15488} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15489} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15490} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15491} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15492}"
