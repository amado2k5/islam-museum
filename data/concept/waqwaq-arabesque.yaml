  ar: "توريق تحمل محاليقه رؤوس بشر وحيوانات مكان الأوراق، سمي باسم الشجرة الأسطورية التي تثمر رؤوسًا، وأقدم مثال معروف له في مجموعة إسكندر سلطان ⁦(شيراز 1410–1411م)⁩ {cite:titley-persian-miniature-painting-1983 p. 224} {cite:titley-persian-miniature-painting-1983 p. 233}."
  en: "An arabesque whose tendrils bear human and animal heads in place of leaves, named after the mythical tree hung with heads; its earliest known example is in the Iskandar Sultan miscellany (Shiraz, 1410–11) {cite:titley-persian-miniature-painting-1983 p. 224} {cite:titley-persian-miniature-painting-1983 p. 233}."
  ur: "ایسا ترنج جس کی بیلوں پر پتوں کی جگہ انسانی اور حیوانی سر ہیں، اس افسانوی درخت کے نام پر جس پر سر لٹکتے ہیں؛ اس کی قدیم ترین معلوم مثال اسکندر سلطان کے مجموعے ⁦(شیراز 1410–11)⁩ میں ہے {cite:titley-persian-miniature-painting-1983 p. 224}."
