id: concept/al-sakk-wal-hawala
class: concept
kind: legal
label:
  ar: الصك والحوالة
  en: The sakk and the hawala
summary:
  ar: "الصك أشبه بالشيك الآن؛ ذكر الخوارزمي في مفاتيح العلوم أنه كان يجمع فيه أسماء المستحقين وعددهم وما يستحقونه من المال، ثم يوقع الخليفة أو السلطان أو الأمير بتوقيعه في آخره باعتماد دفع هذه الأرزاق، وما زالت كلماته متداولة في اللغات الأوروبية حتى اليوم كما تبقى حوالة العربية أصلاً لكلمة أفال في الأردية، ومن شواهد اتساع استعمالها أن الملاحين الذين نقلوا السلطان ملكشاه السلجوقي وجيوشه عبر نهر جيحون تسلموا من وزيره نظام الملك حوالات يقبضون قيمتها من العامل السلجوقي بأنطاكية ليدركوا مدى اتساع أملاك السلطان."
  en: "The sakk, near-kin to the modern cheque: al-Khwarizmi in Mafatih al-Ulum says it gathered the names and number of those entitled and what was owed them, and the caliph or sultan or amir signed at its foot authorising payment of these stipends; its word lives on in the European languages, and Arabic hawala survives as 'awal' in Urdu. Proof of their reach: the boatmen who ferried Sultan Malikshah's army across the Oxus received hawalas from Nizam al-Mulk redeemable from the Seljuk tax-agent at Antioch, so they might grasp the breadth of the sultan's domains."
