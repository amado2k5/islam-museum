tags: [islamic-economy-browser, islamic-economy-money, islamic-economy-sukuk, trade-browser, trade-trade]
label:
  ar: الصك والحوالة
  en: The sakk and the hawala
  fr: "Le sakk et la hawala"
  es: "El sakk y el hawala"
  ur: "ساک اور ہوالہ"
  tr: "Çek ve transfer"
  id: "Cek dan transfer"
summary:
  ar: "الصك أشبه بالشيك الآن؛ ذكر الخوارزمي في مفاتيح العلوم أنه كان يجمع فيه أسماء المستحقين وعددهم وما يستحقونه من المال، ثم يوقع الخليفة أو السلطان أو الأمير بتوقيعه في آخره باعتماد دفع هذه الأرزاق، وما زالت كلماته متداولة في اللغات الأوروبية حتى اليوم كما تبقى حوالة العربية أصلاً لكلمة أفال في الأردية، ومن شواهد اتساع استعمالها أن الملاحين الذين نقلوا السلطان ملكشاه السلجوقي وجيوشه عبر نهر جيحون تسلموا من وزيره نظام الملك حوالات يقبضون قيمتها من العامل السلجوقي بأنطاكية ليدركوا مدى اتساع أملاك السلطان."
  en: "The sakk, near-kin to the modern cheque: al-Khwarizmi in Mafatih al-Ulum says it gathered the names and number of those entitled and what was owed them, and the caliph or sultan or amir signed at its foot authorising payment of these stipends; its word lives on in the European languages, and Arabic hawala survives as 'awal' in Urdu. Proof of their reach: the boatmen who ferried Sultan Malikshah's army across the Oxus received hawalas from Nizam al-Mulk redeemable from the Seljuk tax-agent at Antioch, so they might grasp the breadth of the sultan's domains."
  fr: "Le sakk, proche parent du chèque moderne : al-Khwarizmi, dans Mafatih al-Ulum, dit qu’il réunissait les noms et le nombre des ayants droit et ce qui leur était dû, et le calife, le sultan ou l’émir signait au bas du document pour autoriser le paiement de ces pensions ; son nom survit dans les langues européennes, et l’arabe hawala survit sous la forme « awal » en ourdou. Preuve de leur portée : les bateliers qui firent traverser l’Oxus à l’armée du sultan Malikshah reçurent de Nizam al-Mulk des hawalas payables auprès de l’agent fiscal seldjoukide d’Antioche, afin qu’ils mesurent l’étendue des domaines du sultan."
  es: "El sakk, pariente cercano del cheque moderno: al-Juarismi, en Mafatih al-Ulum, dice que recogía los nombres y el número de los beneficiarios y lo que se les debía, y el califa, sultán o emir firmaba al pie autorizando el pago de estos estipendios; su palabra perdura en las lenguas europeas, y el árabe hawala sobrevive como 'awal' en urdu. Prueba de su alcance: los barqueros que transportaban al ejército del sultán Malikshah a través del Oxus recibían hawalas de Nizam al-Mulk, canjeables por el agente tributario selyúcida en Antioquía, para que pudieran comprender la amplitud de los dominios del sultán."
  ur: "سکک، جدید چیک کے قریبی رشتہ دار: مفتاح العلوم میں الخوارزمی کا کہنا ہے کہ اس نے حقداروں کے نام اور تعداد اور ان پر واجب الادا رقم جمع کی، اور خلیفہ یا سلطان یا امیر نے ان وظیفوں کی ادائیگی کی اجازت دینے کے لیے اس کے قدم پر دستخط کیے؛ اس کا لفظ یورپی زبانوں میں زندہ ہے، اور عربی حول اردو میں 'اول' کے طور پر زندہ ہے۔ ان کی پہنچ کا ثبوت: کشتی والوں نے جو سلطان ملک شاہ کی فوج کو آکسس کے پار لے گئے تھے، نظام الملک سے حوالات حاصل کیے جو انطاکیہ کے سلجوک ٹیکس ایجنٹ سے چھڑا سکتے تھے، تاکہ وہ سلطان کے دائرہ کار کی وسعت کو سمجھ سکیں۔"
  tr: "Çek artık daha çok çek gibidir; Al-Hwarizmi Mafatih al-Ulum'da yararlanıcıların isimlerini, numaralarını ve hak ettikleri parayı topladığını, ardından halife, sultan veya prensin sonunda bu ödemelerin ödenmesine bağlı olarak imzaladığını belirtmiştir. Çekin sözleri günümüzde Avrupa dillerinde hâlâ kullanılmaktadır ve Arapça hawala aslında Urduca'da 'Afal' kelimesini korumaktadır. Yaygın kullanımının kanıtı, Sultan Malikşah Selçuklu ve ordularını Cihun Nehri üzerinden taşıyan denizcilerin, bakanı Nizam al-Mulk'tan, Antakya'daki Selçuklu temsilcisinden değer toplamak için kuponlar almış olmalarıdır; böylece Sultan'ın mülklerinin kapsamını gerçekleştirmişlerdir."
  id: "Cek kini lebih mirip cek; Al-Hwarizmi Mafatih al-Ulum menyatakan bahwa penerima manfaat mengumpulkan nama, nomor, dan uang yang layak mereka terima, lalu menandatanganinya tergantung pada khalifah, sultan, atau pangeran yang akhirnya membayar pembayaran tersebut. Kata-kata untuk cek masih digunakan hingga kini dalam bahasa-bahasa Eropa, dan hawala Arab sebenarnya mempertahankan kata 'Afal' dalam bahasa Urdu. Bukti penggunaan luas cek ini adalah bahwa Sultan Malikshah Seljuk dan para pelaut yang mengangkut pasukannya menyeberangi Sungai Jihoun menerima kupon dari menterinya Nizam al-Mulk, perwakilan Seljuk di Antiokhia, untuk mengumpulkan nilai; dengan demikian mereka menyadari cakupan harta milik Sultan."
