label: { ar: "عضل الفك الأسفل عند ابن سينا", en: "Muscles of the lower jaw in the Canon", ur: "قانون میں نچلے جبڑے کے پٹھے", es: "Músculos de la mandíbula inferior en el Canon", fr: "Muscles de la mâchoire inférieure dans le canon", tr: "İbn Sina'nın Mandibular Kası", id: "Otot Mandibula Ibn Sina" }
summary:
  ar: "خُصّ الفك الأسفل بالحركة دون الأعلى، وله ثلاث حركات: الفتح والإطباق والمضغ، ولكل منها عضل {cite:canon-ibn-sina-print-v1 pp.63-64}."
  en: "The lower jaw alone was given movement, not the upper, and it has three movements, opening, closing and chewing, each with its muscles {cite:canon-ibn-sina-print-v1 pp.63-64}."
  es: "Solo la mandíbula inferior tenía movimiento, no la superior, y tiene tres movimientos: abrir, cerrar y masticar, cada uno con sus músculos {cite:canon-ibn-sina-print-v1 pp.63-64}."
  fr: "Seule la mâchoire inférieure était animée de mouvements, pas la supérieure, et elle possède trois mouvements: l'ouverture, la fermeture et la mastication, chacun avec ses muscles {cite:canon-ibn-sina-print-v1 pp.63-64}."
  ur: "صرف نچلے جبڑے کو حرکت دی گئی تھی، اوپر کی نہیں، اور اس میں تین حرکتیں ہیں، کھولنا، بند کرنا اور چبانا، ہر ایک اپنے عضلات کے ساتھ۔"
  tr: "Alt çene, üst çenenin altında hareket ile karakterizedir ve üç hareketi vardır: açılma, kapanma ve çiğneme; her biri bir kası vardır {cite:canon-ibn-sina-print-v1 s.63-64}."
  id: "Rahang bawah ditandai dengan gerakan di bawah rahang atas, dan memiliki tiga gerakan: membuka, menutup, dan mengunyah, masing-masing dengan otot {cite:canon-ibn-sina-print-v1 hlm.63-64}."
