id: concept/janin
class: concept
kind: legal
label:
  ar: الجنين
  en: Janin (the unborn child)
  ur: الجنين
  es: "Janin (el niño no nacido)"
  fr: "Janin (l'enfant à naître)"
  tr: "fetus"
  id: "janin"
summary:
  ur: رحم میں تخلیق ہونے والا بچہ؛ فقہ میں اس کے احکام عدة، ارث، غرہ اور دفن سے جڑے
    ہیں۔
  ar: الجنين في اللغة الولد في البطن، وفي الفقه يُعنى به ما يتكون في الرحم. تبيّن
    الموسوعة الفقهية الكويتية أثره في العدة وفي الإرث وفي وصيته وهبته، وأحكام الجناية
    عليه بالغرة، وهي عند الفقهاء نصف عشر الدية، وغسله وتكفينه والصلاة عليه ودفنه إذا
    سقط ميتا بحسب مدة الحمل والاستهلال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6576}
    {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6579} {cite:fiqh-mawsua-kuwaitiyya-noor-v3
    p.6580} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6581} {cite:fiqh-mawsua-kuwaitiyya-noor-v3
    p.6582}
  en: Janin in the language is the child in the womb. In fiqh it names what forms
    in the womb. The Kuwaiti encyclopedia sets out its effect on the waiting period
    (iddah) of a pregnant woman, on inheritance and on gifts and bequests made for
    it, the rule for an assault on the unborn that causes miscarriage (a ghurra, which
    the source gives as one-twentieth of the blood-money, according to the majority),
    and how a stillborn child is washed, shrouded, prayed over and buried, with the
    rules depending on whether it was born alive, moved, or was a miscarriage of less
    than four months. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6576} {cite:fiqh-mawsua-kuwaitiyya-noor-v3
    p.6579} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6580} {cite:fiqh-mawsua-kuwaitiyya-noor-v3
    p.6581} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6582}
  es: "Janin, en el idioma kuwaití, significa niño en el útero. En fiqh, designa lo que se forma en el útero. La enciclopedia kuwaití expone su efecto en el período de espera (iddah) de una mujer embarazada, en la herencia y en los regalos y legados que se le hagan, la norma para un ataque contra el feto que cause un aborto espontáneo (una ghurra, que la fuente indica como una vigésima parte de la indemnización por sangre, según la mayoría), y cómo se lava, amortaja, reza y entierra a un niño nacido muerto, con normas que dependen de si nació vivo, fue trasladado o fue un aborto espontáneo de menos de cuatro meses. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6576} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6579} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6580} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6581} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6582}"
  fr: "En koweïtien, « janin » désigne l'enfant à naître. En jurisprudence islamique (fiqh), ce terme désigne ce qui se forme dans le ventre de la mère. L'encyclopédie koweïtienne détaille son incidence sur la période de viduité (iddah) de la femme enceinte, sur l'héritage, les donations et les legs, sur la règle applicable en cas d'agression contre le fœtus entraînant une fausse couche (ghurra, dont le montant, selon la majorité, correspond à un vingtième du prix du sang), et sur les rites funéraires (lavage, linceul, prière et inhumation) d'un enfant mort-né, ces règles variant selon qu'il soit né vivant, qu'il ait été déplacé ou qu'il s'agisse d'une fausse couche de moins de quatre mois. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6576} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6579} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6580} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6581} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6582}"
  tr: "Dilbilimde fetüs, rahimdeki çocuğu ifade ederken, hukukta rahimde ne oluştuğunu. Kuveyt Hukuk Ansiklopedisi, bunun bekleme süresi, miras ve hediye edilmesi üzerindeki etkisini ve ghura suçu üzerindeki kararlarını açıklar; hukukçulara göre kan parasının onda biri olan ghura suçu hakkında, hamilelik süresi ve başlatma süresine bağlı olarak kan parasının onda biri kadardır; yıkama, kefenleme, dua etme ve ölü doğmuşsa gömme dahildir. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.6576} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6579} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6580} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6581} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6582}"
  id: "Dalam linguistik, janin merujuk pada anak di dalam kandungan, dan dalam yurisprudensi, janin merujuk pada apa yang terbentuk di dalam rahim. Ensiklopedia Yurisprudensial Kuwait menjelaskan pengaruhnya terhadap masa tunggu, warisan, dan pemberiannya, serta putusan atas kejahatan ghura, yang menurut ahli hukum adalah setengah persepuluh dari uang darah, termasuk mencuci, menutupi kabin, berdoa untuknya, dan penguburan jika dia lahir mati, tergantung pada durasi kehamilan dan inisiasi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6576} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6579} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6580} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6581} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6582}"
