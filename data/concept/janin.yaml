label: { ar: "الجنين", en: "Janin (the unborn child)" }
summary:
  ar: "الجنين في اللغة الولد في البطن، وفي الفقه يُعنى به ما يتكون في الرحم. تبيّن الموسوعة الفقهية الكويتية أثره في العدة وفي الإرث وفي وصيته وهبته، وأحكام الجناية عليه بالغرة، وهي عند الفقهاء نصف عشر الدية، وغسله وتكفينه والصلاة عليه ودفنه إذا سقط ميتا بحسب مدة الحمل والاستهلال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6576} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6579} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6580} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6581} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6582}"
  en: "Janin in the language is the child in the womb. In fiqh it names what forms in the womb. The Kuwaiti encyclopedia sets out its effect on the waiting period (iddah) of a pregnant woman, on inheritance and on gifts and bequests made for it, the rule for an assault on the unborn that causes miscarriage (a ghurra, which the source gives as one-twentieth of the blood-money, according to the majority), and how a stillborn child is washed, shrouded, prayed over and buried, with the rules depending on whether it was born alive, moved, or was a miscarriage of less than four months. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6576} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6579} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6580} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6581} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6582}"
