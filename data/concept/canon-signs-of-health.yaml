id: concept/canon-signs-of-health
class: concept
kind: scientific
label:
  ar: "علامات الصحة عند ابن سينا"
  en: "Signs of health in the Canon"
  fr: "Signes de santé dans le Canon"
  ur: "صحت کی علامات، قانون کے مطابق"
  es: "Signos de salud en el Canon"
summary:
  ar: "يقسم ابن سينا العلامات الصحية إلى ما يدل على اعتدال المزاج وما يدل على استواء التركيب، وهذه جوهرية وعرضية وتمامية، ثم يبين كيف يستدل من الأفعال على الأعضاء الرئيسة {cite:canon-ibn-sina-print-v1 p.154}."
  en: "Ibn Sina divides the signs of health into those pointing to an even temperament and those pointing to a sound composition, the latter being essential, accidental and complete, and then shows how the principal organs are read from their functions {cite:canon-ibn-sina-print-v1 p.154}."
  fr: "Ibn Sina distingue les signes d’équilibre du tempérament de ceux de bonne composition — essentiels, accidentels et complets —, puis interprète les organes principaux par leurs fonctions {cite:canon-ibn-sina-print-v1 p.154}."
  es: "Ibn Sina divide los signos de salud en aquellos que apuntan a un temperamento equilibrado y aquellos que apuntan a una composición sana, siendo estos últimos esenciales, accidentales y completos, y luego muestra cómo se leen los órganos principales a partir de sus funciones {cite:canon-ibn-sina-print-v1 p.154}."
  ur: "ابن سینا صحت کی علامات کو ان میں تقسیم کرتا ہے جو ہموار مزاج کی طرف اشارہ کرتے ہیں اور وہ جو ایک صحیح ساخت کی طرف اشارہ کرتے ہیں، بعد ازاں ضروری، حادثاتی اور مکمل ہیں، اور پھر یہ ظاہر کرتے ہیں کہ بنیادی اعضاء کو ان کے افعال سے کیسے پڑھا جاتا ہے۔"
