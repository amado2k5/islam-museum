id: concept/itlaf
class: concept
kind: legal
label: { ar: "إتلاف", en: "Destruction or damage of property (itlaf)", es: "Destrucción o daño a la propiedad (itlaf)", fr: "Destruction ou endommagement de biens (itlaf)", ur: "املاک کی تباہی یا نقصان ⁦(اتلف)⁩", tr: "Yıkım", id: "Penghancuran" }
summary:
  ar: "الإتلاف في اللغة من تلف بمعنى هلك، وأتلفه أفناه، ومعناه عند الفقهاء إخراج الشيء من أن يكون منتفعاً به المنفعة المطلوبة منه عادة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1489} والأصل فيه الحظر إذا لم يكن مأذوناً فيه شرعاً، وقد يكون واجباً أو مباحاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1490} وموجبه الضمان إذا وقع على مال محترم مملوك للغير بغير إذن الشارع أو صاحبه، ولا تلازم بين الإثم والضمان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1498} وقد يكون الإتلاف بالمباشرة أو بالتسبب، وكلاهما موجب للضمان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1496} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1497}"
  en: "Itlaf comes from talaf, to perish, and atlafahu, to destroy. For jurists it is removing a thing from its usual useful purpose. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1489} The default ruling is prohibition when the act is not permitted by the law. It can also be obligatory or permitted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1490} Its usual consequence is liability when a protected, owned property of another is destroyed without the permission of the law or the owner, and sin and liability do not necessarily coincide. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1498} Destruction may be direct or by causation, and both create liability. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1496} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1497}"
  es: "Itlaf proviene de talaf, perecer, y atlafahu, destruir. Para los juristas es quitar algo de su propósito útil habitual. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1489} La norma por defecto es la prohibición cuando el acto no está permitido por la ley. También puede ser obligatorio o permitido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1490} Su consecuencia habitual es la responsabilidad cuando una propiedad protegida, propiedad de otra persona, es destruida sin el permiso de la ley o del propietario, y el pecado y la responsabilidad no necesariamente coinciden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1498} La destrucción puede ser directa o por causalidad, y ambas crean responsabilidad. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1496} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1497}"
  fr: "Itlaf vient de talaf, périr, et atlafahu, détruire. Pour les juristes, il s'agit de soustraire une chose à sa fonction habituelle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1489} La règle par défaut est l'interdiction lorsque l'acte n'est pas autorisé par la loi. Il peut également être obligatoire ou permis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1490} La conséquence habituelle est la responsabilité civile lorsqu'un bien protégé appartenant à autrui est détruit sans l'autorisation de la loi ou du propriétaire, et le péché et la responsabilité civile ne coïncident pas nécessairement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1498} La destruction peut être directe ou indirecte, et les deux entraînent une responsabilité civile. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1496} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1497}"
  ur: "اعتلف تلف سے آتا ہے، فنا ہو جاتا ہے، اور اٹلافہو، فنا ہو جاتا ہے۔ فقہاء کے نزدیک یہ کسی چیز کو اس کے معمول کے مفید مقصد سے ہٹانا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1489} پہلے سے طے شدہ حکم ممانعت ہے جب اس عمل کی قانون میں اجازت نہ ہو۔ یہ واجب یا جائز بھی ہو سکتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 1490} اس کا معمول کا نتیجہ ذمہ داری ہے جب کسی دوسرے کی محفوظ، ملکیتی جائیداد قانون یا مالک کی اجازت کے بغیر تباہ ہو جائے، اور گناہ اور ذمہ داری لازماً ایک دوسرے کے ساتھ نہیں ہوتی۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1498} تباہی براہ راست ہو سکتی ہے یا وجہ سے، اور دونوں ہی ذمہ داری پیدا کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1496}"
  tr: "Dilbilimde yıkım yıkım, yok etme ise yıkım anlamına gelir ve hukukçulara göre, bir şeyin faydasından çıkarılarak amaçlanan fayda için alınması anlamına gelir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1489} Varsayılan yasak, Şeriat tarafından izin verilmiyorsa yasaktır ve zorunlu veya izin edilebilir olabilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1490} ve yükümlülüğü, başkalarına ait saygın mülk üzerinde Kanun Uygulayıcının veya sahibinin izni olmadan gerçekleşirse sorumluluktur ve günah ile sorumluluk arasında bir bağlantı yoktur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1498} Yıkım doğrudan ya da nedenle oluşabilir, her ikisi de sorumluluk gerektirir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1496} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1497}"
  id: "Dalam linguistik, kehancuran berarti kehancuran, dan kehancuran berarti kehancuran, dan menurut ahli hukum, berarti menghilangkan sesuatu dari manfaat yang dimaksudkan untuk manfaat yang dimaksudkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1489} Defaultnya adalah larangan jika tidak diizinkan oleh Syariah, dan mungkin bersifat wajib atau diperbolehkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1490} dan kewajibannya adalah tanggung jawab jika terjadi pada properti yang terhormat milik orang lain tanpa izin dari Pemberi Hukum atau pemiliknya, dan tidak ada hubungan antara dosa dan tanggung jawab. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1498} Kehancuran dapat disebabkan langsung atau oleh sebab, keduanya memerlukan tanggung jawab. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1496} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1497}"
