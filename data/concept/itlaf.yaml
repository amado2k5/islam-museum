id: concept/itlaf
class: concept
kind: legal
label: { ar: "إتلاف", en: "Destruction or damage of property (itlaf)" }
summary:
  ar: "الإتلاف في اللغة من تلف بمعنى هلك، وأتلفه أفناه، ومعناه عند الفقهاء إخراج الشيء من أن يكون منتفعاً به المنفعة المطلوبة منه عادة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1489} والأصل فيه الحظر إذا لم يكن مأذوناً فيه شرعاً، وقد يكون واجباً أو مباحاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1490} وموجبه الضمان إذا وقع على مال محترم مملوك للغير بغير إذن الشارع أو صاحبه، ولا تلازم بين الإثم والضمان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1498} وقد يكون الإتلاف بالمباشرة أو بالتسبب، وكلاهما موجب للضمان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1496} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1497}"
  en: "Itlaf comes from talaf, to perish, and atlafahu, to destroy. For jurists it is removing a thing from its usual useful purpose. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1489} The default ruling is prohibition when the act is not permitted by the law. It can also be obligatory or permitted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1490} Its usual consequence is liability when a protected, owned property of another is destroyed without the permission of the law or the owner, and sin and liability do not necessarily coincide. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1498} Destruction may be direct or by causation, and both create liability. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1496} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1497}"
