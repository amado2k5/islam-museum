label:
  ar: أمراض اللثة
  en: The diseases of the gum
  fr: "Les maladies de la gencive"
  ur: مسوڑھے کے امراض
summary:
  ar: يعرض للثة الأورام بسبب مادة تنزل إليها في أكثر الأمر من الرأس وقد يكون بمشاركة المعدة وقد يعرض لها أورام في ابتداء الاستسقاء وعروض سوء القنية لما يتصعد إليها من الأبخرة الفاسدة ويستدل على جنس المادة باللون واللمس وقد يكون منه ظاهر قريب سريع القبول للعلاج وغائر بعيد بطيء القبول للعلاج وقد يكون مع حمى {cite:canon-ibn-sina-print-v2 p.280}
  en: Tumours befall the gum from a matter descending to it, mostly from the head and sometimes with the stomach sharing; tumours also occur at the outset of dropsy and on bad cachexia, from the corrupt vapours rising to it. The matter's kind is read from colour and touch; it may be near and quick to take treatment or deep, far and slow, and may come with fever {cite:canon-ibn-sina-print-v2 p.280}
  fr: "Des tumeurs atteignent la gencive à partir d’une matière qui y descend, le plus souvent de la tête et parfois avec la participation de l’estomac ; des tumeurs surviennent aussi au début de l’hydropisie et dans la mauvaise cachexie, à partir des vapeurs corrompues qui y montent. La nature de la matière se lit à la couleur et au toucher ; elle peut être proche et prompte à recevoir le traitement, ou profonde, éloignée et lente, et peut s’accompagner de fièvre {cite:canon-ibn-sina-print-v2 p.280}"
  ur: مسوڑھے میں ورم ایک اتردی مواد سے ہوتا ہے جو اکثر سر سے اور بعض اوقات معدے کی شرکت سے آتی ہے؛ اور استسقاء کے آغاز اور برے قینیة پر بھی ورم ہو سکتا ہے بگڑے بھاپوں کے چڑھنے سے؛ مواد کی جنس رنگ اور مس سے پہچانی جاتی ہے؛ وہ ظاہر قریب جلد علاج ماننے والا بھی ہو سکتا ہے اور گہرا دور دیر میں ماننے والا بھی اور بخار کے ساتھ بھی ہو سکتا ہے {cite:canon-ibn-sina-print-v2 p.280}
