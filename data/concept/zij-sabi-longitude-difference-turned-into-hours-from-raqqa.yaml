id: concept/zij-sabi-longitude-difference-turned-into-hours-from-raqqa
class: concept
kind: scientific
label: { ar: "فرق الطول من الرقة مُحوَّلاً إلى ساعات", en: "The longitude difference from Raqqa turned into hours", ur: "رقہ سے طول کا فرق گھنٹوں میں", es: "La diferencia de longitud desde Raqqa se convirtió en horas.", fr: "La différence de longitude par rapport à Raqqa s'est transformée en heures", tr: "Rakka'dan boylam farkı saate çevrildi.", id: "Selisih garis bujur dari Raqqa dikonversi ke jam." }
summary:
  ar: "إذا أردت ساعات بلد غير الرقة، تأخذ الفرق بين طوله وطول الرقة من جداول أطوال المدن، وتقسمه على خمسة عشر، فيخرج ساعات البُعد. فإن كان طول المدينة أكثر من طول الرقة نقصت ساعات البُعد من الساعات المعتدلة، لأن المدينة تقع إلى ناحية المشرق، وإن كان أقل زيدت. {cite:zij-sabi-nallino-byblion p.109}."
  en: "To get the hours of another place than Raqqa, take the difference between its longitude and Raqqa's from the table of city longitudes and divide it by fifteen; the result is the hours of distance. If the city's longitude is greater than Raqqa's, the hours of distance are subtracted from the equated hours, since the city lies to the east; if it is less, they are added. {cite:zij-sabi-nallino-byblion p.109}."
  ur: "اگر رقہ کے علاوہ کسی اور شہر کے گھنٹے چاہیں تو شہروں کے طول کے جدول سے اس کے اور رقہ کے طول کا فرق لیں اور اسے پندرہ سے تقسیم کریں، تو حاصل فاصلے کے گھنٹے ہوں گے۔ اگر شہر کا طول رقہ سے زیادہ ہو تو یہ گھنٹے معتدل گھنٹوں سے گھٹائے جاتے ہیں، کیونکہ وہ شہر مشرق کی طرف ہے؛ اور اگر کم ہو تو جمع کیے جاتے ہیں۔ {cite:zij-sabi-nallino-byblion p.109}۔"
  es: "Para obtener la hora de una ciudad distinta a Raqqa, se calcula la diferencia entre su longitud y la de Raqqa, según la tabla de longitudes de ciudades, y se divide entre quince; el resultado son las horas de distancia. Si la longitud de la ciudad es mayor que la de Raqqa, se restan las horas de distancia a las horas resultantes, ya que la ciudad se encuentra al este; si es menor, se suman. {cite:zij-sabi-nallino-byblion p.109}."
  fr: "Pour calculer le temps de trajet d'une autre ville que Raqqa, on calcule la différence entre sa longitude et celle de Raqqa (d'après le tableau des longitudes des villes) et on divise le résultat par quinze; on obtient ainsi le temps de trajet. Si la longitude de la ville est supérieure à celle de Raqqa, on soustrait le temps de trajet du temps de trajet calculé, car la ville est située à l'est; si elle est inférieure, on l'ajoute. {cite:zij-sabi-nallino-byblion p.109}."
  tr: "Rakka dışında bir şehirdeki zamanı öğrenmek istiyorsanız, şehir uzunlukları tablolarından o şehrin uzunluğu ile Rakka'nın uzunluğu arasındaki farkı alın ve on beşe bölerek mesafe süresini elde edin. Şehrin uzunluğu Rakka'nınkinden büyükse, şehir doğuda yer aldığı için mesafe süresi ortalama saatlerden azaltılır; daha küçükse artırılır. {cite:zij-sabi-nallino-byblion s.109}."
  id: "Jika Anda ingin mengetahui waktu di kota selain Raqqa, ambil selisih antara panjang kota tersebut dan panjang Raqqa dari tabel panjang kota, lalu bagi dengan lima belas untuk mendapatkan waktu tempuh. Jika panjang kota tersebut lebih besar dari Raqqa, waktu tempuh akan berkurang dari rata-rata jam karena kota tersebut terletak di sebelah timur; jika lebih kecil, waktu tempuh akan bertambah. {cite:zij-sabi-nallino-byblion p.109}."
