id: concept/wisaya-fiqh
class: concept
kind: legal
label:
  ar: "وِصاية"
  en: "Wisaya (executorship)"
summary:
  ar: "الوصاية في اللغة الأمر بالتصرف بعد الموت، ويقال أوصى له بشيء وأوصى إليه جعله وصيّه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17216} والوصاية في الاصطلاح هي الأمر بالتصرف بعد الموت، وتفارق الوصيةَ، وهي تمليك مضاف لما بعد الموت بطريق التبرع، ويفارق الوكالةَ أنها بعد الموت والوكالة في الحياة، والولاية أعمّ منها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17216}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17217} وحكمها للموصي: تجب إذا كانت لرد المظالم والديون المجهولة، أو للأولاد الصغار إذا خِيف ضياعهم، وتستحب لقضاء دين معلوم وإنفاذ الوصايا والنظر في أمر الصغار الذين لا يُخشى عليهم الضياع. وللموصى إليه القبول إذا قدر ووثق من نفسه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17217} والأوصياء نوعان: وصي القاضي يعينه القاضي للإشراف على شؤون القاصر المالية، ووصي الميت يختاره الأب أو الجد أو من له حق الولاية من قبلهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17217} ونص الحنفية على فروق بين النوعين، منها أن وصي الميت يجوز له البيع من نفسه إذا فيه نفع ظاهر عند أبي حنيفة، ووصي القاضي لا يملك ذلك، وأن القاضي يملك عزل وصي القاضي دون وصي الميت العدل الكافي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17218} وذكر الحنفية مواضع ينصب فيها القاضي وصياً، منها ما إذا كان على الميت دين أو له، أو لتنفيذ وصيته، أو إذا كان له ولد صغير، أو إذا كان في الورثة صغير أو غائب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17218}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17219} إذا عجز الوصي عن القيام بمهامه ضم القاضي إليه غيره عند الحنفية والحنابلة والشافعية إذا كان وصي الأب أو الجد، وإن ظهرت منه خيانة أو فسق عُزل عند الحنفية والمالكية والشافعية والحنابلة وأقيم مكانه غيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17219}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17220} والوصي إما متطوع وهي أمانة محضة، وإما مستجعَل: فإن كان بعقد فهي إجارة لازمة يُستأجر عليه من ماله عند العجز، وإن كان بغير عقد فهي جعالة، معينة أو غير معينة، وتفصّل أجرتها بقدر العمل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17220} أركان الوصاية أربعة: الوصي، والموصي، والموصى به، والصيغة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17221} أما الوصي فيشترط فيه العقل والإسلام إن كان الموصى عليه مسلماً والقدرة على التصرف، ومختلف في الوصاية إلى الصبي والمرأة والأعمى والفاسق والعبد والكافر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17221} فلا تصح الوصاية إلى غير المميز بالاتفاق، وإلى المميز عند الحنفية والمالكية والشافعية والحنابلة على الصحيح، وعند القاضي من الحنابلة تصح إذا جاوز العشر. وذهب أكثر أهل العلم إلى صحتها للمرأة، ونُقل أن عمر أوصى إلى حفصة، وصحّ عند عامتهم للأعمى، وخالف الشافعية في مقابل الأصح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17222}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17223} وفي اشتراط العدالة في الوصي قولان: الحنفية والمالكية وأحمد في رواية لا يشترطونها، والشافعية وأحمد في رواية يشترطونها. وفي الوصاية إلى العبد قولان: الشافعية وأبو يوسف ومحمد لا تصح، والمالكية والحنابلة تصح، وأبو حنيفة يجيزها لعبد الموصي إذا لم يكن في الورثة رشيد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17223}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17224} واتفق الفقهاء على منع الوصاية للكافر على المسلم، واختلفوا في الكافر على الكافر على ثلاثة أقوال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17224} واختلفوا في وقت اعتبار شروط الوصي على أربعة أقوال: عند موت الموصي، أو عند الإيصاء، أو عندهما معاً، أو فيهما وفيما بينهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17224}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17225} وتصح الوصاية إلى اثنين فأكثر، ولكل منهما ما خُصّ به؛ وإذا أطلق الموصي الوصاية لهما ولم يحدد فالجمهور على أن لا ينفرد أحدهما بالتصرف، واستثنى الحنفية أمورا منها تجهيز الميت وطعام الصغار وكسوتهم، وقبول الهبات، وبيع ما يخشى تلفه، وجمع الأموال الضائعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17225}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17227} وإذا مات أحد الوصيين أو فسق أو جنّ أقام القاضي مكانه آخر عند الحنفية والشافعية والحنابلة، ورأى المالكية أن يقضي القاضي بالأصلح من استقلال الباقي أو ضم غيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17228} واختلف الفقهاء في اقتسام المال بين الوصيين عند اختلافهما في حفظه: فالمالكية والحنابلة يمنعونه لأن الموصي لم يأمن أحدهما على الحفظ، والحنفية يجيزون القسمة إن قبلها المال، وإلا تهايآ أو أودعاه عند أمين، والشافعية أن أمين الحفظ لا ينفرد أحدهما بحال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17229}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17230} ويرتب الفقهاء الوصي في الولاية على القاصر: عند الحنفية الأب ثم وصيه ثم وصي وصيه، ثم أبو الأب، ثم القاضي، وعند المالكية والحنابلة الأب ثم وصيه ثم القاضي، ويرى المالكية للأم شروطا لتوصي، والشافعية لا يجوزون للأب نصب وصي إذا كان الجد حاضراً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17230}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17231} الركن الثاني الموصي، ويشترط فيه التكليف وهو العقل والبلوغ، فلا تصح من مجنون ولا من غير مميز، وفي المميز خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17231}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17232} ويشترط في الموصي الحرية عند الجمهور، وخالف الحنابلة في غير المال، والرشد عند المالكية والحنابلة دون الحنفية والشافعية، والعدالة عند الشافعية دون الحنفية والحنابلة، والولاية على من يوصى عليه، والإسلام في الوصاية على الأولاد المسلمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17232}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17234} الركن الثالث الموصى به: ويشترط أن يكون تصرفاً معلوماً يملك الموصي فعله، مثل قضاء الدين والنظر في أمر الصغير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17234} الركن الرابع الصيغة: ولا بد من الإيجاب والقبول، ويصح الإيجاب بكل لفظ يدل على تفويض الأمر، وجمهور الفقهاء يصححون التعبير بلفظي الوكالة والولاية، والأخرس تكفي إشارته المفهِمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17235} ويصح قبول الوصاية وردها في حياة الموصي عند جمهور الفقهاء بتفصيل، وعند الشافعية في الأصح لا يصح قبولها أو ردها إلا بعد الوفاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17236} والتعليق والتأقيت في صيغة الوصاية جائزان بالاتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17237} ومن واجبات الوصي حفظ أموال اليتامى وتثميرها والنفقة عليهم بالمعروف وإخراج ما تعلق بها من حقوق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17237} واجبات الوصي: إن كانت الوصاية مطلقة لزمه القيام بما وُصّي به من حفظ مال الصغير وتثميره والنفقة عليه بالمعروف وإخراج ما تعلق بماله من حقوق لله وللناس، وولايته بقدر ولاية الموصي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17237} عدّ الحنفية من واجباته تجهيز الميت وشراء كفنه، وقضاء حاجة الصغار، ورد الوديعة وقضاء الدين، ورد المغصوب، وبيع ما يخشى تلفه، وتنفيذ الوصية المعينة، والخصومة في حق الميت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17238} وقال المالكية: للوصي اقتضاء الدين وتأخيره بحسب المصلحة، والنفقة على الصغير بالمعروف، وإخراج زكاة الفطر، ودفع المال قراضاً أو بضاعة وله عدم دفعه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17238} وعدّ الشافعية أربعة واجبات: حفظ الأصول، وتثمير الفروع، والإنفاق بالمعروف، وإخراج ما تعلق بالمال من حقوق، وفصّلوا في الضمان عند التفريط أو الإهمال بالعمارة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17238}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17239} والتجارة بمال الصغير مندوبة بأربعة شروط: أن يكون المال ناضّاً، والزمان آمناً، والسلطان عادلاً، والتجارة مربحة؛ والاستغلال بالإجارة، والنفقة بالمعروف لا سرف فيها ولا تقصير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17239}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17240} وحقوق الله المتعلقة بالمال زكاة الفطر والأعشار (واجبة إجماعاً)، وزكاة الأموال أسقطها أبو حنيفة إلا عن بالغ عاقل. وحقوق الآدميين: الدين يقضيه الولي إذا ثبت وطالب الدائن، والجناية على المال تُغرم من المال، والجناية على النفس الخطأ على العاقلة، والعمد فيه قولان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17240}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17241} وذكر الحنابلة من واجبات الوصي قضاء الديون وتفريق الوصية والنظر في أمر غير المكلف، ورد الودائع والمغصوب، وحد القذف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17241} وزكاة الفطر واجبة في مال الصغير عند المالكية والشافعية والحنابلة وأبي حنيفة وأبي يوسف، وخالف محمد وزفر فلم يجيزا للوصي إخراجها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17241}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17242} وأما تضحية الوصي عن الصغير فأوجبها أبو حنيفة وأبو يوسف على الموسر، وسنّها المالكية، وجازها الحنابلة من مال الصغير الكثير، ومنعها الشافعية ومحمد وزفر من مال الصغير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17242}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17243} تصرفات الوصي: لا يباع العقار إلا لحاجة أو مصلحة ظاهرة، والمنقول يباع ويشترى من أجنبي بمثل القيمة أو بغبن يسير، والبيع والشراء من النفس ممنوع عند الجمهور؛ وعند الحنفية يجوز وصي الأب ذلك عند أبي حنيفة ولا يجوز وصي القاضي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17243} والاتجار بمال الموصى عليه ثلاثة طرق: أن يتجر الوصي لنفسه، أو يتجر في مال اليتيم لليتيم، أو يدفعه مضاربة. فالحنفية والمالكية يمنعون الاتجار لنفسه، والحنفية يوجبون ضمان رأس المال والتصدق بالربح عند أبي حنيفة ومحمد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17243}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17244} واتجار الوصي في مال اليتيم لليتيم جائز عند الحنفية والشافعية والحنابلة في المذهب، وممنوع عند المالكية في قول والحنابلة في وجه. والمضاربة بمال اليتيم مشروعة؛ والجمهور على استحبابها، والشافعية على وجوبها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17244}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17245} وتأجير الصبي الموصى عليه للغير جائز باتفاق المذاهب، وإجارة الصبي نفسه للوصي فيها تفصيل بعد البلوغ، وتأجير أرض الصبي إجارة طويلة لا يصح عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17245}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17246} وإذا بلغ الصبي رشيداً أثناء الإجارة اختلف الفقهاء في فسخها: فالحنفية ليس للصبي فسخ الإجارة على ماله، والمالكية والشافعية والحنابلة بتفصيل بحسب علم الوصي بالبلوغ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17246}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17247} ولا يجوز للوصي التبرع بمال الصغير هبة أو صدقة أو وصية عند الفقهاء الأربعة، لأن ذلك ضرر محض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17247}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17248} وفي هبة الوصي مال الصغير بعوض ثلاثة أقوال: عند أبي حنيفة وأبي يوسف والمالكية والشافعية لا يجوز، وعند محمد يجوز، وعند الحنابلة يجوز إن كان العوض بقدر القيمة فأكثر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17248}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17249} وطلب الوصي الشفعة للصغير إن كان فيه حظ: الحنفية والمالكية والشافعية والحنابلة يجيزونه، وعند الشافعية والحنابلة ومحمد وزفر يجب. وإذا كان الترك في مصلحة الصغير جاز تركها عند الجميع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17249}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17250} وإذا استوت المصلحة في الأخذ والترك فللشافعية ثلاثة أوجه: التحريم، والوجوب، والتخيير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17250}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17251} وإقراض الوصي مال الصغير لنفسه ممنوع عند الحنفية والمالكية والحنابلة للتهمة، وأجازه محمد وقول للمالكية إذا كان فيه وفاء. وإقراضه للغير لا يجوز عند الحنفية والشافعية والحنابلة إلا لضرورة أو حاجة أو مصلحة، ورأى المالكية وإحدى روايتي أحمد منع تسليف المال على وجه المعروف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17251}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17252} ويجيز الحنفية استقراض الوصي مالاً للصغير إذا دعت الحاجة إليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17252} ورهن الوصي مال الصغير بدين عليه يجوز بمصلحة عند ثقة عند المالكية والشافعية والحنابلة، ويجيزه الحنفية في دين التجارة؛ ورهنه بدين للوصي على الصغير ممنوع عند الحنفية والمالكية والشافعية وهو المذهب عند الحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17252}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17253} وإذا اختلف الوصي والصغير في قدر النفقة فالقول قول الوصي بيمينه في نفقة المثل عند الفقهاء الأربعة، ونص الحنفية على اثنتي عشرة مسألة يُقبل فيها قول الوصي بلا بينة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17253}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17254} وإذا اختلفا في مدة النفقة أو في تاريخ موت الموصي فالقول قول الصغير عند المالكية والشافعية والحنابلة ومحمد، وقال أبو يوسف القول قول الوصي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17254} وإذا اختلفا في دفع المال للصغير بعد بلوغه فللفقهاء ثلاثة أقوال: القول قول الصغير عند المالكية في المشهور والشافعية، وقول الوصي بيمينه عند الحنفية، والحنابلة يفرّقون بين المتبرع فيقبل قوله وبين المستأجر فلا يقبل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17254}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17255} وأجرة الوصي: إن فرضها الأب أو القاضي أخذها الغني والفقير، ولا يأخذ الغني شيئاً إن لم تُفرض، وأما الفقير إن لم تُفرض فللحنفية في الاستحسان والمالكية والشافعية والحنابلة أن يأخذ بضوابط، والقياس عند الحنفية المنع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17255}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17256} وإيصاء الوصي إذا لم يُعيّن له من يوصيه: يجيزه الحنفية والمالكية وأحمد في رواية، ويمنعه الشافعية والحنابلة في المذهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17256} وإقرار الوصي بدين على الميت لا يجوز عند الحنفية والحنابلة إلا أن يكون المقِرّ وارثاً فيصح في حصته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17256}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17257} وشهادة الوصيين لوارث صغير بمال باطلة عند الحنفية، لأنهما يثبتان ولاية لأنفسهما؛ وشهادتهما لوارث كبير في مال الميت لا تقبل، وفي غيره تقبل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17257}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17257} شهادة الوصي لمن في حجره لا تقبل عند الحنفية والمالكية والشافعية والحنابلة في الصحيح لأنه متهم، وللشافعية أن يشهد لغيره فيما وُصّي فيه إلى معيّن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17258} وشهادة الوصي على من في حجره تقبل عند المالكية والشافعية والحنابلة في الصحيح، ولا تقبل عند الحنفية وأحمد في رواية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17258} وفي توكيل الوصي غيره: يجيزه الحنفية وبعض الشافعية والحنابلة في طريقة، فيوكل بكل ما يجوز له فعله؛ ويمنعه المالكية والشافعية على المعتمد والحنابلة في المذهب فيما جرت العادة بمباشرته لمثله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17258} وإقرار الوصي على الصغير أو المجنون لا يصح عند الفقهاء الأربعة، لأنه إقرار على الغير، ويكون شاهداً لمن أقر له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17259} وإيداع مال الموصى عليه: يجيزه الحنفية والمالكية والحنابلة إذا كان في مصلحته؛ والشافعية لا يودعون ولا يقرضون إلا عند الخوف من نهب أو حريق أو غرق أو السفر، ويودعون عند ثقة، ويقرضون ثقة مليئاً، والقرض عندهم أولى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17259}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17260} وإعارة مال الصغير: يمنعها جمهور الفقهاء لأنها تبرع، ويجيزها بعض الحنفية استحساناً لأنها من توابع التجارة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17260} وخلط الوصي ماله بمال اليتيم: يجيزه الحنفية إذا كان أنفع للصغير، والمالكية رفقاً به، والحنابلة إذا كان أرفق، والشافعية لا يجيزونه إلا في المأكول مما لا بد منه للإرفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17260}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17261} وقسمة الوصي نيابة عن الورثة أو الموصى له: يجيز الحنفية قسمته نيابة عن الورثة مع الموصى له بالثلث، ولا يجوز عندهم عكسه؛ والمالكية لا يقسم على غائب بلا حاكم؛ والشافعية لا يستقل بقسمة مشترك بينه وبين الموصى عليه؛ والحنابلة يجيزون له قسم مال الموصى عليه مع شريكه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17261}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17263} وضمان الوصي: تصرفه المحقق للمصلحة صحيح، وغير المحقق يُضمّن؛ ويده يد أمانة لا تُضمن إلا بالتعدي أو التفريط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17263} وعزل الوصي وانعزاله: للوصي عزل نفسه في حياة الموصي، وينعزل بفقد شرط من شروط الوصاية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17263}"
  en: "In the lexicon wisaya means to commission someone to act after one's death; one can say he bequeathed something to him, or made him his executor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17216} Technically it is the commission to act after death. It differs from the bequest, which is a gift attached to the time after death made by way of a voluntary act; and from agency, which operates in life, while wisaya is after death; authority is the broader term. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17216}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17217} Its ruling for the testator: it is obligatory when it is for returning wrongful takings and unknown debts, or for young children when their loss is feared; it is recommended for paying a known debt, carrying out bequests and caring for children not at risk of loss. The appointee may accept if he is able and trusts himself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17217} There are two kinds of executor: the judge's executor, appointed by the judge to look after a minor's money, and the testator's executor, chosen by the father, grandfather or one holding their right. The Hanafis list differences between them; for example, the testator's executor may, on Abu Hanifa's view, sell to himself where there is clear benefit, which the judge's executor may not do. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17218} The judge appoints an executor in several cases named by the Hanafis, including a debt owed to or by the deceased, carrying out a will, a minor child, and a minor or absent heir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17218}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17219} If an executor cannot carry out his duties, the Hanafis, Hanbalis and Shafi'is let the judge add another to help him where the executor was appointed by the father or grandfather; if he proves dishonest or dissolute, he is removed in the view of the four schools, and the judge appoints another. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17219}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17220} An executor is either a volunteer, which is a pure trust, or paid: by contract, a binding hire that can be paid from the estate, or without contract, a reward whose amount is set by the work done. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17220} Wisaya has four pillars: the executor, the testator, the thing entrusted and the formula. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17221} The executor must be sane, a Muslim where the ward is Muslim, and able to act; the disputed cases are a minor, a woman, a blind man, a dishonest person, a slave and an unbeliever. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17221}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17224} Under the executor's rank for a minor's guardianship, the Hanafis put the father, then his executor, then the grandfather, and so on; the Malikis and Hanbalis put the father, his executor, then the judge; the Shafi'is do not allow a father to appoint an executor while the grandfather is present. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17230}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17231} The testator must be sane and of age, free according to the majority, and in the view of the Malikis and Hanbalis of sound judgement; the Shafi'is require him to be just, and he must hold authority over the ward. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17231}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17234} The thing entrusted must be a known act the testator may do, such as paying debts or looking after a child. The formula requires offer and acceptance; a dumb person's clear sign suffices. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17234}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17235} Acceptance or refusal may be made in the testator's lifetime according to the detailed views, and the Shafi'is in the preferred view only after death. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17236} Making the appointment conditional or time-limited is permitted by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17237} A full account of the executor's duties follows in the next part of this headword. On the duties of the executor: where the appointment is unrestricted, he must keep and grow the minor's money, spend on him in a reasonable way and pay the dues owed on it, and his authority is measured by the testator's. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17237} The Hanafis list his duties as preparing the dead and buying the shroud, meeting the children's needs, returning deposits and paying debts, returning usurped goods, selling what may perish, carrying out a named bequest and pursuing claims for the deceased. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17238} The Malikis allow him to collect a debt or defer it in the interest of the ward, to spend on the child reasonably, to pay the zakat al-fitr, and to hand money out on mudaraba or as capital. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17238} The Shafi'is name four duties: keeping the principal, growing the yield, spending reasonably, and paying the dues on the money; trading the ward's money is recommended under four conditions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17238}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17240} Dues owed to God include zakat al-fitr and the tithes; Abu Hanifa dropped the zakat on property except from an adult of sound mind. Dues to people include debts, which the executor must pay when proven and demanded, and damages, which are paid from the money or, for homicide by mistake, by the kin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17240}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17241} Hanbalis list his duties as paying debts, carrying out the bequest, looking after non-responsible persons, returning deposits and usurped goods, and the hadd for slander. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17241} On zakat al-fitr for a minor the Malikis, Shafi'is, Hanbalis, Abu Hanifa and Abu Yusuf hold it due from the minor's money, while Muhammad and Zufar do not allow the executor to pay it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17241}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17242} On sacrifice for a minor, Abu Hanifa and Abu Yusuf require it of a well-off executor, the Malikis recommend it, the Hanbalis allow it from large means, and the Shafi'is and Muhammad and Zufar forbid it from the minor's money. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17242}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17243} Dispositions: real estate is sold only for need or a clear benefit, movables may be sold to an outsider at market price; self-dealing is forbidden by the majority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17243} Trade with the ward's money takes three forms: trade for himself, trade for the ward, and handing it out on mudaraba. The Hanafis and Malikis forbid self-trade, and Abu Hanifa and Muhammad make the executor guarantee the capital and give the profit in alms. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17243}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17244} Trade for the ward is allowed by the Hanafis, Shafi'is and the Hanbali school, and forbidden by a Maliki view and a Hanbali face. Mudaraba with the ward's money is lawful, recommended by most, obligatory in the Shafi'i view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17244}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17245} Hiring out the ward is lawful for others, and the executor hiring the ward himself is treated in detail after puberty; leasing the ward's land for a long term is not valid in the Hanafi view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17245}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17246} Contracts made before puberty are discussed: the Hanafis let the ward dissolve nothing made over his property; the other schools distinguish by what the executor knew of the age. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17246}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17247} The four schools forbid any gift, alms or bequest from the ward's money, as pure harm. Selling it for a return has three views. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17247}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17248} On claims of pre-emption: where it helps the ward, the Hanafis, Malikis, Shafi'is and Hanbalis allow it and the Shafi'is and Hanbalis, with Muhammad and Zufar, make it obligatory; where leaving it helps him, it may be left. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17249}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17250} Where taking and leaving are equally good, the Shafi'is have three views: forbidden, obligatory, or optional. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17250}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17251} Borrowing from the ward for oneself is forbidden by the Hanafis, Malikis and Hanbalis; lending his money to others is allowed only in need or necessity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17251}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17252} Pledging the ward's money for a debt of his own is forbidden by the Hanafis, Malikis and Shafi'is, and by the Hanbali school. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17252}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17253} On a dispute over expenses the executor's oath is accepted in ordinary expenses by the four schools; the Hanafis list twelve matters where his word stands without proof. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17253}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17254} On a dispute over the period of expenses or the date of the testator's death, the ward's word is accepted by the Malikis, Shafi'is, Hanbalis and Muhammad, and Abu Yusuf accepts the executor's. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17254} On handing the money back after puberty there are three views: the ward's word (Malikis in the preferred view, Shafi'is), the executor's oath (Hanafis), and the Hanbalis who distinguish a volunteer from a paid executor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17254}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17255} The executor's fee: if the father or the judge fixed one, both rich and poor may take it; a rich executor without a fixed fee takes nothing; a poor one may take it under limits in the Hanafi preference, Maliki, Shafi'i and Hanbali views. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17255}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17256} Appointing a further executor when none was named is allowed by the Hanafis, Malikis and a Hanbali report, and refused by the Shafi'is and the Hanbali school. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17256} An executor's acknowledgement of a debt against the dead is void for the Hanafis and Hanbalis, unless the acknowledger is an heir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17256}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17257} The testimony of two executors for a minor heir is void for the Hanafis; for an adult heir it is not accepted in the estate, and is accepted outside it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17257}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17257} The headword continues beyond p.17257; the remaining part is to be read in a later batch. Testimony of an executor for someone in his charge is refused by the Hanafis, Malikis, Shafi'is and Hanbalis in the preferred view, as an interested party; a Shafi'i may testify for another in matters where he holds a named trust. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17258} His testimony against the ward is accepted by the Malikis, Shafi'is and Hanbalis in the preferred view, and refused by the Hanafis and a Hanbali report. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17258} On appointing an agent, the Hanafis, some Shafi'is and a Hanbali method allow him to appoint an agent for anything he may do; the Malikis, the Shafi'i standard view and the Hanbali school forbid it where custom has him do the act himself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17258} An executor's acknowledgement on behalf of the ward is not valid in the four schools, since it binds another. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17259} Depositing the ward's money: the Hanafis, Malikis and Hanbalis allow it where it benefits the child; the Shafi'is deposit or lend only for fear of theft, fire, drowning or travel, to a trustworthy person, and prefer a loan to a trustworthy solvent debtor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17259}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17260} Lending out the ward's money as a loan of use is forbidden by most jurists as a gift; some Hanafis allow it by discretion, since it follows from trade. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17260} Mixing the executor's money with the ward's: the Hanafis allow it when it is more useful, the Malikis for ease, the Hanbalis if it is easier, and the Shafi'is only for food needed for cooking. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17260}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17261} Division by the executor on behalf of heirs or the legatee: the Hanafis allow him to divide on behalf of the heirs with a legatee of a third, but not the reverse; the Malikis forbid dividing for an absent party without a judge; the Shafi'is forbid him to divide a common share on his own; the Hanbalis allow it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17261}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17263} The executor's liability: a measure that clearly serves the ward is valid; one that does not serve him makes him liable; his hand is that of a trustee, liable only for transgression or neglect. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17263} Dismissal: the executor may dismiss himself during the testator's life, and he is removed by losing a condition of executorship. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17263}"
