id: concept/wisaya-fiqh
class: concept
kind: legal
label:
  ar: "وِصاية"
  en: "Wisaya (executorship)"
  es: "Mago (albacea)"
  fr: "Magicien (exécuteur testamentaire)"
  ur: "وزرڈ ⁦(ایگزیکیوٹرشپ)⁩"
summary:
  ar: "الوصاية في اللغة الأمر بالتصرف بعد الموت، ويقال أوصى له بشيء وأوصى إليه جعله وصيّه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17216} والوصاية في الاصطلاح هي الأمر بالتصرف بعد الموت، وتفارق الوصيةَ، وهي تمليك مضاف لما بعد الموت بطريق التبرع، ويفارق الوكالةَ أنها بعد الموت والوكالة في الحياة، والولاية أعمّ منها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17216}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17217} وحكمها للموصي: تجب إذا كانت لرد المظالم والديون المجهولة، أو للأولاد الصغار إذا خِيف ضياعهم، وتستحب لقضاء دين معلوم وإنفاذ الوصايا والنظر في أمر الصغار الذين لا يُخشى عليهم الضياع. وللموصى إليه القبول إذا قدر ووثق من نفسه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17217} والأوصياء نوعان: وصي القاضي يعينه القاضي للإشراف على شؤون القاصر المالية، ووصي الميت يختاره الأب أو الجد أو من له حق الولاية من قبلهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17217} ونص الحنفية على فروق بين النوعين، منها أن وصي الميت يجوز له البيع من نفسه إذا فيه نفع ظاهر عند أبي حنيفة، ووصي القاضي لا يملك ذلك، وأن القاضي يملك عزل وصي القاضي دون وصي الميت العدل الكافي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17218} وذكر الحنفية مواضع ينصب فيها القاضي وصياً، منها ما إذا كان على الميت دين أو له، أو لتنفيذ وصيته، أو إذا كان له ولد صغير، أو إذا كان في الورثة صغير أو غائب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17218}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17219} إذا عجز الوصي عن القيام بمهامه ضم القاضي إليه غيره عند الحنفية والحنابلة والشافعية إذا كان وصي الأب أو الجد، وإن ظهرت منه خيانة أو فسق عُزل عند الحنفية والمالكية والشافعية والحنابلة وأقيم مكانه غيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17219}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17220} والوصي إما متطوع وهي أمانة محضة، وإما مستجعَل: فإن كان بعقد فهي إجارة لازمة يُستأجر عليه من ماله عند العجز، وإن كان بغير عقد فهي جعالة، معينة أو غير معينة، وتفصّل أجرتها بقدر العمل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17220} أركان الوصاية أربعة: الوصي، والموصي، والموصى به، والصيغة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17221} أما الوصي فيشترط فيه العقل والإسلام إن كان الموصى عليه مسلماً والقدرة على التصرف، ومختلف في الوصاية إلى الصبي والمرأة والأعمى والفاسق والعبد والكافر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17221} فلا تصح الوصاية إلى غير المميز بالاتفاق، وإلى المميز عند الحنفية والمالكية والشافعية والحنابلة على الصحيح، وعند القاضي من الحنابلة تصح إذا جاوز العشر. وذهب أكثر أهل العلم إلى صحتها للمرأة، ونُقل أن عمر أوصى إلى حفصة، وصحّ عند عامتهم للأعمى، وخالف الشافعية في مقابل الأصح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17222}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17223} وفي اشتراط العدالة في الوصي قولان: الحنفية والمالكية وأحمد في رواية لا يشترطونها، والشافعية وأحمد في رواية يشترطونها. وفي الوصاية إلى العبد قولان: الشافعية وأبو يوسف ومحمد لا تصح، والمالكية والحنابلة تصح، وأبو حنيفة يجيزها لعبد الموصي إذا لم يكن في الورثة رشيد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17223}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17224} واتفق الفقهاء على منع الوصاية للكافر على المسلم، واختلفوا في الكافر على الكافر على ثلاثة أقوال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17224} واختلفوا في وقت اعتبار شروط الوصي على أربعة أقوال: عند موت الموصي، أو عند الإيصاء، أو عندهما معاً، أو فيهما وفيما بينهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17224}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17225} وتصح الوصاية إلى اثنين فأكثر، ولكل منهما ما خُصّ به؛ وإذا أطلق الموصي الوصاية لهما ولم يحدد فالجمهور على أن لا ينفرد أحدهما بالتصرف، واستثنى الحنفية أمورا منها تجهيز الميت وطعام الصغار وكسوتهم، وقبول الهبات، وبيع ما يخشى تلفه، وجمع الأموال الضائعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17225}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17227} وإذا مات أحد الوصيين أو فسق أو جنّ أقام القاضي مكانه آخر عند الحنفية والشافعية والحنابلة، ورأى المالكية أن يقضي القاضي بالأصلح من استقلال الباقي أو ضم غيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17228} واختلف الفقهاء في اقتسام المال بين الوصيين عند اختلافهما في حفظه: فالمالكية والحنابلة يمنعونه لأن الموصي لم يأمن أحدهما على الحفظ، والحنفية يجيزون القسمة إن قبلها المال، وإلا تهايآ أو أودعاه عند أمين، والشافعية أن أمين الحفظ لا ينفرد أحدهما بحال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17229}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17230} ويرتب الفقهاء الوصي في الولاية على القاصر: عند الحنفية الأب ثم وصيه ثم وصي وصيه، ثم أبو الأب، ثم القاضي، وعند المالكية والحنابلة الأب ثم وصيه ثم القاضي، ويرى المالكية للأم شروطا لتوصي، والشافعية لا يجوزون للأب نصب وصي إذا كان الجد حاضراً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17230}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17231} الركن الثاني الموصي، ويشترط فيه التكليف وهو العقل والبلوغ، فلا تصح من مجنون ولا من غير مميز، وفي المميز خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17231}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17232} ويشترط في الموصي الحرية عند الجمهور، وخالف الحنابلة في غير المال، والرشد عند المالكية والحنابلة دون الحنفية والشافعية، والعدالة عند الشافعية دون الحنفية والحنابلة، والولاية على من يوصى عليه، والإسلام في الوصاية على الأولاد المسلمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17232}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17234} الركن الثالث الموصى به: ويشترط أن يكون تصرفاً معلوماً يملك الموصي فعله، مثل قضاء الدين والنظر في أمر الصغير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17234} الركن الرابع الصيغة: ولا بد من الإيجاب والقبول، ويصح الإيجاب بكل لفظ يدل على تفويض الأمر، وجمهور الفقهاء يصححون التعبير بلفظي الوكالة والولاية، والأخرس تكفي إشارته المفهِمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17235} ويصح قبول الوصاية وردها في حياة الموصي عند جمهور الفقهاء بتفصيل، وعند الشافعية في الأصح لا يصح قبولها أو ردها إلا بعد الوفاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17236} والتعليق والتأقيت في صيغة الوصاية جائزان بالاتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17237} ومن واجبات الوصي حفظ أموال اليتامى وتثميرها والنفقة عليهم بالمعروف وإخراج ما تعلق بها من حقوق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17237} واجبات الوصي: إن كانت الوصاية مطلقة لزمه القيام بما وُصّي به من حفظ مال الصغير وتثميره والنفقة عليه بالمعروف وإخراج ما تعلق بماله من حقوق لله وللناس، وولايته بقدر ولاية الموصي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17237} عدّ الحنفية من واجباته تجهيز الميت وشراء كفنه، وقضاء حاجة الصغار، ورد الوديعة وقضاء الدين، ورد المغصوب، وبيع ما يخشى تلفه، وتنفيذ الوصية المعينة، والخصومة في حق الميت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17238} وقال المالكية: للوصي اقتضاء الدين وتأخيره بحسب المصلحة، والنفقة على الصغير بالمعروف، وإخراج زكاة الفطر، ودفع المال قراضاً أو بضاعة وله عدم دفعه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17238} وعدّ الشافعية أربعة واجبات: حفظ الأصول، وتثمير الفروع، والإنفاق بالمعروف، وإخراج ما تعلق بالمال من حقوق، وفصّلوا في الضمان عند التفريط أو الإهمال بالعمارة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17238}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17239} والتجارة بمال الصغير مندوبة بأربعة شروط: أن يكون المال ناضّاً، والزمان آمناً، والسلطان عادلاً، والتجارة مربحة؛ والاستغلال بالإجارة، والنفقة بالمعروف لا سرف فيها ولا تقصير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17239}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17240} وحقوق الله المتعلقة بالمال زكاة الفطر والأعشار ⁦(واجبة إجماعاً)⁩، وزكاة الأموال أسقطها أبو حنيفة إلا عن بالغ عاقل. وحقوق الآدميين: الدين يقضيه الولي إذا ثبت وطالب الدائن، والجناية على المال تُغرم من المال، والجناية على النفس الخطأ على العاقلة، والعمد فيه قولان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17240}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17241} وذكر الحنابلة من واجبات الوصي قضاء الديون وتفريق الوصية والنظر في أمر غير المكلف، ورد الودائع والمغصوب، وحد القذف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17241} وزكاة الفطر واجبة في مال الصغير عند المالكية والشافعية والحنابلة وأبي حنيفة وأبي يوسف، وخالف محمد وزفر فلم يجيزا للوصي إخراجها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17241}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17242} وأما تضحية الوصي عن الصغير فأوجبها أبو حنيفة وأبو يوسف على الموسر، وسنّها المالكية، وجازها الحنابلة من مال الصغير الكثير، ومنعها الشافعية ومحمد وزفر من مال الصغير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17242}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17243} تصرفات الوصي: لا يباع العقار إلا لحاجة أو مصلحة ظاهرة، والمنقول يباع ويشترى من أجنبي بمثل القيمة أو بغبن يسير، والبيع والشراء من النفس ممنوع عند الجمهور؛ وعند الحنفية يجوز وصي الأب ذلك عند أبي حنيفة ولا يجوز وصي القاضي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17243} والاتجار بمال الموصى عليه ثلاثة طرق: أن يتجر الوصي لنفسه، أو يتجر في مال اليتيم لليتيم، أو يدفعه مضاربة. فالحنفية والمالكية يمنعون الاتجار لنفسه، والحنفية يوجبون ضمان رأس المال والتصدق بالربح عند أبي حنيفة ومحمد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17243}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17244} واتجار الوصي في مال اليتيم لليتيم جائز عند الحنفية والشافعية والحنابلة في المذهب، وممنوع عند المالكية في قول والحنابلة في وجه. والمضاربة بمال اليتيم مشروعة؛ والجمهور على استحبابها، والشافعية على وجوبها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17244}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17245} وتأجير الصبي الموصى عليه للغير جائز باتفاق المذاهب، وإجارة الصبي نفسه للوصي فيها تفصيل بعد البلوغ، وتأجير أرض الصبي إجارة طويلة لا يصح عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17245}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17246} وإذا بلغ الصبي رشيداً أثناء الإجارة اختلف الفقهاء في فسخها: فالحنفية ليس للصبي فسخ الإجارة على ماله، والمالكية والشافعية والحنابلة بتفصيل بحسب علم الوصي بالبلوغ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17246}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17247} ولا يجوز للوصي التبرع بمال الصغير هبة أو صدقة أو وصية عند الفقهاء الأربعة، لأن ذلك ضرر محض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17247}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17248} وفي هبة الوصي مال الصغير بعوض ثلاثة أقوال: عند أبي حنيفة وأبي يوسف والمالكية والشافعية لا يجوز، وعند محمد يجوز، وعند الحنابلة يجوز إن كان العوض بقدر القيمة فأكثر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17248}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17249} وطلب الوصي الشفعة للصغير إن كان فيه حظ: الحنفية والمالكية والشافعية والحنابلة يجيزونه، وعند الشافعية والحنابلة ومحمد وزفر يجب. وإذا كان الترك في مصلحة الصغير جاز تركها عند الجميع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17249}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17250} وإذا استوت المصلحة في الأخذ والترك فللشافعية ثلاثة أوجه: التحريم، والوجوب، والتخيير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17250}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17251} وإقراض الوصي مال الصغير لنفسه ممنوع عند الحنفية والمالكية والحنابلة للتهمة، وأجازه محمد وقول للمالكية إذا كان فيه وفاء. وإقراضه للغير لا يجوز عند الحنفية والشافعية والحنابلة إلا لضرورة أو حاجة أو مصلحة، ورأى المالكية وإحدى روايتي أحمد منع تسليف المال على وجه المعروف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17251}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17252} ويجيز الحنفية استقراض الوصي مالاً للصغير إذا دعت الحاجة إليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17252} ورهن الوصي مال الصغير بدين عليه يجوز بمصلحة عند ثقة عند المالكية والشافعية والحنابلة، ويجيزه الحنفية في دين التجارة؛ ورهنه بدين للوصي على الصغير ممنوع عند الحنفية والمالكية والشافعية وهو المذهب عند الحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17252}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17253} وإذا اختلف الوصي والصغير في قدر النفقة فالقول قول الوصي بيمينه في نفقة المثل عند الفقهاء الأربعة، ونص الحنفية على اثنتي عشرة مسألة يُقبل فيها قول الوصي بلا بينة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17253}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17254} وإذا اختلفا في مدة النفقة أو في تاريخ موت الموصي فالقول قول الصغير عند المالكية والشافعية والحنابلة ومحمد، وقال أبو يوسف القول قول الوصي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17254} وإذا اختلفا في دفع المال للصغير بعد بلوغه فللفقهاء ثلاثة أقوال: القول قول الصغير عند المالكية في المشهور والشافعية، وقول الوصي بيمينه عند الحنفية، والحنابلة يفرّقون بين المتبرع فيقبل قوله وبين المستأجر فلا يقبل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17254}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17255} وأجرة الوصي: إن فرضها الأب أو القاضي أخذها الغني والفقير، ولا يأخذ الغني شيئاً إن لم تُفرض، وأما الفقير إن لم تُفرض فللحنفية في الاستحسان والمالكية والشافعية والحنابلة أن يأخذ بضوابط، والقياس عند الحنفية المنع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17255}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17256} وإيصاء الوصي إذا لم يُعيّن له من يوصيه: يجيزه الحنفية والمالكية وأحمد في رواية، ويمنعه الشافعية والحنابلة في المذهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17256} وإقرار الوصي بدين على الميت لا يجوز عند الحنفية والحنابلة إلا أن يكون المقِرّ وارثاً فيصح في حصته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17256}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17257} وشهادة الوصيين لوارث صغير بمال باطلة عند الحنفية، لأنهما يثبتان ولاية لأنفسهما؛ وشهادتهما لوارث كبير في مال الميت لا تقبل، وفي غيره تقبل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17257}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17257} شهادة الوصي لمن في حجره لا تقبل عند الحنفية والمالكية والشافعية والحنابلة في الصحيح لأنه متهم، وللشافعية أن يشهد لغيره فيما وُصّي فيه إلى معيّن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17258} وشهادة الوصي على من في حجره تقبل عند المالكية والشافعية والحنابلة في الصحيح، ولا تقبل عند الحنفية وأحمد في رواية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17258} وفي توكيل الوصي غيره: يجيزه الحنفية وبعض الشافعية والحنابلة في طريقة، فيوكل بكل ما يجوز له فعله؛ ويمنعه المالكية والشافعية على المعتمد والحنابلة في المذهب فيما جرت العادة بمباشرته لمثله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17258} وإقرار الوصي على الصغير أو المجنون لا يصح عند الفقهاء الأربعة، لأنه إقرار على الغير، ويكون شاهداً لمن أقر له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17259} وإيداع مال الموصى عليه: يجيزه الحنفية والمالكية والحنابلة إذا كان في مصلحته؛ والشافعية لا يودعون ولا يقرضون إلا عند الخوف من نهب أو حريق أو غرق أو السفر، ويودعون عند ثقة، ويقرضون ثقة مليئاً، والقرض عندهم أولى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17259}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17260} وإعارة مال الصغير: يمنعها جمهور الفقهاء لأنها تبرع، ويجيزها بعض الحنفية استحساناً لأنها من توابع التجارة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17260} وخلط الوصي ماله بمال اليتيم: يجيزه الحنفية إذا كان أنفع للصغير، والمالكية رفقاً به، والحنابلة إذا كان أرفق، والشافعية لا يجيزونه إلا في المأكول مما لا بد منه للإرفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17260}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17261} وقسمة الوصي نيابة عن الورثة أو الموصى له: يجيز الحنفية قسمته نيابة عن الورثة مع الموصى له بالثلث، ولا يجوز عندهم عكسه؛ والمالكية لا يقسم على غائب بلا حاكم؛ والشافعية لا يستقل بقسمة مشترك بينه وبين الموصى عليه؛ والحنابلة يجيزون له قسم مال الموصى عليه مع شريكه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17261}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17263} وضمان الوصي: تصرفه المحقق للمصلحة صحيح، وغير المحقق يُضمّن؛ ويده يد أمانة لا تُضمن إلا بالتعدي أو التفريط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17263} وعزل الوصي وانعزاله: للوصي عزل نفسه في حياة الموصي، وينعزل بفقد شرط من شروط الوصاية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17263}"
  en: "In the lexicon wisaya means to commission someone to act after one's death; one can say he bequeathed something to him, or made him his executor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17216} Technically it is the commission to act after death. It differs from the bequest, which is a gift attached to the time after death made by way of a voluntary act; and from agency, which operates in life, while wisaya is after death; authority is the broader term. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17216}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17217} Its ruling for the testator: it is obligatory when it is for returning wrongful takings and unknown debts, or for young children when their loss is feared; it is recommended for paying a known debt, carrying out bequests and caring for children not at risk of loss. The appointee may accept if he is able and trusts himself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17217} There are two kinds of executor: the judge's executor, appointed by the judge to look after a minor's money, and the testator's executor, chosen by the father, grandfather or one holding their right. The Hanafis list differences between them; for example, the testator's executor may, on Abu Hanifa's view, sell to himself where there is clear benefit, which the judge's executor may not do. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17218} The judge appoints an executor in several cases named by the Hanafis, including a debt owed to or by the deceased, carrying out a will, a minor child, and a minor or absent heir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17218}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17219} If an executor cannot carry out his duties, the Hanafis, Hanbalis and Shafi'is let the judge add another to help him where the executor was appointed by the father or grandfather; if he proves dishonest or dissolute, he is removed in the view of the four schools, and the judge appoints another. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17219}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17220} An executor is either a volunteer, which is a pure trust, or paid: by contract, a binding hire that can be paid from the estate, or without contract, a reward whose amount is set by the work done. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17220} Wisaya has four pillars: the executor, the testator, the thing entrusted and the formula. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17221} The executor must be sane, a Muslim where the ward is Muslim, and able to act; the disputed cases are a minor, a woman, a blind man, a dishonest person, a slave and an unbeliever. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17221}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17224} Under the executor's rank for a minor's guardianship, the Hanafis put the father, then his executor, then the grandfather, and so on; the Malikis and Hanbalis put the father, his executor, then the judge; the Shafi'is do not allow a father to appoint an executor while the grandfather is present. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17230}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17231} The testator must be sane and of age, free according to the majority, and in the view of the Malikis and Hanbalis of sound judgement; the Shafi'is require him to be just, and he must hold authority over the ward. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17231}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17234} The thing entrusted must be a known act the testator may do, such as paying debts or looking after a child. The formula requires offer and acceptance; a dumb person's clear sign suffices. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17234}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17235} Acceptance or refusal may be made in the testator's lifetime according to the detailed views, and the Shafi'is in the preferred view only after death. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17236} Making the appointment conditional or time-limited is permitted by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17237} A full account of the executor's duties follows in the next part of this headword. On the duties of the executor: where the appointment is unrestricted, he must keep and grow the minor's money, spend on him in a reasonable way and pay the dues owed on it, and his authority is measured by the testator's. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17237} The Hanafis list his duties as preparing the dead and buying the shroud, meeting the children's needs, returning deposits and paying debts, returning usurped goods, selling what may perish, carrying out a named bequest and pursuing claims for the deceased. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17238} The Malikis allow him to collect a debt or defer it in the interest of the ward, to spend on the child reasonably, to pay the zakat al-fitr, and to hand money out on mudaraba or as capital. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17238} The Shafi'is name four duties: keeping the principal, growing the yield, spending reasonably, and paying the dues on the money; trading the ward's money is recommended under four conditions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17238}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17240} Dues owed to God include zakat al-fitr and the tithes; Abu Hanifa dropped the zakat on property except from an adult of sound mind. Dues to people include debts, which the executor must pay when proven and demanded, and damages, which are paid from the money or, for homicide by mistake, by the kin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17240}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17241} Hanbalis list his duties as paying debts, carrying out the bequest, looking after non-responsible persons, returning deposits and usurped goods, and the hadd for slander. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17241} On zakat al-fitr for a minor the Malikis, Shafi'is, Hanbalis, Abu Hanifa and Abu Yusuf hold it due from the minor's money, while Muhammad and Zufar do not allow the executor to pay it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17241}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17242} On sacrifice for a minor, Abu Hanifa and Abu Yusuf require it of a well-off executor, the Malikis recommend it, the Hanbalis allow it from large means, and the Shafi'is and Muhammad and Zufar forbid it from the minor's money. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17242}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17243} Dispositions: real estate is sold only for need or a clear benefit, movables may be sold to an outsider at market price; self-dealing is forbidden by the majority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17243} Trade with the ward's money takes three forms: trade for himself, trade for the ward, and handing it out on mudaraba. The Hanafis and Malikis forbid self-trade, and Abu Hanifa and Muhammad make the executor guarantee the capital and give the profit in alms. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17243}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17244} Trade for the ward is allowed by the Hanafis, Shafi'is and the Hanbali school, and forbidden by a Maliki view and a Hanbali face. Mudaraba with the ward's money is lawful, recommended by most, obligatory in the Shafi'i view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17244}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17245} Hiring out the ward is lawful for others, and the executor hiring the ward himself is treated in detail after puberty; leasing the ward's land for a long term is not valid in the Hanafi view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17245}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17246} Contracts made before puberty are discussed: the Hanafis let the ward dissolve nothing made over his property; the other schools distinguish by what the executor knew of the age. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17246}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17247} The four schools forbid any gift, alms or bequest from the ward's money, as pure harm. Selling it for a return has three views. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17247}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17248} On claims of pre-emption: where it helps the ward, the Hanafis, Malikis, Shafi'is and Hanbalis allow it and the Shafi'is and Hanbalis, with Muhammad and Zufar, make it obligatory; where leaving it helps him, it may be left. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17249}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17250} Where taking and leaving are equally good, the Shafi'is have three views: forbidden, obligatory, or optional. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17250}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17251} Borrowing from the ward for oneself is forbidden by the Hanafis, Malikis and Hanbalis; lending his money to others is allowed only in need or necessity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17251}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17252} Pledging the ward's money for a debt of his own is forbidden by the Hanafis, Malikis and Shafi'is, and by the Hanbali school. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17252}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17253} On a dispute over expenses the executor's oath is accepted in ordinary expenses by the four schools; the Hanafis list twelve matters where his word stands without proof. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17253}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17254} On a dispute over the period of expenses or the date of the testator's death, the ward's word is accepted by the Malikis, Shafi'is, Hanbalis and Muhammad, and Abu Yusuf accepts the executor's. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17254} On handing the money back after puberty there are three views: the ward's word (Malikis in the preferred view, Shafi'is), the executor's oath (Hanafis), and the Hanbalis who distinguish a volunteer from a paid executor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17254}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17255} The executor's fee: if the father or the judge fixed one, both rich and poor may take it; a rich executor without a fixed fee takes nothing; a poor one may take it under limits in the Hanafi preference, Maliki, Shafi'i and Hanbali views. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17255}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17256} Appointing a further executor when none was named is allowed by the Hanafis, Malikis and a Hanbali report, and refused by the Shafi'is and the Hanbali school. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17256} An executor's acknowledgement of a debt against the dead is void for the Hanafis and Hanbalis, unless the acknowledger is an heir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17256}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17257} The testimony of two executors for a minor heir is void for the Hanafis; for an adult heir it is not accepted in the estate, and is accepted outside it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17257}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17257} The headword continues beyond p.17257; the remaining part is to be read in a later batch. Testimony of an executor for someone in his charge is refused by the Hanafis, Malikis, Shafi'is and Hanbalis in the preferred view, as an interested party; a Shafi'i may testify for another in matters where he holds a named trust. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17258} His testimony against the ward is accepted by the Malikis, Shafi'is and Hanbalis in the preferred view, and refused by the Hanafis and a Hanbali report. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17258} On appointing an agent, the Hanafis, some Shafi'is and a Hanbali method allow him to appoint an agent for anything he may do; the Malikis, the Shafi'i standard view and the Hanbali school forbid it where custom has him do the act himself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17258} An executor's acknowledgement on behalf of the ward is not valid in the four schools, since it binds another. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17259} Depositing the ward's money: the Hanafis, Malikis and Hanbalis allow it where it benefits the child; the Shafi'is deposit or lend only for fear of theft, fire, drowning or travel, to a trustworthy person, and prefer a loan to a trustworthy solvent debtor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17259}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17260} Lending out the ward's money as a loan of use is forbidden by most jurists as a gift; some Hanafis allow it by discretion, since it follows from trade. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17260} Mixing the executor's money with the ward's: the Hanafis allow it when it is more useful, the Malikis for ease, the Hanbalis if it is easier, and the Shafi'is only for food needed for cooking. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17260}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17261} Division by the executor on behalf of heirs or the legatee: the Hanafis allow him to divide on behalf of the heirs with a legatee of a third, but not the reverse; the Malikis forbid dividing for an absent party without a judge; the Shafi'is forbid him to divide a common share on his own; the Hanbalis allow it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17261}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17263} The executor's liability: a measure that clearly serves the ward is valid; one that does not serve him makes him liable; his hand is that of a trustee, liable only for transgression or neglect. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17263} Dismissal: the executor may dismiss himself during the testator's life, and he is removed by losing a condition of executorship. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17263}"
  es: "En el léxico, wisaya significa encargar a alguien que actúe después de la muerte de uno; se puede decir que le legó algo o lo nombró su albacea. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17216} Técnicamente es el encargo de actuar después de la muerte. Se diferencia del legado, que es un donativo vinculado al tiempo después de la muerte hecho por medio de un acto voluntario; y de la agencia, que opera en vida, mientras que wisaya es después de la muerte; autoridad es el término más amplio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17216}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17217} Su regla para el testador: es obligatorio cuando se trata de devolver tomas indebidas y deudas desconocidas, o para niños pequeños cuando se teme su pérdida; Se recomienda para pagar una deuda conocida, ejecutar legados y cuidar de niños que no corren riesgo de pérdida. El designado puede aceptar si es capaz y confía en sí mismo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17217} Hay dos tipos de albacea: el albacea del juez, designado por el juez para administrar el dinero de un menor, y el albacea del testador, elegido por el padre, el abuelo o quien tenga su derecho. Los Hanafi enumeran las diferencias entre ellos; por ejemplo, el albacea del testador puede, según la opinión de Abu Hanifa, venderse a sí mismo cuando hay un beneficio claro, lo que el albacea del juez no puede hacer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17218} El juez nombra un albacea en varios casos mencionados por los Hanafis, incluyendo una deuda debida al difunto o por el difunto, el cumplimiento de un testamento, un hijo menor de edad y un heredero menor de edad o ausente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17218}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17219} Si un albacea no puede cumplir con sus deberes, los Hanafis, Hanbalis y Shafi'is permiten que el juez agregue otro para ayudarlo cuando el albacea fue nombrado por el padre o el abuelo; si resulta deshonesto o disoluto, es removido según la opinión de las cuatro escuelas, y el juez nombra a otro. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17219}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17220} Un albacea es voluntario, lo cual es un fideicomiso puro, o remunerado: por contrato, un alquiler vinculante que puede pagarse con la herencia, o sin contrato, una recompensa cuyo monto se establece por el trabajo realizado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17220} Wisaya tiene cuatro pilares: el albacea, el testador, la cosa confiada y la fórmula. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17221} El albacea debe ser cuerdo, musulmán donde el tutelado es musulmán, y capaz de actuar; Los casos en disputa son un menor, una mujer, un hombre ciego, una persona deshonesta, un esclavo y un incrédulo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17221}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17224} Bajo el rango de albacea para la tutela de un menor, los Hanafis ponen al padre, luego a su albacea, luego al abuelo, y así sucesivamente; los Malikis y Hanbalis ponen al padre, a su albacea, luego al juez; los Shafi'is no permiten que un padre nombre a un albacea mientras el abuelo esté presente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17230}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17231} El testador debe ser cuerdo y mayor de edad, libre según la mayoría de edad, y en opinión de los malikíes y hanbalíes de buen juicio; los shafi'ís requieren que sea justo, y debe tener autoridad sobre el tutelado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17231}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17234} La cosa confiada debe ser un acto conocido que el testador puede realizar, como pagar deudas o cuidar a un niño. La fórmula requiere oferta y aceptación; una señal clara de una persona muda es suficiente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17234}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17235} La aceptación o el rechazo pueden hacerse en vida del testador según las opiniones detalladas, y los shafi'ís en la opinión preferida solo después de la muerte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17236} Hacer que el nombramiento sea condicional o limitado en el tiempo está permitido por acuerdo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17237} Una descripción completa de los deberes del albacea sigue en la siguiente parte de este encabezado. Sobre los deberes del albacea: cuando el nombramiento no está restringido, debe mantener y aumentar el dinero del menor, gastar en él de manera razonable y pagar los derechos adeudados sobre él, y su autoridad se mide por la del testador. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17237} Los hanafíes enumeran sus deberes como preparar al difunto y comprar la mortaja, satisfacer las necesidades de los hijos, devolver los depósitos y pagar las deudas, devolver los bienes usurpados, vender lo que pueda perecer, ejecutar un legado nombrado y reclamar derechos para el difunto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17238} Los malikíes le permiten cobrar una deuda o diferirla en interés del pupilo, gastar en el niño de manera razonable, pagar el zakat al-fitr y entregar dinero en mudaraba o como capital. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17238} Los shafi'íes nombran cuatro deberes: conservar el capital, aumentar el rendimiento, gastar razonablemente y pagar los derechos sobre el dinero; se recomienda comerciar con el dinero del tutelado bajo cuatro condiciones. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17238}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17240} Los deberes a Dios incluyen el zakat al-fitr y los diezmos; Abu Hanifa suprimió el zakat sobre la propiedad excepto de un adulto en pleno uso de sus facultades mentales. Los deberes a las personas incluyen deudas, que el albacea debe pagar cuando se prueban y se exigen, y daños, que se pagan con el dinero o, en caso de homicidio por error, por los parientes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17240}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17241} Los hanbalíes enumeran sus deberes como pagar deudas, llevar a cabo el legado, cuidar de personas no responsables, devolver depósitos y bienes usurpados, y el hadd por calumnia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17241} Sobre el zakat al-fitr para un menor, los malikíes, shafi'ís, hanbalíes, Abu Hanifa y Abu Yusuf sostienen que debe provenir del dinero del menor, mientras que Muhammad y Zufar no permiten que el albacea lo pague. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17241}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17242} Sobre el sacrificio para un menor, Abu Hanifa y Abu Yusuf lo requieren de un albacea adinerado, los Malikis lo recomiendan, los Hanbalis lo permiten de grandes recursos, y los Shafi'is y Muhammad y Zufar lo prohíben del dinero del menor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17242}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17243} Disposiciones: los bienes inmuebles se venden solo por necesidad o beneficio claro, los bienes muebles pueden venderse a un tercero al precio de mercado; la mayoría prohíbe el trato con uno mismo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17243} El comercio con el dinero del pupilo toma tres formas: comercio para sí mismo, comercio para el pupilo y entrega en mudaraba. Los hanafíes y malikíes prohíben el comercio para sí mismo, y Abu Hanifa y Muhammad hacen que el albacea garantice el capital y dé la ganancia en limosna. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17243}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17244} El comercio para el pupilo está permitido por los hanafíes, shafi'íes y la escuela hanbalí, y prohibido por una visión malikí y una visión hanbalí. La mudaraba con el dinero del pupilo es lícita, recomendada por la mayoría, obligatoria en la visión shafi'í. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17244}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17245} Arrendar al pupilo es lícito para otros, y el albacea que lo arrienda él mismo se trata en detalle después de la pubertad; arrendar la tierra del pupilo por un largo plazo no es válido en la visión Hanafi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17245}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17246} Se discuten los contratos hechos antes de la pubertad: los Hanafi permiten que el pupilo disuelva nada hecho sobre su propiedad; las otras escuelas distinguen por lo que el albacea sabía de la edad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17246}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17247} Las cuatro escuelas prohíben cualquier donación, limosna o legado del dinero del pupilo, por ser un daño puro. Venderlo para obtener un retorno tiene tres puntos de vista. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17247}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17248} Sobre las reclamaciones de preferencia: cuando ayuda al pupilo, los Hanafis, Malikis, Shafi'is y Hanbalis lo permiten y los Shafi'is y Hanbalis, con Muhammad y Zufar, lo hacen obligatorio; cuando dejarlo le ayuda, se puede dejar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17249}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17250} Donde tomar y dejar son igualmente buenos, los shafi'ís tienen tres puntos de vista: prohibido, obligatorio u opcional. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17250}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17251} Los hanafíes, malikíes y hanbalíes prohíben pedir prestado al pupilo para uno mismo; prestar su dinero a otros solo está permitido en caso de necesidad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17251}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17252} Empeñar el dinero del pupilo por una deuda propia está prohibido por los Hanafis, Malikis y Shafi'is, y por la escuela Hanbali. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17252}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17253} En una disputa sobre gastos, el juramento del albacea es aceptado en gastos ordinarios por las cuatro escuelas; los Hanafis enumeran doce asuntos en los que su palabra es válida sin prueba. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17253}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17254} En una disputa sobre el período de gastos o la fecha de la muerte del testador, la palabra del pupilo es aceptada por los Malikis, Shafi'is, Hanbalis y Muhammad, y Abu Yusuf acepta la del albacea. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17254} En cuanto a la devolución del dinero después de la pubertad, existen tres puntos de vista: la palabra del pupilo (Malikis en el punto de vista preferido, Shafi'is), el juramento del albacea (Hanafis) y los Hanbalis, que distinguen a un albacea voluntario de uno remunerado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17254}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17255} Los honorarios del albacea: si el padre o el juez fijaron uno, tanto ricos como pobres pueden tomarlo; un albacea rico sin honorarios fijos no toma nada; uno pobre puede tomarlo dentro de los límites en las opiniones de preferencia Hanafi, Maliki, Shafi'i y Hanbali. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17255}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17256} Nombrar a otro albacea cuando no se nombró a ninguno está permitido por los Hanafis, Malikis y un informe Hanbali, y rechazado por los Shafi'is y la escuela Hanbali. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17256} El reconocimiento de una deuda contra los muertos por parte de un albacea es nulo para los Hanafis y Hanbalis, a menos que el reconocedor sea un heredero. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17256}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17257} El testimonio de dos albaceas de un heredero menor es nulo para los Hanafi; para un heredero adulto no se acepta en el patrimonio, pero se acepta fuera de él. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17257}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17257} El encabezado continúa más allá de la p.17257; La parte restante se leerá en un lote posterior. El testimonio de un albacea para alguien a su cargo es rechazado por los Hanafis, Malikis, Shafi'is y Hanbalis en la opinión preferida, como parte interesada; un Shafi'i puede testificar por otro en asuntos donde posee un fideicomiso nombrado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17258} Su testimonio contra el pupilo es aceptado por los Malikis, Shafi'is y Hanbalis en la opinión preferida, y rechazado por los Hanafis y un informe Hanbali. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17258} Al nombrar un agente, los Hanafis, algunos Shafi'is y un método Hanbali le permiten nombrar un agente para cualquier cosa que pueda hacer; los Malikis, la opinión estándar Shafi'i y la escuela Hanbali lo prohíben cuando la costumbre le dice que haga el acto él mismo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17258} El reconocimiento de un albacea en nombre del pupilo no es válido en las cuatro escuelas, ya que obliga a otro. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17259} Depositar el dinero del pupilo: los hanafíes, malikíes y hanbalíes lo permiten cuando beneficia al niño; los shafiíes depositan o prestan solo por temor a robo, incendio, ahogamiento o viaje, a una persona de confianza, y prefieren un préstamo a un deudor solvente y confiable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17259}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17260} Prestar el dinero del pupilo como préstamo de uso está prohibido por la mayoría de los juristas como donación; Algunos hanafíes lo permiten a discreción, ya que se deriva del comercio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17260} Mezclar el dinero del albacea con el del pupilo: los hanafíes lo permiten cuando es más útil, los malikíes por conveniencia, los hanbalíes si es más fácil, y los shafi'íes solo para alimentos necesarios para cocinar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17260}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17261} División por el albacea en nombre de los herederos o del legatario: los hanafíes le permiten dividir en nombre de los herederos con un legatario de un tercio, pero no al revés; los malikíes prohíben dividir para una parte ausente sin un juez; los shafi'íes le prohíben dividir una parte común por sí mismo; Los hanbalíes lo permiten. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17261}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17263} Responsabilidad del albacea: una medida que claramente beneficia al tutelado es válida; una que no lo beneficia lo hace responsable; su mano es la de un fideicomisario, responsable solo por transgresión o negligencia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17263} Destitución: el albacea puede destituirse a sí mismo durante la vida del testador, y es destituido al perder una condición del cargo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17263}"
  fr: "Dans le lexique, le terme « wisaya » signifie charger quelqu'un d'agir après le décès; on peut dire qu'il lui a légué quelque chose ou qu'il l'a désigné comme exécuteur testamentaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17216} Techniquement, il s'agit d'une charge d'agir après la mort. Cela diffère du legs, qui est un don lié à la période postérieure au décès et effectué par un acte volontaire; et du mandat, qui s'exerce du vivant du testateur, tandis que le wisaya s'applique après la mort; le terme « autorité » est plus général. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17216}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17217} Concernant le testateur: le wisaya est obligatoire lorsqu'il s'agit de restituer des biens indûment perçus et des dettes inconnues, ou pour les jeunes enfants lorsqu'on craint qu'ils ne soient perdus. Il est recommandé de recourir à la fonction d'exécuteur testamentaire pour régler une dette connue, exécuter un legs et subvenir aux besoins d'enfants non menacés de perte. Le mandataire peut accepter cette fonction s'il en a les moyens et s'il est digne de confiance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17217} Il existe deux types d'exécuteurs testamentaires: l'exécuteur testamentaire désigné par le juge pour gérer les biens d'un mineur, et l'exécuteur testamentaire choisi par le père, le grand-père ou leur représentant légal. Les hanafites recensent des différences entre eux; par exemple, selon l'avis d'Abu Hanifa, l'exécuteur testamentaire peut vendre des biens à son propre profit s'il en tire un avantage manifeste, ce que l'exécuteur testamentaire désigné par le juge ne peut faire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17218} Le juge désigne un exécuteur testamentaire dans plusieurs cas mentionnés par les Hanafites, notamment en cas de dette due au défunt ou par celui-ci, pour l'exécution d'un testament, pour un enfant mineur et pour un héritier mineur ou absent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17218}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17219} Si un exécuteur testamentaire est dans l'incapacité d'exercer ses fonctions, les Hanafites, les Hanbalites et les Shafi'ites autorisent le juge à désigner un autre exécuteur pour l'assister lorsque celui-ci a été désigné par le père ou le grand-père; si ce dernier se révèle malhonnête ou dissolu, il est destitué selon les quatre écoles, et le juge en désigne un autre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17219}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17220} Un exécuteur testamentaire peut être bénévole, auquel cas il s'agit d'une pure fiducie, ou rémunéré: par contrat, avec une rémunération fixe prélevée sur la succession, ou sans contrat, par une récompense dont le montant est déterminé par le travail accompli. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17220} La wisaya repose sur quatre piliers: l'exécuteur testamentaire, le testateur, le bien confié et la formule. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17221} L'exécuteur testamentaire doit être sain d'esprit, musulman si le pupille l'est également, et capable d'agir. Les cas litigieux concernent un mineur, une femme, un aveugle, une personne malhonnête, un esclave et un incroyant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17221}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17224} Concernant l'ordre de succession pour la tutelle d'un mineur, les Hanafites placent d'abord le père, puis son exécuteur testamentaire, puis le grand-père, et ainsi de suite; les Malikites et les Hanbalites placent d'abord le père, puis son exécuteur testamentaire, puis le juge; les Chafi'ites n'autorisent pas un père à désigner un exécuteur testamentaire en présence du grand-père. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17230}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17231} Le testateur doit être sain d'esprit et majeur, libre selon la majorité, et, de l'avis des Malikites et des Hanbalites, doté d'un jugement sain; les Chafi'ites exigent qu'il soit juste et qu'il exerce son autorité sur le pupille. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17231}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17234} Le legs doit être un acte que le testateur est en mesure d'accomplir, comme le remboursement de dettes ou la garde d'un enfant. La formule requiert une offre et une acceptation; le signe clair d'une personne muette suffit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17234}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17235} L'acceptation ou le refus peut intervenir du vivant du testateur, selon les avis détaillés, et selon l'avis privilégié des Shafi'ites, seulement après son décès. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17236} Il est permis, par accord, de conditionner ou de limiter la nomination. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17237} La suite de ce chapitre présente un exposé complet des devoirs de l'exécuteur testamentaire. Concernant les devoirs de l'exécuteur testamentaire: lorsque sa nomination est sans restriction, il doit gérer et faire fructifier l'argent du mineur, subvenir à ses besoins de manière raisonnable et s'acquitter des dettes y afférentes. Son autorité est limitée à celle du testateur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17237} Les hanafites énumèrent ses devoirs comme suit: préparer le défunt et acheter le linceul, subvenir aux besoins des enfants, restituer les dépôts et payer les dettes, restituer les biens usurpés, vendre les biens périssables, exécuter un legs particulier et faire valoir les droits du défunt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17238} Les malikites l'autorisent à recouvrer une dette ou à en différer le paiement dans l'intérêt du pupille, à subvenir à ses besoins de manière raisonnable, à payer la zakat al-fitr et à distribuer de l'argent à titre de mudaraba ou de capital. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17238} Les chaféites nomment quatre devoirs: préserver le capital, faire fructifier les intérêts, dépenser raisonnablement et s’acquitter des obligations liées à l’argent; le commerce de l’argent du pupille est recommandé sous quatre conditions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17238}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17240} Les obligations dues à Dieu comprennent la zakat al-fitr et les dîmes; Abou Hanifa a supprimé la zakat sur les biens, sauf ceux appartenant à un adulte sain d’esprit. Les obligations envers autrui comprennent les dettes, que l’exécuteur testamentaire doit payer lorsqu’elles sont prouvées et réclamées, et les dommages et intérêts, qui sont payés sur l’argent ou, en cas d’homicide involontaire, par les proches. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17240}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17241} Les hanbalites énumèrent ses devoirs comme étant le paiement des dettes, l'exécution du legs, la protection des personnes démunies, la restitution des dépôts et des biens usurpés, ainsi que le paiement du hadd pour calomnie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17241} Concernant la zakat al-fitr pour un mineur, les écoles malikite, chaféite, hanbalite, Abou Hanifa et Abou Yusuf estiment qu'elle est due sur les biens du mineur, tandis que Muhammad et Zufar n'autorisent pas l'exécuteur testamentaire à la payer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17241}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17242} Concernant le sacrifice pour un mineur, Abu Hanifa et Abu Yusuf exigent un exécuteur testamentaire aisé, les Malikites le recommandent, les Hanbalites l'autorisent s'il est effectué avec des moyens importants, et les Shafi'ites, Muhammad et Zufar l'interdisent s'il est effectué avec l'argent du mineur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17242}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17243} Dispositions: les biens immobiliers ne sont vendus qu'en cas de besoin ou d'avantage manifeste; les biens meubles peuvent être vendus à un tiers au prix du marché; le commerce d'initiés est interdit par la majorité. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17243} Le commerce avec l'argent du pupille prend trois formes: le commerce pour son propre compte, le commerce pour le pupille et la distribution de cet argent sous forme de mudaraba. Les écoles hanafite et malikite interdisent le commerce pour son propre compte, et Abu Hanifa et Muhammad exigent que l'exécuteur testamentaire garantisse le capital et reverse les bénéfices en aumône. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17243}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17244} Le commerce pour le pupille est autorisé par les écoles hanafite, chaféite et hanbalite, mais interdit par une opinion malikite et une opinion hanbalite. La mudaraba avec l'argent du pupille est licite, recommandée par la plupart des rabbins et obligatoire selon l'opinion chaféite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17244}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17245} La location du pupille est licite pour autrui, et le cas où l'exécuteur testamentaire l'embauche lui-même est traité en détail après la puberté; la location à long terme des terres du pupille n'est pas valable selon l'école hanafite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17245}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17246} Les contrats conclus avant la puberté sont examinés: les hanafites autorisent le pupille à dissoudre tout contrat portant sur ses biens; les autres écoles font une distinction selon ce que l'exécuteur testamentaire savait de l'âge du pupille. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17246}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17247} Les quatre écoles interdisent tout don, aumône ou legs provenant des fonds du pupille, car cela est considéré comme un pur préjudice. La vente de ces fonds en vue d'un profit fait l'objet de trois avis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17247}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17248} Concernant le droit de préemption: lorsque cela est avantageux pour le pupille, les écoles hanafite, malikite, chaféite et hanbalite l'autorisent, et les chaféites et les hanbalites, avec Muhammad et Zufar, le rendent obligatoire; lorsque le fait de laisser ces fonds lui est bénéfique, il peut les laisser. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17249}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17250} Lorsque prendre et donner sont également louables, les chaféites ont trois avis: interdit, obligatoire ou facultatif. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17250}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17251} Emprunter auprès du pupille pour soi-même est interdit par les hanafites, les malikites et les hanbalites; prêter son argent à autrui n’est permis qu’en cas de besoin ou de nécessité. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17251}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17252} Les écoles hanafite, malikite et chaféite, ainsi que l'école hanbalite, interdisent de mettre en gage l'argent du pupille pour une dette personnelle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17252}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17253} En cas de litige concernant les dépenses, le serment de l'exécuteur testamentaire est accepté pour les dépenses courantes par les quatre écoles; les hanafites recensent douze cas où sa parole suffit sans preuve. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17253}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17254} En cas de litige concernant la période des dépenses ou la date du décès du testateur, les écoles malikite, chaféite, hanbalite et Muhammad acceptent la parole du pupille, tandis qu'Abou Yusuf accepte celle de l'exécuteur testamentaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17254} Concernant la restitution des fonds après la puberté, trois avis s'affrontent: la parole du pupille (avis privilégié par les malikites et les chaféites), le serment de l'exécuteur testamentaire (école hanafite) et l'école hanbalite, qui distingue un exécuteur testamentaire bénévole d'un exécuteur testamentaire rémunéré. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17254}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17255} Les honoraires de l'exécuteur testamentaire: si le père ou le juge les ont fixés, riches et pauvres peuvent les percevoir; un exécuteur testamentaire riche sans honoraires fixés ne perçoit rien; un exécuteur testamentaire pauvre peut les percevoir dans certaines limites, selon les écoles hanafite, malikite, chaféite et hanbalite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17255}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17256} La nomination d'un exécuteur testamentaire supplémentaire lorsqu'aucun n'a été désigné est autorisée par les écoles hanafite, malikite et selon un avis hanbalite, mais refusée par les écoles chaféite et hanbalite. {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.17256} La reconnaissance par un exécuteur testamentaire d'une dette envers les morts est nulle pour les Hanafis et les Hanbalis, à moins que le reconnaissant ne soit un héritier. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17256}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17257} Le témoignage de deux exécuteurs testamentaires pour un héritier mineur est nul pour les Hanafis; pour un héritier majeur, elle n'est pas acceptée dans la succession, mais est acceptée en dehors de celle-ci. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17257}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17257} Le mot principal continue au-delà de la p.17257; La suite sera lue ultérieurement. Le témoignage d'un exécuteur testamentaire pour une personne placée sous sa tutelle est refusé par les écoles hanafite, malikite, chaféite et hanbalite (dans l'avis majoritaire), car il s'agit d'une partie intéressée. Un chaféite peut témoigner pour autrui dans les affaires où il détient une fiducie nommément désignée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17258} Son témoignage contre le pupille est accepté par les écoles malikite, chaféite et hanbalite (dans l'avis majoritaire), et refusé par les écoles hanafite et selon un rapport hanbalite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17258} Concernant la désignation d'un mandataire, les écoles hanafite, certaines écoles chaféites et une méthode hanbalite autorisent le mandataire à accomplir tout acte qu'il souhaite accomplir; les écoles malikite, l'école chaféite standard et l'école hanbalite l'interdisent lorsque la coutume exige qu'il accomplisse l'acte lui-même. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17258} La reconnaissance de dette d'un exécuteur testamentaire au nom du pupille n'est pas valable dans les quatre écoles rabbiniques, car elle engage une autre personne. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17259} Concernant le dépôt de l'argent du pupille: les écoles hanafite, malikite et hanbalite l'autorisent lorsque cela est bénéfique à l'enfant; l'école chaféite n'autorise le dépôt ou le prêt qu'en cas de crainte de vol, d'incendie, de noyade ou de voyage, auprès d'une personne de confiance, et privilégie le prêt à un débiteur solvable et digne de confiance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17259}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17260} Prêter l'argent du pupille à titre de prêt d'utilité est interdit par la plupart des juristes, car cela constitue un don; certains hanafites l'autorisent à leur discrétion, car cela découle d'un commerce. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17260} Mélanger l'argent de l'exécuteur testamentaire avec celui du pupille: les hanafites l'autorisent lorsque cela est plus utile, les malikites par commodité, les hanbalites si cela est plus facile, et les chaféites uniquement pour les aliments nécessaires à la cuisine. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17260}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17261} Division par l'exécuteur testamentaire au nom des héritiers ou du légataire: les Hanafites l'autorisent à diviser au nom des héritiers avec un légataire ou un tiers, mais non l'inverse; les Malikites interdisent de diviser pour une partie absente sans juge; les Chafi'ites lui interdisent de diviser une part commune à titre personnel; les Hanbalites l'autorisent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17261}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17263} Responsabilité de l'exécuteur testamentaire: une mesure qui sert clairement le pupille est valable; une mesure qui ne le sert pas engage sa responsabilité. Sa main est celle d'un fiduciaire, responsable uniquement en cas de transgression ou de négligence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17263} Révocation: l'exécuteur testamentaire peut se révoquer du vivant du testateur; sa révocation survient lorsqu'il ne remplit plus les conditions requises pour être exécuteur testamentaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17263}"
  ur: "لغت میں وصایا کا مطلب ہے کسی کی موت کے بعد کسی کو کام کرنے کا حکم دینا۔ کوئی کہہ سکتا ہے کہ اس نے اسے کچھ وصیت کی، یا اسے اپنا وصی بنایا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17216} تکنیکی طور پر یہ موت کے بعد عمل کرنے کا کمیشن ہے۔ یہ وصیت سے مختلف ہے، جو کہ موت کے بعد کے وقت سے منسلک ایک تحفہ ہے جو رضاکارانہ عمل کے ذریعے کیا جاتا ہے۔ اور ایجنسی کی طرف سے، جو زندگی میں کام کرتی ہے، جبکہ وسایا موت کے بعد ہے۔ اتھارٹی ایک وسیع تر اصطلاح ہے۔ وصیت کرنے والے کے لیے اس کا حکم: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17216}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17217} وصیت کرنے والے کے لیے اس کا حکم: واجب ہے جب وہ ناجائز قرضوں اور نامعلوم قرضوں کی واپسی کے لیے ہو، یا چھوٹے بچوں کے نقصان کا اندیشہ ہو۔ یہ ایک معروف قرض ادا کرنے، وصیت کرنے اور نقصان کا خطرہ نہ ہونے والے بچوں کی دیکھ بھال کے لیے سفارش کی جاتی ہے۔ مقرر کرنے والا قبول کر سکتا ہے اگر وہ قابل ہو اور خود پر بھروسہ رکھتا ہو۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 صفحہ 17217} دو قسم کے وصیت کرنے والے ہیں: منصف کا وصی کرنے والا، جو جج کی طرف سے نابالغ کی رقم کی دیکھ بھال کے لیے مقرر کیا جاتا ہے، اور وصیت کرنے والا وصیت کرنے والا، جسے باپ، دادا یا ان کا حق رکھنے والا منتخب کرتا ہے۔ حنفیہ ان کے درمیان اختلافات کی فہرست دیتے ہیں۔ مثال کے طور پر، وصیت کرنے والا وصیت کرنے والا، ابو حنیفہ کے خیال پر، جہاں واضح فائدہ ہو، اپنے آپ کو فروخت کر سکتا ہے، جو جج کا عمل کرنے والا نہیں کر سکتا۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17218} حنفیوں کی طرف سے نامزد کردہ متعدد مقدمات میں جج ایک وصی کا تقرر کرتا ہے، جس میں میت پر واجب الادا قرض، وصیت کرنا، نابالغ بچہ، اور نابالغ یا غیر حاضر وارث شامل ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17218}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17219} اگر کوئی عمل کرنے والا اپنی ذمہ داریاں ادا نہیں کر سکتا تو حنفیہ، حنبلی اور شافعی اس کی مدد کے لیے کسی اور کو جج کا اضافہ کرنے دیتے ہیں جہاں پر دادا نے اس کی مدد کی تھی۔ اگر وہ بے ایمان یا منحرف ثابت ہوتا ہے، تو اسے چار مکاتب کی نظر میں ہٹا دیا جاتا ہے، اور جج دوسرے کو مقرر کرتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17219}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17220} ایک عمل کرنے والا یا تو رضاکار ہوتا ہے، جو کہ ایک خالص امانت ہے، یا ادا کیا جاتا ہے: معاہدہ کے ذریعے، ایک پابند کرائے سے جس کی رقم مقرر کی جاتی ہے، جس کی ادائیگی کی جاتی ہے، جو کہ دوبارہ مقرر کی جا سکتی ہے۔ کام کیا {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17220} وسایا کے چار ستون ہیں: وصیت کرنے والا، وصیت کرنے والا، امانت دار چیز اور فارمولا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17221} عمل کرنے والا سمجھدار، ایک مسلمان جہاں وارڈ مسلمان ہو، اور عمل کرنے کے قابل ہو۔ متنازعہ مقدمات نابالغ، عورت، نابینا، بے ایمان، غلام اور کافر ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17221}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17224} نابالغ کی سرپرستی کے لیے وصال کے درجے کے تحت، احناف نے باپ کو، پھر اس کے بعد اس کے دادا کو، اور اس کے بعد جلاد کو؛ مالکیوں اور حنبلیوں نے باپ کو، اس کا عمل کرنے والا، پھر جج کو۔ شافعی والد کو اس بات کی اجازت نہیں دیتے کہ وہ دادا کے موجود ہوتے ہوئے وصال مقرر کرے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ17230}{cite:fiqh-mawsua-kuwaityya-noor-v3 p.17231} وصیت کرنے والے کو عقلمند اور عمر کا ہونا چاہیے، جمہور کے مطابق آزاد، اور مالکیوں اور حنبلیوں کے نزدیک صحیح فیصلہ؛ شافعیوں کا تقاضا ہے کہ وہ عادل ہو، اور اسے وارڈ پر اختیار رکھنا چاہیے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17231}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17234} سپرد کی گئی چیز ایک معروف فعل ہونا چاہیے جو وصیت کرنے والا کرے، جیسے قرض کی ادائیگی یا بچے کی دیکھ بھال۔ فارمولے کے لیے پیشکش اور قبولیت درکار ہے۔ ایک گونگے شخص کی واضح نشانی کافی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17234}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17235} تفصیلی آراء کے مطابق وصیت کرنے والے کی زندگی میں قبول یا انکار کیا جا سکتا ہے، اور شافعی کا قول مرنے کے بعد ہی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17236} ملاقات کو مشروط یا محدود مدت کے لیے معاہدے کی رو سے اجازت ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17237} اس عنوان کے اگلے حصے میں عمل کرنے والے کے فرائض کی مکمل تفصیل درج کی گئی ہے۔ وصیت کرنے والے کے فرائض پر: جہاں تقرری غیر محدود ہو، وہ نابالغ کی رقم کو اپنے پاس رکھے اور بڑھائے، اس پر معقول طریقے سے خرچ کرے اور اس پر واجب الادا رقم ادا کرے، اور اس کے اختیار کی پیمائش وصیت کرنے والے کے ذریعہ کی جاتی ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17237} احناف کے نزدیک میت کی تیاری اور کفن خریدنا، بچوں کی ضروریات پوری کرنا، امانتیں واپس کرنا اور قرض ادا کرنا، غصب شدہ مال واپس کرنا، جو نقصان ہو اس کو بیچنا، نامی وصیت کرنا اور پورا کرنا۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17238} مالکی اس کو اجازت دیتے ہیں کہ وہ قرض وصول کرے یا اس کو وارڈ کے مفاد میں موخر کرے، بچے پر معقول خرچ کرے، فطرانہ ادا کرے، اور رقم مضاربہ یا سرمایہ کے طور پر دے دے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17238} شافعی چار فرائض کا نام رکھتے ہیں: اصل کو برقرار رکھنا، پیداوار میں اضافہ، معقول خرچ کرنا، اور رقم پر واجبات ادا کرنا۔ چار شرائط کے تحت وارڈ کے پیسے کی تجارت کی سفارش کی جاتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17238}{cite:fiqh-Mawsua-kuwaityya-noor-v3 p.17240} خدا کے واجبات میں فطرانہ اور دسواں حصہ شامل ہے۔ ابوحنیفہ نے جائیداد کی زکوٰۃ چھوڑ دی سوائے عقل مند بالغ کے۔ لوگوں کے واجبات میں وہ قرض شامل ہیں، جو ثابت ہونے اور مطالبہ کرنے پر عملدرآمد کرنے والے کو ادا کرنا ہوگا، اور ہرجانے، جو رقم سے ادا کیے جاتے ہیں یا، غلطی سے قتل کے لیے، رشتہ داروں کی طرف سے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17240}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17241} حنبلی اپنے فرائض کو بطور قرض ادا کرنا، وصیت کرنا، غیر ذمہ دار افراد کی دیکھ بھال کرنا، مال جمع کرانا اور مال جمع کرانا شامل ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 ص17241} نابالغ کے لیے فطرانہ پر مالکیہ، شافعیہ، حنبلی، ابو حنیفہ اور ابو یوسف اس کو نابالغ کی رقم سے واجب قرار دیتے ہیں، جب کہ محمد اور زفر نے وصال کو ادا کرنے کی اجازت نہیں دی۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17241}{cite:fiqh-mawsua-kuwaityya-noor-v3 p.17242} نابالغ کی قربانی پر ابو حنیفہ اور ابو یوسف اس کے لیے ایک باصلاحیت وصی کا تقاضہ کرتے ہیں، حنین مالکیہ اس کی اجازت دیتے ہیں اور ظوفی کا مطلب ہے، اور حنین نے اس کی سفارش کی ہے، اور امام شافعی اس کی سفارش کرتے ہیں۔ اسے نابالغ کے پیسے سے منع کرو۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17242}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17243} تصرف: جائیداد صرف ضرورت یا واضح فائدے کے لیے فروخت کی جاتی ہے، منقولہ کسی بیرونی کو بازار کی قیمت پر فروخت کیا جا سکتا ہے۔ اکثریت کی طرف سے خود سوزی حرام ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17243} وارڈ کے پیسوں سے تجارت کی تین صورتیں ہوتی ہیں: اپنے لیے تجارت، وارڈ کے لیے تجارت، اور مضاربہ کے حوالے۔ حنفیہ اور مالکی خود تجارت کو حرام قرار دیتے ہیں، اور ابو حنیفہ اور محمد وصال کو سرمائے کی ضمانت دیتے ہیں اور نفع کو خیرات میں دیتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17243}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17244} احناف، شافعیہ اور حنبلی مکتب میں وارڈ کے لیے تجارت کی اجازت ہے، اور حنبہ اور مالکی مسلک کے نزدیک حرام ہے۔ وارڈ کے پیسوں سے مضاربہ حلال ہے، اکثر نے تجویز کیا ہے، شافعی کے نزدیک واجب ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17244}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17245} وارڈ میں کام کرنا دوسروں کے لیے حلال ہے، اور خود وارڈ کی خدمات حاصل کرنے والے کے ساتھ بلوغت کے بعد تفصیلی سلوک کیا جاتا ہے۔ وارڈ کی زمین کو طویل مدت کے لیے لیز پر دینا حنفی کے نزدیک درست نہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17245}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17246} بلوغت سے پہلے کئے گئے معاہدوں پر بحث کی گئی ہے: احناف نے وارڈ کو اس کی جائیداد پر کوئی چیز تحلیل نہیں کرنی ہے۔ دوسرے اسکول اس بات سے فرق کرتے ہیں جو عمل کرنے والے کو عمر کے بارے میں معلوم تھا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17246}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17247} چار مکاتب نے وارڈ کے پیسوں سے کسی بھی تحفہ، خیرات یا وصیت کو خالص نقصان کے طور پر منع کیا ہے۔ اسے واپسی کے لیے فروخت کرنے کے تین خیالات ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17247}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17248} پیشگی دعویٰ پر: جہاں یہ وارڈ کی مدد کرتا ہے، حنفیہ، مالکیہ، شافعیہ اور حنبلی، شافعی اور ذوالحجہ اس کی اجازت دیتے ہیں، واجب؛ جہاں اسے چھوڑنا اس کی مدد کرتا ہے، اسے چھوڑ دیا جا سکتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17249}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17250} جہاں لینا اور چھوڑنا یکساں طور پر اچھا ہے وہاں شافعیوں کے نزدیک تین قول ہیں: حرام، واجب یا اختیاری۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17250}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17251} احناف، مالکیوں اور حنبلیوں کے نزدیک اپنے لیے وارڈ سے قرض لینا حرام ہے۔ اپنی رقم دوسروں کو قرض دینے کی اجازت صرف ضرورت یا ضرورت میں ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17251}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17252} احناف، مالکیہ اور شافعی مکتب اور حنفیہ کے نزدیک وارڈ کا مال گروی رکھنا حرام ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17252}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17253} اخراجات کے تنازعہ پر چار مکاتب کے ذریعہ عام اخراجات میں حلف لینے والے کا حلف لیا جاتا ہے۔ احناف نے بارہ امور کی فہرست دی ہے جہاں ان کا کلام بغیر ثبوت کے کھڑا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17253}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17254} اخراجات کی مدت یا وصیت کرنے والے کی تاریخ وفات کے تنازعہ پر وارد کے لفظ کو محمدی، مالکیہ، یُوَفَی، اور حنبلی نے قبول کیا ہے۔ ایگزیکیوٹر کا {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 ص17254} بلوغت کے بعد رقم واپس کرنے کے بارے میں تین قول ہیں: وارد کا لفظ ⁦(مالکی ترجیحی نظر میں، شافعی)⁩، حلف کرنے والے کی قسم ⁦(حنفیہ)⁩ اور حنبلی جو رضاعی یا ادا کرنے والے میں فرق کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17254}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17255} پھانسی دینے والے کی فیس: اگر باپ یا جج مقرر کرے تو امیر اور غریب دونوں لے سکتے ہیں۔ ایک مقررہ فیس کے بغیر ایک امیر عملدار کچھ نہیں لیتا۔ غریب اسے حنفی ترجیح، مالکی، شافعی اور حنبلی مسلک میں حد کے اندر لے سکتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17255}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17256} جب حنفیہ، مالکیہ اور حنبلی کی رپورٹ میں کسی کا نام نہ لیا گیا ہو، اور شافعی اور مکتب حنبلی نے اس کی تردید کی ہو تو اس کے علاوہ کسی کو مقرر کرنا۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17256} مرنے والے پر قرض کا اقرار حنفیہ اور حنبلیوں کے نزدیک باطل ہے، بشرطیکہ اقرار کرنے والا وارث نہ ہو۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17256}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17257} احناف کے نزدیک نابالغ وارث کے لیے دو قاتلوں کی گواہی باطل ہے۔ ایک بالغ وارث کے لیے یہ اسٹیٹ میں قبول نہیں کیا جاتا ہے، اور اس کے باہر قبول کیا جاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17257}{cite:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17257} عنوان صفحہ 17257 سے آگے جاری ہے۔ باقی حصہ بعد کے بیچ میں پڑھنا ہے۔ کسی کے ذمہ دار کی گواہی کو حنفیہ، مالکیہ، شافعی اور حنبلی ترجیحی نظریہ میں، ایک مفاد پرست فریق کے طور پر مسترد کرتے ہیں۔ ایک شافعی دوسرے کے لیے ایسے معاملات میں گواہی دے سکتا ہے جہاں وہ ایک نامی امانت رکھتا ہو۔ {حوالہ: فقہ الموسوعۃ النور-v3 ص17258} وارڈ کے خلاف اس کی گواہی کو مالکیہ، شافعیہ اور حنبلی نے ترجیحی نظریہ میں قبول کیا ہے، اور حنفیہ اور حنبلی روایت نے اس کا انکار کیا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص17258} ایجنٹ مقرر کرنے پر حنفیہ، بعض شافعی اور حنبلی طریقہ اسے اجازت دیتے ہیں کہ وہ کسی بھی کام کے لیے ایجنٹ مقرر کرے۔ مالکیہ، شافعی کا معیار اور مکتب حنبلی اس سے منع کرتے ہیں جہاں رواج ہے کہ وہ خود عمل کرتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17258} وارڈ کی طرف سے ایک عملد کا اقرار چار اسکولوں میں درست نہیں ہے، کیونکہ یہ دوسرے کو پابند کرتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17259} وارڈ کی رقم جمع کرنا: احناف، مالکیہ اور حنبلی اس کی اجازت دیتے ہیں جہاں اس سے بچے کو فائدہ ہو۔ شافعی صرف چوری، آگ، ڈوبنے یا سفر کے خوف سے کسی قابل اعتماد شخص کے پاس جمع یا قرض دیتے ہیں، اور کسی قابل اعتماد سالوینٹ قرض دار کو قرض دینے کو ترجیح دیتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17259}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17260} وارڈ کی رقم بطور استعمال قرضہ دینا اکثر فقہاء نے بطور تحفہ حرام قرار دیا ہے۔ بعض احناف صوابدید کے ساتھ اس کی اجازت دیتے ہیں، کیونکہ یہ تجارت سے آتا ہے۔ فقہ الموسوعۃ کویتیہ نور ص 17260 ص 17260 پر عمل کرنے والے کے پیسے کو وارڈ والوں کے ساتھ ملانا: احناف اس کی اجازت دیتے ہیں جب یہ زیادہ مفید ہو، مالکی آسانی کے لیے، حنبلی اگر آسان ہو، اور شافعی صرف کھانا پکانے کے لیے ضروری ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17260}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17261} ورثاء یا وارث کی طرف سے وصال کی تقسیم: احناف اسے اجازت دیتے ہیں کہ وہ تیسرے کی طرف سے تقسیم نہ کرے۔ مالکی غیر حاضر جماعت کے لیے بغیر جج کے تقسیم کرنے سے منع کرتے ہیں۔ شافعی اسے اپنے طور پر مشترکہ حصہ تقسیم کرنے سے منع کرتے ہیں۔ حنبلی اس کی اجازت دیتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.17261}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17263} عمل کرنے والے کی ذمہ داری: ایک ایسا اقدام جو واضح طور پر وارڈ کی خدمت کرتا ہو درست ہے۔ جو اس کی خدمت نہیں کرتا اسے ذمہ دار بناتا ہے۔ اس کا ہاتھ ایک امانت دار کا ہے، جو صرف زیادتی یا غفلت کا ذمہ دار ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17263} برطرفی: وصیت کرنے والے کی زندگی کے دوران وصیت کرنے والا اپنے آپ کو برطرف کر سکتا ہے، اور اسے وصیت کرنے والے کی شرط سے محروم کر دیا جاتا ہے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص17263}"
