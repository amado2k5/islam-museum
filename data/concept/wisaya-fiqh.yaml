label:
  ar: "وِصاية"
  en: "Wisaya (executorship)"
summary:
  ar: "الوصاية في اللغة الأمر بالتصرف بعد الموت، ويقال أوصى له بشيء وأوصى إليه جعله وصيّه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17216} والوصاية في الاصطلاح هي الأمر بالتصرف بعد الموت، وتفارق الوصيةَ، وهي تمليك مضاف لما بعد الموت بطريق التبرع، ويفارق الوكالةَ أنها بعد الموت والوكالة في الحياة، والولاية أعمّ منها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17216}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17217} وحكمها للموصي: تجب إذا كانت لرد المظالم والديون المجهولة، أو للأولاد الصغار إذا خِيف ضياعهم، وتستحب لقضاء دين معلوم وإنفاذ الوصايا والنظر في أمر الصغار الذين لا يُخشى عليهم الضياع. وللموصى إليه القبول إذا قدر ووثق من نفسه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17217} والأوصياء نوعان: وصي القاضي يعينه القاضي للإشراف على شؤون القاصر المالية، ووصي الميت يختاره الأب أو الجد أو من له حق الولاية من قبلهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17217} ونص الحنفية على فروق بين النوعين، منها أن وصي الميت يجوز له البيع من نفسه إذا فيه نفع ظاهر عند أبي حنيفة، ووصي القاضي لا يملك ذلك، وأن القاضي يملك عزل وصي القاضي دون وصي الميت العدل الكافي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17218} وذكر الحنفية مواضع ينصب فيها القاضي وصياً، منها ما إذا كان على الميت دين أو له، أو لتنفيذ وصيته، أو إذا كان له ولد صغير، أو إذا كان في الورثة صغير أو غائب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17218}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17219} إذا عجز الوصي عن القيام بمهامه ضم القاضي إليه غيره عند الحنفية والحنابلة والشافعية إذا كان وصي الأب أو الجد، وإن ظهرت منه خيانة أو فسق عُزل عند الحنفية والمالكية والشافعية والحنابلة وأقيم مكانه غيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17219}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17220} والوصي إما متطوع وهي أمانة محضة، وإما مستجعَل: فإن كان بعقد فهي إجارة لازمة يُستأجر عليه من ماله عند العجز، وإن كان بغير عقد فهي جعالة، معينة أو غير معينة، وتفصّل أجرتها بقدر العمل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17220} أركان الوصاية أربعة: الوصي، والموصي، والموصى به، والصيغة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17221} أما الوصي فيشترط فيه العقل والإسلام إن كان الموصى عليه مسلماً والقدرة على التصرف، ومختلف في الوصاية إلى الصبي والمرأة والأعمى والفاسق والعبد والكافر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17221} فلا تصح الوصاية إلى غير المميز بالاتفاق، وإلى المميز عند الحنفية والمالكية والشافعية والحنابلة على الصحيح، وعند القاضي من الحنابلة تصح إذا جاوز العشر. وذهب أكثر أهل العلم إلى صحتها للمرأة، ونُقل أن عمر أوصى إلى حفصة، وصحّ عند عامتهم للأعمى، وخالف الشافعية في مقابل الأصح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17222}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17223} وفي اشتراط العدالة في الوصي قولان: الحنفية والمالكية وأحمد في رواية لا يشترطونها، والشافعية وأحمد في رواية يشترطونها. وفي الوصاية إلى العبد قولان: الشافعية وأبو يوسف ومحمد لا تصح، والمالكية والحنابلة تصح، وأبو حنيفة يجيزها لعبد الموصي إذا لم يكن في الورثة رشيد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17223}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17224} واتفق الفقهاء على منع الوصاية للكافر على المسلم، واختلفوا في الكافر على الكافر على ثلاثة أقوال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17224} واختلفوا في وقت اعتبار شروط الوصي على أربعة أقوال: عند موت الموصي، أو عند الإيصاء، أو عندهما معاً، أو فيهما وفيما بينهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17224}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17225} وتصح الوصاية إلى اثنين فأكثر، ولكل منهما ما خُصّ به؛ وإذا أطلق الموصي الوصاية لهما ولم يحدد فالجمهور على أن لا ينفرد أحدهما بالتصرف، واستثنى الحنفية أمورا منها تجهيز الميت وطعام الصغار وكسوتهم، وقبول الهبات، وبيع ما يخشى تلفه، وجمع الأموال الضائعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17225}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17227} وإذا مات أحد الوصيين أو فسق أو جنّ أقام القاضي مكانه آخر عند الحنفية والشافعية والحنابلة، ورأى المالكية أن يقضي القاضي بالأصلح من استقلال الباقي أو ضم غيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17228} واختلف الفقهاء في اقتسام المال بين الوصيين عند اختلافهما في حفظه: فالمالكية والحنابلة يمنعونه لأن الموصي لم يأمن أحدهما على الحفظ، والحنفية يجيزون القسمة إن قبلها المال، وإلا تهايآ أو أودعاه عند أمين، والشافعية أن أمين الحفظ لا ينفرد أحدهما بحال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17229}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17230} ويرتب الفقهاء الوصي في الولاية على القاصر: عند الحنفية الأب ثم وصيه ثم وصي وصيه، ثم أبو الأب، ثم القاضي، وعند المالكية والحنابلة الأب ثم وصيه ثم القاضي، ويرى المالكية للأم شروطا لتوصي، والشافعية لا يجوزون للأب نصب وصي إذا كان الجد حاضراً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17230}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17231} الركن الثاني الموصي، ويشترط فيه التكليف وهو العقل والبلوغ، فلا تصح من مجنون ولا من غير مميز، وفي المميز خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17231}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17232} ويشترط في الموصي الحرية عند الجمهور، وخالف الحنابلة في غير المال، والرشد عند المالكية والحنابلة دون الحنفية والشافعية، والعدالة عند الشافعية دون الحنفية والحنابلة، والولاية على من يوصى عليه، والإسلام في الوصاية على الأولاد المسلمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17232}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17234} الركن الثالث الموصى به: ويشترط أن يكون تصرفاً معلوماً يملك الموصي فعله، مثل قضاء الدين والنظر في أمر الصغير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17234} الركن الرابع الصيغة: ولا بد من الإيجاب والقبول، ويصح الإيجاب بكل لفظ يدل على تفويض الأمر، وجمهور الفقهاء يصححون التعبير بلفظي الوكالة والولاية، والأخرس تكفي إشارته المفهِمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17235} ويصح قبول الوصاية وردها في حياة الموصي عند جمهور الفقهاء بتفصيل، وعند الشافعية في الأصح لا يصح قبولها أو ردها إلا بعد الوفاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17236} والتعليق والتأقيت في صيغة الوصاية جائزان بالاتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17237} ومن واجبات الوصي حفظ أموال اليتامى وتثميرها والنفقة عليهم بالمعروف وإخراج ما تعلق بها من حقوق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17237}"
  en: "In the lexicon wisaya means to commission someone to act after one's death; one can say he bequeathed something to him, or made him his executor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17216} Technically it is the commission to act after death. It differs from the bequest, which is a gift attached to the time after death made by way of a voluntary act; and from agency, which operates in life, while wisaya is after death; authority is the broader term. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17216}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17217} Its ruling for the testator: it is obligatory when it is for returning wrongful takings and unknown debts, or for young children when their loss is feared; it is recommended for paying a known debt, carrying out bequests and caring for children not at risk of loss. The appointee may accept if he is able and trusts himself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17217} There are two kinds of executor: the judge's executor, appointed by the judge to look after a minor's money, and the testator's executor, chosen by the father, grandfather or one holding their right. The Hanafis list differences between them; for example, the testator's executor may, on Abu Hanifa's view, sell to himself where there is clear benefit, which the judge's executor may not do. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17218} The judge appoints an executor in several cases named by the Hanafis, including a debt owed to or by the deceased, carrying out a will, a minor child, and a minor or absent heir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17218}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17219} If an executor cannot carry out his duties, the Hanafis, Hanbalis and Shafi'is let the judge add another to help him where the executor was appointed by the father or grandfather; if he proves dishonest or dissolute, he is removed in the view of the four schools, and the judge appoints another. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17219}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17220} An executor is either a volunteer, which is a pure trust, or paid: by contract, a binding hire that can be paid from the estate, or without contract, a reward whose amount is set by the work done. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17220} Wisaya has four pillars: the executor, the testator, the thing entrusted and the formula. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17221} The executor must be sane, a Muslim where the ward is Muslim, and able to act; the disputed cases are a minor, a woman, a blind man, a dishonest person, a slave and an unbeliever. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17221}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17224} Under the executor's rank for a minor's guardianship, the Hanafis put the father, then his executor, then the grandfather, and so on; the Malikis and Hanbalis put the father, his executor, then the judge; the Shafi'is do not allow a father to appoint an executor while the grandfather is present. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17230}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17231} The testator must be sane and of age, free according to the majority, and in the view of the Malikis and Hanbalis of sound judgement; the Shafi'is require him to be just, and he must hold authority over the ward. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17231}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17234} The thing entrusted must be a known act the testator may do, such as paying debts or looking after a child. The formula requires offer and acceptance; a dumb person's clear sign suffices. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17234}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17235} Acceptance or refusal may be made in the testator's lifetime according to the detailed views, and the Shafi'is in the preferred view only after death. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17236} Making the appointment conditional or time-limited is permitted by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17237} A full account of the executor's duties follows in the next part of this headword."
