label:
  ar: "بيع التعاطي"
  en: "Bay' al-ta'ati (sale by conduct)"
  fr: "Bay' al-ta'ati (vente par comportement)"
  ur: "بیعِ تعاطی ⁦(عملی لین دین سے بیع)⁩"
  es: "Bay' al-ta'ati (venta por conducta)"
  tr: "Tüketim Satışı"
  id: "Penjualan Konsumsi"
term: { ar: "بَيْع التَّعاطي", en: "bay' al-ta'ati" }
summary:
  ar: "بيع التعاطي أن يضع المشتري الثمن ويأخذ المبيع عن تراضٍ منهما من غير لفظ. يذكر ابن عابدين في رد المحتار أنه ينعقد في الخسيس والنفيس على الصحيح خلافاً للكرخي، ويعرض الخلاف في اشتراط الإعطاء من الجانبين، وأنه لا ينعقد إذا صرّح أحدهما بعدم الرضا، ولا بعد عقد فاسد قبل متاركته. {cite:radd-al-muhtar-bulaq-v4 p.18} {cite:radd-al-muhtar-bulaq-v4 p.19}"
  en: "Bay' al-ta'ati is sale in which the buyer puts down the price and takes the goods by mutual consent without words. Ibn Abidin in Radd al-Muhtar reports that by the sound view it is concluded for cheap and costly goods alike, against al-Karkhi, sets out the dispute over whether giving from both sides is required, and says it is not concluded if one party states that he does not consent, nor after a defective contract before that contract is abandoned."
  fr: "Vente où l’acheteur dépose le prix et prend le bien d’un commun consentement, sans paroles. Dans le Radd al-Muhtar, Ibn Abidin rapporte que l’avis solide l’admet pour les biens bon marché comme coûteux, contrairement à al-Karkhi. Il expose le débat sur la remise par les deux parties et exclut sa conclusion en cas de refus explicite de consentement, ou après un contrat défectueux non abandonné."
  ur: "بیعِ تعاطی یہ ہے کہ خریدار باہمی رضا سے بغیر الفاظ کے قیمت رکھ دے اور چیز لے لے۔ ابن عابدین رد المحتار میں بتاتے ہیں کہ صحیح قول کے مطابق یہ سستی اور قیمتی دونوں چیزوں میں منعقد ہوتی ہے، کرخی کے برخلاف؛ دونوں طرف سے دینے کی شرط میں اختلاف بیان کرتے ہیں؛ اور کہتے ہیں کہ اگر کوئی فریق صراحتاً عدمِ رضا ظاہر کرے، یا فاسد عقد کے بعد اسے ترک کرنے سے پہلے ہو، تو منعقد نہیں ہوتی۔"
  es: "Bay' al-ta'ati es una venta en la que el comprador fija el precio y adquiere la mercancía por mutuo acuerdo, sin necesidad de palabras. Ibn Abidin, en Radd al-Muhtar, informa que, según la opinión generalizada, se considera válida tanto para bienes baratos como caros. En contra de al-Karkhi, se plantea la controversia sobre si se requiere el consentimiento de ambas partes y se afirma que no se considera válida si una de las partes declara su falta de consentimiento, ni después de un contrato defectuoso antes de que este sea abandonado."
  tr: "İşlemin satışı, alıcının fiyatı belirleyip satılan eşyayı karşılıklı rızaları olmadan, tek kelime etmeden almasıdır. İbn Abidin, Radd al-Muhtar'da, doğru görüşe göre alçak ve değerli olan için el-Karkhi'ye aykırı olarak sonuçlandığını belirtir ve her iki tarafın verme şartı konusunda anlaşmazlığı ortaya koyar; ayrıca biri açıkça rıza belirtmediği sürece ya da ayrılık öncesi geçersiz bir sözleşme sonrası sonuçlanmaz. {cite:radd-al-muhtar-bulaq-v4 s.18} {cite:radd-al-muhtar-bulaq-v4 s.19}"
  id: "Penjualan transaksi adalah ketika pembeli menetapkan harga dan mengambil barang yang dijual tanpa persetujuan bersama, tanpa sepatah kata pun. Ibn Abidin menyebutkan dalam Radd al-Muhtar bahwa keputusan disepakati dalam kasus yang tercela dan berharga, menurut pandangan yang benar, bertentangan dengan al-Karkhi, dan ia mengajukan ketidaksepakatan mengenai syarat pemberian dari kedua belah pihak, dan bahwa tidak diputuskan jika salah satu secara eksplisit menyatakan tidak ada persetujuan, maupun setelah kontrak batal sebelum pemisahan. {cite:radd-al-muhtar-bulaq-v4 hlm.18} {cite:radd-al-muhtar-bulaq-v4 hlm.19}"
