id: concept/bay-al-taati
class: concept
kind: legal
label:
  ar: "بيع التعاطي"
  en: "Bay' al-ta'ati (sale by conduct)"
  ur: "بیعِ تعاطی ⁦(عملی لین دین سے بیع)⁩"
term: { ar: "بَيْع التَّعاطي", en: "bay' al-ta'ati" }
summary:
  ar: "بيع التعاطي أن يضع المشتري الثمن ويأخذ المبيع عن تراضٍ منهما من غير لفظ. يذكر ابن عابدين في رد المحتار أنه ينعقد في الخسيس والنفيس على الصحيح خلافاً للكرخي، ويعرض الخلاف في اشتراط الإعطاء من الجانبين، وأنه لا ينعقد إذا صرّح أحدهما بعدم الرضا، ولا بعد عقد فاسد قبل متاركته. {cite:radd-al-muhtar-bulaq-v4 p.18} {cite:radd-al-muhtar-bulaq-v4 p.19}"
  en: "Bay' al-ta'ati is sale in which the buyer puts down the price and takes the goods by mutual consent without words. Ibn Abidin in Radd al-Muhtar reports that by the sound view it is concluded for cheap and costly goods alike, against al-Karkhi, sets out the dispute over whether giving from both sides is required, and says it is not concluded if one party states that he does not consent, nor after a defective contract before that contract is abandoned."
  ur: "بیعِ تعاطی یہ ہے کہ خریدار باہمی رضا سے بغیر الفاظ کے قیمت رکھ دے اور چیز لے لے۔ ابن عابدین رد المحتار میں بتاتے ہیں کہ صحیح قول کے مطابق یہ سستی اور قیمتی دونوں چیزوں میں منعقد ہوتی ہے، کرخی کے برخلاف؛ دونوں طرف سے دینے کی شرط میں اختلاف بیان کرتے ہیں؛ اور کہتے ہیں کہ اگر کوئی فریق صراحتاً عدمِ رضا ظاہر کرے، یا فاسد عقد کے بعد اسے ترک کرنے سے پہلے ہو، تو منعقد نہیں ہوتی۔"
