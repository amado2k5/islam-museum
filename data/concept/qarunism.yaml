  en: "Sheikh Omar Abdelkafy holds that Qarunism is a doctrine of life, the rich man who hoards and forgets the Giver and does not see the poor's right in his wealth, and that it recurs through history {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep06 00:08:00} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep06 00:15:00}."
  ur: "شیخ عمر عبدالکافی کے نزدیک قارونیت زندگی کا ایک مسلک ہے، جس میں مالدار دولت روکتا ہے اور دینے والے کو بھول جاتا ہے، اور یہ معاملہ تاریخ میں دہرایا جاتا ہے {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep06 00:08:00} {cite:assabile-omar-abdelkafy al-dinu-al-qayem/ep06 00:15:00}۔"
