label: { ar: "الحكم", en: "Hukm (legal ruling)", ur: "حکم" }
summary:
  ar: "الحكم لغة القضاء، وأصله المنع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7232} والحكم الشرعي عند جمهور الأصوليين خطاب الشارع المتعلق بأفعال المكلفين اقتضاء أو تخييرا أو وضعا، وعند الفقهاء أثر هذا الخطاب، أي الوجوب ونحوه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7232} وينقسم الحكم التكليفي عند الجمهور إلى خمسة أقسام: الفرض والندب والإباحة والحرمة والكراهة، وزاد الحنفية الوجوب والكراهة التحريمية؛ ويسوي الجمهور بين الفرض والواجب، ويفرق الحنفية بينهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7233} وينقسم الحكم الوضعي إلى السبب والشرط والمانع والرخصة أو العزيمة والصحة أو البطلان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7233} ويحيل المدخل إلى مدخل «تحكيم» عند العنوان «حُكمان»، وتفصيل الأقسام في مصطلحاتها وفي الملحق الأصولي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7233} "
  en: "Hukm means judgement, lexically a prevention. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7232} For the majority of usulis the legal ruling is the address of the lawgiver concerning the acts of the obliged, by demand, choice or stipulation; for the jurists it is the effect of that address, such as obligation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7232} The majority count five kinds of legal ruling (obligatory, recommended, permitted, forbidden, disliked); the Hanafis add two (wajib, and disliked-as-forbidden). The majority equate fard and wajib, the Hanafis separate them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7233} The ruling by stipulation includes cause, condition, impediment, dispensation or strictness, and validity or nullity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7233} The entry refers the reader to the separate headwords and to the usuli appendix for the details. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7233} "
  ur: "حکم لغت میں فیصلہ ہے اور اس کی اصل منع کرنا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7232} جمہور اصولیین کے نزدیک شرعی حکم شارع کا وہ خطاب ہے جو مکلفین کے افعال سے متعلق ہو، طلب، اختیار یا وضع کے طور پر؛ فقہاء کے نزدیک یہ اس خطاب کا اثر، یعنی وجوب وغیرہ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7232} جمہور کے نزدیک حکمِ تکلیفی کی پانچ قسمیں ہیں: فرض، مندوب، مباح، حرام اور مکروہ؛ حنفیہ دو مزید قسمیں (واجب اور مکروہِ تحریمی) شمار کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7233} حکمِ وضعی میں سبب، شرط، مانع، رخصت یا عزیمت، صحت یا بطلان شامل ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7233} "
