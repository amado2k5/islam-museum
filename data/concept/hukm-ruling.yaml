label: { ar: "الحكم", en: "Hukm (legal ruling)", ur: "حکم", es: "Hukm (dictamen legal)", fr: "Hukm (décision légale)", tr: "Karar", id: "Putusan" }
summary:
  ar: "الحكم لغة القضاء، وأصله المنع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7232} والحكم الشرعي عند جمهور الأصوليين خطاب الشارع المتعلق بأفعال المكلفين اقتضاء أو تخييرا أو وضعا، وعند الفقهاء أثر هذا الخطاب، أي الوجوب ونحوه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7232} وينقسم الحكم التكليفي عند الجمهور إلى خمسة أقسام: الفرض والندب والإباحة والحرمة والكراهة، وزاد الحنفية الوجوب والكراهة التحريمية؛ ويسوي الجمهور بين الفرض والواجب، ويفرق الحنفية بينهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7233} وينقسم الحكم الوضعي إلى السبب والشرط والمانع والرخصة أو العزيمة والصحة أو البطلان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7233} ويحيل المدخل إلى مدخل «تحكيم» عند العنوان «حُكمان»، وتفصيل الأقسام في مصطلحاتها وفي الملحق الأصولي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7233} ويعرّف الغزالي في تمهيد المستصفى الحكم بأنه خطاب الشرع لا وصفاً للفعل ولا حسناً ولا قبحاً، ولا مدخل للعقل فيه ولا حكم قبل ورود الشرائع، ويقرر أن لا حكم إلا لله، وأنه لا حكم للرسول ولا للسيد على العبد ولا لمخلوق على مخلوق، بل كل ذلك حكم الله ووضعه. {cite:mustasfa p.21-22} "
  en: "Hukm means judgement, lexically a prevention. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7232} For the majority of usulis the legal ruling is the address of the lawgiver concerning the acts of the obliged, by demand, choice or stipulation; for the jurists it is the effect of that address, such as obligation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7232} The majority count five kinds of legal ruling (obligatory, recommended, permitted, forbidden, disliked); the Hanafis add two (wajib, and disliked-as-forbidden). The majority equate fard and wajib, the Hanafis separate them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7233} The ruling by stipulation includes cause, condition, impediment, dispensation or strictness, and validity or nullity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7233} The entry refers the reader to the separate headwords and to the usuli appendix for the details. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7233} In the Mustasfa's introduction al-Ghazali defines the ruling as the discourse of the Law — not a description of the act, nor beauty or ugliness, with no room for reason in it and no ruling before revealed laws — and holds that there is no ruling save God's: no ruling belongs to the Messenger, a master over a slave, or any creature over another, all being God's ruling and ordinance. {cite:mustasfa p.21-22} "
  ur: "حکم لغت میں فیصلہ ہے اور اس کی اصل منع کرنا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7232} جمہور اصولیین کے نزدیک شرعی حکم شارع کا وہ خطاب ہے جو مکلفین کے افعال سے متعلق ہو، طلب، اختیار یا وضع کے طور پر؛ فقہاء کے نزدیک یہ اس خطاب کا اثر، یعنی وجوب وغیرہ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7232} جمہور کے نزدیک حکمِ تکلیفی کی پانچ قسمیں ہیں: فرض، مندوب، مباح، حرام اور مکروہ؛ حنفیہ دو مزید قسمیں ⁦(واجب اور مکروہِ تحریمی)⁩ شمار کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7233} حکمِ وضعی میں سبب، شرط، مانع، رخصت یا عزیمت، صحت یا بطلان شامل ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7233} "
  es: "Hukm significa juicio, léxicamente una prevención. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7232} Para la mayoría de los usulis, la norma legal es la intervención del legislador sobre los actos de los obligados, por demanda, elección o estipulación; para los juristas es el efecto de esa intervención, como la obligación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7232} La mayoría cuenta cinco tipos de normas legales (obligatorias, recomendadas, permitidas, prohibidas, desaconsejables); los hanafíes añaden dos (wajib y desaconsejables como prohibidos). La mayoría equipara fard y wajib, los hanafíes los separan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7233} La norma por estipulación incluye causa, condición, impedimento, dispensa o rigor, y validez o nulidad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7233} La entrada remite al lector a los encabezados separados y al apéndice usuli para obtener más detalles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7233} En la introducción del Mustasfa, al-Ghazali define la norma como el discurso de la Ley —no una descripción del acto, ni belleza o fealdad, sin lugar para la razón y sin norma anterior a las leyes reveladas— y sostiene que no hay norma sino la de Dios: ninguna norma pertenece al Mensajero, a un amo sobre un esclavo, ni a ninguna criatura sobre otra, siendo todo norma y ordenanza de Dios. {cite:mustasfa p.21-22}"
  fr: "Hukm signifie jugement, et lexicalement, prévention. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7232} Pour la majorité des usulis, la décision juridique est l'avis du législateur concernant les actes des personnes tenues d'obéir, que ce soit par exigence, choix ou stipulation; pour les juristes, il s'agit de l'effet de cet avis, tel que l'obligation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7232} La majorité distingue cinq types de décisions juridiques (obligatoire, recommandée, permise, interdite, déconseillée); les hanafites en ajoutent deux (wajib et déconseillée, assimilée à l'interdite). La majorité assimile fard et wajib, tandis que les hanafites les distinguent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7233} La décision par stipulation comprend la cause, la condition, l'empêchement, la dispense ou la rigueur, et la validité ou la nullité. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7233} L'entrée renvoie le lecteur aux entrées distinctes et à l'appendice usuli pour plus de détails. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7233} Dans l'introduction du Mustasfa, al-Ghazali définit la décision comme le discours de la Loi — non pas une description de l'acte, ni une notion de beauté ou de laideur, sans place pour la raison et sans décision antérieure aux lois révélées — et soutient qu'il n'y a de décision que celle de Dieu: aucune décision n'appartient au Messager, à un maître sur un esclave, ni à aucune créature sur une autre, car tout est décision et ordonnance de Dieu. {cite:mustasfa p.21-22}"
  tr: "Hüküm, yargı dilidir ve kökü yasaktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7232} Usul âlimlerinin çoğuna göre hukuki karar, Kanuniyetçinin hesap vericinin eylemleriyle ilgili hitabêdir; ister zorunluluk, ister tercih ya da atama nedeniyle, ve hukukçular için bu söylemin etkisi, yani yükümlülük ve benzerleriyle ilgili olsun. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7232} Çoğunluğa göre zorunlu karar beş kategoriye ayrılır: zorunluluk, tavsiye, izin verilebilirlik, yasak ve hoşlanmama. Hanefi okulu da zorunlu ve hoşlanmayan yükümlülükleri eşitler; çoğunluk zorunlu ve zorunlu hükmü eşitler ve bunlar arasında ayrım yapar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7233} Olumlu yargı neden, koşul, engel, lisans veya karar, geçerlilik veya geçersizlik olarak ikiye ayrılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7233} Giriş, \"İki Karar\" başlığı altında \"Tahkim\" girişine atıfta bulunur ve bölümleri terminolojisinde ve Usuli ekinde detaylandırır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7233} Al-Gazali, Al-Mustasfa'ya girişinde hükmetmeyi, eylemin tanımı olmadan, iyi ya da kötülük tanımlamadan, akıl için giriş yapmadan ve yasalar gelmeden önce hüküm vermeden Şeriat'ın söylemi olarak tanımlar. O, Allah'tan başka bir hüküm olmadığını, Peygamber'in ne efendisinin, ne hizmetkâr üzerindeki efendinin, ne de başka bir yaratılmış şeyin başka biri üzerinde hüküm verebileceğini savunur; aksine, tüm bunların Allah'ın hükmü ve kuruluşudur. {cite:mustasfa s.21-22}"
  id: "Putusan adalah bahasa penghakiman, dan akarnya adalah larangan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7232} Putusan hukum menurut mayoritas sarjana usul adalah alamat Pemberi Hukum yang berkaitan dengan tindakan yang bertanggung jawab, baik karena kebutuhan, pilihan, atau penunjukan, dan bagi ahli hukum, efek dari wacana ini, yaitu kewajiban dan sejenisnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7232} Putusan wajib menurut mayoritas dibagi menjadi lima kategori: kewajiban, rekomendasi, kebolehan, larangan, dan ketidaksukaan. Aliran Hanafi juga menyamakan kewajiban dan kewajiban yang tidak disukai; mayoritas menyamakan putusan wajib dan wajib, serta membedakan di antara keduanya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7233} Putusan positif dibagi menjadi sebab, kondisi, hambatan, izin atau penentuan, validitas, atau ketidakabsahan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7233} Entri tersebut merujuk pada entri \"Arbitrase\" dengan judul \"Dua Putusan,\" dan merinci bagian-bagian tersebut dalam terminologi dan lampiran Usuli. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7233} Al-Ghazali mendefinisikan pemerintahan dalam pengantar Al-Mustasfa sebagai wacana Syariah, tanpa deskripsi tindakan, tanpa kebaikan atau kejahatan, tanpa entri untuk akal, dan tanpa putusan sebelum datangnya hukum. Ia menegaskan bahwa tidak ada kekuasaan kecuali Allah, dan tidak ada kekuasaan bagi Rasulullah, maupun penguasa atas hamba, maupun untuk sesuatu yang diciptakan atas sesama; melainkan, semua ini adalah kekuasaan dan penetapan Allah. {cite:Mustasfa hlm.21-22}"
