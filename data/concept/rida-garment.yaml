id: concept/rida-garment
class: concept
kind: legal
label:
  ar: "الرِّداء"
  en: "Rida' (the upper garment, worn over the izar): its wearing in ihram and in prayer, and turning it in the rain prayer"
  ur: "چادر ⁦(رداء)⁩"
  es: "Rida' (la prenda superior, que se lleva sobre el izar): su uso en ihram y en la oración, y voltearse en la oración de la lluvia."
  fr: "Rida' (le vêtement supérieur, porté par-dessus l'izar): son port en état d'ihram et pendant la prière, et le fait de le retourner pendant la prière de la pluie"
summary:
  ar: "الرداء في اللغة الثوب الذي يستر أعلى البدن فوق الإزار، وفي اصطلاح الفقهاء ما يستر أعلى البدن من الثياب، ويقابله الإزار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8693} ويستحب للمحرم أن يلبس رداء وإزارا أبيضين جديدين أو مغسولين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8693} وفي الصلاة يفضل جمهور الفقهاء القميص مع الرداء، ويكره الاضطباع واشتمال الصماء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8694} ويستحب عند جمهور الفقهاء تحويل الرداء في دعاء الاستسقاء، وخالف أبو حنيفة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8694}"
  en: "Rida' in the lexicon is the garment that covers the upper body over the izar, which covers the lower body. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8693} It is recommended for a pilgrim in ihram to wear a rida' and an izar that are white, new or washed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8693} In prayer the majority prefer a shirt with a rida' over a single garment; the wrapping of the body in one cloth with the ends brought over the shoulder is disliked. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8694} Most jurists recommend turning the rida' over during the prayer for rain, while Abu Hanifa does not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8694}"
  ur: "رداء اوپر کا لباس ہے جو ازار کے اوپر پہنا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8693} محرم کے لیے مستحب ہے کہ وہ سفید، نئے یا دھلے ہوئے رداء اور ازار پہنے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8693}"
  es: "Rida' en el léxico es la prenda que cubre la parte superior del cuerpo sobre el izar, que cubre la parte inferior. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8693} Se recomienda que un peregrino en ihram use un rida' y un izar blancos, nuevos o lavados. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8693} En la oración, la mayoría prefiere una camisa con un rida' en lugar de una sola prenda; no se recomienda envolver el cuerpo en una sola tela con los extremos sobre el hombro. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8694} La mayoría de los juristas recomiendan voltear el rida' durante la oración para pedir lluvia, mientras que Abu Hanifa no lo recomienda. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8694}"
  fr: "Dans le lexique, le rida' désigne le vêtement qui couvre le haut du corps par-dessus l'izar, lequel couvre le bas du corps. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8693} Il est recommandé au pèlerin en état d'ihram de porter un rida' et un izar blancs, neufs ou lavés. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8693} Pendant la prière, la majorité préfère porter une chemise avec un rida' plutôt qu'un seul vêtement; il est déconseillé de s'envelopper entièrement dans un seul tissu dont les pans sont rabattus sur l'épaule. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8694} La plupart des juristes recommandent de retourner le rida' pendant la prière pour la pluie, contrairement à Abu Hanifa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8694}"
