id: concept/rida-garment
class: concept
kind: legal
label:
  ar: "الرِّداء"
  en: "Rida' (the upper garment, worn over the izar): its wearing in ihram and in prayer, and turning it in the rain prayer"
  ur: "چادر (رداء)"
summary:
  ar: "الرداء في اللغة الثوب الذي يستر أعلى البدن فوق الإزار، وفي اصطلاح الفقهاء ما يستر أعلى البدن من الثياب، ويقابله الإزار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8693} ويستحب للمحرم أن يلبس رداء وإزارا أبيضين جديدين أو مغسولين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8693} وفي الصلاة يفضل جمهور الفقهاء القميص مع الرداء، ويكره الاضطباع واشتمال الصماء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8694} ويستحب عند جمهور الفقهاء تحويل الرداء في دعاء الاستسقاء، وخالف أبو حنيفة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8694}"
  en: "Rida' in the lexicon is the garment that covers the upper body over the izar, which covers the lower body. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8693} The jurists agree that a pilgrim in ihram should wear a white or washed izar and rida'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8693} In prayer the majority prefer a shirt with a rida' over a single garment; the wrapping of the body in one cloth with the ends brought over the shoulder is disliked. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8694} Most jurists recommend turning the rida' over during the prayer for rain, while Abu Hanifa does not. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8694}"
  ur: "رداء اوپر کا لباس ہے جو ازار کے اوپر پہنا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8693} احرام میں سفید اور صاف ازار و رداء پہننا مستحب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8693}"
