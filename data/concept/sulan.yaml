summary:
  ar: "سولان في الكتاب دواء رومي معروف، حار يابس إلى الرابعة، يحرق الجلد، وينفع من اللقوة إذا سعط به بماء السلق، وينفع أورام الأجفان وتهيجها {cite:canon-ibn-sina-print-v1 p.586}."
  en: "Sulan is in the book a well-known Roman drug, hot and dry to the fourth degree, burning the skin; used in the nose with beet water it helps facial palsy, and it helps swellings of the eyelids and their irritation {cite:canon-ibn-sina-print-v1 p.586}."
  ur: "سولان کتاب میں ایک معروف رومی دوا ہے، چوتھے درجے تک گرم خشک، جلد کو جلا دیتی ہے؛ چقندر کے پانی کے ساتھ ناک میں چڑھائی جائے تو لقوہ میں مفید ہے، اور پپوٹوں کے ورم اور ان کی سوزش میں نفع دیتی ہے {cite:canon-ibn-sina-print-v1 p.586}۔"
  es: "Sulan es en el libro un conocido medicamento romano, caliente y seco hasta el cuarto grado, que quema la piel; usado en la nariz con agua de remolacha ayuda a la parálisis facial y ayuda a las hinchazones de los párpados y su irritación {cite:canon-ibn-sina-print-v1 p.586}."
  fr: "Le Sulan est décrit dans le livre comme un médicament romain bien connu, chaud et sec au quatrième degré, brûlant la peau; utilisé dans le nez avec de l'eau de betterave, il aide à soulager la paralysie faciale, et il aide à soulager les gonflements des paupières et leur irritation {cite:canon-ibn-sina-print-v1 p.586}."
  tr: "Kitapta Solan, dördüncü güne kadar sıcak ve kuru olan ünlü bir Roma ilacıdır, cildi yakar, kaynar suyla uygulandığında suyu ıslatmak için faydalıdır ve göz kapağı tümörleri ile tahrişleri için faydalıdır {cite:canon-ibn-sina-print-v1 s.586}."
  id: "Solan dalam buku ini adalah obat Romawi yang terkenal, panas dan kering hingga hari keempat, membakar kulit, bermanfaat untuk merendam air saat diaplikasikan dengan air mendidih, dan bermanfaat untuk tumor kelopak mata serta iritasinya {cite:canon-ibn-sina-print-v1 hlm.586}."
