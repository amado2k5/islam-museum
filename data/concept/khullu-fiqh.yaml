id: concept/khullu-fiqh
class: concept
kind: term
label:
  ar: الخلو
  en: Khullu (tenant's right over waqf and state land)
  ur: خلو
summary:
  ar: 'الخلو لغة الفراغ، ويطلق في كتب المتأخرين على المنفعة التي يملكها المستأجر لعقار الوقف مقابل مال يدفعه إلى الناظر لتعمير الوقف، على أن يكون له جزء معلوم من منفعته، ويؤدي الأجرة لحظ المستحقين عن الباقي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7800} ويطلق أيضا على حق مستأجر الأرض الأميرية في التمسك بها إن كان له فيها أثر من غراس أو بناء أو كبس تراب، ويطلق على البدل النقدي المأخوذ مقابل التخلي عنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7800}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7801} الألفاظ ذات الصلة: الحكر (الأجرة المقررة على عقار الوقف لمن له فيه بناء أو غراس)، والفراغ والإفراغ (التنازل عن الحق بعوض)، والجدك (أعيان مملوكة للمستأجر متصلة بالحانوت أو غير متصلة)، والكردار (ما يحدثه المزارع من بناء أو غراس بإذن)، والمرصد (دين مستقر على الوقف بعمارة المستأجر)، ومشد المسكة (استحقاق زراعة أرض الغير عند الحنفية المتأخرين). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7801}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7802}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7802} حقيقة ملك الخلو: ملك المنفعة لا ملك الانتفاع، فصاحبه يؤجر ويهب ويعير كما يريد، ومن أدلة الفرق عند المالكية أن مالك الانتفاع يقصد الذات بوصفها، بخلاف مالك المنفعة، ويورث الخلو. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7803} أحوال نشوء الخلو في عقارات الوقف: باتفاق الواقف أو الناظر مع المستأجر، ومن صوره عند المالكية أن يكون الوقف آيلا للخراب فيؤجره الناظر لمن يعمره فتصير المنفعة مشتركة، وما قابل الدراهم المصروفة في التعمير هو الخلو، بشرط ألا يوجد ريع يعمر به؛ وصورة المسجد الذي له حوانيت وريعها لا يكفي للعمارة؛ وصورة الأرض الموقوفة المعطلة يستأجرها من الناظر ويبني فيها؛ وصورة المحلات التي تباع منافعها قبل التحبيس؛ وعلى الصورة الثالثة قول الشيخ عليش بالعمل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7803}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7804}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7804}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7805}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7805}'
  en: 'Khullu is lexically emptiness; in later books it names the usufruct a tenant owns over a waqf property in return for paying the administrator funds to repair it, with a fixed share of its use and the rent paid for the rest for the beneficiaries. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7800} It also names the right of a tenant of state land to keep it if he has built, planted or filled it, and the cash paid for giving up that right. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7800}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7801} Related terms: hukr (the rent on waqf land for one who built or planted), farigh and ifrigh (giving up a right for a price), jadak (movable goods of a tenant attached to a shop or not), kirdar (what a farmer builds or plants with leave), murassad (a debt fixed on the waqf by the tenant\''s repair), and mashd al-maska (the right to farm another\''s land in later Hanafi usage). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7801}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7802}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7802} The nature of khullu: it is ownership of the usufruct, not of use, so its holder may let, give or lend as he likes; the Malikis distinguish that the owner of use uses the thing by its quality, whereas the owner of usufruct may transfer; khullu passes by inheritance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7803} Ways khullu arises on waqf property: by agreement of founder or administrator with the tenant; the Maliki cases include a crumbling waqf let to someone who repairs it, the mosque with shops whose rent cannot repair it, a barren waqf land on which the tenant builds, and shops whose use is sold before the endowment; Shaykh Ulaysh held that the third case is practised. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7803}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7804}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7804}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7805}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7805}'
  ur: 'خلو لغت میں خالی ہونا ہے؛ بعد کی کتابوں میں یہ اس منفعت کو کہتے ہیں جو وقف عقار کے کرایہ دار کو اس رقم کے عوض ملتی ہے جو وہ ناظر کو وقف کی مرمت کے لیے دیتا ہے، اس شرط پر کہ اسے منفعت کا معین حصہ ملے اور باقی کا کرایہ مستحقین کے حق میں دے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7800} یہ سرکاری زمین کے کرایہ دار کے اس حق پر بھی بولا جاتا ہے کہ وہ درخت، عمارت یا مٹی ڈالنے کے بعد اسے رکھ سکے، اور اس نقدی پر بھی جو اس حق کو چھوڑنے کے بدلے لی جائے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7800}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7801} ملتے جلتے الفاظ: حکر (وقف زمین پر وہ کرایہ جو عمارت یا درخت لگانے والے سے لیا جائے)، فراغ اور افراغ (حق عوض پر چھوڑنا)، جدک (دکان سے متصل یا غیر متصل کرایہ دار کا ملکیتی سامان)، کردار (کاشتکار کی بنائی یا لگائی ہوئی چیز اجازت سے)، مرصد (مرمت کرنے والے کرایہ دار کا وقف پر ٹھہرا دین)، اور مشد المسکہ (دوسرے کی زمین کاشت کرنے کا حق متأخر حنفیہ کے نزدیک)۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7801}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7802}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7802} خلو کی حقیقت: منفعت کی ملکیت ہے، انتفاع کی نہیں؛ اس کا مالک کرایہ پر دے سکتا ہے، ہبہ کر سکتا ہے اور عاریت دے سکتا ہے؛ مالکیہ کے نزدیک منفعت کا مالک چیز کو وصف سے مقصود رکھتا ہے، اور خلو وراثت میں منتقل ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7803} وقف پر خلو کے پیدا ہونے کی صورتیں: واقف یا ناظر اور کرایہ دار کے معاہدے سے؛ مالکیہ کے نمونے: ٹوٹ پھوٹ کا شکار وقف کو مرمت کرنے والے کو دینا، مسجد کی دکانیں جن کا کرایہ مرمت کے لیے کافی نہ ہو، معطل وقف زمین جس پر کرایہ دار عمارت بنائے، اور وقف سے پہلے منافع فروخت ہونے والی دکانیں؛ شیخ علیش کے نزدیک تیسری صورت پر عمل ہوتا رہا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7803}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7804}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7804}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7805}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7805}'
