id: concept/khullu-fiqh
class: concept
kind: term
label:
  ar: الخلو
  en: Khullu (tenant's right over waqf and state land)
  ur: خلو
summary:
  ar: 'الخلو لغة الفراغ، ويطلق في كتب المتأخرين على المنفعة التي يملكها المستأجر لعقار الوقف مقابل مال يدفعه إلى الناظر لتعمير الوقف، على أن يكون له جزء معلوم من منفعته، ويؤدي الأجرة لحظ المستحقين عن الباقي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7800} ويطلق أيضا على حق مستأجر الأرض الأميرية في التمسك بها إن كان له فيها أثر من غراس أو بناء أو كبس تراب، ويطلق على البدل النقدي المأخوذ مقابل التخلي عنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7800}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7801} الألفاظ ذات الصلة: الحكر (الأجرة المقررة على عقار الوقف لمن له فيه بناء أو غراس)، والفراغ والإفراغ (التنازل عن الحق بعوض)، والجدك (أعيان مملوكة للمستأجر متصلة بالحانوت أو غير متصلة)، والكردار (ما يحدثه المزارع من بناء أو غراس بإذن)، والمرصد (دين مستقر على الوقف بعمارة المستأجر)، ومشد المسكة (استحقاق زراعة أرض الغير عند الحنفية المتأخرين). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7801}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7802}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7802} حقيقة ملك الخلو: ملك المنفعة لا ملك الانتفاع، فصاحبه يؤجر ويهب ويعير كما يريد، ومن أدلة الفرق عند المالكية أن مالك الانتفاع يقصد الذات بوصفها، بخلاف مالك المنفعة، ويورث الخلو. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7803} أحوال نشوء الخلو في عقارات الوقف: باتفاق الواقف أو الناظر مع المستأجر، ومن صوره عند المالكية أن يكون الوقف آيلا للخراب فيؤجره الناظر لمن يعمره فتصير المنفعة مشتركة، وما قابل الدراهم المصروفة في التعمير هو الخلو، بشرط ألا يوجد ريع يعمر به؛ وصورة المسجد الذي له حوانيت وريعها لا يكفي للعمارة؛ وصورة الأرض الموقوفة المعطلة يستأجرها من الناظر ويبني فيها؛ وصورة المحلات التي تباع منافعها قبل التحبيس؛ وعلى الصورة الثالثة قول الشيخ عليش بالعمل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7803}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7804}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7804}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7805}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7805} بيع المنفعة مفردة: يجوز عند الحنابلة بيع بعض الوقف لإصلاح باقيه إذا تعذرت إجارته، ويتحد الواقف والجهة، والبهوتي لا يرى إنشاء الخلو بالمال مطلقا؛ ولا يصير من تلقى العقار عن مستأجر قبله بمال مالكا للخلو، وابن عابدين يرد ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7806} الحنفية: الخلو من بيع الحقوق المجردة، وفي جوازه قولان مبنيان على اعتبار العرف الخاص، والمذهب عدم الجواز عند الشهيد وغيره، وقد أفتى كثيرون باعتبار العرف فجاز النزول عن الوظائف بمال ولزم الخلو، ومال الحموي إلى عدم إثبات الخلو؛ وأفتى العمادي بلزومه للضرورة قياسا على بيع الوفاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7806}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7807}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7807} المالكية: فتوى الناصر اللقاني بالتملك والإرث والتقدم في بيع الخلو، وجرى عليها العمل، وقال الحموي إنها لا نص فيها عند مالك؛ وقال الغرقاوي إنها مخرجة على النصوص؛ وفي الاستمرار: العرف عند المالكية كالشرط فيستمر الحكر للأبد إن جرى العرف به، والدسوقي والبناني يجعلان المصلحة مستندا لإثبات الاستمرار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7807}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7808}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7808}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7809} مقدار الحكر: أجرة المثل، والحنفية يرون أن ما دفع من مال كثير طمعا في أجرة قليلة لا يعتبر، لأنه ضرر بالوقف، والخلو يتعين فيه الأجر المثل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7809}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7810}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7810} شروط ثبوت الخلو عند المالكية: أن تكون الدراهم المدفوعة عائدة على الوقف فتصرف في مصالحه، وألا يكون للوقف ريع يعمر به، وأن يثبت الصرف بالوجه الشرعي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7810}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7811}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7811} بيع صاحب الخلو خلوه: يصير ملكا يتصرف فيه بالبيع والإجارة والرهن والهبة والعارية والوصية؛ والبهوتي يرى أن الخلو المشترى يملك مشاعا فتصح بيعه وهبته ووفاء الدين منه لا إجارته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7811}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7812}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7811}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7812} شفعة صاحب الخلو: إذا تعدد المستأجرون وبنوا على أرض محكرة فباع أحدهم حصته في البناء فلشركائه الشفعة، وأبو السعود يرى الشفعة في الغراس لأنه يلتحق بالعقار، وابن عابدين يرى ذلك سهوا لمخالفته نص المذهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7812} وقف الخلو: جمهور متأخري المالكية يجيزونه لأن منفعة الوقف بعضها موقوف وبعضها غير موقوف، والشرواني والحنابلة والأجهوري والمالكية يمنعون وقف الخلو لأنه منفعة وقف وما تعلق به الوقف لا يوقف؛ ورجع عليش إلى جواز وقفه، وبه جرى العمل في مصر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7812}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7813}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7813} الحنفية: وقف البناء دون الأرض لا يجوز عند كثيرين، وجاز إذا تعارف، وابن نجيم أفتى بجواز بيع البناء والغراس في الأرض المحتكرة ووقفهما، وأما الكبس بالتراب فلا يصح وقفه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7813} الخلو في الأوقاف يورث عند من قال إنه يملك ويباع ويرهن، وقد نقل ذلك عن المالكية والحنفية والحنابلة، ولا يُقبل الشرط في إرثه إلا على فرائض الله؛ وإن كانت تكاليف الإصلاح على صاحب الخلو بقدر ملكه، وقد يشترك فيها الناظر بالنسبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7814} الحالة الثانية: أن يكون للمستأجر حق القرار بما أنشأه في أرض الوقف بإذن الناظر لأجل أن يكون ملكا له وخلوا، من بناء أو غراس أو كبس تراب (وهو الكردار عند الحنفية)، أو ما أنشأه في مبنى الوقف مما يتصل اتصال قرار (وهو الجدك)، ويكون له البقاء بأجر المثل إلا إذا ضر البقاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7814}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7815} تجديد الإجارة عند الانتهاء: الناظر مخير عند الأصل، لكن الاستبقاء عند من أفتى به أولى دفعا للضرر عن المستأجر؛ ويشترط أن لا تجدد بأقل من أجرة المثل، وإذا زادت الأجرة زيادة معتبرة وجب تجديد العقد بالزيادة، وقبول المستأجر يكفي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7815} شرط حق القرار عند الحنفية أن يكون ما أحدثه بإذن الناظر ليكون ملكا له؛ فإن لم يكن له كردار أو جدك فلا حق له بعد الإجارة، والفتاوى التي تحفظ حقه ضعيفة في ضياع الأوقاف؛ فإن مات قبل البناء انفسخت الإجارة وفات الورثة الحق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7815}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7816} بيع الخلو الثابت: يملك المستأجر بيع ما أحدثه من أعيان في الأرض، وينتقل حق القرار إلى المشتري على أن يدفع أجر الأرض خالية؛ أما الحق المجرد قبل البناء فلا يباع عند الحنفية، ومنع بعضهم الفراغ عنه بمال، وعند الحنابلة الفراغ في الأوقاف الأهلية باطل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7816}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7817} المالكية: إذا مات الموقوف عليه المؤجر تنفسخ الإجارة، والبناء ملك للباني، فله نقضه أو قيمته منقوضا إن كان في غلة الوقف ما يدفع منها ذلك، وعلى ذلك أفاد الخرشي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7817}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7818} الشافعية والحنابلة لم يذكروا النص، وقاعدة الإجارة تقتضي انتهاء الحق بانتهاء المدة، وقال ابن رجب إن الغراس والبناء بعد المدة للمؤجر أن يتملكه بالقيمة إن لم يقلعه المالك، والمشهور أن له تملكه قهرا؛ والعمل أن المالكية يقولون إن الخلو يباع ويرهن ويورث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7818} الخلو في أراضي بيت المال: الأرض الأميرية عند الحنفية لا تورث لأن رقبتها لبيت المال، ولا تنتقل إلا بإذن السلطان؛ ويورث ما عليها من غراس أو بناء؛ ومشد المسكة حق مجرد لا يورث، لكن جرت فتوى متأخرين أن ينتقل إلى الأبناء الذكور لا ميراثا بل أولوية؛ والمالكية في الأرض الأميرية خلاف: منهم من قال لا تورث وهو المشهور، ومنهم من قال تورث منفعتها ما دام يؤدي الخراج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7818}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7819}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7819}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7820} الشافعية والحنابلة يجيزون بيع البناء والغراس الذي أحدثه من في الأرض، ولا يجيزون بيع الأرض، وأحمد كره بيع الدكان بأكثر من قيمته لئلا يتخذ ذريعة لبيع الأرض؛ وابن تيمية أجاز بيعها فتنتقل بخراجها؛ وإن آثر من هي بيده غيره صار الثاني أحق بها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7820} توريث الأرض الأميرية: الحنفية أن ما عليها من غراس أو بناء يورث، ومشد المسكة لا يورث؛ والمالكية عند من لا يورث يرون السلطان أحق بتوجيهها، وعادة توريث الذكور دون الإناث جرت في بعض قرى الصعيد، وعليش يرى التوريث على الفرائض الشرعية ولا يجوز تخصيص الذكور؛ وفي الشرح الكبير يظهر أن السلطان لا يمنع الورثة لئلا تفتح باب الفساد.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7821} إرث الخلو: قال به المالكية والحنفية والحنابلة إن كان يملك ويباع ويرهن، ويورث على فرائض الله؛ والمالكية يرون أن ولي من بيده الأرض الأميرية ورثته أحق بها إن كان الخراج قد أدي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7814} الخلو الخاص: لا يثبت حق القرار في الأملاك الخاصة المؤجرة عند الحنفية، لأن المالك أحق بملكه، ولا تنشأ فيها حقوق القرار حتى عند من سماه خلوا في الوقف؛ والحنابلة يجيزون بيع المنفعة لكن لا تجوز الإجارة؛ وإن أحدث المستأجر بناء بإذن المالك وأراد الخروج جاز بيع البناء لمشتر يلتزم أجرة الأرض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7823}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7824} أخذ بدل الخلو من مستأجر لاحق: المستأجر الأول إن كان يملك المنفعة بإجارة صحيحة بأجر المثل جاز له أن يأخذ بدلا من مستأجر يحل محله؛ والشيخ عليش يرى أن ما لا إجارة له لا عبرة بخلوه، ويرجع دافع الدراهم على من دفعها له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7824} أحكام الاستمرار بعد انتهاء المدة: للمالك حق استرداد ملكه، إلا أن يكون العقد اتفق فيه على إنشاء الخلو بمال فيجوز بيعه إلى مستأجر لاحق عند من أخذ بذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7825} اكتمل بذلك المدخل.'
  en: 'Khullu is lexically emptiness; in later books it names the usufruct a tenant owns over a waqf property in return for paying the administrator funds to repair it, with a fixed share of its use and the rent paid for the rest for the beneficiaries. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7800} It also names the right of a tenant of state land to keep it if he has built, planted or filled it, and the cash paid for giving up that right. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7800}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7801} Related terms: hukr (the rent on waqf land for one who built or planted), farigh and ifrigh (giving up a right for a price), jadak (movable goods of a tenant attached to a shop or not), kirdar (what a farmer builds or plants with leave), murassad (a debt fixed on the waqf by the tenant\''s repair), and mashd al-maska (the right to farm another\''s land in later Hanafi usage). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7801}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7802}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7802} The nature of khullu: it is ownership of the usufruct, not of use, so its holder may let, give or lend as he likes; the Malikis distinguish that the owner of use uses the thing by its quality, whereas the owner of usufruct may transfer; khullu passes by inheritance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7803} Ways khullu arises on waqf property: by agreement of founder or administrator with the tenant; the Maliki cases include a crumbling waqf let to someone who repairs it, the mosque with shops whose rent cannot repair it, a barren waqf land on which the tenant builds, and shops whose use is sold before the endowment; Shaykh Ulaysh held that the third case is practised. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7803}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7804}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7804}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7805}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7805} Sale of usufruct apart from the property: the Hanbalis allow selling part of a waqf to repair the rest when it cannot be let, the founder and the beneficiary being one; Buhuti holds that khullu cannot be created for money in every case; a person who takes a property from a previous tenant for money does not become owner of the khullu, as Ibn Abidin argues. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7806} Hanafis: khullu falls under the sale of bare rights; the Hanafi texts split on the validity of such sale on custom, with the Shahid and most texts against it; many muftis allowed it by custom; al-Hamawi leaned against it; al-Amadi made it binding by necessity, analogous to the sale of trust. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7806}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7807}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7807} Malikis: the fatwa of al-Laqani on ownership, inheritance and sale of khullu was followed; al-Hamawi says it has no text from Malik; al-Gharqawi says it is derived from the texts; on continuation by custom acts as a condition, and al-Dusuqi and al-Bannani base continuation on the public interest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7807}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7808}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7808}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7809} Rent: the rent for waqf property is the going rate; the Hanafis hold that a large sum paid to get a lower rent does not count, as it harms the waqf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7809}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7810}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7810} Conditions for khullu by Maliki law: the sum paid must go to the waqf\''s needs, no income must already cover the repair, and the spending must be proved. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7810}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7811}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7811} The holder may sell, let, pledge, give, lend or bequeath; Buhuti holds bought khullu is held in common, so it may be sold, given or used for debt but not let. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7811}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7812}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7811}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7812} Pre-emption: where several tenants built on a lease-land and one sells his part of the building, the others have pre-emption; Abu al-Saud allows it in plantings, and Ibn Abidin calls it an error against the text. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7812} Gift or endowment of khullu: most later Malikis allow it, since part of the usufruct is waqf; the Shirwani, Hanbalis and al-Ajhuri forbid it, since a waqf cannot be made of a waqf; Ulaysh turned to permit it, and it was practised in Egypt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7812}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7813}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7813} Hanafis: a building apart from its land may not be endowed by many, though it may be by custom; Ibn Nujaym allowed the sale and endowment of buildings and plantings on leased land; a filling of earth may not be endowed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7813} Khullu in waqf property passes by inheritance where it is owned and may be sold or pledged; these views are reported from the Malikis, Hanafis and Hanbalis, and inheritance follows God\''s shares; repairs fall on the holder in proportion to his interest, and the administrator may share them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7814} Second case: the tenant has a right of occupation by what he built or planted in the waqf land with the administrator\''s leave, to be his own and khullu (the kirdar by Hanafi usage, or the jadak attached to a building); he may keep it on payment of the going rent unless its keeping causes harm. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7814}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7815} Renewal at the end of the lease: the administrator has a choice at the root, but keeping the tenant is better in the view of those who support it, to avoid harm to him; the renewal may not be below the going rent, and if the rent rises much the contract is renewed at the higher rate, the tenant\''s acceptance suffices. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7815} The Hanafi condition for a right of occupation: the building must be made with the administrator\''s leave to be the tenant\''s; without a kirdar or jadak he has no right after the lease; if he dies before building, the lease ends and the heirs lose the right. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7815}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7816} Sale of a valid khullu: the tenant may sell what he built on the land, and the right of occupation passes to the buyer, who pays the rent for the bare land; the bare right before building cannot be sold by the Hanafis, and some forbid its surrender for money; the Hanbalis hold that surrender of private waqf is void. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7816}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7817} Malikis: when the lessor beneficiary dies the lease ends, and the building belongs to the builder, who may remove it or take its value if the waqf income can pay; Khurashi reports this. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7817}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7818} The Shafiis and Hanbalis do not state the text, and the rule of lease ends the right at the end of its term; Ibn Rajab says the lessor may take the building for its value if the lessee does not remove it; the Malikis say khullu is sold, pledged and inherited. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7818} Khullu in state land: for the Hanafis state land is not inherited, as its ground belongs to the treasury, and it passes only by the ruler\''s leave; what is planted or built on it is inherited; the holder\''s right of possession is not inherited, but later Hanafi fatwas let it pass to the sons as priority. Among the Malikis the state land is disputed: some say not inherited, some say its usufruct is inherited while the land tax is paid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7818}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7819}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7819}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7820} Shafiis and Hanbalis allow sale of what the holder built and planted, not of the land; Ahmad disliked selling a shop above its value lest it become a means of selling the land; Ibn Taymiyya allowed selling it so that the tax goes with it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7820} Inheritance of state land: the Hanafis: what is planted or built on it is inherited, and the right of possession is not; the Malikis who deny inheritance hold the ruler may assign it, and a custom in some villages of Upper Egypt gives sons only, which Ulaysh rejects in favour of the legal shares. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7821} Inheritance of khullu: the Malikis, Hanafis and Hanbalis who hold it owned, saleable and pledgeable hold that it is inherited by God\''s shares; the Malikis add that the heirs of one who held state land have prior right if the land tax was paid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7814} Private property: a tenant has no right of occupation in private rented property for the Hanafis, since the owner is entitled to his property; the Hanbalis allow selling the usufruct but not renting it; if the tenant built with the owner\''s leave and leaves, the building may be sold to a buyer who takes on the rent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7823}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7824} Taking a khullu price from a later tenant: if the first tenant owns the usufruct by a valid lease at the going rent, he may take a payment from a tenant who takes his place; Ulaysh holds that a tenant without a valid lease has no khullu, and the payer may recover from the one who took his money. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7824} Continuation after the term: the owner regains his property, unless the contract established khullu for a sum, in which case it may be sold to a later tenant by those who admit it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7825}'
  ur: 'خلو لغت میں خالی ہونا ہے؛ بعد کی کتابوں میں یہ اس منفعت کو کہتے ہیں جو وقف عقار کے کرایہ دار کو اس رقم کے عوض ملتی ہے جو وہ ناظر کو وقف کی مرمت کے لیے دیتا ہے، اس شرط پر کہ اسے منفعت کا معین حصہ ملے اور باقی کا کرایہ مستحقین کے حق میں دے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7800} یہ سرکاری زمین کے کرایہ دار کے اس حق پر بھی بولا جاتا ہے کہ وہ درخت، عمارت یا مٹی ڈالنے کے بعد اسے رکھ سکے، اور اس نقدی پر بھی جو اس حق کو چھوڑنے کے بدلے لی جائے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7800}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7801} ملتے جلتے الفاظ: حکر (وقف زمین پر وہ کرایہ جو عمارت یا درخت لگانے والے سے لیا جائے)، فراغ اور افراغ (حق عوض پر چھوڑنا)، جدک (دکان سے متصل یا غیر متصل کرایہ دار کا ملکیتی سامان)، کردار (کاشتکار کی بنائی یا لگائی ہوئی چیز اجازت سے)، مرصد (مرمت کرنے والے کرایہ دار کا وقف پر ٹھہرا دین)، اور مشد المسکہ (دوسرے کی زمین کاشت کرنے کا حق متأخر حنفیہ کے نزدیک)۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7801}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7802}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7802} خلو کی حقیقت: منفعت کی ملکیت ہے، انتفاع کی نہیں؛ اس کا مالک کرایہ پر دے سکتا ہے، ہبہ کر سکتا ہے اور عاریت دے سکتا ہے؛ مالکیہ کے نزدیک منفعت کا مالک چیز کو وصف سے مقصود رکھتا ہے، اور خلو وراثت میں منتقل ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7803} وقف پر خلو کے پیدا ہونے کی صورتیں: واقف یا ناظر اور کرایہ دار کے معاہدے سے؛ مالکیہ کے نمونے: ٹوٹ پھوٹ کا شکار وقف کو مرمت کرنے والے کو دینا، مسجد کی دکانیں جن کا کرایہ مرمت کے لیے کافی نہ ہو، معطل وقف زمین جس پر کرایہ دار عمارت بنائے، اور وقف سے پہلے منافع فروخت ہونے والی دکانیں؛ شیخ علیش کے نزدیک تیسری صورت پر عمل ہوتا رہا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7803}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7804}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7804}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7805}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7805} وقف خلو کی بیع پر (حنفیہ اور کرایہ دار کے سلسلے میں): مالک اور جمہور کے نزدیک منفعت کا کچھ حصہ وقف ہے، اور حکر کی شرط کے مطابق خلو کی مختلف صورتیں ہیں؛ اصل تفصیل اوپر کی طرح ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7806}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7813} خلو والے کی حیثیت: جو اسے ملکیت مانتے ہیں ان کے نزدیک وقف کا خلو وراثت میں منتقل ہوتا ہے، جو مالکیہ، حنفیہ اور حنابلہ سے منقول ہے، اور تقسیم شرعی فرائض پر ہوگی؛ مرمت کا خرچ اپنے حصے کے مطابق خلو والے پر ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7814} دوسری صورت: کرایہ دار کو اس زمین میں جو ناظر کی اجازت سے بنایا یا لگایا ہو اس پر حقِ قرار حاصل ہے، کردار (حنفیہ کی اصطلاح) یا جدک؛ وہ اجرت مثل ادا کر کے برقرار رہ سکتا ہے جب تک بقا نقصان دہ نہ ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7814}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7815} اجارہ ختم ہونے پر تجدید: ناظر کو اصل میں اختیار ہے، لیکن کرایہ دار کے نقصان سے بچنے کے لیے استبقاء بہتر ہے؛ تجدید اجرت مثل سے کم پر نہیں ہو سکتی، اور اجرت بڑھ جائے تو تجدید بڑھی ہوئی اجرت پر ہوگی، کرایہ دار کی قبولیت کافی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7815} حنفیہ کے نزدیک حقِ قرار کی شرط یہ ہے کہ جو تعمیر کی وہ ناظر کی اجازت سے ہو تاکہ اس کی ملکیت بنے؛ کردار یا جدک نہ ہو تو اجارہ ختم ہونے کے بعد کوئی حق نہیں؛ اگر تعمیر سے پہلے فوت ہو جائے تو اجارہ ختم اور وارثوں کا حق ختم۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7815}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7816} ثابت خلو کی بیع: کرایہ دار زمین میں بنائی یا لگائی ہوئی چیزیں بیچ سکتا ہے اور حقِ قرار خریدار کو منتقل ہو جاتا ہے، جو زمین کا کرایہ خالی زمین کا ادا کرے گا؛ حنفیہ کے نزدیک تعمیر سے پہلے کا خالی حق بیچا نہیں جا سکتا، اور بعض نے مال کے بدلے دستبرداری منع کی؛ حنابلہ کے نزدیک اہلی وقف میں دستبرداری باطل۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7816}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7817} مالکیہ: مؤجر موقوف علیہ مر جائے تو اجارہ ختم، عمارت بنانے والے کی ملکیت ہے، وہ توڑ سکتا ہے یا قیمت لے سکتا ہے اگر وقف کی آمدنی سے ادا ہو سکے؛ یہ خرشی نے بیان کیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7817}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7818} شافعیہ اور حنابلہ نے نص بیان نہیں کیا، اجارہ کا اصول یہ ہے کہ مدت ختم ہونے پر حق ختم؛ ابن رجب کہتے ہیں کہ مؤجر قیمت دے کر عمارت لے سکتا ہے اگر کرایہ دار نہ ہٹائے؛ مالکیہ کے نزدیک خلو بیچا، رہن کیا اور وراثت میں دیا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7818} بیت المال کی زمین کا خلو: حنفیہ کے نزدیک سرکاری زمین وراثت میں نہیں جاتی کیونکہ اس کی ملکیت خزانے کی ہے، سلطان کی اجازت سے ہی منتقل ہوتی ہے؛ جو اس پر درخت یا عمارت ہو وہ وراثت میں جاتی ہے؛ قبضے کا حق وراثت میں نہیں مگر بعد کے حنفی فتووں کے مطابق بیٹوں کو اولویت کے ساتھ منتقل ہوتا ہے؛ مالکیہ میں اختلاف ہے: کچھ کہتے ہیں وراثت نہیں (مشہور)، کچھ کہتے ہیں منفعت ورثہ میں جائے گی جب تک خراج ادا ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7818}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7819}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7819}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7820} شافعیہ اور حنابلہ عمارت اور درخت کی بیع جائز کہتے ہیں مگر زمین کی نہیں؛ احمد نے دکان کو قیمت سے زیادہ بیچنا مکروہ کہا تاکہ زمین کی بیع کا ذریعہ نہ بنے؛ ابن تیمیہ زمین کی بیع کو جائز کہتے ہیں تاکہ خراج اس کے ساتھ منتقل ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7820} سرکاری زمین کی وراثت: حنفیہ کے نزدیک جو درخت یا عمارت اس پر ہو وہ وراثت میں جاتی ہے، مشد المسکہ نہیں؛ مالکیہ کے منکرینِ وراثت سلطان کو تفویض کا حق دیتے ہیں، اور صعید کے بعض دیہاتوں میں بیٹوں کو مخصوص کرنے کا رواج ہے، جسے علیش شرعی فرائض کے مقابلے میں ناجائز کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7821} خلو کی وراثت: جو مالکیہ، حنفیہ اور حنابلہ اسے ملک، قابلِ فروخت اور قابلِ رہن مانتے ہیں ان کے نزدیک یہ وراثت میں الٰہی حصص کے مطابق جاتا ہے؛ مالکیہ کے نزدیک سرکاری زمین کے قبضے دار کے ورثاء خراج ادا ہونے کی صورت میں اولیٰ ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7814} نجی ملکیت: حنفیہ کے نزدیک کرایہ پر دی گئی نجی جائیداد میں حقِ قرار نہیں ہوتا کیونکہ مالک اپنی ملکیت کا زیادہ حقدار ہے؛ حنابلہ منفعت کی بیع جائز کہتے ہیں مگر اجارہ نہیں؛ مالک کی اجازت سے بنائی ہوئی عمارت مشتری کو فروخت ہو سکتی ہے جو زمین کا کرایہ لے گا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7823}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7824} بعد کے کرایہ دار سے بدلِ خلو لینا: پہلا کرایہ دار اگر صحیح اجارہ اور اجرت مثل کے ساتھ منفعت کا مالک ہو تو اپنی جگہ آنے والے سے بدل لے سکتا ہے؛ عُلیش کے نزدیک جس کے پاس اجارہ نہ ہو اس کا خلو معتبر نہیں اور رقم دینے والا اس سے واپس لے سکتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7824} مدت ختم ہونے کے بعد: مالک اپنی ملکیت واپس لے سکتا ہے، ہاں اگر عقد میں مال کے عوض خلو قائم کرنے پر اتفاق تھا تو اس کے قائل حضرات کے نزدیک بعد کے کرایہ دار کو بیچا جا سکتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7825}'
