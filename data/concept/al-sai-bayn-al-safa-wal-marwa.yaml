id: concept/al-sai-bayn-al-safa-wal-marwa
class: concept
kind: legal
label:
  ar: "السعي بين الصفا والمروة"
  en: "The sa'y between al-Safa and al-Marwa"
summary:
  ar: "يروي الشعراوي قصة هاجر في السعي بين الصفا والمروة بحثاً عن الماء لابنها، ويرى أن السعي شعيرة تستدعي التوكل مع الأخذ بالسبب، وأن الإسلام طهّر المكان من أصنام إساف ونائلة، وأن الآية لا تنفي ركنية السعي. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.667}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.668}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.669}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.670}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.671}"
  en: "Sha'rawi tells the story of Hajar running between al-Safa and al-Marwa in search of water for her son, holds that the sa'y is a rite that joins trust with taking the means, that Islam cleansed the place of the idols Isaf and Na'ila, and that the verse does not deny that the sa'y is a pillar {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.667}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.668}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.669}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.670}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.671}."
wings: [ideas]
themes: [worship-and-the-pillars, prophets]
periods: [period/prophetic-era]
regions: [arabia]
issue:
  ar: "هل السعي بين الصفا والمروة ركن من أركان الحج والعمرة أم واجب أم تطوع، وما معنى الطواف فيه؟"
  en: "Is the sa'y between al-Safa and al-Marwa a pillar, an obligation or a voluntary act of Hajj and 'Umra, and what does circling between them mean?"
perspectives:
  - tradition: sunni
    id: sharawi-sai-pillar
    stance:
      ar: "السعي شعيرة من شعائر الحج والعمرة، والآية لا تنفي ركنيته لأنها جاءت رفعاً لحرج عن المسلمين"
      en: "The sa'y is a rite of Hajj and 'Umra; the verse does not deny its status as a pillar, since it came to lift a scruple from the Muslims"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يرد الشعراوي على من قالوا إن السعي ليس ركناً من [[passage/quran-2-158|الآية 158 من البقرة]]، ويقول إن الآية نزلت لسبب هو تحرج المسلمين من الطواف بين الصفا والمروة لوجود الوثنية هناك، ويرى أن لفظ الطواف في الآية يُفهم من الذهاب والعودة المتكرر. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.671}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.672}"
      en: "Sha'rawi answers those who argue from the verse's wording on blame that the sa'y is not a pillar; he says the verse came because the Muslims scrupled to circle between al-Safa and al-Marwa while idolaters did so there, and he reads the word for circling in the verse as going and returning many times {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.671}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.672}."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
  - tradition: sunni
    id: scope-note-jurists-disagreement
    stance:
      ar: "الخلاف الفقهي في حكم السعي لم يُدخل من مصدر مراجَع في هذه الدفعة"
      en: "The jurists' disagreement on the ruling of the sa'y is not entered from a checked source in this batch"
    holders: []
    summary:
      ar: "يذكر الشعراوي أن بعض الناس قالوا إن السعي ليس ركناً، ويرد عليهم، دون أن تُدخل هنا أقوالهم بأسمائها ولا مذاهب الفقهاء في حكمه. الرأي الأكاديمي والآراء الأخرى لم تُدخل. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.672}"
      en: "Sha'rawi reports that some people said the sa'y is not a pillar and answers them; their names and the schools' rulings on the sa'y are not entered here, and neither the academic view nor other views are entered {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.672}."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
