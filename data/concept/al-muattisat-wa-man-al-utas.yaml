id: concept/al-muattisat-wa-man-al-utas
class: concept
kind: scientific
label:
  ar: المانع من العطاس والمعطسات
  en: What checks the sneeze and the sternutatories
  ur: چھینک روکنے والے اور چھینک لانے والے
summary:
  ar: مما يمنع العطاس التسعط بدهن من جنس ما يعرف ودهن آخر شديد التسكين له وحسو حار وتحميم الرأس بماء حار وصب دهن حار في الأذنين والاستلقاء على مرفقة حارة تحت القفا واشتمام أشياء من جنس ما يعرف والفكر والاشتغال عنه، ومنه شدة الصبر عليه وهو كاف للضعيف منه، ومنه ربط العين والأذن والأطراف والحنك وقوة الفغر والتحشي وتحديد النظر إلى فوق والتململ والتقلب وتمريخ العضل بالأدهان المرطبة خصوصاً عضل اللحيين والاستغراق في النوم واتقاء الانتباه المباغت والتحرز عن الغبار والدخان ⁦(سطر كلية الصبيان المشوية منقول موسوم والأسماء لا تحمل)⁩؛ وأما المعطسات فأدوية من جنس ما يعرف تجمع أو تؤخذ إفراداً تلصق بريشة في الأنف أو تلطخ باطنه بها وهو أصوب من نفخة فيه {cite:canon-ibn-sina-print-v2 p.251} {cite:canon-ibn-sina-print-v2 p.252}
  en: 'What checks the sneeze: snuffing an oil of the known kind and another oil strongly calming to it, a hot draught, bathing the head in hot water, pouring hot oil into the ears, lying on a warm pad placed under the nape, smelling things of the known kind, and thought and distraction — and firm patience with it, which suffices for the weak kind; also binding the eye, the ear, the limbs and the palate, forced gaping, stuffing, fixing the gaze upward, tossing and turning, anointing the muscles — above all the jaw muscles — with moistening oils, deep sleep, avoiding sudden waking, and keeping off dust and smoke ⁦(the boys'' roasted-kidney line is carried as an attributed report, labelled; the drug names are not carried)⁩. The sternutatories are drugs of the known kind taken together or singly, applied on a feather in the nose or smeared inside it — which is better than a puff into it {cite:canon-ibn-sina-print-v2 p.251} {cite:canon-ibn-sina-print-v2 p.252}'
  ur: چھینک کو روکنے والوں میں معروف جنس کے تیل کا سعوط اور ایک اور تیل جو اسے سخت ٹھنڈا کرتا ہے، گرم کش، سر کو گرم پانی سے نہلانا، کانوں میں گرم تیل ڈالنا، گرم تکیے پر لیٹنا جو گدی کے نیچے ہو، معروف جنس کی چیزیں سونگھنا، اور فکر اور اس سے توجہ ہٹانا — اور اس پر سخت صبر جو کمزور قسم کے لیے کافی ہے؛ اور آنکھ، کان، اعضا اور تالو کا باندھنا، زور سے منہ کھولنا، حشو، اوپر ٹکٹکی لگانا، کروٹیں بدلنا، پٹھوں پر — خاص طور پر جبڑوں کے پٹھوں پر — تر تیلوں کا مسح، گہری نیند، اچانک جاگنے سے بچنا اور غبار اور دھوئیں سے پرہیز ⁦(لڑکوں کی بھنی گردے والا سطر منسوب خبر کے طور پر موسوم، نام نہیں لیے گئے)⁩؛ اور چھینک لانے والے معروف جنس کے ادویہ ہیں جو مجموع یا الگ الگ لیے جائیں اور پنکھ کے ذریعے ناک میں لگائے جائیں یا اس کے باطن میں ملے جائیں جو ناک میں پھونکنے سے بہتر ہے {cite:canon-ibn-sina-print-v2 p.251} {cite:canon-ibn-sina-print-v2 p.252}
