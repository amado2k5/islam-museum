summary:
  ar: "صورة الرحيق المختوم للحكم في الجزيرة عند بزوغ الإسلام: ملوك متوجون غير مستقلين في اليمن والحيرة والشام، ورؤساء قبائل مستقلون في البوادي لهم ما للملوك من الحكم والامتياز؛ القبيلة حكومة مصغرة أساسها العصبية، ولسيدها حقوق المرباع والصفي والنشيطة والفضول؛ والأقطار المجاورة للأجانب في تضعضع بين سادة وعبيد، وقبائل الداخل مفككة لا ملك يجمعها، وحكومة الحجاز دينية محترمة لكنها ضعيفة."
  en: "al-Raheeq al-Makhtum's picture of rule in Arabia at the rise of Islam: crowned but dependent kings in Yemen, al-Hira and al-Sham, and independent tribal chiefs in the interior with a king's authority; the tribe as a miniature government founded on asabiyya, its chief entitled to the quarter, the choice share, the roadside booty and the remainder; the frontier regions in decay between masters and slaves, the inland tribes fragmented with no king, and the religious government of the Hijaz respected but weak."
