label: { ar: "الحالة السياسية في العرب قبل الإسلام", en: "The political condition of the Arabs before Islam", es: "La situación política de los árabes antes del Islam.", fr: "La situation politique des Arabes avant l'islam", ur: "اسلام سے پہلے عربوں کی سیاسی حالت", tr: "İslam öncesi Arapların siyasi durumu", id: "Situasi politik di Arab sebelum Islam" }
summary:
  ar: "صورة الرحيق المختوم للحكم في الجزيرة عند بزوغ الإسلام: ملوك متوجون غير مستقلين في اليمن والحيرة والشام، ورؤساء قبائل مستقلون في البوادي لهم ما للملوك من الحكم والامتياز؛ القبيلة حكومة مصغرة أساسها العصبية، ولسيدها حقوق المرباع والصفي والنشيطة والفضول؛ والأقطار المجاورة للأجانب في تضعضع بين سادة وعبيد، وقبائل الداخل مفككة لا ملك يجمعها، وحكومة الحجاز دينية محترمة لكنها ضعيفة."
  en: "al-Raheeq al-Makhtum's picture of rule in Arabia at the rise of Islam: crowned but dependent kings in Yemen, al-Hira and al-Sham, and independent tribal chiefs in the interior with a king's authority; the tribe as a miniature government founded on asabiyya, its chief entitled to the quarter, the choice share, the roadside booty and the remainder; the frontier regions in decay between masters and slaves, the inland tribes fragmented with no king, and the religious government of the Hijaz respected but weak."
  es: "La visión de al-Raheeq al-Makhtum sobre el gobierno en Arabia en el auge del Islam: reyes coronados pero dependientes en Yemen, al-Hira y al-Sham, y jefes tribales independientes en el interior con autoridad real; la tribu como un gobierno en miniatura fundado en la asabiyya, su jefe con derecho a la cuarta parte, la mejor parte, el botín de los caminos y el resto; las regiones fronterizas en decadencia entre amos y esclavos, las tribus del interior fragmentadas sin rey, y el gobierno religioso del Hiyaz respetado pero débil."
  fr: "Le tableau dressé par al-Raheeq al-Makhtum du pouvoir en Arabie à l'aube de l'islam: des rois couronnés mais dépendants au Yémen, à al-Hira et à al-Sham, et des chefs tribaux indépendants à l'intérieur des terres, dotés d'une autorité royale; la tribu comme un gouvernement miniature fondé sur l'asabiyya, son chef ayant droit au quart du territoire, à la part de choix, au butin trouvé en bord de route et au reste; les régions frontalières en déclin entre maîtres et esclaves, les tribus de l'intérieur fragmentées et sans roi, et le gouvernement religieux du Hedjaz respecté mais faible."
  ur: "الرحیق المختم کی اسلام کے عروج پر عرب میں حکمرانی کی تصویر: یمن، الحیرہ اور الشام میں تاج دار لیکن منحصر بادشاہ، اور اندرونی علاقوں میں بادشاہ کے اختیارات کے ساتھ آزاد قبائلی سردار؛ قبیلہ ایک چھوٹی حکومت کے طور پر جس کی بنیاد اصابیہ پر رکھی گئی تھی، اس کا سربراہ سہ ماہی کا حقدار ہے، انتخاب کا حصہ، سڑک کے کنارے مال غنیمت اور بقیہ؛ آقاؤں اور غلاموں کے درمیان زوال پذیر سرحدی علاقے، اندرون ملک قبائل بغیر کسی بادشاہ کے بکھر گئے، اور حجاز کی مذہبی حکومت قابل احترام لیکن کمزور تھی۔"
  tr: "İslam'ın şafağında Cazire'deki yönetimin mühürlü nektar imgesi: Yemen, Al-Hirah ve Levant'ta bağımsız olmayan taçlı krallar; çöllerde kralların yönetimi ve ayrıcalıklarından yararlanan bağımsız aşiret reisleri; kabile, kabile fanatizmine dayalı minyatür bir yönetimdi ve efendisi Murba', Safi haklarına sahipti, aktif ve meraklıydı; yabancılara komşu topraklar efendiler ve köleler arasında zayıflamıştı, içerideki kabileler parçalanmıştı ve onları birleştiren kral yoktu ve Hicaz'ın yönetimi dini ama zayıftı."
  id: "Gambaran pemerintahan yang tersegel di Jazira pada awal Islam: raja-raja yang dimahkotai namun belum merdeka di Yaman, Al-Hirah, dan Levant; kepala suku independen di gurun yang menikmati kekuasaan dan hak istimewa raja; suku ini adalah pemerintahan miniatur yang didasarkan pada fanatisme suku, dan tuannya memiliki hak Murba', Safi, aktif, dan penasaran; tanah tetangga bagi orang asing melemah antara tuan dan budak, suku-suku di dalamnya terpecah tanpa raja yang menyatukan mereka, dan pemerintahan Hejaz bersifat religius namun lemah."
