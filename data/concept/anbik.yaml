label:
  ar: "الأنبيق (رأس جهاز التقطير)"
  en: "Anbik (the alembic; head of the distilling apparatus)"
summary:
  ar: "الأنبيق جزء من جهاز التقطير يُسمى أيضًا الرأس أو القلنسوة، وهو الغطاء الذي يُركّب فوق القرعة، وقد ورد اسمه في ترجمات ديوسقوريدس والرازي وكتب الكيمياء {cite:encyclopaedia-of-islam-2 vol. 1 p. 509}."
  en: "The anbik, from Greek, is the part of the distilling apparatus also called the head or cap, set over the cucurbit. It appears in the tenth-century translation of Dioscorides and in al-Razi and other chemical texts, where it is used for distilling rose-water {cite:encyclopaedia-of-islam-2 vol. 1 p. 509}."
