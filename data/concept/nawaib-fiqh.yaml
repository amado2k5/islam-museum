id: concept/nawaib-fiqh
class: concept
kind: legal
label: { ar: "نَوائب", en: "Nawa'ib (extraordinary levies on the people: their rightful and unjust forms)", es: "Nawa'ib (impuestos extraordinarios al pueblo: sus formas justas e injustas)", fr: "Nawa'ib (prélèvements extraordinaires sur le peuple: leurs formes légitimes et injustes)", ur: "نواب ⁦(لوگوں پر غیر معمولی محصول: ان کی جائز اور ناجائز شکلیں)⁩", tr: "Olasılıklar", id: "Peluang" }
summary:
  ar: "النوائب في اللغة جمع نائبة، وهي النازلة والمصيبة من المهمات والحوادث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16657} وفي الاصطلاح الحنفي قد يُراد بها ما يكون بحق كما يوظّفه الإمام لتجهيز الجيش وفداء الأسارى إذا لم يكن في بيت المال مال، وقد يُراد بها ما ليس بحق كالجبايات المفروضة ظلماً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16657} وفرضها واجب إذا كانت مصلحة عامة ولم يكف بيت المال، لأن المال معدّ لنوائب المسلمين، واستدل الفقهاء بآيات التوبة في الجهاد بالمال والنفس ⁦(الآية 41)⁩. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16658} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16659} والجائز منها ما يدفع أجرة للحراسة والخفارة على ألا يجحف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16660} وأما ما يُفرض ظلماً فلا يجب دفعه، واعتبر ابن عابدين إعطاء النوائب الظالمة إعانة للظالم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16660} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16661} والكفالة بالنوائب الحقة جائزة عند الحنفية، وفيها خلاف بين الحنفية في النوائب الظالمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16662} وأجاز الحنفية أن يرجع من أدّى عن غيره بإذنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16664}"
  en: "Nawa'ib are the plural of nawaiba, a calamity or an extraordinary matter that befalls people. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16657} In the Hanafi usage the term can mean a rightful levy, such as one the imam imposes to equip the army or ransom captives when the treasury has no money, or an unjust exaction. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16657} Imposing a levy is obligatory when there is public benefit and the treasury cannot meet it, the jurists citing the Qur'anic command to strive with one's wealth and self (surat al-Tawba, ayah 41). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16658} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16659} A permitted form is a fee for escort or guard that does not burden the people. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16660} An unjust levy need not be paid, and Ibn Abidin held that paying unjust levies helps the oppressor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16660} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16661} Guaranteeing a rightful levy is permitted by Hanafi agreement, and the Hanafis differ on guaranteeing unjust ones. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16662} The Hanafis allow one who pays another's levy with his leave to reclaim it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16664}"
  es: "Nawa'ib es el plural de nawaiba, una calamidad o un asunto extraordinario que le sobreviene a la gente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16657} En el uso hanafi, el término puede significar un impuesto legítimo, como el que impone el imán para equipar al ejército o rescatar cautivos cuando el tesoro no tiene dinero, o una exacción injusta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16657} Imponer un impuesto es obligatorio cuando hay un beneficio público y el tesoro no puede cubrirlo, los juristas citan el mandato coránico de esforzarse con la riqueza y el ser (surat al-Tawba, ayah 41). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16658} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16659} Una forma permitida es una tarifa por escolta o guardia que no sea una carga para las personas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16660} No es necesario pagar un impuesto injusto, e Ibn Abidin sostuvo que pagar impuestos injustos ayuda al opresor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16660} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16661} Garantizar un impuesto legítimo está permitido por el acuerdo Hanafi, y los Hanafi difieren en cuanto a garantizar impuestos injustos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16662} Los hanafíes permiten que quien paga el impuesto de otro con su permiso lo reclame. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16664}"
  fr: "Le terme « nawa'ib » est le pluriel de « nawaiba », qui désigne une calamité ou un événement extraordinaire frappant une personne. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16657} Dans l'usage hanafite, ce terme peut désigner une taxe légitime, telle que celle imposée par l'imam pour équiper l'armée ou racheter des captifs lorsque le trésor est à sec, ou une exigence injuste. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16657} L'imposition d'une taxe est obligatoire lorsqu'elle est d'intérêt public et que le trésor ne peut la financer, les juristes se fondant sur le commandement coranique de lutter avec ses biens et son âme (sourate At-Tawba, verset 41). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16658} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16659} Une forme autorisée est une redevance pour l'escorte ou la garde qui ne pèse pas sur les gens. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16660} Un prélèvement injuste n'a pas besoin d'être payé, et Ibn Abidin a soutenu que le fait de payer des prélèvements injustes aide l'oppresseur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16660} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16661} Garantir un prélèvement légitime est autorisé par l'accord Hanafi, et les Hanafi diffèrent sur la garantie des prélèvements injustes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16662} Les hanafites autorisent celui qui paie la taxe d'autrui avec son accord à la réclamer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16664}"
  ur: "Nawa'ib، Nawaiba کی جمع ہے، ایک آفت یا ایک غیر معمولی معاملہ جو لوگوں کو پہنچتا ہے. {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 صفحہ 16657} حنفی استعمال میں اس اصطلاح کا مطلب جائز محصول ہو سکتا ہے، جیسے کہ امام فوج کو مسلح کرنے یا قیدیوں کو تاوان دینے کے لیے جب خزانے میں رقم نہ ہو، یا ناجائز وصولی ہو۔ فقہ الموسوعۃ کویتیہ نور v3 صفحہ 16657} محصول لگانا اس وقت واجب ہے جب عوامی فائدہ ہو اور خزانہ اسے پورا نہ کر سکتا ہو، فقہاء نے اپنے مال اور نفس سے جہاد کرنے کا قرآنی حکم نقل کیا ہے ⁦(سورۃ التوبہ، آیت 41)⁩۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.16658} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.16659} ایک اجازت شدہ شکل محافظ یا محافظ کے لئے ایک فیس ہے جو لوگوں پر بوجھ نہیں ڈالتی ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص16660} ناجائز محصول ادا کرنے کی ضرورت نہیں ہے، اور ابن عابدین کا خیال ہے کہ ناجائز محصول ادا کرنے سے ظالم کی مدد ہوتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16660} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16661} حنفی معاہدے کے ذریعہ جائز محصول کی ضمانت دی گئی ہے، اور حنفیوں میں ناجائز کی ضمانت دینے میں اختلاف ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 16662} احناف اس شخص کو اجازت دیتے ہیں جو اس کی اجازت کے ساتھ دوسرے کا لیوی ادا کرتا ہے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص16664}"
  tr: "Dilde 'nawa'ib' kelimesi 'na'iba'nın çoğuludur ve önemli olaylar arasındaki felaket ve felaketi ifade eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16657} Hanefi terminolojisinde, imamın orduyu donatmak ve kamu hazinesinde para yoksa esirleri fidye etmek için kullandığı haklı olarak uygulanan şeyleri ifade edebilir ya da haksız yere uygulanan vergiler gibi haksız olanları ifade edebilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16657} Kamu yararı için yükümlülüğü zorunludur ve kamu hazinesi yeterli değilse, çünkü para Müslümanların felaketleri için ayrılmıştır. Hukukçular, cihadda tövbe ayetleri alıntılamışlardır (ayet 41). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16658} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16659} ve haksız olmadığı sürece koruma ve nöbet için ücret ödemek mümkündür. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16660} Adaletsizlik getiren şey ödenmemelidir. İbn Abidin, haksız felaketleri zulme yardım olarak görmüştür. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16660} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16661} Hanefilere göre gerçek sıkıntılar için kefalet kabul edilir ve Hanafi arasında haksız sıkıntılar konusunda anlaşmazlık vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16662} Hanafiler, başkasının bedelini ödeyen kişinin izniyle geri çekilmesine izin verirdi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16664}"
  id: "Dalam bahasa, 'nawa'ib' adalah jamak dari 'na'iba', yang berarti bencana dan bencana di antara peristiwa dan peristiwa penting. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16657} Dalam terminologi Hanafi, istilah ini dapat merujuk pada apa yang memang dipaksakan secara sah, karena Imam menggunakannya untuk melengkapi tentara dan menebus tawanan jika tidak ada uang di kas negara, atau dapat merujuk pada hal-hal yang tidak semestinya, seperti pajak yang dikenakan secara tidak adil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16657} Kewajibannya wajib jika untuk kepentingan umum dan kas umum tidak cukup, karena uang dimaksudkan untuk bencana umat Islam. Para ahli hukum telah mengutip ayat-ayat pertobatan dalam jihad dengan kekayaan dan kehidupan (ayat 41). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16658} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16659} dan diperbolehkan membayar biaya untuk menjaga dan bertahan, asalkan tidak adil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16660} Adapun apa yang menimbulkan ketidakadilan, tidak boleh dibayar. Ibn Abidin menganggap memberikan bencana tidak adil sebagai bantuan kepada penindas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16660} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16661} Kepastian atas penderitaan nyata diperbolehkan menurut kaum Hanafi, dan terdapat perbedaan pendapat di antara kaum Hanafi mengenai penderitaan yang tidak adil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16662} Kaum Hanafi mengizinkan siapa yang membayar orang lain untuk menarik kembali dengan izinnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16664}"
