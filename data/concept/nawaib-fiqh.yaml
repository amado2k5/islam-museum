id: concept/nawaib-fiqh
class: concept
kind: legal
label: { ar: "نَوائب", en: "Nawa'ib (extraordinary levies on the people: their rightful and unjust forms)" }
summary:
  ar: "النوائب في اللغة جمع نائبة، وهي النازلة والمصيبة من المهمات والحوادث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16657} وفي الاصطلاح الحنفي قد يُراد بها ما يكون بحق كما يوظّفه الإمام لتجهيز الجيش وفداء الأسارى إذا لم يكن في بيت المال مال، وقد يُراد بها ما ليس بحق كالجبايات المفروضة ظلماً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16657} وفرضها واجب إذا كانت مصلحة عامة ولم يكف بيت المال، لأن المال معدّ لنوائب المسلمين، واستدل الفقهاء بآيات التوبة في الجهاد بالمال والنفس (الآية 41). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16658} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16659} والجائز منها ما يدفع أجرة للحراسة والخفارة على ألا يجحف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16660} وأما ما يُفرض ظلماً فلا يجب دفعه، واعتبر ابن عابدين إعطاء النوائب الظالمة إعانة للظالم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16660} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16661} والكفالة بالنوائب الحقة جائزة عند الحنفية، وفيها خلاف بين الحنفية في النوائب الظالمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16662} وأجاز الحنفية أن يرجع من أدّى عن غيره بإذنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16664}"
  en: "Nawa'ib are the plural of nawaiba, a calamity or an extraordinary matter that befalls people. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16657} In the Hanafi usage the term can mean a rightful levy, such as one the imam imposes to equip the army or ransom captives when the treasury has no money, or an unjust exaction. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16657} Imposing a levy is obligatory when there is public benefit and the treasury cannot meet it, the jurists citing the Qur'anic command to strive with one's wealth and self (surat al-Tawba, ayah 41). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16658} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16659} A permitted form is a fee for escort or guard that does not burden the people. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16660} An unjust levy need not be paid, and Ibn Abidin held that paying unjust levies helps the oppressor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16660} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16661} Guaranteeing a rightful levy is permitted by Hanafi agreement, and the Hanafis differ on guaranteeing unjust ones. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16662} The Hanafis allow one who pays another's levy with his leave to reclaim it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16664}"
