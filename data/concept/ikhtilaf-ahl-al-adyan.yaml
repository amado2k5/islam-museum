id: concept/ikhtilaf-ahl-al-adyan
class: concept
kind: term
label: { ar: "اختلاف أهل الأديان وسنة الله في الخلق", en: "Disagreement among the people of the faiths and God's sunna in creation" }
issue:
  ar: "هل وقوع الاختلاف والاقتتال بين أتباع الرسل بمشيئة الله تجبرهم عليه، أم هو نتيجة ما خلق الله في الإنسان من عقل وكسب واختيار؟"
summary:
  ar: "وقوع الاختلاف بين أتباع الرسل، كما في قوله تعالى في البقرة 253: «ولو شاء الله ما اقتتل الذين من بعدهم». يذكر محمد رشيد رضا عن الأستاذ الإمام أن الحمل على ظاهر المشيئة يجعل الآية جبرية لا عبرة فيها، ويقرأها سنة في خلق الإنسان: عقل يكتسب، وهداية اختيارية، فيكون الاختلاف من هذا الباب، ويحذر من تكراره بين المسلمين."
  en: "The occurrence of disagreement among the followers of the messengers, as in al-Baqara 253, which refers to God's will concerning the fighting of those who came after them. Rashid Rida reports from the Ustadh al-Imam that taking the will in its literal sense makes the verse compulsory and empty of lesson, and he reads it as a sunna in the making of man: a mind that acquires, and a guidance that is chosen. Disagreement therefore falls under this heading, and he warns against its recurrence among Muslims."
