id: concept/ikhtilaf-ahl-al-adyan
class: concept
kind: term
label: { ar: "اختلاف أهل الأديان وسنة الله في الخلق", en: "Disagreement among the people of the faiths and God's sunna in creation", es: "Desacuerdo entre las personas de diferentes credos y la sunna de Dios en la creación.", fr: "Désaccords entre les peuples des différentes religions et la sunna de Dieu concernant la création" }
issue:
  ar: "هل وقوع الاختلاف والاقتتال بين أتباع الرسل بمشيئة الله تجبرهم عليه، أم هو نتيجة ما خلق الله في الإنسان من عقل وكسب واختيار؟"
summary:
  ar: "وقوع الاختلاف بين أتباع الرسل، كما في قوله تعالى في البقرة 253: «ولو شاء الله ما اقتتل الذين من بعدهم». يذكر محمد رشيد رضا عن الأستاذ الإمام أن الحمل على ظاهر المشيئة يجعل الآية جبرية لا عبرة فيها، ويقرأها سنة في خلق الإنسان: عقل يكتسب، وهداية اختيارية، فيكون الاختلاف من هذا الباب، ويحذر من تكراره بين المسلمين."
  en: "The occurrence of disagreement among the followers of the messengers, as in al-Baqara 253, which refers to God's will concerning the fighting of those who came after them. Rashid Rida reports from the Ustadh al-Imam that taking the will in its literal sense makes the verse compulsory and empty of lesson, and he reads it as a sunna in the making of man: a mind that acquires, and a guidance that is chosen. Disagreement therefore falls under this heading, and he warns against its recurrence among Muslims."
  es: "La aparición de desacuerdos entre los seguidores de los mensajeros, como en al-Baqara 253, que se refiere a la voluntad de Dios respecto a la lucha de quienes vinieron después de ellos. Rashid Rida relata, citando al Ustadh al-Imam, que interpretar la voluntad de Dios literalmente convierte el versículo en una imposición vacía de enseñanza, y lo interpreta como una sunna en la formación del ser humano: una mente que se adquiere y una guía que se elige. Por lo tanto, el desacuerdo se incluye en este concepto, y advierte contra su reaparición entre los musulmanes."
  fr: "L'apparition de désaccords parmi les disciples des messagers, comme dans la sourate Al-Baqara (253), qui évoque la volonté divine concernant le combat de leurs successeurs, est préoccupante. Rashid Rida rapporte de l'Ustadh al-Imam que, si l'on interprète cette volonté au sens littéral, le verset devient obligatoire et vide de sens. Il le considère plutôt comme une sunna œuvrant à la formation de l'homme: un esprit qui acquiert et une voie qu'il choisit. Les désaccords relèvent donc de cette catégorie, et Rashid Rida met en garde contre leur réapparition parmi les musulmans."
