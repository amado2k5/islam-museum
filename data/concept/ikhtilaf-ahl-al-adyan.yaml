    stance:
      ar: "سنة الله أن يكون الإنسان عاقلاً مكتسباً، فيقع الاختلاف بالاختيار"
    summary:
      ar: "القراءة التي يبسطها الأستاذ الإمام ويعرضها رضا: الإنسان خُلق بعقل يتصرف في شعوره، وارتقاؤه كسبي، وهداية الدين اختيارية، فمنهم من أخذ الدين على وجهه ومنهم من حكم هواه فيه. وعلى هذا يكون الاختلاف وسبب الاقتتال، واليهود مثال له، والنصارى تشعبت مذاهبهم حتى اقتتل أهلها. {cite:tafsir-manar-v03 p.7}"
