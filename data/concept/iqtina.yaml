id: concept/iqtina
class: concept
kind: legal
label: { ar: "اقتناء", en: "Iqtina' (keeping property for oneself)" }
summary:
  ar: "الاقتناء لغة اتخاذ الشيء لنفسه لا للبيع أو التجارة، والمعنى الاصطلاحي لا يفترق عن اللغوي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3182} وقد يكون الاقتناء مباحا، بل مندوبا كاقتناء المصاحف وكتب الحديث والعلم، ومباحا في حال دون حال كاقتناء الذهب والفضة والكلب المعلَّم، وحراما كاقتناء الخنزير والخمر وآلات اللهو المحرمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3182} ولا تجب الزكاة في المقتنى من النعم إلا ما أُسيم للحمل أو الركوب أو النسل إذا بلغ نصابا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3182} أما الذهب والفضة المقتنيان فتجب زكاتهما عند الحنفية إذا بلغا النصاب، نوى التجارة أو لم ينو، ووافقهم المالكية والشافعية والحنابلة في الجملة إلا في حلي النساء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3182} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3183}"
  en: "Iqtina' means taking a thing for oneself, not for sale or trade. The jurists' technical sense is the same as the lexical one. Keeping a thing may be permitted, or even recommended, as in keeping copies of the Qur'an and books of hadith and learning. It may be permitted in some circumstances and not others, as with keeping gold, silver, or a trained dog. It may be forbidden, as with keeping swine, wine, or instruments of forbidden play. Zakat is not due on kept livestock in general, except on animals kept for load, riding or breeding that reach the minimum (nisab). In the Hanafi view, kept gold and silver are liable to zakat once they reach the nisab, whether or not the owner intended trade; the Malikis, Shafi'is and Hanbalis agree in general, except for women's jewellery. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3182} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3183}"
