id: concept/khalwa
class: concept
kind: term
label:
  ar: "الخلوة"
  en: "Khalwa (spiritual retreat)"
  ur: "خلوت"
summary:
  ar: "الخلوة اعتزال يتخذه بعض الصوفية للذكر وجمع القلب، وقد يحددونه بأربعين يوماً. خصص ابن تيمية في المجلد العاشر من مجموع الفتاوى كلاماً في «الخلوات البدعية»، فرّق فيه بين الاعتكاف الشرعي في المساجد والاعتزال المشروع، وبين خلوات المتأخرين التي يحتج أصحابها بتحنث النبي في غار حراء وبأربعين موسى، ونقد فيه طريقة أبي حامد الغزالي في تفريغ القلب والذكر بالاسم المفرد."
  en: "Khalwa is a retreat taken by some Sufis for remembrance and the gathering of the heart, sometimes fixed at forty days. In volume ten of Majmu' al-Fatawa Ibn Taymiyya discusses 'innovated retreats', distinguishing lawful seclusion in the mosque (i'tikaf) and lawful withdrawal from the retreats of later Sufis, who cite the Prophet's devotions in the cave of Hira and Moses' forty nights, and criticising Abu Hamid al-Ghazali's method of emptying the heart and of remembrance by the single name."
  ur: "خلوت ایک گوشہ نشینی ہے جو بعض صوفیہ ذکر اور دل کی یکسوئی کے لیے اختیار کرتے ہیں، اور کبھی اسے چالیس دن تک محدود کرتے ہیں۔ مجموع الفتاویٰ کی دسویں جلد میں ابن تیمیہ «بدعتی خلوتوں» پر کلام کرتے ہیں، جس میں وہ مسجد کے شرعی اعتکاف اور مشروع کنارہ کشی کو متاخرین کی ان خلوتوں سے الگ کرتے ہیں جن کے حامی غارِ حرا میں نبی کی عبادت اور موسیٰ کی چالیس راتوں سے دلیل لیتے ہیں، اور ابو حامد غزالی کے دل خالی کرنے اور اسمِ مفرد کے ذکر کے طریقے پر تنقید کرتے ہیں۔"
wings: [ideas, living]
themes: [spirituality-and-sufism, worship-and-the-pillars]
regions: [global]
periods: [period/abbasid-early]
issue:
  ar: "هل الخلوة الصوفية المحددة بزمان ومكان وأذكار عبادة مشروعة، أم بدعة تختلف عن الاعتكاف والعزلة المشروعين؟"
  en: "Is the Sufi retreat, fixed in time, place and litanies, a lawful act of worship, or an innovation distinct from lawful i'tikaf and withdrawal?"
  ur: "کیا وقت، جگہ اور اذکار سے مقرر صوفی خلوت مشروع عبادت ہے، یا مشروع اعتکاف اور عزلت سے مختلف ایک بدعت؟"
perspectives:
  - tradition: sunni-hanbali
    id: ibn-taymiyya-innovated-retreats
    standing: main
    stance: { ar: "الخلوات المحدثة بدعة، والمشروع الاعتكاف في المساجد واعتزال الشر وفضول المباحات مع حفظ الجمعة والجماعة", en: "Newly invented retreats are an innovation; what is lawful is i'tikaf in mosques and withdrawal from evil and needless permitted things while keeping Friday and congregational prayer", ur: "نئی ایجاد کردہ خلوتیں بدعت ہیں؛ مشروع یہ ہے کہ مسجد میں اعتکاف ہو اور شر اور غیر ضروری مباحات سے کنارہ کشی ہو، جمعہ اور جماعت کی پابندی کے ساتھ" }
    summary: { ar: "يرى ابن تيمية أن الاحتجاج بغار حراء خطأ لأنه قبل النبوة ولم يقصده النبي بعدها، وأن الأربعينية تمسك بشرع منسوخ لموسى، وأن تفريغ القلب وانتظار ما ينزل طريقة تفتح الباب لتنزل الشياطين، وأن الذكر بالاسم المفرد بدعة، وأن ما يدعيه أبو حامد من حصول ما يشبه ما يحصل للأنبياء من بقايا الفلسفة عليه.", en: "Ibn Taymiyya holds that citing the cave of Hira is a mistake, since it preceded prophethood and the Prophet did not go back to it afterwards; that the forty-day retreat clings to an abrogated law given to Moses; that emptying the heart and waiting for what descends opens the way to the descent of devils; that remembrance by the single name is an innovation; and that Abu Hamid's claim that something like what comes to prophets can be reached is a residue of philosophy in him.", ur: "ابن تیمیہ کے نزدیک غارِ حرا سے دلیل لینا غلط ہے کیونکہ وہ نبوت سے پہلے کی بات ہے اور نبی نے اس کے بعد وہاں کا قصد نہیں کیا؛ چالیس دن کی خلوت موسیٰ کی منسوخ شریعت سے تمسک ہے؛ دل خالی کر کے نازل ہونے والی چیز کا انتظار شیاطین کے نزول کا دروازہ کھولتا ہے؛ اسمِ مفرد کا ذکر بدعت ہے؛ اور ابو حامد کا یہ دعویٰ کہ انبیا جیسی چیز حاصل ہو سکتی ہے ان پر فلسفے کا باقی اثر ہے۔" }
    holders: [person/ibn-taymiyya]
    evidence: [{ ref: source/majmu-fatawa-qasim-v10, note: { ar: "مجموع الفتاوى ج10 ص 393–406", en: "Majmu' al-Fatawa vol. 10 pp. 393–406" } }]
    sources: [source/majmu-fatawa-qasim-v10]
  - tradition: sufi
    id: ghazali-retreat-as-reported
    standing: secondary
    stance: { ar: "الخلوة وتفريغ القلب والذكر طريق إلى الكشف", en: "Retreat, emptying the heart and remembrance are a path to unveiling", ur: "خلوت، دل کی فراغت اور ذکر کشف کا راستہ ہیں" }
    summary: { ar: "في نقل ابن تيمية: يأمر أبو حامد الغزالي ومن تبعه صاحب الخلوة ألا يزيد على الفرض من قراءة أو نظر في حديث، ويأمره بالذكر، ويقسم الذكر إلى ذكر العامة «لا إله إلا الله» وذكر الخاصة «الله الله» وذكر خاصة الخاصة «هو هو»، ويمدح هذه الطريقة في الإحياء، ويشبه تصفية القلب بصقل أهل الروم حائطهم حتى انعكس فيه نقش أهل الصين؛ ويحتج آخرون بغار حراء وبأربعين موسى. ويحتاج هذا إلى عرضه من كتب الغزالي والصوفية أنفسهم.", en: "As Ibn Taymiyya reports: Abu Hamid al-Ghazali and his followers instruct the one in retreat not to go beyond the obligatory acts – no Qur'an reading or study of hadith – and to devote himself to remembrance, dividing remembrance into that of the common folk, 'There is no god but God', that of the elect, 'God, God', and that of the elect of the elect, 'He, He'; he praises the method in the Ihya' and likens purifying the heart to the Byzantines polishing their wall until the Chinese painters' work was reflected in it; others cite the cave of Hira and Moses' forty nights. This needs to be set out from al-Ghazali's and the Sufis' own books.", ur: "ابن تیمیہ کی نقل میں: ابو حامد غزالی اور ان کے پیروکار خلوت نشین کو ہدایت دیتے ہیں کہ فرض سے آگے نہ بڑھے – نہ قرآن پڑھے نہ حدیث دیکھے – اور ذکر میں لگا رہے؛ وہ ذکر کو عوام کے ذکر «لا الٰہ الا اللہ»، خواص کے ذکر «اللہ اللہ» اور خاص الخاص کے ذکر «ہو ہو» میں تقسیم کرتے ہیں؛ احیاء میں اس طریقے کی تعریف کرتے ہیں اور دل کی صفائی کو اہلِ روم کے اپنی دیوار صیقل کرنے سے تشبیہ دیتے ہیں یہاں تک کہ اس میں اہلِ چین کی نقاشی جھلکنے لگی؛ اور دوسرے غارِ حرا اور موسیٰ کی چالیس راتوں سے دلیل لیتے ہیں۔ اسے غزالی اور صوفیہ کی اپنی کتابوں سے پیش کرنا باقی ہے۔" }
