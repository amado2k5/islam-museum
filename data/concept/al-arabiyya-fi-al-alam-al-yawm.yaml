tags: [arabiyya-browser, arabiyya-world]
label:
  ar: "العربية في الأمم المتحدة واليونسكو وأعداد المتكلمين"
  en: "Arabic at the United Nations and UNESCO, and the speaker figures"
  ur: "اقوام متحدہ اور یونیسکو میں عربی اور بولنے والوں کے اعداد"
  fr: "L'arabe aux Nations unies et à l'UNESCO, et les chiffres de locuteurs"
  es: "El árabe en las Naciones Unidas y la UNESCO, y las cifras de hablantes"
summary:
  ar: "ما تقوله صفحتا الأمم المتحدة واليونسكو عن اليوم العالمي للغة العربية في 18 ديسمبر وعن قرار الجمعية العامة سنة 1973 الذي جعل العربية اللغة الرسمية السادسة، ثم أرقام المتكلمين كما وردت عند كل مصدر: أكثر من 400 مليون عند الأمم المتحدة في موضع وأكثر من 500 مليون في موضع آخر من الصفحة نفسها، وأكثر من 400 مليون عند اليونسكو، وأكثر من 200 مليون لغة أولى مع 250 مليوناً لغة ثانية عند دائرة المعارف البريطانية. ولا يختار المتحف رقماً."
  en: "What the United Nations and UNESCO pages say of World Arabic Language Day on 18 December and of the General Assembly decision of 1973 that made Arabic the sixth official language, then the speaker figures as each source gives them: more than 400 million in one place on the United Nations page and more than 500 million in another, more than 400 million at UNESCO, and over 200 million first-language speakers plus 250 million second-language speakers in the Encyclopaedia Britannica. The museum picks no figure."
  ur: "اقوام متحدہ اور یونیسکو کے صفحات 18 دسمبر کو عربی کے عالمی دن کے بارے میں اور جنرل اسمبلی کے 1973 کے فیصلے کے بارے میں کیا کہتے ہیں جس نے عربی کو چھٹی سرکاری زبان بنایا، پھر بولنے والوں کے اعداد جیسے ہر ماخذ دیتا ہے: اقوام متحدہ کے ہاں 400 اور 500 ملین سے زیادہ، یونیسکو کے ہاں 400 ملین سے زیادہ، برٹانیکا کے ہاں 200 ملین پہلی اور 250 ملین دوسری زبان۔ عجائب گھر کوئی عدد منتخب نہیں کرتا۔"
  fr: "Ce que disent les pages des Nations unies et de l'UNESCO sur la Journée mondiale de la langue arabe du 18 décembre et sur la décision de l'Assemblée générale de 1973 qui fit de l'arabe la sixième langue officielle, puis les chiffres de locuteurs de chaque source : plus de 400 et plus de 500 millions aux Nations unies, plus de 400 millions à l'UNESCO, plus de 200 millions de première langue et 250 millions de seconde langue dans la Britannica. Le musée ne retient aucun chiffre."
  es: "Lo que dicen las páginas de las Naciones Unidas y de la UNESCO sobre el Día Mundial de la Lengua Árabe del 18 de diciembre y sobre la decisión de la Asamblea General de 1973 que hizo del árabe el sexto idioma oficial, y luego las cifras de hablantes de cada fuente: más de 400 y más de 500 millones en las Naciones Unidas, más de 400 millones en la UNESCO, más de 200 millones de primera lengua y 250 de segunda en la Britannica. El museo no elige cifra."
