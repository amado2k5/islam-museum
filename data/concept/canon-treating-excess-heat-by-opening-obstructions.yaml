id: concept/canon-treating-excess-heat-by-opening-obstructions
class: concept
kind: scientific
label: { ar: "علاج فرط الحرارة بفتح السدد عند ابن سينا", en: "Treating excess heat by opening obstructions in the Canon", ur: "شدید گرمی کا علاج سدے کھول کر قانون میں", es: "Tratamiento del exceso de calor mediante la eliminación de obstrucciones en el cañón.", fr: "Traitement de la chaleur excessive par l'élimination des obstructions dans le canon", tr: "İbn Sina'ya göre barajın açılarak hipertermi tedavisi", id: "Pengobatan hipertermia dengan membuka bendungan menurut Ibn Sina" }
summary:
  ar: "يرى ابن سينا أن من عالج فرط الحرارة بتفتيح السدد ينبغي أن يتوقى التبريد المفرط لئلا يزيد السدة تحجراً، فيبدأ بما يجلو، ثم بمبرد جال كماء الشعير وماء الهندباء، ثم بالمعتدل، ثم بما فيه حرارة لطيفة، لأن نفع التفتيح أكثر من ضرر التسخين {cite:canon-ibn-sina-print-v1 p.272}."
  en: "Ibn Sina holds that whoever treats excess heat by opening obstructions should avoid excessive cooling, lest the blockage harden further, beginning with what cleanses, then a cooling cleanser such as barley water and chicory water, then a moderate remedy, then one with slight warmth, since the benefit of opening is greater than the harm of heating {cite:canon-ibn-sina-print-v1 p.272}."
  es: "Ibn Sina sostiene que quien trata el exceso de calor abriendo obstrucciones debe evitar el enfriamiento excesivo, para que el bloqueo no se endurezca aún más, comenzando con lo que limpia, luego un limpiador refrescante como agua de cebada y agua de achicoria, luego un remedio moderado, luego uno con un ligero calor, ya que el beneficio de abrir es mayor que el daño de calentar {cite:canon-ibn-sina-print-v1 p.272}."
  fr: "Ibn Sina soutient que celui qui traite la chaleur excessive en ouvrant les obstructions doit éviter un refroidissement excessif, de peur que le blocage ne durcisse davantage, en commençant par ce qui nettoie, puis un nettoyant rafraîchissant comme l'eau d'orge et l'eau de chicorée, puis un remède modéré, puis un remède avec une légère chaleur, puisque le bénéfice de l'ouverture est supérieur au mal du chauffage {cite:canon-ibn-sina-print-v1 p.272}."
  ur: "ابن سینا کا خیال ہے کہ جو بھی رکاوٹوں کو کھول کر زیادہ گرمی کا علاج کرتا ہے اسے ضرورت سے زیادہ ٹھنڈک سے بچنا چاہیے، ایسا نہ ہو کہ رکاوٹ مزید سخت ہو جائے، اس سے شروع ہو کر صاف ہو جائے، پھر ٹھنڈک صاف کرنے والا جیسے جو کا پانی اور چکوری کا پانی، پھر ایک اعتدال پسند علاج، پھر ہلکی گرمی کے ساتھ، کیونکہ کھولنے کا فائدہ گرم کرنے کے نقصانات سے زیادہ ہے۔ صفحہ 272}۔"
  tr: "İbn Sina, barajı hafifleterek hipertermiyi tedavi edenlerin, barajın sertleşmesini önlemek için aşırı soğutmadan kaçınmaları gerektiğine inanır. Önce yıkananlarla başlamalı, sonra arpa suyu ve karahindiba suyu gibi bir soğutucuyla, ardından orta derecede ve ardından hafif ısıyla kullanmalı, çünkü hafifletmenin faydası, ısıtmanın zararından daha fazladır {cite:canon-ibn-sina-print-v1 s.272}."
  id: "Ibn Sina percaya bahwa mereka yang mengobati hipertermia dengan menerangi bendungan harus menghindari pendinginan berlebihan untuk mencegah bendungan mengeras. Ia harus mulai dengan apa yang dicuci, lalu dengan pendingin seperti air jelai dan air dandelion, kemudian sedang, dan kemudian dengan panas lembut, karena manfaat petir lebih besar daripada bahaya pemanasan {cite:canon-ibn-sina-print-v1 hlm.272}."
