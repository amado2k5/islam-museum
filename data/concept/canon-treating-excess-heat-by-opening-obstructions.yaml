label: { ar: "علاج فرط الحرارة بفتح السدد عند ابن سينا", en: "Treating excess heat by opening obstructions in the Canon", ur: "شدید گرمی کا علاج سدے کھول کر قانون میں" }
summary:
  ar: "يرى ابن سينا أن من عالج فرط الحرارة بتفتيح السدد ينبغي أن يتوقى التبريد المفرط لئلا يزيد السدة تحجراً، فيبدأ بما يجلو، ثم بمبرد جال كماء الشعير وماء الهندباء، ثم بالمعتدل، ثم بما فيه حرارة لطيفة، لأن نفع التفتيح أكثر من ضرر التسخين {cite:canon-ibn-sina-print-v1 p.272}."
  en: "Ibn Sina holds that whoever treats excess heat by opening obstructions should avoid excessive cooling, lest the blockage harden further, beginning with what cleanses, then a cooling cleanser such as barley water and chicory water, then a moderate remedy, then one with slight warmth, since the benefit of opening is greater than the harm of heating {cite:canon-ibn-sina-print-v1 p.272}."
