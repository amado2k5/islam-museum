label: { ar: "هَوَام", en: "Hawam (creeping things: their sale, eating and killing)", es: "Hawam (criaturas que se arrastran: su venta, consumo y matanza)", fr: "Hawam (créatures rampantes: leur vente, leur consommation et leur mise à mort)", ur: "حوام ⁦(رینگنے والی چیزیں: ان کی فروخت، کھانا اور قتل)⁩", tr: "Hoam", id: "Hoam" }
summary:
  ar: "الهوام جمع هامة، وهي كل حيوان له سم يقتل، وقد يُطلق على ما لا يقتل كالحشرات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16571} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16572} واتفق الفقهاء في الجملة على أنه لا يصح بيع هوام الأرض التي لا منفعة فيها، فذهب الحنفية والشافعية والحنابلة إلى عدم انعقاد بيعها، وذهب المالكية إلى أن الهوام طاهرة، ويجوز بيع الطاهر المنتفع به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16572} وأجاز الشافعية والحنابلة بيع النحل، وأجازه المالكية، واشترط الشافعية أن يكون مقدور التسليم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16572} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16573} وأجاز بعض الفقهاء بيع دود القز وبذره قبل أن يدب لأنه طاهر يخرج منه الحرير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16573} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16574} وذهب جمهور الفقهاء إلى حرمة أكل الهوام، وأجاز المالكية أكل جميع أصناف الحشرات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16574} ويجوز قتلها في الجملة في غير الحرم وغير الإحرام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16574}"
  en: "Hawam is the plural of hamma, a creature with venom that kills, and sometimes used of harmless insects. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16571} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16572} The jurists agree in general that the sale of creeping things with no benefit is not valid: the Hanafis, Shafi'is and Hanbalis hold that their sale does not conclude, while the Malikis hold them pure, and the sale of anything pure and useful is valid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16572} The Shafi'is and Hanbalis permit the sale of bees, as do the Malikis, and the Shafi'is require that delivery be possible. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16572} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16573} Some jurists permit the sale of silkworms and their eggs before they move, since they are pure and yield silk. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16573} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16574} Most jurists forbid eating creeping things, while the Malikis allow all kinds of insects. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16574} Killing them is generally permitted outside the Sacred Precinct and for those not in ihram. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16574}"
  es: "Hawam es el plural de hamma, una criatura con veneno que mata, y a veces se usa para insectos inofensivos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16571} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16572} Los juristas están de acuerdo en general en que la venta de cosas que se arrastran sin beneficio no es válida: los Hanafis, Shafi'is y Hanbalis sostienen que su venta no concluye, mientras que los Malikis los consideran puros, y la venta de cualquier cosa pura y útil es válida. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16572} Los Shafi'is y Hanbalis permiten la venta de abejas, al igual que los Malikis, y los Shafi'is requieren que la entrega sea posible. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16572} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16573} Algunos juristas permiten la venta de gusanos de seda y sus huevos antes de que se muevan, ya que son puros y producen seda. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16573} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16574} La mayoría de los juristas prohíben comer cosas que se arrastran, mientras que los malikíes permiten todo tipo de insectos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16574} Matarlos generalmente está permitido fuera del Recinto Sagrado y para aquellos que no están en ihram. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16574}"
  fr: "Hawam est le pluriel de hamma, une créature venimeuse mortelle, et est parfois employé pour des insectes inoffensifs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16571} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16572} Les juristes s'accordent généralement à dire que la vente de créatures rampantes sans valeur marchande est invalide: les écoles hanafite, chaféite et hanbalite considèrent que la vente n'est pas conclue, tandis que les malikites la jugent valable, et la vente de toute chose pure et utile est valide. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16572} Les écoles chaféite et hanbalite autorisent la vente d'abeilles, de même que les malikites, et les chaféites exigent que la livraison soit possible. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16572} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16573} Certains juristes autorisent la vente des vers à soie et de leurs œufs avant leur déplacement, car ils sont purs et produisent de la soie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16573} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16574} La plupart des juristes interdisent la consommation d'insectes, tandis que les Malikites autorisent toutes sortes d'insectes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16574} Il est généralement permis de les tuer en dehors de l'enceinte sacrée et pour ceux qui ne sont pas en état d'ihram. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16574}"
  ur: "حوام ہما کی جمع ہے، زہر والی مخلوق جو مار دیتی ہے، اور بعض اوقات بے ضرر کیڑوں کا استعمال کرتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16571} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16572} فقہائے کرام کا اس بات پر اتفاق ہے کہ رینگنے والی چیزوں کو بغیر کسی فائدہ کے بیچنا جائز نہیں ہے: حنفیہ، شافعی، مالکی اور حنبلی اس پر متفق نہیں ہیں۔ وہ پاک ہیں، اور خالص اور مفید چیز کی فروخت جائز ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 16572} شافعی اور حنبلی شہد کی مکھیوں کی فروخت کی اجازت دیتے ہیں، جیسا کہ مالکیہ کرتے ہیں، اور شافعیہ کا تقاضا ہے کہ ترسیل ممکن ہو۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16572} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16573} بعض فقہاء ریشم کے کیڑے اور ان کے انڈوں کو منتقل کرنے سے پہلے فروخت کرنے کی اجازت دیتے ہیں، کیونکہ یہ خالص ہیں اور ریشم پیدا کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16573} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16574} اکثر فقہاء رینگنے والی چیزوں کو کھانے سے منع کرتے ہیں، جب کہ مالکی ہر قسم کے کیڑے مکوڑوں کی اجازت دیتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 16574} ان کا قتل عام طور پر حرم مقدس سے باہر اور احرام میں نہ ہونے والوں کے لیے جائز ہے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 صفحہ 16574}"
  tr: "'Hama' kelimesinin çoğulu ('Hama'), öldüren bir zehiri olan herhangi bir hayvanı ifade eder ve öldürülmeyen böcekler gibi şeyleri de ifade edebilir. {alıntı:fiqh-mawsua-kuveytiyya-noor-v3 s.16571} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16572} Hukukçular genel olarak, faydası olmayan toprakların alıçlarını satmanın geçerli olmadığı konusunda hemfikirdi. Hanefiler, Şafiiler ve Hanbaliler onları satmanın geçerli olmadığını, Malikiler ise tehlikelerin saf olduğunu ve bundan faydalanan saf olanı satılmasının caiz olduğunu savundular. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16572} Şafiiler ve Hanbaliler arı satışına izin verirken, Malikiler izin verirken, Şafiiler teslimatın mümkün olmasını şart koşmuştur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16572}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16573} Bazı hukukçular, saf oldukları ve ipek üreten ipekböcekleri ve tohumlarının çürümmeden önce satışına izin vermiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16573} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16574} Çoğu hukukçu böcek yemeyi yasak tutarken, Malikiler her türlü böceği yemeye izin vermiştir. {kaynak:fiqh-mawsua-kuwaitiyya-noor-v3 s.16574} ve kutsal ve devlet dışı İhram dışında bir cezada öldürülmesi caizdir. {kaynak:fiqh-mawsua-kuwaitiyya-noor-v3 s.16574}"
  id: "Jamak dari 'Hama' ('Hama') merujuk pada hewan yang memiliki racun yang membunuh, dan dapat merujuk pada yang tidak dibunuh, seperti serangga. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16571} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16572} Para ahli hukum umumnya sepakat bahwa tidak sah menjual tanah yang tidak memiliki manfaat. Hanafi, Shafi'i, dan Hanbal berpendapat bahwa penjualannya tidak sah, sementara Maliki berpendapat bahwa bahaya tersebut murni, dan diperbolehkan menjual yang murni yang mendapat manfaat darinya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16572} Shafi'i dan Hanbal mengizinkan penjualan lebah, sementara Maliki mengizinkannya, dan Shafi'i menetapkan bahwa pengiriman dapat dilakukan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16572} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.16573} Beberapa ahli hukum mengizinkan menjual ulat sutra dan bijinya sebelum membusuk, karena mereka murni dan menghasilkan sutra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16573} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16574} Mayoritas ahli hukum berpendapat bahwa memakan serangga dilarang, sementara Maliki mengizinkan makan semua jenis serangga. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16574} dan diperbolehkan membunuhnya dalam kalimat di luar negara suci dan non-negara ihram. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16574}"
