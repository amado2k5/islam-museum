label: { ar: "هَوَام", en: "Hawam (creeping things: their sale, eating and killing)" }
summary:
  ar: "الهوام جمع هامة، وهي كل حيوان له سم يقتل، وقد يُطلق على ما لا يقتل كالحشرات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16571} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16572} واتفق الفقهاء في الجملة على أنه لا يصح بيع هوام الأرض التي لا منفعة فيها، فذهب الحنفية والشافعية والحنابلة إلى عدم انعقاد بيعها، وذهب المالكية إلى أن الهوام طاهرة، ويجوز بيع الطاهر المنتفع به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16572} وأجاز الشافعية والحنابلة بيع النحل، وأجازه المالكية، واشترط الشافعية أن يكون مقدور التسليم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16572} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16573} وأجاز بعض الفقهاء بيع دود القز وبذره قبل أن يدب لأنه طاهر يخرج منه الحرير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16573} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16574} وذهب جمهور الفقهاء إلى حرمة أكل الهوام، وأجاز المالكية أكل جميع أصناف الحشرات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16574} ويجوز قتلها في الجملة في غير الحرم وغير الإحرام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16574}"
  en: "Hawam is the plural of hamma, a creature with venom that kills, and sometimes used of harmless insects. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16571} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16572} The jurists agree in general that the sale of creeping things with no benefit is not valid: the Hanafis, Shafi'is and Hanbalis hold that their sale does not conclude, while the Malikis hold them pure, and the sale of anything pure and useful is valid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16572} The Shafi'is and Hanbalis permit the sale of bees, as do the Malikis, and the Shafi'is require that delivery be possible. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16572} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16573} Some jurists permit the sale of silkworms and their eggs before they move, since they are pure and yield silk. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16573} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16574} Most jurists forbid eating creeping things, while the Malikis allow all kinds of insects. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16574} Killing them is generally permitted outside the Sacred Precinct and for those not in ihram. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16574}"
