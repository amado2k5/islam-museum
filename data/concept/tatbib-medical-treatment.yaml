summary:
  ar: "التطبيب المداواة. تعلم الطب فرض كفاية، ومزاولته مباحة، وقد تكون مندوبة بنية التأسي أو نفع المسلمين، وواجبة إن تعين الطبيب. ويجوز للطبيب النظر إلى موضع المرض للحاجة بقدرها، ويشترط الشافعية والحنابلة حضور محرم إن كان الطبيب أجنبياً. وتجوز الإجارة على العلاج بمدة لا بالبرء، ولا يصح اشتراط الدواء على الطبيب عند الحنابلة، وتجوز المشارطة على البرء عند ابن قدامة جعالة. ويضمن الطبيب ما تلف بجهل أو تقصير أو بلا إذن، ولا يضمن إن كان حاذقاً مأذوناً ولم يجاوز المعتاد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5299} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5300} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5301} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5302} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5303} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5304}"
  en: "Tatbib is medical treatment. Learning medicine is a communal duty, practising it is lawful, and it may be recommended by intention to follow the Prophet or to benefit Muslims, or obligatory where one physician is specifically needed. A physician may look at the place of illness as far as needed. The Shafiis and Hanbalis require a chaperone when the physician is a stranger to the woman patient. Hiring a physician is lawful for a term, not for the cure; the Hanbalis forbid making the medicine a condition, and Ibn Qudama allows a cure fee as a reward rather than a hire. The physician owes compensation for harm caused by ignorance, negligence, or treatment without consent; he owes none if he is skilled, authorised, and does not exceed the usual. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5299} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5300} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5301} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5302} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5303} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5304}"
  es: "Tatbib es tratamiento médico. Aprender medicina es un deber comunitario, practicarla es lícito y puede recomendarse con la intención de seguir al Profeta o beneficiar a los musulmanes, o ser obligatorio cuando se necesita específicamente un médico. Un médico puede examinar el lugar de la enfermedad hasta donde sea necesario. Los shafiíes y los hanbalíes exigen un acompañante cuando el médico es un desconocido para la paciente. Contratar a un médico es lícito por un tiempo, no para la curación; los hanbalíes prohíben condicionar la medicina, e Ibn Qudama permite una tarifa por la curación como recompensa en lugar de un pago. El médico debe compensar los daños causados por ignorancia, negligencia o tratamiento sin consentimiento; no debe compensar si es hábil, está autorizado y no excede lo habitual. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5299} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5300} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5301} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5302} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5303} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5304}"
  fr: "Le Tatbib désigne les soins médicaux. L'apprentissage de la médecine est un devoir communautaire, sa pratique est licite, et elle peut être recommandée par souci de suivre le Prophète ou de servir les musulmans, ou obligatoire lorsqu'un médecin est spécifiquement requis. Un médecin peut examiner le lieu de la maladie dans la mesure nécessaire. Les écoles chaféite et hanbalite exigent la présence d'un chaperon lorsque le médecin est inconnu de la patiente. Il est licite d'engager un médecin pour une durée déterminée, non pour la guérison elle-même; les hanbalites interdisent de conditionner la guérison à cet usage, et Ibn Qudama autorise le versement d'honoraires de guérison à titre de rémunération plutôt que de salaire. Le médecin doit indemniser le patient pour tout préjudice causé par ignorance, négligence ou traitement sans consentement; il n'est pas tenu d'indemniser le médecin s'il est compétent, autorisé et n'excède pas la pratique habituelle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5299} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5300} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5301} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5302} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5303} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5304}"
  ur: "تتبع طبی علاج ہے۔ دوا سیکھنا ایک اجتماعی فریضہ ہے، اس پر عمل کرنا حلال ہے، اور اس کی سفارش نبی کی پیروی یا مسلمانوں کو فائدہ پہنچانے کی نیت سے کی جا سکتی ہے، یا جہاں ایک طبیب کی خاص ضرورت ہو۔ جہاں تک ضرورت ہو ایک معالج بیماری کی جگہ کو دیکھ سکتا ہے۔ شافعیوں اور حنبلیوں کے نزدیک جب طبیب عورت مریضہ کے لیے اجنبی ہو تو اس کی ضرورت ہوتی ہے۔ معالج کی خدمات ایک مدت کے لیے جائز ہے، علاج کے لیے نہیں۔ حنبلی طب کو شرط قرار دینے سے منع کرتے ہیں، اور ابن قدامہ علاج کی فیس کو اجرت کے بجائے اجر کے طور پر لینے کی اجازت دیتے ہیں۔ لاعلمی، لاپرواہی، یا رضامندی کے بغیر علاج کی وجہ سے ہونے والے نقصان کے لیے معالج پر معاوضہ واجب الادا ہے۔ اگر وہ ہنر مند، بااختیار، اور معمول سے زیادہ نہ ہو تو وہ کسی کا مقروض نہیں ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5299} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5300} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5301} صفحہ 5302} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص.5303} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5304}"
  tr: "Tıp, tedavidir. Tıbbı öğrenmek toplu bir yükümlülüktür ve uygulamak izinlidir. Müslümanlara örnek veya fayda sağlamak amacıyla önerilebilir ve bir doktor atanması zorunludur. Bir doktor hastalık bölgesine gerekli miktarda bakabilir ve Şafi'ler ile Hanbeliler, doktor mahram değilse mahramın bulunmasını ister. Kiralama, tedavi için bir süre için izin verilir, iyileşme için değil. Hanelilere göre, ilacın doktor tarafından ödenmesini zorunlu kılmak geçerli değildir. İbn Kudama'ya göre, şartlı tedavi ücreti karşılığında kabul edilebilir. Doktor, cehalet, ihmal veya izinsiz kaynaklı zararlardan sorumludur ve yetkili, yetkili ve olağan sınırı aşmadığı sürece sorumlu değildir. {kaynak:fiqh-mawsua-kuwaitiyya-noor-v3 s.5299} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5300} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5301} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5302}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5303}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5304}"
  id: "Pengobatan adalah pengobatan. Belajar kedokteran adalah kewajiban kolektif, dan praktiknya diperbolehkan. Dapat direkomendasikan dengan tujuan meniru atau bermanfaat bagi umat Islam, dan wajib jika dokter ditunjuk. Dokter dapat memeriksa lokasi penyakit untuk jumlah yang diperlukan, dan Shafi'i serta Hanbalis memerlukan keberadaan mahram jika dokter bukan mahram. Penyewaan diperbolehkan untuk pengobatan jangka waktu, bukan untuk pemulihan. Menurut Hanbali, mewajibkan obat dibayar oleh dokter tidak sah. Menurut Ibn Qudamah, diperbolehkan mengondisikan penyembuhan dengan biaya. Dokter bertanggung jawab atas kerusakan yang disebabkan oleh ketidaktahuan, kelalaian, atau tanpa izin, dan tidak bertanggung jawab jika dia terampil dan berwenang serta tidak melebihi batas biasa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5299} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5300} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5301} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5302} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5303} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5304}"
