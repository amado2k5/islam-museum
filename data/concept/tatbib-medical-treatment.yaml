  en: "Tatbib (medical treatment: the physician, his look, hire and liability)"
  ur: "تطبیب (علاج معالجہ: طبیب، اس کا دیکھنا، اجرت اور ضمان)"
summary:
  ar: "التطبيب المداواة. تعلم الطب فرض كفاية، ومزاولته مباحة، وقد تكون مندوبة بنية التأسي أو نفع المسلمين، وواجبة إن تعين الطبيب. ويجوز للطبيب النظر إلى موضع المرض للحاجة بقدرها، ويشترط الشافعية والحنابلة حضور محرم إن كان الطبيب أجنبياً. وتجوز الإجارة على العلاج بمدة لا بالبرء، ولا يصح اشتراط الدواء على الطبيب عند الحنابلة، وتجوز المشارطة على البرء عند ابن قدامة جعالة. ويضمن الطبيب ما تلف بجهل أو تقصير أو بلا إذن، ولا يضمن إن كان حاذقاً مأذوناً ولم يجاوز المعتاد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5299} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5300} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5301} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5302} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5303} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5304}"
  en: "Tatbib is medical treatment. Learning medicine is a communal duty, practising it is lawful, and it may be recommended by intention to follow the Prophet or to benefit Muslims, or obligatory where one physician is specifically needed. A physician may look at the place of illness as far as needed. The Shafiis and Hanbalis require a chaperone when the physician is a stranger to the woman patient. Hiring a physician is lawful for a term, not for the cure; the Hanbalis forbid making the medicine a condition, and Ibn Qudama allows a cure fee as a reward rather than a hire. The physician owes compensation for harm caused by ignorance, negligence, or treatment without consent; he owes none if he is skilled, authorised, and does not exceed the usual. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5299} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5300} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5301} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5302} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5303} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5304}"
