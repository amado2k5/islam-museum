id: concept/canon-basking-in-the-sun
class: concept
kind: scientific
label: { ar: "التضحي بالشمس عند ابن سينا", en: "Basking in the sun in the Canon", ur: "دھوپ سینکنا، قانون کے مطابق" }
summary:
  ar: "يقرر ابن سينا أن التضحي إلى الشمس الحارة، وخصوصا مع حركة شديدة كالسعي والعدو، يحلل الفضول بقوة ويعرق ويحلل أورام التربل والاستسقاء وينفع من الربو والصداع البارد المزمن، لكنه إذا طال كثف البدن وقشفه {cite:canon-ibn-sina-print-v1 p.142}."
  en: "Ibn Sina holds that basking in strong sun, above all with vigorous movement such as walking fast or running, dissolves superfluities powerfully, brings sweat, dissolves swellings of flabbiness and dropsy and helps asthma and chronic cold headache, but that if prolonged it thickens and parches the body {cite:canon-ibn-sina-print-v1 p.142}."
