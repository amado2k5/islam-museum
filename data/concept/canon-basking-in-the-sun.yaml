id: concept/canon-basking-in-the-sun
class: concept
kind: scientific
label:
  ar: "التضحي بالشمس عند ابن سينا"
  en: "Basking in the sun in the Canon"
  fr: "Exposition au soleil dans le Canon"
  ur: "دھوپ سینکنا، قانون کے مطابق"
  es: "Tomando el sol en el Canon"
  tr: "İbn Sina'ya göre güneş kurbanı"
  id: "Pengorbanan Matahari menurut Ibn Sina"
summary:
  ar: "يقرر ابن سينا أن التضحي إلى الشمس الحارة، وخصوصا مع حركة شديدة كالسعي والعدو، يحلل الفضول بقوة ويعرق ويحلل أورام التربل والاستسقاء وينفع من الربو والصداع البارد المزمن، لكنه إذا طال كثف البدن وقشفه {cite:canon-ibn-sina-print-v1 p.142}."
  en: "Ibn Sina holds that basking in strong sun, above all with vigorous movement such as walking fast or running, dissolves superfluities powerfully, brings sweat, dissolves swellings of flabbiness and dropsy and helps asthma and chronic cold headache, but that if prolonged it thickens and parches the body {cite:canon-ibn-sina-print-v1 p.142}."
  fr: "Ibn Sina attribue à l’exposition au soleil intense, surtout avec marche rapide ou course, une forte résolution des excédents, la sueur, la résolution des gonflements flasques et hydropiques et un bénéfice contre asthme et céphalées froides chroniques ; prolongée, elle épaissirait et dessécherait le corps {cite:canon-ibn-sina-print-v1 p.142}."
  es: "Ibn Sina sostiene que tomar el sol fuerte, sobre todo con movimientos vigorosos como caminar rápido o correr, disuelve poderosamente las superfluidades, provoca sudoración, disuelve la hinchazón de la flacidez y la hidropesía y ayuda con el asma y el dolor de cabeza crónico por resfriado, pero que si se prolonga, espesa y reseca el cuerpo {cite:canon-ibn-sina-print-v1 p.142}."
  ur: "ابن سینا کا خیال ہے کہ تیز دھوپ میں ٹہلنا، سب سے بڑھ کر تیز چلنے یا دوڑنے جیسی تیز رفتار حرکت کے ساتھ، ضرورت سے زیادہ چیزوں کو طاقت کے ساتھ گھلاتا ہے، پسینہ لاتا ہے، سوجن اور جلن کی سوجن کو گھلاتا ہے اور دمہ اور دائمی نزلہ سر درد میں مدد کرتا ہے، لیکن اگر یہ زیادہ دیر تک رہے تو جسم کو گاڑھا اور خشک کرتا ہے۔"
  tr: "İbn Sina, özellikle yoğun hareketlerle, örneğin çaba gösterme ve koşma gibi sıcak güneşe fedakarlık yapmanın merakı güçlü şekilde erittiğini, terlediğini ve tüberküloz ile asit tümörlerini tedavi ettiğini, astım ve kronik soğuk algınlığı baş ağrılarında faydalı olduğunu, ancak uzun sürerse vücudu kalınlaştırdığını ve şiddetlendirdiğini belirtir {cite:canon-ibn-sina-print-v1 s.142}."
  id: "Ibn Sina menyatakan bahwa berkorban pada terik matahari, terutama dengan gerakan intens seperti berjuang dan berlari, sangat melarutkan rasa ingin tahu, keringat, dan mengobati tumor tuberkulosis serta ascites, serta bermanfaat untuk asma dan sakit kepala flu kronis, tetapi jika berkepanjangan, tubuh menjadi lebih tebal dan memperburuk {cite:canon-ibn-sina-print-v1 hlm.142}."
