summary:
  ar: ينفع من قطع الروائح الكريهة من المأكولات مضغ أوراق من هذا الجنس والمضمضة بعدها بخل من هذا الجنس واستعمال الطيبة من هذا الجنس في الفم ⁦(الأسماء مطروحة)⁩ {cite:canon-ibn-sina-print-v2 p.264}
  en: 'What profits in cutting the foul smells of foods is chewing leaves of this kind, rinsing after them with a vinegar of this kind, and using the aromatics of this kind in the mouth (the names left out) {cite:canon-ibn-sina-print-v2 p.264}'
  ur: 'کھائی چیزوں کی بُو دور کرنے میں اسی جنس کے پتے چبانا اور ان کے بعد اسی جنس کے سرکہ سے مضمضہ اور منہ میں اسی جنس کی خوشبو دار چیزیں رکھنا نفع دیتا ہے ⁦(نام مطروح)⁩ {cite:canon-ibn-sina-print-v2 p.264}'
