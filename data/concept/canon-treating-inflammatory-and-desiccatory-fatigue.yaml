id: concept/canon-treating-inflammatory-and-desiccatory-fatigue
class: concept
kind: scientific
label: { ar: "علاج الإعياء الورمي والقشفي عند ابن سينا", en: "Treating inflammatory and desiccatory fatigue in the Canon", ur: "ورمی اور خشکی کی تھکن کا علاج قانون میں", es: "Tratamiento de la fatiga inflamatoria y desecante en el Canon", fr: "Traitement de la fatigue inflammatoire et de la dessiccation dans le Canon" }
summary:
  ar: "يضع ابن سينا للإعياء الورمي ثلاثة أغراض هي إرخاء ما تمدد وتبريد ما سخن واستفراغ الفضل، ويجعل القشفي على تدبير الأصحاء مع ماء حمام أسخن، ثم يصف رياضة الاسترداد والانزجاج في الماء البارد {cite:canon-ibn-sina-print-v1 p.245}."
  en: "For inflammatory fatigue Ibn Sina sets three aims, to relax what is stretched, cool what has heated and evacuate the excess, and he puts the desiccatory kind on the healthy regimen with warmer bath water, then describes restorative exercise and a plunge into cold water {cite:canon-ibn-sina-print-v1 p.245}."
  es: "Para la fatiga inflamatoria, Ibn Sina establece tres objetivos: relajar lo que está estirado, enfriar lo que se ha calentado y evacuar el exceso. Para el tipo desecante, lo incluye en un régimen saludable con agua de baño más tibia, y luego describe ejercicios restaurativos y una inmersión en agua fría {cite:canon-ibn-sina-print-v1 p.245}."
  fr: "Pour la fatigue inflammatoire, Ibn Sina fixe trois objectifs: détendre ce qui est étiré, refroidir ce qui est chauffé et évacuer l'excès. Il met la fatigue inflammatoire au régime sain avec un bain d'eau plus chaude, puis décrit des exercices réparateurs et un plongeon dans l'eau froide {cite:canon-ibn-sina-print-v1 p.245}."
  ur: "اشتعال انگیز تھکاوٹ کے لیے ابن سینا نے تین مقاصد رکھے ہیں، جو کھینچا ہوا ہے اسے آرام کرنا، جس چیز کو گرم کیا ہے اسے ٹھنڈا کرنا اور اضافی کو نکالنا، اور اس نے گرم غسل کے پانی سے صحت بخش غذا کو صحت بخش غذا پر ڈالا، پھر بحال کرنے والی ورزش اور ٹھنڈے پانی میں چھلانگ لگانے کو بیان کیا۔"
