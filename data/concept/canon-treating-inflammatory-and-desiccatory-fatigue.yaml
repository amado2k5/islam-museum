summary:
  ar: "يضع ابن سينا للإعياء الورمي ثلاثة أغراض هي إرخاء ما تمدد وتبريد ما سخن واستفراغ الفضل، ويجعل القشفي على تدبير الأصحاء مع ماء حمام أسخن، ثم يصف رياضة الاسترداد والانزجاج في الماء البارد {cite:canon-ibn-sina-print-v1 p.245}."
  en: "For inflammatory fatigue Ibn Sina sets three aims, to relax what is stretched, cool what has heated and evacuate the excess, and he puts the desiccatory kind on the healthy regimen with warmer bath water, then describes restorative exercise and a plunge into cold water {cite:canon-ibn-sina-print-v1 p.245}."
