label: { ar: "الأنوثة", en: "Unutha (femininity; the honour of the female in Islam, her rights and duties, and the rules that apply to her)" }
summary:
  ar: "الأنوثة خلاف الذكورة، والأنثى خلاف الذكر، وتعرف بعلامات حسية كالحيض وأخرى معنوية كالطباع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3568} وأبطل الإسلام عادة الجاهلية في استقبال الأنثى بالكراهة ووأدها، فجعل حق الوجود والحياة لكل إنسان ذكرا كان أو أنثى، وأوجب العقيقة عن البنت كما عن الابن، وسنّ حسن التسمية والكنية لها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3569}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3570} وجعل للأنثى نصيبا في الميراث، ونهى عن تفضيل الذكر عليها في العطية والعناية، وأمر بتعليمها وإكرامها زوجة وأما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3570}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3571}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3572} ولها حقوق تتساوى فيها مع الرجل كالتعليم والتكليف والذمة المالية المستقلة، وحقوق تتقيد بطبيعتها كالتستر والاختلاط والعمل وحدوده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3572}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3573}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3574}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3583} ولها أحكام خاصة بسبب أنوثتها: كالحيض والحمل والنفاس، والعورة، والوضوء، والحمام، والصلاة، والحج، وإذن الزوج في التطوع، والولايات والشهادة، والنكاح، والديات، وزكاة الإبل والأضحية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3579}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3580}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3581}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3582}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3585}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3586}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3587}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3588}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3589}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3590}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3591}"
  en: "Unutha is the opposite of masculinity; the female is the opposite of the male, known by bodily signs such as menstruation and by moral traits. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3568} Islam abolished the pre-Islamic dislike of a girl and the burial of daughters, and recognised every human, male or female, as having the right to life; it prescribed the aqiqa for a girl as for a boy, and good naming and kunya for her. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3569}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3570} It gave her a share of inheritance, forbade preferring a son over a daughter in gifts and care, and enjoined honour to her as wife and mother. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3570}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3571}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3572} She shares with men in some rights such as learning, the obligations of religion and a separate financial personality, and some rights are limited by her nature, such as covering, avoiding mixing, and the bounds of work. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3572}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3573}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3574}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3583} Her nature brings special rules: menstruation, pregnancy and childbirth; her nakedness; ablution and touch; the bath house; prayer and hajj; her husband's leave for voluntary worship; guardianship, witnessing and marriage; blood money; and zakat and sacrifice of female animals. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3579}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3580}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3581}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3582}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3585}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3586}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3587}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3588}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3589}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3590}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3591}"
