label: { ar: "الأنوثة", en: "Unutha (femininity; the honour of the female in Islam, her rights and duties, and the rules that apply to her)", es: "Unutha (feminidad; el honor de la mujer en el Islam, sus derechos y deberes, y las normas que le son aplicables)", fr: "Unutha (féminité; l'honneur de la femme en Islam, ses droits et devoirs, et les règles qui lui sont applicables)", ur: "اونتھا ⁦(نسائیت؛ اسلام میں عورت کی عزت، اس کے حقوق اور فرائض، اور اس پر لاگو ہونے والے احکام)⁩", tr: "Kadınlık", id: "Feminitas" }
summary:
  ar: "الأنوثة خلاف الذكورة، والأنثى خلاف الذكر، وتعرف بعلامات حسية كالحيض وأخرى معنوية كالطباع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3568} وأبطل الإسلام عادة الجاهلية في استقبال الأنثى بالكراهة ووأدها، فجعل حق الوجود والحياة لكل إنسان ذكرا كان أو أنثى، وأوجب العقيقة عن البنت كما عن الابن، وسنّ حسن التسمية والكنية لها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3569}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3570} وجعل للأنثى نصيبا في الميراث، ونهى عن تفضيل الذكر عليها في العطية والعناية، وأمر بتعليمها وإكرامها زوجة وأما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3570}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3571}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3572} ولها حقوق تتساوى فيها مع الرجل كالتعليم والتكليف والذمة المالية المستقلة، وحقوق تتقيد بطبيعتها كالتستر والاختلاط والعمل وحدوده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3572}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3573}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3574}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3583} ولها أحكام خاصة بسبب أنوثتها: كالحيض والحمل والنفاس، والعورة، والوضوء، والحمام، والصلاة، والحج، وإذن الزوج في التطوع، والولايات والشهادة، والنكاح، والديات، وزكاة الإبل والأضحية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3579}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3580}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3581}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3582}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3585}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3586}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3587}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3588}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3589}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3590}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3591}"
  en: "Unutha is the opposite of masculinity; the female is the opposite of the male, known by bodily signs such as menstruation and by moral traits. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3568} Islam abolished the pre-Islamic dislike of a girl and the burial of daughters, and recognised every human, male or female, as having the right to life; it prescribed the aqiqa for a girl as for a boy, and good naming and kunya for her. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3569}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3570} It gave her a share of inheritance, forbade preferring a son over a daughter in gifts and care, and enjoined honour to her as wife and mother. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3570}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3571}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3572} She shares with men in some rights such as learning, the obligations of religion and a separate financial personality, and some rights are limited by her nature, such as covering, avoiding mixing, and the bounds of work. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3572}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3573}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3574}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3583} Her nature brings special rules: menstruation, pregnancy and childbirth; her nakedness; ablution and touch; the bath house; prayer and hajj; her husband's leave for voluntary worship; guardianship, witnessing and marriage; blood money; and zakat and sacrifice of female animals. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3579}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3580}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3581}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3582}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3585}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3586}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3587}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3588}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3589}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3590}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3591}"
  es: "Unutha es lo opuesto a la masculinidad; la mujer es lo opuesto al hombre, conocido por signos corporales como la menstruación y por rasgos morales. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3568} El Islam abolió la aversión preislámica hacia una niña y el entierro de hijas, y reconoció a todo ser humano, hombre o mujer, como con derecho a la vida; prescribió la aqiqa para una niña como para un niño, y buenos nombres y kunya para ella. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3569}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3570} Le dio una parte de la herencia, prohibió preferir a un hijo sobre una hija en regalos y cuidados, y le ordenó honrarla como esposa y madre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3570}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3571}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3572} Ella comparte con los hombres algunos derechos, como el aprendizaje, las obligaciones religiosas y una personalidad financiera separada, y algunos derechos están limitados por su naturaleza, como cubrirse, evitar mezclarse y los límites del trabajo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3572}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3573}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3574}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3583} Su naturaleza trae consigo reglas especiales: menstruación, embarazo y parto; su desnudez; ablución y contacto; la casa de baños; oración y hajj; permiso de su esposo para culto voluntario; tutela, testimonio y matrimonio; dinero de sangre; y zakat y sacrificio de animales hembra. {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3579}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3580}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3581}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3582}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3585}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3586}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3587}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3588}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3589}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3590}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3591}"
  fr: "L'Unutha est l'opposé de la masculinité; la femme est l'opposé de l'homme, reconnaissable à des signes corporels tels que les menstruations et à des traits moraux. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3568} L'islam a aboli la réprobation préislamique envers les filles et l'inhumation des filles, et a reconnu à chaque être humain, homme ou femme, le droit à la vie; il a prescrit l'aqiqa pour une fille comme pour un garçon, ainsi qu'un nom et une kunya appropriés. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3569}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3570} Il lui a accordé une part d'héritage, a interdit de préférer un fils à une fille en matière de cadeaux et de soins, et lui a prescrit l'honneur d'épouse et de mère. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3570}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3571}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3572} Elle partage avec les hommes certains droits tels que l'apprentissage, les obligations de la religion et une personnalité financière distincte, et certains droits sont limités par sa nature, comme le fait de se couvrir, d'éviter le mélange et les limites du travail. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3572}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3573}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3574}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3583} Sa nature impose des règles particulières: les menstruations, la grossesse et l’accouchement; sa nudité; les ablutions et le toucher; le bain public; la prière et le hajj; le congé de son mari pour le culte volontaire; la tutelle, le témoignage et le mariage; l’argent du sang; et la zakat et le sacrifice d’animaux femelles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3579}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3580}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3581}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3582}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3585}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3586}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3587}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3588}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3589}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3590}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3591}"
  ur: "Unutha مردانگی کے مخالف ہے؛ مادہ مرد کے برعکس ہے، جسے جسمانی علامات جیسے حیض اور اخلاقی خصلتوں سے جانا جاتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 3568} اسلام نے اسلام سے پہلے لڑکی کی ناپسندیدگی اور بیٹیوں کی تدفین کو ختم کر دیا اور ہر انسان، مرد ہو یا عورت کو زندگی کا حق تسلیم کیا۔ اس نے لڑکی کے لیے عقیقہ اسی طرح مقرر کیا جیسے لڑکے کے لیے اور اس کے لیے اچھا نام اور کنیت۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3569}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3570} اس نے اسے وراثت میں حصہ دیا، تحفے اور کفالت میں بیٹے کو بیٹی پر ترجیح دینے سے منع کیا، اور بیوی کے طور پر اس کی ماں اور عزت کا حکم دیا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3570}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3571}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3572} وہ مردوں کے ساتھ اشتراک کرتی ہے، کچھ مالیاتی حقوق اور مذہب کے علیحدہ علیحدہ حقوق جیسے کہ مالی حقوق سیکھنا۔ اس کی فطرت سے محدود ہیں، جیسے ڈھانپنا، اختلاط سے گریز کرنا، اور کام کی حدود۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.3572}{cite:fiqh-Mawsua-kuwaityya-noor-v3 p.3573}{cite:fiqh-mawsua-kuwaityya-noor-v3 p.3574}{cite:fiqh-mawsua-kuwaityya-noor-v3 p.3574}{cite:fiqh-mawsua-kuwatiyya-noor-v3 p.3574}{cite:fiqh-mawsua-kuwaitiy-noor-v3 p.3573} اس کی فطرت خاص اصول لاتی ہے: حیض، حمل اور ولادت؛ اس کی برہنگی؛ وضو اور لمس؛ غسل خانہ؛ نماز اور حج؛ اس کے شوہر کی رضاکارانہ عبادت کے لیے رخصت؛ سرپرستی، گواہی اور شادی؛ خون کی رقم؛ اور زکوٰۃ اور مادہ جانوروں کی قربانی۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3579}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3580}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ3581}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ3580 p.3582}{cite:fiqh-mawsua-kuwaityya-noor-v3 p.3585}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3586}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3587}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3587}{cite صفحہ 3588}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ3589}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3590}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3591}"
  tr: "Kadınlık erkeklikten farklıdır ve kadınsı erkeklikten farklıdır ve adet gibi duyusal işaretler ile mizaç gibi manevi işaretlerle bilinir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3568} İslam, İslam öncesi geleneği kaldırdı; kadınları isteksizce kabul edip öldürme geleneğini kaldırdı, her bireye, erkek ya da kadın, varoluş ve yaşam hakkı verdi, 'aqiqah'ı hem kızlar hem de oğullar için zorunlu hale getirdi ve onlara iyi isim ve kunya dayattı. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3569} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3570} Kadına miras payı verdi, erkeği hediye ve bakımda kendisinden üstün tutmayı yasakladı ve ona eş ve anne olarak eğitilip onurlandırılmasını emretti. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3570} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3571} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3572} ve erkeklerle eşit haklara sahiptir; eğitim, görev ve bağımsız mali sorumluluk gibi, ayrıca doğası gereği bağlı olan gizlenme, karışma, çalışma ve sınırları gibi haklara sahiptir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3572}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3573} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3574} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3583} ve kadınsı olduğu için özel hükümleri vardır: adet dönemi, hamilelik, doğum sonrası kanama, 'awrah, abdest alma, banyo, dua, hac, kocanın gönüllü izni, wilayah, tanıklık, evlilik, kan parası ve develer ile kurbanlar üzerine zekat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3579} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3580} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3581} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3582}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3585} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3586} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3587} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3588} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3589} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3590} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3591}"
  id: "Feminitas berbeda dengan maskulinitas, dan feminin berbeda dengan laki-laki, dan dikenal melalui tanda-tanda indera seperti menstruasi dan tanda spiritual seperti temperamen. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3568} Islam menghapus kebiasaan pra-Islam yang dengan enggan menerima perempuan dan membunuh mereka, memberikan hak untuk hidup dan hidup bagi setiap orang, laki-laki atau perempuan, menjadikan 'aqiqah wajib bagi anak perempuan maupun laki-laki, serta menetapkan penamaan dan kunya yang baik untuknya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3569} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3570} Ia memberikan bagian warisan, melarang perempuan memilih laki-laki daripada wanita dalam hadiah dan perawatan, serta memerintahkan agar ia dididik dan dihormati sebagai istri dan ibu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3570} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3571} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.3572} dan memiliki hak yang setara dengan laki-laki, seperti pendidikan, tugas, dan tanggung jawab keuangan mandiri, serta hak-hak yang secara inheren terikat oleh haknya, seperti menyembunyikan, mencampur, bekerja, dan batasannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3572} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3573} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3574} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3583} dan memiliki aturan khusus karena sifat femininnya: seperti menstruasi, kehamilan, pendarahan pasca melahirkan, 'awrah, wudhu, mandi, doa, ziarah, izin suami untuk sukarela, wilayah, kesaksian, pernikahan, uang darah, dan zakat atas unta dan korban. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3579} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3580} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3581} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3582} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3585} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3586} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3587} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3588} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3589} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3590} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3591}"
