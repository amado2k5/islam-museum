label:
  ar: "تدبير الصيف عند ابن سينا"
  en: "The regimen of summer in the Canon"
  fr: "Régime d’été dans le Canon"
  ur: "موسم گرما کی تدبیر قانون میں"
  es: "El régimen de verano en el Canon"
summary:
  ar: "في الصيف ينقص ابن سينا من الأغذية والأشربة والرياضة، ويلزم الهدوء والدعة والمطفئات، ويستعمل القيء لمن أمكنه، ويلزم الظل والكن {cite:canon-ibn-sina-print-v1 p.258}."
  en: "In summer Ibn Sina reduces food, drink and exercise, keeps to quiet and ease and to quenching things, uses vomiting for whoever can, and stays in shade and shelter {cite:canon-ibn-sina-print-v1 p.258}."
  fr: "En été, Ibn Sina réduit nourriture, boissons et exercice, privilégie calme, repos et rafraîchissants, emploie le vomissement chez qui le supporte et recherche ombre et abri {cite:canon-ibn-sina-print-v1 p.258}."
  es: "En verano, Ibn Sina reduce la comida, la bebida y el ejercicio, se mantiene tranquilo y relajado y se alimenta de cosas que calman la sed, utiliza el vómito para quien pueda y permanece a la sombra y resguardado {cite:canon-ibn-sina-print-v1 p.258}."
