summary:
  ar: "يبين ابن سينا أن البثور تعرض في أبدان الصبيان، فالقرحي الأسود منها قتال والأبيض أسلم وكذلك الأحمر، وربما كان في خروجها منافع، وعلاجها بالمجففات اللطيفة في ماء الغسل وبالمراهم عند التقرح {cite:canon-ibn-sina-print-v1 pp.216-217}."
  en: "Ibn Sina explains that pustules may come out on infants' bodies: the black ulcerous kind is deadly, the white safer and the red likewise, their coming out may bring benefit, and they are treated with gentle dryers in the washing water and with ointments when they ulcerate {cite:canon-ibn-sina-print-v1 pp.216-217}."
