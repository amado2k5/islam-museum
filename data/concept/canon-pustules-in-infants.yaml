id: concept/canon-pustules-in-infants
class: concept
kind: scientific
label:
  ar: "البثور عند الصبيان عند ابن سينا"
  en: "Pustules in infants in the Canon"
  fr: "Pustules du nourrisson dans le Canon"
  ur: "قانون میں بچوں کے جسم کے دانے"
  es: "Pústulas en lactantes en el Canon"
summary:
  ar: "يبين ابن سينا أن البثور تعرض في أبدان الصبيان، فالقرحي الأسود منها قتال والأبيض أسلم وكذلك الأحمر، وربما كان في خروجها منافع، وعلاجها بالمجففات اللطيفة في ماء الغسل وبالمراهم عند التقرح {cite:canon-ibn-sina-print-v1 pp.216-217}."
  en: "Ibn Sina explains that pustules may come out on infants' bodies: the black ulcerous kind is deadly, the white safer and the red likewise, their coming out may bring benefit, and they are treated with gentle dryers in the washing water and with ointments when they ulcerate {cite:canon-ibn-sina-print-v1 pp.216-217}."
  fr: "Ibn Sina décrit des pustules du nourrisson : noires et ulcéreuses, elles seraient mortelles ; blanches ou rouges, moins dangereuses. Leur éruption pourrait être bénéfique ; le livre décrit des desséchants doux dans l’eau de toilette et des onguents en cas d’ulcération {cite:canon-ibn-sina-print-v1 pp.216-217}."
  es: "Ibn Sina explica que pueden aparecer pústulas en el cuerpo de los bebés: las negras y ulcerosas son mortales, las blancas son más seguras y las rojas también, su aparición puede traer beneficios, y se tratan con secantes suaves en el agua del lavado y con ungüentos cuando se ulceran {cite:canon-ibn-sina-print-v1 pp.216-217}."
