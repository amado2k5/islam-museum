id: concept/canon-venesection-by-the-quality-of-the-blood
class: concept
kind: scientific
label: { ar: "الفصد بحسب حال الدم عند ابن سينا", en: "Venesection according to the state of the blood in the Canon", ur: "قانون میں خون کی حالت کے مطابق فصد" , fr: "La saignée selon la qualité du sang dans le Canon" }
summary:
  fr: "Ibn Sina met en garde contre la saignée en cas de plénitude due à des humeurs crues. Il l'autorise chez celui dont la bile noire prédomine s'il n'a pas subi d'évacuation par diarrhée, et explique comment saigner celui qui possède peu de bon sang mais beaucoup d'humeurs mauvaises : prélever un peu de sang, le nourrir, puis le saigner de nouveau {cite:canon-ibn-sina-print-v1 pp.290-291}."
  ar: "يحذر ابن سينا من الفصد على امتلاء ناشئ عن أخلاط نيئة، ويجيزه لمن غلبت عليه السوداء إذا لم يستفرغ بالإسهال، ويبين كيف يفصد من دمه المحمود قليل وفيه أخلاط رديئة كثيرة بأن يؤخذ الدم قليلاً ويغذى ثم يعاد {cite:canon-ibn-sina-print-v1 pp.290-291}."
  en: "Ibn Sina warns against bleeding on a fullness that comes from raw humours, allows it for one in whom black bile predominates if he has not been evacuated by diarrhoea, and explains how to bleed one whose good blood is little and whose body holds much bad humour, by taking a little blood, feeding him, and bleeding again {cite:canon-ibn-sina-print-v1 pp.290-291}."
