label: { ar: "الفصد بحسب حال الدم عند ابن سينا", en: "Venesection according to the state of the blood in the Canon", ur: "قانون میں خون کی حالت کے مطابق فصد", es: "La venesección según el estado de la sangre en el Canon", fr: "Saignée selon l'état du sang dans le canon" }
summary:
  ar: "يحذر ابن سينا من الفصد على امتلاء ناشئ عن أخلاط نيئة، ويجيزه لمن غلبت عليه السوداء إذا لم يستفرغ بالإسهال، ويبين كيف يفصد من دمه المحمود قليل وفيه أخلاط رديئة كثيرة بأن يؤخذ الدم قليلاً ويغذى ثم يعاد {cite:canon-ibn-sina-print-v1 pp.290-291}."
  en: "Ibn Sina warns against bleeding on a fullness that comes from raw humours, allows it for one in whom black bile predominates if he has not been evacuated by diarrhoea, and explains how to bleed one whose good blood is little and whose body holds much bad humour, by taking a little blood, feeding him, and bleeding again {cite:canon-ibn-sina-print-v1 pp.290-291}."
  es: "Ibn Sina advierte contra la sangría en una plenitud que proviene de humores crudos, la permite para aquel en quien predomina la bilis negra si no ha sido evacuado por diarrea, y explica cómo sangrar a aquel cuya buena sangre es escasa y cuyo cuerpo contiene mucho mal humor, tomando un poco de sangre, alimentándolo y sangrando de nuevo {cite:canon-ibn-sina-print-v1 pp.290-291}."
  fr: "Ibn Sina met en garde contre les saignées sur une plénitude qui provient d'humeurs brutes, les autorise pour celui chez qui la bile noire prédomine s'il n'a pas été évacué par la diarrhée, et explique comment saigner celui dont le bon sang est peu abondant et dont le corps contient beaucoup de mauvais sang, en prélevant un peu de sang, en le nourrissant, puis en saignant à nouveau {cite:canon-ibn-sina-print-v1 pp.290-291}."
