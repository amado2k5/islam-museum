id: concept/amd
class: concept
kind: legal
label:
  ar: "العَمْد"
  en: "Deliberate act (amd), as against error, and its rulings"
  fr: "L’acte délibéré (amd), par opposition à l’erreur, et ses qualifications juridiques"
  ur: "عمد ⁦(ارادی فعل)⁩"
  es: "Acto deliberado (amd), en contraposición al error, y sus resoluciones"
summary:
  ar: "العمد في اللغة قصد الشيء، وهو المقصود بالنية، ويقابله الخطأ، وهو الفعل الصادر بلا قصد {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11814}. وتترتب على العمد أحكام، فمن ترك ركناً من الصلاة عمداً أو تكلم فيها أو أكل بطلت صلاته، ومن أكل أو شرب أو جامع عمداً في الصوم أفطر بالإجماع {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11814} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11815}. والقتل العمد محرم بالإجماع، واختلف في قبول توبة القاتل، فقبلها جمهور الفقهاء، ومنع ذلك جماعة من السلف {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11815}. ومن تعمد قول كفر فقد ارتد، وإذا تعمد الطلاق وقع، ولا يقع الطلاق بلفظ زال معه العقل أو سبق اللسان إليه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11815} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11816}. وتعمد الكذب على النبي من الكبائر، واليمين الغموس من الكبائر، وتعمد الحنث في اليمين ينقسم إلى الأحكام الخمسة بحسب المحلوف عليه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11816} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11817}."
  en: "In the lexicon, amd is the purpose and intention of a thing, and its opposite is error (khata'), an act done without purpose {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11814}. Deliberate acts carry rulings: a deliberate omission of a pillar of prayer, or speech, or eating in it, voids the prayer; a deliberate eating, drinking or intercourse breaks the fast by agreement {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11814} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11815}. Deliberate homicide is forbidden by agreement; the majority accept the repentance of the killer, while some early scholars deny it {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11815}. A deliberate utterance of unbelief counts as apostasy; a divorce pronounced deliberately takes effect, while a slip of the tongue or a word said by one who has lost his reason does not {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11815} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11816}. Lying about the Prophet deliberately is among the gravest sins, and the false oath (yamin ghamus) is a major sin; breaking an oath deliberately may be obligatory, recommended, permitted, disliked or forbidden according to the matter sworn about {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11816} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11817}."
  fr: "Dans le lexique, amd désigne le dessein et l’intention ; son contraire est l’erreur (khata’), acte accompli sans intention {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11814}. Des règles s’appliquent aux actes délibérés : omettre un pilier de la prière, y parler ou y manger délibérément invalide la prière ; manger, boire ou avoir un rapport sexuel délibérément rompt le jeûne, de l’accord des juristes {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11814} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11815}. L’interdiction de l’homicide délibéré fait l’unanimité ; la majorité admet le repentir de son auteur, tandis que certains des premiers savants ne l’admettent pas {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11815}. Prononcer délibérément une parole d’incroyance constitue une apostasie ; le divorce prononcé délibérément prend effet, contrairement au lapsus ou à la parole d’une personne privée de raison {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11815} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11816}. Mentir délibérément au sujet du Prophète compte parmi les péchés les plus graves, et le faux serment (yamin ghamus) est un péché majeur. Rompre délibérément un serment peut être obligatoire, recommandé, permis, réprouvé ou interdit selon l’objet du serment {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11816} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11817}."
  es: "En el léxico, amd es el propósito y la intención de algo, y su opuesto es error (khata'), un acto hecho sin propósito {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11814}. Los actos deliberados conllevan dictámenes: una omisión deliberada de un pilar de la oración, o hablar, o comer en él, invalida la oración; comer, beber o tener relaciones sexuales deliberadamente rompe el ayuno por acuerdo {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11814} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11815}. El homicidio deliberado está prohibido por acuerdo; la mayoría acepta el arrepentimiento del asesino, mientras que algunos eruditos antiguos lo niegan {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11815}. Una declaración deliberada de incredulidad cuenta como apostasía; un divorcio pronunciado deliberadamente surte efecto, mientras que un desliz de la lengua o una palabra dicha por alguien que ha perdido la razón no {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11815} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11816}. Mentir deliberadamente sobre el Profeta se encuentra entre los pecados más graves, y el falso juramento (yamin ghamus) es un pecado mayor; romper un juramento deliberadamente puede ser obligatorio, recomendado, permitido, desaconsejable o prohibido según el asunto sobre el que se jura {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11816} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11817}."
