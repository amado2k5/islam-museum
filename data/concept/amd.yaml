label:
  ar: "العَمْد"
  en: "Deliberate act (amd), as against error, and its rulings"
  ur: "عمد (ارادی فعل)"
summary:
  ar: "العمد في اللغة قصد الشيء، وهو المقصود بالنية، ويقابله الخطأ، وهو الفعل الصادر بلا قصد {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11814}. وتترتب على العمد أحكام، فمن ترك ركناً من الصلاة عمداً أو تكلم فيها أو أكل بطلت صلاته، ومن أكل أو شرب أو جامع عمداً في الصوم أفطر بالإجماع {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11814} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11815}. والقتل العمد محرم بالإجماع، واختلف في قبول توبة القاتل، فقبلها جمهور الفقهاء، ومنع ذلك جماعة من السلف {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11815}. ومن تعمد قول كفر فقد ارتد، وإذا تعمد الطلاق وقع، ولا يقع الطلاق بلفظ زال معه العقل أو سبق اللسان إليه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11815} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11816}. وتعمد الكذب على النبي من الكبائر، واليمين الغموس من الكبائر، وتعمد الحنث في اليمين ينقسم إلى الأحكام الخمسة بحسب المحلوف عليه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11816} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11817}."
  en: "In the lexicon, amd is the purpose and intention of a thing, and its opposite is error (khata'), an act done without purpose {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11814}. Deliberate acts carry rulings: a deliberate omission of a pillar of prayer, or speech, or eating in it, voids the prayer; a deliberate eating, drinking or intercourse breaks the fast by agreement {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11814} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11815}. Deliberate homicide is forbidden by agreement; the majority accept the repentance of the killer, while some early scholars deny it {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11815}. A deliberate utterance of unbelief counts as apostasy; a divorce pronounced deliberately takes effect, while a slip of the tongue or a word said by one who has lost his reason does not {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11815} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11816}. Lying about the Prophet deliberately is among the gravest sins, and the false oath (yamin ghamus) is a major sin; breaking an oath deliberately may be obligatory, recommended, permitted, disliked or forbidden according to the matter sworn about {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11816} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11817}."
