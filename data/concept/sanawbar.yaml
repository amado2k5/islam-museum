summary:
  ar: "الصنوبر في الكتاب شجرة معروفة، ويتناول الكتاب هنا سائر أجزائها غير حبها الذي ذكر في حرف الحاء، لحاؤه نافع من القروح الحرفية ومدمل، وحبه ينفع من السعال العتيق ويحبس البطن، ودخانه نافع للعين، والدود الأخضر الذي فيه في طبع الذراريح {cite:canon-ibn-sina-print-v1 640}"
  en: "Sanawbar is in the book a well-known tree, and the book here treats its other parts, apart from its nut, which was spoken of under the letter ha; its bark benefits corrosive ulcers and heals, its nut benefits old cough and binds the bowels, its smoke benefits the eye, and the green worm in it is of the nature of cantharides {cite:canon-ibn-sina-print-v1 640}"
  ur: "صنوبر کتاب میں معروف درخت ہے، اور کتاب یہاں اس کے باقی حصوں کا ذکر کرتی ہے، سوائے اس کے دانے کے جو حرف حاء میں آ چکا ہے؛ اس کی چھال حرفی زخموں میں نافع اور زخم بھرنے والی ہے، اس کا دانہ پرانی کھانسی میں نافع ہے اور پیٹ کو روکتا ہے، اس کا دھواں آنکھ کے لیے نافع ہے، اور اس میں رہنے والا ہرا کیڑا ذراریح کی طبیعت کا ہے {cite:canon-ibn-sina-print-v1 640}۔"
  es: "En el libro, Sanawbar es un árbol muy conocido, y aquí se tratan sus otras partes, aparte de su nuez, de la que se habló bajo la letra ha; su corteza beneficia las úlceras corrosivas y las cura, su nuez beneficia la tos crónica y ayuda a los intestinos, su humo beneficia la vista, y el gusano verde que contiene es de la naturaleza de los cantáridas {cite:canon-ibn-sina-print-v1 640}."
