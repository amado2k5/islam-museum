label: { ar: "الحالة الاقتصادية في العرب قبل الإسلام", en: "The economic condition of the Arabs before Islam", es: "La situación económica de los árabes antes del Islam.", fr: "La situation économique des Arabes avant l'islam", ur: "اسلام سے پہلے عربوں کی معاشی حالت" }
summary:
  ar: "في عرض الرحيق المختوم تبعت الحالة الاقتصادية الحالة الاجتماعية: التجارة أكبر وسيلة للحصول على حوائج الحياة ولا تتيسر إلا بالأمن المفقود إلا في الأشهر الحرم، وفيها كانت تُعقد أسواق عكاظ وذي المجاز ومجنة؛ الصناعات من الحياكة والدباغة في أهل اليمن والحيرة ومشارف الشام، وفي داخل الجزيرة الزراعة واقتناء الأنعام وغزل النساء، والأمتعة عرضة للحروب، والفقر والجوع والعري عام."
  en: "In al-Raheeq al-Makhtum's account the economy followed the social condition: trade was the chief means of livelihood and needed a security found only in the sacred months, when the fairs of Ukaz, Dhu al-Majaz and Majanna were held; crafts such as weaving and tanning belonged to Yemen, al-Hira and the Syrian marches, while the interior had farming, herding and women's spinning, goods were prey to war, and poverty, hunger and nakedness were general."
  es: "Según el relato de al-Raheeq al-Makhtum, la economía seguía el curso de la situación social: el comercio era el principal medio de subsistencia y requería una seguridad que solo se encontraba en los meses sagrados, cuando se celebraban las ferias de Ukaz, Dhu al-Majaz y Majanna; oficios como el tejido y el curtido pertenecían a Yemen, al-Hira y las marcas sirias, mientras que en el interior predominaban la agricultura, la ganadería y el hilado femenino; las mercancías eran presa de la guerra, y la pobreza, el hambre y la desnudez eran generalizadas."
  fr: "D'après al-Raheeq al-Makhtum, l'économie suivait la condition sociale: le commerce était le principal moyen de subsistance et nécessitait une sécurité que l'on ne trouvait que pendant les mois sacrés, lorsque se tenaient les foires d'Ukaz, de Dhu al-Majaz et de Majanna; des artisanats tels que le tissage et le tannage appartenaient au Yémen, à al-Hira et aux marches syriennes, tandis que l'intérieur des terres pratiquait l'agriculture, l'élevage et le filage féminin, les marchandises étaient la proie de la guerre et la pauvreté, la faim et la nudité étaient générales."
  ur: "الرحیق المختم کے بیان میں معیشت سماجی حالت کی پیروی کرتی تھی: تجارت معاش کا سب سے بڑا ذریعہ تھا اور اسے صرف مقدس مہینوں میں تحفظ کی ضرورت تھی، جب عکاز، ذی المجاز اور مجنا کے میلے منعقد ہوتے تھے۔ بُنائی اور ٹیننگ جیسے دستکاری کا تعلق یمن، الحیرہ اور شامی مارچوں سے تھا، جب کہ اندرونی حصے میں کھیتی باڑی، گلہ بانی اور عورتوں کی کتائی تھی، سامان جنگ کا شکار تھا، اور غربت، بھوک اور برہنگی عام تھی۔"
