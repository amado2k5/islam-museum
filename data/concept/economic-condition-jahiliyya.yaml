summary:
  ar: "في عرض الرحيق المختوم تبعت الحالة الاقتصادية الحالة الاجتماعية: التجارة أكبر وسيلة للحصول على حوائج الحياة ولا تتيسر إلا بالأمن المفقود إلا في الأشهر الحرم، وفيها كانت تُعقد أسواق عكاظ وذي المجاز ومجنة؛ الصناعات من الحياكة والدباغة في أهل اليمن والحيرة ومشارف الشام، وفي داخل الجزيرة الزراعة واقتناء الأنعام وغزل النساء، والأمتعة عرضة للحروب، والفقر والجوع والعري عام."
  en: "In al-Raheeq al-Makhtum's account the economy followed the social condition: trade was the chief means of livelihood and needed a security found only in the sacred months, when the fairs of Ukaz, Dhu al-Majaz and Majanna were held; crafts such as weaving and tanning belonged to Yemen, al-Hira and the Syrian marches, while the interior had farming, herding and women's spinning, goods were prey to war, and poverty, hunger and nakedness were general."
