id: concept/awwal-ma-yuhasab
class: concept
kind: belief
label:
  ar: "أول ما يحاسب عليه العبد"
  en: "The first thing the servant is asked about"
  ur: "بندے سے پہلا سوال"
summary:
  ar: "أول ما يحاسب به العبد يوم القيامة من عمله صلاته؛ إن صلحت فقد أفلح وأنجح، وإن فسدت فقد خاب وخسر. ولا تزول قدما عبد يوم القيامة حتى يُسأل عن أربع {cite:jami-al-tirmidhi} {cite:sahih-muslim}."
  en: "The first thing the servant is reckoned for on the Day is his prayer; if it is sound he has succeeded, and if it is spoiled he is lost. And a servant's feet do not move until he is asked about four {cite:jami-al-tirmidhi} {cite:sahih-muslim}."
  ur: "قیامت کے دن بندے کے اعمال میں سب سے پہلے نماز کا حساب ہوگا؛ اگر درست ہوئی تو کامیاب، بگڑی تو ناکام۔ اور بندے کے قدم اس وقت تک نہ ہٹیں گے جب تک چار باتوں کا سوال نہ ہو {cite:jami-al-tirmidhi} {cite:sahih-muslim}۔"
