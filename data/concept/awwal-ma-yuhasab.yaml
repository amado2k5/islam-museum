id: concept/awwal-ma-yuhasab
class: concept
kind: belief
label:
  ar: "أول ما يحاسب عليه العبد"
  en: "The first thing the servant is asked about"
  fr: "La première chose sur laquelle le serviteur est interrogé"
  ur: "بندے سے پہلا سوال"
  es: "Lo primero que se le pregunta al sirviente es:"
  tr: "Kölenin ilk olarak hesap vereceği şey"
  id: "Hal pertama yang harus dipertanggungjawabkan oleh budak"
summary:
  ar: "أول ما يحاسب به العبد يوم القيامة من عمله صلاته؛ إن صلحت فقد أفلح وأنجح، وإن فسدت فقد خاب وخسر. ولا تزول قدما عبد يوم القيامة حتى يُسأل عن أربع {cite:jami-al-tirmidhi} {cite:sahih-muslim}."
  en: "The first thing the servant is reckoned for on the Day is his prayer; if it is sound he has succeeded, and if it is spoiled he is lost. And a servant's feet do not move until he is asked about four {cite:jami-al-tirmidhi} {cite:sahih-muslim}."
  fr: "Le Jour du jugement, le premier acte du serviteur dont il est demandé compte est sa prière ; si elle est bonne, il a réussi, et si elle est corrompue, il est perdu. Les pieds du serviteur ne bougent pas avant qu’il soit interrogé sur quatre choses {cite:jami-al-tirmidhi} {cite:sahih-muslim}."
  ur: "قیامت کے دن بندے کے اعمال میں سب سے پہلے نماز کا حساب ہوگا؛ اگر درست ہوئی تو کامیاب، بگڑی تو ناکام۔ اور بندے کے قدم اس وقت تک نہ ہٹیں گے جب تک چار باتوں کا سوال نہ ہو {cite:jami-al-tirmidhi} {cite:sahih-muslim}۔"
  es: "Lo primero que se le pide al siervo en el Día es su oración; si es buena, ha tenido éxito, y si es mala, está perdido. Y los pies del siervo no se mueven hasta que se le pregunta acerca de cuatro {cite:jami-al-tirmidhi} {cite:sahih-muslim}."
  tr: "Kıyamet Günü'nde bir hizmetlinin yaptığı işlerden ilk sorumluluğu duasıdır; iyi bir şeyse, başarılı olmuştur ve başarıya ulaşmıştır, yozlaşmışsa başarısız ve kaybetmiştir. Kıyamet gününde bir hizmetlinin ayakları hareket etmez, ta ki kendisine dört {cite:jami-al-tirmidhi} {cite:sahih-muslim} hakkında sorulan sürece hareket etmez."
  id: "Hal pertama yang akan dipertanggungjawabkan seorang hamba pada Hari Penghakiman atas perbuatannya adalah doanya; jika baik, ia telah berhasil dan berhasil, dan jika berhasil, ia telah gagal dan kalah. Kaki seorang hamba tidak akan bergerak pada Hari Penghakiman sampai ia ditanya tentang empat {cite:jami-al-tirmidhi} {cite:sahih-muslim}."
