id: concept/mufaraqa
class: concept
kind: legal
label:
  ar: المُفَارَقَة
  en: Leaving the congregation mid-prayer (mufaraqa)
  ur: مفارقت (جماعت سے الگ ہونا)
summary:
  ar: "المفارقة في اللغة الفراق والمباينة، والاصطلاح عند الفقهاء لا يخرج عنها، وهي في الصلاة أن ينفرد المأموم عن إمامه أو يترك أحد المصلين صلاة الجماعة. والمفارقة بغير عذر ممتنعة عند الحنفية والمالكية والحنابلة، وعند الشافعية في القديم، ولو فعلها بطلت الصلاة عند بعضهم. وتجوز بعذر عند الجمهور كطول الإمام، وتجب عند الاختلاف في القبلة، وعند تلبس الإمام بما يبطل صلاته، كالحدث والنجاسة والسكر، وعند زيادة ركعة. وفي الجمعة يجيز الشافعية والحنابلة المفارقة في الركعة الثانية. وتتناول المادة كذلك صلاة الجمعة والقصر والإفطار للمسافر، وصلاة الخوف، وخيار المجلس في البيع وأثر المفارقة في لزوم العقد، وتستمر بعد صفحة 14817. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14805} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14806} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14807} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14808} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14809} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14810} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14811}"
  en: "Mufaraqa means separation. In prayer it is the follower's leaving his imam, or a worshipper's leaving the congregation. Without an excuse it is forbidden according to the Hanafis, Malikis and Hanbalis and the older Shafi'i view, and some hold that it voids the prayer. Most jurists allow it with an excuse, such as an imam who recites too long. It becomes obligatory when the imam faces the wrong direction for prayer, or when the imam does something that voids his prayer such as impurity, loss of ritual purity or drunkenness, or when he rises to a fifth rak'a. The Shafi'is and Hanbalis allow leaving at the second rak'a of the Friday prayer.  {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14805} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14806} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14807} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14808} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14809} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14810} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14811}"
  ur: "مفارقت کے لغوی معنی جدائی ہیں۔ نماز میں اس سے مراد مقتدی کا امام سے الگ ہونا ہے۔ بغیر عذر کے حنفیہ، مالکیہ اور حنابلہ کے نزدیک ممنوع ہے، جب کہ بعض کے نزدیک اس سے نماز باطل ہو جاتی ہے۔ جمہور عذر کے ساتھ جائز مانتے ہیں، اور امام کی کسی ایسی حالت میں واجب ہو جاتی ہے جو اس کی نماز کو باطل کرتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14805} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14807} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14809} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14811}"
