id: concept/thabit-wa-mutaghayyir
class: concept
kind: term
label:
  ar: "الثابت والمتغير في الشريعة الإسلامية"
  en: "The fixed and the changeable in Islamic law"
issue:
  ar: "أي أحكام الشريعة لا تتبدل، وأيها تتغير الفتوى فيه بتغير الأحوال؟"
summary:
  ar: "تقسيم يعرضه عباس شومان نقلا عما اتفق عليه العلماء: أحكام ثابتة لا تتغير، كفرض الصلوات وأعدادها وأوقاتها، والزكاة والصيام والحج، وتحريم القتل والزنا والخمر والسرقة؛ وهي القليل من الفقه، وتسمى مسائل الأصول. وأحكام الفروع التي لم ينص فيها الشرع على حكم قطعي تتغير الفتوى فيها بتغير الزمان والمكان والأحوال والأشخاص. ويذكر الكاتب أن بعض الفروع نص عليها بنصوص ظنية الدلالة تحتمل أكثر من تأويل، وأن النوازل الحديثة كالاستنساخ ونقل الأعضاء لم تتناولها النصوص أصلا. {cite:nazarat-fi-al-tajdid-azhar p. 11} {cite:nazarat-fi-al-tajdid-azhar p. 10}"
  en: "Shouman sets out the classical split: fixed rulings (the pillars of worship, the prohibited capital and property crimes) that do not change, and branch rulings with no decisive text, where the verdict may change with time, place, circumstance and person. He notes that some branch rulings rest on texts open to more than one reading, and that modern questions such as cloning and organ transplant are not addressed by texts at all."
