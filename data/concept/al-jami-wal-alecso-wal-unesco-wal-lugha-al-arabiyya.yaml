id: concept/al-jami-wal-alecso-wal-unesco-wal-lugha-al-arabiyya
class: concept
kind: legal
tags: [arabiyya-browser, arabiyya-world]
label:
  ar: "جامعة الدول العربية والألكسو واليونسكو واللغة العربية"
  en: "The Arab League, ALECSO, UNESCO and the Arabic language"
  ur: "عرب لیگ، الیکسو، یونیسکو اور عربی زبان"
  fr: "La Ligue arabe, l'ALECSO, l'UNESCO et la langue arabe"
  es: "La Liga Árabe, la ALECSO, la UNESCO y la lengua árabe"
  tr: "Arap Devletleri Ligi, ALECSO, UNESCO ve Arapça Dili"
  id: "Liga Arab, ALECSO, UNESCO, dan Bahasa Arab"
summary:
  ar: "لا صك عربي واحد ملزم يسمى «ميثاق اللغة العربية» بحسب ملف بحثي قُدّم إلى المتحف، بل ميثاق الجامعة لسنة 1945 وهو مكتوب بالعربية ويدعم التعاون الثقافي، وصكوك ذات صلة منها إعلان الإمارات عن اللغة العربية لسنة 2021 وأطر الألكسو، وأدوار اليونسكو بالعربية لغة رسمية في الأمم المتحدة منذ 1973 وبرنامج الأمير سلطان بن عبد العزيز {cite:refworld-league-of-arab-states-charter} {cite:alecso-org} {cite:unesco-arabic-language-page}."
  en: "By a research file supplied to the museum, there is no single binding Arab instrument called a charter of the Arabic language: there is the League's Charter of 1945, which is in Arabic and supports cultural cooperation, related instruments including the UAE Declaration on the Arabic Language of 2021 and ALECSO's frameworks, and the roles of UNESCO, with Arabic an official UN language since 1973 and the Prince Sultan programme {cite:refworld-league-of-arab-states-charter} {cite:alecso-org} {cite:unesco-arabic-language-page}."
  ur: "عجائب گھر کو پیش کی گئی ایک تحقیقی فائل کے مطابق کوئی ایک لازمی عربی دستاویز نہیں جسے «عربی زبان کا میثاق» کہا جائے؛ بلکہ لیگ کا 1945 کا میثاق ہے جو عربی میں لکھا ہے اور ثقافتی تعاون کی تائید کرتا ہے، متعلقہ دستاویزات ہیں جن میں 2021 کا امارات کا اعلامیہ برائے عربی زبان اور الیکسو کے فریم ورک شامل ہیں، اور یونیسکو کے کردار ہیں، جبکہ عربی 1973 سے اقوامِ متحدہ کی سرکاری زبان ہے اور شہزادہ سلطان بن عبدالعزیز کا پروگرام ہے {cite:refworld-league-of-arab-states-charter} {cite:alecso-org} {cite:unesco-arabic-language-page}۔"
  fr: "Selon un dossier de recherche remis au musée, il n'existe pas d'instrument arabe unique et contraignant appelé charte de la langue arabe : il y a la Charte de la Ligue de 1945, rédigée en arabe et favorable à la coopération culturelle, des instruments connexes dont la Déclaration des Émirats sur la langue arabe de 2021 et les cadres de l'ALECSO, et les rôles de l'UNESCO, l'arabe étant langue officielle de l'ONU depuis 1973 et le programme du prince Sultan {cite:refworld-league-of-arab-states-charter} {cite:alecso-org} {cite:unesco-arabic-language-page}."
  es: "Según un expediente de investigación entregado al museo, no existe un único instrumento árabe vinculante llamado carta de la lengua árabe: existe la Carta de la Liga de 1945, redactada en árabe y favorable a la cooperación cultural, instrumentos afines como la Declaración de los Emiratos sobre la lengua árabe de 2021 y los marcos de la ALECSO, y los papeles de la UNESCO, siendo el árabe lengua oficial de la ONU desde 1973 y el programa del príncipe Sultán {cite:refworld-league-of-arab-states-charter} {cite:alecso-org} {cite:unesco-arabic-language-page}."
  tr: "Müzeye sunulan bir araştırma dosyasına göre, \"Arap Dil Şartı\" adında tek bir bağlayıcı Arap Şartı yoktur; bunun yerine kültürel işbirliğini destekleyen Arapça yazılmış 1945 tarihli Üniversite Şartı bulunmaktadır. İlgili belgeler arasında BAE'nin 2021 tarihli Arapça dilini bildirmesi, ALECSO çerçeveleri, 1973'ten beri Birleşmiş Milletler'de resmi dil olarak UNESCO'nun Arapça rolleri ve Prens Sultan bin Abdulaziz Programı {cite:refworld-league-of-arab-states-charter} {cite:alecso-org} {cite:unesco-arabic-language-page} yer almaktadır."
  id: "Menurut berkas penelitian yang diserahkan ke museum, tidak ada satu Piagam Arab yang mengikat yang disebut \"Piagam Bahasa Arab\"; sebaliknya, ada Piagam Universitas tahun 1945 yang ditulis dalam bahasa Arab yang mendukung kerja sama budaya. Dokumen relevan meliputi deklarasi bahasa Arab UEA tahun 2021, kerangka kerja ALECSO, peran UNESCO dalam bahasa Arab sebagai bahasa resmi di Perserikatan Bangsa-Bangsa sejak 1973, dan Program Pangeran Sultan bin Abdulaziz {cite:refworld-league-of-arab states-charter} {cite:alecso-org} {cite:unesco-arabic-language-page}."
