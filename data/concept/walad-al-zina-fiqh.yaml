label:
  ar: "وَلد الزِّنى"
  en: "Child of fornication (walad al-zina, fiqh)"
summary:
  ar: "ولد الزنى هو الولد الذي تأتي به أمه من سفاح لا من نكاح. ويثبت نسبه من أمه، وينقطع نسبه عن الزاني عند الجمهور، وتتفرع عنه أحكام في الدين والأذان والإمامة والزكاة والتحريم والكفاءة والرضاع والإرث والقضاء والشهادة والقذف والقتل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17929}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17936}"
  en: "The child of fornication is the child a mother bears out of unlawful intercourse, not marriage. His lineage is established from his mother, and by the majority it is cut from the fornicator. Rulings follow on his religion, call to prayer, leading prayer, zakat, prohibitions of marriage, equality in marriage, foster-suckling, inheritance, judgeship, testimony, slander and retaliation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17929}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17936}"
  ur: "ولد الزنا وہ بچہ ہے جو ماں کو نکاح کے بغیر حرام تعلق سے حاصل ہو۔ اس کا نسب ماں سے ثابت ہوتا ہے، اور جمہور کے نزدیک باپ سے منقطع رہتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17929}"
