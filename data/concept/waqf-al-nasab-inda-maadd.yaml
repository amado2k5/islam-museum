label: { ar: "الوقوف في النسب عند معد", en: "Stopping the genealogy at Ma'add" }
summary:
  ar: "نهى النبي أن يتجاوز في النسب عن معد بن عدنان، فثبت أن يتوقف عليه، لعلمه من تباعد الأنساب وكثرة الآراء في طول هذه المدة والأعصار، وقد اختلف أهل النسب فيما فوقه اختلافاً ذكره المسعودي من نسخة ابن هشام في المغازي والسير عن ابن إسحاق ونسخة أخرى ورواية ابن الأعرابي عن هشام الكلبي وسفر باروخ بن ناريا {cite:muruj-al-dhahab p. 565-566}."
  en: "The Prophet's ban on pressing the lineage beyond Ma'add — a stop imposed by the span of time and the quarrel of versions, which al-Mas'udi documents from four divergent witnesses {cite:muruj-al-dhahab p. 565-566}."
