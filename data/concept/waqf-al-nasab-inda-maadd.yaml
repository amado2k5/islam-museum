id: concept/waqf-al-nasab-inda-maadd
tags: [ansab-browser, ansab-curated, islamic-economy-browser, islamic-economy-waqf]
class: concept
kind: doctrine
label: { ar: "الوقوف في النسب عند معد", en: "Stopping the genealogy at Ma'add", es: "Deteniendo la genealogía en Ma'add", fr: "Arrêt de la généalogie à Ma'add", ur: "معد میں نسب کو روکنا", tr: "Hazırlanmış soyunda durmak", id: "Berdiri di garis keturunan dengan yang telah dipersiapkan" }
summary:
  ar: "نهى النبي أن يتجاوز في النسب عن معد بن عدنان، فثبت أن يتوقف عليه، لعلمه من تباعد الأنساب وكثرة الآراء في طول هذه المدة والأعصار، وقد اختلف أهل النسب فيما فوقه اختلافاً ذكره المسعودي من نسخة ابن هشام في المغازي والسير عن ابن إسحاق ونسخة أخرى ورواية ابن الأعرابي عن هشام الكلبي وسفر باروخ بن ناريا {cite:muruj-al-dhahab p. 565-566}."
  en: "The Prophet's ban on pressing the lineage beyond Ma'add — a stop imposed by the span of time and the quarrel of versions, which al-Mas'udi documents from four divergent witnesses {cite:muruj-al-dhahab p. 565-566}."
  es: "La prohibición del Profeta de extender el linaje más allá de Ma'add —una parada impuesta por el lapso de tiempo y la disputa de versiones, que al-Mas'udi documenta a partir de cuatro testigos divergentes {cite:muruj-al-dhahab p. 565-566}."
  fr: "L'interdiction du Prophète de poursuivre la lignée au-delà de Ma'add — un arrêt imposé par l'étendue du temps et la querelle des versions, qu'al-Mas'udi documente à partir de quatre témoins divergents {cite:muruj-al-dhahab p. 565-566}."
  ur: "معد سے آگے سلسلہ نسب کو دبانے پر پیغمبر کی پابندی - وقت کے وقفے اور نسخوں کے جھگڑے کی وجہ سے مسلط کیا گیا ایک روک جسے مسعودی نے چار مختلف گواہوں سے دستاویز کیا ہے {حوالہ: مروج الذہب صفحہ 150۔ 565-566}۔"
  tr: "Peygamber, Ma'ad ibn Adnan'dan soyun aşılmasını yasaklamıştır; bu nedenle, soy ayrılıkları ve bu dönemde görüşlerin bolluğu hakkında bilgisi nedeniyle ona güvenmesi gerektiği belirlenmiştir. Soy halkı yukarıdaki konuda farklı görüşlere sahipti; el-Mes'udi'nin bahsettiği gibi, Maghazi'deki İbn Hişam, Sirah'ın İbn İshaq'tan, başka bir versiyondan, Hisham'al-Kalbi'den İbn el-A'rabi'nin rivayeti ve Baruch ibn Nariya'nın kitabı {atıf:Muruj-al-Dhahab, s. 565-566} ile belirtilmiştir."
  id: "Nabi melarang melampaui garis keturunan dari Ma'ad ibn Adnan, sehingga ditetapkan bahwa ia harus mengandalkan Nabi, karena pengetahuannya tentang perbedaan garis keturunan dan kelimpahan pendapat selama periode dan era ini. Umat keturunan berbeda dalam hal tersebut, seperti yang disebutkan oleh al-Mas'udi dari versi Ibn Hisham dalam Maghazi, Sirah dari Ibn Ishaq, versi lain, riwayat Ibn al-A'rabi dari Hisham al-Kalbi, dan kitab Baruch ibn Nariya {cite:muruj-al-dhahab, hlm. 565-566}."
