label: { ar: "قلم الغبار", en: "Ghubar script", ur: "قلمِ غبار", es: "Guion de Ghubar" }
summary:
  ar: "أصغر الأقلام العربية، سمي بالغبار لأن حروفه كذرات الغبار، تقل عادة عن ثلاثة مليمترات، ويُعد غالبًا مشتقًا من الرقاع أو النسخ {cite:blair-islamic-calligraphy-2006 p. 299}."
  en: "The smallest of the Arabic scripts, named 'dust' because its letters resemble motes of dust — usually under 3 mm high — and often thought to derive from riqa' and/or naskh {cite:blair-islamic-calligraphy-2006 p. 299}."
  ur: "عربی کا سب سے چھوٹا قلم، جس کا نام «غبار» اس لیے پڑا کہ اس کے حروف گرد کے ذروں جیسے ہیں — عموماً تین ملی میٹر سے کم — اور اسے اکثر رقاع یا نسخ سے ماخوذ سمجھا جاتا ہے {cite:blair-islamic-calligraphy-2006 p. 299}۔"
  es: "La más pequeña de las escrituras árabes, llamada 'polvo' porque sus letras se asemejan a motas de polvo —generalmente de menos de 3 mm de altura— y a menudo se cree que deriva de riqa' y/o naskh {cite:blair-islamic-calligraphy-2006 p. 299}."
