id: concept/horse-colours-in-timurid-painting
class: concept
kind: art_form
label:
  ar: ألوان الخيل وشياتها في التصوير التيموري
  en: Horse colours and markings in Timurid painting
  es: "Colores y marcas de los caballos en la pintura timúrida"
  fr: "Couleurs et marques des chevaux dans la peinture timouride"
  ur: "تیموری پینٹنگ میں گھوڑے کے رنگ اور نشانات"
summary:
  ar: "تصنّف المخطوطات التيمورية الخيل بألوانها ⁦(الأشهب والأحمر والأصفر والأسود)⁩ وبشياتها ⁦(الغرة والتحجيل والبقع)⁩، وتقرأ الباحثة هذه الفروق بوصفها دليلاً على الخيول الحقيقية في سمرقند وهراة وشيراز، فتعين بها مراكز التصوير."
  en: "Timurid manuscript painters drew horses in distinct colours (white, red, yellow, black) and markings (blazes, leg whites, spots). Fayed reads these differences as evidence of real horse types in Samarkand, Herat and Shiraz, and uses them to place paintings in their centres."
  es: "Los pintores de manuscritos timúridas representaban caballos con colores distintivos (blanco, rojo, amarillo, negro) y marcas características (manchas blancas en la frente, manchas en las patas, puntos). Fayed interpreta estas diferencias como evidencia de la existencia de tipos de caballos reales en Samarcanda, Herat y Shiraz, y las utiliza para ubicar las pinturas en el centro de dichas regiones."
  fr: "Les peintres de manuscrits timourides représentaient les chevaux avec des couleurs distinctes (blanc, rouge, jaune, noir) et des marques particulières (listes, balzanes, taches). Fayed interprète ces différences comme la preuve de l'existence de véritables types de chevaux à Samarcande, Hérat et Chiraz, et s'en sert pour placer les peintures au centre de leurs représentations."
  ur: "تیموری مخطوطہ کے مصوروں نے گھوڑوں کو الگ الگ رنگوں ⁦(سفید، سرخ، پیلا، سیاہ)⁩ اور نشانات ⁦(بلیز، ٹانگوں کی سفیدی، دھبوں)⁩ میں کھینچا۔ فائد ان اختلافات کو سمرقند، ہرات اور شیراز میں گھوڑوں کی اصلی اقسام کے ثبوت کے طور پر پڑھتا ہے، اور انہیں اپنے مراکز میں پینٹنگز لگانے کے لیے استعمال کرتا ہے۔"
