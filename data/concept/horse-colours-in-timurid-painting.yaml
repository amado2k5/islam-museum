  ar: ألوان الخيل وشياتها في التصوير التيموري
  en: Horse colours and markings in Timurid painting
summary:
  ar: "تصنّف المخطوطات التيمورية الخيل بألوانها (الأشهب والأحمر والأصفر والأسود) وبشياتها (الغرة والتحجيل والبقع)، وتقرأ الباحثة هذه الفروق بوصفها دليلاً على الخيول الحقيقية في سمرقند وهراة وشيراز، فتعين بها مراكز التصوير."
  en: "Timurid manuscript painters drew horses in distinct colours (white, red, yellow, black) and markings (blazes, leg whites, spots). Fayed reads these differences as evidence of real horse types in Samarkand, Herat and Shiraz, and uses them to place paintings in their centres."
