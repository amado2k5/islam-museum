  tr: "İbn Sina, darbenin nedenleri üzerine beşinci bölümü Masaka, Lazima ve Muhayra olarak bölerek açar ve üç Maasaka'yı ele alır {cite:canon-ibn-sina-print-v1 s.174}."
  id: "Ibn Sina membuka bab kelima tentang penyebab denyut dengan membaginya menjadi Masaka, Lazima, dan Mughayra, serta mempertimbangkan tiga Maasaka {cite:canon-ibn-sina-print-v1 hlm.174}."
