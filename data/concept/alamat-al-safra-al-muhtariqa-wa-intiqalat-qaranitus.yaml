id: concept/alamat-al-safra-al-muhtariqa-wa-intiqalat-qaranitus
class: concept
kind: scientific
label:
  ar: "علامات قرانيطس من الصفراء المحترقة وعلامات انتقاله"
  en: "Signs of qaranitus from burnt bile and the signs of its transfer"
  fr: "Signes du qaranitus dû à la bile brûlée et de son évolution"
  ur: "جلی ہوئی صفراء سے قرانیطس کی علامات اور اس کی منتقلی کی علامات"
  es: "Signos de qaranitus por bilis quemada y signos de su transferencia"
  tr: "Yanık sarı belirtileri ve bulaşma belirtileri"
  id: "Gejala luka bakar kuning dan tanda-tanda penularan"
summary:
  ar: "يذكر ابن سينا أن قرانيطس الكائن من صفراء محترقة هو الرديء المهلك وعلاماته الجنون والضجر، ثم علامات انتقاله إلى ليثرغس وإلى سفاقلوس والورم الدماغي وإلى الدق وإلى التشنج {cite:canon-ibn-sina-print-v2 p.80}"
  en: "Ibn Sina says the qaranitus from burnt bile is the bad and deadly one, with madness and vexation, and then gives the signs of its passing into lethargus, into safaqulus and the cerebral swelling, into consumption and into convulsion {cite:canon-ibn-sina-print-v2 p.80}"
  fr: "Ibn Sina présente le qaranitus dû à la bile brûlée comme la forme grave et mortelle, marquée par le délire et l’agitation. Il donne ensuite les signes de son évolution vers le lethargus, le safaqulus et le gonflement cérébral, la consomption ou les convulsions {cite:canon-ibn-sina-print-v2 p.80}."
  ur: "ابن سینا کہتا ہے کہ جلی ہوئی صفراء سے ہونے والا قرانیطس برا اور ہلاک کرنے والا ہے اور اس کی علامات جنون اور بیزاری ہیں، پھر لیثرغس، سفاقلوس اور دماغی سوجن، دق اور تشنج میں اس کی منتقلی کی علامات بتاتا ہے {cite:canon-ibn-sina-print-v2 p.80}۔"
  es: "Ibn Sina dice que el qaranitus de la bilis quemada es el malo y mortal, con locura y vejación, y luego da los signos de su transición a letargo, a safaqulus y la inflamación cerebral, a tisis y a convulsiones {cite:canon-ibn-sina-print-v2 p.80}"
  tr: "İbn Sina, yanmış sarıdan oluşan kornitlerin en yıkıcı olanlar olduğunu, delilik ve can sıkıntısı belirtileri gösterdiğini, ardından Lithrghus, Sphacchus, beyin tümörü, kilo ve spazmlara geçiş belirtileri olduğunu belirtir {cite:canon-ibn-sina-print-v2 s.80}"
  id: "Ibn Sina menyatakan bahwa cornitis yang terbuat dari kuning terbakar adalah yang paling merusak, menunjukkan tanda-tanda kegilaan dan kebosanan, diikuti oleh Lithrghus, Sphacchus, tumor otak, kenaikan berat badan, dan tanda-tanda kejang {cite:canon-ibn-sina-print-v2 hlm.80}"
