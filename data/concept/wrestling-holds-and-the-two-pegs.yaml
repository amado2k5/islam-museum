label: { ar: "أنواع المباطشة ورياضة المسلتين عند ابن سينا", en: "Grappling holds and the two-pegs exercise in the Canon", ur: "قانون میں پکڑ کے انداز اور دو میخوں کی ورزش" }
summary:
  ar: "يصف ابن سينا المباطشة بأنها أنواع، منها أن يشبك الرجلان أيديهما على وسط الآخر ويتخلص كل منهما من صاحبه، ومنها المدافعة بالصدرين وملازمة العنق وملاواة الرجلين، ثم الرياضات السريعة ومنها مبادلة الرفيقين مكانيهما ورياضة المسلتين {cite:canon-ibn-sina-print-v1 p.222}."
  en: "Ibn Sina describes grappling as of several kinds: two men lock hands about each other's waists and each tries to slip free while held, with chest pushing, neck holds and leg twists, then the quick exercises, among them two companions swapping places and the exercise of the two pegs {cite:canon-ibn-sina-print-v1 p.222}."
