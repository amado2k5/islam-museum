label: { ar: "أنواع المباطشة ورياضة المسلتين عند ابن سينا", en: "Grappling holds and the two-pegs exercise in the Canon", ur: "قانون میں پکڑ کے انداز اور دو میخوں کی ورزش", es: "Agarres de agarre y el ejercicio de dos clavijas en el Canon", fr: "Les prises de lutte et l'exercice des deux chevilles dans le Canon" }
summary:
  ar: "يصف ابن سينا المباطشة بأنها أنواع، منها أن يشبك الرجلان أيديهما على وسط الآخر ويتخلص كل منهما من صاحبه، ومنها المدافعة بالصدرين وملازمة العنق وملاواة الرجلين، ثم الرياضات السريعة ومنها مبادلة الرفيقين مكانيهما ورياضة المسلتين {cite:canon-ibn-sina-print-v1 p.222}."
  en: "Ibn Sina describes grappling as of several kinds: two men lock hands about each other's waists and each tries to slip free while held, with chest pushing, neck holds and leg twists, then the quick exercises, among them two companions swapping places and the exercise of the two pegs {cite:canon-ibn-sina-print-v1 p.222}."
  es: "Ibn Sina describe la lucha cuerpo a cuerpo como de varios tipos: dos hombres se toman de las manos alrededor de la cintura del otro y cada uno intenta zafarse mientras está sujeto, con empujones de pecho, agarres de cuello y torsiones de piernas, luego los ejercicios rápidos, entre ellos dos compañeros intercambiando lugares y el ejercicio de las dos estacas {cite:canon-ibn-sina-print-v1 p.222}."
  fr: "Ibn Sina décrit la lutte comme étant de plusieurs sortes: deux hommes se tiennent la main autour de la taille et chacun essaie de se libérer tout en étant tenu, avec des poussées de poitrine, des prises de cou et des torsions de jambes, puis les exercices rapides, parmi lesquels deux compagnons échangeant leurs places et l'exercice des deux piquets {cite:canon-ibn-sina-print-v1 p.222}."
