label: { ar: "اتّباع", en: "Ittiba' (following; returning to a proven ruling)", es: "Ittiba' (siguiendo; volviendo a una decisión probada)", fr: "Ittiba' (suivant; revenant à une décision éprouvée)" }
summary:
  ar: "الاتّباع في اللغة السير وراء الغير، ويأتي بمعنى الائتمام والائتمار والعمل بكلام الغير والمطالبة. وهو في الاصطلاح الرجوع إلى قول ثبتت عليه حجة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1468} ويفرّق الفقهاء بينه وبين التقليد، فالتقليد العمل بقول الغير من غير حجة، والاتّباع الرجوع إلى قول ثبتت عليه حجة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1469} ويختلف حكمه بحسب ما يُتبع: فيجب اتّباع الشريعة واتّباع النبي في أمور الدين، ويجب على العامي اتّباع المجتهدين عند المحققين من الأصوليين، وتجب طاعة أولي الأمر في غير معصية، ويندب اتّباع الجنازة، ويحرم اتّباع الهوى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1469} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1470} ويأتي الاتّباع أيضاً بمعنى المطالبة بالدين، فيثبت للدائن أن يتبع مدينه أو كفيله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1470}"
  en: "In the language, ittiba' means walking behind another; it also carries the senses of following someone in prayer, obeying a command, acting on another's word, and demanding a due. As a technical term it is returning to a saying that rests on a proof. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1468} The jurists separate it from taqlid: taqlid is acting on another's word without proof, while ittiba' is returning to a saying that rests on proof. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1469} Its ruling depends on what is followed: following the sharia and the Prophet in matters of religion is obligatory, a layperson must follow the mujtahids according to the careful usulis, obedience to those in authority is obligatory outside sin, following a funeral is recommended, and following desire is forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1469} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1470} The word also means demanding a debt, so a creditor may pursue his debtor or the surety. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1470}"
  es: "En el idioma, ittiba' significa caminar detrás de otro; también conlleva los sentidos de seguir a alguien en la oración, obedecer una orden, actuar según la palabra de otro y exigir lo que se debe. Como término técnico es volver a un dicho que se basa en una prueba. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1468} Los juristas lo separan del taqlid: taqlid es actuar según la palabra de otro sin prueba, mientras que ittiba' es volver a un dicho que se basa en una prueba. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1469} Su dictamen depende de lo que se siga: seguir la sharia y al Profeta en materia de religión es obligatorio, un laico debe seguir a los mujtahids según los usulis cuidadosos, la obediencia a quienes están en autoridad es obligatoria fuera del pecado, seguir un funeral es recomendable y seguir el deseo está prohibido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1469} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1470} La palabra también significa exigir una deuda, para que un acreedor pueda perseguir a su deudor o al fiador. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1470}"
  fr: "En kuwa, « ittiba' » signifie marcher derrière quelqu'un; ce terme englobe également l'action de suivre quelqu'un en prière, d'obéir à un ordre, d'agir selon la parole d'autrui et de réclamer ce qui nous est dû. Techniquement, il s'agit de se référer à une parole fondée sur une preuve. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1468} Les juristes le distinguent du « taqlid »: le « taqlid » consiste à agir selon la parole d'autrui sans preuve, tandis que l'« ittiba' » consiste à se référer à une parole fondée sur une preuve. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1469} Son application dépend de ce qui est suivi: suivre la charia et le Prophète en matière de religion est obligatoire; un laïc doit suivre les mujtahids selon les usulis rigoureux; l'obéissance aux autorités est obligatoire en dehors du péché; assister aux funérailles est recommandé; et suivre ses désirs est interdit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1469} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1470} Le mot signifie aussi exiger une dette, afin qu'un créancier puisse poursuivre son débiteur ou la caution. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1470}"
