id: concept/ittiba
class: concept
kind: legal
label: { ar: "اتّباع", en: "Ittiba' (following; returning to a proven ruling)" }
summary:
  ar: "الاتّباع في اللغة السير وراء الغير، ويأتي بمعنى الائتمام والائتمار والعمل بكلام الغير والمطالبة. وهو في الاصطلاح الرجوع إلى قول ثبتت عليه حجة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1468} ويفرّق الفقهاء بينه وبين التقليد، فالتقليد العمل بقول الغير من غير حجة، والاتّباع الرجوع إلى قول ثبتت عليه حجة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1469} ويختلف حكمه بحسب ما يُتبع: فيجب اتّباع الشريعة واتّباع النبي في أمور الدين، ويجب على العامي اتّباع المجتهدين عند المحققين من الأصوليين، وتجب طاعة أولي الأمر في غير معصية، ويندب اتّباع الجنازة، ويحرم اتّباع الهوى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1469} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1470} ويأتي الاتّباع أيضاً بمعنى المطالبة بالدين، فيثبت للدائن أن يتبع مدينه أو كفيله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1470}"
  en: "In the language, ittiba' means walking behind another; it also carries the senses of following someone in prayer, obeying a command, acting on another's word, and demanding a due. As a technical term it is returning to a saying that rests on a proof. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1468} The jurists separate it from taqlid: taqlid is acting on another's word without proof, while ittiba' is returning to a saying that rests on proof. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1469} Its ruling depends on what is followed: following the sharia and the Prophet in matters of religion is obligatory, a layperson must follow the mujtahids according to the careful usulis, obedience to those in authority is obligatory outside sin, following a funeral is recommended, and following desire is forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1469} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1470} The word also means demanding a debt, so a creditor may pursue his debtor or the surety. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1470}"
