id: concept/al-hadith-al-aziz
class: concept
kind: term
label: { ar: "الحديث العزيز", en: "The rare report ('aziz)", ur: "عزیز حدیث" }
term: { ar: "العزيز، من عزّ يعزّ: قلّ ونَدَر، أو عزّ يعَزّ: قوي", en: "al-'aziz" }
summary:
  ar: "العزيز عند ابن حجر ألّا يرويه أقلّ من اثنين عن اثنين، سمي بذلك لقلة وجوده أو لقوته بمجيئه من طريق أخرى؛ وليس شرطاً للصحيح خلافاً لأبي علي الجبائي من المعتزلة ولما يومئ إليه كلام الحاكم، ومثاله حديث «لا يؤمن أحدكم حتى أكون أحب إليه من والده وولده» {cite:nuzhat-al-nazar-itr-bushra-2011 p. 43-45}."
  en: "For Ibn Hajar the 'aziz is a report that no fewer than two relate from two; it is so called because it is rare, or because it is strengthened by coming through another chain; it is not a condition of the sound report, contrary to Abu 'Ali al-Jubba'i of the Mu'tazila and to what al-Hakim's words suggest; an example is 'none of you believes until I am dearer to him than his father and his child' {cite:nuzhat-al-nazar-itr-bushra-2011 p. 43-45}."
  ur: "ابن حجر کے نزدیک عزیز وہ حدیث ہے جسے دو سے کم راوی دو سے کم سے روایت نہ کریں؛ اسے قلتِ وجود یا دوسرے طریق سے آ کر قوی ہونے کی وجہ سے یہ نام دیا گیا؛ یہ صحیح کی شرط نہیں، بخلاف معتزلی ابو علی جبائی کے اور اس کے جس کی طرف حاکم کا کلام اشارہ کرتا ہے؛ اس کی مثال «تم میں سے کوئی مومن نہیں ہو سکتا جب تک میں اسے اس کے والد اور اولاد سے زیادہ محبوب نہ ہو جاؤں» ہے {cite:nuzhat-al-nazar-itr-bushra-2011 p. 43-45}۔"
