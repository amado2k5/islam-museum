label: { ar: "موضع البعد الأبعد للشمس من أول الحمل", en: "The place of the Sun's apogee on the zodiac", ur: "سورج کے اوج کا مقام فلک البروج پر", es: "La posición del apogeo del Sol en el zodíaco", fr: "La position de l'apogée du Soleil sur le zodiaque" }
summary:
  ar: "يحسب البتاني أن نقطة البعد الأبعد من الفلك الخارج المركز تقع على نحو سبعة أجزاء وثلاث وأربعين دقيقة من نقطة الانقلاب الصيفي إلى جهة التقدم من فلك البروج، أي على اثنين وثمانين جزءاً وسبع عشرة دقيقة من أول الحمل، وذلك في الرصد الذي اعتمده عام ألف ومائة وأربع وتسعين من سني ذي القرنين {cite:zij-sabi-nallino-byblion pp.70-71}."
  en: "Al-Battani reckons that the point of greatest distance of the eccentric lies about seven parts and forty-three minutes before the summer solstice point, toward the leading direction of the zodiac, that is at eighty-two parts and seventeen minutes from the first of Aries, in the observation he relied on, the year one thousand one hundred and ninety-four of the years of Dhu'l-Qarnayn {cite:zij-sabi-nallino-byblion pp.70-71}."
  ur: "البتانی حساب لگاتے ہیں کہ خارج المرکز کا سب سے دور نقطہ انقلابِ صیفی کے نقطے سے تقریباً سات اجزا اور تینتالیس دقیقے آگے، فلک البروج کی مقدم سمت میں، واقع ہے، یعنی حمل کے آغاز سے بیاسی اجزا اور سترہ دقیقوں پر، اس رصد میں جس پر انہوں نے اعتماد کیا، یعنی ذوالقرنین کے سالوں کے ایک ہزار ایک سو چورانویں سال میں {cite:zij-sabi-nallino-byblion pp.70-71}۔"
  es: "Al-Battani calcula que el punto de mayor distancia de la excéntrica se encuentra aproximadamente siete partes y cuarenta y tres minutos antes del punto del solsticio de verano, hacia la dirección principal del zodíaco, es decir, a ochenta y dos partes y diecisiete minutos del primero de Aries, en la observación en la que se basó, el año mil ciento noventa y cuatro de los años de Dhu'l-Qarnayn {cite:zij-sabi-nallino-byblion pp.70-71}."
  fr: "Al-Battani estime que le point de plus grande distance de l'excentrique se situe à environ sept parties et quarante-trois minutes avant le point du solstice d'été, dans la direction principale du zodiaque, c'est-à-dire à quatre-vingt-deux parties et dix-sept minutes du premier jour du Bélier, dans l'observation sur laquelle il s'est appuyé, l'année mille cent quatre-vingt-quatorze des années de Dhu'l-Qarnayn {cite:zij-sabi-nallino-byblion pp.70-71}."
