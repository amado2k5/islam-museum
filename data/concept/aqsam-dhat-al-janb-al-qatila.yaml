label:
  ar: "أصناف ذات الجنب القاتلة"
  en: "The fatal kinds of pleurisy"
  fr: "Les formes mortelles de la pleurésie"
  ur: "ذات الجنب کی ہلاکت بخش اقسام"
summary:
  ar: "قال أبقراط إنه كثيراً ما يكون النفث جيداً سهلاً وكذلك النفس ويكون هناك علامات أخرى رديئة قاتلة مثل صنف يكون الوجع منه إلى خلف ويكون كأن ظهر صاحبه ظهر مضروب ويكون بوله دموياً قيحياً وقلما يفلح بل يموت ما بين الخامس والسابع وقليلاً ما يمتد إلى أربعة عشر يوماً وفي الأكثر إذا تجاوز السابع نجا وكثيراً ما يظهر بين كتفي صاحبه حمرة وتسخن كتفاه ولا يقدر أن يقعد فإن سخن بطنه وخرج منه براز أصفر مات إلا أن يجاوز السابع وهذا إذا أسرع إليه نفث كثير الأصناف مختلفها ثم اشتد الوجع مات في الثالث والا برئ، وضرب آخر يحس معه بضربان يمتد من الترقوة إلى الساق ويكون البزاق فيه نقياً لا رسوب معه والماء نقياً وهو قاتل لميل المادة إلى الرأس فإن جاوز السابع برئ ⁦(قول منسوب إلى أبقراط على لفظ الكتاب)⁩ {cite:canon-ibn-sina-print-v2 p.346}"
  en: "Hippocrates said that often the expectoration is good and easy, and so the breath, while there are other fatal bad signs: like a kind whose pain is to the back, so that the owner's back is as a beaten back, and his urine is bloody-purulent; he rarely escapes but dies between the fifth and the seventh, seldom reaching fourteen days — though mostly, if he passes the seventh, he is saved. Often a redness shows between his shoulder-blades and his shoulders heat and he cannot sit; if his belly heats and a yellow stool comes out of him he dies, unless he has passed the seventh; and this one, if a many-kinded differing expectoration hastens to him and then the pain intensifies, dies on the third — else he is healed. Another kind with which a pulsation is felt stretching from the collarbone to the shank, the saliva in it pure with no sediment and the water pure — and it is fatal for the matter's inclining to the head; if he passes the seventh he is healed (a saying attributed to Hippocrates on the book's wording) {cite:canon-ibn-sina-print-v2 p.346}"
  fr: "Hippocrate a dit que souvent l’expectoration est bonne et facile, et la respiration aussi, alors qu’il existe d’autres mauvais signes mortels : comme une forme dont la douleur se porte vers le dos, si bien que le dos du malade est comme un dos battu et que son urine est sanguinolente et purulente ; il en réchappe rarement, mais meurt entre le cinquième et le septième jour, atteignant rarement quatorze jours — bien que, le plus souvent, s’il dépasse le septième, il soit sauvé. Souvent une rougeur apparaît entre ses omoplates, ses épaules s’échauffent et il ne peut s’asseoir ; si son ventre s’échauffe et qu’une selle jaune sort de lui, il meurt, à moins d’avoir dépassé le septième jour ; et celui-ci, si une expectoration variée et changeante survient rapidement, puis que la douleur s’intensifie, meurt le troisième jour — sinon il guérit. Une autre forme s’accompagne d’une pulsation ressentie de la clavicule à la jambe, avec une salive pure sans dépôt et une eau pure — et elle est mortelle parce que la matière se porte vers la tête ; s’il dépasse le septième jour, il guérit (propos attribué à Hippocrate suivant les termes du livre) {cite:canon-ibn-sina-print-v2 p.346}"
  ur: "ابطقراط نے کہا کہ اکثر نفث اچھا اور آسان ہوتا ہے اور سانس بھی حالانکہ دوسری ہلاکت بخش بری علامتیں ہوتی ہیں جیسے ایک قسم جس کا درد پیٹھ کی طرف ہوتا ہے یہاں تک کہ صاحب کی پیٹھ ایسی ہو جیسے اسے مارا گیا ہو اور پیشاب خونی پیب دار ہوتا ہے وہ شاذ ہی بچے بلکہ پانچویں اور ساتویں کے درمیان مر جاتا ہے بہت کم چودہ دن تک پہنچتا ہے لیکن اکثر اگر ساتویں گزار دے تو بچ جاتا ہے؛ اکثر اس کے دونوں کندھوں کے درمیان سرخی ظاہر ہوتی ہے کندھے گرم ہوتے ہیں اور وہ بیٹھ نہیں سکتا اگر اس کا پیٹ گرم ہو اور پیلا براز نکلے تو مر جاتا ہے مگر ساتویں گزار چکا ہو؛ اور اسی میں اگر کثیر مختلف اقسام کا نفث جلدی آئے پھر درد سخت ہو جائے تو تیسرے دن مر جاتا ہے ورنہ شفا پاتا ہے؛ دوسری قسم جس کے ساتھ ترقوے سے پنڈلی تک پھیلتی ضربان محسوس ہوتی ہے رال اس میں صاف بغیر رسوب اور پانی صاف ہوتا ہے اور وہ مادہ کے سر کی طرف جھکنے سے ہلاکت بخش ہے اگر ساتویں گزار دے تو شفا پاتا ہے ⁦(کتاب کے لفظ پر ابقراط سے منسوب قول)⁩ {cite:canon-ibn-sina-print-v2 p.346}"
