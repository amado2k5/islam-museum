id: concept/drink-on-food-and-sweets-and-blockage
class: concept
kind: scientific
label: { ar: "الشراب على الطعام والحلاوات والسدد", en: "Drink on top of food, sweets and blockage", ur: "کھانے پر مشروب، میٹھائیاں اور سدے", es: "Beber además de comer, dulces y estreñimiento", fr: "Boire par-dessus les aliments, les sucreries et les obstructions" }
summary:
  ar: "يقول ابن سينا إن الشراب على الطعام من أضر الأشياء لأنه سريع الهضم والنفوذ فينفذ الطعام ولم ينهضم فيورث السدد والعفونة والجرب، وإن الحلاوات تسرع إيراث السدد، وإن السدد توقع في أمراض كثيرة منها الاستسقاء، وإنه لا بأس بقدح ممزوج أو ماء حار طبخ فيه عود ومصطكى عند غلظ الهواء والماء صيفاً {cite:canon-ibn-sina-print-v1 p.232}."
  en: "Ibn Sina says drink taken on top of food is among the most harmful things, since it digests and passes quickly and carries the food on undigested, bringing blockages, rot and sometimes scab; sweets quickly cause blockages, which lead to many illnesses such as dropsy; where heavy air and water, especially in summer, spoil food, a mixed cup or hot water boiled with aloeswood and mastic does no harm {cite:canon-ibn-sina-print-v1 p.232}."
  es: "Ibn Sina dice que beber sobre la comida es una de las cosas más dañinas, ya que se digiere y pasa rápidamente y arrastra la comida sin digerir, provocando obstrucciones, putrefacción y a veces costras; los dulces causan rápidamente obstrucciones, que conducen a muchas enfermedades como la hidropesía; donde el aire y el agua pesados, especialmente en verano, estropean los alimentos, una taza mezclada o agua caliente hervida con madera de aloe y lentisco no causa daño {cite:canon-ibn-sina-print-v1 p.232}."
  fr: "Ibn Sina affirme que boire pendant les repas est parmi les choses les plus nocives, car cela digère et passe rapidement, laissant les aliments non digérés, ce qui provoque des obstructions, de la pourriture et parfois des croûtes; les sucreries provoquent rapidement des obstructions, qui entraînent de nombreuses maladies comme l’hydropisie; lorsque l’air lourd et l’eau, surtout en été, abîment les aliments, une tasse mélangée ou de l’eau chaude bouillie avec du bois d’aloès et du mastic ne fait aucun mal {cite:canon-ibn-sina-print-v1 p.232}."
  ur: "ابن سینا کا کہنا ہے کہ کھانے کے اوپر پینا سب سے زیادہ نقصان دہ چیزوں میں سے ہے، کیونکہ یہ جلدی ہضم اور گزر جاتا ہے اور کھانے کو ہضم نہ ہونے پر لے جاتا ہے، جس سے رکاوٹیں، سڑنا اور بعض اوقات خارش پیدا ہوتی ہے۔ مٹھائیاں جلدی رکاوٹوں کا باعث بنتی ہیں، جو بہت سی بیماریاں جیسے ڈراپسی کا باعث بنتی ہیں۔ جہاں بھاری ہوا اور پانی، خاص طور پر گرمیوں میں، کھانے کو خراب کرتے ہیں، ایک ملا ہوا کپ یا ایلوس ووڈ اور مستی کے ساتھ اُبلا ہوا گرم پانی کوئی نقصان نہیں پہنچاتا۔"
