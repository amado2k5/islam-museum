label: { ar: "الشراب على الطعام والحلاوات والسدد", en: "Drink on top of food, sweets and blockage", ur: "کھانے پر مشروب، میٹھائیاں اور سدے" }
summary:
  ar: "يقول ابن سينا إن الشراب على الطعام من أضر الأشياء لأنه سريع الهضم والنفوذ فينفذ الطعام ولم ينهضم فيورث السدد والعفونة والجرب، وإن الحلاوات تسرع إيراث السدد، وإن السدد توقع في أمراض كثيرة منها الاستسقاء، وإنه لا بأس بقدح ممزوج أو ماء حار طبخ فيه عود ومصطكى عند غلظ الهواء والماء صيفاً {cite:canon-ibn-sina-print-v1 p.232}."
  en: "Ibn Sina says drink taken on top of food is among the most harmful things, since it digests and passes quickly and carries the food on undigested, bringing blockages, rot and sometimes scab; sweets quickly cause blockages, which lead to many illnesses such as dropsy; where heavy air and water, especially in summer, spoil food, a mixed cup or hot water boiled with aloeswood and mastic does no harm {cite:canon-ibn-sina-print-v1 p.232}."
