id: concept/al-dukhan
class: concept
kind: belief
label:
  ar: الدخان
  en: The Smoke
  ur: دھواں
summary:
  ar: "من العلامات الكبرى عند جمهور أهل العلم: دخان مبين يغشى الناس؛ ذكره النبي في العشر، وفسره ابن مسعود ومن وافقه بجوع مكة أيام القحط، والجمهور على أنه آية منتظرة {cite:sahih-muslim} {cite:tafsir-ibn-kathir}."
  en: "A major sign for most scholars: a clear smoke covering the people; the Prophet counted it among the ten, Ibn Mas'ud and others explained it as the Meccan famine of the drought years, while most scholars hold it is still awaited {cite:sahih-muslim} {cite:tafsir-ibn-kathir}."
  ur: "اکثر علماء کے نزدیک بڑی نشانیوں میں سے: ایک کھلا دھواں جو لوگوں کو ڈھانپ لے گا؛ نبی نے اسے دس میں گنا، ابن مسعود اور ہم رائے نے اسے قحط کے زمانے میں مکہ کی بھوک سے تعبیر کیا، جبکہ اکثر کے نزدیک وہ آنے والی آیت ہے {cite:sahih-muslim} {cite:tafsir-ibn-kathir}۔"
