perspectives:
- tradition: sunni
  id: jumhur-dukhan-awaited
  stance:
    ar: "الدخان آية منتظرة من علامات الساعة الكبرى لم تقع بعد"
    en: "The Smoke is an awaited sign among the major signs, not yet come"
  summary:
    ar: "ذهب جمهور أهل العلم إلى أن الدخان المبين آية مستقبلة من آيات الساعة العشر التي عدّها النبي، لا الجوع الذي أصاب قريشًا {cite:tafsir-ibn-kathir} {cite:sahih-muslim}."
    en: "Most scholars hold that the Clear Smoke is a future sign among the ten Hour-signs the Prophet counted, not the famine that struck Quraysh {cite:tafsir-ibn-kathir} {cite:sahih-muslim}."
  holders: [work/tafsir-ibn-kathir]
  evidence:
  - ref: source/tafsir-ibn-kathir
    note: { ar: "عند تفسير سورة الدخان" }
- tradition: sunni
  id: ibn-masud-dukhan-famine
  stance:
    ar: "الدخان هو الجوع الذي أصاب قريشًا وأهلكهم حتى رأى الرجل ما بين السماء والأرض من أثر الجوع كهيئة الدخان"
    en: "The Smoke was the famine that struck Quraysh until men saw a smoke-like haze between sky and earth"
  summary:
    ar: "روى البخاري ومسلم عن ابن مسعود أن الآية نزلت في جوع مكة أيام القحط حين دعا عليهم النبي، وأن الله كشفه عنهم حين أسلموا {cite:sahih-al-bukhari} {cite:sahih-muslim}."
    en: "Bukhari and Muslim report from Ibn Mas'ud that the verse came down about the Meccan famine of the drought years when the Prophet prayed against them, and God lifted it when they submitted {cite:sahih-al-bukhari} {cite:sahih-muslim}."
  holders: [person/abdullah-ibn-masud, work/sahih-muslim]
  evidence:
  - ref: source/sahih-muslim
    note: { ar: "كتاب التفسير" }
  - ref: source/sahih-al-bukhari
    note: { ar: "كتاب التفسير، سورة الدخان" }
