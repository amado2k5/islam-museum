id: concept/al-hadith-al-gharib
class: concept
kind: term
label: { ar: "الحديث الغريب (الفرد)", en: "The singular report (gharib, fard)", ur: "غریب (فرد) حدیث" }
term: { ar: "الغريب والفرد، مترادفان لغة واصطلاحاً", en: "al-gharib, al-fard" }
summary:
  ar: "الغريب عند ابن حجر ما يتفرد بروايته شخص واحد في أي موضع وقع التفرد به من السند؛ وهو قسمان: الفرد المطلق إذا كانت الغرابة في أصل السند، والفرد النسبي إذا وقع التفرد في أثنائه بالنسبة إلى شخص معين؛ والغريب والفرد مترادفان، لكن أهل الاصطلاح يكثرون إطلاق الفرد على المطلق والغريب على النسبي {cite:nuzhat-al-nazar-itr-bushra-2011 p. 45-52}."
  en: "For Ibn Hajar the gharib is a report related by one person alone at any point in the chain; it is of two kinds: the absolute singular (fard mutlaq), when the singularity is at the root of the chain, and the relative singular (fard nisbi), when it occurs further along, relative to a particular person; gharib and fard are synonyms, but specialists mostly call the absolute kind fard and the relative kind gharib {cite:nuzhat-al-nazar-itr-bushra-2011 p. 45-52}."
  ur: "ابن حجر کے نزدیک غریب وہ حدیث ہے جسے سند کے کسی بھی مقام پر ایک ہی شخص روایت کرے؛ اس کی دو قسمیں ہیں: فردِ مطلق، جب غرابت سند کی اصل میں ہو، اور فردِ نسبی، جب تفرد سند کے درمیان کسی خاص شخص کے لحاظ سے ہو؛ غریب اور فرد مترادف ہیں، مگر اہلِ اصطلاح مطلق کو زیادہ تر فرد اور نسبی کو غریب کہتے ہیں {cite:nuzhat-al-nazar-itr-bushra-2011 p. 45-52}۔"
