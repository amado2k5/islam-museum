  ar: "كتاب الأعمال كما يصفه الشيخ عمر عبد الكافي في سلسلة «الفوز المبين»: تطاير الصحف وتعليقها في الأعناق، وأخذ الكتب من جهات مختلفة، وقراءته كما تُقرأ نتيجة الامتحان، وإحصاؤه كل صغيرة وكبيرة يوم القيامة."
  en: "The book of deeds as Sheikh Omar Abdelkafy describes it in the series 'Al Fawzu Al Moubeen': the sheets flying and hanging from the necks, the books received from different directions, reading it as an examination result is read, and its counting of every small and great thing on the Day of Judgement."
