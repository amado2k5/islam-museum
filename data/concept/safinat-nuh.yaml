label:
  ar: سفينة نوح
  en: Noah's ark
  ur: نوح کی کشتی
summary:
  ar: "أوحى الله إلى نوح أن اصنع الفلك بأعيننا ووحينا، فحمل فيها من كل زوجين اثنين وأهله ومن آمن، وسارت بهم في موج كالجبال حتى استوت على الجودي — ذات ألواح ودسر."
  en: "God revealed to Noah: build the ark under Our eyes and revelation; he carried in it a pair of every kind, his family and the believers, and it sailed with them through mountain-like waves until it settled on al-Judi — of planks and nails."
  ur: "اللہ نے نوح کو وحی کی: ہماری نگرانی اور وحی میں کشتی بناؤ؛ اس نے ہر قسم کے جوڑے، اپنے گھر والوں اور مومنوں کو سوار کیا اور وہ پہاڑ جیسی لہروں میں چلی یہاں تک کہ جودی پر اتر آئی — تختوں اور میخوں والی۔"
