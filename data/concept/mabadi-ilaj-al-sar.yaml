id: "concept/mabadi-ilaj-al-sar"
class: "concept"
kind: "scientific"
label:
  ar: "مبادئ علاج الصرع وتدبيره"
  en: "Principles of the treatment and regimen of epilepsy"
  ur: "صرع کے علاج اور تدبیر کے اصول"
  es: "Principios del tratamiento y régimen de la epilepsia"
  fr: "Principes du traitement et du schéma thérapeutique de l'épilepsie"
  tr: "Epilepsi tedavi ve yönetiminin ilkeleri"
  id: "Prinsip pengobatan dan pengelolaan epilepsi"
summary:
  ar: "أول تدبير الصرع اجتناب الأسباب المحرّكة؛ صرع الصبيان بإصلاح غذاء المرضعة؛ الاحتراز من الإمتلاء وسوء الهضم والمغافصات، الاعتدال في النوم والرياضة والشراب، الاستفراغ في الربيع، وإبقاء الرأس منتصباً وجذب المواد إلى أسفل {cite:canon-ibn-sina-print-v2 p.126} {cite:canon-ibn-sina-print-v2 p.127} {cite:canon-ibn-sina-print-v2 p.128}"
  en: "The first rule of epilepsy's regimen is avoiding its provoking causes; children's epilepsy is treated through the nurse's milk; guarding against fullness, bad digestion and sudden frights; moderation in sleep, exercise and drink; evacuation in spring; keeping the head upright and drawing the matter downward {cite:canon-ibn-sina-print-v2 p.126} {cite:canon-ibn-sina-print-v2 p.127} {cite:canon-ibn-sina-print-v2 p.128}"
  ur: "صرع کے تدبیر کا پہلا اصول اس کے بھڑکانے والے اسباب سے بچنا ہے؛ بچوں کے صرع کا علاج دایہ کی خوراک کے اصلاح سے؛ امتلاء، سوء ہضم اور اچانک خوف سے بچنا؛ نیند، ورزش اور مشروب میں اعتدال؛ بہار میں استفراغ؛ سر کو سیدھا رکھنا اور مادوں کو نیچے کھینچنا {cite:canon-ibn-sina-print-v2 p.126} {cite:canon-ibn-sina-print-v2 p.127} {cite:canon-ibn-sina-print-v2 p.128}۔"
  es: "La primera regla del régimen de la epilepsia es evitar sus causas desencadenantes; la epilepsia infantil se trata con leche materna; evitar la hinchazón, la mala digestión y los sustos repentinos; moderación en el sueño, el ejercicio y la bebida; evacuación en primavera; mantener la cabeza erguida y dirigir la materia hacia abajo {cite:canon-ibn-sina-print-v2 p.126} {cite:canon-ibn-sina-print-v2 p.127} {cite:canon-ibn-sina-print-v2 p.128}"
  fr: "La première règle du traitement de l'épilepsie est d'éviter ses facteurs déclenchants; l'épilepsie infantile est traitée par l'allaitement maternel; il faut se prémunir contre la satiété, les troubles digestifs et les frayeurs soudaines; la modération est de mise en matière de sommeil, d'exercice et de consommation de boissons; il est conseillé d'aller à la selle au printemps; il faut maintenir la tête droite et favoriser le transit intestinal. {cite:canon-ibn-sina-print-v2 p.126} {cite:canon-ibn-sina-print-v2 p.127} {cite:canon-ibn-sina-print-v2 p.128}"
  tr: "Epilepsinin ilk önlemi tetikleyicilerden kaçınmaktır; bebek epilepsisi için besleyen annenin mamasını düzelterek; tokluk, hazımsızlık ve squat'tan kaçınmak; orta düzeyde uyku, egzersiz ve içki; ilkbaharda kusmak; başı dik tutmak ve maddeleri aşağı çekmek {cite:canon-ibn-sina-print-v2 s.126} {cite:canon-ibn-sina-print-v2 s.127} {cite:canon-ibn-sina-print-v2 s.128}"
  id: "Langkah pertama epilepsi adalah menghindari pemicu; epilepsi bayi dengan mengoreksi makanan ibu yang menyusu; menghindari kenyang, gangguan pencernaan, dan jongkok; tidur sedang, olahraga, dan minum; muntah di musim semi; menjaga kepala tetap tegak dan menarik zat ke bawah {cite:canon-ibn-sina-print-v2 hlm.126} {cite:canon-ibn-sina-print-v2 hlm.127} {cite:canon-ibn-sina-print-v2 hlm.128} {cite:canon-ibn-sina-print-v2 hlm.128}"
