label:
  ar: "ثعبان موسى"
  en: "Moses' serpent"
  ur: "موسیٰ کا سانپ"
  es: "La serpiente de Moisés"
  fr: "Le serpent de Moïse"
  tr: "Musa Yılanı"
  id: "Moses Snake"
summary:
  ar: "عصا موسى إذا ألقاها تهتزّ كأنها جأنّ وتلقف ما يأفكون حية تسعى تلقف حبال السحرة وعصيّهم، قال الله لموسى ألقِ ما في يمينك."
  en: "Moses' staff, when cast, writhed as though it were a serpent and swallowed what the magicians faked — a living snake running upon their ropes and staffs. God said to Moses: cast what is in your right hand."
  ur: "موسیٰ کی لاٹھی جب ڈالی جاتی تو سانپ کی طرح ہلتی اور جادوگروں کی بنائی باتیں نگل جاتی — ان کی رسیوں اور لاٹھیوں پر دوڑتی جیتی سانپ۔ اللہ نے موسیٰ سے کہا: جو تیرے دائیں ہاتھ میں ہے ڈال دے۔"
  es: "Cuando Moisés lanzó su vara, esta se retorció como una serpiente y se tragó lo que los magos simulaban: una serpiente viva que corría sobre sus cuerdas y varas. Dios le dijo a Moisés: «Lanza lo que tienes en tu mano derecha»."
  fr: "Le bâton de Moïse, lorsqu'il fut jeté, se tordit comme un serpent et engloutit ce que les magiciens simulaient: un serpent vivant courant sur leurs cordes et leurs bâtons. Dieu dit à Moïse: « Jette ce qui est dans ta main droite. »"
  tr: "Musa'nın asası atıldığında, sanki ne yaptıklarını yakalayıp gelmiş gibi titriyordu; bir yılan büyücülerin iplerini ve asalarını yakalamaya çalışıyordu. Tanrı Musa'ya dedi ki, 'Sağ elinde olanı at.'"
  id: "Ketika tongkat Musa dibuang, ia akan bergetar seolah-olah datang dan menangkap apa yang mereka lakukan, seekor ular berusaha meraih tali dan tongkat para penyihir. Tuhan berkata kepada Musa, 'Lemparkan apa yang ada di tangan kananmu.'"
