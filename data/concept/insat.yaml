id: concept/insat
class: concept
kind: term
label: { ar: "الإنصات", en: "Insat (silent attentive listening, and its rulings in worship)" }
summary:
  ar: "الإنصات لغة واصطلاحا السكوت للاستماع، وعرّفه بعضهم بالسكوت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3505} وهو يفارق الاستماع، لأن الاستماع قصد السماع بغية فهم المسموع، والإنصات سكوت بقصد الاستماع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3505} والسماع لا يشترط فيه قصد المسموع، أما الإنصات فيشترط فيه قصده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3506} ويجب الإنصات في خطبة الجمعة عند الجمهور على من حضرها، ويكون في خطبة العيدين كالجمعة عند الحنفية والشافعية ومندوبا عند المالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3506} والإنصات لقراءة القرآن مطلوب شرعا، في الصلاة عند جهر الإمام وخارجها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3506}"
  en: "Insat is lexically and in usage silence for listening; some define it as silence alone. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3505} It differs from istima', which is the intent to hear in order to grasp what is heard; insat is silence with the intent to listen. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3505} Sama' does not require intent to the thing heard, whereas insat does. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3506} The majority hold silent attention obligatory on those present at the Friday sermon, and the Hanafis and Shafi'is hold the same for the Eid sermons, while the Malikis hold it recommended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3506} Listening to the recitation of the Qur'an, both within prayer when the imam recites aloud and outside it, is sought by the law. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3506}"
