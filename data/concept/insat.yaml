id: concept/insat
class: concept
kind: term
label: { ar: "الإنصات", en: "Insat (silent attentive listening, and its rulings in worship)", es: "Insat (escucha silenciosa y atenta, y sus preceptos en el culto)", fr: "Insat (l'écoute attentive et silencieuse, et ses règles en matière de culte)" }
summary:
  ar: "الإنصات لغة واصطلاحا السكوت للاستماع، وعرّفه بعضهم بالسكوت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3505} وهو يفارق الاستماع، لأن الاستماع قصد السماع بغية فهم المسموع، والإنصات سكوت بقصد الاستماع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3505} والسماع لا يشترط فيه قصد المسموع، أما الإنصات فيشترط فيه قصده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3506} ويجب الإنصات في خطبة الجمعة عند الجمهور على من حضرها، ويكون في خطبة العيدين كالجمعة عند الحنفية والشافعية ومندوبا عند المالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3506} والإنصات لقراءة القرآن مطلوب شرعا، في الصلاة عند جهر الإمام وخارجها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3506}"
  en: "Insat is lexically and in usage silence for listening; some define it as silence alone. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3505} It differs from istima', which is the intent to hear in order to grasp what is heard; insat is silence with the intent to listen. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3505} Sama' does not require intent to the thing heard, whereas insat does. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3506} The majority hold silent attention obligatory on those present at the Friday sermon, and the Hanafis and Shafi'is hold the same for the Eid sermons, while the Malikis hold it recommended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3506} Listening to the recitation of the Qur'an, both within prayer when the imam recites aloud and outside it, is sought by the law. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3506}"
  es: "Insat es léxicamente y en el uso silencio para escuchar; algunos lo definen como silencio solo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3505} Se diferencia de istima', que es la intención de oír para comprender lo que se oye; insat es silencio con la intención de escuchar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3505} Sama' no requiere intención hacia lo que se oye, mientras que insat sí. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3506} La mayoría sostiene que la atención silenciosa es obligatoria para los presentes en el sermón del viernes, y los hanafíes y shafi'ís sostienen lo mismo para los sermones del Eid, mientras que los malikíes lo consideran recomendable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3506} Escuchar la recitación del Corán, tanto durante la oración cuando el imán recita en voz alta como fuera de ella, es un precepto legal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3506}"
  fr: "L'insat désigne, lexicalement et dans l'usage, le silence consacré à l'écoute; certains le définissent comme le silence seul. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3505} Il diffère de l'istima', qui est l'intention d'écouter pour comprendre ce qui est entendu; l'insat est le silence accompagné de l'intention d'écouter. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3505} Le sama' n'exige pas d'intention particulière pour ce qui est entendu, contrairement à l'insat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3506} La majorité considère l'attention silencieuse comme obligatoire pour les personnes présentes au sermon du vendredi, et les hanafites et les chaféites ont la même opinion pour les sermons de l'Aïd, tandis que les malikites la recommandent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3506} L'écoute de la récitation du Coran, tant pendant la prière lorsque l'imam récite à haute voix qu'en dehors, est recommandée par la loi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3506}"
