label:
  ar: "آفات اللسان"
  en: "The faults of the tongue (afat al-lisan)"
  ur: "زبان کی آفات"
summary:
  ar: "آفات اللسان عنوان سلسلة رمضانية لعمر عبد الكافي، يعدّ فيها من آفات اللسان المنّ بالعطاء، والدعاء لغير الله، والدعاء على النفس والأولاد، وسبّ الصحابة، وترك ستر المسلم، إلى جانب الغيبة والنميمة والمراء والجدال والكذب والاستهزاء، ثم يختم بعلاجها."
  en: "'The faults of the tongue' is the title of a Ramadan series by Omar Abdelkafy, in which he counts among them reminding people of one's gifts, calling on other than God, cursing oneself and one's children, reviling the Companions and failing to cover a Muslim's fault, beside backbiting, talebearing, wrangling, lying and mockery, and ends with their remedy."
  ur: "«زبان کی آفات» عمر عبد الکافی کے ایک رمضانی سلسلے کا عنوان ہے، جس میں وہ احسان جتانا، غیر اللہ کو پکارنا، اپنے اور اولاد کے خلاف بددعا، صحابہ کو برا کہنا اور مسلمان کا عیب نہ چھپانا، نیز غیبت، چغلی، جھگڑا، جھوٹ اور تمسخر کو زبان کی آفات میں شمار کرتے ہیں، اور آخر میں ان کا علاج بیان کرتے ہیں۔"
