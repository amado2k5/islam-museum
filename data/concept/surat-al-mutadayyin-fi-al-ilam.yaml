  id: reflection-of-reality
  stance:
    ar: "الصورة انعكاس لواقع بعض المتدينين، مع ضعف في الكفاءة لا مؤامرة"
    en: "The image reflects the reality of some religious people, with a lack of craft rather than a conspiracy"
    ur: "تصویر بعض دینداروں کی حقیقت کا عکس ہے، جس میں سازش کے بجائے فنی مہارت کی کمی ہے"
  summary:
    ar: "رأي الكاتب السينمائي محمد حلمي هلال وإعلامي من الضيوف: لا ينبغي تفسير الأمور بمنطق المؤامرة، فالكاتب والمخرج والممثلون مسلمون، وفي الواقع متطرفون يستخدمون الدين، والدراما تعكس الواقع لكن بنسبة غير متناسبة وأحياناً بلا كفاءة؛ والكتّاب محصورون بين ضغط السلطات وضغط رجال دين غير مستنيرين {cite:assabile-tareq-al-suwaidan al-wassitiya/ep31 00:39:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep31 00:40:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep31 00:41:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep31 00:31:00}."
    en: "The view of the screenwriter Muhammad Hilmi Hilal and a broadcaster among the guests: matters should not be read as a conspiracy, since the writer, director and actors are Muslims; there are extremists who use religion; drama reflects reality but out of proportion and sometimes without craft; and writers are squeezed between the pressure of authorities and that of unenlightened men of religion {cite:assabile-tareq-al-suwaidan al-wassitiya/ep31 00:39:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep31 00:40:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep31 00:41:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep31 00:31:00}."
    ur: "فلمی مصنف محمد حلمی ہلال اور ایک میڈیا مہمان کی رائے: معاملات کو سازش کی منطق سے نہ سمجھا جائے، کیونکہ مصنف، ہدایت کار اور اداکار مسلمان ہیں؛ ایسے انتہا پسند موجود ہیں جو دین کو استعمال کرتے ہیں؛ ڈراما حقیقت کا عکس ہے مگر غیر متناسب طور پر اور کبھی مہارت کے بغیر؛ اور مصنفین حکام کے دباؤ اور غیر روشن خیال اہلِ دین کے دباؤ کے درمیان پھنسے ہیں {cite:assabile-tareq-al-suwaidan al-wassitiya/ep31 00:39:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep31 00:40:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep31 00:41:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep31 00:31:00}۔"
