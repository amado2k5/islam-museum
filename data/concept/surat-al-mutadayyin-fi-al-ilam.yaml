label:
  ar: "صورة المتدين في الإعلام العربي المرئي"
  en: "The image of the religious person in Arab visual media"
  ur: "عرب بصری ذرائع ابلاغ میں دیندار شخص کی تصویر"
issue:
  ar: "هل الصورة الغالبة للمتدين في التلفزيون والسينما والمسرح العربي سلبية، وهل تشويهها متعمد أم عفوي أم انعكاس لواقع بعض المتدينين، ومن المسؤول الأول عن تحسينها؟"
  en: "Is the dominant image of the religious person in Arab television, cinema and theatre negative; is its distortion deliberate, unintended, or a reflection of some religious people's reality; and who is first responsible for improving it?"
  ur: "کیا عرب ٹیلی وژن، سنیما اور تھیٹر میں دیندار شخص کی غالب تصویر منفی ہے؛ کیا اس کا بگاڑ دانستہ ہے، غیر دانستہ، یا بعض دینداروں کی حقیقت کا عکس؛ اور اسے بہتر بنانے کی اولین ذمہ داری کس پر ہے؟"
summary:
  ar: "حلقة «الوسطية» عن صورة المتدين في الإعلام العربي المرئي، مع كاتب سينمائي وإعلاميين ونقاد وأساتذة أدب. صوّت جمهور الاستوديو بنسبة 77% أن الصورة الغالبة سلبية و18% إيجابية و5% محايدة؛ ورأى 76% أن تشويهها متعمد و8% أنه عفوي و16% أنه انعكاس لواقع بعض المتدينين؛ وانقسموا 51% إلى 49% بين تحميل الدعاة والمؤسسات الدينية أو الإعلاميين والمنتجين المسؤولية الأولى عن تحسينها. وختم المقدّم بأن القطيعة بين الدين والفن هي التي أنتجت هذه الصورة، وأن الحل في تزاوج الطرفين."
  en: "The 'Al-Wasatiyya' episode on the image of the religious person in Arab visual media, with a screenwriter, broadcasters, critics and professors of literature. The studio audience voted 77% that the dominant image is negative, 18% positive and 5% neutral; 76% saw its distortion as deliberate, 8% as unintended and 16% as a reflection of some religious people's reality; and they split 51% to 49% between placing first responsibility for improving it on preachers and religious institutions or on media people and producers. The presenter closed by saying the estrangement between religion and art produced this image, and that the remedy is to bring the two together."
  ur: "«الوسطیہ» کی وہ قسط جو عرب بصری ذرائع ابلاغ میں دیندار شخص کی تصویر پر ہے، ایک فلمی مصنف، میڈیا سے وابستہ افراد، نقادوں اور ادب کے اساتذہ کے ساتھ۔ اسٹوڈیو حاضرین میں 77% نے غالب تصویر کو منفی، 18% نے مثبت اور 5% نے غیر جانبدار کہا؛ 76% نے اس کے بگاڑ کو دانستہ، 8% نے غیر دانستہ اور 16% نے بعض دینداروں کی حقیقت کا عکس سمجھا؛ اور تحسین کی اولین ذمہ داری کے بارے میں وہ 51% اور 49% میں بٹ گئے: داعی اور دینی ادارے، یا میڈیا والے اور پروڈیوسر۔ میزبان نے آخر میں کہا کہ دین اور فن کے درمیان قطع تعلق نے یہ تصویر پیدا کی، اور حل دونوں کو یکجا کرنے میں ہے۔"
perspectives:
- tradition: sunni
  id: deliberate-distortion
  stance:
    ar: "التشويه متعمد وله جذور في الإعلام الغربي وفي هيمنة تيار غير إسلامي على الكتابة"
    en: "The distortion is deliberate, rooted in Western media and in the dominance of a non-Islamic current in writing"
    ur: "بگاڑ دانستہ ہے، جس کی جڑیں مغربی میڈیا اور تحریر پر غیر اسلامی رجحان کے غلبے میں ہیں"
  summary:
    ar: "رأي أغلب جمهور الاستوديو (76%) وأستاذ الأدب الدكتور عبد الله وناقد من الضيوف: الصورة النمطية للمتدين، من المعتوه والساذج إلى الإرهابي، تكررت حتى صارت قاعدة، وورث الإعلام العربي جزءاً منها من صورة العربي الشرير في أفلام هوليوود، وأفرغ الإسلاميون ساحة الأدب والفن لغيرهم {cite:assabile-tareq-al-suwaidan al-wassitiya/ep31 00:34:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep31 00:19:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep31 00:43:00}."
    en: "The view of most of the studio audience (76%), the literature professor Dr Abdallah and a critic among the guests: the stereotype of the religious person, from simpleton to terrorist, has been repeated until it became the rule; Arab media inherited part of it from the evil Arab of Hollywood films; and Islamists left the field of literature and art to others {cite:assabile-tareq-al-suwaidan al-wassitiya/ep31 00:34:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep31 00:19:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep31 00:43:00}."
    ur: "اسٹوڈیو کے اکثر حاضرین (76%)، ادب کے استاد ڈاکٹر عبد اللہ اور ایک نقاد مہمان کی رائے: دیندار کی دقیانوسی تصویر، سادہ لوح سے دہشت گرد تک، اتنی دہرائی گئی کہ قاعدہ بن گئی؛ عرب میڈیا نے اس کا کچھ حصہ ہالی وڈ فلموں کے برے عرب سے ورثے میں پایا؛ اور اسلام پسندوں نے ادب و فن کا میدان دوسروں کے لیے خالی چھوڑ دیا {cite:assabile-tareq-al-suwaidan al-wassitiya/ep31 00:34:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep31 00:19:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep31 00:43:00}۔"
