- tradition: sunni
  id: presenter-art-and-religion
  stance:
    ar: "رأي المقدّم: القطيعة بين الدين والفن أصل المشكلة، والحل تزاوجهما"
    en: "The presenter's view: the estrangement of religion and art is the root of the problem, and the remedy is their union"
    ur: "میزبان کی رائے: دین اور فن کا قطع تعلق مسئلے کی جڑ ہے، اور حل ان کا ملاپ ہے"
  summary:
    ar: "رأي طارق السويدان (رأي المتكلم): لو كانت نسبة الإرهابيين بين المتدينين واحداً في الألف، وهو يراها أعلى من الواقع، فلا ينبغي أن يُعرضوا بنسبة أكبر منها؛ ومن الخطأ ربط المسألة بنظرية المؤامرة كما من الخطأ أن يرى الإسلاميون أهل الفن كلهم فسقة؛ والمجال الإعلامي أبطأ مجالات الصحوة نمواً {cite:assabile-tareq-al-suwaidan al-wassitiya/ep31 00:47:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep31 00:48:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep31 01:10:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep31 01:11:30}."
    en: "Tareq al-Suwaidan's view (the speaker's opinion): if terrorists are one in a thousand among religious people, a figure he thinks is higher than reality, they should not be shown in a larger proportion than that; it is wrong to tie the matter to conspiracy theory, just as it is wrong for Islamists to see all artists as sinners; and media is the slowest-growing field of the Islamic revival {cite:assabile-tareq-al-suwaidan al-wassitiya/ep31 00:47:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep31 00:48:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep31 01:10:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep31 01:11:30}."
    ur: "طارق السویدان کی رائے (متکلم کی رائے): اگر دینداروں میں دہشت گرد ہزار میں ایک ہوں، اور وہ اس عدد کو بھی حقیقت سے زیادہ سمجھتے ہیں، تو انہیں اس سے بڑی نسبت میں نہ دکھایا جائے؛ معاملے کو سازشی نظریے سے جوڑنا غلط ہے، جیسے اسلام پسندوں کا تمام اہلِ فن کو فاسق سمجھنا غلط ہے؛ اور میڈیا اسلامی بیداری کا سب سے سست رفتار شعبہ ہے {cite:assabile-tareq-al-suwaidan al-wassitiya/ep31 00:47:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep31 00:48:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep31 01:10:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep31 01:11:30}۔"
