label:
  ar: القيامة الكبرى
  en: The Greater Resurrection
  ur: کبری قیامت
summary:
  ar: "القيامة الكبرى في القرآن والسنة: يوم القيامة الذي يُبعث فيه الناس من قبورهم إلى المحشر، يذكر أنها من أشراط الساعة، وأن فيها من الفزع ما لا يوصف، وأن الله يبعث من في القبور كما يبعث من في الأرض."
  en: "The Greater Resurrection in Qur'an and Sunnah: the Day of Resurrection when people are raised from their graves to the Gathering Place — a sign of the Hour, a day of indescribable terror, when God raises those in the graves as He raises those on the earth."
  ur: "کبری قیامت قرآن و سنت میں: یوم قیامت جب لوگ قبروں سے محشر میں اٹھائے جاتے ہیں — ساعت کی نشانیوں میں سے، ایک ایسا دن جس کا خوف بیان نہیں کیا جا سکتا، جب اللہ قبروں سے اٹھاتا ہے جیسے زمین کے لوگوں کو اٹھاتا ہے۔"
