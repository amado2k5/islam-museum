id: concept/al-qiyamah-kubra
class: concept
kind: belief
label:
  ar: القيامة الكبرى
  en: The Greater Resurrection
  fr: "La Grande Résurrection"
  ur: کبری قیامت
  es: "La Gran Resurrección"
  tr: "Büyük Diriliş"
  id: "Kebangkitan Besar"
summary:
  ar: "القيامة الكبرى في القرآن والسنة: يوم القيامة الذي يُبعث فيه الناس من قبورهم إلى المحشر، يذكر أنها من أشراط الساعة، وأن فيها من الفزع ما لا يوصف، وأن الله يبعث من في القبور كما يبعث من في الأرض."
  en: "The Greater Resurrection in Qur'an and Sunnah: the Day of Resurrection when people are raised from their graves to the Gathering Place — a sign of the Hour, a day of indescribable terror, when God raises those in the graves as He raises those on the earth."
  fr: "La Grande Résurrection dans le Coran et la sunna : le Jour de la Résurrection, où les gens sont relevés de leurs tombes et conduits au lieu du Rassemblement. C’est un signe de l’Heure, un jour de terreur indescriptible où Dieu relève ceux qui sont dans les tombes comme il relève ceux qui sont sur la terre."
  ur: "کبری قیامت قرآن و سنت میں: یوم قیامت جب لوگ قبروں سے محشر میں اٹھائے جاتے ہیں — ساعت کی نشانیوں میں سے، ایک ایسا دن جس کا خوف بیان نہیں کیا جا سکتا، جب اللہ قبروں سے اٹھاتا ہے جیسے زمین کے لوگوں کو اٹھاتا ہے۔"
  es: "La Gran Resurrección en el Corán y la Sunnah: el Día de la Resurrección, cuando las personas son elevadas de sus tumbas al Lugar de Reunión, una señal de la Hora, un día de terror indescriptible, cuando Dios resucita a los que están en las tumbas como resucita a los que están en la tierra."
  tr: "Kur'an ve Sünnet'teki Büyük Diriliş: İnsanların mezarlarından Diriltilip Diriliş Günü'ne kadar dirileceği Diriliş Günü. Bunun Saatin işaretlerinden biri olduğu, tarif edilemez bir korku içerdiği ve Allah'ın mezardakileri yeryüzündekileri dirilteceği belirtilir."
  id: "Kebangkitan Agung dalam Al-Qur'an dan Sunnah: Hari Kebangkitan ketika manusia akan bangkit dari kubur hingga Hari Kebangkitan. Dikatakan bahwa ini adalah salah satu tanda Waktu, mengandung ketakutan yang tak terlukiskan, dan Allah akan membangkitkan mereka yang di dalam kubur dan yang di bumi."
