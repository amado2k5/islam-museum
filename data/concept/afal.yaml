id: concept/afal
class: concept
kind: legal
label:
  ar: "العَفَل"
  en: "Fleshy growth in the wife's womb and the right to annul (afal)"
  fr: "Excroissance charnue dans la matrice de l’épouse et droit à l’annulation (afal)"
  ur: "عفل ⁦(عورت کا عیب)⁩"
  es: "Crecimiento carnoso en el útero de la esposa y el derecho a anular (afal)"
  tr: "Al-Afal"
  id: "Al-Afal"
summary:
  ar: "العفل في اللغة لحم ينبت في قبل المرأة ويكون بعد الولادة لا في الأبكار، وقيل ورم يضيق الفرج حتى يمتنع الإيلاج {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11673}. ويفرق بعض الفقهاء بينه وبين الرتق، فالعفل يكون بعد الولادة، والرتق بأصل الخلقة، وكلاهما من العيوب التي تثبت الخيار في النكاح {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11674}. ذهب المالكية والحنابلة إلى أن العفل من العيوب التي يثبت بها للزوج خيار فسخ النكاح، لأنه يمنع المقصود الأصلي من النكاح، وذهب أبو حنيفة وأبو يوسف إلى أنه لا خيار لواحد من الزوجين بذلك {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11674}. وذكر الشافعية الرتق والقرن من العيوب المختصة بالمرأة التي يثبت بها الخيار {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11674}."
  en: "In the lexicon, afal is a fleshy growth in a woman's genital passage, which arises after childbirth and not in virgins; some say it is a swelling that narrows the passage until penetration is impossible {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11673}. Some jurists distinguish it from ratq, a closure from birth; both are defects that give an option to end the marriage {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11674}. The Malikis and Hanbalis hold that it gives the husband an option to annul the marriage, since it defeats the marriage's main purpose; Abu Hanifa and Abu Yusuf hold that neither spouse has such an option {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11674}. The Shafi'is count ratq and qaran, another closure, as defects peculiar to women that give the option {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11674}."
  fr: "Dans le lexique, afal désigne une excroissance charnue du canal génital de la femme, qui apparaît après un accouchement et non chez les vierges. Certains parlent d’une tuméfaction qui rétrécit le canal au point de rendre la pénétration impossible {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11673}. Des juristes la distinguent du ratq, occlusion présente dès la naissance ; tous deux sont considérés comme des défauts ouvrant la possibilité de mettre fin au mariage {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11674}. Pour les malikites et les hanbalites, l’époux peut demander l’annulation parce que cette affection fait obstacle à ce qu’ils tiennent pour la finalité principale du mariage ; pour Abu Hanifa et Abu Yusuf, aucun des conjoints n’a cette possibilité {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11674}. Les chaféites rangent le ratq et le qaran, une autre forme d’occlusion, parmi les défauts propres aux femmes qui ouvrent cette possibilité {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11674}."
  es: "En el léxico, afal es un crecimiento carnoso en el conducto genital de una mujer, que surge después del parto y no en vírgenes; algunos dicen que es una hinchazón que estrecha el conducto hasta que la penetración es imposible {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11673}. Algunos juristas lo distinguen de ratq, un cierre desde el nacimiento; ambos son defectos que dan la opción de terminar el matrimonio {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11674}. Los malikíes y hanbalíes sostienen que le da al esposo la opción de anular el matrimonio, ya que frustra el propósito principal del matrimonio; Abu Hanifa y Abu Yusuf sostienen que ninguno de los cónyuges tiene esa opción {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.11673} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.11674}. Los Shafi'is cuentan el ratq y el qaran, otra clausura, como defectos propios de las mujeres que dan la opción {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.11674}."
  ur: "لغت میں، افل عورت کے اعضاء میں ایک مانسل اضافہ ہے، جو بچے کی پیدائش کے بعد پیدا ہوتا ہے نہ کہ کنواریوں میں؛ بعض کہتے ہیں کہ یہ ایک سوجن ہے جو راستے کو اس وقت تک تنگ کر دیتی ہے جب تک دخول نا ممکن ہو جائے بعض فقہاء اسے رتق سے ممتاز کرتے ہیں، پیدائش سے بندش۔ دونوں ایسے عیب ہیں جو نکاح کو ختم کرنے کا اختیار دیتے ہیں {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 11673} مالکیوں اور حنبلیوں کا خیال ہے کہ اس سے شوہر کو نکاح فسخ کرنے کا اختیار ملتا ہے، کیونکہ اس سے نکاح کا اصل مقصد ختم ہوجاتا ہے۔ ابوحنیفہ اور ابو یوسف کا خیال ہے کہ میاں بیوی میں سے کسی کے پاس بھی ایسا اختیار نہیں ہے {حوالہ:فقہ الموسوعہ کویتیہ نور-v3 صفحہ 11673} شافعیوں نے رتق اور قرآن کو شمار کیا ہے، ایک اور بندش، عورتوں کے لیے مخصوص عیب کے طور پر جو کہ اختیار دیتے ہیں {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 11674}۔"
  tr: "Dilbilimde, 'afal' kadının alnında büyüyen ve doğumdan sonra ortaya çıkan 'et'tir, bakirelerde değil. Ayrıca, vajinayı daraltan ve penetrasyonu imkansız hale getiren bir tümör olduğu da söylenir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11673}. Bazı hukukçular bunu 'al-ratq'tan ayırır; 'al-'afat' doğumdan sonra oluşur ve 'al-taq' yaratılışın kaynağıdır. Her ikisi de evlilik seçeneğini belirleyen kusurlardır {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11674}. Maliki ve Hanbaliler, 'afal'ın kocanın evliliği iptal etme seçeneğine sahip olduğu kusurlardan biri olduğunu, çünkü bunun evliliğin orijinal niyetini engellediğini savunmuşlardır. Abu Hanifa ve Abu Yusuf, hiçbir eşin bunu yapma seçeneğine sahip olmadığını belirtmiştir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11674}. Şafi'ler, 'riqh-mawsua-kuwaitiyya-noor-v3 s.11674} ifadesinin kadınlara özgü kusurlar olarak belirtildiğini ve bu seçeneğin sağlandığını belirtmiştir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11674}."
  id: "Dalam linguistik, 'afal' adalah 'daging' yang tumbuh di dahi wanita dan muncul setelah melahirkan, bukan pada perawan. Juga dikatakan sebagai tumor yang menyempit vagina dan membuat penetrasi menjadi tidak mungkin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11673}. Beberapa ahli hukum membedakan ini dari 'al-ratq'; 'al-'afat' terbentuk setelah lahir, dan 'al-taq' adalah sumber penciptaan. Keduanya adalah cacat yang menentukan pilihan pernikahan {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11674}. Maliki dan Hanbali berargumen bahwa 'afal' adalah salah satu kesalahan di mana suami memiliki opsi untuk membatalkan pernikahan karena hal itu menghalangi niat asli pernikahan. Abu Hanifa dan Abu Yusuf menyatakan bahwa tidak ada pasangan yang memiliki pilihan untuk melakukan ini {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11674}. Para Shafi'i menyatakan bahwa frasa 'riqh-mawsua-kuwaitiyya-noor-v3 hlm.11674} diidentifikasi sebagai cacat khusus pada wanita dan opsi ini diberikan {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11674}."
