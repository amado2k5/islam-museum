id: concept/afal
class: concept
kind: legal
label:
  ar: "العَفَل"
  en: "Fleshy growth in the wife's womb and the right to annul (afal)"
  ur: "عفل (عورت کا عیب)"
summary:
  ar: "العفل في اللغة لحم ينبت في قبل المرأة ويكون بعد الولادة لا في الأبكار، وقيل ورم يضيق الفرج حتى يمتنع الإيلاج {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11673}. ويفرق بعض الفقهاء بينه وبين الرتق، فالعفل يكون بعد الولادة، والرتق بأصل الخلقة، وكلاهما من العيوب التي تثبت الخيار في النكاح {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11674}. ذهب المالكية والحنابلة إلى أن العفل من العيوب التي يثبت بها للزوج خيار فسخ النكاح، لأنه يمنع المقصود الأصلي من النكاح، وذهب أبو حنيفة وأبو يوسف إلى أنه لا خيار لواحد من الزوجين بذلك {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11674}. وذكر الشافعية الرتق والقرن من العيوب المختصة بالمرأة التي يثبت بها الخيار {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11674}."
  en: "In the lexicon, afal is a fleshy growth in a woman's genital passage, which arises after childbirth and not in virgins; some say it is a swelling that narrows the passage until penetration is impossible {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11673}. Some jurists distinguish it from ratq, a closure from birth; both are defects that give an option to end the marriage {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11674}. The Malikis and Hanbalis hold that it gives the husband an option to annul the marriage, since it defeats the marriage's main purpose; Abu Hanifa and Abu Yusuf hold that neither spouse has such an option {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11673} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11674}. The Shafi'is count ratq and qaran, another closure, as defects peculiar to women that give the option {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11674}."
