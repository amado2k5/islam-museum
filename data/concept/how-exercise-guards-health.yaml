summary:
  ar: "يرى ابن سينا أن الرياضة أمنع الأسباب لاجتماع مبادئ الامتلاء، فهي تنعش الحرارة الغريزية وتعود البدن الخفة وتثير حرارة لطيفة تحلل فضل كل يوم، وتصلب المفاصل والأوتار، وتهيئ الأعضاء لقبول الغذاء، ويقع تاركها في الدق {cite:canon-ibn-sina-print-v1 pp.221-222}."
  en: "Ibn Sina holds that exercise is the surest check on the gathering of the first causes of fullness: it revives the innate heat, accustoms the body to lightness, raises a gentle heat that dissolves each day's surplus, hardens joints and tendons, readies the organs to take food, and whoever leaves it often falls into wasting {cite:canon-ibn-sina-print-v1 pp.221-222}."
