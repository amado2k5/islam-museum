label: { ar: "كيف تحفظ الرياضة الصحة عند ابن سينا", en: "How exercise guards health in the Canon", ur: "قانون میں ورزش حفظِ صحت کیسے کرتی ہے", es: "Cómo el ejercicio protege la salud en el Canon", fr: "Comment l'exercice physique préserve la santé dans le Canon", tr: "İbn Sina'ya göre Spor Sağlığı Nasıl Korur", id: "Bagaimana olahraga menjaga kesehatan menurut Ibn Sina" }
summary:
  ar: "يرى ابن سينا أن الرياضة أمنع الأسباب لاجتماع مبادئ الامتلاء، فهي تنعش الحرارة الغريزية وتعود البدن الخفة وتثير حرارة لطيفة تحلل فضل كل يوم، وتصلب المفاصل والأوتار، وتهيئ الأعضاء لقبول الغذاء، ويقع تاركها في الدق {cite:canon-ibn-sina-print-v1 pp.221-222}."
  en: "Ibn Sina holds that exercise is the surest check on the gathering of the first causes of fullness: it revives the innate heat, accustoms the body to lightness, raises a gentle heat that dissolves each day's surplus, hardens joints and tendons, readies the organs to take food, and whoever leaves it often falls into wasting {cite:canon-ibn-sina-print-v1 pp.221-222}."
  es: "Ibn Sina sostiene que el ejercicio es el control más seguro de la acumulación de las primeras causas de la plenitud: reaviva el calor innato, acostumbra al cuerpo a la ligereza, eleva un calor suave que disuelve el excedente de cada día, endurece las articulaciones y los tendones, prepara los órganos para absorber los alimentos, y quien lo abandona a menudo cae en el desgaste {cite:canon-ibn-sina-print-v1 pp.221-222}."
  fr: "Ibn Sina soutient que l'exercice est le meilleur moyen de freiner l'accumulation des premières causes de la satiété: il ravive la chaleur innée, habitue le corps à la légèreté, suscite une douce chaleur qui dissout chaque surplus quotidien, fortifie les articulations et les tendons, prépare les organes à recevoir la nourriture, et quiconque le néglige tombe souvent en dépérissement {cite:canon-ibn-sina-print-v1 pp.221-222}."
  ur: "ابن سینا کا خیال ہے کہ ورزش مکمل ہونے کے پہلے اسباب کو جمع کرنے کے لیے سب سے یقینی جانچ ہے: یہ فطری حرارت کو زندہ کرتی ہے، جسم کو ہلکا پھلکا کرنے کا عادی بناتی ہے، ایک ہلکی حرارت پیدا کرتی ہے جو ہر روز کی اضافی مقدار کو تحلیل کرتی ہے، جوڑوں اور کنڈوں کو سخت کرتی ہے، اعضاء کو خوراک لینے کے لیے تیار کرتی ہے، اور جو اسے چھوڑ دیتا ہے وہ اکثر و بیشتر اس سے متاثر ہوتا ہے۔ صفحہ 221-222}۔"
  tr: "İbn Sina, egzersizin tokluk ilkelerinin yakınlaşmasında en engelleyici neden olduğuna inanır; egzersiz içgüdüsel ısıyı tazeler, hafifliği geri kazandırır, günlük atığı parçalayan, eklemleri ve tendonları sertleştiren, organları yiyecek almaya hazırlayan ve yemeği atış sırasında bırakan nazik bir ısı uyarır. {cite:canon-ibn-sina-print-v1 s.221-222}."
  id: "Ibn Sina percaya bahwa olahraga adalah penyebab paling menghambat konvergensi prinsip kenyang; olahraga menyegarkan panas naluriah, mengembalikan ringan, merangsang panas lembut yang mengurai limbah harian, mengeraskan sendi dan tendon, mempersiapkan organ untuk menerima makanan, dan membiarkannya tetap berdetak {cite:canon-ibn-sina-print-v1 hlm.221-222}."
