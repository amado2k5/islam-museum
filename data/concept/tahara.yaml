label:
  ar: الطهارة
  en: Ritual purity
summary:
  ar: "الطهارة في اصطلاح الفقهاء رفع الحدث وإزالة النجس بالماء أو التيمم، ويقدمها حديث أبي مالك الأشعري في صورة إيمانية كبرى: «الطهور شطر الإيمان» أخرجه مسلم {cite:sahih-muslim 223}، وفي رواية الترمذي «الوضوء شطر الإيمان» وفي رواية معاوية بن سلام عند ابن ماجه «إسباغ الوضوء شطر الإيمان»؛ ويجيء في الحديث نفسه مقروناً بميزان الحمد ونور الصلاة وبرهان الصدقة وضياء الصبر وحجة القرآن، فهو ميزان يزن به العبد أعماله يوم القيامة كما يعرض ابن رجب شرحه."
  en: "Ritual purity in the jurists' terminology is lifting the state of ritual impurity and removing filth with water or tayammum; the hadith of Abu Malik al-Ash'ari sets it in a sweeping faith-scale — 'purity is half of faith', transmitted by Muslim (223), worded 'the ablution is half of faith' in al-Tirmidhi's route and 'perfecting the ablution is half of faith' in Mu'awiya ibn Salam's route in Ibn Majah; within the same hadith it stands alongside the scale-filling praise, prayer as light, almsgiving as proof, patience as radiance and the Qur'an as argument, so that purity is one of the measures by which a servant's works are weighed on the Day of Resurrection, as Ibn Rajab's commentary presents it."
