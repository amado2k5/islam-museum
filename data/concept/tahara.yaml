label:
  ar: الطهارة
  en: Ritual purity
  es: "Pureza ritual"
  fr: "pureté rituelle"
summary:
  ar: "الطهارة في اصطلاح الفقهاء رفع الحدث وإزالة النجس بالماء أو التيمم، ويقدمها حديث أبي مالك الأشعري في صورة إيمانية كبرى: «الطهور شطر الإيمان» أخرجه مسلم {cite:sahih-muslim 223}، وفي رواية الترمذي «الوضوء شطر الإيمان» وفي رواية معاوية بن سلام عند ابن ماجه «إسباغ الوضوء شطر الإيمان»؛ ويجيء في الحديث نفسه مقروناً بميزان الحمد ونور الصلاة وبرهان الصدقة وضياء الصبر وحجة القرآن، فهو ميزان يزن به العبد أعماله يوم القيامة كما يعرض ابن رجب شرحه. وتصف دائرة المعارف الإسلامية للكلمة وجهين: مادياً يتعلق بالمواد التي تجتنب أو تزال، وصورياً يتعلق بأهلية الشخص للشعائر، فالوضوء للحدث الأصغر والغسل لما يمنع صاحبه من الجماعة الدينية كالجنابة والحيض، وتقول إن أحكام الإمامية والزيدية أشد."
  en: "Ritual purity in the jurists' terminology is lifting the state of ritual impurity and removing filth with water or tayammum; the hadith of Abu Malik al-Ash'ari sets it in a sweeping faith-scale — 'purity is half of faith', transmitted by Muslim (223), worded 'the ablution is half of faith' in al-Tirmidhi's route and 'perfecting the ablution is half of faith' in Mu'awiya ibn Salam's route in Ibn Majah; within the same hadith it stands alongside the scale-filling praise, prayer as light, almsgiving as proof, patience as radiance and the Qur'an as argument, so that purity is one of the measures by which a servant's works are weighed on the Day of Resurrection, as Ibn Rajab's commentary presents it. The Encyclopaedia of Islam describes two aspects of the word: a material one, concerning substances to be avoided or removed, and a formal one, concerning a person's fitness for ritual duties, with ablution answering minor events and the full washing answering states such as janaba and menstruation; it says the Imami and Zaydi rules are stricter."
  ur: "فقہاء کی اصطلاح میں طہارت حدث کو دور کرنا اور پانی یا تیمم سے نجاست کو زائل کرنا ہے۔ ابو مالک الاشعری کی حدیث اسے ایک بڑی ایمانی صورت میں پیش کرتی ہے کہ طہور آدھا ایمان ہے، اور ابن رجب کی شرح کے مطابق یہ وہ میزان ہے جس سے بندہ قیامت کے دن اپنے اعمال تولے گا۔ دائرہ معارف اسلامیہ لفظ کے دو پہلو بتاتا ہے: ایک مادی، جس کا تعلق ان اشیاء سے ہے جن سے بچنا یا جنہیں دور کرنا ہے، اور ایک صوری، جس کا تعلق رسمی فرائض کے لیے آدمی کی اہلیت سے ہے، جہاں وضو چھوٹے واقعات کا اور غسل جنابت اور حیض جیسی حالتوں کا جواب ہے، اور وہ کہتا ہے کہ امامیہ اور زیدیہ کے احکام زیادہ سخت ہیں۔"
  es: "La pureza ritual en la terminología de los juristas es levantar el estado de impureza ritual y eliminar la suciedad con agua o tayammum; el hadiz de Abu Malik al-Ash'ari lo sitúa en una amplia escala de fe: \"la pureza es la mitad de la fe\", transmitido por Muslim (223), expresado como \"la ablución es la mitad de la fe\" en la ruta de al-Tirmidhi y \"perfeccionar la ablución es la mitad de la fe\" en la ruta de Mu'awiya ibn Salam en Ibn Majah; dentro del mismo hadiz se encuentra junto con la alabanza que llena la escala, la oración como luz, la limosna como prueba, la paciencia como resplandor y el Corán como argumento, de modo que la pureza es una de las medidas por las cuales se pesan las obras de un siervo en el Día de la Resurrección, como lo presenta el comentario de Ibn Rajab. La Enciclopedia del Islam describe dos aspectos de la palabra: uno material, que se refiere a las sustancias que deben evitarse o eliminarse, y uno formal, que se refiere a la aptitud de una persona para los deberes rituales, donde la ablución responde a eventos menores y el lavado completo responde a estados como la janaba y la menstruación; dice que las reglas imamíes y zaidíes son más estrictas."
  fr: "La pureté rituelle, dans la terminologie des juristes, consiste à lever l'état d'impureté rituelle et à éliminer toute souillure par l'eau ou le tayammum. Le hadith d'Abu Malik al-Ash'ari l'inscrit dans une vaste échelle de foi: « la pureté est la moitié de la foi », rapporté par Muslim (223), formulé comme « l'ablution est la moitié de la foi » dans la version d'al-Tirmidhi et « la perfection de l'ablution est la moitié de la foi » dans la version de Mu'awiya ibn Salam rapportée par Ibn Majah. Dans ce même hadith, elle figure aux côtés de la louange, de la prière, qui représente la lumière, de l'aumône, qui constitue la preuve, de la patience, qui représente le rayonnement, et du Coran, qui sert d'argument. Ainsi, la pureté est l'un des critères par lesquels les œuvres d'un serviteur sont pesées le Jour de la Résurrection, comme le présente le commentaire d'Ibn Rajab. L'Encyclopédie de l'Islam décrit deux aspects du mot: un aspect matériel, concernant les substances à éviter ou à éliminer, et un aspect formel, concernant l'aptitude d'une personne à accomplir ses devoirs rituels, l'ablution correspondant à des événements mineurs et le lavage complet à des états tels que la janaba et les menstruations; elle précise que les règles imamites et zaydites sont plus strictes."
