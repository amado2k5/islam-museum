label:
  ar: الطهارة
  en: Ritual purity
summary:
  ar: "الطهارة في اصطلاح الفقهاء رفع الحدث وإزالة النجس بالماء أو التيمم، ويقدمها حديث أبي مالك الأشعري في صورة إيمانية كبرى: «الطهور شطر الإيمان» أخرجه مسلم {cite:sahih-muslim 223}، وفي رواية الترمذي «الوضوء شطر الإيمان» وفي رواية معاوية بن سلام عند ابن ماجه «إسباغ الوضوء شطر الإيمان»؛ ويجيء في الحديث نفسه مقروناً بميزان الحمد ونور الصلاة وبرهان الصدقة وضياء الصبر وحجة القرآن، فهو ميزان يزن به العبد أعماله يوم القيامة كما يعرض ابن رجب شرحه. وتصف دائرة المعارف الإسلامية للكلمة وجهين: مادياً يتعلق بالمواد التي تجتنب أو تزال، وصورياً يتعلق بأهلية الشخص للشعائر، فالوضوء للحدث الأصغر والغسل لما يمنع صاحبه من الجماعة الدينية كالجنابة والحيض، وتقول إن أحكام الإمامية والزيدية أشد."
  en: "Ritual purity in the jurists' terminology is lifting the state of ritual impurity and removing filth with water or tayammum; the hadith of Abu Malik al-Ash'ari sets it in a sweeping faith-scale — 'purity is half of faith', transmitted by Muslim (223), worded 'the ablution is half of faith' in al-Tirmidhi's route and 'perfecting the ablution is half of faith' in Mu'awiya ibn Salam's route in Ibn Majah; within the same hadith it stands alongside the scale-filling praise, prayer as light, almsgiving as proof, patience as radiance and the Qur'an as argument, so that purity is one of the measures by which a servant's works are weighed on the Day of Resurrection, as Ibn Rajab's commentary presents it. The Encyclopaedia of Islam describes two aspects of the word: a material one, concerning substances to be avoided or removed, and a formal one, concerning a person's fitness for ritual duties, with ablution answering minor events and the full washing answering states such as janaba and menstruation; it says the Imami and Zaydi rules are stricter."
  ur: "فقہاء کی اصطلاح میں طہارت حدث کو دور کرنا اور پانی یا تیمم سے نجاست کو زائل کرنا ہے۔ ابو مالک الاشعری کی حدیث اسے ایک بڑی ایمانی صورت میں پیش کرتی ہے کہ طہور آدھا ایمان ہے، اور ابن رجب کی شرح کے مطابق یہ وہ میزان ہے جس سے بندہ قیامت کے دن اپنے اعمال تولے گا۔ دائرہ معارف اسلامیہ لفظ کے دو پہلو بتاتا ہے: ایک مادی، جس کا تعلق ان اشیاء سے ہے جن سے بچنا یا جنہیں دور کرنا ہے، اور ایک صوری، جس کا تعلق رسمی فرائض کے لیے آدمی کی اہلیت سے ہے، جہاں وضو چھوٹے واقعات کا اور غسل جنابت اور حیض جیسی حالتوں کا جواب ہے، اور وہ کہتا ہے کہ امامیہ اور زیدیہ کے احکام زیادہ سخت ہیں۔"
