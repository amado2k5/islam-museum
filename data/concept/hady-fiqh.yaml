id: concept/hady-fiqh
class: concept
kind: legal
label: { ar: "هَدْي", en: "Hady (animal offered to the Sacred Precinct)" }
summary:
  ar: "الهدي لغة وشرعاً ما يُهدى إلى الحرم من الإبل والبقر والغنم، ويُذكى تقرباً إلى الله في أيام النحر، وهو يختلف عن الأضحية والعقيقة من حيث الوقت والمكان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16486} ينقسم إلى هدي تطوع يسنّ لمن أراد النسك أو أرسل الهدي، وإلى هدي واجب للشكر (على المتمتع والقارن)، وهدي للجبران، وهدي للنذر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16486} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16487} ويجوز ركوب الهدي عند الحاجة من غير ضرر، ويُكره عند المالكية من غير ضرورة، ولا يجوز أكل منه ولا بيعه إذا وجب، ويجب ذبحه في الحرم، وأفضل الهدي البدنة (الإبل) ثم البقرة ثم الشاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16489} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16494} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16496} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16506}"
  en: "The hady, in lexical and legal usage, is the animal (camel, cow or goat) brought to the Sacred Precinct and slaughtered as a devotion during the days of sacrifice; it is distinct from the udhiyya and the aqiqa in time and place. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16486} It falls into voluntary hady (recommended for one performing the rite, or one who sends an animal without going), obligatory hady for thanks (imposed on the tamattu' and qiran pilgrim), hady for compensation, and hady of vow. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16486} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16487} The rider may ride it when needed without harm, though the Malikis dislike riding without necessity; an obligatory hady may not be sold, leased or used, and a donor may not eat from it except in the cases the jurists list. The best animal is the camel, then the cow, then the sheep. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16489} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16494} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16496} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16506}"
