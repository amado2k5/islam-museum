label: { ar: "هَدْي", en: "Hady (animal offered to the Sacred Precinct)", es: "Hady (animal ofrecido al Recinto Sagrado)", fr: "Hady (animal offert au sanctuaire sacré)", ur: "ہادی ⁦(مقدس علاقے کو پیش کردہ جانور)⁩", tr: "Sakin ol", id: "Tenang" }
summary:
  ar: "الهدي لغة وشرعاً ما يُهدى إلى الحرم من الإبل والبقر والغنم، ويُذكى تقرباً إلى الله في أيام النحر، وهو يختلف عن الأضحية والعقيقة من حيث الوقت والمكان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16486} ينقسم إلى هدي تطوع يسنّ لمن أراد النسك أو أرسل الهدي، وإلى هدي واجب للشكر ⁦(على المتمتع والقارن)⁩، وهدي للجبران، وهدي للنذر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16486} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16487} ويجوز ركوب الهدي عند الحاجة من غير ضرر، ويُكره عند المالكية من غير ضرورة، ولا يجوز أكل منه ولا بيعه إذا وجب، ويجب ذبحه في الحرم، وأفضل الهدي البدنة ⁦(الإبل)⁩ ثم البقرة ثم الشاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16489} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16494} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16496} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16506}"
  en: "The hady, in lexical and legal usage, is the animal (camel, cow or goat) brought to the Sacred Precinct and slaughtered as a devotion during the days of sacrifice; it is distinct from the udhiyya and the aqiqa in time and place. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16486} It falls into voluntary hady (recommended for one performing the rite, or one who sends an animal without going), obligatory hady for thanks (imposed on the tamattu' and qiran pilgrim), hady for compensation, and hady of vow. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16486} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16487} The rider may ride it when needed without harm, though the Malikis dislike riding without necessity; an obligatory hady may not be sold, leased or used, and a donor may not eat from it except in the cases the jurists list. The best animal is the camel, then the cow, then the sheep. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16489} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16494} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16496} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16506}"
  es: "El hady, en uso léxico y legal, es el animal (camello, vaca o cabra) llevado al Recinto Sagrado y sacrificado como devoción durante los días de sacrificio; es distinto del udhiyya y el aqiqa en tiempo y lugar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16486} Cae en hady voluntario (recomendado para quien realiza el rito, o quien envía un animal sin ir), hady obligatorio para agradecimiento (impuesto al tamattu' y al peregrino qiran), hady para compensación y hady de voto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16486} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16487} El jinete puede montarlo cuando sea necesario sin daño, aunque a los malikíes no les gusta montar sin necesidad; Un hady obligatorio no puede venderse, arrendarse ni utilizarse, y el donante no puede comer de él salvo en los casos que enumeran los juristas. El mejor animal es el camello, luego la vaca y después la oveja. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16489} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16494} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16496} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16506}"
  fr: "Le hady, dans son usage lexical et juridique, est l'animal (chameau, vache ou chèvre) amené dans l'enceinte sacrée et sacrifié en signe de dévotion durant les jours du sacrifice; il se distingue de l'udhiyya et de l'aqiqa par le temps et le lieu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16486} Il existe quatre types de hady: le hady volontaire (recommandé pour celui qui accomplit le rite ou pour celui qui envoie un animal sans y participer), le hady obligatoire de remerciement (imposé au pèlerin tamattu' et qiran), le hady de compensation et le hady de vœu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16486} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16487} Le cavalier peut monter l'animal en cas de besoin sans risque, bien que les Malikites désapprouvent de le monter sans nécessité. Un hady obligatoire ne peut être ni vendu, ni loué, ni utilisé, et le donateur ne peut en consommer qu'aux fins énumérées par les juristes. Le meilleur animal est le chameau, puis la vache, puis le mouton. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16489} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16494} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16496} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16506}"
  ur: "حادی، لغوی اور قانونی استعمال میں، وہ جانور ⁦(اونٹ، گائے یا بکرا)⁩ ہے جسے مقدس علاقے میں لایا جاتا ہے اور قربانی کے دنوں میں عقیدت کے طور پر ذبح کیا جاتا ہے۔ یہ زمان و مکان میں عقیقہ اور عقیقہ سے الگ ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 صفحہ 16486} یہ رضاکارانہ ہدی میں آتا ہے ⁦(رسم ادا کرنے والے کے لیے تجویز کیا جاتا ہے، یا جو بغیر کسی جانور کو بھیجتا ہے)⁩، شکر کے لیے واجب ہدی ⁦(تمتع اور قیران حاجی پر عائد ہوتا ہے)⁩، اور ہدی کے لیے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16486} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16487} سوار بغیر ضرر کے ضرورت پڑنے پر اس پر سوار ہو سکتا ہے، حالانکہ مالکیہ بغیر ضرورت کے سواری کو ناپسند کرتے ہیں۔ واجب ہدی کو فروخت، کرایہ پر یا استعمال نہیں کیا جا سکتا، اور عطیہ دینے والا اس میں سے نہیں کھا سکتا سوائے ان صورتوں کے جو فقہاء کی فہرست میں ہیں۔ بہترین جانور اونٹ ہے، پھر گائے، پھر بھیڑ۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16489} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16494} صفحہ 16506}"
  tr: "Dilsel ve yasal olarak, deve, inek ve koyun haramına sunulan kurbandır ve kurban günlerinde Allah'a yaklaşmak için kullanılır. Zaman ve mekân açısından kurban ve akikahtan farklıdır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.16486} Ritüeli gerçekleştirmek veya kurban göndermek isteyenler için önerilen gönüllü kurbanlar ile zorunlu şükran (yapan ve karşılaştıranlara), tazminat ve yeminler için verilen kurbanlar olarak ikiye ayrılır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.16486} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16487} Gerekli olduğunda zarar görmeden kurban hayvanlarına binmek caizdir, ancak Malikiler bunu zorunlu olmadan sevmezler. Zorunluysa yemek veya satmak yasaktır ve Haram'da kesilmelidir. En iyi kurban hayvan önce develer, sonra inekler, sonra koyunlardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16489} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16494} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16496} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16506}"
  id: "Secara linguistik dan hukum, korban adalah apa yang dipersembahkan kepada Haram berupa unta, sapi, dan domba, dan digunakan untuk mendekatkan diri kepada Allah selama hari pengorbanan. Ia berbeda dari pengorbanan dan aqiqah dalam hal waktu dan tempat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16486} Korban ini dibagi menjadi korban sukarela yang direkomendasikan bagi mereka yang berniat melakukan ritual atau mengirim korban, dan korban untuk syukur wajib (bagi mereka yang melakukan dan membandingkan), serta sebagai kompensasi dan untuk janji. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16486} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16487} Diperbolehkan menunggang hewan korban jika perlu tanpa membahayakan, tetapi tidak disukai oleh Maliki tanpa kebutuhan. Tidak diperbolehkan dimakan atau dijual jika wajib, dan harus disembelih dalam Haram. Hewan pengorbanan terbaik adalah unta, lalu sapi, lalu domba. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16489} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16494} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16496} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16506}"
