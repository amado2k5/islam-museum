label:
  ar: الصدقة
  en: Charity (sadaqa)
  es: "Caridad"
  fr: "Charité"
  ur: "صدقہ ⁦(صدقہ)⁩"
  tr: "Hayırseverlik"
  id: "Amal"
summary:
  ar: "الصدقة في استعمال الحديثين الخامس والعشرين والسادس والعشرين من الأربعين أوسع من الصدقة بالمال: ظن فقراء الصحابة أن لا صدقة إلا بالأموال فدلهم النبي على صدقات يقدرون عليها — التسبيح والتكبير والتحميد والتهليل والأمر بالمعروف والنهي عن المنكر وعزل الأذى عن الطريق وإعانة الضعيف وهداية الأعمى وإسماع الأصم والأبكم والدلالة على الحاجة والسعي إلى اللهفان، وفي بضع أحدكم صدقة — وكلها صدقة من الإنسان على نفسه؛ وفي حديث حذيفة عند مسلم «كل معروف صدقة» وفي حديث أبي مسعود في الصحيحين «نفقة الرجل على أهله صدقة»؛ وفي حديث أبي هريرة أن على كل سلامى — أي مفصل أو عظم صغير مجوف وقيل ستون وثلاثمئة مفصلاً — صدقة كل يوم تطلع فيه الشمس، وأن ركعتي الضحى تجزئان عنها جميعاً في رواية أبي ذر وبريدة؛ وعند ابن رجب ظاهر الحديث أن المباح كالجماع يُؤجر عليه بنية كطلب الولد الصالح أو الإعفاف، وقال النووي إن فيه دليلاً على أن المباحات تصير طاعات بالنيات الصادقات. وفي حديث أبي هريرة عند مسلم أن ممن يظلهم الله في ظله يوم لا ظل إلا ظله «رجل تصدق بصدقة فأخفاها حتى لا تعلم شماله ما تنفق يمينه» {cite:sahih-muslim 1031}."
  en: "Charity in the usage of the Forty hadiths 25 and 26 is wider than alms of money: the poor Companions supposed there was no charity without wealth, until the Prophet directed them to charities within their power — glorification, magnification, praise, the declaration of unity, commanding right and forbidding wrong, removing harm from the road, aiding the weak, guiding the blind, making the deaf and mute understand, pointing out needs, running to the distressed, and 'in the intercourse of one of you is alms' — all of it a charity from a man upon himself; Hudhayfa's hadith in Muslim runs 'every act of kindness is charity' and Abu Masud's in the two Sahihs 'a man's spending on his family is charity'; in Abu Hurayra's hadith a charity is due on every sulama — joint or small hollow bone, three hundred and sixty joints in one version — each day the sun rises, and two mid-morning rak'as suffice for all of them in the Abu Dharr and Burayda routes; for Ibn Rajab the apparent sense is that a permissible act such as intercourse earns reward by an intention like seeking a righteous child or self-restraint, and al-Nawawi draws from it that permissible things become acts of obedience through sincere intentions."
  es: "La caridad en el uso de los Cuarenta hadices 25 y 26 es más amplia que la limosna de dinero: los Compañeros pobres suponían que no había caridad sin riqueza, hasta que el Profeta los dirigió a las caridades que estaban a su alcance: glorificación, magnificación, alabanza, declaración de unidad, ordenar lo correcto y prohibir lo incorrecto, quitar el peligro del camino, ayudar a los débiles, guiar a los ciegos, hacer entender a los sordos y mudos, señalar las necesidades, correr hacia los afligidos, y 'en el trato de uno de vosotros hay limosna', todo ello una caridad de un hombre hacia sí mismo; el hadiz de Hudhayfa en Muslim dice 'todo acto de bondad es caridad' y el de Abu Masud en los dos Sahihs 'el gasto de un hombre en su familia es caridad'; En el hadiz de Abu Hurayra se debe dar caridad por cada sulama (articulación o hueso hueco pequeño, trescientas sesenta articulaciones en una versión) cada día que sale el sol, y dos rak'as a media mañana bastan para todas ellas en las rutas de Abu Dharr y Burayda; para Ibn Rajab el sentido aparente es que un acto permisible como el coito obtiene recompensa por una intención como buscar un hijo justo o autocontrol, y al-Nawawi extrae de ello que las cosas permisibles se convierten en actos de obediencia a través de intenciones sinceras."
  fr: "La charité, au sens des hadiths 25 et 26 des Quarante Hadiths, a un sens plus large que l'aumône d'argent: les Compagnons pauvres pensaient qu'il n'y avait pas de charité sans richesse, jusqu'à ce que le Prophète les oriente vers des actes de charité à leur portée: glorification, magnification, louange, déclaration d'unité, commandement du bien et interdiction du mal, élimination du danger sur la route, aide aux faibles, guidage des aveugles, éclaircissement des sourds et des muets, signalement des besoins, assistance aux personnes en détresse, et « dans les relations de chacun d'entre vous est une aumône » — tout cela étant une charité d'un homme envers lui-même; le hadith de Hudhayfa rapporté par Muslim dit: « tout acte de bonté est une charité » et celui d'Abu Masud dans les deux Sahihs: « les dépenses d'un homme pour sa famille sont une charité ». Dans le hadith d'Abu Hurayra, une aumône est due pour chaque sulama — articulation ou petit os creux, trois cent soixante articulations selon une version — chaque jour au lever du soleil, et deux rak'as en milieu de matinée suffisent pour toutes sur les itinéraires d'Abu Dharr et de Burayda; pour Ibn Rajab, le sens apparent est qu'un acte permis tel que les rapports sexuels mérite une récompense par une intention comme celle de rechercher un enfant pieux ou la maîtrise de soi, et al-Nawawi en déduit que les choses permises deviennent des actes d'obéissance grâce à des intentions sincères."
  ur: "چالیس احادیث 25 اور 26 کے استعمال میں صدقہ صدقہ سے زیادہ وسیع ہے: غریب صحابہ کا خیال تھا کہ مال کے بغیر کوئی صدقہ نہیں ہے، یہاں تک کہ نبی نے انہیں اپنی طاقت کے اندر صدقہ کرنے کی ہدایت کی - تسبیح، بڑائی، حمد، اتحاد کا اعلان، حق کا حکم اور برائی سے منع کرنا، کمزوری کو دور کرنا، راستے سے نقصان پہنچانا، راستے سے رکاوٹیں دور کرنا، خاموش سمجھنا، ضرورتوں کی نشاندہی کرنا، مصیبت زدہ کی طرف دوڑنا، اور 'تم میں سے کسی کی ہمبستری میں صدقہ ہے' - یہ سب ایک آدمی کی طرف سے اپنے اوپر صدقہ ہے۔ مسلم میں حذیفہ کی حدیث ہے کہ 'ہر احسان کا کام صدقہ ہے' اور ابو مسعود کی دو صحیحوں میں 'ایک آدمی کا اپنے اہل و عیال پر خرچ کرنا صدقہ ہے'۔ ابوہریرہ کی حدیث میں ہے کہ ہر سلمہ پر صدقہ واجب ہے - جوڑ یا چھوٹی کھوکھلی ہڈی، ایک نسخہ میں تین سو ساٹھ جوڑ - ہر روز سورج طلوع ہوتا ہے، اور ابوذر اور بریدہ کے راستوں میں ان سب کے لیے صبح کی دو رکعتیں کافی ہیں۔ ابن رجب کے نزدیک ظاہری معنی یہ ہے کہ مباشرت جیسے مباح عمل کو نیک اولاد کی تلاش یا ضبط نفس کی نیت سے ثواب ملتا ہے، اور النووی نے اس سے یہ اخذ کیا ہے کہ مباح چیزیں خلوص نیت سے اطاعت بن جاتی ہیں۔"
  tr: "Kırk hadisin yirmi beşinci ve yirmi altıncısındaki sadaka, zenginlikle yapılan sadakadan daha geniştir: Fakir sahabeler, zenginlikten başka sadakanın olmadığını sandılar, bu yüzden Peygamber onları karşılayabilecekleri sadakalara yönlendirdi—övgü, tekbir, övgü, tahli, iyiliği öğütmek ve kötülüğü engellemek, zararı yoldan uzak tutmak, zayıflara yardım etmek, körleri yönlendirmek, sağır ve dilsizleri duymak, ihtiyaç belirtmek, muhtaçlar için çabalamak ve birkaçınızda sadaka—bunların hepsi kişinin kendine sadakasıdır; Müslüman'a göre Hudeyfe hadisinde 'her iyilik sadakattır' ve Ebu'nun hadislerinde İki Sahih'te Mas'ud: \"Bir adamın ailesine yaptığı harcamalar sadakattır\"; ve Ebu Hureyre'nin hadisinde, her salam için — yani küçük bir boş eklem veya kemik, bazıları altmış üç yüz eklem derler — için güneşin doğduğu her gün için sadaka vardır ve Duha'nın iki rekâtı hepsi için yeterlidir; İbn Receb'e göre, görünürde hadis, cinsel ilişki gibi mücaiz, doğru bir çocuk veya iffet aramak amacıyla ödüllendirilir. El-Nevavi bunun, mücaiz, yapılan eylemlerin samimi niyetle itaat eylemlerine dönüştüğünün kanıtı olduğunu söylemiştir. Ebu Hureyre'nin Müslüman hadislerinde, Allah'ın gölgesinde gölge koyacağı günlerde, sadece Kendi gölgesi olduğu gün, \"sadaka veren ve onu saklayan bir adamdır ki sol eli sağ elinin ne harcadığını bilmez\" {atıf:sahih-müslüman 1031} denir."
  id: "Amal dalam penggunaan hadis kedua puluh lima dan dua puluh enam dari empat puluh hadis lebih luas daripada sedekah dengan kekayaan: Para sahabat miskin berpikir bahwa tidak ada sedekah kecuali dengan kekayaan, sehingga Nabi membimbing mereka ke amal yang mampu mereka lakukan—memuliakan, takbeer, pujian, tahleel, memerintahkan kebaikan dan melarang kejahatan, menjaga bahaya agar tidak terjadi di jalan, membantu yang lemah, membimbing yang buta, mendengar orang tuli dan bisu, menunjukkan kebutuhan, berusaha untuk yang membutuhkan, dan dalam beberapa dari kalian adalah amal—semuanya adalah sedekah dari orang kepada dirinya sendiri; dalam hadits Hudhayfah menurut Muslim, 'setiap amal baik adalah sedekah,' dan dalam hadis Abu Mas'ud dalam dua Sahih: \"Pengeluaran seseorang untuk keluarganya adalah amal\"; dan dalam hadits Abu Huraira, dikatakan bahwa untuk setiap salami — yaitu sendi kecil yang berlubang atau tulang, dan beberapa mengatakan enam puluh tiga ratus sendi — ada amal untuk setiap hari matahari terbit, dan dua rak'ah Dua cukup untuk mereka semua dalam riwayat Abu Dharr dan Buraidah; dan menurut Ibn Rajab, hadits yang tampak adalah bahwa tindakan yang diperbolehkan seperti hubungan seksual diberi hadiah dengan niat mencari anak yang benar atau kesucian. Al-Nawawi mengatakan ini adalah bukti bahwa tindakan yang diperbolehkan menjadi tindakan ketaatan dengan niat tulus. Dalam hadits Abu Huraira dalam bahasa Muslim, dikatakan bahwa di antara mereka yang akan Allah bayangi di bawah bayangan-Nya pada hari ketika tidak ada naungan selain Milik-Nya, \"orang yang memberi amal dan menyembunyikannya sehingga tangan kirinya tidak tahu apa yang digunakan tangan kanannya\" {cite:sahih-muslim 1031}."
