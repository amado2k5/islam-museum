label:
  ar: الصدقة
  en: Charity (sadaqa)
summary:
  ar: "الصدقة في استعمال الحديثين الخامس والعشرين والسادس والعشرين من الأربعين أوسع من الصدقة بالمال: ظن فقراء الصحابة أن لا صدقة إلا بالأموال فدلهم النبي على صدقات يقدرون عليها — التسبيح والتكبير والتحميد والتهليل والأمر بالمعروف والنهي عن المنكر وعزل الأذى عن الطريق وإعانة الضعيف وهداية الأعمى وإسماع الأصم والأبكم والدلالة على الحاجة والسعي إلى اللهفان، وفي بضع أحدكم صدقة — وكلها صدقة من الإنسان على نفسه؛ وفي حديث حذيفة عند مسلم «كل معروف صدقة» وفي حديث أبي مسعود في الصحيحين «نفقة الرجل على أهله صدقة»؛ وفي حديث أبي هريرة أن على كل سلامى — أي مفصل أو عظم صغير مجوف وقيل ستون وثلاثمئة مفصلاً — صدقة كل يوم تطلع فيه الشمس، وأن ركعتي الضحى تجزئان عنها جميعاً في رواية أبي ذر وبريدة؛ وعند ابن رجب ظاهر الحديث أن المباح كالجماع يُؤجر عليه بنية كطلب الولد الصالح أو الإعفاف، وقال النووي إن فيه دليلاً على أن المباحات تصير طاعات بالنيات الصادقات. وفي حديث أبي هريرة عند مسلم أن ممن يظلهم الله في ظله يوم لا ظل إلا ظله «رجل تصدق بصدقة فأخفاها حتى لا تعلم شماله ما تنفق يمينه» {cite:sahih-muslim 1031}."
  en: "Charity in the usage of the Forty hadiths 25 and 26 is wider than alms of money: the poor Companions supposed there was no charity without wealth, until the Prophet directed them to charities within their power — glorification, magnification, praise, the declaration of unity, commanding right and forbidding wrong, removing harm from the road, aiding the weak, guiding the blind, making the deaf and mute understand, pointing out needs, running to the distressed, and 'in the intercourse of one of you is alms' — all of it a charity from a man upon himself; Hudhayfa's hadith in Muslim runs 'every act of kindness is charity' and Abu Masud's in the two Sahihs 'a man's spending on his family is charity'; in Abu Hurayra's hadith a charity is due on every sulama — joint or small hollow bone, three hundred and sixty joints in one version — each day the sun rises, and two mid-morning rak'as suffice for all of them in the Abu Dharr and Burayda routes; for Ibn Rajab the apparent sense is that a permissible act such as intercourse earns reward by an intention like seeking a righteous child or self-restraint, and al-Nawawi draws from it that permissible things become acts of obedience through sincere intentions."
