label: { ar: "التعديل والمركز والبعد الأبعد للكوكب المتحير", en: "The equation, the centre and the farthest apogee of a wandering planet", ur: "متحیر سیارے کا تعدیل، مرکز اور بُعد اعظم" }
summary:
  ar: "يُنقص بُعد الكوكب الأبعد من وسط الكوكب فيبقى المركز، ويُطلب مثله في سطري العدد من جداول تعديل الكوكب، ويُؤخذ ما بإزائه في الجدول الثالث المرسوم عليه تعديل الحاصة والمركز. فإن كان المركز أقل من قف، أي أقل من مائة وثمانين درجة، نُقص التعديل من المركز وزيد على الحاصة، وإن كان أكثر زيد التعديل على المركز ونُقص من الحاصة. وبهذا يصير المركز المعدل والحاصة المعدلة، فيُدخل بالمركز المعدل في سطري العدد ليُعرف الدقائق في الجدول الرابع. {cite:zij-sabi-nallino-byblion p.176}"
  en: "The apogee distance of the planet is subtracted from its mean, leaving the centre. This centre is looked up in the two rows of the table of the planet's equation, and the matching value is taken from the third table, which gives the equation of anomaly and centre. If the centre is less than qaf, that is 180 degrees, the equation is subtracted from the centre and added to the anomaly; if more, the equation is added to the centre and subtracted from the anomaly. The corrected centre then enters the fourth table of distance minutes. {cite:zij-sabi-nallino-byblion p.176}"
  ur: "سیارے کا بُعد اعظم اس کے وسط میں سے گھٹایا جاتا ہے تو مرکز باقی رہتا ہے؛ اس کا مثل جدول میں دیکھا جاتا ہے، اور تیسرے جدول سے تعدیلِ خاصہ و مرکز لی جاتی ہے۔ اگر مرکز قف یعنی ایک سو اسی درجوں سے کم ہو تو تعدیل مرکز میں سے گھٹا کر خاصہ میں جمع کی جاتی ہے، اور زیادہ ہو تو مرکز میں جمع کر کے خاصہ میں سے گھٹائی جاتی ہے۔ تصحیح شدہ مرکز پھر چوتھے جدول میں داخل ہو کر فاصلے کے دقائق دیتا ہے۔ {cite:zij-sabi-nallino-byblion p.176}"
