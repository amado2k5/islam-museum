summary:
  ar: "عند العرب كل أربعاء يوافق أربعاً من الشهر، مثل أربع خلون وأربع عشرة خلت وأربع عشرة بقيت وأربع وعشرين وأربع بقين {cite:muruj-al-dhahab p. 510}."
  en: "Every Wednesday falling on the fourth of the month in the Arabs' reckoning — the fourth past, the fourteenth, the fourteenth remaining and the twenty-fourth {cite:muruj-al-dhahab p. 510}."
  fr: "Chaque mercredi correspondant au quatrième jour du mois dans le calcul arabe : le quatrième écoulé, le quatorzième, le quatorzième restant et le vingt-quatrième {cite:muruj-al-dhahab p. 510}."
  es: "Todos los miércoles que caen en el cuarto día del mes según el calendario árabe: el cuarto pasado, el decimocuarto, el decimocuarto restante y el vigésimo cuarto {cite:muruj-al-dhahab p. 510}."
  ur: "عربوں کے حساب سے ہر بدھ مہینے کی چوتھی تاریخ کو آتا ہے - چوتھا ماضی، چودھویں، چودھویں باقی اور چوبیسویں {حوالہ: مروج الذہب ص۔ 510}۔"
