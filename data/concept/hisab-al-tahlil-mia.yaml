id: concept/hisab-al-tahlil-mia
class: concept
kind: doctrine
label:
  ar: "التهليل مائة مرة في اليوم"
  en: "The tahlil a hundred times in a day"
  ur: "دن میں سو بار تہلیل"
  es: "El tahlil cien veces al día"
  fr: "Le tahlil cent fois par jour"
  tr: "Günde yüz kez tezahürat yapıyorlar"
  id: "Bersorak seratus kali sehari"
summary:
  ar: "من قال «لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير» في يوم مائة مرة كانت له عدل عشر رقاب، وكُتبت له مائة حسنة، ومُحيت عنه مائة سيئة، وكانت له حرزا من الشيطان يومه ذلك حتى يمسي، في رواية مالك عن أبي هريرة [[passage/muwatta-1-560]] وعند البخاري [[passage/bukhari-api-6403]]. وهو من النصوص القليلة التي تذكر العمودين معا بعدد واحد: مائة تُكتب ومائة تُمحى."
  en: "Whoever says \"There is no god but God alone, without partner; His is the dominion and His the praise, and He has power over all things\" a hundred times in a day has the equal of freeing ten slaves, a hundred good deeds written for him and a hundred bad deeds erased, and a guard from Satan that day until evening, in Malik's narration from Abu Hurayra [[passage/muwatta-1-560]] and in al-Bukhari [[passage/bukhari-api-6403]]. It is one of the few texts that names both columns with one figure: a hundred written and a hundred wiped out."
  ur: "جو دن میں سو بار «لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير» کہے اسے دس غلام آزاد کرنے کے برابر ملتا ہے، اس کے لیے سو نیکیاں لکھی جاتی ہیں، سو برائیاں مٹائی جاتی ہیں اور شام تک شیطان سے حفاظت رہتی ہے، مالک کی ابو ہریرہ سے روایت میں [[passage/muwatta-1-560]] اور بخاری میں [[passage/bukhari-api-6403]]۔ یہ ان چند نصوص میں سے ہے جو دونوں کالم ایک ہی عدد سے بیان کرتی ہیں: سو لکھی جاتی ہیں اور سو مٹائی جاتی ہیں۔"
  es: "Quien diga «No hay más dios que Dios, único y sin socio; suyo es el dominio y suya la alabanza, y tiene poder sobre todas las cosas» cien veces al día, tendrá el equivalente a liberar a diez esclavos, cien buenas acciones escritas para él y cien malas acciones borradas, y protección contra Satanás durante todo el día hasta la noche, según la narración de Malik de Abu Hurayra [[passage/muwatta-1-560]] y de al-Bujari [[passage/bukhari-api-6403]]. Es uno de los pocos textos que nombra ambas columnas con una sola cifra: cien escritas y cien borradas."
  fr: "Quiconque récite cent fois par jour: « Il n'y a de dieu que Dieu, sans associé; à Lui appartient la royauté et à Lui la louange, et Il est Omnipotent », obtient l'équivalent de l'affranchissement de dix esclaves, l'inscription de cent bonnes actions et l'effacement de cent mauvaises, ainsi qu'une protection contre Satan jusqu'au soir, selon le hadith rapporté par Malik d'après Abu Hurayra [[passage/muwatta-1-560]] et par al-Bukhari [[passage/bukhari-api-6403]]. C'est l'un des rares textes à désigner ces deux aspects par un seul chiffre: cent actions inscrites et cent actions effacées."
  tr: "Eğer kim diyor ki, \"Allah'tan başka bir tanrı yoktur, ortaksız; egemenlik O'nundur, tüm övgü O'nundur ve O her şeye yetkilidir,\" günde yüz kez on eşdeğer kölesi olur, yüz iyi iş kaydedilir, yüz kötü iş silinir ve o gün akşama kadar Şeytan'dan bir kalkan olur; bu, Malik'in Abu Huraira'dan [[passage/muwatta-1-560]] ve El-Buhari'de [[passage/bukhari-api-6403]] rivayetinde yer alır. İki sütunu bir arada tek bir sayıda belirten az sayıdaki metinden biridir: yüz yazılır, yüz silinir."
  id: "Siapa pun berkata, \"Tak ada Allah selain Allah, tanpa mimpi, bagi-Nya adalah kekuasaan dan segala puji milik-Nya, dan Dia berkuasa atas segala sesuatu,\" seratus kali sehari ia akan memiliki sepuluh budak yang setara, seratus perbuatan baik akan dicatat untuknya, dan seratus perbuatan buruk akan dihapus darinya, dan ia akan memiliki perisai dari Setan hari itu hingga malam, dalam riwayat Malik dari Abu Huraira [[passage/muwatta-1-560]] dan dalam Al-Bukhari [[passage/bukhari-api-6403]]. Ini adalah salah satu dari sedikit teks yang menyebut kedua kolom bersama dalam satu angka: seratus tertulis dan seratus dihapus."
