label:
  ar: الخط العربي وتعليمه
  en: Arabic calligraphy and its teaching
  ur: عربی خطاطی اور اس کی تعلیم
  es: "La caligrafía árabe y su enseñanza"
  fr: "La calligraphie arabe et son enseignement"
  tr: "Arap Hat Sanatı ve Eğitimi"
  id: "Kaligrafi Arab dan Pendidikannya"
summary:
  ar: "صفحات تدريب تبدأ بالحروف المرتبة أبجدياً ⁦(أبجد هوز حطي كلمن سعفص قرشت)⁩ ثم أبيات تحث على تعلم الخط بملازمة المعلم والمثابرة."
  en: "Practice sheets that begin with the letters in abjad order (abjad hawwaz ḥuṭṭī kalamān saʿfaṣ qarashat) and then verses urging the learner to study the hand under a master and to persist."
  ur: "مشق کے ورق جو حروف سے ابجد کی ترتیب میں شروع ہوتے ہیں ⁦(ابجد ہوز حطی کلمن سعفص قرشت)⁩ اور پھر ایسے اشعار جو شاگرد کو استاد کے ساتھ رہ کر اور استقامت سے خط سیکھنے کی ترغیب دیتے ہیں۔"
  es: "Hojas de práctica que comienzan con las letras en orden abjad (abjad hawwaz ḥuṭṭī kalamān saʿfaṣ qarashat) y luego versos que instan al aprendiz a estudiar la escritura bajo la tutela de un maestro y a perseverar."
  fr: "feuilles d'exercices qui commencent par les lettres dans l'ordre abjad (abjad hawwaz ḥuṭṭī kalamān saʿfaṣ qarashat) puis des versets exhortant l'apprenant à étudier la main sous un maître et à persévérer."
  tr: "Eğitim sayfaları, alfabetik olarak düzenlenmiş harflerle başlar (Abjad Hawz, Hati Kulaman Sa'afs Qarasht), ardından öğretmeni takip ederek ve azmi takip ederek kaligrafi öğrenmeyi teşvik eden ayetler gelir."
  id: "Halaman pelatihan dimulai dengan huruf yang disusun secara alfabetis (Abjad Hawz, Hati Kulaman Sa'afs Qarasht), diikuti oleh bait-bait yang mendorong pembelajaran kaligrafi dengan mengikuti guru dan ketekunan."
