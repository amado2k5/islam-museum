id: "concept/ilaj-afat-al-sam"
class: "concept"
kind: "scientific"
label:
  ar: "معالجة آفات السمع والطرش"
  en: "The treatment of the disorders of hearing and hardness of hearing"
  ur: "سماعت کی آفتوں اور سختی سماعت کا علاج"
  es: "El tratamiento de los trastornos de la audición y la hipoacusia."
  fr: "Le traitement des troubles de l'audition et de la surdité"
summary:
  ar: "يقول أولاً إنه يجب أن يكون جميع ما يقطر في الأذن فاتراً غير بارد ولا حار — قول كلي — ثم يفصل: فالمراري يستفرغ فيه المرار بالمسهل فإنه كثيراً ما يقع فيه إسهال مراري بالطبع فيزول معه الصمم، والكائن عن برد ومادة باردة تنفعه الأدهان الحارة بعد استفراغ المادة، والرياضة شديدة المنفعة وكذلك الصياح الشديد في الأذن وأصوات البوقات، والكائن عن يبس يلازم الحمام والغذاء والشراب المرطب، والكائن بسبب السدة يعالج بما ذكر في باب السدة، والاستفراغ لأجل الطرش الأوفق فيه أن يكثر عدده ويقل مقداره كل مرة ليتحفظ القوة ويوافي النضج ⁦⁦(أسماء الأدوية والأدهان والعصارات والحبوب ومقاديرها لا تحمل)⁩⁩ {cite:canon-ibn-sina-print-v2 p.220} {cite:canon-ibn-sina-print-v2 p.221} {cite:canon-ibn-sina-print-v2 p.222}"
  en: "First a universal rule: all that is dropped in the ear must be lukewarm, neither cold nor hot. Then in detail: in the bilious kind the bile is evacuated by the laxative — a bilious diarrhoea often comes naturally and the deafness goes with it; what is from cold and cold matter benefits from hot oils after the matter is evacuated; exercise is of strong benefit, as are loud shouting in the ear and trumpet sounds; what is from dryness keeps the bath, moistening food and drink; what is from an occlusion is treated as said in the occlusion's chapter; for hardness of hearing the fit evacuation is many in number and small in measure each time, to keep the strength and reach ripeness ⁦(drug, oil, juice and pill names and their measures are not carried)⁩ {cite:canon-ibn-sina-print-v2 p.220} {cite:canon-ibn-sina-print-v2 p.221} {cite:canon-ibn-sina-print-v2 p.222}"
  ur: "پہلے ایک کلی قاعدہ: جو کچھ کان میں ٹپکایا جائے وہ گونگا ہو، نہ ٹھنڈا نہ گرم؛ پھر تفصیل: مراری میں مسہل سے صفرا خارج کریں کہ اکثر قدرتاً مراری اسہال ہوتا ہے تو اس کے ساتھ بہرہ پن جاتا رہتا ہے؛ سرد مادے سے ہونے والے کو مادہ خارج کرنے کے بعد گرم تیل نفع دیتے ہیں؛ ورزش نہایت سودمند ہے اور اسی طرح کان میں زور سے پکارنا اور بوقوں کی آوازیں؛ خشکی سے ہونے والا حمام اور تر غذا اور مشروب پر قائم رہے؛ سدے سے ہونے والا سدے کے باب میں کہے گئے طریقے سے علاج ہو؛ اور سختی سماعت کے لیے موافق استفراغ یہ ہے کہ بارہا ہو مگر ہر بار کم مقدار تاکہ قوت محفوظ رہے اور نضج آئے ⁦⁦(ادویہ، تیلوں، عصاروں اور گولیوں کے نام اور مقدار منقول نہیں)⁩⁩ {cite:canon-ibn-sina-print-v2 p.220} {cite:canon-ibn-sina-print-v2 p.221} {cite:canon-ibn-sina-print-v2 p.222}"
  es: "Primero una regla universal: todo lo que se deja caer en el oído debe estar tibio, ni frío ni caliente. Luego en detalle: en el tipo biliar la bilis se evacua con el laxante; una diarrea biliar a menudo se presenta de forma natural y la sordera la acompaña; lo que es de materia fría y fría se beneficia de aceites calientes después de que la materia se haya evacuado; el ejercicio es muy beneficioso, al igual que los gritos fuertes en el oído y los sonidos de trompeta; lo que es de sequedad mantiene el baño, humedeciendo la comida y la bebida; lo que es de una oclusión se trata como se dice en el capítulo de oclusión; Para la dificultad auditiva, la evacuación del ataque es frecuente y de pequeña magnitud cada vez, para mantener la fuerza y alcanzar la madurez (no se incluyen nombres de medicamentos, aceites, jugos ni píldoras, ni sus medidas) {cite:canon-ibn-sina-print-v2 p.220} {cite:canon-ibn-sina-print-v2 p.221} {cite:canon-ibn-sina-print-v2 p.222}"
  fr: "Tout d'abord, une règle générale: tout ce qui est instillé dans l'oreille doit être tiède, ni froid ni chaud. Ensuite, en détail: dans le cas d'une affection biliaire, la bile est évacuée par le laxatif – une diarrhée bilieuse survient souvent naturellement et la surdité l'accompagne; ce qui est dû au froid et à des matières froides bénéficie des huiles chaudes après l'évacuation; l'exercice physique est très bénéfique, de même que les cris forts dans l'oreille et les sons de trompette; ce qui est dû à la sécheresse nécessite un bain, en humidifiant les aliments et les boissons; ce qui est dû à une occlusion est traité comme indiqué dans le chapitre consacré aux occlusions. Pour la surdité, les évacuations sont nombreuses et peu abondantes à chaque fois, afin de maintenir la force et d'atteindre la pleine maturité (les noms et dosages des médicaments, huiles, jus et pilules ne sont pas mentionnés). {cite:canon-ibn-sina-print-v2 p.220} {cite:canon-ibn-sina-print-v2 p.221} {cite:canon-ibn-sina-print-v2 p.222}"
