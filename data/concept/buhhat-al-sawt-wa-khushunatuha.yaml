id: concept/buhhat-al-sawt-wa-khushunatuha
class: concept
kind: scientific
label:
  ar: "بحة الصوت وخشونته"
  en: "The voice's huskiness and harshness"
  fr: "Enrouement et rudesse de la voix"
  ur: "آواز کی بھاری پن اور خشونی"
summary:
  ar: "من بح صوته يجب أن يجتنب كل حامض مالح خشن وحاد حريف إلا إن يريد بذلك العلاج والتقطيع فيستعملها مخلوطة بأدوية لينة، والبحة تعرض عن رطوبة ولو كثرت قليلاً أرعشت ولو كثرت كثيراً أبطلت وقد يبح الصوت من الإسراف في استعمال آلات التصويت فيحدث بها إعياء أو تورم وتوتر وأردؤه ما كان على الطعام وقد يبح للبرد الخشن وللحر المفرط بما ييبسان المزاج وكذلك السهر والأغذية المخشنة ويبح لكثرة الصياح، والبحوحة التي تعرض للمشايخ لا تبرأ وإذا كان الصيف شمالياً يابساً وخريفه جنوبياً مطيراً فإن البحوحة تكثر فيه، والدوالي إذا ظهرت كانت كثيراً من أسباب صلاح الصوت، وعلاجها بحسب سببها فإن عرضت من كثرة الصياح أو كان هناك حرارة أو كان السبب برداً أو من صياح وتعب فلكل تدبيره ⁦(وفي الباب أدوية حافظة لملاسة الصوت مرتبة على الحار والبارد وأسماؤها ومقاديرها وصورها كلها مستثناة بحسب القاعدة)⁩ {cite:canon-ibn-sina-print-v2 p.324}"
  en: "Whoever's voice goes husky must shun every sour, salty, harsh and sharp thing unless he means treatment and cutting by it — then he uses them mixed with soft drugs. The huskiness arises from a moisture: if it increases a little it makes the voice tremble; if it increases much it kills it. The voice may go husky from overusing the voicing tools, bringing on weariness, swelling or tension — the worst of it what comes upon food — or for the harsh cold, for the excessive heat by what dries the temperament, and likewise sleeplessness and the roughening foods; and it husks for much shouting. The huskiness befalling the old does not heal; and when the summer is northerly and dry and its autumn southerly and rainy, the huskiness multiplies in it; and the veins showing are much among the causes of the voice's soundness. Its treatment follows its cause: if it came of much shouting, or there is heat, or the cause is cold, or of shouting and weariness, each has its regimen (in the chapter are drugs preserving the voice's smoothness, ranged on hot and cold; their names, measures and forms are all excluded per the rule) {cite:canon-ibn-sina-print-v2 p.324}"
  fr: "Le livre conseille d’éviter tout aliment acide, salé, rude et piquant, sauf à rechercher son action thérapeutique incisive, alors associée à des remèdes doux. L’enrouement vient d’une humidité qui, légèrement accrue, fait trembler la voix et, très accrue, l’éteint. L’usage excessif des organes vocaux peut entraîner fatigue, gonflement ou tension, le pire cas survenant après manger ; froid intense, chaleur excessive desséchant le tempérament, insomnie, aliments irritants et cris abondants peuvent aussi le provoquer. Celui des vieillards ne guérirait pas. Un été sec à vents du nord suivi d’un automne pluvieux à vents du sud le multiplierait ; les veines apparentes comptent beaucoup parmi les causes de la bonne voix. Le traitement varie selon cris, chaleur, froid ou fatigue ; les noms, quantités et préparations des remèdes chauds ou froids préservant sa douceur sont tous exclus ici selon la règle {cite:canon-ibn-sina-print-v2 p.324}"
  ur: "جس کی آواز بھاری ہو جائے اسے ہر ترش نمکین خشن اور تیز چیز سے پرہیز کرنا چاہیے مگر یہ کہ وہ اس سے علاج اور کاٹنا چاہتا ہو تو وہ انہیں نرم ادویہ کے ملا کر استعمال کرے؛ بھاری پن رطوبت سے ہوتی ہے اگر وہ قلیل بڑھے تو آواز کانپنے لگتی ہے اور اگر بہت بڑھے تو باطل کر دیتی ہے؛ آواز آواز کے اوزاروں کے حد سے زیادہ استعمال سے بھی بھاری ہو سکتی ہے جس سے تھکن سوجن یا کھچاؤ آئے — اور اس کا بدترین وہ جو کھانے پر ہو — یا خشن ٹھنڈ سے یا حد سے زیادہ گرمی سے جو مزاج خشک کرے اور ایسے ہی بیداری اور خشن خوراکوں سے؛ اور زیادہ چیخنے سے بھی بھاری ہوتی ہے؛ بڑھاپے والوں کو ہونے والی بھاری پن شفا نہیں پاتی؛ اور جب گرمی شمالی اور خشک ہو اور اس کی خزاں جنوبی برساتی تو اس میں بھاری پن کثیر ہوتی ہے؛ اور رگوں کا ظاہر ہونا آواز کی سلامت کے اسباب میں سے بہت ہے؛ اس کا علاج اس کے سبب کے مطابق ہے اگر زیادہ چیخنے سے ہو یا گرمی ہو یا سبب ٹھنڈ ہو یا چیخ اور تھکن سے ہو تو ہر ایک کی اپنی تدبیر ہے ⁦(اس باب میں آواز کی ملاست کی حفاظت کرنے والی ادویہ ہیں گرم اور سرد پر مرتب؛ ان کے نام مقداریں اور صورتیں سب اصول کے مطابق مستثنیٰ ہیں)⁩ {cite:canon-ibn-sina-print-v2 p.324}"
