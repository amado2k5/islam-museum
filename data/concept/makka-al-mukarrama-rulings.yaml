label: { ar: "مَكَّة المُكَرَّمَة (الأحكام المتعلقة بها)", en: "Makka al-Mukarrama: rulings concerning the city", ur: "مکہ مکرمہ (متعلقہ احکام)" }
summary:
  ar: "مكة علم على البلد الذي فيه بيت الله الحرام، ولها أسماء كثيرة منها بكة وأم القرى والبلد الأمين، وكلها حرم وما حولها. ومن أحكامها وجوب تعظيمها، واستحباب الغسل لدخولها، ووجوب الإحرام لمن أراد الحج أو العمرة، واستحباب المجاورة بها عند الجمهور، ومنع الكفار من سكناها وإقامتها باتفاق، واختلف الفقهاء في بيع دورها وإجارتها، وفي مضاعفة السيئات فيها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14936} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14937} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14938}"
  en: "Makka is the name of the city that holds the Sacred House of God. It has many names, among them Bakka, Umm al-Qura and al-Balad al-Amin, and the whole city and its surroundings are a sanctuary. Its rulings include the duty to honour it, the recommendation to bathe on entering it, the duty of ihram for one who intends the pilgrimage or the visit, the recommendation of staying there for most jurists, the bar on non-Muslims living there by agreement, a dispute on selling and renting its houses, and a debate on whether sins are multiplied there. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14936} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14937} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14938}"
  ur: "مکہ مکرمہ وہ شہر ہے جہاں بیت اللہ ہے، اور پورا شہر اور اس کے گرد کا علاقہ حرم ہے۔ اس کے احکام میں تعظیم، داخلے کے لیے غسل کا استحباب، حج و عمرہ کے لیے احرام، غیر مسلموں کا سکونت سے ممانعت، اور گناہوں کے مضاعف ہونے کا مسئلہ شامل ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14936} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14937} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14938}"
