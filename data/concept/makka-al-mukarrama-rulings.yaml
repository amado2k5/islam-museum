label: { ar: "مَكَّة المُكَرَّمَة ⁦(الأحكام المتعلقة بها)⁩", en: "Makka al-Mukarrama: rulings concerning the city", ur: "مکہ مکرمہ ⁦(متعلقہ احکام)⁩", es: "Makka al-Mukarrama: sentencias relativas a la ciudad", fr: "Makka al-Mukarrama: décisions concernant la ville" }
summary:
  ar: "مكة علم على البلد الذي فيه بيت الله الحرام، ولها أسماء كثيرة منها بكة وأم القرى والبلد الأمين، وكلها حرم وما حولها. ومن أحكامها وجوب تعظيمها، واستحباب الغسل لدخولها، ووجوب الإحرام لمن أراد الحج أو العمرة، واستحباب المجاورة بها عند الجمهور، ومنع الكفار من سكناها وإقامتها باتفاق، واختلف الفقهاء في بيع دورها وإجارتها، وفي مضاعفة السيئات فيها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14936} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14937} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14938}"
  en: "Makka is the name of the city that holds the Sacred House of God. It has many names, among them Bakka, Umm al-Qura and al-Balad al-Amin, and the whole city and its surroundings are a sanctuary. Its rulings include the duty to honour it, the recommendation to bathe on entering it, the duty of ihram for one who intends the pilgrimage or the visit, the recommendation of staying there for most jurists, the bar on non-Muslims living there by agreement, a dispute on selling and renting its houses, and a debate on whether sins are multiplied there. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14936} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14937} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14938}"
  ur: "مکہ مکرمہ وہ شہر ہے جہاں بیت اللہ ہے، اور پورا شہر اور اس کے گرد کا علاقہ حرم ہے۔ اس کے احکام میں تعظیم، داخلے کے لیے غسل کا استحباب، حج و عمرہ کے لیے احرام، غیر مسلموں کا سکونت سے ممانعت، اور گناہوں کے مضاعف ہونے کا مسئلہ شامل ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14936} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14937} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14938}"
  es: "La Meca es el nombre de la ciudad que alberga la Sagrada Casa de Dios. Tiene muchos nombres, entre ellos Bakka, Umm al-Qura y al-Balad al-Amin, y toda la ciudad y sus alrededores son un santuario. Sus normas incluyen el deber de honrarla, la recomendación de bañarse al entrar, el deber del ihram para quien tenga la intención de peregrinar o visitarla, la recomendación de permanecer allí para la mayoría de los juristas, la prohibición de que los no musulmanes vivan allí por acuerdo, una disputa sobre la venta y el alquiler de sus casas, y un debate sobre si los pecados se multiplican allí. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14936} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14937} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14938}"
  fr: "La Mecque est le nom de la ville qui abrite la Maison Sacrée de Dieu. Elle porte de nombreux noms, dont Bakka, Umm al-Qura et al-Balad al-Amin, et la ville entière, ainsi que ses environs, est considérée comme un sanctuaire. Les règles qui la régissent comprennent l'obligation de l'honorer, la recommandation de se purifier par les ablutions avant d'y entrer, l'obligation de revêtir l'ihram pour celui qui souhaite accomplir le pèlerinage ou la visite, la recommandation d'y séjourner pour la plupart des juristes, l'interdiction pour les non-musulmans d'y résider par accord mutuel, une controverse concernant la vente et la location de ses maisons, et un débat sur la question de savoir si les péchés y sont multipliés."
