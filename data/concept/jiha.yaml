label: { ar: "الجهة", en: "Jiha (direction, purpose or head in fiqh)", ur: "جہت" }
summary:
  ar: "الجهة في اللغة الموضع الذي يُتوجَّه إليه، وفي الفقه تُستعمل في إضافة المال إلى جهة، كالوقف على جهة لا تنقطع كالفقراء، وفي التبرع المعين بجهة. وتُبيّن الموسوعة اختلاف القابض والدافع في الجهة، ومنها الزوجان في الهبة والمهر، وجهات التبعية في الإسلام بإسلام أحد الأبوين أو الالتقاط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6667} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6668} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6669} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6670}"
  en: "Jiha in the language is the place one faces or aims at. In fiqh the word is used for a purpose to which property is assigned, such as an endowment for a perpetual purpose like the poor. The encyclopedia records disputes between giver and receiver over the purpose, such as a dispute over whether a payment was a gift or part of the dower, and the two ways in Islam by which a child belongs to the faith: a parent's conversion, or being found in Muslim territory. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6667} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6668} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6669} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6670}"
