label: { ar: "الجهة", en: "Jiha (direction, purpose or head in fiqh)", ur: "جہت", es: "Jiha (dirección, propósito o cabeza en fiqh)", fr: "Jiha (direction, but ou tête en fiqh)", tr: "Varlık", id: "Entitas" }
summary:
  ar: "الجهة في اللغة الموضع الذي يُتوجَّه إليه، وفي الفقه تُستعمل في إضافة المال إلى جهة، كالوقف على جهة لا تنقطع كالفقراء، وفي التبرع المعين بجهة. وتُبيّن الموسوعة اختلاف القابض والدافع في الجهة، ومنها الزوجان في الهبة والمهر، وجهات التبعية في الإسلام بإسلام أحد الأبوين أو الالتقاط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6667} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6668} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6669} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6670}"
  en: "Jiha in the language is the place one faces or aims at. In fiqh the word is used for a purpose to which property is assigned, such as an endowment for a perpetual purpose like the poor. The encyclopedia records disputes between giver and receiver over the purpose, such as a dispute over whether a payment was a gift or part of the dower, and the two ways in Islam by which a child belongs to the faith: a parent's conversion, or being found in Muslim territory. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6667} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6668} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6669} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6670}"
  es: "En el idioma, Jiha significa el lugar al que uno se dirige o al que apunta. En fiqh, la palabra se usa para referirse a un propósito al que se asigna una propiedad, como una donación para un fin perpetuo, como la ayuda a los pobres. La enciclopedia registra disputas entre el donante y el receptor sobre el propósito, como una disputa sobre si un pago fue un regalo o parte de la dote, y las dos formas en el Islam por las que un niño pertenece a la fe: la conversión de un padre o ser encontrado en territorio musulmán. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6667} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6668} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6669} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6670}"
  fr: "En islam, le terme « jiha » désigne le lieu vers lequel on se tourne ou que l'on vise. En jurisprudence islamique (fiqh), il est employé pour désigner une finalité à laquelle des biens sont affectés, comme une dot destinée à une cause perpétuelle, par exemple l'aide aux pauvres. L'encyclopédie recense les litiges entre donateur et bénéficiaire concernant cette finalité, notamment lorsqu'un paiement est contesté pour déterminer s'il s'agit d'un don ou d'une partie de la dot. Elle mentionne également les deux manières, en islam, pour un enfant d'intégrer la foi: la conversion d'un parent ou sa présence en territoire musulman."
  ur: "زبان میں جیہا وہ جگہ ہے جس کا کوئی چہرہ یا مقصد رکھتا ہے۔ فقہ میں یہ لفظ اس مقصد کے لیے استعمال ہوتا ہے جس کے لیے جائیداد تفویض کی جاتی ہے، جیسے کہ غریبوں کی طرح دائمی مقصد کے لیے وقف۔ انسائیکلوپیڈیا دینے والے اور وصول کرنے والے کے درمیان اس مقصد کے بارے میں تنازعات کو ریکارڈ کرتا ہے، جیسے کہ یہ تنازعہ کہ آیا ادائیگی ایک تحفہ تھی یا مہر کا حصہ، اور اسلام میں وہ دو طریقے جن سے بچہ عقیدے سے تعلق رکھتا ہے: والدین کی تبدیلی، یا مسلم علاقے میں پایا جانا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ6667} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص6668} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ6669} صفحہ 6670}"
  tr: "Dilde 'ciha', kişinin yönlendirildiği yeri ifade eder ve fıkıhta, bir bölgeye para eklemek için kullanılır; örneğin fakirler gibi kesintisiz bir kuruluş için vakıf veya ciha için özel bir bağış gibi. Ansiklopedi, cihada sahip ile ödeyici arasındaki farkları, hediye ve çeyizlerde eşleri ve İslam'daki bağlılığın bir ebeveynin dönüşümü veya edinimle bağlantısını açıklar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6667} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6668} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6669} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6670}"
  id: "Dalam bahasa, 'jiha' merujuk pada tempat yang dituju, dan dalam yurisprudensi, digunakan untuk menambah uang ke suatu wilayah, seperti wakaf untuk entitas yang tidak terputus seperti orang miskin, atau dalam donasi khusus untuk jiha. Ensiklopedia ini menjelaskan perbedaan antara pemegang dan pembayar dalam jiha, termasuk pasangan dalam hadiah dan mas kawin, serta sumber afiliasi dalam Islam melalui konversi salah satu orang tua atau akuisisi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6667} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6668} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6669} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6670}"
