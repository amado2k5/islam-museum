summary:
  ar: "تنكار في الكتاب منه معدني ومنه مصنوع، ويقال إنه لحام الذهب يستعمله الصائغون، وينفع من وجع الضرس وأكال الأسنان لخاصية فيه {cite:canon-ibn-sina-print-v1 p.688}"
  en: "Tinkar is in the book partly mineral and partly made, and it is said to be the solder of gold used by goldsmiths; it benefits pain of the molar and the eating away of the teeth by a property in it {cite:canon-ibn-sina-print-v1 p.688}"
  ur: "ٹنکار کتاب میں کچھ معدنی اور کچھ بنایا ہوا ہے، اور کہا جاتا ہے کہ یہ سونے کی جھلائی ہے جسے سنار استعمال کرتے ہیں؛ داڑھ کے درد اور دانتوں کے کھائے جانے میں اپنی ایک خاصیت کی وجہ سے نافع ہے {cite:canon-ibn-sina-print-v1 p.688}۔"
  es: "En el libro, el tinkar es en parte mineral y en parte artificial, y se dice que es la soldadura de oro utilizada por los orfebres; alivia el dolor de muelas y la erosión dental gracias a una propiedad que contiene {cite:canon-ibn-sina-print-v1 p.688}."
