label: { ar: "أهل الحرب", en: "Ahl al-Harb (the people at war with the Muslims, their status and the rules that govern dealings with them)" }
summary:
  ar: "أهل الحرب هم غير المسلمين الذين لم يدخلوا في عقد الذمة ولا يتمتعون بأمان المسلمين ولا عهدهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3600} ويفرقون عن أهل الذمة وأهل البغي وأهل العهد والمستأمنين، وينقلب الذمي أو المعاهد أو المستأمن حربيا بالالتحاق بدار الحرب أو بنقض العهد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3601}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3602} ودماء أهل الحرب وأموالهم مباحة إذا لم يكن عهد، فإن كان عهد عُصمت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3604} ولا يجوز للمسلم في دار الحرب الغدر بهم إذا أمّنوه، ويجوز إتلاف أموالهم إذا كان فيه مصلحة للمسلمين باتفاق، واختلفوا في إتلاف ما لا مصلحة فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3605}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3606}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3607} وتجوز الصدقة والهبة لهم عند الجمهور، وتصح الوصية عند الشافعية والحنابلة للمعين منهم دون الحنفية والمالكية، ولا يصح الوقف عليهم باتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3607}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3608} ويجوز تصدير الأطعمة ونحوها إليهم، ولا يجوز تصدير السلاح في الحرب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3609}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3610} ويحل للمسلم نكاح المرأة الكتابية الحربية كالذمية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3610}"
  en: "Ahl al-harb are non-Muslims who have not entered a covenant of protection and enjoy neither the safe-conduct nor the treaty of the Muslims. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3600} They are distinguished from the protected people, the rebels, those with a treaty and those under safe-conduct; a protected person, a treaty-holder or a holder of safe-conduct becomes a combatant by joining the land of war or by breaking the covenant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3601}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3602} Their blood and property are lawful to take where there is no covenant, and are protected where there is one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3604} The Muslim may not betray them once they have granted him safe-conduct; the destruction of their property is allowed by agreement where it serves the Muslims, and the jurists differ where it serves no purpose. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3605}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3606}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3607} Gifts and alms to them are allowed by the majority, a will in favour of a named person is allowed by the Shafi'is and Hanbalis but not by the Hanafis and Malikis, and an endowment in their favour is void by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3607}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3608} Food and similar goods may be exported to them; arms may not be exported in war. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3609}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3610} A Muslim man may marry a Christian or Jewish woman of the land of war, as of the protected people. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3610}"
