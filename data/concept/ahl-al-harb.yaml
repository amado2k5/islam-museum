label: { ar: "أهل الحرب", en: "Ahl al-Harb (the people at war with the Muslims, their status and the rules that govern dealings with them)", fr: "Ahl al-Harb (les gens en guerre avec les musulmans, leur statut et les règles qui régissent les rapports avec eux)", es: "Ahl al-Harb (los pueblos en guerra con los musulmanes, su estatus y las normas que rigen las relaciones con ellos)", ur: "اہل حرب ⁦(مسلمانوں کے ساتھ جنگ کرنے والے لوگ، ان کی حیثیت اور ان کے ساتھ معاملات پر حکومت کرنے والے احکام)⁩", tr: "Savaş ağaları", id: "Panglima perang" }
summary:
  ar: "أهل الحرب هم غير المسلمين الذين لم يدخلوا في عقد الذمة ولا يتمتعون بأمان المسلمين ولا عهدهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3600} ويفرقون عن أهل الذمة وأهل البغي وأهل العهد والمستأمنين، وينقلب الذمي أو المعاهد أو المستأمن حربيا بالالتحاق بدار الحرب أو بنقض العهد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3601}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3602} ودماء أهل الحرب وأموالهم مباحة إذا لم يكن عهد، فإن كان عهد عُصمت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3604} ولا يجوز للمسلم في دار الحرب الغدر بهم إذا أمّنوه، ويجوز إتلاف أموالهم إذا كان فيه مصلحة للمسلمين باتفاق، واختلفوا في إتلاف ما لا مصلحة فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3605}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3606}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3607} وتجوز الصدقة والهبة لهم عند الجمهور، وتصح الوصية عند الشافعية والحنابلة للمعين منهم دون الحنفية والمالكية، ولا يصح الوقف عليهم باتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3607}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3608} ويجوز تصدير الأطعمة ونحوها إليهم، ولا يجوز تصدير السلاح في الحرب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3609}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3610} ويحل للمسلم نكاح المرأة الكتابية الحربية كالذمية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3610}"
  en: "Ahl al-harb are non-Muslims who have not entered a covenant of protection and enjoy neither the safe-conduct nor the treaty of the Muslims. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3600} They are distinguished from the protected people, the rebels, those with a treaty and those under safe-conduct; a protected person, a treaty-holder or a holder of safe-conduct becomes a combatant by joining the land of war or by breaking the covenant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3601}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3602} Their blood and property are lawful to take where there is no covenant, and are protected where there is one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3604} The Muslim may not betray them once they have granted him safe-conduct; the destruction of their property is allowed by agreement where it serves the Muslims, and the jurists differ where it serves no purpose. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3605}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3606}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3607} Gifts and alms to them are allowed by the majority, a will in favour of a named person is allowed by the Shafi'is and Hanbalis but not by the Hanafis and Malikis, and an endowment in their favour is void by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3607}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3608} Food and similar goods may be exported to them; arms may not be exported in war. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3609}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3610} A Muslim man may marry a Christian or Jewish woman of the land of war, as of the protected people. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3610}"
  fr: "Les ahl al-harb sont les non-musulmans qui n’ont pas conclu de pacte de protection et ne bénéficient ni d’un sauf-conduit ni d’un traité avec les musulmans. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3600} Ils se distinguent des personnes protégées, des rebelles, des bénéficiaires d’un traité et de ceux qui disposent d’un sauf-conduit. Une personne protégée, couverte par un traité ou munie d’un sauf-conduit, acquiert le statut de belligérant en rejoignant le territoire ennemi ou en rompant le pacte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3601}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3602} Dans cette doctrine juridique, leur vie et leurs biens ne bénéficient d’une protection que s’il y a un pacte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3604} Un musulman ne peut les trahir après qu’ils lui ont accordé un sauf-conduit. Les juristes s’accordent à admettre la destruction de leurs biens si elle sert les intérêts des musulmans, mais divergent si elle ne sert à rien. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3605}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3606}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3607} La majorité autorise les dons et les aumônes. Les chaféites et les hanbalites admettent le legs en faveur d’une personne nommément désignée, contrairement aux hanafites et aux malikites. Tous tiennent pour nulle une fondation en leur faveur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3607}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3608} L’exportation de denrées et de biens analogues est permise, mais pas celle d’armes en temps de guerre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3609}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3610} Un musulman peut épouser une chrétienne ou une juive du territoire ennemi aussi bien qu’une femme des communautés protégées. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3610}"
  es: "Ahl al-harb son no musulmanes que no han entrado en un pacto de protección y no gozan ni del salvoconducto ni del tratado de los musulmanes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3600} Se distinguen de las personas protegidas, los rebeldes, aquellos con un tratado y aquellos bajo salvoconducto; una persona protegida, un titular de tratado o un titular de salvoconducto se convierte en combatiente al unirse a la tierra de guerra o al romper el pacto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3601}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3602} Su sangre y propiedad son lícitas para tomar donde no hay pacto, y están protegidas donde sí lo hay. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3604} El musulmán no puede traicionarlos una vez que le hayan concedido un salvoconducto; la destrucción de su propiedad está permitida por acuerdo cuando sirve a los musulmanes, y los juristas difieren cuando no sirve a ningún propósito. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3605}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3606}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3607} Los regalos y las limosnas a ellos están permitidos por la mayoría, un testamento a favor de una persona nombrada está permitido por los shafi'is y los hanbalis pero no por los hanafis y los malikíes, y una dotación a su favor es nula por acuerdo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3607}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3608} Se les pueden exportar alimentos y bienes similares; Las armas no pueden exportarse en la guerra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3609}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3610} Un hombre musulmán puede casarse con una mujer cristiana o judía de la tierra de la guerra, como del pueblo protegido. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3610}"
  ur: "اہل حرب وہ غیر مسلم ہیں جنہوں نے تحفظ کے عہد میں داخل نہیں ہوئے اور نہ ہی مسلمانوں کے تحفظ اور نہ ہی معاہدے سے لطف اندوز ہوتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3600} وہ محفوظ لوگوں، باغیوں، معاہدہ کرنے والوں اور محفوظ طرز عمل کے تحت رہنے والوں سے ممتاز ہیں۔ ایک محفوظ شخص، ایک معاہدہ ہولڈر یا محفوظ طرز عمل کا حامل جنگ کی سرزمین میں شامل ہو کر یا عہد شکنی کر کے جنگجو بن جاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3601}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3602} ان کا خون اور جائیداد جہاں کوئی عہد نہیں ہے وہاں لینا حلال ہے اور جہاں ایک ہے وہاں محفوظ ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 3604} ایک بار جب مسلمان اسے محفوظ اخلاق عطا کر دے تو وہ ان کے ساتھ خیانت نہیں کر سکتا۔ ان کی املاک کو تباہ کرنے کی اجازت معاہدے کے ذریعے دی گئی ہے جہاں یہ مسلمانوں کی خدمت کرتا ہے، اور فقہاء کا اختلاف ہے جہاں اس کا کوئی مقصد نہیں ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3605}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3606}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3607} کسی شخص کی طرف سے ان کے حق میں ہدیہ اور خیرات کی اجازت دی گئی ہے، جس کی اجازت کسی شخص کی طرف سے دی گئی ہے۔ شافعی اور حنبلی لیکن حنفیہ اور مالکیوں کی طرف سے نہیں، اور ان کے حق میں وقف معاہدہ سے باطل ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.3607}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3608} ان کو خوراک اور اسی طرح کی اشیاء برآمد کی جا سکتی ہیں۔ جنگ میں اسلحہ برآمد نہیں کیا جا سکتا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3609}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3610} ایک مسلمان مرد جنگ کی سرزمین کی کسی عیسائی یا یہودی عورت سے شادی کر سکتا ہے، جیسا کہ محفوظ لوگوں میں سے ہے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 صفحہ 3610}"
  tr: "Savaş halkı, zimme antına girmemiş ve Müslümanların güvenliği veya antlaşmasından faydalanmayan gayrimüslimlerdir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3600} Zimmi halkından ayrım yaparlar, zulüm halkı, antlaşma halkı ve güvenilenler. Zimmiler, antlaşmacılar veya savaş görevi verilenler, savaş evine katılarak veya antlaşmayı bozarak yüz çevirirler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3601} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3602} Savaş ağalarının kanı ve serveti antlaşma yoksa kabul edilir; eğer antlaşma varsa, o zaman yanılmazdır. {Cite:Fiqh-Mawsua-Kuwaitiyya-NOOR-V3 s.. 3604} Bir Müslüman, kendisine güveniyorsa savaş diyarında kendisini ihanete uğratması ve Müslümanların çıkarına oybirliğiyle mal mülkünü yok etmesi de caizdir; çıkar amacı taşımayan şeyi yok etmekte ise farklılık var. {atıf:fiqh-mawsua-kuveytiyya-noor-v3 s.3605} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3606} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3607} Onlara yapılan sadaka ve bağışlar çoğunluğa göre kabul edilir, vasiyetler ise Şafi'ler ve Hanbalilere göre geçerli, Hanafi ve Malikiler için geçerli değildir ve onlara uzlaşmayla bağışlanmıştır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3607} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3608} Onlara yiyecek ve benzeri eşyaların ihraç edilmesi caizdir, ancak savaşta silah alınmaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3609} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3610} Bir Müslümanın, Kitap Kitabı'ndan bir kadınla evlenmesi bir zimmi gibi kabul edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3610}"
  id: "Orang perang adalah non-Muslim yang belum mengucapkan sumpah dhimma dan tidak mendapat manfaat dari keamanan atau perjanjian Muslim. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3600} Mereka membedakan dari orang dhimmi, orang penindasan, orang perjanjian, dan yang dipercaya. Dhimmi, pengambil perjanjian, atau mereka yang ditugaskan perang berpaling dengan bergabung dengan rumah perang atau melanggar perjanjian. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3601} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3602} Darah dan kekayaan para panglima perang diterima jika tidak ada perjanjian; jika ada perjanjian, maka mereka tidak pernah salah. {Sitasi:Fiqh-Mawsua-Kuwaitiyya-NOOR-V3 hlm.. 3604} Jika seorang Muslim mempercayai dirinya sendiri, juga diperbolehkan mengkhianati dirinya di tanah perang dan menghancurkan hartanya secara bulat demi kepentingan Muslim; namun, ada perbedaan dalam menghancurkan apa yang tidak menguntungkan pribadi. {Sitasi:Fiqh-Mawsua-Kuwaitiyya-Noor-V3 hlm.3605} {sitasi:Fiqh-Mawsua-Kuwaitiyya-Noor-v3 hlm.3606} {Sitasi:Fiqh-Mawsua-Kuwaitiyya-Noor-v3 hlm.3607} Sedekah dan sumbangan yang diberikan kepada mereka diterima menurut mayoritas, sedangkan surat wasiat sah menurut Shafi'i dan Hanbali, tidak berlaku untuk Hanafi dan Maliki, dan diberikan kepada mereka berdasarkan kesepakatan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3607} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3608} Diperbolehkan mengekspor makanan dan barang sejenisnya, tetapi senjata tidak diambil dalam perang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3609} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3610} Seorang Muslim yang menikahi wanita dari Kitab dianggap sebagai dhimmi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3610}"
