summary:
  ar: "يقسم ابن سينا الغذاء إلى لطيف وكثيف ومعتدل، فاللطيف ما يتولد منه دم رقيق والكثيف ما يتولد منه دم ثخين، ثم يقسم كلاً منهما إلى كثير التغذية وقليلها، وإلى جيد الكيموس ورديئه {cite:canon-ibn-sina-print-v1 p.134}."
  en: "Ibn Sina divides food into fine, coarse and moderate. The fine yields thin blood and the coarse yields thick blood; each is then divided into richly nourishing and slightly nourishing, and into good chyme and bad chyme {cite:canon-ibn-sina-print-v1 p.134}."
