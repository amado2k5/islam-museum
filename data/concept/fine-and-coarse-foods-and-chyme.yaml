label: { ar: "الأغذية اللطيفة والكثيفة وحسن الكيموس عند ابن سينا", en: "Fine and coarse foods, nourishment and good chyme in the Canon", ur: "قانون میں لطیف و کثیف غذائیں اور اچھا کیموس", es: "Alimentos finos y gruesos, nutrición y buen quimo en el Canon", fr: "Aliments fins et grossiers, nourriture et bon chyme dans le Canon", tr: "İbn Sina'ya göre hoş ve yoğun yemekler ile chymes güzelliği", id: "Makanan yang enak dan padat serta keindahan kima menurut Ibn Sina" }
summary:
  ar: "يقسم ابن سينا الغذاء إلى لطيف وكثيف ومعتدل، فاللطيف ما يتولد منه دم رقيق والكثيف ما يتولد منه دم ثخين، ثم يقسم كلاً منهما إلى كثير التغذية وقليلها، وإلى جيد الكيموس ورديئه {cite:canon-ibn-sina-print-v1 p.134}."
  en: "Ibn Sina divides food into fine, coarse and moderate. The fine yields thin blood and the coarse yields thick blood; each is then divided into richly nourishing and slightly nourishing, and into good chyme and bad chyme {cite:canon-ibn-sina-print-v1 p.134}."
  es: "Ibn Sina divide los alimentos en finos, gruesos y moderados. Los finos producen sangre ligera y los gruesos, sangre espesa; cada uno se divide a su vez en nutritivo y ligeramente nutritivo, y en quimo bueno y quimo malo {cite:canon-ibn-sina-print-v1 p.134}."
  fr: "Ibn Sina classe les aliments en trois catégories: fins, grossiers et moyens. Les aliments fins donnent un sang léger, tandis que les aliments grossiers donnent un sang épais. Chaque catégorie est ensuite divisée en aliments très nourrissants et aliments peu nourrissants, et en bon et mauvais chyme {cite:canon-ibn-sina-print-v1 p.134}."
  ur: "ابن سینا کھانے کو باریک، موٹے اور معتدل میں تقسیم کرتا ہے۔ باریک سے پتلا خون اور موٹے سے گاڑھا خون نکلتا ہے۔ اس کے بعد ہر ایک کو بھرپور پرورش دینے والے اور قدرے پرورش دینے والے میں تقسیم کیا جاتا ہے، اور اچھے چائیم اور برے کائم میں تقسیم کیا جاتا ہے {حوالہ: کینن ابن سینا پرنٹ-v1 صفحہ 134}۔"
  tr: "İbn Sina yiyecekleri ince, yoğun ve ılımlı olarak ikiye ayırır. Latif ince kan üretir, kalın kan ise kalın kan üretir. Sonra hem bol hem az olan, hem iyi hem fakir kimler olarak böler {cite:canon-ibn-sina-print-v1 s.134}."
  id: "Ibn Sina membagi makanan menjadi halus, padat, dan sedang. Latif adalah yang menghasilkan darah tipis, dan kental adalah yang menghasilkan darah kental. Ia kemudian membagi menjadi melimpah dan kecil, serta menjadi kima baik dan miskin {cite:canon-ibn-sina-print-v1 hlm.134}."
