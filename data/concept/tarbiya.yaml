summary:
  ar: "يعرض البري تعريفات التربية عند أفلاطون وأرسطو وبستالوتزي وهربرت وكانت، ويرى أنها تؤول كلها إلى قول أفلاطون: إمداد الجسم والعقل بكل ما يمكن من الكمال والجمال، ويعدّ تربية النبي أسمى من ذلك لأن غايتها تتميم مكارم الأخلاق {cite:usul-al-tarbiya-azhar p. 18} {cite:usul-al-tarbiya-azhar p. 19}. وهذه التعريفات مما نسبه المؤلف إلى أصحابها، ولم تُراجع على نصوصهم."
  en: "Al-Bari sets out definitions of education by Plato, Aristotle, Pestalozzi, Herbart and Kant, and argues that they all come back to Plato's: supplying body and mind with all possible perfection. He holds the Prophet's education higher, since its aim is to complete noble character (pp. 18-19). These definitions are as the author attributes them; they were not checked against the philosophers' texts."
