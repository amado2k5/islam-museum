summary:
  ar: "يعرض البري تعريفات التربية عند أفلاطون وأرسطو وبستالوتزي وهربرت وكانت، ويرى أنها تؤول كلها إلى قول أفلاطون: إمداد الجسم والعقل بكل ما يمكن من الكمال والجمال، ويعدّ تربية النبي أسمى من ذلك لأن غايتها تتميم مكارم الأخلاق {cite:usul-al-tarbiya-azhar p. 18} {cite:usul-al-tarbiya-azhar p. 19}. وهذه التعريفات مما نسبه المؤلف إلى أصحابها، ولم تُراجع على نصوصهم."
  en: "Al-Bari sets out definitions of education by Plato, Aristotle, Pestalozzi, Herbart and Kant, and argues that they all come back to Plato's: supplying body and mind with all possible perfection. He holds the Prophet's education higher, since its aim is to complete noble character (pp. 18-19). These definitions are as the author attributes them; they were not checked against the philosophers' texts."
  es: "Al-Bari expone las definiciones de educación de Platón, Aristóteles, Pestalozzi, Herbart y Kant, y argumenta que todas convergen en la de Platón: dotar al cuerpo y la mente de toda la perfección posible. Considera que la educación del Profeta es superior, puesto que su objetivo es perfeccionar un carácter noble (págs. 18-19). Estas definiciones se presentan tal como las atribuye el autor; no se contrastaron con los textos de los filósofos."
  fr: "Al-Bari présente les définitions de l'éducation selon Platon, Aristote, Pestalozzi, Herbart et Kant, et soutient qu'elles convergent toutes vers celle de Platon: doter le corps et l'esprit de la plus grande perfection possible. Il place l'éducation du Prophète au-dessus de tout, car elle vise à parfaire un caractère noble (p. 18-19). Ces définitions sont données telles que l'auteur les attribue; elles n'ont pas été vérifiées à l'aune des textes des philosophes."
