summary:
  ar: "يوصي ابن سينا بخلط الرياضات الشديدة والسريعة بفترات أو برياضات فاترة، وبالتفنن في الرياضات وألا يقام على واحدة، ولكل عضو رياضة تخصه، ويفصل رياضة الصدر بالصوت الثقيل والحاد وبالنفخ مع حصر النفس، ويحذر من إطالة رفع الصوت {cite:canon-ibn-sina-print-v1 p.223}."
  en: "Ibn Sina advises mixing strong and quick exercises with rests or lax exercises, varying the exercises and not keeping to one, each organ having its own; he details exercise of the chest by heavy and sharp voice and by blowing while holding the breath, and warns against prolonged loud voice {cite:canon-ibn-sina-print-v1 p.223}."
