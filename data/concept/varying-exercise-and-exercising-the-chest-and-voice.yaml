id: concept/varying-exercise-and-exercising-the-chest-and-voice
class: concept
kind: scientific
label: { ar: "تنويع الرياضة ورياضة الصدر والصوت عند ابن سينا", en: "Varying exercise and exercising the chest and voice in the Canon", ur: "قانون میں ورزش میں تنوع اور سینے اور آواز کی ورزش", es: "Variar los ejercicios y ejercitar el pecho y la voz en el Canon", fr: "Varier les exercices et travailler la poitrine et la voix dans le canon" }
summary:
  ar: "يوصي ابن سينا بخلط الرياضات الشديدة والسريعة بفترات أو برياضات فاترة، وبالتفنن في الرياضات وألا يقام على واحدة، ولكل عضو رياضة تخصه، ويفصل رياضة الصدر بالصوت الثقيل والحاد وبالنفخ مع حصر النفس، ويحذر من إطالة رفع الصوت {cite:canon-ibn-sina-print-v1 p.223}."
  en: "Ibn Sina advises mixing strong and quick exercises with rests or lax exercises, varying the exercises and not keeping to one, each organ having its own; he details exercise of the chest by heavy and sharp voice and by blowing while holding the breath, and warns against prolonged loud voice {cite:canon-ibn-sina-print-v1 p.223}."
  es: "Ibn Sina aconseja mezclar ejercicios fuertes y rápidos con descansos o ejercicios suaves, variando los ejercicios y no limitándose a uno solo, ya que cada órgano tiene el suyo; detalla el ejercicio del pecho mediante voz fuerte y aguda y soplando mientras se contiene la respiración, y advierte contra la voz fuerte prolongada {cite:canon-ibn-sina-print-v1 p.223}."
  fr: "Ibn Sina conseille de mélanger des exercices forts et rapides avec des pauses ou des exercices lents, de varier les exercices et de ne pas s'en tenir à un seul, chaque organe ayant le sien; il détaille l'exercice de la poitrine par une voix lourde et aiguë et en soufflant tout en retenant son souffle, et met en garde contre une voix forte prolongée {cite:canon-ibn-sina-print-v1 p.223}."
  ur: "ابن سینا مضبوط اور تیز ورزشوں کو آرام یا سست ورزشوں کے ساتھ ملانے کا مشورہ دیتے ہیں، ورزشیں مختلف ہوتی ہیں اور ہر ایک عضو کا اپنا ہوتا ہے۔ وہ بھاری اور تیز آواز سے اور سانس کو روک کر پھونک مار کر سینے کی ورزش کی تفصیلات بیان کرتا ہے، اور طویل اونچی آواز سے خبردار کرتا ہے"
