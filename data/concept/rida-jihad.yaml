id: concept/rida-jihad
class: concept
kind: legal
label:
  ar: "الرِّدء"
  en: "Ridh (the helper of the fighters in jihad): his share of the booty, his liability in crimes, and his place in retaliation and banditry"
  ur: "مددگار (ردء)"
summary:
  ar: "الردء في اللغة المعين والناصر، وهو في الاصطلاح من يخلف المقاتلين أو يقف على مكان حتى إذا تركوا القتال قاتل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8689} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8690} واتفق الفقهاء على أن الردء والمقاتل المباشر سواء في أصل استحقاق الغنيمة، واختلفوا في تفضيل بعض على بعض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8690} ويجوز تعزير الردء في جرائم التعزير، ولا يحد حد الزنى والشرب والقذف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8691} وفي قطع الطريق يرى الجمهور أن حكم الردء كحكم المباشر، وقال الشافعية لا يجب الحد على من أعان ولم يباشر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8691} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8692} وفي القصاص يرى الجمهور أنه لا يقتص من الردء، وقال المالكية يقتص من المتمالئين على القتل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8692} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8693}"
  en: "Ridh in the lexicon is a helper or supporter; in the usage of jihad he is one who stands in for the fighters or waits at a post and fights when they withdraw. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8689} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8690} The jurists agree that the helper and the direct fighter are alike in the right to share the booty, and differ on giving one more than the other. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8690} A helper may be disciplined in cases of discretionary penalty; he has no hadd penalty for fornication, drinking or false accusation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8691} In banditry the majority treat the helper like the direct perpetrator, while the Shafi'is hold no hadd for one who only helped. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8691} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8692} In retaliation the majority do not punish the helper, while the Malikis punish those who agreed in advance to the killing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8692} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8693}"
  ur: "ردء وہ مدد گار ہے جو لڑنے والوں کے پیچھے کھڑا ہو کر ان کی حفاظت یا مدد کرے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8689} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8690} غنیمت میں اس کا حصہ جمہور کے نزدیک لڑنے والے کے برابر ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8690}"
