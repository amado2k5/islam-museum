id: concept/rida-jihad
class: concept
kind: legal
label:
  ar: "الرِّدء"
  en: "Ridh (the helper of the fighters in jihad): his share of the booty, his liability in crimes, and his place in retaliation and banditry"
  ur: "مددگار ⁦(ردء)⁩"
  es: "Ridh (el ayudante de los combatientes en la yihad): su parte del botín, su responsabilidad en los crímenes y su papel en las represalias y el bandidaje."
  fr: "Ridh (l'assistant des combattants du djihad): sa part du butin, sa responsabilité dans les crimes et son rôle dans les représailles et le banditisme."
  tr: "Düşük kalite"
  id: "Kualitas buruk"
summary:
  ar: "الردء في اللغة المعين والناصر، وهو في الاصطلاح من يخلف المقاتلين أو يقف على مكان حتى إذا تركوا القتال قاتل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8689} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8690} واتفق الفقهاء على أن الردء والمقاتل المباشر سواء في أصل استحقاق الغنيمة، واختلفوا في تفضيل بعض على بعض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8690} ويجوز تعزير الردء في جرائم التعزير، ولا يحد حد الزنى والشرب والقذف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8691} وفي قطع الطريق يرى الجمهور أن حكم الردء كحكم المباشر، وقال الشافعية لا يجب الحد على من أعان ولم يباشر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8691} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8692} وفي القصاص يرى الجمهور أنه لا يقتص من الردء، وقال المالكية يقتص من المتمالئين على القتل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8692} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8693}"
  en: "Ridh in the lexicon is a helper or supporter; in the usage of jihad he is one who stands in for the fighters or waits at a post and fights when they withdraw. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8689} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8690} The jurists agree that the helper and the direct fighter are alike in the right to share the booty, and differ on giving one more than the other. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8690} A helper may be disciplined in cases of discretionary penalty; he has no hadd penalty for fornication, drinking or false accusation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8691} In banditry the majority treat the helper like the direct perpetrator, while the Shafi'is hold no hadd for one who only helped. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8691} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8692} In retaliation the majority do not punish the helper, while the Malikis punish those who agreed in advance to the killing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8692} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8693}"
  ur: "ردء وہ مدد گار ہے جو لڑنے والوں کے پیچھے کھڑا ہو کر ان کی حفاظت یا مدد کرے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8689} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8690} غنیمت میں اس کا حصہ جمہور کے نزدیک لڑنے والے کے برابر ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8690}"
  es: "Ridh en el léxico es un ayudante o partidario; en el uso de la yihad es aquel que sustituye a los combatientes o espera en un puesto y lucha cuando se retiran. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8689} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8690} Los juristas coinciden en que el ayudante y el combatiente directo tienen el mismo derecho a compartir el botín, y difieren en dar a uno más que al otro. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8690} Un ayudante puede ser disciplinado en casos de castigo discrecional; no tiene castigo hadd por fornicación, bebida o falsa acusación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8691} En el bandidaje, la mayoría trata al cómplice como al perpetrador directo, mientras que los shafi'ís no tienen hadd para quien solo ayudó. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8691} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8692} En represalia, la mayoría no castiga al cómplice, mientras que los malikíes castigan a quienes acordaron de antemano el asesinato. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8692} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8693}"
  fr: "Dans le lexique, « ridh » désigne un assistant ou un soutien; dans le contexte du jihad, il s’agit de celui qui remplace les combattants ou qui attend à un poste et combat lorsqu’ils se retirent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8689} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8690} Les juristes s’accordent à dire que l’assistant et le combattant direct ont le même droit au butin, mais divergent quant à la part à accorder à l’un plutôt qu’à l’autre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8690} Un assistant peut être sanctionné dans les cas où la peine est discrétionnaire; il n’est pas passible de peine de hadd pour fornication, ivresse ou fausse accusation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8691} En matière de banditisme, la majorité considère le complice comme l'auteur direct, tandis que les chaféites n'imposent aucune peine à celui qui a seulement aidé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8691} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8692} En cas de représailles, la majorité ne punit pas le complice, tandis que les malikites punissent ceux qui ont consenti au meurtre à l'avance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8692} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8693}"
  tr: "Dilbilimde 'al-ma'in' ve 'al-nasir' terimleri terminolojidir; terminolojide, savaşçıların arkasında duran veya savaşmayı bırakırlarsa katil olacak bir yerde duran kişidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8689} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8690} Hukukçular, ganimetlerin orijinal hakkı bakımından itme ile doğrudan dövüşün aynı olduğunu kabul etmiş ve birini diğerine tercih etmede farklılık göstermişlerdir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8690} Ta'zir suçlarında ta'zir yapmak caizdir, ancak zina, içki içme ve iftira cezası sınırlı değildir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8691} Yolu kapatan çoğunluk, intikam alma kararının doğrudan ceza gibi olduğuna inanır. Şafi'ler, yardım eden ama başlatmamış kişi için cezanın gerekli olmadığını söyler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8691} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8692} Misilleme olarak, çoğunluk misillemenin intikam için uygulanmadığına inanır ve Malikiler intikamın öldürmeye istekli olanlara uygulandığını söyler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8692} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8693}"
  id: "Dalam linguistik, istilah 'al-ma'in' dan 'al-nasir' adalah istilah, dan dalam terminologi, adalah seseorang yang berdiri di belakang pejuang atau berdiri di tempat sehingga jika mereka berhenti bertarung, ia menjadi pembunuh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8689} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8690} Para ahli hukum sepakat bahwa penolakan dan pertarungan langsung sama dalam hal hak asli atas rampasan, dan mereka berbeda dalam memilih satu di atas yang lain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8690} Diperbolehkan untuk kejahatan ta'zir in ta'zir, tetapi hukuman untuk perzinahan, minum, dan pencemaran nama baik tidak terbatas. {cite::fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8691} Dalam memutus jalan, mayoritas percaya bahwa putusan pengambilan kembali adalah hukuman langsung. Syafi'i berkata bahwa hukuman tidak diperlukan bagi yang membantu tetapi tidak memulainya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8691} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8692} Sebagai pembalasan, mayoritas percaya bahwa pembalasan tidak diterapkan untuk pembalasan, dan Malikis mengatakan bahwa pembalasan diterapkan kepada mereka yang bersedia membunuh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8692} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8693}"
