label: { ar: "الإنذار", en: "Inthar (warning before a harm, a penalty or an act)" }
summary:
  ar: "الإنذار لغة الإبلاغ والإعلام، وأكثر ما يستعمل في التخويف والتحذير من القبيح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3466} ويختلف حكمه بحسب موضعه: فيجب إنذار الأعمى من الوقوع في البئر، ويجب إنذار الكفار الذين لم تبلغهم الدعوة قبل قتالهم، ويستحب استتابة المرتد ثلاثة أيام، ويباح إنذار الزوجة الناشز بالوعظ، ويحرم إن كان فيه ضرر أشد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3467} وهو من حق كل مسلم في الأمر بالمعروف والنهي عن المنكر، ويتعين لوالي الحسبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3468}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3469}"
  en: "Inthar is informing and warning, and mostly used for warning of evil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3466} Its ruling depends on where it is used. A blind man must be warned from falling into a well; unbelievers who have not heard the call must be warned before fighting; an apostate is recommended to be given three days to repent; a rebellious wife may be admonished; and warning is forbidden where it causes greater harm. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3467} It is a right of every Muslim within commanding right and forbidding wrong, and the officer of hisba is bound to it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3468}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3469}"
