id: concept/inthar
class: concept
kind: legal
label: { ar: "الإنذار", en: "Inthar (warning before a harm, a penalty or an act)", es: "Inthar (advertencia antes de un daño, una pena o un acto)", fr: "Inthar (avertissement avant un dommage, une sanction ou un acte)" }
summary:
  ar: "الإنذار لغة الإبلاغ والإعلام، وأكثر ما يستعمل في التخويف والتحذير من القبيح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3466} ويختلف حكمه بحسب موضعه: فيجب إنذار الأعمى من الوقوع في البئر، ويجب إنذار الكفار الذين لم تبلغهم الدعوة قبل قتالهم، ويستحب استتابة المرتد ثلاثة أيام، ويباح إنذار الزوجة الناشز بالوعظ، ويحرم إن كان فيه ضرر أشد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3467} وهو من حق كل مسلم في الأمر بالمعروف والنهي عن المنكر، ويتعين لوالي الحسبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3468}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3469}"
  en: "Inthar is informing and warning, and mostly used for warning of evil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3466} Its ruling depends on where it is used. A blind man must be warned from falling into a well; unbelievers who have not heard the call must be warned before fighting; an apostate is recommended to be given three days to repent; a rebellious wife may be admonished; and warning is forbidden where it causes greater harm. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3467} It is a right of every Muslim within commanding right and forbidding wrong, and the officer of hisba is bound to it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3468}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3469}"
  es: "Inthar significa informar y advertir, y se usa principalmente para advertir sobre el mal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3466} Su regla depende del contexto. Se debe advertir a un ciego que no caiga en un pozo; se debe advertir a los incrédulos que no hayan escuchado el llamado antes de luchar; se recomienda darle a un apóstata tres días para arrepentirse; se puede amonestar a una esposa rebelde; y la advertencia está prohibida cuando causa mayor daño. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3467} Es un derecho de todo musulmán ordenar el bien y prohibir el mal, y el oficial de hisba está obligado a ello. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3468}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3469}"
  fr: "Inthar signifie informer et avertir, et sert principalement à prévenir du mal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3466} Son usage dépend du contexte. Il faut avertir un aveugle du danger de tomber dans un puits; les infidèles qui n’ont pas entendu l’appel doivent être avertis avant de combattre; il est recommandé d’accorder trois jours à un apostat pour se repentir; une épouse rebelle peut être admonestée; et l’avertissement est interdit lorsqu’il cause un préjudice plus grave. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3467} Tout musulman a le droit d’ordonner le bien et d’interdire le mal, et l’officier de la hisba est tenu de s’y conformer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3468}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3469}"
