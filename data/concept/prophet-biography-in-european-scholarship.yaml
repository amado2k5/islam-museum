label: { ar: "السيرة النبوية في كتابات المستشرقين", en: "The Prophet's biography in European scholarship" }
summary:
  ar: "يعرض شكيب أرسلان في فصل «السيرة النبوية وكتاب حياة محمد» قراءة لكتاب إميل درمنغهم عن حياة النبي، وهو كتاب لباحث فرنسي. يتناول العرض مواضع منها بدء الوحي، وحديث النبي وتحديثه، وقضية صلب المسيح ومقارنة العقيدتين في عيسى، وجمع القرآن. وينقل عن مؤرخ أوروبي تصنيفاً لأصحاب الحديث بحسب درجة ثقة مؤلفي السيرة، ويرى أرسلان أن صاحب الكتاب منصف لكنه يخالفه في تفاصيل. هذا العرض يصف قراءة المؤلف لكتاب آخر، ولا يعدّ حكماً في سيرة النبي."
  en: "Arslan reviews Émile Dermenghem's Life of Muhammad, a French study. He discusses the book's treatment of the first revelation, of hadith and its transmission, of the crucifixion and how Islam and Christianity differ on Jesus, and of the compilation of the Qur'an. He also reports a European historian's classification of Arab biographers by reliability. He finds Dermenghem fair but disagrees with him on several points. The entry describes Arslan's reading of another author, not a judgement on the Prophet's life."
wings: [ideas, people]
periods: [period/prophetic-era]
