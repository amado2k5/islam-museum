label: { ar: "السيرة النبوية في كتابات المستشرقين", en: "The Prophet's biography in European scholarship", es: "La biografía del Profeta en la erudición europea", fr: "La biographie du Prophète dans les études européennes", ur: "یورپی اسکالرشپ میں سیرت نبوی" }
summary:
  ar: "يعرض شكيب أرسلان في فصل «السيرة النبوية وكتاب حياة محمد» قراءة لكتاب إميل درمنغهم عن حياة النبي، وهو كتاب لباحث فرنسي. يتناول العرض مواضع منها بدء الوحي، وحديث النبي وتحديثه، وقضية صلب المسيح ومقارنة العقيدتين في عيسى، وجمع القرآن. وينقل عن مؤرخ أوروبي تصنيفاً لأصحاب الحديث بحسب درجة ثقة مؤلفي السيرة، ويرى أرسلان أن صاحب الكتاب منصف لكنه يخالفه في تفاصيل. هذا العرض يصف قراءة المؤلف لكتاب آخر، ولا يعدّ حكماً في سيرة النبي."
  en: "Arslan reviews Émile Dermenghem's Life of Muhammad, a French study. He discusses the book's treatment of the first revelation, of hadith and its transmission, of the crucifixion and how Islam and Christianity differ on Jesus, and of the compilation of the Qur'an. He also reports a European historian's classification of Arab biographers by reliability. He finds Dermenghem fair but disagrees with him on several points. The entry describes Arslan's reading of another author, not a judgement on the Prophet's life."
  es: "Arslan reseña La vida de Mahoma, de Émile Dermenghem, un estudio francés. Analiza el tratamiento que el libro da a la primera revelación, a los hadices y su transmisión, a la crucifixión y a las diferencias entre el islam y el cristianismo respecto a Jesús, así como a la compilación del Corán. También cita la clasificación de biógrafos árabes según su fiabilidad realizada por un historiador europeo. Considera que Dermenghem es imparcial, pero discrepa con él en varios puntos. Esta entrada describe la interpretación que Arslan hace de otro autor, no un juicio sobre la vida del Profeta."
  fr: "Arslan rend compte de la Vie de Mahomet d'Émile Dermenghem, une étude française. Il analyse le traitement de la première révélation, des hadiths et de leur transmission, de la crucifixion et des divergences entre l'islam et le christianisme concernant Jésus, ainsi que de la compilation du Coran. Il mentionne également le classement des biographes arabes par un historien européen, établi selon leur fiabilité. Il juge Dermenghem impartial, mais diverge de son point de vue sur plusieurs aspects. Cet article décrit l'interprétation qu'Arslan fait d'un autre auteur; il ne constitue pas un jugement sur la vie du Prophète."
  ur: "ارسلان نے ایمائل ڈرمینگھم کی لائف آف محمد کا جائزہ لیا، ایک فرانسیسی مطالعہ۔ وہ پہلی وحی، حدیث اور اس کی منتقلی، مصلوبیت اور حضرت عیسیٰ کے بارے میں اسلام اور عیسائیت میں کس طرح اختلاف ہے، اور قرآن کی تالیف کے بارے میں کتاب کے علاج پر گفتگو کرتا ہے۔ وہ ایک یورپی مورخ کی عرب سوانح نگاروں کی اعتباریت کے اعتبار سے درجہ بندی کی بھی رپورٹ کرتا ہے۔ وہ ڈرمینگھم کو منصفانہ سمجھتا ہے لیکن کئی نکات پر اس سے متفق نہیں ہے۔ اندراج میں ارسلان کے کسی دوسرے مصنف کے پڑھنے کی وضاحت کی گئی ہے، نہ کہ نبی کی زندگی کے بارے میں کوئی فیصلہ۔"
