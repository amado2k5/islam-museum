id: concept/alamat-al-dawar-min-al-udw
class: concept
kind: scientific
label:
  ar: "علامات الدوار من عضو آخر ومن سوء المزاج"
  en: "Signs of vertigo from another organ and from a bad temperament"
  fr: "Les signes du vertige venant d’un autre organe et d’un mauvais tempérament"
  ur: "دوسرے عضو اور بدمزاجی سے دوار کی علامات"
  es: "Signos de vértigo provenientes de otro órgano y de un mal temperamento"
  tr: "Başka bir organdan kaynaklanan baş dönmesi belirtileri ve kötü ruh hali"
  id: "Gejala pusing yang berasal dari organ lain dan suasana hati yang buruk"
summary:
  ar: "يذكر ابن سينا علامات الدوار من المعدة ⁦(بطلان الشهوة وفساد الهضم ووجع)⁩، وما كان من الكبد أو القلب، وما كان عن سوء مزاج مختلف، وأن الدوار إذا طال فالعلة بادرة ⁦(كما طُبع)⁩، وفيه سطر موسوم في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v2 p.115} {cite:canon-ibn-sina-print-v2 p.116}"
  en: "Ibn Sina gives the signs of vertigo from the stomach (loss of appetite, spoiled digestion, pain), from the liver or the heart, and from a changing bad temperament, and that when it lasts the illness is 'badira' (as printed); the record has a labelled line in a section held for the founder's ruling {cite:canon-ibn-sina-print-v2 p.115} {cite:canon-ibn-sina-print-v2 p.116}"
  fr: "Ibn Sina donne les signes du vertige venant de l’estomac (perte d’appétit, digestion corrompue, douleur), du foie ou du cœur, et d’un mauvais tempérament changeant, et dit que lorsqu’il dure la maladie est « badira » (tel qu’imprimé) ; la fiche comporte une ligne signalée dans une section en attente de la décision du fondateur {cite:canon-ibn-sina-print-v2 p.115} {cite:canon-ibn-sina-print-v2 p.116}"
  ur: "ابن سینا معدے سے دوار کی علامات ⁦(بھوک کا جاتے رہنا، بگڑا ہوا ہضم، درد)⁩، جگر یا دل سے ہونے والے، اور بدلتی بدمزاجی سے ہونے والے دوار کی علامات بتاتا ہے، اور یہ کہ جب وہ طویل ہو تو مرض «بادرة» ہے ⁦(جیسا چھپا ہے)⁩؛ اس میں ایک موسوم سطر بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v2 p.115} {cite:canon-ibn-sina-print-v2 p.116}۔"
  es: "Ibn Sina menciona que los síntomas del vértigo pueden provenir del estómago (pérdida de apetito, digestión deficiente, dolor), del hígado o del corazón, y de un mal temperamento cambiante, y que cuando persiste la enfermedad es 'badira' (como se indica en la transcripción); el registro contiene una línea etiquetada en una sección reservada para la decisión del fundador {cite:canon-ibn-sina-print-v2 p.115} {cite:canon-ibn-sina-print-v2 p.116}"
  tr: "İbn Sina, mide kaynaklı baş dönmesi belirtilerini (geçersiz arzu, kötü sindirim ve ağrı), karaciğer veya kalpten kaynaklananları ve farklı bir ruh halinden kaynaklanan belirtileri belirtir ve baş dönmesi uzun sürerse hastalığın ani olduğunu (basıldığı gibi) belirtir. Kurucunun kararıyla ilgili bir bölümde şu başlıklı bir satır yer alır: {cite:canon-ibn-sina-print-v2 s.115} {cite:canon-ibn-sina-print-v2 s.116}"
  id: "Ibn Sina menyebutkan gejala pusing yang berasal dari lambung (keinginan tidak sehat, pencernaan buruk, dan nyeri), gejala yang berasal dari hati atau jantung, serta gejala yang disebabkan oleh suasana hati yang berbeda, dan menyatakan bahwa jika pusing berlangsung lama, penyakit itu terjadi secara tiba-tiba (seperti yang didesak). Dalam bagian tentang keputusan pendiri, terdapat baris berjudul: {cite:canon-ibn-sina-print-v2 hlm.115} {cite:canon-ibn-sina-print-v2 hlm.116}"
