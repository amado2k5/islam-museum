label:
  ar: "فريق العمل وإدارة الاجتماعات"
  en: "Teamwork and running meetings"
  ur: "ٹیم ورک اور اجلاسوں کا انتظام"
summary:
  ar: "سبعة معايير لفريق العمل عند طارق السويدان — اختيار قائد يمارس قيادته، التخطيط، المشاركة، التحفيز، توزيع الأدوار، إدارة النقاش مع حماية الضعيف، وإدارة المعلومات بأنواعها الثلاثة — وفيها تلخيص طرق إدارة الاجتماعات وتخريبها."
  en: "Tareq al-Suwaidan's seven criteria of a work team — choosing a leader who actually leads, planning, participation, motivation, distributing roles, managing discussion while protecting the weak, and managing the three kinds of information — including his summary of how meetings are run and sabotaged."
  ur: "ٹیم ورک کے لیے طارق السویدان کے سات معیار — ایسا قائد چننا جو واقعی قیادت کرے، منصوبہ بندی، شرکت، تحفيز، کرداروں کی تقسیم، مباحثے کا انتظام اور کمزور کی حفاظت، اور معلومات کی تین اقسام کا انتظام — جس میں اجلاس چلانے اور خراب کرنے کے طریقے بھی شامل ہیں۔"
