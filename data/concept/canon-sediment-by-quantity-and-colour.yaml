summary:
  ar: "يبين ابن سينا أن كثرة الرسوب وقلته تدلان على كثرة السبب الفاعل وقلته، وأن لونه يدل: فالأسود رديء والأحمر دموي وتخمة والأصفر شدة حرارة والأبيض محمود أو مذموم والأخضر طريق إلى الأسود. {cite:canon-ibn-sina-print-v1 pp.195-196}."
  en: "Ibn Sina says much or little sediment shows much or little of the producing cause, and that colour speaks: black is bad, red shows blood and indigestion, yellow strong heat, white is praised or blamed by kind, and green is a road to black. {cite:canon-ibn-sina-print-v1 pp.195-196}."
