id: concept/canon-sediment-by-quantity-and-colour
class: concept
kind: scientific
label:
  ar: "دلالة الرسوب من كميته ولونه عند ابن سينا"
  en: "What sediment shows by its quantity and colour in the Canon"
  fr: "Sédiment selon quantité et couleur dans le Canon"
  ur: "مقدار اور رنگ کے لحاظ سے تلچھٹ کی دلالت قانون میں"
  es: "Lo que el sedimento muestra por su cantidad y color en el Cañón"
  tr: "İbn Sina'ya göre miktarı ve renginden başarısızlık göstergesi"
  id: "Indikasi kegagalan berdasarkan kuantitas dan warnanya menurut Ibn Sina"
summary:
  ar: "يبين ابن سينا أن كثرة الرسوب وقلته تدلان على كثرة السبب الفاعل وقلته، وأن لونه يدل: فالأسود رديء والأحمر دموي وتخمة والأصفر شدة حرارة والأبيض محمود أو مذموم والأخضر طريق إلى الأسود. {cite:canon-ibn-sina-print-v1 pp.195-196}."
  en: "Ibn Sina says much or little sediment shows much or little of the producing cause, and that colour speaks: black is bad, red shows blood and indigestion, yellow strong heat, white is praised or blamed by kind, and green is a road to black. {cite:canon-ibn-sina-print-v1 pp.195-196}."
  fr: "Selon Ibn Sina, quantité du sédiment et cause productrice varient ensemble ; le noir serait mauvais, le rouge indiquerait sang et indigestion, le jaune forte chaleur, le blanc serait jugé selon son type, le vert annoncerait le noir. {cite:canon-ibn-sina-print-v1 pp.195-196}."
  es: "Ibn Sina afirma que la cantidad de sedimentos, ya sea abundante o escasa, indica la presencia de la causa que los produce, y que el color es significativo: el negro es malo, el rojo muestra sangre e indigestión, el amarillo calor intenso, el blanco es alabado o censurado por la naturaleza, y el verde es un camino hacia el negro. {cite:canon-ibn-sina-print-v1 pp.195-196}."
  ur: "ابن سینا کا کہنا ہے کہ بہت زیادہ یا تھوڑی سی تلچھٹ پیدا کرنے والی وجہ کا زیادہ یا کم ظاہر کرتی ہے، اور یہ رنگ بولتا ہے: کالا برا ہے، سرخ خون اور بدہضمی کو ظاہر کرتا ہے، پیلا سخت گرمی، سفید کو قسم کی تعریف یا الزام لگایا جاتا ہے، اور سبز سیاہ کا راستہ ہے۔ {حوالہ: کینن ابن سینا پرنٹ v1 صفحہ 195-196}۔"
  tr: "İbn Sina, başarısızlığın bolluğu ve azlığının etkin nedenin bolluğunu ve kıtlığını gösterdiğini, renginin ise siyah fakir, kırmızı kanlı ve bol, sarı yoğun sıcaklık, beyaz övgüye değer veya suçlanacak ve yeşilin siyaha giden yol olduğunu açıklar. {cite:canon-ibn-sina-print-v1 s.195-196}."
  id: "Ibn Sina menjelaskan bahwa kelimpahan dan kelangkaan kegagalan menunjukkan kelimpahan dan kelangkaan penyebab aktif, dan warnanya menunjukkan: hitam itu miskin, merah berdarah dan melimpah, kuning adalah panas intens, putih patut dipuji atau patut disalahkan, dan hijau adalah jalan menuju hitam. {cite:canon-ibn-sina-print-v1 hlm.195-196}."
