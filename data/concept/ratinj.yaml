summary:
  ar: "الراتينج في الكتاب نوع من صمغ شجرة الصنوبر، حار إلى الثالثة يابس في الأولى، منبت للحم في الأبدان الجاسية لكنه يهيج الألم في الأبدان الناعمة، وتبرأ به القروح {cite:canon-ibn-sina-print-v1 p.665}"
  en: "Ratinj is in the book a kind of gum of the pine tree, hot to the third degree and dry in the first, a grower of flesh in hard bodies but one that stirs pain in tender bodies, and by it ulcers are healed {cite:canon-ibn-sina-print-v1 p.665}"
  ur: "راتینج کتاب میں صنوبر کے درخت کی گوند کی ایک قسم ہے، تیسرے درجے تک گرم اور پہلے میں خشک، سخت بدنوں میں گوشت اگانے والا مگر نرم بدنوں میں درد کو بھڑکانے والا، اور اس سے قرحے ٹھیک ہوتے ہیں {cite:canon-ibn-sina-print-v1 p.665}۔"
