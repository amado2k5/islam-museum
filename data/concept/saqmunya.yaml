summary:
  ar: "السقمونيا في الكتاب لبن نبات ينقل ديسقوريدوس وصفه، له ثلاثة أغصان كبيرة من أصل واحد وزهر أبيض مستدير أجوف وأصل طويل غليظ ممتلئ لبناً، أجوده الأزرق إلى البياض كأنه كسر الصدف، حار يابس في الثالثة، فيه جلاء وتحليل وهو عدو للمعدة والكبد، ينقي البهق والكلف، ويسهل الصفراء بقوة، والكتاب يحذر من ضرره ومن غشه بلبن اليتوع، ويذكر له نقلاً موسوماً في الجنين {cite:canon-ibn-sina-print-v1 p.594}."
  en: "Saqmunya is in the book the milk of a plant that Dioscorides describes, with three large branches from one root, a white round hollow flower and a long thick root full of milk; the best is the blue turning to white as if the break of a shell, hot and dry in the third degree, cleansing and dissolving, an enemy of the stomach and liver, clearing vitiligo and freckles, and purging bile strongly; the book warns of its harm and of its adulteration with spurge milk, and gives a labelled listing on the foetus {cite:canon-ibn-sina-print-v1 p.594}."
  ur: "سقمونیا کتاب میں ایک پودے کا دودھ ہے جس کی تفصیل دیسقوریدوس سے نقل ہوئی: ایک جڑ سے تین بڑی شاخیں، سفید گول کھوکھلا پھول، اور لمبی موٹی جڑ جو دودھ سے بھری ہوتی ہے؛ بہترین وہ ہے جو نیلا سفیدی کی طرف مائل ہو گویا سیپ کا ٹوٹنا، تیسرے درجے میں گرم خشک، جلا اور تحلیل رکھنے والا، معدے اور جگر کا دشمن، برص اور چھائیاں صاف کرتا اور صفرا کو قوت سے خارج کرتا ہے؛ کتاب اس کے ضرر اور یتوع کے دودھ کی ملاوٹ سے خبردار کرتی ہے، اور جنین کے بارے میں ایک موسوم نقل دیتی ہے {cite:canon-ibn-sina-print-v1 p.594}۔"
  es: "Saqmunya es en el libro la leche de una planta que Dioscórides describe, con tres grandes ramas de una raíz, una flor blanca redonda y hueca y una raíz larga y gruesa llena de leche; la mejor es la azul que se vuelve blanca como si se rompiera una concha, caliente y seca en tercer grado, limpiadora y disolvente, enemiga del estómago y del hígado, que elimina el vitíligo y las pecas, y purga la bilis fuertemente; el libro advierte de su daño y de su adulteración con leche de euforbia, y da una lista etiquetada en el feto {cite:canon-ibn-sina-print-v1 p.594}."
  fr: "Le livre décrit la saqmunya comme le lait d'une plante dont Dioscoride dit qu'elle possède trois grandes branches issues d'une seule racine, une fleur blanche, ronde et creuse, et une longue racine épaisse pleine de lait. La meilleure variété est celle dont le bleu vire au blanc comme la coquille qui se brise; chaude et sèche au troisième degré, elle purifie et dissout, mais elle est néfaste pour l'estomac et le foie, elle élimine le vitiligo et les taches de rousseur, et purge la bile avec force. Le livre met en garde contre ses dangers et son adultération avec du lait d'euphorbe, et donne une liste commentée du fœtus {cite:canon-ibn-sina-print-v1 p.594}."
