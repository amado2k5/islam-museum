label:
  ar: "التدارك"
  en: "Tadarruk (making up or repairing a missed part of worship)"
  ur: "تدارک (عبادت میں رہ جانے والی چیز کی تلافی)"
summary:
  ar: "التدارك فعل العبادة أو جزئها إذا تركه المكلف في محله المقرر شرعا ما لم يفت. وتدارك الركن المفروض فرض، وتختلف أحكام الواجبات والسنن بحسب المذاهب، فيتدارك الحنفية والمالكية الوضوء بغسل المتروك وحده، ويشترط الشافعية الترتيب. وفي الحج تدارك الطواف والسعي والوقوف والرمي بأحكام متفاوتة، وتسقط العبادة عن المجنون والمغمى عليه بحسب الحالة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4868} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4869} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4886}"
  en: "Tadarruk is performing an act of worship, or part of it, that the person left out at its proper time, as long as the time has not passed. Making up a fixed pillar is obligatory; the rules for obligatory and recommended parts differ by school. In wudu, the Hanafis and Malikis make up only the missed part, while the Shafi'is require order. In the pilgrimage the making up of circuits, running, standing and stoning follow their own rules; in madness and fainting, the duty of prayer, fasting and pilgrimage is decided by the state of the person. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4868} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4869} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4886}"
