id: concept/tadarruk
class: concept
kind: legal
label:
  ar: "التدارك"
  en: "Tadarruk (making up or repairing a missed part of worship)"
  ur: "تدارک ⁦(عبادت میں رہ جانے والی چیز کی تلافی)⁩"
  es: "Tadarruk (recuperar o reparar una parte del culto que se ha omitido)"
  fr: "Tadaruk (rattraper ou réparer une partie manquée du culte)"
  tr: "Kurtarma"
  id: "Pemulihan"
summary:
  ar: "التدارك فعل العبادة أو جزئها إذا تركه المكلف في محله المقرر شرعا ما لم يفت. وتدارك الركن المفروض فرض، وتختلف أحكام الواجبات والسنن بحسب المذاهب، فيتدارك الحنفية والمالكية الوضوء بغسل المتروك وحده، ويشترط الشافعية الترتيب. وفي الحج تدارك الطواف والسعي والوقوف والرمي بأحكام متفاوتة، وتسقط العبادة عن المجنون والمغمى عليه بحسب الحالة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4868} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4869} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4886}"
  en: "Tadarruk is performing an act of worship, or part of it, that the person left out at its proper time, as long as the time has not passed. Making up a fixed pillar is obligatory; the rules for obligatory and recommended parts differ by school. In wudu, the Hanafis and Malikis make up only the missed part, while the Shafi'is require order. In the pilgrimage the making up of circuits, running, standing and stoning follow their own rules; in madness and fainting, the duty of prayer, fasting and pilgrimage is decided by the state of the person. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4868} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4869} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4886}"
  es: "Tadarruk es realizar un acto de adoración, o parte de él, que la persona omitió en su momento debido, siempre y cuando no haya transcurrido el tiempo. Completar un pilar fijo es obligatorio; las reglas para las partes obligatorias y recomendadas difieren según la escuela. En el wudu, los hanafíes y malikíes completan solo la parte omitida, mientras que los shafiíes requieren orden. En la peregrinación, completar los circuitos, correr, permanecer de pie y lapidar siguen sus propias reglas; en caso de locura o desmayo, el deber de la oración, el ayuno y la peregrinación se decide según el estado de la persona. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4868} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4869} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4886}"
  fr: "Le tadarruk consiste à accomplir un acte de culte, ou une partie de celui-ci, que la personne a omis à son heure, tant que cette heure n'est pas passée. Rattraper un pilier fixe est obligatoire; les règles concernant les parties obligatoires et recommandées diffèrent selon les écoles. Pour les ablutions (wudu), les hanafites et les malikites ne rattrapent que la partie omise, tandis que les shafi'ites exigent un ordre précis. Lors du pèlerinage, le rattrapage des circuits, la course, la station debout et la lapidation obéissent à des règles spécifiques; en cas de folie ou d'évanouissement, l'obligation de prier, de jeûner et d'accomplir le pèlerinage est déterminée par l'état de la personne."
  ur: "تدارک ایک عبادت یا اس کا کچھ حصہ ہے جسے آدمی نے اس کے وقت پر چھوڑ دیا، جب تک کہ وقت گزر نہ گیا ہو۔ ایک مقررہ ستون بنانا واجب ہے۔ لازمی اور تجویز کردہ حصوں کے قوانین اسکول کے لحاظ سے مختلف ہیں۔ وضو میں حنفیہ اور مالکیہ صرف چھوٹے ہوئے حصے کو بناتے ہیں جبکہ شافعی حکم کے متقاضی ہیں۔ حج میں چکر لگانا، دوڑنا، کھڑا ہونا اور سنگسار کرنا اپنے اپنے اصولوں پر عمل کرتے ہیں۔ جنون اور بیہوشی میں نماز، روزہ اور حج کا فرض انسان کی حالت سے طے ہوتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ4868} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ4869}"
  tr: "Bir ibadet eylemini veya bir kısmını düzeltmek, zorunlu kişinin İslam hukukuna göre fetva verilmedikçe onu belirlenen yerinde bırakmasıdır. Zorunlu sütunun düzeltilmesi zorunludur ve zorunlu eylem ile sünnetlerin hükümleri okullara göre değişir. Hanafi ve Malikiler abdest almayı sadece sol kısmı yıkayarak telafi ederler, Şafiiler ise bu emri ister. Hac'ta Tevaf, Sa'i, ayakta durma ve taşlama farklı kurallarla yapılır ve duruma bağlı olarak akıl hastaları ve bilinçsizler için ibadet kaldırılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4868} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4869} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4886}"
  id: "Memperbaiki suatu tindakan ibadah atau sebagian darinya adalah jika orang yang wajib meninggalkannya di tempat yang ditetapkan menurut hukum Islam kecuali fatwa dikeluarkan. Memperbaiki tiang wajib adalah kewajiban, dan aturan atas tindakan wajib serta Sunnah berbeda-beda menurut aliran. Hanafi dan Maliki mengganti wudhu dengan hanya mencuci bagian kiri, sementara Syafi'i mewajibkan perintah tersebut. Dalam Haji, melaksanakan Tawaf, Sa'i, berdiri, dan merajam dilakukan dengan aturan yang berbeda-beda, dan ibadah dibebaskan bagi orang gila dan tidak sadar diri tergantung situasi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4868} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4869} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4886}"
