  ur: "شوکۃ الیہودیہ"
  es: "Shawka yahudiyya"
  fr: "Shawka yahudiyya"
summary:
  ar: "شوكة اليهودية في الكتاب حارة لطيفة محللة، تنفع من الكزاز، ويتمضمض بطبيخها من وجع الضرس وتنفع من النوازل كلها وكذلك أصولها، وتنفع من نفث الدم من الصدر، وأصلها ينفع من تتابع القيء، ويذكر الكتاب نقلا موسوما موافقة أصلها لسيلان الرطوبات المزمنة من الرحم {cite:canon-ibn-sina-print-v1 p.684}"
  en: "Shawka yahudiyya is in the book hot, subtle and dissolving; it benefits tetanus, its decoction is used as a gargle for molar pain, it benefits all catarrhs, and so do its roots; it benefits spitting of blood from the chest, its root benefits continuous vomiting, and the book lists, as a labelled report, the suitability of its root for chronic flows of moisture from the womb {cite:canon-ibn-sina-print-v1 p.684}"
  ur: "شوکۃ الیہودیہ کتاب میں گرم، لطیف اور تحلیل کرنے والی ہے؛ کزاز میں نافع ہے، اس کے جوشاندے سے داڑھ کے درد کے لیے غرارہ کیا جاتا ہے، سب نزلات میں نافع ہے اور اس کی جڑیں بھی؛ سینے سے خون تھوکنے میں نافع ہے، اس کی جڑ لگاتار قے میں نافع ہے؛ اور کتاب منقول فہرست کے طور پر رحم سے پرانی رطوبتوں کے بہنے کے لیے اس کی جڑ کی موافقت درج کرتی ہے {cite:canon-ibn-sina-print-v1 p.684}۔"
  es: "Shawka yahudiyya es descrita en el libro como caliente, sutil y disolvente; beneficia el tétanos, su decocción se usa como gárgara para el dolor de muelas, beneficia todos los catarros, al igual que sus raíces; beneficia la expectoración de sangre del pecho, su raíz beneficia el vómito continuo, y el libro enumera, como un informe detallado, la idoneidad de su raíz para los flujos crónicos de humedad del útero {cite:canon-ibn-sina-print-v1 p.684}."
  fr: "Le Shawka yahudiyya est décrit dans le livre comme chaud, subtil et dissolvant; il est bénéfique contre le tétanos, sa décoction est utilisée en gargarisme contre les douleurs molaires, il est bénéfique contre tous les catarrhes, de même que ses racines; il est bénéfique en cas de crachats de sang provenant de la poitrine, sa racine est bénéfique en cas de vomissements continus, et le livre mentionne, sous forme de rapport détaillé, l’efficacité de sa racine contre les écoulements chroniques d’humidité provenant de l’utérus {cite:canon-ibn-sina-print-v1 p.684}"
