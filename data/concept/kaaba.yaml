label:
  ar: "كَعْبة"
  en: "The Kaaba and prayer toward it (kaʿba)"
  ur: "کعبہ اور اس کی طرف نماز ⁦(کعبہ)⁩"
  es: "La Kaaba y la oración hacia ella (kaʿba)"
  fr: "La Kaaba et la prière en son honneur (kaʿba)"
  tr: "Kabe"
  id: "Ka'bah"
summary:
  ar: "الكعبة في اللغة البيت المربع، وفي الاصطلاح البيت الحرام، والقبلة جهة يُصلى نحوها. ويشترط لصحة الصلاة استقبال الكعبة، فمن عاينها أصاب عينها، وغير المعاين يكفيه الاجتهاد عند بعض الفقهاء. وتصح الصلاة داخل الكعبة عند الحنفية والشافعية، وعند المالكية والحنابلة لا تصح الفريضة فيها وتصح النافلة، وتصح الفريضة على ظهرها عند الحنفية والشافعية وفي رواية عن الحنابلة، ولا تصح عند المالكية والحنابلة في المشهور، وتصح الصلاة في الأسطح والمرتفعات المجاورة اتفاقاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13278} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13279} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13280}"
  en: "The Kaaba in the lexicon is the square house; in the law it is the Sacred House, and the qibla is the direction toward which one prays. Facing the Kaaba is a condition of valid prayer. One who sees it must face its very mass; a person who cannot see it may rely on his judgement, as some jurists allow. The Hanafis and Shafi'is allow prayer inside it; the Malikis and Hanbalis forbid the obligatory prayer there and allow voluntary prayer. The Hanafis and Shafi'is allow the obligatory prayer on its roof, and the Hanbalis have a narration to that effect, while the Malikis and the better-known Hanbali view do not. Prayer on the adjoining roofs and on high ground nearby is valid by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13278} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13279} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13280}"
  ur: "کعبہ لغت میں چوکور گھر کو کہتے ہیں، اور اصطلاح میں بیت الحرام؛ قبلہ اس سمت کو کہتے ہیں جس کی طرف نماز پڑھی جائے۔ نماز کی صحت کے لیے کعبہ کی طرف رخ کرنا شرط ہے، جو اسے دیکھ سکتا ہو وہ اس کی ذات کی طرف رخ کرے، اور جو دیکھ نہ سکے تو بعض فقہاء کے نزدیک اجتہاد کافی ہے۔ حنفیہ اور شافعیہ کے نزدیک کعبہ کے اندر نماز جائز ہے؛ مالکیہ اور حنابلہ کے نزدیک فرض نماز وہاں جائز نہیں اور نفل جائز ہے۔ حنفیہ اور شافعیہ کے نزدیک چھت پر فرض نماز درست ہے، حنابلہ سے ایک روایت بھی یہی ہے، جبکہ مالکیہ اور مشہور حنبلی قول میں نہیں۔ قریبی چھتوں اور بلند مقامات پر نماز بالاتفاق درست ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13278} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13279} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13280}"
  es: "En el léxico, la Kaaba es la casa cuadrada; en la ley, la Casa Sagrada, y la qibla es la dirección hacia la que se reza. Orar hacia la Kaaba es condición para que la oración sea válida. Quien la ve debe orientarse hacia ella; quien no puede verla puede confiar en su propio juicio, como permiten algunos juristas. Los hanafíes y los shafiíes permiten la oración en su interior; los malikíes y los hanbalíes prohíben la oración obligatoria y permiten la voluntaria. Los hanafíes y los shafiíes permiten la oración obligatoria en su techo, y los hanbalíes tienen una narración al respecto, mientras que los malikíes y la opinión hanbalí más conocida no la tienen. La oración en los techos contiguos y en terrenos elevados cercanos es válida por acuerdo mutuo. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13278} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13279} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13280}"
  fr: "Dans le langage courant, la Kaaba désigne la maison carrée; en droit islamique, elle est la Maison Sacrée, et la qibla est la direction vers laquelle on prie. Se tourner vers la Kaaba est une condition de validité de la prière. Celui qui la voit doit faire face à sa masse même; celui qui ne la voit pas peut s'en remettre à son jugement, comme le permettent certains juristes. Les écoles hanafite et chaféite autorisent la prière à l'intérieur de la Kaaba; les écoles malikite et hanbalite interdisent la prière obligatoire en son sein et autorisent la prière surérogatoire. Les écoles hanafite et chaféite autorisent la prière obligatoire sur son toit, et les écoles hanbalites rapportent une tradition à cet effet, contrairement aux écoles malikite et hanbalite, plus répandue. La prière sur les toits adjacents et sur les hauteurs avoisinantes est valide par consensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13278} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13279} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13280}"
  tr: "Kabe, dilsel terimlerle 'kare ev', terminolojide kutsal ev, kıble ise namazın yönü olarak adlandırılır. Duanın geçerli olması için Kabe'ye yüz dönmesi gerekir; onu uygulayan onun gözünü görür, biri ise kılmazsa bazı hukukçulara göre yeterlidir. Kabe içindeki namaz Hanafi ve Şafii'lere göre geçerlidir, Maliki ve Hanelilere göre zorunlu namaz geçerli değildir, ancak gönüllü namazlar geçerlidir. Sırt üstü namaz Hanafi ve Şafiilere göre geçerlidir ve Hanbalilerden bir rivayete göre geçerlidir, ancak bilinen görüşe göre Maliki ve Hanelilere göre geçerli değildir. Namaz, bitişik çatılarda ve yüksekliklerde oybirliğiyle geçerlidir. {atıf:) sırtındaki zorunlu namaz, Hanafi ve Şafiilere göre geçerlidir, ancak bilinen görüşe göre Maliki ve Hanelilere göre geçerli değildir. {atıf:) fiqh-mawsua-kuwaitiyya-noor-v3 s.13278} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13279} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13280}"
  id: "Ka'bah disebut 'rumah persegi' dalam istilah linguistik, dan dalam istilah disebut rumah suci, dan qibla adalah arah ke mana seseorang berdoa. Agar doa menjadi sah, harus menghadap Ka'bah; siapa pun yang melayannya akan melihat matanya, dan jika seseorang tidak melaksanakannya, itu sudah cukup menurut beberapa ahli hukum. Doa di dalam Ka'bah sah menurut Hanafi dan Shafi'i, sedangkan menurut Malik dan Hanbali, doa wajib tidak berlaku di sana, tetapi doa sukarela sah. Doa wajib di punggungnya sah menurut Hanah dan Shafi'i, dan dalam narasi dari Hanbali, tetapi tidak menurut Malik dan Hanbal menurut pandangan yang sudah dikenal. Doa berlaku di atap dan elevasi yang berdekatan berdasarkan konsensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13278} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13279} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13280}"
