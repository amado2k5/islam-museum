id: concept/kaaba
class: concept
kind: legal
label:
  ar: "كَعْبة"
  en: "The Kaaba and prayer toward it (kaʿba)"
  ur: "کعبہ اور اس کی طرف نماز (کعبہ)"
summary:
  ar: "الكعبة في اللغة البيت المربع، وفي الاصطلاح البيت الحرام، والقبلة جهة يُصلى نحوها. ويشترط لصحة الصلاة استقبال الكعبة، فمن عاينها أصاب عينها، وغير المعاين يكفيه الاجتهاد عند بعض الفقهاء. وتصح الصلاة داخل الكعبة عند الحنفية والشافعية، وعند المالكية والحنابلة لا تصح الفريضة فيها وتصح النافلة، وتصح الفريضة على ظهرها عند الحنفية والشافعية وفي رواية عن الحنابلة، ولا تصح عند المالكية والحنابلة في المشهور، وتصح الصلاة في الأسطح والمرتفعات المجاورة اتفاقاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13278} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13279} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13280}"
  en: "The Kaaba in the lexicon is the square house; in the law it is the Sacred House, and the qibla is the direction toward which one prays. Facing the Kaaba is a condition of valid prayer. One who sees it must face its very mass; a person who cannot see it may rely on his judgement, as some jurists allow. The Hanafis and Shafi'is allow prayer inside it; the Malikis and Hanbalis forbid the obligatory prayer there and allow voluntary prayer. The Hanafis and Shafi'is allow the obligatory prayer on its roof, and the Hanbalis have a narration to that effect, while the Malikis and the better-known Hanbali view do not. Prayer on the adjoining roofs and on high ground nearby is valid by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13278} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13279} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13280}"
  ur: "کعبہ لغت میں چوکور گھر کو کہتے ہیں، اور اصطلاح میں بیت الحرام؛ قبلہ اس سمت کو کہتے ہیں جس کی طرف نماز پڑھی جائے۔ نماز کی صحت کے لیے کعبہ کی طرف رخ کرنا شرط ہے، جو اسے دیکھ سکتا ہو وہ اس کی ذات کی طرف رخ کرے، اور جو دیکھ نہ سکے تو بعض فقہاء کے نزدیک اجتہاد کافی ہے۔ حنفیہ اور شافعیہ کے نزدیک کعبہ کے اندر نماز جائز ہے؛ مالکیہ اور حنابلہ کے نزدیک فرض نماز وہاں جائز نہیں اور نفل جائز ہے۔ حنفیہ اور شافعیہ کے نزدیک چھت پر فرض نماز درست ہے، حنابلہ سے ایک روایت بھی یہی ہے، جبکہ مالکیہ اور مشہور حنبلی قول میں نہیں۔ قریبی چھتوں اور بلند مقامات پر نماز بالاتفاق درست ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13278} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13279} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13280}"
