label: { ar: "تدبير الشتاء عند ابن سينا", en: "The regimen of winter in the Canon", ur: "موسم سرما کی تدبیر قانون میں" }
summary:
  ar: "في الشتاء يكثر ابن سينا التعب ويبسط الغذاء، فإن كان الشخص جنوبياً زيدت الرياضة وقلل الغذاء، ويشترط أن يكون قمح خبز الشتاء أقوى من قمح خبز الصيف، وتتخذ البقول كالكرنب والسلق والكرفس {cite:canon-ibn-sina-print-v1 pp.258-259}."
  en: "In winter Ibn Sina increases toil and generosity of food; for a southerner exercise is raised and food reduced, winter bread is made of stronger wheat than summer bread, and vegetables such as cabbage, chard and celery are taken {cite:canon-ibn-sina-print-v1 pp.258-259}."
