id: concept/canon-regimen-of-winter
class: concept
kind: scientific
label:
  ar: "تدبير الشتاء عند ابن سينا"
  en: "The regimen of winter in the Canon"
  fr: "Régime d’hiver dans le Canon"
  ur: "موسم سرما کی تدبیر قانون میں"
  es: "El régimen de invierno en el Canon"
  tr: "İbn Sina'ya göre Kış Yönetimi"
  id: "Manajemen Musim Dingin Menurut Ibn Sina"
summary:
  ar: "في الشتاء يكثر ابن سينا التعب ويبسط الغذاء، فإن كان الشخص جنوبياً زيدت الرياضة وقلل الغذاء، ويشترط أن يكون قمح خبز الشتاء أقوى من قمح خبز الصيف، وتتخذ البقول كالكرنب والسلق والكرفس {cite:canon-ibn-sina-print-v1 pp.258-259}."
  en: "In winter Ibn Sina increases toil and generosity of food; for a southerner exercise is raised and food reduced, winter bread is made of stronger wheat than summer bread, and vegetables such as cabbage, chard and celery are taken {cite:canon-ibn-sina-print-v1 pp.258-259}."
  fr: "En hiver, Ibn Sina accroît effort et nourriture ; pour un sujet du Sud, davantage d’exercice et moins d’aliments. Le blé du pain hivernal serait plus fort que celui d’été ; les légumes comprennent chou, blette et céleri {cite:canon-ibn-sina-print-v1 pp.258-259}."
  es: "En invierno, Ibn Sina aumenta el trabajo y la generosidad de la comida; para un sureño se aumenta el ejercicio y se reduce la comida, el pan de invierno se hace con un trigo más fuerte que el pan de verano, y se toman verduras como repollo, acelga y apio {cite:canon-ibn-sina-print-v1 pp.258-259}."
  ur: "سردیوں میں ابن سینا محنت اور خوراک کی سخاوت میں اضافہ کرتا ہے۔ جنوبی ورزش کے لیے بڑھایا جاتا ہے اور کھانا کم کیا جاتا ہے، موسم سرما کی روٹی گرمیوں کی روٹی سے زیادہ مضبوط گندم سے بنتی ہے، اور سبزیاں جیسے گوبھی، چارڈ اور اجوائن لی جاتی ہیں"
  tr: "Kışın İbn Sina daha yorgun olur ve daha az yer. Bir kişi güneyden ise, egzersiz artar ve yiyecek azalır. Kış buğdayının yaz ekmeğinden ve lahana, yengaz ve kereviz gibi baklagillerden daha sağlam olması gerekir {cite:canon-ibn-sina-print-v1 s.258-259}."
  id: "Di musim dingin, Ibn Sina menjadi lebih lelah dan makan lebih sedikit. Jika seseorang berasal dari selatan, olahraga meningkat dan makanan berkurang. Gandum musim dingin diwajibkan lebih kuat daripada roti musim panas, serta legum seperti kubis, parang, dan seledri {cite:canon-ibn-sina-print-v1 hlm.258-259}."
