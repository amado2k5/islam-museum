summary:
  ar: "رجل يخرج أول يوم آذرماه راكباً بغاله بالعراق وأرض فارس لا يعرف ذلك إلا بهما دون الشام والجزيرة ومصر واليمن، يطعم مدة من الأيام الجوز والثوم واللحم السمين وما عداها من الأطعمة الحارة والأشربة المسخنة الدافعة للبرد فيظهر طارداً للبرد فيصب عليه الماء البارد فلا يجد لذلك شيئاً من ألمه ويصيح بالفارسية كرما كرما يعني الحر الحر، وهو وقت عيد الأعاجم يطربون فيه ويظهرون السرور {cite:muruj-al-dhahab p. 507}."
  en: "The mule-rider of Adharmah's first day in Iraq and Fars — gorged for days on walnuts, garlic and fat meats, he is doused with cold water unfazed and cries 'garma garma' (warm, warm) in Persian; a Persian festival joy unknown in Syria, Egypt or Yemen {cite:muruj-al-dhahab p. 507}."
  es: "El arriero del primer día de Adharmah en Irak y Fars, atiborrado durante días de nueces, ajo y carnes grasas, es rociado con agua fría imperturbable y grita 'garma garma' (caliente, caliente) en persa; una alegría festiva persa desconocida en Siria, Egipto o Yemen {cite:muruj-al-dhahab p. 507}."
  fr: "Le muletier d'Adharmah, le premier jour en Irak et à Fars — gavé pendant des jours de noix, d'ail et de viandes grasses, est aspergé d'eau froide sans sourciller et crie « garma garma » (chaud, chaud) en persan; une joie festive persane inconnue en Syrie, en Égypte ou au Yémen {cite:muruj-al-dhahab p. 507}."
  ur: "عراق اور فارس میں ادھارمہ کے پہلے دن کا خچر - اخروٹ، لہسن اور چکنائی والے گوشت پر کئی دنوں تک گھیرا جاتا ہے، اسے ٹھنڈے پانی سے پلایا جاتا ہے اور فارسی میں 'گرما گرما' ⁦(گرم، گرم)⁩ پکارا جاتا ہے۔ شام، مصر یا یمن میں نامعلوم فارسی تہوار کی خوشی 507}۔"
