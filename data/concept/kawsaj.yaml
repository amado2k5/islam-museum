summary:
  ar: "رجل يخرج أول يوم آذرماه راكباً بغاله بالعراق وأرض فارس لا يعرف ذلك إلا بهما دون الشام والجزيرة ومصر واليمن، يطعم مدة من الأيام الجوز والثوم واللحم السمين وما عداها من الأطعمة الحارة والأشربة المسخنة الدافعة للبرد فيظهر طارداً للبرد فيصب عليه الماء البارد فلا يجد لذلك شيئاً من ألمه ويصيح بالفارسية كرما كرما يعني الحر الحر، وهو وقت عيد الأعاجم يطربون فيه ويظهرون السرور {cite:muruj-al-dhahab p. 507}."
  en: "The mule-rider of Adharmah's first day in Iraq and Fars — gorged for days on walnuts, garlic and fat meats, he is doused with cold water unfazed and cries 'garma garma' (warm, warm) in Persian; a Persian festival joy unknown in Syria, Egypt or Yemen {cite:muruj-al-dhahab p. 507}."
