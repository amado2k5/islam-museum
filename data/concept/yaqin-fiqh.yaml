id: concept/yaqin-fiqh
class: concept
kind: legal
label:
  ar: "يَقين"
  en: "Yaqin (certainty, fiqh)"
summary:
  ar: "اليقين في اللغة العلم وإزاحة الشك، وفي الفقه جزم القلب بوقوع الشيء أو عدم وقوعه. وأحكامه: أصول الدين لا تثبت إلا باليقين، والقواعد الفقهية: اليقين لا يزول بالشك، والأصل بقاء ما كان، وبراءة الذمة، والأصل في الأبضاع التحريم، والأصل في الأشياء العدم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18001}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18004}"
  en: "Yaqin is certainty: in lexicon knowledge and the removal of doubt, in fiqh the heart's firm conviction that a thing has or has not happened. Its rulings: the roots of faith require certainty; the legal rules are that certainty is not removed by doubt, that the original state persists, that the original state of a person is freedom from debt, that the original state of women is prohibition, and that the original state of things is non-existence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18001}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18004}"
  ur: "یقین کے لغوی معنی علم اور شک کا ازالہ ہیں، اور فقہ میں دل کا کسی امر کے واقع ہونے یا نہ ہونے پر جزم۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18001}"
