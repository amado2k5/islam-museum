summary:
  ar: "الشونيز في الكتاب حار يابس في الثالثة، حريف مقطع للبلغم جلاء، يحلل الرياح والنفخ وتنقيته بالغة، ويقطع الثاليل المنكوسة والخيلان والبهق والبرص، ويحل الأورام البلغمية والصلبة، وينفع من الزكام والأوجاع المزمنة في الرأس واللقوة ووجع الأسنان، وينفع من انتصاب النفس، ويقتل الديدان وحب القرع، ويحل الحميات البلغمية والسوداوية، ومن دخانه تهرب الهوام، وينفع من لسعة الرتيلاء، ويذكر الكتاب نقلا موسوما أثره في الطمث {cite:canon-ibn-sina-print-v1 pp.677-678}"
  en: "Shuniz is in the book hot and dry in the third degree, pungent, cutting phlegm and cleansing, dissolving winds and flatulence, with a thorough purifying; it cuts away inverted warts, moles, bahaq and baras, dissolves phlegmatic and hard swellings, benefits catarrh, long-standing pains of the head, facial palsy and toothache, benefits orthopnoea, kills worms and the tapeworm, resolves phlegmatic and black-bilious fevers, vermin flee from its smoke, and it benefits the sting of the tarantula; and the book lists, as a labelled report, its effect on the menses {cite:canon-ibn-sina-print-v1 pp.677-678}"
  ur: "شونیز کتاب میں تیسرے درجے میں گرم خشک، تیز، بلغم کو کاٹنے والا اور جلا دینے والا ہے، ہواؤں اور پھولنے کو تحلیل کرتا ہے اور اس کی صفائی بھرپور ہے؛ الٹے مسوں، تلوں، بہق اور برص کو کاٹتا ہے، بلغمی اور سخت ورموں کو تحلیل کرتا ہے، زکام، سر کے پرانے دردوں، لقوے اور دانتوں کے درد میں نافع ہے، دمے کی کیفیت میں نافع ہے، کیڑوں اور کدو دانے کو مارتا ہے، بلغمی اور سودائی بخاروں کو کھولتا ہے، اس کے دھوئیں سے کیڑے مکوڑے بھاگتے ہیں، اور رتیلا کے ڈنک میں نافع ہے؛ اور کتاب منقول فہرست کے طور پر حیض پر اس کا اثر درج کرتی ہے {cite:canon-ibn-sina-print-v1 pp.677-678}۔"
  es: "Shuniz es descrito en el libro como caliente y seco en tercer grado, picante, que corta la flema y limpia, disuelve los vientos y la flatulencia, con una purificación completa; corta las verrugas invertidas, los lunares, el bahaq y el baras, disuelve las hinchazones flemáticas y duras, beneficia el catarro, los dolores de cabeza crónicos, la parálisis facial y el dolor de muelas, beneficia la ortopnea, mata los gusanos y la tenia, resuelve las fiebres flemáticas y de bilis negra, los parásitos huyen de su humo y beneficia la picadura de la tarántula; y el libro enumera, como un informe etiquetado, su efecto sobre la menstruación {cite:canon-ibn-sina-print-v1 pp.677-678}"
