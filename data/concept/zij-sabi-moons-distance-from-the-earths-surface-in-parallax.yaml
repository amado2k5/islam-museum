label: { ar: "بُعد القمر عن ظهر الأرض في حساب المنظر", en: "The Moon's distance from the Earth's surface in the parallax reckoning", ur: "منظر کے حساب میں زمین کی سطح سے چاند کا فاصلہ", es: "La distancia de la Luna a la superficie de la Tierra en el cálculo de paralaje.", fr: "La distance de la Lune par rapport à la surface de la Terre dans le calcul de la parallaxe", tr: "Paralaks hesaplamalarında Ay'ın Dünya yüzeyine olan uzaklığı", id: "Jarak bulan dari permukaan Bumi dalam perhitungan paralaks" }
summary:
  ar: "يبين البتاني أن البُعد الأبعد للقمر عن الأرض ستون جزءاً إذا كان نصف قطر الأرض جزءاً واحداً، وأن البُعد عن ظهر الأرض يتبع ذلك، وأن نصف قطر فلك التدوير في هذا الموضع مقروء بصعوبة في الصورة، فلا يُثبت هنا عدده. {cite:zij-sabi-nallino-byblion p.116}."
  en: "Al-Battani says the Moon's farthest distance from the Earth is sixty parts when the Earth's half-radius is one part; its distance from the Earth's surface follows from this. The epicycle's half-radius at this point is read with difficulty in the scan, so its figure is not recorded here. {cite:zij-sabi-nallino-byblion p.116}."
  ur: "البتانی کہتے ہیں کہ جب زمین کا نصف قطر ایک جزو ہو تو چاند کا زمین سے سب سے دور فاصلہ ساٹھ اجزاء ہے، اور زمین کی سطح سے فاصلہ اسی سے نکلتا ہے؛ فلکِ تدویر کا نصف قطر اس مقام پر اسکین میں مشکل سے پڑھا جاتا ہے، اس لیے اس کا عدد یہاں درج نہیں کیا گیا۔ {cite:zij-sabi-nallino-byblion p.116}۔"
  es: "Al-Battani afirma que la distancia máxima de la Luna a la Tierra es de sesenta partes cuando el semirradio terrestre es de una parte; de esto se deduce su distancia a la superficie terrestre. El semirradio del epiciclo en este punto se lee con dificultad en el escaneo, por lo que su valor no se registra aquí. {cite:zij-sabi-nallino-byblion p.116}."
  fr: "Al-Battani affirme que la distance maximale de la Lune à la Terre est de soixante parties lorsque le demi-rayon terrestre est d'une partie; sa distance à la surface de la Terre en découle. Le demi-rayon de l'épicycle à cet endroit est difficile à lire dans le scan, aussi n'est-il pas indiqué ici. {cite:zij-sabi-nallino-byblion p.116}."
  tr: "Al-Battani, Dünya'nın yarıçapının bir kısım olduğu durumda Ay'ın Dünya'dan en uzak mesafesinin altmış kısım olduğunu ve Dünya yüzeyinden uzaklığın da bundan türediğini belirtir. Ayrıca, bu noktadaki episiklinin yarıçapının görüntüde okunmasının zor olduğunu, bu nedenle burada belirtilmediğini ifade eder. {cite:zij-sabi-nallino-byblion s.116}."
  id: "Al-Battani menunjukkan bahwa jarak terjauh bulan dari bumi adalah enam puluh bagian jika jari-jari bumi adalah satu bagian, dan jarak dari permukaan bumi dapat disimpulkan dari hal ini. Ia juga menyatakan bahwa jari-jari epikikel pada titik ini sulit dibaca pada gambar, sehingga angkanya tidak disebutkan di sini. {cite:zij-sabi-nallino-byblion p.116}."
