label:
  ar: "أرش"
  en: "Arsh (compensation for injury)"
  ur: "ارش (زخم کا تاوان)"
summary:
  ar: "الأرش المال الواجب في الجناية على ما دون النفس، وقد يطلق على الدية. وقد قدّر الشارع في بعض الجراح مقادير معينة كما في كتاب النبي إلى أهل اليمن، وما لم يرد فيه نص ففيه حكومة عدل. وتختلف مقادير أرش المرأة والذمي بين المذاهب، فالحنفية والشافعية والمالكية والحنابلة لهم تقديرات متفاوتة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2185} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2186}"
  en: "Arsh is the property due for a wrong short of killing, and is sometimes used for the full diya. The lawgiver fixed some amounts for particular injuries, as in the letter to the people of Yemen; where no text fixes a sum, hukumat al-'adl applies. The schools differ on the amounts for a woman and for a dhimmi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2185} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2186}"
  ur: "ارش وہ مال ہے جو جان کے سوا کسی جنایت پر واجب ہو، اور کبھی اس سے دیت بھی مراد لی جاتی ہے۔ شارع نے بعض زخموں کی مقدار مقرر کی، جیسے یمن والوں کے نام خط میں؛ جہاں نص نہ ہو وہاں حکومت عدل ہے۔ عورت اور ذمی کے ارش کی مقدار میں مذاہب کا اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2185} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2186}"
