label:
  ar: "مآل الفالج وانتقالاته"
  en: "Outcome and transitions of palsy"
  ur: "فالج کا انجام اور اس کی منتقلی"
  es: "Resultados y transiciones de la parálisis"
summary:
  ar: "الفالج الحادث عن زوال الفقار قابل في الأكثر، والذي عن صدمة لم يدق العصب دقاً شديداً فقد يبرأ، فإن أفرط لم يرج أن يبرأ؛ وقد ينتقل إلى الفالج من السكتة ومن الصرع ومن القولنج ومن الحميات المزمنة على سبيل البحران {cite:canon-ibn-sina-print-v2 p.139}"
  en: "Palsy arising from a displaced vertebra is mostly curable; that from a shock that did not crush the nerve badly may heal, but if excessive it is not expected to heal; palsy may follow on apoplexy, epilepsy, colic and chronic fevers by way of crisis {cite:canon-ibn-sina-print-v2 p.139}"
  ur: "مہرے کے سرکنے سے پیدا ہونے والا فالج اکثر قابل علاج ہے، اور صدمے سے ہونے والا جس نے عصب کو سخت ن چوٹ پہنچائی ہو شفا پا سکتا ہے، لیکن اگر حد سے بڑھ جائے تو اس کی شفا کی امید نہیں؛ اور فالج سکتہ، صرع، قولنج اور دائمی بخاروں سے بحران کی صورت میں منتقل ہو سکتا ہے {cite:canon-ibn-sina-print-v2 p.139}۔"
  es: "La parálisis causada por una vértebra desplazada suele ser curable; la que se produce por un shock que no comprimió gravemente el nervio puede curarse, pero si es excesiva, no se espera que se cure; la parálisis puede aparecer tras una apoplejía, epilepsia, cólicos y fiebres crónicas a modo de crisis {cite:canon-ibn-sina-print-v2 p.139}"
