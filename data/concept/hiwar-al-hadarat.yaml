id: concept/hiwar-al-hadarat
class: concept
kind: social
label:
  ar: "حوار الحضارات — حقيقة أم سراب"
  en: "Dialogue of civilisations — reality or mirage"
  ur: "تہذیبوں کا مکالمہ — حقیقت یا سراب"
issue:
  ar: "هل علاقة المسلمين بالغرب اليوم علاقة صراع أم حوار، ومن يدير الحوار، وما هدفه؟"
  en: "Is the relation between Muslims and the West today one of conflict or of dialogue, who should conduct the dialogue, and to what end?"
  ur: "کیا آج مسلمانوں اور مغرب کا تعلق تصادم کا ہے یا مکالمے کا، مکالمہ کون چلائے، اور اس کا مقصد کیا ہو؟"
summary:
  ar: "حلقة «الوسطية» عن حوار الحضارات. صوّت 80% من جمهور الاستوديو أن العلاقة بين المسلمين والغرب اليوم علاقة صراع غالباً و20% أنها حوار؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep23 00:05:30} و99% أن الغرب يسعى إلى تهميش الحضارة الإسلامية ومهاجمتها؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep23 00:19:30} واختار 49% المؤسسات الدينية لإدارة الحوار و16% النخب الفكرية؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep23 00:40:00} وانقسموا في هدفه بين إثبات التفوق (46%) وتكامل الطرفين (50%). {cite:assabile-tareq-al-suwaidan al-wassitiya/ep23 01:03:00} وختم المقدّم بأن الغرب ليس كتلة واحدة وأن الحوار لازم بلا انهزام. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep23 01:14:00}"
  en: "The 'Al-Wasatiyya' episode on the dialogue of civilisations. Eighty percent of the studio audience voted that the relation between Muslims and the West today is mostly conflict and 20% dialogue; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep23 00:05:30} 99% that the West seeks to marginalise and attack Islamic civilisation; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep23 00:19:30} 49% chose religious institutions to lead the dialogue and 16% intellectual elites; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep23 00:40:00} and they split on its aim between proving superiority (46%) and mutual complementarity (50%). {cite:assabile-tareq-al-suwaidan al-wassitiya/ep23 01:03:00} The presenter closed by saying the West is not one bloc and that dialogue is necessary, without defeatism. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep23 01:14:00}"
  ur: "تہذیبوں کے مکالمے پر «الوسطیہ» کی قسط۔ اسٹوڈیو حاضرین میں سے 80% نے ووٹ دیا کہ آج مسلمانوں اور مغرب کا تعلق زیادہ تر تصادم کا ہے اور 20% نے مکالمے کا؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep23 00:05:30} 99% نے کہا کہ مغرب اسلامی تہذیب کو حاشیے پر دھکیلنے اور اس پر حملے کی کوشش کرتا ہے؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep23 00:19:30} 49% نے مکالمے کی قیادت کے لیے دینی اداروں اور 16% نے فکری اشرافیہ کو چنا؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep23 00:40:00} اور مقصد پر وہ برتری ثابت کرنے (46%) اور باہمی تکمیل (50%) میں بٹ گئے۔ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep23 01:03:00} میزبان نے یہ کہہ کر ختم کیا کہ مغرب ایک اکائی نہیں اور مکالمہ ضروری ہے، شکست خوردگی کے بغیر۔ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep23 01:14:00}"
sensitivity: contested
perspectives:
- tradition: sunni
  id: dialogue-without-defeat
  stance:
    ar: "الحوار أصل في الإسلام، لكن بلا انهزام ولا استسلام"
    en: "Dialogue is rooted in Islam, but without defeatism or surrender"
    ur: "مکالمہ اسلام کی بنیاد میں ہے، مگر شکست خوردگی اور سپر اندازی کے بغیر"
  summary:
    ar: "رأي المقدّم (رأي المتحدث): أصل الدين الدعوة والحوار، والغرب أصناف لا جهة واحدة، ولو خفّف الحوار عداء عدو بنسبة واحد في المئة فهو كسب؛ مع إصلاح الداخل أولاً، وقيادة العلماء الذين يفهمون السياسة والحضارة والغرب للحوار بدعم السياسيين {cite:assabile-tareq-al-suwaidan al-wassitiya/ep23 01:14:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep23 01:14:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep23 01:15:30}."
    en: "The presenter's view (speaker's opinion): the root of the religion is da'wa and dialogue, the West is many kinds of people rather than one party, and if dialogue lessens an enemy's hostility by even one percent it is a gain; reform at home comes first, and the dialogue should be led by scholars who understand politics, civilisation and the West, with politicians' support {cite:assabile-tareq-al-suwaidan al-wassitiya/ep23 01:14:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep23 01:14:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep23 01:15:30}."
