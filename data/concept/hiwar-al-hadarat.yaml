- tradition: other
  id: self-critique-first
  stance:
    ar: "نقد الذات أولاً: نحن الطرف الأضعف ونحتاج الحوار أكثر من الغرب"
    en: "Self-critique first: we are the weaker side and need dialogue more than the West does"
    ur: "پہلے اپنا محاسبہ: ہم کمزور فریق ہیں اور مکالمے کی ضرورت ہمیں مغرب سے زیادہ ہے"
  summary:
    ar: "رأى الصحفي التونسي صلاح الدين الجورشي أن تحميل الغرب وحده مسؤولية فشل الحوار خطأ، وأن غياب الأنظمة الحقيقية والمجتمع المدني والديمقراطية من أسباب ما خسره العرب، وأن الحوار مع الخارج يتطلب حواراً داخلياً وإصلاحاً {cite:assabile-tareq-al-suwaidan al-wassitiya/ep23 00:07:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep23 00:33:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep23 00:34:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep23 01:05:00}."
    en: "The Tunisian journalist Salah al-Din al-Jourshi held that blaming the West alone for the failure of dialogue is a mistake, that the absence of real governments, civil society and democracy is among the causes of what the Arabs lost, and that dialogue abroad requires dialogue and reform at home {cite:assabile-tareq-al-suwaidan al-wassitiya/ep23 00:07:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep23 00:33:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep23 00:34:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep23 01:05:00}."
