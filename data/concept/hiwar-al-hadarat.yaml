- tradition: other
  id: interests-not-marginalisation
  stance:
    ar: "الغرب يسعى إلى مصالحه لا إلى تهميش حضارتنا"
    en: "The West pursues its interests, not the marginalisation of our civilisation"
    ur: "مغرب اپنے مفادات کے پیچھے ہے، ہماری تہذیب کو حاشیے پر دھکیلنے کے نہیں"
  summary:
    ar: "رأى خالد الحروب، المقيم في لندن، وأحمد عزم من مركز الإمارات للدراسات الاستراتيجية أن العلاقة ليست صراعاً: فالغرب يطلب مصالحه، ويجب التفريق بين النخب السياسية والشعوب وبين أوروبا وأمريكا، والتجارة والطلاب والمرضى العرب يتجهون إلى الغرب {cite:assabile-tareq-al-suwaidan al-wassitiya/ep23 00:09:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep23 00:21:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep23 00:21:30}."
    en: "Khaled Hroub, living in London, and Ahmad Azm of the Emirates Center for Strategic Studies held that the relation is not conflict: the West seeks its interests, one must distinguish political elites from peoples and Europe from America, and Arab trade, students and patients all head to the West {cite:assabile-tareq-al-suwaidan al-wassitiya/ep23 00:09:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep23 00:21:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep23 00:21:30}."
