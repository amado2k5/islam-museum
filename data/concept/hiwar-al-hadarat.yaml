- tradition: other
  id: conflict-not-dialogue
  stance:
    ar: "لا حوار أصلاً، بل صراع غير متكافئ جوهره ديني"
    en: "There is no dialogue at all, only an unequal conflict whose core is religious"
    ur: "مکالمہ سرے سے موجود نہیں، صرف ایک غیر متوازن تصادم ہے جس کی جڑ دینی ہے"
  summary:
    ar: "رأى المؤرخ السوري المقيم في لندن محمود السيد الدغيم أن الحوار المعلن تمويه، وأن الصراع غير متكافئ لأن شرط الحوار التكافؤ، واستدل بالهجوم على الحجاب على أن جوهر الصراع ديني، مع قوله إن الإسلام دين الحوار ولا إكراه فيه {cite:assabile-tareq-al-suwaidan al-wassitiya/ep23 00:12:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep23 00:13:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep23 00:48:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep23 00:49:00}."
    en: "The Syrian historian Mahmoud al-Sayyid al-Dughaym, living in London, held that the proclaimed dialogue is a smokescreen and the conflict unequal, since parity is a condition of dialogue; he took the campaigns against the hijab as evidence that the core of the conflict is religious, while saying that Islam is a religion of dialogue with no compulsion in it {cite:assabile-tareq-al-suwaidan al-wassitiya/ep23 00:12:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep23 00:13:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep23 00:48:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep23 00:49:00}."
