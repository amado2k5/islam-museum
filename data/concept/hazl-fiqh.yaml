tags: [juha-browser, juha-kind-ethics]
kind: legal
label: { ar: "هَزْل", en: "Hazl (jest in speech, and its effect on contracts, acts and belief)", es: "Hazl (la broma en el habla y su efecto en los contratos, los actos y las creencias)", fr: "Hazl (la plaisanterie dans le discours et son effet sur les contrats, les actes et les croyances)", ur: "ہزل ⁦(گفتگو میں مذاق، اور معاہدوں، اعمال اور اعتقاد پر اس کا اثر)⁩", tr: "fars", id: "sandiwara" }
summary:
  ar: "الهزل في اللغة ضد الجد، وفي الاصطلاح ألا يُراد باللفظ ودلالته معناه لا الحقيقي ولا المجازي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16525} وهو يختلف عن اللعب والمزاح والخطأ والتلجئة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16525} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16526} والهزل لا ينافي الأهلية ولا اختيار المباشرة، وإنما ينافي اختيار الحكم والرضا به، فيُعتبر السبب ولا يُعتبر الحكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16526} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16527} وفي العقود التي تحتمل النقض، اختلف الحنفية: فقال أبو حنيفة إن الهزل إن اتفق عليه المتعاقدان واختلفا في الإعراض عنه أو البناء عليه يُقدَّم قول مدعي الإعراض، وقال الصاحبان بفساد العقد عند البناء على المواضعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16528} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16529} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16530} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16531} والشافعية في الأصح يصححون بيع الهازل، والحنابلة في المشهور يبطلونه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16532} وفي التصرفات التي لا تحتمل النقض، كالطلاق والعتق والرجعة والنكاح، يرى جمهور الفقهاء أن الهزل والجد فيها سواء، استناداً إلى حديث «ثلاث جدهن جد وهزلهن جد». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16533} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16534} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16535} وخالف المالكية في بعض الصور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16535} وفي النكاح ذهب جمهور الفقهاء إلى صحة نكاح الهازل، وقال المالكية بلزومه، وقال غيرهم بعدم لزومه إن قام دليل الهزل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16536} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16537} وفي الخلع فرّق الحنفية بين آراء أبي حنيفة وصاحبيه، وفي الهبة والوقف والوصية والشفعة والإبراء يمنع الهزل في الغالب صحة التصرف عند الحنفية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16538} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16539} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16540} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16541} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16542} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16543} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16544} وفي الإقرار ذهب الحنفية إلى بطلانه بالهزل، ولا يلزم المالكية شيء في الإقرار الاعتذاري، ويصح عند الشافعية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16544} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16545} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16546} وفي الاعتقاد يكفر المسلم بالهزل بكلمة الكفر عند جمهور الفقهاء، ويصح إسلام الكافر إذا هزل بكلمة الإسلام عند الحنفية والشافعية، ويُلزم به ظاهراً عند ابن القيم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16547} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16548} وفي القذف يُحد الهازل عند الشافعية، ويُعزَّر عند الحنفية إن تعوّد الهزل بالقبيح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16548}"
  en: "Hazl is jest, the opposite of seriousness; technically it is when a word is used without intending its meaning, literal or figurative. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16525} It is distinct from play (la'ib), banter (mizah), error (khata') and forced compliance (talja'). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16525} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16526} Jest does not affect capacity or choice of the act, but it does affect choice of the legal effect, so the act is taken as valid cause while the ruling is not desired. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16526} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16527} For contracts that can be cancelled, the Hanafis disagree: Abu Hanifa gives priority to the party who claims the jest was dropped, while the two companions hold the contract void when both agreed to proceed in jest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16528} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16529} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16530} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16531} The Shafi'is hold a jester's sale valid in the sounder view, and the Hanbalis in the prevailing view void. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16532} For contracts that cannot be cancelled, such as divorce, manumission, return to a wife and vows, most jurists hold that jest and seriousness are equal, relying on the saying 'three things, in jest or earnest, are binding: marriage, divorce and return'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16533} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16534} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16535} The Malikis differ in some cases. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16535} Most jurists hold a jester's marriage valid, while the Malikis hold it binding, and some hold it not binding where proof of jest exists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16536} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16537} On khul' (divorce for compensation), Abu Hanifa and the two companions differ on whether the divorce takes effect and the compensation is due. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16538} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16539} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16540} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16541} The Hanbalis hold a gift or endowment made in jest void, and the Hanafis hold a bequest void for jest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16542} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16543} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16544} Jest in admission: the Hanafis void it; the Shafi'is and Hanbalis hold the admission binding even if made in jest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16544} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16545} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16546} In belief, a Muslim who speaks words of unbelief in jest is held to have apostatised by the majority, and a non-Muslim who professes Islam in jest is held a Muslim in the view of the Hanafis and Shafi'is; Ibn al-Qayyim holds the speaker bound by the words outwardly. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16547} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16548} Slander made in jest is punished by hadd according to the Shafi'is, and by discretionary punishment according to the Hanafis if the speaker habitually jests in that way. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16548}"
  es: "Hazl es broma, lo opuesto a la seriedad; técnicamente es cuando se usa una palabra sin pretender su significado, literal o figurado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16525} Es distinto del juego (la'ib), la broma (mizah), el error (khata') y el cumplimiento forzado (talja'). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16525} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16526} La broma no afecta la capacidad o elección del acto, pero sí afecta la elección del efecto legal, por lo que el acto se toma como causa válida aunque no se desee el dictamen. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16526} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16527} En cuanto a los contratos que pueden cancelarse, los Hanafi discrepan: Abu Hanifa da prioridad a la parte que afirma que la broma se abandonó, mientras que los dos compañeros consideran que el contrato es nulo cuando ambos acordaron proceder en broma. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16528} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16529} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16530} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16531} Los Shafi'is consideran que la venta de un bufón es válida desde el punto de vista más sensato, y los Hanbalis, desde el punto de vista predominante, son nulas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16532} Para los contratos que no se pueden cancelar, como el divorcio, la manumisión, el regreso a la esposa y los votos, la mayoría de los juristas sostienen que la broma y la seriedad son iguales, basándose en el dicho \"tres cosas, en broma o en serio, son vinculantes: el matrimonio, el divorcio y el regreso\". {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16533} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16534} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16535} Los malikíes difieren en algunos casos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16535} La mayoría de los juristas consideran válido el matrimonio de un bufón, mientras que los malikíes lo consideran vinculante, y algunos consideran que no es vinculante cuando existe prueba de que se trata de una broma. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16536} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16537} Sobre el khul' (divorcio por compensación), Abu Hanifa y los dos compañeros difieren en cuanto a si el divorcio tiene efecto y si se debe pagar la compensación. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16538} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16539} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16540} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16541} Los Hanbalis consideran nulo un regalo o donación hecho en broma, y los Hanafis mantienen un legado nulo por broma. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16542} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16543} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16544} Broma al admitir: los hanafis lo anulan; los Shafi'is y Hanbalis consideran vinculante la admisión incluso si se hace en broma. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16544} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16545} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16546} En la creencia, un musulmán que dice palabras de incredulidad en broma es considerado apostatado por la mayoría, y un no musulmán que profesa el Islam en broma es considerado musulmán en el punto de vista de los Hanafis y Shafi'is; Ibn al-Qayyim sostiene que el hablante está obligado por las palabras externamente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16547} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16548} La calumnia hecha en broma es castigada con hadd según los Shafi'is, y con un castigo discrecional según los Hanafis si el hablante habitualmente bromea de esa manera. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16548}"
  fr: "Hazl est une plaisanterie, l'opposé du sérieux; techniquement, il s'agit de l'emploi d'un mot sans en préciser le sens, littéral ou figuré. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16525} Elle se distingue du jeu (la'ib), de la plaisanterie (mizah), de l'erreur (khata') et de la soumission forcée (talja'). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16525} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16526} La plaisanterie n'affecte ni la capacité ni le choix de l'acte, mais elle influe sur le choix de son effet juridique; ainsi, l'acte est considéré comme valable alors que la décision n'est pas souhaitée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16526} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16527} Pour les contrats qui peuvent être annulés, les Hanafites sont en désaccord: Abu Hanifa donne la priorité à la partie qui prétend que la plaisanterie a été abandonnée, tandis que les deux compagnons considèrent le contrat comme nul lorsque les deux ont convenu de procéder en plaisantant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16528} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16529} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16530} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16531} Les Shafi'is organisent une vente de bouffon valable selon le point de vue le plus sain, et les Hanbalis selon le point de vue dominant, nul. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16532} Pour les contrats irrévocables, tels que le divorce, l'affranchissement, le retour auprès de son épouse et les vœux, la plupart des juristes considèrent que la plaisanterie et le sérieux sont équivalents, s'appuyant sur l'adage: « Trois choses, qu'on le dise sérieusement ou non, sont contraignantes: le mariage, le divorce et le retour auprès de son épouse. » {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16533} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16534} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16535} Les Malikites divergent sur certains points. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16535} La plupart des juristes considèrent le mariage d'un bouffon comme valide, tandis que les Malikites le jugent contraignant, et certains le jugent non contraignant lorsqu'il existe une preuve de la plaisanterie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16536} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16537} Concernant le khul' (divorce avec compensation), Abu Hanifa et les deux compagnons divergent quant à la validité du divorce et au droit à la compensation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16538} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16539} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16540} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16541} Les Hanbalis détiennent un don ou une dotation fait pour plaisanter, et les Hanafis détiennent un legs nul pour plaisanter. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16542} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16543} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16544} Plaisanterie en aveu: les Hanafis l'annulent; les Shafi'is et les Hanbalis considèrent que l'admission est contraignante, même si elle est faite en plaisantant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16544} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16545} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16546} Selon la croyance, un musulman qui prononce des paroles d'incroyance en plaisantant est considéré comme apostat par la majorité, et un non-musulman qui professe l'islam en plaisantant est considéré comme musulman par les hanafites et les chaféites; Ibn al-Qayyim considère que celui qui parle est lié extérieurement par les paroles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16547} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16548} La calomnie faite en plaisantant est punie par le hadd selon les Shafi'is, et par une punition discrétionnaire selon les Hanafis si l'orateur plaisante habituellement de cette manière. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16548}"
  ur: "ہزل مذاق ہے، سنجیدگی کے برعکس؛ تکنیکی طور پر یہ تب ہوتا ہے جب کوئی لفظ اس کے معنی، لغوی یا علامتی ارادے کے بغیر استعمال کیا جاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16525} یہ کھیل ⁦(لائب)⁩، مذاق ⁦(میزہ)⁩، خطا ⁦(خطا)⁩ اور جبری تعمیل ⁦(طلجہ)⁩ سے الگ ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16525} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16526} مذاق فعل کی صلاحیت یا انتخاب کو متاثر نہیں کرتا ہے، لیکن یہ قانونی اثر کے انتخاب کو متاثر کرتا ہے، اس لیے فعل کو جائز وجہ کے طور پر لیا جاتا ہے جبکہ مطلوبہ خواہش نہیں ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16526} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16527} جن معاہدوں کو منسوخ کیا جا سکتا ہے، احناف اس سے متفق نہیں ہیں: ابوحنیفہ اس فریق کو ترجیح دیتے ہیں جس نے دونوں معاہدوں کو ختم کرنے کا دعوی کیا تھا، جب کہ دونوں معاہدوں کو منسوخ کر دیا گیا تھا۔ مذاق میں آگے بڑھنے پر اتفاق کیا. {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16528} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16529} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16530} ص 16531} شافعی صوفیانہ قول میں مضحکہ خیز فروخت کو جائز سمجھتے ہیں اور حنبلی مروجہ قول میں باطل ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 16532} جن معاہدوں کو منسوخ نہیں کیا جاسکتا، مثلاً طلاق، منحرف، بیوی کی طرف رجوع اور قسمیں، اکثر فقہاء کا خیال ہے کہ مذاق اور سنجیدگی برابر ہے، اس قول پر انحصار کرتے ہوئے کہ 'تین چیزیں، مذاق میں یا سنجیدگی سے'، طلاق اور رجوع کرنا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16533} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص16534} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16535} بعض صورتوں میں مالکیوں کے نزدیک۔ {حوالہ: فقہ الموسوعہ-کویتیہ-نور-v3 صفحہ 16535} اکثر فقہاء نے مذاق کرنے والے کے نکاح کو جائز قرار دیا ہے، جب کہ مالکیہ اسے پابند قرار دیتے ہیں، اور جہاں مذاق کا ثبوت موجود ہو وہاں کچھ اسے پابند نہیں سمجھتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16536} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16537} خلع پر ابو حنیفہ اور دونوں صحابہ میں اختلاف ہے کہ طلاق واجب ہے یا نہیں؟ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16538} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16539} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16540} ص16541} حنبلی ہدیہ یا وقف مذاق میں باطل رکھتے ہیں اور احناف مذاق کے لیے وصیت کو باطل رکھتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16542} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16543} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16544} حنفیہ کا جواز ہے۔ شافعی اور حنبلی داخلے کو پابند رکھتے ہیں چاہے مذاق میں ہی کیوں نہ بنایا جائے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16544} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16545} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16546} غیر مسلم جو ایمان کے ساتھ بولے، اکثریت کی طرف سے مرتد، اور ایک غیر مسلم جو مذاق میں اسلام کا دعویٰ کرتا ہے، احناف اور شافعیوں کے نزدیک مسلمان ہے۔ ابن قیم نے مخاطب کو ظاہری طور پر الفاظ کا پابند رکھا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16547} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16548} شافعیوں کے نزدیک طعنہ زنی کی سزا حنفیہ کے مطابق ہے اور اگر عادت کے مطابق بات کرے تو صوابدیدی سزا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص16548}"
  tr: "Dilde mizah ciddiyetin tam tersidir ve terminolojide kelime ve anlamı gerçek ya da mecazi anlamda anlam taşımak için kullanılmaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16525} ve oyun, şaka, hata ve başvuru ile farklıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16525} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16526} ve mizah kapasite veya doğrudanlık seçimiyle çelişmez, aksine seçim ve onayla çelişir, bu yüzden karar değil, neden olarak kabul edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16526} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16527} İptal edilebilecek sözleşmeler konusunda ise Hanafi farklı görüş bildirdi: Abu Hanifa, taraflar anlaşmaya varır ve geri çekilme ya da üzerine inşa edilip edilmeme konusunda anlaşmazlık sağlanırsa, davacının talebinin öncelik kazandığını, iki yazar ise sözleşmenin sözleşme üzerine inşa edildiğinde geçersiz olduğunu belirtmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16528} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16529} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16530} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16531} Şafiiler, daha doğru görüşe göre, şakacı olmayan birinin satışını doğrularken, Hanbaliler çoğunluk görüşüne göre satışı geçersiz kılar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16532} Boşanma, özgürleşme, geri dönüş ve evlilik gibi iptal edilemeyen işlemler konusunda, çoğu hukukçu şaka ile ciddiyetin aynı olduğuna inanır; bu hadise dayanarak \"Üçü büyükbabalarıdır, büyükbabaları ciddidir.\" {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.16533} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16534} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16535} ve bazı durumlarda Malikilerden farklıydı. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16535} Evlilik konusunda çoğu hukukçu aptalın evliliğinin geçerliliğini savunurken, Malikiler bunun zorunlu olduğunu, diğerleri ise mizah kanıtı varsa bağlayıcı olmadığını belirtti. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16536} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16537} Khul'da, Hanefi'nin Abu Hanifa ile iki arkadaşının görüşleri arasındaki ayrımı yaparken, hediyeler, bağışlar, vasiyetler, önlem ve feragat konularında şakalar genellikle Hanafi ve Hanbali tarafından yasaktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16538} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16539} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16540} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16541} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16542} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16543} {Kaynak:Fiqh-Mawsua-Kuwaitiyya-Noor-V3 s. 16544} İtirafta Hanafiler alaycı bir şekilde onu geçersiz kılar ve Malikiler özür itirafında hiçbir şey talep etmez; bu itiraf Şafi'ler ve Hanbalilere göre geçerlidir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.16544} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16545} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16546} İnançta, bir Müslüman, çoğu hukukçuya göre 'küfr' kelimesiyle alay ederek inanmaz sayılır ve inançsız kişinin İslamı, Hanafi ve Şafiilere göre 'İslam' kelimesiyle alaya geçerse geçerlidir ve İbn al-Qayyim'e göre bu açıkça zorunludur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16547}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16548} İftirada, iftira Şafiilere göre sınırlıdır ve Hanefilere göre, şaka çirkin bir şekilde tekrarlanırsa 'i'zar'dır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16548}"
  id: "Dalam bahasa, humor adalah kebalikan dari keseriusan, dan dalam terminologi, kata dan maknanya tidak dimaksudkan sebagai makna harfiah atau kiasan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16525} dan berbeda dengan bermain, bercanda, kesalahan, dan menggantikan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16525} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16526} dan humor tidak bertentangan dengan kapasitas atau pilihan langsung, melainkan bertentangan dengan pilihan dan persetujuan terhadap putusan, sehingga dianggap sebagai penyebab dan bukan keputusan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16526} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16527} Dan mengenai kontrak yang dapat dibatalkan, para Hanafi berbeda: Abu Hanifa mengatakan bahwa jika para pihak yang berkontrak sepakat dan mereka berbeda apakah akan menarik atau mengembangkannya, klaim penggugat akan menjadi prioritas, sementara kedua penulis mengatakan kontrak tersebut tidak sah jika dibangun atas kontrak tersebut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16528} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16529} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16530} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16531} Para Shafi'i, dalam pandangan yang lebih benar, memvalidasi penjualan orang yang bukan pelawak, sementara Hanbalis dalam pendapat mayoritas membatalkannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16532} Dan mengenai transaksi yang tidak dapat dibatalkan, seperti perceraian, pembebasan, pengembalian, dan pernikahan, mayoritas ahli hukum percaya bahwa lelucon dan keseriusan adalah sama, berdasarkan hadits \"Tiga adalah kakek mereka dan kakek mereka serius.\" {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16533} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16534} {cite:fiqh-mawsua-Kuwaitiyya-noor-v3 hlm. 16535} dan berbeda dari Malikis dalam beberapa kasus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16535} Mengenai pernikahan, mayoritas ahli hukum menganggap pernikahan orang bodoh itu sah, sementara Malik mengatakan itu wajib, sementara yang lain mengatakan tidak mengikat jika ada bukti humor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16536} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16537} Dalam khul', Hanafi membedakan pendapat Abu Hanifa dan kedua rekannya, tetapi dalam hadiah, wakaf, wasiat, preemption, dan pelepasan, lelucon umumnya dilarang oleh Hanafi dan Hanbali. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16538} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16539} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16540} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16541} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16542} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16543} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm. 16544} Dalam pengakuan dosa, para Hanafi secara mengejek membatalkannya, dan Malik tidak mensyaratkan apa pun dalam pengakuan permintaan maaf, dan pengakuan itu sah menurut Shafi'i dan Hanbali. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16544} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16545} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16546} Dalam kepercayaan, seorang Muslim dianggap kafir dengan mengejek kata 'kufr' menurut mayoritas ahli hukum, dan Islam orang kafir berlaku jika ia mengejek kata 'Islam' menurut Hafi dan syafi'i, dan secara eksplisit wajib menurut Ibn al-Qayyim. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16547} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16548} Dalam fitnah, fitnah dibatasi menurut syafi'i, dan menurut Hanafi, 'i'zar jika lelucon diulang dengan cara yang buruk. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16548}"
