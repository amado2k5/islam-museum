id: concept/hazl-fiqh
class: concept
kind: legal
label: { ar: "هَزْل", en: "Hazl (jest in speech, and its effect on contracts, acts and belief)" }
summary:
  ar: "الهزل في اللغة ضد الجد، وفي الاصطلاح ألا يُراد باللفظ ودلالته معناه لا الحقيقي ولا المجازي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16525} وهو يختلف عن اللعب والمزاح والخطأ والتلجئة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16525} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16526} والهزل لا ينافي الأهلية ولا اختيار المباشرة، وإنما ينافي اختيار الحكم والرضا به، فيُعتبر السبب ولا يُعتبر الحكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16526} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16527} وفي العقود التي تحتمل النقض، اختلف الحنفية: فقال أبو حنيفة إن الهزل إن اتفق عليه المتعاقدان واختلفا في الإعراض عنه أو البناء عليه يُقدَّم قول مدعي الإعراض، وقال الصاحبان بفساد العقد عند البناء على المواضعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16528} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16529} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16530} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16531} والشافعية في الأصح يصححون بيع الهازل، والحنابلة في المشهور يبطلونه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16532} وفي التصرفات التي لا تحتمل النقض، كالطلاق والعتق والرجعة والنكاح، يرى جمهور الفقهاء أن الهزل والجد فيها سواء، استناداً إلى حديث «ثلاث جدهن جد وهزلهن جد». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16533} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16534} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16535} وخالف المالكية في بعض الصور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16535} وفي النكاح ذهب جمهور الفقهاء إلى صحة نكاح الهازل، وقال المالكية بلزومه، وقال غيرهم بعدم لزومه إن قام دليل الهزل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16536} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16537} وفي الخلع فرّق الحنفية بين آراء أبي حنيفة وصاحبيه، وفي الهبة والوقف والوصية والشفعة والإبراء يمنع الهزل في الغالب صحة التصرف عند الحنفية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16538} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16539} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16540} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16541} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16542} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16543} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16544} وفي الإقرار ذهب الحنفية إلى بطلانه بالهزل، ولا يلزم المالكية شيء في الإقرار الاعتذاري، ويصح عند الشافعية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16544} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16545} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16546} وفي الاعتقاد يكفر المسلم بالهزل بكلمة الكفر عند جمهور الفقهاء، ويصح إسلام الكافر إذا هزل بكلمة الإسلام عند الحنفية والشافعية، ويُلزم به ظاهراً عند ابن القيم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16547} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16548} وفي القذف يُحد الهازل عند الشافعية، ويُعزَّر عند الحنفية إن تعوّد الهزل بالقبيح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16548}"
  en: "Hazl is jest, the opposite of seriousness; technically it is when a word is used without intending its meaning, literal or figurative. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16525} It is distinct from play (la'ib), banter (mizah), error (khata') and forced compliance (talja'). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16525} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16526} Jest does not affect capacity or choice of the act, but it does affect choice of the legal effect, so the act is taken as valid cause while the ruling is not desired. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16526} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16527} For contracts that can be cancelled, the Hanafis disagree: Abu Hanifa gives priority to the party who claims the jest was dropped, while the two companions hold the contract void when both agreed to proceed in jest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16528} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16529} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16530} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16531} The Shafi'is hold a jester's sale valid in the sounder view, and the Hanbalis in the prevailing view void. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16532} For contracts that cannot be cancelled, such as divorce, manumission, return to a wife and vows, most jurists hold that jest and seriousness are equal, relying on the saying 'three things, in jest or earnest, are binding: marriage, divorce and return'. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16533} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16534} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16535} The Malikis differ in some cases. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16535} Most jurists hold a jester's marriage valid, while the Malikis hold it binding, and some hold it not binding where proof of jest exists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16536} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16537} On khul' (divorce for compensation), Abu Hanifa and the two companions differ on whether the divorce takes effect and the compensation is due. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16538} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16539} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16540} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16541} The Hanbalis hold a gift or endowment made in jest void, and the Hanafis hold a bequest void for jest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16542} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16543} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16544} Jest in admission: the Hanafis void it; the Shafi'is and Hanbalis hold the admission binding even if made in jest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16544} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16545} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16546} In belief, a Muslim who speaks words of unbelief in jest is held to have apostatised by the majority, and a non-Muslim who professes Islam in jest is held a Muslim in the view of the Hanafis and Shafi'is; Ibn al-Qayyim holds the speaker bound by the words outwardly. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16547} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16548} Slander made in jest is punished by hadd according to the Shafi'is, and by discretionary punishment according to the Hanafis if the speaker habitually jests in that way. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16548}"
