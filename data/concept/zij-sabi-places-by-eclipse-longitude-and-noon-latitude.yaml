label: { ar: "أطوال البلدان بالكسوفات وعروضها بقياس الشمس في الزيج الصابي", en: "Longitudes from eclipses and latitudes from the noon Sun", ur: "چاند گرہن سے طول اور دوپہر کے سورج سے عرض", es: "Longitudes a partir de eclipses y latitudes a partir del Sol del mediodía" }
summary:
  ar: "يقول البتاني إن أطوال البلدان وعروضها على ما رُسم في كتاب صورة الأرض المعروف: بدأوا الأطوال من الجزائر العامرة في بحر أوقيانس الغربي نحو المشرق، على حسب أوقات كسوفات القمر خاصة تتقدم بعضها بعضاً في البلدان، وعروضها من قياس الشمس وقت انتصاف النهار. ويذكر أن الكتاب يحصي أربعة وتسعين بلداً وأن فيه خللاً في الأطوال والعروض سيعيد ما يلزم منه. {cite:zij-sabi-nallino-byblion p.32}."
  en: "Al-Battani says the longitudes and latitudes of cities are as set down in the well-known Book of the Form of the Earth: they began the longitudes at the Inhabited Islands in the western ocean and went east, by the times of lunar eclipses especially, one coming earlier than another in different cities, and took the latitudes from the Sun's measure at noon. He notes that the book lists ninety-four cities and has faults in longitudes and latitudes, and says he will restate what is needed. {cite:zij-sabi-nallino-byblion p.32}."
  ur: "البتانی کہتے ہیں کہ شہروں کے طول اور عرض اسی طرح ہیں جیسے مشہور کتاب صورة الارض میں درج ہیں: انہوں نے طول جزائر عامرہ سے جو بحر اوقیانس مغربی میں ہیں مشرق کی طرف شروع کیے، خاص طور پر چاند گرہنوں کے اوقات سے جو مختلف شہروں میں ایک دوسرے سے پہلے ہوتے ہیں، اور عرض دوپہر کے وقت سورج کی پیمائش سے لیے۔ وہ بتاتے ہیں کہ کتاب میں چورانوے شہر شمار ہیں اور اس میں طول و عرض میں خلل ہے جس میں سے ضروری حصہ وہ دوبارہ بیان کریں گے۔ {cite:zij-sabi-nallino-byblion p.32}۔"
  es: "Al-Battani afirma que las longitudes y latitudes de las ciudades son las que figuran en el conocido Libro de la Forma de la Tierra: comenzaron a trazar las longitudes en las Islas Habitadas del océano occidental y avanzaron hacia el este, teniendo en cuenta especialmente los eclipses lunares, que se producían antes que otros en distintas ciudades, y tomaron las latitudes a partir de la medición del Sol al mediodía. Señala que el libro enumera noventa y cuatro ciudades y presenta errores en las longitudes y latitudes, y afirma que corregirá lo que sea necesario. {cite:zij-sabi-nallino-byblion p.32}."
