id: concept/mal-al-aala
class: concept
kind: angel
label:
  ar: الملأ الأعلى
  en: The Higher Assembly
  ur: اعلیٰ مجلس
summary:
  ar: أهل مجلس الملائكة الأعلى، يذكرهم القرآن في قصة ما جرى بينهم في أمر خلق آدم وفي حوارهم مع إبليس؛ وقد فسّرهم المفسرون بالملائكة المقربين.
  en: The inhabitants of the angels' highest council, whom the Qur'an mentions in the account of their deliberation over creating Adam and their
    dialogue with Iblis; commentators interpret them as the nearest angels.
  ur: اعلیٰ فرشتے داروں کی مجلس کے باشندے جن کا قرآن نے آدم کی خلقت کے بارے میں ان کی گفتگو اور إبلیس سے مکالمے میں ذکر کیا؛ مفسرین انہیں مقرب
    فرشتوں سے تعبیر کرتے ہیں۔
