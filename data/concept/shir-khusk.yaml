summary:
  ar: "شير خشك في الكتاب طل يقع على شجر الخلاف والكثيراء بهراة، وفي الحاشية أنه شجر البهرامج وهو الخلاف، جال، إلى الاعتدال، وهو قريب من الترنجبين في إسهاله وأفعاله بل أقوى منه {cite:canon-ibn-sina-print-v1 p.677}"
  en: "Shir khusk is in the book a dew that falls on the khilaf tree and on tragacanth at Herat, and the editor's note says it is the tree of the bahramaj, which is the khilaf; it is cleansing, tending to moderation, and close to tarunjabin in its loosening and its actions, indeed stronger than it {cite:canon-ibn-sina-print-v1 p.677}"
  ur: "شیر خشک کتاب میں ایک اوس ہے جو ہرات میں خلاف کے درخت اور کتیرا پر پڑتی ہے، اور حاشیے میں ہے کہ یہ بہرامج کا درخت ہے جو خلاف ہے؛ جلا دینے والا، اعتدال کی طرف مائل، اور دست لانے اور اپنے افعال میں ترنجبین کے قریب بلکہ اس سے قوی ہے {cite:canon-ibn-sina-print-v1 p.677}۔"
  es: "Shir khusk es en el libro un rocío que cae sobre el árbol del califa y sobre la tragacanto en Herat, y la nota del editor dice que es el árbol del bahramaj, que es el califa; es purificador, tiende a la moderación y cercano a tarunjabin en su relajación y sus acciones, de hecho más fuerte que él {cite:canon-ibn-sina-print-v1 p.677}"
  fr: "Dans le livre, le shir khusk désigne une rosée qui tombe sur le khilaf et sur la gomme adragante à Hérat. La note de l'éditeur précise qu'il s'agit de l'arbre du bahramaj, qui est le khilaf; il est purificateur, favorise la modération et, par son action apaisante et ses propriétés, est proche du tarunjabin, voire plus puissant encore. {cite:canon-ibn-sina-print-v1 p.677}"
  tr: "Kitapta kuru bir aslan, anlaşmazlık ağacına düşen bir dikendir ve Hara'da birçok kişi, dipnotta ise Bahramaj ağacıdır, anlaşmazlık ise ılımlılığa geçti ve ishal ve eylemlerinde iki tarangibine yakın, hatta ondan daha güçlüydü {cite:canon-ibn-sina-print-v1 s.677}"
  id: "Singa kering dalam buku adalah duri yang jatuh di pohon perselisihan dan banyak di Hara, dan dalam catatan kaki adalah pohon bahramaj, yang merupakan perselisihan, ia bergerak ke moderasi dan mendekati dua tarangibin, bahkan lebih kuat darinya {cite:canon-ibn-sina-print-v1 hlm.677}"
