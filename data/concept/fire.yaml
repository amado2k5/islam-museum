summary:
  ar: "أفرأيتم النار التي تورون أأنتم أنشأتم شجرتها أم نحن المنشئون، نحن جعلناها تذكرة ومتاعاً للمقوين، والذي جعل لكم من الشجر الأخضر ناراً فإذا أنتم منه توقدون، ونار موسى في الشجرة المقدسة."
  en: "Have you seen the fire you kindle — did you make its tree, or did We? We made it a reminder and a provision for desert travellers; and He who gives you fire from the green tree, when you kindle from it; and the fire of Moses in the holy tree."
  ur: "وہ آگ دیکھو جو تم سلگاتے ہو — اس کا درخت تم نے بنایا یا ہم نے؟ ہم نے اسے یاد اور مسافروں کا سامان بنایا؛ اور وہ جس نے تمہارے لیے ہرے درخت سے آگ دی جس سے تم سلگاتے ہو؛ اور موسیٰ کی مقدس درخت میں آگ۔"
