label:
  ar: "الرقابة على المصارف"
  en: "Supervision of banks"
  es: "Supervisión de los bancos"
  fr: "Supervision des banques"
  ur: "بینکوں کی نگرانی"
  tr: "Bankacılık Denetimi"
  id: "Pengawasan Perbankan"
summary:
  ar: "تقوم البنوك المركزية بالرقابة على المصارف بالسياسات النقدية والمصرفية، وتحديد نسب الاحتياطي والسيولة ومعدلات الفائدة والضمانات {cite:usul-iqtisad-islami-0660 p. 356}. ويعد المؤلف تراخي الرقابة والفساد الإداري من أسباب الأزمة، ويقترح رقابة داخلية وخارجية، لأن إفلاس بنك قد يجر بنوكاً أخرى {cite:usul-iqtisad-islami-0660 p. 357}."
  tr: "Merkez bankaları, bankaları para ve bankacılık politikalarıyla denetler; rezerv oranlarını, likiditeyi, faiz oranlarını ve garantileri belirler {cite:usul-iqtisad-islami-0660 s. 356}. Yazar, gevşek denetim ve idari yolsuzluğu krizin nedenleri olarak değerlendirir ve bir bankanın iflasının diğer bankaları da sürükleyebileceği için iç ve dış denetim önerir. {cite:usul-iqtisad-islami-0660 s. 357}."
  id: "Bank sentral mengawasi bank melalui kebijakan moneter dan perbankan, menentukan rasio cadangan, likuiditas, suku bunga, dan jaminan {cite:usul-iqtisad-islami-0660 hlm. 356}. Penulis menganggap pengawasan yang longgar dan korupsi administratif sebagai penyebab krisis dan menyarankan pengawasan internal dan eksternal, karena kebangkrutan sebuah bank dapat menarik bank lain {cite:usul-iqtisad-islami-0660 hlm. 357}."
