label:
  ar: الاستخلاف في المال
  en: Trusteeship of wealth (istikhlaf)
summary:
  ar: 'المال مال الله، والناس مستخلفون فيه، وهذا الاستخلاف يشمل الفرد والجماعة والملكية العامة وملكية الدولة، ولا يقتصر على الملكية الخاصة {cite:usul-iqtisad-islami-0660 p. 70}. ويذكر المؤلف أن الاستخلاف يحمل معنيين: الخلافة عن الله، والخلافة عن من كان قبلنا، وأن المال بين أيدي الناس عارية أو وديعة تستردّ، وأن التصرف فيه نيابة مقيدة بالأوامر الإلهية {cite:usul-iqtisad-islami-0660 p. 71}. والمستخلفون مسؤولون عن المال من أين اكتسبوه وفيم أنفقوه، وفي الحديث أن العبد لا تزول قدماه حتى يُسأل عن ماله {cite:usul-iqtisad-islami-0660 p. 71}. ويرى المؤلف أن ملك البشر ملك ابتلاء، وهو ملك رقبة ومنفعة بين الناس، وملك منفعة فقط بالنسبة لله {cite:usul-iqtisad-islami-0660 p. 71}.'
