id: concept/istikhlaf-wealth
class: concept
kind: ethical
label:
  ar: الاستخلاف في المال
  en: Trusteeship of wealth (istikhlaf)
  es: "Administración fiduciaria de la riqueza (istikhlaf)"
  fr: "Fiducie de patrimoine (istikhlaf)"
  ur: "مال کی امانت داری ⁦(استخلف)⁩"
  tr: "Parayla Ikame"
  id: "Substitusi dalam Uang"
summary:
  ar: 'المال مال الله، والناس مستخلفون فيه، وهذا الاستخلاف يشمل الفرد والجماعة والملكية العامة وملكية الدولة، ولا يقتصر على الملكية الخاصة {cite:usul-iqtisad-islami-0660 p. 70}. ويذكر المؤلف أن الاستخلاف يحمل معنيين: الخلافة عن الله، والخلافة عن من كان قبلنا، وأن المال بين أيدي الناس عارية أو وديعة تستردّ، وأن التصرف فيه نيابة مقيدة بالأوامر الإلهية {cite:usul-iqtisad-islami-0660 p. 71}. والمستخلفون مسؤولون عن المال من أين اكتسبوه وفيم أنفقوه، وفي الحديث أن العبد لا تزول قدماه حتى يُسأل عن ماله {cite:usul-iqtisad-islami-0660 p. 71}. ويرى المؤلف أن ملك البشر ملك ابتلاء، وهو ملك رقبة ومنفعة بين الناس، وملك منفعة فقط بالنسبة لله {cite:usul-iqtisad-islami-0660 p. 71}.'
  tr: "Para Allah'ın malıdır ve insanlar onun yöneticisidir. Bu yöneticilik bireyi, grubu, kamu malını ve devlet mülkiyetini kapsar ve özel mülkiyetle sınırlı değildir {cite:usul-iqtisad-islami-0660 s. 70}. Yazar, yöneticiliğin iki anlamı olduğunu belirtir: Allah'tan halifelik, bizden öncekilerden gelen halifelik; servetin insanların elinde bir borç veya mevduat olarak geri alındığını ve bunun elinden alınmasının ilahi emirlerle sınırlandığını belirtir {cite:usul-iqtisad-islami-0660, s. 71}. Vekiller, servetin nereden edinildiğinden, nasıl harcadığından sorumludur ve hadislerde bir hizmetlinin ayaklarının serveti hakkında sorulana kadar hareket etmediği belirtilir {cite:usul-iqtisad-islami-0660, s. 71}. Yazar, insan krallığının bir sınav krallığı, insanlar arasında kölelik ve fayda krallığı ve yalnızca Tanrı'ya fayda veren bir krallık olduğuna inanır {cite:usul-iqtisad-islami-0660 s. 71}."
  id: "Uang adalah milik Tuhan, dan manusia adalah pengurus di dalamnya. Pengelolaan ini mencakup individu, kelompok, properti publik, dan kepemilikan negara, dan tidak terbatas pada kepemilikan pribadi {cite:usul-iqtisad-islami-0660 hlm. 70}. Penulis menyebutkan bahwa pengelolaan memiliki dua makna: kekhalifahan dari Tuhan, dan kekhalifahan dari mereka sebelum kita, dan bahwa kekayaan berada di tangan orang sebagai pinjaman atau deposit yang dipulihkan, dan bahwa pengelolaan harta dibatasi oleh perintah ilahi {cite:usul-iqtisad-islami-0660, hlm. 71}. Para wakil bertanggung jawab atas kekayaan, di mana mereka mendapatkannya, bagaimana mereka menggunakannya, dan dalam hadits disebutkan bahwa kaki seorang pelayan tidak bergerak sampai ia ditanya tentang kekayaannya {cite:usul-iqtisad-islami-0660, hlm. 71}. Penulis percaya bahwa kerajaan manusia adalah kerajaan ujian, kerajaan perbudakan dan manfaat di antara manusia, dan kerajaan yang hanya bermanfaat bagi Tuhan {cite:usul-iqtisad-islami-0660 hlm. 71}."
