id: concept/ilaj-al-khanan
class: concept
kind: scientific
label:
  ar: علاج الخنان
  en: The treatment of the khanan (the foul-running nose)
  ur: خنان کا علاج
  es: "El tratamiento del khanan (la nariz que gotea fétidamente)"
  fr: "Le traitement du khanan (le nez qui coule mal)"
summary:
  ar: من معالجة الخنان أن يسعط ويغرغر بدواء من جنس ما يعرف نسخته ما عرف ويستعمل سعوطاً وغيره أياماً، ومما يعالج به أن يجعل في الأنف تنكار بشمع ودهن من جنس ما يعرف لا يزال يستعمل حتى يبرأ ⁦(النسخ والأسماء تحمل جنسها)⁩ {cite:canon-ibn-sina-print-v2 p.248}
  en: 'Among the treatments of the khanan: to snuff and gargle with a drug of the known kind, used as snuff and otherwise for days; and among its treatments is to place in the nose a dressing with wax and an oil of the known kind, used continually till it heals ⁦(the recipes and names are carried only by kind)⁩ {cite:canon-ibn-sina-print-v2 p.248}'
  ur: خنان کے علاج میں یہ ہے کہ معروف جنس کی دوا سے سعوط اور غرارہ کیا جائے اور وہ کئی دن سعوط اور دیگر صورتوں میں استعمال ہو؛ اور اس کے علاج میں یہ بھی ہے کہ ناک میں موم اور معروف جنس کے تیل کا تنکار رکھا جائے جو شفا تک استعمال رہے ⁦(نسخے اور نام صرف جنس کے اعتبار سے)⁩ {cite:canon-ibn-sina-print-v2 p.248}
  es: "Entre los tratamientos del khanan: inhalar y hacer gárgaras con un fármaco conocido, usado como rapé y de otras maneras durante días; y entre sus tratamientos está colocar en la nariz un apósito con cera y un aceite conocido, usado continuamente hasta que sane (las recetas y los nombres se llevan solo por tipo) {cite:canon-ibn-sina-print-v2 p.248}"
  fr: "Parmi les traitements du khanan: prendre du tabac et se gargariser avec une drogue connue, utilisée comme tabac à priser et autrement pendant plusieurs jours; et parmi ses traitements, appliquer dans le nez un pansement à base de cire et d’huile connue, à utiliser continuellement jusqu’à guérison (les recettes et les noms ne sont transmis que par type) {cite:canon-ibn-sina-print-v2 p.248}"
