summary:
  ar: "الزرنيخ جوهر معدني أخضر وأصفر وأحمر، حار في الثالثة يابس في الثانية، معفّن لذّاع؛ يحلق الشعر، ويوضع بالشحم على الجراحات، ومصعّده قاتل. {cite:canon-ibn-sina-print-v1 p.460}"
  en: "Zarnikh is a metallic substance, green, yellow or red. Hot in the third degree and dry in the second, it rots and stings; it depilates, is placed with fat on wounds, and its sublimate is deadly. {cite:canon-ibn-sina-print-v1 p.460}"
  ur: "زرنیخ ایک معدنی مادہ ہے جو سبز، زرد یا سرخ ہوتا ہے۔ تیسرے درجے میں گرم اور دوسرے میں خشک؛ گلاتا اور جلن پیدا کرتا ہے۔ یہ بال اتارتا ہے، چربی کے ساتھ زخموں پر رکھا جاتا ہے، اور اس کا مصعّد قاتل ہے۔ {cite:canon-ibn-sina-print-v1 p.460}"
