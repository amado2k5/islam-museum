label:
  ar: "التصرف"
  en: "Tasarruf (a legal disposition: act or statement by one's will)"
  ur: "تصرف ⁦(شرعی تصرف: ارادے سے صادر ہونے والا فعل یا قول)⁩"
  es: "Tasarruf (una disposición legal: acto o declaración por voluntad propia)"
  fr: "Tasarruf (une disposition légale: acte ou déclaration par volonté)"
  tr: "Davranış"
  id: "Perilaku"
summary:
  ar: "التصرف ما يصدر عن الشخص بإرادته ويرتب الشرع عليه أحكاماً مختلفة، وهو أعم من الالتزام والعقد. وينقسم إلى فعلي كالغصب والقبض، وقولي؛ والقولي إما عقدي يتم باتفاق إرادتين كالبيع والإجارة والنكاح، وإما غير عقدي، منه ما فيه إرادة إنشائية كالوقف والطلاق، ومنه المحض كالدعوى والإقرار. ويندرج فيه العبادات والمعاوضات والتبرعات والتقييدات والالتزامات والإسقاطات والولايات والإثباتات والاعتداءات، وشروط صحته تُذكر في مواضعها الخاصة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5235} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5236} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5237}"
  en: "A tasarruf is what proceeds from a person by his will and on which the law builds various rulings. It is wider than an obligation or a contract. It is either an act, such as seizure or receiving, or a statement; a statement is either a contract, which needs the will of two parties, such as sale, hire or marriage, or a non-contractual statement: some carry a creating will, such as an endowment or a divorce, and some are pure, such as a claim or an acknowledgement. Worship, exchanges, gifts, restrictions, obligations, waivers, authorities, proofs and wrongs all fall under it; the conditions of its validity are given in the entries for each kind. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5235} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5236} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5237}"
  es: "Un tasarruf es aquello que procede de la voluntad de una persona y sobre lo cual la ley fundamenta diversas normas. Es más amplio que una obligación o un contrato. Puede ser un acto, como la incautación o la recepción, o una declaración; una declaración puede ser un contrato, que requiere la voluntad de dos partes, como la venta, el alquiler o el matrimonio, o una declaración no contractual: algunas conllevan una voluntad creativa, como una donación o un divorcio, y otras son puras, como una reclamación o un reconocimiento. El culto, los intercambios, las donaciones, las restricciones, las obligaciones, las renuncias, las autorizaciones, las pruebas y los agravios se incluyen dentro de este concepto; las condiciones de su validez se especifican en las entradas correspondientes a cada tipo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5235} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5236} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5237}"
  fr: "Un tasarruf est ce qui émane d'une personne par sa volonté et sur lequel la loi fonde diverses décisions. Son champ d'application est plus large que celui d'une obligation ou d'un contrat. Il peut s'agir soit d'un acte, tel qu'une saisie ou une réception, soit d'une déclaration. Une déclaration peut être un contrat, qui requiert la volonté des deux parties, comme une vente, une location ou un mariage, ou une déclaration non contractuelle: certaines emportent testament, comme une donation ou un divorce, et d'autres sont pures, comme une créance ou une reconnaissance. Le culte, les échanges, les dons, les restrictions, les obligations, les renonciations, les pouvoirs, les preuves et les torts relèvent tous de cette catégorie; les conditions de sa validité sont précisées dans les entrées relatives à chaque type."
  ur: "تصرف وہ ہے جو کسی شخص سے اس کی مرضی سے حاصل ہوتا ہے اور جس پر قانون مختلف احکام مرتب کرتا ہے۔ یہ ایک ذمہ داری یا معاہدے سے زیادہ وسیع ہے۔ یہ یا تو ایک عمل ہے، جیسے ضبط کرنا یا وصول کرنا، یا بیان؛ بیان یا تو ایک معاہدہ ہوتا ہے، جس میں دو فریقین کی مرضی کی ضرورت ہوتی ہے، جیسے کہ فروخت، کرایہ یا شادی، یا ایک غیر معاہدہ شدہ بیان: کچھ میں تخلیقی وصیت ہوتی ہے، جیسے وقف یا طلاق، اور کچھ خالص ہوتے ہیں، جیسے دعویٰ یا اقرار۔ عبادات، تبادلے، تحفے، پابندیاں، واجبات، چھوٹ، حکام، ثبوت اور غلطیاں سب اس کے تحت آتے ہیں۔ اس کی درستگی کی شرائط ہر قسم کے اندراجات میں دی گئی ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5235} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5236}"
  tr: "Eylem, bir kişinin kendi iradesiyle yaptığı şeydir ve İslam hukuku buna çeşitli hükümler dayatır ve taahhüt ve sözleşmeden daha geniştir. Gasp, sahiplenme ve sözlü eylemler gibi sözlü eylemlere ayrılır; sözlü eylem ya sözleşmeye bağlıdır ve satış, kiralama ve evlilik gibi karşılıklı vasiyetlerle gerçekleşir ya da sözleşmesizdir. Bazıları askıya alma ve boşanma gibi yapıcı vasiyetnameleri içerirken, bazıları tamamen dava ve onay gibi bir vasiyetnamedir. İbadet, takas, bağışlar, kısıtlamalar, yükümlülükler, feragatnameler, vasilikler, delil ve ihlalleri içerir ve geçerlilik koşulları bu bağlamlarda belirtilir. {cite:cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5235} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5236} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5237}"
  id: "Bertindak adalah apa yang dilakukan oleh seseorang atas kehendak sendiri, dan hukum Islam memberlakukan berbagai keputusan, dan lebih luas dari sekadar komitmen dan kontrak. Tindakan ini dibagi menjadi tindakan verbal seperti perebutan kekuasaan, kepemilikan, dan tindakan verbal; verbal bersifat kontraktual dan terjadi melalui wasiat bersama seperti penjualan, sewa, dan pernikahan, atau non-kontraktual. Beberapa melibatkan wasiat konstruktif seperti penangguhan dan perceraian, dan beberapa murni seperti gugatan hukum dan pengakuan. Ini mencakup tindakan ibadah, pertukaran, donasi, pembatasan, kewajiban, kewajiban, pengabaian, perwalian, bukti, dan pelanggaran, dan syarat keabsahannya disebutkan dalam konteks spesifiknya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5235} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5236} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5237}"
