label:
  ar: "التصرف"
  en: "Tasarruf (a legal disposition: act or statement by one's will)"
  ur: "تصرف (شرعی تصرف: ارادے سے صادر ہونے والا فعل یا قول)"
summary:
  ar: "التصرف ما يصدر عن الشخص بإرادته ويرتب الشرع عليه أحكاماً مختلفة، وهو أعم من الالتزام والعقد. وينقسم إلى فعلي كالغصب والقبض، وقولي؛ والقولي إما عقدي يتم باتفاق إرادتين كالبيع والإجارة والنكاح، وإما غير عقدي، منه ما فيه إرادة إنشائية كالوقف والطلاق، ومنه المحض كالدعوى والإقرار. ويندرج فيه العبادات والمعاوضات والتبرعات والتقييدات والالتزامات والإسقاطات والولايات والإثباتات والاعتداءات، وشروط صحته تُذكر في مواضعها الخاصة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5235} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5236} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5237}"
  en: "A tasarruf is what proceeds from a person by his will and on which the law builds various rulings. It is wider than an obligation or a contract. It is either an act, such as seizure or receiving, or a statement; a statement is either a contract, which needs the will of two parties, such as sale, hire or marriage, or a non-contractual statement: some carry a creating will, such as an endowment or a divorce, and some are pure, such as a claim or an acknowledgement. Worship, exchanges, gifts, restrictions, obligations, waivers, authorities, proofs and wrongs all fall under it; the conditions of its validity are given in the entries for each kind. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5235} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5236} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5237}"
