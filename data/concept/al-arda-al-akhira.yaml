id: concept/al-arda-al-akhira
class: concept
kind: term
label:
  ar: العرضة الأخيرة
  en: The final review (al-ardha al-akhira)
  fr: "La dernière révision (al-ardha al-akhira)"
  ur: آخری دور ⁦(العرضۃ الاخیرۃ)⁩
  es: "La revisión final (al-ardha al-akhira)"
  tr: "Son Düğün"
  id: "Pernikahan Terakhir"
summary:
  ar: "العرضة الأخيرة هي آخر عرض لجبريل القرآن على النبي في العام الذي مات فيه، وقد نُقل أن جبريل كان يعارضه القرآن كل رمضان وعارضه مرتين في ذلك العام؛ ويرى جمهور العلماء أن المصاحف العثمانية كتبت على ما استقر فيها وتُرك ما نُسخ {cite:itqan-suyuti p. 335} {cite:itqan-suyuti p. 334} {cite:manahil-irfan-sabt p. 239}."
  en: "The final review is the last presentation of the Qur'an between Jibril and the Prophet in the year he died; it is reported that Jibril reviewed the Qur'an with him every Ramadan and twice in that year, and most scholars hold that the Uthmanic codices were written on what was settled in it, leaving what was abrogated {cite:itqan-suyuti p. 335} {cite:itqan-suyuti p. 334} {cite:manahil-irfan-sabt p. 239}."
  fr: "La dernière révision est la dernière présentation du Coran entre Jibril et le Prophète, l’année de la mort de ce dernier. Selon les récits, Jibril révisait le Coran avec lui à chaque ramadan et l’a fait deux fois cette année-là. La majorité des savants estime que les codex d’Uthman ont été rédigés d’après ce qui a été fixé lors de cette révision, en écartant ce qui avait été abrogé {cite:itqan-suyuti p. 335} {cite:itqan-suyuti p. 334} {cite:manahil-irfan-sabt p. 239}."
  ur: "عرضۂ اخیرہ وہ آخری دور ہے جس میں جبریل نے آخری سال، جس میں نبی کی وفات ہوئی، قرآن آپ کو سنایا؛ مروی ہے کہ جبریل ہر رمضان میں آپ سے قرآن کا دور کرتے تھے اور اس سال دو بار کیا، اور جمہور علماء کے نزدیک مصاحفِ عثمانیہ اسی پر لکھے گئے جو اس میں قرار پایا اور منسوخ چھوڑ دیا گیا {cite:itqan-suyuti p. 335} {cite:itqan-suyuti p. 334} {cite:manahil-irfan-sabt p. 239}۔"
  es: "La revisión final es la última presentación del Corán entre Jibril y el Profeta en el año de su muerte; se informa que Jibril revisó el Corán con él cada Ramadán y dos veces en ese año, y la mayoría de los eruditos sostienen que los códices utmánicos fueron escritos sobre lo que estaba establecido en él, dejando lo que fue abrogado {cite:itqan-suyuti p. 335} {cite:itqan-suyuti p. 334} {cite:manahil-irfan-sabt p. 239}."
  tr: "Son Ardah, Cebrail'in Peygamber'e son Kur'an sunuşudur, ölüm yılı. Cebrail'in her Ramazan'da Kur'an'a karşı çıktığı ve o yıl iki kez karşı çıktığı bildirilmiştir; çoğu alim, Osmanlı Kur'anlarının içinde yer alana göre yazıldığına ve kaldırılanı terk ettiğine inanır. {cite:itqan-suyuti, s. 335} {cite:itqan-suyuti, s. 334} {cite:manahil-irfan-sabt s. 239}."
  id: "Ardah terakhir adalah presentasi terakhir Al-Qur'an Gabriel kepada Nabi, tahun kematiannya. Dilaporkan bahwa Jibril menentang Al-Qur'an setiap Ramadan dan menentangnya dua kali pada tahun itu; sebagian besar ulama percaya bahwa Al-Qur'an Ottoman ditulis sesuai dengan apa yang tercantum dan meninggalkan apa yang dihapus. {cite:itqan-suyuti, hlm. 335} {cite:itqan-suyuti, hlm. 334} {cite:manahil-irfan-sabt hlm. 239}."
