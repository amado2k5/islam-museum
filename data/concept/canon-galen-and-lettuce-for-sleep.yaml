id: concept/canon-galen-and-lettuce-for-sleep
class: concept
kind: scientific
label:
  ar: "جالينوس والخس للنوم عند ابن سينا"
  en: "Galen and lettuce for sleep in the Canon"
  fr: "Galien et la laitue pour dormir dans le Canon"
  ur: "جالینوس اور نیند کے لیے کاہو قانون میں"
  es: "Galeno y lechuga para dormir en el Canon"
summary:
  ar: "ينقل ابن سينا عن جالينوس أنه كان يتناول كل ليلة بقيلة خس مطيبة، الخس لينومه والتطييب ليتدارك به تبريده، لأنه شيخ ينفعه ترطيب النوم، ويعد ذلك أنعم تدبير لمن يعصيه النوم، ويضيف إليه الحمام بعد الهضم وصب الماء الحار على الرأس {cite:canon-ibn-sina-print-v1 p.241}."
  en: "Ibn Sina reports of Galen that he took every night a seasoned dish of lettuce, the lettuce for sleep and the seasoning to make good its cooling, since as an old man he profited from the moistening of sleep; he calls this the gentlest regimen for one whom sleep eludes, adding a bath after digestion and hot water poured over the head {cite:canon-ibn-sina-print-v1 p.241}."
  fr: "Ibn Sina rapporte que Galien prenait chaque soir de la laitue assaisonnée : laitue pour dormir, assaisonnement contre son refroidissement ; âgé, il bénéficiait de l’humidification du sommeil. Ibn Sina y voit le régime le plus doux de l’insomnie, avec bain après digestion et eau chaude sur la tête {cite:canon-ibn-sina-print-v1 p.241}."
  es: "Ibn Sina relata que Galeno tomaba cada noche un plato de lechuga sazonada, la lechuga para dormir y el condimento para refrescarla, ya que, siendo anciano, se beneficiaba de la humedad del sueño; llama a esto el régimen más suave para quien elude el sueño, añadiendo un baño después de la digestión y agua caliente vertida sobre la cabeza {cite:canon-ibn-sina-print-v1 p.241}."
  ur: "ابن سینا نے گیلن کے بارے میں بیان کیا ہے کہ وہ ہر رات لیٹش کی ایک پکائی ہوئی ڈش، نیند کے لیے لیٹش اور اس کی ٹھنڈک کو بہتر بنانے کے لیے مسالا لیتا تھا، چونکہ وہ بوڑھے آدمی کے طور پر نیند کے نم ہونے سے فائدہ اٹھاتا تھا۔ وہ اسے اس شخص کے لیے نرم ترین طریقہ کہتا ہے جس کی نیند نہیں آتی، ہاضمے کے بعد غسل اور سر پر گرم پانی ڈالنا۔"
