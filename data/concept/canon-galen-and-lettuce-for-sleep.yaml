label: { ar: "جالينوس والخس للنوم عند ابن سينا", en: "Galen and lettuce for sleep in the Canon", ur: "جالینوس اور نیند کے لیے کاہو قانون میں" }
summary:
  ar: "ينقل ابن سينا عن جالينوس أنه كان يتناول كل ليلة بقيلة خس مطيبة، الخس لينومه والتطييب ليتدارك به تبريده، لأنه شيخ ينفعه ترطيب النوم، ويعد ذلك أنعم تدبير لمن يعصيه النوم، ويضيف إليه الحمام بعد الهضم وصب الماء الحار على الرأس {cite:canon-ibn-sina-print-v1 p.241}."
  en: "Ibn Sina reports of Galen that he took every night a seasoned dish of lettuce, the lettuce for sleep and the seasoning to make good its cooling, since as an old man he profited from the moistening of sleep; he calls this the gentlest regimen for one whom sleep eludes, adding a bath after digestion and hot water poured over the head {cite:canon-ibn-sina-print-v1 p.241}."
