id: concept/meals-around-exercise-and-the-bath
class: concept
kind: scientific
label: { ar: "الطعام قبل الرياضة والحمام وبعدهما", en: "Meals around exercise and the bath", ur: "ورزش اور حمام کے آس پاس کھانا", es: "Las comidas se realizan en torno al ejercicio y el baño.", fr: "Les repas autour de l'exercice et du bain", tr: "Egzersiz ve banyo öncesi ve sonrası beslenme", id: "Makanan sebelum dan sesudah berolahraga serta mandi" }
summary:
  ar: "يقول ابن سينا إن من احتاج إلى أكل قبل الرياضة فليأكل من الخبز وحده قدراً ينهضم قبل شروعه في الحركة، وإن الحركة بعد الطعام يجب أن تكون رقيقة لينة، وإن السمين لا يأكل كما يخرج من الحمام بل ينام نومة خفيفة، ويحذر من الحركة العنيفة على الطعام ومن الماء الكثير عليه {cite:canon-ibn-sina-print-v1 p.231}."
  en: "Ibn Sina says one who must eat before exercise should take only bread, enough to be digested before he moves; movement after a meal should be only light and gentle; a stout person should not eat straight after leaving the bath but wait and nap briefly; and he warns against violent movement on food and against much water over it {cite:canon-ibn-sina-print-v1 p.231}."
  es: "Ibn Sina dice que quien deba comer antes de hacer ejercicio debe tomar solo pan, lo suficiente para que se digiera antes de moverse; el movimiento después de una comida debe ser ligero y suave; una persona corpulenta no debe comer inmediatamente después de salir del baño, sino esperar y tomar una siesta breve; y advierte contra el movimiento violento sobre la comida y contra el exceso de agua sobre ella {cite:canon-ibn-sina-print-v1 p.231}."
  fr: "Ibn Sina dit que celui qui doit manger avant l'exercice ne doit prendre que du pain, en quantité suffisante pour être digéré avant de bouger; les mouvements après un repas doivent être légers et doux; une personne corpulente ne doit pas manger immédiatement après être sortie du bain, mais attendre et faire une courte sieste; et il met en garde contre les mouvements violents sur la nourriture et contre une grande quantité d'eau dessus {cite:canon-ibn-sina-print-v1 p.231}."
  ur: "ابن سینا کا کہنا ہے کہ جس کو ورزش کرنے سے پہلے کھانا چاہیے وہ صرف روٹی لے، جو حرکت کرنے سے پہلے ہضم ہو جائے۔ کھانے کے بعد حرکت صرف ہلکی اور نرم ہونی چاہیے۔ ایک مضبوط آدمی کو غسل سے نکلنے کے بعد سیدھا کھانا نہیں کھانا چاہئے بلکہ تھوڑی دیر انتظار کریں اور سوئیں؛ اور وہ کھانے پر پرتشدد نقل و حرکت اور اس پر زیادہ پانی کے خلاف خبردار کرتا ہے {حوالہ: کینن ابن سینا پرنٹ-v1 صفحہ 231}۔"
  tr: "İbn Sina, egzersizden önce yemek yemesi gerekenin hareket etmeye başlamadan önce sindirilmiş bir ekmek porsiyonu yemesi gerektiğini söyler. Yemekten sonraki hareket nazik ve yumuşak olmalıdır. Şişman bir kişi, banyodan çıkarken olduğu gibi yememeli, hafifçe uyumalıdır. Yiyeceğin şiddetli hareketlerine ve üzerine aşırı su verilmesine dikkat etmelidir {cite:canon-ibn-sina-print-v1 s.231}."
  id: "Ibn Sina mengatakan bahwa siapa pun yang perlu makan sebelum berolahraga harus makan hanya sebagian roti yang sudah dicerna sebelum mulai bergerak. Gerakan setelah makan harus lembut dan lembut. Orang gemuk tidak boleh makan seperti saat keluar dari bak mandi, melainkan tidur ringan. Ia harus berhati-hati terhadap gerakan kasar pada makanan dan kelebihan air pada dirinya {cite:canon-ibn-sina-print-v1 hlm.231}."
