label: { ar: "الطعام قبل الرياضة والحمام وبعدهما", en: "Meals around exercise and the bath", ur: "ورزش اور حمام کے آس پاس کھانا" }
summary:
  ar: "يقول ابن سينا إن من احتاج إلى أكل قبل الرياضة فليأكل من الخبز وحده قدراً ينهضم قبل شروعه في الحركة، وإن الحركة بعد الطعام يجب أن تكون رقيقة لينة، وإن السمين لا يأكل كما يخرج من الحمام بل ينام نومة خفيفة، ويحذر من الحركة العنيفة على الطعام ومن الماء الكثير عليه {cite:canon-ibn-sina-print-v1 p.231}."
  en: "Ibn Sina says one who must eat before exercise should take only bread, enough to be digested before he moves; movement after a meal should be only light and gentle; a stout person should not eat straight after leaving the bath but wait and nap briefly; and he warns against violent movement on food and against much water over it {cite:canon-ibn-sina-print-v1 p.231}."
