id: concept/ashna
class: concept
kind: natural
label:
  ar: "الأشنة"
  en: "Ashna (the lichen crust on oak, pine and walnut)"
  fr: "Ashna (croûte de lichen sur le chêne, le pin et le noyer)"
  ur: "اشنہ"
  es: "Ashna (la costra de líquenes en el roble, el pino y el nogal)"
summary:
  ar: "الأشنة في الكتاب قشور دقيقة لطيفة تلتفّ على شجر البلوط والصنوبر والجوز، لها رائحة طيبة؛ الجيّد منها الأبيض، وفيها برودة يسيرة إلى الفتور وقبض معتدل؛ فيها قبض وتحليل وتليين؛ تسكّن الأورام الحارة وتحلّل الصلابات وصلابة المفاصل، وتجلو البصر، وتحبس القيء وتقوّي المعدة وتزيل نفخها وتنفع من وجع الكبد الضعيف؛ ويذكر الكتاب فيها أقوالاً عن الرحم في فقرة موسومة معلّقة لحكم المؤسس {cite:canon-ibn-sina-print-v1 pp.351-352}"
  en: "In the book ashna is fine delicate crusts that wind around the oak, pine and walnut trees, with a sweet smell; the good kind is the white, with a slight coldness leaning to dullness and a moderate astringency; it has astringency, resolving and softening; it soothes hot swellings, resolves hardnesses and hardness of the joints, clears the sight, holds back vomiting, strengthens the stomach, removes its distension and helps weak liver pain; the book also gives statements on the womb in a labelled section held for the founder's ruling {cite:canon-ibn-sina-print-v1 pp.351-352}"
  fr: "Dans le livre, ashna désigne des croûtes fines et délicates s’enroulant autour des chênes, pins et noyers, à l’odeur agréable ; la bonne variété est blanche, légèrement froide avec une tendance à la torpeur et modérément astringente ; elle joint astringence, résolution et adoucissement ; elle apaise les gonflements chauds, résout les indurations et celles des articulations, éclaircit la vue, retient le vomissement, fortifie l’estomac, ôte sa distension et aide contre une faible douleur du foie ; le livre donne aussi des affirmations sur la matrice dans une section signalée en attente de la décision du fondateur {cite:canon-ibn-sina-print-v1 pp.351-352}"
  ur: "اشنہ کتاب میں باریک لطیف چھلکے ہیں جو بلوط، صنوبر اور اخروٹ کے درختوں پر لپٹے رہتے ہیں، اچھی خوشبو والے؛ ان میں سے اچھا سفید ہے، اس میں ہلکی سردی سستی کی طرف اور معتدل قبض ہے؛ اس میں قبض، تحلیل اور نرمی ہے؛ گرم ورم کو تسکین دیتی ہے، سختیوں اور جوڑوں کی سختی کو تحلیل کرتی ہے، بینائی کو جلا دیتی ہے، قے روکتی، معدے کو قوت دیتی اور اس کا پھولنا دور کرتی ہے اور جگر کے کمزور درد میں مفید ہے؛ کتاب رحم کے بارے میں اقوال موسوم حصے میں دیتی ہے جو بانی کے فیصلے کے لیے موقوف ہے {cite:canon-ibn-sina-print-v1 pp.351-352}۔"
  es: "En el libro, la ashna se describe como finas y delicadas costras que se enroscan alrededor de los robles, pinos y nogales, con un dulce aroma; la buena es la blanca, con una ligera frialdad que tiende a la opacidad y una astringencia moderada; tiene propiedades astringentes, resolutivas y suavizantes; alivia las hinchazones calientes, disuelve las durezas y la rigidez de las articulaciones, aclara la vista, previene los vómitos, fortalece el estómago, elimina su distensión y ayuda con el dolor de hígado débil; el libro también incluye declaraciones sobre el útero en una sección etiquetada reservada para la decisión del fundador {cite:canon-ibn-sina-print-v1 pp.351-352}"
