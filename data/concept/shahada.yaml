label:
  ar: الشهادتان
  en: The shahada
summary:
  ar: شهادة أن لا إله إلا الله وأن محمداً رسول الله، وهي أول ما ذكره حديث «بُني الإسلام على خمس» في بيان ما بُني عليه الإسلام. وتفرّق دائرة المعارف الإسلامية بين أربعة معانٍ للفظ الشهادة، هي المشاهَد، والإدلاء بالشهادة، وإعلان الإيمان، والموت شهيداً.
  en: The testimony that there is no god but God and that Muhammad is God's messenger, named first in the hadith 'Islam is built on five' that lists what Islam is built on. The Encyclopaedia of Islam distinguishes four senses of the word shahada, from what is seen to witnessing, to the profession of faith, to martyrdom.
  ur: اس بات کی گواہی کہ اللہ کے سوا کوئی معبود نہیں اور محمد اللہ کے رسول ہیں، جو حدیث «اسلام کی بنیاد پانچ پر ہے» میں سب سے پہلے مذکور ہے۔ دائرۃ المعارف الاسلامیہ لفظ شہادت کے چار معانی الگ کرتا ہے، یعنی مشاہدہ، گواہی دینا، اقرار ایمان اور شہادت کی موت۔
