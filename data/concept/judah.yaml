id: concept/judah
class: concept
kind: legal
label: { ar: "الجودة", en: "Judah (the quality of goods, and concealed defects)", ur: "جودت", es: "Judá (la calidad de los bienes y los defectos ocultos)", fr: "Judah (la qualité des marchandises et les défauts cachés)", tr: "Kalite", id: "Kualitas" }
summary:
  ar: "الجودة في اللغة ضد الرداءة، وفي الفقه تتصل بالمعاملة المغشوشة، إذ تعرض الموسوعة صور تحسين المبيع بما يُخفي عيبه، كنفخ اللحم بعد السلخ، وجمع ماء الرحى قبل عرضها، وتصرية اللبن في الضرع. ويذكر فيها اختلاف الفقهاء في صحة الحوالة وشروطها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6688} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6689} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6690}"
  en: "Judah in the language is the opposite of poor quality. In fiqh it bears on deceptive sale: the encyclopedia lists ways of making goods look better than they are, such as inflating meat after skinning, gathering the water of a mill before offering it for sale or hire, and leaving milk in the udder to look plentiful. The entry also covers the schools' differing conditions for a transfer of debt (hawala). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6688} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6689} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6690}"
  es: "En el idioma, Judá es lo opuesto a mala calidad. En fiqh, se refiere a la venta engañosa: la enciclopedia enumera maneras de hacer que los productos parezcan mejores de lo que son, como inflar la carne después de despellejarla, recoger el agua de un molino antes de ofrecerlo para la venta o el alquiler, y dejar leche en la ubre para que parezca abundante. La entrada también abarca las diferentes condiciones de las escuelas para la transferencia de deuda (hawala). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6688} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6689} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6690}"
  fr: "En écriture kuwaitiyya, « Judah » est l'antonyme de « mauvaise qualité ». En fiqh (jurisprudence islamique), ce terme se rapporte à la vente trompeuse: l'encyclopédie recense des méthodes pour embellir la qualité des marchandises, comme gonfler la viande après l'avoir écorchée, recueillir l'eau d'un moulin avant de la vendre ou de la louer, ou encore laisser du lait dans le pis pour donner l'illusion d'une abondance. L'article aborde également les différentes conditions, selon les écoles juridiques, de la transmission de dette (hawala). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6688} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6689} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6690}"
  ur: "زبان میں یہوداہ ناقص معیار کے برعکس ہے۔ فقہ میں یہ دھوکہ دہی پر مبنی ہے: انسائیکلوپیڈیا میں سامان کو ان سے بہتر بنانے کے طریقے درج ہیں، جیسے کھال اتارنے کے بعد گوشت کو پھلانا، فروخت یا کرایہ پر پیش کرنے سے پہلے چکی کا پانی جمع کرنا، اور دودھ کو تھن میں چھوڑ دینا تاکہ وہ بہت زیادہ نظر آئے۔ داخلہ قرض ⁦(حوالہ)⁩ کی منتقلی کے لیے اسکولوں کی مختلف شرائط کا بھی احاطہ کرتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ6688} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ6689}"
  tr: "Dil kalitesi, aşağılığın tam tersidir ve hukukta sahte işlemlerle ilgilidir. Ansiklopedi, satılan ürünün kusurunu gizleyerek iyileştirme örnekleri sunar; örneğin, eti derisinden sonra üfleme, sergilemeden önce değirmen taşı suyu toplamak ve sütün memelerde ıslatılması gibi. Hukukçular arasındaki devrin geçerliliği ve koşulları konusundaki farklılıklardan bahseder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6688} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6689} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6690}"
  id: "Kualitas dalam bahasa adalah kebalikan dari inferioritas, dan dalam yurisprudensi berkaitan dengan transaksi penipuan. Ensiklopedia ini menyajikan contoh memperbaiki barang yang dijual dengan menyembunyikan cacatnya, seperti meniup daging setelah dikuliti, mengumpulkan air batu giling sebelum dipajang, dan merendam susu di ambing. Ensiklopedia ini menyebutkan perbedaan di antara ahli hukum mengenai keabsahan transfer dan syaratnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6688} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6689} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6690}"
