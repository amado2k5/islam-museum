summary:
  ar: "الجودة في اللغة ضد الرداءة، وفي الفقه تتصل بالمعاملة المغشوشة، إذ تعرض الموسوعة صور تحسين المبيع بما يُخفي عيبه، كنفخ اللحم بعد السلخ، وجمع ماء الرحى قبل عرضها، وتصرية اللبن في الضرع. ويذكر فيها اختلاف الفقهاء في صحة الحوالة وشروطها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6688} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6689} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6690}"
  en: "Judah in the language is the opposite of poor quality. In fiqh it bears on deceptive sale: the encyclopedia lists ways of making goods look better than they are, such as inflating meat after skinning, gathering the water of a mill before offering it for sale or hire, and leaving milk in the udder to look plentiful. The entry also covers the schools' differing conditions for a transfer of debt (hawala). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6688} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6689} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6690}"
