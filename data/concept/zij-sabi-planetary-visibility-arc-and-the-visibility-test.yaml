id: concept/zij-sabi-planetary-visibility-arc-and-the-visibility-test
class: concept
kind: scientific
label: { ar: "قوس الرؤية وامتحان ظهور الكواكب واختفائها", en: "The arc of vision and the test for the appearance and disappearance of the planets", ur: "قوسِ رؤیت اور سیاروں کے ظہور و اختفا کا امتحان", es: "El arco de visión y la prueba para la aparición y desaparición de los planetas", fr: "L'arc de vision et le test de l'apparition et de la disparition des planètes", tr: "Görüş açısı ve gezegenlerin görünme ve kaybolma testi", id: "Busur penglihatan dan uji kemunculan serta menghilangnya planet-planet" }
summary:
  ar: "لكل كوكب قوس رؤية من فلك تدوير ينسب إليه، ويُعرف بها الظهور والاختفاء بالحساب: فإن كان بين الكوكب والشمس بحسب درج المطالع أو المغارب مثل قوس الرؤية فإنه يُرى في ذلك اليوم أو يُختفي. وإن كان الحساب للرؤية من تحت الشعاع وكان البعد بينه وبين الشمس أقل من قوس الرؤية لم يظهر، وإن كان أكثر ظهر. وإن كان للاختفاء وكان البعد أقل من القوس فقد اختفى، وإن كان أكثر فلم يختف. {cite:zij-sabi-nallino-byblion pp.181-182}"
  en: "Each planet has an arc of vision, reckoned on its epicycle, by which appearance and disappearance are calculated. If the distance between the planet and the Sun, measured in rising or setting degrees, equals the arc of vision, the planet is seen or disappears on that day. For a first appearance from under the rays, if the distance is less than the arc it has not yet appeared, and if more it has. For a disappearance, less than the arc means it has disappeared, more means it has not. {cite:zij-sabi-nallino-byblion pp.181-182}"
  ur: "ہر سیارے کی ایک قوسِ رؤیت ہوتی ہے جو اس کے فلکِ تدویر پر شمار ہوتی ہے، اور اس سے ظہور اور اختفا حساب سے نکلتے ہیں۔ اگر سیارے اور سورج کے درمیان طالع یا غارب کے درجوں کا فاصلہ قوسِ رؤیت کے برابر ہو تو اس دن سیارہ نظر آتا ہے یا غائب ہوتا ہے۔ شعاع کے نیچے سے پہلے ظہور کے لیے اگر فاصلہ قوس سے کم ہو تو ظاہر نہیں ہوا، زیادہ ہو تو ظاہر ہو چکا ہے۔ اختفا کے لیے کم ہو تو غائب ہو چکا، زیادہ ہو تو غائب نہیں ہوا۔ {cite:zij-sabi-nallino-byblion pp.181-182}"
  es: "Cada planeta tiene un arco de visión, calculado en su epiciclo, mediante el cual se determinan su aparición y desaparición. Si la distancia entre el planeta y el Sol, medida en grados de salida o puesta, es igual al arco de visión, el planeta se ve o desaparece ese día. En el caso de una primera aparición desde debajo de los rayos, si la distancia es menor que el arco, aún no ha aparecido; si es mayor, sí. En el caso de una desaparición, si es menor que el arco, significa que ha desaparecido; si es mayor, que no. {cite:zij-sabi-nallino-byblion pp.181-182}"
  fr: "Chaque planète possède un arc de vision, calculé sur son épicycle, qui permet de déterminer son apparition et sa disparition. Si la distance entre la planète et le Soleil, mesurée en degrés de lever ou de coucher, est égale à l'arc de vision, la planète est visible ou disparaît ce jour-là. Pour une première apparition, si la distance est inférieure à l'arc, la planète n'est pas encore apparue; si elle est supérieure, elle l'est. Pour une disparition, une distance inférieure à l'arc signifie qu'elle a disparu; une distance supérieure signifie qu'elle ne l'est pas. {cite:zij-sabi-nallino-byblion pp.181-182}"
  tr: "Her gezegenin, kendisine atfedilen eliptik bir yörünge içinde bir görünürlük yayı vardır ve görünümü ve kaybolması hesaplamayla belirlenir: eğer gezegen ile güneş arasındaki mesafe, doğuş veya batış derecelerine göre, görünürlük yayına eşitse, o gün görünür veya kaybolur. Eğer hesaplama güneş ışınlarının altından görünürlük için yapılıyorsa ve gezegen ile güneş arasındaki mesafe görünürlük yayından az ise, görünmez; daha büyükse, görünür. Eğer hesaplama kaybolma için yapılıyorsa ve mesafe yaydan az ise, kaybolur; daha büyükse, kaybolmaz. {cite:zij-sabi-nallino-byblion pp.181-182}"
  id: "Setiap planet memiliki busur visibilitas dalam orbit elips yang menjadi acuannya, dan kemunculan serta menghilangnya ditentukan oleh perhitungan: jika jarak antara planet dan matahari, menurut derajat terbit atau terbenam, sama dengan busur visibilitas, maka planet tersebut akan terlihat atau menghilang pada hari itu. Jika perhitungannya untuk visibilitas dari bawah sinar matahari dan jarak antara planet dan matahari kurang dari busur visibilitas, maka planet tersebut tidak akan muncul; jika lebih besar, maka planet tersebut akan muncul. Jika perhitungannya untuk menghilang dan jaraknya kurang dari busur visibilitas, maka planet tersebut akan menghilang; jika lebih besar, maka planet tersebut tidak akan menghilang. {cite:zij-sabi-nallino-byblion pp.181-182}"
