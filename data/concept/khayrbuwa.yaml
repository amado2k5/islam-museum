summary:
  ar: "خيربوا في الكتاب حب صغار مثل القاقلة الصغار يجلب من السفالة، حار يابس في الثالثة، قوته قوة القرنفل يجلو ويلطف وهو ألطف من القاقلة، وهو جيد للمعدة والكبد الباردتين ويحبس القيء {cite:canon-ibn-sina-print-v1 p.718}"
  en: "Khayrbuwa is in the book small grains like small qaqulla brought from al-safala, hot and dry in the third degree, its strength the strength of the clove, cleansing and subtilising and subtler than qaqulla, and good for the cold stomach and liver and stops vomiting {cite:canon-ibn-sina-print-v1 p.718}"
  ur: "خیربوا کتاب میں چھوٹے دانے ہیں جیسے چھوٹی قاقلہ، السفالہ سے لائے جاتے ہیں، تیسرے درجے میں گرم خشک، اس کی قوت لونگ کی قوت ہے، جلا دیتا اور لطیف کرتا ہے اور قاقلہ سے زیادہ لطیف ہے، اور ٹھنڈے معدے اور جگر کے لیے اچھا ہے اور قے کو روکتا ہے {cite:canon-ibn-sina-print-v1 p.718}۔"
  es: "Khayrbuwa es en el libro pequeños granos como pequeños qaqulla traídos de al-safala, caliente y seco en tercer grado, su fuerza es la fuerza del clavo, limpiador y sutil y más sutil que el qaqulla, y bueno para el estómago y el hígado fríos y detiene los vómitos {cite:canon-ibn-sina-print-v1 p.718}"
