perspectives:
  - tradition: sunni-maliki
    id: maliki-public
    summary:
      ar: "ذهب المالكية إلى أن المعادن في الأرض الخاصة ملك عام لا تتبع ملكية الأرض، لأنها أشبه بالفيء ولأنها سابقة في باطن الأرض على ملك المالكين {cite:usul-iqtisad-islami-0660 p. 218}، وعلى رأيهم في الأرض المباحة أن المعادن ملك عام {cite:usul-iqtisad-islami-0660 p. 218}."
    sources: [source/usul-iqtisad-islami-0660]
  - tradition: sunni
    id: jumhur-hidden-minerals
    summary:
      ar: "ذهب آخرون إلى أن المعادن تملك بملك الأرض، لأن من ملك أرضاً ملك عمقها، وميّز بعضهم بين الجامد فيملك والجاري فلا يملك {cite:usul-iqtisad-islami-0660 p. 218}. وميّز جمهور الفقهاء بين الظاهر فلا يملك بالإحياء ولا يجوز إقطاعه، والباطن فأكثرهم على جواز تملكه {cite:usul-iqtisad-islami-0660 p. 218}."
    sources: [source/usul-iqtisad-islami-0660]
  - tradition: sunni-hanafi
    id: contemporary-preference
    summary:
      ar: "يرجح الشيخ محمد أبو زهرة الأخذ في عصرنا برأي المالكية وفقاً لقانون مصري، وذهب إليه أيضاً محمد باقر الصدر لتنامي قدرة الإنسان على الطبيعة بالآلات الحديثة {cite:usul-iqtisad-islami-0660 p. 219}. وهذا ترجيح معاصر للمؤلف يذكره ولا يقرره حكماً."
    sources: [source/usul-iqtisad-islami-0660]
