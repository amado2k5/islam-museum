id: concept/minerals-ownership-in-islam
class: concept
kind: legal
tags: [islamic-economy-browser, islamic-economy-money]
label:
  ar: "ملكية المعادن"
  en: "Ownership of minerals in Islam"
  es: "La propiedad de los minerales en el Islam"
  fr: "La propriété des minéraux en islam"
  ur: "اسلام میں معدنیات کی ملکیت"
  tr: "Maden Sahipliği"
  id: "Kepemilikan Mineral"
issue:
  ar: "هل تملك المعادن في الأرض الخاصة بملك الأرض، وهل تُملك بالإحياء؟"
summary:
  ar: "يعرّف المؤلف المعدن بأنه جوهر الأرض، ويقسم المعادن إلى جامد كالذهب والفضة والحديد، وجارٍ كالنفط والماء، وظاهر لا يحتاج إلى مؤنة، وباطن يحتاج إليها {cite:usul-iqtisad-islami-0660 p. 217} {cite:usul-iqtisad-islami-0660 p. 218}. وإن كانت الأرض لبيت المال فالمعادن لبيت المال {cite:usul-iqtisad-islami-0660 p. 218}. وفي الأرض الخاصة يرى المالكية أن المعادن ملك عام، ويرى غيرهم أنها تملك بملك الأرض {cite:usul-iqtisad-islami-0660 p. 218}. والظاهر منها لا يملك بالإحياء عند جمهور الفقهاء، والباطن يملك {cite:usul-iqtisad-islami-0660 p. 218}."
  tr: "Yazar, metali toprağın özü olarak tanımlar; mineralleri altın, gümüş ve demir gibi katı parçalar; yağ ve su gibi akan; emek gerektirmeyen dış form; ve bunu gerektiren iç form {cite:usul-iqtisad-islami-0660 s. 217} {cite:usul-iqtisad-islami-0660 s. 218}. Arazi kamu hazinesine aitse, mineraller kamu hazinesine aittir {cite:usul-iqtisad-islami-0660 s. 218}. Özel arazide Malikiler mineralleri kamu malı olarak kabul ederken, diğerleri onları arazinin mülkiyeti olarak görür {cite:usul-iqtisad-islami-0660 s. 218}. Görünürdeki anlam, hukukçuların çoğuna göre diriliş yoluyla sahip olmadığı ve iç kısmının sahip olduğu {cite:usul-iqtisad-islami-0660 s. 218} olarak görülür."
  id: "Penulis mendefinisikan logam sebagai esensi bumi, membagi mineral menjadi padatan seperti emas, perak, dan besi; mengalir seperti minyak dan air; bentuk luar yang tidak memerlukan tenaga kerja; dan bentuk dalam yang membutuhkannya {cite:usul-iqtisad-islami-0660 hlm. 217} {cite:usul-iqtisad-islami-0660 hlm. 218}. Jika tanah tersebut milik kas negara, maka mineral tersebut milik kas umum {cite:usul-iqtisad-islami-0660 hlm. 218}. Di tanah pribadi, orang Malik menganggap mineral sebagai properti publik, sementara yang lain melihatnya sebagai kepemilikan tanah {cite:usul-iqtisad-islami-0660 hlm. 218}. Makna yang tampak adalah bahwa ia tidak memiliki kebangkitan menurut mayoritas ahli hukum, dan bagian dalamnya memiliki {cite:usul-iqtisad-islami-0660 hlm. 218}."
