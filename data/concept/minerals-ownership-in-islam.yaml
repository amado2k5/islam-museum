id: concept/minerals-ownership-in-islam
class: concept
kind: legal
label:
  ar: "ملكية المعادن"
  en: "Ownership of minerals in Islam"
issue:
  ar: "هل تملك المعادن في الأرض الخاصة بملك الأرض، وهل تُملك بالإحياء؟"
summary:
  ar: "يعرّف المؤلف المعدن بأنه جوهر الأرض، ويقسم المعادن إلى جامد كالذهب والفضة والحديد، وجارٍ كالنفط والماء، وظاهر لا يحتاج إلى مؤنة، وباطن يحتاج إليها {cite:usul-iqtisad-islami-0660 p. 217} {cite:usul-iqtisad-islami-0660 p. 218}. وإن كانت الأرض لبيت المال فالمعادن لبيت المال {cite:usul-iqtisad-islami-0660 p. 218}. وفي الأرض الخاصة يرى المالكية أن المعادن ملك عام، ويرى غيرهم أنها تملك بملك الأرض {cite:usul-iqtisad-islami-0660 p. 218}. والظاهر منها لا يملك بالإحياء عند جمهور الفقهاء، والباطن يملك {cite:usul-iqtisad-islami-0660 p. 218}."
wings: [objects]
themes:
