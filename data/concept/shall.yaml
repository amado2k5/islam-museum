  fr: "Shall (le coing indien, selon la note de l'éditeur)"
summary:
  ar: "الشل في الكتاب دواء هندي يشبه الزنجبيل، وفي الحاشية أنه السفرجل الهندي، حار يابس في الثانية، مر قابض حريف يكسر الرياح وفي قوة العسل، وله تحليل عجيب وتلطيف، نافع للعصب والفسوخ {cite:canon-ibn-sina-print-v1 p.674}"
  en: "Shall is in the book an Indian drug resembling ginger, and the editor's note says it is the Indian quince; it is hot and dry in the second degree, bitter, astringent and pungent, breaking winds and with the power of honey, with a marvellous dissolving and subtilising power, and beneficial for the nerve and for dislocations {cite:canon-ibn-sina-print-v1 p.674}"
  ur: "شل کتاب میں ایک ہندی دوا ہے جو ادرک سے مشابہ ہے، اور حاشیے میں ہے کہ یہ ہندی سفرجل ہے؛ دوسرے درجے میں گرم خشک، کڑوا، قابض اور تیز ہے، ہواؤں کو توڑتا ہے اور شہد کی قوت رکھتا ہے، اس میں حیرت انگیز تحلیل اور لطافت ہے، اور عصب اور جوڑ کے اکھڑنے میں نافع ہے {cite:canon-ibn-sina-print-v1 p.674}۔"
  es: "En el libro, Shall es una droga india parecida al jengibre, y la nota del editor dice que es el membrillo indio; es caliente y seco en segundo grado, amargo, astringente y picante, que alivia los gases y tiene el poder de la miel, con un maravilloso poder disolvente y sutilizante, y beneficioso para los nervios y para las dislocaciones {cite:canon-ibn-sina-print-v1 p.674}"
  fr: "Le Shall est décrit dans le livre comme une drogue indienne ressemblant au gingembre, et la note de l'éditeur précise qu'il s'agit du coing indien; il est chaud et sec au deuxième degré, amer, astringent et piquant, il est un coupe-faim et possède la puissance du miel, un pouvoir dissolvant et subtilisant remarquable, et est bénéfique pour le système nerveux et les luxations {cite:canon-ibn-sina-print-v1 p.674}"
