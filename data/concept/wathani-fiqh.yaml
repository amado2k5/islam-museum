summary:
  ar: "الوثن ما له جثة من خشب أو حجر أو غيره، والوثني عابد الأوثان والمتدين بها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16604} ويختلف الوثني عن المشرك والكافر والمرتد والمجوسي والملحد، والوثنية نوع من الكفر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16604} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16605} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16606} وأجمع العلماء على أن الوثني كافر، ويجب على المسلمين تبليغ الدعوة إليه، ولا يُعلن القتال عليه قبل الدعوة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16606} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16607} والوثنيون يقرون بالخالق ولكنهم لا يقرون بالوحدانية، ومن مات على الشرك فجزاؤه الخلود في النار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16607} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16608} وفي الحرب يجوز قتال المقاتلين من الوثنيين بعد الدعوة، ولا يجوز قتل النساء والصبيان والمجانين باتفاق الفقهاء، وعند الجمهور لا يُقتل الشيوخ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16608} ويجوز سبي نسائهم وأولادهم بعد فتح بلادهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16609} وتُقبل الجزية من الوثني غير العربي عند الجمهور، ولا تُقبل من العربي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16608} وإذا أسلم الوثني نطق بالشهادتين، ولا يُشترط غيرهما في المذاهب الأربعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16610} وأنكحة الوثنيين بعضهم من بعض صحيحة عند الجمهور، ويحرم على المسلم أن يتزوج وثنية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16612} ولا تحل ذبيحة الوثني ولا صيده إلا السمك والجراد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16613} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16614}"
  en: "A wathan is an idol with a body of wood, stone or other material; the wathani is the worshipper of idols and one who follows that religion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16604} The idolater differs from the associator (mushrik), the unbeliever (kafir), the apostate, the Zoroastrian and the atheist; idolatry is one kind of unbelief. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16604} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16605} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16606} Scholars agree that the idolater is an unbeliever; Muslims must call him to Islam, and war is not declared before the call. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16606} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16607} Idolaters acknowledge the Creator but deny God's oneness; one who dies in idolatry is held to abide in the Fire with the unbelievers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16607} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16608} In war, the fighting men may be killed after the call, while women, children, the insane and the hermaphrodite may not, by agreement; most jurists exempt the old. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16608} The women and children of a conquered people may be enslaved. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16609} Most jurists accept the jizya from a non-Arab idolater but not from an Arab. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16608} On conversion, the profession of the two testimonies suffices in the four schools. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16610} Marriages among idolaters are valid for most jurists, while a Muslim may not marry an idolatress. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16612} The flesh of an idolater's slaughter is not lawful, nor his game, except fish and locusts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16613} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16614}"
