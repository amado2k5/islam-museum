label: { ar: "وَثَنِيّ", en: "Wathani (the idolater: his status, rights and obligations)", es: "Wathani (el idólatra: su estatus, derechos y obligaciones)", fr: "Wathani (l'idolâtre: son statut, ses droits et ses obligations)", ur: "وثانی ⁦(مشرک: اس کی حیثیت، حقوق اور فرائض)⁩", tr: "pagan", id: "penyembah berhala" }
sensitivity: violence
summary:
  ar: "الوثن ما له جثة من خشب أو حجر أو غيره، والوثني عابد الأوثان والمتدين بها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16604} ويختلف الوثني عن المشرك والكافر والمرتد والمجوسي والملحد، والوثنية نوع من الكفر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16604} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16605} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16606} وأجمع العلماء على أن الوثني كافر، ويجب على المسلمين تبليغ الدعوة إليه، ولا يُعلن القتال عليه قبل الدعوة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16606} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16607} والوثنيون يقرون بالخالق ولكنهم لا يقرون بالوحدانية، ومن مات على الشرك فجزاؤه الخلود في النار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16607} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16608} وفي الحرب يجوز قتال المقاتلين من الوثنيين بعد الدعوة، ولا يجوز قتل النساء والصبيان والمجانين باتفاق الفقهاء، وعند الجمهور لا يُقتل الشيوخ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16608} ويجوز سبي نسائهم وأولادهم بعد فتح بلادهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16609} وتُقبل الجزية من الوثني غير العربي عند الجمهور، ولا تُقبل من العربي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16608} وإذا أسلم الوثني نطق بالشهادتين، ولا يُشترط غيرهما في المذاهب الأربعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16610} وأنكحة الوثنيين بعضهم من بعض صحيحة عند الجمهور، ويحرم على المسلم أن يتزوج وثنية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16612} ولا تحل ذبيحة الوثني ولا صيده إلا السمك والجراد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16613} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16614}"
  en: "A wathan is an idol with a body of wood, stone or other material; the wathani is the worshipper of idols and one who follows that religion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16604} The idolater differs from the associator (mushrik), the unbeliever (kafir), the apostate, the Zoroastrian and the atheist; idolatry is one kind of unbelief. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16604} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16605} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16606} Scholars agree that the idolater is an unbeliever; Muslims must call him to Islam, and war is not declared before the call. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16606} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16607} Idolaters acknowledge the Creator but deny God's oneness; one who dies in idolatry is held to abide in the Fire with the unbelievers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16607} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16608} In war, the fighting men may be killed after the call, while women, children, the insane and the hermaphrodite may not, by agreement; most jurists exempt the old. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16608} The women and children of a conquered people may be enslaved. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16609} Most jurists accept the jizya from a non-Arab idolater but not from an Arab. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16608} On conversion, the profession of the two testimonies suffices in the four schools. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16610} Marriages among idolaters are valid for most jurists, while a Muslim may not marry an idolatress. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16612} The flesh of an idolater's slaughter is not lawful, nor his game, except fish and locusts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16613} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16614}"
  es: "Un wathan es un ídolo con un cuerpo de madera, piedra u otro material; el wathani es el adorador de ídolos y el que sigue esa religión. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16604} El idólatra se diferencia del asociador (mushrik), el incrédulo (kafir), el apóstata, el zoroastriano y el ateo; la idolatría es un tipo de incredulidad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16604} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16605} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16606} Los eruditos coinciden en que el idólatra es un incrédulo; los musulmanes deben llamarlo al Islam, y no se declara la guerra antes de la llamada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16606} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16607} Los idólatras reconocen al Creador pero niegan la unicidad de Dios; quien muere en idolatría se considera que morará en el Fuego con los incrédulos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16607} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16608} En la guerra, los hombres combatientes pueden ser asesinados después del llamado, mientras que las mujeres, los niños, los locos y los hermafroditas no pueden, por acuerdo; la mayoría de los juristas eximen a los ancianos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16608} Las mujeres y los niños de un pueblo conquistado pueden ser esclavizados. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16609} La mayoría de los juristas aceptan la jizya de un idólatra no árabe pero no de un árabe. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16608} En la conversión, la profesión de los dos testimonios es suficiente en las cuatro escuelas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16610} Los matrimonios entre idólatras son válidos para la mayoría de los juristas, mientras que un musulmán no puede casarse con una idólatra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16612} La carne de la matanza de un idólatra no es lícita, ni su caza, excepto el pescado y las langostas. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16613} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.16614}"
  fr: "Un wathan est une idole dont le corps est en bois, en pierre ou en un autre matériau; le wathani est celui qui adore les idoles et qui suit cette religion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16604} L’idolâtre se distingue de l’associateur (mushrik), de l’incrédule (kafir), de l’apostat, du zoroastrien et de l’athée; l’idolâtrie est une forme d’incroyance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16604} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16605} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16606} Les savants s’accordent à dire que l’idolâtre est un incrédule. Les musulmans doivent l'appeler à l'islam, et la guerre ne peut être déclarée avant cet appel. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16606} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16607} Les idolâtres reconnaissent le Créateur mais nient l'unicité de Dieu; celui qui meurt dans l'idolâtrie est voué à demeurer en Enfer avec les mécréants. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16607} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16608} En temps de guerre, les hommes combattants peuvent être tués après l'appel, tandis que les femmes, les enfants, les aliénés et les hermaphrodites ne le peuvent pas, par accord mutuel; la plupart des juristes exemptent les personnes âgées. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16608} Les femmes et les enfants d'un peuple conquis peuvent être réduits en esclavage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16609} La plupart des juristes acceptent la jizya d'un idolâtre non arabe, mais pas d'un Arabe. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16608} Lors d'une conversion, la profession des deux témoignages suffit dans les quatre écoles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16610} Les mariages entre idolâtres sont valides pour la plupart des juristes, tandis qu'un musulman ne peut épouser une idolâtre. {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.16612} La chair du massacre d'un idolâtre n'est pas licite, ni son gibier, à l'exception du poisson et des sauterelles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16613} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16614}"
  ur: "واتھن ایک بت ہے جس میں لکڑی، پتھر یا دیگر مواد ہوتا ہے۔ وثانی بتوں کی پوجا کرنے والا اور اس مذہب کی پیروی کرنے والا ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 16604} مشرک مشرک ⁦(مشرک)⁩، کافر ⁦(کافر)⁩، مرتد، زرتشتی اور ملحد سے مختلف ہے۔ بت پرستی ایک قسم کا کفر ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16604} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16605} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16606} اس پر اہل علم متفق ہیں۔ مسلمانوں کو اسے اسلام کی طرف بلانا چاہیے، اور دعوت سے پہلے جنگ کا اعلان نہیں کیا جاتا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16606} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16607} بت پرست خالق کو تسلیم کرتے ہیں لیکن خدا کی وحدانیت کا انکار کرتے ہیں۔ جو شخص بت پرستی میں مر جاتا ہے اسے کافروں کے ساتھ آگ میں رکھا جاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16607} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16608} جنگ میں لڑنے والے مرد اذان کے بعد مارے جاسکتے ہیں، جبکہ عورتیں، بچے، دیوانے اور ہرمافروڈائٹ، معاہدے کے مطابق نہیں ہوسکتے۔ زیادہ تر فقہا پرانے کو مستثنیٰ قرار دیتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 16608} مفتوحہ قوم کی عورتوں اور بچوں کو غلام بنایا جا سکتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16609} اکثر فقہاء ایک غیر عرب مشرک سے جزیہ قبول کرتے ہیں لیکن عرب سے نہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16608} تبدیلی پر، چار مکاتب میں دو شہادتوں کا پیشہ کافی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16610} اکثر فقہا کے نزدیک مشرکین کے درمیان نکاح جائز ہے، جب کہ مسلمان مشرک سے شادی نہیں کر سکتا۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 16612} مشرک کے ذبیحہ کا گوشت حلال نہیں ہے اور نہ اس کا کھیل، سوائے مچھلی اور ٹڈی کے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16613}"
  tr: "Put, tahta, taş veya başka bir şeyden yapılmış bir gövdeye sahip olan şeydir. Putperest ise putlara tapan ve onlara inanan kimsedir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16604} Putperest, çok tanrıcıdan, kâfirden, mürtedden, Mecusiden ve ateistten farklıdır ve putperestlik bir tür küfürdür. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16604} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16605} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16606} Alimler, putperestin kâfir olduğu konusunda oybirliği içinde hemfikirdir ve Müslümanlar ona tebliğde bulunmalı, tebliğden önce onun için savaş ilan edilmemelidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16606} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16607} Putperestler Yaratıcıyı kabul ederler ancak O'nun birliğini kabul etmezler. Çok tanrıcılık halinde ölen herkes cehennemde ebedi azapla cezalandırılacaktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16607} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16608} Savaşta, putperest savaşçıları İslam'a davet ettikten sonra onlarla savaşmak caizdir. Alimlerin ittifakına göre kadınların, çocukların veya akıl hastalarının öldürülmesi caiz değildir. Çoğunluk görüşüne göre yaşlılar öldürülmemelidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16608} Topraklarını fethettikten sonra kadınlarını ve çocuklarını esir almak caizdir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16609} Çoğu âlime göre, cizye (baş vergisi) Arap olmayan bir putperestten alınır, ancak bir Arap'tan alınmaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16608} Bir putperest İslam'a geçerse, iki şahitlik (şehadet) söyler ve İslam hukukunun dört mezhebine göre başka bir şey gerekmez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16610} Çoğu âlime göre putperestler arasındaki evlilikler geçerlidir ve bir Müslümanın putperest bir kadınla evlenmesi yasaktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16612} Putperestin kestiği et ve avladığı av hayvanları, balık ve çekirge hariç, yenmesi caiz değildir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16613} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16614}"
  id: "Berhala adalah sesuatu yang memiliki tubuh yang terbuat dari kayu, batu, atau bahan lainnya. Seorang penyembah berhala adalah orang yang menyembah berhala dan orang yang taat beragama kepadanya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16604} Orang kafir berbeda dari orang politeis, orang kafir, orang murtad, orang Majusi, dan orang ateis, dan paganisme adalah jenis kekafiran. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16604} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16605} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16606} Para ulama sepakat bahwa orang kafir adalah orang yang tidak beriman, dan umat Islam harus menyampaikan dakwah kepadanya, dan tidak boleh memperdebatkannya sebelum dakwah disampaikan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16606} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16607} Orang-orang kafir mengakui Sang Pencipta tetapi tidak mengakui Keesaan-Nya. Siapa pun yang meninggal dalam keadaan politeisme akan dihukum dengan azab abadi di Neraka. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16607} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16608} Dalam peperangan, diperbolehkan untuk melawan pejuang kafir setelah mengajak mereka masuk Islam. Tidak diperbolehkan membunuh wanita, anak-anak, atau orang gila, menurut konsensus para ulama. Pendapat mayoritas adalah bahwa orang tua tidak boleh dibunuh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16608} Diperbolehkan menawan wanita dan anak-anak mereka setelah menaklukkan tanah mereka. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16609} Jizya (pajak kepala) diterima dari orang kafir non-Arab menurut mayoritas ulama, tetapi tidak dari orang Arab. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16608} Jika seorang kafir masuk Islam, ia mengucapkan dua syahadat, dan tidak ada lagi yang dipersyaratkan menurut empat mazhab fiqh Islam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16610} Pernikahan antara orang kafir sah menurut mayoritas ulama, dan haram bagi seorang Muslim untuk menikahi wanita kafir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16612} Daging yang disembelih oleh orang kafir dan hewan buruannya tidak boleh dimakan, kecuali ikan dan belalang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16613} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16614}"
