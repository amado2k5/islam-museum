label:
  ar: "زوفا يابس"
  en: "Dry zufa (mountain and garden kinds)"
  ur: "خشک زوفا ⁦(پہاڑی اور باغی اقسام)⁩"
  es: "Zufa seca (variedades de montaña y de jardín)"
summary:
  ar: "الزوفا اليابس نوعان، جبلي وبستاني، حار يابس في الثالثة، لطيف كالصعتر؛ يحلّل الأورام الصلبة، وينفع الصدر والرئة والربو، ويسهّل البلغم والديدان. {cite:canon-ibn-sina-print-v1 p.457}"
  en: "Dry zufa comes in mountain and garden kinds, hot and dry in the third degree, subtle like thyme. It dissolves hard swellings, helps the chest, the lung and asthma, and purges phlegm and worms. {cite:canon-ibn-sina-print-v1 p.457}"
  ur: "خشک زوفا پہاڑی اور باغی دو قسم کا ہے، تیسرے درجے میں گرم اور خشک، صعتر کی طرح لطیف۔ یہ سخت سوجن کو تحلیل کرتا ہے، سینے، پھیپھڑے اور دمے میں مفید ہے، اور بلغم اور کیڑے خارج کرتا ہے۔ {cite:canon-ibn-sina-print-v1 p.457}"
  es: "El zufa seco se presenta en variedades de montaña y de jardín, cálido y seco en tercer grado, sutil como el tomillo. Disuelve las hinchazones duras, ayuda al pecho, los pulmones y el asma, y purga la flema y los parásitos intestinales. {cite:canon-ibn-sina-print-v1 p.457}"
