id: concept/lahn-fiqh
class: concept
kind: legal
label:
  ar: "اللَّحْن"
  en: "Lahn (error or melody in recitation), fiqh rulings"
  ur: "لحن (قراءت اور نغمہ، فقہی احکام)"
summary:
  ar: "اللحن في اللغة له معان: أن يقول الإنسان قولاً يفهمه عنه صاحبه ويخفى على غيره، والخطأ في الإعراب ومخالفة وجه الصواب، والفطنة كما في الأثر: لعل بعضكم أن يكون ألحن بحجته، أي أفطن، والأصوات المصوغة المطربة، وجمعه ألحان ولحون {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13585}. وعند النحويين الخطأ في إعراب الكلمة أو تصحيح المفرد، وعند القراء خلل يطرأ على اللفظ فيخل بالمعنى {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13585}."
  en: "Lahn, in lexicon, has several senses: a speech that one listener understands and another does not; an error in grammatical case, or a departure from what is right; shrewdness, as in the saying that one of you may be more eloquent in his argument; and sung or melodious sounds, plural alhan and luhun. Among grammarians it is an error in a word's inflection or in the form of a single word; among readers, a flaw in the sound that disturbs the meaning {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13585}."
  ur: "لحن لغت میں کئی معنی رکھتا ہے: ایسی بات کرنا جو ایک شخص سمجھ جائے اور دوسرا نہ سمجھے؛ اعراب کی غلطی یا درستی سے ہٹنا؛ فطانت، جیسے حدیث میں ہے کہ شاید تم میں سے کوئی اپنی دلیل میں زیادہ فصیح ہو؛ اور دلکش آوازیں، جمع الحان اور لحون۔ نحویوں کے نزدیک کسی کلمے کے اعراب یا واحد کی تصحیح میں غلطی، اور قاریوں کے نزدیک لفظ میں ایسا خلل جو معنی بگاڑ دے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13585}۔"
