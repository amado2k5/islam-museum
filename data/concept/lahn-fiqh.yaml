id: concept/lahn-fiqh
class: concept
kind: legal
label:
  ar: "اللَّحْن"
  en: "Lahn (error or melody in recitation), fiqh rulings"
  ur: "لحن ⁦(قراءت اور نغمہ، فقہی احکام)⁩"
  es: "Lahn (error o melodía en la recitación), normas de fiqh"
  fr: "Lahn (erreur ou mélodie dans la récitation), décisions de fiqh"
  tr: "Melodi"
  id: "Melodi"
summary:
  ar: "اللحن في اللغة له معان: أن يقول الإنسان قولاً يفهمه عنه صاحبه ويخفى على غيره، والخطأ في الإعراب ومخالفة وجه الصواب، والفطنة كما في الأثر: لعل بعضكم أن يكون ألحن بحجته، أي أفطن، والأصوات المصوغة المطربة، وجمعه ألحان ولحون {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13585}. وعند النحويين الخطأ في إعراب الكلمة أو تصحيح المفرد، وعند القراء خلل يطرأ على اللفظ فيخل بالمعنى {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13585}."
  en: "Lahn, in lexicon, has several senses: a speech that one listener understands and another does not; an error in grammatical case, or a departure from what is right; shrewdness, as in the saying that one of you may be more eloquent in his argument; and sung or melodious sounds, plural alhan and luhun. Among grammarians it is an error in a word's inflection or in the form of a single word; among readers, a flaw in the sound that disturbs the meaning {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13585}."
  ur: "لحن لغت میں کئی معنی رکھتا ہے: ایسی بات کرنا جو ایک شخص سمجھ جائے اور دوسرا نہ سمجھے؛ اعراب کی غلطی یا درستی سے ہٹنا؛ فطانت، جیسے حدیث میں ہے کہ شاید تم میں سے کوئی اپنی دلیل میں زیادہ فصیح ہو؛ اور دلکش آوازیں، جمع الحان اور لحون۔ نحویوں کے نزدیک کسی کلمے کے اعراب یا واحد کی تصحیح میں غلطی، اور قاریوں کے نزدیک لفظ میں ایسا خلل جو معنی بگاڑ دے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13585}۔"
  es: "Lahn, en el léxico, tiene varios significados: un discurso que un oyente entiende y otro no; un error de caso gramatical o una desviación de lo correcto; astucia, como en decir que uno de vosotros puede ser más elocuente en su argumento; y sonidos cantados o melodiosos, plural alhan y luhun. Entre los gramáticos es un error en la inflexión de una palabra o en la forma de una sola palabra; entre los lectores, una imperfección en el sonido que altera el significado {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13585}."
  fr: "Le terme « lahn », dans le lexique, possède plusieurs sens: un discours incompréhensible pour un auditeur; une erreur de cas grammatical, ou un écart par rapport à la règle; la finesse, comme dans l’expression « l’un d’entre vous est peut-être plus éloquent dans son argumentation »; et des sons chantés ou mélodieux, au pluriel « alhan » et « luhun ». Pour les grammairiens, il s’agit d’une erreur de flexion ou de forme d’un mot; pour les lecteurs, d’un défaut de prononciation qui altère le sens (voir: fiqh-mawsua-kuwaitiyya-noor-v3 p.13585)."
  tr: "Dil hatalarının anlamları vardır: bir kişinin yazarın anladığı ama başkalarından gizlendiği bir şey söylemesi ve doğru görüşte dilbilgisi hatası ve çelişkisi yaşanması. Gelenekte olduğu gibi içgörü için: belki bazılarınız argümanlarında daha yoğundur, yani daha bilinçli ve melodik sesler, çoğul olarak melodiler ve melodilerdir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13585}. Dilbilgisi uzmanlarına göre, kelimenin ayrıştırılmasında veya kelime dağarcığının düzeltilmesinde hatalar olur ve okuyucular arasında telaffuzda anlamı bozan bir kusur oluşur {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13585}."
  id: "Kesalahan dalam bahasa memiliki makna: ketika seseorang mengatakan sesuatu yang dipahami oleh penulis tetapi disembunyikan dari orang lain, dan kesalahan dalam tata bahasa serta kontradiksi dalam pandangan yang benar. Wawasan seperti tradisi: mungkin beberapa dari kalian lebih intens dalam argumen mereka, artinya lebih sadar, dan bunyi melodi, jamak adalah melodi dan melodi {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13585}. Menurut para ahli tata bahasa, kesalahan terjadi dalam mengurai kata atau mengoreksi kosakata, dan di antara pembaca, terjadi cacat dalam pengucapan yang mengganggu makna {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13585}."
