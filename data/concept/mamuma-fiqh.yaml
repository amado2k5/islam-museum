id: concept/mamuma-fiqh
class: concept
kind: legal
label:
  ar: "المَأْمُومَة"
  en: "Mamumah (a head wound reaching the membrane of the brain)"
  ur: "مامومہ (سر کا وہ زخم جو دماغ کی جھلی تک پہنچے)"
summary:
  ar: "المأمومة في اللغة الشجة التي تبلغ أم الرأس، وهي الجلدة التي تجمع الدماغ، ويقال لها آمّة أيضاً، وجمعها أوام ومأمومات {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13782}. والشجة أعم منها، لأن المأمومة واحدة من شجاج الوجه والرأس {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13783}. وذهب الفقهاء إلى أن في المأمومة ثلث الدية، لما ورد في حديث عمرو بن حزم أن النبي قال: «وفي المأمومة ثلث الدية»، وصححه جماعة من العلماء {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13783}. والتفصيل في الديات والشجاج {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13783}."
  en: "Mamumah, in lexicon, is a wound on the head that reaches the membrane which covers the brain; it is also called amma, and its plural is awam or mamumat. Shajja, the general term for head and face wounds, is wider, since the mamumah is one kind of the shajaj of the face and head {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13782-13783}. The jurists hold that the mamumah carries a third of the blood-money, on the report of Amr ibn Hazm that the Prophet said a third of the blood-money is due for the mamumah, a report several scholars have called sound {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13783}. Details are under blood-money and head-wounds {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13783}."
  ur: "مامومہ لغت میں سر کے اس زخم کو کہتے ہیں جو اس جھلی تک پہنچے جو دماغ کو گھیرے ہوئے ہے؛ اسے آمّہ بھی کہا جاتا ہے، اور جمع اوام اور مأمومات ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13782}۔ شجہ اس سے عام ہے، کیونکہ مامومہ چہرے اور سر کے زخموں کی ایک قسم ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13783}۔ فقہاء کے نزدیک مامومہ میں دیت کا ایک تہائی واجب ہے، عمرو بن حزم کی روایت کی بنا پر کہ «مامومہ میں دیت کا تیسرا حصہ ہے»، جسے کئی علماء نے صحیح کہا {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13783}۔ تفصیل دیات اور شجاج کے مادوں میں ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13783}۔"
