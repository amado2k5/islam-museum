label: { ar: "السكون والنوم حول المسهل عند ابن سينا", en: "Rest and sleep around the purgative in the Canon", ur: "مسہل کے گرد سکون اور نیند قانون میں" }
summary:
  ar: "يرى ابن سينا أن من شرب مسهلاً قوياً فالأولى أن ينام عليه قبل عمله فيعمل أجود، وأن الضعيف لا ينام عليه لأن الطبيعة تهضمه، وأنه إذا أخذ الدواء يعمل فلا ينام ولا يتحرك بل يسكن لتشتمل عليه الطبيعة فتعمل فيه {cite:canon-ibn-sina-print-v1 pp.279-280}."
  en: "Ibn Sina holds that after a strong purgative it is better to sleep before it acts, so that it works better, while after a weak one one should not sleep, since nature digests it, and that once it begins to act one should neither sleep nor move but stay still so that nature takes hold of it and works on it {cite:canon-ibn-sina-print-v1 pp.279-280}."
