id: concept/canon-rest-and-sleep-around-the-purgative
class: concept
kind: scientific
label:
  ar: "السكون والنوم حول المسهل عند ابن سينا"
  en: "Rest and sleep around the purgative in the Canon"
  fr: "Repos et sommeil autour du purgatif dans le Canon"
  ur: "مسہل کے گرد سکون اور نیند قانون میں"
  es: "Descansar y dormir alrededor del purgante en el Canon"
summary:
  ar: "يرى ابن سينا أن من شرب مسهلاً قوياً فالأولى أن ينام عليه قبل عمله فيعمل أجود، وأن الضعيف لا ينام عليه لأن الطبيعة تهضمه، وأنه إذا أخذ الدواء يعمل فلا ينام ولا يتحرك بل يسكن لتشتمل عليه الطبيعة فتعمل فيه {cite:canon-ibn-sina-print-v1 pp.279-280}."
  en: "Ibn Sina holds that after a strong purgative it is better to sleep before it acts, so that it works better, while after a weak one one should not sleep, since nature digests it, and that once it begins to act one should neither sleep nor move but stay still so that nature takes hold of it and works on it {cite:canon-ibn-sina-print-v1 pp.279-280}."
  fr: "Selon Ibn Sina, dormir avant l’action d’un purgatif fort l’améliorerait, mais après un faible la nature digérerait le remède ; une fois l’action commencée, ni sommeil ni mouvement, mais repos afin que la nature saisisse le remède et agisse sur lui {cite:canon-ibn-sina-print-v1 pp.279-280}."
  es: "Ibn Sina sostiene que después de un purgante fuerte es mejor dormir antes de que haga efecto, para que funcione mejor, mientras que después de uno débil no se debe dormir, ya que la naturaleza lo digiere, y que una vez que comienza a hacer efecto no se debe dormir ni moverse, sino permanecer quieto para que la naturaleza lo tome y haga efecto {cite:canon-ibn-sina-print-v1 pp.279-280}."
