label:
  ar: الإحسان
  en: Ihsan (excellence in worship)
summary:
  ar: المرتبة الثالثة في حديث جبريل بعد الإسلام والإيمان، وقد عرّفها النبي بأن يعبد الإنسان الله كأنه يراه، فإن لم يكن يراه فإنه يراه.
  en: The third level named in the hadith of Jibril after islam and iman, defined by the Prophet as worshipping God as though you see Him, for even if you do not see Him, He sees you.
