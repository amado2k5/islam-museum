id: concept/ihsan
class: concept
kind: doctrine
label:
  ar: الإحسان
  en: Ihsan (excellence in worship)
summary:
  ar: المرتبة الثالثة في حديث جبريل بعد الإسلام والإيمان، وقد عرّفها النبي بأن يعبد الإنسان الله كأنه يراه، فإن لم يكن يراه فإنه يراه. ويبسط ابن رجب في شرح حديث شداد بن أوس «إن الله كتب الإحسان على كل شيء» معناها من مقام المراقبة في العبادة إلى حكم مكتوب على كل شيء يصل إلى إحسان القتلة والذبحة {cite:ibn-rajab-jami-ulum-hikam p.361-363}، ويبين أن لفظ الكتابة يقتضي الوجوب عند أكثر الفقهاء والأصوليين {cite:ibn-rajab-jami-ulum-hikam p.361}. وورد التعريف في حديث جبريل في صحيح البخاري {cite:sahih-al-bukhari 50}
  en: The third level named in the hadith of Jibril after islam and iman, defined by the Prophet as worshipping God as though you see Him, for even if you do not see Him, He sees you. In his commentary on Shaddad ibn Aws's hadith 'God has prescribed ihsan upon everything' Ibn Rajab extends it from the station of watchful worship to a ruling written upon all things — reaching excellence even in execution and slaughter — noting that the wording of 'writing' entails obligation for most jurists and usul scholars.
