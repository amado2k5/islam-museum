id: concept/ihsan
class: concept
kind: doctrine
label:
  ar: الإحسان
  en: Ihsan (excellence in worship)
  es: "Ihsan (excelencia en la adoración)"
  fr: "Ihsan (excellence dans le culte)"
  ur: "احسان ⁦(عبادت میں فضیلت)⁩"
  tr: "iyilik"
  id: "Kebaikan"
summary:
  ar: المرتبة الثالثة في حديث جبريل بعد الإسلام والإيمان، وقد عرّفها النبي بأن يعبد الإنسان الله كأنه يراه، فإن لم يكن يراه فإنه يراه. ويبسط ابن رجب في شرح حديث شداد بن أوس «إن الله كتب الإحسان على كل شيء» معناها من مقام المراقبة في العبادة إلى حكم مكتوب على كل شيء يصل إلى إحسان القتلة والذبحة {cite:ibn-rajab-jami-ulum-hikam p.361-363}، ويبين أن لفظ الكتابة يقتضي الوجوب عند أكثر الفقهاء والأصوليين {cite:ibn-rajab-jami-ulum-hikam p.361}. وورد التعريف في حديث جبريل في صحيح البخاري {cite:sahih-al-bukhari 50} ويرويه النووي في رياض الصالحين عن عمر بن الخطاب في باب المراقبة بإسناد مسلم، رجل شديد بياض الثياب شديد سواد الشعر لا أثر للسفر عليه جلس إلى النبي فقال «أخبرني عن الإحسان» فقال «أن تعبد الله كأنك تراه فإن لم تكن تراه فإنه يراك» ثم انطلق فإذا هو جبريل «إني أتاكم يعلمكم دينكم» {cite:riyad-salihin 60}
  en: The third level named in the hadith of Jibril after islam and iman, defined by the Prophet as worshipping God as though you see Him, for even if you do not see Him, He sees you. In his commentary on Shaddad ibn Aws's hadith 'God has prescribed ihsan upon everything' Ibn Rajab extends it from the station of watchful worship to a ruling written upon all things — reaching excellence even in execution and slaughter — noting that the wording of 'writing' entails obligation for most jurists and usul scholars. Al-Nawawi transmits it in Riyad al-Salihin from Umar ibn al-Khattab in the chapter on watchfulness with Muslim's isnad — a man in gleaming white garments, dark-haired, showing no sign of travel sat by the Prophet and asked «tell me about ihsan»; he answered «that you worship God as though you see Him, for if you do not see Him, He sees you» — and when he departed it was Jibril — «I have come to teach you your religion» {cite:riyad-salihin 60}
  es: "El tercer nivel nombrado en el hadiz de Jibril después de islam e iman, definido por el Profeta como adorar a Dios como si lo vieras, pues incluso si no lo ves, Él te ve. En su comentario sobre el hadiz de Shaddad ibn Aws 'Dios ha prescrito ihsan sobre todo', Ibn Rajab lo extiende desde el estado de adoración vigilante a una norma escrita sobre todas las cosas, alcanzando la excelencia incluso en la ejecución y la matanza, señalando que la formulación de 'escritura' implica obligación para la mayoría de los juristas y eruditos de usul. Al-Nawawi lo transmite en Riyad al-Salihin de Umar ibn al-Khattab en el capítulo sobre la vigilancia con el isnad de Muslim: un hombre con vestiduras blancas brillantes, de cabello oscuro, sin mostrar señales de viaje, se sentó junto al Profeta y preguntó «háblame de ihsan»; Él respondió: «Que adoréis a Dios como si lo viéramos, pues si no lo veis, Él os ve». Y cuando se marchó, era Jibril quien dijo: «He venido a enseñaros vuestra religión». {cite:riyad-salihin 60}"
  fr: "Le troisième niveau, mentionné dans le hadith de Jibril après l'islam et l'iman, est défini par le Prophète comme le fait d'adorer Dieu comme si on Le voyait, car même si on ne Le voit pas, Il nous voit. Dans son commentaire du hadith de Shaddad ibn Aws « Dieu a prescrit l'ihsan en toute chose », Ibn Rajab l'étend du stade de l'adoration vigilante à une règle inscrite sur toutes choses — atteignant l'excellence même dans l'exécution et l'abattage — notant que le terme « inscrit » implique une obligation pour la plupart des juristes et des spécialistes des usul. Al-Nawawi le transmet dans Riyad al-Salihin d'après Umar ibn al-Khattab dans le chapitre sur la vigilance avec l'isnad de Muslim — un homme vêtu de vêtements blancs éclatants, aux cheveux noirs, ne montrant aucun signe de voyage, était assis près du Prophète et lui a demandé: « Parlez-moi de l'ihsan ». Il répondit: « Que vous adorez Dieu comme si vous Le voyiez, car si vous ne Le voyez pas, Il vous voit. » — et lorsqu'il partit, c'était Jibril — « Je suis venu vous enseigner votre religion. » {cite:riyad-salihin 60}"
  ur: "جبریل کی حدیث میں اسلام اور ایمان کے بعد تیسرے درجے کا نام دیا گیا ہے، جس کی تعریف نبی نے اس طرح کی ہے کہ آپ اللہ کی عبادت کرتے ہیں گویا آپ اسے دیکھ رہے ہیں، کیونکہ اگر آپ اسے نہیں دیکھتے تو بھی وہ آپ کو دیکھ رہا ہے۔ ابن رجب نے شداد بن اوس کی حدیث 'خدا نے ہر چیز پر احسان فرض کیا ہے' کی تفسیر میں اسے چوکسی عبادت کے مقام سے لے کر ہر چیز پر لکھے ہوئے حکم تک بڑھایا ہے - یہاں تک کہ قتل و غارت میں بھی فضیلت تک پہنچتا ہے - یہ نوٹ کرتے ہوئے کہ 'تحریر' کا لفظ زیادہ تر فقہا اور ہم پر فرض ہے۔ النووی نے اسے ریاض الصالحین میں عمر بن الخطاب سے مسلم کی سند کے باب میں نقل کیا ہے - ایک شخص چمکتے ہوئے سفید لباس میں، سیاہ بالوں والا، جس کے پاس سفر کا کوئی نشان نہیں تھا، نبی کے پاس بیٹھا اور پوچھا \"مجھے احسان کے بارے میں بتاؤ\"؛ اس نے جواب دیا: \"تم خدا کی عبادت اس طرح کرتے ہو جیسے تم اسے دیکھ رہے ہو، کیونکہ اگر تم اسے نہیں دیکھ رہے تو وہ تمہیں دیکھ رہا ہے\" - اور جب وہ چلا گیا تو جبرائیل تھے - \"میں تمہیں تمہارا دین سکھانے آیا ہوں\" ⁦(ریاض صالحین 60)⁩"
  tr: "Cebrail hadislerinde İslam ve inançtan sonra üçüncü sıradadır; Peygamber, Tanrı'yı görüyormuş gibi ibadet eden kişi olarak tanımlamıştır; Onu görmüyorsa görür. İbn Receb, Şeddad bin Ovs'un hadisini şöyle açıklar: \"Gerçekten Allah her şey için mükemmellik belirlemiştir\"; bu, ibadette uyanıklık noktasından katillerin ve katliamların mükemmelliğine ulaşan her şeye yazılı bir hükmü vermeye kadar her şey için belirlenmiştir {cite:ibn-rajab-jami-ulum-hikam s.361-363} ve 'yazı' kelimesinin çoğu fıkh ve usul âlimine göre zorunluluk anlamına geldiğini açıklar {cite:ibn-rajab-jami-ulum-hikam s.361}. Tanım, Cebrail'in Sahih al-Bukhari'deki hadisinde bulunur {cite:sahih-al-bukhari 50} ve Riyad al-Salihin'de al-Nawawi tarafından, Ömer bin al-Khattab'ın gözlem bölümünde, Müslüman zinciriyle anlatılır: çok soluk giysili, çok siyah saçlı, seyahat izi olmayan bir adam. Peygamber'in yanına oturdu ve dedi ki, \"Bana mükemmellikten bahset.\" Dedi ki, \"Allah'ı görüyormuş gibi ibadet et; görmüyorsan o seni görür.\" Sonra yola çıktı ve bu Gabriel'di: \"Sana dinini öğretmeye geldim.\" {cite:riyad-salihin 60}"
  id: "Peringkat ketiga dalam hadis Gabriel setelah Islam dan iman, yang didefinisikan Nabi sebagai seseorang yang menyembah Allah seolah-olah melihat-Nya; jika dia tidak melihat-Nya, maka dia melihat-Nya. Ibn Rajab menjelaskan hadis Shaddad ibn Aws: \"Sesungguhnya, Allah telah menetapkan keunggulan untuk segala hal\" yang berarti dari kewaspadaan dalam ibadah hingga putusan tertulis atas segala sesuatu yang mencapai keunggulan pembunuh dan pembantaian {cite:ibn-rajab-jami-ulum-hikam hlm.361-363}, dan menjelaskan bahwa kata 'menulis' mengandung kewajiban menurut sebagian besar ahli hukum dan ulama usul {cite:ibn-rajab-jami-ulum-hikam hlm.361}. Definisi ini ditemukan dalam hadits Gabriel dalam Sahih al-Bukhari {cite:sahih-al-bukhari 50}, dan diceritakan oleh al-Nawawi dalam Riyadh al-Salihin, dari Umar ibn al-Khattab dalam bab observasi, dengan rantai Muslim: seorang pria berpakaian sangat pucat, berambut sangat hitam, tanpa jejak perjalanan. Dia duduk bersama Nabi dan berkata, \"Ceritakan padaku tentang keunggulan.\" Dia berkata, \"Beribadah kepada Allah seolah-olah kamu melihat-Nya; jika tidak, maka dia melihatmu.\" Kemudian dia berangkat, dan itu adalah Gabriel: \"Aku datang untuk mengajarkan agamamu.\" {cite:riyad-salihin 60}"
