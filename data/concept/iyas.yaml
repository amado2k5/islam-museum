label: { ar: "الإياس", en: "Iyas (despair; the end of menstruation through age and its effect on the waiting period, clothing and divorce; and the prohibition of despairing of God's mercy)" }
summary:
  ar: "الإياس لغة انقطاع الرجاء والطمع، واستعمله الفقهاء بمعنيين: انقطاع الحيض بسبب الكبر، وانقطاع الرجاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3692}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3693} والآيسة من الحيض تعتد بثلاثة أشهر، وتطلق طلاقا سنيا عند الحنفية، ولها رخصة في وضع الجلباب دون تبرج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3695}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3696} واختلف الفقهاء في سن الإياس: قيل خمسون، وقيل خمس وخمسون، وقيل ستون، وقيل تحدد بأيام نساء العشيرة، وعند المالكية والحنابلة حدان: أدنى خمسون وأعلى سبعون عند المالكية وستون عند أحمد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3694}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3695} وقطع الحيض بمرض أو رضاع لا يعد إياسا حتى تبلغ السن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3696} والإياس من رحمة الله حرام، وقد عده العلماء من الكبائر، والتوبة لليائس من الحياة مقبولة عند بعضهم لا الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3696}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3697}"
  en: "Iyas in lexical sense is the cutting off of hope and desire; the jurists use it in two senses: the end of menstruation through age, and the cutting off of hope. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3692}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3693} A woman past menstruation observes a waiting period of three months and her divorce is in the sunna form for the Hanafis; she has a licence to uncover her outer garment without display. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3695}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3696} The jurists differ on the age of iyas: fifty, fifty-five or sixty, or the practice of the women of her clan, and the Malikis and Hanbalis have a least and a greatest age. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3694}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3695} A cessation of menstruation caused by illness or suckling is not iyas until the age is reached. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3696} Despair of God's mercy is forbidden and counted among the grave sins by the scholars, and the repentance of one who despairs of life is refused by the majority but accepted by some Hanafis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3696}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3697}"
