label: { ar: "الإياس", en: "Iyas (despair; the end of menstruation through age and its effect on the waiting period, clothing and divorce; and the prohibition of despairing of God's mercy)", es: "Iyas (desesperación; el fin de la menstruación por la edad y su efecto en el período de espera, la vestimenta y el divorcio; y la prohibición de desesperar de la misericordia de Dios)", fr: "Iyas (désespoir; la fin des menstruations avec l'âge et son effet sur la période d'attente, les vêtements et le divorce; et l'interdiction de désespérer de la miséricorde de Dieu)", ur: "ایاس ⁦(مایوسی؛ عمر کے ساتھ حیض کا خاتمہ اور عدت، لباس اور طلاق پر اس کا اثر؛ اور خدا کی رحمت سے مایوس ہونے کی ممانعت)⁩", tr: "menopoz", id: "menopause" }
summary:
  ar: "الإياس لغة انقطاع الرجاء والطمع، واستعمله الفقهاء بمعنيين: انقطاع الحيض بسبب الكبر، وانقطاع الرجاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3692}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3693} والآيسة من الحيض تعتد بثلاثة أشهر، وتطلق طلاقا سنيا عند الحنفية، ولها رخصة في وضع الجلباب دون تبرج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3695}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3696} واختلف الفقهاء في سن الإياس: قيل خمسون، وقيل خمس وخمسون، وقيل ستون، وقيل تحدد بأيام نساء العشيرة، وعند المالكية والحنابلة حدان: أدنى خمسون وأعلى سبعون عند المالكية وستون عند أحمد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3694}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3695} وقطع الحيض بمرض أو رضاع لا يعد إياسا حتى تبلغ السن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3696} والإياس من رحمة الله حرام، وقد عده العلماء من الكبائر، والتوبة لليائس من الحياة مقبولة عند بعضهم لا الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3696}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3697}"
  en: "Iyas in lexical sense is the cutting off of hope and desire; the jurists use it in two senses: the end of menstruation through age, and the cutting off of hope. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3692}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3693} A woman past menstruation observes a waiting period of three months and her divorce is in the sunna form for the Hanafis; she has a licence to uncover her outer garment without display. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3695}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3696} The jurists differ on the age of iyas: fifty, fifty-five or sixty, or the practice of the women of her clan, and the Malikis and Hanbalis have a least and a greatest age. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3694}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3695} A cessation of menstruation caused by illness or suckling is not iyas until the age is reached. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3696} Despair of God's mercy is forbidden and counted among the grave sins by the scholars, and the repentance of one who despairs of life is refused by the majority but accepted by some Hanafis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3696}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3697}"
  es: "Iyas en sentido léxico es el corte de la esperanza y el deseo; los juristas lo usan en dos sentidos: el fin de la menstruación por la edad y el corte de la esperanza. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3692}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3693} Una mujer que ha pasado la menstruación observa un período de espera de tres meses y su divorcio es en la forma sunna para los hanafíes; tiene licencia para descubrir su vestimenta exterior sin exhibirla. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3695}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3696} Los juristas difieren en la edad de iyas: cincuenta, cincuenta y cinco o sesenta, o la práctica de las mujeres de su clan, y los malikíes y hanbalíes tienen una edad mínima y máxima. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3694}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3695} Una cesación de la menstruación causada por enfermedad o lactancia no es iyas hasta que se alcanza la edad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3696} La desesperación de la misericordia de Dios está prohibida y se considera uno de los pecados graves según los eruditos, y el arrepentimiento de quien pierde la esperanza en la vida es rechazado por la mayoría, pero aceptado por algunos hanafíes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3696}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3697}"
  fr: "Le terme « iyas », au sens littéral, désigne la perte de l'espoir et du désir. Les juristes l'emploient dans deux sens: la fin des menstruations liée à l'âge et la perte de l'espoir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3692}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3693} Une femme ménopausée observe un délai de réflexion de trois mois et son divorce est prononcé selon la sunna pour les hanafites; elle est autorisée à se découvrir sans ostentation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3695}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3696} Les juristes divergent quant à l'âge de la puberté (iyas): cinquante, cinquante-cinq ou soixante ans, ou encore selon la pratique des femmes de leur clan. Les écoles malikite et hanbalite distinguent un âge minimum et un âge maximum. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3694}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3695} L'arrêt des menstruations dû à une maladie ou à l'allaitement n'est pas considéré comme une puberté (iyas) avant que l'âge requis ne soit atteint. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3696} Le désespoir en la miséricorde divine est interdit et considéré comme un péché grave par les savants. Le repentir de celui qui désespère de la vie est rejeté par la majorité, mais accepté par certains hanafites. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3696}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3697}"
  ur: "لغوی معنوں میں عیاس امید اور خواہش کو ختم کرنا ہے۔ فقہاء اسے دو معنوں میں استعمال کرتے ہیں: عمر کے ساتھ حیض کا خاتمہ، اور امید کا خاتمہ۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3692}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3693} حیض سے گزرنے والی عورت کی تین ماہ کی عدت ہے اور اس کی طلاق احناف کے نزدیک سنت ہے۔ اس کے پاس بغیر ڈسپلے کے اپنے بیرونی لباس کو ننگا کرنے کا لائسنس ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3695}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3696} فقہا کا ایاس کی عمر کے بارے میں اختلاف ہے: پچاس، پچپن یا ساٹھ، یا عمل کے لحاظ سے، کم سے کم عمر اور حنبلی اور حنبلی عورتیں ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3694}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3695} بیماری یا دودھ پلانے کی وجہ سے حیض کا بند ہونا اس وقت تک عیّس نہیں ہے جب تک کہ عمر پوری نہ ہو جائے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 3696} خدا کی رحمت سے مایوسی کو علماء نے حرام اور کبیرہ گناہوں میں شمار کیا ہے اور زندگی سے مایوس ہونے والے کی توبہ کو جمہور نے رد کیا ہے لیکن بعض احناف نے اسے قبول کیا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3696}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3697}"
  tr: "Wasad, umudun ve açgözlülüğün sona ermesi dilsel anlamıdır ve hukukçular bunu iki anlamda kullanmıştır: yaşlılık nedeniyle adet döneminin durması ve umudun sona ermesi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3692} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3693} Adet süresini kaybeden bir kadın, üç ay bekleme süresine uyar ve Sünni boşanmasıyla boşanır, süssüz cülbab takmasına izin verilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3695} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3696} Hukukçular adet yaşı konusunda farklı görüşlere sahiptir: elli denir, bazıları elli beş, bazıları altmış der, bazıları ise kabile kadınlarının günleriyle belirlenir. Maliki ve Hanbalilere göre iki sınır vardır: Malikilere göre en düşük elli ve en yüksek yetmiş, Ahmad'a göre ise altmış. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3694} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3695} ve hastalık veya emzirme nedeniyle adet kesilmesi menopoz olarak kabul edilmez, ta ki yaşa ulaşana kadar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3696} Allah'ın merhametinden umutsuzluk yasaktır ve alimler bunu en büyük günahlar arasında görmüştür. Hayattan umutsuzluğa kapılanların tövbesi, çoğunluk tarafından değil, bazıları tarafından kabul edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3696} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3697}"
  id: "Wasad adalah makna linguistik dari pengakhiran harapan dan keserakahan, dan para ahli hukum telah menggunakannya dalam dua makna: berhenti menstruasi karena usia tua, dan pengakhiran harapan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3692} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3693} Seorang wanita yang kehilangan menstruasi menjalani masa tunggu selama tiga bulan, dan dia diceraikan oleh perceraian Sunni menurut Hanafi, dan dia diperbolehkan mengenakan jilbab tanpa hiasan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3695} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3696} Para ahli hukum berbeda pendapat mengenai usia menstruasi: dikatakan lima puluh, beberapa mengatakan lima puluh lima, beberapa mengatakan enam puluh, dan beberapa mengatakan ditentukan oleh hari wanita suku. Menurut Malikis dan Hanbali, ada dua batas: lima puluh terendah dan tujuh puluh tertinggi menurut Maliki, dan enam puluh menurut Ahmad. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.3694} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3695} dan penghentian menstruasi karena sakit atau menyusui tidak dianggap menopause sampai mencapai usia lanjut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3696} Keputusasaan akan rahmat Allah adalah hal yang dilarang, dan para ulama menganggapnya sebagai salah satu dosa besar. Taubat bagi mereka yang putus asa akan hidup diterima oleh sebagian orang, bukan oleh mayoritas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3696} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3697}"
