label:
  ar: "يَسَار"
  en: "Yasar (means and ease, fiqh)"
summary:
  ar: "اليسار في اللغة الغنى والسعة، وضده العسر، ويطلق على الجارحة أخت اليمين. وأحكامه في الفقه: طلب اليسار مشروع، وهو معتبر في الكفاءة وفي قدر النفقة وفي الكفارات المرتبة، وحده في الزكاة وفي نفقة الزوج والأقارب مختلف فيه بين المذاهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17991}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17995}"
  en: "Yasar is wealth and ease, its opposite being hardship; it also names the left side. Its rulings in fiqh cover seeking means, its weight in kafa'a, in the amount of maintenance and in the ordered expiations, and its limits for zakat and for the maintenance of a wife and relatives, which the schools set differently. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17991}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17995}"
  ur: "یسار کے لغوی معنی مال اور وسعت کے ہیں، اور اس کے احکام میں طلبِ رزق، کفاءت، نفقہ اور کفارات میں اس کا اثر، اور زکوٰۃ و نفقہ کی حد پر فقہی اختلاف شامل ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17991}"
