summary:
  ar: "القيصوم في الكتاب حار في الأولى يابس في الثالثة لطيف مر، ينفع من الأورام البلغمية وعرق النسا والنافض وعسر النفس الانتصابي ويطرد الهوام، ويذكر الكتاب فيه أيضا قولا في الطمث والجنين والرحم {cite:canon-ibn-sina-print-v1 p.655}"
  en: "Qaysum is in the book hot in the first degree and dry in the third, subtle and bitter; it benefits phlegmatic swellings, sciatica, rigors and orthopnoea and drives off vermin; the book also lists claims on it concerning the menses, the foetus and the womb {cite:canon-ibn-sina-print-v1 p.655}"
  ur: "قیصوم کتاب میں پہلے درجے میں گرم اور تیسرے میں خشک، لطیف اور کڑوا ہے؛ بلغمی ورموں، عرق النسا، کپکپی اور دمے کی سی دشوار سانس میں نافع ہے اور زہریلے کیڑوں کو بھگاتا ہے؛ کتاب حیض، جنین اور رحم کے بارے میں بھی اس کے متعلق اقوال درج کرتی ہے {cite:canon-ibn-sina-print-v1 p.655}۔"
  es: "En el libro, Qaysum es caliente en primer grado y seco en tercero, sutil y amargo; beneficia las hinchazones flemáticas, la ciática, los escalofríos y la ortopnea, y ahuyenta los parásitos; el libro también enumera afirmaciones sobre él con respecto a la menstruación, el feto y el útero {cite:canon-ibn-sina-print-v1 p.655}"
