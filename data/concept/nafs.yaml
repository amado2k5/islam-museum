label: { ar: "النَّفْس", en: "Nafs (self, soul, blood)", ur: "نفس (جان، روح، خون)" }
summary:
  ar: "النفس في اللغة تطلق على الروح، والدم، وذات الشيء وعينه، والعين، والنَّفَس بفتحتين نسيم الهواء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15857} وعند الجرجاني أن النفس جوهر لطيف يحمل قوة الحياة والحس والحركة، واليقظة والنوم والموت درجات تنقطع فيها أضواؤها عن الجسد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15857} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15858} وما لا نفس له سائلة، كالذباب والبعوض، يُعفى عنه في النجاسة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15858} وقتل النفس بغير حق من الكبائر، وتوبة القاتل عمداً مقبولة عند جمهور الفقهاء، وخالف ابن عباس وزيد بن ثابت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15859} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15860} وقتل النفس منتحراً من الكبائر ويستحق صاحبه العقوبة من الله تعالى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15858} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15859}"
  en: "Nafs, in the lexicon, is the soul or spirit, blood, the self or essence of a thing, and the eye; nafas is a breath of air. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15857} Al-Jurjani defines the soul as a subtle substance that carries life, sensation and voluntary movement; waking, sleep and death are its states, in which its light is cut off from the body in whole or in part. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15857} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15858} Creatures with no flowing blood, such as flies and mosquitoes, are excused from impurity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15858} Killing a soul without right is a major sin, and the jurists agree that suicide is a grave offence; repentance of a wilful unlawful killer is accepted by most jurists, though Ibn Abbas and Zayd ibn Thabit disagreed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15858} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15859} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15860}"
  ur: "نفس لغت میں روح، خون، کسی چیز کی ذات اور عین کو کہتے ہیں، اور نفَس ہوا کے جھونکے کو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15857} جرجانی کے نزدیک نفس ایک لطیف جوہر ہے جو زندگی، حس اور ارادی حرکت کو اٹھاتا ہے، اور بیداری، نیند اور موت اس کی حالتیں ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15857} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15858} جس جانور میں بہنے والا خون نہ ہو، جیسے مکھی اور مچھر، اس کی نجاست معاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15858} ناحق قتل کبیرہ گناہ ہے، اور جمہور کے نزدیک عمداً قتل کرنے والے کی توبہ قبول ہے، جبکہ ابن عباس اور زید بن ثابت نے اختلاف کیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15859} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15860}"
