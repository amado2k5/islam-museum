label:
  ar: "أثبر باريس"
  en: "Athbar barisi (barberry)"
  fr: "Athbar barisi (épine-vinette)"
  ur: "اثبر باریس ⁦(زرشک)⁩"
  es: "Athbar barisi (agracejo)"
  tr: "Büyük Paris"
  id: "Paris Raya"
summary:
  ar: "أثبر باريس هو الزرشك؛ قامع للصفراء، وينفع من الأورام الحارة وسيلان الرحم المزمن، ويذكر الكتاب ما ينسب إليه من إسقاط الحمل، وهو ما ورد في الكتاب لا توصية به {cite:canon-ibn-sina-print-v1 p.359} {cite:canon-ibn-sina-print-v1 p.360}."
  en: "Athbar barisi is barberry. It suppresses yellow bile and helps hot swellings and long-standing uterine discharge. The book also states that it expels a foetus; this is the book's listing, not a recommendation {cite:canon-ibn-sina-print-v1 p.359} {cite:canon-ibn-sina-print-v1 p.360}."
  fr: "Athbar barisi est l’épine-vinette. Elle réprime la bile jaune et aide contre les gonflements chauds et les écoulements utérins anciens. Le livre affirme aussi qu’elle expulse un fœtus ; il s’agit d’une énumération du livre, non d’une recommandation {cite:canon-ibn-sina-print-v1 p.359} {cite:canon-ibn-sina-print-v1 p.360}."
  ur: "اثبر باریس زرشک ہے؛ یہ زرد پت کو دباتا ہے، گرم سوجن اور رحم کے پرانے بہاؤ میں فائدہ دیتا ہے۔ کتاب میں لکھا ہے کہ یہ حمل گراتا ہے؛ یہ کتاب کی فہرست ہے، کوئی سفارش نہیں {cite:canon-ibn-sina-print-v1 p.359} {cite:canon-ibn-sina-print-v1 p.360}۔"
  es: "Athbar barisi es agracejo. Suprime la bilis amarilla y ayuda con las hinchazones calientes y el flujo uterino prolongado. El libro también afirma que expulsa un feto; esto es lo que dice el libro, no una recomendación {cite:canon-ibn-sina-print-v1 p.359} {cite:canon-ibn-sina-print-v1 p.360}."
  tr: "Thibaar Paris berberdir; safrayı baskılar, sıcak tümörler ve kronik rahim kanaması için faydalıdır ve kitapta düşük için atfedilen şeylerden bahsedilir, ancak bu {cite:canon-ibn-sina-print-v1 s.359} {cite:canon-ibn-sina-print-v1 s.360} kitabında önerilmez."
  id: "Thibaar Paris adalah tukang cukur; ia menekan empedu, bermanfaat untuk tumor panas dan perdarahan rahim kronis, dan buku ini menyebutkan apa yang dikaitkan dengan keguguran, yang tidak direkomendasikan dalam buku {cite:canon-ibn-sina-print-v1 hlm.359} {cite:canon-ibn-sina-print-v1 hlm.360}."
