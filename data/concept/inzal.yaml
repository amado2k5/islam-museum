label: { ar: "الإنزال", en: "Inzal (emission of seminal fluid and its legal effects)", es: "Inzal (emisión de líquido seminal y sus efectos legales)", fr: "Inzal (émission de liquide séminal et ses effets juridiques)" }
summary:
  ar: "الإنزال لغة الانحدار من علو إلى سفل، ويطلق في الفقه على خروج ماء الرجل أو المرأة بجماع أو احتلام أو غيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3470} ويختلف حكمه بحسب موضعه: فهو حلال في النكاح والملك، وحرام في غيرهما، وحرام في نهار رمضان وللمحرم وفي الاعتكاف الواجب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3471} ويوجب الغسل إذا كان على وجه الدفق والشهوة، ويفرق الفقهاء بين الرجل والمرأة في ما يتحقق به خروجه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3472}"
  en: "Inzal in the lexical sense is coming down from height; in fiqh it is the emission of a man's or a woman's fluid, by intercourse, by dream or otherwise. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3470} Its ruling depends on the setting: lawful within marriage or lawful possession, unlawful outside them, and unlawful during the day of Ramadan, for one in ihram, and in obligatory i'tikaf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3471} It requires washing when it comes with gushing and desire, and the jurists differ on what establishes it in a woman. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3472}"
  es: "Inzal, en sentido léxico, significa descender desde una altura; en fiqh, se refiere a la emisión de fluidos corporales de un hombre o una mujer, ya sea por relaciones sexuales, sueños u otras causas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3470} Su dictamen depende del contexto: es lícito dentro del matrimonio o la posesión lícita, ilícito fuera de ellos e ilícito durante el día de Ramadán, para quien se encuentra en ihram y en i'tikaf obligatorio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3471} Requiere lavado cuando se presenta con abundante flujo y deseo, y los juristas difieren en cuanto a qué lo constituye en una mujer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3472}"
  fr: "Inzal, au sens littéral, signifie « descendre d'une hauteur »; en fiqh, il désigne l'émission d'un fluide masculin ou féminin, par rapport sexuel, par rêve ou autrement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3470} Son statut dépend du contexte: licite dans le cadre du mariage ou de la possession licite, illicite en dehors de ceux-ci, et illicite le jour du Ramadan, pour la personne en état d'ihram, et pendant l'i'tikaf obligatoire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3471} Il requiert une purification lorsque l'éjaculation est abondante et accompagnée de désir, et les juristes divergent quant aux critères qui la caractérisent chez la femme. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3472}"
