label: { ar: "الإنزال", en: "Inzal (emission of seminal fluid and its legal effects)" }
summary:
  ar: "الإنزال لغة الانحدار من علو إلى سفل، ويطلق في الفقه على خروج ماء الرجل أو المرأة بجماع أو احتلام أو غيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3470} ويختلف حكمه بحسب موضعه: فهو حلال في النكاح والملك، وحرام في غيرهما، وحرام في نهار رمضان وللمحرم وفي الاعتكاف الواجب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3471} ويوجب الغسل إذا كان على وجه الدفق والشهوة، ويفرق الفقهاء بين الرجل والمرأة في ما يتحقق به خروجه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3472}"
  en: "Inzal in the lexical sense is coming down from height; in fiqh it is the emission of a man's or a woman's fluid, by intercourse, by dream or otherwise. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3470} Its ruling depends on the setting: lawful within marriage or lawful possession, unlawful outside them, and unlawful during the day of Ramadan, for one in ihram, and in obligatory i'tikaf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3471} It requires washing when it comes with gushing and desire, and the jurists differ on what establishes it in a woman. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3472}"
