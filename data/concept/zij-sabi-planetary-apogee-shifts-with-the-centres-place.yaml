class: concept
kind: scientific
label: { ar: "تحوّل البعد الكوكبي بحسب موضع مركز فلك التدوير", en: "The planet's apogee shifts with the place of the epicycle centre", ur: "سیارے کا بُعد مرکزِ تدویر کے مقام کے ساتھ بدلتا ہے", es: "El apogeo del planeta se desplaza con la posición del centro del epiciclo.", fr: "L'apogée de la planète se déplace en fonction de la position du centre de l'épicycle.", tr: "Gezegenler arasındaki mesafe, episiklusun merkezinin konumuna göre değişir.", id: "Jarak antarplanet bergeser sesuai dengan posisi pusat epikikel." }
summary:
  ar: "إذا كان مركز فلك التدوير بين نقطتين من الفلك الخارج أقل من نصف دائرته، صار موضع البعد الأبعد الحقيقي للكوكب مختلفاً عن البعد الأوسط؛ فيزيد الموضع الحقيقي على الأوسط أو ينقص بحسب موضع المركز. {cite:zij-sabi-nallino-byblion p.97}."
  en: "When the epicycle's centre lies between two points of the eccentric and less than half of its circle, the true far point of the planet differs from the mean one; the true place is then above or below the mean, depending on where the centre is. {cite:zij-sabi-nallino-byblion p.97}."
  ur: "جب فلکِ تدویر کا مرکز خارج المرکز کے دو نقطوں کے درمیان، اس کے نصف دائرے سے کم فاصلے پر ہو، تو سیارے کا حقیقی بُعدِ اَبعد اوسط سے مختلف ہو جاتا ہے؛ پھر حقیقی مقام مرکز کی جگہ کے لحاظ سے اوسط سے زیادہ یا کم ہوتا ہے۔ {cite:zij-sabi-nallino-byblion p.97}۔"
  es: "Cuando el centro del epiciclo se encuentra entre dos puntos de la excéntrica y a menos de la mitad de su circunferencia, el verdadero punto lejano del planeta difiere del punto medio; el lugar verdadero se encuentra entonces por encima o por debajo del punto medio, dependiendo de dónde se encuentre el centro. {cite:zij-sabi-nallino-byblion p.97}."
  fr: "Lorsque le centre de l'épicycle se situe entre deux points de l'excentrique et à moins de la moitié de son cercle, le point le plus éloigné de la planète diffère du point moyen; le point le plus éloigné se trouve alors au-dessus ou en dessous du point moyen, selon la position du centre. {cite:zij-sabi-nallino-byblion p.97}."
  tr: "En dıştaki kürenin iki noktası arasındaki episiklinin merkezi, çevresinin yarısından daha küçükse, gezegenin gerçek en uzak mesafesinin konumu, ortalama mesafesinden farklı olacaktır; gerçek konum, merkezin konumuna bağlı olarak ortalamadan daha büyük veya daha küçük olacaktır. {cite:zij-sabi-nallino-byblion s.97}."
  id: "Jika pusat epikikel di antara dua titik bola terluar kurang dari setengah kelilingnya, posisi jarak terjauh sebenarnya dari planet akan berbeda dari jarak rata-ratanya; posisi sebenarnya akan lebih besar atau lebih kecil dari rata-rata tergantung pada posisi pusatnya. {cite:zij-sabi-nallino-byblion p.97}."
