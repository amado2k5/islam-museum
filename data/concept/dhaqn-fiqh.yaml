label:
  ar: "الذقن ⁦(في الفقه)⁩"
  en: "Chin (dhaqn) in the rulings of ablution and of diya"
  ur: "ٹھوڑی ⁦(وضو اور دیت کے احکام میں)⁩"
  es: "Chin (dhaqn) en las normas de ablución y de diya"
  fr: "Chin (dhaqn) dans les règles relatives aux ablutions et à la diya"
  tr: "Çene (hukukta)"
  id: "Dagu (dalam yurisprudensi)"
summary:
  ar: "الذقن في اللغة مجتمع اللحيين من أسفلهما، ويطلق على الوجه كله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8422} الذقن من الوجه فيجب غسله في الوضوء، ويجب غسل ظاهر اللحية الكثيفة دون باطنها، ويجب غسل البشرة إن كانت اللحية خفيفة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8423} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8424} وفي اللحيين عند الشافعية والحنابلة دية كاملة إن قلعا معا، ونصفها في أحدهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8424}"
  en: "The dhaqn in the lexicon is the joint of the two lower jaw-bones on which the lower teeth grow, and it is used for the whole face. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8422} The chin is part of the face and must be washed in ablution: where the beard is thin the skin beneath must be washed, and where it is thick the outer hair must be washed but not the skin beneath. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8423} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8424} For the two jaw-bones the Shafi'is and Hanbalis set a full diya if both are removed and half for one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8424}"
  ur: "ٹھوڑی لغت میں نچلے جبڑوں کے جوڑ کو کہتے ہیں، اور وضو میں چہرے کا حصہ ہے جسے دھونا واجب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8422} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8423}"
  es: "El dhaqn en el léxico es la articulación de los dos huesos de la mandíbula inferior sobre la que crecen los dientes inferiores, y se usa para todo el rostro. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8422} El mentón es parte del rostro y debe lavarse en la ablución: donde la barba es fina, se debe lavar la piel debajo, y donde es espesa, se debe lavar el vello externo pero no la piel debajo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8423} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8424} Para los dos huesos de la mandíbula, los shafi'ís y los hanbalíes establecen una diya completa si se extraen ambos y media si se extrae uno. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8424}"
  fr: "Dans le lexique, le dhaqn désigne l'articulation des deux os de la mâchoire inférieure sur laquelle poussent les dents du bas; il est utilisé pour l'ensemble du visage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8422} Le menton fait partie du visage et doit être lavé lors des ablutions: si la barbe est fine, la peau en dessous doit être lavée; si elle est épaisse, seuls les poils extérieurs doivent être lavés. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8423} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8424} Pour les deux os de la mâchoire, les écoles shafi'ite et hanbalite utilisent une diya complète si les deux sont retirés, et une demi-diya si l'un d'eux est retiré. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8424}"
  tr: "Dilde çene, sakalın altından toplanmasını ifade eder ve tüm yüzü ifade eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8422} Çene yüzden alınır ve abdest alma sırasında yıkanmalıdır. Kalın sakalın dış kısmı yıkanmalı, iç kısmı yıkanmamalıdır ve sakal hafifse deri yıkanmalıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8423} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8424} Şafi'ler ve Hanbali'lere göre iki sakal hakkında, kan parası bir arada toplanırsa dolu olur ve yarısı birinde bulunur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8424}"
  id: "Dalam bahasa, dagu merujuk pada kumpulan janggut dari bawahnya, dan merujuk pada seluruh wajah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8422} Dagu berasal dari wajah dan harus dicuci saat wudhu. Bagian luar janggut tebal harus dicuci tapi tidak bagian dalam, dan kulit harus dicuci jika janggutnya ringan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8423} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8424} Dan mengenai dua janggut menurut Shafi'i dan Hanbali, uang darah penuh jika digabungkan, dan setengahnya ada di salah satunya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8424}"
