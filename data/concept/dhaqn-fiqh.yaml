id: concept/dhaqn-fiqh
class: concept
kind: legal
label:
  ar: "الذقن (في الفقه)"
  en: "Chin (dhaqn) in the rulings of ablution and of diya"
  ur: "ٹھوڑی (وضو اور دیت کے احکام میں)"
summary:
  ar: "الذقن في اللغة مجتمع اللحيين من أسفلهما، ويطلق على الوجه كله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8422} الذقن من الوجه فيجب غسله في الوضوء، ويجب غسل ظاهر اللحية الكثيفة دون باطنها، ويجب غسل البشرة إن كانت اللحية خفيفة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8423} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8424} وفي اللحيين عند الشافعية والحنابلة دية كاملة إن قلعا معا، ونصفها في أحدهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8424}"
  en: "The dhaqn in the lexicon is the joint of the two lower jaw-bones on which the lower teeth grow, and it is used for the whole face. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8422} The chin is part of the face and must be washed in ablution: where the beard is thin the skin beneath must be washed, and where it is thick the outer hair must be washed but not the skin beneath. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8423} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8424} For the two jaw-bones the Shafi'is and Hanbalis set a full diya if both are removed and half for one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8424}"
  ur: "ٹھوڑی لغت میں نچلے جبڑوں کے جوڑ کو کہتے ہیں، اور وضو میں چہرے کا حصہ ہے جسے دھونا واجب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8422} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8423}"
