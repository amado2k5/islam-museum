label: { ar: "الجساسة", en: "al-Jassasa", fr: "Al-Jassasa", es: "al-Jassasa", ur: "الجساسہ", tr: "casusluk", id: "spionase" }
summary:
  ar: "في رواية تميم الداري عند المسعودي ركب البحر في جماعة من بني عمه فأضل بهم وألقاهم إلى جزيرة فنظروا إلى دابة عظيمة قد نشرت شعرها فقالت أنا الجساسة التي أخرج آخر الزمان ودلتهم على قصر فيه رجل مسلسل بالحديد إلى عمود خاطبهم وقال إنه الدجال وأخبرهم بجمل من الملاحم وأنه لا يدخل مدينة النبي {cite:muruj-al-dhahab p. 530-531}."
  en: "The long-haired beast of Tamim al-Dari's island — 'I am the Jassasa that comes out at the end of time' — directing the castaways to the palace where a man chained in iron called himself the Dajjal and foretold the final wars {cite:muruj-al-dhahab p. 530-531}."
  fr: "La bête à la longue chevelure de l’île de Tamim al-Dari — « Je suis la Jassasa qui sort à la fin des temps » — conduit les naufragés au palais où un homme enchaîné par des fers se fait appeler le Dajjal et prédit les dernières guerres {cite:muruj-al-dhahab p. 530-531}."
  es: "La bestia de pelo largo de la isla de Tamim al-Dari —'Soy el Jassasa que aparece al final de los tiempos'— dirigiendo a los náufragos al palacio donde un hombre encadenado con hierro se hacía llamar el Dajjal y predijo las guerras finales {cite:muruj-al-dhahab p. 530-531}."
  ur: "تمیم الداری کے جزیرے کا لمبے بالوں والا حیوان - 'میں وہ جسسہ ہوں جو وقت کے آخر میں نکلتا ہے' - قلعوں کو اس محل کی طرف لے جاتا ہے جہاں لوہے میں جکڑے ہوئے ایک شخص نے خود کو دجال کہا اور آخری جنگوں کی پیشین گوئی کی۔ 530-531}۔"
  tr: "Tamim el-Dari'nin anlatımında, el-Mes'udi kuzenleriyle birlikte denizde yelken açtı, onları yanlış yola sürükledi ve bir adaya attı. Büyük bir canavarın saçlarını açtığını gördüler. Kadın dedi ki, 'Ben kıyameti ortaya çıkaran ve onlara demir bir direğe zincirlenmiş bir adamın olduğu bir sarayı gösteren casusum. Onlara hitap etti ve kendisinin Deccal olduğunu, bazı destanları anlattığını ve Peygamber'in şehrine girmeyeceğini söyledi. {atıf:Muruj-al-Dhahab s. 530-531} dedi."
  id: "Menurut catatan Tamim al-Dari, al-Mas'udi berlayar di laut bersama sepupunya, menyesatkan mereka, dan melempar mereka ke sebuah pulau. Mereka melihat seekor binatang besar mengurai rambutnya. Wanita itu berkata, 'Akulah mata-mata yang mengungkapkan kiamat dan menunjukkan kepada mereka sebuah istana di mana seorang pria dirantai pada tiang besi. Dia berbicara kepada mereka dan mengatakan bahwa dia adalah Antikristus, menceritakan beberapa epik, dan tidak akan memasuki kota Nabi. {atribusi: Muruj-al-Dhahab hlm. 530-531} katanya."
