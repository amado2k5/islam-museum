summary:
  ar: "في رواية تميم الداري عند المسعودي ركب البحر في جماعة من بني عمه فأضل بهم وألقاهم إلى جزيرة فنظروا إلى دابة عظيمة قد نشرت شعرها فقالت أنا الجساسة التي أخرج آخر الزمان ودلتهم على قصر فيه رجل مسلسل بالحديد إلى عمود خاطبهم وقال إنه الدجال وأخبرهم بجمل من الملاحم وأنه لا يدخل مدينة النبي {cite:muruj-al-dhahab p. 530-531}."
  en: "The long-haired beast of Tamim al-Dari's island — 'I am the Jassasa that comes out at the end of time' — directing the castaways to the palace where a man chained in iron called himself the Dajjal and foretold the final wars {cite:muruj-al-dhahab p. 530-531}."
