id: concept/al-ijaz-al-bayani-inda-al-mufassirin
class: concept
kind: doctrine
tags: [arabiyya-browser, arabiyya-ijaz]
label:
  ar: "الإعجاز البياني عند المفسرين"
  en: "The inimitability of the Qur'an's language in the commentaries"
  ur: "مفسرین کے ہاں قرآن کا بیانی اعجاز"
  fr: "L'inimitabilité de la langue du Coran chez les commentateurs"
  es: "La inimitabilidad de la lengua del Corán en los comentarios"
summary:
  ar: "كيف شرح الطبري وابن كثير والقرطبي والبغوي آيات التحدي: المثل المطلوب مثله في البيان عند الطبري لأنه نزل بلسانهم، والتحدي عند ابن كثير ثلاث مراتب من القرآن كله إلى عشر سور إلى سورة، وهو عام في كل سورة طويلة أو قصيرة، ونفي الإتيان بمثله في المستقبل خبر عن غيب. ويذكر ابن كثير القول بالصرفة ويجعله على سبيل التنزل."
  en: "How al-Tabari, Ibn Kathir, al-Qurtubi and al-Baghawi explain the challenge verses: for al-Tabari the 'like' asked for is a like in clear expression, since it came in their own tongue; for Ibn Kathir the challenge has three stages, from the whole Qur'an to ten suras to one, and covers every sura, long or short, while the statement that they will never match it is a report of the unseen. Ibn Kathir mentions the sarfa view and accepts it only as a concession."
  ur: "طبری، ابن کثیر، قرطبی اور بغوی نے چیلنج کی آیات کی کیسے شرح کی: طبری کے نزدیک جس مثل کا مطالبہ ہے وہ بیان میں مثل ہے کیونکہ قرآن ان کی زبان میں اترا؛ ابن کثیر کے نزدیک چیلنج کے تین مرتبے ہیں، پورے قرآن سے دس سورتوں تک اور پھر ایک سورت تک، اور وہ ہر سورت کو عام ہے خواہ لمبی ہو یا چھوٹی، جبکہ آئندہ اس جیسا لانے کی نفی غیب کی خبر ہے۔ ابن کثیر صرفہ کے قول کا ذکر کرتے ہیں اور اسے صرف بطور تنزل رکھتے ہیں۔"
  fr: "Comment al-Tabari, Ibn Kathir, al-Qurtubi et al-Baghawi expliquent les versets du défi : pour al-Tabari, le semblable demandé est un semblable en expression claire, puisqu'il est venu dans leur propre langue ; pour Ibn Kathir, le défi comporte trois degrés, du Coran entier à dix sourates puis à une seule, et vaut pour toute sourate, longue ou courte, tandis que l'affirmation qu'ils n'en produiront jamais le semblable est une annonce de l'invisible. Ibn Kathir mentionne la thèse de la sarfa et ne l'admet que comme concession."
  es: "Cómo al-Tabari, Ibn Kathir, al-Qurtubi y al-Baghawi explican los versículos del desafío: para al-Tabari, el semejante que se pide es un semejante en expresión clara, puesto que vino en su propia lengua; para Ibn Kathir, el desafío tiene tres grados, del Corán entero a diez suras y luego a una sola, y abarca toda sura, larga o corta, mientras que la afirmación de que nunca producirán algo semejante es un anuncio de lo oculto. Ibn Kathir menciona la tesis de la sarfa y solo la admite como concesión."
