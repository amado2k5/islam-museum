label:
  ar: "الإعجاز البياني عند المفسرين"
  en: "The inimitability of the Qur'an's language in the commentaries"
  ur: "مفسرین کے ہاں قرآن کا بیانی اعجاز"
  fr: "L'inimitabilité de la langue du Coran chez les commentateurs"
  es: "La inimitabilidad de la lengua del Corán en los comentarios"
summary:
  ar: "كيف شرح الطبري وابن كثير والقرطبي والبغوي آيات التحدي: المثل المطلوب مثله في البيان عند الطبري لأنه نزل بلسانهم، والتحدي عند ابن كثير ثلاث مراتب من القرآن كله إلى عشر سور إلى سورة، وهو عام في كل سورة طويلة أو قصيرة، ونفي الإتيان بمثله في المستقبل خبر عن غيب. ويذكر ابن كثير القول بالصرفة ويجعله على سبيل التنزل."
  en: "How al-Tabari, Ibn Kathir, al-Qurtubi and al-Baghawi explain the challenge verses: for al-Tabari the 'like' asked for is a like in clear expression, since it came in their own tongue; for Ibn Kathir the challenge has three stages, from the whole Qur'an to ten suras to one, and covers every sura, long or short, while the statement that they will never match it is a report of the unseen. Ibn Kathir mentions the sarfa view and accepts it only as a concession."
