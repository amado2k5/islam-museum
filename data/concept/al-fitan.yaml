summary:
  ar: "الفتن في القرآن والسنة: المحن والابتلاءات التي تمر على المسلمين في آخر الزمان، يذكر أنها من أشراط الساعة، وأن فيها من الفتن ما لا يوصف، وأن الله يبتلي عباده."
  en: "The trials in Qur'an and Sunnah: the ordeals and tests that pass over Muslims in the last days — a sign of the Hour, including trials beyond description, when God tests His servants."
  ur: "فتنے قرآن و سنت میں: آخری زمانے میں مسلمانوں پر آنے والے آزمائشیں اور مصیبتیں — ساعت کی نشانیوں میں سے، جن میں ناقابلِ بیان فتنے بھی ہیں، جب اللہ اپنے بندوں کو آزماتا ہے۔"
