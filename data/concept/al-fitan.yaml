label:
  ar: الفتن
  en: The Trials
  fr: "Les Épreuves"
  ur: فتنے
  es: "Los juicios"
  tr: "isyan"
  id: "pemberontakan"
summary:
  ar: "الفتن في القرآن والسنة: المحن والابتلاءات التي تمر على المسلمين في آخر الزمان، يذكر أنها من أشراط الساعة، وأن فيها من الفتن ما لا يوصف، وأن الله يبتلي عباده."
  en: "The trials in Qur'an and Sunnah: the ordeals and tests that pass over Muslims in the last days — a sign of the Hour, including trials beyond description, when God tests His servants."
  fr: "Les épreuves dans le Coran et la sunna : les tribulations et les mises à l’épreuve que traversent les musulmans dans les derniers temps. C’est un signe de l’Heure, qui comprend des épreuves indescriptibles par lesquelles Dieu éprouve Ses serviteurs."
  ur: "فتنے قرآن و سنت میں: آخری زمانے میں مسلمانوں پر آنے والے آزمائشیں اور مصیبتیں — ساعت کی نشانیوں میں سے، جن میں ناقابلِ بیان فتنے بھی ہیں، جب اللہ اپنے بندوں کو آزماتا ہے۔"
  es: "Las pruebas del Corán y la Sunnah: las tribulaciones y pruebas que afrontan los musulmanes en los últimos días, una señal de la Hora, que incluye pruebas indescriptibles, cuando Dios pone a prueba a Sus siervos."
  tr: "Kur'an ve Sünnet'teki sıkıntılar: Müslümanların zamanın sonunda karşılaşacağı sınavlar ve sıkıntılar. Bunların Saatin işaretleri olduğu, tarif edilemez sınavlar olduğu ve Allah'ın kullarını sınadığı belirtilir."
  id: "Kesulitan dalam Al-Qur'an dan Sunnah: Ujian dan kesulitan yang akan dihadapi umat Islam di akhir zaman. Dikatakan bahwa ini adalah tanda-tanda Jam, ujian yang tak terlukiskan, dan Allah menguji hamba-Nya."
