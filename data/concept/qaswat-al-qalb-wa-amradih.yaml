id: concept/qaswat-al-qalb-wa-amradih
class: concept
kind: ethical
label:
  ar: "قسوة القلب وأمراضه"
  en: "Hardness of heart and its ailments"
  ur: "دل کی سختی اور اس کی بیماریاں"
  es: "La dureza del corazón y sus dolencias"
  fr: "L'endurcissement du cœur et ses maux"
  tr: "Kalbin sertliği ve hastalıkları"
  id: "Kekerasan jantung dan penyakitnya"
summary:
  ar: "يقول الشيخ عمر عبد الكافي إنه لا عقوبة للعبد أعظم من قسوة القلب والبعد عن الله. ويذكر أن الإفراط في الأكل والنوم والكلام والمخالطة يضر بالقلب، وأن القلب يحيا بالذكر ويُسقى بالتفكر."
  en: "Sheikh Omar Abdelkafy says that no punishment is greater for a servant than hardness of heart and distance from God. He names excess food, sleep, talk and mixing with people as harms to the heart, and says that the heart is revived by remembrance and watered by reflection."
  ur: "شیخ عمر عبدالکافی کہتے ہیں کہ بندے کے لیے دل کی سختی اور اللہ سے دوری سے بڑی کوئی سزا نہیں۔ وہ کھانے، نیند، بات چیت اور لوگوں سے میل جول کی زیادتی کو دل کے لیے نقصان دہ بتاتے ہیں، اور کہتے ہیں کہ دل ذکر سے زندہ ہوتا ہے اور تفکر سے سیراب۔"
  es: "El jeque Omar Abdelkafy afirma que no hay mayor castigo para un siervo que la dureza de corazón y el alejamiento de Dios. Menciona el exceso de comida, sueño, charlas y la interacción con otras personas como daños para el corazón, y dice que este se reaviva con el recuerdo y se nutre con la reflexión."
  fr: "Le cheikh Omar Abdelkafy affirme qu'il n'y a pas de châtiment plus grand pour un serviteur que l'endurcissement du cœur et l'éloignement de Dieu. Il cite l'excès de nourriture, de sommeil, de paroles et de fréquentations comme autant de maux pour le cœur, et déclare que le cœur est ranimé par le souvenir et abreuvé par la réflexion."
  tr: "Şeyh Ömer Abdulkafi, bir hizmetkâr için en büyük cezanın kalbin sertliği ve Allah'tan uzaklaşma olduğunu söyler. Aşırı yeme, uyuma, konuşma ve sosyal etkileşimin kalbe zarar verdiğini, kalbin anma yoluyla yaşadığını ve tefekkürle beslendiğini belirtir."
  id: "Sheikh Omar Abdul Kafi mengatakan bahwa tidak ada hukuman yang lebih besar bagi seorang hamba selain kekerasan hati dan jarak dari Allah. Ia menyebutkan bahwa makan berlebihan, tidur, berbicara, dan berinteraksi sosial merugikan hati, dan hati hidup melalui ingatan serta diberi makan oleh kontemplasi."
