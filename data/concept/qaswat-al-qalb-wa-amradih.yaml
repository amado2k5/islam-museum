id: concept/qaswat-al-qalb-wa-amradih
class: concept
kind: ethical
label:
  ar: "قسوة القلب وأمراضه"
  en: "Hardness of heart and its ailments"
  ur: "دل کی سختی اور اس کی بیماریاں"
summary:
  ar: "يقول الشيخ عمر عبد الكافي إنه لا عقوبة للعبد أعظم من قسوة القلب والبعد عن الله. ويذكر أن الإفراط في الأكل والنوم والكلام والمخالطة يضر بالقلب، وأن القلب يحيا بالذكر ويُسقى بالتفكر."
  en: "Sheikh Omar Abdelkafy says that no punishment is greater for a servant than hardness of heart and distance from God. He names excess food, sleep, talk and mixing with people as harms to the heart, and says that the heart is revived by remembrance and watered by reflection."
  ur: "شیخ عمر عبدالکافی کہتے ہیں کہ بندے کے لیے دل کی سختی اور اللہ سے دوری سے بڑی کوئی سزا نہیں۔ وہ کھانے، نیند، بات چیت اور لوگوں سے میل جول کی زیادتی کو دل کے لیے نقصان دہ بتاتے ہیں، اور کہتے ہیں کہ دل ذکر سے زندہ ہوتا ہے اور تفکر سے سیراب۔"
