  en: "Karm (the vine)"
  ur: "کرم"
  es: "Karma (la vid)"
  fr: "Karm (la vigne)"
summary:
  ar: "الكرم عند ابن سينا النبات المعروف، البري والبستاني، وفيه ذكر لعصارة ورقه ودمعته ورماد قضبانه وثمرته في الجراح والمفاصل والرأس والمعدة والسموم، وينقل وصف ديسقوريدوس للكرم البري {cite:canon-ibn-sina-print-v1 p.535} {cite:canon-ibn-sina-print-v1 p.536}."
  en: "Karm in the Canon is the vine, wild and garden. The book lists uses of its leaf juice, its sap, the ash of its shoots and its fruit for wounds, joints, head, stomach and poisons, and quotes Dioscorides's description of the wild vine {cite:canon-ibn-sina-print-v1 p.535} {cite:canon-ibn-sina-print-v1 p.536}."
  ur: "قانون میں کرم بیل ہے، جنگلی اور باغی۔ کتاب اس کے پتے کے رس، گوند، ٹہنیوں کی راکھ اور پھل کے زخموں، جوڑوں، سر، معدے اور زہروں میں فائدے گنواتی ہے، اور جنگلی بیل کا دیسقوریدوس کا بیان نقل کرتی ہے {cite:canon-ibn-sina-print-v1 p.535} {cite:canon-ibn-sina-print-v1 p.536}۔"
  es: "Karm en el Canon es la vid, silvestre y de jardín. El libro enumera los usos de su jugo de hojas, su savia, la ceniza de sus brotes y su fruto para heridas, articulaciones, cabeza, estómago y venenos, y cita la descripción de Dioscórides de la vid silvestre {cite:canon-ibn-sina-print-v1 p.535} {cite:canon-ibn-sina-print-v1 p.536}."
  fr: "Dans le Canon, Karm désigne la vigne, sauvage et cultivée. L'ouvrage énumère les usages de son jus de feuilles, de sa sève, des cendres de ses sarments et de ses fruits pour soigner les plaies, les articulations, la tête, l'estomac et les poisons, et cite la description de la vigne sauvage par Dioscoride {cite:canon-ibn-sina-print-v1 p.535} {cite:canon-ibn-sina-print-v1 p.536}."
