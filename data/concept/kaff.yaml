id: concept/kaff
class: concept
kind: legal
label:
  ar: "كَفّ"
  en: "Palm of the hand (kaff)"
  ur: "ہتھیلی (کف)"
summary:
  ar: "الكف في اللغة راحة اليد مع الأصابع، وجمعها كفوف وأكف. ومن أحكامه غسل الكفين في أول الوضوء وعند القيام من النوم وقبل الأكل وبعده، ومسح الكفين في التيمم، وغسل الكفين مع اليدين إلى المرفقين ركن في الوضوء. وفي القصاص يجب قطع الكف بقطع الكف من مفصل الكوع، ودية الكف نصف دية اليد عند الجمهور بحديث معاذ وعمرو بن حزم، وتقطع يد السارق من مفصل الكف (الكوع)، وكذلك يد قاطع الطريق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13401} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13402} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13403} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13404} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13405}"
  en: "Kaff is the palm of the hand with its fingers. Rules on it include washing the hands at the start of ablution, on rising from sleep and before and after eating; wiping the palms in tayammum; and washing the hands up to the elbows as a pillar of ablution. In retaliation the hand is cut at the wrist joint; the blood-money for a hand is half the blood-money of the whole limb, on the reports of Mu'adh and Amr ibn Hazm; a thief's hand is cut at the wrist, as is a highwayman's. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13401} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13402} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13403} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13404} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13405}"
  ur: "کف لغت میں ہتھیلی اور انگلیوں کو کہتے ہیں۔ اس کے احکام میں وضو کے شروع میں، نیند سے اٹھنے پر، اور کھانے سے پہلے اور بعد دونوں ہاتھ دھونا، تیمم میں ہتھیلیوں کا مسح، اور وضو میں کہنیوں تک ہاتھ دھونا رکن ہے۔ قصاص میں کلائی کے جوڑ سے ہاتھ کاٹا جاتا ہے، ہاتھ کی دیت پوری عضو کی دیت کا نصف ہے، اور چور اور قاطع الطریق کا ہاتھ بھی کلائی سے کاٹا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13401} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13402} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13403} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13404} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13405}"
