summary:
  ar: "يصف شكيب أرسلان في الفصل الأول من الكتاب «اليقظة الإسلامية» حال العالم الإسلامي في القرن الثامن عشر بأنه بلغ أدنى درجات الضعف والفساد، ثم يعرض حركات الإصلاح التي تلته: الحركة الدينية في نجد التي امتد أثرها بالحج إلى أقطار كثيرة، ودعوة الإصلاح الحر في الهند، ومصلحين مثل محمد عبده في مصر، وتيار الشباب في تركيا بعد ثورة 1908. ويفرّق المؤلف بين مصلحين أحرار يريدون تنشئة الإصلاح تدريجاً على أساس الدين، وغلاة وطنيين يثيرون الحماسة الدينية ضد كل ما هو غربي. يعرض هذا التقسيم بوصفه رأي المؤلف، لا تصنيفاً معتمداً لحركات الإصلاح."
  en: "Arslan's first chapter describes the Muslim world of the eighteenth century as at its lowest point, then surveys the reform movements that followed: a religious revival in Najd whose influence spread through the pilgrimage, a liberal reform current in India, reformers such as Muhammad Abduh in Egypt, and the Young Turk movement after 1908. He separates gradual reformers who work within Islam from radical nationalists who stir religious feeling against everything Western. This division is the author's own classification."
  es: "El primer capítulo de Arslan describe el mundo musulmán del siglo XVIII en su punto más bajo, para luego analizar los movimientos reformistas que le siguieron: un renacimiento religioso en Najd cuya influencia se extendió a través de la peregrinación, una corriente reformista liberal en la India, reformadores como Muhammad Abduh en Egipto y el movimiento de los Jóvenes Turcos después de 1908. Arslan distingue entre los reformadores graduales que trabajan dentro del islam y los nacionalistas radicales que avivan el sentimiento religioso contra todo lo occidental. Esta división es una clasificación propia del autor."
  fr: "Le premier chapitre d'Arslan décrit le monde musulman du XVIIIe siècle comme étant à son point le plus bas, puis examine les mouvements de réforme qui suivirent: un renouveau religieux au Najd dont l'influence se propagea grâce au pèlerinage, un courant de réforme libérale en Inde, des réformateurs tels que Muhammad Abduh en Égypte et le mouvement des Jeunes-Turcs après 1908. Il distingue les réformateurs graduels qui œuvrent au sein de l'islam des nationalistes radicaux qui attisent le sentiment religieux contre tout ce qui est occidental. Cette distinction est propre à l'auteur."
  ur: "ارسلان کا پہلا باب اٹھارویں صدی کی مسلم دنیا کو اس کے نچلے ترین مقام پر بیان کرتا ہے، پھر اس کے بعد ہونے والی اصلاحی تحریکوں کا سروے کرتا ہے: نجد میں ایک مذہبی احیاء جس کا اثر زیارت کے ذریعے پھیلا، ہندوستان میں ایک لبرل اصلاحات کا عمل، مصر میں محمد عبدہ جیسے مصلحین، اور ینگ ترک تحریک جنہوں نے 1908 کے بعد اسلام پسندوں سے الگ ہونے کے بعد قومی انقلابی تحریکوں کے اندر کام کیا۔ مغربی ہر چیز کے خلاف مذہبی جذبات کو ابھاریں۔ یہ تقسیم مصنف کی اپنی درجہ بندی ہے۔"
