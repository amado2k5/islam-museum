summary:
  ar: "يصف شكيب أرسلان في الفصل الأول من الكتاب «اليقظة الإسلامية» حال العالم الإسلامي في القرن الثامن عشر بأنه بلغ أدنى درجات الضعف والفساد، ثم يعرض حركات الإصلاح التي تلته: الحركة الدينية في نجد التي امتد أثرها بالحج إلى أقطار كثيرة، ودعوة الإصلاح الحر في الهند، ومصلحين مثل محمد عبده في مصر، وتيار الشباب في تركيا بعد ثورة 1908. ويفرّق المؤلف بين مصلحين أحرار يريدون تنشئة الإصلاح تدريجاً على أساس الدين، وغلاة وطنيين يثيرون الحماسة الدينية ضد كل ما هو غربي. يعرض هذا التقسيم بوصفه رأي المؤلف، لا تصنيفاً معتمداً لحركات الإصلاح."
  en: "Arslan's first chapter describes the Muslim world of the eighteenth century as at its lowest point, then surveys the reform movements that followed: a religious revival in Najd whose influence spread through the pilgrimage, a liberal reform current in India, reformers such as Muhammad Abduh in Egypt, and the Young Turk movement after 1908. He separates gradual reformers who work within Islam from radical nationalists who stir religious feeling against everything Western. This division is the author's own classification."
