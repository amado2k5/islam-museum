label: { ar: "علم مصطلح الحديث", en: "Hadith methodology (mustalah al-hadith)" }
summary:
  ar: "علم مصطلح الحديث هو قواعد معرفة أحوال السند والمتن: الصحيح والحسن والضعيف، والموقوف والمرفوع والمقطوع، والمتصل والمنقطع والمعضل والمرسل، والجمع بين الروايات وعللها. أصله في تنبيهات المحدثين الأوائل؛ ثم صارت له كتب مؤلفة، ومن أقدم النصوص التأسيسية الباقية مقدمة مسلم في صحيحه، وتلخصه المدرسة في كتب مثل مقدمة ابن الصلاح."
  en: "Mustalah al-hadith is the science of the states of chain and text — sahih, hasan, da'if; mawquf, marfu', maqtu'; muttasil, munqati', mu'dal, mursal — and the reconciliation and hidden defects of transmissions. It began in the early muhaddithun's obiter dicta, then gained its own manuals; the earliest surviving systematic statement is Muslim's introduction to his Sahih, later epitomised in works like Ibn al-Salah's Muqaddima."
