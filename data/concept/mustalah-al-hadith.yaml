id: concept/mustalah-al-hadith
class: concept
kind: term
label: { ar: "علم مصطلح الحديث", en: "Hadith methodology (mustalah al-hadith)", es: "Metodología del hadiz (mustalah al-hadith)", fr: "Méthodologie des hadiths (mustalah al-hadith)", ur: "حدیث کا طریقہ کار", tr: "Hadis Bilimi Terimleri", id: "Ilmu Terminologi Hadis" }
summary:
  ar: "علم مصطلح الحديث هو قواعد معرفة أحوال السند والمتن: الصحيح والحسن والضعيف، والموقوف والمرفوع والمقطوع، والمتصل والمنقطع والمعضل والمرسل، والجمع بين الروايات وعللها. أصله في تنبيهات المحدثين الأوائل؛ ثم صارت له كتب مؤلفة، ومن أقدم النصوص التأسيسية الباقية مقدمة مسلم في صحيحه، وتلخصه المدرسة في كتب مثل مقدمة ابن الصلاح."
  en: "Mustalah al-hadith is the science of the states of chain and text — sahih, hasan, da'if; mawquf, marfu', maqtu'; muttasil, munqati', mu'dal, mursal — and the reconciliation and hidden defects of transmissions. It began in the early muhaddithun's obiter dicta, then gained its own manuals; the earliest surviving systematic statement is Muslim's introduction to his Sahih, later epitomised in works like Ibn al-Salah's Muqaddima."
  es: "Mustalah al-hadith es la ciencia de los estados de cadena y texto: sahih, hasan, da'if; mawquf, marfu', maqtu'; muttasil, munqati', mu'dal, mursal—y la reconciliación y los defectos ocultos de las transmisiones. Comenzó con los obiter dicta de los primeros muhaddithun y luego obtuvo sus propios manuales; La declaración sistemática más antigua que se conserva es la introducción de Muslim a su Sahih, resumida más tarde en obras como Muqaddima de Ibn al-Salah."
  fr: "Mustalah al-hadith est la science des états de chaîne et de texte — sahih, hasan, da'if; mawquf, marfu', maqtu'; muttasil, munqati', mu'dal, mursal — et la réconciliation et les vices cachés des transmissions. Cela a commencé dans les premières remarques incidentes de Muhaddithun, puis a obtenu ses propres manuels; la première déclaration systématique survivante est l'introduction de Muslim à son Sahih, incarnée plus tard dans des œuvres comme la Muqaddima d'Ibn al-Salah."
  ur: "مصلح الحدیث سلسلہ اور متن کی حالتوں کی سائنس ہے — صحیح، حسن، ضعیف؛ maquf, marfu', maqtu'; متصل، منقطی، مدل، مرسل - اور مصلحت اور ترسیل کے پوشیدہ نقائص۔ یہ ابتدائی محدثین کے اوبیٹر ڈکٹا میں شروع ہوا، پھر اس کے اپنے دستور العمل حاصل ہوئے۔ سب سے قدیم زندہ بچ جانے والا منظم بیان مسلم کا اپنی صحیح سے تعارف ہے، جو بعد میں ابن الصلاح کے مقدّمہ جیسے کاموں میں مظہر ہے۔"
  tr: "Hadis bilimi terminolojisi, zincirin ve metnin koşullarını belirleme kurallarıdır: özgün, iyi ve zayıf, mawqoof, marfu' (marfu') ve maqtu', bağlı ve kopuk, 'mu'dil' ve 'mursal' ile rivayetlerin ve nedenlerinin birleşimi. Kökeni erken hadis âlimlerinin uyarılarındadır; daha sonra yazarlık kitaplarına dönüşmüş ve en eski hayatta kalan temel metinlerden biri, okulun İbn al-Salah'ın giriş kitabı gibi kitaplarda özetlediği Müslüman'ın Sahih'ine girişidir."
  id: "Ilmu terminologi hadis adalah aturan untuk menentukan kondisi rantai dan teks: otentik, baik, dan lemah, mawqoof, marfu' (marfu'), dan maqtu', terhubung dan terputus, 'mu'dil' dan 'mursal', serta kombinasi riwayat dan penyebabnya. Asal-usulnya berasal dari peringatan para ulama hadis awal; kemudian menjadi buku tulisan, dan di antara teks dasar tertua yang masih ada adalah pengantar Muslim terhadap Sahih-nya, yang dirangkum oleh aliran dalam buku-buku seperti pengantar Ibn al-Salah."
