summary:
  ar: "القنطوريون في الكتاب نبات مر جدا له ساق وزهر أحمر إلى الأرجواني وورق صغير كورق السذاب، منه صغير وكبير، حار يابس إلى الثالثة، ينقي الجراحات الطرية ويختم القروح العتيقة وينفع من النواصير وعرق النسا وسدد الكبد وصلابة الطحال والمغص والقولنج والحميات ويقتل الديدان {cite:canon-ibn-sina-print-v1 pp.645-646}"
  en: "Qantariyun is in the book a very bitter plant with a stem, a flower red leaning to purple and small leaves like rue, of a small and a large kind, hot and dry to the third degree; it cleanses fresh wounds, closes old ulcers and benefits fistulas, sciatica, obstructions of the liver, hardness of the spleen, colic, fevers, and kills worms {cite:canon-ibn-sina-print-v1 pp.645-646}"
  ur: "قنطوریون کتاب میں نہایت کڑوا پودا ہے جس کا تنا، سرخی مائل ارغوانی پھول اور سداب جیسے چھوٹے پتے ہیں، اس کی چھوٹی اور بڑی قسم ہے، تیسرے درجے تک گرم خشک؛ تازہ زخم صاف کرتا، پرانے قرحے بند کرتا اور ناسوروں، عرق النسا، جگر کی رکاوٹوں، تلی کی سختی، مروڑ، قولنج اور بخاروں میں نافع ہے اور کیڑوں کو مارتا ہے {cite:canon-ibn-sina-print-v1 pp.645-646}۔"
  es: "En el libro, Qantariyun es una planta muy amarga con tallo, flor roja con tonalidades púrpuras y hojas pequeñas parecidas a las de la ruda, de dos tipos: pequeñas y grandes, de naturaleza cálida y seca hasta el tercer grado; limpia heridas recientes, cierra úlceras antiguas y es beneficiosa para fístulas, ciática, obstrucciones hepáticas, bazo endurecido, cólicos, fiebres y para eliminar parásitos intestinales. {cite:canon-ibn-sina-print-v1 pp.645-646}"
