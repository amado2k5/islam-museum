  ar: "الوزغة"
  en: "The gecko"
  ur: "جھپکلی"
  es: "El gecko"
  fr: "Le gecko"
  tr: "gekko"
  id: "tokek"
summary:
  ar: "من قتل وزغة في أول ضربة فله كذا وكذا حسنة، وروي في أول ضربة سبعين حسنة: الفويسقة التي أمر بقتلها ودرّج الأجر على عجلة القتل."
  en: "'Whoever kills a gecko at the first stroke has such-and-such a reward' — seventy good deeds in one report — the fuwaysiqa whose killing was ordered, the reward graded by the swiftness of the stroke."
  ur: "'جو وزغہ پہلی ضربت میں مارے اس کے لیے اتنے اتنے نیکیاں' — ایک روایت میں ستر نیکیاں — جس کا قتل حکم میں تھا، اجر ضربت کی جلدی کے مطابق۔"
  es: "«Quien mate a un gecko de un solo golpe recibirá tal y cual recompensa» —setenta buenas acciones en un solo informe— el fuwaysiqa cuya matanza fue ordenada, la recompensa graduada según la rapidez del golpe."
  fr: "« Quiconque tue un gecko du premier coup reçoit telle ou telle récompense » — soixante-dix bonnes actions dans un rapport — le fuwaysiqa dont la mise à mort avait été ordonnée, la récompense étant graduée selon la rapidité du coup."
  tr: "İlk darbede bir gekoyu öldüren kişinin şu ya da şu iyi işi vardır. Anlatılanlara göre, yetmiş iyi iş ilk darbe için yapılır: öldürülmesini emrettiği 'Fawaisqah' ve ödül acele öldürme üzerine kuruludur."
  id: "Siapa pun yang membunuh tokek pada serangan pertama memiliki perbuatan baik tertentu. Diceritakan bahwa tujuh puluh perbuatan baik adalah untuk serangan pertama: 'Fawaisqah' yang diperintahkan untuk dibunuh, dan hadiahnya didasarkan pada tergesa-gesa membunuh."
