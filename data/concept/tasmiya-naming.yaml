id: concept/tasmiya-naming
class: concept
kind: legal
label:
  ar: "التسمية"
  en: "Tasmiya (naming: giving a name to a child, and the rules on names)"
  ur: "تسمیہ (نام رکھنا اور نام کے احکام)"
summary:
  ar: "التسمية في اللغة من السمو أو من الوسم، وتُستعمل عند الفقهاء بمعنى قول «بسم الله»، وبمعنى وضع الاسم العلم للمولود وغيره، وبمعنى تحديد العوض في العقود، وبمعنى التعيين بالاسم في مقابل الإبهام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5098} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5112} والأب أولى بتسمية المولود من الأم، فإن اختلفا قُدّم الأب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5099} وفي وقتها اختلاف: فالمالكية يرون تسمية المولود في اليوم السابع بعد ذبح العقيقة، ومن لا يُعَقّ عنه لفقر وليه يُسمّى متى شاء، والشافعية يستحبونها في اليوم السابع، والحنابلة على روايتين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5099} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5100} وفي السقط لا يُسمّى عند الحنفية في قول أبي حنيفة، ولا يُترك تسميته عند الشافعية، ويُسمّى بما يصلح للذكر والأنثى عند الحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5101} ويُستحب تسمية من مات بعد الولادة وقبل التسمية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5102} والأسماء المستحبة ما أُضيف إلى الله تعالى، وأحبها إليه عبد الله وعبد الرحمن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5102} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5103} وتجوز التسمية بأسماء الأنبياء عند الأكثرين، ويُكره ما يُتطيّر بنفيه ومنه رباح ويسار ونجاح وأفلح، وما تنفر منه النفوس كحرب ومرة، وتُمنع الأسماء الخاصة بالله تعالى، وكل معبّد مضاف إلى غير الله كعبد العزى وعبد الكعبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5104} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5105} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5106} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5107} ويجوز تغيير الاسم، ويُسنّ تحسين القبيح منه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5108} وتجوز تسمية الأدوات والدواب والملابس وتسمية النجوم بأسماء العرب، ويُمنع أن تُسمّى المحرمات بغير اسمها ليُستحل بها الحرام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5109} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5111} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5112}"
  en: "Tasmiya in the language comes from height or from a mark. The jurists use it in four senses: saying «in the name of God», giving a proper name to a child or to anything else, fixing the consideration in contracts, and identifying by name as against leaving a thing vague. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5098} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5112} The father has the better right to name a child, and if the parents differ the father's choice is preferred. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5099} The schools differ on the time: the Malikis hold that a child is named on the seventh day after the aqiqa sacrifice, and a child whose guardian cannot afford the aqiqa may be named at any time; the Shafi'is recommend the seventh day; the Hanbalis report two views. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5099} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5100} For a stillborn child, Abu Hanifa's view is that he is not named, the Malikis agree, the Shafi'is say his naming is not to be omitted, and the Hanbalis say he may be given a name fit for either sex. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5101} A child who dies after birth and before he is named is named. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5102} Names built on the divine names are recommended, and the most beloved to God are Abdullah and Abd al-Rahman. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5102} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5103} Naming after prophets is allowed according to most jurists. Names that people think ill-omened, such as Rabah, Yasar, Najah and Aflah, are disliked, and names that people shrink from, such as Harb and Murra, are disliked too. The names of God that belong to Him alone are forbidden, and so is every name built on a servitude to anything other than God, such as Abd al-Uzza or Abd al-Ka'ba. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5104} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5105} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5106} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5107} Changing a name is allowed and changing an ugly name to a good one is recommended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5108} Naming tools, mounts and garments, and naming stars after Arabic words, is permitted; renaming a forbidden drink to escape its ruling does not lift the prohibition. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5109} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5111} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5112}"
