id: concept/tasmiya-naming
class: concept
kind: legal
label:
  ar: "التسمية"
  en: "Tasmiya (naming: giving a name to a child, and the rules on names)"
  ur: "تسمیہ ⁦(نام رکھنا اور نام کے احکام)⁩"
  es: "Tasmiya (nombres: cómo se le da un nombre a un niño y las reglas sobre los nombres)"
  fr: "Tasmiya (nommer: donner un nom à un enfant et les règles relatives aux noms)"
  tr: "İsimlendirme"
  id: "Penamaan"
summary:
  ar: "التسمية في اللغة من السمو أو من الوسم، وتُستعمل عند الفقهاء بمعنى قول «بسم الله»، وبمعنى وضع الاسم العلم للمولود وغيره، وبمعنى تحديد العوض في العقود، وبمعنى التعيين بالاسم في مقابل الإبهام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5098} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5112} والأب أولى بتسمية المولود من الأم، فإن اختلفا قُدّم الأب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5099} وفي وقتها اختلاف: فالمالكية يرون تسمية المولود في اليوم السابع بعد ذبح العقيقة، ومن لا يُعَقّ عنه لفقر وليه يُسمّى متى شاء، والشافعية يستحبونها في اليوم السابع، والحنابلة على روايتين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5099} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5100} وفي السقط لا يُسمّى عند الحنفية في قول أبي حنيفة، ولا يُترك تسميته عند الشافعية، ويُسمّى بما يصلح للذكر والأنثى عند الحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5101} ويُستحب تسمية من مات بعد الولادة وقبل التسمية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5102} والأسماء المستحبة ما أُضيف إلى الله تعالى، وأحبها إليه عبد الله وعبد الرحمن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5102} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5103} وتجوز التسمية بأسماء الأنبياء عند الأكثرين، ويُكره ما يُتطيّر بنفيه ومنه رباح ويسار ونجاح وأفلح، وما تنفر منه النفوس كحرب ومرة، وتُمنع الأسماء الخاصة بالله تعالى، وكل معبّد مضاف إلى غير الله كعبد العزى وعبد الكعبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5104} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5105} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5106} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5107} ويجوز تغيير الاسم، ويُسنّ تحسين القبيح منه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5108} وتجوز تسمية الأدوات والدواب والملابس وتسمية النجوم بأسماء العرب، ويُمنع أن تُسمّى المحرمات بغير اسمها ليُستحل بها الحرام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5109} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5111} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5112}"
  en: "Tasmiya in the language comes from height or from a mark. The jurists use it in four senses: saying «in the name of God», giving a proper name to a child or to anything else, fixing the consideration in contracts, and identifying by name as against leaving a thing vague. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5098} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5112} The father has the better right to name a child, and if the parents differ the father's choice is preferred. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5099} The schools differ on the time: the Malikis hold that a child is named on the seventh day after the aqiqa sacrifice, and a child whose guardian cannot afford the aqiqa may be named at any time; the Shafi'is recommend the seventh day; the Hanbalis report two views. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5099} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5100} For a stillborn child, Abu Hanifa's view is that he is not named, the Malikis agree, the Shafi'is say his naming is not to be omitted, and the Hanbalis say he may be given a name fit for either sex. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5101} A child who dies after birth and before he is named is named. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5102} Names built on the divine names are recommended, and the most beloved to God are Abdullah and Abd al-Rahman. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5102} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5103} Naming after prophets is allowed according to most jurists. Names that people think ill-omened, such as Rabah, Yasar, Najah and Aflah, are disliked, and names that people shrink from, such as Harb and Murra, are disliked too. The names of God that belong to Him alone are forbidden, and so is every name built on a servitude to anything other than God, such as Abd al-Uzza or Abd al-Ka'ba. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5104} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5105} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5106} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5107} Changing a name is allowed and changing an ugly name to a good one is recommended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5108} Naming tools, mounts and garments, and naming stars after Arabic words, is permitted; renaming a forbidden drink to escape its ruling does not lift the prohibition. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5109} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5111} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5112}"
  es: "Tasmiya en el idioma proviene de altura o de una marca. Los juristas lo usan en cuatro sentidos: decir «en el nombre de Dios», dar un nombre propio a un niño o a cualquier otra cosa, fijar la contraprestación en los contratos e identificar por nombre en lugar de dejar algo vago. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5098} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5112} El padre tiene mejor derecho a nombrar a un niño, y si los padres difieren, se prefiere la elección del padre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5099} Las escuelas difieren en el momento: los malikíes sostienen que un niño es nombrado el séptimo día después del sacrificio aqiqa, y un niño cuyo tutor no puede costear el aqiqa puede ser nombrado en cualquier momento; los shafi'íes recomiendan el séptimo día; los hanbalíes informan dos opiniones. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5099} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5100} Para un niño nacido muerto, la opinión de Abu Hanifa es que no se le da nombre, los Malikis están de acuerdo, los Shafi'is dicen que no se debe omitir su nombre, y los Hanbalis dicen que se le puede dar un nombre apropiado para cualquier sexo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5101} Un niño que muere después del nacimiento y antes de que se le dé nombre, se le da nombre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5102} Se recomiendan los nombres basados en los nombres divinos, y los más amados por Dios son Abdullah y Abd al-Rahman. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5102} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5103} Según la mayoría de los juristas, está permitido nombrar en honor a los profetas. Se desaprueban los nombres que la gente considera de mal augurio, como Rabah, Yasar, Najah y Aflah, y también los nombres que provocan repulsión, como Harb y Murra. Los nombres de Dios que le pertenecen solo a Él están prohibidos, así como todo nombre basado en la servidumbre a algo que no sea Dios, como Abd al-Uzza o Abd al-Ka'ba. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5104} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5105} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5106} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5107} Cambiar un nombre está permitido y cambiar un nombre feo por uno bueno es recomendable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5108} Nombrar herramientas, monturas y prendas de vestir, y nombrar estrellas con palabras árabes, está permitido; cambiar el nombre de una bebida prohibida para escapar de su norma no levanta la prohibición. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5109} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5111} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5112}"
  fr: "Le terme « tasmiya » en kuwaitiyya provient de la hauteur ou d'une marque. Les juristes l'emploient dans quatre sens: dire « au nom de Dieu », donner un nom propre à un enfant ou à toute autre chose, fixer la contrepartie dans les contrats et identifier par un nom afin d'éviter toute ambiguïté. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5098} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5112} Le père a le droit prioritaire de nommer un enfant et, en cas de désaccord entre les parents, le choix du père prévaut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5099} Les écoles juridiques divergent quant au moment où le nom est donné: les malikites estiment qu'un enfant est nommé le septième jour après le sacrifice de l'aqiqa, et qu'un enfant dont le tuteur n'a pas les moyens d'accomplir l'aqiqa peut être nommé à tout moment; les chaféites recommandent le septième jour; les hanbalites rapportent deux avis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5099} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5100} Pour un enfant mort-né, l'avis d'Abu Hanifa est qu'il ne doit pas être nommé; les Malikites sont d'accord; les Shafi'ites disent qu'il ne faut pas omettre de le nommer; et les Hanbalites disent qu'il peut recevoir un nom convenant à l'un ou l'autre sexe. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5101} Un enfant qui meurt après sa naissance et avant d'avoir été nommé doit l'être. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5102} Les noms dérivés des noms divins sont recommandés, et les plus aimés de Dieu sont Abdullah et Abd al-Rahman. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5102} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5103} Selon la plupart des juristes, il est permis de donner à quelqu'un le nom d'un prophète. Les noms considérés comme de mauvais augure, tels que Rabah, Yasar, Najah et Aflah, sont déconseillés, de même que ceux qui suscitent la réticence, comme Harb et Murra. Les noms de Dieu qui Lui appartiennent exclusivement sont interdits, ainsi que tout nom fondé sur une allégeance à autre chose que Dieu, comme Abd al-Uzza ou Abd al-Ka'ba. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5104} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5105} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5106} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5107} Changer un nom est permis et il est recommandé de remplacer un nom disgracieux par un nom plus harmonieux. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5108} Nommer les outils, les montures et les vêtements, et nommer les étoiles d'après des mots arabes, est permis; renommer une boisson interdite pour contourner son interdiction ne la lève pas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5109} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5111} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5112}"
  ur: "زبان میں تسمیہ اونچائی سے آتا ہے یا نشان سے۔ فقہاء اسے چار معنوں میں استعمال کرتے ہیں: \"خدا کے نام پر\" کہنا، کسی بچے یا کسی اور چیز کا صحیح نام رکھنا، معاہدوں میں غور و فکر کو درست کرنا، اور کسی چیز کو مبہم چھوڑنے کے خلاف نام سے پہچاننا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5098} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5112} باپ کو بچے کا نام رکھنے کا زیادہ حق ہے، اور اگر والدین میں اختلاف ہو تو باپ کی پسند کو ترجیح دی جاتی ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 5099} مکاتب میں وقت کے بارے میں اختلاف ہے: مالکیوں کا خیال ہے کہ عقیقہ کے ساتویں دن بچے کا نام رکھا جائے، اور جس بچے کا سرپرست عقیقہ کرنے کی استطاعت نہ رکھتا ہو اس کا نام کسی بھی وقت رکھا جا سکتا ہے۔ شافعی ساتویں دن کی سفارش کرتے ہیں۔ حنبلی دو قول بیان کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5099} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5100} مردہ پیدا ہونے والے بچے کے بارے میں ابو حنیفہ کا قول ہے کہ اس کا نام نہیں رکھا گیا ہے، مالکیہ متفق ہیں، شافعی کہتے ہیں کہ اس کا نام حنبل رکھا جائے، اور کہتے ہیں کہ اس کا نام حنبل رکھا جائے گا کسی بھی جنسی کے لئے. {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5101} وہ بچہ جو پیدائش کے بعد اور اس کا نام رکھنے سے پہلے مر جاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5102} الہی ناموں پر بنائے گئے ناموں کی سفارش کی گئی ہے، اور اللہ کے نزدیک سب سے زیادہ محبوب عبداللہ اور عبدالرحمٰن ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5102} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5103} اکثر فقہاء کے نزدیک انبیاء کے نام رکھنے کی اجازت ہے۔ جن ناموں کو لوگ برا سمجھتے ہیں، جیسے رباح، یسار، نجح اور افلح، ناپسندیدہ ہیں، اور جن ناموں سے لوگ چھوٹ جاتے ہیں، جیسے حرب اور مرہ، وہ بھی ناپسند ہیں۔ خدا کے نام جو صرف اس کے ہیں حرام ہیں، اور اسی طرح ہر نام خدا کے علاوہ کسی اور کی بندگی پر بنایا گیا ہے، جیسے عبد العزی یا عبد الکعبہ۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5104} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5105} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5106} p.5107} نام بدلنے کی اجازت ہے اور بدصورت نام کو اچھے سے بدلنے کی سفارش کی جاتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5108} اوزاروں، پہاڑوں اور لباسوں کے نام رکھنے اور ستاروں کے نام عربی الفاظ پر رکھنے کی اجازت ہے۔ اس کے حکم سے بچنے کے لیے حرام مشروب کا نام تبدیل کرنے سے ممانعت ختم نہیں ہوتی۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5109} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5111}"
  tr: "Dilde isimlendirme, yükseltme veya 'wasm' (ismin adı) kelimesinden türemiştir ve hukukçular arasında 'Tanrı'nın adıyla' demek, yeni doğana uygun bir isim vermek, sözleşmelerde tazminat belirtmek veya belirsizliğe karşı isimle belirtmek anlamına gelir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5098} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5112} Baba, yenidoğana annesinden isim verme hakkına sahiptir; fark varsa, baba üstünlük sağlar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5099} O dönemde bir fark vardır: Malikiler, yeni doğanın akikahın katliamından sonraki yedinci gün isimlendirilmesini düşünür ve fakir vasisi nedeniyle onun adına 'ika' olarak anılmayan kişi 'ne zaman isterse' denir. Şafi'ler yedinci gün tavsiye eder, Hanbaliler ise iki anlatım yapar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5099} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5100} Düşük durumunda, Ebu Hanifa'ya göre Hanafilere göre adlandırılmaz, Şafii'lere göre isim verilmez ve Hanbalilere göre hem erkekler hem kadınlar için uygun olan olarak adlandırılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5101} Doğumdan sonra ölen kişinin isimlendirilmesi ve isim verilmeden önce isimlendirilmesi tavsiye edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5102} Önerilen isimler Allah'a atfedilenlerdir ve O'nun sevdikleri Abdullah ve Abdurrahman'dır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5102} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5103} Peygamberlerin çoğu insanın isimlendirmesi caizdir, ancak onlar reddedilen şeyleri sevmezler; örneğin Rabah, Yassar, Najah, Falah; ve ruhları uzaklaştıran savaş ve kin gibi, Allah'a özgü isimleri yasaklayanları ise sevmezler. Abdüluzza ve Abdül-Kabe gibi Allah dışında başka birine atfedilen herhangi bir tapınak. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.5104} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5105} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5106} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5107} İsmin değiştirilmesi caizdir ve çirkinliğini geliştirmek önerilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5108} Aletler, hayvanlar, giysiler ve yıldızlara Arap isimlerinin adını vermek caizdir, ancak yasak olanı izin vermek için yasak şeylere başka isimlerle isim vermek yasaktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5109} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5111} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5112}"
  id: "Dalam bahasa, penamaan berasal dari elevasi atau dari 'wasm' (nama nama), dan di antara ahli hukum, istilah ini digunakan untuk mengatakan 'Dalam nama Tuhan,' untuk memberikan nama khusus kepada bayi baru lahir, atau untuk menentukan kompensasi dalam kontrak, atau untuk menentukan dengan nama sebagai kontras dengan ambiguitas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5098} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5112} Ayah berhak menamai bayi baru lahir dari ibu; jika ada perbedaan, ayah memiliki keunggulan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5099} Pada waktu itu, ada perbedaan: orang Malik mempertimbangkan untuk menamai bayi yang baru lahir pada hari ketujuh setelah pembantaian aqiqah, dan siapa pun yang tidak disebut 'iqa' atas namanya karena wali yang miskin disebut 'Kapan saja ia mau.' Para Syafi'i merekomendasikannya pada hari ketujuh, dan Hanbalis memiliki dua riwayat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5099} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5100} Dalam kasus keguguran, nama ini tidak disebutkan sesuai Hanafi menurut Abu Hanifa, juga tidak dihilangkan namanya menurut Shafi'i, dan disebut sesuai untuk laki-laki dan perempuan menurut Hanbali. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5101} Disarankan untuk menyebutkan nama orang yang meninggal setelah lahir dan sebelum diberi nama. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5102} Nama-nama yang direkomendasikan adalah yang dikaitkan dengan Allah Yang Maha Kuasa, dan yang dikasihi oleh-Nya adalah Abdullah dan Abdur Rahman. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5102} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5103} Diperbolehkan menyebut nabi menurut kebanyakan orang, tetapi mereka tidak menyukai apa yang tidak disukai dengan meniadakan hal itu, seperti Rabah, Yassar, Najah, dan Falah, serta apa yang mengusir jiwa seperti perang dan kepahitan, serta melarang nama-nama khusus Allah Yang Maha Kuasa. Setiap kuil yang dikaitkan dengan selain Allah, seperti Abd al-Uzza dan Abd al-Kaaba. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5104} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5105} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5106} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5107} Diperbolehkan mengubah nama, dan disarankan untuk memperbaiki yang jelek darinya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5108} Diperbolehkan menamai alat, hewan, pakaian, dan bintang dengan nama Arab, tetapi dilarang menamai benda terlarang dengan nama lain agar yang terlarang diperbolehkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5109} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5111} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5112}"
