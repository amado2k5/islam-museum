  ar: "أوحى الله إلى النحل أن يتخذ من الجبال بيوتاً ومن الشجر ومما يعرشون ويأكل من كل الثمرات، فيخرج من بطونه شراب مختلف ألوانه فيه شفاء للناس، وسمّيت سورة النحل به."
