id: concept/badr-as-sign
class: concept
kind: belief
label: { ar: "بدر آية وعبرة", en: "Badr as a sign and a lesson", ur: "بدر ایک نشانی اور عبرت" }
summary:
  ar: "يقرأ الشعراوي موقعة بدر في آل عمران 13 آيةً ظاهرة: الفئة المؤمنة المقاتلة في سبيل الله غلبت الفئة الكافرة المقاتلة في سبيل الشيطان، ويرى أن الله قلّل الجيشين في أعين الطرفين قبل المعركة ثم كثّرهما فيها، وأن الله أراد النصر على ذات الشوكة لا على العير، وأن العبرة لأولي الأبصار {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1302} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1303} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1307}."
  en: "Sha'rawi reads the battle of Badr in Al Imran 13 as a visible sign: the believing group fighting for God overcame the disbelieving group fighting for Satan. He holds that God made the two hosts few in each other's eyes before the battle and many during it, that God wanted victory over the armed host and not only the caravan, and that the lesson is for those who see {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1302} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1303} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1307}."
  ur: "شعراوی آل عمران کی آیت 13 میں غزوۂ بدر کو ایک واضح نشانی کے طور پر پڑھتے ہیں: اللہ کی راہ میں لڑنے والا مومن گروہ شیطان کی راہ میں لڑنے والے کافر گروہ پر غالب آیا۔ ان کے نزدیک اللہ نے لڑائی سے پہلے دونوں لشکروں کو ایک دوسرے کی نظر میں کم دکھایا اور لڑائی میں زیادہ، اور اللہ کا ارادہ صرف قافلے پر نہیں بلکہ مسلح لشکر پر فتح کا تھا {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1302} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1303} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1307}۔"
