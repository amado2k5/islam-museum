id: concept/badr-as-sign
class: concept
kind: belief
label:
  ar: "بدر آية وعبرة"
  en: "Badr as a sign and a lesson"
  fr: "Badr comme signe et leçon"
  ur: "بدر ایک نشانی اور عبرت"
  es: "Badr como señal y lección"
  tr: "Badr bir ayet ve ders"
  id: "Badr adalah sebuah bait dan pelajaran"
summary:
  ar: "يقرأ الشعراوي موقعة بدر في آل عمران 13 آيةً ظاهرة: الفئة المؤمنة المقاتلة في سبيل الله غلبت الفئة الكافرة المقاتلة في سبيل الشيطان، ويرى أن الله قلّل الجيشين في أعين الطرفين قبل المعركة ثم كثّرهما فيها، وأن الله أراد النصر على ذات الشوكة لا على العير، وأن العبرة لأولي الأبصار {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1302} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1303} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1307}."
  en: "Sha'rawi reads the battle of Badr in Al Imran 13 as a visible sign: the believing group fighting for God overcame the disbelieving group fighting for Satan. He holds that God made the two hosts few in each other's eyes before the battle and many during it, that God wanted victory over the armed host and not only the caravan, and that the lesson is for those who see {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1302} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1303} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1307}."
  fr: "Sha'rawi lit la bataille de Badr en Al Imran 13 comme un signe visible : le groupe croyant combattant pour Dieu l’emporta sur le groupe mécréant combattant pour Satan. Selon lui, Dieu fit paraître les deux armées peu nombreuses l’une à l’autre avant la bataille, puis nombreuses pendant celle-ci ; Il voulait la victoire sur l’armée, non la seule caravane, et la leçon s’adresse à ceux qui voient {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1302} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1303} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1307}."
  ur: "شعراوی آل عمران کی آیت 13 میں غزوۂ بدر کو ایک واضح نشانی کے طور پر پڑھتے ہیں: اللہ کی راہ میں لڑنے والا مومن گروہ شیطان کی راہ میں لڑنے والے کافر گروہ پر غالب آیا۔ ان کے نزدیک اللہ نے لڑائی سے پہلے دونوں لشکروں کو ایک دوسرے کی نظر میں کم دکھایا اور لڑائی میں زیادہ، اور اللہ کا ارادہ صرف قافلے پر نہیں بلکہ مسلح لشکر پر فتح کا تھا {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1302} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1303} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1307}۔"
  es: "Sha'rawi lee la batalla de Badr en Al Imran 13 como una señal visible: el grupo de creyentes que luchaba por Dios venció al grupo de incrédulos que luchaba por Satanás. Sostiene que Dios hizo que los dos ejércitos fueran pocos a los ojos del otro antes de la batalla y muchos durante ella, que Dios quería la victoria sobre el ejército armado y no solo sobre la caravana, y que la lección es para aquellos que ven {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1302} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1303} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1307}."
  tr: "El-Şaarawi, İmran ailesinde Badr Savaşı'nı 13 açık ayet okur: Allah'ın yolunda savaşan inananlar, Şeytan uğruna savaşan inançsız grubu yendi. Tanrı'nın savaş öncesinde her iki tarafın gözünde ordu sayısını azalttığına ve sonra savaşta artırdığına, Tanrı'nın zaferi deve üzerinde değil, diken üzerinde zafer istediğine inanır ve dersin anlayışı olanlar için olduğunu {atıf:tafsir-sharawi-khawatir-scan-cilt 2 s.1302} {cite:tafsir-sharawi-khawatir-scan-vol-cilt 2 s.1303} {cite:tafsir-sharawi-khawatir-scan-vol-2 s.1307}"
  id: "Al-Shaarawi membacakan Pertempuran Badr dalam keluarga Imran 13 ayat jelas: Kelompok beriman yang berperang di jalan Allah mengalahkan kelompok kafir yang berjuang demi Setan. Ia percaya bahwa Tuhan mengurangi jumlah pasukan di mata kedua pihak sebelum pertempuran dan kemudian menambah jumlah mereka di dalamnya, dan bahwa Tuhan bermaksud menang atas duri itu sendiri, bukan atas unta, dan pelajarannya diberikan kepada mereka yang berwawasan {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1302} {cite:tafsir-sharawi-khawatir-scan-scan-vol-2 hlm.1303} {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1307}."
