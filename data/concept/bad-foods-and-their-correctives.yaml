id: concept/bad-foods-and-their-correctives
class: concept
kind: scientific
label:
  ar: "الأغذية الرديئة ومصلحاتها"
  en: "Bad foods and their correctives"
  fr: "Les mauvais aliments et leurs correctifs"
  ur: "خراب غذائیں اور ان کی اصلاح"
  es: "Alimentos poco saludables y sus soluciones"
  tr: "Kötü gıda ve faydaları"
  id: "Makanan buruk dan manfaatnya"
summary:
  ar: "يذكر ابن سينا أن الأغذية المولدة للمائية والخلط الغليظ والمراري تجلب الحميات، وأن بقول المرارية ربما نفعت في الشتاء كما تنفع التفهة في الصيف، وأن من صار إلى الأغذية الرديئة فليقلل مراتها ويخلط بها ما يضادها، فمن تأذى بالحلو شرب الحامض، ومن تأذى بالحامض تناول العسل والشراب العتيق، ويتدارك أذى الدسم بالقابضات والمر والمالح والحريف {cite:canon-ibn-sina-print-v1 pp.234-235}."
  en: "Ibn Sina says foods that breed wateriness, thick humour and bile bring fevers; bitter greens may help in winter as bland ones may in summer; one driven to bad foods should take them seldom and mix in their opposites, answering sweet with sour and sour with honey, and the harm of fat with astringents, bitter, salty and pungent things {cite:canon-ibn-sina-print-v1 pp.234-235}."
  fr: "Selon Ibn Sina, les aliments produisant une matière aqueuse, une humeur épaisse et de la bile entraînent des fièvres ; les légumes amers peuvent être utiles en hiver comme les fades en été. À celui qui est contraint de consommer de mauvais aliments, il conseille de le faire rarement et de les mêler à leurs contraires : corriger le doux par l’acide, l’acide par le miel, et les méfaits du gras par des substances astringentes, amères, salées et piquantes {cite:canon-ibn-sina-print-v1 pp.234-235}."
  es: "Ibn Sina dice que los alimentos que generan agua, humor espeso y bilis provocan fiebres; las verduras amargas pueden ayudar en invierno como las suaves en verano; quien se siente inclinado a comer alimentos malos debe consumirlos rara vez y mezclarlos con sus opuestos, respondiendo a lo dulce con lo ácido y a lo ácido con miel, y al daño de la grasa con cosas astringentes, amargas, saladas y picantes {cite:canon-ibn-sina-print-v1 pp.234-235}."
  ur: "ابن سینا کا کہنا ہے کہ ایسی غذائیں جن سے پانی، گاڑھا مزاح اور پت بخار پیدا ہوتا ہے۔ کڑوا ساگ سردیوں میں مدد کر سکتا ہے جیسا کہ گرمیوں میں ہلکا ہو سکتا ہے۔ خراب کھانوں کی طرف متوجہ ہونے والے کو ان کو شاذ و نادر ہی لینا چاہئے اور ان کے مخالف میں ملانا چاہئے، میٹھا جواب کھٹا اور کھٹا شہد کے ساتھ اور چکنائی کو کسیلی، کڑوی، نمکین اور تیکھی چیزوں سے نقصان پہنچانا چاہئے۔"
  tr: "İbn Sina, su, yoğun karışım ve acı veren yiyeceklerin ateş getirdiğini ve acı sözlerin kışın tıpkı önemsizliğin yazın faydalı olduğu gibi faydalı olabileceğini belirtir. Kötü yiyeceklere yönelen kişi acısını azaltmalı ve karşıtıyla karışmalıdır. Tatlılıktan zarar gören ekşi içer, ekşi içeceklerden zarar gören bal ve eski içeceklerle zarar görür ve yağların zararı büzülenler, acılığı, tuz ve acı biberle telafi edilir {cite:canon-ibn-sina-print-v1 s.234-235}."
  id: "Ibn Sina menyebutkan bahwa makanan yang menghasilkan air, campuran kental, dan kepahitan membawa demam, dan bahwa pepatah pahit itu mungkin bermanfaat di musim dingin seperti halnya hal sepele bermanfaat di musim panas. Siapa pun yang memilih makanan buruk harus mengurangi kepahitannya dan bercampur dengan yang berlawanan. Siapa pun yang dirugikan oleh kemanisan minum madu, dan siapa pun yang dirugikan oleh minuman asam madu dan minuman lama, dan kerusakan lemak dikompensasi dengan astringen, kepahitan, garam, dan cabai pedas {cite:canon-ibn-sina-print-v1 hlm.234-235}."
