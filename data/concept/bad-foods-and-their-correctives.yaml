summary:
  ar: "يذكر ابن سينا أن الأغذية المولدة للمائية والخلط الغليظ والمراري تجلب الحميات، وأن بقول المرارية ربما نفعت في الشتاء كما تنفع التفهة في الصيف، وأن من صار إلى الأغذية الرديئة فليقلل مراتها ويخلط بها ما يضادها، فمن تأذى بالحلو شرب الحامض، ومن تأذى بالحامض تناول العسل والشراب العتيق، ويتدارك أذى الدسم بالقابضات والمر والمالح والحريف {cite:canon-ibn-sina-print-v1 pp.234-235}."
  en: "Ibn Sina says foods that breed wateriness, thick humour and bile bring fevers; bitter greens may help in winter as bland ones may in summer; one driven to bad foods should take them seldom and mix in their opposites, answering sweet with sour and sour with honey, and the harm of fat with astringents, bitter, salty and pungent things {cite:canon-ibn-sina-print-v1 pp.234-235}."
