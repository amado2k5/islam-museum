id: concept/rubaiyyat-sinaat-al-mubdiin
class: concept
kind: term
label:
  ar: "رباعيات صناعة المبدعين"
  en: "The quartets of making creatives"
  ur: "مبدعین کی تیاری کے چوکون"
  es: "Los cuartetos de creadores"
  fr: "Les quatuors de créateurs en devenir"
  tr: "Yaratıcı Dörtlüler"
  id: "Kuartet Kreatif"
summary:
  ar: "منهجية طارق السويدان المستخلصة من سير عظماء الحضارة الإسلامية وعلوم الإدارة والتنمية البشرية — سماها أيضاً «أسرار العظماء»: أربع مراحل في كل منها أربعة عناصر، من شعلة البداية إلى العطاء الفذ، ويكفي لنهضة الأمة عنده اثنان في المئة من المبدعين."
  en: "Tareq al-Suwaidan's methodology distilled from the lives of the greats of Islamic civilisation and the sciences of management and human development — also called 'the secrets of the greats': four stages of four elements each, from the spark of beginning to unique giving; two per cent of creatives suffices, in his view, for the ummah's rise."
  ur: "طارق السویدان کی وہ ترکیب جو اس نے اسلامی تہذیب کے عظیم لوگوں کی سیر اور انتظامی و بشری ترقی کے علوم سے نکالی — اسے «عظیموں کے راز» بھی کہتے ہیں: چار مراحل جن میں ہر ایک کے چار عناصر ہیں، آغاز کی چنگاری سے لے کر منفرد عطاء تک؛ ان کے نزدیک امت کے اٹھنے کے لیے دو فیصد مبدعین کافی ہیں۔"
  es: "La metodología de Tareq al-Suwaidan, destilada de las vidas de las grandes figuras de la civilización islámica y de las ciencias de la gestión y el desarrollo humano —también conocida como \"los secretos de los grandes\"—, consta de cuatro etapas de cuatro elementos cada una, desde la chispa inicial hasta la generosidad excepcional; en su opinión, un dos por ciento de personas creativas basta para el ascenso de la ummah."
  fr: "La méthodologie de Tareq al-Suwaidan, tirée de la vie des grands de la civilisation islamique et des sciences du management et du développement humain — également appelées « les secrets des grands »: quatre étapes de quatre éléments chacune, de l'étincelle initiale au don unique; deux pour cent de créatifs suffisent, selon lui, à l'essor de l'oumma."
  tr: "İslam medeniyetinin büyük figürlerinin biyografilerinden ve yönetim ile insan gelişimi bilimlerinden türetilen Tariq Al-Suwaidan'ın metodolojisi, ona 'Büyüklerin Sırları' adını da vermiştir: her biri dört unsurdan oluşan dört aşama, ilk alevden olağanüstü yardıma kadar ve onun için yaratıcı insanların yüzde ikisi ulusun rönesansı için yeterlidir."
  id: "Metodologi Tariq Al-Suwaidan, yang berasal dari biografi tokoh-tokoh besar peradaban Islam dan ilmu manajemen serta perkembangan manusia, juga menyebutnya 'Rahasia Para Tokoh Besar': empat tahap, masing-masing berisi empat elemen, dari api awal hingga pemberian luar biasa, dan bagi dia, dua persen dari orang kreatif sudah cukup untuk kebangkitan bangsa."
