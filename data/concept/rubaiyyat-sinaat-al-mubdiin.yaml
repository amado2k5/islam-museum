label:
  ar: "رباعيات صناعة المبدعين"
  en: "The quartets of making creatives"
  ur: "مبدعین کی تیاری کے چوکون"
summary:
  ar: "منهجية طارق السويدان المستخلصة من سير عظماء الحضارة الإسلامية وعلوم الإدارة والتنمية البشرية — سماها أيضاً «أسرار العظماء»: أربع مراحل في كل منها أربعة عناصر، من شعلة البداية إلى العطاء الفذ، ويكفي لنهضة الأمة عنده اثنان في المئة من المبدعين."
  en: "Tareq al-Suwaidan's methodology distilled from the lives of the greats of Islamic civilisation and the sciences of management and human development — also called 'the secrets of the greats': four stages of four elements each, from the spark of beginning to unique giving; two per cent of creatives suffices, in his view, for the ummah's rise."
  ur: "طارق السویدان کی وہ ترکیب جو اس نے اسلامی تہذیب کے عظیم لوگوں کی سیر اور انتظامی و بشری ترقی کے علوم سے نکالی — اسے «عظیموں کے راز» بھی کہتے ہیں: چار مراحل جن میں ہر ایک کے چار عناصر ہیں، آغاز کی چنگاری سے لے کر منفرد عطاء تک؛ ان کے نزدیک امت کے اٹھنے کے لیے دو فیصد مبدعین کافی ہیں۔"
