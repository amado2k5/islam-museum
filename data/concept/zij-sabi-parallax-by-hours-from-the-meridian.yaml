label: { ar: "اختلاف المنظر بالساعات المعتدلة من نصف النهار", en: "Parallax by the equal hours from the meridian", ur: "نصف النہار سے معتدل گھنٹوں کے ذریعے اختلافِ منظر" }
summary:
  ar: "يبين البتاني أن اختلاف المنظر في الجداول يتغير بحسب بُعد الجزء الذي فيه القمر عن خط وسط السماء بالساعات المعتدلة، فيُعرف بُعد الجزء بساعات، ثم يُدخل في جداول الاختلاف لإقليم عرض البلد. {cite:zij-sabi-nallino-byblion p.124}."
  en: "Al-Battani shows that the parallax in the tables varies with the distance, in equal hours, of the Moon's degree from the mid-heaven line. That distance is found in hours and entered into the parallax tables for the clime nearest the latitude of the place. {cite:zij-sabi-nallino-byblion p.124}."
  ur: "البتانی بتاتے ہیں کہ جداول میں اختلافِ منظر اس فاصلے کے ساتھ بدلتا ہے جو چاند کے درجے کا وسط السماء کی لکیر سے معتدل گھنٹوں میں ہو؛ یہ فاصلہ گھنٹوں میں نکال کر اس اقلیم کے جدول میں داخل کیا جاتا ہے جو شہر کے عرض سے قریب ہو۔ {cite:zij-sabi-nallino-byblion p.124}۔"
