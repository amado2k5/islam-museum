id: concept/hadr-fiqh
class: concept
kind: legal
label: { ar: "هَدْر", en: "Hadr (blood and value wasted: no retaliation, no compensation)" }
summary:
  ar: "الهَدْر في اللغة البطلان، وفي الاصطلاح النفسُ الهدر وهي التي لا قَوَد فيها ولا دية ولا كفارة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16451} والأصل أن دم الإنسان معصوم، ويُستثنى منه المرتد باتفاق الفقهاء، فيقتله الإمام أو نائبه، ومن قتله غيرُ الإمام بغير إذنه فلا قصاص ولا دية عليه لكنه يُعزَّر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16452} ويُهدَر دم المبتدع ببدعة مكفِّرة، والكافر الحربي إلا إذا قاتل، أما غير المقاتل من النساء والصبيان والشيوخ والرهبان فلا يجوز قتله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16453} ويُهدَر دم الزاني المحصن عند جمهور الفقهاء، والحنفية يشترطون لذلك أن يكون القتل بعد القضاء به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16453} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16454} واختلف الفقهاء فيما إذا تغيرت حال المجروح بين العصمة والهدر قبل الموت، فذهب الجمهور إلى أن الجرح السابق على الإهدار غير مضمون، وقال ابن القاسم من المالكية بالدية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16454} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16455} وإذا رمى مسلم مهدرَ الدم فأسلم قبل إصابة السهم فلا قصاص عند جمهور الفقهاء، وأوجب الشافعية في الأصح دية مخففة على العاقلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16455} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16456} ويستوفي القصاص عند الشافعية قريبُ المقتول المسلم، وعند الحنابلة الإمامُ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16457} ولا يجب بذل الماء المحتاج إليه لمهدر الدم، ويجوز للمضطر قتله لإنقاذ نفسه عند الشافعية والحنابلة إذا لم يجد غيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16457} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16458} ومن قتل نفسه وقد أُهدر دمه بجناية لم يُكفَّر عنه ذلك القتل، إذ لا يُباح له إراقة دمه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16458}"
  en: "Hadr means waste or nullity; as a technical term, a hadr soul is one for which there is neither retaliation, diya nor expiation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16451} The principle is that a human life is protected, but an apostate is an exception agreed by the jurists: the imam or his deputy executes him, and if someone other than the imam kills him without authorisation there is no retaliation or diya, though he is disciplined (ta'zir). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16452} The blood of a heretic whose innovation is takfiri is also wasted, and so is that of a belligerent non-Muslim; non-combatants such as women, children, the old, and monks may not be killed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16453} The blood of a married adulterer is wasted in the view of most jurists; the Hanafis require that the killing follow a judgment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16453} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16454} Where a wounded person's status changed between protected and wasted before death, the majority hold the earlier wound unliable, while Ibn al-Qasim (Maliki) holds a diya due. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16454} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16455} If a Muslim shot a hadr person who then converted before the arrow struck, the majority hold no retaliation is due, while the Shafi'is hold, in the sounder view, a lighter diya paid by the kin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16455} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16456} For the Shafi'is the retaliation is claimed by the Muslim next of kin; for the Hanbalis it is the imam who executes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16457} A person whose blood is wasted need not be given water he needs, and the Shafi'is and Hanbalis permit a compelled person to kill such a person to save his own life if no other food is found. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16457} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16458} One whose blood was wasted by a crime who kills himself gets no expiation from that act, since he has no right to spill his own blood. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16458}"
