id: concept/canon-regimen-of-bodies-quick-to-receive-disease
class: concept
kind: scientific
label:
  ar: "تدبير الأبدان السريعة القبول عند ابن سينا"
  en: "The regimen of bodies quick to receive disease in the Canon"
  fr: "Régime des corps prédisposés aux maladies dans le Canon"
  ur: "جلد اثر قبول کرنے والے بدنوں کی تدبیر قانون میں"
  es: "El régimen de cuerpos propensos a contraer enfermedades en el Canon"
summary:
  ar: "يصف ابن سينا في الفصل الثالث الأبدان السريعة القبول، وهي مستعدة إما لامتلاء فتعدل كمية الأخلاط، وإما لأخلاط نيئة فتعدل كيفيتها، وتختار لها أغذية وسطى بين القليل والكثير، وتوزع التغذية ولا تحمل على الشبع التام مرة، ويقدم الغذاء أو يؤخر بحسب الحمام والتعرق وانصباب المرار {cite:canon-ibn-sina-print-v1 p.256}."
  en: "In the third chapter Ibn Sina describes bodies quick to receive disease, which are prone either from fullness, so the amount of the humours is made balanced, or from raw humours, so their quality is made balanced; foods are chosen that nourish moderately between little and much, meals are spread out and the person is not loaded to full satiety at once, and the food is advanced or delayed according to the bath, sweating and the pouring of bile {cite:canon-ibn-sina-print-v1 p.256}."
  fr: "Au chapitre 3, Ibn Sina décrit les corps prédisposés aux maladies : par pléthore, à corriger dans la quantité des humeurs, ou par humeurs crues, à corriger dans leur qualité. Il choisit une alimentation moyennement nourrissante, répartit les repas sans rassasier complètement en une fois, et en avance ou retarde l’heure selon bain, sudation et afflux bilieux {cite:canon-ibn-sina-print-v1 p.256}."
  es: "En el tercer capítulo, Ibn Sina describe cuerpos propensos a contraer enfermedades, que son propensos ya sea por exceso de líquidos, por lo que se equilibra la cantidad de humores, o por exceso de líquidos, por lo que se equilibra su calidad; se eligen alimentos que nutran moderadamente entre poco y mucho, las comidas se distribuyen y la persona no se llena hasta la saciedad completa de una sola vez, y la comida se adelanta o se retrasa según el baño, la sudoración y el flujo de bilis {cite:canon-ibn-sina-print-v1 p.256}."
  ur: "تیسرے باب میں ابن سینا نے ایسے جسموں کے بارے میں بتایا ہے جو جلدی بیماری کا شکار ہوتے ہیں، اس لیے مزاح کی مقدار کو متوازن بنایا جاتا ہے یا کچے مزاح سے، اس لیے ان کے معیار کو متوازن بنایا جاتا ہے۔ کھانے کا انتخاب کیا جاتا ہے جو تھوڑا اور بہت کے درمیان اعتدال سے پرورش پاتے ہیں، کھانے کو پھیلایا جاتا ہے اور ایک ہی وقت میں مکمل سیر نہیں ہوتا ہے، اور غسل، پسینہ اور پت کے بہانے کے مطابق کھانا پیش قدمی یا تاخیر سے ہوتا ہے۔"
