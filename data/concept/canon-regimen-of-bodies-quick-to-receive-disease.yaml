label: { ar: "تدبير الأبدان السريعة القبول عند ابن سينا", en: "The regimen of bodies quick to receive disease in the Canon", ur: "جلد اثر قبول کرنے والے بدنوں کی تدبیر قانون میں" }
summary:
  ar: "يصف ابن سينا في الفصل الثالث الأبدان السريعة القبول، وهي مستعدة إما لامتلاء فتعدل كمية الأخلاط، وإما لأخلاط نيئة فتعدل كيفيتها، وتختار لها أغذية وسطى بين القليل والكثير، وتوزع التغذية ولا تحمل على الشبع التام مرة، ويقدم الغذاء أو يؤخر بحسب الحمام والتعرق وانصباب المرار {cite:canon-ibn-sina-print-v1 p.256}."
  en: "In the third chapter Ibn Sina describes bodies quick to receive disease, which are prone either from fullness, so the amount of the humours is made balanced, or from raw humours, so their quality is made balanced; foods are chosen that nourish moderately between little and much, meals are spread out and the person is not loaded to full satiety at once, and the food is advanced or delayed according to the bath, sweating and the pouring of bile {cite:canon-ibn-sina-print-v1 p.256}."
