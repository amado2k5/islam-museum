label:
  ar: "المعضل"
  en: "Mu'dal (chain missing two or more links)"
summary:
  ar: "المعضل عند ابن الصلاح لقب لنوع خاص من المنقطع: ما سقط من إسناده اثنان فصاعداً، وسماه قوم مرسلاً. ومثاله ما يرويه تابع التابعي قائلاً: قال رسول الله، وقول المصنفين من الفقهاء: قال رسول الله كذا، وقول مالك: بلغني عن أبي هريرة. وجعل الحاكم منه أن يروي تابع التابعي عن التابعي حديثاً موقوفاً عليه وهو عند غيره متصل مرفوع، واستجاده ابن الصلاح. ويلحق به في كتابه بحثا العنعنة والتعليق {cite:muqaddima-ibn-salah-itr p. 59-61}."
  en: "For Ibn al-Salah mu'dal is a name for a special kind of munqati': a chain from which two or more narrators have dropped out, which some also call mursal. Examples are a Follower of the Successors saying 'the Messenger of God said', jurists writing 'the Messenger of God said such-and-such', and Malik's 'it reached me from Abu Hurayra'. Al-Hakim also counted as mu'dal a Follower's report stopping at a Successor when others transmit it connected to the Prophet, which Ibn al-Salah approved. He treats chains with 'an' and suspended chains as appendices to this type."
