"id": "concept/al-waram-al-sulb-fi-al-ria"
"class": "concept"
"kind": "scientific"
"label":
  "ar": "الورم الصلب في الرئة"
  "en": "The hard tumour in the lung"
  "fr": "Tumeur dure du poumon"
  "ur": "پھیپھڑے میں سخت ورم"
  "es": "El tumor duro en el pulmón"
"summary":
  "ar": "قد يعرض في الرئة ورم صلب، ويدل عليه ضيق النفس مع أنه يزداد على الأيام، ويكون\
    \ مع ثقل وقلة نفث وشدة يبوسة من السعال وتواتره، وربما خف في الأحيان مع قلة الحرارة\
    \ {cite:canon-ibn-sina-print-v2 p.352}"
  "en": "A hard tumour may occur in the lung; it is indicated by a shortness of breath\
    \ which moreover increases over the days, attended by a sense of weight, scant\
    \ expectoration, and a severe dryness of the cough with its frequency — and it\
    \ may sometimes grow lighter, with little heat {cite:canon-ibn-sina-print-v2 p.352}"
  "fr": "Une tumeur dure peut se former dans le poumon. Le Canon l’associe à un essoufflement qui s’aggrave au fil des jours, à une sensation de pesanteur, à des expectorations peu abondantes et à une toux fréquente et très sèche. Le mal peut parfois s’atténuer, avec peu de chaleur {cite:canon-ibn-sina-print-v2 p.352}"
  "ur": "پھیپھڑے میں سخت ورم ہو سکتا ہے اور اس کی دلیل تنگی نفس ہے جو دنوں دن بڑھتی\
    \ جاتی ہے اور ساتھ بوجھ نفث کی کمی اور کھانسی کی شدید خشکی اور تواتر ہوتا ہے اور\
    \ کبھی کم ہوتی ہے جب حرارت کم ہو {cite:canon-ibn-sina-print-v2 p.352}"
  "es": "Puede aparecer un tumor duro en el pulmón; se manifiesta con dificultad para respirar que, además, aumenta con el paso de los días, acompañada de sensación de pesadez, escasa expectoración y una tos seca y severa con frecuencia; a veces puede disminuir, con poco calor {cite:canon-ibn-sina-print-v2 p.352}"
