id: concept/intihab
class: concept
kind: legal
label: { ar: "الانتهاب", en: "Intihab (taking by force what is grabbed or distributed)", es: "Intihab (tomar por la fuerza lo que se agarra o se distribuye)", fr: "Intihab (prendre par la force ce qui est saisi ou distribué)", ur: "انتحاب ⁦(جو چیز چھینا یا تقسیم کیا جاتا ہے اسے زبردستی لینا)⁩" }
summary:
  ar: "الانتهاب أخذ الشيء قهرا ومغالبة، ويفترق عن الاختلاس والغصب والغلول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3456}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3457} وهو على ثلاثة أنواع: انتهاب ما لم يبحه مالكه وهو حرام بالإجماع، وانتهاب النثار المباح من مالكه وفيه خلاف في الكراهة والتحريم، وانتهاب ما أباحه مالكه ليتساوى الناس فيه ككل الوليمة، وهو حرام لما فيه من تجاوز المباح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3457}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3458}"
  en: "Intihab is taking a thing by force and contest. It differs from stealth, from usurpation and from pilfering the booty before division. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3456}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3457} It has three kinds: taking what the owner has not permitted, which is forbidden by agreement; taking what has been thrown open, such as the sweets thrown at a wedding, where the jurists differ between disliked and forbidden; and taking what the owner allowed to be shared equally, such as a banquet, which is forbidden because it goes beyond the permitted share. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3457}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3458}"
  es: "Intihab es tomar algo por la fuerza y mediante disputa. Se diferencia del sigilo, de la usurpación y del hurto del botín antes de su reparto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3456}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3457} Tiene tres tipos: tomar lo que el dueño no ha permitido, lo cual está prohibido por acuerdo; tomar lo que se ha ofrecido libremente, como los dulces que se arrojan en una boda, donde los juristas discrepan entre lo que es desagradable y lo que está prohibido; y tomar lo que el dueño permitió que se compartiera equitativamente, como un banquete, lo cual está prohibido porque excede la porción permitida. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3457}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3458}"
  fr: "L'intihab consiste à s'emparer d'une chose par la force et la contestation. Elle se distingue de la ruse, de l'usurpation et du pillage du butin avant partage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3456}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3457} Elle revêt trois formes: s'emparer de ce que le propriétaire n'a pas permis, ce qui est interdit par convention; s'emparer de ce qui a été jeté à découvert, comme les friandises lancées lors d'un mariage, pour lequel les juristes divergent entre ce qui est déconseillé et ce qui est interdit; et s'emparer de ce que le propriétaire a permis de partager équitablement, comme un banquet, ce qui est interdit car cela excède la part permise. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3457}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3458}"
  ur: "انتحاب زبردستی اور مقابلہ کر کے ایک چیز لے رہا ہے۔ یہ چپکے سے، غاصبانہ قبضے سے اور تقسیم سے پہلے مال غنیمت سے مختلف ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3456}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3457} اس کی تین قسمیں ہیں: وہ چیز لینا جس کی مالک نے اجازت نہ دی ہو، جو کہ معاہدے کے مطابق حرام ہے۔ جو کچھ کھلا پھینکا گیا ہو اسے لینا، جیسے شادی میں پھینکی گئی مٹھائی، جہاں فقہاء ناپسندیدہ اور حرام میں اختلاف رکھتے ہیں۔ اور جس چیز کو مالک نے یکساں طور پر بانٹنے کی اجازت دی ہے اسے لینا، جیسے ضیافت، جو کہ حرام ہے کیونکہ یہ جائز حصہ سے باہر ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3457}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3458}"
