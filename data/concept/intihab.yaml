id: concept/intihab
class: concept
kind: legal
label: { ar: "الانتهاب", en: "Intihab (taking by force what is grabbed or distributed)" }
summary:
  ar: "الانتهاب أخذ الشيء قهرا ومغالبة، ويفترق عن الاختلاس والغصب والغلول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3456}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3457} وهو على ثلاثة أنواع: انتهاب ما لم يبحه مالكه وهو حرام بالإجماع، وانتهاب النثار المباح من مالكه وفيه خلاف في الكراهة والتحريم، وانتهاب ما أباحه مالكه ليتساوى الناس فيه ككل الوليمة، وهو حرام لما فيه من تجاوز المباح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3457}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3458}"
  en: "Intihab is taking a thing by force and contest. It differs from stealth, from usurpation and from pilfering the booty before division. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3456}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3457} It has three kinds: taking what the owner has not permitted, which is forbidden by agreement; taking what has been thrown open, such as the sweets thrown at a wedding, where the jurists differ between disliked and forbidden; and taking what the owner allowed to be shared equally, such as a banquet, which is forbidden because it goes beyond the permitted share. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3457}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3458}"
