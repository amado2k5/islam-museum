label: { ar: "انقسام الشريان الأعظم إلى الفخذين وشرايين الرجلين عند ابن سينا", en: "The great artery's division at the sacrum and the arteries of the legs in the Canon", ur: "قانون میں بڑی شریان کی عجز پر تقسیم اور ٹانگوں کی شریانیں", es: "La división de la gran arteria en el sacro y las arterias de las piernas en el Canon", fr: "La division de la grande artère au niveau du sacrum et les artères des jambes dans le canon", tr: "İbn Sina'ya göre Büyük Arterin Femorroid ve Bacakların Arterine Bölünmesi", id: "Pembagian Arteri Besar menjadi Wasir dan Arteri Kaki menurut Ibn Sina" }
summary:
  ar: "إذا بلغ الشريان الكبير آخر الفقار انقسم هو والوريد المصاحب له كحرف اللام اليوناني، ويمتطي كل منهما عظم العجز آخذاً إلى الفخذ، وقبل موافاته الفخذ يخلف عرقاً إلى المثانة والسرة يظهر في الأجنة {cite:canon-ibn-sina-print-v1 pp.86-87}."
  en: "When the great artery reaches the end of the vertebrae it divides, with the vein that accompanies it, like the Greek letter lambda, and each part rides the sacrum toward the thigh, leaving before the thigh a vessel to the bladder and navel that shows in fetuses {cite:canon-ibn-sina-print-v1 pp.86-87}."
  es: "Cuando la gran arteria llega al final de las vértebras se divide, con la vena que la acompaña, como la letra griega lambda, y cada parte recorre el sacro hacia el muslo, dejando antes del muslo un vaso hacia la vejiga y el ombligo que se muestra en los fetos {cite:canon-ibn-sina-print-v1 pp.86-87}."
  fr: "Lorsque la grande artère atteint l'extrémité des vertèbres, elle se divise, avec la veine qui l'accompagne, comme la lettre grecque lambda, et chaque partie longe le sacrum vers la cuisse, laissant devant la cuisse un vaisseau vers la vessie et le nombril qui apparaît chez les fœtus {cite:canon-ibn-sina-print-v1 pp.86-87}."
  ur: "جب عظیم شریان فقرے کے آخر تک پہنچتی ہے تو یہ تقسیم ہو جاتی ہے، اس کے ساتھ آنے والی رگ کے ساتھ، جیسے یونانی حرف لیمبڈا، اور ہر حصہ سیکرم کو ران کی طرف لے جاتا ہے، ران سے پہلے مثانے اور ناف تک ایک برتن چھوڑ دیتا ہے جو جنین میں ظاہر ہوتا ہے۔"
  tr: "Ana arter omurların sonuna ulaştığında, Yunan harfi L gibi ayrılır. Her biri sakrum kemiği boyunca uyluğa doğru ilerler ve uyluğa ulaşmadan önce mesane ve göbek deliğinde bir damar bırakır; bu damar fetüslerde görülür {cite:canon-ibn-sina-print-v1 s.86-87}."
  id: "Ketika arteri utama mencapai ujung vertebra, arteri tersebut dan vena pendampingnya terbelah seperti huruf Yunani L. Masing-masing menunggangi tulang sakrum menuju paha, dan sebelum mencapai paha, arteri ini meninggalkan vena ke kandung kemih dan pusar, yang muncul pada janin {cite:canon-ibn-sina-print-v1 hlm.86-87}."
