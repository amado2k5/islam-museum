summary:
  ar: "في الحديث «ارموا بني إسماعيل فإن أباكم كان راميا»، وقد جاء في فهرس البخاري بروايةٍ عن سلمة بن الأكوع. {cite:sahih-al-bukhari p.1207} وفي جامع الترمذي، في باب المناقب، أن علي بن أبي طالب قال إن النبي جمع له أبويه يوم أحد لسعد بن أبي وقاص فقال له: «ارم فداك أبي وأمي»، وقال الترمذي إنه حسن صحيح. {cite:jami-al-tirmidhi p.853} ويجوز أخذ الجعل في السبق في النصل والخف والحافر، لحديث «لا سبق إلا في نصل أو خف أو حافر». {cite:usul-iqtisad-islami-0660 p. 229}"
  en: "The hadith «Shoot, sons of Isma'il, for your father was an archer» is recorded in Bukhari's index with a report from Salama ibn al-Akwa'. {cite:sahih-al-bukhari p.1207} In Tirmidhi's Virtues chapter, Ali reports that on the day of Uhud the Prophet told Sa'd ibn Abi Waqqas «Shoot; may my father and mother be your ransom», and Tirmidhi grades it hasan sahih. {cite:jami-al-tirmidhi p.853} A prize in a race is allowed only for arrows, hoof and nasl, on the hadith «there is no prize except in hoof, hoof or nasl». {cite:usul-iqtisad-islami-0660 p. 229}"
  fr: "Le hadith « Tirez, fils d’Isma’il, car votre père était un archer » est consigné dans l’index d’al-Bukhari avec un récit de Salama ibn al-Akwa’. {cite:sahih-al-bukhari p.1207} Dans le chapitre des Mérites de Tirmidhi, Ali rapporte que, le jour d’Uhud, le Prophète dit à Sa’d ibn Abi Waqqas « Tire ; que mon père et ma mère soient ta rançon », et Tirmidhi le juge hasan sahih. {cite:jami-al-tirmidhi p.853} Un prix dans une course n’est permis que pour les flèches, le sabot et le nasl, en vertu du hadith « pas de prix sauf pour le nasl, le khuff ou le hafir ». {cite:usul-iqtisad-islami-0660 p. 229}"
  ur: "حدیث «ارموا بني إسماعيل فإن أباكم كان راميا» بخاری کے فہرست میں سلمہ بن الاکوع کی روایت سے درج ہے۔ {cite:sahih-al-bukhari p.1207} احد کے دن نبی نے سعد بن ابی وقاص سے فرمایا: «ارم فداك أبي وأمي»، جو علی بن ابی طالب سے روایت ہے اور ترمذی نے اسے باب المناقب میں نقل کر کے حسن صحیح کہا۔ {cite:jami-al-tirmidhi p.853}"
  es: "El hadiz «Disparad, hijos de Isma'il, pues vuestro padre era arquero» está registrado en el índice de Bujari con un relato de Salama ibn al-Akwa'. {cite:sahih-al-bukhari p.1207} En el capítulo de Virtudes de Tirmidhi, Ali relata que el día de Uhud el Profeta le dijo a Sa'd ibn Abi Waqqas: «Disparad; que mi padre y mi madre sean vuestro rescate», y Tirmidhi lo clasifica como hasan sahih. {cite:jami-al-tirmidhi p.853} En una carrera, solo se permite un premio para flechas, pezuñas y nasl, según el hadiz «no hay premio excepto en pezuñas, pezuñas o nasl». {cite:usul-iqtisad-islami-0660 p. 229}"
  tr: "Hadiste şöyle der: \"Ateş edin İsmail'in oğulları, çünkü babanız bir atıcıydı,\" ve bu, Buhari'nin indeksinde Selame ibn Al-Akwa'dan bir rivayetle geçer. {alıntı:sahih-al-bukhari s.1207} Ve Cami'l-Tirmidhi'de, erdemler bölümünde, Ali ibn Ebi Talib'in, Peygamber'in Uhud gününde ailesini Sa'd ibn Ebi Vakkas'a topladığını ve ona: \"Babanı ve anneni fidye olarak at,\" dediğini ve El-Tirmidhi'nin bunun iyi ve gerçek olduğunu söylediği belirtilir. {cite:Jami-al-Tirmidhi s.853} Ayrıca, \"Önce kimse önce gelmez, sadece bir bıçak, çorap veya bir toynakta olmuştur\" hadisine dayanarak kılıç, deri ve toynakta öncelik almak da caizdir. {cite:usul-iqtisad-islami-0660 s. 229}"
  id: "Hadits berkata: \"Tembaklah, anak-anak Ismael, karena ayahmu adalah penembak,\" dan ini diceritakan dalam indeks Bukhari dari Salama ibn Al-Akwa. {kutipan: Sahih al-Bukhari hlm.1207} Dan dalam bagian tentang kebajikan dalam Jami'l-Tirmidhi, disebutkan bahwa Ali ibn Abi Talib mengumpulkan keluarganya untuk Sa'd ibn Abi Waqqas pada hari Uhud dan berkata kepadanya: \"Lemparkan ayah dan ibumu sebagai tebusan,\" dan Al-Tirmidhi mengatakan hal itu baik dan benar. {cite:Jami-al-Tirmidhi hlm.853} Selain itu, berdasarkan hadits \"Tidak ada yang didahulukan, hanya pisau, kaus kaki, atau kuku,\" diperbolehkan memprioritaskan pedang, kulit, dan kuku. {cite:Usul-iktisad-islami-0660 hlm. 229}"
