summary:
  ar: "تين في الكتاب له طبع ولأوراقه ولبنه قوة يتوعية، أجوده الأبيض ثم الأحمر ثم الأسود وشديد النضج منه قريب من أن لا يضر، رطبه كثير المائية قليل الدوائية ويابسه حار في الأولى لطيف، وهو أغذى من سائر الفواكه، قوي الجلاء منضج محلل ولبنه يجمد الذائب من الدماء ويذيب الجامد، ينفع من الخيلان والثآليل والبهق والدماميل والأورام العسرة التحليل، ويفتح سدد الكبد والطحال وينفع الكلى والمثانة، ويذكر الكتاب نفع لبنه من لسعة العقرب، ويورد أقوالا في الرحم والطمث وإدرار اللبن وأورام القضيب في فقرة معلقة لحكم المؤسس، وينقل أنه يقمل لفساد خلطه {cite:canon-ibn-sina-print-v1 pp.692-694}"
  en: "Tin is in the book a fruit with its own nature, its leaves and milk having a euphorbia-like power; the best is the white, then the red, then the black, and the very ripe is near to doing no harm; the fresh is very watery and little medicinal, the dry hot in the first degree and subtle, and it is more nourishing than the other fruits; it is strongly cleansing, ripening and dissolving, and its milk coagulates dissolved blood and dissolves the coagulated; it benefits moles, warts, bahaq, boils and swellings hard to dissolve, opens obstructions of the liver and spleen and benefits the kidneys and bladder; the book reports its milk against the scorpion sting, gives statements on the womb, menses, milk and the male organ in a labelled section held for the founder's ruling, and reports that it breeds lice through the badness of its humour {cite:canon-ibn-sina-print-v1 pp.692-694}"
  ur: "تین کتاب میں ایک پھل ہے جس کا اپنا مزاج ہے اور جس کے پتوں اور دودھ میں تیوعی قوت ہے؛ سب سے اچھا سفید ہے پھر سرخ پھر سیاہ، اور خوب پکا ہوا نقصان سے قریب قریب خالی ہے؛ تازہ بہت آبی اور کم دوائی ہے اور خشک پہلے درجے میں گرم اور لطیف ہے، اور یہ دوسرے پھلوں سے زیادہ غذا دیتا ہے؛ جلا دینے، پکانے اور تحلیل کرنے میں قوی ہے اور اس کا دودھ پگھلے ہوئے خون کو جماتا اور جمے ہوئے کو پگھلاتا ہے؛ تلوں، مسوں، بہق، پھوڑوں اور مشکل سے تحلیل ہونے والے ورموں میں نافع ہے، جگر اور تلی کی رکاوٹیں کھولتا ہے اور گردوں اور مثانے کو نفع دیتا ہے؛ کتاب اس کے دودھ کو بچھو کے ڈنک میں ذکر کرتی ہے، رحم، حیض، دودھ اتارنے اور قضیب کے بارے میں باتیں موسوم حصے میں دیتی ہے جو بانی کے فیصلے کے لیے موقوف ہے، اور نقل کرتی ہے کہ اپنی خلط کے بگاڑ کے سبب یہ جوئیں پیدا کرتا ہے {cite:canon-ibn-sina-print-v1 pp.692-694}۔"
  es: "En el libro, el estaño es una fruta con naturaleza propia, cuyas hojas y savia poseen un poder similar al de la euforbia; la mejor es la blanca, luego la roja, después la negra, y la muy madura casi no causa daño; la fresca es muy acuosa y poco medicinal, la seca es picante en primer grado y sutil, y es más nutritiva que las demás frutas; es fuertemente limpiadora, maduradora y disolvente, y su savia coagula la sangre disuelta y disuelve los coagulados; beneficia a lunares, verrugas, bahaq, forúnculos e hinchazones difíciles de disolver, desbloquea obstrucciones del hígado y el bazo y beneficia a los riñones y la vejiga; el libro menciona su savia contra la picadura de escorpión, hace afirmaciones sobre el útero, la menstruación, la savia y el órgano masculino en una sección etiquetada reservada para la decisión del fundador, e informa que genera piojos debido a la maldad de su humor {cite:canon-ibn-sina-print-v1 pp.692-694}"
  fr: "Le pain d'étain est décrit dans le livre comme un fruit aux propriétés uniques, dont les feuilles et le lait possèdent un pouvoir euphorisant. Le meilleur est le blanc, puis le rouge, puis le noir, et le pain très mûr est presque sans danger. Le pain frais est très aqueux et peu médicinal, le pain sec est chaud au premier degré et subtil, et il est plus nourrissant que les autres fruits. Il est fortement purifiant, mûrissant et dissolvant, et son lait coagule le sang dissous et dissout les caillots. Il est bénéfique pour les grains de beauté, les verrues, les bahaq, les furoncles et les gonflements difficiles à résorber, débloque les obstructions du foie et de la rate et est bénéfique pour les reins et la vessie. Le livre mentionne l'efficacité de son lait contre les piqûres de scorpion, donne des indications sur l'utérus, les menstruations, le lait et l'organe masculin dans une section réservée à l'avis du fondateur, et rapporte qu'il favorise la prolifération des poux en raison de la nature néfaste de son humeur. {cite:canon-ibn-sina-print-v1 pp.692-694}"
  tr: "Kitaptaki incirlerin bir türü vardır, yaprakları ve sütü güçlü bir farkındalık duygusuna sahiptir. En iyisi önce beyaz, sonra kırmızı, sonra siyahtır ve çok olgun, neredeyse zararsızdır. Nemli içeriği çok suludur, az tıbbi ve kuruluğu ilk kısımda sıcak ve hafiftir. Diğer meyvelerden daha besleyicidir. Drenajı güçlüdür, olgundur ve analiz edilmiştir. Sütü çözünmüş kanı dondurur ve katı maddeleri çözer. Atlar, siğiller, vitiligo, çıbanlar ve iyileşmesi zor tümörler için faydalıdır. Karaciğer ve dalak kapağını açar, böbrekler ve mesaneye faydalıdır ve sütünün akrep sokmaları için faydalı olduğunu belirtir. Ayrıca kurucunun kararına ilişkin askıya alınmış bir paragrafta rahim, adet dönemi, süt üretimi ve penil tümörlerle ilgili ifadeler içerir. Karışımının bozulması nedeniyle yaralandığını bildirir {alıntı::Canon-ibn-Sina-print-v1 s.692-694}"
  id: "Buah ara dalam buku ini memiliki jenis, daunnya, dan susunya memiliki rasa kesadaran yang kuat. Yang terbaik adalah putih, lalu merah, kemudian hitam, dan sangat matang, hampir tidak berbahaya. Kandungan lembapnya sangat encer, sedikit obat, dan kekeringannya panas pada buah pertama dan ringan. Buah ini lebih bergizi dibandingkan buah lain. Kuat dalam drainase, matang, dan dianalisis. Susunya membekukan darah terlarut dan melarutkan padatan. Ia bermanfaat bagi kuda, kutil, vitiligo, bisul, dan tumor yang sulit disembuhkan. Ia membuka katup hati dan limpa, bermanfaat bagi ginjal dan kandung kemih, dan menyebutkan bahwa susunya bermanfaat untuk sengatan kalajengking. Juga menyertakan pernyataan tentang rahim, menstruasi, produksi susu, dan tumor penis dalam paragraf yang ditangguhkan tentang putusan pendiri. Dilaporkan bahwa ia terluka karena korupsi campurannya {cite:canon-ibn-sina-print-v1 hlm.692-694}"
