label:
  ar: "تين"
  en: "Tin (entry on the fig)"
  ur: "تین"
summary:
  ar: "تين في الكتاب له طبع ولأوراقه ولبنه قوة يتوعية، أجوده الأبيض ثم الأحمر ثم الأسود وشديد النضج منه قريب من أن لا يضر، رطبه كثير المائية قليل الدوائية ويابسه حار في الأولى لطيف، وهو أغذى من سائر الفواكه، قوي الجلاء منضج محلل ولبنه يجمد الذائب من الدماء ويذيب الجامد، ينفع من الخيلان والثآليل والبهق والدماميل والأورام العسرة التحليل، ويفتح سدد الكبد والطحال وينفع الكلى والمثانة، ويذكر الكتاب نفع لبنه من لسعة العقرب، ويورد أقوالا في الرحم والطمث وإدرار اللبن وأورام القضيب في فقرة معلقة لحكم المؤسس، وينقل أنه يقمل لفساد خلطه {cite:canon-ibn-sina-print-v1 pp.692-694}"
  en: "Tin is in the book a fruit with its own nature, its leaves and milk having a euphorbia-like power; the best is the white, then the red, then the black, and the very ripe is near to doing no harm; the fresh is very watery and little medicinal, the dry hot in the first degree and subtle, and it is more nourishing than the other fruits; it is strongly cleansing, ripening and dissolving, and its milk coagulates dissolved blood and dissolves the coagulated; it benefits moles, warts, bahaq, boils and swellings hard to dissolve, opens obstructions of the liver and spleen and benefits the kidneys and bladder; the book reports its milk against the scorpion sting, gives statements on the womb, menses, milk and the male organ in a labelled section held for the founder's ruling, and reports that it breeds lice through the badness of its humour {cite:canon-ibn-sina-print-v1 pp.692-694}"
  ur: "تین کتاب میں ایک پھل ہے جس کا اپنا مزاج ہے اور جس کے پتوں اور دودھ میں تیوعی قوت ہے؛ سب سے اچھا سفید ہے پھر سرخ پھر سیاہ، اور خوب پکا ہوا نقصان سے قریب قریب خالی ہے؛ تازہ بہت آبی اور کم دوائی ہے اور خشک پہلے درجے میں گرم اور لطیف ہے، اور یہ دوسرے پھلوں سے زیادہ غذا دیتا ہے؛ جلا دینے، پکانے اور تحلیل کرنے میں قوی ہے اور اس کا دودھ پگھلے ہوئے خون کو جماتا اور جمے ہوئے کو پگھلاتا ہے؛ تلوں، مسوں، بہق، پھوڑوں اور مشکل سے تحلیل ہونے والے ورموں میں نافع ہے، جگر اور تلی کی رکاوٹیں کھولتا ہے اور گردوں اور مثانے کو نفع دیتا ہے؛ کتاب اس کے دودھ کو بچھو کے ڈنک میں ذکر کرتی ہے، رحم، حیض، دودھ اتارنے اور قضیب کے بارے میں باتیں موسوم حصے میں دیتی ہے جو بانی کے فیصلے کے لیے موقوف ہے، اور نقل کرتی ہے کہ اپنی خلط کے بگاڑ کے سبب یہ جوئیں پیدا کرتا ہے {cite:canon-ibn-sina-print-v1 pp.692-694}۔"
