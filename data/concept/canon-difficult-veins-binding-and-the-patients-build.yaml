label:
  ar: "العروق العسرة والربط وبنية المفصود عند ابن سينا"
  en: "Difficult veins, binding and the build of the patient in the Canon"
  fr: "Veines difficiles, ligature et constitution dans le Canon"
  ur: "قانون میں مشکل رگیں، پٹی اور مفصود کا ڈیل ڈول"
  es: "Venas difíciles, vendaje y constitución del paciente en el Canon"
summary:
  ar: "يعطي ابن سينا قواعد عملية لمن يعسر عليه فتح العرق: ترك الإلحاف بالربط والبضع، وحال الأبدان القضيفة والسمينة، وإخفاء الوجع، وما يفعل إذا ظهرت الشعب دون العرق، والغسل والرفادة {cite:canon-ibn-sina-print-v1 p.296}."
  en: "Ibn Sina gives practical rules for one who finds the vein hard to open: not to press on with binding and cutting, the state of lean and fat bodies, hiding the pain, what is done when the branches show but not the vein, and washing and the compress {cite:canon-ibn-sina-print-v1 p.296}."
  fr: "Ibn Sina expose les difficultés d’ouverture veineuse : éviter ligatures et incisions insistantes, tenir compte des corps maigres ou gras, masquer la douleur, reconnaître les branches sans veine visible, laver et poser la compresse {cite:canon-ibn-sina-print-v1 p.296}."
  es: "Ibn Sina da reglas prácticas para quien encuentra difícil abrir la vena: no presionar con vendajes y cortes, el estado de los cuerpos delgados y gordos, ocultar el dolor, qué hacer cuando se ven las ramas pero no la vena, y el lavado y la compresa {cite:canon-ibn-sina-print-v1 p.296}."
