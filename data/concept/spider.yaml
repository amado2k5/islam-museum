summary:
  ar: "مثل من اتخذ من دون الله أولياء كالعنكبوت اتخذت بيتاً وإن أوهن البيوت لبيت العنكبوت لو كانوا يعلمون، وسمّيت سورة العنكبوت بهذا المثل."
  en: "The likeness of those who take protectors besides God is the spider that takes a house, and the frailest of houses is the spider's house, if they only knew; the surah of the Spider is named for this parable."
  ur: "ان لوگوں کی مثال جو اللہ کے سوا کارساز بناتے ہیں مکڑی جیسی ہے جو گھر بناتی ہے اور سب گھروں میں کمزور ترین مکڑی کا گھر ہے کاش وہ جانتے؛ سورۃ العنکبوت اسی مثال کے نام پر ہے۔"
  es: "La semejanza de aquellos que toman protectores además de Dios es la de la araña que toma una casa, y la casa de la araña es la más frágil de todas, si tan solo lo supieran; la sura de la Araña recibe su nombre de esta parábola."
  fr: "Ceux qui prennent d'autres protecteurs que Dieu sont comparés à l'araignée qui prend une maison, et la plus fragile des maisons est celle de l'araignée, s'ils savaient seulement; la sourate de l'Araignée tire son nom de cette parabole."
