id: concept/canon-choosing-a-wet-nurse
class: concept
kind: scientific
label: { ar: "اختيار المرضعة وشروطها", en: "Choosing a wet nurse and her conditions", ur: "دایہ کا انتخاب اور اس کی شرائط" }
summary:
  ar: "إذا منع من إرضاع الطفل لبن أمه مانع من ضعف لبنها أو فساده أو رقته، اختيرت له مرضعة على شرائط في سنها وسحنتها وأخلاقها وهيئة ثديها وكيفية لبنها ومدة وضعها وجنس مولودها، ويفصلها ابن سينا {cite:canon-ibn-sina-print-v1 pp.205-209}."
  en: "When something prevents the mother's milk from nursing the child, whether weakness, corruption or thinness of her milk, a wet nurse is chosen on conditions of her age, build, character, breast, the quality of her milk, the time since her delivery and the sex of her child; Ibn Sina sets them out {cite:canon-ibn-sina-print-v1 pp.205-209}."
