label:
  ar: "فن الحوار والإنصات"
  en: "The art of dialogue and listening"
  ur: "مکالمے اور سننے کا فن"
  es: "El arte del diálogo y la escucha"
  fr: "L'art du dialogue et de l'écoute"
  tr: "Diyalog ve Dinleme Sanatı"
  id: "Seni Dialog dan Mendengarkan"
summary:
  ar: "يرى عمر عبد الكافي أن ضياع المودة والرحمة في البيوت سببه ضعف لغة الحوار، فيدعو إلى حوار هادئ في الوقت المناسب، وإلى الإنصات، ويميّز بين ذكاء اجتماعي وغباء اجتماعي."
  en: "Omar Abdelkafy holds that the loss of affection and mercy in homes comes from a weak language of dialogue, and calls for calm dialogue at the right time and for listening, distinguishing social intelligence from social stupidity."
  ur: "عمر عبد الکافی کے نزدیک گھروں سے محبت اور رحمت کا ختم ہونا مکالمے کی کمزور زبان کی وجہ سے ہے، اس لیے وہ مناسب وقت پر پرسکون مکالمے اور سننے کی دعوت دیتے ہیں، اور سماجی ذہانت اور سماجی حماقت میں فرق کرتے ہیں۔"
  es: "Omar Abdelkafy sostiene que la pérdida de afecto y compasión en los hogares proviene de un lenguaje de diálogo débil, y aboga por un diálogo sereno en el momento oportuno y por la escucha activa, distinguiendo la inteligencia social de la estupidez social."
  fr: "Omar Abdelkafy soutient que la perte d'affection et de compassion dans les foyers provient d'un langage de dialogue faible, et appelle à un dialogue calme au moment opportun et à l'écoute, distinguant l'intelligence sociale de la stupidité sociale."
  tr: "Omar Abdelkafi, evlerde sevgi ve merhamet kaybının, doğru zamanda sakin diyalog çağrısı yapan, dinleyen ve sosyal zeka ile sosyal aptallığı ayırt eden zayıf diyalog dili olduğuna inanıyor."
  id: "Omar Abdelkafi percaya bahwa hilangnya kasih sayang dan belas kasihan di rumah disebabkan oleh bahasa dialog yang lemah, menyerukan dialog yang tenang pada waktu yang tepat, mendengarkan dan membedakan antara kecerdasan sosial dan kebodohan sosial."
