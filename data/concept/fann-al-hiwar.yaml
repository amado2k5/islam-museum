summary:
  ar: "يرى عمر عبد الكافي أن ضياع المودة والرحمة في البيوت سببه ضعف لغة الحوار، فيدعو إلى حوار هادئ في الوقت المناسب، وإلى الإنصات، ويميّز بين ذكاء اجتماعي وغباء اجتماعي."
  en: "Omar Abdelkafy holds that the loss of affection and mercy in homes comes from a weak language of dialogue, and calls for calm dialogue at the right time and for listening, distinguishing social intelligence from social stupidity."
