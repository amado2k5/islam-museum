label: { ar: "عضل الوجه عند ابن سينا", en: "Facial muscles in the Canon", ur: "قانون میں چہرے کے پٹھے", es: "Músculos faciales en el Canon", fr: "Les muscles faciaux dans le Canon", tr: "İbn Sina'da yüz kası", id: "Otot wajah pada Ibn Sina" }
summary:
  ar: "يقول ابن سينا إن عضل الوجه على عدد الأعضاء المتحركة فيه، وهي الجبهة والمقلتان والجفنان العاليان والخد بشركة من الشفتين والشفتان والأرنبتان والفك الأسفل، ويفصّل عضل الجبهة والخد والشفة والمنخر {cite:canon-ibn-sina-print-v1 pp.61-63}."
  en: "Ibn Sina says the muscles of the face match the moving parts of the face: the forehead, the two eyeballs, the two upper eyelids, the cheek together with the lips, the lips, the two sides of the nose tip and the lower jaw; he details those of the forehead, cheek, lip and nostril {cite:canon-ibn-sina-print-v1 pp.61-63}."
  es: "Ibn Sina dice que los músculos de la cara coinciden con las partes móviles de la cara: la frente, los dos globos oculares, los dos párpados superiores, la mejilla junto con los labios, los labios, los dos lados de la punta de la nariz y la mandíbula inferior; detalla los de la frente, la mejilla, el labio y la fosa nasal {cite:canon-ibn-sina-print-v1 pp.61-63}."
  fr: "Ibn Sina dit que les muscles du visage correspondent aux parties mobiles du visage: le front, les deux globes oculaires, les deux paupières supérieures, la joue et les lèvres, les lèvres, les deux côtés de la pointe du nez et la mâchoire inférieure; il détaille ceux du front, de la joue, de la lèvre et de la narine {cite:canon-ibn-sina-print-v1 pp.61-63}."
  ur: "ابن سینا کہتے ہیں کہ چہرے کے پٹھے چہرے کے حرکت کرنے والے حصوں سے ملتے ہیں: پیشانی، دونوں آنکھوں کی گولیاں، دو اوپری پلکیں، گال اور ہونٹ، ہونٹ، ناک کی نوک کے دونوں اطراف اور نچلا جبڑا؛ وہ پیشانی، گال، ہونٹ اور نتھنے کی تفصیلات بیان کرتا ہے {حوالہ: کینن ابن سینا پرنٹ-v1 صفحہ 61-63}۔"
  tr: "İbn Sina, yüz kasının içindeki hareket eden organların sayısına bölündüğünü, bunlar alın, ayak bilekleri, üst göz kapakları ve yanak, dudaklar, tavşan ve alt çene kombinasyonuyla bölünür. Alın, yanak, dudak ve burun deliklerinin kasları ayrılmıştır {cite:canon-ibn-sina-print-v1 s.61-63}."
  id: "Ibn Sina mengatakan bahwa otot wajah dibagi oleh jumlah organ yang bergerak di dalamnya, yaitu dahi, pergelangan kaki, kelopak mata atas, dan pipi, dengan kombinasi bibir, bibir, kelinci, dan rahang bawah. Otot dahi, pipi, bibir, dan lubang hidung terpisah {cite:canon-ibn-sina-print-v1 hlm.61-63}."
