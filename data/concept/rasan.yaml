summary:
  ar: "الراسن في الكتاب منه بستاني ومنه نوع أوراقه مفروشة على الأرض وأنفع ما فيه أصله، حار يابس في الثانية، ينفع من الأورام والأوجاع الباردة وهيجان الرياح والنفخ ومن عرق النسا ووجع المفاصل، ويحلل الشقيقة البلغمية مع أنه مصدع، ويعين على النفث ويفرح ويقوي القلب، وينفع من نهش الهوام، ويذكر الكتاب أن طبيخ أصله يدر نقلا موسوما {cite:canon-ibn-sina-print-v1 p.665}"
  en: "Rasan is in the book of a garden kind and another kind whose leaves are spread on the ground, the most beneficial part being its root; it is hot and dry in the second degree, benefits swellings, cold pains, the stirring of winds and flatulence, sciatica and joint pain, dissolves phlegmatic migraine though it causes headache, helps expectoration, gladdens and strengthens the heart, and benefits the bites of vermin; the book also lists, as a labelled report, that a decoction of its root promotes the flow of the two {cite:canon-ibn-sina-print-v1 p.665}"
  ur: "راسن کتاب میں ایک باغی قسم کا ہے اور ایک اور قسم کا جس کے پتے زمین پر بچھے ہوتے ہیں، اور اس کا سب سے زیادہ نفع بخش حصہ اس کی جڑ ہے؛ دوسرے درجے میں گرم خشک ہے، ورموں، ٹھنڈے دردوں، ریاح کے بھڑکنے اور نفخ، عرق النسا اور جوڑوں کے درد میں نافع ہے، سر درد پیدا کرنے کے باوجود بلغمی آدھے سر کے درد کو تحلیل کرتا ہے، بلغم نکالنے میں مدد دیتا ہے، دل کو خوش کرتا اور قوت دیتا ہے، اور زہریلے جانوروں کے کاٹنے میں نافع ہے؛ کتاب منقول فہرست کے طور پر یہ بھی درج کرتی ہے کہ اس کی جڑ کا جوشاندہ دونوں کو جاری کرتا ہے {cite:canon-ibn-sina-print-v1 p.665}۔"
