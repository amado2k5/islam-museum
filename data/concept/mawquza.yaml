label: { ar: "المَوْقُوذَة (وحكم أكلها)", en: "The animal killed by a blow (mawquza) and whether it may be eaten", ur: "موقوذہ (ضرب سے مرا ہوا جانور)" }
summary:
  ar: "الموقوذة في اللغة ما يرمى أو يضرب بالعصا أو الحجر حتى تموت من غير تذكية، والوقيذ المغشي عليه. وقد ذكرها القرآن في المحرمات مع المنخنقة والمتردية والنطيحة وما أكل السبع، وأجمع الفقهاء على تحريم أكلها إذا لم تذك. واختلفوا في ذكاة الموقوذة إذا أدركت وفيها حياة، فقال جمهورهم تؤكل إن أدركت ذكاتها."
  en: "Mawquza in the lexicon is an animal struck with a stick or a stone until it dies without slaughter; a waqidh is one stunned. The Qur'an lists it among the forbidden animals with the strangled, the fallen, the gored and the beast's prey. The jurists agree it may not be eaten unless slaughtered; they differ on whether a mawquza still alive when slaughtered is lawful, the majority holding it lawful when the slaughter is made while it is still alive."
  ur: "موقوذہ وہ جانور ہے جو لاٹھی یا پتھر سے مارا جائے اور ذبح کیے بغیر مر جائے۔ قرآن نے اسے حرام جانوروں میں شمار کیا ہے۔ اگر ذبح کا موقع مل جائے اور جانور زندہ ہو تو جمہور کے نزدیک اسے کھانا جائز ہے۔"
