label: { ar: "المَوْقُوذَة ⁦(وحكم أكلها)⁩", en: "The animal killed by a blow (mawquza) and whether it may be eaten", ur: "موقوذہ ⁦(ضرب سے مرا ہوا جانور)⁩", es: "El animal muerto por un golpe (mawquza) y si se puede comer", fr: "L'animal tué d'un coup (mawquza) et s'il peut être consommé", tr: "Cezalandırılanlar (ve Onu Yenme Kararı)", id: "Yang Dihukum (dan Aturan tentang Memakannya)" }
summary:
  ar: "الموقوذة في اللغة ما يرمى أو يضرب بالعصا أو الحجر حتى تموت من غير تذكية، والوقيذ المغشي عليه. وقد ذكرها القرآن في المحرمات مع المنخنقة والمتردية والنطيحة وما أكل السبع، وأجمع الفقهاء على تحريم أكلها إذا لم تذك. واختلفوا في ذكاة الموقوذة إذا أدركت وفيها حياة، فقال جمهورهم تؤكل إن أدركت ذكاتها."
  en: "Mawquza in the lexicon is an animal struck with a stick or a stone until it dies without slaughter; a waqidh is one stunned. The Qur'an lists it among the forbidden animals with the strangled, the fallen, the gored and the beast's prey. The jurists agree it may not be eaten unless slaughtered; they differ on whether a mawquza still alive when slaughtered is lawful, the majority holding it lawful when the slaughter is made while it is still alive."
  ur: "موقوذہ وہ جانور ہے جو لاٹھی یا پتھر سے مارا جائے اور ذبح کیے بغیر مر جائے۔ قرآن نے اسے حرام جانوروں میں شمار کیا ہے۔ اگر ذبح کا موقع مل جائے اور جانور زندہ ہو تو جمہور کے نزدیک اسے کھانا جائز ہے۔"
  es: "En el léxico, mawquza es un animal golpeado con un palo o una piedra hasta que muere sin haber sido sacrificado; waqidh es aquel aturdido. El Corán lo incluye entre los animales prohibidos junto con los estrangulados, los caídos, los corneados y la presa de la bestia. Los juristas coinciden en que no se puede comer a menos que sea sacrificado; difieren en si es lícito sacrificar a un mawquza que aún está vivo, siendo la mayoría lícito si el sacrificio se realiza mientras el animal aún vive."
  fr: "Le terme « mawquza » désigne, dans le lexique, un animal frappé à mort avec un bâton ou une pierre sans être abattu; un « waqidh » est un animal étourdi. Le Coran le mentionne parmi les animaux interdits, au même titre que l'animal étranglé, l'animal tombé, l'animal blessé par un cornet et la proie de la bête. Les juristes s'accordent à dire qu'il est interdit de le consommer sans l'avoir abattu; ils divergent quant à la licéité de l'abattage d'un mawquza encore vivant, la majorité estimant qu'il est licite si l'abattage a lieu alors que l'animal est encore vivant."
  tr: "Dil boyunca, kırbaçlanan kadın, yanmadan ölene kadar atılan veya bir çubuk ya da taşla vurulan ve vaktis baygın kalan kişidir. Kur'an, boğulan, bozulan, kasap ve aslan yenmesiyle birlikte yasak konularda bahsetmiş ve hukukçular oybirliğiyle yakmadığı takdirde yemeğin yasak olduğunu kabul etmiştir. Kırbaçlanan kadının zekatı yenilirse ve canlıysa konusunda farklı görüşler yaşamışlardır; çoğunluk, zakatın yağına ulaşırsa yendiğini söylemiştir."
  id: "Dalam bahasa, wanita yang dicambuk adalah wanita yang dilempar atau dipukul dengan tongkat atau batu sampai dia meninggal tanpa dibakar, dan waqdith tidak sadarkan diri. Al-Qur'an menyebutkannya dalam hal-hal terlarang bersama dengan cekikan, pembusukan, penyembelih, dan pemakan singa, dan para ahli hukum sepakat bahwa memakannya dilarang jika tidak dibakar. Mereka berbeda pendapat mengenai zakat wanita yang dicambuk jika dikonsumsi dan memiliki kehidupan; mayoritas mengatakan bahwa zakat dimakan jika mencapai lemaknya."
