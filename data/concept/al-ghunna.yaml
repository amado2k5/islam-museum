summary:
  ar: "الصوت الصادر من الخيشوم، وقد جعله ابن الجزري مخرجًا مستقلاً سابع عشر، ويظهر في النون والميم المشددتين وفي الإخفاء والإقلاب وإدغام «ينمو» {cite:ar-wikisource}."
  en: "The sound issuing from the nasal passage, which Ibn al-Jazari makes the independent seventeenth makhraj; it appears in the doubled nun and mim and in ikhfa, iqlab and the idgham of «ينمو» {cite:ar-wikisource}."
