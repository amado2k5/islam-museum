summary:
  ar: "نبات يُسمّى عند بعضهم أدبار، ذو أوراق طويلة دقاقة تشبه ورق العدس، يظن أنه يفعل ما يفعله برشياوشان في جميع أفعاله."
  en: "A plant some call adbar, with long thin leaves like lentil leaves; it is thought to act like the Persian herb in all its actions."
  ur: "ایک پودا جسے بعض لوگ ادبار کہتے ہیں، جس کے لمبے باریک پتے مسور کے پتوں جیسے ہیں؛ خیال ہے کہ یہ اپنے تمام کاموں میں برشیاوشان جیسا اثر کرتا ہے۔"
  es: "Una planta que algunos llaman adbar, con hojas largas y delgadas como las de las lentejas; se cree que actúa como la hierba persa en todos sus efectos."
  fr: "Une plante que certains appellent adbar, avec de longues feuilles fines semblables à celles des lentilles; on pense qu'elle agit comme l'herbe persane dans tous ses aspects."
