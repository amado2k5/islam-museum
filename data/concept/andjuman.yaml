id: concept/andjuman
class: concept
kind: term
label:
  ar: "أنجمن ⁦(الجمعية)⁩"
  en: "Andjuman (association, society)"
  fr: "Andjuman (association, société)"
  es: "Andjuman (asociación, sociedad)"
  ur: "انجمن ⁦(انجمن، معاشرہ)⁩"
summary:
  ar: "كلمة فارسية معناها الاجتماع والجمعية والجيش، صارت تدل في العصر الحديث على الجمعيات الدينية ثم السياسية في إيران، وعلى الجمعيات العلمية والمهنية في تركيا والهند وباكستان، كمجمع «أنجمن ترقي أردو» {cite:encyclopaedia-of-islam-2 vol. 1 p. 529}."
  en: "A Persian word meaning meeting, assembly or army, which in modern times names confessional, then political associations in Iran, and learned and professional societies in Turkey, India and Pakistan, such as the Andjuman-i Taraqqi-i Urdu {cite:encyclopaedia-of-islam-2 vol. 1 p. 529}."
  fr: "Mot persan signifiant « réunion », « assemblée » ou « armée », qui désigne à l’époque moderne des associations confessionnelles, puis politiques en Iran, ainsi que des sociétés savantes et professionnelles en Turquie, en Inde et au Pakistan, notamment l’Andjuman-i Taraqqi-i Urdu {cite:encyclopaedia-of-islam-2 vol. 1 p. 529}."
  es: "Una palabra persa que significa reunión, asamblea o ejército, que en tiempos modernos nombra asociaciones confesionales y luego políticas en Irán, y sociedades académicas y profesionales en Turquía, India y Pakistán, como la Andjuman-i Taraqqi-i Urdu {cite:encyclopaedia-of-islam-2 vol. 1 p. 529}."
  ur: "ایک فارسی لفظ جس کا مطلب ہے میٹنگ، اسمبلی یا فوج، جسے جدید دور میں اعترافی، پھر ایران میں سیاسی انجمنوں، اور ترکی، ہندوستان اور پاکستان میں علمی اور پیشہ ورانہ معاشروں کا نام دیا جاتا ہے، جیسے کہ انجمنِ طریقتِ اردو۔ 1 ص۔ 529}۔"
