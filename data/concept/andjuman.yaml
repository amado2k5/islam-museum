label:
  ar: "أنجمن (الجمعية)"
  en: "Andjuman (association, society)"
summary:
  ar: "كلمة فارسية معناها الاجتماع والجمعية والجيش، صارت تدل في العصر الحديث على الجمعيات الدينية ثم السياسية في إيران، وعلى الجمعيات العلمية والمهنية في تركيا والهند وباكستان، كمجمع «أنجمن ترقي أردو» {cite:encyclopaedia-of-islam-2 vol. 1 p. 529}."
  en: "A Persian word meaning meeting, assembly or army, which in modern times names confessional, then political associations in Iran, and learned and professional societies in Turkey, India and Pakistan, such as the Andjuman-i Taraqqi-i Urdu {cite:encyclopaedia-of-islam-2 vol. 1 p. 529}."
