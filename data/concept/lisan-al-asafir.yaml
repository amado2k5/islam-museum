summary:
  ar: "لسان العصافير حار في الثالثة رطب في الأولى، في ورقه قبض وتنقية وإلحام، يدمل القروح الرطبة وينفع الخفقان ويزيد في الباه {cite:canon-ibn-sina-print-v1 p.541}."
  en: "Lisan al-asafir is hot in the third degree and moist in the first; its leaf has astringency, cleansing and joining, healing wet ulcers; it helps palpitation and, the book says, increases desire {cite:canon-ibn-sina-print-v1 p.541}."
  ur: "لسان العصافیر تیسرے درجے میں گرم اور پہلے میں تر ہے؛ اس کے پتے میں قبض، تنقیہ اور جوڑنا ہے، تر زخم بھرتا ہے اور دھڑکن میں مفید ہے، اور کتاب کے مطابق باہ بڑھاتا ہے {cite:canon-ibn-sina-print-v1 p.541}۔"
