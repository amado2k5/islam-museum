label:
  ar: "بسر"
  en: "Busr (unripe date) and balah"
  fr: "Busr (datte non mûre) et balah"
  ur: "بسر"
  es: "Busr (dátil verde) y balah"
summary:
  ar: "البسر هو التمر قبل أن يرطب لغضاضته، والبلح تمر النخيل قبل النضج، والاسمان يُذكران معاً في هذا الباب. باردان يابسان في الثانية، والبسر أقبض من القسب. ينفخان، ويحدثان قراقر الأمعاء والسدد، وكثيرهما يولد أخلاطاً غليظة، والبسر مصدع، وهما رديئان للصدر والرئة. يعقل البطن خاصة مع الخل، والبلح يغزر البول، وإذا شرب بخل عفص منع سيلان الرحم. وتذكر الكتاب أن استعمالهما يوقع في النافض والقشعريرة {cite:canon-ibn-sina-print-v1 p.393}، {cite:canon-ibn-sina-print-v1 p.394}."
  en: "Busr is the date while still unripe and firm; balah is the palm's fruit when still green, before it ripens. The two are discussed together here. Both are cold and dry in the second degree; the busr is more astringent than the qasb. Both cause wind, bowel rumbling and obstruction; much of them produces thick humours. Busr causes headache, and both are harmful to the chest and lung. Both bind the belly, especially with vinegar; balah increases urine, and drunk with astringent vinegar it stops discharge from the womb. The book says frequent use causes rigor and shivering {cite:canon-ibn-sina-print-v1 p.393}, {cite:canon-ibn-sina-print-v1 p.394}."
  fr: "Le busr est la datte encore ferme et non mûre ; le balah, le fruit vert avant maturité. Ils sont traités ensemble. Tous deux froids et secs au deuxième degré, le busr plus astringent que le qasb, produiraient vents, gargouillements et obstructions ; en quantité, des humeurs épaisses. Le busr provoquerait des céphalées ; tous deux nuiraient à la poitrine et au poumon et resserreraient le ventre, surtout avec vinaigre. Le balah favoriserait l’urine et, bu avec vinaigre astringent, arrêterait les écoulements utérins. Le livre associe l’usage fréquent aux frissons et tremblements {cite:canon-ibn-sina-print-v1 p.393}, {cite:canon-ibn-sina-print-v1 p.394}."
  ur: "بسر وہ کھجور ہے جو ابھی نرم اور کچی ہو، اور بلح کھجور کا پھل ہے جو پکنے سے پہلے ہوتا ہے؛ کتاب یہ دونوں یہاں ایک ساتھ بیان کرتی ہے۔ دونوں دوسرے درجے میں ٹھنڈے اور خشک ہیں؛ بسر قسب سے زیادہ قابض ہے۔ دونوں ہوا پیدا کرتے، آنتوں میں گڑگڑاہٹ اور رکاوٹ پیدا کرتے ہیں، اور زیادہ کھانے سے گاڑھی رطوبتیں پیدا ہوتی ہیں؛ بسر سر درد لاتا ہے، اور دونوں سینے اور پھیپھڑے کے لیے نقصان دہ ہیں۔ دونوں پیٹ باندھتے ہیں، خاص کر سرکے کے ساتھ؛ بلح پیشاب زیادہ لاتا ہے، اور قابض سرکے کے ساتھ پینے سے رحم کا بہاؤ روکتا ہے۔ کتاب کہتی ہے کہ ان کا زیادہ استعمال کپکپی اور رونگٹے کھڑے ہونے کا سبب بنتا ہے {cite:canon-ibn-sina-print-v1 p.393}، {cite:canon-ibn-sina-print-v1 p.394}۔"
  es: "Busr es el dátil cuando aún está verde y firme; balah es el fruto de la palma cuando aún está verde, antes de madurar. Ambos se discuten aquí juntos. Ambos son fríos y secos en segundo grado; el busr es más astringente que el qasb. Ambos causan gases, ruidos intestinales y obstrucción; en grandes cantidades producen humores espesos. Busr causa dolor de cabeza, y ambos son perjudiciales para el pecho y los pulmones. Ambos aprietan el estómago, especialmente con vinagre; balah aumenta la orina, y bebido con vinagre astringente detiene las secreciones uterinas. El libro dice que el uso frecuente causa rigor y escalofríos {cite:canon-ibn-sina-print-v1 p.393}, {cite:canon-ibn-sina-print-v1 p.394}."
