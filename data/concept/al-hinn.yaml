summary:
  ar: "الحِنّ بالحاء اسم لصنف يذكره اللغويون مع الجن؛ ففي لسان العرب أنه حيّ من الجنّية أو ضرب من الجن، ونقل قول الفراء إنه خلق بين الجن والإنس {cite:lisan-al-arab-alexandria-137940-v15 scan p. 705}. وفي خبر الضحاك عن ابن عباس عند الطبري أن إبليس كان من حيّ من الملائكة يقال لهم الحِنّ خُلقوا من نار السموم، ويصحح محقق الطبري ضبط الكلمة بالحاء ويفرق بينهم وبين الجن المخلوقين من مارج من نار {cite:tafsir-tabari-shakir-v01 PDF p. 459}."
  en: "Al-Hinn, spelled with ha', is a name for a class that the lexicographers mention beside the jinn: Lisan al-Arab calls it a clan of the jinn or a kind of jinn, and reports al-Farra' that it is a creation between the jinn and humans {cite:lisan-al-arab-alexandria-137940-v15 scan p. 705}. In al-Dahhak's report from Ibn Abbas in al-Tabari, Iblis was of a clan of angels called al-Hinn, created from the fire of the scorching wind; al-Tabari's editor corrects the spelling to ha' and distinguishes them from the jinn created from a flame of fire {cite:tafsir-tabari-shakir-v01 PDF p. 459}."
  fr: "Al-Hinn, écrit avec un ha', est le nom d'une catégorie que les lexicographes mentionnent à côté des djinns : le Lisan al-Arab en fait un clan des djinns ou une sorte de djinns, et rapporte d'al-Farra' qu'il s'agit d'une création intermédiaire entre les djinns et les humains {cite:lisan-al-arab-alexandria-137940-v15 scan p. 705}. Dans le récit d'al-Dahhak d'après Ibn Abbas chez al-Tabari, Iblis appartenait à un clan d'anges appelé al-Hinn, créé du feu du vent brûlant ; l'éditeur d'al-Tabari corrige l'orthographe en ha' et les distingue des djinns créés d'une flamme de feu {cite:tafsir-tabari-shakir-v01 PDF p. 459}."
  ur: "الحِنّ، حاء کے ساتھ، ایک صنف کا نام ہے جسے اہلِ لغت جنوں کے ساتھ ذکر کرتے ہیں؛ لسان العرب اسے جنّیہ کا ایک قبیلہ یا جن کی ایک قسم بتاتی ہے اور فراء کا قول نقل کرتی ہے کہ یہ جن اور انسان کے بیچ کی مخلوق ہے {cite:lisan-al-arab-alexandria-137940-v15 scan p. 705}۔ طبری میں ضحاک کی ابن عباس سے روایت کے مطابق ابلیس فرشتوں کے ایک قبیلے «الحِنّ» سے تھا جو لو کی آگ سے پیدا ہوا؛ طبری کے محقق لفظ کو حاء سے درست کرتے ہیں اور انہیں اس جن سے الگ بتاتے ہیں جو شعلۂ آتش سے پیدا ہوا {cite:tafsir-tabari-shakir-v01 PDF p. 459}۔"
  es: "Al-Hinn, escrito con ha', es el nombre de una clase que los lexicógrafos mencionan junto a los jinn: Lisan al-Arab lo llama un clan de jinn o un tipo de jinn, e informa al-Farra' que es una creación entre los jinn y los humanos {cite:lisan-al-arab-alexandria-137940-v15 scan p. 705}. En el informe de al-Dahhak de Ibn Abbas en al-Tabari, Iblis era de un clan de ángeles llamado al-Hinn, creados del fuego del viento abrasador; el editor de al-Tabari corrige la ortografía a ha' y los distingue de los jinn creados de una llama de fuego {cite:tafsir-tabari-shakir-v01 PDF p. 459}."
  tr: "'Ha' harfiyle El-Han, dilbilimciler tarafından cinlerin yanında kullanılan bir terimdir; Lisan el-Arab'ta ise cin veya bir tür cinden gelen 'canlı varlık' ve El-Farra' bunu cinler ile insanlar arasında yaratılmış bir yaratım olarak alıntılamıştır {cite:lisan-al-arab-alexandria-137940-v15 tarama s. 705}. Al-Tabari'nin İbn Abbas'tan Al-Dahhak raporunda, İblis'in zehir ateşinden yaratılmış yaşayan bir melek olan Al-Han olduğu söylenir. Al-Tabari'nin editörü, kelimenin yazılışını 'ha' ile düzeltir ve onları ateş yılanından yaratılan cinlerden ayırır {cite:tafsir-tabari-shakir-v01 PDF s. 459}."
  id: "Dengan huruf 'Ha', Al-Khan adalah istilah yang digunakan oleh ahli bahasa bersama jin; dalam Lisan al-Arab, istilah ini merujuk pada 'makhluk hidup' yang berasal dari jin atau jenis jin, dan El-Farra mengutipnya sebagai ciptaan yang diciptakan antara jin dan manusia {cite:lisan-al-arab-alexandria-137940-v15 scan hlm. 705}. Dalam laporan Al-Tabari dari Ibn Abbas tentang Al-Dahhak, dikatakan bahwa Al-Han adalah malaikat hidup yang diciptakan dari api beracun. Editor Al-Tabari mengoreksi ejaan kata itu dengan 'ha' dan membedakannya dari jin yang diciptakan dari ular api {cite:tafsir-tabari-shakir-v01 PDF hlm. 459}."
