id: concept/hisab-umra-fi-ramadan
class: concept
kind: doctrine
label:
  ar: "عمرة في رمضان تعدل حجة"
  en: "An umra in Ramadan equals a hajj"
  ur: "رمضان کا عمرہ حج کے برابر"
summary:
  ar: "قال النبي لامرأة من الأنصار فاتها الحج معه لأن بعير أهلها كان مشغولا: إذا جاء رمضان فاعتمري، فإن عمرة فيه تعدل حجة، في رواية ابن عباس عند مسلم [[passage/muslim-api-3037]]. والقصة تبيّن أن المعادلة جاءت جوابا لمن فاته العمل الأكبر بعذر."
  en: "The Prophet said to a woman of the Ansar who had missed the hajj with him because her household's camel was in use: when Ramadan comes, perform the umra, for an umra in it equals a hajj, in Ibn Abbas's narration in Muslim [[passage/muslim-api-3037]]. The story shows that the equation came as an answer to someone who had missed the greater act for a reason."
  ur: "نبی نے انصار کی ایک خاتون سے، جو گھر کے اونٹ کے مصروف ہونے کی وجہ سے آپ کے ساتھ حج نہ کر سکی تھیں، فرمایا: جب رمضان آئے تو عمرہ کر لینا، کیونکہ اس میں عمرہ حج کے برابر ہے، ابن عباس کی روایت میں جو مسلم میں ہے [[passage/muslim-api-3037]]۔ واقعہ بتاتا ہے کہ یہ مساوات اس کے جواب میں آئی جس سے بڑا عمل عذر کی وجہ سے رہ گیا تھا۔"
