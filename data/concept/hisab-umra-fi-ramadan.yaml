id: concept/hisab-umra-fi-ramadan
class: concept
kind: doctrine
label:
  ar: "عمرة في رمضان تعدل حجة"
  en: "An umra in Ramadan equals a hajj"
  ur: "رمضان کا عمرہ حج کے برابر"
  es: "Una umra en Ramadán equivale a un hajj."
  fr: "Une umra pendant le Ramadan équivaut à un hajj."
  tr: "Ramazan'daki Umre, Hac'a eşdeğerdir"
  id: "Umrah dalam Ramadan setara dengan Hajijah"
summary:
  ar: "قال النبي لامرأة من الأنصار فاتها الحج معه لأن بعير أهلها كان مشغولا: إذا جاء رمضان فاعتمري، فإن عمرة فيه تعدل حجة، في رواية ابن عباس عند مسلم [[passage/muslim-api-3037]]. والقصة تبيّن أن المعادلة جاءت جوابا لمن فاته العمل الأكبر بعذر."
  en: "The Prophet said to a woman of the Ansar who had missed the hajj with him because her household's camel was in use: when Ramadan comes, perform the umra, for an umra in it equals a hajj, in Ibn Abbas's narration in Muslim [[passage/muslim-api-3037]]. The story shows that the equation came as an answer to someone who had missed the greater act for a reason."
  ur: "نبی نے انصار کی ایک خاتون سے، جو گھر کے اونٹ کے مصروف ہونے کی وجہ سے آپ کے ساتھ حج نہ کر سکی تھیں، فرمایا: جب رمضان آئے تو عمرہ کر لینا، کیونکہ اس میں عمرہ حج کے برابر ہے، ابن عباس کی روایت میں جو مسلم میں ہے [[passage/muslim-api-3037]]۔ واقعہ بتاتا ہے کہ یہ مساوات اس کے جواب میں آئی جس سے بڑا عمل عذر کی وجہ سے رہ گیا تھا۔"
  es: "El Profeta le dijo a una mujer de los Ansar que no había podido realizar el Hajj con él porque el camello de su familia estaba ocupado: «Cuando llegue Ramadán, realiza la Umrah, pues una Umrah en este mes equivale a un Hajj», según la narración de Ibn Abbas en Muslim [[passage/muslim-api-3037]]. La historia muestra que esta equivalencia surgió como respuesta a alguien que, por alguna razón, no había podido realizar el acto más importante."
  fr: "Le Prophète dit à une femme des Ansar qui avait manqué le hajj avec lui car le chameau de sa famille était occupé: « Lorsque viendra le Ramadan, accomplis la umra, car une umra accomplie durant ce mois équivaut à un hajj », d'après le hadith rapporté par Ibn Abbas dans Muslim [[passage/muslim-api-3037]]. Ce récit montre que cette équivalence fut donnée en réponse à une personne qui, pour une raison valable, avait manqué le pèlerinage."
  tr: "Peygamber, ailesinin devesinin meşgul olması nedeniyle Hacı kaçıran Ensar'dan bir kadına şöyle demiştir: Ramazan geldiğinde Umre ayini edin, çünkü umre sırasında Umre kılın. İbn Abbas'ın Müslüman dilindeki rivayetinde [[passage/muslim-api-3037]]. Hikaye, denklemin, büyük işi kaçıranlara bir bahane ile karşılık olarak verildiğini açıklar."
  id: "Nabi berkata kepada seorang wanita dari Ansar yang melewatkan Haji bersamanya karena unta keluarganya sibuk: Ketika Ramadan tiba, lakukan Umrah, karena melakukan Umrah selama Ramadan setara dengan Haji. Dalam riwayat Ibn Abbas dalam Muslim [[passage/muslim-api-3037]]. Cerita ini menjelaskan bahwa persamaan diberikan sebagai jawaban kepada mereka yang melewatkan perbuatan besar dengan alasan."
