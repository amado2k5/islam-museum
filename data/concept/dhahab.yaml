summary:
  ar: "ذهب في الكتاب جوهر شريف لطيف معتدل، تدخل سحالته في أدوية السوداء وأفضل الكي وأسرعه برءا ما كان بمكوى من ذهب، وإمساكه في الفم يزيل البخر، وتدخل سحالته في أدوية داء الثعلب وداء الحية، ويقوي العين كحلا، وينفع من أوجاع القلب والخفقان وحديث النفس {cite:canon-ibn-sina-print-v1 p.719}"
  en: "Dhahab is in the book a noble substance, subtle and balanced; its filings enter the drugs for melancholy, the best and quickest-healing cautery is that made with a cautery iron of gold, holding it in the mouth removes foul breath, its filings enter the drugs for da' al-tha'lab and da' al-hayya, it strengthens the eye as kohl, and it benefits pains of the heart, palpitation and hadith al-nafs {cite:canon-ibn-sina-print-v1 p.719}"
  ur: "ذہب کتاب میں ایک شریف جوہر ہے، لطیف اور معتدل؛ اس کا برادہ سودا کی دواؤں میں داخل ہوتا ہے، اور بہترین اور سب سے جلد شفا دینے والا داغنا وہ ہے جو سونے کی سلاخ سے ہو، اسے منہ میں رکھنا بدبو دور کرتا ہے، اس کا برادہ داء الثعلب اور داء الحیہ کی دواؤں میں داخل ہوتا ہے، سرمے کی صورت میں آنکھ کو قوت دیتا ہے، اور دل کے دردوں، دھڑکن اور حدیث النفس میں نافع ہے {cite:canon-ibn-sina-print-v1 p.719}۔"
  es: "En el libro, el dhahab es una sustancia noble, sutil y equilibrada; sus limaduras se incorporan a los medicamentos para la melancolía, la mejor y más rápida cauterización es la realizada con un hierro de oro, sostenerlo en la boca elimina el mal aliento, sus limaduras se incorporan a los medicamentos para da' al-tha'lab y da' al-hayya, fortalece el ojo como el kohl y beneficia los dolores del corazón, las palpitaciones y el hadith al-nafs {cite:canon-ibn-sina-print-v1 p.719}"
  fr: "Le dhahab est décrit dans le livre comme une substance noble, subtile et équilibrée; ses particules entrent dans la composition de remèdes contre la mélancolie. Le meilleur et le plus rapide cautérisant est celui fabriqué avec un fer à cautériser en or; le garder en bouche élimine la mauvaise haleine. Ses particules entrent également dans la composition de remèdes pour le da' al-tha'lab et le da' al-hayya. Il fortifie l'œil comme le khôl et soulage les douleurs cardiaques, les palpitations et les troubles du comportement alimentaire. (Voir: Canon Ibn Sina, vol. 1, p. 719)"
