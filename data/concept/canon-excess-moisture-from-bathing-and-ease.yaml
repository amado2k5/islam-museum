id: concept/canon-excess-moisture-from-bathing-and-ease
class: concept
kind: scientific
label:
  ar: "فضل الرطوبة من فرط الاستحمام والترفه عند ابن سينا"
  en: "Excess moisture from bathing and ease in the Canon"
  fr: "Humidité excessive par bains et oisiveté dans le Canon"
  ur: "غسل اور آسائش سے رطوبت کی زیادتی قانون میں"
  es: "Exceso de humedad del baño y facilidad en el Canon"
summary:
  ar: "يقول ابن سينا إن فرط الاستحمام والاستكثار من الغذاء والشراب والترفه قد يشعر الإنسان بفضل رطوبة في أعضائه خصوصاً لسانه تضر بأفعالها، ويعالج بالرياضة القوية والدلك الخشن اليابس بلا دهن {cite:canon-ibn-sina-print-v1 p.247}."
  en: "Ibn Sina says that too much bathing, too much food and drink and a life of ease can make a person feel a surplus of moisture in his limbs, especially the tongue, that harms their actions, and treats it with strong exercise and rough dry rubbing without oil {cite:canon-ibn-sina-print-v1 p.247}."
  fr: "Ibn Sina attribue aux bains et prises alimentaires excessifs et à l’oisiveté une humidité ressentie dans les membres, surtout la langue, gênant leur fonctionnement ; il décrit exercice fort et friction rude sèche sans huile {cite:canon-ibn-sina-print-v1 p.247}."
  es: "Ibn Sina dice que bañarse demasiado, comer y beber en exceso y una vida de comodidad pueden hacer que una persona sienta un exceso de humedad en sus extremidades, especialmente en la lengua, lo que perjudica sus funciones, y lo trata con ejercicio intenso y frotamiento seco y áspero sin aceite {cite:canon-ibn-sina-print-v1 p.247}."
  ur: "ابن سینا کا کہنا ہے کہ بہت زیادہ نہانا، بہت زیادہ کھانا پینا اور آرام کی زندگی انسان کو اپنے اعضاء بالخصوص زبان میں نمی کی زیادتی کا احساس دلاتی ہے، جو اس کے افعال کو نقصان پہنچاتی ہے، اور اس کا علاج سخت ورزش اور بغیر تیل کے کھردرے خشک مالش سے کرتا ہے۔"
