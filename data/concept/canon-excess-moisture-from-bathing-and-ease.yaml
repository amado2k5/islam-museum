summary:
  ar: "يقول ابن سينا إن فرط الاستحمام والاستكثار من الغذاء والشراب والترفه قد يشعر الإنسان بفضل رطوبة في أعضائه خصوصاً لسانه تضر بأفعالها، ويعالج بالرياضة القوية والدلك الخشن اليابس بلا دهن {cite:canon-ibn-sina-print-v1 p.247}."
  en: "Ibn Sina says that too much bathing, too much food and drink and a life of ease can make a person feel a surplus of moisture in his limbs, especially the tongue, that harms their actions, and treats it with strong exercise and rough dry rubbing without oil {cite:canon-ibn-sina-print-v1 p.247}."
