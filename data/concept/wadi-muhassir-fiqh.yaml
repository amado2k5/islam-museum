label: { ar: "وادي مُحَسِّر", en: "Wadi Muhassir (the valley between Mina and Muzdalifa on the pilgrimage)", es: "Wadi Muhassir (el valle entre Mina y Muzdalifa en la ruta de peregrinación)", fr: "Wadi Muhassir (la vallée entre Mina et Muzdalifa sur le lieu de pèlerinage)", ur: "وادی محسیر ⁦(حج کے موقع پر منیٰ اور مزدلفہ کے درمیان کی وادی)⁩", tr: "Wadi Muhasir", id: "Wadi Muhasir" }
summary:
  ar: "وادي محسّر موضع فاصل بين مزدلفة ومنى ليس من واحدة منهما، وسُمّي بذلك لأن فيل أبرهة كلّ فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16598} ويستحب للحجاج إذا بلغوه بعد الدفع من مزدلفة أن يسرعوا قدر رمية حجر، لأن النبي حرّك ناقته قليلاً عند بطن محسّر، ولأن الفقهاء ذكروا أنه محل نزول عذاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16598} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16599} ويُسنّ عند المرور به دعاء عمر بن الخطاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16599} وذهب جمهور الفقهاء إلى أن وادي محسّر ليس من منى ولا من مزدلفة، وأن الوقوف فيه لا يجزئ، لقوله في حديث: «المزدلفة كلها موقف وارفعوا عن بطن محسّر». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16599} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16600} وقال بعض الشافعية إنه من منى، واستدلوا بحديث الفضل بن عباس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16600}"
  en: "Wadi Muhassir is the valley that lies between Mina and Muzdalifa and belongs to neither; it is named for Abraha's elephant, which stumbled there. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16598} Pilgrims are recommended to hasten for about a stone's throw when they reach it after leaving Muzdalifa, since the Prophet moved his camel gently at the valley's bed, and the jurists note that it is a place where punishment fell. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16598} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16599} Passing it, the prayer of Umar ibn al-Khattab is recommended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16599} Most jurists hold that Wadi Muhassir is neither Mina nor Muzdalifa and that standing there does not suffice, on the Prophet's words that the whole of Muzdalifa is a place of standing and that one should leave the bed of Muhassir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16599} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16600} Some Shafi'is say it is part of Mina, citing the report of al-Fadl ibn Abbas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16600}"
  es: "Wadi Muhassir es el valle que se encuentra entre Mina y Muzdalifa y no pertenece a ninguno de los dos; recibe su nombre del elefante de Abraha, que tropezó allí. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16598} Se recomienda a los peregrinos apresurarse aproximadamente una distancia de un tiro de piedra cuando llegan a él después de salir de Muzdalifa, ya que el Profeta movió su camello suavemente en el lecho del valle, y los juristas señalan que es un lugar donde cayó el castigo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16598} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16599} Al pasar por él, se recomienda la oración de Umar ibn al-Khattab. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16599} La mayoría de los juristas sostienen que Wadi Muhassir no es ni Mina ni Muzdalifa y que permanecer allí no es suficiente, basándose en las palabras del Profeta de que todo Muzdalifa es un lugar para estar de pie y que uno debe abandonar el lecho de Muhassir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16599} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16600} Algunos shafi'ís afirman que forma parte de Mina, citando el relato de al-Fadl ibn Abbas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16600}"
  fr: "Le Wadi Muhassir est la vallée située entre Mina et Muzdalifa, n'appartenant à aucune des deux. Elle doit son nom à l'éléphant d'Abraha qui y trébucha. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16598} Il est conseillé aux pèlerins de s'y rendre rapidement, à quelques encablures, après avoir quitté Muzdalifa, car le Prophète y fit paître son chameau avec douceur. Les juristes notent également que c'est un lieu où le châtiment s'est abattu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16598} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16599} En la traversant, la prière d'Umar ibn al-Khattab est recommandée. La plupart des juristes estiment que le Wadi Muhassir n'est ni Mina ni Muzdalifa et que s'y arrêter ne suffit pas, se fondant sur les paroles du Prophète selon lesquelles l'ensemble de Muzdalifa est un lieu où l'on s'arrête et qu'il convient de quitter le lit de Muhassir. Certains chaféites affirment qu'il fait partie de Mina, citant le hadith d'al-Fadl ibn Abbas."
  ur: "وادی محسیر وہ وادی ہے جو منیٰ اور مزدلفہ کے درمیان واقع ہے اور کسی سے بھی تعلق نہیں رکھتی۔ اس کا نام ابرہہ کے ہاتھی کے نام پر رکھا گیا ہے، جس نے وہاں ٹھوکر کھائی تھی۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 16598} حجاج کرام کو مزدلفہ سے نکلنے کے بعد پتھر پھینکنے کے لیے جلدی کرنے کی سفارش کی گئی ہے، کیونکہ نبی نے اپنے اونٹ کو وادی کے بستر پر نرمی سے حرکت دی تھی، اور فقہاء کا خیال ہے کہ یہ وہ جگہ ہے جہاں سزا دی گئی تھی۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16598} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص16599} اس سے گزرتے ہوئے عمر بن الخطاب کی دعا مستحب ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 16599} اکثر فقہاء کا خیال ہے کہ وادی محشر نہ منی ہے اور نہ مزدلفہ اور اس کا کھڑا ہونا کافی نہیں ہے، نبی کے اس ارشاد پر کہ پورا مزدلفہ قیام کی جگہ ہے اور محشر کا بستر چھوڑنا چاہیے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16599} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16600} بعض شافعی الفضل ابن عباس کی روایت کو نقل کرتے ہوئے کہتے ہیں کہ یہ منیٰ کا حصہ ہے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 صفحہ 16600}"
  tr: "Wadi Muhassir, Muzdalifah ile Mina arasında bir bölme yeridir, iki taraftan da değil ve Abraha'nın filinin tamamen içinde olması nedeniyle böyle adlandırılmıştır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16598} Hacıların, Muzdalifah'tan itildikten sonra oraya vardıklarında, taş atmak kadar acele etmeleri tavsiye edilir; çünkü Peygamber dişi devesini Muhassar'ın karnına biraz yaklaştırmış ve fiqhiller cezanın indiği yer olduğunu belirtmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16598} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16599} Ve yanından geçerken Umar ibn al-Hattab'ın duasını okumaları tavsiye edilir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.16599} Çoğu hukukçu, Wadi Muhassir'in ne Mina'dan ne de Muzdalifah'tan olduğunu ve bu bölgede durmanın yeterli olmadığını savunmuştur; çünkü hadisinde şöyle demiştir: \"Tüm Muzdalife bir standdır ve Muhassir vadisinin üzerinde yükselir.\" {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16599} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16600} Bazı Şafiiler bunun Mina'dan olduğunu söylemiş ve kanıt olarak Al-Fadl ibn Abbas'ın hadislerini göstermişlerdir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16600}"
  id: "Wadi Muhassir adalah tempat pembatas antara Muzdalifah dan Mina, bukan dari kedua sisi, dan dinamai demikian karena gajah Abraha ada di dalamnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16598} Disarankan bagi para peziarah, setelah sampai di sana setelah didorong dari Muzdalifah, untuk segera melempar batu, karena Nabi menggerakkan unta betinanya sedikit ke perut Muhassar, dan karena para ahli hukum menyebutkan bahwa itu adalah tempat hukuman dijatuhkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16598} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16599} Dan disarankan untuk melafalkan doa Umar ibn al-Khattab saat melewatinya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16599} Mayoritas ahli hukum berpendapat bahwa Wadi Muhassir bukan berasal dari Mina maupun Muzdalifah, dan bahwa berdiri di dalamnya tidak cukup, seperti yang dikatakan dalam hadits: \"Semua Muzdalifah adalah sebuah stand, dan mereka berdiri di atas lembah Muhassir.\" {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16599} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16600} Beberapa Shafi'i mengatakan itu berasal dari Mina, dan mereka mengutip hadis Al-Fadl ibn Abbas sebagai bukti. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16600}"
