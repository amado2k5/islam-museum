id: concept/wadi-muhassir-fiqh
class: concept
kind: legal
label: { ar: "وادي مُحَسِّر", en: "Wadi Muhassir (the valley between Mina and Muzdalifa on the pilgrimage)" }
summary:
  ar: "وادي محسّر موضع فاصل بين مزدلفة ومنى ليس من واحدة منهما، وسُمّي بذلك لأن فيل أبرهة كلّ فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16598} ويستحب للحجاج إذا بلغوه بعد الدفع من مزدلفة أن يسرعوا قدر رمية حجر، لأن النبي حرّك ناقته قليلاً عند بطن محسّر، ولأن الفقهاء ذكروا أنه محل نزول عذاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16598} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16599} ويُسنّ عند المرور به دعاء عمر بن الخطاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16599} وذهب جمهور الفقهاء إلى أن وادي محسّر ليس من منى ولا من مزدلفة، وأن الوقوف فيه لا يجزئ، لقوله في حديث: «المزدلفة كلها موقف وارفعوا عن بطن محسّر». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16599} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16600} وقال بعض الشافعية إنه من منى، واستدلوا بحديث الفضل بن عباس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16600}"
  en: "Wadi Muhassir is the valley that lies between Mina and Muzdalifa and belongs to neither; it is named for Abraha's elephant, which stumbled there. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16598} Pilgrims are recommended to hasten for about a stone's throw when they reach it after leaving Muzdalifa, since the Prophet moved his camel gently at the valley's bed, and the jurists note that it is a place where punishment fell. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16598} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16599} Passing it, the prayer of Umar ibn al-Khattab is recommended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16599} Most jurists hold that Wadi Muhassir is neither Mina nor Muzdalifa and that standing there does not suffice, on the Prophet's words that the whole of Muzdalifa is a place of standing and that one should leave the bed of Muhassir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16599} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16600} Some Shafi'is say it is part of Mina, citing the report of al-Fadl ibn Abbas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16600}"
