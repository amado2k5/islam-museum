id: concept/stepping-over-necks
class: concept
kind: legal
label:
  ar: "تخطي الرقاب"
  en: "Stepping over people's necks (takhatti al-riqab)"
  ur: "تخطّی الرقاب ⁦(لوگوں کی گردنوں پر سے گزرنا)⁩"
  es: "Pasar por encima del cuello de la gente (takhatti al-riqab)"
  fr: "Enjamber le cou des gens (takhatti al-riqab)"
  tr: "Sapların atlanması"
  id: "Melewati leher"
summary:
  ar: "تخطي الرقاب تجاوز الناس إلى مكان آخر، وأحكامه تختلف باختلاف الحال. يجوز للإمام إذا لم يجد طريقا غيره، ويكره لغيره إلا لحاجة، ويحرم إن آذى أحدا. ويحرم إقامة الرجل من مجلسه ليجلس مكانه، ويجوز له الخروج ولو بالتخطي عند الحاجة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4817} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4818} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4819}"
  en: "Takhatti al-riqab is stepping over people to reach a place further in. Its rulings vary: the imam may do it at the Friday gathering when he has no other way; others may do it only out of need; it is disliked outside prayer where it harms no one and forbidden where it harms. It is forbidden to make someone rise from his place to sit in it, and one who has to leave may step over people. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4817} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4818} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4819}"
  es: "Takhatti al-riqab consiste en pasar por encima de otras personas para alcanzar un lugar más alejado. Sus normas varían: el imán puede hacerlo durante la oración del viernes si no tiene otra opción; otros solo pueden hacerlo por necesidad; se desaconseja fuera de la oración cuando no perjudica a nadie y está prohibido cuando sí lo hace. Está prohibido obligar a alguien a levantarse de su lugar para sentarse en él, y quien deba marcharse puede pasar por encima de otras personas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4817} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4818} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4819}"
  fr: "Le takhatti al-riqab consiste à enjamber les gens pour atteindre une place plus éloignée. Les règles à ce sujet varient: l’imam peut le faire lors de la prière du vendredi lorsqu’il n’a pas d’autre solution; les autres ne peuvent le faire qu’en cas de nécessité; il est déconseillé en dehors de la prière lorsqu’il ne nuit à personne et interdit lorsqu’il nuit à quelqu’un. Il est interdit de faire lever quelqu’un de sa place pour s’asseoir à sa place, et celui qui doit partir peut enjamber les gens. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4817} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4818} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4819}"
  ur: "تختی الرقاب لوگوں پر قدم رکھ کر ایک مقام تک پہنچنا ہے۔ اس کے احکام مختلف ہیں: امام جمعہ کے اجتماع میں ایسا کر سکتا ہے جب اس کے پاس کوئی دوسرا راستہ نہ ہو۔ دوسرے یہ صرف ضرورت کے تحت کر سکتے ہیں۔ نماز سے باہر ناپسندیدہ ہے جہاں کسی کو نقصان نہ پہنچائے اور جہاں نقصان پہنچائے وہاں حرام ہے۔ کسی کو اس کی جگہ سے اٹھ کر بیٹھنا منع ہے اور جس کو جانا ہو وہ لوگوں پر قدم رکھ سکتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 4817} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ4818}"
  tr: "Boyun kesiştirmek, insanları başka bir yere geçmek demektir ve hükümleri duruma göre değişir. İmamın başka bir yol bulamıyor ve başkalarını sevmemesi ancak zorunluluktan dolayı kabul edilebilir, birine zarar vermesi yasaktır. Bir erkeğin yerinde oturması yasaktır ve gerektiğinde geçse bile dışarı çıkabilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4817} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4818} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4819}"
  id: "Menyilangkan leher berarti menyeberang orang ke tempat lain, dan keputusannya bervariasi tergantung situasi. Boleh bagi imam jika ia tidak menemukan jalan lain dan tidak menyukai orang lain kecuali karena kebutuhan, dan dilarang jika ia menyakiti seseorang. Dilarang bagi seorang pria untuk duduk di tempatnya, dan ia boleh keluar meskipun ia menyeberang jika diperlukan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4817} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4818} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4819}"
