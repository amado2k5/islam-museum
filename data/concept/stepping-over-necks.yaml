label:
  ar: "تخطي الرقاب"
  en: "Stepping over people's necks (takhatti al-riqab)"
  ur: "تخطّی الرقاب (لوگوں کی گردنوں پر سے گزرنا)"
summary:
  ar: "تخطي الرقاب تجاوز الناس إلى مكان آخر، وأحكامه تختلف باختلاف الحال. يجوز للإمام إذا لم يجد طريقا غيره، ويكره لغيره إلا لحاجة، ويحرم إن آذى أحدا. ويحرم إقامة الرجل من مجلسه ليجلس مكانه، ويجوز له الخروج ولو بالتخطي عند الحاجة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4817} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4818} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4819}"
  en: "Takhatti al-riqab is stepping over people to reach a place further in. Its rulings vary: the imam may do it at the Friday gathering when he has no other way; others may do it only out of need; it is disliked outside prayer where it harms no one and forbidden where it harms. It is forbidden to make someone rise from his place to sit in it, and one who has to leave may step over people. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4817} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4818} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4819}"
