label:
  ar: "ديودار"
  en: "Diwdar (Indian pine)"
  ur: "دیودار"
summary:
  ar: "جنس من الأبهل يقال له الصنوبر الهندي، وعيدانه تشبه عيدان الزرنباد، وفيه حدّة يسيرة، ولبنه حار حريف يُعطش. يبسه في الثالثة أكثر من حرّه. جيد لاسترخاء العصب والفالج واللقوة، وينفع من الأمراض الباردة في الدماغ، ويفتّت الحصاة في الكلية والمثانة، ويزيل استرخاء المقعدة بالقعود في طبيخه {cite:canon-ibn-sina-print-v1 p.440}."
  en: "A kind of abhal called the Indian pine; its sticks resemble zarnabad sticks, with a slight sharpness. Its milk is hot, pungent and thirst-causing. Dry in the third degree more than hot. Good for relaxation of the nerve, paralysis and facial palsy; helps cold diseases of the brain; breaks up stones in the kidney and bladder; and sitting in its decoction relieves relaxation of the anus {cite:canon-ibn-sina-print-v1 p.440}."
  ur: "ابہل کی ایک قسم جسے ہندی صنوبر کہتے ہیں؛ اس کی ڈنڈیاں زرنباد کی ڈنڈیوں سے مشابہ ہیں، اور اس میں ہلکی تیزی ہے۔ اس کا دودھ گرم، تیز اور پیاس بڑھانے والا ہے۔ اس کا خشک ہونا گرمی سے زیادہ تیسرے درجے میں ہے۔ عصب کی سستی، فالج اور لقوہ میں مفید؛ دماغ کی ٹھنڈی بیماریوں میں نفع دیتا ہے؛ گردے اور مثانے کی پتھری توڑتا ہے؛ اس کے جوشاندے میں بیٹھنے سے مقعد کی سستی دور ہوتی ہے {cite:canon-ibn-sina-print-v1 p.440}۔"
