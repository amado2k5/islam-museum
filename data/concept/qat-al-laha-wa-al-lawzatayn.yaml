id: concept/qat-al-laha-wa-al-lawzatayn
class: concept
kind: scientific
label:
  ar: "قطع اللهاة واللوزتين"
  en: "The cutting of the uvula and the tonsils"
  ur: "لہات اور لوزتین کا کاٹنا"
  es: "La extirpación de la úvula y las amígdalas"
  fr: "L'ablation de la luette et des amygdales"
  tr: "Uvula ve bademciklerin kesilmesi"
  id: "Memotong uvula dan amandel"
summary:
  ar: "قطع اللهاة واللوزتين ينظر في اللهاة دقتها وضمورها وخصوصاً في أسفلها فإن غلظ طرفها ورشح منه كالقيح فهو أول وقت وحينئذ يقطع بالحديد أو بالأدوية الكاوية ويحتاط بإسهال لطيف يتقدمه ونقص البدن عن الامتلاء إن كان به من دم أو غيره فإن القطع مع الامتلاء خطر ⁦(محمول على أنه وصف الكتاب لا عملية)⁩ {cite:canon-ibn-sina-print-v2 p.299}"
  en: "In cutting the uvula and the tonsils the uvula is looked at for thinness and wasting, above all at its bottom; if its tip thickens and something like pus oozes from it that is the first time, and it is then cut by iron or by caustic drugs — a mild purge going before and the body short of fullness if blood or aught else is in it, for cutting with fullness is dangerous (carried as the book's description, not a procedure) {cite:canon-ibn-sina-print-v2 p.299}"
  ur: "لہات اور لوزتین کا کاٹنا: لہات کو باریکی اور سکڑاؤ کے لیے دیکھا جاتا ہے خصوصاً اس کے نچلے حصے میں؛ اگر اس کا کنارا موٹا ہو اور اس سے پیپ جیسی چیز رسنے لگے تو وہ پہلا وقت ہے اور تب وہ لوہے یا جلانے والے ادویہ سے کٹی جاتی ہے — اس سے پہلے ہلکی جلاب اور بدن کو امتلاء سے کم رکھنا اگر اس میں خون یا اور کچھ ہو کہ امتلاء کے ساتھ کاٹنا خطر ہے ⁦(کتاب کے وصف پر محمول، طریقہ نہیں)⁩ {cite:canon-ibn-sina-print-v2 p.299}"
  es: "Al cortar la úvula y las amígdalas, se examina la úvula para detectar adelgazamiento y desgaste, sobre todo en su base; si su punta se engrosa y supura algo parecido a pus, es la primera vez, y entonces se corta con hierro o con fármacos cáusticos; se realiza una purga leve previamente y el cuerpo no está completamente lleno si contiene sangre u otra sustancia, ya que cortar con el cuerpo lleno es peligroso (según la descripción del libro, no como procedimiento) {cite:canon-ibn-sina-print-v2 p.299}"
  fr: "Lors de l'ablation de la luette et des amygdales, on examine la luette pour déceler son amincissement et son atrophie, surtout à sa base; si son extrémité s'épaissit et qu'une substance purulente s'en écoule, c'est la première fois qu'on procède à l'ablation, soit par du fer, soit par des médicaments caustiques – une légère purge est effectuée au préalable, et le corps doit être légèrement déshydraté s'il contient du sang ou toute autre substance, car une ablation en état de satiété est dangereuse (il s'agit d'une description du livre, et non d'une procédure). {cite:canon-ibn-sina-print-v2 p.299}"
  tr: "Uvula ve bademciklerin kesilmesi: Örtü, özellikle tabanında hassasiyeti ve atrofisi açısından incelenir. Ucu kalınlaşıp irin akıtıyorsa, bu ilk kez olur. Bu durumda demir veya aşındırıcı ilaçlarla kesilir ve kan veya başka bir şekilde vücutta hafif ishal ve doluluk azalması ile devam eder. Dolgunlukla kesmek tehlikelidir (kitabın bir tanımı olarak kabul edilir, bir operasyon olarak değil) {cite:canon-ibn-sina-print-v2 s.299}"
  id: "Memotong uvula dan amandel: Kerudung diperiksa untuk presisi dan atrofi, terutama di pangkalnya. Jika ujungnya menebal dan mengeluarkan nanah, ini adalah pertama kalinya. Dalam kasus ini, tirai dipotong dengan zat besi atau obat kaustik, dan didahului oleh diare ringan dan penurunan tubuh dari rasa penuh jika berupa darah atau lainnya. Memotong dengan penuh berbahaya (dianggap sebagai deskripsi buku, bukan operasi) {cite:canon-ibn-sina-print-v2 hlm.299}"
