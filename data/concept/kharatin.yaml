summary:
  ar: "خراطين في الكتاب يقدر المؤلف أنه حار؛ يضمد بمدقوقه جراحات الأعصاب فيكون نافعا جدا، وطبيخه مع شحم الوز نافع من وجع الأذن، ويبرئ اليرقان إذا شرب بالطلاء، ويدر البول وينفع من الحصاة {cite:canon-ibn-sina-print-v1 pp.717-718}"
  en: "Kharatin is in the book something the author estimates must be hot; its pounded form is laid as a poultice on wounds of the nerves and is then very beneficial, its decoction with goose fat benefits earache, it cures jaundice when drunk with boiled grape must (tila'), and it promotes urine and benefits stone {cite:canon-ibn-sina-print-v1 pp.717-718}"
  ur: "خراطین کتاب میں ایسی چیز ہے جس کے بارے میں مصنف اندازہ کرتا ہے کہ وہ گرم ہونی چاہیے؛ اس کا کوٹا ہوا ضماد اعصاب کے زخموں پر رکھا جائے تو بہت نافع ہوتا ہے، اس کا جوشاندہ ہنس کی چربی کے ساتھ کان کے درد میں نافع ہے، طلاء، یعنی انگور کے پکے ہوئے شیرے، کے ساتھ پیا جائے تو یرقان کو دور کرتا ہے، اور پیشاب جاری کرتا اور پتھری میں نافع ہے {cite:canon-ibn-sina-print-v1 pp.717-718}۔"
  es: "En el libro, el autor estima que el jaratín debe ser caliente; machacado se aplica como cataplasma sobre heridas nerviosas y resulta muy beneficioso; su decocción con grasa de ganso alivia el dolor de oído; cura la ictericia cuando se bebe con mosto de uva hervido (tila'); y favorece la micción y ayuda a combatir los cálculos renales. {cite:canon-ibn-sina-print-v1 pp.717-718}"
