summary:
  ar: "الحمام بيت الماء العام؛ كان أول حمام اتخذ بالبصرة حمام عبد الله بن عثمان بن أبي العاص الثقفي ثم الثاني حمام فيل مولى زياد ثم الثالث حمام مسلم بن أبي بكرة في بلالاباذ ومكثت البصرة دهراً ليس بها إلا هذه الحمامات وكانت لا تبنى إلا بإذن الولاة حتى أذن لجماعة فكثرت."
  en: "The public bathhouse; Basra's first was Abdallah ibn Uthman ibn Abi al-As's, the second Fil's (Ziyad's mawla), the third Muslim ibn Abi Bakra's at Bilalabadh — and for an age the town had only these, since baths were built only by the governors' leave until a wave of permissions multiplied them."
