label: { ar: "الحمام", en: "Public Bathhouse", es: "Baños públicos", fr: "Bains publics", ur: "پبلک باتھ ہاؤس", tr: "Banyo", id: "Kamar mandi" }
summary:
  ar: "الحمام بيت الماء العام؛ كان أول حمام اتخذ بالبصرة حمام عبد الله بن عثمان بن أبي العاص الثقفي ثم الثاني حمام فيل مولى زياد ثم الثالث حمام مسلم بن أبي بكرة في بلالاباذ ومكثت البصرة دهراً ليس بها إلا هذه الحمامات وكانت لا تبنى إلا بإذن الولاة حتى أذن لجماعة فكثرت."
  en: "The public bathhouse; Basra's first was Abdallah ibn Uthman ibn Abi al-As's, the second Fil's (Ziyad's mawla), the third Muslim ibn Abi Bakra's at Bilalabadh — and for an age the town had only these, since baths were built only by the governors' leave until a wave of permissions multiplied them."
  es: "Los baños públicos; el primero de Basora fue el de Abdallah ibn Uthman ibn Abi al-As, el segundo el de Fil (el mawla de Ziyad), el tercero el de Muslim ibn Abi Bakra en Bilalabadh, y durante mucho tiempo la ciudad solo tuvo estos, ya que los baños se construían únicamente con el permiso de los gobernadores hasta que una oleada de permisos los multiplicó."
  fr: "Les bains publics; le premier de Bassora fut celui d'Abdallah ibn Uthman ibn Abi al-As, le deuxième celui de Fil (la mawla de Ziyad), le troisième celui de Muslim ibn Abi Bakra à Bilalabadh — et pendant longtemps, la ville n'en posséda que quelques-uns, car les bains n'étaient construits qu'avec l'autorisation des gouverneurs jusqu'à ce qu'une vague d'autorisations les multiplie."
  ur: "عوامی غسل خانہ؛ بصرہ کا پہلا عبداللہ بن عثمان ابن ابی العاص، دوسرا فل ⁦(زیاد کا مولا)⁩، تیسرا مسلم ابن ابی بکرہ کا بلال آباد میں - اور ایک زمانہ تک اس بستی کے پاس صرف یہ تھے، کیونکہ حمام صرف گورنروں کی اجازت سے بنائے گئے تھے جب تک کہ ان کو اجازت کی لہر نہ آجائے۔"
  tr: "Hamam halka açık hamamdı; Basra'da kullanılan ilk hamam Abdullah ibn Osman ibn Abi al-As al-Thaqafi'nin hamamıydı, ikincisi Ziyad'ın özgür Fil hamamı ve üçüncüsü Bilalabadh'daki Müslüman ibn Ebi Bekra'nın hamamıydı. Basra uzun süre sadece bu hamamlarla kaldı; bu hamamlar sadece valilerin izniyle inşa edildi ve bir cemaat izin verilene kadar bu hamamlar büyük ölçüde arttı."
  id: "Pemandian ini adalah pemandian umum; pemandian pertama yang digunakan di Basra adalah pemandian milik Abdullah ibn Uthman ibn Abi al-As al-Thaqafi, kemudian yang kedua adalah pemandian Fil milik mantan Ziyad, dan yang ketiga adalah pemandian Muslim ibn Abi Bakrah di Bilalabadh. Basra bertahan lama hanya dengan pemandian ini, yang hanya dibangun dengan izin gubernur sampai izin diberikan kepada komunitas, yang meningkat pesat."
