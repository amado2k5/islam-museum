id: concept/zij-sabi-the-moon-measured-by-its-visible-place
class: concept
kind: scientific
label: { ar: "القمر يُقاس بمنظره المرئي", en: "The Moon measured by its visible place", ur: "چاند کی پیمائش اس کے مرئی مقام سے" }
summary:
  ar: "إذا كان القياس بالقمر احتاج الراصد إلى معرفة اختلاف منظره حتى يصح له موضعه المرئي في الطول والعرض، ثم يعرف به بعده المرئي عن معدل النهار والجزء المرئي الذي يتوسط السماء معه ونصف قوس نهار موضعه، ثم يُؤخذ الارتفاع من القمر ويُبدأ بأن يُعلم ارتفاعه في وسط السماء. ويكرر البتاني الأمر في بابي الارتفاع والسمت: يُعرف ارتفاعه المرئي ببعده المرئي، وسمته ببعده المرئي عن معدل النهار. {cite:zij-sabi-nallino-byblion pp.56-58}."
  en: "When the measurement is made with the Moon, the observer needs the parallax of its view so that its visible place in longitude and latitude is right; with it he finds its visible distance from the equator, the visible part that culminates with it and the half day arc of its visible position, and then takes the altitude of the Moon and begins by finding its altitude at midheaven. Al-Battani repeats the point in the chapters on altitude and azimuth: its visible altitude is known from its visible distance, and its azimuth from its visible distance from the equator. {cite:zij-sabi-nallino-byblion pp.56-58}."
  ur: "جب پیمائش چاند سے کی جائے تو رصد کرنے والے کو اس کے اختلافِ منظر کی ضرورت ہوتی ہے تاکہ طول و عرض میں اس کا مرئی مقام درست ہو؛ اس سے وہ معدل النہار سے اس کا مرئی بعد، اس کے ساتھ وسط السماء میں آنے والا مرئی جزء اور اس کے مرئی موضع کی نصف قوسِ نہار معلوم کرتا ہے، پھر چاند کا ارتفاع لیتا ہے اور شروع میں وسط السماء میں اس کا ارتفاع معلوم کرتا ہے۔ البتانی یہ بات ارتفاع اور سمت کے ابواب میں بھی دہراتے ہیں: اس کا مرئی ارتفاع مرئی بعد سے معلوم ہوتا ہے اور اس کی سمت معدل النہار سے اس کے مرئی بعد سے۔ {cite:zij-sabi-nallino-byblion pp.56-58}۔"
