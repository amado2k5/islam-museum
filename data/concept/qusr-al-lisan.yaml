id: concept/qusr-al-lisan
class: concept
kind: scientific
label:
  ar: قصر اللسان
  en: Shortness of the tongue
  ur: زبان کی کمی/بندھا ہونا
  es: "Cortotiempo de la lengua"
summary:
  ar: قد يعرض قصر اللسان لاتصال الرباط الذي تحته برأس اللسان وطرفه فلا يدع اللسان ينبسط وقد يعرض على سبيل التشنج، وأما الكائن بسبب قصر الرباط فعلاجه في الكتاب قطع ذلك الرباط قليلاً من جانب طرفه وتدارك الموضع بما يقطع الدم ومبلغ ما يحتاج إليه من قطعه في إطلاق اللسان الحنك وأن يخرج من الفم وإن لم يجسر على قطعه بالحديد تقية وخوفاً من انفجار دم جاز أن يدخل تحت الرباط إبرة بخيط خارم فيخرم من غير قطع ⁦(عمل يد منقول كما وصفه الكتاب لا على سبيل الصنع)⁩ {cite:canon-ibn-sina-print-v2 p.258}
  en: 'The tongue''s shortness may occur from the ligament beneath it being attached to the tongue''s head and tip, not letting the tongue stretch out; it may also occur by way of convulsion. For the kind from the short ligament, the book''s treatment is cutting that ligament a little at the tip side, seeing to the place with what stops the blood, the measure of cutting needed being the tongue''s release to the palate and out of the mouth; and if one dares not cut it with iron for fear of much blood bursting, it is permitted to pass a piercing needle with thread under the ligament to perforate without cutting, with caustic drugs laid to prevent adhesion and care taken of the veins beneath ⁦(a hand-work carried as the book describes it, not as a procedure)⁩ {cite:canon-ibn-sina-print-v2 p.258}'
  ur: 'زبان کا بندھا ہونا اس وقت ہوتا ہے جب اس کے تلے کی باندھ زبان کی جڑ اور نوک سے لگی ہو اور زبان کو پھیلنے نہ دے؛ اور کھنچاؤ کے راستے سے بھی ہو سکتا ہے؛ باندھ کی کمی والا اس میں کتاب کا علاج اس باندھ کا نوک کی طرف سے تھوڑا کاٹنا ہے اور مقام کی دیکھ بھال خون روکنے والی چیز سے، اور کاٹنے کی مقدار وہی ہے جس سے زبان تالو تک اور منہ سے باہر نکل سکے؛ اور اگر لوہے سے کاٹنے کی جرات نہ ہو بہت خون بہنے کے خوف سے تو جائز ہے کہ باندھ کے نیچے دھاگے والی سوئی داخل کر کے بغیر کاٹے سوراخ کیا جائے اور چپکنے سے بچانے کے لیے جلانے والی ادویہ رکھی جائیں اور نیچے کی رگوں کی حفاظت ہو ⁦(ہاتھ کا عمل جیسا کتاب بیان کرتی ہے، طریقہ کار کے طور پر نہیں)⁩ {cite:canon-ibn-sina-print-v2 p.258}'
  es: "El acortamiento de la lengua puede deberse a que el ligamento subyacente se adhiere a la cabeza y la punta de la lengua, impidiendo que esta se estire; también puede producirse por una convulsión. Para el caso causado por el acortamiento del ligamento, el tratamiento descrito en el libro consiste en cortar ligeramente dicho ligamento en la punta, procurando detener la hemorragia. La medida del corte necesaria es suficiente para liberar la lengua del paladar y sacarla de la boca. Si no se atreve uno a cortarlo con hierro por temor a una hemorragia grave, se permite pasar una aguja perforadora con hilo por debajo del ligamento para perforarlo sin cortarlo, aplicando fármacos cáusticos para prevenir adherencias y teniendo cuidado con las venas subyacentes (un trabajo manual realizado como lo describe el libro, no como un procedimiento). {cite:canon-ibn-sina-print-v2 p.258}"
