id: "concept/ilaj-al-dawi-wa-al-tanin"
class: "concept"
kind: "scientific"
label:
  ar: "معالجة الدوي والطنين"
  en: "The treatment of ringing and buzzing"
  ur: "گونج اور بھنبھناہٹ کا علاج"
summary:
  ar: "جميع أصحاب الدوي والطنين يجب أن يجتنبوا الشمس والحمام والحركة العنيفة والصياح والقيء، وينظر في العضو الفاعل له وخصوصاً المعدة فتنقى، ويقصد الدماغ والأذن فيقويان؛ والكائن من الامتلاء ينقى البدن أو الرأس ويلطف التدبير، والبحراني لا يجب أن يحرك فإنه يزول بزوال الحمى، والكائن عن قيح يعالج بعلاج الورم والقيح، والكائن في الناقهين ولمن يبس مزاجه فإن كان السبب يبساً فالتغذية والترطيب وإن كان الضعف فما يعدل المزاج العارض ⁦⁦(أسماء الأدوية والأدهان والأقراص والمخدرات ومقاديرها لا تحمل، وقول بعض العلماء المتقدمين في دواء الفوتنج منقول كقول منسوب إليهم)⁩⁩ {cite:canon-ibn-sina-print-v2 p.226} {cite:canon-ibn-sina-print-v2 p.227}"
  en: "All with ringing and buzzing must avoid sun, bath, violent movement, shouting and vomiting; the acting organ is examined — above all the stomach — and cleansed, and brain and ear are strengthened. What is from repletion: body or head is cleansed and the regimen lightened. The crisis-kind must not be stirred — it passes with the fever. What is from pus is treated as the swelling and pus. In convalescents and the dry-tempered, if dryness is the cause, nourishment and moistening; if weakness, what rectifies the occurring temperament ⁦(drug, oil, tablet and narcotic names and their measures are not carried; the earlier scholars' saying on the futanj drug is transmitted as a saying attributed to them)⁩ {cite:canon-ibn-sina-print-v2 p.226} {cite:canon-ibn-sina-print-v2 p.227}"
  ur: "گونج اور بھنبھناہٹ والوں کو آفتاب، حمام، سخت حرکت، چلانا اور قے سے بچنا چاہیے؛ اور عمل کرنے والے عضو — خصوصاً معدہ — کی جانچ کر کے اسے صاف کیا جائے، اور دماغ اور کان کو تقویت دی جائے؛ امتلاء سے ہونے والے میں بدن یا سر صاف کیا جائے اور تدبیر ہلکی ہو؛ بحرانی کو نہیں ہلانا چاہیے کہ وہ بخار کے جانے سے جاتا رہتا ہے؛ قیح سے ہونے والا ورم اور قیح کے علاج سے علاج ہو؛ اور ناقہین اور جس کا مزاج خشک ہوا ہو اس میں اگر سبب خشکی ہو تو غذا اور ترطیب، اور اگر ضعف ہو تو وہ چیز جو عارض مزاج کو معتدل کرے ⁦⁦(ادویہ، تیلوں، گولیوں اور مخدروں کے نام اور مقدار منقول نہیں؛ فوتنج کی دوا کے بارے میں متقدم علما کا قول ان کی طرف منسوب کے طور پر منقول ہے)⁩⁩ {cite:canon-ibn-sina-print-v2 p.226} {cite:canon-ibn-sina-print-v2 p.227}"
