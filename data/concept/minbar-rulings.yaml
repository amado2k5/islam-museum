label: { ar: "المِنْبَر (الأحكام المتعلقة به)", en: "The pulpit (minbar): rulings on its making, use and place", ur: "منبر (احکام)" }
summary:
  ar: "المنبر مرقاة يرتقيها الخطيب للخطبة، وقد اتخذه النبي سنة سبع أو ثمان من الهجرة. وللفقهاء أحكام فيه: اتخاذه سنة، ويستحب أن يكون على يمين المحراب، وتسليم الخطيب على الناس عند الصعود، ونزوله للحاجة، والصلاة عند منبره، وتغليظ اليمين عنده."
  en: "The minbar is the step a preacher climbs to address the people. The Prophet made one in the seventh or eighth year after the migration. The jurists rule that having one is a sunna, that it should stand to the right of the prayer niche, that the preacher greets the people on climbing it, that he may descend for need, that prayer is offered near the Prophet's minbar, and that oaths may be sworn at it."
  ur: "منبر وہ سیڑھی ہے جس پر خطیب خطبہ دینے کے لیے چڑھتا ہے۔ فقہاء کے نزدیک منبر بنانا سنت ہے، اور اس پر چڑھ کر حاضرین کو سلام کیا جا سکتا ہے، اور اس کے پاس تغلیظِ یمین بھی ہوتی ہے۔"
