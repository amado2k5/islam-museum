id: concept/al-adwiya-al-muhallila
class: concept
kind: scientific
label:
  ar: الأدوية المحللة لأوجاع الأسنان
  en: The resolvent drugs for the toothaches
  fr: "Les remèdes résolutifs pour les maux de dents"
  ur: دانتوں کے درد کی محلل ادویہ
summary:
  ar: 'في الأدوية المحللة المستعملة في أوجاع الأسنان المحتاجة إلى التحليل: منها مضمضات يجب أن تمسك في الفم مدة طويلة ومنها غرغترات ويترك الفم مفتوحاً ليسيل لعاب كثير ومنها مضوغات ومنها لطوخات وأطلية ونضوخات وأضمدة تتخذ من المحللات المعروفة وتجمع بما له قوام ومنها كمادات من خارج تستعمل قبل الطعام بساعتين أو بعده بأربع لشدة الوجع وقد تكمد اللحى تكميداً بعد تكميد ليجذب إليها المادة، ومنها كاويات وتدبير بالكي ⁦(الأسماء والنسخ مطروحة والمآل محمولة على أنها أوصاف الكتاب لا عمليات)⁩ {cite:canon-ibn-sina-print-v2 p.271-273}'
  en: 'On the resolvent drugs used in the toothaches needing dissolution: mouthwashes that must be held long in the mouth, gargles with the mouth left open for much spittle to run, chewables, plasters, salves, dressings and poultices made of the known resolvents bound by what has a body; outer compresses for severe pain used two hours before food or four after, the jaws compress-warmed again and again to draw the matter; then rubs, funnel fumigations, snuffs, ear-drops on the aching side, stuffings for the corroded tooth set gently, and the cauteries — including the heated probe sent through a tube fitted over the aching tooth with a wax or dough barrier on the neighbours, the boiled-oil dripping, and the piercing of the tooth with a fine drill so the caustic power enters, until at last the tooth crumbles (names and recipes left out; the instruments carried as the book''s descriptions, not procedures) {cite:canon-ibn-sina-print-v2 p.271-273}'
  fr: "Sur les remèdes résolutifs employés dans les maux de dents qui demandent une résolution : des bains de bouche qu’il faut garder longtemps en bouche, des gargarismes pratiqués la bouche ouverte pour laisser couler beaucoup de salive, des masticatoires, des emplâtres, des onguents, des pansements et des cataplasmes faits des résolutifs connus liés par ce qui a du corps ; des compresses externes pour les douleurs vives, employées deux heures avant le repas ou quatre après, les mâchoires réchauffées par compresses à maintes reprises pour attirer la matière ; puis des frictions, des fumigations à l’entonnoir, des prises nasales, des gouttes auriculaires du côté douloureux, des bourrages pour la dent cariée posés doucement, et les cautérisations — dont la sonde chauffée introduite par un tube ajusté sur la dent douloureuse avec une barrière de cire ou de pâte sur les dents voisines, l’instillation d’huile bouillie, et le perçage de la dent avec une fine vrille pour que la vertu caustique y pénètre, jusqu’à ce qu’enfin la dent s’effrite (noms et recettes omis ; les instruments rapportés comme des descriptions du livre, non comme des procédés) {cite:canon-ibn-sina-print-v2 p.271-273}"
  ur: 'دانتوں کے درد میں تحلیل چاہنے والوں کے لیے استعمال ہونے والی محلل ادویہ میں: کلانے ہیں جنہیں منہ میں دیر تک رکھنا چاہیے، غرغارے جن میں منہ کھلا چھوڑا جائے تاکہ لعاب خوب بہے، چبائی جانے والی، لطوخ، مرہم، چھڑکاو اور پٹیاں جو معروف محللوں سے بنائی جائیں اور قوام رکھنے والی چیز سے جوڑی جائیں؛ باہر کی سیک سخت درد کے لیے کھانے سے دو گھنٹے پہلے یا چار گھنٹے بعد، جبڑوں پر بار بار سیک تاکہ مواد کھنچے؛ پھر مالشیں، قمع کی دھونیاں، سونٹھے، درد والے جانب کان کے قطرے، کٹے دانت میں نرمی سے بھرائی جانے والی چیزیں، اور داغنے کی تدبیریں — جن میں تپائی ہوئی سوئی ایک نالی کے اندر درد والے دانت پر رکھ کر داخل کی جاتی ہے اور آس پاس کے دانتوں اور مسوڑھوں پر موم یا آٹے کی حفاظت، ابلا ہوا تیل نالی میں ٹپکانا، اور باریک دریل سے دانت سوراخ کرنا تاکہ جلانے والی قوت داخل ہو، یہاں تک کہ آخر دانت چور ہو جائے ⁦(نام اور نسخے مطروح؛ اوزار کتاب کے وصف پر محمول، طریقے نہیں)⁩ {cite:canon-ibn-sina-print-v2 p.271-273}'
