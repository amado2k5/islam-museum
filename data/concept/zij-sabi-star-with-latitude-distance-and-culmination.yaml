label: { ar: "بعد الكوكب ذي العرض عن معدل النهار وتوسطه السماء مع غير درجته في الزيج الصابي", en: "The distance from the equator of a star with latitude, and why it culminates with another degree", ur: "عرض والے ستارے کا معدل النہار سے بعد اور اس کا دوسرے درجے کے ساتھ وسط السماء میں آنا", es: "La distancia desde el ecuador de una estrella con latitud, y por qué culmina con otro grado." }
summary:
  ar: "يبدأ الباب الثامن عشر بأبعاد الكواكب عن معدل النهار والجزء الذي يتوسط السماء معها من البروج بحسب الطول والعرض. فالكوكب الذي على فلك البروج بلا عرض يجري مجرى الشمس في ميله، أما ذو العرض فإن بعده عن معدل النهار يخرج من قوس تجوز على قطبي معدل النهار، وعرضه من قوس على قطبي فلك البروج، فيتوسط السماء مع غير درجته إلا عند أول السرطان وأول الجدي. {cite:zij-sabi-nallino-byblion pp.50-51}."
  en: "Chapter 18 begins with the distances of stars from the equator and the part of the ecliptic that comes to midheaven with them, by longitude and latitude. A star on the ecliptic with no latitude behaves like the Sun in its declination, but one with latitude has a distance from the equator that comes from an arc through the poles of the equator, whereas its latitude comes from an arc through the poles of the ecliptic, so it comes to midheaven with a degree other than its own except at the first of Cancer and the first of Capricorn. {cite:zij-sabi-nallino-byblion pp.50-51}."
  ur: "اٹھارہواں باب ستاروں کے معدل النہار سے بعد اور فلک البروج کے اس جز کے بارے میں شروع ہوتا ہے جو طول و عرض کے مطابق ان کے ساتھ وسط السماء میں آتا ہے۔ فلک البروج پر بلا عرض ستارہ اپنے میل میں سورج کی طرح چلتا ہے، لیکن عرض والے ستارے کا معدل النہار سے بعد معدل النہار کے قطبین سے گزرنے والی قوس سے نکلتا ہے جبکہ اس کا عرض فلک البروج کے قطبین سے گزرنے والی قوس سے، اس لیے وہ اپنے درجے کے علاوہ دوسرے درجے کے ساتھ وسط السماء میں آتا ہے سوائے سرطان اور جدی کے آغاز کے۔ {cite:zij-sabi-nallino-byblion pp.50-51}۔"
  es: "El capítulo 18 comienza con las distancias de las estrellas al ecuador y la parte de la eclíptica que llega al medio cielo con ellas, según su longitud y latitud. Una estrella en la eclíptica sin latitud se comporta como el Sol en su declinación, pero una con latitud tiene una distancia al ecuador que proviene de un arco que pasa por los polos del ecuador, mientras que su latitud proviene de un arco que pasa por los polos de la eclíptica, por lo que llega al medio cielo con un grado distinto al suyo, excepto en el primer día de Cáncer y el primer día de Capricornio. {cite:zij-sabi-nallino-byblion pp.50-51}."
