id: concept/azima
class: concept
kind: legal
label:
  ar: "العَزِيمة"
  en: "Original ruling (azima) and concession (rukhsa)"
  ur: "عزیمت"
summary:
  ar: "العزيمة في اللغة الاجتهاد والجد في الأمر، وفي الاصطلاح ما وسع للمكلف فعله لعذر مع قيام السبب المحرم، وقيل هي الحكم الأصلي السالم من المعارض {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11598} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11599}. وتنقسم عند الحنفية إلى فرض وواجب وسنة ونفل، وخصها القرافي بالواجب والمندوب، وذهب البيضاوي إلى أن الأحكام الخمسة تعتريها، وخصها بعض العلماء بالواجب {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11599}. وقد يرفع الشرع الحرج عن المكلف، فيكون مخيراً بين الأخذ بالعزيمة أو بالرخصة في بعض الأحوال، وتباينت أنظار المجتهدين في الترجيح بينهما {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11599} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11600}. وتفصيل ذلك في الملحق الأصولي {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11600}."
  en: "In the lexicon, azima is effort and earnestness in a matter, and the azima of God is His obligation. As a technical term it is what is made easier for the person in a case of excuse and inability while the forbidding cause still exists; by another definition it is the original ruling, free of any opposing ruling {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11598} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11599}. The Hanafis divide azima into obligation, necessity, sunna and voluntary; al-Qarafi restricts it to the obligatory and the recommended; al-Baydawi holds that all five rulings apply to it, while some restrict it to the obligatory {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11599}. Sometimes the law lifts hardship, so that the person may choose between the original ruling and the concession, and the jurists differ on which to prefer {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11599} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11600}. The full discussion is in the legal theory appendix {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11600}."
