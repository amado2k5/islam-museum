label:
  ar: "العَزِيمة"
  en: "Original ruling (azima) and concession (rukhsa)"
  ur: "عزیمت"
summary:
  ar: "العزيمة في اللغة الاجتهاد والجد في الأمر، وفي الاصطلاح ما وسع للمكلف فعله لعذر مع قيام السبب المحرم، وقيل هي الحكم الأصلي السالم من المعارض {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11598} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11599}. وتنقسم عند الحنفية إلى فرض وواجب وسنة ونفل، وخصها القرافي بالواجب والمندوب، وذهب البيضاوي إلى أن الأحكام الخمسة تعتريها، وخصها بعض العلماء بالواجب {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11599}. وقد يرفع الشرع الحرج عن المكلف، فيكون مخيراً بين الأخذ بالعزيمة أو بالرخصة في بعض الأحوال، وتباينت أنظار المجتهدين في الترجيح بينهما {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11599} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11600}. وتفصيل ذلك في الملحق الأصولي {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11600}. ويعرّف الشاطبي في كتاب الأحكام العزيمة بأنها ما شرع من الأحكام الكلية ابتداء، أي ما لا يختص ببعض المكلفين دون بعض ولا ببعض الأحوال دون بعض كالصلاة والصوم والزكاة والحج والجهاد وسائر شعائر الإسلام، ويدخل فيه ما شرع لسبب مصلحي في الأصل كالمعاملات. {cite:muwafaqat p.183} ويقابلها الرخصة وهي ما شرع لعذر شاق استثناءً من أصل كلي يقتضي المنع مع الاقتصار على مواضع الحاجة، فلا تكون مشروعة ابتداء وليست كليات في الحكم؛ فالراجعة إلى أصل كلي ابتدائي هي العزيمة والراجعة إلى جزئي مستثنى هي الرخصة. {cite:muwafaqat p.183-184} ويقرر أن العزائم حق الله على العباد وأن الرخص حظ العباد من لطف الله، فالمباحات تشترك مع الرخص في التوسعة على العبد ورفع الحرج عنه. {cite:muwafaqat p.185-186}."
  en: "In the lexicon, azima is effort and earnestness in a matter, and the azima of God is His obligation. As a technical term it is what is made easier for the person in a case of excuse and inability while the forbidding cause still exists; by another definition it is the original ruling, free of any opposing ruling {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11598} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11599}. The Hanafis divide azima into obligation, necessity, sunna and voluntary; al-Qarafi restricts it to the obligatory and the recommended; al-Baydawi holds that all five rulings apply to it, while some restrict it to the obligatory {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11599}. Sometimes the law lifts hardship, so that the person may choose between the original ruling and the concession, and the jurists differ on which to prefer {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11599} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11600}. The full discussion is in the legal theory appendix {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11600}. In the Book of Rulings al-Shatibi defines the 'azima as what was legislated of universal rulings from the outset — rulings not confined to some of the obliged rather than others nor to some states rather than others, such as prayer, fasting, alms, pilgrimage, jihad and the other universal pillars of Islam — and includes what was legislated for a beneficial cause at root, such as transactions. {cite:muwafaqat p.183} Its counterpart is the rukhsa, legislated for a severe excuse as an exception from a universal prohibiting principle, confined to places of need, so it is not legislated from the outset nor universal in ruling: what refers to a primary universal principle is the 'azima, and what refers to a particular exception is the rukhsa. {cite:muwafaqat p.183-184} He holds that the 'aza'im are God's right over servants while the rukhas are the servants' portion of God's kindness, so the permitted matters share with the rukhas in widening things for the servant and lifting hardship from him. {cite:muwafaqat p.185-186}."
