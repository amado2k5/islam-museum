id: concept/azima
class: concept
kind: legal
label:
  ar: "العَزِيمة"
  en: "Original ruling (azima) and concession (rukhsa)"
  fr: "Règle initiale (azima) et dispense (rukhsa)"
  ur: "عزیمت"
  es: "Decisión original (azima) y concesión (rukhsa)"
  tr: "Kararlılık"
  id: "Tekad"
summary:
  ar: "العزيمة في اللغة الاجتهاد والجد في الأمر، وفي الاصطلاح ما وسع للمكلف فعله لعذر مع قيام السبب المحرم، وقيل هي الحكم الأصلي السالم من المعارض {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11598} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11599}. وتنقسم عند الحنفية إلى فرض وواجب وسنة ونفل، وخصها القرافي بالواجب والمندوب، وذهب البيضاوي إلى أن الأحكام الخمسة تعتريها، وخصها بعض العلماء بالواجب {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11599}. وقد يرفع الشرع الحرج عن المكلف، فيكون مخيراً بين الأخذ بالعزيمة أو بالرخصة في بعض الأحوال، وتباينت أنظار المجتهدين في الترجيح بينهما {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11599} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11600}. وتفصيل ذلك في الملحق الأصولي {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11600}. ويعرّف الشاطبي في كتاب الأحكام العزيمة بأنها ما شرع من الأحكام الكلية ابتداء، أي ما لا يختص ببعض المكلفين دون بعض ولا ببعض الأحوال دون بعض كالصلاة والصوم والزكاة والحج والجهاد وسائر شعائر الإسلام، ويدخل فيه ما شرع لسبب مصلحي في الأصل كالمعاملات. {cite:muwafaqat p.183} ويقابلها الرخصة وهي ما شرع لعذر شاق استثناءً من أصل كلي يقتضي المنع مع الاقتصار على مواضع الحاجة، فلا تكون مشروعة ابتداء وليست كليات في الحكم؛ فالراجعة إلى أصل كلي ابتدائي هي العزيمة والراجعة إلى جزئي مستثنى هي الرخصة. {cite:muwafaqat p.183-184} ويقرر أن العزائم حق الله على العباد وأن الرخص حظ العباد من لطف الله، فالمباحات تشترك مع الرخص في التوسعة على العبد ورفع الحرج عنه. {cite:muwafaqat p.185-186}."
  en: "In the lexicon, azima is effort and earnestness in a matter, and the azima of God is His obligation. As a technical term it is what is made easier for the person in a case of excuse and inability while the forbidding cause still exists; by another definition it is the original ruling, free of any opposing ruling {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11598} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11599}. The Hanafis divide azima into obligation, necessity, sunna and voluntary; al-Qarafi restricts it to the obligatory and the recommended; al-Baydawi holds that all five rulings apply to it, while some restrict it to the obligatory {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11599}. Sometimes the law lifts hardship, so that the person may choose between the original ruling and the concession, and the jurists differ on which to prefer {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11599} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11600}. The full discussion is in the legal theory appendix {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11600}. In the Book of Rulings al-Shatibi defines the 'azima as what was legislated of universal rulings from the outset — rulings not confined to some of the obliged rather than others nor to some states rather than others, such as prayer, fasting, alms, pilgrimage, jihad and the other universal pillars of Islam — and includes what was legislated for a beneficial cause at root, such as transactions. {cite:muwafaqat p.183} Its counterpart is the rukhsa, legislated for a severe excuse as an exception from a universal prohibiting principle, confined to places of need, so it is not legislated from the outset nor universal in ruling: what refers to a primary universal principle is the 'azima, and what refers to a particular exception is the rukhsa. {cite:muwafaqat p.183-184} He holds that the 'aza'im are God's right over servants while the rukhas are the servants' portion of God's kindness, so the permitted matters share with the rukhas in widening things for the servant and lifting hardship from him. {cite:muwafaqat p.185-186}."
  fr: "Dans le lexique, azima signifie effort et application dans une affaire ; l’azima de Dieu est Son obligation. Comme terme technique, elle désigne ce qui est facilité à la personne en cas d’excuse et d’incapacité alors que la cause d’interdiction subsiste ; selon une autre définition, c’est la règle initiale, libre de toute règle contraire {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11598} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11599}. Les hanafites la divisent en obligation, nécessité, sunna et acte volontaire ; al-Qarafi la limite à l’obligatoire et au recommandé ; al-Baydawi estime qu’elle comprend les cinq qualifications juridiques, tandis que certains la limitent à l’obligatoire {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11599}. La Loi lève parfois la difficulté, laissant à la personne le choix entre règle initiale et dispense ; les juristes divergent sur celle qu’il convient de préférer {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11599} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11600}. La discussion complète figure dans l’annexe sur les fondements du droit {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11600}. Dans le Livre des règles, al-Shatibi définit l’azima comme les règles universelles édictées dès l’origine, non réservées à certains assujettis ou à certains états : prière, jeûne, aumône, pèlerinage, jihad et autres piliers universels de l’islam ; il y inclut les règles initialement instituées pour un intérêt, telles les transactions. {cite:muwafaqat p.183} Son pendant est la rukhsa, instituée pour une excuse grave comme exception à un principe général d’interdiction et limitée aux situations de besoin ; elle n’est donc ni initiale ni universelle. Ce qui relève d’un principe général premier est l’azima, ce qui relève d’une exception particulière la rukhsa. {cite:muwafaqat p.183-184} Selon lui, les aza'im sont le droit de Dieu sur les serviteurs, et les rukhas la part de Sa bonté qui leur revient ; les choses permises partagent donc avec les rukhas la fonction d’élargir les possibilités du serviteur et de lever la difficulté. {cite:muwafaqat p.185-186}."
  es: "En el léxico, azima es esfuerzo y diligencia en un asunto, y el azima de Dios es Su obligación. Como término técnico, es lo que se facilita a la persona en caso de excusa e incapacidad mientras la causa que lo prohíbe aún existe; según otra definición, es la norma original, libre de cualquier norma opuesta {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11598} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11599}. Los hanafíes dividen azima en obligación, necesidad, sunna y voluntaria; al-Qarafi la restringe a la obligatoria y la recomendada; al-Baydawi sostiene que las cinco normas se aplican a ella, mientras que algunos la restringen a la obligatoria {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11599}. A veces la ley alivia la dificultad, de modo que la persona puede elegir entre la resolución original y la concesión, y los juristas difieren en cuál preferir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11599} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11600}. La discusión completa se encuentra en el apéndice de teoría jurídica {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11600}. En el Libro de las Resoluciones, al-Shatibi define la 'azima como lo que fue legislado de las normas universales desde el principio — normas que no se limitan a algunos de los obligados en lugar de otros ni a algunos estados en lugar de otros, como la oración, el ayuno, la limosna, la peregrinación, la yihad y los demás pilares universales del Islam — e incluye lo que fue legislado para una causa beneficiosa en la raíz, como las transacciones. {cite:muwafaqat p.183} Su contraparte es la rukhsa, legislada para una excusa severa como excepción a un principio universal de prohibición, confinada a lugares de necesidad, por lo que no está legislada desde el principio ni es universal en su gobierno: lo que se refiere a un principio universal primario es el 'azima, y lo que se refiere a una excepción particular es la rukhsa. {cite:muwafaqat p.183-184} Él sostiene que los 'aza'im son el derecho de Dios sobre los siervos, mientras que las rukhas son la porción de los siervos de la bondad de Dios, por lo que los asuntos permitidos comparten con las rukhas para ampliar las cosas para el siervo y aliviar su dificultad. {cite:muwafaqat p.185-186}."
  ur: "لغت میں عزیمہ کسی معاملے میں کوشش اور جانفشانی کو کہتے ہیں اور خدا کا عزیمہ اس کا فرض ہے۔ ایک تکنیکی اصطلاح کے طور پر یہ وہی ہے جو عذر اور نااہلی کی صورت میں اس شخص کے لیے آسان بنا دیا جاتا ہے جب کہ منع کرنے کا سبب ابھی بھی موجود ہے۔ ایک اور تعریف کے مطابق یہ اصل حکم ہے، جو کسی بھی مخالف حکم سے پاک ہے {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 11598} احناف عجمی کو فرض، ضرورت، سنت اور رضاکارانہ میں تقسیم کرتے ہیں۔ القرافی اسے واجب اور مستحب تک محدود کرتا ہے۔ البیضاوی کا خیال ہے کہ پانچوں احکام اس پر لاگو ہوتے ہیں، جب کہ بعض اسے واجب تک محدود رکھتے ہیں بعض اوقات قانون سختی کو ختم کر دیتا ہے، تاکہ شخص اصل حکم اور رعایت میں سے انتخاب کر سکے، اور فقہاء کا اختلاف ہے کہ کس کو ترجیح دی جائے {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص 11599}۔ مکمل بحث قانونی نظریہ ضمیمہ میں ہے {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 11600}۔ احکام کی کتاب میں الشاطبی نے 'عظیمہ' کی تعریف اس طرح کی ہے جو شروع سے ہی عالمگیر احکام کی قانون سازی کی گئی تھی - احکام جو بعض واجبات تک محدود نہیں ہوتے ہیں نہ کہ دوسروں تک اور نہ ہی بعض ریاستوں کے بجائے دوسروں تک، جیسے نماز، روزہ، زکوٰۃ، حج، جہاد اور دیگر اسلامیات کے احکام جو اسلامیات کے لیے شامل ہیں۔ جڑ میں فائدہ مند وجہ، جیسے لین دین۔ {حوالہ: موفقات ص183} اس کا ہم منصب رخسہ ہے، جو ایک عالمگیر ممانعت کے اصول سے مستثنیٰ کے طور پر سخت عذر کے لیے قانون سازی کی گئی ہے، ضرورت کی جگہوں تک محدود ہے، اس لیے یہ نہ شروع سے قانون سازی کی گئی ہے اور نہ ہی حکم میں عالمگیر: جو چیز بنیادی 'عالمگیر' سے مراد ہے، سوائے ایک بنیادی 'عالمگیر' اصول کے، جو خصوصیت سے مراد ہے۔ رخسہ {حوالہ:موقفات ص 183-184} اس کا خیال ہے کہ عزائم بندوں پر خدا کا حق ہیں جبکہ رخس خدا کی مہربانی کا بندوں کا حصہ ہیں، اس لیے جائز امور بندے کے لیے چیزوں کو کشادہ کرنے اور اس سے مشقت اٹھانے میں رخس کے ساتھ شریک ہیں۔ {حوالہ:موفقات ص185-186}۔"
  tr: "Dilde 'Azimah', bir konuda gayret ve ciddiyet anlamına gelir. Terminolojide, yasak nedeni belirlenirken sorumlu kişinin bir mazeretle ne yapabileceğidir. Ayrıca, muhalefetten arınmış orijinal karar olarak kabul edilir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11598} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11599}. Hanefi'lere göre, zorunlu, zorunlu, sünnet ve gönüllü (zorunlu) olarak ikiye ayrılır. El-Karafi bunları zorunlu ve tavsiye edilen olarak belirtirken, El-Baydavi beş hükmün onlara uygulandığını savunurken, bazı alimler bunları zorunlu olarak belirtmiştir {atıf:fiqh-mawsua-kuveytiyya-noor-v3 s.11599}. Şeriat, sorumlunun yükünü kaldırabilir, böylece bazı durumlarda karar vermek ya da taviz vermek arasında seçim yapabilir. Müjtahidlerin görüşleri, tercihleri arasında farklılık gösterir {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.11599} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11600}. Bu konuda detaylar Usuli ekinde {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11600} bulunmaktadır. Al-Shatibi, 'Al-Ahkam' kitabında 'Azima'yı, baştan itibaren öngörülenler, yani sadece bazı hesap verebilir bireylerle ve başkaları olmadan diğer durumlarla sınırlı olmayan, dua, oruç, zekat, hac, cihat ve diğer İslami ritüeller gibi bazı durumlarla hariç tutulmayan azimler olarak tanımlar. Bu, aslında faydalı bir nedenle yasalaştırılmış olan, örneğin işlemleri içerir. {cite:muwafaqaqunaki, s.183} Bunun karşıtı ise taviz vardır; bu, zor bir bahane için yasalaştırılmış, yasaklama gerektiren evrensel bir ilkeyden istisna olan ve bunu ihtiyaç duyulan yerlerle sınırlandıran bir istisnadır. Bu nedenle, başlangıçta yasalaştırılmış değildir ve evrensel olarak hüküm sürmez; birincil evrensel ilkeden kaynaklanan şey kararlılıktır ve kısmi istisna olarak adlandırılan şey tavizdir. {cite:muwafaquk, s.183-184} Tavizlerin Tanrı'nın hizmetkarları üzerindeki hakkı olduğu ve tavizlerin hizmetkârların Tanrı'nın iyiliğinden pay olduğu kabul edilmiştir. Böylece, izin verilen eylemler, hizmetçinin yükünü genişletme ve zorlukları ortadan kaldırmada tavizlerle birlikte paylaşır. {cite:muwafaqun, s.185-186}."
  id: "Dalam bahasa, 'Azimah' berarti ketekunan dan keseriusan dalam suatu perkara. Dalam terminologi, ini adalah apa yang dapat dilakukan orang yang bertanggung jawab dengan alasan saat tujuan terlarang ditetapkan. Ini juga dikatakan sebagai putusan asli yang bebas dari oposisi {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11598} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11599}. Menurut Hanafi, aturan ini dibagi menjadi wajib, wajib, sunnah, dan sukarela (wajib). Al-Qarafi menetapkan aturan tersebut sebagai wajib dan direkomendasikan, sementara Al-Baydawi menyatakan bahwa lima peraturan tersebut berlaku untuk mereka, sementara beberapa ulama menyebutnya wajib {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11599}. Syariah dapat membebaskan beban dari pihak yang bertanggung jawab, sehingga ia dapat memilih antara mengambil keputusan atau konsesi dalam beberapa kasus. Pendapat para mujtahid berbeda dalam memilih di antara mereka {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11599} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11600}. Rincian tentang hal ini terdapat dalam lampiran Usuli {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11600}. Al-Shatibi mendefinisikan dalam bukunya 'Al-Ahkam' 'Azima' sebagai yang ditetapkan sejak awal, yaitu yang tidak terbatas pada individu yang bertanggung jawab tanpa yang lain, maupun pada kasus tertentu yang mengecualikan yang lain, seperti doa, puasa, zakat, ziarah, jihad, dan ritual Islam lainnya. Ini mencakup apa yang awalnya diatur untuk alasan yang menguntungkan, seperti transaksi. {cite:muwafaqat hlm.183} Berlawanan dengannya adalah konsesi, yang diatur sebagai alasan sulit, pengecualian dari prinsip universal yang memerlukan larangan, sambil membatasinya pada tempat-tempat yang membutuhkan. Dengan demikian, konsesi ini awalnya tidak diatur dan tidak universal dalam keputusan; yang berasal dari prinsip universal utama adalah penentuan, dan yang merujuk pada pengecualian parsial adalah konsesi. {cite:muwafaqat hlm.183-184} Telah ditetapkan bahwa konsesi adalah hak Allah atas hamba-hamba-Nya, dan konsesi adalah bagian hamba dari kebaikan Allah. Dengan demikian, tindakan yang dibenarkan berbagi dengan konsesi dalam memperluas beban hamba dan menghilangkan kesulitan darinya. {cite:muwafaqat hlm.185-186}."
