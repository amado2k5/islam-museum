summary:
  ar: "يذكر ابن سينا أن بعض الأدوية يناسب بعض الأمزجة، فالسقمونيا لا تعمل في البلدان الباردة إلا فعلاً ضعيفاً ما لم يكثر مقدارها كعادتها في بلاد الترك، وأن يخلط بالمسهلات الأدوية العطرية لحفظ قوى الأعضاء، وأن يركب مع الدواء البطيء ما يسرعه كالزنجبيل للتربد {cite:canon-ibn-sina-print-v1 p.284}."
  en: "Ibn Sina notes that some drugs suit some temperaments, so scammony acts only weakly in cold countries unless a large dose is used, as is the custom in the Turkic lands, that aromatic drugs are mixed into purgatives to keep the organs' powers, and that something like ginger is combined with a slow drug such as turbith to quicken it {cite:canon-ibn-sina-print-v1 p.284}."
