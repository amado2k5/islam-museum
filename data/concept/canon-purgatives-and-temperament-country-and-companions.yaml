id: concept/canon-purgatives-and-temperament-country-and-companions
class: concept
kind: scientific
label:
  ar: "المسهلات والمزاج والبلد والمرافقات عند ابن سينا"
  en: "Purgatives, temperament, country and companion drugs in the Canon"
  fr: "Purgatifs, tempéraments, pays et remèdes associés dans le Canon"
  ur: "مسہلات، مزاج، ملک اور ہمراہ دوائیں قانون میں"
  es: "Purgatorios, temperamento, país y drogas acompañantes en el Canon"
summary:
  ar: "يذكر ابن سينا أن بعض الأدوية يناسب بعض الأمزجة، فالسقمونيا لا تعمل في البلدان الباردة إلا فعلاً ضعيفاً ما لم يكثر مقدارها كعادتها في بلاد الترك، وأن يخلط بالمسهلات الأدوية العطرية لحفظ قوى الأعضاء، وأن يركب مع الدواء البطيء ما يسرعه كالزنجبيل للتربد {cite:canon-ibn-sina-print-v1 p.284}."
  en: "Ibn Sina notes that some drugs suit some temperaments, so scammony acts only weakly in cold countries unless a large dose is used, as is the custom in the Turkic lands, that aromatic drugs are mixed into purgatives to keep the organs' powers, and that something like ginger is combined with a slow drug such as turbith to quicken it {cite:canon-ibn-sina-print-v1 p.284}."
  fr: "Ibn Sina adapte les remèdes aux tempéraments : scammonée peu active en pays froid sauf forte dose, comme chez les Turcs ; aromatiques pour préserver les facultés organiques ; gingembre pour accélérer un lent comme le turbit {cite:canon-ibn-sina-print-v1 p.284}."
  es: "Ibn Sina señala que algunos medicamentos se adaptan a ciertos temperamentos, por lo que la escamonia actúa débilmente en países fríos a menos que se use una dosis grande, como es costumbre en las tierras túrquicas, que se mezclan drogas aromáticas con purgantes para mantener las facultades de los órganos, y que algo como el jengibre se combina con un medicamento lento como el turbith para acelerarlo {cite:canon-ibn-sina-print-v1 p.284}."
  ur: "ابن سینا نوٹ کرتے ہیں کہ کچھ دوائیں کچھ مزاج کے مطابق ہوتی ہیں، لہٰذا سرد ممالک میں اسکامونی صرف کمزوری سے کام کرتی ہے جب تک کہ زیادہ مقدار استعمال نہ کی جائے، جیسا کہ ترک ممالک میں رواج ہے، کہ خوشبو دار ادویات کو اعضاء کی طاقت کو برقرار رکھنے کے لیے رفع حاجت میں ملایا جاتا ہے، اور یہ کہ ادرک جیسی چیز کو تیز کرنے والی سستی دوا کے ساتھ ملایا جاتا ہے۔ {حوالہ: کینن ابن سینا پرنٹ v1 صفحہ 284}۔"
