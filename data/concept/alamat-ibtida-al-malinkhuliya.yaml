id: concept/alamat-ibtida-al-malinkhuliya
class: concept
kind: scientific
label:
  ar: "علامات ابتداء المالنخوليا واستحكامها"
  en: "Signs of the beginning and the settling of melancholia"
  fr: "Signes du début et de l’installation de la mélancolie"
  ur: "مالنخولیا کے آغاز اور پختگی کی علامات"
summary:
  ar: "يعدد ابن سينا علامات ابتداء المالنخوليا ⁦(ظن رديء وخوف بلا سبب وسرعة غضب وحب التخلي)⁩ وما يظهر إذا استحكمت من أنواع الخوف والتخيلات والضحك والبكاء، وفيه سطر موسوم في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v2 p.106}"
  en: "Ibn Sina lists the signs of the beginning of melancholia (a bad opinion, fear without cause, quick anger, love of solitude) and, once it is settled, the kinds of fear, imaginings, laughter and weeping; the record has a labelled line in a section held for the founder's ruling {cite:canon-ibn-sina-print-v2 p.106}"
  fr: "Ibn Sina énumère les signes du début de la mélancolie (jugement défavorable, crainte sans cause, promptitude à s’irriter, goût de la solitude), puis, une fois le mal installé, les différents types de crainte et de représentations, les rires et les pleurs. La fiche contient une ligne signalée dans une section réservée à la décision du fondateur. {cite:canon-ibn-sina-print-v2 p.106}"
  ur: "ابن سینا مالنخولیا کے آغاز کی علامات گنواتا ہے ⁦(برا گمان، بے سبب خوف، جلد غصہ، تنہائی کی چاہت)⁩ اور پختہ ہونے پر ظاہر ہونے والی خوف کی قسمیں، خیالات، ہنسی اور رونا بتاتا ہے؛ اس میں ایک موسوم سطر بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v2 p.106}۔"
