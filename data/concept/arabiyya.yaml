label:
  ar: "العَرَبِيَّة"
  en: "The Arabic language in jurisprudence (arabiyya)"
  fr: "La langue arabe en jurisprudence (arabiyya)"
  ur: "عربی زبان"
  es: "La lengua árabe en la jurisprudencia (arabiyya)"
  tr: "Arapça"
  id: "Arab"
summary:
  ar: "العربية في اللغة من عَرُب لسانه فصار عربياً فصيحاً، واللغة العربية ما نطقت به العرب، ونزل القرآن بها بحسب ما قاله الأزهري {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11542}. واستعمال الفقهاء للفظ لا يخرج عن معناه اللغوي {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11542}. والعجمية خلاف العربية، واللغة أعم منها لأنها تشمل كل كلام يعبر به قوم عن أغراضهم {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11542}. وللغة العربية فضل بأنها لسان أهل الجنة، ويثاب المرء على تعلمها وتعليمها {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11543}. ويرى الشافعي أن معرفة لسان العرب فرض على كل مكلف بقدر الجهد، ويتأكد على المجتهد، ويشترط الفقهاء العربية في قراءة القرآن والأذكار في الصلاة وخطبة الجمعة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11543} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11544}."
  en: "In the lexicon, 'Arabic' (arabiyya) describes a language that is eloquent and pure; the Arabic language is what the Arabs spoke, and the Qur'an came down in it. The jurists' usage stays within this meaning {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11542}. The opposite of Arabic is 'ajamiyya (non-Arabic); language (lugha) is wider, covering any speech by which a people express their aims {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11542}. Arabic has merit as the tongue of the people of paradise, and a person is rewarded for learning and teaching it {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11543}. Al-Shafi'i holds that knowing the Arabic language is obligatory on every responsible Muslim as far as his effort allows, and more so for the mujtahid; the jurists require Arabic for the Qur'an's recitation, the dhikr in prayer, the call to prayer and the Friday sermon {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11543} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11544}."
  fr: "Dans le lexique, « arabe » (arabiyya) décrit une langue éloquente et pure ; la langue arabe est celle que parlaient les Arabes et dans laquelle le Coran est descendu. L’usage des juristes demeure dans ce sens {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11542}. Le contraire de l’arabe est 'ajamiyya (non-arabe) ; langue (lugha) est plus large et englobe toute parole par laquelle un peuple exprime ses intentions {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11542}. L’arabe a le mérite d’être la langue des gens du paradis, et une personne est récompensée pour son apprentissage et son enseignement {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11543}. Al-Shafi'i considère que la connaissance de la langue arabe est obligatoire pour tout musulman juridiquement responsable, dans la mesure de ses efforts, et plus encore pour le mujtahid ; les juristes exigent l’arabe pour la récitation du Coran, le dhikr dans la prière, l’appel à la prière et le sermon du vendredi {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11543} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11544}."
  es: "En el léxico, «árabe» (arabiyya) describe una lengua elocuente y pura; el árabe es la lengua que hablaban los árabes, y en ella fue revelado el Corán. El uso que hacen los juristas se mantiene dentro de este significado {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11542}. Lo opuesto al árabe es «ajamiyya» (no árabe); el idioma (lugha) es más amplio y abarca cualquier forma de expresión mediante la cual un pueblo manifiesta sus objetivos {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11542}. El árabe tiene mérito como lengua de los habitantes del paraíso, y quien lo aprende y lo enseña es recompensado {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11543}. Al-Shafi'i sostiene que el conocimiento del idioma árabe es obligatorio para todo musulmán responsable en la medida en que su esfuerzo lo permita, y más aún para el mujtahid; los juristas requieren el árabe para la recitación del Corán, el dhikr en la oración, la llamada a la oración y el sermón del viernes {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11543} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11544}."
  ur: "لغت میں 'عربی' ⁦(عربیہ)⁩ ایک ایسی زبان کو بیان کرتا ہے جو فصیح اور پاکیزہ ہو۔ عربی زبان وہی ہے جو عرب بولتے تھے اور اسی میں قرآن نازل ہوا۔ فقہاء کا استعمال اسی مفہوم کے اندر رہتا ہے {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 11542}۔ عربی کا مخالف ہے 'عجمیہ' ⁦(غیر عربی)⁩؛ زبان ⁦(لغہ)⁩ وسیع ہوتی ہے، جس میں کسی بھی تقریر کا احاطہ کیا جاتا ہے جس کے ذریعے لوگ اپنے مقاصد کا اظہار کرتے ہیں اہل جنت کی زبان کے طور پر عربی فضیلت رکھتی ہے، اور اسے سیکھنے اور سکھانے پر ایک شخص کو اجر ملتا ہے {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 11543}۔ شافعی کا خیال ہے کہ عربی زبان کا جاننا ہر ذمہ دار مسلمان پر فرض ہے جہاں تک اس کی کوشش کی اجازت ہو، اور اس سے بھی زیادہ مجتہد کے لیے؛ فقہاء کو قرآن کی تلاوت، نماز میں ذکر، اذان اور جمعہ کے خطبہ کے لیے عربی کی ضرورت ہے"
  tr: "Arapça dili onun dilindeki Araplardan geldiği için etkileyici Arapça oldu ve Arapça telaffuz edilen dildir ve Kur'an El-Azhari'nin söylediklerine göre burada vahyedildi {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11542}. Ve hukukçular tarafından terimin kullanımı dilsel anlamından sapmaz {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11542}. Ajamiya Arapçadan farklıdır ve dil daha geniştir çünkü bir halkın amaçlarını ifade etmek için kullandığı her türlü konuşmayı içerir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11542}. Arapça, cennet halkının dili olarak erdemlidir ve onu öğrenip öğretmek ödüllendirilir {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.11543}. Al-Shafi'i, Arapların dilini bilmenin, her sorumlu kişinin çabasına göre zorunlu olduğuna inanır ve muctihid tarafından vurgulanır. Arap hukukçuları, Kur'an'ın okunmasını ve anmaların namaz ve Cuma vaazlarında yapılmasını isterler {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11543} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11544}."
  id: "Bahasa Arab berasal dari bahasa Arab dalam bahasanya, sehingga ia menjadi Arab yang fasih, dan bahasa Arab adalah apa yang diucapkan oleh orang Arab, dan Al-Qur'an diwahyukan di dalamnya sesuai dengan apa yang dikatakan Al-Azhari {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11542}. Dan penggunaan istilah ini oleh para ahli hukum tidak menyimpang dari makna linguistiknya {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11542}. Ajamiya berbeda dari bahasa Arab, dan bahasanya lebih luas karena mencakup setiap ucapan yang digunakan oleh suatu bangsa untuk mengungkapkan tujuan mereka {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11542}. Bahasa Arab adalah bahasa yang mulia sebagai bahasa umat Surga, dan seseorang diberi ganjaran karena belajar dan mengajarkannya {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11543}. Al-Shafi'i percaya bahwa mengetahui bahasa orang Arab adalah kewajiban bagi setiap orang yang bertanggung jawab sesuai dengan usahanya dan ditekankan oleh mujtahid. Ahli hukum Arab mengharuskan pembacaan Al-Qur'an dan peringatan dalam doa dan khotbah Jumat {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11543} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11544}."
