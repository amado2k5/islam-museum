label:
  ar: "العَرَبِيَّة"
  en: "The Arabic language in jurisprudence (arabiyya)"
  ur: "عربی زبان"
summary:
  ar: "العربية في اللغة من عَرُب لسانه فصار عربياً فصيحاً، واللغة العربية ما نطقت به العرب، ونزل القرآن بها بحسب ما قاله الأزهري {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11542}. واستعمال الفقهاء للفظ لا يخرج عن معناه اللغوي {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11542}. والعجمية خلاف العربية، واللغة أعم منها لأنها تشمل كل كلام يعبر به قوم عن أغراضهم {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11542}. وللغة العربية فضل بأنها لسان أهل الجنة، ويثاب المرء على تعلمها وتعليمها {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11543}. ويرى الشافعي أن معرفة لسان العرب فرض على كل مكلف بقدر الجهد، ويتأكد على المجتهد، ويشترط الفقهاء العربية في قراءة القرآن والأذكار في الصلاة وخطبة الجمعة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11543} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11544}."
  en: "In the lexicon, 'Arabic' (arabiyya) describes a language that is eloquent and pure; the Arabic language is what the Arabs spoke, and the Qur'an came down in it. The jurists' usage stays within this meaning {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11542}. The opposite of Arabic is 'ajamiyya (non-Arabic); language (lugha) is wider, covering any speech by which a people express their aims {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11542}. Arabic has merit as the tongue of the people of paradise, and a person is rewarded for learning and teaching it {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11543}. Al-Shafi'i holds that knowing the Arabic language is obligatory on every responsible Muslim as far as his effort allows, and more so for the mujtahid; the jurists require Arabic for the Qur'an's recitation, the dhikr in prayer, the call to prayer and the Friday sermon {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11543} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11544}."
