summary:
  ar: "خفاش في الكتاب مدخل ينقل فيه أقوالا عن شيرزق وعن دهن الخفاش ودماغه ورماده، وكلها نقل منسوب إلى الكتاب لا توصية؛ يقول إن شيرزق فيه جلاء شديد الحرارة، وإن دماغه مع العسل نافع لابتداء الماء في العين وإن رماده يحد البصر وإن الشيرزق نافع للظفرة والبياض، وفي دهنه قول موسوم عن الأثداء ينفيه الكتاب في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v1 p.711}"
  en: "Khuffash is in the book an entry that gives sayings about shirzq and about the oil, brain and ash of the bat, all of them reports attributed to the book and not recommendations; it says that shirzq has a cleansing very hot in degree, that its brain with honey benefits the beginning of cataract in the eye, that its ash sharpens sight and that shirzq benefits pterygium and whiteness, and there is in a labelled section a saying on the breasts concerning its oil which the book itself denies, held for the founder's ruling {cite:canon-ibn-sina-print-v1 p.711}"
  ur: "خفاش کتاب میں ایک اندراج ہے جس میں شیرزق اور چمگادڑ کی چربی، دماغ اور راکھ کے بارے میں اقوال نقل ہیں، یہ سب کتاب سے منسوب نقل ہیں سفارش نہیں؛ کتاب کہتی ہے کہ شیرزق میں سخت گرم صفائی ہے، اس کا دماغ شہد کے ساتھ آنکھ میں پانی اترنے کے آغاز میں نافع ہے، اس کی راکھ نظر کو تیز کرتی ہے اور شیرزق ناخنہ اور سفیدی میں نافع ہے، اور اس کی چربی کے بارے میں چھاتیوں سے متعلق ایک قول ایک موسوم قسم میں ہے جسے کتاب خود رد کرتی ہے، بانی کے فیصلے کے لیے موقوف {cite:canon-ibn-sina-print-v1 p.711}۔"
  es: "En el libro de Khuffash hay una entrada que contiene dichos sobre el shirzq y sobre el aceite, el cerebro y la ceniza del murciélago, todos ellos informes atribuidos al libro y no recomendaciones; dice que el shirzq tiene un grado de limpieza muy intenso, que su cerebro con miel beneficia el inicio de las cataratas en el ojo, que su ceniza agudiza la vista y que el shirzq beneficia el pterigión y la blancura, y hay en una sección etiquetada un dicho sobre los senos en relación con su aceite que el propio libro niega, reservándose la decisión del fundador {cite:canon-ibn-sina-print-v1 p.711}."
