label:
  ar: "الضب"
  en: "The lizard"
  ur: "چھپکلی"
  es: "El lagarto"
  fr: "Le lézard"
summary:
  ar: "قرّبت إلى النبي ضبّ مشويّ فلم يأكله وقال ليس بحرام ولكنه لم يكن بأرض قومي، وأكله خالد بن الوليد وهو ينظر: حديث المائدة في بيت ميمونة من أشهر أخبار الحيوان في السنة."
  en: "A grilled lizard was brought to the Prophet and he did not eat it: 'It is not unlawful, but it was never found in the land of my people' — while Khalid ibn al-Walid ate it under his eyes; the table hadith in Maymunah's house is among the most famous animal reports in the Sunna."
  ur: "نبی کے سامنے بھنی چھپکلی پیش کی گئی تو انہوں نے نہیں کھائی: 'حرام تو نہیں، لیکن یہ میرے قوم کی زمین کی خوراک نہیں رہی' — خالد بن ولید ان کی نظر کے سامنے کھاتے رہے؛ میمونہ کے گھر کا یہ مشہور واقعہ ہے۔"
  es: "Le trajeron un lagarto a la parrilla al Profeta, pero él no lo comió: «No es ilícito, pero nunca se encontró en la tierra de mi pueblo». Sin embargo, Khalid ibn al-Walid lo comió ante sus propios ojos; el hadiz de la mesa en la casa de Maymunah se encuentra entre los relatos sobre animales más famosos de la Sunna."
  fr: "On apporta au Prophète un lézard grillé, mais il ne le mangea pas: « Ce n'est pas illicite, mais on n'en a jamais trouvé au pays de mon peuple » — tandis que Khalid ibn al-Walid le mangea sous ses yeux; le hadith de la table dans la maison de Maymunah est parmi les récits d'animaux les plus célèbres de la Sunna."
