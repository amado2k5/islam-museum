  en: "The lizard"
  ur: "چھپکلی"
summary:
  ar: "قرّبت إلى النبي ضبّ مشويّ فلم يأكله وقال ليس بحرام ولكنه لم يكن بأرض قومي، وأكله خالد بن الوليد وهو ينظر: حديث المائدة في بيت ميمونة من أشهر أخبار الحيوان في السنة."
  en: "A grilled lizard was brought to the Prophet and he did not eat it: 'It is not unlawful, but it was never found in the land of my people' — while Khalid ibn al-Walid ate it under his eyes; the table hadith in Maymunah's house is among the most famous animal reports in the Sunna."
  ur: "نبی کے سامنے بھنی چھپکلی پیش کی گئی تو انہوں نے نہیں کھائی: 'حرام تو نہیں، لیکن یہ میرے قوم کی زمین کی خوراک نہیں رہی' — خالد بن ولید ان کی نظر کے سامنے کھاتے رہے؛ میمونہ کے گھر کا یہ مشہور واقعہ ہے۔"
