id: concept/taadhim-al-manafi
class: concept
kind: doctrine
tags: [islamic-economy-browser, islamic-economy-money]
label:
  ar: "تعظيم المنافع"
  en: "Maximisation of benefit in redistribution"
  es: "Maximización del beneficio en la redistribución"
  fr: "Maximisation des bénéfices en matière de redistribution"
  ur: "دوبارہ تقسیم میں فائدہ کا زیادہ سے زیادہ ہونا"
  tr: "Faydaları en üst düzeye çıkarmak"
  id: "Memaksimalkan manfaat"
summary:
  ar: "يرى المؤلف أن مبدأ تعظيم المنافع لا يقتصر على الإنتاج والاستهلاك، بل يمتد إلى إعادة التوزيع {cite:usul-iqtisad-islami-0660 p. 343}، ويستشهد بحديث «سبق درهم مئة ألف درهم» {cite:usul-iqtisad-islami-0660 p. 343}، وبقول العز بن عبد السلام إن على الإمام أن يقدم الضرورات على الحاجات، وأن يدفع إلى كل واحد ما يدفع حاجته لا ما يساوي مقداره {cite:usul-iqtisad-islami-0660 p. 343} {cite:usul-iqtisad-islami-0660 p. 344}."
  tr: "Yazar, faydaların maksimize edilmesi ilkesinin sadece üretim ve tüketimle sınırlı olmadığını, yeniden dağıtıma da uzandığını düşünmektedir {cite:usul-iqtisad-islami-0660 s. 343}; hadisi \"yüz bin dirhem öncesi bir dirhem vardı\" {cite:usul-iqtisad-islami-0660 s. 343} ve el-İzz bin Abdül-Selam'ın imamın ihtiyaçların önüne koyması ve her bireye ihtiyacını karşılayanı vermesi gerektiği, miktarına eşit olanı değil {cite:usul-iqtisad-islami-0660 s. 343} {cite:usul-iqtisad-islami-0660 s. 344} söylediğini belirtir."
  id: "Penulis percaya bahwa prinsip memaksimalkan manfaat tidak terbatas pada produksi dan konsumsi, tetapi juga meluas ke redistribusi {cite:usul-iqtisad-islami-0660 hlm. 343}, mengutip hadits \"satu dirham mendahului seratus ribu dirham\" {cite:usul-iqtisad-islami-0660 hlm. 343}, dan pepatah al-Izz ibn Abd al-Salam bahwa imam harus memprioritaskan kebutuhan di atas kebutuhan dan memberikan setiap orang apa yang memenuhi kebutuhannya, bukan apa yang setara dengan jumlahnya {cite:usul-iqtisad-islami-0660 hlm. 343} {cite:usul-iqtisad-islami-0660 hlm. 344}."
