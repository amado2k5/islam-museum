  ar: "يرى المؤلف أن مبدأ تعظيم المنافع لا يقتصر على الإنتاج والاستهلاك، بل يمتد إلى إعادة التوزيع {cite:usul-iqtisad-islami-0660 p. 343}، ويستشهد بحديث «سبق درهم مئة ألف درهم» {cite:usul-iqtisad-islami-0660 p. 343}، وبقول العز بن عبد السلام إن على الإمام أن يقدم الضرورات على الحاجات، وأن يدفع إلى كل واحد ما يدفع حاجته لا ما يساوي مقداره {cite:usul-iqtisad-islami-0660 p. 343} {cite:usul-iqtisad-islami-0660 p. 344}."
