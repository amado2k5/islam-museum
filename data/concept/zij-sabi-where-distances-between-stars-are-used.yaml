label: { ar: "موضع الحاجة إلى أبعاد الكواكب: القمر والمواليد", en: "Where the distances between stars are needed: the Moon and nativities", ur: "ستاروں کے فاصلوں کی ضرورت کہاں پڑتی ہے: چاند اور مواليد", es: "Dónde se necesitan las distancias entre las estrellas: la Luna y los nacimientos", fr: "Où les distances entre les étoiles sont nécessaires: la Lune et les nativités" }
summary:
  ar: "يعلن عنوان الباب أن معرفة هذه الأبعاد تُعلم بها بعد القمر عن الشمس على الحقيقة بحسب عرض القمر، ويقول البتاني في آخره إن أكثر ما يُحتاج إلى هذا الباب في عمل أمور المواليد، أي ما يتعلق بالمولد، وكلمة سابقة لذلك في الأصل تالفة في المسح الضوئي. فالباب نظري في طريقته، عملي في غايتين: بعد القمر المرئي من الشمس، وحساب المواليد. {cite:zij-sabi-nallino-byblion pp.61-65}."
  en: "The chapter's heading announces that these distances give the true distance of the Moon from the Sun according to the Moon's latitude, and al-Battani says at its end that this chapter is most needed in the work on nativities, that is on matters of birth; a word before that in the original is damaged in the scan. The chapter is theoretical in method and practical for two ends: the visible distance of the Moon from the Sun, and the casting of nativities. {cite:zij-sabi-nallino-byblion pp.61-65}."
  ur: "باب کا عنوان اعلان کرتا ہے کہ ان فاصلوں سے چاند کے عرض کے لحاظ سے سورج سے چاند کا حقیقی بعد معلوم ہوتا ہے، اور البتانی اس کے آخر میں کہتے ہیں کہ اس باب کی سب سے زیادہ ضرورت مواليد کے کام میں پڑتی ہے، یعنی ولادت سے متعلق امور میں؛ اس سے پہلے کا ایک لفظ اصل میں اسکین کی وجہ سے بگڑ گیا ہے۔ باب اپنے طریقے میں نظری اور دو مقاصد کے لیے عملی ہے: سورج سے چاند کا مرئی بعد، اور مواليد کا حساب۔ {cite:zij-sabi-nallino-byblion pp.61-65}۔"
  es: "El título del capítulo anuncia que estas distancias indican la distancia real de la Luna al Sol según su latitud, y al-Battani afirma al final que este capítulo es fundamental para el estudio de los nacimientos; una palabra anterior en el original se ha perdido en la digitalización. El capítulo es teórico en su metodología y práctico para dos fines: la distancia visible de la Luna al Sol y la elaboración de cartas natales. {cite:zij-sabi-nallino-byblion pp.61-65}."
  fr: "Le titre du chapitre annonce que ces distances donnent la distance réelle entre la Lune et le Soleil en fonction de la latitude lunaire. Al-Battani précise à la fin que ce chapitre est essentiel pour l'étude des thèmes astraux, c'est-à-dire des questions de naissance; un mot précédent dans le texte original est manquant dans la version numérisée. Le chapitre est théorique dans sa méthode et pratique dans son double but: le calcul de la distance visible entre la Lune et le Soleil, et l'établissement des thèmes astraux. {cite:zij-sabi-nallino-byblion pp.61-65}."
