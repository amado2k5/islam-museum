label: { ar: "موضع الحاجة إلى أبعاد الكواكب: القمر والمواليد", en: "Where the distances between stars are needed: the Moon and nativities", ur: "ستاروں کے فاصلوں کی ضرورت کہاں پڑتی ہے: چاند اور مواليد" }
summary:
  ar: "يعلن عنوان الباب أن معرفة هذه الأبعاد تُعلم بها بعد القمر عن الشمس على الحقيقة بحسب عرض القمر، ويقول البتاني في آخره إن أكثر ما يُحتاج إلى هذا الباب في عمل أمور المواليد، أي ما يتعلق بالمولد، وكلمة سابقة لذلك في الأصل تالفة في المسح الضوئي. فالباب نظري في طريقته، عملي في غايتين: بعد القمر المرئي من الشمس، وحساب المواليد. {cite:zij-sabi-nallino-byblion pp.61-65}."
  en: "The chapter's heading announces that these distances give the true distance of the Moon from the Sun according to the Moon's latitude, and al-Battani says at its end that this chapter is most needed in the work on nativities, that is on matters of birth; a word before that in the original is damaged in the scan. The chapter is theoretical in method and practical for two ends: the visible distance of the Moon from the Sun, and the casting of nativities. {cite:zij-sabi-nallino-byblion pp.61-65}."
  ur: "باب کا عنوان اعلان کرتا ہے کہ ان فاصلوں سے چاند کے عرض کے لحاظ سے سورج سے چاند کا حقیقی بعد معلوم ہوتا ہے، اور البتانی اس کے آخر میں کہتے ہیں کہ اس باب کی سب سے زیادہ ضرورت مواليد کے کام میں پڑتی ہے، یعنی ولادت سے متعلق امور میں؛ اس سے پہلے کا ایک لفظ اصل میں اسکین کی وجہ سے بگڑ گیا ہے۔ باب اپنے طریقے میں نظری اور دو مقاصد کے لیے عملی ہے: سورج سے چاند کا مرئی بعد، اور مواليد کا حساب۔ {cite:zij-sabi-nallino-byblion pp.61-65}۔"
