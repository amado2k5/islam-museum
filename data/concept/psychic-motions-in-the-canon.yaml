id: concept/psychic-motions-in-the-canon
class: concept
kind: scientific
label: { ar: "الحركات النفسانية عند ابن سينا", en: "The motions of the soul in the Canon", ur: "قانون میں نفسانی حرکات", es: "Los movimientos del alma en el Canon", fr: "Les mouvements de l'âme dans le Canon", tr: "İbn Sina'ya Göre Psikolojik Hareketler", id: "Gerakan psikologis menurut Ibn Sina" }
summary:
  ar: "في الفصل الرابع عشر، في موجبات الحركات النفسانية، يبين ابن سينا أن جميع العوارض النفسانية يتبعها أو يصحبها حركة الروح، إما إلى خارج وإما إلى داخل، وإما دفعة وإما قليلاً قليلاً {cite:canon-ibn-sina-print-v1 p.131}."
  en: "In the fourteenth chapter, on the causes that lie in the motions of the soul, Ibn Sina shows that all the soul's accidents are followed or accompanied by a movement of the spirit, outward or inward, suddenly or little by little {cite:canon-ibn-sina-print-v1 p.131}."
  es: "En el capítulo catorce, sobre las causas que residen en los movimientos del alma, Ibn Sina muestra que todos los accidentes del alma son seguidos o acompañados por un movimiento del espíritu, hacia afuera o hacia adentro, repentinamente o poco a poco {cite:canon-ibn-sina-print-v1 p.131}."
  fr: "Dans le quatorzième chapitre, sur les causes qui résident dans les mouvements de l'âme, Ibn Sina montre que tous les accidents de l'âme sont suivis ou accompagnés d'un mouvement de l'esprit, vers l'extérieur ou vers l'intérieur, soudainement ou petit à petit {cite:canon-ibn-sina-print-v1 p.131}."
  ur: "چودھویں باب میں روح کی حرکات میں پائے جانے والے اسباب کے بارے میں ابن سینا یہ بتاتے ہیں کہ روح کے تمام حادثات روح کی حرکت کے ساتھ ہوتے ہیں، ظاہری یا باطنی، اچانک یا تھوڑے تھوڑے سے۔"
  tr: "On dördüncü bölümde, psikolojik hareketlerin nedenleri üzerine İbn Sina, tüm psikolojik belirtilerin ruhun hareketiyle birlikte geldiğini veya eşlik ettiğini, ya dışa ya da içe, ya da yavaş yavaş itme yoluyla ya da yavaş yavaş {cite:canon-ibn-sina-print-v1 s.131} açıklar."
  id: "Dalam bab empat belas, tentang penyebab gerakan psikologis, Avicenna menjelaskan bahwa semua gejala psikologis diikuti atau disertai oleh pergerakan jiwa, baik ke luar maupun ke dalam, atau dalam dorongan atau sedikit demi sedikit {cite:canon-ibn-sina-print-v1 hlm.131}."
