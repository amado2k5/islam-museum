summary:
  ar: "في الفصل الرابع عشر، في موجبات الحركات النفسانية، يبين ابن سينا أن جميع العوارض النفسانية يتبعها أو يصحبها حركة الروح، إما إلى خارج وإما إلى داخل، وإما دفعة وإما قليلاً قليلاً {cite:canon-ibn-sina-print-v1 p.131}."
  en: "In the fourteenth chapter, on the causes that lie in the motions of the soul, Ibn Sina shows that all the soul's accidents are followed or accompanied by a movement of the spirit, outward or inward, suddenly or little by little {cite:canon-ibn-sina-print-v1 p.131}."
