id: concept/mafqud
class: concept
kind: legal
label:
  ar: المَفْقُود
  en: Missing person (mafqud)
  ur: مفقود (لاپتہ شخص)
summary:
  ar: "المفقود في اللغة الضائع والمعدوم، وفي الاصطلاح غائب لم يُدر موضعه ولا حياته ولا موته، وانقطع خبره. وتتناول المادة أحكام زوجته، فلا يؤثر الفقدان في عقد الزواج، وفي مدة التربص اختلف الفقهاء بين قول علي بالبقاء في العصمة حتى الموت أو الطلاق، وقول عمر بالتربص أربع سنين ثم عدة الوفاة. وتتناول أموال المفقود ونفقة زوجته وأولاده ووالديه، والوصية له، وإرثه الموقوف، وإدارة ماله بوكيل أو بمن يعينه القاضي، وانتهاء فقدانه بعودته أو بثبوت موته. وهذه المادة لم تُستوفَ بعد، وتستمر بعد صفحة 14836. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14829} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14830} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14831} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14832} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14833} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14834} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14835} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14836}"
  en: "A missing person (mafqud) is one who is lost or gone, whose place, life and death are unknown and whose news has ceased. The entry covers his wife, whose marriage the disappearance does not dissolve, the waiting period, where Ali held she waits for his death or divorce while Umar set four years followed by widowhood; his property and its sale; the maintenance of his wife, children and parents; bequests and his suspended inheritance; the management of his affairs; and the end of the disappearance by return or proof of death. This part of the entry is partial and continues beyond p.14836. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14829} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14830} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14831} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14832} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14833} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14834} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14835} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14836}"
  ur: "مفقود وہ غائب ہے جس کی جگہ، زندگی اور موت معلوم نہ ہو اور اس کی خبر منقطع ہو۔ فقدان سے نکاح ختم نہیں ہوتا، بیوی کی عدت میں اختلاف ہے، اور مال، نفقہ، وصیت اور وراثت کے احکام بیان ہوتے ہیں۔ یہ مدخل صفحہ 14836 کے بعد بھی جاری ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14829} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14830} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14836}"
