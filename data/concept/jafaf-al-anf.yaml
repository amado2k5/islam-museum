id: concept/jafaf-al-anf
class: concept
kind: scientific
label:
  ar: جفاف الأنف
  en: The dryness of the nose
  ur: ناک کی خشکی
summary:
  ar: جفاف الأنف قد يكون لحرارة وقد يكون ليبوسة شديدة وقد يكون لخلط لزج جف فيه وعلاج كل واحد منه ظاهر، وأنفع شيء فيه الأدهان والعصارات الباردة الرطبة وإخراج الخلط إن كان بعد تليينه بدهن أو عصارة حتى لا يخرج ما لا يتعاطى إخراجه ⁦(أسماء الأدهان والعصارات لا تحمل)⁩ {cite:canon-ibn-sina-print-v2 p.252}
  en: The nose's dryness may come of heat, of severe dryness, or of a viscid humour that has dried in it; the treatment of each is evident. The most useful things in it are oils and cold moist juices, and drawing the humour out — if present — after softening it with an oil or juice, lest what should not be extracted come out ⁦(the oil and juice names are not carried)⁩ {cite:canon-ibn-sina-print-v2 p.252}
  ur: ناک کی خشکی یا گرمی سے ہو سکتی ہے یا شدید یبوسہ سے یا کسی چپچپے خلط سے جو اس میں سوکھ گیا ہو؛ ہر ایک کا علاج ظاہر ہے؛ اس میں سب سے مفید تیل اور ٹھنڈے تر عصارے ہیں اور خلط کو — اگر ہو — نکالنا، مگر پہلے تیل یا عصارے سے نرم کرنے کے بعد کہ وہ چیز باہر نہ آئے جس کا نکالنا مطلوب نہیں ⁦(تیلوں اور عصاروں کے نام نہیں لیے گئے)⁩ {cite:canon-ibn-sina-print-v2 p.252}
