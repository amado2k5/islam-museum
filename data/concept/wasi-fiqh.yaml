label:
  ar: "وَصِيّ"
  en: "Wasi (executor)"
summary:
  ar: "الوصي في اللغة فَعيل بمعنى مفعول، وهو من عُهد إليه الأمر، ويُطلق أيضاً على الموصي فهو من الأضداد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17266} واصطلاحاً من عهد إليه الرجل أموره ليقوم بها بعد موته فيما يرجع إلى مصالحه كقضاء ديونه، وهو أعم من القيّم، وصلته بالوكيل أن كلّاً منهما يقوم مقام غيره ويتولى أمره، إلا أن الوصي يعمل بعد الموت والوكيل في الحياة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17266} وقبول الإيصاء: عند الحنفية لا ينبغي للإنسان أن يقبله لأنه على خطر، ونقل عن أبي يوسف أن الدخول فيه أول مرة غلط، والثانية خيانة، والثالثة سرقة؛ وعند الشافعية يسنّ القبول لمن يعلم من نفسه الأمانة، ومن علم ضعف نفسه حرم عليه، وعند الحنابلة الدخول فيه للقوي عليه قربة مندوبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17267} وشروط الوصي متفق عليها: العقل والإسلام إذا كان الموصى عليه مسلماً، والقدرة على التصرف، ومختلف في البلوغ والعدالة، وفي وقت اعتبار الشروط (ر: إيصاء، وصاية). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17267}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17268} ويصح قبول الوصي للإيصاء في حياة الموصي وبعد موته عند الجمهور، وعند الشافعية في الأصح لا يعتد بقبوله في حياة الموصي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17268} وتتحدد سلطة الوصي بما أُوصي به عموماً وخصوصاً، ويجوز تعدد الأوصياء بتعدد الأغراض، فإذا أوصى إلى رجلين مطلقاً ومات أحدهما لم ينفرد الآخر، وأقام القاضي أميناً مكانه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17268}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17269} وإذا فقد الوصي شرطاً من شروط توليته انعزل، ولكل وصي أن يعزل نفسه في حياة الموصي باتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17268} ويجوز جعل أجرة للوصي في الجملة لأنها بمنزلة الوكالة. وإن أذن الموصي لوصيّه أن يوصي إلى من يشاء فله ذلك، وإن عجز الوصي عن القيام بالوصية ضُم إليه آخر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17269} ويتصرف الوصي في مال الموصى عليه بالمصلحة وجوباً، لقول الله تعالى في مال اليتيم (سورتي الإسراء والبقرة)، وأما تزويج الوصي فللفقهاء فيه خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17269}"
  en: "In the lexicon wasi is a noun of the passive form, one to whom a matter is entrusted; the word is also used for the testator, so it is one of the words with two opposite senses. Technically it is one whom a man charges with his affairs to act for him after death in what concerns his interests, such as paying his debts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17266} The qayyim is wider than the wasi, and the wakil acts during life where the wasi acts after death; both stand in another's place. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17266} On accepting the commission, the Hanafis say a man should not accept it, as it is perilous; Abu Yusuf is reported to call a first acceptance an error, a second a betrayal and a third theft; the Shafi'is say it is recommended for one who knows himself trustworthy and forbidden for one who knows himself weak; the Hanbalis call it a recommended act for one able to bear it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17267} The conditions are agreed as sanity, Islam where the ward is Muslim and ability to act, and disputed as to puberty and justice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17267}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17268} On the moment of acceptance, the majority allow it both in the testator's life and after his death; the preferred Shafi'i view does not count acceptance in his life. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17268} The executor's power is bounded by what he is charged with, and several executors may be named for different tasks; if one dies, the judge appoints another in his place. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17268}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17269} An executor who loses a condition is dismissed, and he may release himself in the testator's life by agreement. A fee may be fixed for him in general, and a further executor may be added when he is unable to act. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17268}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17269} The executor must act for the ward's benefit, as the Qur'an requires in the verses on orphans' property. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17269}"
