label:
  ar: "وَصِيّ"
  en: "Wasi (executor)"
summary:
  ar: "الوصي في اللغة فَعيل بمعنى مفعول، وهو من عُهد إليه الأمر، ويُطلق أيضاً على الموصي فهو من الأضداد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17266} واصطلاحاً من عهد إليه الرجل أموره ليقوم بها بعد موته فيما يرجع إلى مصالحه كقضاء ديونه، وهو أعم من القيّم، وصلته بالوكيل أن كلّاً منهما يقوم مقام غيره ويتولى أمره، إلا أن الوصي يعمل بعد الموت والوكيل في الحياة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17266} وقبول الإيصاء: عند الحنفية لا ينبغي للإنسان أن يقبله لأنه على خطر، ونقل عن أبي يوسف أن الدخول فيه أول مرة غلط، والثانية خيانة، والثالثة سرقة؛ وعند الشافعية يسنّ القبول لمن يعلم من نفسه الأمانة، ومن علم ضعف نفسه حرم عليه، وعند الحنابلة الدخول فيه للقوي عليه قربة مندوبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17267} وشروط الوصي متفق عليها: العقل والإسلام إذا كان الموصى عليه مسلماً، والقدرة على التصرف، ومختلف في البلوغ والعدالة، وفي وقت اعتبار الشروط ⁦(ر: إيصاء، وصاية)⁩. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17267}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17268} ويصح قبول الوصي للإيصاء في حياة الموصي وبعد موته عند الجمهور، وعند الشافعية في الأصح لا يعتد بقبوله في حياة الموصي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17268} وتتحدد سلطة الوصي بما أُوصي به عموماً وخصوصاً، ويجوز تعدد الأوصياء بتعدد الأغراض، فإذا أوصى إلى رجلين مطلقاً ومات أحدهما لم ينفرد الآخر، وأقام القاضي أميناً مكانه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17268}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17269} وإذا فقد الوصي شرطاً من شروط توليته انعزل، ولكل وصي أن يعزل نفسه في حياة الموصي باتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17268} ويجوز جعل أجرة للوصي في الجملة لأنها بمنزلة الوكالة. وإن أذن الموصي لوصيّه أن يوصي إلى من يشاء فله ذلك، وإن عجز الوصي عن القيام بالوصية ضُم إليه آخر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17269} ويتصرف الوصي في مال الموصى عليه بالمصلحة وجوباً، لقول الله تعالى في مال اليتيم ⁦(سورتي الإسراء والبقرة)⁩، وأما تزويج الوصي فللفقهاء فيه خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17269} ويذكر ابن قدامة أن الوصية تصح إلى الرجل العاقل المسلم الحر العدل إجماعاً، ولا تصح إلى مجنون ولا طفل، ولا وصية لمسلم إلى كافر، وتصح إلى المرأة في قول أكثر أهل العلم منهم مالك والثوري والأوزاعي والشافعي وإسحاق وأصحاب الرأي، ولم يجزها عطاء لعدم أهليتها للقضاء. {cite:mughni-ibn-qudama p.1448} وتصح الوصية إلى الأعمى لتمكنه من التوكيل وكونه من أهل الولاية، وفي الصبي العاقل خلاف: ذهب الشافعي إلى عدم صحتها وهو المختار عند ابن قدامة، وقال القاضي إن قياس المذهب صحتها لأن أحمد نص على صحة وكالته. {cite:mughni-ibn-qudama p.1448} وفي العبد خلاف بين المذاهب: قال مالك والنخعي والأوزاعي وابن شبرمة تصح إلى عبده ولا تصح إلى عبد غيره، وقال أبو حنيفة والشافعي لا تصح إلى عبد بحال، وعند ابن قدامة تصح استنابة العبد في الحياة فصحت الوصية إليه كالحر، وقرّر الخرقي أن الوصية إلى أم ولده جائزة. {cite:mughni-ibn-qudama p.1448} ويجوز أن يجعل الموصي للوصي جُعلاً لأنها بمنزلة الوكالة، ويجوز أن يوصي إلى رجلين مطلقاً أو أن يجعل وصياً ثانياً شرطاً: إن مات الأول فإلى الثاني فيكون كل واحد منهما وصياً. {cite:mughni-ibn-qudama p.1450} وإذا أوصى إلى رجلين مطلقاً لم يجز لأحدهما الانفراد بالتصرف، فإن مات أحدهما أو جن أو وجد ما يوجب عزله أقام الحاكم مقامه أميناً، وإن طرأ على الوصي فسق بعد الوصية زالت ولايته وأقام الحاكم مقامه أميناً عند القاضي والشافعي وإسحاق، وقال الخرقي يضم إليه أمين ويبقى ناظراً. {cite:mughni-ibn-qudama p.1449-1450} وتعتبر شروط الوصي عند ابن قدامة حال العقد والوفاة معاً لأنها شروط صحة عقد، وللشافعي وجه باعتبارها عند الموت كالوصفة، والوصية للوارث صحيحة في نفسها وإنما يُعتبر عدم الإرث وخروجه من الثلث للنفوذ واللزوم. {cite:mughni-ibn-qudama p.1448-1449}"
  en: "In the lexicon wasi is a noun of the passive form, one to whom a matter is entrusted; the word is also used for the testator, so it is one of the words with two opposite senses. Technically it is one whom a man charges with his affairs to act for him after death in what concerns his interests, such as paying his debts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17266} The qayyim is wider than the wasi, and the wakil acts during life where the wasi acts after death; both stand in another's place. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17266} On accepting the commission, the Hanafis say a man should not accept it, as it is perilous; Abu Yusuf is reported to call a first acceptance an error, a second a betrayal and a third theft; the Shafi'is say it is recommended for one who knows himself trustworthy and forbidden for one who knows himself weak; the Hanbalis call it a recommended act for one able to bear it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17267} The conditions are agreed as sanity, Islam where the ward is Muslim and ability to act, and disputed as to puberty and justice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17267}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17268} On the moment of acceptance, the majority allow it both in the testator's life and after his death; the preferred Shafi'i view does not count acceptance in his life. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17268} The executor's power is bounded by what he is charged with, and several executors may be named for different tasks; if one dies, the judge appoints another in his place. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17268}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17269} An executor who loses a condition is dismissed, and he may release himself in the testator's life by agreement. A fee may be fixed for him in general, and a further executor may be added when he is unable to act. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17268}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17269} The executor must act for the ward's benefit, as the Qur'an requires in the verses on orphans' property. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17269} Ibn Qudama states that a bequest is valid to a sane, Muslim, free and just man by consensus, invalid to a madman or a child, and that a Muslim's bequest to an unbeliever is void; it is valid to a woman in most scholars' view — Malik, al-Thawri, al-Awza'i, al-Shafi'i, Ishaq and the opinion-jurists — though Ata did not allow it since she cannot judge. {cite:mughni-ibn-qudama p.1448} It is valid to a blind man, who can be delegated to and is fit for guardianship; on a sane minor the schools differ — al-Shafi'i held it invalid, Ibn Qudama's choice, while al-Qadi held the school's analogy makes it valid because Ahmad stated the validity of his agency. {cite:mughni-ibn-qudama p.1448} On a slave the schools differ: Malik, al-Nakha'i, al-Awza'i and Ibn Shubrama allow it to his own slave but not another's, Abu Hanifa and al-Shafi'i allow it to no slave, and for Ibn Qudama the slave's sound agency in life makes the bequest to him valid like a free man's, al-Khiraqi stating that a bequest to his umm walad is allowed. {cite:mughni-ibn-qudama p.1448} A fee may be fixed for the executor as in agency, and the testator may name two executors jointly or a second in succession — if the first dies the charge passes to the second, each being executor in turn. {cite:mughni-ibn-qudama p.1450} When two are named jointly neither may act alone; if one dies, goes mad or loses fitness the judge appoints an amine in his place, and if wickedness arises after the bequest his authority lapses and the judge installs an amine — the choice of al-Qadi, al-Thawri, al-Shafi'i and Ishaq — while al-Khiraqi has an amine added and the executor still overseeing. {cite:mughni-ibn-qudama p.1449-1450} Ibn Qudama holds the executor's conditions are reckoned at the contract and at death together, as conditions of a valid contract, whereas al-Shafi'i has a view reckoning them at death only like a prescribed bequest; a bequest to an heir is sound in itself, non-inheritance and the third-limit being required only for effect and obligation. {cite:mughni-ibn-qudama p.1448-1449}"
