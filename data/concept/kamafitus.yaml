summary:
  ar: "كمافيطوس نبات له قضبان وزهر أحمر إلى السواد أو أخضر دقيق، وطعم زهره مرّ مع قبض يسير، وهو عند الكتاب حار في الثانية مجفف في الثالثة، مفتح جلاء، وفيه قوة مسهلة."
  en: "Kamafitus is a plant with stems and flowers that are reddish-dark or fine green; its flower is bitter with slight astringency, and the book classes it as hot in the second degree and dry in the third, opening and cleansing, with a laxative force. The editor's footnote gives the name as ground pine."
  ur: "کمافیطوس ایک پودا ہے جس کی ٹہنیاں اور پھول سرخی مائل سیاہ یا باریک سبز ہوتے ہیں؛ اس کا پھول کڑوا ہوتا ہے اور اس میں ہلکا کسیلا پن ہے۔ کتاب اسے دوسرے درجے میں گرم اور تیسرے درجے میں خشک بتاتی ہے، کھولنے اور صاف کرنے والا، جس میں ملین کرنے کی قوت ہے۔ حاشیے کے مطابق اس کا نام زمینی صنوبر ہے۔"
  es: "Kamafitus es una planta con tallos y flores de color rojo oscuro o verde pálido; su flor es amarga con un ligero toque astringente, y el libro la clasifica como caliente en el segundo grado y seca en el tercero, de acción depurativa y laxante. La nota al pie del editor la denomina pino terrestre."
  fr: "Le kamafitus est une plante aux tiges et aux fleurs rouge foncé ou vert fin; sa fleur est amère et légèrement astringente. L’ouvrage la classe comme chaude au deuxième degré et sèche au troisième, purifiante et laxative. La note de bas de page de l’éditeur la nomme « pin rampant »."
  tr: "Kamafitus, kırmızıdan siyaha veya ince yeşile kadar uzanan çubukları ve çiçekleri olan, çiçeklerinin hafif kasılmasıyla acı bir tadı olan bir bitkidir. Kitaba göre, ikinci dönemde sıcak, üçüncüde kuru ve açık olur, müshil gücüne sahiptir."
  id: "Kamafitus adalah tanaman dengan batang dan bunga bervariasi dari merah hingga hitam atau hijau halus, dengan rasa pahit pada bunganya yang sedikit mengerut. Menurut buku, tanaman ini panas pada yang kedua dan kering pada yang ketiga, terbuka dan terbuka, serta memiliki kekuatan pencahar."
