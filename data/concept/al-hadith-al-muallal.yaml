id: concept/al-hadith-al-muallal
class: concept
kind: term
label:
  ar: "الحديث المعلل ⁦(علل الحديث)⁩"
  en: "The defective hadith (mu'allal) and the science of hidden defects"
  fr: "Le hadith défectueux (mu’allal) et la science des défauts cachés"
  es: "El hadiz defectuoso (mu'allal) y la ciencia de los defectos ocultos."
  ur: "عیب دار حدیث ⁦(معلل)⁩ اور مخفی عیبوں کی سائنس"
summary:
  ar: "الحديث المعلل عند ابن الصلاح هو الحديث الذي اطُّلع فيه على علة تقدح في صحته مع أن ظاهره السلامة منها، والعلة عبارة عن أسباب خفية غامضة قادحة، ويسميه المحدثون «المعلول». ومعرفة العلل عنده من أجلّ علوم الحديث وأدقها وأشرفها، لا يضطلع بها إلا أهل الحفظ والخبرة والفهم الثاقب، ويُستعان على إدراكها بتفرد الراوي ومخالفة غيره مع قرائن، والسبيل إليها عند الخطيب جمع الطرق والنظر في اختلاف الرواة. وتقع العلة في الإسناد غالباً وقد تقع في المتن. ومن أشهر كتب هذا الفن «علل الحديث» لابن أبي حاتم، وفيه سؤالاته لأبيه ولأبي زرعة {cite:muqaddima-ibn-salah-itr p. 89-93}{cite:ilal-ibn-abi-hatim-salafiyya-v1 PDF p. 13-14}."
  en: "For Ibn al-Salah a mu'allal hadith is one in which a defect has been found that impairs its soundness although it appears free of it; the defect consists of hidden, obscure, damaging causes, and hadith scholars also call such a hadith ma'lul. Knowing hidden defects is for him among the most important, subtle and noble of the hadith sciences, mastered only by those with memory, experience and penetrating understanding; it is detected through a narrator's solitariness and others' contradiction of him together with telling indications, and for al-Khatib the way to it is gathering all routes and examining the narrators' disagreements. The defect lies mostly in the chain, sometimes in the text. Among the famous books of the field is Ibn Abi Hatim's Ilal al-Hadith, built on his questions to his father and to Abu Zur'a."
  fr: "Pour Ibn al-Salah, un hadith mu’allal est un hadith dans lequel on a découvert un défaut qui compromet son authenticité alors qu’il paraît en être exempt. Ces défauts tiennent à des causes cachées, obscures et préjudiciables ; les spécialistes appellent aussi ce hadith ma’lul. Pour Ibn al-Salah, connaître ces défauts est l’une des branches les plus importantes, les plus subtiles et les plus nobles de la science du hadith. Seuls la maîtrisent ceux qui ont de la mémoire, de l’expérience et du discernement. On repère le défaut grâce à la singularité d’un transmetteur et aux contradictions entre son récit et ceux d’autres transmetteurs, ainsi qu’à des indices révélateurs. Pour al-Khatib, la méthode consiste à réunir toutes les voies et à examiner les divergences entre transmetteurs. Le défaut se trouve le plus souvent dans la chaîne, parfois dans le texte. Parmi les ouvrages connus figure l’Ilal al-Hadith d’Ibn Abi Hatim, fondé sur les questions qu’il a posées à son père et à Abu Zur’a."
  es: "Para Ibn al-Salah, un hadiz mu'allal es aquel en el que se ha hallado un defecto que menoscaba su autenticidad, aunque aparentemente esté libre de él; el defecto consiste en causas ocultas, oscuras y perjudiciales, y los eruditos del hadiz también lo denominan hadiz ma'lul. Conocer los defectos ocultos es para él una de las ciencias del hadiz más importantes, sutiles y nobles, dominada únicamente por aquellos con memoria, experiencia y una comprensión profunda; se detecta a través de la soledad del narrador y la contradicción de otros con respecto a él, junto con indicios reveladores, y para al-Khatib el camino para descubrirlo es recopilar todas las rutas y examinar las discrepancias entre los narradores. El defecto reside principalmente en la cadena, a veces en el texto. Entre los libros más famosos del campo se encuentra Ilal al-Hadith de Ibn Abi Hatim, basado en sus preguntas a su padre y a Abu Zur'a."
  ur: "ابن الصلاح کے نزدیک معلّل حدیث وہ ہے جس میں کوئی عیب پایا گیا ہو جو اس کی صحت کو خراب کر دے حالانکہ وہ اس سے پاک نظر آتی ہے۔ عیب پوشیدہ، مبہم، نقصان دہ اسباب پر مشتمل ہوتا ہے، اور محدثین بھی ایسی حدیث کو معلول کہتے ہیں۔ چھپے ہوئے نقائص کو جاننا اس کے لیے علم حدیث کا سب سے اہم، لطیف اور عمدہ ہے، جس میں صرف وہی لوگ مہارت حاصل کرتے ہیں جو یادداشت، تجربہ اور دخول سمجھنے والے ہوں۔ اس کا پتہ ایک راوی کی تنہائی اور اس سے دوسرے کے تضاد کے ساتھ اشارے بتانے سے ہوتا ہے، اور خطیب کے لیے اس کا راستہ تمام راستوں کو جمع کرنا اور راویوں کے اختلاف کا جائزہ لینا ہے۔ عیب زیادہ تر زنجیر میں ہوتا ہے، بعض اوقات متن میں۔ اس میدان کی مشہور کتابوں میں ابن ابی حاتم کی اِلال الحدیث بھی ہے جو ان کے والد اور ابو زرعہ کے سوالات پر بنائی گئی ہے۔"
