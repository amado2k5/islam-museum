summary:
  ar: "يرى ابن سينا أن الأخلاط النيئة إذا لم تكن في العروق بل في الأعضاء الأصلية دلكهم بالأدهان المرخية اللزجة وسقاهم المسخنات حتى تبلغ الجلد ثم الاستحمام والفودنجي قبل الطعام والرياضة، ويذكر أدهان البابونج والشبث والمرزنجوش للمسح {cite:canon-ibn-sina-print-v1 pp.248-249}."
  en: "Ibn Sina holds that when the raw humours are not in the vessels but in the principal organs, they are rubbed with relaxing viscous oils and given heating drinks that reach the skin, then bathed and given pennyroyal before food and exercise, and he names chamomile, dill and marjoram oils for anointing {cite:canon-ibn-sina-print-v1 pp.248-249}."
