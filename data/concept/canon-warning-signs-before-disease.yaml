label: { ar: "العلامات المنذرة بالأمراض عند ابن سينا", en: "Warning signs before disease in the Canon", ur: "بیماری سے پہلے کی انتباہی علامات قانون میں" }
summary:
  ar: "يفتتح ابن سينا تدبير المسافرين، وهو ثمانية فصول، بفصل في تدارك أعراض تنذر بأمراض: يربط كل عرض مستمر بمرض يخشى وقوعه، ويوصي بتدبير الأمر قبل أن يقع، فالخفقان الدائم ينذر بموت الفجأة، والكابوس والدوار بالصرع والسكتة، والاختلاج بالتشنج، والغم والخوف بلا سبب بالماليخوليا {cite:canon-ibn-sina-print-v1 pp.259-260}."
  en: "Ibn Sina opens the regimen of travellers, in eight chapters, with a chapter on forestalling symptoms that foretell diseases: each persistent symptom is tied to a disease feared to follow, and the person is told to act before it comes, so that constant palpitation warns of sudden death, nightmare and vertigo of epilepsy and apoplexy, twitching of spasm, and fear or grief without cause of melancholia {cite:canon-ibn-sina-print-v1 pp.259-260}."
