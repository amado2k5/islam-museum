label: { ar: "العلامات المنذرة بالأمراض عند ابن سينا", en: "Warning signs before disease in the Canon", ur: "بیماری سے پہلے کی انتباہی علامات قانون میں", es: "Señales de advertencia antes de que se produzca una enfermedad en el Canon", fr: "Signes avant-coureurs de la maladie dans le Canon" }
summary:
  ar: "يفتتح ابن سينا تدبير المسافرين، وهو ثمانية فصول، بفصل في تدارك أعراض تنذر بأمراض: يربط كل عرض مستمر بمرض يخشى وقوعه، ويوصي بتدبير الأمر قبل أن يقع، فالخفقان الدائم ينذر بموت الفجأة، والكابوس والدوار بالصرع والسكتة، والاختلاج بالتشنج، والغم والخوف بلا سبب بالماليخوليا {cite:canon-ibn-sina-print-v1 pp.259-260}."
  en: "Ibn Sina opens the regimen of travellers, in eight chapters, with a chapter on forestalling symptoms that foretell diseases: each persistent symptom is tied to a disease feared to follow, and the person is told to act before it comes, so that constant palpitation warns of sudden death, nightmare and vertigo of epilepsy and apoplexy, twitching of spasm, and fear or grief without cause of melancholia {cite:canon-ibn-sina-print-v1 pp.259-260}."
  es: "Ibn Sina abre el régimen del viajero, en ocho capítulos, con un capítulo sobre la prevención de síntomas que presagian enfermedades: cada síntoma persistente está vinculado a una enfermedad que se teme que siga, y se le dice a la persona que actúe antes de que llegue, de modo que las palpitaciones constantes advierten de muerte súbita, las pesadillas y el vértigo de epilepsia y apoplejía, los espasmos musculares y el miedo o la pena sin causa de melancolía {cite:canon-ibn-sina-print-v1 pp.259-260}."
  fr: "Ibn Sina ouvre le régime des voyageurs, en huit chapitres, par un chapitre sur les symptômes préventifs qui annoncent les maladies: chaque symptôme persistant est lié à une maladie que l'on craint de voir survenir, et il est conseillé à la personne d'agir avant qu'elle ne se manifeste, de sorte que les palpitations constantes annoncent une mort subite, les cauchemars et les vertiges l'épilepsie et l'apoplexie, les contractions les spasmes, et la peur ou le chagrin sans cause la mélancolie {cite:canon-ibn-sina-print-v1 pp.259-260}."
  ur: "ابن سینا نے مسافروں کے طرز عمل کو آٹھ ابواب میں کھولا ہے، ایک باب کے ساتھ علامات کو روکنے کے بارے میں جو بیماریوں کی پیش گوئی کرتے ہیں: ہر ایک مستقل علامت کو بیماری سے جوڑا جاتا ہے جس کے بعد آنے کا اندیشہ ہوتا ہے، اور انسان کو کہا جاتا ہے کہ وہ اس کے آنے سے پہلے عمل کرے، تاکہ مسلسل دھڑکن ناگہانی موت، ڈراؤنے خواب اور چکر آنا، چکر آنا اور دماغی بیماری کی علامات ظاہر کرے۔ اور خوف یا غم بغیر کسی وجہ کے میلانکولیا {حوالہ: کینن ابن سینا پرنٹ-v1 صفحہ 259-260}۔"
