id: concept/canon-limits-and-aftercare-of-evacuation
class: concept
kind: scientific
label:
  ar: "حدود الاستفراغ وما بعده عند ابن سينا"
  en: "The limits and aftercare of evacuation in the Canon"
  fr: "Limites et suites de l’évacuation dans le Canon"
  ur: "استفراغ کی حدیں اور اس کے بعد کی نگہداشت قانون میں"
  es: "Los límites y la atención posterior a la evacuación en el Canon"
  tr: "İbn Sina'ya göre kusmanın sınırları ve sonrası"
  id: "Batas muntah dan lebih dari itu menurut Ibn Sina"
summary:
  ar: "يذكر ابن سينا أن أسهل المواد استفراغاً ما هو في العروق وأن ما في الأعضاء والمفاصل يعسر إخراجه، وأن المستفرغ لا يبادر إلى غذاء كثير نيء، وأن إبقاء بقية من المادة أقل ضرراً من الاستقصاء حتى تخور القوة، ويستفرغ قليلاً قليلاً إذا كانت المادة لزجة أو شديدة الاختلاط بالدم {cite:canon-ibn-sina-print-v1 pp.275-276}."
  en: "Ibn Sina says the matter easiest to evacuate is that in the vessels, while what lies in organs and joints is hard to bring out; that someone evacuated must not rush to much raw food; that leaving a remnant of the matter is less harmful than pressing on until the strength gives way; and that evacuation is done little by little when the matter is sticky or tightly mixed with blood {cite:canon-ibn-sina-print-v1 pp.275-276}."
  fr: "Ibn Sina juge facile l’évacuation vasculaire, difficile celle des organes et articulations ; il déconseille beaucoup de cru immédiatement après, préfère un reste de matière à l’effondrement de force et décrit progression pour matière visqueuse ou intimement mêlée au sang {cite:canon-ibn-sina-print-v1 pp.275-276}."
  es: "Ibn Sina dice que la materia más fácil de evacuar es la que se encuentra en los vasos, mientras que lo que se encuentra en los órganos y las articulaciones es difícil de extraer; que alguien que ha evacuado no debe apresurarse a comer mucha comida cruda; que dejar un remanente de la materia es menos dañino que presionar hasta que la fuerza ceda; y que la evacuación se realiza poco a poco cuando la materia es pegajosa o está muy mezclada con sangre {cite:canon-ibn-sina-print-v1 pp.275-276}."
  ur: "ابن سینا کہتے ہیں کہ سب سے آسان چیز برتنوں میں ہے جب کہ اعضاء اور جوڑوں میں موجود چیز کو باہر نکالنا مشکل ہے۔ کہ کسی کو نکالا گیا ہے اسے زیادہ کچے کھانے کے لیے جلدی نہیں کرنی چاہیے۔ کہ اس معاملے کی باقیات کو چھوڑنا اس سے کم نقصان دہ ہے جب تک کہ طاقت نہ آجائے۔ اور یہ انخلاء آہستہ آہستہ کیا جاتا ہے جب معاملہ چپچپا یا مضبوطی سے خون میں گھل جاتا ہے۔"
  tr: "İbn Sina, kusması en kolay olan maddelerin damarlardaki maddeler olduğunu, organlarda ve eklemlerde olanların atılmasının zor olduğunu, atılan maddenin hemen çok fazla çiğ yiyecek tüketmediğini ve maddenin kalıntısını bırakmanın, gücü buharlaşana kadar aramaktan daha az zararlı olduğunu, madde yapışkan veya kanla çok karışmışsa yavaş yavaş kusmaya başladığını belirtir {cite:canon-ibn-sina-print-v1 s.275-276}."
  id: "Ibn Sina menyebutkan bahwa zat yang paling mudah dimuntahkan adalah yang ada di pembuluh darah, bahwa apa yang ada di organ dan sendi sulit untuk dikeluarkan, bahwa zat yang dikeluarkan tidak langsung mengonsumsi banyak makanan mentah, dan bahwa meninggalkan sisa zat tersebut lebih tidak berbahaya daripada mencari sampai kekuatan menguap, dan muntah sedikit demi sedikit jika zat itu lengket atau sangat bercampur dengan darah {cite:canon-ibn-sina-print-v1 hlm.275-276}."
