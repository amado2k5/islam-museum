label: { ar: "حدود الاستفراغ وما بعده عند ابن سينا", en: "The limits and aftercare of evacuation in the Canon", ur: "استفراغ کی حدیں اور اس کے بعد کی نگہداشت قانون میں" }
summary:
  ar: "يذكر ابن سينا أن أسهل المواد استفراغاً ما هو في العروق وأن ما في الأعضاء والمفاصل يعسر إخراجه، وأن المستفرغ لا يبادر إلى غذاء كثير نيء، وأن إبقاء بقية من المادة أقل ضرراً من الاستقصاء حتى تخور القوة، ويستفرغ قليلاً قليلاً إذا كانت المادة لزجة أو شديدة الاختلاط بالدم {cite:canon-ibn-sina-print-v1 pp.275-276}."
  en: "Ibn Sina says the matter easiest to evacuate is that in the vessels, while what lies in organs and joints is hard to bring out; that someone evacuated must not rush to much raw food; that leaving a remnant of the matter is less harmful than pressing on until the strength gives way; and that evacuation is done little by little when the matter is sticky or tightly mixed with blood {cite:canon-ibn-sina-print-v1 pp.275-276}."
