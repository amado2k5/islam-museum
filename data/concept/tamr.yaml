summary:
  ar: "تمر في الكتاب معروف، حار رطب في الأولى وحرارته أكثر من رطوبته، ويصدع، ويصلحه اللوز والخشخاش وبعدهما سكنجبين ساذج، ويورد الكتاب قولا عن زيادة المني في فقرة موسومة معلقة لحكم المؤسس {cite:canon-ibn-sina-print-v1 p.690}"
  en: "Tamr is in the book well known, hot and moist in the first degree with its heat greater than its moisture; it causes headache, and almond and poppy correct it, and after them plain sikanjabin; the book gives a statement on semen in a labelled section held for the founder's ruling {cite:canon-ibn-sina-print-v1 p.690}"
  ur: "تمر کتاب میں معروف ہے، پہلے درجے میں گرم تر ہے اور اس کی گرمی اس کی تری سے زیادہ ہے، سر درد پیدا کرتا ہے، اور بادام اور خشخاش اس کی اصلاح کرتے ہیں اور ان کے بعد سادہ سکنجبین؛ کتاب منی سے متعلق ایک بات موسوم حصے میں دیتی ہے جو بانی کے فیصلے کے لیے موقوف ہے {cite:canon-ibn-sina-print-v1 p.690}۔"
  es: "Tamr es bien conocido en el libro, caliente y húmedo en primer grado, con su calor mayor que su humedad; causa dolor de cabeza, y la almendra y la amapola lo corrigen, y después de ellas el simple sikanjabin; el libro da una declaración sobre el semen en una sección etiquetada reservada para el dictamen del fundador {cite:canon-ibn-sina-print-v1 p.690}"
