summary:
  ar: "ظلف في الكتاب معروف، وإذا طلي داء الثعلب برماد ظلف الماعز مخلوطا بالخل أو بالشراب نفع منفعة بينة؛ وبه ينتهي الكلام من حرف الظاء وما ذكر فيه أكثر من دواءين {cite:canon-ibn-sina-print-v1 p.722}"
  en: "Zilf is in the book known, and when da' al-tha'lab is smeared with the ash of the hoof of the goat mixed with vinegar or with drink (sharab) it clearly benefits; with it the discussion of the letter za' ends, what is mentioned in it being more than two drugs {cite:canon-ibn-sina-print-v1 p.722}"
  ur: "ظلف کتاب میں معروف ہے، اور جب داء الثعلب پر بکری کے کھر کی راکھ سرکے یا مشروب کے ساتھ ملا کر لگائی جائے تو واضح فائدہ ہوتا ہے؛ اسی کے ساتھ حرف ظا کا کلام ختم ہوتا ہے اور اس میں ذکر کی گئی چیزیں دو دواؤں سے زیادہ ہیں {cite:canon-ibn-sina-print-v1 p.722}۔"
