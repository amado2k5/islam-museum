label: { ar: "خط نصف النهار وخطوط الساعات على الرخامة", en: "The noon line and the hour lines of the marble dial", ur: "رخامہ پر خطِ نصف النہار اور ساعات کی خطوط" }
summary:
  ar: "تُرسم الساعات بوصل نقط ساعات الجدي بعضها ببعض، ونقط ساعات السرطان بعضها ببعض، بخطوط متعرضة في الرخامة، فتخرج من نقطة الساعة الواحدة من الجدي إلى نقطة الساعة الواحدة من السرطان. ويُجعل ابتداء العد من ناحية المغرب، ويُكتب الساعة الأولى والثانية والثالثة تحت كل نقطة من نقاط ساعات الجدي إلى تمام الحادية عشرة. ويُمنع أن يعرف بالرخامة أكثر ما بين ساعة ماضية من النهار إلى تمام الحادية عشرة ساعة، لانتداد الظل وطوله في طرفي النهار. {cite:zij-sabi-nallino-byblion pp.208-209}"
  en: "The hour points of Capricorn are joined to one another, and the hour points of Cancer to one another, by crossing lines on the marble, and each point of the first hour of Capricorn is joined to the first hour of Cancer. The count starts from the western side, and the first, second and third hours are written under each point of Capricorn up to the eleventh. It is not feasible to read from the dial more than the hours from the first to the eleventh, because the shadow stretches too far at the ends of the day. {cite:zij-sabi-nallino-byblion pp.208-209}"
  ur: "جدی کے ساعاتی نقطوں کو آپس میں اور سرطان کے ساعاتی نقطوں کو آپس میں رخامہ پر آڑی لکیروں سے ملایا جاتا ہے، اور جدی کی پہلی ساعت کا نقطہ سرطان کی پہلی ساعت سے۔ گنتی مغربی جانب سے شروع ہوتی ہے اور جدی کے ہر نقطے کے نیچے پہلی، دوسری اور تیسری ساعت گیارہویں تک لکھی جاتی ہے۔ رخامہ سے دن کی پہلی ساعت سے گیارہ ساعت تک سے زیادہ معلوم نہیں ہوتا، کیونکہ دن کے دونوں کناروں پر سایہ بہت لمبا ہو جاتا ہے۔ {cite:zij-sabi-nallino-byblion pp.208-209}"
