summary:
  ar: "أحد الأقلام الستة الموزونة، قرين التوقيع الدقيق، يصل حروفًا لا تتصل عادة كالألف واللام والراء بالراء، واستعمل في الوثائق والخواتيم وزخرفة الصفحات المذهبة {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 26} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 41}."
  en: "One of the six proportional pens, the small partner of tawqi', joining letters that normally stay apart, such as alif with lam or ra with ra, and used for documents, colophons and illuminated pages {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 26} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 41}."
  ur: "اقلامِ ستہ میں سے ایک، توقیع کا باریک جوڑی دار، جو عام طور پر الگ رہنے والے حروف جیسے الف لام یا را را کو جوڑتا ہے؛ دستاویزات، ترقیموں اور مذہّب صفحات میں برتا گیا {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 26} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 41}۔"
  es: "Una de las seis plumas proporcionales, la compañera pequeña de tawqi', que une letras que normalmente permanecen separadas, como alif con lam o ra con ra, y que se utiliza para documentos, colofones y páginas iluminadas {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 26} {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 41}."
