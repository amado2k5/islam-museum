id: concept/hasad-envy
class: concept
kind: ethical
label: { ar: "الحسد", en: "Envy (hasad)", ur: "حسد ⁦(رشک و حسد)⁩", es: "Envidia (hasad)", fr: "Envie (hasad)", tr: "Kıskançlık", id: "iri hati" }
summary:
  ar: "الحسد في الاصطلاح تمني زوال النعمة عن الغير، وهو حرام بإجماع الأمة، والغبطة أن يتمنى مثل النعمة من غير زوالها عن صاحبها، وهي محمودة في الطاعة مباحة في المباح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7084} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7086} وأسبابه العداوة، والتعزز، والكبر، والتعجب، والخوف من فوات المقاصد، وحب الرئاسة، وخبث النفس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7084} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7085} ومراتب الحسد أربع: تمني زوال النعمة مع عدم انتقالها، وتمني زوالها ليأخذها الحاسد، وتمني مثلها فإن عجز أحب زوالها، والغبطة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7085} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7086} والحسد حرام بالكتاب والسنة والمعقول، وقد أمر الله بالاستعاذة من شر الحاسد إذا حسد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7086} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7087} ويستثنى منه أن تكون النعمة عند كافر أو فاسق يستعين بها على المعصية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7087} وعلاجه بالعلم بأن الحسد ضرر على الحاسد دنيا ودينا، وبالرقية والتعوذ والدعاء بالبركة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7087} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7088} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7089}"
  en: "Envy (hasad) is wishing that a blessing be taken from another; the community agrees it is forbidden. Admiring (ghibta) is wishing for a like blessing without wishing it removed from its owner; it is praised in obedience and lawful in what is lawful. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7084} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7086} Its causes are enmity, wanting to be above others, pride, astonishment, fear of losing aims, love of rank, and a grudging soul. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7084} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7085} It has four grades: wishing the blessing removed without wanting it for oneself; wishing it removed in order to take it; wishing for its like and, failing that, wishing it removed; and admiring. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7085} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7086} Envy is forbidden by the Qur'an, the Sunna and reason, and God commanded seeking refuge from the envier's evil when he envies. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7086} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7087} It is excepted when the blessing is in the hands of an unbeliever or a sinner who would use it for disobedience. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7087} Its cure is knowledge that envy harms the envier in this world and the next and does no harm to the envied, and the Prophetic remedies of refuge, charms and blessing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7087} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7088} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7089}"
  es: "La envidia (hasad) es desear que una bendición sea quitada a otro; la comunidad está de acuerdo en que está prohibida. La admiración (ghibta) es desear una bendición similar sin desear que se le quite a su dueño; es alabada en obediencia y lícita en lo que es lícito. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7084} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7086} Sus causas son la enemistad, el deseo de estar por encima de los demás, el orgullo, el asombro, el miedo a perder los objetivos, el amor al rango y un alma rencorosa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7084} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7085} Tiene cuatro grados: desear que la bendición sea quitada sin desearla para uno mismo; desear que se elimine para tomarlo; desear algo similar y, si no es posible, desear que se elimine; y admirar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7085} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7086} La envidia está prohibida por el Corán, la Sunna y la razón, y Dios ordenó buscar refugio del mal del envidioso cuando envidia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7086} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7087} Se exceptúa cuando la bendición está en manos de un incrédulo o un pecador que la usaría para desobedecer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7087} Su cura reside en el conocimiento de que la envidia perjudica al envidioso en este mundo y en el venidero, y no perjudica al envidiado, así como en los remedios proféticos de refugio, amuletos y bendiciones. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7087} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7088} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7089}"
  fr: "L'envie (hasad) consiste à souhaiter qu'une bénédiction soit retirée à autrui; la communauté s'accorde à dire qu'elle est interdite. L'admiration (ghibta) consiste à souhaiter une bénédiction similaire sans vouloir la retirer à son détenteur; elle est louable dans l'obéissance et licite dans ce qui est licite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7084} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7086} Ses causes sont l'inimitié, le désir de dominer autrui, l'orgueil, l'étonnement, la peur de ne pas atteindre ses objectifs, l'amour du rang et la rancune. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7084} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7085} Elle comporte quatre degrés: souhaiter que la bénédiction soit retirée sans la désirer pour soi-même; L'envie consiste à souhaiter qu'on la retire pour la prendre; à désirer quelque chose de semblable et, à défaut, à souhaiter qu'on la retire; et à admirer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7085} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7086} L'envie est interdite par le Coran, la Sunna et la raison, et Dieu a ordonné de se réfugier auprès de lui contre le mal de l'envieux lorsqu'il envie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7086} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7087} Elle est toutefois permise lorsque la bénédiction est entre les mains d'un mécréant ou d'un pécheur qui l'utiliserait pour désobéir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7087} Son remède est la connaissance que l'envie nuit à l'envieux dans ce monde et dans l'autre, mais ne nuit pas à celui qui est envié, ainsi que les remèdes prophétiques de refuge, d'invocations et de bénédiction. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7087} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7088} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7089}"
  ur: "حسد ⁦(حسد)⁩ یہ خواہش ہے کہ نعمت کسی دوسرے سے لی جائے۔ کمیونٹی متفق ہے کہ یہ حرام ہے۔ تعریف کرنا ⁦(غیبت)⁩ اس جیسی نعمت کی خواہش کرنا ہے بغیر اس کے کہ اس کو اس کے مالک سے ہٹا دیا جائے۔ اس کی تعریف اطاعت میں کی جاتی ہے اور جو حلال ہے اس میں جائز ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7084} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7086} اس کے اسباب ہیں دشمنی، دوسروں سے بالاتر ہونے کی خواہش، غرور، تعجب، مقاصد کے کھو جانے کا خوف اور درجہ کی محبت۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7084} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7085} اس کے چار درجات ہیں: نعمت کو اپنے لیے نہ چاہتے ہوئے ہٹانا۔ اسے لینے کے لیے اسے ہٹانے کی خواہش کرنا؛ اس کی طرح کی خواہش کرنا اور، اس میں ناکامی، اسے ہٹانے کی خواہش کرنا؛ اور تعریف. {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ7085} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7086} قرآن، سنت اور عقل نے حسد کو حرام قرار دیا ہے، اور خدا نے حسد کرنے والے کے شر سے پناہ مانگنے کا حکم دیا ہے جب وہ حسد کرے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7086} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص7087} مستثنیٰ ہے جب نعمت کسی کافر یا گنہگار کے ہاتھ میں ہو جو اسے نافرمانی کے لیے استعمال کرے۔ اس کا علاج وہ علم ہے جو حسد کرنے والے کو دنیا و آخرت میں نقصان پہنچاتا ہے اور حسد کرنے والے کو کوئی نقصان نہیں پہنچاتا، اور پناہ، کرامت اور برکت کا نبوی علاج۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.7087} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7088}"
  tr: "Kıskançlık, terimlerde, kutsamanın başkalarından geçmesini dilemektir ve bu oybirliğiyle yasaktır. Mutluluk, sahibinin kaybolmadan bir nimeti dilememektir ve itaatle övülür, izin verilenlerde ise kabul edilir. {atıf:fiqh-mawsua-kuveytiyya-noor-v3 s.7084} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7086} Nedenleri düşmanlık, kibir, kibir, şaşkınlık, hedefleri kaçırma korkusu, liderlik sevgisi ve ruhun kötülüğüdür. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7084} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7085} Kıskançlık seviyeleri dörttür: nimetin geçmeden yok olmasını dilemek, kıskançının onu alabilmesi için yok olmasını dilemek, yapamadığında aynı dileği dilemek ve sevinçle sevinmek. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7085} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7086} Kıskançlık Kur'an, Sünnet ve akl tarafından yasaktır ve Allah kıskançlık ederse kötülüğünden sığınmayı emretmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7086} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7087} ancak kutsama, günahta yardım için kullanan bir kâfir veya günahkârla yapılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7087} ve kıskançlığın hem dünyevi yaşamda hem de dinde kıskançlara zarar verdiğini bilerek ve ruqyah ile sığınma ve bereket için yalvararak ele almak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7087} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7088} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7089}"
  id: "Iri, dalam istilah, adalah berharap berkat itu hilang dari orang lain, yang secara bulat dilarang. Kebahagiaan adalah menginginkan berkat tanpa pemiliknya hilang, dan dipuja dalam ketaatan serta diperbolehkan dalam apa yang diperbolehkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7084} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7086} Penyebabnya adalah permusuhan, kesombongan, kesombongan, keterkejutan, takut kehilangan tujuan, cinta kepemimpinan, dan kebencian jiwa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7084} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7085} Tingkat iri hatinya ada empat: berharap berkat itu hilang tanpa berlalu, berharap agar berkat itu hilang agar orang iri bisa mengambilnya, berharap hal yang sama jika tidak mampu, dan menikmati kegembiraan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7085} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7086} Iri hati dilarang oleh Al-Qur'an, Sunnah, dan akal, dan Allah telah memerintahkan untuk mencari perlindungan dari kejahatan orang iri jika ia iri. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7086} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7087} kecuali berkat itu ada pada orang kafir atau pendosa yang menggunakannya untuk membantu dalam dosa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7087} dan memperlakukannya dengan pengetahuan bahwa iri merugikan yang iri baik dalam kehidupan duniawi maupun agama, serta dengan ruqyah, mencari perlindungan dan permohonan berkah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7087} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7088} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7089}"
