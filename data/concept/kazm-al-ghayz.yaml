summary:
  ar: "كظم الغيظ عند الشيخ عمر عبد الكافي عمل عظيم القدر عند الله، والعفو ثمرته، والصبر على من يسيء موضع امتحانه، وقد يهدم الغضب غير المكظوم البيوت {cite:assabile-omar-abdelkafy al-fawzu-al-moubeen/ep14 00:00:00}."
  en: "For Sheikh Omar Abdelkafy, restraining anger is a deed of great standing with God. Pardon is its fruit, patience with an offender is the real test, and anger that is not restrained can ruin homes {cite:assabile-omar-abdelkafy al-fawzu-al-moubeen/ep14 00:00:00}."
  ur: "شیخ عمر عبدالکافی کے نزدیک غصہ ضبط کرنا اللہ کے ہاں بڑے مرتبے کا عمل ہے، معافی اس کا پھل ہے، خطا کار پر صبر اصل امتحان ہے، اور ضبط نہ ہونے والا غصہ گھر برباد کر سکتا ہے {cite:assabile-omar-abdelkafy al-fawzu-al-moubeen/ep14 00:00:00}۔"
