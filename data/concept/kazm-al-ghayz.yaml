tags: [akhlaq-browser, akhlaq-hilm]
label:
  ar: "كظم الغيظ"
  en: "Restraining anger (kazm al-ghayz)"
  ur: "غصہ ضبط کرنا"
  es: "Controlar la ira (kazm al-ghayz)"
  fr: "Maîtriser sa colère (kazm al-ghayz)"
  tr: "Öfkeyi bastır"
  id: "Menekan kemarahan"
summary:
  ar: "كظم الغيظ عند الشيخ عمر عبد الكافي عمل عظيم القدر عند الله، والعفو ثمرته، والصبر على من يسيء موضع امتحانه، وقد يهدم الغضب غير المكظوم البيوت {cite:assabile-omar-abdelkafy al-fawzu-al-moubeen/ep14 00:00:00}."
  en: "For Sheikh Omar Abdelkafy, restraining anger is a deed of great standing with God. Pardon is its fruit, patience with an offender is the real test, and anger that is not restrained can ruin homes {cite:assabile-omar-abdelkafy al-fawzu-al-moubeen/ep14 00:00:00}."
  ur: "شیخ عمر عبدالکافی کے نزدیک غصہ ضبط کرنا اللہ کے ہاں بڑے مرتبے کا عمل ہے، معافی اس کا پھل ہے، خطا کار پر صبر اصل امتحان ہے، اور ضبط نہ ہونے والا غصہ گھر برباد کر سکتا ہے {cite:assabile-omar-abdelkafy al-fawzu-al-moubeen/ep14 00:00:00}۔"
  es: "Para el jeque Omar Abdelkafy, refrenar la ira es una obra de gran valor ante Dios. El perdón es su fruto, la paciencia con el ofensor es la verdadera prueba, y la ira descontrolada puede arruinar hogares {cite:assabile-omar-abdelkafy al-fawzu-al-moubeen/ep14 00:00:00}."
  fr: "Pour le cheikh Omar Abdelkafy, maîtriser sa colère est un acte très apprécié de Dieu. Le pardon en est le fruit, la patience envers celui qui a offensé en est la véritable épreuve, et une colère non maîtrisée peut détruire des foyers."
  tr: "Şeyh Ömer Abdul Kafi'ye göre öfkeyi bastırmak Allah huzurunda çok değerli bir eylemdir ve bağışlamak onun meyvesidir. Sınavlarını yanıltanlara karşı sabır ve dizginlenmemiş öfke evleri yok edebilir {cite:assabile-omar-abdelkafy al-fawzu-al-moubeen/ep14 00:00:00}."
  id: "Menahan amarah menurut Sheikh Omar Abdul Kafi adalah tindakan yang sangat berharga di hadapan Tuhan, dan pengampunan adalah buahnya. Kesabaran terhadap mereka yang menyesatkan ujian mereka, dan amarah yang tak terkendali dapat menghancurkan rumah {cite:assabile-omar-abdelkafy al-fawzu-al-moubeen/ep14 00:00:00}."
