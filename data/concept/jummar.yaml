  en: "Jummar (the palm heart)"
  ur: "جمار ⁦(کھجور کا دل)⁩"
summary:
  ar: "قلب النخلة، بارد في الثانية يابس في الأولى، قابض؛ ينفع من خشونة الحلق، ويقبض الإسهال والنزف، وضماده ينفع من لسع الزنبور {cite:canon-ibn-sina-print-v1 p.425}."
  en: "The heart of the palm. Cold in the second degree and dry in the first; astringent. It helps roughness of the throat, stops diarrhoea and bleeding, and a poultice of it helps a wasp sting {cite:canon-ibn-sina-print-v1 p.425}."
  ur: "کھجور کا دل۔ دوسرے درجے میں ٹھنڈا اور پہلے میں خشک، قابض ہے؛ گلے کی کھردراہٹ میں مفید ہے، اسہال اور خون بہنا روکتا ہے، اور اس کا لیپ بھڑ کے ڈنک میں مفید ہے {cite:canon-ibn-sina-print-v1 p.425}۔"
