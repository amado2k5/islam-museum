label: { ar: "العداوة والمودة", en: "Enmity and affection (al-adawa wal-mawadda)" }
term: { ar: "العداوة والمودة", en: "adawa / mawadda" }
summary:
  ar: "في شرح قوله تعالى في سورة المائدة (82) يعرّف رشيد رضا العداوة بأنها بغضاء يظهر أثرها في القول والعمل، والمودة بأنها محبة يظهر أثرها في القول والعمل، خلافاً للجمهور الذين فسّروها بالمحبة مطلقاً. ثم يرد تعليلاً يجعل العداوة والمودة نتاج تنازع المنافع والسيادة، ويقول إنه صحيح في جملته لا في تفصيله، ويرى أن العلة الصحيحة هي الحالة الروحية الناشئة عن التقاليد الدينية والتربية الأدبية والاجتماعية."
  en: "In his reading of Qur'an 5:82, Rida defines enmity as hatred that shows in speech and action and affection as love that shows in speech and action, against the majority of commentators who take mawadda as love in general. He rejects the view that enmity and affection come only from conflicting interests and holds that the cause is the spiritual state formed by religious and moral upbringing. This is Rida's own reading, labelled as such."
