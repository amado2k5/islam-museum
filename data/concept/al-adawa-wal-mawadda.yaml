id: concept/al-adawa-wal-mawadda
class: concept
kind: term
label: { ar: "العداوة والمودة", en: "Enmity and affection (al-adawa wal-mawadda)", fr: "L’inimitié et l’affection (al-adawa wal-mawadda)", es: "Enemistad y afecto (al-adawa wal-mawadda)", ur: "عداوت اور الفت ⁦(العدوۃ والموادۃ)⁩" }
term: { ar: "العداوة والمودة", en: "adawa / mawadda" }
summary:
  ar: "في شرح قوله تعالى في سورة المائدة (82) يعرّف رشيد رضا العداوة بأنها بغضاء يظهر أثرها في القول والعمل، والمودة بأنها محبة يظهر أثرها في القول والعمل، خلافاً للجمهور الذين فسّروها بالمحبة مطلقاً. ثم يرد تعليلاً يجعل العداوة والمودة نتاج تنازع المنافع والسيادة، ويقول إنه صحيح في جملته لا في تفصيله، ويرى أن العلة الصحيحة هي الحالة الروحية الناشئة عن التقاليد الدينية والتربية الأدبية والاجتماعية."
  en: "In his reading of Qur'an 5:82, Rida defines enmity as hatred that shows in speech and action and affection as love that shows in speech and action, against the majority of commentators who take mawadda as love in general. He rejects the view that enmity and affection come only from conflicting interests and holds that the cause is the spiritual state formed by religious and moral upbringing. This is Rida's own reading, labelled as such."
  fr: "Dans sa lecture de Coran 5:82, Rida définit l’inimitié comme une haine qui se manifeste dans la parole et l’action, et l’affection comme un amour qui se manifeste dans la parole et l’action, à l’encontre de la majorité des commentateurs, qui entendent mawadda comme l’amour en général. Il rejette l’avis selon lequel l’inimitié et l’affection ne proviendraient que d’intérêts opposés, et tient que leur cause est l’état spirituel formé par l’éducation religieuse et morale. C’est la lecture propre de Rida, présentée comme telle."
  es: "En su interpretación del Corán 5:82, Rida define la enemistad como el odio que se manifiesta en palabras y acciones, y el afecto como el amor que se manifiesta en palabras y acciones, en contra de la mayoría de los comentaristas que interpretan la mawadda como amor en general. Rechaza la opinión de que la enemistad y el afecto provengan únicamente de intereses contrapuestos y sostiene que la causa reside en el estado espiritual formado por la educación religiosa y moral. Esta es la interpretación de Rida, tal como se indica."
  ur: "قرآن 5:82 کی اپنی پڑھائی میں، ردا نے دشمنی کو نفرت سے تعبیر کیا ہے جو کہ قول و فعل میں ظاہر ہوتی ہے اور محبت جو کہ قول و فعل میں ظاہر ہوتی ہے، مفسرین کی اکثریت کے خلاف جو عام طور پر معدودے کو محبت کے طور پر لیتے ہیں۔ وہ اس نظریے کو رد کرتا ہے کہ دشمنی اور پیار صرف متضاد مفادات سے پیدا ہوتا ہے اور اس کا خیال ہے کہ اس کی وجہ مذہبی اور اخلاقی پرورش سے تشکیل پانے والی روحانی حالت ہے۔ یہ ردا کی اپنی پڑھائی ہے، جس کا لیبل لگا ہوا ہے۔"
