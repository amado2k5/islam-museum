class: concept
kind: scientific
label: { ar: "الرصد قرب المنقلبين لمعرفة خط نصف النهار في الزيج الصابي", en: "Observing near a solstice for the noon line", ur: "خط نصف النہار کے لیے انقلابین کے قریب رصد", es: "Observando cerca de un solsticio para la línea del mediodía", fr: "Observation de la ligne de midi près d'un solstice", tr: "Sabi astronomik tablolarında meridyen çizgisini belirlemek için iki ters çevirme noktasının yakınında gözlem yapılması.", id: "Mengamati di dekat dua titik inversi untuk menentukan garis meridian dalam tabel astronomi Sabi." }
summary:
  ar: "ينبّه البتاني إلى أن الرصد أصح كلما قربت الشمس من نقطة المنقلب، أيّ المنقلبين كان، لأن حركة الشمس في الميل تبطؤ فيما بين الرصدين، أعني رصدي الظل. ثم يقرر أن وقت انتصاف النهار غير محدود بالحقيقة، وأن هذه الطريقة تعرّفه أو تعرّف أقرب الأوقات إليه. {cite:zij-sabi-nallino-byblion p.39}."
  en: "Al-Battani remarks that the observation is the more exact the nearer the Sun is to a solstitial point, whichever solstice it is, because the Sun's motion in declination is slow between the two observations, that is, the two shadow marks. He then states that the moment of midday is not strictly fixed, and that this method finds it or the time nearest to it. {cite:zij-sabi-nallino-byblion p.39}."
  ur: "البتانی متنبہ کرتے ہیں کہ رصد اتنی ہی زیادہ صحیح ہوتی ہے جتنا سورج انقلاب کے نقطے کے قریب ہو، دونوں میں سے کوئی بھی انقلاب ہو، کیونکہ دونوں رصدوں یعنی سائے کے دونوں نشانوں کے بیچ سورج کی میل میں حرکت سست ہوتی ہے۔ پھر وہ بتاتے ہیں کہ دوپہر کا لمحہ حقیقت میں متعین نہیں، اور یہ طریقہ اسے یا اس کے قریب ترین وقت کو معلوم کراتا ہے۔ {cite:zij-sabi-nallino-byblion p.39}۔"
  es: "Al-Battani señala que la observación es más precisa cuanto más cerca esté el Sol de un punto solsticial, sea cual sea, porque el movimiento de declinación del Sol es lento entre las dos observaciones, es decir, las dos marcas de sombra. Luego afirma que el momento del mediodía no está estrictamente fijado y que este método lo encuentra o el momento más cercano a él. {cite:zij-sabi-nallino-byblion p.39}."
  fr: "Al-Battani remarque que l'observation est d'autant plus précise que le Soleil est proche d'un solstice, quel qu'il soit, car son mouvement de déclinaison est lent entre les deux observations, c'est-à-dire entre les deux ombres portées. Il précise ensuite que le moment de midi n'est pas strictement fixe et que cette méthode permet de le trouver, ou le moment le plus proche. {cite:zij-sabi-nallino-byblion p.39}."
  tr: "Al-Battani, güneşin gündönümüne ne kadar yakınsa, gözlemin o kadar doğru olduğunu belirtir; çünkü güneşin sapmasındaki hareket, iki gözlem arasında, yani iki gölge gözlemi arasında yavaşlar. Daha sonra öğle vaktinin tam olarak sabit olmadığını ve bu yöntemin onu veya ona en yakın zamanı belirlediğini ifade eder. {cite:zij-sabi-nallino-byblion s.39}."
  id: "Al-Battani menunjukkan bahwa pengamatan menjadi lebih akurat semakin dekat matahari dengan titik balik matahari, mana pun dari kedua titik balik matahari tersebut, karena pergerakan matahari dalam deklinasinya melambat antara dua pengamatan, yaitu, dua pengamatan bayangan. Kemudian ia menyatakan bahwa waktu tengah hari tidak benar-benar tetap, dan bahwa metode ini menentukan waktu tersebut atau waktu terdekat dengannya. {cite:zij-sabi-nallino-byblion p.39}."
