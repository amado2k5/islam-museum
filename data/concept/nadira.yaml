label: { ar: "النُّدْرَة", en: "Rarity and the rare case (nadira)", ur: "ندرت ⁦(نادر حالت)⁩", es: "Rareza y el caso excepcional (nadira)", fr: "Rareté et cas rare (nadira)", tr: "kıtlık", id: "Kelangkaan" }
summary:
  ar: "الندرة في اللغة سقوط الشيء أو خروجه أو شذوذه، وفي اصطلاح الفقهاء النادر ما قل وجوده وإن لم يخالف القياس، والشاذ ما خالفه. والأصل في الشرع اعتبار الغالب، وقد يلغي الشرع الغالب رحمة بالعباد فيقدم النادر، كحكم الولد لستة أشهر وطهارة النعال والحصير، وقد يلغي الشرع النادر والغالب معاً كشهادة الصبيان في الأموال. والنادر إذا دام التحق بالغالب، وفي إلحاق النادر بالغالب تفصيل أربعة أقسام، وهناك صور في السلم والقراض والعدة، وندرة المعدن تخمس عند المالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15551} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15552} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15553} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15554} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15555} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15556} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15557}"
  en: "Nadira, in the lexicon, is the falling away or the rare appearance of a thing; in the usage of the jurists, the rare case is one that is seldom found, even if it does not contradict analogy, and the anomaly (shadhdh) is one that does. The rule in law is to follow the common case, but the law sometimes sets aside the common case out of mercy, as in the child born in six months and the sandal and mat, and sometimes sets aside both, as in the testimony of children in property. A rare case that persists joins the common one; the Zarkashi divides cases where a rare case joins the common one into four. There are cases in contracts of salam, partnership and waiting periods, and the Malikis treat a rare find of metal as subject to the fifth. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15551} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15552} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15553} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15554} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15555} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15556} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15557}"
  ur: "ندرت وہ صورت ہے جو کم پائی جائے۔ شریعت عام طور پر غالب کا اعتبار کرتی ہے، مگر کبھی رحمت کے طور پر نادر کو غالب پر ترجیح دیتی ہے، جیسے چھ ماہ میں پیدا ہونے والے بچے کا نسب۔ جو نادر صورت دوام پکڑ لے وہ غالب کے حکم میں آ جاتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15551} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15552} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15553} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15554} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15555} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15556} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15557}"
  es: "Nadira, en el léxico, es la desaparición o la rara aparición de algo; en el uso de los juristas, el caso raro es aquel que se encuentra con poca frecuencia, incluso si no contradice la analogía, y la anomalía (shadhdh) es aquella que sí lo hace. La regla en derecho es seguir el caso común, pero la ley a veces lo deja de lado por misericordia, como en el caso del niño nacido a los seis meses y la sandalia y la estera, y a veces deja de lado ambos, como en el testimonio de los niños en materia de propiedad. Un caso raro que persiste se une al común; el Zarkashi divide los casos en los que un caso raro se une al común en cuatro. Hay casos en contratos de salam, sociedades y períodos de espera, y los Malikis tratan el hallazgo raro de metal como sujeto al quinto. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15551} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15552} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15553} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15554} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15555} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15556} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15557}"
  fr: "Nadira, dans le lexique, désigne la disparition ou l'apparition rare d'une chose. Pour les juristes, un cas rare est un cas peu fréquent, même s'il ne contredit pas l'analogie, tandis qu'une anomalie (shadhdh) est un cas qui la contredit. La règle de droit est de suivre le cas commun, mais la loi peut parfois s'en écarter par clémence, comme dans le cas de l'enfant né à six mois et de la sandale et de la natte, et parfois les deux, comme dans le témoignage des enfants en matière de propriété. Un cas rare qui persiste se joint au cas commun; les Zarkashi divisent en quatre catégories les cas où un cas rare se joint au cas commun. Il existe des cas dans les contrats de salam, de partenariat et de délais d'attente, et les Malikites traitent la découverte rare d'un métal comme relevant de la cinquième catégorie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15551} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15552} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15553} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15554} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15555} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15556} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15557}"
  tr: "Dilde nadirlik, bir şeyin düşürülmesi, inmesi veya anomali anlamına gelir. Fıkıh terminolojisinde, nadir olan benzetme ile çelişmese bile nadir olan, anormal ise ona aykırıdır. Şeriatta varsayılan olarak çoğunluk dikkate alınır ve hakim yasa, hizmetçilere merhamet nedeniyle nadir olanı kaldırabilir, öncelik ise nadirlere verebilir; örneğin bir çocuğa altı ay süreyle karar vermek ve sandaletlerin ve paspasların saflığı gibi. Yasa ayrıca çocukların zenginlikle ilgili tanıklığı gibi hem nadir hem de baskın durumları iptal edebilir. Nadir, sürer ve çoğunluğa katılır. Çoğunluğa nadir eklenerek dört kategori detaylandırılır. 'Selam', 'qarad' ve 'idde'de biçimler vardır ve Maliki okuluna göre 'mineralin nadirliği' 'kham' olarak kabul edilir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.15551} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15552} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15553} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15554} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15555} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15556} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15557}"
  id: "Dalam bahasa, kelangkaan berarti jatuh, turun dari barisan, atau anomali sesuatu. Dalam terminologi yurisprudensi, langka adalah apa yang langka meskipun tidak bertentangan dengan analogi, sementara anomali adalah apa yang bertentangan. Default dalam Syariah adalah mempertimbangkan mayoritas, dan hukum dominan dapat menghapus yang langka karena belas kasihan bagi pelayan, memberikan prioritas pada yang langka, seperti aturan pada anak selama enam bulan dan kemurnian sandal serta tikar. Hukum juga dapat membatalkan kasus langka dan dominan, seperti kesaksian anak-anak mengenai kekayaan. Yang langka adalah ketika kasus itu bertahan dan bergabung dengan mayoritas. Dalam penambahan yang langka ke mayoritas, ada empat kategori yang dirinci. Ada bentuk dalam 'salam', 'qarad', dan 'iddah', dan 'kelangkaan mineral dianggap 'khams' menurut aliran Maliki. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15551} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15552} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15553} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15554} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15555} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15556} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15557}"
