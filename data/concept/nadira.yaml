id: concept/nadira
class: concept
kind: legal
label: { ar: "النُّدْرَة", en: "Rarity and the rare case (nadira)", ur: "ندرت (نادر حالت)" }
summary:
  ar: "الندرة في اللغة سقوط الشيء أو خروجه أو شذوذه، وفي اصطلاح الفقهاء النادر ما قل وجوده وإن لم يخالف القياس، والشاذ ما خالفه. والأصل في الشرع اعتبار الغالب، وقد يلغي الشرع الغالب رحمة بالعباد فيقدم النادر، كحكم الولد لستة أشهر وطهارة النعال والحصير، وقد يلغي الشرع النادر والغالب معاً كشهادة الصبيان في الأموال. والنادر إذا دام التحق بالغالب، وفي إلحاق النادر بالغالب تفصيل أربعة أقسام، وهناك صور في السلم والقراض والعدة، وندرة المعدن تخمس عند المالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15551} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15552} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15553} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15554} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15555} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15556} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15557}"
  en: "Nadira, in the lexicon, is the falling away or the rare appearance of a thing; in the usage of the jurists, the rare case is one that is seldom found, even if it does not contradict analogy, and the anomaly (shadhdh) is one that does. The rule in law is to follow the common case, but the law sometimes sets aside the common case out of mercy, as in the child born in six months and the sandal and mat, and sometimes sets aside both, as in the testimony of children in property. A rare case that persists joins the common one; the Zarkashi divides cases where a rare case joins the common one into four. There are cases in contracts of salam, partnership and waiting periods, and the Malikis treat a rare find of metal as subject to the fifth. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15551} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15552} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15553} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15554} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15555} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15556} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15557}"
  ur: "ندرت وہ صورت ہے جو کم پائی جائے۔ شریعت عام طور پر غالب کا اعتبار کرتی ہے، مگر کبھی رحمت کے طور پر نادر کو غالب پر ترجیح دیتی ہے، جیسے چھ ماہ میں پیدا ہونے والے بچے کا نسب۔ جو نادر صورت دوام پکڑ لے وہ غالب کے حکم میں آ جاتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15551} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15552} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15553} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15554} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15555} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15556} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15557}"
