id: concept/kayl-fiqh
class: concept
kind: legal
label:
  ar: "الكَيْل"
  en: "Measure (kayl), fiqh rulings"
  ur: "کیل (فقہی احکام)"
summary:
  ar: "الكيل في اللغة مصدر كال يكيل، ويُطلق على ما يُعرف به المقدار بالقفيز والمد والصاع، وعلى الوعاء الذي يُكال به؛ والكيلي ما يُقدَّر بالكيل، ولا يخرج الاصطلاح عن اللغة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13548}. والفرق بين الكيل والوزن أن الكيل يُعرف به مقدار الشيء من حيث الحجم، والوزن من حيث الثقل {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13548} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13549}."
  en: "Kayl, in lexicon, is the act of measuring, the measure by which quantity is known, such as a qafiz, a mudd or a sa', and the vessel used for measuring; a kayli is what is measured by volume. Measuring tells a thing's volume and weighing its weight {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13548} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13549}."
  ur: "کیل لغت میں ناپنے کا عمل ہے، اور اس مقدار کو بھی کہتے ہیں جس سے ماپا جائے، جیسے قفیز، مد اور صاع، اور اس برتن کو بھی جس سے ناپا جائے؛ کیلی وہ چیز ہے جو ناپ کے ذریعے مقرر ہو۔ ناپنے سے حجم معلوم ہوتا ہے، اور تولنے سے وزن {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13548} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13549}۔"
