label:
  ar: "الكَيْل"
  en: "Measure (kayl), fiqh rulings"
  ur: "کیل ⁦(فقہی احکام)⁩"
  es: "Medida (kayl), resoluciones de fiqh"
  fr: "Mesure (kayl), décisions fiqh"
  tr: "ölçmek"
  id: "mengukur"
summary:
  ar: "الكيل في اللغة مصدر كال يكيل، ويُطلق على ما يُعرف به المقدار بالقفيز والمد والصاع، وعلى الوعاء الذي يُكال به؛ والكيلي ما يُقدَّر بالكيل، ولا يخرج الاصطلاح عن اللغة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13548}. والفرق بين الكيل والوزن أن الكيل يُعرف به مقدار الشيء من حيث الحجم، والوزن من حيث الثقل {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13548} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13549}."
  en: "Kayl, in lexicon, is the act of measuring, the measure by which quantity is known, such as a qafiz, a mudd or a sa', and the vessel used for measuring; a kayli is what is measured by volume. Measuring tells a thing's volume and weighing its weight {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13548} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13549}."
  ur: "کیل لغت میں ناپنے کا عمل ہے، اور اس مقدار کو بھی کہتے ہیں جس سے ماپا جائے، جیسے قفیز، مد اور صاع، اور اس برتن کو بھی جس سے ناپا جائے؛ کیلی وہ چیز ہے جو ناپ کے ذریعے مقرر ہو۔ ناپنے سے حجم معلوم ہوتا ہے، اور تولنے سے وزن {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13548} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13549}۔"
  es: "Kayl, en léxico, es el acto de medir, la medida por la cual se conoce la cantidad, como un qafiz, un mudd o un sa', y el recipiente utilizado para medir; un kayli es lo que se mide por volumen. Medir indica el volumen de una cosa y pesar su peso {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13548} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13549}."
  fr: "En hébreu, le terme « kayl » désigne l'acte de mesurer, l'unité de mesure permettant de connaître une quantité (comme le qafiz, le mudd ou le sa') et le récipient utilisé pour cette mesure; un « kayli » est ce qui est mesuré en volume. Mesurer permet de connaître le volume d'une chose et peser son poids {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13548} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13549}."
  tr: "'Kil' dilde 'kīl' fiil isimidir ve 'qīfiz' (ölçü), 'madd' ve 'sa' olarak bilinen kelimeleri ve 'kil'i ölçmek için kullanılan kabı ifade eder; 'kilīl' ise 'kil' ile ölçülen şeydir ve terminoloji dilin ötesine geçmez {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13548}. 'qil' ile 'ağırlık' arasındaki fark, 'kil'in bir şeyin miktarını hacim cinsinden, ağırlığı ise ağırlık cinsinden belirtmek için kullanılmasıdır {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13548} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13549}."
  id: "'Kil' dalam bahasa ini adalah kata benda verbal 'kīl', yang merujuk pada apa yang dikenal sebagai 'qīfiz' (ukuran), 'madd', dan 'sa'', serta wadah yang digunakan untuk mengukur 'kil'; 'kilīl' adalah yang diukur dengan 'kil', dan terminologi ini tidak melampaui bahasa {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13548}. Perbedaan antara 'qil' dan 'berat' adalah bahwa 'kil' digunakan untuk menunjukkan jumlah sesuatu dalam hal volume, dan berat dalam bentuk berat {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13548} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13549}."
