  en: "Breathing"
  fr: "La respiration"
  ur: "تنفس"
summary:
  ar: "التنفس يتم بحركتين ووقفتين بينهما على مثال ما عليه الأمر في النبض إلا أن حركة التنفس إرادية يمكن أن تغير بالإرادة عن مجراها الطبيعي والنبض الطبيعي صرف، والغرض في النفس أن يملأ الرئة نسيماً بارداً حتى يعد النبضات القلبية فلا يزال القلب آخذاً منه الهواء البارد ويرد إليه البخار الدخاني، واستدخاله وهو الاستنشاق يكون بانبساط الرئة تابعة لحركة أجرام وإخراجه يكون لانقباضها، والنفس عند العامة هو المخرج وعند الأطباء تارة المخرج وتارة هذه الجملة، وحركة النفس المعتدل يتم بحركة الحجاب فإن احتيج إلى زيادة شاركه عضل الصدر حتى أعاليها وإن احتيج إلى صوت فلا بد من عضل الحنجرة وإن احتيج إلى كلام فعضل اللسان وربما عضل الشفة، وكما أن في النبض عظيماً وصغيراً وطويلاً وقصيراً وسريعاً وبطيئاً وحاراً وبارداً ومتواتراً ومتفاوتاً وقوياً وضعيفاً ومنقطعاً ومتصلاً كذلك للنفس هذه الأمور ولكل أمر منها سبب وكل أمر منها دليل {cite:canon-ibn-sina-print-v2 p.307}"
  en: "Breathing is accomplished by two motions and two rests between them, on the pattern of the pulse — except that the breathing motion is voluntary and can be turned by the will from its natural course, while the pulse is purely natural. The breath's purpose is to fill the lung with cool breeze, counted out for the heartbeats, so the heart keeps taking the cold air and returning to it the smoky vapour; that inhaled air suffers two changes — it loses its cold by the warming of what neighbours and mixes with it, and it loses its qualities by the smoky vapour's mixing — so it no longer bears the meaning by which the pulse draws from it and must be expelled. Its drawing-in — the inhalation — is by the lung's expansion following the motion of bodies; its expulsion by the lung's contraction. The breath to the common people is the out-breath; to the physicians it is sometimes that and sometimes this whole. The motion of the moderate natural breath is done by the diaphragm; if more force is needed the chest muscles share to their tops; if voice is needed the larynx muscles must be used; if speech, the tongue's muscles and sometimes the lip's. And as the pulse has a great, a small, a long, a short, a swift, a slow, a hot, a cold, a frequent, an uneven, a strong, a weak, a cut and a continuous, so the breath has all these and their like — each with a cause, each a sign {cite:canon-ibn-sina-print-v2 p.307}"
  fr: "Dans le traité, la respiration s’accomplit en deux mouvements et deux repos intercalés, sur le modèle du pouls, avec cette différence que le mouvement respiratoire est volontaire et que la volonté peut le détourner de son cours naturel, tandis que le pouls est purement naturel. La respiration a pour fonction de remplir le poumon d’un air frais, au rythme des battements du cœur, de sorte que celui-ci continue de prendre l’air froid et de lui rendre la vapeur fumeuse. L’air inspiré subit deux changements : il perd sa froideur sous l’effet du réchauffement par ce qui le jouxte et se mêle à lui, et il perd ses qualités par le mélange avec la vapeur fumeuse. Il n’a donc plus la propriété pour laquelle le pouls y puise et doit être expulsé. Son entrée — l’inspiration — se fait par l’expansion du poumon à la suite du mouvement des corps ; son expulsion, par la contraction du poumon. Pour le commun, le souffle est l’air expiré ; pour les médecins, c’est tantôt cela, tantôt l’ensemble du processus. Le mouvement d’une respiration naturelle et modérée est assuré par le diaphragme ; s’il faut plus de force, les muscles du thorax y participent jusqu’en haut ; s’il faut produire la voix, les muscles du larynx entrent en jeu ; pour la parole, ce sont les muscles de la langue et parfois ceux des lèvres. De même que le pouls peut être grand, petit, long, court, rapide, lent, chaud, froid, fréquent, inégal, fort, faible, interrompu ou continu, le souffle admet toutes ces formes et d’autres analogues : chacune a une cause, chacune est un signe {cite:canon-ibn-sina-print-v2 p.307}"
  ur: "تنفس دو حرکتوں اور ان کے درمیان دو وقفوں سے ہوتی ہے نبض کے سانچے پر — مگر تنفس کی حرکت اختیاری ہے اور ارادے سے اس کے طبیعی راستے سے بدلی جا سکتی ہے جب کہ نبض محض طبیعی ہے؛ نفس کا غرض یہ ہے کہ پھیپھڑے کو ٹھنڈی ہوا سے بھر دے جو دل کی دھڑکنوں کے شمار پر تیار رہے تاکہ دل اس سے ٹھنڈی ہوا لیتا رہے اور اسے دھوئیں سا بخار لوٹائے؛ اور اس کی داخیل یعنی دم کشید پھیپھڑے کے پھیلنے سے ہوتی ہے جو اجرام کی حرکت کی تابع ہوتی ہے اور اس کی اخراج اس کے سمٹنے سے؛ عام لوگوں کے نزدیک نفس نکالی ہوئی ہوا ہے اور طبیبوں کے نزدیک کبھی وہی ہے کبھی یہ سارا مجموعہ؛ معتدل طبیعی نفس کی حرکت حجاب سے ہوتی ہے اگر زیادہ قوت چاہیے تو سینے کے پٹھے اوپر تک شریک ہوتے ہیں اگر آواز چاہیے تو حنجرے کے پٹھے لازم ہیں اور اگر کلام تو زبان کے پٹھے اور کبھی ہونٹ کے بھی؛ اور جیسے نبض میں بڑی چھوٹی لمبی چھوٹی تیز سست گرم سرد متواتر متفاوت مضبوط کمزور منقطع اور متصل ہوتی ہے ویسے نفس میں بھی یہ سب چیزیں اور ان جیسی ہیں — ہر ایک کا سبب ہے اور ہر ایک دلیل ہے {cite:canon-ibn-sina-print-v2 p.307}"
