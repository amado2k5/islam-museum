label:
  ar: الإنفاق العام
  en: "Public spending (al-infaq al-amm)"
summary:
  ar: "يرى قعدات أن المال العام، وهو جزء من ثمرة الإنتاج أو ما يؤخذ من الأفراد مساهمة أو زكاة أو صدقة، ينبغي إنفاقه في وجهه الصحيح، لأن اختلاسه جريمة يعاقب عليها الله والإنسان {cite:qadan-manhaj-iqtisad-quran p. 120}. ويضع ضوابط أولها الالتزام بدائرتي الحلال والحرام، ثم التركيز على المصالح التي تخدم الصالح العام، وعدم الدخول في مشاريع استغلالية مهما كانت أرباحها {cite:qadan-manhaj-iqtisad-quran p. 120}. ومن أولوياته عنده رعاية اليتامى والضعفاء، والمواصلات، والعلم والبحث، والإنتاج، والصحة، ثم الدفاع عن الوطن {cite:qadan-manhaj-iqtisad-quran p. 121}، {cite:qadan-manhaj-iqtisad-quran p. 122}."
