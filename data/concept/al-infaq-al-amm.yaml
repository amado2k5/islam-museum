id: concept/al-infaq-al-amm
class: concept
kind: ethical
label:
  ar: الإنفاق العام
  en: "Public spending (al-infaq al-amm)"
  es: "Gasto público (al-infaq al-amm)"
  fr: "Dépenses publiques (al-infaq al-amm)"
  ur: "عوامی اخراجات ⁦(الانفاق العام)⁩"
  tr: "Kamu Harcamaları"
  id: "Pengeluaran publik"
summary:
  ar: "يرى قعدات أن المال العام، وهو جزء من ثمرة الإنتاج أو ما يؤخذ من الأفراد مساهمة أو زكاة أو صدقة، ينبغي إنفاقه في وجهه الصحيح، لأن اختلاسه جريمة يعاقب عليها الله والإنسان {cite:qadan-manhaj-iqtisad-quran p. 120}. ويضع ضوابط أولها الالتزام بدائرتي الحلال والحرام، ثم التركيز على المصالح التي تخدم الصالح العام، وعدم الدخول في مشاريع استغلالية مهما كانت أرباحها {cite:qadan-manhaj-iqtisad-quran p. 120}. ومن أولوياته عنده رعاية اليتامى والضعفاء، والمواصلات، والعلم والبحث، والإنتاج، والصحة، ثم الدفاع عن الوطن {cite:qadan-manhaj-iqtisad-quran p. 121}، {cite:qadan-manhaj-iqtisad-quran p. 122}."
  tr: "Qaadat, üretim ürünlerinin bir parçası olan ya da bireylerden bağışlar, zekat ya da hayır olarak alınan kamu parasının doğru şekilde harcanması gerektiğine inanır; çünkü zimmete geçirme Allah ve insanlık tarafından cezalandırılan bir suçtur {cite:qadan-manhaj-iqtisad-kur'an, s. 120}. Düzenlemeler koyar; ilki helal ve haram çevrelerine bağlılık, sonra kamu yararına hizmet eden çıkarlara odaklanır ve kâr için sömürücü projelere girmekten kaçınır {cite:qadan-manhaj-iqtisad-kur'an, s. 120}. Öncelikleri arasında yetimlere ve zayıflara bakmak, ulaşım, eğitim ve araştırma, üretim, sağlık ve ardından vatanın savunulması yer alır {cite:qadan-manhaj-iqtisad-kur'an s. 121}, {cite:qadan-manhaj-iqtisad-kur'an, s. 122}."
  id: "Qaadat percaya bahwa uang publik yang merupakan bagian dari produk produksi atau diterima sebagai donasi, zakat, atau amal dari individu harus digunakan dengan benar; karena penggelapan adalah kejahatan yang dihukum oleh Tuhan dan kemanusiaan {cite:qadan-manhaj-iqtisad-qur'an, hlm. 120}. Qaadat menetapkan peraturan; pertama fokus pada kepatuhan terhadap lingkungan halal dan haram, kemudian pada kepentingan yang melayani kepentingan umum dan menghindari terlibat dalam proyek eksploitatif untuk keuntungan {cite:qadan-manhaj-iqtisad-qur'an, hlm. 120}. Prioritasnya meliputi merawat anak yatim dan yang lemah, transportasi, pendidikan dan penelitian, produksi, kesehatan, dan kemudian mempertahankan tanah air {cite:qadan-manhaj-iqtisad-qur'an hlm. 121}, {cite:qadan-manhaj-iqtisad-qur'an, hlm. 122}."
