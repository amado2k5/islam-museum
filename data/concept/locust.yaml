summary:
  ar: "من آيات موسى على آل فرعون الجراد مع الطوفان والقمل والضفادع والدم، ويوم القيامة يخرج الناس من الأجداث كأنهم جراد منتشر، وأحلّ الفقهاء أكله ولو للمحرم."
  en: "Among the signs sent upon Pharaoh's people was the locust with the flood, the lice, the frogs and the blood; on the Day of Resurrection people come out of the graves like scattered locusts, and the jurists allow eating it even in ihram."
  ur: "فرعون کے آل پر نازل نشانیوں میں ٹڈی تھی سیلاب، جوئیں، مینڈک اور خون کے ساتھ؛ قیامت کے دن لوگ قبروں سے بکھرے ٹڈیوں کی طرح نکلیں گے اور فقہاء اس کے کھانے کو احرام میں بھی جائز قرار دیتے ہیں۔"
  es: "Entre las señales enviadas al pueblo del faraón estaban la langosta con el diluvio, los piojos, las ranas y la sangre; en el Día de la Resurrección, la gente sale de las tumbas como langostas dispersas, y los juristas permiten comerla incluso estando en estado de ihram."
