id: concept/hurr-free-person
class: concept
kind: legal
label: { ar: "الحُرّ", en: "The free person (hurr)", ur: "حُر (آزاد شخص)" }
summary:
  ar: "الحر من الرجال خلاف العبد، وهو في اصطلاح الفقهاء من خلصت ذاته عن شائبة الرق والملك، وينقسم إلى من استقرت له الحرية، ومن يحكم بحريته ظاهرا كاللقيط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6984} والمبعّض من بعضه حر وبعضه مملوك، وأحكامه في مصطلح التبعيض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6984} والأصل في الإنسان الحرية، والرق طارئ، وأحكام الشريعة في الأصل للأحرار، ويوافق الرقيق الأحرار في أغلبها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6985} ومن القواعد أن الحر لا يُستولى عليه استيلاء الغصب والملك، فلا يُباع ولا يُشترى، وأن ثياب الحر لا تدخل في ضمان الغاصب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6985}"
  en: "The free man is the opposite of the slave; in the jurists' usage he is one whose person is free of any trace of bondage or ownership, and freedom is either firmly established or judged by appearance, as with a found child. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6984} A partly freed person, half free and half owned, is treated under the rules of partial manumission. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6984} The principle is freedom: bondage is accidental, and the law is addressed chiefly to free persons, slaves sharing most of its rules. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6985} A maxim holds that a free person cannot be taken as property, so he is not sold or bought, and that the free person's clothing is not within a usurper's liability. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6985}"
