label: { ar: "الحُرّ", en: "The free person (hurr)", ur: "حُر ⁦(آزاد شخص)⁩", es: "La persona libre (hurr)", fr: "La personne libre (hurr)" }
summary:
  ar: "الحر من الرجال خلاف العبد، وهو في اصطلاح الفقهاء من خلصت ذاته عن شائبة الرق والملك، وينقسم إلى من استقرت له الحرية، ومن يحكم بحريته ظاهرا كاللقيط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6984} والمبعّض من بعضه حر وبعضه مملوك، وأحكامه في مصطلح التبعيض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6984} والأصل في الإنسان الحرية، والرق طارئ، وأحكام الشريعة في الأصل للأحرار، ويوافق الرقيق الأحرار في أغلبها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6985} ومن القواعد أن الحر لا يُستولى عليه استيلاء الغصب والملك، فلا يُباع ولا يُشترى، وأن ثياب الحر لا تدخل في ضمان الغاصب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6985}"
  en: "The free man is the opposite of the slave; in the jurists' usage he is one whose person is free of any trace of bondage or ownership, and freedom is either firmly established or judged by appearance, as with a found child. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6984} A partly freed person, half free and half owned, is treated under the rules of partial manumission. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6984} The principle is freedom: bondage is accidental, and the law is addressed chiefly to free persons, slaves sharing most of its rules. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6985} A maxim holds that a free person cannot be taken as property, so he is not sold or bought, and that the free person's clothing is not within a usurper's liability. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6985}"
  es: "El hombre libre es lo opuesto al esclavo; en el uso de los juristas es aquel cuya persona está libre de cualquier rastro de servidumbre o propiedad, y la libertad está firmemente establecida o se juzga por la apariencia, como con un niño encontrado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6984} Una persona parcialmente liberada, mitad libre y mitad propiedad, es tratada bajo las reglas de la manumisión parcial. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6984} El principio es la libertad: la servidumbre es accidental, y la ley se dirige principalmente a las personas libres, compartiendo los esclavos la mayoría de sus reglas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6985} Una máxima sostiene que una persona libre no puede ser tomada como propiedad, por lo que no se vende ni se compra, y que la ropa de la persona libre no está dentro de la responsabilidad de un usurpador. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6985}"
  fr: "L'homme libre est l'opposé de l'esclave; selon les juristes, il s'agit de celui dont la personne est libre de toute forme d'asservissement ou de propriété, et la liberté est soit fermement établie, soit présumée, comme pour un enfant trouvé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6984} Une personne partiellement affranchie, mi-libre, mi-esclave, est soumise aux règles de l'affranchissement partiel. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6984} Le principe est la liberté: l'asservissement est accidentel, et la loi s'adresse principalement aux personnes libres, les esclaves étant soumis à la plupart de ses dispositions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6985} Une maxime soutient qu'une personne libre ne peut être considérée comme une propriété, elle ne peut donc être ni vendue ni achetée, et que les vêtements d'une personne libre ne relèvent pas de la responsabilité de l'usurpateur. {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.6985}"
