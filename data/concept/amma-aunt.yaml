id: concept/amma-aunt
class: concept
kind: legal
label:
  ar: "العَمَّة"
  en: "The paternal aunt ('amma): marriage bars, inheritance, custody and maintenance"
  ur: "عمّہ (پھوپھی)"
summary:
  ar: "العمة في اللغة أخت الأب، ويطلق اللفظ على عمة الأب والأجداد، والجمع عمات {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11844}. وقد أجمع الفقهاء على تحريم نكاح العمة من النسب ومن الرضاع، لقوله تعالى في المحرمات، ولحديث النهي عن الجمع بين المرأة وعمتها {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11844}. وفي ميراثها خلاف، فمن قال بتوريث ذوي الأرحام ورّثها ومن منعه منعها {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11844}. ولها حق الحضانة بعد من هو أولى منها على ترتيب الفقهاء {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11845}. وفي وجوب نفقتها خلاف، فالحنفية يوجبونها لذي رحم محرم، والمالكية والشافعية يوجبونها بشروط، والحنابلة يوجبونها بالإرث بقرابة الرحم عندهم، ولا تجب عند القاضي من الحنابلة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11845}."
  en: "'Amma, the aunt, is the father's sister, and the word also covers the grandfather's sister; the plural is 'ammat {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11844}. The jurists agree that marriage to an aunt is forbidden by blood and by suckling, on the Qur'anic list of forbidden women and the prophetic prohibition of marrying a woman together with her aunt {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11844}. Her inheritance is disputed; those who admit distant kin to inheritance give her a share, and those who deny it do not {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11844}. She has a right to custody after those who have a prior right, following the jurists' order {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11845}. Her maintenance is disputed: the Hanafis require it for a relative within the forbidden degrees, the Malikis and Shafi'is require it on conditions, and the Hanbalis require it on the basis of inheritance by kinship, while al-Qadi among the Hanbalis denies it {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11845}."
