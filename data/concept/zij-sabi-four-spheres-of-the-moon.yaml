label: { ar: "أفلاك القمر الأربعة في شرح البتاني", en: "The four spheres of the Moon in al-Battani", ur: "البتانی کے چاند کے چار افلاک" }
summary:
  ar: "يتصوّر البتاني للقمر أربعة أفلاك يُفسَّر بها اختلاف حركته: فلك ممثّل بفلك البروج، وفلك مائل عليه بمركز واحد معه، وفلك يتحرك داخل المائل، وفلك تدوير خاص بالقمر مركزه على دائرة الفلك الخارج المركز. {cite:zij-sabi-nallino-byblion p.76}."
  en: "To explain the Moon's irregular motion, al-Battani imagines four spheres: one level with the zodiac's sphere, an inclined sphere sharing its centre, a sphere moving inside the inclined one, and the Moon's own epicycle whose centre lies on the circle of an eccentric sphere. {cite:zij-sabi-nallino-byblion p.76}."
  ur: "چاند کی بے قاعدہ حرکت کی وضاحت کے لیے البتانی چار افلاک تصور کرتے ہیں: بروجی فلک کے برابر ایک فلک، اسی مرکز والا مائل فلک، مائل کے اندر حرکت کرنے والا فلک، اور چاند کا اپنا فلکِ تدویر جس کا مرکز فلکِ خارج المرکز کے دائرے پر ہے۔ {cite:zij-sabi-nallino-byblion p.76}۔"
