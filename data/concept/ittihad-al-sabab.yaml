id: concept/ittihad-al-sabab
class: concept
kind: legal
label: { ar: "اتحاد السبب", en: "Unity of the cause (ittihad al-sabab)", es: "Unidad de la causa (ittihad al-sabab)", fr: "Unité de la cause (ittihad al-sabab)", ur: "وحدت الوجود ⁦(اتحاد الصباب)⁩", tr: "Akıl Birliği", id: "Kesatuan Akal" }
summary:
  ar: "السبب في الاصطلاح الوصف الظاهر المنضبط الذي أضاف الشارع إليه الحكم، ويلزم من وجوده الوجود ومن عدمه العدم لذاته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1472} واتحاد السبب تماثل الأسباب لأكثر من حكم أو تشابهها أو كونها سبباً واحداً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1473} ويقع في الأصول بحث المطلق والمقيد حين يتحد السبب ويختلف الحكم، فيحمل الشافعية المطلق على المقيد عند اتحاد الحكم والسبب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1473} وجوّز جمهور الفقهاء وقوع حكمين بعلة واحدة إن لم يتضادا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1474}"
  en: "In the terms of jurists and usulis, the sabab is an apparent and regular attribute to which the Lawgiver attached a ruling, such that its presence entails the ruling and its absence entails none. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1472} Unity of the cause means that several causes are alike, belong to one class, or are in fact one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1473} Usulis discuss it in the question of the unrestricted and the restricted text when the cause is one but the rulings differ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1473} Most jurists allow one cause to produce two rulings if the rulings do not contradict each other. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1474}"
  es: "En términos de juristas y usulis, el sabab es un atributo aparente y regular al que el Legislador adjuntó una norma, de modo que su presencia implica la norma y su ausencia no implica ninguna. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1472} La unidad de la causa significa que varias causas son semejantes, pertenecen a una misma clase o son, de hecho, una sola. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1473} Los usulis lo discuten en la cuestión del texto no restringido y el restringido cuando la causa es una pero las normas difieren. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1473} La mayoría de los juristas permiten que una causa produzca dos normas si estas no se contradicen entre sí. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1474}"
  fr: "Selon les juristes et les usulis, le sabab est un attribut apparent et régulier auquel le Législateur a associé une décision, de sorte que sa présence entraîne la décision et son absence n'en entraîne aucune. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1472} L'unité de la cause signifie que plusieurs causes sont semblables, appartiennent à une même catégorie ou ne font qu'une. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1473} Les usulis l'abordent dans la question du texte non restreint et du texte restreint, lorsque la cause est unique mais que les décisions diffèrent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1473} La plupart des juristes admettent qu'une cause puisse donner lieu à deux décisions si celles-ci ne se contredisent pas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1474}"
  ur: "فقہا اور اصول کی اصطلاح میں صبغ ایک ظاہری اور باقاعدہ صفت ہے جس کے ساتھ قانون دینے والا کوئی حکم لگاتا ہے، اس طرح کہ اس کی موجودگی حکم کو شامل کرتی ہے اور اس کی عدم موجودگی سے کوئی چیز نہیں ہوتی۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1472} وحدت الوجود کا مطلب یہ ہے کہ کئی اسباب ایک جیسے ہیں، ایک طبقے سے تعلق رکھتے ہیں، یا حقیقت میں ایک ہیں۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 1473} اصول غیر محدود اور ممنوع متن کے سوال میں اس پر بحث کرتے ہیں جب وجہ ایک ہو لیکن احکام میں اختلاف ہو۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 1473} اکثر فقہاء ایک وجہ سے دو احکام پیدا کرنے کی اجازت دیتے ہیں اگر احکام ایک دوسرے سے متصادم نہ ہوں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص1474}"
  tr: "Terminolojide, neden Kanunlaştırıcının hükmü eklediği açık, disiplinli tanımdır ve varlığı kendi başına var olup olmadığını ima eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1472} Neden birliği, nedenlerin birden fazla hükmüle benzerliği veya benzerliğidir, ya da bunların tek bir neden olmasıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1473} İlkelerin ilkelerinde, mutlak ve kısıtlı tartışması, neden birleştiğinde ve hüküm farklılaştığında gerçekleşir; bu nedenle Şafi'i okulu mutlak olanı kısıtlı olana karşı hüküm ve neden birleştiğinde yorumlar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1473} Çoğu hukukçu, çelişmeyen iki hükmün aynı nedenle ortaya çıkmasına izin verir. {Cite:Fiqh-Mawsua-Kuwaitiyya-Noor-v3 s.1474}"
  id: "Dalam terminologi, sebab adalah deskripsi yang tampak dan disiplin yang ditambahkan oleh Pemberi Hukum pada putusan tersebut, dan keberadaannya mengimplikasikan keberadaan atau ketidakberadaan dengan sendirinya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1472} Kesatuan sebab adalah kesamaan atau kesamaan sebab dengan lebih dari satu keputusan, atau keberadaan satu sebab tunggal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1473} Dalam prinsip-prinsip prinsip, diskusi tentang absolut dan terbatas terjadi ketika sebab bersatu dan keputusannya berbeda, sehingga aliran Syafi menafsirkan absolut sebagai lawan yang terbatas ketika putusan dan sebab bersatu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1473} Mayoritas ahli hukum mengizinkan terjadinya dua putusan untuk alasan yang sama jika keduanya tidak bertentangan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1474}"
