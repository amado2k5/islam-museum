id: concept/ittihad-al-sabab
class: concept
kind: legal
label: { ar: "اتحاد السبب", en: "Unity of the cause (ittihad al-sabab)" }
summary:
  ar: "السبب في الاصطلاح الوصف الظاهر المنضبط الذي أضاف الشارع إليه الحكم، ويلزم من وجوده الوجود ومن عدمه العدم لذاته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1472} واتحاد السبب تماثل الأسباب لأكثر من حكم أو تشابهها أو كونها سبباً واحداً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1473} ويقع في الأصول بحث المطلق والمقيد حين يتحد السبب ويختلف الحكم، فيحمل الشافعية المطلق على المقيد عند اتحاد الحكم والسبب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1473} وجوّز جمهور الفقهاء وقوع حكمين بعلة واحدة إن لم يتضادا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1474}"
  en: "In the terms of jurists and usulis, the sabab is an apparent and regular attribute to which the Lawgiver attached a ruling, such that its presence entails the ruling and its absence entails none. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1472} Unity of the cause means that several causes are alike, belong to one class, or are in fact one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1473} Usulis discuss it in the question of the unrestricted and the restricted text when the cause is one but the rulings differ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1473} Most jurists allow one cause to produce two rulings if the rulings do not contradict each other. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1474}"
