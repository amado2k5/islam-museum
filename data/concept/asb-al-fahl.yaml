id: concept/asb-al-fahl
class: concept
kind: legal
label:
  ar: "عَسْب الفَحْل"
  en: "Stallion's service and its fee (asb al-fahl)"
  ur: "عسب الفحل"
summary:
  ar: "العسب في اللغة ضراب الفحل، وهو طروق الفحل للأنثى، وقيل ماؤه أو أجرة ضرابه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11600}. واتفق الفقهاء على عدم جواز بيع عسب الفحل، لنهي النبي عنه، وعللوه بأن الضراب معدوم وقت العقد {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11601}. وأما الإجارة للضراب فمنعها جمهور الحنفية وفي الأصح عند الشافعية وأصل مذهب الحنابلة، وأجازها المالكية لزمن معين أو لمرات معينة، ولا تجوز عندهم إلى حمل الأنثى، وأجازها الحنابلة عند الحاجة، وهو مقابل الأصح عند الشافعية في مذهب المالكية {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11601} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11602}. وتفصيل ذلك في «إجارة» {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11602}."
  en: "In the lexicon, asb is the mating of a stallion, that is its covering of the female; it may also mean its semen or the fee for mating {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11600}. The jurists agree that selling a stallion's service is not permitted, because the prophetic prohibition applies, and they explain that the service does not exist at the time of the contract {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11601}. Hiring a stallion for service was forbidden by the majority of Hanafis, the sounder view among the Shafi'is and the basic Hanbali position; the Malikis allowed it for a fixed time or a fixed number of times, but not until the female conceives; the Hanbalis allowed it in cases of need, and the Maliki view matches the weaker Shafi'i opinion {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11601} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11602}. Hiring is treated under «ijara» {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11602}."
