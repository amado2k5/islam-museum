id: concept/asb-al-fahl
class: concept
kind: legal
label:
  ar: "عَسْب الفَحْل"
  en: "Stallion's service and its fee (asb al-fahl)"
  fr: "La saillie de l’étalon et sa rémunération (asb al-fahl)"
  ur: "عسب الفحل"
  es: "Servicio de semental y su tarifa (asb al-fahl)"
  tr: "Aygır için"
  id: "Untuk pejantan"
summary:
  ar: "العسب في اللغة ضراب الفحل، وهو طروق الفحل للأنثى، وقيل ماؤه أو أجرة ضرابه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11600}. واتفق الفقهاء على عدم جواز بيع عسب الفحل، لنهي النبي عنه، وعللوه بأن الضراب معدوم وقت العقد {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11601}. وأما الإجارة للضراب فمنعها جمهور الحنفية وفي الأصح عند الشافعية وأصل مذهب الحنابلة، وأجازها المالكية لزمن معين أو لمرات معينة، ولا تجوز عندهم إلى حمل الأنثى، وأجازها الحنابلة عند الحاجة، وهو مقابل الأصح عند الشافعية في مذهب المالكية {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11601} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11602}. وتفصيل ذلك في «إجارة» {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11602}."
  en: "In the lexicon, asb is the mating of a stallion, that is its covering of the female; it may also mean its semen or the fee for mating {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11600}. The jurists agree that selling a stallion's service is not permitted, because the prophetic prohibition applies, and they explain that the service does not exist at the time of the contract {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11601}. Hiring a stallion for service was forbidden by the majority of Hanafis, the sounder view among the Shafi'is and the basic Hanbali position; the Malikis allowed it for a fixed time or a fixed number of times, but not until the female conceives; the Hanbalis allowed it in cases of need, and the Maliki view matches the weaker Shafi'i opinion {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11601} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11602}. Hiring is treated under «ijara» {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11602}."
  fr: "Dans le lexique, asb désigne l’accouplement de l’étalon, c’est-à-dire la saillie de la femelle ; il peut aussi désigner son sperme ou la rémunération de la saillie {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11600}. Les juristes s’accordent à ne pas permettre la vente du service de l’étalon, en raison de l’interdiction prophétique, et expliquent que ce service n’existe pas au moment du contrat {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11601}. La location d’un étalon pour la saillie est interdite par la majorité des hanafites, l’avis jugé le plus solide chez les chaféites et la position de base hanbalite ; les malikites l’autorisent pour une durée ou un nombre de fois déterminés, mais non jusqu’à la conception de la femelle ; les hanbalites l’autorisent en cas de besoin, et l’avis malikite rejoint l’opinion chaféite la moins forte {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11601} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11602}. La location est traitée sous « ijara » {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11602}."
  es: "En el léxico, asb es el apareamiento de un semental, es decir, su cobertura de la hembra; también puede significar su semen o la tarifa por el apareamiento {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11600}. Los juristas están de acuerdo en que vender el servicio de un semental no está permitido, porque se aplica la prohibición profética, y explican que el servicio no existe en el momento del contrato {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11601}. Contratar un semental para el servicio estaba prohibido por la mayoría de los hanafíes, la opinión más sólida entre los shafi'íes y la posición básica hanbalí; los malikíes lo permitieron por un tiempo fijo o un número fijo de veces, pero no hasta que la hembra conciba; los Hanbalis lo permitieron en casos de necesidad, y la opinión de Maliki coincide con la opinión Shafi'i más débil {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.11601} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.11602}. La contratación se trata en «ijara» {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.11602}."
  ur: "لغت میں، asb ایک گھوڑے کا ملن ہے، جو کہ اس کا پردہ مادہ ہے۔ اس کا مطلب اس کا منی یا ملاوٹ کی فیس بھی ہو سکتا ہے {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 11600}۔ فقہاء اس بات پر متفق ہیں کہ گھوڑے کی خدمت فروخت کرنے کی اجازت نہیں ہے، کیونکہ نبوت کی ممانعت کا اطلاق ہوتا ہے، اور وہ وضاحت کرتے ہیں کہ یہ خدمت معاہدہ کے وقت موجود نہیں تھی۔ خدمت کے لیے گھوڑے کی خدمات حاصل کرنا حنفیوں کی اکثریت نے حرام قرار دیا تھا، شافعیوں کے درمیان بہتر نظریہ اور بنیادی حنبلی موقف؛ مالکیوں نے ایک مقررہ وقت یا ایک مقررہ تعداد کے لیے اس کی اجازت دی، لیکن اس وقت تک نہیں جب تک کہ عورت حاملہ نہ ہو جائے۔ حنبلیوں نے ضرورت کی صورت میں اس کی اجازت دی، اور مالکی کا قول ضعیف شافعی کے قول سے میل کھاتا ہے۔ ملازمت پر رکھنے کا علاج «اجارہ» کے تحت کیا جاتا ہے {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 11602}۔"
  tr: "Dil olarak 'asb', aygırın 'zarab'ı (aygır) anlamına gelir ve bu da dişi koçun yöntemidir. Ayrıca aygırın suyu veya fiyatı da söylenir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11600}. Hukukçular, aygırın atının satılmasının yasak olduğunu kabul ettiler; çünkü Peygamber bunu yasakladı ve aygırın sözleşme sırasında geçerli olmadığını açıkladılar {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11601}. Kadın tipi için İcara konusunda ise çoğu Hanafi okulu yasaklamış, en doğru görüş ise Şafii okulu ve orijinal Hanbali okuludur. Malikiler belirli bir zaman veya zamanlar için izin vermiştir ve bir kadının onlardan hamile kalması yasaktır. Hanbaliler gerektiğinde izin verir; bu, Maliki okulundaki Şafi'ler arasında daha doğru görüşün tersidir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11601} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11602}. Bunun detayları 'Ijarah'da yer almaktadır {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11602}."
  id: "Dalam bahasa, 'asb' berarti 'zarab' (pejantan) pejantan itu, yang merupakan metode domba jantan betina. Juga dikatakan bahwa itu adalah air atau harga pejantan {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11600}. Para ahli hukum sepakat bahwa menjual kuda jantan tidak diperbolehkan, karena Nabi melarangnya, dan mereka menjelaskan bahwa kuda jantan tersebut tidak sah pada saat kontrak {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11601}. Adapun Ijarah untuk tipe perempuan, mayoritas Hanafi melarangnya, sementara pandangan paling benar adalah aliran Shafi'i dan aliran Hanbali asli. Malik mengizinkannya untuk waktu atau waktu tertentu, dan tidak diperbolehkan perempuan hamil dari mereka. Hanbal mengizinkannya jika diperlukan, yang berlawanan dengan pandangan yang lebih benar di antara Shafi'i dalam aliran Maliki {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11601} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11602}. Rincian tentang hal ini terdapat dalam 'Ijarah' {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11602}."
