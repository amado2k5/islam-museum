id: concept/hikr-long-lease
class: concept
kind: legal
label: { ar: "الحكر", en: "Hikr (long lease of waqf land)", ur: "حکر", es: "Hikr (arrendamiento a largo plazo de tierras waqf)", fr: "Hikr (bail de longue durée sur des terres waqf)", tr: "tekel", id: "monopoli" }
summary:
  ar: "الحكر في اللغة الظلم والنقص والعسر والالتواء، والاحتكار جمع الشيء وحبسه ليغلو. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7220} وفي الاصطلاح يطلق على ثلاثة معان: الأجرة المقررة على عقار محبوس في الإجارة الطويلة، والعقار المحتكر نفسه، والإجارة الطويلة نفسها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7220} ويعرّفه ابن عابدين بأنه إجارة يقصد بها منع الغير واستبقاء الانتفاع بالأرض للبناء أو الغرس، وهو يفترق عن الخلو والأجرة والإجارة الطويلة الأعم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7221} ويكون الحكر غالبا في الأوقاف، وقد يكون في الأملاك الخاصة، وأكثر كلام الفقهاء فيه يتعلق بالأوقاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7221} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7222} والإجارة الطويلة في الأملاك جائزة، أما في الوقف فالحنفية والمالكية منعوا تجاوز مدة معينة ⁦(ثلاث سنين للأرض عند الحنفية في الغالب، وأربع سنين للأرض والأكثر من سنة للدار عند المالكية على الأوقاف العامة)⁩. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7222} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7223} وأجاز الشافعية والحنابلة الإجارة الطويلة في الوقف بحسب الحاجة والمصلحة، واحتج ابن قدامة بما حكاه القرآن من عقد إجارة بين شعيب وموسى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7224} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7225} وإذا اشترط الواقف منع الإجارة الطويلة وجب اتباع شرطه، وأجاز بعض الحنفية والشافعية حيلة العقود المتلاحقة سنة سنة ما لم يمنعها الواقف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7225} وتقيد الإجارة الطويلة عند الأكثرين بشروط كتخرب الوقف وتعطل نفعه وعدم وجود حاصل يعمره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7225} وفي حكم التحكير في الوقف أقوال: الأكثرون يجيزونه بشروط، منها خراب الوقف وتعطل انتفاع الموقوف عليهم به، وعدم وجود حاصل يعمر به، وألا يوجد من يقرضه القدر المحتاج إليه بأقل من أجرة تلك المدة، واشترط الحنفية ألا يمكن استبدال الوقف بعقار ذي ريع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7226} وأجاز الحنابلة وجمهور الشافعية التحكير مطلقا ما لم يمنعه الواقف، ومنعه بعض الشافعية مطلقا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7226} وإذا أنشأ الناظر خلوا بمال دفعه إنسان لتعمير الوقف ملك دافع المال جزءا من المنفعة، وعليه حكر دائم للجهة المستحقة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7226} ولا يجوز التحكير إلا ممن له ولاية إجارة الوقف، كالناظر، وقد عدّ العدوي العرف في مصر كالشرط، فالأحكار مستمرة للأبد، وأثبت الحنفية للمحتكر حق القرار ما دام بناؤه قائما ويدفع أجرة المثل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7226} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7227} ويلزم أجر المثل، ويفسد عقد التحكير بغبن فاحش عند الحنفية، واختلفوا في ضمان الناظر؛ وتزيد أجرة المثل أو تنقص أثناء المدة بحسب شروط الفسخ وقواعد كل مذهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7227} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7228} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7229} وما يبنيه المحتكر أو يغرسه بإذن القاضي أو الناظر ملك خالص له يصح بيعه وهبته ويورث، أما رقبة الأرض فللوقف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7230} وتختلف الأحكام في الشفعة في البناء، ووقف البناء على جهة أخرى، وموت المحتكر قبل البناء، وانقضاء الحكر بهلاك البناء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7230} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7231} وقد انتهى المدخل عند العنوان التالي «حُكم» على ص 7232. "
  en: "Hikr lexically means injustice, narrowness and hardship; its technical uses are three: the rent fixed on a property held under a long lease, the leased property itself, and the long lease. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7220} Ibn Abidin defines it as a lease whose purpose is to keep others out and to keep the land for building or planting, distinct from khulu and from the wider long lease. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7221} Hikr occurs mostly on waqf property, sometimes on private property; most jurists' discussion concerns waqf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7221} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7222} A long lease of private property is lawful; for waqf the Hanafis and Malikis forbid exceeding a set term (generally three years for land among the Hanafis; four years for land and one year for a house for mosques and the poor among the Malikis). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7222} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7223} The Shafiis and Hanbalis allow long leases of waqf as need and benefit require; Ibn Qudama argues from the lease in the story of Moses and Shu'ayb. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7224} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7225} Where the founder forbids a long lease his condition binds; some Hanafi and Shafii jurists allow a device of consecutive yearly contracts unless the founder forbids it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7225} Most jurists limit the long lease of waqf to conditions such as ruin of the waqf, lack of income to repair it, and no lender who can advance the sum. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7225} ⁦(On the ruling about leasing waqf land long-term the majority allow it with conditions: the waqf is ruined and its beneficiaries cannot use it, it has no income to repair it, and no lender will advance the needed sum below the rent for that term; the Hanafis add that the waqf cannot be exchanged for income-bearing property. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7226} The Hanbalis and most Shafiis allow it outright unless the founder forbids it, and some Shafiis forbid it altogether. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7226} When the administrator takes a sum from a person to repair the waqf and grants that person part of the usufruct as khulu, the payer owns that part and owes a permanent hikr on the rest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7226} Only the administrator, who holds the power to lease, may grant hikr; the Maliki Adawi treats the custom in Egypt as a condition, so hikr leases run for ever; the Hanafis give the holder a right of settlement while his building stands and he pays the fair rent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7226} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7227} A lease below the fair rent is void for gross undervaluation in the Hanafi view, and the jurists differ on liability; the fair rent may rise or fall during the term according to each school's rules. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7227} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7228} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7229} What the holder builds or plants with the permission of the judge or administrator is his absolute property, saleable, giftable and inheritable, while the soil remains waqf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7230} Views differ on pre-emption over buildings, on endowing a building to another beneficiary, on the holder's death before building, and on the end of hikr when the building perishes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7230} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7231} The entry closes at the next heading, hukm ⁦(حُكم)⁩, on p.7232. )⁩"
  ur: "حکر لغت میں ظلم، تنگی اور دشواری کو کہتا ہے؛ اصطلاحاً اس کے تین معنی ہیں: طویل اجارے پر رکھے گئے عقار کی مقررہ اجرت، خود محتکر عقار، اور طویل اجارہ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7220} ابن عابدین کے نزدیک یہ ایسا اجارہ ہے جس سے مقصود دوسروں کو روکنا اور زمین کو تعمیر یا کاشت کے لیے باقی رکھنا ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7221} حکر زیادہ تر اوقاف میں ہوتا ہے اور کبھی ذاتی املاک میں بھی؛ فقہاء کا زیادہ کلام اوقاف سے متعلق ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7221} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7222} ذاتی ملکیت میں طویل اجارہ جائز ہے، جبکہ وقف میں حنفیہ اور مالکیہ ایک معین مدت سے زیادہ کو ممنوع قرار دیتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7222} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7223} شافعیہ اور حنابلہ ضرورت اور مصلحت کے مطابق وقف میں طویل اجارے کی اجازت دیتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7224} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7225} اگر واقف طویل اجارے سے منع کرے تو اس کی شرط کی پابندی لازم ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7225} ⁦(یہ مدخل p.7225 سے آگے جاری ہے اور ابھی مکمل نہیں۔)⁩"
  es: "Hikr significa léxicamente injusticia, estrechez y dificultad; sus usos técnicos son tres: el alquiler fijado en una propiedad mantenida bajo un arrendamiento a largo plazo, la propiedad arrendada en sí misma y el arrendamiento a largo plazo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7220} Ibn Abidin lo define como un arrendamiento cuyo propósito es mantener a otros fuera y mantener la tierra para construir o plantar, distinto de khulu y del arrendamiento a largo plazo más amplio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7221} Hikr ocurre principalmente en propiedad waqf, a veces en propiedad privada; la mayoría de las discusiones de los juristas se refieren a waqf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7221} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7222} Un arrendamiento a largo plazo de propiedad privada es lícito; Para el waqf, los hanafíes y malikíes prohíben exceder un plazo establecido (generalmente tres años para la tierra entre los hanafíes; cuatro años para la tierra y un año para una casa para mezquitas y los pobres entre los malikíes). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7222} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7223} Los shafiíes y hanbalíes permiten arrendamientos largos de waqf según lo requieran la necesidad y el beneficio; Ibn Qudama argumenta a partir del arrendamiento en la historia de Moisés y Shu'ayb. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7224} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7225} Cuando el fundador prohíbe un arrendamiento largo, su condición es vinculante; Algunos juristas hanafíes y shafiíes permiten la sucesión de contratos anuales consecutivos, a menos que el fundador lo prohíba. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7225} La mayoría de los juristas limitan el arrendamiento a largo plazo de un waqf a condiciones tales como la ruina del waqf, la falta de ingresos para repararlo y la ausencia de un prestamista que pueda adelantar la suma. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7225} (Sobre la norma relativa al arrendamiento a largo plazo de tierras waqf, la mayoría lo permite con condiciones: el waqf está en ruinas y sus beneficiarios no pueden usarlo, no tiene ingresos para repararlo y ningún prestamista adelantará la suma necesaria por debajo del alquiler para ese plazo; los hanafíes añaden que el waqf no puede intercambiarse por una propiedad que genere ingresos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7226} Los hanbalíes y la mayoría de los shafiíes lo permiten directamente a menos que el fundador lo prohíba, y algunos shafiíes lo prohíben por completo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7226} Cuando el administrador toma una suma de una persona para reparar el waqf y le otorga a esa persona parte del usufructo como khulu, el pagador posee esa parte y debe un pago permanente hikr en el resto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7226} Solo el administrador, que tiene la facultad de arrendar, puede otorgar hikr; el Maliki Adawi trata la costumbre en Egipto como una condición, por lo que los arrendamientos de hikr son perpetuos; los Hanafi otorgan al titular un derecho de asentamiento mientras su edificio permanezca en pie y pague el alquiler justo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7226} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7227} Un arrendamiento por debajo del alquiler justo es nulo por subvaloración grave según la visión Hanafi, y los juristas difieren en cuanto a la responsabilidad; el alquiler justo puede subir o bajar durante el plazo según las reglas de cada escuela. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7227} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7228} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7229} Lo que el poseedor construye o planta con el permiso del juez o administrador es su propiedad absoluta, vendible, donable y heredable, mientras que el suelo permanece como waqf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7230} Las opiniones difieren sobre el derecho de tanteo sobre los edificios, sobre la donación de un edificio a otro beneficiario, sobre la muerte del poseedor antes de la construcción y sobre el fin del hikr cuando el edificio perece. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7230} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7231} La entrada se cierra en el siguiente encabezado, hukm ⁦(حُكم)⁩, en la p.7232. )"
  fr: "Le terme « hikr » signifie lexicalement injustice, restriction et difficulté; ses usages techniques sont de trois ordres: le loyer fixé pour un bien détenu en vertu d’un bail emphytéotique, le bien loué lui-même et le bail emphytéotique. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7220} Ibn Abidin le définit comme un bail dont le but est d’empêcher l’accès à un bien et de réserver le terrain à la construction ou à la culture, distinct du khulu et du bail emphytéotique au sens plus large. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7221} Le hikr s’applique principalement aux biens waqf, parfois aux biens privés; la plupart des analyses juridiques portent sur le waqf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7221} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7222} Un bail emphytéotique portant sur un bien privé est licite. Concernant le waqf, les hanafites et les malikites interdisent de dépasser une durée déterminée (généralement trois ans pour les terres chez les hanafites; quatre ans pour les terres et un an pour une maison, pour les mosquées et les pauvres chez les malikites). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7222} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7223} Les chaféites et les hanbalites autorisent les baux de longue durée pour le waqf, selon les besoins et l'intérêt; Ibn Qudama s'appuie sur l'exemple du bail dans l'histoire de Moïse et Shu'ayb. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7224} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7225} Lorsque le fondateur interdit un bail de longue durée, sa condition est contraignante. Certains juristes hanafites et chaféites autorisent la reconduction tacite des contrats annuels, sauf interdiction du fondateur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7225} La plupart des juristes limitent la longue durée du waqf à des situations telles que la ruine du bien, l'absence de revenus pour sa réparation et l'absence de prêteur pouvant avancer les fonds. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7225} (Concernant la question de la location à long terme d'un waqf, la majorité l'autorise sous certaines conditions: le waqf est en ruine et ses bénéficiaires ne peuvent l'utiliser, il ne dispose d'aucun revenu pour le réparer et aucun prêteur n'acceptera de fournir la somme nécessaire en dessous du loyer pour cette durée; les hanafites ajoutent que le waqf ne peut être échangé contre un bien productif de revenus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7226} Les hanbalites et la plupart des shafi'ites l'autorisent sans réserve, sauf si le fondateur l'interdit, et certains shafi'ites l'interdisent totalement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7226} Lorsque l'administrateur perçoit une somme d'une personne pour réparer le waqf et lui concède une partie de l'usufruit à titre de khulu, le payeur devient propriétaire de cette part et est redevable d'une somme permanente. Le hikr est applicable au reste. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7226} Seul l'administrateur, qui détient le pouvoir de louer, peut accorder le hikr; l'école malikite adawi considère la coutume en Égypte comme une condition, de sorte que les baux avec hikr sont perpétuels; l'école hanafite accorde au locataire un droit d'occupation tant que son bâtiment existe et qu'il paie le loyer équitable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7226} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7227} Un bail inférieur au loyer équitable est nul pour sous-évaluation manifeste selon l'école hanafite, et les juristes divergent sur la question de la responsabilité; le loyer équitable peut augmenter ou diminuer pendant la durée du bail selon les règles de chaque école. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7227} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7228} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7229} Ce que le titulaire construit ou plante avec la permission du juge ou de l'administrateur lui appartient en pleine propriété; il peut le vendre, le donner et l'hériter, tandis que le sol demeure un waqf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7230} Les avis divergent quant au droit de préemption sur les bâtiments, à la donation d'un bâtiment à un autre bénéficiaire, au décès du titulaire avant la construction et à la fin du hikr lorsque le bâtiment périt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7230} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7231} L'article se termine à la rubrique suivante, hukm ⁦(حُكم)⁩, à la p.7232.)"
  tr: "Dilde tekel, adaletsizlik, eksiklik, zorluk ve bükülme anlamına gelir; tekel, bir şeyi toplayıp aşırı kazanç için tutmak demektir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7220} Terminolojide üç anlamı vardır: uzun vadeli kira kapsamında tutulan mülke sabit kira ödemesi, tekelleştirilmiş mülkün kendisi ve uzun vadeli kira sözleşmesi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7220} İbn Abidin bunu kira olarak tanımlar; yani başkalarını engellemek ve arazi kullanımını inşaat veya dikim için korumak anlamına gelir. Boş konut ve kira ile genel uzun vadeli kiralamadan farklıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7221} Tekel çoğunlukla vakıflardadır ve özel mülklerde de olabilir. Çoğu hukukçu bu konuyu vakıflarla ilgili olarak tartışır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7221} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7222} Mülklerde uzun süreli kira izin verilirken, vakıflarda Hanafi ve Malikiler belirli bir sürenin aşılmasını yasaklar (Hanefi okulunda Hanafi okulunda arazi için üç yıl, arazi için dört yıl ve kamu bağışlarındaki Malikilere göre ev için bir yıldan fazla). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7222} {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7223} Şafiiler ve Hanbaliler, ihtiyaç ve faize göre uzun süreli vakıf kiralamalarına izin vermiş, İbn Kudama ise Kur'an'da anlatılan kanıt olarak Şuayb ile Musa arasındaki kira sözleşmesini göstermiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7224} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7225} Eğer bağdaş uzun süreli kiralamaların yasaklanmasını şart koşmuşsa, şartına uyulmalıdır. Bazı Hanefiler ve Şafi'ler, bir yıl boyunca ardışık sözleşmelerin yapılmasına izin vermiştir, ancak veren bunu yasaklamıyorsa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7225} Uzun vadeli kiralamalar, vakfın mahvedilmesi, kullanımının geçersiz kılınması ve geçim kaynağının olmaması gibi koşullarla sınırlıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7225} Vakıfın sınırlandırılmasına ilişkin kararla ilgili olarak, çoğu kişinin buna izin verdiği görüşler vardır; bunlar arasında bağağın yok edilmesi, vafağın geçersizliği, üzerine inşa edilecek kâr olmaması, o dönem için kira ödenmediği için gerekli miktarda kredi verilmemesi ve Hanefi âliminin vakıfın gelirli bir mülkle değiştirilemeyeceği belirtilmiştir. {Cite:Fiqh-Mawsua-Kuwaitiyya-Noor-V3 s. 7226} Hanbaliler ve Şafi'lerin çoğunluğu, bağlayıcı yasaklamadıkça kesinlikle münhasır hakkı tanır ve bazı Şafi'ler kesinlikle yasaklar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7226} Eğer denetçi, vakıfı inşa etmek için bir kişi tarafından ödenen bir mülk yaratırsa, bağışçı yardımın bir kısmına sahip olur ve böylece hak sahibi taraf üzerinde kalıcı münhasır haklara sahiptir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7226} Münhasırlık, yalnızca vakıfı kiralama yetkisine sahip olan kişi tarafından izinlidir, örneğin denetçi. Al-Adawi, Mısır'da geleneği bir koşul olarak görmüştür, bu yüzden işlemler sonsuza dek devam eder ve Hanefi, inşaat devam ettiği sürece ve eşdeğer kira ödediği sürece tekelci karar verme hakkını belirlemiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7226} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7227} Eşdeğer ücret zorunludur ve münhasırlık sözleşmesi Hanefilere göre ağır haksızlıkla geçersiz sayılır. Denetçinin sorumluluğu konusunda anlaşmazlık vardır; eşdeğer ücretin tazminatı bu süre içinde iptal koşullarına ve her okulun kurallarına göre artar veya azalır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7227} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7228} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7229} Tekelci, hakim veya denetçinin izniyle inşa ettiği veya diktiği şey, satış, hediye ve miras için geçerli olan münhasır mülküdür. Arazi parsesi ise vakıf içindir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7230} Kararlar, inşaatta önlem, diğer tarafta inşaat için vakıf, tekelci kişinin inşaat öncesi ölümü ve bina yıkıldığında tekelin sona ermesi konularında farklılık gösterir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7230} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7231} Giriş şu başlıkla sona erer: \"Hüküm\" s. 7232."
  id: "Dalam bahasa, monopoli berarti ketidakadilan, kekurangan, kesulitan, dan penyelewengan; monopoli berarti mengumpulkan sesuatu dan memegangnya untuk keuntungan berlebihan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7220} Dalam terminologi, ini memiliki tiga makna: sewa yang ditetapkan atas properti yang dipegang dalam sewa jangka panjang, properti yang dimonopoli itu sendiri, dan sewa jangka panjang itu sendiri. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7220} Ibn Abidin mendefinisikannya sebagai sewa, yang berarti mencegah orang lain dan melestarikan penggunaan tanah untuk konstruksi atau penanaman. Ini berbeda dengan kekosongan dan sewa, serta sewa jangka panjang umum. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7221} Monopoli sebagian besar ada dalam wakaf, dan mungkin juga pada properti pribadi. Sebagian besar ahli hukum membahas masalah ini mengenai wakaf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7221} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7222} Sewa jangka panjang atas properti diperbolehkan, sedangkan dalam wakaf, Hanafi dan Malik melarang melebihi jangka waktu tertentu (tiga tahun untuk tanah menurut Hanafi di aliran Hanafi, empat tahun untuk tanah, dan lebih dari satu tahun untuk rumah menurut Malikis berdasarkan dana abadi publik). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7222} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7223} Syafi'i dan Hanbal mengizinkan sewa jangka panjang dalam wakaf sesuai kebutuhan dan bunga, dan Ibn Qudamah mengutip kontrak sewa antara Shu'ayb dan Musa sebagai bukti yang diceritakan oleh Al-Qur'an. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7224} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7225} Jika pemberi wakaf menetapkan larangan sewa jangka panjang, syaratnya harus dipatuhi. Beberapa Haṣhfi dan syafi mengizinkan praktik kontrak berturut-turut selama satu tahun kecuali pemberi wakaf melarangnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7225} Sewa jangka panjang dibatasi pada kondisi seperti merusak dana abadi, membatalkan penggunaannya, dan tidak adanya mata pencaharian untuk menopang dana tersebut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7225} Mengenai putusan pembatasan wakaf, ada pendapat bahwa sebagian besar mengizinkannya dengan syarat, termasuk penghancuran dana abadi, ketidakabsahan dana abadi, tidak adanya keuntungan untuk membangunnya, tidak adanya pinjaman dengan jumlah yang diperlukan dengan harga kurang dari sewa untuk periode tersebut, dan sarjana Hanafi menyatakan bahwa dana abadi tidak dapat diganti dengan properti yang memiliki pendapatan. {cite:fiqh-mawsua-Kuwaitiyya-noor-v3 hlm. 7226} Hanbalis dan mayoritas Shafi'i diizinkan eksklusivitas sepenuhnya kecuali pemberi wakaf melarangnya, dan beberapa Shafi'i melarangnya secara mutlak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7226} Jika pengawas menciptakan properti yang dibayarkan oleh seseorang untuk membangun wakaf, maka pemberi memiliki sebagian manfaat, sehingga ia memiliki hak eksklusif permanen atas pihak yang sah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7226} Eksklusivitas hanya diizinkan oleh seseorang yang memiliki wewenang untuk menyewa wakaf, seperti pengawas. Al-Adawi menganggap adat di Mesir sebagai syarat, sehingga akta tersebut berlangsung selamanya, dan Hanafi menetapkan hak monopoli untuk memutuskan selama bangunan masih berdiri dan ia membayar sewa yang setara. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7226} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7227} Biaya setara adalah wajib, dan kontrak eksklusivitas dibatalkan oleh ketidakadilan berat menurut Hanafi. Ada perbedaan pendapat mengenai tanggung jawab pengawas; kompensasi atas biaya setara naik atau menurun selama periode sesuai dengan kondisi pembubaran dan aturan masing-masing sekolah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7227} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7228} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7229} Apa yang dibangun atau ditanam oleh monopopolist dengan izin hakim atau pengawas adalah properti eksklusifnya yang sah untuk dijual, hadiah, dan warisan. Adapun sebidang tanah, itu untuk endowment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7230} Putusan berbeda mengenai preemption dalam pembangunan, pemberian dana untuk pembangunan di sisi lain, kematian monopopolist sebelum pembangunan, dan berakhirnya monopoli atas penghancuran bangunan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7230} Entri ini diakhiri dengan judul berikut: \"Penghakiman\" pada hlm. 7232."
