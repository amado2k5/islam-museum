label: { ar: "الحكر", en: "Hikr (long lease of waqf land)", ur: "حکر" }
summary:
  ar: "الحكر في اللغة الظلم والنقص والعسر والالتواء، والاحتكار جمع الشيء وحبسه ليغلو. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7220} وفي الاصطلاح يطلق على ثلاثة معان: الأجرة المقررة على عقار محبوس في الإجارة الطويلة، والعقار المحتكر نفسه، والإجارة الطويلة نفسها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7220} ويعرّفه ابن عابدين بأنه إجارة يقصد بها منع الغير واستبقاء الانتفاع بالأرض للبناء أو الغرس، وهو يفترق عن الخلو والأجرة والإجارة الطويلة الأعم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7221} ويكون الحكر غالبا في الأوقاف، وقد يكون في الأملاك الخاصة، وأكثر كلام الفقهاء فيه يتعلق بالأوقاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7221} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7222} والإجارة الطويلة في الأملاك جائزة، أما في الوقف فالحنفية والمالكية منعوا تجاوز مدة معينة (ثلاث سنين للأرض عند الحنفية في الغالب، وأربع سنين للأرض والأكثر من سنة للدار عند المالكية على الأوقاف العامة). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7222} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7223} وأجاز الشافعية والحنابلة الإجارة الطويلة في الوقف بحسب الحاجة والمصلحة، واحتج ابن قدامة بما حكاه القرآن من عقد إجارة بين شعيب وموسى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7224} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7225} وإذا اشترط الواقف منع الإجارة الطويلة وجب اتباع شرطه، وأجاز بعض الحنفية والشافعية حيلة العقود المتلاحقة سنة سنة ما لم يمنعها الواقف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7225} وتقيد الإجارة الطويلة عند الأكثرين بشروط كتخرب الوقف وتعطل نفعه وعدم وجود حاصل يعمره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7225} وفي حكم التحكير في الوقف أقوال: الأكثرون يجيزونه بشروط، منها خراب الوقف وتعطل انتفاع الموقوف عليهم به، وعدم وجود حاصل يعمر به، وألا يوجد من يقرضه القدر المحتاج إليه بأقل من أجرة تلك المدة، واشترط الحنفية ألا يمكن استبدال الوقف بعقار ذي ريع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7226} وأجاز الحنابلة وجمهور الشافعية التحكير مطلقا ما لم يمنعه الواقف، ومنعه بعض الشافعية مطلقا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7226} وإذا أنشأ الناظر خلوا بمال دفعه إنسان لتعمير الوقف ملك دافع المال جزءا من المنفعة، وعليه حكر دائم للجهة المستحقة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7226} ولا يجوز التحكير إلا ممن له ولاية إجارة الوقف، كالناظر، وقد عدّ العدوي العرف في مصر كالشرط، فالأحكار مستمرة للأبد، وأثبت الحنفية للمحتكر حق القرار ما دام بناؤه قائما ويدفع أجرة المثل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7226} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7227} ويلزم أجر المثل، ويفسد عقد التحكير بغبن فاحش عند الحنفية، واختلفوا في ضمان الناظر؛ وتزيد أجرة المثل أو تنقص أثناء المدة بحسب شروط الفسخ وقواعد كل مذهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7227} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7228} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7229} وما يبنيه المحتكر أو يغرسه بإذن القاضي أو الناظر ملك خالص له يصح بيعه وهبته ويورث، أما رقبة الأرض فللوقف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7230} وتختلف الأحكام في الشفعة في البناء، ووقف البناء على جهة أخرى، وموت المحتكر قبل البناء، وانقضاء الحكر بهلاك البناء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7230} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7231} وقد انتهى المدخل عند العنوان التالي «حُكم» على ص 7232. "
  en: "Hikr lexically means injustice, narrowness and hardship; its technical uses are three: the rent fixed on a property held under a long lease, the leased property itself, and the long lease. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7220} Ibn Abidin defines it as a lease whose purpose is to keep others out and to keep the land for building or planting, distinct from khulu and from the wider long lease. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7221} Hikr occurs mostly on waqf property, sometimes on private property; most jurists' discussion concerns waqf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7221} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7222} A long lease of private property is lawful; for waqf the Hanafis and Malikis forbid exceeding a set term (generally three years for land among the Hanafis; four years for land and one year for a house for mosques and the poor among the Malikis). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7222} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7223} The Shafiis and Hanbalis allow long leases of waqf as need and benefit require; Ibn Qudama argues from the lease in the story of Moses and Shu'ayb. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7224} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7225} Where the founder forbids a long lease his condition binds; some Hanafi and Shafii jurists allow a device of consecutive yearly contracts unless the founder forbids it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7225} Most jurists limit the long lease of waqf to conditions such as ruin of the waqf, lack of income to repair it, and no lender who can advance the sum. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7225} (On the ruling about leasing waqf land long-term the majority allow it with conditions: the waqf is ruined and its beneficiaries cannot use it, it has no income to repair it, and no lender will advance the needed sum below the rent for that term; the Hanafis add that the waqf cannot be exchanged for income-bearing property. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7226} The Hanbalis and most Shafiis allow it outright unless the founder forbids it, and some Shafiis forbid it altogether. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7226} When the administrator takes a sum from a person to repair the waqf and grants that person part of the usufruct as khulu, the payer owns that part and owes a permanent hikr on the rest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7226} Only the administrator, who holds the power to lease, may grant hikr; the Maliki Adawi treats the custom in Egypt as a condition, so hikr leases run for ever; the Hanafis give the holder a right of settlement while his building stands and he pays the fair rent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7226} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7227} A lease below the fair rent is void for gross undervaluation in the Hanafi view, and the jurists differ on liability; the fair rent may rise or fall during the term according to each school's rules. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7227} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7228} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7229} What the holder builds or plants with the permission of the judge or administrator is his absolute property, saleable, giftable and inheritable, while the soil remains waqf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7230} Views differ on pre-emption over buildings, on endowing a building to another beneficiary, on the holder's death before building, and on the end of hikr when the building perishes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7230} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7231} The entry closes at the next heading, hukm (حُكم), on p.7232. )"
  ur: "حکر لغت میں ظلم، تنگی اور دشواری کو کہتا ہے؛ اصطلاحاً اس کے تین معنی ہیں: طویل اجارے پر رکھے گئے عقار کی مقررہ اجرت، خود محتکر عقار، اور طویل اجارہ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7220} ابن عابدین کے نزدیک یہ ایسا اجارہ ہے جس سے مقصود دوسروں کو روکنا اور زمین کو تعمیر یا کاشت کے لیے باقی رکھنا ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7221} حکر زیادہ تر اوقاف میں ہوتا ہے اور کبھی ذاتی املاک میں بھی؛ فقہاء کا زیادہ کلام اوقاف سے متعلق ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7221} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7222} ذاتی ملکیت میں طویل اجارہ جائز ہے، جبکہ وقف میں حنفیہ اور مالکیہ ایک معین مدت سے زیادہ کو ممنوع قرار دیتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7222} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7223} شافعیہ اور حنابلہ ضرورت اور مصلحت کے مطابق وقف میں طویل اجارے کی اجازت دیتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7224} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7225} اگر واقف طویل اجارے سے منع کرے تو اس کی شرط کی پابندی لازم ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7225} (یہ مدخل p.7225 سے آگے جاری ہے اور ابھی مکمل نہیں۔)"
