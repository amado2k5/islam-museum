summary:
  ar: "الحكر في اللغة الظلم والنقص والعسر والالتواء، والاحتكار جمع الشيء وحبسه ليغلو. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7220} وفي الاصطلاح يطلق على ثلاثة معان: الأجرة المقررة على عقار محبوس في الإجارة الطويلة، والعقار المحتكر نفسه، والإجارة الطويلة نفسها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7220} ويعرّفه ابن عابدين بأنه إجارة يقصد بها منع الغير واستبقاء الانتفاع بالأرض للبناء أو الغرس، وهو يفترق عن الخلو والأجرة والإجارة الطويلة الأعم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7221} ويكون الحكر غالبا في الأوقاف، وقد يكون في الأملاك الخاصة، وأكثر كلام الفقهاء فيه يتعلق بالأوقاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7221} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7222} والإجارة الطويلة في الأملاك جائزة، أما في الوقف فالحنفية والمالكية منعوا تجاوز مدة معينة (ثلاث سنين للأرض عند الحنفية في الغالب، وأربع سنين للأرض والأكثر من سنة للدار عند المالكية على الأوقاف العامة). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7222} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7223} وأجاز الشافعية والحنابلة الإجارة الطويلة في الوقف بحسب الحاجة والمصلحة، واحتج ابن قدامة بما حكاه القرآن من عقد إجارة بين شعيب وموسى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7224} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7225} وإذا اشترط الواقف منع الإجارة الطويلة وجب اتباع شرطه، وأجاز بعض الحنفية والشافعية حيلة العقود المتلاحقة سنة سنة ما لم يمنعها الواقف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7225} وتقيد الإجارة الطويلة عند الأكثرين بشروط كتخرب الوقف وتعطل نفعه وعدم وجود حاصل يعمره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7225} (المدخل متصل بعد ص 7225 ولم يكتمل.)"
  en: "Hikr lexically means injustice, narrowness and hardship; its technical uses are three: the rent fixed on a property held under a long lease, the leased property itself, and the long lease. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7220} Ibn Abidin defines it as a lease whose purpose is to keep others out and to keep the land for building or planting, distinct from khulu and from the wider long lease. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7221} Hikr occurs mostly on waqf property, sometimes on private property; most jurists' discussion concerns waqf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7221} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7222} A long lease of private property is lawful; for waqf the Hanafis and Malikis forbid exceeding a set term (generally three years for land among the Hanafis; four years for land and one year for a house for mosques and the poor among the Malikis). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7222} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7223} The Shafiis and Hanbalis allow long leases of waqf as need and benefit require; Ibn Qudama argues from the lease in the story of Moses and Shu'ayb. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7224} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7225} Where the founder forbids a long lease his condition binds; some Hanafi and Shafii jurists allow a device of consecutive yearly contracts unless the founder forbids it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7225} Most jurists limit the long lease of waqf to conditions such as ruin of the waqf, lack of income to repair it, and no lender who can advance the sum. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7225} (The headword continues beyond p.7225 and is not complete.)"
  ur: "حکر لغت میں ظلم، تنگی اور دشواری کو کہتا ہے؛ اصطلاحاً اس کے تین معنی ہیں: طویل اجارے پر رکھے گئے عقار کی مقررہ اجرت، خود محتکر عقار، اور طویل اجارہ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7220} ابن عابدین کے نزدیک یہ ایسا اجارہ ہے جس سے مقصود دوسروں کو روکنا اور زمین کو تعمیر یا کاشت کے لیے باقی رکھنا ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7221} حکر زیادہ تر اوقاف میں ہوتا ہے اور کبھی ذاتی املاک میں بھی؛ فقہاء کا زیادہ کلام اوقاف سے متعلق ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7221} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7222} ذاتی ملکیت میں طویل اجارہ جائز ہے، جبکہ وقف میں حنفیہ اور مالکیہ ایک معین مدت سے زیادہ کو ممنوع قرار دیتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7222} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7223} شافعیہ اور حنابلہ ضرورت اور مصلحت کے مطابق وقف میں طویل اجارے کی اجازت دیتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7224} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7225} اگر واقف طویل اجارے سے منع کرے تو اس کی شرط کی پابندی لازم ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7225} (یہ مدخل p.7225 سے آگے جاری ہے اور ابھی مکمل نہیں۔)"
