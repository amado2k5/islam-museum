  en: Khiyar al-ta'yin (option of specification)
  ur: خیار التعیین
summary:
  ar: 'خيار التعيين: التعيين لغة التخصيص من الجملة؛ وعند الحنفية البيع الذي فيه خيار التعيين شراء أحد شيئين أو ثلاثة على أن يعين المشتري أيها شاء، والحق للعاقد في تعيين أحد الأشياء التي وقع العقد على أحدها شائعا خلال مدة معينة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7895}'
  en: 'Khiyar al-ta''yin (option of specification): lexically singling out from a group; for the Hanafis it is buying one of two or three things with the buyer to choose which he wants; technically the right of a party to specify one of the things on which the contract fell in common, within a set term. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7895}'
  ur: 'خیار التعیین: لغت میں جماعت میں سے کسی کو خاص کرنا؛ حنفیہ کے نزدیک دو یا تین چیزوں میں سے ایک خریدنا جس میں خریدار اپنی پسند متعین کرے؛ اصطلاحاً عاقد کا وہ حق کہ جن چیزوں پر مشترک عقد ہوا ان میں سے ایک کو مقررہ مدت میں متعین کرے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7895}'
