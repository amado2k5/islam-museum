id: concept/khiyar-al-tayin-fiqh
class: concept
kind: legal
label:
  ar: خيار التعيين
  en: Khiyar al-ta'yin (option of specification)
  ur: خیار التعیین
  es: "Khiyar al-ta'yin (opción de especificación)"
  fr: "Khiyar al-ta'yin (option de spécification)"
  tr: "Atama seçeneği"
  id: "Opsi penugasan"
summary:
  ar: 'خيار التعيين: التعيين لغة التخصيص من الجملة؛ وعند الحنفية البيع الذي فيه خيار التعيين شراء أحد شيئين أو ثلاثة على أن يعين المشتري أيها شاء، والحق للعاقد في تعيين أحد الأشياء التي وقع العقد على أحدها شائعا خلال مدة معينة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7895} نسمي خيار التعيين أيضا خيار التمييز؛ والمالكية يسمون العقد بيع الاختيار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7896} يتميز خيار التعيين عن خيار الشرط في أن الشرط يعلق على واحد، والتعيين على متعدد غير محدد، وعن الاختيار في الإسلام ⁦(تخيير من أسلم على أكثر من أربع زوجات)⁩. وفي الثمن: إذا باع شيئا إلى أجلين أو بثمنين مختلفين ليختار أحدهما، وهو ممنوع إذا لم يفترقا على التعيين في المجلس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7896}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7897} الحكم: مشروعيته عند الحنفية والمالكية وبعض الحنابلة؛ وقالوا: بيع الاختيار لازم، والخيار في التعيين لا في الأخذ والرد؛ ونفاه الشافعية والجمهور من الحنابلة لأنه غرر ومنهي عنه في حديث الثنيا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7897} شروط قيامه: ذكر التعيين في صلب العقد، والمدة معلومة، وعدم زيادة المختار على ثلاثة، وأن يكون المختار واحدا، واقترانه بخيار الشرط في المشهور من الحنفية، ويجوز أن يكون للمشتري أو للبائع لا لهما معا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7897}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7898}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7898}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7899}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7899}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7900} أثره في العقد: يمنع ثبوت الملك على أحد الأشياء دون تعيين، وإذا هلك أحدها تعين الآخر أمانة، وإذا مضت المدة ولم يختر المالكية يلزمه النصف من كل منها، وتبعة الهلاك تفصيلها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7900}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7901}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7901} توقيته: يشترط في الأرجح عند الحنفية إن لم يتضمن خيار الشرط، وفائدته إجبار المختار على التعيين؛ ويسقط بما يسقط به خيار الشرط؛ وينتقل بالموت إلى الوارث ليعين محل الخيار، ويؤدي الثمن من التركة.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7902}'
  en: 'Khiyar al-ta''yin (option of specification): lexically singling out from a group; for the Hanafis it is buying one of two or three things with the buyer to choose which he wants; technically the right of a party to specify one of the things on which the contract fell in common, within a set term. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7895} Also called option of distinction (khiyar al-tamyiz); the Malikis call the contract a sale of choice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7896} It differs from the option of stipulation, which attaches to one thing, while specification concerns an indefinite group, and from the choice a convert keeps among four wives; in price, selling at two times or two prices for the buyer to choose is forbidden unless the parties separate in the session with the choice made. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7896}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7897} Ruling: lawful for the Hanafis, Malikis and some Hanbalis; the Malikis call the contract binding, the option being only in the choice; the Shafiis and most Hanbalis reject it as hazard and forbidden in the report on thunya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7897} Conditions: the stipulation in the contract, a known term, no more than three things, one to be chosen, its attachment to the option of stipulation in the common Hanafi view; it may belong to the buyer or to the seller, not both. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7897}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7898}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7898}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7899}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7899}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7900} Effect: it prevents the transfer of ownership until a choice is made; if one perishes the other is entrusted; if the term passes without choice, the Malikis hold him liable for half each, and loss is treated in detail. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7900}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7901}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7901} Term: required by the preferred Hanafi view unless accompanied by the option of stipulation; ends by the same causes as the option of stipulation; passes at death to the heir who chooses, the price paid from the estate. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7902}'
  ur: 'خیار التعیین: لغت میں جماعت میں سے کسی کو خاص کرنا؛ حنفیہ کے نزدیک دو یا تین چیزوں میں سے ایک خریدنا جس میں خریدار اپنی پسند متعین کرے؛ اصطلاحاً عاقد کا وہ حق کہ جن چیزوں پر مشترک عقد ہوا ان میں سے ایک کو مقررہ مدت میں متعین کرے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7895} خیار التمییز بھی کہا جاتا ہے؛ مالکیہ اس عقد کو بیع الاختیار کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7896} خیارِ شرط سے مختلف، کیونکہ شرط ایک پر معلق ہوتی ہے اور تعیین غیر معین متعدد پر؛ اور اسلام لانے والے کا چار سے زائد بیویوں میں سے انتخاب بھی الگ ہے؛ قیمت میں دو مدتوں یا دو قیمتوں پر بیع جو خریدار چنے ممنوع، جب تک مجلس میں تعیین کر کے جدا نہ ہوں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7896}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7897} حکم: حنفیہ، مالکیہ اور بعض حنابلہ کے نزدیک جائز؛ مالکیہ بیع الاختیار کو لازم کہتے ہیں اور خیار صرف تعیین میں ہوتا ہے؛ شافعیہ اور جمہور حنابلہ اسے غرر اور ثنیا کی ممانعت کی بنا پر منع کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7897} شرائط: عقد کے اصل حصے میں تعیین کا ذکر، مدت معلوم، تین سے زیادہ چیزیں نہ ہوں، ایک کا چنا جانا، حنفیہ کے مشہور قول میں خیار شرط سے متصل ہونا؛ یہ خریدار یا بائع کا ہو سکتا ہے، دونوں کا نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7897}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7898}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7898}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7899}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7899}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7900} اثر: ملکیت کی منتقلی کو اس وقت تک روکتا ہے جب تک تعیین نہ ہو؛ ایک ہلاک ہو تو دوسرا امانت بن جاتا ہے؛ مدت گزر جائے اور انتخاب نہ ہو تو مالکیہ ہر ایک کا نصف لازم کرتے ہیں؛ ہلاکت کی ذمہ داری کی تفصیل۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7900}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7901}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7901} مدت: حنفیہ کے راجح قول کے مطابق مقرر ہونا ضروری اگر خیارِ شرط ساتھ نہ ہو؛ خیارِ شرط کے ختم ہونے کے اسباب سے ختم ہوتا ہے؛ موت پر وارث کو منتقل ہوتا ہے جو تعیین کرے گا، اور قیمت ترکے سے ادا ہوگی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7902}'
  es: "Khiyar al-ta'yin (opción de especificación): léxicamente, distinguir de un grupo; para los Hanafi, es comprar una de dos o tres cosas, con el comprador eligiendo la que desea; técnicamente, el derecho de una parte a especificar una de las cosas en las que el contrato se basa en común, dentro de un plazo determinado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7895} También llamada opción de distinción (khiyar al-tamyiz); los Malikis llaman al contrato venta de elección. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7896} Se diferencia de la opción de estipulación, que se vincula a una sola cosa, mientras que la especificación se refiere a un grupo indefinido, y de la elección que un converso mantiene entre cuatro esposas; en cuanto al precio, vender a dos veces o dos precios para que el comprador elija está prohibido a menos que las partes se separen en la sesión con la elección hecha. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7896}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7897} Decisión: lícito para los Hanafi, Maliki y algunos Hanbali; los Maliki llaman al contrato vinculante, la opción está solo en la elección; los Shafii y la mayoría de los Hanbali lo rechazan como riesgo y prohibido en el informe sobre thunya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7897} Condiciones: la estipulación en el contrato, un término conocido, no más de tres cosas, una para ser elegida, su vinculación a la opción de estipulación en la visión Hanafi común; puede pertenecer al comprador o al vendedor, no a ambos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7897}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7898}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7898}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7899}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7899}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7900} Efecto: impide la transferencia de propiedad hasta que se haga una elección; si uno perece, se confía al otro; si el plazo pasa sin elección, los Malikis lo hacen responsable de la mitad de cada uno, y la pérdida se trata en detalle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7900}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7901}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7901} Plazo: requerido por la opinión preferida de la escuela Hanafi a menos que vaya acompañado de la opción de estipulación; termina por las mismas causas que la opción de estipulación; pasa al fallecimiento al heredero que elija, el precio pagado de la herencia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7902}"
  fr: "Khiyar al-ta'yin (option de spécification): terme désignant un élément parmi un ensemble; pour les Hanafites, il s'agit de l'achat d'un bien parmi deux ou trois, l'acheteur ayant la possibilité de choisir celui qu'il désire; techniquement, c'est le droit d'une partie de spécifier l'un des éléments communs au contrat, dans un délai déterminé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7895} Également appelée option de distinction (khiyar al-tamyiz); les Malikites qualifient ce contrat de vente de choix. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7896} Elle diffère de l'option de stipulation, qui porte sur un seul élément, tandis que la spécification concerne un groupe indéfini, et du choix qu'un converti peut faire entre ses quatre épouses; en matière de prix, la vente à deux prix différents, laissant le choix à l'acheteur, est interdite, sauf si les parties se séparent lors de la transaction après avoir effectué le choix. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7896}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7897} Décision: licite pour les hanafites, les malikites et certains hanbalites; les malikites considèrent le contrat comme contraignant, l’option ne faisant que résider dans le choix; les chaféites et la plupart des hanbalites le rejettent comme étant risqué et l’interdisent dans le rapport sur la thunya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7897} Conditions: la stipulation dans le contrat, une condition connue, pas plus de trois éléments, dont un à choisir, son rattachement à l’option de stipulation selon l’avis hanafite commun; elle peut appartenir à l’acheteur ou au vendeur, mais pas aux deux. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7897}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7898}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7898}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7899}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7899}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7900} Effet: il empêche le transfert de propriété jusqu’à ce qu’un choix soit fait; si l’un périt, l’autre est confié; si le terme expire sans choix, les Malikites le tiennent pour responsable de la moitié de chacun, et la perte est traitée en détail. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7900}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7901}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7901} Durée: exigée par l’avis hanafite privilégié, sauf si elle est accompagnée d’une option de stipulation; elle prend fin pour les mêmes causes que l’option de stipulation; au décès, elle est transmise à l’héritier qui le souhaite, à hauteur du prix payé, prélevé sur la succession. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7902}"
  tr: "Belirleme seçeneği: Belirleme, şartnamenin dilidir; Hanefi okuluna göre, tescil seçeneğinin iki veya üç üründen birini satın alması ve alıcının istediğini belirtmesi ve yüklenicinin sözleşmenin genellikle imzalandığı maddelerden birini belirli bir süre içinde belirtme hakkı olduğu bir satıştır. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.7895} Biz atama seçeneğine ayrım seçeneği de diyoruz; Malikler ise sözleşmeye tercih satışı der. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7896} Atama seçeneği, bir koşul seçeneğinden farklıdır; koşul bir koşul, atama ise belirtilmemiş bir çoğula bağlıdır; ve İslam'da seçimden (Müslüman olanın dörtten fazla eş üzerinde seçimi) farklıdır. Fiyat konusunda: bir şeyi iki döneme veya iki farklı fiyata satarsa, mahkemede atamada ayrılmazlarsa bu yasaktır. {Kaynak:Fiqh-Mawsua-Kuwaitiyya-Noor-V3 s. 7896} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7897} Karar: Hanefiler, Malikiler ve bazı Hanbalilere göre meşruiyeti; şöyle dediler: Satış isteğe bağlıdır ve seçenek şarta bağlıdır, alma veya geri verme değil; Şafiiler ve Hanbalilerin çoğunluğu bunu reddetti çünkü bu gharar ve al-Thanya Hadislerinde yasaktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7897} Geçerlilik koşulları: Temel sözleşmede atama belirtilir, süre bilinir, tercih edilen sayı üçü geçmemelidir, seçilen kişi bir olmalıdır ve bu, ünlü Hanefi görüşünde şartın seçeneğiyle bağlantılıdır; alıcı veya satıcı için olabilir ama ikisi için de değil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7897} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7898} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7898} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7899} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7899} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7900} Sözleşme üzerindeki etkisi: mülkiyetin, bir madde üzerinde belirtilmeden tespit edilmesi yasaktır. Birisi ölürse, diğeri vakıf olarak belirlenir. Süre mülkiyet seçilmeden geçerse, her birinin yarısını ödemekle yükümlüdür ve zararın sonuçları detaylandırılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7900} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7901} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7901} Zamanlaması: Hanefilere göre, koşul seçeneği dahil edilmemişse muhtemelen şart belirtilir ve bunun faydası seçilen kişiyi atamaya zorlamaktır; şart seçeneğinden feragat eden ile feragat edilir; ölüm halinde varisin yerine geçilir ve fiyat mirastan ödenir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7902}"
  id: "Opsi penunjukan: penamaan adalah bahasa spesifikasi; menurut aliran Hanafi, penjualan di mana opsi penunjukan adalah membeli salah satu dari dua atau tiga barang dengan pembeli menentukan mana yang diinginkannya, dan kontraktor berhak menentukan salah satu item yang biasanya ditandatangani kontrak dalam jangka waktu tertentu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7895} Kami juga menyebut opsi penetapan sebagai opsi pembedaan; orang Malik menyebut kontrak sebagai penjualan pilihan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7896} Pilihan penetapan berbeda dari opsi syarat karena syarat bergantung pada satu dan pengangkatan pada kelipatan yang tidak ditentukan, serta pilihan dalam Islam (pilihan seseorang yang Muslim atas lebih dari empat istri). Mengenai harga: jika dia menjual sesuatu dengan dua masa jabatan atau dua harga berbeda untuk memilih satu, dilarang jika mereka tidak berpisah saat ditunjuk di pengadilan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7896} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.7897} Keputusan: Legitimasi menurut Hanafi, Maliki, dan beberapa Hanbali; mereka mengatakan: Penjualan bersifat opsional, dan opsi tersebut sesuai spesifikasi, bukan dalam pengambilan atau pengembalian; para Syafi'i dan mayoritas Hanbalis menolaknya karena dianggap gharar dan dilarang dalam Hadits al-Thanya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7897} Syarat keabsahannya: Menetapkan penetapan dalam kontrak inti, durasi diketahui, jumlah yang dipilih tidak boleh melebihi tiga, orang yang dipilih harus satu, dan terkait dengan opsi kondisi menurut pandangan Hanafi yang terkenal, dan boleh untuk pembeli atau penjual tetapi tidak keduanya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7897} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7898} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7898} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7899} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7899} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7900} Dampaknya terhadap kontrak: kepemilikan dilarang ditetapkan atas salah satu barang tanpa mencantumkannya. Jika salah satu meninggal, yang lain ditetapkan sebagai trust. Jika periode berlalu tanpa memilih kepemilikan, ia wajib membayar setengah dari masing-masing item, dan konsekuensi kerugian dijelaskan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7900} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.7901} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7901} Waktunya: Menurut Hanafi, kemungkinan besar ditentukan jika opsi syarat tidak dimasukkan, dan manfaatnya adalah memaksa orang terpilih untuk menunjuk; dibebaskan oleh pihak yang melepaskan opsi kondisi; dialihkan setelah kematian kepada ahli waris untuk menentukan tempat opsi, dan harga dibayar dari harta warisan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7902}"
