id: concept/khiyar-al-tayin-fiqh
class: concept
kind: legal
label:
  ar: خيار التعيين
  en: Khiyar al-ta'yin (option of specification)
  ur: خیار التعیین
summary:
  ar: 'خيار التعيين: التعيين لغة التخصيص من الجملة؛ وعند الحنفية البيع الذي فيه خيار التعيين شراء أحد شيئين أو ثلاثة على أن يعين المشتري أيها شاء، والحق للعاقد في تعيين أحد الأشياء التي وقع العقد على أحدها شائعا خلال مدة معينة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7895} نسمي خيار التعيين أيضا خيار التمييز؛ والمالكية يسمون العقد بيع الاختيار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7896} يتميز خيار التعيين عن خيار الشرط في أن الشرط يعلق على واحد، والتعيين على متعدد غير محدد، وعن الاختيار في الإسلام (تخيير من أسلم على أكثر من أربع زوجات). وفي الثمن: إذا باع شيئا إلى أجلين أو بثمنين مختلفين ليختار أحدهما، وهو ممنوع إذا لم يفترقا على التعيين في المجلس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7896}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7897} الحكم: مشروعيته عند الحنفية والمالكية وبعض الحنابلة؛ وقالوا: بيع الاختيار لازم، والخيار في التعيين لا في الأخذ والرد؛ ونفاه الشافعية والجمهور من الحنابلة لأنه غرر ومنهي عنه في حديث الثنيا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7897} شروط قيامه: ذكر التعيين في صلب العقد، والمدة معلومة، وعدم زيادة المختار على ثلاثة، وأن يكون المختار واحدا، واقترانه بخيار الشرط في المشهور من الحنفية، ويجوز أن يكون للمشتري أو للبائع لا لهما معا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7897}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7898}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7898}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7899}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7899}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7900} أثره في العقد: يمنع ثبوت الملك على أحد الأشياء دون تعيين، وإذا هلك أحدها تعين الآخر أمانة، وإذا مضت المدة ولم يختر المالكية يلزمه النصف من كل منها، وتبعة الهلاك تفصيلها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7900}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7901}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7901} توقيته: يشترط في الأرجح عند الحنفية إن لم يتضمن خيار الشرط، وفائدته إجبار المختار على التعيين؛ ويسقط بما يسقط به خيار الشرط؛ وينتقل بالموت إلى الوارث ليعين محل الخيار، ويؤدي الثمن من التركة.{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7902}'
  en: 'Khiyar al-ta''yin (option of specification): lexically singling out from a group; for the Hanafis it is buying one of two or three things with the buyer to choose which he wants; technically the right of a party to specify one of the things on which the contract fell in common, within a set term. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7895} Also called option of distinction (khiyar al-tamyiz); the Malikis call the contract a sale of choice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7896} It differs from the option of stipulation, which attaches to one thing, while specification concerns an indefinite group, and from the choice a convert keeps among four wives; in price, selling at two times or two prices for the buyer to choose is forbidden unless the parties separate in the session with the choice made. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7896}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7897} Ruling: lawful for the Hanafis, Malikis and some Hanbalis; the Malikis call the contract binding, the option being only in the choice; the Shafiis and most Hanbalis reject it as hazard and forbidden in the report on thunya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7897} Conditions: the stipulation in the contract, a known term, no more than three things, one to be chosen, its attachment to the option of stipulation in the common Hanafi view; it may belong to the buyer or to the seller, not both. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7897}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7898}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7898}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7899}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7899}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7900} Effect: it prevents the transfer of ownership until a choice is made; if one perishes the other is entrusted; if the term passes without choice, the Malikis hold him liable for half each, and loss is treated in detail. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7900}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7901}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7901} Term: required by the preferred Hanafi view unless accompanied by the option of stipulation; ends by the same causes as the option of stipulation; passes at death to the heir who chooses, the price paid from the estate. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7902}'
  ur: 'خیار التعیین: لغت میں جماعت میں سے کسی کو خاص کرنا؛ حنفیہ کے نزدیک دو یا تین چیزوں میں سے ایک خریدنا جس میں خریدار اپنی پسند متعین کرے؛ اصطلاحاً عاقد کا وہ حق کہ جن چیزوں پر مشترک عقد ہوا ان میں سے ایک کو مقررہ مدت میں متعین کرے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7895} خیار التمییز بھی کہا جاتا ہے؛ مالکیہ اس عقد کو بیع الاختیار کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7896} خیارِ شرط سے مختلف، کیونکہ شرط ایک پر معلق ہوتی ہے اور تعیین غیر معین متعدد پر؛ اور اسلام لانے والے کا چار سے زائد بیویوں میں سے انتخاب بھی الگ ہے؛ قیمت میں دو مدتوں یا دو قیمتوں پر بیع جو خریدار چنے ممنوع، جب تک مجلس میں تعیین کر کے جدا نہ ہوں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7896}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7897} حکم: حنفیہ، مالکیہ اور بعض حنابلہ کے نزدیک جائز؛ مالکیہ بیع الاختیار کو لازم کہتے ہیں اور خیار صرف تعیین میں ہوتا ہے؛ شافعیہ اور جمہور حنابلہ اسے غرر اور ثنیا کی ممانعت کی بنا پر منع کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7897} شرائط: عقد کے اصل حصے میں تعیین کا ذکر، مدت معلوم، تین سے زیادہ چیزیں نہ ہوں، ایک کا چنا جانا، حنفیہ کے مشہور قول میں خیار شرط سے متصل ہونا؛ یہ خریدار یا بائع کا ہو سکتا ہے، دونوں کا نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7897}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7898}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7898}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7899}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7899}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7900} اثر: ملکیت کی منتقلی کو اس وقت تک روکتا ہے جب تک تعیین نہ ہو؛ ایک ہلاک ہو تو دوسرا امانت بن جاتا ہے؛ مدت گزر جائے اور انتخاب نہ ہو تو مالکیہ ہر ایک کا نصف لازم کرتے ہیں؛ ہلاکت کی ذمہ داری کی تفصیل۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7900}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7901}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7901} مدت: حنفیہ کے راجح قول کے مطابق مقرر ہونا ضروری اگر خیارِ شرط ساتھ نہ ہو؛ خیارِ شرط کے ختم ہونے کے اسباب سے ختم ہوتا ہے؛ موت پر وارث کو منتقل ہوتا ہے جو تعیین کرے گا، اور قیمت ترکے سے ادا ہوگی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7902}'
