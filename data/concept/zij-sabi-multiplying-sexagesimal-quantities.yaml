label: { ar: "ضرب الأعداد الستينية وأجناس حاصلها", en: "Multiplying sexagesimal quantities and the order of the product", ur: "ستینی مقداروں کا ضرب اور حاصل کی جنس", es: "Multiplicando cantidades sexagesimales y el orden del producto", fr: "Multiplier des quantités sexagésimales et l'ordre du produit" }
summary:
  ar: "يعرّف البتاني الضرب بأنه مضاعفة أحد العددين بقدر آحاد الآخر، ثم يبين أن حاصل ضرب الدرج في الدرج درج، وفي الدقائق دقائق، وفي الثواني ثوان، وأن ضرب كل جنس دون الدرج في نفسه ينحط بقدر انحطاطه عن الدرجة، فالدقائق في الدقائق ثوان وفي الثواني ثوالث. {cite:zij-sabi-nallino-byblion pp.12-13}."
  en: "Al-Battani defines multiplication as doubling one number as many times as the units of the other, and then shows that degrees times degrees give degrees, degrees times minutes minutes, degrees times seconds seconds, and that each order below the degree multiplied by itself falls as far below the degree as it sits, so minutes times minutes give seconds and minutes times seconds give thirds. {cite:zij-sabi-nallino-byblion pp.12-13}."
  ur: "البتانی ضرب کی تعریف یوں کرتے ہیں کہ ایک عدد کو دوسرے کی اکائیوں کے برابر مضاعف کیا جائے، پھر بتاتے ہیں کہ درجے کو درجے سے ضرب دیں تو درجے، دقائق سے دقائق اور ثوانی سے ثوانی حاصل ہوتے ہیں، اور درجے سے نیچے کی ہر جنس کو اپنے آپ سے ضرب دیں تو حاصل اتنا ہی نیچے آتا ہے جتنی وہ خود درجے سے نیچی ہے، چنانچہ دقائق ضرب دقائق ثوانی اور دقائق ضرب ثوانی ثوالث ہیں۔ {cite:zij-sabi-nallino-byblion pp.12-13}۔"
  es: "Al-Battani define la multiplicación como duplicar un número tantas veces como unidades tenga el otro, y luego demuestra que grados por grados dan grados, grados por minutos minutos, grados por segundos segundos, y que cada orden inferior al grado multiplicado por sí mismo cae tan abajo como el grado en el que se encuentra, de modo que minutos por minutos dan segundos y minutos por segundos dan tercios. {cite:zij-sabi-nallino-byblion pp.12-13}."
  fr: "Al-Battani définit la multiplication comme le fait de doubler un nombre autant de fois que l'unité de l'autre, puis montre que degrés multipliés par degrés donnent des degrés, degrés multipliés par minutes donnent des minutes, degrés multipliés par secondes donnent des secondes, et que chaque ordre inférieur au degré multiplié par lui-même est inférieur au degré auquel il se situe, de sorte que minutes multipliées par minutes donnent des secondes et minutes multipliées par secondes donnent des tiers. {cite:zij-sabi-nallino-byblion pp.12-13}."
