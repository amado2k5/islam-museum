label: { ar: "عمل أهل قرطبة" }
kind: legal
summary:
  ar: "كان عمل قرطبة حجة بالمغرب لعظم أمرها حتى قالوا في الأحكام هذا مما جرى به عمل قرطبة؛ ومن ذلك اشتراط الإمام على القاضي الحكم بمذهب معين ففي صحته ثلاثة أقوال نقلها ابن عرفة: الصحة للباجي ولعمل أهل قرطبة ولظاهر شرط سحنون، والبطلان للطرطوشي الذي قال في شرط أهل قرطبة هذا جهل عظيم، وصحة التولية وبطلان الشرط للمازري؛ وعلى هذا الشرط ترتب إيجاب عمل القضاة بالأندلس ثم انتقل إلى المغرب، وقال قاضي القضاة بفاس أبو عبد الله المقري جد المؤلف معقباً يا لله وللمسلمين ذهبت قرطبة وأهلها ولم يبرح من الناس جهلها {cite:nafh-tib-maqqari p. 592-593}."
  en: "Cordoban ʿamal as proof: so great was the city that Maghrebi law cited 'the practice of Cordoba', including the ruler's power to bind a qadi to one madhhab — valid per al-Baji, Cordoban practice and Sahnun's condition; void per al-Turtushi ('a great ignorance'); or the appointment valid and the condition void per al-Mazari. The custom then passed to the Maghreb, where the author's grandfather, qadi al-qudat of Fes, mourned: 'Cordoba is gone with its people, yet its people's ignorance has not departed' {cite:nafh-tib-maqqari p. 592-593}."
