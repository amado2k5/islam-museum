id: concept/amal-ahl-qurtuba
class: concept
label: { ar: "عمل أهل قرطبة", en: "The practice of the people of Cordoba", fr: "La pratique des gens de Cordoue", es: "La práctica de la gente de Córdoba", ur: "قرطبہ کے لوگوں کا عمل", tr: "Córdoba halkının çalışmaları", id: "Córdoba halkının çalışmaları" }
kind: legal
summary:
  ar: "كان عمل قرطبة حجة بالمغرب لعظم أمرها حتى قالوا في الأحكام هذا مما جرى به عمل قرطبة؛ ومن ذلك اشتراط الإمام على القاضي الحكم بمذهب معين ففي صحته ثلاثة أقوال نقلها ابن عرفة: الصحة للباجي ولعمل أهل قرطبة ولظاهر شرط سحنون، والبطلان للطرطوشي الذي قال في شرط أهل قرطبة هذا جهل عظيم، وصحة التولية وبطلان الشرط للمازري؛ وعلى هذا الشرط ترتب إيجاب عمل القضاة بالأندلس ثم انتقل إلى المغرب، وقال قاضي القضاة بفاس أبو عبد الله المقري جد المؤلف معقباً يا لله وللمسلمين ذهبت قرطبة وأهلها ولم يبرح من الناس جهلها {cite:nafh-tib-maqqari p. 592-593}."
  en: "Cordoban ʿamal as proof: so great was the city that Maghrebi law cited 'the practice of Cordoba', including the ruler's power to bind a qadi to one madhhab — valid per al-Baji, Cordoban practice and Sahnun's condition; void per al-Turtushi ('a great ignorance'); or the appointment valid and the condition void per al-Mazari. The custom then passed to the Maghreb, where the author's grandfather, qadi al-qudat of Fes, mourned: 'Cordoba is gone with its people, yet its people's ignorance has not departed' {cite:nafh-tib-maqqari p. 592-593}."
  fr: "Le ʿamal cordouan servait de preuve : le prestige de la ville était tel que le droit maghrébin invoquait la « pratique de Cordoue », notamment quant au pouvoir du souverain de contraindre un cadi à suivre un seul madhhab. La clause était valable selon al-Baji, la pratique cordouane et la condition de Sahnun ; nulle selon al-Turtushi, qui y voyait « une grande ignorance » ; ou encore la nomination était valable mais la clause nulle, selon al-Mazari. L’usage passa ensuite au Maghreb, où le grand-père de l’auteur, grand cadi de Fès, déplora que Cordoue ait disparu avec ses habitants, mais non leur ignorance {cite:nafh-tib-maqqari p. 592-593}."
  es: "El amal cordobés como prueba: tan grande era la ciudad que la ley magrebí citaba «la práctica de Córdoba», incluyendo el poder del gobernante para vincular a un cadí a una madhhab —válido según al-Baji, la práctica cordobesa y la condición de Sahnun; nulo según al-Turtushi («una gran ignorancia»); o el nombramiento válido y la condición nula según al-Mazari. La costumbre pasó luego al Magreb, donde el abuelo del autor, cadí al-qudat de Fez, lamentó: «Córdoba se ha ido con su gente, pero la ignorancia de su gente no se ha ido» {cite:nafh-tib-maqqari p. 592-593}."
  ur: "قرطبن امل ثبوت کے طور پر: شہر اتنا عظیم تھا کہ مغربی قانون نے 'قرطبہ کے رواج' کا حوالہ دیا، جس میں حاکم کا اختیار بھی شامل ہے کہ وہ ایک قضا کو ایک ہی مذہب سے منسلک کر سکتا ہے - صحیح فی الباجی، قرطبن کا عمل اور سہنون کی شرط؛ باطل فی الترتوشی ⁦('ایک عظیم جہالت')⁩؛ یا تقرری درست اور شرط باطل فی المزاری پھر یہ رواج مغرب تک پہنچا جہاں مصنف کے دادا قاضی القدات نے ماتم کیا: 'قرطبہ اپنے لوگوں کے ساتھ چلا گیا، لیکن اس کے لوگوں کی جہالت دور نہیں ہوئی'۔ 592-593}۔"
  tr: "Kordoba eylemi, Mağrip'te büyük önemi nedeniyle bir kanıttı; çünkü hükümlerde Kordoba eyleminin de böyle olduğu belirtilmiştir; örneğin, İmam hakimin İbn Arafa'nın aktardığı üç görüşe dayanan belirli bir okula göre karar vermesini istemiştir: El-Beci'nin geçerliliği ve Kordoba halkının uygulaması; Sahnun'un görünür durumu; Kordoba halkının durumu hakkında söylediği Al-Turtushi'nin geçersizliği—büyük cehalet; valiliğin geçerliliği; ve el-Mazari'ye göre bu şartın geçersizliği; bu koşul temelinde Endülüs'te yargıçlık görevi zorunluluğu kuruldu, ardından Fas'a taşındı. Fez'deki baş yargıç Ebu Abdullah el-Maqri, yazarın dedesi, şöyle yorum yaptı: 'Ey Tanrım, Müslümanlar için Çorduba ve halkı gitti, hiçbir halk cehaletini bırakmadı.' nafh-tib-maqqari s. 592-593}."
  id: "Kordoba eylemi, Mağrip'te büyük önemi nedeniyle bir kanıttı; çünkü hükümlerde Kordoba eyleminin de böyle olduğu belirtilmiştir; örneğin, İmam hakimin İbn Arafa'nın aktardığı üç görüşe dayanan belirli bir okula göre karar vermesini istemiştir: El-Beci'nin geçerliliği ve Kordoba halkının uygulaması; Sahnun'un görünür durumu; Kordoba halkının durumu hakkında söylediği Al-Turtushi'nin geçersizliği—büyük cehalet; valiliğin geçerliliği; ve el-Mazari'ye göre bu şartın geçersizliği; bu koşul temelinde Endülüs'te yargıçlık görevi zorunluluğu kuruldu, ardından Fas'a taşındı. Fez'deki baş yargıç Ebu Abdullah el-Maqri, yazarın dedesi, şöyle yorum yaptı: 'Ey Tanrım, Müslümanlar için Çorduba ve halkı gitti, hiçbir halk cehaletini bırakmadı.' nafh-tib-maqqari s. 592-593}."
