id: concept/rabi-a-fiqh
class: concept
kind: legal
label:
  ar: "الربيئة"
  en: "Rabi'a (the sentinel posted on a height to watch the enemy): his share in jihad, retaliation and banditry"
  ur: "ربیئہ (پہرے دار)"
summary:
  ar: "الربيئة في اللغة طليعة القوم التي ترقب العدو من مكان عال لئلا يدهم قومه، وهي في الاصطلاح كذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8614} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8615} وهي تُفرّق عن الجاسوس والمرابط والحارس والرصدي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8615} والربيئة في الجهاد من القوم ويُسهم له من الغنيمة كالمقاتلين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8615} وفي القصاص يذهب الجمهور إلى أنه لا يُقتص منه إذا لم يباشر القتل، وقال المالكية يُقتص منه إذا تمالأ معهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8615} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8616} وفي قطع الطريق حكمه حكم المباشر عند المالكية والحنفية والحنابلة، وقال الشافعية لا يجب الحد على من أعان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8616}"
  en: "A rabi'a is the lookout of a people, posted on a height to watch the enemy so the people are not surprised. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8614} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8615} He is distinguished from the spy, the garrisoned fighter, the guard and the ambusher on the road. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8615} In jihad he is one of the people and has a share of the booty like the fighters. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8615} In retaliation for killing most jurists do not punish him if he did not do the killing, while the Malikis do if he colluded. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8615} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8616} In banditry he is treated as a direct perpetrator by the Malikis, Hanafis and Hanbalis, while the Shafi'is hold no hadd penalty on one who only helped. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8616}"
  ur: "ربیئہ دشمن پر نظر رکھنے کے لیے بلندی پر کھڑا پہرے دار ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8614} جہاد میں وہ لشکر کا حصہ ہے اور غنیمت میں اس کا حصہ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8615}"
