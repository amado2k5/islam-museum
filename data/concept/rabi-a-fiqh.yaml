id: concept/rabi-a-fiqh
class: concept
kind: legal
label:
  ar: "الربيئة"
  en: "Rabi'a (the sentinel posted on a height to watch the enemy): his share in jihad, retaliation and banditry"
  ur: "ربیئہ ⁦(پہرے دار)⁩"
  es: "Rabi'a (el centinela apostado en una altura para vigilar al enemigo): su participación en la yihad, la represalia y el bandidaje."
  fr: "Rabi'a (le sentinelle postée en hauteur pour surveiller l'ennemi): son rôle dans le djihad, les représailles et le banditisme"
  tr: "El-Rabiya"
  id: "Al-Rabiya"
summary:
  ar: "الربيئة في اللغة طليعة القوم التي ترقب العدو من مكان عال لئلا يدهم قومه، وهي في الاصطلاح كذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8614} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8615} وهي تُفرّق عن الجاسوس والمرابط والحارس والرصدي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8615} والربيئة في الجهاد من القوم ويُسهم له من الغنيمة كالمقاتلين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8615} وفي القصاص يذهب الجمهور إلى أنه لا يُقتص منه إذا لم يباشر القتل، وقال المالكية يُقتص منه إذا تمالأ معهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8615} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8616} وفي قطع الطريق حكمه حكم المباشر عند المالكية والحنفية والحنابلة، وقال الشافعية لا يجب الحد على من أعان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8616}"
  en: "A rabi'a is the lookout of a people, posted on a height to watch the enemy so the people are not surprised. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8614} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8615} He is distinguished from the spy, the garrisoned fighter, the guard and the ambusher on the road. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8615} In jihad he is one of the people and has a share of the booty like the fighters. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8615} In retaliation for killing most jurists do not punish him if he did not do the killing, while the Malikis do if he colluded. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8615} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8616} In banditry he is treated as a direct perpetrator by the Malikis, Hanafis and Hanbalis, while the Shafi'is hold no hadd penalty on one who only helped. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8616}"
  ur: "ربیئہ دشمن پر نظر رکھنے کے لیے بلندی پر کھڑا پہرے دار ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8614} جہاد میں وہ لشکر کا حصہ ہے اور غنیمت میں اس کا حصہ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8615}"
  es: "Un rabi'a es el vigía de un pueblo, apostado en una altura para vigilar al enemigo para que el pueblo no sea sorprendido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8614} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8615} Se distingue del espía, el combatiente acuartelado, el guardia y el emboscador en el camino. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8615} En la yihad es uno del pueblo y tiene una parte del botín como los combatientes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8615} En represalia por matar, la mayoría de los juristas no lo castigan si no cometió el asesinato, mientras que los malikíes sí lo hacen si colaboró. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8615} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8616} En el bandidaje, los Malikis, Hanafis y Hanbalis lo tratan como un perpetrador directo, mientras que los Shafi'is no imponen ninguna pena hadd a quien solo ayuda. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8616}"
  fr: "Le rabi'a est le guetteur d'un peuple, posté en hauteur pour surveiller l'ennemi et éviter les surprises. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8614} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8615} Il se distingue de l'espion, du combattant en garnison, du garde et du troll tendu sur la route. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8615} Lors du jihad, il est considéré comme un membre du peuple et partage le butin au même titre que les combattants. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8615} En cas de représailles pour un meurtre, la plupart des juristes ne le punissent pas s'il n'a pas commis le meurtre, tandis que les malikites le punissent s'il a été complice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8615} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8616} Dans le banditisme, il est traité comme un auteur direct par les Malikis, Hanafis et Hanbalis, tandis que les Shafi'is n'imposent aucune pénalité au hadd à celui qui a seulement aidé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8616}"
  tr: "Dilbilimde 'rabiyya', düşmanı yüksek bir yerden izleyen bir halkın öncüsü anlamına gelir ve böylece halkı onlara ulaşmasın ve terminolojide de kullanılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8614} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8615} Casus, kararlı, muhafız ve gözlemciden ayrılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8615} ve cihaddaki 'rabiyyah' halktan gelir ve savaş ganimetlerini savaşçılar gibi ona verir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8615} Misilleme olarak, çoğunluk onun öldürmezse misilleme edilmediğini savunurken, Malikiler ise komplo kurarsa intikam alındığını söyler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8615} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8616} Yolun kapatılmasıyla ilgili karar, Malikiler, Hanefiler ve Hanbalilere göre doğrudan ceza ile aynıdır. Şafi'ler, yardım edenlere cezanın zorunlu olmadığını söyler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8616}"
  id: "Dalam linguistik, 'rabiyya' berarti barisan depan dari suatu bangsa yang mengawasi musuh dari tempat tinggi agar rakyatnya tidak menjangkau, dan dalam istilah ini juga digunakan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8614} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8615} Ia dibedakan dari mata-mata, yang teguh, penjaga, dan pengamat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8615} dan 'rabiyyah' dalam jihad berasal dari rakyat, dan dia menyumbangkan rampasan perang kepadanya seperti pejuang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8615} Sebagai pembalasan, mayoritas berpendapat bahwa ia tidak akan dibales jika tidak melakukan pembunuhan, sementara Malikis mengatakan ia akan dibales jika bersekongkol dengan mereka. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8615} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8616} Putusan tentang pemblokiran jalan sama dengan hukuman langsung menurut Maliki, Hanafi, dan Hanbali. Para Shafi'i mengatakan bahwa hukuman tidak wajib bagi mereka yang membantu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8616}"
