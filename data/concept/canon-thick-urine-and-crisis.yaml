label: { ar: "البول الغليظ والبحران وانفجار الأورام عند ابن سينا", en: "Thick urine, crisis and the bursting of swellings in the Canon", ur: "گاڑھا پیشاب، بحران اور ورموں کا پھٹنا قانون میں", es: "Orina espesa, crisis y estallido de hinchazones en el cañón", fr: "Urine épaisse, crise et rupture des gonflements dans le Canon" }
summary:
  ar: "يذكر ابن سينا أن البول الغليظ قد يكون بحراناً حميداً إذا انفجر دفعة بسهولة، ويفرق ما ينفجر من الأورام بالمدة والرائحة المنتنة والصفائح الخارجة معه وبما تقدمه من علامات {cite:canon-ibn-sina-print-v1 p.191}."
  en: "Ibn Sina says thick urine can be a favourable crisis when it bursts out at once with ease, and tells the bursting of swellings by the pus, the stinking smell, the flakes passed with it and the signs that went before {cite:canon-ibn-sina-print-v1 p.191}."
  es: "Ibn Sina dice que la orina espesa puede ser una crisis favorable cuando brota de inmediato con facilidad, y describe el estallido de hinchazones por el pus, el olor fétido, las escamas que se expulsan con ella y los signos que la precedieron {cite:canon-ibn-sina-print-v1 p.191}."
  fr: "Ibn Sina dit que l'urine épaisse peut être une crise favorable lorsqu'elle éclate d'un coup avec facilité, et décrit l'éclatement des gonflements par le pus, l'odeur nauséabonde, les flocons évacués avec elle et les signes qui l'ont précédée {cite:canon-ibn-sina-print-v1 p.191}."
  ur: "ابن سینا کا کہنا ہے کہ گاڑھا پیشاب ایک سازگار بحران ہو سکتا ہے جب یہ آسانی کے ساتھ فوراً پھٹ جائے، اور پیپ سے سوجن کے پھٹنے، بدبودار بو، اس کے ساتھ گزرنے والے فلیکس اور اس سے پہلے کے نشانات کو بتاتا ہے۔"
