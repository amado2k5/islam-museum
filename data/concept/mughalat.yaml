id: concept/mughalat
class: concept
kind: legal
label:
  ar: المُغَالاة
  en: Excess (mughalat) in dowry, shroud and worship
  ur: مغالاة (حد سے تجاوز)
summary:
  ar: "المغالاة في اللغة المبالغة في الشيء ومجاوزة الحد فيه، وهي في الاصطلاح لا تخرج عن ذلك، وضدها الرُّخص. وتتعلق بها أحكام في المهر، فليس للمهر حد أعلى عند جمهور الفقهاء، ويُستحب تخفيفه، وكره المالكية أن يتجاوز عادة أمثاله. وفي الكفن تُكره المغالاة لحديث النهي عنها، والمراد بها الزيادة على كفن المثل، ويُستحب تحسينه بالبياض والنظافة لا بالثمن. وفي العبادة يُطلب الاقتصاد وعدم الغلو في الدين، والأفضل العمل اليسير المستمر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14800} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14801} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14802} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14803}"
  en: "Mughalat means exaggeration: going beyond the proper measure in a thing. The jurists keep the technical sense close to the lexical one, and its opposite is cheapness. In dowry there is no fixed upper limit; the Malikis disliked a dowry that exceeds the usual amount for such a woman, and most jurists recommend a light dowry. For the shroud, exaggeration is disliked because of the hadith forbidding it; the term means more than the customary shroud, while good shroud is judged by whiteness and cleanliness rather than price. In worship the believer is to be moderate and avoid excess in religion; the lasting small act is preferred. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14800} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14801} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14802} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14803}"
  ur: "مغالاۃ کے لغوی معنی کسی چیز میں مبالغہ اور حد سے تجاوز ہیں۔ مہر میں جمہور کے نزدیک کوئی اعلیٰ حد مقرر نہیں، اور ہلکا مہر مستحب ہے۔ کفن میں زیادہ خرچ مکروہ ہے، اور عبادت میں اعتدال اور دین میں غلو سے بچنا مطلوب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14800} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14801} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14803}"
