id: concept/mughalat
class: concept
kind: legal
label:
  ar: المُغَالاة
  en: Excess (mughalat) in dowry, shroud and worship
  ur: مغالاة ⁦(حد سے تجاوز)⁩
  es: "Exceso (mughalat) en la dote, el sudario y el culto"
  fr: "Excès (mughalat) dans la dot, le linceul et le culte"
  tr: "abartı"
  id: "melebih-lebihkan"
summary:
  ar: "المغالاة في اللغة المبالغة في الشيء ومجاوزة الحد فيه، وهي في الاصطلاح لا تخرج عن ذلك، وضدها الرُّخص. وتتعلق بها أحكام في المهر، فليس للمهر حد أعلى عند جمهور الفقهاء، ويُستحب تخفيفه، وكره المالكية أن يتجاوز عادة أمثاله. وفي الكفن تُكره المغالاة لحديث النهي عنها، والمراد بها الزيادة على كفن المثل، ويُستحب تحسينه بالبياض والنظافة لا بالثمن. وفي العبادة يُطلب الاقتصاد وعدم الغلو في الدين، والأفضل العمل اليسير المستمر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14800} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14801} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14802} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14803}"
  en: "Mughalat means exaggeration: going beyond the proper measure in a thing. The jurists keep the technical sense close to the lexical one, and its opposite is cheapness. In dowry there is no fixed upper limit; the Malikis disliked a dowry that exceeds the usual amount for such a woman, and most jurists recommend a light dowry. For the shroud, exaggeration is disliked because of the hadith forbidding it; the term means more than the customary shroud, while good shroud is judged by whiteness and cleanliness rather than price. In worship the believer is to be moderate and avoid excess in religion; the lasting small act is preferred. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14800} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14801} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14802} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14803}"
  ur: "مغالاۃ کے لغوی معنی کسی چیز میں مبالغہ اور حد سے تجاوز ہیں۔ مہر میں جمہور کے نزدیک کوئی اعلیٰ حد مقرر نہیں، اور ہلکا مہر مستحب ہے۔ کفن میں زیادہ خرچ مکروہ ہے، اور عبادت میں اعتدال اور دین میں غلو سے بچنا مطلوب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14800} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14801} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14803}"
  es: "Mughalat significa exageración: ir más allá de la medida adecuada en algo. Los juristas mantienen el sentido técnico cercano al léxico, y su opuesto es la tacañería. En la dote no hay un límite máximo fijo; los malikíes desaprobaban una dote que excediera la cantidad habitual para una mujer de esa condición, y la mayoría de los juristas recomiendan una dote modesta. En cuanto al sudario, la exageración es desaconsejable debido al hadiz que la prohíbe; el término significa más que el sudario habitual, mientras que un buen sudario se juzga por su blancura y limpieza, más que por su precio. En el culto, el creyente debe ser moderado y evitar los excesos en la religión; se prefiere el pequeño acto perdurable. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14800} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14801} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14802} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.14803}"
  fr: "Mughalat signifie exagération: dépasser la mesure appropriée. Les juristes conservent une acception technique proche du sens lexical, et son contraire est la mesquinerie. En matière de dot, il n'existe pas de limite supérieure fixe; les Malikites désapprouvaient une dot excédant le montant habituel pour une telle femme, et la plupart des juristes recommandent une dot modeste. Concernant le linceul, l'exagération est désapprouvée en raison du hadith qui l'interdit; le terme désigne un linceul plus imposant que le linceul traditionnel, tandis qu'un bon linceul est jugé selon sa blancheur et sa propreté plutôt que par son prix. Dans le culte, le croyant doit faire preuve de modération et éviter les excès; les petits actes durables sont préférables. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14800} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14801} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14802} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14803}"
  tr: "Dilde abartı, bir şeyi abartmak ve sınırı aşmak anlamına gelir; terminolojide bu sınırın ötesine geçmez, karşıtı ise hoşgörülüktür. Çeyizle ilgili kurallar buna bağlıdır; çoğu hukukçuya göre çeyiz için üst sınır yoktur ve azaltılması önerilir. Malikiler, benzer eşyaların geleneğini aşmaktan hoşlanmazlar. Kefen örtüsünde, hadislerin yasakladığı için aşırı sevilmez, yani eşdeğer kefenden daha fazlasıdır. Fiyatla değil, beyazlık ve temizlikle güzelleştirilmesi önerilir. İbadette, tasarruf aranır ve aşırı dindarlıktan kaçınılır; en iyisi basit ve sürekli bir eylem yapmaktır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.14800} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.14801} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.14802} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.14803}"
  id: "Melebih-lebihkan dalam bahasa berarti melebih-lebihkan sesuatu dan melampaui batas, yang dalam istilah tidak melampaui batas itu, dan sebaliknya adalah kelonggaran. Aturan yang berkaitan dengan mas kawin terkait dengannya; menurut mayoritas ahli hukum, tidak ada batas atas untuk mas kawin, dan disarankan untuk menguranginya. Orang Malik tidak suka melampaui kebiasaan barang serupa. Dalam kasus kain kabin, berlebihan tidak disukai karena hadits melarangnya, artinya lebih dari kain kafan yang setara. Disarankan untuk memperindahnya dengan keputihan dan kebersihan, bukan dengan harga. Dalam ibadah, seseorang mencari penghematan dan menghindari religiusitas berlebihan, dan yang terbaik adalah melakukan tindakan sederhana dan berkelanjutan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.14800} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.14801} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14802} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14803}"
