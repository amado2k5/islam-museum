  "ar": "يجب أن تمنع المادة المتجهة إلى الورم وتمال عنه بالاستفراغ وما يجلب إلى الخلاف\
    \ ويقرأ ما وصفناه في الباب الذي قبل هذا، فنقول إن علاجه الفصد إن كان الدم غالباً\
    \ على الجهة المذكورة في الباب الذي قبله ويخرج حتى يتغير لونه فإنه يدل على أن المؤذي\
    \ من الدم قد استفرغ، واعلم أن أشد دم البدن سواداً ما كان قريباً من مثل هذا الورم\
    \ على أن مراعاة القوة في ذلك واجبة فربما لم ترخص القوة في إخراج الدم إلى هذا الحد،\
    \ وإن كان خلط آخر استفرغ لا بمثل ما فيه قبض بل بما فيه مع الإسهال تليين من هذا\
    \ الجنس ويسهلون ليلاً. وقد قال قوم من أهل المعرفة إن الأصوب ما أمكن أن يستفرغوا\
    \ بالفصد خوفاً من الاضطراب الذي ربما أوقعه المسهل وخصوصاً إذا كان النفث مرارياً\
    \ جداً، وعلى أنه يجب أن يراعي جهة ميل الوجع والألم فإن كان الميل صاعداً إلى الترقوة\
    \ والقس وما فوقهما فالفصد أولى وإن كان الألم يميل إلى جهة الشراسيف فلا بد من إسهال\
    \ وحده أو مع الفصد بحسب ما توجبه المشاهدة وذلك لأن الفصد وحده من الباسليق لا يجذب\
    \ من هذا الموضع شيئاً يعتد به، ومما يدلك على شدة الحاجة إلى الاستفراغ أن يجد التضميد\
    \ والتكميد لا يسكنان الوجع أو يجدهما يزيدانه فيدل ذلك على الامتلاء في البدن كله\
    \ ولا بد من الاستفراغ، وإن استفرغت ولم تسكن الأعراض فاعلم إنما نطلبه من منع الجمع\
    \ فلا تعاود الفصد لئلا تتبلد المادة التي هي داء مجتمع وذلك مما لا ينضج مع نقصان\
    \ القوة وفقدان إنضاج الدموية بالمادة، فإذا نضجت فيجب أن يمتنع مصير مدة ويجتهد\
    \ بأن ينقى قبله بالنفث، وبالجملة إذا لم يفصد ونضج ونفث نفثاً نضيجاً ونفثاً صالحاً\
    \ ثم رأيت ضعفاً في القوة فلا تفصد البتة، وإن حال ضعف القوة دون الفصد والإسهال\
    \ فلا بد من استعمال الحقن المتوسطة أو الحادة بحسب ما توجبه المشاهدة وخصوصاً إذا\
    \ كان الوجع مائلاً إلى الشراسيف. وإذا استفرغت ووجدت الألم أخف اقتصرت على ماء السكر\
    \ وماء الشعير المطبوخ شعيره المقشر في ماء كثير طبخاً شديداً وعلى الأشربة من هذا\
    \ الجنس عند الحاجة إلى تقوية، فإنها إن كانت هادئة سهلة خفيفة غذوت بماء الشعير\
    \ المقشر المطبوخ جيداً فإنه منفث مقطع مقوٍ وإن أردت أن تحليه حليت بسكر أو بعسل\
    \ فإن كانت مضطربة اقتصرت على ماء الشعير حتى تستبرئ الحال وخصوصاً بحسب النفث فإنه\
    \ إذا كثر أمنت كثرة المادة وعرفت الحاجة إلى القوة فغذوت بماء الشعير المقشر وقويت\
    \ وإن احتبس لطفت التدبير واقتصرت على ماء الشعير وعلى الأشربة ما أمكن، وإذا حدث\
    \ في ذات الجنب الاقتصار على سويق الشعير، وإن دعت إلى الفصد ضرورة في أصناف ذات\
    \ الجنب ولم يكن نضج فالصواب أن تقتصر على قدر ثلثي وزنه وتستعد للتثنية بالملح والزيت\
    \ على الجراحة، وكثيراً ما يغني استطلاق البطن كل يوم مجلساً أو مجلسين عن الفصد،\
    \ ومن أعقبه الفصد غثياً أو شدة عسر وضيق التنفس فذلك يدل على أن الفصد لم يستفرغ\
    \ مادة الورم. والأولى أن لا يلين الطبيعة في علاج أوجاع الصدر في الابتداء إلا بما\
    \ يخف من حقن وشيافات، ومن الخطر العظيم سقي المبردات الشديدة إلا في الكائن من الصفراء\
    \ أو سقي المبردات القابضة أو إطعامها، واعلم أن سقي الماء البارد غير موافق لهذه\
    \ العلة وجميع الأورام الباطنة فأقلل ما أمكنك فإن عصي العطش فامزجه بالسكنجبين لتنكسر\
    \ سورة الماء وليقل بقاؤه وثباته بل يبذرق وينفذ في البدن ولينتفع بتقطيع السكنجبين\
    \ وتلطيفه، واعلم أن ذات الجنب يوافقها الترطيب من أشربة هذا الجنس وأما ما يجتنب\
    \ فكل ما فيه تبريد وتكثيف، ويجب أن يكون معظم غرضك التنفيث بسهولة {cite:canon-ibn-sina-print-v2\
    \ p.360}"
  "en": "The matter heading to the tumour must be prevented and drawn off by evacuation\
    \ and what brings it to the contrary — and what we described in the chapter before\
    \ this is to be read. We say: its treatment is venesection, if blood predominates,\
    \ on the side named in the foregoing chapter; and the letting goes on till its\
    \ colour changes, which shows that what was harmful of the blood has been evacuated\
    \ — know that the blackest of the body's blood is what is near such a tumour —\
    \ though watching the power in this is obligatory, for the power may not permit\
    \ the blood's removal to that point. If another humour predominates, it is evacuated\
    \ not by the astringent kind but by what carries looseness with the purging, of\
    \ this kind, and they are purged at night. Some of the people of knowledge have\
    \ said the sounder course is to evacuate by venesection wherever possible, for\
    \ fear of the disturbance a purgative may cause — especially if the expectoration\
    \ is very bilious. Yet the direction in which the pain and the ache incline must\
    \ be watched: if the inclination climbs toward the clavicle and the upper chest\
    \ and what is above them, venesection is preferable; if the pain inclines toward\
    \ the hypochondria, purging alone is indispensable, or with the venesection as\
    \ observation dictates — for venesection alone from the basilic draws nothing\
    \ worth counting from that site. What teaches you the severity of the need to\
    \ evacuate is his finding that poulticing and compresses neither quiet the pain\
    \ or else increase it — this points to the body's whole fullness — and evacuation\
    \ is indispensable. If you evacuate and the symptoms are not quieted, know that\
    \ what we then seek is the prevention of the gathering: do not repeat the venesection,\
    \ lest the gathered matter be stupefied — and that does not ripen with the failing\
    \ of the power and the loss of the blood's maturing of the matter. Once it has\
    \ ripened it must be kept from becoming pus, and every effort made to cleanse\
    \ it first by expectoration. In sum: if he was not bled, and ripened and expectorated\
    \ a ripe and sound expectoration, and then you see a weakness of the power — do\
    \ not bleed at all. If the power's weakness stands in the way of venesection and\
    \ purging, the middling or sharp clysters must be used as observation dictates,\
    \ especially if the pain inclines to the hypochondria. When you have evacuated\
    \ and find the pain lighter, confine yourself to sugar-water and a barley water\
    \ in which hulled barley is well cooked in much water, and to drinks of this kind\
    \ when strengthening is needed. If the disease is calm, easy and light, feed with\
    \ a well-cooked hulled-barley water, for it promotes expectoration, cuts and strengthens\
    \ — if you wish to sweeten it, sweeten with sugar or honey; if it is turbulent,\
    \ keep to barley water till the state is verified, and go especially by the expectoration:\
    \ if it abounds you are safe from the matter's abundance and know the need of\
    \ the power, so feed with hulled-barley water and strengthen; if it is retained,\
    \ lighten the regimen and keep to barley water and the drinks as far as possible.\
    \ If abstinence to barley gruel occurs in pleurisy, and a necessity for venesection\
    \ calls in a kind of pleurisy with no ripeness, the right course is to keep to\
    \ about two-thirds of its amount and prepare to repeat it, with salt and oil on\
    \ the wound; and loosening the belly a session or two every day often dispenses\
    \ with the venesection. Whoever the venesection leaves with nausea or a severe\
    \ hardness and shortness of breath — that shows the venesection did not evacuate\
    \ the tumour's matter. It is preferable not to loosen the nature at the beginning\
    \ of treating chest pains except with the light kind of clysters and suppositories;\
    \ and of the great dangers is giving the strongly cooling drinks, except in what\
    \ arises from bile, or giving the astringent cold things or feeding them; know\
    \ that giving cold water does not suit this disease nor any of the inward tumours\
    \ — lessen it as far as you can, and if thirst resists, mix it with oxymel so\
    \ the water's force is broken and its stay and settling lessened, rather it is\
    \ scattered and driven into the body, and benefit is taken from the oxymel's cutting\
    \ and thinning. Know that pleurisy agrees with the moistening drinks of this kind,\
    \ and what is shunned is all that carries cooling and thickening. And the chief\
    \ of your aims must be making expectoration easy {cite:canon-ibn-sina-print-v2\
    \ p.360}"
  "ur": "ورم کی طرف بڑھتا مادہ روکنا چاہیے اور اسے تخلیہ اور خلاف جانب لانے والی چیز\
    \ سے دور رکھنا چاہیے اور جو اس سے پہلے کے باب میں بیان کیا وہ پڑھا جائے۔ ہم کہتے\
    \ ہیں اس کا علاج فصد ہے اگر خون غالب ہو مذکورہ باب والی جانب سے اور خون نکالتے\
    \ رہو یہاں تک کہ اس کا رنگ بدل جائے جو اس کی دلیل ہے کہ نقصان دہ خون خارج ہو گیا\
    \ اور جان لو کہ بدن کا سب سے سیاہ خون وہ ہے جو ایسے ورم کے قریب ہو مگر قوت کی\
    \ رعایت واجب ہے کہ شاید قوت اتنا خون نکالنے کی اجازت نہ دے اور اگر کوئی اور خلط\
    \ غالب ہو تو قبض والی چیز سے نہیں بلکہ اسی جنس کی ایسی چیز سے استفراغ کیا جائے\
    \ جس میں دست کے ساتھ نرمی ہو اور وہ رات کو دست دیے جائیں۔ اور اہل معرفت میں سے\
    \ بعض نے کہا کہ درست یہ ہے کہ جہاں ممکن ہو فصد سے استفراغ کیا جائے اس خوف سے کہ\
    \ دست پریشانی ڈالے خاص طور پر جب نفث بہت مراری ہو۔ مگر درد اور تکلیف کے میلان\
    \ کی طرف کی رعایت کرنی چاہیے اگر میلان ترقوة اور اوپر کے سینے اور اس سے اوپر کی\
    \ طرف ہو تو فصد بہتر ہے اور اگر درد شراسيف کی طرف جھکے تو صرف دست ناگزیر ہے یا\
    \ فصد کے ساتھ جیسا مشاہدہ حکم دے کیونکہ باسليق سے اکیلا فصد اس مقام سے کوئی قابل\
    \ شمار چیز نہیں کھینچتا۔ اور استفراغ کی شدید ضرورت کی دلیل یہ ہے کہ ضماد اور کماد\
    \ درد نہ بجھائیں بلکہ بڑھائیں تو یہ پورے بدن کے امتلاء کی دلیل ہے اور استفراغ\
    \ ناگزیر ہے اور اگر استفراغ کیا اور اعراض نہ بجھے تو جان لو کہ ہم جمع ہونے کی\
    \ روک چاہتے ہیں تو فصد نہ دہراؤ کہ وہ مادہ سن ہو جائے جو جمع ہوا داء ہے اور وہ\
    \ قوت کے گھٹنے اور خون کے مادہ پکانے کے ختم ہونے سے نہیں پکتا۔ جب پک جائے تو مادہ\
    \ بننے سے روکنا چاہیے اور پہلے نفث سے صاف کرنے کی کوشش کرنی چاہیے۔ خلاصہ اگر فصد\
    \ نہ کیا گیا ہو اور وہ پک کر پکا اور اچھا نفث کرے پھر تم قوت کی کمزوری دیکھو تو\
    \ ہرگز فصد نہ کرو اور اگر قوت کی کمزوری فصد اور دست کی راہ میں حائل ہو تو متوسط\
    \ یا تیز حقنیں استعمال کرنا ضروری ہیں جیسا مشاہدہ حکم دے خاص طور پر جب درد شراسيف\
    \ کی طرف ہو۔ اور جب استفراغ کیا اور درد ہلکا پایا تو شکر کے پانی اور ایسے جو کے\
    \ پانی پر قناعت کرو جس میں چھلا جو بہت پانی میں اچھی طرح پکا ہو اور تقویت کی ضرورت\
    \ پر اسی جنس کی جلائیں پر اگر علت خاموش آسان ہلکی ہو تو اچھی طرح پکے چھلے جو کے\
    \ پانی سے غذا دو کیونکہ وہ نفث کراتا کاٹتا اور تقویت دیتا ہے اور اگر میٹھا کرنا\
    \ چاہو تو شکر یا شہد سے کرلو اور اگر علت بے قرار ہو تو صرف جو کے پانی پر رہو یہاں\
    \ تک کہ حال پرخ جائے خاص طور پر نفث کے حساب سے کہ اگر زیادہ ہو تو مادہ کی کثرت\
    \ سے امن ہو اور قوت کی ضرورت معلوم ہو تو چھلے جو کے پانی سے غذا دو اور تقویت دو\
    \ اور اگر محبوس ہو تو تدبیر لطیف کرو اور جو کے پانی اور جلائیں پر قناعت کرو جتنا\
    \ ممکن ہو اور اگر ذات الجنب میں صرف جو کے سويک پر قناعت ہو جائے اور بغیر پکاوٹ\
    \ کے فصد کی ضرورت پڑ جائے تو درست یہ ہے کہ وزن کے دو تہائی پر قناعت کرو اور زخم\
    \ پر نمک اور تیل کے ساتھ دوسری بار کی تیاری رکھو اور اکثر ہر دن ایک دو بار پیٹ\
    \ ڈھیلا کرنا فصد سے بچا دیتا ہے اور جس پر فصد کے بعد متلی یا شدید بندش اور تنگی\
    \ نفس ہو تو یہ اس کی دلیل ہے کہ فصد نے ورم کا مادہ خارج نہیں کیا۔ اور بہتر یہ\
    \ ہے کہ سینے کے دردوں کے علاج میں ابتداء میں طبیعت نہ نرم کی جائے مگر ہلکی حقنوں\
    \ اور شيافات سے اور بڑے خطرات میں سے بہت ٹھنڈی جلائیں پلانا ہے مگر صفراء سے ہونے\
    \ والے میں یا قابض ٹھنڈی چیزیں پلانا یا کھلانا اور جان لو کہ ٹھنڈا پانی اس علت\
    \ اور تمام اندرونی ورموں کے لیے موافق نہیں جتنا ہو سکے کم کرو اور اگر پیاس نہ\
    \ مانے تو اسے سكنجبين میں ملا دو تاکہ پانی کی سور ٹوٹے اور اس کا ٹھہرنا کم ہو\
    \ بلکہ بکھر کر بدن میں اترے اور سكنجبين کے کاٹنے اور پتلا کرنے سے فائدہ ہو اور\
    \ جان لو کہ ذات الجنب کو اسی جنس کی تر کرنے والی جلائیں موافق ہیں اور جو بچایا\
    \ جائے وہ ہر وہ چیز ہے جس میں ٹھنڈک اور گاڑھا پن ہو اور تمہارا سب سے بڑا مقصد\
    \ نفث آسان کرنا ہونا چاہیے {cite:canon-ibn-sina-print-v2 p.360}"
  "es": "La materia que se dirige al tumor debe ser prevenida y extraída mediante evacuación, y lo que la contrarreste —y debe leerse lo que describimos en el capítulo anterior—. Decimos: su tratamiento es la flebotomía, si predomina la sangre, en el lado mencionado en el capítulo anterior; y la flebotomía continúa hasta que cambia de color, lo que indica que se ha evacuado lo dañino de la sangre —hay que tener en cuenta que la sangre más oscura del cuerpo es la que está cerca de dicho tumor—, aunque es obligatorio vigilar la fuerza durante este proceso, ya que esta puede no permitir la eliminación de la sangre hasta ese punto. Si predomina otro humor, se evacua no con un astringente, sino con un purgante que provoque laxancia, y se realiza la purga por la noche. Algunos eruditos han dicho que lo más sensato es evacuar mediante flebotomía siempre que sea posible, por temor a la alteración que pueda causar un purgante, especialmente si la expectoración es muy biliosa. Sin embargo, debe vigilarse la dirección del dolor y la molestia: si la inclinación asciende hacia la clavícula y la parte superior del pecho y lo que está por encima de ellas, es preferible la flebotomía; si el dolor se inclina hacia el hipocondrio, la purga sola es indispensable, o bien con flebotomía según lo dicte la observación, pues la flebotomía sola de la basílica no extrae nada significativo de esa zona. Lo que enseña la gravedad de la necesidad de evacuar es su hallazgo de que las cataplasmas y compresas no calman el dolor, sino que lo aumentan —esto indica que el cuerpo está completamente lleno— y la evacuación es indispensable. Si se evacúa y los síntomas no se calman, sepa que lo que buscamos entonces es prevenir la acumulación: no repita la flebotomía, para que la materia acumulada no se atrofie —y esto no se recupera con la pérdida de la fuerza y la pérdida de la maduración sanguínea de la materia—. Una vez que se ha ablandado, debe evitarse que se convierta en pus, y se debe hacer todo lo posible por limpiarla primero mediante expectoración. En resumen: si no se le sangró, y se arrepintió y esperaba una expectoración madura y sana, y luego ve una debilidad de la fuerza, no se le sangra en absoluto. Si la debilidad de la fuerza impide la venopunción y la purga, se deben usar enemas medianos o fuertes según lo dicte la observación, especialmente si el dolor tiende a la hipocondría. Cuando haya evacuado y encuentre que el dolor es más leve, limítese a agua azucarada y agua de cebada en la que la cebada descascarillada esté bien cocida en abundante agua, y a bebidas de este tipo cuando necesite fortalecerse. Si la enfermedad es tranquila, fácil y leve, aliméntelo con agua de cebada descascarillada bien cocida, ya que promueve la expectoración, corta y fortalece; si desea endulzarla, endulce con azúcar o miel; Si es turbulento, siga con agua de cebada hasta que se verifique el estado, y guíese especialmente por la expectoración: si abunda, está a salvo de la abundancia de la materia y conoce la necesidad de la fuerza, así que aliméntese con agua de cebada descascarillada y fortalezca; si se retiene, alivie el régimen y siga con agua de cebada y bebidas en la medida de lo posible. Si la abstinencia de gachas de cebada ocurre en pleuresía, y la necesidad de flebotomía llama a un tipo de pleuresía no madura, el curso correcto es mantener alrededor de dos tercios de su cantidad y prepararse para repetirla, con sal y aceite en la herida; y aflojar el vientre una o dos sesiones cada día a menudo prescinde de la flebotomía. Si a quien la flebotomía le deja con náuseas o una dureza severa y dificultad para respirar, eso muestra que la flebotomía no evacuó la materia del tumor. Es preferible no aflojar la naturaleza al comienzo del tratamiento de dolores de pecho excepto con el tipo ligero de enemas y supositorios; Y uno de los mayores peligros es dar bebidas muy refrescantes, excepto las que provienen de la bilis, o dar alimentos fríos y astringentes o ingerirlos; sepa que dar agua fría no es adecuado para esta enfermedad ni para ninguno de los tumores internos; redúzcala lo más posible, y si la sed persiste, mézclela con oxímel para que se rompa la fuerza del agua y se reduzca su permanencia y sedimentación, de modo que se disperse y se introduzca en el cuerpo, y se aproveche el efecto diluyente y depurativo del oxímel. Sepa que la pleuresía se beneficia de las bebidas humectantes de este tipo, y lo que se debe evitar es todo lo que tenga efecto refrescante y espesante. Y el principal de sus objetivos debe ser hacer que la espera sea fácil {cite:canon-ibn-sina-print-v2 p.360}"
  "fr": "Il faut empêcher et évacuer par irrigation tout ce qui favorise l'aggravation de la tumeur, en s'attaquant à ce qui l'en empêche. Il convient de se référer au chapitre précédent. Le traitement consiste en une saignée, si le sang prédomine, du côté mentionné précédemment. La saignée se poursuit jusqu'à ce que la couleur du sang change, signe que les substances nocives ont été évacuées. Sachez que le sang le plus noir se trouve à proximité d'une telle tumeur. Il est cependant impératif de surveiller attentivement la puissance du produit, car celle-ci pourrait empêcher l'évacuation du sang jusqu'à ce point. Si une autre humeur prédomine, elle est évacuée non par un produit astringent, mais par un produit laxatif, et ces purges ont lieu la nuit. Certains savants estiment qu'il est préférable d'évacuer par saignée chaque fois que cela est possible, par crainte des troubles que pourrait provoquer un purgatif, surtout si les expectorations sont très bilieuses. Il faut cependant surveiller la direction de la douleur: si elle se dirige vers la clavicule, la partie supérieure de la poitrine et les zones situées au-dessus, une saignée est préférable; si elle se dirige vers les hypochondres, une purge est indispensable, ou une saignée associée selon l'observation – car une saignée seule au niveau de la basilique ne permet pas d'extraire de sang significatif de cette zone. Ce qui témoigne de la nécessité d'évacuer, c'est que les cataplasmes et les compresses n'apaisent pas la douleur, ni ne l'aggravent – cela indique que le corps est plein – et l'évacuation est indispensable. Si, après l'évacuation, les symptômes persistent, il faut alors prévenir l'accumulation: ne répétez pas la saignée, de peur que la matière accumulée ne se solidifie – or, celle-ci ne mûrit pas avec la perte de force et la fin de la maturation sanguine. Une fois solidifiée, il faut empêcher la formation de pus et tout faire pour la purifier d'abord par expectoration. En résumé: si le patient n’a pas été saigné, mais a bien expectoré des expectorations mûres et saines, et que vous constatez ensuite une faiblesse de son organisme, n’effectuez aucune saignée. Si cette faiblesse empêche la saignée et la purge, il faut recourir à des lavements modérés ou puissants selon l’observation, surtout si la douleur est d’origine hypocondriaque. Une fois l’évacuation terminée et la douleur atténuée, consommez de l’eau sucrée et une infusion d’orge (orge mondé bien cuit dans une grande quantité d’eau), ainsi que des boissons de ce type lorsque vous avez besoin de vous fortifier. Si la maladie est calme, bénigne et légère, nourrissez-le avec une infusion d’orge mondé bien cuit, car elle favorise l’expectoration, coupe et fortifie; si vous souhaitez l’adoucir, ajoutez du sucre ou du miel. Si les expectorations sont turbulentes, consommez de l'eau d'orge jusqu'à confirmation de l'état du patient, en prêtant une attention particulière à leur abondance: si elles sont abondantes, vous êtes à l'abri d'un excès de matière et vous comprenez le besoin de force; dans ce cas, nourrissez-vous avec de l'eau d'orge mondé et fortifiez-vous. Si les expectorations sont retenues, allégez le régime et consommez autant que possible de l'eau d'orge et d'autres boissons. En cas d'abstinence de bouillie d'orge lors d'une pleurésie, et si une saignée s'avère nécessaire en raison d'une pleurésie non mature, il convient de consommer environ les deux tiers de la quantité prescrite et de se préparer à la renouveler, en appliquant du sel et de l'huile sur la plaie. Des laxatifs une ou deux fois par jour permettent souvent d'éviter les saignées. Si une personne souffre de nausées, d'une forte sensation d'oppression et d'essoufflement après une saignée, cela indique que celle-ci n'a pas permis d'évacuer la matière tumorale. Il est préférable de ne pas provoquer de laxatifs au début du traitement des douleurs thoraciques, sauf avec des lavements et des suppositoires légers. L'un des plus grands dangers est de donner des boissons fortement rafraîchissantes, sauf celles d'origine biliaire, ou des aliments froids et astringents. Sachez que donner de l'eau froide ne convient ni à cette maladie ni à aucune tumeur interne; réduisez-en la quantité autant que possible. Si la soif persiste, mélangez-la avec de l'oxymel afin d'en atténuer la force et la durée d'action, de la diffuser plus rapidement dans le corps et de profiter des propriétés décongestionnantes et fluidifiantes de l'oxymel. Sachez que la pleurésie s'accorde avec les boissons hydratantes de ce type, et qu'il faut éviter tout ce qui est rafraîchissant et épaississant. Votre objectif principal doit être de faciliter l'expectoration. {cite:canon-ibn-sina-print-v2 p.360}"
