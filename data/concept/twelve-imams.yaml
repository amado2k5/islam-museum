id: concept/twelve-imams
class: concept
kind: doctrine
label: { ar: "الأئمة الاثنا عشر عند الشيعة الإمامية", en: "The Twelve Imams (Twelver Shi'a)", es: "Los Doce Imames (Chiítas duodecimanos)", fr: "Les douze imams (chiites duodécimains)", ur: "بارہ امام ⁦(بارہ شیعہ)⁩", tr: "İmam Şiilere göre On İki İmam", id: "Dua Belas Imam Menurut Syiah Imami" }
summary:
  ar: "عقيدة الشيعة الإمامية الاثنا عشرية في أن الإمامة بالنص من الله على لسان النبي، وأن الأئمة اثنا عشر من علي بن أبي طالب إلى محمد بن الحسن المهدي. يعرض الصلابي الأدلة التي يذكرها أصحابها من القرآن والسنة ويرد عليها واحداً واحداً: آية الولاية، وآية المباهلة، وآية الشورى، وحديث الثقلين، وحديث الغدير، وحديث «الخلفاء الاثني عشر». وينقل من مصادر الشيعة نفسها أن فكرة الحصر في عدد معين نشأت في القرن الثاني في أوساط تنسب إلى شيطان الطاق وهشام بن الحكم، وأن الاتفاق على الاثني عشر استقر بعد وفاة الحسن العسكري {cite:sallabi-ali-vol2 p. 260}."
  en: "Twelver Shi'i doctrine that the imamate passes by explicit designation (nass) of God through the Prophet, through twelve named imams from Ali ibn Abi Talib to Muhammad ibn al-Hasan. The author lists the imams and rebuts the scriptural and hadith arguments used for the doctrine."
  es: "La doctrina chií duodecimana sostiene que el imamato se transmite por designación explícita (nass) de Dios a través del Profeta, mediante doce imanes nombrados, desde Ali ibn Abi Talib hasta Muhammad ibn al-Hasan. El autor enumera a los imanes y refuta los argumentos bíblicos y hadices utilizados para sustentar esta doctrina."
  fr: "La doctrine chiite duodécimaine affirme que l'imamat se transmet par désignation explicite (nass) de Dieu à travers le Prophète, puis par douze imams nommés, d'Ali ibn Abi Talib à Muhammad ibn al-Hasan. L'auteur dresse la liste des imams et réfute les arguments scripturaires et hadithiques invoqués à l'appui de cette doctrine."
  ur: "بارہ شیعہ عقیدہ کہ امامت پیغمبر کے ذریعے خدا کے واضح عہدہ ⁦(ناس)⁩ سے گزرتی ہے، علی ابن ابی طالب سے لے کر محمد ابن الحسن تک بارہ نامی اماموں کے ذریعے۔ مصنف نے ائمہ کی فہرست دی ہے اور عقیدہ کے لیے استعمال ہونے والے صحیفہ اور حدیث کے دلائل کو رد کیا ہے۔"
  tr: "On İki İmam Şii mezhebi, İmamatın açıkça Peygamber'in dili aracılığıyla Allah'tan geldiğini, on iki imamın ise Ali ibn Ebi Talib'den Muhammed ibn el-Hasan el-Mehdi'ye kadar olduğunu savunur. El-Sallabi, savunucularının Kur'an ve Sünnet'ten aldığı kanıtları sunar ve tek tek çürütür: vesayet ayeti, Mubahala ayeti, Şura ayeti, İki Ağır Şeyin Hadisi, Ghadir'in Hadisi ve \"On İki Halife\"nin hadisi. Aynı Şii kaynaklarından, belirli sayıda sınırlama fikrinin ikinci yüzyılda Şeytan el-Taq ve Hişam ibn al-Hakam'a atfedilen çevrelerde ortaya çıktığını ve on iki kişi üzerindeki anlaşmanın el-Hasan el-Eskeri'nin ölümünden sonra istikrar kazandığını (alıntı::) alıntılar sallabi-ali-cilt 2 s. 260}."
  id: "Kredo Syiah Dua Belas menyatakan bahwa Imamat secara eksplisit berasal dari Allah melalui lidah Nabi, dan dua belas Imam berasal dari Ali ibn Abi Talib hingga Muhammad ibn al-Hasan al-Mahdi. Al-Sallabi menyajikan bukti-bukti yang dikutip oleh para pendukungnya dari Al-Qur'an dan Sunnah dan membantahnya satu per satu: ayat perlindungan, ayat Mubahala, ayat Shura, Hadis Dua Hal Berat, Hadis Ghadir, dan hadis \"Dua Belas Khalifah.\" Ia mengutip dari sumber Syiah yang sama bahwa gagasan pembatasan jumlah tertentu muncul pada abad kedua dalam lingkaran yang dikaitkan dengan Setan al-Taq dan Hisham ibn al-Hakam, dan kesepakatan tentang dua belas menjadi stabil setelah kematian al-Hasan al-Askari {cite:sallabi-ali-vol2 hlm. 260}."
