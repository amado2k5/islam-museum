label: { ar: "تدبير المزاج الأزيد حرارة عند ابن سينا", en: "The regimen of the excessively hot temperament in the Canon", ur: "زیادہ گرم مزاج کی تدبیر قانون میں" }
summary:
  ar: "يفتتح ابن سينا التعليم الرابع، في تدبير بدن من مزاجه غير فاضل، وهو خمسة فصول، بالفصل الأول في إصلاح المزاج الأزيد حرارة، فيفرق بين الحار المعتدل في المنفعلتين والحار مع يبوسة والحار مع رطوبة، ويجعل تدبيرهم في غرضين هما الرد إلى الاعتدال وحفظ الصحة {cite:canon-ibn-sina-print-v1 p.255}."
  en: "Ibn Sina opens the fourth teaching, the regimen of a body whose temperament is not excellent, in five chapters, with the first on correcting the temperament that is hotter than it should be; he distinguishes the hot temperament balanced in the two passive qualities from the hot and dry and the hot and moist, and sets its regimen on two aims: return to balance and keeping health {cite:canon-ibn-sina-print-v1 p.255}."
