id: concept/canon-regimen-of-the-excessively-hot-temperament
class: concept
kind: scientific
label:
  ar: "تدبير المزاج الأزيد حرارة عند ابن سينا"
  en: "The regimen of the excessively hot temperament in the Canon"
  fr: "Régime du tempérament excessivement chaud dans le Canon"
  ur: "زیادہ گرم مزاج کی تدبیر قانون میں"
  es: "El régimen del temperamento excesivamente fogoso en el Canon"
  tr: "İbn Sina'ya göre Aşırı Sıcaklık Ruh Halini Yönetmek"
  id: "Mengelola Suasana Hati Panas Berlebih menurut Ibn Sina"
summary:
  ar: "يفتتح ابن سينا التعليم الرابع، في تدبير بدن من مزاجه غير فاضل، وهو خمسة فصول، بالفصل الأول في إصلاح المزاج الأزيد حرارة، فيفرق بين الحار المعتدل في المنفعلتين والحار مع يبوسة والحار مع رطوبة، ويجعل تدبيرهم في غرضين هما الرد إلى الاعتدال وحفظ الصحة {cite:canon-ibn-sina-print-v1 p.255}."
  en: "Ibn Sina opens the fourth teaching, the regimen of a body whose temperament is not excellent, in five chapters, with the first on correcting the temperament that is hotter than it should be; he distinguishes the hot temperament balanced in the two passive qualities from the hot and dry and the hot and moist, and sets its regimen on two aims: return to balance and keeping health {cite:canon-ibn-sina-print-v1 p.255}."
  fr: "Ibn Sina ouvre le quatrième enseignement, en cinq chapitres sur le régime d’un corps de tempérament imparfait, par la correction de l’excès de chaleur. Il distingue chaud équilibré dans les deux qualités passives, chaud-sec et chaud-humide ; deux buts : retour à l’équilibre et conservation de la santé {cite:canon-ibn-sina-print-v1 p.255}."
  es: "Ibn Sina abre la cuarta enseñanza, el régimen de un cuerpo cuyo temperamento no es excelente, en cinco capítulos, con el primero sobre la corrección del temperamento que es más caliente de lo que debería ser; distingue el temperamento caliente equilibrado en las dos cualidades pasivas del caliente y seco y el caliente y húmedo, y establece su régimen en dos objetivos: volver al equilibrio y mantener la salud {cite:canon-ibn-sina-print-v1 p.255}."
  ur: "ابن سینا نے چوتھی تعلیم کا آغاز کیا ہے، جس جسم کا مزاج بہترین نہیں ہے، پانچ ابواب میں، پہلے اس مزاج کو درست کرنے پر جو اس سے زیادہ گرم ہونا چاہیے؛ وہ گرم اور خشک اور گرم اور نم سے دو غیر فعال خصوصیات میں متوازن گرم مزاج کو ممتاز کرتا ہے، اور اس کے طرز عمل کو دو مقاصد پر متعین کرتا ہے: توازن کی طرف لوٹنا اور صحت کو برقرار رکھنا۔"
  tr: "İbn Sina, üstün olmayan mizaca sahip bir bedeni yönetmekle ilgili dördüncü öğretiyi beş bölümden oluşur; birinci bölüm aşırı ısıyla mizacın yeniden şekillendirilmesini içerir. Pasif koşullarda ılımlı sıcaklık, kuru sıcaklık ve nemle sıcak arasında ayrım yapar ve yönetimi iki amaca hizmet eder: ölçülülüğe dönmek ve sağlığı korumak {cite:canon-ibn-sina-print-v1 s.255}."
  id: "Ibn Sina membuka ajaran keempat tentang pengelolaan tubuh dengan temperamen non-superior, terdiri dari lima bab, dengan bab pertama tentang mereformasi temperamen dengan panas berlebih. Ia membedakan antara panas sedang dalam kondisi pasif, panas saat kekeringan, dan panas dengan kelembapan, dan pengelolaan ini memiliki dua tujuan: kembali ke moderasi dan menjaga kesehatan {cite:canon-ibn-sina-print-v1 hlm.255}."
