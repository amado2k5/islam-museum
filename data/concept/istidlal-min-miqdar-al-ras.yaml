id: concept/istidlal-min-miqdar-al-ras
class: concept
kind: scientific
label:
  ar: "الاستدلال من مقدار الرأس"
  en: "Inference from the size of the head"
  ur: "سر کی مقدار سے استدلال"
  es: "Inferencia a partir del tamaño de la cabeza"
summary:
  ar: "يبين ابن سينا ما يدل عليه صغر الرأس وكبره من حال الدماغ وقواه، ناقلاً عن جالينوس وأصحاب الفراسة، وما يعرض من انتفاخ الرأس للصبيان؛ وفيه سطر موسوم في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v2 pp.18-19}"
  en: "Ibn Sina shows what a small or large head indicates about the state and powers of the brain, reporting Galen and the physiognomists, and the swelling of the head that befalls children; the record has a labelled line in a section held for the founder's ruling {cite:canon-ibn-sina-print-v2 pp.18-19}"
  ur: "ابن سینا بتاتا ہے کہ چھوٹا یا بڑا سر دماغ کی حالت اور اس کی قوتوں کے بارے میں کیا بتاتا ہے، جالینوس اور اہلِ فراست کو نقل کرتے ہوئے، اور بچوں کو لاحق ہونے والا سر کا پھولنا؛ اس میں ایک موسوم سطر بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v2 pp.18-19}۔"
  es: "Ibn Sina muestra lo que una cabeza pequeña o grande indica sobre el estado y las capacidades del cerebro, citando a Galeno y a los fisonomistas, y la hinchazón de la cabeza que afecta a los niños; el registro tiene una línea etiquetada en una sección reservada para el dictamen del fundador {cite:canon-ibn-sina-print-v2 pp.18-19}"
