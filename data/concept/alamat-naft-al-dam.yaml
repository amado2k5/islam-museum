summary:
  ar: "القريب من الحنجرة ينفث بسعال قليل والبعيد بسعال كثير وكلما كان أبعد تنفث بسعال أشد، وإذا نيم على الجانب الذي فيه العلة ازداد انتفاث ما ينتفت، ويجب أن ينظر أولاً حتى لا يكون ما ينفث مرعوفاً ويتعرف ذلك بمادة الرعاف وبعروضه وبخفة عرضت للرأس بعد ثقل، وعلامات رعاف كانت مثل حمرة الوجه والعين والتباريق أمام العين وأن لا يكون زبدياً ويكون دفعة، وعلامة الدم المنفوث من جوهر لحم الرئة من جراحة أو قرحة أن يكون زبدياً ويكون منقطعاً لا وجع له وهو أقل مقداراً من العرقي وأعظم غائلة وأردأ عاقبة وقد يقذف الزبدي أصحاب ذات الجنب وذات الرئة إذا كان في رئاتهم حرارة نارية مغلية، وقد يكون الزبدي من قصبة الرئة ولكن يجيء بتنخع وسعال يسير ويكون ما يخرج يسيراً ويكون هناك حس ما بالألم، والمنفوث من عروقها لا يكون زبدياً ويكون أسخن وأشد قواماً من قوام الذي في الرئة وأشبه بالدم وإن لم يكن في الذي في الصدر غلظ الدم، وعلامة المنفوث من الصدر سواد لونه وغلظه وجموده لطول المسافة مع زبدية ما ورغوة مع وجع في الصدر يدل على موضع العلة ويؤكده ازدياده بالنوم عليه وسبب ذلك الوجع عصبية أعضاء الصدر ويكون انتفاثه قليلاً قليلاً ليس قبضاً ويكون نفثه بسعال شديد حتى ينفث، وعلامة الكائن من انقطاع العروق غزارة الدم، وعلامة التأكل تقدم أسباب التأكل من تناول أشياء حريفة ونزول نوازل حريفة وأن يكون حمى ونفث قيح أو قشرة أو جزء من الرئة ويكون نفث مثل ماء اللحم ويبتدئ نفث الدم قليلاً قليلاً ثم ربما انبثق دفعة فانتفث شيء صالح ولونه رديء، وعلامة تفتح أفواه العروق أقل من الخارج بسبب الانقطاع والانشقاق في أول الأمر وهو أكثر من الذي يخرج عن التأكل في أكثر الأوقات، وعلامة الراشح عن ورم قلته وحضور علامات ذات الرئة وغيرها {cite:canon-ibn-sina-print-v2 p.334}"
  en: "What is near the larynx is spat with little cough, what is far with much, and the farther it is the harder the cough that spits it; and if the patient is laid on the side holding the lesion, what he spits increases. One must first look so that what is spat be not a nosebleed, told by the nosebleed's matter, its course, and a lightness befalling the head after heaviness; a nosebleed's signs are redness of face and eye, sparks before the eye, that it is not foamy, and that it comes at once. The sign of blood spat from the lung flesh's own substance, from a wound or an ulcer, is that it is foamy and intermittent without pain; it is less in measure than the venous and greater in evil and worse in outcome — and owners of pleurisy and peripneumonia may cast the foamy when there is a boiling fiery heat in their lungs. The foamy may be from the lung's windpipe, but it comes with a little hawking and cough, what comes out is little, and there is some sense of pain. What is spat from its vessels is not foamy, is hotter and of stronger consistency than what is in the lung, more like blood, though the chest's blood is not thick. The sign of what is spat from the chest is the blackness of its colour, its thickness and congealing for the distance's length, with some foaminess and froth, and a pain in the chest pointing to the lesion's place, confirmed by its increasing when lying on it; that pain's cause is the chest organs' being nervous, and its spitting is little by little, not at one gathering, and it is spat by hard coughing. The sign of what is from the vessels' cutting is the blood's copiousness; the sign of erosion is the precedence of the erosion's causes — taking sharp things, descending sharp catarrhs — and that there be fever and expectoration of pus or a crust or a part of the lung, the spitting like meat-water, beginning little by little then perhaps bursting at once so he spits a sound thing of bad colour; the sign of the vessels' mouths opening is less than what comes out by cutting and splitting at the beginning, and more than what comes out of erosion most of the time; and the sign of what seeps from a tumour is its littleness and the presence of the signs of peripneumonia and the like {cite:canon-ibn-sina-print-v2 p.334}"
  fr: "Ce qui se trouve près du larynx s’expectore en toussant peu, ce qui en est éloigné en toussant beaucoup ; plus la source est éloignée, plus la toux qui l’expulse est forte. Si le malade est couché sur le côté de la lésion, l’expectoration augmente. Il faut d’abord s’assurer que ce qui est craché ne provient pas d’un saignement de nez, reconnaissable à la matière du saignement, à son cours et à la légèreté qui gagne la tête après une sensation de lourdeur. Les signes du saignement de nez sont la rougeur du visage et de l’œil, des étincelles devant l’œil, l’absence d’écume et la survenue soudaine. Le sang expectoré de la substance charnue du poumon même, d’une plaie ou d’un ulcère, est mousseux, intermittent et sans douleur. Il est moins abondant que le sang veineux, mais plus grave et de moins bon pronostic. Les malades atteints de pleurésie ou de péripneumonie peuvent cracher du sang mousseux lorsque leurs poumons sont en proie à une chaleur ardente qui les fait bouillonner. Le sang mousseux peut venir du conduit aérien du poumon, mais il s’accompagne d’un léger raclement de gorge et de toux ; il en sort peu et l’on ressent une certaine douleur. Le sang craché qui vient de ses vaisseaux n’est pas mousseux : il est plus chaud, plus consistant que celui du poumon et ressemble davantage à du sang, bien que le sang de la poitrine ne soit pas épais. Ce qui est craché de la poitrine se reconnaît à sa couleur noire, à son épaisseur et à sa coagulation du fait de la longueur du trajet, avec quelque mousse et écume. Une douleur thoracique indique le siège de la lésion, ce que confirme son augmentation quand on se couche sur ce côté. Cette douleur tient à la nature nerveuse des organes de la poitrine ; le sang s’expectore peu à peu, et non d’un seul coup, après de violents accès de toux. Un sang abondant signale la section des vaisseaux. L’érosion est indiquée par ses causes préalables, comme l’absorption de substances âcres ou la descente de catarrhes âcres, ainsi que par la fièvre et l’expectoration de pus, d’une croûte ou d’un fragment de poumon. Le crachat ressemble à de l’eau de viande ; il commence en petite quantité, puis peut jaillir soudainement, le malade crachant alors une matière consistante de mauvaise couleur. L’ouverture des orifices des vaisseaux donne d’emblée moins de sang que la section ou la rupture, mais généralement plus que l’érosion. Ce qui suinte d’une tuméfaction se reconnaît à sa faible quantité et à la présence des signes de la péripneumonie ou d’une affection semblable. {cite:canon-ibn-sina-print-v2 p.334}"
  ur: "حنجرے کے قریب کا کم کھانسی سے نکلتا ہے دور کا زیادہ سے اور جتنا دور اتنی سخت کھانسی سے؛ اور اگر مریض کو اس پہلو لٹایا جائے جس میں علت ہو تو نفث بڑھ جاتا ہے؛ پہلے دیکھنا چاہیے کہ نکلا ہوا نکسیر نہ ہو جو نکسیر کے مادے اس کے انداز اور سر پر گرانی کے بعد ہلکے پن سے پہچانا جائے؛ نکسیر کی علامتیں چہرے اور آنکھ کی سرخی آنکھ کے آگے چمکتے ذرے زبد نہ ہونا اور ایک دم آنا؛ پھیپھڑے کے گوشت کے جوہر سے زخم یا قرحة سے نکلے خون کی علامت زبد ہونا ٹوٹ ٹوٹ کر آنا بغیر درد؛ یہ رگ والے سے مقدار میں کم اور آفت میں بڑا اور انجام میں بتر ہے اور ذات الجنب اور ذات الرئة والے بھی زبد اگال سکتے ہیں جب ان کے پھیپھڑوں میں اگلتی آتشی حرارت ہو؛ زبد نالی سے بھی ہو سکتا ہے لیکن ہلکے تنخم اور کھانسی سے آتا ہے نکلنے والا کم ہوتا ہے اور درد کا کچھ احساس ہوتا ہے؛ رگوں سے نکلا زبد نہیں ہوتا گرم تر اور پھیپھڑے والے سے مضبوط قوام اور خون کے زیادہ مشابہ ہوتا ہے اگرچہ سینے والے میں خون گاڑھا نہ ہو؛ سینے سے نکلے کی علامت رنگ کی سیاہی گاڑھاپن اور فاصلہ دراز ہونے سے جمنا کچھ زبد اور جھاگ کے ساتھ اور سینے میں درد جو علت کے مقام کی طرف اشارہ کرے اور اس پہلو پر سونے سے بڑھنا اس درد کا سبب سینے کے اعضا کا عصبی ہونا اور نفث تھوڑا تھوڑا ہوتا ہے جمع کر کے نہیں سخت کھانسی سے نکلتا ہے؛ رگوں کے انقطاع کی علامت خون کی فراوانی؛ کٹ جانے کی علامت اس کے اسباب کا پہلے ہونا تیز چیزوں کا کھانا تیز نزلات کا اترنا اور بخار اور پیب یا چھلکے یا پھیپھڑے کے حصے کا نفث اور گوشت کے پانی جیسا نفث نفث دم شروع میں تھوڑا تھوڑا پھر شاید ایک دم پھٹے تو اچھی چیز بتر رنگ کی نکلے؛ رگوں کے منہ کھلنے کی علامت شروع میں انقطاع اور شق والے سے کم اور اکثر اوقات کٹ جانے والے سے زیادہ؛ اور ورم سے ترشح کرنے والے کی علامت اس کی قلت اور ذات الرئة وغیرہ کی علامتوں کا موجود ہونا {cite:canon-ibn-sina-print-v2 p.334}"
  es: "Lo que está cerca de la laringe se expulsa con poca tos, lo que está lejos con mucha, y cuanto más lejos está, más fuerte es la tos que lo expulsa; y si el paciente está acostado de lado sujetando la lesión, lo que expulsa aumenta. Primero hay que observar para que lo que se expulsa no sea una hemorragia nasal, lo cual se puede determinar por la sustancia de la hemorragia, su curso y una sensación de ligereza en la cabeza después de la pesadez; los signos de una hemorragia nasal son enrojecimiento de la cara y los ojos, destellos ante los ojos, que no sea espumosa y que se presente de inmediato. El signo de sangre expulsada de la propia sustancia del tejido pulmonar, de una herida o una úlcera, es que sea espumosa e intermitente sin dolor; es menos abundante que la venosa y más grave y de peor pronóstico; y quienes padecen pleuresía y perineumonía pueden expulsar la espuma cuando hay un calor intenso en los pulmones. La espuma puede provenir de la tráquea del pulmón, pero viene con un poco de carraspeo y tos, lo que sale es poco, y hay cierta sensación de dolor. Lo que se escupe de sus vasos no es espumoso, es más caliente y de consistencia más fuerte que lo que está en el pulmón, más como sangre, aunque la sangre del pecho no es espesa. El signo de lo que se escupe del pecho es el color negro de su color, su espesor y coagulación a lo largo de la distancia, con algo de espuma y espuma, y un dolor en el pecho que señala el lugar de la lesión, confirmado por su aumento al acostarse sobre ella; la causa de ese dolor es que los órganos del pecho están nerviosos, y su escupida es poco a poco, no en una sola acumulación, y es escupida por tos fuerte. El signo de lo que proviene del corte de los vasos es la copiosidad de la sangre; El signo de erosión es la precedencia de las causas de la erosión —inhalación de objetos punzantes, catarros agudos descendentes— y que haya fiebre y expectoración de pus o una costra o parte del pulmón, el escupitajo como agua de carne, comenzando poco a poco y luego quizás estallando de repente de modo que escupe algo sólido de mal color; el signo de la apertura de las bocas de los vasos es menos que lo que sale por corte y división al principio, y más que lo que sale por erosión la mayor parte del tiempo; y el signo de lo que supura de un tumor es su pequeñez y la presencia de signos de perineumonía y similares {cite:canon-ibn-sina-print-v2 p.334}"
  tr: "Gırtlağa yakın olan hafifçe öksürür, uzakta ise sık öksürür. Ne kadar uzaksa, o kadar şiddetli öksürür. Hastalığın tarafı yatıyorsa, dışarı atılan kısmın dışarısı artar. Öncelikle verilen şeyin korkutucu olmadığından emin olmak gerekir. Bu, burun kanamasının maddesi, belirtileri ve ağırlıktan sonra başın hafifliği ile tanınır. Yüz ve göz kızarıklığı gibi sızıntı belirtileri ve gözün önünde sivri uçlar vardır; köpüklü değil, kabarık olmalıdır. Ameliyat veya ülserden akciğer eti özünden alınan kanın belirtisi, Tereyağlı, ve ağrısı olmadan ayrılabilir; bu ağrı al-raqi'den daha hafif, en büyük şişlik ve en kötü sonuçtur. Akciğerlerinde kaynayan ateşli ısı olan plevrez ve zatürresi olanlar tereyağı kullanabilir. Tereyağı borusundan gelebilir ama hafif mukus ve öksürükle gelir, çıkan damar hafiftir ve hafif ağrı hissi vardır. Damarlarından çıkan damarlar tereyağlı değil ama akciğerlerdekinden daha sıcak ve kalındır ve göğüsteki damarların kalınlığı olmasa bile kana benzer. Kan. Göğsünden şişen kişinin belirtisi, uzun mesafe nedeniyle koyu, kalın ve sert rengidir; bir tür terebekçiçek ve köpükle birlikte, göğüs ağrısı hastalığın yerini gösterir ve üzerinde uyuyarak doğrulanır. Bu ağrının nedeni göğüs organlarında sinir hasarıdır; nefes verilmesi hafif ama sıkışmamıştır, ve üflemesi şiddetli öksürükle birlikte atılır. Tıkanık damarın belirtisi aşırı kandır; erozyon belirtisi ise acılı yiyeceklerden yemenin, şiddetli sorunların, ateş, irin, kabuk veya akciğerin bir kısmının ortaya çıkmasının nedenleridir. Bu, etli su gibi bir darbe gibidir ve kan üflemesi yavaş yavaş başlar, ardından iyi ve kötü renkte bir şeyin ani bir patlamasıyla başlar. Damarların ağızlarının açılma belirtisi, ilk kopma ve çatlama nedeniyle dışına göre daha azdır; bu da çoğu zaman yenmediği zamana göre daha sık görülür. Damlanın belirtisi, eksikliğinin tümörü ve zatürre ile diğer belirtilerin varlığıdır {cite:canon-ibn-sina-print-v2 s.334}"
  id: "Batuk sedikit di dekat tenggorokan, sementara batuk sering di tempat yang lebih jauh. Semakin jauh, semakin parah batuknya. Jika sisi penyakit berbaring, bagian yang dikeluarkan akan meningkat. Pertama, perlu dipastikan zat yang diberikan tidak menakutkan. Hal ini dikenali dari zat mimisan, gejalanya, dan ringan kepala setelah berat badan. Ada tanda-tanda cairan seperti kemerahan pada wajah dan mata serta titik runcing di depan mata; harus berbulu, bukan berbusa. Darah yang diambil dari paru setelah operasi atau tukak lambung dapat dibedakan tanpa mentega atau rasa sakit; rasa sakit ini lebih ringan daripada al-raqi, pembengkakan terbesar, dan hasil terburuk. Mereka yang mengalami pleuris dan pneumonia, demam panas yang mendidih di paru-paru, dapat menggunakan mentega. Mungkin berasal dari tabung mentega tetapi disertai lendir ringan dan batuk; vena yang menonjol ringan dan ada sedikit rasa sakit. Pembuluh darah yang keluar dari pembuluh darah tidak bermentega tetapi lebih hangat dan tebal dibandingkan di paru-paru, dan meskipun pembuluh darah di dada tidak tebal, mereka tetap mirip darah. Darah. Tanda pembengkakan dari dada adalah gelap, tebal, dan keras karena jarak yang jauh; bersama dengan jenis buttercup dan busa, nyeri dada menunjukkan lokasi penyakit dan dikonfirmasi dengan tidur di atasnya. Penyebab nyeri ini adalah kerusakan saraf pada organ dada; hembusan napas ringan tetapi tidak terkompresi, dan hembusan dikeluarkan bersama batuk parah. Tanda arteri tersumbat adalah darah berlebih; gejala erosi meliputi makan makanan pedas, masalah berat, dan munculnya demam, nanah, kerangan, atau bagian paru-paru. Rasanya seperti hembusan seperti air daging, dan aliran darah mulai perlahan, diikuti oleh ledakan tiba-tiba dari sesuatu yang baik dan buruk. Tanda pembukaan vena lebih jarang dibandingkan di luar, karena pecah dan pecah awal; ini sering lebih sering dibandingkan saat tidak dimakan. Tanda penurunan adalah adanya kekurangan tumor dan pneumonia serta gejala lain {cite:canon-ibn-sina-print-v2 hlm.334}"
