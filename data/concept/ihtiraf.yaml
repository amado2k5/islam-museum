id: concept/ihtiraf
class: concept
kind: legal
label: { ar: "احتراف", en: "Craft, trade (ihtiraf)" }
summary:
  ar: "الاحتراف أن يتخذ الإنسان حرفة يتكسب بها ويجعلها دأبه، ويفرق الفقهاء بينه وبين العمل والاكتساب، فالعمل أعم، والاحتراف أخص، ولا تكون الصناعة إلا بآلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1719} وإقامة الصناعات فرض كفاية، فتوفير المحترفين واجب، ولذلك يجبر ولي الأمر أهل الحرفة على العمل بعوض المثل إذا امتنعوا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1721} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1722} ويستحب لمن لم يجد الرزق في تجارة أن يتحول إلى غيرها بعد ثلاث مرات، استناداً إلى أثر عمر وابن عمر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1721}"
  en: "Ihtiraf is practising a trade by which one earns a living and makes it one's habit. Jurists distinguish it from work, which is wider, and from earning, which is also wider; a craft with tools is called sina'a. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1719} Keeping up the crafts is a communal duty, so supplying craftsmen is an obligation, and the ruler may compel craftsmen who refuse to work at the fair rate. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1721} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1722} One who finds no gain in a trade should move to another after three tries, on reports from 'Umar and Ibn 'Umar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1721}"
