id: concept/ihtiraf
class: concept
kind: legal
label: { ar: "احتراف", en: "Craft, trade (ihtiraf)", es: "Artesanía, oficio (ihtiraf)", fr: "Artisanat, commerce (ihtiraf)", ur: "دستکاری، تجارت ⁦(احتراف)⁩", tr: "Profesyonellik", id: "Profesionalisme" }
summary:
  ar: "الاحتراف أن يتخذ الإنسان حرفة يتكسب بها ويجعلها دأبه، ويفرق الفقهاء بينه وبين العمل والاكتساب، فالعمل أعم، والاحتراف أخص، ولا تكون الصناعة إلا بآلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1719} وإقامة الصناعات فرض كفاية، فتوفير المحترفين واجب، ولذلك يجبر ولي الأمر أهل الحرفة على العمل بعوض المثل إذا امتنعوا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1721} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1722} ويستحب لمن لم يجد الرزق في تجارة أن يتحول إلى غيرها بعد ثلاث مرات، استناداً إلى أثر عمر وابن عمر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1721}"
  en: "Ihtiraf is practising a trade by which one earns a living and makes it one's habit. Jurists distinguish it from work, which is wider, and from earning, which is also wider; a craft with tools is called sina'a. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1719} Keeping up the crafts is a communal duty, so supplying craftsmen is an obligation, and the ruler may compel craftsmen who refuse to work at the fair rate. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1721} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1722} One who finds no gain in a trade should move to another after three tries, on reports from 'Umar and Ibn 'Umar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1721}"
  es: "Ihtiraf es practicar un oficio mediante el cual uno se gana la vida y lo convierte en un hábito. Los juristas lo distinguen del trabajo, que es más amplio, y de ganar, que también es más amplio; un oficio con herramientas se llama sina'a. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1719} Mantener los oficios es un deber comunitario, por lo que proveer artesanos es una obligación, y el gobernante puede obligar a los artesanos que se niegan a trabajar por la tarifa justa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1721} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1722} Quien no encuentra ganancias en un oficio debe cambiar a otro después de tres intentos, según informes de 'Umar e Ibn 'Umar. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1721}"
  fr: "L'ihtiraf consiste à exercer un métier permettant de gagner sa vie et d'en faire une habitude. Les juristes le distinguent du travail, notion plus large, et du gain, également plus large; un artisanat utilisant des outils est appelé sina'a. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1719} Le maintien des métiers est un devoir communautaire; fournir des artisans est donc une obligation, et le souverain peut contraindre les artisans qui refusent de travailler au juste prix. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1721} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1722} Selon les hadiths rapportés par 'Umar et Ibn 'Umar, celui qui ne trouve aucun profit dans un métier devrait en changer après trois tentatives. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1721}"
  ur: "احتراف ایک ایسی تجارت ہے جس سے کوئی روزی کماتا ہے اور اسے اپنی عادت بناتا ہے۔ فقہا اسے کام سے ممتاز کرتے ہیں، جو وسیع ہے، اور کمائی سے، جو وسیع تر ہے۔ اوزاروں کے ساتھ دستکاری کو سینا کہتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1719} دستکاری کو برقرار رکھنا ایک اجتماعی فریضہ ہے، اس لیے کاریگروں کی فراہمی ایک فرض ہے، اور حاکم ان کاریگروں کو مجبور کر سکتا ہے جو مناسب قیمت پر کام کرنے سے انکار کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1721} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1722} عمر اور ابن عمر ما کی روایتوں کے مطابق جس کو تجارت میں کوئی فائدہ نہ ہو وہ تین کوششوں کے بعد دوسری جگہ چلا جائے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص1721}"
  tr: "Profesyonellik, bir kişinin geçimini sağladığı bir zanaatı alışkanlık haline getirmesidir. Hukukçular bunu iş ile edinim arasında ayrım yapar. İş geneldir, profesyonellik daha özgüldür ve zanaatkarlık ancak makineyle yapılabilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1719} Sanayi kurmak toplu bir yükümlülüktür, bu yüzden profesyonel sağlamak zorunludur. Bu nedenle, hükümdar, zanaatkârlar örnek karşılığında çalışmaya zorlar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1721} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1722} Ticarette geçimini bulamayanların, Ömer ve İbn Ömer geleneğine dayanarak, üç kez sonra başka birine geçmeleri önerilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1721}"
  id: "Profesionalisme adalah ketika seseorang mengambil keterampilan yang menghasilkan nafkahnya, menjadikannya kebiasaan. Para ahli hukum membedakan antara itu dengan pekerjaan dan perolehan. Pekerjaan itu umum, profesionalisme lebih spesifik, dan keterampilan hanya bisa dilakukan dengan mesin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1719} Mendirikan industri adalah kewajiban kolektif, jadi menyediakan profesional adalah kewajiban. Oleh karena itu, penguasa memaksa para pengrajin bekerja sebagai imbalan atas contoh jika mereka menolak. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.1721} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1722} Disarankan bagi mereka yang tidak mendapatkan penghasilan dalam perdagangan untuk beralih ke orang lain setelah tiga kali, berdasarkan tradisi Umar dan Ibn Umar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1721}"
