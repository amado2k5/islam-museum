id: concept/canon-medicinal-bath-waters
class: concept
kind: scientific
label:
  ar: "مياه الحمامات الدوائية عند ابن سينا"
  en: "Medicinal bath waters in the Canon"
  fr: "Eaux de bain médicinales dans le Canon"
  ur: "دوائی حمام کے پانی، قانون کے مطابق"
  es: "Aguas de baño medicinales en el Cañón"
summary:
  ar: "يعدد ابن سينا أثر الاستحمام في المياه النطرونية والكبريتية والبحرية والرمادية والمالحة والنحاسية والحديدية والزاجية والكبريتية والقفرية، وما يفيد كل نوع منها وما يضر، ثم يوصي بالتدرج والرفق عند دخول الحمام {cite:canon-ibn-sina-print-v1 pp.141-142}."
  en: "Ibn Sina lists what bathing in natron, sulphur, sea, ash, salt, copper, iron, vitriol and desert waters does, which kinds help and which harm, and advises gradual and gentle entry into the bath {cite:canon-ibn-sina-print-v1 pp.141-142}."
  fr: "Ibn Sina expose effets, bienfaits et méfaits supposés des eaux au natron, soufrées, marines, cendreuses, salées, cuivrées, ferrugineuses, vitrioliques et bitumineuses, puis entrée progressive et douce {cite:canon-ibn-sina-print-v1 pp.141-142}."
  es: "Ibn Sina enumera los efectos de bañarse en aguas de natrón, azufre, mar, ceniza, sal, cobre, hierro, vitriolo y desierto, qué tipos son beneficiosos y cuáles perjudiciales, y aconseja entrar en el baño de forma gradual y suave {cite:canon-ibn-sina-print-v1 pp.141-142}."
  ur: "ابن سینا یہ بتاتا ہے کہ نیٹرون، گندھک، سمندر، راکھ، نمک، تانبا، لوہا، وٹریول اور صحرائی پانیوں میں نہانے سے کیا فائدہ ہوتا ہے، کن قسموں میں مدد ملتی ہے اور کون سے نقصانات، اور غسل میں بتدریج اور نرمی سے داخل ہونے کا مشورہ دیتے ہیں۔"
