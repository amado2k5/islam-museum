label: { ar: "هيئة النوم والمشي بعد الطعام", en: "Sleep posture and walking after a meal", ur: "کھانے کے بعد نیند کی ہیئت اور چلنا" }
summary:
  ar: "يذكر ابن سينا أنه إن أفرط المرء يوماً جاع في الثاني وأطال النوم في مكان معتدل، وإذا لم يساعده النوم مشى مشياً كثيراً ليناً متصلاً، وينقل قول روفس في حمد المشي بعد الغداء، ثم يبين أن النوم يكون على اليمين أو زماناً يسيراً ثم على اليسار ثم على اليمين، وأن الدثار ورفع الوسادة يعينان على الهضم {cite:canon-ibn-sina-print-v1 p.229}."
  en: "Ibn Sina says that after a day of excess one should go hungry the next and sleep long in a temperate place, and if sleep does not come, walk a great deal, gently and without a break; he relays Rufus's praise of walking after the midday meal, and describes sleeping first on the right, then the left, then the right, with covering and a raised pillow as aids to digestion {cite:canon-ibn-sina-print-v1 p.229}."
