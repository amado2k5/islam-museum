id: concept/sleep-posture-and-walking-after-a-meal
class: concept
kind: scientific
label: { ar: "هيئة النوم والمشي بعد الطعام", en: "Sleep posture and walking after a meal", ur: "کھانے کے بعد نیند کی ہیئت اور چلنا", es: "Postura al dormir y caminar después de comer", fr: "Position de sommeil et marche après un repas", tr: "Yemekten sonra uyku ve yürüyen vücut", id: "Tidur dan berjalan tubuh setelah makan" }
summary:
  ar: "يذكر ابن سينا أنه إن أفرط المرء يوماً جاع في الثاني وأطال النوم في مكان معتدل، وإذا لم يساعده النوم مشى مشياً كثيراً ليناً متصلاً، وينقل قول روفس في حمد المشي بعد الغداء، ثم يبين أن النوم يكون على اليمين أو زماناً يسيراً ثم على اليسار ثم على اليمين، وأن الدثار ورفع الوسادة يعينان على الهضم {cite:canon-ibn-sina-print-v1 p.229}."
  en: "Ibn Sina says that after a day of excess one should go hungry the next and sleep long in a temperate place, and if sleep does not come, walk a great deal, gently and without a break; he relays Rufus's praise of walking after the midday meal, and describes sleeping first on the right, then the left, then the right, with covering and a raised pillow as aids to digestion {cite:canon-ibn-sina-print-v1 p.229}."
  es: "Ibn Sina dice que después de un día de excesos uno debe pasar hambre al día siguiente y dormir mucho en un lugar templado, y si no llega el sueño, caminar mucho, suavemente y sin descanso; transmite el elogio de Rufus a caminar después de la comida del mediodía, y describe dormir primero sobre la derecha, luego sobre la izquierda, luego sobre la derecha, con una manta y una almohada elevada como ayudas para la digestión {cite:canon-ibn-sina-print-v1 p.229}."
  fr: "Ibn Sina dit qu'après une journée d'excès, il faut avoir faim le lendemain et dormir longtemps dans un endroit tempéré, et si le sommeil ne vient pas, marcher beaucoup, doucement et sans interruption; il rapporte les éloges de Rufus sur la marche après le repas de midi, et décrit le fait de dormir d'abord à droite, puis à gauche, puis à droite, avec une couverture et un oreiller surélevé comme aides à la digestion {cite:canon-ibn-sina-print-v1 p.229}."
  ur: "ابن سینا کہتے ہیں کہ ایک دن کی زیادتی کے بعد دوسرے دن بھوکا رہنا چاہیے اور معتدل جگہ پر دیر تک سونا چاہیے، اور اگر نیند نہ آئے تو آہستہ آہستہ اور بغیر وقفے کے چلنا چاہیے۔ وہ روفس کی دوپہر کے کھانے کے بعد چلنے کی تعریف بیان کرتا ہے، اور پہلے دائیں، پھر بائیں، پھر دائیں، اوڑھنے اور اٹھائے ہوئے تکیے کے ساتھ سونا بیان کرتا ہے جو ہاضمے میں معاون ہوتا ہے۔"
  tr: "İbn Sina, bir kişi ertesi gün aşırı aç kalırsa ve ılımlı bir yerde uzun süre uyursa, uyku ona yardımcı olmazsa uzun, pürüzsüz ve kesintisiz bir yürüyüş yapar. Öğle yemeğinden sonra yürümeyi öven Rufus'un sözünü alıntılar, ardından uykunun sağda veya kısa bir süre, sonra solda, sonra sağda gerçekleştiğini, pelerin ve yastığın kaldırılmasının sindirime yardımcı olduğunu açıklar {cite:canon-ibn-sina-print-v1 s.229}."
  id: "Ibn Sina menyebutkan bahwa jika seseorang sangat lapar keesokan harinya dan tidur lama di tempat yang sedang, dan jika tidur tidak membantunya, ia berjalan dengan berjalan panjang, lancar, dan terus-menerus. Ia mengutip pepatah Rufus yang memuji berjalan setelah makan siang, lalu menjelaskan bahwa tidur terjadi di kanan atau sebentar, lalu di kiri, kemudian di kanan, dan bahwa jubah serta mengangkat bantal membantu pencernaan {cite:canon-ibn-sina-print-v1 hlm.229}."
