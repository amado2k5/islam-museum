tags: [akhlaq-browser, akhlaq-namima, dua-browser, dua-occasion, dua-occ-guarding-the-tongue]
label:
  ar: حفظ اللسان
  en: Guarding the tongue
  es: "Protegiendo la lengua"
  fr: "Protéger sa langue"
  ur: "زبان کی حفاظت کرنا"
  tr: "Dili korumak"
  id: "Menjaga Mulut"
summary:
  ar: "حفظ اللسان عند ابن رجب ملاك أعمال الدين كلها؛ ففي حديث معاذ لما أخبره النبي بأبواب الخير ثم برأس الأمر وعموده وذروة سنامه قال «ألا أخبرك بملاك ذلك كله؟» فأخذ بلسانه وقال «كف عليك هذا» ولما سأل معاذ وإنا لمؤاخذون بما نتكلم به قال «ثكلك أمك وهَل يكب الناس في النار على وجوههم — أو على مناخرهم — إلا حصائد ألسنتهم»؛ ويقارنه حديث أبي هريرة «من كان يؤمن بالله واليوم الآخر فليقل خيراً أو ليصمت» ⁦(الحديث الخامس عشر)⁩ وإشارة النبي إلى لسانه في حديث سفيان الثقفي حين سأل ما أتقي ⁦(الحديث الحادي والعشرون)⁩ — فاللسان عضو واحد وحصاده أكثر ما يكب الناس في النار كما صرحت به أحاديث الأربعين المتكررة."
  en: "Guarding the tongue is, for Ibn Rajab, the controlling element of all religious practice: in Mu'adh's hadith, after the gates of good and the head-pillar-peak of the matter, the Prophet asked 'shall I tell you of what controls all of that?', took hold of his own tongue and said 'restrain this', and when Mu'adh asked whether people are taken to account for their speech he answered 'may your mother be bereft of you — are people thrown onto their faces, or their nostrils, in the Fire for anything but the harvest of their tongues?'; it stands alongside Abu Hurayra's 'whoever believes in God and the Last Day let him speak good or keep silent' (hadith 15) and the Prophet's gesture to his own tongue when Sufyan al-Thaqafi asked what to guard against (hadith 21) — one organ whose harvest is the commonest cause of people being pitched into the Fire, as the repeated hadiths of the Forty declare."
  es: "Para Ibn Rajab, controlar la lengua es el elemento fundamental de toda práctica religiosa: en el hadiz de Mu'adh, tras las puertas del bien y el punto culminante del asunto, el Profeta preguntó: \"¿Os diré qué controla todo eso?\", tomó su propia lengua y dijo: \"Refrenad esto\", y cuando Mu'adh preguntó si se les pide cuentas a las personas por sus palabras, respondió: \"¡Que tu madre te prive! ¿Acaso se arroja a las personas de cara o por las fosas nasales al Fuego por algo que no sea la cosecha de sus lenguas?\". Esto se sitúa junto al hadiz de Abu Hurayra: \"Quien crea en Dios y en el Último Día, que hable bien o que guarde silencio\" (hadiz 15), y el gesto del Profeta hacia su propia lengua cuando Sufyan al-Thaqafi preguntó de qué protegerse (hadiz 21), un órgano cuya cosecha es la causa más común de que las personas sean arrojadas al Fuego, como declaran los repetidos hadices de los Cuarenta."
  fr: "Pour Ibn Rajab, la maîtrise de la langue est l'élément fondamental de toute pratique religieuse: dans le hadith rapporté par Mu'adh, après avoir abordé les portes du bien et le sommet de la question, le Prophète demanda: « Voulez-vous que je vous révèle ce qui régit tout cela ? », puis il prit sa propre langue et dit: « Maîtrisez-la. » Lorsque Mu'adh demanda si les gens seraient tenus responsables de leurs paroles, il répondit: « Que ta mère soit maudite ! Les gens sont-ils jetés face contre terre ou par les narines dans le Feu pour autre chose que les fruits de leurs paroles ? » Ce hadith rejoint celui d'Abu Hurayra: « Quiconque croit en Dieu et au Jour dernier, qu'il dise du bien ou qu'il se taise » (hadith 15), ainsi que le geste du Prophète envers sa propre langue lorsque Sufyan al-Thaqafi demanda ce qu'il fallait éviter (hadith 21) – la langue étant l'un des organes dont les fruits sont la cause la plus fréquente de la damnation éternelle, comme le déclarent à maintes reprises les Quarante hadiths."
  ur: "ابن رجب کے لیے زبان کی حفاظت تمام مذہبی عبادات کا کنٹرول کرنے والا عنصر ہے: معاذ کی حدیث میں، خیر کے دروازے اور معاملے کی سربلندی کے بعد، نبی نے پوچھا، 'کیا میں تمہیں بتاؤں کہ ان سب چیزوں کا کنٹرول کیا ہے؟'، اپنی زبان کو پکڑ کر کہا، 'اسے روکو'، اور جب ان سے پوچھا گیا کہ کیا تمہاری ماں سے ان کی زبانی کا حساب لیا جائے گا؟ تم سے محروم رہو - کیا لوگوں کو ان کے چہروں پر یا ان کے نتھنوں پر آگ میں ڈالا جاتا ہے سوائے ان کی زبانوں کی فصل کے؟'; یہ ابو ہریرہ کے ساتھ کھڑا ہے 'جو شخص خدا اور یوم آخرت پر ایمان رکھتا ہے وہ اچھی بات کرے یا خاموش رہے' ⁦(حدیث 15)⁩ اور نبی کا اپنی زبان کی طرف اشارہ جب سفیان ثقفی نے پوچھا کہ کس چیز سے بچنا ہے ⁦(حدیث 21)⁩ - ایک عضو جس کی فصل کا سب سے عام سبب ہے کہ لوگوں کو آگ کے طور پر دہرایا گیا تھا۔"
  tr: "İbn Receb dili tüm dini işlerin meleği olarak korur; Mu'adh'ın hadislerinde, Peygamber ona iyilik ayetlerini, ardından bimahının başını, sütununu ve zirvesini bildirdiğinde, \"Size tüm bunları meleğe söylemeyeyim mi?\" dedi. Dilini aldı ve dedi ki, \"Bunu bırak.\" Muadh \"Söylediklerimizden sorumluyuz,\" diye sorduğunda, \"Annen yas tuttu. İnsanlar ateşe yüzlerine — ya da burunlar — dillerinin hasadı hariç?\" Bunu Ebu Hureyre'nin hadisiyle karşılaştırır: \"Allah'a ve Ahiret Gün'e inanan kişi iyi söylesin ya da susmalıdır\" (on beşinci hadis). Peygamber'in, Sufyan el-Tekafi'nin hadisinde diline atıfta bulunması, daha kaçınmanın (yirmi birinci hadis) ne olduğunu sorarken — dil tek uzuvdur ve insanların ateşe attıklarının çoğunu biçtir, kırkın tekrar eden hadislerinde açıkça belirtildiği gibi."
  id: "Ibn Rajab mempertahankan lidah sebagai malaikat dalam segala urusan agama; dalam hadits Mu'adh, ketika Nabi memberitahukan tentang pasal kebaikan, lalu kepala, tiang, dan puncak bimahnya, dia berkata, \"Bukankah aku harus memberitahumu malaikat tentang semua itu?\" Dia mengambil lidahnya dan berkata, \"Berhenti.\" Ketika Mu'adh bertanya, \"Kami bertanggung jawab atas apa yang kami katakan,\" dia berkata, \"Ibumu berduka. Apakah orang membuang ke dalam api dengan wajah mereka — atau pada hidung mereka — kecuali hasil panen dari lidah mereka?\" Ia membandingkannya dengan hadis Abu Huraira: \"Siapa yang percaya kepada Allah dan Hari Terakhir harus berkata baik atau diam\" (hadis kelima belas). Rujukan Nabi pada lidahnya dalam hadis Sufyan al-Thaqafi ketika ia bertanya apa yang lebih pantang (hadis kedua puluh satu) — lidah adalah satu cabang dan menuai sebagian besar apa yang dibuang ke api, seperti yang telah dinyatakan secara eksplisit dalam hadits berulang tahun empat puluh tahun."
