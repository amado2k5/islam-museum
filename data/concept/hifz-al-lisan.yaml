id: concept/hifz-al-lisan
class: concept
kind: ethical
label:
  ar: حفظ اللسان
  en: Guarding the tongue
summary:
  ar: "حفظ اللسان عند ابن رجب ملاك أعمال الدين كلها؛ ففي حديث معاذ لما أخبره النبي بأبواب الخير ثم برأس الأمر وعموده وذروة سنامه قال «ألا أخبرك بملاك ذلك كله؟» فأخذ بلسانه وقال «كف عليك هذا» ولما سأل معاذ وإنا لمؤاخذون بما نتكلم به قال «ثكلك أمك وهَل يكب الناس في النار على وجوههم — أو على مناخرهم — إلا حصائد ألسنتهم»؛ ويقارنه حديث أبي هريرة «من كان يؤمن بالله واليوم الآخر فليقل خيراً أو ليصمت» (الحديث الخامس عشر) وإشارة النبي إلى لسانه في حديث سفيان الثقفي حين سأل ما أتقي (الحديث الحادي والعشرون) — فاللسان عضو واحد وحصاده أكثر ما يكب الناس في النار كما صرحت به أحاديث الأربعين المتكررة."
  en: "Guarding the tongue is, for Ibn Rajab, the controlling element of all religious practice: in Mu'adh's hadith, after the gates of good and the head-pillar-peak of the matter, the Prophet asked 'shall I tell you of what controls all of that?', took hold of his own tongue and said 'restrain this', and when Mu'adh asked whether people are taken to account for their speech he answered 'may your mother be bereft of you — are people thrown onto their faces, or their nostrils, in the Fire for anything but the harvest of their tongues?'; it stands alongside Abu Hurayra's 'whoever believes in God and the Last Day let him speak good or keep silent' (hadith 15) and the Prophet's gesture to his own tongue when Sufyan al-Thaqafi asked what to guard against (hadith 21) — one organ whose harvest is the commonest cause of people being pitched into the Fire, as the repeated hadiths of the Forty declare."
