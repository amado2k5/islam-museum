summary:
  ar: "اليد في اللغة من المنكب إلى أطراف الأصابع، وتطلق على النعمة والقدرة والسلطان. وأحكامها في الفقه: الاستنجاء باليسرى، وغسل اليدين في الوضوء وفي الإناء، ورفع الجنابة عن اليد وأثرها في استعمال الماء، ومسح اليد بالتراب في التيمم، وهيئة اليدين في الصلاة والدعاء، وعد الآي والتسبيح بالأصابع، ووضع اليد على الفم عند التثاؤب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17974}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17983}"
  en: "Yad is the hand from the shoulder to the fingertips; its lexical senses include blessing, power and authority. Its rulings in fiqh cover cleaning with the left hand, washing the hands for wudu' and at the vessel, whether a dipped hand makes water used, wiping with earth in tayammum, hand positions and counting in prayer, covering the mouth at a yawn, and raising the hands in supplication. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17974}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17983}"
  es: "Yad es la mano desde el hombro hasta la punta de los dedos; sus significados léxicos incluyen bendición, poder y autoridad. Sus normas en fiqh abarcan la limpieza con la mano izquierda, el lavado de manos para el wudu' y en el recipiente, si una mano sumergida hace que el agua se utilice, la limpieza con tierra en tayammum, las posiciones de las manos y el conteo en la oración, cubrirse la boca al bostezar y levantar las manos en súplica. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17974}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17983}"
  fr: "Yad désigne la main, de l'épaule au bout des doigts; son sens lexical inclut bénédiction, pouvoir et autorité. En fiqh, ses règles concernent le nettoyage avec la main gauche, le lavage des mains pour les ablutions (wudu') et au niveau du récipient sacré, la validité de l'eau utilisée pour les ablutions (l'imprégnation de la main), l'essuyage avec de la terre lors du tayammum, les positions des mains et le décompte des prières, le fait de se couvrir la bouche en bâillant et l'élévation des mains en supplication. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17974}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17983}"
