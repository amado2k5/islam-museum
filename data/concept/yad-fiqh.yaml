  en: "Yad (hand, fiqh)"
summary:
  ar: "اليد في اللغة من المنكب إلى أطراف الأصابع، وتطلق على النعمة والقدرة والسلطان. وأحكامها في الفقه: الاستنجاء باليسرى، وغسل اليدين في الوضوء وفي الإناء، ورفع الجنابة عن اليد وأثرها في استعمال الماء، ومسح اليد بالتراب في التيمم، وهيئة اليدين في الصلاة والدعاء، وعد الآي والتسبيح بالأصابع، ووضع اليد على الفم عند التثاؤب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17974}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17983}"
  en: "Yad is the hand from the shoulder to the fingertips; its lexical senses include blessing, power and authority. Its rulings in fiqh cover cleaning with the left hand, washing the hands for wudu' and at the vessel, whether a dipped hand makes water used, wiping with earth in tayammum, hand positions and counting in prayer, covering the mouth at a yawn, and raising the hands in supplication. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17974}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17983}"
