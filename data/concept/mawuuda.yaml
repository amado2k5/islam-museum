id: concept/mawuuda
class: concept
kind: ethical
label:
  ar: "الموءودة"
  en: "The buried infant girl (maw'uda)"
  ur: "زندہ دفن کی گئی بچی"
  es: "La niña enterrada (maw'uda)"
  fr: "La petite fille enterrée (maw'uda)"
summary:
  ar: "الموءودة هي الجارية المولودة التي كان بعض العرب في الجاهلية يدفنها وهي حية خشية الفقر أو العار، فجاء القرآن يسأل عنها بأي ذنب قُتلت، ويذم من يمسكها على هون أو يدسها في التراب إذا بُشر بالأنثى، حتى صار وأد البنات من أظهر ما نهى عنه الإسلام وأبطله بالحكم لا بالوعظ فقط."
  en: "The maw'uda is the newborn girl whom some Arabs of the Jahiliyya buried alive out of fear of poverty or shame. The Qur'an asks her by what sin she was killed, and condemns the man who, given news of a daughter, keeps her in humiliation or buries her in the dust — so that infanticide became one of the practices Islam abolished by ruling, not by exhortation alone."
  ur: "موءودہ وہ نوزائیدہ بچی ہے جسے جاہلیت کے بعض عرب غربت یا عار کے خوف سے زندہ دفنا دیتے تھے۔ قرآن اس سے پوچھتا ہے کہ وہ کس گناہ پر مار ڈالی گئی، اور اس شخص کی مذمت کرتا ہے جو بیٹی کی خبر پر اسے خوار رکھتا ہے یا مٹی میں دبا دیتا ہے — یوں بچیوں کا قتل ان کاموں میں ہے جنہیں اسلام نے حکم سے ختم کیا نہ کہ صرف وعظ سے۔"
  es: "La maw'uda es la niña recién nacida a la que algunos árabes de la época preislámica enterraban viva por temor a la pobreza o la vergüenza. El Corán le pregunta por qué pecado fue asesinada y condena al hombre que, al enterarse de que tiene una hija, la mantiene humillada o la entierra en el polvo; así, el infanticidio se convirtió en una de las prácticas que el islam abolió mediante decretos, no solo mediante exhortaciones."
  fr: "La maw'uda désigne la fille nouveau-née que certains Arabes de la Jahiliyya enterraient vivante par crainte de la pauvreté ou de la honte. Le Coran interroge la mère sur le péché ayant entraîné sa mort et condamne l'homme qui, apprenant la naissance d'une fille, la garde dans l'humiliation ou l'enterre dans la poussière. Ainsi, l'infanticide est devenu l'une des pratiques abolies par l'islam, non par la seule exhortation, mais par la loi."
