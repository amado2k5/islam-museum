id: concept/kuttab-al-wahy
class: concept
kind: term
label:
  ar: كتّاب الوحي
  en: The scribes of the revelation
  ur: کاتبینِ وحی
summary:
  ar: "كان للنبي كتّاب يكتبون الوحي، منهم الخلفاء الأربعة ومعاوية وأبان بن سعيد وخالد بن الوليد وأبي بن كعب وزيد بن ثابت وثابت بن قيس وغيرهم، وكان يدعو أحدهم فيأمره بكتابة ما نزل ولو كلمة؛ وبقي القرآن مكتوباً متفرقاً قبل جمع أبي بكر {cite:manahil-irfan-sabt p. 312} {cite:itqan-suyuti p. 385}."
  en: "The Prophet had scribes who wrote down the revelation, among them the four caliphs, Mu'awiya, Aban ibn Sa'id, Khalid ibn al-Walid, Ubayy ibn Ka'b, Zayd ibn Thabit, Thabit ibn Qays and others; he would call one of them and order him to write what had come down, even a single word; the Qur'an was left written in scattered pieces until Abu Bakr's collection {cite:manahil-irfan-sabt p. 312} {cite:itqan-suyuti p. 385}."
  ur: "نبی کے کاتب تھے جو وحی لکھتے تھے، جن میں چاروں خلفاء، معاویہ، ابان بن سعید، خالد بن ولید، ابی بن کعب، زید بن ثابت، ثابت بن قیس اور دوسرے تھے؛ آپ ان میں سے کسی کو بلا کر جو اترا اسے لکھنے کا حکم دیتے خواہ ایک لفظ ہو؛ قرآن ابو بکر کے جمع سے پہلے متفرق صورت میں لکھا رہا {cite:manahil-irfan-sabt p. 312} {cite:itqan-suyuti p. 385}۔"
