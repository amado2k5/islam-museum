id: "concept/al-hayawanat-wa-al-dud-fi-al-udhun"
class: "concept"
kind: "scientific"
label:
  ar: "دخول الحيوانات في الأذن وتولد الدود فيها"
  en: "Animals entering the ear and worms breeding in it"
  fr: "Animaux entrant dans l'oreille et vers qui s'y développent"
  ur: "کان میں جانوروں کا داخل ہونا اور اس میں کیڑوں کا پیدا ہونا"
  es: "Animales que entran en el oído y gusanos que se reproducen en él."
  tr: "Kulağa giren ve içinde solucan üreyen hayvanlar"
  id: "Hewan yang masuk ke telinga dan berkembang biak cacing di dalamnya"
summary:
  ar: "قد يتفطن لدخول الهامة في الأذن بشدة الوجع مع خدش وحركة بمقدار الحيوان، وأما الدود فيحس معه بدغدغة؛ ومما يعم جميع ذلك تقطير ما يعرف في الأذن فإنه يسكن في الحال حركة الحيوان فيها ويقتلها عن قريب وخصوصاً الصغير ⁦⁦(أسماء الأدوية والعصارات والمركبات ومقاديرها لا تحمل)⁩⁩ {cite:canon-ibn-sina-print-v2 p.231} {cite:canon-ibn-sina-print-v2 p.232}"
  en: "An insect's entry into the ear is known by severe pain with scratching and movement to the animal's measure; worms are felt as a tickling. What covers all of it: dropping the known in the ear — it stills the animal's movement at once and kills it before long, especially the small kind ⁦(drug, juice and compound names and measures are not carried)⁩ {cite:canon-ibn-sina-print-v2 p.231} {cite:canon-ibn-sina-print-v2 p.232}"
  fr: "L'entrée d'un insecte dans l'oreille se reconnaît à une douleur intense, avec grattement et mouvement à la mesure de l'animal ; les vers se font sentir par un chatouillement. Ce qui couvre l'ensemble : instiller dans l'oreille le remède connu, qui arrête aussitôt le mouvement de l'animal et le tue peu après, surtout s'il est petit (les noms et doses des drogues, sucs et composés ne sont pas reproduits) {cite:canon-ibn-sina-print-v2 p.231} {cite:canon-ibn-sina-print-v2 p.232}"
  ur: "کان میں کیڑے مکوڑے کے داخل ہونے کا علم سخت درد سے ہوتا ہے ساتھ خراش اور جانور کے قد کے برابر حرکت؛ اور کیڑوں کے ساتھ گدگدی محسوس ہوتی ہے؛ اور جو سب پر عام نفع دیتا ہے وہ کان میں معروف چیز کا ٹپکانا ہے کہ وہ جانور کی حرکت فوراً روک دیتا ہے اور جلد مار دیتا ہے خصوصاً چھوٹے کو ⁦⁦(ادویہ، عصاروں اور مرکبات کے نام اور مقدار منقول نہیں)⁩⁩ {cite:canon-ibn-sina-print-v2 p.231} {cite:canon-ibn-sina-print-v2 p.232}"
  es: "La entrada de un insecto en el oído se reconoce por un dolor intenso con rascado y movimientos en la medida del animal; los gusanos se sienten como un cosquilleo. Lo que lo cubre todo: dejar caer el insecto en el oído: detiene los movimientos del animal de inmediato y lo mata en poco tiempo, especialmente a los pequeños (no se incluyen nombres ni medidas de medicamentos, jugos ni compuestos) {cite:canon-ibn-sina-print-v2 p.231} {cite:canon-ibn-sina-print-v2 p.232}"
  tr: "Ağrının kulağa girdiğini kaşıma ve hayvan büyüklüğünde hareketlerle fark edebilirler, solucanlar da bununla birlikte gıdıklanıyor; yaygın olan, hayvanın hareketi hemen yerleşip yakında onu öldürürken kulakta bilinen sıvının damlamasıdır (ilaçların, suların, bileşiklerin isimleri ve miktarları dahil edilmemiştir) {cite:canon-ibn-sina-print-v2 s.231} {cite:canon-ibn-sina-print-v2 s.232}"
  id: "Mereka mungkin merasakan nyeri masuk ke telinga melalui garukan dan gerakan sebesar hewan, dan cacing menggelitik bersamaan dengan hal ini; ciri umum adalah tetesan cairan yang diketahui di telinga saat gerakan hewan langsung tenang dan membunuhnya segera (nama dan jumlah obat, air, dan senyawa tidak termasuk) {cite:canon-ibn-sina-print-v2 hlm.231} {cite:canon-ibn-sina-print-v2 hlm.232}"
