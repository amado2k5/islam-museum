id: concept/al-shay-alladhi-yaqa-fi-al-anf
class: concept
kind: scientific
label:
  ar: الشيء الذي يقع في الأنف
  en: The thing that falls into the nose
  fr: "Corps étranger introduit dans le nez"
  ur: ناک میں گر جانے والی چیز
  es: "Lo que cae en la nariz"
  tr: "Burna düşen şey"
  id: "Sesuatu yang terlalu tepat"
summary:
  ar: الشيء الذي يقع في الأنف يعطس صاحبه ببعض الأدوية من جنس ما يعرف ويؤخذ على فمه ومنخره الصحيح فإذا عطس خرج منه الشيء وكأن هذا مما سلف ذكره {cite:canon-ibn-sina-print-v2 p.252}
  en: 'For the thing that falls into the nose: its owner is made to sneeze by one of the drugs of the known kind while his mouth and sound nostril are held shut; when he sneezes, the thing comes out — as though it were among what was mentioned before {cite:canon-ibn-sina-print-v2 p.252}'
  fr: "Pour un corps étranger introduit dans le nez, le livre décrit le déclenchement d’un éternuement à l’aide d’un remède du genre connu, alors que la bouche et la narine saine sont maintenues fermées. Le corps est expulsé par l’éternuement, comme dans ce qui semble avoir été mentionné plus haut {cite:canon-ibn-sina-print-v2 p.252}"
  ur: 'ناک میں گر جانے والی چیز کے لیے: صاحب کو معروف جنس کی کسی دوا سے چھینک دلوائی جاتی ہے جب کہ منہ اور صحیح نتھنا بند رکھا جاتا ہے؛ چھینک آنے پر وہ چیز باہر نکل آتی ہے — اور گویا یہ پہلے ذکر شدہ میں سے ہے {cite:canon-ibn-sina-print-v2 p.252}'
  es: "Para la cosa que cae en la nariz: a su dueño se le hace estornudar con uno de los fármacos conocidos mientras se le mantiene la boca y la fosa nasal sana cerradas; cuando estornuda, la cosa sale, como si estuviera entre lo mencionado anteriormente {cite:canon-ibn-sina-print-v2 p.252}"
  tr: "Buruna ulaşan şey, kişinin ağız ve burun deliğine bilinen ve alınan türden bazı ilaçlarla hapşırmasına neden olur ve hapşırırken, sanki bu daha önce bahsedilmiş bir şeymiş gibi çıkar {cite:canon-ibn-sina-print-v2 s.252}"
  id: "Apa yang sampai ke hidung menyebabkan orang bersin ke mulut dan lubang hidung dengan obat tertentu yang sudah dikenal dan diminum, dan saat bersin, hasilnya seperti sesuatu yang telah disebutkan sebelumnya {cite:canon-ibn-sina-print-v2 hlm.252}"
