summary:
  ar: "التحجر ورم صغير يدمي ويتحجر، وقد يخلص منه عمل اليد ثم تستعمل الأدوية المجففة {cite:canon-ibn-sina-print-v2 p.197}"
  en: "Tahajjur is a small tumour that bleeds and turns stony; the hand's work may clear it, and then the desiccant medicines are used {cite:canon-ibn-sina-print-v2 p.197}"
  fr: "Le tahajjur est une petite tumeur qui saigne et devient dure comme la pierre. Une intervention manuelle peut la faire disparaître ; on emploie ensuite des remèdes dessiccatifs {cite:canon-ibn-sina-print-v2 p.197}"
  ur: "تحجر ایک چھوٹی سوجن ہے جو خون بہاتی اور پتھر سی ہو جاتی ہے؛ دستی عمل اسے نکال سکتا ہے اور پھر مجفف ادویہ استعمال ہوتی ہیں {cite:canon-ibn-sina-print-v2 p.197}۔"
  es: "El tahajjur es un pequeño tumor que sangra y se endurece; el trabajo manual puede eliminarlo, y luego se utilizan medicamentos desecantes {cite:canon-ibn-sina-print-v2 p.197}"
  tr: "Osteoporoz, kanama ve taşlaşma yapan küçük bir tümördür ve manuel emekle çıkarılabilir, ardından kurutulmuş ilaçlar kullanılır {cite:canon-ibn-sina-print-v2 s.197}"
  id: "Osteoporosis adalah tumor kecil yang berdarah dan mengeras serta dapat diangkat dengan kerja manual, diikuti dengan penggunaan obat kering {cite:canon-ibn-sina-print-v2 hlm.197}"
