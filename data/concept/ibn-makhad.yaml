id: concept/ibn-makhad
class: concept
kind: legal
label: { ar: "ابن المخاض", en: "Young male camel in its second year (ibn makhad)" }
summary:
  ar: "تعرّف الموسوعة الفقهية الكويتية ابن المخاض بأنه ولد الناقة إذا دخل في السنة الثانية، سمي بذلك لأن أمه قد لحقت بالمخاض، أي الحوامل، وإن لم تكن حاملاً. وفي الزكاة: الأصل عدم إجزائه، وأجاز الحنفية أخذه بقيمة بنت المخاض لأن القيمة تجزئ عندهم في كل أصناف الزكاة. وفي الدية: يجوز أن يدخل في أصناف المخففة عند الحنفية والحنابلة وفي رأي للشافعية، وعند المالكية، وهو الراجح عند الشافعية، لا يجوز. واتفقوا على أنه لا يدخل في أصناف الدية المغلظة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1466} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1467}"
  en: "The Kuwaiti encyclopedia defines ibn makhad as the young of a she-camel that has entered its second year; it is so named because its mother has joined the pregnant (makhad) even if she is not pregnant. On zakat, the basic rule is that it is not sufficient; the Hanafis allow taking it at the value of a bint makhad, since value suffices for every kind of zakat in their view. On blood money, it may be counted among the categories of the light diya according to the Hanafis, the Hanbalis and one Shafi'i view, and the Malikis, and the accepted Shafi'i view, deny it. The jurists agree that it is not one of the categories of the heavy diya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1466} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1467}"
