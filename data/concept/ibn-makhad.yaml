label: { ar: "ابن المخاض", en: "Young male camel in its second year (ibn makhad)", es: "Camello macho joven de dos años (Ibn Makhad)", fr: "Jeune chameau mâle dans sa deuxième année (ibn makhad)", ur: "نوجوان اونٹ دوسرے سال میں ⁦(ابن مخد)⁩", tr: "Emek oğlu", id: "Anak pekerja" }
summary:
  ar: "تعرّف الموسوعة الفقهية الكويتية ابن المخاض بأنه ولد الناقة إذا دخل في السنة الثانية، سمي بذلك لأن أمه قد لحقت بالمخاض، أي الحوامل، وإن لم تكن حاملاً. وفي الزكاة: الأصل عدم إجزائه، وأجاز الحنفية أخذه بقيمة بنت المخاض لأن القيمة تجزئ عندهم في كل أصناف الزكاة. وفي الدية: يجوز أن يدخل في أصناف المخففة عند الحنفية والحنابلة وفي رأي للشافعية، وعند المالكية، وهو الراجح عند الشافعية، لا يجوز. واتفقوا على أنه لا يدخل في أصناف الدية المغلظة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1466} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1467}"
  en: "The Kuwaiti encyclopedia defines ibn makhad as the young of a she-camel that has entered its second year; it is so named because its mother has joined the pregnant (makhad) even if she is not pregnant. On zakat, the basic rule is that it is not sufficient; the Hanafis allow taking it at the value of a bint makhad, since value suffices for every kind of zakat in their view. On blood money, it may be counted among the categories of the light diya according to the Hanafis, the Hanbalis and one Shafi'i view, and the Malikis, and the accepted Shafi'i view, deny it. The jurists agree that it is not one of the categories of the heavy diya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1466} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1467}"
  es: "La enciclopedia kuwaití define ibn makhad como la cría de una camella que ha entrado en su segundo año; se denomina así porque su madre se ha unido a la preñada (makhad) aunque no esté preñada. En cuanto al zakat, la regla básica es que no es suficiente; los hanafíes permiten tomarlo por el valor de una bint makhad, ya que, en su opinión, el valor es suficiente para todo tipo de zakat. Respecto a la indemnización por derramamiento de sangre, puede contarse entre las categorías de la diya ligera según los hanafíes, los hanbalíes y una opinión shafi'í, mientras que los malikíes y la opinión shafi'í aceptada lo niegan. Los juristas coinciden en que no pertenece a las categorías de la diya pesada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1466} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1467}"
  fr: "L'encyclopédie koweïtienne définit « ibn makhad » comme le petit d'une chamelle ayant atteint l'âge de deux ans; il est ainsi nommé car sa mère est « mûre » (makhad) même si elle ne l'est pas. Concernant la zakat, la règle générale est qu'elle est insuffisante; les hanafites autorisent à la prélever à hauteur de la valeur d'une bint makhad, considérant que la valeur suffit pour tout type de zakat. Quant au prix du sang, il peut être comptabilisé parmi les diya légères selon les hanafites, les hanbalites et une opinion chaféite, tandis que les malikites et l'opinion chaféite communément admise le nient. Les juristes s'accordent à dire qu'il ne fait pas partie des diya lourdes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1466} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1467}"
  ur: "کویتی انسائیکلوپیڈیا نے ابن مخاد کو اونٹنی کا بچہ قرار دیا ہے جو اپنے دوسرے سال میں داخل ہو چکی ہے۔ اس کا نام اس لیے رکھا گیا ہے کہ اس کی ماں حاملہ ⁦(مکھاد)⁩ میں شامل ہو گئی ہے اگرچہ وہ حاملہ نہ ہو۔ زکوٰۃ کا بنیادی قاعدہ یہ ہے کہ یہ کافی نہیں ہے۔ احناف اسے بنت مخاد کی قیمت پر لینے کی اجازت دیتے ہیں کیونکہ ان کی نظر میں ہر قسم کی زکوٰۃ کی قیمت کافی ہے۔ خون کے معاملے میں احناف، حنبلی اور ایک شافعی کے قول کے مطابق اسے ہلکی دیا کے زمروں میں شمار کیا جا سکتا ہے، اور مالکیہ اور شافعی کا مسلک اس کا انکار کرتے ہیں۔ فقہاء کا اتفاق ہے کہ یہ بھاری دیا کے زمروں میں سے نہیں ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1466}"
  tr: "Kuveyt Fıkıh Ansiklopedisi, dişi devenin çocuğunu, annesi doğuma ulaştığı için ikinci yılda dişi deve doğurmuş olarak tanımlar; bu isim, annesi doğum sancına ulaştığı anlamına gelir, yani hamile kadın kadın, hamile olmasa bile. Zekatta: varsayılan olarak boğulmaması ve Hanefiler, tüm zekatlarda onlar için yeterli olan bir emek kızı değeri karşılığında deveyi almaya izin vermiştir. Kan parası ile ilgili olarak: Hanefiler ve Hanbalilere göre hafif kan parası kategorileri arasına dahil edilmesi caizdir; Şafii ve Maliki mezheblerine göre ise Şafiiler arasında tercih edilen görüş budur ve bu cevaba izin verilmez. Ağır kan parası kategorileri arasında yer almadığı konusunda hemfikirlerdir. {atıft:] fiqh-mawsua-kuwaitiyya-noor-v3 s.1466} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1467}"
  id: "Ensiklopedia Yurisprudensi Kuwait mendefinisikan anak unta betina sebagai telah melahirkan unta betina pada tahun kedua, dinamai demikian karena ibunya telah melahirkan, artinya wanita hamil, meskipun dia tidak hamil. Dalam zakat: defaultnya adalah unta tidak dicekik, dan Hanafi mengizinkan mengambilnya dengan nilai anak perempuan karena nilainya cukup untuk mereka dalam semua jenis zakat. Mengenai uang darah: diperbolehkan memasukkan uang itu ke dalam kategori uang darah ringan menurut Hanafi dan Hanbali, dan menurut aliran Shafi'i dan Maliki, yang merupakan pandangan favorit di kalangan Shafi'i, itu tidak diperbolehkan. Mereka sepakat bahwa uang itu tidak termasuk dalam kategori uang darah berat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1466} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1467}"
