  tr: "Sahiplenme nedenleri"
  id: "Alasan kepemilikan"
summary:
  ar: 'يبدأ المؤلف بالأسباب الممنوعة: الربا والاحتكار والغرر والقمار والرشوة والسرقة والغصب والغش ومهر البغي وحلوان الكاهن وثمن الخمر والخنزير وسائر المحرمات {cite:usul-iqtisad-islami-0660 p. 53}. وما حيز بهذه الوجوه لا يحل لحائزه، ويجب البحث عن أصحابه ليردّ إليهم، فإن تعذر صُرف على الفقراء أو في المصالح العامة {cite:usul-iqtisad-islami-0660 p. 53}. أما الأسباب المباحة فهي ولادة المملوك، وإحراز المباح كالحشيش والحطب والصيد وإحياء الأرض وغنائم الحربيين، والإرث، والدية وضمان التالف، والمعاوضة كالبيع، والتبرع كالهبة والوصية والصدقة والكفارة والنذر والنفقة الواجبة {cite:usul-iqtisad-islami-0660 p. 54}. ويصنف المؤلف هذه الأسباب إلى ما ينشأ عن عمل وعن مال وعن حاجة وعن صلة رحم وعن صلة اجتماعية، وإلى إجباري كالإرث واختياري كالبيع {cite:usul-iqtisad-islami-0660 p. 54}.'
  tr: "Yazar yasak nedenlerle başlar: tefecilik, tekel, belirsizlik, kumar, rüşvet, hırsızlık, gasp, dolandırıcılık, fahişenin çeyizi, rahibin hediyesi, şarap, domuz eti ve diğer yasak işlemler {cite:usul-iqtisad-islami-0660 s. 53}. Bu durumlarda izin verilen şey, sahibine izin verilmez ve eğer yoksullara veya kamu yararına harcanması mümkün değilse, sahiplerinden geri verilmesini talep etmek gerekir {cite:usul-iqtisad-islami-0660 s. 53}. İzin verilen nedenler ise sahip olunan mülkün doğumu, haşiş, odun, avcılık, toprak ve savaş ganimetleri gibi izin verilen eşyaların edinilmesi, miras, kan parası ve zararın garantilenmesi, satış gibi takas, bağışlar (hediyeler, vasiyetler, sadaka, kefaret, yeminler ve zorunlu bakım {cite:usul-iqtisad-islami-0660 s. 54} Yazar bu nedenleri iş, para, ihtiyaç, akrabalık bağları ve sosyal bağlardan kaynaklanan nedenler ile zorunlu olanlar olarak sınıflandırır (miras ve gönüllü satış gibi şeyler {cite:usul-iqtisad-islami-0660 s. 54}."
  id: "Penulis memulai dengan penyebab terlarang: riba, monopoli, ketidakpastian, perjudian, suap, pencurian, perebutan tahta, penipuan, mas kawin pelacur, hadiah dari imam, harga anggur, daging babi, dan tindakan terlarang lainnya {cite:usul-iqtisad-islami-0660 hlm. 53}. Apa yang diperbolehkan dalam kasus-kasus ini tidak diperbolehkan bagi pemiliknya, dan perlu meminta pemiliknya mengembalikannya kepada mereka, jika tidak mungkin digunakan untuk orang miskin atau kepentingan publik {cite:usul-iqtisad-islami-0660 hlm. 53}. Adapun penyebab yang diperbolehkan, mereka adalah kelahiran dari properti yang dimiliki, memperoleh barang-barang yang diperbolehkan seperti hashish, kayu bakar, berburu, menghidupkan kembali tanah dan rampasan perang, warisan, uang darah dan jaminan kerusakan, pertukaran seperti penjualan, donasi seperti hadiah, wasiat, amal, penebusan, janji, dan pemeliharaan wajib {cite:usul-iqtisad-islami-0660 hlm. 54}. Penulis mengklasifikasikan sebab-sebab ini menjadi apa yang muncul dari pekerjaan, uang, kebutuhan, ikatan kekerabatan, dan ikatan sosial, serta wajib seperti warisan dan penjualan sukarela yang serupa {cite:usul-iqtisad-islami-0660 hlm. 54}."
