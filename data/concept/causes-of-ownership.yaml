label:
  ar: أسباب التملك
  en: Causes of ownership
summary:
  ar: 'يبدأ المؤلف بالأسباب الممنوعة: الربا والاحتكار والغرر والقمار والرشوة والسرقة والغصب والغش ومهر البغي وحلوان الكاهن وثمن الخمر والخنزير وسائر المحرمات {cite:usul-iqtisad-islami-0660 p. 53}. وما حيز بهذه الوجوه لا يحل لحائزه، ويجب البحث عن أصحابه ليردّ إليهم، فإن تعذر صُرف على الفقراء أو في المصالح العامة {cite:usul-iqtisad-islami-0660 p. 53}. أما الأسباب المباحة فهي ولادة المملوك، وإحراز المباح كالحشيش والحطب والصيد وإحياء الأرض وغنائم الحربيين، والإرث، والدية وضمان التالف، والمعاوضة كالبيع، والتبرع كالهبة والوصية والصدقة والكفارة والنذر والنفقة الواجبة {cite:usul-iqtisad-islami-0660 p. 54}. ويصنف المؤلف هذه الأسباب إلى ما ينشأ عن عمل وعن مال وعن حاجة وعن صلة رحم وعن صلة اجتماعية، وإلى إجباري كالإرث واختياري كالبيع {cite:usul-iqtisad-islami-0660 p. 54}.'
