summary:
  ar: "الحناء شجرة ورقها شبيه بورق الزيتون وأوسع وألين، وبزرها أسود؛ طبيعتها باردة في الأولى يابسة في الثانية، وتُذكر لها منافع في الشعر والأورام والجراح والمفاصل والصداع وقروح الفم، ومن بينها منفعة رحمية مُعلَّمة."
  en: "Henna is a tree with leaves like olive but wider and softer, and a black seed. It is cold in the first degree and dry in the second. The book lists uses for hair, swellings, wounds, joints, headache and mouth sores, and one labelled womb listing."
  ur: "حنّاء ایک درخت ہے جس کے پتے زیتون جیسے مگر چوڑے اور نرم ہیں، اور بیج سیاہ ہے؛ یہ پہلے درجے میں ٹھنڈی اور دوسرے میں خشک ہے۔ کتاب بالوں، سوجن، زخموں، جوڑوں، سردرد اور منہ کے چھالوں کے فوائد درج کرتی ہے، اور رحم کے درد کی ایک مُعلَّم فہرست بھی ہے۔"
  es: "La henna es un árbol con hojas parecidas a las del olivo, pero más anchas y suaves, y una semilla negra. Es fría en primer grado y seca en segundo. El libro enumera usos para el cabello, hinchazones, heridas, articulaciones, dolor de cabeza y llagas en la boca, y uno específico para el útero."
  fr: "Le henné provient d'un arbre aux feuilles semblables à celles de l'olivier, mais plus larges et plus douces, et dont les graines sont noires. Il fait froid au premier degré et sec au second. Le livre énumère ses utilisations pour les cheveux, les gonflements, les plaies, les articulations, les maux de tête et les aphtes, ainsi qu'une liste intitulée « utérus »."
  tr: "Kına, yaprakları zeytin yapraklarına benzeyen, daha geniş ve yumuşak olan, tohumları siyah olan bir ağaçtır; doğası ilkinde soğuk, ikincisinde ise kurudur. Saç, tümörler, yaralar, eklemler, baş ağrıları ve ağız ülserleri gibi belirgin rahim faydalarıyla bilinir."
  id: "Henna adalah pohon yang daunnya menyerupai daun zaitun, lebih lebar dan lembut, serta bijinya berwarna hitam; sifatnya dingin pada daun pertama dan kering pada pohon kedua. Henna dikenal memiliki manfaat pada rambut, tumor, luka, sendi, sakit kepala, dan tukak mulut, termasuk manfaat yang sangat mencolok pada rahim."
