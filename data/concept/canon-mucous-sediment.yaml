id: concept/canon-mucous-sediment
class: concept
kind: scientific
label:
  ar: "الرسوب المخاطي عند ابن سينا"
  en: "Mucous sediment in the Canon"
  fr: "Sédiment muqueux dans le Canon"
  ur: "لیس دار تلچھٹ قانون میں"
  es: "Sedimento mucoso en el cañón"
summary:
  ar: "يبين ابن سينا أن الرسوب المخاطي يدل على خلط غليظ خام، وقد يكون بحراناً مدفوعاً عن آلات البول، ويحذر من الاغترار بما يشبه الرسوب المحمود في غير وقت النضج. {cite:canon-ibn-sina-print-v1 p.195}."
  en: "Ibn Sina says mucous sediment shows thick, raw humour and may be a crisis pushed out through the urinary organs, and he warns against being fooled by what looks like praiseworthy sediment when it is not the time of maturation. {cite:canon-ibn-sina-print-v1 p.195}."
  fr: "Ibn Sina y voit humeur crue épaisse ou crise évacuée par voies urinaires ; il avertit de l’apparence trompeusement bonne hors du temps de maturation. {cite:canon-ibn-sina-print-v1 p.195}."
  es: "Ibn Sina afirma que el sedimento mucoso muestra un humor espeso y crudo, y que puede ser una crisis expulsada a través de los órganos urinarios. Advierte que no hay que dejarse engañar por lo que parece un sedimento saludable cuando no es el momento de la maduración. {cite:canon-ibn-sina-print-v1 p.195}."
  ur: "ابن سینا کا کہنا ہے کہ چپچپا تلچھٹ موٹی، خام مزاح کو ظاہر کرتا ہے اور پیشاب کے اعضاء کے ذریعے باہر دھکیلنے والا بحران ہوسکتا ہے، اور وہ انتباہ کرتا ہے کہ جب یہ پختگی کا وقت نہ ہو تو قابل تعریف تلچھٹ کی طرح نظر آنے سے بیوقوف نہ بنیں۔ {حوالہ: کینن ابن سینا پرنٹ v1 صفحہ 195}۔"
