  en: "Ibn Sina says mucous sediment shows thick, raw humour and may be a crisis pushed out through the urinary organs, and he warns against being fooled by what looks like praiseworthy sediment when it is not the time of maturation. {cite:canon-ibn-sina-print-v1 p.195}."
