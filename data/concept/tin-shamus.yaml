id: concept/tin-shamus
class: concept
kind: natural
label:
  ar: "طين شاموس"
  en: "Tin shamus (the Samos earth)"
  ur: "طین شاموس"
  es: "Tin shamus (la tierra de Samos)"
  fr: "Shamus en étain (la terre de Samos)"
  tr: "Shamos kili"
  id: "Tanah liat Shamos"
summary:
  ar: "طين يشبه المختوم في حبس الدم، وهو أخف وأعلك وألزج، ويمنع الأورام الحارة ابتداء، ويقال إنه يشبه الطلق، وينفع من النقرس طلاء."
  en: "An earth like the sealed earth in stopping blood, but lighter, gummier and stickier; it prevents hot swellings at their start, and it helps gout when applied."
  ur: "ایک مٹی جو خون روکنے میں مہر بند مٹی جیسی ہے، مگر ہلکی، گوندھ دار اور چپچپی ہے؛ یہ گرم سوجن کو ابتدا میں روکتی ہے اور گٹھیا میں لیپ سے فائدہ دیتی ہے۔"
  es: "Una tierra similar a la tierra sellada para detener el sangrado, pero más ligera, gomosa y pegajosa; previene la inflamación inicial y ayuda a aliviar la gota cuando se aplica."
  fr: "Une terre semblable à la terre scellée pour arrêter le saignement, mais plus légère, plus gommeuse et plus collante; elle prévient les gonflements chauds dès leur apparition et soulage la goutte lorsqu'elle est appliquée."
  tr: "Hapsa kapalı kana benzeyen kil, daha hafif, daha sakızlı ve yapışkandır, başlangıçta sıcak tümörleri önler. Talaq'a benzediği ve gut kaplaması olarak faydalı olduğu söylenir."
  id: "Tanah liat yang menyerupai darah tersegel dalam perangkap, yang lebih ringan, lebih lengket, dan lengket, awalnya mencegah tumor panas. Dikatakan menyerupai talaq dan berguna sebagai lapisan asam urat."
