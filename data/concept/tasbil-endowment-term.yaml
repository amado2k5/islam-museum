label:
  ar: "التسبيل"
  en: "Tasbil (dedicating a thing's benefit to a good cause, an endowment term)"
  ur: "تسبیل (کسی چیز کا فائدہ نیک کام کے لیے وقف کرنا)"
summary:
  ar: "التسبيل جعل الشيء في سبيل الله، ويطلق على الوقف، ولفظه صريح فيه عند الشافعية والحنابلة، والحنفية يحتاجون إلى النية، والمالكية يرون أن جعله في السبيل يقتضي التصدق بعينه ما لم توجد قرينة. والتسبيل قربة مندوب إليها باتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5064} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5065}"
  en: "Tasbil is making a thing a way to a good cause; it is also used for endowment. For the Shafi'is and Hanbalis the word is explicit for an endowment; the Hanafis need an intention; the Malikis hold that making a thing a way of good implies giving its substance in alms unless a sign shows that the endowment of the thing or its use is meant. It is a recommended act of nearness to God by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5064} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5065}"
