label:
  ar: "التسبيل"
  en: "Tasbil (dedicating a thing's benefit to a good cause, an endowment term)"
  ur: "تسبیل ⁦(کسی چیز کا فائدہ نیک کام کے لیے وقف کرنا)⁩"
  es: "Tasbil (dedicar el beneficio de algo a una buena causa, un término de donación)"
  fr: "Tasbil (dédié au bénéfice d'une chose à une bonne cause, terme de dotation)"
summary:
  ar: "التسبيل جعل الشيء في سبيل الله، ويطلق على الوقف، ولفظه صريح فيه عند الشافعية والحنابلة، والحنفية يحتاجون إلى النية، والمالكية يرون أن جعله في السبيل يقتضي التصدق بعينه ما لم توجد قرينة. والتسبيل قربة مندوب إليها باتفاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5064} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5065}"
  en: "Tasbil is making a thing a way to a good cause; it is also used for endowment. For the Shafi'is and Hanbalis the word is explicit for an endowment; the Hanafis need an intention; the Malikis hold that making a thing a way of good implies giving its substance in alms unless a sign shows that the endowment of the thing or its use is meant. It is a recommended act of nearness to God by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5064} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5065}"
  es: "Tasbil significa convertir algo en un medio para una buena causa; también se usa para referirse a una donación. Para los shafiíes y hanbalíes, la palabra es explícita para una donación; los hanafíes requieren una intención; los malikíes sostienen que convertir algo en un medio para el bien implica dar su sustancia en limosna, a menos que una señal indique que se pretende la donación de la cosa o su uso. Es un acto recomendado de cercanía a Dios mediante acuerdo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5064} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5065}"
  fr: "Le tasbil consiste à utiliser une chose pour une bonne cause; il est également employé pour désigner une dotation. Pour les écoles chaféite et hanbalite, le terme est explicite lorsqu'il s'agit d'une dotation; les hanafites exigent une intention; les malikites considèrent qu'utiliser une chose pour une bonne cause implique d'en donner la substance en aumône, à moins qu'un signe n'indique qu'il s'agit d'une dotation ou d'un usage particulier. C'est un acte recommandé de proximité avec Dieu par accord. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5064} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5065}"
