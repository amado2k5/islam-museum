label: { ar: "تأريخ الروم والقبط من وفاة الإسكندر", en: "The Roman and Coptic reckoning from Alexander's death", ur: "رومی اور قبطی تاریخ اسکندر کی وفات سے", es: "El cálculo romano y copto a partir de la muerte de Alejandro", fr: "Le calcul romain et copte à partir de la mort d'Alexandre", tr: "Büyük İskender'in ölümünden itibaren Romalıların ve Kıptilerin tarihi", id: "Sejarah Bangsa Romawi dan Koptik sejak kematian Alexander" }
summary:
  ar: "يذكر البتاني أن تأريخ الروم والقبط يعود إلى سنة وفاة الإسكندر الذي ملك مقدونية، وأن السنين الذو قرنية بعد ذلك تُحسب منه لتطابق الأيام الرومية والمصرية. {cite:zij-sabi-nallino-byblion p.101}."
  en: "Al-Battani says the Roman and Coptic reckoning goes back to the year of Alexander's death, the king of Macedon, and that the Dhu al-Qarnayn years are counted from it so that the Roman and Egyptian days agree. {cite:zij-sabi-nallino-byblion p.101}."
  ur: "البتانی کہتے ہیں کہ رومی اور قبطی تاریخ اسکندر مقدونی کی وفات کے سال سے شروع ہوتی ہے، اور اس کے بعد ذو القرنین کے سال اسی سے شمار ہوتے ہیں تاکہ رومی اور مصری دن آپس میں ملیں۔ {cite:zij-sabi-nallino-byblion p.101}۔"
  es: "Al-Battani afirma que el cómputo romano y copto se remonta al año de la muerte de Alejandro Magno, rey de Macedonia, y que los años de Dhu al-Qarnayn se cuentan a partir de ese año para que coincidan los días romanos y egipcios. {cite:zij-sabi-nallino-byblion p.101}."
  fr: "Al-Battani affirme que le calendrier romain et copte remonte à l'année de la mort d'Alexandre le Grand, roi de Macédoine, et que les années Dhu al-Qarnayn sont comptées à partir de cette date afin que les jours romains et égyptiens concordent. {cite:zij-sabi-nallino-byblion p.101}."
  tr: "Al-Battani, Roma ve Kıpti takviminin Makedonya'yı yöneten Büyük İskender'in ölüm yılına dayandığını ve bu tarihten sonraki iki yüzyılın Roma ve Mısır takvimleriyle örtüşecek şekilde sayıldığını belirtmektedir. {cite:zij-sabi-nallino-byblion s.101}."
  id: "Al-Battani menyatakan bahwa kalender Romawi dan Koptik bermula dari tahun kematian Alexander Agung, yang memerintah Makedonia, dan bahwa dua abad setelah tanggal ini dihitung darinya agar bertepatan dengan kalender Romawi dan Mesir. {cite:zij-sabi-nallino-byblion p.101}."
