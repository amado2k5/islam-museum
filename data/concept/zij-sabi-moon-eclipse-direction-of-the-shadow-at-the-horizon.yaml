id: concept/zij-sabi-moon-eclipse-direction-of-the-shadow-at-the-horizon
class: concept
kind: scientific
label: { ar: "جهة ظلمة كسوف القمر على دائرة الأفق", en: "The side of the horizon from which the Moon's darkening appears", ur: "افق پر وہ سمت جہاں سے چاند کا سیاہ ہونا نظر آتا ہے", es: "El lado del horizonte desde el cual parece oscurecerse la Luna.", fr: "Le côté de l'horizon d'où apparaît l'assombrissement de la Lune" }
summary:
  ar: "تُعرف جهة بدء الظلمة وجهة الانجلاء بالنظر إلى سمت الطالع والغارب في كل زمان. فجهة بدء الكسوف تكون من حد سمت الجزء الطالع إلى خلاف جهة عرض القمر في أحد الحالين، وجهة تمام الانجلاء من سمت الجزء الغارب إلى خلاف عرض القمر. ويُعرف ذلك على الرسم المتقدم في صدر الكتاب، وتُخرج الأقواس على دائرة الأفق بحسب القمر. {cite:zij-sabi-nallino-byblion pp.155-157}"
  en: "The side from which the darkening begins and the side at which the eclipse ends are found by reference to the rising and setting points at each moment. The beginning is measured from the azimuth of the rising part of the ecliptic, the end from the azimuth of the setting part, in each case on the side opposite the Moon's latitude. The method uses the figure given at the front of the book. {cite:zij-sabi-nallino-byblion pp.155-157}"
  ur: "گرہنی سیاہی کا آغاز کس طرف سے ہوتا ہے اور اختتام کس طرف ہوتا ہے، یہ ہر لمحے کے طالع اور غارب کے سموت سے معلوم ہوتا ہے۔ آغاز کا سمت طالع جزو کے سمت سے چاند کے عرض کے مخالف جانب شمار کیا جاتا ہے، اور اختتام کا سمت غارب جزو کے سمت سے اسی طرح۔ یہ طریقہ کتاب کے آغاز میں دی گئی شکل پر ہوتا ہے۔ {cite:zij-sabi-nallino-byblion pp.155-157}"
  es: "El lado desde el que comienza el oscurecimiento y el lado donde termina el eclipse se determinan tomando como referencia los puntos de salida y puesta de la Luna en cada momento. El inicio se mide desde el acimut de la parte ascendente de la eclíptica, y el final desde el acimut de la parte descendente, en ambos casos en el lado opuesto a la latitud de la Luna. El método utiliza la figura que aparece al principio del libro. {cite:zij-sabi-nallino-byblion pp.155-157}"
  fr: "Le côté où commence l'obscurcissement et celui où se termine l'éclipse sont déterminés par rapport aux points de lever et de coucher de l'écliptique à chaque instant. Le début est mesuré à partir de l'azimut du point levant de l'écliptique, la fin à partir de l'azimut du point couchant, dans les deux cas du côté opposé à la latitude de la Lune. La méthode utilise la figure figurant en début d'ouvrage. {cite:zij-sabi-nallino-byblion pp.155-157}"
