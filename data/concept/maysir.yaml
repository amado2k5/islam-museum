id: concept/maysir
class: concept
kind: legal
label: { ar: "المَيْسِر", en: "Gambling and games of chance (maysir)", ur: "میسر (جوا اور قمار)" }
summary:
  ar: "الميسر في اللغة قمار العرب بالأزلام أو النرد أو كل قمار، وعند المحدّثين والفقهاء يقسم إلى ميسر لهو، وهو ما لا مال فيه كالنرد والشطرنج، وميسر قمار، وهو ما يتخاطر عليه الناس بالمال. واتفق الفقهاء على تحريم الميسر في الجملة، وعدّ الشافعية القمار الذي يشترط فيه مال من الجانبين كبيرة، وفيه التصدق على من طلب المقامرة، وبطلان بيع آلات اللهو عند الجمهور، وكراهة السلام على اللاعب، وسقوط الشهادة بميسر القمار، وتعزير من ثبت عليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15373} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15374} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15375} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15376} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15377}"
  en: "In the lexicon, maysir is the Arabs' gambling with arrows, dice, or any wager. Jurists divide it into the game of amusement (maysir lahw), where no money is at stake, such as backgammon and chess, and gambling (maysir qimar), where people stake money. The jurists agree that maysir is forbidden in general. The Shafi'is hold that gambling in which money is staked by both sides is a grave sin. The law requires a person who invites another to gamble to give alms; the majority hold that the sale of instruments of amusement is void; the Hanafis hold it valid but forbidden; greeting a player is disliked; a gambler's testimony is rejected even once; and the ruler must discipline those proven guilty. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15373} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15374} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15375} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15376} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15377}"
  ur: "میسر عربوں کا تیروں، پاسوں یا کسی بھی شرط پر جوا کھیلنا ہے۔ فقہاء اسے میسرِ لہو (جس میں مال نہ ہو، جیسے شطرنج) اور میسرِ قمار (جس میں مال داؤ پر ہو) میں تقسیم کرتے ہیں۔ فقہاء کے اتفاق سے میسر حرام ہے، اور اس میں شرط لگانے والے کو صدقہ کرنے کا حکم ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15373} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15374} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15376}"
