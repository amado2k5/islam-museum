id: concept/maysir
class: concept
kind: legal
label: { ar: "المَيْسِر", en: "Gambling and games of chance (maysir)", ur: "میسر ⁦(جوا اور قمار)⁩", es: "Juegos de azar y apuestas (maysir)", fr: "Jeux de hasard et jeux d'argent (maysir)", tr: "Kolaylaştırıcı", id: "Fasilitator" }
summary:
  ar: "الميسر في اللغة قمار العرب بالأزلام أو النرد أو كل قمار، وعند المحدّثين والفقهاء يقسم إلى ميسر لهو، وهو ما لا مال فيه كالنرد والشطرنج، وميسر قمار، وهو ما يتخاطر عليه الناس بالمال. واتفق الفقهاء على تحريم الميسر في الجملة، وعدّ الشافعية القمار الذي يشترط فيه مال من الجانبين كبيرة، وفيه التصدق على من طلب المقامرة، وبطلان بيع آلات اللهو عند الجمهور، وكراهة السلام على اللاعب، وسقوط الشهادة بميسر القمار، وتعزير من ثبت عليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15373} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15374} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15375} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15376} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15377}"
  en: "In the lexicon, maysir is the Arabs' gambling with arrows, dice, or any wager. Jurists divide it into the game of amusement (maysir lahw), where no money is at stake, such as backgammon and chess, and gambling (maysir qimar), where people stake money. The jurists agree that maysir is forbidden in general. The Shafi'is hold that gambling in which money is staked by both sides is a grave sin. The law requires a person who invites another to gamble to give alms; the majority hold that the sale of instruments of amusement is void; the Hanafis hold it valid but forbidden; greeting a player is disliked; a gambler's testimony is rejected even once; and the ruler must discipline those proven guilty. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15373} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15374} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15375} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15376} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15377}"
  ur: "میسر عربوں کا تیروں، پاسوں یا کسی بھی شرط پر جوا کھیلنا ہے۔ فقہاء اسے میسرِ لہو ⁦(جس میں مال نہ ہو، جیسے شطرنج)⁩ اور میسرِ قمار ⁦(جس میں مال داؤ پر ہو)⁩ میں تقسیم کرتے ہیں۔ فقہاء کے اتفاق سے میسر حرام ہے، اور اس میں شرط لگانے والے کو صدقہ کرنے کا حکم ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15373} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15374} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15376}"
  es: "En el léxico, maysir se refiere a los juegos de azar árabes con flechas, dados o cualquier otra apuesta. Los juristas lo dividen en juegos de entretenimiento (maysir lahw), donde no hay dinero en juego, como el backgammon y el ajedrez, y juegos de azar (maysir qimar), donde se apuesta dinero. Los juristas coinciden en que el maysir está prohibido en general. Los shafi'íes sostienen que los juegos de azar en los que ambas partes apuestan dinero son un pecado grave. La ley exige que quien invita a otro a jugar dé limosna; la mayoría considera nula la venta de instrumentos de entretenimiento; los hanafíes la consideran válida pero prohibida; saludar a un jugador es mal visto; el testimonio de un jugador se rechaza incluso una sola vez; y el gobernante debe castigar a los culpables. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15373} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15374} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15375} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15376} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15377}"
  fr: "Dans le lexique, le maysir désigne les jeux de hasard arabes, qu'il s'agisse de flèches, de dés ou de tout autre pari. Les juristes le divisent en deux catégories: les jeux de divertissement (maysir lahw), où aucun argent n'est mis en jeu, comme le backgammon et les échecs, et les jeux de hasard (maysir qimar), où l'argent est misé. Les juristes s'accordent à dire que le maysir est généralement interdit. L'école chaféite considère que les jeux de hasard où l'argent est misé par les deux parties constituent un péché grave. La loi exige que celui qui invite autrui à jouer fasse l'aumône; la majorité des juristes estiment que la vente d'instruments de divertissement est nulle; l'école hanafite la considère comme valide mais interdite; il est mal vu de saluer un joueur; le témoignage d'un joueur est rejeté, même après une seule fois; et le souverain doit sanctionner les personnes reconnues coupables. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15373} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15374} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15375} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15376} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15377}"
  tr: "Dilbilimde 'al-muysar', Arap oyunlarında zar veya zar ile kumar, ya da herhangi bir kumar türü anlamına gelir. Modern akademisyenlere ve hukukçulara göre, 'muysar likh' (zar ve saç gibi parası olmayan bir şey) ve 'muysar kumarı' olarak ikiye ayrılır., ki insanlar parayla bunu riske atarlar. Hukukçular, 'muysar'ın genel yasağında hemfikirdir. Şafi'ler, her iki tarafın da para gerektirdiği kumarın büyük bir kumar olarak kabul edilmesi, kumar talep edenlere yardım edilmesi, eğlence makinelerinin halk arasında satışının geçersiz olması, oyuncuyu selamlamaktan hoşlanmama, kumar kolaylaştırıcısıyla tanıklığın iptal edilmesi ve içinde bulunanların cezalandırılması gibi konuları içerir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15373} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15374} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15375} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15376} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15377}"
  id: "Dalam linguistik, 'al-muysar' merujuk pada perjudian Arab dengan dadu atau dadu, atau segala bentuk perjudian. Menurut para sarjana dan ahli hukum modern, istilah ini dibagi menjadi 'muysar likh', yaitu sesuatu yang tidak memiliki uang seperti dadu dan catur, dan 'perjudian muysar,' yang merupakan risiko yang ditimbulkan dengan uang. Para ahli hukum sepakat pada larangan umum 'muysar'. Syafi's dianggap sebagai perjudian yang membutuhkan uang dari kedua belah pihak sebagai taruhan besar, termasuk amal bagi mereka yang meminta perjudian, ketidakabsahan penjualan mesin hiburan di mata publik, ketidaksukaan menyapa pemain, pembatalan kesaksian dengan fasilitator perjudian, dan hukuman bagi mereka yang terbukti terbukti terhadapnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15373} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15374} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15375} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15376} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15377}"
