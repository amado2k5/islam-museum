id: concept/zij-sabi-conjunction-needs-latitude-agreement
class: concept
kind: scientific
label: { ar: "المقارنة تحتاج إلى تطابق العرض", en: "Conjunction requires agreement in latitude", ur: "مقارنہ کے لیے عرض کی مطابقت ضروری ہے", es: "La conjunción requiere acuerdo en latitud.", fr: "La conjonction exige un accord de latitude.", tr: "Karşılaştırma, ekranın eşleştirilmesini gerektirir.", id: "Perbandingan tersebut memerlukan pencocokan tampilan." }
summary:
  ar: "إذا تجاور كوكبان في الطول دون العرض لم تكن مقارنتهما صحيحة، فلا تُدرك مقارنة كاملة إلا إذا اتفقا في الطول والعرض والجهة، ثم لا يزالان مقترنين حتى يبعد أحدهما عن صاحبه بمقدار نصف جرميهما. وإذا كانا في جهتين مختلفتين فإنه لا يُعد لهما اقتران. {cite:zij-sabi-nallino-byblion pp.198}"
  en: "If two bodies are close in longitude but not in latitude their conjunction is not true; a full conjunction needs agreement in longitude, latitude and side. They stay conjoined until one lies from the other by half the sum of their discs. If they are on opposite sides no conjunction is counted. {cite:zij-sabi-nallino-byblion p.198}"
  ur: "اگر دو اجسام طول میں قریب ہوں مگر عرض میں نہ ہوں تو ان کا اقتران درست نہیں؛ مکمل اقتران کے لیے طول، عرض اور سمت تینوں میں مطابقت لازم ہے۔ وہ اس وقت تک متصل رہتے ہیں جب تک ایک دوسرے سے اپنے دونوں جرموں کے مجموعے کے نصف کے برابر دور نہ ہو جائے۔ اگر وہ مختلف جانبوں میں ہوں تو ان کا اقتران شمار نہیں ہوتا۔ {cite:zij-sabi-nallino-byblion p.198}"
  es: "Si dos cuerpos están cerca en longitud pero no en latitud, su conjunción no es verdadera; una conjunción completa requiere coincidencia en longitud, latitud y lado. Permanecen unidos hasta que uno se encuentre del otro a una distancia equivalente a la mitad de la suma de sus discos. Si están en lados opuestos, no se considera conjunción. {cite:zij-sabi-nallino-byblion p.198}"
  fr: "Si deux corps sont proches en longitude mais pas en latitude, leur conjonction n'est pas totale; une conjonction est totale lorsqu'il faut une concordance en longitude, en latitude et en côté. Ils restent conjoints jusqu'à ce que l'un soit à l'autre à la moitié de la somme de leurs disques. S'ils sont situés de part et d'autre de la conjonction, il n'y a pas de conjonction. {cite:zij-sabi-nallino-byblion p.198}"
  tr: "İki gezegen uzunluk bakımından birbirine yakın, ancak genişlik bakımından farklıysa, karşılaştırmaları geçerli değildir. Tam bir karşılaştırma ancak uzunluk, genişlik ve yön bakımından aynı olduklarında ve kütlelerinin yarısı kadar bir mesafeye kadar birbirlerinden ayrılana kadar kavuşum halinde kaldıklarında elde edilir. Farklı yönlerdeyseler, kavuşum halinde sayılmazlar. {cite:zij-sabi-nallino-byblion pp.198}"
  id: "Jika dua planet memiliki panjang yang hampir sama tetapi lebarnya hampir sama, perbandingannya tidak valid. Perbandingan lengkap hanya tercapai jika panjang, lebar, dan arahnya sama, dan keduanya tetap dalam konjungsi hingga salah satu terpisah dari yang lain sejauh setengah massanya. Jika arahnya berbeda, keduanya tidak dianggap dalam konjungsi. {cite:zij-sabi-nallino-byblion pp.198}"
