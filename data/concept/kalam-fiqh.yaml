summary:
  ar: "الكلام في اللغة عبارة عن أصوات متتابعة لمعنى مفهوم، وفي اصطلاح النحويين اسم لما تركب من مسند ومسند إليه، والمعنى الاصطلاحي لا يخرج عن اللغوي {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13481}."
  en: "Kalam is, in its lexical sense, a series of sounds that carry a meaning; for grammarians it is what is built of a predicate and its subject, and the legal sense does not depart from the lexical one {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13481}."
  ur: "کلام لغت میں ان آوازوں کو کہتے ہیں جو کسی مفہوم پر دلالت کریں؛ نحویوں کے ہاں یہ اس کو کہتے ہیں جو مسند اور مسند الیہ سے مرکب ہو، اور اصطلاحی معنی لغوی معنی سے الگ نہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13481}۔"
