label:
  ar: "الكلام"
  en: "Speech in fiqh (kalam)"
  ur: "کلام ⁦(فقہی احکام)⁩"
  es: "Discurso en fiqh (kalam)"
  fr: "Discours en fiqh (kalam)"
  tr: "Konuşma"
  id: "Pidato"
summary:
  ar: "الكلام في اللغة عبارة عن أصوات متتابعة لمعنى مفهوم، وفي اصطلاح النحويين اسم لما تركب من مسند ومسند إليه، والمعنى الاصطلاحي لا يخرج عن اللغوي {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13481}."
  en: "Kalam is, in its lexical sense, a series of sounds that carry a meaning; for grammarians it is what is built of a predicate and its subject, and the legal sense does not depart from the lexical one {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13481}."
  ur: "کلام لغت میں ان آوازوں کو کہتے ہیں جو کسی مفہوم پر دلالت کریں؛ نحویوں کے ہاں یہ اس کو کہتے ہیں جو مسند اور مسند الیہ سے مرکب ہو، اور اصطلاحی معنی لغوی معنی سے الگ نہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13481}۔"
  es: "Kalam es, en su sentido léxico, una serie de sonidos que transmiten un significado; para los gramáticos es lo que se construye a partir de un predicado y su sujeto, y el sentido legal no se aparta del léxico {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13481}."
  fr: "Kalam est, au sens lexical, une série de sons qui portent une signification; pour les grammairiens, il est ce qui est construit à partir d'un prédicat et de son sujet, et le sens juridique ne s'écarte pas du sens lexical {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13481}."
  tr: "Dilde konuşma, anlaşılan bir anlam için ardışık seslerden oluşur ve dilbilgisi terminolojisinde, bir yüklem ve ona bağlı olan bir yüklem için kullanılan isimdir ve teknik anlamı dilbilimsel {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13481} sınırlarının ötesine geçmez."
  id: "Dalam bahasa, ucapan terdiri dari bunyi berurutan untuk makna yang dipahami, dan dalam terminologi tata bahasa, ia adalah kata benda untuk apa yang terdiri dari predikat dan kondikat di dalamnya, dan makna teknisnya tidak melampaui linguistik {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13481}."
