id: concept/ismah
class: concept
kind: legal
label:
  ar: "العِصْمة"
  en: "Protection (ismah): divine protection, sanctity of life and the marriage bond"
  ur: "عصمت"
  es: "Protección (ismah): protección divina, santidad de la vida y vínculo matrimonial."
  fr: "Protection (ismah): protection divine, caractère sacré de la vie et lien du mariage"
summary:
  ar: "العصمة في اللغة مطلق المنع والحفظ، وتطلق على عقد النكاح، كما في قوله تعالى في النساء الكافرات {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11644}. وللعصمة في الاصطلاح ثلاثة معان: عصمة بمعنى حفظ الله للمكلف من الذنوب، وعصمة مُقوّمة يثبت بها للإنسان وماله قيمة فيجب القصاص أو الدية أو الضمان على من هتكها، وعصمة مؤثّمة يأثم هاتكها دون قصاص أو دية {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11644} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11645}. ويذكر النص أن الرسل معصومون بعد النبوة عن المعاصي، واختلف في عصمتهم قبلها، والصحيح عنده تنزيههم من كل عيب {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11644} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11645}. وتثبت العصمة المقومة للمسلم بالشهادتين، وبالأمان بعقد ذمة أو عهد {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11645} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11646}. وتنحل عصمة النكاح بالفسخ كالردة والعيب، وبالطلاق، والأصل أن الزوج يملكه، والزوجة تملكه بتفويض الزوج لها أو باشتراط أن يكون أمرها بيدها {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11646} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11647}."
  en: "In the lexicon, ismah is the act of preventing and protecting; the jurists also use it of the marriage bond, as in the Qur'anic reference to the bonds with unbelieving women {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11644}. As a term it has three senses: the protection God gives a person from sins; the protection that makes a person and his property sacred, so that retaliation or compensation is due on violating it; and the protection that makes violating it sinful without retaliation or compensation {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11644} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11645}. The text states that the messengers are protected from sins after their mission, and that on their prior state the sound view it records is that they were free of every defect {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11644} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11645}. Sacredness of life and property is gained by the testimony of faith, and by a covenant of protection such as a treaty or safe-conduct {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11645} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11646}. The marriage bond ends by annulment, as for apostasy or defect, or by divorce; the husband normally holds the power of divorce, and a wife holds it when he delegates it to her or when she stipulated it {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11646} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11647}."
  es: "En el léxico, ismah es el acto de prevenir y proteger; los juristas también lo usan para referirse al vínculo matrimonial, como en la referencia coránica a los vínculos con mujeres no creyentes {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11644}. Como término tiene tres sentidos: la protección que Dios da a una persona de los pecados; la protección que hace sagrados a una persona y sus bienes, de modo que se debe represalia o compensación al violarlos; y la protección que hace que violarlos sea pecaminoso sin represalia ni compensación {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11644} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11645}. El texto afirma que los mensajeros están protegidos de los pecados después de su misión, y que sobre su estado anterior la opinión sólida que registra es que estaban libres de todo defecto {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11644} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11645}. La santidad de la vida y la propiedad se obtiene mediante el testimonio de fe, y mediante un pacto de protección como un tratado o salvoconducto {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11645} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11646}. El vínculo matrimonial termina por anulación, como por apostasía o defecto, o por divorcio; Normalmente el marido tiene el poder de divorcio, y la esposa lo tiene cuando él se lo delega o cuando ella lo estipula {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11646} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11647}."
  fr: "Dans le lexique, ismah désigne l'acte de prévenir et de protéger; les juristes l'emploient également pour désigner le lien matrimonial, comme dans la référence coranique aux liens contractés avec des femmes non croyantes {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11644}. Ce terme possède trois sens: la protection que Dieu accorde à une personne contre les péchés; la protection qui sacralise une personne et ses biens, entraînant ainsi une punition ou une réparation en cas de violation; et la protection qui rend la violation de cette protection coupable sans punition ni réparation {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11644} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11645}. Le texte stipule que les messagers sont protégés du péché après leur mission et que, selon l'avis juste qu'il rapporte, ils étaient exempts de tout défaut avant leur mission {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11644} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11645}. La sacralité de la vie et des biens est acquise par le témoignage de la foi et par une alliance de protection telle qu'un traité ou un sauf-conduit {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11645} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11646}. Le lien du mariage prend fin par annulation, en cas d'apostasie ou de manquement, ou par divorce. Le mari détient normalement le pouvoir de divorce, et la femme le détient lorsqu'il le lui délègue ou lorsqu'elle le stipule {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11646} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11647}."
  ur: "لغت میں اسماء روک تھام اور حفاظت کا عمل ہے۔ فقہاء اسے نکاح کے بندھن میں بھی استعمال کرتے ہیں، جیسا کہ کافر عورتوں کے ساتھ بندھن کے حوالے سے قرآن میں حوالہ دیا گیا ہے۔ ایک اصطلاح کے طور پر اس کے تین حواس ہیں: وہ حفاظت جو خدا کسی شخص کو گناہوں سے دیتا ہے۔ وہ تحفظ جو کسی شخص اور اس کی املاک کو مقدس بناتا ہے، تاکہ اس کی خلاف ورزی کرنے پر بدلہ یا معاوضہ لیا جائے۔ اور وہ تحفظ جو بدلے یا معاوضے کے بغیر اس کی خلاف ورزی کو گناہ بنا دیتا ہے {حوالہ: فقہ معاویہ کویتیہ نور-v3 صفحہ 11644} متن میں کہا گیا ہے کہ رسول اپنے مشن کے بعد گناہوں سے محفوظ رہتے ہیں، اور یہ کہ ان کی سابقہ حالت پر یہ صوتی نقطہ نظر درج کرتا ہے کہ وہ ہر عیب سے پاک تھے۔ جان و مال کی حرمت ایمان کی گواہی سے اور تحفظ کے عہد سے حاصل ہوتی ہے جیسے کہ کسی معاہدے یا حفاظتی سلوک سے۔ شادی کا بندھن فسخ ہو کر ختم ہو جاتا ہے، جیسا کہ ارتداد یا عیب، یا طلاق کے ذریعے؛ طلاق کا اختیار عام طور پر شوہر کے پاس ہوتا ہے، اور بیوی اس وقت رکھتی ہے جب وہ اسے اس کے سپرد کرے یا جب اس نے اس کی شرط رکھی ہو {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 11646}"
