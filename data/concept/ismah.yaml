label:
  ar: "العِصْمة"
  en: "Protection (ismah): divine protection, sanctity of life and the marriage bond"
  ur: "عصمت"
summary:
  ar: "العصمة في اللغة مطلق المنع والحفظ، وتطلق على عقد النكاح، كما في قوله تعالى في النساء الكافرات {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11644}. وللعصمة في الاصطلاح ثلاثة معان: عصمة بمعنى حفظ الله للمكلف من الذنوب، وعصمة مُقوّمة يثبت بها للإنسان وماله قيمة فيجب القصاص أو الدية أو الضمان على من هتكها، وعصمة مؤثّمة يأثم هاتكها دون قصاص أو دية {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11644} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11645}. ويذكر النص أن الرسل معصومون بعد النبوة عن المعاصي، واختلف في عصمتهم قبلها، والصحيح عنده تنزيههم من كل عيب {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11644} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11645}. وتثبت العصمة المقومة للمسلم بالشهادتين، وبالأمان بعقد ذمة أو عهد {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11645} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11646}. وتنحل عصمة النكاح بالفسخ كالردة والعيب، وبالطلاق، والأصل أن الزوج يملكه، والزوجة تملكه بتفويض الزوج لها أو باشتراط أن يكون أمرها بيدها {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11646} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11647}."
  en: "In the lexicon, ismah is the act of preventing and protecting; the jurists also use it of the marriage bond, as in the Qur'anic reference to the bonds with unbelieving women {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11644}. As a term it has three senses: the protection God gives a person from sins; the protection that makes a person and his property sacred, so that retaliation or compensation is due on violating it; and the protection that makes violating it sinful without retaliation or compensation {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11644} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11645}. The text states that the messengers are protected from sins after their mission, and that on their prior state the sound view it records is that they were free of every defect {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11644} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11645}. Sacredness of life and property is gained by the testimony of faith, and by a covenant of protection such as a treaty or safe-conduct {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11645} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11646}. The marriage bond ends by annulment, as for apostasy or defect, or by divorce; the husband normally holds the power of divorce, and a wife holds it when he delegates it to her or when she stipulated it {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11646} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11647}."
