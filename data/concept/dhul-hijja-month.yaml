id: concept/dhul-hijja-month
class: concept
kind: legal
label:
  ar: "شهر ذو الحجة"
  en: "Dhu al-Hijja (the twelfth month: the pilgrimage, the first ten days and the day of 'Arafa)"
summary:
  ar: "ذو الحجة آخر شهور السنة وأحد الأشهر الحرم، سمي لأداء الحج فيه. وأيامه العشر الأولى أفضل أيام الدنيا وأحبها إلى الله، وفيها يوم عرفة يكفر صيامه سنتين، ويوم النحر وعيد الأضحى وأيام التشريق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3} {cite:mubarakpuri-raheeq}"
  en: "Dhu al-Hijja is the last month of the year and one of the sacred months, named for the pilgrimage performed in it. Its first ten days are the best days of the world and the most beloved to God; among them is the day of 'Arafa whose fast expiates two years, the day of sacrifice, the feast and the days of Tashriq. {cite:fiqh-mawsua-kuwaitiyya-noor-v3} {cite:mubarakpuri-raheeq}"
  ur: "ذوالحجہ سال کا آخری اور حرمت والوں میں سے ایک مہینہ ہے، اسے اس لیے یہ نام ملا کہ اس میں حج کیا جاتا ہے۔ اس کے پہلے دس دن دنیا کے بہترین اور اللہ کو محبوب ترین دن ہیں؛ انہی میں یومِ عرفہ ہے جس کا روزہ دو سال کا کفارہ ہے، اور یومِ نحر، عید الاضحیٰ اور ایامِ تشریق۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3} {cite:mubarakpuri-raheeq}"
