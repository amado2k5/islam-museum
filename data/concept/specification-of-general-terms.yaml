id: concept/specification-of-general-terms
class: concept
kind: term
label:
  ar: "التخصيص"
  en: "Specification of general terms (takhsis)"
  ur: "تخصیص ⁦(عام کی تخصیص)⁩"
  es: "Especificación de términos generales (takhsis)"
  fr: "Spécification des termes généraux (takhsis)"
  tr: "Özelleştirme"
  id: "Kustomisasi"
summary:
  ar: "التخصيص عند جمهور الأصوليين قصر العام على بعض ما يتناوله بدليل يدل على ذلك، وعند الحنفية قصره على بعض أفراده بدليل مستقل مقارن. ويجوز التخصيص عقلا ووقع استقراء، ويبقى العام حجة بعد التخصيص عند أكثر الأصوليين. ويفرّق عن النسخ بأن التخصيص لا يرفع حكما، وعن التقييد بأن التقييد يقلل شيوع المطلق والتخصيص يقلل شمول العام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4815} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4816}"
  en: "For most usulis, takhsis is confining a general term to some of what it covers by a proof that shows this; for the Hanafis, it is confining it to some of its individuals by an independent proof that accompanies it. It is possible by reason and occurs by induction, and most usulis hold that the general term remains a proof after specification. It differs from abrogation, which lifts a ruling, and from qayd, which narrows an absolute term. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4815} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4816}"
  es: "Para la mayoría de los usulis, takhsis consiste en limitar un término general a parte de lo que abarca mediante una prueba que lo demuestre; para los hanafíes, consiste en limitarlo a algunos de sus individuos mediante una prueba independiente que lo acompaña. Es posible por razonamiento y se produce por inducción, y la mayoría de los usulis sostienen que el término general sigue siendo una prueba después de la especificación. Se diferencia de la abrogación, que levanta una norma, y del qayd, que restringe un término absoluto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4815} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4816}"
  fr: "Pour la plupart des usulis, la takhsis consiste à restreindre un terme général à une partie de son champ d'application par une démonstration; pour les hanafites, elle consiste à le restreindre à certains de ses cas particuliers par une démonstration indépendante. Elle est possible par raisonnement et se produit par induction, et la plupart des usulis considèrent que le terme général demeure une démonstration après spécification. Elle diffère de l'abrogation, qui supprime une règle, et du qayd, qui restreint un terme absolu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4815} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4816}"
  ur: "زیادہ تر عامیوں کے لیے، تخصیص ایک عام اصطلاح کو ان میں سے کچھ تک محدود کر رہا ہے جس کا احاطہ اس ثبوت کے ذریعے کرتا ہے جو یہ ظاہر کرتا ہے۔ احناف کے نزدیک یہ اس کے ساتھ موجود ایک آزاد ثبوت کے ذریعے اسے اپنے بعض افراد تک محدود کر رہا ہے۔ یہ وجہ سے ممکن ہے اور انڈکشن کے ذریعہ ہوتا ہے، اور زیادہ تر اصولوں کا خیال ہے کہ عام اصطلاح تصریح کے بعد ایک ثبوت رہتی ہے۔ یہ منسوخی سے مختلف ہے، جو ایک حکم کو اٹھاتا ہے، اور قضا سے، جو ایک مطلق مدت کو محدود کرتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ4815}"
  tr: "Usul bilginlerinin çoğuna göre spesifikasyon, genelin bunu gösteren bazı kanıtlarla sınırlı kalmasıdır; Hanefi'lere göre ise bağımsız karşılaştırmalı kanıtlarla bazı bireylerle sınırlıdır. Belirtilme rasyonel ve tümevarım yoluyla kabul edilir ve çoğu usuli bilginine göre genel ispat spesifikasyondan sonra bir kanıt olarak kalır. Kaldırımdan, spesifikasyonun bir hükmü kaldırmaması, kısıtlamadan ise kısıtlamanın mutlakın genelliğini azaltır ve belirtme generalin anlayışını azaltır. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.4815} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4816}"
  id: "Spesifikasi menurut mayoritas sarjana usul adalah membatasi umum pada beberapa hal yang dicakupnya dengan bukti yang menunjukkan hal ini, sementara menurut Hanafi, spesifikasi terbatas pada beberapa individu dengan bukti komparatif independen. Spesifikasi diperbolehkan secara rasional dan melalui induksi, dan umum tetap menjadi bukti setelah spesifikasi menurut sebagian besar sarjana usuli. Ini berbeda dari pembatalan karena spesifikasi tidak menghilangkan keputusan, dan dari pembatasan karena pembatasan mengurangi generalitas absolut, dan spesifikasi mengurangi pemahaman general. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4815} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4815} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4816}"
