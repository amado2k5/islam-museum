  en: "Specification of general terms (takhsis)"
  ur: "تخصیص (عام کی تخصیص)"
summary:
  ar: "التخصيص عند جمهور الأصوليين قصر العام على بعض ما يتناوله بدليل يدل على ذلك، وعند الحنفية قصره على بعض أفراده بدليل مستقل مقارن. ويجوز التخصيص عقلا ووقع استقراء، ويبقى العام حجة بعد التخصيص عند أكثر الأصوليين. ويفرّق عن النسخ بأن التخصيص لا يرفع حكما، وعن التقييد بأن التقييد يقلل شيوع المطلق والتخصيص يقلل شمول العام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4815} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4816}"
  en: "For most usulis, takhsis is confining a general term to some of what it covers by a proof that shows this; for the Hanafis, it is confining it to some of its individuals by an independent proof that accompanies it. It is possible by reason and occurs by induction, and most usulis hold that the general term remains a proof after specification. It differs from abrogation, which lifts a ruling, and from qayd, which narrows an absolute term. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4815} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4816}"
