summary:
  ar: "الصدف في الكتاب لحم الصدف وأغطيته وقشوره والحلزون، منه البري ومنه الفرفيري، والمحرق منه جلاء مفشٍّ وتجفيف قوي، يجلو البهق ويمسك تساقط الشعر ويذيل الجرب ويدمل القروح وينفع في النقرس وجلاء الأسنان والأكحال وأمراض المعدة، ويذكر الكتاب فيه أخبارا في اختناق الرحم والمشيمة والطمث {cite:canon-ibn-sina-print-v1 pp.638-639}"
  en: "Sadaf is in the book the flesh, the covers and the shells of molluscs and the snail, the wild kind and the purple kind; burnt, it has a cleansing and dispersing power and a strong drying; it clears vitiligo, holds back falling hair, removes scab, heals ulcers and benefits gout, the cleansing of teeth, eye salves and diseases of the stomach, and the book gives reports on suffocation of the womb, the afterbirth and the menses {cite:canon-ibn-sina-print-v1 pp.638-639}"
  ur: "صدف کتاب میں سیپیوں کا گوشت، ان کے ڈھکن اور خول اور گھونگا ہے، جس میں جنگلی بھی ہے اور ارغوانی بھی؛ جلایا ہوا جلاء اور پھیلانے والی قوت اور قوی خشکی رکھتا ہے؛ برص کو صاف کرتا، بالوں کا گرنا روکتا، خارش دور کرتا، زخم بھرتا اور نقرس، دانت صاف کرنے، سرمہ جات اور معدے کی بیماریوں میں نافع ہے، اور کتاب اس میں رحم کے گھٹنے، آنول اور حیض کے بارے میں خبریں دیتی ہے {cite:canon-ibn-sina-print-v1 pp.638-639}۔"
  es: "Sadaf es en el libro la carne, las cubiertas y las conchas de moluscos y caracoles, tanto silvestres como púrpuras; quemado, tiene un poder limpiador y dispersante y un fuerte efecto secante; elimina el vitíligo, frena la caída del cabello, elimina costras, cura úlceras y beneficia la gota, la limpieza dental, los ungüentos oculares y las enfermedades del estómago, y el libro da informes sobre la asfixia del útero, la placenta y la menstruación {cite:canon-ibn-sina-print-v1 pp.638-639}"
