id: concept/zij-sabi-has-a-star-risen-or-set-by-its-degree
class: concept
kind: scientific
label: { ar: "هل طلع الكوكب أم غاب: بحال الجزء الذي يطلع معه", en: "Whether a star has risen or set, judged by its degree", ur: "ستارہ طلوع ہوا یا غروب، اس کے درجے کی حالت سے", es: "Si una estrella ha salido o se ha puesto, juzgado por su grado", fr: "On juge de la progression ou du coucher d'une étoile selon son degré.", tr: "Gezegen doğdu mu, battı mı? (Bu, onunla birlikte yükselen kısmı ifade eder.)", id: "Apakah planet itu terbit atau terbenam? (Ini merujuk pada bagian yang ikut terbit bersamanya.)" }
summary:
  ar: "يضع النص قاعدة قصيرة: إذا كان الجزء الذي يطلع معه الكوكب تالياً للجزء الطالع في ذلك الوقت فالكوكب لم يطلع بعد، وإن كان متقدماً للجزء الطالع فقد طلع وهو فوق الأرض. وكذلك إذا كان الجزء الذي يغيب معه تالياً للجزء الغارب فلم يغب بعد، وإن كان متقدماً فقد غاب. {cite:zij-sabi-nallino-byblion p.57}."
  en: "The text lays down a short rule: if the part with which the star rises follows the rising part at that time, the star has not yet risen; if it precedes the rising part, the star has risen and is above the earth. Likewise, if the part with which it sets follows the setting part it has not yet set, and if it precedes it the star has set. {cite:zij-sabi-nallino-byblion p.57}."
  ur: "متن ایک مختصر قاعدہ دیتا ہے: اگر وہ جزء جس کے ساتھ ستارہ طلوع ہوتا ہے اس وقت کے طالع جزء کے بعد ہو تو ستارہ ابھی طلوع نہیں ہوا؛ اگر طالع جزء سے پہلے ہو تو ستارہ طلوع ہو چکا ہے اور زمین کے اوپر ہے۔ اسی طرح اگر وہ جزء جس کے ساتھ ستارہ غروب ہوتا ہے غارب جزء کے بعد ہو تو وہ ابھی غروب نہیں ہوا، اور پہلے ہو تو غروب ہو چکا ہے۔ {cite:zij-sabi-nallino-byblion p.57}۔"
  es: "El texto establece una regla breve: si la parte con la que sale la estrella sigue a la parte con la que sale en ese momento, la estrella aún no ha salido; si la precede, la estrella ya ha salido y está sobre la Tierra. Del mismo modo, si la parte con la que se pone sigue a la parte con la que se pone, aún no se ha puesto, y si la precede, la estrella ya se ha puesto. {cite:zij-sabi-nallino-byblion p.57}."
  fr: "Le texte énonce une règle simple: si la partie avec laquelle l’étoile se lève suit la partie montante à ce moment-là, l’étoile n’est pas encore levée; si elle la précède, l’étoile est levée et se trouve au-dessus de la Terre. De même, si la partie avec laquelle elle se couche suit la partie couchante, l’étoile n’est pas encore couchée, et si elle la précède, l’étoile est couchée. {cite:zij-sabi-nallino-byblion p.57}."
  tr: "Metin kısa bir kural ortaya koyuyor: Bir gezegenin doğduğu gökyüzü bölümü, o anda yükselen bölümü takip ediyorsa, gezegen henüz doğmamıştır; eğer yükselen bölümden önce geliyorsa, doğmuştur ve Dünya'nın üzerindedir. Benzer şekilde, bir gezegenin battığı gökyüzü bölümü, batan bölümü takip ediyorsa, henüz batmamıştır; eğer batan bölümden önce geliyorsa, batmıştır. {cite:zij-sabi-nallino-byblion s.57}."
  id: "Teks tersebut menetapkan aturan singkat: jika bagian langit tempat sebuah planet terbit mengikuti bagian terbit pada saat itu, maka planet tersebut belum terbit; jika mendahului bagian terbit, maka planet tersebut telah terbit dan berada di atas Bumi. Demikian pula, jika bagian langit tempat sebuah planet terbenam mengikuti bagian terbenam, maka planet tersebut belum terbenam; jika mendahului bagian terbenam, maka planet tersebut telah terbenam. {cite:zij-sabi-nallino-byblion p.57}."
