id: concept/adhm
class: concept
kind: legal
label:
  ar: "العَظْم"
  en: "Bone (adhm): purity, use and retaliation"
  fr: "Os (adhm) : pureté, usages et talion"
  ur: "ہڈی ⁦(عظم)⁩"
  es: "Mal (adhm): pureza, uso y represalia"
summary:
  ar: "العظم في اللغة ما عليه اللحم من قصب الحيوان، وجمعه أعظم وعظام {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11666}. ذهب جمهور الفقهاء إلى طهارة عظم الآدمي حياً وميتاً، مسلماً كان أو كافراً، وإلى بقاء عظم السمك طاهراً بعد موته، وطهارة عظم المأكول المذكى {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11666}. أما عظم الميتة أو غير المأكول فنجس عند المالكية والشافعية والحنابلة وإسحاق، وذهب الحنفية إلى طهارته، وكره عمر الدهن في عظم الفيل {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11666} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11667}. واختلفوا في الاستنجاء بالعظم، فمنعه الشافعية والحنابلة، وكرهه الحنفية تحريماً مع الإجزاء، وكرهه المالكية كراهة إذا كان طاهراً ومنعوه إن كان نجساً {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11667} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11668}. ولا قصاص في العظم إلا من مفصل عند جمهور الفقهاء، لعدم إمكان المماثلة في غيره {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11668}."
  en: "In the lexicon, adhm is the bone that has flesh on it, plural 'idham and 'izam {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11666}. Most jurists hold that a human bone is pure, whether living or dead, of a Muslim or not; that a fish bone stays pure after death; and that the bone of a lawfully slaughtered edible animal is pure and may be used {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11666}. The bone of carrion, or of a non-edible animal, is impure according to the Malikis, Shafi'is, Hanbalis and Ishaq, and cannot be purified; the Hanafis hold it pure, and 'Umar disliked oiling in ivory {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11666} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11667}. On cleansing after excretion with a bone, the Shafi'is and Hanbalis forbid it; the Hanafis dislike it as forbidden but accept that it suffices; the Malikis forbid a carrion bone and allow a pure bone with disapproval {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11667} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11668}. Most jurists allow retaliation for a bone only at a joint, since equality cannot be achieved elsewhere {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11668}."
  fr: "Dans le lexique, adhm désigne l’os recouvert de chair ; ses pluriels sont ’idham et ’izam {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11666}. Pour la plupart des juristes, un os humain est pur, que la personne soit vivante ou morte, musulmane ou non ; les arêtes de poisson restent pures après la mort de l’animal ; et l’os d’un animal comestible abattu selon les règles est pur et peut servir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11666}. L’os d’une bête morte sans abattage rituel ou d’un animal non comestible est impur et ne peut être purifié selon les malikites, les chaféites, les hanbalites et Ishaq ; les hanafites le tiennent pour pur, et ’Umar réprouvait l’usage de l’ivoire pour l’huile {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11666} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11667}. Les chaféites et les hanbalites interdisent de se nettoyer avec un os après avoir fait ses besoins ; les hanafites l’interdisent, mais reconnaissent que le nettoyage suffit ; les malikites interdisent l’os d’une bête morte sans abattage rituel et tolèrent, avec réprobation, l’os pur {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11667} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11668}. La plupart des juristes n’admettent le talion pour une atteinte à un os qu’à une articulation, faute d’équivalence ailleurs {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11668}."
  es: "En el léxico, adhm es el hueso que tiene carne, plural 'idham e 'izam {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11666}. La mayoría de los juristas sostienen que un hueso humano es puro, ya sea vivo o muerto, de un musulmán o no; que una espina de pescado permanece pura después de la muerte; y que el hueso de un animal comestible sacrificado legalmente es puro y puede usarse {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11666}. El hueso de carroña, o de un animal no comestible, es impuro según los malikíes, shafi'ís, hanbalíes e ishaq, y no puede purificarse; Los hanafíes lo consideran puro, y a Umar le disgustaba engrasar el marfil {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11666} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11667}. En cuanto a la limpieza después de la excreción con un hueso, los shafiíes y los hanbalíes lo prohíben; a los hanafíes les disgusta por estar prohibido, pero aceptan que es suficiente; los malikíes prohíben un hueso carroñero y permiten un hueso puro con desaprobación {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11667} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11668}. La mayoría de los juristas permiten la represalia por un hueso solo en una articulación, ya que la igualdad no se puede lograr en otro lugar {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11668}."
  ur: "لغت میں، ادھم وہ ہڈی ہے جس پر گوشت ہوتا ہے، جمع 'ادھم' اور 'اعزام' اکثر فقہاء کا خیال ہے کہ انسانی ہڈی پاک ہے، چاہے زندہ ہو یا مردہ، مسلمان کی ہو یا نہ ہو۔ کہ مچھلی کی ہڈی مرنے کے بعد پاک رہتی ہے۔ اور یہ کہ حلال طور پر ذبح کیے جانے والے خوردنی جانور کی ہڈی خالص ہے اور اسے استعمال کیا جا سکتا ہے۔ مردار یا غیر خوردنی جانور کی ہڈی مالکیہ، شافعیہ، حنبلی اور اسحاق کے نزدیک نجس ہے اور پاک نہیں ہو سکتی۔ احناف اسے خالص سمجھتے ہیں، اور عمر ہاتھی دانت میں تیل لگانا ناپسند کرتے تھے {حوالہ: فقہ معاسوۃ کویتیہ نور-v3 ص11666} ہڈی کے ساتھ اخراج کے بعد صفائی کرنے پر شافعی اور حنبلی اس سے منع کرتے ہیں۔ احناف اسے حرام قرار نہیں دیتے لیکن مانتے ہیں کہ یہ کافی ہے۔ مالکیوں نے مردار کی ہڈی کو حرام قرار دیا ہے اور نامنظور کے ساتھ خالص ہڈی کی اجازت دی ہے۔ زیادہ تر فقہا صرف جوڑ میں ہڈی کے بدلے کی اجازت دیتے ہیں، کیونکہ مساوات کسی اور جگہ حاصل نہیں ہو سکتی۔"
