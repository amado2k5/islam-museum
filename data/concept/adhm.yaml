label:
  ar: "العَظْم"
  en: "Bone (adhm): purity, use and retaliation"
  ur: "ہڈی (عظم)"
summary:
  ar: "العظم في اللغة ما عليه اللحم من قصب الحيوان، وجمعه أعظم وعظام {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11666}. ذهب جمهور الفقهاء إلى طهارة عظم الآدمي حياً وميتاً، مسلماً كان أو كافراً، وإلى بقاء عظم السمك طاهراً بعد موته، وطهارة عظم المأكول المذكى {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11666}. أما عظم الميتة أو غير المأكول فنجس عند المالكية والشافعية والحنابلة وإسحاق، وذهب الحنفية إلى طهارته، وكره عمر الدهن في عظم الفيل {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11666} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11667}. واختلفوا في الاستنجاء بالعظم، فمنعه الشافعية والحنابلة، وكرهه الحنفية تحريماً مع الإجزاء، وكرهه المالكية كراهة إذا كان طاهراً ومنعوه إن كان نجساً {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11667} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11668}. ولا قصاص في العظم إلا من مفصل عند جمهور الفقهاء، لعدم إمكان المماثلة في غيره {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11668}."
  en: "In the lexicon, adhm is the bone that has flesh on it, plural 'idham and 'izam {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11666}. Most jurists hold that a human bone is pure, whether living or dead, of a Muslim or not; that a fish bone stays pure after death; and that the bone of a lawfully slaughtered edible animal is pure and may be used {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11666}. The bone of carrion, or of a non-edible animal, is impure according to the Malikis, Shafi'is, Hanbalis and Ishaq, and cannot be purified; the Hanafis hold it pure, and 'Umar disliked oiling in ivory {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11666} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11667}. On cleansing after excretion with a bone, the Shafi'is and Hanbalis forbid it; the Hanafis dislike it as forbidden but accept that it suffices; the Malikis forbid a carrion bone and allow a pure bone with disapproval {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11667} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11668}. Most jurists allow retaliation for a bone only at a joint, since equality cannot be achieved elsewhere {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11668}."
