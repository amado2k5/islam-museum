id: concept/ihana
class: concept
kind: ethical
label: { ar: "الإهانة", en: "Ihana (humiliation, as a wrong against persons and faith and as a penalty)" }
summary:
  ar: "الإهانة لغة مصدر أهان، والفعل هان بمعنى ذل وحقر، وهي من صور الاستهزاء والاستخفاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3595} وترد عند الفقهاء باعتبارين: عدوانا تستوجب العقوبة، فإن لحقت بالعقيدة والشريعة كالسجود لصنم أو إلقاء المصحف في قاذورة فكفر، وإن لحقت الناس بغير حق من سب وشتم وضرب فمعصية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3595} وقد تكون عقوبة مقررة كإهانة أهل الذمة بالجزية، وإهانة المعتدي بالشتم بعقوبة خفيفة بحسب قدر المهان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3595}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3596} وتأتي غالبا في أبواب الردة والقذف والتعزير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3596}"
  en: "Ihana is lexically the act of abasing, from the verb hana, to be humbled, and it is one of the forms of mockery and contempt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3595} For the jurists it arises in two ways: as a wrong that invites a penalty, which is unbelief when it touches faith or the law, such as bowing to an idol or throwing a copy of the Qur'an into filth, and sin when it touches people unjustly, such as insult or beating; and as a penalty fixed by the law, such as the humiliation of protected non-Muslims in paying the poll tax, or a light penalty for one who insults another, in proportion to the rank of the person. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3595}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3596} It arises chiefly in the chapters on apostasy, slander and discretionary punishment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3596}"
