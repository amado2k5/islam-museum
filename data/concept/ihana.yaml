label: { ar: "الإهانة", en: "Ihana (humiliation, as a wrong against persons and faith and as a penalty)", es: "Ihana (humillación, como agravio contra las personas y la fe y como castigo)", fr: "Ihana (humiliation, en tant que tort envers les personnes et la foi et en tant que peine)", ur: "احنا ⁦(ذلت، افراد اور ایمان کے خلاف غلط اور سزا کے طور پر)⁩", tr: "Hakaret", id: "Penghinaan" }
summary:
  ar: "الإهانة لغة مصدر أهان، والفعل هان بمعنى ذل وحقر، وهي من صور الاستهزاء والاستخفاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3595} وترد عند الفقهاء باعتبارين: عدوانا تستوجب العقوبة، فإن لحقت بالعقيدة والشريعة كالسجود لصنم أو إلقاء المصحف في قاذورة فكفر، وإن لحقت الناس بغير حق من سب وشتم وضرب فمعصية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3595} وقد تكون عقوبة مقررة كإهانة أهل الذمة بالجزية، وإهانة المعتدي بالشتم بعقوبة خفيفة بحسب قدر المهان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3595}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3596} وتأتي غالبا في أبواب الردة والقذف والتعزير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3596}"
  en: "Ihana is lexically the act of abasing, from the verb hana, to be humbled, and it is one of the forms of mockery and contempt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3595} For the jurists it arises in two ways: as a wrong that invites a penalty, which is unbelief when it touches faith or the law, such as bowing to an idol or throwing a copy of the Qur'an into filth, and sin when it touches people unjustly, such as insult or beating; and as a penalty fixed by the law, such as the humiliation of protected non-Muslims in paying the poll tax, or a light penalty for one who insults another, in proportion to the rank of the person. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3595}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3596} It arises chiefly in the chapters on apostasy, slander and discretionary punishment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3596}"
  es: "Ihana es léxicamente el acto de humillar, del verbo hana, ser humillado, y es una de las formas de burla y desprecio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3595} Para los juristas surge de dos maneras: como un error que invita a una pena, que es la incredulidad cuando toca la fe o la ley, como inclinarse ante un ídolo o arrojar una copia del Corán a la inmundicia, y pecado cuando toca a las personas injustamente, como insultar o golpear; y como una pena fijada por la ley, como la humillación de los no musulmanes protegidos al pagar el impuesto de capitación, o una pena leve para quien insulta a otro, en proporción al rango de la persona. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3595}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3596} Surge principalmente en los capítulos sobre apostasía, calumnia y castigo discrecional. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3596}"
  fr: "Le terme « ihana » désigne le sens littéral d'« abaisser », dérivé du verbe « hana », qui signifie « être humilié ». Il s'agit d'une forme de moquerie et de mépris. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3595} Pour les juristes, l'« ihana » se présente de deux manières: soit comme une faute passible de sanction, à savoir l'incroyance lorsqu'elle touche à la foi ou à la loi, comme se prosterner devant une idole ou jeter un exemplaire du Coran aux ordures, et le péché lorsqu'elle est commise injustement envers autrui, comme l'insulte ou les coups; soit comme une sanction prévue par la loi, telle que l'humiliation infligée aux non-musulmans protégés lors du paiement de la capitation, ou une peine légère pour celui qui insulte autrui, proportionnelle au rang de la personne. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3595}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3596} Cela apparaît principalement dans les chapitres sur l'apostasie, la calomnie et la punition discrétionnaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3596}"
  ur: "احنا لغوی طور پر ذلیل کرنے کا فعل ہے، فعل حنا سے عاجز ہونا، اور یہ طنز اور حقارت کی ایک شکل ہے۔ فقہاء کے نزدیک یہ دو طرح سے پیدا ہوتا ہے: ایک ایسا خطا جو عذاب کو دعوت دیتا ہے، جو کہ ایمان یا قانون کو چھونے پر کفر ہے، جیسے کسی بت کے آگے جھکنا یا قرآن کے نسخے کو گندگی میں ڈالنا، یا لوگوں کو ناگوار طور پر چھونے پر۔ مارنا اور قانون کی طرف سے مقرر کردہ سزا کے طور پر، جیسے کہ پول ٹیکس کی ادائیگی میں محفوظ غیر مسلموں کی تذلیل، یا کسی دوسرے کی توہین کرنے والے کے لیے ہلکی سزا، اس شخص کے درجے کے تناسب سے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3595}{cite:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3596} یہ بنیادی طور پر ارتداد، بہتان اور صوابدیدی سزا کے ابواب میں آتا ہے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 صفحہ 3596}"
  tr: "Hakaret dilsel olarak aşağılanma ve aşağılanma anlamına gelir ve bu bir tür alay ve küçümsemedir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.3595} Hukukçular tarafından iki şekilde değerlendirilir: cezalandırılması gereken saldırganlık. Eğer bir puta secde etmek veya Kur'an'ı kirliğe atmak gibi inanç ve şeriata zarar verirse, bu kâfir sayılır; ve insanlara haksızca zarar verirse, örneğin lanet, lanet ve dövme gibi, günahtır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3595} Bu, zimmi halkına cizye vererek aşağılamak ve aşağılanmanın derecesine bağlı olarak hafif bir ceza ile saldırganı küfretmek gibi belirlenmiş bir ceza olabilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3595} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3596} Sıklıkla dinden dönme, iftira ve ta'zir bölümlerinde geçer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3596}"
  id: "Hinaan secara linguistik berarti penghinaan dan penghinaan, dan itu adalah bentuk ejekan dan penghinaan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3595} Istilah ini dianggap oleh para ahli hukum dalam dua cara: agresi yang pantas dihukum. Jika merugikan kredo dan Syariah, seperti sujud pada patung atau melemparkan Al-Qur'an ke dalam kotoran, maka dianggap sebagai ketidakpercayaan; dan jika merugikan orang secara tidak adil, seperti mengutuk, mengutuk, dan memukul, maka itu adalah dosa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3595} Ini bisa menjadi hukuman yang ditetapkan, seperti menghina umat dhimmi dengan membayar jizya, dan menghina pelaku dengan mengumpat dengan hukuman ringan tergantung pada tingkat penghinaan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3595} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3596} Sering muncul dalam bab murtad, fitnah, dan ta'zir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3596}"
