  tr: "Takaful ve Sigorta"
  id: "Takaful dan Asuransi"
summary:
  ar: "يذكر المؤلف أن الإسلام يشجّع على ركوب المخاطر المشروعة بضمان اجتماعي دنيوي، وأن المسلم إذا خسر في عمله أو أصابته جائحة لا يُترك، بل يلقى المعونة من المجتمع والدولة، ويرى أن الصيغ التأمينية التعاونية الحديثة تهدف إلى رد الناس إلى مستواهم السابق {cite:usul-iqtisad-islami-0660 p. 117}."
  tr: "Yazar, İslam'ın dünyevi sosyal güvenlik ile meşru riskler almayı teşvik ettiğini ve bir Müslümanın işini kaybettiğinde veya bir pandemi geçirdiğinde geride kalmadığını, toplum ve devletten yardım aldığını belirtiyor. Modern kooperatif sigorta formüllerinin insanları eski seviyelerine döndürmeyi amaçladığına inanıyor {cite:usul-iqtisad-islami-0660 s. 117}."
  id: "Penulis menyebutkan bahwa Islam mendorong pengambilan risiko yang sah dengan jaminan sosial duniawi, dan bahwa jika seorang Muslim kehilangan pekerjaannya atau menderita pandemi, ia tidak dibiarkan tetapi menerima bantuan dari masyarakat dan negara. Ia percaya bahwa formula asuransi koperasi modern bertujuan mengembalikan orang ke tingkat sebelumnya {cite:usul-iqtisad-islami-0660 hlm. 117}."
