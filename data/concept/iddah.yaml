label:
  ar: العدة
  en: Iddah (waiting period)
  ur: عدت
summary:
  ar: "العدة في دائرة المعارف الإسلامية مدة امتناع عن العلاقة الجنسية تلزم الأرملة أو المطلقة أو التي فُسخ زواجها قبل أن يحل لها الزواج من جديد. تحسب بالأشهر والأيام للأرامل وبثلاث حيضات للمطلقات وتنتهي بالوضع للحامل، وتتفاوت المذاهب في معنى القروء وفي النفقة والسكنى وأثر الخلوة، ثم أبقت التقنينات الحديثة معظم هذه الأحكام."
  en: "In the Encyclopaedia of Islam the iddah is the period of abstention from sexual relations imposed on a widow, a divorced woman or a woman whose marriage was annulled before she may remarry. It is counted in months and days for widows and by three menstrual periods for divorced women, and ends at childbirth for a pregnant woman. The schools differ on the meaning of qur', on maintenance and housing, and on the effect of khalwa, and modern codes kept most of these rules."
  ur: "اسلامی دائرۃ المعارف میں عدت وہ مدت ہے جس میں بیوہ، مطلقہ یا فسخ شدہ نکاح والی عورت دوبارہ نکاح سے پہلے ازدواجی تعلق سے رکی رہتی ہے۔ بیواؤں کے لیے یہ مہینوں اور دنوں سے اور مطلقاؤں کے لیے تین حیض سے گنی جاتی ہے، اور حاملہ کی عدت وضعِ حمل پر ختم ہوتی ہے۔ مسالک قروء کے معنی، نفقہ اور رہائش اور خلوت کے اثر میں مختلف ہیں، اور جدید قوانین نے ان میں سے بیشتر احکام برقرار رکھے۔"
