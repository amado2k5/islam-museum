summary:
  ar: "العدة في دائرة المعارف الإسلامية مدة امتناع عن العلاقة الجنسية تلزم الأرملة أو المطلقة أو التي فُسخ زواجها قبل أن يحل لها الزواج من جديد. تحسب بالأشهر والأيام للأرامل وبثلاث حيضات للمطلقات وتنتهي بالوضع للحامل، وتتفاوت المذاهب في معنى القروء وفي النفقة والسكنى وأثر الخلوة، ثم أبقت التقنينات الحديثة معظم هذه الأحكام."
  en: "In the Encyclopaedia of Islam the iddah is the period of abstention from sexual relations imposed on a widow, a divorced woman or a woman whose marriage was annulled before she may remarry. It is counted in months and days for widows and by three menstrual periods for divorced women, and ends at childbirth for a pregnant woman. The schools differ on the meaning of qur', on maintenance and housing, and on the effect of khalwa, and modern codes kept most of these rules."
  ur: "اسلامی دائرۃ المعارف میں عدت وہ مدت ہے جس میں بیوہ، مطلقہ یا فسخ شدہ نکاح والی عورت دوبارہ نکاح سے پہلے ازدواجی تعلق سے رکی رہتی ہے۔ بیواؤں کے لیے یہ مہینوں اور دنوں سے اور مطلقاؤں کے لیے تین حیض سے گنی جاتی ہے، اور حاملہ کی عدت وضعِ حمل پر ختم ہوتی ہے۔ مسالک قروء کے معنی، نفقہ اور رہائش اور خلوت کے اثر میں مختلف ہیں، اور جدید قوانین نے ان میں سے بیشتر احکام برقرار رکھے۔"
  es: "En la Enciclopedia del Islam, el iddah es el período de abstinencia sexual impuesto a las viudas, las mujeres divorciadas y aquellas cuyo matrimonio fue anulado, antes de que puedan volver a casarse. Se cuenta en meses y días para las viudas y en tres menstruaciones para las divorciadas, y finaliza con el parto para las mujeres embarazadas. Las escuelas difieren en cuanto al significado del Corán, la manutención y la vivienda, y el efecto del khalwa; los códigos modernos conservan la mayoría de estas normas."
  fr: "Dans l'Encyclopédie de l'Islam, l'iddah est la période d'abstinence sexuelle imposée à une veuve, une femme divorcée ou une femme dont le mariage a été annulé avant qu'elle puisse se remarier. Elle se compte en mois et en jours pour les veuves et en trois cycles menstruels pour les femmes divorcées; elle prend fin à l'accouchement pour une femme enceinte. Les écoles divergent quant à l'interprétation du Coran, aux modalités d'entretien et de logement, ainsi qu'à l'effet de la khalwa; les codes modernes ont conservé la plupart de ces règles."
  tr: "İslami Ansiklopedi'de bekleme süresi, dul, boşanmış kadın veya evliliği iptal edilmiş birini bağlayan cinsel ilişkiden kaçınma süresidir; ancak yeniden evlenme izin verilir. Dul kadınlar için aylar ve günler, boşanmış kadınlar için ise üç adet döngüsü olarak sayılır; hamile kadın için doğumla sona erer. Düşünce okulları, okuma, bakım, barınma ve inzivanın etkisi konusunda farklılık gösterir. Modern kodifikasyonlar bu kuralların çoğunu korumuştur."
  id: "Dalam Ensiklopedia Islam, masa tunggu adalah masa penolakan diri dari hubungan seksual yang mengikat janda, wanita yang bercerai, atau seseorang yang pernikahannya telah dibatalkan sebelum pernikahan ulang diperbolehkan. Masa tunggu dihitung dalam bulan dan hari untuk janda dan tiga siklus menstruasi untuk wanita yang bercerai, yang berakhir dengan persalinan bagi wanita hamil. Aliran pemikiran berbeda mengenai makna pembacaan, pemeliharaan, tempat tinggal, dan efek pengasingan. Kodifikasi modern mempertahankan sebagian besar aturan ini."
