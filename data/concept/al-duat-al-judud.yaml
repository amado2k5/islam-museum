label:
  ar: "الدعاة الجدد — بين التجديد والابتداع"
  en: "The 'new preachers' — between renewal and innovation"
  fr: "Les « nouveaux prédicateurs » — entre renouveau et innovation"
  ur: "نئے داعی — تجدید اور بدعت کے درمیان"
  es: "Los \"nuevos predicadores\": entre la renovación y la innovación."
  tr: "Yeni Savunucular — Yenilenme ile Yenilik Arasında"
  id: "Advokat Baru — Antara Pembaruan dan Inovasi"
issue:
  ar: "ما حقيقة مصطلح «الدعاة الجدد» الذي أطلقه الإعلام، وما معاييره، وما سر إقبال الشباب عليهم، وكيف تستفيد الأمة من مزاياهم وتتجاوز عيوبهم؟"
  en: "What lies behind the media's term 'new preachers', what are its criteria, why do young people flock to them, and how can the community keep their strengths and move past their faults?"
  ur: "میڈیا کی وضع کردہ اصطلاح «نئے داعی» کی حقیقت کیا ہے، اس کے معیار کیا ہیں، نوجوان ان کی طرف کیوں کھنچتے ہیں، اور امت ان کی خوبیوں سے فائدہ اٹھا کر ان کی خامیوں سے کیسے آگے بڑھے؟"
summary:
  ar: "حلقة «الوسطية» عن «الدعاة الجدد بين التجديد والابتداع»، وهو مصطلح يقول المقدّم إن الإعلام أطلقه. سُئل جمهور الاستوديو هل لديه معايير واضحة يميّز بها الدعاة الجدد من غيرهم: قال 21% إن لديهم معايير واضحة دقيقة، و60% معايير عامة غير دقيقة، و19% لا يعترفون بالمسمى أصلاً. التسجيل في الأرشيف مقطوع بعد نحو سبع دقائق. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep21 00:00:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep21 00:04:30}"
  en: "The 'Al-Wasatiyya' episode on 'the new preachers between renewal and innovation', a term the presenter says the media coined. The studio audience was asked whether it had clear criteria to tell new preachers from others: 21% said clear and precise criteria, 60% general but imprecise ones, and 19% did not accept the label at all. The archive recording breaks off after about seven minutes. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep21 00:00:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep21 00:04:30}"
  fr: "L’épisode d’« Al-Wasatiyya » sur « les nouveaux prédicateurs entre renouveau et innovation », terme que le présentateur dit forgé par les médias. Le public en studio a été interrogé sur l’existence de critères clairs pour distinguer les nouveaux prédicateurs des autres : 21 % ont indiqué des critères clairs et précis, 60 % des critères généraux mais imprécis, et 19 % ont rejeté entièrement cette appellation. L’enregistrement d’archive s’interrompt après environ sept minutes. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep21 00:00:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep21 00:04:30}"
  ur: "«الوسطیہ» کی وہ قسط جو «نئے داعی، تجدید اور بدعت کے درمیان» پر ہے؛ میزبان کے بقول یہ اصطلاح میڈیا نے وضع کی۔ اسٹوڈیو حاضرین سے پوچھا گیا کہ کیا ان کے پاس نئے داعیوں کو دوسروں سے الگ کرنے کے واضح معیار ہیں: 21% نے واضح اور دقیق معیار، 60% نے عمومی مگر غیر دقیق معیار کہا، اور 19% اس نام ہی کو تسلیم نہیں کرتے۔ آرکائیو کی ریکارڈنگ تقریباً سات منٹ بعد کٹ جاتی ہے۔ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep21 00:00:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep21 00:04:30}"
  es: "El episodio de 'Al-Wasatiyya' sobre 'los nuevos predicadores entre la renovación y la innovación', un término que, según el presentador, fue acuñado por los medios. Se preguntó al público presente en el estudio si tenía criterios claros para distinguir a los nuevos predicadores de los demás: el 21% respondió que criterios claros y precisos, el 60% criterios generales pero imprecisos, y el 19% no aceptó la etiqueta en absoluto. La grabación de archivo se interrumpe después de unos siete minutos. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep21 00:00:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep21 00:04:30}"
  tr: "\"Moderatörlük\" bölümü, sunucunun medyanın ortaya attığını söylediği \"Yenilenme ve Yenilik Arasında Yeni Vaizler\" konusunda. Stüdyo izleyicilerine yeni vaizleri diğerlerinden ayırmak için net kriterleri olup olmadığı soruldu: %21'i açık ve kesin standartlara sahip olduklarını, %60'ı genel olarak yanlış standartlara sahip olduklarını ve %19'u başlığı hiç tanımadığını söyledi. Arşivdeki kayıt yaklaşık yedi dakika sonra kesildi. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep21 00:00:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep21 00:04:30}"
  id: "Bagian \"Moderasi\" membahas \"Pengkhotbah Baru Antara Pembaruan dan Inovasi,\" yang menurut pembawa acara telah diangkat oleh media. Penonton studio ditanya apakah mereka memiliki kriteria yang jelas untuk membedakan pengkhotbah baru dari yang lain: 21% mengatakan mereka memiliki standar yang jelas dan pasti, 60% mengatakan mereka umumnya memiliki standar yang salah, dan 19% sama sekali tidak mengenali judulnya. Rekaman di arsip dihentikan setelah sekitar tujuh menit. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep21 00:00:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep21 00:04:30}"
