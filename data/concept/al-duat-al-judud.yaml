label:
  ar: "الدعاة الجدد — بين التجديد والابتداع"
  en: "The 'new preachers' — between renewal and innovation"
  ur: "نئے داعی — تجدید اور بدعت کے درمیان"
issue:
  ar: "ما حقيقة مصطلح «الدعاة الجدد» الذي أطلقه الإعلام، وما معاييره، وما سر إقبال الشباب عليهم، وكيف تستفيد الأمة من مزاياهم وتتجاوز عيوبهم؟"
  en: "What lies behind the media's term 'new preachers', what are its criteria, why do young people flock to them, and how can the community keep their strengths and move past their faults?"
  ur: "میڈیا کی وضع کردہ اصطلاح «نئے داعی» کی حقیقت کیا ہے، اس کے معیار کیا ہیں، نوجوان ان کی طرف کیوں کھنچتے ہیں، اور امت ان کی خوبیوں سے فائدہ اٹھا کر ان کی خامیوں سے کیسے آگے بڑھے؟"
summary:
  ar: "حلقة «الوسطية» عن «الدعاة الجدد بين التجديد والابتداع»، وهو مصطلح يقول المقدّم إن الإعلام أطلقه. سُئل جمهور الاستوديو هل لديه معايير واضحة يميّز بها الدعاة الجدد من غيرهم: قال 21% إن لديهم معايير واضحة دقيقة، و60% معايير عامة غير دقيقة، و19% لا يعترفون بالمسمى أصلاً. التسجيل في الأرشيف مقطوع بعد نحو سبع دقائق. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep21 00:00:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep21 00:04:30}"
  en: "The 'Al-Wasatiyya' episode on 'the new preachers between renewal and innovation', a term the presenter says the media coined. The studio audience was asked whether it had clear criteria to tell new preachers from others: 21% said clear and precise criteria, 60% general but imprecise ones, and 19% did not accept the label at all. The archive recording breaks off after about seven minutes. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep21 00:00:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep21 00:04:30}"
  ur: "«الوسطیہ» کی وہ قسط جو «نئے داعی، تجدید اور بدعت کے درمیان» پر ہے؛ میزبان کے بقول یہ اصطلاح میڈیا نے وضع کی۔ اسٹوڈیو حاضرین سے پوچھا گیا کہ کیا ان کے پاس نئے داعیوں کو دوسروں سے الگ کرنے کے واضح معیار ہیں: 21% نے واضح اور دقیق معیار، 60% نے عمومی مگر غیر دقیق معیار کہا، اور 19% اس نام ہی کو تسلیم نہیں کرتے۔ آرکائیو کی ریکارڈنگ تقریباً سات منٹ بعد کٹ جاتی ہے۔ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep21 00:00:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep21 00:04:30}"
