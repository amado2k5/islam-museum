label: { ar: "أقطار الشمس والأرض والقمر وأبعادها", en: "Diameters and distances of the Sun, Earth and Moon", ur: "سورج، زمین اور چاند کے قطر اور فاصلے", es: "Diámetros y distancias del Sol, la Tierra y la Luna.", fr: "Diamètres et distances du Soleil, de la Terre et de la Lune", tr: "Güneşin, dünyanın ve ayın çapları ve boyutları", id: "Diameter dan dimensi matahari, bumi, dan bulan" }
summary:
  ar: "يقدّر البتاني بُعد الشمس عن مركز الأرض بنحو ألف ومائتين وعشر مرات قدر نصف قطر الأرض، ويجعل قطر الشمس نحو ثماني عشرة مرة وأربعة أخماس قطر القمر، وقطرها نحو خمس مرات ونصف قطر الأرض. {cite:zij-sabi-nallino-byblion p.90}."
  en: "Al-Battani puts the Sun's distance from the Earth's centre at about 1210 Earth radii. He makes the Sun's diameter about eighteen and four-fifths times the Moon's, and about five and a half times the Earth's. {cite:zij-sabi-nallino-byblion p.90}."
  ur: "البتانی سورج کا زمین کے مرکز سے فاصلہ زمین کے نصف قطر کے تقریباً بارہ سو دس گنا رکھتے ہیں۔ سورج کا قطر چاند کے قطر سے تقریباً اٹھارہ اور چار پانچویں گنا، اور زمین کے قطر سے تقریباً ساڑھے پانچ گنا بتایا گیا ہے۔ {cite:zij-sabi-nallino-byblion p.90}۔"
  es: "Al-Battani sitúa la distancia del Sol al centro de la Tierra en aproximadamente 1210 radios terrestres. Calcula que el diámetro del Sol es aproximadamente dieciocho veces y cuatro quintos el de la Luna, y aproximadamente cinco veces y media el de la Tierra. {cite:zij-sabi-nallino-byblion p.90}."
  fr: "Al-Battani situe la distance du Soleil au centre de la Terre à environ 1210 rayons terrestres. Il calcule le diamètre du Soleil comme étant environ dix-huit fois et quatre cinquièmes celui de la Lune, et environ cinq fois et demie celui de la Terre. {cite:zij-sabi-nallino-byblion p.90}."
  tr: "El-Battani, Güneş'in Dünya'nın merkezinden uzaklığını Dünya'nın yarıçapının yaklaşık 1210 katı olarak tahmin eder ve Güneş'in çapını Ay'ın çapının yaklaşık 18 ve beşte dördü, çapını ise Dünya'nın yarıçapının yaklaşık beş buçuk katı olarak hesaplar. {cite:zij-sabi-nallino-byblion s.90}."
  id: "Al-Battani memperkirakan jarak matahari dari pusat bumi sekitar 1210 kali jari-jari bumi, dan ia menetapkan diameter matahari sekitar 18 dan empat perlima dari diameter bulan, dan diameternya sekitar lima setengah kali jari-jari bumi. {cite:zij-sabi-nallino-byblion p.90}."
