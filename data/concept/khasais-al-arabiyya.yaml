id: concept/khasais-al-arabiyya
class: concept
kind: term
tags: [arabiyya-browser, arabiyya-sciences]
label:
  ar: "خصائص العربية عند ابن فارس وابن جني"
  en: "The qualities of Arabic according to Ibn Faris and Ibn Jinni"
  ur: "ابن فارس اور ابن جنی کے نزدیک عربی کی خصوصیات"
  fr: "Les qualités de l'arabe selon Ibn Faris et Ibn Jinni"
  es: "Las cualidades del árabe según Ibn Faris e Ibn Jinni"
  tr: "İbn Faris ve İbn Cinci'ye göre Arapçanın özellikleri"
  id: "Karakteristik bahasa Arab menurut Ibn Faris dan Ibn Jinni"
summary:
  ar: "ما يحتج به ابن فارس في الصاحبي لقوله إن لغة العرب أفضل اللغات وأوسعها، والاعتراض الذي يجيب عنه، وحد ابن جني للغة وللنحو في الخصائص، وخلافهما على أصل اللغة بين التوقيف والاصطلاح كما ينقله السيوطي، ثم ما تقوله دائرة المعارف البريطانية عن الجذر والوزن. وكل حكم في الصفحة منسوب إلى قائله، ولا يحكم المتحف بين الرأيين."
  en: "The arguments with which Ibn Faris, in al-Sahibi, holds that the language of the Arabs is the most excellent and the widest of languages, the objection he answers, Ibn Jinni's definition of language and of nahw in al-Khasa'is, their difference on the origin of language between tawqif and convention as al-Suyuti relays it, and what the Encyclopaedia Britannica says of root and pattern. Every judgement on the page is ascribed to its speaker, and the museum does not decide between the views."
  ur: "ابن فارس الصاحبی میں کن دلائل سے کہتے ہیں کہ عربوں کی زبان سب زبانوں سے افضل اور وسیع ہے، وہ اعتراض جس کا وہ جواب دیتے ہیں، الخصائص میں ابن جنی کی لغت اور نحو کی تعریف، زبان کی اصل پر توقیف اور اصطلاح کے بارے میں ان کا اختلاف جیسا سیوطی نقل کرتے ہیں، اور جڑ اور وزن کے بارے میں انسائیکلوپیڈیا برٹانیکا کا بیان۔ صفحے کا ہر حکم اس کے کہنے والے کی طرف منسوب ہے اور عجائب گھر دونوں آراء میں فیصلہ نہیں کرتا۔"
  fr: "Les arguments par lesquels Ibn Faris, dans al-Sahibi, tient la langue des Arabes pour la plus excellente et la plus vaste des langues, l'objection à laquelle il répond, la définition de la langue et de la grammaire par Ibn Jinni dans al-Khasa'is, leur différend sur l'origine de la langue entre tawqif et convention tel que le relaie al-Suyuti, puis ce que dit l'Encyclopaedia Britannica de la racine et du schème. Chaque jugement est attribué à son auteur, et le musée ne tranche pas entre les vues."
  es: "Los argumentos con los que Ibn Faris, en al-Sahibi, sostiene que la lengua de los árabes es la más excelente y la más amplia de las lenguas, la objeción a la que responde, la definición de la lengua y de la gramática de Ibn Jinni en al-Khasa'is, su diferencia sobre el origen de la lengua, entre tawqif y convención, y lo que dice la Encyclopaedia Britannica sobre raíz y esquema. Cada juicio se atribuye a quien lo emite, y el museo no decide entre las posturas."
  tr: "İbn Faris'in El-Sahibi hakkında savunduğu tartışmalar, Arapça'nın en iyi ve en geniş dil olduğunu belirtmesi, yanıtladığı itiraz, İbn Cinci'nin dil ve dilbilgisi özelliklerini tanımlaması, dilin kökeni konusunda el-Suyuti'nin aktardığı gibi pawqif ile terminoloji arasındaki anlaşmazlıkları ve İngiliz Ansiklopedisi'nin kök ve ölçü hakkında söyledikleri. Sayfadaki her yargı yazarına atfedilir ve müze iki görüş arasında karar vermez."
  id: "Apa yang diperdebatkan Ibn Faris tentang Al-Sahibi, menyatakan bahwa bahasa Arab adalah bahasa terbaik dan paling luas, keberatan yang ia jawab, identifikasi Ibn Jinni terhadap bahasa dan tata bahasa dalam karakteristik, serta ketidaksepakatan mereka tentang asal-usul bahasa antara pawqif dan terminologi seperti yang dilaporkan oleh Al-Suyuti, serta apa yang dikatakan Ensiklopedia Inggris tentang akar dan meter. Setiap penilaian di halaman tersebut dikaitkan dengan penulisnya, dan museum tidak menilai antara dua pendapat."
