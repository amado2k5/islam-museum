label:
  ar: "يَمين"
  en: "Yamin (the right side and the right hand, fiqh)"
summary:
  ar: "اليمين في اللغة الجهة والجارحة وهي خلاف اليسار، وتطلق على القسم لأنهم كانوا يتماسحون بأيمانهم حالة التحالف، والمراد في الفقه اليد اليمنى والجهة اليمنى. استحب الفقهاء تقديم اليمين على اليسار في كل ما هو من باب التكريم كالوضوء والغسل والأكل ودخول المسجد، وتقديم اليسار في كل ما هو من باب الإهانة والأذى كالامتخاط والاستنجاء، وذهب جمهورهم إلى أنه يسن للمصلي وضع يمينه على يساره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18005} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18007}"
  en: "In lexicon yamin is the right side or limb, the opposite of yasar, and it also names the oath because men pressed their right hands when swearing alliance; in fiqh the senses under discussion are the right hand and the right side. The jurists recommend putting the right first in everything that honours, such as ablution, washing, eating and entering the mosque, and putting the left first in whatever involves harm or lowliness, such as blowing the nose and cleaning after the privy; most schools also hold it sunna to place the right hand over the left in prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18005} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18007}"
