label:
  ar: "يَمين"
  en: "Yamin (the right side and the right hand, fiqh)"
  es: "Yamin (el lado derecho y la mano derecha, fiqh)"
  fr: "Yamin (le côté droit et la main droite, fiqh)"
  ur: "یامین ⁦(دائیں طرف اور دایاں ہاتھ، فقہ)⁩"
  tr: "Sağ"
  id: "Kanan"
summary:
  ar: "اليمين في اللغة الجهة والجارحة وهي خلاف اليسار، وتطلق على القسم لأنهم كانوا يتماسحون بأيمانهم حالة التحالف، والمراد في الفقه اليد اليمنى والجهة اليمنى. استحب الفقهاء تقديم اليمين على اليسار في كل ما هو من باب التكريم كالوضوء والغسل والأكل ودخول المسجد، وتقديم اليسار في كل ما هو من باب الإهانة والأذى كالامتخاط والاستنجاء، وذهب جمهورهم إلى أنه يسن للمصلي وضع يمينه على يساره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18005} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18007}"
  en: "In lexicon yamin is the right side or limb, the opposite of yasar, and it also names the oath because men pressed their right hands when swearing alliance; in fiqh the senses under discussion are the right hand and the right side. The jurists recommend putting the right first in everything that honours, such as ablution, washing, eating and entering the mosque, and putting the left first in whatever involves harm or lowliness, such as blowing the nose and cleaning after the privy; most schools also hold it sunna to place the right hand over the left in prayer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18005} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18007}"
  es: "En el léxico, yamin es el lado o extremidad derecha, lo opuesto a yasar, y también designa el juramento porque los hombres presionaban sus manos derechas al jurar alianza; en fiqh, los sentidos en discusión son la mano derecha y el lado derecho. Los juristas recomiendan colocar primero la derecha en todo lo que honra, como la ablución, el lavado, comer y entrar en la mezquita, y colocar primero la izquierda en todo lo que implica daño o humildad, como sonarse la nariz y limpiar después de la letrina; la mayoría de las escuelas también consideran sunna colocar la mano derecha sobre la izquierda en la oración. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18005} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18007}"
  fr: "En lexique, « yamin » désigne le côté droit ou le membre droit, l'opposé de « yasar », et ce terme désigne également le serment car les hommes joignaient leurs mains droites lors de la prestation de serment d'alliance; en jurisprudence islamique (fiqh), les sens abordés sont la main droite et le côté droit. Les juristes recommandent de privilégier la main droite dans tout acte honorifique, comme les ablutions, le lavage des mains, les repas et l'entrée à la mosquée, et la main gauche dans tout acte péjoratif ou déshonorant, comme se moucher et nettoyer les toilettes; la plupart des écoles considèrent également comme une sunna de placer la main droite sur la gauche pendant la prière."
  ur: "لغت میں یامین دائیں طرف یا اعضاء ہے، یسار کے برعکس، اور اسے حلف کا نام بھی دیا گیا ہے کیونکہ حلف اٹھاتے وقت مرد اپنے داہنے ہاتھ دباتے تھے۔ فقہ میں زیر بحث حواس دائیں ہاتھ اور دائیں طرف ہیں۔ فقہاء کرام وضو، غسل، کھانا اور مسجد میں داخل ہونے جیسی عزت والی ہر چیز میں دائیں کو پہلے رکھنے کی سفارش کرتے ہیں، اور ہر اس چیز میں بائیں کو پہلے رکھیں جو ضرر یا عاجزی سے متعلق ہوں، جیسے ناک پھونکنا اور قضائے حاجت کے بعد۔ زیادہ تر اسکولوں میں نماز میں دایاں ہاتھ بائیں ہاتھ پر رکھنا بھی سنت ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 18005}"
  tr: "Arapçada \"sağ\" ⁦(يمين)⁩ kelimesi, solun zıttı olan sağ taraf veya uzuv anlamına gelir. Ayrıca, insanların yemin ederken sağ ellerine dokunmaları geleneğinden dolayı yemin anlamında da kullanılır. İslam hukukunda (fıkıh) ise sağ el veya sağ taraf anlamına gelir. Alimler, abdest (vudu), gusül, yemek yeme ve camiye girme gibi tüm saygı gerektiren eylemlerde sağın soldan önce tutulmasını tavsiye etmişlerdir. Tersine, burun silme veya tuvaletten sonra temizlenme gibi tüm saygısızlık veya zarar verme eylemlerinde solun önce tutulmasını tavsiye ederler. Alimlerin çoğunluğu, ibadet edenin sağ elini sol elinin üzerine koymasının tavsiye edildiği görüşündedir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.18005} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.18007}"
  id: "Dalam bahasa Arab, kata \"kanan\" ⁦(يمين)⁩ merujuk pada sisi atau anggota tubuh kanan, kebalikan dari kiri. Kata ini juga digunakan untuk merujuk pada sumpah karena orang-orang dahulu menyentuh tangan kanan mereka ketika bersumpah. Dalam yurisprudensi Islam (fiqh), kata ini merujuk pada tangan kanan atau sisi kanan. Para ulama menganjurkan untuk mendahulukan sisi kanan daripada sisi kiri dalam semua tindakan penghormatan, seperti wudhu, mandi wajib (ghusl), makan, dan memasuki masjid. Sebaliknya, mereka menganjurkan untuk mendahulukan sisi kiri dalam semua tindakan tidak hormat atau membahayakan, seperti membersihkan ingus atau membersihkan diri setelah buang air besar. Mayoritas ulama berpendapat bahwa dianjurkan bagi orang yang beribadah untuk meletakkan tangan kanan mereka di atas tangan kiri mereka. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18005} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18007}"
