summary:
  ar: "خشخاش في الكتاب أصناف كثيرة، منها البستاني الذي يتخذ من بزره خبز يؤكل في الصحة، ومنه البري أسود البزر، وصنف بحري مقرن، والزبدي لبياضه، وقوة الأصناف مبردة، والأجود الأبيض، ويذكر الكتاب علامات جيد صمغه وأنواع غشه وخلاف الأطباء السابقين في ضرره بالعين والأذن، بارد يابس في الثانية والأسود في الثالثة، منوم مخدر يمنع النزلة، وفيه خطر كما قال في الأفيون ويفضل اجتنابه ما أمكن، وينفع من السعال الحار ونفث الدم، ويقطع الإسهال المزمن، ويذكر الكتاب قولا عن المني في فقرة موسومة معلقة لحكم المؤسس، وكل ما ورد هنا نقل منسوب إلى الكتاب لا توصية {cite:canon-ibn-sina-print-v1 pp.699-701}"
  en: "Khashkhash is in the book of many kinds: the garden, from whose seed bread is made that is eaten in health, the wild with black seed, a horned sea kind, and the buttery, named for its whiteness; the power of the kinds is cooling and the best is the white; the book gives signs of a good gum and the ways it is adulterated, and the disagreement of earlier physicians on its harm to eye and ear; cold and dry in the second degree and the black in the third, it is soporific and numbing and prevents catarrh, with a danger, as the book says of opium, and avoiding it where possible is preferred; it benefits hot cough and spitting of blood and cuts chronic diarrhoea, and the book gives a statement on semen in a labelled section held for the founder's ruling; everything given here is a report attributed to the book, not a recommendation {cite:canon-ibn-sina-print-v1 pp.699-701}"
  ur: "خشخاش کتاب میں بہت سی قسموں کا ہے: باغی جس کے بیج سے روٹی بنتی ہے جو صحت میں کھائی جاتی ہے، جنگلی جس کا بیج سیاہ ہے، ایک سینگ دار سمندری قسم، اور زبدی جو اپنی سفیدی کی وجہ سے کہلاتا ہے؛ قسموں کی قوت ٹھنڈک پہنچانے والی ہے اور سب سے اچھا سفید ہے؛ کتاب اچھے گوند کی علامات اور اس میں ملاوٹ کے طریقے اور آنکھ اور کان کو اس کے نقصان کے بارے میں پہلے اطبا کا اختلاف بیان کرتی ہے؛ دوسرے درجے میں سرد خشک اور سیاہ تیسرے میں، نیند لانے والا اور سن کرنے والا ہے اور نزلہ روکتا ہے، اور اس میں خطرہ ہے جیسا کتاب افیون کے بارے میں کہتی ہے اور جہاں تک ممکن ہو اس سے بچنا بہتر ہے؛ گرم کھانسی اور خون تھوکنے میں نافع ہے اور پرانے اسہال کو روکتا ہے، اور کتاب منی کے بارے میں ایک بات موسوم حصے میں دیتی ہے جو بانی کے فیصلے کے لیے موقوف ہے، اور یہاں جو کچھ آیا وہ کتاب سے منسوب نقل ہے، سفارش نہیں {cite:canon-ibn-sina-print-v1 pp.699-701}۔"
  es: "El khashkhash se encuentra en el libro en muchas variedades: la del jardín, de cuya semilla se elabora el pan que se consume saludablemente; la silvestre, de semilla negra; una variedad marina con cuernos; y la mantecosa, llamada así por su blancura; el poder de las variedades es refrescante, siendo la blanca la mejor; el libro da indicios de una buena goma y las formas en que se adultera, así como la discrepancia entre los médicos antiguos sobre su daño a los ojos y los oídos; fría y seca en el segundo grado, y la negra en el tercero, es soporífera y adormecedora, y previene el catarro, con el peligro, como dice el libro sobre el opio, y se prefiere evitarlo en lo posible; beneficia la tos caliente y la expectoración de sangre, y reduce la diarrea crónica; y el libro incluye una declaración sobre el semen en una sección etiquetada reservada para la decisión del fundador; todo lo que se presenta aquí es un informe atribuido al libro, no una recomendación {cite:canon-ibn-sina-print-v1 pp.699-701}"
  fr: "Le livre mentionne plusieurs variétés de khashkhash: le khashkhash des jardins, dont les graines servent à faire un pain bénéfique pour la santé; le khashkhash sauvage à graines noires; une variété marine cornue; et le khashkhash beurré, ainsi nommé pour sa blancheur. Le pouvoir rafraîchissant de ces variétés est reconnu, le khashkhash blanc étant le meilleur. Le livre décrit les caractéristiques d’une gomme de bonne qualité, les méthodes de falsification et les divergences d’opinions des anciens médecins quant à ses effets nocifs sur les yeux et les oreilles. Le khashkhash froid et sec au deuxième degré, et le khashkhash noir au troisième, est soporifique et anesthésiant, et prévient le catarrhe. Il présente toutefois un danger, comme l’opium, mentionné dans le livre, et il est donc préférable de l’éviter autant que possible. Il soulage la toux grasse et les crachats de sang, et atténue la diarrhée chronique. Le livre contient également une déclaration sur le sperme dans une section réservée à l’avis du fondateur. Tout ce qui est rapporté ici est un compte rendu attribué au livre, et non une recommandation. {cite:canon-ibn-sina-print-v1 pp.699-701}"
