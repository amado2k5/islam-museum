id: concept/action-by-element
class: concept
kind: scientific
label: { ar: "الفعل بالعنصر عند ابن سينا", en: "Action by element in the Canon", fr: "L'action par l'élément dans le Canon", ur: "قانون میں عنصر کے ذریعے عمل", es: "Acción por elemento en el Canon", tr: "İbn Sina'ya göre elemanlı fiil", id: "Kata kerja dengan elemen menurut Ibn Sina" }
summary:
  ar: "الفاعل بالعنصر عند ابن سينا هو ما إذا استحال عنصره عن جوهره استحالة توجبها قوة في البدن قام بدل ما يتحلل أولاً، وزكى الحرارة الغريزية بالزيادة في الدم ثانياً، وربما فعل أيضاً بالكيفية الباقية فيه ثالثاً {cite:canon-ibn-sina-print-v1 p.132}."
  en: "For Ibn Sina, what acts by its element is that whose element, changed from its substance by a power in the body, first takes the place of what has dissolved, second fans the innate heat by adding to the blood, and sometimes third also acts by the quality that remains in it {cite:canon-ibn-sina-print-v1 p.132}."
  fr: "Pour Ibn Sina, ce qui agit par son élément est ce dont l'élément, transformé à partir de sa substance par une faculté du corps, remplace d'abord ce qui s'est dissous, attise ensuite la chaleur innée en augmentant le sang et, parfois, agit aussi, en troisième lieu, par la qualité qui subsiste en lui {cite:canon-ibn-sina-print-v1 p.132}."
  es: "Para Ibn Sina, lo que actúa por su elemento es aquel cuyo elemento, transformado de su sustancia por un poder en el cuerpo, primero toma el lugar de lo que se ha disuelto, segundo aviva el calor innato al agregarlo a la sangre, y a veces tercero también actúa por la cualidad que permanece en él {cite:canon-ibn-sina-print-v1 p.132}."
  ur: "ابن سینا کے نزدیک اس کے عنصر سے جو کام ہوتا ہے وہ یہ ہے کہ جس کا عنصر جسم میں کسی طاقت سے اپنے مادہ سے تبدیل ہو کر پہلے تحلیل شدہ چیز کی جگہ لے لیتا ہے، دوسرا خون میں شامل ہو کر پیدائشی حرارت کو پسند کرتا ہے، اور کبھی کبھی تیسرا بھی اس میں باقی رہنے والی خوبی کے مطابق عمل کرتا ہے۔"
  tr: "İbn Sina'ya göre, elementin etkeni, elementinin özünden dolayı imkansız hale geldiği anda bedende bir kuvvet gerektiren bir kuvvettir. Önce çürümek yerine, kan içindeki doğal ısı artar, ikinci olarak ise kalan haliyle de olur {cite:canon-ibn-sina-print-v1 s.132}."
  id: "Menurut Ibn Sina, agen unsur adalah ketika unsurnya menjadi mustahil dari esensinya, sebuah gaya yang membutuhkan kekuatan dalam tubuh. Alih-alih membusuk terlebih dahulu, panas alami yang meningkat dalam darah kemudian, dan mungkin juga dilakukan dalam bentuk sisa darah ketiga {cite:canon-ibn-sina-print-v1 hlm.132}."
