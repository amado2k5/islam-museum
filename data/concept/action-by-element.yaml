label: { ar: "الفعل بالعنصر عند ابن سينا", en: "Action by element in the Canon", ur: "قانون میں عنصر کے ذریعے عمل" }
summary:
  ar: "الفاعل بالعنصر عند ابن سينا هو ما إذا استحال عنصره عن جوهره استحالة توجبها قوة في البدن قام بدل ما يتحلل أولاً، وزكى الحرارة الغريزية بالزيادة في الدم ثانياً، وربما فعل أيضاً بالكيفية الباقية فيه ثالثاً {cite:canon-ibn-sina-print-v1 p.132}."
  en: "For Ibn Sina, what acts by its element is that whose element, changed from its substance by a power in the body, first takes the place of what has dissolved, second fans the innate heat by adding to the blood, and sometimes third also acts by the quality that remains in it {cite:canon-ibn-sina-print-v1 p.132}."
