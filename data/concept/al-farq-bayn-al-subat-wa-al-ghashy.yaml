id: concept/al-farq-bayn-al-subat-wa-al-ghashy
class: concept
kind: scientific
label:
  ar: "الفرق بين السبات والغشي وامتداد السبات"
  en: "How coma differs from fainting, and how coma extends"
  fr: "Comment le coma se distingue de la syncope et comment il se prolonge"
  ur: "غنودگی اور غشی میں فرق، اور غنودگی کا پھیلاؤ"
summary:
  ar: "يذكر ابن سينا الفرق بين المسبوت والمغشي عليه لضعف القلب في النبض واللون، وأن السبات قد يمتد ويكون دخوله متدرجاً، وفيه سطر موسوم في قسم معلق لحكم المؤسس {cite:canon-ibn-sina-print-v2 p.92} {cite:canon-ibn-sina-print-v2 p.93}"
  en: "Ibn Sina gives the difference between the one in coma and the one who faints from weakness of the heart in pulse and colour, and says the coma may extend and its onset be gradual; the record has a labelled line in a section held for the founder's ruling {cite:canon-ibn-sina-print-v2 p.92} {cite:canon-ibn-sina-print-v2 p.93}"
  fr: "Ibn Sina distingue la personne dans le coma de celle qui s’évanouit par faiblesse du cœur, en comparant le pouls et le teint. Il indique que le coma peut se prolonger et s’installer progressivement. La notice comporte un passage signalé dans une section réservée à la décision du fondateur {cite:canon-ibn-sina-print-v2 p.92} {cite:canon-ibn-sina-print-v2 p.93}."
  ur: "ابن سینا غنودگی والے اور دل کی کمزوری سے بے ہوش ہونے والے میں نبض اور رنگ کا فرق بتاتا ہے، اور کہتا ہے کہ غنودگی پھیل سکتی ہے اور اس کا آغاز بتدریج ہوتا ہے؛ اس میں ایک موسوم سطر بانی کے فیصلے کے لیے موقوف قسم میں ہے {cite:canon-ibn-sina-print-v2 p.92} {cite:canon-ibn-sina-print-v2 p.93}۔"
