summary:
  ar: "قلب الله على قوم لوط مدائنهم وأمطر عليهم حجارة من سجيل منضود مسومة عند ربك — عقوبة قوم ابتكروا الفاحشة ما سبقهم بها من أحد من العالمين."
  en: "God overturned the cities of Lut's people and rained upon them stones of baked clay, marked one by one with your Lord — the punishment of a people who invented an immorality none before them had committed."
  ur: "اللہ نے قومِ لوط کے شہروں کو الٹ دیا اور ان پر جلی ہوئی مٹی کی مہر شدہ پتھر برسائے — ان کی سزا جنھوں نے وہ بے حیائی ایجاد کی جو پہلے کسی نے نہ کی تھی۔"
