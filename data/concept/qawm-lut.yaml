label:
  ar: قوم لوط
  en: The people of Lut
  ur: قومِ لوط
  es: "La gente de Lut"
  fr: "Le peuple de Lut"
summary:
  ar: "قلب الله على قوم لوط مدائنهم وأمطر عليهم حجارة من سجيل منضود مسومة عند ربك — عقوبة قوم ابتكروا الفاحشة ما سبقهم بها من أحد من العالمين."
  en: "God overturned the cities of Lut's people and rained upon them stones of baked clay, marked one by one with your Lord — the punishment of a people who invented an immorality none before them had committed."
  ur: "اللہ نے قومِ لوط کے شہروں کو الٹ دیا اور ان پر جلی ہوئی مٹی کی مہر شدہ پتھر برسائے — ان کی سزا جنھوں نے وہ بے حیائی ایجاد کی جو پہلے کسی نے نہ کی تھی۔"
  es: "Dios derribó las ciudades del pueblo de Lot e hizo llover sobre ellas piedras de barro cocido, marcadas una por una con el nombre de tu Señor, como castigo para un pueblo que inventó una inmoralidad que nadie antes había cometido."
  fr: "Dieu a renversé les villes du peuple de Lut et a fait pleuvoir sur elles des pierres d'argile cuite, marquées une à une du nom de ton Seigneur — le châtiment d'un peuple qui avait inventé une immoralité qu'aucun avant lui n'avait commise."
