summary:
  ar: "الترمس في الكتاب قال ديسقوريدوس منه بستاني ومنه بري والبري أصغر، وكلاهما حب مفرطح الشكل مر الطعم منقور الوسط وهو الباقلى المصري، حار في الأولى يابس في الثانية، يجلو ويحلل بلا لذع، ويجلو الوجه والكلف والبهق، وينفع من البثور والأورام الحارة والخنازير والجرب والآكلة والقروح الرديئة وعرق النسا، وطبيخه إذا صب على الغنغرانا منع فسادها، ويفتح سدد الكبد والطحال، ويخرج الديدان وحب القرع، ويدر البول، وفيه عقل للبطن، ويذكر الكتاب نقلا موسوما إدراره الطمث وإخراجه الأجنة {cite:canon-ibn-sina-print-v1 pp.688-689}"
  en: "Tirmis is in the book, Dioscorides said, garden and wild, the wild smaller, both a flattened grain, bitter in taste, hollowed in the middle, which is the Egyptian broad bean; hot in the first degree and dry in the second, it cleanses and dissolves without stinging, cleanses the face, freckles and bahaq, benefits pustules, hot swellings, scrofula, scab, the eating ulcer, bad ulcers and sciatica, its decoction poured on gangrene prevents its corruption, it opens blockages of the liver and spleen, expels worms and the tapeworm, promotes urine and has in it a binding of the belly; and the book lists, as a labelled report, its bringing on the menses and expelling of foetuses {cite:canon-ibn-sina-print-v1 pp.688-689}"
  ur: "ترمس کتاب میں، دیسقوریدوس کے مطابق، باغی بھی ہے اور جنگلی بھی، جنگلی چھوٹا ہے، دونوں چپٹے دانے ہیں، ذائقے میں کڑوے، بیچ سے کھوکھلے، اور یہ مصری باقلا ہے؛ پہلے درجے میں گرم اور دوسرے میں خشک ہے، بغیر چبھن کے جلا دیتا اور تحلیل کرتا ہے، چہرے، جھائیوں اور بہق کو صاف کرتا ہے، پھنسیوں، گرم ورموں، خنازیر، خارش، کھانے والے قرحے، بدخیم قرحوں اور عرق النسا میں نافع ہے، اس کا جوشاندہ گینگرین پر ڈالا جائے تو اس کا بگاڑ روکتا ہے، جگر اور تلی کی رکاوٹیں کھولتا ہے، کیڑوں اور کدو دانے کو نکالتا ہے، پیشاب لاتا ہے اور اس میں پیٹ کو روکنے کی صفت ہے؛ اور کتاب منقول فہرست کے طور پر اس کا حیض جاری کرنا اور جنین نکالنا درج کرتی ہے {cite:canon-ibn-sina-print-v1 pp.688-689}۔"
