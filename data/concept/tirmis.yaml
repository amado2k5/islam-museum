summary:
  ar: "الترمس في الكتاب قال ديسقوريدوس منه بستاني ومنه بري والبري أصغر، وكلاهما حب مفرطح الشكل مر الطعم منقور الوسط وهو الباقلى المصري، حار في الأولى يابس في الثانية، يجلو ويحلل بلا لذع، ويجلو الوجه والكلف والبهق، وينفع من البثور والأورام الحارة والخنازير والجرب والآكلة والقروح الرديئة وعرق النسا، وطبيخه إذا صب على الغنغرانا منع فسادها، ويفتح سدد الكبد والطحال، ويخرج الديدان وحب القرع، ويدر البول، وفيه عقل للبطن، ويذكر الكتاب نقلا موسوما إدراره الطمث وإخراجه الأجنة {cite:canon-ibn-sina-print-v1 pp.688-689}"
  en: "Tirmis is in the book, Dioscorides said, garden and wild, the wild smaller, both a flattened grain, bitter in taste, hollowed in the middle, which is the Egyptian broad bean; hot in the first degree and dry in the second, it cleanses and dissolves without stinging, cleanses the face, freckles and bahaq, benefits pustules, hot swellings, scrofula, scab, the eating ulcer, bad ulcers and sciatica, its decoction poured on gangrene prevents its corruption, it opens blockages of the liver and spleen, expels worms and the tapeworm, promotes urine and has in it a binding of the belly; and the book lists, as a labelled report, its bringing on the menses and expelling of foetuses {cite:canon-ibn-sina-print-v1 pp.688-689}"
  ur: "ترمس کتاب میں، دیسقوریدوس کے مطابق، باغی بھی ہے اور جنگلی بھی، جنگلی چھوٹا ہے، دونوں چپٹے دانے ہیں، ذائقے میں کڑوے، بیچ سے کھوکھلے، اور یہ مصری باقلا ہے؛ پہلے درجے میں گرم اور دوسرے میں خشک ہے، بغیر چبھن کے جلا دیتا اور تحلیل کرتا ہے، چہرے، جھائیوں اور بہق کو صاف کرتا ہے، پھنسیوں، گرم ورموں، خنازیر، خارش، کھانے والے قرحے، بدخیم قرحوں اور عرق النسا میں نافع ہے، اس کا جوشاندہ گینگرین پر ڈالا جائے تو اس کا بگاڑ روکتا ہے، جگر اور تلی کی رکاوٹیں کھولتا ہے، کیڑوں اور کدو دانے کو نکالتا ہے، پیشاب لاتا ہے اور اس میں پیٹ کو روکنے کی صفت ہے؛ اور کتاب منقول فہرست کے طور پر اس کا حیض جاری کرنا اور جنین نکالنا درج کرتی ہے {cite:canon-ibn-sina-print-v1 pp.688-689}۔"
  es: "En el libro, Dioscórides dice que Tirmis es de jardín y silvestre, la silvestre más pequeña, ambas de grano aplanado, de sabor amargo, huecas en el centro, que es la haba egipcia; caliente en el primer grado y seca en el segundo, limpia y disuelve sin escocer, limpia el rostro, las pecas y el bahaq, beneficia las pústulas, las hinchazones calientes, la escrófula, la sarna, la úlcera péptica, las úlceras graves y la ciática, su decocción vertida sobre la gangrena previene su corrupción, desbloquea el hígado y el bazo, expulsa los gusanos y la tenia, promueve la micción y tiene un efecto antiestrés; y el libro enumera, como un informe etiquetado, su efecto para inducir la menstruación y expulsar fetos {cite:canon-ibn-sina-print-v1 pp.688-689}"
  fr: "Tirmis est mentionnée dans le livre, dit Dioscoride, sous forme de fève cultivée et sauvage, cette dernière étant plus petite. Toutes deux sont des graines aplaties, amères et creuses, qui sont la fève égyptienne. De nature chaude au premier degré et sèche au second, elle purifie et dissout sans piquer, nettoie le visage, les taches de rousseur et les brûlures d'estomac, et est bénéfique pour les pustules, les gonflements chauds, la scrofule, la croûte, l'ulcère bouchère, les ulcères graves et la sciatique. Sa décoction, appliquée sur la gangrène, prévient sa progression. Elle débloque le foie et la rate, expulse les vers et le ténia, favorise la diurèse et soulage les ballonnements. Le livre mentionne également, sous forme de rapport, son effet déclenchant les menstruations et favorisant l'expulsion des fœtus. {cite:canon-ibn-sina-print-v1 pp.688-689}"
  tr: "Kitapta Dioscorides, bazılarının bahçecilik, bazılarının yabani, bazılarının ise daha küçük olduğunu belirtmiştir. Her ikisi de çok keskin şekilli, acı tada ve orta bükülmüş şekilli olan Mısır fasulyesi olan tahıllardır. İlkinde sıcak, ikincisinde kurudur, berraktır ve batmaz. Yüz, melazma ve vitiligo giderir. Sivilceler, sıcak tümörler, domuzlar, uyuz, yeme yaraları, kötü ülserler ve siyatik için faydalıdır. Pişirme yöntemi, kangrene döküldüğünde bozulmasını önler, karaciğer ve dalak kapakçıklarını açar, solucanları ve kabak çekirdeği atarım, idrar söktürücüleri teşvik eder ve karın için bir beyin içerir. Kitapta 'Menstruasyon idrarı ve fetüsleri dışarı atmak' başlıklı bir anlatımdan bahsedilir {cite:canon-ibn-sina-print-v1 s.688-689}"
  id: "Dalam bukunya, Dioscorides mengatakan bahwa beberapa adalah hortikultura, beberapa liar, dan liar lebih kecil. Keduanya adalah biji-bijian dengan bentuk sangat tajam, rasa pahit, dan bentuk sedang melengkung, yaitu kacang Mesir. Panas pada yang pertama dan kering pada yang kedua, serta bening dan membusuk tanpa perih. Ini menghilangkan wajah, melasma, dan vitiligo. Ini bermanfaat untuk jerawat, tumor panas, babi, kudis, luka makan, tukak buruk, dan sciatica. Masakannya, ketika dituangkan pada gangren, mencegah pembusukan, membuka katup hati dan limpa, mengeluarkan cacing dan biji labu, mendorong diuretik, dan mengandung otak untuk perut. Buku ini menyebutkan narasi berjudul 'Buang air kecil menstruasi dan mengeluarkan janin' {cite:canon-ibn-sina-print-v1 hlm.688-689}"
