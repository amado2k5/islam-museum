label:
  ar: إخبار
  en: Ikhbar (report, and its names in law)
summary:
  ar: 'الإخبار إعلام بالخبر، وله أسماء بحسب موضوعه: الدعوى والإقرار والشهادة والقضاء والرواية والغيبة والنميمة والإفشاء والخيانة؛ وخبر العدل يقبل، والفاسق لا يقبل في الديانات، وتفصيل أحكامه يكون في مواضعه من الطهارة والشفعة والذبائح والنكاح والحظر والإباحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1902} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1903}.'
  en: 'Ikhbar is the act of reporting; it has names according to its subject: claim, acknowledgement, testimony, judgement, narration, backbiting, tale-bearing, disclosure and betrayal; the report of a just person is accepted, while a dissolute person''s report is not accepted in religious matters; its detailed rules are read where they arise, in purity, pre-emption, slaughter, marriage and the lawful and forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1902} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1903}.'
