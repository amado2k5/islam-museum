id: concept/ikhbar
class: concept
kind: legal
label:
  ar: إخبار
  en: Ikhbar (report, and its names in law)
  es: "Ikhbar (informe y sus nombres en la ley)"
  fr: "Ikhbar (rapport et ses noms en droit)"
  ur: "خبر ⁦(رپورٹ، اور قانون میں اس کے نام)⁩"
summary:
  ar: 'الإخبار إعلام بالخبر، وله أسماء بحسب موضوعه: الدعوى والإقرار والشهادة والقضاء والرواية والغيبة والنميمة والإفشاء والخيانة؛ وخبر العدل يقبل، والفاسق لا يقبل في الديانات، وتفصيل أحكامه يكون في مواضعه من الطهارة والشفعة والذبائح والنكاح والحظر والإباحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1902} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1903}.'
  en: 'Ikhbar is the act of reporting; it has names according to its subject: claim, acknowledgement, testimony, judgement, narration, backbiting, tale-bearing, disclosure and betrayal; the report of a just person is accepted, while a dissolute person''s report is not accepted in religious matters; its detailed rules are read where they arise, in purity, pre-emption, slaughter, marriage and the lawful and forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1902} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1903}.'
  es: "Ikhbar es el acto de informar; tiene nombres según su tema: reclamo, reconocimiento, testimonio, juicio, narración, calumnia, chismorreo, revelación y traición; el informe de una persona justa es aceptado, mientras que el informe de una persona disoluta no lo es en asuntos religiosos; sus reglas detalladas se leen donde surgen, en pureza, preeminencia, matanza, matrimonio y lo lícito y lo ilícito. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1902} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1903}."
  fr: "L'ikhbar est l'acte de rapporter; il porte différents noms selon son sujet: revendication, reconnaissance, témoignage, jugement, récit, médisance, colportage de rumeurs, divulgation et trahison. Le rapport d'une personne juste est accepté, tandis que celui d'une personne dissolue ne l'est pas en matière religieuse. Ses règles détaillées sont lues lorsqu'elles se présentent, notamment en matière de pureté, de préemption, d'abattage, de mariage et de distinction entre ce qui est licite et ce qui est illicite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1902} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1903}."
  ur: "خبر رپورٹنگ کا عمل ہے۔ اس کے موضوع کے مطابق نام ہیں: دعوی، اعتراف، گواہی، فیصلہ، بیان، غیبت، کہانی بیان کرنا، انکشاف اور خیانت؛ ایک عادل شخص کی رپورٹ قبول کی جاتی ہے، جبکہ ایک منحرف شخص کی رپورٹ مذہبی معاملات میں قبول نہیں کی جاتی ہے۔ اس کے تفصیلی احکام پڑھے جاتے ہیں جہاں وہ پیدا ہوتے ہیں، طہارت، قبل از وقت، ذبح، نکاح اور حلال و حرام میں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1902} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1903}۔"
