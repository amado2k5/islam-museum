label:
  ar: الخنزير
  en: Khinzir (the pig in fiqh)
  ur: خنزیر
summary:
  ar: 'الخنزير حيوان محرم؛ أجمعت الأمة على تحريم أكل لحمه إلا لضرورة بقوله تعالى في سورة الأنعام، ويقدم عند الضرورة الكلب على الخنزير عند الحنابلة، وتقدم ميتة غيره على الخنزير عند المالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7878}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7879} نجاسة عينه: الحنفية والشافعية والحنابلة يرون نجاسة عين الخنزير وأجزائه ومنيه ولعابه وعرقه، والمالكية يرون طهارة عينه حال الحياة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7879} دباغ الجلد: لا يطهر جلده بالدباغ بالاتفاق، وروي عن أبي يوسف أن جلده يطهر، ونقل ابن الغرس عن المالكية جواز الانتفاع بجلده إذا دبغ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7880} سؤره: نجس عند الشافعية والحنفية والحنابلة، وتغسل الإناءة سبعا كالكلب عند الشافعية والحنابلة، وثلاثا عند الحنفية؛ المالكية يرون سؤره طاهرا لأن لعابه طاهر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7880}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7881} شعره: الجمهور على نجاسته فلا يستعمل، وعند المالكية طاهر إذا قص لا نتف؛ والحنفية أباحوا استعماله للخرازين للضرورة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7881} التداوي بأجزائه: محرم، لعدم جواز التداوي بالنجس والمحرم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7881} تحول عينه: الحنفية والمالكية وأحمد في رواية يرون أن النجس يطهر بالاستحالة، فإذا استحال الخنزير ملحا طهر؛ الشافعية والحنابلة لا يطهر، إلا الخمر وجلد الميتة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7881} المالية: اتفق الفقهاء على أن الخنزير ليس مالا متقوما في حق المسلم، وعدم صحة بيعه وشرائه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7881}'
  en: 'The pig is forbidden: the community agrees on the prohibition of eating its flesh except in necessity, on the Quranic verse of al-An''am; the Hanbalis give the dog precedence over the pig in necessity, the Malikis give other carrion precedence over pig. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7878}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7879} Its impurity: the Hanafis, Shafiis and Hanbalis hold the pig and all its parts, its semen, saliva and sweat impure; the Malikis hold its substance pure while alive. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7879} Tanning its hide: it is not purified by tanning by agreement; a report from Abu Yusuf says it is; Ibn al-Faras reports a Maliki view that its hide may be used once tanned. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7880} Leftover: impure by the Shafiis, Hanafis and Hanbalis, washed seven times for a dog in the Shafii and Hanbali view and three in the Hanafi; the Malikis hold it pure because its saliva is pure. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7880}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7881} Its hair: most jurists hold it impure and forbid its use; for the Malikis it is pure if cut, not plucked; the Hanafis allow its use by cobblers in necessity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7881} Medicine from its parts: forbidden, since medicine from the impure and the forbidden is not allowed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7881} Change of substance: the Hanafis, Malikis and a Hanbali report hold that an impure thing purified by transformation, so a pig turned into salt is clean; the Shafiis and Hanbalis say no, except wine and the hide of carrion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7881} Value: by agreement the pig is not property of value for a Muslim, so its sale and purchase are invalid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7881}'
  ur: 'خنزیر حرام جانور ہے؛ امت کا اتفاق ہے کہ ضرورت کے سوا اس کا گوشت حرام ہے، سورۂ انعام کی آیت کی بنا پر؛ حنابلہ ضرورت میں کتے کو خنزیر پر مقدم کرتے ہیں، مالکیہ دوسرے مردار کو خنزیر پر مقدم کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7878}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7879} نجاستِ عین: حنفیہ، شافعیہ اور حنابلہ خنزیر اور اس کے اجزاء، منی، لعاب اور پسینے کو ناپاک کہتے ہیں؛ مالکیہ زندگی میں اس کی ذات کو پاک مانتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7879} کھال کی دباغت: بالاتفاق پاک نہیں ہوتی، ابو یوسف سے منقول ہے کہ پاک ہوتی ہے؛ ابن الفرس کے مطابق مالکیہ کا ایک قول ہے کہ دباغت کے بعد اس کی کھال سے نفع لینا جائز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7880} جھوٹا (سؤر): شافعیہ، حنفیہ اور حنابلہ کے نزدیک ناپاک؛ شافعیہ اور حنابلہ کے نزدیک برتن کو کتے کی طرح سات بار دھویا جائے، حنفیہ تین بار؛ مالکیہ اسے پاک کہتے ہیں کیونکہ اس کا لعاب پاک ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7880}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7881} بال: جمہور کے نزدیک ناپاک ہیں، استعمال ممنوع؛ مالکیہ کے نزدیک کاٹے ہوئے بال پاک، اکھیڑے ہوئے ناپاک؛ حنفیہ موچیوں کو ضرورت میں استعمال کی اجازت دیتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7881} اجزاء سے علاج: ناجائز، کیونکہ ناپاک اور حرام چیز سے علاج جائز نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7881} ماہیت کی تبدیلی: حنفیہ، مالکیہ اور احمد کی ایک روایت کے مطابق ناپاک چیز استحالہ سے پاک ہو جاتی ہے، خنزیر نمک بن جائے تو پاک؛ شافعیہ اور حنابلہ نہیں، سوائے شراب اور مردار کی کھال کے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7881} مالیت: بالاتفاق خنزیر مسلمان کے حق میں متقوم مال نہیں، اس کی بیع و شراء صحیح نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7881}'
