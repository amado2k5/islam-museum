id: concept/rukhsa-usul
class: concept
kind: doctrine
label:
  ar: "الرخصة"
  en: "Rukhsa (the concession: a ruling eased for a reason, set against the strict ruling 'azima)"
  ur: "رخصت"
summary:
  ar: "الرخصة في اللغة اليسر والإذن بعد النهي، وفي الاصطلاح ما وُسّع للمكلف في فعله لعذر عجز عنه مع قيام السبب المحرم، وهي تقابل العزيمة، وتتقارب مع الإباحة ورفع الحرج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8675} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8677} وتتعدد أسبابها من ضرورة وحاجة وسفر ومرض ونسيان وإكراه، وتتنوع إلى واجبة ومندوبة ومباحة وخلاف الأولى عند الشافعية، وإلى حقيقية ومجازية عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8678} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8680} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8681} وأخذ بعض الفقهاء العزيمة أولى في بعض الصور، كالإكراه على الكفر إذا كان الامتناع يُفضي إلى القتل، ومن يصوم في السفر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8681} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8682} ويجوز القياس على الرخص عند الجمهور، ويمنع أبو حنيفة إلا عند أبي يوسف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8687} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8688} وتتبع الرخص لغير سبب شرعي محرّم، والأخذ بها عند سبب شرعي جائز. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8688} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8689}"
  en: "Rukhsa in the lexicon is ease and permission after a prohibition; in usage it is what is made lighter for the person in doing something, for a cause that prevents him from the strict ruling while the forbidding cause remains. It is set against 'azima, and is close to permission and to lifting hardship. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8675} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8677} Its causes are necessity, need, travel, illness, forgetting and compulsion; its kinds are obligatory, recommended, permitted and against the better course for the Shafi'is, and real and figurative for the Hanafis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8678} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8680} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8681} Some jurists hold that the strict ruling is better in some cases, such as compelled unbelief when refusing would mean death, and fasting on a journey. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8681} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8682} Analogy from a concession is allowed by the majority and refused by the Hanafis, except Abu Yusuf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8687} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8688} Taking up concessions merely to escape duty is condemned; taking them for a lawful cause is permitted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8688} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8689}"
  ur: "رخصت وہ آسانی ہے جو عذر کی بنا پر مکلف کو دی گئی ہو، جبکہ عزیمت اصل سخت حکم ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8675} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8676} اسباب میں ضرورت، حاجت، سفر اور بیماری شامل ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8686} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8687}"
