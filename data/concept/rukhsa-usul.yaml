label:
  ar: "الرخصة"
  en: "Rukhsa (the concession: a ruling eased for a reason, set against the strict ruling 'azima)"
  ur: "رخصت"
  es: "Rukhsa (la concesión: una norma suavizada por una razón, en contraposición a la estricta norma 'azima)"
  fr: "Rukhsa (la concession: une règle assouplie pour une raison, par opposition à la règle stricte 'azima)"
  tr: "Lisans"
  id: "Lisensi"
summary:
  ar: "الرخصة في اللغة اليسر والإذن بعد النهي، وفي الاصطلاح ما وُسّع للمكلف في فعله لعذر عجز عنه مع قيام السبب المحرم، وهي تقابل العزيمة، وتتقارب مع الإباحة ورفع الحرج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8675} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8677} وتتعدد أسبابها من ضرورة وحاجة وسفر ومرض ونسيان وإكراه، وتتنوع إلى واجبة ومندوبة ومباحة وخلاف الأولى عند الشافعية، وإلى حقيقية ومجازية عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8678} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8680} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8681} وأخذ بعض الفقهاء العزيمة أولى في بعض الصور، كالإكراه على الكفر إذا كان الامتناع يُفضي إلى القتل، ومن يصوم في السفر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8681} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8682} ويجوز القياس على الرخص عند الجمهور، ويمنع أبو حنيفة إلا عند أبي يوسف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8687} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8688} وتتبع الرخص لغير سبب شرعي محرّم، والأخذ بها عند سبب شرعي جائز. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8688} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8689} ويذكر الشاطبي في النوع الخامس من كتاب الأحكام أن الرخصة ما شرع لعذر شاق استثناءً من أصل كلي يقتضي المنع، مقتصراً على مواضع الحاجة، وأن الحاجيات الكليات كالقرض والقراض والمساقاة ليست رخصاً لأنها تبقى مشروعة بعد زوال العذر، وأن الرخصة ليست مشروعة ابتداء وإن عرض لها ذلك فعرضاً. {cite:muwafaqat p.183-184} ويعدّد أربعة إطلاقات لاسم الرخصة: ما شرع لعذر من أصل كلي مانع وهو الإطلاق الذي عليه التفريع في هذا النوع، وما وضع عن هذه الأمة من التكاليف الغليظة والأعمال الشاقة، وما كان مشروعات توسيعاً على العباد مطلقاً، وما كان تسهلاً في قضاء أوطارهم، ويقرر أن حكم الرخصة الإباحة مطلقاً من حيث هي رخصة. {cite:muwafaqat p.185-187}"
  en: "Rukhsa in the lexicon is ease and permission after a prohibition; in usage it is what is made lighter for the person in doing something, for a cause that prevents him from the strict ruling while the forbidding cause remains. It is set against 'azima, and is close to permission and to lifting hardship. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8675} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8677} Its causes are necessity, need, travel, illness, forgetting and compulsion; its kinds are obligatory, recommended, permitted and against the better course for the Shafi'is, and real and figurative for the Hanafis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8678} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8680} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8681} Some jurists hold that the strict ruling is better in some cases, such as compelled unbelief when refusing would mean death, and fasting on a journey. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8681} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8682} Analogy from a concession is allowed by the majority and refused by the Hanafis, except Abu Yusuf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8687} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8688} Taking up concessions merely to escape duty is condemned; taking them for a lawful cause is permitted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8688} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8689} In the fifth division of the Book of Rulings al-Shatibi holds that the rukhsa is what was legislated for a severe excuse as an exception from a universal prohibiting principle, confined to places of need, and that the universal needs-based provisions such as loan, partnership and sharecropping are not rukhas because they remain lawful after the excuse lapses; the rukhsa is not legislated from the outset, though it may contingently become so. {cite:muwafaqat p.183-184} He enumerates four expansions of the name rukhsa: what was legislated for an excuse out of a prohibiting universal principle — the expansion on which this division's subdivisions rest — what was lifted from this community of harsh duties and laborious works, what was legislated as facilitation for servants absolutely, and what was ease in attaining their goals; and he holds that the ruling of the rukhsa is unrestricted permission in itself as a rukhsa. {cite:muwafaqat p.185-187}"
  ur: "رخصت وہ آسانی ہے جو عذر کی بنا پر مکلف کو دی گئی ہو، جبکہ عزیمت اصل سخت حکم ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8675} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8676} اسباب میں ضرورت، حاجت، سفر اور بیماری شامل ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8686} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8687}"
  es: "Rukhsa en el léxico es facilidad y permiso después de una prohibición; en el uso es lo que se aligera para la persona al hacer algo, por una causa que le impide la regla estricta mientras la causa prohibitiva permanece. Se contrapone a 'azima, y está cerca del permiso y de aliviar la dificultad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8675} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8677} Sus causas son necesidad, necesidad, viaje, enfermedad, olvido y coacción; sus tipos son obligatorio, recomendado, permitido y contrario al mejor curso para los shafi'is, y real y figurado para los hanafíes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8678} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8680} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8681} Algunos juristas sostienen que la regla estricta es mejor en algunos casos, como la incredulidad forzada cuando negarse significaría la muerte, y el ayuno en un viaje. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8681} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8682} La analogía de una concesión es permitida por la mayoría y rechazada por los Hanafi, excepto Abu Yusuf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8687} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8688} Tomar concesiones simplemente para escapar del deber es condenado; tomarlas por una causa lícita es permitido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8688} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8689} En la quinta división del Libro de los Dictámenes, al-Shatibi sostiene que la rukhsa es lo que fue legislado para una excusa severa como excepción de un principio de prohibición universal, confinado a lugares de necesidad, y que las disposiciones universales basadas en necesidades como el préstamo, la sociedad y el aparcería no son rukhas porque siguen siendo lícitas después de que la excusa caduca; la rukhsa no es legislada desde el principio, aunque puede llegar a serlo contingentemente. {cite:muwafaqat p.183-184} Enumera cuatro expansiones del nombre rukhsa: lo que se legisló para eximir de un principio universal prohibitivo —la expansión en la que se basan las subdivisiones de esta división—, lo que se eliminó de esta comunidad de deberes duros y trabajos laboriosos, lo que se legisló como facilitación para los sirvientes en general, y lo que facilitó el logro de sus objetivos; y sostiene que la norma de la rukhsa es un permiso irrestricto en sí mismo como rukhsa. {cite:muwafaqat p.185-187}"
  fr: "Dans le lexique, la rukhsa désigne l'aisance et la permission après une interdiction; dans l'usage, elle correspond à ce qui est allégé pour la personne qui accomplit une action, en raison d'une cause qui l'empêche d'appliquer strictement la règle, tandis que la cause de l'interdiction demeure. Elle s'oppose à l'azima et se rapproche de la permission et de l'allègement de la difficulté. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8675} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8677} Ses causes sont la nécessité, le besoin, le voyage, la maladie, l'oubli et la contrainte; ses types sont obligatoires, recommandés, permis et contraires à la meilleure voie pour les shafi'ites, et réels et figuratifs pour les hanafites. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8678} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8680} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8681} Certains juristes estiment que la règle stricte est préférable dans certains cas, comme l'incroyance forcée lorsque le refus entraînerait la mort, et le jeûne lors d'un voyage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8681} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8682} L'analogie avec une concession est admise par la majorité et refusée par les hanafites, à l'exception d'Abou Yusuf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8687} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8688} Il est interdit d'obtenir des concessions uniquement pour se soustraire à ses obligations; il est permis d'en obtenir pour une cause légitime. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8688} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8689} Dans la cinquième section du Livre des règles, al-Shatibi soutient que la rukhsa est ce qui a été légiféré pour une excuse grave, comme une exception à un principe d'interdiction universel, limitée aux cas de nécessité, et que les dispositions universelles fondées sur les besoins, telles que le prêt, le partenariat et le métayage, ne sont pas des rukhsa car elles restent licites après l'expiration de l'excuse; La rukhsa n'est pas inscrite dans la loi dès le départ, bien qu'elle puisse le devenir contingemment. {cite:muwafaqat p.183-184} Il énumère quatre extensions du terme rukhsa: ce qui fut légiféré comme excuse en vertu d'un principe universel d'interdiction – extension sur laquelle reposent les subdivisions de cette division; ce qui fut retiré à cette communauté des devoirs pénibles et des travaux laborieux; ce qui fut légiféré comme une facilitation absolue pour les serviteurs; et ce qui constituait une aisance dans l'atteinte de leurs objectifs. Il soutient que la règle de la rukhsa est en elle-même une permission sans restriction, en tant que rukhsa. {cite:muwafaqat p.185-187}"
  tr: "Dilbilimde izin, yasaklama sonrası rahatlık ve izin anlamına gelirken, terminolojide, yasak sebep ortaya konduğunda yapamayacağı bir bahane nedeniyle zorunlu kişinin bunu yapmasına izin verilen şeydir. Bu, belirlenmeye karşılık gelir ve zorluğun giderilmesine ve izin verilmesine yakındır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.8675} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8677} Nedenleri zorunluluk, ihtiyaç, seyahat, hastalık, unutkanlık ve zorunluluktan Şafiilere göre zorunlu, tavsiye edilen, izin verilen ve ilkine aykırı olan, Hanefilere göre gerçek ve mecazi olanlara kadar değişir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8678} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8680} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8681} Bazı hukukçular, belirli durumlarda kararlılığı tercih etmiştir; örneğin, zorlama, inanamak ölümle sonuçlanırsa inanmama ve seyahat ederken oruç tutanlar gibi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8681} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8682} Çoğunluğa göre verilen tavizlere benzetmek mümkündür ve Abu Hanifa ancak Abu Yusuf'a göre yasaktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8687} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8688} ve yasal bir gerekçe olmaksızın lisansları takip etmek ve bunları yasal bir nedenle almak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8688} {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.8689} Al-Shatibi, Al-Ahkam adlı kitabın beşinci türünde, tavizin zor bir bahane için yasalaştırılmış olan şey olduğunu, yasaklama gerektiren genel bir ilkenin istisnası olduğunu, sadece ihtiyaç durumlarıyla sınırlı olduğunu ve genel ihtiyaçlar olan krediler, borçlar ve musaqah gibi genel ihtiyaçların taviz sayılmadığını, çünkü mazeret geçtikten sonra meşru kaldıklarını ve tavizlerin başlangıçta zorunlu kılılmadığını, hatta tabi tutulsalar bile, sonra kazara verilmediğini belirtir. {cite:muwafaqk, s.183-184} 'İmtiyaz' terimi için dört terim sayar: genel bir yasağın bahanesi olarak yasalaştırılan ve bu kategoride türetilen genel terim, bu ulusa ağır yükümlülükler ve ağır emek dayatılan, hizmetçiler için bir genişleme olarak çıkarılan ve zorunlu dualarını yerine getiremelerine kolaylık sağlamayan terimler. Taviz kararının, bir taviz olduğu ölçüde mutlak izin verilebilirlik olduğunu ortaya koyar. {cite:muwafaqat s.185-187}"
  id: "Dalam linguistik, izin berarti kemudahan dan izin setelah larangan, dan dalam terminologi, izin adalah apa yang diizinkan bagi orang yang berkewajiban untuk melakukannya karena alasan yang tidak dapat dilakukan ketika penyebab terlarang ditetapkan. Ini setara dengan penentuan dan mendekati izin serta penghapusan kesulitan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8675} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8677} Penyebabnya bervariasi dari kebutuhan, kebutuhan, perjalanan, penyakit, pelupaan, dan paksaan, mulai dari kewajiban, direkomendasikan, diperbolehkan, dan bertentangan dengan yang pertama menurut Shafi'i, hingga nyata dan metaforis menurut Hanafi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8678} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8680} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8681} Beberapa ahli hukum menganggap keputusan ini lebih baik dalam kasus tertentu, seperti memaksa untuk tidak percaya jika menahan diri berujung pada kematian, dan mereka yang berpuasa saat bepergian. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8681} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8682} Diperbolehkan untuk analogi dengan konsesi menurut mayoritas, dan Abu Hanifa dilarang kecuali menurut Abu Yusuf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8687} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8688} dan mengikuti izin tanpa alasan sah yang sah, serta mengambilnya untuk alasan hukum yang diizinkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8688} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8689} Al-Shatibi menyebutkan dalam tipe kelima buku Al-Ahkam bahwa konsesi adalah apa yang diundang-undang sebagai alasan yang sulit, pengecualian dari prinsip umum yang mengharuskan larangan, terbatas pada kasus kebutuhan, dan bahwa kebutuhan umum seperti pinjaman, pinjaman, dan musaqah bukanlah konsesi karena tetap sah setelah alasan itu berlalu, dan bahwa konsesi tidak ditetapkan pada awalnya, bahkan jika dikenakan ke dalamnya, kemudian secara tidak sengaja. {cite:muwafaqat hlm.183-184} Ia menyebutkan empat istilah untuk istilah 'konsesi': apa yang diatur sebagai alasan larangan umum, yang merupakan istilah umum yang dapat diturunkan dalam kategori ini, apa yang telah dipaksakan pada bangsa ini berupa kewajiban berat dan kerja keras, apa yang diberlakukan sebagai perluasan bagi para pelayan sama sekali, dan apa yang bukan fasilitasi dalam memenuhi doa wajib mereka. Ia menetapkan bahwa putusan tentang konsesi adalah izin mutlak sejauh itu merupakan konsesi. {cite:muwafaqat hlm.185-187}"
