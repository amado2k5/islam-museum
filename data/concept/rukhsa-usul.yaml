tags: [madhahib-browser, mh-mafahim]
label:
  ar: "الرخصة"
  en: "Rukhsa (the concession: a ruling eased for a reason, set against the strict ruling 'azima)"
  ur: "رخصت"
summary:
  ar: "الرخصة في اللغة اليسر والإذن بعد النهي، وفي الاصطلاح ما وُسّع للمكلف في فعله لعذر عجز عنه مع قيام السبب المحرم، وهي تقابل العزيمة، وتتقارب مع الإباحة ورفع الحرج. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8675} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8677} وتتعدد أسبابها من ضرورة وحاجة وسفر ومرض ونسيان وإكراه، وتتنوع إلى واجبة ومندوبة ومباحة وخلاف الأولى عند الشافعية، وإلى حقيقية ومجازية عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8678} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8680} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8681} وأخذ بعض الفقهاء العزيمة أولى في بعض الصور، كالإكراه على الكفر إذا كان الامتناع يُفضي إلى القتل، ومن يصوم في السفر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8681} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8682} ويجوز القياس على الرخص عند الجمهور، ويمنع أبو حنيفة إلا عند أبي يوسف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8687} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8688} وتتبع الرخص لغير سبب شرعي محرّم، والأخذ بها عند سبب شرعي جائز. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8688} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8689} ويذكر الشاطبي في النوع الخامس من كتاب الأحكام أن الرخصة ما شرع لعذر شاق استثناءً من أصل كلي يقتضي المنع، مقتصراً على مواضع الحاجة، وأن الحاجيات الكليات كالقرض والقراض والمساقاة ليست رخصاً لأنها تبقى مشروعة بعد زوال العذر، وأن الرخصة ليست مشروعة ابتداء وإن عرض لها ذلك فعرضاً. {cite:muwafaqat p.183-184} ويعدّد أربعة إطلاقات لاسم الرخصة: ما شرع لعذر من أصل كلي مانع وهو الإطلاق الذي عليه التفريع في هذا النوع، وما وضع عن هذه الأمة من التكاليف الغليظة والأعمال الشاقة، وما كان مشروعات توسيعاً على العباد مطلقاً، وما كان تسهلاً في قضاء أوطارهم، ويقرر أن حكم الرخصة الإباحة مطلقاً من حيث هي رخصة. {cite:muwafaqat p.185-187}"
  en: "Rukhsa in the lexicon is ease and permission after a prohibition; in usage it is what is made lighter for the person in doing something, for a cause that prevents him from the strict ruling while the forbidding cause remains. It is set against 'azima, and is close to permission and to lifting hardship. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8675} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8676} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8677} Its causes are necessity, need, travel, illness, forgetting and compulsion; its kinds are obligatory, recommended, permitted and against the better course for the Shafi'is, and real and figurative for the Hanafis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8678} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8679} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8680} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8681} Some jurists hold that the strict ruling is better in some cases, such as compelled unbelief when refusing would mean death, and fasting on a journey. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8681} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8682} Analogy from a concession is allowed by the majority and refused by the Hanafis, except Abu Yusuf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8687} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8688} Taking up concessions merely to escape duty is condemned; taking them for a lawful cause is permitted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8688} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8689} In the fifth division of the Book of Rulings al-Shatibi holds that the rukhsa is what was legislated for a severe excuse as an exception from a universal prohibiting principle, confined to places of need, and that the universal needs-based provisions such as loan, partnership and sharecropping are not rukhas because they remain lawful after the excuse lapses; the rukhsa is not legislated from the outset, though it may contingently become so. {cite:muwafaqat p.183-184} He enumerates four expansions of the name rukhsa: what was legislated for an excuse out of a prohibiting universal principle — the expansion on which this division's subdivisions rest — what was lifted from this community of harsh duties and laborious works, what was legislated as facilitation for servants absolutely, and what was ease in attaining their goals; and he holds that the ruling of the rukhsa is unrestricted permission in itself as a rukhsa. {cite:muwafaqat p.185-187}"
  ur: "رخصت وہ آسانی ہے جو عذر کی بنا پر مکلف کو دی گئی ہو، جبکہ عزیمت اصل سخت حکم ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8675} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8676} اسباب میں ضرورت، حاجت، سفر اور بیماری شامل ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8686} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8687}"
