id: "concept/alamat-al-ramad"
class: "concept"
kind: "scientific"
label:
  ar: "علامات الرمد وأصنافه"
  en: "Signs of ophthalmia and its kinds"
  fr: "Signes et formes de l’ophtalmie"
  ur: "رمد اور اس کی اقسام کی علامات"
summary:
  ar: "أوجاع العين منها لذاعة أكالة تدل على فساد كيفية المادة وحدتها ومنها متمددة تدل على كثرتها أو على الريح، والرمد الدموي يدل عليه لون العين ودرور العرق وضربان الصدغين، والصفراوي نخس أشد ووجع محرق وحمرة أقل ودمعة رقيقة حارة، والبلغمي ثقل شديد وحمرة خفيفة والسلطان للبياض، والسوداوي ثقل مع كمودة وجفاف، والريحي تمدد فقط بلا ثقل ولا سيلان {cite:canon-ibn-sina-print-v2 p.168} {cite:canon-ibn-sina-print-v2 p.169}"
  en: "Eye pains are of two kinds: the biting eating one points to the matter's corrupt quality and sharpness, the distending one to its quantity or to wind; sanguineous ramad is told by the eye's colour, the running vessel and pulsing temples; the choleric by sharper pricking, burning pain, less redness and a thin hot tear; the phlegmy by heavy weight, faint redness where white rules; the melancholic by heaviness with gloom and dryness; the windy by distension alone with neither weight nor flow {cite:canon-ibn-sina-print-v2 p.168} {cite:canon-ibn-sina-print-v2 p.169}"
  fr: "Ibn Sina distingue deux douleurs de l’œil : l’une, mordante et corrosive, indique l’altération et l’âcreté de la matière ; l’autre, distensive, signale sa quantité ou la présence d’un vent. La forme sanguine se reconnaît à la couleur de l’œil, à l’afflux dans le vaisseau et aux battements des tempes ; la bilieuse, à des élancements plus vifs, une douleur brûlante, une rougeur moindre et un larmoiement fluide et chaud ; la flegmatique, à une forte pesanteur et à une faible rougeur sur laquelle domine le blanc ; la mélancolique, à la pesanteur accompagnée d’une teinte terne et de sécheresse ; celle due au vent, à la seule distension, sans pesanteur ni écoulement {cite:canon-ibn-sina-print-v2 p.168} {cite:canon-ibn-sina-print-v2 p.169}."
  ur: "آنکھ کے درد دو قسم کے ہیں: چبھن والا کاٹنے والا مادے کی خراب کیفیت اور تیزی پر، اور تان دینے والا اس کی کثرت یا ریح پر دلالت کرتا ہے؛ دموی رمد کی دلیل آنکھ کا رنگ، رگ کا درور اور کنپٹیوں کی دھڑکن؛ صفراوی کی سخت چبھن، جلانے والا درد، کم سرخی اور پتلا گرم آنسو؛ بلغمی کی سخت بھاری پن اور ہلکی سرخی جس میں سفیدی غالب؛ سوداوی کی کمدگی اور خشکی کے ساتھ بھاری پن؛ اور ریحی کی صرف تَناو — نہ بھاری پن نہ سیلان {cite:canon-ibn-sina-print-v2 p.168} {cite:canon-ibn-sina-print-v2 p.169}"
