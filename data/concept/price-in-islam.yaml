label:
  ar: "الثمن والسعر والتسعير"
  en: "Price, value and price-fixing"
summary:
  ar: "يفرّق المؤلف بين الثمن وهو المتفق عليه في العقد، والقيمة وهي ما قام به الشيء أو متوسط ثمن السوق، ويعرض أسباب الرخص والغلاء عند القاضي عبد الجبار وابن تيمية، ويذكر خلاف الفقهاء في التسعير: فجمهورهم لا يجيزه، وأجازه بعضهم بشروط، وأجازه ابن تيمية في حالات محددة كالاحتكار والمجاعات والتواطؤ {cite:usul-iqtisad-islami-0660 p. 157} {cite:usul-iqtisad-islami-0660 p. 167}."
