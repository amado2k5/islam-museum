summary:
  ar: "الحسك صنفان: البرّي في الخرابات والبستاني أو الندي في المواضع الرطبة؛ وهو بارد يابس عند ديسقوريدوس، ويمنع انصباب المواد ويُنضج، ويُذكر أنه ينفع من القروح العفنة وأورام الحلق والصداع للثة، ويُذكر أنه يفتّت الحصاة في الكلية والمثانة."
  en: "Hasak has two kinds: the wild, in ruins, and the moist, in damp places and by rivers. Dioscorides holds it cold and dry. It prevents matter from settling, ripens and softens, and the book lists uses for putrid ulcers, throat swellings and gum ulcers, and says it breaks up stones in the kidney and bladder."
  ur: "حسک کی دو قسمیں ہیں: جنگلی جو ویرانوں میں اور تر جگہوں اور دریاؤں کے کنارے اگتی ہے۔ دیسقوریدوس اسے ٹھنڈا اور خشک کہتا ہے۔ یہ مادوں کے جمنے کو روکتا، پکاتا اور نرم کرتا ہے، اور کتاب گندے زخموں، حلق کی سوجن اور مسوڑھوں کے زخموں میں اس کے فائدے اور گردے و مثانے کی پتھری توڑنے کا ذکر کرتی ہے۔"
  es: "El hasak tiene dos variedades: el silvestre, que crece en ruinas, y el húmedo, que se encuentra en lugares húmedos y junto a los ríos. Dioscórides lo considera frío y seco. Evita que la materia se asiente, madura y ablanda, y el libro enumera usos para úlceras purulentas, inflamación de garganta y úlceras gingivales, además de afirmar que disuelve cálculos renales y vesicales."
