summary:
  ar: "الأترج شجر حمضي لكل جزء منه خاصية: قشره محلّل، وحمّاضه قابض يكسر الصفراء، ومربّاه ينفع الحلق والرئة، وبزره ينفع من البواسير والسموم {cite:canon-ibn-sina-print-v1 p.367} {cite:canon-ibn-sina-print-v1 p.368}."
  en: "The citron is a sour tree in which each part has its own power: the peel resolves, the juice astringes and breaks bile, its preserve helps throat and lung, and its seed helps piles and poison {cite:canon-ibn-sina-print-v1 p.367} {cite:canon-ibn-sina-print-v1 p.368}."
  ur: "ترنج ایک کھٹا درخت ہے جس کے ہر حصے کی الگ خاصیت ہے: چھلکا تحلیل کرتا ہے، رس قابض ہے اور صفرا توڑتا ہے، مربہ گلے اور پھیپھڑوں کو فائدہ دیتا ہے، اور بیج بواسیر اور زہر میں مفید ہے {cite:canon-ibn-sina-print-v1 p.367} {cite:canon-ibn-sina-print-v1 p.368}۔"
  es: "El cidro es un árbol ácido en el que cada parte tiene su propio poder: la cáscara disuelve, el jugo astringe y rompe la bilis, su conserva ayuda a la garganta y los pulmones, y su semilla ayuda a las hemorroides y al veneno {cite:canon-ibn-sina-print-v1 p.367} {cite:canon-ibn-sina-print-v1 p.368}."
  fr: "Le cédrat est un arbre acide dont chaque partie possède son propre pouvoir: l'écorce résout, le jus astringent et dissout la bile, sa confiture aide la gorge et les poumons, et sa graine aide contre les hémorroïdes et le poison {cite:canon-ibn-sina-print-v1 p.367} {cite:canon-ibn-sina-print-v1 p.368}."
