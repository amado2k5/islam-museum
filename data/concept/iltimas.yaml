label: { ar: "التماس", en: "Iltimas (seeking, as in looking for the moon or water)" }
summary:
  ar: "الالتماس لغة الطلب، واصطلاحا الطلب مع التساوي بين الآمر والمأمور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3314} وقد يكون مطلوبا، كالتماس رؤية هلال رمضان، وهو واجب عند الحنفية ومندوب عند الجمهور، والتماس الماء قبل التيمم، والتماس ليلة القدر، وقد يكون ممنوعا إذا كان الملتمس محرما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3314}"
  en: "Iltimas is seeking, in the lexical sense, and in the technical sense a request between equals. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3314} It may be asked for, as seeking the crescent of Ramadan, which is obligatory for the Hanafis and recommended for most jurists; seeking water before tayammum; and seeking the Night of Power. It is forbidden when the thing sought is forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3314}"
