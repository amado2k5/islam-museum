label: { ar: "التماس", en: "Iltimas (seeking, as in looking for the moon or water)", es: "Iltimas (buscando, como en buscar la luna o el agua)", fr: "Iltimas (chercher, comme chercher la lune ou l'eau)", ur: "الٹیمس ⁦(تلاش کرنا، جیسا کہ چاند یا پانی کی تلاش میں)⁩", tr: "Dilekçe", id: "Petisi" }
summary:
  ar: "الالتماس لغة الطلب، واصطلاحا الطلب مع التساوي بين الآمر والمأمور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3314} وقد يكون مطلوبا، كالتماس رؤية هلال رمضان، وهو واجب عند الحنفية ومندوب عند الجمهور، والتماس الماء قبل التيمم، والتماس ليلة القدر، وقد يكون ممنوعا إذا كان الملتمس محرما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3314}"
  en: "Iltimas is seeking, in the lexical sense, and in the technical sense a request between equals. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3314} It may be asked for, as seeking the crescent of Ramadan, which is obligatory for the Hanafis and recommended for most jurists; seeking water before tayammum; and seeking the Night of Power. It is forbidden when the thing sought is forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3314}"
  es: "Iltimas es una búsqueda, tanto en sentido léxico como técnico, de una petición entre iguales. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3314} Puede solicitarse, como la búsqueda de la luna creciente de Ramadán, que es obligatoria para los hanafíes y recomendada por la mayoría de los juristas; la búsqueda de agua antes del tayammum; y la búsqueda de la Noche del Destino. Está prohibido cuando lo que se busca está prohibido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3314}"
  fr: "L'iltimas désigne, au sens lexical et au sens technique, une demande entre égaux. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3314} On peut formuler une telle demande, par exemple pour obtenir le croissant de Ramadan (obligatoire pour les hanafites et recommandé par la plupart des juristes), pour obtenir de l'eau avant le tayammum, ou pour obtenir la Nuit du Destin. Elle est interdite lorsque ce qui est demandé est interdit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3314}"
  ur: "الٹیمس لغوی معنوں میں، اور تکنیکی معنوں میں مساوی کے درمیان ایک درخواست کی تلاش ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 3314} رمضان کے چاند کی تلاش کے لیے کہا جا سکتا ہے، جو احناف کے لیے واجب ہے اور اکثر فقہاء کے لیے مستحب ہے۔ تیمم سے پہلے پانی طلب کرنا؛ اور شب قدر کی تلاش میں۔ جب مانگی ہوئی چیز حرام ہو تو حرام ہے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 صفحہ 3314}"
  tr: "Aramak, talep dilidir ve teknik olarak emreden ile komutan arasında eşit bir istektir. {kaynak:fiqh-mawsua-kuwaitiyya-noor-v3 s.3314} Hanafilere göre zorunlu olan ve çoğunluk tarafından önerilen Ramazan hilalini görmeye çalışmak, teyammumdan önce su aramak ve Leylat al-Kadr'ı aramak gibi gerekebilir; talep eden ihramdaysa bu yasak olabilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3314}"
  id: "Mencari adalah bahasa permintaan, dan secara teknis adalah permintaan yang setara antara yang memerintah dan komandan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3314} Mungkin diperlukan, seperti ingin melihat bulan sabit Ramadan, yang wajib menurut Hanafi dan direkomendasikan oleh mayoritas, mencari air sebelum tayammum, dan mencari Laylat al-Qadr, dan mungkin dilarang jika pemohon berada di ihram. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3314}"
