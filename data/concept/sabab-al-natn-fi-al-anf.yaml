id: concept/sabab-al-natn-fi-al-anf
class: concept
kind: scientific
label:
  ar: سبب النتن في الأنف
  en: The cause of the stench in the nose
  ur: ناک میں بدبو کا سبب
  es: "La causa del mal olor en la nariz"
  fr: "La cause de la mauvaise odeur dans le nez"
  tr: "Burun kokusunun nedeni"
  id: "Penyebab bau hidung"
summary:
  ar: النتن في الأنف إما بخارات عفنة تتصعد إليه من نواحي الصدر والرئة والمعدة لأحدث قروحاً لكنه عفن منتن الريح ربما تأدى ريحه إلى ما فوق فأحس بمشمه، أو خلط متعفن في البطن أو في الدماغ كله أو في مقدمه أو فيما يلي الأنف منه، أو عفونة وفساد يعرض لتلك العظام أنفسها ويصعب علاجه، أو لبواسير في الأنف متعفنة {cite:canon-ibn-sina-print-v2 p.245}
  en: The stench in the nose is either putrid vapours rising to it from the region of the chest, lung and stomach having caused ulcers — a foul-smelling putrefaction whose smell may reach above and be sensed; or a putrid humour in the belly, in the whole brain, in its front, or in the part near the nose; or a putrefaction and corruption befalling those very bones, whose treatment is hard; or putrid piles in the nose {cite:canon-ibn-sina-print-v2 p.245}
  ur: ناک میں بدبو یا تو سینے، پھیپھڑوں اور معدے کی طرف سے اٹھنے والے سڑے بخاروں سے ہے جنہوں نے چھالے پیدا کیے — بدبو دار سڑان جس کی بو اوپر پہنچ کر محسوس ہو سکتی ہے؛ یا پیٹ، پورے دماغ، اس کے اگلے حصے یا ناک کے قریب والے حصے میں سڑا ہوا خلط؛ یا ان ہڈیوں میں خود سڑان اور فساد جس کا علاج مشکل ہے؛ یا ناک میں سڑی ہوئی بواسیر {cite:canon-ibn-sina-print-v2 p.245}
  es: "El hedor en la nariz se debe a vapores pútridos que ascienden desde la región del pecho, los pulmones y el estómago, causando úlceras (una putrefacción maloliente cuyo olor puede percibirse); o a un humor pútrido en el vientre, en todo el cerebro, en su parte anterior o en la zona cercana a la nariz; o a una putrefacción y corrupción que afecta a los huesos, cuyo tratamiento es difícil; o a hemorroides pútridas en la nariz. {cite:canon-ibn-sina-print-v2 p.245}"
  fr: "La puanteur dans le nez provient soit de vapeurs putrides remontant de la région de la poitrine, des poumons et de l'estomac, ayant causé des ulcères — une putréfaction nauséabonde dont l'odeur peut être perçue au-dessus; soit d'une humeur putride dans le ventre, dans tout le cerveau, dans sa partie antérieure ou dans la partie proche du nez; soit d'une putréfaction et d'une corruption affectant ces os mêmes, dont le traitement est difficile; soit d'hémorroïdes putrides dans le nez {cite:canon-ibn-sina-print-v2 p.245}"
  tr: "Çürümüş burun, göğüs, akciğerler ve mideden yükselen kötü buharlar olup yaralar oluşturur, ancak kokusunun yukarı doğru yükselmesine neden olabilecek rüzgar kokusudur, ya da karında, tüm beyinde, ön tarafında veya burnun altında çürümüş bir karışımdır; bu kemikleri etkileyen ve tedavisi zor olan çürümüş ve çürük bir daralma, ya da burundaki çürümüş hemoroidler {cite:canon-ibn-sina-print-v2 s.245}"
  id: "Hidung busuk adalah uap busuk yang naik dari dada, paru-paru, dan perut untuk menyebabkan luka, tetapi bau angin yang dapat menyebabkan baunya naik ke atas, atau campuran busuk di perut, seluruh otak, bagian depan, atau di bawah hidung, atau stenosis busuk dan busuk yang memengaruhi tulang-tulang itu sendiri dan sulit diobati, atau wasir busuk di hidung {cite:canon-ibn-sina-print-v2 hlm.245}"
