summary:
  ar: "ثعلب في الكتاب حيوان فيه تحليل وفراؤه أسخن الفراء ينتفع بها المرطوبون لتحليلها؛ وينقل الكتاب أن طبخه في الماء أو في الزيت وطلاء المفاصل الوجعة به ينفع، وأن شحمه يسكن وجع الأذن، وأن رئته المجففة نافعة لصاحب الربو، وكل ما ورد هنا نقل منسوب إلى الكتاب لا توصية {cite:canon-ibn-sina-print-v1 p.698}"
  en: "Tha'lab is in the book an animal with a dissolving power, its fur the hottest of furs and of use to the moist for its dissolving; the book reports that cooking it in water or in oil and applying this to painful joints benefits, that its fat calms earache, and that its dried lung is of benefit to the asthmatic; everything given here is a report attributed to the book, not a recommendation {cite:canon-ibn-sina-print-v1 p.698}"
  ur: "ثعلب کتاب میں ایک جانور ہے جس میں تحلیل کی قوت ہے اور اس کی کھال سب کھالوں سے گرم ہے اور تر مزاج لوگ اس کی تحلیل کی وجہ سے اس سے نفع اٹھاتے ہیں؛ کتاب نقل کرتی ہے کہ اسے پانی یا تیل میں پکا کر دردناک جوڑوں پر لگانا نفع دیتا ہے، اس کی چربی کان کے درد کو تسکین دیتی ہے، اور اس کا خشک پھیپھڑا دمے کے مریض کے لیے نافع ہے؛ یہاں جو کچھ آیا وہ کتاب سے منسوب نقل ہے، سفارش نہیں {cite:canon-ibn-sina-print-v1 p.698}۔"
  es: "En el libro, Tha'lab es un animal con poder disolvente, su pelaje es el más caliente de todos y resulta útil para los húmedos por su capacidad de disolución; el libro informa que cocinarlo en agua o aceite y aplicarlo sobre las articulaciones doloridas es beneficioso, que su grasa calma el dolor de oído y que su pulmón seco es beneficioso para los asmáticos; todo lo que se menciona aquí es un informe atribuido al libro, no una recomendación {cite:canon-ibn-sina-print-v1 p.698}"
  fr: "Le tha'lab est décrit dans le livre comme un animal aux propriétés dissolvantes, dont la fourrure est la plus chaude qui soit et utile aux personnes humides pour ses vertus dissolvantes. Le livre rapporte que le cuire dans l'eau ou l'huile et appliquer cette préparation sur les articulations douloureuses est bénéfique, que sa graisse apaise les maux d'oreilles et que son poumon desséché est utile aux asthmatiques. Tout ceci est un compte rendu attribué au livre, et non une recommandation. {cite:canon-ibn-sina-print-v1 p.698}"
