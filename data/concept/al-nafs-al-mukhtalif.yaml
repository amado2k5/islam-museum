id: concept/al-nafs-al-mukhtalif
class: concept
kind: scientific
label:
  ar: "النفس المختلف والمتضاعف والمنتصف"
  en: "The uneven breath, the doubled and the halved"
  fr: "La respiration inégale, la redoublée et la demi-respiration"
  ur: "متفاوت دہری اور آدھی سانس"
  es: "La respiración desigual, la duplicada y la reducida a la mitad"
  tr: "Farklı, çoğalmış ve orta ruh"
  id: "Roh berbeda, berganda, dan tengah"
summary:
  ar: "النفس يختلف مثل أسباب اختلاف النبض ويكون اختلافه منتظماً وغير منتظم، والمتضاعف من أصناف المختلف وهو النفس الذي يتم بالانبساط فيه الفحم أو الانقباض وهو التغير بحركتين بينهما وقفة كنفس الصبي إذا بكى فيكون فيه فحم إذا انبسط وتغير إذا انقبض وسببه إما حرارة كثيرة فلا ينتفع بما استنشق بل يوجب ابتداء حد في الزيادة وإما ضعف في آلات النفس المعلومة يحوج إلى استراحة في النفس وإما لسوء مزاج مسقط للقوة أو مجفف أو مصلب للآلة وهو الأكثر وإما لوجع فيها أو في مجاوراتها أو ورم والمجاورات مثل الحجاب والكبد والطحال والكبد أشد مشاركة من الطحال وإما لمرض آلي مما قد عد مراراً أو كثرة تشنج كائن أو يكون وهذا النفس علامة رديئة في الأمراض الحادة والحميات الحادة وأما إذا عرض من برد فإنه مما تشفيه الحمى، والمنتصف أن تكون الآفة في نصف الرئة والنصف الآخر سالماً فيكون النفس نصف نفس سالم {cite:canon-ibn-sina-print-v2 p.313}"
  en: "The breath grows uneven on the same causes as the pulse's unevenness, and its unevenness may be regular or irregular. The doubled is a kind of the uneven: the breath completed with a gasp in the expansion or the contraction — the change by two motions with a rest between, like the boy's breath when he cries, gasping as it opens and catching as it closes. Its cause is either a great heat, so the inhaled does not profit but only starts a limit in the increase; or a weakness in the known breathing tools, needing a rest within the breath; or a bad temperament felling the power, or drying or hardening the instrument — the commonest; or a pain in them or their neighbours or a tumour — the neighbours being like the diaphragm, the liver and the spleen, the liver sharing harder than the spleen; or an instrumental disease of those counted many times, or a frequent existing convulsion. This breath is a bad sign in the acute diseases and the acute fevers, yet if it comes of cold, the fever heals it. The halved breath: the harm is in one half of the lung and the other half sound, so the breath is half a sound breath {cite:canon-ibn-sina-print-v2 p.313}"
  fr: "La respiration devient inégale pour les mêmes causes que l'inégalité du pouls, et son inégalité peut être régulière ou irrégulière. La redoublée est une espèce de l'inégale : la respiration achevée par un hoquet dans la dilatation ou la contraction, le changement par deux mouvements séparés d'un repos, comme la respiration de l'enfant qui pleure, haletant à l'ouverture et se reprenant à la fermeture. Sa cause est soit une grande chaleur, de sorte que l'air inspiré ne profite pas mais amorce seulement une limite dans l'accroissement ; soit une faiblesse dans les instruments connus de la respiration, qui ont besoin d'un repos au sein de la respiration ; soit un mauvais tempérament qui abat la force, ou dessèche ou durcit l'instrument, le plus fréquent ; soit une douleur en eux ou chez leurs voisins, ou une tuméfaction, les voisins étant comme le diaphragme, le foie et la rate, la participation du foie étant plus dure que celle de la rate ; soit une maladie instrumentale de celles maintes fois énumérées, ou une convulsion fréquente existante. Cette respiration est un mauvais signe dans les maladies aiguës et les fièvres aiguës ; pourtant, si elle vient du froid, la fièvre la guérit. La demi-respiration : le mal est dans une moitié du poumon et l'autre moitié est saine, de sorte que la respiration est la moitié d'une respiration saine {cite:canon-ibn-sina-print-v2 p.313}"
  ur: "سانس متفاوت ہوتی ہے نبض کے متفاوت ہونے کے اسباب جیسے اور اس کا تفاوت منتظم بھی ہو سکتا ہے اور غیر منتظم بھی؛ دہری متفاوت کی ایک قسم ہے: وہ سانس جو پھیلاؤ یا سمٹاؤ میں ہانپ کے ساتھ ہوتی ہے یعنی دو حرکتوں کے ساتھ بدلنا جن کے درمیان وقفہ ہو جیسے روتے لڑکے کی سانس جس میں پھیلتے وقت ہانپ اور سمٹتے وقت اٹک آتی ہے؛ اس کا سبب یا بہت گرمی ہے کہ داخل شدہ ہوا نفع نہ دے بلکہ اضافے میں حد کھڑی کرے یا معلوم تنفس کے اوزاروں میں کمزوری جو سانس میں وقفے کا محتاج ہو یا ایسا بد مزاج جو قوت گرائے یا اوزار خشک یا سخت کرے — اور یہی زیادہ تر ہے — یا انہیں یا ان کے ہمسایوں میں درد یا سوجن اور ہمسائے جیسے حجاب جگر اور طحال ہیں اور جگر طحال سے زیادہ شریک ہے؛ یا ان آلی بیماریوں میں سے کوئی جو بار بار گنی گئیں یا کثیر موجود تشنج؛ اور یہ سانس شدید بیماریوں اور شدید بخاروں میں بری علامت ہے مگر اگر ٹھنڈ سے ہو تو بخار اسے شفا دیتا ہے؛ آدھی سانس وہ ہے کہ آفت پھیپھڑے کے آدھے میں ہو اور دوسرا آدھا سالم تو سانس آدھی سالم سانس ہوتی ہے {cite:canon-ibn-sina-print-v2 p.313}"
  es: "La respiración se vuelve irregular por las mismas causas que la irregularidad del pulso, y su irregularidad puede ser regular o irregular. La respiración doble es un tipo de irregularidad: la respiración se completa con un jadeo en la expansión o la contracción, el cambio por dos movimientos con un descanso entre ellos, como la respiración del niño cuando llora, jadeando al abrirse y conteniendo al cerrarse. Su causa es o bien un gran calor, por lo que la inhalación no se beneficia sino que solo comienza un límite en el aumento; o una debilidad en los instrumentos respiratorios conocidos, que necesita un descanso dentro de la respiración; o un mal temperamento que disminuye la potencia, o seca o endurece el instrumento —la más común—; o un dolor en ellos o en sus vecinos o un tumor —los vecinos son como el diafragma, el hígado y el bazo, siendo el hígado más propenso a sufrir que el bazo—; o una enfermedad instrumental de las que se cuentan muchas veces, o una convulsión frecuente. Esta respiración es un mal presagio en las enfermedades agudas y las fiebres agudas, pero si se debe a un resfriado, la fiebre la cura. La respiración dividida: el daño se encuentra en una mitad del pulmón y la otra mitad es sana, por lo que la respiración es media respiración sana {cite:canon-ibn-sina-print-v2 p.313}"
  tr: "Nefes, farklı nabızların nedenleri gibi farklıdır ve farkı düzenli ya da düzensiz olabilir. Çift fark türü, kömüre veya kasılmaya kadar uzanan nefes, yani aralarındaki iki hareketin değişmesidir; örneğin bir çocuğun ağladığında nefesi kömürdür ve kasıldığında değişir. Neden ya aşırı ısıdır, bu yüzden soluduğu şeyden faydalanmaz, ya da ruhun bilinen organlarına ek olarak bir sınır gerektirir, ya da ruhun dinlenmesini gerektiren bilinen nefes mekanizmalarındaki zayıflık ya da kötü bir ruh hali nedeniyle güç kaybı, kuru veya sertleşme nedeniyle. Organ daha yaygındır; ya içindeki ağrı ya da çevresindeki ağrı ya da tümörler nedeniyle. Diyafram, karaciğer, dalak ve karaciğer gibi komşu bölgeler dalağa göre daha fazla etkilenir, ya da tekrarlayan bir mekanik hastalık nedeniyle, ya da bir organizmanın sık spazmları nedeniyle bu nefes akut hastalıklar ve akut ateşlerde kötü bir işarettir. Soğuk algınlığı ortaya çıkarsa, bu ateşten kaynaklanır. Orta kısım, lezyonun akciğerin bir yarısında olduğu ve diğer yarısı sağlam olduğu zamandır; böylece nefes yarı sağlıklıdır {cite:canon-ibn-sina-print-v2 s.313}"
  id: "Pernapasan berbeda, seperti penyebab denyut nadi yang berbeda, dan perbedaannya bisa teratur atau tidak teratur. Perbedaan ganda adalah pernapasan, yang meluas ke arang atau kontraksi, artinya kedua gerakan di antara mereka berubah; misalnya, ketika anak menangis, napasnya menjadi bara dan berubah saat mereka berkontraksi. Alasannya adalah panas yang berlebihan, sehingga mereka tidak mendapat manfaat dari apa yang mereka hirup, atau membutuhkan batas selain organ jiwa yang diketahui, atau karena kelemahan mekanisme pernapasan yang diketahui yang mengharuskan jiwa beristirahat, atau karena hilangnya kekuatan, kekeringan, atau kekerasan akibat suasana hati yang buruk. Organ ini lebih umum; baik karena rasa sakit di dalam atau di sekitarnya, atau karena tumor. Area tetangga seperti diafragma, hati, limpa, dan hati lebih terpengaruh daripada limpa, atau karena penyakit mekanis yang berulang, atau kejang yang sering pada suatu organisme, pernapasan ini merupakan tanda buruk pada penyakit akut dan demam akut. Jika flu terjadi, itu disebabkan oleh demam. Bagian tengah adalah ketika lesi berada di satu bagian paru-paru dan setengah lainnya utuh; jadi, pernapasan setengah sehat {cite:canon-ibn-sina-print-v2 hlm.313}"
