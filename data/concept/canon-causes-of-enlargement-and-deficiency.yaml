id: concept/canon-causes-of-enlargement-and-deficiency
class: concept
kind: scientific
label:
  ar: "أسباب زيادة العظم والغدد والنقصان عند ابن سينا"
  en: "The causes of enlargement of bones and glands and of deficiency in the Canon"
  fr: "Causes d’augmentation et de diminution dans le Canon"
  ur: "ہڈی اور غدود کے بڑھنے اور کمی کے اسباب، قانون کے مطابق"
  es: "Las causas del agrandamiento de huesos y glándulas y de deficiencia en el Canon"
  tr: "İbn Sina'ya göre kemik artışı, bezler ve eksiklik nedenleri"
  id: "Penyebab Peningkatan Tulang, Kelenjar, dan Kekurangan menurut Ibn Sina"
summary:
  ar: "في الفصلين الرابع عشر والخامس عشر يبين ابن سينا أن زيادة العظم والغدد سببها كثرة المادة وشدة القوى الجاذبة بمعونة الدلك والتسخين بالأضمدة، وأن النقصان إما في أصل الخلقة لنقصان المادة أو لخطأ القوة المغيرة وضعفها، وإما آفات من خارج أو من داخل {cite:canon-ibn-sina-print-v1 p.146}."
  en: "In chapters 14 and 15 Ibn Sina explains that enlargement of bone and glands comes from abundance of matter and strength of the attracting powers aided by rubbing and warming plasters, and that deficiency arises in original creation, through too little matter or an erring or weak transforming power, or from afflictions from outside or inside {cite:canon-ibn-sina-print-v1 p.146}."
  fr: "Aux chapitres 14 et 15, Ibn Sina attribue l’augmentation des os et glandes à la matière abondante et aux facultés attractives fortes aidées par friction et emplâtres chauffants ; la diminution, à la formation initiale par manque de matière ou faculté transformatrice erronée ou faible, ou à des atteintes externes ou internes {cite:canon-ibn-sina-print-v1 p.146}."
  es: "En los capítulos 14 y 15, Ibn Sina explica que el agrandamiento de los huesos y las glándulas proviene de la abundancia de materia y la fuerza de los poderes de atracción ayudados por emplastos de frotamiento y calentamiento, y que la deficiencia surge en la creación original, por muy poca materia o un poder transformador erróneo o débil, o por aflicciones externas o internas {cite:canon-ibn-sina-print-v1 p.146}."
  ur: "ابواب 14 اور 15 میں ابن سینا وضاحت کرتا ہے کہ ہڈیوں اور غدود کی افزائش مادے کی کثرت سے ہوتی ہے اور پلستر کو رگڑنے اور گرم کرنے کی مدد سے اپنی طرف متوجہ کرنے والی طاقتوں کی طاقت ہوتی ہے، اور یہ کمی اصل تخلیق میں بہت کم مادے یا غلطی یا کمزور تبدیلی کی طاقت سے پیدا ہوتی ہے، یا باہر کی پریشانیوں سے پیدا ہوتی ہے۔ صفحہ 146}۔"
  tr: "On dördüncü ve on beşinci bölümlerde İbn Sina, kemik ve bezlerdeki artışın madde bolluğu ve bandajlarla sürtünme ve ısıtma yardımıyla çekilen kuvvetlerin yoğunluğundan kaynaklandığını, eksikliğin ise ya madde eksikliğinden kaynaklanan yaratılışın kaynağından ya da dönüştürücü gücün hata ve zayıflığından ya da dışarıdan ya da içeriden gelen sıkıntılardan kaynaklandığını açıklar {cite:canon-ibn-sina-print-v1 s.146}."
  id: "Dalam bab empat belas dan lima belas, Ibn Sina menjelaskan bahwa peningkatan tulang dan kelenjar disebabkan oleh kelimpahan materi dan intensitas gaya tarik dengan bantuan menggosok dan memanaskan dengan perban, dan kekurangan tersebut mungkin berasal dari asal ciptaan akibat kekurangan materi atau karena kesalahan dan kelemahan gaya transformasi, atau gangguan dari luar atau dari dalam {cite:canon-ibn-sina-print-v1 hlm.146}."
