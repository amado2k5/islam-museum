label: { ar: "أسباب زيادة العظم والغدد والنقصان عند ابن سينا", en: "The causes of enlargement of bones and glands and of deficiency in the Canon", ur: "ہڈی اور غدود کے بڑھنے اور کمی کے اسباب، قانون کے مطابق" }
summary:
  ar: "في الفصلين الرابع عشر والخامس عشر يبين ابن سينا أن زيادة العظم والغدد سببها كثرة المادة وشدة القوى الجاذبة بمعونة الدلك والتسخين بالأضمدة، وأن النقصان إما في أصل الخلقة لنقصان المادة أو لخطأ القوة المغيرة وضعفها، وإما آفات من خارج أو من داخل {cite:canon-ibn-sina-print-v1 p.146}."
  en: "In chapters 14 and 15 Ibn Sina explains that enlargement of bone and glands comes from abundance of matter and strength of the attracting powers aided by rubbing and warming plasters, and that deficiency arises in original creation, through too little matter or an erring or weak transforming power, or from afflictions from outside or inside {cite:canon-ibn-sina-print-v1 p.146}."
