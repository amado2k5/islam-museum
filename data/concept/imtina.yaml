label: { ar: "الامتناع", en: "Imtina' (abstaining from an act)" }
summary:
  ar: "الامتناع لغة الكف عن الشيء، أو التقوي بالقوم والعز، وهو في الاصطلاح لا يخرج عن هذين المعنيين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3379} وامتناع الإنسان عن الفعل المحرم واجب، وعن الواجب حرام، وعن المندوب مكروه، وعن المكروه مندوب، وعن المباح مباح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3379}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3380}"
  en: "Imtina' in the lexical sense is refraining from a thing, or being strong and protected by one's people; the technical sense keeps these two. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3379} Refraining from what is forbidden is obligatory; refraining from what is obligatory is forbidden; refraining from what is recommended is disliked; refraining from what is disliked is recommended; refraining from what is lawful is lawful. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3379}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3380}"
