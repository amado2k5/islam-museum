id: concept/imtina
class: concept
kind: ethical
label: { ar: "الامتناع", en: "Imtina' (abstaining from an act)", es: "Imtina' (abstenerse de un acto)", fr: "Imtina' (s'abstenir d'un acte)", ur: "امتنا ⁦(کسی عمل سے پرہیز کرنا)⁩", tr: "çekimser kalma", id: "abstain" }
summary:
  ar: "الامتناع لغة الكف عن الشيء، أو التقوي بالقوم والعز، وهو في الاصطلاح لا يخرج عن هذين المعنيين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3379} وامتناع الإنسان عن الفعل المحرم واجب، وعن الواجب حرام، وعن المندوب مكروه، وعن المكروه مندوب، وعن المباح مباح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3379}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3380}"
  en: "Imtina' in the lexical sense is refraining from a thing, or being strong and protected by one's people; the technical sense keeps these two. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3379} Refraining from what is forbidden is obligatory; refraining from what is obligatory is forbidden; refraining from what is recommended is disliked; refraining from what is disliked is recommended; refraining from what is lawful is lawful. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3379}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3380}"
  es: "Imtina' en el sentido léxico significa abstenerse de algo, o ser fuerte y estar protegido por el propio pueblo; el sentido técnico conserva estos dos significados. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3379} Abstenerse de lo prohibido es obligatorio; abstenerse de lo obligatorio es prohibido; abstenerse de lo recomendado es desaconsejable; abstenerse de lo desaconsejable es recomendable; abstenerse de lo lícito es lícito. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3379}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3380}"
  fr: "Le terme « imtina » au sens littéral signifie s'abstenir de quelque chose, ou être fort et protégé par son peuple; le sens technique conserve ces deux significations. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3379} S'abstenir de ce qui est interdit est obligatoire; s'abstenir de ce qui est obligatoire est interdit; s'abstenir de ce qui est recommandé est déconseillé; s'abstenir de ce qui est déconseillé est recommandé; s'abstenir de ce qui est licite est licite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3379}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3380}"
  ur: "امتینا لغوی معنوں میں کسی چیز سے پرہیز کرنا، یا اپنے لوگوں کا مضبوط اور محفوظ ہونا ہے۔ تکنیکی احساس ان دونوں کو رکھتا ہے۔ {حوالہ: فقہ الموسوعۃ النور v3 ص3379} حرام چیزوں سے پرہیز واجب ہے۔ واجب سے اجتناب حرام ہے؛ مستحب باتوں سے پرہیز کرنا ناپسندیدہ ہے۔ ناپسندیدہ چیزوں سے پرہیز کرنا مستحب ہے۔ حلال سے پرہیز کرنا جائز ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3379}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3380}"
  tr: "Dilsel olarak çekimser olmak, bir şeyden kaçınmak ya da insanlar ve onur yoluyla dindarlık demektir ve terminolojide bu iki anlamdan sapmaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3379} Bir kişinin yasak bir eylemden reddetmesi zorunludur, zorunlu olan yasaktır; önerilen sevilmezdir; sevilmeyen tavsiye edilir; ve izin verilen kabul edilebilirdir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3379} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3380}"
  id: "Menahan diri secara linguistik berarti menahan diri dari sesuatu, atau kesalehan melalui orang dan kehormatan, dan dalam terminologi, tidak menyimpang dari kedua makna tersebut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3379} Penolakan seseorang terhadap tindakan terlarang adalah wajib, dan apa yang wajib dilarang; apa yang direkomendasikan tidak disukai; apa yang tidak disukai disarankan; dan apa yang diperbolehkan diperbolehkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3379} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3380}"
