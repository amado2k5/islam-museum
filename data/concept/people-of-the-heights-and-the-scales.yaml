id: concept/people-of-the-heights-and-the-scales
class: concept
kind: belief
label: { ar: "الميزان وأصحاب الأعراف", en: "The scales of deeds and the people of the heights", ur: "میزان اور اعراف والے" }
summary:
  ar: "يعرض الشعراوي الحساب بالميزان كما ورد في القرآن، ويرى أن الذين ثقلت موازينهم يفوزون والذين خفت موازينهم يخسرون، وأن أصحاب الأعراف هم الذين تساوت حسناتهم وسيئاتهم، وأن مغفرة الله تسبق غضبه فيهم {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1233}."
  en: "Sha'rawi presents accounting by the scales as the Qur'an describes it. Those whose scales are heavy succeed and those whose scales are light lose. The people of the heights are those whose good and bad deeds are equal, and God's forgiveness comes before His wrath for them {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1233}."
  ur: "شعراوی قرآن کے بیان کے مطابق میزان سے حساب پیش کرتے ہیں۔ جن کے پلڑے بھاری ہوں وہ کامیاب ہیں، اور جن کے پلڑے ہلکے ہوں وہ نقصان میں ہیں۔ اعراف والے وہ ہیں جن کی نیکیاں اور برائیاں برابر ہوں، اور ان کے لیے اللہ کی مغفرت اس کے غضب سے پہلے ہوتی ہے {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1233}۔"
