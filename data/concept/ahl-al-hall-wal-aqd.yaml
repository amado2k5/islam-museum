id: concept/ahl-al-hall-wal-aqd
class: concept
kind: term
label: { ar: "أهل الحل والعقد", en: "Ahl al-Hall wa al-Aqd (those who loose and bind: the men of power whose choice confirms the imam)", fr: "Ahl al-Hall wa al-Aqd (ceux qui délient et lient : les hommes d’influence dont le choix confirme l’imam)", es: "Ahl al-Hall wa al-Aqd (los que desatan y atan: los hombres de poder cuya elección confirma al imán)", ur: "اہل الحل والعقد ⁦(جو ڈھیل دیتے ہیں اور باندھتے ہیں: وہ طاقت والے جن کا انتخاب امام کی تصدیق کرتا ہے)⁩" }
summary:
  ar: "يطلق لفظ أهل الحل والعقد على أهل الشوكة من العلماء والرؤساء ووجوه الناس الذين يحصل بهم مقصود الولاية، وهو مأخوذ من حل الأمور وعقدها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3611} ويختلفون عن أهل الشورى، إذ الصفة البارزة في أهل الشورى العلم، والصفة البارزة في أهل الحل والعقد الشوكة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3611}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3612} ويشترط فيهم العدالة والعلم والرأي والحكمة وأن يكونوا ذوي شوكة يتبعهم الناس، والإخلاص للمسلمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3612} ويباشر الاختيار منهم فئة تسمى أهل الاختيار، تعينها الخليفة أو يتيسر حضورها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3612} ومن أعمالهم تولية الإمام باتفاق، وتجديد البيعة لمن عُهد إليه إذا لم يكن مستجمعا للشروط وقت العهد، واستقدام المعهود إليه الغائب، وعزل الإمام عند ما يقتضيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3613} واختلف في عددهم الذي تنعقد به الإمامة، فالحنابلة يشترطون أكثرهم في كل بلد، وقيل خمسة، والحنفية والشافعية بلا عدد معين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3613}"
  en: "Ahl al-hall wa al-'aqd are the men of power among scholars and notables through whom the purpose of authority is achieved; the term comes from loosing and binding affairs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3611} They differ from the ahl al-shura, since the mark of the latter is learning while the mark of the former is power. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3611}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3612} They must be just, learned, judicious and wise, have a following among the people, and be sincere toward the Muslims. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3612} The choice is made by a group known as ahl al-ikhtiyar, appointed by the caliph or those present. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3612} Their work includes choosing the imam, by agreement; renewing the allegiance to a designated successor who was not qualified when he was designated; summoning an absent designee; and dismissing the imam when the cause arises. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3613} The number needed to form the imamate is disputed: the Hanbalis require most of them in every town, others say five, and the Hanafis and Shafi'is set no number. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3613}"
  fr: "Les ahl al-hall wa al-‘aqd sont les hommes d’influence, parmi les savants et les notables, par lesquels l’autorité remplit sa fonction. Leur nom vient de l’idée de délier et de lier les affaires. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3611} Ils se distinguent des ahl al-shura : les seconds se caractérisent par leur savoir et les premiers par leur pouvoir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3611}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3612} Ils doivent être justes, savants, avisés et sages, avoir des partisans dans la population et agir avec sincérité envers les musulmans. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3612} Le choix revient à un groupe appelé ahl al-ikhtiyar, désigné par le calife ou constitué par les personnes présentes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3612} Leur rôle consiste notamment à choisir l’imam, ce qui fait consensus, à renouveler l’allégeance à un successeur qui ne remplissait pas les conditions lors de sa désignation, à convoquer un successeur désigné qui est absent et à destituer l’imam lorsqu’un motif se présente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3613} Le nombre nécessaire pour instituer l’imamat est discuté : les hanbalites exigent la majorité d’entre eux dans chaque ville, d’autres en demandent cinq, tandis que les hanafites et les chaféites ne fixent aucun nombre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3613}"
  es: "Ahl al-hall wa al-'aqd son los hombres de poder entre los eruditos y notables a través de quienes se logra el propósito de la autoridad; el término proviene de aflojar y atar asuntos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3611} Se diferencian de los ahl al-shura, ya que la marca de estos últimos es el conocimiento mientras que la marca de los primeros es el poder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3611}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3612} Deben ser justos, instruidos, juiciosos y sabios, tener seguidores entre la gente y ser sinceros con los musulmanes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3612} La elección la realiza un grupo conocido como ahl al-ikhtiyar, designado por el califa o los presentes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3612} Su labor incluye elegir al imán, por acuerdo; renovar la lealtad a un sucesor designado que no estaba cualificado en el momento de su designación; convocar a un designado ausente; y destituir al imán cuando surja la causa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3613} El número necesario para formar el imamato es objeto de controversia: los hanbalíes requieren la mayoría en cada ciudad, otros dicen cinco, y los hanafíes y shafiíes no fijan ningún número. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3613}"
  ur: "اہل الحل والعقد علماء اور معززین میں سے طاقت ور افراد ہیں جن کے ذریعے اختیار کا مقصد حاصل کیا جاتا ہے۔ اصطلاح کھونے اور پابند امور سے آتی ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 3611} وہ اہل شوریٰ سے مختلف ہیں، کیونکہ بعد والے کا نشان علم ہے جبکہ پہلے کا نشان طاقت ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3611}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3612} انہیں چاہیے کہ وہ عادل، عالم، مدبر اور عقلمند، لوگوں میں پیروکار ہوں، اور مسلمانوں کے ساتھ مخلص ہوں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3612} انتخاب اہل الاختیار کے نام سے جانے والے ایک گروہ کی طرف سے کیا جاتا ہے، جسے خلیفہ یا حاضرین مقرر کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3612} ان کے کام میں امام کا انتخاب، اتفاق سے کرنا شامل ہے۔ ایک نامزد جانشین کے ساتھ وفاداری کی تجدید کرنا جو نامزد ہونے کے وقت اہل نہیں تھا؛ غیر حاضر نامزد شخص کو طلب کرنا؛ اور سبب پیدا ہونے پر امام کو رد کرنا۔ {حوالہ: فقہ الموسوعۃ-کویتیہ-نور-v3 صفحہ 3613} امامت کے لیے جو تعداد درکار ہے اس میں اختلاف ہے: حنبلی ہر شہر میں ان میں سے زیادہ تر مطلوب ہیں، دوسرے کہتے ہیں کہ پانچ، اور حنفیہ اور شافعی نے کوئی تعداد مقرر نہیں کی۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 3613}"
