id: concept/ahl-al-hall-wal-aqd
class: concept
kind: term
label: { ar: "أهل الحل والعقد", en: "Ahl al-Hall wa al-Aqd (those who loose and bind: the men of power whose choice confirms the imam)" }
summary:
  ar: "يطلق لفظ أهل الحل والعقد على أهل الشوكة من العلماء والرؤساء ووجوه الناس الذين يحصل بهم مقصود الولاية، وهو مأخوذ من حل الأمور وعقدها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3611} ويختلفون عن أهل الشورى، إذ الصفة البارزة في أهل الشورى العلم، والصفة البارزة في أهل الحل والعقد الشوكة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3611}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3612} ويشترط فيهم العدالة والعلم والرأي والحكمة وأن يكونوا ذوي شوكة يتبعهم الناس، والإخلاص للمسلمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3612} ويباشر الاختيار منهم فئة تسمى أهل الاختيار، تعينها الخليفة أو يتيسر حضورها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3612} ومن أعمالهم تولية الإمام باتفاق، وتجديد البيعة لمن عُهد إليه إذا لم يكن مستجمعا للشروط وقت العهد، واستقدام المعهود إليه الغائب، وعزل الإمام عند ما يقتضيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3613} واختلف في عددهم الذي تنعقد به الإمامة، فالحنابلة يشترطون أكثرهم في كل بلد، وقيل خمسة، والحنفية والشافعية بلا عدد معين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3613}"
  en: "Ahl al-hall wa al-'aqd are the men of power among scholars and notables through whom the purpose of authority is achieved; the term comes from loosing and binding affairs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3611} They differ from the ahl al-shura, since the mark of the latter is learning while the mark of the former is power. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3611}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3612} They must be just, learned, judicious and wise, have a following among the people, and be sincere toward the Muslims. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3612} The choice is made by a group known as ahl al-ikhtiyar, appointed by the caliph or those present. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3612} Their work includes choosing the imam, by agreement; renewing the allegiance to a designated successor who was not qualified when he was designated; summoning an absent designee; and dismissing the imam when the cause arises. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3613} The number needed to form the imamate is disputed: the Hanbalis require most of them in every town, others say five, and the Hanafis and Shafi'is set no number. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3613}"
