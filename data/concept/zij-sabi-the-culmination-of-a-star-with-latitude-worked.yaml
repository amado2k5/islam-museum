label: { ar: "حساب بعد الكوكب ذي العرض واختلاف مجازه في وسط السماء في الزيج الصابي", en: "The working of the distance and culmination difference of a star with latitude", ur: "عرض والے ستارے کے بعد اور وسط السماء میں اس کے مجاز کے اختلاف کا حساب" }
summary:
  ar: "يضع البتاني خطوات: عرض الكوكب وميل جزئه يُجمعان إن اتحدت جهتاهما أو يُنقص الأقل من الأكثر، فيكون العرض المعدل، ثم يُحسب بعد الكوكب عن معدل النهار بالأوتار، ثم يؤخذ بعد درجته عن رأس السرطان أو الجدي، ويُحسب اختلاف مجازه في وسط السماء بالأوتار فيُضاف إلى مطالع الفلك المستقيم أو يُنقص منها بحسب جهة العرض وموضع الكوكب من البروج، فتعرف الدرجة التي تتوسط السماء معه. {cite:zij-sabi-nallino-byblion pp.51-52}."
  en: "Al-Battani lays down the steps: the star's latitude and its degree's declination are added if their sides agree, or the smaller is subtracted from the larger, giving the corrected latitude; the star's distance from the equator is then worked by chords; then the distance of its degree from the head of Cancer or Capricorn is taken, and the difference of its passage to midheaven is worked by chords and added to the right-sphere risings or subtracted from them according to the side of the latitude and the star's place in the signs, so that the degree that comes to midheaven with it is known. {cite:zij-sabi-nallino-byblion pp.51-52}."
  ur: "البتانی مراحل رکھتے ہیں: ستارے کا عرض اور اس کے جز کا میل جمع کیے جاتے ہیں اگر ان کی جہتیں ایک ہوں، ورنہ کم کو زیادہ سے گھٹایا جاتا ہے، یوں عرض معدل نکلتا ہے؛ پھر اوتار سے ستارے کا معدل النہار سے بعد نکالا جاتا ہے؛ پھر اس کے درجے کا راس سرطان یا جدی سے بعد لیا جاتا ہے اور وسط السماء میں اس کے گزرنے کا اختلاف اوتار سے نکال کر عرض کی جہت اور بروج میں ستارے کے مقام کے مطابق فلک مستقیم کے مطالع میں بڑھایا یا گھٹایا جاتا ہے، یوں وہ درجہ معلوم ہوتا ہے جو اس کے ساتھ وسط السماء میں آتا ہے۔ {cite:zij-sabi-nallino-byblion pp.51-52}۔"
