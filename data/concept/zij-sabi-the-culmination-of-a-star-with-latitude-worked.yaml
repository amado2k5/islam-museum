label: { ar: "حساب بعد الكوكب ذي العرض واختلاف مجازه في وسط السماء في الزيج الصابي", en: "The working of the distance and culmination difference of a star with latitude", ur: "عرض والے ستارے کے بعد اور وسط السماء میں اس کے مجاز کے اختلاف کا حساب", es: "El funcionamiento de la diferencia de distancia y culminación de una estrella con la latitud", fr: "Le calcul de la différence de distance et de culmination d'une étoile en fonction de sa latitude", tr: "Sabaean Astronomik Tablolarında, belirli bir enlemdeki bir gezegenin uzaklığının ve gökyüzünün merkezinden geçen yörüngesindeki değişimin hesaplanması.", id: "Menghitung jarak sebuah planet dengan garis lintang tertentu dan variasi lintasannya melintasi pusat langit dalam Tabel Astronomi Sabaean." }
summary:
  ar: "يضع البتاني خطوات: عرض الكوكب وميل جزئه يُجمعان إن اتحدت جهتاهما أو يُنقص الأقل من الأكثر، فيكون العرض المعدل، ثم يُحسب بعد الكوكب عن معدل النهار بالأوتار، ثم يؤخذ بعد درجته عن رأس السرطان أو الجدي، ويُحسب اختلاف مجازه في وسط السماء بالأوتار فيُضاف إلى مطالع الفلك المستقيم أو يُنقص منها بحسب جهة العرض وموضع الكوكب من البروج، فتعرف الدرجة التي تتوسط السماء معه. {cite:zij-sabi-nallino-byblion pp.51-52}."
  en: "Al-Battani lays down the steps: the star's latitude and its degree's declination are added if their sides agree, or the smaller is subtracted from the larger, giving the corrected latitude; the star's distance from the equator is then worked by chords; then the distance of its degree from the head of Cancer or Capricorn is taken, and the difference of its passage to midheaven is worked by chords and added to the right-sphere risings or subtracted from them according to the side of the latitude and the star's place in the signs, so that the degree that comes to midheaven with it is known. {cite:zij-sabi-nallino-byblion pp.51-52}."
  ur: "البتانی مراحل رکھتے ہیں: ستارے کا عرض اور اس کے جز کا میل جمع کیے جاتے ہیں اگر ان کی جہتیں ایک ہوں، ورنہ کم کو زیادہ سے گھٹایا جاتا ہے، یوں عرض معدل نکلتا ہے؛ پھر اوتار سے ستارے کا معدل النہار سے بعد نکالا جاتا ہے؛ پھر اس کے درجے کا راس سرطان یا جدی سے بعد لیا جاتا ہے اور وسط السماء میں اس کے گزرنے کا اختلاف اوتار سے نکال کر عرض کی جہت اور بروج میں ستارے کے مقام کے مطابق فلک مستقیم کے مطالع میں بڑھایا یا گھٹایا جاتا ہے، یوں وہ درجہ معلوم ہوتا ہے جو اس کے ساتھ وسط السماء میں آتا ہے۔ {cite:zij-sabi-nallino-byblion pp.51-52}۔"
  es: "Al-Battani describe los pasos: se suman la latitud de la estrella y la declinación de su grado si coinciden, o se resta la menor de la mayor, obteniendo así la latitud corregida; luego se calcula la distancia de la estrella al ecuador mediante cuerdas; a continuación, se toma la distancia de su grado a la cabeza de Cáncer o Capricornio, y la diferencia de su paso al medio cielo se calcula mediante cuerdas y se suma a las salidas de la esfera derecha o se resta de ellas según el lado de la latitud y la posición de la estrella en los signos, de modo que se conoce el grado que llega al medio cielo con ella. {cite:zij-sabi-nallino-byblion pp.51-52}."
  fr: "Al-Battani décrit les étapes: on additionne la latitude de l’étoile et sa déclinaison si leurs côtés coïncident; sinon, on soustrait la plus petite de la plus grande, ce qui donne la latitude corrigée. On calcule ensuite la distance de l’étoile à l’équateur par la méthode des cordes. Puis, on prend la distance de son degré à la tête du Cancer ou du Capricorne, et la différence de son passage au milieu du ciel est calculée par la méthode des cordes et ajoutée aux levers de la sphère droite ou soustraite de ceux-ci selon le côté de la latitude et la position de l’étoile dans les signes, de sorte qu’on connaît le degré qui atteint le milieu du ciel avec elle. {cite:zij-sabi-nallino-byblion pp.51-52}."
  tr: "Al-Battani şu adımları özetliyor: Gezegenin enlemi ve eğimi, yönleri çakışıyorsa toplanır; çakışıyorsa daha küçük olan daha büyük olandan çıkarılır ve böylece ayarlanmış enlem elde edilir. Daha sonra, gezegenin ekinokslardan uzaklığı kirişler kullanılarak hesaplanır. Ardından, Yengeç veya Oğlak burcunun başından olan derecesi alınır ve göksel meridyen boyunca yörüngesindeki değişim kirişler kullanılarak hesaplanır. Bu daha sonra, enleme ve gezegenin zodyaktaki konumuna bağlı olarak, düz göksel kürenin yükselen derecelerine eklenir veya çıkarılır ve böylece göksel meridyenden eşit uzaklıkta olduğu derece belirlenir. {cite:zij-sabi-nallino-byblion pp.51-52}."
  id: "Al-Battani menguraikan langkah-langkah berikut: Garis lintang planet dan kemiringan bagiannya dijumlahkan jika arahnya bertepatan, atau yang lebih kecil dikurangi dari yang lebih besar, menghasilkan garis lintang yang disesuaikan. Kemudian, jarak planet dari ekuinoks dihitung menggunakan tali busur. Selanjutnya, derajatnya diambil dari kepala Cancer atau Capricorn, dan variasi lintasannya melintasi meridian langit dihitung menggunakan tali busur. Ini kemudian ditambahkan atau dikurangi dari derajat naik bola langit lurus, tergantung pada garis lintang dan posisi planet di zodiak, sehingga menentukan derajat di mana ia berjarak sama dari meridian langit. {cite:zij-sabi-nallino-byblion pp.51-52}."
