id: "concept/taarruf-ahwal-al-ayn"
class: "concept"
kind: "scientific"
label:
  ar: "تعرف أحوال العين وأمزجتها"
  en: "Discerning the eye's states and tempers"
  ur: "آنکھ کے احوال اور امزجہ کی پہچان"
  es: "Discernir los estados y temperamentos del ojo"
  fr: "Discerner les états et les humeurs de l'œil"
  tr: "Gözün durumunu ve ruh hallerini biliyorsunuz"
  id: "Anda tahu kondisi mata dan suasana hatinya"
summary:
  ar: "تتعرف أحوال العين من ملمسها وحركتها وعروقها ولونها وشكلها وقدرها وفعلها الخاص وحال ما يسيل منها وحال انفعالاتها، فالملمس الحار البارد الصلب اللين والحركة الخفيفة الثقيلة والعروق الغليظة الدقيقة الخالية الممتلئة واللون الدال على الخلط الغالب كلها دلائل على مزاجها {cite:canon-ibn-sina-print-v2 p.163}"
  en: "The eye's states are discerned from its touch, motion, veins, colour, shape, size, special action, what flows from it and its passions: hot or cold, hard-dry or soft-moist to the touch; light motion pointing to heat or dryness, heavy to cold and moisture; wide gross veins pointing to heat, fine hidden ones to cold, empty to dryness, full to abundant matter; each colour pointing to the matching prevailing humour {cite:canon-ibn-sina-print-v2 p.163}"
  ur: "آنکھ کے احوال اس کے لمس، حرکت، رگوں، رنگ، شکل، قدر، خاص فعل، اس سے بہنے والی چیز اور اس کے انفعالات سے پہچانے جاتے ہیں: لمس میں گرم یا سرد، سخت خشک یا نرم مرطوب؛ حرکت ہلکی ہو تو حرارت یا خشکی کی دلیل، بھاری ہو تو برودت اور رطوبت کی؛ رگیں موٹی کھلی ہوں تو حرارت، باریک پوشیدہ ہوں تو برودت، خالی ہوں تو خشکی، بھری ہوں تو مادہ کی کثرت؛ اور ہر رنگ اس سے میل رکھنے والے غالب خلط پر دلالت کرتا ہے {cite:canon-ibn-sina-print-v2 p.163}"
  es: "Los estados del ojo se disciernen por su tacto, movimiento, venas, color, forma, tamaño, acción especial, lo que emana de él y sus pasiones: caliente o frío, duro-seco o suave-húmedo al tacto; el movimiento ligero indica calor o sequedad, el pesado frío y humedad; las venas anchas y gruesas indican calor, las finas y ocultas frío, el vacío se indica sequedad, el lleno abundante; cada color indica el humor predominante correspondiente {cite:canon-ibn-sina-print-v2 p.163}"
  fr: "L'état de l'œil se discerne par son toucher, son mouvement, ses veines, sa couleur, sa forme, sa taille, son action particulière, ce qui en émane et ses passions: chaud ou froid, dur et sec ou mou et humide au toucher; un mouvement léger indique la chaleur ou la sécheresse, un mouvement lourd le froid et l'humidité; des veines larges et saillantes indiquent la chaleur, des veines fines et cachées le froid, vides la sécheresse, pleines l'abondance de matière; chaque couleur indique l'humeur dominante correspondante {cite:canon-ibn-sina-print-v2 p.163}"
  tr: "Gözün durumu, dokusu, hareketi, damarları, rengi, şekli, değeri, özel işlevi, ondan akan durumu ve duygularının durumu ile tanınır. Sıcak, soğuk, sert, yumuşak doku, hafif ağır hareket, kalın, ince, boş ve dolgun damarlar ile baskın karışımı gösteren renk ruh halinin işaretleridir {cite:canon-ibn-sina-print-v2 s.163}"
  id: "Keadaan mata dikenali melalui tekstur, gerakan, urat, warna, bentuk, nilai, fungsi khusus, keadaan apa yang mengalir darinya, dan keadaan emosinya. Tekstur hangat, dingin, keras, lembut, gerakan ringan dan berat, pembuluh darah tebal, tipis, kosong, dan penuh, serta warna yang menunjukkan campuran dominan semuanya adalah tanda-tanda suasana hatinya {cite:canon-ibn-sina-print-v2 hlm.163}"
