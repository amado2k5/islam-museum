label:
  ar: "مثل «رجع بخفي حنين»"
  en: "The proverb 'He returned with Hunayn's two boots'"
  ur: "مثل «رجع بخفی حنین»"
  fr: "Le proverbe « Il est revenu avec les deux bottes de Hunayn »"
  es: "El proverbio «Volvió con las dos botas de Hunayn»"
  tr: "Mesela \"Nostaljide gizlenmiş olarak geri döndü.\""
  id: "Seperti \"Dia kembali tersembunyi dalam nostalgia.\""
summary:
  ar: "مثل يُضرب لمن يعود خائباً صفر اليدين، وقصته في مجمع الأمثال أن حنيناً الإسكافي بالحيرة خدع أعرابياً فأخذ جمله وحمله وترك له خفيه {cite:arrafid-article-amthal-stories}."
  en: "A proverb for one who comes back empty-handed; in Majma al-Amthal its tale is of Hunayn the cobbler of al-Hira, who tricked a Bedouin, took his camel and load and left him only the boots {cite:arrafid-article-amthal-stories}."
  ur: "وہ مثل جو خالی ہاتھ لوٹنے والے کے لیے کہی جاتی ہے؛ مجمع الامثال میں اس کا قصہ حیرہ کے موچی حنین کا ہے جس نے ایک بدو کو دھوکا دے کر اس کا اونٹ اور سامان لے لیا اور اس کے پاس صرف جوتے چھوڑے {cite:arrafid-article-amthal-stories}۔"
  fr: "Proverbe dit de qui revient les mains vides ; dans Majma al-Amthal, l'histoire est celle de Hunayn, le cordonnier d'al-Hira, qui trompa un bédouin, prit son chameau et sa charge et ne lui laissa que les bottes {cite:arrafid-article-amthal-stories}."
  es: "Proverbio que se dice de quien vuelve con las manos vacías; en Majma al-Amthal el relato es el de Hunayn, el zapatero de al-Hira, que engañó a un beduino, le tomó el camello y la carga y solo le dejó las botas {cite:arrafid-article-amthal-stories}."
  tr: "Elleri ve eli Majma'al-Amthal'da olan biri için bir atasözü verilir: Hanina ayakkabıcı şaşkınlıkla bir bedeviyi kandırır, bu yüzden bir deve alır, taşır ve ona sırrını bırakır {cite:arrafid-article-amthal-stories}."
  id: "Sebuah peribahasa diberikan untuk seseorang yang pulang dengan tangan kecewa dan tangannya ada di Majma' al-Amthal: Hanina si tukang sepatu dalam kebingungan menipu seorang Badui sehingga ia mengambil unta, membawanya, dan meninggalkan rahasianya {cite:arrafid-article-amthal-stories}."
