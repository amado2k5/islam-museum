id: concept/dar-fiqh
class: concept
kind: legal
label:
  ar: الدار في الفقه
  en: Al-Dar in fiqh (the house / residential estate)
  ur: الدار فقہ میں
summary:
  ar: 'الدار في اللغة اسم جامع للعرصة والبناء والمحلة، وتطلق على موضع حلول القوم وعلى البلدة والصقع والقبائل مجازا، ومعناها الاصطلاحي يوافق اللغوي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8044} وتتصل بها ألفاظ كـ(البيت) وهو مأوى الإنسان بالليل وبينهما عموم وخصوص وجهي، و(الحجرة) و(الغرفة) و(الخدر) و(المنزل) وهو دون الدار وفوق البيت، و(المخدع) للحرز. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8044}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8045} اتفق الفقهاء على أن العقد المطلق على الدار بيعا أو إجارة أو وصية أو وقفا يتناول الأرض والبناء وكل ما هو مثبت فيها كالأجنحة والرواشن والدرج المعقودة والأسقف والأبواب المنصوبة وغلقها المثبت والخوابي والأشجار الرطبة والبئر وحجر الرحى الأسفل الثابت، بخلاف المنقولات المنفصلة كالأثاث والفرش والستائر والرفوف غير المسمرة والأقفال والحبال والدلو والبكرة غير المركبة وحجر الرحى الأعلى المنفصل في وجه؛ إلا أن يشترط المتعاقدان شمولها أو يوقف الدار بما فيها فتدخل تبعا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8045}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8046} وصحح الجمهور وقف علو الدار دون سفلها أو عكسه أو جعل وسطها مسجدا دون ذكر الاستطراق لأن ما جاز بيعه جاز وقفه، وخالف الحنفية في ذلك فمنعوا وقف جزء شائع أو مفرز دون استطراق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8046}'
  en: 'Al-dar linguistically is a collective noun comprising courtyard, structure, and quarter, metaphorically applied to a town, province, or tribe; its legal meaning conforms to its lexical sense. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8044} Related architectural terms include bayt (night lodging, having an overlapping relation with dar), hujrah (room), ghurfah (upper chamber), khidr (screened domestic area), manzil (dwelling smaller than a dar and larger than a bayt), and mikhda'' (storage closet). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8044}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8045} Jurists unanimously agree that an unqualified contract on a house—whether sale, hire, bequest, or waqf—includes the land, the structure, and all fixtures attached to it, such as projecting wings, balconies, built staircases, roofs, hung doors, fixed locks, storage vats, living planted trees, wells, and the fixed lower millstone; loose movables such as furniture, bedding, draperies, unfastened shelves, detached locks, ropes, buckets, detached pulleys, and the separate upper millstone in one view do not enter unless explicitly stipulated or endowed with all its contents. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8045}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8046} The majority validate the endowment (waqf) of the upper story of a house without the lower, or vice versa, or designating the courtyard as a mosque without stipulating an access pathway, reasoning that what may be sold may be endowed, whereas Hanafis disallow such partial endowments. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8046}'
  ur: 'لغت میں دار زمین، عمارت اور محلے کے مجموعے کا نام ہے، اور مجازاً بستی، خطے اور قبیلے پر بولا جاتا ہے، اور اس کا اصطلاحی معنی لغوی معنی کے مطابق ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8044} اس سے متعلق الفاظ میں بیت (رات کا ٹھکانہ، جس کے ساتھ دار کا عموم و خصوص من وجوہ کا تعلق ہے)، حجرہ، غرفہ، خدر، منزل (جو دار سے چھوٹا اور بیت سے بڑا ہو) اور مخدع (حفاظتی چھوٹا کمرہ) شامل ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8044}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8045} فقہاء کا اتفاق ہے کہ گھر پر بیع، اجارہ، وصیت یا وقف کا مطلق عقد زمین، عمارت اور اس سے جڑی تمام ثابت اشیاء پر مشتمل ہوتا ہے جیسے بالکونیاں، بندھی ہوئی سیڑھیاں، چھتیں، نصب شدہ دروازے اور لگے ہوئے تالے، حوض، لگے ہوئے درخت، کنواں اور چکی کا نچلا قائم پتھر؛ البتہ غیر ثابت منقولات جیسے فرنیچر، بستر، پردے، کیل کے بغیر رکھی الماریاں، رسیاں، ڈول، غیر مرکب چرخی اور ایک قول کے مطابق چکی کا الگ اوپر کا پتھر اس میں داخل نہیں ہوتے الا یہ کہ شرط کی جائے یا کل ما فیہا کے ساتھ وقف کیا جائے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8045}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8046} جمہور نے گھر کے نچلے حصے کے بغیر اوپر والے حصے کا وقف، یا اس کے برعکس، یا راستے کا ذکر کیے بغیر صحن کو مسجد بنانا درست قرار دیا کیونکہ جس کی بیع جائز ہے اس کا وقف بھی جائز ہے، جبکہ حنفیہ نے اس سے اختلاف کرتے ہوئے اسے ناجائز کہا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8046}'
