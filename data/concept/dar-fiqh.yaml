label:
  ar: الدار في الفقه
  en: Al-Dar in fiqh (the house / residential estate)
  ur: الدار فقہ میں
  es: "Al-Dar en fiqh (la casa / propiedad residencial)"
  fr: "Al-Dar en fiqh (la maison / le domaine résidentiel)"
  tr: "Hukuk Meclisi"
  id: "Dewan dalam Yurisprudensi"
summary:
  ar: 'الدار في اللغة اسم جامع للعرصة والبناء والمحلة، وتطلق على موضع حلول القوم وعلى البلدة والصقع والقبائل مجازا، ومعناها الاصطلاحي يوافق اللغوي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8044} وتتصل بها ألفاظ كـ⁦(البيت)⁩ وهو مأوى الإنسان بالليل وبينهما عموم وخصوص وجهي، و⁦(الحجرة)⁩ و⁦(الغرفة)⁩ و⁦(الخدر)⁩ و⁦(المنزل)⁩ وهو دون الدار وفوق البيت، و⁦(المخدع)⁩ للحرز. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8044}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8045} اتفق الفقهاء على أن العقد المطلق على الدار بيعا أو إجارة أو وصية أو وقفا يتناول الأرض والبناء وكل ما هو مثبت فيها كالأجنحة والرواشن والدرج المعقودة والأسقف والأبواب المنصوبة وغلقها المثبت والخوابي والأشجار الرطبة والبئر وحجر الرحى الأسفل الثابت، بخلاف المنقولات المنفصلة كالأثاث والفرش والستائر والرفوف غير المسمرة والأقفال والحبال والدلو والبكرة غير المركبة وحجر الرحى الأعلى المنفصل في وجه؛ إلا أن يشترط المتعاقدان شمولها أو يوقف الدار بما فيها فتدخل تبعا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8045}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8046} وصحح الجمهور وقف علو الدار دون سفلها أو عكسه أو جعل وسطها مسجدا دون ذكر الاستطراق لأن ما جاز بيعه جاز وقفه، وخالف الحنفية في ذلك فمنعوا وقف جزء شائع أو مفرز دون استطراق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8046}'
  en: 'Al-dar linguistically is a collective noun comprising courtyard, structure, and quarter, metaphorically applied to a town, province, or tribe; its legal meaning conforms to its lexical sense. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8044} Related architectural terms include bayt (night lodging, having an overlapping relation with dar), hujrah (room), ghurfah (upper chamber), khidr (screened domestic area), manzil (dwelling smaller than a dar and larger than a bayt), and mikhda'' (storage closet). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8044}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8045} Jurists unanimously agree that an unqualified contract on a house—whether sale, hire, bequest, or waqf—includes the land, the structure, and all fixtures attached to it, such as projecting wings, balconies, built staircases, roofs, hung doors, fixed locks, storage vats, living planted trees, wells, and the fixed lower millstone; loose movables such as furniture, bedding, draperies, unfastened shelves, detached locks, ropes, buckets, detached pulleys, and the separate upper millstone in one view do not enter unless explicitly stipulated or endowed with all its contents. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8045}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8046} The majority validate the endowment (waqf) of the upper story of a house without the lower, or vice versa, or designating the courtyard as a mosque without stipulating an access pathway, reasoning that what may be sold may be endowed, whereas Hanafis disallow such partial endowments. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8046}'
  ur: 'لغت میں دار زمین، عمارت اور محلے کے مجموعے کا نام ہے، اور مجازاً بستی، خطے اور قبیلے پر بولا جاتا ہے، اور اس کا اصطلاحی معنی لغوی معنی کے مطابق ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8044} اس سے متعلق الفاظ میں بیت ⁦(رات کا ٹھکانہ، جس کے ساتھ دار کا عموم و خصوص من وجوہ کا تعلق ہے)⁩، حجرہ، غرفہ، خدر، منزل ⁦(جو دار سے چھوٹا اور بیت سے بڑا ہو)⁩ اور مخدع ⁦(حفاظتی چھوٹا کمرہ)⁩ شامل ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8044}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8045} فقہاء کا اتفاق ہے کہ گھر پر بیع، اجارہ، وصیت یا وقف کا مطلق عقد زمین، عمارت اور اس سے جڑی تمام ثابت اشیاء پر مشتمل ہوتا ہے جیسے بالکونیاں، بندھی ہوئی سیڑھیاں، چھتیں، نصب شدہ دروازے اور لگے ہوئے تالے، حوض، لگے ہوئے درخت، کنواں اور چکی کا نچلا قائم پتھر؛ البتہ غیر ثابت منقولات جیسے فرنیچر، بستر، پردے، کیل کے بغیر رکھی الماریاں، رسیاں، ڈول، غیر مرکب چرخی اور ایک قول کے مطابق چکی کا الگ اوپر کا پتھر اس میں داخل نہیں ہوتے الا یہ کہ شرط کی جائے یا کل ما فیہا کے ساتھ وقف کیا جائے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8045}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8046} جمہور نے گھر کے نچلے حصے کے بغیر اوپر والے حصے کا وقف، یا اس کے برعکس، یا راستے کا ذکر کیے بغیر صحن کو مسجد بنانا درست قرار دیا کیونکہ جس کی بیع جائز ہے اس کا وقف بھی جائز ہے، جبکہ حنفیہ نے اس سے اختلاف کرتے ہوئے اسے ناجائز کہا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8046}'
  es: "Lingüísticamente, Al-dar es un sustantivo colectivo que comprende patio, estructura y barrio, aplicado metafóricamente a una ciudad, provincia o tribu; su significado legal se ajusta a su sentido léxico. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8044} Los términos arquitectónicos relacionados incluyen bayt (alojamiento nocturno, que tiene una relación superpuesta con dar), hujrah (habitación), ghurfah (cámara superior), khidr (área doméstica con mampara), manzil (vivienda más pequeña que un dar y más grande que un bayt) y mikhda' (armario de almacenamiento). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8044}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8045} Los juristas coinciden unánimemente en que un contrato no calificado sobre una casa, ya sea venta, alquiler, legado o waqf, incluye el terreno, la estructura y todos los accesorios adjuntos a ella, tales como alas salientes, balcones, escaleras construidas, techos, puertas colgadas, cerraduras fijas, tinas de almacenamiento, árboles vivos plantados, pozos y la piedra de molino inferior fija; los bienes móviles sueltos tales como muebles, ropa de cama, cortinas, estantes sueltos, cerraduras desprendidas, cuerdas, cubos, poleas desprendidas y la piedra de molino superior separada en una vista no entran a menos que se estipule explícitamente o se dote con todo su contenido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8045}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8046} La mayoría valida la dotación (waqf) del piso superior de una casa sin el inferior, o viceversa, o la designación del patio como mezquita sin estipular un camino de acceso, argumentando que lo que se puede vender se puede dotar, mientras que los hanafíes no permiten tales dotizaciones parciales. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8046}"
  fr: "Linguistiquement, al-dar est un nom collectif comprenant cour, structure et quartier, appliqué métaphoriquement à une ville, une province ou une tribu; sa signification juridique correspond à son sens lexical. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8044} Parmi les termes architecturaux apparentés, on trouve bayt (logement de nuit, proche de dar), hujrah (chambre), ghurfah (chambre haute), khidr (espace domestique protégé), manzil (habitation plus petite qu'un dar et plus grande qu'un bayt) et mikhda' (placard de rangement). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8044}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8045} Les juristes s'accordent à dire qu'un contrat sans réserve sur une maison — qu'il s'agisse de vente, de location, de legs ou de waqf — comprend le terrain, la structure et tous les éléments qui y sont attachés, tels que les ailes en saillie, les balcons, les escaliers construits, les toits, les portes suspendues, les serrures fixes, les cuves de stockage, les arbres vivants plantés, les puits et la meule inférieure fixe; les éléments mobiles non fixés tels que les meubles, la literie, les rideaux, les étagères non fixées, les serrures détachées, les cordes, les seaux, les poulies détachées et la meule supérieure séparée d'un seul coup ne sont pas inclus à moins d'être explicitement stipulés ou dotés de tout leur contenu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8045}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8046} La majorité valide la dot (waqf) de l'étage supérieur d'une maison sans l'étage inférieur, ou inversement, ou la désignation de la cour comme mosquée sans préciser de voie d'accès, considérant que ce qui peut être vendu peut faire l'objet d'une dot, tandis que les hanafites interdisent de telles dotations partielles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8046}"
  tr: "Dilde 'al-dar', 'arsa', 'bana' ve 'mahalla' için toplu bir isimdir ve mecazi olarak insanların yaşadığı yer, kasaba, al-saq'a ve kabileler için kullanılır; teknik anlamı dilbilimle uyumludur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8044} (al-bayt) gibi terimlerle bağlantılıdır; bu, gece insan barınağı olup, aralarında genel ve özel bir bağlantı bulunan (al-hujrah), (al-hujra), (al-khadr), (al-manzil) evin altında ve evin üstünde yer alır ve (al-mukhda') çit içindir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8044} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8045} Hukukçular, satış, kiralama, vasiyet veya vakıf yoluyla bir evin kesin sözleşmesinin, arazi, bina ve içinde yer alan her şeyi kapsadığını, kanatlar, korkuluklar, bağlı merdivenler, tavanlar, sabit kapılar, sabit ve kapalı kapılar, ıslak ağaçlar, kuyular ve sabit alt değirmen taşları gibi her şeyi kapsadığını kabul etmişlerdir; mobilya, mobilya, perde, çivilenmemiş raflar, kilitler, halatlar, kovalar, montajsız makaralar ve ayrı üst değirmen taşı gibi ayrı hareketli eşyaların aksine; aksi takdirde taraflar evin içeriğiyle birlikte dahil edilmesini veya bağışlanmasını talep etmezler, bu bir tüzük olarak kabul edilir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.8045} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8046} Çoğunluk, evin üst kısmının bağışını alt veya karşıt kısmı olmadan düzeltmiş ya da merkezi cami yapmış, çünkü satılması izin verilen şey bağışlanmaya da izin verilmiştir. Hanefi bu konuda aynı fikirde değil, bu yüzden çıkıntısız ortak veya ayrı bir kısmın vakıf edilmesini yasakladılar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8046}"
  id: "Dalam bahasa, 'al-dar' adalah nama kolektif untuk 'arsa', 'bana', dan 'mahalla', dan digunakan secara kiasan untuk tempat tinggal orang, kota, al-saq'a, dan suku, dan makna teknisnya sesuai dengan linguistik. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8044} dikaitkan dengan istilah seperti (al-bayt), yang merupakan tempat berlindung manusia di malam hari, dengan hubungan umum dan spesifik di antara mereka, (al-hujrah), (al-hujra), (al-khadr), (al-manzil), yang berada di bawah rumah dan di atas rumah, serta (al-mukhda') untuk pagar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8044} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8045} Para ahli hukum telah sepakat bahwa kontrak mutlak untuk sebuah rumah melalui penjualan, sewa, wasiat, atau wakaf mencakup tanah, bangunan, dan segala sesuatu yang tetap di dalamnya, seperti sayap, pagar, tangga terikat, langit-langit, pintu tetap, pintu tetap dan tertutup, pohon basah, sumur, dan batu gilingan bawah tetap, berbeda dengan barang-barang bergerak terpisah seperti furnitur, perabotan, tirai, rak tanpa paku, kunci, tali, ember, katrol yang belum dirakit, dan batu gilingan atas terpisah; kecuali para pihak yang mengontrak mengharuskan mereka memasukkan atau memberikan rumah beserta isinya, yang dianggap sebagai peraturan peranggaan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8045} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8046} Mayoritas telah mengoreksi pemberian dana bagian atas rumah tanpa bagian bawah atau seberangnya, atau menjadikan tengahnya masjid tanpa menyebutkan intrusi, karena apa yang diperbolehkan dijual juga diperbolehkan untuk diwakafikan. Kaum Hanafi tidak setuju dalam hal ini, sehingga mereka melarang pemberian bagian bersama atau terpisah tanpa tonjolan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8046}"
