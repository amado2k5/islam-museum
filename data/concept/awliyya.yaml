id: concept/awliyya
class: concept
kind: term
label:
  ar: "الأولوية"
  en: "Awliyya (priority: the better course and the reasoning from the more fitting case, in usul and fiqh)"
  fr: "Awliyya (priorité : la meilleure conduite et le raisonnement a fortiori, en usul et en fiqh)"
  es: "Awliyya (prioridad: el mejor camino y el razonamiento del caso más apropiado, en usul y fiqh)"
  ur: "اولیاء ⁦(ترجیح: اصول اور فقہ میں زیادہ موزوں صورت سے بہتر طریقہ اور استدلال)⁩"
summary:
  ar: "الأولوية لغة كون الشيء أولى من غيره، أي أحرى وأجدر وأحق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3690} واستعمل الأصوليون والفقهاء الأولى بمعنى الأحرى والأفضل، وبمعنى المستحق دون غيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3690}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3691} ويعبرون عن الندب الخفيف بالأولى، وعن ترك المندوب بخلاف الأولى، وعند الحنفية من ارتكب خلاف الأولى فقد أساء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3691} ومن أنواع الدلالة فحوى الخطاب، كثبوت تحريم الضرب من نهي التأفيف، لفهم مناط الحكم، وقياس الأولى أحد أنواع القياس الجلي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3691}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3692} وتستعمل كلمة «لا بأس» عند الحنفية غالبا فيما تركه أولى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3692}"
  en: "Awliyya in lexical sense is the state of one thing being more fitting than another, that is more deserving and nearer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3690} The usulis and jurists use awla in the sense of more fitting and better, and in the sense of having a right to a thing over others. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3690}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3691} They call a light recommendation awla, and call the leaving of a recommended act khilaf al-awla; the Hanafis hold that whoever does what is contrary to the better course has done ill. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3691} Among the kinds of verbal indication is the fahwa al-khitab, where a ruling is extended to an unmentioned case by the understood cause, as the prohibition of a word of contempt implies the prohibition of beating, and qiyas al-awla is a kind of clear analogy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3691}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3692} For the Hanafis the phrase ‘there is no harm’ usually signals that the leaving of an act is the better course. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3692}"
  fr: "Au sens lexical, l’awliyya désigne le fait qu’une chose convient mieux qu’une autre, c’est-à-dire qu’elle est plus digne et plus proche. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3690} Les spécialistes des fondements du droit et les juristes emploient awla au sens de plus approprié et de meilleur, ainsi que pour désigner un droit prioritaire sur une chose. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3690}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3691} Ils qualifient d’awla une recommandation légère, et de khilaf al-awla l’abandon d’un acte recommandé ; les hanafites estiment que celui qui agit contrairement à la meilleure conduite a mal agi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3691} Parmi les indications du langage figure le fahwa al-khitab, qui étend une règle à un cas non mentionné en raison de la cause comprise dans le propos : l’interdiction d’une parole de mépris implique ainsi celle des coups. Le qiyas al-awla constitue une forme d’analogie manifeste. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3691}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3692} Pour les hanafites, la formule « il n’y a pas de mal » indique généralement qu’il vaut mieux s’abstenir de l’acte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3692}"
  es: "Awliyya en sentido léxico es el estado de que una cosa es más apropiada que otra, es decir, más merecedora y cercana. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3690} Los usulis y juristas usan awla en el sentido de más apropiado y mejor, y en el sentido de tener derecho a una cosa sobre otras. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3690}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3691} Llaman awla a una recomendación leve, y llaman khilaf al-awla a abandonar un acto recomendado; los hanafíes sostienen que quien hace lo contrario al mejor curso ha obrado mal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3691} Entre los tipos de indicación verbal se encuentra la fahwa al-khitab, donde una norma se extiende a un caso no mencionado por la causa implícita, como la prohibición de una palabra de desprecio implica la prohibición de golpear, y la qiyas al-awla es una especie de analogía clara. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3691}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3692} Para los hanafíes, la frase \"no hay daño\" suele indicar que abandonar un acto es la mejor opción. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3692}"
  ur: "اولیاء لغوی معنوں میں اس حالت کو کہتے ہیں کہ ایک چیز دوسری چیز سے زیادہ موزوں ہو، وہ زیادہ لائق اور قریب ہو۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 3690} اصول اور فقہاء اولا کو زیادہ موزوں اور بہتر کے معنی میں استعمال کرتے ہیں اور کسی چیز کا دوسروں پر حق ہونے کے معنی میں کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3690}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3691} وہ ہلکی سفارش کو اولا کہتے ہیں، اور مستحب عمل کو چھوڑنے کو خلف الاول کہتے ہیں۔ احناف کا خیال ہے کہ جس نے بہتر طریقہ کے خلاف کام کیا اس نے برا کیا۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 صفحہ 3691} زبانی اشارے کی اقسام میں سے فہوا الخطاب بھی ہے، جہاں سمجھے ہوئے وجہ سے حکم کو غیر مذکور تک بڑھایا جاتا ہے، جیسا کہ تحقیر کے لفظ کی ممانعت کا مطلب ہے کہ مار پیٹ کی ممانعت، صریح قسم کی مار۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3691}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3692} احناف کے نزدیک 'کوئی حرج نہیں' کا جملہ عام طور پر اس بات کی طرف اشارہ کرتا ہے کہ کسی عمل کو چھوڑنا بہتر طریقہ ہے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 صفحہ 3692}"
