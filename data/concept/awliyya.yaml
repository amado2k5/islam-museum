label: { ar: "الأولوية", en: "Awliyya (priority: the better course and the reasoning from the more fitting case, in usul and fiqh)" }
summary:
  ar: "الأولوية لغة كون الشيء أولى من غيره، أي أحرى وأجدر وأحق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3690} واستعمل الأصوليون والفقهاء الأولى بمعنى الأحرى والأفضل، وبمعنى المستحق دون غيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3690}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3691} ويعبرون عن الندب الخفيف بالأولى، وعن ترك المندوب بخلاف الأولى، وعند الحنفية من ارتكب خلاف الأولى فقد أساء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3691} ومن أنواع الدلالة فحوى الخطاب، كثبوت تحريم الضرب من نهي التأفيف، لفهم مناط الحكم، وقياس الأولى أحد أنواع القياس الجلي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3691}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3692} وتستعمل كلمة «لا بأس» عند الحنفية غالبا فيما تركه أولى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3692}"
  en: "Awliyya in lexical sense is the state of one thing being more fitting than another, that is more deserving and nearer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3690} The usulis and jurists use awla in the sense of more fitting and better, and in the sense of having a right to a thing over others. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3690}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3691} They call a light recommendation awla, and call the leaving of a recommended act khilaf al-awla; the Hanafis hold that whoever does what is contrary to the better course has done ill. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3691} Among the kinds of verbal indication is the fahwa al-khitab, where a ruling is extended to an unmentioned case by the understood cause, as the prohibition of a word of contempt implies the prohibition of beating, and qiyas al-awla is a kind of clear analogy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3691}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3692} For the Hanafis the phrase ‘there is no harm’ usually signals that the leaving of an act is the better course. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3692}"
