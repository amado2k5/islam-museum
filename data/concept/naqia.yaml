label: { ar: "النَّقِيعَة", en: "Naqia (feast for a returning traveller)", ur: "نقیعہ ⁦(مسافر کی واپسی کی دعوت)⁩", es: "Naqia (banquete para el viajero que regresa)", fr: "Naqia (festin pour un voyageur de retour)" }
summary:
  ar: "النقيعة في اللغة طعام يُتخذ للقادم من السفر، وتطلق على ما يُصنع عند الإملاك وما يُذبح للضيافة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16029} والحنفية والحنابلة يرونها مباحة، والمالكية والشافعية يرونها مندوبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16032} وإجابة دعوتها سنة أو مستحبة عند جمهور الحنفية والشافعية والحنابلة، وقال بعض السلف بوجوبها، وكرهها المالكية ما عدا وليمة العرس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16033}"
  en: "Naqia, in the lexicon, is food prepared for a traveller who returns; the word also covers food at a betrothal and an animal slaughtered for hospitality. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16029} The Hanafis and Hanbalis hold it lawful; the Malikis and Shafi'is hold it recommended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16032} Accepting the invitation is a sunna or recommended by most Hanafis, Shafi'is and Hanbalis; some early scholars and some Hanafis and Shafi'is held it obligatory; the Malikis dislike attending all feasts except the wedding feast. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16033}"
  ur: "نقیعہ لغت میں مسافر کی واپسی پر بنایا جانے والا کھانا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16029} حنفیہ اور حنابلہ اسے مباح، اور مالکیہ و شافعیہ مندوب کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16032} اس کی دعوت قبول کرنا جمہور کے نزدیک سنت یا مستحب ہے، اور بعض سلف واجب کہتے ہیں، جبکہ مالکیہ ولیمہ کے سوا دعوتوں میں شرکت کو مکروہ کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16033}"
  es: "Naqia, en el léxico, es la comida preparada para un viajero que regresa; la palabra también abarca la comida en un compromiso matrimonial y un animal sacrificado para la hospitalidad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16029} Los hanafíes y hanbalíes la consideran lícita; los malikíes y shafiíes la consideran recomendable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16032} Aceptar la invitación es una sunna o es recomendable para la mayoría de los hanafíes, shafiíes y hanbalíes; algunos eruditos antiguos y algunos hanafíes y shafiíes la consideraban obligatoria; a los malikíes no les gusta asistir a ningún banquete excepto al de bodas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16033}"
  fr: "Dans le lexique, la naqiya désigne la nourriture préparée pour un voyageur à son retour; le terme englobe également les aliments offerts lors de fiançailles et l’animal sacrifié en signe d’hospitalité. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16029} Les hanafites et les hanbalites la considèrent comme licite; les malikites et les chaféites la recommandent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16032} Accepter l’invitation est une sunna, ou recommandation, pour la plupart des hanafites, des chaféites et des hanbalites; certains savants anciens, ainsi que certains hanafites et chaféites, la considéraient comme obligatoire; les malikites désapprouvent la participation à toutes les fêtes, à l’exception du festin de mariage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16033}"
