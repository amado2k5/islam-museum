id: concept/naqia
class: concept
kind: legal
label: { ar: "النَّقِيعَة", en: "Naqia (feast for a returning traveller)", ur: "نقیعہ (مسافر کی واپسی کی دعوت)" }
summary:
  ar: "النقيعة في اللغة طعام يُتخذ للقادم من السفر، وتطلق على ما يُصنع عند الإملاك وما يُذبح للضيافة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16029} والحنفية والحنابلة يرونها مباحة، والمالكية والشافعية يرونها مندوبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16032} وإجابة دعوتها سنة أو مستحبة عند جمهور الحنفية والشافعية والحنابلة، وقال بعض السلف بوجوبها، وكرهها المالكية ما عدا وليمة العرس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16033}"
  en: "Naqia, in the lexicon, is food prepared for a traveller who returns; the word also covers food at a betrothal and an animal slaughtered for hospitality. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16029} The Hanafis and Hanbalis hold it lawful; the Malikis and Shafi'is hold it recommended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16032} Accepting the invitation is a sunna or recommended by most Hanafis, Shafi'is and Hanbalis; some early scholars and some Hanafis and Shafi'is held it obligatory; the Malikis dislike attending all feasts except the wedding feast. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16033}"
  ur: "نقیعہ لغت میں مسافر کی واپسی پر بنایا جانے والا کھانا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16029} حنفیہ اور حنابلہ اسے مباح، اور مالکیہ و شافعیہ مندوب کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16032} اس کی دعوت قبول کرنا جمہور کے نزدیک سنت یا مستحب ہے، اور بعض سلف واجب کہتے ہیں، جبکہ مالکیہ ولیمہ کے سوا دعوتوں میں شرکت کو مکروہ کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16033}"
