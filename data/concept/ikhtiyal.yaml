label:
  ar: اختيال
  en: Ikhtiyal (strutting pride in gait, dress and building)
  es: "Ikhtiyal (orgullo que se exhibe en el andar, la vestimenta y la construcción)"
  fr: "Ikhtiyal (fierté ostentatoire dans la démarche, les vêtements et les bâtiments)"
  ur: "اختیال ⁦(چلنے، لباس اور عمارت پر فخر کرنا)⁩"
  tr: "Seçim"
  id: "Pilihan"
summary:
  ar: 'الاختيال لغةً الكبر أو العجب، وهو عند الفقهاء من مظاهر الكبر، والأصل فيه التحريم وأنه من الكبائر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1967} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1968} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1969} ويقع الاختيال في المشي بتجاوز القصد، وفي اللباس بتجاوز الاعتدال مع غياب الداعي، وفي الركوب والبنيان، وقد يكون محموداً لإرهاب العدو. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1970} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1972} وتحسين الثياب والمركوب ليس من الكبر ما لم يقصد به الخيلاء، وتطويل المرأة ثوبها مأذون فيه بقدر شبر أو ذراع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1971}'
  en: 'Ikhtiyal means pride or self-admiration in the lexicon, and the jurists treat it as one form of arrogance. The ruling is prohibition and it is counted among the major sins. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1967} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1968} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1969} It appears in gait when it exceeds moderation, in dress when there is no reason for excess, in riding and in building; in war it can be praised as a means of terrifying the enemy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1970} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1972} Handsome clothes and mounts are not pride unless they are intended as pride; a woman may let her garment down by a span or, at most, a cubit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1971}'
  es: "Ikhtiyal significa orgullo o autoadmiración en el léxico, y los juristas lo tratan como una forma de arrogancia. La norma es la prohibición y se cuenta entre los pecados mayores. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1967} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1968} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1969} Aparece en el andar cuando excede la moderación, en la vestimenta cuando no hay razón para el exceso, en la equitación y en la construcción; en la guerra puede ser elogiado como un medio para aterrorizar al enemigo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1970} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1972} La ropa y los caballos elegantes no son motivo de orgullo a menos que se pretenda que lo sean; una mujer puede aflojar su vestimenta un palmo o, como máximo, un codo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1971}"
  fr: "Dans le lexique, « ikhtiyal » signifie orgueil ou vanité, et les juristes le considèrent comme une forme d'arrogance. Il est formellement interdit et compte parmi les péchés majeurs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1967} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1968} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1969} Il se manifeste dans la démarche lorsqu'il excède la modération, dans la tenue vestimentaire sans raison, dans l'équitation et dans la construction; à la guerre, il peut être loué comme moyen de terrifier l'ennemi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1970} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1972} Les beaux vêtements et les montures ne sont pas source d'orgueil à moins qu'ils ne soient destinés à l'être; une femme peut allonger son vêtement d'une empan ou, au plus, d'une coudée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1971}"
  ur: "لغت میں اختیال کا مطلب تکبر یا اپنی تعریف ہے اور فقہاء اسے تکبر کی ایک شکل سمجھتے ہیں۔ حکم ممانعت ہے اور کبیرہ گناہوں میں شمار ہوتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1967} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1968} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1969} یہ ظاہر ہوتا ہے جب یہ بغیر کسی وجہ کے، اضافی حالت میں ہوتا ہے، جب کوئی چال چلن نہ ہو۔ سواری اور عمارت میں؛ جنگ میں اسے دشمن کو خوفزدہ کرنے کے ایک ذریعہ کے طور پر سراہا جا سکتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1970} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1972} خوبصورت کپڑے اور سواریاں قابل فخر نہیں ہیں جب تک کہ ان کا مقصد فخر نہ ہو۔ ایک عورت اپنے کپڑے کو ایک وقفے سے یا زیادہ سے زیادہ ایک ہاتھ نیچے کر سکتی ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 1971}"
  tr: "El-İhtiyal, kibir veya hayret dilidir ve hukukçulara göre kibirin bir tezahürüdür; asıl ilke yasaktır ve büyük günahlar arasında yer almaktadır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.1967} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1968} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1969} Aldatıcılar, amacın ötesine geçerken ortaya çıkar; sebep olmadan ölçülü giyinme, binme ve inşaat yaparken, düşmanı terörize etmekte takdire şayan olabilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1970} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1972} Giysi ve biniciliği iyileştirmek, gurur için amaçlanmadıkça kibir olarak kabul edilmez ve bir kadının giysisini uzatması bir genişlik veya arşit kadar izinlidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1971}"
  id: "Al-Ikhtiyal adalah bahasa kesombongan atau keajaiban, dan menurut ahli hukum, bahasa ini adalah manifestasi kesombongan, dan prinsip aslinya adalah larangan dan bahwa itu termasuk dosa-dosa besar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1967} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1968} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1969} Penipu terjadi saat berjalan melampaui tujuan, berpakaian berlebihan tanpa tujuan, menunggang kuda dan membangun, dan dapat dipuji karena menakut-nakuti musuh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1970} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1972} Memperbaiki pakaian dan menunggang kuda tidak dianggap kesombongan kecuali dimaksudkan untuk kesombongan, dan perpanjangan pakaian wanita diizinkan dengan rentang atau satu hasta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1971}"
