id: concept/ikhtiyal
class: concept
kind: ethical
label:
  ar: اختيال
  en: Ikhtiyal (strutting pride in gait, dress and building)
summary:
  ar: 'الاختيال لغةً الكبر أو العجب، وهو عند الفقهاء من مظاهر الكبر، والأصل فيه التحريم وأنه من الكبائر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1967} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1968} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1969} ويقع الاختيال في المشي بتجاوز القصد، وفي اللباس بتجاوز الاعتدال مع غياب الداعي، وفي الركوب والبنيان، وقد يكون محموداً لإرهاب العدو. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1970} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1972} وتحسين الثياب والمركوب ليس من الكبر ما لم يقصد به الخيلاء، وتطويل المرأة ثوبها مأذون فيه بقدر شبر أو ذراع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1971}'
  en: 'Ikhtiyal means pride or self-admiration in the lexicon, and the jurists treat it as one form of arrogance. The ruling is prohibition and it is counted among the major sins. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1967} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1968} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1969} It appears in gait when it exceeds moderation, in dress when there is no reason for excess, in riding and in building; in war it can be praised as a means of terrifying the enemy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1970} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1972} Handsome clothes and mounts are not pride unless they are intended as pride; a woman may let her garment down by a span or, at most, a cubit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1971}'
