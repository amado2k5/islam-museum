label:
  ar: إخفاء
  en: Ikhfa (concealment in worship and law)
summary:
  ar: 'الإخفاء الستر والكتمان، ويتعدد حكمه بحسب مواطنه: إخفاء النية مستحب عند الجمهور مع خلاف في الحج والعمرة، وإخفاء صدقة التطوع أفضل وإعلان الفرض أفضل، وإخفاء الهلال يُكمل معه عدة الشهر ثلاثين، وفي إخفاء الإيمان خلاف، وفي الذكر الخفي خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1935} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1936} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1937}.'
  en: 'Ikhfa'' (concealment) means covering and keeping secret; its ruling varies with the matter: concealing the intention is recommended by most, with dispute for hajj and umra; concealing voluntary alms is better and publishing obligatory alms is better; if the new moon is hidden the month is counted as thirty days; concealing faith and silent dhikr are disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1935} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1936} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1937}.'
