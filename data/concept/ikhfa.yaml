label:
  ar: إخفاء
  en: Ikhfa (concealment in worship and law)
  es: "Ikhfa (ocultamiento en el culto y la ley)"
  fr: "Ikhfa (dissimulation dans le culte et la loi)"
  ur: "اخفا ⁦(عبادت اور قانون میں پردہ)⁩"
  tr: "Saklan"
  id: "Sembunyikan"
summary:
  ar: 'الإخفاء الستر والكتمان، ويتعدد حكمه بحسب مواطنه: إخفاء النية مستحب عند الجمهور مع خلاف في الحج والعمرة، وإخفاء صدقة التطوع أفضل وإعلان الفرض أفضل، وإخفاء الهلال يُكمل معه عدة الشهر ثلاثين، وفي إخفاء الإيمان خلاف، وفي الذكر الخفي خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1935} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1936} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1937}.'
  en: 'Ikhfa'' (concealment) means covering and keeping secret; its ruling varies with the matter: concealing the intention is recommended by most, with dispute for hajj and umra; concealing voluntary alms is better and publishing obligatory alms is better; if the new moon is hidden the month is counted as thirty days; concealing faith and silent dhikr are disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1935} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1936} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1937}.'
  es: "Ikhfa' (ocultación) significa cubrir y mantener en secreto; su regla varía según el asunto: la mayoría recomienda ocultar la intención, aunque hay controversia respecto al Hajj y la Umrah; ocultar la limosna voluntaria es mejor y publicar la limosna obligatoria es mejor; si se oculta la luna nueva, el mes se cuenta como treinta días; ocultar la fe y el dhikr silencioso son temas controvertidos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1935} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1936} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1937}."
  fr: "L'ikhfa' (dissimulation) signifie couvrir et garder secret; son application varie selon les circonstances: dissimuler son intention est recommandé par la plupart, sauf pour le hajj et l'umra; il est préférable de dissimuler les aumônes volontaires et de publier les aumônes obligatoires; si la nouvelle lune est cachée, le mois est compté comme trente jours; la dissimulation de la foi et le dhikr silencieux font l'objet de controverses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1935} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1936} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1937}."
  ur: "اخفا کا مطلب ہے چھپانا اور پوشیدہ رکھنا۔ اس کا حکم معاملہ کے لحاظ سے مختلف ہوتا ہے: حج اور عمرہ کے تنازعہ کے ساتھ، زیادہ تر لوگ نیت کو چھپانے کی سفارش کرتے ہیں۔ نفلی صدقات کو چھپانا بہتر ہے اور واجب صدقات کو شائع کرنا بہتر ہے۔ اگر نیا چاند چھپا ہو تو مہینہ تیس دن شمار ہوتا ہے۔ ایمان کو چھپانا اور خاموش ذکر میں اختلاف ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ1935} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1936}"
  tr: "Gizleme gizleme ve gizlemedir; hüküm bağlama göre değişir: niyeti gizlemek, çoğunluk tarafından Hac ve Umre konusunda anlaşmazlık içinde önerilir; gönüllü sadakatı gizlemek ve zorunlu eylemi ilan etmek daha iyidir; hilal ayını gizlemek bununla otuz ayı tamamlar; inancı gizleme ve gizli anma konusunda anlaşmazlık vardır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.1935} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1936} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1937}."
  id: "Menyembunyikan adalah penyembunyian dan penyembunyian, dan aturannya bervariasi tergantung konteksnya: menyembunyikan niat direkomendasikan oleh mayoritas dengan perbedaan pendapat mengenai Haji dan Umrah; menyembunyikan amal sukarela lebih baik dan menyatakan tindakan wajib lebih baik; menyembunyikan bulan sabit menyelesaikan tiga puluh bulan dengannya; ada perselisihan tentang menyembunyikan iman, dan tentang ingatan tersembunyi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1935} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.1936} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1937}."
