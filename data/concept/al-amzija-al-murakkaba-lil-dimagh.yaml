summary:
  ar: "يذكر ابن سينا دلائل الدماغ الحار اليابس والحار الرطب والبارد اليابس والبارد الرطب في الفضول والحواس والنوم والشعر والملمس واللون {cite:canon-ibn-sina-print-v2 p.24}"
  en: "Ibn Sina gives the signs of the hot dry, hot moist, cold dry and cold moist brain in the superfluities, senses, sleep, hair, touch and colour {cite:canon-ibn-sina-print-v2 p.24}"
  fr: "Ibn Sina décrit les signes des tempéraments chaud et sec, chaud et humide, froid et sec, et froid et humide du cerveau d’après les humeurs superflues, les sens, le sommeil, les cheveux, le toucher et le teint {cite:canon-ibn-sina-print-v2 p.24}"
  ur: "ابن سینا گرم خشک، گرم تر، ٹھنڈے خشک اور ٹھنڈے تر دماغ کی علامات فضلات، حواس، نیند، بال، لمس اور رنگ میں بتاتا ہے {cite:canon-ibn-sina-print-v2 p.24}۔"
  es: "Ibn Sina da los signos del cerebro caliente seco, caliente húmedo, frío seco y frío húmedo en las superfluidades, los sentidos, el sueño, el cabello, el tacto y el color {cite:canon-ibn-sina-print-v2 p.24}"
  tr: "İbn Sina beynin belirtilerinden bahseder: sıcak, kuru, sıcak, ıslak, soğuk, kuru, soğuk, ıslak ve merak, duyular, uyku, saç, doku ve renk {cite:canon-ibn-sina-print-v2 s.24}"
  id: "Ibn Sina membahas gejala otak: panas, kering, panas, basah, dingin, kering, dingin, basah dan rasa ingin tahu, indera, tidur, rambut, tekstur, dan warna {cite:canon-ibn-sina-print-v2 hlm.24}"
