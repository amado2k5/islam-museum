  ar: "دلائل الأمزجة المركبة للدماغ"
  en: "The signs of the compound temperaments of the brain"
  fr: "Les signes des tempéraments composés du cerveau"
  ur: "دماغ کے مرکب مزاجوں کی علامات"
  es: "Los signos de los temperamentos compuestos del cerebro"
  tr: "Beyin Kompleksi Ruh Hallerinin Kanıtları"
