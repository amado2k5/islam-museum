label: { ar: "التصاق", en: "Iltisaq (adhesion of things, and its rulings)", es: "Iltisaq (adhesión de cosas y sus normas)", fr: "Iltisaq (l'adhésion des choses et ses règles)" }
summary:
  ar: "الالتصاق اتصال الشيء بالشيء بحيث لا تكون بينهما فجوة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3312} وقد يحدث تلقائيا أو بقصد، ويترتب عليه أحكام، منها أولوية الشفعة للجار عند الحنفية إذا التصقت الدار بالدار في سكة نافذة، ومسح الجبيرة الملصقة على الجرح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3312}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3313} ومنه ما هو واجب كالتصاق الجبهة بالأرض في السجود، ومنه ما هو محرم كالتصاق الرجلين أو المرأتين في ثوب واحد بلا حائل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3312}"
  en: "Iltisaq is the joining of one thing to another with no gap between them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3312} It may happen by itself or by intent, and it carries rulings: for the Hanafis, a neighbour whose house adjoins a house on a through street has priority of pre-emption, and a splint fixed to a wound allows wiping over it in ablution. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3312}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3313} Some joining is obligatory, such as the forehead touching the ground in prostration; some is forbidden, such as two men or two women under one cloth without a barrier. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3312}"
  es: "Iltisaq es la unión de una cosa con otra sin espacio entre ellas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3312} Puede ocurrir espontáneamente o por intención, y conlleva normas: para los hanafíes, un vecino cuya casa colinda con otra en una calle de paso tiene prioridad de preferencia, y una férula fijada a una herida permite limpiarla durante la ablución. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3312}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3313} Algunas uniones son obligatorias, como la frente que toca el suelo en la postración; otras están prohibidas, como dos hombres o dos mujeres bajo una misma tela sin separación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3312}"
  fr: "L'iltisaq désigne la jonction de deux choses sans espace entre elles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3312} Elle peut être spontanée ou intentionnelle et est soumise à des règles: selon l'école hanafite, un voisin dont la maison jouxte une autre maison située sur une rue passante a la priorité, et une attelle fixée sur une plaie permet de s'y essuyer lors des ablutions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3312}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3313} Certaines jonctions sont obligatoires, comme le fait de toucher le sol avec le front lors de la prosternation; d'autres sont interdites, comme le fait que deux hommes ou deux femmes soient sous un même vêtement sans séparation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3312}"
