label: { ar: "التصاق", en: "Iltisaq (adhesion of things, and its rulings)" }
summary:
  ar: "الالتصاق اتصال الشيء بالشيء بحيث لا تكون بينهما فجوة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3312} وقد يحدث تلقائيا أو بقصد، ويترتب عليه أحكام، منها أولوية الشفعة للجار عند الحنفية إذا التصقت الدار بالدار في سكة نافذة، ومسح الجبيرة الملصقة على الجرح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3312}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3313} ومنه ما هو واجب كالتصاق الجبهة بالأرض في السجود، ومنه ما هو محرم كالتصاق الرجلين أو المرأتين في ثوب واحد بلا حائل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3312}"
  en: "Iltisaq is the joining of one thing to another with no gap between them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3312} It may happen by itself or by intent, and it carries rulings: for the Hanafis, a neighbour whose house adjoins a house on a through street has priority of pre-emption, and a splint fixed to a wound allows wiping over it in ablution. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3312}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3313} Some joining is obligatory, such as the forehead touching the ground in prostration; some is forbidden, such as two men or two women under one cloth without a barrier. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3312}"
