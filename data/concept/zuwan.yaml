summary:
  ar: "الزوان اسم يطلقه الناس على شيئين؛ والكلام هنا في الحبّ الذي يشبه الحنطة ويُتّخذ منه الخبز، وأجوده الخفيف الورق غير النخر، وقوّته عند فولس قريبة من قوة الحنطة في الحرّ والبرد، وهو يجفف. وبه يختم الكتاب حرف الزاي."
  en: "Zuwan is a name people apply to two things; the discussion here is of the grain that resembles wheat and is made into bread. Its best kind is light in leaf and not worm-eaten. Its strength, by Paulus, is close to wheat in heat and cold, and it dries. With it the book closes the letter zay, which it counts as twenty-seven drugs."
  ur: "زوان ایک نام ہے جو لوگ دو چیزوں پر بولتے ہیں؛ یہاں گفتگو اس دانے کی ہے جو گندم سے مشابہ ہے اور جس سے روٹی بنتی ہے۔ اس کی بہترین قسم ہلکے پتوں والی اور کیڑوں سے محفوظ ہے۔ فولس کے مطابق اس کی قوت گرمی اور سردی میں گندم کے قریب ہے، اور یہ خشک کرتی ہے۔ اسی پر کتاب حرف زاء ختم کرتی ہے، جسے وہ ستائیس دوا شمار کرتی ہے۔"
  es: "Zuwan es un nombre que se aplica a dos cosas; aquí nos referimos al grano que se asemeja al trigo y con el que se elabora el pan. Su mejor variedad es de hojas ligeras y no está carcomida. Según Paulus, su resistencia al calor y al frío es similar a la del trigo, y se seca fácilmente. Con él, el libro cierra la letra zay, que considera como veintisiete medicamentos."
  fr: "Zuwan est un nom qui désigne deux choses; il est question ici du grain ressemblant au blé et utilisé pour faire du pain. La meilleure variété est à feuilles claires et non véreuses. Selon Paulus, sa résistance à la chaleur et au froid est comparable à celle du blé, et il sèche bien. C’est avec ce nom que le livre conclut la lettre zay, qui recense vingt-sept remèdes."
