label: { ar: "الأيام الوسطى والأيام المختلفة بلياليها", en: "The mean day and the unequal day with its night", ur: "وسطی دن اور رات کے ساتھ غیر مساوی دن", es: "El día medio y el día desigual con su noche.", fr: "Le jour moyen et le jour inégal avec sa nuit", tr: "Öğlen günleri ve geceleriyle birlikte farklı günler", id: "Hari-hari pertengahan dan hari-hari yang berbeda dengan malamnya masing-masing." }
summary:
  ar: "في الباب التاسع والعشرين يقول البتاني إن كثيراً من الناس والعوام يظنون أن الأيام بلياليها متساوية الأزمان، كل يوم بليلته أربع وعشرون ساعة، وليس الأمر كذلك: فاليوم الأوسط بليلته هو طلوع أزمان معدل النهار الثلثمائة والستين كلها من الأفق أو نصف النهار مع زيادة ما يطلع مع تسع وخمسين دقيقة تسيرها الشمس بحركتها الوسطى في اليوم والليلة {cite:zij-sabi-nallino-byblion pp.77-78}."
  en: "In chapter 29 al-Battani says that many people and the common folk think days with their nights are equal in time, each day and night being twenty-four hours, which is not so: the mean day with its night is the rising of all three hundred and sixty times of the equator from the horizon or the meridian with the addition of what rises with the fifty-nine minutes the Sun travels by its mean motion in a day and night {cite:zij-sabi-nallino-byblion pp.77-78}."
  ur: "انتیسویں باب میں البتانی کہتے ہیں کہ بہت سے لوگ اور عوام یہ سمجھتے ہیں کہ دن اپنی راتوں کے ساتھ زمانے میں برابر ہیں، ہر دن رات کے ساتھ چوبیس گھنٹے کا، حالانکہ ایسا نہیں: وسطی دن رات کے ساتھ معدل النہار کے تمام تین سو ساٹھ ازمان کا افق یا نصف النہار سے طلوع ہے اور اس کے ساتھ اس کا بھی جو ان انسٹھ دقیقوں کے ساتھ طلوع ہوتا ہے جو سورج اپنی وسطی حرکت سے دن اور رات میں چلتا ہے {cite:zij-sabi-nallino-byblion pp.77-78}۔"
  es: "En el capítulo 29, al-Battani dice que muchas personas y el pueblo llano piensan que los días y sus noches tienen la misma duración, siendo cada día y noche veinticuatro horas, lo cual no es así: el día medio con su noche es la salida del ecuador trescientas sesenta veces desde el horizonte o el meridiano, más lo que se eleva durante los cincuenta y nueve minutos que el Sol recorre en su movimiento medio en un día y una noche {cite:zij-sabi-nallino-byblion pp.77-78}."
  fr: "Dans le chapitre 29, al-Battani dit que beaucoup de gens et le peuple pensent que les jours et les nuits ont la même durée, chaque jour et chaque nuit durant vingt-quatre heures, ce qui n'est pas le cas: le jour moyen avec sa nuit correspond à la levée de l'équateur trois cent soixante fois depuis l'horizon ou le méridien, plus ce qui se produit pendant les cinquante-neuf minutes que le Soleil parcourt selon son mouvement moyen en un jour et une nuit {cite: zij-sabi-nallino-byblion pp.77-78}."
  tr: "Yirmi dokuzuncu bölümde El-Battani, birçok insanın ve sıradan halkın günlerin ve gecelerin eşit uzunlukta olduğunu, her günün ve gecenin yirmi dört saat olduğunu düşündüğünü, ancak durumun böyle olmadığını söyler: Ortadaki gün ve gece, ufuktan 360 saatlik gün ışığının ortalama doğuş sürelerinin veya öğle vaktine güneşin gün ve gece boyunca ortalama hareketiyle birlikte elli dokuz dakikalık doğuş süresinin eklenmesiyle elde edilen süredir. {cite:zij-sabi-nallino-byblion pp.77-78}"
  id: "Dalam bab ke-29, Al-Battani mengatakan bahwa banyak orang dan masyarakat awam mengira bahwa siang dan malam memiliki panjang yang sama, setiap siang dan malam masing-masing dua puluh empat jam, tetapi ini tidak benar: tengah hari dan tengah malam adalah waktu terbit rata-rata dari tiga ratus enam puluh jam siang hari dari cakrawala, atau tengah hari ditambah dengan waktu terbit selama lima puluh sembilan menit, yang merupakan pergerakan rata-rata matahari di siang dan malam {cite:zij-sabi-nallino-byblion pp.77-78}."
