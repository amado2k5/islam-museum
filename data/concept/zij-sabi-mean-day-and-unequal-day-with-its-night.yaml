id: concept/zij-sabi-mean-day-and-unequal-day-with-its-night
class: concept
kind: scientific
label: { ar: "الأيام الوسطى والأيام المختلفة بلياليها", en: "The mean day and the unequal day with its night", ur: "وسطی دن اور رات کے ساتھ غیر مساوی دن", es: "El día medio y el día desigual con su noche." }
summary:
  ar: "في الباب التاسع والعشرين يقول البتاني إن كثيراً من الناس والعوام يظنون أن الأيام بلياليها متساوية الأزمان، كل يوم بليلته أربع وعشرون ساعة، وليس الأمر كذلك: فاليوم الأوسط بليلته هو طلوع أزمان معدل النهار الثلثمائة والستين كلها من الأفق أو نصف النهار مع زيادة ما يطلع مع تسع وخمسين دقيقة تسيرها الشمس بحركتها الوسطى في اليوم والليلة {cite:zij-sabi-nallino-byblion pp.77-78}."
  en: "In chapter 29 al-Battani says that many people and the common folk think days with their nights are equal in time, each day and night being twenty-four hours, which is not so: the mean day with its night is the rising of all three hundred and sixty times of the equator from the horizon or the meridian with the addition of what rises with the fifty-nine minutes the Sun travels by its mean motion in a day and night {cite:zij-sabi-nallino-byblion pp.77-78}."
  ur: "انتیسویں باب میں البتانی کہتے ہیں کہ بہت سے لوگ اور عوام یہ سمجھتے ہیں کہ دن اپنی راتوں کے ساتھ زمانے میں برابر ہیں، ہر دن رات کے ساتھ چوبیس گھنٹے کا، حالانکہ ایسا نہیں: وسطی دن رات کے ساتھ معدل النہار کے تمام تین سو ساٹھ ازمان کا افق یا نصف النہار سے طلوع ہے اور اس کے ساتھ اس کا بھی جو ان انسٹھ دقیقوں کے ساتھ طلوع ہوتا ہے جو سورج اپنی وسطی حرکت سے دن اور رات میں چلتا ہے {cite:zij-sabi-nallino-byblion pp.77-78}۔"
  es: "En el capítulo 29, al-Battani dice que muchas personas y el pueblo llano piensan que los días y sus noches tienen la misma duración, siendo cada día y noche veinticuatro horas, lo cual no es así: el día medio con su noche es la salida del ecuador trescientas sesenta veces desde el horizonte o el meridiano, más lo que se eleva durante los cincuenta y nueve minutos que el Sol recorre en su movimiento medio en un día y una noche {cite:zij-sabi-nallino-byblion pp.77-78}."
