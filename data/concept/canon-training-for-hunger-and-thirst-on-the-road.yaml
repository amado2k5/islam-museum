id: concept/canon-training-for-hunger-and-thirst-on-the-road
class: concept
kind: scientific
label: { ar: "التمرن على الجوع والعطش في السفر", en: "Training for hunger and thirst on the road in the Canon", ur: "سفر میں بھوک اور پیاس کی مشق قانون میں", es: "Entrenamiento para afrontar el hambre y la sed en el camino en el Canon", fr: "S'entraîner à la faim et à la soif sur la route dans le Canon" }
summary:
  ar: "يوصي ابن سينا المسافر بأن يتدرج في الرياضة ويعتاد السهر والجوع والعطش مسبقاً، ويجعل غذاءه قليل الكم كثير التغذية، ويهجر البقول والفواكه، ثم يذكر أطعمة تعين على الصبر على الجوع، ويصف للعطش بزر البقلة الحمقاء بالخل ويحذر الأغذية المعطشة {cite:canon-ibn-sina-print-v1 pp.261-262}."
  en: "Ibn Sina advises the traveller to proceed by degrees in exercise and to accustom himself beforehand to wakefulness, hunger and thirst, to make his food small in bulk and rich in nourishment, and to avoid vegetables and fruit; he then names foods that help endure hunger, prescribes purslane seed in vinegar for thirst, and warns against thirst-provoking foods {cite:canon-ibn-sina-print-v1 pp.261-262}."
  es: "Ibn Sina aconseja al viajero que proceda gradualmente en el ejercicio y que se acostumbre de antemano a la vigilia, el hambre y la sed, que coma porciones pequeñas y alimentos nutritivos, y que evite las verduras y las frutas; luego nombra alimentos que ayudan a soportar el hambre, prescribe semillas de verdolaga en vinagre para la sed y advierte contra los alimentos que provocan sed {cite:canon-ibn-sina-print-v1 pp.261-262}."
  fr: "Ibn Sina conseille au voyageur de procéder par étapes dans son exercice physique et de s'habituer à l'avance à la veille, à la faim et à la soif, de prendre une nourriture peu volumineuse mais riche en nutriments, et d'éviter les légumes et les fruits; il nomme ensuite des aliments qui aident à supporter la faim, prescrit des graines de pourpier dans du vinaigre pour étancher la soif et met en garde contre les aliments qui provoquent la soif {cite:canon-ibn-sina-print-v1 pp.261-262}."
  ur: "ابن سینا مسافر کو نصیحت کرتا ہے کہ وہ ورزش میں درجات کے مطابق آگے بڑھے اور اپنے آپ کو بیداری، بھوک اور پیاس سے پہلے ہی عادی بنائے، اپنی خوراک کو زیادہ مقدار میں اور غذائیت سے بھرپور بنائے، اور سبزیوں اور پھلوں سے پرہیز کرے۔ اس کے بعد وہ ان کھانوں کا نام دیتا ہے جو بھوک کو برداشت کرنے میں مدد دیتے ہیں، پیاس کے لیے سرکہ میں پرسلین کا بیج تجویز کرتے ہیں، اور پیاس بھڑکانے والی کھانوں کے خلاف تنبیہ کرتے ہیں۔"
