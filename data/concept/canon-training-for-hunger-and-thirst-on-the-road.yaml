label: { ar: "التمرن على الجوع والعطش في السفر", en: "Training for hunger and thirst on the road in the Canon", ur: "سفر میں بھوک اور پیاس کی مشق قانون میں" }
summary:
  ar: "يوصي ابن سينا المسافر بأن يتدرج في الرياضة ويعتاد السهر والجوع والعطش مسبقاً، ويجعل غذاءه قليل الكم كثير التغذية، ويهجر البقول والفواكه، ثم يذكر أطعمة تعين على الصبر على الجوع، ويصف للعطش بزر البقلة الحمقاء بالخل ويحذر الأغذية المعطشة {cite:canon-ibn-sina-print-v1 pp.261-262}."
  en: "Ibn Sina advises the traveller to proceed by degrees in exercise and to accustom himself beforehand to wakefulness, hunger and thirst, to make his food small in bulk and rich in nourishment, and to avoid vegetables and fruit; he then names foods that help endure hunger, prescribes purslane seed in vinegar for thirst, and warns against thirst-provoking foods {cite:canon-ibn-sina-print-v1 pp.261-262}."
