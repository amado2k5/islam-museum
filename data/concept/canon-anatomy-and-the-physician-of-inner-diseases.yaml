id: concept/canon-anatomy-and-the-physician-of-inner-diseases
class: concept
kind: scientific
label:
  ar: "حاجة طبيب الأمراض الباطنة إلى التشريح عند ابن سينا"
  en: "The physician of inner diseases and his need of anatomy in the Canon"
  fr: "Le médecin des maladies internes et son besoin d’anatomie dans le Canon"
  ur: "اندرونی امراض کے طبیب کو تشریح کی حاجت، قانون کے مطابق"
  es: "El médico de enfermedades internas y su necesidad de anatomía en el Canon"
summary:
  ar: "يقرر ابن سينا أن المستدل على الأمراض الباطنة يجب أن يتقدم له علم التشريح، ويعدد ما يعرفه به من جوهر العضو وخلقته وموضعه ومشاركاته وما يحتبس فيه وفعله {cite:canon-ibn-sina-print-v1 p.156}."
  en: "Ibn Sina holds that whoever reads inner diseases must first have anatomy, and lists what it gives him: the substance, make and place of each organ, its sympathies, what can be held in it and its function {cite:canon-ibn-sina-print-v1 p.156}."
  fr: "Ibn Sina juge l’anatomie préalable à l’étude des maladies internes ; elle enseigne substance, structure et emplacement de chaque organe, ses sympathies, son contenu possible et sa fonction {cite:canon-ibn-sina-print-v1 p.156}."
  es: "Ibn Sina sostiene que quien lee sobre enfermedades internas debe primero conocer la anatomía, y enumera lo que esta le proporciona: la sustancia, la forma y el lugar de cada órgano, sus simpatías, lo que puede contener y su función {cite:canon-ibn-sina-print-v1 p.156}."
  ur: "ابن سینا کا خیال ہے کہ جو بھی اندرونی امراض کو پڑھتا ہے اسے پہلے اناٹومی ہونا چاہیے، اور اس کی فہرست بناتا ہے جو اسے دیتا ہے: ہر عضو کا مادہ، بناوٹ اور جگہ، اس کی ہمدردی، اس میں کیا رکھا جا سکتا ہے اور اس کا کام۔"
