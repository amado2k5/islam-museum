id: concept/ilaj-al-mania
class: concept
kind: scientific
label:
  ar: "علاج المانيا"
  en: "Treatment of mania"
  ur: "مانیا کا علاج"
summary:
  ar: "يذكر ابن سينا مبادئ علاج المانيا: الاستفراغ بحسب الخلط الغالب، وأن لا ترتفع البخارات إلى الرأس، وأن يجلس بين يدي العليل من يستحي منه، وأن تكون الأغذية رطبة غير مسددة؛ ولا تُنقل الوصفات ولا طرق الاستعمال {cite:canon-ibn-sina-print-v2 p.102} {cite:canon-ibn-sina-print-v2 p.103}"
  en: "Ibn Sina gives the principles of treating mania: evacuation according to the prevailing humour, that harmful vapours not rise to the head, that someone he is ashamed before sits in front of the patient, and that the foods be moist and not obstructing; recipes and methods of application are not reproduced {cite:canon-ibn-sina-print-v2 p.102} {cite:canon-ibn-sina-print-v2 p.103}"
  ur: "ابن سینا مانیا کے علاج کے اصول بتاتا ہے: غالب خلط کے مطابق استفراغ، بخارات کا سر کی طرف نہ چڑھنا، مریض کے سامنے ایسے شخص کا بیٹھنا جس سے وہ شرمائے، اور یہ کہ غذائیں تر اور رکاوٹ نہ ڈالنے والی ہوں؛ نسخے اور استعمال کے طریقے نقل نہیں کیے گئے {cite:canon-ibn-sina-print-v2 p.102} {cite:canon-ibn-sina-print-v2 p.103}۔"
