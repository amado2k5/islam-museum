    stance:
      ar: "المراد إدريس، لقوله تعالى في مريم «ورفعناه مكاناً علياً»"
    summary:
      ar: "قول بعض العلماء كما يذكره رضا، وهو يرى أن المكان ليس بمعنى الدرجات. وينقل عن بعض المتأخرين أن حمل الآية على النبي من التفسير بالرأي، فيرد عليه رضا بأن تفسير المبهم بالدليل ليس من التفسير بالرأي. {cite:tafsir-manar-v03 p.6}"
