id: concept/tafdil-al-rusul
class: concept
kind: term
label: { ar: "تفضيل بعض الرسل على بعض", en: "Preferring some messengers over others", es: "Preferir a algunos mensajeros sobre otros", fr: "Préférer certains messagers à d'autres" }
issue:
  ar: "من المقصود بقوله تعالى «ورفع بعضهم درجات»، وهل يجوز تفضيل بعض الرسل على بعض؟"
summary:
  ar: "قوله تعالى في البقرة 253: «تلك الرسل فضلنا بعضهم على بعض». يذكر محمد رشيد رضا أن جمهور المفسرين على أن «رفع بعضهم درجات» يعني النبي محمداً، ويرى أن السياق يؤيده، ويذكر من جوّز أن يكون المراد إدريس، ويرد على من عدّ حمل الآية على النبي من التفسير بالرأي."
  en: "The verse in al-Baqara 253 about some messengers being preferred over others. Muhammad Rashid Rida reports that most commentators take the phrase about one raised in rank to mean the Prophet Muhammad, and he holds that the context supports this. He also mentions those who allowed that the reference is to Idris, and he responds to those who regard applying the verse to the Prophet as interpretation by opinion."
  es: "El versículo 253 de al-Baqara habla de la preferencia por algunos mensajeros sobre otros. Muhammad Rashid Rida informa que la mayoría de los comentaristas interpretan la frase sobre aquel elevado de rango como una referencia al profeta Mahoma, y sostiene que el contexto respalda esta interpretación. También menciona a quienes admiten que la referencia es a Idris, y responde a quienes consideran que aplicar el versículo al Profeta es una interpretación subjetiva."
  fr: "Le verset 253 de la sourate Al-Baqara évoque la préférence accordée à certains messagers. Muhammad Rashid Rida rapporte que la plupart des commentateurs interprètent l'expression « celui qui est élevé en rang » comme désignant le Prophète Muhammad, et il estime que le contexte appuie cette interprétation. Il mentionne également ceux qui pensent que le verset fait référence à Idris, et il répond à ceux qui considèrent que l'application de ce verset au Prophète relève de l'interprétation subjective."
