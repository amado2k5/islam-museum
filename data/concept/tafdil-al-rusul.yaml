id: concept/tafdil-al-rusul
class: concept
kind: term
label: { ar: "تفضيل بعض الرسل على بعض", en: "Preferring some messengers over others" }
issue:
  ar: "من المقصود بقوله تعالى «ورفع بعضهم درجات»، وهل يجوز تفضيل بعض الرسل على بعض؟"
summary:
  ar: "قوله تعالى في البقرة 253: «تلك الرسل فضلنا بعضهم على بعض». يذكر محمد رشيد رضا أن جمهور المفسرين على أن «رفع بعضهم درجات» يعني النبي محمداً، ويرى أن السياق يؤيده، ويذكر من جوّز أن يكون المراد إدريس، ويرد على من عدّ حمل الآية على النبي من التفسير بالرأي."
  en: "The verse in al-Baqara 253 about some messengers being preferred over others. Muhammad Rashid Rida reports that most commentators take the phrase about one raised in rank to mean the Prophet Muhammad, and he holds that the context supports this. He also mentions those who allowed that the reference is to Idris, and he responds to those who regard applying the verse to the Prophet as interpretation by opinion."
