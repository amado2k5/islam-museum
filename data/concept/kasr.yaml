id: concept/kasr
class: concept
kind: legal
label:
  ar: "كَسْر"
  en: "Breaking (kasr)"
  ur: "توڑنا (کسر)"
summary:
  ar: "الكسر في اللغة تهشيم الشيء وتفريق أجزائه، وفي الفقه كسر العظم المحقون الدم، وهو محظور. ويجب القود في كسر السن إذا تحققت شروط القصاص وأمن الزيادة، وفي غيره من العظام يختلف الفقهاء، فالحنفية والشافعية والحنابلة لا قود فيه، والمالكية يقتصون في غير المخوف، ولا أرش مقدر في كسر العظم إلا الحكومة، وقد قدر الحنفية والشافعية والحنابلة لكسر بعض العظام أروشاً معينة. وفي كسر آلات اللهو وأواني الخمر خلاف في الضمان. وفي التركة يُصحح الكسر في سهام الورثة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13263} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13264} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13265} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13266}"
  en: "Kasr in the lexicon is shattering a thing and separating its parts; in the law it is breaking a bone of a person whose blood is protected, which is forbidden. Retaliation is owed for breaking a tooth when the conditions of retaliation hold and no further damage is feared. For other bones the schools differ: the Hanafis, Shafi'is and Hanbalis allow no retaliation, while the Malikis allow it where it is not dangerous. There is no fixed compensation for breaking a bone beyond an assessed sum, though these schools set fixed sums for some bones. The schools disagree whether the owner must pay for musical instruments and wine vessels broken by a man who forbids them. In inheritance, a fraction of the shares is adjusted so each heir receives a whole number of shares. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13263} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13264} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13265} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13266}"
  ur: "کسر لغت میں کسی چیز کو توڑنا اور اس کے اجزاء کو الگ کرنا ہے؛ فقہ میں محفوظ الدم شخص کی ہڈی توڑنا ہے، اور یہ حرام ہے۔ دانت توڑنے میں شرائط قصاص پوری ہوں اور مزید نقصان کا خوف نہ ہو تو قصاص واجب ہے۔ دوسری ہڈیوں میں فقہاء کا اختلاف ہے: حنفیہ، شافعیہ اور حنابلہ قصاص کے قائل نہیں، جبکہ مالکیہ غیر خطرناک صورت میں قصاص جاری کرتے ہیں۔ ہڈی توڑنے میں مقرر ارش نہیں بلکہ حکومت (تخمینی تاوان) ہے، اگرچہ بعض ہڈیوں کے لیے مخصوص اونٹوں کی تعداد مقرر کی گئی ہے۔ باجا، شراب کے برتن اور صلیب توڑنے پر ضمان میں اختلاف ہے۔ میراث میں سہام کا کسر ہو تو اصل مسئلہ کو ایسے عدد سے ضرب دے کر صحیح کیا جاتا ہے کہ ہر وارث کو صحیح حصہ ملے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13263} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13264} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13265} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13266}"
