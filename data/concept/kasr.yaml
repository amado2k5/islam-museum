  fr: "Rupture (kasr)"
  tr: "Ara"
  id: "Istirahat"
summary:
  ar: "الكسر في اللغة تهشيم الشيء وتفريق أجزائه، وفي الفقه كسر العظم المحقون الدم، وهو محظور. ويجب القود في كسر السن إذا تحققت شروط القصاص وأمن الزيادة، وفي غيره من العظام يختلف الفقهاء، فالحنفية والشافعية والحنابلة لا قود فيه، والمالكية يقتصون في غير المخوف، ولا أرش مقدر في كسر العظم إلا الحكومة، وقد قدر الحنفية والشافعية والحنابلة لكسر بعض العظام أروشاً معينة. وفي كسر آلات اللهو وأواني الخمر خلاف في الضمان. وفي التركة يُصحح الكسر في سهام الورثة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13263} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13264} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13265} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13266}"
  en: "Kasr in the lexicon is shattering a thing and separating its parts; in the law it is breaking a bone of a person whose blood is protected, which is forbidden. Retaliation is owed for breaking a tooth when the conditions of retaliation hold and no further damage is feared. For other bones the schools differ: the Hanafis, Shafi'is and Hanbalis allow no retaliation, while the Malikis allow it where it is not dangerous. There is no fixed compensation for breaking a bone beyond an assessed sum, though these schools set fixed sums for some bones. The schools disagree whether the owner must pay for musical instruments and wine vessels broken by a man who forbids them. In inheritance, a fraction of the shares is adjusted so each heir receives a whole number of shares. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13263} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13264} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13265} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13266}"
  ur: "کسر لغت میں کسی چیز کو توڑنا اور اس کے اجزاء کو الگ کرنا ہے؛ فقہ میں محفوظ الدم شخص کی ہڈی توڑنا ہے، اور یہ حرام ہے۔ دانت توڑنے میں شرائط قصاص پوری ہوں اور مزید نقصان کا خوف نہ ہو تو قصاص واجب ہے۔ دوسری ہڈیوں میں فقہاء کا اختلاف ہے: حنفیہ، شافعیہ اور حنابلہ قصاص کے قائل نہیں، جبکہ مالکیہ غیر خطرناک صورت میں قصاص جاری کرتے ہیں۔ ہڈی توڑنے میں مقرر ارش نہیں بلکہ حکومت ⁦(تخمینی تاوان)⁩ ہے، اگرچہ بعض ہڈیوں کے لیے مخصوص اونٹوں کی تعداد مقرر کی گئی ہے۔ باجا، شراب کے برتن اور صلیب توڑنے پر ضمان میں اختلاف ہے۔ میراث میں سہام کا کسر ہو تو اصل مسئلہ کو ایسے عدد سے ضرب دے کر صحیح کیا جاتا ہے کہ ہر وارث کو صحیح حصہ ملے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13263} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13264} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13265} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13266}"
  es: "Kasr, en el léxico, significa romper algo y separar sus partes; en la ley, romper un hueso de una persona cuya sangre está protegida, lo cual está prohibido. Se debe represalia por romper un diente cuando se cumplen las condiciones para la represalia y no se teme ningún daño adicional. Para otros huesos, las escuelas difieren: los hanafíes, shafiíes y hanbalíes no permiten represalias, mientras que los malikíes las permiten cuando no son peligrosas. No existe una compensación fija por romper un hueso más allá de una suma determinada, aunque estas escuelas establecen sumas fijas para algunos huesos. Las escuelas discrepan sobre si el propietario debe pagar por los instrumentos musicales y las copas de vino rotos por un hombre que los prohíbe. En la herencia, una fracción de las participaciones se ajusta para que cada heredero reciba un número entero de participaciones. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13263} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13264} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13265} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13266}"
  fr: "Le terme « kasr » désigne, dans le lexique, l'action de briser un objet et d'en séparer les parties; en droit, il s'agit de briser un os d'une personne dont le sang est protégé, ce qui est interdit. Une vengeance est due pour une dent cassée lorsque les conditions de la vengeance sont réunies et qu'aucun autre dommage n'est à craindre. Concernant les autres os, les écoles divergent: les hanafites, les chaféites et les hanbalites interdisent toute vengeance, tandis que les malikites l'autorisent lorsqu'elle n'est pas dangereuse. Il n'existe pas d'indemnisation fixe pour une fracture, hormis une somme forfaitaire, bien que ces écoles fixent des sommes fixes pour certains os. Les écoles divergent également quant à l'obligation pour le propriétaire de payer les instruments de musique et les récipients à vin brisés par une personne qui les interdit. En matière d'héritage, une fraction des parts est ajustée afin que chaque héritier reçoive un nombre entier de parts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13263} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13264} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13265} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13266}"
  tr: "Dilbilimde kasra, bir şeyi kırmak ve parçalarını ayırmak anlamına gelirken, fıkâhta kanla yaralanmış kemiğin kırılması yasaktır. Dişin kırılmasında ceza koşulları ve artış güvenliği sağlandığında kaşıma zorunludur. Diğer kemikler konusunda ise hukukçular farklı görüşe sahiptir. Hanefi, Şafii ve Hanbali mezhebelerinde ağırlaştırılmış durumda başka durumlarda 'qad' (ceza) yoktur. Hükümetin kemik kırma konusunda sabit bir 'arsh' yoktur. Hanefi, Şafii ve Hanbali mezhebeleri bazı kemiklerin kırıldığını belirlemiştir. Eğlence makineleri ve alkollü gereçlerin kırılması konusunda sorumluluk konusunda fark vardır. Mirasta, kasra varislerin paylarında düzeltilir. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.13263} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13264} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13265} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13266}"
  id: "Dalam linguistik, kasra berarti mematahkan sesuatu dan memisahkan bagiannya, sedangkan dalam hukum berarti mematahkan tulang yang terluka dengan darah, yang dilarang. Memimpin wajib dalam mematahkan gigi jika syarat untuk pembalasan dan jaminan peningkatan terpenuhi. Mengenai tulang lain, para ahli hukum berbeda. Sekolah Hanafi, Shafi'i, dan Hanbali tidak memiliki 'qad' (hukuman) dalam kasus selain yang diperparah. Pemerintah tidak memiliki 'arsh' tetap untuk mematahkan tulang. Aliran Hanafi, Shafi'i, dan Hanbali telah menentukan tulang tertentu yang patah. Ada perbedaan mengenai tanggung jawab terkait mesin hiburan dan peralatan alkohol. Dalam warisan, kasra dikoreksi dalam bagian ahli waris. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13263} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13264} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13265} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13266}"
