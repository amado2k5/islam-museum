label:
  ar: "درجات الجنة"
  en: "The Degrees of Paradise"
  ur: "جنت کے درجات"
summary:
  ar: "للجنة درجات يتفاضل فيها أهلها بحسب أعمالهم وإيمانهم، وأعلاها الفردوس التي فوقها عرش الرحمن. قال رسول الله: «أدنى أهل الجنة منزلة من يقول له الله: اذهب فادخل الجنة — فيأتي مثل الدنيا وعشرة أمثالها»، و«إن أدنى أهل الجنة منزلة لمن له عشرة أمثال الدنيا»."
  en: "Paradise has degrees in which its people differ by their works and faith, and the highest is al-Firdaws, above which is the Throne of the Merciful. The Prophet said the lowest of the people of Paradise in station is one given the like of the world and ten times over."
  ur: "جنت کے درجات ہیں جن میں اہل جنت اپنے اعمال اور ایمان کے حساب سے مرتبہ پاتے ہیں، بلند ترین فردوس ہے جس کے اوپر رحمن کا عرش ہے۔ نبی نے فرمایا کہ اہل جنت میں ادنیٰ مرتبہ والے کو دنیا جتنا اور اس سے دس گنا دیا جائے گا۔"
