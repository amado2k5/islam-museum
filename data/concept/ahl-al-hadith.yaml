id: concept/ahl-al-hadith
class: concept
kind: legal
label:
  ar: "أهل الحديث"
  en: "Ahl al-hadith (the traditionists)"
  fr: "Ahl al-hadith (les traditionnistes)"
  es: "Ahl al-hadith (los tradicionalistas)"
  ur: "اہل حدیث"
  tr: "Hadis Halkı"
  id: "Rakyat Hadis"
summary:
  ar: "أهل الحديث، ويسمون أيضًا أصحاب الحديث، هم حركة المحدِّثين في القرن الثاني الهجري، رأوا أن الأحاديث المرفوعة عن النبي تتقدم على «العمل المتوارث» الذي قامت عليه المذاهب الفقهية القديمة، ولو نقلها الواحد، وجعلوا نقد الإسناد منهجهم في العلم {cite:encyclopaedia-of-islam-2 vol. 1 p. 280}."
  en: "Ahl al-hadith, also ashab al-hadith, the partisans of traditions, were the traditionist movement of the second century AH. They held that formal traditions from the Prophet, even those reported by a single transmitter, took precedence over the 'living tradition' of the early legal schools, and they made criticism of the isnad their method {cite:encyclopaedia-of-islam-2 vol. 1 p. 280}."
  fr: "Les ahl al-hadith, aussi appelés ashab al-hadith, les partisans des traditions, formaient le mouvement traditionniste du IIe siècle hégirien. Ils considéraient que les traditions formelles provenant du Prophète, même rapportées par un seul transmetteur, primaient sur la « tradition vivante » des premières écoles juridiques, et firent de la critique de l’isnad leur méthode {cite:encyclopaedia-of-islam-2 vol. 1 p. 280}."
  es: "Ahl al-hadith, también conocidos como ashab al-hadith, los partidarios de las tradiciones, fueron el movimiento tradicionalista del siglo II d. C. Sostenían que las tradiciones formales del Profeta, incluso aquellas transmitidas por un solo transmisor, tenían prioridad sobre la \"tradición viva\" de las primeras escuelas jurídicas, y basaban su método en la crítica del isnad {cite:encyclopaedia-of-islam-2 vol. 1 p. 280}."
  ur: "اہل الحدیث، اصحاب الحدیث بھی، روایات کے حامی، دوسری صدی ہجری کی روایت پسند تحریک تھے۔ ان کا خیال تھا کہ نبی کی رسمی روایات، حتیٰ کہ وہ جو ایک ہی ٹرانسمیٹر کے ذریعہ رپورٹ کی گئی ہیں، ابتدائی قانونی مکاتب کی 'زندہ روایت' پر فوقیت رکھتی ہیں، اور انہوں نے اسناد پر تنقید کو اپنا طریقہ بنایا۔ 1 ص۔ 280}۔"
  tr: "Hadis halkı, diğer adıyla Hadis Halkı, ikinci yüzyılda hadis alimlerinin hareketiydi. Peygamber'e atfedilen hadislerin, eski fıkıh okullarının dayandığı 'miras uygulama'dan önce geldiğine, hatta sadece bir ekim tarafından aktarılmış olsa bile, inanıyorlar ve aktarım zincirinin eleştirisini bilimde metodolojileri haline getirmişlerdir {atıf:İslam Ansiklopedisi-2 cilt 1, s. 280}."
  id: "Komunitas Hadis, yang juga dikenal sebagai Komunitas Hadis, adalah gerakan para ulama hadis pada abad kedua. Mereka percaya bahwa hadis yang dikaitkan dengan Nabi sudah ada sebelum 'praktik warisan' yang menjadi dasar sekolah yurisprudensi kuno, meskipun hanya diwariskan pada satu Oktober, dan mereka telah mengkritik rantai transmisi sebagai metodologi mereka dalam ilmu pengetahuan {sitasi: Ensiklopedia Islam-2, volume 1, hlm. 280}."
