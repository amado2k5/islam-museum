label:
  ar: "أهل الحديث"
  en: "Ahl al-hadith (the traditionists)"
summary:
  ar: "أهل الحديث، ويسمون أيضًا أصحاب الحديث، هم حركة المحدِّثين في القرن الثاني الهجري، رأوا أن الأحاديث المرفوعة عن النبي تتقدم على «العمل المتوارث» الذي قامت عليه المذاهب الفقهية القديمة، ولو نقلها الواحد، وجعلوا نقد الإسناد منهجهم في العلم {cite:encyclopaedia-of-islam-2 vol. 1 p. 280}."
  en: "Ahl al-hadith, also ashab al-hadith, the partisans of traditions, were the traditionist movement of the second century AH. They held that formal traditions from the Prophet, even those reported by a single transmitter, took precedence over the 'living tradition' of the early legal schools, and they made criticism of the isnad their method {cite:encyclopaedia-of-islam-2 vol. 1 p. 280}."
