summary:
  ar: "الراوند في الكتاب يزعم قوم أنه أصول بهمن في الصين، ويغش فيباع بعد طبخه، والخالص أقل قبضا زعفراني الممضغ، ويذكر الكتاب تركيب جوهره، وينفع من الكلف ومن القوباء وللأورام الحارة وللسقطة والضربة وللفسخ والفتق، وللربو ونفث الدم، وللكبد والمعدة والفواق، وللذرب والمغص والدوسنطاريا وللمثانة ونزف الدم وللحميات المزمنة وذوات الأدوار ولنهش الهوام، ويذكر وجع الرحم نقلا موسوما {cite:canon-ibn-sina-print-v1 pp.663-664}"
  en: "Rawand is in the book said by some to be the roots of bahman in China, adulterated and sold after boiling, the pure being less astringent and saffron-coloured when chewed; the book explains the make-up of its substance; it benefits melasma and ringworm, hot swellings, fall and blow, sprain and hernia, asthma and spitting of blood, the liver, the stomach and hiccup, diarrhoea, colic and dysentery, the bladder and loss of blood, chronic and periodic fevers and the bites of vermin, and lists pain of the womb as a labelled report {cite:canon-ibn-sina-print-v1 pp.663-664}"
  ur: "راوند کتاب میں، بعض لوگوں کے دعوے کے مطابق، چین میں بہمن کی جڑیں ہیں، اس میں ملاوٹ کی جاتی ہے اور جوشاندہ نکالنے کے بعد بیچا جاتا ہے، خالص کم قابض ہے اور چبانے پر زعفرانی رنگ کا؛ کتاب اس کے جوہر کی ترکیب بتاتی ہے؛ داغ اور چھائیوں، دانوں، گرم ورموں، گرنے اور چوٹ، موچ اور فتق، دمے اور خون تھوکنے، جگر، معدے اور ہچکی، اسہال، قولنج اور پیچش، مثانے اور خون کے بہاؤ، پرانے اور دوری بخاروں اور زہریلے جانوروں کے کاٹنے میں نافع ہے، اور رحم کے درد کو منقول فہرست کے طور پر درج کرتی ہے {cite:canon-ibn-sina-print-v1 pp.663-664}۔"
  es: "En el libro, algunos afirman que Rawand es la raíz del bahman en China, adulterada y vendida después de hervirla; la versión pura es menos astringente y de color azafrán al masticarla. El libro explica la composición de su sustancia; se dice que es beneficiosa para el melasma y la tiña, las hinchazones, las caídas y los golpes, los esguinces y las hernias, el asma y la hemorragia, el hígado, el estómago y el hipo, la diarrea, los cólicos y la disentería, la vejiga y la pérdida de sangre, las fiebres crónicas y periódicas y las picaduras de parásitos, y enumera el dolor uterino como un informe específico {cite:canon-ibn-sina-print-v1 pp.663-664}."
