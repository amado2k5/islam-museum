  id: "Sembilan kata ilmiah Eropa yang berasal dari Arab: aljabar, algoritma, alkimia, alkohol, zenit, rare, azimuth, syrup, dan elixir; masing-masing berasal dari bahasa Arab, seperti yang ditunjukkan dalam abstrak penelitian yang dikirim ke museum {cite:etymonline-zenith} {cite:merriam-webster-elixir}."
