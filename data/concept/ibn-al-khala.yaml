label: { ar: "ابن الخالة", en: "Maternal aunt's son", es: "hijo de la tía materna", fr: "Le fils de la tante maternelle" }
summary:
  ar: "تعرّف الموسوعة الفقهية الكويتية ابن الخالة نسباً بأنه الولد الذكر النسبي لأخت الأم من النسب، ورضاعاً بأنه من حلّت فيه علاقة الرضاع محل علاقة النسب. ويلاحظ أن لفظ «ولد» يشمل الذكر والأنثى، ولفظ «ابن» لا يتناول إلا الذكر. واتفق الفقهاء على أنه من أولي الأرحام غير المحارم، فيسري عليه ما يسري عليهم من وجوب الصلة وجواز التناكح ومنع الخلوة بهم، وعدم وجوب النفقة عليه إن لم يكن وارثاً. واتفقوا على أنه من ذوي الأرحام لهم أحكام خاصة في الميراث وإمامة صلاة الجنازة والولاية، وذكر الفقهاء ذلك في النكاح عند اشتراط الولي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1462} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1463}"
  en: "The Kuwaiti encyclopedia defines a maternal aunt's son by blood as the male blood child of a blood sister of the mother; by fostering, he is one in whom the foster tie takes the place of the blood tie. The word child covers male and female; the word son covers only the male. The jurists agree that he is among those with blood-ties through a female who are not mahrams: the duty of kinship, permission to marry, the prohibition of being alone with them, and no duty of maintenance unless he is an heir apply to him. They agree that he is among those with blood-ties through a female, with special rules in inheritance, leading the funeral prayer and guardianship; the jurists treat this in marriage when they require a guardian. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1462} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1463}"
  es: "La enciclopedia kuwaití define al hijo de sangre de una tía materna como el hijo varón de sangre de una hermana de sangre de la madre; por crianza, es aquel en quien el vínculo de crianza reemplaza al vínculo de sangre. La palabra \"niño\" abarca tanto a varones como a mujeres; la palabra \"hijo\" abarca solo a los varones. Los juristas coinciden en que se encuentra entre aquellos con vínculos de sangre a través de una mujer que no son mahrams: se le aplican el deber de parentesco, el permiso para contraer matrimonio, la prohibición de estar a solas con ellos y la ausencia de deber de manutención a menos que sea heredero. Coinciden en que se encuentra entre aquellos con vínculos de sangre a través de una mujer, con reglas especiales en materia de herencia, dirección de la oración fúnebre y tutela; los juristas tratan esto en el matrimonio cuando requieren un tutor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1462} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1463}"
  fr: "L'encyclopédie koweïtienne définit le fils d'une tante maternelle par le sang comme l'enfant mâle issu d'une sœur de sang de la mère; par adoption, il s'agit d'un enfant pour lequel le lien d'adoption se substitue au lien de sang. Le terme « enfant » englobe les deux sexes; le terme « fils » ne désigne que le sexe masculin. Les juristes s'accordent à dire qu'il fait partie de ceux qui ont des liens de sang par une femme qui n'est pas un mahram: les devoirs de parenté, l'autorisation de se marier, l'interdiction de se retrouver seul avec elles et l'absence d'obligation alimentaire, sauf s'il est héritier, lui sont applicables. Ils s'accordent également à dire qu'il fait partie de ceux qui ont des liens de sang par une femme, avec des règles particulières en matière d'héritage, de direction de la prière funéraire et de tutelle; les juristes abordent cette question dans le cadre du mariage lorsqu'un tuteur est requis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1462} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1463}"
