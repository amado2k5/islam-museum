id: concept/ibn-al-khala
class: concept
kind: legal
label: { ar: "ابن الخالة", en: "Maternal aunt's son" }
summary:
  ar: "تعرّف الموسوعة الفقهية الكويتية ابن الخالة نسباً بأنه الولد الذكر النسبي لأخت الأم من النسب، ورضاعاً بأنه من حلّت فيه علاقة الرضاع محل علاقة النسب. ويلاحظ أن لفظ «ولد» يشمل الذكر والأنثى، ولفظ «ابن» لا يتناول إلا الذكر. واتفق الفقهاء على أنه من أولي الأرحام غير المحارم، فيسري عليه ما يسري عليهم من وجوب الصلة وجواز التناكح ومنع الخلوة بهم، وعدم وجوب النفقة عليه إن لم يكن وارثاً. واتفقوا على أنه من ذوي الأرحام لهم أحكام خاصة في الميراث وإمامة صلاة الجنازة والولاية، وذكر الفقهاء ذلك في النكاح عند اشتراط الولي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1462} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1463}"
  en: "The Kuwaiti encyclopedia defines a maternal aunt's son by blood as the male blood child of a blood sister of the mother; by fostering, he is one in whom the foster tie takes the place of the blood tie. The word child covers male and female; the word son covers only the male. The jurists agree that he is among those with blood-ties through a female who are not mahrams: the duty of kinship, permission to marry, the prohibition of being alone with them, and no duty of maintenance unless he is an heir apply to him. They agree that he is among those with blood-ties through a female, with special rules in inheritance, leading the funeral prayer and guardianship; the jurists treat this in marriage when they require a guardian. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1462} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1463}"
