summary:
  ar: "الورل من أعظم أشكال الوزغ، لحمه حار جداً، فيه قوة جذب للسلاء والشوك، وزبله ينفع من الكلف والنمش ويقلع الثآليل، ويقال إنه ينفع من بياض العين. {cite:canon-ibn-sina-print-v1 p.455}"
  en: "Warl is one of the largest geckos, very hot in its flesh. It draws out splinters and thorns, its dung helps kalaf and namash and pulls out warts, and it is said to help whiteness of the eye. {cite:canon-ibn-sina-print-v1 p.455}"
  ur: "ورل بڑی چھپکلیوں میں سے ہے، اس کا گوشت بہت گرم ہے۔ یہ کانٹے اور پھانسیں کھینچتا ہے، اس کی مینگنی کلف اور نمش میں مفید ہے اور مسّے ہٹاتی ہے، اور کہا جاتا ہے کہ آنکھ کی سفیدی میں مفید ہے۔ {cite:canon-ibn-sina-print-v1 p.455}"
