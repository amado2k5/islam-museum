id: concept/hamm-fiqh
class: concept
kind: legal
label: { ar: "هَمّ", en: "Hamm (resolve or intention of the heart, and its legal effect)" }
summary:
  ar: "الهم في الاصطلاح عقد القلب على فعل شيء قبل أن يُفعل من خير أو شر، وهو أقوى من مجرد الخطور بالقلب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16554} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16562} وذهب جمهور العلماء إلى أن من همّ بحسنة ولم يعملها كُتبت له حسنة كاملة، ومن همّ بسيئة ولم يعملها كُتبت له حسنة إذا تركها لأجل الله، واختلف الفقهاء في ثواب من تركها لغير خشية الله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16556} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16557} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16558} وقال القاضي الباقلاني وغيره إن الهم المقصود الذي لا يُكتب هو الخاطر المار بلا استقرار، أما العزم المصمم فيؤاخذ عليه، واختلفوا في المؤاخذة بالعزم في أعمال الجوارح: فذهب كثير من العلماء إلى المؤاخذة به، وقال آخرون إنه عقاب بالعتاب لا بالعذاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16558} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16559} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16560} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16561} ويُؤاخذ من همّ بالمعصية في الحرم عند جماعة من الفقهاء، ويرى آخرون العفو عن الهم عاماً في الحرم وغيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16561} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16562} ومن همّ بالكفر أو عزم على الكفر في المستقبل فقد كفر في الحال عند النووي وغيره، أما الوسوسة التي تمر بالقلب دون استقرار فلا تؤثر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16562}"
  en: "Hamm in the legal sense is the resolve of the heart to do something, good or bad, before doing it; it is stronger than a passing thought. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16554} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16562} Most scholars hold that one who resolves on a good deed and does not do it has a full good deed recorded, and one who resolves on an evil deed and leaves it has a good deed recorded if he left it for God's sake; the jurists differ on the reward of one who left it for another reason. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16556} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16557} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16558} Al-Baqillani and others hold that the resolve that is not recorded is the passing thought without settled purpose, while a firm resolve is held against the person; they differ on whether a firm resolve to commit an act of the limbs is punished, some holding that it is punished by reproach rather than by torment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16558} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16559} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16560} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16561} Some jurists hold one who resolves on sin within the Sacred Precinct is held to account, while others hold the pardon for resolve general in and outside the Precinct. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16561} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16562} Resolving on unbelief, or firmly intending it for the future, is held by al-Nawawi and others to be unbelief at once, but a passing whisper does not count. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16562}"
