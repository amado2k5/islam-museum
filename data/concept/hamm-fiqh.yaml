class: concept
kind: legal
label: { ar: "هَمّ", en: "Hamm (resolve or intention of the heart, and its legal effect)", es: "Hamm (resolución o intención del corazón, y su efecto legal)", fr: "Hamm (résolution ou intention du cœur, et son effet juridique)", ur: "ہیم ⁦(دل کا حل یا ارادہ، اور اس کا قانونی اثر)⁩", tr: "onlar", id: "mereka" }
summary:
  ar: "الهم في الاصطلاح عقد القلب على فعل شيء قبل أن يُفعل من خير أو شر، وهو أقوى من مجرد الخطور بالقلب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16554} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16562} وذهب جمهور العلماء إلى أن من همّ بحسنة ولم يعملها كُتبت له حسنة كاملة، ومن همّ بسيئة ولم يعملها كُتبت له حسنة إذا تركها لأجل الله، واختلف الفقهاء في ثواب من تركها لغير خشية الله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16556} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16557} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16558} وقال القاضي الباقلاني وغيره إن الهم المقصود الذي لا يُكتب هو الخاطر المار بلا استقرار، أما العزم المصمم فيؤاخذ عليه، واختلفوا في المؤاخذة بالعزم في أعمال الجوارح: فذهب كثير من العلماء إلى المؤاخذة به، وقال آخرون إنه عقاب بالعتاب لا بالعذاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16558} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16559} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16560} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16561} ويُؤاخذ من همّ بالمعصية في الحرم عند جماعة من الفقهاء، ويرى آخرون العفو عن الهم عاماً في الحرم وغيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16561} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16562} ومن همّ بالكفر أو عزم على الكفر في المستقبل فقد كفر في الحال عند النووي وغيره، أما الوسوسة التي تمر بالقلب دون استقرار فلا تؤثر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16562}"
  en: "Hamm in the legal sense is the resolve of the heart to do something, good or bad, before doing it; it is stronger than a passing thought. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16554} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16562} Most scholars hold that one who resolves on a good deed and does not do it has a full good deed recorded, and one who resolves on an evil deed and leaves it has a good deed recorded if he left it for God's sake; the jurists differ on the reward of one who left it for another reason. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16556} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16557} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16558} Al-Baqillani and others hold that the resolve that is not recorded is the passing thought without settled purpose, while a firm resolve is held against the person; they differ on whether a firm resolve to commit an act of the limbs is punished, some holding that it is punished by reproach rather than by torment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16558} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16559} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16560} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16561} Some jurists hold one who resolves on sin within the Sacred Precinct is held to account, while others hold the pardon for resolve general in and outside the Precinct. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16561} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16562} Resolving on unbelief, or firmly intending it for the future, is held by al-Nawawi and others to be unbelief at once, but a passing whisper does not count. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16562}"
  es: "Hamm en el sentido legal es la resolución del corazón de hacer algo, bueno o malo, antes de hacerlo; es más fuerte que un pensamiento pasajero. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16554} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16562} La mayoría de los eruditos sostienen que quien se propone hacer una buena acción y no la realiza tiene registrada una buena acción completa, y quien se propone hacer una mala acción y la abandona tiene registrada una buena acción si la abandonó por amor a Dios; los juristas difieren en cuanto a la recompensa de quien la abandonó por otra razón. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16556} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16557} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16558} Al-Baqillani y otros sostienen que la resolución que no se registra es el pensamiento pasajero sin un propósito establecido, mientras que una resolución firme se mantiene en contra de la persona; difieren en si una resolución firme de cometer un acto de los miembros es castigada, algunos sostienen que es castigada con reproche en lugar de con tormento. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16558} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16559} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16560} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16561} Algunos juristas sostienen que quien decide pecar dentro del Recinto Sagrado es responsable, mientras que otros sostienen que el perdón por la decisión es general dentro y fuera del Recinto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16561} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16562} Al-Nawawi y otros consideran que decidirse por la incredulidad, o tener la firme intención de adoptarla en el futuro, constituye incredulidad inmediata, pero un simple susurro no cuenta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16562}"
  fr: "En droit juridique, le hamm désigne la résolution du cœur à accomplir un acte, bon ou mauvais, avant même de le passer à l'acte; cette résolution est plus forte qu'une simple pensée passagère. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16554} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16562} La plupart des savants estiment que celui qui prend la résolution d'accomplir une bonne action et ne la réalise pas voit une bonne action inscrite dans son acte, et que celui qui prend la résolution d'accomplir une mauvaise action et s'en abstient voit une bonne action inscrite dans son acte s'il s'en abstient par amour pour Dieu; les juristes divergent quant à la récompense de celui qui s'en abstient pour une autre raison. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16556} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16557} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16558} Al-Baqillani et d'autres soutiennent que la résolution non consignée est une pensée passagère sans but précis, tandis qu'une résolution ferme est retenue contre la personne; ils divergent quant à savoir si une résolution ferme de commettre un acte des membres est punie, certains estimant qu'elle est punie par le reproche plutôt que par le tourment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16558} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16559} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16560} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16561} Certains juristes estiment que celui qui prend une résolution pour pécher à l'intérieur de l'enceinte sacrée doit en répondre, tandis que d'autres estiment que le pardon pour une résolution générale est accordé à l'intérieur et à l'extérieur de l'enceinte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16561} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16562} Selon al-Nawawi et d'autres, la résolution de l'incroyance, ou la ferme intention de l'adopter à l'avenir, constitue une incroyance immédiate; en revanche, une simple pensée passagère n'est pas considérée comme telle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16562}"
  ur: "قانونی معنوں میں ہیم کسی کام کو کرنے سے پہلے، اچھا یا برا کرنے کا دل کا عزم ہے۔ یہ گزرنے والی سوچ سے زیادہ مضبوط ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16554} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16562} اکثر علماء کا خیال ہے کہ جس نے نیکی کا ارادہ کیا اور اسے نہ کیا اس کے پاس پوری نیکی درج ہے اور جس نے برائی کو چھوڑ دیا تو اس نے برائی کو چھوڑ دیا۔ خدا کے لیے؛ فقہاء کا اس کے اجر میں اختلاف ہے جس نے اسے کسی اور وجہ سے چھوڑ دیا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16556} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16557} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16558} البقرہ کے بغیر تصنیف ہے کہ دوسرے کے پاس تصنیف نہیں ہے اور اس کے بغیر یہ تصوّر نہیں ہے طے شدہ مقصد، جب کہ اس شخص کے خلاف پختہ عزم کیا جاتا ہے۔ ان میں اس بات پر اختلاف ہے کہ آیا اعضاء کے کسی فعل کے ارتکاب کے پختہ عزم کی سزا دی جاتی ہے، بعض کا خیال ہے کہ اس کی سزا عذاب کے بجائے ملامت سے دی جاتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16558} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16559} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 16560} p.16561} بعض فقہاء کے نزدیک حرمین شریفین کے اندر گناہ کا فیصلہ کرنے والے کا محاسبہ کیا جاتا ہے، جب کہ دوسرے حلقہ کے اندر اور باہر عام حل کے لیے معافی کا حق رکھتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 صفحہ 16561} {حوالہ: فقہ الموسوعہ-کویتیہ-نور-v3 صفحہ 16562} کفر پر عزم کرنا، یا مستقبل کے لیے پختہ ارادہ کرنا، النووی اور دوسروں کے نزدیک کفر شمار ہوتا ہے، لیکن ایک دفعہ کافر نہیں ہوتا۔ {حوالہ: فقہ موسوعۃ کویتیہ نور v3 صفحہ 16562}"
  tr: "Terminolojide, ilham, kalbin iyi ya da kötü bir şey yapmadan önce yapma bağıdır ve sadece kalpteki bir korkudan daha güçlüdür. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16554} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16562} Çoğu bilgin, iyi bir iş yapıp yapmayan kişinin tam iyi bir iş olarak kaydedildiğini, kötü bir iş yapıp yapmayan ise Allah uğruna onu terk ederse iyi bir iş olarak kaydedildiğini savunur. Hukukçular, Allah'tan korkmadan terk edenin ödülü konusunda farklı görüşlere sahiptir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16556} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16557} {kaynak:fiqh-mawsua-kuwaitiyya-noor-v3 s.16558} Qadi al-Baqillani ve diğerleri, yazılı olmayan amaçlanan endişenin istikrarsız geçen zihin olduğunu, kararlı kararlılığın ise hesap verebilir kıldığını söylediler. Uzuvların eylemlerindeki kararlılık eleştirisi konusunda anlaşmazlıklar vardır: birçok âlim bunu sorumlu tutarken, diğerleri bunun işkenceyle değil, azarla cezalandırılan bir ceza olduğunu söylemiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16558} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16559} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16560} {atıf:fiqh-mawsua-kuveytiyya-noor-v3 s.16561} Bazı hukukçular Haram'da günah işleyenleri sorumlu tutarken, diğerleri günahı affetmeyi Haram'da ve başka yerlerde genel olarak kabul eder. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.16561} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16562} Ve geleceğe inanmayan ya da inanmamaya kararlı olan herkes, al-Nawawi ve diğerlerine göre hemen inan etmiş olur. Kalpten istikrarsız geçen fısıltılar ise hiçbir etkisi yoktur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16562}"
  id: "Dalam istilah tertentu, inspirasi adalah ikatan hati untuk melakukan sesuatu sebelum dilakukan untuk kebaikan atau kejahatan, dan lebih kuat daripada sekadar ketakutan di hati. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16554} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16562} Sebagian besar ulama berpendapat bahwa siapa pun yang berbuat baik dan tidak melakukannya dicatat sebagai perbuatan baik sepenuhnya, dan siapa pun yang melakukan perbuatan buruk namun tidak melakukannya, perbuatan baik akan dicatat untuknya jika ia meninggalkannya demi Allah. Para ahli hukum berbeda pendapat mengenai ganjaran bagi seseorang yang meninggalkannya tanpa takut kepada Allah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16556} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16557} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16558} Qadi al-Baqillani dan lainnya mengatakan bahwa kekhawatiran yang tidak tertulis adalah pikiran yang berlalu tanpa stabilitas, sedangkan tekad yang teguh harus dipertanggungjawabkan. Ada perbedaan pendapat mengenai celaan tekad dalam tindakan anggota tubuh: banyak ulama menuntut pertanggungjawaban, sementara yang lain mengatakan itu adalah hukuman dengan celaan, bukan dengan siksaan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16558} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16559} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16560} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16561} Beberapa ahli hukum menuntut pertanggungjawaban mereka yang berdosa dalam Haram, sementara yang lain menganggap pengampunan dosa sebagai hal umum di Haram dan tempat lain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16561} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16562} Dan siapa pun yang berniat tidak percaya atau bertekad untuk tidak percaya di masa depan telah langsung berbuat kafir menurut al-Nawawi dan lainnya. Adapun bisikan yang mengalir di hati tanpa kestabilan, itu tidak berpengaruh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16562}"
