label: { ar: "الإنماء", en: "Inma (the growth of property by trade, husbandry or increase, and its rulings; also the game that goes out of sight)", es: "Inma (el crecimiento de la propiedad mediante el comercio, la ganadería o el incremento, y sus normas; también el juego que se pierde de vista)", fr: "Inma (la croissance de la propriété par le commerce, l'agriculture ou l'accroissement, et ses règles; également le gibier qui disparaît de la vue)", ur: "انما ⁦(تجارت، کھیتی باڑی یا اضافے سے جائیداد کا بڑھنا اور اس کے احکام؛ وہ کھیل بھی جو نظروں سے اوجھل ہو جائے)⁩", tr: "Gelişim", id: "Pengembangan" }
summary:
  ar: "الإنماء لغة مصدر أنمى، وهو فعل ما به يزيد الشيء ويكثر، والنماء الزيادة، وينقسم إلى حقيقي كالتوالد والتجارة، وتقديري كالتمكن من الزيادة بكون المال في اليد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3559} والإنماء أخص من الزيادة لأن الزيادة قد تكون من خارج، أما الإنماء فنابع من الشيء نفسه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3560} وتنمية المال مشروعة، أباحتها الشريعة بالبيع والتجارة والشركات والقراض، وحفظ المال مقصد من مقاصدها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3561}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3562} ويختلف حكمه بحسب النية، فيفرض لتحصيل الكفاية، ويستحب الزائد للمواساة، ويباح للتجمل، ويكره للتفاخر والتكاثر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3562}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3563} ويجوز لمن يملك التصرف دون الرقبة، كالولي والوصي والوكيل والقاضي والناظر، أن ينمي ما يلي بالإذن الشرعي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3563}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3564} ويحرم الإنماء بغير المشروع كالربا والقمار والتجارة بالخمر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3565} وأما إنماء الصيد بمعنى غيبته بعد رميه فيُنظر فيه إلى ما تقدم من قول ابن عباس وخلاف الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3565}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3566}"
  en: "Inma is lexically the causing of an increase, and growth is an increase, either real, as by birth or trade, or assumed, as by property remaining in one's hand. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3559} It is narrower than ziyada, since ziyada may come from outside while inma comes from the thing itself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3560} Growing property is lawful: the law allowed sale, trade, partnership and mudaraba, and the preservation of property is one of its purposes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3561}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3562} Its ruling depends on the intention: it is obligatory to gain enough for oneself and dependants, recommended beyond that to help the poor, permitted for comfort, and disliked for boasting and rivalry. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3562}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3563} One who has control of property without owning it, such as a guardian, executor, agent, judge or supervisor, may grow it by lawful authority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3563}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3564} Growth by what is unlawful, such as usury, gambling or trade in wine, is forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3565} The other sense, the going out of sight of game after it is shot, is treated in the entry on hunting, with the disputed view of Ibn Abbas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3565}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3566}"
  es: "Inma es léxicamente la causa de un aumento, y crecimiento es un aumento, ya sea real, como por nacimiento o comercio, o supuesto, como por propiedad que permanece en la mano de uno. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3559} Es más restringido que ziyada, ya que ziyada puede venir de fuera mientras que inma viene de la cosa misma. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3560} El crecimiento de la propiedad es lícito: la ley permitía la venta, el comercio, la sociedad y la mudaraba, y la preservación de la propiedad es uno de sus propósitos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3561}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3562} Su dictamen depende de la intención: es obligatorio obtener lo suficiente para uno mismo y sus dependientes, se recomienda más allá de eso para ayudar a los pobres, está permitido para comodidad y es desaconsejable para jactarse y rivalidad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3562}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3563} Quien tiene control de la propiedad sin poseerla, como un tutor, albacea, agente, juez o supervisor, puede aumentarla mediante autoridad legal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3563}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3564} El crecimiento mediante actividades ilícitas, como la usura, el juego o el comercio de vino, está prohibido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3565} El otro sentido, el de perder de vista la presa después de abatirla, se trata en la entrada sobre la caza, con la controvertida opinión de Ibn Abbas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3565}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3566}"
  fr: "Le terme « inma » désigne le fait de provoquer un accroissement, et la croissance est un accroissement, qu'il soit réel (par exemple, par naissance ou commerce) ou supposé (par exemple, par possession de biens). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3559} Son sens est plus restreint que celui de « ziyada », car la ziyada peut provenir de l'extérieur, tandis que l'inma est inhérente à la chose elle-même. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3560} L'accroissement des biens est licite: la loi autorise la vente, le commerce, le partenariat et la mudaraba, et la préservation des biens est l'un de ses objectifs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3561}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3562} Son statut dépend de l'intention: il est obligatoire d'acquérir suffisamment pour soi-même et les personnes à sa charge, recommandé au-delà pour aider les pauvres, permis pour le confort, et déconseillé par vantardise et rivalité. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3562}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3563} Celui qui a la gestion d'un bien sans en être propriétaire, comme un tuteur, un exécuteur testamentaire, un mandataire, un juge ou un superviseur, peut le faire fructifier par une autorité légitime. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3563}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3564} La croissance par des moyens illicites, tels que l'usure, les jeux de hasard ou le commerce du vin, est interdite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3565} L'autre sens, à savoir le fait de s'éloigner du gibier après l'avoir abattu, est traité dans l'article consacré à la chasse, selon l'opinion controversée d'Ibn Abbas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3565}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3566}"
  ur: "انما لغوی طور پر اضافے کا سبب ہے، اور ترقی ایک اضافہ ہے، یا تو حقیقی، جیسا کہ پیدائش یا تجارت، یا فرض کیا جاتا ہے، جیسا کہ کسی کے ہاتھ میں جائیداد باقی ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 3559} یہ زیاد سے زیادہ تنگ ہے کیونکہ زیاد باہر سے آ سکتا ہے جبکہ انما خود چیز سے آتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3560} بڑھنا جائیداد حلال ہے: قانون نے فروخت، تجارت، شراکت اور مضاربہ کی اجازت دی ہے، اور جائیداد کی حفاظت اس کے مقاصد میں سے ایک ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3561}{cite:fiqh-Mawsua-kuwaityya-noor-v3 p.3562} اس کا حکم نیت پر منحصر ہے: اپنے اور محتاجوں کے لیے کافی حاصل کرنا واجب ہے، اس سے بڑھ کر مستحب، مستحب اور غریبوں کے لیے راحت کے لیے مستحب ہے۔ دشمنی {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.3562}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3563} وہ شخص جس کے پاس ملکیت کے بغیر جائیداد کا کنٹرول ہو، جیسے کہ سرپرست، عمل کرنے والا، ایجنٹ، جج یا نگران، اسے حلال اختیار کے ذریعے بڑھا سکتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3563}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3564} حرام چیزوں سے بڑھنا جیسے سود، جوا یا شراب کی تجارت حرام ہے۔ {حوالہ:فقہ الموسوعۃ-کویتیہ-نور-v3 صفحہ 3565} دوسرا معنی، گولی لگنے کے بعد کھیل کے نظروں سے اوجھل ہو جانا، ابن عباس کے اختلافی نظریہ کے ساتھ شکار کے داخلے میں سمجھا جاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3565}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3566}"
  tr: "Dilsel olarak, 'inma' artan ve artan bir şeyin fiilidir. Büyüme artıştır ve gerçek 'tawwalad' ve 'ticaret' olarak ikiye ayrılır. Benim tahminim, para elindeyken artabilme yeteneğine benzer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3559} Ve 'inma' artıştan daha özeldir çünkü artış dışarıdan gelebilir, oysa 'inma' aynı şeyden türemiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3560} Servetin gelişimi meşrudur, Şeriat tarafından satış, ticaret, ortaklıklar ve ödünç yoluyla izin verilir ve servetin korunması amaçlarından biridir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3561} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3562} Hükmü niyetine göre değişir; yeterlilik sağlamak için önerilir, fazlalık rahatlık için önerilir, güzelleştirme için uygundur ve övünme ve çoğaltma için sevilmez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3562} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3563} Köle üzerinde kontrolü olan birinin — vasi, vasi, vasi, temsilci, yargıç ve gözetmen — yasal izinle aşağıdakileri geliştirmesi de mümkündür. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3563} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3564} ve tefecilik, kumar ve alkol ticareti gibi yasadışı yetiştirmeyi yasaklar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3565} Avcılığın gelişimi, atıldıktan sonra yokluğu anlamında, İbn Abbas'ın önceki görüşü ve hukukçular arasındaki anlaşmazlıklara dayanarak değerlendirilmektedir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3565} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3566}"
  id: "Secara linguistik, 'inma' adalah kata kerja dari sesuatu yang terus bertambah. Pertumbuhan adalah pertumbuhan, dan dibagi menjadi real sebagai 'tawwalad' dan 'perdagangan.' Perkiraan saya seperti kemampuan untuk bertambah ketika uang ada di tangan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3559} Dan 'inma' lebih spesifik daripada peningkatan karena peningkatan bisa datang dari luar, sedangkan 'inma' berasal dari hal yang sama. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3560} Perkembangan kekayaan adalah sah, diizinkan oleh Syariah melalui penjualan, perdagangan, kemitraan, dan pemberian pinjaman, dan menjaga kekayaan adalah salah satu tujuannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3561} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3562} Keputusannya bervariasi sesuai dengan niat; ditetapkan untuk mencapai kecukupan, kelebihan disarankan untuk kenyamanan, diperbolehkan untuk memperindah, dan tidak disukai karena membanggakan dan melimpah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3562} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3563} Juga diperbolehkan bagi seseorang yang memiliki kendali atas budak, seperti wali, eksekutor, agen, hakim, dan pengawas, untuk mengembangkan hal-hal berikut dengan izin hukum. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3563} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3564} dan melarang pertumbuhan ilegal, seperti riba, judi, dan perdagangan alkohol. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3565} Adapun perkembangan perburuan dalam arti ketidakhadirannya setelah dilempar, hal ini didasarkan pada pendapat sebelumnya Ibn Abbas dan perbedaan pendapat di antara para ahli hukum. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3565} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3566}"
