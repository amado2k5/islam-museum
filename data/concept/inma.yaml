label: { ar: "الإنماء", en: "Inma (the growth of property by trade, husbandry or increase, and its rulings; also the game that goes out of sight)" }
summary:
  ar: "الإنماء لغة مصدر أنمى، وهو فعل ما به يزيد الشيء ويكثر، والنماء الزيادة، وينقسم إلى حقيقي كالتوالد والتجارة، وتقديري كالتمكن من الزيادة بكون المال في اليد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3559} والإنماء أخص من الزيادة لأن الزيادة قد تكون من خارج، أما الإنماء فنابع من الشيء نفسه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3560} وتنمية المال مشروعة، أباحتها الشريعة بالبيع والتجارة والشركات والقراض، وحفظ المال مقصد من مقاصدها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3561}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3562} ويختلف حكمه بحسب النية، فيفرض لتحصيل الكفاية، ويستحب الزائد للمواساة، ويباح للتجمل، ويكره للتفاخر والتكاثر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3562}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3563} ويجوز لمن يملك التصرف دون الرقبة، كالولي والوصي والوكيل والقاضي والناظر، أن ينمي ما يلي بالإذن الشرعي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3563}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3564} ويحرم الإنماء بغير المشروع كالربا والقمار والتجارة بالخمر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3565} وأما إنماء الصيد بمعنى غيبته بعد رميه فيُنظر فيه إلى ما تقدم من قول ابن عباس وخلاف الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3565}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3566}"
  en: "Inma is lexically the causing of an increase, and growth is an increase, either real, as by birth or trade, or assumed, as by property remaining in one's hand. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3559} It is narrower than ziyada, since ziyada may come from outside while inma comes from the thing itself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3560} Growing property is lawful: the law allowed sale, trade, partnership and mudaraba, and the preservation of property is one of its purposes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3561}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3562} Its ruling depends on the intention: it is obligatory to gain enough for oneself and dependants, recommended beyond that to help the poor, permitted for comfort, and disliked for boasting and rivalry. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3562}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3563} One who has control of property without owning it, such as a guardian, executor, agent, judge or supervisor, may grow it by lawful authority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3563}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3564} Growth by what is unlawful, such as usury, gambling or trade in wine, is forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3565} The other sense, the going out of sight of game after it is shot, is treated in the entry on hunting, with the disputed view of Ibn Abbas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3565}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3566}"
