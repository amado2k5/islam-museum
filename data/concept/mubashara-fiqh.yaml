class: concept
kind: legal
label:
  ar: "المُبَاشَرَة"
  en: "Mubashara (bodily contact): menses, fasting, retreat, pilgrimage and liability"
  ur: "مباشرت ⁦(جسمانی قربت)⁩: حیض، روزہ، اعتکاف، احرام اور ضمان"
  es: "Mubashara (contacto corporal): menstruación, ayuno, retiro, peregrinación y responsabilidad"
  fr: "Mubashara (contact corporel): menstruations, jeûne, retraite, pèlerinage et responsabilité"
  tr: "Yönergelik"
  id: "Direktif"
summary:
  ar: "المباشرة في اللغة الملامسة، وأصلها لمس بشرة الرجل بشرة المرأة، ومن معانيها الجماع {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13821}. ولا خلاف في تحريم وطء الحائض في الفرج، وفي مباشرتها فيما فوق السرة ودون الركبة، ففيما بين السرة والركبة ذهب الجمهور إلى التحريم، وقال الحنابلة يجوز ما عدا الوطء {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13821-13822}. ويجوز للصائم أن يباشر زوجته بما دون الفرج إن أمن الوقوع في المحظور ولا يفسد صومه إن لم ينزل، وتحرم إن حركت شهوته {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13822}. ويحرم على المعتكف الوطء بنص الآية، ويحرم على المحرم مباشرة النساء بأنواعها {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13822}. والتعدي على الغير بالمباشرة من أقوى أسباب الضمان، وإذا اجتمع السبب والمباشرة قُدّمت المباشرة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13822}."
  en: "Mubashara, in lexicon, is touching the skin of another, and also sexual intercourse {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13821}. There is no dispute that intercourse with a menstruating woman in the vulva is forbidden; for contact between the navel and the knee the majority forbid it, while the Hanbalis allow all but intercourse {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13821-13822}. A fasting man may touch his wife short of the private parts if he is safe from transgressing and does not break his fast unless he ejaculates; it is forbidden if it stirs desire {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13822}. Intercourse is forbidden to a man in retreat in the mosque, by the verse on retreat, and a pilgrim in ihram is forbidden all kinds of contact with women {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13822}. Harming another by direct contact is among the strongest causes of liability, and where a cause and a direct act meet, the direct act is preferred {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13822}."
  ur: "مباشرت لغت میں چھونے کو کہتے ہیں، اور اس سے مراد جماع بھی ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13821}۔ حائضہ سے شرمگاہ میں وطی حرام ہونے پر اتفاق ہے؛ ناف اور گھٹنے کے درمیان کی مباشرت میں جمہور کے نزدیک حرام ہے، حنابلہ وطی کے سوا سب جائز کہتے ہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13821-13822}۔ روزہ دار اپنی بیوی سے شرمگاہ کے سوا مباشرت کر سکتا ہے، اگر گناہ میں پڑنے سے محفوظ ہو اور انزال نہ ہو تو روزہ نہیں ٹوٹتا؛ اگر شہوت بھڑکتی ہو تو حرام ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13822}۔ معتکف پر وطی حرام ہے، اور محرم پر عورتوں سے ہر قسم کی مباشرت حرام ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13822}۔ دوسرے کو مباشرت سے نقصان پہنچانا ضمان کے سب سے مضبوط اسباب میں سے ہے، اور جب سبب اور مباشرت جمع ہوں تو مباشرت کو مقدم رکھا جاتا ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13822}۔"
  es: "Mubashara, en el léxico, es tocar la piel de otra persona, y también el coito {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13821}. No hay controversia en cuanto a que el coito con una mujer menstruante en la vulva está prohibido; para el contacto entre el ombligo y la rodilla, la mayoría lo prohíbe, mientras que los hanbalíes permiten todo excepto el coito {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13821-13822}. Un hombre en ayunas puede tocar a su esposa sin llegar a las partes íntimas si está a salvo de transgredir y no rompe su ayuno a menos que eyacule; está prohibido si despierta el deseo {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13822}. El coito está prohibido para un hombre en retiro en la mezquita, según el versículo sobre el retiro, y a un peregrino en ihram se le prohíbe todo tipo de contacto con mujeres {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13822}. Dañar a otro mediante contacto directo es una de las causas más fuertes de responsabilidad, y cuando una causa y un acto directo coinciden, se prefiere el acto directo {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13822}."
  fr: "Le terme mubashara désigne, dans le lexique, le fait de toucher la peau d'autrui, et inclut également les rapports sexuels (voir: fiqh-mawsua-kuwaitiyya-noor-v3 p.13821). Il est incontestable que les rapports sexuels avec une femme menstruée au niveau de la vulve sont interdits; quant au contact entre le nombril et le genou, la majorité l'interdit, tandis que les hanbalites autorisent tout contact autre que la pénétration (voir: fiqh-mawsua-kuwaitiyya-noor-v3 p.13821-13822). Un homme qui jeûne peut toucher sa femme sans atteindre les parties génitales s'il ne commet pas de transgression et ne rompt pas son jeûne, sauf en cas d'éjaculation; cela est interdit si cela éveille le désir (voir: fiqh-mawsua-kuwaitiyya-noor-v3 p.13822). Les relations sexuelles sont interdites à l'homme en retraite spirituelle dans la mosquée, conformément au verset relatif à la retraite, et le pèlerin en état d'ihram se voit interdire tout contact avec les femmes {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13822}. Nuire à autrui par contact direct est l'une des causes les plus graves de responsabilité, et lorsqu'une cause et un acte direct se rencontrent, c'est l'acte direct qui prévaut {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13822}."
  tr: "Temas dilinde doğrudan ilişki, başlangıçta bir erkeğin veya bir kadının tenine dokunmak anlamına gelir ve anlamlarından biri cinsel ilişkidir {atıf:Fiqh-Mawsua-Kuwaitiyya-Noor-v3 s.13821}. Göbek göbek ile diz arasında özel bölgelerde cinsel ilişkinin yasaklanması ve göbek üstü ile diz altı arasındaki ilişki konusunda herhangi bir anlaşmazlık yoktur. Çoğunluk göbek ile diz arasındaki yasağı savunur ve Hanbaliler bunun cinsel ilişki dışında izin verildiğini söylerler {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13821-13822}. Oruç tutan kişi, yasak bölgeye düşmekten güvendeyse karısıyla özel bölgelerinin altında ilişki yaşayabilir ve cinsel ilişkiye girmezse orucu geçersiz sayılmaz. Arzusu uyanırsa yasaktır {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13822}. İtikaf yapan kişinin ayete göre cinsel ilişkiye girmesi yasaktır ve ihramda olan kişinin her türlü kadına dokunması yasaktır {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.13822}. Başkalarına doğrudan saldırı en güçlü güvence temellerinden biridir ve sebep ile doğrudan ilişki birleştirildiğinde doğrudan ilişkiler sağlanır {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13822}."
  id: "Hubungan langsung dalam bahasa kontak, yang awalnya berarti menyentuh kulit pria atau kulit wanita, dan salah satu maknanya adalah hubungan seksual {cite:Fiqh-Mawsua-Kuwaitiyya-Noor-V3 hlm.13821}. Tidak ada perbedaan pendapat mengenai larangan hubungan seksual antara pusar dan lutut di bagian pribadi, serta mengenai hubungan seksual di atas pusar dan di bawah lutut. Mayoritas berpendapat larangan antara pusar dan lutut, dan Hanbalis mengatakan hal itu diperbolehkan kecuali untuk hubungan seksual {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13821-13822}. Orang yang berpuasa dapat berhubungan dengan istrinya di bawah bagian pribadi jika dia aman dari jatuh ke area terlarang, dan puasanya tidak dibatalkan jika dia tidak melakukan hubungan seks. Dilarang jika keinginannya terbangkit {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13822}. Dilarang bagi yang mengamati i'tikaf untuk berhubungan seks sesuai dengan ayat tersebut, dan dilarang bagi yang dalam ihram menyentuh wanita dari segala jenis {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13822}. Serangan langsung terhadap orang lain adalah salah satu dasar jaminan terkuat, dan jika penyebab dan hubungan langsung digabungkan, hubungan langsung diberikan {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13822}."
