id: concept/mubashara-fiqh
class: concept
kind: legal
label:
  ar: "المُبَاشَرَة"
  en: "Mubashara (bodily contact): menses, fasting, retreat, pilgrimage and liability"
  ur: "مباشرت (جسمانی قربت): حیض، روزہ، اعتکاف، احرام اور ضمان"
summary:
  ar: "المباشرة في اللغة الملامسة، وأصلها لمس بشرة الرجل بشرة المرأة، ومن معانيها الجماع {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13821}. ولا خلاف في تحريم وطء الحائض في الفرج، وفي مباشرتها فيما فوق السرة ودون الركبة، ففيما بين السرة والركبة ذهب الجمهور إلى التحريم، وقال الحنابلة يجوز ما عدا الوطء {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13821-13822}. ويجوز للصائم أن يباشر زوجته بما دون الفرج إن أمن الوقوع في المحظور ولا يفسد صومه إن لم ينزل، وتحرم إن حركت شهوته {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13822}. ويحرم على المعتكف الوطء بنص الآية، ويحرم على المحرم مباشرة النساء بأنواعها {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13822}. والتعدي على الغير بالمباشرة من أقوى أسباب الضمان، وإذا اجتمع السبب والمباشرة قُدّمت المباشرة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13822}."
  en: "Mubashara, in lexicon, is touching the skin of another, and also sexual intercourse {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13821}. There is no dispute that intercourse with a menstruating woman in the vulva is forbidden; for contact between the navel and the knee the majority forbid it, while the Hanbalis allow all but intercourse {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13821-13822}. A fasting man may touch his wife short of the private parts if he is safe from transgressing and does not break his fast unless he ejaculates; it is forbidden if it stirs desire {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13822}. Intercourse is forbidden to a man in retreat in the mosque, by the verse on retreat, and a pilgrim in ihram is forbidden all kinds of contact with women {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13822}. Harming another by direct contact is among the strongest causes of liability, and where a cause and a direct act meet, the direct act is preferred {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13822}."
  ur: "مباشرت لغت میں چھونے کو کہتے ہیں، اور اس سے مراد جماع بھی ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13821}۔ حائضہ سے شرمگاہ میں وطی حرام ہونے پر اتفاق ہے؛ ناف اور گھٹنے کے درمیان کی مباشرت میں جمہور کے نزدیک حرام ہے، حنابلہ وطی کے سوا سب جائز کہتے ہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13821-13822}۔ روزہ دار اپنی بیوی سے شرمگاہ کے سوا مباشرت کر سکتا ہے، اگر گناہ میں پڑنے سے محفوظ ہو اور انزال نہ ہو تو روزہ نہیں ٹوٹتا؛ اگر شہوت بھڑکتی ہو تو حرام ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13822}۔ معتکف پر وطی حرام ہے، اور محرم پر عورتوں سے ہر قسم کی مباشرت حرام ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13822}۔ دوسرے کو مباشرت سے نقصان پہنچانا ضمان کے سب سے مضبوط اسباب میں سے ہے، اور جب سبب اور مباشرت جمع ہوں تو مباشرت کو مقدم رکھا جاتا ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13822}۔"
