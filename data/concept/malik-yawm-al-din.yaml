issue:
  ar: "هل يُقرأ «مالك» أم «ملك»، وما الفرق بينهما عند المفسّر؟"
  en: "Is the verse read as 'maalik' or 'malik', and what difference does the commentator draw?"
  ur: "آیت «مالک» پڑھی جائے یا «ملک»، اور مفسر ان میں کیا فرق بتاتے ہیں؟"
perspectives:
  - tradition: sunni
    id: sharawi-malik-maalik
    stance:
      ar: "القراءتان صحيحتان، ولكل منهما معنى يكمل الآخر"
      en: "Both readings are valid, each giving a meaning that completes the other"
      ur: "دونوں قراءتیں درست ہیں اور ہر ایک کا مفہوم دوسرے کو مکمل کرتا ہے"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقرر الشعراوي أن «مالك» تفيد تصرف الله وحده في ذلك اليوم، وأن «ملك» تفيد أنه يقضي حتى فيمن ملّكهم في الدنيا، وأن كلتيهما صحيحة {cite:tafsir-sharawi-khawatir-scan p.70}. لم تُعرض على هذه الصفحات آراء علماء القراءات أو المفسرين الآخرين."
      en: "Sha'rawi holds that 'maalik' means that God alone disposes of that Day, and 'malik' means that He judges even those whom He had given rule in this world, and both are valid {cite:tafsir-sharawi-khawatir-scan p.70}. The scan does not present the views of readers or other commentators."
      ur: "شعراوی کے مطابق «مالک» سے مراد ہے کہ اس دن تصرف صرف اللہ کا ہے، اور «ملک» سے مراد ہے کہ وہ ان کا بھی فیصلہ کرے گا جنہیں دنیا میں اقتدار دیا گیا تھا، اور دونوں درست ہیں {cite:tafsir-sharawi-khawatir-scan p.70}۔ ان صفحات میں دوسرے قراء اور مفسرین کی آراء پیش نہیں کی گئیں۔"
