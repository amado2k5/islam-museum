id: concept/malik-yawm-al-din
class: concept
kind: term
label:
  ar: "مالك يوم الدين"
  en: "Malik yawm al-din (Lord of the Day of Judgement)"
  ur: "مالک یوم الدین"
summary:
  ar: "الآية الرابعة من الفاتحة وقراءتاها «مالِك» و«مَلِك». يرى الشعراوي أن القراءتين صحيحتان، وأن «مالك» تفيد أن الله يملك ذلك اليوم ويتصرف فيه وحده دون واسطة، وأن اليوم زمن خلقه الله، وأن يوم الحساب هو الميزان الذي يمنع القوي من ظلم الضعيف، وأن الدين كله قائم على الإيمان بالحساب {cite:tafsir-sharawi-khawatir-scan p.68} {cite:tafsir-sharawi-khawatir-scan p.70} {cite:tafsir-sharawi-khawatir-scan p.71} {cite:tafsir-sharawi-khawatir-scan p.73}. هذا تفسيره ويُنسب إليه."
  en: "The fourth verse of the Fatiha, read as 'maalik' and as 'malik'. Sha'rawi holds both readings valid: 'maalik' means that God alone owns and disposes of that Day without intermediary; the Day is a time that God created; the Day of reckoning is the balance that stops the strong from wronging the weak; and the whole religion rests on belief in accountability {cite:tafsir-sharawi-khawatir-scan p.68} {cite:tafsir-sharawi-khawatir-scan p.70} {cite:tafsir-sharawi-khawatir-scan p.71} {cite:tafsir-sharawi-khawatir-scan p.73}. This is Sha'rawi's reading and is attributed to him."
  ur: "فاتحہ کی چوتھی آیت، جو «مالک» اور «ملک» دونوں طرح پڑھی جاتی ہے۔ شعراوی کے نزدیک دونوں قراءتیں درست ہیں: «مالک» کا مطلب ہے کہ اس دن کا مالک اللہ اکیلا ہے اور وہ بغیر واسطے کے تصرف کرتا ہے۔ دن وقت ہے جسے اللہ نے پیدا کیا، یومِ حساب وہ ترازو ہے جو طاقتور کو کمزور پر ظلم سے روکتا ہے، اور پورا دین حساب پر ایمان پر قائم ہے {cite:tafsir-sharawi-khawatir-scan p.68} {cite:tafsir-sharawi-khawatir-scan p.70} {cite:tafsir-sharawi-khawatir-scan p.71} {cite:tafsir-sharawi-khawatir-scan p.73}۔ یہ شعراوی کی تفسیر ہے اور ان کی طرف منسوب ہے۔"
wings: [ideas]
