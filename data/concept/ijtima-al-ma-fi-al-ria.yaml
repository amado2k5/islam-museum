"label":
  "ar": "اجتماع الماء في الرئة"
  "en": "The gathering of water in the lung"
  "ur": "پھیپھڑے میں پانی کا جمع ہونا"
  "es": "La acumulación de agua en el pulmón"
  "fr": "L'accumulation d'eau dans les poumons"
"summary":
  "ar": "قد تجتمع في الرئة مائية، ويدل على ذلك مليلة وحمى لينة وورم في الأطراف وسوء\
    \ التنفس ونفث رقيق مائي وحال كحال المستسقي {cite:canon-ibn-sina-print-v2 p.352}"
  "en": "A wateriness may gather in the lung; it is indicated by a chilliness, a soft\
    \ fever, a swelling in the extremities, bad breathing, a thin watery expectoration,\
    \ and a state like the state of the dropsical {cite:canon-ibn-sina-print-v2 p.352}"
  "ur": "پھیپھڑے میں پانی جمع ہو سکتا ہے اور اس کی دلیل سردی لرزہ نرم حمى سروں کی\
    \ سوجن خراب سانس پتلا پانی دار نفث اور حالت استسقاء والے جیسی ہے {cite:canon-ibn-sina-print-v2\
    \ p.352}"
  "es": "Puede acumularse una sensación de agua en los pulmones; esto se manifiesta con escalofríos, fiebre leve, hinchazón en las extremidades, dificultad para respirar, expectoración acuosa y un estado similar al de la hidropesía. {cite:canon-ibn-sina-print-v2 p.352}"
  "fr": "Une accumulation de liquide peut se former dans les poumons; elle se manifeste par des frissons, une fièvre légère, un gonflement des extrémités, une mauvaise respiration, des expectorations liquides et fines, et un état semblable à celui de l'hydropisie {cite:canon-ibn-sina-print-v2 p.352}"
