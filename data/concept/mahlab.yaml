summary:
  ar: "المحلب أجوده الأبيض اللؤلؤي الصافي، حار في الأولى ليس بشديد اليبس، جلاء لطيف محلل مسكن للأوجاع، جيد لأوجاع الخاصرة والظهر وللغشي وللقولنج والحصاة {cite:canon-ibn-sina-print-v1 p.568}."
  en: "Mahlab: the best is the pure pearly white, hot in the first degree and not strongly dry, a fine cleanser, dissolving and calming pains; good for pains of the flank and back, for fainting, for colic and for stone {cite:canon-ibn-sina-print-v1 p.568}."
  ur: "محلب: بہترین وہ ہے جو سفید موتی جیسا اور خالص ہو، پہلے درجے میں گرم اور بہت خشک نہیں، لطیف جلا دینے والا، تحلیل کرنے والا اور دردوں کو تسکین دینے والا؛ پہلو اور کمر کے دردوں، غشی، قولنج اور پتھری میں اچھا ہے {cite:canon-ibn-sina-print-v1 p.568}۔"
