label: { ar: "الحريم", en: "Precincts (harim)", ur: "حریم (گرد کا حق)" }
summary:
  ar: "الحريم في اللغة ما حُرم فلا يُنتهك، وفناء الدار أو المسجد، والحمى؛ وفي الاصطلاح ما حول الشيء من حقوقه ومرافقه، ويحرم على غير مالكه أن يستبد بالانتفاع به، وعند الشافعية ما تمس الحاجة إليه لتمام الانتفاع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7025} والحريم يختلف عن الحمى، فالحمى منع الإمام أرضا من الرعي لمصلحة المسلمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7026} ولا يجوز إحياء حريم البئر والنهر والعين، ولا يملك حريم الأراضي العامرة عند جمهور الفقهاء، والشافعي يقول بتملكه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7026} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7027} ومقدار الحريم يختلف بحسب ما يتعلق به: فحريم البئر عند الحنفية والحنابلة يقدّر، وعند المالكية والشافعية غير مقدّر بل بحسب الحاجة، والحنابلة يفرّقون بين البئر القديمة والبدئ، وحريم البئر في رأي عند الحنابلة خمسون ذراعا للقديمة وخمسة وعشرون للبدئ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7027} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7028} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7029} وحريم النهر عند أبي يوسف ومحمد نصف عرضه أو عرضه، ولا حريم له عند أبي حنيفة في ملك الغير إلا ببرهان، وعند الشافعية والحنابلة ما يحتاج إليه في إلقاء الطين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7030} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7031} وحريم الشجرة خمسة أذرع عند الحنفية، وحريم الدار ما يرتفق به ساكنها، وحريم القرية محتطبها ومرعاها، وحريم أرض الزراعة ما يحتاجه زراعها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7031} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7032} ويجوز البناء في حريم الدار ويمتنع في حريم النهر، ويهدم ما بني فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7033} وحكم الحريم حكم ما هو حريم له، فكل محرم له حريم يحيط به، وحريم الواجب ما لا يتم الواجب إلا به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7034}"
  en: "Harim (sanctum, enclosure) in the lexicon is what is forbidden and not to be violated, the courtyard of a house or mosque, and the protected zone; in law it is what surrounds a thing and serves its rights and uses, which its owner alone may use, and for the Shafi'is what the full use of the thing needs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7025} It differs from hima, the ruler's reserving of land from grazing for the Muslims' good. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7026} It is not lawful to revive the harim of a well, a river or a spring, and the majority hold that the harim of a settled land cannot be owned, while al-Shafi'i holds that it can. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7026} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7027} The extent of the harim varies: for a well the Hanafis fix a measure, the Malikis and Shafi'is leave it to need, and the Hanbalis separate an old well from a new one, giving fifty cubits for the old and twenty-five for the new. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7027} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7028} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7029} For a river, Abu Yusuf and Muhammad give a harim of half or the full width on each side; Abu Hanifa gives none on another's land without proof; the Shafi'is and Hanbalis allow what is needed to throw out the silt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7030} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7031} The harim of a tree is five cubits for the Hanafis; the harim of a house is what its occupant uses; the harim of a village is its woodcutting and pasture; the harim of cultivated land is what its cultivation needs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7031} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7032} Building is allowed in the harim of a house and forbidden in the harim of a river, and what is built there is pulled down. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7033} The harim takes the ruling of what it belongs to: each forbidden thing has a harim around it, and the harim of a duty is what the duty cannot be done without. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7034}"
