class: concept
kind: legal
label: { ar: "الحريم", en: "Precincts (harim)", ur: "حریم ⁦(گرد کا حق)⁩", es: "Recintos (harim)", fr: "Quartiers (harim)" }
summary:
  ar: "الحريم في اللغة ما حُرم فلا يُنتهك، وفناء الدار أو المسجد، والحمى؛ وفي الاصطلاح ما حول الشيء من حقوقه ومرافقه، ويحرم على غير مالكه أن يستبد بالانتفاع به، وعند الشافعية ما تمس الحاجة إليه لتمام الانتفاع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7025} والحريم يختلف عن الحمى، فالحمى منع الإمام أرضا من الرعي لمصلحة المسلمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7026} ولا يجوز إحياء حريم البئر والنهر والعين، ولا يملك حريم الأراضي العامرة عند جمهور الفقهاء، والشافعي يقول بتملكه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7026} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7027} ومقدار الحريم يختلف بحسب ما يتعلق به: فحريم البئر عند الحنفية والحنابلة يقدّر، وعند المالكية والشافعية غير مقدّر بل بحسب الحاجة، والحنابلة يفرّقون بين البئر القديمة والبدئ، وحريم البئر في رأي عند الحنابلة خمسون ذراعا للقديمة وخمسة وعشرون للبدئ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7027} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7028} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7029} وحريم النهر عند أبي يوسف ومحمد نصف عرضه أو عرضه، ولا حريم له عند أبي حنيفة في ملك الغير إلا ببرهان، وعند الشافعية والحنابلة ما يحتاج إليه في إلقاء الطين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7030} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7031} وحريم الشجرة خمسة أذرع عند الحنفية، وحريم الدار ما يرتفق به ساكنها، وحريم القرية محتطبها ومرعاها، وحريم أرض الزراعة ما يحتاجه زراعها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7031} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7032} ويجوز البناء في حريم الدار ويمتنع في حريم النهر، ويهدم ما بني فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7033} وحكم الحريم حكم ما هو حريم له، فكل محرم له حريم يحيط به، وحريم الواجب ما لا يتم الواجب إلا به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7034}"
  en: "Harim (sanctum, enclosure) in the lexicon is what is forbidden and not to be violated, the courtyard of a house or mosque, and the protected zone; in law it is what surrounds a thing and serves its rights and uses, which its owner alone may use, and for the Shafi'is what the full use of the thing needs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7025} It differs from hima, the ruler's reserving of land from grazing for the Muslims' good. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7026} It is not lawful to revive the harim of a well, a river or a spring, and the majority hold that the harim of a settled land cannot be owned, while al-Shafi'i holds that it can. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7026} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7027} The extent of the harim varies: for a well the Hanafis fix a measure, the Malikis and Shafi'is leave it to need, and the Hanbalis separate an old well from a new one, giving fifty cubits for the old and twenty-five for the new. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7027} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7028} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7029} For a river, Abu Yusuf and Muhammad give a harim of half or the full width on each side; Abu Hanifa gives none on another's land without proof; the Shafi'is and Hanbalis allow what is needed to throw out the silt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7030} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7031} The harim of a tree is five cubits for the Hanafis; the harim of a house is what its occupant uses; the harim of a village is its woodcutting and pasture; the harim of cultivated land is what its cultivation needs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7031} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7032} Building is allowed in the harim of a house and forbidden in the harim of a river, and what is built there is pulled down. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7033} The harim takes the ruling of what it belongs to: each forbidden thing has a harim around it, and the harim of a duty is what the duty cannot be done without. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7034}"
  es: "Harim (santuario, recinto) en el léxico es lo que está prohibido y no debe ser violado, el patio de una casa o mezquita, y la zona protegida; en derecho es lo que rodea una cosa y sirve a sus derechos y usos, que solo su dueño puede usar, y para los shafi'ís lo que necesita el uso completo de la cosa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7025} Se diferencia de hima, la reserva de tierras del gobernante para el bien de los musulmanes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7026} No es lícito revivir el harim de un pozo, un río o un manantial, y la mayoría sostiene que el harim de una tierra habitada no puede ser propiedad, mientras que al-Shafi'i sostiene que sí puede. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7026} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7027} La extensión del harim varía: para un pozo, los hanafíes fijan una medida, los malikíes y shafi'ís la dejan a la necesidad, y los hanbalíes separan un pozo viejo de uno nuevo, dando cincuenta codos para el viejo y veinticinco para el nuevo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7027} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7028} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7029} Para un río, Abu Yusuf y Muhammad dan un harim de la mitad o del ancho completo a cada lado; Abu Hanifa no concede nada en tierra ajena sin prueba; los shafi'is y hanbalis permiten lo necesario para remover el lodo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7030} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7031} El harim de un árbol es de cinco codos para los hanafíes; el harim de una casa es lo que usa su ocupante; el harim de una aldea es su tala de madera y pastos; el harim de la tierra cultivada es lo que necesita su cultivo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7031} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7032} Se permite construir en el harim de una casa y se prohíbe en el harim de un río, y lo que se construye allí es derribado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7033} El harim toma la norma de aquello a lo que pertenece: cada cosa prohibida tiene un harim a su alrededor, y el harim de un deber es aquello sin lo cual no se puede cumplir el deber. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7034}"
  fr: "Le terme harim (sanctuaire, enclos) désigne, dans le lexique, ce qui est interdit et ne doit pas être profané: la cour d’une maison ou d’une mosquée, la zone protégée. En droit, il s’agit de ce qui entoure une chose et sert ses droits et usages, dont seul son propriétaire peut se servir. Pour l’école shafi’ite, il s’agit de ce dont la chose est pleinement nécessaire à son usage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7025} Cela diffère de la hima, la mise en réserve de terres par le souverain pour le pâturage des musulmans. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7026} Il n’est pas licite de remettre en état le harim d’un puits, d’une rivière ou d’une source. La majorité considère que le harim d’une terre habitée ne peut faire l’objet d’une propriété, tandis que l’école shafi’ite soutient le contraire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7026} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7027} L'étendue du harim varie: pour un puits, les Hanafites fixent une mesure, les Malikites et les Shafi'ites la laissent au besoin, et les Hanbalites distinguent un ancien puits d'un nouveau, donnant cinquante coudées pour l'ancien et vingt-cinq pour le nouveau. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7027} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7028} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7029} Pour une rivière, Abu Yusuf et Muhammad donnent un harim de la moitié ou de la largeur entière de chaque côté; Abou Hanifa n'accorde aucune concession sur le terrain d'autrui sans preuve; les chaféites et les hanbalites autorisent ce qui est nécessaire pour évacuer le limon. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7030} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7031} Le harim d'un arbre est de cinq coudées pour les hanafites; le harim d'une maison correspond à ce que son occupant utilise; le harim d'un village correspond à la coupe de bois et aux pâturages; le harim d'une terre cultivée correspond à ce dont sa culture a besoin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7031} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7032} La construction est permise dans le harim d'une maison et interdite dans le harim d'une rivière, et tout ce qui y est construit doit être démoli. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7033} Le harim est lié à ce à quoi il s'applique: chaque chose interdite est entourée d'un harim, et le harim d'un devoir est ce sans quoi ce devoir ne peut être accompli. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7034}"
  ur: "لغت میں حریم وہ چیز ہے جس کی خلاف ورزی نہ کی جائے، گھر یا مسجد کا صحن اور محفوظ علاقہ۔ شریعت میں وہ چیز ہے جو کسی چیز کو گھیرے ہوئے ہے اور اس کے حقوق اور استعمال کو پورا کرتی ہے، جسے اس کا مالک اکیلا استعمال کر سکتا ہے، اور شافعیوں کے لیے وہ چیز ہے جو اس چیز کے مکمل استعمال کی ضرورت ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7025} یہ حِمہ سے مختلف ہے، حکمران کی طرف سے مسلمانوں کی بھلائی کے لیے چرانے سے زمین محفوظ کرنا۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص7026} کنویں، دریا یا چشمے کے حرم کو زندہ کرنا جائز نہیں ہے، اور جمہور کا خیال ہے کہ آباد شدہ زمین کے حرم کی ملکیت نہیں ہوسکتی، جبکہ شافعی کا خیال ہے کہ ایسا ہوسکتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ7026} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ7027} حرم کی حد مختلف ہوتی ہے: کنویں کے لیے حنفیہ ایک پیمانہ طے کرتے ہیں، مالکیہ اور شافعی اس کو پرانے کو چھوڑ دیتے ہیں، حنبلی کو نیا اور حنبلی ضرورت کے لیے الگ کرتے ہیں۔ پرانے کے لیے پچیس ہاتھ اور نئے کے لیے پچیس ہاتھ۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ7027} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7028} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ7029} ایک دریا کے لیے اور ابو یوسف کے ساتھ نصف یا پورا حصہ دے۔ ابو حنیفہ بغیر ثبوت کے کسی کو کسی کی زمین پر نہیں دیتے۔ شافعی اور حنبلی اس چیز کی اجازت دیتے ہیں جو گاد کو باہر پھینکنے کے لیے ضروری ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ7030} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص7031} احناف کے نزدیک درخت کا حرم پانچ ہاتھ ہے۔ گھر کا حرم وہی ہے جو اس کا مکین استعمال کرتا ہے۔ ایک گاؤں کا حرم اس کی لکڑی کاٹنا اور چراگاہ ہے۔ زرعی زمین کا حرم وہی ہے جو اس کی کاشت کی ضرورت ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص7031} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7032} مکان کے حرم میں عمارت بنانا جائز ہے اور نہر کے حرم میں حرام ہے اور جو کچھ وہاں بنایا گیا ہے اسے گرا دیا جاتا ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 7033} حرم اس چیز کا حکم لیتا ہے جس سے وہ تعلق رکھتا ہے: ہر حرام چیز کے ارد گرد ایک حرم ہوتا ہے اور فرض کا حرم وہ ہوتا ہے جس کے بغیر فرض ادا نہیں ہوتا۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص7034}"
