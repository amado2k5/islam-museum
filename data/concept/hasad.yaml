class: concept
kind: ethical
label:
  ur: "الحسد"
  ar: الحسد
  en: Envy (hasad)
summary:
  ur: "نعمت کے زوال کی خواہش — نفس کا مرض جو نیکیاں کھا جاتا ہے اور جس سے معوذتین میں پناہ مانگی گئی۔"
  ar: "الحسد في حديث «لا تحاسدوا ولا تناجشوا ولا تباغضوا ولا تدابروا» — الحديث الخامس والثلاثون من الأربعين — أول النهيات الأربعة التي تنظم جانب القلب في أخوة الإسلام قبل نهيات المعاملة: فهو تمني زوال نعمة الغير أو كراهية فضله، ويقارنه النجش — وهو الزيادة في السلع بغير قصد الشراء تغريراً — والتباغض والتدابر، فجميعها أمراض قلوب تتولد منها قطيعة الإخاء، وقرن الحديث بينها وبين تحقير الأخ المسلم الذي جعله كفاية شر لصاحبه ⁦(جامع العلوم والحكم ص 710)⁩. ويعرّف مدخل «حسد» في الموسوعة الحسد بفتح السين أنه أن يتمنى الحاسد زوال نعمة المحسود، ولا يخرج معناه الاصطلاحي عن اللغوي، ويذكر ألفاظاً ذات صلة به: التمني والحقد والشماتة والعين، والغبطة وهي أن يتمنى المرء لنفسه مثل النعمة من غير أن يريد زوالها عن صاحبها، ويعدّ ابن القيم الحسد أصل الإصابة بالعين. {cite:fiqh-mawsua-noor-doc p.269-270} ويذكر للحسد مراتب تبدأ بأشدها وهي تمني زوال النعمة وتمني عينها وهما المذمومان، وتنتهي بالغبطة المعفو عنها إن كانت في شأن دنيوي والمندوبة إن كانت في شأن ديني، ويقرر أن الحسد الحقيقي حرام بإجماع الأمة لأنه اعتراض على الحق ومعاندة له، وأن أصله التحريم في الكتاب والسنة والمعقول. {cite:fiqh-mawsua-noor-doc p.271-273} وينقل عن الغزالي في الإحياء أن الحسد من أمراض القلوب العظيمة وأنه ضرر على الحاسد في الدنيا والدين لا على المحسود، وأن للمرء في أعدائه ثلاث حالات: محبة مساءتهم بطبع مع مقت نفسه عليها وهو معفو عنه قطعا، وإظهار الفرح بمساءة الغير بلسان أو جارحة وهو المحظور قطعا، والحسد بالقلب من غير مقت للذات وهو في محل الخلاف. {cite:fiqh-mawsua-noor-doc p.274-275} وفي الآثار الفقهية يذكر المدخل أن الحسد إذا أدى إلى تلف أو قتل أو اعترف الحاسد بقتله بالعين ففي وجوب القصاص أو الدية خلاف، ونقل عن الحافظ في الفتح عن القرطبي أن العائن إذا أتلف شيئاً ضمنه ولو قتل فعليه القصاص أو الدية إذا تكرر ذلك حتى صار عادة كالساحر، بينما تذكر كتب الشافعية أنه لا قصاص ولا دية لأن الحكم إنما يترتب على ما هو منضبط عام. {cite:fiqh-mawsua-noor-doc p.275-276}"
  en: "Envy in the hadith 'do not envy one another, do not outbid one another, do not hate one another, do not turn away from one another' — the thirty-fifth of the Forty — is the first of four prohibitions ordering the heart's side of Islamic brotherhood before the prohibitions of dealings: the wishing that another's blessing be removed or the resenting of his favour, placed alongside najash — bidding on goods without intent to buy so as to deceive — and mutual hatred and turning away, all of them diseases of hearts from which the severing of brotherhood grows, the hadith coupling them with the despising of a Muslim brother declared sufficient evil for its doer (Jami' al-Ulum wal-Hikam p. 710). The encyclopedia hasad entry defines it as the envier's wish for the removal of the envied's blessing, its technical meaning not departing from the lexical one, and lists related terms: wishing, rancour, gloating and the evil eye, with ghibta being the wish for oneself the like of a blessing without wishing its removal from its possessor; Ibn al-Qayyim makes envy the root of affliction by the evil eye. {cite:fiqh-mawsua-noor-doc p.269-270} It gives envy degrees running from the most blameworthy, wishing the blessing's removal and wishing that very thing, down to ghibta, excused in worldly matters and recommended in religious ones, and records that true envy is forbidden by consensus of the community as an objection to right and opposition to it. {cite:fiqh-mawsua-noor-doc p.271-273} Citing al-Ghazali in the Ihya, it reports that envy is among the great diseases of hearts, harmful to the envier in this world and the next rather than to the envied, and that a person stands toward enemies in three states: loving their harm by nature yet hating himself for it, which is wholly excused; showing joy at another's harm by tongue or limb, which is wholly forbidden; and envy in the heart without self-reproach, which is disputed. {cite:fiqh-mawsua-noor-doc p.274-275} On legal effects it records disagreement over retribution or blood-money when envy leads to destruction or killing or the envier confesses to killing by the eye; al-Hafiz in Fath al-Bari cites al-Qurtubi that one who destroys by the eye is liable, and if he kills, retribution or blood-money applies once it becomes habitual like a sorcerer, while Shafi'i texts hold there is neither because legal consequence attaches only to what is generally determinate. {cite:fiqh-mawsua-noor-doc p.275-276}"
