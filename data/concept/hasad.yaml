label:
  ar: الحسد
  en: Envy (hasad)
summary:
  ar: "الحسد في حديث «لا تحاسدوا ولا تناجشوا ولا تباغضوا ولا تدابروا» — الحديث الخامس والثلاثون من الأربعين — أول النهيات الأربعة التي تنظم جانب القلب في أخوة الإسلام قبل نهيات المعاملة: فهو تمني زوال نعمة الغير أو كراهية فضله، ويقارنه النجش — وهو الزيادة في السلع بغير قصد الشراء تغريراً — والتباغض والتدابر، فجميعها أمراض قلوب تتولد منها قطيعة الإخاء، وقرن الحديث بينها وبين تحقير الأخ المسلم الذي جعله كفاية شر لصاحبه (جامع العلوم والحكم ص 710)."
  en: "Envy in the hadith 'do not envy one another, do not outbid one another, do not hate one another, do not turn away from one another' — the thirty-fifth of the Forty — is the first of four prohibitions ordering the heart's side of Islamic brotherhood before the prohibitions of dealings: the wishing that another's blessing be removed or the resenting of his favour, placed alongside najash — bidding on goods without intent to buy so as to deceive — and mutual hatred and turning away, all of them diseases of hearts from which the severing of brotherhood grows, the hadith coupling them with the despising of a Muslim brother declared sufficient evil for its doer (Jami' al-Ulum wal-Hikam p. 710)."
