id: concept/wujub-al-hajj-fawran-aw-tarakhi
class: concept
kind: term
label: { ar: "وجوب الحج: على الفور أم على التراخي", en: "Duty of the Hajj: immediate or deferrable", es: "Obligación del Hajj: inmediata o aplazable", fr: "Obligation du Hajj: immédiate ou différée", ur: "حج کا فرض: فوری یا موخر", tr: "Hac hemen farz mıdır yoksa ertelenebilir mi?", id: "Apakah ibadah haji wajib dilakukan segera atau bisa ditunda?" }
issue:
  ar: "هل يجب الحج على المستطيع فوراً، أم يجوز تأخيره ما لم يمنعه عذر؟"
summary:
  ar: "خلاف الفقهاء في وقت وجوب الحج على المستطيع. ينقل محمد رشيد رضا قول كثير من أهل الفقه والأثر بأنه على الفور، وقول آخرين بأنه على التراخي، ويذكر الروايات التي استدل بها أهل الفور وما قيل في ضعفها، ويوصي بالاحتياط بعدم التأخير بغير عذر. وفي الشروط يذكر رضا قول الأستاذ محمد عبده في الاستطاعة وخلاف الناس في تفسيرها."
  en: "The jurists' dispute over when the pilgrimage becomes due for one who is able. Rashid Rida reports that many scholars of law and transmission hold it immediate, and others hold it deferrable. He lists the reports used by the first view and records the weakness attributed to them, and advises caution against delay without a valid excuse. On the sense of ability he reports Muhammad Abduh's reading."
  es: "La controversia entre los juristas sobre cuándo debe realizarse la peregrinación para quien tiene la capacidad. Rashid Rida informa que muchos eruditos del derecho y la transmisión de la ley consideran que debe realizarse de inmediato, mientras que otros la consideran aplazable. Enumera los informes utilizados por la primera postura y señala las debilidades que se les atribuyen, y aconseja prudencia ante la demora sin una excusa válida. Respecto al concepto de capacidad, cita la interpretación de Muhammad Abduh."
  fr: "Le différend entre juristes porte sur le moment où le pèlerinage devient obligatoire pour celui qui en a les moyens. Rashid Rida rapporte que de nombreux spécialistes du droit et de la transmission du serment le jugent immédiat, tandis que d'autres le considèrent comme différable. Il recense les hadiths invoqués par la première opinion, en souligne les faiblesses qui leur sont reprochées et recommande la prudence face à tout retard sans motif valable. Concernant la notion de capacité, il rapporte l'interprétation de Muhammad Abduh."
  ur: "فقہا کا اس بات پر اختلاف ہے کہ استطاعت رکھنے والے کے لیے حج کب واجب ہو گا۔ راشد ردا نے رپورٹ کیا ہے کہ قانون اور نشریات کے بہت سے اسکالرز اسے فوری طور پر سمجھتے ہیں اور دوسرے اسے موخر کرتے ہیں۔ وہ پہلے نقطہ نظر کے ذریعہ استعمال ہونے والی رپورٹوں کی فہرست بناتا ہے اور ان سے منسوب کمزوریوں کو ریکارڈ کرتا ہے، اور بغیر کسی معقول عذر کے تاخیر کے خلاف احتیاط کا مشورہ دیتا ہے۔ قابلیت کے احساس پر وہ محمد عبدہ کے پڑھنے کی اطلاع دیتا ہے۔"
  tr: "Alimler, haccın ne zaman farz olduğu konusunda farklı görüşlere sahiptir. Muhammed Raşid Rıza, haccın hemen farz olduğunu savunan birçok fıkıhçı ve hadis âliminden alıntı yaparken, diğerleri ertelenebileceğini savunmaktadır. Hemen yerine getirilmesini savunanların kullandığı rivayetleri zikrederek, bunların zayıf yönlerini tartışmakta ve geçerli bir mazeret olmaksızın ertelemeye karşı uyarıda bulunmaktadır. Şartlara gelince, Rıza, Muhammed Abduh'un güç kavramı ve bu kavramın farklı yorumları hakkındaki görüşlerine yer vermektedir."
  id: "Para ulama berbeda pendapat mengenai kapan haji menjadi wajib bagi mereka yang mampu. Muhammad Rashid Rida mengutip banyak ahli fiqih dan ulama hadits yang berpendapat bahwa haji wajib dilakukan segera, sementara yang lain berpendapat bahwa haji dapat ditunda. Beliau menyebutkan riwayat-riwayat yang digunakan oleh mereka yang menganjurkan pelaksanaan haji segera dan membahas kelemahan-kelemahan riwayat tersebut, serta menyarankan untuk berhati-hati agar tidak menunda tanpa alasan yang sah. Mengenai syarat-syaratnya, Rida mengutip pandangan Muhammad Abduh tentang konsep kemampuan dan berbagai interpretasi dari konsep ini."
