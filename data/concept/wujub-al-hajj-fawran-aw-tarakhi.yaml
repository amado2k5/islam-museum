id: concept/wujub-al-hajj-fawran-aw-tarakhi
class: concept
kind: term
label: { ar: "وجوب الحج: على الفور أم على التراخي", en: "Duty of the Hajj: immediate or deferrable" }
issue:
  ar: "هل يجب الحج على المستطيع فوراً، أم يجوز تأخيره ما لم يمنعه عذر؟"
summary:
  ar: "خلاف الفقهاء في وقت وجوب الحج على المستطيع. ينقل محمد رشيد رضا قول كثير من أهل الفقه والأثر بأنه على الفور، وقول آخرين بأنه على التراخي، ويذكر الروايات التي استدل بها أهل الفور وما قيل في ضعفها، ويوصي بالاحتياط بعدم التأخير بغير عذر. وفي الشروط يذكر رضا قول الأستاذ محمد عبده في الاستطاعة وخلاف الناس في تفسيرها."
  en: "The jurists' dispute over when the pilgrimage becomes due for one who is able. Rashid Rida reports that many scholars of law and transmission hold it immediate, and others hold it deferrable. He lists the reports used by the first view and records the weakness attributed to them, and advises caution against delay without a valid excuse. On the sense of ability he reports Muhammad Abduh's reading."
wings: [ideas, living]
themes: [worship-and-the-pillars, sacred-space-and-pilgrimage]
periods: [period/prophetic-era]
regions: [arabia]
