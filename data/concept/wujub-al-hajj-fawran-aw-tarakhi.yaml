    id: immediate-view
    stance:
      ar: "الحج على الفور: لا يؤخره المستطيع بغير عذر"
    summary:
      ar: "ينقل رضا أن كثيراً من أهل الفقه والأثر استدلوا بالروايات في أن الحج واجب على الفور. ويذكر أن أهل الفور يستدلون بروايات في من مات ولم يحج، وبأثر عن عمر في من له سعة ولم يحج، وأن هذه الروايات يضعفها الحفاظ. ويقول رضا إن الاحتياط ألا يؤخر المستطيع الحج بغير عذر صحيح، لئلا يفاجئه الموت."
