label:
  ar: خيار الغبن
  en: Khiyar al-ghabn (option of fraud in price)
  ur: خیار الغبن
  es: "Khiyar al-ghabn (opción de fraude en el precio)"
  fr: "Khiyar al-ghabn (option de fraude dans le prix)"
  tr: "Adaletsizlik seçeneği"
  id: "Pilihan ketidakadilan"
summary:
  ar: 'خيار الغبن هو الخيار الثابت للمغبون في بعض المذاهب لنقصان ثمن المبيع أو زيادته عن تقويم أهل الخبرة، والغبن في اللغة النقص، وغبنه في البيع خدعه، وعرّفه ابن نجيم بالنقص في الثمن في البيع والشراء، ومثله النقص في البدل في باقي عقود المعاوضات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7994} للغبن تأثير في مواطن كثيرة منها المبادلات الربوية بين الأجناس المتحدة والاحتكار والبيوع المنهي عنها كالنجش وتلقي الركبان وبيع الحاضر للبادي والمصراة والبيع على بيع غيره وبيع المسترسل وبيوع الأمانة، واتخذ ابن قدامة من الغبن مدارا لثلاثة خيارات: خيار تلقي الركبان وخيار النجش وخيار المسترسل، وهذا الأخير من صميم خيارات الغبن لأنه خيانة من البائع بعد أن ركن إليه المشتري وترك المساومة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7995} مواقف المذاهب مجملة: فالحنفية لا يرون للمغبون خيارا إلا إذا كان مغررا به على الراجح أو كان غبنا للقاصر، والمالكية في رأي بالخيار للمغبون مطلقا أو إذا كان مسترسلا، والحنابلة يقتصرون على إثباته للمسترسل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7995} الغبن المعتبر للرد هو الفاحش، ومعناه عند الحنفية والمالكية في الراجح والحنابلة في قول ما تقدّره عادة التجار فتكون العبرة بتقويم المقومين، وفي القول الثاني للمالكية والحنابلة المعتبر الثلث، وفي الثالث للمالكية ما زاد على الثلث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7996} ويشترط لقيام الخيار جهل المغبون بوقوعه في الغبن عند التعاقد، واحتج بعض القائلين به بحديث حبان بن منقذ وفيه اشتراط عدم الخلابة، فإن كان عالما بالغبن وأقدم فلا خيار له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7996} موجب الخيار إذا تحقق الاسترسال والغبن الخارج عن المعتاد التخيير بين الفسخ والإمضاء مجانا دون مطالبة بالأرش. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7996} ويسقط خيار الغبن مع التغرير عند الحنفية على ما تضمنته المجلة العدلية بهلاك المبيع أو استهلاكه أو تغيره أو تعيبه، وبالسكوت والتصرف بعد العلم بالغبن، وبموت المغبون فلا تنتقل الدعوى إلى الوارث وأما موت الغابن فلا يمنع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7996}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7997} خيار غبن المساومة منفى عند الحنفية والشافعية والحنابلة وعند المالكية في الراجح، واقتصر المالكية والحنابلة على خيار المسترسل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7997} وعند الحنفية ثلاث روايات في الغبن الفاحش المجرد في بيع المساومة: لا رد مطلقا، وثبوت الرد مطلقا، وثبوته إن صاحبه تغرير وهو الراجح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7997} المسترسل عند المالكية المستسلم لبائعه، وعند الحنابلة الجاهل بقيمة السلعة الذي لا يحسن المبايعة، وعن أحمد أيضا الذي لا يماكس، والمعول على عدم الخبرة بالمبايعة، وقال ابن قدامة إن العالم الذي لو توقف لعرف لا خيار له إذا استعجل فغُبن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7997}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7998} نص خليل عند المالكية على أنه لا يرد بالغبن ولو خالف العادة وهو المشهور وفي المذهب قول بالرد، والغبن اليسير لازم للعقد اتفاقا، وذكر ابن رشد أنه لا قيام بالغبن في بيع المكايسة وأن القيام به واجب بإجماع في الاسترسال والاستنامة لحديث «غبن المسترسل ظلم» الذي أخرجه الطبراني وأورده الهيثمي وضعفه لموسى بن عمير الأعمى في إسناده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7998} الحنابلة يثبتون خيار الغبن للمسترسل فقط على الراجح وهي من المسائل التي اختارها ابن تيمية، وفي رواية ذكرها ابن أبي موسى بصيغة قيل أن الغبن لازم للمسترسل أيضا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7999} أثبت المالكية خيار غبن القاصر إذا غبن الوصي عن القاصر أو الوكيل عمن وكله درءا للضرر، ونصت مجلة الأحكام العدلية في المادة ٣٥٦ على أن وجود الغبن وحده في مال اليتيم يبطل البيع وكذلك مال الوقف وبيت المال، ويثبت الخيار في عقد الشراء اتفاقا بينهم واقتصر عليه بعضهم فأجاز البيع بالغبن عن الصبي أو المتصرف عن الغير لأن البيع إزالة ملك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7999} موجبه عند المالكية على راجح الأقوال نقض البيع في قيام السلعة فإن فاتت فلا نقض ويلجأ إلى تكميل الثمن، ويسقط بالتصرف في المبيع وبالتلف وفواته فإن فات رجع الموكل والمحجور عليه على المشتري بما وقع الغبن والمحاباة به ثم على البائع وهو الوكيل أو الوصي، ولا يتقيد الرجوع بالثلث بل بكل نقص بين عن القيمة كما صوب ابن عرفة وهو مقتضى روايات المدونة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7999}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8000}'
  en: "Khiyar al-ghabn is the option the defrauded party holds in some schools for a price below or above the experts' valuation; ghabn in language is shortfall, and to cheat someone in a sale, and Ibn Najim defines it as a shortfall in the price in sale and purchase, with the like in the counter-value of other exchange contracts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7994} Ghabn has effect in many places, among them riba exchanges between goods of one genus, hoarding, and forbidden sales such as najsh, meeting the caravans, the townsman's sale for the desert-dweller, the musarrah, selling over another's sale, the sale to the trusting buyer (mustarsil), sales of trust, and verbal deceit joined with ghabn; Ibn Qudama made ghabn the pivot of three options: meeting the caravans, najsh and the mustarsil, the last being a true ghabn option as a betrayal by the seller after the buyer relied on him and left bargaining. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7995} The schools in brief: the Hanafis give the defrauded no option unless he was deceived, on the preponderant view, or the ghabn fell on a minor; the Malikis in one view give the option to the defrauded absolutely or if he is a mustarsil; the Hanbalis restrict it to the mustarsil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7995} The ghabn that counts for return is the gross one, defined by the Hanafis, the preponderant Maliki view and one Hanbali view as what traders' custom estimates, the measure being the valuers' assessment; the second Maliki and Hanbali view fixes it at one third, and a third Maliki view at more than a third. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7996} The option requires the defrauded to have been ignorant of the ghabn at the contract; some holders of the option argue from the hadith of Habban ibn Munqidh which includes the stipulation of no cheating, while one who proceeds with knowledge has no option. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7996} Its effect, when trust and unusual ghabn are proved, is the choice between annulment and confirmation without charge, with no claim for the arsh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7996} On the Hanafi view as contained in the Majalla the option of ghabn with deceit lapses by the goods perishing, being consumed, changed or newly defective, by silence and dealing after knowledge of the ghabn, and by the death of the defrauded, whose claim does not pass to the heir, while the deceiver's death does not prevent it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7996}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7997} The option of ghabn in the bargaining sale is denied by the Hanafis, Shafiis and Hanbalis and by the Malikis on the preponderant view, the Malikis and Hanbalis restricting it to the mustarsil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7997} The Hanafis transmit three views on bare gross ghabn in the bargaining sale: no return at all, return absolutely, and return only when joined with deceit, which is preponderant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7997} The mustarsil is for the Malikis the one who surrenders to his seller, for the Hanbalis the one ignorant of the goods' value who is not skilled in trading, and in another wording from Ahmad the one who does not bargain; the operative trait is inexperience in trading, and Ibn Qudama held that the knowledgeable man who would have known had he paused has no option if he hastened and was defrauded. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7997}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7998} Khalil of the Malikis states there is no return for ghabn even against custom, which is the well-known view though a view of return exists, and slight ghabn binds the contract by agreement; Ibn Rushd recorded no standing against ghabn in the bargaining sale and that standing against it is obligatory by consensus in the istirsal and istinama sale for the hadith of the Prophet's governor 'the ghabn of the mustarsil is wrongdoing', transmitted by al-Tabarani and recorded by al-Haythami who weakened it for Musa ibn Umayr al-A'ma in its chain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7998} The Hanbalis affirm the ghabn option for the mustarsil alone on the preponderant view, among the issues Ibn Taymiyya chose in Ahmad's school, while a transmission noted by Ibn Abi Musa with the wording 'it was said' makes the ghabn binding on the mustarsil too. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7999} The Malikis affirm the option for the ghabn of a guardian over a minor or an agent over his principal to avert harm, and article 356 of the Majalla states that ghabn alone in an orphan's property invalidates the sale, the property of the waqf and the public treasury being alike; the option stands in the contract of purchase by their agreement, some restricting it to that and allowing sale with ghabn by the boy or the one acting for another since sale removes ownership. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7999} On the preponderant Maliki view its effect is rescission while the goods stand, none if they are lost, recourse then being to completing the price; it lapses by dealing in the goods and by their perishing or loss, in which case the principal and the ward recover the ghabn from the buyer, then from the seller who is the agent or guardian; the recovery is not limited to a third but covers every clear shortfall of the value, which Ibn Arafa deemed correct and which the transmissions of the Mudawwana require. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7999}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8000}"
  ur: 'خیار الغبن بعض مذاہب میں مغبون کو دیا گیا وہ اختیار ہے جس سے وہ مبیع کی قیمت میں اہل خبرہ کی تقویم سے کمی یا زیادتی پر عقد کوئی فسخ کر سکتا ہے؛ غبن لغت میں کمی ہے، اور بیع میں غبن دھوکہ ہے، ابن نجیم کے نزدیک بیع و شراء میں ثمن کی کمی ہے اور دیگر معاوضہ عقود میں بدل کی کمی اسی طرح ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7994} غبن کے اثر کے مواقع بہت ہیں جن میں متحدہ اجناس کی ربوی مبادلہ، احتکار، اور منع شدہ بیع جیسے نجش، تلقی الرکبان، حاضر کا بادی کو بیچنا، مصراۃ، دوسرے کی بیع پر بیع، مسترسل کو بیچنا، بیع الامانہ اور قولی تغریر مع غبن شامل ہیں؛ ابن قدامہ نے غبن کو تین خیارات کا مدار بنایا: تلقی الرکبان، نجش اور مسترسل، اور آخری خیار عیین غبن ہے کیونکہ یہ مشتری کے اعتماد کے بعد بائع کی خیانت ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7995} مذاہب کا خلاصہ: حنفیہ مغبون کو خیار نہیں دیتے مگر راجح قول میں تغریر شدہ کو یا قاصر کے غبن میں؛ مالکیہ کا ایک قول مطلقاً مغبون کو یا مسترسل کو خیار دیتا ہے؛ حنابلہ صرف مسترسل پر قیام رکھتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7995} رد کے قابل غبن صرف فاحش ہے، اور حنفیہ، مالکیہ کی راجح رائے اور حنابلہ کے ایک قول میں اس کا مدار تاجروں کی عادت اور مقومین کی تقویم ہے؛ مالکیہ و حنابلہ کے دوسرے قول میں معیار ایک تہائی ہے اور مالکیہ کے تیسرے قول میں تہائی سے زائد۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7996} خیار کی شرط یہ ہے کہ مغبون عقد کے وقت غبن سے ناواقف ہو؛ بعض قائلین حبان بن منقذ کی حدیث سے استدلال کرتے ہیں جس میں خلابت نہ ہونے کی شرط آئی ہے، اور جان بوجھ کر آگے بڑھنے والے کو خیار نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7996} استرسال اور غیر معمولی غبن ثابت ہو تو موجب فسخ یا امضاء کا اختیار ہے بغیر ارش کے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7996} مجلۃ احکام عدلیہ کے مطابق حنفیہ کے ہاں تغریر کے ساتھ خیار غبن مبیع کے ہلاک، مستعمل، بدل یا معیوب ہونے سے، علم کے بعد تصرف سے، اور مغبون کی موت سے ساقط ہوتا ہے اور دعویٰ وارث کو منتقل نہیں ہوتا، مگر غابن کی موت مانع نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7996}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7997} مساومہ کی بیع میں خیار غبن حنفیہ، شافعیہ اور حنابلہ کے نزدیک اور مالکیہ کی راجح رائے میں نہیں؛ مالکیہ و حنابلہ نے اسے مسترسل تک محدود کیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7997} حنفیہ کے ہاں مساومہ میں مجرد غبن فاحش کی تین روایتیں ہیں: مطلقاً رد نہیں، مطلقاً رد ثابت، اور صرف تغریر کے ساتھ رد جو راجح ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7997} مسترسل مالکیہ کے نزدیک اپنے بائع پر ہار ماننے والا ہے، حنابلہ کے نزدیک قیمت سے ناواقف اور مبايعہ نہ جاننے والا، اور احمد سے ایک اور تعبیر میں جو مماکسہ نہیں کرتا؛ معیار مبايعہ کی تجربہ کاری نہ ہونا ہے، اور ابن قدامہ کے نزدیک جاننے والا جو رک کر جان سکتا ہو جلدی کر کے غبن کھائے تو اسے خیار نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7997}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7998} مالکیہ کے خلیل کے نزدیک غبن پر رد نہیں خواہ عادت کے خلاف ہو اور یہی مشہور ہے اگرچہ رد کا ایک قول بھی ہے، اور معمولی غبن پر عقد اتفاقاً لازم ہے؛ ابن رشد نے مقدمات میں لکھا کہ مکایسہ کی بیع میں غبن پر قیام نہیں اور استرسال و استنامہ میں اجماعاً قیام واجب ہے، حدیث «غبن المسترسل ظلم» کی بنا پر جو طبرانی نے نکالی اور ہیثمی نے درج کیا مگر موسیٰ بن عمیر اعمیٰ کے سبب ضعیف قرار دی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7998} حنابلہ راجح مذہب میں صرف مسترسل کو خیار غبن دیتے ہیں اور یہ ابن تیمیہ کے چنے ہوئے مسائل میں ہے؛ ابن ابی موسیٰ کی روایت «قيل» کے اسلوب میں مسترسل پر بھی غبن کو لازم مانتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7999} مالکیہ نے وصی کے قاصر یا وکیل کے موکل کو غبن پہنچانے کی صورت میں ضرر روکنے کے لیے خیار ثابت کیا، اور مجلہ کی دفعہ ٣٥٦ میں ہے کہ یتیم کے مال میں تنہا غبن بیع کو باطل کرتا ہے اور وقف و بیت المال بھی اسی حکم میں ہیں؛ شراء کے عقد میں اتفاقاً خیار ہے اور بعض نے اسی تک محدود کیا چنانچہ صبی یا غیر کے لیے تصرف کرنے والے کا غبن والا بیع جائز ٹھہرا کیونکہ بیع ملکیت زائل کرتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7999} راجح مالکی قول میں اس کا موجب سلعت کے قائم رہتے نقض بیع ہے اور فوت ہونے پر ثمن کی تکمیل؛ یہ خیار مبیع میں تصرف اور تلف و فوات سے ساقط ہوتا ہے جس پر موکل اور محجور علیہ خریدار سے غبن کی رقم وصول کریں، نہ ممکن ہو تو بائع جو وکیل یا وصی ہے سے؛ اور وصولی تہائی تک محدود نہیں بلکہ قیمت کی ہر واضح کمی پر ہے جیسا ابن عرفہ نے درست کہا اور مدونہ کی روایات کا تقاضا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7999}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8000}'
  es: "Khiyar al-ghabn es la opción que la parte defraudada tiene en algunas escuelas por un precio por debajo o por encima de la valoración de los expertos; ghabn en lenguaje es déficit, y engañar a alguien en una venta, e Ibn Najim lo define como un déficit en el precio en la venta y compra, con lo mismo en el contravalor de otros contratos de intercambio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7994} Ghabn tiene efecto en muchos lugares, entre ellos los intercambios riba entre bienes de un mismo género, el acaparamiento y las ventas prohibidas como najsh, encuentro con las caravanas, la venta del ciudadano para el habitante del desierto, la musarrah, venta sobre la venta de otro, la venta al comprador confiado (mustarsil), ventas de confianza y engaño verbal unido con ghabn; Ibn Qudama hizo del ghabn el eje de tres opciones: encontrarse con las caravanas, el najsh y el mustarsil, siendo este último una verdadera opción de ghabn como una traición por parte del vendedor después de que el comprador confiara en él y abandonara la negociación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7995} Las escuelas en resumen: los hanafíes no dan ninguna opción al defraudado a menos que haya sido engañado, en la opinión predominante, o que el ghabn recayera sobre un menor; los malikíes en una opinión dan la opción al defraudado absolutamente o si es un mustarsil; los hanbalíes la restringen al mustarsil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7995} El ghabn que cuenta para la devolución es el bruto, definido por los Hanafis, la visión Maliki predominante y una visión Hanbali como lo que estiman los comerciantes por costumbre, siendo la medida la evaluación de los tasadores; la segunda visión Maliki y Hanbali lo fija en un tercio, y una tercera visión Maliki en más de un tercio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7996} La opción requiere que el defraudado haya ignorado el ghabn en el contrato; algunos titulares de la opción argumentan a partir del hadiz de Habban ibn Munqidh que incluye la estipulación de no engañar, mientras que quien procede con conocimiento no tiene opción. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7996} Su efecto, cuando se prueban la confianza y el ghabn inusual, es la opción entre la anulación y la confirmación sin cargo, sin reclamación por el arsh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7996} Según la visión Hanafi contenida en la Majalla, la opción del ghabn con engaño caduca por la destrucción, el consumo, el cambio o la aparición de nuevos defectos en los bienes, por el silencio y la negociación después del conocimiento del ghabn, y por la muerte del defraudado, cuya reclamación no pasa al heredero, mientras que la muerte del engañador no lo impide. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7996}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7997} La opción del ghabn en la venta es negada por los Hanafis, Shafiis y Hanbalis y por los Malikis en la opinión preponderante, los Malikis y Hanbalis restringiéndola al mostarsil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7997} Los hanafis transmiten tres puntos de vista sobre el ghabn bruto y desnudo en la venta: sin retorno alguno, retorno absoluto y retorno sólo cuando se une al engaño, que es preponderante. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7997} El mustarsil es para los malikíes el que se rinde a su vendedor, para los hanbalíes el que ignora el valor de los bienes y no es hábil en el comercio, y en otra formulación de Ahmad el que no regatea; el rasgo operativo es la inexperiencia en el comercio, e Ibn Qudama sostuvo que el hombre informado que lo hubiera sabido si se hubiera detenido no tiene opción si se apresuró y fue defraudado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7997}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7998} Khalil de los malikíes afirma que no hay devolución por ghabn incluso contra la costumbre, que es la opinión bien conocida aunque existe una opinión de devolución, y un ghabn leve vincula el contrato por acuerdo; Ibn Rushd no registró ninguna postura en contra del ghabn en la venta por negociación y que oponerse a él es obligatorio por consenso en la venta de istirsal e istinama para el hadiz del gobernador del Profeta 'el ghabn del mustarsil es una mala acción', transmitido por al-Tabarani y registrado por al-Haythami, quien lo debilitó para Musa ibn Umayr al-A'ma en su cadena. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7998} Los hanbalíes afirman la opción del ghabn solo para el mustarsil en la opinión preponderante, entre los asuntos que Ibn Taymiyya eligió en la escuela de Ahmad, mientras que una transmisión notada por Ibn Abi Musa con la frase 'se dijo' hace que el ghabn sea vinculante también para el mustarsil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7999} Los malikíes afirman la opción del ghabn de un tutor sobre un menor o de un agente sobre su principal para evitar daños, y el artículo 356 de la Majalla establece que el ghabn solo en la propiedad de un huérfano invalida la venta, siendo la propiedad del waqf y el tesoro público iguales; la opción se mantiene en el contrato de compra por su acuerdo, algunos lo restringen a eso y permiten la venta con ghabn por el niño o el que actúa por otro ya que la venta elimina la propiedad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7999} En la opinión malikí preponderante su efecto es la rescisión mientras los bienes estén en pie, ninguno si se pierden, recurriendo entonces a completar el precio; El derecho de retención se extingue al comerciar con los bienes y por su deterioro o pérdida, en cuyo caso el principal y el tutelado recuperan el ghabn del comprador, y luego del vendedor, quien actúa como agente o tutor; la recuperación no se limita a un tercio, sino que cubre cualquier déficit evidente del valor, lo cual Ibn Arafa consideró correcto y que así lo exigen las transmisiones de los Mudawwana. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7999}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8000}"
  fr: "Khiyar al-ghabn est l'option dont dispose la partie lésée dans certaines écoles de pensée pour un prix inférieur ou supérieur à l'évaluation des experts; ghabn signifie littéralement « déficit » et « tromper quelqu'un lors d'une vente ». Ibn Najim le définit comme un manque à gagner dans le prix de vente et d'achat, similaire à la contrepartie d'autres contrats d'échange. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7994} Le ghabn a des effets dans de nombreux domaines, notamment les échanges de riba entre biens d'une même catégorie, l'accaparement et les ventes interdites telles que le najsh (rencontre avec les caravanes), la vente du citadin au vagabond, la musarrah (vente par-dessus la vente d'autrui), la vente à l'acheteur confiant (mustarsil), les ventes de confiance et la tromperie verbale associée au ghabn. Ibn Qudama a placé le ghabn au centre de trois options: la rencontre avec les caravanes, le najsh et le mustarsil, ce dernier constituant un véritable ghabn, car il résulte d'une trahison du vendeur après que l'acheteur, se fiant à lui, a interrompu les négociations. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7995} Les écoles de pensée, en résumé: les Hanafites n'accordent aucune option à la personne lésée, sauf en cas de tromperie (selon l'avis prépondérant) ou si le ghabn a été commis sur un mineur; les Malikites, selon une opinion, accordent cette option à la personne lésée de manière absolue ou s'il s'agit d'un mustarsil; les Hanbalites la limitent au mustarsil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7995} Le ghabn pris en compte pour le remboursement est le ghabn brut, défini par les Hanafites, l'avis majoritaire des Malikites et un avis hanbalite comme l'estimation coutumière des commerçants, la mesure étant l'évaluation des experts; un second avis malikite et un avis hanbalite le fixent à un tiers, et un troisième avis malikite à plus d'un tiers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7996} L'option suppose que la personne lésée ignorait le ghabn au moment de la conclusion du contrat; certains détenteurs de l'option s'appuient sur le hadith de Habban ibn Munqidh qui stipule l'absence de fraude, tandis que celui qui agit en connaissance de cause ne dispose d'aucune option. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7996} Lorsque la confiance et le ghabn inhabituel sont prouvés, l'effet est le choix entre l'annulation et la confirmation sans frais, sans possibilité de réclamer l'arsh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7996} Selon l'école hanafite, telle qu'exposée dans la Majalla, l'option du ghabn avec tromperie s'éteint lorsque les biens périssent, sont consommés, modifiés ou deviennent défectueux, en cas de silence ou de transactions après connaissance du ghabn, et par le décès de la personne lésée, dont la créance ne revient pas à l'héritier, tandis que le décès du trompeur ne l'empêche pas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7996}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7997} L'option du ghabn dans la vente à prix négocié est refusée par les Hanafis, les Shafiis et les Hanbalis et par les Malikis de l'avis prépondérant, les Malikis et les Hanbalis la limitant au mustarsil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7997} Les Hanafis transmettent trois points de vue sur le ghabn brut dans la vente à prix réduit: aucun retour du tout, retour absolu et retour seulement lorsqu'il est associé à la tromperie, qui est prépondérante. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7997} Le mustarsil, selon les Malikites, désigne celui qui cède à son vendeur; selon les Hanbalites, celui qui ignore la valeur des marchandises et qui n’est pas versé dans le commerce; et, selon une autre formulation d’Ahmad, celui qui ne marchande pas. Le critère déterminant est l’inexpérience en matière de commerce. Ibn Qudama soutenait que l’homme instruit qui aurait su s’il avait pris le temps de la réflexion n’a aucun recours s’il s’est précipité et a été dupé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7997}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7998} Khalil, de l’école malikite, affirme qu’il n’y a pas de retour pour le ghabn, même à l’encontre de la coutume. C’est l’avis le plus répandu, bien qu’une opinion prévoyant un retour existe. Un léger ghabn rend le contrat contraignant par accord. Ibn Rushd n'a consigné aucune position contre le ghabn lors de la vente marchande, et cette position est obligatoire par consensus lors des ventes istirsal et istinama, conformément au hadith du gouverneur du Prophète: « Le ghabn du mustarsil est une injustice », transmis par al-Tabarani et rapporté par al-Haythami, qui l'a atténué pour Musa ibn Umayr al-A'ma dans sa chaîne de transmission. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7998} Les Hanbalites affirment l'option du ghabn uniquement pour le mustarsil, selon l'avis prépondérant, parmi les questions qu'Ibn Taymiyya a choisies dans l'école d'Ahmad, tandis qu'une transmission notée par Ibn Abi Musa avec la formulation « il a été dit » rend le ghabn obligatoire également pour le mustarsil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7999} Les Malikites affirment l'option de ghabn (droit de ghabn) accordée au tuteur sur un mineur ou au mandataire sur son mandant afin d'éviter tout préjudice. L'article 356 de la Majalla stipule que le ghabn, à lui seul, sur les biens d'un orphelin invalide la vente, les biens du waqf et ceux du trésor public étant considérés comme identiques. L'option est maintenue dans le contrat d'achat par accord entre les parties, certains se limitant à cette seule possibilité et autorisant la vente avec ghabn par le garçon ou celui agissant pour le compte d'un tiers, puisque la vente entraîne le transfert de propriété. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7999} Selon l'opinion majoritaire des Malikites, son effet est la rescision tant que les biens sont en place; en cas de perte, aucun recours n'est possible, le seul recours étant alors le paiement intégral du prix. Le ghabn (prêt) s'éteint lors de la vente des marchandises, de leur destruction ou de leur perte. Dans ce cas, le mandant et le pupille recouvrent le ghabn auprès de l'acheteur, puis auprès du vendeur, qui est l'agent ou le tuteur. Le recouvrement n'est pas limité à un tiers, mais couvre tout manque à gagner manifeste, ce qu'Ibn Arafa jugeait correct et que les transmissions de la Mudawwana exigent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7999}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8000}"
  tr: "Haksız muamele seçeneği, bazı okullarda haksızlığa uğrayan taraf için sabit bir seçenektir; çünkü uzmanların değerlendirmesine göre satılan ürünün fiyatı düşer veya yükselir. Dil açısından adaletsiz eksikliktir, satışta haksız olmak ise aldatmacadır. İbn Najim bunu alım-satımda fiyat düşüşü ve benzer şekilde diğer takas sözleşmelerinde de değişim düşüşü olarak tanımlamıştır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7994} Dolandırıcılık, birleşik ırklar arasındaki tefecilik, tekel ve haksızlık, yük alımı, hediyenin orijinal sahibi ve sahibine satılması, başkaları adına satış, sürekli satış ve güven satışı gibi yasaklı satışlar dahil olmak üzere birçok alanı etkiler. İbn Qudamah, dolandırıcılık biçimini üç seçeneğin çerçevesi olarak aldı: araçları alma seçeneği, adaletsizlik seçeneği ve haksız kişi seçeneği. Haksız kişi seçeneği, haksız muamele seçeneklerinin merkezinde yer alır çünkü alıcı satıcıya güvenip pazarlığı bıraktıktan sonra ihanettir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7995} Okulların pozisyonları geneldir: Hanafiler, haksızlığa uğrayanları, hakim görüş tarafından yanıltıldılmadıkça veya küçüğe haksızlık edilmedikçe seçim hakkı olduğunu düşünürler. Malikiler, seçeneğin kesinlikle haksızlığa uğrayan için veya sürekli bir seçenek olduğunu savunurken, Hanbaliler haksız olanı onaylamakla sınırlanırlar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7995} Reddedilmesi haksız kabul edilen durum büyük bir durumdur ve Hanafi ile Malikilere göre hakim görüş ve Hanbalilere göre, görüş genellikle tüccarların tahmin ettiği şeydir, bu nedenle kriter değerlendiricilerin değerlendirmesidir. Maliki ve Hanbalilerin ikinci görüşünde üçte bir, üçüncüde ise Malikilere göre üçte birin üzerinde kabul edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7996} Seçeneğin yürürlüğe girmesi için koşul, mağdur tarafın adaletsizlik sözleşmesine karıştığından habersiz olmasıdır. Bunu savunanlar Hibban ibn Munqidh'in adaletsizliğin olmamasını belirten hadisini örnek göstermiştir. Kişi suçun farkındaysa ve yaşlıysa, başka seçeneği yoktur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7996} Seçenek zorunludur; süreklilik ve olağandışı adaletsizlik gerçekleşirse, iptal ile imzalama arasında seçim arşiv talep edilmeden serbesttir. {Cite:Fiqh-Mawsua-Kuwaitiyya-Noor-V3 s.. 7996} Al-Majalla al-Adliyya'da belirtildiği gibi, satılan eşyanın kaybı veya tüketimi ya da değiştirilmesi ya da kusuru ile ilgili olarak Hanefilere göre aldatma ile haksız muamele seçeneği kaldırılır ve suskunlukla ve yanlış yapıldığını bildikten sonra hareket edilirse, mağdurun ölümü durumunda talep varise geçmez, ancak mağdurun ölümü engellenmez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7996} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7997} Haksız pazarlık seçeneği, Hanefiler, Şafiiler, Hanbaliler ve Malikiler tarafından tercih edilen görüşte reddedilirken, Malikiler ve Hanbalılar sürekli (mustarsul) seçeneğiyle sınırlanırlar. {Cite:Fiqh-Mawsua-Kuwaitiyya-Noor-V3 s.. 7997} Hanefiler arasında, pazarlık satışlarında büyük ve saf haksızlıkla ilgili üç rivayet vardır: hiç reddedilmeme, iadenin kesin olarak belirlenmesi ve sahibinin aldatıldığının kanıtı olup tercih edilen görüş olmasıdır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7997} 'murat' (Malikilere göre sürekli) satıcısına teslim olan; hanbalilere göre ise satışı yapmayan ürünün değerini bilmeyen kişidir; ve ayrıca satmayan ve satışta deneyimsizliğe dayanan Ahmad'dan. İbn Qudamah şöyle demiştir ki, durursa başka seçeneği olmayan bir alim acele edip haksızlık eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7997} {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7998} Malikilere göre Halil, geleneklere aykırı olsa bile haksız muamele ile geri verilmemesi gerektiğini belirtmiştir ki bu yaygın görüştür. Okul, küçük bir haksızlığın sözleşme üzerinde anlaşma yoluyla bağlayıcı olduğunu kabul eder. İbn Rüşd, dolandırılanın satışında çözüm olmadığını ve bunun yapılmasının aktarım ve hatırlama zincirinde uzlaşıyla zorunlu olduğunu, Al-Tabarani'nin anlattığı ve Al-Haythami'nin aktardığı \"faile haksızlık eden haksız\" hadislerine dayanarak, kör Musa ibn Umair'in aktarım zincirini zayıflattığını belirtmiştir. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.7998} Hanbaliler, haksız muamele seçeneğini yalnızca tercih edilen görüşe göre devam eden haksız kişiye savunurlar; bu da İbn Teymiye tarafından seçilen konular arasındadır. İbn Ebi Musa'nın bir anlatımında, haksız olan için de haksız muamele gereklidir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7999} Malikis, vasi veya vekilin, zarar görmeyi önlemek için emanet edilen reşit olmaya haksızlık etmesi durumunda reşit olmaya haksızlık etme seçeneğini belirlemiştir. Yargı Kararları Kanunu'nun 356. maddesi, yetimin malında haksız muamele yapılmasının satışı, vakıf malını ve kamu hazinesini geçersiz kıldığını belirtir. Satın alma sözleşmesindeki opsiyon, aralarındaki anlaşmayla belirlenir ve bazıları bunu sadece bu sözleşmeyle sınırlandırmıştır, bu nedenle satış, bir çocuğun aldatmasıyla veya başkaları adına elden çıkaran kişi tarafından yapılarak izin verilir, çünkü satış, mülkiyetin kaldırılmasıdır. {kaynak:fiqh-mawsua-kuwaitiyya-noor-v3 s. 79999} Maliki okulu görüşüne göre, yaygın görüşe göre, koşul mal tespit edildiğinde satışın iptal edilmesidir. Kaybolursa, iptal edilmez ve fiyat belirlenir. Satılan eşya elden çıkarılarak ve kaybı durumunda feragat edilir. Kaybedilirse, asıl ve yetersiz kişi, alıcıdan haksız ve ayrıcalıktan dolayı, ardından satıcıyı, yani temsilci veya vasiyetçiye talepte bulunur. Çekilme yalnızca üçte biriyle sınırlı değildir; İbn Arafa'nın düzelttiği gibi, El-Mudavvana'nın rivayetlerinin sonucu olarak belirtilen açık değer eksikliği de geçerlidir. {atı:fiqh-mawsua-kuwaitiyya-noor-v3 s.7999} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8000}"
  id: "Opsi perlakuan tidak adil adalah opsi tetap bagi pihak yang dirugikan di beberapa sekolah karena penurunan atau kenaikan harga barang yang dijual menurut penilaian para ahli. Dalam bahasa, tidak adil adalah kekurangan, dan tidak adil dalam penjualan adalah penipuan. Ibn Najim mendefinisikannya sebagai penurunan harga dalam jual beli, dan demikian pula, penurunan nilai tukar dalam kontrak pertukaran lainnya. {cite:fiqh-mawsua-kuwaitiya-noor-v3 hlm.7994} Penipuan memengaruhi banyak bidang, termasuk pertukaran riba antar ras bersatu, monopoli, dan penjualan terlarang seperti ketidakadilan, menerima kargo, menjual hadiah kepada pengirim dan pemilik, menjual atas nama orang lain, menjual kontinu, dan menjual trust. Ibn Qudamah mengambil bentuk penipuan sebagai kerangka untuk tiga opsi: opsi menerima kendaraan, opsi ketidakadilan, dan opsi orang yang tidak adil. Yang terakhir adalah inti dari opsi perlakuan tidak adil karena merupakan pengkhianatan oleh penjual setelah pembeli mengandalkannya dan meninggalkan tawar-menawar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7995} Posisi para aliran bersifat umum: Hanafi tidak menganggap pihak yang dirugikan memiliki pilihan kecuali jika mereka disesatkan oleh pendapat yang berlaku atau jika tidak adil bagi yang masih kecil. Keluarga Malili berpendapat bahwa opsi tersebut adalah untuk yang dirugikan secara mutlak atau jika bersifat berkelanjutan, sementara Hanbalis membatasi diri untuk menegaskannya bagi yang tidak adil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7995} Yang dianggap tidak adil untuk ditolak adalah kasus yang sangat besar, dan menurut Hanafi dan Maliki dalam pandangan yang berlaku dan Hanbali, pendapat tersebut biasanya diperkirakan oleh pedagang, sehingga kriterianya adalah penilaian para penilai. Dalam pendapat kedua Malikis dan Hanbali, dianggap sepertiga, dan dalam pendapat ketiga, menurut Maliki, dianggap lebih dari sepertiga. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7996} Syarat agar opsi ini berlaku adalah pihak yang dirugikan tidak mengetahui keterlibatan mereka dalam kontrak ketidakadilan. Beberapa pemegang opsi ini mengutip hadits Hibban ibn Munqidh, yang menetapkan tidak adanya ketidakadilan. Jika orang tersebut menyadari kesalahan dan lebih tua, maka ia tidak punya pilihan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7996} Opsi ini wajib jika terjadi kontinuitas dan ketidakadilan yang tidak biasa, pilihan antara pembatalan dan penandatanganan bebas tanpa perlu meminta arsip. {cite:fiqh-mawsua-Kuwaitiyya-noor-v3 hlm.. 7996} Pilihan perlakuan tidak adil dengan penipuan dicabut menurut Hanami, sebagaimana dinyatakan dalam Al-Majalla al-Adliyya, terkait kehilangan atau konsumsi barang yang dijual atau perubahan atau cacatnya, dan dengan diam serta bertindak setelah mengetahui kesalahan tersebut, dan setelah kematian orang yang dirugikan, klaim tidak dialihkan kepada ahli waris, tetapi kematian orang yang dirugikan tidak dicegah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7996} {cite:fiqh-mawsua-kuwaitiya-noor-v3 hlm.7997} Pilihan tawar-menawar tidak adil dibatalkan oleh Hanafi, Shafi'i, Hanbali, dan Maliki menurut pandangan yang dipilih, sementara Malikis dan Hanbali membatasi diri pada opsi kontinu (mustarsul). {cite::fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7997} Di antara Hanafi, ada tiga narasi mengenai ketidakadilan besar dan murni dalam penjualan tawar-menawar: tidak ada penolakan sama sekali, penetapan pengembalian secara mutlak, dan bukti bahwa pemiliknya telah ditipu dan merupakan pandangan yang lebih diutamakan. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.7997} 'murat' (kontinu menurut Malikis) adalah orang yang menyerah kepada penjualnya; menurut Hanbalis, orang yang tidak tahu nilai barang yang tidak melakukan penjualan; dan juga dari Ahmad, yang tidak menjual dan mengandalkan kurangnya pengalaman dalam penjualan. Ibn Qudamah mengatakan bahwa seorang ulama yang, jika berhenti, tidak akan tahu pilihan selain terburu-buru dan tidak adil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7997} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7998} Khalil menurut Malikis menyatakan bahwa ia tidak boleh dikembalikan dengan perlakuan tidak adil meskipun bertentangan dengan adat, yang merupakan pandangan yang sudah dikenal. Mazhab berpendapat bahwa ketidakadilan kecil mengikat kontrak berdasarkan kesepakatan. Ibn Rushd menyatakan bahwa tidak ada solusi dalam penjualan barang yang ditipu dan bahwa pelaksanaannya wajib dilakukan secara konsensus dalam rantai transmisi dan ingatan, berdasarkan hadits \"tidak adil dan tidak adil kepada pelaku\" yang diceritakan oleh Al-Tabarani dan dikutip oleh Al-Haythami, yang melemahkan Musa ibn Umair yang buta dalam rantai transmisinya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7998} Hanbal menegaskan opsi perlakuan tidak adil hanya kepada yang tidak adil yang melanjutkan menurut pendapat yang diinginkan, yang merupakan salah satu isu yang dipilih oleh Ibn Taymiyyah. Dalam sebuah riwayat yang disebutkan oleh Ibn Abi Musa dengan kata-kata bahwa perlakuan tidak adil juga diperlukan bagi yang tidak adil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7999} Keluarga Malik menetapkan opsi untuk menyakiti anak di bawah umur jika wali atau agen menyakiti anak yang dipercayakan untuk mencegah bahaya. Kitab Undang-Undang Hukum Putusan Yudisial dalam Pasal 356 menyatakan bahwa keberadaan perlakuan tidak adil semata-mata di properti yatim piatu membatalkan penjualan, begitu juga properti abadi dan kas negara. Opsi dalam kontrak pembelian ditetapkan melalui kesepakatan antara mereka, dan beberapa membatasinya hanya pada opsi tersebut, sehingga penjualan diizinkan melalui penipuan atas nama anak atau pemberi atas nama orang lain, karena penjualan berarti penghapusan kepemilikan. {cite::fiqh-mawsua-kuwaitiyya-noor-v3 hlm.79999} Menurut pandangan mazhab Maliki, menurut pendapat yang berlaku, syaratnya adalah membatalkan penjualan ketika barang tersebut ditetapkan. Jika hilang, tidak dibatalkan dan harga diselesaikan. Barang tersebut dibebaskan dengan menjual barang yang dijual dan setelah barang tersebut kehilangan dan hilang. Jika barang tersebut hilang, prinsipal dan orang yang tidak mampu akan menuntut kembali pembeli atas ketidakadilan dan pilih kasih yang ditimbulkan, maka penjual, yang merupakan agen atau pelaksana wasiat. Penarikan tidak dibatasi pada sepertiga tetapi pada kekurangan nilai yang jelas, sebagaimana telah diperbaiki oleh Ibn Arafa, yang merupakan implikasi dari narasi Al-Mudawwana. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7999} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8000}"
