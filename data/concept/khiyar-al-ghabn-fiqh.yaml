id: concept/khiyar-al-ghabn-fiqh
class: concept
kind: legal
label:
  ar: خيار الغبن
  en: Khiyar al-ghabn (option of fraud in price)
  ur: خیار الغبن
summary:
  ar: 'خيار الغبن هو الخيار الثابت للمغبون في بعض المذاهب لنقصان ثمن المبيع أو زيادته عن تقويم أهل الخبرة، والغبن في اللغة النقص، وغبنه في البيع خدعه، وعرّفه ابن نجيم بالنقص في الثمن في البيع والشراء، ومثله النقص في البدل في باقي عقود المعاوضات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7994} للغبن تأثير في مواطن كثيرة منها المبادلات الربوية بين الأجناس المتحدة والاحتكار والبيوع المنهي عنها كالنجش وتلقي الركبان وبيع الحاضر للبادي والمصراة والبيع على بيع غيره وبيع المسترسل وبيوع الأمانة، واتخذ ابن قدامة من الغبن مدارا لثلاثة خيارات: خيار تلقي الركبان وخيار النجش وخيار المسترسل، وهذا الأخير من صميم خيارات الغبن لأنه خيانة من البائع بعد أن ركن إليه المشتري وترك المساومة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7995} مواقف المذاهب مجملة: فالحنفية لا يرون للمغبون خيارا إلا إذا كان مغررا به على الراجح أو كان غبنا للقاصر، والمالكية في رأي بالخيار للمغبون مطلقا أو إذا كان مسترسلا، والحنابلة يقتصرون على إثباته للمسترسل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7995} الغبن المعتبر للرد هو الفاحش، ومعناه عند الحنفية والمالكية في الراجح والحنابلة في قول ما تقدّره عادة التجار فتكون العبرة بتقويم المقومين، وفي القول الثاني للمالكية والحنابلة المعتبر الثلث، وفي الثالث للمالكية ما زاد على الثلث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7996} ويشترط لقيام الخيار جهل المغبون بوقوعه في الغبن عند التعاقد، واحتج بعض القائلين به بحديث حبان بن منقذ وفيه اشتراط عدم الخلابة، فإن كان عالما بالغبن وأقدم فلا خيار له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7996} موجب الخيار إذا تحقق الاسترسال والغبن الخارج عن المعتاد التخيير بين الفسخ والإمضاء مجانا دون مطالبة بالأرش. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7996} ويسقط خيار الغبن مع التغرير عند الحنفية على ما تضمنته المجلة العدلية بهلاك المبيع أو استهلاكه أو تغيره أو تعيبه، وبالسكوت والتصرف بعد العلم بالغبن، وبموت المغبون فلا تنتقل الدعوى إلى الوارث وأما موت الغابن فلا يمنع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7996}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7997} خيار غبن المساومة منفى عند الحنفية والشافعية والحنابلة وعند المالكية في الراجح، واقتصر المالكية والحنابلة على خيار المسترسل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7997} وعند الحنفية ثلاث روايات في الغبن الفاحش المجرد في بيع المساومة: لا رد مطلقا، وثبوت الرد مطلقا، وثبوته إن صاحبه تغرير وهو الراجح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7997} المسترسل عند المالكية المستسلم لبائعه، وعند الحنابلة الجاهل بقيمة السلعة الذي لا يحسن المبايعة، وعن أحمد أيضا الذي لا يماكس، والمعول على عدم الخبرة بالمبايعة، وقال ابن قدامة إن العالم الذي لو توقف لعرف لا خيار له إذا استعجل فغُبن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7997}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7998} نص خليل عند المالكية على أنه لا يرد بالغبن ولو خالف العادة وهو المشهور وفي المذهب قول بالرد، والغبن اليسير لازم للعقد اتفاقا، وذكر ابن رشد أنه لا قيام بالغبن في بيع المكايسة وأن القيام به واجب بإجماع في الاسترسال والاستنامة لحديث «غبن المسترسل ظلم» الذي أخرجه الطبراني وأورده الهيثمي وضعفه لموسى بن عمير الأعمى في إسناده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7998} الحنابلة يثبتون خيار الغبن للمسترسل فقط على الراجح وهي من المسائل التي اختارها ابن تيمية، وفي رواية ذكرها ابن أبي موسى بصيغة قيل أن الغبن لازم للمسترسل أيضا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7999} أثبت المالكية خيار غبن القاصر إذا غبن الوصي عن القاصر أو الوكيل عمن وكله درءا للضرر، ونصت مجلة الأحكام العدلية في المادة ٣٥٦ على أن وجود الغبن وحده في مال اليتيم يبطل البيع وكذلك مال الوقف وبيت المال، ويثبت الخيار في عقد الشراء اتفاقا بينهم واقتصر عليه بعضهم فأجاز البيع بالغبن عن الصبي أو المتصرف عن الغير لأن البيع إزالة ملك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7999} موجبه عند المالكية على راجح الأقوال نقض البيع في قيام السلعة فإن فاتت فلا نقض ويلجأ إلى تكميل الثمن، ويسقط بالتصرف في المبيع وبالتلف وفواته فإن فات رجع الموكل والمحجور عليه على المشتري بما وقع الغبن والمحاباة به ثم على البائع وهو الوكيل أو الوصي، ولا يتقيد الرجوع بالثلث بل بكل نقص بين عن القيمة كما صوب ابن عرفة وهو مقتضى روايات المدونة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7999}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8000}'
  en: "Khiyar al-ghabn is the option the defrauded party holds in some schools for a price below or above the experts' valuation; ghabn in language is shortfall, and to cheat someone in a sale, and Ibn Najim defines it as a shortfall in the price in sale and purchase, with the like in the counter-value of other exchange contracts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7994} Ghabn has effect in many places, among them riba exchanges between goods of one genus, hoarding, and forbidden sales such as najsh, meeting the caravans, the townsman's sale for the desert-dweller, the musarrah, selling over another's sale, the sale to the trusting buyer (mustarsil), sales of trust, and verbal deceit joined with ghabn; Ibn Qudama made ghabn the pivot of three options: meeting the caravans, najsh and the mustarsil, the last being a true ghabn option as a betrayal by the seller after the buyer relied on him and left bargaining. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7995} The schools in brief: the Hanafis give the defrauded no option unless he was deceived, on the preponderant view, or the ghabn fell on a minor; the Malikis in one view give the option to the defrauded absolutely or if he is a mustarsil; the Hanbalis restrict it to the mustarsil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7995} The ghabn that counts for return is the gross one, defined by the Hanafis, the preponderant Maliki view and one Hanbali view as what traders' custom estimates, the measure being the valuers' assessment; the second Maliki and Hanbali view fixes it at one third, and a third Maliki view at more than a third. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7996} The option requires the defrauded to have been ignorant of the ghabn at the contract; some holders of the option argue from the hadith of Habban ibn Munqidh which includes the stipulation of no cheating, while one who proceeds with knowledge has no option. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7996} Its effect, when trust and unusual ghabn are proved, is the choice between annulment and confirmation without charge, with no claim for the arsh. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7996} On the Hanafi view as contained in the Majalla the option of ghabn with deceit lapses by the goods perishing, being consumed, changed or newly defective, by silence and dealing after knowledge of the ghabn, and by the death of the defrauded, whose claim does not pass to the heir, while the deceiver's death does not prevent it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7996}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7997} The option of ghabn in the bargaining sale is denied by the Hanafis, Shafiis and Hanbalis and by the Malikis on the preponderant view, the Malikis and Hanbalis restricting it to the mustarsil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7997} The Hanafis transmit three views on bare gross ghabn in the bargaining sale: no return at all, return absolutely, and return only when joined with deceit, which is preponderant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7997} The mustarsil is for the Malikis the one who surrenders to his seller, for the Hanbalis the one ignorant of the goods' value who is not skilled in trading, and in another wording from Ahmad the one who does not bargain; the operative trait is inexperience in trading, and Ibn Qudama held that the knowledgeable man who would have known had he paused has no option if he hastened and was defrauded. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7997}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7998} Khalil of the Malikis states there is no return for ghabn even against custom, which is the well-known view though a view of return exists, and slight ghabn binds the contract by agreement; Ibn Rushd recorded no standing against ghabn in the bargaining sale and that standing against it is obligatory by consensus in the istirsal and istinama sale for the hadith of the Prophet's governor 'the ghabn of the mustarsil is wrongdoing', transmitted by al-Tabarani and recorded by al-Haythami who weakened it for Musa ibn Umayr al-A'ma in its chain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7998} The Hanbalis affirm the ghabn option for the mustarsil alone on the preponderant view, among the issues Ibn Taymiyya chose in Ahmad's school, while a transmission noted by Ibn Abi Musa with the wording 'it was said' makes the ghabn binding on the mustarsil too. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7999} The Malikis affirm the option for the ghabn of a guardian over a minor or an agent over his principal to avert harm, and article 356 of the Majalla states that ghabn alone in an orphan's property invalidates the sale, the property of the waqf and the public treasury being alike; the option stands in the contract of purchase by their agreement, some restricting it to that and allowing sale with ghabn by the boy or the one acting for another since sale removes ownership. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7999} On the preponderant Maliki view its effect is rescission while the goods stand, none if they are lost, recourse then being to completing the price; it lapses by dealing in the goods and by their perishing or loss, in which case the principal and the ward recover the ghabn from the buyer, then from the seller who is the agent or guardian; the recovery is not limited to a third but covers every clear shortfall of the value, which Ibn Arafa deemed correct and which the transmissions of the Mudawwana require. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7999}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8000}"
  ur: 'خیار الغبن بعض مذاہب میں مغبون کو دیا گیا وہ اختیار ہے جس سے وہ مبیع کی قیمت میں اہل خبرہ کی تقویم سے کمی یا زیادتی پر عقد کوئی فسخ کر سکتا ہے؛ غبن لغت میں کمی ہے، اور بیع میں غبن دھوکہ ہے، ابن نجیم کے نزدیک بیع و شراء میں ثمن کی کمی ہے اور دیگر معاوضہ عقود میں بدل کی کمی اسی طرح ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7994} غبن کے اثر کے مواقع بہت ہیں جن میں متحدہ اجناس کی ربوی مبادلہ، احتکار، اور منع شدہ بیع جیسے نجش، تلقی الرکبان، حاضر کا بادی کو بیچنا، مصراۃ، دوسرے کی بیع پر بیع، مسترسل کو بیچنا، بیع الامانہ اور قولی تغریر مع غبن شامل ہیں؛ ابن قدامہ نے غبن کو تین خیارات کا مدار بنایا: تلقی الرکبان، نجش اور مسترسل، اور آخری خیار عیین غبن ہے کیونکہ یہ مشتری کے اعتماد کے بعد بائع کی خیانت ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7995} مذاہب کا خلاصہ: حنفیہ مغبون کو خیار نہیں دیتے مگر راجح قول میں تغریر شدہ کو یا قاصر کے غبن میں؛ مالکیہ کا ایک قول مطلقاً مغبون کو یا مسترسل کو خیار دیتا ہے؛ حنابلہ صرف مسترسل پر قیام رکھتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7995} رد کے قابل غبن صرف فاحش ہے، اور حنفیہ، مالکیہ کی راجح رائے اور حنابلہ کے ایک قول میں اس کا مدار تاجروں کی عادت اور مقومین کی تقویم ہے؛ مالکیہ و حنابلہ کے دوسرے قول میں معیار ایک تہائی ہے اور مالکیہ کے تیسرے قول میں تہائی سے زائد۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7996} خیار کی شرط یہ ہے کہ مغبون عقد کے وقت غبن سے ناواقف ہو؛ بعض قائلین حبان بن منقذ کی حدیث سے استدلال کرتے ہیں جس میں خلابت نہ ہونے کی شرط آئی ہے، اور جان بوجھ کر آگے بڑھنے والے کو خیار نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7996} استرسال اور غیر معمولی غبن ثابت ہو تو موجب فسخ یا امضاء کا اختیار ہے بغیر ارش کے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7996} مجلۃ احکام عدلیہ کے مطابق حنفیہ کے ہاں تغریر کے ساتھ خیار غبن مبیع کے ہلاک، مستعمل، بدل یا معیوب ہونے سے، علم کے بعد تصرف سے، اور مغبون کی موت سے ساقط ہوتا ہے اور دعویٰ وارث کو منتقل نہیں ہوتا، مگر غابن کی موت مانع نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7996}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7997} مساومہ کی بیع میں خیار غبن حنفیہ، شافعیہ اور حنابلہ کے نزدیک اور مالکیہ کی راجح رائے میں نہیں؛ مالکیہ و حنابلہ نے اسے مسترسل تک محدود کیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7997} حنفیہ کے ہاں مساومہ میں مجرد غبن فاحش کی تین روایتیں ہیں: مطلقاً رد نہیں، مطلقاً رد ثابت، اور صرف تغریر کے ساتھ رد جو راجح ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7997} مسترسل مالکیہ کے نزدیک اپنے بائع پر ہار ماننے والا ہے، حنابلہ کے نزدیک قیمت سے ناواقف اور مبايعہ نہ جاننے والا، اور احمد سے ایک اور تعبیر میں جو مماکسہ نہیں کرتا؛ معیار مبايعہ کی تجربہ کاری نہ ہونا ہے، اور ابن قدامہ کے نزدیک جاننے والا جو رک کر جان سکتا ہو جلدی کر کے غبن کھائے تو اسے خیار نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7997}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7998} مالکیہ کے خلیل کے نزدیک غبن پر رد نہیں خواہ عادت کے خلاف ہو اور یہی مشہور ہے اگرچہ رد کا ایک قول بھی ہے، اور معمولی غبن پر عقد اتفاقاً لازم ہے؛ ابن رشد نے مقدمات میں لکھا کہ مکایسہ کی بیع میں غبن پر قیام نہیں اور استرسال و استنامہ میں اجماعاً قیام واجب ہے، حدیث «غبن المسترسل ظلم» کی بنا پر جو طبرانی نے نکالی اور ہیثمی نے درج کیا مگر موسیٰ بن عمیر اعمیٰ کے سبب ضعیف قرار دی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7998} حنابلہ راجح مذہب میں صرف مسترسل کو خیار غبن دیتے ہیں اور یہ ابن تیمیہ کے چنے ہوئے مسائل میں ہے؛ ابن ابی موسیٰ کی روایت «قيل» کے اسلوب میں مسترسل پر بھی غبن کو لازم مانتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7999} مالکیہ نے وصی کے قاصر یا وکیل کے موکل کو غبن پہنچانے کی صورت میں ضرر روکنے کے لیے خیار ثابت کیا، اور مجلہ کی دفعہ ٣٥٦ میں ہے کہ یتیم کے مال میں تنہا غبن بیع کو باطل کرتا ہے اور وقف و بیت المال بھی اسی حکم میں ہیں؛ شراء کے عقد میں اتفاقاً خیار ہے اور بعض نے اسی تک محدود کیا چنانچہ صبی یا غیر کے لیے تصرف کرنے والے کا غبن والا بیع جائز ٹھہرا کیونکہ بیع ملکیت زائل کرتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7999} راجح مالکی قول میں اس کا موجب سلعت کے قائم رہتے نقض بیع ہے اور فوت ہونے پر ثمن کی تکمیل؛ یہ خیار مبیع میں تصرف اور تلف و فوات سے ساقط ہوتا ہے جس پر موکل اور محجور علیہ خریدار سے غبن کی رقم وصول کریں، نہ ممکن ہو تو بائع جو وکیل یا وصی ہے سے؛ اور وصولی تہائی تک محدود نہیں بلکہ قیمت کی ہر واضح کمی پر ہے جیسا ابن عرفہ نے درست کہا اور مدونہ کی روایات کا تقاضا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7999}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8000}'
