class: concept
kind: scientific
label: { ar: "رجوع الكواكب المتحيرة واستقامتها بالمقامين", en: "Retrogression and direct motion of the wandering planets by two limits", ur: "متحیر سیاروں کا رجوع اور استقامت دو مقاموں سے", es: "Retroceso y movimiento directo de los planetas errantes por dos límites", fr: "Rétrogression et mouvement direct des planètes errantes par deux limites" }
summary:
  ar: "يُدخل مركز الكوكب المعدل بالجدول الثالث في سطري العدد المتفاضلين بستة أجزاء في جداول رجوع الكواكب، ويُؤخذ ما بإزائه في جدول الكوكب، فيُثبت المقام الأول من الجدول الأول والمقام الثاني من الجدول الثاني. فإن وقعت الخاصة المعدلة بين المقامين، أي أقل من الثاني وأكثر من الأول، فالكوكب راجع. وإن زادت على الثاني ونقصت عن الأول فهو مستقيم السير. {cite:zij-sabi-nallino-byblion p.177}"
  en: "The corrected centre of the planet is entered in the two rows of the retrogression tables that differ by six parts, and the matching values are taken from the table of the planet. The first limit comes from the first table and the second from the second table. If the corrected anomaly lies between the two limits, that is less than the second and more than the first, the planet is retrograde. If it is above the second limit and below the first, the planet moves direct. {cite:zij-sabi-nallino-byblion p.177}"
  ur: "سیارے کا تصحیح شدہ مرکز رجوع کے جدولوں کی ان دو قطاروں میں داخل کیا جاتا ہے جو چھ اجزا کے فرق سے ہیں، اور اس سیارے کے جدول سے مطابق قیمتیں لی جاتی ہیں۔ پہلی حد پہلے جدول سے اور دوسری حد دوسرے جدول سے ہے۔ اگر تصحیح شدہ خاصہ دونوں حدوں کے درمیان ہو، یعنی دوسری سے کم اور پہلی سے زیادہ، تو سیارہ راجع ہے۔ اگر وہ دوسری سے زیادہ اور پہلی سے کم ہو تو سیارہ مستقیم چلتا ہے۔ {cite:zij-sabi-nallino-byblion p.177}"
  es: "El centro corregido del planeta se introduce en las dos filas de las tablas de retrogradación que difieren en seis partes, y los valores correspondientes se toman de la tabla del planeta. El primer límite proviene de la primera tabla y el segundo de la segunda. Si la anomalía corregida se encuentra entre los dos límites, es decir, menor que el segundo y mayor que el primero, el planeta está retrógrado. Si está por encima del segundo límite y por debajo del primero, el planeta se mueve directo. {cite:zij-sabi-nallino-byblion p.177}"
  fr: "Le centre corrigé de la planète est inscrit dans les deux lignes des tables de rétrogradation, qui diffèrent de six points, et les valeurs correspondantes sont extraites de la table de la planète. La première limite provient de la première table et la seconde de la seconde. Si l'anomalie corrigée se situe entre les deux limites (inférieure à la seconde et supérieure à la première), la planète est rétrograde. Si elle est supérieure à la seconde limite et inférieure à la première, la planète est directe. {cite:zij-sabi-nallino-byblion p.177}"
