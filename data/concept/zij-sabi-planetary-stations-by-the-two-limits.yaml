label: { ar: "رجوع الكواكب المتحيرة واستقامتها بالمقامين", en: "Retrogression and direct motion of the wandering planets by two limits", ur: "متحیر سیاروں کا رجوع اور استقامت دو مقاموں سے" }
summary:
  ar: "يُدخل مركز الكوكب المعدل بالجدول الثالث في سطري العدد المتفاضلين بستة أجزاء في جداول رجوع الكواكب، ويُؤخذ ما بإزائه في جدول الكوكب، فيُثبت المقام الأول من الجدول الأول والمقام الثاني من الجدول الثاني. فإن وقعت الخاصة المعدلة بين المقامين، أي أقل من الثاني وأكثر من الأول، فالكوكب راجع. وإن زادت على الثاني ونقصت عن الأول فهو مستقيم السير. {cite:zij-sabi-nallino-byblion p.177}"
  en: "The corrected centre of the planet is entered in the two rows of the retrogression tables that differ by six parts, and the matching values are taken from the table of the planet. The first limit comes from the first table and the second from the second table. If the corrected anomaly lies between the two limits, that is less than the second and more than the first, the planet is retrograde. If it is above the second limit and below the first, the planet moves direct. {cite:zij-sabi-nallino-byblion p.177}"
  ur: "سیارے کا تصحیح شدہ مرکز رجوع کے جدولوں کی ان دو قطاروں میں داخل کیا جاتا ہے جو چھ اجزا کے فرق سے ہیں، اور اس سیارے کے جدول سے مطابق قیمتیں لی جاتی ہیں۔ پہلی حد پہلے جدول سے اور دوسری حد دوسرے جدول سے ہے۔ اگر تصحیح شدہ خاصہ دونوں حدوں کے درمیان ہو، یعنی دوسری سے کم اور پہلی سے زیادہ، تو سیارہ راجع ہے۔ اگر وہ دوسری سے زیادہ اور پہلی سے کم ہو تو سیارہ مستقیم چلتا ہے۔ {cite:zij-sabi-nallino-byblion p.177}"
