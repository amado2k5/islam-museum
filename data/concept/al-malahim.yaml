label:
  ar: الملاحم
  en: The Epic Signs
  ur: ملحم
summary:
  ar: "الملاحم في القرآن والسنة: الوقائع العظيمة التي تحدث في آخر الزمان من الفتن والحروب، يذكر أنها من أشراط الساعة، وأن فيها من الأحداث ما لا يتصور، وأن الله يقضيها."
  en: "The epic signs in Qur'an and Sunnah: the great events of the last days among trials and wars — a sign of the Hour, including events beyond imagination, which God decrees."
  ur: "ملحم قرآن و سنت میں: آخری زمانے کے عظیم واقعات جو فتنے اور جنگوں میں ہوتے ہیں — ساعت کی نشانیوں میں سے، جن میں ناقابلِ تصور واقعات بھی ہیں، جن کا فیصلہ اللہ کرتا ہے۔"
