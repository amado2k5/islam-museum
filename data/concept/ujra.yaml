id: concept/ujra
class: concept
kind: legal
label: { ar: "أجرة", en: "Rent, fee or wage (ujra)" }
summary:
  ar: "الأجرة لغة وشرعاً بدل المنفعة، وهي ما يعطاه الأجير في مقابلة العمل، وما يعطاه صاحب العين مقابل الانتفاع بها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1593} ويجوز أن يكون بدل المنفعة ما يصلح ثمناً من عرض أو منفعة أو نقد حال أو مؤجل، ولا يصح العقد بأجرة مجهولة، ولا بجزء من المعمول، كمن يستأجر من يسلخ شاة بجلدها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1593} ولا يصلح الخمر والخنزير أجرة إلا للذميين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1593} وتفصيل ذلك في الإجارة، ويُذكر أخذ الأجرة على القربات في باب الأذان والحج والجهاد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1593}"
  en: "Ujra, lexically and in law, is the counterpart of a benefit: what a worker receives for his labour, and what the owner of a thing receives for its use. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1593} A rent may be anything that may serve as a price, whether goods, another benefit, or money, paid at once or deferred. A contract with an unknown rent, or with a rent that is part of the work done, such as hiring a man to skin a sheep for its hide, is not valid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1593} Wine and pork may serve as rent only for non-Muslims. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1593} The details belong under the lease; taking a fee for acts of worship is treated under the call to prayer, pilgrimage and jihad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1593}"
