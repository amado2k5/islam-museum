label: { ar: "أجرة", en: "Rent, fee or wage (ujra)", es: "Alquiler, tasa o salario (ujra)", fr: "Loyer, frais ou salaire (ujra)", ur: "کرایہ، فیس یا اجرت ⁦(اوجرا)⁩", tr: "Ücret", id: "Tarif" }
summary:
  ar: "الأجرة لغة وشرعاً بدل المنفعة، وهي ما يعطاه الأجير في مقابلة العمل، وما يعطاه صاحب العين مقابل الانتفاع بها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1593} ويجوز أن يكون بدل المنفعة ما يصلح ثمناً من عرض أو منفعة أو نقد حال أو مؤجل، ولا يصح العقد بأجرة مجهولة، ولا بجزء من المعمول، كمن يستأجر من يسلخ شاة بجلدها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1593} ولا يصلح الخمر والخنزير أجرة إلا للذميين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1593} وتفصيل ذلك في الإجارة، ويُذكر أخذ الأجرة على القربات في باب الأذان والحج والجهاد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1593}"
  en: "Ujra, lexically and in law, is the counterpart of a benefit: what a worker receives for his labour, and what the owner of a thing receives for its use. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1593} A rent may be anything that may serve as a price, whether goods, another benefit, or money, paid at once or deferred. A contract with an unknown rent, or with a rent that is part of the work done, such as hiring a man to skin a sheep for its hide, is not valid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1593} Wine and pork may serve as rent only for non-Muslims. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1593} The details belong under the lease; taking a fee for acts of worship is treated under the call to prayer, pilgrimage and jihad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1593}"
  es: "Ujra, tanto en el lenguaje como en el derecho, es la contraparte de un beneficio: lo que un trabajador recibe por su labor y lo que el propietario de una cosa recibe por su uso. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1593} Un alquiler puede ser cualquier cosa que sirva como precio, ya sean bienes, otro beneficio o dinero, pagado de inmediato o diferido. Un contrato con un alquiler desconocido, o con un alquiler que sea parte del trabajo realizado, como contratar a un hombre para despellejar una oveja por su piel, no es válido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1593} El vino y la carne de cerdo pueden servir como alquiler solo para los no musulmanes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1593} Los detalles corresponden al contrato de arrendamiento; el cobro de una tarifa por actos de culto se trata dentro de la llamada a la oración, la peregrinación y la yihad. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1593}"
  fr: "L'ujra, au sens lexical et juridique, est l'équivalent d'un avantage: ce qu'un travailleur reçoit pour son travail et ce que le propriétaire d'un bien reçoit pour son usage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1593} Le loyer peut être tout ce qui peut servir de prix, qu'il s'agisse de biens, d'un autre avantage ou d'argent, payé immédiatement ou à terme. Un contrat prévoyant un loyer inconnu ou un loyer assimilable au travail effectué, comme l'embauche d'un homme pour dépecer un mouton, est nul. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1593} Le vin et le porc ne peuvent servir de loyer que pour les non-musulmans. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1593} Les détails relèvent du bail; la perception d'une rémunération pour des actes de culte est traitée dans le cadre de l'appel à la prière, du pèlerinage et du jihad. {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.1593}"
  ur: "عجرا، لغوی اور قانون کے لحاظ سے، فائدے کا ہمنوا ہے: ایک مزدور کو اس کی محنت کے بدلے کیا ملتا ہے، اور کسی چیز کے مالک کو اس کے استعمال کے بدلے کیا ملتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1593} کرایہ کوئی بھی چیز ہو سکتی ہے جو قیمت کے طور پر کام کر سکتی ہے، خواہ سامان، کوئی دوسرا فائدہ، یا رقم، ایک ہی وقت میں ادا کی گئی ہو یا موخر کر دی گئی ہو۔ نامعلوم کرایہ کے ساتھ معاہدہ، یا کرایہ کے ساتھ جو کام کیے گئے کام کا حصہ ہے، جیسے کہ کسی آدمی کو اس کی کھال کے لیے بھیڑ کا چمڑا دینا، درست نہیں ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1593} شراب اور سور کا گوشت صرف غیر مسلموں کے لیے کرایہ کے طور پر دیا جا سکتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1593} تفصیلات کرایہ کے تحت ہیں۔ عبادات کے لیے فیس لینا اذان، حج اور جہاد کے تحت سمجھا جاتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 1593}"
  tr: "Dilsel ve dini olarak ücret, çalışanın iş karşılığında verdiği ve mülk sahibinin bundan fayda elde etmek karşılığında verdiği faydanın yerine geçer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1593} Bir yardım, yardım, nakit peşin veya ertelenmiş olarak ödeme yapmak mümkündür. Bir sözleşme, bilinmeyen bir ücret veya yapılan bir kısmı için geçerli değildir; örneğin birini koyunun derisiyle yüzmek için işe almak gibi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1593} Şarap ve domuz eti sadece zimmiler için ücret olarak geçerlidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1593} ve bu kira sözleşmesinde detaylandırılır; ayrıca ezan çağrısı, hac ve cihat bölümünde belirtilmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1593}"
  id: "Upah secara linguistik dan agama adalah pengganti manfaat, yaitu apa yang diberikan karyawan sebagai imbalan atas pekerjaan dan apa yang diberikan pemilik properti sebagai imbalan atas manfaatnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1593} Diperbolehkan membayar untuk manfaat, manfaat, uang tunai di muka, atau yang ditunda. Kontrak tidak berlaku untuk biaya yang tidak diketahui atau sebagian dari yang telah dilakukan, seperti menyewa seseorang untuk menguliti domba dengan kulitnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1593} Anggur dan daging babi hanya berlaku sebagai upah untuk dhimmi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1593} dan merinci hal ini dalam sewa, dan disebutkan dalam bab tentang ajakan shalat, Haji, dan jihad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1593}"
