perspectives:
  - tradition: sunni
    id: ibn-hajar-tarjih
    stance: { ar: "تُقبل ما لم تنافِ رواية الأوثق، وإلا فالترجيح", en: "Accepted unless it contradicts a more reliable report; otherwise the two are weighed", ur: "مقبول جب تک زیادہ ثقہ کی روایت کے منافی نہ ہو، ورنہ ترجیح" }
    summary: { ar: "ابن حجر: هذا هو المنقول عن أئمة الحديث المتقدمين كابن مهدي والقطان وأحمد وابن معين وابن المديني والبخاري وأبي زرعة وأبي حاتم والنسائي والدارقطني: اعتبار الترجيح، ولا يُعرف عن أحد منهم إطلاق قبول الزيادة.", en: "Ibn Hajar: this is what is reported of the early hadith imams such as Ibn Mahdi, al-Qattan, Ahmad, Ibn Ma'in, Ibn al-Madini, al-Bukhari, Abu Zur'a, Abu Hatim, al-Nasa'i and al-Daraqutni: weighing the reports; none of them is known to have accepted additions without qualification.", ur: "ابن حجر: متقدم ائمۂ حدیث جیسے ابن مہدی، قطان، احمد، ابن معین، ابن المدینی، بخاری، ابو زرعہ، ابو حاتم، نسائی اور دارقطنی سے یہی منقول ہے: ترجیح کا اعتبار؛ ان میں سے کسی سے اضافے کا مطلق قبول معروف نہیں۔" }
    holders: [person/ibn-hajar-al-asqalani]
    sources: [source/nuzhat-al-nazar-itr-bushra-2011]
  - tradition: sunni
    id: qabul-mutlaq
    stance: { ar: "تُقبل مطلقاً", en: "Accepted without qualification", ur: "مطلقاً مقبول" }
    summary: { ar: "اشتهر عن جمع من العلماء، ومنهم كثير من الشافعية بحسب ابن حجر، القول بقبول الزيادة مطلقاً من غير تفصيل؛ ويرد ابن حجر بأن نص الشافعي نفسه يدل على غير ذلك.", en: "Accepting additions without distinction is well known from a group of scholars, including many Shafi'is according to Ibn Hajar; Ibn Hajar answers that al-Shafi'i's own text indicates otherwise.", ur: "علما کی ایک جماعت سے، اور ابن حجر کے مطابق بہت سے شافعیوں سے، اضافے کو بلا تفصیل مطلقاً قبول کرنا مشہور ہے؛ ابن حجر جواب دیتے ہیں کہ خود شافعی کی عبارت اس کے خلاف دلالت کرتی ہے۔" }
    sources: [source/nuzhat-al-nazar-itr-bushra-2011]
