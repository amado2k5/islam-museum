id: concept/ziyadat-al-thiqa
class: concept
kind: term
label: { ar: "زيادة الثقة", en: "The trustworthy narrator's addition (ziyadat al-thiqa)", ur: "زیادۃ الثقہ" }
summary:
  ar: "ما ينفرد به الثقة في رواية الحديث من لفظة أو جملة في المتن أو السند؛ وعند ابن حجر في نزهة النظر تُقبل زيادة راوي الصحيح والحسن ما لم تقع منافية لرواية من هو أوثق، فإن نافتها رُجّح بينهما، وينكر إطلاق قبولها مطلقاً لأنه لا يتأتى على طريقة المحدثين الذين يشترطون انتفاء الشذوذ {cite:nuzhat-al-nazar-itr-bushra-2011 p. 63-65}."
  en: "What a trustworthy narrator alone adds in transmitting a hadith, a word or phrase in the text or the chain. For Ibn Hajar in Nuzhat al-Nazar the addition of a narrator of sound or good hadith is accepted unless it contradicts the report of someone more reliable, in which case the two are weighed; he rejects accepting additions without qualification, since that is inconsistent with the hadith scholars' requirement that a sound report be free of irregularity {cite:nuzhat-al-nazar-itr-bushra-2011 p. 63-65}."
  ur: "وہ لفظ یا جملہ جو ثقہ راوی حدیث کی روایت میں متن یا سند میں اکیلا بڑھاتا ہے۔ ابن حجر کے نزدیک نزہۃ النظر میں صحیح اور حسن کے راوی کا اضافہ مقبول ہے جب تک وہ زیادہ ثقہ راوی کی روایت کے منافی نہ ہو، اور منافی ہو تو دونوں میں ترجیح دی جاتی ہے؛ وہ اضافے کو مطلقاً قبول کرنے کو رد کرتے ہیں کیونکہ یہ محدثین کی اس شرط سے میل نہیں کھاتا کہ صحیح حدیث شذوذ سے خالی ہو {cite:nuzhat-al-nazar-itr-bushra-2011 p. 63-65}۔"
