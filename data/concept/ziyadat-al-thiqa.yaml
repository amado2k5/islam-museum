id: concept/ziyadat-al-thiqa
class: concept
kind: term
label:
  ar: "زيادة الثقة"
  en: "Additions by trustworthy narrators (ziyadat al-thiqa)"
summary:
  ar: "زيادات الثقات فن لطيف عند ابن الصلاح. حكى الخطيب أن مذهب الجمهور من الفقهاء وأصحاب الحديث قبول الزيادة من الثقة إذا تفرد بها، خلافاً لمن ردها مطلقاً أو ردها من الراوي نفسه وقبلها من غيره. وقسّم ابن الصلاح ما ينفرد به الثقة ثلاثة أقسام: المخالف المنافي لما رواه الثقات فيُرد، وما لا منافاة فيه فيُقبل، وما بينهما كزيادة لفظة لم يذكرها سائر الرواة مثل «من المسلمين» في زكاة الفطر. ويتصل به اختلاف الوصل والإرسال والرفع والوقف، وقد حكم البخاري لمن وصل «لا نكاح إلا بولي» {cite:muqaddima-ibn-salah-itr p. 71-72}{cite:muqaddima-ibn-salah-itr p. 85-88}{cite:kifaya-khatib-hyderabad-1357 p. 411}."
  en: "For Ibn al-Salah additions by trustworthy narrators are a subtle art. Al-Khatib reported that most jurists and hadith scholars accept an addition from a trustworthy narrator even when he is alone in it, against those who reject it altogether or reject it from the same narrator while accepting it from another. Ibn al-Salah divides a trustworthy narrator's solitary material into three: what contradicts the other trustworthy narrators, rejected; what involves no contradiction, accepted; and what lies between, such as an extra phrase the others omit, like 'from among the Muslims' in the hadith of zakat al-fitr. Linked to it are conflicts between connected and mursal or raised and stopped versions; al-Bukhari ruled for those who connected 'no marriage without a guardian'."
