id: concept/ziyadat-al-thiqa
class: concept
kind: term
label: { ar: "زيادة الثقة", en: "The trustworthy narrator's addition (ziyadat al-thiqa)", ur: "زیادۃ الثقہ" }
summary:
  ar: "ما ينفرد به الثقة في رواية الحديث من لفظة أو جملة في المتن أو السند؛ وعند ابن حجر في نزهة النظر تُقبل زيادة راوي الصحيح والحسن ما لم تقع منافية لرواية من هو أوثق، فإن نافتها رُجّح بينهما، وينكر إطلاق قبولها مطلقاً لأنه لا يتأتى على طريقة المحدثين الذين يشترطون انتفاء الشذوذ {cite:nuzhat-al-nazar-itr-bushra-2011 p. 63-65}. زيادات الثقات فن لطيف عند ابن الصلاح. حكى الخطيب أن مذهب الجمهور من الفقهاء وأصحاب الحديث قبول الزيادة من الثقة إذا تفرد بها، خلافاً لمن ردها مطلقاً أو ردها من الراوي نفسه وقبلها من غيره. وقسّم ابن الصلاح ما ينفرد به الثقة ثلاثة أقسام: المخالف المنافي لما رواه الثقات فيُرد، وما لا منافاة فيه فيُقبل، وما بينهما كزيادة لفظة لم يذكرها سائر الرواة مثل «من المسلمين» في زكاة الفطر. ويتصل به اختلاف الوصل والإرسال والرفع والوقف، وقد حكم البخاري لمن وصل «لا نكاح إلا بولي» {cite:muqaddima-ibn-salah-itr p. 71-72}{cite:muqaddima-ibn-salah-itr p. 85-88}{cite:kifaya-khatib-hyderabad-1357 p. 411}."
  en: "What a trustworthy narrator alone adds in transmitting a hadith, a word or phrase in the text or the chain. For Ibn Hajar in Nuzhat al-Nazar the addition of a narrator of sound or good hadith is accepted unless it contradicts the report of someone more reliable, in which case the two are weighed; he rejects accepting additions without qualification, since that is inconsistent with the hadith scholars' requirement that a sound report be free of irregularity {cite:nuzhat-al-nazar-itr-bushra-2011 p. 63-65}. For Ibn al-Salah additions by trustworthy narrators are a subtle art. Al-Khatib reported that most jurists and hadith scholars accept an addition from a trustworthy narrator even when he is alone in it, against those who reject it altogether or reject it from the same narrator while accepting it from another. Ibn al-Salah divides a trustworthy narrator's solitary material into three: what contradicts the other trustworthy narrators, rejected; what involves no contradiction, accepted; and what lies between, such as an extra phrase the others omit, like 'from among the Muslims' in the hadith of zakat al-fitr. Linked to it are conflicts between connected and mursal or raised and stopped versions; al-Bukhari ruled for those who connected 'no marriage without a guardian'."
  ur: "وہ لفظ یا جملہ جو ثقہ راوی حدیث کی روایت میں متن یا سند میں اکیلا بڑھاتا ہے۔ ابن حجر کے نزدیک نزہۃ النظر میں صحیح اور حسن کے راوی کا اضافہ مقبول ہے جب تک وہ زیادہ ثقہ راوی کی روایت کے منافی نہ ہو، اور منافی ہو تو دونوں میں ترجیح دی جاتی ہے؛ وہ اضافے کو مطلقاً قبول کرنے کو رد کرتے ہیں کیونکہ یہ محدثین کی اس شرط سے میل نہیں کھاتا کہ صحیح حدیث شذوذ سے خالی ہو {cite:nuzhat-al-nazar-itr-bushra-2011 p. 63-65}۔"
