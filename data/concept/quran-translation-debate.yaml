label: { ar: "مسألة ترجمة القرآن الكريم وإقامة الصلاة بالترجمة", en: "The debate over translating the Qur'an and praying in translation", es: "El debate sobre la traducción del Corán y la oración en traducción", fr: "Le débat sur la traduction du Coran et la prière en traduction", ur: "قرآن کا ترجمہ کرنے اور ترجمے میں نماز پڑھنے کی بحث", tr: "Kuran-ı Kerim'in çevirisi ve çeviri yoluyla namazın kurulması konusu", id: "Masalah penerjemahan Al-Qur'an dan menetapkan doa melalui terjemahan" }
summary:
  ar: "يعرض شكيب أرسلان في تعليقه على حاضر العالم الإسلامي نقاش العلماء حول ترجمة القرآن إلى اللغات غير العربية وإقامة الصلاة بها. ويذكر أن الحنفية والحنابلة أجازوا ترجمته للتعليم والتفهيم، وأن الشافعي أجازه في قول، وأن مالكاً منعه، وأن قراءته بغير العربية أو كتابة المصحف بلغة أخرى أو بخط غير العثماني ممنوعة. ويذكر أن المسألة اشتدت في تركيا عام 1932 حين بدأ بعضهم يصلي بالتركية. ويعرض الكتاب هذه الآراء كما نقلها المؤلف، ويرجّح رأيه في وجوب الحفاظ على النص العربي."
  en: "In Arslan's commentary, scholars disagree over translating the Qur'an and praying in other languages. He reports that Hanafis and Hanbalis permitted translation for teaching and explanation, a Shafi'i opinion did the same, and Malik forbade it; reading or writing the scripture in another language is forbidden. He reports the dispute flared in Turkey in 1932 when some began praying in Turkish. The entry records these positions as the commentator reports them; Arslan's own preference is for keeping the Arabic text."
  es: "En el comentario de Arslan, los eruditos discrepan sobre la traducción del Corán y la oración en otros idiomas. Arslan informa que los hanafíes y los hanbalíes permitieron la traducción con fines didácticos y explicativos, una opinión shafi'í hizo lo mismo, y Malik la prohibió; leer o escribir las escrituras en otro idioma está prohibido. Relata que la disputa se intensificó en Turquía en 1932 cuando algunos comenzaron a orar en turco. La entrada recoge estas posturas tal como las presenta el comentarista; Arslan prefiere conservar el texto árabe."
  fr: "Dans son commentaire, Arslan rapporte que les érudits divergent quant à la traduction du Coran et à la prière en d'autres langues. Il indique que les hanafites et les hanbalites autorisent la traduction à des fins d'enseignement et d'explication, de même qu'une opinion chaféite, tandis que Malik l'interdit; la lecture ou l'écriture du Coran dans une autre langue est proscrite. Il précise que la controverse s'est enflammée en Turquie en 1932 lorsque certains ont commencé à prier en turc. Le commentaire relate ces positions telles que rapportées par l'auteur; Arslan lui-même privilégie la conservation du texte arabe."
  ur: "ارسلان کی تفسیر میں قرآن کا ترجمہ کرنے اور دوسری زبانوں میں نماز پڑھنے پر علماء کا اختلاف ہے۔ وہ روایت کرتے ہیں کہ حنفیہ اور حنبلیوں نے درس و تفسیر کے لیے ترجمہ کی اجازت دی، ایک شافعی نے ایسا ہی کیا، اور مالک نے منع کیا۔ دوسری زبان میں کلام پڑھنا یا لکھنا منع ہے۔ وہ بتاتے ہیں کہ تنازعہ 1932 میں ترکی میں اس وقت بھڑک اٹھا جب کچھ لوگوں نے ترکی میں نماز ادا کرنا شروع کی۔ اندراج ان پوزیشنوں کو ریکارڈ کرتا ہے جیسا کہ تبصرہ نگار ان کی رپورٹ کرتا ہے۔ ارسلان کی اپنی ترجیح عربی متن کو رکھنا ہے۔"
  tr: "Şakib Arslan, günümüz İslam dünyası üzerine yaptığı yorumda, Kur'an'ın Arapça olmayan dillere çevrilmesi ve bu dillerde namaz kurma konusundaki alimlerin tartışmasını sunar. Hanafi ve Hanbalilerin öğretim ve anlama amacıyla çevirisine izin verdiğini, El-Şafii'nin bazı kelimelerle izin verdiğini, Malik'in yasakladığını ve Arapça dışında okumanın veya Muşaf'ı Osmanlı dışında başka bir dilde veya alfabede yazmanın yasak olduğunu belirtir. Sorunun, 1932'de bazılarının Türkçe namaz kılmaya başlamasıyla Türkiye'de daha da yoğunlaştığı belirtilir. Kitap, yazarın aktardığı bu görüşleri sunar ve Arapça metnin korunması gerekliliği konusundaki görüşünü destekler."
  id: "Shakib Arslan menyampaikan dalam komentarnya tentang dunia Islam saat ini perdebatan para ulama tentang menerjemahkan Al-Qur'an ke dalam bahasa non-Arab dan menetapkan shalat di dalamnya. Ia menyebutkan bahwa Hanafi dan Hanbal mengizinkan terjemahannya untuk pengajaran dan pemahaman, bahwa Al-Shafi'i mengizinkannya dalam beberapa kata, bahwa Malik melarangnya, dan bahwa membacanya di luar bahasa Arab atau menulis Mushaf dalam bahasa lain atau dalam aksara selain Ottoman dilarang. Disebutkan bahwa masalah ini semakin memanas di Turki pada tahun 1932 ketika beberapa orang mulai berdoa dalam bahasa Turki. Buku ini menyajikan pandangan ini sebagaimana disampaikan oleh penulis, dan mendukung pandangannya tentang pentingnya melestarikan teks Arab."
