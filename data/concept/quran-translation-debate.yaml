label: { ar: "مسألة ترجمة القرآن الكريم وإقامة الصلاة بالترجمة", en: "The debate over translating the Qur'an and praying in translation" }
summary:
  ar: "يعرض شكيب أرسلان في تعليقه على حاضر العالم الإسلامي نقاش العلماء حول ترجمة القرآن إلى اللغات غير العربية وإقامة الصلاة بها. ويذكر أن الحنفية والحنابلة أجازوا ترجمته للتعليم والتفهيم، وأن الشافعي أجازه في قول، وأن مالكاً منعه، وأن قراءته بغير العربية أو كتابة المصحف بلغة أخرى أو بخط غير العثماني ممنوعة. ويذكر أن المسألة اشتدت في تركيا عام 1932 حين بدأ بعضهم يصلي بالتركية. ويعرض الكتاب هذه الآراء كما نقلها المؤلف، ويرجّح رأيه في وجوب الحفاظ على النص العربي."
  en: "In Arslan's commentary, scholars disagree over translating the Qur'an and praying in other languages. He reports that Hanafis and Hanbalis permitted translation for teaching and explanation, a Shafi'i opinion did the same, and Malik forbade it; reading or writing the scripture in another language is forbidden. He reports the dispute flared in Turkey in 1932 when some began praying in Turkish. The entry records these positions as the commentator reports them; Arslan's own preference is for keeping the Arabic text."
