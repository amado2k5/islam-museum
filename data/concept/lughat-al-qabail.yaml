id: concept/lughat-al-qabail
class: concept
kind: term
tags: [arabiyya-browser, arabiyya-dialects]
label:
  ar: "لغات القبائل ولسان قريش"
  en: "The dialects of the tribes and the tongue of Quraysh"
  ur: "قبائل کی لغات اور قریش کی زبان"
  fr: "Les parlers des tribus et la langue de Quraysh"
  es: "Los dialectos de las tribus y la lengua de Quraysh"
  tr: "Kabilelerin dilleri ve Qurayş dili"
  id: "Bahasa-bahasa suku dan bahasa Quraisy"
summary:
  ar: "ما تنقله كتب اللغة عن اختلاف لغات العرب: أفصح القبائل في أخبار ينقلها السيوطي، والقبائل التي أخذت عنها اللغة وتلك التي تُركت بحسب الفارابي كما يرويه السيوطي، ووجوه الاختلاف عند ابن فارس كعنعنة تميم وكشكشة أسد وكسكسة ربيعة، وألفاظ قيل إنها يمنية، ولسان قريش كما جاء عن ابن عباس وفي أمر عثمان بكتابة المصحف عند الاختلاف."
  en: "What the books of language transmit on the differences between the Arabs' dialects: the most eloquent tribes in reports al-Suyuti gives; the tribes from whom the language was taken and those left aside according to al-Farabi as al-Suyuti relays him; the kinds of difference in Ibn Faris, such as the 'an'ana of Tamim, the kashkasha of Asad and the kaskasa of Rabi'a; words said to be Yemeni; and the tongue of Quraysh as reported from Ibn Abbas and in Uthman's instruction on writing the mushaf where there was a disagreement."
  ur: "قبائل کی لغات کے اختلاف کے بارے میں لغت کی کتابیں جو نقل کرتی ہیں: سب سے فصیح قبائل ان خبروں میں جو سیوطی دیتے ہیں؛ وہ قبائل جن سے زبان لی گئی اور جنہیں چھوڑا گیا، فارابی کے مطابق جیسا سیوطی بیان کرتے ہیں؛ ابن فارس کے ہاں اختلاف کی صورتیں جیسے تمیم کی عنعنہ، اسد کی کشکشہ اور ربیعہ کی کسکسہ؛ وہ الفاظ جنہیں یمنی کہا گیا؛ اور قریش کی زبان جیسا ابن عباس سے آیا اور مصحف لکھنے میں اختلاف کے وقت عثمان کے حکم میں۔"
  fr: "Ce que transmettent les livres de langue sur les différences entre les parlers des Arabes : les tribus les plus éloquentes ; les tribus dont la langue fut prise et celles laissées de côté selon al-Farabi tel que le relaie al-Suyuti ; les différences chez Ibn Faris, comme l'an'ana de Tamim, la kashkasha d'Asad et la kaskasa de Rabi'a ; les mots dits yéménites ; et la langue de Quraysh selon Ibn Abbas et la consigne d'Uthman pour écrire le mushaf en cas de désaccord."
  es: "Lo que transmiten los libros de lengua sobre las diferencias entre los dialectos de los árabes: las tribus más elocuentes; las tribus de las que se tomó la lengua y las dejadas de lado según al-Farabi tal como lo transmite al-Suyuti; las diferencias en Ibn Faris, como la 'an'ana de Tamim, la kashkasha de Asad y la kaskasa de Rabi'a; las palabras que se dicen yemeníes; y la lengua de Quraysh según Ibn Abbas y la instrucción de Uthman sobre cómo escribir el mushaf ante un desacuerdo."
  tr: "Arap dillerindeki farklılıklar hakkında hangi dil kitapları rapor eder: El-Suyuti'nin aktardığı raporlarda en etkili kabileler, dilin öğrenildiği kabileler ve El-Süsüti'nin anlattığı El-Ferabi'ye göre geride kalan kabileler, İbn Faris'e göre anlaşmazlık noktaları (örneğin An'ana Temim, aslanın hışırdaması, Rebi'ye Kaskasa), Yemence olduğu söylenen kelimeler ve İbn Abbas'ın aktardığı Kureyş dili ile ilgili olarak, ayrıca anlaşmazlık durumunda Muşaf'ı yazması için Osman Emri hakkında."
  id: "Buku linguistik apa yang melaporkan perbedaan bahasa Arab: suku-suku paling fasih dalam laporan yang disampaikan oleh Al-Suyuti, suku dari mana bahasa tersebut dipelajari dan yang ditinggalkan menurut Al-Farabi seperti yang diceritakan oleh Al-Suyuti, titik-titik perbedaan menurut Ibn Faris seperti An'ana Tamim, suara singa yang menggelegar, dan Rabi'ah Kaskasa, serta kata-kata yang dikatakan berasal dari Yaman, dan bahasa Quraisy seperti yang dilaporkan oleh Ibn Abbas, serta mengenai perintah Utsman untuk menulis Mushaf jika terjadi perselisihan."
