  en: Khars (muteness in fiqh)
  ur: خرس
summary:
  ar: 'الخرس لغة امتناع الكلام خلقة، أو ذهابه عِيّا، والأخرس من لا نطق له، والاعتقال حبس اللسان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7615} يصح إسلام الأخرس بالإشارة مع قيام القرائن على إذعانه بقلبه، وهو مذهب المالكية والصحيح عند الشافعية، واستظهره ابن نجيم من الحنفية، ومقابل الصحيح عند الشافعية أن يشترط أن يصلي بعد الإشارة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7615}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7616} تسقط الأقوال عن الأخرس في الصلاة باتفاق، واختلفوا في تحريك لسانه: فلا يجب عند المالكية والحنابلة (إلا القاضي) والصحيح عند الحنفية، ويجب عند الشافعية تحريك اللسان والشفتين بقدر الإمكان، وقال ابن نجيم يلزم في تكبيرة الافتتاح والتلبية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7616} لا يصح اقتداء الناطق بالأخرس، واقتداء الأخرس بمثله جائز عند الحنفية والمالكية وممنوع عند الشافعية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7616}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7617} وإشارة الأخرس في الصلاة لا تبطلها عند الحنفية، وعند الشافعية في الصحيح، وعند المالكية في قول، والحنابلة يعدونها فعلا فلا تبطل إلا إن كثرت وتوالت؛ وتبطلها عند المالكية في قول آخر وعند الشافعية في المقابل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7617} الذبح والصيد من الأخرس حلال مع ترك التسمية باتفاق، والحنابلة يجعلون إيماءه إلى السماء قائمة مقام التسمية، ولا تعتبر التسمية منه عند إرسال السهم أو الجارحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7617}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7618} الإشارة المفهومة أو الكتابة المستبينة تقوم مقام العبارة في العقود والحلول كالبيع والنكاح والطلاق والعتاق والإبراء، والطلاق بالإشارة المفهومة يقع، وعند الشافعية والحنابلة يكون صريحا إن فهمه كل أحد، وكناية إن اختص بفهمه بعض الناس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7618} اللعان بالإشارة أو الكتابة صحيح عند الجمهور من المالكية والشافعية والمعتمد عند الحنابلة، ويترتب عليه ما يترتب على لعان الناطق؛ ومنعه الحنفية وبعض الحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7618}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7619} الإقرار بالإشارة المفهومة أو الكتابة معتبر، ويؤخذ به في حقوق العباد ومنها القصاص باتفاق إلا قولا عند الحنفية، واختلف في الحدود: فيؤخذ به عند المالكية والشافعية والحنابلة، ومنعه الحنفية درءا للحد بالشبهة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7619}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7620} شهادة الأخرس لا تقبل عند الحنفية والحنابلة والشافعية في الأصح، وأجازها المالكية بإشارة مفهومة أو كتابة إذا قطع الحاكم بفهم مقصوده، وقبل الحنابلة المكتوبة بخطه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7620} النطق شرط في القضاء عند الحنفية والحنابلة والشافعية في الصحيح، واعتبره المالكية واجبا يعزل تاركه ولا يبطل حكمه إن وقع؛ والفتوى تصح منه إذا فهمت إشارته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7620}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7621} الأيمان بالإشارة تنعقد عند الحنفية والمالكية إذا فهم الأخرس وفهم عنه، وللشافعية قولان في انعقادها، وللحنابلة روايتان بحسب ما نقل عنهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7621} إذا جنى أحد على لسان الأخرس ففيه حكومة عدل عند الحنفية والمالكية والشافعية، وقال الحنابلة في قول إن فيه ثلث الدية؛ والقصاص بين الأخرسين عمدا ثابت عند المالكية والشافعية والحنابلة إذا أمنت السراية، ولا قصاص في اللسان عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7622}'
  en: Khars is lexically the lack of speech from birth, or the loss of speech through impediment; a mute (akhras) is one who cannot speak, and i'tiqal is the tongue's impediment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7615} A mute's Islam is valid by gesture where signs show that he assents in his heart, the Maliki view and the sound Shafii view, which Ibn Nujaym also draws from the Hanafis; the Shafii variant requires him to pray after the gesture. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7615}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7616} Speech is dropped from the prayer for the mute by agreement. The Malikis, Hanbalis (except al-Qadi) and the sound Hanafi view do not require moving the tongue; the Shafiis require moving tongue and lips as far as possible; Ibn Nujaym requires it for the opening takbir and the talbiya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7616} A speaker may not lead a mute in prayer; a mute may lead another mute, as the Hanafis and Malikis allow, but the Shafiis and Hanbalis forbid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7616}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7617} A mute's gesture does not invalidate prayer for the Hanafis, the sound Shafii view and one Maliki view; the Hanbalis count it as an act, invalid only if frequent and repeated; one Maliki view and the opposite Shafii view hold that it invalidates. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7617} A mute may slaughter and hunt lawfully even without saying the basmala; the Hanbalis treat a gesture to heaven as the basmala, and in hunting the mute's intention is not required. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7617}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7618} An intelligible gesture or clear writing stands for speech in contracts and dispositions such as sale, marriage, divorce, manumission and acquittal; divorce by intelligible gesture takes effect, and for the Shafiis and Hanbalis it is explicit if all understand it, and allusive if only some do. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7618} Li'an by gesture or writing is valid according to most jurists, the Malikis, the Shafiis and the preferred Hanbali view, with the same effects as for a speaker; the Hanafis and some Hanbalis reject it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7618}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7619} A mute's acknowledgement by gesture or writing is accepted for private rights, including retaliation by agreement except one Hanafi view; for hadd offences the Malikis, Shafiis and Hanbalis accept it, while the Hanafis reject it to avert the hadd by doubt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7619}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7620} A mute's testimony is rejected by the Hanafis, the Hanbalis and the sounder Shafii view; the Malikis accept it by intelligible gesture or writing when the judge is sure of its meaning, and the Hanbalis accept writing in his hand. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7620} Speech is a condition of judgeship for the Hanafis, the Hanbalis and the sounder Shafii view; the Malikis treat it as a duty, so he is removed, though a judgement given stands. Fatwa by a mute is valid when his gesture is understood. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7620}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7621} Oaths by gesture are valid for the Hanafis and Malikis when he is understood; the Shafiis have two views and the Hanbalis two reports. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7621} Injury to a mute's tongue carries a fair assessment (hukuma 'adl) for the Hanafis, Malikis and Shafiis; one Hanbali view gives a third of the blood-money. Retaliation between two mutes for an intentional injury stands for the Malikis, Shafiis and Hanbalis if the wound will not spread, but the Hanafis allow none for the tongue. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7622}
  ur: خرس لغت میں پیدائشی طور پر بول نہ سکنا، یا رکاوٹ سے بات ختم ہو جانا ہے؛ اخرس وہ ہے جس کے پاس بولنے کی طاقت نہ ہو، اور اعتقال زبان کی رکاوٹ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7615} اشارے سے اخرس کا اسلام صحیح ہے بشرطیکہ قرائن سے دل کا اقرار ظاہر ہو، یہ مالکیہ اور شافعیہ کا صحیح قول ہے، اور ابن نجیم نے حنفیہ سے یہی مستنبط کیا؛ شافعیہ کے مقابل قول میں اشارے کے بعد نماز پڑھنا شرط ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7615}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7616} نماز میں اخرس سے قول ساقط ہو جاتا ہے، زبان کو حرکت دینا مالکیہ، حنابلہ (سوائے قاضی) اور حنفیہ کے صحیح قول میں واجب نہیں، شافعیہ کے نزدیک زبان اور ہونٹ حرکت دینا ممکن حد تک واجب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7616} ناطق اخرس کی امامت نہیں کر سکتا؛ اخرس اخرس کی امامت حنفیہ اور مالکیہ کے نزدیک جائز ہے، شافعیہ اور حنابلہ کے نزدیک ناجائز۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7616}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7617} نماز میں اخرس کا اشارہ حنفیہ کے نزدیک مفسد نہیں، شافعیہ کے صحیح قول اور مالکیہ کے ایک قول میں بھی نہیں، حنابلہ اسے فعل سمجھتے ہیں جو بار بار ہونے پر مفسد ہوتا ہے؛ مالکیہ کے دوسرے قول اور شافعیہ کے مقابل قول میں مفسد ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7617} اخرس کا ذبح اور شکار بغیر تسمیہ کے حلال ہے، حنابلہ آسمان کی طرف اشارے کو تسمیہ کے قائم مقام مانتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7617}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7618} واضح اشارہ یا صاف تحریر بیع، نکاح، طلاق، آزادی اور ابراء جیسے تصرفات میں بولنے کے قائم مقام ہے، اور واضح اشارے سے طلاق واقع ہو جاتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7618} اشارے یا تحریر سے لعان جمہور (مالکیہ، شافعیہ اور حنابلہ کے معتمد قول) کے نزدیک صحیح ہے، حنفیہ اور بعض حنابلہ اسے ناجائز کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7618}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7619} اشارے یا تحریر سے اقرار حقوق العباد میں معتبر ہے، قصاص میں بھی بالاتفاق (سوائے حنفیہ کے ایک قول کے)، حدود میں مالکیہ، شافعیہ اور حنابلہ اسے لیتے ہیں جبکہ حنفیہ شبہے سے حد ٹالنے کے لیے رد کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7619}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7620} اخرس کی گواہی حنفیہ، حنابلہ اور شافعیہ کے اصح قول میں قبول نہیں؛ مالکیہ مفہوم اشارے یا تحریر سے قبول کرتے ہیں جب قاضی مراد سمجھ لے، اور حنابلہ اپنے ہاتھ کی تحریر قبول کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7620} قضا کے لیے نطق شرط ہے حنفیہ، حنابلہ اور شافعیہ کے اصح قول میں؛ مالکیہ اسے واجب مانتے ہیں اس لیے معزول کیا جائے گا، مگر فیصلہ نافذ ہوگا؛ فتویٰ صحیح ہے جب اشارہ سمجھا جائے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7620}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7621} حنفیہ اور مالکیہ کے نزدیک اشارے سے قسم منعقد ہوتی ہے جب سمجھا جائے؛ شافعیہ کے دو اور حنابلہ کی دو روایات ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7621} اخرس کی زبان پر جنایت میں حنفیہ، مالکیہ اور شافعیہ کے نزدیک حکومت عدل ہے، حنابلہ کے ایک قول میں تہائی دیت ہے؛ دو اخرس کے درمیان عمداً قصاص مالکیہ، شافعیہ اور حنابلہ کے نزدیک ثابت ہے جب سرایت کا خطرہ نہ ہو، حنفیہ زبان میں قصاص نہیں مانتے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7622}
