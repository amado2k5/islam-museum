summary:
  ar: "جبال أوتاداً ورواسي ألقاها الله في الأرض أن تميد بكم، وأمرها مع داود أن سبّحي معه، وكادت الجبال تهبط حين عرضت عليها الأمانة فأبت أن تحملها وأشفقت منها وحملها الإنسان."
  en: "Mountains as pegs and anchors God cast in the earth lest it shake with you; He bade them glorify with David; and they nearly sank when the Trust was offered them — they refused to bear it, and man bore it."
  ur: "پہاڑ زمین میں میخیں اور لنگر جو اللہ نے مضبوط ڈالے کہ تمہارے ساتھ نہ ہلے؛ اس نے ان کو داؤد کے ساتھ تسبیح کا حکم دیا؛ اور جب امانت ان کے سامنے رکھی گئی تو وہ قریب تھے کہ گر جائیں — اٹھانے سے انکار کیا اور انسان نے اٹھائی۔"
