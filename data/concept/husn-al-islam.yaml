id: concept/husn-al-islam
class: concept
kind: ethical
label:
  ar: حسن الإسلام وترك ما لا يعني
  en: Goodness of Islam — leaving what does not concern one
  es: "La bondad del Islam: dejar lo que no le incumbe a uno mismo."
  fr: "La bonté de l'Islam — laisser ce qui ne nous regarde pas"
summary:
  ar: "من حسن إسلام المرء تركه ما لا يعنيه من قول وفعل والاقتصار على ما يعنيه؛ يبين ابن رجب أن «يعنيه» أي تتعلق عنايته به ويكون من مقصده ومطلوبه، وأن الترك إنما يكون بحكم الشرع والإسلام لا بحكم الهوى وطلب النفس، ولهذا جعله النبي من حسن الإسلام، فإذا حسن إسلام المرء اقتضى ذلك ترك ما لا يعني كله من المحرمات والمشتبهات والمكروهات وفضول المباحات التي لا يحتاج إليها، ويبلغ ذلك درجة الإحسان، ويتولد من المراقبة والإحسان الاستحياء من الله وترك كل ما يستحيى منه؛ ويسميه ابن رجب أصلاً عظيماً من أصول الأدب، وينقل عن أبي عمرو بن الصلاح عن أبي محمد بن أبي زيد إمام المالكية في زمانه أن جماع آداب الخير وأزمته تتفرع من أربعة أحاديث: «من كان يؤمن بالله واليوم الآخر فليقل خيراً أو ليصمت»، وهذا الحديث، و«لا تغضب»، و«المؤمن يحب لأخيه ما يحب لنفسه»."
  en: "Part of the goodness of a person's Islam is leaving what does not concern him in word and deed and confining himself to what does; Ibn Rajab explains that 'concerns him' means what his purposeful attention attaches to, and that the leaving is governed by the ruling of the sharia and Islam rather than by whim or the soul's desire — which is why the Prophet made it a mark of the goodness of one's Islam; when a person's Islam is sound it entails leaving all that does not concern him of the forbidden, the doubtful, the disliked, and the superfluous among the permissible for which he has no need, rising thereby to the station of ihsan, from which, together with watchfulness, is born modesty before God and the abandoning of all that occasions shame; Ibn Rajab calls it a great foundation of the foundations of proper conduct and cites Abu Amr ibn al-Salah reporting from Abu Muhammad ibn Abi Zayd, the Maliki imam of his time, that the conduct of goodness and all its reins branch from four hadiths: 'whoever believes in God and the Last Day, let him speak good or keep silent', this hadith, 'do not become angry', and 'the believer loves for his brother what he loves for himself'."
  es: "Parte de la bondad del Islam de una persona consiste en dejar lo que no le concierne en palabra y obra y limitarse a lo que sí le concierne; Ibn Rajab explica que \"lo que le concierne\" significa aquello a lo que presta atención deliberada, y que ese dejar de lado está regido por la ley islámica y el Islam, más que por capricho o deseo del alma, razón por la cual el Profeta lo convirtió en una señal de la bondad del Islam de una persona; cuando el Islam de una persona es sólido, implica dejar todo lo que no le concierne de lo prohibido, lo dudoso, lo desagradable y lo superfluo entre lo permisible para lo cual no tiene necesidad, elevándose así al estado de ihsan, del cual, junto con la vigilancia, nace la modestia ante Dios y el abandono de todo lo que ocasiona vergüenza; Ibn Rajab lo llama un gran fundamento de los fundamentos de la conducta apropiada y cita a Abu Amr ibn al-Salah informando de Abu Muhammad ibn Abi Zayd, el imán malikí de su tiempo, que la conducta de la bondad y todos sus preceptos se ramifican de cuatro hadices: 'quien cree en Dios y en el Último Día, que hable bien o que guarde silencio', este hadiz, 'no te enojes', y 'el creyente ama para su hermano lo que ama para sí mismo'."
  fr: "Une des qualités d'une personne en Islam réside dans le fait de s'abstenir de ce qui ne la concerne pas, en paroles et en actes, et de se concentrer sur ce qui la concerne. Ibn Rajab explique que « la concerne » signifie ce à quoi elle porte son attention de manière intentionnelle, et que cet abandon est régi par les préceptes de la charia et de l'Islam plutôt que par un caprice ou un désir personnel. C'est pourquoi le Prophète en a fait une marque de la qualité d'une personne en Islam. Lorsqu'une personne pratique un Islam sain, cela implique de s'abstenir de tout ce qui ne la concerne pas: ce qui est interdit, douteux, déplaisant et superflu parmi les choses permises dont elle n'a pas besoin. Elle s'élève ainsi au rang d'ihsan, d'où, avec la vigilance, naît la modestie devant Dieu et l'abandon de tout ce qui cause la honte. Ibn Rajab la qualifie de fondement majeur de la bonne conduite et cite Abu Amr ibn al-Salah rapportant d'après Abu Muhammad ibn Abi Zayd, l'imam malikite de son époque, que la conduite vertueuse et tout ce qu'elle implique découle de quatre hadiths: « Quiconque croit en Dieu et au Jour dernier, qu'il dise du bien ou qu'il se taise », ce hadith, « Ne vous mettez pas en colère », et « Le croyant aime pour son frère ce qu'il aime pour lui-même »."
