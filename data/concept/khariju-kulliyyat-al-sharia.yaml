id: concept/khariju-kulliyyat-al-sharia
class: concept
kind: social
sensitivity: contested
label:
  ar: "خريجو كليات الشريعة وتحديات الواقع"
  en: "Graduates of the sharia colleges and the challenges of the present"
  ur: "شریعہ کالجوں کے فارغ التحصیل اور حال کے چیلنج"
issue:
  ar: "هل يخرج خريجو كليات الشريعة في مرحلة البكالوريوس متمكنين في العلم الشرعي وفي معرفة واقعهم، وأين موضع الضعف وسببه وعلاجه؟"
  en: "Do bachelor-level graduates of the sharia colleges come out well grounded both in the religious sciences and in knowledge of their own time, and where do the weakness, its cause and its remedy lie?"
  ur: "کیا شریعہ کالجوں کے بیچلر سطح کے فارغ التحصیل دینی علوم اور اپنے زمانے کی معرفت دونوں میں پختہ ہو کر نکلتے ہیں، اور کمزوری، اس کا سبب اور اس کا علاج کہاں ہے؟"
summary:
  ar: "حلقة «الوسطية» عن خريجي كليات الشريعة وتحديات الواقع، وهم في الغالب أئمة المساجد وخطباء الجمعة ومدرسو التربية الإسلامية. صوّت 49% من شباب الاستوديو أن مستواهم ضعيف و37% متوسط و14% فقط ممتاز؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep20 00:07:00} ورأى 56% أن السبب الأكبر في المناهج، و21% في غياب الحوافز، و14% في مستوى الطلبة، و9% في الأساتذة؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep20 00:36:30} وأيّد 80% تحويل الكليات الشرعية إلى كليات أهلية ورفع الوصاية الرسمية عنها {cite:assabile-tareq-al-suwaidan al-wassitiya/ep20 00:57:30}. واختلف الضيوف، وهم عمداء وأساتذة من الأزهر وبغداد واليمن والرياض ومعهد خاص في مصر، على الحوافز والمناهج واستقلال التعليم الشرعي عن الدولة."
  en: "The 'Al-Wasatiyya' episode on graduates of the sharia colleges and the challenges of the present; these graduates are mostly the mosque imams, Friday preachers and teachers of Islamic education. Of the young studio audience, 49% voted their level weak, 37% average and only 14% excellent; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep20 00:07:00} 56% put the main cause in the curricula, 21% in the lack of incentives, 14% in the students and 9% in the professors; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep20 00:36:30} and 80% backed turning the sharia colleges into private colleges free of official tutelage. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep20 00:57:30} The guests, deans and professors from al-Azhar, Baghdad, Yemen, Riyadh and a private institute in Egypt, disagreed on incentives, curricula and the independence of religious education from the state."
  ur: "«الوسطیہ» کی وہ قسط جو شریعہ کالجوں کے فارغ التحصیل اور حال کے چیلنجوں پر ہے؛ یہی فارغ التحصیل زیادہ تر مساجد کے امام، جمعہ کے خطیب اور اسلامی تعلیم کے اساتذہ ہوتے ہیں۔ اسٹوڈیو کے نوجوان حاضرین میں سے 49% نے ان کی سطح کو کمزور، 37% نے اوسط اور صرف 14% نے عمدہ کہا؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep20 00:07:00} 56% نے سب سے بڑا سبب نصاب کو، 21% نے ترغیبات کی کمی کو، 14% نے طلبہ کو اور 9% نے اساتذہ کو قرار دیا؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep20 00:36:30} اور 80% نے شریعہ کالجوں کو سرکاری سرپرستی سے آزاد نجی کالجوں میں بدلنے کی تائید کی۔ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep20 00:57:30} مہمانوں نے، جو الازہر، بغداد، یمن، ریاض اور مصر کے ایک نجی ادارے کے ڈین اور اساتذہ تھے، ترغیبات، نصاب اور دینی تعلیم کی ریاست سے آزادی پر اختلاف کیا۔"
perspectives:
- tradition: sunni
  id: incentives-first
  stance:
    ar: "أصل المشكلة الحوافز: لو ارتفع مردود دارس الشريعة لتزاحم عليه المتفوقون وتحسّن الأستاذ والمنهج"
    en: "The root is incentives: if the sharia graduate's return rose, the best students would compete for it and professors and curricula would improve"
  summary:
    ar: "رأى الدكتور عبد الحميد، الأستاذ السابق بكلية العلوم الإسلامية في بغداد وعميد كلية شريعة سابق في اليمن، أن الطالب يختار كليته بحسب مردودها المالي، وأن رفع الحوافز يجلب الأذكياء فيتحسن الأستاذ والمنهج، {cite:assabile-tareq-al-suwaidan al-wassitiya/ep20 00:40:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep20 00:40:30} ووافقه أستاذ الفقه المقارن بالأزهر على أن الحوافز هي السبب الأكبر {cite:assabile-tareq-al-suwaidan al-wassitiya/ep20 00:41:30}."
    en: "Dr Abd al-Hamid, formerly of the College of Islamic Sciences in Baghdad and a former dean of a sharia college in Yemen, held that students choose a college by its financial return, and that raising incentives would draw the able, improving professors and curricula; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep20 00:40:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep20 00:40:30} the professor of comparative fiqh at al-Azhar agreed that incentives are the biggest cause. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep20 00:41:30}"
  holders: []
  evidence:
  - ref: source/assabile-tareq-al-suwaidan
    note: {en: "al-wassitiya ep20, 00:40:00-00:41:30"}
- tradition: sunni
  id: student-and-intake-first
  stance:
    ar: "الطالب واستعداده الذاتي وطريقة قبوله هي الأصل، وقد خرّج الأزهر قديماً أفذاذاً بلا حوافز"
    en: "The student, his own readiness and the way he is admitted come first; the old Azhar produced outstanding scholars without incentives"
  summary:
    ar: "رأى الدكتور أحمد بن راشد بن سعيد أن الاستعداد الذاتي للطالب يتجاوز ضحالة المناهج، {cite:assabile-tareq-al-suwaidan al-wassitiya/ep20 00:43:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep20 00:44:00} ورأى الدكتور جميل أحمد علام أن الأزهر قديماً خرّج علماء أفذاذاً بلا حوافز ولا تمويل من الدولة، وأن المشكلة في مدخلات التعليم حين يدخل الطالب الكلية بمكتب التنسيق لا برغبته {cite:assabile-tareq-al-suwaidan al-wassitiya/ep20 00:49:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep20 00:50:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep20 00:50:30}."
    en: "Dr Ahmad ibn Rashid ibn Sa'id held that a student's own readiness can overcome shallow curricula; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep20 00:43:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep20 00:44:00} Dr Jamil Ahmad Allam held that the old Azhar produced outstanding scholars without incentives or state funding, and that the problem lies in the intake, when a student enters the college through the admissions office rather than by his own wish. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep20 00:49:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep20 00:50:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep20 00:50:30}"
  holders: []
  evidence:
  - ref: source/assabile-tareq-al-suwaidan
    note: {en: "al-wassitiya ep20, 00:43:00-00:50:30"}
- tradition: sunni
  id: private-versus-state
  stance:
    ar: "الكليات الأهلية أم الرسمية: خلاف بين من يرى الاستقلال عن الدولة شرط الجودة ومن يرى إشراف الدولة ضمانة"
    en: "Private or state colleges: a dispute between those who see independence from the state as the condition of quality and those who see state oversight as a safeguard"
  summary:
    ar: "رأى الدكتور جميل أحمد علام، عميد معهد خاص، أن على الكليات الشرعية أن تتحرر من السياسة العامة للدولة وأن يكون الأستاذ حراً، وقال إنه رفض الدعم ليحتفظ بحريته في المناهج؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep20 01:07:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep20 01:08:00} وخالفه أستاذ الفقه المقارن بالأزهر فقال إنه يفضّل أن تخضع الدراسات الإسلامية للدولة لأن الكلية الأهلية قد تحمل سياسة أصحابها أو غرضاً مادياً، وإن أقسام الكليات هي التي تضع المناهج لا الدولة؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep20 00:59:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep20 01:01:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep20 01:09:30} ودعا الدكتور عبد الحميد والدكتور أحمد بن راشد إلى بقاء النوعين متنافسين {cite:assabile-tareq-al-suwaidan al-wassitiya/ep20 00:59:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep20 01:03:30}."
    en: "Dr Jamil Ahmad Allam, dean of a private institute, held that sharia colleges should be freed from the state's general policy and the professor left free, and said he refused support in order to keep his freedom over curricula; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep20 01:07:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep20 01:08:00} the professor of comparative fiqh at al-Azhar disagreed, preferring Islamic studies to remain under the state because a private college may carry its owners' policy or a commercial aim, and saying that college departments, not the state, set the curricula; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep20 00:59:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep20 01:01:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep20 01:09:30} Dr Abd al-Hamid and Dr Ahmad ibn Rashid called for both kinds to remain, in competition. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep20 00:59:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep20 01:03:30}"
