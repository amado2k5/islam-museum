- tradition: other
  id: presenter-view
  stance:
    ar: "رأي المقدّم: نريد خريجاً موسوعياً قدوة متمكناً، وهذا يحتاج إعادة النظر في القبول والحوافز ودور الوقف"
    en: "The presenter's view: we want an encyclopaedic, exemplary, well-grounded graduate, which needs a rethink of admissions, incentives and the role of waqf"
  summary:
    ar: "رأي طارق السويدان (رأي المتحدث): ضعف الحوافز يُنتج ضعف المناهج وعزوف الموهوبين، والكليات الأهلية جزء من الحل، ويتمنى أن يُعاد النظر في القبول حتى لا يدخل كليات الشريعة إلا أعلى العقول الراغبة، وأن تعيد الدول النظر في رواتب الأساتذة {cite:assabile-tareq-al-suwaidan al-wassitiya/ep20 01:16:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep20 01:17:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep20 01:18:00}."
    en: "Tareq al-Suwaidan's view (speaker's opinion): weak incentives produce weak curricula and keep the talented away; private colleges are part of the solution; he hopes admissions will be rethought so that only the ablest willing minds enter the sharia colleges, and that states will rethink professors' pay. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep20 01:16:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep20 01:17:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep20 01:18:00}"
