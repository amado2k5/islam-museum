label:
  ar: "مراحل تطور الخط العربي"
  en: "The stages of development of the Arabic script"
  ur: "عربی رسم الخط کے ارتقا کے مراحل"
  fr: "Les étapes du développement de l'écriture arabe"
  es: "Las etapas del desarrollo de la escritura árabe"
  tr: "Arap Hat Sanatının Gelişim Aşamaları"
  id: "Tahapan Perkembangan Kaligrafi Arab"
summary:
  ar: "خمس مراحل بترتيبها الزمني: الكوفي، ثم الإعجام والتشكيل، ثم النسخ، ثم الثلث، ثم الرقعة، من أواخر القرن السابع إلى القرن التاسع عشر، كما يعرضها ملخص بحثي قُدّم إلى المتحف، مع من نُسب إليهم تقعيدها {cite:met-development-spread-calligraphic-scripts} {cite:britannica-kufic-script} {cite:wikipedia-kufic-en}."
  en: "Five stages in chronological order: Kufic, then the dots and vowel marks, then Naskh, then Thuluth, then Ruq'ah, from the late seventh to the nineteenth century, as a research summary supplied to the museum presents them, with the people credited with standardising them {cite:met-development-spread-calligraphic-scripts} {cite:britannica-kufic-script} {cite:wikipedia-kufic-en}."
  ur: "پانچ مراحل زمانی ترتیب سے: کوفی، پھر نقطے اور حرکات، پھر نسخ، پھر ثلث، پھر رقعہ، ساتویں صدی کے آخر سے انیسویں صدی تک، جیسا میوزیم کو فراہم کیا گیا تحقیقی خلاصہ انھیں پیش کرتا ہے، ان کے ساتھ جن کی طرف ان کی ضابطہ بندی منسوب ہے {cite:met-development-spread-calligraphic-scripts} {cite:britannica-kufic-script} {cite:wikipedia-kufic-en}۔"
  fr: "Cinq étapes dans l'ordre chronologique : le coufique, puis les points et les signes vocaliques, puis le naskh, puis le thuluth, puis le ruqʿa, de la fin du VIIe au XIXe siècle, telles que les présente une synthèse de recherche remise au musée, avec les personnes à qui l'on en attribue la normalisation {cite:met-development-spread-calligraphic-scripts} {cite:britannica-kufic-script} {cite:wikipedia-kufic-en}."
  es: "Cinco etapas en orden cronológico: el cúfico, luego los puntos y las vocales, luego el naskh, luego el zuluz, luego el ruqa, desde fines del siglo VII hasta el XIX, tal como las presenta un resumen de investigación entregado al museo, con las personas a quienes se atribuye su normalización {cite:met-development-spread-calligraphic-scripts} {cite:britannica-kufic-script} {cite:wikipedia-kufic-en}."
  tr: "Kronolojik sırayla beş aşama: Kufik, sonra I'jam ve diakmulizm, sonra Naskh, sonra Thuluth, sonra Ruq'ah, 7. yüzyılın sonlarından 19. yüzyıla kadar. Ayrıca, kodifikasyonu atfedilenlere atfedilen kişilerle birlikte müzeye sunulan bir araştırma özetinde de sunulmaktadır {cite:met-development-spread-calligraphic-scripts} {cite:britannica-kufic-script} {cite:wikipedia-kufic-en}."
  id: "Lima tahap secara kronologis: Kufic, lalu I'jam dan diakmulism, kemudian Naskh, kemudian Thuluth, kemudian Ruq'ah, dari akhir abad ke-7 hingga abad ke-19. Juga disajikan dalam ringkasan penelitian yang diserahkan ke museum, bersama dengan mereka yang menjadi dasar kodifikasi {cite:met-development-spread-calligraphic-scripts} {cite:britannica-kufic-script} {cite:wikipedia-kufic-en}."
