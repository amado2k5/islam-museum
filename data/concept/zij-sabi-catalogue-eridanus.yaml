summary:
  ar: "يذكر الفهرس كواكب النهر بعد كواكب قيطس، تحت عنوان يقرؤه النص النهر الكبير، ويأتي قسم الأرنب في الصفحة التالية. {cite:zij-sabi-nallino-byblion pp.268-269}"
  en: "The catalogue lists the stars of the river after those of Cetus, under a heading that the text reads as al-Nahr al-Kabir, the Great River. The section for the Hare follows on the next page. {cite:zij-sabi-nallino-byblion pp.268-269}"
  ur: "فہرست قیطس کے بعد دریا کے ستاروں کو درج کرتی ہے، جن کا عنوان متن کے مطابق نہر کبیر ہے۔ خرگوش کا حصہ اگلے صفحے پر آتا ہے۔ {cite:zij-sabi-nallino-byblion pp.268-269}"
  es: "El catálogo enumera las estrellas del río después de las de Cetus, bajo un encabezado que el texto lee como al-Nahr al-Kabir, el Gran Río. La sección dedicada a la Liebre aparece en la página siguiente. {cite:zij-sabi-nallino-byblion pp.268-269}"
