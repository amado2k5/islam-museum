id: concept/al-sadda-fi-al-khayshum
class: concept
kind: scientific
label:
  ar: السدة في الخيشوم
  en: The occlusion in the nasal fossa
  fr: "L’obstruction de la fosse nasale"
  ur: خیشوم میں سدہ
  es: "La oclusión en la fosa nasal"
summary:
  ar: السدة في الخيشوم هي الشيء المحتبس في داخله حتى يمنع الشيء النافذ من الحلق إلى الأنف أو من الأنف إلى الحلق وقد يكون خلطاً لزجاً لحجاً وقد يكون لحماً ناتئاً وقد يكون خشكريشة، وتفعل الغنة حتى تمنع فضلة النفخة عن أن تتسرب في الخيشوم، وعلاجها سعوط من جنس ما يعرف وكثيراً ما يحوج إلى عمل اليد وخرط الأنف بالميل الخاص بالأنف حتى يتنقى وربما خرج بالجرد شيء كثير يكاد يبلغ نصف رطل ⁦(الحبوب والجرد تحمل جنسها ووصف الكتاب)⁩ {cite:canon-ibn-sina-print-v2 p.248}
  en: The occlusion in the nasal fossa is the thing held inside it that bars what passes from the throat to the nose or from the nose to the throat; it may be a viscid sticky humour, protruding flesh, or a scabby crust. It produces the nasal twang by keeping the breath's excess from seeping through the fossa. Its treatment is a snuff of the known kind, and often it drives to hand-work — scraping the nose with the nose's own probe until it is clean; sometimes so much comes out by the scraping as to near half a ratl, at which one marvels ⁦(the pills are carried by kind, the scraping as the book's description)⁩ {cite:canon-ibn-sina-print-v2 p.248}
  fr: "L’obstruction de la fosse nasale est la chose retenue à l’intérieur de celle-ci qui barre ce qui passe de la gorge au nez ou du nez à la gorge ; ce peut être une humeur visqueuse et collante, une chair qui fait saillie ou une croûte squameuse. Elle produit le nasillement en empêchant l’excès du souffle de filtrer à travers la fosse. Son traitement est un prisé de l’espèce connue, et souvent elle conduit à l’œuvre de la main — racler le nez avec la sonde propre au nez jusqu’à ce qu’il soit propre ; parfois il sort par le raclage une quantité qui approche un demi-ratl, ce dont on s’émerveille ⁦(les pilules sont rapportées par espèce, le raclage comme description du livre)⁩ {cite:canon-ibn-sina-print-v2 p.248}"
  ur: خیشوم میں سدہ وہ چیز ہے جو اس کے اندر محبوس ہو کر حلق سے ناک یا ناک سے حلق گزرنے والی چیز کو روک دے؛ وہ چپچپا لیس دار خلط بھی ہو سکتا ہے، ابھرا ہوا گوشت بھی، اور خشک پھپھولا بھی؛ یہ گن گن پیدا کرتی ہے کہ سانس کا فاضل خیشوم میں نہ رس سکے؛ اس کا علاج معروف جنس کا سعوط ہے اور اکثر ہاتھ کے کام کی ضرورت پڑتی ہے — ناک کے مخصوص میل سے ناک کو جھاڑنا یہاں تک کہ صاف ہو جائے؛ اور کبھی جھاڑنے سے اتنا مادہ نکلتا ہے کہ قریب نصف رطل ہو جس پر انسان تعجب کرتا ہے ⁦(گولیاں جنس کے اعتبار سے، جھاڑنا کتاب کے بیان کے طور پر)⁩ {cite:canon-ibn-sina-print-v2 p.248}
  es: "La obstrucción en la fosa nasal es la sustancia que se encuentra en su interior y que impide el paso de lo que pasa de la garganta a la nariz o viceversa; puede ser un humor viscoso y pegajoso, un tejido protuberante o una costra. Produce el zumbido nasal al impedir que el exceso de aire se filtre a través de la fosa. Su tratamiento consiste en un rapé del tipo conocido, y a menudo requiere trabajo manual: raspar la nariz con la propia sonda nasal hasta que quede limpia; a veces, al raspar se extrae tanto que casi se puede obtener medio ratl, lo cual resulta asombroso (las pastillas se presentan por tipo, el raspado como se describe en el libro) {cite:canon-ibn-sina-print-v2 p.248}"
