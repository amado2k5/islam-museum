summary:
  ar: "يبين ابن سينا أن ماء الحمام قد يسخن وقد يبرد، وأن التبريد يأتي من كثرة الاستنقاع ومن طبع الماء البارد ومن إفراط الترطيب، وأن الحمام قد يسخن بالتحليل إذا وجد غذاء لم ينهضم أو خلطا لم ينضج {cite:canon-ibn-sina-print-v1 pp.140-141}."
  en: "Ibn Sina explains that bath water may warm or cool, that cooling comes from long soaking, from the cold nature of water and from excessive moistening, and that the bath may also warm by dissolving, where it finds undigested food or unripened humour {cite:canon-ibn-sina-print-v1 pp.140-141}."
