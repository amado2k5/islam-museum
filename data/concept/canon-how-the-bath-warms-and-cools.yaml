id: concept/canon-how-the-bath-warms-and-cools
class: concept
kind: scientific
label:
  ar: "كيف يسخن الحمام ويبرد عند ابن سينا"
  en: "How the bath warms and cools, in the Canon"
  fr: "Réchauffement et refroidissement par le bain dans le Canon"
  ur: "حمام کیسے گرم اور ٹھنڈا کرتا ہے، قانون کے مطابق"
  es: "Cómo se calienta y se enfría el baño, en el Canon"
summary:
  ar: "يبين ابن سينا أن ماء الحمام قد يسخن وقد يبرد، وأن التبريد يأتي من كثرة الاستنقاع ومن طبع الماء البارد ومن إفراط الترطيب، وأن الحمام قد يسخن بالتحليل إذا وجد غذاء لم ينهضم أو خلطا لم ينضج {cite:canon-ibn-sina-print-v1 pp.140-141}."
  en: "Ibn Sina explains that bath water may warm or cool, that cooling comes from long soaking, from the cold nature of water and from excessive moistening, and that the bath may also warm by dissolving, where it finds undigested food or unripened humour {cite:canon-ibn-sina-print-v1 pp.140-141}."
  fr: "Ibn Sina attribue à l’eau réchauffement ou refroidissement, ce dernier par immersion longue, froid naturel de l’eau et humidification excessive ; le bain réchaufferait aussi par résolution d’aliments non digérés ou d’humeur non mûrie {cite:canon-ibn-sina-print-v1 pp.140-141}."
  es: "Ibn Sina explica que el agua del baño puede calentarse o enfriarse, que el enfriamiento proviene de un remojo prolongado, de la naturaleza fría del agua y de una humedad excesiva, y que el baño también puede calentarse al disolverse, donde encuentra alimentos no digeridos o humores no maduros {cite:canon-ibn-sina-print-v1 pp.140-141}."
