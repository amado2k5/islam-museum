label:
  ar: "وَطَن"
  en: "Watan (homeland, fiqh)"
summary:
  ar: "الوطن في اللغة منزل الإقامة أو مكان الإنسان ومقره، ويُقال لمربض الغنم والبقر والإبل وطن، وجمعه أوطان، وأوطن أقام، واستوطنه اتخذه وطناً. وفي الاصطلاح هو منزل إقامة الإنسان ومقره، ولد به أو لم يولد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17527} والمحلّة منزل قوم الإنسان، وهي أخص من الوطن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17527}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17528}\n\nأنواع الوطن بحسب تعلق الأحكام: وطن أصلي، ووطن إقامة، ووطن سكنى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17528}\n\nالوطن الأصلي: عند الحنفية موطن ولادة الإنسان أو تأهله أو توطنه، ويُسمى الأهلي ووطن الفطرة؛ والتأهل التزوج، والتوطن العزم على القرار. وعند الشافعية والحنابلة هو المكان الذي يقيم فيه الشخص لا يرحل عنه صيفاً ولا شتاءً إلا لحاجة، ويلحق به عند الحنابلة في الصحيح البلد الذي فيه زوجة له أو تزوج فيه، لحديث عثمان في من تأهل في بلد أن يصلي صلاة المقيم، ويؤخذ من رواية عن أحمد أن البلد الذي فيه أهل أو ماشية وطن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17528} وعند المالكية الوطن محل سكنى الشخص بنية التأبيد، وموضع الزوجة المدخول بها وإن لم يكثر سكناه عندها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17528}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17529}\n\nوطن الإقامة: عند الحنفية ما خرج إليه الإنسان بنية إقامة مدة قاطعة لحكم السفر، ويُسمى المستعار أو الحادث؛ وبقية الفقهاء يوافقونهم في المعنى ويختلفون في المدة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17529}\n\nوطن السكنى: عند الحنفية المكان الذي يقصد الإنسان المقام به أقل من المدة القاطعة للسفر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17529}\n\nشروط الوطن: تختلف بحسب نوعه. فالوطن الأصلي عند المالكية والشافعية والحنابلة أن يكون مبنياً بناء مستقراً بما جرت العادة به؛ والحنفية يعتبرون مكان الولادة أو التأهل أو التوطن وطناً أصلياً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17529} وشروط وطن الإقامة: نية الإقامة، ومدة الإقامة المعتبرة، واتخاذ مكان الإقامة، وصلاحية المكان، وألا يكون وطناً أصلياً للمقيم، وشروط وطن السكنى: عدم نية الإقامة فيه، وعدم الإقامة فيه فعلاً المدة القاطعة للسفر، وألا يكون وطناً أصلياً للمقيم فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17529}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17530}\n\nما ينتقض به الوطن: عند الحنفية الوطن الأصلي لا ينتقض إلا بالانتقال منه إلى مثله بنقل الأهل وترك السكنى؛ وعند الحنابلة لا ينتقض باتخاذ وطن أصلي آخر، ومن له زوجتان في بلدين فكلاهما وطن أصلي عند الحنفية والمالكية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17530} وينتقض وطن الإقامة بالوطن الأصلي وبالسفر، وينتقض وطن السكنى بالوطن الأصلي وبوطن الإقامة وبوطن السكنى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17530}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17531}\n\nالأحكام المتعلقة بالوطن: قصر الصلاة، وجمع الصلوات، والإفطار في رمضان، والأضحية، وصلاة الجمعة والعيدين. فالقاطن في وطنه الأصلي أو وطن الإقامة لا يقصر الصلاة، ويجب على العائد إلى وطنه الإتمام من حين الدخول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17531} وللمسافر عند جمهور الفقهاء الجمع بين الظهر والعصر، وبين المغرب والعشاء، وخالف الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17531} وللمسافر أن يفطر في رمضان ما دام مسافراً، فإذا انقطع السفر وجب الإمساك إن كان في أثناء النهار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17531}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17532} وفي الأضحية: الحنفية يوجبونها ويشترطون لوجوبها الإقامة، وجمهور الفقهاء يرونها سنة ولا يشترطون الإقامة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17532}"
  en: "Watan, lexically, is a dwelling or the place where a person stays and settles; the folds of sheep, cattle and camels are also called watan. Technically it is the place where a person lives and settles, whether or not he was born there. The mahalla, the quarter where a people lives, is narrower than watan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17527}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17528}\n\nThe kinds of watan, by the rules that attach to them: the original homeland (watan asli), the residence homeland (watan iqama), and the dwelling (watan sukna). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17528}\n\nThe original homeland: for the Hanafis, the place of a person's birth, marriage or settling; it is also called the family homeland or the homeland of nature. For the Shafi'is and Hanbalis it is the place where a person lives without leaving it in summer or winter except for a need; the Hanbalis in the sounder view add a town where he has a wife or married, on the saying of 'Uthman that whoever marries in a town should pray the prayer of the resident; one report of Ahmad includes a town where he has people or livestock. The Malikis define it as the place of a person's residence with the intention of staying for ever, and the place of a wife he has consummated with, however rarely he lives there. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17528}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17529}\n\nThe residence homeland (iqama): for the Hanafis, the place a person goes to with the intention of staying for a period that cancels the rules of travel; the other jurists agree on the meaning and differ on the period. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17529}\n\nThe dwelling (sukna): for the Hanafis, a place where a person means to stay for less than the period that cancels travel. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17529}\n\nConditions: the original homeland needs permanent building in the customary way (Malikis, Shafi'is, Hanbalis); the Hanafis treat the place of birth, marriage or settling as the original homeland. The residence homeland needs the intention to stay, the relevant period, the taking of the place, its fitness, and that it is not the person's original homeland; the dwelling needs no intention of staying and no actual stay for the period, and must not be an original homeland. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17529}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17530}\n\nWhat ends a homeland: for the Hanafis an original homeland ends only by moving to another with the family and leaving the old one; the Hanbalis hold it does not end by taking up another original homeland; a man with wives in two towns has two original homelands, which the Hanafis, Malikis and Hanbalis agree. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17530} A residence homeland ends by an original homeland and by travel, and a dwelling ends by an original homeland, a residence and another dwelling. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17530}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17531}\n\nRules attached to the homeland: shortening the prayer, combining prayers, breaking the Ramadan fast, the sacrifice, and the Friday and festival prayers. The resident in his original or residence homeland does not shorten the prayer, and one returning to his original homeland must complete the prayer from the moment he enters. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17531} For travellers the majority allow combining the noon and afternoon prayers and the sunset and night prayers, while the Hanafis deny this. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17531} A traveller may break the Ramadan fast while travelling; if the travel ends in the day he must abstain for the rest of the day and make up the days later. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17531}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17532} On the sacrifice: the Hanafis hold it obligatory and require residence for the obligation, while the majority hold it a sunna and do not require residence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17532}"
