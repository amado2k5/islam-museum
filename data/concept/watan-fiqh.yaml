id: concept/watan-fiqh
class: concept
kind: legal
label:
  ar: "وَطَن"
  en: "Watan (homeland, fiqh)"
  es: "Mes (patria, fiqh)"
  fr: "Mois (patrie, fiqh)"
  ur: "ماہ ⁦(وطن، فقہ)⁩"
summary:
  ar: "الوطن في اللغة منزل الإقامة أو مكان الإنسان ومقره، ويُقال لمربض الغنم والبقر والإبل وطن، وجمعه أوطان، وأوطن أقام، واستوطنه اتخذه وطناً. وفي الاصطلاح هو منزل إقامة الإنسان ومقره، ولد به أو لم يولد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17527} والمحلّة منزل قوم الإنسان، وهي أخص من الوطن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17527}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17528}\n\nأنواع الوطن بحسب تعلق الأحكام: وطن أصلي، ووطن إقامة، ووطن سكنى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17528}\n\nالوطن الأصلي: عند الحنفية موطن ولادة الإنسان أو تأهله أو توطنه، ويُسمى الأهلي ووطن الفطرة؛ والتأهل التزوج، والتوطن العزم على القرار. وعند الشافعية والحنابلة هو المكان الذي يقيم فيه الشخص لا يرحل عنه صيفاً ولا شتاءً إلا لحاجة، ويلحق به عند الحنابلة في الصحيح البلد الذي فيه زوجة له أو تزوج فيه، لحديث عثمان في من تأهل في بلد أن يصلي صلاة المقيم، ويؤخذ من رواية عن أحمد أن البلد الذي فيه أهل أو ماشية وطن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17528} وعند المالكية الوطن محل سكنى الشخص بنية التأبيد، وموضع الزوجة المدخول بها وإن لم يكثر سكناه عندها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17528}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17529}\n\nوطن الإقامة: عند الحنفية ما خرج إليه الإنسان بنية إقامة مدة قاطعة لحكم السفر، ويُسمى المستعار أو الحادث؛ وبقية الفقهاء يوافقونهم في المعنى ويختلفون في المدة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17529}\n\nوطن السكنى: عند الحنفية المكان الذي يقصد الإنسان المقام به أقل من المدة القاطعة للسفر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17529}\n\nشروط الوطن: تختلف بحسب نوعه. فالوطن الأصلي عند المالكية والشافعية والحنابلة أن يكون مبنياً بناء مستقراً بما جرت العادة به؛ والحنفية يعتبرون مكان الولادة أو التأهل أو التوطن وطناً أصلياً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17529} وشروط وطن الإقامة: نية الإقامة، ومدة الإقامة المعتبرة، واتخاذ مكان الإقامة، وصلاحية المكان، وألا يكون وطناً أصلياً للمقيم، وشروط وطن السكنى: عدم نية الإقامة فيه، وعدم الإقامة فيه فعلاً المدة القاطعة للسفر، وألا يكون وطناً أصلياً للمقيم فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17529}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17530}\n\nما ينتقض به الوطن: عند الحنفية الوطن الأصلي لا ينتقض إلا بالانتقال منه إلى مثله بنقل الأهل وترك السكنى؛ وعند الحنابلة لا ينتقض باتخاذ وطن أصلي آخر، ومن له زوجتان في بلدين فكلاهما وطن أصلي عند الحنفية والمالكية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17530} وينتقض وطن الإقامة بالوطن الأصلي وبالسفر، وينتقض وطن السكنى بالوطن الأصلي وبوطن الإقامة وبوطن السكنى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17530}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17531}\n\nالأحكام المتعلقة بالوطن: قصر الصلاة، وجمع الصلوات، والإفطار في رمضان، والأضحية، وصلاة الجمعة والعيدين. فالقاطن في وطنه الأصلي أو وطن الإقامة لا يقصر الصلاة، ويجب على العائد إلى وطنه الإتمام من حين الدخول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17531} وللمسافر عند جمهور الفقهاء الجمع بين الظهر والعصر، وبين المغرب والعشاء، وخالف الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17531} وللمسافر أن يفطر في رمضان ما دام مسافراً، فإذا انقطع السفر وجب الإمساك إن كان في أثناء النهار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17531}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17532} وفي الأضحية: الحنفية يوجبونها ويشترطون لوجوبها الإقامة، وجمهور الفقهاء يرونها سنة ولا يشترطون الإقامة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17532}\n\nصلاة الجمعة: من كان في سفر فإذا انقطع السفر قبل إقامة الجمعة وجبت عليه، وينقطع السفر بدخول الوطن الأصلي مطلقاً، وبعده مقيماً في وطن الإقامة بشروطه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17532} صلاة العيدين: واجبة عند الحنفية، وسنة مؤكدة عند المالكية والشافعية، وفرض كفاية عند الحنابلة؛ وذهب الجمهور إلى أن شرط التكليف بها الإقامة أو الاستيطان، خلافاً للشافعية، فلا يكلَّف بها المسافر عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17532} نقل الزكاة: اتفقوا على أن أولى الناس بزكاة المال أهل البلد الذي فيه المال والمزكي، أما إذا كان المزكي في بلد والمال في آخر فاختلفوا في المعتبر: بلد المال أو بلد المزكي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17532}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17533}\n\nتوطن الحربية بدار الإسلام: إذا دخلت الحربية دار الإسلام بأمان وتزوجت مسلماً أو ذمياً صارت ذمية، لأنها تابعة للزوج بالسكنى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17533}\n\nتغريب الزاني الغريب: صرّح الشافعية والحنابلة بأن الغريب إذا زنى غُرِّب إلى بلد غير وطنه؛ وقال المالكية إن زنى فور نزوله البلد سُجن فيه، وإن زنى بعد أنسه بأهله غُرِّب إلى بلد آخر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17533} هجرة من في دار الحرب من وطنه: تختلف أحوالها بين واجبة ومستحبة ولا تجب على آخرين، وتفصيلها في باب الهجرة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17533}\n\nالتوطن في دار الحرب: لا يجوز للمسلم السفر من دار الإسلام إلى دار الحرب للتوطن فيها على التأبيد؛ والسفر للتجارة مختلف فيه بين التحريم والكراهة والجواز إذا لم يُلزم بمحرم أو ترك واجب، والسفر لمصلحة شرعية كمفاداة مسلم أو تبليغ رسالة جائز. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17533}"
  en: "Watan, lexically, is a dwelling or the place where a person stays and settles; the folds of sheep, cattle and camels are also called watan. Technically it is the place where a person lives and settles, whether or not he was born there. The mahalla, the quarter where a people lives, is narrower than watan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17527}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17528}\n\nThe kinds of watan, by the rules that attach to them: the original homeland (watan asli), the residence homeland (watan iqama), and the dwelling (watan sukna). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17528}\n\nThe original homeland: for the Hanafis, the place of a person's birth, marriage or settling; it is also called the family homeland or the homeland of nature. For the Shafi'is and Hanbalis it is the place where a person lives without leaving it in summer or winter except for a need; the Hanbalis in the sounder view add a town where he has a wife or married, on the saying of 'Uthman that whoever marries in a town should pray the prayer of the resident; one report of Ahmad includes a town where he has people or livestock. The Malikis define it as the place of a person's residence with the intention of staying for ever, and the place of a wife he has consummated with, however rarely he lives there. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17528}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17529}\n\nThe residence homeland (iqama): for the Hanafis, the place a person goes to with the intention of staying for a period that cancels the rules of travel; the other jurists agree on the meaning and differ on the period. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17529}\n\nThe dwelling (sukna): for the Hanafis, a place where a person means to stay for less than the period that cancels travel. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17529}\n\nConditions: the original homeland needs permanent building in the customary way (Malikis, Shafi'is, Hanbalis); the Hanafis treat the place of birth, marriage or settling as the original homeland. The residence homeland needs the intention to stay, the relevant period, the taking of the place, its fitness, and that it is not the person's original homeland; the dwelling needs no intention of staying and no actual stay for the period, and must not be an original homeland. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17529}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17530}\n\nWhat ends a homeland: for the Hanafis an original homeland ends only by moving to another with the family and leaving the old one; the Hanbalis hold it does not end by taking up another original homeland; a man with wives in two towns has two original homelands, which the Hanafis, Malikis and Hanbalis agree. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17530} A residence homeland ends by an original homeland and by travel, and a dwelling ends by an original homeland, a residence and another dwelling. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17530}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17531}\n\nRules attached to the homeland: shortening the prayer, combining prayers, breaking the Ramadan fast, the sacrifice, and the Friday and festival prayers. The resident in his original or residence homeland does not shorten the prayer, and one returning to his original homeland must complete the prayer from the moment he enters. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17531} For travellers the majority allow combining the noon and afternoon prayers and the sunset and night prayers, while the Hanafis deny this. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17531} A traveller may break the Ramadan fast while travelling; if the travel ends in the day he must abstain for the rest of the day and make up the days later. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17531}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17532} On the sacrifice: the Hanafis hold it obligatory and require residence for the obligation, while the majority hold it a sunna and do not require residence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17532}\n\nFriday prayer: a traveller who ends his journey before the Friday prayer is held becomes obliged to attend it; the journey ends on entry into the original homeland in every case, and after that by residence in the residence homeland on its conditions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17532} The festival prayers: obligatory for the Hanafis, a strong sunna for the Malikis and Shafi'is, and a communal obligation (fard kifaya) for the Hanbalis; the majority hold that residence or settlement is a condition of the obligation, against the Shafi'is, so the traveller is not obliged in the majority view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17532} Transfer of zakat: all agree that the people of the town where the wealth and the payer are have the first claim; where the payer and the wealth are in different towns, the jurists differ on whether the town of the wealth or the town of the payer governs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17532}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17533}\n\nA woman of the abode of war entering the abode of Islam: if she enters on safe conduct and marries a Muslim or a dhimmi, she becomes a dhimmi, since by residence she follows her husband, who is settled in the abode of Islam for ever. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17533}\n\nBanishing a stranger who commits adultery: the Shafi'is and Hanbalis hold that a stranger who commits adultery is exiled to a place other than his homeland; the Malikis say that if he commits it on arriving in the town he is imprisoned there, and if after settling with his people he is exiled to another town. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17533} Emigration from the homeland by those in the abode of war: its cases differ, some obliged, some recommended, others not obliged; detailed under emigration. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17533}\n\nSettling in the abode of war: a Muslim may not travel from the abode of Islam to the abode of war to settle there for ever. Travel to the abode of war for trade is disputed between forbidden, disliked and permitted, if he is not compelled to a forbidden act or an omitted duty; travel for a lawful purpose, such as ransoming a Muslim or carrying a message, is permitted. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17533}"
  es: "Watan, léxicamente, es una vivienda o el lugar donde una persona se queda y se establece; los rediles de ovejas, ganado y camellos también se llaman watan. Técnicamente es el lugar donde una persona vive y se establece, haya nacido allí o no. La mahalla, el barrio donde vive una gente, es más estrecha que watan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17527}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17528} Los tipos de watan, por las reglas que se les adjuntan: la patria original (watan asli), la patria de residencia (watan iqama) y la vivienda (watan sukna). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17528} La patria original: para los Hanafis, el lugar de nacimiento, matrimonio o establecimiento de una persona; También se le llama la patria familiar o la patria de la naturaleza. Para los shafi'is y hanbalis es el lugar donde una persona vive sin abandonarlo en verano o invierno excepto por necesidad; los hanbalis en la opinión más sólida agregan una ciudad donde tiene esposa o está casado, en el dicho de 'Uthman de que quien se casa en una ciudad debe rezar la oración del residente; un informe de Ahmad incluye una ciudad donde tiene personas o ganado. Los malikíes lo definen como el lugar de residencia de una persona con la intención de quedarse para siempre, y el lugar de una esposa con la que ha consumado el matrimonio, por muy raramente que viva allí. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17528}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17529} La patria de residencia (iqama): para los hanafíes, el lugar al que una persona va con la intención de quedarse por un período que anula las reglas de viaje; Los demás juristas coinciden en el significado y difieren en el período. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17529} La vivienda (sukna): para los hanafíes, un lugar donde una persona pretende permanecer por menos del período que cancela el viaje. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17529} Condiciones: la patria original necesita una construcción permanente de la manera consuetudinaria (malikis, shafi'is, hanbalis); los hanafíes consideran el lugar de nacimiento, matrimonio o establecimiento como la patria original. La patria de residencia necesita la intención de permanecer, el período pertinente, la toma del lugar, su idoneidad y que no sea la patria original de la persona; la vivienda no necesita intención de permanecer ni estancia real durante el período, y no debe ser una patria original. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17529}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17530} Qué termina una patria: para los hanafíes una patria original termina solo al mudarse a otra con la familia y dejar la antigua; los hanbalíes sostienen que no termina al tomar otra patria original; un hombre con esposas en dos ciudades tiene dos patrias originales, en lo que coinciden los hanafíes, malikíes y hanbalíes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17530} Una patria de residencia termina con una patria original y con el viaje, y una vivienda termina con una patria original, una residencia y otra vivienda. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17530}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17531} Reglas asociadas a la patria: acortar la oración, combinar oraciones, romper el ayuno de Ramadán, el sacrificio y las oraciones del viernes y de las festividades. El residente en su patria de origen o de residencia no acorta la oración, y quien regresa a su patria de origen debe completar la oración desde el momento en que entra. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17531} Para los viajeros, la mayoría permite combinar las oraciones del mediodía y de la tarde y las oraciones del atardecer y de la noche, mientras que los hanafíes lo niegan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17531} Un viajero puede romper el ayuno de Ramadán mientras viaja; Si el viaje termina en el día, debe abstenerse por el resto del día y recuperar los días después. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17531}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17532} Sobre el sacrificio: los hanafíes lo consideran obligatorio y requieren residencia para la obligación, mientras que la mayoría lo considera una sunna y no requiere residencia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17532} Oración del viernes: un viajero que termina su viaje antes de que se celebre la oración del viernes está obligado a asistir a ella; el viaje termina al entrar en la patria de origen en todos los casos, y después de eso por la residencia en la patria de residencia bajo sus condiciones. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17532} Las oraciones festivas: obligatorias para los Hanafis, una sunna fuerte para los Malikis y Shafi'is, y una obligación comunitaria (fard kifaya) para los Hanbalis; la mayoría sostiene que la residencia o el asentamiento es una condición de la obligación, en contra de los Shafi'is, por lo que el viajero no está obligado en la opinión mayoritaria. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17532} Transferencia del zakat: todos están de acuerdo en que la gente de la ciudad donde están la riqueza y el pagador tienen el primer derecho; cuando el pagador y la riqueza están en ciudades diferentes, los juristas difieren sobre si gobierna la ciudad de la riqueza o la ciudad del pagador. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17532}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17533} Una mujer de la morada de la guerra que entra en la morada del Islam: si entra con salvoconducto y se casa con un musulmán o un dhimmi, se convierte en dhimmi, puesto que por residencia sigue a su marido, que está establecido en la morada del Islam para siempre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17533} Destierro de un extranjero que comete adulterio: los shafi'is y hanbalis sostienen que un extranjero que comete adulterio es exiliado a un lugar distinto de su tierra natal; los malikíes dicen que si lo comete al llegar a la ciudad es encarcelado allí, y si después de establecerse con su gente es exiliado a otra ciudad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17533} Emigración de la patria por quienes se encuentran en la zona de guerra: sus casos difieren, algunos son obligatorios, otros recomendables, otros no; se detalla en el apartado de emigración. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17533} Asentamiento en la zona de guerra: un musulmán no puede viajar desde la morada del Islam a la zona de guerra para establecerse allí permanentemente. El viaje a la zona de guerra con fines comerciales se debate entre prohibido, desaconsejable y permitido, si no se le obliga a realizar un acto prohibido o a cumplir un deber omitido; el viaje con un propósito lícito, como el rescate de un musulmán o el transporte de un mensaje, está permitido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17533}"
  fr: "Le terme « watan », au sens littéral, désigne une habitation ou le lieu où une personne séjourne et s'établit; les enclos à moutons, à bovins et à chameaux sont également appelés « watan ». Techniquement, il s'agit du lieu où une personne vit et s'établit, qu'elle y soit née ou non. Le « mahalla », le quartier où vit un peuple, est plus étroit que le « watan ». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17527}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17528} Les différents types de « watan », selon les règles qui leur sont propres: la patrie d'origine (watan asli), la patrie de résidence (watan iqama) et l'habitation (watan sukna). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17528} La patrie d'origine: pour les Hanafites, le lieu de naissance, de mariage ou d'établissement d'une personne; On l'appelle aussi le foyer familial ou le foyer naturel. Pour les chaféites et les hanbalites, c'est le lieu où une personne vit sans le quitter été comme hiver, sauf en cas de nécessité. Les hanbalites, dans une perspective plus équilibrée, y ajoutent la ville où elle a une épouse ou est mariée, se référant à la parole d'Uthman selon laquelle quiconque se marie dans une ville doit accomplir la prière du résident. Un hadith rapporté par Ahmad inclut également la ville où il possède des personnes ou du bétail. Les malikites la définissent comme le lieu de résidence d'une personne avec l'intention d'y demeurer définitivement, et le lieu de l'épouse avec laquelle il a consommé ses relations, même s'il n'y vit que rarement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17528}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17529} Le foyer de résidence (iqama): pour les hanafites, le lieu où une personne se rend avec l'intention d'y séjourner pendant une période qui annule les règles de voyage. Les autres juristes s'accordent sur la signification mais divergent quant à la durée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17529} Le domicile (sukna): pour les Hanafites, un lieu où une personne a l'intention de séjourner moins longtemps que la durée qui annule le voyage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17529} Conditions: le pays d'origine doit être une construction permanente selon la coutume (Malikites, Chafiites, Hanbalites); les Hanafites considèrent le lieu de naissance, de mariage ou d'établissement comme le pays d'origine. Le domicile de résidence doit impliquer l'intention de séjourner, la durée du séjour, l'occupation du lieu, son adéquation et qu'il ne s'agisse pas du pays d'origine de la personne; le domicile ne doit impliquer ni intention de séjour ni séjour effectif pendant la durée requise, et ne doit pas constituer le pays d'origine. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17529}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17530} Qu'est-ce qui met fin à une patrie ? Pour les Hanafites, une patrie d'origine prend fin uniquement lorsque la famille déménage et quitte l'ancienne. Les Hanbalites estiment qu'elle ne prend pas fin lorsqu'on s'installe dans une autre patrie d'origine. Un homme ayant des épouses dans deux villes possède deux patries d'origine, ce que les Hanafites, les Malikites et les Hanbalites reconnaissent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17530} Une patrie de résidence prend fin avec une patrie d'origine et avec un voyage, et une habitation prend fin avec une patrie d'origine, une résidence et une autre habitation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17530}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17531} Règles liées au pays d'origine: raccourcissement de la prière, regroupement des prières, rupture du jeûne du Ramadan, sacrifice, et prières du vendredi et des fêtes. Le résident de son pays d'origine ou de résidence ne raccourcit pas la prière, et celui qui retourne dans son pays d'origine doit accomplir la prière complète dès son arrivée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17531} Pour les voyageurs, la majorité autorise le regroupement des prières de midi et de l'après-midi, ainsi que des prières du coucher du soleil et de la nuit, tandis que les hanafites le refusent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17531} Un voyageur peut rompre le jeûne du Ramadan pendant son voyage; Si le voyage s'achève dans la journée, il doit s'abstenir pour le reste de la journée et rattraper les jours manqués ultérieurement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17531}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17532} Concernant le sacrifice: les hanafites le considèrent comme obligatoire et exigent la résidence pour l'accomplir, tandis que la majorité le considère comme une sunna et n'exige pas la résidence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17532} Prière du vendredi: un voyageur qui termine son voyage avant la prière du vendredi est tenu d'y assister; le voyage s'achève systématiquement à l'entrée dans le pays d'origine, et ensuite par la résidence dans le pays de résidence, sous réserve des conditions qui y sont rattachées. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17532} Les prières des fêtes: obligatoires pour les Hanafites, fortement recommandées (sunna) pour les Malikites et les Chafi'ites, et une obligation communautaire (fard kifaya) pour les Hanbalites; la majorité considère que la résidence ou l'établissement est une condition de cette obligation, contrairement aux Chafi'ites, de sorte que le voyageur n'y est pas tenu selon l'avis majoritaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17532} Transfert de la zakat: tous s'accordent à dire que les habitants de la ville où se trouvent les biens et le payeur ont la priorité; lorsque le payeur et les biens se trouvent dans des villes différentes, les juristes divergent quant à savoir si c'est la ville des biens ou celle du payeur qui est compétente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17532}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17533} Une femme originaire d'une zone de guerre entrant dans une zone d'Islam: si elle y entre avec un sauf-conduit et épouse un musulman ou un dhimmi, elle devient dhimmi, car par sa résidence, elle suit son mari, qui est établi de façon permanente dans une zone d'Islam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17533} Exil d'un étranger adultère: les écoles chaféite et hanbalite estiment qu'un étranger adultère est exilé hors de sa patrie; les malikites disent que s'il commet l'adultère à son arrivée en ville, il y est emprisonné, et si, après s'être installé parmi les siens, il est exilé dans une autre ville. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17533} Émigration de la patrie par ceux qui se trouvent dans une zone de guerre: les cas varient, certains sont obligatoires, d’autres recommandés, d’autres encore non obligatoires; voir les détails à l’article « Émigration ». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17533} Installation dans une zone de guerre: un musulman ne peut quitter la patrie de l’Islam pour s’y installer définitivement dans une zone de guerre. Le voyage vers une zone de guerre à des fins commerciales est sujet à controverse: il est interdit, déconseillé ou permis, à condition qu’il ne soit pas contraint à un acte interdit ou à un devoir omis; le voyage pour un motif licite, comme le rachat d’un musulman ou la transmission d’un message, est permis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17533}"
  ur: "وطن، لغوی طور پر، ایک رہائش گاہ یا وہ جگہ ہے جہاں کوئی شخص رہتا ہے اور آباد ہوتا ہے۔ بھیڑ، مویشیوں اور اونٹوں کی تہوں کو بھی وطن کہتے ہیں۔ تکنیکی طور پر یہ وہ جگہ ہے جہاں انسان رہتا ہے اور آباد ہوتا ہے، چاہے وہ وہاں پیدا ہوا ہو یا نہ ہو۔ محلہ، وہ چوتھائی جہاں لوگ رہتے ہیں، وطن سے تنگ ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17527}{cite:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17528} وطن کی اقسام، ان سے منسلک اصولوں کے مطابق: اصل وطن ⁦(وطن عسلی)⁩، اقامت وطن ⁦(وطنِ وطن)⁩، وطنِ وطن ⁦(وطنِ وطن)⁩۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17528} اصل وطن: حنفیہ کے لیے، کسی شخص کی پیدائش، شادی یا آباد ہونے کی جگہ؛ اسے خاندانی وطن یا فطرت کا وطن بھی کہا جاتا ہے۔ شافعیوں اور حنبلیوں کے نزدیک یہ وہ جگہ ہے جہاں کوئی شخص گرمیوں یا سردیوں میں بغیر ضرورت کے چھوڑے بغیر رہتا ہے۔ حنبلی صوتی قول میں ایک ایسی بستی کا اضافہ کرتے ہیں جہاں اس کی بیوی ہو یا شادی شدہ ہو، عثمان کے اس قول پر کہ جس نے کسی بستی میں شادی کی وہ وہاں کے رہنے والے کی نماز پڑھے۔ احمد کی ایک رپورٹ میں ایک قصبہ بھی شامل ہے جہاں اس کے لوگ یا مویشی ہیں۔ مالکیوں نے اسے ہمیشہ رہنے کے ارادے سے کسی شخص کے رہنے کی جگہ اور اس بیوی کی جگہ سے تعبیر کیا ہے جس کے ساتھ اس نے زندگی گزاری ہو، اگرچہ وہ وہاں بہت کم رہتا ہو۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17528}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17529} اقامت وطن ⁦(اقامہ)⁩: حنفیہ کے لیے وہ جگہ جہاں کوئی شخص سفر کے احکام کے لیے قیام کی نیت سے جاتا ہے؛ دوسرے فقہا معنی پر متفق ہیں اور مدت کے بارے میں اختلاف رکھتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17529} مسکن ⁦(سکنا)⁩: احناف کے لیے وہ جگہ جہاں آدمی کا مطلب سفر منسوخ ہونے والی مدت سے کم ٹھہرنا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17529} شرائط: اصل وطن کو روایتی طریقے سے مستقل عمارت کی ضرورت ہے ⁦(مالک، شافعی، حنبلی)⁩؛ احناف پیدائش، شادی یا آباد ہونے کی جگہ کو اصل وطن سمجھتے ہیں۔ اقامتی وطن کے لیے قیام کی نیت، متعلقہ مدت، جگہ لینے، اس کی فٹنس، اور یہ کہ یہ شخص کا اصل وطن نہیں ہے۔ رہائش کو قیام کا کوئی ارادہ اور مدت کے لیے حقیقی قیام کی ضرورت نہیں ہے، اور یہ اصل وطن نہیں ہونا چاہیے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17529}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17530} وطن کا خاتمہ کیا ہوتا ہے: احناف کے لیے اصل وطن صرف خاندان کے ساتھ دوسرے میں جانے اور پرانے کو چھوڑنے سے ختم ہوتا ہے۔ حنبلیوں کا خیال ہے کہ یہ ایک اور اصل وطن لینے سے ختم نہیں ہوتا۔ دو شہروں میں بیویاں رکھنے والے مرد کے دو اصلی وطن ہوتے ہیں جن پر احناف، مالکیہ اور حنبلی متفق ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17530} رہائش کا وطن اصل وطن اور سفر پر ختم ہوتا ہے اور رہائش اصل وطن، رہائش اور دوسرے مکان پر ختم ہوتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17530}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17531} وطن سے منسلک احکام: نماز قصر کرنا، نمازوں کو جمع کرنا، رمضان کے روزے توڑنا، نماز جمعہ اور جمعہ کی نماز۔ اپنے اصل یا وطن میں رہنے والا نماز قصر نہیں کرتا اور اپنے اصل وطن میں واپس آنے والے کو داخل ہوتے ہی نماز پوری کرنی چاہیے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17531} مسافروں کی اکثریت ظہر اور عصر کی نماز اور غروب آفتاب اور رات کی نمازوں کو اکٹھا کرنے کی اجازت دیتی ہے جبکہ احناف اس کا انکار کرتے ہیں۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17531} مسافر سفر میں رمضان کا روزہ توڑ سکتا ہے۔ اگر سفر دن میں ختم ہو جائے تو ضروری ہے کہ باقی دن پرہیز کرے اور بعد کے دنوں کی قضا کرے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17531}{cite:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17532} قربانی کے بارے میں: احناف اسے واجب سمجھتے ہیں اور واجب کے لیے اقامت چاہتے ہیں، جب کہ اکثریت اسے سنت سمجھتے ہیں اور اقامت کی ضرورت نہیں رکھتے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17532} جمعہ کی نماز: جو مسافر جمعہ کی نماز سے پہلے اپنا سفر ختم کرتا ہے اس پر اس میں شرکت کرنا واجب ہے۔ سفر کا اختتام ہر حال میں اصل وطن میں داخل ہونے پر ہوتا ہے اور اس کے بعد وطن میں اپنی شرائط پر قیام کے بعد۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17532} تہوار کی نمازیں: احناف کے لیے فرض، مالکیوں اور شافعیوں کے لیے ایک مضبوط سنت، اور حنبلیوں کے لیے ایک اجتماعی فرض ⁦(فرض کفایہ)⁩؛ جمہور کا خیال ہے کہ شافعیہ کے نزدیک رہائش یا قیام واجب کی شرط ہے، لہذا جمہور کے نزدیک مسافر واجب نہیں ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17532} زکوٰۃ کی منتقلی: سب اس بات پر متفق ہیں کہ اس بستی کے لوگ جہاں مال اور ادا کرنے والے کا پہلا دعویٰ ہے۔ جہاں ادا کرنے والا اور مال مختلف شہروں میں ہے، وہاں فقہاء کا اختلاف ہے کہ آیا مال کا قصبہ ہے یا ادا کرنے والے کا شہر۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17532}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17533} ایک جنگ کی عورت کا اسلام کے گھر میں داخل ہونا: اگر وہ محفوظ طریقے سے داخل ہو اور کسی مسلمان یا کسی سے شادی کر لے تو وہ اس کی طرف سے ضمی ہو جائے گی۔ شوہر جو اسلام کے گھر میں ہمیشہ کے لیے آباد ہے۔ زنا کرنے والے اجنبی کو ملک بدر کرنا: شافعیہ اور حنبلی کا خیال ہے کہ زنا کرنے والے اجنبی کو اس کے وطن کے علاوہ کسی اور جگہ جلاوطن کیا جاتا ہے۔ مالکیوں کا کہنا ہے کہ اگر وہ شہر میں پہنچ کر اس کا ارتکاب کرتا ہے تو اسے وہاں قید کر دیا جاتا ہے اور اگر اپنے لوگوں کے ساتھ آباد ہونے کے بعد اسے دوسرے شہر میں جلاوطن کر دیا جاتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17533} جنگ کے گھر والوں کی وطن سے ہجرت: اس کے معاملات مختلف ہیں، بعض واجب، بعض مستحب، بعض واجب نہیں؛ ہجرت کے تحت تفصیلی. {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17533} جنگ کے گھر میں آباد ہونا: ایک مسلمان اسلام کے گھر سے جنگ کے گھر تک سفر نہیں کر سکتا تاکہ وہاں ہمیشہ کے لیے آباد ہو۔ تجارت کے لیے جنگ کے گھر کا سفر حرام، ناپسندیدہ اور جائز کے درمیان اختلاف ہے، اگر وہ کسی حرام کام یا چھوڑے ہوئے فرض پر مجبور نہ ہو۔ کسی جائز مقصد کے لیے سفر کرنا، جیسے کسی مسلمان کو فدیہ دینا یا پیغام پہنچانا، کی اجازت ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص17533}"
