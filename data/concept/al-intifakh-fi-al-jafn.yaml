id: "concept/al-intifakh-fi-al-jafn"
class: "concept"
kind: "scientific"
label:
  ar: "الانتفاخ في الجفن"
  en: "Puffiness of the lid (intifakh)"
  fr: "La bouffissure de la paupière (intifakh)"
  ur: "پلک کی سوجن ⁦(انتفاخ)⁩"
  es: "Hinchazón de la tapa (intifakh)"
  tr: "Göz kapağı şişmesi"
  id: "Pembengkakan kelopak mata"
summary:
  ar: "الانتفاخ ورم بارد مع حكة يكون الغالب عليه ريحاً أو فضلة بلغمية رقيقة أو مائية أو سوداوية، ولكل صنف علامة من سرعة العروض وأثر الغمز والثقل واللون والامتداد {cite:canon-ibn-sina-print-v2 p.198} {cite:canon-ibn-sina-print-v2 p.199}"
  en: "Intifakh is a cold swelling with itching, dominated either by wind or by a thin phlegmy, watery or melancholic residue; each kind is told by the speed of onset, the mark of pressing, heaviness, colour and spread {cite:canon-ibn-sina-print-v2 p.198} {cite:canon-ibn-sina-print-v2 p.199}"
  fr: "L'intifakh est une enflure froide accompagnée de démangeaisons, dominée soit par le vent, soit par un résidu ténu, phlegmatique, aqueux ou mélancolique ; chaque sorte se reconnaît à la rapidité de son apparition, à la trace laissée par la pression, à la lourdeur, à la couleur et à l'étendue {cite:canon-ibn-sina-print-v2 p.198} {cite:canon-ibn-sina-print-v2 p.199}"
  ur: "انتفاخ خارش کے ساتھ ایک سرد سوجن ہے جس پر یا تو ریح غالب ہوتی ہے یا پتلی بلغمی، پانی والی یا سودوی فضلہ؛ ہر قسم کو آغاز کی رفتار، دبانے کے اثر، بھاری پن، رنگ اور پھیلاؤ سے پہچانا جاتا ہے {cite:canon-ibn-sina-print-v2 p.198} {cite:canon-ibn-sina-print-v2 p.199}۔"
  es: "El intifakh es una hinchazón fría con picazón, dominada por el viento o por un residuo fino, flemático, acuoso o melancólico; cada tipo se distingue por la rapidez de aparición, la marca de presión, la pesadez, el color y la extensión {cite:canon-ibn-sina-print-v2 p.198} {cite:canon-ibn-sina-print-v2 p.199}"
  tr: "Şişlik, genellikle koku veya ince, sulu ya da siyah flegmatik dışkı ile karakterize edilen kaşıntılı soğuk bir tümördür. Her türün sunum hızı, karıncalanma etkisi, ağırlık, renk ve yayılma belirtileri vardır {cite:canon-ibn-sina-print-v2 s.198} {cite:canon-ibn-sina-print-v2 s.199}"
  id: "Pembengkakan adalah tumor dingin yang gatal yang biasanya ditandai dengan bau atau tinja tipis, encer, atau hitam yang frematik. Setiap jenis memiliki tanda-tanda kecepatan presentasi, efek kesemutan, berat, warna, dan penyebaran {cite:canon-ibn-sina-print-v2 hlm.198} {cite:canon-ibn-sina-print-v2 hlm.199} {cite:canon-ibn-sina-print-v2 hlm.199}"
