summary:
  ar: "يذكر ابن سينا من أسباب الضعف ما يتعلق بالاستفراغ كنزف الدم والإسهال وبزل ماء الاستسقاء والعرق الكثير والرياضة المفرطة والأوجاع والجوع الكثير، ثم الضعف التابع لضعف عضو آخر وتفاوت الأعضاء في الخلقة {cite:canon-ibn-sina-print-v1 pp.152-153}."
  en: "Among the causes of weakness Ibn Sina lists those tied to evacuation, such as bleeding, diarrhoea, draining dropsical water, heavy sweating, excess exercise, pains and much hunger, then weakness following the weakness of another organ and the unequal strength of organs by creation {cite:canon-ibn-sina-print-v1 pp.152-153}."
