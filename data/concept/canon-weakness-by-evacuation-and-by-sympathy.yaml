id: concept/canon-weakness-by-evacuation-and-by-sympathy
class: concept
kind: scientific
label: { ar: "الضعف بالاستفراغ والمشاركة عند ابن سينا", en: "Weakness by evacuation and by sympathy in the Canon", ur: "استفراغ اور مشارکت سے کمزوری، قانون کے مطابق", es: "Debilidad por evacuación y por simpatía en el Canon", fr: "Faiblesse due à l'évacuation et à la sympathie dans le Canon" }
summary:
  ar: "يذكر ابن سينا من أسباب الضعف ما يتعلق بالاستفراغ كنزف الدم والإسهال وبزل ماء الاستسقاء والعرق الكثير والرياضة المفرطة والأوجاع والجوع الكثير، ثم الضعف التابع لضعف عضو آخر وتفاوت الأعضاء في الخلقة {cite:canon-ibn-sina-print-v1 pp.152-153}."
  en: "Among the causes of weakness Ibn Sina lists those tied to evacuation, such as bleeding, diarrhoea, draining dropsical water, heavy sweating, excess exercise, pains and much hunger, then weakness following the weakness of another organ and the unequal strength of organs by creation {cite:canon-ibn-sina-print-v1 pp.152-153}."
  es: "Entre las causas de debilidad, Ibn Sina enumera aquellas relacionadas con la evacuación, como sangrado, diarrea, pérdida de agua, sudoración excesiva, ejercicio excesivo, dolores y mucha hambre, luego la debilidad que sigue a la debilidad de otro órgano y la fuerza desigual de los órganos por creación {cite:canon-ibn-sina-print-v1 pp.152-153}."
  fr: "Parmi les causes de faiblesse, Ibn Sina cite celles liées à l'évacuation, telles que les saignements, la diarrhée, l'écoulement d'eau goutteuse, la transpiration abondante, l'exercice excessif, les douleurs et la grande faim, puis la faiblesse consécutive à la faiblesse d'un autre organe et à la force inégale des organes par la création {cite:canon-ibn-sina-print-v1 pp.152-153}."
  ur: "ابن سینا نے کمزوری کے اسباب میں سے انخلا سے منسلک وجوہات کی فہرست دی ہے، جیسے خون بہنا، اسہال، قطرے کا پانی نکلنا، بہت زیادہ پسینہ آنا، زیادہ ورزش، درد اور بہت بھوک، پھر دوسرے عضو کی کمزوری کے بعد کمزوری اور تخلیق کے ذریعہ اعضاء کی غیر مساوی طاقت۔"
