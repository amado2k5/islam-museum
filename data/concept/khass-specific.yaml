label: { ar: "الخاص", en: "Khass (specific; opposite of general)", ur: "خاص" }
summary:
  ar: "الخاص لغة ضد العام، واصطلاحا ما وُضع لواحد منفرد أو كثير محصور، سواء كان الواحد شخصا كزيد أو نوعا كرجل وفرس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7529} والعام اللفظ المستغرق لجميع ما يصلح له بوضع واحد من غير حصر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7529} وإذا ورد لفظ خاص ثبت الحكم لمدلوله ما لم يقم دليل على تأويله؛ وإذا تعارض الخاص مع العام فالشافعية يخصصون العام بالخاص، والحنفية يرون أن المتأخر منهما ينسخ بقدر ما يدل عليه، والتوقف عند الجهل بالمتقدم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7530} والأجير الخاص من يعمل لواحد عملا مؤقتا، ويستثنى من وقت عمله التطهر للصلوات وفعلها وصلاة الجمعة والعيد، ولا يلزم المستأجر تمكينه من الجماعة إلا في شروط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7530} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7531} والطريق الخاص الممر غير النافذ المحصور بدور قوم، ولا يحدث فيه أحد دون إذن أهله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7531} والمال الخاص ما يملكه شخص معين، ويقابله المال العام كبيت المال والوقف على المسلمين، ويقطع سارق المال الخاص بشروطه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7531} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7532} "
  en: "Khass (specific) is lexically the opposite of general; technically a term coined for one thing or a limited number, whether a single person such as Zayd or a kind such as man or horse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7529} A general term embraces all that it can apply to under one coinage without limit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7529} A specific word fixes its ruling unless a proof calls for another meaning; when specific and general conflict, the Shafiis let the specific narrow the general, while the Hanafis hold the later one abrogates to the extent of its indication and suspend judgement when the order is unknown. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7530} A hired worker for a term serves all the agreed time, except for the times of purification and the five prayers, the Friday and festival prayers, and need not be allowed to attend the congregation except on conditions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7530} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7531} A private road is a closed passage between a limited number of houses, and no one may alter it without the leave of its owners. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7531} Private property is held by a particular person; public property, such as the treasury and waqf for all Muslims, is contrasted with it, and the thief of private property is cut by the usual conditions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7531} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7532} "
  ur: "خاص لغت میں عام کی ضد ہے، اور اصطلاح میں وہ لفظ جو ایک منفرد چیز یا محدود تعداد کے لیے وضع ہو، خواہ شخص ہو جیسے زید یا نوع جیسے مرد اور گھوڑا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7529} عام وہ لفظ ہے جو بغیر حصر ایک وضع سے اپنے تمام مصداقوں کو شامل ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7529} خاص لفظ سے حکم اس کے مدلول پر ثابت ہوتا ہے جب تک کوئی تاویل کی دلیل نہ ہو؛ خاص اور عام میں تعارض ہو تو شافعیہ خاص سے عام کی تخصیص کرتے ہیں، جبکہ حنفیہ کے نزدیک متأخر دلیل بقدرِ دلالت ناسخ ہوتی ہے، اور متقدم معلوم نہ ہو تو توقف کیا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7530} اجیر خاص وہ ہے جو کسی ایک کے لیے مؤقت کام کرے؛ اس کے وقت میں طہارت، پانچ نمازوں، جمعہ اور عید کے اوقات مستثنیٰ ہیں، اور جماعت کی حاضری کے لیے مستأجر پر اجازت دینا لازم نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7530} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7531} طریقِ خاص وہ بند راستہ ہے جو چند گھروں کے درمیان ہو، اور اس میں اہل کی اجازت کے بغیر کوئی تبدیلی نہیں کی جا سکتی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7531} مالِ خاص وہ ہے جو کسی متعین شخص کی ملکیت ہو، اور اس کے مقابل مالِ عام ہے جیسے بیت المال اور مسلمانوں کے لیے وقف؛ مالِ خاص کی چوری پر شرائط کے ساتھ ہاتھ کاٹا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7531} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7532} "
