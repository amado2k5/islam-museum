id: concept/zij-sabi-sexagesimal-division
class: concept
kind: scientific
label: { ar: "القسمة في الأعداد الستينية", en: "Dividing sexagesimal quantities", ur: "ستینی اعداد کی تقسیم", es: "Dividir cantidades sexagesimales", fr: "Division des quantités sexagésimales", tr: "Altmışlık sayılara bölme", id: "Pembagian dalam bilangan seksagesimal" }
summary:
  ar: "يعرّف البتاني القسمة بأنها معرفة ما يكون من أضعاف الأكثر بالأقل إذا عُدّ الأكثر بالأقل وأن يعرف جزء الأقل من الأكثر، ويقرر أن قسمة درجة على درجة تعطي درجة، وأن قسمة الأسفل على الأعلى تعطي جنساً إذا ضُرب في المقسوم عليه عاد إلى المقسوم، وأن قسمة الأعلى على الأسفل تقتضي بسط الأعلى إلى الأسفل ثم القسمة فيخرج درج. {cite:zij-sabi-nallino-byblion pp.15-16}."
  en: "Al-Battani defines division as knowing how many multiples of the lesser the greater holds when the greater is counted by the lesser, and what part the lesser is of the greater; he sets down that degree divided by degree gives degree, that dividing a lower order by a higher gives the order which, multiplied by the divisor, returns the dividend, and that dividing a higher order by a lower requires extending the higher to the lower and then dividing, which yields degrees. {cite:zij-sabi-nallino-byblion pp.15-16}."
  ur: "البتانی قسمت کی تعریف کرتے ہیں کہ بڑے کو چھوٹے سے گننے پر بڑے میں چھوٹے کے کتنے اضعاف ہیں یہ معلوم کرنا اور چھوٹے کا بڑے میں جزء معلوم کرنا؛ وہ طے کرتے ہیں کہ درجے کو درجے پر تقسیم کریں تو درجہ ملتا ہے، نچلی جنس کو اوپر والی پر تقسیم کریں تو وہ جنس ملتی ہے جسے مقسوم علیہ سے ضرب دیں تو مقسوم لوٹ آئے، اور اوپر والی کو نچلی پر تقسیم کرنے کے لیے اوپر والی کو نچلی تک پھیلانا اور پھر تقسیم کرنا ہوتا ہے، جس سے درجے نکلتے ہیں۔ {cite:zij-sabi-nallino-byblion pp.15-16}۔"
  es: "Al-Battani define la división como saber cuántos múltiplos del menor contiene el mayor cuando se cuenta el mayor por el menor, y qué parte es el menor del mayor; establece que grado dividido por grado da grado, que dividir un orden inferior por uno superior da el orden que, multiplicado por el divisor, devuelve el dividendo, y que dividir un orden superior por uno inferior requiere extender el superior al inferior y luego dividir, lo que produce grados. {cite:zij-sabi-nallino-byblion pp.15-16}."
  fr: "Al-Battani définit la division comme la connaissance du nombre de multiples du plus petit que contient le plus grand lorsqu'on compte le plus grand par le plus petit, et de la part que représente le plus petit dans le plus grand; il précise que le degré divisé par un degré donne le degré, que la division d'un degré inférieur par un degré supérieur donne le degré qui, multiplié par le diviseur, donne le dividende, et que la division d'un degré supérieur par un degré inférieur nécessite d'étendre le degré supérieur au degré inférieur puis de diviser, ce qui donne des degrés. {cite:zij-sabi-nallino-byblion pp.15-16}."
  tr: "El-Battani, bölmeyi, büyük sayının küçük sayıyla çarpılması durumunda büyük sayının küçük sayıyla katlarını bilmek ve küçük sayının büyük sayıya oranının ne olduğunu bilmek olarak tanımlar. Bir derecenin başka bir dereceye bölünmesinin bir derece verdiğini ve küçük sayının büyük sayıya bölünmesinin, bölenle çarpıldığında bölüneni veren bir tür verdiğini belirtir. Ayrıca, büyük sayının küçük sayıya bölünmesinin, büyük sayının küçük sayıya bölünmesi ve ardından bölünmesiyle dereceler elde edilmesini gerektirdiğini de ifade eder. {cite:zij-sabi-nallino-byblion pp.15-16}."
  id: "Al-Battani mendefinisikan pembagian sebagai mengetahui apa yang merupakan kelipatan dari yang lebih besar oleh yang lebih kecil jika yang lebih besar dihitung dengan yang lebih kecil, dan mengetahui apa yang merupakan bagian dari yang lebih kecil oleh yang lebih besar. Ia menyatakan bahwa membagi satu derajat dengan derajat lain menghasilkan suatu derajat, dan bahwa membagi yang lebih rendah dengan yang lebih tinggi menghasilkan suatu jenis yang, ketika dikalikan dengan pembagi, kembali ke yang dibagi. Ia juga menyatakan bahwa membagi yang lebih tinggi dengan yang lebih rendah membutuhkan perluasan yang lebih tinggi dengan yang lebih rendah dan kemudian dibagi, menghasilkan derajat. {cite:zij-sabi-nallino-byblion pp.15-16}."
