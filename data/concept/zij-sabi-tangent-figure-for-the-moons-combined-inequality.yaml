summary:
  ar: "يرسم البتاني شكلاً فيه خطوط تماسّ لفلك التدوير ولفلك الخارج المركز، ومثلثات قائمة الزوايا، ليصل بالهندسة إلى الاختلاف المركب؛ وبه تكون المسافة بين المركزين نحو عشرة أجزاء وتسعة عشر دقيقة. {cite:zij-sabi-nallino-byblion p.79}."
  en: "Al-Battani draws a figure with tangent lines to the epicycle and to the eccentric sphere, and right triangles, to reach the combined inequality by geometry. In it the distance between the two centres comes to about ten parts and nineteen minutes. {cite:zij-sabi-nallino-byblion p.79}."
  ur: "البتانی ایک شکل بناتے ہیں جس میں فلکِ تدویر اور خارج المرکز فلک کے لیے مماسی خطوط اور قائم الزاویہ مثلثات ہیں، تاکہ ہندسے سے مرکب اختلاف تک پہنچا جائے؛ اس میں دونوں مرکزوں کا فاصلہ تقریباً دس اجزاء اور انیس دقائق ہے۔ {cite:zij-sabi-nallino-byblion p.79}۔"
  es: "Al-Battani dibuja una figura con líneas tangentes al epiciclo y a la esfera excéntrica, y triángulos rectángulos, para llegar a la desigualdad combinada mediante geometría. En ella, la distancia entre los dos centros es de aproximadamente diez partes y diecinueve minutos. {cite:zij-sabi-nallino-byblion p.79}."
  fr: "Al-Battani trace une figure comportant des tangentes à l'épicycle et à la sphère excentrique, ainsi que des triangles rectangles, afin d'établir géométriquement l'inégalité combinée. Dans cette figure, la distance entre les deux centres est d'environ dix parties et dix-neuf minutes. {cite:zij-sabi-nallino-byblion p.79}."
