id: "concept/al-jarab-wa-al-hakka-fi-al-ajfan"
class: "concept"
kind: "scientific"
label:
  ar: "الجرب والحكة في الأجفان"
  en: "Itch and scab of the eyelids"
  fr: "Démangeaisons et croûtes des paupières"
  ur: "پلکوں کی خارش اور کھجلی"
  es: "Picazón y costras en los párpados"
  tr: "Uyuz ve göz kapaklarında kaşıntı"
  id: "Kudisi dan gatal di kelopak mata"
summary:
  ar: "الجرب والحكة في الأجفان سببه مادة مالحة بورقية من دم حاد أو خلط حاد يحدث حكاً ثم يجرب، ويبتدئ حكة يسيرة ثم خشونة واحمراراً ثم تبنياً متقرحاً ثم المحبب الصلب، وإن قارن رمداً عولج الرمد أولاً مع مراعاة أشد الداءين {cite:canon-ibn-sina-print-v2 p.197} {cite:canon-ibn-sina-print-v2 p.198}"
  en: "The itch and scab of the lids come from a salty, acrid matter of sharp blood or another sharp humour that produces itching then scab; it begins as slight itching, then roughness and redness, then ulcerating chaps, then the hard granular stage; if ophthalmia is present it is treated first, while the severer of the two illnesses is always attended to {cite:canon-ibn-sina-print-v2 p.197} {cite:canon-ibn-sina-print-v2 p.198}"
  fr: "Dans cette description ancienne, les démangeaisons et les croûtes des paupières proviennent d’une matière salée et âcre, issue d’un sang âcre ou d’une autre humeur âcre. La démangeaison est d’abord légère, puis viennent la rugosité et la rougeur, les crevasses ulcérées et enfin le stade dur et granuleux. En présence d’une ophtalmie, celle-ci était traitée en premier ; plus généralement, on s’occupait de la plus grave des deux maladies {cite:canon-ibn-sina-print-v2 p.197} {cite:canon-ibn-sina-print-v2 p.198}"
  ur: "پلکوں کی خارش اور کھجلی کا سبب تیز خون یا کسی اور تیز خلط سے نمکین کڑوا مادہ ہے جو پہلے خارش پھر کھجلی پیدا کرتا ہے؛ آغاز ہلکی خارش، پھر کھردراپن اور سرخی، پھر چالے دار چھاجن، پھر سخت دانے دار مرحلہ ہوتا ہے؛ اور اگر رمد بھی ہو تو پہلے اس کا علاج ہو، اور ہمیشہ سخت تر مرض کی خاطر توجہ دی جائے {cite:canon-ibn-sina-print-v2 p.197} {cite:canon-ibn-sina-print-v2 p.198}۔"
  es: "El picor y la costra de los párpados provienen de una sustancia salada y acre de sangre irritante u otro humor irritante que produce picor y luego costra; comienza con un ligero picor, luego aspereza y enrojecimiento, luego úlceras y finalmente la etapa granular dura; si hay oftalmía, se trata primero, mientras que la más grave de las dos enfermedades siempre se atiende {cite:canon-ibn-sina-print-v2 p.197} {cite:canon-ibn-sina-print-v2 p.198}"
  tr: "Uyuz ve göz kapaklarındaki kaşıntı, keskin kan veya keskin yumurdan kaynaklanan tuzlu, yapraksı bir madde nedeniyle kaşıntıya ve ardından uyuz ile başlar; hafif kaşıntı, sonra pürüzlülük ve kızarıklık, ardından ülseratif renk değişikliği ve sert granülasyon ile başlar. Konjonktivit karşılaştırıldığında, önce konjonktivit tedavi edilir ve en ağır hastalıklar dikkate alınarak {cite:canon-ibn-sina-print-v2 s.197} {cite:canon-ibn-sina-print-v2 s.198}"
  id: "Kudis dan gatal pada kelopak mata dimulai dengan gatal yang disebabkan oleh zat asin dan berdaun akibat darah tajam atau ovulasi tajam, diikuti oleh kudis; gatal ringan dimulai dengan kekasaran dan kemerahan, diikuti perubahan warna ulseratif dan granulasi keras. Dibandingkan dengan konjungtivitis, konjungtivitis diobati terlebih dahulu, dan mempertimbangkan penyakit paling parah {cite:canon-ibn-sina-print-v2 hlm.197} {cite:canon-ibn-sina-print-v2 hlm.198}"
