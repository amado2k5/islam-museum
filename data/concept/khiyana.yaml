label:
  ar: خيانة
  en: Khiyana (breach of trust)
  ur: خیانت
  es: "Khiyana (abuso de confianza)"
  fr: "Khiyana (rupture de confiance)"
  tr: "İhanet"
  id: "Pengkhianatan"
summary:
  ar: 'الخيانة والخون لغة أن يؤتمن الإنسان فلا ينصح، ونقيضها الأمانة، ولا يخرج استعمال الفقهاء لهذا اللفظ عن المعنى اللغوي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8031} من الألفاظ ذات الصلة: الغش وهو نقيض النصح واصطلاحا تدليس يرجع لذات المبيع كتجعيد الشعر ودق الثوب، والخيانة أعم إذ تكون تدليسا في ذات المبيع أو صفته كوصفه بصفات كاذبة أو أمر خارج كذكر ثمن كاذب؛ والنفاق وهو الدخول في الإسلام من وجه والخروج عنه من وجه آخر، فالخيانة في شأن العهد والأمانة والنفاق في شأن الدين؛ وفرقوا بين الخائن والسارق والغاصب فالخائن من خان ما جعل عليه أمينا، والسارق من أخذ خفية من موضع كان ممنوعا من الوصول إليه وربما قيل كل سارق خائن دون عكس، والغاصب من أخذ جهارا معتمدا على قوته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8031} خيانة الأمانة حرام بسورة الأنفال الآية 27 وبحديث «آية المنافق ثلاث: إذا حدث كذب وإذا وعد أخلف وإذا اؤتمن خان»، وعدها الذهبي وابن حجر الهيتمي من الكبائر وهي قبيحة في كل شيء لكن بعضها أشد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8032} بيوع الأمانة مبنية على الثقة والاطمئنان فيجب على البائع الصدق في الإخبار عما اشترى به وما قام به عليه، وتجب صيانتها عن الخيانة والتهمة قدر الإمكان بسورة الأنفال الآية 27 وحديث «من غشنا فليس منا»، ويحصل الاحتراز ببيان ما يجب بيانه، وفي حكمها إذا ظهرت خلاف تفصيله في بيع الأمانة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8032} عامل المساقاة أمين والقول قوله فيما يدعيه من هلاك وما يدعى عليه من خيانة، فإن ثبتت بإقرار أو بينة أو يمين مردودة ضم إليه من يشرف عليه إلى أن يتم العمل وأجرة المشرف على العامل، وإن ارتيب فيه فقط ضم إليه مشرف وأجرته على المالك عند الشافعية والحنابلة؛ واعتبر الحنفية كونه سارقا يخاف عليه من سرقة السعف والثمر عذرا في فسخ المساقاة لإلزامه صاحب الأرض ضررا لم يلتزمه؛ وقال المالكية إنها من العقود اللازمة فلا ينفسخ بكونه لصا ولا يقام غيره مقامه بل يحفظ منه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8032}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8033} من أخذ اللقطة بنية الخيانة والاستيلاء كان ضامنا غاصبا لا يبرأ من ضمانها حتى يؤديها إلى صاحبها، وفي برائته بدفعها إلى الحاكم أو إعادتها لموضعها خلاف يذكر في لقطة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8033} يراعي المحتسب أحوال أهل الصنائع من حيث الأمانة فيقر أهل الثقة ويبعد من ظهرت خيانته ويشهر أمره، ويجوز له جعل عريف لكل صنعة من صالح أهلها خبيرا بغشوشهم وتدليساتهم مشرفا على أحوالهم وأسعارهم لحديث «استعينوا على كل صنعة بصالح أهلها». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8033} لا تقطع يد خائن ولا خائنة لحديث جابر «ليس على خائن ولا منتهب ولا مختلس قطع» وحكى ابن الهمام الإجماع على ذلك، لأن الواجب قطع السارق والخائن غير سارق لقصور الحرز إذ المال كان في يده وحرزه مأذون لدخوله؛ واختلفوا في جاحد العارية فالجمهور على أنه لا قطع لأنه خائن أشبه جاحد الوديعة، وقال أحمد في رواية وإسحاق بن راهويه إن عليه القطع لحديث عائشة أن امرأة كانت تستعير المتاع وتجحده فأمر بقطع يدها، وقال الجمهور إن القطع كان عن سرقة صدرت منها بعد شهرتها بجحد العارية فعرفت بوصفها المشهور، وقال ابن قدامة إنه لا يعلم أحدا يوجب القطع على جاحد الوديعة ونحوها من الأمانات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8034}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8035} في خيانة المهادنين ذهب الشافعية والحنابلة إلى أن الإمام إذا استشعر خيانتهم بأمارات لا بمجرد توهم لم ينتقض عهدهم بل نبذ إليهم جوازا بسورة الأنفال الآية 58 ووجوبا قبل الإغارة عليهم، ومتى نقض الهدنة وفي دارنا منهم أحد وجب ردهم إلى مأمنهم؛ وقال المالكية إنه إذا ظن خيانتهم قبل المدة بظهور أمارتها نبذ العهد وجوبا وإنما ينذرهم واجبا فإن تحقق خيانتهم نبذ بلا إنذار؛ وأجاز الحنفية نقض الصلح متى رآه أنفع ولو لم يستشعر خيانة لأن المصلحة إذا تبدلت كان النبذ جهادا، ونقل ابن الهمام الإجماع على عدم تقيد النبذ بخطور الخوف، وإن بدءوا بخيانة قاتلهم الإمام ولم ينبذ إذا كان النقض باتفاقهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8035}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8036} صرح الشافعية والحنابلة بأن أهل الذمة إذا خيفت خيانتهم لم ينبذ إليهم العهد لأن عقد الذمة وجب لهم ولأنهم في قبضة الإمام فتستدرك خيانتهم بخلاف المهادنين الخارجين عن قبضته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8036} ومن دخل من المسلمين أرض العدو بأمان لم يخنهم في مالهم لأنهم أعطوه الأمان مشروطا بتركه خيانتهم معلوما في المعنى وإن لم يذكر في اللفظ، والخيانة غدر ولا يصلح الغدر، لحديث «المسلمون على شروطهم». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8036} ويمنع من الخروج في الجيش الخائن الذي يتجسس للكفار ويطلعهم على عورات المسلمين بالمكاتبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8036} وترد الخيانة في أبواب كثيرة كالبيع والشركة والمضاربة والوديعة والعارية واللقطة والوكالة والوصايا والحضانة والشهادة والسير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8036}'
  en: 'Khiyana (breach of trust) linguistically is that a person is entrusted and does not give faithful counsel; its opposite is amana, and the jurists'' usage does not depart from the linguistic sense. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8031} Related terms: ghishsh, the opposite of sincere counsel, technically a deception in the very sold item like curling hair or pounding cloth, khiyana being broader as deception in the item''s essence, its description with false qualities, or an outside matter like quoting a false price; nifaq, entering Islam one way and leaving it another, khiyana applying to pacts and trusts and nifaq to religion; and the betrayer, thief and usurper are distinguished: the betrayer betrays what was entrusted to him, the thief takes secretly from a place he was barred from reaching — every thief is a betrayer but not vice versa on a stated view — and the usurper takes openly relying on force. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8031} Betraying a trust is forbidden by Surah al-Anfal ayah 27 and the hadith "the signs of the hypocrite are three: when he speaks he lies, when he promises he breaks, when he is entrusted he betrays"; al-Dhahabi and Ibn Hajar al-Haytami count it among the grave sins, ugly in everything but worse in some. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8032} Trust-based sales rest on confidence between the parties, so the seller must be truthful in reporting what he paid and what it cost him, and such sales must be guarded from betrayal and suspicion as far as possible by Surah al-Anfal ayah 27 and "whoever deceives us is not of us"; guarding is achieved by disclosing what must be disclosed, and the ruling when betrayal appears is disputed, detailed under bay'' al-amana. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8032} The musaqah worker is trusted and his word accepted on claimed loss and on betrayal claims against him; if betrayal is proved by confession, evidence or returned oath, an overseer is attached to him until the work is done with the overseer''s wage on the worker, and if he is only suspected an overseer is attached at the owner''s cost, at the Shafiis and Hanbalis; the Hanafis count his being a thief feared for the fronds and fruit an excuse annulling the musaqah for imposing an unassumed harm on the landowner; the Malikis hold it a binding contract not annulled by his thieving, nor is he replaced but guarded. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8032}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8033} One who takes a found thing intending betrayal and seizure is liable as a usurper, not cleared until he delivers it to its owner; whether he is cleared by handing it to the ruler or returning it to its place is disputed, detailed under luqata. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8033} The market overseer watches craftsmen for honesty: he confirms the trustworthy, removes and publicizes the betrayer, and may appoint a guild head from each craft''s righteous, expert members, knowing their frauds, to supervise their affairs and prices, per "seek help for every craft from its righteous people". {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8033} The betrayer''s hand is not cut, per Jabir''s hadith "no cutting for a betrayer, a snatcher or an embezzler", Ibn al-Humam reporting consensus, since the duty is cutting the thief and the betrayer is no thief for the deficiency of custody, the property being in his authorized hands; they dispute the denier of a borrowed item: the majority impose no cutting as he is a betrayer like the deposit-denier, while Ahmad in a transmission and Ishaq ibn Rahawayh impose it for Aisha''s report that a woman used to borrow goods and deny them so he ordered her hand cut, the majority reading the cutting as for a theft she committed after becoming known for denying loans so she was described by her famous trait; Ibn Qudama knows none obliging cutting for a deposit-denier or like trusts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8034}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8035} On treaty partners'' betrayal: the Shafiis and Hanbalis hold that if the imam senses betrayal by clear signs, not mere fancy, their pact is not void but he may renounce it to them under Surah al-Anfal ayah 58 and must before attacking, and if the truce ends while some are in Muslim land they must be returned to safety; the Malikis hold that once he suspects betrayal before the term by appearing signs he must renounce the pact, warning them obligatorily unless their betrayal is confirmed; the Hanafis let the imam annul the truce whenever he sees benefit, even without sensing betrayal, since when benefit changes renouncing is jihad, Ibn al-Humam reporting consensus that renouncing is not conditioned on fear arising, and if they begin with betrayal the imam fights without renouncing when the breach is unanimous. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8035}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8036} The Shafiis and Hanbalis state that the pact with the people of the dhimma is not renounced on feared betrayal, since the dhimma contract is due to them and they are in the imam''s power so their betrayal can be countered, unlike treaty partners beyond his reach. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8036} A Muslim entering enemy land under aman must not betray them in property, since the aman was given conditioned on his not betraying, known in meaning though unexpressed, and betrayal is perfidy which has no place, per "Muslims are bound by their conditions". {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8036} The betrayer who spies for the unbelievers, informing them of the Muslims'' weak points by letter, is barred from going out with the army. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8036} Betrayal recurs across many chapters: sale, partnership, mudaraba, deposit, loan, the found thing, agency, wills, custody, testimony and the conduct of war. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8036}'
  ur: 'خیانت لغت میں یہ ہے کہ انسان کو امانت دی جائے اور وہ خیر خواہی نہ کرے، اس کا ضد امانت ہے، اور فقہاء کا استعمال اسی لغوی معنی سے باہر نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8031} متعلقہ الفاظ: غش جو نصیحت کا ضد ہے اور اصطلاحاً ایسا تدلیس جو مبیع کی ذات سے متعلق ہو جیسے بال گھونگرنا اور کپڑا کٹنا، خیانت اس سے عام ہے کہ تدلیس مبیع کی ذات میں ہو یا صفت میں جیسے جھوٹی صفات بیان کرنا یا بیرونی امر میں جیسے جھوٹا ثمن کہنا؛ نفاق یعنی ایک رخ سے اسلام میں داخل اور دوسرے سے خارج ہونا، خیانت عہد اور امانت کے معاملے میں اور نفاق دین کے معاملے میں کہا جاتا ہے؛ اور خائن، سارق اور غاصب میں فرق: خائن وہ جو اس امانت میں خیانت کرے جو اسے سونپی گئی، سارق وہ جو چھپ کر اس جگہ سے لے جہاں اس کی رسائی ممنوع تھی اور کہا گیا ہر سارق خائن مگر عکس نہیں، اور غاصب وہ جو اپنی قوت پر انحصار کرتے ہوئے علانیہ لے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8031} امانت میں خیانت حرام ہے سورۃ الانفال آیت 27 اور حدیث «منافق کی تین نشانیاں: جب بولے جھوٹ، جب وعدہ کرے خلاف ورزی، جب امانت دی جائے خیانت» سے؛ ذہبی اور ابن حجر ہیتمی نے اسے کبائر میں شمار کیا اور وہ ہر چیز میں بری مگر بعض میں زیادہ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8032} بیع الامانہ دونوں فریقوں کے باہمی اعتماد پر قائم ہے تو بائع پر لازم ہے کہ خریداری اور اس پر آئے اخراجات کی خبر میں سچ کہے، اور ان بیعوں کو خیانت اور تہمت سے جتنا ممکن ہو بچانا لازم ہے سورۃ الانفال آیت 27 اور حدیث «جو ہمیں دھوکہ دے وہ ہم میں سے نہیں» کے مطابق؛ احتراز اسے بیان کرنے سے ہوتا ہے جس کا بیان واجب ہے، اور ظاہر ہونے پر اس کا حکم مختلف فیہ ہے جس کی تفصیل بیع الامانہ میں ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8032} مساقات کا عامل امین ہے اور ہلاکت کے دعوے اور خیانت کے دعوے میں اسی کی بات مانی جاتی ہے؛ اگر خیانت اقرار، بینہ یا لوٹائی ہوئی قسم سے ثابت ہو تو اس کے ساتھ نگران ملایا جاتا ہے جب تک کام مکمل ہو اور نگران کی اجرت عامل پر؛ اور اگر صرف شبہ ہو تو نگران کی اجرت مالک پر، شافعیہ اور حنابلہ کے نزدیک؛ حنفیہ نے اس کا چور ہونا جس سے ادرک سے پہلے کھجور اور پھل کی چوری کا خوف ہو مساقات کی فسخ کا عذر مانا کیونکہ یہ مالکِ زمین پر ایسا نقصان لادتا ہے جس نے اس نے ذمہ نہیں لیا؛ مالکیہ کے نزدیک یہ لازم عقد ہے تو عامل کا چور ہونا اسے منفسخ نہیں کرتا نہ اس کی جگہ دوسرا مقرر ہوتا بلکہ اس سے حفاظت کی جاتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8032}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8033} جو لقطہ خیانت اور قبضے کی نیت سے اٹھائے وہ غاصب کی طرح ضامن ہے اور اس کے مالک تک پہنچائے بغیر ضمان سے نہیں نکلتا؛ حاکم کو سونپنے یا اس کی جگہ لوٹانے سے براءت میں اختلاف لقطہ میں بیان ہوگا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8033} محتسب اہلِ صنایع کی امانت کے لحاظ سے حالات دیکھتا ہے: اہلِ ثقہ کو برقرار اور جس کی خیانت ظاہر ہو اسے دور اور مشہور کرتا ہے، اور ہر صنعت کے لیے اس کے صالح اہل میں سے عارف مقرر کر سکتا ہے جو ان کے غش اور تدلیس سے واقف اور ان کے حالات اور قیمتوں پر نگران ہو، حدیث «ہر صنعت میں اس کے صالح اہل سے مدد لو» کے مطابق۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8033} خائن مرد یا عورت کا ہاتھ نہیں کاٹا جاتا جابر کی حدیث «نہ خائن پر نہ منتےب پر نہ مختلس پر قطع ہے» کے مطابق اور ابن ہمام نے اس پر اجماع نقل کیا، کیونکہ واجب سارق کا قطع ہے اور خائن حرز کے قصور سے سارق نہیں کہ مال اسی کے ہاتھ میں تھا اور اس کا حرز دخول کے لیے مأذون تھا؛ عاریہ کے جاحد میں اختلاف ہے: جمہور کے نزدیک قطع نہیں کیونکہ وہ ودیعت کے جاحد جیسا خائن ہے، اور احمد کی ایک روایت اور اسحاق بن راہویہ کے نزدیک قطع ہے عائشہ کی حدیث پر کہ ایک عورت سامان عاریہ لیتی اور جھٹلاتی تو اس نے اس کا ہاتھ کاٹنے کا حکم دیا؛ جمہور نے کہا قطع اس کی معروف جحد کے بعد اس سے صادر شدہ سرقے پر ہوا تو وہ اپنے معروف وصف سے پہچانی گئی؛ ابن قدامہ کے مطابق ودیعت کے جاحد اور دیگر امانتوں پر قطع کا قائل کوئی معلوم نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8034}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8035} مہادنوں کی خیانت میں شافعیہ اور حنابلہ کے نزدیک اگر امام محض وہم نہیں بلکہ امارات سے خیانت محسوس کرے تو ان کا عہد منتقض نہیں بلکہ ان کی طرف نبذ جائز ہے سورۃ الانفال آیت 58 کے مطابق اور حملے سے پہلے واجب، اور جب ہدنہ ٹوٹے اور ہمارے دار میں ان میں سے کوئی ہو تو اسے اس کے امن تک لوٹانا واجب؛ مالکیہ کے نزدیک اگر مدت سے پہلے خیانت کا ظن امارات کے ظہور سے ہو تو عہد نبذ کرنا واجب اور انہیں متنبہ کرنا واجب ہے مگر اگر خیانت متحقق ہو تو بغیر تنبیہ نبذ کرے؛ حنفیہ نے امام کے لیے صلح توڑنا اس وقت جائز کیا جب وہ اسے مفید سمجھے خواہ خیانت محسوس نہ ہو کیونکہ جب مصلحت بدلے تو نبذ جہاد ہے، ابن ہمام نے اجماع نقل کیا کہ نبذ خوف کے جنبنے سے مشروط نہیں، اور اگر وہ خیانت شروع کریں اور نقض ان کے اتفاق سے ہو تو امام بغیر نبذ قتال کرے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8035}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8036} شافعیہ اور حنابلہ نے صراحت کی کہ اہلِ ذمہ سے خیانت کا خوف ہو تو ان کی طرف عہد نبذ نہیں کی جاتی کیونکہ عقدِ ذمہ ان پر واجب ہے اور وہ امام کی قبضے میں ہیں تو ان کی خیانت کا تدارک ممکن ہے بخلاف مہادنوں کے جو اس کی قبضے سے باہر ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8036} جو مسلمان امن لے کر دشمن کی سرزمین میں داخل ہو وہ ان کے مال میں خیانت نہیں کرے گا کیونکہ انہوں نے اسے امن اس شرط کے ساتھ دیا کہ وہ خیانت نہ کرے، یہ معنی میں معلوم ہے خواہ لفظ میں نہ کہا گیا، اور خیانت غدر ہے جو جائز نہیں، حدیث «مسلمان اپنی شروط پر ہیں» کے مطابق۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8036} اور وہ خائن جو کفار کے لیے جاسوسی کرے اور مراسلے سے مسلمانوں کی کمزوریاں بتائے اسے لشکر میں نکلنے سے منع کیا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8036} خیانت کئی ابواب میں آتی ہے: بیع، شرکت، مضاربت، ودیعت، عاریت، لقطہ، وکالت، وصایا، حضانت، شہادت اور سیر۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8036}'
  es: "Khiyana (abuso de confianza) lingüísticamente es que a una persona se le confía algo y no da un consejo fiel; su opuesto es amana, y el uso de los juristas no se aparta del sentido lingüístico. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8031} Términos relacionados: ghishsh, lo opuesto al consejo sincero, técnicamente un engaño en el mismo artículo vendido como rizar el cabello o machacar la tela, khiyana siendo más amplio como engaño en la esencia del artículo, su descripción con cualidades falsas, o un asunto externo como citar un precio falso; nifaq, entrar en el Islam de una manera y salir de él de otra, khiyana aplicándose a pactos y fideicomisos y nifaq a la religión; y se distinguen el traidor, el ladrón y el usurpador: el traidor traiciona lo que se le confió, el ladrón toma en secreto de un lugar al que se le prohibió llegar —todo ladrón es un traidor pero no al revés en un punto de vista declarado— y el usurpador toma abiertamente confiando en la fuerza. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8031} Traicionar una confianza está prohibido por la Sura al-Anfal ayah 27 y el hadiz \"las señales del hipócrita son tres: cuando habla miente, cuando promete rompe, cuando se le confía traiciona\"; al-Dhahabi e Ibn Hajar al-Haytami lo consideran entre los pecados graves, feos en todo pero peores en algunos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8032} Las ventas basadas en la confianza se basan en la confianza entre las partes, por lo que el vendedor debe ser veraz al informar lo que pagó y lo que le costó, y tales ventas deben protegerse de la traición y la sospecha en la medida de lo posible por Surah al-Anfal ayah 27 y \"quien nos engaña no es de nosotros\"; la protección se logra revelando lo que debe ser revelado, y el dictamen cuando aparece la traición es disputado, detallado en bay' al-amana. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8032} Se confía en el trabajador de musaqah y se acepta su palabra en caso de pérdida reclamada y en caso de reclamaciones de traición en su contra; Si la traición se prueba mediante confesión, evidencia o juramento retornado, se le asigna un supervisor hasta que se complete el trabajo con el salario del supervisor sobre el trabajador, y si solo se sospecha que es un supervisor a costa del propietario, en los shafiíes y hanbalíes; los hanafíes consideran que el hecho de que sea un ladrón temido por las hojas y los frutos es una excusa que anula la musaqah por infligir un daño no asumido al propietario; los malikíes sostienen que es un contrato vinculante que no se anula por su robo, ni es reemplazado sino custodiado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8032}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8033} Quien toma algo encontrado con la intención de traicionarlo y apropiárselo es responsable como usurpador, y no queda libre de culpa hasta que lo entrega a su dueño; Si se le exonera entregándolo al gobernante o devolviéndolo a su lugar es discutido, detallado en luqata. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8033} El supervisor del mercado vigila a los artesanos para comprobar su honestidad: confirma a los dignos de confianza, elimina y publicita al traidor, y puede nombrar a un jefe de gremio de entre los miembros justos y expertos de cada oficio, conociendo sus fraudes, para supervisar sus asuntos y precios, según \"buscar ayuda para cada oficio de su gente justa\". {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8033} No se corta la mano del traidor, según el hadiz de Jabir \"no se corta para un traidor, un ladrón o un malversador\", Ibn al-Humam informa del consenso, ya que el deber es cortar al ladrón y el traidor no es ladrón por la deficiencia de custodia, estando la propiedad en sus manos autorizadas; Discrepan sobre el negador de un objeto prestado: la mayoría no impone la amputación, ya que es un traidor como el que niega el depósito, mientras que Ahmad en una transmisión e Ishaq ibn Rahawayh la imponen por el relato de Aisha de que una mujer solía pedir prestados bienes y negarlos, por lo que él ordenó que le cortaran la mano; la mayoría interpreta la amputación como por un robo que cometió después de hacerse conocida por negar préstamos, por lo que fue descrita por su famoso rasgo; Ibn Qudama no conoce ninguna amputación obligatoria para un negador de depósitos o fideicomisos similares. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8034}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8035} Sobre la traición de los socios del tratado: los shafiíes y hanbalíes sostienen que si el imán percibe la traición por señales claras, no por mera fantasía, su pacto no es nulo, sino que puede renunciar a él ante ellos según la Sura al-Anfal ayah 58 y debe hacerlo antes de atacar, y si la tregua termina mientras algunos están en tierra musulmana, deben ser devueltos a un lugar seguro; los malikíes sostienen que una vez que sospecha la traición antes del término por señales aparentes debe renunciar al pacto, advirtiéndoles obligatoriamente a menos que se confirme su traición; Los hanafíes permiten que el imán anule la tregua siempre que vea beneficio, incluso sin percibir traición, puesto que cuando el beneficio cambia renunciar es yihad, Ibn al-Humam informa del consenso de que renunciar no está condicionado a que surja el miedo, y si comienzan con la traición el imán lucha sin renunciar cuando la ruptura es unánime. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8035}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8036} Los shafiíes y los hanbalíes afirman que el pacto con la gente de la dhimma no se renuncia por temor a la traición, puesto que el contrato de dhimma se debe a ellos y están bajo el poder del imán, por lo que su traición puede ser contrarrestada, a diferencia de los socios de tratado que están fuera de su alcance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8036} Un musulmán que entra en territorio enemigo bajo aman no debe traicionarlos en bienes, puesto que el aman se dio condicionado a que no traicionara, conocido en significado aunque no expresado, y la traición es perfidia que no tiene lugar, según \"los musulmanes están obligados por sus condiciones\". {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8036} El traidor que espía para los infieles, informándoles por carta de los puntos débiles de los musulmanes, tiene prohibido salir con el ejército. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8036} La traición se repite en muchos capítulos: venta, sociedad, mudaraba, depósito, préstamo, objeto encontrado, agencia, testamentos, custodia, testimonio y conducción de la guerra. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8036}"
  fr: "Le terme « khiyana » (rupture de confiance) désigne linguistiquement le fait, pour une personne à qui l’on a confié une mission, de ne pas donner un conseil fidèle; son contraire est « amana », et l’usage juriste ne s’écarte pas de ce sens linguistique. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8031} Termes apparentés: « ghishsh », l’opposé d’un conseil sincère, désigne techniquement une tromperie portant sur le bien vendu lui-même, comme friser les cheveux ou battre un tissu; « khiyana » a un sens plus large et désigne une tromperie portant sur l’essence même du bien, sa description avec de fausses qualités, ou un élément extérieur, comme annoncer un prix erroné; « nifaq », le fait d’entrer dans l’islam d’une certaine manière et d’en sortir d’une autre; « khiyana » s’applique aux pactes et aux fiducies, et « nifaq » à la religion. On distingue le traître, le voleur et l'usurpateur: le traître trahit ce qui lui a été confié; le voleur prend en secret dans un lieu qui lui était interdit d'accès – tout voleur est un traître, mais l'inverse n'est pas toujours vrai; et l'usurpateur prend ouvertement, en usant de la force. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8031} La trahison d'un dépôt est interdite par la sourate al-Anfal, verset 27, et par le hadith: « Les signes de l'hypocrite sont au nombre de trois: lorsqu'il parle, il ment; lorsqu'il promet, il ne tient pas sa promesse; lorsqu'on lui confie quelque chose, il trahit. » Al-Dhahabi et Ibn Hajar al-Haytami la considèrent comme un péché grave, odieux en tout point, mais particulièrement odieux dans certains domaines. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8032} Les ventes basées sur la confiance reposent sur la confiance entre les parties. Le vendeur doit donc être honnête lorsqu'il déclare le prix payé et le prix d'achat. Ces ventes doivent être protégées autant que possible contre la trahison et la suspicion, conformément à la sourate al-Anfal, verset 27, et au principe selon lequel « quiconque nous trompe n'est pas des nôtres ». Cette protection passe par la divulgation des informations obligatoires. La règle applicable en cas de trahison est sujette à controverse et détaillée dans la section « bay' al-amana ». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8032} On fait confiance au travailleur de la musaqah et sa parole est acceptée en cas de perte déclarée ou d'accusations de trahison à son encontre. Si la trahison est prouvée par aveu, preuve ou serment contresigné, un contremaître est affecté à la charge de l'ouvrier jusqu'à l'achèvement des travaux. En cas de simple suspicion, un contremaître est également affecté aux frais du propriétaire, selon les écoles chaféite et hanbalite. Les hanafites considèrent que le fait qu'il soit un voleur, craint pour les frondes et les fruits, constitue une excuse pour annuler la musaqah, car elle cause un préjudice involontaire au propriétaire. Les malikites, quant à eux, la considèrent comme un contrat contraignant, non annulé par le vol, et le contremaître n'est ni remplacé ni placé sous surveillance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8032}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8033} Celui qui s'empare d'un bien trouvé avec l'intention de le trahir et de le voler est passible de poursuites en tant qu'usurpateur et n'est dégagé de toute responsabilité qu'après avoir restitué le bien à son propriétaire. La question de savoir s'il est innocenté en remettant l'objet au souverain ou en le restituant à sa place est controversée, comme détaillé dans la section luqata. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8033} Le surveillant du marché veille à l'honnêteté des artisans: il confirme la fiabilité des personnes dignes de confiance, exclut et dénonce publiquement le traître, et peut nommer un chef de guilde parmi les membres intègres et experts de chaque corps de métier, connaissant leurs fraudes, afin de superviser leurs affaires et leurs prix, conformément au principe « chercher l'aide pour chaque corps de métier auprès de ses membres intègres ». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8033} La main du traître n'est pas coupée, selon le hadith de Jabir: « Nulle coupe pour un traître, un voleur ou un détourneur de fonds », rapporté par Ibn al-Humam, faisant consensus, car le devoir consiste à couper la main du voleur et le traître n'est pas un voleur du fait de l'absence de garde, le bien étant entre ses mains autorisées. Les avis divergent quant au cas du refus d'un bien emprunté: la majorité n'impose pas de coupe car il est un traître, à l'instar de celui qui refuse un dépôt, tandis qu'Ahmad, dans une transmission, et Ishaq ibn Rahawayh l'imposent en se basant sur le récit d'Aïcha selon lequel une femme avait l'habitude d'emprunter des biens et de les refuser, ce qui a conduit à ce qu'il lui ordonne de se couper la main. La majorité interprète cette coupe comme une punition pour un vol commis après qu'elle soit devenue connue pour refuser les prêts, ce qui la caractérisait. Ibn Qudama ne connaît aucune obligation de coupe pour un refus de dépôt ou dans des cas similaires. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8034}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8035} Concernant la trahison des partenaires d'un traité: les écoles chaféite et hanbalite estiment que si l'imam perçoit une trahison par des signes clairs, et non par simple intuition, leur pacte n'est pas nul, mais il peut le dénoncer en vertu de la sourate al-Anfal, verset 58, et doit le faire avant d'attaquer. Si la trêve prend fin alors que certains partenaires se trouvent en terre musulmane, ils doivent être ramenés en lieu sûr. Les écoles malikites estiment qu'une fois qu'il soupçonne une trahison avant l'expiration du pacte par des signes apparents, il doit le dénoncer, en les avertissant obligatoirement, à moins que leur trahison ne soit confirmée. Les Hanafites autorisent l'imam à rompre la trêve dès qu'il y voit un avantage, même sans soupçon de trahison, car renoncer à la trêve constitue un jihad lorsque l'avantage change. Ibn al-Humam rapporte un consensus selon lequel la renonciation n'est pas conditionnée par la crainte d'une trahison. Si la rupture est unanime et qu'une trahison est à l'origine de la rupture, l'imam combat sans renoncer à la trêve. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8035}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8036} Les Shafi'ites et les Hanbalites affirment que le pacte avec les dhimmas n'est pas rompu par crainte de trahison, car le contrat de dhimma leur est dû et ils sont sous l'autorité de l'imam; leur trahison peut donc être contrée, contrairement aux partenaires du traité qui échappent à son contrôle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8036} Un musulman entrant en territoire ennemi sous couvert d'un aman ne doit pas trahir ses propriétaires, car l'aman est accordé à condition qu'il ne trahisse pas. Cette condition, bien qu'implicite, est connue, et la trahison est une perfidie inadmissible, conformément à l'affirmation selon laquelle « les musulmans sont liés par leurs engagements ». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8036} Le traître qui espionne pour les mécréants, les informant par lettre des faiblesses des musulmans, est interdit de participer aux opérations militaires. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8036} La trahison est un thème récurrent dans de nombreux chapitres: vente, partenariat, mudaraba, dépôt, prêt, objet trouvé, mandat, testaments, garde, témoignage et conduite de la guerre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8036}"
  tr: "İhanet ve ihanet, dilsel olarak bir kişinin güven verdiği ve tavsiye vermediği anlamına gelir; bunun zıttı ise güvenilirliktir. Hukukçuların bu terimi kullanışı, dilsel anlamından sapmaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8031} İlgili terimler: dolandırıcılık, bu tavsiyenin tam tersidir ve teknik olarak satılan ürünün kendisine atıfta bulunur, örneğin saç buklemesi veya giysi giymek. İhanet, satılan eşyaya veya onun niteliğine dair aldatmacadır; örneğin, sahte fiyattan bahsetmek gibi sahte veya alakasız şeyler olarak tanımlanmak; ikiyüzlülük ise İslam'a bir şekilde girip başka bir şekilde terk etmek, örneğin antlaşmalar ve güvenler konusunda ihanet, din konusunda ikiyüzlülük. Hain, hırsız ve gaspçıyı ayırt ederler: hain, güvenilir olanı satan kişidir, hırsız ise gizlice ulaşılması yasak bir yerden alan kişidir ve her hırsızın aksi olmayan hain olduğu söylenir, gaspçı ise açıkça gücüne güvenen kişidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8031} Güvenin ihlali Enfal Suresi'nin 27. ayetinde ve hadiste yasaktır: \"Münafıkın ayeti üç: konuşurken yalan söyler; söz verdiğinde onu bozar; güven verildiğinde ise ihanete uğrar.\" El-Dhahabi ve İbn Hajar al-Haytami bunu büyük bir günah olarak gördüler ve her açıdan çirkin, ancak bazıları daha ağırdır. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.8032} Güven ve itimat satışları güven ve itimat üzerine kuruludur, bu yüzden satıcı ne aldığını ve ne yaptığını dürüstçe bildirmelidir. El-Enfal Suresi'nin 27. ayetinde ve \"Bizi kandıran bizden değildir\" hadisinde ihanet ve suçlamadan mümkün olduğunca korumak zorundadır. Belirtilmesi gerekenlerin netleştirilmesiyle dikkatli olunmalıdır ve bu hüküm, güven satışında ayrıntılı bir uyumsuzluk varsa geçerlidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8032} Musaqah işçisi güvenilirdir ve iddia edilen yıkım ve ihanetle ilgili ifadesi, itiraf, delil veya yemin ile kanıtlanırsa, iş tamamlanana ve amirin maaşı ödenene kadar bir gözetmen atanmasıdır. Şüphelenirse, sadece bir gözetmen atanır ve kirası Şafi'ler ve Hanbalilere göre sahibine ödenir. Hanafiler, hırsız olması, toprak sahibinin ona zarar vermekle yükümlü olduğu için musaqahı sonlandırmak için bir bahane olarak kabul eder. Malikiler bunun gerekli bir sözleşme olduğunu, bu yüzden hırsız olarak iptal edilemediğini, başka kimsenin onun yerine geçemeyeceğini, bunun yerine korunabileceğini söyler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8032} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8033} Parçayı ihanet ve el koyma amacıyla alan, kefil veya gaspçı olur ve sorumluluğundan muaf tutulmaz, ta ki sahibine geri verene kadar. Parçayı hükümdara geri verirken veya yerine geri verirken masumiyeti konusunda belirgin bir anlaşmazlık vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8033} Muhtasib, zanaatkarların güvenilirlik koşullarını dikkate alır, güveniliri kabul eder, ihaneti açıkça görülenleri uzak tutar ve işlerini ifşa eder. Her zanaatın ustasını, halkının yararına olan, sahtekarlık ve aldatmaları konusunda uzman bir usta, koşullarını ve fiyatlarını denetleyebilecek bir hadise göre \"Her zanaatta sahiplerinin yararına yardım iste\" adlı hadise göre atayabilir. {kaynak:fiqh-mawsua-kuwaitiyya-noor-v3 s.. 8033} Cabir'in hadisine göre, hainin veya hainin eli kesilmez: 'Hiç kimse hain, yağmacı veya zimmetçi için para parçasına tabi değildir.' İbn al-Humam bu konuda uzlaştı çünkü hırsızı kesmek yükümlülüğü vardır ve hain, para onun elindeydi ve koruması girmesine izin verildiği için teminat eksikliği nedeniyle hırsız sayılmaz. Borçlunun reddi konusunda farklı görüşler yaşadılar, ancak çoğunluk kesim olmadığını savundu Çünkü o bir haindir, depozitoyu reddeden birine benzer. Ahmed, İshaq bin Rahveyh'in rivayetinde, borç alıp reddeden Aisha'nın hadisini kesmesi gerektiğini söyler, bu yüzden elini kesmesini emretti. Çoğunluk, Aisha'nın çıplaklığı reddetmesiyle ünlü olduktan sonra yaptığı hırsızlık nedeniyle olduğunu söyledi; bu hain olarak bilinen bilinir. İbn Qudama, depozitoyu veya benzeri vakıfları reddedenin kesilmesini zorunlu kılan kimseyi tanımadığını söyledi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8034} {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.8035} Barışçıların ihaneti hakkında Şafiiler ve Hanbaliler, imamın ihaneti sadece yanlışlıkla değil, işaretlerle hissederse, ahdı bozmadığını, aksine Enfal Suresi 58. ayetinde izin verilmiş olarak reddettiğini ve baskın öncesi zorunlu olduğunu savunmuşlardır. Ateşkes bozulduğunda ve evimizde biri geri döndüğünde, güvenli yerlerine geri gönderilmelidir. Malikiler, ihanetlerini işaretlerin ortaya çıkmasından önce şüphelenmek durumunda antlaşmanın zorunlu olduğunu ve sadece bir görev uyarıldığını, ihanet gerçekleşirse ise uyarı vermeden reddedildiğini söyler. Hanefiler, barışı faydalı gördüklerinde iptal etmeye izin verirler, hatta hadilerinin işaretleri ortaya çıkmadan İhanet hissetmedi çünkü ilgi değişirse reddedilme cihat sayılır. İbn el-Humam, reddin korkunun tehlikeleriyle bağlı olmadığı, ihanet başlasa bile imamın onları öldürdüğü ve reddedilme karşılıklı anlaşmayla gerçekleştiyse reddedilmediği konusunda uzlaşı iletti. {Cite:Fiqh-Mawsua-Kuwaitiyya-Noor-v3 s. 8035} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8036} Şafiiler ve Hanbaliler açıkça belirtmişlerdir: Zimmi halkı ihanetten korkuyorsa, ahit terk edilmez, çünkü zimme sözleşmesi onlar için zorunludur ve imamın kontrolü altındadırlar, böylece ihanetleri giderilir, onun kontrolü dışındakilerin aksine. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8036} Müslümanlar arasından kim düşman topraklarına sağ salim girerse, onları servetinde ihanet etmez, çünkü ona güvence verdiler, ancak ihanetten anlam olarak vazgeçmesi şartı vardı, açıkça belirtilmese bile. Hadislere göre ihanet ihanettir ve ihanet geçersizdir, hadise göre \"Müslümanlar kendi şartlarındadır.\" {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8036} ve kafirleri gözetleyen ve onları Müslümanların özel bölgelerine yazışmalar yoluyla maruz bırakan hain orduya katılmak yasaktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8036} İhanet, satış, ortaklık, spekülasyon, depozito, kredi, pazarlık, vekaletname, vasiyetname, velayet, tanıklık ve seyahat gibi birçok kategoride gerçekleşir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8036}"
  id: "Pengkhianatan dan pengkhianatan secara linguistik berarti seseorang dipercayakan dengan kepercayaan dan tidak memberikan nasihat, sedangkan sebaliknya adalah kepercayaan. Penggunaan istilah ini oleh para ahli hukum tidak menyimpang dari makna linguistiknya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8031} Istilah terkait: penipuan, yang merupakan kebalikan dari nasihat dan secara teknis tadlis, merujuk pada barang yang terjual, seperti menggulung rambut atau memakai pakaian. Pengkhianatan lebih luas karena merupakan penipuan terkait barang yang dijual atau atributnya, seperti menggambarkannya sebagai hal palsu atau tidak terkait, seperti menyebutkan harga palsu; kemunafikan adalah masuk ke Islam dengan satu cara dan meninggalkannya dengan cara lain, seperti pengkhianatan terhadap perjanjian dan kepercayaan, dan kemunafikan terhadap agama. Mereka membedakan antara pengkhianat, pencuri, dan perebut usurpa: pengkhianat adalah orang yang mengkhianati apa yang dipercaya, pencuri adalah orang yang diam-diam mengambil dari tempat yang dilarang dicapai, dan dikatakan bahwa setiap pencuri adalah pengkhianat tanpa kebalikan, dan perebut kekuasaan adalah yang secara terbuka mengandalkan kekuatannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8031} Pelanggaran kepercayaan dilarang dalam Surah Al-Anfal, ayat 27, dan dalam hadits: \"Ayat orang munafik adalah tiga: ketika dia berbicara, dia berbohong; ketika dia berjanji, dia mengingkari; dan ketika dipercayakan dengan kepercayaan, dia mengkhianati.\" Al-Dhahabi dan Ibn Hajar al-Haytami menganggapnya sebagai dosa besar, dan itu buruk dalam segala hal, tetapi beberapa lebih berat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8032} Penjualan trust didasarkan pada kepercayaan dan keyakinan, sehingga penjual harus jujur dalam melaporkan apa yang dibelinya dan apa yang telah dilakukannya dengannya. Wajib melindungi mereka dari pengkhianatan dan tuduhan sebanyak mungkin dalam Surah Al-Anfal, ayat 27, dan hadits \"Siapa pun menipu kita bukanlah bagian dari kita.\" Kehati-hatian dilakukan dengan memperjelas apa yang harus dinyatakan, dan keputusannya berlaku jika terdapat perbedaan rinci dalam penjualan trust. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8032} Pekerja musaqah dapat dipercaya, dan pernyataannya mengenai dugaan penghancuran dan pengkhianatan adalah bahwa jika dibuktikan dengan pengakuan, bukti, atau sumpah, seorang pengawas akan ditunjuk kepadanya sampai pekerjaan selesai dan upah pengawas dibayarkan. Jika dia curiga, hanya pengawas yang ditugaskan kepadanya dan sewa dibayarkan kepada pemilik sesuai dengan Shafi'i dan Hanbali. Para Hanafi menganggap fakta bahwa dia adalah pencuri yang ditakuti karena mencuri daun dan buah sebagai alasan untuk mengakhiri musaqah karena pemilik tanah berkewajiban menyakitinya yang tidak dia patuhkan. Para Malikus mengatakan itu adalah kontrak yang diperlukan, jadi dia tidak dapat dibatalkan sebagai pencuri, dan tidak ada orang lain yang bisa menggantikannya, melainkan dilindungi dari kontrak itu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8032} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8033} Siapa pun yang mengambil karya itu dengan niat mengkhianati dan menyita adalah penjamin atau perebut kekuasaan yang tidak akan membebaskan dirinya dari tanggung jawab sampai ia mengembalikannya kepada pemiliknya. Ada perbedaan pendapat yang mencolok tentang ketidakbersalahannya dengan mengembalikannya kepada penguasa atau mengembalikannya ke tempatnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8033} Muhtasib memperhatikan kondisi orang-orang kerajinan dalam hal kepercayaan, mengakui yang dapat dipercaya, menjauhkan mereka yang jelas pengkhianatannya, dan mengungkap urusan mereka. Ia dapat menunjuk seorang ahli dalam setiap kerajinan demi kepentingan rakyatnya, ahli penipuan dan penipuan mereka, mengawasi kondisi dan harga mereka, menurut hadits \"Carilah bantuan dalam setiap kerajinan melalui kepentingan pemiliknya.\" {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm. 8033} Tangan pengkhianat atau pengkhianat tidak dipotong, menurut hadits Jabir: 'Tidak seorang pun boleh menerima uang untuk pengkhianat, perampok, atau penggelap.' Ibn al-Humam melaporkan kesepakatan tentang hal ini, karena kewajiban adalah memotong pencuri, dan pengkhianat bukan pencuri karena kurangnya jaminan, karena uang itu ada di tangannya dan perlindungannya diizinkan masuk. Mereka berbeda pendapat mengenai penyangkal peminjam, tetapi mayoritas berpendapat bahwa tidak ada pemotongan karena Ia adalah pengkhianat, mirip dengan seseorang yang menolak deposit. Ahmad dalam riwayat Ishaq ibn Rahwayh mengatakan bahwa ia harus memotong hadits Aisha, yang meminjam barang dan menyangkalnya, sehingga ia memerintahkan agar tangan Aisha dipotong. Mayoritas mengatakan bahwa pemotongan itu disebabkan oleh pencurian yang dilakukan setelah ia terkenal karena menyangkal ketelanjangan, yang dikenal sebagai pengkhianat terkenal. Ibn Qudamah mengatakan ia tidak mengenal siapa pun yang mewajibkan memotong orang yang menolak deposit atau trust serupa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8034} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8035} Mengenai pengkhianatan para pembawa damai, para Syafi'i dan Hanbalis berpendapat bahwa jika imam merasakan pengkhianatan mereka melalui tanda-tanda, bukan hanya karena kesalahan, ia tidak melanggar perjanjian mereka tetapi menolak mereka sebagaimana diizinkan oleh Surah Al-Anfal, ayat 58, dan itu wajib sebelum menyerang mereka. Setiap kali gencatan senjata dilanggar dan di rumah kita salah satu dari mereka dikembalikan, mereka harus dikembalikan ke tempat aman mereka. Para Malik berkata bahwa jika seseorang mencurigai pengkhianatan mereka sebelum waktunya dengan munculnya tanda-tandanya, perjanjian itu wajib dan hanya kewajiban yang diperingatkan, dan jika pengkhianatan itu terwujud, maka ditolak tanpa peringatan. Hanafi mengizinkan pembatalan perdamaian kapan pun mereka menganggapnya menguntungkan, meskipun Ia tidak merasa dikhianati karena jika kepentingan berubah, penolakan dianggap jihad. Ibn al-Humam menyampaikan konsensus bahwa penolakan tidak terikat oleh bahaya ketakutan, bahkan jika mereka mulai mengkhianatan, Imam membunuh mereka dan tidak ditolak jika penolakan itu atas kesepakatan bersama. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8035} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8036} Para Shafi'i dan Hanbalis secara tegas menyatakan bahwa jika umat dhimmi takut akan pengkhianatan mereka, maka perjanjian itu tidak ditinggalkan, karena kontrak dhimma wajib bagi mereka dan karena mereka berada di bawah kendali Imam, maka pengkhianatan mereka diperbaiki, berbeda dengan mereka yang berada di luar kendalinya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8036} Dan siapa pun di antara umat Muslim yang masuk ke tanah musuh dengan selamat tidak mengkhianati mereka dalam harta mereka, karena mereka memberinya keselamatan dengan syarat dia meninggalkan pengkhianatan mereka secara makna, meskipun tidak dinyatakan secara eksplisit. Pengkhianatan adalah pengkhianatan dan pengkhianatan tidak sah, menurut hadits \"Muslim berada atas syaratnya sendiri.\" {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8036} dan dilarang keluar dalam pasukan pengkhianat yang memata-matai kafir dan mengungkapkan mereka ke bagian pribadi Muslim melalui korespondensi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8036} Pengkhianatan terjadi dalam banyak kategori seperti penjualan, kemitraan, spekulasi, deposit, pinjaman, tawar-menawar, agen pengacara, wasiat, hak asuh, kesaksian, dan perjalanan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8036}"
