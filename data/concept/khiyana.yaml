id: concept/khiyana
class: concept
kind: legal
label:
  ar: خيانة
  en: Khiyana (breach of trust)
  ur: خیانت
summary:
  ar: 'الخيانة والخون لغة أن يؤتمن الإنسان فلا ينصح، ونقيضها الأمانة، ولا يخرج استعمال الفقهاء لهذا اللفظ عن المعنى اللغوي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8031} من الألفاظ ذات الصلة: الغش وهو نقيض النصح واصطلاحا تدليس يرجع لذات المبيع كتجعيد الشعر ودق الثوب، والخيانة أعم إذ تكون تدليسا في ذات المبيع أو صفته كوصفه بصفات كاذبة أو أمر خارج كذكر ثمن كاذب؛ والنفاق وهو الدخول في الإسلام من وجه والخروج عنه من وجه آخر، فالخيانة في شأن العهد والأمانة والنفاق في شأن الدين؛ وفرقوا بين الخائن والسارق والغاصب فالخائن من خان ما جعل عليه أمينا، والسارق من أخذ خفية من موضع كان ممنوعا من الوصول إليه وربما قيل كل سارق خائن دون عكس، والغاصب من أخذ جهارا معتمدا على قوته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8031} خيانة الأمانة حرام بسورة الأنفال الآية 27 وبحديث «آية المنافق ثلاث: إذا حدث كذب وإذا وعد أخلف وإذا اؤتمن خان»، وعدها الذهبي وابن حجر الهيتمي من الكبائر وهي قبيحة في كل شيء لكن بعضها أشد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8032} بيوع الأمانة مبنية على الثقة والاطمئنان فيجب على البائع الصدق في الإخبار عما اشترى به وما قام به عليه، وتجب صيانتها عن الخيانة والتهمة قدر الإمكان بسورة الأنفال الآية 27 وحديث «من غشنا فليس منا»، ويحصل الاحتراز ببيان ما يجب بيانه، وفي حكمها إذا ظهرت خلاف تفصيله في بيع الأمانة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8032} عامل المساقاة أمين والقول قوله فيما يدعيه من هلاك وما يدعى عليه من خيانة، فإن ثبتت بإقرار أو بينة أو يمين مردودة ضم إليه من يشرف عليه إلى أن يتم العمل وأجرة المشرف على العامل، وإن ارتيب فيه فقط ضم إليه مشرف وأجرته على المالك عند الشافعية والحنابلة؛ واعتبر الحنفية كونه سارقا يخاف عليه من سرقة السعف والثمر عذرا في فسخ المساقاة لإلزامه صاحب الأرض ضررا لم يلتزمه؛ وقال المالكية إنها من العقود اللازمة فلا ينفسخ بكونه لصا ولا يقام غيره مقامه بل يحفظ منه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8032}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8033} من أخذ اللقطة بنية الخيانة والاستيلاء كان ضامنا غاصبا لا يبرأ من ضمانها حتى يؤديها إلى صاحبها، وفي برائته بدفعها إلى الحاكم أو إعادتها لموضعها خلاف يذكر في لقطة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8033} يراعي المحتسب أحوال أهل الصنائع من حيث الأمانة فيقر أهل الثقة ويبعد من ظهرت خيانته ويشهر أمره، ويجوز له جعل عريف لكل صنعة من صالح أهلها خبيرا بغشوشهم وتدليساتهم مشرفا على أحوالهم وأسعارهم لحديث «استعينوا على كل صنعة بصالح أهلها». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8033} لا تقطع يد خائن ولا خائنة لحديث جابر «ليس على خائن ولا منتهب ولا مختلس قطع» وحكى ابن الهمام الإجماع على ذلك، لأن الواجب قطع السارق والخائن غير سارق لقصور الحرز إذ المال كان في يده وحرزه مأذون لدخوله؛ واختلفوا في جاحد العارية فالجمهور على أنه لا قطع لأنه خائن أشبه جاحد الوديعة، وقال أحمد في رواية وإسحاق بن راهويه إن عليه القطع لحديث عائشة أن امرأة كانت تستعير المتاع وتجحده فأمر بقطع يدها، وقال الجمهور إن القطع كان عن سرقة صدرت منها بعد شهرتها بجحد العارية فعرفت بوصفها المشهور، وقال ابن قدامة إنه لا يعلم أحدا يوجب القطع على جاحد الوديعة ونحوها من الأمانات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8034}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8035} في خيانة المهادنين ذهب الشافعية والحنابلة إلى أن الإمام إذا استشعر خيانتهم بأمارات لا بمجرد توهم لم ينتقض عهدهم بل نبذ إليهم جوازا بسورة الأنفال الآية 58 ووجوبا قبل الإغارة عليهم، ومتى نقض الهدنة وفي دارنا منهم أحد وجب ردهم إلى مأمنهم؛ وقال المالكية إنه إذا ظن خيانتهم قبل المدة بظهور أمارتها نبذ العهد وجوبا وإنما ينذرهم واجبا فإن تحقق خيانتهم نبذ بلا إنذار؛ وأجاز الحنفية نقض الصلح متى رآه أنفع ولو لم يستشعر خيانة لأن المصلحة إذا تبدلت كان النبذ جهادا، ونقل ابن الهمام الإجماع على عدم تقيد النبذ بخطور الخوف، وإن بدءوا بخيانة قاتلهم الإمام ولم ينبذ إذا كان النقض باتفاقهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8035}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8036} صرح الشافعية والحنابلة بأن أهل الذمة إذا خيفت خيانتهم لم ينبذ إليهم العهد لأن عقد الذمة وجب لهم ولأنهم في قبضة الإمام فتستدرك خيانتهم بخلاف المهادنين الخارجين عن قبضته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8036} ومن دخل من المسلمين أرض العدو بأمان لم يخنهم في مالهم لأنهم أعطوه الأمان مشروطا بتركه خيانتهم معلوما في المعنى وإن لم يذكر في اللفظ، والخيانة غدر ولا يصلح الغدر، لحديث «المسلمون على شروطهم». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8036} ويمنع من الخروج في الجيش الخائن الذي يتجسس للكفار ويطلعهم على عورات المسلمين بالمكاتبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8036} وترد الخيانة في أبواب كثيرة كالبيع والشركة والمضاربة والوديعة والعارية واللقطة والوكالة والوصايا والحضانة والشهادة والسير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8036}'
  en: 'Khiyana (breach of trust) linguistically is that a person is entrusted and does not give faithful counsel; its opposite is amana, and the jurists'' usage does not depart from the linguistic sense. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8031} Related terms: ghishsh, the opposite of sincere counsel, technically a deception in the very sold item like curling hair or pounding cloth, khiyana being broader as deception in the item''s essence, its description with false qualities, or an outside matter like quoting a false price; nifaq, entering Islam one way and leaving it another, khiyana applying to pacts and trusts and nifaq to religion; and the betrayer, thief and usurper are distinguished: the betrayer betrays what was entrusted to him, the thief takes secretly from a place he was barred from reaching — every thief is a betrayer but not vice versa on a stated view — and the usurper takes openly relying on force. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8031} Betraying a trust is forbidden by Surah al-Anfal ayah 27 and the hadith "the signs of the hypocrite are three: when he speaks he lies, when he promises he breaks, when he is entrusted he betrays"; al-Dhahabi and Ibn Hajar al-Haytami count it among the grave sins, ugly in everything but worse in some. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8032} Trust-based sales rest on confidence between the parties, so the seller must be truthful in reporting what he paid and what it cost him, and such sales must be guarded from betrayal and suspicion as far as possible by Surah al-Anfal ayah 27 and "whoever deceives us is not of us"; guarding is achieved by disclosing what must be disclosed, and the ruling when betrayal appears is disputed, detailed under bay'' al-amana. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8032} The musaqah worker is trusted and his word accepted on claimed loss and on betrayal claims against him; if betrayal is proved by confession, evidence or returned oath, an overseer is attached to him until the work is done with the overseer''s wage on the worker, and if he is only suspected an overseer is attached at the owner''s cost, at the Shafiis and Hanbalis; the Hanafis count his being a thief feared for the fronds and fruit an excuse annulling the musaqah for imposing an unassumed harm on the landowner; the Malikis hold it a binding contract not annulled by his thieving, nor is he replaced but guarded. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8032}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8033} One who takes a found thing intending betrayal and seizure is liable as a usurper, not cleared until he delivers it to its owner; whether he is cleared by handing it to the ruler or returning it to its place is disputed, detailed under luqata. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8033} The market overseer watches craftsmen for honesty: he confirms the trustworthy, removes and publicizes the betrayer, and may appoint a guild head from each craft''s righteous, expert members, knowing their frauds, to supervise their affairs and prices, per "seek help for every craft from its righteous people". {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8033} The betrayer''s hand is not cut, per Jabir''s hadith "no cutting for a betrayer, a snatcher or an embezzler", Ibn al-Humam reporting consensus, since the duty is cutting the thief and the betrayer is no thief for the deficiency of custody, the property being in his authorized hands; they dispute the denier of a borrowed item: the majority impose no cutting as he is a betrayer like the deposit-denier, while Ahmad in a transmission and Ishaq ibn Rahawayh impose it for Aisha''s report that a woman used to borrow goods and deny them so he ordered her hand cut, the majority reading the cutting as for a theft she committed after becoming known for denying loans so she was described by her famous trait; Ibn Qudama knows none obliging cutting for a deposit-denier or like trusts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8034}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8035} On treaty partners'' betrayal: the Shafiis and Hanbalis hold that if the imam senses betrayal by clear signs, not mere fancy, their pact is not void but he may renounce it to them under Surah al-Anfal ayah 58 and must before attacking, and if the truce ends while some are in Muslim land they must be returned to safety; the Malikis hold that once he suspects betrayal before the term by appearing signs he must renounce the pact, warning them obligatorily unless their betrayal is confirmed; the Hanafis let the imam annul the truce whenever he sees benefit, even without sensing betrayal, since when benefit changes renouncing is jihad, Ibn al-Humam reporting consensus that renouncing is not conditioned on fear arising, and if they begin with betrayal the imam fights without renouncing when the breach is unanimous. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8035}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8036} The Shafiis and Hanbalis state that the pact with the people of the dhimma is not renounced on feared betrayal, since the dhimma contract is due to them and they are in the imam''s power so their betrayal can be countered, unlike treaty partners beyond his reach. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8036} A Muslim entering enemy land under aman must not betray them in property, since the aman was given conditioned on his not betraying, known in meaning though unexpressed, and betrayal is perfidy which has no place, per "Muslims are bound by their conditions". {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8036} The betrayer who spies for the unbelievers, informing them of the Muslims'' weak points by letter, is barred from going out with the army. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8036} Betrayal recurs across many chapters: sale, partnership, mudaraba, deposit, loan, the found thing, agency, wills, custody, testimony and the conduct of war. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8036}'
  ur: 'خیانت لغت میں یہ ہے کہ انسان کو امانت دی جائے اور وہ خیر خواہی نہ کرے، اس کا ضد امانت ہے، اور فقہاء کا استعمال اسی لغوی معنی سے باہر نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8031} متعلقہ الفاظ: غش جو نصیحت کا ضد ہے اور اصطلاحاً ایسا تدلیس جو مبیع کی ذات سے متعلق ہو جیسے بال گھونگرنا اور کپڑا کٹنا، خیانت اس سے عام ہے کہ تدلیس مبیع کی ذات میں ہو یا صفت میں جیسے جھوٹی صفات بیان کرنا یا بیرونی امر میں جیسے جھوٹا ثمن کہنا؛ نفاق یعنی ایک رخ سے اسلام میں داخل اور دوسرے سے خارج ہونا، خیانت عہد اور امانت کے معاملے میں اور نفاق دین کے معاملے میں کہا جاتا ہے؛ اور خائن، سارق اور غاصب میں فرق: خائن وہ جو اس امانت میں خیانت کرے جو اسے سونپی گئی، سارق وہ جو چھپ کر اس جگہ سے لے جہاں اس کی رسائی ممنوع تھی اور کہا گیا ہر سارق خائن مگر عکس نہیں، اور غاصب وہ جو اپنی قوت پر انحصار کرتے ہوئے علانیہ لے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8031} امانت میں خیانت حرام ہے سورۃ الانفال آیت 27 اور حدیث «منافق کی تین نشانیاں: جب بولے جھوٹ، جب وعدہ کرے خلاف ورزی، جب امانت دی جائے خیانت» سے؛ ذہبی اور ابن حجر ہیتمی نے اسے کبائر میں شمار کیا اور وہ ہر چیز میں بری مگر بعض میں زیادہ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8032} بیع الامانہ دونوں فریقوں کے باہمی اعتماد پر قائم ہے تو بائع پر لازم ہے کہ خریداری اور اس پر آئے اخراجات کی خبر میں سچ کہے، اور ان بیعوں کو خیانت اور تہمت سے جتنا ممکن ہو بچانا لازم ہے سورۃ الانفال آیت 27 اور حدیث «جو ہمیں دھوکہ دے وہ ہم میں سے نہیں» کے مطابق؛ احتراز اسے بیان کرنے سے ہوتا ہے جس کا بیان واجب ہے، اور ظاہر ہونے پر اس کا حکم مختلف فیہ ہے جس کی تفصیل بیع الامانہ میں ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8032} مساقات کا عامل امین ہے اور ہلاکت کے دعوے اور خیانت کے دعوے میں اسی کی بات مانی جاتی ہے؛ اگر خیانت اقرار، بینہ یا لوٹائی ہوئی قسم سے ثابت ہو تو اس کے ساتھ نگران ملایا جاتا ہے جب تک کام مکمل ہو اور نگران کی اجرت عامل پر؛ اور اگر صرف شبہ ہو تو نگران کی اجرت مالک پر، شافعیہ اور حنابلہ کے نزدیک؛ حنفیہ نے اس کا چور ہونا جس سے ادرک سے پہلے کھجور اور پھل کی چوری کا خوف ہو مساقات کی فسخ کا عذر مانا کیونکہ یہ مالکِ زمین پر ایسا نقصان لادتا ہے جس نے اس نے ذمہ نہیں لیا؛ مالکیہ کے نزدیک یہ لازم عقد ہے تو عامل کا چور ہونا اسے منفسخ نہیں کرتا نہ اس کی جگہ دوسرا مقرر ہوتا بلکہ اس سے حفاظت کی جاتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8032}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8033} جو لقطہ خیانت اور قبضے کی نیت سے اٹھائے وہ غاصب کی طرح ضامن ہے اور اس کے مالک تک پہنچائے بغیر ضمان سے نہیں نکلتا؛ حاکم کو سونپنے یا اس کی جگہ لوٹانے سے براءت میں اختلاف لقطہ میں بیان ہوگا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8033} محتسب اہلِ صنایع کی امانت کے لحاظ سے حالات دیکھتا ہے: اہلِ ثقہ کو برقرار اور جس کی خیانت ظاہر ہو اسے دور اور مشہور کرتا ہے، اور ہر صنعت کے لیے اس کے صالح اہل میں سے عارف مقرر کر سکتا ہے جو ان کے غش اور تدلیس سے واقف اور ان کے حالات اور قیمتوں پر نگران ہو، حدیث «ہر صنعت میں اس کے صالح اہل سے مدد لو» کے مطابق۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8033} خائن مرد یا عورت کا ہاتھ نہیں کاٹا جاتا جابر کی حدیث «نہ خائن پر نہ منتےب پر نہ مختلس پر قطع ہے» کے مطابق اور ابن ہمام نے اس پر اجماع نقل کیا، کیونکہ واجب سارق کا قطع ہے اور خائن حرز کے قصور سے سارق نہیں کہ مال اسی کے ہاتھ میں تھا اور اس کا حرز دخول کے لیے مأذون تھا؛ عاریہ کے جاحد میں اختلاف ہے: جمہور کے نزدیک قطع نہیں کیونکہ وہ ودیعت کے جاحد جیسا خائن ہے، اور احمد کی ایک روایت اور اسحاق بن راہویہ کے نزدیک قطع ہے عائشہ کی حدیث پر کہ ایک عورت سامان عاریہ لیتی اور جھٹلاتی تو اس نے اس کا ہاتھ کاٹنے کا حکم دیا؛ جمہور نے کہا قطع اس کی معروف جحد کے بعد اس سے صادر شدہ سرقے پر ہوا تو وہ اپنے معروف وصف سے پہچانی گئی؛ ابن قدامہ کے مطابق ودیعت کے جاحد اور دیگر امانتوں پر قطع کا قائل کوئی معلوم نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8034}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8035} مہادنوں کی خیانت میں شافعیہ اور حنابلہ کے نزدیک اگر امام محض وہم نہیں بلکہ امارات سے خیانت محسوس کرے تو ان کا عہد منتقض نہیں بلکہ ان کی طرف نبذ جائز ہے سورۃ الانفال آیت 58 کے مطابق اور حملے سے پہلے واجب، اور جب ہدنہ ٹوٹے اور ہمارے دار میں ان میں سے کوئی ہو تو اسے اس کے امن تک لوٹانا واجب؛ مالکیہ کے نزدیک اگر مدت سے پہلے خیانت کا ظن امارات کے ظہور سے ہو تو عہد نبذ کرنا واجب اور انہیں متنبہ کرنا واجب ہے مگر اگر خیانت متحقق ہو تو بغیر تنبیہ نبذ کرے؛ حنفیہ نے امام کے لیے صلح توڑنا اس وقت جائز کیا جب وہ اسے مفید سمجھے خواہ خیانت محسوس نہ ہو کیونکہ جب مصلحت بدلے تو نبذ جہاد ہے، ابن ہمام نے اجماع نقل کیا کہ نبذ خوف کے جنبنے سے مشروط نہیں، اور اگر وہ خیانت شروع کریں اور نقض ان کے اتفاق سے ہو تو امام بغیر نبذ قتال کرے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8035}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8036} شافعیہ اور حنابلہ نے صراحت کی کہ اہلِ ذمہ سے خیانت کا خوف ہو تو ان کی طرف عہد نبذ نہیں کی جاتی کیونکہ عقدِ ذمہ ان پر واجب ہے اور وہ امام کی قبضے میں ہیں تو ان کی خیانت کا تدارک ممکن ہے بخلاف مہادنوں کے جو اس کی قبضے سے باہر ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8036} جو مسلمان امن لے کر دشمن کی سرزمین میں داخل ہو وہ ان کے مال میں خیانت نہیں کرے گا کیونکہ انہوں نے اسے امن اس شرط کے ساتھ دیا کہ وہ خیانت نہ کرے، یہ معنی میں معلوم ہے خواہ لفظ میں نہ کہا گیا، اور خیانت غدر ہے جو جائز نہیں، حدیث «مسلمان اپنی شروط پر ہیں» کے مطابق۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8036} اور وہ خائن جو کفار کے لیے جاسوسی کرے اور مراسلے سے مسلمانوں کی کمزوریاں بتائے اسے لشکر میں نکلنے سے منع کیا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8036} خیانت کئی ابواب میں آتی ہے: بیع، شرکت، مضاربت، ودیعت، عاریت، لقطہ، وکالت، وصایا، حضانت، شہادت اور سیر۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8036}'
