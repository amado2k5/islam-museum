label:
  ar: "سوس"
  en: "Sus (the root called sus)"
  ur: "سوس"
  es: "Sus (la raíz llamada sus)"
summary:
  ar: "السوس في الكتاب أصله معتدل فإن ضرب إلى شيء ضرب إلى حرارة ورطوبة، عصارته على الداحس وللجراحات، يلين قصبة الرئة وينقيها وينفع الرئة والحلق ويصفي الصوت، ويسكن العطش لرطوبته، وينفع حرقة البول وقروح الكلى والمثانة والحميات العتيقة {cite:canon-ibn-sina-print-v1 p.593}."
  en: "Sus is in the book a root of moderate temperament, leaning if anything to heat and moisture; its juice is put on the whitlow and on wounds, it softens and cleans the windpipe, helps lung and throat and clears the voice, calms thirst by its moisture, and the book lists it for burning of urine, ulcers of the kidneys and bladder and old fevers {cite:canon-ibn-sina-print-v1 p.593}."
  ur: "سوس کتاب میں ایک جڑ ہے جس کا مزاج معتدل ہے اور اگر کسی طرف مائل ہو تو گرمی اور تری کی طرف؛ اس کا رس بے ناخنہ اور زخموں پر لگایا جاتا ہے، قصبۂ ریہ کو نرم کرتا اور صاف کرتا، پھیپھڑے اور حلق کو فائدہ دیتا اور آواز صاف کرتا ہے، اپنی تری سے پیاس بجھاتا ہے، اور کتاب اسے پیشاب کی جلن، گردے اور مثانے کے زخموں اور پرانے بخاروں کے لیے گنواتی ہے {cite:canon-ibn-sina-print-v1 p.593}۔"
  es: "En el libro, Sus es una raíz de temperamento moderado, que tiende más bien al calor y la humedad; su jugo se aplica sobre el panadizo y las heridas, suaviza y limpia la tráquea, ayuda a los pulmones y la garganta y aclara la voz, calma la sed con su humedad, y el libro la menciona para el ardor de orina, las úlceras de los riñones y la vejiga y las fiebres antiguas {cite:canon-ibn-sina-print-v1 p.593}."
