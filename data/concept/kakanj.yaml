summary:
  ar: "الكاكنج نبات قوته قريبة من قوة عنب الثعلب، وخصوصا ورقه، وهو عند الكتاب بارد يابس إلى الثانية، يحفظ بعصارته القروح، وينفع من الربو وعسر النفس واليرقان وقروح مجاري البول."
  en: "Kakanj is a plant whose force is close to that of the winter cherry, especially its leaf. The book classes it as cold and dry to the second degree. Its juice keeps sores from spreading, and it helps asthma, difficult breathing, jaundice and ulcers of the urinary passages. The editor's footnote gives the name as the garden winter cherry."
  ur: "کاکنج ایک پودا ہے جس کی قوت عنب الثعلب سے ملتی ہے، خاص کر اس کے پتے کی۔ کتاب اسے دوسرے درجے تک ٹھنڈا اور خشک بتاتی ہے؛ اس کا رس زخموں کو محفوظ رکھتا ہے، اور دمہ، سانس کی تنگی، یرقان اور پیشاب کی نالیوں کے زخموں میں فائدہ دیتا ہے۔ حاشیے میں اسے باغی عنب الثعلب لکھا گیا ہے۔"
