"summary":
  "ar": "وأما علامات امتلاء فضاء الصدر من القيح فثقل وسعال يابس مع بهر ووجع، وربما\
    \ كان في كثير منهم سعال رطب يحيل حفة من النفث ويكون نفسهم متتابعاً ولذلك يكون\
    \ كلامهم سريعاً وتتحرك وترات أنوفهم إلى الانضمام عند التنفس وتلزمهم حمى دقية إلى\
    \ الاستسقاء. وأما علامة الجهة التي فيها المدة فتعرف بأن يضطجع العليل مرة على جنب\
    \ ومرة على آخر والجانب الذي يتعلق عليه ثقل ضاغط هو الجانب المقابل لموضع المدة\
    \ ويعرف من صوت المدة ورجرجتها وخضخضتها. وأما علامات الانفجار السليم فأن يكون الانفجار\
    \ يعقبه سكون الحمى ونهوض الشهوة وسهولة النفث والتنفس أو تحدث معه خراجات في الجنب\
    \ أو نواحيها تصير نواصير وكذلك الذي يكوى أو يبط فتخرج منه مدة نقية بيضاء، وأما\
    \ علامات الرديء فأن تظهر علامات الاختناق والغشي أو النفث الرديء أو السل، وإذا\
    \ كوي أو بط خرجت منه مدة حمية. وأما العلامات المفرقة بين المدة وبين البلغم في\
    \ النفث فهي رسوب مدة النفث في الماء وإنتانها على النار والبلغم طافٍ في الماء غير\
    \ منتن على النار على أن المدة قد تنفث في غير السل على ما بيناه في موضع متقدم.\
    \ وقد عرفت الفرق بين المدة وبين الرطوبات الأخرى فإن المدة تتميز بالنتن عند النفث\
    \ وعند الإلقاء على النار وترسب ولا تطفو. وأما علامات انتقال التقيح إلى السل فكمودة\
    \ اللون وامتداد الجبين والعنق وتسخن الأصابع كلها سخونة لا تفارق حتى فيمن عادة\
    \ أطرافه أن تبرد في الحميات وحمى تزيد ليلاً بسبب الغذاء وتعقف من الأظفار لذوبان\
    \ اللحم تحتها وتدسم من العينين مع ضرب من البياض والصفرة وعلامات أخرى سنذكرها في\
    \ باب السل {cite:canon-ibn-sina-print-v2 p.354}"
  "en": "The signs of the chest-cavity's filling with pus: a weight, a dry cough with\
    \ panting, and pain; in many there may be a moist cough bringing on a rattling\
    \ of expectoration, their breath runs in succession — so their speech comes fast\
    \ — the tendons of their noses draw together on breathing, and a hectical fever\
    \ holds them to the point of dropsy. The sign of the side where the matter lies\
    \ is known by having the patient lie once on one side and once on the other: the\
    \ side on which a pressing weight settles is the side opposite the matter's place,\
    \ and it is known from the matter's sound, its lapping and its sloshing. The signs\
    \ of the sound bursting: the bursting is followed by the fever's quieting, a rising\
    \ appetite and an easing of expectoration and breathing; or abscesses occur in\
    \ the side or its regions and become fistulas; likewise in the one cauterised\
    \ or lanced a pure white matter comes out. The signs of the bad case: signs of\
    \ choking and swooning appear, or an evil expectoration, or consumption; and when\
    \ cauterised or lanced a hot matter comes out. The signs distinguishing the matter\
    \ from phlegm in the expectoration: the expectorated matter sinks in water and\
    \ stinks on the fire, while phlegm floats on water and does not stink on the fire\
    \ — yet matter may be expectorated outside consumption, as we have shown earlier.\
    \ You have learned the difference between matter and the other moistures: matter\
    \ is marked by stench when spat and when thrown on the fire, and it sinks and\
    \ does not float. The signs of the suppuration's passage into consumption: a leaden\
    \ colour, a stretching of the forehead and neck, a warming of all the fingers\
    \ that does not leave even one whose extremities habitually cool in fevers, a\
    \ fever increasing at night because of the feeding, a curving of the nails for\
    \ the melting of the flesh beneath them, a greasiness of the eyes with a cast\
    \ of white and yellow, and other signs we shall state in the chapter of consumption\
    \ {cite:canon-ibn-sina-print-v2 p.354}"
