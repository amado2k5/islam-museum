id: concept/canon-bodies-of-imperfect-temperament-mistaken-and-congenital
class: concept
kind: scientific
label:
  ar: "الأبدان غير الفاضلة المزاج المخطئة والممنوة عند ابن سينا"
  en: "Bodies of imperfect temperament, the mistaken and the congenital, in the Canon"
  fr: "Tempéraments imparfaits acquis ou congénitaux dans le Canon"
  ur: "غیر فاضل مزاج کے بدن، خطا والے اور پیدائشی قانون میں"
  es: "Cuerpos de temperamento imperfecto, los erróneos y los congénitos, en el Canon"
  tr: "İbn Sina'ya göre erdemli, mizaçlı, yanlış ve avantajlı olmayan bedenler"
  id: "Tubuh yang tidak berbudi luhur, temperamental, keliru, dan tidak menguntungkan menurut Ibn Sina"
summary:
  ar: "يفتتح ابن سينا الفصل السابع عشر في تدبير الأبدان التي أمزجتها غير فاضلة ويقسمها إلى مخطئة اكتسبت أمزجة رديئة بخطأ التدبير المتطاول مع فضل أصلها، وممنوة مزاجها الأصلي غير فاضل {cite:canon-ibn-sina-print-v1 p.250}."
  en: "Ibn Sina opens the seventeenth chapter, on managing bodies whose temperaments are not excellent, and divides them into the mistaken, which have acquired poor temperaments through long error of regimen though their original was excellent, and the congenital, whose original temperament is not excellent {cite:canon-ibn-sina-print-v1 p.250}."
  fr: "Au chapitre 17 sur les corps au tempérament imparfait, Ibn Sina distingue les tempéraments altérés par de longues erreurs de régime, malgré une constitution initiale excellente, et ceux imparfaits dès l’origine {cite:canon-ibn-sina-print-v1 p.250}."
  es: "Ibn Sina abre el capítulo diecisiete, sobre el manejo de cuerpos cuyos temperamentos no son excelentes, y los divide en los equivocados, que han adquirido malos temperamentos por un largo error de régimen aunque su temperamento original era excelente, y los congénitos, cuyo temperamento original no es excelente {cite:canon-ibn-sina-print-v1 p.250}."
  ur: "ابن سینا نے سترہویں باب کا آغاز ان اداروں کے انتظام کے بارے میں کیا ہے جن کے مزاج بہترین نہیں ہیں، اور انہیں ان غلطیوں میں تقسیم کرتے ہیں، جنہوں نے طویل طرزِ عمل سے خراب مزاج حاصل کیا ہے، حالانکہ ان کی اصل بہترین تھی، اور پیدائشی، جن کا اصل مزاج بہترین نہیں ہے۔"
  tr: "İbn Sina, mizacı erdemli olmayan bedenlerin yönetimiyle ilgili on yedinci bölümü açar ve bunları, uzun süreli yönetim hatası nedeniyle kötü eğilimler kazananlara, orijinal eğilimleri tercih edilenlere ve orijinal mizaçları üstün olmayanlara ayırır, {cite:canon-ibn-sina-print-v1 s.250}."
  id: "Ibn Sina membuka bab tujuh belas tentang pengelolaan tubuh yang temperamennya tidak berbudi luhur dan membagi mereka menjadi mereka yang memiliki sifat buruk akibat kesalahan pengelolaan jangka panjang, meskipun sifat aslinya lebih disukai, dan mereka yang temperamen aslinya tidak lebih unggul, {cite:canon-ibn-sina-print-v1 hlm.250}."
