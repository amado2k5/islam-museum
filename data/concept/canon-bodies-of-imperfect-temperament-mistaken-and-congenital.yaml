summary:
  ar: "يفتتح ابن سينا الفصل السابع عشر في تدبير الأبدان التي أمزجتها غير فاضلة ويقسمها إلى مخطئة اكتسبت أمزجة رديئة بخطأ التدبير المتطاول مع فضل أصلها، وممنوة مزاجها الأصلي غير فاضل {cite:canon-ibn-sina-print-v1 p.250}."
  en: "Ibn Sina opens the seventeenth chapter, on managing bodies whose temperaments are not excellent, and divides them into the mistaken, which have acquired poor temperaments through long error of regimen though their original was excellent, and the congenital, whose original temperament is not excellent {cite:canon-ibn-sina-print-v1 p.250}."
