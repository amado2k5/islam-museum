summary:
  ar: "في الفصلين الثامن والتاسع يعدد ابن سينا أن الخشونة تحدث بسبب شديد الجلاء بتقطيعه أو تحليله أو قابض بيبوسته أو بارد بتكثيفه أو لركود أجزاء أرضية على العضو، وأن الملاسة سببها مغز بلزوجته أو محلل لطيف التحليل {cite:canon-ibn-sina-print-v1 p.145}."
  en: "In chapters 8 and 9 Ibn Sina gives the causes of roughness as something that scours too strongly by cutting or by dissolving, something astringent by its dryness, something cold by its condensing, or earthy particles settling on the organ; and the causes of smoothness as something that glues by viscosity or a gently dissolving agent {cite:canon-ibn-sina-print-v1 p.145}."
