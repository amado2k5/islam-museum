id: concept/canon-causes-of-roughness-and-smoothness
class: concept
kind: scientific
label:
  ar: "أسباب الخشونة والملاسة عند ابن سينا"
  en: "The causes of roughness and of smoothness in the Canon"
  fr: "Causes de rugosité et de lissage dans le Canon"
  ur: "کھردرے پن اور ملائمت کے اسباب، قانون کے مطابق"
  es: "Las causas de la aspereza y la suavidad en el Canon"
summary:
  ar: "في الفصلين الثامن والتاسع يعدد ابن سينا أن الخشونة تحدث بسبب شديد الجلاء بتقطيعه أو تحليله أو قابض بيبوسته أو بارد بتكثيفه أو لركود أجزاء أرضية على العضو، وأن الملاسة سببها مغز بلزوجته أو محلل لطيف التحليل {cite:canon-ibn-sina-print-v1 p.145}."
  en: "In chapters 8 and 9 Ibn Sina gives the causes of roughness as something that scours too strongly by cutting or by dissolving, something astringent by its dryness, something cold by its condensing, or earthy particles settling on the organ; and the causes of smoothness as something that glues by viscosity or a gently dissolving agent {cite:canon-ibn-sina-print-v1 p.145}."
  fr: "Aux chapitres 8 et 9, Ibn Sina attribue la rugosité au nettoyage trop puissant par incision ou résolution, à l’astringence sèche, au froid condensant ou au dépôt de particules terreuses ; le lissage à une substance visqueuse collante ou doucement résolutive {cite:canon-ibn-sina-print-v1 p.145}."
  es: "En los capítulos 8 y 9, Ibn Sina da las causas de la aspereza como algo que frota demasiado fuerte cortando o disolviendo, algo astringente por su sequedad, algo frío por su condensación o partículas terrosas que se depositan en el órgano; y las causas de la suavidad como algo que pega por viscosidad o un agente disolvente suave {cite:canon-ibn-sina-print-v1 p.145}."
