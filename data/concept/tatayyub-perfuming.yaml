label:
  ar: "التطيب"
  en: "Tatayyub (perfuming oneself)"
  ur: "تطیّب ⁦(خوشبو لگانا)⁩"
  es: "Tatayyub (perfumarse)"
  fr: "Tatayyub (se parfumer)"
summary:
  ar: "التطيب التعطر، والطيب ما له رائحة مستلذة كالمسك والكافور والورد. والأصل فيه السنية، وهو مندوب للرجل والمرأة، ويستحب للجمعة والعيد، ويباح للصائم عند الحنفية، ويجوز للمعتكف. وفي الإحرام يحظر التطيب بعده، ويفتدي من تطيب فيه، واختلف في التطيب قبله وفي الثوب المطيب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5337} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5338} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5339} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5340} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5341} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5342} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5343}"
  en: "Tatayyub is perfuming oneself; perfume is what has a pleasant smell, such as musk, camphor and rose. The rule is that it is a sunna for men and women; it is recommended for Friday and the festivals, is permitted to the fasting person for the Hanafis, and to the one in seclusion. In the pilgrimage garb it is forbidden after entering the state of consecration, and whoever perfumes himself owes a redemption; the rules for perfuming before entering it and for a perfumed garment differ between schools. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5337} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5338} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5339} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5340} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5341} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5342} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5343}"
  es: "Tatayyub es perfumarse; el perfume es aquello que tiene un aroma agradable, como el almizcle, el alcanfor y la rosa. La regla es que es una sunna para hombres y mujeres; se recomienda para los viernes y las festividades, está permitido para quienes ayunan según la escuela Hanafi y para quienes se encuentran en reclusión. Con la vestimenta de peregrinación, está prohibido después de entrar en estado de consagración, y quien se perfuma debe una redención; las reglas para perfumarse antes de entrar en estado de consagración y para la vestimenta perfumada difieren entre las escuelas. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5337} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5338} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5339} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5340} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5341} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5342} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5343}"
  fr: "Tatayyub consiste à se parfumer; le parfum désigne toute substance à l'odeur agréable, comme le musc, le camphre ou la rose. C'est une sunna pour les hommes et les femmes; c'est recommandé le vendredi et les jours de fête, permis au jeûneur selon l'école hanafite, ainsi qu'à celui qui vit en retraite spirituelle. Sous les vêtements du pèlerinage, c'est interdit après l'entrée en état de consécration, et quiconque se parfume doit s'acquitter d'une expiation; les règles concernant le parfum avant l'entrée en état de consécration et le port de vêtements parfumés varient selon les écoles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5337} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5338} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5339} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5340} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5341} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5342} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5343}"
