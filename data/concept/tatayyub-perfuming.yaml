  en: "Tatayyub (perfuming oneself)"
  ur: "تطیّب (خوشبو لگانا)"
summary:
  ar: "التطيب التعطر، والطيب ما له رائحة مستلذة كالمسك والكافور والورد. والأصل فيه السنية، وهو مندوب للرجل والمرأة، ويستحب للجمعة والعيد، ويباح للصائم عند الحنفية، ويجوز للمعتكف. وفي الإحرام يحظر التطيب بعده، ويفتدي من تطيب فيه، واختلف في التطيب قبله وفي الثوب المطيب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5337} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5338} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5339} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5340} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5341} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5342} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5343}"
  en: "Tatayyub is perfuming oneself; perfume is what has a pleasant smell, such as musk, camphor and rose. The rule is that it is a sunna for men and women; it is recommended for Friday and the festivals, is permitted to the fasting person for the Hanafis, and to the one in seclusion. In the pilgrimage garb it is forbidden after entering the state of consecration, and whoever perfumes himself owes a redemption; the rules for perfuming before entering it and for a perfumed garment differ between schools. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5337} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5338} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5339} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5340} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5341} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5342} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5343}"
