tags: [arabiyya-browser, arabiyya-world]
label:
  ar: "العربية في جيبوتي"
  en: "Arabic in Djibouti"
  ur: "جبوتی میں عربی"
  fr: "L'arabe à Djibouti"
  es: "El árabe en Yibuti"
summary:
  ar: "مكانة العربية في جيبوتي كما تقولها دائرة المعارف البريطانية وكتاب حقائق العالم: العربية والفرنسية لغتان رسميتان، والصومالية والعفرية لغتا أكبر جماعتين وهما كوشيتان شرقيتان لا يفهم متكلمو إحداهما الأخرى، وفي مدينة جيبوتي جالية يمنية قديمة. ولا تقول الصفحتان شيئاً عن لهجة عربية جيبوتية، ولا يوجد في المتحف سجل مكان لجيبوتي فتُذكر هنا بلا رابط."
  en: "The place of Arabic in Djibouti as the Encyclopaedia Britannica and The World Factbook state it: Arabic and French are official languages; Somali and Afar are the languages of the two largest groups, both Eastern Cushitic and not mutually intelligible; Djibouti city has a long-established Yemeni Arab community. The pages say nothing on a Djiboutian Arabic dialect, and the museum has no place record for Djibouti, so it is named here without a link."
  ur: "جبوتی میں عربی کا مقام جیسا انسائیکلوپیڈیا برٹانیکا اور ورلڈ فیکٹ بک بیان کرتی ہیں: عربی اور فرانسیسی سرکاری زبانیں ہیں؛ صومالی اور عفر دو سب سے بڑے گروہوں کی زبانیں ہیں، دونوں مشرقی کوشی اور ایک دوسرے کے لیے ناقابل فہم؛ جبوتی شہر میں یمنی عربوں کی قدیم جماعت ہے۔ دونوں صفحات کسی جبوتی عربی لہجے کے بارے میں کچھ نہیں کہتے، اور میوزیم کے پاس جبوتی کا مقام کا ریکارڈ نہیں، اس لیے یہاں اس کا نام بغیر ربط کے ہے۔"
  fr: "La place de l'arabe à Djibouti selon l'Encyclopaedia Britannica et The World Factbook : l'arabe et le français sont langues officielles ; le somali et l'afar sont les langues des deux plus grands groupes, tous deux couchitiques orientaux et non mutuellement intelligibles ; la ville de Djibouti compte une communauté arabe yéménite établie de longue date. Les pages ne disent rien d'un dialecte arabe djiboutien, et le musée n'a pas de fiche de lieu pour Djibouti, qui est donc nommé ici sans lien."
  es: "El lugar del árabe en Yibuti según la Encyclopaedia Britannica y The World Factbook: el árabe y el francés son lenguas oficiales; el somalí y el afar son las lenguas de los dos mayores grupos, ambas cusitas orientales y no mutuamente inteligibles; la ciudad de Yibuti tiene una comunidad árabe yemení establecida desde hace tiempo. Las páginas no dicen nada de un dialecto árabe yibutiano, y el museo no tiene registro de lugar para Yibuti, por lo que se nombra aquí sin enlace."
