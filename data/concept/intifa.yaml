label: { ar: "الانتفاع", en: "Intifa' (the right of use and benefit, and its rulings)", es: "Intifa' (el derecho de uso y beneficio, y sus resoluciones)", fr: "Intifa' (le droit d'usage et de bénéfice, et ses décisions)", ur: "انتفاضہ ⁦(استعمال اور فائدہ کا حق اور اس کے احکام)⁩" }
summary:
  ar: "الانتفاع لغة الوصول إلى المنفعة، ويطلق على حق الانتفاع الشخصي غير القابل للانتقال، وعلى ملك المنفعة القابل للتصرف والتمليك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3437} والفرق بينهما أن سبب حق الانتفاع أعم من سبب ملك المنفعة، وأن الانتفاع المحض حق ضعيف، بخلاف ملك المنفعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3438} ويكون الانتفاع واجبا كأكل المباح عند الخوف على النفس، ومحرما بالعين المحرمة، وجائزا بالعين المباحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3439} ومن أسبابه الإباحة والاضطرار والعقد، ويتقيد بالشروط والعرف، ويجب على المنتفع مراعاة حدود إذن المالك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3439}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3440}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3441}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3442}"
  en: "Intifa' in the lexical sense is reaching a benefit. It names a personal right of use that cannot pass to another, and ownership of the benefit, which can be transferred. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3437} The difference is that the cause of the right of use is wider than the cause of owned benefit, and that bare use is a weaker right than owned benefit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3438} Use is obligatory when needed to save life, forbidden when the thing is forbidden, and permitted when the thing is lawful. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3439} Its causes are permission, necessity and contract; it is bound by conditions, by custom and by the owner's leave. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3439}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3440}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3441}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3442}"
  es: "Intifa' en sentido léxico significa obtener un beneficio. Nombra un derecho personal de uso que no puede transmitirse a otro, y la propiedad del beneficio, que sí puede transferirse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3437} La diferencia radica en que la causa del derecho de uso es más amplia que la causa del beneficio propio, y que el mero uso es un derecho más débil que el beneficio propio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3438} El uso es obligatorio cuando se necesita para salvar la vida, prohibido cuando la cosa está prohibida y permitido cuando la cosa es lícita. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3439} Sus causas son el permiso, la necesidad y el contrato; está sujeto a condiciones, a la costumbre y al permiso del propietario. {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3439}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3440}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3441}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3442}"
  fr: "L'« intifa », au sens lexical, désigne l'obtention d'un avantage. Ce terme désigne un droit d'usage personnel et incessible, ainsi que la propriété de l'avantage, qui peut être transmise. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3437} La différence réside dans le fait que la cause du droit d'usage est plus large que celle de la propriété de l'avantage, et que le simple usage constitue un droit plus faible que la propriété de l'avantage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3438} L'usage est obligatoire lorsqu'il est nécessaire pour sauver des vies, interdit lorsque la chose est interdite, et permis lorsque la chose est licite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3439} Ses causes sont la permission, la nécessité et le contrat; il est soumis à des conditions, à la coutume et à l'accord du propriétaire. }"
  ur: "لغوی معنوں میں انتفاضہ ایک فائدے تک پہنچ رہا ہے۔ یہ استعمال کے ذاتی حق کا نام دیتا ہے جو دوسرے کو منتقل نہیں ہو سکتا، اور فائدہ کی ملکیت، جسے منتقل کیا جا سکتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص3437} فرق یہ ہے کہ حق استعمال کی وجہ ملکیتی فائدے کی وجہ سے وسیع ہے اور یہ کہ خالی استعمال ملکیتی فائدے سے کمزور حق ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 3438} جان بچانے کے لیے استعمال کرنا واجب ہے، جب چیز حرام ہو تو حرام اور جب چیز حلال ہو تو جائز ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3439} اس کے اسباب اجازت، ضرورت اور معاہدہ ہیں۔ یہ شرائط، اپنی مرضی کے مطابق اور مالک کی رخصت کا پابند ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.3439}{cite:fiqh-Mawsua-kuwaityya-noor-v3 p.3440}{cite:fiqh-mawsua-kuwaityya-noor-v3 p.3441}{cite:fiqh-mawsua-kuwaityya-noor-v3 p.3441}{cite:fiqh-vuwatiyya-noor-v3 p.3440}"
