label: { ar: "الانتفاع", en: "Intifa' (the right of use and benefit, and its rulings)" }
summary:
  ar: "الانتفاع لغة الوصول إلى المنفعة، ويطلق على حق الانتفاع الشخصي غير القابل للانتقال، وعلى ملك المنفعة القابل للتصرف والتمليك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3437} والفرق بينهما أن سبب حق الانتفاع أعم من سبب ملك المنفعة، وأن الانتفاع المحض حق ضعيف، بخلاف ملك المنفعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3438} ويكون الانتفاع واجبا كأكل المباح عند الخوف على النفس، ومحرما بالعين المحرمة، وجائزا بالعين المباحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3439} ومن أسبابه الإباحة والاضطرار والعقد، ويتقيد بالشروط والعرف، ويجب على المنتفع مراعاة حدود إذن المالك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3439}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3440}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3441}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3442}"
  en: "Intifa' in the lexical sense is reaching a benefit. It names a personal right of use that cannot pass to another, and ownership of the benefit, which can be transferred. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3437} The difference is that the cause of the right of use is wider than the cause of owned benefit, and that bare use is a weaker right than owned benefit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3438} Use is obligatory when needed to save life, forbidden when the thing is forbidden, and permitted when the thing is lawful. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3439} Its causes are permission, necessity and contract; it is bound by conditions, by custom and by the owner's leave. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3439}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3440}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3441}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3442}"
