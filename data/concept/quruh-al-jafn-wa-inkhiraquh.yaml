id: "concept/quruh-al-jafn-wa-inkhiraquh"
class: "concept"
kind: "scientific"
label:
  ar: "قروح الجفن وانخراقه"
  en: "Ulcers of the lid and its laceration"
  ur: "پلک کے قروح اور اس کا پھٹنا"
  es: "Úlceras del párpado y su laceración"
summary:
  ar: "قروح الجفن تعالج بضماد مجفف، فإذا سقطت الخشكريشة وبطل التأكل استعملت أدوية الإدمال، وأما انخراق الجفن فيعالج بعلاج انخراق الجلود المذكور في بابه {cite:canon-ibn-sina-print-v2 p.197}"
  en: "Ulcers of the lid are treated with a desiccating dressing; once the scab has fallen and the corrosion ceased, the healing medicines are used, while a lacerated lid is treated by the treatment of lacerated skins given in its own chapter {cite:canon-ibn-sina-print-v2 p.197}"
  ur: "پلک کے قروح کا علاج مجفف ضماد سے ہے؛ جب چھلکا گر جائے اور کھانے کا عمل بند ہو تو شفا بخش ادویہ استعمال ہوں، اور پلک کے پھٹنے کا علاج جلدوں کے پھٹنے کے اپنے باب کے علاج سے ہوتا ہے {cite:canon-ibn-sina-print-v2 p.197}۔"
  es: "Las úlceras del párpado se tratan con un apósito desecante; una vez que la costra se ha caído y la corrosión ha cesado, se utilizan los medicamentos curativos, mientras que un párpado lacerado se trata con el tratamiento de pieles laceradas que se describe en su propio capítulo {cite:canon-ibn-sina-print-v2 p.197}."
