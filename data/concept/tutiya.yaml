summary:
  ar: "توتيا في الكتاب أصله دخان يرتفع حيث يخلص الأسرب والنحاس من الحجارة التي يخالطانها، منه أبيض وأصفر وأخضر ورقيق وغليظ، وأجوده الأبيض الطيار ثم الأصفر ثم الفستقي الكرماني، بارد في الأولى يابس في الثانية، يجفف بلا لذع ومغسوله أفضل المجففات، نافع من الصنان ومن القروح حتى السرطانية ومن وجع العين ومن قروح المعدة والمذاكير وأورامها {cite:canon-ibn-sina-print-v1 p.688}"
  en: "Tutiya is in the book at its origin a smoke that rises where lead and copper are freed from the stones they are mixed with, in white, yellow, green, thin and thick kinds, the best being the white volatile, then the yellow, then the pistachio-coloured Kirmani; cold in the first degree and dry in the second, it dries without stinging and its washed form is the best of the dryers; it benefits body odour, ulcers even cancerous ones, eye pain, and ulcers and swellings of the stomach and of the male organs {cite:canon-ibn-sina-print-v1 p.688}"
  ur: "توتیا کتاب میں اپنی اصل میں ایک دھواں ہے جو وہاں اٹھتا ہے جہاں سیسہ اور تانبا ان پتھروں سے الگ کیے جاتے ہیں جن کے ساتھ ملے ہوتے ہیں، اس کی سفید، زرد، سبز، باریک اور موٹی قسمیں ہیں، سب سے اچھا سفید اڑنے والا ہے، پھر زرد، پھر کرمان کا پستے کے رنگ کا؛ پہلے درجے میں سرد اور دوسرے میں خشک ہے، بغیر چبھن کے خشک کرتا ہے اور اس کا دھلا ہوا خشک کرنے والی دواؤں میں سب سے بہتر ہے؛ بدبو، قرحوں حتیٰ کہ سرطانی قرحوں، آنکھ کے درد، اور معدے اور شرم گاہوں کے قرحوں اور ورموں میں نافع ہے {cite:canon-ibn-sina-print-v1 p.688}۔"
  es: "En el libro, la tutiya es un humo que se eleva donde el plomo y el cobre se liberan de las piedras con las que están mezclados, en variedades blancas, amarillas, verdes, finas y espesas, siendo la mejor la blanca volátil, luego la amarilla y finalmente la Kirmani de color pistacho; fría en el primer grado y seca en el segundo, seca sin irritar y su forma lavada es la mejor de los secantes; beneficia el olor corporal, las úlceras, incluso las cancerosas, el dolor ocular y las úlceras e inflamaciones del estómago y de los órganos masculinos {cite:canon-ibn-sina-print-v1 p.688}"
  fr: "Le livre décrit la tutiya comme une fumée, à son origine, qui s'élève là où le plomb et le cuivre sont libérés des pierres auxquelles ils sont mêlés. Elle se présente sous différentes formes: blanche, jaune, verte, fluide ou épaisse. La meilleure est la blanche volatile, suivie de la jaune, puis du kirmani, couleur pistache. Froide au premier degré et sèche au second, elle sèche sans piquer et, une fois lavée, elle est le meilleur des asséchants. Elle est bénéfique contre les odeurs corporelles, les ulcères, même cancéreux, les douleurs oculaires, ainsi que les ulcères et les gonflements de l'estomac et des organes génitaux masculins. {cite:canon-ibn-sina-print-v1 p.688}"
  tr: "Kitaptaki Tutia, karıştıkları taşlardan kurşun ve bakırın çıkarıldığı yerlerde yükselen dumandan kaynaklanır. Bazıları beyaz, sarı, yeşil, ince ve kaba renktedir; en iyisi sinek beyazı, sonra sarı, ardından Kermani antep fıstığıdır. İlk durumda soğuk, ikincisinde kuru, batmadan kuru ve en iyi kurutucu ürünlerle yıkanır. Kanser, göz ağrısı, mide ülserleri, hafıza ve tümörlere kadar yaralar için faydalıdır {cite:canon-ibn-sina-print-v1 s.688}"
  id: "Tutia dalam buku berasal dari asap yang naik di mana timbal dan tembaga dihilangkan dari batu yang mereka campur. Beberapa berwarna putih, kuning, hijau, tipis, dan kasar; yang terbaik adalah fly white, lalu kuning, lalu pistachio Kermani. Dingin pada kasus pertama, kering pada kasus kedua, kering tanpa sengat, dan dicuci dengan produk pengeringan terbaik. Ini bermanfaat untuk luka hingga kanker, nyeri mata, tukak lambung, memori, dan tumor {cite:canon-ibn-sina-print-v1 hlm.688}"
