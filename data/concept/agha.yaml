label:
  ar: "آغا"
  en: "Agha (Turkic title and term)"
summary:
  ar: "آغا لفظ تركي يعني في التركية الشرقية «الأخ الأكبر»، وفي العثمانية «الرئيس» و«السيد» و«مالك الأرض»، ثم صار لقبًا لكثير من موظفي الدولة والعسكريين، ولا سيما رؤساء الخصيان في القصر {cite:encyclopaedia-of-islam-2 vol. 1 p. 267}."
  en: "Agha is a Turkic word. In eastern Turkic it means 'elder brother' and elsewhere 'father' or 'uncle'; in Ottoman usage it means 'chief', 'master' or 'landowner', and it became a title for many officers and officials of the state, above all the chiefs of the palace eunuchs {cite:encyclopaedia-of-islam-2 vol. 1 p. 267}."
