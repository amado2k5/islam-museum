id: concept/agha
class: concept
kind: term
label:
  ar: "آغا"
  en: "Agha (Turkic title and term)"
  fr: "Agha (titre et terme turciques)"
  es: "Agha (título y término turco)"
summary:
  ar: "آغا لفظ تركي يعني في التركية الشرقية «الأخ الأكبر»، وفي العثمانية «الرئيس» و«السيد» و«مالك الأرض»، ثم صار لقبًا لكثير من موظفي الدولة والعسكريين، ولا سيما رؤساء الخصيان في القصر {cite:encyclopaedia-of-islam-2 vol. 1 p. 267}."
  en: "Agha is a Turkic word. In eastern Turkic it means 'elder brother' and elsewhere 'father' or 'uncle'; in Ottoman usage it means 'chief', 'master' or 'landowner', and it became a title for many officers and officials of the state, above all the chiefs of the palace eunuchs {cite:encyclopaedia-of-islam-2 vol. 1 p. 267}."
  fr: "Agha est un mot turcique. En turcique oriental, il signifie « frère aîné » et, ailleurs, « père » ou « oncle » ; dans l’usage ottoman, il signifie « chef », « maître » ou « propriétaire foncier », et il devint un titre porté par de nombreux officiers et fonctionnaires de l’État, avant tout par les chefs des eunuques du palais {cite:encyclopaedia-of-islam-2 vol. 1 p. 267}."
  es: "Agha es una palabra turca. En turco oriental significa 'hermano mayor' y en otros lugares 'padre' o 'tío'; en el uso otomano significa 'jefe', 'amo' o 'terrateniente', y se convirtió en un título para muchos oficiales y funcionarios del estado, sobre todo para los jefes de los eunucos del palacio {cite:encyclopaedia-of-islam-2 vol. 1 p. 267}."
