id: concept/tafattut-al-asnan-wa-takassuruha
class: concept
kind: scientific
label:
  ar: تفتت الأسنان وتكسرها
  en: The teeth's crumbling and breaking
  ur: دانتوں کا چور اور ٹوٹنا
  es: "Los dientes se están desmoronando y rompiendo"
  fr: "Les dents s'effritent et se cassent"
  tr: "Dişlerin parçalanması ve kırılması"
  id: "Fragmentasi dan patah gigi"
summary:
  ar: يكون سبب تفتت الأسنان وتكسرها في الأكثر استحالة مزاجها إلى رطوبة، وقد يعرض أن تيبس يبساً شديداً، والفرق بينهما الضمور وضده فإن كان هناك دليل تغير لون أو تأكل دل على مزاج رطب ذي مادة، وعلاج الأول منع المادة وتقوية السن بالقوابض القوية المذكورة وما وصف من القوي في ذلك ⁦(الأسماء مطروحة)⁩ فإن كانت مسخنة مع ذلك لم يغن إلا ما وصف من الشديد، وأما إن كان عن يبس فعلاجه علاج اليبس المذكور {cite:canon-ibn-sina-print-v2 p.275}
  en: The cause of the teeth's crumbling and breaking is mostly their temper turning to moisture; it may also happen that they dry out severely — the two told apart by wasting and its opposite, a sign of colour-change or corrosion pointing to a moist temperament with matter. The first is treated by repelling the matter and strengthening the tooth with the named strong astringents and what he described as potent in it (names left out); if heated on top, only the strong thing he described avails; if from dryness, its treatment is the dryness-treatment already given {cite:canon-ibn-sina-print-v2 p.275}
  ur: دانتوں کے چور اور ٹوٹنے کا سبب اکثر ان کے مزاج کا رطوبت میں بدلنا ہے؛ اور ایسا بھی ہو سکتا ہے کہ وہ بہت خشک ہو جائیں — دونوں کا فرق ضمور اور اس کے ضد سے ہوتا ہے، اور رنگ کی تبدیلی یا کتراؤ کی علامت نم مزاج مواد والے کی دلیل ہے؛ پہلے کا علاج مواد کا روکنا اور دانت کو مذکورہ قوی قابضوں اور اس کے بیان کردہ مؤثر سے مضبوط کرنا ہے ⁦(نام مطروح)⁩؛ اگر ساتھ گرم بھی ہوں تو صرف اس کی بیان کردہ سخت چیز سودا کرتی ہے؛ اور اگر خشکی سے ہو تو علاج وہی ہے جو خشکی کے لیے کہا گیا {cite:canon-ibn-sina-print-v2 p.275}
  es: "La causa del desmoronamiento y la rotura de los dientes suele ser su humedad; también puede ocurrir que se sequen severamente. Ambos casos se distinguen por el desgaste y su opuesto, un signo de cambio de color o corrosión que indica humedad. El primer caso se trata repeliendo la humedad y fortaleciendo el diente con los astringentes fuertes mencionados y lo que él describió como potente (se omiten los nombres); si se calienta la superficie, solo el ingrediente fuerte que describió es efectivo; si se debe a la sequedad, su tratamiento es el mismo que ya se ha indicado {cite:canon-ibn-sina-print-v2 p.275}."
  fr: "La cause de l'effritement et de la casse des dents est principalement leur altération par l'humidité; il peut aussi arriver qu'elles se dessèchent fortement. On distingue ces deux cas par l'amincissement, et son contraire, un changement de couleur ou une corrosion indiquant un tempérament humide contenant de la matière. Le premier cas est traité en repoussant la matière et en fortifiant la dent avec les astringents puissants mentionnés et ce qu'il a décrit comme étant efficace (noms omis); si la dent est chauffée, seul le puissant astringent qu'il a décrit est efficace; si le problème est dû à la sécheresse, le traitement est celui déjà indiqué pour la sécheresse {cite:canon-ibn-sina-print-v2 p.275}"
  tr: "Diş parçalanması ve kırılmasının nedeni genellikle mizaçlarındaki nemdir. Sertlik şiddetli kuruluktur. Aralarındaki fark atrofi ve anti-korozyon olmasıdır. Renk değişikliği veya aşınma belirtisi varsa, bu nemli bir ruh hali ve maddeleri gösterir. İlk tedavi, maddeyi önlemek ve dişi güçlü kavramalarla güçlendirmektir (isimler verilmiştir). Yine de ısıtılırsa, sadece şiddetli olarak tanımlanan durum yardımcı olmaz. Eğer kuruluksa, tedavi yukarıda belirtilen kuruluktur {cite:canon-ibn-sina-print-v2 s.275}"
  id: "Penyebab fragmentasi dan patah gigi biasanya adalah kelembapan dalam temperamennya. Mungkin kekakuan adalah kekeringan parah. Perbedaannya adalah atrofi dan anti-korosi. Jika ada bukti perubahan warna atau erosi, itu menunjukkan suasana hati lembap dengan zat. Perawatan pertama adalah mencegah zat dan memperkuat gigi dengan genggaman kuat yang disebutkan dan yang disebut kuat (nama diberikan). Jika tetap dipanaskan, hanya yang disebut parah yang tidak membantu. Jika kering, pengobatannya adalah kekeringan yang disebutkan sebelumnya {cite:canon-ibn-sina-print-v2 hlm.275}"
