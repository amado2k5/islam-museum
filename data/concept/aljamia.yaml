label:
  ar: "الأعجمية ⁦(الألخميادو)⁩"
  en: "Aljamia (aljamiado: Spanish written in Arabic script, and its literature)"
  fr: "Aljamia (aljamiado : l’espagnol écrit en caractères arabes et sa littérature)"
  es: "Aljamia (aljamiado: español escrito en caracteres árabes y su literatura)"
summary:
  ar: "الألخميا، من العربية «الأعجمية» أي غير العربية، وهو اسم أطلقه مسلمو الأندلس على اللهجات الرومانسية لجيرانهم في شمال شبه الجزيرة، وكانت ممتزجة بالعربية، وأدخل أكثرها مهاجرون من المستعربين منذ القرن التاسع الميلادي. ثم صار الاسم الإسباني يدل على الإسبانية المكتوبة بالحروف العربية، وأدب هذه الكتابة {cite:encyclopaedia-of-islam-2 vol. 1 p. 426}."
  en: "Aljamia is the Spanish form of the Arabic al-'ajamiyya ('non-Arabic'), a term the Muslims of al-Andalus used for the Romance dialects of their northern neighbours, dialects coloured with Arabisms introduced from the 9th century by Mozarab emigrants. In the later Middle Ages the word came to mean Spanish written in Arabic script, and the literature in that script is called aljamiado {cite:encyclopaedia-of-islam-2 vol. 1 p. 426}."
  fr: "Aljamia est la forme espagnole de l’arabe al-’ajamiyya (« non arabe »). Les musulmans d’al-Andalus employaient ce terme pour les parlers romans de leurs voisins du nord, marqués par des arabismes introduits à partir du IXe siècle par des émigrés mozarabes. À la fin du Moyen Âge, le mot en est venu à désigner l’espagnol écrit en caractères arabes ; la littérature dans cette écriture est dite aljamiado {cite:encyclopaedia-of-islam-2 vol. 1 p. 426}."
  es: "Aljamia es la forma española del árabe al-'ajamiyya ('no árabe'), término que los musulmanes de al-Ándalus utilizaban para referirse a los dialectos romances de sus vecinos del norte, dialectos influenciados por arabismos introducidos a partir del siglo IX por los emigrantes mozárabes. A finales de la Edad Media, la palabra pasó a significar español escrito en caracteres árabes, y la literatura escrita en dichos caracteres se denomina aljamiado {cite:encyclopaedia-of-islam-2 vol. 1 p. 426}."
