label:
  ar: "الأعجمية (الألخميادو)"
  en: "Aljamia (aljamiado: Spanish written in Arabic script, and its literature)"
summary:
  ar: "الألخميا، من العربية «الأعجمية» أي غير العربية، وهو اسم أطلقه مسلمو الأندلس على اللهجات الرومانسية لجيرانهم في شمال شبه الجزيرة، وكانت ممتزجة بالعربية، وأدخل أكثرها مهاجرون من المستعربين منذ القرن التاسع الميلادي. ثم صار الاسم الإسباني يدل على الإسبانية المكتوبة بالحروف العربية، وأدب هذه الكتابة {cite:encyclopaedia-of-islam-2 vol. 1 p. 426}."
  en: "Aljamia is the Spanish form of the Arabic al-'ajamiyya ('non-Arabic'), a term the Muslims of al-Andalus used for the Romance dialects of their northern neighbours, dialects coloured with Arabisms introduced from the 9th century by Mozarab emigrants. In the later Middle Ages the word came to mean Spanish written in Arabic script, and the literature in that script is called aljamiado {cite:encyclopaedia-of-islam-2 vol. 1 p. 426}."
