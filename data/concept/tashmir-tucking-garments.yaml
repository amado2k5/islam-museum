label:
  ar: "التشمير"
  en: "Tashmir (tucking up one's garments)"
  ur: "تشمیر (کپڑے سمیٹنا)"
summary:
  ar: "التشمير رفع الثوب أو الذيل، ومن ألفاظه المرتبطة السدل وهو إرخاء الثوب من غير ضم جانبيه، والإسبال وهو إطالة الثوب إلى الأرض خيلاء. التشمير في الصلاة مكروه بالاتفاق، لنهي النبي عن كفت الثياب، والمالكية يكرهونه فيها إذا فعله لأجلها، أما فعله لشغل ثم تحضر الصلاة فلا كراهة عندهم. والسدل في الصلاة مكروه بالاتفاق. والإسبال خيلاء مكروه، وفيه الوعيد الوارد في الأحاديث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5196} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5197} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5198}"
  en: "Tashmir is lifting a garment or its hem. Related terms: sadl, letting a cloth hang over the shoulders without closing its sides, which is disliked in prayer by agreement; and isbal, letting a garment trail to the ground out of pride, which is disliked and carries the warnings in the hadiths. Tucking up in prayer is disliked by agreement, on the prohibition of tucking garments and hair; the Malikis dislike it in prayer only when done for the prayer, and tucking up the hem for a task that happens to be unfinished when prayer comes is not disliked. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5196} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5197} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5198}"
