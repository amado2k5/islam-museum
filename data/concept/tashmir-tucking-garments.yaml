id: concept/tashmir-tucking-garments
class: concept
kind: ethical
label:
  ar: "التشمير"
  en: "Tashmir (tucking up one's garments)"
  ur: "تشمیر ⁦(کپڑے سمیٹنا)⁩"
  es: "Tashmir (recogerse la ropa)"
  fr: "Tashmir (rentrer ses vêtements)"
summary:
  ar: "التشمير رفع الثوب أو الذيل، ومن ألفاظه المرتبطة السدل وهو إرخاء الثوب من غير ضم جانبيه، والإسبال وهو إطالة الثوب إلى الأرض خيلاء. التشمير في الصلاة مكروه بالاتفاق، لنهي النبي عن كفت الثياب، والمالكية يكرهونه فيها إذا فعله لأجلها، أما فعله لشغل ثم تحضر الصلاة فلا كراهة عندهم. والسدل في الصلاة مكروه بالاتفاق. والإسبال خيلاء مكروه، وفيه الوعيد الوارد في الأحاديث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5196} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5197} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5198}"
  en: "Tashmir is lifting a garment or its hem. Related terms: sadl, letting a cloth hang over the shoulders without closing its sides, which is disliked in prayer by agreement; and isbal, letting a garment trail to the ground out of pride, which is disliked and carries the warnings in the hadiths. Tucking up in prayer is disliked by agreement, on the prohibition of tucking garments and hair; the Malikis dislike it in prayer only when done for the prayer, and tucking up the hem for a task that happens to be unfinished when prayer comes is not disliked. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5196} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5197} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5198}"
  es: "Tashmir es levantar una prenda o su dobladillo. Términos relacionados: sadl, dejar que una tela cuelgue sobre los hombros sin cerrar los lados, lo cual es desaconsejable en la oración por consenso; e isbal, dejar que una prenda arrastre hasta el suelo por orgullo, lo cual es desaconsejable y conlleva advertencias en los hadices. Recogerse la ropa en la oración es desaconsejable por consenso, en la prohibición de recogérsela tanto a la ropa como al cabello; los malikíes lo desaconsejan en la oración solo cuando se hace para la oración, y recogerse el dobladillo para una tarea que resulta estar inconclusa al momento de la oración no es desaconsejable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5196} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5197} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5198}"
  fr: "Le terme « tashmir » désigne le fait de relever un vêtement ou son ourlet. Termes apparentés: « sadl », laisser pendre un tissu sur les épaules sans en fermer les côtés, ce qui est déconseillé pendant la prière (unanimement reconnu); et « isbal », laisser traîner un vêtement jusqu’au sol par orgueil, ce qui est déconseillé et fait l’objet de mises en garde dans les hadiths. Rentrer son vêtement dans sa robe pendant la prière est déconseillé (unanimement reconnu), en raison de l’interdiction de rentrer ses vêtements et ses cheveux dans sa robe; les Malikites le déconseillent uniquement lorsque cela est fait spécifiquement pour la prière, et rentrer l’ourlet de sa robe pour une tâche inachevée au moment de la prière n’est pas déconseillé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5196} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5197} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5198}"
