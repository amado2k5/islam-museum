"label":
  "ar": "معالجات ذات الرئة"
  "en": "The treatments of peripneumonia"
  "ur": "ذات الرئة کے علاج"
"summary":
  "ar": "ذات الرئة يجري في علاجه مجرى ذات الجنب إلا أن ضماداته يجب أن تكون أقوى ويدخل\
    \ فيها ما هو مغوص ويجب أن يكون الحرص على تنقيته بالنفث أشد ويكون فيه بدل الاضطجاع\
    \ على الجهة المنفثة الاستلقاء مائلاً إلى تلك الجهة، وإذا كانت الطبيعة فيه معتقلة\
    \ وجب أن يسقوا في كل يومين مرة من شراب هذا الجنس وإن كانت الطبيعة لينة ليناً مضعفاً\
    \ سقي أرباء وملزجات من هذا الجنس، وما كان من جنس الماشر أو الحمرة فإن علاجه كما\
    \ أشرنا إليه أصعب فإن نفع شيء فالتطفئة البالغة بالعصارات الشديدة البرد المعلومة\
    \ من هذا الجنس ويسقى المبردة الملينة منها وإن استفرغت الصفراء بمثل ما في هذا الجنس\
    \ فهو جائز وكذلك ربما احتيج فيه إلى الفصد إن كان هناك امتلاء {cite:canon-ibn-sina-print-v2\
    \ p.363}"
  "en": "Peripneumonia runs in its treatment the course of pleurisy, except that its\
    \ poultices must be stronger and what penetrates deep is admitted into them; the\
    \ care to cleanse it by expectoration must be sharper; and instead of lying on\
    \ the expectorating side, the posture is lying inclined toward that side. If the\
    \ nature in it is bound they must be given once every two days of a drink of this\
    \ kind; if the nature is lax to weakening, robs and astringents of this kind are\
    \ given. What is of the choleric or the erysipelas kind — its treatment, as we\
    \ have hinted, is harder: if anything benefits it is the utmost quenching by the\
    \ strongly cold juices known of this kind, and the cooling loosening ones of them\
    \ are given; and if the bile is evacuated by the like of this kind it is permitted\
    \ — and likewise venesection may be needed in it if there is fullness {cite:canon-ibn-sina-print-v2\
    \ p.363}"
  "ur": "ذات الرئة کے علاج میں ذات الجنب کے مجرى میں چلتا ہے مگر اس کے ضماد مضبوط\
    \ تر ہونے چاہئیں اور ان میں گہرائی تک اترنے والی چیز داخل ہو اور نفث سے صاف کرنے\
    \ کی حرص زیادہ ہونی چاہیے اور نفث والی طرف اضطجاع کے بدلے اسی طرف جھکا لیٹنا ہو\
    \ اور اگر طبیعت بند ہو تو ہر دو دن میں ایک بار اسی جنس کا مشروب پلانا چاہیے اور\
    \ اگر طبیعت کمزوری تک ڈھیلی ہو تو اسی جنس کے رب اور قابض چیزیں پلائی جائیں اور\
    \ جو ماشر یا حمرة کی جنس کا ہو اس کا علاج جیسا ہم نے اشارہ کیا مشکل تر ہے اگر\
    \ کچھ نفع دے تو اسی جنس کی معلوم بہت ٹھنڈی عصاروں سے مکمل بجھانا ہے اور ان میں\
    \ ٹھنڈی نرم کرنے والی پلائی جائے اور اگر صفراء اسی جنس کی چیز سے استفراغ ہو تو\
    \ جائز ہے اور اگر امتلاء ہو تو اس میں فصد کی بھی ضرورت پڑ سکتی ہے {cite:canon-ibn-sina-print-v2\
    \ p.363}"
