label:
  ar: "المغاورة (المُوغافاريس)"
  en: "Almogavares (Aragonese mountain infantry mercenaries)"
summary:
  ar: "المُوغافاريس، اسم أُطلق في أواخر العصور الوسطى على فرق من المرتزقة المشاة من جبال أراغون، وأصله على الأرجح عربي من «المغاوِر» أي المغير؛ وقد خدموا ملوك أراغون وقشتالة، وهزموا جيش فيليب الثالث الفرنسي في روسيون سنة 1285م، ثم شنّوا غارات في شرق البحر المتوسط تحت اسم «الفرقة الكتالونية الكبرى» {cite:encyclopaedia-of-islam-2 vol. 1 p. 441}."
  en: "Almogavares, a name given at the end of the Middle Ages to contingents of mountain mercenaries from Aragon, probably from the Arabic al-mughawir, 'one who makes hostile incursions'. They fought on foot for the kings of Aragon and Castile, defeated the French army of Philip III at Roussillon in 1285, and later raided the eastern Mediterranean as the Grande Compagnie Catalane {cite:encyclopaedia-of-islam-2 vol. 1 p. 441}."
