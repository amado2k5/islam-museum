label:
  ar: "المغاورة ⁦(المُوغافاريس)⁩"
  en: "Almogavares (Aragonese mountain infantry mercenaries)"
  fr: "Almogavares (mercenaires à pied des montagnes d’Aragon)"
  es: "Almogavares (mercenarios de infantería de montaña aragoneses)"
  ur: "Almogavares ⁦(Aragonese پہاڑی پیادہ کرائے کے فوجی)⁩"
summary:
  ar: "المُوغافاريس، اسم أُطلق في أواخر العصور الوسطى على فرق من المرتزقة المشاة من جبال أراغون، وأصله على الأرجح عربي من «المغاوِر» أي المغير؛ وقد خدموا ملوك أراغون وقشتالة، وهزموا جيش فيليب الثالث الفرنسي في روسيون سنة 1285م، ثم شنّوا غارات في شرق البحر المتوسط تحت اسم «الفرقة الكتالونية الكبرى» {cite:encyclopaedia-of-islam-2 vol. 1 p. 441}."
  en: "Almogavares, a name given at the end of the Middle Ages to contingents of mountain mercenaries from Aragon, probably from the Arabic al-mughawir, 'one who makes hostile incursions'. They fought on foot for the kings of Aragon and Castile, defeated the French army of Philip III at Roussillon in 1285, and later raided the eastern Mediterranean as the Grande Compagnie Catalane {cite:encyclopaedia-of-islam-2 vol. 1 p. 441}."
  fr: "Nom donné à la fin du Moyen Âge à des contingents de mercenaires des montagnes d’Aragon, probablement issu de l’arabe al-mughawir, « celui qui mène des incursions hostiles ». Ils combattirent à pied pour les rois d’Aragon et de Castille, défirent l’armée française de Philippe III en Roussillon en 1285 et menèrent plus tard des raids en Méditerranée orientale sous le nom de Grande Compagnie catalane {cite:encyclopaedia-of-islam-2 vol. 1 p. 441}."
  es: "Almogavares, nombre que se daba a finales de la Edad Media a contingentes de mercenarios de montaña de Aragón, probablemente derivado del árabe al-mughawir, «el que realiza incursiones hostiles». Lucharon a pie para los reyes de Aragón y Castilla, derrotaron al ejército francés de Felipe III en Rosellón en 1285 y, posteriormente, realizaron incursiones en el Mediterráneo oriental como la Grande Compagnie Catalane {cite:encyclopaedia-of-islam-2 vol. 1 p. 441}."
  ur: "الموگاورس، ایک نام جو قرون وسطی کے آخر میں اراگون کے پہاڑی کرائے کے دستوں کو دیا گیا تھا، غالباً عربی المغاویر سے، 'جو دشمنی پر حملہ کرتا ہے'۔ انہوں نے آراگون اور کاسٹیل کے بادشاہوں کے لیے پیدل جنگ لڑی، 1285 میں روسلن میں فلپ III کی فرانسیسی فوج کو شکست دی، اور بعد میں مشرقی بحیرہ روم پر گرانڈے کمپگنی کاتالان کے طور پر چھاپہ مارا۔ 1 ص۔ 441}۔"
