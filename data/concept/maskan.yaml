id: concept/maskan
class: concept
kind: social
label:
  ar: "المسكن والسكنى"
  en: "The dwelling (maskan, sukna)"
  ur: "مسکن اور سکون"
summary:
  ar: "المسكن بيت المسلم وسكناه، جعله الله للناس سكنا وذكر في كتابه البيوت والحجرات والديار، وأدب دخوله بالاستئذان والسلام. ومن مساكن المسلمين الأشهر حجرات أزواج النبي بجوار المسجد، وبيوت الصحابة بالمدينة، وما في الفقه من أحكام المسكن والسكنى والإجارة."
  en: "The maskan is the Muslim's home and dwelling; God made houses a repose for people, and His Book mentions houses, chambers and dwellings, with the etiquette of entering by permission and greeting. Among the best-known Muslim dwellings are the chambers of the Prophet's wives beside the mosque, the Companions' homes in Madina, and the fiqh of housing, lodging and rent."
  ur: "مسکن مسلمان کا گھر اور رہائش ہے؛ اللہ نے گھروں کو لوگوں کے لیے سکون بنایا اور کتاب میں مکانوں، کمرے خاصوں اور دیار کا ذکر آیا ہے، اجازت مانگنے اور سلام کے آداب کے ساتھ۔ نبی کی ازواج کے حجرے اور مدینہ میں صحابہ کے گھر معروف ترین مسکن ہیں۔"
