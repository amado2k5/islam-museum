id: concept/maskan
class: concept
kind: social
label:
  ar: "المسكن والسكنى"
  en: "The dwelling (maskan, sukna)"
  ur: "مسکن اور سکون"
  es: "La vivienda (maskan, sukna)"
  fr: "L'habitation (maskan, sukna)"
summary:
  ar: "المسكن بيت المسلم وسكناه، جعله الله للناس سكنا وذكر في كتابه البيوت والحجرات والديار، وأدب دخوله بالاستئذان والسلام. ومن مساكن المسلمين الأشهر حجرات أزواج النبي بجوار المسجد، وبيوت الصحابة بالمدينة، وما في الفقه من أحكام المسكن والسكنى والإجارة."
  en: "The maskan is the Muslim's home and dwelling; God made houses a repose for people, and His Book mentions houses, chambers and dwellings, with the etiquette of entering by permission and greeting. Among the best-known Muslim dwellings are the chambers of the Prophet's wives beside the mosque, the Companions' homes in Madina, and the fiqh of housing, lodging and rent."
  ur: "مسکن مسلمان کا گھر اور رہائش ہے؛ اللہ نے گھروں کو لوگوں کے لیے سکون بنایا اور کتاب میں مکانوں، کمرے خاصوں اور دیار کا ذکر آیا ہے، اجازت مانگنے اور سلام کے آداب کے ساتھ۔ نبی کی ازواج کے حجرے اور مدینہ میں صحابہ کے گھر معروف ترین مسکن ہیں۔"
  es: "El maskan es el hogar y la morada del musulmán; Dios hizo de las casas un lugar de descanso para las personas, y Su Libro menciona casas, aposentos y moradas, con la etiqueta de entrar con permiso y saludo. Entre las moradas musulmanas más conocidas se encuentran los aposentos de las esposas del Profeta junto a la mezquita, las casas de los Compañeros en Medina y la jurisprudencia islámica (fiqh) sobre vivienda, alojamiento y renta."
  fr: "Le maskan désigne le foyer et la demeure du musulman. Dieu a fait des maisons un lieu de repos pour les hommes, et Son Livre mentionne les maisons, les chambres et les demeures, ainsi que les règles de bienséance consistant à demander la permission et à saluer avant d'y entrer. Parmi les demeures musulmanes les plus connues figurent les chambres des épouses du Prophète près de la mosquée, les maisons des Compagnons à Médine, et les règles juridiques (fiqh) relatives au logement, à l'hébergement et au loyer."
