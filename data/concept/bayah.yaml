label:
  ar: البيعة
  en: The bay'a (oath of allegiance)
  fr: "La bay'a (serment d’allégeance)"
  ur: بیعت
  es: "El bay'a (juramento de lealtad)"
summary:
  ar: "البيعة في الاصطلاح الشرعي عقد الإذعان والطاعة؛ تعالج الموسوعة الفقهية موادها من عقد البيعة إلى إيمانها {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  en: "The bay'a in legal usage is the contract of submission and obedience; the Kuwaiti Fiqh Encyclopedia treats its articles from the contract of bay'a to its oaths {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  fr: "Dans l’usage juridique, la bay'a est le contrat de soumission et d’obéissance ; l’Encyclopédie koweïtienne du fiqh lui consacre des notices allant du contrat aux serments d’allégeance {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  es: "En el ámbito jurídico, la bay'a es el contrato de sumisión y obediencia; la Enciclopedia de Fiqh de Kuwait trata sus artículos desde el contrato de bay'a hasta sus juramentos {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  ur: "بیع قانونی استعمال میں تسلیم اور اطاعت کا معاہدہ ہے۔ کویتی فقہ انسائیکلو پیڈیا اپنے مضامین کو بیع کے معاہدے سے لے کر اس کی قسموں تک کا حوالہ دیتا ہے"
