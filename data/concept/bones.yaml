label:
  ar: "العظام عند ابن سينا"
  en: "Bones in the Canon"
  fr: "Les os dans le Canon"
  ur: "قانون میں ہڈیاں"
  es: "Huesos en el canon"
summary:
  ar: "يفتتح ابن سينا الجملة الأولى من تشريح الأعضاء المفردة في الكتاب الأول من «القانون» بالعظام، ويجعلها ثلاثين فصلاً، أولها كلام كلي في العظام والمفاصل {cite:canon-ibn-sina-print-v1 p.42}. ويرى أن جملة العظام دعامة للبدن وقوام له، وأن منها ما هو أساس يُبنى عليه البدن كفقار الصلب، ومنها ما يدفع به الصادم والمؤذي كالسناسن، ومنها ما هو حشو بين فرج المفاصل {cite:canon-ibn-sina-print-v1 p.42}."
  en: "Ibn Sina opens the first group of the Canon's anatomy of the simple organs, in Book I, with the bones, which he treats in thirty chapters; the first is a general discourse on bones and joints {cite:canon-ibn-sina-print-v1 p.42}. He holds that the bones as a whole are the prop and the frame of the body, and that some are the foundation on which the body is built, such as the spinal vertebrae, some are what repels a blow or an injury, such as the spines, and some are filling between the gaps of the joints {cite:canon-ibn-sina-print-v1 p.42}."
  fr: "Ibn Sina ouvre le premier groupe de l’anatomie des organes simples du Livre I par les os, en trente chapitres, dont le premier traite généralement des os et articulations {cite:canon-ibn-sina-print-v1 p.42}. Les os soutiennent et charpentent le corps : certains en sont les fondations, comme les vertèbres ; d’autres repoussent coups et blessures, comme les apophyses épineuses ; d’autres comblent les espaces articulaires {cite:canon-ibn-sina-print-v1 p.42}."
  es: "Ibn Sina abre el primer grupo de la anatomía de los órganos simples del Canon, en el Libro I, con los huesos, que trata en treinta capítulos; el primero es un discurso general sobre huesos y articulaciones {cite:canon-ibn-sina-print-v1 p.42}. Sostiene que los huesos en su conjunto son el soporte y la estructura del cuerpo, y que algunos son la base sobre la que se construye el cuerpo, como las vértebras espinales, otros son los que repelen un golpe o una lesión, como las espinas, y otros rellenan los espacios entre las articulaciones {cite:canon-ibn-sina-print-v1 p.42}."
