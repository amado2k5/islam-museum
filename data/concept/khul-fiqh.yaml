id: concept/khul-fiqh
class: concept
kind: legal
label:
  ar: الخلع
  en: Khul' (divorce by payment from the wife)
  ur: خلع
summary:
  ar: 'الخلع لغة النزع والتجريد، واصطلاحا عند الحنفية أخذ مال من المرأة بإزاء ملك النكاح بلفظ الخلع، وعند الجمهور فرقة بعوض مقصود لجهة الزوج بلفظ طلاق أو خلع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7758}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7759} يتصل بالصلح (رفع النزاع) والطلاق (رفع قيد النكاح)، والفدية (المال المدفوع للتخلص)، والمبارأة (اسم آخر للخلع، وتختص بإسقاط المرأة حقها على الزوج)، والفسخ (حل ارتباط العقد). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7759}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7760} الخلع طلاق أم فسخ: الحنفية في المفتى به والمالكية والشافعية في الجديد والحنابلة في رواية يرون الخلع طلاقا، والشافعي في القديم والحنابلة في الأشهر يرونه فسخا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7760}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7761} القائلون بالطلاق يرون أن الواقع طلقة بائنة، وإن نوى الزوج أكثر فيقع ما نواه عند المالكية والشافعية والحنابلة وزفر، والحنفية يعتبرون نية الثلاث ثلاثا؛ والقائلون بالفسخ يحتجون بآية الطلاق مرتين والخلع ثم الطلاق بعده، وبحديث امرأة ثابت بن قيس أن تعتد بحيضة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7761}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7762} أحكام الفسخ والطلاق: من خالعها مرتين ثم عقد عليها جاز عند القائلين بالفسخ؛ والحنفية والمالكية يعدون الخلع معاوضة من جهة المرأة ويمينا من جهة الزوج، والمالكية والشافعية والحنابلة معاوضة من الجانبين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7763} الحكم التكليفي: الخلع جائز في الجملة عند الجمهور؛ وهو عند الحنابلة على ثلاثة أضرب: مباح إذا كرهت المرأة البقاء وخافت ألا تقيم حقوق الزوج، ويسن للزوج الإجابة؛ ومكروه إذا كان لغير سبب مع استقامة الحال؛ ومحرم إذا كان الإضرار بالمرأة لتفتدي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7764}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7765}'
  en: 'Khul\'' is lexically drawing off or stripping; for the Hanafis it is taking money from the wife in return for the marriage bond, by the word khul\''; for the majority it is separation for a consideration due by the wife, by the word talaq or khul\''. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7758}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7759} It is near to reconciliation (sulh, ending a quarrel), to divorce (lifting the marriage tie), to ransom (fidya, the sum paid to be free), to mubara\''a (another name for it, in which the wife drops her claims on the husband), and to annulment (faskh, dissolving the contract). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7759}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7760} Is khul\'' divorce or annulment? The Hanafis in the chosen view, the Malikis, the Shafiis in the new view and the Hanbalis in one report hold it divorce; the Shafii in the old view and the Hanbalis in the best-known report hold it annulment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7760}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7761} Those who call it divorce say it is a final single divorce, and if the husband intends more, more falls, by the Malikis, Shafiis, Hanbalis and Zufar; the Hanafis count three if he intends three. Those who call it annulment cite the verse on two divorces then the khul\'', then the divorce after it, and the report of the wife of Thabit ibn Qays who was told to wait one menstrual period. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7761}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7762} Results of the two views: one who has khul\''ed twice and marries her again is free to do so on the annulment view; the Hanafis and Malikis treat khul\'' as an exchange on the wife\''s side and an oath on the husband\''s, the Malikis, Shafiis and Hanbalis as an exchange on both sides. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7763} Ruling: khul\'' is lawful in general; the Hanbalis divide it into three: lawful when the wife hates the marriage and fears she cannot keep its duties, when the husband is encouraged to accept; disliked without cause while the marriage is sound; forbidden when the wife is harmed to make her pay. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7764}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7765}'
  ur: 'خلع لغت میں اتارنا اور نکالنا ہے؛ حنفیہ کے نزدیک بیوی سے نکاح کے بدلے مال لینا لفظ خلع کے ساتھ، جمہور کے نزدیک بیوی کے عوض دینے پر لفظ طلاق یا خلع کے ساتھ جدائی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7758}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7759} یہ صلح (جھگڑے کا خاتمہ)، طلاق (نکاح کے بندھن کو کھولنا)، فدیہ (چھٹکارے کے لیے دیا جانے والا مال)، مبارأۃ (خلع کا دوسرا نام جس میں بیوی شوہر پر اپنے حق چھوڑتی ہے) اور فسخ (عقد کو ختم کرنا) سے متعلق ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7759}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7760} خلع طلاق ہے یا فسخ: حنفیہ کے مفتیٰ بہ قول، مالکیہ، شافعیہ کے جدید اور حنابلہ کی ایک روایت کے مطابق طلاق؛ شافعیہ کے قدیم قول اور حنابلہ کی مشہور روایت کے مطابق فسخ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7760}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7761} طلاق کے قائلین کے نزدیک ایک بائن طلاق واقع ہوتی ہے، شوہر زیادہ کی نیت کرے تو مالکیہ، شافعیہ، حنابلہ اور زفر کے نزدیک وہی واقع ہوتا ہے، حنفیہ تین کی نیت پر تین مانتے ہیں؛ فسخ کے قائلین آیت «الطلاق مرتان» اور ثابت بن قیس کی بیوی کی حدیث (ایک حیض عدت) سے استدلال کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7761}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7762} دونوں قولوں کے نتائج: فسخ کے قول پر دو بار خلع کے بعد اسی سے دوبارہ نکاح جائز ہے؛ حنفیہ اور مالکیہ خلع کو عورت کی طرف سے معاوضہ اور شوہر کی طرف سے قسم سمجھتے ہیں، مالکیہ، شافعیہ اور حنابلہ دونوں جانب سے معاوضہ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7763} حکم: جمہور کے نزدیک بعض صورتوں میں جائز ہے؛ حنابلہ اس کی تین قسمیں کرتے ہیں: مباح جب بیوی شوہر سے نفرت کرے اور حقوق ادا نہ کر سکنے کا خوف ہو، شوہر کے لیے قبول کرنا مستحب ہے؛ مکروہ بغیر سبب کے جب حال درست ہو؛ حرام اگر بیوی کو تکلیف دی جائے تاکہ وہ مال دے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7764}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7765}'
