id: concept/khul-fiqh
class: concept
kind: legal
label:
  ar: الخلع
  en: Khul' (divorce by payment from the wife)
  ur: خلع
summary:
  ar: 'الخلع لغة النزع والتجريد، واصطلاحا عند الحنفية أخذ مال من المرأة بإزاء ملك النكاح بلفظ الخلع، وعند الجمهور فرقة بعوض مقصود لجهة الزوج بلفظ طلاق أو خلع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7758}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7759} يتصل بالصلح (رفع النزاع) والطلاق (رفع قيد النكاح)، والفدية (المال المدفوع للتخلص)، والمبارأة (اسم آخر للخلع، وتختص بإسقاط المرأة حقها على الزوج)، والفسخ (حل ارتباط العقد). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7759}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7760} الخلع طلاق أم فسخ: الحنفية في المفتى به والمالكية والشافعية في الجديد والحنابلة في رواية يرون الخلع طلاقا، والشافعي في القديم والحنابلة في الأشهر يرونه فسخا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7760}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7761} القائلون بالطلاق يرون أن الواقع طلقة بائنة، وإن نوى الزوج أكثر فيقع ما نواه عند المالكية والشافعية والحنابلة وزفر، والحنفية يعتبرون نية الثلاث ثلاثا؛ والقائلون بالفسخ يحتجون بآية الطلاق مرتين والخلع ثم الطلاق بعده، وبحديث امرأة ثابت بن قيس أن تعتد بحيضة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7761}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7762} أحكام الفسخ والطلاق: من خالعها مرتين ثم عقد عليها جاز عند القائلين بالفسخ؛ والحنفية والمالكية يعدون الخلع معاوضة من جهة المرأة ويمينا من جهة الزوج، والمالكية والشافعية والحنابلة معاوضة من الجانبين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7763} الحكم التكليفي: الخلع جائز في الجملة عند الجمهور؛ وهو عند الحنابلة على ثلاثة أضرب: مباح إذا كرهت المرأة البقاء وخافت ألا تقيم حقوق الزوج، ويسن للزوج الإجابة؛ ومكروه إذا كان لغير سبب مع استقامة الحال؛ ومحرم إذا كان الإضرار بالمرأة لتفتدي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7764}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7765} الحنابلة يقسمون الخلع ثلاثة أضرب: مباح عند البغض وخوف عدم أداء الحق، ويسن للزوج الإجابة؛ ومكروه بلا سبب مع استقامة الحال، وفيه قولان في وقوعه؛ ومحرم إذا عضل الرجل زوجته ظلما ليفتدي، ويقع الطلاق رجعيا ولا يستحق العوض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7766} الخلع بغير لفظ الطلاق: إن كان طلاقا فحكمه كما ذكر، وإلا فالزوجية باقية؛ الضرب بحق للنشوز أو ترك الفرض لا يحرم الخلع، والعضل لتفتدي بالزنى جائز؛ والضرب ظلما لغير أخذ المال يصح معه الخلع؛ وحيلة إسقاط يمين الطلاق بالخلع باطلة عند الحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7766} ابن المنذر يشترط وقوع الشقاق منهما، وأجاب الطبري بأن المخافة تنسب إليهما لأن بغض الزوجة يقتضي بغضه، ولم يستفسر النبي ثابتا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7766}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7767} المالكية يردون المال إذا خالعته درءا لضرره، ولو أسقطت البينة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7767} جواز أخذ العوض: المالكية والشافعية يجيزون أخذ الزوج عوضا مساويا أو أقل أو أكثر إذا تراضيا، ومن الزوجة أو غيرها؛ والحنابلة يرون أن الأكثر مكروه أو محرم إن عضلها لتفتدي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7767} الحنفية: إن كان النشوز من الزوج كره له أن يأخذ شيئا؛ وإن كان من المرأة لا يكره، وقال القدوري إن كان النشوز منها كره الزيادة، وجاز في القضاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7767}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7768} جواز الخلع بحاكم وبلا حاكم: جمهور الفقهاء يجيزونه بلا حاكم، وفيه أثر عمر في إجازة خلع؛ والحسن البصري يرى أنه لا يجوز إلا بالسلطان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7768} وقت الخلع: الشافعية والحنابلة يجيزونه في الحيض والطهر الذي أصابها فيه، لأن ضرر سوء العشرة أعظم من تطويل العدة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7768} الأركان عند غير الحنفية خمسة: الموجب (الزوج أو وليه)، والقابل (المتزم للعوض)، والمعوض (الاستمتاع)، والعوض، والصيغة؛ والحنفية ركنان: الإيجاب والقبول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7768}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7769} الموجب: يشترط أن يملك الطلاق؛ والمالكية والشافعية والحنابلة يجيزون خلع المحجور عليه لسفه أو فلس أو رق، وعند الحنابلة الصبي المميز في وجه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7769} القابل: يشترط أن يكون مطلق التصرف؛ وخلع الصغيرة على مهرها يقع الطلاق بلا بدل عند الحنفية والشافعية في وجه؛ والمحجور عليها لسفه أو صغر أو جنون لا يصح خلعها عند الحنابلة، والمحجورة لفلس يصح خلعها في الذمة لا بالمعين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7770} الخلع في مرض الموت: الزوجة المريضة مرضا مخوفا تخالع باتفاق في الجملة، وخلافهم في القدر الذي يأخذه الزوج؛ والحنفية يعتبرون ما يأخذه الزوج من الثلث، والشافعية يرون الزيادة على مهر المثل كالوصية، والحنابلة يجعلون للزوج الأقل من المسمى أو ميراثه، والمالكية يوقفون المال إلى الموت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7770}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7771}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7771}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7772} الزوج المريض: خلعه نافذ بالمسمى؛ ولا توارث بينهما عند الجمهور، والمالكية يورثون المطلقة في المرض إن مات في مرضه المخوف، وعلى هذا الخلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7772}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7773} خلع الولي: المالكية يجيزون للولي خلع الصغير والمجنون لمصلحة؛ والشافعية والحنفية والحنابلة يرون أن الأب لا يخلع زوجة ابنه الصغير، وفي رواية أحمد أن الأب يملك ذلك كالحاكم؛ وعند الحنفية والشافعية والحنابلة لا يصح خلع الأب عن ابنته الصغيرة من مالها؛ والمالكية يجيزون خلع المجبر عن المجبرة من مالها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7772}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7773}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7773}'
  en: 'Khul\'' is lexically drawing off or stripping; for the Hanafis it is taking money from the wife in return for the marriage bond, by the word khul\''; for the majority it is separation for a consideration due by the wife, by the word talaq or khul\''. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7758}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7759} It is near to reconciliation (sulh, ending a quarrel), to divorce (lifting the marriage tie), to ransom (fidya, the sum paid to be free), to mubara\''a (another name for it, in which the wife drops her claims on the husband), and to annulment (faskh, dissolving the contract). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7759}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7760} Is khul\'' divorce or annulment? The Hanafis in the chosen view, the Malikis, the Shafiis in the new view and the Hanbalis in one report hold it divorce; the Shafii in the old view and the Hanbalis in the best-known report hold it annulment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7760}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7761} Those who call it divorce say it is a final single divorce, and if the husband intends more, more falls, by the Malikis, Shafiis, Hanbalis and Zufar; the Hanafis count three if he intends three. Those who call it annulment cite the verse on two divorces then the khul\'', then the divorce after it, and the report of the wife of Thabit ibn Qays who was told to wait one menstrual period. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7761}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7762} Results of the two views: one who has khul\''ed twice and marries her again is free to do so on the annulment view; the Hanafis and Malikis treat khul\'' as an exchange on the wife\''s side and an oath on the husband\''s, the Malikis, Shafiis and Hanbalis as an exchange on both sides. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7763} Ruling: khul\'' is lawful in general; the Hanbalis divide it into three: lawful when the wife hates the marriage and fears she cannot keep its duties, when the husband is encouraged to accept; disliked without cause while the marriage is sound; forbidden when the wife is harmed to make her pay. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7764}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7765} The Hanbalis divide khul\'' into three: lawful when the wife hates the marriage and fears she cannot keep its duties, and the husband is encouraged to accept; disliked without cause while the marriage is sound, with two views on its validity; forbidden when the husband wrongfully withholds so she pays to be free, in which case the divorce is revocable and he takes no consideration. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7766} A khul\'' by other words than divorce: if it is a divorce, its rule applies; if not, the marriage stands. Beating the wife rightly for rebellion or neglect of duty does not forbid khul\''; withholding to make her pay for adultery is lawful; beating her wrongly, without seeking money, still permits khul\''; using khul\'' to void an oath of divorce is invalid for the Hanbalis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7766} Ibn al-Mundhir requires that both parties be in conflict, and al-Tabari answers that the fear is attributed to both since the wife\''s dislike implies his; the Prophet did not question Thabit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7766}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7767} The Malikis return the consideration if the wife paid to escape his harm, even if she dropped the witness. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7767} Taking a consideration: the Malikis and Shafiis allow the husband to take an equal, lesser or greater sum by agreement, from the wife or another; the Hanbalis hold that more than the dowry is disliked, forbidden if he withholds her to make her pay. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7767} Hanafis: if the rebellion is the husband\''s he should take nothing; if the wife\''s, he may; al-Qaduri says if it is hers he may not take more than he gave, though a court would enforce it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7767}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7768} Khul\'' without a judge: most jurists allow it, on the report of a case judged by Umar; al-Hasan al-Basri holds it requires the ruler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7768} Time: the Shafiis and Hanbalis allow it in menstruation and in the purity in which he had intercourse, since the harm of a long waiting period is less than that of ill treatment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7768} Pillars: five by non-Hanafis (the one who offers, the one who accepts the obligation, the thing for which, the consideration and the wording); two by the Hanafis (offer and acceptance). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7768}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7769} The one who offers must have power to divorce; the Malikis, Shafiis and Hanbalis allow a husband under restraint for debt, folly or servitude to khul\''; the Hanbalis allow a discerning boy in one view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7769} The one who accepts must be fully competent; khul\'' for a child on her dowry is a divorce without consideration by the Hanafis and a Shafii view; a wife under restraint for folly, minority or madness cannot khul\'' by Hanbali law, while one under restraint for debt may do so on a sum owed, not on a specific asset. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7770} During fatal illness: a wife in fatal illness may khul\'' by agreement; the Hanafis count what the husband takes against the third; the Shafiis treat excess over the dower as a bequest; the Hanbalis allow the husband the lesser of the sum or his share of inheritance; the Malikis hold the sum until death. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7770}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7771}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7771}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7772} A husband in fatal illness may khul\'' with effect for the agreed sum; there is no inheritance between them by most jurists, while the Malikis have the divorced wife inherit from him if he dies of that illness. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7772}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7773} A guardian: the Malikis allow a guardian to khul\'' for a minor boy or a madman if it serves; the Hanafis, Shafiis and Hanbalis forbid a father to khul\'' a minor son\''s wife, while one Hanbali view lets the father act like the judge; a father may not khul\'' his young daughter on her property by the Hanafis, Shafiis and most Hanbalis, while the Malikis allow a compelling guardian to do so. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7772}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7773}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7773}'
  ur: 'خلع لغت میں اتارنا اور نکالنا ہے؛ حنفیہ کے نزدیک بیوی سے نکاح کے بدلے مال لینا لفظ خلع کے ساتھ، جمہور کے نزدیک بیوی کے عوض دینے پر لفظ طلاق یا خلع کے ساتھ جدائی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7758}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7759} یہ صلح (جھگڑے کا خاتمہ)، طلاق (نکاح کے بندھن کو کھولنا)، فدیہ (چھٹکارے کے لیے دیا جانے والا مال)، مبارأۃ (خلع کا دوسرا نام جس میں بیوی شوہر پر اپنے حق چھوڑتی ہے) اور فسخ (عقد کو ختم کرنا) سے متعلق ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7759}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7760} خلع طلاق ہے یا فسخ: حنفیہ کے مفتیٰ بہ قول، مالکیہ، شافعیہ کے جدید اور حنابلہ کی ایک روایت کے مطابق طلاق؛ شافعیہ کے قدیم قول اور حنابلہ کی مشہور روایت کے مطابق فسخ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7760}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7761} طلاق کے قائلین کے نزدیک ایک بائن طلاق واقع ہوتی ہے، شوہر زیادہ کی نیت کرے تو مالکیہ، شافعیہ، حنابلہ اور زفر کے نزدیک وہی واقع ہوتا ہے، حنفیہ تین کی نیت پر تین مانتے ہیں؛ فسخ کے قائلین آیت «الطلاق مرتان» اور ثابت بن قیس کی بیوی کی حدیث (ایک حیض عدت) سے استدلال کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7761}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7762} دونوں قولوں کے نتائج: فسخ کے قول پر دو بار خلع کے بعد اسی سے دوبارہ نکاح جائز ہے؛ حنفیہ اور مالکیہ خلع کو عورت کی طرف سے معاوضہ اور شوہر کی طرف سے قسم سمجھتے ہیں، مالکیہ، شافعیہ اور حنابلہ دونوں جانب سے معاوضہ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7763} حکم: جمہور کے نزدیک بعض صورتوں میں جائز ہے؛ حنابلہ اس کی تین قسمیں کرتے ہیں: مباح جب بیوی شوہر سے نفرت کرے اور حقوق ادا نہ کر سکنے کا خوف ہو، شوہر کے لیے قبول کرنا مستحب ہے؛ مکروہ بغیر سبب کے جب حال درست ہو؛ حرام اگر بیوی کو تکلیف دی جائے تاکہ وہ مال دے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7764}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7765} حنابلہ خلع کی تین قسمیں کرتے ہیں: مباح جب بیوی شوہر سے نفرت کرے اور حق ادا نہ کر سکنے کا خوف ہو، شوہر کے لیے قبول کرنا مستحب ہے؛ مکروہ بغیر سبب کے جب حال درست ہو، اس کے نفاذ میں دو قول ہیں؛ حرام اگر شوہر ظلم سے روک کر بیوی کو مال دینے پر مجبور کرے، اس صورت میں طلاق رجعی ہوگی اور شوہر عوض کا حقدار نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7766} خلع طلاق کے لفظ کے بغیر: اگر وہ طلاق ہو تو اس کا حکم لاگو ہوگا، ورنہ نکاح باقی ہے؛ نشوز یا فرض ترک کرنے پر حق کے ساتھ مارنا خلع سے منع نہیں کرتا؛ زنا کے سبب روکنا بھی جائز ہے؛ ظلماً مارنا مگر مال لینا مقصود نہ ہو تو خلع درست ہے؛ طلاق کی قسم توڑنے کے لیے خلع کی حیلہ سازی حنابلہ کے نزدیک باطل ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7766} ابن المنذر شقاق دونوں طرف سے شرط کہتے ہیں، طبری جواب دیتے ہیں کہ خوف دونوں کی طرف منسوب ہے کیونکہ بیوی کی نفرت شوہر کی نفرت کا سبب ہے؛ نبی نے ثابت سے پوچھا تک نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7766}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7767} مالکیہ اگر بیوی نے نقصان سے بچنے کے لیے خلع کیا تو مال واپس کرتے ہیں، اگرچہ گواہ ساقط کرے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7767} عوض لینا: مالکیہ اور شافعیہ رضامندی سے برابر، کم یا زیادہ لینا جائز کہتے ہیں، بیوی یا کسی اور سے؛ حنابلہ مہر سے زیادہ لینا مکروہ کہتے ہیں اور روکنے کی صورت میں حرام۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7767} حنفیہ: نشوز شوہر کی طرف سے ہو تو کچھ نہ لے؛ بیوی کی طرف سے ہو تو لے سکتا ہے؛ قدوری کے نزدیک بیوی کی طرف سے زیادتی مکروہ مگر قضا میں نافذ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7767}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7768} حاکم کے بغیر خلع: جمہور جائز کہتے ہیں، عمر کے ایک فیصلے سے استدلال؛ حسن بصری حاکم کے بغیر ناجائز کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7768} وقت: شافعیہ اور حنابلہ حیض اور جس طہر میں جماع ہوا ہو دونوں میں جائز کہتے ہیں، کیونکہ عدت طویل ہونے کا نقصان بدسلوکی کے نقصان سے کم ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7768} ارکان: غیر حنفیہ کے نزدیک پانچ (موجب، قابل، معوض، عوض، صیغہ)؛ حنفیہ کے نزدیک دو (ایجاب و قبول)۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7768}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7769} موجب کو طلاق کا اختیار ہونا شرط ہے؛ مالکیہ، شافعیہ اور حنابلہ قرض، فضول خرچی یا غلامی کی بنا پر پابندی والے شوہر کا خلع جائز کہتے ہیں؛ حنابلہ ایک قول میں سمجھدار بچے کا بھی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7769} قابل کا مطلق تصرف کا اہل ہونا شرط ہے؛ نابالغہ کا مہر پر خلع حنفیہ اور شافعیہ کے ایک قول کے مطابق بغیر بدل کے طلاق ہے؛ حنابلہ کے نزدیک سفیہ، نابالغ یا مجنون عورت کا خلع باطل، اور مقروض کا خلع ذمہ کے مال پر صحیح ہے، معین مال پر نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7770} مرض الموت میں خلع: مرض الموت میں مبتلا بیوی کا خلع باتفاق جائز ہے؛ حنفیہ شوہر کا لیا ہوا مال ثلث سے شمار کرتے ہیں، شافعیہ مہر مثل سے زیادہ کو وصیت، حنابلہ شوہر کو کم از کم میں سے اس کا حصہ دیتے ہیں، مالکیہ موت تک مال روکتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7770}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7771}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7771}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7772} شوہر مرض الموت میں ہو تو خلع معاہدہ کے مطابق نافذ؛ جمہور کے نزدیک آپس میں توارث نہیں، مالکیہ کے نزدیک مطلقہ مرض کی حالت میں مرے تو وہ وارث ہوگی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7772}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7773} ولی: مالکیہ مصلحت سے چھوٹے بچے یا مجنون کی طرف سے ولی کو خلع کی اجازت دیتے ہیں؛ حنفیہ، شافعیہ اور حنابلہ باپ کو بیٹے کی بیوی کا خلع کرنے سے منع کرتے ہیں، حنابلہ کی ایک روایت میں باپ حاکم کی طرح اختیار رکھتا ہے؛ باپ اپنی کم سن بیٹی کا اس کے مال سے خلع نہیں کر سکتا (حنفیہ، شافعیہ، جمہور حنابلہ)، مالکیہ مجبِر کو اجازت دیتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7772}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7773}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7773}'
