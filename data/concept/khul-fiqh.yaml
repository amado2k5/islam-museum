id: concept/khul-fiqh
class: concept
kind: legal
label:
  ar: الخلع
  en: Khul' (divorce by payment from the wife)
  ur: خلع
summary:
  ar: 'الخلع يؤول إلى معنى بذل المرأة العوض على طلاقها، وألفاظه عند الشافعية والحنابلة صريح وكناية: فالصريح لفظ خلع ومشتقاته، ولفظ المفاداة لوروده في القرآن، وزاد الحنابلة لفظ الفسخ لأنه حقيقة فيه؛ والكناية كبارأتك وأبنتك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7782} اختلاف الزوجين: إذا ادعى الزوج الخلع فأنكرت بانت بإقراره، والمال يبقى دعواه والقول قولها بيمينها عند المالكية والشافعية والحنابلة؛ وإذا ادعت هي الخلع فأنكره لم يقع. واتفقا على الخلع واختلفا في قدر العوض أو جنسه أو حلوله فالقول قولها عند الحنفية والمالكية، وفي رواية للحنابلة قول الزوج لأن البضع يخرج من ملكه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7782}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7783} الشافعية إذا تعارضت البينتان يتحالفان كالمتبايعين، ويجب مهر المثل إذا فات العوض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7783}'
  en: 'Khul\'' tends to mean the wife giving a consideration for her divorce; its wording for the Shafiis and Hanbalis is explicit or allusive: the explicit words are khul\'' and its derivatives, and the word for ransom, from its use in the Quran; the Hanbalis add faskh, which is literal for it; allusive words include "I have cleared you" and "I have divorced you". {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7782} Disputes: if the husband says khul\'' and the wife denies, the separation stands by his admission, the consideration remains disputed and her word is accepted with an oath by the Malikis, Shafiis and Hanbalis; if she claims khul\'' and he denies, it does not take effect. If they agree on khul\'' and dispute the sum, the kind, the due date or the form, her word is preferred by the Hanafis and Malikis, while one Hanbali report prefers the husband, since the marriage goes out of his right. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7782}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7783} Shafii: when two proofs conflict, the parties swear as in sale, and the wife owes the dower of the like if the consideration fails. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7783}'
  ur: 'خلع کا مفہوم بیوی کا طلاق کے عوض مال دینا ہے؛ شافعیہ اور حنابلہ کے نزدیک الفاظ صریح اور کنایہ ہیں: صریح لفظ خلع اور اس کے مشتقات، اور لفظ مفاداۃ جو قرآن میں آیا، حنابلہ اس کے ساتھ فسخ کو بھی صریح کہتے ہیں؛ کنایہ میں «بارأتك» اور «أبنتك»۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7782} اختلاف: شوہر خلع کا دعویٰ کرے اور بیوی انکار کرے تو اس کے اقرار سے جدائی ہو جاتی ہے، مال کا دعویٰ باقی اور بیوی کا قول قسم کے ساتھ مالکیہ، شافعیہ اور حنابلہ کے نزدیک معتبر؛ بیوی خلع کا دعویٰ کرے اور شوہر انکار کرے تو واقع نہیں ہوتا۔ دونوں خلع پر متفق ہوں اور مقدار، جنس یا ادائیگی میں اختلاف ہو تو حنفیہ اور مالکیہ کے نزدیک بیوی کا قول، حنابلہ کی ایک روایت میں شوہر کا قول کیونکہ بضع اس کی ملکیت سے نکلتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7782}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7783} شافعیہ دو گواہیاں متعارض ہوں تو بیع کی طرح دونوں قسم کھائیں گے، اور عوض ناکام ہو تو مہرِ مثل لازم۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7783}'
