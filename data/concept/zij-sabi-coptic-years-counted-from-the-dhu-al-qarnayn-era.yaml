label: { ar: "سنو القبط محسوبة من سني ذي القرنين", en: "Coptic years counted from the years of Dhu al-Qarnayn", ur: "قبطی سال ذو القرنین کے سالوں سے شمار", es: "Los años coptos se cuentan a partir de los años de Dhu al-Qarnayn.", fr: "Les années coptes étaient comptées à partir des années de Dhu al-Qarnayn", tr: "Koptik takvimi, Zülkarneyn takviminden hesaplanır.", id: "Kalender Koptik dihitung dari kalender Dzul-Qarnayn." }
summary:
  ar: "يحوّل البتاني التاريخ القبطي من سني ذي القرنين: يُنقص من السنين التامة مائتين وسبعة وثمانين، ويُقسم الباقي على الأرباع، فإذا وقع كسر ولم يكن سباط فالسنة كبيسة، وتُحسب الأيام من توت. {cite:zij-sabi-nallino-byblion p.103}."
  en: "Al-Battani converts a Coptic date from the years of Dhu al-Qarnayn: he subtracts 287 from the completed years, divides what remains by four for the quarter days, and when a fraction occurs and it is not the leap month the year is taken as leap, and the days are counted from Tut. {cite:zij-sabi-nallino-byblion p.103}."
  ur: "البتانی قبطی تاریخ ذو القرنین کے سالوں سے بدلتے ہیں: مکمل سالوں میں سے 287 گھٹاتے ہیں، باقی کو چوتھائی دنوں کے لیے چار پر تقسیم کرتے ہیں، اور جب کسر آئے اور شباط نہ ہو تو سال کبیسہ شمار ہوتا ہے، اور دن توت سے گنے جاتے ہیں۔ {cite:zij-sabi-nallino-byblion p.103}۔"
  es: "Al-Battani convierte una fecha copta de los años de Dhu al-Qarnayn: resta 287 de los años completos, divide lo que queda por cuatro para los días de los cuartos, y cuando aparece una fracción y no es el mes bisiesto, el año se toma como bisiesto y los días se cuentan desde Tut. {cite:zij-sabi-nallino-byblion p.103}."
  fr: "Al-Battani convertit une date copte des années de Dhu al-Qarnayn: il soustrait 287 aux années complètes, divise ce qui reste par quatre pour les quarts de jours, et lorsqu'une fraction apparaît et qu'il ne s'agit pas du mois intercalaire, l'année est considérée comme intercalaire et les jours sont comptés à partir de Tut. {cite:zij-sabi-nallino-byblion p.103}."
  tr: "El-Battani, Kıpti takvimini Zülkarneyn yıllarından dönüştürür: tam yıllardan iki yüz seksen yedi çıkarır ve kalanı çeyreklere böler. Eğer bir kesir oluşursa ve artık yıl yoksa, o yıl artık yıldır ve günler Tevrat'tan itibaren sayılır. {cite:zij-sabi-nallino-byblion s.103}."
  id: "Al-Battani mengkonversi kalender Koptik dari tahun Dzul-Qarnayn: ia mengurangi dua ratus delapan puluh tujuh dari tahun penuh, dan membagi sisanya menjadi seperempat. Jika terjadi pecahan dan tidak ada tahun kabisat, maka tahun tersebut adalah tahun kabisat, dan hari-hari dihitung dari Thout. {cite:zij-sabi-nallino-byblion p.103}."
