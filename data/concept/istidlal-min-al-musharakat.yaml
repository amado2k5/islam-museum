id: concept/istidlal-min-al-musharakat
class: concept
kind: scientific
label:
  ar: "الاستدلال من المشاركات لأعضاء يشاركها الدماغ"
  en: "Inference from the sharing of organs with the brain"
  ur: "دماغ کے شریک اعضا کی مشارکت سے استدلال"
  es: "Inferencia a partir del hecho de que comparten órganos con el cerebro."
summary:
  ar: "يبين ابن سينا أن قوة الأعضاء المشاركة تدل على قوة الدماغ، وأن آفات الدماغ تظهر في أعضاء أخرى كالبول والبراز والبلع والنفس، وأن الوجع إذا بلغ أصول العينين في الصداع دل على أن السبب خارج القحف {cite:canon-ibn-sina-print-v2 pp.21-22}"
  en: "Ibn Sina shows that the strength of the sharing organs indicates the strength of the brain, that afflictions of the brain show in other organs such as urine, stool, swallowing and breath, and that when pain in headache reaches the roots of the eyes the cause is outside the skull {cite:canon-ibn-sina-print-v2 pp.21-22}"
  ur: "ابن سینا بتاتا ہے کہ شریک اعضا کی قوت دماغ کی قوت پر دلالت کرتی ہے، دماغ کی آفتیں دوسرے اعضا میں ظاہر ہوتی ہیں جیسے پیشاب، پاخانہ، نگلنا اور سانس، اور سردرد میں جب درد آنکھوں کی جڑوں تک پہنچ جائے تو سبب کھوپڑی کے باہر ہے {cite:canon-ibn-sina-print-v2 pp.21-22}۔"
  es: "Ibn Sina demuestra que la fortaleza de los órganos que comparten indica la fortaleza del cerebro, que las aflicciones del cerebro se manifiestan en otros órganos como la orina, las heces, la deglución y la respiración, y que cuando el dolor de cabeza llega hasta las raíces de los ojos, la causa está fuera del cráneo {cite:canon-ibn-sina-print-v2 pp.21-22}"
