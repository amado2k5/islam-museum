summary:
  ar: "التطير التشاؤم بالطير ونحوه، وقد أبطله الإسلام. ومن اعتقد أن ما شاهده موجب لما ظنه فقد كفر، ومن وجد في نفسه خوفاً وتوكل على الله فلا يضره. والفأل الحسن جائز، وحسن الظن بالله مأمور به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5346} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5347} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5348}"
  en: "Tatayyur is taking an omen of ill luck from a bird or the like, which Islam abolished. Whoever believes the sight causes the outcome has committed unbelief; whoever feels dread but trusts God is not harmed. A good omen is lawful, and good opinion of God is commanded. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5346} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5347} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5348}"
