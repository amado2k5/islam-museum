id: concept/tatayyur-omens
class: concept
sensitivity: polemical
kind: legal
label:
  ar: "التطير"
  en: "Tatayyur (taking omens of ill luck)"
  ur: "تطیّر ⁦(بدشگونی)⁩"
  es: "Tatayyur (tomando presagios de mala suerte)"
  fr: "Tatayyur (interpréter les présages de malheur)"
  tr: "uçan"
  id: "terbang"
summary:
  ar: "التطير التشاؤم بالطير ونحوه، وقد أبطله الإسلام. ومن اعتقد أن ما شاهده موجب لما ظنه فقد كفر، ومن وجد في نفسه خوفاً وتوكل على الله فلا يضره. والفأل الحسن جائز، وحسن الظن بالله مأمور به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5346} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5347} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5348}"
  en: "Tatayyur is taking an omen of ill luck from a bird or the like, which Islam abolished. Whoever believes the sight causes the outcome has committed unbelief; whoever feels dread but trusts God is not harmed. A good omen is lawful, and good opinion of God is commanded. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5346} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5347} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5348}"
  es: "Tatayyur es tomar un presagio de mala suerte de un ave o similar, práctica que el Islam abolió. Quien cree que la visión determina el resultado ha cometido incredulidad; quien siente temor pero confía en Dios no sufre daño. Un buen presagio es lícito, y tener una buena opinión de Dios es un mandato. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5346} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5347} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5348}"
  fr: "L'interprétation des présages de malheur, tels que la vision d'un oiseau, est abolie par l'Islam. Quiconque croit que la vision détermine le résultat commet l'incroyance; celui qui éprouve de la crainte mais s'en remet à Dieu n'en subit aucun préjudice. Un bon présage est licite, et avoir une bonne opinion de Dieu est un commandement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5346} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5347} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5348}"
  ur: "تاتایور کسی پرندے یا اس جیسی بد نصیبی کا شگون لے رہا ہے جسے اسلام نے ختم کر دیا ہے۔ جس نے نظر کو نتیجہ قرار دیا اس نے کفر کیا۔ جو خوف محسوس کرتا ہے لیکن خدا پر بھروسہ کرتا ہے اسے کوئی نقصان نہیں پہنچا۔ نیک شگون حلال ہے اور خدا کے بارے میں اچھی رائے کا حکم ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5346} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 5347}"
  tr: "İslam'ın geçersiz kıldığı sahte suçlamalar, kuşlar hakkında kötümserlik ve benzeri. Gördüğünün inançsızlık olduğunu düşündüğünü doğruladığına inanan, kendisinde korku ve Allah'a güvenen ona zarar vermez. İyi alametler kabul edilir ve Allah'tan iyi beklentiler emredilmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5346} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5347} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.5348}"
  id: "Tuduhan palsu, pesimisme tentang burung, dan sejenisnya, yang telah dibatalkan oleh Islam. Siapa pun yang percaya bahwa apa yang dilihatnya mengonfirmasi apa yang dia kira adalah ketidakpercayaan, dan siapa pun yang merasa takut dan bergantung pada Tuhan tidak menyakitinya. Pertanda baik diperbolehkan, dan harapan baik kepada Tuhan diperintahkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5346} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5347} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.5348}"
