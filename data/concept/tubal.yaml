summary:
  ar: "توبال في الكتاب أقواه توبال الحديد وهو ما يتساقط من الطرق عليه، وجميعه مجفف، ويقول الكتاب إنه قيل فيه أيضا، ثم يختم بنهايته الكلام من حرف التاء ويذكر أن جملة أدويته تسعة عشر {cite:canon-ibn-sina-print-v1 p.695}"
  en: "Tubal is in the book strongest as the tubal of iron, which is what falls off under hammering, and all of it is drying; the book says that more was also said of it, and with it the letter ta closes, the book stating that its drugs come to nineteen {cite:canon-ibn-sina-print-v1 p.695}"
  ur: "توبال کتاب میں سب سے قوی لوہے کا توبال ہے جو ہتھوڑے کی ضربوں سے جھڑتا ہے، اور سب خشک کرنے والا ہے؛ کتاب کہتی ہے کہ اس کے بارے میں اور بھی کہا گیا، اور اسی پر حرف تا ختم ہوتا ہے اور کتاب بتاتی ہے کہ اس کی دواؤں کا مجموعہ انیس ہے {cite:canon-ibn-sina-print-v1 p.695}۔"
