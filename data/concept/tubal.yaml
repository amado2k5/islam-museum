summary:
  ar: "توبال في الكتاب أقواه توبال الحديد وهو ما يتساقط من الطرق عليه، وجميعه مجفف، ويقول الكتاب إنه قيل فيه أيضا، ثم يختم بنهايته الكلام من حرف التاء ويذكر أن جملة أدويته تسعة عشر {cite:canon-ibn-sina-print-v1 p.695}"
  en: "Tubal is in the book strongest as the tubal of iron, which is what falls off under hammering, and all of it is drying; the book says that more was also said of it, and with it the letter ta closes, the book stating that its drugs come to nineteen {cite:canon-ibn-sina-print-v1 p.695}"
  ur: "توبال کتاب میں سب سے قوی لوہے کا توبال ہے جو ہتھوڑے کی ضربوں سے جھڑتا ہے، اور سب خشک کرنے والا ہے؛ کتاب کہتی ہے کہ اس کے بارے میں اور بھی کہا گیا، اور اسی پر حرف تا ختم ہوتا ہے اور کتاب بتاتی ہے کہ اس کی دواؤں کا مجموعہ انیس ہے {cite:canon-ibn-sina-print-v1 p.695}۔"
  es: "En el libro, Tubal es tan fuerte como la tubal de hierro, que es lo que se desprende al martillarla, y todo se está secando; el libro dice que también se dijo más de ella, y con ella se cierra la carta ta, el libro afirma que sus efectos llegan a diecinueve {cite:canon-ibn-sina-print-v1 p.695}"
  fr: "Le tubal est décrit dans le livre comme étant le plus puissant sous forme de tubal de fer, qui se détache sous le martelage, et tout est en train de sécher; le livre dit qu'on en a également parlé davantage, et c'est ainsi que se termine la lettre ta, le livre indiquant que ses médicaments arrivent à dix-neuf {cite:canon-ibn-sina-print-v1 p.695}"
  tr: "Kitaptaki topal, üzerindeki çekiçlerden düşen en güçlü demir tubal formudur ve hepsi kurutulmuştur. Kitapta bunun hakkında da söylendiği belirtilir, ardından 't' harfiyle bitirir ve toplam ilaç sayısının on dokuz olduğunu belirtir {cite:canon-ibn-sina-print-v1 s.695}"
  id: "Topal dalam buku ini adalah bentuk tubal besi terkuat, yang jatuh dari palu di atasnya, semuanya dikeringkan. Buku itu juga mengatakan tentang itu, lalu diakhiri dengan huruf 't' dan menyebutkan bahwa jumlah total obatnya adalah sembilan belas {cite:canon-ibn-sina-print-v1 hlm.695}"
