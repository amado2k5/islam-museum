label: { ar: "ابن السبيل", en: "Wayfarer (ibn al-sabil)", es: "El caminante (ibn al-sabil)", fr: "Voyageur (Ibn al-Sabil)", ur: "راہگیر ⁦(ابن السبیل)⁩", tr: "Yolcu", id: "Wayfarer" }
summary:
  ar: "تعرّف الموسوعة الفقهية الكويتية السبيل بأنه الطريق، وابن السبيل بأنه المسافر الذي انقطع به الطريق. وأوسع ما قيل في تعريفه الاصطلاحي أنه المنقطع عن ماله، سواء كان خارج وطنه أو بوطنه أو مارّاً به، وزاد بعضهم قيوداً ترجع إلى شروط اعتباره مصرفاً من مصارف الزكاة. واتفق الفقهاء على أنه إذا أراد الرجوع إلى بلده ولم يجد ما يتبلغ به أُعطي من الزكاة والغنيمة والفيء بقدر حاجته، ولا يحل له ما زاد. وفي الاستقراض: الحنفية يرونه الأولى إن تيسر، والمالكية يوجبونه إذا لم يكن فقيراً في بلده، والحنابلة والشافعية في المعتمد لا يوجبونه ولا يرونه أولى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1463} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1464}"
  en: "The Kuwaiti encyclopedia defines sabil as the road, and ibn al-sabil as the traveller whose road has been cut off. The widest technical definition is one who is cut off from his property, whether he is outside his country, in it, or passing through it; some jurists add conditions tied to his eligibility as a recipient of zakat. The jurists agree that when a wayfarer wants to return to his home and has nothing to live on, he is given from zakat, booty and fay' according to his need, and nothing beyond that is lawful to him. On borrowing, the Hanafis regard it as preferable where it is possible; the Malikis make it obligatory if he is not poor in his own land; the Hanbalis and the Shafi'is, according to the accepted view, neither oblige it nor regard it as preferable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1463} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1464}"
  es: "La enciclopedia kuwaití define sabil como el camino, e ibn al-sabil como el viajero cuyo camino ha sido interrumpido. La definición técnica más amplia es la de aquel que se encuentra separado de sus bienes, ya sea que esté fuera de su país, dentro de él o de paso; algunos juristas añaden condiciones vinculadas a su elegibilidad para recibir zakat. Los juristas coinciden en que cuando un viajero desea regresar a su hogar y no tiene con qué subsistir, se le da de zakat, botín y fay' según su necesidad, y nada más allá de eso le es lícito. En cuanto a los préstamos, los hanafíes los consideran preferibles cuando es posible; los malikíes los hacen obligatorios si no es pobre en su propia tierra; los hanbalíes y los shafiíes, según la opinión aceptada, ni lo obligan ni lo consideran preferible. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1463} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1464}"
  fr: "L'encyclopédie koweïtienne définit « sabil » comme la route, et « ibn al-sabil » comme le voyageur dont la route est coupée. La définition technique la plus large désigne celui qui est privé de ses biens, qu'il soit hors de son pays, à l'intérieur de celui-ci ou de passage; certains juristes ajoutent des conditions liées à son éligibilité à la zakat. Les juristes s'accordent à dire que lorsqu'un voyageur souhaite rentrer chez lui et n'a aucun moyen de subsistance, il reçoit de la zakat, du butin et du fay' selon ses besoins, et rien de plus ne lui est licite. Concernant l'emprunt, les hanafites le recommandent lorsque cela est possible; les malikites le rendent obligatoire s'il n'est pas pauvre dans son propre pays; les hanbalites et les chaféites, selon l'avis généralement admis, ne l'imposent pas et ne le recommandent pas non plus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1463} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1464}"
  ur: "کویتی انسائیکلوپیڈیا نے سبیل کو سڑک اور ابن السبیل کو وہ مسافر قرار دیا ہے جس کی سڑک منقطع ہو گئی ہے۔ وسیع ترین تکنیکی تعریف وہ ہے جو اپنی جائیداد سے کاٹ دیا گیا ہو، چاہے وہ اپنے ملک سے باہر ہو، اس میں ہو، یا وہاں سے گزر رہا ہو۔ بعض فقہاء زکوٰۃ کے وصول کنندہ کے طور پر اس کی اہلیت سے منسلک شرائط کا اضافہ کرتے ہیں۔ فقہاء کا اس بات پر اتفاق ہے کہ جب مسافر اپنے گھر لوٹنا چاہے اور اس کے پاس رہنے کے لیے کچھ نہ ہو تو اسے اس کی ضرورت کے مطابق زکوٰۃ، مال غنیمت اور فیہ دیا جاتا ہے اور اس کے علاوہ اس کے لیے کوئی چیز حلال نہیں۔ قرض لینے پر احناف اسے افضل سمجھتے ہیں جہاں ممکن ہو؛ اگر وہ اپنی زمین میں غریب نہ ہو تو مالکی اسے واجب قرار دیتے ہیں۔ حنبلی اور شافعیہ کے نزدیک قبول شدہ قول کے مطابق نہ تو اسے واجب ہے اور نہ ہی اسے افضل سمجھتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1463}"
  tr: "Kuveyt Fıkıh Ansiklopedisi, sabil'i yol, yolcu ise yolu kesilmiş olan yolcu olarak tanımlar. Teknik tanımında en geniş tanım, servetinden koparılan kişidir; ister vatanı dışında, ister memleketinde olsun, ister içinden geçsin, servetinden koparılmış kişidir. Bazıları, bunun zekat masrafı olarak kabul edilme koşullarıyla ilgili kısıtlamalar eklemiştir. Hukukçular, ülkesine dönmek isterse ve ne götürebileceğini bulamazsa, zekat, ganimet ve refahın ihtiyaçlarına göre verildiği ve bunun kendisinin izin vermediği konusunda hemfikirdir. Ödünç alma konusunda: Hanafiler bunu mümkün olduğunca en uygun kabul eder, Malikiler ise ülkesinde fakir değilse bunu zorunlu kılar ve Haneliler ile Şafiiler güvenilir görüşe göre bunu zorunlu kılmazlar veya daha uygun bulmazlar. {atı:fiqh-mawsua-kuveytiyya-noor-v3 s.1463} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1464}"
  id: "Ensiklopedia Yurisprudensi Kuwait mendefinisikan sabil sebagai jalan, dan pengembara sebagai seseorang yang jalurnya terputus. Definisi paling luas dalam definisi teknisnya adalah seseorang yang terputus dari kekayaannya, baik di luar tanah airnya, di tanah airnya, maupun melalui sana. Beberapa telah menambahkan pembatasan terkait syarat untuk menganggapnya sebagai pengeluaran zakat. Para ahli hukum sepakat bahwa jika dia ingin kembali ke negaranya dan tidak menemukan apa yang bisa dia sampaikan, zakat, rampasan, dan kesejahteraan diberikan sesuai kebutuhannya, dan tidak diperbolehkan baginya untuk melakukannya. Mengenai peminjaman: Hanafi menganggapnya paling tepat jika memungkinkan, Malik mewajibkannya jika dia tidak miskin di negaranya, dan Hanbali serta Shafi'i menurut pendapat yang dapat dipercaya tidak mewajibkannya atau menganggapnya lebih tepat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1463} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1464}"
