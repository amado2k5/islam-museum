label: { ar: "ابن السبيل", en: "Wayfarer (ibn al-sabil)" }
summary:
  ar: "تعرّف الموسوعة الفقهية الكويتية السبيل بأنه الطريق، وابن السبيل بأنه المسافر الذي انقطع به الطريق. وأوسع ما قيل في تعريفه الاصطلاحي أنه المنقطع عن ماله، سواء كان خارج وطنه أو بوطنه أو مارّاً به، وزاد بعضهم قيوداً ترجع إلى شروط اعتباره مصرفاً من مصارف الزكاة. واتفق الفقهاء على أنه إذا أراد الرجوع إلى بلده ولم يجد ما يتبلغ به أُعطي من الزكاة والغنيمة والفيء بقدر حاجته، ولا يحل له ما زاد. وفي الاستقراض: الحنفية يرونه الأولى إن تيسر، والمالكية يوجبونه إذا لم يكن فقيراً في بلده، والحنابلة والشافعية في المعتمد لا يوجبونه ولا يرونه أولى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1463} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1464}"
  en: "The Kuwaiti encyclopedia defines sabil as the road, and ibn al-sabil as the traveller whose road has been cut off. The widest technical definition is one who is cut off from his property, whether he is outside his country, in it, or passing through it; some jurists add conditions tied to his eligibility as a recipient of zakat. The jurists agree that when a wayfarer wants to return to his home and has nothing to live on, he is given from zakat, booty and fay' according to his need, and nothing beyond that is lawful to him. On borrowing, the Hanafis regard it as preferable where it is possible; the Malikis make it obligatory if he is not poor in his own land; the Hanbalis and the Shafi'is, according to the accepted view, neither oblige it nor regard it as preferable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1463} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1464}"
