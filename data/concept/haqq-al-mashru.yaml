  en: "The enterprise's own share (haqq al-mashru)"
summary:
  ar: "يخصص قعدات الجزء الباقي من ثمرة الإنتاج لتدعيم مركز المشروع المالي والمادي، لأن الآلات تحتاج إلى التجديد والصيانة باستمرار {cite:qadan-manhaj-iqtisad-quran p. 106}. ومن بنوده: تجديد الآلات وتطويرها، وصيانة العدد والآلات، وتوفير المواد الخام، وتوسيع المشروع، ورصد احتياطي للطوارئ {cite:qadan-manhaj-iqtisad-quran p. 106}، {cite:qadan-manhaj-iqtisad-quran p. 107}، {cite:qadan-manhaj-iqtisad-quran p. 108}. ويحذر من أن تضيع ثمرات الإنتاج في أشياء كمالية لا تنفع {cite:qadan-manhaj-iqtisad-quran p. 107}."
