id: concept/haqq-al-mashru
class: concept
kind: social
tags: [islamic-economy-browser, islamic-economy-money]
label:
  ar: حق المشروع
  en: "The enterprise's own share (haqq al-mashru)"
  es: "La participación propia de la empresa (haqq al-mashru)"
  fr: "La part propre de l'entreprise (haqq al-mashru)"
  ur: "انٹرپرائز کا اپنا حصہ ⁦(حق المشرو)⁩"
  tr: "Projenin hakkı"
  id: "Hak atas proyek"
summary:
  ar: "يخصص قعدات الجزء الباقي من ثمرة الإنتاج لتدعيم مركز المشروع المالي والمادي، لأن الآلات تحتاج إلى التجديد والصيانة باستمرار {cite:qadan-manhaj-iqtisad-quran p. 106}. ومن بنوده: تجديد الآلات وتطويرها، وصيانة العدد والآلات، وتوفير المواد الخام، وتوسيع المشروع، ورصد احتياطي للطوارئ {cite:qadan-manhaj-iqtisad-quran p. 106}، {cite:qadan-manhaj-iqtisad-quran p. 107}، {cite:qadan-manhaj-iqtisad-quran p. 108}. ويحذر من أن تضيع ثمرات الإنتاج في أشياء كمالية لا تنفع {cite:qadan-manhaj-iqtisad-quran p. 107}."
  tr: "Üretim gelirlerinin kalan kısmı projenin mali ve maddi durumunu güçlendirmek için tahsis edilmiştir; çünkü makinelerin sürekli yenilenmesi ve bakımı gerekir {cite:qadan-manhaj-iqtisad-kuran s. 106}. Kalemleri arasında: makinelerin yenilenmesi ve geliştirilmesi, ekipman ve makinelerin bakımı, hammadde temini, projenin genişletilmesi ve acil rezerv izleme {cite:qadan-manhaj-iqtisad-kur'an s. 106}, {cite:qadan-manhaj-iqtisad-kur'an s. 107}, {cite:qadan-manhaj-iqtisad-kur'an s. 108} yer almaktadır. Üretim ürünlerinin gereksiz lükslere boşa harcanmasına karşı uyarıda bulunur {cite:qadan-manhaj-iqtisad-kur'an s. 107}."
  id: "Sisa hasil produksi dialokasikan untuk memperkuat posisi keuangan dan material proyek, karena mesin membutuhkan pembaruan dan pemeliharaan terus-menerus {cite:qadan-manhaj-iqtisad-quran hlm. 106}. Item-itemnya meliputi: pembaruan dan pengembangan mesin, pemeliharaan peralatan dan mesin, penyediaan bahan baku, perluasan proyek, dan pemantauan cadangan darurat {cite:qadan-manhaj-iqtisad-quran hlm. 106}, {cite:qadan-manhaj-iqtisad-quran hlm. 107}, {cite:qadan-manhaj-iqtisad-quran hlm. 108}. Laporan ini memperingatkan agar tidak membuang hasil produksi pada barang mewah yang tidak berguna {cite:qadan-manhaj-iqtisad-quran hlm. 107}."
