label: { ar: "الإنابة", en: "Turning back to God (inaba)", ur: "انابت", es: "Volver a Dios (inaba)", fr: "Se tourner vers Dieu (inaba)", tr: "Vekil", id: "Deputi" }
summary:
  ar: "المنزلة السابعة من منازل السالكين في مدارج السالكين لابن قيم الجوزية، تلي التوبة؛ يقسمها إلى إنابة لربوبية الله يشترك فيها المؤمن والكافر عند الضر، وإنابة أوليائه لإلهيته تتضمن محبته والخضوع له والإقبال عليه والإعراض عما سواه، ويشرح قول الهروي إنها الرجوع إلى الحق إصلاحاً ووفاءً وحالاً."
  en: "The seventh of the wayfarers' stations in Ibn Qayyim al-Jawziyya's Madarij al-Salikin, following repentance. He divides it into a turning to God's lordship, shared by believer and unbeliever in distress, and His friends' turning to His divinity, which comprises loving Him, submitting to Him, approaching Him and turning away from all else; and he explains al-Harawi's definition of it as returning to the Truth in amendment, in faithfulness and in state."
  ur: "ابن قیم الجوزیہ کی مدارج السالکین میں سالکین کی ساتویں منزل، جو توبہ کے بعد آتی ہے۔ وہ اسے دو قسموں میں بانٹتے ہیں: اللہ کی ربوبیت کی طرف رجوع، جس میں مصیبت کے وقت مومن اور کافر شریک ہیں، اور اس کے اولیاء کا اس کی الوہیت کی طرف رجوع، جو اس کی محبت، اس کے سامنے عاجزی، اس کی طرف توجہ اور ماسوا سے اعراض پر مشتمل ہے؛ اور ہروی کی اس تعریف کی شرح کرتے ہیں کہ یہ اصلاح، وفا اور حال کے ذریعے حق کی طرف لوٹنا ہے۔"
  es: "La séptima de las etapas del camino en el Madarij al-Salikin de Ibn Qayyim al-Jawziyya, después del arrepentimiento. La divide en un retorno al señorío de Dios, compartido por creyentes e incrédulos en la aflicción, y el retorno de Sus amigos a Su divinidad, que comprende amarlo, someterse a Él, acercarse a Él y apartarse de todo lo demás; y explica la definición de al-Harawi como el retorno a la Verdad en enmienda, en fidelidad y en estado."
  fr: "La septième étape du cheminement spirituel, selon Ibn Qayyim al-Jawziyya dans son ouvrage Madarij al-Salikin, est celle qui suit le repentir. Il la divise en deux: le retour à la seigneurie de Dieu, partagé par le croyant et l’incroyant dans la détresse; et le retour à la divinité de Ses amis, qui consiste à L’aimer, à se soumettre à Lui, à s’approcher de Lui et à se détourner de tout le reste. Il explique ensuite la définition qu’en donne al-Harawi: un retour à la Vérité dans la conversion, la fidélité et la pleine réalisation."
  tr: "İbn Kayyim al-Jawziyyah'ın Mederic'i el-Salikin'deki arayıcıların mevkileri arasında yedinci durak, tövbe sonrası gelir; bu mevki, hem inananların hem de inanmayanların zor zamanlarda paylaştığı Allah'ın Rabliği'ne teslimiyete bölünür ve müttefiklerinin İlahı'na geri dönmesi, O'nu sevmek, ona boyun eğmek, O'na dönmek ve her şeyden uzaklaşmak anlamına gelir. Al-Harawi'nin bunun reform, sadakat ve şimdiki zaman yoluyla gerçeğe dönüş olduğunu belirten ifadesini açıklar."
  id: "Kedudukan ketujuh di antara para pencari di Madarij al-Salikin oleh Ibn Qayyim al-Jawziyyah, setelah pertobatan; ia membaginya menjadi penyerahan kepada Tuhan di mana baik orang beriman maupun yang tidak beriman berbagi masa kesulitan, dan kembalinya sekutu-sekutunya kepada keilahian-Nya termasuk mencintai-Nya, menyerahkan diri, berbalik kepada-Nya, dan menjauh dari segala hal lain. Ia menjelaskan pernyataan Al-Harawi bahwa ini adalah kembali kepada kebenaran melalui reformasi, kesetiaan, dan masa kini."
