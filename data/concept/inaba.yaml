id: concept/inaba
class: concept
kind: term
label: { ar: "الإنابة", en: "Turning back to God (inaba)", ur: "انابت" }
summary:
  ar: "المنزلة السابعة من منازل السالكين في مدارج السالكين لابن قيم الجوزية، تلي التوبة؛ يقسمها إلى إنابة لربوبية الله يشترك فيها المؤمن والكافر عند الضر، وإنابة أوليائه لإلهيته تتضمن محبته والخضوع له والإقبال عليه والإعراض عما سواه، ويشرح قول الهروي إنها الرجوع إلى الحق إصلاحاً ووفاءً وحالاً."
  en: "The seventh of the wayfarers' stations in Ibn Qayyim al-Jawziyya's Madarij al-Salikin, following repentance. He divides it into a turning to God's lordship, shared by believer and unbeliever in distress, and His friends' turning to His divinity, which comprises loving Him, submitting to Him, approaching Him and turning away from all else; and he explains al-Harawi's definition of it as returning to the Truth in amendment, in faithfulness and in state."
  ur: "ابن قیم الجوزیہ کی مدارج السالکین میں سالکین کی ساتویں منزل، جو توبہ کے بعد آتی ہے۔ وہ اسے دو قسموں میں بانٹتے ہیں: اللہ کی ربوبیت کی طرف رجوع، جس میں مصیبت کے وقت مومن اور کافر شریک ہیں، اور اس کے اولیاء کا اس کی الوہیت کی طرف رجوع، جو اس کی محبت، اس کے سامنے عاجزی، اس کی طرف توجہ اور ماسوا سے اعراض پر مشتمل ہے؛ اور ہروی کی اس تعریف کی شرح کرتے ہیں کہ یہ اصلاح، وفا اور حال کے ذریعے حق کی طرف لوٹنا ہے۔"
