id: concept/ittihad-al-jins-wal-naw
class: concept
kind: legal
label: { ar: "اتحاد الجنس والنوع", en: "Unity of genus and kind (ittihad al-jins wal-naw')" }
summary:
  ar: "الجنس في اللغة الضرب من كل شيء، وهو أعم من النوع، والنوع الصنف وهو أخص من الجنس، والاتحاد امتزاج الشيئين حتى يصيرا شيئاً واحداً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1470} ويختلف الفقهاء في معنى اتحاد الجنس: فهو عند الحنفية اتحاد الاسم الخاص واتحاد المقصود، وعند المالكية استواء المنفعة أو تقاربها، وعند الشافعية أن يجمع البدلين اسم خاص، وعند الحنابلة اشتراك الأنواع في أصل واحد وإن اختلفت المقاصد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1470} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1471} وهو شرط لصحة أداء الواجب في زكاة غير الإبل إذا كان الخارج من جنس النصاب، ويقيّد بعض التصرفات، وفي بيع الربوي بربوي من جنسه يحرم التفاضل ويبطل البيع إن اتحد الجنس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1471}"
  en: "In the language, jins is a kind of any thing and is broader than naw', which is a narrower sort; ittihad is the merging of two things until they become one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1470} The schools differ on what unity of genus means: for the Hanafis it is unity of the specific name and of the purpose; for the Malikis, equal or close benefit; for the Shafi'is, the two items share one specific name; for the Hanbalis, kinds that share one root even when their purposes differ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1470} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1471} Unity of genus is a condition for a valid zakat payment on livestock other than camels when the payment comes from the same genus as the nisab, and it restricts some transactions. In the sale of one ribawi good for another of the same genus, unequal exchange is forbidden and the sale is void. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1471}"
