label: { ar: "اتحاد الجنس والنوع", en: "Unity of genus and kind (ittihad al-jins wal-naw')", es: "Unidad de género y tipo (ittihad al-jins wal-naw')", fr: "Unité de genre et d'espèce (ittihad al-jins wal-naw')", ur: "جنس اور قسم کا اتحاد ⁦(اتحاد الجنۃ والنعوذ)⁩", tr: "Cinsiyet birliği", id: "Persatuan gender" }
summary:
  ar: "الجنس في اللغة الضرب من كل شيء، وهو أعم من النوع، والنوع الصنف وهو أخص من الجنس، والاتحاد امتزاج الشيئين حتى يصيرا شيئاً واحداً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1470} ويختلف الفقهاء في معنى اتحاد الجنس: فهو عند الحنفية اتحاد الاسم الخاص واتحاد المقصود، وعند المالكية استواء المنفعة أو تقاربها، وعند الشافعية أن يجمع البدلين اسم خاص، وعند الحنابلة اشتراك الأنواع في أصل واحد وإن اختلفت المقاصد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1470} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1471} وهو شرط لصحة أداء الواجب في زكاة غير الإبل إذا كان الخارج من جنس النصاب، ويقيّد بعض التصرفات، وفي بيع الربوي بربوي من جنسه يحرم التفاضل ويبطل البيع إن اتحد الجنس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1471}"
  en: "In the language, jins is a kind of any thing and is broader than naw', which is a narrower sort; ittihad is the merging of two things until they become one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1470} The schools differ on what unity of genus means: for the Hanafis it is unity of the specific name and of the purpose; for the Malikis, equal or close benefit; for the Shafi'is, the two items share one specific name; for the Hanbalis, kinds that share one root even when their purposes differ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1470} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1471} Unity of genus is a condition for a valid zakat payment on livestock other than camels when the payment comes from the same genus as the nisab, and it restricts some transactions. In the sale of one ribawi good for another of the same genus, unequal exchange is forbidden and the sale is void. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1471}"
  es: "En el idioma, jins es un tipo de cualquier cosa y es más amplio que naw', que es un tipo más restringido; ittihad es la fusión de dos cosas hasta que se convierten en una. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1470} Las escuelas difieren en lo que significa unidad de género: para los hanafíes es unidad del nombre específico y del propósito; para los malikíes, beneficio igual o cercano; para los shafi'íes, los dos elementos comparten un nombre específico; para los hanbalíes, tipos que comparten una raíz incluso cuando sus propósitos difieren. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1470} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1471} La unidad de género es una condición para un pago válido de zakat sobre ganado distinto de los camellos cuando el pago proviene del mismo género que el nisab, y restringe algunas transacciones. En la venta de un bien ribawi por otro del mismo género, el intercambio desigual está prohibido y la venta es nula. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1471}"
  fr: "Dans la langue, « jins » désigne une catégorie quelconque et est plus large que « naw' », qui est une catégorie plus restreinte; « ittihad » est la fusion de deux choses jusqu'à ce qu'elles n'en fassent plus qu'une. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1470} Les écoles divergent quant à la signification de l'unité de genre: pour les Hanafites, il s'agit de l'unité du nom spécifique et de la finalité; pour les Malikites, d'un bénéfice égal ou similaire; pour les Chafi'ites, les deux éléments partagent un même nom spécifique; pour les Hanbalites, il s'agit de catégories qui partagent une même racine même si leurs finalités diffèrent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1470} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1471} L'unité de genre est une condition de validité du paiement de la zakat sur le bétail autre que les chameaux lorsque le paiement provient du même genre que le nisab, et elle restreint certaines transactions. Lors de la vente d'un bien ribawi contre un autre du même genre, l'échange inégal est interdit et la vente est nulle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1471}"
  ur: "زبان میں، جن کسی بھی چیز کی ایک قسم ہے اور ناؤ سے وسیع ہے، جو کہ ایک تنگ قسم ہے۔ اتحاد دو چیزوں کو ملانا ہے جب تک کہ وہ ایک نہ ہو جائیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1470} مکاتب فکر میں اس بات پر اختلاف ہے کہ نسل کی وحدت کا کیا مطلب ہے: احناف کے نزدیک یہ مخصوص نام اور مقصد کا اتحاد ہے۔ مالکیوں کے لیے، برابر یا قریبی فائدہ؛ شافعیوں کے لیے، دونوں چیزیں ایک مخصوص نام رکھتی ہیں۔ حنبلیوں کے لیے، وہ قسمیں جو ایک ہی جڑ کا اشتراک کرتی ہیں چاہے ان کے مقاصد مختلف ہوں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1470} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1471} اونٹوں کے علاوہ دیگر مویشیوں پر زکوٰۃ کی صحیح ادائیگی کے لیے انواع کا اتحاد شرط ہے جب ادائیگی ایک ہی جنس سے آتی ہے اور اس پر کچھ پابندیاں بھی سخت ہیں۔ ایک ربوی کی فروخت میں ایک ہی نسل کے دوسرے کے لیے اچھا ہے، غیر مساوی تبادلہ حرام ہے اور فروخت باطل ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص1471}"
  tr: "Dilde cins, her şeyin tipidir ve türden daha geniştir; cins ise cinsten daha özgül olan kategoridir. Birlik, iki şeyin karışıp tek bir şey haline gelmesidir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.1470} Hukukçular, cinsin birleşmesinin anlamı konusunda farklı görüşlere sahiptir: Hanefilere göre, bu özel isim ile amaçlanan anlamın birleşimidir; Malikilere göre faydanın eşitliği veya yakınlığıdır; Şafiilere göre iki ikame özel isim olarak birleştirilir; ve Hanbali'ye göre, amaçlar farklı olsa bile tipler tek bir köke sahiptir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.1470} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1471} Bu, develer üzerinde zekat yapmanın geçerliliği için bir koşuldur; eğer hariç tutma nisab türündeyse ve bazı işlemler kısıtlanmışsa. Tefecilik satışında, kendi türünden bir tefeci yasaktır ve aynı tür birleşirse satış geçersiz sayılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1471}"
  id: "Dalam bahasa, genus adalah tipe segala sesuatu yang lebih luas dari tipe, dan genus adalah kategori yang lebih spesifik daripada genus. Kesatuan adalah perpaduan dua hal hingga menjadi satu hal. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1470} Para ahli hukum berbeda pendapat mengenai makna persatuan genus: menurut Hanafi, ini adalah gabungan antara kata benda khas dan makna yang dimaksud; menurut Maliki, itu adalah kesetaraan atau kedekatan manfaat; menurut Shafi'i, kedua pengganti digabungkan sebagai kata benda proper; dan menurut Hanbali, tipe-tipe tersebut berbagi satu akar meskipun tujuannya berbeda. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1470} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1471} Ini adalah syarat untuk validitas melakukan zakat pada unta jika pengecualian adalah tipe nisab, dan beberapa transaksi dibatasi. Dalam penjualan riba, ejen rentina sejenisnya dilarang dan penjualan dibatalkan jika jenis yang sama digabungkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1471}"
