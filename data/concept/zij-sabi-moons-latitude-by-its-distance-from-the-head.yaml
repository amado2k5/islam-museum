id: concept/zij-sabi-moons-latitude-by-its-distance-from-the-head
class: concept
kind: scientific
label: { ar: "عرض القمر من بُعده عن الرأس", en: "The Moon's latitude from its distance from the head", ur: "رأس سے فاصلے سے چاند کا عرض", es: "La latitud de la Luna a partir de su distancia desde la cabeza", fr: "La latitude de la Lune à partir de sa distance par rapport à la tête", tr: "Ayın başa göre konumu", id: "Posisi bulan relatif terhadap kepala" }
summary:
  ar: "عرض القمر هو بُعده عن نطاق البروج، ويُعرف بإنقاص موضع الرأس من موضع القمر الحقيقي، فما بقي فهو حَمة العرض؛ وإن شئت أن تُخرج الحمة بالجمع، فزِد على موضع القمر الحقيقي موضع الرأس وأسقط الدور إن زاد. {cite:zij-sabi-nallino-byblion p.113}."
  en: "The Moon's latitude is its distance from the zodiac belt. It is found by subtracting the head's place from the Moon's true place; what remains is the argument of latitude. Alternatively the argument is found by adding the head's place to the Moon's true place and removing a full circuit if the sum exceeds one. {cite:zij-sabi-nallino-byblion p.113}."
  ur: "چاند کا عرض بروجی پٹی سے اس کا فاصلہ ہے، جو چاند کے حقیقی مقام سے رأس کا مقام گھٹا کر معلوم ہوتا ہے؛ جو باقی بچے وہ عرض کی حمّہ ہے۔ اگر چاہیں تو حمّہ جمع کر کے بھی نکل سکتی ہے: چاند کے حقیقی مقام میں رأس کا مقام جمع کرو اور اگر مجموعہ دور سے بڑھے تو دور نکال دو۔ {cite:zij-sabi-nallino-byblion p.113}۔"
  es: "La latitud de la Luna es su distancia al cinturón zodiacal. Se obtiene restando la posición de la cabeza a la posición real de la Luna; el resultado es el argumento de la latitud. Alternativamente, el argumento se obtiene sumando la posición de la cabeza a la posición real de la Luna y restando un circuito completo si la suma excede uno. {cite:zij-sabi-nallino-byblion p.113}."
  fr: "La latitude de la Lune correspond à sa distance par rapport à la ceinture zodiacale. On la calcule en soustrayant la position de la tête de la Lune de sa position réelle; le résultat obtenu est l’argument de la latitude. On peut également calculer cet argument en additionnant la position de la tête de la Lune à sa position réelle et en soustrayant un cycle complet si la somme est supérieure à un. {cite:zij-sabi-nallino-byblion p.113}."
  tr: "Ayın enlemi, ekliptik düzlemine olan uzaklığıdır ve ayın gerçek konumundan zenit noktasının konumunu çıkararak belirlenir. Kalan değer enlemdir. Eğer enlemi, zenit noktasının konumunu ayın gerçek konumuna ekleyerek hesaplamak isterseniz, eğer periyot daha büyükse, periyodu çıkarın. {cite:zij-sabi-nallino-byblion s.113}."
  id: "Garis lintang bulan adalah jaraknya dari ekliptika, dan ditentukan dengan mengurangi posisi zenit dari posisi sebenarnya bulan. Sisanya adalah garis lintang. Jika Anda ingin menghitung garis lintang dengan menambahkan posisi zenit ke posisi sebenarnya bulan, maka kurangi periodenya jika lebih besar. {cite:zij-sabi-nallino-byblion p.113}."
