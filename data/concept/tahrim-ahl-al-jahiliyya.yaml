id: concept/tahrim-ahl-al-jahiliyya
class: concept
kind: legal
label:
  ar: "ما حرّمه أهل الجاهلية وما أحلّوه بغير إذن من الله"
  en: "What the people of the Jahiliyya forbade and permitted without God's leave"
  ur: "اہلِ جاہلیت کی خود ساختہ تحلیل و تحریم"
  es: "Lo que la gente de la época de la ignorancia (Jahiliyya) prohibió y permitió sin el permiso de Dios."
summary:
  ar: "تجمع هذه المادة ما حرّمه أهل الجاهلية وما أحلّوه من غير إذن من الله، كما تنقله الآيات والأحاديث. فالقرآن يذكر البحيرة والسائبة والوصيلة والحام ويقول إن الله لم يجعل شيئاً منها [[passage/quran-5-103|المائدة 103]] {cite:tanzil-quran}، ويذكر نصيباً من الحرث والأنعام جعلوه لله ونصيباً جعلوه لشركائهم [[passage/quran-6-136|الأنعام 136]] {cite:tanzil-quran}، وأنعاماً وحرثاً حجّروها على من شاؤوا [[passage/quran-6-138|الأنعام 138]] {cite:tanzil-quran}. ويروي ابن عباس أن أهل الجاهلية كانوا يأكلون أشياء ويتركون أشياء تقذراً، فبعث الله نبيه وأنزل كتابه وبيّن حلاله وحرامه، وأن ما سكت عنه فهو عفو [[passage/abudawud-api-3800|سنن أبي داود 3800]] {cite:sunan-abi-dawud 3800}. ويربط القرآن النسيء بإحلال ما حرّم الله [[passage/quran-9-37|التوبة 37]] {cite:tanzil-quran}."
  en: "This record gathers what the people of the Jahiliyya forbade and permitted without God's leave, as the verses and reports relate it. The Qur'an names the bahira, the sa'iba, the wasila and the hami and says God appointed none of them [[passage/quran-5-103|al-Ma'ida 103]] {cite:tanzil-quran}; it describes a share of crops and cattle they assigned to God and a share to their partners [[passage/quran-6-136|al-An'am 136]] {cite:tanzil-quran}, and cattle and crops they put off limits to whomever they chose [[passage/quran-6-138|al-An'am 138]] {cite:tanzil-quran}. Ibn Abbas reports that the people of the Jahiliyya ate some things and left others out of disgust, that God then sent His Prophet and sent down His book and made plain what is lawful and unlawful, and that what He was silent about is pardoned [[passage/abudawud-api-3800|Sunan Abi Dawud 3800]] {cite:sunan-abi-dawud 3800}. The Qur'an links the postponing of the sacred month to making lawful what God forbade [[passage/quran-9-37|al-Tawba 37]] {cite:tanzil-quran}."
  ur: "یہ مجموعہ بیان کرتا ہے کہ اہلِ جاہلیت نے اللہ کی اجازت کے بغیر کیا حرام ٹھہرایا اور کیا حلال، جیسا کہ آیات اور روایات میں آیا ہے۔ قرآن بحیرہ، سائبہ، وصیلہ اور حام کا ذکر کرتا ہے اور کہتا ہے کہ اللہ نے ان میں سے کچھ مقرر نہیں کیا [[passage/quran-5-103|المائدہ 103]] {cite:tanzil-quran}؛ وہ کھیتی اور مویشیوں کا ایک حصہ اللہ کے لیے اور ایک حصہ شریکوں کے لیے ٹھہرانے کا ذکر کرتا ہے [[passage/quran-6-136|الانعام 136]] {cite:tanzil-quran}، اور ایسے مویشی اور کھیتی جنہیں انہوں نے جس پر چاہا ممنوع کر دیا [[passage/quran-6-138|الانعام 138]] {cite:tanzil-quran}۔ ابن عباس روایت کرتے ہیں کہ اہلِ جاہلیت کچھ چیزیں کھاتے اور کچھ کو گھن کھا کر چھوڑ دیتے تھے، پھر اللہ نے اپنے نبی کو بھیجا، اپنی کتاب اتاری اور حلال و حرام واضح کیا، اور جس پر وہ خاموش رہا وہ معاف ہے [[passage/abudawud-api-3800|سنن ابی داود 3800]] {cite:sunan-abi-dawud 3800}۔ قرآن مہینے کے پیچھے ہٹانے کو اللہ کے حرام کیے ہوئے کو حلال کرنے سے جوڑتا ہے [[passage/quran-9-37|التوبہ 37]] {cite:tanzil-quran}۔"
  es: "Este registro reúne lo que la gente de la Jahiliyya prohibió y permitió sin el permiso de Dios, como lo relatan los versículos y los informes. El Corán nombra a los bahira, los sa'iba, los wasila y los hami y dice que Dios no designó a ninguno de ellos [[passage/quran-5-103|al-Ma'ida 103]] {cite:tanzil-quran}; describe una parte de las cosechas y el ganado que asignaron a Dios y una parte a sus socios [[passage/quran-6-136|al-An'am 136]] {cite:tanzil-quran}, y el ganado y las cosechas que pusieron fuera de los límites para quien eligieron [[passage/quran-6-138|al-An'am 138]] {cite:tanzil-quran}. Ibn Abbas relata que la gente de la época preislámica (Jahiliyya) comía algunas cosas y dejaba otras por disgusto, que Dios envió entonces a Su Profeta y reveló Su libro y aclaró lo que es lícito e ilícito, y que lo que Él guardó silencio es perdonado [[passage/abudawud-api-3800|Sunan Abi Dawud 3800]] {cite:sunan-abi-dawud 3800}. El Corán vincula el aplazamiento del mes sagrado con hacer lícito lo que Dios prohibió [[passage/quran-9-37|al-Tawba 37]] {cite:tanzil-quran}."
