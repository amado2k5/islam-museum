summary:
  ar: "النسر والرخم عند الدميري من أكبر الطير الجارح، وهو في مثل العرب رمز البعد والأجل، وقالوا أسن من نسر؛ وذكر القزويني في طيور الجبال ما لا يقرب العمران من الجوارح."
  en: "The vulture and the rakhma in al-Damiri: among the greatest birds of prey, in the Arabs' proverb a sign of far-off end and long age — 'older than a vulture'; al-Qazwini names among the mountain raptors those that never come near the settled world."
  ur: "دمیری میں نسر اور رخمہ: سب سے بڑے شکاری پرندوں میں سے، عرب کی مثال میں دور کے انجام اور طویل عمر کی علامت — 'گدھ سے بھی بزرگ'؛ قزوینی نے پہاڑوں کے ان بازوں کا ذکر کیا جو بستیوں کے قریب نہیں آتے۔"
  es: "El buitre y el rakhma en al-Damiri: entre las aves rapaces más grandes, en el proverbio árabe un signo de un final lejano y una larga edad — 'más viejo que un buitre'; al-Qazwini nombra entre las aves rapaces de montaña a aquellas que nunca se acercan al mundo habitado."
  fr: "Le vautour et le rakhma chez al-Damiri: parmi les plus grands oiseaux de proie, dans le proverbe arabe, un signe de fin lointaine et de longue vie — « plus vieux qu'un vautour »; al-Qazwini cite parmi les rapaces de montagne ceux qui ne s'approchent jamais du monde sédentaire."
  tr: "Al-Damiri'ye göre kartal ve 'rakhm' en büyük yırtıcı kuşlar arasındadır ve Arapların atasözünde mesafe ve ömrü simgeler. Kartaldan daha yaşlı olduğu söylenir; el-Kazwini dağ kuşlarında kentsel yaşamı yırtıcılarına yaklaştırmayan şeylerden bahseder."
  id: "Elang dan 'rakhm' menurut al-Damiri adalah salah satu burung pemangsa terbesar, dan dalam peribahasa Arab, mereka melambangkan jarak dan umur panjang. Mereka mengatakan burung ini lebih tua dari elang; dan al-Qazwini menyebutkan pada burung gunung apa yang tidak membawa kehidupan perkotaan lebih dekat dengan predatornya."
