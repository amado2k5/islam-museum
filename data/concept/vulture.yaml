  en: "The vulture"
  ur: "گدھ"
summary:
  ar: "النسر والرخم عند الدميري من أكبر الطير الجارح، وهو في مثل العرب رمز البعد والأجل، وقالوا أسن من نسر؛ وذكر القزويني في طيور الجبال ما لا يقرب العمران من الجوارح."
  en: "The vulture and the rakhma in al-Damiri: among the greatest birds of prey, in the Arabs' proverb a sign of far-off end and long age — 'older than a vulture'; al-Qazwini names among the mountain raptors those that never come near the settled world."
  ur: "دمیری میں نسر اور رخمہ: سب سے بڑے شکاری پرندوں میں سے، عرب کی مثال میں دور کے انجام اور طویل عمر کی علامت — 'گدھ سے بھی بزرگ'؛ قزوینی نے پہاڑوں کے ان بازوں کا ذکر کیا جو بستیوں کے قریب نہیں آتے۔"
