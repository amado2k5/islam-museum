summary:
  ar: "خط فارسي رشيق نشأ في النصف الثاني من القرن الثامن الهجري في شيراز وتبريز من مزج النسخ والتعليق، ولقب «عروس الخطوط»، وصار خط الشعر الفارسي وانتشر إلى الهند المغولية والدولة العثمانية {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 27}."
  en: "An elegant Persian script that grew in Shiraz and Tabriz in the second half of the fourteenth century from a merging of naskh and ta'liq; called the \"bride of scripts\", it became the script of Persian poetry and spread to Mughal India and Ottoman Turkey {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 27}."
  ur: "ایک نفیس فارسی خط جو چودہویں صدی کے دوسرے نصف میں شیراز اور تبریز میں نسخ و تعلیق کے امتزاج سے بنا؛ «عروس الخطوط» کہلایا، فارسی شاعری کا خط بنا اور مغل ہند اور عثمانی ترکی تک پھیلا {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 27}۔"
  es: "Una elegante escritura persa que surgió en Shiraz y Tabriz en la segunda mitad del siglo XIV a partir de la fusión de naskh y ta'liq; llamada la \"novia de las escrituras\", se convirtió en la escritura de la poesía persa y se extendió a la India mogol y la Turquía otomana {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 27}."
  fr: "Une élégante écriture persane qui s'est développée à Shiraz et Tabriz dans la seconde moitié du XIVe siècle à partir d'une fusion du naskh et du ta'liq; appelée la « mariée des écritures », elle est devenue l'écriture de la poésie persane et s'est répandue dans l'Inde moghole et la Turquie ottomane {cite:ekhtiar-how-to-read-islamic-calligraphy-2018 p. 27}."
