id: concept/zij-sabi-battani-year-shorter-than-ptolemys
class: concept
kind: scientific
label: { ar: "سنة البتاني أقصر من سنة بطليموس", en: "Al-Battani's year is shorter than Ptolemy's", ur: "البتانی کا سال بطلیموس کے سال سے چھوٹا" }
summary:
  ar: "يبين البتاني أن زمان السنة الذي حصل له بالرصد أقل من الزمان الذي ذكره بطليموس بجزءين وخمس جزء، أي أن حركة الشمس التي وجدها تزيد على الحركة التي ذكرها بطليموس في اليوم وفي السنة المصرية بمقادير يذكرها النص، ثم يختم بقوله بالتقريب إن شاء الله {cite:zij-sabi-nallino-byblion p.68}."
  en: "Al-Battani makes plain that the year he obtained by observation is less than the time Ptolemy gave by two parts and a fifth of a part, so that the Sun's motion he found exceeds the motion Ptolemy gave, both in the day and in the Egyptian year, by amounts the text states, and he ends with the words approximately, if God wills {cite:zij-sabi-nallino-byblion p.68}."
  ur: "البتانی واضح کرتے ہیں کہ رصد سے انہیں جو سال ملا وہ اس زمانے سے دو اجزا اور ایک جز کے پانچویں حصے کم ہے جو بطلیموس نے بیان کیا، چنانچہ سورج کی جو حرکت انہوں نے پائی وہ بطلیموس کی بتائی ہوئی حرکت سے دن میں بھی اور مصری سال میں بھی ان مقداروں سے زیادہ ہے جو متن بتاتا ہے، اور وہ اس پر ختم کرتے ہیں کہ یہ تقریباً ہے، ان شاء اللہ {cite:zij-sabi-nallino-byblion p.68}۔"
