id: concept/zij-sabi-battani-year-shorter-than-ptolemys
class: concept
kind: scientific
label: { ar: "سنة البتاني أقصر من سنة بطليموس", en: "Al-Battani's year is shorter than Ptolemy's", ur: "البتانی کا سال بطلیموس کے سال سے چھوٹا", es: "El año de Al-Battani es más corto que el de Ptolomeo.", fr: "L'année d'Al-Battani est plus courte que celle de Ptolémée.", tr: "El-Battani'nin yılı, Batlamyus'un yılından daha kısadır.", id: "Tahun Al-Battani lebih pendek daripada tahun Ptolemy." }
summary:
  ar: "يبين البتاني أن زمان السنة الذي حصل له بالرصد أقل من الزمان الذي ذكره بطليموس بجزءين وخمس جزء، أي أن حركة الشمس التي وجدها تزيد على الحركة التي ذكرها بطليموس في اليوم وفي السنة المصرية بمقادير يذكرها النص، ثم يختم بقوله بالتقريب إن شاء الله {cite:zij-sabi-nallino-byblion p.68}."
  en: "Al-Battani makes plain that the year he obtained by observation is less than the time Ptolemy gave by two parts and a fifth of a part, so that the Sun's motion he found exceeds the motion Ptolemy gave, both in the day and in the Egyptian year, by amounts the text states, and he ends with the words approximately, if God wills {cite:zij-sabi-nallino-byblion p.68}."
  ur: "البتانی واضح کرتے ہیں کہ رصد سے انہیں جو سال ملا وہ اس زمانے سے دو اجزا اور ایک جز کے پانچویں حصے کم ہے جو بطلیموس نے بیان کیا، چنانچہ سورج کی جو حرکت انہوں نے پائی وہ بطلیموس کی بتائی ہوئی حرکت سے دن میں بھی اور مصری سال میں بھی ان مقداروں سے زیادہ ہے جو متن بتاتا ہے، اور وہ اس پر ختم کرتے ہیں کہ یہ تقریباً ہے، ان شاء اللہ {cite:zij-sabi-nallino-byblion p.68}۔"
  es: "Al-Battani deja claro que el año que obtuvo por observación es menor que el tiempo que dio Ptolomeo en dos partes y una quinta parte, de modo que el movimiento del Sol que encontró excede el movimiento que dio Ptolomeo, tanto en el día como en el año egipcio, en cantidades que el texto indica, y termina con las palabras aproximadamente, si Dios quiere {cite:zij-sabi-nallino-byblion p.68}."
  fr: "Al-Battani indique clairement que l'année qu'il a obtenue par observation est inférieure de deux parties et un cinquième de partie à celle donnée par Ptolémée, de sorte que le mouvement du Soleil qu'il a trouvé dépasse celui donné par Ptolémée, tant dans le jour que dans l'année égyptienne, des quantités indiquées dans le texte, et il termine par les mots approximativement, si Dieu le veut {cite:zij-sabi-nallino-byblion p.68}."
  tr: "El-Battani, gözlem yoluyla elde ettiği yılın süresinin, Batlamyus'un bahsettiği süreden iki buçuk kat daha kısa olduğunu, yani bulduğu güneş hareketinin, metinde belirtilen miktarlardan daha fazla olduğunu, gün ve Mısır yılı içinde Batlamyus'un bahsettiği hareketten daha büyük olduğunu gösterir ve ardından, yaklaşık olarak, Allah'ın izniyle, diyerek sözlerini tamamlar. {cite:zij-sabi-nallino-byblion s.68}"
  id: "Al-Battani menunjukkan bahwa waktu dalam setahun yang ia peroleh melalui pengamatan lebih kecil daripada waktu yang disebutkan oleh Ptolemy sebanyak dua seperlima bagian, artinya pergerakan matahari yang ia temukan lebih besar daripada pergerakan yang disebutkan oleh Ptolemy dalam sehari dan dalam tahun Mesir dengan jumlah yang disebutkan dalam teks, kemudian ia menyimpulkan dengan mengatakan, kira-kira, insya Allah {cite:zij-sabi-nallino-byblion p.68}."
