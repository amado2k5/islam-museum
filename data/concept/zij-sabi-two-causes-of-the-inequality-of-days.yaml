id: concept/zij-sabi-two-causes-of-the-inequality-of-days
class: concept
kind: scientific
label: { ar: "سببا اختلاف الأيام بلياليها", en: "The two causes of the inequality of days", ur: "دنوں کے اختلاف کے دو سبب" }
summary:
  ar: "يقول البتاني إن هذا الاختلاف يتركب من جهتين: إحداهما اختلاف حركة الشمس، وهو التعديل، والأخرى اختلاف تمر البروج في وسط السماء، إذ لا تطلع كلها هناك بمقدار واحد، وأكثر ما يجتمع من قبل اختلاف حركة الشمس قريب من ثلاثة أجزاء وربع وعشر، وأكثر ما يجتمع من تمر البروج في وسط السماء قريب من أربعة أجزاء وربع وخمس {cite:zij-sabi-nallino-byblion p.78}."
  en: "Al-Battani says this variation is compounded from two sources: one is the variation in the Sun's motion, the equation, and the other the variation in the passage of the signs across mid-heaven, since they do not all rise there by one amount; the most that gathers from the variation of the Sun's motion is close to three parts, a quarter and a tenth, and the most from the passage of the signs in mid-heaven close to four parts, a quarter and a fifth {cite:zij-sabi-nallino-byblion p.78}."
  ur: "البتانی کہتے ہیں کہ یہ اختلاف دو جہتوں سے مرکب ہے: ایک سورج کی حرکت کا اختلاف، یعنی تعدیل، اور دوسرا وسطِ آسمان میں بروج کے گزرنے کا اختلاف، کیونکہ وہاں سب ایک مقدار سے طلوع نہیں ہوتے؛ سورج کی حرکت کے اختلاف سے جو زیادہ سے زیادہ جمع ہوتا ہے وہ تقریباً تین اجزا، ایک چوتھائی اور ایک عشر ہے، اور وسطِ آسمان میں بروج کے گزرنے سے زیادہ سے زیادہ تقریباً چار اجزا، ایک چوتھائی اور ایک پانچواں ہے {cite:zij-sabi-nallino-byblion p.78}۔"
