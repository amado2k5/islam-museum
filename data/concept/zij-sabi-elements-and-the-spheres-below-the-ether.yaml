id: concept/zij-sabi-elements-and-the-spheres-below-the-ether
class: concept
kind: scientific
label: { ar: "الأسطقسات الأربعة والأثير في ترتيب العالم", en: "The four elements and the ether in the order of the world", ur: "دنیا کی ترتیب میں چار عناصر اور اثیر", es: "Los cuatro elementos y el éter en el orden del mundo", fr: "Les quatre éléments et l'éther dans l'ordre du monde", tr: "Dünyanın düzeninde dört element ve eter", id: "Empat unsur dan eter dalam tatanan dunia" }
summary:
  ar: "يذكر النص أن ما دون فلك القمر من الأسطقسات الأربعة، وهي الأرض والماء والهواء والنار، وأن ما فوق ذلك هو الأثير الذي تجري فيه الكواكب، وأن مبادئ الطبائع الأرضية هي هذه الأربعة وبها تختلف الأشياء بحسب ما يبلوها من الشمس والقمر والنجوم. ويُبين أن البُعد الذي بين مركز الأرض والأثير يتحدد بمقدار نصف قطر الأرض مرات محددة، والأرقام في هذا الموضع مشوشة. {cite:zij-sabi-nallino-byblion pp.185-186}"
  en: "The text says that below the lunar sphere are the four elements, earth, water, air and fire, and above them the ether through which the planets move. These four are the principles of the earthly natures, and by them things differ as the Sun, Moon and stars act on them. It states the distance from the earth's centre to the ether in multiples of the earth's radius; those figures are garbled and are not given here. {cite:zij-sabi-nallino-byblion pp.185-186}"
  ur: "متن کہتا ہے کہ چاند کے فلک کے نیچے چار عناصر ہیں، یعنی زمین، پانی، ہوا اور آگ، اور ان سے اوپر وہ اثیر ہے جس میں سیارے چلتے ہیں۔ یہ چار زمینی طبائع کے اصول ہیں، اور سورج، چاند اور ستاروں کے اثر سے چیزیں ان کے ذریعے مختلف ہوتی ہیں۔ متن مرکز زمین سے اثیر تک کا فاصلہ زمین کے نصف قطر کے ضربوں میں بیان کرتا ہے، مگر وہ اعداد بگڑے ہوئے ہیں اور یہاں نہیں دیے گئے۔ {cite:zij-sabi-nallino-byblion pp.185-186}"
  es: "El texto afirma que debajo de la esfera lunar se encuentran los cuatro elementos: tierra, agua, aire y fuego, y por encima de ellos el éter, a través del cual se mueven los planetas. Estos cuatro elementos constituyen los principios de la naturaleza terrestre, y por ellos las cosas varían según la acción del Sol, la Luna y las estrellas sobre ellos. Indica la distancia desde el centro de la Tierra hasta el éter en múltiplos del radio terrestre; estas cifras están distorsionadas y no se incluyen aquí. {cite:zij-sabi-nallino-byblion pp.185-186}"
  fr: "Le texte affirme que sous la sphère lunaire se trouvent les quatre éléments: la terre, l’eau, l’air et le feu, et au-dessus d’eux l’éther à travers lequel se meuvent les planètes. Ces quatre éléments constituent les principes de la nature terrestre, et c’est par eux que les choses diffèrent, sous l’influence du Soleil, de la Lune et des étoiles. Il indique la distance entre le centre de la Terre et l’éther en multiples du rayon terrestre; ces valeurs sont illisibles et ne sont pas reproduites ici. {cite:zij-sabi-nallino-byblion pp.185-186}"
  tr: "Metinde, ay küresinin altında dört elementin (toprak, su, hava ve ateş) ve bunların üzerinde gezegenlerin hareket ettiği eterin bulunduğu belirtiliyor. Ayrıca bu dört elementin dünyevi doğanın prensipleri olduğu ve şeylerin güneş, ay ve yıldızların etkisine göre farklılık gösterdiği ifade ediliyor. Dünya'nın merkezi ile eter arasındaki mesafenin, Dünya'nın yarıçapının belirli bir katı ile belirlendiği açıklanıyor, ancak bu bölümdeki rakamlar net değil. {cite:zij-sabi-nallino-byblion pp.185-186}"
  id: "Teks tersebut menyatakan bahwa di bawah bola bulan terdapat empat unsur—bumi, air, udara, dan api—dan di atasnya terdapat eter tempat planet-planet bergerak. Lebih lanjut dinyatakan bahwa keempat unsur ini adalah prinsip-prinsip sifat bumi, dan bahwa segala sesuatu berbeda sesuai dengan pengaruh matahari, bulan, dan bintang. Dijelaskan bahwa jarak antara pusat bumi dan eter ditentukan oleh sejumlah kali jari-jari bumi tertentu, meskipun angka-angka di bagian ini tidak jelas. {cite:zij-sabi-nallino-byblion pp.185-186}"
