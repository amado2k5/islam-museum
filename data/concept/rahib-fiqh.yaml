label:
  ar: "الراهب"
  en: "Monk (rahib): his killing in jihad and the jizya on monks"
  ur: "راہب"
summary:
  ar: "الراهب في اللغة من رهب بمعنى خاف، وهو عند الإطلاق المنقطع للعبادة من النصارى، جمعه رهبان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8572} ويُفرّق بينه وبين القسيس، وهو عالم النصارى، وبينه وبين الأحبار، وهم العلماء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8572} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8573} إذا اشترك الرهبان في قتال المسلمين، أو خالطوا الناس، أو أعانوا المقاتلين برأيهم، جاز قتلهم عند الظفر بهم بلا خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8572} أما المعتزلون في صوامعهم دون مشاركة، فذهب الجمهور إلى أنهم لا يُقتلون، والأظهر عند الشافعية جواز قتلهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8572} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8573} وأما وضع الجزية على الرهبان فمحل خلاف وتفصيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8573}"
  en: "A monk, rahib, is one who fears God; in the usual sense it is a Christian who withdraws for worship, and the plural is ruhban. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8572} He is distinguished from the qissis, the Christian scholar, and from the ahbar, the Jewish scholars. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8572} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8573} If monks take part in fighting Muslims, mix with the people, or help the fighters with counsel, they may be killed when taken, by agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8572} If they stay apart in their monasteries without taking part, the majority (Hanafis, Malikis and Hanbalis, and one view of the Shafi'is) say they are not killed; the more apparent Shafi'i view allows killing them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8572} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8573} Whether monks owe the jizya is disputed, and the detail is given under jizya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8573}"
  ur: "راہب سے مراد عیسائی عابد ہے جو عبادت کے لیے گوشہ نشین ہو، جمع رہبان۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8572} جنگ میں شریک ہونے والے راہب کا قتل جائز ہے، جبکہ الگ تھلگ رہنے والے کے بارے میں جمہور کے نزدیک قتل جائز نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8572} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8573}"
