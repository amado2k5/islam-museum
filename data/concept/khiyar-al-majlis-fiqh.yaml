id: concept/khiyar-al-majlis-fiqh
class: concept
kind: legal
label:
  ar: خيار المجلس
  en: Khiyar al-majlis (option of the session)
  ur: خیار المجلس
summary:
  ar: 'خيار المجلس حق العاقد في إمضاء العقد أو رده منذ التعاقد إلى التفرق أو التخاير، والمجلس هنا اسم مكان لموضع الجلوس والمراد مجلس العقد أي مكان التبايع أو التعاقد، ومجلس العقد وحدة زمنية تبدأ من صدور الإيجاب وتستمر ما دام العاقدان منصرفين إلى التعاقد وتنتهي بالتفرق أو التخاير، ولا يبدأ الخيار من الإيجاب بل من لحاق القبول موافقا له، وما قبل القبول خيار يسمى خيار القبول، وليس حقيقة الجلوس معتبرة بل الحال التي يتلبس بها العاقدان وهي الانهماك في التعاقد، ويسميه بعضهم خيار المتبايعين من حديث «المتبايعان بالخيار». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8015} أثبته جمهور الفقهاء من السلف والخلف ومنهم الشافعية والحنابلة فلا يلزم العقد عندهم إلا بالتفرق عن المجلس أو التخاير باختيار الإمضاء، ونفاه الحنفية والمالكية وبعض فقهاء السلف كالثوري والليث والعنبري، واستدل المثبتون بحديث ابن عمر «المتبايعان كل واحد منهما بالخيار على صاحبه ما لم يتفرقا إلا بيع الخيار» وبقول ابن عمر «كانت السنة أن المتبايعين بالخيار حتى يتفرقا» وله حكم المرفوع، وبتخييره رجلا بعد البيع بقوله «اختر» ثم «هكذا البيع»، وبالمعقول من حاجة الناس لتدارك الندم بعد البيع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8016} واحتج النافون بسورة النساء الآية 29 وسورة المائدة الآية 1 وحديث «من ابتاع طعاما فلا يبيعه حتى يستوفيه» ورواية «فلا يحل له أن يفارق صاحبه خشية أن يستقيله» وحديث «المسلمون على شروطهم» وقاسوا على النكاح والخلع والعتق على مال والكتابة وقاسوا ما قبل التفرق على ما بعده وقالوا إنه خيار بمجهول لأن مدة المجلس مجهولة وإن العقد المطلق يقتضي ثبوت الملك في العوضين حالا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8017}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8018} أمد الخيار غير منضبط موكول لإرادة المتعاقدين ينتهي بالتفرق أو التخاير وكلاهما مجهول زمنه، وفي مذهب الشافعية وجه ضعيف عند النووي أن أقصى أمده ثلاثة أيام ووجه ثالث أنه يسقط بإعراض المتعاقدين إلى أمر آخر مع طول الفصل، والراجح ثبوته حتى التفرق أو التخاير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8018}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8019} أسباب انتهائه التفرق وهو متفق عليه بين المثبتين ويراعى فيه عرف المتعاقدين، والتخاير وهو اختيار لزوم العقد من العاقدين معا وينتهي به الخيار عند الشافعية وأحمد في الرواية الأصح خلافا لرواية أخرى عندهم اقتصرت على التفرق لأكثر الروايات، ويحصل التخاير صراحة أو ضمنا كتبايع العوضين في المجلس ويكفي تصرف أحدهما بالعوض الذي له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8019}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8020} الساكت بعد التخيير لا ينقطع خياره عند الشافعية والحنابلة في الراجح لأنه لم يوجد منه ما يبطل خياره، وفي قول ثان للحنابلة يسقط قياسا على عدم تجزأ الثبوت، والمبادر إلى تخيير صاحبه إن لم يجبه فخياره ساقط في الأصح لتعليق الحديث مصير خياره على صدور التخيير منه، وفي رأي ثان لا يسقط لأن إقدامه كان بقصد الاجتماع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8020}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8021} فسخ العقد من أحد العاقدين ينفسخ به العقد ولو تمسك الآخر بالإجازة لأن إثبات الخيار قصد به التمكن من الفسخ دون الإجازة والفسخ مقصود الخيار كما قال النووي، ويسقط الخيار به تبعا لسقوط العقد لأنه إذا بطل الشيء بطل ما في ضمنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8021} التصرف في المبيع أو الثمن لا يسقط الخيار عند الشافعية، وعند الحنابلة تصرف المشتري بإذن البائع مسقط لخيارهما والتصرف صحيح وتصرف البائع بإذن المشتري في الراجح مثله، وأما التصرف الناقل كالبيع والهبة والوقف أو الشاغل كالإجارة والرهن فلا يسقط الخيار للبائع لتصرفه في غير ملكه إذ الملك في مدة الخيار للمشتري عندهم، وللمشتري يسقط حق البائع من الخيار ويمنع صحة التصرف لتعلق حق البائع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8021}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8022} إسقاط الخيار ابتداء وهو التنازل عنه قبل استعماله في التبايع بشرط نفي الخيار فيه ثلاثة آراء: صحته وهو مذهب الحنابلة ووجه غير مصحح عند الشافعية، وامتناعه وبطلان البيع وهو الأصح عند الشافعية والمنصوص في البويطي وكتب القديم، وامتناعه وصحة البيع وهو وجه غير مصحح، وإسقاط خياريهما يلزم العقد وإسقاط خيار أحدهما يبقي خيار الآخر، واحتج المصححون بحديث التخيير وكون الخيار جعل رفقا وغررا فيجوز إسقاطه، واحتج المانعون بأنه إسقاط للحق قبل ثبوت سببه كالشفعة وبأنه ينافي مقتضى البيع الثابت شرعا مصحوبا بالخيار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8022}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8023} أثر الموت: ينتقل الخيار إلى الوارث في الأصح عند الشافعية قياسا على انتقال الحقوق وعلى خيار العيب وخيار الشرط، ويسقط بالموت عند الحنابلة لأنه إرادة تتصل بشخص العاقد، وفي قول للحنابلة لا ينتقل إلا بمطالبة الميت به في وصيته. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8023}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8024} الجنون والإغماء: ينتقل الخيار في الأصح إلى الولي من حاكم أو غيره بلا انتظار في الراجح، وإن خرس ولم تفهم إشارته ولا كتابة له نصب الحاكم نائبا عنه وإلا فهو على خياره، وفي قول يسقط لأن مفارقة العقل ليست أولى من مفارقة المكان، وعند الحنابلة لا يبطل بالجنون فهو على خياره إذا أفاق وفي مطبق الجنون يقوم أبوه أو وصيه أو الحاكم مقامه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8024}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8025} أثره الأصلي المتفق عليه منع لزوم العقد حتى التفرق أو التخاير، وفي أثره على انتقال الملك رأيان: الحنابلة في ظاهر المذهب أن الملك ينتقل إلى المشتري مع وجود الخيار ولا أثر له على نفاذ العقد ولا صحته فينتج أحكامه كلها وهو قابل للفسخ، واستدلوا بحديثي بيع العبد الذي له مال وبيع النخل بعد تأبيره حيث جعل المال والثمرة للمبتاع بمجرد الاشتراط، والشافعية في الأظهر من ثلاثة أقوال أن العقد موقوف مراعى من حيث انتقال الملك فإن تم حكم بأنه كان ملكا للمشتري وإلا بان أنه مالك البائع وهكذا الثمن، لأن ثبوت الخيار للعاقدين يقتضي أمرين متعارضين فيلزم التوقف حتى ينتهي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8025}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8026} ولا أثر لخيار المجلس على خيار الشرط فمدة خيار الشرط تحسب من حين العقد الواقع فيه الشرط وإن اشترط في المجلس فمن حين الشرط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8026}'
  en: 'Khiyar al-majlis is the contractor''s right to confirm or annul the contract from the contracting until parting or mutual choosing; al-majlis here names a place of sitting and means the session of the contract, a unit of time that begins with the offer, continues while the parties remain engaged in contracting, and ends by parting or mutual choosing; the option begins not at the offer but at the acceptance matching it, what precedes acceptance being a distinct option of acceptance; actual sitting does not count, only the parties'' engagement in contracting; some name it the option of the two parties from the hadith "the two parties have the option". {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8015} The majority of early and later jurists affirm it, including the Shafiis and Hanbalis, the contract binding for them only on parting from the session or on mutual choosing of confirmation; the Hanafis, Malikis and some early jurists deny it, among them al-Thawri, al-Layth and al-Anbari; the affirmers argue from Ibn Umar''s report "the two parties each have the option over the other as long as they have not parted, except a sale of option", from Ibn Umar''s statement "the sunna was that the two parties had the option until they parted" which has the force of a raised report, from his giving a man the choice after a sale saying "choose" then "this is how sale is", and from reason in people''s need to take back a regretted sale. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8016} The deniers argued from Surah al-Nisa ayah 29 and Surah al-Ma''ida ayah 1, the hadith "whoever buys food must not sell it until he has received it in full", the transmission "it is not lawful for him to leave his companion for fear he may ask to cancel", the hadith "Muslims are bound by their conditions", analogy with marriage, khul'', manumission for payment and kitaba, analogy of before-parting with after-parting, that it is an option over an unknown since the session''s length is unknown, and that an unconditional contract requires ownership to pass in both countervalues at once. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8017}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8018} Its duration is unfixed, left to the parties'' will, ending by parting or mutual choosing, both of unknown timing; a Shafii view al-Nawawi calls weak caps it at three days, and a third view lapses it by the parties turning to another matter with a long lapse, the preponderant being that it stands until parting or choosing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8018}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8019} Its endings are parting, agreed among the affirmers and governed by the parties'' custom, and mutual choosing, which is both parties choosing the contract''s bindingness and ends the option at the Shafiis and Ahmad on the sounder transmission against another transmission confining the ending to parting on the strength of the more numerous reports; choosing is express or implied, as re-trading the two countervalues in the session, and one party''s dealing with his own countervalue suffices. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8019}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8020} The silent party after being given the choice keeps his option at the Shafiis and the sounder Hanbali view since nothing from him voids it, a second Hanbali view lapsing it by analogy with its indivisible establishment; the one who offered the choice and got no answer loses his option on the sounder view since the hadith makes his option contingent on his issuing the choice and he gave the other what he owned, a second view keeping it since he acted seeking agreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8020}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8021} Annulment by either party dissolves the contract even if the other insists on confirming, since the option was established to enable annulment not confirmation and annulment is its purpose as al-Nawawi says, and the option lapses consequently with the contract because when a thing is void what is within it is void. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8021} Dealing in the goods or the price does not lapse the option at the Shafiis; at the Hanbalis the buyer''s dealing with the seller''s leave lapses both their options and the dealing is valid, the seller''s dealing with the buyer''s leave is the like on the preponderant view, while a transferring dealing such as sale, gift or waqf, or an encumbering one such as hire or pledge, does not lapse the option for the seller who dealt in what is not his since ownership during the option is the buyer''s on their view, and for the buyer it drops the seller''s right of option and bars the dealing''s validity since the seller''s right attached to it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8021}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8022} Waiving the option at the outset, the sale on condition of negating the option, has three views: its validity, the Hanbali school and an unauthenticated Shafii view; its impossibility with the sale void, the sounder Shafii view stated in al-Buwayti and the old-school books; and its impossibility with the sale valid, an unauthenticated view; waiving both options binds the contract while waiving one leaves the other''s; the validators argue from the hadith of choosing and from the option being a kindness and a gharar that may be dropped, the deniers that it is waiving a right before its cause is established, like the right of pre-emption, and that it contradicts the sale''s import which is established accompanied by the option. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8022}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8023} The effect of death: the option passes to the heir on the sounder Shafii view by analogy with the passing of rights and with the options of defect and stipulation; it lapses at the Hanbalis as a will attached to the contractor''s person; and a Hanbali view transfers it only if the deceased claimed it in his will. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8023}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8024} Madness and fainting: on the sounder view the option passes to the guardian, judge or other, without waiting on the preponderant view; if one becomes mute and neither his gesture nor writing is understood the judge appoints a deputy for him, else he keeps his option; a view lapses it since departing reason is no weaker than departing the place; and the Hanbalis hold madness does not void it, the party holding his option on waking, while in enveloping madness his father, executor or the judge stands in his place. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8024}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8025} Its agreed principal effect is preventing the contract''s bindingness until parting or choosing; on its effect on the transfer of ownership there are two views: the Hanbalis in the apparent school that ownership passes to the buyer despite the option with no effect on the contract''s enforceability or validity so it yields all its rulings while annullable, arguing from the hadiths of selling a slave with property and selling pollinated palms where the property and fruit go to the buyer by mere stipulation; and the Shafiis on the clearest of three views that the contract is suspended and awaited as to transfer of ownership, so if completed it is judged to have been the buyer''s by the contract, else the seller proved never to have lost ownership, and likewise the price, because the option standing for both parties entails two contradictory implications requiring suspension until it ends. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8025}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8026} The option of the session has no effect on the option of stipulation: the stipulated term counts from the contract in which the condition was made, or from the stipulation if made in the session. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8026}'
  ur: 'خیار المجلس عاقد کا وہ حق ہے کہ عقد کے وقت سے لے کر جدا ہونے یا باہمی اختیار تک عقد کو جاری رکھے یا رد کرے؛ مجلس یہاں جگہ کے نام پر ہے یعنی بیٹھنے کی جگہ اور اس سے مراد مجلسِ عقد یعنی بایع یا تعاقد کی جگہ ہے؛ مجلسِ عقد وہ زمانی اکائی ہے جو ایجاب سے شروع ہو کر جب تک دونوں عاقد تعاقد میں مصروف رہیں جاری رہتی اور جدائی یا باہمی تخییر پر ختم ہوتی ہے؛ خیار ایجاب سے نہیں بلکہ قبول کے اس سے مماثل ہو کر آنے سے شروع ہوتی ہے، قبول سے پہلے والی خیار خیار القبول کہلاتی ہے؛ اصل بیٹھنا معتبر نہیں بلکہ عاقدین کی وہ حالت کہ وہ تعاقد میں مصروف ہیں؛ بعض اسے حدیث «المتبايعان بالخيار» سے خیار المتبايعین کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8015} اسے سلف و خلف کے جمہور فقہاء ثابت کرتے ہیں جن میں شافعیہ اور حنابلہ ہیں تو ان کے نزدیک عقد صرف مجلس سے جدا ہونے یا امضاء پر باہمی اختیار سے لازم ہوتا ہے؛ حنفیہ، مالکیہ اور بعض سلف فقہاء جیسے ثوری، لیث اور عنبری نے اس کی نفی کی؛ ثابت کرنے والوں نے ابن عمر کی حدیث «المتبايعان كل واحد منهما بالخيار على صاحبه ما لم يتفرقا إلا بيع الخيار» سے اور ابن عمر کے قول «كانت السنة أن المتبايعين بالخيار حتى يتفرقا» سے جس کا حکم مرفوع ہے، اور اس کے کہ اس نے بیع کے بعد ایک شخص کو اختیار دیا «اختر» کہہ کر پھر «هكذا البيع»، اور معقول سے کہ انسان بیع کے بعد پچھتا سکتا ہے تو خیار اسے تدارک کا موقع دیتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8016} نفی کرنے والوں نے سورۃ النساء آیت 29 اور سورۃ المائدہ آیت 1 سے، حدیث «جو شخص غلہ خریدے اسے قبض مکمل کیے بغیر نہ بیچے» سے، روایت «اسے اپنے ساتھی کو چھوڑنا جائز نہیں کہ وہ استقالہ مانگے» سے، حدیث «المسلمون على شروطهم» سے، نکاح، خلع، مال پر عتق اور کتابت سے قیاس سے، جدائی سے پہلے کو اس کے بعد سے قیاس سے، اس پر کہ یہ نامعلوم مدت کی خیار ہے کیونکہ مجلس کی مدت معلوم نہیں، اور اس پر کہ مطلق عقد کا تقاضا دونوں عوضوں میں فوری ملکیت کا ثبوت ہے استدلال کیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8017}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8018} خیار کی مدت غیر منضبط ہے اور متعاقدین کی مرضی پر ہے، جدائی یا تخییر پر ختم ہوتی ہے اور دونوں کا وقت نامعلوم ہے؛ شافعی مذہب میں ایک ایسا وجہ ہے جسے نووی نے ضعیف کہا کہ اس کی اقصیٰ مدت تین دن ہے، اور تیسرا وجہ کہ عاقدین کا لمبے وقفے کے ساتھ کسی اور کام کی طرف مائل ہو جانا اسے ساقط کرتا ہے، راجح یہ ہے کہ وہ جدائی یا تخییر تک قائم ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8018}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8019} اس کے ختم ہونے کے اسباب جدائی ہے جس پر مثبتین متفق ہیں اور جس میں متعاقدین کے عرف کا لحاظ ہے، اور تخییر یعنی دونوں عاقدین کا عقد کی لزوم کا انتخاب جو شافعیہ اور احمد کی اصح روایت میں خیار ختم کرتا ہے بعکس دوسری روایت کے جو روایتوں کی اکثریت کی بنا پر جدائی تک محدود رہتی؛ تخییر صریح ہوتا ہے یا ضمنی جیسے مجلس میں دونوں عوضوں کا بایع کرنا، اور ایک عاقد کا اپنے عوض میں تصرف بھی کافی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8019}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8020} تخییر کے بعد خاموش رہنے والے کی خیار شافعیہ اور حنابلہ کی راجح رائے میں نہیں جاتی کیونکہ اس سے کوئی ایسا فعل ثابت نہیں جو خیار باطل کرے؛ حنابلہ کے دوسرے قول میں ساقط ہوتی ہے ثبوت کے غیر قابلِ تجزا ہونے پر قیاس کر کے؛ اور جو پہل کر کے ساتھی کو اختیار دے اور اسے جواب نہ ملے اس کی خیار اصح قول میں ساقط ہے کیونکہ حدیث نے اس کے خیار کا انجام اس کے تخییر پر ٹانگا اور اس نے اپنے حق ساتھی کو دے دیا؛ دوسری رائے میں نہیں ساقط کیونکہ اس کی پیش قدمی اتفاقِ رائے کی خواہش سے تھی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8020}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8021} کسی ایک عاقد کی فسخ سے عقد منفسخ ہوتا ہے خواہ دوسرا امضاء پر اصرار کرے کیونکہ خیار کا ثبوت فسخ کی تمکن کے لیے تھا نہ امضاء کے لیے، اور نووی کے مطابق فسخ ہی خیار کا مقصود ہے؛ اور خیار اس کے تبعاً ساقط ہوتی ہے کیونکہ عقد کے باطل ہونے پر اس کے ضمن کی چیز بھی باطل ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8021} مبیع یا ثمن میں تصرف شافعیہ کے نزدیک خیار ساقط نہیں کرتا؛ حنابلہ کے نزدیک مشتری کا بائع کی اجازت سے تصرف دونوں کی خیار ساقط کرتا ہے اور تصرف صحیح ہے، بائع کا مشتری کی اجازت سے تصرف بھی راجح میں ویسا ہی ہے؛ اور منتقل کرنے والا تصرف جیسے بیع، ہبہ یا وقف یا مشغول کرنے والا جیسے اجارہ یا رہن خیار ساقط نہیں کرتا، بائع کے لیے اس لیے کہ اس نے غیر ملک میں تصرف کیا کیونکہ خیار کی مدت میں ملکیت ان کے نزدیک مشتری کی ہے، اور مشتری کے لیے اس سے بائع کے خیار کا حق ساقط اور تصرف کی صحت ممنوع ہو جاتی ہے اس بنا پر کہ بائع کا حق اس سے جڑ چکا تھا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8021}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8022} ابتداء میں خیار کا اسقاط یعنی استعمال سے پہلے اس سے دستبردار ہونا، بیع مع شرط نفی الخیار، اس میں تین آراء ہیں: اس کی صحت جو حنبلی مذہب اور شافعیہ کا غیر مصحح وجہ ہے؛ اس کی معذرت مع بیع کی بطلان جو شافعیہ کا اصح قول اور بوئطی اور قدیم کی کتابوں کا منصوص ہے؛ اور اس کی معذرت مع بیع کی صحت جو غیر مصحح وجہ ہے؛ دونوں خیارات کا اسقاط عقد کو لازم اور ایک کے اسقاط پر دوسرے کی خیار باقی رہتی ہے؛ مصححین نے تخییر کی حدیث اور اس سے استدلال کیا کہ خیار نرمی اور غرر کے لیے رکھی گئی تو اس کا اسقاط جائز ہے؛ مانعین نے کہا یہ سبب ثابت ہونے سے پہلے حق کا اسقاط ہے جیسے شفعہ، اور یہ بیع کے مقتضا سے ٹکراتا ہے جو شرعاً خیار کے ساتھ ثابت ہوتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8022}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8023} موت کا اثر: شافعیہ کے اصح میں خیار وارث کو منتقل ہوتی ہے حقوق کے انتقال اور خیار العیب و خیار الشرط سے قیاس پر؛ حنابلہ کے نزدیک موت سے ساقط کیونکہ یہ ارادہ عاقد کی شخصیت سے جڑا ہے؛ اور حنابلہ کا ایک قول یہ ہے کہ صرف اس وقت منتقل ہوتی جب مردہ نے اپنی وصیت میں اس کا مطالبہ کیا ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8023}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8024} جنون اور بے ہوشی: اصح میں خیار ولی کو منتقل ہوتی ہے خواہ حاکم ہو یا غیر اور راجح میں بغیر انتظار کے؛ اگر کوئی گونگا ہو جائے اور نہ اس کی اشارہ سمجھ آئے نہ تحریر ہو تو حاکم اس کے لیے نائب مقرر کرتا ہے ورنہ وہ اپنی خیار پر ہے؛ ایک قول میں ساقط ہوتی ہے کیونکہ عقل سے جدائی جگہ سے جدائی سے کم تر نہیں؛ اور حنابلہ کے نزدیک جنون اسے باطل نہیں کرتا، افاقہ پر وہ اپنی خیار پر ہے اور مطبق جنون میں اس کا باپ، وصی یا حاکم اس کے مقام آتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8024}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8025} اس کا اصل اتفاقی اثر عقد کی لزوم کی ممانعت ہے جب تک جدائی یا تخییر نہ ہو؛ ملکیت کے انتقال پر اس کے اثر میں دو رائے ہیں: حنابلہ ظاہر مذہب میں کہ خیار کے باوجود ملکیت مشتری کو منتقل ہوتی ہے اور عقد کے نفاذ اور صحت پر اس کا کوئی اثر نہیں تو وہ اپنے سارے احکام دیتی ہے مگر فسخ کے قابل رہتی ہے، انہوں نے مال والے غلام اور تابیر شدہ کھجوروں کی بیع کی احادیث سے استدلال کیا جن میں محض اشتراط سے مال اور پھل خریدار کا ہو جاتا ہے؛ اور شافعیہ کا تین قولوں میں اظہر یہ ہے کہ ملکیت کے انتقال کے لحاظ سے عقد موقوف اور مراعی ہے تو اگر عقد مکمل ہوا تو فیصلہ یہ کہ وہ اسی عقد سے مشتری کی ملک تھی ورنہ ثابت ہوا کہ وہ بائع کی ملک ہی رہی اور اسی طرح ثمن، کیونکہ دونوں عاقدین کے لیے خیار کا ثبوت دو متعارض تقاضے پیدا کرتا ہے تو اس کے ختم ہونے تک توقف لازم ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8025}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8026} خیار المجلس کا خیار الشرط پر کوئی اثر نہیں: خیار الشرط کی مدت اس عقد کے وقت سے گنی جاتی ہے جس میں شرط ہوئی، اور اگر شرط مجلس میں ہوئی تو اس کے وقت سے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8026}'
