id: concept/mukabara
class: concept
kind: legal
label: { ar: "المُكَابَرَة", en: "Open assault by force (mukabara)", ur: "مُکابَرہ (کھلم کھلا زور زبردستی)" }
summary:
  ar: "المكابرة في اللغة المغالبة والمعاندة، وهي عند الفقهاء وصف من أوصاف فعل الحرابة، وهو البروز لأخذ مال أو قتل أو إرعاب مجاهرة اعتمادا على القوة مع البعد عن الغوث. وتأخذ المكابرة حكم الحرابة في الجملة، ومن كابر رجلا على ماله بسلاح في زقاق أو دخل على حريمه حكم عليه بحكم الحرابة. وفي حد السرقة اختلف الفقهاء: فالحنفية يوجبون القطع في المكابرة ليلا، ولا يوجبونه في المصر نهارا، والمالكية لا قطع على من أخذ بالقوة وادعى الملك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14920} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14921}"
  en: "Mukabara means overpowering and defying. In the jurists' usage it is one aspect of highway robbery (hiraba): an open seizure of property, killing or intimidation that relies on force far from help. In general it takes the rule of hiraba. On the theft limb, the Hanafis require cutting the hand for a night-time mukabara in a house but not a daytime one in town, while the Malikis exempt one who takes by force and claims ownership. The Shafi'is and Hanbalis treat a group that breaks into a house at night and prevents help as highwaymen. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14920} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14921}"
  ur: "مُکابَرہ کسی پر زور زبردستی سے مال چھیننے کو کہتے ہیں، جو حرابہ (ڈاکہ زنی) کی ایک صورت ہے۔ حنفیہ کے نزدیک رات کے وقت گھر میں مُکابَرہ کرنے پر ہاتھ کاٹا جاتا ہے، جب کہ دن کو شہر میں نہیں، اور مالکیہ اس صورت میں قطع کو لازم نہیں کرتے جب ملکیت کا دعویٰ ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14920} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14921}"
