id: concept/tin-samai
class: concept
kind: natural
label:
  ar: "طين ساماعي"
  en: "Tin sama'i (the stone-like polishing earth)"
  ur: "طین ساماعی ⁦(پالش کی پتھر جیسی مٹی)⁩"
  es: "Tin sama'i (la tierra pulida con aspecto de piedra)"
  fr: "Tin sama'i (la terre à polir semblable à de la pierre)"
  tr: "İşitme kili"
  id: "Tanah liat pendengaran"
summary:
  ar: "طين كالحجر يستعمله الصاغة في الصقال، قابض مبرد مجفف، يحسّن البدن ويصقل الوجه، ويصفه الكتاب نافعاً للعين مع اللبن."
  en: "A stone-like earth that goldsmiths use for polishing; astringent, cooling and drying, it cleanses the body, polishes the face and, the book says, helps the eye with milk."
  ur: "ایک پتھر جیسی مٹی جو سنار پالش کے لیے استعمال کرتے ہیں؛ قابض، ٹھنڈی اور خشک کرنے والی ہے، جسم کو صاف کرتی ہے، چہرے کو چمکاتی ہے اور کتاب کے مطابق دودھ کے ساتھ آنکھ کے لیے فائدہ مند ہے۔"
  es: "Una tierra con aspecto de piedra que los orfebres utilizan para pulir; astringente, refrescante y secante, limpia el cuerpo, pule el rostro y, según el libro, ayuda a la vista con leche."
  fr: "Une terre semblable à de la pierre que les orfèvres utilisent pour le polissage; astringente, rafraîchissante et asséchante, elle purifie le corps, polit le visage et, selon le livre, aide les yeux avec du lait."
  tr: "Kuyumcuların sır için kullandığı kil benzeri taş, vücudu iyileştiren ve yüzü parlatan soğutulmuş ve kurutulmuş bir büzücü maddedir ve kitapta sütle göz için faydalı olduğu anlatılır."
  id: "Batu seperti tanah liat yang digunakan oleh para pengrajin emas untuk glasir, astringen yang didinginkan dan dikeringkan yang memperbaiki tubuh dan mengilap wajah, dan buku tersebut menggambarkannya bermanfaat untuk mata dengan susu."
