id: concept/samt
class: concept
kind: legal
label:
  ar: "السَّمْت"
  en: "Samt (direction, bearing) and facing the qibla"
  es: "Samt (dirección, rumbo) y mirando hacia la qibla"
  fr: "Samt (direction, relèvement) et face à la qibla"
  ur: "سمٹ ⁦(سمت، اثر)⁩ اور قبلہ کی طرف منہ"
summary:
  ar: "السمت في اللغة القصد والاتجاه، والمسامتة المواجهة والمقابلة، ومنه سامت القبلة إذا استقبلها، ويطلق السمت على اتباع الحق والهدى وعلى هيئة أهل الخير، والتسميت الدعاء للعاطس، ولا يخرج الاصطلاح عن المعنى اللغوي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9822} ومسامتة القبلة شرط في صحة صلاة القادر عليها باتفاق الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9823}"
  en: "In the lexicon samt means a direction or aim, and musamata means facing or being opposite; one who faces the qibla is said to have musamata it. It also means following the right path and the bearing of the good, and tasmit means invoking blessing on a sneezer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9822} The technical sense does not depart from this. Facing the qibla is, by agreement of the jurists, a condition for the validity of prayer for one able to do it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9823}"
  es: "En el léxico, samt significa dirección u objetivo, y musamata significa estar frente a la qibla o estar en oposición; se dice que quien se orienta hacia la qibla tiene musamata. También significa seguir el camino correcto y llevar el bien, y tasmit significa invocar bendiciones sobre quien estornuda. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9822} El sentido técnico no se aparta de esto. Orientarse hacia la qibla es, por consenso de los juristas, una condición para la validez de la oración para quien puede hacerlo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9823}"
  fr: "Dans le lexique, « samt » signifie direction ou but, et « musamata » signifie faire face ou être en face; celui qui fait face à la qibla est dit « musamata it ». Cela signifie aussi suivre le droit chemin et porter le bien, et « tasmit » signifie invoquer la bénédiction sur celui qui éternue. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9822} Le sens technique ne diverge pas de cette interprétation. Faire face à la qibla est, de l’avis unanime des juristes, une condition de validité de la prière pour celui qui en est capable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9823}"
  ur: "لغت میں سامت کا مطلب ہے سمت یا مقصد، اور مسامات کا مطلب ہے سامنا کرنا یا مخالف ہونا۔ قبلہ کی طرف منہ کرنے والا کہا جاتا ہے کہ اس میں مسمات ہے۔ اس کا مطلب صحیح راستے پر چلنا اور نیکی کا حامل ہونا بھی ہے اور تسمیت کا مطلب ہے چھینک پر دعا کرنا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9822} فنی معنویت اس سے الگ نہیں ہوتی۔ قبلہ کی طرف منہ کرنا فقہاء کے اتفاق سے قابل استطاعت کے لیے نماز کے صحیح ہونے کی شرط ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص9823}"
