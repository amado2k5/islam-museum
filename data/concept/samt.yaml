label:
  ar: "السَّمْت"
  en: "Samt (direction, bearing) and facing the qibla"
summary:
  ar: "السمت في اللغة القصد والاتجاه، والمسامتة المواجهة والمقابلة، ومنه سامت القبلة إذا استقبلها، ويطلق السمت على اتباع الحق والهدى وعلى هيئة أهل الخير، والتسميت الدعاء للعاطس، ولا يخرج الاصطلاح عن المعنى اللغوي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9822} ومسامتة القبلة شرط في صحة صلاة القادر عليها باتفاق الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9823}"
  en: "In the lexicon samt means a direction or aim, and musamata means facing or being opposite; one who faces the qibla is said to have musamata it. It also means following the right path and the bearing of the good, and tasmit means invoking blessing on a sneezer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9822} The technical sense does not depart from this. Facing the qibla is, by agreement of the jurists, a condition for the validity of prayer for one able to do it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9823}"
