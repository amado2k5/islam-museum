id: concept/diyat-fiqh
class: concept
kind: legal
label:
  ar: "الديات ⁦(في الفقه)⁩"
  en: "Blood-money (diya) in fiqh"
  ur: "دیت ⁦(فقہی احکام)⁩"
  es: "Dinero de sangre (diya) en fiqh"
  fr: "Le prix du sang (diya) en fiqh"
summary:
  ar: "الدية في الفقه بدل النفس أو ما دونها يجب بالجناية، وتجب على القاتل خطأ أو شبه عمد وتتحملها العاقلة، وتجب في مال الجاني إذا كانت عمدا سقط فيه القصاص. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8252} دية الحر المسلم الذكر مائة من الإبل، ومن الذهب ألف دينار، ومن الفضة اثنا عشر ألف درهم عند الجمهور وعشرة آلاف عند الحنفية، ودية المرأة نصف دية الرجل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8266} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8267} دية الكتابي الذمي عند الجمهور نصف دية المسلم، وعند الحنفية مساوية لها، ولا دية للحربي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8268} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8269} وفي دية الأطراف والمعاني والشجاج أرش مقدر كالأنف والعينين واليدين والأسنان والموضحة والمنقلة والمأمومة والجائفة، وتتداخل ديات ما دون النفس في دية النفس إذا لم يتخلل برء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8278} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8286} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8294} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8295}"
  en: "In fiqh diya is the compensation for a killing or for an injury to a body part. It falls on the killer in an accidental killing or a quasi-intentional one, and the kin group ('aqila) bears it; in a deliberate killing where retaliation is dropped, it is owed by the killer himself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8252} The full diya of a free Muslim man is a hundred camels, or a thousand dinars of gold, or twelve thousand silver dirhams (ten thousand in the Hanafi view); a woman's diya is half a man's. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8266} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8267} A protected non-Muslim's diya is half a Muslim's according to the majority and equal to it according to the Hanafis; a belligerent is owed nothing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8268} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8269} Injuries to body parts and faculties carry fixed sums, and the diyas for lesser injuries are absorbed into the diya for a killing when the victim dies before healing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8278} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8286} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8294} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8295}"
  ur: "فقہ میں دیت کسی جان یا عضو کے نقصان کا بدل ہے۔ آزاد مسلمان مرد کی کامل دیت سو اونٹ، یا ایک ہزار دینار، یا بارہ ہزار درہم ہے، اور عورت کی دیت مرد کی نصف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8266} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8267} حربی کو دیت نہیں ملتی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8268}"
  es: "En fiqh diya es la compensación por un homicidio o por una lesión en una parte del cuerpo. Recae sobre el asesino en un homicidio accidental o cuasi intencional, y el grupo de parentesco ('aqila) la soporta; en un homicidio deliberado donde no hay represalia, la debe el propio asesino. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8252} La diya completa de un hombre musulmán libre es cien camellos, o mil dinares de oro, o doce mil dirhams de plata (diez mil en la visión Hanafi); la diya de una mujer es la mitad de la de un hombre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8266} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8267} La diya de un no musulmán protegido es la mitad de la de un musulmán según la mayoría e igual a ella según los hanafíes; a un beligerante no se le debe nada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8268} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8269} Las lesiones a partes del cuerpo y facultades conllevan sumas fijas, y las diyas por lesiones menores se absorben en la diya por un homicidio cuando la víctima muere antes de sanar. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8278} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8286} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8294} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8295}"
  fr: "En droit islamique (fiqh), la diya est la compensation pour un homicide ou une blessure corporelle. Elle incombe à l'auteur de l'homicide en cas d'homicide involontaire ou quasi-intentionnel, et est supportée par le groupe familial ('aqila); en cas d'homicide volontaire sans représailles, elle est due par l'auteur lui-même. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8252} La diya complète d'un homme musulman libre s'élève à cent chameaux, mille dinars d'or ou douze mille dirhams d'argent (dix mille selon l'école hanafite); la diya d'une femme est la moitié de celle d'un homme. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8266} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8267} La diya d'un non-musulman protégé est la moitié de celle d'un musulman selon la majorité et égale à celle-ci selon les hanafites; un belligérant n'a droit à aucune compensation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8268} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8269} Les blessures aux parties du corps et aux facultés donnent lieu à des sommes fixes, et les diyas pour les blessures mineures sont absorbées par la diya pour un meurtre lorsque la victime décède avant de guérir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8278} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8286} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8294} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8295}"
