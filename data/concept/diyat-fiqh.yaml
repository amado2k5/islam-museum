id: concept/diyat-fiqh
class: concept
kind: legal
label:
  ar: "الديات (في الفقه)"
  en: "Blood-money (diya) in fiqh"
  ur: "دیت (فقہی احکام)"
summary:
  ar: "الدية في الفقه بدل النفس أو ما دونها يجب بالجناية، وتجب على القاتل خطأ أو شبه عمد وتتحملها العاقلة، وتجب في مال الجاني إذا كانت عمدا سقط فيه القصاص. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8252} دية الحر المسلم الذكر مائة من الإبل، ومن الذهب ألف دينار، ومن الفضة اثنا عشر ألف درهم عند الجمهور وعشرة آلاف عند الحنفية، ودية المرأة نصف دية الرجل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8266} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8267} دية الكتابي الذمي عند الجمهور نصف دية المسلم، وعند الحنفية مساوية لها، ولا دية للحربي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8268} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8269} وفي دية الأطراف والمعاني والشجاج أرش مقدر كالأنف والعينين واليدين والأسنان والموضحة والمنقلة والمأمومة والجائفة، وتتداخل ديات ما دون النفس في دية النفس إذا لم يتخلل برء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8278} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8286} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8294} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8295}"
  en: "In fiqh diya is the compensation for a killing or for an injury to a body part. It falls on the killer in an accidental killing or a quasi-intentional one, and the kin group ('aqila) bears it; in a deliberate killing where retaliation is dropped, it is owed by the killer himself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8252} The full diya of a free Muslim man is a hundred camels, or a thousand dinars of gold, or twelve thousand silver dirhams (ten thousand in the Hanafi view); a woman's diya is half a man's. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8266} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8267} A protected non-Muslim's diya is half a Muslim's according to the majority and equal to it according to the Hanafis; a belligerent is owed nothing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8268} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8269} Injuries to body parts and faculties carry fixed sums, and the diyas for lesser injuries are absorbed into the diya for a killing when the victim dies before healing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8278} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8286} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8294} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8295}"
  ur: "فقہ میں دیت کسی جان یا عضو کے نقصان کا بدل ہے۔ آزاد مسلمان مرد کی کامل دیت سو اونٹ، یا ایک ہزار دینار، یا بارہ ہزار درہم ہے، اور عورت کی دیت مرد کی نصف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8266} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8267} حربی کو دیت نہیں ملتی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8268}"
