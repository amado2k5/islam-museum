label: { ar: "فهرس الأبواب السبعة والخمسين في الزيج الصابي", en: "The fifty-seven chapters of al-Zij al-Sabi", ur: "زیج صابی کے ستاون ابواب کی فہرست" }
summary:
  ar: "يفتتح البتاني زيجه بفهرس يحصي سبعة وخمسين باباً: صدر الكتاب والحساب وأوتار الدائرة والميل ومطالع البروج، ثم خواص الأقاليم والظل والارتفاع والساعات، ثم أبعاد الكواكب الثابتة، ثم حركة الشمس والقمر والكواكب الخمسة والكسوفات والتواريخ، ويختم بآلتين وبخاتمة الكتاب. {cite:zij-sabi-nallino-byblion pp.5-9}."
  en: "Al-Battani opens his zij with a table of contents counting fifty-seven chapters: the foreword, arithmetic, the chords of the circle, the obliquity and the risings of the signs; then the properties of climes, shadow, altitude and hours; then the fixed stars; then the motion of the Sun, Moon and five planets, the eclipses and the calendars; and he closes with two instruments and a final chapter. {cite:zij-sabi-nallino-byblion pp.5-9}."
  ur: "البتانی اپنی زیج کا آغاز ایک فہرست سے کرتے ہیں جس میں ستاون ابواب شمار ہوتے ہیں: دیباچہ، حساب، دائرے کے اوتار، میل اور بروج کے مطالع؛ پھر اقلیموں کی خصوصیات، سایہ، ارتفاع اور ساعات؛ پھر ثوابت؛ پھر سورج، چاند اور پانچ سیاروں کی حرکت، کسوف اور تقویمیں؛ اور آخر میں دو آلات اور خاتمۂ کتاب۔ {cite:zij-sabi-nallino-byblion pp.5-9}۔"
