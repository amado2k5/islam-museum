label: { ar: "فهرس الأبواب السبعة والخمسين في الزيج الصابي", en: "The fifty-seven chapters of al-Zij al-Sabi", ur: "زیج صابی کے ستاون ابواب کی فہرست", es: "Los cincuenta y siete capítulos de al-Zij al-Sabi", fr: "Les cinquante-sept chapitres d'al-Zij al-Sabi" }
summary:
  ar: "يفتتح البتاني زيجه بفهرس يحصي سبعة وخمسين باباً: صدر الكتاب والحساب وأوتار الدائرة والميل ومطالع البروج، ثم خواص الأقاليم والظل والارتفاع والساعات، ثم أبعاد الكواكب الثابتة، ثم حركة الشمس والقمر والكواكب الخمسة والكسوفات والتواريخ، ويختم بآلتين وبخاتمة الكتاب. {cite:zij-sabi-nallino-byblion pp.5-9}."
  en: "Al-Battani opens his zij with a table of contents counting fifty-seven chapters: the foreword, arithmetic, the chords of the circle, the obliquity and the risings of the signs; then the properties of climes, shadow, altitude and hours; then the fixed stars; then the motion of the Sun, Moon and five planets, the eclipses and the calendars; and he closes with two instruments and a final chapter. {cite:zij-sabi-nallino-byblion pp.5-9}."
  ur: "البتانی اپنی زیج کا آغاز ایک فہرست سے کرتے ہیں جس میں ستاون ابواب شمار ہوتے ہیں: دیباچہ، حساب، دائرے کے اوتار، میل اور بروج کے مطالع؛ پھر اقلیموں کی خصوصیات، سایہ، ارتفاع اور ساعات؛ پھر ثوابت؛ پھر سورج، چاند اور پانچ سیاروں کی حرکت، کسوف اور تقویمیں؛ اور آخر میں دو آلات اور خاتمۂ کتاب۔ {cite:zij-sabi-nallino-byblion pp.5-9}۔"
  es: "Al-Battani inicia su zij con un índice que consta de cincuenta y siete capítulos: el prólogo, la aritmética, las cuerdas del círculo, la oblicuidad y los ascensos de los signos; luego las propiedades de los climas, la sombra, la altitud y las horas; después las estrellas fijas; luego el movimiento del Sol, la Luna y los cinco planetas, los eclipses y los calendarios; y concluye con dos instrumentos y un capítulo final. {cite:zij-sabi-nallino-byblion pp.5-9}."
  fr: "Al-Battani ouvre son zij par une table des matières dénombrant cinquante-sept chapitres: l’avant-propos, l’arithmétique, les cordes du cercle, l’obliquité et les levers des signes; puis les propriétés des climats, des ombres, de l’altitude et des heures; puis les étoiles fixes; puis le mouvement du Soleil, de la Lune et des cinq planètes, les éclipses et les calendriers; et il termine par deux instruments et un chapitre final. {cite:zij-sabi-nallino-byblion pp.5-9}."
