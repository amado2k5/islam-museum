id: concept/al-ruuna-wa-al-humq
class: concept
kind: scientific
label:
  ar: "الرعونة والحمق"
  en: "Ru'una and humq (the edition glosses the first \"dementia\")"
  fr: "Ru’una et humq (l’édition glose le premier par « démence »)"
  ur: "رعونت اور حمق ⁦(الرعونة والحمق)⁩ ⁦(ایڈیشن کا انگریزی ترجمہ: dementia)⁩"
  es: "Ru'una y humq (la edición aclara el primer término: \"demencia\")"
  tr: "Dikkatsizlik ve aptallık"
  id: "Kelalaian dan kebodohan"
summary:
  ar: "يفرّق ابن سينا بين اختلاط الذهن والرعونة والحمق بأن الأول تغير في الأفعال الفكرية والثاني نقصان أو بطلان، ويذكر أسبابه من برودة ساذجة أو مع يبس أو مع بلغمية، وسبب كونه من البرد لا من الحرارة {cite:canon-ibn-sina-print-v2 p.98}"
  en: "Ibn Sina distinguishes confusion of the mind from ru'una and humq: the first is a change in the acts of thought, the second a deficiency or abolition; he gives its causes as simple coldness, or coldness with dryness, or with phlegm, and why it is from cold and not from heat {cite:canon-ibn-sina-print-v2 p.98}"
  fr: "Ibn Sina distingue la confusion de l’esprit de la ru’una et du humq : la première est une altération des actes de la pensée, la seconde une diminution ou une abolition ; il en donne pour causes une froideur simple, ou une froideur avec sécheresse, ou avec phlegme, et explique pourquoi elle vient du froid et non de la chaleur {cite:canon-ibn-sina-print-v2 p.98}"
  ur: "ابن سینا ذہن کی گڑبڑ اور رعونت و حمق میں فرق کرتا ہے: پہلی فکری افعال میں تبدیلی ہے اور دوسری کمی یا بطلان؛ اس کے اسباب سادہ سردی، یا خشکی کے ساتھ، یا بلغمیت کے ساتھ بتاتا ہے، اور یہ کہ وہ سردی سے ہے گرمی سے نہیں {cite:canon-ibn-sina-print-v2 p.98}۔"
  es: "Ibn Sina distingue la confusión mental de ru'una y humq: la primera es un cambio en los actos de pensamiento, la segunda una deficiencia o abolición; da como causas la simple frialdad, o la frialdad con sequedad, o con flema, y por qué proviene del frío y no del calor {cite:canon-ibn-sina-print-v2 p.98}"
  tr: "İbn Sina, zihin, pervasızlık ve aptallığın karışmasını ayırır; birincisinin entelektüel eylemlerde bir değişiklik, ikincisinin ise eksiklik veya geçersizlik olduğunu belirtir. Bunun nedenlerini saf soğukluk, kuruluk veya balgam olarak belirtir ve bunun sebebinin sıcaktan değil, soğuktan kaynaklandığını belirtir. {cite:canon-ibn-sina-print-v2 s.98}"
  id: "Ibn Sina membedakan antara kebingungan pikiran, kecerobohan, dan kebodohan; ia menyatakan bahwa yang pertama adalah perubahan dalam tindakan intelektual, sedangkan yang kedua adalah kekurangan atau ketidakabsahan. Ia menyatakan penyebabnya adalah dingin murni, kekeringan, atau dahak, dan menyatakan bahwa penyebabnya bukan panas tetapi dingin. {cite:canon-ibn-sina-print-v2 hlm.98}"
