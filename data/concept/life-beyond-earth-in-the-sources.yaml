id: concept/life-beyond-earth-in-the-sources
class: concept
kind: term
label: { ar: "الحياة خارج الأرض في المصادر", en: "Life beyond the earth in the sources", ur: "مصادر میں زمین سے باہر زندگی" }
summary:
  ar: "لا يتضمن القرآن ولا الحديث الثابت جملة صريحة عن كائنات على كوكب آخر؛ في المصادر آيات عن دواب بثّها الله في السماوات والأرض وعن خلق لا يعلمه الناس، ويفسّرها الطبري بالناس والملائكة عن مجاهد، وابن كثير بالملائكة والجن والإنس وسائر الحيوان، ويرى الرازي أنه لا يبعد أن يكون في السماوات أنواع من الحيوان وأن الله قادر على خلق عوالم أخرى. {cite:tafsir-ibn-kathir on 42:29} {cite:mafatih-al-ghayb-quran-tafsir-net on 42:29}"
  en: "Neither the Qur'an nor the sound hadith read here contains a plain statement about beings on another planet; the sources have verses about creatures God dispersed in the heavens and the earth and about a creation people do not know. Al-Tabari, from Mujahid, reads them as people and angels, Ibn Kathir as angels, jinn, people and all animals, and al-Razi holds it not far-fetched that there are kinds of animal in the heavens and that God is able to create other worlds. {cite:tafsir-ibn-kathir on 42:29} {cite:mafatih-al-ghayb-quran-tafsir-net on 42:29}"
  ur: "قرآن اور یہاں پڑھی گئی صحیح احادیث میں کسی اور سیارے کے باشندوں کے بارے میں صاف بیان نہیں؛ مصادر میں ان جانداروں کا ذکر ہے جنہیں اللہ نے آسمانوں اور زمین میں پھیلایا اور ایک ایسی تخلیق کا جسے لوگ نہیں جانتے۔ طبری مجاہد سے انسان اور فرشتے، ابن کثیر فرشتے، جن، انسان اور تمام حیوانات مراد لیتے ہیں، اور رازی کے نزدیک یہ بعید نہیں کہ آسمانوں میں حیوانات کی اقسام ہوں اور اللہ دوسرے عوالم پیدا کرنے پر قادر ہے۔ {cite:tafsir-ibn-kathir on 42:29} {cite:mafatih-al-ghayb-quran-tafsir-net on 42:29}"
