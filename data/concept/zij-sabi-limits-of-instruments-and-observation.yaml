class: concept
kind: scientific
label: { ar: "حدود الآلات والرصد وختام الكتاب", en: "The limits of instruments and observation, and the close of the book", ur: "آلات اور رصد کی حدود اور کتاب کا اختتام", es: "Los límites de los instrumentos y la observación, y el cierre del libro.", fr: "Les limites des instruments et de l'observation, et la fin du livre" }
summary:
  ar: "يختم البتاني كتابه بالقول إن ما ذُكر من علل الأشياء وتخارج أصول الحساب الجاري على طريق البرهان الهندسي لا يتغير في سائر الدهور، وأما ما يُعرف بالقياسات والأرصاد والمحن والاعتبارات فإن الزيادة والنقصان فيه قد يُستدرك. فإذا كان الخطأ من قبل الآلة وبقيت الآلة على حالها كان الخطأ واحداً في الوقتين، وإن تغيرت الآلة مع الزمن بالاتساع والانضمام والاعوجاج يتغير الخطأ بحسب القلة والكثرة. والخطأ من الإنسان يبقى يسيراً مع الاجتهاد والتحرز. {cite:zij-sabi-nallino-byblion pp.213-214}"
  en: "Al-Battani closes the book by saying that the causes of things and the derivations of the reckoning, which follow geometrical proof, do not change in any age. What is known only by measurement, observation, trial and reflection can be corrected by later work. If the error lies in the instrument and the instrument stays the same, the error is the same at both times; if the instrument changes over time through expansion, contraction or bending, the error changes with its size. Human error stays small with care and diligence. {cite:zij-sabi-nallino-byblion pp.213-214}"
  ur: "البتانی کتاب کا اختتام اس بات پر کرتے ہیں کہ اشیا کی علتیں اور حساب کی اصولی استخراجات، جو ہندسی دلیل کے طریقے پر چلتی ہیں، کسی زمانے میں نہیں بدلتیں۔ مگر جو باتیں پیمائش، رصد، آزمائش اور غور سے معلوم ہوتی ہیں ان میں بعد کی کوشش سے زیادتی اور کمی درست ہو سکتی ہے۔ اگر غلطی آلے کی وجہ سے ہو اور آلہ اپنی حالت پر رہے تو دونوں وقتوں میں غلطی ایک ہی ہوتی ہے؛ اگر آلہ وقت کے ساتھ پھیلنے، سکڑنے یا مڑنے سے بدلے تو غلطی اس کی کمی زیادتی کے مطابق بدلتی ہے۔ انسان کی غلطی احتیاط اور کوشش سے کم رہتی ہے۔ {cite:zij-sabi-nallino-byblion pp.213-214}"
  es: "Al-Battani concluye su libro afirmando que las causas de las cosas y las derivaciones de los cálculos, que siguen una demostración geométrica, no cambian con el paso del tiempo. Lo que se conoce únicamente mediante la medición, la observación, la prueba y la reflexión puede corregirse con trabajos posteriores. Si el error reside en el instrumento y este permanece invariable, el error es el mismo en ambos momentos; si el instrumento se modifica con el tiempo por dilatación, contracción o deformación, el error varía en proporción a su tamaño. El error humano se reduce con cuidado y diligencia. {cite:zij-sabi-nallino-byblion pp.213-214}"
  fr: "Al-Battani conclut son ouvrage en affirmant que les causes des choses et les dérivations du calcul, qui suivent une démonstration géométrique, demeurent immuables à travers les âges. Ce qui n'est connu que par la mesure, l'observation, l'expérimentation et la réflexion peut être corrigé par des travaux ultérieurs. Si l'erreur provient de l'instrument et que celui-ci reste inchangé, l'erreur demeure la même. En revanche, si l'instrument évolue au fil du temps par dilatation, contraction ou déformation, l'erreur varie en fonction de cette dilatation. L'erreur humaine reste minime grâce à la rigueur et à la diligence. {cite:zij-sabi-nallino-byblion pp.213-214}"
