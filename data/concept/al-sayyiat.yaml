id: concept/al-sayyiat
class: concept
kind: ethical
label:
  ar: "السيئات"
  en: "Sayyi'at (evil deeds and sins)"
  ur: "سیّیات ⁦(برے کام اور گناہ)⁩"
summary:
  ar: "السيئات في لسان المصدرين هي الأعمال السيئة والذنوب والمعاصي التي تُكتب على العبد ويُجازى عليها. يوحّد هذا السجل موضوعها في المتحف: آية [[passage/quran-11-114|الحسنات يذهبن السيئات]]، والحديث القدسي في [[passage/muslim-0128|صحيح مسلم 128]] «إذا هم عبدي بسيئة…»، وقسم الذنوب إلى كبائر وصغائر في [[passage/quran-53-32|النجم 32]]، مع ما يتصل بها من توبة واستغفار ومحو. يضمّه متصفح السيئات مع كل ذكر له في القرآن والسنة والسيرة والكتب المحصّلة."
  en: "In the sources' idiom, al-sayyi'at are the evil deeds, sins and disobedience written against the servant and requited. This record gathers their theme in the museum: the verse [[passage/quran-11-114|good deeds annul ill-deeds]]، the hadith qudsi of [[passage/muslim-0128|Sahih Muslim 128]] «if My servant intends an evil deed…»، the division of sins into major and minor in [[passage/quran-53-32|al-Najm 32]]، and what attaches to them of repentance، seeking forgiveness and expiation. The Sayyi'at Browser gathers it with every mention across the Qur'an، the Sunnah، the seerah and the harvested books."
  ur: "مآخذ کی زبان میں سیّیات وہ برے کام، گناہ اور نافرمانیاں ہیں جو بندے پر لکھی جاتی ہیں اور ان کا بدلہ دیا جاتا ہے۔ یہ ریکارڈ میوزیم میں ان کا مجموعی موضوع یکجا کرتا ہے: آیت [[passage/quran-11-114|نیکیاں برائیوں کو دور کرتی ہیں]]، حدیثِ قدسیہ [[passage/muslim-0128|صحیح مسلم 128]] «جب میرا بندہ برائی کا ارادہ کرے…»، گناہوں کی کبائر اور صغائر میں تقسیم [[passage/quran-53-32|النجم 32]] میں، اور ان سے جڑی توبہ، استغفار اور کفارہ۔ سیّیات کا براؤزر ان تمام ذکر کو قرآن، سنت، سیرت اور حاصل شدہ کتابوں میں جمع کرتا ہے۔"
