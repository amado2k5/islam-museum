id: concept/lahjat-al-hijaz
class: concept
kind: term
tags: [arabiyya-browser, arabiyya-dialects]
label:
  ar: "لهجة الحجاز"
  en: "The dialect of the Hejaz"
  ur: "حجاز کی بولی"
  fr: "Le dialecte du Hedjaz"
  es: "El dialecto del Hiyaz"
summary:
  ar: "ما قُرئ عن كلام الحجاز: موضع الحجاز في دائرة المعارف البريطانية، وما نقله السيوطي عن ابن جني في لغة الحجاز وتميم في إعمال ما، وألفاظ وصيغ تُنسب إلى أهل الحجاز عن القالي وابن درستويه، وقريش وحاضرة الحجاز عند السيوطي وابن خلدون. ولم يُعثر على وصف للهجة الحجازية المعاصرة ولا على عدد متكلميها. وأضاف لاحقاً ملخص بحثي قُدّم إلى المتحف أقساماً عن التصنيف وأبرز الخصائص وأعداد المتكلمين؛ ولم يفتح المتحف الصفحات التي يستشهد بها."
  en: "What was read of the speech of the Hejaz: the place of the Hejaz in the Encyclopaedia Britannica; what al-Suyuti relays from Ibn Jinni on the Hejaz and Tamim over the working of 'ma'; words and forms ascribed to the people of the Hejaz from al-Qali and Ibn Durustawayh; and Quraysh and the settled people of the Hejaz in al-Suyuti and Ibn Khaldun. No description of the contemporary Hejazi dialect, and no count of its speakers, was found. A research summary supplied to the museum later added sections on classification, main features and speaker numbers; the museum did not open the pages it cites."
  ur: "حجاز کے کلام کے بارے میں جو پڑھا گیا: انسائیکلوپیڈیا برٹانیکا میں حجاز کا مقام؛ ما کے عمل میں حجاز اور تمیم کے بارے میں جو سیوطی ابن جنی سے نقل کرتے ہیں؛ قالی اور ابن درستویہ سے اہل حجاز کی طرف منسوب الفاظ اور صیغے؛ اور سیوطی اور ابن خلدون کے ہاں قریش اور حجاز کے شہری لوگ۔ آج کی حجازی بولی کی کوئی توصیف اور اس کے بولنے والوں کی کوئی تعداد نہیں ملی۔ بعد میں عجائب گھر کو فراہم کردہ ایک تحقیقی خلاصے نے درجہ بندی، نمایاں خصوصیات اور بولنے والوں کی تعداد کے حصے شامل کیے؛ عجائب گھر نے اس کے حوالہ کردہ صفحات نہیں کھولے۔"
  fr: "Ce qui a été lu sur le parler du Hedjaz : la place du Hedjaz dans l'Encyclopaedia Britannica ; ce qu'al-Suyuti relaie d'Ibn Jinni sur le Hedjaz et Tamim à propos du fonctionnement de « ma » ; des mots et des formes attribués aux gens du Hedjaz d'après al-Qali et Ibn Durustawayh ; et Quraysh et les sédentaires du Hedjaz chez al-Suyuti et Ibn Khaldun. Aucune description du dialecte hedjazi contemporain, ni aucun décompte de ses locuteurs, n'a été trouvée. Un dossier de recherche fourni au musée a ajouté ensuite des sections sur la classification, les principaux traits et le nombre de locuteurs ; le musée n'a pas ouvert les pages qu'il cite."
  es: "Lo que se leyó sobre el habla del Hiyaz: el lugar del Hiyaz en la Encyclopaedia Britannica; lo que al-Suyuti transmite de Ibn Jinni sobre el Hiyaz y Tamim a propósito del funcionamiento de «ma»; palabras y formas atribuidas a la gente del Hiyaz según al-Qali e Ibn Durustawayh; y Quraysh y los sedentarios del Hiyaz en al-Suyuti e Ibn Jaldún. No se halló ninguna descripción del dialecto hiyazí contemporáneo ni un recuento de sus hablantes. Un archivo de investigación entregado al museo añadió después secciones sobre la clasificación, los rasgos principales y el número de hablantes; el museo no abrió las páginas que cita."
