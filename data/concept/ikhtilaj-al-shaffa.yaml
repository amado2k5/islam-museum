id: concept/ikhtilaj-al-shaffa
class: concept
kind: scientific
label:
  ar: "اختلاج الشفة"
  en: "The lip's tremor"
  ur: "ہونٹ کا لرزنا"
  es: "El temblor del labio"
  fr: "Le tremblement de la lèvre"
summary:
  ar: "اختلاج الشفة أكثر ما يعرض يعرض لمشاركة فم المعدة وخصوصاً إذا كان بها غثيان وحركة نحو دفع شيء بالقذف لا سيما في الأمراض الحادة وأوقات البحارين، وقد يكون بمشاركة العصب الجائي إليها من الدماغ والنخاع بمشاركتها للدماغ {cite:canon-ibn-sina-print-v2 p.284}"
  en: "The lip's tremor mostly comes by sharing with the mouth of the stomach — especially when it holds nausea and a motion towards casting something out, above all in the acute diseases and the times of crises; and it may be by sharing of the nerve reaching it from the brain and the spinal cord, by its sharing with the brain {cite:canon-ibn-sina-print-v2 p.284}"
  ur: "ہونٹ کا لرزنا اکثر معدے کے منہ کی مشارکت سے ہوتا ہے — خصوصاً جب وہاں متلی اور کچھ قے کرنے کی حرکت ہو، خاص طور پر شدید امراض اور بحران کے اوقات میں؛ اور وہ اس اعصاب کی مشارکت سے بھی ہو سکتا ہے جو دماغ اور نخاع سے اس تک آتا ہے {cite:canon-ibn-sina-print-v2 p.284}"
  es: "El temblor del labio se debe principalmente a la conexión con la boca del estómago, especialmente cuando hay náuseas y un movimiento hacia la expulsión de algo, sobre todo en enfermedades agudas y en momentos de crisis; y puede deberse a la conexión del nervio que lo llega desde el cerebro y la médula espinal, por su conexión con el cerebro {cite:canon-ibn-sina-print-v2 p.284}"
  fr: "Le tremblement de la lèvre provient principalement de la communication avec la bouche de l'estomac — surtout en cas de nausées et de sensation de vomissement, particulièrement lors de maladies aiguës et de crises; et il peut également provenir de la communication avec le cerveau via le nerf qui l'innerve (provenant du cerveau et de la moelle épinière) {cite:canon-ibn-sina-print-v2 p.284}"
