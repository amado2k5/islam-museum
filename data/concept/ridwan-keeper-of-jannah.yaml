id: concept/ridwan-keeper-of-jannah
class: concept
kind: angel
label:
  ar: رضوان خازن الجنة
  en: Ridwan, Keeper of Paradise
  ur: بہشت کا خازن رضوان
  es: "Ridwan, guardián del paraíso"
  fr: "Ridwan, gardien du paradis"
summary:
  ar: اسم روي في الحديث عن خازن الجنة الذي يطوف به أهل الجنة، ومنه مشتق معنى الرضا الإلهي في اللغة؛ ويذكره بعضهم في معرض مدح الجنات، ولهذا اختلف أهل العلم في درجته.
  en: An angel named in hadith as the keeper of Paradise whom its people circle, and from whose name the idea of divine pleasure derives; scholars differ on the strength of the reports.
  ur: وہ فرشتہ جس کا نام حدیث میں بہشت کے خازن کے طور پر آیا جس کے گرد بہشتی گشت کرتے ہیں اور جس کے نام سے رضائے الٰہی کا مفہوم لیا جاتا ہے؛ علمائے کرام اس کی درجہ بندی میں مختلف ہیں۔
  es: "Un ángel mencionado en los hadices como el guardián del Paraíso, al que sus habitantes rodean, y de cuyo nombre deriva la idea del placer divino; los eruditos difieren en cuanto a la solidez de los relatos."
  fr: "Un ange mentionné dans les hadiths comme le gardien du Paradis, autour duquel ses habitants s'entourent, et dont le nom dérive l'idée de plaisir divin; les érudits divergent quant à la force des récits."
