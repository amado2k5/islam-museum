id: concept/ridwan-keeper-of-jannah
class: concept
kind: angel
label:
  ar: رضوان خازن الجنة
  en: Ridwan, Keeper of Paradise
  ur: بہشت کا خازن رضوان
summary:
  ar: اسم روي في الحديث عن خازن الجنة الذي يطوف به أهل الجنة، ومنه مشتق معنى الرضا الإلهي في اللغة؛ ويذكره بعضهم في معرض مدح الجنات، ولهذا اختلف
    أهل العلم في درجته.
  en: An angel named in hadith as the keeper of Paradise whom its people circle, and from whose name the idea of divine pleasure derives; scholars
    differ on the strength of the reports.
  ur: وہ فرشتہ جس کا نام حدیث میں بہشت کے خازن کے طور پر آیا جس کے گرد بہشتی گشت کرتے ہیں اور جس کے نام سے رضائے الٰہی کا مفہوم لیا جاتا ہے؛ علمائے
    کرام اس کی درجہ بندی میں مختلف ہیں۔
