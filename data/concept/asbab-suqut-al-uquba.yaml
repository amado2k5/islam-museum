id: concept/asbab-suqut-al-uquba
class: concept
kind: doctrine
label: { ar: "أسباب سقوط العقوبة عن الذنوب", en: "The causes that remove punishment for sins", ur: "گناہوں کی سزا ساقط کرنے والے اسباب" }
summary:
  ar: "قاعدة يعرضها ابن تيمية في منهاج السنة: أن ذنوب المؤمنين سبب للعذاب، لكن العقوبة عليها في الآخرة تندفع بنحو عشرة أسباب: التوبة، والاستغفار، والحسنات الماحية، ودعاء المؤمنين، ودعاء النبي وشفاعته، وما يُهدى للميت من عمل صالح، والمصائب الدنيوية، وفتنة القبر، وأهوال يوم القيامة، والقصاص بين المؤمنين على القنطرة. ويسوقها في الدفاع عن الصحابة."
  en: "A principle Ibn Taymiyya sets out in Minhaj al-Sunna: the sins of believers are a cause of punishment, but punishment for them in the hereafter is averted by about ten causes – repentance, asking forgiveness, good deeds that erase, the prayers of believers, the Prophet's prayer and intercession, good works gifted to the dead, worldly afflictions, the trial of the grave, the terrors of the Day of Resurrection, and the settling of scores among believers on the bridge. He uses it in defending the Companions."
  ur: "ایک اصول جسے ابن تیمیہ منہاج السنہ میں پیش کرتے ہیں: مومنوں کے گناہ عذاب کا سبب ہیں، مگر آخرت میں ان کی سزا تقریباً دس اسباب سے ٹل جاتی ہے – توبہ، استغفار، مٹانے والی نیکیاں، مومنوں کی دعا، نبی کی دعا اور شفاعت، میت کو ہدیہ کیے گئے نیک اعمال، دنیاوی مصیبتیں، قبر کی آزمائش، قیامت کی ہولناکیاں، اور پل پر مومنوں کا باہمی قصاص۔ وہ اسے صحابہ کے دفاع میں استعمال کرتے ہیں۔"
