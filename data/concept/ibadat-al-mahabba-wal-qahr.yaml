id: concept/ibadat-al-mahabba-wal-qahr
class: concept
kind: doctrine
label:
  ar: "عبادة المحبوبية وعبادة القهر"
  en: "Worship of love and worship of compulsion"
  ur: "عبادتِ محبوبیت اور عبادتِ قہر"
summary:
  ar: "تمييز الشعراوي بين عبادة القهر، التي تشمل كل مخلوق يسير على ما قُدّر له، وعبادة المحبوبية، التي يريدها الله من الجن والإنس فيأتونه عن اختيار وحب. ويستدل بأن القلب ينبض والمعدة تهضم بغير اختيار الإنسان، فمنطقة الاختيار هي أن يفعل الإنسان المنهج أو يتركه. ويفرّق بين «العبيد» و«العباد»، ويرى أن الخطاب بالتكليف يوجَّه إلى المؤمنين الذين يلتزمون بالعقد الإيماني {cite:tafsir-sharawi-khawatir-scan p.80} {cite:tafsir-sharawi-khawatir-scan p.81} {cite:tafsir-sharawi-khawatir-scan p.82}. هذا تفسيره ويُنسب إليه."
  en: "Sha'rawi distinguishes worship by compulsion, which every created thing renders, from worship of love, which God wants from jinn and humans, who come to Him by choice. He notes that the heartbeat and digestion are beyond human choice, so the sphere of choice is whether one follows the method. He separates 'slaves' (abid) from 'servants' ('ibad) and holds that the commands of duty are addressed to believers who enter a faith covenant {cite:tafsir-sharawi-khawatir-scan p.80} {cite:tafsir-sharawi-khawatir-scan p.81} {cite:tafsir-sharawi-khawatir-scan p.82}. This is Sha'rawi's reading and is attributed to him."
  ur: "شعراوی قہری عبادت میں فرق کرتے ہیں، جو ہر مخلوق ادا کرتی ہے، اور محبوبیت کی عبادت میں، جو اللہ جن و انس سے چاہتا ہے کہ وہ اپنے اختیار اور محبت سے اس کی طرف آئیں۔ ان کا استدلال ہے کہ دل کی دھڑکن اور ہضم انسان کے اختیار سے باہر ہیں، اس لیے انتخاب کا دائرہ یہ ہے کہ آدمی منہج پر چلے یا چھوڑ دے۔ وہ «عبید» اور «عباد» میں فرق کرتے ہیں اور کہتے ہیں کہ تکلیف کے احکام ان مومنین سے ہیں جو ایمانی عہد میں آتے ہیں {cite:tafsir-sharawi-khawatir-scan p.80} {cite:tafsir-sharawi-khawatir-scan p.81} {cite:tafsir-sharawi-khawatir-scan p.82}۔ یہ شعراوی کی تفسیر ہے اور ان کی طرف منسوب ہے۔"
wings: [ideas]
