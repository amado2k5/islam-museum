issue:
  ar: "ما الفرق بين عبادة القهر وعبادة المحبوبية، ولماذا جُعل الاختيار للإنسان؟"
  en: "What is the difference between worship by compulsion and worship of love, and why is choice given to humans?"
  ur: "عبادتِ قہر اور عبادتِ محبوبیت میں کیا فرق ہے، اور انسان کو اختیار کیوں دیا گیا؟"
perspectives:
  - tradition: sunni
    id: sharawi-mahabba
    stance:
      ar: "الاختيار شرط محبة العبادة، والقهر لا يثبت إلا القدرة"
      en: "Choice is the condition of worship as love; compulsion shows only power"
      ur: "اختیار محبت کی عبادت کی شرط ہے، جبر صرف قدرت ظاہر کرتا ہے"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقرر الشعراوي أن الله خلق الإنسان مختاراً ليحبه المؤمن عن رضا، وأن القهر وحده يثبت الجبروت لا المحبوبية {cite:tafsir-sharawi-khawatir-scan p.37} {cite:tafsir-sharawi-khawatir-scan p.80}."
      en: "Sha'rawi holds that God made the human choosing so that the believer loves Him by consent; compulsion alone shows majesty, not being beloved {cite:tafsir-sharawi-khawatir-scan p.37} {cite:tafsir-sharawi-khawatir-scan p.80}."
      ur: "شعراوی کے مطابق اللہ نے انسان کو مختار بنایا تاکہ مومن اپنی رضا سے اس سے محبت کرے، اور محض جبر سے جبروت ثابت ہوتا ہے، محبوبیت نہیں {cite:tafsir-sharawi-khawatir-scan p.37} {cite:tafsir-sharawi-khawatir-scan p.80}۔"
    sources: [source/tafsir-sharawi-khawatir-scan]
