label:
  ar: "يَوم"
  en: "Yawm (the day, fiqh)"
  es: "Yawm (el día, fiqh)"
  fr: "Yawm (le jour, fiqh)"
summary:
  ar: "اليوم في اللغة مقدار من الزمان من طلوع الشمس إلى غروبها، وفي اصطلاح الفقهاء زمان ممتد من طلوع الفجر الثاني إلى غروب الشمس، فيكون أطول من النهار. يترتب عليه أحكام في النذر والاعتكاف والتعليق: فمن نذر اعتكاف يوم غير معين لزمه عند الجمهور أن يدخل معتكفه قبل الفجر ويخرج بعد الغروب، ومن علّق طلاقاً بيوم معين وقع في فجر ذلك اليوم عند جمهور الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18011} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18013} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18016}"
  en: "Yawm is lexically a stretch of time from sunrise to sunset, and in the jurists' usage the span from the rising of the second dawn to sunset, so it is longer than the day-light nahr. Legal rules attach to it in vows, retreat and conditional divorce: one who vows a retreat of an unspecified day must, on the majority view, enter the mosque before dawn and leave after sunset, and a divorce suspended on a named day falls at that day's dawn according to most jurists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18011} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18013} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18016}"
  es: "Yawm es léxicamente un lapso de tiempo desde el amanecer hasta el atardecer, y en el uso de los juristas, el lapso desde el amanecer del segundo día hasta el atardecer, por lo que es más largo que el nahr diurno. Se le aplican normas legales en materia de votos, retiros y divorcios condicionales: quien jura un retiro de un día no especificado debe, según la opinión mayoritaria, entrar en la mezquita antes del amanecer y salir después del atardecer, y un divorcio suspendido en un día determinado se hace efectivo al amanecer de ese día, según la mayoría de los juristas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18011} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18013} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18016}"
  fr: "Yawm désigne le temps écoulé entre le lever et le coucher du soleil. En droit, il s'agit de la période allant de l'aube au coucher du soleil, soit une durée supérieure à celle du nahr (période de clarté diurne). Des règles juridiques s'y rattachent, notamment en matière de vœux, de retraite et de divorce conditionnel: celui qui fait vœu de retraite à une date indéterminée doit, selon l'avis majoritaire, entrer dans la mosquée avant l'aube et en sortir après le coucher du soleil; de même, un divorce suspendu à une date précise prend effet à l'aube de ce jour, d'après la plupart des juristes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18011} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18013} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18016}"
