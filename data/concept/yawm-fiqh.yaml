  en: "Yawm (the day, fiqh)"
summary:
  ar: "اليوم في اللغة مقدار من الزمان من طلوع الشمس إلى غروبها، وفي اصطلاح الفقهاء زمان ممتد من طلوع الفجر الثاني إلى غروب الشمس، فيكون أطول من النهار. يترتب عليه أحكام في النذر والاعتكاف والتعليق: فمن نذر اعتكاف يوم غير معين لزمه عند الجمهور أن يدخل معتكفه قبل الفجر ويخرج بعد الغروب، ومن علّق طلاقاً بيوم معين وقع في فجر ذلك اليوم عند جمهور الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18011} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18013} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18016}"
  en: "Yawm is lexically a stretch of time from sunrise to sunset, and in the jurists' usage the span from the rising of the second dawn to sunset, so it is longer than the day-light nahr. Legal rules attach to it in vows, retreat and conditional divorce: one who vows a retreat of an unspecified day must, on the majority view, enter the mosque before dawn and leave after sunset, and a divorce suspended on a named day falls at that day's dawn according to most jurists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18011} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18013} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.18016}"
