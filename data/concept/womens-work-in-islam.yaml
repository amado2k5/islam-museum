id: concept/womens-work-in-islam
class: concept
kind: social
label:
  ar: عمل المرأة في الإسلام
  en: Women's work in Islam
summary:
  ar: "يقرر المراغي أن المرأة شقيقة الرجل في الأصل والإنسانية، وأن الإسلام منحها حق التملك والبيع والشراء والهبة والميراث، فكان من لازم ذلك أن تتعلم وتعمل {cite:min-qadaya-al-mal-wal-amal-azhar p. 23}. ويستدل بخروج أمهات المؤمنين والصحابيات إلى التعليم والخدمة العامة، ويذكر عائشة معلّمة للإسلام، وأن البخاري روى لها أربعة وخمسين حديثًا، وهو عدد يذكره الكتاب ولم يُتحقق منه هنا {cite:min-qadaya-al-mal-wal-amal-azhar p. 23}. ويذكر أسماء بنت أبي بكر في خدمة الهجرة، ومشاركة أم سليم وعائشة في سقي الجرحى يوم أحد {cite:min-qadaya-al-mal-wal-amal-azhar p. 24} {cite:min-qadaya-al-mal-wal-amal-azhar p. 25}. ويجيز الكتاب عمل المرأة ما دام بجد وحشمة، ولا يؤدي إلى ضرر خلقي أو اجتماعي، ولا يعوقها عن واجباتها نحو زوجها وأولادها {cite:min-qadaya-al-mal-wal-amal-azhar p. 24}. ويرى أن الأسرة القادرة ماليًا قد تغنيها عن عمل المرأة، لتتفرغ للبيت، وتفسح الفرصة للرجل ليعول الأسرة {cite:min-qadaya-al-mal-wal-amal-azhar p. 25}."
  en: "Al-Maraghi holds women and men to be of one origin and one humanity, and that Islam gave women rights of ownership, sale, gifts and inheritance, so they should learn and work (p. 23). He cites Aisha as a teacher of Islam, and reports that Bukhari has fifty-four hadiths from her, a count the book prints but which was not checked here (p. 23). He cites Asma bint Abi Bakr's role in the Hijra and women tending the wounded at Uhud (pp. 24-25). Work is allowed with modesty and without harm to family duties (p. 24). A family with means may leave the woman free of work (p. 25)."
