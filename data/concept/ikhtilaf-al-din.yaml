id: concept/ikhtilaf-al-din
class: concept
kind: legal
label:
  ar: اختلاف الدين
  en: Ikhtilaf al-din (difference of religion and its rulings)
  es: "Ikhtilaf al-din (diferencia de religión y sus preceptos)"
  fr: "Ikhtilaf al-din (différence de religion et ses règles)"
  ur: "اختلاف الدین ⁦(دین کا فرق اور اس کے احکام)⁩"
summary:
  ar: 'اختلاف الدين يستتبع أحكاماً منها: امتناع التوارث، ومنع ولاية النكاح باختلاف الإسلام والكفر، والنكاح بين المسلم والكتابية، وحضانة الرجل عند الحنفية، وتبعية الولد لخير الوالدين ديناً، ومنع العقل بين المسلم والكافر، ومنع نفقة الأقارب إلا الأصول والفروع عند الحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1957} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1958} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1959} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1960}. وفي الوصية والشركة والقذف: تصح الوصية بين المسلم والذمي عند الجمهور، وتصح الشركة بين المسلم والكافر مع شروط عند المالكية والحنابلة، ولا حد على المسلم في قذف الكافر وعلى الذمي حد في قذف المسلم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1961} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1962}.'
  en: 'Difference of religion brings rulings: the bar to inheritance, the bar to guardianship in marriage between Islam and unbelief, marriage with a woman of the book, the Hanafi bar to a man''s custody, the child''s following the better parent in religion, the bar to bearing blood-money between Muslim and unbeliever, and the bar to kin maintenance except ascendants and descendants according to the Hanbalis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1957} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1958} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1959} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1960}. On bequests, partnership and slander: a bequest between a Muslim and a dhimmi is valid by the majority; partnership between Muslim and unbeliever is valid with conditions by the Malikis and Hanbalis; no hadd on a Muslim who slanders an unbeliever, but a dhimmi who slanders a Muslim is flogged. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1961} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1962}.'
  es: "La diferencia de religión trae consigo dictámenes: la prohibición de herencia, la prohibición de tutela en el matrimonio entre el Islam y la incredulidad, el matrimonio con una mujer del libro, la prohibición Hanafi de la custodia de un hombre, el hijo siguiendo al mejor padre en religión, la prohibición de pagar dinero de sangre entre musulmán y no creyente, y la prohibición del mantenimiento de parientes excepto ascendientes y descendientes según los Hanbalis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1957} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1958} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1959} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1960}. Sobre legados, sociedad y calumnia: un legado entre un musulmán y un dhimmi es válido por la mayoría; la asociación entre musulmanes e incrédulos es válida con las condiciones de los Malikis y Hanbalis; No hay castigo para un musulmán que calumnia a un incrédulo, pero un dhimmi que calumnia a un musulmán es azotado. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1961} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1962}."
  fr: "La différence de religion entraîne des décisions: l’interdiction de l’héritage, l’interdiction de la tutelle en cas de mariage entre musulmans et non-musulmans, l’interdiction du mariage avec une femme du Livre, l’interdiction hanafite de la garde d’un enfant, l’obligation pour l’enfant de suivre le parent pratiquant le plus éclairé, l’interdiction du paiement du prix du sang entre musulmans et non-musulmans, et l’interdiction de l’entretien des proches, sauf des ascendants et des descendants, selon l’école hanbalite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1957} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1958} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1959} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1960}. Concernant les legs, les partenariats et la calomnie: un legs entre un musulman et un dhimmi est valide à la majorité. le partenariat entre musulman et incroyant est valable sous les conditions des Malikis et des Hanbalis; pas de hadd sur un musulman qui calomnie un incroyant, mais un dhimmi qui calomnie un musulman est fouetté. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1961} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1962}."
  ur: "اختلافِ مذہب سے احکام آتے ہیں: وراثت کی پابندی، اسلام اور کفر کے درمیان نکاح میں ولایت کی پابندی، کتابی عورت سے نکاح، حنفی مرد کی تحویل میں، بچے کی دین میں بہتر والدین کی پیروی، مسلمان اور کافر کے درمیان خون بہانے کی پابندی، اور حنفیوں کے لیے حنفی کے لیے بار۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1957} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1958} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1959} صفحہ 1960}۔ وصیت، شراکت اور بہتان پر: مسلمان اور ذمی کے درمیان وصیت جمہور کے نزدیک درست ہے۔ مسلم اور کافر کے درمیان شراکت مالکیوں اور حنبلیوں کی شرائط کے ساتھ جائز ہے۔ کافر پر تہمت لگانے والے مسلمان پر کوئی حد نہیں، لیکن ذمی جو مسلمان پر تہمت لگائے اسے کوڑے مارے جاتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1961} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1962}۔"
