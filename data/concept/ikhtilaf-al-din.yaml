label:
  ar: اختلاف الدين
  en: Ikhtilaf al-din (difference of religion and its rulings)
summary:
  ar: 'اختلاف الدين يستتبع أحكاماً منها: امتناع التوارث، ومنع ولاية النكاح باختلاف الإسلام والكفر، والنكاح بين المسلم والكتابية، وحضانة الرجل عند الحنفية، وتبعية الولد لخير الوالدين ديناً، ومنع العقل بين المسلم والكافر، ومنع نفقة الأقارب إلا الأصول والفروع عند الحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1957} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1958} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1959} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1960}. وفي الوصية والشركة والقذف: تصح الوصية بين المسلم والذمي عند الجمهور، وتصح الشركة بين المسلم والكافر مع شروط عند المالكية والحنابلة، ولا حد على المسلم في قذف الكافر وعلى الذمي حد في قذف المسلم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1961} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1962}.'
  en: 'Difference of religion brings rulings: the bar to inheritance, the bar to guardianship in marriage between Islam and unbelief, marriage with a woman of the book, the Hanafi bar to a man''s custody, the child''s following the better parent in religion, the bar to bearing blood-money between Muslim and unbeliever, and the bar to kin maintenance except ascendants and descendants according to the Hanbalis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1957} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1958} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1959} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1960}. On bequests, partnership and slander: a bequest between a Muslim and a dhimmi is valid by the majority; partnership between Muslim and unbeliever is valid with conditions by the Malikis and Hanbalis; no hadd on a Muslim who slanders an unbeliever, but a dhimmi who slanders a Muslim is flogged. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1961} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1962}.'
