label:
  ar: "العَقار"
  en: "Immovable property, real estate (aqar) and its legal effects"
  ur: "عقار (غیر منقولہ جائیداد)"
summary:
  ar: "العقار في اللغة كل ما له أصل وقرار ثابت كالأرض والدار والضياع والنخل، وفي الاصطلاح الثابت الذي لا يمكن نقله وتحويله من مكان إلى آخر، مثل الأرض والدار، والمنقول ما يمكن نقله من محل إلى آخر {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11693} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11694}. ويترتب على التفريق بين العقار والمنقول أحكام، منها الشفعة التي تثبت في العقار دون المنقول عند الجمهور، والوقف، ووجوب الإنفاق من مال القاصر، وبيع مال المدين المحجور، وحقوق الارتفاق التي تتعلق بالعقار دون المنقول {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11694} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11695}. ومن أحكامه الصلاة في الأرض المغصوبة، وفيها خلاف، فالجمهور على صحتها مع الإثم، والحنابلة على عدم صحتها {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11696} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11697}. ولا زكاة على الحوائج الأصلية من العقار كالمسكن، ولا على المستغلات عند جمهور الفقهاء، وأجاز بعض الحنابلة زكاتها {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11698} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11699}. وفي البيع يجوز للمالك بيع عقاره ملكاً تاماً أو حصة شائعة بشروط، وللوصي والولي بيع عقار القاصر بضوابط تختلف، ومن شروط القبض فيه التخلية، ويُعد في ضمان الغلة وجوه متعددة، وللفقهاء في الغرس والبناء في الأرض المستحقة أو المؤجرة أحكام متقاربة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11699} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11700} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11701} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11702} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11703}. ويصح رهن كل ما صح بيعه، ويجري الغصب في العقار عند جمهور الفقهاء، ويصح وقفه بالاتفاق، وتتعلق بالعقار حقوق الارتفاق والشفعة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11703} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11704}."
  en: "In the lexicon, aqar is anything with a fixed base and a settled place, such as land, a house, an estate or palms; as a term it is what cannot be moved from one place to another, such as land and a house, while movables are what can be moved {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11693} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11694}. The distinction has effects: pre-emption applies to real estate and, by the majority, not to movables sold on their own; easements attach to real estate; the rules of sale for a minor's or a bankrupt's property differ; and endowments of real estate are valid by agreement {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11694} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11695} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11704}. Prayer on usurped land is valid according to the majority, though sinful, and invalid on the preferred Hanbali view {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11696} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11697}. There is no zakat on needs such as a home, and by the majority none on rented property; a Hanbali view requires it {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11698} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11699}. An owner may sell his real estate in full or a share, subject to rules on harm to co-owners, the sale of a guardian over a minor's property, and possession by delivery; the schools differ on the fruits of a defective sale returned and on planting or building on land whose title fails or which is leased {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11699} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11700} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11701} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11702} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11703}. Every item that may be sold may be mortgaged, and the rules of usurpation apply to real estate according to the majority {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11703}."
