id: concept/riba
education:
  did_you_know:
    ar: "يعدّ الربا في أدبيات الاقتصاد الإسلامي جريمة اقتصادية: وسيلة من الافتتان بالمال واستغلال لحاجات الناس وظروفهم المادية، يعاقب عليها صاحبها في الدنيا والآخرة."
    en: "Islamic-economic literature classes riba as an economic crime — a form of money-worship and exploitation of people's needs and circumstances, punished in this world and the next."
    ur: "اسلامی معاشیات کی کتابیں ربا کو معاشی جرم شمار کرتی ہیں — مال کی عبادت اور لوگوں کی ضروریات کے استحصال کی صورت، جس کا مرتکب دنیا اور آخرت میں سزا پاتا ہے۔"
    sources: [source/qadan-manhaj-iqtisad-quran, source/usul-iqtisad-islami-0660]
class: concept
kind: legal
label:
  ar: الربا
  en: "Usury (riba)"
summary:
  ar: "يذكر قعدات الربا بوصفه وسيلة من وسائل الافتتان بالمال، وصورة من استغلال حاجات الناس وظروفهم المادية، فيعدّه من الجرائم الاقتصادية {cite:qadan-manhaj-iqtisad-quran p. 140}. ويجعل الاشتغال به جريمة يعاقب عليها صاحبها في الدنيا والآخرة {cite:qadan-manhaj-iqtisad-quran p. 140}، ويستدل بآيات الأمر بترك ما بقي منه، ويعد التوبة بردّ رأس المال دون ظلم {cite:qadan-manhaj-iqtisad-quran p. 140}، {cite:qadan-manhaj-iqtisad-quran p. 141}. ويقابله عنده الإنفاق الذي يُراد به وجه الله {cite:qadan-manhaj-iqtisad-quran p. 141}. ويذكر المؤلف الربا بين الأسباب الممنوعة للتملك {cite:usul-iqtisad-islami-0660 p. 53}، ويعدّه من وسائل ابتزاز الفقراء في النظام الرأسمالي مع الاحتكار والضرائب المصممة لصالح الأغنياء {cite:usul-iqtisad-islami-0660 p. 47}، ويعدّ الآيات والأحاديث الناهية عن الربا من النصوص المتصلة بالاقتصاد {cite:usul-iqtisad-islami-0660 p. 35}. يرى المؤلف أن القرض ذا الفائدة المضمونة لا يجوز، وأن القراض بحصة من الربح الاحتمالي جائز تكون فيه المخاطرة على رب المال، وأن عقود الإرفاق لا تنقلب إلى عقود معاوضة، وأن جذب المدخرات يكون بالقراض لا بالقرض الربوي."
