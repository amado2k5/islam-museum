summary:
  ar: "يذكر قعدات الربا بوصفه وسيلة من وسائل الافتتان بالمال، وصورة من استغلال حاجات الناس وظروفهم المادية، فيعدّه من الجرائم الاقتصادية {cite:qadan-manhaj-iqtisad-quran p. 140}. ويجعل الاشتغال به جريمة يعاقب عليها صاحبها في الدنيا والآخرة {cite:qadan-manhaj-iqtisad-quran p. 140}، ويستدل بآيات الأمر بترك ما بقي منه، ويعد التوبة بردّ رأس المال دون ظلم {cite:qadan-manhaj-iqtisad-quran p. 140}، {cite:qadan-manhaj-iqtisad-quran p. 141}. ويقابله عنده الإنفاق الذي يُراد به وجه الله {cite:qadan-manhaj-iqtisad-quran p. 141}. ويذكر المؤلف الربا بين الأسباب الممنوعة للتملك {cite:usul-iqtisad-islami-0660 p. 53}، ويعدّه من وسائل ابتزاز الفقراء في النظام الرأسمالي مع الاحتكار والضرائب المصممة لصالح الأغنياء {cite:usul-iqtisad-islami-0660 p. 47}، ويعدّ الآيات والأحاديث الناهية عن الربا من النصوص المتصلة بالاقتصاد {cite:usul-iqtisad-islami-0660 p. 35}."
