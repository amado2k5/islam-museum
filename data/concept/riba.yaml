summary:
  ar: "يذكر قعدات الربا بوصفه وسيلة من وسائل الافتتان بالمال، وصورة من استغلال حاجات الناس وظروفهم المادية، فيعدّه من الجرائم الاقتصادية {cite:qadan-manhaj-iqtisad-quran p. 140}. ويجعل الاشتغال به جريمة يعاقب عليها صاحبها في الدنيا والآخرة {cite:qadan-manhaj-iqtisad-quran p. 140}، ويستدل بآيات الأمر بترك ما بقي منه، ويعد التوبة بردّ رأس المال دون ظلم {cite:qadan-manhaj-iqtisad-quran p. 140}، {cite:qadan-manhaj-iqtisad-quran p. 141}. ويقابله عنده الإنفاق الذي يُراد به وجه الله {cite:qadan-manhaj-iqtisad-quran p. 141}. ويذكر المؤلف الربا بين الأسباب الممنوعة للتملك {cite:usul-iqtisad-islami-0660 p. 53}، ويعدّه من وسائل ابتزاز الفقراء في النظام الرأسمالي مع الاحتكار والضرائب المصممة لصالح الأغنياء {cite:usul-iqtisad-islami-0660 p. 47}، ويعدّ الآيات والأحاديث الناهية عن الربا من النصوص المتصلة بالاقتصاد {cite:usul-iqtisad-islami-0660 p. 35}. يرى المؤلف أن القرض ذا الفائدة المضمونة لا يجوز، وأن القراض بحصة من الربح الاحتمالي جائز تكون فيه المخاطرة على رب المال، وأن عقود الإرفاق لا تنقلب إلى عقود معاوضة، وأن جذب المدخرات يكون بالقراض لا بالقرض الربوي."
  tr: "Faizciliği parayı baştan çıkarma aracı ve insanların ihtiyaçları ile maddi durumlarını sömürme biçimi olarak belirtir ve bunu ekonomik bir suç olarak görür {cite:qadan-manhaj-iqtisad-kur'an s. 140}. Buna karışmayı bu dünyada ve ahirette cezalandırılacak bir suç olarak görür {cite:qadan-manhaj-iqtisad-kur'an s. 140}, geriye kalanların terk edilmesini emreden ayetler alıntılar ve tövbe sözü vererek başkenti haksızlık olmadan geri vermeyi s. {cite:qadan-manhaj-iqtisad-kuran s. 140}, {cite:qadan-manhaj-iqtisad-kur'an s. 141}. Buna karşılık olarak Allah için yapılan harcamalar da vardır {cite:qadan-manhaj-iqtisad-kuran s. 141}. Yazar, tefeciliği mülkiyet için yasaklanmış nedenlerden biri olarak belirtir {cite:usul-iqtisad-islami-0660 s. 53}; kapitalist sistemde yoksulları tekel ve zenginlerin yararına vergilerle gasp etmenin bir yolu olarak görür {cite:usul-iqtisad-islami-0660 s. 47}} ve tefeciliği yasaklayan ayetler ile hadisleri ekonomiyle ilgili metinler olarak kabul eder {cite:usul-iqtisad-islami-0660 s. 35}. Yazar, garantili faizli bir kredinin izin verilemeyeceğine, potansiyel kârın payı ile kredi vermenin paranın sahibini riske attığı durumlarda izin verildiğine, haciz sözleşmelerinin değişim sözleşmesine dönüşmediğine ve tasarrufun tefecilik kredileri yerine krediler yoluyla yapıldığına inanır."
  id: "Ia menyebutkan riba sebagai cara untuk menggoda uang dan bentuk eksploitasi kebutuhan serta keadaan materi masyarakat, menganggapnya sebagai kejahatan ekonomi {cite:qadan-manhaj-iqtisad-quran hlm. 140}. Ia menganggap melakukannya sebagai kejahatan yang dapat dihukum di dunia ini dan akhirat {cite:qadan-manhaj-iqtisad-quran hlm. 140}, mengutip ayat-ayat yang memerintahkan pengabaian sisa-sisa, dan berjanji bertobat sebagai mengembalikan ibu kota tanpa ketidakadilan {cite:qadan-manhaj-iqtisad-quran hlm. 140}, {cite:qadan-manhaj-iqtisad-quran hlm. 141}. Sesuai dengan ini adalah pengeluaran yang dimaksudkan demi Allah {cite:qadan-manhaj-iqtisad-quran hlm. 141}. Penulis menyebutkan riba sebagai salah satu alasan terlarang untuk memiliki {cite:usul-iqtisad-islami-0660 hlm. 53}, menganggapnya sebagai cara memeras orang miskin dalam sistem kapitalis melalui monopoli dan pajak yang dirancang untuk kepentingan orang kaya {cite:usul-iqtisad-islami-0660 hlm. 47}, dan menganggap ayat-ayat dan hadits yang melarang riba sebagai teks yang berkaitan dengan ekonomi {cite:usul-iqtisad-islami-0660 hlm. 35}. Penulis percaya bahwa pinjaman dengan bunga yang dijamin tidak diperbolehkan, bahwa pinjaman dengan bagian dari potensi keuntungan diperbolehkan yang melibatkan risiko pemilik uang, bahwa kontrak penyitaan tidak berubah menjadi kontrak pertukaran, dan bahwa menarik tabungan dilakukan melalui pinjaman daripada pinjaman riba."
