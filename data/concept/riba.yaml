  ar: "الربا"
  en: "Riba (usury)"
summary:
  ar: "الربا في ورقة قدي وبوزيد زيادةٌ محرّمة تُقسم إلى ربا البيوع وربا القرض؛ ويعدّ الباحثان ربا البيوع معاوضةً ويرون أن القرض ليس من المعاوضات، ثم يقسمان ربا البيوع إلى ربا الفضل وربا النسيئة."
  en: "In the Qeddi and Bouzid paper riba is a forbidden excess, divided into riba of sales (ribā al-buyūʿ) and riba of loans (ribā al-qarḍ). The authors treat sales as exchange contracts and loans as not exchange contracts, and they split riba of sales into riba of excess (ribā al-faḍl) and riba of deferment (ribā al-nasīʾa)."
