label:
  ar: العطاس
  en: Sneezing
  ur: چھینک
summary:
  ar: العطاس حركة حامية من الدماغ لدفع خلط أو مؤذ آخر باستعانة من الهواء المستنشق دفعاً من طريق الأنف والفم وهو للدماغ كالسعال للرئة وما يليها، وضاره في أول النزلة والزكام وربما كثر في الحميات فأسقط القوة أو هيّج رعافاً، ويحل الفواق المادي بزعزعته؛ وأنفع ما فيه تجفيف الرأس إذا كانت المادة قليلة أو ريحية أو غليظة نضيجة، ودليل قوة الدماغ فمن قرب موته لا يستطيع أن يعطس ومن لم يعطس بالمعطسات فلا يرجى برؤه، ويعين على نفض الفضول ويسكن ثقل الرأس ⁦(سطر تسهيل الولادة وخروج المشيمة سطر موسوم مطروح لحكم المؤسس)⁩ {cite:canon-ibn-sina-print-v2 p.250} {cite:canon-ibn-sina-print-v2 p.251}
  en: 'The sneeze is a heated movement from the brain to expel a humour or another annoyance with the help of inhaled air, driving through the nose and the mouth; it is to the brain as the cough is to the lung and what follows it. It is harmful at the start of a nazla or zukam; in fevers it may multiply until it fells the strength or stirs a nosebleed — yet it resolves the material hiccup by its shaking. Its best use is drying the head when the matter is little, windy, or thick-but-ripened; and it is a sign of the brain''s strength: one near death cannot sneeze, and one who cannot sneeze even by sternutatories has no recovery to be hoped. It helps shake out retained wastes and calms the head''s heaviness ⁦(the line that it eases childbirth and the afterbirth''s exit is kept as a labelled listing for the founder''s ruling)⁩ {cite:canon-ibn-sina-print-v2 p.250} {cite:canon-ibn-sina-print-v2 p.251}'
  ur: 'چھینک دماغ کی طرف سے ایک گرم حرکت ہے جو کسی خلط یا دوسری مؤذی چیز کو اندر کھینچی ہوائی ہوا کی مدد سے ناک اور منہ کے راستے باہر دھکیلتی ہے؛ یہ دماغ کے لیے وہی ہے جو کھانسی پھیپھڑے اور اس سے ملحقہ کے لیے؛ نزلے اور زکام کے آغاز میں نقصان دہ ہے اور بخاروں میں کبھی اتنی بڑھ جاتی ہے کہ قوت گرا دے یا نکسیر بھڑکا دے — مگر مادی ہچکی کو اپنی ہلچل سے توڑ دیتی ہے؛ اس کا بہترین نفع سر کا خشک کرنا ہے جب مادہ تھوڑا ہو یا ہوائی یا گاڑھا مگر پختہ؛ اور یہ دماغ کی قوت کی علامت ہے: جس کی موت قریب ہو وہ چھینک نہیں سکتا اور جو معطسات سے بھی نہ چھینکے اس کی شفا کی امید نہیں؛ یہ محبوس فضول کو جھاڑنے میں مدد دیتی ہے اور سر کی گرانی ٹھہراتی ہے ⁦(ولادت آسان کرنے اور جھلّی نکالنے والا سطر موسوم فہرست کے طور پر بانی کے فیصلے کے لیے)⁩ {cite:canon-ibn-sina-print-v2 p.250} {cite:canon-ibn-sina-print-v2 p.251}'
