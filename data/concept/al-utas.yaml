label:
  ar: العطاس
  en: Sneezing
  fr: "Éternuement"
  ur: چھینک
  es: "Estornudar"
  tr: "hapşırma"
  id: "bersin"
summary:
  ar: العطاس حركة حامية من الدماغ لدفع خلط أو مؤذ آخر باستعانة من الهواء المستنشق دفعاً من طريق الأنف والفم وهو للدماغ كالسعال للرئة وما يليها، وضاره في أول النزلة والزكام وربما كثر في الحميات فأسقط القوة أو هيّج رعافاً، ويحل الفواق المادي بزعزعته؛ وأنفع ما فيه تجفيف الرأس إذا كانت المادة قليلة أو ريحية أو غليظة نضيجة، ودليل قوة الدماغ فمن قرب موته لا يستطيع أن يعطس ومن لم يعطس بالمعطسات فلا يرجى برؤه، ويعين على نفض الفضول ويسكن ثقل الرأس ⁦(سطر تسهيل الولادة وخروج المشيمة سطر موسوم مطروح لحكم المؤسس)⁩ {cite:canon-ibn-sina-print-v2 p.250} {cite:canon-ibn-sina-print-v2 p.251}
  en: 'The sneeze is a heated movement from the brain to expel a humour or another annoyance with the help of inhaled air, driving through the nose and the mouth; it is to the brain as the cough is to the lung and what follows it. It is harmful at the start of a nazla or zukam; in fevers it may multiply until it fells the strength or stirs a nosebleed — yet it resolves the material hiccup by its shaking. Its best use is drying the head when the matter is little, windy, or thick-but-ripened; and it is a sign of the brain''s strength: one near death cannot sneeze, and one who cannot sneeze even by sternutatories has no recovery to be hoped. It helps shake out retained wastes and calms the head''s heaviness ⁦(the line that it eases childbirth and the afterbirth''s exit is kept as a labelled listing for the founder''s ruling)⁩ {cite:canon-ibn-sina-print-v2 p.250} {cite:canon-ibn-sina-print-v2 p.251}'
  fr: "Selon le Canon, l’éternuement est un mouvement chaud qui vient du cerveau et chasse une humeur ou un autre élément gênant par le nez et la bouche avec l’aide de l’air inspiré. Il est au cerveau ce que la toux est au poumon et aux parties voisines. Il est nuisible au début d’une nazla ou d’un zukam. Dans les fièvres, il peut se répéter jusqu’à abattre les forces ou à provoquer un saignement de nez, mais il dissipe le hoquet dû à une matière en l’ébranlant. Il est surtout utile pour assécher la tête si la matière est peu abondante, venteuse ou épaisse mais mûre. Il témoigne de la vigueur du cerveau : celui qui est près de mourir ne peut éternuer, et pour celui qui n’éternue pas même sous l’effet de sternutatoires, il n’y a pas d’espoir de guérison. Il aide à chasser par ébranlement les déchets retenus et calme la lourdeur de tête (la mention selon laquelle il facilite l’accouchement et la délivrance est signalée et mise à part pour décision du fondateur) {cite:canon-ibn-sina-print-v2 p.250} {cite:canon-ibn-sina-print-v2 p.251}"
  ur: 'چھینک دماغ کی طرف سے ایک گرم حرکت ہے جو کسی خلط یا دوسری مؤذی چیز کو اندر کھینچی ہوائی ہوا کی مدد سے ناک اور منہ کے راستے باہر دھکیلتی ہے؛ یہ دماغ کے لیے وہی ہے جو کھانسی پھیپھڑے اور اس سے ملحقہ کے لیے؛ نزلے اور زکام کے آغاز میں نقصان دہ ہے اور بخاروں میں کبھی اتنی بڑھ جاتی ہے کہ قوت گرا دے یا نکسیر بھڑکا دے — مگر مادی ہچکی کو اپنی ہلچل سے توڑ دیتی ہے؛ اس کا بہترین نفع سر کا خشک کرنا ہے جب مادہ تھوڑا ہو یا ہوائی یا گاڑھا مگر پختہ؛ اور یہ دماغ کی قوت کی علامت ہے: جس کی موت قریب ہو وہ چھینک نہیں سکتا اور جو معطسات سے بھی نہ چھینکے اس کی شفا کی امید نہیں؛ یہ محبوس فضول کو جھاڑنے میں مدد دیتی ہے اور سر کی گرانی ٹھہراتی ہے ⁦(ولادت آسان کرنے اور جھلّی نکالنے والا سطر موسوم فہرست کے طور پر بانی کے فیصلے کے لیے)⁩ {cite:canon-ibn-sina-print-v2 p.250} {cite:canon-ibn-sina-print-v2 p.251}'
  es: "El estornudo es un movimiento nervioso del cerebro para expulsar una mucosidad u otra molestia con la ayuda del aire inhalado, que pasa por la nariz y la boca; es para el cerebro lo que la tos es para los pulmones y lo que le sigue. Es perjudicial al comienzo de una fiebre alta o moderada; en caso de fiebre, puede multiplicarse hasta debilitar al paciente o provocar una hemorragia nasal; sin embargo, su efecto alivia el hipo. Su mejor uso es secar la cabeza cuando la mucosidad es escasa, gaseosa o espesa pero madura; y es un signo de la fortaleza del cerebro: quien está cerca de la muerte no puede estornudar, y quien no puede estornudar ni siquiera con estornudos no tiene esperanza de recuperación. Ayuda a expulsar los desechos retenidos y calma la pesadez de la cabeza (la frase de que facilita el parto y la expulsión de la placenta se mantiene como una lista etiquetada para la regla del fundador) {cite:canon-ibn-sina-print-v2 p.250} {cite:canon-ibn-sina-print-v2 p.251}"
  tr: "Hapşırma, beynin burun ve ağızdan solunan havayı kullanarak balgamı veya başka zararlı maddeleri geri itmek için yaptığı sıcak harekettir; bu durum beyin içindir; akciğerlere ve ötesine öksürmeye benzer. Soğuk algınlığı ve grip başlangıcında zararlıdır ve ateş sırasında artarak güç kaybı veya nöbetlere yol açabilir. Fiziksel hıçkırıklar titremeye neden olabilir. En faydalı şey, madde az, rüzgarlı veya olgun ise başı kurutmaktır. Bu, beyin gücünün kanıtıdır: ölümün eşiğinde olan hapşıramaz, hapşırmayan ise iyileşmesi beklenmez. Merakı atmaya ve baş ağırlığını hafifletmeye yardımcı olur (doğum ve plasenta atılmasını kolaylaştıran çizgi, kurucunun kararı olarak işaretlenmiş bir çizgidir) {cite:canon-ibn-sina-print-v2 s.250} {cite:canon-ibn-sina-print-v2 s.251}"
  id: "Bersin adalah gerakan hangat otak untuk mendorong dahak atau zat berbahaya lainnya menggunakan udara yang dihirup melalui hidung dan mulut; kondisi ini untuk otak; mirip dengan batuk ke paru-paru dan lebih jauh lagi. Penyakit ini berbahaya pada awal pilek dan flu serta dapat meningkat saat demam, menyebabkan kehilangan kekuatan atau kejang. Cegukan fisik dapat menyebabkan gemetar. Hal yang paling bermanfaat adalah mengeringkan kepala jika zat tersebut langka, berangin, atau matang. Ini adalah bukti kekuatan otak: seseorang yang hampir mati tidak bisa bersin, dan yang tidak bersin tidak diharapkan pulih. Ini membantu mengurangi rasa ingin tahu dan mengurangi berat kepala (garis yang memfasilitasi persalinan dan aborsi plasenta ditandai sebagai keputusan pendiri) {cite:canon-ibn-sina-print-v2 hlm.250} {cite:canon-ibn-sina-print-v2 hlm.251}"
