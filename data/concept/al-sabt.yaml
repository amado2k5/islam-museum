label: { ar: "يوم السبت", en: "The Sabbath" }
summary:
  ar: "يوم السبت في شريعة بني إسرائيل وما وقع فيه من الاعتداء. يرى رشيد رضا أن الأمر بعدم الاعتداء فيه معناه ألا يُعمل فيه بالعمل الدنيوي، ويذكر أن البقرة أشارت إلى أن بعضهم اعتدى فيه، وأن الأعراف تبين ذلك بصيد السمك، وأن بعضهم أنكر على المعتدين وبعضهم سكت. ويقرر أن مخالفتهم في السبت ودخولهم الباب سجداً تجعل معاندتهم للنبي غير مستغربة. هذه قراءة رضا لأحوال بني إسرائيل، وتنسب إليه هنا."
