label: { ar: "يوم السبت", en: "The Sabbath", fr: "Le sabbat", es: "El sábado", ur: "سبت کا دن" }
summary:
  ar: "يوم السبت في شريعة بني إسرائيل وما وقع فيه من الاعتداء. يرى رشيد رضا أن الأمر بعدم الاعتداء فيه معناه ألا يُعمل فيه بالعمل الدنيوي، ويذكر أن البقرة أشارت إلى أن بعضهم اعتدى فيه، وأن الأعراف تبين ذلك بصيد السمك، وأن بعضهم أنكر على المعتدين وبعضهم سكت. ويقرر أن مخالفتهم في السبت ودخولهم الباب سجداً تجعل معاندتهم للنبي غير مستغربة. هذه قراءة رضا لأحوال بني إسرائيل، وتنسب إليه هنا."
  en: "The Sabbath in the law of the Children of Israel, and the transgression committed on it. Rashid Rida reads the command not to transgress on it as meaning that no worldly work is to be done on it. He notes that al-Baqara points to some of them having transgressed on it, that al-A'raf makes this plain through fishing, and that some of them denounced the transgressors while others kept silent. He holds that their violation of the Sabbath and their entering the gate prostrating make their opposition to the Prophet unsurprising. This is Rida's reading of the condition of the Children of Israel and is attributed to him here."
  fr: "Le sabbat dans la loi des Enfants d’Israël, et la transgression commise ce jour-là. Rashid Rida lit l’ordre de ne pas transgresser ce jour comme signifiant qu’aucun travail profane ne doit s’y faire. Il note qu’al-Baqara indique que certains d’entre eux le transgressèrent, qu’al-A’raf le rend clair par la pêche, et que certains d’entre eux dénoncèrent les transgresseurs tandis que d’autres se turent. Il tient que leur violation du sabbat et leur entrée par la porte en se prosternant rendent leur opposition au Prophète peu surprenante. Ceci est la lecture que fait Rida de la condition des Enfants d’Israël et lui est attribué ici."
  es: "El sábado en la ley de los Hijos de Israel y la transgresión cometida en él. Rashid Rida interpreta el mandato de no transgredirlo como la prohibición de realizar cualquier trabajo mundano. Señala que al-Baqara menciona que algunos de ellos lo transgredieron, que al-A'raf lo deja claro mediante la pesca, y que algunos denunciaron a los transgresores mientras que otros guardaron silencio. Sostiene que su violación del sábado y el hecho de que entraran por la puerta postrándose hacen que su oposición al Profeta no sea sorprendente. Esta es la interpretación de Rida sobre la condición de los Hijos de Israel y se le atribuye aquí."
  ur: "بنی اسرائیل کی شریعت میں سبت کا دن اور اس پر سرزد ہونے والی زیادتی۔ رشید ردا اس پر تجاوز نہ کرنے کا حکم پڑھتے ہیں یعنی اس پر کوئی دنیاوی کام نہ کیا جائے۔ وہ نوٹ کرتا ہے کہ البقرہ ان میں سے بعض نے اس پر تجاوز کرنے کی طرف اشارہ کیا ہے، کہ الاعراف اس کو مچھلی پکڑنے کے ذریعے بیان کرتا ہے، اور ان میں سے بعض نے فاسق کی مذمت کی ہے اور بعض نے خاموشی اختیار کی ہے۔ اس کا خیال ہے کہ ان کا سبت کے دن کی خلاف ورزی اور دروازے میں سجدہ کرتے ہوئے داخل ہونا ان کی پیغمبر کی مخالفت کو حیرت انگیز بنا دیتا ہے۔ یہ ردا کا بنی اسرائیل کی حالت کا پڑھنا ہے اور یہاں ان کی طرف منسوب ہے۔"
