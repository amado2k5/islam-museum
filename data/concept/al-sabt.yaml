label: { ar: "يوم السبت", en: "The Sabbath" }
summary:
  ar: "يوم السبت في شريعة بني إسرائيل وما وقع فيه من الاعتداء. يرى رشيد رضا أن الأمر بعدم الاعتداء فيه معناه ألا يُعمل فيه بالعمل الدنيوي، ويذكر أن البقرة أشارت إلى أن بعضهم اعتدى فيه، وأن الأعراف تبين ذلك بصيد السمك، وأن بعضهم أنكر على المعتدين وبعضهم سكت. ويقرر أن مخالفتهم في السبت ودخولهم الباب سجداً تجعل معاندتهم للنبي غير مستغربة. هذه قراءة رضا لأحوال بني إسرائيل، وتنسب إليه هنا."
  en: "The Sabbath in the law of the Children of Israel, and the transgression committed on it. Rashid Rida reads the command not to transgress on it as meaning that no worldly work is to be done on it. He notes that al-Baqara points to some of them having transgressed on it, that al-A'raf makes this plain through fishing, and that some of them denounced the transgressors while others kept silent. He holds that their violation of the Sabbath and their entering the gate prostrating make their opposition to the Prophet unsurprising. This is Rida's reading of the condition of the Children of Israel and is attributed to him here."
