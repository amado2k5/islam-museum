label: { ar: "الحقيقة", en: "Haqiqa (literal sense)", ur: "حقیقت" }
summary:
  ar: "الحقيقة في الاصطلاح الكلمة المستعملة فيما وضعت له في اصطلاح يقع به التخاطب، وتقابلها المجاز وهو لفظ أريد به غير ما وضع له لمناسبة بينهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7216} والكناية كلام استتر المراد منه بالاستعمال وإن كان معناه ظاهرا في اللغة، فيحتاج إلى النية أو دلالة الحال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7217} والحقيقة تكون لغوية إذا وضعها أهل اللغة، وشرعية إذا وضعها الشارع، وعرفية إذا وضعها العرف، وقد يكون اللفظ حقيقة باعتبار ومجازا باعتبار آخر كلفظ الصلاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7217} والأصل في الكلام الحمل على الحقيقة، فلا يصرف اللفظ إلى المجاز إلا عند تعذر الحقيقة أو تعسرها أو هجرها بالعادة، وللقاعدة فروع في الوقف والأيمان والإقرار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7218} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7219} ولا يجوز عند جمهور الأصوليين الجمع بين الحقيقة والمجاز في إرادة واحدة، وأجازه الشافعية ما لم يتعذر عقلا، ولا خلاف في جواز عموم المجاز. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7219} "
  en: "In technical use haqiqa is a word employed for what it was coined to mean in the convention through which speech is conveyed; its counterpart is metaphor, a word used for something other than its coinage because of a link between the two. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7216} Kinaya is speech whose intended meaning is hidden by usage though its literal sense is clear, so it needs intention or context to settle what is meant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7217} Literal meaning is linguistic when set by the lexicographers, legal when set by the lawgiver, and customary when set by custom; the same word may be literal in one sense and figurative in another, as prayer is literal in the legal sense and figurative in supplication. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7217} Speech is taken literally by default and moved to metaphor only when the literal sense is impossible, hard or abandoned by custom, with branches in bequests, oaths and acknowledgements. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7218} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7219} Most usulis forbid taking the literal and figurative sense together in one use, the Shafiis allow it unless reason forbids; a general metaphor is admissible. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7219} "
  ur: "اصطلاحاً حقیقت وہ لفظ ہے جو اسی معنی میں استعمال ہو جس کے لیے وضع ہوا ہو؛ اس کے مقابل مجاز ہے، یعنی ایسا لفظ جو کسی مناسبت سے غیر موضوع لہ میں استعمال ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7216} کنایہ وہ کلام ہے جس کی مراد استعمال کے سبب پوشیدہ ہو، اس لیے اس کے لیے نیت یا قرینۂ حال درکار ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7217} حقیقت لغوی، شرعی یا عرفی ہو سکتی ہے، اور ایک ہی لفظ ایک اعتبار سے حقیقت اور دوسرے اعتبار سے مجاز ہو سکتا ہے، جیسے لفظِ صلاۃ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7217} کلام کو اصلاً حقیقت پر محمول کیا جاتا ہے، اور مجاز کی طرف اسی وقت جایا جاتا ہے جب حقیقت متعذر، دشوار یا عادتاً متروک ہو؛ وقف، ایمان اور اقرار میں اس کی فروع ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7218} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7219} جمہور اصولیین کے نزدیک ایک ہی استعمال میں حقیقت اور مجاز کو جمع کرنا جائز نہیں، شافعیہ اسے جائز کہتے ہیں جب تک عقلاً ممتنع نہ ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7219} "
