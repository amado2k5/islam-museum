label:
  ar: "أيام التشريق"
  en: "The days of Tashriq"
  fr: "Les jours de Tashriq"
  es: "Los días de Tashriq"
  ur: "ایام تشریق"
  tr: "Tashreeq Günleri"
  id: "Hari-hari Tashreeq"
summary:
  ar: "أيام منى ولياليها أولها ثاني النحر وآخرها الثالث عشر من ذي الحجة إلى العصر، واختلف في علة تسميتها: فقالت طائفة إنهم كانوا يذبحون الذبائح بمنى ويشرقون اللحم في الشمس، وقال آخرون إن أهل مكة وغيرهم يتشرقون منصرفين إلى أوطانهم، وقيل إنهم كانوا يخرجون إلى مصليات في فضاء الأرض يسمونها المشارق واحدها مشراق فيسبحون ويدعون، وقالت طائفة إنه من ذبح البهائم وهو التشريق واستشهدوا بنهيه عن الضحية بالمشرقة أي المشقوقة الأذنين بالطول {cite:muruj-al-dhahab p. 510}."
  en: "The days of Mina — second of the slaughter through the thirteenth of Dhu al-Hijja — whose name is disputed: meat sun-dried at Mina, the dispersal home, the open prayer-grounds called mashariq, or the 'tashriq' beast-slaughter {cite:muruj-al-dhahab p. 510}."
  fr: "Les jours de Mina, du deuxième jour du sacrifice au treizième de dhu al-hijja, dont le nom reçoit plusieurs explications : viande séchée au soleil à Mina, dispersion vers les pays d’origine, lieux de prière en plein air appelés mashariq, ou abattage des bêtes appelé tashriq {cite:muruj-al-dhahab p. 510}."
  es: "Los días de Mina — desde el segundo de la matanza hasta el decimotercer día de Dhu al-Hijja — cuyo nombre es objeto de disputa: carne secada al sol en Mina, el hogar de dispersión, los terrenos de oración abiertos llamados mashariq, o la matanza de bestias 'tashriq' {cite:muruj-al-dhahab p. 510}."
  ur: "منیٰ کے ایام - ذبح کا دوسرا ذبح ذی الحجہ کی تیرہویں تاریخ تک - جس کے نام پر اختلاف ہے: منیٰ میں دھوپ میں خشک گوشت، منتشر گھر، کھلی نماز کے میدان جسے مشارق کہتے ہیں، یا تشریق حیوانوں کا ذبح {حوالہ: مروج الذہب صفحہ 510}۔"
  tr: "Mina'nın gündüzleri ve geceleri el-Nehr'in ikincisiyle başlar ve son gece Dhu al-Hijjah'den Asr'a kadar uzanır. Adının nedeni konusunda anlaşmazlıklar vardır: bazıları Mina'da hayvan kesip güneşte et yetiştirdiklerini söyler. Diğerleri ise Mekke halkının doğuya, kendi topraklarına doğru gittiklerini söyler. Ayrıca, açık toprakta 'al-Mashriq' adı verilen yere (tekil diliyle 'Mashraq' olarak adlandırılan yerlere çıktıkları ve orada dua ettikleri söylenirdi. Başka bir grup ise hayvan kesiminden kaynaklandığını belirten Tashreeq, 'al-mashriqa' ile hayvan kurban edilmesinin yasaklandığını belirtir; yani kulakları yarık olanlar {cite:muruj-al-dhahab, s. 510}."
  id: "Hari dan malam Mina dimulai dengan tanggal kedua al-Nahr dan yang terakhir dari Dhu al-Hijjah hingga Asr. Ada perbedaan pendapat mengenai alasan namanya: beberapa mengatakan mereka biasa menyembelih hewan di Mina dan menanam daging di bawah sinar matahari. Yang lain mengatakan bahwa orang-orang Mekah dan lainnya pergi ke timur menuju tanah asal mereka. Juga dikatakan mereka biasa pergi ke tempat doa di tanah terbuka yang disebut 'al-Mashriq,' tunggal 'Mashraq,' di mana mereka mengucapkan dan memohon. Kelompok lain mengatakan bahwa itu berasal dari penyembelihan hewan, yaitu Tashreeq, dengan alasan larangan pengorbanan hewan dengan 'al-mashriqa,' yang berarti mereka yang memiliki telinga terbelah {cite:muruj-al-dhahab, hlm. 510}."
