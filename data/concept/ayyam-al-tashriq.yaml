label: { ar: "أيام التشريق", en: "The days of Tashriq" }
summary:
  ar: "أيام منى ولياليها أولها ثاني النحر وآخرها الثالث عشر من ذي الحجة إلى العصر، واختلف في علة تسميتها: فقالت طائفة إنهم كانوا يذبحون الذبائح بمنى ويشرقون اللحم في الشمس، وقال آخرون إن أهل مكة وغيرهم يتشرقون منصرفين إلى أوطانهم، وقيل إنهم كانوا يخرجون إلى مصليات في فضاء الأرض يسمونها المشارق واحدها مشراق فيسبحون ويدعون، وقالت طائفة إنه من ذبح البهائم وهو التشريق واستشهدوا بنهيه عن الضحية بالمشرقة أي المشقوقة الأذنين بالطول {cite:muruj-al-dhahab p. 510}."
  en: "The days of Mina — second of the slaughter through the thirteenth of Dhu al-Hijja — whose name is disputed: meat sun-dried at Mina, the dispersal home, the open prayer-grounds called mashariq, or the 'tashriq' beast-slaughter {cite:muruj-al-dhahab p. 510}."
