id: concept/strategic-business-unit
class: concept
kind: term
label:
  ar: "مجال العمل ووحدة العمل الإستراتيجية (LOB وSBU)"
  en: "Line of business and strategic business unit (LOB and SBU)"
  ur: "لائن آف بزنس اور سٹریٹجک بزنس یونٹ (LOB اور SBU)"
summary:
  ar: "مجال العمل (LOB) هو المحور الاستراتيجي الذي تبيعه المنظمة، ووحدة العمل الإستراتيجية (SBU) عند طارق السويدان أي جزء من صلب العمل قابل للاستقلال بخطة وإدارة وميزانية وقرار؛ وتقسيمهما يحكم هيكل المنظمة المتغير مع كل خطة."
  en: "The line of business (LOB) is the strategic axis of what the organisation sells, and a strategic business unit (SBU), in Tareq al-Suwaidan's teaching, is any part of the core business able to stand alone with its own plan, management, budget and decisions; together they govern an organisation chart that changes with each plan."
  ur: "لائن آف بزنس (LOB) وہ سٹریٹجک محور ہے جو ادارہ بیچتا ہے، اور سٹریٹجک بزنس یونٹ (SBU)، طارق السویدان کی تعلیم میں، اصل کاروبار کا وہ حصہ ہے جو اپنی منصوبہ بندی، انتظام، بجٹ اور فیصلوں کے ساتھ خود کھڑا ہو سکتا ہے؛ دونوں مل کر ہر منصوبے کے ساتھ بدلنے والے تنظیمی ڈھانچے پر حاکم ہیں۔"
