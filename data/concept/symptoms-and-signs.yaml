id: concept/symptoms-and-signs
class: concept
kind: scientific
label: { ar: "الأعراض والدلائل", en: "Symptoms and signs (al-a'rad wal-dala'il)" }
summary:
  ar: "العرض عند ابن سينا هو الشيء الذي يتبع هيئة المرض وهو غير طبيعي، وقد يضاد الطبيعي كالوجع في القولنج، أو لا يضاده {cite:canon-ibn-sina-print-v1 p.103}. وتُعرض الأعراض والعلامات في التعليم الثالث من الفن الثاني، وهو أحد عشر فصلاً وجملتان، ويبدأ بكلام كلي فيها {cite:canon-ibn-sina-print-v1 p.154}. وتدل العلامات، كما ينقل عن جالينوس، على أمر حاضر فينتفع به المريض، أو ماضٍ فينتفع به الطبيب في إثبات تقدمه، أو مستقبل فينتفعان به جميعاً {cite:canon-ibn-sina-print-v1 p.154}."
  en: "For Ibn Sina a symptom (ard) is what follows a disease and is unnatural: it may be contrary to the natural state, as pain in colic is, or not contrary to it {cite:canon-ibn-sina-print-v1 p.103}. Symptoms and signs are treated in the third section of Fann 2, in eleven chapters and two groups, opening with a general discussion {cite:canon-ibn-sina-print-v1 p.154}. Quoting Galen, he says a sign shows something present, which the patient alone benefits from; something past, which the physician alone benefits from in showing his skill; or something to come, from which both benefit {cite:canon-ibn-sina-print-v1 p.154}."
