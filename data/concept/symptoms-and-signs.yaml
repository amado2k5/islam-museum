label: { ar: "الأعراض والدلائل", en: "Symptoms and signs (al-a'rad wal-dala'il)", es: "Síntomas y signos (al-a'rad wal-dala'il)", fr: "Symptômes et signes (al-a'rad wal-dala'il)", ur: "علامات اور علامات ⁦(الاعراد والدلائل)⁩", tr: "Belirtiler ve Belirtiler", id: "Gejala dan Tanda-tanda" }
summary:
  ar: "العرض عند ابن سينا هو الشيء الذي يتبع هيئة المرض وهو غير طبيعي، وقد يضاد الطبيعي كالوجع في القولنج، أو لا يضاده {cite:canon-ibn-sina-print-v1 p.103}. وتُعرض الأعراض والعلامات في التعليم الثالث من الفن الثاني، وهو أحد عشر فصلاً وجملتان، ويبدأ بكلام كلي فيها {cite:canon-ibn-sina-print-v1 p.154}. وتدل العلامات، كما ينقل عن جالينوس، على أمر حاضر فينتفع به المريض، أو ماضٍ فينتفع به الطبيب في إثبات تقدمه، أو مستقبل فينتفعان به جميعاً {cite:canon-ibn-sina-print-v1 p.154}."
  en: "For Ibn Sina a symptom (ard) is what follows a disease and is unnatural: it may be contrary to the natural state, as pain in colic is, or not contrary to it {cite:canon-ibn-sina-print-v1 p.103}. Symptoms and signs are treated in the third section of Fann 2, in eleven chapters and two groups, opening with a general discussion {cite:canon-ibn-sina-print-v1 p.154}. Quoting Galen, he says a sign shows something present, which the patient alone benefits from; something past, which the physician alone benefits from in showing his skill; or something to come, from which both benefit {cite:canon-ibn-sina-print-v1 p.154}."
  es: "Para Ibn Sina, un síntoma (ard) es lo que sigue a una enfermedad y es antinatural: puede ser contrario al estado natural, como el dolor en el cólico, o no serlo {cite:canon-ibn-sina-print-v1 p.103}. Los síntomas y signos se tratan en la tercera sección de Fann 2, en once capítulos y dos grupos, comenzando con una discusión general {cite:canon-ibn-sina-print-v1 p.154}. Citando a Galeno, dice que un signo muestra algo presente, del cual solo se beneficia el paciente; algo pasado, del cual solo se beneficia el médico al demostrar su habilidad; o algo futuro, del cual ambos se benefician {cite:canon-ibn-sina-print-v1 p.154}."
  fr: "Pour Ibn Sina, un symptôme (ard) est ce qui suit une maladie et qui est anormal: il peut être contraire à l’état naturel, comme la douleur des coliques, ou non (voir: canon d’Ibn Sina, vol. 1, p. 103). Les symptômes et les signes sont traités dans la troisième section du livre 2 de Fann, en onze chapitres et deux groupes, qui s’ouvre sur une discussion générale (voir: canon d’Ibn Sina, vol. 1, p. 154). Citant Galien, il affirme qu’un signe révèle un état présent dont seul le patient bénéficie; un état passé dont seul le médecin tire profit en démontrant son savoir-faire; ou un état à venir, dont tous deux bénéficient (voir: canon d’Ibn Sina, vol. 1, p. 154)."
  ur: "ابن سینا کے نزدیک ایک علامت ⁦(آرڈ)⁩ وہ ہے جو بیماری کی پیروی کرتی ہے اور غیر فطری ہے: یہ فطری حالت کے خلاف ہو سکتی ہے، جیسا کہ کولک میں درد ہوتا ہے، یا اس کے خلاف نہیں ہوتا ہے۔ علامات اور علامات کا علاج Fann 2 کے تیسرے حصے میں گیارہ ابواب اور دو گروپوں میں کیا گیا ہے، جس کا آغاز ایک عام بحث کے ساتھ کیا گیا ہے {cite:canon-ibn-sina-print-v1 p.154}۔ گیلن کا حوالہ دیتے ہوئے، وہ کہتے ہیں کہ ایک نشانی ایک موجود چیز کو ظاہر کرتی ہے، جس سے اکیلے مریض کو فائدہ ہوتا ہے۔ ماضی کی کوئی چیز، جسے صرف معالج ہی اپنی مہارت دکھانے سے فائدہ اٹھاتا ہے۔ یا کچھ آنے والا ہے، جس سے دونوں فائدہ اٹھائیں {حوالہ: کینن ابن سینا پرنٹ v1 صفحہ 154}۔"
  tr: "İbn Sina'ya göre, belirti hastalığın formunu takip eden ve anormal olan şeydir; doğal olana, örneğin kolikte ağrıya zıt olabilir ya da karşıt olmayabilir {cite:canon-ibn-sina-print-v1 s.103}. Belirtiler ve belirtiler, ikinci sanatın üçüncü öğretisinde, on bir bölüm ve iki cümleden oluşur ve genel bir tartışmayla başlar {cite:canon-ibn-sina-print-v1 s.154}. Galen'den bildirilen işaretler, hastaya fayda sağlayan mevcut bir meseleyi, doktorun ilerlemesini kanıtlamasını sağladığı geçmişi veya her ikisine de fayda sağlayan bir geleceği gösterir {cite:canon-ibn-sina-print-v1 s.154}."
  id: "Menurut Ibn Sina, gejala adalah hal yang mengikuti bentuk penyakit dan tidak normal, dan bisa berlawanan dengan yang alami, seperti nyeri pada kolik, atau tidak dapat dilawan {cite:canon-ibn-sina-print-v1 hlm.103}. Gejala dan tanda-tanda disajikan dalam ajaran ketiga seni kedua, yang terdiri dari sebelas bab dan dua kalimat, dimulai dengan diskusi umum {cite:canon-ibn-sina-print-v1 hlm.154}. Tanda-tanda, seperti yang dilaporkan oleh Galen, menunjukkan sesuatu yang sedang berharga bagi pasien, atau masa lalu yang dimanfaatkan dokter dalam membuktikan kemajuannya, atau masa depan yang menguntungkan keduanya {cite:canon-ibn-sina-print-v1 hlm.154}."
