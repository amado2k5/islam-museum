label: { ar: "التأويل في القرآن", en: "Ta'wil in the Qur'an", ur: "قرآن میں تاویل" }
summary:
  ar: "معنى كلمة «التأويل» في القرآن وفي اصطلاح العلماء. يرى محمد رشيد رضا أنها جاءت في القرآن بمعنى العاقبة وما يؤول إليه الأمر، ويميز ابن قيم الجوزية في الصواعق المرسلة ثلاثة معانٍ: حقيقة المعنى التي يؤول إليها الكلام في الخارج، وهو معناها في القرآن والسنة؛ والتفسير والبيان، وهو اصطلاح المفسرين والسلف؛ وصرف اللفظ عن ظاهره إلى مجازه، وهو اصطلاح المتكلمين والمتأخرين، ثم يقسم التأويل إلى صحيح وباطل."
  en: "What the word ta'wil means in the Qur'an and in scholarly usage. Rashid Rida holds that in the Qur'an it means outcome, what a matter comes to. In al-Sawa'iq al-Mursala Ibn Qayyim al-Jawziyya distinguishes three senses: the reality to which speech refers in the world, its sense in the Qur'an and Sunna; explanation and exposition, the usage of the exegetes and early scholars; and diverting a word from its apparent meaning to a figurative one, the usage of the theologians and later scholars. He then divides ta'wil into sound and false."
  ur: "قرآن اور علما کی اصطلاح میں لفظ «تاویل» کا معنی۔ محمد رشید رضا کے نزدیک قرآن میں اس کا معنی انجام اور وہ ہے جس کی طرف معاملہ لوٹتا ہے۔ الصواعق المرسلہ میں ابن قیم الجوزیہ تین معانی میں فرق کرتے ہیں: وہ حقیقت جس کی طرف کلام خارج میں لوٹتا ہے، جو قرآن و سنت میں اس کا معنی ہے؛ تفسیر اور بیان، جو مفسرین اور سلف کی اصطلاح ہے؛ اور لفظ کو اس کے ظاہر سے مجاز کی طرف پھیرنا، جو متکلمین اور متاخرین کی اصطلاح ہے۔ پھر وہ تاویل کو صحیح اور باطل میں تقسیم کرتے ہیں۔"
