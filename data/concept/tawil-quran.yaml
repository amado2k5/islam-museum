label: { ar: "التأويل في القرآن", en: "Ta'wil in the Qur'an" }
summary:
  ar: "معنى كلمة «التأويل» في القرآن. يرى محمد رشيد رضا، في مقدمة تفسيره، أن الكلمة اشتهرت بمعنى التفسير، لكنها جاءت في القرآن بمعنى العاقبة وما يؤول إليه الأمر، ويستشهد بموضع في سورة الأعراف {cite:tafsir-manar-v01 p.24}. ويوجب على من يريد الفهم الصحيح أن يفرّق بين ما تعارف عليه أهل الملة بعد القرون الأولى وما كان مستعملاً في عصر النزول، وأن يجمع ما تكرر من اللفظ في القرآن."
  en: "What the word ta'wil means in the Qur'an. Rashid Rida says in his introduction that the word became common for tafsir, but in the Qur'an it means outcome, what a matter comes to, and he cites a verse of al-A'raf for this sense. He holds that the reader must separate the senses of later terms from the sense the word had at the time of revelation, and gather its uses across the Qur'an."
