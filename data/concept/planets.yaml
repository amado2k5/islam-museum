summary:
  ar: "رأى يوسف أحد عشر كوكباً والشمس والقمر ساجدين له، والكوكب الدري في مصباح بيت الله، وإذا الكواكب انتثرت يوم القيامة، ونجم إبراهيم الآفل الذي قال فيه هذا ربي حتى أفل."
  en: "Joseph saw eleven planets, the sun and the moon prostrating to him; the Brilliant Star in the lamp of God's house; the planets scattered on the Last Day; and Abraham's fading star of which he said 'this is my Lord' until it set."
  ur: "یوسف نے گیارہ سیارے، سورج اور چاند کو اپنے سامنے سجدہ دیکھا؛ اللہ کے گھر کے چراغ میں درّی ستارہ؛ قیامت کے دن سیارے بکھر جائیں گے؛ اور ابراہیم کا ڈوبتا ستارہ جسے دیکھ کر انہوں نے کہا 'یہی میرا رب ہے' جب تک ڈوب نہ گیا۔"
