id: concept/canon-poor-breathing-in-infants
class: concept
kind: scientific
label:
  ar: "سوء التنفس عند الصبيان عند ابن سينا"
  en: "Poor breathing in infants in the Canon"
  fr: "Respiration difficile du nourrisson dans le Canon"
  ur: "قانون میں بچوں کی سانس کی تکلیف"
  es: "Dificultad respiratoria en bebés en el Canon"
summary:
  ar: "يذكر ابن سينا سوء التنفس عند الطفل، وعلاجه بدهن أصول الأذنين وأصل اللسان بالزيت والتقيؤ وكبس اللسان وتقطير الماء الحار في الفم ولعوق بزر الكتان بالعسل {cite:canon-ibn-sina-print-v1 p.214}."
  en: "Ibn Sina mentions poor breathing in a child and its treatment: oiling the roots of the ears and the base of the tongue, making it vomit, pressing the tongue down, dripping hot water into the mouth and a lick of flaxseed with honey {cite:canon-ibn-sina-print-v1 p.214}."
  fr: "Ibn Sina décrit onction des racines auriculaires et base linguale, vomissement, pression sur la langue, eau chaude en gouttes buccales et lin au miel léché {cite:canon-ibn-sina-print-v1 p.214}."
  es: "Ibn Sina menciona la dificultad para respirar en un niño y su tratamiento: untar con aceite las raíces de las orejas y la base de la lengua, provocarle el vómito, presionar la lengua hacia abajo, verter agua caliente en la boca y lamer semillas de lino con miel {cite:canon-ibn-sina-print-v1 p.214}."
