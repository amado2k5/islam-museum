label:
  ar: "تدبر القرآن"
  en: "Reflection on the Qur'an (tadabbur)"
  ur: "قرآن میں تدبر"
  es: "Reflexión sobre el Corán (tadabbur)"
  fr: "Réflexion sur le Coran (tadabbur)"
  tr: "Kur'an'ın teması"
  id: "Kontemplasi Al-Qur'an"
summary:
  ar: "دعوة الشيخ عمر عبد الكافي إلى قراءة القرآن بتدبر، مع قراءاته لمعاني سور قصيرة ولقصص القرآن عن الأمم والأرض الشاهدة، وحديثه عن ختم المصحف والبدء من جديد."
  en: "Sheikh Omar Abdelkafy's call to read the Qur'an with reflection, with his readings of the meanings of short suras and of the Qur'an's accounts of nations and of the earth as witness, and his remarks on completing the mushaf and beginning again."
  ur: "شیخ عمر عبدالکافی کی تدبر کے ساتھ قرآن پڑھنے کی دعوت، جس میں مختصر سورتوں کے معانی، امتوں کے قصص، گواہ زمین، اور مصحف ختم کرنے اور دوبارہ شروع کرنے پر ان کی گفتگو شامل ہے۔"
  es: "El llamado del jeque Omar Abdelkafy a leer el Corán con reflexión, con sus lecturas sobre los significados de las suras cortas y de los relatos del Corán sobre las naciones y la tierra como testimonio, y sus comentarios sobre completar el mushaf y comenzar de nuevo."
  fr: "L'appel du cheikh Omar Abdelkafy à lire le Coran avec réflexion, avec ses lectures des significations des courtes sourates et des récits du Coran sur les nations et la terre comme témoin, et ses remarques sur le fait de terminer le mushaf et de recommencer."
  tr: "Şeyh Ömer Abdülkafi, Kur'an'ın tefekkür yoluyla okunmasını ve kısa bölümler ile uluslar ve şahitlik eden topraklar hakkında Kur'an hikayelerini okuması, Muşaf'ı tamamlaması ve yeniden başlama konusundaki tartışmalarıyla birlikte çağrıda bulundu."
  id: "Sheikh Omar Abdelkafi menyerukan pembacaan kontemplatif Al-Quran, bersama dengan pembacaan bab-bab pendek dan cerita Al-Qur'an tentang bangsa-bangsa dan tanah yang menjadi saksi, serta diskusinya tentang menyelesaikan Mushaf dan memulai hidup baru."
