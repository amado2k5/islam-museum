- tradition: sunni
  id: presenter-art-and-freedom
  stance:
    ar: "رأي المقدّم: لا حضارة بلا فن، والدين تيار لا خط، وضد كل رقابة مسبقة"
    en: "The presenter's view: no civilisation without art, religion is a current not a line, and against all prior censorship"
    ur: "میزبان کی رائے: فن کے بغیر تہذیب نہیں، دین ایک دھارا ہے لکیر نہیں، اور ہر پیشگی سنسر کے خلاف"
  summary:
    ar: "رأي المقدّم (رأي المتحدث): لا توجد حضارة بدون فن، والقطيعة بين الفن والدين عند بعض المسلمين يجب أن تنتهي؛ والفتوى في الفن غير متفق عليها فيحتاج العلماء إلى مؤتمرات متخصصة؛ والدين تيار له حافتان لا خط واحد، فالآراء المختلفة ذات الأدلة داخله؛ وهو ضد أي رقابة مسبقة لأن الإسلام ينهض في أجواء الحرية، ومع ضوابط يتفق عليها العلماء والفنانون معاً، ومن خالفها يذهب إلى القضاء لا إلى جهات أمنية {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 01:09:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 01:10:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 01:11:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 01:12:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 01:13:00}."
    en: "The presenter's view (speaker's opinion): there is no civilisation without art, and the rupture between art and religion among some Muslims must end; fatwa on art is not agreed, so scholars need specialised conferences; religion is a current with two banks, not a single line, so differing views with proofs lie within it; and he is against any prior censorship, since Islam rises in an atmosphere of freedom, while favouring controls agreed by scholars and artists together, with violators taken to the courts, not to security bodies {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 01:09:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 01:10:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 01:11:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 01:12:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 01:13:00}."
    ur: "میزبان کی رائے (مقرر کی رائے): فن کے بغیر کوئی تہذیب نہیں، اور بعض مسلمانوں کے ہاں فن اور دین کی جدائی ختم ہونی چاہیے؛ فن پر فتویٰ متفق علیہ نہیں، اس لیے علما کو خصوصی کانفرنسوں کی ضرورت ہے؛ دین دو کناروں والا دھارا ہے، ایک لکیر نہیں، اس لیے دلائل والی مختلف آراء اس کے اندر ہیں؛ اور وہ ہر پیشگی سنسر کے خلاف ہیں، کیونکہ اسلام آزادی کی فضا میں ابھرتا ہے، جبکہ ایسے ضوابط کے حق میں ہیں جن پر علما اور فنکار مل کر متفق ہوں، اور خلاف ورزی کرنے والا عدالت میں جائے، سکیورٹی اداروں کے پاس نہیں {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 01:09:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 01:12:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 01:13:00}."
