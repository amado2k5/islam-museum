- tradition: sunni
  id: controls-yes-prior-censorship-no
  stance:
    ar: "ضوابط لاحقة وقضاء مستقل، لا رقابة مسبقة"
    en: "Later controls and an independent judiciary, not prior censorship"
    ur: "بعد کے ضوابط اور آزاد عدلیہ، پیشگی سنسر نہیں"
  summary:
    ar: "رأى النائب اليمني وأستاذ الشريعة شوقي القاضي أن الدين لا يعيق الفن إذا كان الفن ارتقاءً بالمشاعر والذوق، بل يضع ضوابط تمنع الهبوط فيها سموّ للإنسان؛ ورفض الرقابة المسبقة لثلاثة أسباب: الخوف من جهة رقابية متشددة أو متفلتة، وأن القيود المسبقة تعطل الإبداع، وأن الأمة مقيدة بما يكفي؛ ودعا إلى ضوابط لاحقة يفصل فيها قضاء نزيه مستقل {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 00:17:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 00:18:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 00:19:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 00:55:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 00:55:30}."
    en: "The Yemeni MP and sharia lecturer Shawqi al-Qadi held that religion does not impede art when art is an elevation of feeling and taste; rather it sets controls against debasement that raise the human being. He rejected prior censorship for three reasons: fear of a censoring body that is either harsh or lax, that prior restrictions stifle creativity, and that the umma is restricted enough already; and he called for later controls decided by an honest, independent judiciary {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 00:17:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 00:18:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 00:19:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 00:55:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 00:55:30}."
    ur: "یمنی رکنِ پارلیمان اور شریعت کے استاد شوقی القاضی کے نزدیک جب فن احساس اور ذوق کی بلندی ہو تو دین اسے نہیں روکتا، بلکہ پستی کے خلاف ضوابط رکھتا ہے جو انسان کو بلند کرتے ہیں۔ انہوں نے پیشگی سنسر کو تین وجوہ سے رد کیا: سخت یا ڈھیلے سنسر ادارے کا خوف، پیشگی پابندیاں تخلیق کو روکتی ہیں، اور امت پہلے ہی کافی پابند ہے؛ اور ایسے بعد کے ضوابط کی دعوت دی جن کا فیصلہ دیانتدار آزاد عدلیہ کرے {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 00:18:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 00:55:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 00:55:30}."
