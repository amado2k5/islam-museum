  id: freedom-as-understanding-necessity
  stance:
    ar: "الحرية فهم الضرورة، والمتفق عليه قليل، والرقابة جهاز أمني"
    en: "Freedom is understanding necessity; what is agreed is little; censorship is a security apparatus"
    ur: "آزادی ضرورت کو سمجھنا ہے؛ متفق علیہ کم ہے؛ سنسر ایک سکیورٹی ادارہ ہے"
  summary:
    ar: "رأى الضيف الرئيسي الدكتور أسامة القفاش أن الحرية المطلقة في الإبداع قول انتهى، وأن الحرية فهم الضرورة، وأن ما أجمع عليه الدين من المحرمات قليل جداً فيُلتزم به، وما اختُلف فيه يُترك للناس؛ وأن الجمال في ذاته خير والرسالة ضمنية يقرؤها المتلقي، وأنه لا يوجد فن هابط بل إنتاج هابط؛ ورفض الرقابة ووصفها بأنها جهاز أمني كسائر الأجهزة التي تمنع المواطن العربي من أن يكون مسؤولاً {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 00:07:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 00:11:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 00:24:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 00:48:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 01:02:30}."
    en: "The main guest, Dr Usama al-Qaffash, held that absolute creative freedom is a dead idea and that freedom is the understanding of necessity; that the prohibitions religion agrees on are very few and binding, while disputed matters are left to people; that beauty is good in itself and the message is implicit, read by the receiver; that there is no low art, only low production; and he rejected censorship, describing it as a security apparatus like the others that keep the Arab citizen from being responsible {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 00:07:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 00:11:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 00:24:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 00:48:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 01:02:30}."
    ur: "مرکزی مہمان ڈاکٹر اسامہ القفاش کے نزدیک تخلیق میں مطلق آزادی کا خیال ختم ہو چکا، آزادی ضرورت کو سمجھنا ہے؛ دین کے متفق علیہ محرمات بہت کم ہیں اور لازم ہیں، جبکہ مختلف فیہ امور لوگوں پر چھوڑے جائیں؛ حسن بذاتِ خود خیر ہے اور پیغام ضمنی ہے جسے وصول کنندہ پڑھتا ہے؛ پست فن نہیں ہوتا، پست پیداوار ہوتی ہے؛ اور انہوں نے سنسر کو رد کیا اور اسے ان سکیورٹی اداروں جیسا قرار دیا جو عرب شہری کو ذمہ دار بننے سے روکتے ہیں {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 00:07:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 00:48:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 01:02:30}."
