id: concept/al-fann-bayn-al-iltizam-wal-taharrur
class: concept
kind: social
label:
  ar: "الفن بين الالتزام والتحرر"
  en: "Art between commitment and freedom"
  ur: "فن، پابندی اور آزادی کے درمیان"
issue:
  ar: "هل يقيّد الدين الفن، وأيهما أهم في الفن: الجمال أم الرسالة، ومن يضع ضوابطه، وهل تجوز الرقابة المسبقة على الإنتاج الفني؟"
  en: "Does religion restrict art; which matters more in art, beauty or message; who sets its controls; and is prior censorship of artistic production acceptable?"
  ur: "کیا دین فن کو محدود کرتا ہے؛ فن میں کیا زیادہ اہم ہے، حسن یا پیغام؛ اس کے ضوابط کون طے کرے؛ اور کیا فنی پیداوار پر پیشگی سنسر جائز ہے؟"
summary:
  ar: "حلقة «الوسطية» عن الفن بين الالتزام والتحرر. صوّت 65% من جمهور الاستوديو أن الدين يقيّد الفن، {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 00:05:30} و81% أن الرسالة أهم من الجمال، {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 00:22:30} و73% أن أغنية لأم كلثوم في الحب الإلهي فن ملتزم، {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 00:35:30} و92% مع الرقابة المسبقة. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 00:54:00} وختم المقدّم بأنه لا حضارة بلا فن، وبأنه ضد أي رقابة مسبقة، ومع ضوابط يتفق عليها العلماء والفنانون معاً ويُحتكم فيها إلى القضاء. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 01:09:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 01:11:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 01:12:30}"
  en: "The 'Al-Wasatiyya' episode on art between commitment and freedom. 65% of the studio audience voted that religion restricts art, {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 00:05:30} 81% that message matters more than beauty, {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 00:22:30} 73% that an Umm Kulthum song about divine love is committed art, {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 00:35:30} and 92% for prior censorship. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 00:54:00} The presenter closed by saying there is no civilisation without art, that he is against any prior censorship, and that he favours controls agreed by scholars and artists together, with disputes taken to the courts. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 01:09:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 01:11:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 01:12:30}"
  ur: "فن پر پابندی اور آزادی کے موضوع پر «الوسطیہ» کی قسط۔ اسٹوڈیو حاضرین میں سے 65% نے ووٹ دیا کہ دین فن کو محدود کرتا ہے، {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 00:05:30} 81% نے کہ پیغام حسن سے زیادہ اہم ہے، {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 00:22:30} 73% نے کہ الٰہی محبت پر ام کلثوم کا ایک گیت پابند فن ہے، {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 00:35:30} اور 92% نے پیشگی سنسر کے حق میں۔ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 00:54:00} میزبان نے یہ کہہ کر ختم کیا کہ فن کے بغیر کوئی تہذیب نہیں، وہ ہر پیشگی سنسر کے خلاف ہیں، اور ایسے ضوابط کے حق میں ہیں جن پر علما اور فنکار مل کر متفق ہوں اور تنازعات عدالت میں جائیں۔ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 01:09:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 01:11:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 01:12:30}"
sensitivity: contested
perspectives:
- tradition: sunni
  id: regulation-not-impediment
  stance:
    ar: "الدين يضبط الفن ويوجّهه ولا يعيقه، ومع رقابة مسبقة بضوابط شرعية"
    en: "Religion regulates and guides art without impeding it; for prior censorship by shar'i standards"
    ur: "دین فن کو منضبط اور رہنمائی کرتا ہے، روکتا نہیں؛ شرعی ضوابط کے ساتھ پیشگی سنسر کے حق میں"
  summary:
    ar: "رأى الدكتور مأمون جرار أن التقييد إن كان بمعنى الإعاقة فلا، وإن كان بمعنى الضبط والتوجيه فنعم، وأن الفن نشاط إنساني لا يُوضع نداً للدين الذي هو تشريع رباني، وأن المطلوب تقديم فن إسلامي ملتزم بديلاً؛ وأيّد الرقابة المسبقة التي تراعي الضوابط الشرعية وتبيّن للمنتج سقفاً سياسياً وشرعياً وأخلاقياً قبل أن ينفق على إنتاج قد يُمنع {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 00:12:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 00:13:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 00:15:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 00:56:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 00:57:00}."
    en: "Dr Ma'mun Jarrar held that if 'restriction' means impediment, then no, but if it means regulation and guidance, then yes; that art is a human activity not to be set up as a rival to religion, which is divine legislation; and that the task is to offer committed Islamic art as an alternative. He supported prior censorship that observes shar'i standards and shows the producer a political, shar'i and moral ceiling before he spends on a production that might be banned {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 00:12:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 00:13:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 00:15:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 00:56:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 00:57:00}."
    ur: "ڈاکٹر مامون جرار کے نزدیک اگر «پابندی» کا مطلب رکاوٹ ہے تو نہیں، اور اگر انضباط اور رہنمائی ہے تو ہاں؛ فن ایک انسانی سرگرمی ہے جسے دین کا ہم پلہ نہیں بنایا جا سکتا جو ربانی تشریع ہے؛ اور کام یہ ہے کہ پابند اسلامی فن متبادل کے طور پر پیش ہو۔ انہوں نے ایسے پیشگی سنسر کی تائید کی جو شرعی ضوابط کا لحاظ رکھے اور پروڈیوسر کو خرچ سے پہلے سیاسی، شرعی اور اخلاقی حد بتا دے {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 00:12:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 00:56:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep37 00:57:00}."
