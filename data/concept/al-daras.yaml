id: concept/al-daras
class: concept
kind: scientific
label:
  ar: الضرس
  en: The edge-numbness of the teeth
  fr: "Agacement des dents"
  ur: دانتوں کا خدر ⁦(ضرس)⁩
  es: "El entumecimiento de los bordes de los dientes"
summary:
  ar: الضرس خدر ما يعرض للسن بسبب مخشن وهو إما قابض وإما عفص، وقد يكون مما لاقى السن وارداً من خارج أو مقيئاً وقد يكون مما يتصعد إليها من المعدة إذا كان هناك خلط حامض، وقد يتبع التصور الوهمي عند مشاهدة من يقضم الحامض جداً قضماً باسترسال، وينفع منه مضغ ما وصف من البقول والجوز والمضمضة بما وصف من الألبان والأدهان والملح لمضادته للحموضة نافع جداً من الضرس ⁦(الأسماء من هذا الجنس محمولة كما سماها الكتاب)⁩ {cite:canon-ibn-sina-print-v2 p.278}
  en: Al-daras is a numbness befalling the tooth from a roughening thing — either astringent or acid — from what touches the tooth coming from outside or vomited, or what rises to it from the stomach when a sour humour is there; it may also follow the imaginary fancy at seeing someone crunch something very sour with relish. Chewing what he described of the greens and nuts helps it, and mouth-rinsing with the described milk and oil kinds; and salt, for opposing the sourness, is very beneficial against it (the names of this kind carried as the book names them) {cite:canon-ibn-sina-print-v2 p.278}
  fr: "Al-daras est un engourdissement de la dent dû à une substance qui la rend rugueuse — astringente ou acide — venant de l’extérieur ou vomie et touchant la dent, ou remontant de l’estomac lorsqu’une humeur aigre s’y trouve ; il peut aussi suivre une impression imaginaire à la vue d’une personne croquant avec plaisir quelque chose de très acide. Mâcher les végétaux et les fruits à coque qu’il a décrits y est bénéfique, de même que les bains de bouche avec les types de lait et d’huile décrits ; le sel, parce qu’il s’oppose à l’aigreur, lui est très bénéfique (les noms de cette catégorie sont repris tels que le livre les donne) {cite:canon-ibn-sina-print-v2 p.278}"
  ur: ضرس دانت پر عارض ہونے والا سون پن ہے جو کسی خردرا کرنے والی چیز سے ہوتا ہے — چاہے قابض ہو یا عفص — یا اس چیز سے جو باہر سے یا قے میں دانت کو لگے یا اس سے جو معدے سے اس پر چڑھے جب وہاں کھٹا خلط ہو؛ اور وہ کسی کو بہت کھٹی چیز شوق سے چباتے دیکھنے کے وہمی تصور سے بھی ہو سکتا ہے؛ اس کے لیے اس کے بیان کردہ ساگ اور جozi چبانا سودا کرتا ہے اور بیان کردہ دودھ اور تیل کی کلانی بھی؛ اور نمک کھٹائی کی ضد کے سبب ضرس میں نہایت سودا کرتا ہے ⁦(اسی جنس کے نام کتاب کے نام پر محمول)⁩ {cite:canon-ibn-sina-print-v2 p.278}
  es: "Al-daras es un entumecimiento que afecta al diente debido a una sustancia áspera —ya sea astringente o ácida— que entra en contacto con él desde el exterior o que se vomita, o que asciende desde el estómago cuando hay un humor ácido. También puede deberse a la imaginación de alguien que mastica con gusto algo muy ácido. Masticar las verduras y nueces que describe ayuda, al igual que enjuagarse la boca con la leche y el aceite descritos; y la sal, para contrarrestar la acidez, es muy beneficiosa (los nombres de este tipo se conservan tal como aparecen en el libro). {cite:canon-ibn-sina-print-v2 p.278}"
