id: concept/canon-wine-of-the-old
class: concept
kind: scientific
label: { ar: "شراب المشايخ عند ابن سينا", en: "The wine of the old in the Canon", ur: "بزرگوں کی شراب قانون میں" }
summary:
  ar: "يقرر ابن سينا في الفصل الثالث أن خير شراب المشايخ العتيق الأحمر لأنه يدر ويسخن معاً، وأنهم يجتنبون الحديث والأبيض إلا من استحم بعد الغذاء وعطش فيسقى شراباً رقيقاً قليل الغذاء بدل الماء، ويجتنبون الحلو المسدد {cite:canon-ibn-sina-print-v1 p.253}."
  en: "In the third chapter Ibn Sina states that the best drink for the old is old red wine, since it promotes urine and warms together; they avoid new and white wine, except one who has bathed after a meal and is thirsty, who is given a thin wine of little nourishment in place of water; sweet, obstructing drinks are avoided {cite:canon-ibn-sina-print-v1 p.253}."
