id: concept/canon-wine-of-the-old
class: concept
kind: scientific
label: { ar: "شراب المشايخ عند ابن سينا", en: "The wine of the old in the Canon", ur: "بزرگوں کی شراب قانون میں", es: "El vino de antaño en el Canon", fr: "Le vin des anciens dans le Canon" }
summary:
  ar: "يقرر ابن سينا في الفصل الثالث أن خير شراب المشايخ العتيق الأحمر لأنه يدر ويسخن معاً، وأنهم يجتنبون الحديث والأبيض إلا من استحم بعد الغذاء وعطش فيسقى شراباً رقيقاً قليل الغذاء بدل الماء، ويجتنبون الحلو المسدد {cite:canon-ibn-sina-print-v1 p.253}."
  en: "In the third chapter Ibn Sina states that the best drink for the old is old red wine, since it promotes urine and warms together; they avoid new and white wine, except one who has bathed after a meal and is thirsty, who is given a thin wine of little nourishment in place of water; sweet, obstructing drinks are avoided {cite:canon-ibn-sina-print-v1 p.253}."
  es: "En el tercer capítulo, Ibn Sina afirma que la mejor bebida para los ancianos es el vino tinto añejo, ya que favorece la micción y calienta al mismo tiempo; evitan el vino nuevo y el blanco, excepto aquel que se ha bañado después de una comida y tiene sed, a quien se le da un vino ligero y poco nutritivo en lugar de agua; se evitan las bebidas dulces y pesadas {cite:canon-ibn-sina-print-v1 p.253}."
  fr: "Dans le troisième chapitre, Ibn Sina déclare que la meilleure boisson pour les personnes âgées est le vieux vin rouge, car il favorise la diurèse et réchauffe à la fois; elles évitent le vin nouveau et le vin blanc, sauf pour celui qui s'est baigné après un repas et a soif, auquel on donne un vin léger et peu nourrissant à la place de l'eau; les boissons sucrées et obstruantes sont évitées {cite:canon-ibn-sina-print-v1 p.253}."
  ur: "تیسرے باب میں ابن سینا فرماتے ہیں کہ پرانے کے لیے بہترین مشروب پرانی سرخ شراب ہے، کیونکہ یہ پیشاب کو بڑھاتی ہے اور ایک ساتھ گرم کرتی ہے۔ وہ نئی اور سفید شراب سے پرہیز کرتے ہیں، سوائے اس کے جس نے کھانے کے بعد نہایا ہو اور پیاسا ہو، جسے پانی کی جگہ تھوڑی سی خوراک کی پتلی شراب دی جاتی ہے۔ میٹھے، رکاوٹ پیدا کرنے والے مشروبات سے پرہیز کیا جاتا ہے {حوالہ:کینن-ابن سینا-پرنٹ-v1 p.253}۔"
