id: concept/canon-when-the-drug-does-not-purge
class: concept
kind: scientific
label: { ar: "تدبير من شرب الدواء ولم يسهله عند ابن سينا", en: "What to do when the drug does not purge in the Canon", ur: "جب دوا اسہال نہ کرے تو کیا کریں قانون میں" }
summary:
  ar: "يبين ابن سينا أن من لم يسهله الدواء وأمغص وشوش وأسدر وصدع يفزع إلى الحقنة والحمولات ويشرب من المصطكى ثلاث كرمات في ماء فاتر ويتبع بالقوابض والسفرجل والتفاح، وإذا ساءت الأعراض وكانت الحركات إلى فوق فلا بد من فصد، ولو بعد يومين أو ثلاثة خوفاً من حركة الأخلاط إلى عضو رئيس {cite:canon-ibn-sina-print-v1 p.284}."
  en: "Ibn Sina shows that when a drug brings colic, disturbance, drowsiness and headache and does not purge, one resorts to an enema and suppositories, drinks three kurum of mastic in lukewarm water and follows with astringents, quince and apples, and that if bad signs appear and the movement is upward, venesection is needed, even two or three days later, for fear the humours move to a principal organ {cite:canon-ibn-sina-print-v1 p.284}."
