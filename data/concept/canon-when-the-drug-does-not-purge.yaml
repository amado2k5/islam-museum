id: concept/canon-when-the-drug-does-not-purge
class: concept
kind: scientific
label: { ar: "تدبير من شرب الدواء ولم يسهله عند ابن سينا", en: "What to do when the drug does not purge in the Canon", ur: "جب دوا اسہال نہ کرے تو کیا کریں قانون میں", es: "Qué hacer cuando el medicamento no se elimina en el Canon", fr: "Que faire lorsque le médicament ne s'évacue pas dans le Canon" }
summary:
  ar: "يبين ابن سينا أن من لم يسهله الدواء وأمغص وشوش وأسدر وصدع يفزع إلى الحقنة والحمولات ويشرب من المصطكى ثلاث كرمات في ماء فاتر ويتبع بالقوابض والسفرجل والتفاح، وإذا ساءت الأعراض وكانت الحركات إلى فوق فلا بد من فصد، ولو بعد يومين أو ثلاثة خوفاً من حركة الأخلاط إلى عضو رئيس {cite:canon-ibn-sina-print-v1 p.284}."
  en: "Ibn Sina shows that when a drug brings colic, disturbance, drowsiness and headache and does not purge, one resorts to an enema and suppositories, drinks three kurum of mastic in lukewarm water and follows with astringents, quince and apples, and that if bad signs appear and the movement is upward, venesection is needed, even two or three days later, for fear the humours move to a principal organ {cite:canon-ibn-sina-print-v1 p.284}."
  es: "Ibn Sina muestra que cuando un medicamento provoca cólicos, malestar, somnolencia y dolor de cabeza y no purga, se recurre a un enema y supositorios, se beben tres kurum de mástique en agua tibia y se continúa con astringentes, membrillo y manzanas, y que si aparecen malos signos y el movimiento es ascendente, es necesaria una flebotomía, incluso dos o tres días después, por temor a que los humores se muevan a un órgano principal {cite:canon-ibn-sina-print-v1 p.284}."
  fr: "Ibn Sina montre que lorsqu'un médicament provoque des coliques, des troubles, de la somnolence et des maux de tête et ne purge pas, on recourt à un lavement et à des suppositoires, on boit trois kurum de mastic dans de l'eau tiède et on prend ensuite des astringents, du coing et des pommes, et que si de mauvais signes apparaissent et que le mouvement est ascendant, une saignée est nécessaire, même deux ou trois jours plus tard, de peur que les humeurs ne se déplacent vers un organe principal {cite:canon-ibn-sina-print-v1 p.284}."
  ur: "ابن سینا سے معلوم ہوتا ہے کہ جب کوئی دوا درد، پریشانی، غنودگی اور سر درد لاتی ہے اور دور نہیں ہوتی تو انیما اور سپپوزٹریز کا سہارا لیتا ہے، تین قورم مستطیل نیم گرم پانی میں ملا کر پیتا ہے اور اس کے بعد اسٹرنگنٹ، پان اور سیب ڈالتا ہے، اور یہ کہ اگر بری علامات ظاہر ہوں اور دو یا تین دن بعد حرکت کرنے کا اندیشہ ہو تو دو یا تین دن بعد تک ہلکا ہونا ضروری ہے۔ ایک پرنسپل آرگن پر جائیں"
