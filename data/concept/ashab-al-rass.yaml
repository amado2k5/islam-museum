id: concept/ashab-al-rass
class: concept
kind: term
label:
  ar: "أصحاب الرس"
  en: "Ashab al-Rass (the Companions of al-Rass)"
  fr: "Ashab al-Rass (les gens d’al-Rass)"
  ur: "اصحاب الرس"
summary:
  ar: "أمة مكذِّبة ذكرها القرآن في موضعين مع عاد وثمود دون أن يسمّي نبيها أو مكانها [[passage/quran-25-38|الفرقان 38]] و[[passage/quran-50-12|ق 12]]. والرس في كلام العرب بئر غير مطوية، واختلف المفسرون في من هم: قوم رسّوا نبيهم في بئر، أو أهل بئر وماشية أرسل إليهم شعيب، أو أهل قرية الفلج باليمامة، أو بقية من ثمود، أو قوم صاحب يس، وقيل غير ذلك؛ ورجّح الطبري أنهم قوم كانوا على بئر ولم يجزم بعينهم {cite:tafsir-tabari-quran-com on 25:38} {cite:tafsir-qurtubi-quran-com on 25:38}."
  en: "A denying people the Qur'an names in two places beside 'Ad and Thamud without giving their prophet or their land [[passage/quran-25-38|al-Furqan 25:38]] and [[passage/quran-50-12|Qaf 50:12]]. In Arabic al-rass is an unlined well, and the commentators differed on who they were: a people who threw their prophet into a well, well-dwellers and herdsmen to whom Shu'ayb was sent, the people of al-Falaj in al-Yamama, a remnant of Thamud, the people of the man of Ya-Sin, and other views; al-Tabari judged them a people living at a well without fixing who {cite:tafsir-tabari-quran-com on 25:38} {cite:tafsir-qurtubi-quran-com on 25:38}."
  fr: "Peuple négateur que le Coran nomme en deux endroits aux côtés de 'Ad et de Thamud, sans donner son prophète ni son pays : [[passage/quran-25-38|al-Furqan 25:38]] et [[passage/quran-50-12|Qaf 50:12]]. En arabe, al-rass désigne un puits non maçonné ; les commentateurs ont divergé sur son identité : peuple ayant jeté son prophète dans un puits, habitants d’un puits et éleveurs auxquels Shu'ayb fut envoyé, gens d’al-Falaj en al-Yamama, reste de Thamud, peuple de l’homme de Ya-Sin et autres avis ; al-Tabari les jugeait être un peuple vivant près d’un puits sans préciser lequel {cite:tafsir-tabari-quran-com on 25:38} {cite:tafsir-qurtubi-quran-com on 25:38}."
  ur: "ایک جھٹلانے والی قوم جسے قرآن عاد و ثمود کے ساتھ دو مقامات پر ذکر کرتا ہے مگر اس کے نبی یا سرزمین کا نام نہیں لیتا [[passage/quran-25-38|الفرقان 38]] اور [[passage/quran-50-12|ق 12]]۔ عربی میں رس بغیر پختہ کیا ہوا کنواں ہے، اور مفسرین کا اختلاف رہا کہ یہ کون تھے: وہ لوگ جنہوں نے اپنے نبی کو کنویں میں ڈال دیا، کنویں اور مویشیوں والے لوگ جن کی طرف شعیب بھیجے گئے، یمامہ کی بستی فلج کے لوگ، ثمود کی بقیہ، صاحبِ یٰسین کی قوم، اور دیگر اقوال؛ طبری نے انہیں کنویں پر بسنے والی قوم قرار دیا اور کسی کا تعین نہیں کیا {cite:tafsir-tabari-quran-com on 25:38} {cite:tafsir-qurtubi-quran-com on 25:38}۔"
