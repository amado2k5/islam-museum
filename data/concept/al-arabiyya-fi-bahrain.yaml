id: concept/al-arabiyya-fi-bahrain
class: concept
kind: term
tags: [arabiyya-browser, arabiyya-world]
label:
  ar: "العربية في البحرين"
  en: "Arabic in Bahrain"
  ur: "بحرین میں عربی"
  fr: "L'arabe à Bahreïn"
  es: "El árabe en Baréin"
summary:
  ar: "ما وُجد عن العربية في البحرين: المادة 2 من الدستور كما يعرضها Constitute، وأسماء النوعين البحراني الخليجي والبحرانية في شجرة Glottolog، مع بيان أنه لم يُعثر على وصف للمتكلمين ولا على نسب ولا على لغات أخرى. وللبحرين سجل مكان في المتحف مرتبط بهذا السجل. وأُضيف نص الحكم الدستوري بلغته الأصلية كما ورد في ملخص بحثي لم يتحقق المتحف منه على الصفحة."
  en: "What was found on Arabic in Bahrain: Article 2 of the Constitution as the Constitute Project shows it, and the names of the Bahraini Gulf and Baharna varieties in Glottolog's tree, with a statement that no description of the speakers, no shares and no other languages were found. The museum has a place record for Bahrain, linked to this record. The constitutional text is added in its original wording, as supplied in a research summary that the museum did not check against the page."
  ur: "بحرین میں عربی کے بارے میں جو ملا: دستور کی دفعہ 2 جیسا Constitute دکھاتا ہے، اور Glottolog کے شجرے میں بحرینی خلیجی اور بحرانی اقسام کے نام، اور یہ بیان کہ بولنے والوں کا بیان، تناسب اور دوسری زبانیں نہیں ملیں۔ عجائب گھر میں بحرین کا مقام کا ریکارڈ ہے اور اس سے جڑا ہے۔ آئینی حکم کی عبارت اصل زبان میں شامل کی گئی ہے، جیسی ایک تحقیقی خلاصے میں ملی جسے متحف نے صفحے سے نہیں جانچا۔"
  fr: "Ce qui a été trouvé sur l'arabe à Bahreïn : l'article 2 de la Constitution tel que le montre le Constitute Project, et les noms des variétés du Golfe bahreïnie et baharna dans l'arbre de Glottolog, avec l'énoncé qu'aucune description des locuteurs, aucune part ni aucune autre langue n'a été trouvée. Le musée a une fiche de lieu pour Bahreïn, liée à cette fiche. Le texte constitutionnel est ajouté dans sa langue d'origine, tel que fourni par un résumé de recherche que le musée n'a pas vérifié sur la page."
  es: "Lo que se encontró sobre el árabe en Baréin: el artículo 2 de la Constitución tal como lo muestra el Constitute Project, y los nombres de las variedades del Golfo bahreiní y baharna en el árbol de Glottolog, con el enunciado de que no se halló descripción de los hablantes, proporciones ni otras lenguas. El museo tiene un registro de lugar para Baréin, enlazado a este registro. Se añade el texto constitucional en su lengua original, tal como lo entrega un resumen de investigación que el museo no verificó en la página."
