summary:
  ar: "الفوفل في الكتاب ثمرة نبات في الهند تشبه الجوزبوا، أحمر شديد الكسر طيب الرائحة، يتناوله أهل الهند لطيب النكهة ويحمر الأسنان، قوته قريبة من الصندل، بارد يابس في الثالثة، قابض مبرد بقوة، جيد للأورام الحارة الغليظة وللعين الملتهبة {cite:canon-ibn-sina-print-v1 p.625}"
  en: "Fawfal is in the book the fruit of a plant in India shaped like nutmeg, red, hard to break and of good smell, taken by the people of India for a sweet breath and reddening the teeth, its power near sandalwood; cold and dry in the third degree, astringent and strongly cooling, good for hot, thick swellings and for an inflamed eye {cite:canon-ibn-sina-print-v1 p.625}"
  ur: "فوفل کتاب میں ہند کے ایک پودے کا پھل ہے جس کی شکل جائفل جیسی، سرخ رنگ، سخت اور خوشبو دار ہے، اہلِ ہند منہ کی خوشبو کے لیے اسے کھاتے ہیں اور یہ دانتوں کو سرخ کرتا ہے، اس کی قوت صندل کے قریب ہے؛ تیسرے درجے میں ٹھنڈا خشک، قابض اور بہت ٹھنڈک دینے والا ہے، گرم اور سخت ورموں اور سوجی ہوئی آنکھ کے لیے اچھا ہے {cite:canon-ibn-sina-print-v1 p.625}۔"
