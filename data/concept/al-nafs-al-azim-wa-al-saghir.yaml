id: concept/al-nafs-al-azim-wa-al-saghir
class: concept
kind: scientific
label:
  ar: "النفس العظيم والصغير"
  en: "The great breath and the small"
  fr: "La grande respiration et la petite"
  ur: "بڑی اور چھوٹی سانس"
  es: "El gran aliento y el pequeño"
  tr: "Büyük ve küçük ruh"
  id: "Roh besar dan kecil"
summary:
  ar: "النفس العظيم هو الذي ينال هواء كثيراً جداً فوق المعتدل تنبسط منه أعضاء النفس في الجهات كلها انبساطاً وافر العظم والصغير بالضد، وأسباب العظيم أسباب النبض العظيم الثلاثة وليس الصحيح أن الصغير هو الذي يتم بحركة الحجاب فقط فقد يكون ذلك معتدلاً وقد يكون صغيراً كانت الأعضاء الصدرية كلها ضعيفة فلا يفي الحجاب وحده بالمحتاج إليه، والأسباب في تجشم الأعضاء كلها للحركة بعنف أربعة عظيم الحاجة لالتهاب حرارة في نواحي القلب أو سبب في العضل المحركة من ضعف فيها أو بمشاركة الأصول أو ضيق المنافذ، ومن النفس الشديد وهو الذي يكون مع عظمه كأن القوة تتكلف فضل انزعاج للإدخال والنفخ بالإخراج، والعالي الشاهق وهو الصنف من العظيم الذي يفتقر إلى تحريك أعالي عضل الصدر ولا تبلغ الحاجة إلى تحريك الحجاب وأسافل العضل وكثيراً ما يحدث في الحميات الوبائية، والصغير تعرف أسبابه للمعرفة بأسباب العظيم على سبيل المقابلة وقد يصغر بسبب الوجع وإذا اقترن به التثاؤب دل على موت الطبيعة وإذا اقترن به التواتر دل على وجع في أعضاء التنفس، والقصير مخالف للطويل وإذا قرن به التواتر كان سببه وجعاً في آلة التنفس وما يليها وإذا قرن به التفاوت دل على موت الغريزة {cite:canon-ibn-sina-print-v2 p.308}"
  en: "The great breath is the breath taking in much air above the moderate — the breath-organs expanding in it in every direction with an ample expansion — and the small is its opposite, the inhaled made small, and so on the side of expelling. Its causes are the three causes of the great pulse already named; and it is not right that the small is only what is done by the diaphragm's motion alone — that may be moderate, and it may be small when all the chest organs are weak and the diaphragm alone cannot suffice for the needed breath. The causes of all these organs' labouring at the motion with violence are four: a great need from a burning of heat in the heart's quarters; a cause in the moving muscles themselves — weakness in them or by the sharing of their roots; a convulsion, palsy or bad temperament befalling them; or narrowness of the passages — the larynx, the windpipe's channels and the arteries and what joins them of the breath's outlets, as the sponginess of the lung when it fills with humours and its blockages multiply or a tumour arises, as in asthma, in the pus-possessed and in pneumonia. From this kind is the sleeper's great breath, for the smoky vapours multiply in it and the breath neglects willing the out-breath until the urging piles up. The hard breath is the great breath where the power seems to strain an extra striving for the drawing-in and the puffing-out. The high soaring breath is the kind of the great that needs moving the upper chest muscles without the need reaching the diaphragm and the lower muscles — it much arises in the epidemic fevers. The small is known by its causes from knowing the great's by opposition, and it may be made small by pain: if yawning joins it, it points to the nature's death; if frequency joins it, to a pain in the breath-organs and their neighbours as their ulcers and tumours. The short is the long's contrary; if frequency couples with it, its cause is a pain in the breathing instrument and its neighbours; if unevenness couples with it, it points to the inborn heat's death {cite:canon-ibn-sina-print-v2 p.308}"
  fr: "La grande respiration est celle qui prend beaucoup d'air au-dessus du modéré, les organes de la respiration s'y dilatant en tous sens d'une ample dilatation, et la petite en est le contraire, l'air inspiré rendu petit, et de même du côté de l'expulsion. Ses causes sont les trois causes du grand pouls déjà nommées ; et il n'est pas juste que la petite soit seulement celle qui se fait par le seul mouvement du diaphragme : celle-ci peut être modérée, et elle peut être petite lorsque tous les organes de la poitrine sont faibles et que le diaphragme seul ne peut suffire à la respiration nécessaire. Les causes du travail violent de tous ces organes au mouvement sont quatre : un grand besoin venant d'un embrasement de chaleur dans les quartiers du cœur ; une cause dans les muscles moteurs eux-mêmes, une faiblesse en eux ou par la participation de leurs racines ; une convulsion, une paralysie ou un mauvais tempérament qui les frappe ; ou l'étroitesse des passages, le larynx, les canaux de la trachée et les artères et ce qui s'y joint des issues du souffle, comme la spongiosité du poumon lorsqu'il se remplit d'humeurs et que ses obstructions se multiplient ou qu'une tuméfaction survient, comme dans l'asthme, chez ceux qui ont du pus et dans la pneumonie. De ce genre est la grande respiration du dormeur, car les vapeurs fumeuses s'y multiplient et la respiration néglige de vouloir l'expiration jusqu'à ce que l'urgence s'accumule. La respiration dure est la grande respiration où la force semble déployer un effort supplémentaire pour l'aspiration et le souffle. La respiration haute et ascendante est le genre de la grande qui a besoin de mouvoir les muscles supérieurs de la poitrine sans que le besoin atteigne le diaphragme et les muscles inférieurs ; elle survient beaucoup dans les fièvres épidémiques. La petite se connaît par ses causes à partir de la connaissance de celles de la grande, par opposition, et elle peut être rendue petite par la douleur : si le bâillement s'y joint, elle indique la mort de la nature ; si la fréquence s'y joint, une douleur dans les organes de la respiration et leurs voisins, comme leurs ulcères et leurs tuméfactions. La courte est le contraire de la longue ; si la fréquence s'y associe, sa cause est une douleur dans l'instrument de la respiration et ses voisins ; si l'inégalité s'y associe, elle indique la mort de la chaleur innée {cite:canon-ibn-sina-print-v2 p.308}"
  ur: "بڑی سانس وہ ہے جو معتدل سے بہت زیادہ ہوا لیتی ہے جس میں تنفس کے اعضاء ہر طرف کشادہ پھیلتے ہیں اور چھوٹی اس کے بالعکس ہے؛ اس کے اسباب نبض عظیم کے بتائے ہوئے تین اسباب ہیں اور یہ درست نہیں کہ چھوٹی صرف وہی ہے جو صرف حجاب کی حرکت سے ہو — وہ معتدل بھی ہو سکتی ہے اور چھوٹی بھی جب سینے کے تمام اعضاء کمزور ہوں اور حجاب اکیلا ضرورت پوری نہ کرے؛ ان اعضاء کے عنت سے حرکت کرنے کے اسباب چار ہیں: دل کے اطراف میں گرمی کی التہاب کی بڑی ضرورت یا چلانے والے پٹھوں میں ہی کمزوری یا ان کی جڑوں کی مشارکت یا راستوں کی تنگی؛ اور اس میں نفس شديد وہ ہے جس میں بڑائی کے ساتھ ایسا محسوس ہو کہ قوت داخل کرنے کے لیے زائد زحمت اٹھا رہی ہو اور اخراج میں پھونک؛ اور نفس عالی شاہق بڑی کی وہ قسم ہے جس میں سینے کے اوپر کے پٹھوں کو چلانے کی ضرورت پڑے مگر حجاب اور نچلے پٹھوں تک نہ پہنچے اور یہ وبائی بخاروں میں اکثر ہوتی ہے؛ چھوٹی کے اسباب بڑی کے اسباب کے مقابل سے معلوم ہوتے ہیں اور وہ درد سے بھی چھوٹی ہو سکتی ہے اگر اس کے ساتھ جمائی ہو تو طبیعت کی موت پر اور اگر تواتر ہو تو تنفس کے اعضاء میں درد پر دلالت کرتی ہے؛ اور قصیر لمبی کی مخالف ہے اگر اس کے ساتھ تواتر ہو تو سبب آلات تنفس میں درد ہوتا ہے اور اگر تفاوت ہو تو فطری حرارت کی موت پر دلالت کرتی ہے {cite:canon-ibn-sina-print-v2 p.308}"
  es: "La respiración grande es la respiración que toma mucho aire por encima de la moderada —los órganos respiratorios se expanden en ella en todas direcciones con una amplia expansión— y la pequeña es su opuesto, lo inhalado se hace pequeño, y así del lado de la expulsión. Sus causas son las tres causas del pulso grande ya nombradas; y no es correcto que la pequeña sea solo lo que se hace por el movimiento del diafragma solamente —que puede ser moderado, y puede ser pequeño cuando todos los órganos del pecho están débiles y el diafragma por sí solo no puede bastar para la respiración necesaria. Las causas de que todos estos órganos se esfuercen en el movimiento con violencia son cuatro: una gran necesidad de un ardor de calor en las áreas del corazón; una causa en los músculos móviles mismos —debilidad en ellos o por compartir sus raíces; una convulsión, parálisis o mal temperamento que les sobreviene; o estrechamiento de los conductos: la laringe, los canales de la tráquea y las arterias y lo que los une de las salidas de la respiración, como la esponjosidad del pulmón cuando se llena de humores y sus obstrucciones se multiplican o surge un tumor, como en el asma, en los infectados con pus y en la neumonía. De este tipo es la gran respiración del durmiente, porque los vapores humeantes se multiplican en ella y la respiración descuida la voluntad de exhalar hasta que la urgencia se acumula. La respiración dificultosa es la gran respiración donde la fuerza parece esforzarse un esfuerzo adicional para inhalar y exhalar. La respiración alta y ascendente es el tipo de gran respiración que necesita mover los músculos superiores del pecho sin necesidad de llegar al diafragma y los músculos inferiores; surge mucho en las fiebres epidémicas. Lo pequeño se conoce por sus causas al conocer las de lo grande por oposición, y puede ser reducido por el dolor: si se le une el bostezo, apunta a la muerte de la naturaleza; si se le une la frecuencia, a un dolor en los órganos respiratorios y sus vecinos como úlceras y tumores. Lo corto es el contrario de lo largo; si se le une la frecuencia, su causa es un dolor en el aparato respiratorio y sus vecinos; si se le une la irregularidad, apunta a la muerte del calor innato {cite:canon-ibn-sina-print-v2 p.308}"
  tr: "Büyük nefes, orta seviyenin üzerinde çok fazla hava alan nefestir; buradan ruh organları bolca yayılır, kemik ve küçük nefesler ise zıtlık. Büyük nefesin nedenleri büyük nabzın üç nedenidir, ancak küçük olanın sadece diyafram hareketiyle hareket ettiği doğru değildir; orta ya da küçük olabilir. Tüm göğüs organları zayıfsa, diyafram tek başına yeterli değildir. Tüm organların şiddetli hareketinin nedenleri dördüncü sıradadır: kalp bölgelerinde büyük bir ısı iltihabı ihtiyacı veya kaslarda bir sebep. Uyarıcı tip, içinde zayıftır ya da eklem kökleri ya da dar geçitler nedeniyle olur. Kemikle birlikte gelen şiddetli nefes, sanki güç sıkıntısı nedeniyle yerleştirilmesi ve üfleme yoluyla üflenmesi gerekir. Yüksek ve uzun tip, üst göğüs kaslarının hareketi olmayan ve diyafram ya da alt kasların hareket etmesini gerektirmeyen büyük tiptir. Bu genellikle salgın ateşlerde görülür. Küçük nefesin nedenleri büyükler tarafından büyük ateşin nedenleri olarak bilinir ve ağrı nedeniyle küçülebilir. Esneme eşlik ederse, doğanın ölümünü gösterir ve Sıklık solunum organlarındaki ağrıyı gösterirken, kısa ağrı uzun ağrının tersidir; frekans (tawatir) ile birleştiğinde solunum yolu ağrısı ve aşağıdaki mekanizmalardan kaynaklanır; varyasyonla birlikte gelirse içgüdü ölümünü gösterir {cite:canon-ibn-sina-print-v2 s.308}"
  id: "Napas besar adalah napas yang menghirup banyak udara di atas tingkat menengah; dari sini, organ jiwa menyebar melimpah, sedangkan tulang dan napas kecil adalah sebaliknya. Penyebab napas besar adalah tiga penyebab denyut nadi besar, tetapi tidak benar bahwa napas kecil hanya bergerak dengan gerakan diafragma; bisa sedang atau kecil. Jika semua organ dada lemah, diafragma saja tidak cukup. Penyebab gerakan berat semua organ menempati urutan keempat: kebutuhan akan panas besar, peradangan di area jantung atau penyebab otot. Jenis stimulasi lemah di dalam atau karena akar sendi atau saluran sempit. Pernapasan berat yang disertai oleh tulang harus ditempatkan dan ditiup dengan meniup seolah-olah karena kekurangan kekuatan. Tipe tinggi dan panjang adalah tipe besar, di mana otot dada bagian atas tidak bergerak dan tidak memerlukan gerakan diafragma atau otot bawah. Hal ini biasanya terlihat pada demam epidemi. Penyebab pernapasan kecil diketahui oleh orang dewasa sebagai penyebab demam tinggi dan dapat menyusut akibat rasa sakit. Jika disertai dengan menguap, ini menunjukkan kematian alam dan frekuensi menunjukkan nyeri di organ pernapasan, sementara nyeri singkat adalah kebalikan dari nyeri yang panjang; jika dikombinasikan dengan frekuensi (tawatir), ini disebabkan oleh nyeri pernapasan dan mekanisme berikut; jika disertai dengan variasi, ini menunjukkan kematian insting {cite:canon-ibn-sina-print-v2 hlm.308}"
