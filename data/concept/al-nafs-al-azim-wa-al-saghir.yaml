id: concept/al-nafs-al-azim-wa-al-saghir
class: concept
kind: scientific
label:
  ar: "النفس العظيم والصغير"
  en: "The great breath and the small"
  ur: "بڑی اور چھوٹی سانس"
summary:
  ar: "النفس العظيم هو الذي ينال هواء كثيراً جداً فوق المعتدل تنبسط منه أعضاء النفس في الجهات كلها انبساطاً وافر العظم والصغير بالضد، وأسباب العظيم أسباب النبض العظيم الثلاثة وليس الصحيح أن الصغير هو الذي يتم بحركة الحجاب فقط فقد يكون ذلك معتدلاً وقد يكون صغيراً كانت الأعضاء الصدرية كلها ضعيفة فلا يفي الحجاب وحده بالمحتاج إليه، والأسباب في تجشم الأعضاء كلها للحركة بعنف أربعة عظيم الحاجة لالتهاب حرارة في نواحي القلب أو سبب في العضل المحركة من ضعف فيها أو بمشاركة الأصول أو ضيق المنافذ، ومن النفس الشديد وهو الذي يكون مع عظمه كأن القوة تتكلف فضل انزعاج للإدخال والنفخ بالإخراج، والعالي الشاهق وهو الصنف من العظيم الذي يفتقر إلى تحريك أعالي عضل الصدر ولا تبلغ الحاجة إلى تحريك الحجاب وأسافل العضل وكثيراً ما يحدث في الحميات الوبائية، والصغير تعرف أسبابه للمعرفة بأسباب العظيم على سبيل المقابلة وقد يصغر بسبب الوجع وإذا اقترن به التثاؤب دل على موت الطبيعة وإذا اقترن به التواتر دل على وجع في أعضاء التنفس، والقصير مخالف للطويل وإذا قرن به التواتر كان سببه وجعاً في آلة التنفس وما يليها وإذا قرن به التفاوت دل على موت الغريزة {cite:canon-ibn-sina-print-v2 p.308}"
  en: "The great breath is the breath taking in much air above the moderate — the breath-organs expanding in it in every direction with an ample expansion — and the small is its opposite, the inhaled made small, and so on the side of expelling. Its causes are the three causes of the great pulse already named; and it is not right that the small is only what is done by the diaphragm's motion alone — that may be moderate, and it may be small when all the chest organs are weak and the diaphragm alone cannot suffice for the needed breath. The causes of all these organs' labouring at the motion with violence are four: a great need from a burning of heat in the heart's quarters; a cause in the moving muscles themselves — weakness in them or by the sharing of their roots; a convulsion, palsy or bad temperament befalling them; or narrowness of the passages — the larynx, the windpipe's channels and the arteries and what joins them of the breath's outlets, as the sponginess of the lung when it fills with humours and its blockages multiply or a tumour arises, as in asthma, in the pus-possessed and in pneumonia. From this kind is the sleeper's great breath, for the smoky vapours multiply in it and the breath neglects willing the out-breath until the urging piles up. The hard breath is the great breath where the power seems to strain an extra striving for the drawing-in and the puffing-out. The high soaring breath is the kind of the great that needs moving the upper chest muscles without the need reaching the diaphragm and the lower muscles — it much arises in the epidemic fevers. The small is known by its causes from knowing the great's by opposition, and it may be made small by pain: if yawning joins it, it points to the nature's death; if frequency joins it, to a pain in the breath-organs and their neighbours as their ulcers and tumours. The short is the long's contrary; if frequency couples with it, its cause is a pain in the breathing instrument and its neighbours; if unevenness couples with it, it points to the inborn heat's death {cite:canon-ibn-sina-print-v2 p.308}"
  ur: "بڑی سانس وہ ہے جو معتدل سے بہت زیادہ ہوا لیتی ہے جس میں تنفس کے اعضاء ہر طرف کشادہ پھیلتے ہیں اور چھوٹی اس کے بالعکس ہے؛ اس کے اسباب نبض عظیم کے بتائے ہوئے تین اسباب ہیں اور یہ درست نہیں کہ چھوٹی صرف وہی ہے جو صرف حجاب کی حرکت سے ہو — وہ معتدل بھی ہو سکتی ہے اور چھوٹی بھی جب سینے کے تمام اعضاء کمزور ہوں اور حجاب اکیلا ضرورت پوری نہ کرے؛ ان اعضاء کے عنت سے حرکت کرنے کے اسباب چار ہیں: دل کے اطراف میں گرمی کی التہاب کی بڑی ضرورت یا چلانے والے پٹھوں میں ہی کمزوری یا ان کی جڑوں کی مشارکت یا راستوں کی تنگی؛ اور اس میں نفس شديد وہ ہے جس میں بڑائی کے ساتھ ایسا محسوس ہو کہ قوت داخل کرنے کے لیے زائد زحمت اٹھا رہی ہو اور اخراج میں پھونک؛ اور نفس عالی شاہق بڑی کی وہ قسم ہے جس میں سینے کے اوپر کے پٹھوں کو چلانے کی ضرورت پڑے مگر حجاب اور نچلے پٹھوں تک نہ پہنچے اور یہ وبائی بخاروں میں اکثر ہوتی ہے؛ چھوٹی کے اسباب بڑی کے اسباب کے مقابل سے معلوم ہوتے ہیں اور وہ درد سے بھی چھوٹی ہو سکتی ہے اگر اس کے ساتھ جمائی ہو تو طبیعت کی موت پر اور اگر تواتر ہو تو تنفس کے اعضاء میں درد پر دلالت کرتی ہے؛ اور قصیر لمبی کی مخالف ہے اگر اس کے ساتھ تواتر ہو تو سبب آلات تنفس میں درد ہوتا ہے اور اگر تفاوت ہو تو فطری حرارت کی موت پر دلالت کرتی ہے {cite:canon-ibn-sina-print-v2 p.308}"
