  en: "Tasarri (lawful relations with an owned slave woman, and its rules)"
  ur: "تسری (مملوکہ لونڈی سے ملک یمین کے تحت تعلق اور اس کے احکام)"
summary:
  ar: "التسري وطء الرجل مملوكته بملك اليمين، وهو جائز بالكتاب والسنة والإجماع بشروط: الملك، وأن تكون الأمة مسلمة أو كتابية، وألا تكون محرمة بسبب من الأسباب. وفيه أحكام في الاستبراء والتحريم بالصهر والمحرمية ونسب الولد، وفي الجمع بين الأختين في ملك اليمين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5065} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5066} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5067} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5069} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5070} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5072}"
  en: "Tasarri is a master's lawful relations with a woman he owns, and it is allowed by the Qur'an, the Sunna and agreement, subject to conditions: ownership, a woman who is a Muslim or a People of the Book, and no bar of kinship or marriage. Its rules cover the waiting period, the bars by marriage and kinship, the descent of the child, and the joining of two sisters in ownership. The schools differ on the descent of a child born of such relations. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5065} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5066} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5067} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5069} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5070} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5072}"
