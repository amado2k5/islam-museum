summary:
  ar: "اللاذن رطوبة تتعلق بشعر المعزى الراعية ولحائها، حار في آخر الأولى يابس في الثانية، لطيف منضج محلل، ينبت الشعر وينفع الأذن والسعال {cite:canon-ibn-sina-print-v1 p.536} {cite:canon-ibn-sina-print-v1 p.537}."
  en: "Ladanum is a moisture that clings to the hair and beard of grazing goats; hot at the end of the first degree and dry in the second, fine, ripening and dissolving, it makes hair grow and helps the ear and cough {cite:canon-ibn-sina-print-v1 p.536} {cite:canon-ibn-sina-print-v1 p.537}."
  ur: "لاذن ایک رطوبت ہے جو چرنے والی بکریوں کے بالوں اور داڑھی سے چپکتی ہے؛ پہلے درجے کے آخر میں گرم اور دوسرے میں خشک، لطیف، پکانے اور تحلیل کرنے والا، بال اگاتا ہے اور کان اور کھانسی میں مفید ہے {cite:canon-ibn-sina-print-v1 p.536} {cite:canon-ibn-sina-print-v1 p.537}۔"
  es: "El ládano es una humedad que se adhiere al pelo y la barba de las cabras que pastan; caliente al final del primer grado y seco en el segundo, fino, madurando y disolviéndose, hace crecer el pelo y ayuda con el oído y la tos {cite:canon-ibn-sina-print-v1 p.536} {cite:canon-ibn-sina-print-v1 p.537}."
  fr: "Le ladanum est une humidité qui s'accroche aux poils et à la barbe des chèvres au pâturage; chaude à la fin du premier degré et sèche au deuxième, fine, mûrissante et dissolvante, elle fait pousser les poils et aide pour les oreilles et la toux {cite:canon-ibn-sina-print-v1 p.536} {cite:canon-ibn-sina-print-v1 p.537}."
