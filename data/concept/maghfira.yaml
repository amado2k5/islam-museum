label:
  ar: المغفرة
  en: Divine forgiveness (maghfira)
  es: "Perdón divino (maghfira)"
  fr: "Pardon divin (maghfira)"
summary:
  ar: "المغفرة في الحديث الثاني والأربعين — آخر الأربعين النووية — أوسع ما جاء في وعد الله لعباده: «يا بن آدم إنك ما دعوتني ورجوتني غفرت لك على ما كان منك ولا أبالي، يا بن آدم لو بلغت ذنوبك عنان السماء ثم استغفرتني غفرت لك، يا بن آدم إنك لو أتيتني بقراب الأرض خطايا ثم لقيتني لا تشرك بي شيئاً لأتيتك بقرابها مغفرة» — واستخرج ابن رجب منه ثلاثة أسباب تحصل بها: الدعاء مع الرجاء، والاستغفار، ولقاء الله بلا شرك — فالمغفرة تجاب الذنوب مهما عظمت ما دامت بلا شرك وبالدعاء الراجي والاستغفار الصادق ⁦(جامع العلوم والحكم ص 830–831)⁩."
  en: "Divine forgiveness in the forty-second hadith — the last of al-Nawawi's Forty — is the widest promise God made His servants: 'son of Adam, so long as you call upon Me and hope in Me, I forgive you whatever has issued from you, and I do not care; son of Adam, were your sins to reach the clouds of the sky and then you sought My forgiveness, I would forgive you; son of Adam, were you to come to Me with an earthful of sins and then meet Me associating nothing with Me, I would come to you with an earthful of forgiveness' — from which Ibn Rajab drew three means by which it is won: supplication joined to hope, seeking forgiveness, and meeting God without association — so forgiveness answers sins however great, so long as they are free of shirk and met with hopeful supplication and sincere seeking of pardon (Jami' al-Ulum wal-Hikam pp. 830–831)."
  es: "El perdón divino en el hadiz número cuarenta y dos —el último de los Cuarenta de al-Nawawi— es la promesa más amplia que Dios hizo a Sus siervos: «Hijo de Adán, mientras me invoques y tengas esperanza en mí, te perdono todo lo que haya salido de ti, y no me importa; hijo de Adán, si tus pecados llegaran a las nubes del cielo y luego buscaras mi perdón, te perdonaría; hijo de Adán, si vinieras a mí con la tierra llena de pecados y luego te encontraras conmigo sin asociar nada conmigo, vendría a ti con la tierra llena de perdón». De lo cual Ibn Rajab extrajo tres medios por los cuales se obtiene: la súplica unida a la esperanza, la búsqueda del perdón y el encuentro con Dios sin asociación. Así, el perdón responde a los pecados por grandes que sean, siempre que estén libres de shirk y se encuentren con una súplica esperanzada y una búsqueda sincera del perdón (Jami' al-Ulum wal-Hikam, págs. 830-831)."
  fr: "Le pardon divin mentionné dans le quarante-deuxième hadith — le dernier des quarante d'al-Nawawi — est la promesse la plus large que Dieu ait faite à Ses serviteurs: « Fils d'Adam, tant que tu M'invoques et que tu espères en Moi, Je te pardonne tout ce qui est sorti de toi, et cela ne Me regarde pas; fils d'Adam, même si tes péchés atteignaient les nuages du ciel et que tu implorais Mon pardon, Je te pardonnerais; fils d'Adam, même si tu venais à Moi chargé de péchés et que tu Me rencontrais sans M'associer quoi que ce soit, Je viendrais à toi chargé de pardon. » Ibn Rajab en a tiré trois moyens d'obtenir ce pardon: la supplication accompagnée d'espoir, la recherche du pardon et la rencontre avec Dieu sans association. Ainsi, le pardon répond aux péchés, aussi grands soient-ils, pourvu qu'ils soient exempts de shirk et accompagnés d'une supplication pleine d'espoir et d'une recherche sincère du pardon (Jami' al-Ulum wal-Hikam, p. 830-831)."
