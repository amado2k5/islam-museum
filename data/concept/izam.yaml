label:
  ar: "عظام"
  en: "Izam (bones, as drugs)"
  ur: "عظام"
  es: "Izam (huesos, como drogas)"
  fr: "Izam (os, comme drogues)"
  tr: "Kemikler"
  id: "Tulang"
summary:
  ar: "العظام في الكتاب مفردات حيوانية: المحرقة منها محللة مجففة، ويورد الكتاب بصيغة قيل أقوالا في كعب الخنزير والتيس وساق البقر وعظام الناس، ويبقى ما ينقل منها نقلا منسوبا لا إرشادا {cite:canon-ibn-sina-print-v1 p.622}"
  en: "Izam are in the book animal drugs: burnt bones are dissolving and drying, and the book gives, with the word it is said, statements on the heel bone of the pig and of the he-goat, the shank of the ox and the bones of human beings, which are reported claims and not advice {cite:canon-ibn-sina-print-v1 p.622}"
  ur: "عظام کتاب میں حیوانی ادویہ ہیں: جلی ہوئی ہڈیاں تحلیل کرنے والی اور خشک کرنے والی ہیں، اور کتاب “کہا گیا” کے صیغے سے خنزیر اور بکرے کی ٹخنے کی ہڈی، گائے کی پنڈلی اور انسانی ہڈیوں کے بارے میں اقوال لاتی ہے، جو منسوب نقل ہیں مشورہ نہیں {cite:canon-ibn-sina-print-v1 p.622}۔"
  es: "En el libro se mencionan medicamentos para animales: los huesos quemados se disuelven y se secan, y el libro da, con la palabra \"se dice\", afirmaciones sobre el hueso del talón del cerdo y del macho cabrío, la pierna del buey y los huesos de los seres humanos, que son afirmaciones reportadas y no consejos {cite:canon-ibn-sina-print-v1 p.622}"
  fr: "Dans le livre des médicaments pour animaux, il est dit que les os brûlés se dissolvent et se dessèchent. Le livre donne également des indications sur le talon du porc et du bouc, le jarret du bœuf et les os humains, qui sont des affirmations rapportées et non des conseils. {cite:canon-ibn-sina-print-v1 p.622}"
  tr: "Kitaptaki kemikler hayvansal terimlerdir: yanmış olan kurutulmuş krematoryum olarak kabul edilir. Kitap, söylendiği gibi, bir domuz, keçi, inek bacağı ve insan kemikleri hakkında ifadeler sunar, ancak aktarılan şey başkalarına atfedilir, rehberlik değil {cite:canon-ibn-sina-print-v1 s.622}"
  id: "Tulang dalam buku ini adalah istilah hewan: yang terbakar dianggap sebagai krematorium kering. Buku ini menyajikan, seperti yang dikatakan, pernyataan tentang tumit babi, kambing, kaki sapi, dan tulang manusia, tetapi apa yang ditularkan tetap dikaitkan dengan orang lain, bukan panduan {cite:canon-ibn-sina-print-v1 hlm.622}"
