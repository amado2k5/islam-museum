id: concept/al-samawat-al-sab
class: concept
kind: belief
label:
  ar: السماوات السبع
  en: The seven heavens
  ur: سات آسمان
summary:
  ar: "خلق الله سبع سماوات طباقاً لا تفاوت فيها، لكل سماء أمرها وأهلها، ولها أبواب فتحت للنبي ليلة المعراج باباً باباً حتى سدرة المنتهى {cite:tafsir-ibn-kathir} {cite:sahih-al-bukhari}."
  en: "God created seven heavens in layers with no disparity; each has its affair and inhabitants, and gates that were opened to the Prophet on the Night of the Ascent, gate after gate, up to the Lote Tree of the Utmost Boundary {cite:tafsir-ibn-kathir} {cite:sahih-al-bukhari}."
  ur: "اللہ نے سات آسمان تہہ بہ تہہ بنائے جن میں کوئی شگاف نہیں؛ ہر آسمان کا اپنا شان اور باشندے ہیں، اور معراج کی رات نبی کے لیے دروازے کھولے گئے یہاں تک کہ سدرۃ المنتہیٰ تک {cite:tafsir-ibn-kathir} {cite:sahih-al-bukhari}۔"
