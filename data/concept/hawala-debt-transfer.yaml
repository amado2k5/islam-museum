label: { ar: "الحوالة", en: "Hawala (transfer of debt)", ur: "حوالہ (قرض کی منتقلی)" }
summary:
  ar: "الحوالة لغة التحول والانتقال، واصطلاحا نقل الدين من ذمة إلى ذمة، ويتم بإيجاب وقبول بين اثنين من الأطراف الثلاثة: الدائن والمدين والملتزم بالأداء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7336} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7337} فالمحيل هو المدين، والمحال هو الدائن، والمحال عليه هو الملتزم بالدين، والمحال به هو الدين نفسه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7337} وتفترق الحوالة عن الكفالة والضمان في أن الحوالة تبرئ ذمة المحيل، وتفترق عن الإبراء بأنها نقل للحق لا إسقاط له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7337} والحوالة مشروعة بالسنة وهي قوله: مطل الغني ظلم، وإذا أُتبع أحدكم على مليء فليتبع، وبالإجماع، ومقيسة على الكفالة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7337} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7338} واختلف في الأمر بالقبول: فيرى الكمال بن الهمام أنه للإباحة، ومن عرف منه حسن القضاء استحب اتباعه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7339} وفي حقيقة العقد: يرى الحنفية والحنابلة والشافعي في الأصح أنها مستثناة من بيع الدين بالدين، ويرى بعض العلماء أنها بيع، وأن ابن تيمية وابن القيم لا يسلمان بأنها خلاف القياس، وأن الحوالة عقد إرفاق منفرد عند الحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7339} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7340} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7341} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7342} ويكمل المدخل بعد ص 7342. "
  en: "Hawala lexically is transfer; technically it is the transfer of a debt from one liability to another by offer and acceptance between two of three parties: the creditor, the debtor and the one who undertakes payment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7336} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7337} The transferor is the debtor, the transferee the creditor, the transferee-debtor the one who undertakes payment, and the debt is the object. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7337} Hawala differs from surety in that it releases the transferor's liability, and from release in that it moves a right rather than dropping it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7337} It is lawful by the saying 'delay by a rich man is wrong, and when one of you is referred to a solvent man let him follow the reference', by consensus and by analogy with surety. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7337} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7338} On the command to accept, Ibn al-Humam takes it as permission, and a creditor known for good payment may be followed as recommended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7339} On the nature of the contract, the Hanafis, Hanbalis and the sounder Shafii view treat hawala as an exception to the sale of debt for debt; others call it a sale; Ibn Taymiyya and Ibn al-Qayyim deny that it runs against analogy, and the Hanbalis treat it as an act of accommodation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7339} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7340} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7341} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7342} The article continues beyond p.7342. "
  ur: "حوالہ لغت میں منتقل ہونے کو کہتے ہیں، اور اصطلاح میں دین کو ایک ذمے سے دوسرے ذمے میں منتقل کرنا، جو ایجاب و قبول سے تین فریقوں میں سے دو کے درمیان ہوتا ہے: قرض دینے والا، مقروض اور ادائیگی کا ذمہ دار۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7336} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7337} محیل مقروض ہے، محال قرض خواہ، محال علیہ ادائیگی کا ذمہ دار اور محال بہ خود دین ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7337} حوالہ کفالہ اور ضمان سے اس طرح مختلف ہے کہ حوالہ محیل کی ذمہ داری کو بری کرتا ہے، اور ابراء سے اس طرح کہ حوالہ حق کو منتقل کرتا ہے، ساقط نہیں کرتا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7337} حوالہ سنت سے ثابت ہے: «مطل الغني ظلم، وإذا أُتبع أحدكم على مليء فليتبع»، اور اس پر اجماع ہے، اور کفالہ پر قیاس کیا گیا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7337} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7338} قبول کرنے کے حکم کے بارے میں ابن الہمام اسے اباحت پر محمول کرتے ہیں، اور جس کی ادائیگی اچھی معلوم ہو اس کی طرف حوالہ قبول کرنا مستحب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7339} عقد کی حقیقت میں حنفیہ، حنابلہ اور شافعیہ کے اصح قول کے مطابق حوالہ دین کے بدلے دین کی بیع سے مستثنیٰ ہے؛ بعض کے نزدیک یہ بیع ہے، اور ابن تیمیہ و ابن القیم قیاس کے خلاف ہونے کو تسلیم نہیں کرتے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7339} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7340} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7341} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7342} یہ مدخل p.7342 کے بعد جاری ہے۔ "
