id: concept/hawala-debt-transfer
class: concept
kind: legal
label: { ar: "الحوالة", en: "Hawala (transfer of debt)", ur: "حوالہ (قرض کی منتقلی)" }
summary:
  ar: "الحوالة لغة التحول والانتقال، واصطلاحا نقل الدين من ذمة إلى ذمة، ويتم بإيجاب وقبول بين اثنين من الأطراف الثلاثة: الدائن والمدين والملتزم بالأداء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7336} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7337} فالمحيل هو المدين، والمحال هو الدائن، والمحال عليه هو الملتزم بالدين، والمحال به هو الدين نفسه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7337} وتفترق الحوالة عن الكفالة والضمان في أن الحوالة تبرئ ذمة المحيل، وتفترق عن الإبراء بأنها نقل للحق لا إسقاط له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7337} والحوالة مشروعة بالسنة وهي قوله: مطل الغني ظلم، وإذا أُتبع أحدكم على مليء فليتبع، وبالإجماع، ومقيسة على الكفالة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7337} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7338} واختلف في الأمر بالقبول: فيرى الكمال بن الهمام أنه للإباحة، ومن عرف منه حسن القضاء استحب اتباعه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7339} وفي حقيقة العقد: يرى الحنفية والحنابلة والشافعي في الأصح أنها مستثناة من بيع الدين بالدين، ويرى بعض العلماء أنها بيع، وأن ابن تيمية وابن القيم لا يسلمان بأنها خلاف القياس، وأن الحوالة عقد إرفاق منفرد عند الحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7339} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7340} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7341} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7342} ويكمل المدخل بعد ص 7394.  وتتنوع الحوالة إلى مقيدة ومطلقة؛ فالمقيدة ما قُيّدت بدين للمحيل على المحال عليه أو بعين له عنده أمانة أو مضمونة، والمطلقة ما لم تُقيّد بشيء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7343} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7344} والمطلقة نوعان: حالة ومؤجلة، وقد تكون الحوالة مؤجلة بشرط الأجل أو لكون الدين مؤجلا على المحيل أو المحال عليه، ويتبع ذلك حكم الكفالة في بعض الجوانب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7345} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7346} ويرى جمهور الفقهاء أن الحوالة لا تكون على عين، بل يشترطون أن يكون المال المحال عليه دينا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7347} وأركانها عند الجمهور خمسة: الصيغة والمحيل والمحال والمحال عليه والمحال به، وعند الحنفية الصيغة وحدها ركن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7347} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7348} وتنعقد بكل لفظ يفيد معناها، والمالكية يشترطون لفظ الحوالة عند خليل، والشافعية يتحفظون في الصيغة بلفظ البيع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7349} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7350} ويشترط الجمهور رضا المحيل عند المالكية والشافعية والحنابلة، والحنفية يشترطون رضاه، مع اختلاف الرواية؛ ولا يشترط رضا المحال عليه عند الجمهور، ويشترطه الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7350} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7351} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7352} وإذا اختلف المحيل والمحال هل كان العقد حوالة أو وكالة في القبض، فالحنفية والشافعية يقبلون قول المحيل أو ينظرون إلى الصيغة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7352} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7353} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7354} وإذا ادعى المحيل الوكالة في القبض وأنكر المحال الحوالة، فللفقهاء تفصيل في القول بمن يصدق وفي أحكام المال المقبوض إن بقي أو هلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7355} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7356} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7357} ويرى المالكية والشافعية والحنابلة أن الحوالة تنعقد بإيجاب المحيل وقبول المحال في مجلس العلم، ويرى الحنفية أن الإيجاب والقبول يكونان في مجلس واحد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7357} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7358} ولا تصح الحوالة مؤقتة ولا مؤجلة إلى أجل مجهول جهالة فاحشة، ويصح تأجيل الدين المحال به إلى أجل معلوم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7359} ويشترط في المحيل العقل والأهلية، ويرى بعض الفقهاء صحة حوالة المحجور عليه لفلس بشرطين، ويشترط المالكية والشافعية والحنابلة أن يكون المحيل مدينا للمحال، والحنفية كذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7359} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7360} ويشترط في المحال العقل، ويشترط الحنفية في المحال عليه العقل والبلوغ والقدرة على الوفاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7360} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7361} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7362} ويشترط في المحال عليه الملاءة عند من يوجب قبول الحوالة عليه، والحنابلة يفسرون الملاءة بالقدرة على الوفاء وعدم الجحد والمماطلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7363} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7364} ويرى الحنفية صحة الحوالة المطلقة التي لا تقيد بدين للمحيل على المحال عليه، ويشترط جمهور غيرهم أن يكون المحال عليه مدينا للمحيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7365} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7366} والحوالة على عين لا تصح عند الجمهور، ويشترط في المال المحال به والمحال عليه أن يكون دينا ثابتا مستقرا معلوم الجنس والقدر والصفة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7366} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7367} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7368} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7369} ويشترط المالكية ثبوت الدين المحال به قبل الحوالة، ويشترط الحنابلة ثبوت المال المحال عليه قبلها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7372} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7373} ويشترط جمهور الفقهاء أن يكون المال مثليا، وأجاز الجمهور والشافعية في الأصح الحوالة بالقيمي المنضبط بالصفات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7374} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7375} ويشترط الحنفية المساواة في الصفة والقدر وكون الدينين غير مختلفين بالحلول والأجل، وتعليلهم أن الحوالة إرفاق للإيفاء والاستيفاء لا للاسترباح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7375} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7376} ويشترط الحنفية قبض رأس مال السلم أو الربوي إذا وافق المحال به في علة الربا، ولا يشترطه الشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7377} ويجوز أن يكون أحد الدينين عن عقد غير الآخر، وأن يكون الدين المحال به في غير محله الأصيل كالحوالة أو الكفالة، وتجوز الحوالة عند الشافعية على وجه تعدد المحالين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7377} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7378} ومن تخلفت شرائط انعقادها بطلت الحوالة، وهذا متفق عليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7378} وتشترط شروط النفاذ: بلوغ المحيل والمحال والمحال عليه عند الحنفية، وولاية المحال على المال المحال به، والقبول، ويرى الحنفية أن الحوالة على الوكيل أو الولي تكون موقوفة على الإجازة أو مقيدة بمصلحة القاصر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7379} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7380} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7381} والحوالة عقد لازم عند الجمهور، ولا تقبل خيار الشرط عند الشافعية والحنابلة، ويرى الحنفية أنه لا تفسخ إلا بالتراضي، ويتفرع على ذلك حكم الشروط اللاحقة الفاسدة والصحيحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7382} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7383} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7384} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7385} ومتى صحت الحوالة برئت ذمة المحيل من دين المحال، ويختلف الفقهاء في انتقال المطالبة والكفالة؛ ويرى الحنفية أن الحوالة تنقل الدين، وتنتقل الضمانات لمصلحة المدين دون ضمانات الدائن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7387} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7388} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7389} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7391} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7392} ويحق للمحال مطالبة المحال عليه ولملازمته، والمحال عليه يحبس المحيل بشروط عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7392} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7393} ويرجع المحال عليه على المحيل بعد أداء دين الحوالة عند الحنفية بشروط: رضا المحيل، وأداء المال إلى المحال، وعدم كون المحال عليه مدينا للمحيل بمثل دينه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7394}"
  en: "Hawala lexically is transfer; technically it is the transfer of a debt from one liability to another by offer and acceptance between two of three parties: the creditor, the debtor and the one who undertakes payment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7336} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7337} The transferor is the debtor, the transferee the creditor, the transferee-debtor the one who undertakes payment, and the debt is the object. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7337} Hawala differs from surety in that it releases the transferor's liability, and from release in that it moves a right rather than dropping it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7337} It is lawful by the saying 'delay by a rich man is wrong, and when one of you is referred to a solvent man let him follow the reference', by consensus and by analogy with surety. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7337} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7338} On the command to accept, Ibn al-Humam takes it as permission, and a creditor known for good payment may be followed as recommended. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7339} On the nature of the contract, the Hanafis, Hanbalis and the sounder Shafii view treat hawala as an exception to the sale of debt for debt; others call it a sale; Ibn Taymiyya and Ibn al-Qayyim deny that it runs against analogy, and the Hanbalis treat it as an act of accommodation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7339} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7340} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7341} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7342} The article continues beyond p.7394.  Hawala is divided into restricted and unrestricted: restricted when tied to a debt the transferor is owed by the transferee, or to a deposit or a secured object in the transferee's hands; unrestricted when tied to nothing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7343} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7344} The unrestricted form is either immediate or deferred, and a deferred one may be fixed by stipulation or by the terms of the original debt, with some rules borrowed from surety. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7345} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7346} Most jurists hold that hawala cannot be made on a specific object; they require the transferred sum to be a debt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7347} Pillars are five on the majority view (formula, transferor, transferee, transferee-debtor, the debt), while the Hanafis make the formula alone the pillar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7347} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7348} Any words conveying the sense are valid; the Malikis require the word hawala in Khalil's view, the Shafiis hesitate over the word sale. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7349} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7350} The transferor's consent is required by the Malikis, Shafiis and Hanbalis, and the Hanafis require it in one report; the transferee's consent is not required by the majority but is by the Hanafis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7350} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7351} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7352} If the parties dispute whether the act was a hawala or an agency to collect, the Hanafis and Shafiis have set rules about who is believed, depending on the words used. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7352} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7353} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7354} When the transferor claims the act was agency for collection and the transferee denies it, the jurists give rules on who is believed and on the money received, whether it is still held, consumed or lost. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7355} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7356} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7357} The Malikis, Shafiis and Hanbalis have the hawala concluded by the transferor's offer and the transferee's acceptance in the session of knowledge; the Hanafis require offer and acceptance in one session. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7357} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7358} A timed hawala, or one deferred to an unknown term, is invalid, while a deferred debt with a known term is valid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7359} The transferor must be sane and competent; some jurists allow a man under insolvency decree to make one under two conditions; the majority require the transferor to be a debtor to the transferee. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7359} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7360} The transferee must be sane; the Hanafis also require the transferee-debtor to be adult and able to pay. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7360} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7361} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7362} On the transferee, the Hanbalis require solvency in wealth, speech and presence; the solvent man is one who can pay, does not deny and does not delay. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7363} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7364} The Hanafis allow an unrestricted hawala that is not tied to a debt the transferor is owed; most others require the transferee to owe the transferor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7365} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7366} Hawala on a specific object is not allowed by most jurists; both the transferred sum and the transferee's sum must be a firm debt known in kind, amount and quality. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7366} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7367} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7368} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7369} The Malikis require the transferred debt to exist before the hawala; the Hanbalis require the transferee's debt to exist before it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7372} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7373} Most jurists require the sum to be fungible, while the majority and the sounder Shafii view allow a non-fungible debt fixed by attributes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7374} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7375} The Hanafis require equality of kind, quantity and quality, and no difference in deferral; their reason is that hawala is an accommodation for paying and receiving, not for profit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7375} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7376} The Hanafis require the transferee's capital of a salam or a ribawi debt to be delivered if it matches the transferred one in the cause of usury; the Shafiis do not require delivery. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7377} The two debts may come from different contracts, the transferred debt may be borrowed through another hawala or surety, and the Shafiis allow several transferees with one transferee-debtor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7377} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7378} Where any condition of formation is missing, the hawala is void, a rule agreed by all. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7378} Conditions of enforcement include the majority of the transferor, transferee and transferee-debtor by the Hanafi rule, the transferee's authority over the sum, and acceptance; the Hanafis treat a hawala on an agent or guardian as suspended on approval or tied to the ward's interest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7379} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7380} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7381} The hawala is binding on the majority; the Shafiis and Hanbalis reject the option of stipulation, the Hanafis allow it to be cancelled only by consent, and they treat later stipulations, valid or void, accordingly. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7382} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7383} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7384} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7385} Once a hawala is valid the transferor is freed from the creditor's debt; the schools differ on whether the claim and the surety pass; the Hanafis hold that the debt passes with its defences but not with the creditor's securities. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7387} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7388} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7389} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7391} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7392} The creditor may claim against the transferee and detain him; the transferee may detain the transferor under Hanafi conditions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7392} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7393} Under the Hanafis the transferee may recover from the transferor after paying the debt only if the transferor consented, the payment reached the creditor, and the transferee did not owe the transferor a like sum. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7394}"
  ur: "حوالہ لغت میں منتقل ہونے کو کہتے ہیں، اور اصطلاح میں دین کو ایک ذمے سے دوسرے ذمے میں منتقل کرنا، جو ایجاب و قبول سے تین فریقوں میں سے دو کے درمیان ہوتا ہے: قرض دینے والا، مقروض اور ادائیگی کا ذمہ دار۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7336} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7337} محیل مقروض ہے، محال قرض خواہ، محال علیہ ادائیگی کا ذمہ دار اور محال بہ خود دین ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7337} حوالہ کفالہ اور ضمان سے اس طرح مختلف ہے کہ حوالہ محیل کی ذمہ داری کو بری کرتا ہے، اور ابراء سے اس طرح کہ حوالہ حق کو منتقل کرتا ہے، ساقط نہیں کرتا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7337} حوالہ سنت سے ثابت ہے: «مطل الغني ظلم، وإذا أُتبع أحدكم على مليء فليتبع»، اور اس پر اجماع ہے، اور کفالہ پر قیاس کیا گیا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7337} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7338} قبول کرنے کے حکم کے بارے میں ابن الہمام اسے اباحت پر محمول کرتے ہیں، اور جس کی ادائیگی اچھی معلوم ہو اس کی طرف حوالہ قبول کرنا مستحب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7339} عقد کی حقیقت میں حنفیہ، حنابلہ اور شافعیہ کے اصح قول کے مطابق حوالہ دین کے بدلے دین کی بیع سے مستثنیٰ ہے؛ بعض کے نزدیک یہ بیع ہے، اور ابن تیمیہ و ابن القیم قیاس کے خلاف ہونے کو تسلیم نہیں کرتے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7339} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7340} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7341} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7342} یہ مدخل p.7342 کے بعد جاری ہے۔  حوالہ مقیّد اور مطلق میں تقسیم ہوتا ہے: مقیّد وہ ہے جو محیل کے محال علیہ پر دین یا محال علیہ کے پاس محیل کی امانت یا مضمون شے سے مشروط ہو، اور مطلق وہ ہے جو کسی چیز سے مشروط نہ ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7343} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7344} مطلق حوالہ فوری یا مؤجل ہو سکتا ہے، اور مؤجل حوالہ شرط یا اصل دین کی مدت سے ہوتا ہے، اور اس میں کفالہ کے کچھ احکام شامل ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7345} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7346} جمہور کے نزدیک کسی متعین عین پر حوالہ نہیں ہوتا، بلکہ محال بہ کا دین ہونا شرط ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7347} جمہور کے نزدیک ارکان پانچ ہیں: صیغہ، محیل، محال، محال علیہ اور محال بہ؛ حنفیہ کے نزدیک صرف صیغہ رکن ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7347} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7348} ہر ایسا لفظ جو اس کے معنی پر دلالت کرے کافی ہے؛ مالکیہ خلیل کے نزدیک لفظ حوالہ کو شرط کہتے ہیں، اور شافعیہ بیع کے لفظ سے احتیاط کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7349} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7350} محیل کی رضامندی مالکیہ، شافعیہ اور حنابلہ کے نزدیک شرط ہے اور حنفیہ کے نزدیک بھی ہے؛ محال علیہ کی رضامندی جمہور کے نزدیک شرط نہیں، حنفیہ کے نزدیک شرط ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7350} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7351} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7352} اگر محیل اور محال اختلاف کریں کہ عقد حوالہ تھا یا وصولی کی وکالت، تو حنفیہ اور شافعیہ الفاظ کے لحاظ سے قول کا فیصلہ کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7352} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7353} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7354} جب محیل وکالت کا دعویٰ کرے اور محال حوالہ کا انکار کرے تو فقہاء نے یہ بیان کیا ہے کہ کس کی بات مانی جائے، اور اگر وصول شدہ مال باقی ہو، خرچ ہو گیا ہو یا ضائع ہو جائے تو کیا حکم ہوگا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7355} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7356} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7357} مالکیہ، شافعیہ اور حنابلہ کے نزدیک حوالہ محیل کے ایجاب اور محال کے قبول سے مجلسِ علم میں منعقد ہوتا ہے؛ حنفیہ کے نزدیک ایجاب و قبول ایک ہی مجلس میں ہونے چاہییں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7357} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7358} موقّت یا غیر معلوم مدت تک مؤجل حوالہ درست نہیں، اور معلوم مدت تک دین کی تأجیل درست ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7359} محیل کا عاقل اور اہل ہونا شرط ہے، اور جمہور کے نزدیک وہ محال کا مقروض ہو؛ بعض فقہاء دیوالیہ قرار دیے گئے شخص کے حوالے کو دو شرائط کے ساتھ جائز کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7359} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7360} محال عاقل ہو، اور حنفیہ کے نزدیک محال علیہ بالغ اور ادائیگی پر قادر ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7360} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7361} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7362} جن فقہاء کے نزدیک محال علیہ کی ملاءت شرط ہے، حنابلہ اس کی تفسیر اس طرح کرتے ہیں کہ وہ ادائیگی پر قادر ہو اور انکار یا ٹال مٹول نہ کرے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7363} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7364} حنفیہ مطلق حوالہ کو جائز کہتے ہیں جو محیل کے محال علیہ پر دین سے مقید نہ ہو، اور جمہور کے نزدیک محال علیہ کا محیل کا مقروض ہونا شرط ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7365} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7366} جمہور کے نزدیک عین پر حوالہ جائز نہیں؛ محال بہ اور محال علیہ دونوں دین ثابت و مستقر ہوں اور جنس، مقدار اور صفت میں معلوم ہوں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7366} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7367} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7368} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7369} مالکیہ کے نزدیک محال بہ کا دین حوالے سے پہلے ثابت ہونا شرط ہے، جبکہ حنابلہ محال علیہ کے دین کا پہلے ثابت ہونا شرط کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7372} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7373} جمہور کے نزدیک مال مثلی ہونا چاہیے، اور جمہور و شافعیہ کے اصح قول کے مطابق صفات سے منضبط قیمی دین پر بھی حوالہ جائز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7374} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7375} حنفیہ جنس، مقدار اور وصف میں مساوات اور حلول و تاجیل میں یکسانیت شرط کہتے ہیں، کیونکہ حوالہ ادائیگی اور وصولی کا ارفاق ہے، نفع کمانے کا ذریعہ نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7375} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7376} حنفیہ کے نزدیک سلم کے سرمایہ یا ربوی دین میں قبضہ شرط ہے جب وہ محال بہ کی علت ربا کے موافق ہو، اور شافعیہ قبضہ کو شرط نہیں کہتے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7377} دونوں دین مختلف عقود سے ہو سکتے ہیں، اور شافعیہ کے نزدیک ایک محال علیہ پر متعدد محال ہو سکتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7377} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7378} اگر انعقاد کی کوئی شرط نہ پائی جائے تو حوالہ باطل ہوتا ہے، اور یہ متفقہ اصول ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7378} نفاذ کی شرائط میں حنفیہ کے نزدیک محیل، محال اور محال علیہ کا بالغ ہونا، محال کا محال بہ پر ولایت رکھنا اور قبول شامل ہیں؛ وکیل یا ولی کی حوالہ توقف یا مصلحتِ قاصر کے ساتھ مقید ہوتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7379} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7380} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7381} جمہور کے نزدیک حوالہ لازم عقد ہے؛ شافعیہ اور حنابلہ خیارِ شرط قبول نہیں کرتے، اور حنفیہ کے نزدیک باہمی رضا کے بغیر فسخ نہیں ہوتا۔ بعد میں لگائی گئی شرطوں کا حکم اسی کے مطابق ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7382} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7383} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7384} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7385} حوالہ صحیح ہونے کے بعد محیل کی ذمہ داری قرض خواہ کے دین سے بری ہو جاتی ہے؛ حنفیہ کے نزدیک دین اپنے دفاعی اسباب کے ساتھ منتقل ہوتا ہے مگر قرض خواہ کی وثیقات منتقل نہیں ہوتیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7387} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7388} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7389} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7391} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7392} قرض خواہ محال علیہ سے مطالبہ اور ملازمت کر سکتا ہے، اور حنفیہ کے نزدیک بعض شرائط پر محال علیہ محیل کو روک سکتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7392} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7393} حنفیہ کے نزدیک محال علیہ ادائیگی کے بعد محیل سے واپسی تبھی لے سکتا ہے جب محیل راضی ہو، ادائیگی محال تک پہنچی ہو اور محال علیہ کا محیل پر اسی جیسا دین نہ ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7394}"
