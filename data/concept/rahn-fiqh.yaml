id: concept/rahn-fiqh
class: concept
kind: legal
label:
  ar: "الرهن"
  en: "Rahn: the pledge of property as security for a debt (its ruling, parties, pledged item, use, liability, sale and ending)"
  ur: "رہن (قرض کی ضمانت کے طور پر گروی)"
summary:
  ar: "الرهن لغة الثبوت والدوام، ويأتي بمعنى الحبس، وشرعا جعل عين مالية وثيقة بدين يستوفى منها أو من ثمنها عند تعذر الوفاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9021} ويفارق الضمان، لأن الضمان ضم ذمة إلى ذمة في المطالبة، أما الرهن فلا بد فيه من عين مالية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9022} والرهن مشروع بالكتاب والسنة والإجماع، وهو جائز غير واجب، وقد رهن النبي درعه عند يهودي في طعام اشتراه إلى أجل، وجمهور الفقهاء على جوازه في الحضر كما في السفر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9022} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9023} ينعقد الرهن بالإيجاب والقبول، فيشترط الشافعية الصيغة اللفظية، ويجيز المالكية والحنابلة ما يدل على الرضا عرفا كالمعاطاة، ويشترط في العاقد أن يكون مطلق التصرف في المال، فلا يصح من الصبي والمجنون والمحجور عليه، ويجيز الحنفية رهن الصبي المأذون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9023} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9024} والمرهون به يجوز أن يكون كل حق لازم في الذمة أو آيل إلى اللزوم، والشافعية يشترطون الدين الثابت اللازم، ويمنعون الرهن بالأعيان المضمونة، أما الحنابلة فيجيزونه بالأعيان المضمونة كالمغصوب والعارية، وتوسع المالكية والحنفية في أنواع منه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9024} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9025} والمرهون يجوز فيه كل مال يمكن استيفاء الدين من ثمنه، فالشافعية والحنابلة يجيزون رهن كل عين يصح بيعها، والحنفية يشترطون أن يكون المرهون مقسوما ومفرغا عن ملك الراهن ومميزا، ويصح رهن المستعار بإذن المعير، ويختلف الفقهاء في شروط ذلك وفي ضمانه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9026} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9027} والعقد لا يلزم عند الحنفية والشافعية والحنابلة إلا بالقبض، لقوله تعالى في البقرة 283 بالرهن المقبوض، والمالكية يلزمونه بالعقد، ويجوز أن تبقى العين المرهونة في يد المرتهن عارية أو وديعة فيصح رهنها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9028} والزيادة المتصلة تتبع الأصل باتفاق، والمنفصلة مختلف فيها: فالشافعية لا تدخل فيها، والحنفية تدخل النماء كالولد والثمر واللبن دون الأجرة والصدقة، والحنابلة تدخلها كلها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9029} ولا يجوز للراهن التصرف المزيل للملك إلا بإذن المرتهن، فيصح بالإذن، ويبطل الرهن إن كان التصرف بلا بدل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9031} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9032} واليد على المرهون للمرتهن، ويجوز أن يكون بيد ثالث وكيلا عن المرتهن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9032} وفي الانتفاع بالمرهون يختلف الفقهاء: فالحنفية يمنعونه إلا بإذن الآخر، والمالكية يجيزونه بشروط، والحنابلة والشافعية يجيزون للراهن ما لا ينقص القيمة، ويجيزون للمرتهن ركوب المركوب وحلب المحلوب بقدر النفقة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9030} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9031} وتضمين الرهن: مؤنة المرهون على الراهن عند الجمهور، والحنفية يحملون مؤنة الحفظ على المرتهن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9033} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9034} ويبطل الرهن قبل لزومه برجوع الراهن أو بتصرف يزيل الملك، وبعد اللزوم بتلف المرهون أو فسخ المرتهن أو براءة الذمة من الدين أو تصرف بإذن المرتهن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9034} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9035} وإذا حل الدين وجب على الراهن وفاؤه، فإن لم يوف بيع المرهون وقدم المرتهن في ثمنه على سائر الغرماء، وتختلف المذاهب في الإلزام: فالشافعية والحنابلة يجيزون للحاكم تعزير الممتنع ثم بيع المرهون، والمالكية يقتصرون على البيع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9035} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9036}"
  en: "Rahn means fixity and permanence in the lexicon and detention in another sense; in law it is making a property a security for a debt, to be paid from it or its price if the debtor cannot pay. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9021} It differs from guarantee (daman), which joins one liability to another for the claim, while a pledge requires a specific property. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9022} The pledge is established by the Qur'an, the Sunna and consensus; it is permitted but not obligatory. The Prophet pledged his iron armour to a Jew for food bought on credit, and most jurists permit it at home as well as on a journey. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9022} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9023} The contract is formed by offer and acceptance: the Shafi'is require words, while the Malikis and Hanbalis accept any sign that shows consent by custom, such as a transaction by exchange of goods. Both parties must be competent to dispose of property, so a child, an insane person or one under restriction cannot contract, though the Hanafis allow a licensed child and the Malikis make a discerning child's pledge conditional on his guardian's consent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9023} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9024} Any binding debt, or one that is about to become binding, may be secured: the Shafi'is require an established debt, exclude guaranteed property such as usurped goods, while the Hanbalis allow security for such guaranteed property, and the Malikis and Hanafis extend it to other kinds of obligation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9024} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9025} Any property that can be sold and whose price can settle the debt may be pledged; the Shafi'is and Hanbalis allow every saleable thing, the Hanafis require a divided and separate property not occupied by the owner's goods and distinct from what grows on it, and borrowed property may be pledged with the lender's permission, with differing views on what must be stated. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9026} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9027} The pledge is binding only once the pledgee takes possession, according to the Hanafis, Shafi'is and Hanbalis, while the Malikis hold it binding on the contract. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9028} The pledge covers the natural increase of the thing; detached increase (offspring, fruit, milk, wool) is included for the Hanafis and Hanbalis in different forms, and excluded by the Shafi'is, while the Malikis include only offspring. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9029} The owner may not dispose of the pledged item in a way that removes ownership or harms the pledgee's right without his consent; a disposal with consent ends the pledge where it has no return, and a sale with consent moves the claim to the price. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9031} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9032} Possession belongs to the pledgee, or to a third party acting as his agent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9032} On use, the Hanafis forbid it to both parties without the other's consent; the Malikis allow it to the pledgee under fixed conditions; the Shafi'is and Hanbalis allow the owner any use that does not reduce value, and allow the pledgee to ride or milk a pledged beast in return for its keep. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9030} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9031} The cost of keeping the pledge falls on the owner according to most jurists, while the Hanafis place the cost of custody on the pledgee. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9033} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9034} The pledge ends before it binds by the owner's withdrawal or a disposal that removes ownership, and after binding by destruction of the pledge, release from the debt, or a disposal with the pledgee's consent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9034} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9035} When the debt falls due the owner must pay it; if he does not, the pledge is sold and the pledgee is paid first from the price; the Shafi'is and Hanbalis allow the judge to discipline a refusing debtor and then sell, while the Malikis limit the judge to the sale. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9035} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9036}"
  ur: "رہن کا شرعی مطلب قرض کے بدلے کوئی مالی چیز بطور ضمانت رکھنا ہے، تاکہ ادائیگی نہ ہونے پر اس سے یا اس کی قیمت سے قرض وصول ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9021} رہن قرآن، سنت اور اجماع سے ثابت ہے اور جائز ہے، واجب نہیں؛ نبی نے یہودی کے پاس زرہ رہن رکھی تھی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9022} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9023} عقد میں ایجاب و قبول ضروری ہے، عاقد کا مالی تصرف کا اہل ہونا شرط ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9023} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9024} رہن کا قبضہ عموماً لازم ہونے کی شرط ہے (حنفیہ، شافعیہ، حنابلہ)، مالکیہ کے نزدیک عقد سے لازم ہو جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9028} زیادتی میں اصل کے تابع متصل زیادتی ہے، جبکہ منفصل میں فقہا کا اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9029} راہن کو مرتہن کی اجازت کے بغیر ملکیت زائل کرنے والا تصرف جائز نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9031} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9032} مؤنت عموماً راہن پر ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9033} قرض کی ادائیگی نہ ہو تو رہن فروخت کر کے مرتہن کو پہلے دیا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9035} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9036}"
