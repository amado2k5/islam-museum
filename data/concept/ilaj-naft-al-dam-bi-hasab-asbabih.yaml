id: concept/ilaj-naft-al-dam-bi-hasab-asbabih
class: concept
kind: scientific
label:
  ar: "علاج نفث الدم بحسب أسبابه"
  en: "The treatment of the spitting of blood by its causes"
  ur: "خون کے نفث کا علاج اس کے اسباب کے مطابق"
  es: "El tratamiento de la expectoración de sangre según sus causas."
  fr: "Le traitement des crachats de sang selon leurs causes"
summary:
  ar: "وما كان من انشقاق عرق أو انقطاعه وكان سببه الامتلاء فيجب أن لا يغذى ما أمكن بل يجوع ثلاثة أيام يقتصر فيها كل يوم على غذاء قليل من شيء لزج وأما إذا لم يظهر سقوط القوة دوفع بالتغذية ما أمكن إلى الرابع وإن خيف سقوط القوة خوفاً واجباً غذوا بما يتولد عنه خلط معتدل وفيه تغرية ولزاق وتلزيج وقبض ⁦(وأغذيته على تفصيل الكتاب وأسماء الألبان واللحوم والفواكه والأقراص كلها مستثناة أو سطور موسومة)⁩، وإذا احتبس الدم ووصل إلى الرابع يجب أن يغذى ويقوى ويبدأ بمثل الخبز المغموس في الماء والهرائس وما عداه ⁦(سطر موسوم)⁩، وإن كان الانشقاق والانقطاع بسبب حدة الدم فاعمل ما يجب من إمالة الدم إلى الأطراف وإلى خلاف الجهة واستفراغ الصفراء ثم برد بقوة ورطب واستعمل القوابض أيضاً والمغريات وماء الشعير وأدوية ذكرها بالاسم ⁦(مستثناة)⁩، وأما الكائن من انفتاح العروق فالأدوية التي يجب أن تستعمل فيه هي القابضة والعفصة مع تغرية وقد يقويها ما يذكره وقد تتخذ منها مركبات وأقراص معدودة لهذا الباب وربما طبخت في المياه الساذجة أو بعض العصارات وربما اتخذت منها ضمادات وقد تخلط بها أدوية النفث المذكورة والأدوية الصدرية وقد يخلط بها المخدرات أيضاً ⁦(أسماؤها وأسماء الأدوية كلها مستثناة وفيه سطر موسوم من المخدرات)⁩، وأما إذا كان رشحاً من ورم فعلاجه الفصد والاستفراغ ثم الإنضاج ولا يعالج بالقوابض فذلك يجلب آفة عظيمة بل يعالج بعلاج ذات الرئة، وأما الكائن عن التأكل فهو صعب العلاج عسر وكالميؤوس منه فإنه لا يبرأ ولا يلتحم إلا مع زوال سوء المزاج وذلك لا يكون إلا في مدة في مثلها أما أن تصلب القرحة أو تعفن لكن ربما نفع أن لا يدع الأكال يستحكم بنفض الخلط الحار وربما أسهل الصفراء والغليظة معاً بدواء من هذا الجنس فإن احتجت إلى تقوية قويته واحتملت في تسكين دغدغة السعال بدواء من هذا الجنس فإنه يرجى منه أن ينفع نفعاً تاماً وبالجملة فإن علاجهم التنقية بالاستفراغ بالفصد وغيره والأغذية الجيدة الكيموس ⁦(وأدوية مركبة ذكرها فولس تذكر في القراباذين على حكاية الكتاب)⁩، وأما الكائن من الصدر فيعالج بالأضمدة وبالأدوية التي فيها جوهر لطيف أو معها جوهر لطيف قد خلط بها وهي مما ذكره ليصل إلى الصدر وإذا حدس أن سبب نفث الدم حر فالأدوية المذكورة موافقة وإذا حدس أن السبب برد أورث نفث الدم على الوجه المذكور فعلاجه كما زعم جالينوس أن ذلك الأصوب هو بأن فصده في اليوم الأول وثنى ودلك أطرافه وشدها على ما يجب في كل حبس نزف دم وغذاه بحساء ووضع على صدره قيروطياً من هذا الجنس ورفعه عنه وقت العشاء لئلا يزيد إسخانه على القدر المطلوب وغذاه بحساء وسقاه دواء من هذا الجنس ولما كان اليوم الثالث استعمل على صدره ذلك القيروطي ثلاث ساعات ثم أخذه وغذاه بماء الشعير وما عداه من الأطعمة فلما اعتدل مزاج رئته وزال الخوف عن حدوث الورم نقى الرئة بدواء عتيق متكامل من هذا الجنس ودرجه إلى شرب لبن من هذا الجنس ⁦(سطر موسوم)⁩ وإلى سائر التدبير الواجب، وزعم جالينوس أن كل من أدركه من هؤلاء في اليوم الأول برأ والآخرون اختلفت أحوالهم وقد شاهدنا أيضاً من هذا من نفعته هذه الطريقة ونحوها ⁦(قول منسوب إلى جالينوس وشهادة على لفظ الكتاب)⁩، وإذا حدس أن السبب رطوبة واسترخاء استعمل ما فيه تجفيف وتسخين وقبض للإبلاع وقد يخلط بها قوابض معتدلة ⁦(مركباتها في القراباذين والأسماء مستثناة)⁩، وإذا حدس أن السبب يبوسة وذلك في الأقل استعمل المرطبات المعلومة من الألبان والأدهان والعصارات بعد التدبير المشترك من إمالة المادة إلى خلاف الجهة ولكن الذي يليق بهذا الموضع من الفصد وغيره أقل وأضعف من الذي يليق بغيره، وإذا كان السبب صدمة على الكبد فعلاجه سفوف نسخته مستثناة، وأما الأدوية المشتركة فالمفردات منها مذكورة في الكتاب الثاني في الجداول المعلومة ⁦(وفي الباب أخبار وأسماء وأقراص وأضمدة وسقيات كثيرة كلها مستثناة وفيها سطور موسومة من دم حيوان يسقى نيئاً وأنفحة حيوان وقرن محرق وغراء سمك وحراقة إسفنج وبزر مخدر)⁩ {cite:canon-ibn-sina-print-v2 p.336}"
  en: "What is from a vessel's splitting or cutting whose cause is the fullness must not be fed as far as possible — rather he is starved three days, each day confined to a little food of something sticky; and if no falling of strength appears, feeding is pushed off as far as possible to the fourth, and if the falling of strength is feared a necessary fear, they are fed what engenders a moderate humour, holding glutinousness, sticking, lubrication and astringency (its foods on the book's detailing; the names of the milks, meats, fruits and tablets all excluded or labelled lines). If the blood is withheld to the fourth he must be fed and strengthened, beginning with the like of bread soaked in water and the gruels and the rest (a labelled line). If the splitting and cutting are for the blood's sharpness, do what is due of tilting the blood to the limbs and to the side opposite, evacuating the yellow bile, then cool strongly and moisten, and use the astringents too and the glutinous things and barley-water and drugs he names (excluded). As for what is from the vessels' opening, the drugs to be used are the astringent and acrid-astringent with glutinousness; what he mentions may strengthen them, compounds may be made of them and tablets counted for this chapter, they may be cooked in simple waters or some juices, poultices may be made of them, the mentioned spitting-drugs and the chest-drugs may be mixed with them, and the stupefying drugs too may be mixed in (their names and all the drug names excluded; among them a labelled line of the stupefying drugs). If it is a seepage from a tumour, its treatment is venesection and evacuation then ripening — it is not treated with the astringents, for that brings a great affliction, rather it is treated with peripneumonia's treatment. As for what is from the erosion: it is hard and difficult of treatment, near-despaired of, for it neither heals nor closes except with the bad temperament's removal, which only comes in a like space of time — whether the ulcer hardens or putrefies — but it may benefit that the corrosive not be left to take hold, by shaking off the hot humour, and the bilious and thick may be eased together by a drug of this kind; if a strengthening is needed it is strengthened, and a drug of this kind is borne for stilling the cough's tickle, hoped to benefit a full benefit. In sum their treatment is cleansing by evacuation by venesection and otherwise, and good-chyme foods (and compound drugs Fulus mentioned, told in the pharmacopoeia, on the book's telling). What is from the chest is treated by the poultices and the drugs holding a subtle substance or having a subtle substance mixed in, of what he mentions, so it reaches the chest. If it is guessed that the spitting's cause is hot, the mentioned drugs all suit; if it is guessed that the cause is cold having bequeathed the spitting in the mentioned way, its treatment — as Galen held that the soundest — is that he venesected him on the first day, folded and rubbed his limbs and bound them as is due in every stanching of a blood-flow, fed him a gruel, set a cerate of this kind on his chest and lifted it at suppertime lest its heating exceed the wanted degree, fed him a gruel and gave him a drug of this kind; when it was the third day he used that cerate on his chest three hours then took it away and fed him barley-water and the rest of the foods; then when his lung's temperament moderated and the fear of a tumour's arising left, he cleansed the lung with an old perfected thing of this kind and graduated him to drinking a milk of this kind (a labelled line) and to the rest of the due regimen. And Galen held that whomever of these he reached on the first day was healed, while the others' states differed; and we too have seen of this those whom this method and its like benefited (a saying attributed to Galen and a testimony on the book's wording). If it is guessed the cause is moisture and relaxation, what holds drying, warming and astringency is used for swallowing, and moderate astringents may be mixed in (their compounds in the pharmacopoeia, names excluded). If it is guessed the cause is dryness — and that is the rarest — the known moisteners of the milks, oils and juices are used after the common regimen of tilting the matter to the contrary side, but what befits this place of venesection and the like is less and weaker than what befits elsewhere. If the cause is a blow on the liver, its treatment is a powder whose copy is excluded. As for the common drugs, their singles are mentioned in the Second Book in the known tables (and in the chapter are many reports, names, tablets, poultices and draughts, all excluded; among them labelled lines of an animal's blood given raw, animal lungs, a burnt horn, fish-glue, burnt sponge and a stupefying seed) {cite:canon-ibn-sina-print-v2 p.336}"
  ur: "جو رگ کے شق یا انقطاع سے ہو اور سبب امتلاء ہو تو جتنا ممکن ہو کھانا نہ دے بلکہ تین دن بھوکا رکھے ہر دن کسی چپچپی چیز کی تھوڑی خوراک پر؛ اور اگر قوت کے گرنے کی علامت نہ ہو تو چوتھے دن تک کھانا مؤخر رکھے اور اگر قوت گرنے کا واجب خوف ہو تو وہ کھلائیں جس سے معتدل خلط پیدا ہو چپچپاہٹ قبض اور ملاست کے ساتھ ⁦(خوراکیں کتاب کی تفصیل پر؛ دودھوں گوشتوں پھلوں اور گولیوں کے نام سب مستثنیٰ یا موسوم سطریں)⁩؛ اگر خون چوتھے دن تک محتبس رہے تو کھلائے اور قوت دے پانی میں بھگوئی روٹی اور احسا وغیرہ سے شروع کرے ⁦(موسوم سطر)⁩؛ اگر شق اور انقطاع خون کی حدت سے ہو تو خون کا اعضا اور مخالف طرف میلان اور صفرا کی استفراغ کرے پھر زور سے ٹھنڈا اور تر کرے اور قابضیں بھی استعمال کرے اور مغریات اور جو کا پانی اور نام لے کر ادویہ ⁦(مستثنیٰ)⁩؛ رگوں کے کھلنے سے ہونے والی میں قابض اور عفص ادویہ چپچپاہٹ کے ساتھ استعمال ہوں مذکورہ چیزیں انہیں قوت دے سکتی ہیں ان سے مرکبات اور اس باب کی گولیاں بن سکتی ہیں سادہ پانیوں یا بعض عصاروں میں پکائی جا سکتی ہیں ان سے ضمادیں بن سکتی ہیں نفث والی اور صدری ادویہ ملی جا سکتی ہیں اور مخدرات بھی ⁦(نام سب مستثنیٰ ان میں مخدرات کی موسوم سطر)⁩؛ اگر ورم سے ترشح ہو تو علاج فصد اور استفراغ پھر انضاج ہے قابضوں سے علاج نہ کرے وہ بڑی آفت لاتا ہے بلکہ ذات الرئة کے علاج سے کرے؛ کٹ جانے سے ہونے والا علاج میں دشوار اور قریب مایوس ہے کیونکہ نہ شفا پاتا نہ بند ہوتا مگر خراب مزاج کے زوال پر جو اتنی ہی مدت میں ہوتا ہے خواہ قرحة سخت ہو یا سڑ جائے لیکن یہ مفید ہو سکتا ہے کہ کاری کو مزید نہ بڑھنے دے گرم خلط ہلا کر اور صفراوی اور گاڑھی دونوں کو اسی جنس کی دواء سے نرم کرے؛ قوت چاہیے تو قوت دے اور کھانسی کی چنچن ٹھہرانے کے لیے اسی جنس کی دواء برداشت کرے اس سے کامل نفع کی امید ہے؛ خلاصہ ان کا علاج فصد وغیرہ سے استفراغی صفائی اور اچھے کیموس والی خوراکیں ہیں ⁦(اور مرکب ادویہ جو فولس نے بیان کیں قراباذین میں آتی ہیں کتاب کے قول پر)⁩؛ سینے سے ہونے والی ضمادوں اور لطیف جوہر والی یا لطیف جوہر ملی ادویہ سے علاج ہوتی ہے جو بیان کی گئیں تاکہ سینے تک پہنچیں؛ اگر سبب حر ہو تو مذکورہ ادویہ موافق ہیں؛ اگر سبب ٹھنڈ ہو جس نے مذکورہ طریق پر نفث دیا ہو تو جیسا جالینوس نے کہا صواب یہ ہے: پہلے دن فصد کی اعضا لپیٹے مالش کی اور باندھے جیسا ہر نزف دم کے بند میں واجب ہے احساء کھلایا سینے پر اسی جنس کا قیروطی رکھا عشاء کے وقت ہٹایا تاکہ گرم کرنا مطلوب سے نہ بڑھے پھر احساء اور اسی جنس کی دواء پلائی؛ تیسرے دن تین گھنٹے وہ قیروطی پھر ہٹا کر جو کا پانی اور باقی کھانے دئیے جب پھیپھڑے کا مزاج معتدل ہوا اور ورم کا خوف گیا تو پرانی کامل چیز سے پھیپھڑا صاف کیا اور اسی جنس کے دودھ کے پینے تک پہنچایا ⁦(موسوم سطر)⁩ اور باقی واجب تدبیر؛ اور جالینوس کا کہنا ہے کہ جسے انہوں نے پہلے دن پا لیا وہ شفا پایا اور باقیوں کے حالات مختلف رہے اور ہم نے بھی اس جنس سے انہیں دیکھا جنہیں اسی طریق اور اس جیسے نے نفع دیا ⁦(جالینوس سے منسوب قول اور کتاب کے لفظ پر شہادت)⁩؛ اگر سبب رطوبت اور ڈھیل پن ہو تو نگلنے کے لیے خشک کرنے گرم کرنے اور قبض والی چیز استعمال ہو اور معتدل قابضیں ملی جائیں ⁦(مرکبات قراباذین میں نام مستثنیٰ)⁩؛ اگر سبب خشکی ہو اور یہ کمتر ہے تو مشترکہ تدبیر کے بعد معلوم مرطبات دودھ روغن عصارے استعمال ہوں لیکن یہاں کی فصد وغیرہ کم اور کمزور ہو؛ اگر سبب جگر پر صدمہ ہو تو علاج ایک سفوف ہے جس کی نسخہ مستثنیٰ؛ اور مشترکہ ادویہ کے مفردات کتاب ثانی کے معلوم جدولوں میں ہیں ⁦(اور باب میں بہت سی خبریں نام گولیاں ضمادیں اور پلانے والی چیزیں ہیں سب مستثنیٰ ان میں جانور کا کچا خون پلانا جانور کے پھیپھڑے جلائی ہوئی ہڈی مچھلی کا سریش جلایا ہوا اسفنج اور مخدر بیج کی موسوم سطریں ہیں)⁩ {cite:canon-ibn-sina-print-v2 p.336}"
  es: "Lo que proviene de la división o corte de un vaso cuya causa es la plenitud no debe ser alimentado en la medida de lo posible; más bien, se le priva de alimento durante tres días, cada día confinado a un poco de alimento pegajoso; y si no aparece una disminución de la fuerza, la alimentación se retrasa lo máximo posible hasta el cuarto día, y si se teme una disminución de la fuerza (un temor necesario), se le alimenta con lo que genera un humor moderado, que contiene glutinoso, pegajoso, lubricante y astringente (sus alimentos en el libro detallado; los nombres de las leches, carnes, frutas y tabletas están excluidos o etiquetados en líneas). Si se retiene la sangre hasta el cuarto día, debe ser alimentado y fortalecido, comenzando con algo como pan remojado en agua y las gachas y el resto (una línea etiquetada). Si la división y el corte son para la agudeza de la sangre, haga lo que sea debido inclinando la sangre hacia las extremidades y hacia el lado opuesto, evacuando la bilis amarilla, luego enfríe fuertemente y humedezca, y use también los astringentes y las cosas glutinosas y el agua de cebada y los medicamentos que él menciona (excluidos). En cuanto a lo que es de la abertura de los vasos, los medicamentos que se deben usar son el astringente y el astringente-acre con glutinoso; lo que él menciona puede fortalecerlos, se pueden hacer compuestos con ellos y tabletas contadas para este capítulo, se pueden cocinar en aguas simples o algunos jugos, se pueden hacer cataplasmas con ellos, los medicamentos para escupir mencionados y los medicamentos para el pecho se pueden mezclar con ellos, y también se pueden mezclar los medicamentos estupefacientes (sus nombres y todos los nombres de medicamentos excluidos; entre ellos una línea etiquetada de medicamentos estupefacientes). Si se trata de una exudación tumoral, su tratamiento consiste en flebotomía y evacuación seguida de maduración; no se trata con astringentes, pues esto provoca gran aflicción, sino con el tratamiento de la perineumonía. En cuanto a lo que proviene de la erosión: es difícil y de difícil tratamiento, casi desesperado, pues no cicatriza ni se cierra excepto con la eliminación del mal temperamento, lo cual solo ocurre en un lapso de tiempo similar, ya sea que la úlcera se endurezca o se pudra; pero puede ser beneficioso no dejar que el corrosivo se adhiera, sacudiendo el humor caliente, y lo biliar y espeso puede aliviarse con un medicamento de este tipo; si se necesita un fortalecimiento, se fortalece, y se toma un medicamento de este tipo para calmar el cosquilleo de la tos, con la esperanza de obtener un beneficio completo. En resumen, su tratamiento es la limpieza mediante evacuación por flebotomía y otros métodos, y alimentos con buen quimo (y medicamentos compuestos que Fulus mencionó, según la farmacopea, en el libro). Lo que viene del pecho se trata con cataplasmas y medicamentos que contienen una sustancia sutil o que tienen una sustancia sutil mezclada, de lo que él menciona, para que llegue al pecho. Si se supone que la causa de la salivación es caliente, todos los medicamentos mencionados son adecuados; si se supone que la causa es fría habiendo legado la salivación de la manera mencionada, su tratamiento —como Galeno sostenía que era el más acertado— es que lo venesectó el primer día, dobló y frotó sus extremidades y las ató como se debe en todo detención de un flujo de sangre, lo alimentó con una papilla, colocó un cerato de este tipo en su pecho y lo levantó a la hora de la cena para que su calor excediera el grado deseado, lo alimentó con una papilla y le dio un medicamento de este tipo; cuando fue el tercer día usó ese cerato en su pecho durante tres horas, luego lo retiró y lo alimentó con agua de cebada y el resto de los alimentos; Luego, cuando el temperamento de su pulmón se moderó y desapareció el temor a la aparición de un tumor, limpió el pulmón con un producto antiguo y perfeccionado de este tipo y lo hizo beber gradualmente una leche de este tipo (una línea etiquetada) y el resto del régimen debido. Y Galeno sostenía que quienquiera de estos a quienes llegó el primer día sanaba, mientras que los estados de los demás variaban; y nosotros también hemos visto de esto a quienes este método y otros similares beneficiaron (un dicho atribuido a Galeno y un testimonio de la redacción del libro). Si se supone que la causa es la humedad y la relajación, se usa para tragar lo que contiene secante, calor y astringente, y se pueden mezclar astringentes moderados (sus compuestos en la farmacopea, nombres excluidos). Si se sospecha que la causa es la sequedad —y esto es lo más raro—, se utilizan los humectantes conocidos de leches, aceites y jugos, siguiendo el régimen habitual de inclinar la materia hacia el lado contrario; sin embargo, lo que conviene a este lugar de flebotomía y similares es menos y más débil que lo que conviene a otros lugares. Si la causa es un golpe en el hígado, su tratamiento consiste en un polvo cuya copia está excluida. En cuanto a los medicamentos comunes, sus nombres individuales se mencionan en el Segundo Libro en las tablas conocidas (y en el capítulo hay muchos informes, nombres, tabletas, cataplasmas y pociones, todos excluidos; entre ellos, líneas etiquetadas de sangre animal administrada cruda, pulmones de animales, un cuerno quemado, cola de pescado, esponja quemada y una semilla estupefaciente) {cite:canon-ibn-sina-print-v2 p.336}"
  fr: "Ce qui résulte d'une fissure ou d'une coupure d'un vaisseau et dont la cause est la plénitude ne doit pas être nourri autant que possible; il faut plutôt le mettre à jeun pendant trois jours, en le limitant chaque jour à une petite quantité d'aliment collant; et si aucun affaiblissement n'apparaît, on repousse autant que possible l'alimentation au quatrième jour; et si l'on craint un affaiblissement nécessaire, on le nourrit d'aliments qui engendrent une humeur modérée, possédant des propriétés de viscosité, d'adhérence, de lubrification et d'astringence (les aliments correspondants sont détaillés dans le livre; les noms des laits, viandes, fruits et comprimés sont tous exclus ou indiqués par des lignes). Si le sang est suspendu jusqu'au quatrième jour, il faut le nourrir et le fortifier, en commençant par du pain trempé dans l'eau, des bouillies et le reste (ligne indiquée). Si la scission et la coupure sont destinées à rendre le sang plus vif, procédez comme il se doit en orientant le sang vers les membres et du côté opposé, en évacuant la bile jaune, puis refroidissez fortement et humidifiez, et utilisez également les astringents, les substances gluantes, l'eau d'orge et les médicaments qu'il mentionne (à exclure). Quant à ce qui provient de l'orifice des vaisseaux, les médicaments à utiliser sont les astringents et les astringents âcres avec des substances gluantes; ce qu'il mentionne peut les renforcer, des composés peuvent en être faits et des comprimés comptabilisés pour ce chapitre, ils peuvent être cuits dans de l'eau simple ou certains jus, des cataplasmes peuvent en être faits, les médicaments pour la salive mentionnés et les médicaments pour la poitrine peuvent être mélangés avec eux, et les médicaments stupéfiants peuvent également être mélangés (leurs noms et tous les noms de médicaments exclus; parmi eux une ligne étiquetée des médicaments stupéfiants). S'il s'agit d'un suintement tumoral, le traitement consiste en une saignée et une évacuation, suivies d'une période de maturation. On n'utilise pas d'astringents, car cela provoque de graves troubles, mais plutôt le traitement de la péripneumonie. Quant à l'ulcère érosif, son traitement est difficile et complexe, voire désespéré, car il ne guérit ni ne se referme sans la disparition de l'humeur corrosive, ce qui n'intervient qu'avec le même laps de temps – que l'ulcère s'incurve ou se putréfie. Il peut être bénéfique d'empêcher l'action corrosive de s'installer en éliminant l'humeur chaude, et les humeurs bilieuses et épaisses peuvent être apaisées par un médicament de ce type. Si un renforcement est nécessaire, il est effectué, et un médicament de ce type est administré pour calmer la toux, dans l'espoir d'un bénéfice complet. En résumé, leur traitement consiste en une purification par évacuation, notamment par saignée, et en une alimentation riche en bons nutriments (ainsi qu'en la préparation de Fulus, mentionnée dans la pharmacopée et relatée dans le livre). Ce qui provient de la poitrine est traité par des cataplasmes et des médicaments contenant une substance subtile ou mélangée à une substance subtile, parmi ceux mentionnés, afin qu'ils atteignent la poitrine. Si l'on suppose que la cause des crachats est chaude, tous les médicaments mentionnés conviennent; si l'on suppose que la cause est froide, ayant transmis les crachats de la manière mentionnée, son traitement — que Galien considérait comme le plus sûr — consiste à pratiquer une saignée le premier jour, à plier et frotter ses membres et à les bander comme il se doit pour arrêter toute hémorragie, à lui donner une bouillie, à appliquer un cérate de ce type sur sa poitrine et à le retirer au souper afin que sa chaleur ne dépasse pas le degré souhaité, à lui donner une autre bouillie et à lui administrer un médicament de ce type; le troisième jour, il appliquait ce cérate sur sa poitrine pendant trois heures, puis le retirait et lui donnait de l'eau d'orge et le reste de sa nourriture; Lorsque l'état de ses poumons s'est stabilisé et que la crainte d'une tumeur s'est dissipée, il les a purifiés avec une ancienne préparation éprouvée de ce type, puis l'a amené progressivement à boire un lait spécifique (une marque déposée) et à suivre le reste du traitement prescrit. Galien affirmait que quiconque était atteint par cette méthode dès le premier jour était guéri, tandis que l'état des autres variait; et nous avons nous aussi constaté les bienfaits de cette méthode et d'autres similaires (une parole attribuée à Galien et attestée par le texte du livre). Si l'on soupçonne que la cause est l'humidité et le relâchement, on utilise des substances asséchantes, réchauffantes et astringentes à avaler, auxquelles on peut ajouter des astringents modérés (leurs composés figurent dans la pharmacopée, noms exclus). Si l'on soupçonne une sécheresse comme cause — ce qui est très rare —, on utilise les hydratants connus (laits, huiles et jus) selon le protocole habituel consistant à incliner la matière du côté opposé. Cependant, les saignées et autres traitements appropriés à cet endroit sont moins abondants et moins puissants que ceux utilisés ailleurs. Si la cause est un coup porté au foie, le traitement consiste en une poudre dont la composition est interdite. Quant aux remèdes courants, leurs usages spécifiques sont mentionnés dans le Deuxième Livre, dans les tableaux connus (et ce chapitre contient de nombreux rapports, noms, comprimés, cataplasmes et potions, tous interdits; parmi lesquels des listes de sang animal cru, de poumons d'animal, de corne brûlée, de colle de poisson, d'éponge brûlée et de graine stupéfiante). {cite:canon-ibn-sina-print-v2 p.336}"
