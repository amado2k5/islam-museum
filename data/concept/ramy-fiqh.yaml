id: concept/ramy-fiqh
class: concept
kind: legal
label:
  ar: "الرمي"
  en: "Ramy: throwing (the stoning of the jamarat, the rulings of archery and hunting by throwing, and throwing the accusation of adultery)"
  ur: "رمی (جمرات کی رمی، تیراندازی، شکار اور زنا کی تہمت)"
summary:
  ar: "الرمي في اللغة القذف والإلقاء، ويستعمله الفقهاء في رمي الجمار، والرمي بالسهام في الصيد والجهاد، والرمي بمعنى القذف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8996} الجمرات التي ترمى ثلاث: الصغرى أو الدنيا تلي مسجد الخيف، ثم الوسطى، ثم جمرة العقبة وتسمى الكبرى وتقع في آخر منى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8996} رمي الجمار واجب من واجبات الحج بالسنة والإجماع، وهو مذكور في أحاديث كثيرة، ومنها أمره بالرمي لمن قدم النحر على الرمي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8996} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8997} ويشترط لصحته أن يتقدمه الإحرام بالحج والوقوف بعرفة، وأن يكون المرمي به حجرا عند الجمهور، بينما توسع الحنفية فأجازوا ما من جنس الأرض كالطين والتراب والجص، ولا يصح عندهم بالمعادن والذهب والفضة، وأن يكون سبع حصيات لكل جمرة متفرقة واحدة بعد واحدة، وأن تقع في مجتمع الحصى، وأن يقصد المرمى فلا يجزئ الطرح باليد أو الوضع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8997} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8998} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8999} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9000} ويجب الترتيب بين الجمرات في أيام التشريق عند الجمهور، وترتيب أعمال يوم النحر عند الجمهور: الرمي ثم الذبح ثم الحلق ثم طواف الإفاضة، وهو عند الشافعية سنة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9001} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9011}"
  en: "Ramy in the lexicon means throwing or casting. The jurists use it for the stoning of the jamarat, for shooting arrows in hunting and in war, and for throwing an accusation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8996} There are three jamarat: the first (the lesser, also called the nearest) beside the Mosque of al-Khayf, then the middle one, then the Jamrat al-Aqaba (the greater), at the far end of Mina. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8996} Stoning them is a required act of the pilgrimage, established by the sunna and by consensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8996} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8997} Its validity requires the prior assumption of the pilgrim's ihram and the standing at Arafat; most jurists require the missile to be a stone, while the Hanafis allow any earth-like material such as clay, dust or lime but not metals, gold or silver. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8997} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8998} The valid stoning is seven pebbles for each jamra, thrown one at a time, which must land within the gathering of pebbles, and must be aimed; placing them down or tossing them by hand does not count. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8999} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9000} The jurists also differ on the order: the majority require the jamarat to be stoned in order during the days of tashriq, and in order on the day of sacrifice the stoning comes before the sacrifice, the shaving and the tawaf of ifada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9001} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9011} The time begins on the day of sacrifice after the dawn (for the Hanafis and Malikis) or after midnight (for the Shafi'is and Hanbalis); on the days of tashriq it begins after midday, and the jurists differ about the end of each day and about making up a missed stoning with a sacrifice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9002} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9003} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9004} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9005} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9006} Recommended acts include the chickpea-to-hazelnut sized pebbles, the takbir with each pebble, a pause for supplication between the first two jamarat, and throwing after sunrise; the disliked acts include throwing a large stone and throwing with pebbles from the mosque. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9007} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9008} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9009} Leaving out a pebble incurs a sacrifice according to the Malikis, and for missing a whole day a sheep is due; the sick or the incapable may appoint a deputy, and the child's guardian throws on his behalf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9010} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9011} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9012} Hunting by throwing is lawful with a pointed implement that wounds the game; a blunt missile that kills by its weight makes the game carrion, and it is forbidden to set a living creature as a target. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9012} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9013} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9014} In war, learning archery is strongly recommended and abandoning it after learning is condemned; a contest in archery (munadhala) is permitted and can be obligatory when it is the only way to fight the unbelievers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9014} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9015} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9016} Accusing a chaste person of adultery outside testimony brings the penalty for slander (eighty lashes); if testimony falls short of four witnesses the witnesses too are liable to that penalty according to most jurists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9016}"
  ur: "رمی کا لغوی معنی پھینکنا ہے۔ فقہا اس سے جمرات کی رمی، جنگ و شکار میں تیر اندازی اور زنا کی تہمت مراد لیتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8996} جمرات تین ہیں: پہلی مسجد خیف کے قریب، پھر درمیانی، پھر جمرۃ العقبہ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8996} رمی حج کا واجب ہے؛ جمہور کے نزدیک پتھر سے ہو، حنفیہ کے نزدیک مٹی کی جنس سے بھی درست ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8997} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8998} ہر جمرہ پر سات کنکریاں ایک ایک کر کے پھینکی جائیں، اور ترتیب اور وقت کا خیال رکھا جائے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8999} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9001} ایام تشریق میں زوال کے بعد رمی ہوتی ہے، اور وقت کے آغاز و انجام میں فقہا کا اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9002} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9003} رمی چھوڑنے پر دم لازم آتا ہے، اور معذور نائب مقرر کر سکتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9010} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9012} شکار میں دھار دار چیز سے زخمی کر کے حلال ہوتا ہے، اور جاندار کو نشانہ بنانا حرام ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9013} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9014} جہاد میں تیر اندازی سیکھنے کی ترغیب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9014} زنا کی تہمت پر حد قذف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9016}"
