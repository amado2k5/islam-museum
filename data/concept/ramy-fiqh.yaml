id: concept/ramy-fiqh
class: concept
kind: legal
label:
  ar: "الرمي"
  en: "Ramy: throwing (the stoning of the jamarat, the rulings of archery and hunting by throwing, and throwing the accusation of adultery)"
  ur: "رمی ⁦(جمرات کی رمی، تیراندازی، شکار اور زنا کی تہمت)⁩"
  es: "Ramy: lanzamiento (la lapidación de la jamarat, las normas sobre tiro con arco y caza mediante lanzamiento, y el lanzamiento de la acusación de adulterio)"
  fr: "Ramy: lancer (la lapidation de la jamarat, les décisions concernant le tir à l'arc et la chasse par lancer, et le lancer de l'accusation d'adultère)"
summary:
  ar: "الرمي في اللغة القذف والإلقاء، ويستعمله الفقهاء في رمي الجمار، والرمي بالسهام في الصيد والجهاد، والرمي بمعنى القذف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8996} الجمرات التي ترمى ثلاث: الصغرى أو الدنيا تلي مسجد الخيف، ثم الوسطى، ثم جمرة العقبة وتسمى الكبرى وتقع في آخر منى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8996} رمي الجمار واجب من واجبات الحج بالسنة والإجماع، وهو مذكور في أحاديث كثيرة، ومنها أمره بالرمي لمن قدم النحر على الرمي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8996} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8997} ويشترط لصحته أن يتقدمه الإحرام بالحج والوقوف بعرفة، وأن يكون المرمي به حجرا عند الجمهور، بينما توسع الحنفية فأجازوا ما من جنس الأرض كالطين والتراب والجص، ولا يصح عندهم بالمعادن والذهب والفضة، وأن يكون سبع حصيات لكل جمرة متفرقة واحدة بعد واحدة، وأن تقع في مجتمع الحصى، وأن يقصد المرمى فلا يجزئ الطرح باليد أو الوضع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8997} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8998} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8999} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9000} ويجب الترتيب بين الجمرات في أيام التشريق عند الجمهور، وترتيب أعمال يوم النحر عند الجمهور: الرمي ثم الذبح ثم الحلق ثم طواف الإفاضة، وهو عند الشافعية سنة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9001} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9011}"
  en: "Ramy in the lexicon means throwing or casting. The jurists use it for the stoning of the jamarat, for shooting arrows in hunting and in war, and for throwing an accusation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8996} There are three jamarat: the first (the lesser, also called the nearest) beside the Mosque of al-Khayf, then the middle one, then the Jamrat al-Aqaba (the greater), at the far end of Mina. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8996} Stoning them is a required act of the pilgrimage, established by the sunna and by consensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8996} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8997} Its validity requires the prior assumption of the pilgrim's ihram and the standing at Arafat; most jurists require the missile to be a stone, while the Hanafis allow any earth-like material such as clay, dust or lime but not metals, gold or silver. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8997} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8998} The valid stoning is seven pebbles for each jamra, thrown one at a time, which must land within the gathering of pebbles, and must be aimed; placing them down or tossing them by hand does not count. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8999} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9000} The jurists also differ on the order: the majority require the jamarat to be stoned in order during the days of tashriq, and in order on the day of sacrifice the stoning comes before the sacrifice, the shaving and the tawaf of ifada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9001} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9011} The time begins on the day of sacrifice after the dawn (for the Hanafis and Malikis) or after midnight (for the Shafi'is and Hanbalis); on the days of tashriq it begins after midday, and the jurists differ about the end of each day and about making up a missed stoning with a sacrifice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9002} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9003} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9004} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9005} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9006} Recommended acts include the chickpea-to-hazelnut sized pebbles, the takbir with each pebble, a pause for supplication between the first two jamarat, and throwing after sunrise; the disliked acts include throwing a large stone and throwing with pebbles from the mosque. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9007} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9008} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9009} Leaving out a pebble incurs a sacrifice according to the Malikis, and for missing a whole day a sheep is due; the sick or the incapable may appoint a deputy, and the child's guardian throws on his behalf. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9010} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9011} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9012} Hunting by throwing is lawful with a pointed implement that wounds the game; a blunt missile that kills by its weight makes the game carrion, and it is forbidden to set a living creature as a target. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9012} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9013} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9014} In war, learning archery is strongly recommended and abandoning it after learning is condemned; a contest in archery (munadhala) is permitted and can be obligatory when it is the only way to fight the unbelievers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9014} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9015} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9016} Accusing a chaste person of adultery outside testimony brings the penalty for slander (eighty lashes); if testimony falls short of four witnesses the witnesses too are liable to that penalty according to most jurists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9016}"
  ur: "رمی کا لغوی معنی پھینکنا ہے۔ فقہا اس سے جمرات کی رمی، جنگ و شکار میں تیر اندازی اور زنا کی تہمت مراد لیتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8996} جمرات تین ہیں: پہلی مسجد خیف کے قریب، پھر درمیانی، پھر جمرۃ العقبہ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8996} رمی حج کا واجب ہے؛ جمہور کے نزدیک پتھر سے ہو، حنفیہ کے نزدیک مٹی کی جنس سے بھی درست ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8997} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8998} ہر جمرہ پر سات کنکریاں ایک ایک کر کے پھینکی جائیں، اور ترتیب اور وقت کا خیال رکھا جائے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8999} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9001} ایام تشریق میں زوال کے بعد رمی ہوتی ہے، اور وقت کے آغاز و انجام میں فقہا کا اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9002} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9003} رمی چھوڑنے پر دم لازم آتا ہے، اور معذور نائب مقرر کر سکتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9010} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9012} شکار میں دھار دار چیز سے زخمی کر کے حلال ہوتا ہے، اور جاندار کو نشانہ بنانا حرام ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9013} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9014} جہاد میں تیر اندازی سیکھنے کی ترغیب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9014} زنا کی تہمت پر حد قذف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9016}"
  es: "Ramy en el léxico significa lanzar o arrojar. Los juristas lo usan para la lapidación de las jamarat, para disparar flechas en la caza y en la guerra, y para lanzar una acusación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8996} Hay tres jamarat: la primera (la menor, también llamada la más cercana) junto a la Mezquita de al-Khayf, luego la del medio, luego la Jamrat al-Aqaba (la mayor), en el extremo de Mina. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8996} Lapidarlas es un acto obligatorio de la peregrinación, establecido por la sunna y por consenso. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8996} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8997} Su validez requiere la asunción previa del ihram del peregrino y la posición en Arafat; la mayoría de los juristas requieren que el proyectil sea una piedra, mientras que los Hanafis permiten cualquier material parecido a la tierra como arcilla, polvo o cal pero no metales, oro o plata. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8997} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8998} La lapidación válida es de siete guijarros por cada jamra, lanzados uno a la vez, que deben caer dentro del grupo de guijarros, y deben apuntar; colocarlos o lanzarlos con la mano no cuenta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8999} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9000} Los juristas también difieren en el orden: la mayoría requiere que la jamarat sea apedreada en orden durante los días de tashriq, y en orden en el día del sacrificio la lapidación viene antes del sacrificio, el afeitado y el tawaf de ifada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9001} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9011} El tiempo comienza el día del sacrificio después del amanecer (para los hanafíes y malikíes) o después de la medianoche (para los shafiíes y hanbalíes); En los días de tashriq comienza después del mediodía, y los juristas difieren sobre el final de cada día y sobre compensar una lapidación perdida con un sacrificio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9002} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9003} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9004} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9005} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9006} Los actos recomendados incluyen los guijarros del tamaño de un garbanzo a una avellana, el takbir con cada guijarro, una pausa para la súplica entre las dos primeras jamarat y el lanzamiento después del amanecer; Los actos reprobables incluyen lanzar una piedra grande y lanzar guijarros desde la mezquita. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9007} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9008} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9009} Dejar un guijarro conlleva un sacrificio según los malikíes, y por faltar un día entero se debe una oveja; el enfermo o el incapacitado puede nombrar un sustituto, y el tutor del niño lanza en su nombre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9010} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9011} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9012} La caza mediante lanzamiento es lícita con un implemento puntiagudo que hiera a la presa; un proyectil romo que mate por su peso convierte a la presa en carroña, y está prohibido poner a una criatura viva como objetivo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9012} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9013} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9014} En la guerra, se recomienda encarecidamente aprender tiro con arco y se condena abandonarlo después de aprenderlo; se permite una competición de tiro con arco (munadhala) y puede ser obligatoria cuando es la única forma de luchar contra los infieles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9014} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9015} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9016} Acusar a una persona casta de adulterio sin testimonio conlleva la pena por calumnia (ochenta latigazos); si el testimonio no alcanza los cuatro testigos, estos también son responsables de dicha pena, según la mayoría de los juristas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9016}"
  fr: "Le terme « ramy » signifie, dans le lexique, jeter ou lancer. Les juristes l'emploient pour désigner la lapidation des jamarat, le tir à l'arc à la chasse et à la guerre, ainsi que le fait de porter une accusation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8996} Il existe trois jamarat: la première (la plus petite, également appelée la plus proche) près de la mosquée al-Khayf, puis la jamarat du milieu, et enfin la jamarat al-Aqaba (la plus grande), à l'extrémité de Mina. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8996} La lapidation des jamarat est un rite obligatoire du pèlerinage, établi par la sunna et faisant consensus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8996} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8997} Sa validité requiert que le pèlerin ait préalablement revêtu l'ihram et se soit tenu debout à Arafat; la plupart des juristes exigent que le projectile soit une pierre, tandis que les hanafites autorisent toute matière semblable à la terre, comme l'argile, la poussière ou la chaux, mais excluent les métaux, l'or ou l'argent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8997} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8998} La lapidation valide consiste à lancer sept cailloux par jamra, un à un, qui doivent atterrir au sein du groupe de cailloux, et viser; les poser ou les jeter à la main ne compte pas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8999} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9000} Les juristes divergent également sur l'ordre: la majorité exige que la jamarat soit lapidée dans l'ordre pendant les jours de tashriq, et dans l'ordre le jour du sacrifice, la lapidation précède le sacrifice, le rasage et le tawaf d'ifada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9001} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9011} Le temps commence le jour du sacrifice après l'aube (pour les Hanafites et les Malikites) ou après minuit (pour les Shafi'ites et les Hanbalites); Les jours de tashriq, cela commence après midi, et les juristes divergent quant à la fin de chaque jour et quant à la possibilité de rattraper une lapidation manquée par un sacrifice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9002} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9003} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9004} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9005} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9006} Les actes recommandés comprennent les cailloux de la taille d'un pois chiche à celle d'une noisette, le takbir avec chaque caillou, une pause pour la supplication entre les deux premiers jamarat, et le jet après le lever du soleil; Parmi les actes répréhensibles figurent le jet de grosse pierre et le jet de cailloux depuis la mosquée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9007} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9008} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9009} Omettre un caillou implique un sacrifice selon l'école malikite, et manquer une journée entière signifie devoir offrir un mouton; le malade ou l'incapable peut désigner un représentant, et le tuteur de l'enfant jette les cailloux en son nom. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9010} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9011} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9012} La chasse au jet est licite avec un instrument pointu qui blesse le gibier; un projectile contondant qui tue par son poids transforme le gibier en charogne, et il est interdit de prendre une créature vivante comme cible. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9012} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9013} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9014} En temps de guerre, l'apprentissage du tir à l'arc est fortement recommandé et son abandon après l'avoir appris est condamné; un concours de tir à l'arc (munadhala) est autorisé et peut être obligatoire lorsqu'il s'agit du seul moyen de combattre les infidèles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9014} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9015} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9016} Accuser une personne chaste d'adultère sans témoignage est passible de la peine de diffamation (quatre-vingts coups de fouet); si le témoignage ne repose pas sur quatre témoins, ces derniers sont également passibles de cette peine, selon la plupart des juristes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9016}"
