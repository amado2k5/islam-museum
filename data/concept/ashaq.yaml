label:
  ar: "أشق"
  en: "Ashaq (tarthuth gum)"
  fr: "Ashaq (gomme de tarthuth)"
  ur: "اشق ⁦(طرثوث کا صمغ)⁩"
  es: "Ashaq (goma tarthuth)"
  tr: "çatlamak"
  id: "retakan"
summary:
  ar: "صمغ الطرثوث، ويُسمّى لزاق الذهب، قويّ التحليل والتجفيف، ينفع من الأورام والجراح وأمراض العين والصدر، ويذكر الكتاب فيه إسقاط الجنين وهو ما ورد في الكتاب لا توصية به {cite:canon-ibn-sina-print-v1 p.357} {cite:canon-ibn-sina-print-v1 p.358}."
  en: "The gum of tarthuth, called gold glue. It resolves and dries strongly and helps swellings, wounds, eye and chest complaints. The book also states that it expels a foetus; this is the book's listing, not a recommendation {cite:canon-ibn-sina-print-v1 p.357} {cite:canon-ibn-sina-print-v1 p.358}."
  fr: "Gomme de tarthuth, appelée colle d’or. Elle résout et assèche fortement et aide contre les gonflements, les plaies et les affections des yeux et de la poitrine. Le livre affirme aussi qu’elle expulse un fœtus ; il s’agit de son énumération, non d’une recommandation {cite:canon-ibn-sina-print-v1 p.357} {cite:canon-ibn-sina-print-v1 p.358}."
  ur: "طرثوث کا صمغ، جسے لزاق الذہب کہتے ہیں۔ یہ قوی تحلیل اور خشک کرنے والا ہے اور سوجن، زخم، آنکھ اور سینے کی بیماریوں میں مفید ہے؛ کتاب میں لکھا ہے کہ یہ حمل گراتا ہے، یہ کتاب کی فہرست ہے، کوئی سفارش نہیں {cite:canon-ibn-sina-print-v1 p.357} {cite:canon-ibn-sina-print-v1 p.358}۔"
  es: "La goma de tarthuth, llamada pegamento de oro. Disuelve y seca eficazmente y ayuda con hinchazones, heridas y afecciones oculares y del pecho. El libro también afirma que expulsa un feto; esto es una mención del libro, no una recomendación {cite:canon-ibn-sina-print-v1 p.357} {cite:canon-ibn-sina-print-v1 p.358}."
  tr: "Tarthoth sakızı, diğer adıyla altın yapıştırıcı, oldukça kayganlaştırıcı ve kurutucudur, tümörler, yaralar, göz ve göğüs hastalıkları için faydalıdır. Kitapta kürtajdan bahsedilir; kitapta bahsedilir ancak önerilmez {cite:canon-ibn-sina-print-v1 s.357} {cite:canon-ibn-sina-print-v1 s.358}."
  id: "Permen karet tarth, juga disebut lem emas, sangat encer dan mengeringkan, bermanfaat untuk tumor, luka, penyakit mata dan dada. Buku ini menyebutkan aborsi, yang disebutkan dalam buku tetapi tidak direkomendasikan {cite:canon-ibn-sina-print-v1 hlm.357} {cite:canon-ibn-sina-print-v1 hlm.358}."
