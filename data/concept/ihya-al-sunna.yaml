label:
  ar: إحياء السنة
  en: Reviving the sunna (renewing a neglected practice)
summary:
  ar: إعادة العمل بشعيرة من شعائر الإسلام بعد إهمالها، ويطلب شرعاً إما فرض كفاية، وهو الأصل، أو فرض عين، أو ندباً، وتفصيله في مدخل «أمر بالمعروف». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1881}.
  en: Reviving the sunna means restoring the practice of a rite of Islam after it has been neglected; it is sought by law as a collective duty, which is the basis, or as a personal duty, or as recommended, with detail under commanding right. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1881}.
