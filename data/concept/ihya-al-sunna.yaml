id: concept/ihya-al-sunna
class: concept
kind: legal
label:
  ar: إحياء السنة
  en: Reviving the sunna (renewing a neglected practice)
  es: "Revivir la sunna (renovar una práctica descuidada)"
  fr: "Raviver la sunna (renouveler une pratique négligée)"
  ur: "سنّت کو زندہ کرنا ⁦(ایک نظر انداز شدہ عمل کی تجدید)⁩"
summary:
  ar: إعادة العمل بشعيرة من شعائر الإسلام بعد إهمالها، ويطلب شرعاً إما فرض كفاية، وهو الأصل، أو فرض عين، أو ندباً، وتفصيله في مدخل «أمر بالمعروف». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1881}.
  en: Reviving the sunna means restoring the practice of a rite of Islam after it has been neglected; it is sought by law as a collective duty, which is the basis, or as a personal duty, or as recommended, with detail under commanding right. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1881}.
  es: "Revivir la sunna significa restaurar la práctica de un rito del Islam después de que haya sido descuidado; se busca por ley como un deber colectivo, que es la base, o como un deber personal, o como recomendación, con detalles bajo el derecho imperativo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1881}."
  fr: "Raviver la sunna signifie rétablir la pratique d'un rite de l'islam après qu'il a été négligé; cela est prescrit par la loi comme un devoir collectif, qui en constitue le fondement, ou comme un devoir personnel, ou encore comme recommandé, avec des précisions sous la rubrique « droit de commander ». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1881}."
  ur: "سنّت کو زندہ کرنے کا مطلب یہ ہے کہ اسلام کی کسی رسم کو نظر انداز کر دینے کے بعد اسے بحال کرنا۔ یہ قانون کے ذریعہ ایک اجتماعی فرض کے طور پر طلب کیا جاتا ہے، جو کہ بنیاد ہے، یا ذاتی فرض کے طور پر، یا جیسا کہ تجویز کیا گیا ہے، کمانڈنگ حق کے تحت تفصیل کے ساتھ۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 صفحہ 1881}۔"
