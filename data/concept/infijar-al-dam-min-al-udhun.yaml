id: "concept/infijar-al-dam-min-al-udhun"
class: "concept"
kind: "scientific"
label:
  ar: "انفجار الدم من الأذن"
  en: "Blood bursting from the ear"
  ur: "کان سے خون کا پھٹنا"
  es: "Sangre brotando de la oreja"
  fr: "Du sang jaillit de l'oreille"
summary:
  ar: "انفجار الدم من الأذن قد يكون منه ما يجري مجرى الرعاف في أنه بحراني، وربما كان عن امتلاء أدى إلى انشقاق عرق أو انقطاعه أو انفتاحه، وربما كان عن صدمة أو ضربة؛ فأما البحراني فلا يجوز أن يحبس إن لم يؤد إلى ضعف وغشي، وأما غير ذلك فيحبس إما بالقابضات وإما بالكاويات وإما بالمبردات ⁦⁦(أسماء الأدوية لا تحمل)⁩⁩ {cite:canon-ibn-sina-print-v2 p.229}"
  en: "Blood bursting from the ear may run the course of nosebleed — a crisis kind; it may come of a repletion leading a vessel to split, break or open; or of a collision or blow. The crisis kind must not be checked unless it leads to weakness and fainting; the rest is checked, by astringents, caustics or coolants ⁦(drug names are not carried)⁩ {cite:canon-ibn-sina-print-v2 p.229}"
  ur: "کان سے خون کا پھٹنا نکسیر کے حکم میں ہو سکتا ہے یعنی بحرانی؛ اور امتلاء سے بھی ہو سکتا ہے جو کسی عرق کو چاک، توڑ یا کھول دے؛ یا ٹکر یا ضرب سے؛ بحرانی کو روکنا جائز نہیں جب تک کمزوری اور غش تک نہ پہنچائے؛ اور باقی قابضوں، جلانے والوں یا ٹھنڈا کرنے والوں سے روکا جاتا ہے ⁦⁦(ادویہ کے نام منقول نہیں)⁩⁩ {cite:canon-ibn-sina-print-v2 p.229}"
  es: "La hemorragia que brota del oído puede ser una hemorragia nasal grave; también puede deberse a una sobrecarga que provoca la rotura o el desgarro de un vaso sanguíneo, o a un golpe. Las hemorragias graves no deben tratarse a menos que causen debilidad y desmayos; las demás se tratan con astringentes, cáusticos o refrigerantes (no se incluyen los nombres de los fármacos). {cite:canon-ibn-sina-print-v2 p.229}"
  fr: "Un saignement de nez, aussi grave qu'un saignement d'oreille, peut survenir en cas de crise. Il peut être provoqué par une distension vasculaire entraînant la rupture d'un vaisseau ou par un choc. Ce type de saignement ne doit être arrêté que s'il provoque faiblesse et évanouissement; dans les autres cas, on utilise des astringents, des caustiques ou des réfrigérants (les noms des médicaments ne sont pas mentionnés). {cite:canon-ibn-sina-print-v2 p.229}"
