id: concept/canon-harms-of-excessive-vomiting
class: concept
kind: scientific
label:
  ar: "مضار القيء المفرط عند ابن سينا"
  en: "The harms of excessive vomiting in the Canon"
  fr: "Méfaits du vomissement excessif dans le Canon"
  ur: "قانون میں حد سے زیادہ قے کے نقصانات"
  es: "Los perjuicios del vómito excesivo en el Canon"
summary:
  ar: "يعدد ابن سينا مضار القيء المفرط: يضر المعدة ويضعفها ويجعلها عرضة لتوجه المواد، ويضر الصدر والبصر والأسنان، وقد يضر الكبد والرئة والعين، وقد يصدع بعض العروق، وينهى عمن يتعمد الامتلاء السريع ثم يفزع إلى القيء {cite:canon-ibn-sina-print-v1 p.288}."
  en: "Ibn Sina lists the harms of excessive vomiting: it harms and weakens the stomach and exposes it to flows of matter, harms the chest, sight and teeth, may harm the liver, lung and eye and split some vessels, and he warns against those who fill themselves quickly and then turn to vomiting {cite:canon-ibn-sina-print-v1 p.288}."
  fr: "Ibn Sina lui attribue affaiblissement gastrique et afflux de matière, atteinte de poitrine, vue et dents, parfois foie, poumon, œil et rupture vasculaire ; il condamne la réplétion rapide suivie de vomissement {cite:canon-ibn-sina-print-v1 p.288}."
  es: "Ibn Sina enumera los perjuicios del vómito excesivo: daña y debilita el estómago y lo expone a flujos de materia, daña el pecho, la vista y los dientes, puede dañar el hígado, los pulmones y los ojos y romper algunos vasos, y advierte contra aquellos que se llenan rápidamente y luego vomitan {cite:canon-ibn-sina-print-v1 p.288}."
