label: { ar: "مضار القيء المفرط عند ابن سينا", en: "The harms of excessive vomiting in the Canon", ur: "قانون میں حد سے زیادہ قے کے نقصانات" }
summary:
  ar: "يعدد ابن سينا مضار القيء المفرط: يضر المعدة ويضعفها ويجعلها عرضة لتوجه المواد، ويضر الصدر والبصر والأسنان، وقد يضر الكبد والرئة والعين، وقد يصدع بعض العروق، وينهى عمن يتعمد الامتلاء السريع ثم يفزع إلى القيء {cite:canon-ibn-sina-print-v1 p.288}."
  en: "Ibn Sina lists the harms of excessive vomiting: it harms and weakens the stomach and exposes it to flows of matter, harms the chest, sight and teeth, may harm the liver, lung and eye and split some vessels, and he warns against those who fill themselves quickly and then turn to vomiting {cite:canon-ibn-sina-print-v1 p.288}."
