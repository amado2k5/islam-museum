id: concept/chancery-paper-grades
class: concept
kind: term
label:
  ar: "أصناف الورق في الدواوين"
  en: "Paper grades in the chanceries"
  ur: "دفاتر میں کاغذ کی اقسام"
  fr: "Qualités de papier dans les chancelleries"
  es: "Calidades de papel en las cancillerías"
summary:
  ar: "وصف رشيد الدين، في مقدمة جامع التواريخ، لأصناف الورق المستعملة في دواوين الدولة الإيلخانية وفي دواوين الأمراء المجاورة. يذكر ورق بغداد، وأصناف الورق الشامي والحموي، والورق المنصوري المصري، وورق الطير المخصص لبطائق الحمام، ويحدد لكل صنف مقاسه وما يُكتب عليه من الإقطاعات والمراسلات والتواقيع. ويرى أن الورق حل محل الرق منذ عهد الرشيد العباسي لأنه يمكن محو الرق وإعادة الكتابة عليه {cite:jami-al-tawarikh-khashshab-1960 p. 192}{cite:jami-al-tawarikh-khashshab-1960 p. 193}{cite:jami-al-tawarikh-khashshab-1960 p. 194}{cite:jami-al-tawarikh-khashshab-1960 p. 195}{cite:jami-al-tawarikh-khashshab-1960 p. 196}. وتنقل الصفحات كذلك عن ابن خلدون والمقريزي وغيرهما ما يتصل بالوراقة وصناعة الورق. وهذا الباب من الكتاب في معظمه وصف لعادات الكتابة الديوانية، وليس فيه حكم."
  en: "Rashid al-Din's description, in the preface to the Jami al-Tawarikh, of the paper grades used in the chanceries of the Ilkhanate and of neighbouring princes. He names Baghdadi paper, the paper of Syria including the Hamawi grade, the Mansuri paper of Egypt, and the bird paper used for pigeon post, and gives for each its size and what it was used for: grants, letters, decrees, and lesser documents. He says that paper replaced parchment under the Abbasid caliph Harun al-Rashid because writing on paper could not be erased without a trace {cite:jami-al-tawarikh-khashshab-1960 p. 192}{cite:jami-al-tawarikh-khashshab-1960 p. 193}{cite:jami-al-tawarikh-khashshab-1960 p. 194}{cite:jami-al-tawarikh-khashshab-1960 p. 195}{cite:jami-al-tawarikh-khashshab-1960 p. 196}. The pages also quote Ibn Khaldun, al-Maqrizi and others on the papermaker and the copyist. The passage describes chancery customs and gives no verdict."
  ur: "رشید الدین کا بیان، جامع التواریخ کے دیباچے میں، ایل خانی دفاتر اور پڑوسی امرا کے دفاتر میں استعمال ہونے والے کاغذ کی اقسام کے بارے میں۔ وہ بغدادی کاغذ، شام کا کاغذ جس میں حموی قسم شامل ہے، مصری منصوری کاغذ، اور کبوتر کی ڈاک کے لیے طیر کاغذ کا ذکر کرتے ہیں، اور ہر قسم کا سائز اور اس پر لکھی جانے والی دستاویزات بتاتے ہیں۔ ان کے مطابق عباسی خلیفہ ہارون الرشید کے عہد سے کاغذ نے کھال کی جگہ لی، کیونکہ کاغذ پر لکھا ہوا بغیر نشان کے مٹایا نہیں جا سکتا {cite:jami-al-tawarikh-khashshab-1960 p. 192}{cite:jami-al-tawarikh-khashshab-1960 p. 193}{cite:jami-al-tawarikh-khashshab-1960 p. 194}{cite:jami-al-tawarikh-khashshab-1960 p. 195}{cite:jami-al-tawarikh-khashshab-1960 p. 196}۔ یہ صفحات ابن خلدون اور مقریزی وغیرہ کے حوالے سے کاغذ سازی اور وراقہ کے بارے میں بھی بیان کرتے ہیں۔ یہ باب زیادہ تر دفتری رواج کی تفصیل ہے، اس میں کوئی فیصلہ نہیں۔"
  fr: "Description que donne Rashid al-Din, dans la préface du Jami al-Tawarikh, des qualités de papier employées dans les chancelleries de l'Ilkhanat et chez les princes voisins. Il nomme le papier de Bagdad, le papier de Syrie dont la qualité hamawi, le papier mansurien d'Égypte et le papier-oiseau employé pour la poste par pigeons, et indique pour chacun sa taille et ses usages : concessions, lettres, décrets et documents mineurs. Il affirme que le papier remplaça le parchemin sous le calife abbasside Harun al-Rashid, car l'écriture sur papier ne pouvait être effacée sans trace {cite:jami-al-tawarikh-khashshab-1960 p. 192}{cite:jami-al-tawarikh-khashshab-1960 p. 193}{cite:jami-al-tawarikh-khashshab-1960 p. 194}{cite:jami-al-tawarikh-khashshab-1960 p. 195}{cite:jami-al-tawarikh-khashshab-1960 p. 196}. Les pages citent aussi Ibn Khaldun, al-Maqrizi et d'autres sur le papetier et le copiste. Le passage décrit des usages de chancellerie et ne porte aucun jugement."
  es: "Descripción que hace Rashid al-Din, en el prefacio del Jami al-Tawarikh, de las calidades de papel empleadas en las cancillerías del Ilkanato y de los príncipes vecinos. Menciona el papel de Bagdad, el papel de Siria con su calidad hamawí, el papel mansurí de Egipto y el papel de pájaro usado para el correo de palomas, y señala para cada uno su tamaño y sus usos: concesiones, cartas, decretos y documentos menores. Afirma que el papel sustituyó al pergamino bajo el califa abasí Harún al-Rashid, porque lo escrito en papel no podía borrarse sin dejar rastro {cite:jami-al-tawarikh-khashshab-1960 p. 192}{cite:jami-al-tawarikh-khashshab-1960 p. 193}{cite:jami-al-tawarikh-khashshab-1960 p. 194}{cite:jami-al-tawarikh-khashshab-1960 p. 195}{cite:jami-al-tawarikh-khashshab-1960 p. 196}. Las páginas citan también a Ibn Jaldún, al-Maqrizi y otros sobre el papelero y el copista. El pasaje describe costumbres de cancillería y no contiene juicio alguno."
