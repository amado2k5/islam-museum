label: { ar: "الهجر ⁦(المقاطعة الاجتماعية)⁩", en: "Social boycott (hajr) of the three", fr: "La mise à l’écart sociale (hajr) des trois hommes", es: "Boicot social (hajr) de los tres", ur: "تینوں کا سماجی بائیکاٹ ⁦(حجر)⁩", tr: "Terk Edilme (Sosyal Boykot)", id: "Pengabaian (Boikot Sosial)" }
summary:
  ar: "المقاطعة التي أمر بها النبي بعد تبوك: نهى المسلمين عن كلام الثلاثة المخلفين، فاجتنبهم الناس خمسين ليلة."
  en: "The boycott the Prophet ordered after Tabuk: he forbade the Muslims to speak to the three who had stayed behind, and people shunned them for fifty nights."
  fr: "Après Tabuk, le Prophète ordonna la mise à l’écart des trois hommes qui étaient restés en arrière. Il interdit aux musulmans de leur parler, et les gens les évitèrent pendant cinquante nuits."
  es: "El boicot que ordenó el Profeta después de Tabuk: prohibió a los musulmanes hablar con los tres que se habían quedado atrás, y la gente los evitó durante cincuenta noches."
  ur: "تبوک کے بعد نبی نے بائیکاٹ کا حکم دیا: آپ نے مسلمانوں کو ان تینوں سے بات کرنے سے منع کیا جو پیچھے رہ گئے تھے، اور لوگوں نے پچاس راتوں تک ان سے اجتناب کیا۔"
  tr: "Peygamber'in Tabuk'tan sonra emrettiği boykot: Müslümanların geride kalan üç kişiyle konuşmasını yasakladı, böylece insanlar elli gece boyunca onlardan uzak durdu."
  id: "Boikot yang diperintahkan oleh Nabi setelah Tabuk: Ia melarang Muslim berbicara dengan tiga orang yang tersisa, sehingga orang-orang menjauh dari mereka selama lima puluh malam."
