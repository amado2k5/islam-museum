summary:
  ar: "محفة فارغة مزخرفة كانت تحمل على جمل في قافلة الحج ترمز إلى الرعاية السلطانية للحجاز؛ أشهرها المحمل المصري حتى أواسط القرن العشرين."
  en: "An ornate empty litter borne on a camel in the Hajj caravan symbolising sovereign care for the Hijaz; the Egyptian mahmal lasted until the mid-20th century."
  es: "Una elaborada litera vacía transportada sobre un camello en la caravana del Hajj, que simbolizaba el cuidado soberano del Hiyaz; el mahmal egipcio se utilizó hasta mediados del siglo XX."
  fr: "Une litière vide et ornée, transportée sur un chameau dans la caravane du Hajj, symbolisant la sollicitude souveraine pour le Hedjaz; le mahmal égyptien a perduré jusqu'au milieu du XXe siècle."
