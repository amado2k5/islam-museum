id: concept/ihtiyal
class: concept
kind: legal
label: { ar: "احتيال", en: "Stratagem (ihtiyal)" }
summary:
  ar: "الاحتيال طلب الحيلة، وهي الحذق في تدبير الأمور حتى يهتدي إلى المقصود. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1750} وغلب في العرف استعمال الحيلة في سلوك الطرق الخفية التي يتوصل بها إلى غرض لا يتفطن له إلا القليل، كما قال ابن القيم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1750} والحيلة المحرمة ما خرم قواعد الشريعة، كأن يشرب خمراً أو دواء منوماً عند دخول وقت الصلاة حتى يخرج وقتها، أو أن يهب ماله قبل الحج ليسقط عنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1751} ويحرم التصرف في المال قبل الحول فراراً من الزكاة عند المالكية والحنابلة، وخالف الحنفية، فكره ذلك محمد وأجازه أبو يوسف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1751}"
  en: "Ihtiyal means seeking a stratagem, which is skill in arranging affairs until one reaches the aim. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1750} Usage has narrowed it to hidden paths by which a person reaches an aim that few would notice, as Ibn al-Qayyim said. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1750} A stratagem is forbidden when it breaks the rules of the law: for example, drinking wine or a sedative when the time of prayer comes so that its time passes, or giving away one's wealth before the pilgrimage to escape it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1751} The Malikis and Hanbalis forbid disposing of property before the year to escape zakat; the Hanafis differ, Muhammad disliking it and Abu Yusuf allowing it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1751}"
