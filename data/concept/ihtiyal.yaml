label: { ar: "احتيال", en: "Stratagem (ihtiyal)", es: "Estratagema (ihtiyal)", fr: "Stratagème (ihtiyal)" }
summary:
  ar: "الاحتيال طلب الحيلة، وهي الحذق في تدبير الأمور حتى يهتدي إلى المقصود. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1750} وغلب في العرف استعمال الحيلة في سلوك الطرق الخفية التي يتوصل بها إلى غرض لا يتفطن له إلا القليل، كما قال ابن القيم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1750} والحيلة المحرمة ما خرم قواعد الشريعة، كأن يشرب خمراً أو دواء منوماً عند دخول وقت الصلاة حتى يخرج وقتها، أو أن يهب ماله قبل الحج ليسقط عنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1751} ويحرم التصرف في المال قبل الحول فراراً من الزكاة عند المالكية والحنابلة، وخالف الحنفية، فكره ذلك محمد وأجازه أبو يوسف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1751}"
  en: "Ihtiyal means seeking a stratagem, which is skill in arranging affairs until one reaches the aim. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1750} Usage has narrowed it to hidden paths by which a person reaches an aim that few would notice, as Ibn al-Qayyim said. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1750} A stratagem is forbidden when it breaks the rules of the law: for example, drinking wine or a sedative when the time of prayer comes so that its time passes, or giving away one's wealth before the pilgrimage to escape it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1751} The Malikis and Hanbalis forbid disposing of property before the year to escape zakat; the Hanafis differ, Muhammad disliking it and Abu Yusuf allowing it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1751}"
  es: "Ihtiyal significa buscar una estratagema, que es la habilidad de arreglar asuntos hasta alcanzar el objetivo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1750} El uso lo ha restringido a caminos ocultos por los cuales una persona alcanza un objetivo que pocos notarían, como dijo Ibn al-Qayyim. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1750} Una estratagema está prohibida cuando rompe las reglas de la ley: por ejemplo, beber vino o un sedante cuando llega la hora de la oración para que pase su tiempo, o dar la riqueza de uno antes de la peregrinación para evitarla. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1751} Los malikíes y hanbalíes prohíben disponer de la propiedad antes del año para escapar del zakat; los hanafíes difieren, Muhammad lo desaprobaba y Abu Yusuf lo permitía. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1751}"
  fr: "L'ihtiyal signifie rechercher une ruse, c'est-à-dire l'habileté à organiser les affaires jusqu'à atteindre son but. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1750} L'usage a restreint ce sens aux voies détournées par lesquelles une personne atteint un objectif que peu remarqueraient, comme l'a dit Ibn al-Qayyim. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1750} Une ruse est interdite lorsqu'elle contrevient aux règles de la loi: par exemple, boire du vin ou un sédatif à l'heure de la prière pour en faire passer l'heure, ou se délester de ses biens avant le pèlerinage pour s'y soustraire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1751} Les écoles malikite et hanbalite interdisent de disposer de ses biens avant l'année pour échapper à la zakat; les hanafites sont divergents: le Prophète Muhammad la désapprouvait, tandis qu'Abu Yusuf l'autorisait. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1751}"
