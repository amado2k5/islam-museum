summary:
  ar: "يفتتح ابن سينا فصل القيء ببيان من يبعد عنهم أن يقيئهم الطبيب: بسبب الطبيعة ضيق الصدر ومن يُخاف نفث الدم ورقيق الرقبة، وبسبب العادة من تعسر عليه القيء، ثم يذكر أن الضعاف المعد والسمان يوافقهم الإسهال والقضاف أجدر بالقيء {cite:canon-ibn-sina-print-v1 p.285}."
  en: "Ibn Sina opens the chapter on vomiting by naming those least fit to be made to vomit by the physician: by nature the narrow-chested and those prone to spitting blood, and the thin-necked; by habit those who find vomiting hard; he adds that the weak of stomach and the very fat suit purging, and the lean suit vomiting {cite:canon-ibn-sina-print-v1 p.285}."
