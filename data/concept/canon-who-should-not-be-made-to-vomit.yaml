id: concept/canon-who-should-not-be-made-to-vomit
class: concept
kind: scientific
label: { ar: "من لا يُقيَّأ ومن يُقيَّأ عند ابن سينا", en: "Who should not be made to vomit in the Canon", ur: "قانون میں کن لوگوں کو قے نہیں کرانی چاہیے", es: "¿Quién no debería ser obligado a vomitar en el Canon?", fr: "Qui ne devrait pas être contraint de vomir dans le Canon" }
summary:
  ar: "يفتتح ابن سينا فصل القيء ببيان من يبعد عنهم أن يقيئهم الطبيب: بسبب الطبيعة ضيق الصدر ومن يُخاف نفث الدم ورقيق الرقبة، وبسبب العادة من تعسر عليه القيء، ثم يذكر أن الضعاف المعد والسمان يوافقهم الإسهال والقضاف أجدر بالقيء {cite:canon-ibn-sina-print-v1 p.285}."
  en: "Ibn Sina opens the chapter on vomiting by naming those least fit to be made to vomit by the physician: by nature the narrow-chested and those prone to spitting blood, and the thin-necked; by habit those who find vomiting hard; he adds that the weak of stomach and the very fat suit purging, and the lean suit vomiting {cite:canon-ibn-sina-print-v1 p.285}."
  es: "Ibn Sina abre el capítulo sobre el vómito nombrando a los menos aptos para ser inducidos al vómito por el médico: por naturaleza, los de pecho estrecho y los propensos a escupir sangre, y los de cuello delgado; por costumbre, aquellos a quienes les cuesta vomitar; añade que los de estómago débil y los muy gordos son aptos para purgar, y los delgados para vomitar {cite:canon-ibn-sina-print-v1 p.285}."
  fr: "Ibn Sina ouvre le chapitre sur les vomissements en nommant ceux qui sont les moins aptes à être amenés à vomir par le médecin: par nature ceux qui ont la poitrine étroite et ceux qui sont enclins à cracher du sang, et ceux qui ont le cou mince; par habitude ceux qui ont du mal à vomir; il ajoute que les personnes à l'estomac faible et les personnes très grosses conviennent à la purge, et les personnes maigres conviennent aux vomissements {cite:canon-ibn-sina-print-v1 p.285}."
