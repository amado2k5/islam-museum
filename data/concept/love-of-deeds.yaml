id: concept/love-of-deeds
class: concept
kind: doctrine
label:
  ar: محبة الله للعمل لا للذات
  en: God's love attaches to deeds, not to persons
summary:
  ar: "يرى الشعراوي أن الآية التي تقول إن الله يحب المتقين الذين يوفون بعهدهم تعلّق المحبة بالعمل والوصف لا بالذات، فلا يحق لأحد أن يظن أن المحبة الإلهية ثابتة له بذاته. ويستدل بقصة ابن نوح على أن الذوات لا تتناسل من النسب، وأن القيمة للعمل الصالح {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1550}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1551}."
  en: "Sha'rawi reads the verse that God loves the God-conscious people who keep their covenant as tying love to the deed and the attribute, not to the person. No one may assume that divine love is fixed to him by his person. He draws on the story of Noah's son to say that persons do not descend from lineage and that worth lies in righteous deeds {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1550}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1551}."
