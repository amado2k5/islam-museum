id: concept/love-of-deeds
class: concept
kind: doctrine
label:
  ar: محبة الله للعمل لا للذات
  en: God's love attaches to deeds, not to persons
  es: "El amor de Dios se manifiesta en las obras, no en las personas."
  fr: "L’amour de Dieu s’attache aux actes, non aux personnes."
  ur: "خدا کی محبت لوگوں سے نہیں اعمال سے ہے۔"
  tr: "Tanrı'nın kendine değil, işe olan sevgisi"
  id: "Kasih Tuhan pada pekerjaan, bukan pada diri sendiri"
summary:
  ar: "يرى الشعراوي أن الآية التي تقول إن الله يحب المتقين الذين يوفون بعهدهم تعلّق المحبة بالعمل والوصف لا بالذات، فلا يحق لأحد أن يظن أن المحبة الإلهية ثابتة له بذاته. ويستدل بقصة ابن نوح على أن الذوات لا تتناسل من النسب، وأن القيمة للعمل الصالح {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1550}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1551}."
  en: "Sha'rawi reads the verse that God loves the God-conscious people who keep their covenant as tying love to the deed and the attribute, not to the person. No one may assume that divine love is fixed to him by his person. He draws on the story of Noah's son to say that persons do not descend from lineage and that worth lies in righteous deeds {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1550}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1551}."
  es: "Sha'rawi interpreta el versículo que afirma que Dios ama a quienes, conscientes de su fe, guardan su pacto, vinculando el amor a la acción y al atributo, no a la persona. Nadie puede suponer que el amor divino le es inherente a su persona. Se basa en la historia del hijo de Noé para afirmar que las personas no descienden por linaje y que el valor reside en las buenas obras {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1550}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1551}."
  fr: "Sha'rawi interprète le verset selon lequel Dieu aime les personnes conscientes de sa volonté et qui respectent leur alliance comme liant l'amour à l'acte et à l'attribut, et non à la personne. Nul ne peut présumer que l'amour divin lui est attaché par sa personne. Il s'appuie sur l'histoire du fils de Noé pour affirmer que les personnes ne descendent pas d'une lignée et que la valeur réside dans les actes justes."
  ur: "شعراوی نے اس آیت کو پڑھا کہ خدا ان خدا پرست لوگوں سے محبت کرتا ہے جو اپنے عہد کو عمل اور صفت سے جوڑتے ہیں، انسان سے نہیں۔ کوئی بھی یہ گمان نہیں کر سکتا کہ الہی محبت اس کے ساتھ اس کے شخص نے طے کی ہے۔ وہ نوح کے بیٹے کی کہانی کو کھینچتے ہوئے کہتا ہے کہ لوگ نسب سے نہیں آتے اور اس کی قیمت نیک اعمال میں ہے"
  tr: "Al-Shaarawi, Tanrı'nın ahitini koruyan dindarları sevdiğini söyleyen ayetin, sevgiyi özle değil, eylemlerle ve tasvirlerle ilişkilendirdiğine inanır; bu yüzden kimse ilahi sevginin O'nun özünde sabit olduğunu düşünmeye hakkı yoktur. İbn Nuh'un hikayesini benliklerin soyundan üremeyeceğine ve değerin doğru işlerde olduğuna dair kanıt olarak gösterir {cite:tafsir-sharawi-khawatir-scan-vol-cilt 2 s.1550}{cite:tafsir-sharawi-khawatir-scan-vol-cilt 2 s.1551}."
  id: "Al-Shaarawi percaya bahwa ayat yang mengatakan Tuhan mengasihi orang saleh yang memelihara perjanjiannya menghubungkan kasih dengan perbuatan dan deskripsi, bukan dengan esensi, sehingga tidak ada yang berhak berpikir bahwa kasih ilahi terpaku pada esensi-Nya. Ia mengutip kisah Ibn Nuh sebagai bukti bahwa diri tidak berkembang biak dari garis keturunan, dan nilai itu terletak pada perbuatan benar {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1550}{cite:tafsir-sharawi-khawatir-scan-scan-vol-2 hlm.1551}."
