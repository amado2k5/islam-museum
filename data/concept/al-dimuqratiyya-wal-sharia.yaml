id: concept/al-dimuqratiyya-wal-sharia
class: concept
kind: political
label:
  ar: "الديمقراطية والشريعة — التوافق والتعارض"
  en: "Democracy and the Sharia — compatibility and conflict"
  fr: "Démocratie et charia : compatibilité et tensions"
  es: "Democracia y la Sharia: compatibilidad y conflicto."
  ur: "جمہوریت اور شریعت - مطابقت اور تنازعہ"
  tr: "Demokrasi ve Şeriat — Uzlaşma ve Çatışma"
  id: "Demokrasi dan Syariah — Rekonsiliasi dan Konflik"
issue:
  ar: "هل تتعارض الديمقراطية مع الشريعة، وهل يجوز للمسلمين المشاركة فيها، وهل نجحت تجربة الإسلاميين فيها؟"
summary:
  ar: "حلقة «الوسطية» عن الديمقراطية وعلاقتها بالإسلام. صوّت الجمهور: 16% يرونها متعارضة مع الشريعة و42% لا يرون تعارضاً و42% يرون التعارض جزئياً. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep03 00:04:30} وعلى نجاح مشاركة الإسلاميين: 40% ناجحة و60% فاشلة. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep03 00:32:00} ولخّص عزام التميمي المسألة بتفكيك الديمقراطية إلى شقٍّ إجرائي ⁦(انتخابات ورقابة وحقوق — لا إشكال فيه عندهم)⁩ وشقٍّ فلسفي تشريعي ⁦(موضع الخلاف)⁩، مؤكداً أن لا فليسوفاً غربياً معترفاً به يجعل العلمانية شرطاً للديمقراطية. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep03 00:25:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep03 00:27:30}"
  en: "The 'Al-Wasatiyya' episode on democracy and Islam. The audience voted: 16% saw it conflicting with the sharia, 42% saw no conflict, 42% partial conflict. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep03 00:04:30} On the Islamists' record in it: 40% successful, 60% failed. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep03 00:32:00} Azzam al-Tamimi distilled the issue by splitting democracy into a procedural arm (elections, oversight, rights — unproblematic for the panel) and a philosophical legislative arm (the real dispute), insisting no recognised Western philosopher makes secularism a prerequisite of democracy. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep03 00:25:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep03 00:27:30}"
  fr: "L’épisode d’« Al-Wasatiyya » porte sur la démocratie et ses rapports avec l’islam. Lors du vote, 16 % du public la jugeaient incompatible avec la charia, 42 % ne voyaient aucune contradiction et 42 % en voyaient une partielle. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep03 00:04:30} Sur le bilan de la participation des islamistes, 40 % l’ont jugée réussie et 60 % la considéraient comme un échec. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep03 00:32:00} Azzam al-Tamimi a résumé le débat en distinguant le volet des procédures (élections, contrôle du pouvoir et droits, qui ne posaient pas de problème aux participants) de celui des fondements philosophiques de la législation, où résidait selon lui le véritable désaccord. Il a affirmé qu’aucun philosophe occidental reconnu ne faisait de la laïcité une condition de la démocratie. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep03 00:25:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep03 00:27:30}"
  es: "El episodio de 'Al-Wasatiyya' sobre democracia e Islam. La audiencia votó: 16% lo vio en conflicto con la sharia, 42% no vio conflicto, 42% conflicto parcial. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep03 00:04:30} Sobre el historial de los islamistas en él: 40% exitoso, 60% fracasado. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep03 00:32:00} Azzam al-Tamimi destiló el tema dividiendo la democracia en un brazo procedimental (elecciones, supervisión, derechos —sin problemas para el panel) y un brazo legislativo filosófico (la verdadera disputa), insistiendo en que ningún filósofo occidental reconocido hace del secularismo un requisito previo de la democracia. {cita:assabile-tareq-al-suwaidan al-wassitiya/ep03 00:25:00} {cita:assabile-tareq-al-suwaidan al-wassitiya/ep03 00:27:30}"
  ur: "جمہوریت اور اسلام پر 'الوصطیہ' قسط۔ سامعین نے ووٹ دیا: 16% نے اسے شریعت سے متصادم دیکھا، 42% نے کوئی تنازعہ نہیں دیکھا، 42% نے جزوی تنازعہ دیکھا۔ {حوالہ:assabile-tareq-al-suwaidan al-wasitiya/ep03 00:04:30} اس میں اسلام پسندوں کے ریکارڈ پر: 40% کامیاب، 60% ناکام۔ {حوالہ: assabile-tareq-al-suwaidan al-wasitiya/ep03 00:32:00} عزام التمیمی نے جمہوریت کو ایک طریقہ کار کے بازو ⁦(انتخابات، نگرانی، حقوق - پینل کے لیے غیرمسئلہ)⁩ میں تقسیم کرکے اس مسئلے کو کشید کیا اور ایک فلسفیانہ قانون سازی ⁦(مغربی قانون سازی میں حقیقی تنازعہ کو تسلیم نہیں کرتا)⁩۔ سیکولرازم جمہوریت کی شرط ہے۔ {حوالہ:اسابیل-طارق-السویدان الوسیطیہ/ep03 00:25:00} {حوالہ:اصابیل-طارق-السویدان الوسیطیہ/ep03 00:27:30}"
  tr: "Demokrasi ve İslam ile ilişkisi hakkında \"Ilımlılık\" bölümü. Halk oylaması: %16 bunu Şeriat'a aykırı olarak görüyor, %42 görmüyor ve %42 kısmi çatışma görüyor. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep03 00:04:30} Ve İslamcı katılımın başarısı hakkında: %40 başarılı, %60 başarısız. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep03 00:32:00} Azzam Al-Tamimi konuyu usul bir bölüme (seçimler, denetim ve haklar — ki bunlarla sorun yaşamıyorlar) ve felsefi yasama kısmına (tartışma noktası) ayırarak özetledi ve tanınmış hiçbir Batılı filozofun laikliği demokrasi için bir koşul haline getirmediğini vurguladı. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep03 00:25:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep03 00:27:30}"
  id: "Bagian \"Moderasi\" tentang demokrasi dan hubungannya dengan Islam. Referendum: 16% melihatnya bertentangan dengan Syariah, 42% tidak, dan 42% melihat konflik parsial. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep03 00:04:30} Dan tentang keberhasilan partisipasi Islamis: 40% berhasil, 60% gagal. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep03 00:32:00} Azzam Al-Tamimi merangkum isu ini dengan membaginya menjadi bagian prosedural (pemilihan, pengawasan, dan hak — yang tidak menjadi masalah bagi mereka) dan bagian legislatif filosofis (poin diskusi), menekankan bahwa tidak ada filsuf Barat terkenal yang menjadikan sekularisme sebagai syarat demokrasi. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep03 00:25:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep03 00:27:30}"
