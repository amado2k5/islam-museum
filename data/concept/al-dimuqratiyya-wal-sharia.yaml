id: concept/al-dimuqratiyya-wal-sharia
class: concept
kind: political
label:
  ar: "الديمقراطية والشريعة — التوافق والتعارض"
  en: "Democracy and the Sharia — compatibility and conflict"
issue:
  ar: "هل تتعارض الديمقراطية مع الشريعة، وهل يجوز للمسلمين المشاركة فيها، وهل نجحت تجربة الإسلاميين فيها؟"
summary:
  ar: "حلقة «الوسطية» عن الديمقراطية وعلاقتها بالإسلام. صوّت الجمهور: 16% يرونها متعارضة مع الشريعة و42% لا يرون تعارضاً و42% يرون التعارض جزئياً. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep03 00:04:30} وعلى نجاح مشاركة الإسلاميين: 40% ناجحة و60% فاشلة. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep03 00:32:00} ولخّص عزام التميمي المسألة بتفكيك الديمقراطية إلى شقٍّ إجرائي (انتخابات ورقابة وحقوق — لا إشكال فيه عندهم) وشقٍّ فلسفي تشريعي (موضع الخلاف)، مؤكداً أن لا فليسوفاً غربياً معترفاً به يجعل العلمانية شرطاً للديمقراطية. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep03 00:25:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep03 00:27:30}"
  en: "The 'Al-Wasatiyya' episode on democracy and Islam. The audience voted: 16% saw it conflicting with the sharia, 42% saw no conflict, 42% partial conflict. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep03 00:04:30} On the Islamists' record in it: 40% successful, 60% failed. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep03 00:32:00} Azzam al-Tamimi distilled the issue by splitting democracy into a procedural arm (elections, oversight, rights — unproblematic for the panel) and a philosophical legislative arm (the real dispute), insisting no recognised Western philosopher makes secularism a prerequisite of democracy. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep03 00:25:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep03 00:27:30}"
perspectives:
