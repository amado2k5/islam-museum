class: concept
kind: term
tags: [arabiyya-browser, arabiyya-dialects]
label:
  ar: "هل العربية لغة واحدة أم عدة لغات؟ تصنيف الأصناف العربية"
  en: "Is Arabic one language or several? How the varieties are classified"
  ur: "کیا عربی ایک زبان ہے یا کئی؟ اقسام کی درجہ بندی"
  fr: "L'arabe est-il une langue ou plusieurs ? Le classement des variétés"
  es: "¿Es el árabe una lengua o varias? La clasificación de las variedades"
  tr: "Arapça tek bir dil mi yoksa birden fazla dil mi? Arapça çeşitlerinin sınıflandırılması"
  id: "Apakah bahasa Arab adalah satu bahasa atau beberapa bahasa? Klasifikasi varietas bahasa Arab"
summary:
  ar: "كيف تصنّف ثلاثة أنظمة العربية: مكتبة الكونغرس في ISO 639-2 لغة واحدة برمز ara، وISO 639-3 لغة كبرى تضم ثماني وعشرين لغة فردية نشطة، وإثنولوج 2026 كل صنف لغة قائمة بنفسها، مع جدول الأكواد. تنسب الصفحة كل تصنيف إلى صاحبه ولا ترجّح بينها، ومصدرها ملخص بحثي قدّمه المؤسس ووافق على استعماله في 21 نوفمبر 2026 ولم يفتح المتحف صفحاته؛ وأعداد المتكلمين غير مذكورة لأنها محجوبة في إثنولوج."
  en: "How three systems classify Arabic: the Library of Congress in ISO 639-2 as one language with the code ara, ISO 639-3 as a macrolanguage with 28 active individual languages, and Ethnologue 2026 with each variety a language of its own, with the table of codes. The page ascribes each classification to its owner and prefers none; its source is a research summary the founder supplied and approved on 21 November 2026, whose pages the museum did not open; speaker numbers are not given because Ethnologue withholds them."
  ur: "تین نظام عربی کو کیسے درجہ بند کرتے ہیں: لائبریری آف کانگریس ISO 639-2 میں ایک زبان `ara` کے کوڈ کے ساتھ، ISO 639-3 ایک بڑی زبان جس میں اٹھائیس فعال انفرادی زبانیں ہیں، اور ایتھنولوگ 2026 جس میں ہر قسم الگ زبان ہے، کوڈ کی فہرست کے ساتھ۔ صفحہ ہر درجہ بندی اس کے مالک کی طرف منسوب کرتا ہے اور کسی کو ترجیح نہیں دیتا؛ ماخذ بانی کا فراہم کردہ تحقیقی خلاصہ ہے جس کی منظوری 21 نومبر 2026 کو دی گئی اور جس کے صفحات عجائب گھر نے نہیں کھولے؛ بولنے والوں کے اعداد نہیں دیے گئے کیونکہ ایتھنولوگ انہیں روکتی ہے۔"
  fr: "Comment trois systèmes classent l'arabe : la Bibliothèque du Congrès dans l'ISO 639-2 comme une langue de code ara, l'ISO 639-3 comme une macrolangue de 28 langues individuelles actives, et Ethnologue 2026 avec chaque variété comme langue à part, avec la table des codes. La page attribue chaque classement à son auteur sans en préférer aucun ; sa source est un résumé de recherche fourni par le fondateur et approuvé le 21 novembre 2026, dont le musée n'a pas ouvert les pages ; les nombres de locuteurs ne sont pas donnés car Ethnologue les réserve."
  es: "Cómo clasifican el árabe tres sistemas: la Biblioteca del Congreso en la ISO 639-2 como una lengua de código ara, la ISO 639-3 como una macrolengua con 28 lenguas individuales activas, y Ethnologue 2026 con cada variedad como lengua propia, con la tabla de códigos. La página atribuye cada clasificación a su autor sin preferir ninguna; su fuente es un resumen de investigación entregado por el fundador y aprobado el 21 de noviembre de 2026, cuyas páginas el museo no abrió; no se dan cifras de hablantes porque Ethnologue las reserva."
  tr: "Üç Arap sistemi nasıl sınıflandırılır: ISO 639-2'de Kongre Kütüphanesi ara kodu olan tek bir dildir, ISO 639-3 yirmi sekiz aktif bireysel dili olan ana dillerden biridir ve Etnoloji 2026 her biri kendi dil kategorisidir ve kod tablosu vardır. Sayfa her sınıflandırmayı yazarına atfeder ve aralarından seçim yapmaz; kaynağı ise 21 Kasım 2026'da kullanımını onaylayan kurucu tarafından sunulan bir araştırma özüdür, ancak müze sayfalarını açmamıştır; konuşmacı sayısı belirtilmemiştir çünkü Etnoloji'de engellenmiştir."
  id: "Bagaimana tiga sistem Arab diklasifikasikan: Perpustakaan Kongres dalam ISO 639-2 adalah satu bahasa dengan kode ara, ISO 639-3 adalah bahasa utama dengan dua puluh delapan bahasa aktif individual, dan Etnologi 2026 masing-masing memiliki kategori bahasa sendiri dengan tabel kode. Halaman tersebut mengaitkan setiap klasifikasi dengan penulisnya dan tidak memilih di antara keduanya, dan sumbernya adalah ringkasan penelitian yang diserahkan oleh pendiri yang menyetujui penggunaannya pada 21 November 2026, tetapi museum tidak membuka halamannya; jumlah penutur tidak disebutkan karena diblokir dalam Etnologi."
