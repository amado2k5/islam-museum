summary:
  ar: "القردمانا في الكتاب شجرة تنبت بأرمينية والهند وبلاد العرب، حارة يابسة في الثالثة، مسخنة مذيبة تقوي الأعضاء الباطنة، تنفع من الجرب والقوباء وأمراض العصب والصرع والسعال والمغص والديدان وعسر البول ولدغ العقرب {cite:canon-ibn-sina-print-v1 p.643}"
  en: "Qardamana is in the book a tree growing in Armenia, India and Arabia, hot and dry in the third degree, heating and dissolving and strengthening the inner organs; it benefits itch, ringworm, diseases of the nerves, epilepsy, cough, colic, worms, difficulty of urine and the sting of the scorpion {cite:canon-ibn-sina-print-v1 p.643}"
  ur: "قردمانا کتاب میں ایک درخت ہے جو آرمینیہ، ہند اور عرب کے علاقوں میں اگتا ہے، تیسرے درجے میں گرم خشک، گرمی دینے والا اور گھلانے والا اور اندرونی اعضاء کو قوت دینے والا؛ خارش، قوباء، اعصاب کی بیماریوں، مرگی، کھانسی، مروڑ، کیڑوں، پیشاب کی دشواری اور بچھو کے ڈنک میں نافع ہے {cite:canon-ibn-sina-print-v1 p.643}۔"
