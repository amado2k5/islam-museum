label:
  ar: "قردمانا"
  en: "Qardamana (a tree drug of Armenia and India)"
  ur: "قردمانا"
  es: "Qardamana (una planta medicinal originaria de Armenia e India)"
  fr: "Qardamana (une drogue issue d'un arbre d'Arménie et d'Inde)"
summary:
  ar: "القردمانا في الكتاب شجرة تنبت بأرمينية والهند وبلاد العرب، حارة يابسة في الثالثة، مسخنة مذيبة تقوي الأعضاء الباطنة، تنفع من الجرب والقوباء وأمراض العصب والصرع والسعال والمغص والديدان وعسر البول ولدغ العقرب {cite:canon-ibn-sina-print-v1 p.643}"
  en: "Qardamana is in the book a tree growing in Armenia, India and Arabia, hot and dry in the third degree, heating and dissolving and strengthening the inner organs; it benefits itch, ringworm, diseases of the nerves, epilepsy, cough, colic, worms, difficulty of urine and the sting of the scorpion {cite:canon-ibn-sina-print-v1 p.643}"
  ur: "قردمانا کتاب میں ایک درخت ہے جو آرمینیہ، ہند اور عرب کے علاقوں میں اگتا ہے، تیسرے درجے میں گرم خشک، گرمی دینے والا اور گھلانے والا اور اندرونی اعضاء کو قوت دینے والا؛ خارش، قوباء، اعصاب کی بیماریوں، مرگی، کھانسی، مروڑ، کیڑوں، پیشاب کی دشواری اور بچھو کے ڈنک میں نافع ہے {cite:canon-ibn-sina-print-v1 p.643}۔"
  es: "En el libro, Qardamana es un árbol que crece en Armenia, India y Arabia, de naturaleza cálida y seca de tercer grado, que calienta, disuelve y fortalece los órganos internos; es beneficioso para la picazón, la tiña, las enfermedades de los nervios, la epilepsia, la tos, los cólicos, los parásitos intestinales, la dificultad para orinar y la picadura de escorpión {cite:canon-ibn-sina-print-v1 p.643}"
  fr: "Le qardamana est décrit dans le livre comme un arbre poussant en Arménie, en Inde et en Arabie, chaud et sec au troisième degré, réchauffant, dissolvant et fortifiant les organes internes; il est bénéfique en cas de démangeaisons, de teigne, de maladies nerveuses, d’épilepsie, de toux, de coliques, de vers intestinaux, de difficultés à uriner et de piqûres de scorpion {cite:canon-ibn-sina-print-v1 p.643}"
