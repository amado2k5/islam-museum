  es: "El nombre al-Jawza', Géminis, aparece en la lista de nombres de estrellas que proporciona la segunda tabla de estrellas fijas, en la página 277 impresa. Las posiciones de sus estrellas no se transcriben aquí. {cite:zij-sabi-nallino-byblion pp.277}"
