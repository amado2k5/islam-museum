id: concept/jawshir
class: concept
kind: natural
label:
  ar: "جاوشير"
  en: "Jawshir (the editor's cow's-milk tree)"
  ur: "جاوشیر ⁦(لبن البقر)⁩"
  es: "Jawshir (el árbol lechero del editor)"
  fr: "Jawshir (l'arbre à lait de vache du rédacteur)"
summary:
  ar: "شجرة ورقها قريب من الأرض وتُستخرج صمغتها من أصلها، وفي الهامش أنها لبن البقر؛ محلّل للرياح، ينفع من الصلابات والأورام والمفاصل والنقرس والصداع والصرع، ويذكر الكتاب فيها ما يخص الحيض والجنين {cite:canon-ibn-sina-print-v1 p.418} {cite:canon-ibn-sina-print-v1 p.419}."
  en: "A plant with leaves low to the ground, whose gum is drawn from its root; the editor's footnote calls it the cow's-milk tree. The book says it dissolves wind and helps hard swellings, joint pains, gout, headache and epilepsy. The book also lists its use for the menses and the foetus {cite:canon-ibn-sina-print-v1 p.418} {cite:canon-ibn-sina-print-v1 p.419}."
  ur: "ایک پودا جس کے پتے زمین کے قریب ہیں اور جس کی جڑ سے صمغ نکالا جاتا ہے؛ حاشیے کے مطابق یہ لبن البقر ہے۔ کتاب کے مطابق یہ ہوا کو تحلیل کرتا ہے اور سخت ورموں، جوڑوں کے درد، نقرس، سردرد اور مرگی میں مفید ہے۔ کتاب حیض اور جنین کے بارے میں بیانات بھی درج کرتی ہے {cite:canon-ibn-sina-print-v1 p.418} {cite:canon-ibn-sina-print-v1 p.419}۔"
  es: "Una planta de hojas bajas, cuya goma se extrae de su raíz; la nota al pie del editor la denomina árbol de la leche de vaca. El libro afirma que disuelve los gases y ayuda con hinchazones duras, dolores articulares, gota, dolor de cabeza y epilepsia. El libro también menciona su uso para la menstruación y el feto {cite:canon-ibn-sina-print-v1 p.418} {cite:canon-ibn-sina-print-v1 p.419}."
  fr: "Plante rampante dont on extrait la gomme de la racine; la note de l’éditeur la nomme « arbre à lait de vache ». Le livre indique qu’elle dissout les gaz et soulage les gonflements importants, les douleurs articulaires, la goutte, les maux de tête et l’épilepsie. Il mentionne également son usage pendant les menstruations et pour le fœtus {cite:canon-ibn-sina-print-v1 p.418} {cite:canon-ibn-sina-print-v1 p.419}."
