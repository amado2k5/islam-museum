id: concept/talab-al-halal
class: concept
kind: ethical
label:
  ar: "طلب الحلال وطيب المطعم"
  en: "Seeking the lawful and the purity of one's food"
  ur: "حلال کی طلب اور پاکیزہ روزی"
summary:
  ar: "يجمع هذا السجل ما ورد في طلب الحلال وطيب المطعم. تأمر الآيات بالأكل من الطيبات وشكر الله، منها [[passage/quran-2-168|البقرة 168]] {cite:tanzil-quran}. ويروي [[passage/muslim-1015|صحيح مسلم 1015]] أن الله طيب لا يقبل إلا طيباً، ويذكر رجلاً يمد يديه إلى السماء ومطعمه ومشربه وملبسه حرام وغُذي بالحرام فكيف يُستجاب له {cite:sahih-muslim 1015}. ويروي [[passage/bukhari-api-2059|صحيح البخاري 2059]] أن زماناً يأتي لا يبالي المرء فيه أمن حلال أخذ أم من حرام {cite:sahih-al-bukhari 2059}. وينقل الكاندهلوي عن ابن عباس أن الله كتب لكل أحد رزقه من الحلال وأن من جزع فأخذ الحرام نقصه الله من رزقه الحلال {cite:hayat-al-sahaba-kandahlawi-sabbani p.534}."
  en: "This record gathers what is recorded on seeking the lawful and the purity of one's food. The verses call to eat of the good things and to thank God, among them [[passage/quran-2-168|al-Baqara 168]] {cite:tanzil-quran}. [[passage/muslim-1015|Sahih Muslim 1015]] relates that God is pure and accepts only what is pure, and mentions a man raising his hands to the sky whose food, drink and clothing are forbidden and who was nourished on the forbidden, asking how he could be answered {cite:sahih-muslim 1015}. [[passage/bukhari-api-2059|Sahih al-Bukhari 2059]] relates that a time will come when a man will not care whether he took from the lawful or the forbidden {cite:sahih-al-bukhari 2059}. Al-Kandahlawi quotes Ibn 'Abbas that God wrote each person's provision from the lawful, and that whoever grows impatient and takes the forbidden has his lawful provision reduced {cite:hayat-al-sahaba-kandahlawi-sabbani p.534}."
  ur: "یہ اندراج حلال کی طلب اور پاکیزہ روزی کے بارے میں مذکور مواد جمع کرتا ہے۔ آیات پاکیزہ چیزیں کھانے اور اللہ کا شکر کرنے کا کہتی ہیں، جن میں [[passage/quran-2-168|البقرہ 168]] شامل ہے {cite:tanzil-quran}۔ [[passage/muslim-1015|صحیح مسلم 1015]] روایت کرتی ہے کہ اللہ پاک ہے اور صرف پاک چیز قبول کرتا ہے، اور ایک ایسے شخص کا ذکر کرتی ہے جو آسمان کی طرف ہاتھ اٹھاتا ہے جبکہ اس کا کھانا، پینا اور لباس حرام ہے اور پرورش حرام سے ہوئی، کہ اس کی دعا کیسے قبول ہو {cite:sahih-muslim 1015}۔ [[passage/bukhari-api-2059|صحیح بخاری 2059]] روایت کرتی ہے کہ ایک زمانہ آئے گا جب آدمی پروا نہیں کرے گا کہ حلال سے لیا یا حرام سے {cite:sahih-al-bukhari 2059}۔ کاندھلوی ابن عباس سے نقل کرتے ہیں کہ اللہ نے ہر ایک کا رزق حلال میں سے لکھا ہے اور جو بے صبری کر کے حرام لے اس کا حلال رزق کم کر دیا جاتا ہے {cite:hayat-al-sahaba-kandahlawi-sabbani p.534}۔"
