label:
  ar: "العُلُوق"
  en: "Conception and its effect on lineage and on a revocable divorce (ulluq)"
  ur: "علوق ⁦(حمل ٹھہرنا)⁩"
  es: "La concepción y su efecto en el linaje y en un divorcio revocable (ulluq)"
  fr: "La conception et son effet sur la lignée et sur un divorce révocable (ulluq)"
summary:
  ar: "العلوق في اللغة التعلق والنشوب، ويطلق عند الفقهاء على حصول الحمل، ويكون بالوطء أو الإنزال بجماع أو احتلام {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11801}. ويكون العلوق في الفراش سبباً لثبوت النسب، فإذا وطئ الرجل امرأته الممن يولد له ولا يشاركه أحد في وطئها، وولدت الولد في المدة المقررة للحمل، لحق الولد بالزوج باتفاق الفقهاء {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11802}. والمطلقة طلاقاً رجعياً يثبت نسب ما علقت به، ولو لأكثر من سنتين، لاحتمال امتداد طهرها وعلوقها، ويصير بالوطء الذي علقت منه مراجعة، وتكون الولادة دليل الرجعة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11802}. وللعلوق أثر في الوصية للحمل وفي الإرث بوقف نصيبه إلى وضعه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11802}."
  en: "In the lexicon, ulluq means clinging and lodging, and in the jurists' usage it is the occurrence of conception, by intercourse or by emission through intercourse or a dream {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11801}. Conception within a marriage bed establishes lineage: when a man, able to father children, has intercourse with his wife with no one else sharing it and she bears a child within the period of gestation, the child is attributed to him by agreement {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11802}. A woman under a revocable divorce is attributed the child she conceived even if the birth comes more than two years later, since her cleanliness and conception may have been delayed, and intercourse during the waiting period restores the marriage; birth is evidence of the return {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11802}. Conception also affects bequests to an unborn child and inheritance, where the share is held until the birth {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11802}."
  es: "En el léxico, ulluq significa aferrarse y alojarse, y en el uso de los juristas es la ocurrencia de la concepción, por coito o por emisión a través del coito o un sueño {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11801}. La concepción dentro del lecho conyugal establece el linaje: cuando un hombre, capaz de engendrar hijos, tiene coito con su esposa sin que nadie más lo comparta y ella da a luz un hijo dentro del período de gestación, el hijo se le atribuye por acuerdo {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11802}. A una mujer bajo un divorcio revocable se le atribuye el hijo que concibió incluso si el nacimiento ocurre más de dos años después, ya que su pureza y concepción pueden haberse retrasado, y el coito durante el período de espera restablece el matrimonio; El nacimiento es evidencia del retorno {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11802}. La concepción también afecta los legados a un hijo no nacido y la herencia, donde la parte se mantiene hasta el nacimiento {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11802}."
  fr: "Dans le lexique, « ulluq » signifie attachement et logement, et dans l'usage des juristes, il désigne la conception, que ce soit par rapport sexuel, par émission lors d'un rapport sexuel ou par un rêve {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11801}. La conception au sein du mariage établit la filiation: lorsqu'un homme, capable d'engendrer des enfants, a des rapports sexuels avec sa femme en toute intimité et qu'elle conçoit un enfant pendant la période de gestation, l'enfant lui est attribué par consentement mutuel {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11802}. Une femme ayant fait l'objet d'un divorce révocable se voit attribuer l'enfant qu'elle a conçu, même si la naissance survient plus de deux ans plus tard, car sa pureté et sa conception ont pu être retardées; les rapports sexuels pendant la période d'attente rétablissent le mariage; la naissance est une preuve de ce rétablissement {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11802}. La conception affecte également les legs à un enfant à naître et l'héritage, où la part est détenue jusqu'à la naissance {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11802}."
  ur: "لغت میں اُلْق کا مطلب لپٹنا اور قیام کرنا ہے، اور فقہاء کے نزدیک یہ حمل، جماع کے ذریعے یا جماع کے ذریعے اخراج یا خواب کا وقوع پذیر ہونا ہے۔ شادی کے بستر کے اندر حاملہ ہونے سے نسب قائم ہوتا ہے: جب ایک مرد، جو اولاد پیدا کرنے کے قابل ہو، اپنی بیوی کے ساتھ ہمبستری کرتا ہے اور اس میں کوئی شریک نہیں ہوتا ہے اور وہ حمل کی مدت میں بچہ پیدا کرتی ہے، تو معاہدہ کے ذریعہ بچہ اس کی طرف منسوب کیا جاتا ہے۔ رجعی طلاق کے تحت عورت کو اس بچے سے منسوب کیا جاتا ہے جو اس نے حاملہ کیا تھا خواہ اس کی پیدائش دو سال سے زیادہ بعد ہو، کیونکہ اس کی صفائی اور حمل میں تاخیر ہو سکتی ہے، اور عدت کے دوران جماع کرنے سے نکاح بحال ہو جاتا ہے۔ ولادت واپسی کا ثبوت ہے {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 11802}۔ تصور غیر پیدائشی بچے کی وصیت اور وراثت پر بھی اثر انداز ہوتا ہے، جہاں پیدائش تک حصہ رکھا جاتا ہے"
