label:
  ar: "العُلُوق"
  en: "Conception and its effect on lineage and on a revocable divorce (ulluq)"
  ur: "علوق (حمل ٹھہرنا)"
summary:
  ar: "العلوق في اللغة التعلق والنشوب، ويطلق عند الفقهاء على حصول الحمل، ويكون بالوطء أو الإنزال بجماع أو احتلام {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11801}. ويكون العلوق في الفراش سبباً لثبوت النسب، فإذا وطئ الرجل امرأته الممن يولد له ولا يشاركه أحد في وطئها، وولدت الولد في المدة المقررة للحمل، لحق الولد بالزوج باتفاق الفقهاء {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11802}. والمطلقة طلاقاً رجعياً يثبت نسب ما علقت به، ولو لأكثر من سنتين، لاحتمال امتداد طهرها وعلوقها، ويصير بالوطء الذي علقت منه مراجعة، وتكون الولادة دليل الرجعة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11802}. وللعلوق أثر في الوصية للحمل وفي الإرث بوقف نصيبه إلى وضعه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11802}."
  en: "In the lexicon, ulluq means clinging and lodging, and in the jurists' usage it is the occurrence of conception, by intercourse or by emission through intercourse or a dream {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11801}. Conception within a marriage bed establishes lineage: when a man, able to father children, has intercourse with his wife with no one else sharing it and she bears a child within the period of gestation, the child is attributed to him by agreement {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11802}. A woman under a revocable divorce is attributed the child she conceived even if the birth comes more than two years later, since her cleanliness and conception may have been delayed, and intercourse during the waiting period restores the marriage; birth is evidence of the return {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11802}. Conception also affects bequests to an unborn child and inheritance, where the share is held until the birth {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11802}."
