class: concept
kind: scientific
label: { ar: "ارتفاع الشمس نصف النهار في أي يوم في الزيج الصابي", en: "The Sun's noon altitude on any day", ur: "کسی بھی دن دوپہر کو سورج کا ارتفاع", es: "La altitud del Sol al mediodía en cualquier día", fr: "L'altitude du soleil à midi n'importe quel jour", tr: "Sabi Zij'e göre herhangi bir günde güneşin öğle vakti doğuşu.", id: "Waktu terbit matahari tengah hari pada hari tertentu menurut Sabi Zij." }
summary:
  ar: "الباب الخامس عشر في معرفة ارتفاع الشمس عند انتصاف النهار كل يوم: يعرف البتاني ميل الجزء الذي فيه الشمس، فينقصه من عرض البلد إن كان شمالياً ويزيده عليه إن كان جنوبياً، ثم ينقص الحاصل من تسعين. وإن كان الميل أكبر من العرض فالشمس شمال سمت الرؤوس. وله طريقة ثانية: تمام العرض هو ارتفاع أول الحمل، فيزاد عليه الميل الشمالي أو يُنقص منه الجنوبي. {cite:zij-sabi-nallino-byblion p.48}."
  en: "Chapter 15 treats the Sun's altitude at midday on any day: al-Battani finds the declination of the degree in which the Sun stands, subtracts it from the place's latitude if northern and adds it if southern, and subtracts the result from ninety. If the declination is larger than the latitude the Sun is north of the zenith. A second way: the latitude's complement is the altitude of the first of Aries, and northern declination is added to it, or southern declination subtracted. {cite:zij-sabi-nallino-byblion p.48}."
  ur: "پندرہواں باب ہر دن دوپہر کو سورج کے ارتفاع کے بارے میں ہے: البتانی اس جز کا میل معلوم کرتے ہیں جس میں سورج ہے، اسے شہر کے عرض سے گھٹاتے ہیں اگر شمالی ہو اور بڑھاتے ہیں اگر جنوبی، پھر حاصل کو نوے سے گھٹاتے ہیں۔ اگر میل عرض سے بڑا ہو تو سورج سمت الرؤوس کے شمال میں ہے۔ دوسرا طریقہ: عرض کا تتمہ حمل کے آغاز کا ارتفاع ہے جس پر شمالی میل بڑھایا یا جنوبی میل گھٹایا جاتا ہے۔ {cite:zij-sabi-nallino-byblion p.48}۔"
  es: "El capítulo 15 trata sobre la altitud del Sol al mediodía de cualquier día: al-Battani halla la declinación del grado en el que se encuentra el Sol, la resta de la latitud del lugar si es norte y la suma si es sur, y resta el resultado de noventa. Si la declinación es mayor que la latitud, el Sol está al norte del cenit. Un segundo método: el complemento de la latitud es la altitud del primer día de Aries, y se le suma la declinación norte o se le resta la declinación sur. {cite:zij-sabi-nallino-byblion p.48}."
  fr: "Le chapitre 15 traite de la hauteur du Soleil à midi: al-Battani calcule la déclinaison du degré auquel se trouve le Soleil, la soustrait de la latitude du lieu si elle est nord, et l'ajoute si elle est sud, puis soustrait le résultat de 90. Si la déclinaison est supérieure à la latitude, le Soleil est au nord du zénith. Une autre méthode consiste à calculer le complément de la latitude, soit la hauteur du premier signe du Bélier, auquel on ajoute la déclinaison nord, ou qu'on soustrait si elle est sud. {cite:zij-sabi-nallino-byblion p.48}."
  tr: "On Beşinci Bölüm: Her Gün Öğlen Güneşin Yüksekliğinin Belirlenmesi: El-Battani, güneşin bulunduğu Dünya'nın kısmının eğimini belirler. Bu eğimi, eğer kuzeydeyse bölgenin enleminden çıkarır, eğer güneydeyse ekler, sonra sonucu doksandan çıkarır. Eğer eğim enlemden büyükse, güneş zenitin kuzeyindedir. Ayrıca ikinci bir yöntemi de vardır: tam enlem, Koç burcunun başlangıcının yüksekliğidir ve buna kuzey eğimi eklenir veya güney eğimi çıkarılır. {cite:zij-sabi-nallino-byblion s.48}."
  id: "Bab Lima Belas: Menentukan Ketinggian Matahari pada Siang Hari Setiap Hari: Al-Battani menentukan kemiringan bagian Bumi tempat matahari berada. Ia mengurangi kemiringan ini dari garis lintang wilayah tersebut jika berada di utara dan menambahkannya jika berada di selatan, kemudian mengurangi hasilnya dari sembilan puluh. Jika kemiringan lebih besar dari garis lintang, maka matahari berada di utara zenit. Ia juga memiliki metode kedua: garis lintang penuh adalah ketinggian awal Aries, dan kemiringan utara ditambahkan padanya atau kemiringan selatan dikurangi darinya. {cite:zij-sabi-nallino-byblion p.48}."
