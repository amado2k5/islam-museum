summary:
  ar: "ما يستحسنه القارئ عند قراءته من استعاذة وتسمية وطهارة وخشوع وترتيل وإصغاء للقارئ وختم، كما تجمعه كتب الفقه والحديث {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
  en: "What is fitting for the reciter — the isti'adha, the basmala, purity, humility, measured recitation, listening to the one who recites and the khatm — as the books of fiqh and hadith gather it {cite:fiqh-mawsua-kuwaitiyya-noor-v3}."
