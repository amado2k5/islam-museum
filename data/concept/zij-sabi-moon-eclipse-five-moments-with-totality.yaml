label: { ar: "الأزمنة الثلاثة والخمسة في كسوف القمر", en: "The three and the five moments of a lunar eclipse", ur: "چاند گرہن کے تین اور پانچ لمحات", es: "Los tres y los cinco momentos de un eclipse lunar", fr: "Les trois et les cinq moments d'une éclipse lunaire", tr: "Ay tutulmasının üçüncü ve beşinci zamanları", id: "Gerhana bulan tiga dan lima kali" }
summary:
  ar: "إذا لم ينكسف القمر كله كان له في الكسوف ثلاثة أزمان: بدء الكسوف، ووسطه، وتمام الانجلاء. وكذلك إن انكسف كله ولم يكن له مكث. أما إذا كان له مكث فله خمسة أزمان، وهي الأزمنة الثلاثة مع بدء المكث وتمام الانجلاء المكثي. {cite:zij-sabi-nallino-byblion p.152}"
  en: "If the Moon is not totally eclipsed, the eclipse has three moments: the beginning, the middle and the end. The same is true of a total eclipse with no stay. If there is a stay the eclipse has five moments: the three already named together with the beginning of totality and the end of totality. {cite:zij-sabi-nallino-byblion p.152}"
  ur: "اگر چاند پورا گرہن زدہ نہ ہو تو گرہن کے تین لمحات ہیں: آغاز، وسط اور اختتام۔ یہی بات اس کلی گرہن کے لیے بھی ہے جس میں مکث نہ ہو۔ اگر مکث ہو تو پانچ لمحات ہوتے ہیں، یعنی وہی تین اور مکث کا آغاز اور مکث کا اختتام۔ {cite:zij-sabi-nallino-byblion p.152}"
  es: "Si la Luna no se eclipsa totalmente, el eclipse tiene tres momentos: el principio, el medio y el final. Lo mismo ocurre con un eclipse total sin periodo de transición. Si hay un periodo de transición, el eclipse tiene cinco momentos: los tres ya mencionados, junto con el principio de la totalidad y el final de la totalidad. {cite:zij-sabi-nallino-byblion p.152}"
  fr: "Si la Lune n'est pas totalement éclipsée, l'éclipse comporte trois phases: le début, le milieu et la fin. Il en va de même pour une éclipse totale sans interruption. En cas d'interruption, l'éclipse comporte cinq phases: les trois phases déjà mentionnées, auxquelles s'ajoutent le début de la totalité et la fin de la totalité. {cite:zij-sabi-nallino-byblion p.152}"
  tr: "Ay tamamen tutulmamışsa, tutulmanın üç dönemi vardır: başlangıç, orta ve son. Tamamen tutulmuş ancak süresi olmayan durumlarda da aynı şey geçerlidir. Ancak, bir süresi varsa, tutulmanın beş dönemi vardır: üç dönem, başlangıç, orta ve son. {cite:zij-sabi-nallino-byblion s.152}"
  id: "Jika bulan tidak tertutup sepenuhnya, gerhana memiliki tiga periode: awal, tengah, dan akhir. Hal yang sama berlaku jika gerhana terjadi sepenuhnya tetapi tidak memiliki durasi. Namun, jika memiliki durasi, gerhana memiliki lima periode: tiga periode, awal, tengah, dan akhir. {cite:zij-sabi-nallino-byblion p.152}"
