summary:
  ar: "إذا لم ينكسف القمر كله كان له في الكسوف ثلاثة أزمان: بدء الكسوف، ووسطه، وتمام الانجلاء. وكذلك إن انكسف كله ولم يكن له مكث. أما إذا كان له مكث فله خمسة أزمان، وهي الأزمنة الثلاثة مع بدء المكث وتمام الانجلاء المكثي. {cite:zij-sabi-nallino-byblion p.152}"
  en: "If the Moon is not totally eclipsed, the eclipse has three moments: the beginning, the middle and the end. The same is true of a total eclipse with no stay. If there is a stay the eclipse has five moments: the three already named together with the beginning of totality and the end of totality. {cite:zij-sabi-nallino-byblion p.152}"
  ur: "اگر چاند پورا گرہن زدہ نہ ہو تو گرہن کے تین لمحات ہیں: آغاز، وسط اور اختتام۔ یہی بات اس کلی گرہن کے لیے بھی ہے جس میں مکث نہ ہو۔ اگر مکث ہو تو پانچ لمحات ہوتے ہیں، یعنی وہی تین اور مکث کا آغاز اور مکث کا اختتام۔ {cite:zij-sabi-nallino-byblion p.152}"
