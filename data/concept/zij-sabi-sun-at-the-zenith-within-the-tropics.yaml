id: concept/zij-sabi-sun-at-the-zenith-within-the-tropics
class: concept
kind: scientific
label: { ar: "مرور الشمس على سمت الرؤوس داخل المدارين في الزيج الصابي", en: "The Sun at the zenith inside the tropics", ur: "مدارین کے اندر سورج کا سمت الرأس سے گزرنا", es: "El Sol en el cenit dentro de los trópicos" }
summary:
  ar: "يقول البتاني إن كل خط من الخطوط المتوازية يبعد عن معدل النهار أقل من الميل تجوز الشمس على سمت الرؤوس فيه في السنة مرتين، ويُعرف ذلك من جدول الميل وفي أي جزء من فلك البروج يكون. ويقع هذا حين يساوي ارتفاع القطب هناك ميل الدرجة التي فيها الشمس، فلا يكون لقائم ظل وقت الانتصاف يومئذ، ثم تتبدل جهة الظل قبل ذلك وبعده. {cite:zij-sabi-nallino-byblion pp.26-27}."
  en: "Al-Battani says that on every parallel whose distance from the equator is less than the obliquity the Sun passes the zenith twice a year, which is known from the declination table, together with the part of the zodiac where it happens. It occurs when the pole's altitude there equals the declination of the degree the Sun occupies, so an upright gnomon has no noon shadow that day, and the direction of the shadow changes before and after. {cite:zij-sabi-nallino-byblion pp.26-27}."
  ur: "البتانی کہتے ہیں کہ ہر متوازی خط جو معدل النہار سے میل کی مقدار سے کم دور ہو اس پر سورج سال میں دو بار سمت الرأس سے گزرتا ہے، اور یہ جدول المیل سے معلوم ہوتا ہے، نیز یہ بھی کہ فلک البروج کے کس حصے میں۔ ایسا اس وقت ہوتا ہے جب وہاں قطب کی بلندی اس درجے کے میل کے برابر ہو جس میں سورج ہے، تب دوپہر کو کھڑی شاخص کا سایہ نہیں ہوتا، اور اس سے پہلے اور بعد سائے کی سمت بدل جاتی ہے۔ {cite:zij-sabi-nallino-byblion pp.26-27}۔"
  es: "Al-Battani afirma que en cada paralelo cuya distancia al ecuador sea menor que la oblicuidad, el Sol pasa por el cenit dos veces al año, lo cual se conoce a partir de la tabla de declinaciones, junto con la parte del zodíaco donde ocurre. Esto sucede cuando la altitud del polo en ese punto es igual a la declinación del grado que ocupa el Sol, por lo que un gnomon erguido no tiene sombra al mediodía ese día, y la dirección de la sombra cambia antes y después. {cite:zij-sabi-nallino-byblion pp.26-27}."
