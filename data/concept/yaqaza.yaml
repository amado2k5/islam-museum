label: { ar: "اليقظة", en: "Awakening (yaqaza)", ur: "یقظہ ⁦(بیداری)⁩" }
summary:
  ar: "أول منازل السالكين عند ابن قيم الجوزية في مدارج السالكين، ويعرّفها بأنها «انزعاج القلب لروعة الانتباه من رقدة الغافلين»، ويشرح فيها قول الهروي في منازل السائرين إنها القومة لله، وإنها تقوم على لحظ النعمة، ومطالعة الجناية، ومعرفة الزيادة والنقصان من الأيام؛ وتتبعها عنده الفكرة ثم البصيرة ثم العزم."
  en: "The first of the wayfarers' stations for Ibn Qayyim al-Jawziyya in Madarij al-Salikin, defined as 'the heart's being startled by the shock of waking from the sleep of the heedless'. He comments on al-Harawi's words in Manazil al-Sa'irin that it is 'rising for God' and rests on regarding God's favour, considering one's offences, and recognising the gain and loss of one's days; it is followed by reflection, insight and resolve."
  ur: "مدارج السالکین میں ابن قیم الجوزیہ کے نزدیک سالکین کی پہلی منزل، جس کی تعریف وہ یوں کرتے ہیں: «غافلوں کی نیند سے چونکنے کے جھٹکے سے دل کا بے قرار ہونا»۔ وہ منازل السائرین میں ہروی کے اس قول کی شرح کرتے ہیں کہ یہ اللہ کے لیے اٹھ کھڑا ہونا ہے اور نعمت پر نظر، اپنے جرم کے مطالعے اور دنوں کے نفع و نقصان کی پہچان پر قائم ہے؛ اس کے بعد فکر، بصیرت اور عزم آتے ہیں۔"
