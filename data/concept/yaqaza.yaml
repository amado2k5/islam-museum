label: { ar: "اليقظة", en: "Awakening (yaqaza)", ur: "یقظہ ⁦(بیداری)⁩", es: "Despertar (yaqaza)", fr: "Éveil (yaqaza)" }
summary:
  ar: "أول منازل السالكين عند ابن قيم الجوزية في مدارج السالكين، ويعرّفها بأنها «انزعاج القلب لروعة الانتباه من رقدة الغافلين»، ويشرح فيها قول الهروي في منازل السائرين إنها القومة لله، وإنها تقوم على لحظ النعمة، ومطالعة الجناية، ومعرفة الزيادة والنقصان من الأيام؛ وتتبعها عنده الفكرة ثم البصيرة ثم العزم."
  en: "The first of the wayfarers' stations for Ibn Qayyim al-Jawziyya in Madarij al-Salikin, defined as 'the heart's being startled by the shock of waking from the sleep of the heedless'. He comments on al-Harawi's words in Manazil al-Sa'irin that it is 'rising for God' and rests on regarding God's favour, considering one's offences, and recognising the gain and loss of one's days; it is followed by reflection, insight and resolve."
  ur: "مدارج السالکین میں ابن قیم الجوزیہ کے نزدیک سالکین کی پہلی منزل، جس کی تعریف وہ یوں کرتے ہیں: «غافلوں کی نیند سے چونکنے کے جھٹکے سے دل کا بے قرار ہونا»۔ وہ منازل السائرین میں ہروی کے اس قول کی شرح کرتے ہیں کہ یہ اللہ کے لیے اٹھ کھڑا ہونا ہے اور نعمت پر نظر، اپنے جرم کے مطالعے اور دنوں کے نفع و نقصان کی پہچان پر قائم ہے؛ اس کے بعد فکر، بصیرت اور عزم آتے ہیں۔"
  es: "La primera de las estaciones del viajero, según Ibn Qayyim al-Jawziyya en Madarij al-Salikin, se define como «el sobresalto del corazón al despertar del sueño de los negligentes». Comenta las palabras de al-Harawi en Manazil al-Sa'irin, donde afirma que se trata de «levantarse para Dios» y se basa en considerar el favor divino, reflexionar sobre las propias faltas y reconocer las ganancias y pérdidas de los días; a esto le siguen la reflexión, la comprensión y la determinación."
  fr: "La première étape du cheminement spirituel, selon Ibn Qayyim al-Jawziyya dans Madarij al-Salikin, est définie comme « le sursaut du cœur provoqué par le réveil brutal après une longue torpeur ». Il commente les propos d'al-Harawi dans Manazil al-Sa'irin, qui la définissent comme « le réveil vers Dieu », et qui consiste à se souvenir de la grâce divine, à examiner ses fautes et à prendre conscience du gain et de la perte que représentent les jours passés; elle est suivie de réflexion, de discernement et de détermination."
