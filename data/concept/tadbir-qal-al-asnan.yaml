id: concept/tadbir-qal-al-asnan
class: concept
kind: scientific
label:
  ar: تدبير قلع الأسنان
  en: The regimen of drawing teeth
  ur: دانت اکھاڑنے کا تدبیر
  es: "El régimen de extracción de dientes"
  fr: "Le régime d'extraction des dents"
summary:
  ar: قد يتأدى أمر السن الوجعة إلى أن لا تقبل علاجاً البتة أو تكون كلما سكن ما يؤذيها عاد عن قريب ثم تكون مجاورتها لسائر الأسنان مضرة بها يعديها ما بها فلا يوجد إلى استصلاحها سبيل فيكون علاجها القلع، وقد يقلع بالكلبتين بعد كشط ما يحيط بأصلها عنها ⁦(محمول على أنه وصف الكتاب لا عملية)⁩، ويجب أن يتأمل قبل القلع هل العلة في نفس السن فإن لم تكن لم يجب أن تقلع حين يكون السبب في اللثة أو في العصبة التي تحت السن فإن القلع إن خفف الوجع قليلاً فليس يبطله بل يعود {cite:canon-ibn-sina-print-v2 p.277}
  en: An aching tooth may reach the point of accepting no treatment at all, or of the hurt returning soon whenever it calms, or its neighbourhood harms the other teeth by passing what it has — when no way of mending remains, its treatment is drawing, done with the forceps after scraping off what surrounds its root (carried as the book's description, not a procedure). Before drawing it must be examined whether the lesion is in the tooth itself; if not — the cause being in the gum or the nerve beneath — it must not be drawn, for drawing may lighten the pain a little but never ends it, and it returns {cite:canon-ibn-sina-print-v2 p.277}
  ur: درد والے دانت کا حال یہ ہو سکتا ہے کہ وہ بالکل علاج نہ مانے یا تکلیف سکون پاتے ہی پھر لوٹ آئے یا اس کا قرب باقی دانتوں کو نقصان دے اور اپنا دائرا انہیں سرایت کرائے — جب اصلاح کی کوئی راه نہ رہے تو علاج اکھاڑنا ہے، جو کلچی سے ہوتا ہے جڑ کے گرد کی چیز خرچنے کے بعد ⁦(کتاب کے وصف پر محمول، طریقہ نہیں)⁩؛ اکھاڑنے سے پہلے دیکھنا لازم ہے کہ علت خود دانت میں ہے یا نہیں؛ اگر نہیں — سبب مسوڑھے یا دانت کے نیچے کے اعصاب میں ہو — تو نہ اکھاڑی جائے، کیونکہ اکھاڑنا درد کچھ ہلکا کر بھی دے تو ختم نہیں کرتا بلکہ وہ لوٹتا ہے {cite:canon-ibn-sina-print-v2 p.277}
  es: "Un diente dolorido puede llegar al punto de no tolerar ningún tratamiento, o de que el dolor reaparezca en cuanto se calme, o de que su zona afectada dañe a los demás dientes al pasar por encima de la raíz. Cuando no queda otra opción, el tratamiento consiste en la extracción, que se realiza con fórceps tras raspar la corteza que rodea la raíz (descripción del libro, no procedimiento). Antes de extraer el diente, debe examinarse si la lesión se encuentra en el propio diente; si no es así —si la causa está en la encía o en el nervio subyacente— no debe extraerse, pues la extracción puede aliviar un poco el dolor, pero nunca lo elimina por completo, y este reaparece. {cite:canon-ibn-sina-print-v2 p.277}"
  fr: "Une dent douloureuse peut devenir si insupportable qu'on refuse tout traitement, ou bien la douleur revient dès qu'elle s'apaise, ou encore les dents voisines peuvent se détériorer en transmettant les tissus endommagés. Lorsqu'il n'existe plus d'espoir de guérison, le traitement consiste en l'extraction, réalisée à l'aide de forceps après avoir gratté la muqueuse autour de la racine (il s'agit d'une description du livre, et non d'une procédure). Avant l'extraction, il faut vérifier si la lésion se situe dans la dent elle-même; si ce n'est pas le cas – la cause se trouvant dans la gencive ou le nerf sous-jacent – il ne faut pas extraire la dent, car l'extraction peut certes soulager légèrement la douleur, mais ne la fait jamais disparaître, et elle revient. {cite:canon-ibn-sina-print-v2 p.277}"
