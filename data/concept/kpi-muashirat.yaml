id: concept/kpi-muashirat
class: concept
kind: term
label:
  ar: "مؤشرات الأداء الرئيسية (KPI)"
  en: "Key performance indicators (KPI)"
  ur: "کلیدی کارکردگی اشاریے (KPI)"
summary:
  ar: "مؤشر الأداء الرئيسي عند طارق السويدان هو الحد الأدنى المقبول لهدف في مجال معين؛ يوضع لكل وحدة مستقلة ولوحدة مساندة، بين ثلاثة وعشرة مؤشرات، صعباً لكن ممكناً، وقابلاً للقياس حتماً، ويتفق عليه بالتفاوض مع قيادة الوحدة."
  en: "A key performance indicator, as Tareq al-Suwaidan teaches it, is the minimum acceptable level of a goal in a given field; it is set for every independent and support unit, between three and ten indicators, difficult yet achievable, necessarily measurable, and agreed by negotiation with the unit's leadership."
  ur: "کلیدی کارکردگی اشاریہ، طارق السویدان کی تعلیم کے مطابق، کسی میدان میں ایک ہدف کی کم از کم قابلِ قبول سطح ہے؛ یہ ہر آزاد اور معاون اکائی کے لیے طے ہوتا ہے، تین سے دس اشاریوں کے درمیان، مشکل مگر ممکن، ضروری طور پر قابلِ پیمائش، اور اکائی کی قیادت کے ساتھ مذاکرات سے طے ہوتا ہے۔"
