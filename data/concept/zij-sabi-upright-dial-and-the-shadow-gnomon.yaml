label: { ar: "الرخامة القائمة والشاخص الذي يحجب الظل", en: "The upright dial and the gnomon that casts the shadow", ur: "قائم رخامہ اور سایہ ڈالنے والا شاخص", es: "El reloj de sol y el gnomon que proyecta la sombra" }
summary:
  ar: "تُتخذ رخامة واسعة مربعة مستطيلة، وتُرسم على وجهها دائرة يُقسم محيطها بخطين متقاطعين على زوايا قائمة، ويُجعل الخط الأطول في طول الرخامة خط ما بين المشرق والمغرب، والخط الأقصر خط ما بين الشمال والجنوب، ويُرسم عليه خط نصف النهار، ويُكتب على أطراف الخطوط جهات الآفاق. ويُعد ابتداء السمت من المشرق والمغرب، ويُقسم كل ربع بثلاثين جزءاً. ويُثبت مخروط صغير في المركز ويُعد الظل عليه بالساعات. {cite:zij-sabi-nallino-byblion pp.211-212}"
  en: "A wide square-and-oblong marble is taken and a circle drawn on its face, the rim being divided by two lines at right angles. The longer line along the marble is the east-west line and the shorter the north-south line, on which the noon line is drawn, and the horizon directions are written at the ends of the lines. The count of azimuth starts from east and west, each quarter divided into thirty parts. A small cone is fixed at the centre and the shadow is read on it by the hours. {cite:zij-sabi-nallino-byblion pp.211-212}"
  ur: "ایک چوڑی مربع-مستطیل سنگ مرمر کی تختی لی جاتی ہے، اس کے رخ پر دائرہ کھینچا جاتا ہے جس کا کنارہ دو قائمہ زاویہ خطوط سے تقسیم ہوتا ہے۔ تختی کی لمبائی کے ساتھ والا لمبا خط مشرق اور مغرب کا خط ہے اور چھوٹا شمال اور جنوب کا، جس پر خطِ نصف النہار کھینچا جاتا ہے، اور خطوط کے کناروں پر افق کی سمتیں لکھی جاتی ہیں۔ سمت کی گنتی مشرق اور مغرب سے شروع ہوتی ہے، اور ہر ربع تیس اجزا میں بٹتا ہے۔ مرکز میں ایک چھوٹا مخروط نصب کیا جاتا ہے اور سایہ اس پر ساعتوں کے حساب سے پڑھا جاتا ہے۔ {cite:zij-sabi-nallino-byblion pp.211-212}"
  es: "Se toma una canica ancha, cuadrada y oblonga, y se dibuja un círculo en su superficie, dividiendo el borde con dos líneas perpendiculares. La línea más larga a lo largo de la canica es la línea este-oeste y la más corta la línea norte-sur, sobre la cual se traza la línea del mediodía, y en los extremos de las líneas se escriben las direcciones del horizonte. El cálculo del acimut comienza desde el este y el oeste, dividiendo cada cuarto en treinta partes. Se fija un pequeño cono en el centro y se lee la sombra proyectada sobre él según las horas. {cite:zij-sabi-nallino-byblion pp.211-212}"
