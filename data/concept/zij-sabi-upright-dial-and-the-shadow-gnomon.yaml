id: concept/zij-sabi-upright-dial-and-the-shadow-gnomon
class: concept
kind: scientific
label: { ar: "الرخامة القائمة والشاخص الذي يحجب الظل", en: "The upright dial and the gnomon that casts the shadow", ur: "قائم رخامہ اور سایہ ڈالنے والا شاخص", es: "El reloj de sol y el gnomon que proyecta la sombra", fr: "Le cadran vertical et le gnomon qui projette l'ombre", tr: "Ayakta duran mermer heykel ve gölgeyi engelleyen sütun", id: "Patung marmer yang berdiri tegak dan pilar yang menghalangi bayangan." }
summary:
  ar: "تُتخذ رخامة واسعة مربعة مستطيلة، وتُرسم على وجهها دائرة يُقسم محيطها بخطين متقاطعين على زوايا قائمة، ويُجعل الخط الأطول في طول الرخامة خط ما بين المشرق والمغرب، والخط الأقصر خط ما بين الشمال والجنوب، ويُرسم عليه خط نصف النهار، ويُكتب على أطراف الخطوط جهات الآفاق. ويُعد ابتداء السمت من المشرق والمغرب، ويُقسم كل ربع بثلاثين جزءاً. ويُثبت مخروط صغير في المركز ويُعد الظل عليه بالساعات. {cite:zij-sabi-nallino-byblion pp.211-212}"
  en: "A wide square-and-oblong marble is taken and a circle drawn on its face, the rim being divided by two lines at right angles. The longer line along the marble is the east-west line and the shorter the north-south line, on which the noon line is drawn, and the horizon directions are written at the ends of the lines. The count of azimuth starts from east and west, each quarter divided into thirty parts. A small cone is fixed at the centre and the shadow is read on it by the hours. {cite:zij-sabi-nallino-byblion pp.211-212}"
  ur: "ایک چوڑی مربع-مستطیل سنگ مرمر کی تختی لی جاتی ہے، اس کے رخ پر دائرہ کھینچا جاتا ہے جس کا کنارہ دو قائمہ زاویہ خطوط سے تقسیم ہوتا ہے۔ تختی کی لمبائی کے ساتھ والا لمبا خط مشرق اور مغرب کا خط ہے اور چھوٹا شمال اور جنوب کا، جس پر خطِ نصف النہار کھینچا جاتا ہے، اور خطوط کے کناروں پر افق کی سمتیں لکھی جاتی ہیں۔ سمت کی گنتی مشرق اور مغرب سے شروع ہوتی ہے، اور ہر ربع تیس اجزا میں بٹتا ہے۔ مرکز میں ایک چھوٹا مخروط نصب کیا جاتا ہے اور سایہ اس پر ساعتوں کے حساب سے پڑھا جاتا ہے۔ {cite:zij-sabi-nallino-byblion pp.211-212}"
  es: "Se toma una canica ancha, cuadrada y oblonga, y se dibuja un círculo en su superficie, dividiendo el borde con dos líneas perpendiculares. La línea más larga a lo largo de la canica es la línea este-oeste y la más corta la línea norte-sur, sobre la cual se traza la línea del mediodía, y en los extremos de las líneas se escriben las direcciones del horizonte. El cálculo del acimut comienza desde el este y el oeste, dividiendo cada cuarto en treinta partes. Se fija un pequeño cono en el centro y se lee la sombra proyectada sobre él según las horas. {cite:zij-sabi-nallino-byblion pp.211-212}"
  fr: "On prend une large plaque de marbre carrée et oblongue, sur laquelle on trace un cercle. Le bord est divisé par deux lignes perpendiculaires. La plus longue est l'axe est-ouest, la plus courte l'axe nord-sud, sur lequel on trace la ligne du midi. Les points cardinaux sont inscrits à l'extrémité de ces lignes. Le calcul de l'azimut commence à l'est et à l'ouest, chaque quart d'heure étant divisé en trente parties. Un petit cône est placé au centre et l'ombre projetée dessus permet de lire les heures. {cite:zij-sabi-nallino-byblion pp.211-212}"
  tr: "Büyük, dikdörtgen bir mermer levha kullanılır ve yüzeyine bir daire çizilir. Bu dairenin çevresi, dik açılarla kesişen iki çizgiyle bölünür. Levhanın uzunluğu boyunca uzanan daha uzun çizgiye doğu-batı çizgisi, daha kısa çizgiye ise kuzey-güney çizgisi denir. Bu çizgi üzerine meridyen çizgisi çizilir ve çizgilerin uçlarına ana yönler yazılır. Zenit doğu ve batıdan hesaplanır ve her çeyrek otuz parçaya bölünür. Merkeze küçük bir koni yerleştirilir ve üzerine düşen gölge saat cinsinden ölçülür. {cite:zij-sabi-nallino-byblion pp.211-212}"
  id: "Sebuah lempengan marmer persegi panjang besar digunakan, dan sebuah lingkaran digambar di permukaannya. Keliling lingkaran ini dibagi oleh dua garis yang berpotongan tegak lurus. Garis yang lebih panjang di sepanjang lempengan tersebut ditetapkan sebagai garis timur-barat, dan garis yang lebih pendek sebagai garis utara-selatan. Garis meridian digambar pada garis ini, dan arah mata angin ditulis di ujung garis. Zenit dihitung dari timur dan barat, dan setiap seperempat bagian dibagi menjadi tiga puluh bagian. Sebuah kerucut kecil dipasang di tengah, dan bayangan yang jatuh padanya diukur dalam jam. {cite:zij-sabi-nallino-byblion pp.211-212}"
