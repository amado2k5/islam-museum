  ur: "موم"
  es: "Mamá (cera)"
  fr: "Maman (cire)"
  tr: "mum"
  id: "lilin"
summary:
  ar: "الموم الصافي جدران بيوت النحل والأسود وسخ كوائرها، معتدل، مليّن يملأ القروح وسخاً، مادة المراهم، والأسود يجذب الشوك والسلاء من العمق {cite:canon-ibn-sina-print-v1 p.562}."
  en: "Pure wax is the walls of the bees' cells and black wax the dirt of their hives; it is balanced and softening, fills ulcers with dirt and is the base of ointments, and the black draws splinters and thorns from the depth {cite:canon-ibn-sina-print-v1 p.562}."
  ur: "خالص موم مکھیوں کے چھتوں کی دیواریں ہے اور سیاہ موم ان کے چھتے کی میل؛ معتدل، نرم کرنے والی، زخموں کو میل سے بھرتی اور مرہموں کی بنیاد ہے، اور سیاہ موم کانٹوں اور پھانسوں کو گہرائی سے کھینچتی ہے {cite:canon-ibn-sina-print-v1 p.562}۔"
  es: "La cera pura son las paredes de las celdas de las abejas y la cera negra la suciedad de sus colmenas; es equilibrada y suavizante, rellena las úlceras con suciedad y es la base de los ungüentos, y la negra extrae astillas y espinas de las profundidades {cite:canon-ibn-sina-print-v1 p.562}."
  fr: "La cire pure constitue les parois des cellules des abeilles et la cire noire la saleté de leurs ruches; elle est équilibrée et adoucissante, remplit les ulcères de saleté et est la base des onguents, et la noire extrait les échardes et les épines des profondeurs {cite:canon-ibn-sina-print-v1 p.562}."
  tr: "Arı kovanı duvarlarına ve siyah topraklara yapılan saf mum, kovanları yumuşatır ve toprak, merhem ile dolar ve siyah derinliklerden diken ve dikenleri çeker {cite:canon-ibn-sina-print-v1 s.562}."
  id: "Lilin murni di dinding sarang lebah dan tanah hitam yang lembut melembutkan luka dan diisi dengan tanah, salep, dan hitam menarik duri dan duri dari kedalaman {cite:canon-ibn-sina-print-v1 hlm.562}."
