summary:
  ar: "يوصي ابن سينا الأصحاء بمراعاة النوم في اعتدال ووقته وباتقاء ضرر السهر، ويذكر أن أفضل النوم الغرق بعد انحدار الطعام من البطن الأعلى وسكون النفخ، وأن النوم على الخواء أو على الامتلاء قبل الانحدار رديء {cite:canon-ibn-sina-print-v1 p.241}."
  en: "Ibn Sina urges the healthy to watch their sleep, keeping it in measure and in its time, and to guard against the harm of wakefulness; the best sleep, he says, is deep and comes after the food has gone down from the upper belly and the bloating has settled, while sleeping on emptiness or on fullness before the descent is poor {cite:canon-ibn-sina-print-v1 p.241}."
