id: concept/canon-sleep-timing-and-the-fear-of-sleeplessness
class: concept
kind: scientific
label:
  ar: "وقت النوم وضرر السهر عند ابن سينا"
  en: "The timing of sleep and the harm of wakefulness in the Canon"
  fr: "Moment du sommeil et dommages de la veille dans le Canon"
  ur: "نیند کا وقت اور بے خوابی کا ضرر قانون میں"
  es: "El momento del sueño y el daño de la vigilia en el Canon"
  tr: "İbn Sina'ya göre yatma vakti ve geç saatlere kadar uyanık kalmanın zararı"
  id: "Waktu tidur dan bahaya begadang menurut Ibn Sina"
summary:
  ar: "يوصي ابن سينا الأصحاء بمراعاة النوم في اعتدال ووقته وباتقاء ضرر السهر، ويذكر أن أفضل النوم الغرق بعد انحدار الطعام من البطن الأعلى وسكون النفخ، وأن النوم على الخواء أو على الامتلاء قبل الانحدار رديء {cite:canon-ibn-sina-print-v1 p.241}."
  en: "Ibn Sina urges the healthy to watch their sleep, keeping it in measure and in its time, and to guard against the harm of wakefulness; the best sleep, he says, is deep and comes after the food has gone down from the upper belly and the bloating has settled, while sleeping on emptiness or on fullness before the descent is poor {cite:canon-ibn-sina-print-v1 p.241}."
  fr: "Ibn Sina invite le bien-portant à mesurer et placer son sommeil, en évitant les dommages de la veille. Le meilleur serait profond, après descente des aliments du haut-ventre et apaisement du ballonnement ; à jeun ou rassasié avant descente, il serait mauvais {cite:canon-ibn-sina-print-v1 p.241}."
  es: "Ibn Sina insta a las personas sanas a vigilar su sueño, manteniéndolo en la medida y en su tiempo, y a protegerse del daño de la vigilia; el mejor sueño, dice, es profundo y se produce después de que la comida haya bajado de la parte superior del abdomen y la hinchazón se haya estabilizado, mientras que dormir con el estómago vacío o lleno antes del descenso es malo {cite:canon-ibn-sina-print-v1 p.241}."
  ur: "ابن سینا صحت مندوں پر زور دیتا ہے کہ وہ اپنی نیند کا خیال رکھیں، اسے اپنے وقت کے مطابق رکھیں، اور بیداری کے نقصانات سے بچیں؛ وہ کہتا ہے کہ بہترین نیند گہری ہوتی ہے اور پیٹ کے اوپری حصے سے کھانا اترنے اور اپھارہ ختم ہونے کے بعد آتی ہے، جب کہ خالی پن یا پرپورن حالت میں سونا اس سے پہلے کہ نزول نہ ہو {حوالہ: کینون ابن سینا پرنٹ v1 صفحہ 241}۔"
  tr: "İbn Sina, sağlıklı insanların ölçülü ve doğru zamanında uyumalarını ve geç saatlere kadar uyanık kalmanın zararlarından kaçınmalarını önerir. En iyi uykunun, yiyecek üst karından kaydıktan ve şişkinlik dindikten sonra boğulmak olduğunu, eğimden önce boşluk veya toklukta uyumanın kötü olduğunu belirtir {cite:canon-ibn-sina-print-v1 s.241}."
  id: "Ibn Sina menyarankan agar orang sehat tidur dengan cukup dan pada waktu yang tepat serta menghindari bahaya begadang larut. Ia menyebutkan bahwa tidur terbaik adalah tenggelam setelah makanan turun dari perut atas dan kembung mereda, serta tidur dengan kekosongan atau kenyang sebelum lereng adalah buruk {cite:canon-ibn-sina-print-v1 hlm.241}."
