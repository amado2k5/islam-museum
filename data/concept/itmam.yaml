id: concept/itmam
class: concept
kind: legal
label: { ar: "إتمام", en: "Completion (itmam)", es: "Finalización (itmam)", fr: "Achèvement (itmam)", ur: "تکمیل ⁦(اتمام)⁩", tr: "Tamamlanma", id: "Penyelesaian" }
summary:
  ar: "الإتمام في اللغة الإكمال، ولم يضع الفقهاء له تعريفاً اصطلاحياً يخرج عن معناه اللغوي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1504} وللإتمام إطلاق خاص يتعلق بالعدد لا بالكيفية، كإتمام الصلاة بدلاً من قصرها في السفر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1504} وإتمام ما شُرع فيه من طاعة واجبة واجب بإجماع الفقهاء، أما إتمام النافلة فمختلف فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1505}"
  en: "Itmam in the lexicon means completion. Jurists gave it no technical definition beyond the lexical one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1504} It has one specific use, which concerns number rather than manner: completing a prayer instead of shortening it on a journey. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1504} Completing an obligatory act once begun is obligatory by the agreement of the jurists; completing a voluntary act is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1505}"
  es: "En el léxico, Itmam significa culminación. Los juristas no le dieron una definición técnica más allá de la léxica. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1504} Tiene un uso específico, que concierne al número más que a la forma: completar una oración en lugar de acortarla durante un viaje. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1504} Completar un acto obligatorio una vez iniciado es obligatorio por acuerdo de los juristas; completar un acto voluntario es objeto de controversia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1505}"
  fr: "Dans le lexique, « itmam » signifie « achèvement ». Les juristes ne lui ont donné aucune définition technique autre que le sens lexical. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1504} Il a un usage spécifique, qui concerne le nombre plutôt que la manière: terminer une prière au lieu de l’abréger lors d’un voyage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1504} L’achèvement d’un acte obligatoire une fois commencé est obligatoire de l’avis des juristes; l’achèvement d’un acte volontaire fait débat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1505}"
  ur: "لغت میں اتمام سے مراد تکمیل ہے۔ فقہا نے اسے لغت سے آگے کوئی تکنیکی تعریف نہیں دی۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 1504} اس کا ایک مخصوص استعمال ہے، جس کا تعلق انداز کے بجائے تعداد سے ہے: سفر میں نماز قصر کرنے کے بجائے مکمل کرنا۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 1504} ایک بار شروع ہونے والے فرض کو پورا کرنا فقہاء کے اتفاق سے واجب ہے۔ رضاکارانہ عمل کو مکمل کرنا متنازعہ ہے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 صفحہ 1505}"
  tr: "Dilde tamamlanma tamamlanmadır ve hukukçular bunu teknik olarak dilsel anlamının ötesinde tanımlamamışlardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1504} Tamamlanma, sayıyla ilgili özel bir terim taşır; örneğin seyahat sırasında duanın kısaltılması yerine tamamlanması gibi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1504} Ve zorunlu itaatle yasalaştırılanları tamamlamak hukukçular tarafından oybirliğiyle kabul edilirken, gönüllü işlemleri tamamlamak tartışmalıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1505}"
  id: "Penyelesaian dalam bahasa adalah penyelesaian, dan para ahli hukum belum mendefinisikannya secara teknis di luar makna linguistiknya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1504} Penyelesaian memiliki istilah khusus yang berkaitan dengan jumlah, bukan kualitas, seperti menyelesaikan doa daripada mempersingkatnya selama perjalanan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1504} Dan menyelesaikan apa yang diatur dalam ketaatan wajib disepakati secara bulat oleh para ahli hukum, sementara menyelesaikan tindakan sukarela masih diperdebatkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1505}"
