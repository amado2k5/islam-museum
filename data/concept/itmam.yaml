label: { ar: "إتمام", en: "Completion (itmam)" }
summary:
  ar: "الإتمام في اللغة الإكمال، ولم يضع الفقهاء له تعريفاً اصطلاحياً يخرج عن معناه اللغوي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1504} وللإتمام إطلاق خاص يتعلق بالعدد لا بالكيفية، كإتمام الصلاة بدلاً من قصرها في السفر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1504} وإتمام ما شُرع فيه من طاعة واجبة واجب بإجماع الفقهاء، أما إتمام النافلة فمختلف فيه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1505}"
  en: "Itmam in the lexicon means completion. Jurists gave it no technical definition beyond the lexical one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1504} It has one specific use, which concerns number rather than manner: completing a prayer instead of shortening it on a journey. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1504} Completing an obligatory act once begun is obligatory by the agreement of the jurists; completing a voluntary act is disputed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1505}"
