label: { ar: "أقل ما قيل", en: "Aqal ma qila (the least of what was said)" }
summary:
  ar: "أقل ما قيل أصل أصولي: إذا اختلف الصحابة في مقدار على أقوال أُخذ بأقلها ما لم يدل دليل على الزيادة، كاختلافهم في دية اليهودي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3232} ويقابله الأخذ بأكثر ما قيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3232} وأثبته الشافعي والباقلاني، ونفاه ابن حزم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3232}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3233}"
  en: "Aqal ma qila is a usuli principle: when the companions differ on an amount with several sayings, the least is taken unless evidence points to more; the example is the blood-money of a Jew. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3232} The opposite is to take the most. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3232} al-Shafi'i and al-Baqillani hold it valid; Ibn Hazm denies it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3232}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3233}"
