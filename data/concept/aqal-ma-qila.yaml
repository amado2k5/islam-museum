label: { ar: "أقل ما قيل", en: "Aqal ma qila (the least of what was said)", fr: "Aqal ma qila (le moindre des avis exprimés)", es: "Aqal ma qila (lo menos importante de lo que se dijo)", ur: "اقال ما قیلہ ⁦(سب سے کم جو کہا گیا)⁩", tr: "en hafif tabirle", id: "setidaknya," }
summary:
  ar: "أقل ما قيل أصل أصولي: إذا اختلف الصحابة في مقدار على أقوال أُخذ بأقلها ما لم يدل دليل على الزيادة، كاختلافهم في دية اليهودي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3232} ويقابله الأخذ بأكثر ما قيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3232} وأثبته الشافعي والباقلاني، ونفاه ابن حزم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3232}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3233}"
  en: "Aqal ma qila is a usuli principle: when the companions differ on an amount with several sayings, the least is taken unless evidence points to more; the example is the blood-money of a Jew. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3232} The opposite is to take the most. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3232} al-Shafi'i and al-Baqillani hold it valid; Ibn Hazm denies it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3232}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3233}"
  fr: "Aqal ma qila est un principe d’usul : lorsque les Compagnons divergent sur un montant en donnant plusieurs avis, on retient le moindre, à moins qu’une preuve n’indique davantage ; l’exemple est le prix du sang d’un juif. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3232} Le contraire est de retenir le plus élevé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3232} Al-Shafi’i et al-Baqillani le tiennent pour valable ; Ibn Hazm le rejette. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3232}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3233}"
  es: "Aqal ma qila es un principio usuli: cuando los compañeros difieren en una cantidad con varias opiniones, se toma la menor a menos que la evidencia indique una mayor; el ejemplo es la indemnización por la muerte de un judío. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3232} Lo contrario es tomar la mayor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3232} Al-Shafi'i y Al-Baqillani lo consideran válido; Ibn Hazm lo niega. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3232}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3233}"
  ur: "اقل ما قیلہ ایک اصولی اصول ہے: جب صحابہ متعدد اقوال کے ساتھ رقم پر اختلاف کرتے ہیں تو کم سے کم لیا جاتا ہے جب تک کہ ثبوت زیادہ کی طرف اشارہ نہ کرے۔ مثال ایک یہودی کے خون کی رقم ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3232} اس کے برعکس سب سے زیادہ لینا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص3232} شافعی اور البقلانی اسے صحیح قرار دیتے ہیں۔ ابن حزم اس کی تردید کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3232}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3233}"
  tr: "Söylenen en az şey temel bir ilkedir: Sahabeler belirli bir görüşte farklılık gösteriyorsa, bir Yahudi kan parası konusunda anlaşmazlıkları gibi artışa dair kanıt olmadıkça asgari puanı alırlar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3232} Söylenenlerin çoğuna karşılık gelir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3232} Al-Shafi'i ve Al-Baqillani tarafından onaylandı, İbn Hazm ise bunu reddetti. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3232}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3233}"
  id: "Yang paling sedikit dikatakan adalah prinsip dasar: Jika Para Sahabat berbeda pendapat tertentu, mereka mengambil yang minimum kecuali ada bukti kenaikan itu, seperti ketidaksepakatan mereka tentang uang darah seorang Yahudi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3232} Sesuai dengan sebagian besar yang telah dikatakan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3232} ditegaskan oleh Al-Shafi'i dan Al-Baqillani, dan Ibn Hazm menyangkalnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3232} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3233}"
