perspectives:
  - tradition: sunni-maliki
    id: maliki-hanbali-allow-agency
    summary:
      ar: "يجوز عند المالكية والحنابلة التوكيل في إحراز المباحات بأجر أو بغير أجر، وكذلك الشركة، ويجوز عند الشافعية في الأظهر {cite:usul-iqtisad-islami-0660 p. 249} {cite:usul-iqtisad-islami-0660 p. 236}."
    sources: [source/usul-iqtisad-islami-0660]
  - tradition: sunni-hanafi
    id: hanafi-no-agency
    summary:
      ar: "يمنع الحنفية التوكيل في تملك المباحات كإحياء الموات وسقاية الماء والاصطياد والاحتشاش واستخراج المعادن، فما يحصل عليه الوكيل له وليس للموكل منه شيء {cite:usul-iqtisad-islami-0660 p. 236}."
    sources: [source/usul-iqtisad-islami-0660]
  - tradition: shia-twelver
    id: sadr-no-hire-free-goods
    summary:
      ar: "يرى الصدر أن الإجارة في تحصيل المباحات كالاحتطاب والاحتشاش والاصطياد غير جائزة، وأن الوكالة فيها غير جائزة ولو بلا أجر، وهو مذهب الإمامية والحنفية {cite:usul-iqtisad-islami-0660 p. 248} {cite:usul-iqtisad-islami-0660 p. 249}."
    sources: [source/usul-iqtisad-islami-0660]
