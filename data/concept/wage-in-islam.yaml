id: concept/wage-in-islam
class: concept
kind: legal
label:
  ar: "أجر العمل والرزق"
  en: "Wage and rizq in Islam"
issue:
  ar: "هل يجوز للدولة أو للعامل أن يتملك المباح بالوكالة بأجر، وهل يجمع العامل بين الأجر والحصة من الربح؟"
summary:
  ar: "الأجر عند المؤلف قد يكون أجراً لمال (الكراء) أو لعمل، وقد يكون على الزمن أو على الوحدة المنتجة (الجعالة) {cite:usul-iqtisad-islami-0660 p. 244} {cite:usul-iqtisad-islami-0660 p. 245}. والرزق أجر تدفعه الدولة من بيت المال، ويُبنى على الحاجة والكفاية {cite:usul-iqtisad-islami-0660 p. 248}. ويجوز أن ينال العامل أجره مقطوعاً أو حصة من الربح أو الناتج {cite:usul-iqtisad-islami-0660 p. 247}، ويرى المؤلف جواز الجمع بين الأجر والحصة {cite:usul-iqtisad-islami-0660 p. 252}. وقد يحدد ولي الأمر حداً أدنى للأجر، ويرى أن الكفاية ليست من مهام التوزيع القائم على العمل {cite:usul-iqtisad-islami-0660 p. 246} {cite:usul-iqtisad-islami-0660 p. 257}."
wings: [ideas]
themes:
- the-poor-and-the-worker
- trade-and-finance
regions:
