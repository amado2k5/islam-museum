id: concept/wage-in-islam
class: concept
kind: legal
tags: [islamic-economy-browser, islamic-economy-money]
label:
  ar: "أجر العمل والرزق"
  en: "Wage and rizq in Islam"
  es: "Salario y sustento en el Islam"
  fr: "Salaire et rizq en Islam"
  ur: "اسلام میں اجرت اور رزق"
  tr: "ücretler ve geçim kaynakları"
  id: "upah dan mata pencaharian"
issue:
  ar: "هل يجوز للدولة أو للعامل أن يتملك المباح بالوكالة بأجر، وهل يجمع العامل بين الأجر والحصة من الربح؟"
summary:
  ar: "الأجر عند المؤلف قد يكون أجراً لمال ⁦(الكراء)⁩ أو لعمل، وقد يكون على الزمن أو على الوحدة المنتجة ⁦(الجعالة)⁩ {cite:usul-iqtisad-islami-0660 p. 244} {cite:usul-iqtisad-islami-0660 p. 245}. والرزق أجر تدفعه الدولة من بيت المال، ويُبنى على الحاجة والكفاية {cite:usul-iqtisad-islami-0660 p. 248}. ويجوز أن ينال العامل أجره مقطوعاً أو حصة من الربح أو الناتج {cite:usul-iqtisad-islami-0660 p. 247}، ويرى المؤلف جواز الجمع بين الأجر والحصة {cite:usul-iqtisad-islami-0660 p. 252}. وقد يحدد ولي الأمر حداً أدنى للأجر، ويرى أن الكفاية ليست من مهام التوزيع القائم على العمل {cite:usul-iqtisad-islami-0660 p. 246} {cite:usul-iqtisad-islami-0660 p. 257}."
  tr: "Yazarın ücreti, para (kira) veya iş için ücret, zaman veya üretim birimi (ücretler) için ücret olabilir {cite:usul-iqtisad-islami-0660 s. 244} {cite:usul-iqtisad-islami-0660 s. 245}. Geçim, devlet tarafından kamu hazinesinden ödenen ücrettir, ihtiyaç ve yeterliliğe göre {cite:usul-iqtisad-islami-0660 s. 248}. Bir işçi sabit bir ücret veya kâr ya da çıktı payı alabilir {cite:usul-iqtisad-islami-0660 s. 247} ve yazar ücret ile payın birleştirilmesini uygun bulur {cite:usul-iqtisad-islami-0660 s. 252}. Vasi, asgari ücret belirleyebilir ve yeterliliğin iş temelli dağıtım görevinin bir parçası olmadığını görebilir {cite:usul-iqtisad-islami-0660 s. 246} {cite:usul-iqtisad-islami-0660 s. 257}."
  id: "Upah penulis bisa berupa upah untuk uang (sewa) atau kerja, atau untuk waktu atau unit produksi (upah) {cite:usul-iqtisad-islami-0660 hlm. 244} {cite:usul-iqtisad-islami-0660 hlm. 245}. Kebutuhan hidup adalah upah yang dibayarkan oleh negara dari kas negara, berdasarkan kebutuhan dan kecukupan {cite:usul-iqtisad-islami-0660 hlm. 248}. Seorang pekerja dapat menerima upah tetap atau bagian dari keuntungan atau output {cite:usul-iqtisad-islami-0660 hlm. 247}, dan penulis menganggap diperbolehkan menggabungkan upah dan bagian {cite:usul-iqtisad-islami-0660 hlm. 252}. Penjaga dapat menetapkan upah minimum dan memastikan bahwa kecukupan bukan bagian dari tugas distribusi berbasis kerja {cite:usul-iqtisad-islami-0660 hlm. 246} {cite:usul-iqtisad-islami-0660 hlm. 257}."
