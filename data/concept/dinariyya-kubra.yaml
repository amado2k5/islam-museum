label:
  ar: "الدينارية الكبرى"
  en: "al-Dinariyya al-Kubra (the greater Dinar case in inheritance)"
  ur: "دیناریہ کبریٰ (وراثت کا ایک مشہور مسئلہ)"
summary:
  ar: "الدينارية الكبرى مسألة من المسائل الملقبات في المواريث، صورتها انحصار الإرث في زوجة، وأم أو جدة، وبنتين، واثني عشر أخا، وأخت واحدة، والتركة ستمائة دينار، فيأخذ كل من الورثة نصيبه، وتعدل المسألة من أربعة وعشرين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8363} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8364} ولها ألقاب أخرى هي الركابية والشاكية والداودية والعامرية، ولكل لقب قصة في نسبتها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8363} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8364}"
  en: "The Greater Dinar is another named problem in inheritance: the heirs are a wife, a mother or grandmother, two daughters, twelve brothers and one sister, the estate six hundred dinars; the case is a just one from twenty-four. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8363} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8364} Other names are al-Rakabiyya, al-Shakiyya, al-Dawudiyya and al-Amiriyya, each tied to an anecdote about a judge or a jurist who divided the estate. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8363} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8364}"
  ur: "دیناریہ کبریٰ وراثت کا ایک مشہور مسئلہ ہے جس میں بیوی، ماں یا دادی، دو بیٹیاں، بارہ بھائی اور ایک بہن وارث ہیں۔ اس کی اصل چوبیس ہے، اور اس کے کئی القاب ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8363} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8364}"
