label: { ar: "ابن الابن", en: "Son's son (grandson in the male line)" }
summary:
  ar: "تعرّف الموسوعة الفقهية الكويتية ابن الابن بأنه الذكر من أول فرع للابن في النسب والرضاع، وعند الإطلاق ينصرف إلى النسب، ويقال له حفيد، ويطلق الابن عليه مجازاً، وكذا على ابن ابن الابن وإن نزل. وأجمع الفقهاء على أنه من العصبات، يحجبه الابن الأعلى ويحجب من دونه، ويعصّب من يحاذيه من أخواته وبنات أعمامه، ويعصّب من فوقه من عماته إن لم يكن لهن من فرض البنات شيء. واختلفوا في ولايته لجدته في النكاح، فالجمهور على أن له هذه الولاية، وخالف الشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1458} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1459}"
  en: "The Kuwaiti encyclopedia defines a son's son as the male first descendant of a son, by blood or by fostering; when used without qualification the word means the blood relation. He is called a grandson (hafid), and the word son is used of him figuratively, and likewise of a son's son's son however far down. The jurists agree that he is an agnate: the higher son excludes him, and he excludes those below him. He makes agnates of his sisters and of his paternal female cousins who stand level with him, and he makes agnate those above him among his paternal aunts when they have no fixed share as daughters. The jurists differ on whether he may contract his grandmother in marriage: the majority say he may, and the Shafi'is disagree. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1458} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1459}"
