label: { ar: "ابن الابن", en: "Son's son (grandson in the male line)", es: "Hijo del hijo (nieto por línea paterna)", fr: "Fils de fils (petit-fils en ligne masculine)" }
summary:
  ar: "تعرّف الموسوعة الفقهية الكويتية ابن الابن بأنه الذكر من أول فرع للابن في النسب والرضاع، وعند الإطلاق ينصرف إلى النسب، ويقال له حفيد، ويطلق الابن عليه مجازاً، وكذا على ابن ابن الابن وإن نزل. وأجمع الفقهاء على أنه من العصبات، يحجبه الابن الأعلى ويحجب من دونه، ويعصّب من يحاذيه من أخواته وبنات أعمامه، ويعصّب من فوقه من عماته إن لم يكن لهن من فرض البنات شيء. واختلفوا في ولايته لجدته في النكاح، فالجمهور على أن له هذه الولاية، وخالف الشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1458} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1459}"
  en: "The Kuwaiti encyclopedia defines a son's son as the male first descendant of a son, by blood or by fostering; when used without qualification the word means the blood relation. He is called a grandson (hafid), and the word son is used of him figuratively, and likewise of a son's son's son however far down. The jurists agree that he is an agnate: the higher son excludes him, and he excludes those below him. He makes agnates of his sisters and of his paternal female cousins who stand level with him, and he makes agnate those above him among his paternal aunts when they have no fixed share as daughters. The jurists differ on whether he may contract his grandmother in marriage: the majority say he may, and the Shafi'is disagree. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1458} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1459}"
  es: "La enciclopedia kuwaití define al hijo de un hijo como el primer descendiente varón de un hijo, ya sea por consanguinidad o por crianza; cuando se usa sin especificación, la palabra significa parentesco consanguíneo. Se le llama nieto (hafid), y la palabra hijo se usa para referirse a él en sentido figurado, y también al hijo del hijo de un hijo, sin importar el grado de parentesco. Los juristas coinciden en que es un agnado: el hijo mayor lo excluye, y él excluye a los que están por debajo de él. Hace agnadas a sus hermanas y a sus primas paternas que están a su mismo nivel, y hace agnadas a las que están por encima de él entre sus tías paternas cuando no tienen una parte fija como hijas. Los juristas difieren en cuanto a si puede contraer matrimonio con su abuela: la mayoría dice que sí, y los shafiíes discrepan. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1458} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1459}"
  fr: "L'encyclopédie koweïtienne définit le fils d'un fils comme le premier descendant mâle d'un fils, par le sang ou par adoption; employé sans autre précision, le terme désigne le lien de parenté par le sang. Il est appelé petit-fils (hafid), et le mot « fils » est utilisé pour le désigner au sens figuré, de même que pour le fils du fils d'un fils, quel que soit son degré de parenté. Les juristes s'accordent à dire qu'il est un agnat: le fils aîné l'exclut, et il exclut ceux qui lui sont inférieurs. Il établit comme agnats ses sœurs et ses cousines paternelles de même rang que lui, ainsi que les tantes paternelles qui lui sont supérieures lorsqu'elles n'ont pas de part successorale fixe en tant que filles. Les juristes divergent quant à la possibilité pour lui d'épouser sa grand-mère: la majorité l'autorise, tandis que les chaféites sont d'un avis contraire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1458} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1459}"
