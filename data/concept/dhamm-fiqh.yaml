id: concept/dhamm-fiqh
class: concept
kind: legal
label:
  ar: "الذم ⁦(في الفقه)⁩"
  en: "Blame and reproach (dhamm) in the rulings"
  ur: "مذمت اور ملامت ⁦(فقہی احکام)⁩"
  es: "Culpa y reproche (dhamm) en los fallos"
  fr: "Blâme et reproche (dhamm) dans les décisions"
summary:
  ar: "الذم خلاف المدح، ويكون بإلحاق الأذى بالغير كالقذف والسب والتعيير، وتدخل فيه أحكام الحد والتعزير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8478} وذم الله ورسوله كفر، وإيذاء المؤمنين بالأقوال القبيحة حرام، ونهى الشرع عن السخرية والهمز واللمز والتنابز بالألقاب، واستثنى الفقهاء تلقيب الشخص بما غلب عليه من صفة لا يعاب بها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8479} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8480} وذم المبتدعين مطلوب، وذم المعاصي والكفار والمنافقين وارد في الشرع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8480} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8481}"
  en: "Dhamm is the opposite of praise; in the rulings it is harm done to another, such as slander, abuse and insult, and it carries the hadd or discretionary penalties. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8478} Blaming God or His Messenger is disbelief, and cruel speech against believers is forbidden; the law forbids mockery, sneering, and calling people by insulting nicknames, while the jurists allow a nickname that describes an unavoidable trait without disparagement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8479} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8480} Blaming innovators is sought, and blaming sins, disbelievers and hypocrites is found in the law. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8480} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8481}"
  ur: "ذم تعریف کے برخلاف ہے اور فقہاء کے نزدیک دوسرے کو اذیت دینے کو کہتے ہیں، جیسے قذف اور گالی، جس پر حد یا تعزیر ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8478} اللہ یا اس کے رسول کی مذمت کفر ہے، جبکہ مومنین کو بری باتوں سے ایذا حرام ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8479}"
  es: "Dhamm es lo opuesto a la alabanza; en las normas es el daño causado a otro, como la calumnia, el abuso y el insulto, y conlleva el hadd o las penas discrecionales. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8478} Culpar a Dios o a Su Mensajero es incredulidad, y el discurso cruel contra los creyentes está prohibido; la ley prohíbe la burla, el escarnio y llamar a las personas con apodos insultantes, mientras que los juristas permiten un apodo que describa un rasgo inevitable sin menospreciar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8479} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8480} Culpar a los innovadores es buscado, y culpar a los pecados, a los incrédulos y a los hipócritas se encuentra en la ley. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8480} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8481}"
  fr: "Le dhamm est l'opposé de la louange; selon les règles, il s'agit du préjudice causé à autrui, tel que la calomnie, l'injure et l'insulte, et il est passible de la peine discrétionnaire du hadd. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8478} Blâmer Dieu ou Son Messager est considéré comme de l'incroyance, et les paroles cruelles envers les croyants sont interdites; la loi interdit la moquerie, les railleries et le fait d'appeler les gens par des surnoms injurieux, tandis que les juristes autorisent un surnom qui décrit un trait inévitable sans être dénigrant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8479} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8480} Il est recommandé de blâmer les innovateurs, et la loi autorise de blâmer les péchés, les mécréants et les hypocrites. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8480} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8481}"
