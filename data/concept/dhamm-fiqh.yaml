id: concept/dhamm-fiqh
class: concept
kind: legal
label:
  ar: "الذم (في الفقه)"
  en: "Blame and reproach (dhamm) in the rulings"
  ur: "مذمت اور ملامت (فقہی احکام)"
summary:
  ar: "الذم خلاف المدح، ويكون بإلحاق الأذى بالغير كالقذف والسب والتعيير، وتدخل فيه أحكام الحد والتعزير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8478} وذم الله ورسوله كفر، وإيذاء المؤمنين بالأقوال القبيحة حرام، ونهى الشرع عن السخرية والهمز واللمز والتنابز بالألقاب، واستثنى الفقهاء تلقيب الشخص بما غلب عليه من صفة لا يعاب بها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8479} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8480} وذم المبتدعين مطلوب، وذم المعاصي والكفار والمنافقين وارد في الشرع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8480} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8481}"
  en: "Dhamm is the opposite of praise; in the rulings it is harm done to another, such as slander, abuse and insult, and it carries the hadd or discretionary penalties. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8478} Blaming God or His Messenger is disbelief, and cruel speech against believers is forbidden; the law forbids mockery, sneering, and calling people by insulting nicknames, while the jurists allow a nickname that describes an unavoidable trait without disparagement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8479} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8480} Blaming innovators is sought, and blaming sins, disbelievers and hypocrites is found in the law. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8480} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8481}"
  ur: "ذم تعریف کے برخلاف ہے اور فقہاء کے نزدیک دوسرے کو اذیت دینے کو کہتے ہیں، جیسے قذف اور گالی، جس پر حد یا تعزیر ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8478} اللہ یا اس کے رسول کی مذمت کفر ہے، جبکہ مومنین کو بری باتوں سے ایذا حرام ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8479}"
