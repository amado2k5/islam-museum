label:
  ar: "التدخين"
  en: "Smoking"
  ur: "تمباکو نوشی"
summary:
  ar: "يرى عمر عبد الكافي أن رمضان فرصة لترك التدخين لمن امتنع عنه من الفجر إلى المغرب، وأن المدخن الميسور من المبذرين والفقير سفيه، ويستدل بأن أحدًا لا يتصدق بسيجارة لوجه الله؛ وهذا رأيه."
  en: "Omar Abdelkafy holds that Ramadan is a chance to give up smoking for one who abstains from dawn to sunset, that a well-off smoker is a squanderer and a poor one foolish, arguing that no one gives a cigarette in charity for God's sake; this is his view."
  ur: "عمر عبد الکافی کے نزدیک رمضان اس شخص کے لیے تمباکو نوشی چھوڑنے کا موقع ہے جو فجر سے مغرب تک رک جاتا ہے، خوشحال سگریٹ نوش فضول خرچ اور غریب نادان ہے، اور دلیل دیتے ہیں کہ کوئی اللہ کے لیے سگریٹ صدقہ نہیں کرتا؛ یہ ان کی رائے ہے۔"
