id: concept/ahl-al-nasab
tags: ["ansab-browser", "ansab-curated"]
class: concept
kind: legal
label: { ar: "أهل النسب", en: "Ahl al-Nasab (the kin by descent, and who counts as kin in bequests and endowments)", fr: "Ahl al-Nasab (la parenté par filiation et les parents pris en compte dans les legs et les fondations)", es: "Ahl al-Nasab (los parientes por descendencia, que se consideran parientes en legados y donaciones)", ur: "اہل الناسب ⁦(نسل کے لحاظ سے رشتہ دار، اور جو وصیت اور وصیت میں رشتہ داروں میں شمار ہوتا ہے)⁩" }
summary:
  ar: "الأهل في الأصل أهل البيت والقرابة، وأهل الرجل أخص الناس به وعشيرته، والنسب القرابة، وهو الاشتراك من جهة الأب، وقيل من جهة الأبوين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3645} والفقهاء يعتبرون النسب ما كان من جهة الأب فقط، فالأولاد ينسبون لآبائهم لا لأمهاتهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3645} فمن أوصى لأهل نسبه أو وقف على من ينتسب إليه، فهم الذين ينتسبون إليه من جهة الأب، ولا يدخل فيهم أولاد البنات عند الشافعية والحنابلة، بقوله تعالى في سورة الأحزاب ⁦(الآية 5)⁩. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3645}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3646} وقد يُعد ولد البنت داخلا عند المالكية في قول، والشافعية إذا كان الواقف امرأة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3646}"
  en: "Ahl in origin means the household and kin; the ahl of a man are those closest to him and his clan; nasab means kinship, which is common through one parent or, on another view, through both. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3645} For the jurists nasab is kinship through the father only: children are called after their fathers, not their mothers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3645} Thus a bequest to the kin of a man, or an endowment to those who are called after him, goes to those who trace descent through the father; the Shafi'is and Hanbalis exclude the children of daughters, on the Qur'anic phrase that they are to be called after their fathers (sura al-Ahzab, 33:5). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3645}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3646} The Malikis count the children of daughters in one view, and the Shafi'is do so where the one who makes the endowment is a woman. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3646}"
  fr: "À l’origine, ahl désigne le foyer et la parenté. Les ahl d’un homme sont ses proches et son clan. Nasab désigne la parenté, établie par l’un des parents ou, selon un autre avis, par les deux. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3645} Pour les juristes, le nasab est la seule parenté paternelle : les enfants portent le nom de leur père et non celui de leur mère. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3645} Ainsi, un legs aux parents d’un homme ou une fondation en faveur de ceux qui portent son nom revient aux parents par la lignée paternelle. Se fondant sur le passage du Coran selon lequel les enfants doivent être appelés du nom de leur père (sourate al-Ahzab, 33:5), les chaféites et les hanbalites en excluent les enfants des filles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3645}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3646} Les malikites les incluent selon un avis, de même que les chaféites lorsque la fondation est instituée par une femme. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3646}"
  es: "Ahl en origen significa la familia y los parientes; el ahl de un hombre son aquellos más cercanos a él y a su clan; nasab significa parentesco, que es común a través de un padre o, según otra interpretación, a través de ambos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3645} Para los juristas, nasab es el parentesco solo a través del padre: los hijos son llamados como sus padres, no como sus madres. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3645} Así, un legado a los parientes de un hombre, o una dotación a aquellos que son llamados como él, va a aquellos que trazan la descendencia a través del padre; los shafi'is y hanbalis excluyen a los hijos de hijas, en la frase coránica de que deben ser llamados como sus padres (sura al-Ahzab, 33:5). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3645}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3646} Los malikíes cuentan a los hijos de las hijas en una interpretación, y los shafi'íes hacen lo mismo cuando quien realiza la donación es una mujer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3646}"
  ur: "اہل اصل کا مطلب خاندان اور رشتہ دار ہے۔ آدمی کے اہل وہ ہوتے ہیں جو اس کے اور اس کے قبیلے کے قریب ہوتے ہیں۔ نسب کا مطلب ہے قرابت داری جو کہ ایک ماں باپ کے ذریعے عام ہے یا دوسرے قول میں دونوں کے ذریعے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 3645} فقہاء کے نزدیک نسب صرف باپ کے ذریعے رشتہ داری ہے: اولاد کو اپنے باپ کے نام سے پکارا جاتا ہے نہ کہ ان کی ماؤں کے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 3645} اس طرح مرد کے رشتہ داروں کے لیے وصیت یا اس کے بعد بلائے جانے والوں کے لیے وصیت ان لوگوں کو جاتی ہے جو باپ کے ذریعے نزول کا پتہ لگاتے ہیں۔ شافعی اور حنبلی بیٹیوں کے بچوں کو قرآن کے اس فقرے پر چھوڑ دیتے ہیں کہ انہیں اپنے باپ کے نام سے پکارا جائے ⁦(سورۃ الاحزاب، 33:5)⁩۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3645}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3646} مالکی بیٹیوں کے بچوں کو ایک نظر میں شمار کرتے ہیں اور شافعی ایسا کرتے ہیں جہاں وقف کرنے والی عورت ہو۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 صفحہ 3646}"
