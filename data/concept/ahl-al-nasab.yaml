id: concept/ahl-al-nasab
class: concept
kind: legal
label: { ar: "أهل النسب", en: "Ahl al-Nasab (the kin by descent, and who counts as kin in bequests and endowments)" }
summary:
  ar: "الأهل في الأصل أهل البيت والقرابة، وأهل الرجل أخص الناس به وعشيرته، والنسب القرابة، وهو الاشتراك من جهة الأب، وقيل من جهة الأبوين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3645} والفقهاء يعتبرون النسب ما كان من جهة الأب فقط، فالأولاد ينسبون لآبائهم لا لأمهاتهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3645} فمن أوصى لأهل نسبه أو وقف على من ينتسب إليه، فهم الذين ينتسبون إليه من جهة الأب، ولا يدخل فيهم أولاد البنات عند الشافعية والحنابلة، بقوله تعالى في سورة الأحزاب (الآية 5). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3645}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3646} وقد يُعد ولد البنت داخلا عند المالكية في قول، والشافعية إذا كان الواقف امرأة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3646}"
  en: "Ahl in origin means the household and kin; the ahl of a man are those closest to him and his clan; nasab means kinship, which is common through one parent or, on another view, through both. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3645} For the jurists nasab is kinship through the father only: children are called after their fathers, not their mothers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3645} Thus a bequest to the kin of a man, or an endowment to those who are called after him, goes to those who trace descent through the father; the Shafi'is and Hanbalis exclude the children of daughters, on the Qur'anic phrase that they are to be called after their fathers (sura al-Ahzab, 33:5). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3645}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3646} The Malikis count the children of daughters in one view, and the Shafi'is do so where the one who makes the endowment is a woman. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3646}"
