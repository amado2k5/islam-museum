summary:
  ar: "الكبابة قوتها شبيهة بالفوة إلا أنها ألطف، وتُجلب من الصين، وهي عند الكتاب حارة يابسة إلى الثانية، مفتحة لطيفة، وتنفع من القروح العفنة والقلاع العفن وتفتيح سدد الكبد، وفيها ذكر لأثر في المنكوحة موسوم."
  en: "Kababa is like the fuwa spice but finer, and is brought from China. The book classes it as hot and dry in the second degree, opening and fine. It helps septic ulcers and foul thrush, and opens obstructions of the liver. The book also has a labelled listing about its effect on a sexual partner."
  ur: "کبابہ کی قوت فوہ جیسی ہے مگر زیادہ باریک، اور یہ چین سے لایا جاتا ہے۔ کتاب اسے دوسرے درجے میں گرم اور خشک اور کھولنے والا باریک بتاتی ہے۔ یہ گلے ہوئے زخموں، بدبودار منہ کی چھالوں اور جگر کی رکاوٹیں کھولنے میں مفید ہے۔ کتاب میں اس کے ایک جنسی ساتھی پر اثر کا نشان زد بیان بھی ہے۔"
  es: "El kababa es similar a la especia fuwa, pero más fino, y proviene de China. El libro lo clasifica como picante y seco de segundo grado, de acción penetrante y delicada. Ayuda a tratar úlceras sépticas y candidiasis oral, y desbloquea las obstrucciones hepáticas. El libro también incluye una lista con información sobre sus efectos en la pareja sexual."
