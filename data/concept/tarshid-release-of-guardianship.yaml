id: concept/tarshid-release-of-guardianship
class: concept
kind: legal
label:
  ar: "الترشيد"
  en: "Tarshid (release from guardianship after proof of sound judgement)"
  ur: "ترشید ⁦(سرپرستی سے رہائی، رشد ثابت ہونے پر)⁩"
  es: "Tarshid (liberación de la tutela tras demostrar buen juicio)"
  fr: "Tarshid (libération de la tutelle après preuve de discernement sain)"
  tr: "rasyonalizasyon"
  id: "Rasionalisasi"
summary:
  ar: "الترشيد رفع الحجر عن الصغير بعد اختباره، ويكون الرشد بالصلاح في المال عند الحنفية والمالكية والحنابلة، وبالصلاح في الدين والمال عند الشافعية. ويجوز اختبار الصبي بالتجارة، وفي وقت الاختبار خلاف، والاختبار واجب عند الحنابلة والشافعية. ويختلف الحكم في الترشيد باختلاف الولي والذكر والأنثى، ولا لفظ معين له عند غير المالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4964} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4965} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4966}"
  en: "Tarshid is lifting restraint from a minor after testing him. Sound judgement means soundness in property for the Hanafis, Malikis and Hanbalis, and soundness in religion and property for the Shafi'is. A minor may be tested in trade, the time of the test is disputed, and the test is obligatory for the Shafi'is and Hanbalis. The rule varies by guardian, sex and case, and no particular words are required except in Maliki usage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4964} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4965} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4966}"
  es: "Tarshid levanta la restricción impuesta a un menor tras ponerlo a prueba. Para los hanafíes, malikíes y hanbalíes, el juicio sano implica solidez en los bienes, mientras que para los shafiíes significa solidez en la religión y los bienes. Un menor puede ser puesto a prueba en el comercio; el momento de la prueba es objeto de debate, y esta es obligatoria para los shafiíes y hanbalíes. La norma varía según el tutor, el sexo y el caso, y no se requieren palabras específicas, salvo en el uso malikí. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4964} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4965} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4966}"
  fr: "Tarshid lève la contrainte imposée à un mineur après l'avoir mis à l'épreuve. Pour les hanafites, les malikites et les hanbalites, un jugement sain signifie une bonne gestion des biens; pour les chaféites, il s'agit d'une bonne gestion religieuse et patrimoniale. Un mineur peut être mis à l'épreuve dans le cadre d'un commerce; le moment de cette mise à l'épreuve fait débat, et elle est obligatoire pour les chaféites et les hanbalites. La règle varie selon le tuteur, le sexe et le cas, et aucune formulation particulière n'est requise, sauf dans l'usage malikite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4964} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4965} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4966}"
  ur: "ترشید ایک نابالغ کی جانچ کے بعد اس سے تحمل کو ہٹا رہا ہے۔ صحیح فیصلے سے مراد حنفیہ، مالکیوں اور حنبلیوں کے لیے جائیداد میں درستگی اور شافعیوں کے لیے مذہب اور جائیداد میں درستگی ہے۔ تجارت میں نابالغ کا امتحان لیا جا سکتا ہے، امتحان کے وقت میں اختلاف ہے، اور شافعیہ اور حنبلیوں کے نزدیک امتحان واجب ہے۔ قاعدہ سرپرست، جنس اور صورت کے لحاظ سے مختلف ہوتا ہے، اور مالکی کے استعمال کے علاوہ کسی خاص الفاظ کی ضرورت نہیں ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 4964} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 4965}"
  tr: "Rehberlik, vasi bir çocuktan sınavdan sonra kaldırılmasıdır; doğru yaş, Hanefi, Maliki ve Hanbali'ye göre sağlam maddi duruma, Şafiilere göre ise din ve zenginlikte sağlam bir duruma dayanır. Bir çocuğun ticaretle test edilmesi caizdir, ancak sınav zamanı konusunda anlaşmazlık vardır ve Hanbali ile Şafiilere göre test zorunludur. Rehber hakkı, vasiye göre değişir; erkek veya kadın, Maliki olmayanlar arasında bunun için özel bir ifade yoktur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4964} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4965} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4966}"
  id: "Bimbingan adalah mengangkat wali dari anak di bawah umur setelah pengujian, dan usia yang tepat didasarkan pada status keuangan yang sehat menurut Hanafi, Maliki, dan Hanbali, serta sehat dalam agama dan kekayaan menurut Shafi'i. Diperbolehkan menguji anak melalui perdagangan, tetapi ada perbedaan pendapat mengenai waktu ujian, dan pengujian wajib menurut Hanbalis dan Syafi'i. Keputusan tentang bimbingan bervariasi tergantung pada wali, laki-laki, atau perempuan, dan tidak ada kata-kata khusus untuk itu di antara non-Maliki. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4964} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4965} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4966}"
