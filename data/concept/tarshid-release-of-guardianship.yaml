  ur: "ترشید (سرپرستی سے رہائی، رشد ثابت ہونے پر)"
summary:
  ar: "الترشيد رفع الحجر عن الصغير بعد اختباره، ويكون الرشد بالصلاح في المال عند الحنفية والمالكية والحنابلة، وبالصلاح في الدين والمال عند الشافعية. ويجوز اختبار الصبي بالتجارة، وفي وقت الاختبار خلاف، والاختبار واجب عند الحنابلة والشافعية. ويختلف الحكم في الترشيد باختلاف الولي والذكر والأنثى، ولا لفظ معين له عند غير المالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4964} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4965} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4966}"
  en: "Tarshid is lifting restraint from a minor after testing him. Sound judgement means soundness in property for the Hanafis, Malikis and Hanbalis, and soundness in religion and property for the Shafi'is. A minor may be tested in trade, the time of the test is disputed, and the test is obligatory for the Shafi'is and Hanbalis. The rule varies by guardian, sex and case, and no particular words are required except in Maliki usage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4964} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4965} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4966}"
