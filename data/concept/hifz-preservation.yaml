label: { ar: "الحفظ", en: "Preservation and memorising (hifz)", ur: "حفظ (یاد رکھنا اور محفوظ رکھنا)" }
summary:
  ar: "الحفظ في اللغة المنع من الضياع والتلف، ويأتي بمعنى التعاهد وقلة الغفلة، كحفظ القرآن عن ظهر قلب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7135} وحفظ الفاتحة في الصلاة واجب على من يستطيع، وإن عجز تعلمها أو قرأها من مصحف؛ والشافعية والحنابلة يوجبون قراءتها في كل ركعة، والحنفية يوجبون حفظ آية طويلة أو ثلاث آيات قصار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7136} وتقديم الأفقه للإمامة عند الجمهور، وتقديم الأقرأ والأحفظ عند الحنابلة والشافعية في مقابل الأصح، لقوله: «يؤم القوم أقرؤهم لكتاب الله». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7136} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7137} والوقف على القراء والوصية لهم ينصرفان لحفاظ القرآن عند الشافعية والحنابلة، وجعل تحفيظ القرآن صداقا عند الشافعية جائز، وعند الحنفية والمالكية غير جائز. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7137} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7138} وحفظ الوديعة يوجب على المودع حفظها في حرز مثلها، ولا ضمان عليه إذا تلفت بغير تفريط أو تعد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7139}"
  en: "Preservation (hifz) means keeping a thing from loss and ruin, and also watchfulness, as in memorising the Qur'an by heart. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7135} Memorising the Fatiha for prayer is obligatory for one able to do it; if he cannot, he learns it or reads it from a copy; the Shafi'is and Hanbalis require it in every rak'a, the Hanafis require a long verse or three short ones. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7136} For leading prayer the majority prefer the more learned, and the Hanbalis and, in a view against the sounder one, the Shafi'is prefer the better reciter, on the report ”let the people be led by the one who recites the Book best”. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7136} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7137} A waqf or bequest to reciters goes to those who hold the whole Qur'an by heart, according to the Shafi'is and Hanbalis; making the teaching of the Qur'an a bridal gift is disputed, allowed by the Shafi'is and forbidden by the Hanafis and Malikis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7137} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7138} The depositor must keep the deposit in a place fit for it, and is not liable if it is lost without fault. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7139}"
