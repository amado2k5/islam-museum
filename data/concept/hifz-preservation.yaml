id: concept/hifz-preservation
class: concept
kind: legal
label: { ar: "الحفظ", en: "Preservation and memorising (hifz)", ur: "حفظ ⁦(یاد رکھنا اور محفوظ رکھنا)⁩", es: "Preservación y memorización (hifz)", fr: "Préservation et mémorisation (hifz)", tr: "Koruma", id: "Konservasi" }
summary:
  ar: "الحفظ في اللغة المنع من الضياع والتلف، ويأتي بمعنى التعاهد وقلة الغفلة، كحفظ القرآن عن ظهر قلب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7135} وحفظ الفاتحة في الصلاة واجب على من يستطيع، وإن عجز تعلمها أو قرأها من مصحف؛ والشافعية والحنابلة يوجبون قراءتها في كل ركعة، والحنفية يوجبون حفظ آية طويلة أو ثلاث آيات قصار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7136} وتقديم الأفقه للإمامة عند الجمهور، وتقديم الأقرأ والأحفظ عند الحنابلة والشافعية في مقابل الأصح، لقوله: «يؤم القوم أقرؤهم لكتاب الله». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7136} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7137} والوقف على القراء والوصية لهم ينصرفان لحفاظ القرآن عند الشافعية والحنابلة، وجعل تحفيظ القرآن صداقا عند الشافعية جائز، وعند الحنفية والمالكية غير جائز. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7137} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7138} وحفظ الوديعة يوجب على المودع حفظها في حرز مثلها، ولا ضمان عليه إذا تلفت بغير تفريط أو تعد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7139}"
  en: "Preservation (hifz) means keeping a thing from loss and ruin, and also watchfulness, as in memorising the Qur'an by heart. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7135} Memorising the Fatiha for prayer is obligatory for one able to do it; if he cannot, he learns it or reads it from a copy; the Shafi'is and Hanbalis require it in every rak'a, the Hanafis require a long verse or three short ones. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7136} For leading prayer the majority prefer the more learned, and the Hanbalis and, in a view against the sounder one, the Shafi'is prefer the better reciter, on the report ”let the people be led by the one who recites the Book best”. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7136} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7137} A waqf or bequest to reciters goes to those who hold the whole Qur'an by heart, according to the Shafi'is and Hanbalis; making the teaching of the Qur'an a bridal gift is disputed, allowed by the Shafi'is and forbidden by the Hanafis and Malikis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7137} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7138} The depositor must keep the deposit in a place fit for it, and is not liable if it is lost without fault. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7139}"
  es: "La preservación (hifz) significa mantener algo de la pérdida y la ruina, y también la vigilancia, como en memorizar el Corán de memoria. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7135} Memorizar la Fatiha para la oración es obligatorio para quien puede hacerlo; si no puede, la aprende o la lee de una copia; los shafi'ís y los hanbalíes la requieren en cada rak'a, los hanafíes requieren un versículo largo o tres cortos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7136} Para dirigir la oración, la mayoría prefiere al más instruido, y los hanbalíes y, en contra del más sólido, los shafi'ís prefieren al mejor recitador, según el relato \"que la gente sea guiada por aquel que mejor recita el Libro\". {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7136} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7137} Un waqf o legado a los recitadores se otorga a quienes memorizan todo el Corán, según los shafi'is y hanbalis; hacer de la enseñanza del Corán un regalo nupcial es discutido, permitido por los shafi'is y prohibido por los hanafis y malikíes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7137} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7138} El depositante debe guardar el depósito en un lugar adecuado para él, y no es responsable si se pierde sin culpa. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.7139}"
  fr: "La préservation (hifz) signifie préserver une chose de la perte et de la ruine, et implique également une vigilance constante, comme dans la mémorisation du Coran. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7135} La mémorisation de la Fatiha pour la prière est obligatoire pour celui qui en est capable; s’il ne le peut pas, il l’apprend ou la lit à partir d’un exemplaire. Les écoles shafi’ite et hanbalite l’exigent dans chaque rak’a; les hanafites exigent un verset long ou trois versets courts. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7136} Pour diriger la prière, la majorité préfère le plus savant, et les hanbalites, contrairement à l’avis du plus sage, les shafi’ites, préfèrent le meilleur récitant, selon le hadith: « Que les gens soient dirigés par celui qui récite le mieux le Livre. » {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7136} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7137} Selon les écoles chaféite et hanbalite, un waqf, ou legs destiné aux récitateurs, est accordé à ceux qui connaissent le Coran par cœur. Offrir l'enseignement du Coran comme cadeau de mariage est controversé: autorisé par les chaféites, mais interdit par les hanafites et les malikites. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7137} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7138} Le déposant doit conserver le dépôt en un lieu approprié et n'est pas responsable en cas de perte sans faute de sa part. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7139}"
  ur: "حفظ ⁦(حفظ)⁩ کا مطلب ہے کسی چیز کو نقصان اور بربادی سے بچانا، اور احتیاط بھی، جیسا کہ قرآن کو دل سے حفظ کرنا۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص7135} نماز کے لیے فاتحہ حفظ کرنا اس پر واجب ہے جو اس پر قادر ہو۔ اگر وہ نہیں کر سکتا، تو وہ اسے سیکھتا ہے یا نقل سے پڑھتا ہے۔ شافعی اور حنبلی ہر رکعت میں اس کا تقاضا کرتے ہیں، احناف ایک لمبی یا تین چھوٹی آیتوں کا تقاضا کرتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص7136} نماز کی امامت کے لیے جمہور زیادہ عالم کو ترجیح دیتے ہیں، اور حنبلی، اور آواز دینے والے کے مقابلے میں، شافعی بہتر قاری کو ترجیح دیتے ہیں، اس رپورٹ میں کہ ”لوگوں کی امامت وہی کرے جو بہترین کتاب پڑھتا ہو“۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.7136} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7137} شافعیوں اور حنبلیوں کے نزدیک پورے قرآن کو دل سے تھامنے والوں کو وقف یا وصیت کی جاتی ہے۔ قرآن کی تعلیم کو دلہن کا تحفہ بنانا متنازعہ ہے، شافعیوں کے نزدیک اس کی اجازت ہے اور حنفیہ اور مالکیوں کے نزدیک حرام ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.7137} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 7138} جمع کرنے والے کو چاہیے کہ وہ امانت کو مناسب جگہ پر رکھے، اور اگر یہ بغیر کسی غلطی کے ضائع ہو جائے تو وہ ذمہ دار نہیں ہے۔ {حوالہ: فقہ موسوعۃ کویتیہ نور v3 ص7139}"
  tr: "Dilde ezberleme, kayıp ve kayıpları önlemek, bağlılık ve daha az dikkatsizlik anlamına gelir; örneğin Kur'an'ı ezberlemek gibi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7135} Fatiha'yı namazda ezberlemek, Muşaf'tan öğrenememiş veya okuyamamış olsa bile, Fatiha'yı ezberlemeyi başaran herkes için zorunludur; Şafiiler ve Hanbaliler her rakette okunmasını ister, Hanefiler ise uzun bir ayet veya üç kısa ayeti ezberlemeyi gerektirir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7136} Çoğunluğa göre imam için ufku tercih eder ve Hanbeli ile Şafii'lere göre en okunabilir ve ezberlenen olanı tercih eder; bunun aksine, \"Halk, Allah'ın Kitabı'nın en çok okuyucusuyla birlikte dua eder.\" {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7136} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7137} Okunanlar için verilen bağışlar ve vasiyet, Kur'an'ı Şafi'ler ve Hanbali'lere göre ezberlemek içindir ve Kur'an'ı çeyiz olarak ezberlemek Şafiilere göre caizdir, ancak Hanafi ve Malikilere göre değildir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7137} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7138} Depo sahibi, onu benzer bir kasada tutmak zorundadır ve ihmal veya müdahale olmadan yok edilirse sorumluluk yoktur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7139}"
  id: "Menghafal dalam bahasa berarti mencegah kehilangan dan kehilangan, dan berarti komitmen serta kurang ceroboh, seperti menghafal Al-Qur'an dengan penuh hafalan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7135} Menghafal Al-Fatiha dalam doa adalah kewajiban bagi siapa pun yang bisa, meskipun seseorang tidak dapat mempelajarinya atau membacanya dari sebuah Mushaf; Syafi'i dan Hanbal mengharuskan bacaan itu dalam setiap rak'ah, dan Hanafi mengharuskan menghafal satu ayat panjang atau tiga ayat pendek. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7136} Lebih memilih cakrawala untuk imamat menurut mayoritas, dan lebih memilih yang paling mudah dibaca dan dihafal menurut Hanbalis dan Shafi'i dibandingkan dengan yang paling otentik, seperti dalam ayat: \"Umat memimpin shalat dengan pembaca Kitab Allah terbanyak.\" {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7136} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7137} Wakaf dan wasiat untuk para pembaca adalah untuk menghafal Al-Qur'an sesuai dengan Shafi'i dan Hanbali, dan menjadikan menghafal Al-Qur'an sebagai mas kawin diperbolehkan menurut para Sy'i'i, tetapi tidak menurut Hanafi dan Maliki. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7137} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7138} Depositaris berkewajiban menyimpannya di brankas serupa, dan tidak ada tanggung jawab jika dihancurkan tanpa kelalaian atau campur tangan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7139}"
