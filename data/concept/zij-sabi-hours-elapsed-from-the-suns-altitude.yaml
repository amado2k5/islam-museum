label: { ar: "ما مضى من النهار بقياس ارتفاع الشمس في الزيج الصابي", en: "The hours of the day elapsed from a measured altitude of the Sun", ur: "سورج کے ناپے ہوئے ارتفاع سے دن کے گزرے ہوئے گھنٹے", es: "Las horas del día transcurrieron desde una altitud medida del Sol.", fr: "Les heures de la journée s'écoulaient à partir d'une altitude mesurée du Soleil", tr: "Sabaean Zij'de güneşin yüksekliğine göre ölçülen gün ışığı süresi.", id: "Waktu siang hari yang diukur berdasarkan ketinggian matahari dalam kalender Sabaean Zij." }
summary:
  ar: "الباب السادس عشر في معرفة ما مضى من النهار بقياس الشمس: يعرف البتاني ارتفاع الشمس نصف النهار ونصف قوس النهار ذلك اليوم، ثم يقيس الارتفاع بأي وقت، ويستعمل الأوتار الراجعة: يضرب وتر الارتفاع المقيس في وتر نصف قوس النهار الراجع ويقسم على وتر ارتفاع نصف النهار، وينقص الحاصل من الوتر الراجع، ويقوّس الباقي راجعاً، فتكون القوس ما بقي إلى الزوال أو ما مضى منه. {cite:zij-sabi-nallino-byblion pp.48-49}."
  en: "Chapter 16 treats the hours of the day elapsed by measuring the Sun: al-Battani finds the Sun's midday altitude and half the day arc for that day, then measures the altitude at any time, and uses the returned chords: he multiplies the chord of the measured altitude by the returned chord of half the day arc, divides by the chord of the midday altitude, subtracts the result from the returned chord, and finds the returned arc of the remainder, which is the arc that remains until midday or has passed since it. {cite:zij-sabi-nallino-byblion pp.48-49}."
  ur: "سولہواں باب سورج کی پیمائش سے دن کے گزرے ہوئے گھنٹے معلوم کرنے کے بارے میں ہے: البتانی دوپہر کا ارتفاع اور اس دن کی نصف قوس النہار معلوم کرتے ہیں، پھر کسی بھی وقت ارتفاع ناپتے ہیں اور وتر راجع استعمال کرتے ہیں: ناپے ہوئے ارتفاع کے وتر کو نصف قوس النہار کے وتر راجع سے ضرب دیتے ہیں، دوپہر کے ارتفاع کے وتر پر تقسیم کرتے ہیں، حاصل کو وتر راجع سے گھٹاتے ہیں اور باقی کی قوس راجعہ نکالتے ہیں، جو وہ قوس ہے جو زوال تک باقی ہے یا جو اس سے گزر چکی ہے۔ {cite:zij-sabi-nallino-byblion pp.48-49}۔"
  es: "El capítulo 16 trata sobre las horas transcurridas del día midiendo el Sol: al-Battani halla la altitud del Sol al mediodía y la mitad del arco diurno para ese día, luego mide la altitud en cualquier momento y utiliza las cuerdas resultantes: multiplica la cuerda de la altitud medida por la cuerda resultante de la mitad del arco diurno, divide por la cuerda de la altitud del mediodía, resta el resultado de la cuerda resultante y halla el arco resultante del resto, que es el arco que permanece hasta el mediodía o que ha transcurrido desde entonces. {cite:zij-sabi-nallino-byblion pp.48-49}."
  fr: "Le chapitre 16 traite du calcul de la durée du jour par la mesure du Soleil: al-Battani détermine la hauteur du Soleil à midi et l’arc de demi-journée pour cette journée, puis mesure sa hauteur à un instant donné et utilise les cordes de retour: il multiplie la corde correspondant à la hauteur mesurée par la corde de demi-journée, divise par la corde correspondant à la hauteur de midi, soustrait le résultat de la corde de retour et calcule ainsi l’arc restant, qui est l’arc qui subsiste jusqu’à midi ou qui s’est écoulé depuis. {cite:zij-sabi-nallino-byblion pp.48-49}."
  tr: "On Altıncı Bölüm: Güneşi Ölçerek Geçen Gündüz Süresini Belirleme Üzerine: El-Battani, öğle vakti güneşin yüksekliğini ve o günün gün yayını belirler. Daha sonra herhangi bir zamanda yüksekliği ölçer ve geriye doğru kirişler kullanır: ölçülen yüksekliğin kirişini, geriye doğru günün gün yayının kirişiyle çarpar ve öğle vaktindeki yüksekliğin kirişine böler. Sonucu geriye doğru kirişten çıkarır ve kalanı geriye doğru yayar. Yay daha sonra öğlene kadar kalan zamanı veya geçen zamanı temsil eder. {cite:zij-sabi-nallino-byblion pp.48-49}."
  id: "Bab Enam Belas: Tentang Menentukan Waktu Siang yang Berlalu dengan Mengukur Matahari: Al-Battani menentukan ketinggian matahari pada tengah hari dan busur hari itu. Kemudian ia mengukur ketinggian pada waktu tertentu dan menggunakan tali busur retrograde: ia mengalikan tali busur ketinggian yang diukur dengan tali busur hari retrograde dan membaginya dengan tali busur ketinggian pada tengah hari. Ia mengurangi hasilnya dari tali busur retrograde dan menarik kembali sisanya. Busur tersebut kemudian mewakili waktu yang tersisa hingga tengah hari atau waktu yang telah berlalu. {cite:zij-sabi-nallino-byblion pp.48-49}."
