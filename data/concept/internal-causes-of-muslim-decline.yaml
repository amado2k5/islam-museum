id: concept/internal-causes-of-muslim-decline
class: concept
kind: social
label: { ar: "الأسباب الداخلية لتأخر المسلمين", en: "Internal causes of Muslim decline" }
summary:
  ar: "يعرض شكيب أرسلان في فصل «لماذا الإسلام راق بذاته» تفسيره لتأخر المسلمين، فيرد أسباب التراجع إلى الداخل: فتور الهمم، وفساد الأخلاق، وترك العمل بمحكم القرآن، واتباع الأهواء، وأشد ذلك التنافس على الإمارة والرئاسة بين القبائل كالقيسية واليمانية. ويقارن ذلك بسقوط الرومان واليونان، فيرى أن تنصر الرومان لم يكن وحده سبب انحطاطهم، وأن أسباب الانحطاط كثيرة وأهمها فساد الأخلاق والتفرق. ويرفض في الوقت نفسه القول بأن الإسلام هو سبب التأخر، ويعدّ ذلك دعوى خصوم الإسلام. هذا تفسير المؤلف، ويعرضه بوصفه رأياً لا حكماً محايداً على تاريخ المسلمين."
  en: "In the same chapter Arslan attributes Muslim decline to internal causes: waning resolve, corruption of morals, neglect of the Qur'an's clear rulings, following desire, and above all rivalry for command between tribal groups such as the Qays and the Yemen. He compares the fall of Greece and Rome and argues that the Christianisation of Rome was not the sole cause of its decline. He rejects the view that Islam itself caused backwardness. This is his explanation, offered as a view rather than a neutral history."
wings: [ideas, people]
