id: concept/internal-causes-of-muslim-decline
class: concept
kind: social
label: { ar: "الأسباب الداخلية لتأخر المسلمين", en: "Internal causes of Muslim decline", es: "Causas internas del declive musulmán", fr: "Causes internes du déclin musulman", ur: "مسلمانوں کے زوال کے اندرونی اسباب", tr: "Müslümanların Gecikmesinin İç Nedenleri", id: "Alasan Internal Penundaan Muslim" }
summary:
  ar: "يعرض شكيب أرسلان في فصل «لماذا الإسلام راق بذاته» تفسيره لتأخر المسلمين، فيرد أسباب التراجع إلى الداخل: فتور الهمم، وفساد الأخلاق، وترك العمل بمحكم القرآن، واتباع الأهواء، وأشد ذلك التنافس على الإمارة والرئاسة بين القبائل كالقيسية واليمانية. ويقارن ذلك بسقوط الرومان واليونان، فيرى أن تنصر الرومان لم يكن وحده سبب انحطاطهم، وأن أسباب الانحطاط كثيرة وأهمها فساد الأخلاق والتفرق. ويرفض في الوقت نفسه القول بأن الإسلام هو سبب التأخر، ويعدّ ذلك دعوى خصوم الإسلام. هذا تفسير المؤلف، ويعرضه بوصفه رأياً لا حكماً محايداً على تاريخ المسلمين."
  en: "In the same chapter Arslan attributes Muslim decline to internal causes: waning resolve, corruption of morals, neglect of the Qur'an's clear rulings, following desire, and above all rivalry for command between tribal groups such as the Qays and the Yemen. He compares the fall of Greece and Rome and argues that the Christianisation of Rome was not the sole cause of its decline. He rejects the view that Islam itself caused backwardness. This is his explanation, offered as a view rather than a neutral history."
  es: "En el mismo capítulo, Arslan atribuye el declive musulmán a causas internas: la disminución de la determinación, la corrupción moral, el descuido de las claras normas del Corán, el mero apego a los deseos y, sobre todo, la rivalidad por el poder entre grupos tribales como los Qays y los Yemen. Compara la caída de Grecia y Roma y argumenta que la cristianización de Roma no fue la única causa de su declive. Rechaza la idea de que el propio islam haya provocado el atraso. Esta es su explicación, presentada como una opinión más que como una historia neutral."
  fr: "Dans le même chapitre, Arslan attribue le déclin musulman à des causes internes: l’affaiblissement de la détermination, la corruption des mœurs, le mépris des préceptes clairs du Coran, la soumission aux désirs et, surtout, la rivalité pour le pouvoir entre groupes tribaux tels que les Qays et les Yéménites. Il compare la chute de la Grèce et celle de Rome et soutient que la christianisation de Rome n’en fut pas la seule cause. Il réfute l’idée que l’islam ait, en lui-même, engendré le retard de développement. Telle est son explication, présentée comme une opinion et non comme un récit historique neutre."
  ur: "اسی باب میں ارسلان نے مسلمانوں کے زوال کو داخلی وجوہات سے منسوب کیا ہے: کمزور عزم، اخلاق کی خرابی، قرآن کے واضح احکام سے غافل ہونا، خواہشات کی پیروی، اور سب سے بڑھ کر قیس اور یمن جیسے قبائلی گروہوں کے درمیان کمان کے لیے رقابت۔ وہ یونان اور روم کے زوال کا موازنہ کرتا ہے اور دلیل دیتا ہے کہ روم کی عیسائیت اس کے زوال کی واحد وجہ نہیں تھی۔ وہ اس نظریے کو مسترد کرتا ہے کہ اسلام ہی پسماندگی کا سبب بنتا ہے۔ یہ اس کی وضاحت ہے، جو غیر جانبدار تاریخ کے بجائے ایک نقطہ نظر کے طور پر پیش کی گئی ہے۔"
  tr: "\"İslam Neden Kendine Saygılıdır\" başlıklı bölümde Shakib Arslan, Müslümanların geri kalmışlığının açıklamasını sunar ve içsel çöküşün nedenlerini şunlardır: zayıflamış kararlılık, ahlak bozulması, açık Kur'an'a uymaktan vazgeçme, kaprislere uyma ve en şiddetli olarak Qaysiler ve Yemenliler gibi kabileler arasındaki liderlik ve liderlik rekabetidir. Bunu Romalıların ve Yunanların çöküşüne benzetir; Romalıların Hristiyanlığa geçişinin gerilemelerinin tek nedeni olmadığını, bu gerilemenin nedenlerinin çok sayıda olduğunu, en önemlilerinin ahlaki yozlaşma ve bölünme olduğunu savunur. Aynı zamanda, İslam'ın geri kalmışlığının sebebi olduğu iddiasını reddeder; bu da İslam'ın karşıtlarının iddiasıdır. Bu, yazarın yorumudur ve bunu Müslüman tarihi üzerine tarafsız bir yargı değil, bir görüş olarak sunar."
  id: "Dalam bab \"Mengapa Islam Menghormati Diri Sendiri,\" Shakib Arslan memaparkan penjelasannya atas keterbelakangan umat Muslim, mengaitkan alasan kemunduran internal mereka: melemahnya tekad, korupsi moral, meninggalkan kebijaksanaan Al-Qur'an yang jelas, mengikuti keinginan, dan yang paling intens adalah persaingan kepemimpinan dan kepemimpinan antar suku seperti Qaysi dan Yaman. Ia membandingkan hal ini dengan kejatuhan bangsa Romawi dan Yunani, berargumen bahwa konversi orang Romawi ke Kristen bukanlah satu-satunya penyebab kemunduran mereka, dan alasan kemunduran ini sangat banyak, yang paling penting adalah korupsi dan perpecahan moral. Pada saat yang sama, ia menolak klaim bahwa Islam adalah penyebab keterbelakangan, yang merupakan klaim para penentang Islam. Ini adalah interpretasi penulis, dan ia menyajikannya sebagai pendapat, bukan penilaian netral, terhadap sejarah Muslim."
