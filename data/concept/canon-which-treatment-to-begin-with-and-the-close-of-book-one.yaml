label: { ar: "بأي المعالجات نبتدئ وختام الكتاب الأول عند ابن سينا", en: "Which treatment to begin with, and the close of Book I of the Canon", ur: "قانون میں کس علاج سے ابتدا کی جائے اور کتاب اول کا اختتام", es: "¿Con qué tratamiento empezar y cuál es el final del Libro I del Canon?", fr: "Quel traitement choisir pour commencer, et la fin du Livre I du Canon", tr: "İlk kitabı İbn Sina ile hangi tedavilerle başlatıp bitiriyoruz?", id: "Dengan pengobatan apa kita memulai dan mengakhiri buku pertama dengan Avicenna?" }
summary:
  ar: "يختم ابن سينا الفصل الحادي والثلاثين بوصية في تقديم المعالجات إذا اجتمعت الأمراض، ويعدد ثلاث خواص يبدأ بها، ثم يقول إنه بهذا يفرغ من الأصول الكلية، ويعد بكتاب الأدوية المفردة، وتنتهي بذلك الكتاب الأول {cite:canon-ibn-sina-print-v1 p.311}."
  en: "Ibn Sina ends chapter 31 with advice on the order of treatments when illnesses come together, lists three features by which to begin, then says he has finished the general principles and will go on to his book on simple drugs, so closing Book I {cite:canon-ibn-sina-print-v1 p.311}."
  es: "Ibn Sina termina el capítulo 31 con consejos sobre el orden de los tratamientos cuando las enfermedades se presentan juntas, enumera tres características por las que comenzar, luego dice que ha terminado los principios generales y que pasará a su libro sobre medicamentos simples, cerrando así el Libro I {cite:canon-ibn-sina-print-v1 p.311}."
  fr: "Ibn Sina termine le chapitre 31 avec des conseils sur l'ordre des traitements lorsque les maladies se conjuguent, énumère trois caractéristiques par lesquelles commencer, puis dit qu'il a terminé les principes généraux et qu'il passera à son livre sur les médicaments simples, fermant ainsi le Livre I {cite:canon-ibn-sina-print-v1 p.311}."
  ur: "ابن سینا نے باب 31 کو بیماریوں کے ایک ساتھ ہونے پر علاج کی ترتیب کے بارے میں مشورہ کے ساتھ ختم کیا، تین خصوصیات کی فہرست دی ہے جن سے شروع کرنا ہے، پھر کہتے ہیں کہ اس نے عام اصولوں کو ختم کر لیا ہے اور وہ سادہ دوائیوں پر اپنی کتاب پر جائیں گے، اس لیے کتاب I {cite:canon-ibn-sina-print-v1 p.311} کو بند کر رہا ہوں۔"
  tr: "İbn Sina, otuz birinci bölümü hastalıklar birleştiğinde tedavi sağlanması önerisiyle bitirir, başlangıçta üç özellik listeler, ardından bunu yaparak genel ilkeleri tamamladığını ve Bireysel İlaçlar Kitabı'nı vaat ettiğini söyler; ilk kitapla sona erer {cite:canon-ibn-sina-print-v1 s.311}."
  id: "Ibn Sina menutup bab tiga puluh satu dengan rekomendasi untuk memberikan pengobatan ketika penyakit digabungkan, mencantumkan tiga sifat yang ia mulai dari, lalu mengatakan bahwa dengan melakukan itu, ia menyelesaikan prinsip umum dan menjanjikan Buku Obat Individu, diakhiri dengan buku pertama {cite:canon-ibn-sina-print-v1 hlm.311}."
