summary:
  fr: "Ibn Sina termine le chapitre 31 par des conseils sur l'ordre des traitements lorsque plusieurs maladies coexistent. Il énumère trois critères de priorité, puis déclare avoir achevé les principes généraux et annonce son livre sur les médicaments simples, clôturant ainsi le livre I {cite:canon-ibn-sina-print-v1 p.311}."
  ar: "يختم ابن سينا الفصل الحادي والثلاثين بوصية في تقديم المعالجات إذا اجتمعت الأمراض، ويعدد ثلاث خواص يبدأ بها، ثم يقول إنه بهذا يفرغ من الأصول الكلية، ويعد بكتاب الأدوية المفردة، وتنتهي بذلك الكتاب الأول {cite:canon-ibn-sina-print-v1 p.311}."
  en: "Ibn Sina ends chapter 31 with advice on the order of treatments when illnesses come together, lists three features by which to begin, then says he has finished the general principles and will go on to his book on simple drugs, so closing Book I {cite:canon-ibn-sina-print-v1 p.311}."
