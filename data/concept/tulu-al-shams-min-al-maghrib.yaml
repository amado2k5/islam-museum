id: concept/tulu-al-shams-min-al-maghrib
class: concept
kind: belief
label:
  ar: طلوع الشمس من مغربها
  en: The sun rising from the west
  ur: مغرب سے سورج کا طلوع ہونا
summary:
  ar: "من العلامات الكبرى أن تطلع الشمس من مغربها فيؤمن الناس أجمعون، وذلك حين لا ينفع نفساً إيمانها لم تكن آمنت من قبل أو كسبت في إيمانها خيراً {cite:sahih-al-bukhari} {cite:sahih-muslim}."
  en: "Of the major signs: the sun rises from its west, whereupon all people believe — but that is when no soul's faith avails it if it had not believed before or earned good within its faith {cite:sahih-al-bukhari} {cite:sahih-muslim}."
  ur: "بڑی نشانیوں میں سے ایک یہ ہے کہ سورج مغرب سے طلوع ہو، جس پر سب لوگ ایمان لے آئیں گے، لیکن وہ وقت ہوگا جب کسی نفس کے ایمان سے فائدہ نہیں ہوگا اگر وہ پہلے ایمان نہ لایا ہو یا اپنے ایمان میں کوئی نیکی نہ کمائی ہو {cite:sahih-al-bukhari} {cite:sahih-muslim}۔"
