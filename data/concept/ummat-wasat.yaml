id: concept/ummat-wasat
class: concept
kind: term
label: { ar: "الأمة الوسط", en: "The middle community (ummat wasat)" }
issue:
  ar: "ما معنى وصف هذه الأمة بالوسط، وهل هو العدل والخيار أم الاعتدال بين طرفين؟"
summary:
  ar: "وصف الأمة في قوله تعالى «جعلناكم أمة وسطاً» في سورة البقرة. يذكر محمد رشيد رضا أن الوسط عند المفسرين العدل والخيار، لأن الإفراط والتفريط ميل عن الجادة، ثم يقرأ الوصف قراءة خاصة به: اعتدال الأمة بين حق الروح وحق الجسد، وبين الغلو والتعطيل، وأنها تكون وسطاً بقدر اتباعها لسنة الرسول."
  en: "The description of the community in Surat al-Baqara as a middle community. Muhammad Rashid Rida reports that commentators understand “wasat” to mean justice and excellence, since excess and deficiency are deviations from the right course. He then reads the description in his own way: the community's moderation between the rights of the soul and the rights of the body, and between extremism and neglect, and that it is a middle community to the degree that it follows the Sunna of the Messenger."
