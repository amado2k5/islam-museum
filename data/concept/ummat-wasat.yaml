id: concept/ummat-wasat
class: concept
kind: term
label: { ar: "الأمة الوسط", en: "The middle community (ummat wasat)", es: "La comunidad media (ummat wasat)", fr: "La communauté du milieu (ummat wasat)", ur: "متوسط طبقہ ⁦(امت وسعت)⁩", tr: "Orta Ulus", id: "Middle Nation" }
issue:
  ar: "ما معنى وصف هذه الأمة بالوسط، وهل هو العدل والخيار أم الاعتدال بين طرفين؟"
summary:
  ar: "وصف الأمة في قوله تعالى «جعلناكم أمة وسطاً» في سورة البقرة. يذكر محمد رشيد رضا أن الوسط عند المفسرين العدل والخيار، لأن الإفراط والتفريط ميل عن الجادة، ثم يقرأ الوصف قراءة خاصة به: اعتدال الأمة بين حق الروح وحق الجسد، وبين الغلو والتعطيل، وأنها تكون وسطاً بقدر اتباعها لسنة الرسول."
  en: "The description of the community in Surat al-Baqara as a middle community. Muhammad Rashid Rida reports that commentators understand “wasat” to mean justice and excellence, since excess and deficiency are deviations from the right course. He then reads the description in his own way: the community's moderation between the rights of the soul and the rights of the body, and between extremism and neglect, and that it is a middle community to the degree that it follows the Sunna of the Messenger."
  es: "La descripción de la comunidad en la Sura Al-Baqara como una comunidad intermedia. Muhammad Rashid Rida informa que los comentaristas entienden \"wasat\" como justicia y excelencia, ya que el exceso y la deficiencia son desviaciones del camino correcto. Luego interpreta la descripción a su manera: la moderación de la comunidad entre los derechos del alma y los derechos del cuerpo, y entre el extremismo y la negligencia, y que es una comunidad intermedia en la medida en que sigue la Sunna del Mensajero."
  fr: "La description de la communauté dans la sourate Al-Baqara comme une communauté du juste milieu est rapportée par Muhammad Rashid Rida, qui rapporte que les commentateurs interprètent « wasat » comme signifiant justice et excellence, car l’excès et le manque constituent des déviations par rapport au droit chemin. Il propose ensuite sa propre interprétation: la communauté se caractérise par la modération entre les droits de l’âme et ceux du corps, entre l’extrémisme et la négligence, et elle est une communauté du juste milieu dans la mesure où elle suit la Sunna du Messager."
  ur: "سورۃ البقرہ میں ایک درمیانی برادری کے طور پر کمیونٹی کی تفصیل۔ محمد راشد ردا رپورٹ کرتے ہیں کہ مبصرین \"وسعت\" کا مطلب انصاف اور فضیلت کو سمجھتے ہیں، کیونکہ زیادتی اور کمی صحیح راستے سے انحراف ہے۔ اس کے بعد وہ اس کی تفصیل اپنے انداز میں پڑھتا ہے: روح کے حقوق اور جسم کے حقوق کے درمیان کمیونٹی کا اعتدال اور انتہا پسندی اور کوتاہی کے درمیان، اور یہ کہ یہ ایک درمیانی جماعت ہے اس حد تک کہ وہ سنت رسول کی پیروی کرتی ہے۔"
  tr: "Milletin tasviri, Bakarah Suresi'ndeki \"Sizi adil bir cemaat yaptık\" ayetinde. Muhammed Reşid Ridha, yorumcular arasında ortada olanın adalet ve tercih olduğunu, çünkü aşırılık ve ihmalkarlığın ciddi olduğunu belirtir. Sonra tanımı kendi tarzında okur: ulusun ruh hakları ile bedenin hakkı arasındaki dengesi, aşırılık ile ihmal arasındaki denge ve Resulun Sünnetine bağlılığına göre ılımlıdır."
  id: "Deskripsi bangsa dalam ayat \"Kami menjadikan kalian komunitas yang adil\" dalam Surah Al-Baqarah. Muhammad Rashid Ridha menyebutkan bahwa di tengah para komentator adalah keadilan dan pilihan, karena kelebihan dan kelalaian cenderung serius. Ia kemudian membaca deskripsi itu dengan caranya sendiri: keseimbangan bangsa antara hak jiwa dan hak tubuh, serta antara ekstremisme dan kelalaian, dan bahwa bangsa moderat sesuai dengan kepatuhan pada Sunnah Rasululan."
