id: concept/upper-hollow-vein-branches-chest-neck-armpit
class: concept
kind: scientific
label: { ar: "فروع الأجوف الصاعد في الصدر والعنق والإبط عند ابن سينا", en: "Branches of the rising hollow vein in the chest, neck and armpit in the Canon", ur: "قانون میں چڑھتے اجوف کی سینے، گردن اور بغل کی شاخیں", es: "Ramas de la vena hueca ascendente en el pecho, el cuello y la axila en el Canon", fr: "Branches de la veine creuse ascendante dans la poitrine, le cou et l'aisselle dans le Canon", tr: "İbn Sina'ya göre göğüs, boyun ve koltuk altındaki yükselen boşluk dalları", id: "Cabang-cabang rongga naik di dada, leher, dan ketiak menurut Ibn Sina" }
summary:
  ar: "يتتبع ابن سينا ما يبقى من الأجوف الصاعد بعد القلب: شعب شعرية في الأغشية المنصفة والتوثة، وشعبتان إلى الترقوة، ثم خمس شعب من كل جانب منها الشعبة العظيمة إلى الإبط التي تتفرع أربعة فروع، والباقي يصعد إلى العنق ويصير الوداجين {cite:canon-ibn-sina-print-v1 pp.89-90}."
  en: "Ibn Sina follows what remains of the rising hollow vein after the heart: hair-like branches in the dividing membranes and the thymus, two branches toward the collarbone, then five branches on each side, among them the great branch to the armpit that divides in four, while the remainder rises to the neck and becomes the two jugular veins {cite:canon-ibn-sina-print-v1 pp.89-90}."
  es: "Ibn Sina sigue lo que queda de la vena hueca ascendente después del corazón: ramas parecidas a cabellos en las membranas divisorias y el timo, dos ramas hacia la clavícula, luego cinco ramas a cada lado, entre ellas la gran rama hacia la axila que se divide en cuatro, mientras que el resto asciende al cuello y se convierte en las dos venas yugulares {cite:canon-ibn-sina-print-v1 pp.89-90}."
  fr: "Ibn Sina suit ce qui reste de la veine creuse ascendante après le cœur: des ramifications filiformes dans les membranes séparatrices et le thymus, deux ramifications vers la clavicule, puis cinq ramifications de chaque côté, parmi lesquelles la grande ramification vers l'aisselle qui se divise en quatre, tandis que le reste monte vers le cou et devient les deux veines jugulaires {cite:canon-ibn-sina-print-v1 pp.89-90}."
  ur: "ابن سینا دل کے بعد ابھرتی ہوئی کھوکھلی رگ کی باقیات کی پیروی کرتے ہیں: تقسیم کرنے والی جھلیوں اور تھائمس میں بالوں جیسی شاخیں، دو شاخیں گریبان کی طرف، پھر ہر طرف پانچ شاخیں، ان میں سے بڑی شاخ بغل تک جو چار حصوں میں بٹ جاتی ہے، جبکہ باقی گردن کی طرف اٹھتی ہے اور دو جوڑ بن جاتی ہے۔ {حوالہ: کینن ابن سینا پرنٹ v1 صفحہ 89-90}۔"
  tr: "İbn Sina, kalpten sonra kalan yukarı çıkan boşluğun kalanını izler: mediasis ve göğüslerde kılcal dallar, köprücük kemiğine iki dal, ardından koltuk altına giden büyük dal dahil olmak üzere her iki tarafta beş dal, koltuk altına giden büyük dal dört dala ayrılır, geri kalanlar ise boyuna yükselir ve juguler olur {cite:canon-ibn-sina-print-v1 s.89-90}."
  id: "Ibn Sina menelusuri sisa rongga naik setelah jantung: cabang kapiler di mediasis dan toraks, dua cabang ke tulang selangka, lalu lima cabang di setiap sisi, termasuk cabang besar ke ketiak yang bercabang menjadi empat cabang, sementara sisanya naik ke leher dan menjadi jugular {cite:canon-ibn-sina-print-v1 hlm.89-90}."
