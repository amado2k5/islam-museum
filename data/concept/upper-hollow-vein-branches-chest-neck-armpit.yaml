summary:
  ar: "يتتبع ابن سينا ما يبقى من الأجوف الصاعد بعد القلب: شعب شعرية في الأغشية المنصفة والتوثة، وشعبتان إلى الترقوة، ثم خمس شعب من كل جانب منها الشعبة العظيمة إلى الإبط التي تتفرع أربعة فروع، والباقي يصعد إلى العنق ويصير الوداجين {cite:canon-ibn-sina-print-v1 pp.89-90}."
  en: "Ibn Sina follows what remains of the rising hollow vein after the heart: hair-like branches in the dividing membranes and the thymus, two branches toward the collarbone, then five branches on each side, among them the great branch to the armpit that divides in four, while the remainder rises to the neck and becomes the two jugular veins {cite:canon-ibn-sina-print-v1 pp.89-90}."
