summary:
  ar: "يبرّد تبريداً شديداً مع رطوبة مائية، ويحفظ الثدي على نهوده {cite:canon-ibn-sina-print-v1 p.381}. تذكر الكتب أنه إذا شُرب جعل الشارب عقيماً، وتُدرج هذه الرواية في القيود للنظر فيها {cite:canon-ibn-sina-print-v1 p.381}."
  en: "The book says it cools intensely, with watery moisture, and keeps the breast firm in its shape {cite:canon-ibn-sina-print-v1 p.381}. The book reports that drinking it makes the drinker sterile; this is kept as the book's listing and logged for the founder's ruling {cite:canon-ibn-sina-print-v1 p.381}."
  fr: "Le livre dit qu’il refroidit intensément, avec une humidité aqueuse, et maintient la fermeté et la forme du sein {cite:canon-ibn-sina-print-v1 p.381}. Le livre rapporte que le boire rend stérile ; ce propos est conservé comme une énumération du livre et consigné en attente de la décision du fondateur {cite:canon-ibn-sina-print-v1 p.381}."
  ur: "کتاب کے مطابق یہ شدید ٹھنڈک اور پانی جیسی رطوبت رکھتی ہے، اور سینے پر پستان کو اس کی شکل پر قائم رکھتی ہے {cite:canon-ibn-sina-print-v1 p.381}۔ کتاب بتاتی ہے کہ اسے پینے والا بانجھ ہو جاتا ہے؛ یہ کتاب کی فہرست کے طور پر درج ہے اور فیصلے کے لیے لاگ میں ہے {cite:canon-ibn-sina-print-v1 p.381}۔"
  es: "El libro dice que refresca intensamente, con una humedad acuosa, y mantiene el pecho firme en su forma {cite:canon-ibn-sina-print-v1 p.381}. El libro informa que beberlo vuelve estéril a quien lo bebe; esto se mantiene como una entrada del libro y se registra para la decisión del fundador {cite:canon-ibn-sina-print-v1 p.381}."
