id: concept/ibtida-al-nahw
class: concept
kind: term
label: { ar: "ابتداء النحو", en: "Origins of Arabic Grammar", es: "Orígenes de la gramática árabe", fr: "Origines de la grammaire arabe", ur: "عربی گرامر کی ابتدا", tr: "Dilbilgisinin başlangıcı", id: "Awal tata bahasa" }
summary:
  ar: "نقل ابن النديم روايات ابتداء النحو: زعم أكثر العلماء أن النحو أخذ عن أبي الأسود الدؤلي وأن أبا الأسود أخذه عن علي بن أبي طالب، وقال آخرون إن نصر بن عاصم الدؤلي رسمه، وروى ابن لهيعة عن أبي النضر أن عبد الرحمن بن هرمز الأعرج كان أول من وضع العربية وكان أعلم الناس بأنساب قريش وكان من القراء، وقال ابن رستم الطبري إنما سمي النحو نحوا لأن أبا الأسود استأذن عليا أن يصنع نحو ما صنع، ونقل قول أبي عبيدة أن زيادا بعث إلى أبي الأسود اعمل شيئا يكون للناس إماما وتعرب به كتاب الله فاستعفى حتى سمع قارئا يقرأ براءة بالكسر فقال ما ظننت أن أمر الناس آل إلى هذا فرجع إلى زياد ووضع باب الفاعل والمفعول به، ووصف نقط أبي الأسود: نقطة فوق الحرف للفتح وأمامه للضم وتحته للكسر ونقطتان للغنة، وروى أن الباعث أيضا قول سعد الفارسي عن فرسه ضالع يريد ظالعا فقال أبو الأسود هؤلاء الموالي صاروا لنا إخوة فلو علمناهم الكلام {cite:fihrist-ibn-al-nadim p. 103-106}."
  en: "Competing origin accounts of Arabic grammar — Ali to Abu al-Aswad, or Nasr b. Asim, or Abd al-Rahman b. Hurmuz; plus the dotting system {cite:fihrist-ibn-al-nadim p. 103-106}."
  es: "Existen diferentes versiones sobre el origen de la gramática árabe: de Ali a Abu al-Aswad, o Nasr b. Asim, o Abd al-Rahman b. Hurmuz; además del sistema de puntos {cite:fihrist-ibn-al-nadim p. 103-106}."
  fr: "Des récits concurrents sur l'origine de la grammaire arabe — Ali à Abu al-Aswad, ou Nasr b. Asim, ou Abd al-Rahman b. Hurmuz; plus le système de pointage {cite:fihrist-ibn-al-nadim p. 103-106}."
  ur: "عربی گرامر کے مسابقتی اصل اکاؤنٹس - علی سے ابو الاسود، یا نصر بی۔ عاصم، یا عبدالرحمٰن بی۔ ہرمز؛ پلس ڈاٹٹنگ سسٹم {حوالہ: فہرست ابن الندیم ص۔ 103-106}۔"
  tr: "İbn el-Nadim dilbilgisinin başında rivayetler aktarmıştır: Çoğu âlim, dilbilgisinin Ebu el-Esvad el-Du'ali'den, Ebu el-Esvad'ın ise Ali ibn Ebu Ebu Talib'den öğrendiğini iddia etmiştir. Diğerleri ise Nasr bin Asim el-Du'ali'nin çizdiğini söylemiştir. İbn Lahi'ah, Ebu el-Nadr'dan Abdülrahman ibn Hurmuz el-A'rac'ın Arapça'yı ilk kuran ve Kureyş'in soyağacı konusunda en bilgili ve en bilgili olan olduğunu anlatmıştır. İbn Rustem el-Taberi, dilbilgisinin sadece Ebu el-Esvad'dan dilbilgisi oluşturmak için izin istemesi nedeniyle dilbilgisi olarak adlandırıldığını söylemiştir Bir açıklama yaptı ve Ebu Ubeyde'den alıntı yaptı; Ziyad'ın Ebu Esvad'a insanları imam yapacak ve Allah'ın Kitabı'nı onunla birlikte yorumlayacak bir şey yapması için gönderdiğini aktardı. Bağışlandı, ta ki bir okur kâresinin Bara'ah ile bir kasra okuduğunu duyana kadar. Dedi ki, 'Halkın işlerinin buna yol açacağını düşünmemiştim.' dedi. Ziyad'a döndü, konuyu ve nesneyi ele aldı, Ebu el-Esvad'ın noktalarını anlattı: mektubun üstünde fetha için bir nokta, önünde damma için bir nokta, altında kasra için ve iki nokta ghunnah için. Ayrıca motivasyonun Sa'd al-Farisi'nin atı 'Dali' hakkında hırsız anlamına gelen sözü olduğunu da anlattı. Ebu el-Esvad şöyle dedi: \"Bu mevaliler bize kardeş oldular, yeter ki onlara dili öğretsek bile.\" {atıf:Fihrist-ibn-al-Nadim s. 103-106}."
  id: "Ibn al-Nadim menyampaikan narasi di awal tata bahasa: Sebagian besar ulama mengklaim bahwa tata bahasa dipelajari dari Abu al-Aswad al-Du'ali dan Abu al-Aswad mempelajarinya dari Ali ibn Abi Talib. Yang lain mengatakan bahwa Nasr ibn Asim al-Du'ali menggambarnya. Ibn Lahi'ah menceritakan dari Abu al-Nadr bahwa Abd al-Rahman ibn Hurmuz al-A'raj adalah yang pertama mendirikan bahasa Arab dan paling paham tentang silsilah Quraisy serta di antara para pembaca. Ibn Rustam al-Tabari mengatakan tata bahasa hanya disebut tata bahasa karena Abu al-Aswad meminta izin Ali untuk membuat tata bahasa Ia membuat pernyataan, dan mengutip Abu Ubaidah yang dikirim Ziyad kepada Abu al-Aswad untuk melakukan sesuatu yang akan menjadikan orang sebagai imam dan Kitab Allah dapat diuraikan dengannya. Ia diizinkan sampai mendengar seorang pembaca membaca Bara'ah dengan kasra. Ia berkata, 'Saya tidak menyangka urusan rakyat akan membawa ke arah ini.' Ia kembali ke Ziyad dan meletakkan bab pada subjek dan tujuan, serta menggambarkan titik-titik Abu al-Aswad: satu titik di atas huruf untuk fatha, satu di depannya untuk damma, di bawahnya untuk kasra, dan dua titik untuk ghunnah. Ia juga menceritakan bahwa motifnya juga merupakan pernyataan Sa'd al-Farisi tentang kudanya 'Dali' yang berarti pencuri. Abu al-Aswad berkata: Para mawali ini telah menjadi saudara bagi kita, jika saja kita mengajarkan mereka bahasa itu. {cite:fihrist-ibn-al-nadim hlm. 103-106}."
