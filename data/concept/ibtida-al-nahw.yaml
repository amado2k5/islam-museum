label: { ar: "ابتداء النحو", en: "Origins of Arabic Grammar" }
summary:
  ar: "نقل ابن النديم روايات ابتداء النحو: زعم أكثر العلماء أن النحو أخذ عن أبي الأسود الدؤلي وأن أبا الأسود أخذه عن علي بن أبي طالب، وقال آخرون إن نصر بن عاصم الدؤلي رسمه، وروى ابن لهيعة عن أبي النضر أن عبد الرحمن بن هرمز الأعرج كان أول من وضع العربية وكان أعلم الناس بأنساب قريش وكان من القراء، وقال ابن رستم الطبري إنما سمي النحو نحوا لأن أبا الأسود استأذن عليا أن يصنع نحو ما صنع، ونقل قول أبي عبيدة أن زيادا بعث إلى أبي الأسود اعمل شيئا يكون للناس إماما وتعرب به كتاب الله فاستعفى حتى سمع قارئا يقرأ براءة بالكسر فقال ما ظننت أن أمر الناس آل إلى هذا فرجع إلى زياد ووضع باب الفاعل والمفعول به، ووصف نقط أبي الأسود: نقطة فوق الحرف للفتح وأمامه للضم وتحته للكسر ونقطتان للغنة، وروى أن الباعث أيضا قول سعد الفارسي عن فرسه ضالع يريد ظالعا فقال أبو الأسود هؤلاء الموالي صاروا لنا إخوة فلو علمناهم الكلام {cite:fihrist-ibn-al-nadim p. 103-106}."
  en: "Competing origin accounts of Arabic grammar — Ali to Abu al-Aswad, or Nasr b. Asim, or Abd al-Rahman b. Hurmuz; plus the dotting system {cite:fihrist-ibn-al-nadim p. 103-106}."
