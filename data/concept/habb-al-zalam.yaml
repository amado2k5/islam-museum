summary:
  ar: "حبّ الزلم حبّة طيّبة الطعم جداً، تنبت بشهرزور، حارّة في الثانية رطبة، مسمّنة، ويذكر الكتاب أنها تزيد في المني، وهذا تقرير مُعلَّم يُعرض على الحكم."
  en: "Habb al-zalam is a very pleasant-tasting berry that grows in Shahrazur. The book gives it as hot in the second degree and moist, fattening, and says it greatly increases semen; that report is a labelled listing set aside for the founder's ruling."
  ur: "حب الزلم ایک بہت لذیذ دانہ ہے جو شہرزور میں اگتا ہے۔ کتاب اسے دوسرے درجے میں گرم اور تر، فربہ کرنے والا بتاتی ہے، اور کہتی ہے کہ یہ منی کو بہت بڑھاتا ہے؛ یہ نشان زدہ بیان ہے جو بانی کے فیصلے کے لیے رکھا گیا ہے۔"
  es: "Habb al-zalam es una baya de sabor muy agradable que crece en Shahrazur. El libro la describe como picante de segundo grado, húmeda y engordante, y afirma que aumenta considerablemente el semen; dicho informe es una mención reservada para la interpretación del fundador."
  fr: "Le bab al-zalam est une baie très agréable au goût qui pousse à Shahrazur. Le livre la décrit comme étant chaude au deuxième degré, humide et nourrissante, et affirme qu'elle augmente considérablement la production de sperme; cette mention figure dans une liste annotée réservée à l'avis du fondateur."
  tr: "Erkek tahıl, Shahrazur'da yetişen, ikinci bölgede nemli bir mahallede yetişen ve kilo alan çok lezzetli bir tohumdur. Kitapta tohum tüketimini artırdığı belirtiliyor ve bu, hakime sunulan akademik bir rapor."
  id: "Biji-bijian jantan adalah biji yang sangat enak yang tumbuh di Shahrazur, lingkungan lembap di bagian kedua, dan membuat gemuk. Buku tersebut menyebutkan bahwa biji-bijian ini meningkatkan asupan semen, dan ini adalah laporan ilmiah yang disampaikan kepada hakim."
