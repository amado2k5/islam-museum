summary:
  ar: "حبّ الزلم حبّة طيّبة الطعم جداً، تنبت بشهرزور، حارّة في الثانية رطبة، مسمّنة، ويذكر الكتاب أنها تزيد في المني، وهذا تقرير مُعلَّم يُعرض على الحكم."
  en: "Habb al-zalam is a very pleasant-tasting berry that grows in Shahrazur. The book gives it as hot in the second degree and moist, fattening, and says it greatly increases semen; that report is a labelled listing set aside for the founder's ruling."
  ur: "حب الزلم ایک بہت لذیذ دانہ ہے جو شہرزور میں اگتا ہے۔ کتاب اسے دوسرے درجے میں گرم اور تر، فربہ کرنے والا بتاتی ہے، اور کہتی ہے کہ یہ منی کو بہت بڑھاتا ہے؛ یہ نشان زدہ بیان ہے جو بانی کے فیصلے کے لیے رکھا گیا ہے۔"
