label:
  ar: "حيّة"
  en: "Hayya (the snake)"
  ur: "حیہ ⁦(سانپ)⁩"
  es: "Hayya (la serpiente)"
  fr: "Hayya (le serpent)"
  tr: "Yılan"
  id: "Ular"
summary:
  ar: "الحيّة أصناف كثيرة، يُستعمل لحمها مطبوخاً ومرقها وسلخها. لحم الأنثى أجود، وسلخ الذكر أجود. تجفيفها في لحمها قوي، وسلخها أشدّ تجفيفاً. ويذكر الكتاب أن لحمها يطيل العمر ويقوّي القوة ويحفظ الحواس، وينفع من الجذام، ويعالج داء الثعلب، وأن مرقها وسلخها ينفعان في الرأس والأذن والسنّ والعين. وما ينسب إلى الخيوط والخنق بالأفعى من طلاسم وتعاويذ متروك."
  en: "The snake comes in many kinds; its flesh, broth and skin are used. The female's flesh and the male's skin are best. Its flesh dries strongly, and its skin dries more strongly still. The book says its flesh prolongs life, strengthens bodily strength, preserves the senses, helps leprosy and helps alopecia greatly; its broth and skin help the head, the ear, the tooth and the eye. The threads and strangling of a viper that the book attributes to a remedy of charm are left out."
  ur: "سانپ کی بہت سی قسمیں ہیں؛ اس کا گوشت، شوربہ اور کھال استعمال ہوتے ہیں۔ مادہ کا گوشت اور نر کی کھال بہتر ہے۔ اس کا گوشت شدید خشک کرتا ہے اور کھال اس سے بھی زیادہ۔ کتاب کہتی ہے کہ اس کا گوشت عمر بڑھاتا، قوت دیتا، حواس محفوظ رکھتا، جذام میں مفید ہے اور داء الثعلب میں بہت مفید ہے؛ اس کا شوربہ اور کھال سر، کان، دانت اور آنکھ میں مفید ہیں۔ تعویذ جیسے ٹوٹکوں کے دھاگے اور سانپ کا گلا گھونٹنے کا بیان چھوڑ دیا گیا ہے۔"
  es: "Existen muchas variedades de serpientes; se utilizan su carne, su caldo y su piel. La carne de la hembra y la piel del macho son las mejores. Su carne se seca con facilidad, y su piel aún más. El libro afirma que su carne prolonga la vida, fortalece el cuerpo, preserva los sentidos, ayuda a combatir la lepra y la alopecia; su caldo y su piel benefician la cabeza, el oído, los dientes y los ojos. Se omiten los hilos y el estrangulamiento de una víbora que el libro atribuye a un remedio mágico."
  fr: "Il existe de nombreuses espèces de serpents; on utilise leur chair, leur bouillon et leur peau. La chair de la femelle et la peau du mâle sont les meilleures. Sa chair sèche fortement, et sa peau encore plus fortement. Le livre affirme que sa chair prolonge la vie, fortifie le corps, préserve les sens, soulage la lèpre et l’alopécie; son bouillon et sa peau sont bénéfiques pour la tête, les oreilles, les dents et les yeux. Les fils et l’étranglement de la vipère, que le livre attribue à un remède de charme, sont omis."
  tr: "Birçok yılan türü vardır; etleri pişirme, et suyu ve derisini yüzme için kullanılır. Dişi eti en kaliteli olanıdır ve erkek derisi daha iyidir. Etinde kuruması güçlüdür ve derisi daha da serttir. Kitap, etinin ömrünü uzattığını, gücü güçlendirdiğini, duyuları koruduğunu belirtir, cüzzam için faydalı olduğunu, tilki hastalığını tedavi ettiğini ve et suyu ile derisinin baş, kulak, dişler ve gözler için faydalı olduğunu belirtir. İpliklere ve yılan boğmasına atfedilen tılsımlar ve büyüler terk edilmiştir."
  id: "Ada banyak jenis ular; dagingnya digunakan untuk memasak, kaldu, dan menguliti. Daging betina memiliki kualitas terbaik, dan kulit jantan lebih baik. Keringnya pada dagingnya kuat, dan kulitnya bahkan lebih parah. Buku ini menyebutkan bahwa dagingnya memperpanjang umur, memperkuat kekuatan, menjaga indera, bermanfaat untuk kusta, dan mengobati penyakit rubah, serta kaldu dan kulitnya bermanfaat untuk kepala, telinga, gigi, dan mata. Jimat dan mantra yang dikaitkan dengan benang dan cekikan ular ditinggalkan."
