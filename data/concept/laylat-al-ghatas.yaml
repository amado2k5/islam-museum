label: { ar: "ليلة الغطاس", en: "The Night of the Ghatās (Epiphany)", es: "La Noche de los Ghatās (Epifanía)", fr: "La Nuit des Ghatās (Épiphanie)", ur: "گھاٹوں کی رات ⁦(ایپی فینی)⁩" }
summary:
  ar: "ليلة إحدى عشرة تمضي من طوبة وستة من كانون الثاني، لها شأن عظيم عند أهل مصر لا ينام الناس فيها، حضرها المسعودي سنة ثلاثين وثلاثمائة والإخشيد محمد بن طغج في داره المعروفة بالمختارة في الجزيرة الراكبة للنيل فأسرج من جانب الجزيرة وجانب الفسطاط ألف مشعل غير ما أسرج أهل مصر من المشاعل والشمع، وحضر مئات الألوف من المسلمين والنصارى في الزوارق والدور وعلى الشطوط بأنواع المآكل والمشارب وآلات الذهب والملاهي، وهي أحسن ليلة تكون بمصر ولا تغلق فيها الدروب ويغطس أكثرهم في النيل ويزعمون أن ذلك أمان من المرض ومبرئ للداء {cite:muruj-al-dhahab p. 302-303}."
  en: "Egypt's Epiphany night — al-Mas'udi attended in 330 when the Ikhshid lit a thousand torches from his al-Mukhtara palace on the river island and hundreds of thousands, Muslims and Christians, thronged boats and banks; the streets never close and most plunge into the Nile believing it preserves from sickness {cite:muruj-al-dhahab p. 302-303}."
  es: "La noche de la Epifanía en Egipto — al-Mas'udi asistió en el año 330 cuando el Ikhshid encendió mil antorchas desde su palacio al-Mukhtara en la isla del río y cientos de miles, musulmanes y cristianos, se agolparon en barcos y orillas; las calles nunca se cierran y la mayoría se sumerge en el Nilo creyendo que los protege de las enfermedades {cite:muruj-al-dhahab p. 302-303}."
  fr: "La nuit de l'Épiphanie en Égypte — al-Mas'udi y assista en 330 lorsque l'Ikhshid alluma mille torches depuis son palais al-Mukhtara sur l'île fluviale et que des centaines de milliers de musulmans et de chrétiens se pressèrent sur les bateaux et les rives; les rues ne ferment jamais et la plupart plongent dans le Nil en croyant qu'il préserve de la maladie {cite:muruj-al-dhahab p. 302-303}."
  ur: "مصر کی ایپی فینی رات — المسعودی نے 330 میں شرکت کی جب اخشد نے دریائی جزیرے پر واقع اپنے المختارہ محل سے ایک ہزار مشعلیں روشن کیں اور سیکڑوں ہزاروں، مسلمان اور عیسائی، کشتیوں اور کنارے پر جمع ہوئے۔ گلیاں کبھی بند نہیں ہوتیں اور زیادہ تر دریائے نیل میں ڈوب جاتی ہیں اس خیال سے کہ یہ بیماری سے محفوظ رکھتا ہے {حوالہ: مروج الذہب ص۔ 302-303}۔"
