label: { ar: "ليلة الغطاس", en: "The Night of the Ghatās (Epiphany)" }
summary:
  ar: "ليلة إحدى عشرة تمضي من طوبة وستة من كانون الثاني، لها شأن عظيم عند أهل مصر لا ينام الناس فيها، حضرها المسعودي سنة ثلاثين وثلاثمائة والإخشيد محمد بن طغج في داره المعروفة بالمختارة في الجزيرة الراكبة للنيل فأسرج من جانب الجزيرة وجانب الفسطاط ألف مشعل غير ما أسرج أهل مصر من المشاعل والشمع، وحضر مئات الألوف من المسلمين والنصارى في الزوارق والدور وعلى الشطوط بأنواع المآكل والمشارب وآلات الذهب والملاهي، وهي أحسن ليلة تكون بمصر ولا تغلق فيها الدروب ويغطس أكثرهم في النيل ويزعمون أن ذلك أمان من المرض ومبرئ للداء {cite:muruj-al-dhahab p. 302-303}."
  en: "Egypt's Epiphany night — al-Mas'udi attended in 330 when the Ikhshid lit a thousand torches from his al-Mukhtara palace on the river island and hundreds of thousands, Muslims and Christians, thronged boats and banks; the streets never close and most plunge into the Nile believing it preserves from sickness {cite:muruj-al-dhahab p. 302-303}."
