  en: "Fractures and the three aims for wounds of soft organs in the Canon"
  fr: "Fractures et trois buts du traitement des organes mous dans le Canon"
  ur: "قانون میں ٹوٹی ہڈی اور نرم اعضا کے زخموں کے تین مقاصد"
summary:
  ar: "يفتتح ابن سينا الفصل الثامن والعشرين في معالجات تفرق الاتصال بالعظام ثم الأعضاء اللينة، ويبين أن المراعى فيها ثلاثة أصول: قطع ما يسيل، وإلحام الشق، ومنع العفونة {cite:canon-ibn-sina-print-v1 pp.306-307}."
  en: "Ibn Sina opens chapter 28, on the treatment of breaks in continuity, with bones and then soft organs, and shows that three principles are observed: stopping what flows, joining the cleft and preventing putrefaction {cite:canon-ibn-sina-print-v1 pp.306-307}."
  fr: "Ibn Sina ouvre le chapitre 28 des ruptures de continuité par os puis organes mous, selon trois principes : arrêter les flux, réunir les lèvres et prévenir la putréfaction {cite:canon-ibn-sina-print-v1 pp.306-307}."
