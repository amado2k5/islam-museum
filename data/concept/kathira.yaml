  fr: "Kathira (gomme tragacanthe)"
  tr: "Çok"
  id: "Sangat banyak"
summary:
  ar: "الكثيراء صمغ شجرة يسميها ديسقوريدوس طرقاقيبا، وهو عند الكتاب بارد إلى يبس، قوته كقوة الصمغ، ويقع في الأكحال كوقوع الصمغ."
  en: "Kathira is the gum of a tree that Dioscorides calls tragacantha. The book classes it as cold tending to dry; its force is that of gum, and it enters eye preparations in the way gum does. The editor's footnote gives the name as goat's thorn."
  ur: "کثیراء اس درخت کا گوند ہے جسے دیسقوریدوس طرقاقیبا کہتے ہیں۔ کتاب اسے ٹھنڈا اور خشکی کی طرف مائل بتاتی ہے؛ اس کی قوت گوند جیسی ہے، اور یہ آنکھ کے سرموں میں گوند کی طرح شامل ہوتا ہے۔ حاشیے کے مطابق اس کا نام بکری کا کانٹا ہے۔"
  es: "La kathira es la goma de un árbol que Dioscórides denomina tragacanta. El libro la clasifica como fría y de tendencia seca; su fuerza es similar a la de la goma y se incorpora a los preparados oftálmicos de la misma manera. La nota al pie del editor la denomina espino de cabra."
  fr: "Kathira est la gomme d'un arbre que Dioscoride nomme tragacanthe. L'ouvrage la classe parmi les plantes froides à tendance asséchante; sa puissance est celle de la gomme, et elle entre dans la composition des préparations ophtalmiques de la même manière. La note de bas de page de l'éditeur la désigne sous le nom d'épine de chèvre."
  tr: "Birçok kişi bir ağacın sakızına Dioskoridlerin Tarqaqiba dediği türden sakız der; kitaba göre kuruması soğuk, gücü sakız gibi ve sakız gibi kohl içinde bulunur."
  id: "Banyak orang menyebut permen karet pohon yang Dioscorides sebut Tarqaqiba, yang menurut buku ini dingin untuk dikeringkan, kekuatannya seperti permen karet, dan terdapat di kohl seperti jatuhnya permen karet."
