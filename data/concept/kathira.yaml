  ar: "الكثيراء صمغ شجرة يسميها ديسقوريدوس طرقاقيبا، وهو عند الكتاب بارد إلى يبس، قوته كقوة الصمغ، ويقع في الأكحال كوقوع الصمغ."
  en: "Kathira is the gum of a tree that Dioscorides calls tragacantha. The book classes it as cold tending to dry; its force is that of gum, and it enters eye preparations in the way gum does. The editor's footnote gives the name as goat's thorn."
