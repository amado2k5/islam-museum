summary:
  ar: "ثافسيا في الكتاب هي الإدخال المكرر لتفسيا بحرف الثاء، صمغ السذاب البري، لا ينفع إلا طريا ويضعف بالقدم، حار جدا محرق قوي الإسخان والتجفيف منق مسهل منضج مفجر، ينبت الشعر وينفع داء الثعلب والآثار والكلف والبرص، ويمسح به على الاسترخاء والنقرس، وينفع من نفث القيح وعسر النفس ووجع الجنبين، وبه يختم الكتاب حرف الثاء ويذكر أن عدد أدويته سبعة {cite:canon-ibn-sina-print-v1 pp.698-699}"
  en: "Thafsiya is in the book the repeated entry for tafsiya under the letter tha, the gum of wild rue, of use only fresh and weakening with age; very hot and burning, strong in heating and drying, it cleanses, purges, ripens and bursts, grows hair, benefits alopecia, marks, freckles and baras, is rubbed on slackness and gout, and benefits the spitting of pus, difficult breathing and pain of the two sides; with it the book closes the letter tha and states that its drugs number seven {cite:canon-ibn-sina-print-v1 pp.698-699}"
  ur: "ثافسیا کتاب میں حرف ثا کے تحت تفسیا کا دہرایا ہوا اندراج ہے، جنگلی سداب کا گوند، تازہ ہی میں نافع اور پرانا ہو کر کمزور؛ بہت گرم اور جلانے والا، گرم اور خشک کرنے میں قوی، صاف کرتا ہے، دست لاتا ہے، پکاتا اور پھوڑتا ہے، بال اگاتا ہے، داء الثعلب، نشانوں، جھائیوں اور برص میں نافع ہے، ڈھیلے پن اور نقرس پر ملا جاتا ہے، اور پیپ کے تھوکنے، سانس کی تنگی اور پسلیوں کے درد میں نافع ہے؛ اسی پر کتاب حرف ثا ختم کرتی ہے اور بتاتی ہے کہ اس کی دواؤں کی تعداد سات ہے {cite:canon-ibn-sina-print-v1 pp.698-699}۔"
  es: "Thafsiya es en el libro la entrada repetida para tafsiya bajo la letra tha, la goma de ruda silvestre, de uso solo fresca y que se debilita con la edad; muy caliente y ardiente, fuerte para calentar y secar, limpia, purga, madura y revienta, hace crecer el cabello, beneficia la alopecia, las marcas, las pecas y las baras, se frota sobre la flacidez y la gota, y beneficia la expectoración de pus, la dificultad para respirar y el dolor de ambos lados; con ella el libro cierra la letra tha y afirma que sus medicamentos son siete {cite:canon-ibn-sina-print-v1 pp.698-699}"
