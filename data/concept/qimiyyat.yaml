id: concept/qimiyyat
class: concept
kind: legal
label:
  ar: "قِيمِيَّات"
  en: "Non-fungible goods (qimiyyat)"
  ur: "قیمی اموال (قیمیات)"
summary:
  ar: "القيميات جمع قيمي، وهي ما لا يوجد له مثل في السوق، أو يوجد مع تفاوت معتد به في القيمة كالحيوان والعروض والعقار، وتقابل المثليات. وتصح البيع والإجارة في القيميات باتفاق، ويختلف الفقهاء في السلم فيها، فيجيزه المالكية في كل قيمي، والشافعية فيما يُضبط بالوصف كالثياب والحيوان، ويمنعه الحنفية إلا ما استحسنوه من الذرعيات. وفي القرض يمنعه الحنفية، ويمنعه الشافعية في الأصح فيما لا ينضبط، ويجيزه المالكية. ولا يصح أن يكون رأس مال الشركة من القيميات عند جمهور الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13155} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13156} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13157} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13158} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13159}"
  en: "Non-fungible goods (qimiyyat) are items with no equivalent in the market, or whose equivalents differ noticeably in value, such as livestock, goods and property; they are the opposite of fungible goods (mithliyyat). Sale and hire of non-fungible goods are valid by agreement. The schools differ on salam: the Malikis allow it for every non-fungible good, the Shafi'is for those that can be described, such as cloth and livestock, and the Hanafis refuse it except for cases they approve on grounds of preference. On loan the Hanafis refuse it, the Shafi'is refuse it in the preferred view for goods that cannot be fixed by description, and the Malikis allow it. Most jurists hold that non-fungible goods cannot serve as capital in a partnership. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13155} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13156} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13157} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13158} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13159}"
  ur: "قیمیات قیمی کی جمع ہیں، یعنی وہ چیزیں جن کی بازار میں مثل نہ ہو، یا مثل ہو مگر قیمت میں نمایاں فرق ہو، جیسے جانور، سامان اور جائیداد، اور یہ مثلیات کے مقابل ہیں۔ قیمی چیزوں کی بیع اور اجارہ بالاتفاق درست ہے۔ سلم میں مالکیہ ہر قیمی چیز میں جواز کے قائل ہیں، شافعیہ وصف سے منضبط چیزوں جیسے کپڑے اور جانور میں، اور حنفیہ استحسان کی بنیاد پر چند کے سوا منع کرتے ہیں۔ قرض میں حنفیہ منع کرتے ہیں، شافعیہ اصح قول میں ان چیزوں میں منع کرتے ہیں جو وصف سے منضبط نہ ہوں، اور مالکیہ جواز کے قائل ہیں۔ جمہور فقہاء کے نزدیک قیمی اموال شرکت کا راس المال نہیں بن سکتے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13155} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13156} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13157} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13158} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13159}"
