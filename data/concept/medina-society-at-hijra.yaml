summary:
  ar: "الصورة التي يرسمها الرحيق المختوم للمدينة عند الهجرة: ثلاث مراحل للعهد المدني، وثلاث فئات تواجه النبي، هي الصحابة من المهاجرين والأنصار، والمشركون من قبائل المدينة وعلى رأسهم عبد الله بن أبي، واليهود الذين يعيشون بالربا والتحريض بين القبائل، وقريش خارجاً."
  en: "The picture al-Raheeq al-Makhtum draws of Medina at the Hijra: three phases of the Medinan period and three groups facing the Prophet, namely the Companions among the Emigrants and Helpers, the pagans of Medina's tribes led by Abdullah ibn Ubayy, and the Jews who lived by usury and by stirring enmity between tribes; and Quraysh from outside."
