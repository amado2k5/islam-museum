id: concept/medina-society-at-hijra
class: concept
kind: social
label: { ar: "المجتمع في المدينة عند الهجرة", en: "Medina's society at the Hijra", es: "La sociedad de Medina en la Hégira", fr: "La société de Médine à l'époque de l'Hégire", ur: "حجرہ میں مدینہ کا معاشرہ", tr: "Göç dönemindeki şehirdeki topluluk", id: "Komunitas di kota pada masa migrasi" }
summary:
  ar: "الصورة التي يرسمها الرحيق المختوم للمدينة عند الهجرة: ثلاث مراحل للعهد المدني، وثلاث فئات تواجه النبي، هي الصحابة من المهاجرين والأنصار، والمشركون من قبائل المدينة وعلى رأسهم عبد الله بن أبي، واليهود الذين يعيشون بالربا والتحريض بين القبائل، وقريش خارجاً."
  en: "The picture al-Raheeq al-Makhtum draws of Medina at the Hijra: three phases of the Medinan period and three groups facing the Prophet, namely the Companions among the Emigrants and Helpers, the pagans of Medina's tribes led by Abdullah ibn Ubayy, and the Jews who lived by usury and by stirring enmity between tribes; and Quraysh from outside."
  es: "La imagen que al-Raheeq al-Makhtum dibuja de Medina en la Hégira: tres fases del período medinense y tres grupos frente al Profeta, a saber, los Compañeros entre los Emigrantes y Ayudantes, los paganos de las tribus de Medina liderados por Abdullah ibn Ubayy, y los judíos que vivían de la usura y de fomentar la enemistad entre las tribus; y los Quraysh de fuera."
  fr: "Le tableau qu'al-Raheeq al-Makhtum dresse de Médine à l'époque de l'Hégire: trois phases de la période médinoise et trois groupes faisant face au Prophète, à savoir les Compagnons parmi les Émigrants et les Auxiliaires, les païens des tribus de Médine dirigés par Abdullah ibn Ubayy, et les Juifs qui vivaient de l'usure et en semant la discorde entre les tribus; et les Quraysh venus de l'extérieur."
  ur: "رحیق المختم نے ہجرت میں مدینہ کی تصویر کھینچی ہے: مدینہ کے دور کے تین مراحل اور تین گروہ نبی کے سامنے ہیں، یعنی مہاجرین اور مددگاروں میں سے صحابہ، عبداللہ بن ابی کی قیادت میں مدینہ کے قبائل کے مشرکین، اور یہودی جو سود اور فسادات کے درمیان رہتے تھے۔ اور قریش باہر سے۔"
  tr: "Göç sırasında mühürlü Medine nektarının resmettiği imge: Medine döneminin üç aşaması, Peygamber'e karşı üç grup: göçmenler arasındaki Sahabeler ve Ensar, Abdullah ibn Ubeyy'in liderliğindeki Medine kabilelerinden peykperestler, kabileler arasında tefecilik ve kışkırtma yaşayan Yahudiler ve dışarıdaki Kureyşler."
  id: "Gambar yang dilukis oleh nektar Madinah yang tersegel selama migrasi: tiga tahap era Madinah, tiga kelompok yang menghadapi Nabi: para Sahabat di antara para emigran dan Ansar, para politeis dari suku-suku Madinah yang dipimpin oleh Abdullah ibn Ubayy, orang Yahudi yang hidup melalui riba dan hasutan di antara suku-suku, serta Quraysh di luar."
