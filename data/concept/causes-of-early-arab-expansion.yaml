label: { ar: "أسباب سرعة الفتح العربي", en: "The causes of the early Arab expansion" }
summary:
  ar: "يعرض شكيب أرسلان في فصل «الفتح العربي» تفسيرات المؤرخين والاجتماعيين الأوروبيين لسرعة الفتوحات الإسلامية، ومنها أن العرب كانوا محاربين بالفطرة، وأن البدو يحبون الغزو والغنيمة، وأن الأمم المجاورة سئمت حكامها. ويرى أن هذه التفسيرات لا تكفي، وأن القوة الأصلية كانت المعنوية، أي حفظ القرآن ونشره وقوة رجاله، وأن الإسلام قام بنظام اجتماعي وسياسي أعدل مما عرفته الشعوب المفتوحة من حكومات مستبدة. يذكر الفتوحات الكبرى كاليرموك والقادسية ونهاوند ويشير إلى امتداد الدولة إلى ما وراء النهر. هذا تفسير المؤلف، وقد يخالفه غيره من المؤرخين."
  en: "Arslan surveys European explanations for how fast the Arab conquests moved: the warlike character of the Arabs, the Bedouin love of raiding and plunder, and the weariness of subject peoples with their rulers. He finds these insufficient and argues that the decisive force was moral: the Qur'an, its memorisation and the authority of its readers, together with a social and political order he says was fairer than the despotic governments it replaced. He notes the battles of Yarmuk, al-Qadisiyya and Nahavand and the reach of the state beyond the Oxus. This is the author's own explanation, and other historians disagree."
