summary:
  ar: "يعرض شكيب أرسلان في فصل «الفتح العربي» تفسيرات المؤرخين والاجتماعيين الأوروبيين لسرعة الفتوحات الإسلامية، ومنها أن العرب كانوا محاربين بالفطرة، وأن البدو يحبون الغزو والغنيمة، وأن الأمم المجاورة سئمت حكامها. ويرى أن هذه التفسيرات لا تكفي، وأن القوة الأصلية كانت المعنوية، أي حفظ القرآن ونشره وقوة رجاله، وأن الإسلام قام بنظام اجتماعي وسياسي أعدل مما عرفته الشعوب المفتوحة من حكومات مستبدة. يذكر الفتوحات الكبرى كاليرموك والقادسية ونهاوند ويشير إلى امتداد الدولة إلى ما وراء النهر. هذا تفسير المؤلف، وقد يخالفه غيره من المؤرخين."
  en: "Arslan surveys European explanations for how fast the Arab conquests moved: the warlike character of the Arabs, the Bedouin love of raiding and plunder, and the weariness of subject peoples with their rulers. He finds these insufficient and argues that the decisive force was moral: the Qur'an, its memorisation and the authority of its readers, together with a social and political order he says was fairer than the despotic governments it replaced. He notes the battles of Yarmuk, al-Qadisiyya and Nahavand and the reach of the state beyond the Oxus. This is the author's own explanation, and other historians disagree."
  es: "Arslan examina las explicaciones europeas sobre la rapidez de las conquistas árabes: el carácter belicoso de los árabes, la afición de los beduinos por el saqueo y el pillaje, y el cansancio de los pueblos sometidos ante sus gobernantes. Considera que estas explicaciones son insuficientes y argumenta que la fuerza decisiva fue moral: el Corán, su memorización y la autoridad de sus lectores, junto con un orden social y político que, según él, era más justo que los gobiernos despóticos a los que sustituyó. Menciona las batallas de Yarmuk, al-Qadisiyya y Nahavand, y la expansión del Estado más allá del Oxus. Esta es la explicación del autor, y otros historiadores discrepan."
  fr: "Arslan examine les explications européennes de la rapidité des conquêtes arabes: le caractère belliqueux des Arabes, le goût des Bédouins pour les raids et le pillage, et la lassitude des peuples conquis envers leurs dirigeants. Il juge ces explications insuffisantes et soutient que le facteur décisif était d'ordre moral: le Coran, sa mémorisation et l'autorité de ses lecteurs, ainsi qu'un ordre social et politique qu'il considère plus juste que les régimes despotiques qu'il a remplacés. Il mentionne les batailles de Yarmouk, d'al-Qadisiyya et de Nahavand, ainsi que l'expansion de l'État au-delà de l'Oxus. Cette explication est celle de l'auteur, et d'autres historiens la contestent."
