id: concept/canon-hidden-solution-of-continuity-and-nervous-organs
class: concept
kind: scientific
label:
  ar: "تفرق الاتصال الخفي وأعضاء الأعصاب عند ابن سينا"
  en: "Hidden separations of continuity and the nervous organs in the Canon"
  fr: "Solutions de continuité cachées et organes nerveux dans le Canon"
  ur: "پوشیدہ اتصال ٹوٹنا اور عصبی اعضا قانون میں"
  es: "Separaciones ocultas de continuidad y órganos nerviosos en el Canon"
  tr: "İbn Sina'da gizli iletişim ve sinir organlarının yayılması"
  id: "Penyebaran komunikasi okultisme dan organ saraf di Avicenna"
summary:
  ar: "يختم ابن سينا الكلام على العلامات الكلية بأن تفرق الاتصال قد يخفى فيحتاج إلى الأقوال الجزئية، وبأن أصعب الأورام وتفرق الاتصال ما كان في الأعضاء العصبية {cite:canon-ibn-sina-print-v1 p.168}."
  en: "Ibn Sina closes the general signs by noting that a separation of continuity may be hidden and need the organ-by-organ discussion, and that swellings and separations are hardest in the nervous organs {cite:canon-ibn-sina-print-v1 p.168}."
  fr: "Ibn Sina clôt les signes généraux par les ruptures cachées nécessitant l’étude organe par organe ; gonflements et ruptures seraient les plus graves dans les organes nerveux {cite:canon-ibn-sina-print-v1 p.168}."
  es: "Ibn Sina cierra los signos generales señalando que una separación de continuidad puede estar oculta y requerir una discusión órgano por órgano, y que las hinchazones y separaciones son más difíciles en los órganos nerviosos {cite:canon-ibn-sina-print-v1 p.168}."
  ur: "ابن سینا عام علامات کو یہ بتا کر بند کرتے ہیں کہ تسلسل کی علیحدگی پوشیدہ ہو سکتی ہے اور اسے اعضاء کے لحاظ سے بحث کی ضرورت ہے، اور یہ کہ اعصابی اعضاء میں سوجن اور علیحدگی سب سے زیادہ سخت ہوتی ہے۔"
  tr: "İbn Sina, iletişimin ayrılmasının gizli olabileceğine dair genel işaretler ve kısmi ifadeler gerektirdiğine dair tartışmasını ve en zor tümörlerin ve dağınık bağlantıların sinir organlarındaki tümörler olduğunu sonlandırır {cite:canon-ibn-sina-print-v1 s.168}."
  id: "Ibn Sina mengakhiri pembahasannya tentang tanda-tanda umum bahwa pemisahan komunikasi mungkin tersembunyi dan memerlukan pernyataan parsial, serta bahwa tumor dan hubungan tersebar yang paling sulit adalah yang ada di organ saraf {cite:canon-ibn-sina-print-v1 hlm.168}."
