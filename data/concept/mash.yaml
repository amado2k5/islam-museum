label:
  ar: "ماش"
  en: "Mash (the mung bean)"
  ur: "ماش"
  es: "Puré (de frijol mungo)"
summary:
  ar: "الماش قريب الجوهر من الباقلا، أفضل أوقات استعماله الصيف، معتدل في الرطوبة واليبوسة، كيموسه محمود خصوصاً المقشر، ولا نفخ فيه كنفخ الباقلا، وقد يحبس الطبيعة إذا طبخ بشروط، وقال بعضهم إن فيه مضرة بالباه {cite:canon-ibn-sina-print-v1 p.570}."
  en: "Mash is close in substance to the broad bean, best used in summer, moderate in moisture and dryness, its chyme praised especially when hulled; it lacks the broad bean's bloating, can bind the bowel when cooked in a certain way, and some said it harms desire {cite:canon-ibn-sina-print-v1 p.570}."
  ur: "ماش جوہر میں باقلا کے قریب ہے، اسے استعمال کرنے کا بہترین وقت گرمیاں ہیں، نمی اور خشکی میں معتدل، اس کا کیموس خصوصاً چھلکا اتارنے پر قابلِ تعریف ہے؛ اس میں باقلا جیسا پھولنا نہیں، ایک خاص طریقے سے پکانے پر پیٹ روکتا ہے، اور بعض نے کہا کہ اس میں باہ کو نقصان ہے {cite:canon-ibn-sina-print-v1 p.570}۔"
  es: "El puré es similar en sustancia a la haba, se usa mejor en verano, tiene un nivel moderado de humedad y sequedad, y su quimo es especialmente apreciado cuando está descascarillado; carece de la hinchazón de la haba, puede causar estreñimiento cuando se cocina de cierta manera, y algunos decían que perjudica el deseo {cite:canon-ibn-sina-print-v1 p.570}."
