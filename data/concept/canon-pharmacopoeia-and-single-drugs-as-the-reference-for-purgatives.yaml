id: concept/canon-pharmacopoeia-and-single-drugs-as-the-reference-for-purgatives
class: concept
kind: scientific
label:
  ar: "أين يُطلب علم الأدوية المسهلة وتدبيرها عند ابن سينا"
  en: "Where the Canon sends the reader for purgative recipes and doses"
  fr: "Renvois du Canon pour recettes et doses purgatives"
  ur: "قانون میں مسہل دواؤں کی ترکیب اور خوراک کہاں دیکھی جائے"
  es: "Donde el Canon remite al lector para obtener recetas y dosis purgantes."
  tr: "İbn Sina'dan müshil ilaçların bilimi ve yönetimi nerede aranıyor?"
  id: "Di mana ilmu tentang obat pencahar dan pengelolaannya dicari dari Ibn Sina?"
summary:
  ar: "يختم ابن سينا فصل المسهلات بإحالة القارئ إلى كتاب القراباذين والأدوية المفردة، فيطلب منه الأدوية المسهلة والملينة المشروبة والملطوخة بحسب الأسنان، وكيفية إصلاح كل دواء وتداركه وسقيه {cite:canon-ibn-sina-print-v1 p.285}."
  en: "Ibn Sina closes the chapters on purgatives by sending the reader to the pharmacopoeia and the book of single drugs for the purgative and softening drugs, drunk or applied, by age, and for how each drug is corrected, remedied and given {cite:canon-ibn-sina-print-v1 p.285}."
  fr: "Ibn Sina clôt les purgatifs par renvoi à la pharmacopée et aux simples : purgatifs et assouplissants à boire ou appliquer selon âge, correction et administration de chacun {cite:canon-ibn-sina-print-v1 p.285}."
  es: "Ibn Sina cierra los capítulos sobre purgantes remitiendo al lector a la farmacopea y al libro de medicamentos individuales para los purgantes y suavizantes, bebidos o aplicados, por edad, y para la forma en que cada medicamento se corrige, remedia y administra {cite:canon-ibn-sina-print-v1 p.285}."
  ur: "ابن سینا نے قارئین کو فارماکوپیا اور واحد دوائیوں کی کتاب، نشے میں یا استعمال شدہ، عمر کے لحاظ سے، اور ہر دوائی کو کیسے درست کیا جاتا ہے، علاج کیا جاتا ہے اور دیا جاتا ہے کے لیے فارماکوپیا اور واحد دوائیوں کی کتاب بھیج کر ابن سینا کے ابواب کو بند کیا جاتا ہے۔"
  tr: "İbn Sina, müshiller bölümünü 'Al-Karabadhin' ve 'Bireysel İlaçlar' kitaplarına yönlendirerek bitirir; ona müshil ve müshil olup dişlere göre içilmiş ve lekeli olarak sormasını, her ilaca nasıl onarılacağını, iyileştirileceğini ve uygun bir çözüm verileceğini sorar {cite:canon-ibn-sina-print-v1 s.285}."
  id: "Ibn Sina mengakhiri bagian tentang pencahar dengan merujuk pembaca ke buku 'Al-Qarabadhin' dan 'Obat Individu,' dengan meminta pembaca untuk meminta pencahar dan pencahar, baik yang diminum maupun yang ternoda sesuai gigi, serta cara memperbaiki, mengobati, dan memberikan larutan yang tepat pada setiap obat {cite:canon-ibn-sina-print-v1 hlm.285}."
