id: concept/northern-dwellings-in-the-canon
class: concept
kind: scientific
label: { ar: "المساكن الشمالية عند ابن سينا", en: "Northern dwellings in the Canon", ur: "قانون میں شمالی مسکن", es: "Viviendas del norte en el Canon", fr: "Habitations du nord dans le Canon", tr: "İbn Sina'daki kuzey konutları", id: "Tempat tinggal utara di Ibn Sina" }
summary:
  ar: "يعطي ابن سينا المساكن الشمالية أحكام البلاد والفصول الباردة، ويفصل ما يصيب الرجال والنساء والصبيان فيها {cite:canon-ibn-sina-print-v1 p.128}."
  en: "Ibn Sina gives northern dwellings the rulings of cold lands and seasons and details what befalls men, women and boys there {cite:canon-ibn-sina-print-v1 p.128}."
  es: "Ibn Sina da a las viviendas del norte las normas de las tierras y estaciones frías y detalla lo que les sucede a los hombres, mujeres y niños allí {cite:canon-ibn-sina-print-v1 p.128}."
  fr: "Ibn Sina donne aux habitations du nord les règles des terres froides et des saisons et détaille ce qui arrive aux hommes, aux femmes et aux garçons là-bas {cite:canon-ibn-sina-print-v1 p.128}."
  ur: "ابن سینا شمالی مکانات کو سرد زمینوں اور موسموں کے احکام دیتا ہے اور اس کی تفصیلات بتاتا ہے کہ وہاں مردوں، عورتوں اور لڑکوں پر کیا گزرتی ہے۔"
  tr: "İbn Sina, kuzeydeki konutlara toprakların ve soğuk mevsimlerin hükümlerini verir ve burada erkekler, kadınlar ve erkeklere ne olduğunu ayrıntılı olarak anlatır {cite:canon-ibn-sina-print-v1 s.128}."
  id: "Ibn Sina memberikan kekuasaan tanah dan musim dingin kepada tempat tinggal di utara, serta merinci apa yang terjadi pada pria, wanita, dan anak laki-laki di dalamnya {cite:canon-ibn-sina-print-v1 hlm.128}."
