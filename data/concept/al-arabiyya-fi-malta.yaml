tags: [arabiyya-browser, arabiyya-world]
label:
  ar: "العربية في مالطا"
  en: "Arabic in Malta"
  ur: "مالٹا میں عربی"
  fr: "l'arabe à Malte"
  es: "el árabe en Malta"
  tr: "Malta'daki araba"
  id: "Mobil di Malta"
summary:
  ar: "تعرض هذه الصفحة ما يقوله ملخص بحثي زُوّد به المتحف عن العربية في مالطا: مكانتها القانونية، والأصناف المحكية منها، والأرقام الرسمية كما وردت. ومالطا حالة فريدة في الملخص: لغة سامية وطنية رسمية في الاتحاد الأوروبي، تنحدر من العربية الصقلية وتُكتب بالحرف اللاتيني. ولم يفتح المتحف الصفحات التي يسمّيها الملخص، وقد أجاز المؤسس استعماله كما ورد في 21 نوفمبر 2026. وحيث يقول الملخص إنه لم يجد مصدراً رسمياً أو رقماً فهذا ما تقوله الصفحة بلفظه، ولا يضع المتحف رقماً من عنده."
  en: "This page sets out what a research summary supplied to the museum says about Arabic in Malta: its legal status, the varieties spoken and the official figures, each as the summary gives it. Malta is a singular case in the summary: a national Semitic language, official in the European Union, descended from Siculo-Arabic and written in the Latin alphabet. The museum did not open the pages the summary names, and the founder approved using it as supplied on 21 November 2026. Where the summary says that no official source or figure was found, this page says exactly that and supplies no number of its own."
  ur: "یہ صفحہ وہ پیش کرتا ہے جو متحف کو فراہم کردہ ایک تحقیقی خلاصہ مالٹا میں عربی کے بارے میں کہتا ہے: اس کی قانونی حیثیت، بولی جانے والی اقسام اور سرکاری اعداد و شمار، ہر ایک جیسا خلاصہ دیتا ہے۔ خلاصے میں مالٹا ایک منفرد صورت ہے: ایک قومی سامی زبان، یورپی یونین میں سرکاری، جو صقلی عربی سے اتری ہے اور لاطینی رسم الخط میں لکھی جاتی ہے۔ متحف نے خلاصے کے بیان کردہ صفحات نہیں کھولے، اور بانی نے 21 نومبر 2026 کو خلاصے کو جیسا ملا اسی طرح استعمال کرنے کی منظوری دی۔ جہاں خلاصہ کہتا ہے کہ کوئی سرکاری ماخذ یا عدد نہیں ملا وہاں یہ صفحہ بالکل یہی کہتا ہے اور اپنی طرف سے کوئی عدد نہیں دیتا۔"
  fr: "Cette page expose ce que dit un résumé de recherche remis au musée sur l'arabe à Malte : son statut juridique, les variétés parlées et les chiffres officiels, chacun tel que le résumé le donne. Malte est un cas singulier dans le résumé : une langue sémitique nationale, officielle dans l'Union européenne, descendue de l'arabo-sicilien et écrite en alphabet latin. Le musée n'a pas ouvert les pages que nomme le résumé, et le fondateur a approuvé l'usage du résumé tel que fourni le 21 novembre 2026. Là où le résumé dit qu'aucune source officielle ni aucun chiffre n'a été trouvé, cette page dit exactement cela et ne fournit aucun nombre de son cru."
  es: "Esta página expone lo que dice un resumen de investigación entregado al museo sobre el árabe en Malta: su estatus jurídico, las variedades habladas y las cifras oficiales, cada una como la da el resumen. Malta es un caso singular en el resumen: una lengua semítica nacional, oficial en la Unión Europea, descendiente del sículo-árabe y escrita en alfabeto latino. El museo no abrió las páginas que nombra el resumen, y el fundador aprobó usarlo tal como se entregó el 21 de noviembre de 2026. Donde el resumen dice que no se halló ninguna fuente oficial ni cifra, esta página dice exactamente eso y no aporta ningún número propio."
  tr: "Bu sayfa, müzenin sağladığı bir araştırma özetinin Malta'daki Arapça hakkında söylediklerini sunmaktadır: yasal statüsü, konuşulan çeşitleri ve alınan resmi numaralar. Malta, özette benzersiz bir örnektir: Avrupa Birliği'nde resmi ulusal bir Sami dilidir, Sicilya Arapçasından türemiş ve Latin alfabesiyle yazılmıştır. Müze, özet olarak adlandırdığı sayfaları açmamış ve kurucu 21 Kasım 2026'da belirtildiği gibi kullanımına izin vermiştir. Özette resmi bir kaynak veya numara bulunmadığı belirtildiğinden, sayfa kelimesi kelimesine bunu belirtir ve müze bu dilden bir numara içermemektedir."
  id: "Halaman ini menyajikan apa yang dikatakan ringkasan penelitian yang disediakan museum tentang bahasa Arab di Malta: status hukumnya, varietas yang digunakan, dan nomor resmi yang diperoleh. Malta adalah contoh unik dalam ringkasan: Malta adalah bahasa nasional resmi Semitik di Uni Eropa, berasal dari bahasa Arab Sisilia, dan ditulis dalam alfabet Latin. Museum belum membuka halaman yang disebut ringkasan, dan pendiri telah mengizinkan penggunaannya seperti yang dinyatakan pada 21 November 2026. Karena ringkasan menyatakan tidak ada sumber atau angka resmi, halaman tersebut menyatakan kata demi kata, dan museum tidak menyertakan angka dari bahasa tersebut."
