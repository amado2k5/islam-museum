  tr: "Bireysel Özgürlük"
  id: "Kebebasan Individu"
summary:
  ar: "يعرض محمد البهي في «الإسلام فطرة الله» الحرية الفردية بوصفها نتيجة النهضة الأوروبية في التفكير والسياسة والمال، ويعدّها رد فعل على القرون الوسطى {cite:al-islam-fitrat-allah-azhar p. 144}. ثم ينتقد في فصول متتابعة ما يراه غلوًا فيها: تبرير الاستعمار والوصاية بمنطق الاستقلال، وترابط المال بالسياسة والفكر في النظام الديمقراطي، واحتكار المال في يد قلة تحدد طابع الرأسمالية {cite:al-islam-fitrat-allah-azhar p. 145} {cite:al-islam-fitrat-allah-azhar p. 148} {cite:al-islam-fitrat-allah-azhar p. 150}. وهذه قراءة المؤلف ونقده للنموذج الغربي؛ وهو يرى أن الصراع بين أصحاب المال وغيرهم لا يقع حيث يكون الإيمان في القلوب، ويستشهد بالتحذير القرآني من فتنة المال {cite:al-islam-fitrat-allah-azhar p. 149}."
  en: "Al-Bahi presents individual liberty in thought, politics and wealth as a product of the European Renaissance and a reaction against the Middle Ages (p. 144). He then criticises what he calls its excess: a freedom of thought used to justify colonial tutelage, the economic and political ties of democracy, and the concentration of wealth that marks capitalism (pp. 145, 148, 150). This is the author's critique of the Western model, offered from his own Islamic frame; the book does not survey the debate."
  es: "Al-Bahi presenta la libertad individual de pensamiento, política y riqueza como un producto del Renacimiento europeo y una reacción contra la Edad Media (p. 144). A continuación, critica lo que denomina su exceso: una libertad de pensamiento utilizada para justificar la tutela colonial, los vínculos económicos y políticos de la democracia y la concentración de riqueza que caracteriza al capitalismo (pp. 145, 148, 150). Esta es la crítica del autor al modelo occidental, ofrecida desde su propia perspectiva islámica; el libro no analiza el debate."
  fr: "Al-Bahi présente la liberté individuelle de pensée, de politique et de richesse comme un produit de la Renaissance européenne et une réaction contre le Moyen Âge (p. 144). Il critique ensuite ce qu'il appelle ses excès: une liberté de pensée instrumentalisée pour justifier la tutelle coloniale, les liens économiques et politiques de la démocratie et la concentration des richesses caractéristique du capitalisme (pp. 145, 148, 150). Il s'agit là de la critique que l'auteur adresse au modèle occidental, formulée dans sa propre perspective islamique; l'ouvrage ne propose pas de panorama complet du débat."
  ur: "الباہی فکر، سیاست اور دولت میں انفرادی آزادی کو یورپی نشاۃ ثانیہ کی پیداوار اور قرون وسطیٰ کے خلاف ردعمل کے طور پر پیش کرتا ہے ⁦(صفحہ 144)⁩۔ اس کے بعد وہ تنقید کرتا ہے جسے وہ اس کی زیادتی قرار دیتا ہے: ایک آزادی فکر جس کا استعمال نوآبادیاتی سرپرستی، جمہوریت کے معاشی اور سیاسی تعلقات، اور دولت کے ارتکاز کو جواز فراہم کرنے کے لیے کیا جاتا ہے جو سرمایہ داری کو نشان زد کرتا ہے ⁦(صفحہ 145، 148، 150)⁩۔ یہ مغربی ماڈل پر مصنف کی تنقید ہے، جو اس کے اپنے اسلامی فریم سے پیش کی گئی ہے۔ کتاب بحث کا جائزہ نہیں لیتی۔"
  tr: "\"İslam, Tanrı'nın Doğası\" adlı eserinde Muhammed El-Bahi, bireysel özgürlüğü Avrupa'nın düşünce, siyaset ve finans rönesansının bir sonucu olarak sunar ve bunu Orta Çağ'a bir tepki olarak görür {cite:al-islam-fitrat-allah-azhar s. 144}. Daha sonra, ardışık bölümlerde abartı olarak gördüğü şeyleri eleştirir: sömürgeciliği ve koruyuculuğu bağımsızlık mantığıyla meşrulaştırmak, demokratik sistemde paranın siyaset ve düşünceyle iç içe geçmesi ve kapitalizmin karakterini tanımlayan birkaç kişinin elindeki paranın tekelini {cite:al-islam-fitrat-allah-azhar s. 148} {cite:al-islam-fitrat-allah-azhar s. 150}. Bu, yazarın Batı modelini okuması ve eleştirisidir; zenginler ile başkaları arasındaki çatışmanın, iman kalpte olduğunda gerçekleşmediğine inanır ve zenginliğin sınavına karşı Kur'an uyarısına atıfta bulunur {cite:al-islam-fitrat-allah-azhar, s. 149}."
  id: "Dalam \"Islam, Hakikat Tuhan,\" Muhammad Al-Bahi menyajikan kebebasan individu sebagai hasil dari kebangkitan Eropa dalam pemikiran, politik, dan keuangan, menganggapnya sebagai reaksi terhadap Abad Pertengahan {cite:al-islam-fitrat-allah-azhar hlm. 144}. Ia kemudian mengkritik dalam bab-bab berturut-turut apa yang ia anggap sebagai berlebihan: membenarkan kolonialisme dan penjagaan melalui logika kemerdekaan, keterkaitan uang dengan politik dan pemikiran dalam sistem demokrasi, serta monopoli uang di tangan segelintir orang yang mendefinisikan karakter kapitalisme {cite:al-islam-fitrat-allah-azhar hlm. 145} {cite:al-islam-fitrat-allah-azhar hlm. 148} {cite:al-islam-fitrat-allah-azhar hlm. 150}. Ini adalah pembacaan dan kritik penulis terhadap model Barat; ia percaya bahwa konflik antara orang kaya dan orang lain tidak terjadi ketika iman ada di hati, mengutip peringatan Al-Qur'an terhadap ujian kekayaan {cite:al-islam-fitrat-allah-azhar, hlm. 149}."
