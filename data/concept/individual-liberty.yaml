label:
  ar: الحرية الفردية
  en: Individual liberty (critique)
summary:
  ar: "يعرض محمد البهي في «الإسلام فطرة الله» الحرية الفردية بوصفها نتيجة النهضة الأوروبية في التفكير والسياسة والمال، ويعدّها رد فعل على القرون الوسطى {cite:al-islam-fitrat-allah-azhar p. 144}. ثم ينتقد في فصول متتابعة ما يراه غلوًا فيها: تبرير الاستعمار والوصاية بمنطق الاستقلال، وترابط المال بالسياسة والفكر في النظام الديمقراطي، واحتكار المال في يد قلة تحدد طابع الرأسمالية {cite:al-islam-fitrat-allah-azhar p. 145} {cite:al-islam-fitrat-allah-azhar p. 148} {cite:al-islam-fitrat-allah-azhar p. 150}. وهذه قراءة المؤلف ونقده للنموذج الغربي؛ وهو يرى أن الصراع بين أصحاب المال وغيرهم لا يقع حيث يكون الإيمان في القلوب، ويستشهد بالتحذير القرآني من فتنة المال {cite:al-islam-fitrat-allah-azhar p. 149}."
  en: "Al-Bahi presents individual liberty in thought, politics and wealth as a product of the European Renaissance and a reaction against the Middle Ages (p. 144). He then criticises what he calls its excess: a freedom of thought used to justify colonial tutelage, the economic and political ties of democracy, and the concentration of wealth that marks capitalism (pp. 145, 148, 150). This is the author's critique of the Western model, offered from his own Islamic frame; the book does not survey the debate."
