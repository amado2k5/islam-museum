id: concept/al-quruh-fi-al-anf
class: concept
kind: scientific
label:
  ar: القروح في الأنف
  en: The ulcers in the nose
  fr: "Les ulcères du nez"
  ur: ناک میں چھالے
  es: "Las úlceras en la nariz"
  tr: "Burunda yaralar"
  id: "Borok di hidung"
summary:
  ar: قد يتولد في الأنف قروح إما من بخارات حادة أو رديئة أو من نوازل حادة، وهي إما منتنة عفنة وإما خشكريشات وإما قروح بثرية وإما قروح سلاخة وهي إما ظاهرة وإما باطنة {cite:canon-ibn-sina-print-v2 p.246}
  en: 'Ulcers may be bred in the nose from sharp or bad vapours or from sharp catarrhs; they are either stinking putrid ulcers, scabby crusted ones, pustular ones, or excoriating ones ⁦(the editor''s gloss: wounds leading to the stripping of the skin)⁩ — and either apparent or hidden {cite:canon-ibn-sina-print-v2 p.246}'
  fr: "Selon le Canon, des ulcères du nez peuvent être causés par des vapeurs âcres ou mauvaises, ou par des catarrhes âcres. Ils peuvent être putrides et fétides, couverts de croûtes, pustuleux ou excoriants (glose de l’éditeur : des plaies qui entraînent le détachement de la peau). Ils sont apparents ou cachés {cite:canon-ibn-sina-print-v2 p.246}"
  ur: 'ناک میں چھالے تیز یا بری بخارات یا تیز نزلوں سے پیدا ہو سکتے ہیں؛ وہ یا بدبو دار سڑے ہوتے ہیں یا خشک پھپھولے والے یا دانے دار یا چھلنی اتارنے والے ⁦(محرر کی وضاحت: ایسے زخم جو کھل کے اترنے کا سبب بنیں)⁩ — اور یا ظاہر ہوتے ہیں یا باطن {cite:canon-ibn-sina-print-v2 p.246}'
  es: "Las úlceras nasales pueden originarse por vapores irritantes o desagradables, o por catarros agudos; pueden ser úlceras fétidas y pútridas, costrosas, pustulosas o excoriantes (la glosa del editor: heridas que provocan el desprendimiento de la piel), y pueden ser visibles u ocultas {cite:canon-ibn-sina-print-v2 p.246}."
  tr: "Burunda yaralar ya keskin veya kötü buharlardan ya da kötü kokulu şiddetli lezyonlardan veya çıngıraklardan, ülserlerden veya pul pul yaralardan oluşabilir; bunlar hem görünür hem de içsel olabilir {cite:canon-ibn-sina-print-v2 s.246}"
  id: "Luka di hidung dapat berupa asap tajam atau busuk, atau lesi atau gemeretak berbau tidak sedap yang parah, tukak lambung, atau luka bersisik; luka ini bisa terlihat maupun internal {cite:canon-ibn-sina-print-v2 hlm.246}"
