id: concept/al-mubhamat
class: concept
kind: discipline
label:
  ar: "مبهمات القرآن"
  en: "The unnamed in the Qur'an (al-mubhamat)"
  ur: "قرآن کے مبہمات"
summary:
  ar: "علم بتعيين من أُبهم ذكره في القرآن من الأشخاص والأماكن وغيرها، وهو النوع السادس عند الزركشي؛ صنف فيه السهيلي «التعريف والإعلام» وتلاه ابن عساكر بـ«التكميل والإتمام»، ولا يُبحث فيه عما استأثر الله بعلمه."
  en: "The science of identifying persons, places and other things the Qur'an leaves unnamed; al-Zarkashi's sixth type. Al-Suhayli wrote al-Ta'rif wa-l-I'lam on it and Ibn Asakir followed with al-Takmil wa-l-Itmam; it does not inquire into what God has kept to His own knowledge."
  ur: "قرآن میں جن اشخاص، مقامات وغیرہ کا نام مبہم رکھا گیا ان کی تعیین کا علم؛ زرکشی کی چھٹی نوع۔ سہیلی نے اس پر «التعریف والاعلام» لکھی اور ابن عساکر نے «التکمیل والاتمام» سے اس کی تکمیل کی؛ اس میں اس کی جستجو نہیں کی جاتی جس کا علم اللہ نے اپنے لیے خاص رکھا۔"
