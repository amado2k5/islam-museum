id: concept/al-mubhamat
class: concept
kind: discipline
label:
  ar: "مبهمات القرآن"
  en: "The unnamed in the Qur'an (al-mubhamat)"
  fr: "Les non-nommés dans le Coran (al-mubhamat)"
  ur: "قرآن کے مبہمات"
  es: "Los innominados en el Corán (al-mubhamat)"
  tr: "Kur'an'ın belirsizlikleri"
  id: "Ketidakpastian Al-Qur'an"
summary:
  ar: "علم بتعيين من أُبهم ذكره في القرآن من الأشخاص والأماكن وغيرها، وهو النوع السادس عند الزركشي؛ صنف فيه السهيلي «التعريف والإعلام» وتلاه ابن عساكر بـ«التكميل والإتمام»، ولا يُبحث فيه عما استأثر الله بعلمه."
  en: "The science of identifying persons, places and other things the Qur'an leaves unnamed; al-Zarkashi's sixth type. Al-Suhayli wrote al-Ta'rif wa-l-I'lam on it and Ibn Asakir followed with al-Takmil wa-l-Itmam; it does not inquire into what God has kept to His own knowledge."
  fr: "La science qui identifie les personnes, les lieux et les autres choses que le Coran laisse sans nom ; le sixième type d'al-Zarkashi. Al-Suhayli écrivit sur elle al-Ta'rif wa-l-I'lam et Ibn Asakir le suivit avec al-Takmil wa-l-Itmam ; elle ne s'enquiert pas de ce que Dieu a réservé à Sa propre science."
  ur: "قرآن میں جن اشخاص، مقامات وغیرہ کا نام مبہم رکھا گیا ان کی تعیین کا علم؛ زرکشی کی چھٹی نوع۔ سہیلی نے اس پر «التعریف والاعلام» لکھی اور ابن عساکر نے «التکمیل والاتمام» سے اس کی تکمیل کی؛ اس میں اس کی جستجو نہیں کی جاتی جس کا علم اللہ نے اپنے لیے خاص رکھا۔"
  es: "La ciencia de identificar personas, lugares y otras cosas que el Corán deja sin nombrar; el sexto tipo de al-Zarkashi. Al-Suhayli escribió al-Ta'rif wa-lI'lam sobre ella, e Ibn Asakir continuó con al-Takmil wa-l-Itmam; no indaga sobre lo que Dios ha reservado a Su conocimiento."
  tr: "Kur'an'da adı geçmeyen kişiler, yerler ve diğerleri gibi kişileri tanımlayarak anladı. Bu, Al-Zerkashi'ye göre altıncı tiptir; Al-Suhaili \"Al-Ta'rif wa al-I'lam\"ı yazdı, ardından İbn Asakir \"El-Tekmil ve İtmamm\" ile geldi ve yalnızca Allah'ın bilgisini aramaz."
  id: "Ia memahaminya dengan menggambarkan orang-orang yang tidak disebutkan dalam Al-Qur'an, seperti tempat-tempat, dan lainnya. Menurut Al-Zarkashi, ini adalah tipe keenam; Al-Suhaili menulis \"Al-Ta'rif wa al-I'lam,\" diikuti oleh Ibn Asakir dengan \"Al-Takmil wa Itmamm,\" dan tidak hanya mencari pengetahuan tentang Allah."
