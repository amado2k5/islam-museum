label: { ar: "العلاج", en: "Medical treatment (al-mu'alaja)" }
summary:
  ar: "يعرض الفن الرابع من الكتاب الأول تصنيف وجوه المعالجات بحسب الأمراض الكلية، في اثنين وثلاثين فصلاً {cite:canon-ibn-sina-print-v1 p.267}. ويرى ابن سينا أن العلاج يتم بثلاثة أشياء: التدبير والتغذية، واستعمال الأدوية، واستعمال أعمال اليد {cite:canon-ibn-sina-print-v1 p.267}. وللتدبير أحكام تناسب أحكام الأدوية من جهة كيفيتها، وللغذاء أحكام في الكمية، فقد يُمنع أو يُقلَّل أو يُعدَل أو يُزاد فيه {cite:canon-ibn-sina-print-v1 p.267}."
  en: "Fann 4 of Book I classifies the modes of treatment by general diseases, in thirty-two chapters {cite:canon-ibn-sina-print-v1 p.267}. Ibn Sina says treatment is completed by three things: regimen with diet, the use of drugs, and manual procedures {cite:canon-ibn-sina-print-v1 p.267}. The rules of regimen in quality match those of drugs, while food has its own rules of quantity: it may be withheld, reduced, adjusted or increased {cite:canon-ibn-sina-print-v1 p.267}."
