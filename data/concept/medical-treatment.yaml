label: { ar: "العلاج", en: "Medical treatment (al-mu'alaja)", es: "Tratamiento médico (al-mu'alaja)", fr: "traitement médical (al-mu'alaja)" }
summary:
  ar: "يعرض الفن الرابع من الكتاب الأول تصنيف وجوه المعالجات بحسب الأمراض الكلية، في اثنين وثلاثين فصلاً {cite:canon-ibn-sina-print-v1 p.267}. ويرى ابن سينا أن العلاج يتم بثلاثة أشياء: التدبير والتغذية، واستعمال الأدوية، واستعمال أعمال اليد {cite:canon-ibn-sina-print-v1 p.267}. وللتدبير أحكام تناسب أحكام الأدوية من جهة كيفيتها، وللغذاء أحكام في الكمية، فقد يُمنع أو يُقلَّل أو يُعدَل أو يُزاد فيه {cite:canon-ibn-sina-print-v1 p.267}."
  en: "Fann 4 of Book I classifies the modes of treatment by general diseases, in thirty-two chapters {cite:canon-ibn-sina-print-v1 p.267}. Ibn Sina says treatment is completed by three things: regimen with diet, the use of drugs, and manual procedures {cite:canon-ibn-sina-print-v1 p.267}. The rules of regimen in quality match those of drugs, while food has its own rules of quantity: it may be withheld, reduced, adjusted or increased {cite:canon-ibn-sina-print-v1 p.267}."
  es: "El Fann 4 del Libro I clasifica los modos de tratamiento según las enfermedades generales, en treinta y dos capítulos {cite:canon-ibn-sina-print-v1 p.267}. Ibn Sina afirma que el tratamiento se completa con tres elementos: un régimen dietético, el uso de medicamentos y procedimientos manuales {cite:canon-ibn-sina-print-v1 p.267}. Las reglas del régimen en cuanto a la calidad coinciden con las de los medicamentos, mientras que la comida tiene sus propias reglas en cuanto a la cantidad: puede ser retenida, reducida, ajustada o aumentada {cite:canon-ibn-sina-print-v1 p.267}."
  fr: "Le chapitre 4 du Livre I classe les traitements selon les maladies générales, en trente-deux chapitres (voir Canon Ibn Sina, vol. 1, p. 267). Ibn Sina affirme que le traitement repose sur trois éléments: un régime alimentaire, l’usage de médicaments et des interventions manuelles (voir Canon Ibn Sina, vol. 1, p. 267). Les règles de qualité du régime alimentaire sont similaires à celles des médicaments, tandis que les règles de quantité de l’alimentation sont spécifiques: elle peut être supprimée, réduite, ajustée ou augmentée (voir Canon Ibn Sina, vol. 1, p. 267)."
