summary:
  ar: "المرزنجوش حار يابس في الثالثة، لطيف مفتح محلل، ودهنه مسخن حاد، ينتفع به في الصداع والشقيقة وسدد الدماغ والتواء العصب والاستسقاء وعسر البول والمغص، ويطلى على الورم البلغمي ولسع العقرب {cite:canon-ibn-sina-print-v1 p.564}."
  en: "Marzanjush is hot and dry in the third degree, fine, opening and dissolving, and its oil is warming and sharp; the book uses it for headache, migraine, brain obstructions, twisted sinew, dropsy, difficulty of urine and colic, and as a paint for phlegmatic swellings and scorpion sting {cite:canon-ibn-sina-print-v1 p.564}."
  ur: "مرزنجوش تیسرے درجے میں گرم خشک، لطیف، کھولنے اور تحلیل کرنے والا ہے، اور اس کا تیل گرم کرنے والا اور تیز ہے؛ کتاب اسے سر درد، آدھے سر کے درد، دماغ کی رکاوٹوں، رگ کے مڑنے، استسقا، پیشاب کی دشواری اور مروڑ میں، اور بلغمی ورم اور بچھو کے ڈنک پر لیپ میں استعمال کرتی ہے {cite:canon-ibn-sina-print-v1 p.564}۔"
  es: "Marzanjush es caliente y seco en tercer grado, fino, abre y disuelve, y su aceite es cálido y penetrante; el libro lo usa para el dolor de cabeza, la migraña, las obstrucciones cerebrales, los tendones retorcidos, la hidropesía, la dificultad para orinar y los cólicos, y como pintura para las hinchazones flemáticas y las picaduras de escorpión {cite:canon-ibn-sina-print-v1 p.564}."
  fr: "Marzanjush est chaud et sec au troisième degré, fin, ouvrant et dissolvant, et son huile est chauffante et piquante; le livre l'utilise pour les maux de tête, les migraines, les obstructions cérébrales, les tendons tordus, l'hydropisie, les difficultés à uriner et les coliques, et comme peinture pour les gonflements phlegmatiques et les piqûres de scorpion {cite:canon-ibn-sina-print-v1 p.564}."
  tr: "Marzangosh üçüncü sezonda sıcak ve kurudur, hafif, hafifçe ve çözünmüştür, keskin ısınan yağ içerir. Baş ağrısı, migren, beyin felci, sinir burkulmaları, asit, dizuri ve kolik için faydalıdır. Flegmatik tümörler ve akrep sokmalarıyla kaplıdır {cite:canon-ibn-sina-print-v1 s.564}."
  id: "Marzangosh panas dan kering pada musim ketiga, ringan, ringan, dan larut, dengan lemak panas yang tajam. Ia berguna untuk sakit kepala, migrain, stroke otak, keseleo saraf, ascit, disuria, dan kolik. Tertutup tumor flegmatik dan sengatan kalajengking {cite:canon-ibn-sina-print-v1 hlm.564}."
