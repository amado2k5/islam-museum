label: { ar: "آطام يثرب", en: "The utum (tower-fortresses) of Yathrib" }
summary:
  ar: "الأطم القصر الحصين المرتفع؛ كانت يثرب قبل الهجرة مدينة أبراج منعزلة لا بيوت متصلة: يحصّل ابن النجار تسعة وخمسين أطماً لليهود وثلاثة عشر أطماً للعرب النازلين عليهم قبل الأوس والخزرج، ويورد ابن زبالة أسماء كثير منها. من المسمّى في وفاء الوفا: أطم الشبعان لبني عكوة في ثَمَغ صدقة عمر بن الخطاب، وأطم الشَّرَعي لأهل الشوط دون ذُباب، وأطم أهل الوالج بطرفه مما يلي قناة، والأطمان المعروفان بالشيخين لليهود بمفضاة المسجد الذي صلى فيه النبي حين سار إلى أحد، وأطما أهل زبالة عند كومة أبي الحراء {cite:samhudi-wafa-al-wafa p. 177}."
  en: "An utm is a high fortified tower; pre-Hijra Yathrib was a town of separate towers rather than contiguous houses — Ibn al-Najjar counts fifty-nine utum for the Jews and thirteen for the Arabs settled among them before the Aws and Khazraj, and Ibn Zabala names many. Al-Samhudi names several: the Shab'an tower of Banu 'Ukka in Thamgh of 'Umar's endowment, the Shar'i tower of the Shawt folk below Dhubab, the Walij tower by its end toward Qanat, the two 'Shaykhan' towers held by Jews at the depression of the mosque where the Prophet prayed marching to Uhud, and the two towers of the Zabala folk by Abu'l-Hurra's mound {cite:samhudi-wafa-al-wafa p. 177}."
