label: { ar: "آطام يثرب", en: "The utum (tower-fortresses) of Yathrib", es: "El utum (torre-fortaleza) de Yathrib", fr: "Les utum (tours-forteresses) de Yathrib" }
summary:
  ar: "الأطم القصر الحصين المرتفع؛ كانت يثرب قبل الهجرة مدينة أبراج منعزلة لا بيوت متصلة: يحصّل ابن النجار تسعة وخمسين أطماً لليهود وثلاثة عشر أطماً للعرب النازلين عليهم قبل الأوس والخزرج، ويورد ابن زبالة أسماء كثير منها. من المسمّى في وفاء الوفا: أطم الشبعان لبني عكوة في ثَمَغ صدقة عمر بن الخطاب، وأطم الشَّرَعي لأهل الشوط دون ذُباب، وأطم أهل الوالج بطرفه مما يلي قناة، والأطمان المعروفان بالشيخين لليهود بمفضاة المسجد الذي صلى فيه النبي حين سار إلى أحد، وأطما أهل زبالة عند كومة أبي الحراء {cite:samhudi-wafa-al-wafa p. 177}. ومن أطام الأوس والخزرج بعد إذلال اليهود: «واقم» الذي ابتناه بنو عبد الأشهل لحضير بن سماك فسُميت الناحية به، و«الرَّعَل» لصخرة أم بني عبد الأشهل — وبه فخروا يوم بعاث — و«المسيّر» لبني حارثة الذي حوصروا فيه، و«الريان» لبني مجذعة بن حارثة عند مسجدهم في دارهم الثانية {cite:samhudi-wafa-al-wafa p. 202-204}."
  en: "An utm is a high fortified tower; pre-Hijra Yathrib was a town of separate towers rather than contiguous houses — Ibn al-Najjar counts fifty-nine utum for the Jews and thirteen for the Arabs settled among them before the Aws and Khazraj, and Ibn Zabala names many. Al-Samhudi names several: the Shab'an tower of Banu 'Ukka in Thamgh of 'Umar's endowment, the Shar'i tower of the Shawt folk below Dhubab, the Walij tower by its end toward Qanat, the two 'Shaykhan' towers held by Jews at the depression of the mosque where the Prophet prayed marching to Uhud, and the two towers of the Zabala folk by Abu'l-Hurra's mound {cite:samhudi-wafa-al-wafa p. 177}. Among the Aws–Khazraj towers after the Jews' subjugation: 'Waqim', built by Banu Abd al-Ashhal for Hudayr ibn Simak and giving its name to the quarter; 'al-Ra'l' of Sakhra umm Banu Abd al-Ashhal, their battle-pride at Bu'ath; 'al-Musayyir' of Banu Haritha, in which they were besieged; and 'al-Rayyan' of Banu Mujadhdhi'a ibn Haritha by their mosque in their second quarter {cite:samhudi-wafa-al-wafa p. 202-204}."
  es: "Un utm es una torre fortificada alta; antes de la Hégira, Yathrib era una ciudad de torres separadas en lugar de casas contiguas. Ibn al-Najjar cuenta cincuenta y nueve utum para los judíos y trece para los árabes asentados entre ellos antes de los Aws y Khazraj, e Ibn Zabala nombra muchos. Al-Samhudi nombra varios: la torre Shab'an de Banu 'Ukka en Thamgh de la fundación de 'Umar, la torre Shar'i del pueblo Shawt debajo de Dhubab, la torre Walij en su extremo hacia Qanat, las dos torres 'Shaykhan' ocupadas por judíos en la depresión de la mezquita donde el Profeta oró marchando a Uhud, y las dos torres del pueblo Zabala junto al montículo de Abu'l-Hurra {cite:samhudi-wafa-al-wafa p. 177}. Entre las torres de Aws-Khazraj después de la subyugación de los judíos: 'Waqim', construida por Banu Abd al-Ashhal para Hudayr ibn Simak y que da nombre al barrio; 'al-Ra'l' de Sakhra umm Banu Abd al-Ashhal, su orgullo de batalla en Bu'ath; 'al-Musayyir' de Banu Haritha, en la que fueron sitiados; y 'al-Rayyan' de Banu Mujadhdhi'a ibn Haritha junto a su mezquita en su segundo barrio {cite:samhudi-wafa-al-wafa p. 202-204}."
  fr: "Un utm est une haute tour fortifiée; avant l’Hégire, Yathrib était une ville composée de tours isolées plutôt que de maisons contiguës. Ibn al-Najjar recense cinquante-neuf utm pour les Juifs et treize pour les Arabes installés parmi eux avant les Aws et les Khazraj, et Ibn Zabala en mentionne plusieurs. Al-Samhudi en cite plusieurs: la tour Shab’an des Banu ’Ukka à Thamgh, liée à la fondation d’Umar; la tour Shar’i des Shawt en contrebas de Dhubab; la tour Walij à son extrémité vers Qanat; les deux tours « Shaykhan » tenues par les Juifs au creux de la mosquée où le Prophète pria en se rendant à Uhud; et les deux tours des Zabala près du tertre d’Abu’l-Hurra (voir: Samhudi-wafa-al-wafa, p. 177). Parmi les tours Aws-Khazraj après la subjugation des Juifs: « Waqim », construite par Banu Abd al-Ashhal pour Hudayr ibn Simak et donnant son nom au quartier; « al-Ra'l » de Sakhra umm Banu Abd al-Ashhal, leur fierté de bataille à Bu'ath; « al-Musayyir » de Banu Haritha, où ils furent assiégés; et « al-Rayyan » de Banu Mujadhdhi'a ibn Haritha près de leur mosquée dans leur deuxième quartier {cite: samhudi-wafa-al-wafa p. 202-204}."
