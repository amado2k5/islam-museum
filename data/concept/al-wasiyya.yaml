label:
  ar: "الوصية"
  en: "Bequest (wasiyya)"
  fr: "Le legs (wasiyya)"
  ur: "وصیت"
  es: "Legado (wasiyya)"
  tr: "Vasiyet"
  id: "Vasiyet"
summary:
  ar: "يتناول الشعراوي الوصية في سياق الميراث: تُنفذ بعد الوصية والدين في ترتيب الآية، وتُقدَّم الوصية في النص لعناية الشرع بها، بينما يُقضى الدين أولاً في التنفيذ لأن له مطالباً. ويذكر أن الإسلام حدّ الوصية بالثلث لئلا تضر بالورثة، وأن من يكتب ديناً لا حقيقة له ليحرم بعض ورثته يبقى موقفه أمام الله {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2029}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2033}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2034}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2035} ويذكر ابن قدامة في كتاب الوصايا أن الوصية بالمال هي التبعة به بعد الموت، وأن أصلها الكتاب والسنة والإجماع، فاستدل بالكتاب على ذكر الوصية في آية الميراث، وبالسنة على حديث سعد بن أبي وقاص في الثلث، وحديث ابن عمر أن المسلم لا يبيت ليلتين إلا ووصيته مكتوبة عنده، وحديث أبي أمامة «لا وصية لوارث»، وأجمع العلماء على جواز الوصية. {cite:mughni-ibn-qudama p.1387}."
  en: "Al-Sha'rawi treats the bequest within the law of inheritance. The verse mentions the bequest before the debt, which he explains as emphasis, while in execution the debt is paid first because it has a claimant. He says Islam limited the bequest to a third so that heirs are not harmed, and that a man who writes a false debt to deprive relatives remains answerable before God {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2029}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2033}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2034}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2035} Ibn Qudama's book of bequests defines the property bequest as a charge laid upon it after death, grounded in the Book, the Sunna and consensus: he cites the Book's mention of the bequest in the inheritance verse, Sa'd ibn Abi Waqqas's report on the third, Ibn Umar's report that a Muslim should not spend two nights without his will written, and Abu Umama's 'there is no bequest to an heir'; the jurists agree on its permissibility. {cite:mughni-ibn-qudama p.1387}."
  fr: "Al-Sha’rawi traite du legs dans le cadre du droit successoral. Le verset mentionne le legs avant la dette, ce qu’il explique comme une insistance, tandis que dans l’exécution la dette est payée en premier parce qu’elle a un créancier. Il dit que l’islam a limité le legs au tiers afin que les héritiers ne soient pas lésés, et qu’un homme qui inscrit une fausse dette pour priver des proches reste responsable devant Dieu {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2029}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2033}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2034}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2035} Le livre des legs d’Ibn Qudama définit le legs de biens comme une charge qui leur est attachée après la mort, fondée sur le Livre, la Sunna et le consensus : il cite la mention du legs par le Livre dans le verset de l’héritage, le récit de Sa’d ibn Abi Waqqas sur le tiers, le récit d’Ibn Umar selon lequel un musulman ne devrait pas passer deux nuits sans que son testament soit écrit, et le « pas de legs à un héritier » d’Abu Umama ; les juristes s’accordent sur sa licéité. {cite:mughni-ibn-qudama p.1387}."
  ur: "شعراوی وصیت کو ورثہ کے قانون کے اندر رکھتے ہیں۔ آیت میں وصیت کا ذکر قرض سے پہلے آتا ہے، جسے وہ اہتمام کے لیے بتاتے ہیں، جبکہ عملی طور پر قرض پہلے ادا ہوتا ہے کیونکہ اس کا مطالبہ کرنے والا ہوتا ہے۔ ان کے مطابق اسلام نے وصیت کو ایک تہائی تک محدود کیا تاکہ ورثہ کو نقصان نہ پہنچے {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2029}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2033}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2034}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2035}۔"
  es: "Al-Sha'rawi trata el legado dentro de la ley de herencia. El versículo menciona el legado antes de la deuda, lo que explica como énfasis, mientras que en ejecución la deuda se paga primero porque tiene un reclamante. Dice que el Islam limitó el legado a un tercio para que los herederos no sean perjudicados, y que un hombre que escribe una deuda falsa para privar a los parientes sigue siendo responsable ante Dios {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2029}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2033}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2034}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2035} El libro de legados de Ibn Qudama define el legado de bienes como una carga impuesta sobre ellos después de la muerte, fundamentada en el Corán, la Sunna y el consenso: cita la mención del legado en el versículo de la herencia, el informe de Sa'd ibn Abi Waqqas sobre el tercero, el informe de Ibn Umar de que un musulmán no debe pasar dos noches sin su testamento escrito, y la afirmación de Abu Umama de que \"no hay legado para un heredero\"; los juristas coinciden en su permisibilidad. {cite:mughni-ibn-qudama p.1387}."
  tr: "Al-Shaarawi, vasiyeti miras bağlamında ele alır: vasiyetname, vasiyetnameden sonra ve borçtan sonra ayet sırasına göre yapılır ve vasiyet, Şeriat'ın dikkatiyle metinde sunulurken, borç önce bir talebi olduğu için icrada ödenir. İslam'ın, varislere zarar vermemek için miras bırakma sınırını üçte birini koyduğu ve gerçek olmayan bir borç yazarak bazı varislerini elinden alan kişinin Allah'taki konumunda kaldığı belirtilir {cite:tafsir-sharawi-khawatir-scan-vol-vol-vol-2 s. 2029}{cite:tafsir-sharawi-khawatir-scan-vol-vol-2 s. 2033}{cite:tafsir-sharawi-khawatir-scan-vol-cül-2 s. 2035} İbn Qudame, vasiyet kitabı'nda miras bırakmanın ölümden sonra miras bırakmanın sorumlu olduğunu ve kökeninin Kur'an, Sünnet ve uzlaşma olduğunu belirtir. Kitabı, miras ayetindeki vasiyetin ve Sad'd bin Abi'nin hadislerindeki Sünnet'in bahsedilmesi için kanıt olarak kullanmıştır Üçte biri konusunda reşit değildir ve İbn Ömer'in hadisinde, bir Müslüman iki gece boyunca vasiyeti yazılı olmadan kalmaz ve Ebu Umeme'nin hadisi şöyle der: 'Varis için vasiyet yoktur.' Alimler vasiyet yapmanın caizliği konusunda oybirliğiyle hemfikirdir. {Cite:Mughni-ibn-Qudama s.1387}."
  id: "Al-Shaarawi memperlakukan wasiat dalam konteks warisan: wasiat dibuat dalam urutan ayat setelah dan sesudah wasiat, dan meskipun wasiat disajikan dalam teks dengan perhatian Syariah, hutang dibayar dalam pelaksanaan karena itu adalah klaim terlebih dahulu. Dinyatakan bahwa Islam menetapkan sepertiga batas warisan untuk menghindari merugikan ahli waris, dan seseorang yang menulis hutang palsu dan mengambil beberapa ahli waris tetap berada di hadapan Allah {cite:tafsir-sharawi-khawatir-scan-vol-vol-vol-2 hlm. 2029}{cite:tafsir-sharawi-khawatir-scan-vol-vol-2 hlm. 2033}{cite:tafsir-sharawi-khawatir-scan-vol-jul-2 hlm. 2035} Ibn Qudame menyatakan dalam bukunya wasiatnya bahwa warisan bertanggung jawab atas warisan setelah kematian dan asal-usulnya adalah Al-Qur'an, Sunnah, dan rekonsiliasi. Ia menggunakan kitab tersebut sebagai bukti untuk menyebutkan wasiat dalam ayat warisan dan Sunnah dalam hadits Sad'd bin Abi. Ia belum cukup umur untuk sepertiga, dan dalam hadis Ibn Umar, seorang Muslim tidak dapat tinggal tanpa menulis wasiatnya selama dua malam, dan hadis Abu Umamah mengatakan: 'Tidak ada wasiat untuk ahli waris.' Para ulama sepakat tentang diperbolehkannya membuat surat wasiat. {Sitasi: Mughni-ibn-Qudama hlm.1387}."
