id: concept/al-wasiyya
class: concept
kind: legal
label:
  ar: "الوصية"
  en: "Bequest (wasiyya)"
  ur: "وصیت"
summary:
  ar: "يتناول الشعراوي الوصية في سياق الميراث: تُنفذ بعد الوصية والدين في ترتيب الآية، وتُقدَّم الوصية في النص لعناية الشرع بها، بينما يُقضى الدين أولاً في التنفيذ لأن له مطالباً. ويذكر أن الإسلام حدّ الوصية بالثلث لئلا تضر بالورثة، وأن من يكتب ديناً لا حقيقة له ليحرم بعض ورثته يبقى موقفه أمام الله {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2029}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2033}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2034}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2035}."
  en: "Al-Sha'rawi treats the bequest within the law of inheritance. The verse mentions the bequest before the debt, which he explains as emphasis, while in execution the debt is paid first because it has a claimant. He says Islam limited the bequest to a third so that heirs are not harmed, and that a man who writes a false debt to deprive relatives remains answerable before God {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2029}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2033}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2034}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2035}."
  ur: "شعراوی وصیت کو ورثہ کے قانون کے اندر رکھتے ہیں۔ آیت میں وصیت کا ذکر قرض سے پہلے آتا ہے، جسے وہ اہتمام کے لیے بتاتے ہیں، جبکہ عملی طور پر قرض پہلے ادا ہوتا ہے کیونکہ اس کا مطالبہ کرنے والا ہوتا ہے۔ ان کے مطابق اسلام نے وصیت کو ایک تہائی تک محدود کیا تاکہ ورثہ کو نقصان نہ پہنچے {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2029}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2033}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2034}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2035}۔"
wings: [ideas]
themes: [family-marriage-kinship]
issue:
  ar: "كيف تُرتَّب الوصية والدين في التنفيذ، وما حدّ الوصية الذي يمنع الضرر بالورثة؟"
  en: "In what order are bequest and debt executed, and what limit prevents harm to heirs?"
  ur: "وصیت اور قرض کی ادائیگی کی ترتیب کیا ہے، اور کون سی حد ورثہ کو نقصان سے بچاتی ہے؟"
perspectives:
  - tradition: sunni
    id: sunni-sharawi-third-limit
    stance:
      ar: "الوصية مقيدة بالثلث، وعدم الإضرار بالورثة، والدين مقدّم على الوصية في التنفيذ"
      en: "The bequest is limited to a third, must not harm heirs, and the debt comes before the bequest in execution"
      ur: "وصیت ایک تہائی تک محدود ہے، ورثہ کو نقصان نہ پہنچائے، اور عملدرآمد میں قرض وصیت سے پہلے ہے"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقرر الشعراوي هذه الأحكام في تفسير الآية، ويستدل بالتقديم اللفظي للوصية على عناية الشرع بها، وبأن الدين يُنفذ أولاً لأن له مطالباً {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2029}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2033}."
      en: "Sha'rawi states these rules in his exegesis, reading the bequest's position first in the verse as care for it, and holding that the debt is executed first because it has a claimant {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2029}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2033}."
      ur: "شعراوی یہ احکام آیت کی تفسیر میں بیان کرتے ہیں؛ وصیت کو آیت میں پہلے ذکر کرنے کو وہ اس کے اہتمام پر محمول کرتے ہیں، اور قرض کو اس لیے پہلے ادا کیا جاتا ہے کہ اس کا مطالبہ کرنے والا ہوتا ہے {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2029}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2033}۔"
    sources: [source/tafsir-sharawi-khawatir-scan-vol-2]
