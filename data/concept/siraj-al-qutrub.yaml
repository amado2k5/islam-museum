label:
  ar: "سراج القطرب"
  en: "Siraj al-qutrub (the lamp of the qutrub)"
  ur: "سراج القطرب"
summary:
  ar: "سراج القطرب في الكتاب نبت قريب من الزوفا، له زهر شبيه بالخربق فرفيري اللون كأنه سراج على رأس نبت أخضر، المستعمل بزره، حار في الأولى يابس في الثانية، مفتح غالبه القبض يقطع النزف كيف كان، مدمل جداً، وينفع من لسع العقرب {cite:canon-ibn-sina-print-v1 p.588}."
  en: "Siraj al-qutrub is in the book a plant close to hyssop, with a flower like hellebore, purple in colour, like a lamp on the head of a green plant; its seed is what is used, hot in the first degree and dry in the second, opening but mostly astringent, cutting bleeding however it comes, greatly healing, and it helps the sting of the scorpion {cite:canon-ibn-sina-print-v1 p.588}."
  ur: "سراج القطرب کتاب میں زوفا کے قریب ایک پودا ہے، اس کا پھول خربق جیسا ارغوانی رنگ کا ہے گویا سبز پودے کے سر پر چراغ ہو؛ اس کا بیج برتا جاتا ہے، پہلے درجے میں گرم اور دوسرے میں خشک، کھولنے والا مگر اس پر قبض غالب، خون کو جیسے بھی بہے روکتا ہے، بہت زخم بھرنے والا، اور بچھو کے ڈنک میں مفید ہے {cite:canon-ibn-sina-print-v1 p.588}۔"
