  en: "Balsan (balsam)"
  fr: "Balsan (baumier)"
  ur: "بلسان ⁦(بلسم)⁩"
summary:
  ar: "شجرة مصرية شبيهة الورق والرائحة بالسذاب، ودهنها أفضل من حبها، وحبها أقوى من عودها. لدهنه قبض وتحليل وتفتيح، وهو يُنفع في الصداع والصمم والحكة والجرب وأوجاع الأسنان والحلق، وفي تنقية القروح والجراح، وفي عرق النسا والتشنج، والربو وضيق النفس، وفي أمراض المعدة والكبد. ويذكر الكتاب له أيضاً أحكاماً في الرحم والجنين تُسجَّل كما وردت {cite:canon-ibn-sina-print-v1 p.384}، {cite:canon-ibn-sina-print-v1 p.385}، {cite:canon-ibn-sina-print-v1 p.386}."
  en: "An Egyptian tree with leaves and a smell like the rue, its oil better than its seed, and its seed stronger than its wood. The book says its oil opens obstructions and cleanses wounds and ulcers. It is recommended for headache, deafness, itch, scabies, pains of the teeth and throat, sciatica, spasm, asthma, shortness of breath, and disorders of the stomach and liver. The book also lists uterine and foetal effects, recorded as its own listing {cite:canon-ibn-sina-print-v1 p.384}, {cite:canon-ibn-sina-print-v1 p.385}, {cite:canon-ibn-sina-print-v1 p.386}."
  fr: "Arbre égyptien aux feuilles et à l’odeur semblables à celles de la rue ; son huile est meilleure que sa graine, elle-même plus forte que son bois. Selon le livre, son huile lève les obstructions et nettoie plaies et ulcères. Il est recommandé dans le texte contre céphalées, surdité, démangeaisons, gale, douleurs dentaires et de gorge, sciatique, spasmes, asthme, essoufflement et troubles de l’estomac et du foie. Le livre énumère aussi des effets sur l’utérus et le fœtus, rapportés comme ses propres indications {cite:canon-ibn-sina-print-v1 p.384}, {cite:canon-ibn-sina-print-v1 p.385}, {cite:canon-ibn-sina-print-v1 p.386}."
  ur: "یہ ایک مصری درخت ہے جس کے پتے اور مہک سذاب جیسی ہے، اس کا تیل اس کے بیج سے بہتر ہے اور بیج لکڑی سے زیادہ قوی ہے۔ کتاب کے مطابق اس کا تیل رکاوٹیں کھولتا ہے، زخموں اور چھالوں کو صاف کرتا ہے، اور سر درد، بہرے پن، خارش، جرب، دانت اور حلق کے درد، عرق النسا، اینٹھن، دمے اور سانس کی تنگی، اور معدے اور جگر کی بیماریوں میں موافق ہے۔ کتاب اس کے رحم اور جنین سے متعلق اقوال بھی درج کرتی ہے، جو کتاب کی فہرست کے طور پر لکھے گئے ہیں {cite:canon-ibn-sina-print-v1 p.384}، {cite:canon-ibn-sina-print-v1 p.385}، {cite:canon-ibn-sina-print-v1 p.386}۔"
