label:
  ar: "خلاف العلماء في الألفاظ الأعجمية في القرآن: ثلاثة أقوال في المعرَّب"
  en: "The scholars' dispute over non-Arabic words in the Qur'an: three positions on the mu'arrab"
  ur: "قرآن میں عجمی الفاظ پر علماء کا اختلاف: معرب کے بارے میں تین اقوال"
  fr: "La dispute des savants sur les mots non arabes du Coran : trois positions sur le mu'arrab"
  es: "La disputa de los sabios sobre las palabras no árabes en el Corán: tres posiciones sobre el mu'arrab"
  tr: "Kur'an'daki Yabancı Kelimeler Üzerine Âlimlerin Tartışması: Araplaştırılmış Kelimeler Üzerine Üç Görüş"
  id: "Perselisihan para ulama tentang kata-kata asing dalam Al-Qur'an: Tiga Pendapat tentang Kata-kata yang telah diarabadikan"
summary:
  ar: "تقسم الصفحة ما نقله ملخص بحثي عن الخلاف في ورود ألفاظ غير عربية في القرآن إلى ثلاثة أقوال: الإنكار، ويمثله الشافعي في الرسالة وأبو عبيدة في مجاز القرآن والطبري في جامع البيان؛ والقبول بعد التعريب، ويميل إليه السيوطي الذي يجمع نحو مئة إلى مئة وخمسة وعشرين لفظاً من لغات الحبشة والفارسية والسريانية والعبرية واليونانية والنبطية والقبطية؛ والتوسط بأن الأصل أعجمي لكن اللفظ عند النزول عربي. ويلخص القرطبي في مقدمته الإجماع على نفي الجمل والعبارات غير العربية وجواز كون الأعلام أعجمية."
  en: "The page sorts what a research summary reports of the dispute over non-Arabic words in the Qur'an into three positions: denial, represented by al-Shafi'i in al-Risala, Abu Ubayda in Majaz al-Qur'an and al-Tabari in Jami' al-bayan; acceptance after arabisation, to which al-Suyuti inclines, compiling some 100 to 125 words said to be Abyssinian, Persian, Syriac, Hebrew, Greek, Nabataean and Coptic among others; and a mediating view that the origin is foreign but the word is Arabic by the time of revelation. Al-Qurtubi's introduction summarises the consensus that there are no non-Arabic sentences or phrases and that proper names may be foreign."
  ur: "صفحہ ایک تحقیقی خلاصے کے نقل کردہ اس اختلاف کو، کہ قرآن میں غیر عربی الفاظ آئے ہیں یا نہیں، تین اقوال میں بانٹتا ہے: انکار، جس کی نمائندگی الرسالہ میں شافعی، مجاز القرآن میں ابو عبیدہ اور جامع البیان میں طبری کرتے ہیں؛ تعریب کے بعد قبول، جس کی طرف سیوطی مائل ہیں اور جو حبشی، فارسی، سریانی، عبرانی، یونانی، نبطی اور قبطی وغیرہ کے تقریباً سو سے سوا سو الفاظ جمع کرتے ہیں؛ اور وسطی قول کہ اصل عجمی ہے مگر نزول کے وقت لفظ عربی ہے۔ قرطبی اپنے مقدمے میں اس اجماع کا خلاصہ دیتے ہیں کہ کوئی غیر عربی جملہ یا عبارت نہیں اور اعلام عجمی ہو سکتے ہیں۔"
  fr: "La page répartit ce qu'un résumé de recherche rapporte de la dispute sur les mots non arabes du Coran en trois positions : le déni, représenté par al-Shafi'i dans al-Risala, Abu Ubayda dans Majaz al-Qur'an et al-Tabari dans Jami' al-bayan ; l'acceptation après arabisation, vers laquelle penche al-Suyuti, qui compile environ 100 à 125 mots dits abyssins, persans, syriaques, hébreux, grecs, nabatéens, coptes entre autres ; et une position médiane selon laquelle l'origine est étrangère mais le mot est arabe à la révélation. L'introduction d'al-Qurtubi résume le consensus qu'il n'y a ni phrases ni expressions non arabes et que les noms propres peuvent être étrangers."
  es: "La página reparte lo que un resumen de investigación transmite de la disputa sobre las palabras no árabes en el Corán en tres posiciones: la negación, representada por al-Shafi'i en al-Risala, Abu Ubayda en Majaz al-Qur'an y al-Tabari en Jami' al-bayan; la aceptación tras la arabización, a la que se inclina al-Suyuti, que compila unas 100 a 125 palabras dichas abisinias, persas, siríacas, hebreas, griegas, nabateas, coptas entre otras; y una posición intermedia según la cual el origen es extranjero pero la palabra es árabe en la revelación. La introducción de al-Qurtubi resume el consenso de que no hay frases ni expresiones no árabes y de que los nombres propios pueden ser extranjeros."
  tr: "Sayfa, Kur'an'da Arapça olmayan kelimelerin görülmesiyle ilgili araştırmamın özetini üç görüşe ayırıyor: inkar, El-Risalah'da El-Şafii, Majaz el-Kur'an'da Ebu Ubeyde ve Cami'l-Bayan'da El-Taberi; Araplaştırmadan sonra kabul (kabul) ki bu, Habeşçe, Farsça, Süryanice, İbranice, Yunanca, Nebati ve Kıpti dillerinden yaklaşık yüz ila yüz yirmi beş kelime toplayan Al-Suyuti tarafından destekleniyor; ve kaynağın yabancı olduğu ancak vahy anında kelimenin Arapça olduğu yönündeki aracılık. Al-Qurtubi, girişinde Arapça olmayan cümlelerin ve ifadelerin reddedilmesi ve Arapça olmayan isimlerin yabancı olmasının kabul edilebilirliği konusundaki uzlaşmayı özetliyor."
  id: "Halaman ini membagi ringkasan penelitian saya tentang ketidaksepakatan mengenai kemunculan kata-kata non-Arab dalam Al-Qur'an yang dibagi menjadi tiga pendapat: penyangkalan, yang diwakili oleh Al-Shafi'i dalam Al-Risalah, Abu Ubaidah dalam Majaz al-Qur'an, dan Al-Tabari dalam Jami' al-Bayan; penerimaan setelah Arabisasi, yang didukung oleh Al-Suyuti, yang mengumpulkan sekitar seratus hingga seratus dua puluh lima kata dari bahasa Abyssinian, Persia, Suryani, Ibrani, Yunani, Nabatean, dan Koptik; serta mediasi bahwa asal-usulnya asing tetapi kata tersebut adalah Arab pada saat wahyu. Al-Qurtubi merangkum dalam pengantarnya konsensus tentang penolakan kalimat dan frasa non-Arab serta diperbolehkannya nama non-Arab sebagai asing."
