issue:
  ar: "هل في القرآن ألفاظ من أصل غير عربي، وهل يضر ذلك بعربيته؟"
  en: "Does the Qur'an contain words of non-Arabic origin, and does that affect its being Arabic?"
  ur: "کیا قرآن میں غیر عربی اصل کے الفاظ ہیں اور کیا اس سے اس کے عربی ہونے پر اثر پڑتا ہے؟"
  fr: "Le Coran contient-il des mots d'origine non arabe, et cela touche-t-il à son caractère arabe ?"
  es: "¿Contiene el Corán palabras de origen no árabe, y afecta eso a su carácter árabe?"
perspectives:
  - tradition: sunni
    id: denial-pure-arabic
    standing: main
    stance:
      ar: "القرآن عربي خالص؛ وما يُظن أعجمياً فتوارد لغات أو لفظ عربي قد خفي."
      en: "The Qur'an is purely Arabic; apparent overlaps are coincidence or words fully Arabized before revelation."
      ur: "قرآن خالص عربی ہے؛ جو عجمی سمجھا جائے وہ زبانوں کا توارد ہے یا نزول سے پہلے مکمل معرب لفظ۔"
      fr: "Le Coran est purement arabe ; les recoupements apparents sont coïncidence ou mots pleinement arabisés avant la révélation."
      es: "El Corán es puramente árabe; los solapamientos aparentes son coincidencia o palabras plenamente arabizadas antes de la revelación."
    holders: [person/al-shafii, person/abu-ubayda-mammar, person/al-tabari]
    summary:
      ar: "يرفض الشافعي في الرسالة أي عناصر غير عربية في القرآن بشدة، ويقول إن الألفاظ النادرة الغامضة تبقى عربية وإن من زعم غير ذلك جاهل. ويصرح أبو عبيدة في مجاز القرآن بأنه نزل بلسان عربي مبين، وأن ادعاء خلاف ذلك، كأن طه نبطية، خطأ جسيم، وأن التشابه توافق لغات. ويرى الطبري في مقدمة جامع البيان وعند آية النحل 103 أنه عربي خالص لا لفظ فيه مجهول عند العرب، وأن ما نُسب إلى الفارسية والحبشية توارد لغات {cite:research-summary-quran-arabic-classical-tafsir-2026 on section b}."
      en: "Al-Shafi'i in al-Risala strongly rejects any non-Arabic elements, holding that even rare or obscure words remain Arabic and that those who claim otherwise lack knowledge. Abu Ubayda in Majaz al-Qur'an states explicitly that it was revealed in a clear Arabic tongue and that claiming otherwise, for instance that Ta-Ha is Nabataean, is a grave error, the similarities being coincidences of languages. Al-Tabari, in the introduction to Jami' al-bayan and on al-Nahl 103, holds that it is purely Arabic with no word unknown to the Arabs, and that reports attributing words to Persian or Abyssinian reflect linguistic coincidence {cite:research-summary-quran-arabic-classical-tafsir-2026 on section b}."
      ur: "شافعی الرسالہ میں قرآن میں کسی غیر عربی عنصر کو سختی سے رد کرتے ہیں، اور کہتے ہیں کہ نادر اور غامض الفاظ بھی عربی رہتے ہیں اور جو اس کے خلاف کہے وہ علم سے خالی ہے۔ ابو عبیدہ مجاز القرآن میں صراحت کرتے ہیں کہ وہ لسان عربی مبین میں نازل ہوا اور اس کے خلاف دعویٰ، مثلاً یہ کہ طہ نبطی ہے، بڑی غلطی ہے، مشابہتیں زبانوں کا توافق ہیں۔ طبری جامع البیان کے مقدمے میں اور النحل 103 پر کہتے ہیں کہ وہ خالص عربی ہے جس کا کوئی لفظ عربوں کے ہاں نامعلوم نہیں، اور جو الفاظ فارسی یا حبشی سے منسوب ہوئے وہ زبانوں کا توارد ہیں {cite:research-summary-quran-arabic-classical-tafsir-2026 on section b}۔"
      fr: "Al-Shafi'i, dans al-Risala, rejette fortement tout élément non arabe, tenant que même les mots rares ou obscurs restent arabes et que qui dit le contraire manque de savoir. Abu Ubayda, dans Majaz al-Qur'an, énonce explicitement qu'il fut révélé en langue arabe claire et que prétendre le contraire, par exemple que Ta-Ha est nabatéen, est une grave erreur, les ressemblances étant des coïncidences de langues. Al-Tabari, dans l'introduction de Jami' al-bayan et sur al-Nahl 103, tient qu'il est purement arabe, sans mot inconnu des Arabes, et que les récits attribuant des mots au persan ou à l'abyssin reflètent une coïncidence linguistique {cite:research-summary-quran-arabic-classical-tafsir-2026 on section b}."
      es: "Al-Shafi'i, en al-Risala, rechaza con fuerza todo elemento no árabe, sosteniendo que incluso las palabras raras u oscuras siguen siendo árabes y que quien diga lo contrario carece de conocimiento. Abu Ubayda, en Majaz al-Qur'an, afirma explícitamente que se reveló en lengua árabe clara y que alegar lo contrario, por ejemplo que Ta-Ha es nabateo, es un grave error, siendo las semejanzas coincidencias de lenguas. Al-Tabari, en la introducción de Jami' al-bayan y sobre al-Nahl 103, sostiene que es puramente árabe, sin palabra desconocida para los árabes, y que los relatos que atribuyen palabras al persa o al abisinio reflejan coincidencia lingüística {cite:research-summary-quran-arabic-classical-tafsir-2026 on section b}."
    sources: [source/research-summary-quran-arabic-classical-tafsir-2026]
  - tradition: sunni
    id: acceptance-after-arabization
    stance:
      ar: "وجدت ألفاظ أجنبية قليلة عُرّبت وصارت من الاستعمال العربي، ولا يُخرج ذلك القرآن عن عربيته."
      en: "Limited foreign words exist but were Arabized and became part of Arabic usage."
      ur: "محدود غیر ملکی الفاظ ہیں جو معرب ہو کر عربی استعمال کا حصہ بن گئے۔"
      fr: "Des mots étrangers en nombre limité existent mais furent arabisés et entrés dans l'usage arabe."
      es: "Existen pocas palabras extranjeras, arabizadas y convertidas en parte del uso árabe."
    holders: [person/al-suyuti]
    summary:
      ar: "يجمع السيوطي في المتوكلي والمهذب والإتقان قوائم بما يُظن غير عربي، نحو مئة إلى مئة وخمسة وعشرين لفظاً من الحبشية والفارسية والسريانية والعبرية واليونانية والنبطية والقبطية وغيرها، ويميل بحسب الملخص إلى قبول المعرَّب بعد تعريبه {cite:research-summary-quran-arabic-classical-tafsir-2026 on section b}."
      en: "Al-Suyuti in al-Mutawakkili, al-Muhadhdhab and al-Itqan compiles lists of purported foreign words, approximately 100 to 125 items from Abyssinian, Persian, Syriac, Hebrew, Greek, Nabataean, Coptic and others, and leans, according to the summary, toward acceptance of the mu'arrab after Arabization {cite:research-summary-quran-arabic-classical-tafsir-2026 on section b}."
      ur: "سیوطی المتوکلی، المہذب اور الاتقان میں مشتبہ غیر عربی الفاظ کی فہرستیں جمع کرتے ہیں، تقریباً سو سے سوا سو الفاظ حبشی، فارسی، سریانی، عبرانی، یونانی، نبطی، قبطی وغیرہ سے، اور خلاصے کے مطابق تعریب کے بعد معرب کو قبول کرنے کی طرف مائل ہیں {cite:research-summary-quran-arabic-classical-tafsir-2026 on section b}۔"
      fr: "Al-Suyuti, dans al-Mutawakkili, al-Muhadhdhab et al-Itqan, compile des listes de mots présumés étrangers, environ 100 à 125 éléments abyssins, persans, syriaques, hébreux, grecs, nabatéens, coptes et autres, et penche, selon le résumé, vers l'acceptation du mu'arrab après arabisation {cite:research-summary-quran-arabic-classical-tafsir-2026 on section b}."
      es: "Al-Suyuti, en al-Mutawakkili, al-Muhadhdhab y al-Itqan, compila listas de palabras presuntamente extranjeras, unos 100 a 125 elementos abisinios, persas, siríacos, hebreos, griegos, nabateos, coptos y otros, y se inclina, según el resumen, a aceptar el mu'arrab tras su arabización {cite:research-summary-quran-arabic-classical-tafsir-2026 on section b}."
    sources: [source/research-summary-quran-arabic-classical-tafsir-2026]
  - tradition: sunni
    id: mediating-origin-foreign-usage-arabic
    stance:
      ar: "الأصل قد يكون أجنبياً، لكنه عند النزول يعمل لفظاً عربياً تاماً."
      en: "Origins may be foreign, but by the time of revelation the words function as fully Arabic."
      ur: "اصل غیر ملکی ہو سکتی ہے مگر نزول کے وقت لفظ مکمل عربی کے طور پر چلتا ہے۔"
      fr: "Les origines peuvent être étrangères, mais à la révélation les mots fonctionnent comme pleinement arabes."
      es: "Los orígenes pueden ser extranjeros, pero en la revelación las palabras funcionan como plenamente árabes."
    holders: [person/al-qurtubi]
    summary:
      ar: "يلخص القرطبي في مقدمة الجامع الإجماع على أنه لا توجد في القرآن جمل أو عبارات غير عربية، وأن الأعلام قد تكون أعجمية، ويعرض الفريقين والقول الوسط بأن الألفاظ المعرَّبة عربية {cite:research-summary-quran-arabic-classical-tafsir-2026 on section b}."
      en: "Al-Qurtubi in the introduction to al-Jami' summarises the consensus that there are no non-Arabic sentences or phrases, notes that proper names may be foreign, and presents both camps plus the mediating Arabized position {cite:research-summary-quran-arabic-classical-tafsir-2026 on section b}."
      ur: "قرطبی الجامع کے مقدمے میں اس اجماع کا خلاصہ دیتے ہیں کہ قرآن میں کوئی غیر عربی جملہ یا عبارت نہیں، اور اعلام عجمی ہو سکتے ہیں، اور دونوں فریق اور وسطی قول کہ معرب الفاظ عربی ہیں پیش کرتے ہیں {cite:research-summary-quran-arabic-classical-tafsir-2026 on section b}۔"
      fr: "Al-Qurtubi, dans l'introduction d'al-Jami', résume le consensus qu'il n'y a pas de phrases ni d'expressions non arabes, note que les noms propres peuvent être étrangers, et présente les deux camps ainsi que la position médiane arabisée {cite:research-summary-quran-arabic-classical-tafsir-2026 on section b}."
      es: "Al-Qurtubi, en la introducción de al-Jami', resume el consenso de que no hay frases ni expresiones no árabes, señala que los nombres propios pueden ser extranjeros, y presenta ambos bandos más la posición intermedia arabizada {cite:research-summary-quran-arabic-classical-tafsir-2026 on section b}."
