summary:
  ar: "القطران في الكتاب عصارة شجرة تسمى الشربين، حار يابس في الرابعة، يحفظ جثة الميت ويحمر ويكوي، ينفع من القمل والجرب ويسكن الصداع البارد ويقتل دود الأذن ويحد البصر ويقتل الديدان وينفع من نهشة الحية ذات القرن {cite:canon-ibn-sina-print-v1 p.647}"
  en: "Qatran is in the book the sap of a tree called al-sharbin, hot and dry in the fourth degree, which preserves the body of the dead, reddens and cauterises; it benefits lice and itch, soothes cold headache, kills ear worms, sharpens the sight, kills worms and benefits the bite of the horned viper {cite:canon-ibn-sina-print-v1 p.647}"
  ur: "قطران کتاب میں شربین نامی درخت کا رس ہے، چوتھے درجے میں گرم خشک، جو میت کے جسم کو محفوظ رکھتا، سرخ کرتا اور داغتا ہے؛ جوؤں اور خارش میں نافع ہے، ٹھنڈے سر درد کو تسکین دیتا، کان کے کیڑوں کو مارتا، نظر تیز کرتا، کیڑوں کو مارتا اور سینگ والے سانپ کے ڈسنے میں نافع ہے {cite:canon-ibn-sina-print-v1 p.647}۔"
  es: "En el libro, Qatran es la savia de un árbol llamado al-sharbin, caliente y seca en el cuarto grado, que conserva el cuerpo de los muertos, enrojece y cauteriza; beneficia a los piojos y la picazón, alivia el dolor de cabeza por frío, mata los gusanos del oído, agudiza la vista, mata los gusanos y beneficia la mordedura de la víbora cornuda {cite:canon-ibn-sina-print-v1 p.647}"
  fr: "Le qatran est décrit dans le livre comme la sève d'un arbre appelé al-sharbin, chaude et sèche au quatrième degré, qui conserve le corps des morts, rougit et cautérise; elle est bénéfique contre les poux et les démangeaisons, apaise les maux de tête dus au froid, tue les vers intestinaux, aiguise la vue, tue les vers et est bénéfique contre la morsure de la vipère cornue {cite:canon-ibn-sina-print-v1 p.647}"
