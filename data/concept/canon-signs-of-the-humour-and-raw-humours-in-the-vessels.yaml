id: concept/canon-signs-of-the-humour-and-raw-humours-in-the-vessels
class: concept
kind: scientific
label:
  ar: "دلائل جنس الخلط والأخلاط النيئة في العروق عند ابن سينا"
  en: "Signs of the humour and raw humours in the vessels in the Canon"
  fr: "Signes des humeurs et humeurs crues dans les vaisseaux dans le Canon"
  ur: "خلط کی نوع کی علامات اور رگوں میں کچے اخلاط قانون میں"
  es: "Signos del humor y los humores crudos en los vasos del Canon"
  tr: "İbn Sina'ya göre damarlarda karışım ve ham humorlar cinsine dair kanıtlar"
  id: "Bukti genus pencampuran dan humor mentah dalam pembuluh darah menurut Ibn Sina"
summary:
  ar: "يستدل ابن سينا على جنس الخلط من البول والعرق وحال النوم والسهر، ويعد امتناع النوم مع التدبير الجيد دليلاً رديئاً، ثم يصف علاج ما كانت الأخلاط النيئة فيه غالبة في العروق بالراحة والغذاء وما يقطع كالسكنجبين العسلي وقدر يسير من الفلفل أو الكموني {cite:canon-ibn-sina-print-v1 p.248}."
  en: "Ibn Sina judges the kind of humour from the urine, the sweat and the state of sleep and wakefulness, counts the refusal of sleep despite good regimen a bad sign, and then describes the treatment when raw humours predominate in the vessels: rest, food, what cuts, such as honey oxymel, and a small amount of pepper or cumin {cite:canon-ibn-sina-print-v1 p.248}."
  fr: "Ibn Sina détermine l’humeur par urine, sueur, sommeil et veille ; l’insomnie malgré un bon régime serait mauvaise. Il décrit ensuite les humeurs crues dominantes dans les vaisseaux : repos, nourriture, agents incisifs comme l’oxymel au miel et peu de poivre ou cumin {cite:canon-ibn-sina-print-v1 p.248}."
  es: "Ibn Sina juzga el tipo de humor a partir de la orina, el sudor y el estado de sueño y vigilia, considera la negativa a dormir a pesar de un buen régimen como un mal signo, y luego describe el tratamiento cuando predominan los humores crudos en los vasos: descanso, comida, lo que corta, como oxímel de miel, y una pequeña cantidad de pimienta o comino {cite:canon-ibn-sina-print-v1 p.248}."
  ur: "ابن سینا پیشاب، پسینے اور نیند اور بیداری کی کیفیت سے مزاح کی نوعیت کا اندازہ لگاتا ہے، اچھی غذا کے باوجود نیند کے انکار کو ایک بری علامت شمار کرتا ہے، اور پھر برتنوں میں کچے مزاح کے غالب ہونے کے علاج کو بیان کرتا ہے: آرام، کھانا، کیا کٹ جاتا ہے، جیسے شہد آکسیمل، اور تھوڑی مقدار میں کالی مرچ۔ {حوالہ:کینن ابن سینا پرنٹ v1 صفحہ 248}۔"
  tr: "İbn Sina, idrar, ter, uyku hali ve geç saatlere kadar uyanık kalmanın karışımını göstererek, iyi yönetime rağmen uykusuzluğu zayıf kanıt olarak görür. Daha sonra, damarlarda ham karışımların hakim olduğu durumlarda dinlenme, yiyecek ve bal temizleyicisi ile az miktarda karabiber veya kimyon gibi diğer malzemelerle tedavi edildiğini anlatır {cite:canon-ibn-sina-print-v1 s.248}."
  id: "Ibn Sina mengutip jenis pencampuran urin, keringat, kondisi tidur, dan begadang larut, mengingat kurangnya tidur meskipun pengelolaan yang baik sebagai bukti yang buruk. Ia kemudian menggambarkan bagaimana mengobati mereka yang campuran mentah mendominasi pembuluh darah dengan istirahat, makanan, dan bahan lain seperti madu scavengbeen dan sedikit lada atau jintan {cite:canon-ibn-sina-print-v1 hlm.248}."
