label: { ar: "دلائل جنس الخلط والأخلاط النيئة في العروق عند ابن سينا", en: "Signs of the humour and raw humours in the vessels in the Canon", ur: "خلط کی نوع کی علامات اور رگوں میں کچے اخلاط قانون میں" }
summary:
  ar: "يستدل ابن سينا على جنس الخلط من البول والعرق وحال النوم والسهر، ويعد امتناع النوم مع التدبير الجيد دليلاً رديئاً، ثم يصف علاج ما كانت الأخلاط النيئة فيه غالبة في العروق بالراحة والغذاء وما يقطع كالسكنجبين العسلي وقدر يسير من الفلفل أو الكموني {cite:canon-ibn-sina-print-v1 p.248}."
  en: "Ibn Sina judges the kind of humour from the urine, the sweat and the state of sleep and wakefulness, counts the refusal of sleep despite good regimen a bad sign, and then describes the treatment when raw humours predominate in the vessels: rest, food, what cuts, such as honey oxymel, and a small amount of pepper or cumin {cite:canon-ibn-sina-print-v1 p.248}."
