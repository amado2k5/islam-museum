id: concept/lawn-fiqh
class: concept
kind: legal
label:
  ar: "اللَّوْن"
  en: "Colour (lawn): water, cleansing, injury and usurped goods"
  ur: "رنگ (لون): پانی، طہارت، جنایت اور غصب شدہ مال"
summary:
  ar: "اللون في اللغة هيئة كالسواد والحمرة، وفي اصطلاح الفقهاء صفة للشيء يُشترط بيانها في المسلم فيه كالبياض والحمرة والسواد {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13720}. تتعلق باللون أحكام متعددة: تغير لون الماء بالنجاسة فيصير نجساً، وبالمخالط الطاهر فيُفرق بين ما يمكن الاحتراز منه وما لا يمكن، وإزالة لون النجاسة من الثوب، وأثر تغيره في الجناية على السن والظفر والوجه، وفي ضمان المغصوب إذا صُبغ، وفي ضمان الصباغ والأجير إذا خالف اللون المطلوب {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13720-13731}."
  en: "Lawn, colour, in lexicon is an appearance such as blackness or redness; in fiqh it is a quality of a thing that must be stated in a sale on description, such as whiteness, redness or blackness {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13720}. Several rulings depend on colour: water changed by an impurity becomes impure, while water changed by a pure substance is treated differently when the change can or cannot be avoided; the colour of an impurity on cloth must be removed if possible; a change of colour in an injury to a tooth, nail or face carries compensation; and dyeing another's goods or disobeying a colour instruction affects liability {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13720-13731}."
  ur: "لون لغت میں سیاہی یا سرخی جیسی ہیئت کو کہتے ہیں؛ فقہاء کے نزدیک یہ کسی چیز کی وہ صفت ہے جسے سلم کے سودے میں بیان کرنا ضروری ہے، جیسے سفیدی، سرخی یا سیاہی {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13720}۔ رنگ سے متعلق کئی احکام ہیں: نجاست سے پانی کا رنگ بدلے تو وہ ناپاک ہو جاتا ہے، پاک چیز سے بدلے تو اس کے احکام الگ ہیں، کپڑے سے نجاست کا رنگ زائل کرنا ہوتا ہے، دانت یا ناخن یا چہرے کے رنگ بدلنے پر تاوان ہوتا ہے، اور غصب شدہ چیز کو رنگنے یا رنگ کی خلاف ورزی کی صورت میں ضمان کے احکام بدلتے ہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13720-13731}۔"
