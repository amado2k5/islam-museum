id: concept/al-nasab-wal-nisba
class: concept
kind: term
tags: [arabiyya-browser, arabiyya-scholars]
label:
  ar: "النسب والنسبة"
  en: "Nasab and nisba"
  ur: "نسب اور نسبت"
  fr: "Nasab et nisba"
  es: "Nasab y nisba"
summary:
  ar: "النسب سلسلة الانتماء إلى الأب والأجداد بابن أو بنت أو بنو، والنسبة اسم منسوب بياء النسب يربط الشخص بمكان أو قبيلة أو مهنة أو مذهب؛ ولا يدل الاسم الجغرافي على المولد بالضرورة ولا القبلي على النسب البيولوجي، كما يعرضه ملف بحثي قُدّم إلى المتحف مع جداول الأمثلة {cite:jstor-schimmel-islamic-names} {cite:bnf-kitcat-arabic-names}."
  en: "The nasab is the chain of belonging to a father and ancestors through ibn, bint or banu, and the nisba is a relational name with the ending -i that ties a person to a place, tribe, trade or school; a place nisba does not necessarily show birth and a tribal one not biological descent, as a research file supplied to the museum sets it out with tables of examples {cite:jstor-schimmel-islamic-names} {cite:bnf-kitcat-arabic-names}."
  ur: "نسب باپ اور آباء و اجداد سے تعلق کا سلسلہ ہے جو ابن، بنت یا بنو کے ذریعے بیان ہوتا ہے، اور نسبت وہ منسوب نام ہے جو یائے نسبت کے ساتھ کسی شخص کو کسی مقام، قبیلے، پیشے یا مکتبِ فکر سے جوڑتا ہے؛ جغرافیائی نسبت لازماً جائے پیدائش کی دلیل نہیں اور قبائلی نسبت لازماً حیاتیاتی نسب کی، جیسا کہ عجائب گھر کو پیش کی گئی ایک تحقیقی فائل مثالوں کے جدولوں کے ساتھ بیان کرتی ہے {cite:jstor-schimmel-islamic-names} {cite:bnf-kitcat-arabic-names}۔"
  fr: "Le nasab est la chaîne d'appartenance à un père et à des ancêtres par ibn, bint ou banu, et la nisba est un nom relationnel à terminaison en -i qui rattache une personne à un lieu, une tribu, un métier ou une école ; une nisba de lieu ne prouve pas nécessairement la naissance, ni une nisba tribale la descendance biologique, comme l'expose un dossier de recherche remis au musée avec des tableaux d'exemples {cite:jstor-schimmel-islamic-names} {cite:bnf-kitcat-arabic-names}."
  es: "El nasab es la cadena de pertenencia a un padre y a antepasados mediante ibn, bint o banu, y la nisba es un nombre relacional con terminación en -i que vincula a una persona con un lugar, una tribu, un oficio o una escuela; una nisba de lugar no demuestra necesariamente el nacimiento, ni una tribal la descendencia biológica, según lo expone un expediente de investigación entregado al museo con tablas de ejemplos {cite:jstor-schimmel-islamic-names} {cite:bnf-kitcat-arabic-names}."
