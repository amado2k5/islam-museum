id: concept/afat-al-dhihn
class: concept
kind: scientific
label:
  ar: "آفات الذهن"
  en: "Disorders of the mind (afat al-dhihn)"
  ur: "ذہن کی آفتیں ⁦(آفات الذهن)⁩"
summary:
  ar: "يبيّن ابن سينا أن ضرر الأفعال الدماغية يُعرف من ثلاثة وجوه: آفة الذكر في مؤخر الدماغ، وآفة الفكر في الجزء الأوسط، وآفة الخيال في مقدمه؛ ويذكر أن ما مال إلى النقصان من البرد وما مال إلى الاضطراب من الحر {cite:canon-ibn-sina-print-v2 p.96}"
  en: "Ibn Sina shows that harm in the acts of the brain is known in three ways: a fault of memory in the back of the brain, of thought in its middle part, and of imagination in its front; what leans to deficiency is from cold and what leans to disturbance is from heat {cite:canon-ibn-sina-print-v2 p.96}"
  ur: "ابن سینا بتاتا ہے کہ دماغی افعال کا نقصان تین طرح پہچانا جاتا ہے: یاد کی خرابی دماغ کے پچھلے حصے میں، فکر کی خرابی بیچ کے حصے میں، اور خیال کی خرابی اگلے حصے میں؛ جو کمی کی طرف مائل ہو وہ سردی سے اور جو بے ترتیبی کی طرف مائل ہو وہ گرمی سے {cite:canon-ibn-sina-print-v2 p.96}۔"
