id: concept/muakhat
class: concept
kind: social
label:
  ar: "المؤاخاة"
  en: "Mu'akhat (formal brothering)"
  es: "Mu'akhat (hermandad formal)"
  fr: "Mu'akhat (fraternité formelle)"
  ur: "مواخات ⁦(رسمی بھائی چارہ)⁩"
summary:
  ar: "المؤاخاة: رباط عقدي بين رجلين، وضعه الرسول بين المهاجرين والأنصار بعد الهجرة، جعل فيه كل مهاجري أخاً لأنصاري في السكن والعون والتناصر، وبقي من آثاره باب «الإخاء» في صحيح البخاري."
  en: "Mu'akhat: a formal pact of brotherhood the Prophet established between the Muhajirun and the Ansar after the hijra, pairing each emigrant with a Medinan host for shelter, aid and mutual support; Sahih al-Bukhari preserves a chapter on it."
  es: "Mu'akhat: un pacto formal de hermandad que el Profeta estableció entre los Muhajirun y los Ansar después de la Hégira, en el que se asignaba a cada emigrante un anfitrión de Medina para brindarle refugio, ayuda y apoyo mutuo; Sahih al-Bukhari conserva un capítulo sobre este tema."
  fr: "Mu'akhat: un pacte formel de fraternité établi par le Prophète entre les Muhajirun et les Ansar après l'Hégire, associant chaque émigrant à un hôte médinois pour l'abri, l'aide et le soutien mutuel; Sahih al-Bukhari conserve un chapitre à ce sujet."
  ur: "مواخات: نبی نے مہاجرین اور انصار کے درمیان ہجرت کے بعد اخوت کا ایک رسمی معاہدہ قائم کیا، جس میں ہر ایک مہاجر کو پناہ، امداد اور باہمی تعاون کے لیے مدینہ کے میزبان کے ساتھ جوڑا جاتا تھا۔ صحیح البخاری میں اس کا ایک باب محفوظ ہے۔"
