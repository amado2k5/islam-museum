id: concept/land-ownership-ceiling
class: concept
kind: legal
tags: [islamic-economy-browser, islamic-economy-money]
label:
  ar: تحديد الملكية الزراعية
  en: Ceiling on agricultural ownership
  es: "Límite máximo a la propiedad agrícola"
  fr: "Plafonnement de la propriété agricole"
  ur: "زرعی ملکیت پر زیادہ سے زیادہ حد"
  tr: "Tarımsal Mülkiyetin Belirlenmesi"
  id: "Menentukan Kepemilikan Pertanian"
summary:
  ar: 'يعرف المؤلف تحديد الملكية بأنه قوانين الإصلاح الزراعي التي تضع سقفًا لملكية الأرض الزراعية، فلا تنتزع الملكية كلها كما في التأميم، بل تنتزع الزيادة على الحد الأعلى {cite:usul-iqtisad-islami-0660 p. 68} {cite:usul-iqtisad-islami-0660 p. 69}. وللفقهاء المعاصرين ثلاثة آراء: جواز التحديد، وجوازه في الملكيات المستقبلة دون القائمة، وعدم جوازه مطلقًا؛ ويذكر المؤلف حجة كل فريق، ومنها أن التحديد قبل الملك تحجير وبعده غصب {cite:usul-iqtisad-islami-0660 p. 69}. ويستدل المؤلف بتوزيع النبي أموال بني النضير على المهاجرين وإعطاء ثلاثة من فقراء الأنصار، على أن الثروات تقارب بطريق التوزيع لا بالتأميم ولا بالتحديد {cite:usul-iqtisad-islami-0660 p. 69} {cite:usul-iqtisad-islami-0660 p. 70}.'
  tr: "Yazar, mülkiyet belirlemesini, tarımsal arazi mülkiyetine tavan koyan tarımsal reform yasaları olarak tanımlar. Millileştirmede olduğu gibi tüm mülkiyet alınmaz, artış maksimum sınırdan alınır {cite:usul-iqtisad-islami-0660 s. 68} {cite:usul-iqtisad-islami-0660 s. 69}. Çağdaş hukukçuların üç görüşü vardır: belirtmenin izin verilebilirliği, liste olmadan alıcı mülkiyetinde izin verilebilir olması ve mutlak izin verilmezliği; yazar, her grubun argümanını aktarır; mülkiyetten önce sınırlamanın yasak olduğu ve sonrasında gasp edilmesi {cite:usul-iqtisad-islami-0660 s. 69} gibi argümanlarını aktarır. Yazar, Peygamber'in Banu Nadir'in servetini Muhacirun arasında dağıtmasını ve üç fakir Ensar'ın vermesini kullanarak servetin millileştirme veya özgünlükle değil, dağıtım yoluyla yaklaştırıldığını, {cite:usul-iqtisad-islami-0660 s. 69} {cite:usul-iqtisad-islami-0660 s. 70} {cite:usul-iqtisad-islami-0660 s. 70}"
  id: "Penulis mendefinisikan penentuan kepemilikan sebagai undang-undang reformasi pertanian yang menetapkan batas atas kepemilikan lahan pertanian. Tidak semua kepemilikan diambil seperti dalam nasionalisasi, melainkan peningkatan diambil dari batas maksimum {cite:usul-iqtisad-islami-0660 hlm. 68} {cite:usul-iqtisad-islami-0660 hlm. 69}. Ahli hukum kontemporer memiliki tiga pendapat: diperbolehkannya spesifikasi, kelayakan kepemilikan penerima tanpa daftar, dan ketidakbolehan mutlak; penulis mengutip argumen masing-masing kelompok, termasuk bahwa pembatasan sebelum kepemilikan adalah larangan dan setelahnya pengambilalihan {cite:usul-iqtisad-islami-0660 hlm. 69}. Penulis mengutip pembagian kekayaan Banu Nadir oleh Nabi di antara Muhajirun dan pemberian tiga Ansar miskin untuk menunjukkan bahwa kekayaan diperkirakan melalui distribusi, bukan melalui nasionalisasi atau kekhususan {cite:usul-iqtisad-islami-0660 hlm. 69} {cite:usul-iqtisad-islami-0660 hlm. 70}."
