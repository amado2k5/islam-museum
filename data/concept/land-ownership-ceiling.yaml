id: concept/land-ownership-ceiling
class: concept
kind: legal
label:
  ar: تحديد الملكية الزراعية
  en: Ceiling on agricultural ownership
summary:
  ar: 'يعرف المؤلف تحديد الملكية بأنه قوانين الإصلاح الزراعي التي تضع سقفًا لملكية الأرض الزراعية، فلا تنتزع الملكية كلها كما في التأميم، بل تنتزع الزيادة على الحد الأعلى {cite:usul-iqtisad-islami-0660 p. 68} {cite:usul-iqtisad-islami-0660 p. 69}. وللفقهاء المعاصرين ثلاثة آراء: جواز التحديد، وجوازه في الملكيات المستقبلة دون القائمة، وعدم جوازه مطلقًا؛ ويذكر المؤلف حجة كل فريق، ومنها أن التحديد قبل الملك تحجير وبعده غصب {cite:usul-iqtisad-islami-0660 p. 69}. ويستدل المؤلف بتوزيع النبي أموال بني النضير على المهاجرين وإعطاء ثلاثة من فقراء الأنصار، على أن الثروات تقارب بطريق التوزيع لا بالتأميم ولا بالتحديد {cite:usul-iqtisad-islami-0660 p. 69} {cite:usul-iqtisad-islami-0660 p. 70}.'
