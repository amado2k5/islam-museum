id: concept/istirja
class: concept
kind: ethical
label:
  ar: "الاسترجاع عند المصيبة"
  en: "The istirja' formula at misfortune"
summary:
  ar: "يرى الشعراوي أن قول الاسترجاع عند المصيبة يُقرّ بأن الإنسان مملوك لله ومرجعه إليه، ويقبل المصيبة بوصفها في ملك الله، ويرجو عليها الثواب، وأن الدعاء المأثور يُرجى به أن يُخلف الله خيراً منها. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.663}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.664}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.665}"
  en: "Sha'rawi holds that saying the formula of istirja' at misfortune acknowledges that the person is God's possession and returns to Him, accepts the trial as within God's dominion, and hopes for reward; he adds the transmitted prayer asking God to reward the loss and replace it with something better {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.663}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.664}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.665}."
wings: [ideas]
themes: [spirituality-and-sufism, creed]
periods: [period/prophetic-era]
regions: [global]
issue:
  ar: "كيف يستقبل المؤمن المصيبة، وما معنى أن ينسب الإنسان ملكه إلى الله عند الفقد؟"
  en: "How should a believer receive a calamity, and what does it mean to ascribe one's possessions to God at loss?"
perspectives:
  - tradition: sunni
    id: sharawi-istirja
    stance:
      ar: "الاسترجاع إقرار بالملكية لله وقبول للمصيبة ورجاء للثواب"
      en: "Istirja' is an acknowledgement that one belongs to God, an acceptance of the trial, and a hope for reward"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يذكر الشعراوي أن المصيبة إن كانت من فعل الإنسان فلا يجزع منها، وإن كانت من غيره فيبحث في عدلها أو ظلمها، وأن المؤمن رابح في الحالين، ويذكر حديث الاسترجاع وقصة أم سلمة في تأليف الدعاء. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.664}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.665}"
      en: "Sha'rawi says that if a misfortune comes from the person's own act he should not grieve over it, and if it comes from another he should consider whether it was just or unjust; the believer gains either way. He recounts the report of the prayer of istirja' and Umm Salama's story {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.664}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.665}."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
