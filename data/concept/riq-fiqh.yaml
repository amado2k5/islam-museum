id: concept/riq-fiqh
class: concept
kind: legal
tags: [islamic-economy-browser, islamic-economy-money]
label:
  ar: "الرق"
  en: "Riq (bondage): its kinds and causes, the rights and duties of owner and slave, the marital and sexual rules, the slave's worship, transactions, crimes and inheritance, and how bondage ends"
  ur: "غلامی ⁦(رق)⁩"
  es: "Riq (esclavitud): sus tipos y causas, los derechos y deberes del amo y del esclavo, las normas matrimoniales y sexuales, el culto al esclavo, las transacciones, los delitos y la herencia, y cómo termina la esclavitud."
  fr: "L'esclavage (Riq): ses formes et ses causes, les droits et devoirs du maître et de l'esclave, les règles matrimoniales et sexuelles, le culte de l'esclave, les transactions, les crimes et l'héritage, et la fin de l'esclavage"
  tr: "kölelik"
  id: "perbudakan"
summary:
  ar: "الرق في الاصطلاح الفقهي كون الإنسان مملوكا لإنسان آخر، والأصل فيه الحرية، وقد أدخل الفقهاء أحكامه في كتبهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8858} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8859} ويدخل الرقيق في الملك بالسبي من الأعداء، وبولادة الأمة من سيدها، وبالشراء والهبة والوصية والميراث، ولا يجوز ابتداء استرقاق المسلم ولا استرقاق الحر، والأصل في الإنسان الحرية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8859} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8860} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8861} ويحرم على الكافر تملك مسلم، ويؤمر بإزالة ملكه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8862} ويعتق على المالك قريبه المحرم بمجرد الملك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8863} وللسيد على رقيقه طاعة في غير المعصية، ويتقيد استخدامه بطاقته، ويجب على السيد نفقته وكسوته، ويحرم تكليفه ما يغلبه، ويُندب الإحسان إليه، ويحرم التمثيل به، وعند المالكية والحنابلة يعتق عليه بالتمثيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8864} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8865} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8866} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8867} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8868} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8869} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8870} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8871} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8872} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8873} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8874} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8875} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8876} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8877} وللسيد أن يبيع رقيقه أو يرهنه أو يهبه، وتختلف المذاهب في بيعه بشرط العتق، وفي التفريق بين ذوي الرحم المحرم، وفي مال الرقيق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8878} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8879} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8880} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8881} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8882} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8883} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8884} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8885} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8886} وفي العبادات ينقص الرقيق عن الحر في الجمعة والحج والجهاد، وتجب زكاة ماله على سيده، ولا يصوم نذرا ولا يعتكف إلا بإذن سيده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8888} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8889} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8890} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8891} وفي الزواج يجوز للحر أن ينكح الأمة بشروط، وتتحدد أحكام الطلاق والعدة بحال الرقيق، ويستبرأ من ملك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8892} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8893} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8894} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8895} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8896} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8897} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8898} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8899} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8900} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8901} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8902} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8903} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8904} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8905} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8906} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8907} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8908} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8909} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8910} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8911} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8912} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8913} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8914} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8915} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8916} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8917} وفي الجنايات لا يقتص من الحر إذا قتل الرقيق، ويقتص من الرقيق إذا قتل حرا، وتجب قيمة الرقيق، وتختلف الكفارة في قتله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8917} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8918} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8919} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8920} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8921} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8922} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8923} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8924} وفي الحدود يُحد الرقيق بنصف حد الحر ولا يرجم، ولا يقطع بسرقة مال سيده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8925} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8926} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8927} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8928} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8930} ويُنظر في الرقيق المشترك والمبعض وأحكامهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8932} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8933} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8934} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8935} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8936} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8937} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8938} وينقضي الرق بالعتق، والكتابة، والتدبير، والاستيلاد، والعتق بحكم الشرع، والوصية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8939}"
  en: "Riq (bondage) is a person's being owned by another; freedom is the original state, and the jurists set out its rules at length. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8858} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8859} Slaves enter ownership by capture in war, by the offspring of a slave-woman, by purchase, gift, bequest and inheritance; a free Muslim may not be enslaved. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8859} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8860} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8861} A non-Muslim may not keep a Muslim slave, and must sell or free him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8862} Owning a relative within the prohibited degrees frees him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8863} The owner may command the slave in what is not sinful, but the work must be within his strength; he must provide food, clothing and care, and may not torment or disfigure him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8864} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8865} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8866} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8867} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8868} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8869} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8870} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8871} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8872} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8873} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8874} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8875} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8876} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8877} The owner may sell, pledge or give the slave, and the schools differ on sale on condition of freedom, on separating relatives in sale, and on the slave's property. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8878} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8879} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8880} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8881} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8882} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8883} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8884} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8885} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8886} In worship the slave is lighter: Friday is not obligatory, the owner pays his zakat, and his vowed fast and i'tikaf need leave; his hajj is not obligatory until freed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8888} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8889} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8890} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8891} In marriage a free man may marry a slave-woman under conditions; a slave's divorces and waiting period are counted by his condition. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8892} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8893} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8894} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8895} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8896} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8897} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8898} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8899} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8900} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8901} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8902} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8903} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8904} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8905} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8906} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8907} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8908} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8909} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8910} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8911} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8912} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8913} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8914} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8915} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8916} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8917} In crimes, a free man is not retaliated against for killing a slave; a slave who kills a free man is retaliated against; the value of a slave is owed; the hadd for a slave is half of a free man's. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8917} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8918} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8919} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8920} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8921} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8922} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8923} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8924} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8925} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8926} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8927} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8928} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8930} The co-owned and the partly freed slave have their own rules. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8932} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8933} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8934} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8935} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8936} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8937} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8938} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8939} Bondage ends by manumission, by writing-off, by the status of mudabbar or umm walad, by legal manumission and by bequest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8939}"
  ur: "رق انسان کا دوسرے انسان کی ملکیت میں ہونا ہے؛ اصل آزادی ہے، اور آزاد مسلمان کو غلام نہیں بنایا جا سکتا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8858} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8859} غلام کے حقوق و فرائض، اس کی عبادات، نکاح، جرائم اور حدود کے احکام تفصیل سے مذکور ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8864} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8917} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8925} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8939}"
  es: "Riq (esclavitud) es que una persona sea propiedad de otra; la libertad es el estado original, y los juristas establecieron sus reglas extensamente. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8858} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8859} Los esclavos entran en propiedad por captura en la guerra, por la descendencia de una mujer esclava, por compra, donación, legado y herencia; un musulmán libre no puede ser esclavizado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8859} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8860} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8861} Un no musulmán no puede tener un esclavo musulmán, y debe venderlo o liberarlo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8862} Poseer un pariente dentro de los grados prohibidos lo libera. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8863} El dueño puede ordenar al esclavo en lo que no es pecaminoso, pero el trabajo debe estar dentro de sus fuerzas; debe proporcionarle comida, ropa y cuidados, y no puede atormentarlo ni desfigurarlo. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8864} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8865} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8866} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8867} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8868} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8869} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8870} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8871} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8872} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8873} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8874} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8875} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8876} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8877} El propietario puede vender, pignorar o dar el esclavo, y las escuelas difieren en la venta en condiciones de libertad, en la separación de parientes en la venta y en la propiedad del esclavo. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8878} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8879} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8880} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8881} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8882} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8883} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8884} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8885} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8886} En el culto, el esclavo es más ligero: el viernes no es obligatorio, el dueño paga su zakat, y su ayuno prometido y el i'tikaf deben dejarse; su hajj no es obligatorio hasta que sea liberado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8888} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8889} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8890} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8891} En el matrimonio, un hombre libre puede casarse con una esclava bajo ciertas condiciones; los divorcios y el período de espera de un esclavo se cuentan según su condición. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8892} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8893} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8894} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8895} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8896} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8897} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8898} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8899} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8900} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8901} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8902} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8903} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8904} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8905} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8906} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8907} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8908} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8909} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8910} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8911} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8912} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8913} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8914} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8915} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8916} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8917} En los crímenes, un hombre libre no es castigado por matar a un esclavo; un esclavo que mata a un hombre libre es castigado; se debe el valor de un esclavo; el hadd para un esclavo es la mitad del de un hombre libre. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8917} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8918} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8919} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8920} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8921} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8922} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8923} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8924} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8925} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8926} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8927} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8928} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8930} El esclavo copropietario y el esclavo parcialmente liberado tienen sus propias reglas. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8932} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8933} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8934} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8935} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8936} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8937} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8938} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8939} La esclavitud termina en manumisión, por cancelación, por el estatus de mudabbar o umm walad, por manumisión legal y por legado. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8939}"
  fr: "L'esclavage (riq) désigne le fait d'être la propriété d'une personne par une autre; la liberté est l'état originel, et les juristes en exposent longuement les règles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8858} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8859} L'acquisition d'esclaves se fait par capture à la guerre, par descendance d'une esclave, par achat, don, legs ou héritage; un musulman libre ne peut être réduit en esclavage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8859} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8860} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8861} Un non-musulman ne peut posséder un esclave musulman et doit le vendre ou l'affranchir. Posséder un parent proche du degré prohibé l'affranchit. Le maître peut donner des ordres à l'esclave pour les tâches licites, à condition qu'elles soient à sa portée; il doit subvenir à ses besoins en nourriture, vêtements et soins, et ne doit ni le tourmenter ni le défigurer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8864} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8865} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8866} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8867} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8868} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8869} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8870} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8871} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8872} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8873} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8874} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8875} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8876} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8877} Le propriétaire peut vendre, mettre en gage ou donner l'esclave, et les écoles diffèrent sur la vente sous condition de liberté, sur la séparation des parents lors de la vente et sur la propriété de l'esclave. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8878} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8879} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8880} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8881} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8882} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8883} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8884} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8885} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8886} Dans le culte, l'esclave est dispensé des obligations suivantes: le vendredi n'est pas obligatoire, le maître s'acquitte de la zakat, et ses vœux de jeûne et d'i'tikaf sont levés; son pèlerinage à La Mecque n'est pas obligatoire tant qu'il n'est pas affranchi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8888} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8889} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8890} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8891} En matière de mariage, un homme libre peut épouser une esclave sous certaines conditions; les divorces et la période d'attente de l'esclave sont calculés en fonction de son statut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8892} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8893} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8894} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8895} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8896} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8897} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8898} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8899} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8900} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8901} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8902} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8903} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8904} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8905} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8906} {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.8907} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8908} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8909} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8910} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8911} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8912} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8913} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8914} {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.8915} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8916} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8917} En matière de crimes, un homme libre n'est pas puni pour avoir tué un esclave; un esclave qui tue un homme libre est puni; la valeur d'un esclave est due; le hadd d'un esclave est la moitié de celui d'un homme libre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8917} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8918} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8919} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8920} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8921} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8922} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8923} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8924} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8925} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8926} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8927} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8928} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8930} L'esclave copropriétaire et l'esclave partiellement affranchi ont leurs propres règles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8932} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8933} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8934} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8935} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8936} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8937} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8938} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8939} La servitude se termine par affranchissement, par radiation, par le statut de mudabbar ou d'umm walad, par affranchissement légal et par legs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8939}"
  tr: "Fıkıh terminolojisinde kölelik, bir kişinin başka bir kişiye ait olduğu ve ilkesinin özgürlük olduğu anlamına gelir. Hukukçular bu hükümleri kitaplarına dahil etmiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8858} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8859} Bir köle, düşmanlardan köleleştirilmekle, bir ulusun efendisinden doğuşla, satın alma, hediye, vasiyet ve miras yoluyla krallığa getirilir. Bir Müslümanı ya da özgür birini ilk başta köleleştirmek yasaktır ve bir kişideki ilke özgürlüktür. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8859} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8860} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8861} Gayrimüslimlerin mülk sahibi olması yasaktır ve malını kaldırması emredilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8862} Sahibi, mülkiyete sahip olduğu anda mahram akrabasından kurtulur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8863} Efendi, günah dışındaki konularda da kölesine itaat edebilir ve kullanımı yetkisiyle sınırlıdır. Efendi ona bakmak ve giydirmek, onu zorlayan şeyleri atamayı yasaklamak, iyilik tavsiye etmek ve taklit etmeyi yasaklamak zorundadır. Maliki ve Hanbali'ye göre, taklit yoluyla özgür bırakılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8864} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8865} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8866} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8867} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8868} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8869} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8870} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8871} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8872}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8873} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8874} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8875} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8876} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8877} Efendi kölesini satabilir, ipotek edebilir veya verebilir. Düşünce okulları, kölesinin serbest bırakılması koşulları, yasadışı akrabaları olanlar arasında ayrım yapılması ve kölenin mülkü konusunda farklılık gösterir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8878} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8879} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8880} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8881} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8882} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8883} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8884} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8885} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8886} İbadette köleler, Cuma namazında, Hac ve cihadda özgür insanlardan daha azdır ve servetleri üzerine zekat efendilerine zorunludur. Efendisinin izni olmadan oruç yemin etmez veya i'tikaf yapmaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8888} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8889} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8890} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8891} Evlilikte, özgür bir adam belirli koşullar altında bir köleyle evlenebilir ve boşanma ile bekleme süresi kölenin durumuna göre belirlenir ve köle beraat eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8892} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8893} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8894} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8895} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8896} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8897} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8898} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8899} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8900} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8901} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8902} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8903} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8904} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8905} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8906} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8907} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8908} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8909} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8910} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8911}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8912}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8913} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8914} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8915} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8916} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8917} Ceza davalarında, bir köle öldürülürse özgür bir kişiye, köle ise özgür bir kişi tarafından öldürülürse misilleme uygulanmaz. Kölenin değeri zorunludur ve kefaret onu öldürmekte farklılık gösterir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8917} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8918} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8919} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8920} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8921} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8922} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8923} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8924} Hudud'ta köle, özgür bir adamın haddının yarısı ile sınırlıdır, taş atılmaz, efendisinin malını çalarak da kesilmez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8925} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8926} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8927} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8928} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8930} Sıradan ve kısmi köleleri ve onların hükümlerini ele alın. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8932}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8933} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8934} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8935} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8936} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8937} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8938} Kölelik, özgürleşme, yazı, yönetim, üreme, Şeriat ve irade ile özgürleşme ile sona erer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8939}"
  id: "Dalam istilah jurisprudensi, perbudakan berarti seseorang dimiliki oleh orang lain, dan prinsipnya adalah kebebasan. Para ahli hukum telah memasukkan keputusannya ke dalam buku mereka. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8858} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8859} Seorang budak dibawa ke kerajaan melalui perbudakan dari musuh, kelahiran sebuah bangsa dari tuannya, melalui pembelian, hadiah, wasiat, dan warisan. Tidak diperbolehkan memperbudak Muslim atau orang merdeka pada awalnya, dan prinsip dalam diri seseorang adalah kebebasan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8859} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8860} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8861} Dilarang bagi non-Muslim untuk memiliki properti dan diperintahkan untuk mengambil hartanya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8862} Pemilik dibebaskan dari kerabat mahramnya segera setelah ia memiliki harta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8863} Tuan dapat mematuhi hambanya dalam hal selain dosa, dan penggunaannya dibatasi oleh otoritasnya. Tuan harus menyediakan dan mengenakan pakaian untuknya, melarang memberikan apa yang menguasainya, merekomendasikan kebaikan kepadanya, dan melarang meniru dirinya. Menurut Malikis dan Hanbali, ia dibebaskan dengan peniruan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8864} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8865} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8866} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8867} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8868} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8869} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8870} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8871} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8872} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8873} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8874} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8875} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8876} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8877} Tuan boleh menjual, menggadaikan, atau menyerahkan budaknya kepadanya. Aliran pemikiran berbeda mengenai syarat pembebasan budaknya, membedakan antara mereka yang memiliki kerabat tidak sah, dan mengenai harta milik budak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8878} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8879} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.8880} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8881} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8882} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8883} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8884} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8885} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8886} Dalam ibadah, budak adalah orang yang kurang merdeka dalam salat Jumat, Haji, dan jihad, dan zakat atas kekayaan mereka wajib bagi tuannya. Dia tidak berpuasa atau melaksanakan i'tikaf kecuali dengan izin gurunya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8888} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8889} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8890} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8891} Dalam pernikahan, seorang pria bebas boleh menikah dengan budak dengan syarat tertentu, dan aturan perceraian serta masa tunggu ditentukan oleh kasus budak, dan dia dibebaskan dari budak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8892} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8893} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8894} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8895} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8896} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8897} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8898} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8899} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8900} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8901} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8902} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8903} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8904} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8905} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8906} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8907} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8908} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8909} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8910} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8911} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8912} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8913} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8914} {cite:fiqh-mawsua-kuwaitiya-noor-v3 hlm.8915} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8916} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8917} Dalam kasus pidana, pembalasan tidak dikenakan pada orang bebas jika budak dibunuh, maupun budak jika dia dibunuh oleh orang merdeka. Nilai budak itu wajib, dan penebusan berbeda dalam membunuhnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8917} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8918} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8919} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8920} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8921} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8922} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.8923} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8924} Dalam hudud, budak dibatasi setengah hadd orang merdeka, dan dia tidak dilempari batu, juga tidak dipotong dengan mencuri harta tuannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8925} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8926} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8927} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8928} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8930} Pertimbangkan budak biasa dan parsial serta keputusannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8932} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8933} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8934} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8935} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8936} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8937} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8938} Perbudakan berakhir dengan pembebasan, penulisan, pengelolaan, prokreasi, emansipasi oleh aturan Syariah, dan kehendak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8939}"
