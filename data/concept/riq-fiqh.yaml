label:
  ar: "الرق"
  en: "Riq (bondage): its kinds and causes, the rights and duties of owner and slave, the marital and sexual rules, the slave's worship, transactions, crimes and inheritance, and how bondage ends"
  ur: "غلامی (رق)"
summary:
  ar: "الرق في الاصطلاح الفقهي كون الإنسان مملوكا لإنسان آخر، والأصل فيه الحرية، وقد أدخل الفقهاء أحكامه في كتبهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8858} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8859} ويدخل الرقيق في الملك بالسبي من الأعداء، وبولادة الأمة من سيدها، وبالشراء والهبة والوصية والميراث، ولا يجوز ابتداء استرقاق المسلم ولا استرقاق الحر، والأصل في الإنسان الحرية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8859} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8860} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8861} ويحرم على الكافر تملك مسلم، ويؤمر بإزالة ملكه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8862} ويعتق على المالك قريبه المحرم بمجرد الملك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8863} وللسيد على رقيقه طاعة في غير المعصية، ويتقيد استخدامه بطاقته، ويجب على السيد نفقته وكسوته، ويحرم تكليفه ما يغلبه، ويُندب الإحسان إليه، ويحرم التمثيل به، وعند المالكية والحنابلة يعتق عليه بالتمثيل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8864} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8865} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8866} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8867} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8868} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8869} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8870} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8871} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8872} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8873} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8874} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8875} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8876} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8877} وللسيد أن يبيع رقيقه أو يرهنه أو يهبه، وتختلف المذاهب في بيعه بشرط العتق، وفي التفريق بين ذوي الرحم المحرم، وفي مال الرقيق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8878} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8879} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8880} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8881} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8882} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8883} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8884} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8885} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8886} وفي العبادات ينقص الرقيق عن الحر في الجمعة والحج والجهاد، وتجب زكاة ماله على سيده، ولا يصوم نذرا ولا يعتكف إلا بإذن سيده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8888} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8889} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8890} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8891} وفي الزواج يجوز للحر أن ينكح الأمة بشروط، وتتحدد أحكام الطلاق والعدة بحال الرقيق، ويستبرأ من ملك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8892} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8893} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8894} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8895} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8896} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8897} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8898} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8899} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8900} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8901} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8902} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8903} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8904} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8905} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8906} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8907} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8908} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8909} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8910} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8911} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8912} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8913} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8914} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8915} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8916} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8917} وفي الجنايات لا يقتص من الحر إذا قتل الرقيق، ويقتص من الرقيق إذا قتل حرا، وتجب قيمة الرقيق، وتختلف الكفارة في قتله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8917} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8918} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8919} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8920} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8921} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8922} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8923} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8924} وفي الحدود يُحد الرقيق بنصف حد الحر ولا يرجم، ولا يقطع بسرقة مال سيده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8925} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8926} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8927} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8928} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8930} ويُنظر في الرقيق المشترك والمبعض وأحكامهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8932} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8933} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8934} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8935} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8936} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8937} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8938} وينقضي الرق بالعتق، والكتابة، والتدبير، والاستيلاد، والعتق بحكم الشرع، والوصية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8939}"
  en: "Riq (bondage) is a person's being owned by another; freedom is the original state, and the jurists set out its rules at length. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8858} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8859} Slaves enter ownership by capture in war, by the offspring of a slave-woman, by purchase, gift, bequest and inheritance; a free Muslim may not be enslaved. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8859} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8860} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8861} A non-Muslim may not keep a Muslim slave, and must sell or free him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8862} Owning a relative within the prohibited degrees frees him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8863} The owner may command the slave in what is not sinful, but the work must be within his strength; he must provide food, clothing and care, and may not torment or disfigure him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8864} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8865} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8866} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8867} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8868} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8869} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8870} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8871} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8872} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8873} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8874} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8875} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8876} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8877} The owner may sell, pledge or give the slave, and the schools differ on sale on condition of freedom, on separating relatives in sale, and on the slave's property. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8878} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8879} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8880} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8881} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8882} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8883} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8884} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8885} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8886} In worship the slave is lighter: Friday is not obligatory, the owner pays his zakat, and his vowed fast and i'tikaf need leave; his hajj is not obligatory until freed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8888} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8889} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8890} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8891} In marriage a free man may marry a slave-woman under conditions; a slave's divorces and waiting period are counted by his condition. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8892} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8893} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8894} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8895} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8896} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8897} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8898} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8899} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8900} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8901} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8902} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8903} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8904} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8905} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8906} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8907} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8908} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8909} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8910} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8911} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8912} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8913} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8914} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8915} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8916} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8917} In crimes, a free man is not retaliated against for killing a slave; a slave who kills a free man is retaliated against; the value of a slave is owed; the hadd for a slave is half of a free man's. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8917} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8918} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8919} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8920} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8921} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8922} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8923} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8924} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8925} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8926} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8927} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8928} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8929} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8930} The co-owned and the partly freed slave have their own rules. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8932} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8933} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8934} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8935} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8936} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8937} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8938} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8939} Bondage ends by manumission, by writing-off, by the status of mudabbar or umm walad, by legal manumission and by bequest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8939}"
  ur: "رق انسان کا دوسرے انسان کی ملکیت میں ہونا ہے؛ اصل آزادی ہے، اور آزاد مسلمان کو غلام نہیں بنایا جا سکتا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8858} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8859} غلام کے حقوق و فرائض، اس کی عبادات، نکاح، جرائم اور حدود کے احکام تفصیل سے مذکور ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8864} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8917} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8925} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8939}"
