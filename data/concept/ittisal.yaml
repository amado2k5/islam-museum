id: concept/ittisal
class: concept
kind: legal
label: { ar: "اتصال", en: "Connection (ittisal)" }
summary:
  ar: "الاتصال في اللغة عدم الانقطاع، وهو ضد الانفصال، ويستعمله الفقهاء في الأعيان كاتصال الصفوف والزوائد بالمعقود عليه، وفي المعاني كاتصال الإيجاب بالقبول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1487} وما اتصل اتصال قرار من الزوائد يدخل في الحكم الأصلي تبعاً، فلا يجوز إفراده بالرهن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1487} ولا تلحق معاني الألفاظ غير المتصلة بالأصل، ولذلك وجب الاتصال في الاستثناء والشرط والتعليق، وفي نية كنايات الطلاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1487}"
  en: "Ittisal in the lexicon means non-separation, the opposite of separation. Jurists use it of physical things, such as the rows in congregational prayer or increments attached to a sold object, and of meanings, such as an offer joined to its acceptance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1487} Increments that are permanently attached follow the principal ruling and cannot be pledged separately. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1487} A detached word does not attach its meaning to the principal act, so connection is required in exceptions, conditions, conditional clauses and in the intention behind allusive divorce. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1487}"
