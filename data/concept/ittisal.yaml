label: { ar: "اتصال", en: "Connection (ittisal)", es: "Conexión (ittisal)", fr: "Connexion (ittisal)", ur: "کنکشن (ittisal)", tr: "Bağlantı", id: "Koneksi" }
summary:
  ar: "الاتصال في اللغة عدم الانقطاع، وهو ضد الانفصال، ويستعمله الفقهاء في الأعيان كاتصال الصفوف والزوائد بالمعقود عليه، وفي المعاني كاتصال الإيجاب بالقبول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1487} وما اتصل اتصال قرار من الزوائد يدخل في الحكم الأصلي تبعاً، فلا يجوز إفراده بالرهن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1487} ولا تلحق معاني الألفاظ غير المتصلة بالأصل، ولذلك وجب الاتصال في الاستثناء والشرط والتعليق، وفي نية كنايات الطلاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1487}"
  en: "Ittisal in the lexicon means non-separation, the opposite of separation. Jurists use it of physical things, such as the rows in congregational prayer or increments attached to a sold object, and of meanings, such as an offer joined to its acceptance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1487} Increments that are permanently attached follow the principal ruling and cannot be pledged separately. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1487} A detached word does not attach its meaning to the principal act, so connection is required in exceptions, conditions, conditional clauses and in the intention behind allusive divorce. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1487}"
  es: "En el léxico, ittisal significa no separación, lo opuesto a la separación. Los juristas lo usan para referirse a cosas físicas, como las filas en la oración congregacional o los incrementos adjuntos a un objeto vendido, y a significados, como una oferta unida a su aceptación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1487} Los incrementos que están permanentemente unidos siguen la regla principal y no pueden ser pignorados por separado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1487} Una palabra separada no vincula su significado al acto principal, por lo que se requiere conexión en excepciones, condiciones, cláusulas condicionales y en la intención detrás del divorcio alusivo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1487}"
  fr: "Dans le lexique, « ittisal » signifie non-séparation, l'opposé de la séparation. Les juristes l'emploient pour des choses physiques, comme les rangs dans la prière en congrégation ou les incréments attachés à un objet vendu, et pour des significations, comme une offre liée à son acceptation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1487} Les incréments attachés de manière permanente suivent la règle principale et ne peuvent être mis en gage séparément. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1487} Un mot détaché n'attache pas sa signification à l'acte principal; un lien est donc requis dans les exceptions, les conditions, les clauses conditionnelles et dans l'intention sous-jacente au divorce par allusion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1487}"
  ur: "لغت میں اتصال کا مطلب ہے عدم علیحدگی، علیحدگی کے مخالف۔ فقہاء اسے جسمانی چیزوں کے لیے استعمال کرتے ہیں، جیسے کہ باجماعت نماز کی صفیں یا بیچی ہوئی چیز سے منسلک اضافہ، اور معانی، جیسے کہ اس کی قبولیت میں شامل پیشکش۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1487} جو اضافہ مستقل طور پر منسلک ہے وہ اصولی حکم کے مطابق ہے اور الگ سے گروی نہیں رکھا جا سکتا۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 صفحہ 1487} ایک الگ لفظ اپنے معنی کو اصولی فعل سے نہیں جوڑتا، اس لیے مستثنیات، شرائط، مشروط شقوں اور مبہم طلاق کی نیت میں تعلق ضروری ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص1487}"
  tr: "Dilde bağlantı kesintisiz olup, ayrılığın tam tersidir ve hukukçular bunu belirli durumlarda, örneğin satırlar ve sözleşmeli nesneye eklemeler ile teklifin kabulle bağlantısı gibi anlamlarda kullanırlar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1487} Bir karar veya eklemeyle bağlantılı olan her şey, orijinal karara tabidir ve rehin ile ayrılması mümkün değildir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1487} Orijinale bağlı olmayan kelimelerin anlamları eklenmemiştir, bu nedenle istisnalarda, koşullarda, askıya almalarda ve boşanma metaforlarının niyetinde bağlantı gereklidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1487}"
  id: "Dalam bahasa, koneksi adalah non-interupsi, yang merupakan kebalikan dari pemisahan, dan ahli hukum menggunakannya dalam kasus tertentu, seperti penghubungan baris dan tambahan pada objek yang dikontrakkan, serta dalam makna, seperti penghubungan tawaran dengan penerimaan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1487} Apa pun yang terkait dengan keputusan atau penambahan sesuai dengan putusan asli, dan tidak diperbolehkan memisahkannya dengan gadai. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1487} Makna kata-kata yang tidak terkait dengan aslinya tidak melekat, sehingga hubungan diperlukan dalam pengecualian, kondisi, suspensi, dan dalam niat metafora perceraian. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1487}"
