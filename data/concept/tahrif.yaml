    stance:
      ar: "القرآن يُثبت أن أهل الكتاب حرّفوا كلام كتابهم ونسوا حظاً منه"
    summary:
      ar: "يقرر رضا، في تفسير الأنعام 115، أن القرآن أثبت تحريف أهل الكتاب لكلامهم ونسيانهم حظاً منه، فلا تُحمل آية الكلمات التامة على حفظ ألفاظ الكتب السابقة. ويفرق بين صدق الكلام وعدله ونفوذه، وبين نص اللفظ. وهذا تفسير رضا لآيات القرآن، وليس قولاً نقله عن غيره في هذا الموضع."
