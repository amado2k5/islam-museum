id: concept/tahrif
class: concept
kind: term
label: { ar: "التحريف", en: "Tahrif (alteration of scripture)" }
issue:
  ar: "هل وقع تحريف في كتب أهل الكتاب قبل القرآن، وفي أي شيء: في ألفاظها أم في معانيها؟"
summary:
  ar: "تحريف الكلام عن مواضعه في الكتب المتقدمة. يقرأ رشيد رضا آية الكلمات التامة في تفسير الأنعام 115 على أنها تتعلق بصدق كلمات الله وعدلها ونفوذها، لا بألفاظ الكتب السابقة، ويرى أن القرآن نفسه أثبت أن أهل الكتاب حرّفوا كلام كتابهم ونسوا حظاً منه، وأن الله لم يتكفل بحفظ نص كتاب من كتبه بعينه. ويتساءل في تفسير النساء هل يستغرب أن يحرف بنو إسرائيل البشارة بعيسى ومحمد بعد نقضهم الميثاق. هذه قراءة رضا، وهي تنسب إليه هنا."
  en: "Alteration of earlier scriptures. Rashid Rida reads the verse on the unchangeable words of God as a statement about their truth and justice, not about the wording of earlier books. He holds that the Qur'an itself records that the People of the Book altered their scripture and forgot part of it, and that God did not guarantee the wording of any earlier book. This is Rida's reading, attributed to him."
