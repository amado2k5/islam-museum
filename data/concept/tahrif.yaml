id: concept/tahrif
class: concept
kind: term
label: { ar: "التحريف", en: "Tahrif (alteration of scripture)", es: "Tahrif (alteración de las escrituras)", fr: "Tahrif (altération des Écritures)", ur: "تحریف ⁦(صحیفہ کی تبدیلی)⁩" }
issue:
  ar: "هل وقع تحريف في كتب أهل الكتاب قبل القرآن، وفي أي شيء: في ألفاظها أم في معانيها؟"
summary:
  ar: "تحريف الكلام عن مواضعه في الكتب المتقدمة. يقرأ رشيد رضا آية الكلمات التامة في تفسير الأنعام 115 على أنها تتعلق بصدق كلمات الله وعدلها ونفوذها، لا بألفاظ الكتب السابقة، ويرى أن القرآن نفسه أثبت أن أهل الكتاب حرّفوا كلام كتابهم ونسوا حظاً منه، وأن الله لم يتكفل بحفظ نص كتاب من كتبه بعينه. ويتساءل في تفسير النساء هل يستغرب أن يحرف بنو إسرائيل البشارة بعيسى ومحمد بعد نقضهم الميثاق. هذه قراءة رضا، وهي تنسب إليه هنا."
  en: "Alteration of earlier scriptures. Rashid Rida reads the verse on the unchangeable words of God as a statement about their truth and justice, not about the wording of earlier books. He holds that the Qur'an itself records that the People of the Book altered their scripture and forgot part of it, and that God did not guarantee the wording of any earlier book. This is Rida's reading, attributed to him."
  es: "Alteración de escrituras anteriores. Rashid Rida interpreta el versículo sobre la inmutabilidad de las palabras de Dios como una declaración sobre su veracidad y justicia, no sobre la redacción de libros anteriores. Sostiene que el Corán mismo registra que la Gente del Libro alteró sus escrituras y olvidó parte de ellas, y que Dios no garantizó la redacción de ningún libro anterior. Esta es la interpretación de Rida, que se le atribuye."
  fr: "Altération des Écritures antérieures. Rashid Rida interprète le verset relatif à l'immuabilité de la Parole de Dieu comme une affirmation de leur vérité et de leur justice, et non comme une critique du texte des livres antérieurs. Il soutient que le Coran lui-même reconnaît que les Gens du Livre ont altéré leurs Écritures et en ont oublié une partie, et que Dieu n'a garanti l'exactitude d'aucun livre antérieur. Telle est l'interprétation de Rida, qui lui est attribuée."
  ur: "پہلے کے صحیفوں کی تبدیلی۔ راشد ردا خدا کے ناقابل تغیر الفاظ پر آیت کو ان کی سچائی اور انصاف کے بیان کے طور پر پڑھتے ہیں، نہ کہ پہلے کی کتابوں کے الفاظ کے بارے میں۔ اس کا خیال ہے کہ قرآن خود ریکارڈ کرتا ہے کہ اہل کتاب نے اپنے صحیفے میں ردوبدل کیا اور اس کا کچھ حصہ بھول گئے، اور یہ کہ خدا نے کسی بھی پہلے کی کتاب کے الفاظ کی ضمانت نہیں دی۔ یہ ردا کا پڑھنا ہے، اس سے منسوب ہے۔"
