class: concept
kind: legal
label:
  ar: "العُرْف"
  en: "Custom (urf) as a source of rulings"
  ur: "عرف"
summary:
  ar: "العرف في اللغة كل ما تعرفه النفس من الخير وتطمئن إليه، وهو ضد النكر، وفي الاصطلاح ما استقرت عليه النفوس بشهادة العقول وتلقته الطبائع بالقبول {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11560}. ويفرق بعضهم بين العادة والعرف، فالعادة عنده العرف العملي والعرف القولي هو المراد بالعرف {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11561}. والعرف القولي أن يتعارف قوم إطلاق لفظ على معنى بحيث لا يتبادر عند سماعه غيره، والعرف العملي ما جرى عليه الناس في معاملاتهم، كتعارفهم البيع بالتعاطي {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11561} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11562}. ويقسم العرف إلى عام وخاص، وصحيح وفاسد، وثابت ومتبدل {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11563} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11564}. والفقهاء يعتبرونه إذا كان مطرداً أو غالباً، وألا يخالف نصاً شرعياً، وألا يعارضه تصريح بخلافه، وأن يكون قائماً عند إنشاء التصرف {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11565} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11566} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11567}. وقد اختلفوا في اشتراط كونه عاماً، فذهب جمهور الحنفية والشافعية إلى اعتبار العام دون الخاص {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11565}. وأما إذا خالف العرف النص من بعض الوجوه فالجمهور لا يجعله مخصصاً للنص ولا مقيداً له، والحنفية يجعلونه مخصصاً ومقيداً {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11566}."
  en: "In the lexicon, urf is what the soul knows of good and is at ease with; it is the opposite of nukr. As a technical term it is what souls have settled upon by the testimony of reason and what natures accept {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11560}. Some distinguish custom (adah) from urf: custom is the practical usage, and urf in the strict sense is the verbal usage {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11561}. Verbal custom is the agreement of a people to use a word for one meaning so that no other comes to mind; practical custom is what people habitually do in their dealings, such as selling by mutual handing over {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11561} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11562}. Custom is divided into general and specific, sound and corrupt, and fixed and changing {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11563} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11564}. Jurists take it into account when it is steady or prevailing, does not contradict an explicit text, is not overridden by an explicit statement to the contrary, and existed when the act was made {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11565} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11566} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11567}. The majority of Hanafis and Shafi'is count only general custom; where custom conflicts with a text only in part, the majority do not let it specify or restrict the text, while the Hanafis do {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11565} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11566}."
