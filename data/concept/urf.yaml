id: concept/urf
class: concept
kind: legal
label:
  ar: "العُرْف"
  en: "Custom (urf) as a source of rulings"
  ur: "عرف"
  es: "La costumbre (urf) como fuente de dictámenes"
  fr: "La coutume (urf) comme source de décisions"
summary:
  ar: "العرف في اللغة كل ما تعرفه النفس من الخير وتطمئن إليه، وهو ضد النكر، وفي الاصطلاح ما استقرت عليه النفوس بشهادة العقول وتلقته الطبائع بالقبول {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11560}. ويفرق بعضهم بين العادة والعرف، فالعادة عنده العرف العملي والعرف القولي هو المراد بالعرف {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11561}. والعرف القولي أن يتعارف قوم إطلاق لفظ على معنى بحيث لا يتبادر عند سماعه غيره، والعرف العملي ما جرى عليه الناس في معاملاتهم، كتعارفهم البيع بالتعاطي {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11561} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11562}. ويقسم العرف إلى عام وخاص، وصحيح وفاسد، وثابت ومتبدل {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11563} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11564}. والفقهاء يعتبرونه إذا كان مطرداً أو غالباً، وألا يخالف نصاً شرعياً، وألا يعارضه تصريح بخلافه، وأن يكون قائماً عند إنشاء التصرف {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11565} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11566} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11567}. وقد اختلفوا في اشتراط كونه عاماً، فذهب جمهور الحنفية والشافعية إلى اعتبار العام دون الخاص {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11565}. وأما إذا خالف العرف النص من بعض الوجوه فالجمهور لا يجعله مخصصاً للنص ولا مقيداً له، والحنفية يجعلونه مخصصاً ومقيداً {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11566}."
  en: "In the lexicon, urf is what the soul knows of good and is at ease with; it is the opposite of nukr. As a technical term it is what souls have settled upon by the testimony of reason and what natures accept {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11560}. Some distinguish custom (adah) from urf: custom is the practical usage, and urf in the strict sense is the verbal usage {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11561}. Verbal custom is the agreement of a people to use a word for one meaning so that no other comes to mind; practical custom is what people habitually do in their dealings, such as selling by mutual handing over {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11561} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11562}. Custom is divided into general and specific, sound and corrupt, and fixed and changing {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11563} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11564}. Jurists take it into account when it is steady or prevailing, does not contradict an explicit text, is not overridden by an explicit statement to the contrary, and existed when the act was made {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11565} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11566} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11567}. The majority of Hanafis and Shafi'is count only general custom; where custom conflicts with a text only in part, the majority do not let it specify or restrict the text, while the Hanafis do {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11565} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11566}."
  es: "En el léxico, urf es lo que el alma conoce del bien y con lo que se siente cómoda; es lo opuesto a nukr. Como término técnico es lo que las almas han establecido por el testimonio de la razón y lo que las naturalezas aceptan {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11560}. Algunos distinguen la costumbre (adah) de urf: la costumbre es el uso práctico, y urf en sentido estricto es el uso verbal {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11561}. La costumbre verbal es el acuerdo de un pueblo para usar una palabra con un significado de modo que ningún otro venga a la mente; La costumbre práctica es lo que la gente hace habitualmente en sus tratos, como vender mediante entrega mutua {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11561} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11562}. La costumbre se divide en general y específica, sana y corrupta, y fija y cambiante {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11563} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11564}. Los juristas lo toman en cuenta cuando es constante o predominante, no contradice un texto explícito, no es anulado por una declaración explícita en contrario y existía cuando se realizó el acto {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11565} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11566} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11567}. La mayoría de los hanafíes y shafiíes solo consideran la costumbre general; cuando la costumbre entra en conflicto con un texto solo en parte, la mayoría no permite que especifique o restrinja el texto, mientras que los hanafíes sí {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11565} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11566}."
  fr: "Dans le lexique, urf désigne ce que l'âme reconnaît comme bon et avec lequel elle est en paix; c'est l'opposé de nukr. Techniquement, il s'agit de ce sur quoi les âmes se sont établies par le témoignage de la raison et ce que la nature accepte {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11560}. Certains distinguent la coutume (adah) de l'urf: la coutume est l'usage pratique, tandis que l'urf, au sens strict, est l'usage verbal {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11561}. La coutume verbale est l'accord d'un peuple pour utiliser un mot avec une signification précise, de sorte qu'aucune autre ne vienne à l'esprit. La coutume pratique désigne ce que les gens font habituellement dans leurs relations commerciales, comme la vente par remise mutuelle {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11561} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11562}. La coutume se divise en coutume générale et coutume spécifique, coutume saine et coutume corrompue, coutume fixe et coutume changeante {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11563} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11564}. Les juristes en tiennent compte lorsqu'une coutume est stable ou prédominante, ne contredit pas un texte explicite, n'est pas annulée par une déclaration explicite contraire et existait au moment de l'acte {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11565} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11566} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11567}. La majorité des écoles hanafite et shafi'ite ne prennent en compte que la coutume générale; lorsqu'une coutume est en conflit partiel avec un texte, la majorité ne la laisse pas s'appliquer au texte ni le restreindre, tandis que les hanafites le font {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11565} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11566}."
  ur: "لغت میں، urf وہ ہے جو روح کو اچھائی کا علم ہے اور اس سے آسانی ہوتی ہے۔ یہ nukr کے مخالف ہے. ایک تکنیکی اصطلاح کے طور پر یہ وہ چیز ہے جس پر روحیں دلیل کی گواہی سے طے کرتی ہیں اور جسے فطرت قبول کرتی ہے۔ کچھ لوگ رواج ⁦(عادہ)⁩ کو urf سے ممتاز کرتے ہیں: رواج عملی استعمال ہے، اور urf سخت معنوں میں زبانی استعمال ہے زبانی رواج ایک قوم کا ایک لفظ کو ایک معنی کے لیے استعمال کرنے کا معاہدہ ہے تاکہ کوئی دوسرا ذہن میں نہ آئے۔ عملی رواج وہ ہے جو لوگ اپنے معاملات میں عادتاً کرتے ہیں، جیسے کہ آپس کے حوالے کر کے بیچنا {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 11562}۔ حسب ضرورت کو عام اور مخصوص، صحیح اور خراب، اور طے شدہ اور بدلنے والے میں تقسیم کیا گیا ہے {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 11563} فقہاء اسے اس وقت مدنظر رکھتے ہیں جب یہ مستحکم یا مروجہ ہو، کسی صریح متن سے متصادم نہ ہو، اس کے برعکس کسی صریح بیان سے اس کو ختم نہ کیا گیا ہو، اور یہ اس وقت موجود تھا جب یہ فعل بنایا گیا تھا۔ صفحہ 11566} {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 11567}۔ حنفیہ اور شافعیوں کی اکثریت صرف عام رواج کو شمار کرتی ہے۔ جہاں حسب ضرورت متن کے ساتھ صرف جزوی طور پر متصادم ہو، اکثریت اسے متن کی وضاحت یا پابندی نہیں کرنے دیتی، جب کہ احناف {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 11565} {حوالہ:فقہ الموسوعۃ النور-v3 ص11566} کرتے ہیں۔"
