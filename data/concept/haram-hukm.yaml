id: concept/haram-hukm
class: concept
kind: legal
label:
  ar: "الحرام، المحظور في الأحكام التكليفية"
  en: "The forbidden as a ruling (haram, mahzur)"
  ur: "حرام بطور حکمِ تکلیفی"
  fr: "L'interdit comme statut légal (haram, mahzur)"
  es: "Lo prohibido como calificación legal (haram, mahzur)"
  tr: "Zorunlu kararlarda yasak, yasak"
  id: "Yang terlarang, yang terlarang dalam keputusan wajib"
summary:
  ar: "الحرام، ويسمّى المحظور والمحرَّم، آخر الدرجات الخمس عند الأصوليين: ما ورد خطاب الشرع باقتضاء تركه مع الإشعار بالعقاب على فعله، ويقابله المكروه الذي لا إشعار فيه بعقاب {cite:mustasfa-hafiz-v1 p.297}. يسمّيه القرآن بألفاظ التحريم في مواضع منها [[passage/quran-6-151|الأنعام 151]] و[[passage/quran-7-33|الأعراف 33]]، وينهى عن تحريم ما لم يحرّمه الله في [[passage/quran-16-116|النحل 116]]. والمتصفح لا يصنّف النهي المجرد، لأن حمله على التحريم أو الكراهة قراءة فقيه."
  en: "The forbidden (haram), which the scholars of legal theory also call the prohibited and the made-unlawful, is the last of the five degrees: that for which the address came requiring its avoidance, joined to a warning of punishment for doing it, in contrast to the disliked, in which there is no warning of punishment {cite:mustasfa-hafiz-v1 p.297}. The Qur'an names it in the words of prohibition in several places, among them [[passage/quran-6-151|al-An'am 151]] and [[passage/quran-7-33|al-A'raf 33]], and forbids making unlawful what God has not made unlawful in [[passage/quran-16-116|al-Nahl 116]]. The browser does not classify the bare prohibition, because taking it as forbidding or as disliking is a jurist's reading."
  ur: "حرام، جسے اصولیین محظور اور محرَّم بھی کہتے ہیں، پانچ درجوں میں آخری ہے: وہ جس کے ترک کے تقاضے کے ساتھ خطاب آیا ہو اور فعل پر سزا کی خبر ملی ہو، اور اس کے مقابل مکروہ ہے جس میں سزا کی کوئی خبر نہیں {cite:mustasfa-hafiz-v1 p.297}۔ قرآن اسے کئی مقامات پر تحریم کے الفاظ سے نام دیتا ہے جن میں [[passage/quran-6-151|الانعام 151]] اور [[passage/quran-7-33|الاعراف 33]] ہیں، اور [[passage/quran-16-116|النحل 116]] میں اس چیز کو حرام ٹھہرانے سے منع کرتا ہے جسے اللہ نے حرام نہیں کیا۔ براؤزر محض نہی کی درجہ بندی نہیں کرتا، کیونکہ اسے تحریم یا کراہت پر محمول کرنا ایک فقیہ کی قرأت ہے۔"
  fr: "L'interdit (haram), que les spécialistes des fondements du droit appellent aussi le prohibé et le rendu illicite, est le dernier des cinq degrés : ce dont le discours est venu exiger l'abstention, avec l'annonce d'un châtiment pour l'acte, par opposition au détestable, où il n'y a pas d'annonce de châtiment {cite:mustasfa-hafiz-v1 p.297}. Le Coran le nomme par les mots de l'interdiction en plusieurs endroits, dont [[passage/quran-6-151|al-An'am 151]] et [[passage/quran-7-33|al-A'raf 33]], et interdit de rendre illicite ce que Dieu n'a pas rendu illicite en [[passage/quran-16-116|al-Nahl 116]]. Le navigateur ne classe pas la prohibition nue, car la prendre comme interdiction ou comme réprobation relève de la lecture d'un juriste."
  es: "Lo prohibido (haram), que los especialistas en teoría jurídica llaman también lo vedado y lo declarado ilícito, es el último de los cinco grados: aquello cuyo discurso vino exigiendo su abstención, junto con la advertencia de un castigo por hacerlo, en contraste con lo reprobable, en lo que no hay advertencia de castigo {cite:mustasfa-hafiz-v1 p.297}. El Corán lo nombra con las palabras de la prohibición en varios lugares, entre ellos [[passage/quran-6-151|al-An'am 151]] y [[passage/quran-7-33|al-A'raf 33]], y prohíbe declarar ilícito lo que Dios no ha declarado ilícito en [[passage/quran-16-116|al-Nahl 116]]. El explorador no clasifica la prohibición desnuda, porque tomarla como prohibición o como reprobación es una lectura del jurista."
  tr: "Yasak, yasak ve yasak olarak da adlandırılan, usul bilginlerine göre beş derecenin sonuncusudur: İslam hukukunda terk etmeyi ve ceza uyarısını gerektiren şey, ceza bildirimi yapılmayan sevilmeyen dereceyle karşı çıkar {cite:mustasfa-hafiz-v1 s.297}. Kur'an, [[pasaj/kuran-6-151|Al-An'151]] ve [[pasaj/kuran-7-33|Al-A'raf 33]] gibi yerlerde yasak ifadeleriyle bahseder ve [[pasaj/kuran-16-116|An-Nahl 116]'da Allah'ın yasaklamadığı şeylerin yasaklanmasını yasaklar. Bir göz atan yasaklama soyut olarak sınıflandırmaz, çünkü yasak veya hoşnutsuzluğun yorumlanması bir hukukçu tarafından okunur."
  id: "Yang terlarang, juga disebut terlarang dan terlarang, adalah yang terakhir dari lima derajat menurut para ulama usul: apa yang disebutkan dalam hukum Islam yang mewajibkan pengabaian dengan peringatan hukuman atas tindakannya, dan dibantah oleh yang tidak disukai ketika tidak ada pemberitahuan hukuman {cite:mustasfa-hafiz-v1 hlm.297}. Al-Qur'an menyebutnya dengan kata-kata larangan di tempat-tempat termasuk [[ayat/al-quran-6-151|Al-An'am 151]] dan [[ayat/al-quran-7-33|Al-A'raf 33]], serta melarang melarang apa yang tidak dilarang Allah dalam [[ayat/al-quran-16-116|An-Nahl 116]]. Seorang penjelajah tidak mengklasifikasikan larangan sebagai abstrak, karena interpretasi larangan atau ketidaksukaannya adalah bacaan seorang ahli hukum."
