id: concept/zij-sabi-line-of-sixty-six-degrees-twenty-five-minutes
class: concept
kind: scientific
label: { ar: "الخط الذي بعده ستة وستون درجة وخمس وعشرون دقيقة في الزيج الصابي", en: "The line at 66 degrees 25 minutes", ur: "وہ خط جس کا فاصلہ ۶۶ درجے ۲۵ دقیقے ہے", es: "La línea a 66 grados 25 minutos", fr: "La ligne à 66 degrés 25 minutes" }
summary:
  ar: "يقول البتاني إن الخطوط التي يزيد بعدها عن معدل النهار على الميل لا تبلغ الشمس سمت رؤوس أهلها أبداً، وإن اختلاف الميل والنهار في الطول والقصر يزداد فيها حتى الخط الذي بعده ست وستون درجة وخمس وعشرون دقيقة، وهي ما ينقص الميل كله من تسعين. وفي هذا الخط وحده يبلغ النهار أربعاً وعشرين ساعة والليل مثله عند المنقلبين، وتدور ظلال القائمات إلى جميع نواحي الأفق. {cite:zij-sabi-nallino-byblion p.27}."
  en: "Al-Battani says that on lines farther from the equator than the obliquity the Sun never reaches the zenith, and the variation of declination and of the length of day grows until the line at 66 degrees 25 minutes, the amount that the whole obliquity falls short of ninety. On that one line the day reaches a full twenty-four hours at the summer solstice and the night as much at the winter one, and the shadows of upright gnomons turn to every side of the horizon. {cite:zij-sabi-nallino-byblion p.27}."
  ur: "البتانی کہتے ہیں کہ جو خط معدل النہار سے میل سے زیادہ دور ہوں ان کے باشندوں کے سمت الرأس پر سورج کبھی نہیں پہنچتا، اور میل اور دن کے طول و قصر کا اختلاف اس خط تک بڑھتا جاتا ہے جس کا فاصلہ ۶۶ درجے ۲۵ دقیقے ہے، یعنی نوے میں سے پورا میل گھٹانے کے بعد جو بچے۔ صرف اسی خط پر انقلابِ صیفی میں دن چوبیس گھنٹے کا ہو جاتا ہے اور انقلابِ شتوی میں رات اتنی ہی، اور کھڑی شاخصوں کے سائے افق کی تمام سمتوں میں گھومتے ہیں۔ {cite:zij-sabi-nallino-byblion p.27}۔"
  es: "Al-Battani afirma que en las líneas más alejadas del ecuador que la oblicuidad, el Sol nunca alcanza el cenit, y la variación de la declinación y de la duración del día aumenta hasta la línea de 66 grados y 25 minutos, la cantidad en la que la oblicuidad total se queda corta para llegar a los noventa. En esa única línea, el día alcanza las veinticuatro horas completas en el solsticio de verano y la noche la misma duración en el de invierno, y las sombras de los gnomones verticales se extienden hacia todos los lados del horizonte. {cite:zij-sabi-nallino-byblion p.27}."
  fr: "Al-Battani affirme que sur les lignes plus éloignées de l'équateur que l'obliquité, le Soleil n'atteint jamais le zénith, et que la variation de la déclinaison et de la durée du jour s'accroît jusqu'à la ligne située à 66 degrés et 25 minutes, valeur à laquelle l'obliquité totale est inférieure à 90 degrés. Sur cette ligne, le jour atteint vingt-quatre heures au solstice d'été et la nuit vingt-quatre heures au solstice d'hiver, et les ombres des gnomons dressés s'étendent de part et d'autre de l'horizon. {cite:zij-sabi-nallino-byblion p.27}."
