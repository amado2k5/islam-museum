label: { ar: "بعد الشمس والقمر وأقطارهما وعظم جرميهما", en: "The distances, diameters and sizes of the Sun and the Moon", ur: "سورج اور چاند کا بُعد، قطر اور جرم", es: "Las distancias, diámetros y tamaños del Sol y la Luna.", fr: "Les distances, les diamètres et les tailles du Soleil et de la Lune" }
summary:
  ar: "يقرر البتاني أن بعد الشمس والقمر وأقطارهما وعظم جرميهما قد بيّنها في كتاب المجسطي وفي ما وقع لهم من قياس الكسوفات، فيبدأ بذكر ما يبين ذلك من الأفلاك من فلك القمر إلى فلك زحل، وإنه يُكلّف بذلك المتأخرون من الفضلاء قبل بطليموس. وقد ذكر أن قطر الشمس مثل قطر الأرض خمس مرات ونصف، وأن ذلك يتبيّن بالقياس. {cite:zij-sabi-nallino-byblion pp.185-186}"
  en: "Al-Battani says the distances, diameters and sizes of the Sun and the Moon were set out in the Almagest and in what was measured in eclipses. He begins with the spheres from the lunar sphere up to Saturn, as the earlier sages before Ptolemy had reported them. He states that the Sun's diameter is five and a half times the Earth's diameter, a result the text says is shown by measurement. {cite:zij-sabi-nallino-byblion pp.185-186}"
  ur: "البتانی کہتے ہیں کہ سورج اور چاند کا بُعد، قطر اور جرم انہوں نے مجسطی میں اور گرہنوں کی پیمائش میں بیان کیے ہیں۔ وہ چاند کے فلک سے زحل کے فلک تک افلاک کا ذکر کرتے ہیں، جیسا کہ بطلیموس سے پہلے کے فاضل حکما نے بیان کیا۔ وہ کہتے ہیں کہ سورج کا قطر زمین کے قطر سے پانچ گنا اور نصف ہے، اور متن کے مطابق یہ پیمائش سے ظاہر ہوتا ہے۔ {cite:zij-sabi-nallino-byblion pp.185-186}"
  es: "Al-Battani afirma que las distancias, diámetros y tamaños del Sol y la Luna se establecieron en el Almagesto y en las mediciones realizadas durante los eclipses. Comienza con las esferas, desde la lunar hasta la de Saturno, tal como las habían descrito los sabios anteriores a Ptolomeo. Declara que el diámetro del Sol es cinco veces y media mayor que el de la Tierra, un resultado que, según el texto, se demuestra mediante mediciones. {cite:zij-sabi-nallino-byblion pp.185-186}"
  fr: "Al-Battani affirme que les distances, diamètres et dimensions du Soleil et de la Lune étaient définis dans l'Almageste et mesurés lors des éclipses. Il commence par les sphères allant de la sphère lunaire à celle de Saturne, telles que les avaient décrites les sages antérieurs à Ptolémée. Il déclare que le diamètre du Soleil est cinq fois et demie celui de la Terre, un résultat, selon le texte, démontré par la mesure. {cite:zij-sabi-nallino-byblion pp.185-186}"
