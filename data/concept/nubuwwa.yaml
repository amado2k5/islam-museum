summary:
  ar: "النبوة في العقيدة السنية: الإيمان بالنبيين وبالكتب المنزلة على المرسلين وأنهم كانوا على الحق المبين، مع كون إبراهيم خليل الله وموسى كليمه {cite:aqida-tahawiyya §71-72}؛ وتصنف كتب «دلائل النبوة» كالبيهقي في آيات النبوة ومعجزاتها {cite:dalail-al-nubuwwa-bayhaqi}."
  en: "Prophethood in Sunni creed: belief in the prophets and in the books sent down to the messengers, that they were upon manifest truth — with Abraham God's intimate friend and Moses His interlocutor {cite:aqida-tahawiyya §71-72}; the 'proofs of prophethood' literature, as by al-Bayhaqi, treats its signs and miracles {cite:dalail-al-nubuwwa-bayhaqi}."
