summary:
  ar: "النبوة في اللغة من النبوة والنباوة وهي الارتفاع، أو من النبأ وهو الخبر، والنبيّ مأخوذ منهما. وفي الاصطلاح صفة ثبوتية في النبي وصفة إضافية هي تعلق الخطاب الإلهي به. والرسالة أخص من النبوة، فهي كون الشخص مرسلاً من الله إلى الناس لتبليغ الأحكام. وتثبت النبوة بالمعجزات الخارقة للعادة المقرونة بالتحدي، ومن ذلك القرآن. وما حكاه القرآن أو السنة من شرائع الأنبياء السابقين في أصول الدين ثابت في حقنا اتفاقاً، وفي الفروع فجمهور العلماء على أنه شرع لنا ما لم يرد ما يرده، والشافعية على أنه ليس شرعاً لنا. ومن ادعى النبوة لنفسه أو لغيره فهو كاذب مرتد كافر باتفاق، لأن النبي خاتم النبيين، ومن صدّق مدعي النبوة صار مرتداً، وفي استتابة الذمي المدعي خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15458} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15459} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15460} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15461} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15462}"
  en: "Nubuwwa comes from the root for height or for news, and nabi is related to both. In law it is an affirmative quality of the prophet together with a relational one, the attachment of the divine address to him. Risala is narrower: it is being sent from God to people, or some of them, to convey the law. Prophecy is established by miracles that break habit and are joined with a challenge, the Qur'an among them. Rules that the Qur'an or Sunna relate from earlier prophets bind us in matters of faith by agreement, and in matters of law the majority hold them binding unless our law sets them aside, whereas the Shafi'is hold them not binding for us. Whoever claims prophecy, for himself or for another, is a liar and an apostate by agreement, since the Prophet is the seal of the prophets; one who confirms such a claimant becomes an apostate. Jurists differ on whether a dhimmi who makes the claim is to be asked to repent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15458} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15459} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15460} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15461} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15462}"
  ur: "نبوت وہ صفت ہے جو اللہ کی طرف سے وحی پانے والے نبی میں ثابت ہو۔ رسالت نبوت سے خاص ہے۔ معجزات سے نبوت ثابت ہوتی ہے۔ نبوت کا دعویٰ کرنے والا کاذب اور کافر و مرتد ہے، کیونکہ نبی کریم خاتم النبیین ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15458} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15459} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15460} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15461} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15462}"
  es: "Nubuwwa proviene de la raíz que significa altura o noticia, y nabi se relaciona con ambas. En derecho, es una cualidad afirmativa del profeta junto con una relacional, la vinculación del mensaje divino a él. Risala es más específica: es ser enviado por Dios a las personas, o a algunos de ellos, para transmitir la ley. La profecía se establece mediante milagros que rompen con la costumbre y se unen a un desafío, entre ellos el Corán. Las normas que el Corán o la Sunna transmiten de profetas anteriores nos vinculan en materia de fe por acuerdo, y en materia de derecho, la mayoría las considera vinculantes a menos que nuestra ley las desestime, mientras que los shafi'ís consideran que no son vinculantes para nosotros. Quien se atribuya la profecía, para sí mismo o para otro, es un mentiroso y un apóstata por acuerdo, ya que el Profeta es el sello de los profetas; quien confirme a tal reclamante se convierte en apóstata. Los juristas difieren sobre si se debe pedir arrepentimiento a un dhimmi que hace la reclamación. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15458} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15459} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15460} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15461} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15462}"
  fr: "Nubuwwa dérive de la racine signifiant hauteur ou nouvelle, et nabi est lié aux deux. En droit, il s'agit d'une qualité propre au prophète, associée à une dimension relationnelle: l'attachement de la parole divine à celui-ci. Risala a une signification plus restrictive: il s'agit d'être envoyé par Dieu à des hommes, ou à certains d'entre eux, pour transmettre la loi. La prophétie est établie par des miracles qui bouleversent les habitudes et s'accompagnent d'un défi, le Coran en faisant partie. Les règles que le Coran ou la Sunna rapportent des prophètes antérieurs nous lient en matière de foi par consensus, et en matière de droit, la majorité les considère comme contraignantes à moins que notre loi ne les écarte, tandis que les chaféites les jugent non contraignantes. Quiconque prétend avoir reçu la prophétie, pour lui-même ou pour autrui, est un menteur et un apostat par consensus, puisque le Prophète est le sceau des prophètes; celui qui confirme une telle prétention devient apostat. Les juristes divergent quant à savoir si un dhimmi qui revendique la prophétie doit être invité à se repentir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15458} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15459} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15460} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15461} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15462}"
