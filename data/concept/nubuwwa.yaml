id: concept/nubuwwa
class: concept
kind: legal
label: { ar: "النُّبُوَّة", en: "Prophethood (nubuwwa)", ur: "نبوت" }
summary:
  ar: "النبوة في اللغة من النبوة والنباوة وهي الارتفاع، أو من النبأ وهو الخبر، والنبيّ مأخوذ منهما. وفي الاصطلاح صفة ثبوتية في النبي وصفة إضافية هي تعلق الخطاب الإلهي به. والرسالة أخص من النبوة، فهي كون الشخص مرسلاً من الله إلى الناس لتبليغ الأحكام. وتثبت النبوة بالمعجزات الخارقة للعادة المقرونة بالتحدي، ومن ذلك القرآن. وما حكاه القرآن أو السنة من شرائع الأنبياء السابقين في أصول الدين ثابت في حقنا اتفاقاً، وفي الفروع فجمهور العلماء على أنه شرع لنا ما لم يرد ما يرده، والشافعية على أنه ليس شرعاً لنا. ومن ادعى النبوة لنفسه أو لغيره فهو كاذب مرتد كافر باتفاق، لأن النبي خاتم النبيين، ومن صدّق مدعي النبوة صار مرتداً، وفي استتابة الذمي المدعي خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15458} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15459} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15460} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15461} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15462}"
  en: "Nubuwwa comes from the root for height or for news, and nabi is related to both. In law it is an affirmative quality of the prophet together with a relational one, the attachment of the divine address to him. Risala is narrower: it is being sent from God to people, or some of them, to convey the law. Prophecy is established by miracles that break habit and are joined with a challenge, the Qur'an among them. Rules that the Qur'an or Sunna relate from earlier prophets bind us in matters of faith by agreement, and in matters of law the majority hold them binding unless our law sets them aside, whereas the Shafi'is hold them not binding for us. Whoever claims prophecy, for himself or for another, is a liar and an apostate by agreement, since the Prophet is the seal of the prophets; one who confirms such a claimant becomes an apostate. Jurists differ on whether a dhimmi who makes the claim is to be asked to repent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15458} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15459} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15460} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15461} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15462}"
  ur: "نبوت وہ صفت ہے جو اللہ کی طرف سے وحی پانے والے نبی میں ثابت ہو۔ رسالت نبوت سے خاص ہے۔ معجزات سے نبوت ثابت ہوتی ہے۔ نبوت کا دعویٰ کرنے والا کاذب اور کافر و مرتد ہے، کیونکہ نبی کریم خاتم النبیین ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15458} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15459} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15460} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15461} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15462}"
