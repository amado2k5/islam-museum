id: concept/childhood-sighar
class: concept
kind: legal
label:
  ar: "الصِّغَر"
  en: "Childhood (sighar: its stages, the rights and duties of the minor, guardianship, the minor in worship and contracts, marriage, testimony and penalties)"
summary:
  ar: "الصغر في اللغة صغر الحجم أو السن، وفي الاصطلاح وصف يلحق الإنسان من مولده إلى بلوغه الحلم، وله مرحلتان: عدم التمييز ثم التمييز، ولا سن محددة للتمييز. وأهلية الوجوب للصغير والكبير، وأهلية الأداء بالتمييز. ويستحب الأذان في أذن المولود، والتحنيك، والتسمية، والعقيقة عند الجمهور، والختان عند الأكثرين. ويتعلق بذمة الصغير قيم المتلفات والنفقة والعشر والزكاة وغيرها، ويطالب بها الولي من ماله. والولاية على النفس والمال، ولا يتصرف الولي في المال إلا بالمصلحة، والغني لا يأكل من مال اليتيم. ويؤمر الصغير بالصلاة لسبع ويضرب عليها لعشر، ولا تجب عليه الصلاة والصوم والحج، ولا تنعقد يمينه ولا نذره. ولا تسلم أمواله حتى يبلغ رشيدا، وللفقهاء خلاف في الحجر والإذن بالتجارة والوصية والزواج والطلاق والعدة والشهادة والقصاص. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10382} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10383} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10384} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10385} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10386} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10387} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10388} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10389} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10390} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10391} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10392} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10393} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10394} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10395} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10396}"
  en: "In language sighar is smallness of size or age; as a term it is a state that attaches to a person from birth until puberty. It has two stages, before discernment and discernment, and discernment has no fixed age. Capacity to have rights and duties belongs to the child and the adult alike; capacity to act depends on discernment. The rights of a newborn include a call to prayer in the right ear and the iqama in the left, tahnik, naming, the 'aqiqa (recommended by most), and circumcision (obligatory for the Shafi'is and Hanbalis, a sunna for the Hanafis and Malikis). Damages, support, tithe, zakat and other dues attach to the minor's estate, and the guardian pays from it. Guardianship covers the person and property; the guardian may only act for the minor's good, and the rich may not eat from an orphan's property. A child is ordered to pray at seven and beaten for it at ten, and is not bound to pray, fast or make the pilgrimage; his oaths and vows do not bind. His property is not handed over until he is of sound judgment, and the schools differ on restriction, licence to trade, bequests, marriage, divorce, waiting periods, testimony, and retaliation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10382} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10383} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10384} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10385} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10386} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10387} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10388} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10389} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10390} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10391} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10392} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10393} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10394} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10395} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10396}"
