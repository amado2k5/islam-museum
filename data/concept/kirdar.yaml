label:
  ar: "كِرْدار"
  en: "Kirdar (improvements on endowed or state land)"
  ur: "کِردار"
summary:
  ar: "الكِردار، ويسمى في خوارزم حق القرار، لفظ فارسي يطلق على ما يُبنى أو يُغرس في الأرض المحتكرة للوقف، وعلى الأراضي التي حازها الإمام لبيت المال ودفعها مزارعة. ويجوز لمستأجري هذه الأراضي بيع ما أحدثوه فيها من بناء أو غرس أو كبس بالتراب إذا كان الكردار معلوماً، لأن ما أحدثوه ملكهم ولهم حق القرار في الأرض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13241}"
  en: "Kirdar is a Persian word, called in Khwarazm the right of tenure. It refers to what is built or planted on land held in endowment on lease, and to lands the ruler has taken for the public treasury and given out for sharecropping. Tenants of such land may sell what they built, planted or filled with earth, once the kirdar is known, because what they made is theirs and they hold the right of tenure in the land. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13241}"
  ur: "کردار فارسی لفظ ہے، جسے خوارزم میں حقِ قرار کہا جاتا ہے۔ اس سے مراد وہ عمارت یا پودا ہے جو وقف کی کرائے کی زمین پر بنایا یا لگایا جائے، اور وہ زمین جو حاکم نے بیت المال کے لیے لی ہو اور مزارعت پر دی ہو۔ ایسی زمین کے کرایہ دار کے لیے جائز ہے کہ وہ اپنی بنائی ہوئی عمارت، لگائے ہوئے پودے یا مٹی بھرائی بیچ دے، جبکہ کردار معلوم ہو، کیونکہ جو اس نے بنایا وہ اس کی ملک ہے اور زمین میں اسے حقِ قرار حاصل ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13241}"
