id: "concept/al-qaml-fi-al-ajfan"
class: "concept"
kind: "scientific"
label:
  ar: "القمل في الأجفان"
  en: "Lice in the eyelids"
  fr: "Les poux des paupières"
  ur: "پلکوں میں جوئیں"
  es: "Piojos en los párpados"
  tr: "Göz kapaklarındaki bit"
  id: "Kutu di kelopak mata"
summary:
  ar: "مادة قمل الأجفان رطوبة عفنة دفعتها الطبيعة إلى ناحية الجلد والقوة المهيئة لتولدها حرارة غير طبيعية، وأكثر من يعرض له من كان كثير التفنن في الأطعمة قليل الرياضة غير متنظف ولا يستعمل الحمام، ويبدأ علاجه بتنقية البدن والرأس ثم غسل العين ونطلها بماء البحر المالح والكبريتية ويلطخ شفر الجفن بدواء قابض ⁦(أسماء الأدوية والغراغر لا تحمل)⁩ {cite:canon-ibn-sina-print-v2 p.193}"
  en: "The matter of eyelid lice is a putrid moisture that nature drives toward the skin, and the predisposing power for its generation an unnatural heat; those most afflicted are people of much food variety, little exercise, unclean and not using the bath; its treatment begins with cleansing the body and the head, then washing the eye and sprinkling it with sea salt and sulphurous waters, and smearing the lid edge with an astringent drug ⁦(drug and gargle names are not carried)⁩ {cite:canon-ibn-sina-print-v2 p.193}"
  fr: "Selon le Canon, les poux des paupières procèdent d’une humidité putride que la nature pousse vers la peau ; une chaleur non naturelle prédispose à leur apparition. Ils touchent surtout les personnes qui mangent des aliments très variés, font peu d’exercice, se tiennent malpropres et ne fréquentent pas les bains. Le traitement décrit commence par la purification du corps et de la tête, puis le lavage de l’œil et l’aspersion de sel marin et d’eaux sulfureuses ; le bord de la paupière est enduit d’un remède astringent (les noms des remèdes et des gargarismes ne sont pas reproduits) {cite:canon-ibn-sina-print-v2 p.193}"
  ur: "پلکوں کے جوؤں کا مادہ ایک عفن شدہ رطوبت ہے جسے طبیعت جلد کی طرف دھکیلتی ہے اور اس کے پیدا ہونے کی مہیا قوت ایک غیر طبیعی حرارت ہے؛ سب سے زیادہ اس کا شکار وہ ہیں جو کھانوں میں زیادہ اقسام رکھتے ہیں، کم ورزش کرتے ہیں، صاف نہیں رہتے اور حمام استعمال نہیں کرتے؛ علاج کی ابتدا بدن اور سر کی تنقیہ سے ہوتی ہے پھر آنکھ دھو کر سمندری نمکین اور گندھک کے پانی چھڑکا جاتا ہے اور پلک کے کنارے پر قابض دوا ملائی جاتی ہے ⁦(ادویہ اور غراروں کے نام منقول نہیں)⁩ {cite:canon-ibn-sina-print-v2 p.193}"
  es: "La infestación por piojos palpebrales se debe a una humedad pútrida que la naturaleza impulsa hacia la piel, y a un calor antinatural que la predispone a su aparición; los más afectados son personas con una alimentación variada, poco ejercicio, falta de higiene y que no se bañan. El tratamiento comienza con la limpieza del cuerpo y la cabeza, seguido del lavado del ojo y la aplicación de agua salada y sulfurosa, y la aplicación de un astringente en el borde del párpado (no se incluyen los nombres del medicamento ni del enjuague bucal). {cite:canon-ibn-sina-print-v2 p.193}"
  tr: "Göz kapağı biti maddesi, doğanın cilde ve anormal ısıyla bunu üreten kuvvete doğru ittiği küflü bir nemdir. En sık maruz kalanlar, çok sık yemek yiyen, egzersiz yapmayan, temizlik yapmayan ve tuvalete gitmeyenlerdir. Tedavi, vücut ve başın arındırılması, ardından gözlerin yıkanması, tuzlu deniz suyu ve kükürtle ıslatılması ve göz kapağı dudaklarının büzücü ile boyanmasıyla başlar (ilaç isimleri ve garglar dahil değildir) {cite:canon-ibn-sina-print-v2 s.193}"
  id: "Zat kutu kelopak mata adalah kelembapan berjamur yang didorong oleh alam ke kulit dan gaya yang dihasilkannya dengan panas yang tidak normal. Paparan yang paling sering terjadi adalah mereka yang sering makan, tidak berolahraga, tidak membersihkan, dan tidak pergi ke toilet. Pengobatan dimulai dengan membersihkan tubuh dan kepala, lalu mencuci mata, merendamnya dengan air laut asin dan belerang, serta mewarnai bibir kelopak mata dengan astringen (tidak termasuk nama obat dan gargs) {cite:canon-ibn-sina-print-v2 hlm.193}"
