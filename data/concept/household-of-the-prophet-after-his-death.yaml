id: concept/household-of-the-prophet-after-his-death
tags: [wasaya-browser, wasaya-legacy, wasaya-mirath]
class: concept
kind: social
label:
  ar: "أهل بيت النبي بعده: نفقة أزواجه وبيوتهن"
  en: "The Prophet's household after him: the wives' maintenance and houses"
  ur: "نبی کے بعد آپ کا گھرانہ: ازواج کا نفقہ اور ان کے گھر"
summary:
  ar: "جعل النبي ما تركه بعد نفقة نسائه ومؤونة عامله صدقة {cite:al-bidaya-wal-nihaya scan vol. 3 p. 312}، فلما توفي أرادت أزواجه أن يبعثن عثمان إلى أبي بكر يسألنه ميراثهن، فذكّرتهن عائشة بقوله لا نورث {cite:al-bidaya-wal-nihaya scan vol. 3 p. 313}. وكان في حياته يعطي كل امرأة منهن ثمانين وسقاً من تمر وعشرين وسقاً من شعير في السنة {cite:al-bidaya-wal-nihaya scan vol. 6 p. 640}، وهُدمت بيوت أزواجه حول المسجد في ولاية الوليد بن عبد الملك {cite:subul-huda-salihi scan vol. 4 p. 2005}. وتنقل الكتب أن زينب بنت جحش كانت أول أزواجه وفاة فصلى عليها عمر وقد فرض لها اثني عشر ألفاً تصدقت بها {cite:al-bidaya-wal-nihaya scan vol. 4 p. 106}."
  en: "The Prophet made what he left after his wives' upkeep and his agent's cost charity {cite:al-bidaya-wal-nihaya scan vol. 3 p. 312}; when he died his wives wanted to send 'Uthman to Abu Bakr to ask for their inheritance, and 'A'isha reminded them of his saying that we are not inherited {cite:al-bidaya-wal-nihaya scan vol. 3 p. 313}. In his life he gave each of them eighty wasq of dates and twenty of barley a year {cite:al-bidaya-wal-nihaya scan vol. 6 p. 640}, and the houses of his wives around the mosque were pulled down in al-Walid ibn 'Abd al-Malik's time {cite:subul-huda-salihi scan vol. 4 p. 2005}. The books report that Zaynab bint Jahsh was the first of his wives to die; 'Umar prayed over her and had fixed her allowance at twelve thousand, which she gave away {cite:al-bidaya-wal-nihaya scan vol. 4 p. 106}."
  ur: "نبی نے اپنی ازواج کے نفقے اور اپنے عامل کے خرچ کے بعد جو کچھ چھوڑا اسے صدقہ قرار دیا {cite:al-bidaya-wal-nihaya scan vol. 3 p. 312}؛ آپ کی وفات پر ازواج نے ارادہ کیا کہ عثمان کو ابوبکر کے پاس بھیج کر اپنی میراث مانگیں، تو عائشہ نے انہیں آپ کا فرمان «لا نورث» یاد دلایا {cite:al-bidaya-wal-nihaya scan vol. 3 p. 313}۔ آپ زندگی میں ہر بیوی کو سال بھر میں اسّی وسق کھجور اور بیس وسق جَو دیتے تھے {cite:al-bidaya-wal-nihaya scan vol. 6 p. 640}، اور مسجد کے گرد ان کے گھر ولید بن عبدالملک کے زمانے میں ڈھا دیے گئے {cite:subul-huda-salihi scan vol. 4 p. 2005}۔ کتابیں بتاتی ہیں کہ زینب بنت جحش آپ کی ازواج میں سب سے پہلے فوت ہوئیں، عمر نے ان کی نماز جنازہ پڑھائی اور ان کا وظیفہ بارہ ہزار مقرر کیا تھا جسے انہوں نے صدقہ کر دیا {cite:al-bidaya-wal-nihaya scan vol. 4 p. 106}۔"
