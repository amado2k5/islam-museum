id: concept/mafhum
class: concept
kind: legal
label:
  ar: المَفْهُوم
  en: Implied meaning (mafhum)
  ur: مفہوم ⁦(لفظ کا لازمی مفہوم)⁩
  es: "Significado implícito (mafhum)"
  fr: "Signification implicite (mafhum)"
  tr: "Kavram"
  id: "Konsep"
summary:
  ar: "المفهوم في الاصطلاح الأصولي ما دل عليه اللفظ لا في محل النطق، أي يكون حكما لغير المذكور أو حالا من أحواله، كدلالة تحريم التأفيف للوالدين على تحريم ضربهما. وينقسم إلى مفهوم الموافقة، وهو ما وافق المنطوق في الحكم، وهو حجة باتفاق، فإن كان أولى سُمّي فحوى الخطاب، وإن كان مساويا سُمّي لحن الخطاب، وإلى مفهوم المخالفة، وهو ثبوت نقيض حكم المنطوق للمسكوت عنه، وهو حجة عند الجمهور إلا مفهوم اللقب، وينفي جمهور الحنفية مفهوم المخالفة في كلام الشارع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14843} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14844} ويذكر الغزالي في المستصفى أن المفهوم هو الاستدلال بتخصيص الشيء بالذكر على نفي الحكم عما عداه، ويسمى مفهوماً لأنه مفهوم مجرد لا يستند إلى منطوق، وربما سُمي دليل الخطاب. {cite:mustasfa p.413} ويذكر أن الشافعي ومالكاً والأكثر من أصحابهما ذهبوا إلى أنه يدل على النفي، وذهب جماعة من المتكلمين ومنهم القاضي وابن سريج إلى أنه لا دلالة له، وهو الأوجه عنده. {cite:mustasfa p.414-415} ويعدّد درجات توهم النفي من الإثبات ثماني مراتب تبتدئ بمفهوم اللقب وهو أبعدها ويقرّ ببطلانه كل محصّل، وتنتهي بمفهوم الغاية وقول «لا عالم في البلد إلا زيد»، ويقرر أن تعليق الحكم بشرط لا يستلزم نفيه عند عدم الشرط بل يقصر عن الدلالة على الوجود فيبقى على ما كان. {cite:mustasfa p.435-438}"
  en: "In the usage of the jurists of legal theory, the implied meaning (mafhum) is what a wording indicates without being in the place where it is spoken: a ruling for something not mentioned, or a state of it. The forbidding of saying uff to parents implies the forbidding of beating them. It divides into agreement (mafhum al-muwafaqa), which agrees with the spoken ruling and is accepted by consensus, called a stronger implication (fahwa al-khitab) when it applies more strongly and an equal implication (lahn al-khitab) when it applies equally; and contrariety (mafhum al-mukhalafa), which gives the opposite ruling to what is unspoken and is accepted by most jurists except the implication from a name alone. Most Hanafis reject contrariety in the speech of the Lawgiver. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14843} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14844} Al-Ghazali's Mustasfa defines the mafhum as inferring the negation of a ruling for what is unmentioned from the restriction of a thing by mention; it is called mafhum because it is a bare implication resting on no explicit wording, and some name it dalil al-khitab. {cite:mustasfa p.413} He records that al-Shafi'i, Malik and most of their followers held it to indicate negation, while a group of theologians including al-Qadi and Ibn Surayj held it has no such indication — the soundest view in his judgment. {cite:mustasfa p.414-415} He enumerates eight degrees of presumed negation, running from the concept of the label, the farthest and one every verifier declares void, to the concept of the limit and the formula «no scholar in the town but Zayd», and holds that attaching a ruling to a condition does not entail its negation when the condition fails, since it only falls short of indicating it in existence and so remains as it was. {cite:mustasfa p.435-438}"
  ur: "اصولِ فقہ میں مفہوم وہ ہے جو لفظ اپنے محلِ نطق کے بغیر بتائے، یعنی غیر مذکور کا حکم۔ والدین کو اُف کہنے کی ممانعت سے ان کو مارنے کی ممانعت سمجھی جاتی ہے۔ مفہوم موافقہ جمہور کے نزدیک حجت ہے، جب کہ مفہوم مخالفہ میں جمہور حنفیہ کے نزدیک شارع کے کلام میں ہی معتبر ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14843} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14844}"
  es: "En el uso de los juristas de la teoría jurídica, el significado implícito (mafhum) es lo que una palabra indica sin estar presente en el lugar donde se pronuncia: una norma sobre algo no mencionado, o un estado de ello. La prohibición de decir \"uff\" a los padres implica la prohibición de golpearlos. Se divide en concordancia (mafhum al-muwafaqa), que concuerda con la norma verbal y es aceptada por consenso, denominada implicación más fuerte (fahwa al-khitab) cuando se aplica con mayor fuerza e implicación igualitaria (lahn al-khitab) cuando se aplica por igual; y contrariedad (mafhum al-mukhalafa), que da la norma opuesta a lo no verbalizado y es aceptada por la mayoría de los juristas, excepto la implicación derivada únicamente del nombre. La mayoría de los hanafíes rechazan la contrariedad en el discurso del Legislador. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14843} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14844} El Mustasfa de Al-Ghazali define el mafhum como la inferencia de la negación de una norma para lo que no se menciona a partir de la restricción de una cosa por mención; se llama mafhum porque es una mera implicación que no se basa en ninguna formulación explícita, y algunos lo llaman dalil al-khitab. {cite:mustasfa p.413} Registra que al-Shafi'i, Malik y la mayoría de sus seguidores lo consideraron indicativo de negación, mientras que un grupo de teólogos, incluidos al-Qadi e Ibn Surayj, consideraron que no tiene tal indicación, la opinión más sólida en su juicio. {cite:mustasfa p.414-415} Enumera ocho grados de presunta negación, que van desde el concepto de etiqueta, el más lejano y que todo verificador declara nulo, hasta el concepto de límite y la fórmula «ningún erudito en la ciudad excepto Zayd», y sostiene que adjuntar una regla a una condición no implica su negación cuando la condición falla, ya que solo no llega a indicar su existencia y, por lo tanto, permanece como estaba. {cite:mustasfa p.435-438}"
  fr: "En théorie juridique, le sens implicite (mafhum) désigne ce qu'un mot suggère sans être explicitement mentionné: une règle concernant une chose non dite, ou un état de celle-ci. L'interdiction de dire « uff » à ses parents implique l'interdiction de les battre. On distingue deux types de sens implicite: l'accord (mafhum al-muwafaqa), qui concorde avec la règle exprimée et fait consensus; on parle alors d'implication forte (fahwa al-khitab) lorsqu'elle s'applique plus fortement, et d'implication égale (lahn al-khitab) lorsqu'elle s'applique de manière égale; et la contradiction (mafhum al-mukhalafa), qui donne une règle opposée à ce qui n'est pas dit et est acceptée par la plupart des juristes, à l'exception de l'implication fondée uniquement sur un nom. La plupart des hanafites rejettent la contradiction dans les paroles du Législateur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14843} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14844} Dans son ouvrage Mustasfa, Al-Ghazali définit le mafhum comme l'inférence de la négation d'une règle concernant ce qui n'est pas mentionné, à partir de la restriction d'une chose par sa mention. On l'appelle mafhum car il s'agit d'une simple implication, sans formulation explicite; certains le nomment dalil al-khitab. {cite:mustasfa p.413} Il rapporte qu'al-Shafi'i, Malik et la plupart de leurs disciples considéraient qu'il indiquait une négation, tandis qu'un groupe de théologiens, dont al-Qadi et Ibn Surayj, estimait qu'il n'en comportait aucune indication – l'avis le plus pertinent selon lui. {cite:mustasfa p.414-415} Il énumère huit degrés de négation présumée, allant du concept d'étiquette, le plus extrême et que tout vérificateur déclare nul, au concept de limite et à la formule « nul savant dans la ville, sauf Zayd », et soutient qu'attacher une décision à une condition n'entraîne pas sa négation lorsque la condition échoue, car cela ne fait que l'empêcher d'exister et elle reste donc en l'état. {cite:mustasfa p.435-438}"
  tr: "Usuli terminolojisinde kavram, kelimenin belirttiği şeydir, ifade edilen yer değil; yani bahsedilen şey dışında bir şey için verilen bir karar veya ebeveynleri vurma yasağıyla azarlamanın yasaklanması gibi bir durumdur. Bu, anlaşma kavramı olarak ikiye ayrılır; bu, yürürlükteki karara uygun olan ve bir anlaşma durumudur; daha olasıysa, konuşmanın içeriği olarak adlandırılır; eşitse konuşmanın tonu olarak adlandırılır; ve susturulan için kullanılan anahtar kelimenin kararının zıttını oluşturan anlaşmazlık kavramı, başlık kavramı hariç çoğunluk için bir argümandır. Hanafilerin çoğunluğu, yasama organının sözlerindeki anlaşmazlık kavramını reddeder. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.14843} {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.14844} Al-Gazali, Al-Mustasfa'da kavramın, hükümün diğerinden olumsuzlanmasını belirterek bir şeyi belirterek çıkarım olduğunu belirtir ve bunun soyut bir kavram olması, açık bir ifadeye dayanmaması ve söylemin kanıtı olarak adlandırılması nedeniyle denir. {atıf:mustasfa s.413} Al-Shafi'i, Malik ve çoğu alimlerinin bunun inkârı gösterdiğini savundukları, Al-Kadi ve İbn Surayj dahil bir grup ilahiyatçı ise bunun bir gösterge olmadığını savunur; bu görüş ona göre en yaygın görüştür. {cite:mustasfa s.414-415} Onaylamadan olumsuzluk yanılsamasının sekiz seviyesini sıralar; başlık kavramından başlayarak en uzak olanıdır ve her sonuçla geçersiz olduğu kabul edilir, amaç kavramı ve \"Topraklarda Zayd dışında bir âlim yoktur\" ifadesiyle sona erer. Bir koşul yoksa, hükmü askıya almasının, onu geçersiz kılmadığını, sadece varoluşu göstermekle sınırlandığını, dolayısıyla durumun olduğu gibi kaldığını belirtir. {cite:mustasfa s.435-438}"
  id: "Dalam terminologi Usuli, konsep adalah apa yang ditunjukkan oleh kata, bukan tempat pengucapan, yaitu merupakan putusan untuk sesuatu selain yang disebutkan atau keadaannya, seperti penandaan larangan orang tua yang menegur terhadap larangan memukul mereka. Konsep ini dibagi menjadi konsep persetujuan, yang sesuai dengan putusan operasional, dan merupakan kasus kesepakatan; jika lebih mungkin, disebut isi ucapan; jika sama, disebut nada pidato; dan konsep ketidaksetujuan, yaitu penetapan kebalikan dari keputusan kata operatif untuk apa yang dibungkam, yang merupakan argumen untuk mayoritas kecuali konsep gelar. Mayoritas Hanafi menolak konsep ketidaksepakatan menurut kata-kata pembuat undang-undang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.14843} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.14844} Al-Ghazali menyebutkan dalam Al-Mustasfa bahwa konsep ini adalah inferensi dengan menentukan sesuatu dengan menyebutkan penolakan aturan dari yang lain, dan disebut konsep karena konsep tersebut abstrak yang tidak didasarkan pada pernyataan eksplisit, dan dapat disebut bukti wacana. {cite:mustasfa hlm.413} Disebutkan bahwa Al-Shafi'i, Malik, dan sebagian besar ulama mereka berpendapat bahwa konsep tersebut menunjukkan penyangkalan, sementara sekelompok teolog, termasuk Al-Qadi dan Ibn Surayj, berpendapat bahwa konsep tersebut tidak memiliki indikasi, yang menurut beliau adalah pandangan paling umum. {cite:mustasfa hlm.414-415} Ia merinci delapan tingkat ilusi negasi dari afirmasi, dimulai dengan konsep gelar, yang merupakan yang terjauh dan diakui tidak sah oleh setiap hasil, diakhiri dengan konsep tujuan dan pernyataan \"Tidak ada sarjana di negeri ini kecuali Zayd.\" Ia menyatakan bahwa menangguhkan putusan atas suatu syarat tidak meniadakan jika tidak ada syarat tetapi membatasi dirinya hanya untuk menunjukkan keberadaan, sehingga tetap seperti semula. {cite:mustasfa hlm.435-438}"
