id: concept/mafhum
class: concept
kind: legal
label:
  ar: المَفْهُوم
  en: Implied meaning (mafhum)
  ur: مفہوم (لفظ کا لازمی مفہوم)
summary:
  ar: "المفهوم في الاصطلاح الأصولي ما دل عليه اللفظ لا في محل النطق، أي يكون حكما لغير المذكور أو حالا من أحواله، كدلالة تحريم التأفيف للوالدين على تحريم ضربهما. وينقسم إلى مفهوم الموافقة، وهو ما وافق المنطوق في الحكم، وهو حجة باتفاق، فإن كان أولى سُمّي فحوى الخطاب، وإن كان مساويا سُمّي لحن الخطاب، وإلى مفهوم المخالفة، وهو ثبوت نقيض حكم المنطوق للمسكوت عنه، وهو حجة عند الجمهور إلا مفهوم اللقب، وينفي جمهور الحنفية مفهوم المخالفة في كلام الشارع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14843} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14844}"
  en: "In the usage of the jurists of legal theory, the implied meaning (mafhum) is what a wording indicates without being in the place where it is spoken: a ruling for something not mentioned, or a state of it. The forbidding of saying uff to parents implies the forbidding of beating them. It divides into agreement (mafhum al-muwafaqa), which agrees with the spoken ruling and is accepted by consensus, called a stronger implication (fahwa al-khitab) when it applies more strongly and an equal implication (lahn al-khitab) when it applies equally; and contrariety (mafhum al-mukhalafa), which gives the opposite ruling to what is unspoken and is accepted by most jurists except the implication from a name alone. Most Hanafis reject contrariety in the speech of the Lawgiver. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14843} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14844}"
  ur: "اصولِ فقہ میں مفہوم وہ ہے جو لفظ اپنے محلِ نطق کے بغیر بتائے، یعنی غیر مذکور کا حکم۔ والدین کو اُف کہنے کی ممانعت سے ان کو مارنے کی ممانعت سمجھی جاتی ہے۔ مفہوم موافقہ جمہور کے نزدیک حجت ہے، جب کہ مفہوم مخالفہ میں جمہور حنفیہ کے نزدیک شارع کے کلام میں ہی معتبر ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14843} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14844}"
