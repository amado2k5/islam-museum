id: concept/mafhum
class: concept
kind: legal
label:
  ar: المَفْهُوم
  en: Implied meaning (mafhum)
  ur: مفہوم ⁦(لفظ کا لازمی مفہوم)⁩
summary:
  ar: "المفهوم في الاصطلاح الأصولي ما دل عليه اللفظ لا في محل النطق، أي يكون حكما لغير المذكور أو حالا من أحواله، كدلالة تحريم التأفيف للوالدين على تحريم ضربهما. وينقسم إلى مفهوم الموافقة، وهو ما وافق المنطوق في الحكم، وهو حجة باتفاق، فإن كان أولى سُمّي فحوى الخطاب، وإن كان مساويا سُمّي لحن الخطاب، وإلى مفهوم المخالفة، وهو ثبوت نقيض حكم المنطوق للمسكوت عنه، وهو حجة عند الجمهور إلا مفهوم اللقب، وينفي جمهور الحنفية مفهوم المخالفة في كلام الشارع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14843} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14844} ويذكر الغزالي في المستصفى أن المفهوم هو الاستدلال بتخصيص الشيء بالذكر على نفي الحكم عما عداه، ويسمى مفهوماً لأنه مفهوم مجرد لا يستند إلى منطوق، وربما سُمي دليل الخطاب. {cite:mustasfa p.413} ويذكر أن الشافعي ومالكاً والأكثر من أصحابهما ذهبوا إلى أنه يدل على النفي، وذهب جماعة من المتكلمين ومنهم القاضي وابن سريج إلى أنه لا دلالة له، وهو الأوجه عنده. {cite:mustasfa p.414-415} ويعدّد درجات توهم النفي من الإثبات ثماني مراتب تبتدئ بمفهوم اللقب وهو أبعدها ويقرّ ببطلانه كل محصّل، وتنتهي بمفهوم الغاية وقول «لا عالم في البلد إلا زيد»، ويقرر أن تعليق الحكم بشرط لا يستلزم نفيه عند عدم الشرط بل يقصر عن الدلالة على الوجود فيبقى على ما كان. {cite:mustasfa p.435-438}"
  en: "In the usage of the jurists of legal theory, the implied meaning (mafhum) is what a wording indicates without being in the place where it is spoken: a ruling for something not mentioned, or a state of it. The forbidding of saying uff to parents implies the forbidding of beating them. It divides into agreement (mafhum al-muwafaqa), which agrees with the spoken ruling and is accepted by consensus, called a stronger implication (fahwa al-khitab) when it applies more strongly and an equal implication (lahn al-khitab) when it applies equally; and contrariety (mafhum al-mukhalafa), which gives the opposite ruling to what is unspoken and is accepted by most jurists except the implication from a name alone. Most Hanafis reject contrariety in the speech of the Lawgiver. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14843} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14844} Al-Ghazali's Mustasfa defines the mafhum as inferring the negation of a ruling for what is unmentioned from the restriction of a thing by mention; it is called mafhum because it is a bare implication resting on no explicit wording, and some name it dalil al-khitab. {cite:mustasfa p.413} He records that al-Shafi'i, Malik and most of their followers held it to indicate negation, while a group of theologians including al-Qadi and Ibn Surayj held it has no such indication — the soundest view in his judgment. {cite:mustasfa p.414-415} He enumerates eight degrees of presumed negation, running from the concept of the label, the farthest and one every verifier declares void, to the concept of the limit and the formula «no scholar in the town but Zayd», and holds that attaching a ruling to a condition does not entail its negation when the condition fails, since it only falls short of indicating it in existence and so remains as it was. {cite:mustasfa p.435-438}"
  ur: "اصولِ فقہ میں مفہوم وہ ہے جو لفظ اپنے محلِ نطق کے بغیر بتائے، یعنی غیر مذکور کا حکم۔ والدین کو اُف کہنے کی ممانعت سے ان کو مارنے کی ممانعت سمجھی جاتی ہے۔ مفہوم موافقہ جمہور کے نزدیک حجت ہے، جب کہ مفہوم مخالفہ میں جمہور حنفیہ کے نزدیک شارع کے کلام میں ہی معتبر ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14843} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.14844}"
