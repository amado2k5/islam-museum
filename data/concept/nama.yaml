label:
  ar: "نَمَاء"
  en: "Nama' (increase and yield)"
  ur: "نماء ⁦(بڑھوتری اور آمدنی)⁩"
  es: "Nama' (aumento y rendimiento)"
  fr: "Nama' (augmentation et rendement)"
  tr: "Büyüme"
  id: "Pertumbuhan"
summary:
  ar: "النماء في اللغة الزيادة، وعند الفقهاء الزيادة والفائدة والدخل، وتنقسم أقسامه باعتبار المشروعية والطبيعة والاتصال والحقيقة، وتتعلق به أحكام في الزكاة والصداق والبيع والرهن والشفعة والغصب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16198} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16199}"
  en: "Nama' is, in the lexicon, growth; for the jurists, the increase, benefit and income a thing produces. It is divided by lawfulness, nature, connection and fact or estimate, and its rulings touch zakat, dower, sale, pledge, pre-emption and usurpation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16198} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16199}"
  ur: "نماء لغت میں بڑھوتری ہے، اور فقہاء کے نزدیک زیادتی، فائدہ اور آمدنی۔ اس کی تقسیم مشروعیت، طبیعت، اتصال اور حقیقت و تقدیر کے اعتبار سے ہے، اور اس کے احکام زکاة، مہر، بیع، رہن، شفعہ اور غصب سے متعلق ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16198} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16199}"
  es: "Nama' significa, en el léxico, crecimiento; para los juristas, el aumento, beneficio e ingreso que produce algo. Se divide según la legalidad, la naturaleza, la conexión y el hecho o la estimación, y sus normas abarcan el zakat, la dote, la venta, la prenda, el derecho de tanteo y la usurpación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16198} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16199}"
  fr: "Dans le lexique, Nama' signifie croissance; pour les juristes, il s'agit de l'accroissement, du bénéfice et du revenu qu'une chose produit. Elle est divisée selon la licéité, la nature, le lien et le fait ou l'estimation, et ses règles concernent la zakat, la dot, la vente, le gage, la préemption et l'usurpation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16198} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16199}"
  tr: "Dil açısından büyüme artış demektir ve hukukçulara göre artış, faiz ve gelir anlamına gelir. Kategorileri meşruiyet, doğa, bağlantı ve gerçekliğe göre ayrılmıştır. Ayrıca zekat, çeyiz, satış, ipotek, öncelik ve gaspla ilgili kararları da içerir. {kaynak:fiqh-mawsua-kuwaitiyya-noor-v3 s.16198} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.16199}"
  id: "Dalam bahasa, pertumbuhan berarti meningkat, dan menurut ahli hukum, berarti peningkatan, bunga, dan pendapatan. Kategorinya dibagi berdasarkan legitimasi, sifat, keterhubungan, dan realitas. Ini juga mencakup putusan tentang zakat, mas kawin, penjualan, hipotek, pengambilan, dan pengambilalihan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16198} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.16199}"
