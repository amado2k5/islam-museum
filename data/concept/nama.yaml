id: concept/nama
class: concept
kind: legal
label:
  ar: "نَمَاء"
  en: "Nama' (increase and yield)"
  ur: "نماء (بڑھوتری اور آمدنی)"
summary:
  ar: "النماء في اللغة الزيادة، وعند الفقهاء الزيادة والفائدة والدخل، وتنقسم أقسامه باعتبار المشروعية والطبيعة والاتصال والحقيقة، وتتعلق به أحكام في الزكاة والصداق والبيع والرهن والشفعة والغصب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16198} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16199}"
  en: "Nama' is, in the lexicon, growth; for the jurists, the increase, benefit and income a thing produces. It is divided by lawfulness, nature, connection and fact or estimate, and its rulings touch zakat, dower, sale, pledge, pre-emption and usurpation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16198} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16199}"
  ur: "نماء لغت میں بڑھوتری ہے، اور فقہاء کے نزدیک زیادتی، فائدہ اور آمدنی۔ اس کی تقسیم مشروعیت، طبیعت، اتصال اور حقیقت و تقدیر کے اعتبار سے ہے، اور اس کے احکام زکاة، مہر، بیع، رہن، شفعہ اور غصب سے متعلق ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16198} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.16199}"
wings: [ideas]
themes: [trade-and-finance]
regions: [global]
issue:
  ar: "هل يتبع النماء الأصل، وفي أي الأحوال يكون للمالك أو للمشتري أو للمرأة؟"
  en: "Does the increase follow the principal, and in which cases does it belong to the owner, the buyer or the wife?"
  ur: "کیا نماء اصل کا تابع ہے، اور کن حالات میں یہ مالک، مشتری یا عورت کا ہوتا ہے؟"
