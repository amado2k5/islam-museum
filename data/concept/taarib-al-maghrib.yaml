id: concept/taarib-al-maghrib
class: concept
kind: term
tags: [arabiyya-browser, arabiyya-origins]
label:
  ar: "تعريب المغرب"
  en: "The Arabisation of the Maghrib"
  ur: "مغرب کی تعریب"
  fr: "L'arabisation du Maghreb"
  es: "La arabización del Magreb"
  tr: "Fas'ın Araplaştırılması"
  id: "Arabisasi Maroko"
summary:
  ar: "ما يقوله ملخص بحثي زُوّد به المتحف عن تعريب المغرب في موجتين: موجة أولى حضرية وساحلية بدأت بتأسيس القيروان سنة 670 م وأنتجت لهجات حضرية سابقة للهلاليين، وموجة ثانية بدوية جاءت بها هجرات بني هلال وبني سليم في القرن الحادي عشر، ثم المعقل وبني حسان بين القرنين الثالث عشر والخامس عشر، فعرّبت الريف والسهوب. ولم يفتح المتحف الصفحات المسمّاة، وقد أجاز المؤسس استعمال الملخص في 21 نوفمبر 2026."
  en: "What a research summary supplied to the museum says about the Arabisation of the Maghrib in two waves: a first, urban and coastal, that began with the founding of Kairouan in 670 CE and produced urban pre-Hilalian dialects, and a second, Bedouin, carried by the migrations of the Banu Hilal and Banu Sulaym in the 11th century and then the Ma'qil and the Banu Hassan between the 13th and 15th centuries, which Arabised the countryside and the steppes. The museum did not open the pages named, and the founder approved using the summary on 21 November 2026."
  ur: "ایک تحقیقی خلاصہ، جو متحف کو فراہم کیا گیا، مغرب کی تعریب کے بارے میں دو لہروں میں کیا کہتا ہے: پہلی، شہری اور ساحلی، جو 670 عیسوی میں قیروان کی بنیاد سے شروع ہوئی اور ہلالیوں سے پہلے کی شہری بولیاں پیدا کیں، اور دوسری، بدوی، جسے گیارہویں صدی میں بنو ہلال اور بنو سلیم کی ہجرتیں لائیں، پھر تیرہویں اور پندرہویں صدی کے درمیان معقل اور بنو حسان، جنہوں نے دیہات اور میدانوں کو عربی بنایا۔ متحف نے نامزد صفحات نہیں کھولے، اور بانی نے 21 نومبر 2026 کو خلاصے کے استعمال کی منظوری دی۔"
  fr: "Ce que dit un résumé de recherche remis au musée sur l'arabisation du Maghreb en deux vagues : une première, urbaine et côtière, qui a commencé avec la fondation de Kairouan en 670 et produit des dialectes urbains pré-hilaliens, et une seconde, bédouine, portée par les migrations des Banu Hilal et des Banu Sulaym au XIe siècle puis des Ma'qil et des Banu Hassan entre le XIIIe et le XVe siècle, qui a arabisé les campagnes et les steppes. Le musée n'a pas ouvert les pages nommées, et le fondateur a approuvé l'usage du résumé le 21 novembre 2026."
  es: "Lo que dice un resumen de investigación entregado al museo sobre la arabización del Magreb en dos oleadas: una primera, urbana y costera, que empezó con la fundación de Kairuán en 670 y produjo dialectos urbanos prehilalíes, y una segunda, beduina, llevada por las migraciones de los Banu Hilal y los Banu Sulaym en el siglo XI y luego de los Ma'qil y los Banu Hassan entre los siglos XIII y XV, que arabizó el campo y las estepas. El museo no abrió las páginas nombradas, y el fundador aprobó usar el resumen el 21 de noviembre de 2026."
  tr: "Müzenin söyledikleri, Fas'ın Araplaşması hakkında iki dalga halinde sunulan bir araştırma özetidir: ilk kentsel ve kıyı dalgası, 670 yılında Kairouan'ın kuruluşuyla başlamış, Hilali'den önce kentsel lehçeler ortaya çıkmıştır; ikinci bir bedevi dalgası ise 11. yüzyılda Banu Hilal ve Banu Sulaym'ın göçleriyle, ardından 13. ve 15. yüzyıllar arasında Ma'qil ve Banu Hassan'ın Rif ve bozkırları Araplaştırmasıyla ortaya çıkmıştır. Müze adı geçen sayfaları açmamış ve kurucu özetin kullanımına 21 Kasım 2026'da izin vermiştir."
  id: "Yang dikatakan museum adalah ringkasan penelitian tentang Arabisasi Maroko dalam dua gelombang: gelombang pertama perkotaan dan pesisir dimulai dengan pendirian Kairouan pada tahun 670 M, menghasilkan dialek perkotaan yang mendahului Hilali, dan gelombang Bedouin kedua yang dibawa oleh migrasi Banu Hilal dan Banu Sulaym pada abad ke-11, kemudian Ma'qil dan Banu Hassan antara abad ke-13 dan ke-15, mengarabkan Rif dan stepa. Museum tidak membuka halaman-halaman yang disebutkan, dan pendiri mengizinkan penggunaan ringkasan pada 21 November 2026."
