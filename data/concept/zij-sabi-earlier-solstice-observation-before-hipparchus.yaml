id: concept/zij-sabi-earlier-solstice-observation-before-hipparchus
class: concept
kind: scientific
label: { ar: "رصد انقلاب أقدم من أرخس", en: "An older solstice observation, before Hipparchus", ur: "ارخس سے پہلے کی انقلابِ صیفی کی رصد", es: "Una observación del solsticio más antigua, anterior a Hiparco.", fr: "Une observation plus ancienne du solstice, antérieure à Hipparque" }
summary:
  ar: "يذكر البتاني، ناقلاً أيضاً عن بطليموس، رصداً قديماً للانقلاب الصيفي كان قبل رصد أرخس، لراصد يقرأ اسمه في المخطوط على صور مضطربة، فوجد الانقلاب الصيفي سابقاً الربع التام بيوم واحد وكسر، ونسبة ذلك إلى المدة المذكورة هي نسبة يومين تامين إلى ثلاثمائة سنة، فوافق ما اعتمد عليه من يوم في كل ثلاثمائة سنة {cite:zij-sabi-nallino-byblion pp.66-67}."
  en: "Al-Battani, again quoting Ptolemy, mentions an old observation of the summer solstice that came before Hipparchus's, by an observer whose name is written in disturbed forms in the manuscript; the solstice was found to precede the whole quarter by one day and a fraction, a ratio to the stated span, as the text puts it, of two whole days to three hundred years, which agreed with the one day in three hundred years he had relied on {cite:zij-sabi-nallino-byblion pp.66-67}."
  ur: "البتانی، دوبارہ بطلیموس سے نقل کرتے ہوئے، انقلابِ صیفی کی ایک پرانی رصد بتاتے ہیں جو ارخس کی رصد سے پہلے کی تھی، ایک ایسے مشاہد کی جس کا نام مخطوطہ میں بگڑی ہوئی شکلوں میں آتا ہے؛ اس میں انقلاب کو پورے چوتھائی سے ایک دن اور ایک کسر پہلے پایا گیا، جس کی مذکورہ مدت سے نسبت، متن کے الفاظ میں، دو پورے دنوں کی تین سو سال سے نسبت کے برابر ہے، اور یہ اس ایک دن فی تین سو سال کے مطابق نکلا جس پر وہ اعتماد کیے ہوئے تھے {cite:zij-sabi-nallino-byblion pp.66-67}۔"
  es: "Al-Battani, citando nuevamente a Ptolomeo, menciona una antigua observación del solsticio de verano que precedió a la de Hiparco, realizada por un observador cuyo nombre aparece escrito de forma desordenada en el manuscrito; se descubrió que el solsticio precedía al trimestre completo por un día y una fracción, una proporción con respecto al lapso indicado, como lo expresa el texto, de dos días completos por trescientos años, lo cual coincidía con el día en trescientos años en el que se había basado {cite:zij-sabi-nallino-byblion pp.66-67}."
  fr: "Al-Battani, citant à nouveau Ptolémée, mentionne une ancienne observation du solstice d'été antérieure à celle d'Hipparque, par un observateur dont le nom est écrit de manière altérée dans le manuscrit; on a constaté que le solstice précédait le trimestre entier d'un jour et une fraction, un rapport avec la durée indiquée, comme le dit le texte, de deux jours entiers pour trois cents ans, ce qui correspondait au jour en trois cents ans sur lequel il s'était appuyé {cite:zij-sabi-nallino-byblion pp.66-67}."
