label:
  ar: خيل
  en: Khayl (horses)
  ur: خیل
  es: "Khayl (caballos)"
  fr: "Khayl (chevaux)"
  tr: "Atlar"
  id: "Kuda"
summary:
  ar: 'الخيل جماعة الأفراس، وهي مؤنثة لا واحد لها من لفظها أو واحدها خائل، والجمع خيول وأخيال، وسميت لاختيالها أي إعجابها بنفسها مرحا، وتطلق على العراب والبراذين ذكورهما وإناثهما ومنه سورة النحل الآية 8، وتطلق على الفرسان ومنه سورة الإسراء الآية 64، ولا يخرج استعمال الفقهاء للفظ عن المعنى اللغوي بالإطلاق الأول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8037} حث الشارع على اقتناء الخيل للجهاد وارتباطها في سبيل الله بسورة الأنفال الآية 60 وبحديث «الخيل معقود في نواصيها الخير إلى يوم القيامة». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8037} في زكاتها ذهب جمهور الفقهاء وهو قول أبي يوسف ومحمد وعليه الفتوى عند الحنفية إلى أنه لا زكاة فيها إلا إذا كانت للتجارة لحديث «ليس على المسلم في فرسه وغلامه صدقة» وحديث «قد عفوت عن صدقة الخيل والرقيق» ولأنها ليست من بهيمة الأنعام؛ وقال أبو حنيفة إن السائمة منها إذا كانت ذكورا وإناثا تجب فيها الزكاة، وإن كانت كلها إناثا فروايتان، وإن كانت كلها ذكورا ففي ظاهر الرواية لا تجب وفي مسائل النوادر تجب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8037}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8038} في أكلها يرى جمهور الفقهاء الشافعية والحنابلة وهو قول للمالكية أنها مباح الأكل، ويرى الحنفية في الراجح وهو قول ثان للمالكية أن أكلها حلال مع الكراهة التنزيهية وبه قال الأوزاعي وأبو عبيد، وفي رواية عن أبي حنيفة مع الكراهة التحريمية ونحوه قول للمالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8038} في سهمها من الغنيمة ذهب الجمهور إلى أن للفارس ثلاثة أسهم سهم له وسهمان لفرسه وإليه ذهب عمر بن عبد العزيز والحسن وابن سيرين والثوري والليث بن سعد وإسحاق وأبو ثور لحديث ابن عمر أنه أسهم يوم خيبر للفارس ثلاثة أسهم سهمين لفرسه وسهما له؛ وقال أبو حنيفة إن للفرس سهما واحدا لحديث مجمع بن حارثة في قسمة خيبر وضعفه ابن حجر، ولأنه حيوان ذو سهم فلم يزد على سهم كالآدمي؛ ولا يسهم لأكثر من فرس واحد عند الحنفية إلا أبا يوسف والمالكية والشافعية لأنه لا يقاتل على أكثر منها؛ ويرى الحنابلة وهو قول أبي يوسف أنه يسهم لفرسين لا أكثر لما روى الأوزاعي أنه كان لا يسهم للرجل فوق فرسين وإن كان معه عشرة أفراس، ولأن بالثاني حاجة إذ إدامة ركوب واحد تضعفه وتمنع القتال عليه بخلاف الثالث المستغنى عنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8038}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8039} ولا خلاف بين الفقهاء في جواز المسابقة بين الخيل بعوض أو بغيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8039} وتتعلق بالخيل مسائل أخرى بحثت في مواضعها كإنزاء الحمير عليها في الزكاة، وطهارة بولها للمجاهد أصابه بأرض حرب في باب النجاسات، وركوب المرأة في مباحث الحظر والإباحة، ومنع الذمي من ركوبها في الجزية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8039}'
  en: 'Khayl is the collective of horses; it is feminine with no singular of its own form — a stated singular being kha''il, plurals khuyul and akhyal — and was named for their prancing self-admiration; it covers Arab and non-Arab horses, male and female, as in Surah al-Nahl ayah 8, and is applied to cavalrymen as in Surah al-Isra ayah 64; the jurists'' usage stays within the first linguistic sense. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8037} The Law urges acquiring horses for jihad and tethering them for the cause of God, by Surah al-Anfal ayah 60 and the hadith "goodness is tied to the forelocks of horses until the Day of Resurrection". {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8037} On their zakat, the majority, including Abu Yusuf and Muhammad on whom the Hanafi fatwa rests, hold none is due unless they are for trade, by "a Muslim owes no sadaqa on his horse and his servant" and "I have exempted you from sadaqa on horses and slaves", and because they are not grazing livestock; Abu Hanifa obliges it on pastured horses when they are male and female, with two reports when all female, and on the apparent report none when all male though the Nawadir questions oblige it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8037}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8038} On eating them, the majority — the Shafiis, Hanbalis and a Maliki view — permit it; the Hanafis on the preponderant view and a second Maliki view hold it lawful with light disapproval, also the view of al-Awza''i and Abu Ubayd, while a transmission from Abu Hanifa and a Maliki view give grave disapproval. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8038} On their booty share, the majority allot the horseman three shares, one for him and two for his horse, the view of Umar ibn Abd al-Aziz, al-Hasan, Ibn Sirin, al-Thawri, al-Layth ibn Sa''d, Ishaq and Abu Thawr, for Ibn Umar''s report that at Khaybar he allotted the horseman three shares, two for the horse and one for him; Abu Hanifa gives the horse one share for Mujamma'' ibn Haritha''s report on the Khaybar division, weakened by Ibn Hajar, and because it is an animal with a share not exceeding one like the human; no more than one horse shares at the Hanafis except Abu Yusuf, the Malikis and the Shafiis since no one fights on more than one; the Hanbalis, and Abu Yusuf among the Hanafis, let two horses share and no more, per al-Awza''i''s report that no man received for more than two horses even with ten, since a second is needed — constant riding of one weakens it and bars fighting on it — while a third is dispensable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8038}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8039} The jurists do not dispute the permissibility of horse racing, with a prize or without. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8039} Other questions attach to horses in their places: a donkey stallion covering mares in zakat, the purity of their urine for a fighter on enemy soil under impurities, women riding under prohibition and permission, and barring the dhimmi from riding under jizya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8039}'
  ur: 'خیل گھوڑوں کا مجموعہ ہے؛ یہ مونث ہے جس کی اسی لفظ سے واحد نہیں یا واحد خائل ہے، جمع خیول اور اخیال ہے، اور اس کا نام اختیال یعنی مرح کے ساتھ خود پسندی سے رکھا گیا؛ یہ عرب اور غیر عرب گھوڑوں نر و مادہ دونوں پر بولا جاتا ہے جیسا سورۃ النحل آیت 8 میں، اور سواروں پر بھی جیسا سورۃ الاسراء آیت 64 میں؛ فقہاء کا استعمال پہلے لغوی معنی سے باہر نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8037} شارع نے جہاد کے لیے گھوڑے پالنے اور اللہ کے راستے میں باندھنے کی ترغیب دی سورۃ الانفال آیت 60 اور حدیث «قیامت تک گھوڑوں کی پیشانیوں میں بھلائی بندھی ہے» سے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8037} ان کی زکات میں جمہور فقہاء کا اور ابو یوسف و محمد کا قول جس پر حنفی فتوی ہے یہ ہے کہ زکات نہیں سوائے تجارت کے لیے ہوں، حدیث «مسلمان پر اس کے گھوڑے اور غلام کی صدقہ نہیں» اور حدیث «میں نے تم سے گھوڑوں اور غلاموں کا صدقہ معاف کیا» کے مطابق اور اس لیے کہ وہ چرنے والے مویشی نہیں؛ ابو حنیفہ کے نزدیک چرنے والے گھوڑوں میں زکات واجب ہے جب نر اور مادہ دونوں ہوں، سب مادہ ہوں تو دو روایتیں، سب نر ہوں تو ظاہر روایت میں نہیں مگر مسائل النوادر میں واجب۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8037}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8038} ان کے کھانے میں جمہور فقہاء یعنی شافعیہ، حنابلہ اور مالکیہ کا ایک قول مباح مانتے ہیں؛ حنفیہ راجح میں اور مالکیہ کا دوسرا قول تنزیہی کراہت کے ساتھ حلال مانتے ہیں اور اوزاعی و ابو عبید نے بھی یہی کہا، اور ابو حنیفہ سے ایک روایت تحریمی کراہت کی ہے اور مالکیہ کا ایک قول بھی ایسا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8038} غنیمت میں ان کے حصے میں جمہور کے نزدیک سوار کو تین حصے ہیں: اس کا ایک اور اس کے گھوڑے کے دو، اور عمر بن عبدالعزیز، حسن، ابن سیرین، ثوری، لیث بن سعد، اسحاق اور ابو ثور نے بھی یہی کہا ابن عمر کی حدیث پر کہ خیبر کے دن سوار کو تین حصے دیے گھوڑے کے دو اور اس کا ایک؛ ابو حنیفہ کے نزدیک گھوڑے کا ایک حصہ ہے مجمع بن حارثہ کی حدیث پر جسے ابن حجر نے ضعیف کیا، اور اس لیے کہ وہ ایک حصے والا حیوان ہے تو ایک سے زیادہ نہیں جیسے انسان؛ حنفیہ سوائے ابو یوسف کے، مالکیہ اور شافعیہ کے نزدیک ایک سے زیادہ گھوڑے کا حصہ نہیں کیونکہ ایک سے زیادہ پر قتال ممکن نہیں؛ حنابلہ اور حنفیہ میں ابو یوسف کے نزدیک دو گھوڑوں تک حصہ ہے زیادہ نہیں، اوزاعی کی روایت پر کہ کسی کو دو گھوڑوں سے زیادہ کا حصہ نہیں دیا گیا خواہ دس ہوں، کیونکہ دوسرے کی ضرورت ہے کہ ایک پر مسلسل سواری اسے کمزور اور قتال سے باہر کرتی ہے بخلاف تیسرے کے جو بے نیاز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8038}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8039} فقہاء میں گھوڑوں کی مسابقہ انعام کے ساتھ یا بغیر جائز ہونے پر اختلاف نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8039} اور گھوڑوں سے دیگر مسائل اپنے مواضع پر بحث ہوئیں جیسے زکات میں گدھوں کا ان پر ٹپنا، نجاستوں کے باب میں حرب کی سرزمین میں مجاہد کو ان کے پیشاب کی طہارت، حظر و اباحہ میں عورت کی سواری، اور جزیت میں ذمی کی سواری کی ممانعت۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8039}'
  es: "Khayl es el colectivo de caballos; es femenino sin singular propio —un singular declarado es kha'il, plurales khuyul y akhyal— y fue nombrado por su brioso autoadmiración; abarca caballos árabes y no árabes, machos y hembras, como en Surah al-Nahl ayah 8, y se aplica a los jinetes como en Surah al-Isra ayah 64; el uso de los juristas se mantiene dentro del primer sentido lingüístico. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8037} La Ley insta a adquirir caballos para la yihad y atarlos para la causa de Dios, por Surah al-Anfal ayah 60 y el hadiz \"la bondad está atada a los flequillos de los caballos hasta el Día de la Resurrección\". {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8037} Sobre su zakat, la mayoría, incluyendo a Abu Yusuf y Muhammad en quienes se basa la fatwa Hanafi, sostienen que no se debe a menos que sean para el comercio, por \"un musulmán no debe sadaqa por su caballo y su sirviente\" y \"los he eximido de sadaqa por caballos y esclavos\", y porque no son ganado de pastoreo; Abu Hanifa lo obliga en caballos de pastoreo cuando son machos y hembras, con dos informes cuando todas son hembras, y en el informe aparente ninguno cuando todos son machos aunque las preguntas Nawadir lo obligan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8037}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8038} Sobre comerlos, la mayoría —los Shafiis, Hanbalis y una visión Maliki— lo permiten; Los hanafíes en la opinión predominante y una segunda opinión malikí la consideran lícita con leve desaprobación, también la opinión de al-Awza'i y Abu Ubayd, mientras que una transmisión de Abu Hanifa y una opinión malikí dan una grave desaprobación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8038} En cuanto a su parte del botín, la mayoría asigna al jinete tres partes, una para él y dos para su caballo, la opinión de Umar ibn Abd al-Aziz, al-Hasan, Ibn Sirin, al-Thawri, al-Layth ibn Sa'd, Ishaq y Abu Thawr, para el informe de Ibn Umar de que en Khaybar asignó al jinete tres partes, dos para el caballo y una para él; Abu Hanifa le da al caballo una parte por el informe de Mujamma' ibn Haritha sobre la división de Khaybar, debilitado por Ibn Hajar, y porque es un animal con una parte que no excede uno como el humano; no más de un caballo comparte en los Hanafis excepto Abu Yusuf, los Malikis y los Shafiis ya que nadie lucha en más de uno; los Hanbalis, y Abu Yusuf entre los Hanafis, dejan que dos caballos compartan y no más, según el informe de al-Awza'i de que ningún hombre recibió por más de dos caballos incluso con diez, ya que se necesita un segundo —montar constantemente uno lo debilita e impide luchar en él— mientras que un tercero es prescindible. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8038}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8039} Los juristas no cuestionan la permisibilidad de las carreras de caballos, con o sin premio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8039} Otras preguntas se relacionan con los caballos en sus lugares: un semental burro que cubre a las yeguas con zakat, la pureza de su orina para un luchador en suelo enemigo bajo impurezas, mujeres montando bajo prohibición y permiso, y prohibiendo a los dhimmi montar bajo jizya. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8039}"
  fr: "Khayl désigne collectivement les chevaux; ce terme féminin n'a pas de forme singulière propre (le singulier étant kha'il, les pluriels khuyul et akhyal) et tire son nom de leur fierté et de leur assurance. Il englobe les chevaux arabes et non arabes, mâles et femelles, comme dans la sourate An-Nahl, verset 8, et s'applique aux cavaliers, comme dans la sourate Al-Isra, verset 64; l'usage des juristes s'en tient au premier sens linguistique. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8037} La Loi exhorte à acquérir des chevaux pour le jihad et à les attacher pour la cause de Dieu, conformément à la sourate Al-Anfal, verset 60, et au hadith: « La vertu est attachée à la crinière des chevaux jusqu'au Jour de la Résurrection. » {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8037} Concernant la zakat, la majorité, y compris Abu Yusuf et Muhammad sur lesquels repose la fatwa hanafite, estime qu'elle n'est due que si les chevaux sont destinés au commerce, en se référant aux maximes suivantes: « Un musulman ne doit pas de sadaqa sur son cheval et son serviteur » et « Je vous ai exemptés de sadaqa sur les chevaux et les esclaves », et parce qu'il ne s'agit pas de bétail au pâturage. Abu Hanifa l'impose pour les chevaux au pâturage, mâles et femelles, avec deux avis concernant les femelles uniquement, et selon un avis apparent, elle n'est due que pour les mâles uniquement, bien que les questions de Nawadir l'imposent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8037}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8038} Quant à leur consommation, la majorité — les chaféites, les hanbalites et une opinion malikite — l'autorise. Les Hanafites, selon l'avis prépondérant, et une seconde opinion malikite, le considèrent comme licite avec une légère désapprobation, de même que l'avis d'al-Awza'i et d'Abu Ubayd, tandis qu'une transmission d'Abu Hanifa et un avis malikite expriment une forte désapprobation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8038} Concernant leur part du butin, la majorité attribue au cavalier trois parts, une pour lui et deux pour son cheval, avis d'Umar ibn Abd al-Aziz, al-Hasan, Ibn Sirin, al-Thawri, al-Layth ibn Sa'd, Ishaq et Abu Thawr, en raison du récit d'Ibn Umar selon lequel à Khaybar, il a attribué au cavalier trois parts, deux pour le cheval et une pour lui; Abu Hanifa attribue une part au cheval, conformément au récit de Mujamma' ibn Haritha sur la division de Khaybar, affaibli par Ibn Hajar, et parce qu'il s'agit d'un animal dont la part ne peut excéder une, à l'instar de l'être humain. Chez les Hanafites, à l'exception d'Abu Yusuf, les Malikites et les Chafiites, pas plus d'un cheval n'est pris en compte, car nul ne combat sur plus d'un cheval. Les Hanbalites, et Abu Yusuf parmi les Hanafites, autorisent deux chevaux, pas plus, selon le récit d'al-Awza'i qui rapporte qu'aucun homme ne reçoit plus de deux chevaux, même avec dix, car un deuxième est nécessaire – monter constamment un seul cheval l'affaiblit et empêche de combattre avec lui – tandis qu'un troisième est superflu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8038}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8039} Les juristes ne contestent pas la licéité des courses de chevaux, avec ou sans prix. {cite: fiqh-mawsua-kuwaitiyya-noor-v3 p.8039} D'autres questions concernent les chevaux à leur place: un étalon d'âne couvrant des juments en zakat, la pureté de leur urine pour un combattant sur le sol ennemi sous des impuretés, les femmes chevauchant sous interdiction et autorisation, et interdisant au dhimmi de monter sous jizya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8039}"
  tr: "Atlar bir at grubudur ve tekil olarak 'khayil' (khayil) olmadan dişildirler. Çoğulları 'khayal' ve 'khayal' olup, kendilerine duydukları hayranlık anlamına gelen 'khayal' nedeniyle adlandırılmıştır. 'al-'arb' ve 'baradeen' terimleri hem erkek hem dişidir; En-Nah Suresi, 8. ayette olduğu gibi, 'al-risaan' ise atlıları ifade eder; bunlardan Al-İsra Suresi, 64. ayet. Hukukçuların bu kelimeyi kullanması ilk terimdeki dilsel anlamdan sapmaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8037} Kanuniyetçi, cihad için at edinmeyi ve onların Allah yolunda bağlantısını teşvik etti; bu, Enfal Suresi'nin 60. ayetinde ve hadislerde belirtildiği gibi: 'Atlar kıyamet gününe kadar alnından iyilikle bağlanır.' {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8037} Çoğu hukukçu Ebu Yusuf ve Muhammed'in görüşünü benimser ve Hanefi hükmü, \"Müslümanın atında veya kölesinde zekatı yoktur\" ve hadise dayanan \"At ve kölelerin sadakatından feragat ettim\" hadislerine dayanır. Çünkü onlar hayvanlar arasında değildir. Ebu Hanife, zekatın dişi develere verildiğini, hepsi dişi olsa bile, ve hepsi dişi ise iki rivayet olduğunu söylemiştir. Eğer hepsi erkekse, görünürdeki rivayete göre zorunlu değildir, ancak nadir durumlarda zekat zorunludur. {atıf:fiqh-mawsua-kuveytiyya-noor-v3 s.8037} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8038} Şafii ve Hanbali hukukçularının çoğunluğu, Maliki görüşüne göre, yemenin caiz olduğu görüşünü benimserken, Hanefi görüşü ise Malikilerin ikinci görüşü olan tercih edilen görüşte, kutsal olanı sevmemesine rağmen yemeğin caiz olduğunu savunur; bu görüş Al-Awza'i ve Ebu Ubeyd'in dediği gibi. Ebu Hanifa'nın başka bir rivayetinde, yasaklama ve benzeri bir şekilde hoşlanmayan Malikilerin görüşü Malikilerin görüşüdür. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8038} Ganimetin payı konusunda çoğunluk şövalyenin üç oku olduğunu savundu: atı için iki ok, atı için iki ok. Ona Ömer bin Abdülaziz, El-Hasan, İbn Sirin, El-Thawri, El-Leys ibn Sa'd, İshaq ve Ebu Tavr da gitmiştir; İbn Ömer Ömer'in hadisine dayanarak, Haybar gününde atlıya üç ok vermiştir: atı için iki ok, biri kendisi için. Ebu Hanife, Majma ibn Haritha'nın Haybar'ın bölünmesiyle ilgili hadisine göre atın bir ok olduğunu söylemiştir; İbn Hajar ise onu zayıflatmıştır. Ve hayvan olduğu için ok sahibi olduğu için insan gibi bir ok da geçmez; Hanefilere göre, birden fazla ata katkıda bulunur, ancak Abu Yusuf, Malikiler ve Şafiiler hariç, birden fazla at için savaşmaz. Hanbaliler, Ebu Yusuf'un görüşüne göre iki at için katkıda bulunur, daha fazlası değil; Al-Awza'i'nin anlattığına göre, bir adama on atı olsa bile iki attan fazla katkıda bulunmazdı ve ikinci at gereklidir, çünkü bir atı korumak onu zayıflatır ve onun için kavga etmesini engeller, üçüncü at ise bu konuda vazgeçilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8038} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8039} Hukukçular arasında atların sivrisinek veya başka bir şekilde yarışmasının caizliği konusunda herhangi bir anlaşmazlık yoktur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8039} Atlarla ilgili diğer konular da bu bağlamlarda ele alınmıştır; örneğin, zekat için eşeklerin üzerlerinden alınması, savaş alanında yaralanan mücahit için idrarlarının temizlenmesi, yasak ve izin konularında kadınların binmesinin yasaklanması ve cizye içinde zimmilerin binmesinin yasaklanması gibi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8039}"
  id: "Kuda adalah sekelompok kuda, dan mereka feminin tanpa tunggal tunggal 'khayil' (khayil). Jamaknya adalah 'khayal' dan 'khayal', dan dinamai karena 'khayal' mereka, yang berarti kekaguman mereka terhadap diri sendiri. Istilah 'al-'arb' dan 'baradeen' adalah laki-laki dan perempuan, seperti dalam Surah An-Nahl, ayat 8, dan 'al-risaan' merujuk pada penunggang kuda, dari mana Surah Al-Isra, ayat 64. Penggunaan kata ini oleh ahli hukum tidak menyimpang dari makna linguistik dalam istilah pertama. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8037} Pemberi Hukum mendorong memperoleh kuda untuk jihad dan keterhubungannya dengan jalan Allah, seperti yang disebutkan dalam Surah Al-Anfal, ayat 60, dan dalam hadits: 'Kuda terikat dengan kebaikan di depan mereka sampai Hari Penghakiman.' {cite:fiqh-mawsua-kuwaitiya-noor-v3 hlm.8037} Mayoritas ahli hukum memegang pandangan Abu Yusuf dan Muhammad, dan putusan Hanafi adalah bahwa zakat tidak harus dibayar kecuali untuk perdagangan, berdasarkan hadits: \"Seorang Muslim tidak memiliki zakat atas kuda atau budaknya\" dan hadits \"Saya telah melepaskan amal kuda dan budak.\" Karena mereka tidak termasuk di antara ternak. Abu Hanifa mengatakan bahwa zakat dikenakan pada unta betina, meskipun semuanya betina, dan jika semuanya betina, ada dua narasi. Jika semuanya laki-laki, menurut narasi yang tampak tidak wajib, tetapi dalam kasus langka, zakat adalah wajib. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8037} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8038} Mayoritas ahli hukum Shafi'i dan Hanbali berpendapat dengan pandangan Maliki bahwa memakannya diperbolehkan, sedangkan pandangan Hanafi dalam pandangan yang disukai, yaitu pendapat kedua Maliki, bahwa memakannya diperbolehkan meskipun tidak menyukai yang menguduskan, seperti yang dikatakan oleh Al-Awza'i dan Abu Ubaid. Dalam narasi lain dari Abu Hanifa, dengan ketidaksukaan terhadap larangan dan sejenisnya, pendapat Maliki adalah pendapat Maliki. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8038} Mengenai bagian rampasan, mayoritas berpendapat bahwa ksatria itu memiliki tiga anak panah: dua anak panah untuk kudanya, dan dua anak panah untuk kudanya. Kepada dia diberikan Umar ibn Abdul Aziz, Al-Hasan, Ibn Sirin, Al-Thawri, Al-Layth ibn Sa'd, Ishaq, dan Abu Thawr, berdasarkan hadis Ibn Umar bahwa pada hari Khaybar dia memberikan tiga anak panah kepada penunggang kuda: dua anak panah untuk kudanya dan satu untuk kudanya. Abu Hanifa mengatakan kuda itu memiliki satu anak panah, menurut hadits Majma' ibn Haritha tentang pembagian Khaybar, yang dilemahkan oleh Ibn Hajar. Dan karena kuda itu adalah hewan dengan panah, dia tidak melebihi anak panah seperti manusia; juga Menurut Hanafi, ia berkontribusi pada lebih dari satu kuda kecuali Abu Yusuf, Maliki, dan Shafi'i, karena ia tidak bertarung untuk lebih dari satu. Hanbalis berpendapat Abu Yusuf, yang merupakan pendapat Abu Yusuf, bahwa ia menyumbang untuk dua kuda dan tidak lebih, seperti yang diceritakan oleh Al-Awza'i bahwa ia tidak menyumbang lebih dari dua kuda kepada seorang pria meskipun memiliki sepuluh kuda, dan karena kuda kedua diperlukan, karena memiliki satu kuda melemahkannya dan mencegah perebutan kuda, berbeda dengan kuda ketiga yang tidak diadakan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8038} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8039} Tidak ada perbedaan pendapat di antara para ahli hukum tentang diperbolehkannya bersaing antara kuda untuk nyamuk atau lainnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8039} Isu lain terkait kuda juga telah dibahas dalam konteksnya, seperti pemindahan keledai di atas kuda untuk zakat, pemurnian urin untuk mujahid yang terluka di medan perang dalam kategori kotoran, larangan wanita menunggang kuda dalam hal larangan dan izin, serta larangan dhimmi menunggang kuda di jizya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8039}"
