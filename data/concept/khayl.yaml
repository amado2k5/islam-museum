  en: Khayl (horses)
  ur: خیل
summary:
  ar: 'الخيل جماعة الأفراس، وهي مؤنثة لا واحد لها من لفظها أو واحدها خائل، والجمع خيول وأخيال، وسميت لاختيالها أي إعجابها بنفسها مرحا، وتطلق على العراب والبراذين ذكورهما وإناثهما ومنه سورة النحل الآية 8، وتطلق على الفرسان ومنه سورة الإسراء الآية 64، ولا يخرج استعمال الفقهاء للفظ عن المعنى اللغوي بالإطلاق الأول. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8037} حث الشارع على اقتناء الخيل للجهاد وارتباطها في سبيل الله بسورة الأنفال الآية 60 وبحديث «الخيل معقود في نواصيها الخير إلى يوم القيامة». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8037} في زكاتها ذهب جمهور الفقهاء وهو قول أبي يوسف ومحمد وعليه الفتوى عند الحنفية إلى أنه لا زكاة فيها إلا إذا كانت للتجارة لحديث «ليس على المسلم في فرسه وغلامه صدقة» وحديث «قد عفوت عن صدقة الخيل والرقيق» ولأنها ليست من بهيمة الأنعام؛ وقال أبو حنيفة إن السائمة منها إذا كانت ذكورا وإناثا تجب فيها الزكاة، وإن كانت كلها إناثا فروايتان، وإن كانت كلها ذكورا ففي ظاهر الرواية لا تجب وفي مسائل النوادر تجب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8037}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8038} في أكلها يرى جمهور الفقهاء الشافعية والحنابلة وهو قول للمالكية أنها مباح الأكل، ويرى الحنفية في الراجح وهو قول ثان للمالكية أن أكلها حلال مع الكراهة التنزيهية وبه قال الأوزاعي وأبو عبيد، وفي رواية عن أبي حنيفة مع الكراهة التحريمية ونحوه قول للمالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8038} في سهمها من الغنيمة ذهب الجمهور إلى أن للفارس ثلاثة أسهم سهم له وسهمان لفرسه وإليه ذهب عمر بن عبد العزيز والحسن وابن سيرين والثوري والليث بن سعد وإسحاق وأبو ثور لحديث ابن عمر أنه أسهم يوم خيبر للفارس ثلاثة أسهم سهمين لفرسه وسهما له؛ وقال أبو حنيفة إن للفرس سهما واحدا لحديث مجمع بن حارثة في قسمة خيبر وضعفه ابن حجر، ولأنه حيوان ذو سهم فلم يزد على سهم كالآدمي؛ ولا يسهم لأكثر من فرس واحد عند الحنفية إلا أبا يوسف والمالكية والشافعية لأنه لا يقاتل على أكثر منها؛ ويرى الحنابلة وهو قول أبي يوسف أنه يسهم لفرسين لا أكثر لما روى الأوزاعي أنه كان لا يسهم للرجل فوق فرسين وإن كان معه عشرة أفراس، ولأن بالثاني حاجة إذ إدامة ركوب واحد تضعفه وتمنع القتال عليه بخلاف الثالث المستغنى عنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8038}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8039} ولا خلاف بين الفقهاء في جواز المسابقة بين الخيل بعوض أو بغيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8039} وتتعلق بالخيل مسائل أخرى بحثت في مواضعها كإنزاء الحمير عليها في الزكاة، وطهارة بولها للمجاهد أصابه بأرض حرب في باب النجاسات، وركوب المرأة في مباحث الحظر والإباحة، ومنع الذمي من ركوبها في الجزية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8039}'
  en: 'Khayl is the collective of horses; it is feminine with no singular of its own form — a stated singular being kha''il, plurals khuyul and akhyal — and was named for their prancing self-admiration; it covers Arab and non-Arab horses, male and female, as in Surah al-Nahl ayah 8, and is applied to cavalrymen as in Surah al-Isra ayah 64; the jurists'' usage stays within the first linguistic sense. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8037} The Law urges acquiring horses for jihad and tethering them for the cause of God, by Surah al-Anfal ayah 60 and the hadith "goodness is tied to the forelocks of horses until the Day of Resurrection". {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8037} On their zakat, the majority, including Abu Yusuf and Muhammad on whom the Hanafi fatwa rests, hold none is due unless they are for trade, by "a Muslim owes no sadaqa on his horse and his servant" and "I have exempted you from sadaqa on horses and slaves", and because they are not grazing livestock; Abu Hanifa obliges it on pastured horses when they are male and female, with two reports when all female, and on the apparent report none when all male though the Nawadir questions oblige it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8037}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8038} On eating them, the majority — the Shafiis, Hanbalis and a Maliki view — permit it; the Hanafis on the preponderant view and a second Maliki view hold it lawful with light disapproval, also the view of al-Awza''i and Abu Ubayd, while a transmission from Abu Hanifa and a Maliki view give grave disapproval. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8038} On their booty share, the majority allot the horseman three shares, one for him and two for his horse, the view of Umar ibn Abd al-Aziz, al-Hasan, Ibn Sirin, al-Thawri, al-Layth ibn Sa''d, Ishaq and Abu Thawr, for Ibn Umar''s report that at Khaybar he allotted the horseman three shares, two for the horse and one for him; Abu Hanifa gives the horse one share for Mujamma'' ibn Haritha''s report on the Khaybar division, weakened by Ibn Hajar, and because it is an animal with a share not exceeding one like the human; no more than one horse shares at the Hanafis except Abu Yusuf, the Malikis and the Shafiis since no one fights on more than one; the Hanbalis, and Abu Yusuf among the Hanafis, let two horses share and no more, per al-Awza''i''s report that no man received for more than two horses even with ten, since a second is needed — constant riding of one weakens it and bars fighting on it — while a third is dispensable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8038}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8039} The jurists do not dispute the permissibility of horse racing, with a prize or without. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8039} Other questions attach to horses in their places: a donkey stallion covering mares in zakat, the purity of their urine for a fighter on enemy soil under impurities, women riding under prohibition and permission, and barring the dhimmi from riding under jizya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8039}'
  ur: 'خیل گھوڑوں کا مجموعہ ہے؛ یہ مونث ہے جس کی اسی لفظ سے واحد نہیں یا واحد خائل ہے، جمع خیول اور اخیال ہے، اور اس کا نام اختیال یعنی مرح کے ساتھ خود پسندی سے رکھا گیا؛ یہ عرب اور غیر عرب گھوڑوں نر و مادہ دونوں پر بولا جاتا ہے جیسا سورۃ النحل آیت 8 میں، اور سواروں پر بھی جیسا سورۃ الاسراء آیت 64 میں؛ فقہاء کا استعمال پہلے لغوی معنی سے باہر نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8037} شارع نے جہاد کے لیے گھوڑے پالنے اور اللہ کے راستے میں باندھنے کی ترغیب دی سورۃ الانفال آیت 60 اور حدیث «قیامت تک گھوڑوں کی پیشانیوں میں بھلائی بندھی ہے» سے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8037} ان کی زکات میں جمہور فقہاء کا اور ابو یوسف و محمد کا قول جس پر حنفی فتوی ہے یہ ہے کہ زکات نہیں سوائے تجارت کے لیے ہوں، حدیث «مسلمان پر اس کے گھوڑے اور غلام کی صدقہ نہیں» اور حدیث «میں نے تم سے گھوڑوں اور غلاموں کا صدقہ معاف کیا» کے مطابق اور اس لیے کہ وہ چرنے والے مویشی نہیں؛ ابو حنیفہ کے نزدیک چرنے والے گھوڑوں میں زکات واجب ہے جب نر اور مادہ دونوں ہوں، سب مادہ ہوں تو دو روایتیں، سب نر ہوں تو ظاہر روایت میں نہیں مگر مسائل النوادر میں واجب۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8037}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8038} ان کے کھانے میں جمہور فقہاء یعنی شافعیہ، حنابلہ اور مالکیہ کا ایک قول مباح مانتے ہیں؛ حنفیہ راجح میں اور مالکیہ کا دوسرا قول تنزیہی کراہت کے ساتھ حلال مانتے ہیں اور اوزاعی و ابو عبید نے بھی یہی کہا، اور ابو حنیفہ سے ایک روایت تحریمی کراہت کی ہے اور مالکیہ کا ایک قول بھی ایسا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8038} غنیمت میں ان کے حصے میں جمہور کے نزدیک سوار کو تین حصے ہیں: اس کا ایک اور اس کے گھوڑے کے دو، اور عمر بن عبدالعزیز، حسن، ابن سیرین، ثوری، لیث بن سعد، اسحاق اور ابو ثور نے بھی یہی کہا ابن عمر کی حدیث پر کہ خیبر کے دن سوار کو تین حصے دیے گھوڑے کے دو اور اس کا ایک؛ ابو حنیفہ کے نزدیک گھوڑے کا ایک حصہ ہے مجمع بن حارثہ کی حدیث پر جسے ابن حجر نے ضعیف کیا، اور اس لیے کہ وہ ایک حصے والا حیوان ہے تو ایک سے زیادہ نہیں جیسے انسان؛ حنفیہ سوائے ابو یوسف کے، مالکیہ اور شافعیہ کے نزدیک ایک سے زیادہ گھوڑے کا حصہ نہیں کیونکہ ایک سے زیادہ پر قتال ممکن نہیں؛ حنابلہ اور حنفیہ میں ابو یوسف کے نزدیک دو گھوڑوں تک حصہ ہے زیادہ نہیں، اوزاعی کی روایت پر کہ کسی کو دو گھوڑوں سے زیادہ کا حصہ نہیں دیا گیا خواہ دس ہوں، کیونکہ دوسرے کی ضرورت ہے کہ ایک پر مسلسل سواری اسے کمزور اور قتال سے باہر کرتی ہے بخلاف تیسرے کے جو بے نیاز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8038}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8039} فقہاء میں گھوڑوں کی مسابقہ انعام کے ساتھ یا بغیر جائز ہونے پر اختلاف نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8039} اور گھوڑوں سے دیگر مسائل اپنے مواضع پر بحث ہوئیں جیسے زکات میں گدھوں کا ان پر ٹپنا، نجاستوں کے باب میں حرب کی سرزمین میں مجاہد کو ان کے پیشاب کی طہارت، حظر و اباحہ میں عورت کی سواری، اور جزیت میں ذمی کی سواری کی ممانعت۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8039}'
