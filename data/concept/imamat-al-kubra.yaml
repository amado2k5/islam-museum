id: concept/imamat-al-kubra
class: concept
kind: legal
label: { ar: "الإمامة الكبرى", en: "Imamat al-kubra (the great imamate, the caliphate)" }
summary:
  ar: "الإمامة الكبرى رئاسة عامة في الدين والدنيا خلافة عن النبي، وتجب بالإجماع ويقوم بها أهل الاختيار وأهل الإمامة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3355}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3356}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3357} وتشترط فيها شروط متفق عليها كالإسلام والتكليف والذكورة والحرية والكفاية وسلامة الحواس، ومختلف فيها كالعدالة والاجتهاد والنسب القرشي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3358}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3359} وتنعقد بالبيعة أو بعهد الإمام أو بالاستيلاء في حال الضرورة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3360}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3361}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3362}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3363}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3364} ولا يجوز تعدد الأئمة في وقت واحد عند جمهور الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3365}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3366} وتنعزل الإمامة بزوال الشروط، ويقوم الإمام بواجبات حفظ الدين ورعاية المصالح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3366}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3367}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3368}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3369}"
  en: "The great imamate is a general leadership in religion and state, as the successor of the Prophet. The jurists agree that it is a communal obligation carried out by those who choose and those who qualify. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3355}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3356}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3357} Its conditions include those agreed (Islam, adulthood, maleness, freedom, capacity and sound senses) and those disputed (justice, ijtihad and Qurayshi descent). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3358}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3359} It is established by allegiance, by the imam's designation of a successor, or in necessity by seizure. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3360}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3361}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3362}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3363}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3364} The majority forbid two imams at one time. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3365}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3366} The imam's duties are guarding the religion and serving the public interest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3366}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3367}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3368}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3369}"
