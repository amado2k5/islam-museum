id: concept/imamat-al-kubra
class: concept
kind: legal
label: { ar: "الإمامة الكبرى", en: "Imamat al-kubra (the great imamate, the caliphate)", es: "Imamat al-kubra (el gran imamato, el califato)", fr: "Imamat al-kubra (le grand imamat, le califat)", ur: "امامت الکبری ⁦(عظیم امامت، خلافت)⁩", tr: "Büyük İmamat", id: "The Grand Imamate" }
summary:
  ar: "الإمامة الكبرى رئاسة عامة في الدين والدنيا خلافة عن النبي، وتجب بالإجماع ويقوم بها أهل الاختيار وأهل الإمامة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3355}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3356}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3357} وتشترط فيها شروط متفق عليها كالإسلام والتكليف والذكورة والحرية والكفاية وسلامة الحواس، ومختلف فيها كالعدالة والاجتهاد والنسب القرشي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3358}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3359} وتنعقد بالبيعة أو بعهد الإمام أو بالاستيلاء في حال الضرورة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3360}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3361}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3362}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3363}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3364} ولا يجوز تعدد الأئمة في وقت واحد عند جمهور الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3365}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3366} وتنعزل الإمامة بزوال الشروط، ويقوم الإمام بواجبات حفظ الدين ورعاية المصالح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3366}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3367}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3368}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3369}"
  en: "The great imamate is a general leadership in religion and state, as the successor of the Prophet. The jurists agree that it is a communal obligation carried out by those who choose and those who qualify. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3355}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3356}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3357} Its conditions include those agreed (Islam, adulthood, maleness, freedom, capacity and sound senses) and those disputed (justice, ijtihad and Qurayshi descent). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3358}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3359} It is established by allegiance, by the imam's designation of a successor, or in necessity by seizure. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3360}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3361}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3362}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3363}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3364} The majority forbid two imams at one time. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3365}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3366} The imam's duties are guarding the religion and serving the public interest. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3366}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3367}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3368}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3369}"
  es: "El Gran Imamato es un liderazgo general en religión y estado, como sucesor del Profeta. Los juristas coinciden en que es una obligación comunitaria llevada a cabo por aquellos que eligen y aquellos que califican. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3355}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3356}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3357} Sus condiciones incluyen las acordadas (Islam, mayoría de edad, masculinidad, libertad, capacidad y buen juicio) y las disputadas (justicia, ijtihad y ascendencia Qurayshi). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3358} Se establece por lealtad, por la designación de un sucesor por parte del imán, o en caso de necesidad por toma. {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3360}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3361}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3362}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3363}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3364} La mayoría prohíbe dos imanes a la vez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3365}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3366} Los deberes del imán son proteger la religión y servir al interés público. {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3366}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3367}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3368}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3369}"
  fr: "Le Grand Imamat est une autorité générale en matière de religion et d'État, en tant que successeur du Prophète. Les juristes s'accordent à dire qu'il s'agit d'une obligation communautaire exercée par ceux qui le souhaitent et qui en remplissent les conditions. Ses conditions comprennent celles qui font consensus (l'islam, la majorité, le sexe masculin, la liberté, la capacité et le bon sens) et celles qui font débat (la justice, l'ijtihad et la descendance qurayshite). Il est institué par allégeance, par la désignation d'un successeur par l'imam, ou, en cas de nécessité, par prise de pouvoir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3360}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3361}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3362}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3363}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3364} La majorité interdit deux imams à la fois. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3365}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3366} Les devoirs de l'imam sont de garder la religion et de servir l'intérêt public. }"
  ur: "عظیم امامت پیغمبر کے جانشین کے طور پر دین اور ریاست میں ایک عمومی قیادت ہے۔ فقہاء اس بات پر متفق ہیں کہ یہ ایک اجتماعی ذمہ داری ہے جو منتخب کرنے والوں اور اہل افراد کی طرف سے انجام دی جاتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3355}{cite:فقہ-موسوع-کویتیہ-نور-v3 p.3356}{cite:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3357} اس کی شرائط میں وہ ہیں جن میں راضی، بالغ ہونا، صلاحیت اور آزادی شامل ہیں)۔ حواس) اور اختلاف کرنے والے ⁦(انصاف، اجتہاد اور قریشی نسل)⁩۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3358} یہ بیعت کے ذریعے، امام کے جانشین کے عہدہ سے، یا بوقت ضرورت قبضے سے قائم ہوتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ3360}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ3361}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ3362}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ3361 صفحہ 3363 {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص.3364} جمہور نے ایک وقت میں دو اماموں کو منع کیا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.3365}{cite:fiqh-masua-kuwaitiyya-noor-v3 p.3366} امام کے فرائض دین کی حفاظت اور مفاد عامہ کی خدمت کرنا ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.3366}{cite:fiqh-Mawsua-kuwaitiy-noor-v3 p.3367}{cite:fiqh-mawsua-kuwaityya-noor-v3 p.3368}{cite:fiqh-mawsua-kuwaityya-noor-v3 p.3368}{cite:fiqh-vuwatiyya-noor-v3 p.3367}"
  tr: "Büyük İmamat, din ve dünyevi işlerde Peygamber'den bir halef olarak genel bir liderliktir; uzlaşmayla zorunludur ve seçilen halk ile İmam halkı tarafından yürütülür. {atıf:fiqh-mawsua-kuveytiyya-noor-v3 s.3355} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3356} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3357} İslam, zorunluluk, erkeklik, özgürlük, yeterlilik ve sağduyular gibi üzerinde anlaşılmış koşulları içerirken, adalet, ijtihad ve Qureyş soyu gibi konularda farklılık gösterir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3358} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3359} Bağlılık yemini, İmam ahidiyle, ya da gerekirse el koyma yoluyla elde edilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3360} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3361} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3362} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3363} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3364} Çoğu hukukçuya göre aynı anda birden fazla imam olması kabul edilemez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3365} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3366} İmamat, koşulların kaldırılmasıyla görevden alınır ve imam dini koruma ve çıkarları koruma görevlerini üstlenir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3366} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3367} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3368} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3369}"
  id: "Grand Imamate adalah kepemimpinan umum dalam agama dan urusan duniawi sebagai kesuksesan dari Nabi, wajib secara konsensus dan dijalankan oleh umat pilihan dan umat Imamat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3355} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3356} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3357} Ini mencakup syarat-syarat yang disepakati seperti Islam, kewajiban, maskulinitas, kebebasan, kompetensi, dan indera yang sehat, sementara yang lain berbeda dalam hal-hal seperti keadilan, ijtihad, dan garis keturunan Quraish. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3358} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3359} Tempat ini dipegang dengan sumpah setia, perjanjian Imam, atau dengan penyitaan jika perlu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3360} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3361} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3362} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3363} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3364} Menurut mayoritas ahli hukum, tidak diperbolehkan memiliki beberapa imam sekaligus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3365} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3366} Imamate dihapus dengan penghapusan syarat, dan imam menjalankan tugas menjaga agama dan melindungi kepentingan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3366} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3367} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3368} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3369}"
