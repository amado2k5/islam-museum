summary:
  ar: "شجرة نهى الله آدم وزوجه عنها فوسوس لهما الشيطان شجرة الخلد وملك لا يبلى، فأكلا منها فبدت لهما سوآتهما وطفقا يخصفان عليهما من ورق الجنة، فتاب عليهما الله وهدى."
  en: "The tree God forbade to Adam and his wife; Satan whispered 'the tree of immortality and a kingdom that never decays'; they ate, their nakedness appeared, and they began covering themselves with the leaves of the Garden — and God relented and guided."
  ur: "وہ درخت جس سے اللہ نے آدم اور اس کی بیوی کو روکا تھا؛ شیطان نے وسوسہ ڈالا 'خلد کا درخت اور نہ مٹنے والی بادشاہی'؛ انہوں نے کھایا، ان کی ستر کھل گئی اور وہ جنت کے پتے چپکانے لگے — اللہ نے ان کی توبہ قبول کی اور رہنمائی دی۔"
