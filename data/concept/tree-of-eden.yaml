id: concept/tree-of-eden
class: concept
kind: natural
label:
  ar: "شجرة الخلد"
  en: "The tree of Eden"
  ur: "شجر خلد"
  es: "El árbol del Edén"
  fr: "L'arbre d'Éden"
  tr: "köstebek ağacı"
  id: "pohon tikus"
summary:
  ar: "شجرة نهى الله آدم وزوجه عنها فوسوس لهما الشيطان شجرة الخلد وملك لا يبلى، فأكلا منها فبدت لهما سوآتهما وطفقا يخصفان عليهما من ورق الجنة، فتاب عليهما الله وهدى."
  en: "The tree God forbade to Adam and his wife; Satan whispered 'the tree of immortality and a kingdom that never decays'; they ate, their nakedness appeared, and they began covering themselves with the leaves of the Garden — and God relented and guided."
  ur: "وہ درخت جس سے اللہ نے آدم اور اس کی بیوی کو روکا تھا؛ شیطان نے وسوسہ ڈالا 'خلد کا درخت اور نہ مٹنے والی بادشاہی'؛ انہوں نے کھایا، ان کی ستر کھل گئی اور وہ جنت کے پتے چپکانے لگے — اللہ نے ان کی توبہ قبول کی اور رہنمائی دی۔"
  es: "Dios les prohibió a Adán y a su esposa el árbol que ellos mismos habían visto; Satanás les susurró: «El árbol de la inmortalidad y un reino que nunca perece»; comieron de él, su desnudez se hizo evidente y comenzaron a cubrirse con las hojas del Jardín, y Dios cedió y los guió."
  fr: "L'arbre que Dieu avait interdit à Adam et à sa femme; Satan leur murmura « l'arbre de l'immortalité et d'un royaume qui ne périt jamais »; ils en mangèrent, leur nudité apparut, et ils commencèrent à se couvrir des feuilles du Jardin — et Dieu céda et les guida."
  tr: "Tanrı Adem'i bir ağaç yasakladı ve onu ona evlendirdi, böylece Şeytan onlara sonsuzluk ağacını ve ölümsüz bir kral fısıldadı. Onlar ondan yediler, kirleri onlara göründü ve üzerlerine cennet yaprakları saçmaya başladılar. Tanrı tövbe etti ve onları yönlendirdi."
  id: "Pohon yang dilarang oleh Tuhan dan menikahkannya dengannya, sehingga Setan membisikkan kepada mereka pohon keabadian dan raja abadi. Mereka makan dari pohon itu, dan kotoran mereka muncul kepada mereka, dan mereka mulai menaburkan daun Surga ke atas mereka. Tuhan bertobat dan membimbing mereka."
