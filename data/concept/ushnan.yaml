summary:
  ar: "الأشنان جلاء منقٍّ مفتّح، والأبيض ألطفه، وينفع من عسر البول ومائية الاستسقاء، ويذكر الكتاب فيه إسقاط الجنين وإدرار الطمث بمقادير مذكورة، وهذا ما ورد فيه لا توصية به {cite:canon-ibn-sina-print-v1 p.361}."
  en: "Ushnan cleanses, scours and opens; the white kind is the finest. It helps difficult urination and watery dropsy. The book also states that a large measure expels a foetus and brings on menses; this is the book's listing, not a recommendation {cite:canon-ibn-sina-print-v1 p.361}."
  ur: "اشنان صاف کرنے، جلا دینے اور کھولنے والی چیز ہے؛ سفید قسم سب سے باریک ہے۔ یہ پیشاب کی دشواری اور پانی والے استسقا میں مفید ہے۔ کتاب میں لکھا ہے کہ زیادہ مقدار حمل گراتی اور حیض جاری کرتی ہے؛ یہ کتاب کی فہرست ہے، کوئی سفارش نہیں {cite:canon-ibn-sina-print-v1 p.361}۔"
  es: "Ushnan limpia, desinfecta y abre; la variedad blanca es la mejor. Ayuda con la dificultad para orinar y la hidropesía acuosa. El libro también afirma que una dosis generosa expulsa el feto y provoca la menstruación; esto es información del libro, no una recomendación {cite:canon-ibn-sina-print-v1 p.361}."
  fr: "L'ushnan purifie, assainit et débouche; la variété blanche est la plus pure. Elle soulage les difficultés à uriner et l'hydropisie aqueuse. Le livre indique également qu'une forte dose expulse le fœtus et provoque les menstruations; il s'agit d'une simple mention dans le livre, et non d'une recommandation {cite:canon-ibn-sina-print-v1 p.361}."
  tr: "Ashnan berrak, berrak ve açıcı bir geladır, beyaz ise en ılıman olup, idrar kaçırma ve asit suyu için faydalıdır. Kitap, belirtilen miktarlarda kürtaj ve adet başlatma konusundan bahseder, ancak bu önerilmez {cite:canon-ibn-sina-print-v1 s.361}."
  id: "Ashnan adalah gela yang bening, jernih, dan mencerahkan, sedangkan putih adalah yang paling ringan dan bermanfaat untuk inkontinensia urin serta air akibat ascites. Buku ini menyebutkan aborsi dan menyebabkan menstruasi dalam jumlah yang disebutkan, yang tidak direkomendasikan {cite:canon-ibn-sina-print-v1 hlm.361}."
