id: "concept/harab-al-udhun-min-al-aswat"
class: "concept"
kind: "scientific"
label:
  ar: "هرب الأذن من الأصوات العظيمة"
  en: "The ear's fleeing from great sounds"
  ur: "کان کا بلند آوازوں سے بچنا"
  es: "El oído huye de los grandes sonidos"
summary:
  ar: "هرب الأذن من الأصوات العظيمة سببه ضعف في القوة النفسانية في الدماغ أو الفائضة إلى السمع، ولا بد من علاج الدماغ بما يقويه على ما علم ⁦⁦(وبهذا ينتهي الفن الرابع في أحوال الأذن ويليه الفن الخامس في أحوال الأنف)⁩⁩ {cite:canon-ibn-sina-print-v2 p.233}"
  en: "The ear's fleeing from great sounds: its cause is a weakness in the psychic power in the brain or in what overflows to hearing; the brain must be treated with what strengthens it, as is known ⁦(with this Fann 4 on the states of the ear ends; Fann 5 on the states of the nose follows)⁩ {cite:canon-ibn-sina-print-v2 p.233}"
  ur: "کان کا بلند آوازوں سے بچنا: اس کا سبب دماغ میں نفسانی قوت کا یا سماعت تک پہنچنے والے فائض کا ضعف ہے؛ اور ضروری ہے کہ دماغ کا علاج اس سے ہو جو اسے تقویت دے جیسا معلوم ہے ⁦⁦(اسی کے ساتھ کان کے احوال کا فن رابع ختم ہوتا ہے اور اس کے بعد ناک کے احوال کا فن پنجم آتا ہے)⁩⁩ {cite:canon-ibn-sina-print-v2 p.233}"
  es: "La rehusión del oído ante los sonidos fuertes: su causa es una debilidad en la capacidad psíquica del cerebro o en lo que se desborda hacia la audición; el cerebro debe ser tratado con aquello que lo fortalece, como es sabido (con esto termina Fann 4 sobre los estados del oído; a continuación, Fann 5 sobre los estados de la nariz) {cite:canon-ibn-sina-print-v2 p.233}"
