  en: "Bahramaj (a sweet herb)"
  fr: "Bahramaj (herbe odorante)"
  ur: "بہرامج"
summary:
  ar: "من الرياحين، ونطوله يحلّ النفخ من كل موضع، وفقّاحه جيد للرياح الغليظة في الرأس، وإذا شُمّ ورقه يفعل كذلك، ويطلق البطن {cite:canon-ibn-sina-print-v1 p.399}."
  en: "One of the sweet herbs. Its liniment dissolves wind from every part of the body. Its blossom is good for thick wind in the head, and smelling its leaf does the same. It loosens the bowels {cite:canon-ibn-sina-print-v1 p.399}."
  fr: "Une des herbes odorantes. Son liniment est dit dissiper les vents de toutes les parties du corps. Sa fleur serait utile aux vents épais de la tête, de même que l’odeur de ses feuilles. Elle relâcherait l’intestin {cite:canon-ibn-sina-print-v1 p.399}."
  ur: "یہ خوشبودار جڑی بوٹیوں میں سے ہے۔ اس کا لیپ جسم کے ہر حصے کی ہوا تحلیل کرتا ہے، اس کا پھول سر کی گاڑھی ہوا میں اچھا ہے، اور اس کا پتہ سونگھنے سے بھی ایسا ہی ہوتا ہے، اور یہ پیٹ کھولتا ہے {cite:canon-ibn-sina-print-v1 p.399}۔"
