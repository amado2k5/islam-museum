label:
  ar: "بزر قطونا"
  en: "Bizr qatuna (flea-seed, psyllium)"
  fr: "Bizr qatuna (graine aux puces, psyllium)"
  ur: "بزرِ قطونا"
  es: "Bizr qatuna (semilla de pulga, psyllium)"
  tr: "Pamuk tohumu"
  id: "Biji kapas"
summary:
  ar: "بزره لونان شتوي وصيفي، بارد رطب في الثانية. المقلو منه ملتوتاً في دهن الورد قابض، ويسكن الصداع ضماداً بالخل. يُضمّد به على الأورام الحارة والنملة والحمرة، ولعابه مع دهن الورد أو اللوز ينفع العطش الشديد الصفراوي، ولعابه مع دهن البنفسج يطلق، ويُشرب فيسكّن لهيب الحميات الحارة. ويذكر الكتاب أن مقليّه يعقل ويفيد السحج للصبيان {cite:canon-ibn-sina-print-v1 p.392}، {cite:canon-ibn-sina-print-v1 p.393}."
  en: "Its seed comes in two kinds, winter and summer. Cold and moist in the second degree. The roasted seed, ground in rose oil, is astringent; it calms headache as a poultice with vinegar. It is applied to hot swellings, herpes and erysipelas. Its mucilage with rose or almond oil helps intense bilious thirst, and drunk it calms the flames of hot fevers. The book says it binds and helps chafing in children {cite:canon-ibn-sina-print-v1 p.392}, {cite:canon-ibn-sina-print-v1 p.393}."
  fr: "Graine de deux sortes, hivernale et estivale. Froide et humide au deuxième degré. Grillée et broyée dans l’huile de rose, elle est astringente ; en cataplasme avec vinaigre, elle calmerait les céphalées. Appliquée aux gonflements chauds, à l’herpès et à l’érysipèle. Son mucilage avec huile de rose ou d’amande aiderait contre la soif bilieuse intense et, bu, calmerait les ardeurs des fièvres chaudes. Le livre la dit resserrante et utile aux écorchures des enfants {cite:canon-ibn-sina-print-v1 p.392}, {cite:canon-ibn-sina-print-v1 p.393}."
  ur: "اس کے بیج کی دو قسمیں ہیں، سردیوں کی اور گرمیوں کی۔ دوسرے درجے میں ٹھنڈا اور تر۔ بھونا ہوا بیج گلاب کے تیل میں گوندھ کر قابض ہوتا ہے، اور سرکے کے ساتھ ضماد کر کے سردرد کو سکون دیتا ہے۔ گرم ورموں، نملہ اور حمرہ پر اسے ضماد کیا جاتا ہے۔ گلاب یا بادام کے تیل کے ساتھ اس کا لعاب شدید صفراوی پیاس میں نفع دیتا ہے، اور پینے سے گرم بخاروں کی جلن کم کرتا ہے۔ کتاب کہتی ہے کہ یہ بچوں کی رگڑ کو باندھتا اور سحج میں نفع دیتا ہے {cite:canon-ibn-sina-print-v1 p.392}، {cite:canon-ibn-sina-print-v1 p.393}۔"
  es: "Su semilla se presenta en dos variedades: invierno y verano. Es fría y húmeda en el segundo grado. La semilla tostada, molida en aceite de rosa, es astringente; calma el dolor de cabeza como cataplasma con vinagre. Se aplica sobre hinchazones calientes, herpes y erisipela. Su mucílago con aceite de rosa o de almendras ayuda a aliviar la sed biliosa intensa, y al beberlo calma las fiebres altas. El libro dice que alivia y ayuda con las rozaduras en los niños {cite:canon-ibn-sina-print-v1 p.392}, {cite:canon-ibn-sina-print-v1 p.393}."
  tr: "Tohumları kış ve yazdır, ikinci baharda serin ve nemlidir. Gül yağında kızartıldığında büzücü olur ve baş ağrılarını sirkeyle kompres olarak yatıştırır. Sıcak tümörleri, karınca kurtlarını ve kızarıklığı örtmek için kullanılır. Gül veya badem yağı ile karıştırılan tükürüğü şiddetli safra susuzluğuna yardımcı olur, menekşe yağıyla tükürüğü ise onu salgılar ve sıcak ateşlerin alevlerini yatıştırmak için içilir. Kitapta kızartmanın erkekler için faydalı ve faydalı olduğu belirtilir {cite:canon-ibn-sina-print-v1 s.392}, {cite:canon-ibn-sina-print-v1 s.393}."
  id: "Bijinya berwarna musim dingin dan panas, dingin dan lembap di bagian kedua. Digoreng dengan minyak mawar bersifat astringen, dan meredakan sakit kepala sebagai rabung dengan cuka. Minyak ini digunakan untuk merawat tumor panas, cacing semut, dan kemerahan. Air liurnya yang dicampur dengan minyak mawar atau almond membantu mengurangi haus empedu yang parah, dan air liurnya dengan minyak violet melepaskannya, dan diminum untuk meredakan api demam panas. Buku ini menyebutkan bahwa digoreng bermanfaat dan bermanfaat bagi anak laki-laki {cite:canon-ibn-sina-print-v1 hlm.392}, {cite:canon-ibn-sina-print-v1 hlm.393}."
