id: concept/bizr-qatuna
class: concept
kind: natural
label:
  ar: "بزر قطونا"
  en: "Bizr qatuna (flea-seed, psyllium)"
  ur: "بزرِ قطونا"
summary:
  ar: "بزره لونان شتوي وصيفي، بارد رطب في الثانية. المقلو منه ملتوتاً في دهن الورد قابض، ويسكن الصداع ضماداً بالخل. يُضمّد به على الأورام الحارة والنملة والحمرة، ولعابه مع دهن الورد أو اللوز ينفع العطش الشديد الصفراوي، ولعابه مع دهن البنفسج يطلق، ويُشرب فيسكّن لهيب الحميات الحارة. ويذكر الكتاب أن مقليّه يعقل ويفيد السحج للصبيان {cite:canon-ibn-sina-print-v1 p.392}، {cite:canon-ibn-sina-print-v1 p.393}."
  en: "Its seed comes in two kinds, winter and summer. Cold and moist in the second degree. The roasted seed, ground in rose oil, is astringent; it calms headache as a poultice with vinegar. It is applied to hot swellings, herpes and erysipelas. Its mucilage with rose or almond oil helps intense bilious thirst, and drunk it calms the flames of hot fevers. The book says it binds and helps chafing in children {cite:canon-ibn-sina-print-v1 p.392}, {cite:canon-ibn-sina-print-v1 p.393}."
  ur: "اس کے بیج کی دو قسمیں ہیں، سردیوں کی اور گرمیوں کی۔ دوسرے درجے میں ٹھنڈا اور تر۔ بھونا ہوا بیج گلاب کے تیل میں گوندھ کر قابض ہوتا ہے، اور سرکے کے ساتھ ضماد کر کے سردرد کو سکون دیتا ہے۔ گرم ورموں، نملہ اور حمرہ پر اسے ضماد کیا جاتا ہے۔ گلاب یا بادام کے تیل کے ساتھ اس کا لعاب شدید صفراوی پیاس میں نفع دیتا ہے، اور پینے سے گرم بخاروں کی جلن کم کرتا ہے۔ کتاب کہتی ہے کہ یہ بچوں کی رگڑ کو باندھتا اور سحج میں نفع دیتا ہے {cite:canon-ibn-sina-print-v1 p.392}، {cite:canon-ibn-sina-print-v1 p.393}۔"
