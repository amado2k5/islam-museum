id: "concept/al-sakta"
class: "concept"
kind: "scientific"
label:
  ar: "السكتة"
  en: "Apoplexy (al-sakta)"
  fr: "Apoplexie (al-sakta)"
  ur: "سکتہ"
  es: "Apoplejía (al-sakta)"
summary:
  ar: "السكتة تعطّل الأعضاء عن الحس والحركة لانسداد واقع في بطون الدماغ وفي مجاري الروح الحساس والمتحرك؛ وقد قال بقراط إن السكتة إذا كانت قوية لم يبرأ صاحبها وإن كانت ضعيفة لم يسهل برؤه {cite:canon-ibn-sina-print-v2 p.130} {cite:canon-ibn-sina-print-v2 p.131}"
  en: "Apoplexy disables the organs from sense and motion by an obstruction occurring in the brain's ventricles and the passages of the sensing and moving pneuma; Hippocrates said that when apoplexy is strong its sufferer is not cured, and when weak he is not easily cured {cite:canon-ibn-sina-print-v2 p.130} {cite:canon-ibn-sina-print-v2 p.131}"
  fr: "L’apoplexie prive les organes de la sensation et du mouvement par une obstruction qui se produit dans les ventricules du cerveau et dans les conduits du pneuma sensitif et moteur ; Hippocrate a dit que, lorsque l’apoplexie est forte, celui qui en est atteint ne guérit pas, et que, lorsqu’elle est faible, il ne guérit pas aisément {cite:canon-ibn-sina-print-v2 p.130} {cite:canon-ibn-sina-print-v2 p.131}"
  ur: "سکتہ اعضا کو حس اور حرکت سے اس انسداد کے سبب معطل کرتا ہے جو دماغ کے بطون اور حساس و متحرک روح کے مجاری میں واقع ہوتا ہے؛ بقراط نے کہا کہ سکتہ اگر مضبوط ہو تو مریض شفا نہیں پاتا اور اگر کمزور ہو تو اس کی شفا آسان نہیں {cite:canon-ibn-sina-print-v2 p.130} {cite:canon-ibn-sina-print-v2 p.131}۔"
  es: "La apoplejía incapacita los órganos para la percepción y el movimiento debido a una obstrucción que se produce en los ventrículos cerebrales y en los conductos del pneuma sensorial y motor; Hipócrates dijo que cuando la apoplejía es fuerte, quien la padece no se cura, y cuando es débil, no se cura fácilmente {cite:canon-ibn-sina-print-v2 p.130} {cite:canon-ibn-sina-print-v2 p.131}"
