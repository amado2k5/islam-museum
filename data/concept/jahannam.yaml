sensitivity: contested
label:
  ar: جهنم
  en: Jahannam (the Fire)
  ur: جہنم
  es: "Jahannam (el Fuego)"
  fr: "Jahannam (le Feu)"
  tr: "cehennem"
  id: "neraka"
summary:
  ur: "دوزخ جو اللہ نے کافروں اور عاصیوں کے لیے بے رہم آگ بنائی — سات دروازے اور قعرِ درین۔"
  ar: "جهنم في العقيدة السنية دار العذاب الأخروية المخلوقة أصلًا — «الجنة والنار مخلوقتان لا تفنيان أبدًا ولا تبيدان» {cite:aqida-tahawiyya §106-107}؛ ويذكر الشرح أهل الكبائر من أمة محمد وموقفهم منها {cite:sharh-tahawiyya-ibn-abi-al-izz §89}."
  en: "Jahannam in Sunni creed is the already-created abode of punishment in the hereafter — 'Paradise and the Fire are created, never perishing' {cite:aqida-tahawiyya §106-107}; the commentary treats the grave sinners of the community and their standing toward it {cite:sharh-tahawiyya-ibn-abi-al-izz §89}."
  es: "En la doctrina sunita, Jahannam es la morada de castigo ya creada en el más allá: «El Paraíso y el Fuego son creados y nunca perecerán» {cite:aqida-tahawiyya §106-107}; el comentario trata sobre los pecadores graves de la comunidad y su posición respecto a ella {cite:sharh-tahawiyya-ibn-abi-al-izz §89}."
  fr: "Dans la croyance sunnite, Jahannam est la demeure de châtiment déjà créée dans l'au-delà — « Le Paradis et le Feu sont créés, ils ne périssent jamais » {cite:aqida-tahawiyya §106-107}; le commentaire traite des grands pécheurs de la communauté et de leur position à son égard {cite:sharh-tahawiyya-ibn-abi-al-izz §89}."
  tr: "Sünni mezhebine göre cehennem, ahirette işkencenin yaratılmış yeridir — \"Cennet ve Cehennem, asla yok olmayacak ve yok olmayacak iki yaratılmış yaratıktır\" {cite:aqida-tahawiyya §106-107}; tefsir, Muhammed ulusunun büyük günahlarının insanları ve onlara karşı tutumlarından bahseder {cite:sharh-tahawiyya-ibn-abi-al-izz §89}."
  id: "Neraka dalam ajaran Sunni adalah tempat pertama yang diciptakan untuk menyiksa di akhirat — \"Surga dan Neraka adalah dua makhluk ciptaan yang tidak akan pernah binasa atau binasa\" {cite:aqida-tahawiyya §106-107}; komentar menyebutkan orang-orang yang memiliki dosa besar dari bangsa Muhammad dan sikap mereka terhadapnya {cite:sharh-tahawiyya-ibn-abi-al-izz §89}."
