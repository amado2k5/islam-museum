id: concept/jahannam
education:
  did_you_know:
    ar: "جهنم في العقيدة السنية دار عذاب مخلوقة أصلاً؛ وتذكر العقيدة أهل الكبائر من أمة محمد وموقفهم منها في أبوابها."
    en: "In Sunni belief Jahannam is an already-created abode of punishment; the creed then discusses the position of this community's grave sinners in relation to it."
    ur: "سنی عقیدے میں جہنم پہلے سے مخلوق عذاب کا گھر ہے؛ اور عقیدہ اس امت کے بڑے گناہوں والوں کا اس سے تعلق بیان کرتا ہے۔"
    sources: [source/aqida-tahawiyya, source/sharh-tahawiyya-ibn-abi-al-izz]
class: concept
