summary:
  ar: "جهنم في العقيدة السنية دار العذاب الأخروية المخلوقة أصلًا — «الجنة والنار مخلوقتان لا تفنيان أبدًا ولا تبيدان» {cite:aqida-tahawiyya §106-107}؛ ويذكر الشرح أهل الكبائر من أمة محمد وموقفهم منها {cite:sharh-tahawiyya-ibn-abi-al-izz §89}."
  en: "Jahannam in Sunni creed is the already-created abode of punishment in the hereafter — 'Paradise and the Fire are created, never perishing' {cite:aqida-tahawiyya §106-107}; the commentary treats the grave sinners of the community and their standing toward it {cite:sharh-tahawiyya-ibn-abi-al-izz §89}."
