label: { ar: "تغزير اللبن وتقليل الزائد منه", en: "Increasing scanty milk and reducing excess", ur: "کم دودھ کو بڑھانا اور زیادہ دودھ کو گھٹانا" }
summary:
  ar: "إذا كان لبن المرضعة قليلاً تأمل سببه في سوء مزاج بدنها أو ثديها، ثم تعدل بالغذاء وتعطى مغزرات للبن من أحساء الشعير والرازيانج والشبث والشونيز وضروع الضأن والمعز وغيرها، وإن كثر اللبن حتى آذى نقص بتقليل الغذاء وتضميد الصدر {cite:canon-ibn-sina-print-v1 pp.207-209}."
  en: "If the nurse's milk is scanty the cause is sought in a bad temperament of her body or breast, then it is mended by diet and by milk-increasing foods such as barley gruels, fennel, dill, nigella and the udders of sheep and goats; if the milk is so much that it harms, it is reduced by less food and a dressing on the chest {cite:canon-ibn-sina-print-v1 pp.207-209}."
