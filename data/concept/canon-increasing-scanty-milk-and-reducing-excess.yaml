id: concept/canon-increasing-scanty-milk-and-reducing-excess
class: concept
kind: scientific
label:
  ar: "تغزير اللبن وتقليل الزائد منه"
  en: "Increasing scanty milk and reducing excess"
  fr: "Augmenter le lait rare et réduire l’excès dans le Canon"
  ur: "کم دودھ کو بڑھانا اور زیادہ دودھ کو گھٹانا"
  es: "Aumentar la producción de leche escasa y reducir la producción excesiva."
summary:
  ar: "إذا كان لبن المرضعة قليلاً تأمل سببه في سوء مزاج بدنها أو ثديها، ثم تعدل بالغذاء وتعطى مغزرات للبن من أحساء الشعير والرازيانج والشبث والشونيز وضروع الضأن والمعز وغيرها، وإن كثر اللبن حتى آذى نقص بتقليل الغذاء وتضميد الصدر {cite:canon-ibn-sina-print-v1 pp.207-209}."
  en: "If the nurse's milk is scanty the cause is sought in a bad temperament of her body or breast, then it is mended by diet and by milk-increasing foods such as barley gruels, fennel, dill, nigella and the udders of sheep and goats; if the milk is so much that it harms, it is reduced by less food and a dressing on the chest {cite:canon-ibn-sina-print-v1 pp.207-209}."
  fr: "Le livre recherche mauvais tempérament corporel ou mammaire, puis décrit correction alimentaire, bouillies d’orge, fenouil, aneth, nigelle, mamelles ovines et caprines ; l’excès nuisible serait réduit par restriction et pansement thoracique {cite:canon-ibn-sina-print-v1 pp.207-209}."
  es: "Si la leche de la nodriza es escasa, se busca la causa en un mal temperamento de su cuerpo o pecho, y se remedia con la dieta y con alimentos que aumentan la producción de leche, como gachas de cebada, hinojo, eneldo, nigella y ubres de ovejas y cabras; si la leche es tan abundante que perjudica, se reduce con menos alimento y un vendaje en el pecho {cite:canon-ibn-sina-print-v1 pp.207-209}."
