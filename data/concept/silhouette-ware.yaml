  ar: "خزف فارسي من القرن الثاني عشر تُرسم زخارفه ببطانة سوداء كثيفة مباشرة على العجينة البيضاء وتُحدد بالسكين، تحت طلاء شفاف عاجي أو فيروزي عميق {cite:lane-early-islamic-pottery-1947 p. 52} {cite:lane-early-islamic-pottery-1947 p. 53}."
  en: "Twelfth-century Persian ware decorated in thick black slip laid directly on the white body and defined with the knife, under a transparent ivory or deep turquoise glaze {cite:lane-early-islamic-pottery-1947 p. 52} {cite:lane-early-islamic-pottery-1947 p. 53}."
  ur: "بارھویں صدی کے فارسی ظروف جن کی آرائش سفید خمیر پر براہِ راست گاڑھے سیاہ استر سے بنا کر چاقو سے واضح کی جاتی، اور اوپر شفاف ہاتھی دانت رنگ یا گہرا فیروزی لعاب ہوتا {cite:lane-early-islamic-pottery-1947 p. 52} {cite:lane-early-islamic-pottery-1947 p. 53}۔"
  es: "Cerámica persa del siglo XII decorada con engobe negro grueso aplicado directamente sobre el cuerpo blanco y definido con el cuchillo, bajo un esmalte transparente de color marfil o turquesa intenso {cite:lane-early-islamic-pottery-1947 p. 52} {cite:lane-early-islamic-pottery-1947 p. 53}."
  fr: "Céramique persane du XIIe siècle décorée d'un épais engobe noir posé directement sur le corps blanc et défini au couteau, sous une glaçure transparente ivoire ou turquoise foncé {cite:lane-early-islamic-pottery-1947 p. 52} {cite:lane-early-islamic-pottery-1947 p. 53}."
  tr: "On ikinci yüzyıl Pers seramikleri, kalın siyah bir astarla doğrudan beyaz macunun üzerine süslenir ve derin şeffaf fildişi veya turkuaz kaplamanın altında bıçakla işaretlenir {cite:lane-early-islamic-pottery-1947 s. 52} {cite:lane-early-islamic-pottery-1947 s. 53}."
  id: "Keramik Persia abad kedua belas dihiasi dengan lapisan hitam tebal langsung di atas pasta putih dan ditandai dengan pisau, di bawah lapisan transparan gading atau turquoise {cite:lane-early-islamic-pottery-1947 hlm. 52} {cite:lane-early-islamic-pottery-1947 hlm. 53}."
