id: concept/umariyya
class: concept
kind: legal
label:
  ar: "العُمَرِيَّة"
  en: "The 'Umariyya cases of inheritance (the mother's third)"
  ur: "عمریہ (وراثت کی دو صورتیں)"
summary:
  ar: "العُمَرِيَّة مسألتان في الفرائض لهما صورتان: زوج وأبوان، أو زوجة وأبوان، نُسبتا إلى عمر بن الخطاب لأنه أول من قضى فيهما {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11836}. والأم فرضها الثلث إذا لم يكن للميت ولد أو ولد ولد، وإذا تفرد الأبوان بالميراث، وفرضها السدس مع الولد أو مع عدد من الإخوة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11836} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11837}. وقضى عمر والجمهور في العمرية بأن تأخذ الأم ثلث ما بقي بعد فرض الزوج أو الزوجة، فيكون الزوج ثلاثة من ستة والأم واحداً والأب اثنين، وفي الزوجة من اثني عشر، وخالف ابن عباس وأبو بكر الأصم، وزيد بن ثابت {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11837} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11838}."
  en: "'Umariyya is the name of two cases in the law of inheritance, a husband with both parents or a wife with both parents, named after 'Umar ibn al-Khattab, who was the first to decide them {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11836}. The mother takes a third where the deceased has no child or grandchild and the parents alone inherit, and a sixth where there is a child or two or more siblings {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11836} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11837}. 'Umar and the majority held that in the 'umariyya the mother takes a third of what remains after the spouse's share; so with a husband the estate is counted as six shares, the husband taking three, the mother one and the father two, and with a wife twelve shares. Ibn 'Abbas, Abu Bakr al-Asamm and Zayd ibn Thabit differed in their reasoning {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11837} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11838}."
