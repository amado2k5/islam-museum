id: concept/umariyya
class: concept
kind: legal
label:
  ar: "العُمَرِيَّة"
  en: "The 'Umariyya cases of inheritance (the mother's third)"
  ur: "عمریہ ⁦(وراثت کی دو صورتیں)⁩"
  es: "Los casos de herencia 'Umariyya (el tercero de la madre)"
  fr: "Les cas d'héritage 'Umariyya (le tiers de la mère)"
  tr: "Yaş"
  id: "Usia"
summary:
  ar: "العُمَرِيَّة مسألتان في الفرائض لهما صورتان: زوج وأبوان، أو زوجة وأبوان، نُسبتا إلى عمر بن الخطاب لأنه أول من قضى فيهما {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11836}. والأم فرضها الثلث إذا لم يكن للميت ولد أو ولد ولد، وإذا تفرد الأبوان بالميراث، وفرضها السدس مع الولد أو مع عدد من الإخوة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11836} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11837}. وقضى عمر والجمهور في العمرية بأن تأخذ الأم ثلث ما بقي بعد فرض الزوج أو الزوجة، فيكون الزوج ثلاثة من ستة والأم واحداً والأب اثنين، وفي الزوجة من اثني عشر، وخالف ابن عباس وأبو بكر الأصم، وزيد بن ثابت {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11837} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11838}."
  en: "'Umariyya is the name of two cases in the law of inheritance, a husband with both parents or a wife with both parents, named after 'Umar ibn al-Khattab, who was the first to decide them {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11836}. The mother takes a third where the deceased has no child or grandchild and the parents alone inherit, and a sixth where there is a child or two or more siblings {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11836} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11837}. 'Umar and the majority held that in the 'umariyya the mother takes a third of what remains after the spouse's share; so with a husband the estate is counted as six shares, the husband taking three, the mother one and the father two, and with a wife twelve shares. Ibn 'Abbas, Abu Bakr al-Asamm and Zayd ibn Thabit differed in their reasoning {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11837} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11838}."
  es: "'Umariyya es el nombre de dos casos en el derecho de herencia, un esposo con ambos padres o una esposa con ambos padres, llamados así por 'Umar ibn al-Khattab, quien fue el primero en decidirlos {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11836}. La madre toma un tercio cuando el difunto no tiene hijos ni nietos y solo los padres heredan, y un sexto cuando hay un hijo o dos o más hermanos {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11836} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11837}. 'Umar y la mayoría sostuvieron que en la 'umariyya la madre toma un tercio de lo que queda después de la parte del cónyuge; así que con un esposo la herencia se cuenta como seis partes, el esposo toma tres, la madre una y el padre dos, y con una esposa doce partes. Ibn 'Abbas, Abu Bakr al-Asamm y Zayd ibn Thabit diferían en su razonamiento {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.11837} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.11838}."
  fr: "L'expression « 'Umariyya » désigne deux cas en droit successoral, celui d'un mari ou d'une femme héritant de ses deux parents. Ce terme provient d'Umar ibn al-Khattab, qui fut le premier à trancher ces questions {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11836}. La mère reçoit un tiers de l'héritage lorsque le défunt n'a ni enfant ni petit-enfant et que seuls les parents héritent, et un sixième lorsqu'il y a un enfant ou plusieurs frères et sœurs {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11836} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11837}. Umar et la majorité ont statué que, dans le cas de l'« 'umariyya », la mère reçoit un tiers de ce qui reste après la part du conjoint survivant. Ainsi, en présence d'un mari, l'héritage est divisé en six parts: trois pour le mari, une pour la mère et deux pour le père; en présence d'une épouse, il est divisé en douze parts. Ibn 'Abbas, Abu Bakr al-Asamm et Zayd ibn Thabit ont divergé dans leur raisonnement {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11837} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11838}."
  ur: "عمریہ وراثت کے قانون میں دو صورتوں کا نام ہے، ایک شوہر جس کے والدین دونوں ہوں یا ایک بیوی دونوں والدین کے ساتھ، عمر بن الخطاب کے نام پر رکھا گیا ہے، جنہوں نے ان کا فیصلہ کرنے والے پہلے شخص تھے۔ جہاں میت کا کوئی بچہ یا نواسہ نہ ہو اور ماں باپ اکیلے وارث ہوں، اور چھٹا جہاں ایک بچہ یا دو یا دو سے زیادہ بہن بھائی ہوں، تیسرا حصہ لیتا ہے عمر اور جمہور کا خیال ہے کہ عمریہ میں زوج کے حصہ کے بعد جو بچتا ہے اس کا ایک تہائی حصہ ماں لیتی ہے۔ چنانچہ شوہر کے پاس جائیداد چھ حصے شمار ہوتی ہے، شوہر تین، ماں ایک اور باپ دو، اور بیوی کے پاس بارہ حصہ۔ ابن عباس، ابوبکر العصام اور زید بن ثابت نے اپنے استدلال میں اختلاف کیا ہے {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 11837}"
  tr: "Umariyyah, miras konusunun iki biçimi vardır: koca ve ebeveyn ya da eş ve ebeveyn, bunlar Umar ibn Al-Khattab'a atfedilir çünkü bu konularda ilk hükmeden oydu {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11836}. Ölen kişinin oğlu veya oğlu yoksa, anneye üçte biri verilir, ebeveynler tek başına miras alırsa ve alttıda biri çocuk veya birkaç kardeşle birlikte verilir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11836} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11837}. Ömer ve çoğunluk, Ömeriye'de annenin koca veya karı zorunlu kalındıktan sonra kalan paranın üçte birini alması gerektiğine hükmetti; böylece koca altı kişiden üçü, anne bir, baba iki, eş ise on iki kişi olacaktı. İbn Abbas ve Ebu Bekir el-Esam aynı fikirde değildi ve Zayd ibn Tabit {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.11837} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11838}."
  id: "Umariyyah adalah dua hal dalam warisan yang memiliki dua bentuk: suami dan orang tua, atau istri dan orang tua, yang dikaitkan dengan Umar ibn Al-Khattab karena dia adalah yang pertama memerintah mereka {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11836}. Ibu diberikan sepertiga jika almarhum tidak memiliki anak laki-laki atau anak laki-laki, dan jika hanya orang tua yang mewarisi, dan seperenam diberikan kepada anak atau beberapa saudara {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11836} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11837}. Umar dan mayoritas memutuskan di Umariyyah bahwa ibu harus mengambil sepertiga dari sisa setelah suami atau istri diwajibkan, sehingga suami menjadi tiga dari enam, ibu satu, ayah dua, dan istri dua belas. Ibn Abbas dan Abu Bakr al-Asam tidak setuju dan Zayd ibn Thabit {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11837} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11838}."
