id: concept/rijl-fiqh
class: concept
kind: legal
label:
  ar: "الرِّجل"
  en: "Rijl (the foot): washing in ablution, the theft and hirabah penalties, the blood-money for a foot, and its place in the nakedness rules"
  ur: "پاؤں"
summary:
  ar: "الرجل في اللغة القدم، وفي الاصطلاح تختلف: فهي القدم مع الكعبين في آية الوضوء، ودون المفصل بين الساق والقدم في قطع السارق، ومن أصل الفخذ إلى القدم في موضع آخر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8644} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8645} ذهب جمهور الفقهاء إلى أن غسل الرجلين إلى الكعبين فرض في الوضوء، وذهب بعض السلف إلى المسح، وخير الحسن البصري والطبري. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8645} واتفق الفقهاء على قطع اليد اليمنى في السرقة الأولى، ثم الرجل اليسرى في الثانية، واختلفوا فيما بعد، وقال المالكية والشافعية والحنابلة في رواية تقطع اليد اليسرى ثم الرجل اليمنى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8646} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8647} وفي قطع الرجلين دية كاملة، وفي إحداهما نصفها، وفي أصابعها بحسب كل أصبع، وتجب حكومة عدل زيادة عند الحنفية والشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8647} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8648} والرجل عورة من المرأة الحرة إلا القدمين، وعورة الرجل ما بين السرة والركبة عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8648}"
  en: "Rijl means the foot. In the jurists' usage it names the foot with the two ankle bones in the verse of ablution, the part below the joint of the leg in cutting a thief's foot, and from the root of the thigh to the foot in another place. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8644} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8645} Most jurists hold that washing the feet up to the ankles is obligatory in ablution; some early scholars held wiping, and al-Hasan al-Basri and al-Tabari allowed a choice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8645} For theft, the right hand is cut first and the left foot at the second theft; the rest is disputed, and the Malikis, Shafi'is and a Hanbali view cut the left hand and right foot. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8646} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8647} Cutting both feet carries full blood-money, one foot half of it, and each toe a tenth; the Hanafis and Shafi'is add a just assessment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8647} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8648} For a free woman the foot is nakedness except the two feet, and for men the nakedness runs from navel to knees by the majority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8648}"
  ur: "رجل پاؤں کو کہتے ہیں؛ وضو میں ٹخنوں تک دھونا جمہور کے نزدیک فرض ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8645} چوری کی سزا میں پہلی بار دایاں ہاتھ اور دوسری بار بایاں پاؤں کاٹا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8646}"
