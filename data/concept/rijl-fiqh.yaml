id: concept/rijl-fiqh
class: concept
kind: legal
label:
  ar: "الرِّجل"
  en: "Rijl (the foot): washing in ablution, the theft and hirabah penalties, the blood-money for a foot, and its place in the nakedness rules"
  ur: "پاؤں"
  es: "Rijl (el pie): el lavado en la ablución, las penas por robo e hirabah, la compensación por un pie y su lugar en las normas sobre la desnudez."
  fr: "Rijl (le pied): les ablutions, les peines pour vol et hirabah, le prix du sang pour un pied et sa place dans les règles de nudité"
  tr: "Adam"
  id: "Pria itu"
summary:
  ar: "الرجل في اللغة القدم، وفي الاصطلاح تختلف: فهي القدم مع الكعبين في آية الوضوء، ودون المفصل بين الساق والقدم في قطع السارق، ومن أصل الفخذ إلى القدم في موضع آخر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8644} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8645} ذهب جمهور الفقهاء إلى أن غسل الرجلين إلى الكعبين فرض في الوضوء، وذهب بعض السلف إلى المسح، وخير الحسن البصري والطبري. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8645} واتفق الفقهاء على قطع اليد اليمنى في السرقة الأولى، ثم الرجل اليسرى في الثانية، واختلفوا فيما بعد، وقال المالكية والشافعية والحنابلة في رواية تقطع اليد اليسرى ثم الرجل اليمنى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8646} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8647} وفي قطع الرجلين دية كاملة، وفي إحداهما نصفها، وفي أصابعها بحسب كل أصبع، وتجب حكومة عدل زيادة عند الحنفية والشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8647} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8648} والرجل عورة من المرأة الحرة إلا القدمين، وعورة الرجل ما بين السرة والركبة عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8648}"
  en: "Rijl means the foot. In the jurists' usage it names the foot with the two ankle bones in the verse of ablution, the part below the joint of the leg in cutting a thief's foot, and from the root of the thigh to the foot in another place. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8644} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8645} Most jurists hold that washing the feet up to the ankles is obligatory in ablution; some early scholars held wiping, and al-Hasan al-Basri and al-Tabari allowed a choice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8645} For theft, the right hand is cut first and the left foot at the second theft; the rest is disputed, and the Malikis, Shafi'is and a Hanbali view cut the left hand and right foot. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8646} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8647} Cutting both feet carries full blood-money, one foot half of it, and each toe a tenth; the Hanafis and Shafi'is add a just assessment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8647} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8648} For a free woman the foot is nakedness except the two feet, and for men the nakedness runs from navel to knees by the majority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8648}"
  ur: "رجل پاؤں کو کہتے ہیں؛ وضو میں ٹخنوں تک دھونا جمہور کے نزدیک فرض ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8645} چوری کی سزا میں پہلی بار دایاں ہاتھ اور دوسری بار بایاں پاؤں کاٹا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8646}"
  es: "Rijl significa el pie. En el uso de los juristas, nombra el pie con los dos huesos del tobillo en el versículo de la ablución, la parte debajo de la articulación de la pierna al cortar el pie de un ladrón, y desde la raíz del muslo hasta el pie en otro lugar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8644} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8645} La mayoría de los juristas sostienen que lavar los pies hasta los tobillos es obligatorio en la ablución; algunos eruditos antiguos sostenían frotar, y al-Hasan al-Basri y al-Tabari permitieron una elección. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8645} Para el robo, primero se corta la mano derecha y el pie izquierdo en el segundo robo; El resto es disputado, y los malikíes, shafi'ís y una visión hanbalí cortan la mano izquierda y el pie derecho. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8646} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8647} Cortar ambos pies conlleva una indemnización completa por sangre, un pie la mitad, y cada dedo una décima parte; los hanafíes y shafi'ís añaden una valoración justa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8647} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8648} Para una mujer libre, el pie es desnudez excepto los dos pies, y para los hombres la desnudez va desde el ombligo hasta las rodillas en la mayoría. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8648}"
  fr: "Rijl signifie le pied. Dans l'usage des juristes, ce terme désigne le pied comprenant les deux os de la cheville dans le verset relatif aux ablutions, la partie située sous l'articulation de la jambe lors de la coupe du pied d'un voleur, et, dans un autre cas, la zone allant de la base de la cuisse au pied. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8644} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8645} La plupart des juristes considèrent que laver les pieds jusqu'aux chevilles est obligatoire lors des ablutions; certains savants anciens préconisaient de les essuyer, tandis qu'al-Hasan al-Basri et al-Tabari laissaient le choix. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8645} En cas de vol, on coupe d'abord la main droite, puis le pied gauche lors du second vol. Le reste est sujet à controverse; les écoles malikite, chaféite et hanbalite préconisent de couper la main gauche et le pied droit. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8646} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8647} Couper les deux pieds entraîne l’amende complète du sang, un seul pied la moitié, et chaque orteil un dixième; les écoles hanafite et chaféite y ajoutent une juste contribution. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8647} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8648} Pour une femme libre, le pied est considéré comme nu, à l’exception des deux pieds, et pour les hommes, la nudité s’étend généralement du nombril aux genoux. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8648}"
  tr: "Dil olarak 'insan' 'qadam'dır ve terminolojide farklılık gösterir: abdest alma ayetinde topuklu ayak, hırsızın kesiminde bacak ile ayak arasındaki eklemin altında, başka bir yerde ise uyluk tabanından ayağa kadar olan ayaktır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.8644} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8645} Hukukçuların çoğu, ayakları ayak bileklerine kadar yıkamanın abdest alırken zorunlu olduğunu düşünürken, bazı erken dönem bilginler silmeyi tercih etmiş, en iyi görüşler Al-Hasan Al-Basri ve Al-Tabari'dir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8645} Hukukçular ilk hırsızlıkta sağ elin, sonra ikinci hırsızlıkta sol bacağını kesmekte anlaştılar, ancak daha sonra anlaşmazlık yaşadılar. Malikiler, Şafiiler ve Hanbaliler bir rivayette sol elin, sonra sağ ayağın kesildiğini söylediler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8646} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8647} Bacakların kesilmesi için tam kan parası, yarısı ve her parmakta parmak parmaklarına göre verilir. Hanafi ve Şafiilere göre adil bir yönetim zorunludur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8647} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8648} Erkek, ayakları hariç özgür bir kadının kadının 'awrah'ıdır ('awrah), erkeğin 'awrahı ise çoğunluğa göre göbek ile diz arasındadır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8648}"
  id: "Dalam bahasa, 'manusia' adalah 'qadam', dan dalam istilah berbeda: itu adalah kaki dengan tumit dalam ayat wudhu, dan di bawah sendi antara kaki dan kaki saat memotong pencuri, dan dari pangkal paha ke kaki di tempat lain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8644} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8645} Mayoritas ahli hukum berpendapat bahwa mencuci kaki hingga pergelangan kaki adalah wajib dalam wudhu, sementara beberapa sarjana awal memutuskan untuk mengelap, dengan pendapat terbaik adalah Al-Hasan Al-Basri dan Al-Tabari. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8645} Para ahli hukum sepakat memotong tangan kanan pada pencurian pertama, lalu kaki kiri pada pencurian kedua, tetapi mereka berbeda kemudian. Maliki, Shafi'i, dan Hanbal mengatakan dalam sebuah riwayat bahwa tangan kiri dipotong, lalu kaki kanan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8646} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8647} Untuk memotong kaki, uang darah penuh diberikan, dengan setengahnya, dan di setiap jari sesuai jari kaki. Pemerintahan yang adil wajib menurut Hafi dan Shafi'i. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8647} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8648} Seorang pria adalah 'awrah' wanita ('awrah) dari wanita bebas kecuali kaki, dan 'awrah pria berada di antara pusar dan lutut menurut mayoritas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8648}"
