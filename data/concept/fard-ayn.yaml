id: concept/fard-ayn
class: concept
kind: legal
label:
  ar: "فرض العين"
  en: "The individual obligation (fard 'ayn)"
  ur: "فرضِ عین"
  fr: "L'obligation individuelle (fard 'ayn)"
  es: "La obligación individual (fard 'ayn)"
summary:
  ar: "فرض العين ما يُطلب من كل مكلف بعينه، فلا يسقط عنه بفعل غيره، ويقابله فرض الكفاية في تقسيم الأصوليين للواجب {cite:irshad-al-fuhul-dar-al-fikr p.8}. يمثّل له الشافعي بالصلوات والحج والزكاة، ويقول إن عمل أحد فيها لا يُكتب لغيره {cite:risala-shafii p.478}. والمصطلح لا يرد بلفظه في القرآن ولا في الحديث، لكن الحديث يعبّر عن معناه بصيغة «فريضة على كل مسلم» {cite:hadith-api-fawazahmed0 Ibn Majah 224} و«واجب على كل محتلم» {cite:hadith-api-fawazahmed0 Nasai 1375}."
  en: "The individual obligation (fard 'ayn) is what is required of each person under religious responsibility individually, so that it does not lapse for him through the act of another; its counterpart in the division of the obligatory by the scholars of legal theory is the communal obligation {cite:irshad-al-fuhul-dar-al-fikr p.8}. Al-Shafi'i gives as examples the prayers, the pilgrimage and the alms, and says that one person's work in them is not written for another {cite:risala-shafii p.478}. The term does not occur in its wording in the Qur'an or the hadith, but the hadith expresses its meaning in the form \"an obligation upon every Muslim\" {cite:hadith-api-fawazahmed0 Ibn Majah 224} and \"obligatory upon everyone who has reached maturity\" {cite:hadith-api-fawazahmed0 Nasai 1375}."
  ur: "فرضِ عین وہ ہے جس کا مطالبہ ہر مکلف سے اس کی ذات کے طور پر ہو، سو وہ کسی دوسرے کے کر لینے سے اس سے ساقط نہیں ہوتا؛ اصولیین کی تقسیمِ واجب میں اس کے مقابل فرضِ کفایہ ہے {cite:irshad-al-fuhul-dar-al-fikr p.8}۔ شافعی مثال کے طور پر نمازوں، حج اور زکوٰۃ کو پیش کرتے ہیں، اور کہتے ہیں کہ ان میں ایک کا عمل دوسرے کے لیے نہیں لکھا جاتا {cite:risala-shafii p.478}۔ یہ اصطلاح اپنے لفظ کے ساتھ نہ قرآن میں آتی ہے نہ حدیث میں، لیکن حدیث اس کا مفہوم «ہر مسلمان پر فریضہ» {cite:hadith-api-fawazahmed0 Ibn Majah 224} اور «ہر بالغ پر واجب» {cite:hadith-api-fawazahmed0 Nasai 1375} کی صورت میں ادا کرتی ہے۔"
  fr: "L'obligation individuelle (fard 'ayn) est ce qui est demandé à chaque personne astreinte à la responsabilité religieuse en propre, de sorte qu'elle ne tombe pas pour lui par l'acte d'un autre ; son pendant dans la division de l'obligatoire par les spécialistes des fondements du droit est l'obligation collective {cite:irshad-al-fuhul-dar-al-fikr p.8}. Al-Shafi'i donne comme exemples les prières, le pèlerinage et l'aumône, et dit que l'œuvre d'une personne en cela n'est pas inscrite pour une autre {cite:risala-shafii p.478}. Le terme n'apparaît pas dans sa formulation dans le Coran ni dans le hadith, mais le hadith en exprime le sens sous la forme « une obligation pour tout musulman » {cite:hadith-api-fawazahmed0 Ibn Majah 224} et « obligatoire pour tout homme parvenu à la maturité » {cite:hadith-api-fawazahmed0 Nasai 1375}."
  es: "La obligación individual (fard 'ayn) es lo que se exige a cada persona sujeta a responsabilidad religiosa en particular, de modo que no cae para ella por el acto de otro; su contrapartida en la división de lo obligatorio por los especialistas en teoría jurídica es la obligación comunitaria {cite:irshad-al-fuhul-dar-al-fikr p.8}. Al-Shafi'i da como ejemplos las oraciones, la peregrinación y la limosna, y dice que la obra de una persona en ellas no se escribe para otra {cite:risala-shafii p.478}. El término no aparece con su formulación en el Corán ni en el hadiz, pero el hadiz expresa su sentido bajo la forma «una obligación para todo musulmán» {cite:hadith-api-fawazahmed0 Ibn Majah 224} y «obligatorio para todo el que ha alcanzado la madurez» {cite:hadith-api-fawazahmed0 Nasai 1375}."
