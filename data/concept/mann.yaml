label: { ar: "المَنّ ⁦(مقدار شرعي، ومنّ المعطي على المعطى)⁩", en: "The mann: a unit of weight, and reminding a recipient of one's favour", ur: "منّ ⁦(وزن اور احسان جتلانا)⁩", es: "El mann: una unidad de peso, y recordarle al destinatario el favor de uno.", fr: "Le mann: une unité de poids, et un symbole de faveur." }
summary:
  ar: "المنّ في اللغة له معان، منها الإنعام وتعداد الصنائع، ومنه المنّ مكيالا ووزنا. وللفقهاء فيه بابان: الأول مقداره الشرعي وقد اختلفوا فيه بين الأرطال والدراهم، والثاني المنّ بمعنى ذكر النعمة على الغير، وهو محرم وكبيرة يبطل ثواب الصدقة. ومن أحكامه رفض التبرع خوفا من المنة، والمنّ على الأسرى للإمام."
  en: "Mann in the lexicon has several senses: to confer a favour, to count one's services, a measure of weight or volume, and the manna that fell on the children of Israel. In law it has two parts: its measure, on which the jurists differ between pounds and dirhams; and reminding someone of a favour one has done, which is a major sin that voids the reward of charity, as the Qur'an and the Sunna show. The jurists hold that one may refuse a gift lest it bring obligation, and the imam may free captives as an act of grace."
  ur: "منّ کے لغوی معنی احسان جتانا، خدمات گنوانا، ایک وزن یا پیمانہ ہیں۔ فقہاء کے نزدیک احسان جتلانا کبیرہ گناہ ہے جو صدقے کا ثواب باطل کرتا ہے، اور منّ کا شرعی مقدار بھی بیان کیا گیا ہے۔"
  es: "En el léxico, la palabra «mann» tiene varios significados: conceder un favor, reconocer los servicios prestados, ser una medida de peso o volumen, y referirse al maná que cayó sobre los hijos de Israel. En derecho, se divide en dos partes: su medida, sobre la cual los juristas discrepan entre libras y dirhams; y recordar a alguien un favor recibido, lo cual constituye un pecado grave que anula la recompensa de la caridad, como lo demuestran el Corán y la Sunna. Los juristas sostienen que se puede rechazar un regalo para evitar obligaciones, y que el imán puede liberar cautivos como un acto de gracia."
  fr: "Le mot « mann » possède plusieurs sens: accorder une faveur, compter ses services, une mesure de poids ou de volume, et la manne tombée sur les enfants d’Israël. En droit, il comporte deux aspects: sa mesure, sur laquelle les juristes divergent entre livres et dirhams; et le fait de rappeler à quelqu’un une faveur rendue, ce qui constitue un péché majeur annulant la récompense de la charité, comme l’attestent le Coran et la Sunna. Les juristes estiment qu’il est permis de refuser un don afin d’éviter toute obligation, et que l’imam peut affranchir des captifs par grâce."
