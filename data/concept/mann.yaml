label: { ar: "المَنّ (مقدار شرعي، ومنّ المعطي على المعطى)", en: "The mann: a unit of weight, and reminding a recipient of one's favour", ur: "منّ (وزن اور احسان جتلانا)" }
summary:
  ar: "المنّ في اللغة له معان، منها الإنعام وتعداد الصنائع، ومنه المنّ مكيالا ووزنا. وللفقهاء فيه بابان: الأول مقداره الشرعي وقد اختلفوا فيه بين الأرطال والدراهم، والثاني المنّ بمعنى ذكر النعمة على الغير، وهو محرم وكبيرة يبطل ثواب الصدقة. ومن أحكامه رفض التبرع خوفا من المنة، والمنّ على الأسرى للإمام."
  en: "Mann in the lexicon has several senses: to confer a favour, to count one's services, a measure of weight or volume, and the manna that fell on the children of Israel. In law it has two parts: its measure, on which the jurists differ between pounds and dirhams; and reminding someone of a favour one has done, which is a major sin that voids the reward of charity, as the Qur'an and the Sunna show. The jurists hold that one may refuse a gift lest it bring obligation, and the imam may free captives as an act of grace."
  ur: "منّ کے لغوی معنی احسان جتانا، خدمات گنوانا، ایک وزن یا پیمانہ ہیں۔ فقہاء کے نزدیک احسان جتلانا کبیرہ گناہ ہے جو صدقے کا ثواب باطل کرتا ہے، اور منّ کا شرعی مقدار بھی بیان کیا گیا ہے۔"
