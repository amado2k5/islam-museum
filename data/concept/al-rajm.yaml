  - tradition: other
    id: kharijite-view-as-described
    stance:
      ar: "قول الخوارج كما يعرضه الشعراوي: لا رجم في القرآن، والمحصنات هنا المتزوجات، فيكتفى بالجلد"
      en: "The Kharijite view as Sha'rawi reports it: there is no stoning in the Qur'an, 'muhsanat' here means married women, so only lashing applies"
      ur: "خوارج کا قول جیسا شعراوی نقل کرتے ہیں: قرآن میں رجم نہیں، یہاں محصنات سے شادی شدہ عورتیں مراد ہیں، اس لیے صرف کوڑے ہیں"
    summary:
      ar: "ينقل الشعراوي هذا القول ليرده؛ وهو عرض لرأي غيره كما نقله هو، لا رأي المتحف {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2125}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2126}."
      en: "Sha'rawi reports this view in order to refute it; it is the view of others as he states it, not the museum's view {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2125}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2126}."
      ur: "شعراوی یہ قول رد کرنے کے لیے نقل کرتے ہیں؛ یہ دوسروں کی رائے ہے جیسا کہ انہوں نے بیان کی، میوزیم کی رائے نہیں {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2125}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2126}۔"
