id: concept/al-rajm
class: concept
kind: legal
label:
  ar: "الرجم"
  en: "Stoning (rajm) as a penalty for zina"
  ur: "رجم"
summary:
  ar: "يثبت الشعراوي عقوبة الرجم على الثيب بفعل النبي الذي رجم ماعزاً والغامدية واليهودي واليهودية، ويرى أن الفعل نص عملي يُقدَّم على الاستدلال بظاهر لفظ «المحصنات»، وأن الحد على الأمة نصف حد الحرة لا يتجزأ في الرجم. ويعرض قول الخوارج، كما ينقله، بأن القرآن لا رجم فيه وأن المحصنات المتزوجات، ويرد عليه {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2059}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2060}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2125}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2126}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2129}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2130}."
  en: "Al-Sha'rawi affirms stoning for a married offender on the basis of the Prophet's practice: he stoned Ma'iz, al-Ghamidiyya, and a Jewish man and woman. He holds that a practice is a text stronger than an argument from the apparent wording of 'muhsanat', and that a slave woman's penalty, being half, cannot apply to stoning. He reports the Kharijite view that the Qur'an contains no stoning and that 'muhsanat' means married women, and answers it {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2059}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2060}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2125}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2126}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2129}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2130}."
  ur: "شعراوی شادی شدہ مجرم کے لیے رجم کی سزا کو نبی کے عمل سے ثابت کرتے ہیں، جنہوں نے ماعز، غامدیہ اور ایک یہودی مرد و عورت کو رجم کیا۔ ان کے مطابق عمل نص کا درجہ رکھتا ہے، اور لونڈی کی سزا نصف ہونے کے باعث رجم پر لاگو نہیں ہوتی۔ وہ خوارج کا قول، جو وہ نقل کرتے ہیں، رد کرتے ہیں {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2059}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2060}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2125}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2126}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2129}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2130}۔"
wings: [ideas]
themes: [law-and-courts]
issue:
  ar: "هل يثبت الرجم بالسنة العملية مع أن القرآن لم يذكره نصاً، وكيف يُفهم «المحصنات»؟"
  en: "Is stoning established by the Prophet's practice although the Qur'an does not name it, and how is 'muhsanat' to be understood?"
  ur: "کیا رجم نبی کے عملی طریقے سے ثابت ہے حالانکہ قرآن اس کا نام نہیں لیتا، اور «محصنات» سے کیا مراد ہے؟"
perspectives:
  - tradition: sunni
    id: sunni-sharawi-practice-of-the-prophet
    stance:
      ar: "الرجم ثابت للمحصن بفعل النبي وتقريره، ولا يتجزأ فلا يطبق على الأمة"
      en: "Stoning for a married offender is established by the Prophet's practice and approval, and cannot be halved, so it does not apply to a slave woman"
      ur: "شادی شدہ مجرم کا رجم نبی کے عمل اور تقریر سے ثابت ہے، اور اسے نصف نہیں کیا جا سکتا، اس لیے لونڈی پر لاگو نہیں"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقرر الشعراوي أن الفعل النبوي نص عملي أقوى من الاحتمال في اللفظ، ويستدل بأن الرجم لا ينصف لأنه إزهاق للحياة، وأن الحد المنصف هو العذاب {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2129}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2126}. وينقل حديث عبادة في الحد وقد أورده مسلم، ويقول إن التشريع جاء بالسنة مع القرآن {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2059}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2060}."
      en: "Sha'rawi holds that the Prophet's practice is a practical text, stronger than a doubtful wording, and argues that stoning cannot be halved because it ends life while the halved penalty is pain {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2126}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2129}. He cites the hadith of Ubada, which he attributes to Muslim, and says legislation came through the Sunna together with the Qur'an {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2059}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2060}."
      ur: "شعراوی کے مطابق نبی کا عمل ایک عملی نص ہے جو مبہم لفظ پر مقدم ہے، اور رجم اس لیے نصف نہیں ہوتا کیونکہ اس سے جان جاتی ہے، جبکہ نصف سزا تکلیف ہے {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2126}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2129}۔ وہ عبادہ بن صامت کی حدیث کا ذکر کرتے ہیں جسے وہ مسلم سے منسوب کرتے ہیں {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2059}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2060}۔"
    sources: [source/tafsir-sharawi-khawatir-scan-vol-2]
