id: concept/tawaffi
class: concept
kind: doctrine
label:
  ar: التوفّي ⁦(معنى الأخذ التام وتوفّي الأنفس)⁩
  en: Tawaffi (taking in full, and the taking of souls)
  es: "Tawaffi (tomar por completo y tomar las almas)"
  fr: "Tawaffi (prise totale et prise des âmes)"
  ur: "توفی ⁦(مکمل طور پر لینا، اور روحوں کو لینا)⁩"
  tr: "Tevfi (tam alma anlamına gelir ve Tevaf el-EnvÁf)"
  id: "Tawfi (berarti pengambilan lengkap, dan Tawaf al-Anwāf)"
summary:
  ar: "يرى الشعراوي أن أصل لفظ التوفّي أخذ الشيء تاماً، وأن الموت والنوم معنيان من معانيه، وأن الموت يختلف عن القتل لأن القتل يهدم البنية والموت ينزع الروح والبنية باقية. ويفسّر بذلك خطاب الله لعيسى في آل عمران 55، ويقول إن الواو لا تقتضي ترتيب الأحداث {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1501}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1504}."
  en: "Sha'rawi holds that the root tawaffa basically means taking a thing in full. Death and sleep are two of its senses. He separates death from killing, since killing breaks the body while death takes the soul and leaves the body whole, and he reads the verse addressed to Jesus in Al Imran 55 through this sense, adding that the Arabic 'and' does not imply order between the events {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1501}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1504}."
  es: "Sha'rawi sostiene que la raíz tawaffa significa básicamente tomar algo por completo. La muerte y el sueño son dos de sus sentidos. Separa la muerte del asesinato, ya que el asesinato rompe el cuerpo mientras que la muerte toma el alma y deja el cuerpo intacto, y lee el versículo dirigido a Jesús en Al Imran 55 a través de este sentido, agregando que el árabe 'y' no implica orden entre los eventos {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1501}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1504}."
  fr: "Sha'rawi soutient que la racine tawaffa signifie fondamentalement « prendre quelque chose dans sa totalité ». La mort et le sommeil sont deux de ses sens. Il distingue la mort du meurtre, car le meurtre brise le corps tandis que la mort emporte l'âme et laisse le corps intact. Il interprète le verset adressé à Jésus dans Al Imran 55 selon ce sens, ajoutant que le « et » arabe n'implique pas d'ordre entre les événements {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1501}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1504}."
  ur: "شعراوی کا خیال ہے کہ اصل طواف کا مطلب ہے کسی چیز کو مکمل طور پر لینا۔ موت اور نیند اس کے دو حواس ہیں۔ وہ موت کو قتل سے الگ کرتا ہے، کیونکہ قتل جسم کو توڑ دیتا ہے جب کہ موت روح کو لے کر پورے جسم کو چھوڑ دیتی ہے، اور اس نے آل عمران 55 میں حضرت عیسیٰ سے خطاب کی آیت کو اسی معنی میں پڑھا، مزید کہا کہ عربی 'اور' واقعات کے درمیان ترتیب پر دلالت نہیں کرتا۔ صفحہ 1501}{حوالہ:تفسیر-شعروی-خواطر-سکین-جلد-2 صفحہ 1504}۔"
  tr: "Al-Shaarawi, 'ölüm' kelimesinin kökeninin bir şeyi tamamen almak olduğunu, ölüm ve uykunun iki anlamı olduğunu, ölümün öldürmekten farklı olduğunu çünkü öldürmenin yapıyı yok ettiğini, ölümün ise ruhu alıp yapıyı kaldığını düşünür. Tanrı'nın İmran 55 ailesinde İsa'ya yaptığı hitabı, 'waw'ın olayların sırasını gerektirmediğini söyler {cite:tafsir-sharawi-khawatir-scan-vol-vol-2 s.1501}{cite:tafsir-sharawi-khawatir-scan-vol-vol-2 s.1504}."
  id: "Al-Shaarawi percaya bahwa asal kata 'kematian' adalah mengambil sesuatu sepenuhnya, dan kematian serta tidur adalah dua maknanya, dan kematian berbeda dengan membunuh karena membunuh menghancurkan struktur, sementara kematian menghilangkan jiwa dan struktur itu tetap ada. Ia menjelaskan pidato Tuhan kepada Yesus dalam keluarga Imran 55, mengatakan bahwa 'waw' tidak memerlukan urutan peristiwa {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1501}{cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1504} {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1504}."
