id: concept/tawaffi
class: concept
kind: doctrine
label:
  ar: التوفّي (معنى الأخذ التام وتوفّي الأنفس)
  en: Tawaffi (taking in full, and the taking of souls)
summary:
  ar: "يرى الشعراوي أن أصل لفظ التوفّي أخذ الشيء تاماً، وأن الموت والنوم معنيان من معانيه، وأن الموت يختلف عن القتل لأن القتل يهدم البنية والموت ينزع الروح والبنية باقية. ويفسّر بذلك خطاب الله لعيسى في آل عمران 55، ويقول إن الواو لا تقتضي ترتيب الأحداث {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1501}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1504}."
  en: "Sha'rawi holds that the root tawaffa basically means taking a thing in full. Death and sleep are two of its senses. He separates death from killing, since killing breaks the body while death takes the soul and leaves the body whole, and he reads the verse addressed to Jesus in Al Imran 55 through this sense, adding that the Arabic 'and' does not imply order between the events {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1501}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1504}."
