issue:
  ar: "هل يُفهم التوفّي في القرآن على معنى الموت وحده، أم له معانٍ أخرى يحددها السياق؟"
  en: "Should tawaffi in the Qur'an be read as death alone, or does its context point to other senses as well?"
perspectives:
- tradition: sunni
  id: sunni-sharawi-taking-in-full
  stance:
    ar: "التوفّي أخذ الشيء تاماً، والنوم والموت معنيان من معانيه"
    en: "Tawaffi is taking a thing in full; sleep and death are two of its senses"
  summary:
    ar: "يرى الشعراوي أن أصل لفظ التوفّي الأخذ التام، وأن القرآن يسمي النوم توفياً، فلا يُحمل اللفظ على الموت وحده، ويفرّق بين الموت والقتل، ويقول إن الواو في آية آل عمران لا توجب الترتيب بين الرفع والتوفّي. ويعرض ذلك دون حكم على مسألة كيفية الرفع {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1501}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1502}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1504}."
    en: "Sha'rawi holds that the root basically means taking in full, that the Qur'an calls sleep tawaffi, so the word should not be confined to death, and he separates death from killing. He says the 'and' in the Al Imran verse does not require the raising to come after the taking. He presents this without a verdict on the manner of the raising {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1501}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1502}{cite:tafsir-sharawi-khawatir-scan-vol-2 p.1504}."
