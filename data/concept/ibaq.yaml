label: { ar: "الإباق", en: "Running away (ibaq) of a slave" }
summary:
  ar: "تعرّف الموسوعة الكويتية الإباق بأنه انطلاق العبد تمرداً ممن هو في يده من غير خوف ولا كدّ في العمل، وتعدّه محرماً بالاتفاق. ثم تعرض أحكامه مسألةً مسألة بمذاهب الأئمة الأربعة: أخذ الآبق ويده وما ينفق عليه، وضمان جنايته، وديته، وبيعه، وعيبه، وعتقه، والجعل المستحق لرادّه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1408} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1409} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1410} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1411}"
  en: "The Kuwaiti encyclopedia defines running away (ibaq) as a slave's flight in rebellion from the one who holds him, without fear or hardship in the work, and records it as forbidden by consensus. It then takes its rules one by one through the four Sunni schools: taking up a runaway and his upkeep, liability for his wrongdoing, his blood-money, sale, defect, manumission, and the reward owed to whoever returns him."
