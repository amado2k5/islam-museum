label: { ar: "الإباق", en: "Running away (ibaq) of a slave", es: "Huida (ibaq) de un esclavo", fr: "Fuite (ibaq) d'un esclave", ur: "غلام کا بھاگنا" }
summary:
  ar: "تعرّف الموسوعة الكويتية الإباق بأنه انطلاق العبد تمرداً ممن هو في يده من غير خوف ولا كدّ في العمل، وتعدّه محرماً بالاتفاق. ثم تعرض أحكامه مسألةً مسألة بمذاهب الأئمة الأربعة: أخذ الآبق ويده وما ينفق عليه، وضمان جنايته، وديته، وبيعه، وعيبه، وعتقه، والجعل المستحق لرادّه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1408} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1409} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1410} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1411}"
  en: "The Kuwaiti encyclopedia defines running away (ibaq) as a slave's flight in rebellion from the one who holds him, without fear or hardship in the work, and records it as forbidden by consensus. It then takes its rules one by one through the four Sunni schools: taking up a runaway and his upkeep, liability for his wrongdoing, his blood-money, sale, defect, manumission, and the reward owed to whoever returns him."
  es: "La enciclopedia kuwaití define la fuga (ibaq) como la huida de un esclavo en rebeldía contra quien lo retiene, sin temor ni sufrimiento en el trabajo, y la registra como prohibida por consenso. A continuación, expone sus normas una por una a través de las cuatro escuelas sunitas: la acogida de un esclavo fugitivo y su manutención, la responsabilidad por sus faltas, la indemnización por su sangre, la venta, la deserción, la manumisión y la recompensa que se debe a quien lo devuelva."
  fr: "L'encyclopédie koweïtienne définit la fuite (ibaq) comme la fuite d'un esclave en signe de rébellion contre son maître, sans crainte ni contrainte au travail, et la considère comme interdite par consensus. Elle expose ensuite les règles qui en découlent à travers les quatre écoles sunnites: la prise en charge et l'entretien d'un fugitif, la responsabilité pour ses méfaits, le prix du sang, la vente, la défection, l'affranchissement et la récompense due à celui qui le ramène."
  ur: "کویتی انسائیکلو پیڈیا نے بھاگنے کی تعریف کی ہے کہ ⁦(ایباق)⁩ کو غلام کی اڑان کے طور پر جو اسے پکڑے ہوئے ہے، بغیر کسی خوف اور کام میں مشقت کے، اور اسے اتفاق رائے سے حرام قرار دیتا ہے۔ اس کے بعد یہ چار سنی مکاتب فکر کے ذریعے ایک ایک کر کے اپنے اصولوں پر عمل پیرا ہوتا ہے: ایک بھگوڑے کو سنبھالنا اور اس کی دیکھ بھال، اس کے غلط کاموں کی ذمہ داری، اس کے خون کی رقم، فروخت، عیب، چھوٹ، اور جو اسے واپس کرتا ہے اس پر واجب الادا اجر۔"
