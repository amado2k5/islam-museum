id: concept/al-qisas
class: concept
kind: legal
label:
  ar: "القصاص"
  en: "Retaliation (qisas)"
summary:
  ar: "يرى الشعراوي أن القصاص تشريع مكتوب على القاتل والمقتول وولي الدم، يحقن الثأر ويحمي المجتمع، وأن ولي الدم بين القصاص والعفو والدية، وأن الدية إحسان، وأن القصاص حياة لأنه يردع من يريد القتل. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.744}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.745}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.746}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.749}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.752}"
  en: "Sha'rawi holds that retaliation is a prescription written on the killer, the slain and the heir of blood, which quells vengeance and protects society; the heir of blood chooses among retaliation, pardon and blood-money; blood-money is a kindness; and retaliation is life because it deters one who wants to kill {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.744}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.745}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.746}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.749}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.752}."
wings: [ideas]
themes: [ethics-and-character, worship-and-the-pillars]
periods: [period/prophetic-era]
regions: [arabia]
issue:
  ar: "كيف يتوازن القصاص مع العفو والدية، وهل يُقتل الحر بالعبد والذكر بالأنثى؟"
  en: "How is retaliation balanced with pardon and blood-money, and is a free man killed for a slave or a man for a woman?"
perspectives:
  - tradition: sunni
    id: sharawi-retaliation-balance
    stance:
      ar: "القصاص مكتوب بالعدل ويقرن بالعفو والدية، والتشريع يحقن الثأر ويحمي الجماعة"
      en: "Retaliation is written in justice and paired with pardon and blood-money; the law quells vengeance and protects the community"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقرأ الشعراوي الآية على أن الحر بالحر والعبد بالعبد والأنثى بالأنثى هو إتمام المعادلة لا حصر للقتل في الجنس، وأن الشرع رد الثأر الجاهلي إلى حده الأدنى، وأن ولي الدم يملك القصاص أو العفو، والدية تُؤدى بإحسان، وأن الآية الأخرى في المائدة جعلت النفس بالنفس. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.745}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.746}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.747}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.749}"
      en: "Sha'rawi reads the verse on free for free and slave for slave ([[passage/quran-2-178|2:178]]) as completing the equation, not as limiting the killing to the same class; he holds that the law brought the pre-Islamic feud back to a minimum; the heir of blood may retaliate or pardon, and blood-money is paid with kindness; and the other verse makes life for life {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.745}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.746}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.747}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.749}."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
  - tradition: sunni
    id: scope-note-jurists-equivalence
    stance:
      ar: "خلاف الفقهاء في قتل الحر بالعبد وقتل الرجل بالمرأة لم يُدخل من مصدر مراجَع"
      en: "The jurists' disagreement on killing a free man for a slave and a man for a woman is not entered from a checked source"
    holders: []
    summary:
      ar: "يقرر الشعراوي أن الحر يُقتل إن قتل حراً، لكن المذاهب في قتل الحر بالعبد لم تُدخل هنا، ولا الرأي الأكاديمي، ولا الآراء الأخرى. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.745}"
      en: "Sha'rawi holds that a free man is killed for killing a free man, but the schools' views on a free man killed for a slave are not entered here; neither are the academic view or other views {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.745}."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
  - tradition: sunni
    id: sharawi-brother-of-faith
    stance:
      ar: "أخوة الإيمان فوق أخوة الدم، والعفو يُرفع فيه ذكر الأخوة"
      en: "Brotherhood in faith is above brotherhood of blood, and pardon calls it to mind"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يذكر الشعراوي أن الآية تسمي ولي الدم أخاً للقاتل لترقيق القلوب، وأن أخوة الإيمان فوق أخوة النسب، ويروي قصة مصعب بن عمير وأخيه أبي عزيز في بدر دون سند في النص. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.747}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.748}"
      en: "Sha'rawi says the verse calls the heir of blood a brother to soften hearts, that brotherhood in faith is above brotherhood by descent, and relates the story of Mus'ab ibn Umayr and his brother Abu Aziz at Badr, given without a chain in the text {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.747}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.748}."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
