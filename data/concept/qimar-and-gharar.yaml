tags: [akhlaq-aqd, akhlaq-browser, islamic-economy-browser, islamic-economy-money]
label:
  ar: "القمار والغرر في البورصة"
  en: "Gambling and speculation in exchanges"
  es: "Juegos de azar y especulación en bolsas de valores"
  fr: "Jeux de hasard et spéculation sur les marchés boursiers"
  ur: "تبادلے میں جوا اور قیاس آرائیاں"
  tr: "Kumar ve borsada belirsizlik"
  id: "Perjudian dan ketidakpastian di pasar saham"
summary:
  ar: "يرى المؤلف أن القمار محرم في الأديان، وأن النظام الرأسمالي استباحه عملياً في اليانصيب والمسابقات والبورصات {cite:usul-iqtisad-islami-0660 p. 352}. ويصف عمليات البورصة بأنها مضاربة على الأسعار ومراهنات على عقود آجلة لا تسليم فيها {cite:usul-iqtisad-islami-0660 p. 352}، وأحسن أحوالها أن ما يربحه أحد يخسره آخر {cite:usul-iqtisad-islami-0660 p. 353}."
  tr: "Yazar, kumarın dinlerde yasak olduğuna ve kapitalist sistemin piyangolar, yarışmalar ve borsalarda bunu pratikte izin verdiğine inanıyor {cite:usul-iqtisad-islami-0660 s. 352}. Borsa işlemlerini, fiyat spekülasyonu ve vadeli işlem sözleşmelerine bahis olarak tanımlıyor; burada teslimat yapılmıyor {cite:usul-iqtisad-islami-0660 s. 352} ve en iyi senaryo, bir kişinin kazandığı kazançların diğerinin kaybetmesidir {cite:usul-iqtisad-islami-0660 s. 353}."
  id: "Penulis percaya bahwa perjudian dilarang dalam agama, dan sistem kapitalis secara praktis telah mengizinkannya di lotere, kompetisi, dan bursa saham {cite:usul-iqtisad-islami-0660 hlm. 352}. Ia menggambarkan operasi pasar saham sebagai spekulasi harga dan taruhan pada kontrak berjangka di mana tidak ada pengiriman {cite:usul-iqtisad-islami-0660 hlm. 352}, dan skenario terbaik adalah apa yang didapat satu orang hilang oleh orang lain {cite:usul-iqtisad-islami-0660 hlm. 353}."
