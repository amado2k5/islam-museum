id: "concept/nuzul-al-ma"
class: "concept"
kind: "scientific"
label:
  ar: "نزول الماء في العين"
  en: "The descent of water in the eye (nuzul al-ma')"
  ur: "آنکھ میں پانی کا نزول"
  es: "El descenso del agua en el ojo (nuzul al-ma')"
  fr: "La descente d'eau dans l'œil (nuzul al-ma')"
summary:
  ar: "نزول الماء مرض سدّي: رطوبة غريبة تقف في الثقبة العنبية بين الرطوبة البيضية والصفاق القرني فتمنع نفوذ الأشباح إلى البصر، وتختلف في الكم — فربما سدّت جميع الثقبة فلا ترى العين شيئاً وربما سدّت جهة وخلت جهة — وتختلف في الكيف قواماً ولوناً، وأقبلها للعلاج الهوائي والأبيض اللؤلؤي وما إلى الزرقة قليلاً والفيروزجي، وأما الجصي والأخضر والكدر والشديد السواد والأصفر فلا يقبل القدح {cite:canon-ibn-sina-print-v2 p.213}"
  en: "The descent of water is an occluding disease: a foreign moisture that stands in the uveal aperture between the vitreous humour and the corneal tunic and keeps the images from reaching the sight; it differs in amount — sometimes blocking the whole aperture so the eye sees nothing, sometimes blocking one side — and in quality, in consistency and in colour; the most amenable to treatment are the air-coloured, the pearl-white, the slightly bluish and the turquoise, while the gypsum-white, green, turbid, deep black and yellow do not accept the couching {cite:canon-ibn-sina-print-v2 p.213}"
  ur: "پانی کا نزول ایک سدی مرض ہے: ایک غریب رطوبت جو عنبی ثقبے میں بیضیہ رطوبت اور قرنی صفاق کے درمیان کھڑی ہو کر اشباح کے بصر تک پہنچنے سے روک دیتی ہے؛ یہ مقدار میں مختلف ہوتی ہے — کبھی سارا ثقبہ سد دیتی ہے تو آنکھ کچھ نہیں دیکھتی اور کبھی ایک طرف — اور کیفیت میں قوام اور رنگ سے؛ علاج کے زیادہ قابل ہوا رنگ، مرواریدی سفید، قدرے نیلا اور فیروزجی ہے، جبکہ جبسی، سبز، کدورت والا، نہایت سیاہ اور زرد قدح قبول نہیں کرتے {cite:canon-ibn-sina-print-v2 p.213}"
  es: "La oclusión de la úvea es una enfermedad oclusiva: una humedad extraña que se acumula en la abertura uveal entre el humor vítreo y la túnica corneal e impide que las imágenes lleguen a la visión; varía en cantidad —a veces bloquea toda la abertura, impidiendo que el ojo vea nada, a veces bloquea un lado— y en calidad, consistencia y color; las más susceptibles al tratamiento son las de color aire, blanco perla, ligeramente azuladas y turquesa, mientras que las de color blanco yeso, verde, turbias, negro intenso y amarillas no admiten el tratamiento. {cite:canon-ibn-sina-print-v2 p.213}"
  fr: "La sclérotique est une affection oculaire occlusive: une humidité étrangère se loge dans l’ouverture uvéale, entre l’humeur vitrée et la cornée, et empêche la formation d’images. Son humidité varie en quantité – parfois elle obstrue toute l’ouverture, privant l’œil de toute vision, parfois elle n’en obstrue qu’une partie – ainsi qu’en qualité, en consistance et en couleur. Les sclérotiques les plus sensibles au traitement sont celles de couleur blanc cassé, blanc nacré, légèrement bleuâtres et turquoise, tandis que celles de couleur blanc gypseux, vertes, troubles, noires et jaunes ne répondent pas à l’application d’eau. {cite:canon-ibn-sina-print-v2 p.213}"
