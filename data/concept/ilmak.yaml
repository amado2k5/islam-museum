summary:
  ar: "الإملاك التزويج وعقد النكاح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3396} ووليمة الإملاك هي وليمة العقد، وهي سنة عند الشافعية والحنابلة، والإجابة إليها سنة عند الشافعية، وتتحد مع وليمة الدخول عند الشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3396}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3397}"
  en: "Imlak means marriage and the marriage contract. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3396} The wedding feast of the contract is a sunna for the Shafi'is and Hanbalis, and accepting the invitation to it is a sunna for the Shafi'is; for the Shafi'is one feast is enough, with the feast of consummation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3396}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3397}"
