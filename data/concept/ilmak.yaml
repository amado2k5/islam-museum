label: { ar: "الإملاك", en: "Imlak (marriage contract, and the wedding feast of the contract)", es: "Imlak (contrato matrimonial y el banquete nupcial del contrato)", fr: "Imlak (contrat de mariage et festin de noces du contrat)", ur: "املاک ⁦(شادی کا معاہدہ، اور معاہدے کی شادی کی دعوت)⁩" }
summary:
  ar: "الإملاك التزويج وعقد النكاح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3396} ووليمة الإملاك هي وليمة العقد، وهي سنة عند الشافعية والحنابلة، والإجابة إليها سنة عند الشافعية، وتتحد مع وليمة الدخول عند الشافعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3396}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3397}"
  en: "Imlak means marriage and the marriage contract. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3396} The wedding feast of the contract is a sunna for the Shafi'is and Hanbalis, and accepting the invitation to it is a sunna for the Shafi'is; for the Shafi'is one feast is enough, with the feast of consummation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3396}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3397}"
  es: "Imlak significa matrimonio y contrato matrimonial. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3396} El banquete nupcial del contrato es una sunna para los shafi'íes y hanbalíes, y aceptar la invitación es una sunna para los shafi'íes; para los shafi'íes, un solo banquete es suficiente, junto con el banquete de consumación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3396}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3397}"
  fr: "Imlak désigne le mariage et le contrat de mariage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3396} Le festin de noces conclu lors du contrat est une sunna pour les shafi'ites et les hanbalites, et accepter l'invitation à ce festin est une sunna pour les shafi'ites; pour ces derniers, un seul festin suffit, avec le festin de consommation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3396}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3397}"
  ur: "املاک کا مطلب ہے نکاح اور عقد نکاح۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 3396} عقد نکاح شافعیہ اور حنبلیوں کے لیے سنت ہے اور اس کی دعوت قبول کرنا شافعیوں کے لیے سنت ہے۔ شافعیوں کے لیے ایک ہی عید کافی ہے، عید کی تکمیل کے ساتھ۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3396}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3397}"
