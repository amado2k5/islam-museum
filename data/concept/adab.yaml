label:
  ar: الأدب النبوي
  en: Prophetic adab (proper conduct)
summary:
  ar: "الأدب كلمة يعكس تاريخها، بحسب مقال دائرة المعارف الإسلامية، تطور الثقافة العربية من أصولها قبل الإسلام إلى اليوم؛ فقد كانت في أقدم معانيها قريبة من السنة بمعنى العادة الموروثة، ثم صارت تعني اللطف وحسن التربية، ثم الثقافة الواسعة غير الدينية القائمة على الشعر والخطابة وتراث العرب، ثم اتسعت في العصر العباسي لتشمل تراث الهند وفارس واليونان عند الجاحظ وابن المقفع. وضاق معناها بعد ذلك إلى المعارف الخاصة بمنصب كأدب الكاتب، ثم إلى الأدب الجميل، وصارت في العصر الحديث مرادفة للأدب بمعناه الخاص. ويحفظ السجل كذلك معنى الأدب النبوي عند ابن رجب."
  en: "Adab is a word whose history, according to the Encyclopaedia of Islam article, mirrors the evolution of Arab culture from its pre-Islamic roots to today: in its oldest sense it was close to sunna as inherited custom, then came to mean courtesy and good upbringing, then the broad non-religious culture built on poetry, oratory and Arab tradition, then widened under the Abbasids to include Indian, Iranian and Greek heritage in the work of al-Jahiz and Ibn al-Muqaffa. It later narrowed to the knowledge of an office, such as the adab of the secretary, then to belles-lettres, and in the modern age to literature in the specific sense. The record also keeps the sense of Prophetic adab in Ibn Rajab."
  ur: "ادب ایسا لفظ ہے جس کی تاریخ، دائرۃ المعارف الاسلامیہ کے مقالے کے مطابق، عربی ثقافت کے اسلام سے پہلے کے آغاز سے آج تک کے ارتقا کو ظاہر کرتی ہے؛ قدیم ترین معنی میں یہ سنت کے قریب موروثی عادت تھا، پھر شائستگی اور اچھی تربیت، پھر شاعری، خطابت اور عربی روایت پر مبنی وسیع غیر دینی ثقافت، اور عباسی دور میں الجاحظ اور ابن المقفع کے ہاں ہندی، ایرانی اور یونانی ورثے تک پھیل گیا۔ بعد میں یہ کسی منصب کے علم جیسے ادبِ کاتب تک اور پھر ادبِ لطیف تک محدود ہوا، اور جدید دور میں خاص معنی میں ادبیات کا ہم معنی ہے۔ یہ اندراج ابن رجب کے ہاں نبوی ادب کا مفہوم بھی محفوظ رکھتا ہے۔"
