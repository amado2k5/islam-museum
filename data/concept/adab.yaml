label:
  ar: الأدب النبوي
  en: Prophetic adab (proper conduct)
summary:
  ar: "جملة الآداب التي يؤمر بها المؤمن في أقواله وأفعاله وعلاقته بالله وبعباده؛ يستنبط ابن رجب من صيغة «من كان يؤمن بالله واليوم الآخر» في حديث أبي هريرة أن هذه الخصال من خصال الإيمان وأن الأعمال تدخل في الإيمان، ويقسم أوامر الحديث الثلاثة إلى ما يتعلق بحقوق الله — قول الخير والصمت عما سواه — وما يتعلق بحقوق العباد — إكرام الجار والكف عن أذاه وإكرام الضيف — وينقل عن أسود بن أصرم وصية النبي «لا تقل بلسانك إلا معروفاً ولا تبسط يدك إلا إلى خير»، وأن استقامة اللسان من خصال الإيمان؛ وقد حكى أبو عمرو بن الصلاح عن أبي محمد بن أبي زيد إمام المالكية في زمانه أن جماع آداب الخير وأزمته تتفرع من أربعة أحاديث: قول الخير أو الصمت، وترك ما لا يعني، و«لا تغضب»، والحب للأخ ما يحب لنفسه."
  en: "The body of proper conduct the believer is commanded in his words, deeds and relations with God and His servants; from the formula 'whoever believes in God and the Last Day' in Abu Hurayra's hadith Ibn Rajab derives that these traits are of the traits of iman and that deeds enter into iman, dividing the hadith's three commands into what belongs to God's rights — speaking good or keeping silent — and what belongs to His servants' rights — honouring the neighbour, withholding harm from him and honouring the guest; he transmits Aswad ibn Asram's report of the Prophet's counsel 'do not say with your tongue except what is good and do not extend your hand except to good', and that the tongue's uprightness is of the traits of iman; Abu Amr ibn al-Salah reports from Abu Muhammad ibn Abi Zayd, the Maliki imam of his time, that the conduct of goodness and all its reins branch from four hadiths: speaking good or keeping silent, leaving what does not concern one, 'do not become angry', and loving for one's brother what one loves for oneself."
