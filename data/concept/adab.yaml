id: concept/adab
class: concept
kind: ethical
tags: [akhlaq-browser, akhlaq-akhlaq]
label:
  ar: الأدب النبوي
  en: Prophetic adab (proper conduct)
  fr: "Adab prophétique (bonne conduite)"
  es: "Adab profético (conducta apropiada)"
  ur: "نبوی ادب ⁦(صحیح اخلاق)⁩"
  tr: "Peygamberlik Edebiyatı"
  id: "Sastra Ramalan"
summary:
  ar: "الأدب كلمة يعكس تاريخها، بحسب مقال دائرة المعارف الإسلامية، تطور الثقافة العربية من أصولها قبل الإسلام إلى اليوم؛ فقد كانت في أقدم معانيها قريبة من السنة بمعنى العادة الموروثة، ثم صارت تعني اللطف وحسن التربية، ثم الثقافة الواسعة غير الدينية القائمة على الشعر والخطابة وتراث العرب، ثم اتسعت في العصر العباسي لتشمل تراث الهند وفارس واليونان عند الجاحظ وابن المقفع. وضاق معناها بعد ذلك إلى المعارف الخاصة بمنصب كأدب الكاتب، ثم إلى الأدب الجميل، وصارت في العصر الحديث مرادفة للأدب بمعناه الخاص. ويحفظ السجل كذلك معنى الأدب النبوي عند ابن رجب."
  en: "Adab is a word whose history, according to the Encyclopaedia of Islam article, mirrors the evolution of Arab culture from its pre-Islamic roots to today: in its oldest sense it was close to sunna as inherited custom, then came to mean courtesy and good upbringing, then the broad non-religious culture built on poetry, oratory and Arab tradition, then widened under the Abbasids to include Indian, Iranian and Greek heritage in the work of al-Jahiz and Ibn al-Muqaffa. It later narrowed to the knowledge of an office, such as the adab of the secretary, then to belles-lettres, and in the modern age to literature in the specific sense. The record also keeps the sense of Prophetic adab in Ibn Rajab."
  fr: "L'adab est un mot dont l'histoire, selon l'article de l'Encyclopédie de l'islam, reflète l'évolution de la culture arabe depuis ses racines préislamiques jusqu'à aujourd'hui : dans son sens le plus ancien, il était proche de la sunna comme coutume héritée, puis en vint à désigner la courtoisie et la bonne éducation, ensuite la vaste culture non religieuse fondée sur la poésie, l'art oratoire et la tradition arabe, puis s'élargit sous les Abbassides aux héritages indien, iranien et grec dans les œuvres d'al-Jahiz et d'Ibn al-Muqaffa. Son sens se réduisit ensuite au savoir propre à une fonction, comme l'adab du secrétaire, puis aux belles-lettres et, à l'époque moderne, à la littérature au sens spécifique. La notice conserve aussi le sens d'adab prophétique chez Ibn Rajab."
  ur: "ادب ایسا لفظ ہے جس کی تاریخ، دائرۃ المعارف الاسلامیہ کے مقالے کے مطابق، عربی ثقافت کے اسلام سے پہلے کے آغاز سے آج تک کے ارتقا کو ظاہر کرتی ہے؛ قدیم ترین معنی میں یہ سنت کے قریب موروثی عادت تھا، پھر شائستگی اور اچھی تربیت، پھر شاعری، خطابت اور عربی روایت پر مبنی وسیع غیر دینی ثقافت، اور عباسی دور میں الجاحظ اور ابن المقفع کے ہاں ہندی، ایرانی اور یونانی ورثے تک پھیل گیا۔ بعد میں یہ کسی منصب کے علم جیسے ادبِ کاتب تک اور پھر ادبِ لطیف تک محدود ہوا، اور جدید دور میں خاص معنی میں ادبیات کا ہم معنی ہے۔ یہ اندراج ابن رجب کے ہاں نبوی ادب کا مفہوم بھی محفوظ رکھتا ہے۔"
  es: "Adab es una palabra cuya historia, según el artículo de la Enciclopedia del Islam, refleja la evolución de la cultura árabe desde sus raíces preislámicas hasta la actualidad: en su sentido más antiguo, se aproximaba a la sunna como costumbre heredada; luego pasó a significar cortesía y buena educación; posteriormente, la cultura no religiosa en su sentido más amplio, basada en la poesía, la oratoria y la tradición árabe; y, bajo el dominio de los abasíes, se amplió para incluir la herencia india, iraní y griega en la obra de al-Jahiz e Ibn al-Muqaffa. Más tarde, se redujo al conocimiento propio de un cargo, como el adab del secretario; luego, a las bellas letras; y, en la época moderna, a la literatura en su sentido específico. El registro también conserva el significado de adab profético en Ibn Rajab."
  tr: "Edebiyat, İslam Ansiklopedisi makalesine göre, Arap kültürünün İslam öncesi kökenlerinden günümüze kadar olan gelişimini yansıtan bir kelimedir; en eski anlamlarında Sünne'ye yakındı; sonra kalıtsal gelenek anlamına gelir, sonra iyilik ve iyi yetiştirilme anlamına gelir, ardından şiir, hitabet ve Arap mirasına dayalı geniş dinsiz kültüre ve Abbasi döneminde Hindistan, İran ve Yunanistan'ın mirasını kapsayacak şekilde genişler. Anlamı daha sonra yazarın edebiyatının konumuna özgü bilgiye, sonra güzel edebiyata daralmış ve modern çağda kendi özel anlamında edebiyatla eşanlamlı hale gelmiştir. Kayıtlar ayrıca İbn Receb'e göre peygamberlik edebiyatının anlamını da korumaktadır."
  id: "Sastra adalah kata yang menurut artikel Ensiklopedia Islam mencerminkan perkembangan budaya Arab dari asal-usulnya sebelum Islam hingga saat ini; dalam arti awalnya, kata ini dekat dengan Sunnah, yang berarti adat yang diwariskan, kemudian berarti kebaikan dan didikan yang baik, kemudian ke budaya non-agama yang luas yang didasarkan pada puisi, pidato, dan warisan Arab, kemudian berkembang selama era Abbasiyah untuk mencakup warisan India, Persia, dan Yunani menurut Al-Jahiz dan Ibn al-Muqaffa. Maknanya kemudian menyempit pada pengetahuan khusus yang berkaitan dengan posisi sastra penulis, kemudian pada sastra indah, dan pada era modern menjadi sinonim dengan sastra dalam arti khususnya sendiri. Catatan ini juga mempertahankan makna sastra nubuat menurut Ibn Rajab."
