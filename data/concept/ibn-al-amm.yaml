label: { ar: "ابن العم", en: "Paternal uncle's son (paternal cousin)" }
summary:
  ar: "تعرّف الموسوعة الفقهية الكويتية ابن العم لغةً بأنه الذكر من أولاد أخي الأب في النسب أو الرضاع، وعند الإطلاق ينصرف إلى النسبي، وهو شقيق أو لأب أو لأم. وابن العم الشقيق أو لأب عاصب بنفسه، يأخذ جميع المال إذا انفرد ولم يكن عاصب أولى منه، والباقي بعد أصحاب الفروض، باتفاق. أما ابن العم لأم فمن ذوي الأرحام، يرث غالباً بهذه الصفة، على اختلاف بين المتقدمين والمتأخرين في كيفية توريثه. وللعاصب منه ولاية تزويج أولاد عمه إذا لم يوجد من هو أولى، وحق استيفاء القصاص إن كان وارثاً، باتفاق، وحضانة ابن عمه الذكر إذا لم يوجد من يستحقها من النساء أو من هو أولى من الرجال. والمالكية يثبتون هذه الحقوق لابن العم لأم، ويقدمونه على الذي للأب في بعضها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1464} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1465}"
  en: "The Kuwaiti encyclopedia defines a paternal uncle's son, linguistically, as the male child of a paternal brother, by blood or by fostering; without qualification the word means the blood cousin, full, paternal or maternal. The full or paternal cousin is an agnate in his own right: he takes the whole estate when alone and no closer agnate exists, and otherwise the remainder after the fixed shares, by agreement. The maternal cousin is among those with blood-ties through a female, and generally inherits in that capacity, though earlier and later jurists differ on how he inherits. The agnatic cousin has the right to contract the marriage of his cousins when no closer guardian exists, and by agreement he may take retaliation for homicide if he is an heir; he has the custody of a male cousin when no woman or closer man is entitled to it. The Malikis give these rights also to the maternal cousin, and in some of them put him before the paternal one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1464} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1465}"
