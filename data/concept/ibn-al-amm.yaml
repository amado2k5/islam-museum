label: { ar: "ابن العم", en: "Paternal uncle's son (paternal cousin)", es: "Hijo del tío paterno (primo paterno)", fr: "Le fils de l'oncle paternel (cousin paternel)", ur: "پھوپھی کا بیٹا ⁦( پھوپھی زاد بھائی )⁩", tr: "Kuzen", id: "Sepupu" }
summary:
  ar: "تعرّف الموسوعة الفقهية الكويتية ابن العم لغةً بأنه الذكر من أولاد أخي الأب في النسب أو الرضاع، وعند الإطلاق ينصرف إلى النسبي، وهو شقيق أو لأب أو لأم. وابن العم الشقيق أو لأب عاصب بنفسه، يأخذ جميع المال إذا انفرد ولم يكن عاصب أولى منه، والباقي بعد أصحاب الفروض، باتفاق. أما ابن العم لأم فمن ذوي الأرحام، يرث غالباً بهذه الصفة، على اختلاف بين المتقدمين والمتأخرين في كيفية توريثه. وللعاصب منه ولاية تزويج أولاد عمه إذا لم يوجد من هو أولى، وحق استيفاء القصاص إن كان وارثاً، باتفاق، وحضانة ابن عمه الذكر إذا لم يوجد من يستحقها من النساء أو من هو أولى من الرجال. والمالكية يثبتون هذه الحقوق لابن العم لأم، ويقدمونه على الذي للأب في بعضها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1464} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1465}"
  en: "The Kuwaiti encyclopedia defines a paternal uncle's son, linguistically, as the male child of a paternal brother, by blood or by fostering; without qualification the word means the blood cousin, full, paternal or maternal. The full or paternal cousin is an agnate in his own right: he takes the whole estate when alone and no closer agnate exists, and otherwise the remainder after the fixed shares, by agreement. The maternal cousin is among those with blood-ties through a female, and generally inherits in that capacity, though earlier and later jurists differ on how he inherits. The agnatic cousin has the right to contract the marriage of his cousins when no closer guardian exists, and by agreement he may take retaliation for homicide if he is an heir; he has the custody of a male cousin when no woman or closer man is entitled to it. The Malikis give these rights also to the maternal cousin, and in some of them put him before the paternal one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1464} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1465}"
  es: "La enciclopedia kuwaití define al hijo de un tío paterno, lingüísticamente, como el hijo varón de un hermano paterno, ya sea por consanguinidad o por crianza; sin ninguna especificación, la palabra significa primo de sangre, completo, paterno o materno. El primo completo o paterno es un agnado por derecho propio: hereda la totalidad de la herencia cuando está solo y no existe un agnado más cercano, y en caso contrario, el remanente después de las partes fijas, por acuerdo. El primo materno se encuentra entre aquellos con lazos de sangre a través de una mujer, y generalmente hereda en esa calidad, aunque los juristas antiguos y posteriores difieren en cuanto a cómo hereda. El primo agnado tiene derecho a concertar el matrimonio de sus primos cuando no existe un tutor más cercano, y por acuerdo puede tomar represalias por homicidio si es heredero; tiene la custodia de un primo varón cuando ninguna mujer u hombre más cercano tiene derecho a ella. Los malikíes también otorgan estos derechos al primo materno, y en algunos casos lo colocan por encima del paterno. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1464} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.1465}"
  fr: "L'encyclopédie koweïtienne définit le fils de l'oncle paternel, linguistiquement parlant, comme l'enfant mâle d'un frère paternel, par le sang ou par adoption; sans autre précision, le terme désigne le cousin germain, qu'il soit paternel ou maternel. Le cousin germain ou paternel est un agnat de plein droit: il hérite de la totalité du patrimoine s'il est le seul et qu'aucun agnat plus proche n'existe, et sinon du reliquat après répartition des parts convenues. Le cousin maternel fait partie de ceux qui ont des liens de sang par une femme et hérite généralement à ce titre, bien que les juristes anciens et modernes divergent quant à son régime successoral. Le cousin agnat a le droit de marier ses cousins en l'absence de tuteur plus proche et, par convention, il peut exercer des représailles en cas d'homicide s'il est héritier; il a la garde d'un cousin mâle lorsqu'aucune femme ni aucun homme plus proche n'y a droit. Les Malikites accordent également ces droits au cousin maternel et, dans certains cas, le placent avant le cousin paternel. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1464} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1465}"
  ur: "کویتی انسائیکلوپیڈیا میں پھوپھی کے چچا کے بیٹے کی تعریف لسانی طور پر، پھوپھی کے بھائی کا لڑکا بچہ، خون کے ذریعے یا پرورش کے ذریعے کی گئی ہے۔ اہلیت کے بغیر اس لفظ کا مطلب خون کا کزن، مکمل، پھوپھی یا زچگی ہے۔ مکمل یا پھوپھی کزن اپنے طور پر ایک اجنبی ہے: وہ پوری جائیداد لے لیتا ہے جب اکیلے اور کوئی قریبی اجناس موجود نہ ہو، اور بصورت دیگر مقررہ حصص کے بعد باقی ماندہ، معاہدے کے ذریعے۔ ماموں کا کزن ان لوگوں میں ہوتا ہے جن کے خون کے رشتے عورت سے ہوتے ہیں، اور عام طور پر اس حیثیت میں وراثت پاتے ہیں، حالانکہ پہلے اور بعد کے فقہاء اس کے بارے میں اختلاف رکھتے ہیں کہ وہ کس طرح وراثت میں ملتا ہے۔ اجنبی کزن کو اپنے کزن کی شادی کا حق حاصل ہے جب کوئی قریبی سرپرست موجود نہ ہو، اور معاہدے کے ذریعے وہ قتل کا بدلہ لے سکتا ہے اگر وہ وارث ہو؛ اس کے پاس مرد کزن کی تحویل ہے جب کہ کوئی عورت یا قریبی مرد اس کا حقدار نہیں ہے۔ مالکی یہ حقوق خالہ زاد کو بھی دیتے ہیں اور بعض میں اسے پھوپھی کے سامنے رکھ دیتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1464}"
  tr: "Kuveyt Hukuk Ansiklopedisi, kuzeni dilbilimsel olarak baba yeğeninin soy veya emzirme yoluyla çocuklarından erkek olarak tanımlar; boşanma durumunda ise kardeş, baba veya anne olan akrabayı ifade eder. Tam kuzen veya doğrudan akraba olan baba, yalnız kalırsa ve kimse ondan daha fazla miras hakkı sahibi değildirse tüm mülkü alır ve geri kalanı sabit paylar için anlaşma yoluyla yapılır. Anne tarafından kuzene gelince, akrabadır ve genellikle bu sıfatla miras alır; önceki ve sonraki nesiller arasında miras konusunda farklılıklar vardır. Miras alan kişi, kuzenlerini evlendirme yetkisine sahiptir, eğer kimse ona daha fazla hak kazandırmazsa kuzenlerini evlendirme, varis ise anlaşma yoluyla intikam alma hakkına ve kadın veya erkekler arasında hak sahibi kimse yoksa erkek kuzenin velayetine sahiptir. Malikiler, bu hakları anne tarafından kuzene verir ve bazı durumlarda babanın sahip olduğu haklardan üstün tutar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1464} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1465}"
  id: "Ensiklopedia Yurisprudensi Kuwait secara linguistik mendefinisikan sepupu sebagai laki-laki dari anak keponakan ayah dalam garis keturunan atau menyusui, dan dalam kasus perceraian, merujuk pada kerabat yang merupakan saudara, ayah, atau ibu. Sepupu kandung atau ayah yang merupakan kerabat langsung menerima semua harta jika ia sendirian dan tidak ada yang lebih berhak atas warisan selain dirinya, dan sisanya berdasarkan saham tetap, berdasarkan kesepakatan. Adapun sepupu dari pihak ibu, ia adalah kerabat dan biasanya mewarisi dalam kapasitas ini, dengan perbedaan antara generasi awal dan berikutnya terkait warisannya. Orang yang mewarisi darinya memiliki wewenang untuk menikahkan sepupunya jika tidak ada yang lebih berhak atas dirinya, hak menerima pembalasan jika ia adalah ahli waris, berdasarkan kesepakatan, dan hak asuh sepupu laki-laki jika tidak ada yang berhak atas hak atas hak tersebut di antara perempuan atau laki-laki yang berhak. Keluarga Malik menegaskan hak-hak ini bagi sepupu dari pihak ibu dan memberinya prioritas atas apa yang dimiliki ayah dalam beberapa kasus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1464} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1465}"
