id: concept/zij-sabi-aspect-names-by-sign-distance
class: concept
kind: scientific
label: { ar: "أسماء الاتصالات بحسب بُعد البروج", en: "The names of the aspects by the distance between signs", ur: "بُروج کے فاصلے سے اتصالات کے نام", es: "Los nombres de los aspectos por la distancia entre signos", fr: "Les noms des aspects selon la distance entre les signes", tr: "Zodyak mesafelerine göre bağlantıların isimleri", id: "Nama-nama hubungan berdasarkan jarak zodiak." }
summary:
  ar: "تُقسم دائرة البروج إلى اثني عشر برجاً، والأقدار المستعملة في الاتصالات أربعة أشكال سوى المقارنة. فالمقابلة من ستة بروج وتحيط بزاويتين قائمتين ومائة وثمانين درجة، ويُسمى سببها الأقوى. وشكل التربيع نصف المقابلة، ويحيط بثلاثة بروج وبزاوية قائمة وتسعين جزءاً. والتثليث يحيط بأربعة بروج وبزاوية قائمة وثلث زاوية ومائة وعشرين درجة. والتسديس نصف التثليث، ويحيط ببرجين وبثلثي زاوية قائمة وستين درجة. {cite:zij-sabi-nallino-byblion pp.198}"
  en: "The zodiac is divided into twelve signs, and the measures used for aspects are four forms besides conjunction. Opposition spans six signs and two right angles, a hundred and eighty degrees, and it is named the strongest cause. The square is half of the opposition, spanning three signs and a right angle, ninety degrees. The trine spans four signs and a right angle and a third of an angle, a hundred and twenty degrees. The sextile is half of the trine, spanning two signs and two-thirds of a right angle, sixty degrees. {cite:zij-sabi-nallino-byblion p.198}"
  ur: "دائرۂ البروج کو بارہ بروج میں تقسیم کیا جاتا ہے، اور اتصالات کے لیے مقدار کی چار شکلیں ہیں، مقارنہ کے علاوہ۔ مقابلہ چھ بروج پر ہے اور دو قائمہ زاویوں یعنی ایک سو اسی درجے کے برابر، اور اسے سب سے قوی سبب کہا گیا ہے۔ تربیع مقابلے کا نصف ہے، تین بروج اور ایک قائمہ زاویہ یعنی نوے درجے پر۔ تثلیث چار بروج اور ایک قائمہ زاویہ اور اس کے ایک تہائی یعنی ایک سو بیس درجے پر ہے۔ تسدیس تثلیث کا نصف ہے، دو بروج اور دو تہائی قائمہ زاویہ یعنی ساٹھ درجے پر۔ {cite:zij-sabi-nallino-byblion p.198}"
  es: "El zodíaco se divide en doce signos, y las medidas utilizadas para los aspectos son cuatro formas además de la conjunción. La oposición abarca seis signos y dos ángulos rectos, ciento ochenta grados, y se considera la causa más fuerte. La cuadratura es la mitad de la oposición, abarcando tres signos y un ángulo recto, noventa grados. El trígono abarca cuatro signos, un ángulo recto y un tercio de ángulo, ciento veinte grados. El sextil es la mitad del trígono, abarcando dos signos y dos tercios de ángulo recto, sesenta grados. {cite:zij-sabi-nallino-byblion p.198}"
  fr: "Le zodiaque est divisé en douze signes, et les mesures utilisées pour les aspects sont de quatre formes, outre la conjonction. L'opposition s'étend sur six signes et deux angles droits, soit 180 degrés, et elle est considérée comme la cause la plus forte. Le carré est la moitié de l'opposition, s'étendant sur trois signes et un angle droit, soit 90 degrés. Le trigone s'étend sur quatre signes et un angle droit et un tiers d'angle, soit 120 degrés. Le sextile est la moitié du trigone, s'étendant sur deux signes et deux tiers d'angle droit, soit 60 degrés. {cite:zij-sabi-nallino-byblion p.198}"
  tr: "Zodyak on iki takımyıldıza bölünmüştür ve astrolojide kullanılan büyüklükler, karşıtlık dışında dört biçimdedir. Karşıtlık altı takımyıldızdan oluşur ve iki dik açı ve 180 dereceyi kapsar; nedeni en güçlü olarak adlandırılır. Kare, karşıtlığın yarısıdır ve üç takımyıldızı, bir dik açıyı ve 90 dereceyi kapsar. Üçgen, dört takımyıldızı, bir dik açıyı, açının üçte birini ve 120 dereceyi kapsar. Sekstil, üçgenin yarısıdır ve iki takımyıldızı, dik açının üçte ikisini ve 60 dereceyi kapsar. {cite:zij-sabi-nallino-byblion pp.198}"
  id: "Zodiak terbagi menjadi dua belas rasi bintang, dan besaran yang digunakan dalam astrologi ada empat bentuk selain oposisi. Oposisi terdiri dari enam rasi bintang dan mencakup dua sudut siku-siku dan 180 derajat; penyebabnya disebut yang terkuat. Kuadrat adalah setengah dari oposisi dan mencakup tiga rasi bintang dan satu sudut siku-siku dan 90 derajat. Trine mencakup empat rasi bintang dan satu sudut siku-siku dan sepertiga sudut dan 120 derajat. Sextile adalah setengah dari trine dan mencakup dua rasi bintang dan dua pertiga sudut siku-siku dan 60 derajat. {cite:zij-sabi-nallino-byblion pp.198}"
