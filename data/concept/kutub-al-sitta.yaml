id: concept/kutub-al-sitta
education:
  did_you_know:
    ar: "الكتب الستة في اصطلاح المتأخرين: صحيحا البخاري ومسلم وسنن أبي داود والترمذي والنسائي وابن ماجه، جمهور مصنفات الحديث المسندة."
    en: "The Six Books of later usage — Bukhari, Muslim, Abu Dawud, Tirmidhi, Nasa'i and Ibn Majah — are the chief musnad collections of hadith."
