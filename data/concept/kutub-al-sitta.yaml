    sources: [source/sahih-al-bukhari, source/sahih-muslim]
class: concept
kind: term
label: { ar: "الكتب الستة", en: "The Six Books", es: "Los seis libros", fr: "Les Six Livres", ur: "چھ کتابیں۔", tr: "Altı Kitap", id: "Enam Buku" }
summary:
  ar: "الكتب الستة في اصطلاح المتأخرين: صحيح البخاري وصحيح مسلم وسنن أبي داود وجامع الترمذي وسنن النسائي وسنن ابن ماجه — جمهور مصنفات الحديث المسندة المرتبة على الأبواب أو بذكر الدرجة، وقد صارت مرجع الأمة الأوسع في الحديث النبوي منذ القرن الخامس الهجري؛ ويضم بعضهم إلى العدد الموطأ أو مسند أحمد بدل سنن ابن ماجه."
  en: "The 'six books' of later convention: Sahih al-Bukhari, Sahih Muslim, Sunan Abi Dawud, Jami' al-Tirmidhi, Sunan al-Nasa'i and Sunan Ibn Majah — the principal chapter-arranged hadith collections that became the community's widest hadith reference from the fifth century; some lists substitute the Muwatta or the Musnad of Ahmad for Ibn Majah."
  es: "Los \"seis libros\" de la convención posterior: Sahih al-Bukhari, Sahih Muslim, Sunan Abi Dawud, Jami' al-Tirmidhi, Sunan al-Nasa'i y Sunan Ibn Majah — las principales colecciones de hadices organizadas por capítulos que se convirtieron en la referencia de hadices más amplia de la comunidad a partir del siglo V; algunas listas sustituyen el Muwatta o el Musnad de Ahmad por Ibn Majah."
  fr: "Les « six livres » de la convention ultérieure: Sahih al-Bukhari, Sahih Muslim, Sunan Abi Dawud, Jami' al-Tirmidhi, Sunan al-Nasa'i et Sunan Ibn Majah — les principaux recueils de hadiths organisés en chapitres qui sont devenus la référence la plus large de la communauté en matière de hadiths à partir du Ve siècle; certaines listes substituent le Muwatta ou le Musnad d'Ahmad à Ibn Majah."
  ur: "بعد کے کنونشن کی 'چھ کتابیں': صحیح البخاری، صحیح مسلم، سنن ابی داؤد، جامع الترمذی، سنن النسائی اور سنن ابن ماجہ - بنیادی باب کے زیر اہتمام احادیث کے مجموعے جو کہ پانچویں صدی سے کمیونٹی کا وسیع ترین حدیث کا حوالہ بن گئے۔ کچھ فہرستیں ابن ماجہ کے لیے موطا یا مسند احمد کی جگہ لے لیتی ہیں۔"
  tr: "Daha sonraki alimlerin terminolojisiyle altı kitap: Sahih al-Buhari, Sahih Muslim, Sunan Ebi Davud, Cami'l-Tirmidi, Sünan el-Nasa'i ve Sunan Ibn Majah — müsnedi bölümlere veya derecelere göre düzenlenmiş olan hadislerin çoğu, beşinci yüzyıldan beri Peygamber hadislerinde ümmet için en geniş referans haline gelmiştir; bazıları Sünan İbn Majah yerine Muwatta sayısını veya Musnad Ahmad'ı içerir."
  id: "Enam kitab dalam terminologi ulama berikutnya: Sahih al-Bukhari, Sahih Muslim, Sunan Abi Dawood, Jami' al-Tirmidhi, Sunan al-Nasa'i, dan Sunan Ibn Majah — sebagian besar karya hadits dengan musnad yang diatur berdasarkan bab atau tingkatan, yang telah menjadi referensi terluas untuk Ummah dalam hadis Nabi sejak abad kelima H; beberapa menyertakan angka Muwatta atau Musnad Ahmad menggantikan Sunan Ibn Majah."
