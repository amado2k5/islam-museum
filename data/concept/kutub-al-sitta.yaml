summary:
  ar: "الكتب الستة في اصطلاح المتأخرين: صحيح البخاري وصحيح مسلم وسنن أبي داود وجامع الترمذي وسنن النسائي وسنن ابن ماجه — جمهور مصنفات الحديث المسندة المرتبة على الأبواب أو بذكر الدرجة، وقد صارت مرجع الأمة الأوسع في الحديث النبوي منذ القرن الخامس الهجري؛ ويضم بعضهم إلى العدد الموطأ أو مسند أحمد بدل سنن ابن ماجه."
  en: "The 'six books' of later convention: Sahih al-Bukhari, Sahih Muslim, Sunan Abi Dawud, Jami' al-Tirmidhi, Sunan al-Nasa'i and Sunan Ibn Majah — the principal chapter-arranged hadith collections that became the community's widest hadith reference from the fifth century; some lists substitute the Muwatta or the Musnad of Ahmad for Ibn Majah."
