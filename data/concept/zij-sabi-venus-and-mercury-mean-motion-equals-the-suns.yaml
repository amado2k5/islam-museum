id: concept/zij-sabi-venus-and-mercury-mean-motion-equals-the-suns
class: concept
kind: scientific
label: { ar: "الحركة الوسطى للزهرة وعطارد مثل حركة الشمس", en: "The mean motion of Venus and Mercury equals the Sun's", ur: "زہرہ اور عطارد کی اوسط حرکت سورج کی حرکت کے برابر", es: "El movimiento medio de Venus y Mercurio es igual al del Sol.", fr: "Le mouvement moyen de Vénus et de Mercure est égal à celui du Soleil.", tr: "Venüs ve Merkür'ün ortadaki hareketi, güneşin hareketine benzer.", id: "Gerakan tengah Venus dan Merkurius mirip dengan gerakan matahari." }
summary:
  ar: "يقرر البتاني أن سير الزهرة وعطارد الأوسط مثل سير الشمس الأوسط، فتُستخرج حركتهما من الجداول بما يبقى من سير الشمس بعد تمام الحركة الوسطى في الطول، ويزيد خاصة الزهرة وعطارد على الجداول المسطورة في كتاب بطليموس بقدر يسير. {cite:zij-sabi-nallino-byblion p.99}."
  en: "Al-Battani holds that the mean motion of Venus and Mercury is the same as the Sun's mean motion; their motion is taken from what remains of the Sun's motion after the planet's mean longitude is completed. The apogee of each is slightly above what Ptolemy's book gives. {cite:zij-sabi-nallino-byblion p.99}."
  ur: "البتانی کے نزدیک زہرہ اور عطارد کی اوسط حرکت سورج کی اوسط حرکت کے برابر ہے؛ ان کی حرکت سورج کی حرکت کے اس حصے سے لی جاتی ہے جو سیارے کے اوسط طول کی تکمیل کے بعد بچتا ہے۔ ہر ایک کا بُعد بطلیموس کی کتاب کی مقررہ قدر سے کچھ زیادہ ہے۔ {cite:zij-sabi-nallino-byblion p.99}۔"
  es: "Al-Battani sostiene que el movimiento medio de Venus y Mercurio es el mismo que el del Sol; su movimiento se obtiene a partir de lo que queda del movimiento solar una vez completada la longitud media del planeta. El apogeo de cada uno se sitúa ligeramente por encima del valor que indica el libro de Ptolomeo. {cite:zij-sabi-nallino-byblion p.99}."
  fr: "Al-Battani soutient que le mouvement moyen de Vénus et de Mercure est identique à celui du Soleil; leur mouvement est calculé à partir de la partie restante du mouvement solaire une fois la longitude moyenne de la planète atteinte. L'apogée de chacune est légèrement supérieure à celle indiquée dans l'ouvrage de Ptolémée. {cite:zij-sabi-nallino-byblion p.99}."
  tr: "El-Battani, Venüs ve Merkür'ün meridyen hareketinin Güneş'in meridyen hareketine benzediğini ve hareketlerinin, Güneş'in meridyen hareketinin uzunluk olarak tamamlanmasından sonra kalan kısmından elde edilen tablolardan türetildiğini belirtir. Ayrıca, Batlamyus'un kitabında yazılan tablolara kıyasla Venüs ve Merkür'ün hareketlerinde küçük bir fark olduğunu da ekler. {cite:zij-sabi-nallino-byblion s.99}"
  id: "Al-Battani menyatakan bahwa gerakan meridian Venus dan Merkurius mirip dengan gerakan meridian Matahari, dan pergerakan mereka diperoleh dari tabel berdasarkan sisa pergerakan Matahari setelah menyelesaikan gerakan meridian dalam hal panjangnya. Ia menambahkan sedikit perbedaan pada pergerakan Venus dan Merkurius dibandingkan dengan tabel yang tertulis dalam buku Ptolemy. {cite:zij-sabi-nallino-byblion p.99}."
