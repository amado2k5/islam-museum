id: concept/al-mulk-wal-tamalluk
class: concept
kind: ethical
label:
  ar: "الملك والتملّك"
  en: "God's sovereignty and human ownership (al-mulk wal-tamalluk)"
  ur: "اللہ کا ملک اور انسانی تملّک"
summary:
  ar: "توحيد الملك في دروس الشيخ عمر عبد الكافي: الملك كله لله، وما بيد الناس من مال وسلطان وصحة أمانة عندهم أو عارية، ويرى أن الإنسان يملك نفسه بإرادته، وأن الرزق مقدّر فيسعى الإنسان مع الإيمان بأنه من الله."
  en: "Sheikh Omar Abdelkafy's teaching on the oneness of sovereignty: all sovereignty belongs to God, and what people hold of wealth, authority and health is a trust or a loan in their hands. He holds that a person owns himself through his will, and that provision is decreed, so one strives while believing it comes from God."
  ur: "شیخ عمر عبد الکافی کی توحیدِ ملک پر تعلیم: تمام اقتدار اللہ کا ہے، اور لوگوں کے پاس مال، اختیار اور صحت ان کے پاس امانت یا عاریت ہے۔ ان کی رائے ہے کہ انسان اپنے ارادے سے اپنا مالک ہے، اور رزق مقدّر ہے، اس لیے آدمی کوشش کرے اور یقین رکھے کہ رزق اللہ کی طرف سے ہے۔"
