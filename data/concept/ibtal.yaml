label: { ar: "الإبطال", en: "Invalidation (ibtal) of acts and contracts", es: "Invalidez (ibtal) de actos y contratos", fr: "Invalidation (ibtal) des actes et contrats", ur: "اعمال اور معاہدوں کا باطل ہونا", tr: "iptal", id: "pembatalan" }
summary:
  ar: "تعرّف الموسوعة الفقهية الكويتية الإبطال لغةً بأنه إفساد الشيء وإزالته حقاً كان أو باطلاً، واصطلاحاً الحكم على الشيء بالبطلان، سواء صح ثم طرأ عليه سبب البطلان، أو وُجد وجوداً حسياً لا شرعياً. وتفرّقه عن الفسخ والإفساد والإسقاط، وتبين أن جمهور الفقهاء على أنه لا يصح إبطال العبادة بعد الفراغ منها، ويحرم إبطال الفرض بعد الشروع دون عذر، وتعرض خلاف الفقهاء في النفل والحج والعمرة والجهاد، وأن التصرفات اللازمة لا تُبطل بعد نفاذها إلا برضا العاقدين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1452} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1453}"
  en: "The Kuwaiti encyclopedia defines ibtal linguistically as the spoiling and removal of a thing, whether it is right or wrong. As a technical term it is a judgment that a thing is void, whether it was valid and a cause of voidness afterwards arose, or whether it existed in sense but not in law. It distinguishes ibtal from fasakh (dissolution), ifsad (corruption) and isqat (dropping). It records that the majority of jurists hold that a worship cannot be voided after it is completed, and that voiding an obligatory act once begun, without excuse, is forbidden; it sets out the schools' differences on voluntary prayer, the pilgrimage, the lesser pilgrimage and holy war; and that binding acts cannot be voided once they take effect except with the consent of both parties. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1452} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1453}"
  es: "La enciclopedia kuwaití define lingüísticamente ibtal como la destrucción y eliminación de algo, sea correcto o incorrecto. Como término técnico, es un juicio que declara nulo algo, ya sea que fuera válido y posteriormente surgiera una causa de nulidad, o que existiera en sentido pero no en derecho. Distingue ibtal de fasakh (disolución), ifsad (corrupción) e isqat (desechamiento). Deja constancia de que la mayoría de los juristas sostienen que un acto de culto no puede anularse una vez completado, y que anular un acto obligatorio una vez iniciado, sin justificación, está prohibido; expone las diferencias entre las escuelas respecto a la oración voluntaria, la peregrinación, la peregrinación menor y la guerra santa; y que los actos vinculantes no pueden anularse una vez que entran en vigor, salvo con el consentimiento de ambas partes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1452} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1453}"
  fr: "L'encyclopédie koweïtienne définit l'ibtal, linguistiquement, comme la destruction et la suppression d'une chose, qu'elle soit juste ou injuste. Techniquement, il s'agit d'un jugement déclarant une chose nulle, qu'elle ait été valide et qu'une cause de nullité soit apparue ultérieurement, ou qu'elle ait existé en sens mais non en droit. Elle distingue l'ibtal du fasakh (dissolution), de l'ifsad (corruption) et de l'isqat (abandon). Elle indique que la majorité des juristes estiment qu'un acte de culte ne peut être annulé une fois accompli, et qu'il est interdit d'annuler un acte obligatoire une fois commencé, sans excuse valable; elle expose les divergences entre les écoles juridiques concernant la prière surérogatoire, le pèlerinage, le petit pèlerinage et la guerre sainte; et elle précise que les actes contraignants ne peuvent être annulés une fois entrés en vigueur qu'avec le consentement des deux parties. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1452} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1453}"
  ur: "کویتی انسائیکلوپیڈیا ibtal لسانی طور پر کسی چیز کو خراب کرنے اور ہٹانے کے طور پر بیان کرتا ہے، چاہے وہ صحیح ہو یا غلط۔ ایک تکنیکی اصطلاح کے طور پر یہ ایک فیصلہ ہے کہ کوئی چیز باطل ہے، چاہے وہ صحیح تھی اور اس کے بعد باطل ہونے کا سبب پیدا ہوا، یا آیا یہ معنی میں موجود ہے لیکن قانون میں نہیں۔ یہ ابتل کو فسخ ⁦(تحلیل)⁩، افساد ⁦(بدعنوانی)⁩ اور اسقاط ⁦(گرنے)⁩ سے ممتاز کرتا ہے۔ اس میں درج ہے کہ جمہور فقہاء کا خیال ہے کہ عبادت مکمل ہونے کے بعد اسے باطل نہیں کیا جا سکتا، اور یہ کہ ایک بار شروع ہونے والے واجب کو، بغیر عذر کے، باطل کرنا حرام ہے۔ یہ رضاکارانہ نماز، حج، کم عمری اور مقدس جنگ پر اسکولوں کے اختلافات کو بیان کرتا ہے۔ اور یہ کہ پابند اعمال دونوں فریقین کی رضامندی کے بغیر نافذ ہونے کے بعد کالعدم نہیں ہوسکتے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1452}"
  tr: "Kuveyt Fıkıh Ansiklopedisi, iptal etmeyi dilsel olarak bir şeyin, ister hak ister geçersiz kılınsın, geçersiz kılma ve ortadan kaldırma olarak tanımlar. Teknik olarak, bir şeyin geçersiz olduğu ve ardından geçersizliğe neden olup olmadığı ya da yasal değil somut bir şekilde var olup olmadığı kararıdır. Bu, iptal, geçersiz kılma ve feragatten ayrılır. Hukukçuların çoğunluğu, bir ibadet eylemi tamamlandıktan sonra geçersiz kılmanın geçerli olmadığını ve zorunlu bir eylemin geçerli bir mazeret olmadan başlatıldıktan sonra iptal edilmesinin yasak olduğunu savunmaktadır. Hukukçular arasında gönüllü dualar, hac, umre ve cihat konularında anlaşmazlıklar vardır ve gerekli eylemlerin uygulandıktan sonra ancak sözleşmeye tarafların onayı olmadan geçersiz sayılacağı görüşündedir. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.1452} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1453}"
  id: "Ensiklopedia Yurisprudensial Kuwait mendefinisikan pembatalan secara linguistik sebagai pembatalan dan penghapusan sesuatu, baik itu hak maupun yang dibatalkan. Secara teknis, ini adalah putusan atas sesuatu yang tidak sah, apakah itu sah dan kemudian menyebabkan ketidakabsahan, atau jika itu ada secara nyata daripada hukum. Ini dibedakan dari pembatalan, pembatalan, dan pengabaian. Jelas bahwa mayoritas ahli hukum berpendapat bahwa tidak sah untuk membatalkan suatu tindakan ibadah setelah selesai, dan bahwa membatalkan tindakan wajib setelah inisiasi tanpa alasan yang sah dilarang. Ada perbedaan pendapat di antara para ahli hukum mengenai doa sukarela, ziarah, Umrah, dan jihad, dan bahwa tindakan yang diperlukan tidak dibatalkan setelah penegakannya kecuali dengan persetujuan para pihak yang berkontrak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1452} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1453}"
