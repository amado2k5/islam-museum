id: concept/ibtal
class: concept
kind: legal
label: { ar: "الإبطال", en: "Invalidation (ibtal) of acts and contracts" }
summary:
  ar: "تعرّف الموسوعة الفقهية الكويتية الإبطال لغةً بأنه إفساد الشيء وإزالته حقاً كان أو باطلاً، واصطلاحاً الحكم على الشيء بالبطلان، سواء صح ثم طرأ عليه سبب البطلان، أو وُجد وجوداً حسياً لا شرعياً. وتفرّقه عن الفسخ والإفساد والإسقاط، وتبين أن جمهور الفقهاء على أنه لا يصح إبطال العبادة بعد الفراغ منها، ويحرم إبطال الفرض بعد الشروع دون عذر، وتعرض خلاف الفقهاء في النفل والحج والعمرة والجهاد، وأن التصرفات اللازمة لا تُبطل بعد نفاذها إلا برضا العاقدين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1452} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1453}"
  en: "The Kuwaiti encyclopedia defines ibtal linguistically as the spoiling and removal of a thing, whether it is right or wrong. As a technical term it is a judgment that a thing is void, whether it was valid and a cause of voidness afterwards arose, or whether it existed in sense but not in law. It distinguishes ibtal from fasakh (dissolution), ifsad (corruption) and isqat (dropping). It records that the majority of jurists hold that a worship cannot be voided after it is completed, and that voiding an obligatory act once begun, without excuse, is forbidden; it sets out the schools' differences on voluntary prayer, the pilgrimage, the lesser pilgrimage and holy war; and that binding acts cannot be voided once they take effect except with the consent of both parties. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1452} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1453}"
