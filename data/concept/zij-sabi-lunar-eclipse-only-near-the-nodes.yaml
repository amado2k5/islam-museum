id: concept/zij-sabi-lunar-eclipse-only-near-the-nodes
class: concept
kind: scientific
label: { ar: "الكسوف القمري لا يكون إلا قرب العقدتين", en: "A lunar eclipse happens only near the nodes", ur: "قمری کسوف صرف عقدتین کے قریب ہوتا ہے", es: "Un eclipse lunar ocurre solo cerca de los nodos." }
summary:
  ar: "يقرر البتاني في مطلع الباب الثالث والأربعين أن الكسوف القمري يحدث في الاستقبالات إذا كانت الحركة الوسطى للأرض، أي ظل الأرض، بين الحدود الكسوفية المرسومة في صفحات شهور الاجتماعات والمقابلات، فإن زاد القمر على تلك الحدود أو نقص عنها لم يُمكن أن ينكسف. {cite:zij-sabi-nallino-byblion p.146}."
  en: "At the start of chapter forty-three al-Battani holds that a lunar eclipse can happen at opposition only when the mean position of the Earth, that is the Earth's shadow, lies within the eclipse limits drawn in the pages of the months of conjunctions and oppositions. If the Moon exceeds those limits or falls short of them, no eclipse can happen. {cite:zij-sabi-nallino-byblion p.146}."
  ur: "تینتالیسویں باب کے آغاز میں البتانی کہتے ہیں کہ قمری کسوف مقابلے کے وقت اسی صورت میں ہو سکتا ہے جب زمین کا وسطی مقام، یعنی زمین کا سایہ، اجتماع اور مقابلے کے مہینوں کے صفحات میں درج کسوفی حدود کے اندر ہو؛ اگر چاند ان حدود سے بڑھ جائے یا کم ہو تو کسوف نہیں ہو سکتا۔ {cite:zij-sabi-nallino-byblion p.146}۔"
  es: "Al comienzo del capítulo cuarenta y tres, al-Battani sostiene que un eclipse lunar solo puede ocurrir en oposición cuando la posición media de la Tierra, es decir, su sombra, se encuentra dentro de los límites del eclipse trazados en las páginas de los meses de conjunción y oposición. Si la Luna excede o no alcanza dichos límites, no puede producirse ningún eclipse. {cite:zij-sabi-nallino-byblion p.146}."
