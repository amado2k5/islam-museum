summary:
  ar: "الجدي هو صورة الماعز الصغير، وتُعدّ كواكبه على الظهر تحت الكتف، والركبتين، والحوافر، والفخذ، والذيل. تتناول الحواشي بعد القائمة قدر أحد الكواكب بالإشارة إلى الصوفي. لا تُنقل المواضع. {cite:nallino-albatenii-opus-astronomicum pp.163}"
  en: "Capricorn is al-Jady, the kid (haedus). Its stars run along the back under the shoulder, the knees, the hooves, the thigh and the tail, where the list notes the northern stars at the start of the tail. The notes after the list discuss one star's magnitude with reference to al-Sufi. Positions are not transcribed here. {cite:nallino-albatenii-opus-astronomicum pp.163}"
  ur: "جدی، یعنی بکری کا بچہ، کی صورت ہے۔ اس کے ستارے پشت پر کندھے کے نیچے، گھٹنوں، کھروں، ران اور دم تک گنے گئے ہیں۔ فہرست کے بعد کے حواشی ایک ستارے کے قدر پر الصوفی کے حوالے سے بات کرتے ہیں۔ مواضع یہاں نقل نہیں ہوئے۔ {cite:nallino-albatenii-opus-astronomicum pp.163}"
  es: "Capricornio es al-Jady, el cabrito (haedus). Sus estrellas recorren el lomo bajo el hombro, las rodillas, las pezuñas, el muslo y la cola, donde la lista indica las estrellas del norte al comienzo de la cola. Las notas posteriores a la lista analizan la magnitud de una estrella en referencia a al-Sufi. Las posiciones no se transcriben aquí. {cite:nallino-albatenii-opus-astronomicum pp.163}"
  fr: "Le Capricorne est associé à al-Jady, le chevreau (haedus). Ses étoiles s'étendent le long du dos, sous l'épaule, les genoux, les sabots, la cuisse et la queue, où la liste mentionne les étoiles boréales au début de la queue. Les notes suivant la liste discutent de la magnitude d'une étoile en référence à al-Sufi. Les positions ne sont pas transcrites ici. {cite:nallino-albatenii-opus-astronomicum pp.163}"
