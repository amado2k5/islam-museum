id: concept/canon-organ-position-sympathy-and-route-of-the-drug
class: concept
kind: scientific
label:
  ar: "وضع العضو ومشاركته وجهة وصول الدواء عند ابن سينا"
  en: "The position of the organ, its sympathies and the route of the drug in the Canon"
  fr: "Situation organique, sympathies et voie du remède dans le Canon"
  ur: "عضو کی جگہ، اس کی مشارکت اور دوا کے پہنچنے کی راہ قانون میں"
  es: "La posición del órgano, sus simpatías y la ruta del fármaco en el Canon"
summary:
  ar: "يذكر ابن سينا أن وضع العضو يفيد من وجهين: علم المشاركة الذي يخص اختيار جهة جذب الدواء، وعلم الموضع الذي يفيد من ثلاثة وجوه: قربه وبعده، وما يخلط بالدواء ليسرع وصوله، وجهة اتصال الدواء به {cite:canon-ibn-sina-print-v1 p.269}."
  en: "Ibn Sina says that the position of an organ helps in two ways: knowledge of its sympathies guides the choice of the direction in which the drug draws, and knowledge of its place helps in three respects, its nearness or distance, what is mixed with the drug to speed it there, and the route by which the drug reaches it {cite:canon-ibn-sina-print-v1 p.269}."
  fr: "Ibn Sina tire de la situation deux enseignements : les sympathies guident la direction attractive ; le lieu précise proximité, ajouts accélérant l’arrivée et voie d’accès {cite:canon-ibn-sina-print-v1 p.269}."
  es: "Ibn Sina dice que la posición de un órgano ayuda de dos maneras: el conocimiento de sus simpatías guía la elección de la dirección en la que se dirige el fármaco, y el conocimiento de su lugar ayuda en tres aspectos: su cercanía o distancia, lo que se mezcla con el fármaco para acelerar su llegada y la ruta por la que el fármaco llega a él {cite:canon-ibn-sina-print-v1 p.269}."
  ur: "ابن سینا کا کہنا ہے کہ عضو کی حیثیت دو طریقوں سے مدد کرتی ہے: اس کی ہمدردی کا علم اس سمت کے انتخاب میں رہنمائی کرتا ہے جس کی طرف دوائی کھینچتی ہے، اور اس کی جگہ کا علم تین چیزوں میں مدد کرتا ہے، اس کی قربت یا فاصلہ، دوا کے ساتھ کیا ملایا جاتا ہے تاکہ اسے تیز کیا جاسکے، اور وہ راستہ جس سے دوا اس تک پہنچتی ہے۔"
