label: { ar: "وضع العضو ومشاركته وجهة وصول الدواء عند ابن سينا", en: "The position of the organ, its sympathies and the route of the drug in the Canon", ur: "عضو کی جگہ، اس کی مشارکت اور دوا کے پہنچنے کی راہ قانون میں" }
summary:
  ar: "يذكر ابن سينا أن وضع العضو يفيد من وجهين: علم المشاركة الذي يخص اختيار جهة جذب الدواء، وعلم الموضع الذي يفيد من ثلاثة وجوه: قربه وبعده، وما يخلط بالدواء ليسرع وصوله، وجهة اتصال الدواء به {cite:canon-ibn-sina-print-v1 p.269}."
  en: "Ibn Sina says that the position of an organ helps in two ways: knowledge of its sympathies guides the choice of the direction in which the drug draws, and knowledge of its place helps in three respects, its nearness or distance, what is mixed with the drug to speed it there, and the route by which the drug reaches it {cite:canon-ibn-sina-print-v1 p.269}."
