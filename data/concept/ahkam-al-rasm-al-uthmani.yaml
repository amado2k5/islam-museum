id: concept/ahkam-al-rasm-al-uthmani
class: concept
kind: discipline
label:
  ar: "قواعد الرسم العثماني: الحذف والزيادة والهمز والبدل والوصل والفصل"
  en: "The rules of the Uthmanic rasm: omission, addition, hamza, substitution, joining and separating"
  fr: "Les règles du rasm uthmanien : omission, ajout, hamza, substitution, jonction et séparation"
  ur: "رسمِ عثمانی کے قاعدے: حذف، زیادت، ہمزہ، بدل، وصل اور فصل"
  es: "Las reglas del rasm utmánico: omisión, adición, hamza, sustitución, unión y separación."
summary:
  ar: "حصر السيوطي أمر الرسم في الحذف والزيادة والهمز والبدل والوصل والفصل وما فيه قراءتان فكُتب على إحداهما، وجعل لكل قاعدة فروعاً واستثناءات؛ وهي أحكام ضبطها الدانيّ وأبو داود وأتباعهما، وللمغاربة والمشارقة اختيارات فيها {cite:itqan-suyuti p. 2200} {cite:itqan-suyuti p. 2201}."
  en: "Al-Suyuti confined the matter of the rasm to omission, addition, hamza, substitution, joining and separating, and whatever has two readings and is written to one of them, giving each rule its branches and exceptions; these rulings were fixed by al-Dani, Abu Dawud and their followers, and the Maghribis and Easterners made different choices within them {cite:itqan-suyuti p. 2200} {cite:itqan-suyuti p. 2201}."
  fr: "Al-Suyuti limita la matière du rasm à l’omission, à l’ajout, à la hamza, à la substitution, à la jonction et à la séparation, ainsi qu’à ce qui possède deux lectures et s’écrit selon l’une d’elles, donnant à chaque règle ses subdivisions et ses exceptions ; ces règles furent fixées par al-Dani, Abu Dawud et leurs disciples, et les Maghrébins et les Orientaux firent des choix différents en leur sein {cite:itqan-suyuti p. 2200} {cite:itqan-suyuti p. 2201}."
  ur: "سیوطی نے رسم کا معاملہ حذف، زیادت، ہمزہ، بدل، وصل اور فصل، اور اس چیز تک محدود کیا جس میں دو قراءتیں ہوں اور ایک پر لکھا گیا ہو، اور ہر قاعدے کی شاخیں اور استثناء دیے؛ یہ احکام دانی، ابو داود اور ان کے پیروکاروں نے ضبط کیے، اور مغاربہ و مشارقہ کے ان میں الگ اختیارات ہیں {cite:itqan-suyuti p. 2200} {cite:itqan-suyuti p. 2201}۔"
  es: "Al-Suyuti limitó la cuestión del rasm a la omisión, adición, hamza, sustitución, unión y separación, y todo lo que tenga dos lecturas y esté escrito para una de ellas, dando a cada regla sus ramas y excepciones; estas normas fueron fijadas por al-Dani, Abu Dawud y sus seguidores, y los magrebíes y orientales hicieron diferentes elecciones dentro de ellas {cite:itqan-suyuti p. 2200} {cite:itqan-suyuti p. 2201}."
