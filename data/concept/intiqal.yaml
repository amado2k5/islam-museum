id: concept/intiqal
class: concept
kind: legal
label: { ar: "الانتقال", en: "Intiqal (transfer or passage: of a thing, a duty, a right and a ruling)" }
summary:
  ar: "الانتقال لغة التحول من موضع إلى آخر، ويستعمل مجازا في التحول المعنوي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3453} ينتقل الواجب إلى البدل عند تعذر الأصل، كالانتقال من الوضوء إلى التيمم، ومن القيام إلى القعود، ومن الصيام إلى الفدية، ومن الدين إلى القيمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3453}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3454} ومن الحقوق ما ينتقل إلى الورثة، ومنها ما لا ينتقل لتعلقه بشخص المورث وإرادته، والانتقال في الأحكام كانتقال العدة من الطلاق إلى الوفاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3454}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3455}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3456}"
  en: "Intiqal in the lexical sense is moving from one place to another, and used figuratively for a change of state. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3453} A duty passes to its substitute when the original cannot be done: ablution to tayammum, standing to sitting, fasting to a ransom, a debt to its value. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3453}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3454} Some rights pass to heirs and others do not, depending on whether they concern property or the person of the deceased; a rule also passes, as a waiting period passes from divorce to widowhood. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3454}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3455}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3456}"
