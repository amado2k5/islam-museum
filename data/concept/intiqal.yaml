label: { ar: "الانتقال", en: "Intiqal (transfer or passage: of a thing, a duty, a right and a ruling)", es: "Intiqal (transferencia o paso: de una cosa, un deber, un derecho y una norma)", fr: "Intiqal (transfert ou passage: d'une chose, d'un devoir, d'un droit et d'une décision)", ur: "انتقال ⁦(منتقلی یا گزرنا: کسی چیز کا، فرض، حق اور حکم)⁩", tr: "Geçiş", id: "Transisi" }
summary:
  ar: "الانتقال لغة التحول من موضع إلى آخر، ويستعمل مجازا في التحول المعنوي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3453} ينتقل الواجب إلى البدل عند تعذر الأصل، كالانتقال من الوضوء إلى التيمم، ومن القيام إلى القعود، ومن الصيام إلى الفدية، ومن الدين إلى القيمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3453}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3454} ومن الحقوق ما ينتقل إلى الورثة، ومنها ما لا ينتقل لتعلقه بشخص المورث وإرادته، والانتقال في الأحكام كانتقال العدة من الطلاق إلى الوفاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3454}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3455}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3456}"
  en: "Intiqal in the lexical sense is moving from one place to another, and used figuratively for a change of state. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3453} A duty passes to its substitute when the original cannot be done: ablution to tayammum, standing to sitting, fasting to a ransom, a debt to its value. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3453}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3454} Some rights pass to heirs and others do not, depending on whether they concern property or the person of the deceased; a rule also passes, as a waiting period passes from divorce to widowhood. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3454}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3455}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3456}"
  es: "Intiqal en sentido léxico es moverse de un lugar a otro, y se usa figurativamente para un cambio de estado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3453} Un deber pasa a su sustituto cuando el original no se puede realizar: la ablución al tayammum, estar de pie a sentarse, el ayuno a un rescate, una deuda a su valor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3453}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3454} Algunos derechos pasan a los herederos y otros no, dependiendo de si se refieren a la propiedad o a la persona del difunto; una regla también pasa, como pasa un período de espera del divorcio a la viudez. {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3454}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3455}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.3456}"
  fr: "Intiqal, au sens littéral, signifie se déplacer d'un lieu à un autre, et figurativement, il désigne un changement d'état. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3453} Un devoir se substitue à son substitut lorsque l'original ne peut être accompli: les ablutions deviennent le tayammum, la position debout devient la position assise, le jeûne devient une rançon, une dette devient sa valeur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3453}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3454} Certains droits sont transmis aux héritiers, d'autres non, selon qu'ils concernent des biens ou la personne du défunt; une règle s'applique également, comme le délai d'attente entre le divorce et le veuvage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3454}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3455}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3456}"
  ur: "استقلال لغوی معنوں میں ایک جگہ سے دوسری جگہ منتقل ہوتا ہے، اور حالت کی تبدیلی کے لیے علامتی طور پر استعمال ہوتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 3453} فرض اس کے بدل جاتا ہے جب اصل نہیں ہو سکتا: وضو سے تیمم، کھڑے ہونے سے بیٹھنا، فدیہ کے لیے روزہ، اس کی قیمت کا قرض۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.3453}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3454} کچھ حقوق ورثاء کو منتقل ہوتے ہیں اور دوسرے اس بات پر منحصر ہوتے ہیں کہ ان کا تعلق جائیداد سے ہے یا میت کے فرد سے۔ ایک قاعدہ بھی گزر جاتا ہے، جیسا کہ عدت طلاق سے بیوہ تک گزر جاتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3454}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3455}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3456}"
  tr: "Transfer dili, bir yerden başka bir yere dönüşümdür ve manevi dönüşüm için mecazi olarak kullanılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3453} Zorunluluk, orijinalin imkansız olduğu durumlarda ikame etmeye geçer; örneğin abdest tayammum'a, ayağa kalkmaktan oturmaya, oruçtan fidyaya ve borçtan değere geçiş gibi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3453} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3454} Bazı haklar mirasçılara devredilirken, diğerleri ölen kişiye ve vasiyetine bağımlılıkları nedeniyle ve boşanmadan ölüme bekleme süresinin aktarılması gibi kararlarda devredilmez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3454}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3455} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3456}"
  id: "Bahasa transfer adalah transformasi dari satu tempat ke tempat lain, dan digunakan secara metaforis untuk transformasi spiritual. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3453} Kewajiban bergerak untuk mengganti ketika yang asli tidak mungkin, seperti berpindah dari wudhu ke tayammum, dari berdiri ke duduk, dari puasa ke fidya, dan dari utang ke nilai. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3453} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3454} Beberapa hak dialihkan kepada ahli waris, sementara yang lain tidak karena ketergantungan mereka pada almarhum dan wasiatnya, serta dialihkan dalam putusan seperti pemindahan masa tunggu dari perceraian ke kematian. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3454} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3455} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3456}"
