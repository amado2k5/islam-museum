summary:
  ar: "يعد ابن سينا الاستدلال من الحركات والسكونات مما يقتضي بسطاً، فيذكر أعراض السكون كالسكتة والصرع والغشي والفالج، وأعراض الحركة كالقشعريرة والنافض والفواق والعطاس والسعال، ويصنفها بحسب الفاعل الطبيعي والإرادي {cite:canon-ibn-sina-print-v1 pp.155-156}."
  en: "Ibn Sina says that reading movements and rests needs fuller treatment, and lists signs of rest such as apoplexy, epilepsy, fainting and palsy, and signs of movement such as chill, shivering, hiccough, sneezing and cough, which he sorts by whether nature or will drives them {cite:canon-ibn-sina-print-v1 pp.155-156}."
