  tr: "El-Mudhil: Adaletiyle istediği kişileri küçük düşüren ve onları terk eden. El-Tirmidi'nin Allah'ın İsimleri hakkındaki hadislerde adı 25."
  id: "Al-Mudhil: orang yang mempermalukan siapa pun yang dikehendaki-Nya dengan keadilan-Nya dan meninggalkan mereka. Nama nomor 25 dalam daftar yang disebutkan dalam hadits Al-Tirmidhi tentang Nama-nama Allah."
