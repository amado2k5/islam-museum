id: concept/daf-allah-al-nas-bi-ba-d
class: concept
kind: doctrine
label:
  ar: "دفع الله الناس بعضهم ببعض"
  en: "God repels some people by means of others"
summary:
  ar: "يرى عرجون أن من سنن الله في الصراع بين الحق والباطل أن يدفع بعض الناس ببعض، ولولا ذلك لهدمت أماكن العبادة ولفسدت الأرض {cite:sunan-allah-fi-al-mujtama-azhar p. 68}. ويقرر أن الإذن بالقتال في سورة الحج جاء لدفع ظلم المعتدين عن أهل الإيمان الذين أخرجوا من ديارهم، وأن المجتمع المسلم لا يقاتل حباً في القتال ولا بغياً {cite:sunan-allah-fi-al-mujtama-azhar p. 65}. ويوجب إعداد القوة المرهبة للعدو بقدر الاستطاعة، ويرى أن القوة تُعد للردع لا للهجوم {cite:sunan-allah-fi-al-mujtama-azhar p. 64}. ويقيّد المطلق من نصوص النصر بالإيمان والعمل والإعداد المادي {cite:sunan-allah-fi-al-mujtama-azhar p. 60}."
  en: "Arjun holds that one of God's sunan in the struggle between truth and falsehood is that some people are repelled by others. Without it, places of worship would be destroyed and the earth corrupted {cite:sunan-allah-fi-al-mujtama-azhar p. 68}. He reads the permission to fight in the Hajj surah as defence against aggression, and preparation of strength as deterrence rather than attack {cite:sunan-allah-fi-al-mujtama-azhar p. 64-65}."
