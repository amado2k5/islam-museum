label: { ar: "مدائن قوم لوط", en: "The cities of Lot's people", es: "Las ciudades del pueblo de Lot", fr: "Les villes du peuple de Lot", ur: "قوم لوط کے شہر", tr: "Lot halkının şehirleri", id: "Kota-kota penduduk Lot" }
summary:
  ar: "كانت بالشام ملوك ببلاد مادب من أرض البلقاء ومدائن قوم لوط من أرض الأردن وبلاد فلسطين، وكانت خمس مدن ودار المملكة منها والمدينة العظمى مدينة سدوم، وكانت سمة كل ملك يملكها بارعاً، وقد ذكرت أسماءها في التوراة {cite:muruj-al-dhahab p. 428}."
  en: "Five cities in the Jordan and Palestine country whose chief and seat was Sodom — each king of them surnamed 'the Excellent' — as al-Mas'udi reports with reference to the Torah {cite:muruj-al-dhahab p. 428}."
  es: "Cinco ciudades en el país de Jordania y Palestina cuyo jefe y sede era Sodoma —cada uno de sus reyes apodado 'el Excelente'— como informa al-Mas'udi con referencia a la Torá {cite:muruj-al-dhahab p. 428}."
  fr: "Cinq villes du pays de Jordanie et de Palestine dont le chef et le siège était Sodome — chacun de leurs rois surnommé « l'Excellent » — comme le rapporte al-Mas'udi en référence à la Torah {cite:muruj-al-dhahab p. 428}."
  ur: "اردن اور فلسطین کے ملک کے پانچ شہر جن کا سردار اور مقام سدوم تھا - ان میں سے ہر ایک بادشاہ کا لقب 'بہترین' تھا - جیسا کہ المسعودی تورات کے حوالے سے رپورٹ کرتا ہے۔ 428}۔"
  tr: "Levant'ta Madab topraklarında, Balka topraklarında, Ürdün topraklarından Lut halkının şehirlerinde ve Filistin topraklarında krallar vardı. Beş şehir ve krallığın başkenti vardı, en büyük şehir Sodom şehriydi. Bu, şehri yöneten her kralın bir özelliğiydi ve isimleri Tevrat'ta geçmektedir {cite:muruj-al-dhahab, s. 428}."
  id: "Di Levant, terdapat raja-raja di tanah Madab, tanah Balqa, kota-kota bangsa Lot dari tanah Yordania, dan tanah Palestina. Ada lima kota dan ibu kota kerajaan, dengan kota terbesar adalah kota Sodom. Ini adalah ciri khas setiap raja yang memerintahnya, dan nama-namanya disebutkan dalam Taurat {cite:muruj-al-dhahab, hlm. 428}."
