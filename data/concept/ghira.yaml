summary:
  ar: "غراء في الكتاب غراء الجلود حار يابس في الأولى وغراء السمك أقل حرارة لكنه يابس، لكل غراء قوة مغرية مجففة، ويقع غراء السمك في الغمرة وأدوية البرص ومراهم الجرب المتقرح وقروح الرأس، ويطلى غراء الجلود على السعفة ويمنع تنفط الحرق، ويسقى غراء السمك بالخل لنفث الدم {cite:canon-ibn-sina-print-v1 pp.725-726}"
  en: "Ghira' is in the book: hide glue is hot and dry in the first degree and fish glue less hot but dry, every glue has an adhesive, drying power, fish glue enters the ghumra and the drugs for baras and the salves for ulcerated scab and for ulcers of the head, hide glue is applied to sa'fa and prevents blistering of a burn, and fish glue is given with vinegar for spitting of blood {cite:canon-ibn-sina-print-v1 pp.725-726}"
  ur: "غراء کتاب میں: کھالوں کا غراء پہلے درجے میں گرم خشک ہے اور مچھلی کا غراء کم گرم مگر خشک، ہر غراء میں چپکانے اور خشک کرنے والی قوت ہے، مچھلی کا غراء غمرہ اور برص کی دواؤں اور قرحہ زدہ جرب اور سر کے زخموں کے مرہموں میں داخل ہوتا ہے، کھالوں کا غراء سعفہ پر لگایا جاتا ہے اور جلنے کے آبلے بننے کو روکتا ہے، اور مچھلی کا غراء سرکے کے ساتھ خون تھوکنے کے لیے دیا جاتا ہے {cite:canon-ibn-sina-print-v1 pp.725-726}۔"
  es: "Ghira' está en el libro: la cola de piel es caliente y seca en primer grado y la cola de pescado menos caliente pero seca, cada cola tiene un poder adhesivo y secante, la cola de pescado entra en el ghumra y los medicamentos para baras y los ungüentos para costras ulceradas y para úlceras en la cabeza, la cola de piel se aplica a sa'fa y previene la formación de ampollas en una quemadura, y la cola de pescado se administra con vinagre para la expectoración de sangre {cite:canon-ibn-sina-print-v1 pp.725-726}"
