summary:
  ar: "فليرنظر الإنسان إلى طعامه: أنزلنا الماء وشققنا الأرض فأنبتنا فيها حباً وعنباً وقضباً وزيتوناً ونخلاً وحدائق غلباً وفاكهة وأباً، ولأهل الجنة فواكه كثيرة لا مقطوعة ولا ممنوعة وفاكهة مما يتخيرون."
  en: "'Let man look at his food': We poured down water, split the earth and grew in it grain, grapes, clover, olives, palms, dense gardens, fruit and pasture — and for Paradise's people, fruits uncounted, neither cut off nor forbidden, and fruit of what they choose."
  ur: "'انسان اپنے کھانے کو دیکھے': ہم نے پانی برسایا، زمین پھاڑی اور اس میں اناج، انگور، چارہ، زیتون، کھجوریں، گھنے باغ، پھل اور سبزہ اگایا — اور جنت والوں کے لیے بے شمار پھل جو نہ ختم ہوں نہ منع ہوں۔"
