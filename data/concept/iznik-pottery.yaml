id: concept/iznik-pottery
class: concept
kind: art_form
label: { ar: "خزف إزنيق", en: "Iznik pottery", ur: "ازنیق کے ظروف", es: "Cerámica de Iznik", fr: "poterie d'Iznik", tr: "İznik Porselen", id: "Porselen Iznik" }
summary:
  ar: "الخزف والبلاطات العثمانية في القرن السادس عشر ذات الأزهار الطبيعية والأحمر الطماطمي، التي كانت تسمى «رودسية» و«دمشقية»، ونسبها هوبسون وغيره إلى إزنيق ⁦(نيقية)⁩ {cite:hobson-guide-islamic-pottery-near-east-1932 p. 130} {cite:hobson-guide-islamic-pottery-near-east-1932 p. 135}."
  en: "Sixteenth-century Ottoman pottery and tiles with naturalistic flowers and tomato red, once called 'Rhodian' and 'Damascus' ware, which Hobson and others assigned to Iznik (Nicaea) {cite:hobson-guide-islamic-pottery-near-east-1932 p. 130} {cite:hobson-guide-islamic-pottery-near-east-1932 p. 135}."
  ur: "سولھویں صدی کے عثمانی ظروف اور ٹائلیں جن پر قدرتی پھول اور ٹماٹری سرخ رنگ ہے، جنہیں کبھی «رودسی» اور «دمشقی» کہا جاتا تھا، اور ہوبسن وغیرہ نے انہیں ازنیق ⁦(نیقیہ)⁩ سے منسوب کیا {cite:hobson-guide-islamic-pottery-near-east-1932 p. 130} {cite:hobson-guide-islamic-pottery-near-east-1932 p. 135}۔"
  es: "Cerámica y azulejos otomanos del siglo XVI con flores naturalistas y rojo tomate, alguna vez llamados cerámica 'rodiana' y 'damascua', que Hobson y otros asignaron a Iznik (Nicea) {cite:hobson-guide-islamic-pottery-near-east-1932 p. 130} {cite:hobson-guide-islamic-pottery-near-east-1932 p. 135}."
  fr: "Poteries et carreaux ottomans du XVIe siècle à motifs floraux naturalistes et rouge tomate, autrefois appelés « céramique rhodienne » et « céramique de Damas », que Hobson et d'autres ont attribués à Iznik (Nicée) {cite:hobson-guide-islamic-pottery-near-east-1932 p. 130} {cite:hobson-guide-islamic-pottery-near-east-1932 p. 135}."
  tr: "On altıncı yüzyılda Osmanlı seramiği ve karoları, doğal çiçekli ve domates kırmızısıyla, 'Rodezya' ve 'Şam' olarak adlandırılmış ve Hobson ile diğerleri tarafından İznik'e (İznik) atfedilmiştir. {cite:Hobson-guide-islamic-pottery-near-east-1932 s. 130} {cite:Hobson-guide-islamic-pottery-near-east-1932 s. 135}."
  id: "Keramik dan ubin Ottoman pada abad keenam belas dengan bunga alami dan merah tomat, yang disebut 'Rhodesian' dan 'Damaskan,' dan dikaitkan oleh Hobson dan lainnya dengan Iznik (Nicaea) {cite:Hobson-guide-islamic-pottery-near-east-1932 hlm. 130} {cite:Hobson-guide-islamic-pottery-near-east-1932 hlm. 135}."
