label: { ar: "الأنف", en: "Anf (the nose, and its rulings in purification, prayer, fasting and retaliation)" }
summary:
  ar: "الأنف المنخر، وجمعه آناف وأنوف، وتختلف أحكامه باختلاف مواضعه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3513} غسل الأنف من الداخل بالاستنشاق سنة، ومن الظاهر فرض باعتباره جزءا من الوجه، وغسل ظاهره في الغسل فرض عند الجميع، وباطنه فرض عند الحنفية وسنة عند غيرهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3513} ومكن الأنف مع الجبهة في السجود سنة عند الجمهور، وواجب عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3513} وإذا وصل دواء أو ماء من الأنف إلى الجوف أو الحلق فسد الصوم عند كثير من الفقهاء، مع خلاف في تفصيله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3513}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3514} وجناية الأنف عمدا توجب القصاص إن أمكن استيفاء المثل بلا حيف، وإلا فالدية، وفي ذهاب الشم وحده دية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3514}"
  en: "Anf is the nostril, plural anaf or unuf, and its rulings vary with its place. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3513} Washing the inside of the nose by sniffing water in is sunna, while washing the outside is obligatory as part of the face; in full washing the outside is obligatory for all, and the inside is obligatory for the Hanafis and sunna for others. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3513} Placing the nose with the forehead on the ground in prostration is sunna for the majority and obligatory for the Hanafis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3513} If medicine or water inhaled through the nose reaches the stomach or throat, the fast is broken by the views of many jurists, with disputes over the detail. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3513}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3514} A deliberate injury to the nose calls for retaliation where an equal can be exacted without wrong, and otherwise for blood money; loss of the sense of smell alone carries blood money. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3514}"
