label: { ar: "الأنف", en: "Anf (the nose, and its rulings in purification, prayer, fasting and retaliation)", fr: "Anf (le nez et les règles qui le concernent dans la purification, la prière, le jeûne et le talion)", es: "Anf (la nariz y sus preceptos en materia de purificación, oración, ayuno y represalias)", ur: "عنف ⁦(ناک اور اس کے احکام طہارت، نماز، روزہ اور اعتکاف میں)⁩", tr: "burun", id: "burun" }
summary:
  ar: "الأنف المنخر، وجمعه آناف وأنوف، وتختلف أحكامه باختلاف مواضعه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3513} غسل الأنف من الداخل بالاستنشاق سنة، ومن الظاهر فرض باعتباره جزءا من الوجه، وغسل ظاهره في الغسل فرض عند الجميع، وباطنه فرض عند الحنفية وسنة عند غيرهم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3513} ومكن الأنف مع الجبهة في السجود سنة عند الجمهور، وواجب عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3513} وإذا وصل دواء أو ماء من الأنف إلى الجوف أو الحلق فسد الصوم عند كثير من الفقهاء، مع خلاف في تفصيله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3513}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3514} وجناية الأنف عمدا توجب القصاص إن أمكن استيفاء المثل بلا حيف، وإلا فالدية، وفي ذهاب الشم وحده دية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3514}"
  en: "Anf is the nostril, plural anaf or unuf, and its rulings vary with its place. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3513} Washing the inside of the nose by sniffing water in is sunna, while washing the outside is obligatory as part of the face; in full washing the outside is obligatory for all, and the inside is obligatory for the Hanafis and sunna for others. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3513} Placing the nose with the forehead on the ground in prostration is sunna for the majority and obligatory for the Hanafis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3513} If medicine or water inhaled through the nose reaches the stomach or throat, the fast is broken by the views of many jurists, with disputes over the detail. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3513}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3514} A deliberate injury to the nose calls for retaliation where an equal can be exacted without wrong, and otherwise for blood money; loss of the sense of smell alone carries blood money. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3514}"
  fr: "Anf désigne la narine, au pluriel anaf ou unuf ; les règles varient selon le contexte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3513} Laver l’intérieur du nez en y aspirant de l’eau relève de la sunna, tandis que le lavage extérieur est obligatoire, le nez faisant partie du visage. Lors des grandes ablutions, le lavage extérieur est obligatoire pour tous, et celui de l’intérieur est obligatoire pour les hanafites et relève de la sunna pour les autres. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3513} Poser le nez avec le front au sol pendant la prosternation relève de la sunna pour la majorité et constitue une obligation pour les hanafites. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3513} Si un médicament ou de l’eau aspirés par le nez atteignent l’estomac ou la gorge, le jeûne est rompu selon de nombreux juristes, qui divergent dans le détail. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3513}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3514} Une blessure volontaire au nez relève du talion lorsqu’une lésion équivalente peut être infligée sans excès ; à défaut, le prix du sang est dû. La seule perte de l’odorat donne droit au prix du sang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3514}"
  es: "Anf es la fosa nasal, plural anaf o unuf, y sus reglas varían según su lugar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3513} Lavarse el interior de la nariz inhalando agua es sunna, mientras que lavarse el exterior es obligatorio como parte de la cara; en el lavado completo el exterior es obligatorio para todos, y el interior es obligatorio para los hanafíes y sunna para los demás. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3513} Colocar la nariz con la frente en el suelo en postración es sunna para la mayoría y obligatorio para los hanafíes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3513} Si la medicina o el agua inhalada por la nariz llega al estómago o la garganta, el ayuno se rompe según las opiniones de muchos juristas, con disputas sobre el detalle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3513}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3514} Una lesión deliberada en la nariz exige represalias cuando se puede exigir una igual sin incurrir en ilícito, y en caso contrario, indemnización por homicidio; la pérdida del sentido del olfato por sí sola conlleva indemnización por homicidio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3514}"
  ur: "انف نتھنا، جمع عناف یا انف ہے اور اس کے احکام اس کی جگہ کے ساتھ مختلف ہوتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص3513} ناک کے اندر کا پانی سونگھ کر دھونا سنت ہے، جبکہ باہر کا دھونا چہرے کے حصے کے طور پر واجب ہے۔ باہر کا پورا دھونا سب پر فرض ہے اور احناف کے لیے اندر کا دھونا واجب ہے اور دوسروں کے لیے سنت۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 ص3513} سجدے میں ناک کو پیشانی کے ساتھ زمین پر رکھنا جمہور کے نزدیک سنت ہے اور احناف کے نزدیک واجب ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 3513} ناک کے ذریعے دوا یا پانی معدے یا حلق تک پہنچ جائے تو بہت سے فقہاء کے نزدیک تفصیل کے اختلاف کے ساتھ روزہ ٹوٹ جاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.3513}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3514} ناک کو جان بوجھ کر چوٹ لگانا انتقامی کارروائی کا مطالبہ کرتا ہے جہاں غلط کے بغیر برابری کی جاسکتی ہے، اور دوسری صورت میں خون کے پیسے کے لئے؛ صرف سونگھنے کی حس کا نقصان خون کی رقم لے جاتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 3514}"
  tr: "Burun deliği, çoğulu 'anuf' ve 'anuf' ve kuralları konumuna göre değişir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3513} Burnun içten nefes alarak yıkanması sünnettir, görünen kısmı yüzün bir parçası olarak zorunludur, yüzeyin gusla yıkanması herkes için zorunludur, iç kısmı ise Hanafiye ve Sünnet'e göre başkaları için zorunludur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3513} Burnun alınla birlikte secde edilmesi çoğunluğa göre sünnettir ve Hanefilere göre zorunludur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3513} Burundan ilaç veya su boğaza ulaşırsa, birçok hukukçuya göre oruç geçersiz sayılır, ancak ayrıntılar konusunda anlaşmazlıklar vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3513}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3514} Burun suçu kasıtlı olarak işlenmiş olursa, haksızlık olmadan yapılırsa intikam gerektirir; aksi takdirde diyyadır ve sadece koklama kaybı diyya sayılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3514}"
  id: "Burun deliği, çoğulu 'anuf' ve 'anuf' ve kuralları konumuna göre değişir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3513} Burnun içten nefes alarak yıkanması sünnettir, görünen kısmı yüzün bir parçası olarak zorunludur, yüzeyin gusla yıkanması herkes için zorunludur, iç kısmı ise Hanafiye ve Sünnet'e göre başkaları için zorunludur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3513} Burnun alınla birlikte secde edilmesi çoğunluğa göre sünnettir ve Hanefilere göre zorunludur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3513} Burundan ilaç veya su boğaza ulaşırsa, birçok hukukçuya göre oruç geçersiz sayılır, ancak ayrıntılar konusunda anlaşmazlıklar vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3513}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3514} Burun suçu kasıtlı olarak işlenmiş olursa, haksızlık olmadan yapılırsa intikam gerektirir; aksi takdirde diyyadır ve sadece koklama kaybı diyya sayılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3514}"
