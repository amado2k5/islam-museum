summary:
  ar: 'المانع: المانع لما يشاء بحكمته المعطي لما يشاء بعدله. الاسم رقم 90 في التعداد الوارد في حديث الترمذي عن أسماء الله الحسنى.'
  en: al-Mani — The Withholder. Name 90 in the enumeration of the most beautiful names in the Tirmidhi hadith.
  fr: "al-Mani — Celui qui retient. Nom 90 dans l’énumération des plus beaux noms du hadith de Tirmidhi."
  ur: 'المانع: مانع — جو حکمت سے روکے اور عدل سے عطا کرے۔ اسمائے حسنیٰ کی ترمذی والی گنتی میں نمبر 90۔'
  es: "al-Mani — El Retenedor. Ocupa el puesto número 90 en la enumeración de los nombres más bellos en el hadiz de Tirmidhi."
  tr: "El-Muni': Kendi hikmetiyle istediğini saklayan, adaletiyle istediğini veren. El-Tirmidi'nin Allah'ın İsimleri hakkındaki hadislerinde adı 90."
  id: "Al-Muni': dia yang menahan apa yang Dia kehendaki dengan kebijaksanaan-Nya, Pemberi apa pun yang Dia kehendaki dengan keadilan-Nya. Nama nomor 90 dalam daftar yang disebutkan dalam hadits Al-Tirmidhi tentang Nama-nama Allah."
