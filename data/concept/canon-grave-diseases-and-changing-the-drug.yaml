id: concept/canon-grave-diseases-and-changing-the-drug
class: concept
kind: scientific
label:
  ar: "الأمراض الخطرة وتبديل الأدوية عند ابن سينا"
  en: "Grave diseases and changing the drug in the Canon"
  fr: "Maladies graves et changement de remède dans le Canon"
  ur: "خطرناک بیماریاں اور دوا بدلنا قانون میں"
  es: "Enfermedades graves y cambios en el medicamento en el Canon"
summary:
  ar: "يوصي ابن سينا بأن تبدأ الأمراض التي فيها خطر بالعلاج القوي أولاً، وغير الخطرة بالتدرج إلى الأقوى إن لم يغن الأخف، وبألا يقام على دواء واحد بل تبدل الأدوية، وإذا أشكلت العلة خلي بينها وبين الطبيعة {cite:canon-ibn-sina-print-v1 pp.270-271}."
  en: "Ibn Sina advises that diseases with danger begin with strong treatment, and those without danger rise by degrees to the stronger if the lighter does not suffice, that one drug is not kept to but drugs are changed, and that when the illness is unclear it is left to nature {cite:canon-ibn-sina-print-v1 pp.270-271}."
  fr: "Ibn Sina préconise traitement fort d’emblée en danger, progression vers le fort sinon, changement de remèdes plutôt qu’un seul et attente de la nature si le mal est obscur {cite:canon-ibn-sina-print-v1 pp.270-271}."
  es: "Ibn Sina aconseja que las enfermedades peligrosas comiencen con un tratamiento fuerte, y que aquellas sin peligro aumenten gradualmente a un tratamiento más fuerte si el más suave no es suficiente, que no se mantenga un solo medicamento sino que se cambien los medicamentos, y que cuando la enfermedad no esté clara se deje a la naturaleza {cite:canon-ibn-sina-print-v1 pp.270-271}."
  ur: "ابن سینا مشورہ دیتے ہیں کہ خطرے والی بیماریاں مضبوط علاج سے شروع ہوتی ہیں اور جن کو خطرہ نہیں ہوتا اگر ہلکا کافی نہ ہو تو درجے کے حساب سے مضبوط ہو جاتا ہے، ایک دوا نہیں رکھی جاتی بلکہ دوائیاں بدل دی جاتی ہیں، اور جب بیماری واضح نہ ہو تو اسے فطرت پر چھوڑ دیا جاتا ہے۔"
