summary:
  ar: "يوصي ابن سينا بأن تبدأ الأمراض التي فيها خطر بالعلاج القوي أولاً، وغير الخطرة بالتدرج إلى الأقوى إن لم يغن الأخف، وبألا يقام على دواء واحد بل تبدل الأدوية، وإذا أشكلت العلة خلي بينها وبين الطبيعة {cite:canon-ibn-sina-print-v1 pp.270-271}."
  en: "Ibn Sina advises that diseases with danger begin with strong treatment, and those without danger rise by degrees to the stronger if the lighter does not suffice, that one drug is not kept to but drugs are changed, and that when the illness is unclear it is left to nature {cite:canon-ibn-sina-print-v1 pp.270-271}."
