id: concept/takhalluf-an-ghazwat-tabuk
class: concept
kind: social
label: { ar: "التخلف عن غزوة تبوك", en: "Staying behind from the Tabuk expedition", es: "Permanecer atrás de la expedición a Tabuk", fr: "Rester en arrière de l'expédition de Tabuk", ur: "غزوہ تبوک سے پیچھے رہنا", tr: "Tabuk'un Ele Geçirilememesi", id: "Gagal Menangkap Tabuk" }
summary:
  ar: "تصنيف ابن إسحاق لمن لم يخرج مع النبي إلى تبوك: المعذّرون من الأعراب، والبكاؤون الذين لم يجدوا ما يُحملون عليه، ومن تخلف عن غير شك كأبي خيثمة، ومن تخلف من المنافقين وأهل الريب بحسب وصفه."
  en: "Ibn Ishaq's classification of those who did not march with the Prophet to Tabuk: bedouin asking to be excused, the weepers who found no mount, men who stayed behind without doubt such as Abu Khaythama, and the hypocrites and doubters by his description."
  es: "La clasificación que hizo Ibn Ishaq de aquellos que no marcharon con el Profeta a Tabuk: los beduinos que pedían excusas, los llorones que no encontraron montura, los hombres que se quedaron atrás sin dudarlo, como Abu Khaythama, y los hipócritas y escépticos según su descripción."
  fr: "La classification d'Ibn Ishaq de ceux qui n'ont pas marché avec le Prophète jusqu'à Tabuk: les bédouins demandant à être excusés, les pleureuses qui n'ont pas trouvé de monture, les hommes qui sont restés en arrière sans aucun doute comme Abu Khaythama, et les hypocrites et les sceptiques selon sa description."
  ur: "ابن اسحاق کی ان لوگوں کی درجہ بندی جنہوں نے نبی کے ساتھ تبوک کی طرف کوچ نہیں کیا: عذر مانگنے والے بدو، رونے والے جن کو کوئی پہاڑ نہیں ملا، وہ لوگ جو بغیر کسی شک و شبہ کے پیچھے رہ گئے جیسے ابو خیثمہ، اور منافقین اور شک کرنے والے اس کی تفصیل سے۔"
  tr: "İbn İshaq'ın Peygamber ile Tabuk'a gitmeyenleri sınıflandırması: affedilen bedeviler, destek bulamayan ağlayanlar, Ebu Haytizma gibi kesinlikle geride kalanlar ve onun tarifine göre ikiyüzlüler ve şüpheciler arasında kalanlar."
  id: "Klasifikasi Ibn Ishaq tentang mereka yang tidak pergi bersama Nabi ke Tabuk: orang Badui yang dimaafkan, para penangis yang tidak menemukan apa pun untuk mendukung mereka, mereka yang jelas tertinggal seperti Abu Khaythama, dan mereka yang tetap tinggal di antara para munafik dan orang yang ragu menurut deskripsinya."
