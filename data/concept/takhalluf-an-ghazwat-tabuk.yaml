id: concept/takhalluf-an-ghazwat-tabuk
class: concept
kind: social
label: { ar: "التخلف عن غزوة تبوك", en: "Staying behind from the Tabuk expedition", es: "Permanecer atrás de la expedición a Tabuk", fr: "Rester en arrière de l'expédition de Tabuk" }
summary:
  ar: "تصنيف ابن إسحاق لمن لم يخرج مع النبي إلى تبوك: المعذّرون من الأعراب، والبكاؤون الذين لم يجدوا ما يُحملون عليه، ومن تخلف عن غير شك كأبي خيثمة، ومن تخلف من المنافقين وأهل الريب بحسب وصفه."
  en: "Ibn Ishaq's classification of those who did not march with the Prophet to Tabuk: bedouin asking to be excused, the weepers who found no mount, men who stayed behind without doubt such as Abu Khaythama, and the hypocrites and doubters by his description."
  es: "La clasificación que hizo Ibn Ishaq de aquellos que no marcharon con el Profeta a Tabuk: los beduinos que pedían excusas, los llorones que no encontraron montura, los hombres que se quedaron atrás sin dudarlo, como Abu Khaythama, y los hipócritas y escépticos según su descripción."
  fr: "La classification d'Ibn Ishaq de ceux qui n'ont pas marché avec le Prophète jusqu'à Tabuk: les bédouins demandant à être excusés, les pleureuses qui n'ont pas trouvé de monture, les hommes qui sont restés en arrière sans aucun doute comme Abu Khaythama, et les hypocrites et les sceptiques selon sa description."
