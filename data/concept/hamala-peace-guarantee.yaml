class: concept
kind: legal
label: { ar: "الحَمالة", en: "Hamala (bearing a debt to end a feud)", ur: "حمالہ (صلح کے لیے ضمانت)" }
summary:
  ar: "الحَمالة بفتح الحاء الدية والغرامة يتحملها الإنسان عن غيره، واصطلاحا ما يلتزمه في ذمته بالاستدانة ليدفعه في إصلاح ذات البين بين فريقين وقعت بينهما دماء أو أموال. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7288} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7289} والضمان أعم من الحمالة، لأن الحمالة ضمان الدية وغيرها لإصلاح ذات البين. والكفالة عند الحنفية ضم ذمة الكفيل إلى ذمة الأصيل في المطالبة، وعند الجمهور التزام بإحضار البدن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7289} والحمالة مشروعة لا خلاف فيها، وهي من مكارم الأخلاق، وكانت العرب تعرفها، ومستندها قوله تعالى في سورة الأنفال: فاتقوا الله وأصلحوا ذات بينكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7289} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7290} ويجوز دفع الزكاة للحميل المستدين لإصلاح ذات البين إذا كان فقيرا عند الحنفية، وعند المالكية والشافعية والحنابلة يعطى من سهم الغارمين ولو كان غنيا، ويكون ذلك فيما يجحف بماله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7290} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7291} ويجوز للمتحمل عند جمهور الفقهاء أن يسأل حتى يؤدي ما تحمله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7291} "
  en: "Hamala is the blood-money or fine a person bears for another; technically it is the debt a man undertakes to pay in order to end a feud between two groups in which lives or property have been lost. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7288} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7289} Guarantee (daman) is wider than hamala, which is guarantee of blood-money or other sums for the sake of peace; kafala is for the Hanafis the joining of the surety's liability to the principal's, and for most jurists an undertaking to produce the person. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7289} Hamala is lawful beyond dispute and counted among the noble acts; the Arabs knew it, and its basis is the Quranic command to fear God and mend relations among believers. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7289} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7290} Zakat may go to a hamil who borrowed to end a feud: the Hanafis require him to be poor; the Malikis, Shafiis and Hanbalis give him from the share of debtors even if rich, where the burden is crushing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7290} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7291} Most jurists allow the bearer of a hamala to ask others for help until he has paid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7291} "
  ur: "حمالہ لغت میں اس دیت یا تاوان کو کہتے ہیں جو آدمی کسی دوسرے کی طرف سے اٹھائے؛ اصطلاحاً وہ قرض ہے جو آدمی باہمی جھگڑے کو ختم کرنے کے لیے اپنے ذمہ لے، جب دو گروہوں میں جان یا مال کا نقصان ہو چکا ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7288} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7289} ضمان حمالہ سے عام ہے، کیونکہ حمالہ اصلاحِ ذات البین کے لیے دیت وغیرہ کی ضمانت ہے۔ حنفیہ کے نزدیک کفالہ میں کفیل کا ذمہ اصیل کے ذمے کے ساتھ مطالبے میں شامل ہوتا ہے، جبکہ جمہور کے نزدیک یہ بدن کو حاضر کرنے کا التزام ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7289} حمالہ بلا اختلاف مشروع ہے اور مکارمِ اخلاق میں سے ہے؛ عرب اسے جانتے تھے، اور اس کی بنیاد سورۂ انفال کا حکم ہے کہ اللہ سے ڈرو اور آپس کے تعلقات درست کرو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7289} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7290} حنفیہ کے نزدیک صلح کے لیے قرض لینے والے حمیل کو زکوٰۃ اسی وقت دی جائے گی جب وہ فقیر ہو؛ مالکیہ، شافعیہ اور حنابلہ اسے غارمین کے حصے سے دینے کے قائل ہیں چاہے وہ غنی ہو، جب بوجھ اس کے مال پر بھاری ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7290} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7291} جمہور فقہاء کے نزدیک حمالہ اٹھانے والا ادائیگی تک لوگوں سے سوال کر سکتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7291} "
