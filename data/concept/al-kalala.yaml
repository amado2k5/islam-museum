id: concept/al-kalala
class: concept
kind: legal
label:
  ar: "الكلالة"
  en: "Kalala (collateral heirs)"
  ur: "کلالہ"
summary:
  ar: "الكلالة عند الشعراوي من لا أصل للمتوفى فيهم ولا فرع، والإخوة هم موضع الحكم فيها. وهو يفرّق بين الإخوة لأم، وحكمهم السدس للواحد والثلث للجماعة، وبين الإخوة الأشقاء أو لأب، وحكمهم أن الأختين تأخذان الثلثين، ويرى أن ذلك يجيب عمن يظن تعارض الآيات {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2028}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2031}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2032}."
  en: "For al-Sha'rawi, kalala are the collateral heirs of a deceased person who has neither ascendant nor descendant, and the rule concerns siblings. He separates uterine siblings, who take a sixth alone and share a third when more than one, from full or paternal siblings, for whom two sisters take two-thirds, and he holds that the separation answers the claim that the verses contradict each other {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2028}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2031}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2032}."
  ur: "شعراوی کے نزدیک کلالہ وہ وارث ہیں جن کا میت کے ساتھ نہ کوئی اصل ہو نہ فرع، اور یہاں حکم بہن بھائیوں سے متعلق ہے۔ وہ ماں شریک بہن بھائیوں (ایک چھٹا، زیادہ ہوں تو ایک تہائی) کو سگے یا باپ شریک بہن بھائیوں (دو بہنوں کے لیے دو تہائی) سے الگ کرتے ہیں {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2028}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2031}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2032}۔"
wings: [ideas]
themes: [family-marriage-kinship]
issue:
  ar: "من هم الكلالة، وهل يختلف حكم الإخوة باختلاف الجهة التي يأتون منها؟"
  en: "Who are the kalala, and does the share of siblings change with the side of the family they come from?"
  ur: "کلالہ کون ہیں، اور کیا بہن بھائیوں کا حصہ ان کی جہت کے لحاظ سے بدلتا ہے؟"
perspectives:
  - tradition: sunni
    id: sunni-sharawi-two-kalala
    stance:
      ar: "حكم الكلالة يختلف بحسب جهة الإخوة: لأم، أو لأب وأم، أو لأب"
      en: "The share of kalala differs by the side of the siblings: uterine, full, or paternal"
      ur: "کلالہ کا حصہ بہن بھائیوں کی جہت کے مطابق مختلف ہے: ماں شریک، سگے یا باپ شریک"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقرر الشعراوي أن آية السدس والثلث تتعلق بالإخوة لأم، وأن آية الأختين والثلثين تتعلق بالأشقاء أو لأب، وأن كل حكم في موضعه {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2031}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2032}."
      en: "Sha'rawi holds that the verse of the sixth and the third concerns uterine siblings, and the verse of two sisters with two-thirds concerns full or paternal siblings, each ruling in its place {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2031}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2032}."
      ur: "شعراوی کے مطابق چھٹے اور تہائی والی آیت ماں شریک بہن بھائیوں سے متعلق ہے، اور دو بہنوں کے دو تہائی والی آیت سگے یا باپ شریک بہن بھائیوں سے، ہر حکم اپنی جگہ پر ہے {cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2031}{cite:tafsir-sharawi-khawatir-scan-vol-2 p. 2032}۔"
    sources: [source/tafsir-sharawi-khawatir-scan-vol-2]
