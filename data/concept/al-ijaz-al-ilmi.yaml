- tradition: sunni
  id: presenter-rules-and-body
  stance:
    ar: "رأي المقدّم: وسيلة دعوية فعالة يحبها، بشرط ضوابط وجهة محكَّمة وألا يُفسَّر ثابت بنظرية"
    en: "The presenter's view: an effective means of da'wa he loves, on condition of rules, an accredited body, and never explaining the fixed by a theory"
    ur: "میزبان کی رائے: دعوت کا مؤثر ذریعہ جسے وہ پسند کرتے ہیں، بشرطیکہ ضوابط ہوں، مستند ادارہ ہو، اور ثابت کی تفسیر نظریے سے نہ ہو"
  summary:
    ar: "رأي طارق السويدان (رأي المتحدث): إذا كان النص واضحاً والعلم ثابتاً فلن يتعارضا؛ ولا يجوز تفسير نص واضح بنظرية، كاعتراضه على تفسير الرتق والفتق بالانفجار العظيم لأنه عنده نظرية؛ وإذا كانت الآية تحتمل والعلم ثابت فُسِّر المحتمل بالثابت؛ ويُشترط في الحديث أن يكون صحيحاً؛ ودعا إلى ألا يُترك التفسير لفرد وأن يُعرض على هيئة علمية محكَّمة {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 01:04:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 01:14:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 01:15:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 01:16:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 01:16:30}."
    en: "Tareq al-Suwaidan's view (speaker's opinion): if the text is clear and the science established, they will not conflict; a clear text must not be explained by a theory, which is why he objected to reading the verse on the heavens and the earth being joined and then parted as the Big Bang, a theory in his view; where the verse bears several meanings and the science is established, the open meaning is explained by the established one; a hadith must be sound; and no individual should be left to interpret alone, but should submit the work to an accredited scholarly body {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 01:04:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 01:14:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 01:15:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 01:16:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 01:16:30}."
    ur: "طارق السویدان کی رائے (مقرر کی رائے): اگر نص واضح اور سائنس ثابت ہو تو ٹکراؤ نہیں ہوگا؛ واضح نص کی تفسیر نظریے سے جائز نہیں، اسی لیے انہوں نے «رتق و فتق» کی آیت کو بگ بینگ پر محمول کرنے پر اعتراض کیا کیونکہ ان کے نزدیک وہ نظریہ ہے؛ جہاں آیت میں کئی معانی کا احتمال ہو اور سائنس ثابت ہو وہاں محتمل کی تفسیر ثابت سے ہو؛ حدیث کا صحیح ہونا شرط ہے؛ اور تفسیر کسی فرد پر نہ چھوڑی جائے بلکہ ایک مستند علمی ادارے کے سامنے پیش ہو {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 01:04:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 01:15:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 01:16:30}."
