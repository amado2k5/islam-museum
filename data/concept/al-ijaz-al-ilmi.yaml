id: concept/al-ijaz-al-ilmi
class: concept
kind: doctrine
label:
  ar: "الإعجاز العلمي في القرآن والسنة — حقيقة أم مبالغة"
  en: "Scientific miracles in the Qur'an and Sunna — fact or exaggeration"
  ur: "قرآن و سنت میں سائنسی اعجاز — حقیقت یا مبالغہ"
issue:
  ar: "هل في القرآن والسنة إعجاز علمي، وهل تصحّ تسميته إعجازاً، وما مدى فعاليته في الدعوة، وما الضوابط التي تمنع تفسير النص الثابت بعلم متغير؟"
  en: "Do the Qur'an and Sunna contain scientific miracles, is 'miracle' the right name for them, how effective are they in calling people to Islam, and what rules keep a fixed text from being explained by changing science?"
  ur: "کیا قرآن و سنت میں سائنسی اعجاز ہے، کیا اسے اعجاز کہنا درست ہے، دعوت میں یہ کتنا مؤثر ہے، اور کون سے ضوابط ثابت متن کو بدلتی سائنس سے تفسیر کرنے سے روکتے ہیں؟"
summary:
  ar: "حلقة «الوسطية» عن الإعجاز العلمي في القرآن والسنة. صوّت 60% من جمهور الاستوديو أن القرآن مليء بالمعجزات العلمية، و14% أن فيه مبادئ للعلوم فقط، و26% أنه لا يهدف إلى ذلك أصلاً؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 00:08:30} ورأى 55% أن الإعجاز العلمي وسيلة دعوية فعالة جداً و33% أن فعاليته مبالغ فيها؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 00:33:00} وقال 43% ممن يعرفون الموضوع إن بحوثه غير علمية. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 00:50:00} وتحاور فيها زغلول النجار وعلماء من الأزهر ودار الإفتاء، وختم المقدّم بالدعوة إلى ضوابط وجهة علمية محكَّمة. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 01:14:00}"
  en: "The 'Al-Wasatiyya' episode on scientific miracles in the Qur'an and Sunna. Sixty percent of the studio audience voted that the Qur'an is full of scientific miracles, 14% that it holds only principles of the sciences, and 26% that it does not aim at this at all; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 00:08:30} 55% saw scientific miracles as a very effective means of da'wa and 33% saw their effect as exaggerated; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 00:33:00} and 43% of those who knew the subject called its research unscientific. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 00:50:00} Zaghloul al-Najjar and scholars from al-Azhar and Dar al-Ifta debated, and the presenter closed by calling for rules and an accredited scholarly body. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 01:14:00}"
  ur: "قرآن و سنت میں سائنسی اعجاز پر «الوسطیہ» کی قسط۔ اسٹوڈیو حاضرین میں سے 60% نے ووٹ دیا کہ قرآن سائنسی معجزات سے بھرا ہے، 14% نے کہ اس میں صرف علوم کے اصول ہیں، اور 26% نے کہ اس کا یہ مقصد ہی نہیں؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 00:08:30} 55% نے سائنسی اعجاز کو دعوت کا بہت مؤثر ذریعہ اور 33% نے اس کی تاثیر کو مبالغہ کہا؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 00:33:00} اور موضوع سے واقف افراد میں سے 43% نے اس کی تحقیقات کو غیر علمی کہا۔ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 00:50:00} اس میں زغلول النجار اور ازہر و دار الافتاء کے علما نے بحث کی، اور میزبان نے ضوابط اور ایک مستند علمی ادارے کی دعوت پر اختتام کیا۔ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 01:14:00}"
sensitivity: contested
perspectives:
- tradition: sunni
  id: cosmic-verses-need-science
  stance:
    ar: "الإشارات الكونية في القرآن لا تُفهم إلا بتوظيف الحقائق العلمية الثابتة"
    en: "The Qur'an's cosmic indications can only be understood by drawing on established scientific facts"
    ur: "قرآن کے کونی اشارے ثابت سائنسی حقائق کو بروئے کار لائے بغیر سمجھے نہیں جا سکتے"
  summary:
    ar: "رأى زغلول النجار، رئيس هيئة الإعجاز العلمي التابعة للمجلس الأعلى للشؤون الإسلامية في مصر، أن كل أمر في القرآن معجز، وأن أكثر من ألف آية منه إشارات كونية لا تُفهم في إطار اللغة وحدها، وأنها لم تأتِ معلومةً علمية بل استدلالاً على قدرة الخالق؛ وأن القرآن ليس فيه كل علم، وأنه وضع عشرين ضابطاً أهمها ألا يُوظَّف إلا القطعي من الحقائق إلا في آيات الخلق والإفناء والبعث {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 00:15:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 00:16:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 00:17:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 00:18:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 00:19:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 01:05:00}."
    en: "Zaghloul al-Najjar, head of the committee on scientific miracles of Egypt's Supreme Council for Islamic Affairs, held that everything in the Qur'an is miraculous, that more than a thousand of its verses are cosmic indications that cannot be understood within language alone, and that they came not as scientific information but as proof of the Creator's power; the Qur'an does not contain every science, and he set twenty rules, chief among them that only conclusive facts be used, except in the verses on creation, annihilation and resurrection {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 00:15:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 00:16:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 00:17:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 00:18:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 00:19:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 01:05:00}."
    ur: "مصر کی مجلسِ اعلیٰ برائے اسلامی امور کی سائنسی اعجاز کمیٹی کے سربراہ زغلول النجار کے نزدیک قرآن کی ہر چیز معجز ہے، اس کی ہزار سے زیادہ آیات کونی اشارے ہیں جو صرف لغت کے دائرے میں نہیں سمجھی جا سکتیں، اور وہ سائنسی معلومات کے طور پر نہیں بلکہ خالق کی قدرت کی دلیل کے طور پر آئیں؛ قرآن میں ہر علم نہیں، اور انہوں نے بیس ضوابط رکھے جن میں اہم یہ ہے کہ صرف قطعی حقائق استعمال ہوں، سوائے تخلیق، فنا اور بعث کی آیات کے {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 00:15:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 00:17:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 01:05:00}."
  holders: []
  evidence:
  - ref: source/assabile-tareq-al-suwaidan
    note: {en: "al-wassitiya ep33, 00:15:00-00:19:30, 00:39:00-00:41:00, 01:04:30-01:08:30, 01:11:30-01:12:30"}
- tradition: sunni
  id: proofs-not-miracles
  stance:
    ar: "تُسمّى دلائل كونية لا إعجازاً، لأن المعجزة تحدٍّ وإبطال الدليل لا يُبطل المدلول"
    en: "Call them cosmic proofs, not miracles, because a miracle is a challenge, while refuting a proof does not refute what it proves"
    ur: "انہیں کونی دلائل کہا جائے، اعجاز نہیں، کیونکہ معجزہ چیلنج ہے، جبکہ دلیل کا رد مدلول کا رد نہیں"
  summary:
    ar: "رأى عمر الورداني، أمين الفتوى في دار الإفتاء المصرية، أن القرآن تحدث عن حقائق علمية، لكن تسميتها إعجازاً تخرج عن المعنى اللغوي، لأن المعجزة معها تحدٍّ: فإذا بطلت مادة التحدي ظُنّ أن صدق القرآن بطل، أما إذا سُمّيت دلائل فإبطال الدليل لا يستلزم إبطال المدلول؛ وقدّر أن من يسلمون بسبب الإعجاز العلمي لا يتجاوزون 20%، ودعا إلى الإمساك عما لا يُعلم كما فعل السلف {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 00:21:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 00:22:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 00:22:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 00:36:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 01:11:00}."
    en: "Omar al-Wardani, a fatwa secretary at Egypt's Dar al-Ifta, held that the Qur'an does speak of scientific facts, but calling them miracles departs from the word's meaning, because a miracle carries a challenge: if the substance of the challenge fails, people think the Qur'an's truth fails, whereas if they are called proofs, refuting a proof does not refute what it proves; he estimated that those who convert because of scientific miracles are no more than 20%, and urged restraint about what is not known, as the early generations practised {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 00:21:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 00:22:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 00:22:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 00:36:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 01:11:00}."
    ur: "دار الافتاء مصر کے امینِ فتویٰ عمر الوردانی کے نزدیک قرآن سائنسی حقائق کا ذکر کرتا ہے، مگر انہیں اعجاز کہنا لفظ کے معنی سے ہٹنا ہے، کیونکہ معجزے کے ساتھ چیلنج ہوتا ہے: اگر چیلنج کا مواد غلط نکلے تو لوگ سمجھیں گے کہ قرآن کی صداقت گئی، جبکہ دلائل کہنے کی صورت میں دلیل کا رد مدلول کا رد نہیں؛ ان کا اندازہ تھا کہ سائنسی اعجاز کی وجہ سے اسلام لانے والے 20% سے زیادہ نہیں، اور انہوں نے سلف کی طرح نامعلوم امور میں توقف کی دعوت دی {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 00:21:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 00:22:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 00:36:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 01:11:00}."
