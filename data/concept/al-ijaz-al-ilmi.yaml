- tradition: sunni
  id: rhetorical-first-partnership
  stance:
    ar: "التحدي الأصلي بالبيان، والإشارات العلمية جاءت في تراكيب بلاغية فتحتاج شراكة بين اللغوي والعالِم"
    en: "The original challenge is eloquence; the scientific indications come in rhetorical structures, so linguist and scientist must work together"
    ur: "اصل چیلنج بیان کا ہے؛ سائنسی اشارے بلاغی ترکیبوں میں آئے، اس لیے ماہرِ لغت اور سائنس دان کو مل کر کام کرنا ہوگا"
  summary:
    ar: "رأى أستاذا البلاغة في جامعة الأزهر بسيوني عبد الفتاح وإبراهيم الهدهد أن القرآن تحدّى العرب ببيانه، وأن الإعجاز العلمي رافد من روافد الإعجاز البلاغي يقوم على الإخبار بالحقيقة قبل اكتشافها على لسان نبي أمي؛ وأقرّ الهدهد بوقوع تكلّف وتفسير قسري للغة عند بعض المتخصصين في العلوم، ودعا إلى شراكة بين عالم اللغة وعالم الكون {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 00:12:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 00:14:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 00:50:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 00:51:30}."
    en: "The two professors of rhetoric at al-Azhar University, Bassiouni Abd al-Fattah and Ibrahim al-Hudhud, held that the Qur'an challenged the Arabs with its eloquence, and that scientific miracles are a tributary of rhetorical inimitability, resting on reporting a fact before its discovery through an unlettered prophet; al-Hudhud acknowledged strained and forced readings of the language by some science specialists and called for a partnership between the linguist and the scientist {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 00:12:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 00:14:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 00:50:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 00:51:30}."
    ur: "جامعہ ازہر کے دو اساتذۂ بلاغت بسیونی عبد الفتاح اور ابراہیم الہدہد کے نزدیک قرآن نے عربوں کو اپنے بیان سے چیلنج کیا، اور سائنسی اعجاز بلاغی اعجاز کی ایک شاخ ہے جو ایک امی نبی کی زبان سے حقیقت کی دریافت سے پہلے اس کی خبر دینے پر قائم ہے؛ الہدہد نے بعض سائنسی ماہرین کے ہاں لغت کی تکلف آمیز اور جبری تاویل کا اعتراف کیا اور ماہرِ لغت و ماہرِ کونیات کی شراکت کی دعوت دی {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 00:12:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 00:14:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep33 00:51:30}."
