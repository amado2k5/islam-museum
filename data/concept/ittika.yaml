class: concept
kind: legal
label: { ar: "اتكاء", en: "Leaning (ittika')", es: "Inclinación (ittika')", fr: "S'incliner (ittika')", ur: "جھکاؤ ⁦(اٹکا)⁩", tr: "Eğilmek", id: "Condong" }
summary:
  ar: "الاتكاء في اللغة الاعتماد على شيء، وله معنى ثانٍ هو الميل في القعود إلى أحد الشقين، ولا يخرج استعمال الفقهاء عن هذين المعنيين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1488} الاتكاء في الصلاة جائز عند الفقهاء لأهل الأعذار، ويكره لغيرهم في الفريضة ويجوز في النافلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1488} والاتكاء على القبر كالجلوس عليه، والجمهور على كراهته، وخالف المالكية فأجازوه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1488}"
  en: "Ittika' in the lexicon means leaning on something; it also means inclining to one side while sitting. Jurists use the word only in these two senses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1488} Leaning during prayer is permitted for those with a valid excuse; for others it is disliked in an obligatory prayer and permitted in a voluntary one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1488} Leaning on a grave is treated like sitting on it: the majority hold it disliked, while the Malikis permit it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1488}"
  es: "Ittika' en el léxico significa apoyarse en algo; también significa inclinarse hacia un lado estando sentado. Los juristas usan la palabra solo en estos dos sentidos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1488} Apoyarse durante la oración está permitido para quienes tienen una excusa válida; para los demás, es desaconsejable en una oración obligatoria y permitido en una voluntaria. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1488} Apoyarse en una tumba se considera como sentarse en ella: la mayoría lo considera desaconsejable, mientras que los malikíes lo permiten. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1488}"
  fr: "Dans le lexique, « ittika » signifie s'appuyer sur quelque chose; il signifie également s'incliner d'un côté en position assise. Les juristes n'emploient ce mot que dans ces deux sens. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1488} S'appuyer pendant la prière est permis pour ceux qui ont une excuse valable; pour les autres, c'est déconseillé dans une prière obligatoire et permis dans une prière surérogatoire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1488} S'appuyer sur une tombe est assimilé au fait de s'asseoir dessus: la majorité le déconseille, tandis que les malikites l'autorisent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1488}"
  ur: "لغت میں اعتکا کا مطلب ہے کسی چیز پر ٹیک لگانا۔ اس کا مطلب بیٹھتے وقت ایک طرف جھکنا بھی ہے۔ فقہاء اس لفظ کو صرف ان دو معنوں میں استعمال کرتے ہیں۔ {حوالہ: فقہ الموسوعۃ النور-v3 ص 1488} نماز کے دوران ٹیک لگانا جائز عذر والوں کے لیے جائز ہے۔ دوسروں کے لیے فرض نماز میں ناپسندیدہ اور نفلی نماز میں جائز ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 1488} قبر پر ٹیک لگانا اس پر بیٹھنے کے مترادف ہے: اکثریت اسے ناپسند کرتی ہے جبکہ مالکی اس کی اجازت دیتے ہیں۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص1488}"
  tr: "Dilsel olarak eğilmek, bir şeye dayanmak anlamına gelir ve ikinci bir anlamı vardır: iki taraftan birine oturma eğilimi ve hukukçuların kullanımı bu iki anlamın ötesine geçmez. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.1488} Hukukçulara göre duada yaslanmak, mazeretleri olanlar için izinlidir, başkaları için zorunlu namazlarda ve gönüllü dualarda kabul edilmez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1488} Mezara yaslanmak oturmak gibidir ve çoğunluk bundan hoşlanmaz, Malikiler buna katılmadı ve izin verdiler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1488}"
  id: "Condong secara linguistik berarti bergantung pada sesuatu, dan memiliki makna kedua: kecenderungan duduk di salah satu dari dua sisi, dan penggunaan kata ahli hukum tidak melampaui dua makna tersebut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1488} Bersandar dalam doa diperbolehkan menurut ahli hukum bagi mereka yang memiliki alasan, dan tidak disukai oleh orang lain dalam doa wajib dan diperbolehkan dalam doa sukarela. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1488} Dan bersandar pada makam itu seperti duduk di atasnya, dan mayoritas tidak menyukainya, dan orang Malik tidak setuju dan mereka mengizinkannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1488}"
