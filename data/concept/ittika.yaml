label: { ar: "اتكاء", en: "Leaning (ittika')" }
summary:
  ar: "الاتكاء في اللغة الاعتماد على شيء، وله معنى ثانٍ هو الميل في القعود إلى أحد الشقين، ولا يخرج استعمال الفقهاء عن هذين المعنيين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1488} الاتكاء في الصلاة جائز عند الفقهاء لأهل الأعذار، ويكره لغيرهم في الفريضة ويجوز في النافلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1488} والاتكاء على القبر كالجلوس عليه، والجمهور على كراهته، وخالف المالكية فأجازوه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1488}"
  en: "Ittika' in the lexicon means leaning on something; it also means inclining to one side while sitting. Jurists use the word only in these two senses. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1488} Leaning during prayer is permitted for those with a valid excuse; for others it is disliked in an obligatory prayer and permitted in a voluntary one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1488} Leaning on a grave is treated like sitting on it: the majority hold it disliked, while the Malikis permit it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1488}"
