label: { ar: "النَّقْش", en: "Naqsh (engraving and decoration)", ur: "نقش (کندہ کاری اور آرائش)" }
summary:
  ar: "النقش في اللغة الأثر، وتلوين الشيء بلونين أو ألوان، وهو أعم من التزويق والزخرفة، وكل ختم نقش. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15975} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15976} ويندب للحاكم اتخاذ خاتم منقوش، ويجوز عند الجمهور نقش اسم صاحبه، وكره الحنابلة نقش لفظ الجلالة، ومنع الحنفية نقش الصور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15976} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15977} ويكره الجمهور نقش المساجد، وجوزه الحنفية وبعض المالكية والشافعية إذا كان بشيء خفيف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15977} وكره الشافعية والحنابلة زخرفة البيوت بالذهب والفضة، وجوزها الحنفية والمالكية بشروط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15978} وحرم الشافعية نقش يد المحرمة بالحناء، وكره الجمهور الكتابة على القبور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15978}"
  en: "Naqsh, in the lexicon, is a trace or mark, or colouring a thing with two or more colours; it is wider than tazwiq and zakhrafa, and every seal is an engraving. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15975} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15976} A ruler is recommended to have an engraved ring; most jurists allow engraving the owner's name, the Hanbalis dislike engraving the divine name, and the Hanafis forbid pictures. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15976} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15977} Most jurists dislike engraving the mosque; the Hanafis, some Malikis and Shafi'is allow it with light ornament. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15977} The Shafi'is and Hanbalis forbid decorating houses with gold and silver as wasteful; the Hanafis and Malikis allow it with conditions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15978} The Shafi'is forbid henna designs on the hand of a woman in ihram, and most jurists dislike writing on graves. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15978}"
  ur: "نقش لغت میں اثر اور دو یا زیادہ رنگوں سے کسی چیز کو رنگنے کو کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15975} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15976} حاکم کے لیے نقش والی انگوٹھی مستحب ہے، اور جمہور کے نزدیک اپنا نام کندہ کرنا جائز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15976} مساجد کی نقاشی جمہور کے نزدیک مکروہ ہے، جبکہ حنفیہ ہلکی سجاوٹ کی اجازت دیتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15977} قبروں پر لکھنا جمہور کے نزدیک مکروہ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15978}"
