label: { ar: "النَّقْش", en: "Naqsh (engraving and decoration)", ur: "نقش ⁦(کندہ کاری اور آرائش)⁩", es: "Naqsh (grabado y decoración)", fr: "Naqsh (gravure et décoration)", tr: "Gravür", id: "Ukiran" }
summary:
  ar: "النقش في اللغة الأثر، وتلوين الشيء بلونين أو ألوان، وهو أعم من التزويق والزخرفة، وكل ختم نقش. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15975} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15976} ويندب للحاكم اتخاذ خاتم منقوش، ويجوز عند الجمهور نقش اسم صاحبه، وكره الحنابلة نقش لفظ الجلالة، ومنع الحنفية نقش الصور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15976} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15977} ويكره الجمهور نقش المساجد، وجوزه الحنفية وبعض المالكية والشافعية إذا كان بشيء خفيف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15977} وكره الشافعية والحنابلة زخرفة البيوت بالذهب والفضة، وجوزها الحنفية والمالكية بشروط. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15978} وحرم الشافعية نقش يد المحرمة بالحناء، وكره الجمهور الكتابة على القبور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15978}"
  en: "Naqsh, in the lexicon, is a trace or mark, or colouring a thing with two or more colours; it is wider than tazwiq and zakhrafa, and every seal is an engraving. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15975} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15976} A ruler is recommended to have an engraved ring; most jurists allow engraving the owner's name, the Hanbalis dislike engraving the divine name, and the Hanafis forbid pictures. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15976} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15977} Most jurists dislike engraving the mosque; the Hanafis, some Malikis and Shafi'is allow it with light ornament. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15977} The Shafi'is and Hanbalis forbid decorating houses with gold and silver as wasteful; the Hanafis and Malikis allow it with conditions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15978} The Shafi'is forbid henna designs on the hand of a woman in ihram, and most jurists dislike writing on graves. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15978}"
  ur: "نقش لغت میں اثر اور دو یا زیادہ رنگوں سے کسی چیز کو رنگنے کو کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15975} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15976} حاکم کے لیے نقش والی انگوٹھی مستحب ہے، اور جمہور کے نزدیک اپنا نام کندہ کرنا جائز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15976} مساجد کی نقاشی جمہور کے نزدیک مکروہ ہے، جبکہ حنفیہ ہلکی سجاوٹ کی اجازت دیتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15977} قبروں پر لکھنا جمہور کے نزدیک مکروہ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15978}"
  es: "Naqsh, en el léxico, es un rastro o marca, o colorear una cosa con dos o más colores; es más amplio que tazwiq y zakhrafa, y cada sello es un grabado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15975} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15976} Se recomienda que un gobernante tenga un anillo grabado; la mayoría de los juristas permiten grabar el nombre del propietario, a los hanbalíes no les gusta grabar el nombre divino, y los hanafíes prohíben las imágenes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15976} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15977} A la mayoría de los juristas no les gusta grabar la mezquita; los hanafíes, algunos malikíes y shafiíes lo permiten con un ligero ornamento. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15977} Los shafi'ís y los hanbalíes prohíben decorar las casas con oro y plata por considerarlo un derroche; los hanafíes y los malikíes lo permiten con ciertas condiciones. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15978} Los shafi'ís prohíben los diseños de henna en la mano de una mujer en ihram, y la mayoría de los juristas desaprueban escribir en las tumbas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15978}"
  fr: "Le terme « naqsh », dans le lexique, désigne une trace, une marque ou le fait de colorier un objet avec deux couleurs ou plus; il est plus large que « tazwiq » et « zakhrafa », et tout sceau est une gravure. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15975} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15976} Il est recommandé à un souverain de porter une bague gravée; la plupart des juristes autorisent la gravure du nom du propriétaire, les hanbalites désapprouvent la gravure du nom divin et les hanafites interdisent les images. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15976} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15977} La plupart des juristes désapprouvent la gravure de la mosquée; les hanafites, certains malikites et chaféites l'autorisent avec une ornementation légère. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15977} Les chaféites et les hanbalites interdisent de décorer les maisons avec de l'or et de l'argent, considérant cela comme un gaspillage; les hanafites et les malikites l'autorisent sous certaines conditions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15978} Les chaféites interdisent les dessins au henné sur la main d'une femme en état d'ihram, et la plupart des juristes désapprouvent les inscriptions sur les tombes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15978}"
  tr: "Dilde yazıt, bir şeyi iki renk veya renkle boyandıran sanat eseridir; bu, süsleme ve süslemeden daha geniştir ve her mühür bir yazıttır. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.15975}} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15976} Hükümdarın oyma yüzük takması tavsiye edilir. Çoğunluk arasında sahibinin adının yazılması caizdir, ancak Hanbaliler 'Al-Jala' kelimesini yazmaktan hoşlanmaz ve Hanafiler gravür resimlerini yasaklar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15976} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15977} Çoğunluk cami oymacılığından hoşlanmaz; Hanefiler, bazı Malikiler ve Şafiiler ise hafif olduğu sürece buna izin verir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15977} Şafiiler ve Hanbaliler, evleri altın ve gümüşle süslemekten hoşlanmaz, Hanafi ve Malikilerin belirli koşullar altında buna izin vermesine izin vermişlerdir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15978} Şafiiler, yasak bir yere kına kazınan bir kadının eline kına kazımayı yasaklardı ve çoğunluk mezarlara yazı yazmaktan hoşlanmazdı. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15978}"
  id: "Dalam bahasa ini, inskripsi adalah karya seni, mewarnai sesuatu dengan dua warna atau warna, yang lebih luas daripada dekorasi dan dekorasi, dan setiap segel adalah sebuah prasasti. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15975} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15976} Disarankan agar penguasa mengenakan cincin yang diukir. Di antara mayoritas, nama pemiliknya diperbolehkan, sementara Hanbal tidak suka menulis kata 'Al-Jala', dan Hanafi melarang gambar yang diukir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15976} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15977} Mayoritas tidak suka ukiran masjid, dan Hanafi, beberapa Maliki, dan Shafi'i mengizinkannya jika cahaya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15977} Syafi'i dan Hanbal tidak suka menghias rumah dengan emas dan perak, dan mengizinkan Hanafi dan Malik mengizinkannya dengan syarat tertentu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15978} Para Shafi'i melarang menulis tangan seorang wanita di tempat terlarang dengan henna, dan mayoritas tidak suka menulis di makam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15978}"
