summary:
  ar: "نملة وادي النمل خاطبت قومها فحذّرتهم من جيش سليمان فتبسّم ضاحكاً من قولها، وسمّيت سورة النمل بها، ونهى النبي عن قتلها مع النحل والهدهد والصرد."
  en: "An ant in the Valley of the Ants warned its people of Solomon's army and he smiled at her words; the surah of the Ant is named for her, and the Prophet forbade killing her with the bee, the hoopoe and the shrike."
  ur: "وادیِ نمل کی چیونٹی نے اپنے ساتھیوں کو سلیمان کے لشکر سے خبردار کیا اور وہ اس کے کہنے پر ہنس پڑے؛ سورۃ النمل اسی کے نام پر ہے اور نبی نے مکھی، ہدہد اور صرد کے ساتھ اس کا قتل منع فرمایا۔"
