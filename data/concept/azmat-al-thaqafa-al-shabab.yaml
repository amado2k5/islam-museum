id: concept/azmat-al-thaqafa-al-shabab
class: concept
kind: social
label:
  ar: "أزمة الثقافة لدى الشباب"
  en: "The youth cultural crisis"
issue:
  ar: "هل يعاني شباب الأمة أزمة ثقافية حقيقية، وهل الفضائيات والإنترنت سببها أم عارضها، وأين الإصلاح؟"
summary:
  ar: "حلقة «الوسطية» عن الأزمة الثقافية لدى الشباب. صوّت 71% أن لدى الشباب أزمة ثقافية حقيقية؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep18 00:06:00} وانقسموا على أثر الفضائيات والإنترنت: 47% يرون الثقافة ضعفت بعدهما و43% يرونها تحسنت؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep18 00:35:30} ومن أرقام الحلقة: 4% فقط من الفتيات يقرأن الكتب مقابل 96% مجلات (دراسة سعودية)، و6-8 ساعات يومياً أمام الشاشتين؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep18 00:31:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep18 00:39:30} و30% يرون الإصلاح في التعليم و7% فقط في المثقفين {cite:assabile-tareq-al-suwaidan al-wassitiya/ep18 00:59:00}."
  en: "The 'Al-Wasatiyya' episode on the youth cultural crisis. Seventy-one percent voted that the youth suffer a real cultural crisis; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep18 00:06:00} and they split on the satellite-and-internet effect: 47% saw culture weakened after them, 43% saw it improved; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep18 00:35:30} from the episode's figures: only 4% of girls read books against 96% magazines (a Saudi study), and 6-8 hours daily before the two screens; {cite:assabile-tareq-al-suwaidan al-wassitiya/ep18 00:31:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep18 00:39:30} and 30% placed the remedy in education, only 7% in the intellectuals {cite:assabile-tareq-al-suwaidan al-wassitiya/ep18 00:59:00}."
