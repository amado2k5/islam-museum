id: concept/al-muqarana-bayna-lahajat-al-arabiyya
class: concept
kind: term
tags: [arabiyya-browser, arabiyya-dialects]
label:
  ar: "المقارنة بين لهجات العربية"
  en: "A comparison of Arabic dialects"
  ur: "عربی بولیوں کا موازنہ"
  fr: "Comparaison des dialectes arabes"
  es: "Comparación de los dialectos árabes"
summary:
  ar: "مقارنة جنباً إلى جنب بين الفصحى المعاصرة وست لهجات عربية، المصرية والشامية والخليجية والحجازية والدارجة المغربية واليمنية، في أربع عبارات: كيف حالك، وماذا تريد، واثنان، وثلاثة، كما وردت في ملخص بحثي قُدّم إلى المتحف، مع مراجع متخصصة في كل لهجة. لم يفتح المتحف الصفحات التي يستشهد بها."
  en: "A side-by-side comparison of Modern Standard Arabic and six Arabic dialects, Egyptian, Levantine, Gulf, Hijazi, Moroccan Darija and Yemeni, in four expressions: how are you, what do you want, two and three, as given in a research summary supplied to the museum, with specialist reference works for each dialect. The museum did not open the pages it cites."
  ur: "جدید معیاری عربی اور چھ عربی بولیوں، مصری، شامی، خلیجی، حجازی، مراکشی دارجہ اور یمنی، کا چار جملوں میں ساتھ ساتھ موازنہ: آپ کیسے ہیں، آپ کیا چاہتے ہیں، دو اور تین، جیسا عجائب گھر کو دیے گئے ایک تحقیقی خلاصے میں آیا، ہر بولی کے ماہرانہ مراجع کے ساتھ۔ عجائب گھر نے جن صفحات کا حوالہ دیا انہیں نہیں کھولا۔"
  fr: "Une comparaison côte à côte de l'arabe standard moderne et de six dialectes arabes, égyptien, levantin, du Golfe, hijazi, darija marocaine et yéménite, sur quatre expressions : comment allez-vous, que voulez-vous, deux et trois, telle que donnée dans un résumé de recherche remis au musée, avec des ouvrages de référence spécialisés pour chaque dialecte. Le musée n'a pas ouvert les pages qu'il cite."
  es: "Una comparación lado a lado del árabe estándar moderno y seis dialectos árabes, egipcio, levantino, del Golfo, hiyazí, darija marroquí y yemení, en cuatro expresiones: cómo estás, qué quieres, dos y tres, tal como la da un resumen de investigación entregado al museo, con obras de referencia especializadas para cada dialecto. El museo no abrió las páginas que cita."
