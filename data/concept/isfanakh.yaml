id: concept/isfanakh
class: concept
kind: natural
label:
  ar: "إسفاناخ"
  en: "Isfanakh (spinach)"
  ur: "اسفاناخ ⁦(پالک)⁩"
  es: "Isfanakh (espinacas)"
  fr: "Isfanakh (épinards)"
  tr: "İsfanach"
  id: "Isfanach"
summary:
  ar: "السبانخ، وهو بارد رطب في آخر الأولى، مُليّن للبطن، ينفع الصدر والرئة الحارة أكلاً وطلاءً، وأوجاع الظهر الدموية {cite:canon-ibn-sina-print-v1 p.375} {cite:canon-ibn-sina-print-v1 p.376}."
  en: "Spinach, cold and moist at the end of the first degree. It is a laxative, helps hot chest and lung complaints when eaten or applied, and helps back pains that arise from blood {cite:canon-ibn-sina-print-v1 p.375} {cite:canon-ibn-sina-print-v1 p.376}."
  ur: "پالک، جو پہلے درجے کے آخر میں ٹھنڈا اور تر ہے۔ یہ پیٹ نرم کرتا ہے، کھانے اور لیپ دونوں طرح گرم سینے اور پھیپھڑوں کی تکلیف میں نفع دیتا ہے، اور خون سے پیدا ہونے والے کمر کے درد میں مفید ہے {cite:canon-ibn-sina-print-v1 p.375} {cite:canon-ibn-sina-print-v1 p.376}۔"
  es: "Espinacas, frías y húmedas al final del primer grado. Son laxantes, ayudan con las molestias de pecho y pulmones calientes cuando se comen o se aplican, y ayudan con los dolores de espalda que provienen de sangre {cite:canon-ibn-sina-print-v1 p.375} {cite:canon-ibn-sina-print-v1 p.376}."
  fr: "Les épinards, froids et humides à la fin du premier degré. Ils sont laxatifs, soulagent les affections de la poitrine et des poumons lorsqu'ils sont consommés ou appliqués, et aident à soulager les douleurs dorsales d'origine sanguine {cite:canon-ibn-sina-print-v1 p.375} {cite:canon-ibn-sina-print-v1 p.376}."
  tr: "İlk sezonun sonunda soğuk ve nemli olan ıspanak, karın için müshildir; göğüs ve sıcak akciğerler için yeme ve kaplama açısından faydalıdır, ayrıca kanlı sırt ağrısı için {cite:canon-ibn-sina-print-v1 s.375} {cite:canon-ibn-sina-print-v1 s.376}."
  id: "Bayam, yang dingin dan lembap di akhir musim pertama, adalah pencahar untuk perut, bermanfaat untuk dada dan paru-paru panas dalam hal makan dan pelapis, serta untuk nyeri punggung berdarah {cite:canon-ibn-sina-print-v1 hlm.375} {cite:canon-ibn-sina-print-v1 hlm.376}."
