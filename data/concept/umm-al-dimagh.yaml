label: { ar: "أم الدماغ", en: "Umm al-dimagh (the membrane over the brain, and wounds reaching it)" }
summary:
  ar: "أم الدماغ الجلدة التي تحت العظم فوق الدماغ، والشجة التي تصل إليها دون أن تخرقها تسمى آمة ومأمومة، وفيها ثلث الدية، ولا قصاص فيها عند الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3401}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3402} وإن خرقتها سميت الدامغة، وفيها آراء، وتتعلق بها أحكام الصيام إذا وصل إليها شيء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3402}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3403}"
  en: "Umm al-dimagh is the membrane under the bone above the brain. A wound that reaches it without piercing it is called amma and ma'muma, and carries a third of the diya, with no retaliation according to the jurists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3401}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3402} A wound that pierces it is called damigha, and the jurists give several views on it; the membrane also bears on the fast, if something reaches it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3402}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3403}"
