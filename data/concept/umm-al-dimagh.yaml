label: { ar: "أم الدماغ", en: "Umm al-dimagh (the membrane over the brain, and wounds reaching it)", es: "Umm al-dimagh (la membrana que recubre el cerebro y las heridas que la alcanzan)", fr: "Umm al-dimagh (la membrane recouvrant le cerveau et les blessures l'atteignant)", ur: "ام الدماغ ⁦(دماغ کے اوپر کی جھلی، اور اس تک پہنچنے والے زخم)⁩", tr: "Beynin annesi", id: "Ibu otak" }
summary:
  ar: "أم الدماغ الجلدة التي تحت العظم فوق الدماغ، والشجة التي تصل إليها دون أن تخرقها تسمى آمة ومأمومة، وفيها ثلث الدية، ولا قصاص فيها عند الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3401}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3402} وإن خرقتها سميت الدامغة، وفيها آراء، وتتعلق بها أحكام الصيام إذا وصل إليها شيء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3402}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3403}"
  en: "Umm al-dimagh is the membrane under the bone above the brain. A wound that reaches it without piercing it is called amma and ma'muma, and carries a third of the diya, with no retaliation according to the jurists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3401}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3402} A wound that pierces it is called damigha, and the jurists give several views on it; the membrane also bears on the fast, if something reaches it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3402}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3403}"
  es: "Umm al-dimagh es la membrana que se encuentra debajo del hueso, encima del cerebro. Una herida que la alcanza sin perforarla se denomina amma y ma'muma, y conlleva un tercio del ayuno, sin represalias según los juristas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3401}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3402} Una herida que la perfora se denomina damigha, y los juristas ofrecen diversas opiniones al respecto; la membrana también afecta al ayuno si algo la alcanza. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3402}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3403}"
  fr: "L'umm al-dimagh est la membrane située sous l'os au-dessus du cerveau. Une blessure qui l'atteint sans la perforer est appelée amma ou ma'muma et porte un tiers de la diya, sans représailles selon les juristes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3401}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3402} Une blessure qui la perfore est appelée damigha, et les juristes émettent plusieurs avis à ce sujet; la membrane porte également sur le jeûne, si quelque chose l'atteint. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3402}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3403}"
  ur: "ام الدماغ دماغ کے اوپر ہڈی کے نیچے کی جھلی ہے۔ ایسا زخم جو بغیر چھیدے اس تک پہنچ جائے اسے عمامہ اور مامومہ کہتے ہیں اور اس میں ایک تہائی دیا ہوتا ہے، فقہاء کے نزدیک کوئی انتقام نہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.3401}{cite:fiqh-masua-kuwaitiyya-noor-v3 p.3402} ایک زخم جو اسے چھیدتا ہے اسے دمیضہ کہتے ہیں، اور فقہاء اس پر متعدد آراء پیش کرتے ہیں۔ اگر کوئی چیز اس تک پہنچ جائے تو جھلی بھی روزے کو برداشت کرتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3402}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3403}"
  tr: "um al-'Ghreh', beynin üzerindeki kemiğin altında kalan deridir ve ona ulaşan deriye 'ümmet' veya 'ma'ummah' denir, kan parasının üçte birini taşır ve hukukçulara göre ceza yoktur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3401} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3402} Kırarsanız, 'al-damghah' denir ve içinde görüşler bulunur, oruç kuralları ise oraya ulaşırsa geçerlidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3402} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3403}"
  id: "um al-'Ghreh' adalah kulit yang terletak di bawah tulang di atas otak, dan kulit yang sampai ke tulang tanpa patah disebut 'ummah' atau 'ma'ummah', dan membawa sepertiga uang darah, dan menurut para ahli hukum tidak ada pembalasan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3401} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3402} Jika kamu melanggarnya, itu disebut 'al-damghah,' dan berisi pendapat, dan aturan puasa berlaku jika sesuatu sampai padanya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3402} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3403}"
