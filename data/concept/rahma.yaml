id: concept/rahma
class: concept
kind: ethical
label:
  ar: "الرحمة"
  en: "Mercy (rahma)"
  ur: "رحمت"
summary:
  ar: "الرحمة في تعليم الشيخ عمر عبد الكافي أصل تقوم عليه معاملة المسلم للناس وللحيوان؛ تطمئن بها النفس وتقوى بها الرجاء. كتب الله الرحمة على نفسه، ورحمته في الدنيا تشمل المؤمن والكافر، وفي الآخرة تتجلى على من رحم عباده. ومن صورها الإحسان إلى الفقير والوالدين والأقارب والجار والزوجة، والرفق بالذبيحة."
  en: "In Sheikh Omar Abdelkafy's lessons, mercy is the principle that governs how a Muslim treats people and animals: it calms the soul and keeps hope alive. God is described as having made mercy binding on Himself; His mercy in this world covers believer and unbeliever, and in the Hereafter it is shown to those who were merciful to His servants. Its forms include kindness to the poor, parents, kin, neighbours and spouse, and gentleness in slaughter."
  ur: "شیخ عمر عبدالکافی کے درسوں میں رحمت وہ اصول ہے جو مسلمان کے لوگوں اور جانوروں کے ساتھ برتاؤ کو طے کرتا ہے: یہ دل کو سکون دیتی ہے اور امید زندہ رکھتی ہے۔ اللہ نے رحمت کو اپنے اوپر لازم کیا؛ دنیا میں اس کی رحمت مومن اور کافر دونوں کو شامل ہے، اور آخرت میں یہ ان پر ظاہر ہوگی جنہوں نے اللہ کے بندوں پر رحم کیا۔ اس کی صورتوں میں فقیر، والدین، رشتہ داروں، پڑوسیوں اور بیوی کے ساتھ حسنِ سلوک، اور ذبح میں نرمی شامل ہیں۔"
