summary:
  ar: "مثل الجنة التي وعد المتقون فيها أنهار من ماء غير آسن وأنهار من لبن لم يتغير طعمه وأنهار من خمر لذة للشاربين وأنهار من عسل مصفى {cite:tafsir-ibn-kathir}."
  en: "The likeness of the Garden promised to the godfearing: rivers of water never stagnant, rivers of milk whose taste never changes, rivers of wine delightful to drinkers, and rivers of purified honey {cite:tafsir-ibn-kathir}."
