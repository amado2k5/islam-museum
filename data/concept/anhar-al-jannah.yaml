id: concept/anhar-al-jannah
class: concept
kind: belief
label:
  ar: أنهار الجنة
  en: The rivers of Paradise
  fr: "Les fleuves du Paradis"
  ur: جنت کی نہریں
  es: "Los ríos del Paraíso"
summary:
  ar: "مثل الجنة التي وعد المتقون فيها أنهار من ماء غير آسن وأنهار من لبن لم يتغير طعمه وأنهار من خمر لذة للشاربين وأنهار من عسل مصفى {cite:tafsir-ibn-kathir}."
  en: "The likeness of the Garden promised to the godfearing: rivers of water never stagnant, rivers of milk whose taste never changes, rivers of wine delightful to drinkers, and rivers of purified honey {cite:tafsir-ibn-kathir}."
  fr: "Le Jardin promis à ceux qui craignent Dieu est dépeint avec quatre sortes de fleuves : d’eau qui ne stagne jamais, de lait qui garde son goût, de vin qui fait les délices de ceux qui le boivent et de miel purifié {cite:tafsir-ibn-kathir}."
  ur: "جنت کی صورت جو متقین سے وعدہ کی گئی: اس میں نہ پھٹنے والے پانی کی نہریں، دودھ کی نہریں جن کا ذائقہ نہیں بدلتا، شہد کی صاف نہریں اور لذت دینے والی شراب کی نہریں ہیں {cite:tafsir-ibn-kathir}۔"
  es: "La semejanza del Jardín prometida a los temerosos de Dios: ríos de agua que nunca se estancan, ríos de leche cuyo sabor nunca cambia, ríos de vino delicioso para los bebedores y ríos de miel purificada {cite:tafsir-ibn-kathir}."
