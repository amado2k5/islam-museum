summary:
  ar: "يبين ابن سينا أن القوى الطبيعية الأربع تخدمها الكيفيات الأربع الأولى: الحرارة والبرودة والرطوبة واليبوسة، وأن الحرارة تخدمها كلها، والبرودة بالعرض لا بالذات، واليبوسة والرطوبة بحسب فعل كل قوة {cite:canon-ibn-sina-print-v1 pp.96-98}."
  en: "Ibn Sina shows that the four natural faculties are served by the four first qualities, heat, cold, moisture and dryness: heat serves them all, cold only by accident and not by itself, and dryness and moisture according to the work of each faculty {cite:canon-ibn-sina-print-v1 pp.96-98}."
