summary:
  ar: "خامالاون في الكتاب دواء لا يشرب في شيء بل يستعمل من خارج، يطلى على البهق والجرب والقوابي ويضمد به القروح المتأكلة؛ ويذكر الكتاب أن أصول الأبيض منه ينتفع به صاحب الاستسقاء وتقتل الديدان، وأن في الأسود منه شيئا قتالا {cite:canon-ibn-sina-print-v1 p.717}"
  en: "Khamalawn is in the book a drug that is not drunk in anything but used from outside, applied to bahaq, scab and qawabi and used as a poultice on eating ulcers; the book says that the roots of its white kind benefit one with dropsy and kill worms, and that in the black kind there is something deadly {cite:canon-ibn-sina-print-v1 p.717}"
  ur: "خامالاون کتاب میں ایک دوا ہے جو کسی چیز میں پی نہیں جاتی بلکہ باہر سے استعمال ہوتی ہے، بہق، جرب اور قوابی پر لگائی جاتی ہے اور کھانے والے زخموں پر ضماد کی جاتی ہے؛ کتاب کہتی ہے کہ اس کی سفید قسم کی جڑیں استسقاء والے کو فائدہ دیتی ہیں اور کیڑوں کو مارتی ہیں، اور سیاہ قسم میں کوئی مہلک چیز ہے {cite:canon-ibn-sina-print-v1 p.717}۔"
  es: "En el libro, Khamalawn es una droga que no se bebe, sino que se usa externamente, se aplica a bahaq, sarna y qawabi, y se usa como cataplasma en úlceras por presión; el libro dice que las raíces de su variedad blanca benefician a quien padece hidropesía y matan los gusanos, y que en la variedad negra hay algo mortal {cite:canon-ibn-sina-print-v1 p.717}."
  fr: "Le khamalawn est décrit dans le livre comme une substance qui ne s'ingère pas, mais s'utilise par voie externe, appliquée sur les plaies, les gales et les ulcères, et en cataplasme sur les ulcères bouchères; le livre indique que les racines de sa variété blanche sont bénéfiques en cas d'hydropisie et vermifuges, et que la variété noire contient une substance mortelle {cite:canon-ibn-sina-print-v1 p.717}"
  tr: "Kitaptaki Khamalon, hiçbir şey için içilmeyen ama dışa doğru kullanılan, vitiligo, uyuz ve uyuz hastalıklarına uygulanan ve yeme yaralarını giymek için kullanılan bir ilaçtır; kitapta beyaz kökenlerinin Ascites hastası olanlara ve solucanları öldürenlere fayda sağladığı, siyah mürekkeple ise savaşan bir şey olduğu belirtilir {cite:canon-ibn-sina-print-v1 s.717}"
  id: "Khamalon dalam buku ini adalah obat yang tidak diminum untuk apa pun tetapi digunakan secara eksternal, diaplikasikan pada vitiligo, kudis, dan kudis, serta digunakan untuk merawat luka pemakan; buku tersebut menyebutkan bahwa asal-usul putihnya menguntungkan mereka yang memiliki ascites dan membunuh cacing, dan dalam tinta hitam itu adalah sesuatu yang berjuang {cite:canon-ibn-sina-print-v1 hlm.717}"
