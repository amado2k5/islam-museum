label: { ar: "الجهل", en: "Jahl (ignorance and its legal effect)", ur: "جہل" }
summary:
  ar: "الجهل في الفقه عدم العلم بالشيء، وتفرق الموسوعة بينه وبين النسيان. وتبيّن أن الجهل بالتحريم يسقط الإثم والحكم في الظاهر لمن قرب عهده بالإسلام ونحوه، وأنه لا يعذر من علم التحريم وجهل ما يترتب عليه، وتعرض أثره في الصلاة إذا جهل الوقت أو الفاتحة، وفي الصوم إذا اشتبه رمضان، وفي الطلاق والكفر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6657} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6660} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6661} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6663} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6664} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6665}"
  en: "Jahl in fiqh is lack of knowledge of a thing; the encyclopedia distinguishes it from forgetfulness. Ignorance of a prohibition removes sin and the ruling in outward terms for someone who has recently become Muslim or is similar, but someone who knows a thing is forbidden is not excused for not knowing its consequences. Its effect is discussed for the prayer when the time or the opening chapter is unknown, for fasting when Ramadan is uncertain, and for divorce and unbelief, where the offender is excused only in certain cases. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6657} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6660} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6661} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6663} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6664} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6665}"
