id: concept/jahl
class: concept
kind: legal
label: { ar: "الجهل", en: "Jahl (ignorance and its legal effect)", ur: "جہل", es: "Jahl (la ignorancia y sus efectos legales)", fr: "Jahl (l'ignorance et ses conséquences juridiques)" }
summary:
  ar: "الجهل في الفقه عدم العلم بالشيء، وتفرق الموسوعة بينه وبين النسيان. وتبيّن أن الجهل بالتحريم يسقط الإثم والحكم في الظاهر لمن قرب عهده بالإسلام ونحوه، وأنه لا يعذر من علم التحريم وجهل ما يترتب عليه، وتعرض أثره في الصلاة إذا جهل الوقت أو الفاتحة، وفي الصوم إذا اشتبه رمضان، وفي الطلاق والكفر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6657} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6660} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6661} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6663} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6664} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6665}"
  en: "Jahl in fiqh is lack of knowledge of a thing; the encyclopedia distinguishes it from forgetfulness. Ignorance of a prohibition removes sin and the ruling in outward terms for someone who has recently become Muslim or is similar, but someone who knows a thing is forbidden is not excused for not knowing its consequences. Its effect is discussed for the prayer when the time or the opening chapter is unknown, for fasting when Ramadan is uncertain, and for divorce and unbelief, where the offender is excused only in certain cases. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6657} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6660} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6661} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6663} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6664} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6665}"
  es: "En fiqh, jahl significa desconocimiento de algo; la enciclopedia lo distingue del olvido. Ignorar una prohibición exime del pecado y de la norma en términos externos a quien se ha convertido recientemente al Islam o se encuentra en una situación similar, pero quien sabe que algo está prohibido no queda eximido de su conocimiento de las consecuencias. Su efecto se analiza en el caso de la oración cuando se desconoce la hora o el capítulo inicial, en el ayuno cuando el Ramadán es incierto, y en el divorcio y la incredulidad, donde el infractor solo queda eximido en ciertos casos. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6657} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6660} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6661} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6663} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6664} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6665}"
  fr: "En droit islamique (fiqh), le jahl désigne l'ignorance d'une chose; l'encyclopédie le distingue de l'oubli. Ignorer une interdiction n'absout pas le péché et la sanction, du moins en apparence, pour un nouveau converti à l'islam ou une personne dans une situation similaire. Cependant, celui qui sait qu'une chose est interdite n'est pas excusé d'ignorer ses conséquences. Son effet est examiné pour la prière lorsque l'heure ou la sourate inaugurale sont inconnues, pour le jeûne lorsque le Ramadan est incertain, et pour le divorce et l'incroyance, où le fautif n'est excusé que dans certains cas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6657} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6660} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6661} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6663} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6664} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6665}"
  ur: "فقہ میں جہل کسی چیز کا علم نہ ہونا ہے۔ انسائیکلوپیڈیا اسے بھولنے سے ممتاز کرتا ہے۔ ممانعت سے ناواقفیت گناہ کو مٹا دیتی ہے اور ظاہری لحاظ سے اس شخص کے لیے جو حال ہی میں مسلمان ہوا ہے یا اس سے ملتا جلتا ہے، لیکن جو شخص کسی چیز کو حرام جانتا ہو اسے اس کے نتائج کا علم نہ ہونے کی وجہ سے معاف نہیں کیا جاتا۔ اس کے اثر کو نماز کے لیے زیر بحث لایا جاتا ہے جب وقت یا ابتدائی باب معلوم نہ ہو، روزہ کے لیے جب رمضان غیر یقینی ہو، اور طلاق اور کفر کے لیے، جہاں مجرم کو صرف بعض صورتوں میں معاف کیا جاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 6657} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ6660} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ6661} صفحہ 6663} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ6664} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص6665}"
