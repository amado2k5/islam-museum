class: concept
kind: scientific
label: { ar: "جهة ميل الشمس ومراتبها الست في الصعود والهبوط", en: "The direction of the Sun's declination and its six grades", ur: "سورج کے میل کی جہت اور صعود و ہبوط کے چھ مراتب", es: "La dirección de la declinación solar y sus seis grados." }
summary:
  ar: "يبين البتاني كيف يعرف من موضع الشمس في فلك البروج جهة الميل وهل هو زائد أم ناقص وهل الشمس صاعدة أم هابطة: فمن أول الحمل إلى تسعين الميل زائد والشمس تصعد إلى الشمال، ومن تسعين إلى مائة وثمانين ناقص والشمس هابطة من الشمال، ومن مائة وثمانين إلى مائتين وسبعين زائد والشمس تهبط إلى الجنوب، ومن مائتين وسبعين إلى ثلثمائة وستين ناقص والشمس تصعد في الجنوب. ثم يذكر أن القدماء قسموا الميل ست مراتب في الصعود والهبوط. {cite:zij-sabi-nallino-byblion p.23}."
  en: "Al-Battani shows how the direction of the declination is known from the Sun's place on the zodiac, whether it is growing or shrinking and whether the Sun is rising or falling: from the start of Aries to ninety the declination grows and the Sun climbs toward the north; from ninety to 180 it shrinks and the Sun falls from the north; from 180 to 270 it grows and the Sun descends toward the south; and from 270 to 360 it shrinks and the Sun rises in the south. He then says the ancients divided the declination into six grades in rising and falling. {cite:zij-sabi-nallino-byblion p.23}."
  ur: "البتانی دکھاتے ہیں کہ فلک البروج میں سورج کی جگہ سے میل کی جہت کیسے معلوم ہوتی ہے، کہ وہ بڑھ رہا ہے یا گھٹ رہا ہے، اور سورج چڑھ رہا ہے یا اتر رہا ہے: حمل کے آغاز سے نوے تک میل بڑھتا ہے اور سورج شمال کی طرف چڑھتا ہے؛ نوے سے ایک سو اسّی تک گھٹتا ہے اور سورج شمال سے اترتا ہے؛ ایک سو اسّی سے دو سو ستر تک بڑھتا ہے اور سورج جنوب کی طرف اترتا ہے؛ اور دو سو ستر سے تین سو ساٹھ تک گھٹتا ہے اور سورج جنوب میں چڑھتا ہے۔ پھر بتاتے ہیں کہ اگلوں نے میل کو صعود و ہبوط میں چھ مراتب میں تقسیم کیا۔ {cite:zij-sabi-nallino-byblion p.23}۔"
  es: "Al-Battani explica cómo se conoce la dirección de la declinación según la posición del Sol en el zodíaco, si está aumentando o disminuyendo y si el Sol está saliendo o poniéndose: desde el inicio de Aries hasta los 90 grados, la declinación aumenta y el Sol asciende hacia el norte; desde los 90 hasta los 180 grados disminuye y el Sol se pone desde el norte; desde los 180 hasta los 270 grados aumenta y el Sol desciende hacia el sur; y desde los 270 hasta los 360 grados disminuye y el Sol sale por el sur. Luego afirma que los antiguos dividían la declinación en seis grados, tanto en ascenso como en descenso. {cite:zij-sabi-nallino-byblion p.23}."
