summary:
  ar: "الشحم في الكتاب معروف، يذكر فيه الكتاب شحوم الحيوان على حسب الطبع والخواص، فشحم الفحل أسخن وأيبس ثم شحم الخصي وشحم المسن أخب، وشحم الأيل شديد السخونة وشحم العنز أقبض الجميع وشحم التيس أشد تحليلا، وينقل أن شحم الدب والوز نافعان من داء الثعلب، وشحم الخنزير نافع من الأورام وشحم الأسد يحلل الصلبة، وشحم الحمير لحرق النار، وشحم الوز لوجع الأذن، وشحم الإبل من التشنج، وشحم السمك لماء العين، وشحم الماعز للذع الأمعاء، وسنام الجمل بخورا للبواسير، ويذكر الكتاب نقلا موسوما شحوما نافعة لأوجاع الرحم. وكل ما ورد هنا نقل منسوب إلى الكتاب لا توصية {cite:canon-ibn-sina-print-v1 pp.682-683}"
  en: "Shahm is in the book well known; the book lists the fats of animals by temperament and properties: the fat of the stallion is hotter and drier, then that of the gelding, and that of the aged is the worst; deer fat is very hot, she-goat fat the most astringent and he-goat fat the more dissolving; it is reported that bear fat and goose fat benefit alopecia, pig fat benefits swellings and lion fat dissolves hard ones, donkey fat is for burns, goose fat for earache, camel fat for spasm, fish fat for the water of the eye, goat fat for the stinging of the intestines, and the camel's hump as a fumigation for haemorrhoids; and the book lists, as a labelled report, fats beneficial for pains of the womb. Everything given here is a report attributed to the book, not a recommendation {cite:canon-ibn-sina-print-v1 pp.682-683}"
  ur: "شحم کتاب میں معروف ہے؛ کتاب جانوروں کی چربیوں کو طبع اور خواص کے لحاظ سے ذکر کرتی ہے: نر کی چربی زیادہ گرم اور خشک ہے، پھر خصی کی، اور بوڑھے کی سب سے بری؛ ہرن کی چربی بہت گرم ہے، بکری کی چربی سب سے زیادہ قابض اور بکرے کی چربی زیادہ تحلیل کرنے والی؛ نقل ہے کہ ریچھ اور ہنس کی چربی داء الثعلب میں نافع ہیں، سور کی چربی ورموں میں نافع ہے اور شیر کی چربی سخت ورموں کو تحلیل کرتی ہے، گدھے کی چربی جلنے کے لیے، ہنس کی چربی کان کے درد کے لیے، اونٹ کی چربی تشنج کے لیے، مچھلی کی چربی آنکھ کے پانی کے لیے، بکری کی چربی آنتوں کی چبھن کے لیے، اور اونٹ کا کوہان بواسیر کے لیے دھونی کی صورت میں؛ اور کتاب منقول فہرست کے طور پر رحم کے دردوں کے لیے نافع چربیاں درج کرتی ہے۔ یہاں جو کچھ آیا وہ کتاب سے منسوب نقل ہے، سفارش نہیں {cite:canon-ibn-sina-print-v1 pp.682-683}۔"
  es: "Shahm es bien conocido en el libro; este enumera las grasas de los animales según su temperamento y propiedades: la grasa del semental es más caliente y seca que la del castrado, y la del anciano es la peor; la grasa de venado es muy caliente, la de cabra la más astringente y la de macho la más disolvente; se informa que la grasa de oso y la de ganso benefician la alopecia, la de cerdo las hinchazones y la de león disuelve las duras, la de burro sirve para las quemaduras, la de ganso para el dolor de oído, la de camello para los espasmos, la de pescado para el lagrimeo, la de cabra para el escozor intestinal y la joroba del camello como fumigante para las hemorroides; y el libro enumera, a modo de informe, grasas beneficiosas para los dolores uterinos. Todo lo que se presenta aquí es un informe atribuido al libro, no una recomendación {cite:canon-ibn-sina-print-v1 pp.682-683}"
  fr: "Shahm est bien connu dans le livre; celui-ci répertorie les graisses animales selon leur tempérament et leurs propriétés: la graisse de l'étalon est plus chaude et plus sèche que celle du hongre, et celle du cheval âgé est la pire; la graisse de cerf est très chaude, celle de la chèvre la plus astringente et celle du bouc la plus dissolvante; il est rapporté que la graisse d'ours et la graisse d'oie sont bénéfiques contre l'alopécie, la graisse de porc contre les gonflements et la graisse de lion pour dissoudre les gonflements durs, la graisse d'âne contre les brûlures, la graisse d'oie contre les maux d'oreilles, la graisse de chameau contre les spasmes, la graisse de poisson contre le larmoiement, la graisse de chèvre contre les irritations intestinales et la bosse de chameau comme fumigation contre les hémorroïdes; et le livre mentionne, sous forme de rapport, des graisses bénéfiques contre les douleurs utérines. Tout ce qui est donné ici est un rapport attribué au livre, et non une recommandation. {cite:canon-ibn-sina-print-v1 pp.682-683}"
  tr: "Kitaptaki yağ iyi bilinir. Hayvansal yağ doğası ve özelliklerine göre bahsedilir: aygır yağı en sıcak ve en kolay kullanılanıdır, sonra hadım yağı, yaşlı erkeğin yağı en şiddetli, geyik yağı çok sıcak, keçi yağı en az kalan ve keçi yağı daha analitiktir. Ayı ve keçi yağının tilki hastalığı için faydalı, domuz yağının tümörler için faydalı, aslan yağının katı maddeleri parçaladığı, eşek yağı ateş yakmak için, kaz yağı kulak ağrısı için, deve yağı spazmlar için, balık yağı göz suyu için, keçi yağı bağırsakları sokmak için, deve hörgezi hemoroid için tütsü olarak etiketlenmiş ve kitap rahim ağrıları için faydalı yağlar olarak etiketlenmiş bir yayında yer almaktadır. Burada bahsedilen her şey kitaba atfedilmiştir, tavsiye değil {cite:canon-ibn-sina-print-v1 s.682-683}"
  id: "Lemak dalam buku ini sudah dikenal luas. Disebutkan lemak hewan sesuai dengan sifat dan karakteristiknya: lemak kuda jantan adalah yang paling panas dan mudah dibuang, lalu lemak kastrasi, lemak pria tua paling parah, lemak rusa sangat panas, lemak kambing paling berkurang, dan lemak kambing lebih analitis. Dilaporkan bahwa lemak beruang dan kambing bermanfaat untuk penyakit rubah, lemak babi bermanfaat untuk tumor, lemak singa memecah padatan, lemak keledai untuk membakar api, lemak angsa untuk sakit telinga, lemak unta untuk kejang, lemak ikan untuk air mata, lemak kambing untuk menyengat usus, bonggol unta adalah dupa untuk wasir, dan buku ini menyebutkan dalam transmisi lemak yang bermanfaat untuk nyeri rahim. Semua yang disebutkan di sini dikaitkan dengan buku, bukan rekomendasi {cite:canon-ibn-sina-print-v1 hlm.682-683}"
