  en: "Wrist (kuʿ), fiqh rulings"
  ur: "کوع (فقہی احکام)"
summary:
  ar: "الكوع في اللغة طرف الزند الذي يلي الإبهام، والجمع أكواع؛ وهو طرف العظم الذي يلي رسغ اليد المحاذي للإبهام، أما الطرف الذي يلي الخنصر فيسمى الكرسوع {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13545}."
  en: "Kuʿ, in lexicon, is the end of the forearm bone beside the thumb, plural akwaʿ; the end beside the little finger is called karsuʿ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13545}."
  ur: "کوع لغت میں بازو کی ہڈی کے اس سرے کو کہتے ہیں جو انگوٹھے کے ساتھ ہو، جمع اکواع ہے؛ اور جو سرا چھوٹی انگلی کی طرف ہو اسے کرسوع کہتے ہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13545}۔"
