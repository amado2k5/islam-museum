id: concept/nafs-al-asnan-wa-al-ahwal
class: concept
kind: scientific
label:
  ar: "نفس الأسنان والأحوال"
  en: "The breath of the ages and the states"
  ur: "عمروں اور حالتوں کی سانس"
summary:
  ar: "أما الصبيان فإنهم محتاجون إلى إخراج الفضول الدخانية حاجة شديدة لأن الهضم فيهم أكثر وأدوم وليست حاجتهم إلى التطفئة بقليلة وقوتهم ليست بالشديدة لأنهم لم يكملوا في أبدانهم وقواهم فلا بد من أن يقع في نبضهم تواتر وسرعة شديدان مع عظم ما ليس بذلك الشديد، وأما الشبان فنفسهم أعظم ولكن أقل سرعة وتواتراً إذا الحاجة تبلغ فيهم بالعظم، وأما الكهول فنفسهم أقل في المعاني الزائدة من نفس الشبان وليس في قلة نفس المشايخ، وأما المشايخ فنفسهم أصغر وأبطأ وأشد تفاوتاً، ونفس الممتلئ من الغذاء ومن الحبل والاستسقاء وغيره إلى الصغر لأن الحجاب مضغوط عن الحركة الباسطة، ونفس المستحم بالحار يعظم للحاجة ولين الآلة ويسرع ويتواتر للحاجة وأما المستحم بالبارد فأمره بالعكس، ونفس النائم إذا كانت القوة قوية عظم وتفاوت ويكون انقباضه أعظم وأسرع من انبساطه لأن الهضم فيه أكثر {cite:canon-ibn-sina-print-v2 p.314}"
  en: "Boys need to expel the smoky residues with a strong need, for digestion in them is greater and longer-lasting, nor is their need of quenching small, while their power is not strong since their bodies and powers are not complete — so there must fall in their pulse a severe frequency and swiftness with a largeness that is not so severe. The young men's breath is greater but less swift and frequent, since the need in them is met by largeness; the middle-aged have a breath less in the exceeding meanings than the young men's, not as scant as the old men's; and the old men's breath is smaller, slower and more uneven. The breath of the one full of food, or of pregnancy, dropsy and the like, tends to smallness, for the diaphragm is pressed away from the expanding motion ⁦(the pregnancy named in the book's list — a labelled line set for the founder)⁩. The hot bather's breath grows large for the need and the tool's suppleness, and quickens and frequents for the need, while the cold bather's affair is the reverse. The sleeper's breath, when the power is strong, grows large and uneven — its contraction greater and swifter than its expansion, for the digestion in it is greater {cite:canon-ibn-sina-print-v2 p.314}"
  ur: "بچوں کو دھوئیں سے فضول کی اخراج کی سخت ضرورت ہوتی ہے کیونکہ ان میں ہاضمہ زیادہ اور دائمی ہے اور نہ ان کی ٹھنڈک کی ضرورت قلیل ہے مگر ان کی قوت مضبوط نہیں کیونکہ ان کے بدن اور قوتیں مکمل نہیں اس لیے ان کی نبض میں سخت تواتر اور تیزی آتی ہے ساتھ ایسی بڑی جس میں وہ شدت نہیں؛ جوانوں کی سانس بڑی ہوتی ہے مگر کم تیز اور کم متواتر کیونکہ ان میں ضرورت بڑائی سے پوری ہو جاتی ہے؛ کہول والوں کی سانس جوانوں سے زائد معنوں میں کم ہے مگر بڑھاپے والوں جتنی قلیل نہیں؛ اور بڑھاپے والوں کی سانس چھوٹی سست اور زیادہ متفاوت ہوتی ہے؛ کھانے سے بھرے ہوئے حمل استسقا وغیرہ والے کی سانس چھوٹائی کی طرف ہے کیونکہ حجاب پھیلانے والی حرکت سے دبا ہوا ہے ⁦(کتاب کی فہرست میں حمل کا نام — ایک وضاحت شدہ سطر بانی کے فیصلے کے لیے)⁩؛ گرم غسل کرنے والے کی سانس ضرورت اور اوزار کی نرمی سے بڑی اور ضرورت سے تیز اور متواتر ہوتی ہے اور ٹھنڈے غسل والے کا معاملہ اس کے بالعکس؛ سوتے کی سانس جب قوت مضبوط ہو بڑی اور متفاوت ہوتی ہے اور اس کا سمٹاؤ اس کے پھیلاؤ سے بڑا اور تیز ہوتا ہے کیونکہ اس میں ہاضمہ زیادہ ہوتا ہے {cite:canon-ibn-sina-print-v2 p.314}"
