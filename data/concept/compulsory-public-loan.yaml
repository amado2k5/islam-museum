id: concept/compulsory-public-loan
class: concept
kind: legal
tags: [islamic-economy-browser, islamic-economy-money]
label:
  ar: "القرض العام الإلزامي"
  en: "Compulsory public loan"
  es: "Préstamo público obligatorio"
  fr: "Prêt public obligatoire"
  ur: "لازمی عوامی قرض"
  tr: "Zorunlu Genel Kredi"
  id: "Pinjaman Umum Wajib"
issue:
  ar: "هل يجوز للدولة أن تقترض من الأغنياء على سبيل الإلزام، وبأي شرط؟"
summary:
  ar: "القرض العام الإلزامي هو ما تقترضه الدولة من الأثرياء على سبيل الإلزام، وأدرجه المؤلف في إعادة التوزيع لأن القرض في الإسلام من عقود الإرفاق لا فائدة فيه {cite:usul-iqtisad-islami-0660 p. 324}. ويستدل بأن النبي استلف من العباس صدقة عامين {cite:usul-iqtisad-islami-0660 p. 324}، ويجيز الجويني الاستقراض على بيت المال {cite:usul-iqtisad-islami-0660 p. 324}، ويقيده الغزالي والشاطبي بألا يُرجى دخل لبيت المال، فإن ضعفت الموارد لزم التوظيف {cite:usul-iqtisad-islami-0660 p. 325}."
  tr: "Zorunlu kamu kredisi, devletin zenginlerden zorunlu olarak aldığı şeydir ve yazar, İslam'da kredi bir haciz sözleşmesi olduğu ve hiçbir faydası olmadığı için yeniden dağıtıma dahil etmiştir {cite:usul-iqtisad-islami-0660 s. 324}. Peygamber'in Abbas'tan iki yıl boyunca sadaka borç aldığını {cite:usul-iqtisad-islami-0660 s. 324}, Al-Juwayni'nin kamu hazinesinden borç almaya izin verdiğini {cite:usul-iqtisad-islami-0660 s. 324} ve Al-Gazali ile Al-Shatibi'nin kamu hazinesinden gelir beklenmediğini ve kaynaklar zayıfsa bunun kullanılmasını şart koyduğunu belirtir {cite:usul-iqtisad-islami-0660 s. 325}."
  id: "Pinjaman publik wajib adalah apa yang dipinjam negara dari orang kaya sebagai bentuk wajib, dan penulis memasukkannya dalam redistribusi karena dalam Islam, pinjaman adalah kontrak penyitaan dan tidak memiliki manfaat {cite:usul-iqtisad-islami-0660 hlm. 324}. Ia berargumen bahwa Nabi meminjam amal dari Abbas selama dua tahun {cite:usul-iqtisad-islami-0660 hlm. 324}, dan Al-Juwayni mengizinkan pinjaman di kas negara {cite:usul-iqtisad-islami-0660 hlm. 324}, dan Al-Ghazali serta Al-Shatibi membatasinya dengan menyatakan bahwa tidak ada pendapatan yang diharapkan untuk kas negara, dan jika sumber daya lemah, harus digunakan {cite:usul-iqtisad-islami-0660 hlm. 325}."
