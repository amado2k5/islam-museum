id: concept/kufr-duna-kufr
class: concept
kind: doctrine
label: { ar: "كفر دون كفر", en: "Unbelief short of unbelief (kufr duna kufr)", ur: "کفر دون کفر", es: "Incredulidad sin llegar a ser incredulidad (kufr duna kufr)", fr: "L'incrédulité sans incrédulité (kufr duna kufr)", tr: "Kafr olmadan Kafr", id: "Kafr tanpa Kafr" }
summary:
  ar: "مقولة مأثورة عن عطاء وطاوس في تفسير قول ابن عباس في آية الحكم بما أنزل الله، ومعناها أن من الذنوب ما سماه الشرع كفراً وهو لا يخرج صاحبه من الملة. جمع ابن بطة في الإبانة الكبرى باباً بعنوان «ذكر الذنوب التي تصير بصاحبها إلى كفر غير خارج به عن الملة» روى فيه أحاديث الشرك الخفي، والبراءة من النسب، وقتال المسلم، وإتيان الكاهن، والنياحة، والتمائم."
  en: "A saying transmitted from Ata' and Tawus explaining Ibn Abbas's words on the verse about judging by what God sent down: some sins that the revealed texts call unbelief do not take their doer out of the religion. In al-Ibana al-Kubra Ibn Batta gathered a chapter titled 'The sins that bring their doer to an unbelief that does not take him out of the religion', with hadiths on hidden shirk, disowning one's lineage, fighting a Muslim, going to a soothsayer, lamentation and amulets."
  ur: "عطاء اور طاؤس سے منقول ایک قول جو آیتِ حکم بما انزل اللہ کے بارے میں ابن عباس کے قول کی تشریح ہے: بعض گناہ جنہیں نصوص نے کفر کہا، اپنے مرتکب کو دین سے خارج نہیں کرتے۔ الابانہ الکبریٰ میں ابن بطہ نے «ان گناہوں کا ذکر جو مرتکب کو ایسے کفر تک پہنچاتے ہیں جو دین سے خارج نہیں کرتا» کے عنوان سے باب باندھا، جس میں خفی شرک، نسب سے براءت، مسلمان سے قتال، کاہن کے پاس جانے، نوحے اور تعویذوں کی احادیث ہیں۔"
  es: "Un dicho transmitido por Ata' y Tawus que explica las palabras de Ibn Abbas sobre el versículo acerca de juzgar por lo que Dios reveló: algunos pecados que los textos revelados llaman incredulidad no excluyen a quien los comete de la religión. En al-Ibana al-Kubra, Ibn Batta reunió un capítulo titulado \"Los pecados que llevan a quien los comete a una incredulidad que no lo excluye de la religión\", con hadices sobre el shirk oculto, la negación del propio linaje, la lucha contra un musulmán, la consulta a un adivino, el lamento y los amuletos."
  fr: "Un hadith rapporté par Ata' et Tawus, expliquant les propos d'Ibn Abbas sur le verset relatif au jugement selon la révélation divine: certains péchés qualifiés d'incroyance par les textes révélés n'excommunient pas celui qui les commet. Dans son ouvrage al-Ibana al-Kubra, Ibn Batta a rassemblé un chapitre intitulé « Les péchés qui conduisent à une incroyance qui n'excommunie pas », contenant des hadiths sur le shirk dissimulé, le reniement de sa lignée, le combat contre un musulman, la consultation d'un devin, les lamentations et les amulettes."
  tr: "Ata ve Tavus'tan İbn Abbas'ın Tanrı'nın vahyettiği şeyle ilgili hikmet ayetinde ifadesini yorumlayan iyi bilinen bir söz; günahlar arasında Şeriatın inançsızlık dediği ve sahibini imandan koparmayan inançsızlık olduğu anlamına gelir. İbn Batta, El-İbanah el-Kubra'da \"Sahibini inançsızlığa sürükleyen günahların anılması\" başlıklı bir bölüm derlemiştir; burada gizli çoktanrıcılık, soyundan kopma, Müslüman kavgaları, bir rahibe yaklaşma, ağıt ve muskalar hakkında hadisler anlatır."
  id: "Sebuah pepatah terkenal dari Ata dan Tawus dalam menafsirkan pernyataan Ibn Abbas dalam ayat hikmah tentang apa yang telah diwahyukan Tuhan, yang berarti bahwa di antara dosa-dosa tersebut adalah apa yang disebut Syariah sebagai ketidakpercayaan, yang tidak mengusir pemiliknya dari iman. Ibn Batta menyusun sebuah bab dalam Al-Ibanah al-Kubra berjudul \"Penyebutan dosa yang menyebabkan pemiliknya tidak percaya yang tidak mengecualikannya dari iman,\" di mana ia menceritakan hadits tentang politeisme tersembunyi, pemisahan dari garis keturunan, pertengkaran Muslim, mendekati seorang imam, ratapan, dan jimat-jimat."
