label:
  ar: وَسْم
  en: Wasm (branding)
summary:
  ar: الوَسْم في اللغة أثر الكيّ، والوسم بالكيّ في الحيوان مشروع، بل عند الشافعية والحنابلة وسم نَعَم الزكاة والفيء والجزية سنة، ويُكتب على صدقة الزكاة مثل «زكاة» أو «صدقة»، وعلى نَعَم الجزية «جزية». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17193}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17194} ويكون الوسم في موضع صلب ظاهر، والأولى في الغنم الأذن، وفي الإبل والبقر الأفخاذ، والوسم في الوجه حرام على الأصح عند الشافعية، لأن النبي لعن من وسم وجه الحمار، ومكروه عند المالكية والشافعية في مقابل الأصح وبعض الحنابلة، وأما وسم الآدمي فحرام إجماعاً إلا للتداوي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17194}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17195}
  en: Wasm (branding) in the lexicon is the mark left by a burn. Branding animals is lawful, and the Shafi'is and Hanbalis hold it sunna for the camels, cattle and sheep of zakat, of fay' and of the poll-tax; zakat animals are marked with a word such as "zakat" or "sadaqa" and poll-tax animals with "jizya". {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17193}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17194} The mark goes on a firm, visible place, the ear for sheep and the thigh for camels and cattle. Branding the face is forbidden according to the preferred Shafi'i view, on the report that the Prophet cursed whoever branded a donkey's face; the Malikis, the weaker Shafi'i view and some Hanbalis regard it as disliked. Branding a human being is forbidden by consensus unless it is for treatment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17194}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17195}
