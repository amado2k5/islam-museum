summary:
  ar: الوَسْم في اللغة أثر الكيّ، والوسم بالكيّ في الحيوان مشروع، بل عند الشافعية والحنابلة وسم نَعَم الزكاة والفيء والجزية سنة، ويُكتب على صدقة الزكاة مثل «زكاة» أو «صدقة»، وعلى نَعَم الجزية «جزية». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17193}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17194} ويكون الوسم في موضع صلب ظاهر، والأولى في الغنم الأذن، وفي الإبل والبقر الأفخاذ، والوسم في الوجه حرام على الأصح عند الشافعية، لأن النبي لعن من وسم وجه الحمار، ومكروه عند المالكية والشافعية في مقابل الأصح وبعض الحنابلة، وأما وسم الآدمي فحرام إجماعاً إلا للتداوي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17194}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17195}
  en: Wasm (branding) in the lexicon is the mark left by a burn. Branding animals is lawful, and the Shafi'is and Hanbalis hold it sunna for the camels, cattle and sheep of zakat, of fay' and of the poll-tax; zakat animals are marked with a word such as "zakat" or "sadaqa" and poll-tax animals with "jizya". {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17193}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17194} The mark goes on a firm, visible place, the ear for sheep and the thigh for camels and cattle. Branding the face is forbidden according to the preferred Shafi'i view, on the report that the Prophet cursed whoever branded a donkey's face; the Malikis, the weaker Shafi'i view and some Hanbalis regard it as disliked. Branding a human being is forbidden by consensus unless it is for treatment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17194}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17195}
  es: "Wasm (marcaje) en el léxico es la marca que deja una quemadura. Marcar animales es lícito, y los shafi'ís y hanbalíes lo consideran sunna para los camellos, vacas y ovejas del zakat, del fay' y del impuesto de capitación; los animales del zakat se marcan con una palabra como \"zakat\" o \"sadaqa\" y los animales del impuesto de capitación con \"jizya\". {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17193}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17194} La marca se coloca en un lugar firme y visible, la oreja para las ovejas y el muslo para los camellos y las vacas. Marcar la cara está prohibido según la opinión shafi'í preferida, en el relato de que el Profeta maldijo a quien marcara la cara de un asno; los malikíes, la opinión shafi'í más débil y algunos hanbalíes lo consideran desaconsejable. Marcar a un ser humano está prohibido por consenso a menos que sea para tratamiento. {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.17194}{citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.17195}"
  fr: "Le terme « wasm » (marquage) désigne, dans le lexique, la marque laissée par une brûlure. Le marquage des animaux est licite et, selon les écoles chaféite et hanbalite, il est considéré comme une sunna pour les chameaux, les bovins et les moutons soumis à la zakat, au fay' et à la capitation. Les animaux soumis à la zakat sont marqués d'un mot tel que « zakat » ou « sadaqa », et ceux soumis à la capitation de « jizya ». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17193}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17194} La marque est apposée sur un endroit ferme et visible: l'oreille pour les moutons et la cuisse pour les chameaux et les bovins. Le marquage du visage est interdit selon l'avis chaféite prédominant, d'après le hadith selon lequel le Prophète a maudit quiconque marquait le visage d'un âne. Les malikites, l'avis chaféite plus modéré et certains hanbalites le déconseillent. Le marquage d'un être humain est interdit par consensus, sauf s'il s'agit d'un traitement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17194}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17195}"
  ur: "لغت میں Wasm ⁦(برانڈنگ)⁩ جلنے سے رہ جانے والا نشان ہے۔ جانوروں کا نشان لگانا حلال ہے، اور شافعی اور حنبلی اسے اونٹوں، مویشیوں اور بھیڑوں کے لیے زکوٰۃ، فے اور انتخابی محصول کے لیے سنت سمجھتے ہیں۔ زکوٰۃ کے جانوروں کو \"زکوۃ\" یا \"صدقہ\" جیسے لفظ سے اور پول ٹیکس والے جانوروں کو \"جزیہ\" سے نشان زد کیا گیا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17193}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17194} نشان ایک مضبوط، نظر آنے والی جگہ، بھیڑوں کے کان اور اونٹوں اور مویشیوں کی ران پر جاتا ہے۔ چہرے کو داغ لگانا پسندیدہ شافعی مسلک کے مطابق حرام ہے، اس روایت میں ہے کہ نبی نے گدھے کا چہرہ داغنے والے پر لعنت فرمائی ہے۔ مالکیہ، ضعیف شافعی اور بعض حنبلی اسے ناپسندیدہ سمجھتے ہیں۔ کسی انسان کا برانڈ بنانا اجماع سے منع ہے جب تک کہ وہ علاج کے لیے نہ ہو۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17194}{حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17195}"
  tr: "Arapçada \"wasm\" kelimesi, damgalama sonucu oluşan izi ifade eder. Hayvanların dağlama yöntemiyle damgalanması caizdir. Hatta Şafiî ve Hanbeli mezheplerine göre, zekât, ganimet ve cizye vergisine tabi hayvanların damgalanması sünnettir (tavsiye edilen bir uygulamadır). Zekât hayvanlarına \"zekat\" veya \"sadaka\", cizye hayvanlarına ise \"cizye\" yazılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17193}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17194} Damgalama, sağlam ve görünür bir yere yapılmalıdır. Koyunlar için kulak, develer ve sığırlar için ise uyluk tercih edilir. Şafiî mezhebinin en doğru görüşüne göre, yüzün dağlanması yasaktır; çünkü Peygamberimiz eşeğin yüzünü dağlayanları lanetlemiştir. Maliki ve Şafiî mezhepleri ile bazı Hanbeliler ise, daha doğru görüşün aksine, bunu hoş karşılamazlar. İnsanlara dağlama ise, tıbbi amaçlar dışında, oybirliğiyle yasaktır."
  id: "Kata \"wasm\" dalam bahasa Arab berarti tanda yang ditinggalkan oleh cap. Mencap hewan dengan alat pembakar diperbolehkan. Bahkan, menurut mazhab Syafi'i dan Hanbali, mencap ternak yang dikenakan zakat, fay' (harta rampasan perang), dan jizya (pajak kepala) adalah Sunnah (praktik yang dianjurkan). Kata \"zakat\" atau \"sadaqah\" (sedekah) ditulis pada ternak zakat, dan \"jizya\" (upeti) pada ternak jizya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17193}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17194} Cap harus dilakukan pada tempat yang keras dan terlihat. Untuk domba, telinga lebih disukai, dan untuk unta dan sapi, paha. Memberi cap pada wajah dilarang menurut pendapat yang paling benar dari mazhab Syafi'i, karena Nabi mengutuk orang-orang yang memberi cap pada wajah keledai. Hal ini dianggap tidak disukai oleh mazhab Maliki dan Syafi'i, berbeda dengan pendapat yang lebih benar, dan oleh sebagian mazhab Hanbali. Adapun memberi cap pada manusia, hal itu secara bulat dilarang kecuali untuk tujuan pengobatan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17194}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17195}"
