summary:
  ar: "فراسيون في الكتاب حشيشة مرة الطعم، حار في الثانية يابس في الثالثة، مفتح يجلو ويحلل ويقطع، عصارته لوجع الأذن المزمن وللبصر، وهو شديد التفتيح لسدد الكبد والطحال، وينقي الصدر والرئة بالنفث {cite:canon-ibn-sina-print-v1 630}"
  en: "Farasiyun is in the book a herb of bitter taste, hot in the second degree and dry in the third, opening and cleansing, dissolving and cutting; its juice is used for chronic ear pain and for sight, and it greatly opens obstructions of the liver and spleen and cleanses the chest and lung by expectoration {cite:canon-ibn-sina-print-v1 630}"
  ur: "فراسیون کتاب میں کڑوے ذائقے کی بوٹی ہے، دوسرے درجے میں گرم اور تیسرے میں خشک، کھولنے والی، جلاء دینے والی، تحلیل اور قطع کرنے والی؛ اس کا رس پرانے کان کے درد اور بینائی کے لیے آتا ہے، یہ جگر اور تلی کی رکاوٹوں کو بہت کھولتی ہے اور سینہ اور پھیپھڑے کو بلغم نکلوا کر صاف کرتی ہے {cite:canon-ibn-sina-print-v1 630}۔"
  es: "En el libro, Farasiyun es una hierba de sabor amargo, caliente en segundo grado y seca en tercero, que abre y limpia, disuelve y corta; su jugo se usa para el dolor crónico de oído y para la vista, y abre en gran medida las obstrucciones del hígado y el bazo, y limpia el pecho y los pulmones mediante expectoración {cite:canon-ibn-sina-print-v1 630}."
