label:
  ar: السحر
  en: Sihr (sorcery)
  ur: جادو
summary:
  ar: "السحر حقيقة ثابتة بالكتاب والسنة وله تأثير بإذن الله؛ تعلمه من كفر وحذر الله منه في قصة هاروت وماروت ببابل، وعصم النبي نفسه بالمعوذتين {cite:sahih-al-bukhari} {cite:tafsir-ibn-kathir}."
  en: "Sorcery is real and established by Book and Sunnah, effective only by God's leave; learning it is disbelief, and God warned of it in the account of Harut and Marut at Babylon — the Prophet sought refuge through the mu'awwidhatayn {cite:sahih-al-bukhari} {cite:tafsir-ibn-kathir}."
  ur: "جادو کتاب و سنت سے ثابت حقیقت ہے اور اللہ کے اذن سے اثر رکھتا ہے؛ اسے سیکھنا کفر ہے اور بابل میں ہاروت ماروت کے واقعے میں اللہ نے اس سے خبردار کیا — نبی نے معوذتین سے پناہ مانگی {cite:sahih-al-bukhari} {cite:tafsir-ibn-kathir}۔"
