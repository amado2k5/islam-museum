id: concept/sihr
class: concept
kind: belief
label:
  ar: السحر
  en: Sihr (sorcery)
  ur: جادو
  es: "Sihr (hechicería)"
  fr: "Sihr (sorcellerie)"
  tr: "Büyü"
  id: "Sihir"
summary:
  ar: "السحر حقيقة ثابتة بالكتاب والسنة وله تأثير بإذن الله؛ تعلمه من كفر وحذر الله منه في قصة هاروت وماروت ببابل، وعصم النبي نفسه بالمعوذتين {cite:sahih-al-bukhari} {cite:tafsir-ibn-kathir}."
  en: "Sorcery is real and established by Book and Sunnah, effective only by God's leave; learning it is disbelief, and God warned of it in the account of Harut and Marut at Babylon — the Prophet sought refuge through the mu'awwidhatayn {cite:sahih-al-bukhari} {cite:tafsir-ibn-kathir}."
  ur: "جادو کتاب و سنت سے ثابت حقیقت ہے اور اللہ کے اذن سے اثر رکھتا ہے؛ اسے سیکھنا کفر ہے اور بابل میں ہاروت ماروت کے واقعے میں اللہ نے اس سے خبردار کیا — نبی نے معوذتین سے پناہ مانگی {cite:sahih-al-bukhari} {cite:tafsir-ibn-kathir}۔"
  es: "La hechicería es real y está establecida por el Libro y la Sunnah, efectiva solo con el permiso de Dios; aprenderla es incredulidad, y Dios advirtió sobre ella en el relato de Harut y Marut en Babilonia; el Profeta buscó refugio a través de los mu'awwidhatayn {cite:sahih-al-bukhari} {cite:tafsir-ibn-kathir}."
  fr: "La sorcellerie est réelle et établie par le Livre et la Sunna, efficace uniquement par la permission de Dieu; l'apprendre est de l'incroyance, et Dieu en a mis en garde dans le récit de Harut et Marut à Babylone — le Prophète a cherché refuge auprès des mu'awwidhatayn {cite:sahih-al-bukhari} {cite:tafsir-ibn-kathir}."
  tr: "Büyü, Kur'an ve Sünnet'te yerleşik bir gerçektir ve Allah'ın izniyle etkisi vardır; Büyü bunu inançsızlıktan öğrenmiş ve Babil'deki Harut ve Marut hikayesinde buna karşı uyarmıştır; Peygamber ise iki Mu'avvidatayn {atı:sahih-al-bukhari} {alıntı:tefsir-ibn-kathir} ile kendini korumuştur."
  id: "Sihir adalah realitas yang sudah mapan dalam Al-Qur'an dan Sunnah, dan berpengaruh dengan izin Allah; ia mempelajarinya dari ketidakpercayaan dan memperingatkannya dalam kisah Harut dan Marut di Babilon, dan Nabi melindungi dirinya dengan dua Mu'awwidhatayn {cite:sahih-al-bukhari} {cite:tafsir-ibn-kathir}."
