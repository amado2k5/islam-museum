summary:
  ar: 'الخالق: الموجد للأشياء من العدم المقدّر لها بحكمته. الاسم رقم 11 في التعداد الوارد في حديث الترمذي عن أسماء الله الحسنى.'
  en: al-Khaliq — The Creator. Name 11 in the enumeration of the most beautiful names in the Tirmidhi hadith.
  fr: "al-Khaliq — Le Créateur. Nom 11 dans l’énumération des plus beaux noms du hadith de Tirmidhi."
  ur: 'الخالق: خالق — جو ہر شے کو عدم سے وجود میں لائے اور حکمت سے مقدر کرے۔ اسمائے حسنیٰ کی ترمذی والی گنتی میں نمبر 11۔'
  es: "al-Khaliq — El Creador. Nombre número 11 en la enumeración de los nombres más bellos en el hadiz de Tirmidhi."
  tr: "Yaratıcı: Hiçbir şeyden var olan, hikmetiyle onlar için belirlenen Kişi. El-Tirmidi'nin Allah'ın En Güzel İsimleri hakkındaki hadislerinde adı 11."
  id: "Sang Pencipta: Dia yang membawa segala sesuatu ke dalam ketiadaan, yang ditentukan oleh kebijaksanaan-Nya. Nama nomor 11 dalam daftar yang disebutkan dalam hadits Al-Tirmidhi tentang Nama-nama Terindah Allah."
