id: concept/conflict-between-falsehoods
class: concept
kind: belief
label: { ar: "الصراع بين الباطلين", en: "Conflict between two falsehoods", ur: "دو باطلوں کے درمیان کشمکش" }
summary:
  ar: "يرى الشعراوي أن الحق واحد، فالمعارك بين حق وباطل تقصر، أما المعارك بين باطل وباطل فتطول ما لم يوجد طرف جامع يصلح بينها، وأن غياب الطائفة الثالثة المصلحة يطيل الحروب في عصره {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1062} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1063} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1064}."
  en: "Sha'rawi holds that there is only one truth, so a battle between truth and falsehood is short, while a battle between two falsehoods lasts unless a common principle or a reconciling third party appears. In his own age, he says, the absence of such a party prolongs wars {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1062} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1063} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1064}."
  ur: "شعراوی کے نزدیک حق ایک ہی ہے، اس لیے حق اور باطل کی جنگ مختصر ہوتی ہے، جبکہ دو باطلوں کی جنگ طویل ہوتی ہے جب تک کوئی مشترک اصول یا صلح کرانے والا گروہ سامنے نہ آئے۔ ان کے زمانے میں ایسے گروہ کی غیر موجودگی جنگوں کو طویل کرتی ہے {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1062} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1063} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1064}۔"
