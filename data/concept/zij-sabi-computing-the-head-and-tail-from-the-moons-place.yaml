label: { ar: "حساب رأس الجوزهر وذنبه من موضع القمر", en: "Computing the head of the dragon and its tail from the Moon's place", ur: "چاند کے مقام سے رأس جوزہر اور ذنب کا حساب", es: "Calculando la cabeza del dragón y su cola desde la posición de la Luna.", fr: "Calculer la tête et la queue du dragon à partir de la position de la Lune", tr: "Ayın konumundan yola çıkarak ayın başını ve kuyruğunu hesaplamak", id: "Menghitung kepala dan ekor bulan dari posisinya." }
summary:
  ar: "يستخرج البتاني موضع الرأس الشمالي، ويُسمّى رأس الجوزهر، بالوسط المستخرج للوقت المطلوب على الرسم المذكور في استخراج الأوساط، فما بلغ أُلقي منه دوراً وأثبت الباقي من أول الحمل؛ أما الذنب فيقع على قطر فلكه، أي الجزء المقابل لجزء الرأس درجة بدرجة. {cite:zij-sabi-nallino-byblion p.113}."
  en: "Al-Battani finds the position of the northern node, called the head of the dragon, from the mean for the time sought, using the method for finding the means. Full circuits are removed and the rest is counted from the first point of Aries. The tail falls on the diameter of the sphere, the point opposite the head, degree for degree. {cite:zij-sabi-nallino-byblion p.113}."
  ur: "البتانی شمالی عقدہ، جسے رأس جوزہر کہا جاتا ہے، مطلوبہ وقت کے اوسط سے اوساط نکالنے کے طریقے پر معلوم کرتے ہیں؛ پورے دور نکالے جاتے ہیں اور باقی حمل کے پہلے نقطے سے گنا جاتا ہے۔ ذنب فلک کے قطر پر ہوتا ہے، یعنی رأس کے مقابل درجہ بدرجہ۔ {cite:zij-sabi-nallino-byblion p.113}۔"
  es: "Al-Battani halla la posición del nodo norte, llamado la cabeza del dragón, a partir de la media del tiempo buscado, utilizando el método para hallar las medias. Se eliminan los circuitos completos y el resto se cuenta desde el primer punto de Aries. La cola cae sobre el diámetro de la esfera, el punto opuesto a la cabeza, grado por grado. {cite:zij-sabi-nallino-byblion p.113}."
  fr: "Al-Battani détermine la position du nœud nord, appelé la tête du dragon, à partir de la moyenne du temps recherché, en utilisant la méthode de calcul des moyennes. Les cycles complets sont supprimés et le reste est compté à partir du premier point du Bélier. La queue se situe sur le diamètre de la sphère, au point opposé à la tête, degré pour degré. {cite:zij-sabi-nallino-byblion p.113}."
  tr: "El-Battani, ortalama hesaplamasında belirtilen şemaya göre gerekli süre için ortalamayı hesaplayarak, El-Jawzar başı olarak adlandırılan kuzey başının konumunu belirler. Bu ortalamadan bir döngü çıkarılır ve kalan kısım Koç burcunun başlangıcından itibaren belirlenir. Kuyruğa gelince, o da küresinin çapı üzerinde, yani başın karşısındaki kısımda, derece derece yer alır. {cite:zij-sabi-nallino-byblion s.113}."
  id: "Al-Battani menentukan posisi kepala utara, yang disebut kepala Al-Jawzar, dengan menghitung rata-rata untuk waktu yang dibutuhkan sesuai dengan diagram yang disebutkan dalam perhitungan rata-rata. Dari rata-rata ini, satu siklus dikurangi, dan sisanya ditetapkan dari awal Aries. Adapun ekornya, terletak pada diameter bolanya, yaitu bagian yang berlawanan dengan kepala, derajat demi derajat. {cite:zij-sabi-nallino-byblion p.113}."
