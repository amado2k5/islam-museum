  en: "Diseases of the nerves"
  fr: "Les maladies des nerfs"
  ur: "اعصاب کے امراض"
summary:
  ar: "يفتتح ابن سينا الفن الثاني بأن العصب قد تعرض له أصناف الأمراض الثلاثة: المزاجية والآلية وانحلال الفرد المشترك، وتظهر الآفة في أفعاله الطبيعية والحاسة والمحركة {cite:canon-ibn-sina-print-v2 p.135}"
  en: "Ibn Sina opens the second fann: the nerve is subject to the three classes of disease — temperamental, organic, and dissolution of continuity — and the lesion appears in its natural, sensory and motor functions {cite:canon-ibn-sina-print-v2 p.135}"
  fr: "Ibn Sina ouvre le deuxième fann : le nerf est sujet aux trois classes de maladies — celles du tempérament, celles de l’organe et la dissolution de la continuité — et la lésion apparaît dans ses fonctions naturelles, sensitives et motrices {cite:canon-ibn-sina-print-v2 p.135}"
  ur: "ابن سینا دوسرے فن کا آغاز اس سے کرتا ہے کہ عصب پر امراض کی تینوں اقسام گزر سکتی ہیں: مزاجی، آلی اور انحلال اتصال، اور آفت اس کے طبیعی، حاس اور محرک افعال میں ظاہر ہوتی ہے {cite:canon-ibn-sina-print-v2 p.135}۔"
