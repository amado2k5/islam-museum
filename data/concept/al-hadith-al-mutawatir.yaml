id: concept/al-hadith-al-mutawatir
class: concept
kind: term
label: { ar: "الحديث المتواتر", en: "The mass-transmitted report (mutawatir)", fr: "Le hadith transmis en masse (mutawatir)", ur: "متواتر حدیث", es: "El informe transmitido masivamente (mutawatir)", tr: "Mütevetir Hadis", id: "Hadis Mutevetir" }
term: { ar: "المتواتر، من التواتر وهو التتابع", en: "al-mutawatir" }
summary:
  ar: "المتواتر عند ابن حجر في «نزهة النظر» خبر له طرق كثيرة بلا حصر عدد معيّن، أحالت العادة تواطؤ رواته على الكذب، رووه عن مثلهم من الابتداء إلى الانتهاء، وكان مستند انتهائهم الحس، وصحب خبرهم إفادة العلم لسامعه؛ وهو يفيد العلم اليقيني الضروري، ولا يُبحث عن رجاله لأنه ليس من مباحث علم الإسناد {cite:nuzhat-al-nazar-itr-bushra-2011 p. 37-41}."
  en: "For Ibn Hajar in Nuzhat al-Nazar the mutawatir is a report with many chains, not limited to a set number, whose transmitters custom rules out having agreed on a lie, who relate it from others like them from beginning to end, whose final basis is sense perception, and whose report yields knowledge in the hearer; it gives certain, immediate knowledge, and its narrators are not examined, since it is not a subject of the science of chains {cite:nuzhat-al-nazar-itr-bushra-2011 p. 37-41}."
  fr: "Pour Ibn Hajar, dans la Nuzhat al-Nazar, le mutawatir est un récit rapporté par de nombreuses chaînes, dont le nombre n’a pas de seuil fixe. Les usages excluent que ses transmetteurs se soient entendus sur un mensonge ; ils le transmettent de groupes semblables du début à la fin, avec pour fondement ultime une perception sensible, et leur récit produit une connaissance chez l’auditeur. Celle-ci est certaine et immédiate. On n’examine pas les transmetteurs, car la transmission de masse ne relève pas de la science des chaînes {cite:nuzhat-al-nazar-itr-bushra-2011 p. 37-41}."
  ur: "ابن حجر کے نزدیک «نزہۃ النظر» میں متواتر وہ خبر ہے جس کے بہت سے طرق ہوں، کسی مقررہ عدد کی قید کے بغیر، جن کے راویوں کا جھوٹ پر متفق ہونا عادتاً محال ہو، وہ اپنے جیسوں سے ابتدا سے انتہا تک روایت کریں، ان کی انتہا کی بنیاد حس ہو، اور ان کی خبر سننے والے کو علم دے؛ یہ یقینی ضروری علم دیتی ہے، اور اس کے راویوں کی چھان بین نہیں ہوتی کیونکہ یہ علمِ اسناد کے مباحث میں سے نہیں {cite:nuzhat-al-nazar-itr-bushra-2011 p. 37-41}۔"
  es: "Para Ibn Hajar en Nuzhat al-Nazar, el mutawatir es un relato con muchas cadenas, no limitado a un número fijo, cuya costumbre de los transmisores descarta que hayan acordado una mentira, que lo relatan de otros como ellos de principio a fin, cuya base final es la percepción sensorial, y cuyo relato produce conocimiento en el oyente; da conocimiento cierto e inmediato, y sus narradores no son examinados, ya que no es un tema de la ciencia de las cadenas {cite:nuzhat-al-nazar-itr-bushra-2011 p. 37-41}."
  tr: "İbn Hajar'a göre 'Nuzhat al-Nazar'daki mutevatir, belirli bir sayı sınırı olmadan birçok zincire sahip bir rapordur. Gelenek, anlatıcılarının işbirliği yapmasını yalan söylemeye bağlardı. Baştan sona başkalarından anlatır ve onların sonucunun temeli duyusalıydı; raporları dinleyiciye bilgi eşlik eder; gerekli kesin bilgiyi iletir ve aktarıcılarını aramaz çünkü aktarım zincirleri biliminin bir parçası değildir {cite:nuzhat-al-nazar-itr-bushra-2011, s. 37-41}."
  id: "Menurut Ibn Hajar, mutawatir dalam 'Nuzhat al-Nazar' adalah laporan dengan banyak rantai tanpa batas angka yang tetap. Tradisi mengaitkan kerja sama narator dengan kebohongan. Dari awal hingga akhir, ia menceritakan dari orang lain, dan dasar kesimpulan mereka adalah sensorik; laporannya menemani pendengar dengan pengetahuan; ia menyampaikan informasi yang tepat dan tidak mencari pemancarnya karena rantai transmisi bukan bagian dari ilmu pengetahuan {cite:nuzhat-al-nazar-itr-bushra-2011, hlm. 37-41}."
