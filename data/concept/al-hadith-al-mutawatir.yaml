id: concept/al-hadith-al-mutawatir
class: concept
kind: term
label: { ar: "الحديث المتواتر", en: "The mass-transmitted report (mutawatir)", ur: "متواتر حدیث" }
term: { ar: "المتواتر، من التواتر وهو التتابع", en: "al-mutawatir" }
summary:
  ar: "المتواتر عند ابن حجر في «نزهة النظر» خبر له طرق كثيرة بلا حصر عدد معيّن، أحالت العادة تواطؤ رواته على الكذب، رووه عن مثلهم من الابتداء إلى الانتهاء، وكان مستند انتهائهم الحس، وصحب خبرهم إفادة العلم لسامعه؛ وهو يفيد العلم اليقيني الضروري، ولا يُبحث عن رجاله لأنه ليس من مباحث علم الإسناد {cite:nuzhat-al-nazar-itr-bushra-2011 p. 37-41}."
  en: "For Ibn Hajar in Nuzhat al-Nazar the mutawatir is a report with many chains, not limited to a set number, whose transmitters custom rules out having agreed on a lie, who relate it from others like them from beginning to end, whose final basis is sense perception, and whose report yields knowledge in the hearer; it gives certain, immediate knowledge, and its narrators are not examined, since it is not a subject of the science of chains {cite:nuzhat-al-nazar-itr-bushra-2011 p. 37-41}."
  ur: "ابن حجر کے نزدیک «نزہۃ النظر» میں متواتر وہ خبر ہے جس کے بہت سے طرق ہوں، کسی مقررہ عدد کی قید کے بغیر، جن کے راویوں کا جھوٹ پر متفق ہونا عادتاً محال ہو، وہ اپنے جیسوں سے ابتدا سے انتہا تک روایت کریں، ان کی انتہا کی بنیاد حس ہو، اور ان کی خبر سننے والے کو علم دے؛ یہ یقینی ضروری علم دیتی ہے، اور اس کے راویوں کی چھان بین نہیں ہوتی کیونکہ یہ علمِ اسناد کے مباحث میں سے نہیں {cite:nuzhat-al-nazar-itr-bushra-2011 p. 37-41}۔"
