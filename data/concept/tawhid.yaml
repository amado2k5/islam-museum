- tradition: sunni
  id: sunni-sallabi-graves
  stance:
    ar: 'لا تُتخذ القبور مساجد ولا أعياداً؛ والزيارة للاتعاظ والدعاء للميت لا لطلب الحاجة'
    en: 'Graves must not be made mosques or festive gatherings; visiting is for reflection and prayer for the dead, not for seeking needs'
  summary:
    ar: 'يقرر الصلابي هذا الموقف استناداً إلى نهي النبي عن جعل قبره عيداً وإلى فعل الصحابة، ويعدّ الاحتفال السنوي بالمزارات بدعة بدأها العبيديون في القرن الرابع بحسب المقريزي {cite:sallabi-ali-vol1 p. 238-241}.'
    en: 'Al-Sallabi holds this on the basis of the Prophet''s prohibition of making his grave a feast and the practice of the Companions, and regards annual shrine festivals as an innovation he dates to the Fatimids in the fourth century, citing al-Maqrizi {cite:sallabi-ali-vol1 p. 238-241}.'
  sources:
  - source/sallabi-ali-vol1
- tradition: sunni
  id: sunni-sharawi-names-by-revelation
  stance:
    ar: 'أسماء الله وصفاته توقيفية، ولا يدركها العقل إلا بالوحي'
    en: 'God''s names and attributes are fixed by revelation; reason can know that a power exists but cannot picture it'
  holders: [person/muhammad-mutawalli-al-shaarawi]
  summary:
    ar: 'يرى الشعراوي أن العقل يعرف وجود القوة المطلقة ولا يتصورها، وأن أسماء الله توقيفية لا مجال للعقل فيها، ويستدل بأن لفظ الجلالة موجود في كل اللغات وأن القرآن تحدى من يسمّي غيره به {cite:al-tarbiya-fi-madrasat-al-nubuwwa-1999 p. 12}{cite:al-tarbiya-fi-madrasat-al-nubuwwa-1999 p. 23}.'
    en: 'Sha''rawi holds that reason can know that an absolute power exists but cannot picture it, and that God''s names are fixed by revelation with no place for reason. He argues that the name Allah appears in all languages and that the Qur''an challenged anyone to name another with it {cite:al-tarbiya-fi-madrasat-al-nubuwwa-1999 p. 12}{cite:al-tarbiya-fi-madrasat-al-nubuwwa-1999 p. 23}.'
  sources: [source/al-tarbiya-fi-madrasat-al-nubuwwa-1999]
