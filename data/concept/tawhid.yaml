- tradition: sunni-hanbali
  id: aqida-wasitiyya
  stance:
    ar: الإيمان بما وصف الله به نفسه من غير تحريف ولا تعطيل ومن غير تكييف ولا تمثيل
    en: Believing in what God described Himself with, without distortion or denial and without how or likeness
  summary:
    ar: يقول ابن تيمية إن من الإيمان بالله الإيمان بما وصف به نفسه وبما وصفه به رسوله «من غير تحريف ولا تعطيل، ومن غير تكييف ولا تمثيل»، ويقول إن ما ذكره الله من أنه فوق العرش ومع خلقه «حق على حقيقته» وإن قربه ومعيته لا ينافيان علوه.
    en: Ibn Taymiyya says belief in God includes belief in what He described Himself and what His messenger described Him with, without distortion or denial and without how or likeness, and that what God mentioned of His being above the throne and with His creatures is true in reality, His nearness and withness not contradicting His height.
