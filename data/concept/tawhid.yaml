issue:
  ar: كيف يُوصف الله تعالى في صفاته، وما حدود إثباتها وتنزيهها؟
  en: How is God described in His attributes, and what are the limits of affirming them and declaring Him above likeness?
perspectives:
- tradition: sunni-hanafi
  id: aqida-tahawiyya
  stance:
    ar: 'التوحيد مع التنزيه: لا يُشبَّه الله ولا تُنفى صفاته'
    en: 'Tawhid with transcendence: God is neither likened to creation nor are His attributes denied'
  summary:
    ar: يقول الطحاوي إن الله واحد لا شريك له ولا شيء مثله، ويجعل الدين بين التشبيه والتعطيل، وينزّهه عن الحدود والغايات والأركان والأعضاء والأدوات ويقول إنه لا تحويه الجهات الست.
