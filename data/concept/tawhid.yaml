id: concept/tawhid
class: concept
kind: doctrine
label:
  ar: التوحيد
  en: Tawhid (the oneness of God)
summary:
  ar: إفراد الله بالألوهية ونفي الشريك والمثيل عنه؛ يبدأ به أبو جعفر الطحاوي بيان العقيدة فيقول إن الله واحد لا شريك له ولا شيء مثله ولا إله غيره.
  en: Affirming that God is one and without partner or likeness; al-Tahawi opens his statement of the creed with it, saying God is one with no partner, nothing like Him and no god but Him.
wings: [ideas]
themes:
- creed
