- tradition: sunni-hanbali
  id: aqida-wasitiyya
  stance:
    ar: الإيمان بما وصف الله به نفسه من غير تحريف ولا تعطيل ومن غير تكييف ولا تمثيل
    en: Believing in what God described Himself with, without distortion or denial and without how or likeness
  summary:
    ar: يقول ابن تيمية إن من الإيمان بالله الإيمان بما وصف به نفسه وبما وصفه به رسوله «من غير تحريف ولا تعطيل، ومن غير تكييف ولا تمثيل»، ويقول إن ما ذكره الله من أنه فوق العرش ومع خلقه «حق على حقيقته» وإن
      قربه ومعيته لا ينافيان علوه.
    en: Ibn Taymiyya says belief in God includes belief in what He described Himself and what His messenger described Him with, without distortion or denial and without how or likeness, and that what God
      mentioned of His being above the throne and with His creatures is true in reality, His nearness and withness not contradicting His height.
  holders:
  - person/ibn-taymiyya
  - work/aqida-wasitiyya
  evidence:
  - ref: source/aqida-wasitiyya
    note:
      ar: ص 7 و8 و17
      en: pp. 7, 8 and 17
  sources:
  - source/aqida-wasitiyya
- tradition: sunni-ashari
  id: maqalat-ashari
  stance:
    ar: إثبات الصفات والاستواء واليدين والعينين والوجه بلا كيف، وأسماء الله لا يقال إنها غير الله
    en: Affirming the attributes, the istiwa, the hands, the eyes and the face without how, and that God's names are not said to be other than God
  summary:
    ar: يذكر الأشعري في عرضه لقول أهل الحديث والسنة أن الله واحد فرد صمد، وأنه على عرشه، وأن له يدين وعينين ووجهاً «بلا كيف»، وأن أسماء الله لا يقال إنها غير الله، ويثبتون له العلم والسمع والبصر والقوة.
    en: In his account of the position of the hadith scholars and Ahl al-Sunna, al-Ash'ari says God is one, single, the Eternal Refuge, that He is on His throne, that He has hands, eyes and a face without
      how, that God's names are not said to be other than God, and they affirm His knowledge, hearing, sight and power.
