- tradition: sunni-hanbali
  id: lumat-al-itiqad
  stance:
    ar: إثبات الصفات كما وردت دون تأويل ولا تشبيه ولا كيف
    en: Affirming the attributes as they came, without interpretation, likening or how
  summary:
    ar: 'يقول ابن قدامة إن الله «موصوف بما وصف به نفسه في كتابه العظيم، وعلى لسان نبيه الكريم»، وإن كل ما ورد من الصفات وجب الإيمان به وتلقيه بالتسليم والقبول وترك التعرض له بالرد والتأويل والتشبيه والتمثيل؛ ويقرّ الاستواء ويقول مع مالك: «الاستواء غير مجهول، والكيف غير معقول».'
    en: 'Ibn Qudama says God is described as He described Himself in His Book and by His Prophet, that every attribute that came must be believed and received with submission and acceptance, leaving aside rejection, interpretation, likening and representation; he affirms the istiwa and quotes Malik: the istiwa is not unknown and the how is not graspable.'
  holders:
