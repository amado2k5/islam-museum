summary:
  ar: "قضى عمر في اليربوع يقتله المحرم بجفرة: أصغر صيد في كتاب القضاء، جرذوذ الصحراء الواثب له مكانه في فقه الحرم."
  en: "Umar ruled a jafra (weaned lamb) in compensation for the jerboa killed in ihram — the smallest game in the book of rulings, the desert's bounding rat with its place in the law of the sanctuary."
  ur: "عمر نے احرام میں مارے گئے جربوا کے بدلے ایک جفرہ مقرر کیا — فقہ میں سب سے چھوٹا شکار، صحرا کا اچھلنے والا چوہا جس کی حرم کے فقہ میں جگہ ہے۔"
  es: "Umar dictaminó que se debía entregar un jafra (cordero destetado) como compensación por el jerbo sacrificado en ihram, la presa más pequeña del libro de preceptos, la rata saltarina del desierto con su lugar en la ley del santuario."
  fr: "Umar accorda un jafra (agneau sevré) en compensation de la gerboise tuée en état d'ihram — le plus petit gibier du livre des jugements, le rat bondissant du désert avec sa place dans la loi du sanctuaire."
  tr: "Ömer Yarbu'da zaman geçirdi ve hacı onu Muharrem'de bir parçayla öldürdü: Kıyamet Kitabı'ndaki en küçük av, çöl faresinin Haram hukukunda yerini bulması."
  id: "Umar menghabiskan waktu di Yarbu' di mana peziarah membunuhnya dalam Muharram dengan sebuah fragmen: tangkapan terkecil dalam Kitab Penghakiman, tikus gurun yang melompat ke tempatnya dalam yurisprudensi Haram."
