id: concept/taghyir-manahij-al-din
class: concept
kind: social
sensitivity: contested
label:
  ar: "تغيير مناهج تدريس الدين في العالم العربي"
  en: "Changing the religion curricula in the Arab world"
  ur: "عرب دنیا میں دینی نصاب کی تبدیلی"
issue:
  ar: "هل تحقق مناهج تدريس الدين في مدارس العالم العربي أهدافها، وأين الخلل فيها، وهل جاء تغييرها الأخير إصلاحاً أم استجابة لضغوط خارجية؟"
  en: "Do the religion curricula in the schools of the Arab world achieve their aims, where is the fault in them, and was their recent change a reform or a response to outside pressure?"
  ur: "کیا عرب دنیا کے اسکولوں میں دینی نصاب اپنے مقاصد پورے کرتا ہے، اس میں خرابی کہاں ہے، اور کیا اس کی حالیہ تبدیلی اصلاح تھی یا بیرونی دباؤ کا جواب؟"
summary:
  ar: "حلقة «الوسطية» عن تغيير مناهج تدريس الدين وتطويرها في العالم العربي. قيّم شباب الاستوديو فعالية هذه المناهج في تحقيق أهدافها: 12% ممتازة و16% جيدة و29% مقبولة و43% ضعيفة؛ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep27 00:08:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep27 00:08:30} ثم عرض المقدّم عشرة أهداف يراها لمناهج الدين وطلب من ضيوفه، وهم أساتذة في العقيدة والمناهج والتربية من الرياض وحلوان والإسكندرية وعضو في مجلس الشعب المصري، تقييمها واحداً واحداً، فجاءت الأحكام بين الغياب والضعف إلا في مواضع قليلة {cite:assabile-tareq-al-suwaidan al-wassitiya/ep27 00:12:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep27 00:31:30}. واختلف الضيوف في سبب التغيير الأخير: ضغط غربي مقصود، أم تقصير داخلي استغلّه الغرب. وتنتهي النسخة المؤرشفة عند الدقيقة الرابعة والخمسين تقريباً قبل ختام الحلقة."
  en: "The 'Al-Wasatiyya' episode on changing and developing the religion curricula in the Arab world. The young studio audience rated how well these curricula achieve their aims: 12% excellent, 16% good, 29% acceptable and 43% weak. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep27 00:08:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep27 00:08:30} The presenter then set out ten aims he sees for religion curricula and asked his guests, professors of creed, curricula and education from Riyadh, Helwan and Alexandria and a member of the Egyptian People's Assembly, to rate them one by one; the verdicts ranged from absent to weak, with few exceptions. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep27 00:12:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep27 00:31:30} The guests disagreed on the cause of the recent change: deliberate Western pressure, or failings at home that the West exploited. The archived copy ends at about the fifty-fourth minute, before the episode's close."
  ur: "«الوسطیہ» کی وہ قسط جو عرب دنیا میں دینی نصاب کی تبدیلی اور ترقی پر ہے۔ اسٹوڈیو کے نوجوان حاضرین نے اس نصاب کے اپنے مقاصد پورے کرنے کی کارکردگی پر رائے دی: 12% عمدہ، 16% اچھا، 29% قابلِ قبول اور 43% کمزور۔ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep27 00:08:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep27 00:08:30} پھر میزبان نے دینی نصاب کے دس مقاصد پیش کیے جو وہ ضروری سمجھتے ہیں اور اپنے مہمانوں سے، جو ریاض، حلوان اور اسکندریہ کے عقیدہ، نصاب اور تعلیم کے اساتذہ اور مصری مجلسِ شعب کے ایک رکن تھے، ایک ایک کر کے ان کی درجہ بندی کرائی؛ فیصلے چند مستثنیات کے سوا غیر موجود سے کمزور کے درمیان رہے۔ {cite:assabile-tareq-al-suwaidan al-wassitiya/ep27 00:12:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep27 00:31:30} حالیہ تبدیلی کے سبب پر مہمانوں میں اختلاف ہوا: دانستہ مغربی دباؤ، یا اندرونی کوتاہی جس سے مغرب نے فائدہ اٹھایا۔ آرکائیو کی نقل قسط کے اختتام سے پہلے تقریباً چوّنویں منٹ پر ختم ہو جاتی ہے۔"
perspectives:
- tradition: sunni
  id: deliberate-outside-pressure
  stance:
    ar: "التغيير الأخير ضغط خارجي مقصود أفرغ المناهج من العقيدة والجهاد والأحكام"
    en: "The recent change was deliberate outside pressure that emptied the curricula of creed, jihad and rulings"
  summary:
    ar: "رأى الأستاذ علي لبن، عضو مجلس الشعب المصري والباحث في التربية، أن لجنة مراجعة الكتب الدينية في مصر ترأستها أمريكية سمّاها ليندا لامبرت واشترطت إبراز المشترك مع الأديان الأخرى، فحُذف الربا والخمر والجهاد والحكم بما أنزل الله، وأن التغيير طال نحو عشر دول؛ وهذه روايته ولم تُراجَع {cite:assabile-tareq-al-suwaidan al-wassitiya/ep27 00:09:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep27 00:10:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep27 00:49:30}."
    en: "Ali Labban, a member of the Egyptian People's Assembly and a researcher in education, held that the committee reviewing Egypt's religious textbooks was chaired by an American he named as Linda Lambert, who required the common ground with other religions to be brought out, so that riba, wine, jihad and ruling by what God revealed were removed, and that the change reached about ten states; this is his account and has not been checked. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep27 00:09:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep27 00:10:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep27 00:49:30}"
  holders: []
  evidence:
  - ref: source/assabile-tareq-al-suwaidan
    note: {en: "al-wassitiya ep27, 00:09:30-00:10:30, 00:32:00-00:33:30, 00:49:30-00:52:00"}
- tradition: sunni
  id: failing-at-home-first
  stance:
    ar: "الخلل فينا أولاً: وزارات تعامل مادة الدين بوصفها هامشية ومؤلفون لا يحسنون تصوّر الإسلام، والضغط الغربي مكمّل"
    en: "The fault is ours first: ministries treat religion as a marginal subject and authors lack a sound picture of Islam; Western pressure only completes it"
  summary:
    ar: "رأى الدكتور جميل علام، عميد معهد الدراسات الإسلامية والدعوة في الإسكندرية، أن مادة التربية الدينية تحولت من مادة أساسية إلى غير أساسية ثم أُلغيت بطريقة أو بأخرى، وأن واضعي المناهج مسلمون، وأن المشكلة في إهمالنا وضع تصوّر صحيح للدين وفي اختيار مؤلفين لا يعرفون الإسلام، وأن الدور الغربي مكمّل لأخطائنا {cite:assabile-tareq-al-suwaidan al-wassitiya/ep27 00:34:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep27 00:35:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep27 00:36:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep27 00:38:30}."
    en: "Dr Jamil Allam, dean of the Institute of Islamic Studies and Da'wa in Alexandria, held that religious education went from a core subject to a non-core one and was then cancelled in one way or another, that those who set the curricula are Muslims, and that the problem is our own neglect of a sound picture of the religion and the choice of authors who do not know Islam, the Western role only completing our mistakes. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep27 00:34:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep27 00:35:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep27 00:36:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep27 00:38:30}"
  holders: []
  evidence:
  - ref: source/assabile-tareq-al-suwaidan
    note: {en: "al-wassitiya ep27, 00:34:00-00:38:30"}
- tradition: sunni
  id: review-needed-without-deletion
  stance:
    ar: "المراجعة لازمة لتحسين المناهج لا لحذف الجهاد والربا، والضغط الخارجي ظالم لكنه قد ينفع"
    en: "Review is needed to improve the curricula, not to delete jihad and riba; the outside pressure is unjust but may be useful"
  summary:
    ar: "رأى الدكتور خالد القاسم، أستاذ العقيدة في جامعة الملك سعود، أن المناهج السعودية لا تكفّر الأشاعرة ولا عموم الصوفية لكن فيها نوعاً من الشحن قد يطوّره المدرس، وأن الإرهاب لم ينشأ من التكفير والتبديع في المناهج، وأن الضغط الغربي ظالم جائر لكنه قد يكون مفيداً في مراجعة المناهج وتحسينها، وأن التغيير في المملكة كان بسيطاً بسبب ضغط داخلي {cite:assabile-tareq-al-suwaidan al-wassitiya/ep27 00:46:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep27 00:47:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep27 00:48:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep27 00:53:30}."
    en: "Dr Khalid al-Qasim, professor of creed at King Saud University, held that the Saudi curricula do not declare the Ash'aris or Sufis in general unbelievers but contain a kind of charged mobilisation a teacher may push further, that terrorism did not grow from the curricula's charges of unbelief and innovation, that the Western pressure is unjust but may be useful for reviewing and improving the curricula, and that the change in the Kingdom was small and came from pressure at home. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep27 00:46:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep27 00:47:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep27 00:48:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep27 00:53:30}"
  holders: []
