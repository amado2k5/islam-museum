    note: {en: "al-wassitiya ep27, 00:41:30-00:54:00"}
- tradition: other
  id: presenter-view
  stance:
    ar: "رأي المقدّم: عشرة أهداف لمناهج الدين، أكثرها غائب أو ضعيف، والنقد لا يلغي الإيجابيات"
    en: "The presenter's view: ten aims for religion curricula, most of them absent or weak; criticism does not cancel the merits"
  summary:
    ar: "رأي طارق السويدان (رأي المتحدث): لو كتب المناهج لبناها على عشرة أهداف تبدأ بغرس العقيدة وتنتهي بالمشاركة المدنية، وخلص من تقييم الضيوف إلى أن عندنا مشكلة كبيرة جداً في مناهج الدين؛ ونقل انتقادات شديدة على المناهج السعودية مع قوله إنها من أعمق المناهج الدينية وإن إيجابياتها محفوظة {cite:assabile-tareq-al-suwaidan al-wassitiya/ep27 00:12:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep27 00:27:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep27 00:42:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep27 00:43:00}."
    en: "Tareq al-Suwaidan's view (the speaker's opinion): were he writing the curricula, he would build them on ten aims, from rooting the creed to civic participation, and from the guests' ratings he concluded that there is a very large problem in religion curricula; he relayed sharp criticisms of the Saudi curricula while saying they are among the deepest religion curricula and that their merits stand. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep27 00:12:00} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep27 00:27:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep27 00:42:30} {cite:assabile-tareq-al-suwaidan al-wassitiya/ep27 00:43:00}"
