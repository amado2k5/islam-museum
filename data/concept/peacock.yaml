summary:
  ar: "الطاووس عند الدميري: أحسن الطير منظراً وأقبحه صوتاً، ومن حكمته أنه إذا صاح بخجل لأجله رجليه؛ وروي في أخبار الآداب أنه من الطير الذي دخلته آفة الكبر، وهي أخبار أدب لا أحاديث."
  en: "The peacock in al-Damiri: the fairest of birds to see and the ugliest of voice, and among its wisdom-signs that it cries out shamed at its feet; the books of manners remember it as the bird touched by pride — lore of the adab, not Prophetic report."
  ur: "دمیری کے نزدیک مور: دیکھنے میں سب سے حسین اور آواز میں بدترین پرندہ، اس کی حکمت یہ کہ وہ اپنے پاؤں پر شرما کر چیختا ہے؛ ادب کی کتابوں میں اسے تکبر سے چنہوتا ہوا پرندہ کہا گیا — یہ ادبی روایت ہے نبوی حدیث نہیں۔"
