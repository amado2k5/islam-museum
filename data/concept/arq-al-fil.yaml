label: { ar: "عرق الفيل", en: "Elephant's sweat (musth perfume)", fr: "Sueur d’éléphant (parfum de musth)", es: "Sudor de elefante (perfume de mosto)", ur: "ہاتھی کا پسینہ ⁦(مستھ پرفیوم)⁩", tr: "fil aslanı", id: "singa gajah" }
summary:
  ar: "العرق الذي يظهر في فصل من السنة على جباه الفيلة بأرض الهند ورؤوسها كالمسك، تراعي الهند ظهوره فتأخذه وتجعله على بعض أدهانها الطيبة فيكون أغلى طيبها تستعمله ملوكها وخواصها، ويستعمله كثير من فتاكهم عند اللقاء والحرب لأنه عندهم يشجع القلب ويقوي النفس، وأكثر ما يظهر في حال اغتلامها وهيجانها حين يهرب عنها سواسها ولا تفرق بين من تعرف وغيره، فيند الفيل عن بلده نحو شهراً وهو في بقية من سكره {cite:muruj-al-dhahab p. 349}."
  en: "The musk-like secretion on Indian elephants' foreheads in their season of frenzy — gathered at its appearing for the kings' costliest unguents and worn by their champions into battle, while the maddened bull ranges a month before sobering home {cite:muruj-al-dhahab p. 349}."
  fr: "La sécrétion semblable au musc qui apparaît sur le front des éléphants de l’Inde pendant leur saison de fureur — recueillie dès son apparition pour les onguents les plus coûteux des rois et portée par leurs champions au combat, tandis que le mâle furieux erre un mois avant de retrouver son calme et de rentrer chez lui {cite:muruj-al-dhahab p. 349}."
  es: "La secreción parecida al almizcle en la frente de los elefantes indios durante su época de frenesí —recogida en su aparición para los ungüentos más costosos de los reyes y usada por sus campeones en la batalla, mientras el toro enloquecido vaga durante un mes antes de volver a casa con la cabeza fría {cite:muruj-al-dhahab p. 349}."
  ur: "ہندوستانی ہاتھیوں کی پیشانیوں پر ان کے جنون کے موسم میں کستوری کی طرح کی رطوبت بادشاہوں کے مہنگے ترین ناگواروں کے سامنے آنے پر جمع ہوتی تھی اور ان کے چیمپیئنوں کو جنگ میں پہنایا جاتا تھا، جب کہ دیوانہ بیل ایک ماہ قبل اپنے گھر میں آرام کرتا تھا {حوالہ: مروج الذہب صفحہ۔ 349}۔"
  tr: "Hindistan diyarında fillerin alnında yılın bir mevsiminde beliren ter, başları misk gibidir. Hindistan bu görünümü alır ve bazı güzel parfümlerine yerleştirir; böylece kralları ve elitleri tarafından kullanılan en değerli parfüm olur. Birçok katili, çatışma ve savaş zamanlarında kullanır çünkü onlar için kalbi teşvik eder ve ruhu güçlendirir. En belirgin olarak, hapis ve huzursuzluk durumlarında fısıltıları ondan kaçıp tanıdıklarını diğerleriyle ayırt etmez. Fil, sarhoşken yaklaşık bir ay boyunca ülkesini reddeder {cite:muruj-al-dhahab, s. 349}."
  id: "Keringat yang muncul di dahi gajah di tanah India, dan kepala mereka seperti musk. India mengambil penampilannya dan meletakkannya pada beberapa parfum baiknya, menjadikannya parfum paling berharga yang digunakan oleh raja dan elitnya. Banyak pembunuhnya menggunakannya saat pertempuran dan perang karena, bagi mereka, parfum ini menguatkan hati dan memperkuat jiwa. Hal ini paling terlihat dalam kasus penahanan dan kegelisahan, ketika bisikannya melarikan diri dan tidak membedakan antara yang dikenalnya dan yang lain. Gajah menolak negaranya selama sekitar sebulan saat ia tetap dalam keadaan mabuk {cite:muruj-al-dhahab, hlm. 349}."
