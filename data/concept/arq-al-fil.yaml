label: { ar: "عرق الفيل", en: "Elephant's sweat (musth perfume)" }
summary:
  ar: "العرق الذي يظهر في فصل من السنة على جباه الفيلة بأرض الهند ورؤوسها كالمسك، تراعي الهند ظهوره فتأخذه وتجعله على بعض أدهانها الطيبة فيكون أغلى طيبها تستعمله ملوكها وخواصها، ويستعمله كثير من فتاكهم عند اللقاء والحرب لأنه عندهم يشجع القلب ويقوي النفس، وأكثر ما يظهر في حال اغتلامها وهيجانها حين يهرب عنها سواسها ولا تفرق بين من تعرف وغيره، فيند الفيل عن بلده نحو شهراً وهو في بقية من سكره {cite:muruj-al-dhahab p. 349}."
  en: "The musk-like secretion on Indian elephants' foreheads in their season of frenzy — gathered at its appearing for the kings' costliest unguents and worn by their champions into battle, while the maddened bull ranges a month before sobering home {cite:muruj-al-dhahab p. 349}."
