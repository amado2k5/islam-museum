id: concept/yajuj-majuj
class: concept
kind: belief
label:
  ar: يأجوج ومأجوج
  en: Ya'juj and Ma'juj
  ur: یاجوج ماجوج
summary:
  ar: "أمتان مفسدتان في الأرض حبسهما ذو القرنين خلف سدٍّ من زبر الحديد يفرغ عليه القطر؛ يحفرونه كل يوم حتى إذا جاء وعد الله خرجوا وهم من كل حدب ينسلون، فيشربون بحيرة طبرية ويهلكهم الله بالنغف {cite:tafsir-ibn-kathir} {cite:sahih-muslim}."
  en: "Two corrupting nations confined by Dhu'l-Qarnayn behind a dam of iron and molten copper; they dig at it daily until God's promise comes and they surge forth from every height, drain the Sea of Tiberias, and are destroyed by the naghaf {cite:tafsir-ibn-kathir} {cite:sahih-muslim}."
  ur: "دو مفسد قومیں جنھیں ذوالقرنین نے لوہے اور پگھلی ہوئی تانبے کے بندھے کے پیچھے روک دیا؛ وہ روز اسے کھودتے ہیں یہاں تک کہ اللہ کا وعدہ آئے تو وہ ہر اونچائی سے اترتے ہیں، بحیرۂ طبریہ کا پانی پیتے ہیں، پھر نغف سے ہلاک ہوتے ہیں {cite:tafsir-ibn-kathir} {cite:sahih-muslim}۔"
