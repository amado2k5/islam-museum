id: concept/al-naskh
class: concept
kind: doctrine
label: { ar: "النسخ في القرآن", en: "Abrogation (naskh) in the Qur'an" }
summary:
  ar: "النسخ رفع حكم شرعي وإحلال حكم آخر محله بعد مدة علمها الله. يعرض الشعراوي هذا المعنى في تفسير سورة البقرة ويفرّق فيه بين النسخ والبداء، ويرى أنه لا يقع في العقائد ولا في الإخبار عن الماضي، وإنما في التكليف. {cite:tafsir-sharawi-khawatir-scan p.508}{cite:tafsir-sharawi-khawatir-scan p.513}"
  en: "Naskh is the removal of an existing ruling and the putting of another in its place after a term God had fixed in His knowledge. Sha'rawi develops the idea in his commentary on al-Baqara, distinguishes it from bada' (a change of mind in God), and holds that it touches obligations alone and never creed or reports of the past."
wings: [ideas]
themes: [scripture-and-its-sciences, worship-and-the-pillars]
periods: [period/prophetic-era]
regions: [global]
issue:
  ar: "هل في القرآن أحكام نُسخت، وكيف يُفهم النسخ دون نسبة تغيّر أو بداء إلى الله؟"
  en: "Are there rulings in the Qur'an that were abrogated, and how is naskh understood without ascribing a change of knowledge or bada' to God?"
perspectives:
  - tradition: sunni
    id: sunni-sharawi-replacement
    stance:
      ar: "النسخ إزالة حكم وإحلال حكم آخر، وليس بداءً"
      en: "Naskh is the removal of one ruling and the placing of another, not bada'"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقرر الشعراوي أن الحكم الأول كان مؤقتاً في علم الله منذ نزوله، وأن النسخ إزالة ثم إحلال بالتدريج حسب الواقع، وأن ذلك يختلف عن تشريع البشر الذي يُعدَّل بعد ظهور قصوره. ويستدل بتحويل القبلة من بيت المقدس إلى الكعبة على أن الحكم الثاني خير أو مماثل في زمنه {cite:tafsir-sharawi-khawatir-scan p.508}{cite:tafsir-sharawi-khawatir-scan p.509}{cite:tafsir-sharawi-khawatir-scan p.513}."
      en: "Sha'rawi holds that the first ruling was time-limited in God's knowledge from its revelation, that naskh is removal and then replacement by stages, and that this differs from human legislation, which is amended once its failure is seen. He takes the change of qibla as an example, where the second ruling is better or equal in its time {cite:tafsir-sharawi-khawatir-scan p.508}{cite:tafsir-sharawi-khawatir-scan p.509}{cite:tafsir-sharawi-khawatir-scan p.513}."
    sources: [source/tafsir-sharawi-khawatir-scan]
  - tradition: sunni
    id: sunni-sharawi-no-naskh-in-creed
    stance:
      ar: "لا نسخ في العقائد ولا في الإخبار عن الله"
      en: "No naskh in creed or in God's reports of what happened"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يذكر الشعراوي أن أمور العقيدة ثابتة منذ آدم، وأن الخبر عمّا وقع لا يُنسخ لأنه بلاغ صادق عن واقع، ويمثل لذلك بخبر الفيل. ويعطي النسخ مجاله في التكليف، ويمثل له بآية الصبر على عشرة من الكفار التي خُففت بعدها {cite:tafsir-sharawi-khawatir-scan p.513}{cite:tafsir-sharawi-khawatir-scan p.514}."
      en: "Sha'rawi says the articles of belief have not changed since Adam, and that a report of what happened is not abrogated, since it is a true message about a fact; he gives the story of the elephant as an example. Naskh belongs to obligations, and he illustrates it with the verse requiring one believer to stand against ten, later lightened {cite:tafsir-sharawi-khawatir-scan p.513}{cite:tafsir-sharawi-khawatir-scan p.514}."
    sources: [source/tafsir-sharawi-khawatir-scan]
  - tradition: sunni
    id: sunni-sharawi-scope-note
    stance:
      ar: "ما زالت آراء أهل السنة الأخرى في نطاق النسخ وشروطه دون مصدر في هذه الدفعة"
      en: "Other Sunni positions on the scope and conditions of naskh are not yet entered from a source"
    holders: []
    summary:
      ar: "لم تُدخل في هذه الدفعة من المصادر المتاحة أقوال الأصوليين في شروط النسخ وأنواعه، ولا الرأي الأكاديمي ولا الآراء الأخرى. تُضاف بعد أن يُقرأ مصدرها ويُوثّق. {cite:tafsir-sharawi-khawatir-scan p.508}"
      en: "This block does not yet enter, from a checked source, the usul scholars' conditions and kinds of naskh, nor the academic or other views. They are to be added once their sources are read and cited."
    sources: [source/tafsir-sharawi-khawatir-scan]
