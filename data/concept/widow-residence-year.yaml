    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقرر الشعراوي أن الأربعة الأشهر والعشر فرض، وأن الحول وصية يوصي بها الزوج عند حضور الوفاة، فلا يُخرجها أحد من بيته، وإن خرجت من نفسها فلا جناح عليها {cite:tafsir-sharawi-khawatir-scan p.1028}."
      en: "Sha'rawi holds that four months and ten days are obligatory, and that the year is the bequest the husband may make as death approaches; no one may expel her, and if she herself leaves there is no blame {cite:tafsir-sharawi-khawatir-scan p.1028}."
