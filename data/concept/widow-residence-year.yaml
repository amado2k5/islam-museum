id: concept/widow-residence-year
class: concept
kind: legal
label:
  ar: "السكنى حولاً وصيةً للمتوفى عنها زوجها"
  en: "Year-long residence of a widow as a bequest"
  ur: "بیوہ کا ایک سال گھر میں رہنا بطور وصیت"
  es: "Residencia de un año de duración de una viuda como legado."
  fr: "Résidence d'un an d'une veuve à titre de legs"
  tr: "Merhum kadının vasiyetine göre, konut bir yıllık kira bedeline denk gelen bir mülktür."
  id: "Rumah tersebut merupakan harta senilai satu tahun, sesuai dengan wasiat wanita yang telah meninggal tersebut."
summary:
  ar: "يبيّن الشعراوي في تفسير آية 240 حكمين: أربعة أشهر وعشر فرض على المتوفى عنها زوجها، وأن الزوج قد يوصي بأن تبقى في بيته حولاً كاملاً لا تُخرجها منه أحد، فإن خرجت باختيارها فلا جناح عليها {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1028}."
  en: "In his commentary on verse 240, Sha'rawi distinguishes two rulings: four months and ten days, which is obligatory for a widow, and a bequest the husband may make that she stay in his house for a full year, which no one may force her out of. If she leaves by her own choice there is no blame on her {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1028}."
  ur: "آیت 240 کی تفسیر میں شعراوی دو احکام میں فرق کرتے ہیں: چار مہینے دس دن، جو بیوہ پر لازم ہیں، اور شوہر کی وصیت کہ وہ ایک پورا سال اس کے گھر میں رہے اور کوئی اسے نہ نکالے۔ اگر وہ اپنی مرضی سے نکلے تو اس پر کوئی گناہ نہیں {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1028}."
  es: "En su comentario sobre el versículo 240, Sha'rawi distingue dos normas: cuatro meses y diez días, que son obligatorios para una viuda, y un legado que el marido puede hacer para que ella permanezca en su casa durante un año completo, del cual nadie puede expulsarla. Si se marcha por voluntad propia, no hay culpa en ella {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1028}."
  fr: "Dans son commentaire du verset 240, Sha'rawi distingue deux règles: une période de quatre mois et dix jours, obligatoire pour une veuve, et un legs que le mari peut faire pour qu'elle demeure chez lui pendant une année entière, sans que personne ne puisse l'en contraindre. Si elle part de son plein gré, elle n'encourt aucun blâme {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1028}."
  tr: "El-Şa'ravi, 240. ayetin tefsirinde iki hüküm açıklıyor: Kocası ölmüş kadın için dört ay on gün farzdır ve koca, kadının bir yıl boyunca evinde kalmasını ve kimsenin onu evden çıkarmamasını şart koşabilir. Eğer kadın kendi isteğiyle ayrılırsa, bunda bir sakınca yoktur. {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1028}"
  id: "Al-Sha’rawi menjelaskan dalam penafsirannya terhadap ayat 240 dua hukum: empat bulan dan sepuluh hari wajib bagi wanita yang suaminya telah meninggal, dan suami boleh menetapkan bahwa ia harus tinggal di rumahnya selama satu tahun penuh dan tidak seorang pun boleh mengusirnya. Jika ia pergi atas kemauannya sendiri, maka tidak ada celaan padanya. {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1028}."
issue:
  ar: "كيف يفصل الشعراوي بين الفرض والوصية في مدة سكنى المتوفى عنها زوجها؟"
  en: "How does Sha'rawi separate the obligation from the bequest in the widow's residence?"
  ur: "شعراوی بیوہ کی رہائش کی مدت میں فرض اور وصیت کو کیسے الگ کرتے ہیں؟"
