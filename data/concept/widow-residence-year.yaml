id: concept/widow-residence-year
class: concept
kind: legal
label:
  ar: "السكنى حولاً وصيةً للمتوفى عنها زوجها"
  en: "Year-long residence of a widow as a bequest"
  ur: "بیوہ کا ایک سال گھر میں رہنا بطور وصیت"
summary:
  ar: "يبيّن الشعراوي في تفسير آية 240 حكمين: أربعة أشهر وعشر فرض على المتوفى عنها زوجها، وأن الزوج قد يوصي بأن تبقى في بيته حولاً كاملاً لا تُخرجها منه أحد، فإن خرجت باختيارها فلا جناح عليها {cite:tafsir-sharawi-khawatir-scan p.1028}."
  en: "In his commentary on verse 240, Sha'rawi distinguishes two rulings: four months and ten days, which is obligatory for a widow, and a bequest the husband may make that she stay in his house for a full year, which no one may force her out of. If she leaves by her own choice there is no blame on her {cite:tafsir-sharawi-khawatir-scan p.1028}."
  ur: "آیت 240 کی تفسیر میں شعراوی دو احکام میں فرق کرتے ہیں: چار مہینے دس دن، جو بیوہ پر لازم ہیں، اور شوہر کی وصیت کہ وہ ایک پورا سال اس کے گھر میں رہے اور کوئی اسے نہ نکالے۔ اگر وہ اپنی مرضی سے نکلے تو اس پر کوئی گناہ نہیں {cite:tafsir-sharawi-khawatir-scan p.1028}."
issue:
  ar: "كيف يفصل الشعراوي بين الفرض والوصية في مدة سكنى المتوفى عنها زوجها؟"
  en: "How does Sha'rawi separate the obligation from the bequest in the widow's residence?"
  ur: "شعراوی بیوہ کی رہائش کی مدت میں فرض اور وصیت کو کیسے الگ کرتے ہیں؟"
