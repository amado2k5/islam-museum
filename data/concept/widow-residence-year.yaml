    stance: { ar: "أربعة أشهر وعشر فرض، والحول وصية يُخيّر فيها المرأة", en: "Four months and ten days are obligatory; the year is a bequest and the woman has the choice", ur: "چار مہینے دس دن فرض ہیں، اور ایک سال وصیت ہے جس میں عورت کو اختیار ہے" }
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقرر الشعراوي أن الأربعة الأشهر والعشر فرض، وأن الحول وصية يوصي بها الزوج عند حضور الوفاة، فلا يُخرجها أحد من بيته، وإن خرجت من نفسها فلا جناح عليها {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1028}."
      en: "Sha'rawi holds that four months and ten days are obligatory, and that the year is the bequest the husband may make as death approaches; no one may expel her, and if she herself leaves there is no blame {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1028}."
