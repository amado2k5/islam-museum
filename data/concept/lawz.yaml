  en: "Lawz (the almond)"
  ur: "لوز"
summary:
  ar: "اللوز معروف، دهنيته أقل من الجوز، حلوه معتدل مائل إلى الرطوبة ومره حار يابس في الثانية، وفيه جلاء وتنقية وتفتيح، وللمر منافع كثيرة في الرأس والصدر والكبد والكلى {cite:canon-ibn-sina-print-v1 p.544} {cite:canon-ibn-sina-print-v1 p.545}."
  en: "The almond is well known and less oily than the walnut; the sweet is balanced, leaning slightly to moisture, and the bitter hot and dry in the second degree; all kinds cleanse, purify and open, and the bitter is listed for the head, chest, liver and kidneys {cite:canon-ibn-sina-print-v1 p.544} {cite:canon-ibn-sina-print-v1 p.545}."
  ur: "بادام معروف ہے، اخروٹ سے کم چکنا؛ میٹھا معتدل ہے اور ذرا تری کی طرف مائل، اور کڑوا دوسرے درجے میں گرم خشک؛ ہر قسم جلا، تنقیہ اور تفتیح رکھتی ہے، اور کڑوے کے فوائد سر، سینے، جگر اور گردوں میں گنوائے گئے ہیں {cite:canon-ibn-sina-print-v1 p.544} {cite:canon-ibn-sina-print-v1 p.545}۔"
