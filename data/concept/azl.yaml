label:
  ar: "العَزْل"
  en: "Dismissal from office and withdrawal (azl)"
  fr: "Azl (révocation et retrait)"
  ur: "عزل"
  es: "Destitución del cargo y renuncia (azl)"
  tr: "İzolasyon"
  id: "Isolasi"
summary:
  ar: "العزل في اللغة التنحية، يقال عزله عن الأمر أي نحّاه عنه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11579}. ومن أحكامه أن الإمام الأعظم تنعقد إمامته ببيعة أهل الحل والعقد، وتدوم بدوام شروطها، وقد اختلف في عزل الإمام نفسه، فأجازه جمهور الفقهاء، ومنعه قول آخر {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11579}. وليس للوزير أن يعزل نفسه، وللإمام أن يعزل من قلّده الوزارة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11579}. وفي القاضي، يصح عزله نفسه، وينعزل بالموت أو العزل عن الإمامة عند الجمهور، ويختلف الفقهاء في عزله من قبل الإمام على ثلاثة آراء {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11580} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11581}. وينعزل القاضي بأسباب كالجنون والإغماء والعمى والصمم والبكم والردة والفسق عند بعض المذاهب، ولا ينفذ العزل قبل بلوغ خبره إليه عند الجمهور {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11582} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11583} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11585} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11586}. ويلحق بذلك عزل خليفة القاضي والوكيل والوصي والمضارب والكفيل وناظر الوقف، بتفصيل في كل منها {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11586} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11587} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11588}. والعزل بمعنى آخر، وهو العزل عن الزوجة أو الأمة، أباحه جمهور الفقهاء، واختلفوا في اشتراط إذن الحرة وفي أحوال الكراهة، وذكروا أعذاراً تبيحه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11588} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11589}."
  en: "In the lexicon, azl means removal or setting aside, as in removing someone from a post {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11579}. The supreme imamate is established by the allegiance of those who bind and loose and lasts while its conditions last. Most jurists allow the imam to resign, while one view forbids it {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11579}. A minister may not dismiss himself, but the imam may dismiss the minister he appointed {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11579}. A judge may resign; the death of the imam who appointed him does not end his office according to the jurists; and the jurists differ on whether the imam may dismiss him, in three views {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11580} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11581}. A judge loses office on losing a condition such as sanity, speech, hearing or sight, and some schools also count apostasy and wrongdoing; the dismissal does not take effect until word of it reaches him, according to the majority {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11582} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11583} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11585} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11586}. Dismissal of an agent, guardian, partner in a profit-sharing contract, surety and administrator of an endowment is treated in turn {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11586} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11587} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11588}. The entry also treats, under the same heading, withdrawal from a wife or slave-woman: the majority permit it, the wife's consent is disputed, and the jurists list excuses that make it lawful {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11588} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11589}."
  fr: "Dans le lexique, azl signifie enlever ou écarter, comme lorsqu’on démet quelqu’un d’une fonction {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11579}. L’imamat suprême est établi par l’allégeance de ceux qui lient et délient ; il dure tant que ses conditions demeurent réunies. La plupart des juristes permettent à l’imam de démissionner, tandis qu’un avis l’interdit {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11579}. Un ministre ne peut se démettre lui-même, mais l’imam peut révoquer celui qu’il a nommé {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11579}. Un juge peut démissionner ; selon les juristes, la mort de l’imam qui l’a nommé ne met pas fin à sa fonction ; trois avis divergent sur le droit de l’imam de le révoquer {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11580} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11581}. Le juge perd sa fonction lorsqu’une condition telle que la raison, la parole, l’ouïe ou la vue disparaît ; certaines écoles comptent aussi l’apostasie et la conduite répréhensible. Selon la majorité, la révocation ne prend effet que lorsqu’il en est informé {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11582} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11583} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11585} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11586}. L’article traite ensuite de la révocation du mandataire, du tuteur, de l’associé dans un contrat de partage des bénéfices, de la caution et de l’administrateur d’une fondation pieuse {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11586} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11587} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11588}. Sous le même titre, il examine aussi le retrait avant éjaculation avec une épouse ou une femme esclave : la majorité le permet, le consentement de l’épouse fait débat et les juristes énumèrent des excuses qui le rendent licite {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11588} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11589}."
  es: "En el léxico, azl significa remoción o apartar, como en remover a alguien de un puesto {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11579}. El imamato supremo se establece por la lealtad de aquellos que atan y desatan y dura mientras duren sus condiciones. La mayoría de los juristas permiten que el imán renuncie, mientras que una opinión lo prohíbe {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11579}. Un ministro no puede destituirse a sí mismo, pero el imán puede destituir al ministro que nombró {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11579}. Un juez puede renunciar; la muerte del imán que lo nombró no termina su cargo según los juristas; y los juristas difieren en si el imán puede destituirlo, en tres puntos de vista {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11580} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11581}. Un juez pierde su cargo al perder una condición como la cordura, el habla, el oído o la vista, y algunas escuelas también consideran la apostasía y las malas acciones; el despido no surtirá efecto hasta que le llegue la noticia, según la mayoría {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.11582} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.11583} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.11585} {citar:fiqh-mawsua-kuwaitiyya-noor-v3 p.11586}. El despido de un agente, tutor, socio en un contrato de participación en las ganancias, fiador y administrador de una dotación se trata a su vez {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11586} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11587} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11588}. La entrada también trata, bajo el mismo epígrafe, la separación de una esposa o esclava: la mayoría lo permite, el consentimiento de la esposa es cuestionado y los juristas enumeran excusas que lo hacen lícito {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11588} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11589}."
  ur: "لغت میں عزل کا مطلب ہے ہٹانا یا الگ کرنا، جیسا کہ کسی کو پوسٹ سے ہٹانا {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 11579}۔ اعلیٰ امامت ان لوگوں کی بیعت سے قائم ہوتی ہے جو پابند اور ڈھیلے ہوتے ہیں اور اس کے حالات قائم رہنے تک قائم رہتے ہیں۔ اکثر فقہاء امام کو مستعفی ہونے کی اجازت دیتے ہیں جبکہ ایک قول اس سے منع کرتا ہے ایک وزیر خود کو برطرف نہیں کر سکتا، لیکن امام اس وزیر کو برطرف کر سکتا ہے جسے اس نے مقرر کیا تھا ایک جج مستعفی ہو سکتا ہے۔ امام جس نے اسے مقرر کیا ہے اس کی موت فقہاء کے نزدیک اس کا عہدہ ختم نہیں کرتی۔ اور فقہاء کا اس میں اختلاف ہے کہ آیا امام اسے تین قول میں رد کر سکتا ہے {حوالہ: فقہ معاویہ کویتیہ نور v3 ص 11580} ایک جج اپنے عہدے سے محروم ہو جاتا ہے جیسے کہ عقل، گویائی، سماعت یا بصارت، اور کچھ سکول بھی ارتداد اور غلط کاموں میں شمار ہوتے ہیں۔ تصرف اس وقت تک نافذ العمل نہیں ہوتا جب تک کہ اس کی بات اس تک نہ پہنچ جائے، جمہور کے نزدیک {حوالہ: فقہ معسویہ کویتیہ نور ص3 ص11582} {حوالہ: فقہ الموسوع کویتیہ نور v3 صفحہ 11586}۔ کسی ایجنٹ، سرپرست، منافع کی تقسیم کے معاہدے میں شراکت دار، ضامن اور اوقاف کے منتظم کو برطرف کیا جاتا ہے {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 11586} {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص11588}۔ اندراج بھی اسی عنوان کے تحت بیوی یا لونڈی سے دستبرداری کا معاملہ کرتا ہے: اکثریت اس کی اجازت دیتی ہے، بیوی کی رضامندی متنازعہ ہے، اور فقہاء اس کو حلال قرار دینے والے عذر کی فہرست دیتے ہیں صفحہ 11589}۔"
  tr: "Görevden alma dilinde görevden alma, yani onu işten çıkardı, yani onu işten çıkardı {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.11579}. Hükümlerinden biri, imamın imaminin halkın yasal ve sözleşme teminatıyla kurulduğu ve koşulları devam ettiği sürece sürdüğüdür. İmamın kendisinin görevden alınması konusunda anlaşmazlık vardır, ancak hukukçuların çoğunluğu buna izin verirken, başka bir görüş onu yasaklamıştır {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11579}. Din adamı kendini görevden alamaz, imam da onu papaz olarak atayanları görevden alamaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11579}. Bir yargıç durumunda, kendisi görevden alınır ve çoğunluğa göre ölüm veya imamlıktan uzaklaştırma yoluyla görevden alınır. Hukukçular, imamın onu görevden alıp almadığı konusunda üç görüşe göre farklı görüşler vardır {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11580} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11581}. Bazı düşünce okullarına göre bir yargıç, akıl hastalığı, bayılma, körlük, sağırlık, dilsizlik, dinden dönme ve ahlaksızlık gibi nedenlerle izole edilir ve görevden alma çoğunluk halkın önünde gerçekleştirilmez {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11582} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11583} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11585} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11586}. Buna ek olarak, yargıcın halefi, temsilci, mütevelli, spekülatörü, garantör ve vakıf denetçisi her birinde ayrıntılı olarak görevden alınmıştır {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11586} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11587} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11588}. İzolasyon, başka bir anlamda, çoğu hukukçu tarafından izin verilen ve özgür kadının izin alma şartı ve hoşnutsuzluk durumlarında farklı düşünen, eşten veya köleden ayrılmaktır ve buna izin vermek için bahaneler sunmuşlardır {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11588} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11589}."
  id: "Penolakan dalam bahasa pemberhentian, artinya dia mengeluarkan imam dari perkara tersebut, artinya dia mengeluarkan imam dari perkara tersebut {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11579}. Di antara putusannya adalah bahwa imam didirikan berdasarkan janji rakyat yang sah dan kontrak dan berlaku selama syaratnya masih berlangsung. Ada perbedaan pendapat mengenai pemecatan Imam sendiri, tetapi mayoritas ahli hukum mengizinkannya, sementara pendapat lain melarangnya {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11579}. Menteri tidak diizinkan memberhentikan diri, dan imam juga tidak boleh memberhentikan mereka yang mengangkatnya sebagai menteri {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11579}. Dalam kasus hakim, ia diberhentikan sendiri, dan ia diberhentikan dengan kematian atau pemecatan dari imamat menurut mayoritas. Para ahli hukum berbeda pendapat apakah imam memberhentikannya berdasarkan tiga pendapat {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11580} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11581}. Seorang hakim terisolasi karena alasan seperti kegilaan, pingsan, kebutaan, tuli, bisu, murtad, dan ketidakmoralan menurut beberapa aliran pemikiran, dan pemecatan tidak dilakukan di hadapan mayoritas publik {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11582} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11583} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11585} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11586}. Terkait dengan ini adalah pemecatan penerus hakim, agen, wali, spekulan, penjamin, dan pengawas dana abadi, secara rinci di masing-masing {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11586} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11587} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11588}. Isolasi, dalam arti lain, adalah pemisahan dari istri atau budak, yang diizinkan oleh mayoritas ahli hukum, berbeda pendapat mengenai persyaratan izin wanita bebas dan dalam kasus ketidaksukaan, dan mereka menyebutkan alasan untuk mengizinkannya {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11588} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11589}."
