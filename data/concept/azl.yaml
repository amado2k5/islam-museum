label:
  ar: "العَزْل"
  en: "Dismissal from office and withdrawal (azl)"
  ur: "عزل"
summary:
  ar: "العزل في اللغة التنحية، يقال عزله عن الأمر أي نحّاه عنه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11579}. ومن أحكامه أن الإمام الأعظم تنعقد إمامته ببيعة أهل الحل والعقد، وتدوم بدوام شروطها، وقد اختلف في عزل الإمام نفسه، فأجازه جمهور الفقهاء، ومنعه قول آخر {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11579}. وليس للوزير أن يعزل نفسه، وللإمام أن يعزل من قلّده الوزارة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11579}. وفي القاضي، يصح عزله نفسه، وينعزل بالموت أو العزل عن الإمامة عند الجمهور، ويختلف الفقهاء في عزله من قبل الإمام على ثلاثة آراء {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11580} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11581}. وينعزل القاضي بأسباب كالجنون والإغماء والعمى والصمم والبكم والردة والفسق عند بعض المذاهب، ولا ينفذ العزل قبل بلوغ خبره إليه عند الجمهور {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11582} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11583} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11585} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11586}. ويلحق بذلك عزل خليفة القاضي والوكيل والوصي والمضارب والكفيل وناظر الوقف، بتفصيل في كل منها {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11586} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11587} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11588}. والعزل بمعنى آخر، وهو العزل عن الزوجة أو الأمة، أباحه جمهور الفقهاء، واختلفوا في اشتراط إذن الحرة وفي أحوال الكراهة، وذكروا أعذاراً تبيحه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11588} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11589}."
  en: "In the lexicon, azl means removal or setting aside, as in removing someone from a post {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11579}. The supreme imamate is established by the allegiance of those who bind and loose and lasts while its conditions last. Most jurists allow the imam to resign, while one view forbids it {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11579}. A minister may not dismiss himself, but the imam may dismiss the minister he appointed {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11579}. A judge may resign; the death of the imam who appointed him does not end his office according to the jurists; and the jurists differ on whether the imam may dismiss him, in three views {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11580} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11581}. A judge loses office on losing a condition such as sanity, speech, hearing or sight, and some schools also count apostasy and wrongdoing; the dismissal does not take effect until word of it reaches him, according to the majority {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11582} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11583} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11585} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11586}. Dismissal of an agent, guardian, partner in a profit-sharing contract, surety and administrator of an endowment is treated in turn {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11586} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11587} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11588}. The entry also treats, under the same heading, withdrawal from a wife or slave-woman: the majority permit it, the wife's consent is disputed, and the jurists list excuses that make it lawful {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11588} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11589}."
