label:
  ar: "علامات ليثرغس"
  en: "Signs of lithargus"
  fr: "Signes du lithargus"
  ur: "لیثرغس کی علامات"
  es: "Signos de litargo"
  tr: "Leithergs Tabelaları"
  id: "Tanda Leithergs"
summary:
  ar: "يذكر ابن سينا علامات ليثرغس البلغمي: صداع خفيف وحمى لينة وسبات ثقيل ونسيان ونفس بطيء ونبض عظيم متفاوت بطيء، ويفرقه عن قرانيطس وذات الرئة، وعلامات السوداوي وما في جوهر الدماغ أو الحجاب، وعلامات الانتقال إليه وإنذاره {cite:canon-ibn-sina-print-v2 p.84} {cite:canon-ibn-sina-print-v2 p.85}"
  en: "Ibn Sina gives the signs of the phlegmatic lithargus: light headache, soft fever, heavy coma, forgetfulness, slow breath and a large, spaced, slow pulse; tells it from qaranitus and from dhat al-ri'a; and gives the signs of the black-bilious kind, of that in the substance of the brain or in the membrane, of the passage into it, and its outlook {cite:canon-ibn-sina-print-v2 p.84} {cite:canon-ibn-sina-print-v2 p.85}"
  fr: "Ibn Sina donne les signes du lithargus phlegmatique : léger mal de tête, fièvre modérée, coma profond, oublis, respiration lente et pouls ample, espacé et lent. Il le distingue du qaranitus et de la dhat al-ri’a et donne les signes de sa forme due à la bile noire, de son siège dans la substance du cerveau ou dans la membrane, de son apparition et de son pronostic. {cite:canon-ibn-sina-print-v2 p.84} {cite:canon-ibn-sina-print-v2 p.85}"
  ur: "ابن سینا بلغمی لیثرغس کی علامات بتاتا ہے: ہلکا سر درد، نرم بخار، بھاری غنودگی، نسیان، سست سانس اور بڑی، فاصلے والی، سست نبض؛ اسے قرانیطس اور ذات الریہ سے الگ کرتا ہے؛ اور سوداوی قسم، جوہر دماغ یا جھلی میں ہونے والی قسم، اس میں منتقل ہونے کی علامات اور اس کا انجام بتاتا ہے {cite:canon-ibn-sina-print-v2 p.84} {cite:canon-ibn-sina-print-v2 p.85}۔"
  es: "Ibn Sina da los signos del litargo flemático: dolor de cabeza leve, fiebre baja, coma profundo, olvido, respiración lenta y pulso lento, amplio y espaciado; lo distingue del qaranitus y del dhat al-ri'a; y da los signos del tipo de bilis negra, del que se encuentra en la sustancia del cerebro o en la membrana, del paso a ella y de su pronóstico {cite:canon-ibn-sina-print-v2 p.84} {cite:canon-ibn-sina-print-v2 p.85}"
  tr: "İbn Sina, flegmatik Litregus'un belirtilerinden bahseder: hafif baş ağrısı, hafif ateş, aşırı uyku hali, unutkanlık, yavaş nefes alma ve yavaş, düzensiz kalp atışı. Bunu kornit ve zatürreden, melankoli belirtilerinden ve beyin ya da diyaframın çekirdeğindeki belirtilerden, ayrıca ona bulaşma ve uyarı belirtilerinden ayırır {cite:canon-ibn-sina-print-v2 s.84} {cite:canon-ibn-sina-print-v2 s.85}"
  id: "Ibn Sina menyebutkan gejala Lithage flegmatik: sakit kepala ringan, demam ringan, kantuk berlebihan, pelupa, pernapasan lambat, dan detak jantung lambat serta tidak teratur. Ia membedakannya dari cornitis dan pneumonia, gejala melankolis, dan gejala di inti otak atau diafragma, serta infeksi dan tanda-tanda peringatan {cite:canon-ibn-sina-print-v2 hlm.84} {cite:canon-ibn-sina-print-v2 hlm.85}"
