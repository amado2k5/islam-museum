id: concept/rizq-al-salb
class: concept
kind: belief
label: { ar: "رزق السلب", en: "Provision by averting harm (rizq al-salb)", ur: "رزق السلب ⁦(نقصان سے بچاؤ کا رزق)⁩", es: "Provisión evitando daños (rizq al-salb)", fr: "Prestation en évitant le mal (rizq al-salb)", tr: "Soygun Geçim Kaynağı", id: "Mata pencaharian perampokan" }
summary:
  ar: "يميز الشعراوي بين رزق الإيجاب، وهو ما يأتي بالكسب والزيادة، ورزق السلب، وهو دفع المصارف والبلاء وصرف الضرر، ويرى أن الثاني قد يكون أعظم بركة من الأول {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1151} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1152}."
  en: "Sha'rawi distinguishes provision by gain (rizq al-ijab), which comes through earning and increase, from provision by averting harm (rizq al-salb), which means warding off costs and affliction. He holds that the second may bring more blessing than the first {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1151} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1152}."
  ur: "شعراوی رزقِ ایجاب، جو کمائی اور اضافے سے آتا ہے، اور رزقِ سلب، جو نقصان اور مصیبت کو دور کرنے سے ملتا ہے، میں فرق کرتے ہیں، اور کہتے ہیں کہ دوسری قسم میں اکثر زیادہ برکت ہوتی ہے {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1151} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1152}۔"
  es: "Sha'rawi distingue entre la provisión por ganancia (rizq al-ijab), que proviene del ingreso y el aumento, y la provisión por prevención del daño (rizq al-salb), que significa evitar gastos y aflicciones. Sostiene que la segunda puede traer más bendiciones que la primera {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1151} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1152}."
  fr: "Sha'rawi distingue la subsistance par le gain (rizq al-ijab), qui provient des revenus et de l'accroissement des richesses, de la subsistance par la préservation du bien (rizq al-salb), qui consiste à se prémunir contre les dépenses et les afflictions. Il soutient que la seconde peut apporter plus de bénédiction que la première {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1151} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1152}."
  tr: "Al-Shaarawi, kazanç ve artış yoluyla gelen olumlu sağlama ile yoksunluk geçimini (yüklerin, sıkıntıların ve zararların kaldırılması) arasında ayrım yapar. Sonuncusunun, ilki {cite:tafsir-sharawi-khawatir-scan-vol-2 s.1151} {cite:tafsir-sharawi-khawatir-scan-vol-vol-2 s.1152} (cite:tafsir-sharawi-khawatir-scan-vol-2 s.1152} kadar büyük bir nimet olabileceğine inanır."
  id: "Al-Shaarawi membedakan antara penyediaan positif, yang datang melalui keuntungan dan pertumbuhan, dan penghidupan dari kemiskinan, yaitu penghapusan beban, penderitaan, dan bahaya. Ia percaya bahwa yang terakhir mungkin merupakan berkah yang lebih besar daripada yang pertama {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1151} {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1152}."
