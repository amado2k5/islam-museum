id: concept/rizq-al-salb
class: concept
kind: belief
label: { ar: "رزق السلب", en: "Provision by averting harm (rizq al-salb)", ur: "رزق السلب (نقصان سے بچاؤ کا رزق)" }
summary:
  ar: "يميز الشعراوي بين رزق الإيجاب، وهو ما يأتي بالكسب والزيادة، ورزق السلب، وهو دفع المصارف والبلاء وصرف الضرر، ويرى أن الثاني قد يكون أعظم بركة من الأول {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1151} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1152}."
  en: "Sha'rawi distinguishes provision by gain (rizq al-ijab), which comes through earning and increase, from provision by averting harm (rizq al-salb), which means warding off costs and affliction. He holds that the second may bring more blessing than the first {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1151} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1152}."
  ur: "شعراوی رزقِ ایجاب، جو کمائی اور اضافے سے آتا ہے، اور رزقِ سلب، جو نقصان اور مصیبت کو دور کرنے سے ملتا ہے، میں فرق کرتے ہیں، اور کہتے ہیں کہ دوسری قسم میں اکثر زیادہ برکت ہوتی ہے {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1151} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1152}۔"
