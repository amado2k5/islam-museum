id: concept/inshiqaq-al-qamar
class: concept
kind: belief
label:
  ar: انشقاق القمر
  en: The splitting of the moon
  ur: چاند کا پھٹنا
  es: "La división de la luna"
  fr: "La division de la lune"
  tr: "ay bölünmesi"
  id: "pemecahan bulan"
summary:
  ar: "انشقاق القمر عند أهل العلم من آيات النبوة؛ يقول ابن كثير إنه أمر متفق عليه بين العلماء، وانشق القمر بمكة مرتين {cite:tafsir-ibn-kathir}."
  en: "The splitting of the moon among the scholars is a sign of prophethood; Ibn Kathir says it is agreed upon among the scholars, and that the moon split over Mecca twice {cite:tafsir-ibn-kathir}."
  es: "La división de la luna entre los eruditos es un signo de profecía; Ibn Kathir dice que es algo consensuado entre los eruditos, y que la luna se dividió sobre La Meca dos veces {cite:tafsir-ibn-kathir}."
  fr: "La division de la lune est considérée par les savants comme un signe de prophétie; Ibn Kathir affirme que cela fait consensus parmi les savants, et que la lune s'est divisée deux fois au-dessus de La Mecque {cite:tafsir-ibn-kathir}."
  ur: "علماء کے درمیان چاند کا شق ہونا نبوت کی علامت ہے۔ ابن کثیر کہتے ہیں کہ اس پر اہل علم کا اتفاق ہے اور یہ کہ چاند مکہ پر دو مرتبہ پھٹ گیا۔"
  tr: "Ayın bölünmesi alimler arasında peygamberliğin bir işareti olarak kabul edilir; İbn Kathir bunun alimler arasında kabul edilen bir mesele olduğunu ve ayın Mekke'de iki kez ayrıldığını söyler {atıf:tafsir-ibn-kathir}."
  id: "Pemisahan bulan dianggap oleh para ulama sebagai tanda kenabian; Ibn Kathir mengatakan bahwa ini adalah hal yang disepakati oleh para sarjana, dan bulan terbelah dua kali di Mekah {cite:tafsir-ibn-kathir}."
