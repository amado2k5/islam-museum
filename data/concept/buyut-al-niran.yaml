id: concept/buyut-al-niran
class: concept
kind: belief
label: { ar: "بيوت النيران", en: "The fire-temples" }
summary:
  ar: "أول من رسم بيوت النار من ملوك الفرس عند المسعودي أفريدون، وجد ناراً يعظمها أهلها فأخبروه أنها واسطة بين الله وخلقه ومن جنس الآلهة النورية وجعلوا للنور مراتب وفرقوا بين طبع النار والنور، فأمر بحمل جزء منها إلى خراسان فاتخذ لها بيتاً بطوس وآخر ببخارا يقال له برد سورة، وبيت كراكر بسجستان اتخذه بهمن بن اسفنديار، وبيت بالشيز والران أخرج أنوشروان أصنامه وقيل نقل ناره إلى البركة، وكوسجة بناه كيخسرو، وجريش بقومس قيل إن الإسكندر تركها ولم يطفئها، وكنجدة بناه سياوش بن كيكاوس بمشرق الصين مما يلي البركند، وبيت بأرجان اتخذ في أيام بهراسف، وعللوا اجتذاب الحيوان للنار كالفراش بالليل وخروج الحيتان إلى سرج الزوارق كما يصطاد ببلاد البصرة {cite:muruj-al-dhahab p. 549-550}."
  en: "The first fire-temple builder, in al-Mas'udi's telling, was Afridun — told the flame was a link to God of the luminous kind, he took a share to Khurasan: the houses of Tus, Bukhara's Bard-Sura, Bahman's Karakir in Sijistan, the Shiz house whose idols Anushirwan cast out or whose fire he moved to al-Baraka, Kaykhusraw's Kawsaja, Qumis's Jarish spared by Alexander, Siyawush's Kanjadha toward China, and Arjan's — the animals' rush at flame glossed by moth and by Basra's lamp-fished waters {cite:muruj-al-dhahab p. 549-550}."
