id: concept/buyut-al-niran
class: concept
kind: belief
label:
  ar: "بيوت النيران"
  en: "The fire-temples"
  fr: "Les temples du feu"
  es: "Los templos de fuego"
  ur: "آگ کے مندر"
summary:
  ar: "أول من رسم بيوت النار من ملوك الفرس عند المسعودي أفريدون، وجد ناراً يعظمها أهلها فأخبروه أنها واسطة بين الله وخلقه ومن جنس الآلهة النورية وجعلوا للنور مراتب وفرقوا بين طبع النار والنور، فأمر بحمل جزء منها إلى خراسان فاتخذ لها بيتاً بطوس وآخر ببخارا يقال له برد سورة، وبيت كراكر بسجستان اتخذه بهمن بن اسفنديار، وبيت بالشيز والران أخرج أنوشروان أصنامه وقيل نقل ناره إلى البركة، وكوسجة بناه كيخسرو، وجريش بقومس قيل إن الإسكندر تركها ولم يطفئها، وكنجدة بناه سياوش بن كيكاوس بمشرق الصين مما يلي البركند، وبيت بأرجان اتخذ في أيام بهراسف، وعللوا اجتذاب الحيوان للنار كالفراش بالليل وخروج الحيتان إلى سرج الزوارق كما يصطاد ببلاد البصرة {cite:muruj-al-dhahab p. 549-550}."
  en: "The first fire-temple builder, in al-Mas'udi's telling, was Afridun — told the flame was a link to God of the luminous kind, he took a share to Khurasan: the houses of Tus, Bukhara's Bard-Sura, Bahman's Karakir in Sijistan, the Shiz house whose idols Anushirwan cast out or whose fire he moved to al-Baraka, Kaykhusraw's Kawsaja, Qumis's Jarish spared by Alexander, Siyawush's Kanjadha toward China, and Arjan's — the animals' rush at flame glossed by moth and by Basra's lamp-fished waters {cite:muruj-al-dhahab p. 549-550}."
  fr: "Selon al-Mas'udi, Afridun fut le premier bâtisseur de temples du feu : informé que la flamme reliait à Dieu par sa nature lumineuse, il en porta au Khorasan. Sont cités Tus, Bard-Sura à Boukhara, Karakir de Bahman au Sijistan, Shiz dont Anushirwan retira les idoles ou transféra le feu à al-Baraka, Kawsaja de Kaykhusraw, Jarish de Qumis épargné par Alexandre, Kanjadha de Siyawush vers la Chine et Arjan. L’attraction animale pour la flamme est illustrée par les papillons et la pêche aux lampes de Bassora {cite:muruj-al-dhahab p. 549-550}."
  es: "El primer constructor de templos de fuego, según el relato de al-Mas'udi, fue Afridun; se le dijo que la llama era un vínculo con el Dios luminoso, y se llevó una parte a Jorasán: las casas de Tus, Bard-Sura de Bujará, Karakir de Bahman en Sijistan, la casa de Shiz cuyos ídolos Anushirwan expulsó o cuyo fuego trasladó a al-Baraka, Kawsaja de Kaykhusraw, Jarish de Qumis perdonado por Alejandro, Kanjadha de Siyawush hacia China y la de Arjan: la carrera de los animales hacia la llama glorificada por la polilla y por las aguas de Basora iluminadas por lámparas {cite:muruj-al-dhahab p. 549-550}."
  ur: "المسعودی کے بیان میں پہلا آتش گیر معبد بنانے والا آفریدون تھا - اس نے بتایا کہ شعلہ نورانی قسم کے خدا سے ایک کڑی ہے، اس نے خراسان میں حصہ لیا: طوس کے گھر، بخارا کا برد سورہ، سجستان میں بہمن کا قراقر، وہ شیز گھر جس کے بتوں کو جلانے کے لیے انوشیروان یا الکارا کو آگ لگائی گئی۔ کیخسرو کا کوسجا، قمیس کا جرش سکندر کی طرف سے بچایا گیا، سیاوش کا کنجادھا چین کی طرف، اور ارجن کا - کیڑے اور بصرہ کے چراغوں والے پانیوں سے چمکتی ہوئی آگ پر جانوروں کا دوڑنا۔ 549-550}۔"
