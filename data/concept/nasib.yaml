label: { ar: "النَّصِيب", en: "Share (nasib) in the rules of property and inheritance", ur: "نصیب ⁦(حصہ)⁩ اور اس کے احکام", es: "Participación (nasib) en las normas de propiedad y herencia", fr: "Participer (nasib) aux règles de propriété et d'héritage" }
summary:
  ar: "النصيب في اللغة الحصة والحظ من كل شيء، والجزء المقسوم، ويفرق عن الفرض في الميراث بأن كل نصيب فرض وليس كل فرض نصيباً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15742} وفي الميراث حدد الشرع أنصبة الورثة المقدرة، وهي النصف والربع والثمن والثلثان والثلث والسدس، وتفصيلها في مصطلح الإرث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15742} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15743} وفي الشركة يتصرف الشريك في نصيبه بالبيع والإجارة والإعارة على أقوال مختلفة، ويد الشريك يد أمانة فلا يضمن إلا بالتعدي أو التقصير، وهو قول جمهور الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15743} وتوزع أجرة القسمة على حسب الأنصبة عند الفقهاء في الجملة، وتفصيل ذلك في القسمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15743} وفي قسمة العقار يتنوع النصيب بحسب تشابه أجزاء العقار وتعدد محله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15744} وإذا عيّن القاسم لكل شريك نصيبه صارت القسمة تامة ولزمت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15744} ويملك كل متقاسم نصيبه بعد تمام القسمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15744} وفي الشفعة يملك الشفيع النصيب المشفوع فيه بالطرق التي اختلف فيها الفقهاء، ويختلفون فيما يفعله المشتري من بناء أو غرس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15744} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15745} وإذا أعتق أحد الشريكين نصيبه من العبد المشترك، فإن كان موسراً عتق العبد كله وعليه قيمة نصيب شريكه عند المالكية والشافعية وظاهر مذهب الحنابلة، وإن كان معسراً عتق نصيبه فقط، وخالف أبو حنيفة في ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15745}"
  en: "Nasib, in the lexicon, is a share or portion of anything; a share is also the part of something divided. In inheritance every nasib is a fixed share but not every fixed share is a nasib. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15742} The law fixes the shares of heirs: a half, a quarter, an eighth, two-thirds, a third and a sixth, detailed under inheritance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15742} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15743} In partnership a partner may dispose of his share by sale, hire or lending, on differing views. A partner's hand is a trust, so he is liable only for transgression or negligence, a view held by the majority of jurists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15743} The fee for division is distributed by shares in the majority view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15743} In dividing real property, the share follows the layout of the property. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15744} When the divider assigns each partner his share the division is complete, and each one owns and may dispose of his share. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15744} In pre-emption the pre-emptor acquires the share in ways the jurists dispute, and they dispute the treatment of buildings or plantings made by the buyer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15744} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15745} When one of two co-owners frees his share of a joint slave, a wealthy owner frees the whole and owes the other partner the value of the other share, according to the Malikis, Shafi'is and the usual Hanbali view; a poor owner frees only his share, and Abu Hanifa differs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15745}"
  ur: "نصیب لغت میں کسی چیز کا حصہ اور تقسیم شدہ جزو ہے۔ میراث میں ہر نصیب فرض ہے، مگر ہر فرض نصیب نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15742} میراث کے حصص شریعت نے مقرر کیے ہیں، جن کی تفصیل میراث کے عنوان میں ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15743} شرکت میں شریک کا اپنے حصے میں تصرف اور اس کے ضمان کے احکام میں اختلاف ہے، جمہور کے نزدیک امانت ہونے کی وجہ سے صرف تعدی یا کوتاہی پر ضمان ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15743} قسمت میں ہر شریک کا حصہ تعیین کے بعد مکمل ملکیت بن جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15744} غلام مشترک میں شریک کے آزاد کرنے کے احکام مالداری اور تنگدستی کے اعتبار سے مختلف ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15745}"
  es: "Nasib, en el léxico, es una parte o porción de algo; una parte también es la porción de algo dividido. En herencia, cada nasib es una parte fija, pero no toda parte fija es un nasib. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15742} La ley fija las partes de los herederos: la mitad, un cuarto, un octavo, dos tercios, un tercio y un sexto, detallados en la herencia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15742} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15743} En una sociedad, un socio puede disponer de su parte mediante venta, alquiler o préstamo, según diferentes puntos de vista. La mano de un socio es un fideicomiso, por lo que solo es responsable por transgresión o negligencia, una opinión sostenida por la mayoría de los juristas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15743} La tarifa por la división se distribuye por partes en la visión mayoritaria. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15743} En la división de bienes inmuebles, la parte sigue la distribución de la propiedad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15744} Cuando el divisor asigna a cada socio su parte, la división se completa y cada uno posee y puede disponer de su parte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15744} En el derecho de tanteo, el titular del derecho de tanteo adquiere la parte de maneras que los juristas discuten, y discuten el tratamiento de los edificios o plantaciones realizado por el comprador. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15744} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15745} Cuando uno de dos copropietarios libera su parte de un esclavo en común, un propietario rico libera la totalidad y debe al otro socio el valor de la otra parte, según los malikíes, los shafiíes y la opinión hanbalí habitual; un propietario pobre libera solo su parte, y Abu Hanifa discrepa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15745}"
  fr: "Dans le lexique, le terme « nasib » désigne une part ou une portion d'un bien; une part est également la partie d'un bien divisé. En matière d'héritage, chaque nasib correspond à une part fixe, mais l'inverse n'est pas vrai. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15742} La loi fixe les parts des héritiers: la moitié, le quart, le huitième, les deux tiers, le tiers et le sixième, comme détaillé dans la section consacrée à l'héritage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15742} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15743} Dans une société en nom collectif, un associé peut disposer de sa part par vente, location ou prêt, selon les interprétations. La main de l'associé est un dépôt fiduciaire; par conséquent, sa responsabilité n'est engagée qu'en cas de transgression ou de négligence, une opinion partagée par la majorité des juristes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15743} Les frais de partage sont répartis selon l'avis majoritaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15743} Lors du partage d'un bien immobilier, la part attribuée suit la configuration du bien. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15744} Lorsque le partageur attribue à chaque associé sa part, le partage est terminé et chacun devient propriétaire de sa part et peut en disposer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15744} En matière de préemption, le préempteur acquiert la part selon des modalités qui font l'objet de controverses juridiques, notamment concernant le traitement des constructions ou plantations réalisées par l'acquéreur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15744} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15745} Lorsqu'un des deux copropriétaires affranchit sa part d'un esclave commun, un propriétaire aisé affranchit la totalité de l'esclave et doit à l'autre associé la valeur de sa part restante, selon les écoles malikite, chaféite et hanbalite courante; un propriétaire pauvre n'affranchit que sa part, et Abu Hanifa est d'un avis différent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15745}"
