label: { ar: "النَّصِيب", en: "Share (nasib) in the rules of property and inheritance", ur: "نصیب (حصہ) اور اس کے احکام" }
summary:
  ar: "النصيب في اللغة الحصة والحظ من كل شيء، والجزء المقسوم، ويفرق عن الفرض في الميراث بأن كل نصيب فرض وليس كل فرض نصيباً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15742} وفي الميراث حدد الشرع أنصبة الورثة المقدرة، وهي النصف والربع والثمن والثلثان والثلث والسدس، وتفصيلها في مصطلح الإرث. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15742} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15743} وفي الشركة يتصرف الشريك في نصيبه بالبيع والإجارة والإعارة على أقوال مختلفة، ويد الشريك يد أمانة فلا يضمن إلا بالتعدي أو التقصير، وهو قول جمهور الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15743} وتوزع أجرة القسمة على حسب الأنصبة عند الفقهاء في الجملة، وتفصيل ذلك في القسمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15743} وفي قسمة العقار يتنوع النصيب بحسب تشابه أجزاء العقار وتعدد محله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15744} وإذا عيّن القاسم لكل شريك نصيبه صارت القسمة تامة ولزمت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15744} ويملك كل متقاسم نصيبه بعد تمام القسمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15744} وفي الشفعة يملك الشفيع النصيب المشفوع فيه بالطرق التي اختلف فيها الفقهاء، ويختلفون فيما يفعله المشتري من بناء أو غرس. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15744} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15745} وإذا أعتق أحد الشريكين نصيبه من العبد المشترك، فإن كان موسراً عتق العبد كله وعليه قيمة نصيب شريكه عند المالكية والشافعية وظاهر مذهب الحنابلة، وإن كان معسراً عتق نصيبه فقط، وخالف أبو حنيفة في ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15745}"
  en: "Nasib, in the lexicon, is a share or portion of anything; a share is also the part of something divided. In inheritance every nasib is a fixed share but not every fixed share is a nasib. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15742} The law fixes the shares of heirs: a half, a quarter, an eighth, two-thirds, a third and a sixth, detailed under inheritance. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15742} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15743} In partnership a partner may dispose of his share by sale, hire or lending, on differing views. A partner's hand is a trust, so he is liable only for transgression or negligence, a view held by the majority of jurists. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15743} The fee for division is distributed by shares in the majority view. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15743} In dividing real property, the share follows the layout of the property. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15744} When the divider assigns each partner his share the division is complete, and each one owns and may dispose of his share. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15744} In pre-emption the pre-emptor acquires the share in ways the jurists dispute, and they dispute the treatment of buildings or plantings made by the buyer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15744} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15745} When one of two co-owners frees his share of a joint slave, a wealthy owner frees the whole and owes the other partner the value of the other share, according to the Malikis, Shafi'is and the usual Hanbali view; a poor owner frees only his share, and Abu Hanifa differs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15745}"
  ur: "نصیب لغت میں کسی چیز کا حصہ اور تقسیم شدہ جزو ہے۔ میراث میں ہر نصیب فرض ہے، مگر ہر فرض نصیب نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15742} میراث کے حصص شریعت نے مقرر کیے ہیں، جن کی تفصیل میراث کے عنوان میں ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15743} شرکت میں شریک کا اپنے حصے میں تصرف اور اس کے ضمان کے احکام میں اختلاف ہے، جمہور کے نزدیک امانت ہونے کی وجہ سے صرف تعدی یا کوتاہی پر ضمان ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15743} قسمت میں ہر شریک کا حصہ تعیین کے بعد مکمل ملکیت بن جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15744} غلام مشترک میں شریک کے آزاد کرنے کے احکام مالداری اور تنگدستی کے اعتبار سے مختلف ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15745}"
