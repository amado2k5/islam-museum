id: concept/istilad-umm-al-walad
class: concept
kind: legal
label:
  ar: "الاستيلاد وأم الولد"
  en: "Istilad and the umm al-walad"
  ur: "استیلاد اور ام ولد"
term: { ar: "اسْتِيلاد، أُمّ الوَلَد", en: "istilad, umm al-walad" }
summary:
  ar: "الاستيلاد في اللغة طلب الولد، وخصّه الفقهاء بطلبه من الأمة؛ فإذا ولدت الأمة من سيدها واعترف بالولد صارت «أم ولد». ويذكر ابن عابدين في رد المحتار على المذهب الحنفي أنها تعتق بموت سيدها من جميع ماله لا من الثلث، ولا تُباع ولا تُملَّك، وأنها تخالف المدبَّرة في ثلاثة عشر حكماً، ويعرض الخلاف في نفاذ قضاء من قضى بجواز بيعها. {cite:radd-al-muhtar-scan-v3 p.74} {cite:radd-al-muhtar-scan-v3 p.76}"
  en: "Istilad lexically means seeking a child; the jurists restrict it to a child by a slave woman. When she bears her master a child and he acknowledges it, she becomes an 'umm al-walad'. Ibn Abidin in Radd al-Muhtar states the Hanafi view that she is freed at her master's death from his whole estate, not from the third, cannot be sold or transferred, differs from the mudabbara in thirteen rulings, and records the dispute over whether a judge's ruling permitting her sale takes effect."
  ur: "استیلاد کا لغوی معنی اولاد طلب کرنا ہے؛ فقہاء نے اسے باندی سے اولاد طلب کرنے کے ساتھ خاص کیا ہے۔ جب باندی اپنے مالک سے بچہ جنے اور مالک اس کا اعتراف کرے تو وہ «ام ولد» بن جاتی ہے۔ ابن عابدین رد المحتار میں حنفی مذہب بیان کرتے ہیں کہ وہ مالک کی موت پر اس کے پورے مال سے آزاد ہوتی ہے، تہائی سے نہیں، اسے نہ بیچا جا سکتا ہے نہ کسی کی ملک میں دیا جا سکتا ہے، وہ تیرہ احکام میں مدبرہ سے مختلف ہے، اور اس کی بیع جائز قرار دینے والے قاضی کے فیصلے کے نفاذ میں اختلاف نقل کرتے ہیں۔"
wings: [ideas, people]
themes: [slavery-and-freedom, family-marriage-kinship]
regions: [global]
sensitivity: contested
issue:
  ar: "هل ينفذ قضاء القاضي إذا قضى بجواز بيع أم الولد؟"
  en: "Does a judge's ruling that an umm al-walad may be sold take effect?"
  ur: "اگر قاضی ام ولد کی بیع کے جواز کا فیصلہ کرے تو کیا وہ نافذ ہوتا ہے؟"
perspectives:
  - tradition: sunni-hanafi
    id: hanafi-muhammad
    stance: { ar: "لا ينفذ، وعليه الفتوى", en: "It does not take effect; this is the view for fatwa", ur: "نافذ نہیں ہوتا، اور اسی پر فتویٰ ہے" }
    summary:
      ar: "يذكر ابن عابدين أن عدم النفاذ قول محمد بن الحسن وعليه الفتوى، بناءً على أن الإجماع المتأخر يرفع الخلاف المتقدم عنده، وقد أجمع الصحابة بعد خلاف على منع بيعها. {cite:radd-al-muhtar-scan-v3 p.76}"
      en: "Ibn Abidin reports that it does not take effect in the view of Muhammad ibn al-Hasan, on which fatwa is given, because for him a later consensus removes an earlier disagreement, and the Companions came to agree, after differing, that she may not be sold."
      ur: "ابن عابدین نقل کرتے ہیں کہ نافذ نہ ہونا امام محمد بن الحسن کا قول ہے اور اسی پر فتویٰ ہے، کیونکہ ان کے نزدیک بعد کا اجماع پہلے کے اختلاف کو ختم کر دیتا ہے، اور صحابہ نے اختلاف کے بعد اس کی بیع کی ممانعت پر اتفاق کیا۔"
    holders: [person/muhammad-ibn-al-hasan-al-shaybani]
    sources: [source/radd-al-muhtar-scan-v3]
  - tradition: sunni-hanafi
    id: hanafi-shaykhayn
    stance: { ar: "ينفذ عند أبي حنيفة وأبي يوسف", en: "It takes effect for Abu Hanifa and Abu Yusuf", ur: "امام ابو حنیفہ اور ابو یوسف کے نزدیک نافذ ہوتا ہے" }
    summary:
      ar: "ويذكر أن أبا حنيفة وأبا يوسف قالا ينفذ، لأن الإجماع المتأخر عندهما لا يرفع الخلاف المتقدم، ويحمل القضاء بجواز بيعها على قاضٍ مقلِّد لداود الظاهري الذي يقول بجوازه. {cite:radd-al-muhtar-scan-v3 p.76}"
      en: "He reports that Abu Hanifa and Abu Yusuf held it takes effect, since for them a later consensus does not remove an earlier disagreement, and he relates such a ruling to a judge following Dawud al-Zahiri, who held her sale permitted."
      ur: "وہ نقل کرتے ہیں کہ امام ابو حنیفہ اور ابو یوسف کے نزدیک نافذ ہوتا ہے، کیونکہ ان کے نزدیک بعد کا اجماع پہلے کا اختلاف ختم نہیں کرتا، اور وہ ایسے فیصلے کو اس قاضی پر محمول کرتے ہیں جو داود ظاہری کا مقلد ہو، جو اس کی بیع کو جائز کہتے ہیں۔"
    holders: [person/abu-hanifa, person/abu-yusuf-al-qadi]
    sources: [source/radd-al-muhtar-scan-v3]
  - tradition: sunni
    id: zahiri
    stance: { ar: "داود الظاهري يجيز بيعها ⁦(كما ينقله ابن عابدين)⁩", en: "Dawud al-Zahiri permits her sale (as Ibn Abidin reports)", ur: "داود ظاہری اس کی بیع جائز کہتے ہیں (جیسا ابن عابدین نقل کرتے ہیں)" }
    summary:
      ar: "ينقل ابن عابدين أن داود الظاهري يقول بجواز بيعها، ويشير إلى واقعة له مع أبي سعيد البردعي حكاها الزيلعي؛ ولم يُنقل هنا قول داود من كتب أصحابه. {cite:radd-al-muhtar-scan-v3 p.76}"
      en: "Ibn Abidin reports that Dawud al-Zahiri held her sale permitted and alludes to an exchange between him and Abu Sa'id al-Bardha'i told by al-Zayla'i; Dawud's view is not given here from his own school's books."
      ur: "ابن عابدین نقل کرتے ہیں کہ داود ظاہری اس کی بیع جائز کہتے ہیں، اور ان کے اور ابو سعید بردعی کے ایک واقعے کی طرف اشارہ کرتے ہیں جسے زیلعی نے بیان کیا؛ داود کا قول یہاں ان کے مسلک کی کتابوں سے نقل نہیں ہوا۔"
    holders: [person/dawud-al-zahiri]
