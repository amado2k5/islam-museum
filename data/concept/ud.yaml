summary:
  ar: "العود في الكتاب خشب وأصول خشب يؤتى به من بلاد الصين والهند والعرب، طيب الرائحة، أجوده المندلي، حار يابس في الثانية، لطيف مفتح للسدد كاسر للرياح، يقوي الأحشاء والأعصاب والدماغ والحواس والقلب، ويطيب النكهة مضغاً {cite:canon-ibn-sina-print-v1 p.614}"
  en: "Ud is in the book wood and roots of wood brought from the lands of China, India and the Arabs, of good scent, the best being the mandali; hot and dry in the second degree, subtle, opening obstructions and breaking winds, it strengthens the viscera, the nerves, the brain, the senses and the heart, and perfumes the breath when chewed {cite:canon-ibn-sina-print-v1 p.614}"
  ur: "عود کتاب میں لکڑی اور لکڑی کی جڑیں ہیں جو چین، ہند اور عرب کے ملکوں سے لائی جاتی ہیں، خوشبودار، بہترین مندلی ہے؛ دوسرے درجے میں گرم خشک، لطیف، رکاوٹیں کھولنے والا اور ہواؤں کو توڑنے والا، احشاء، اعصاب، دماغ، حواس اور دل کو قوت دیتا ہے، اور چبانے سے منہ کی بو خوشگوار کرتا ہے {cite:canon-ibn-sina-print-v1 p.614}۔"
  es: "En el libro, el ud es madera y raíces de madera traídas de las tierras de China, India y los árabes, de buen aroma, siendo el mandali el mejor; caliente y seco en segundo grado, sutil, abre obstrucciones y rompe vientos, fortalece las vísceras, los nervios, el cerebro, los sentidos y el corazón, y perfuma el aliento cuando se mastica {cite:canon-ibn-sina-print-v1 p.614}"
