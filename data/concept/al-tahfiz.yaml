summary:
  ar: "التحفيز عند طارق السويدان: أن يحصل الإنسان على مكافأة لفظية أو منصب أو مادة؛ يقرر أنه لا ينجح بلا رغبة داخلية ولا بلا معرفة وتخطيط وخبرة، وأن أعلى درجاته الإيمان بفكرة، وأن تكريم «الموظف المثالي» وحده فلسفة فاشلة."
  en: "Motivation in Tareq al-Suwaidan's teaching: a person receiving a verbal, positional or material reward; it fails without inner desire and without knowledge, planning and experience, its highest degree is belief in an idea, and honouring a single 'ideal employee' is a failed philosophy."
  ur: "طارق السویدان کی تعلیم میں تحفيز: کسی شخص کو زبانی، منصب یا مالی انعام ملنا؛ یہ داخلی خواہش اور علم، منصوبہ بندی اور تجربے کے بغیر ناکام ہوتا ہے، اس کی بلند ترین درجہ کسی نظریے پر ایمان ہے، اور صرف ایک «مثالی ملازم» کو نوازنا ناکام فلسفہ ہے۔"
