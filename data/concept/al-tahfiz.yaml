summary:
  ar: "التحفيز عند طارق السويدان: أن يحصل الإنسان على مكافأة لفظية أو منصب أو مادة؛ يقرر أنه لا ينجح بلا رغبة داخلية ولا بلا معرفة وتخطيط وخبرة، وأن أعلى درجاته الإيمان بفكرة، وأن تكريم «الموظف المثالي» وحده فلسفة فاشلة."
  en: "Motivation in Tareq al-Suwaidan's teaching: a person receiving a verbal, positional or material reward; it fails without inner desire and without knowledge, planning and experience, its highest degree is belief in an idea, and honouring a single 'ideal employee' is a failed philosophy."
  fr: "Dans l’enseignement de Tareq al-Suwaidan, la motivation consiste à recevoir une récompense verbale, matérielle ou sous la forme d’un poste. Elle échoue sans désir intérieur, connaissance, planification et expérience. À ses yeux, la foi en une idée en est le degré suprême, et ne distinguer qu’un seul « employé idéal » est une philosophie vouée à l’échec."
  ur: "طارق السویدان کی تعلیم میں تحفيز: کسی شخص کو زبانی، منصب یا مالی انعام ملنا؛ یہ داخلی خواہش اور علم، منصوبہ بندی اور تجربے کے بغیر ناکام ہوتا ہے، اس کی بلند ترین درجہ کسی نظریے پر ایمان ہے، اور صرف ایک «مثالی ملازم» کو نوازنا ناکام فلسفہ ہے۔"
  es: "La motivación en la enseñanza de Tareq al-Suwaidan: una persona que recibe una recompensa verbal, posicional o material; fracasa sin deseo interno y sin conocimiento, planificación y experiencia, su grado más alto es la creencia en una idea, y honrar a un solo \"empleado ideal\" es una filosofía fallida."
  tr: "Tariq Al-Suwaidan'a göre motivasyon: bir kişi sözlü bir ödül, pozisyon veya maddi bir şey alır; içsel arzu, bilgi, planlama ve deneyim olmadan başarılı olamayacağına karar verir, en yüksek seviyesinin bir fikre inanmak olduğunu ve sadece \"ideal çalışanı\" onurlandırmanın başarısız bir felsefe olduğunu düşünür."
  id: "Menurut Tariq Al-Suwaidan, motivasi: seseorang menerima penghargaan verbal, posisi, atau sesuatu yang bersifat materi; mereka memutuskan bahwa mereka tidak bisa berhasil tanpa keinginan batin, pengetahuan, perencanaan, dan pengalaman, berpikir bahwa tingkat tertinggi mereka adalah mempercayai sebuah ide, dan bahwa hanya menghormati \"karyawan ideal\" adalah filosofi yang gagal."
