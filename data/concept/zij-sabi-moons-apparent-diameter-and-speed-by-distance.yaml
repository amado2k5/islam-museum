label: { ar: "القطر الظاهري للقمر وسرعته بحسب بُعده", en: "The Moon's apparent diameter and speed by its distance", ur: "چاند کا ظاہری قطر اور اس کی رفتار فاصلے کے لحاظ سے", es: "El diámetro aparente de la Luna y su velocidad según su distancia." }
summary:
  ar: "يبيّن البتاني أن قطر القمر الظاهري يتغير بحسب بعده عن الأرض، وأنه عند بُعده الأبعد يكون نحو تسع وعشرين دقيقة ونصف، وأن سرعته الظاهرة في الساعة تتغير معه. {cite:zij-sabi-nallino-byblion p.87}."
  en: "Al-Battani shows that the Moon's apparent diameter varies with its distance from the Earth. At its farthest it is about twenty-nine and a half minutes, and its apparent speed per hour changes with it. {cite:zij-sabi-nallino-byblion p.87}."
  ur: "البتانی دکھاتے ہیں کہ چاند کا ظاہری قطر زمین سے اس کے فاصلے کے ساتھ بدلتا ہے۔ اپنے سب سے دور فاصلے پر یہ تقریباً انتیس دقائق اور نصف ہوتا ہے، اور اس کی فی گھنٹہ ظاہری رفتار بھی اس کے ساتھ بدلتی ہے۔ {cite:zij-sabi-nallino-byblion p.87}۔"
  es: "Al-Battani demuestra que el diámetro aparente de la Luna varía con su distancia a la Tierra. En su punto más alejado, es de aproximadamente veintinueve minutos y medio, y su velocidad aparente por hora cambia en consecuencia. {cite:zij-sabi-nallino-byblion p.87}."
