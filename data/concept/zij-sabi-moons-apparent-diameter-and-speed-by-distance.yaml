label: { ar: "القطر الظاهري للقمر وسرعته بحسب بُعده", en: "The Moon's apparent diameter and speed by its distance", ur: "چاند کا ظاہری قطر اور اس کی رفتار فاصلے کے لحاظ سے", es: "El diámetro aparente de la Luna y su velocidad según su distancia.", fr: "Le diamètre apparent de la Lune et sa vitesse en fonction de sa distance", tr: "Ayın görünen çapı ve uzaklığına bağlı olarak hızı.", id: "Diameter tampak bulan dan kecepatannya menurut jaraknya" }
summary:
  ar: "يبيّن البتاني أن قطر القمر الظاهري يتغير بحسب بعده عن الأرض، وأنه عند بُعده الأبعد يكون نحو تسع وعشرين دقيقة ونصف، وأن سرعته الظاهرة في الساعة تتغير معه. {cite:zij-sabi-nallino-byblion p.87}."
  en: "Al-Battani shows that the Moon's apparent diameter varies with its distance from the Earth. At its farthest it is about twenty-nine and a half minutes, and its apparent speed per hour changes with it. {cite:zij-sabi-nallino-byblion p.87}."
  ur: "البتانی دکھاتے ہیں کہ چاند کا ظاہری قطر زمین سے اس کے فاصلے کے ساتھ بدلتا ہے۔ اپنے سب سے دور فاصلے پر یہ تقریباً انتیس دقائق اور نصف ہوتا ہے، اور اس کی فی گھنٹہ ظاہری رفتار بھی اس کے ساتھ بدلتی ہے۔ {cite:zij-sabi-nallino-byblion p.87}۔"
  es: "Al-Battani demuestra que el diámetro aparente de la Luna varía con su distancia a la Tierra. En su punto más alejado, es de aproximadamente veintinueve minutos y medio, y su velocidad aparente por hora cambia en consecuencia. {cite:zij-sabi-nallino-byblion p.87}."
  fr: "Al-Battani démontre que le diamètre apparent de la Lune varie en fonction de sa distance à la Terre. À son point le plus éloigné, il est d'environ vingt-neuf minutes et demie, et sa vitesse apparente par heure varie également en fonction de cette distance. {cite:zij-sabi-nallino-byblion p.87}."
  tr: "Al-Battani, Ay'ın görünen çapının Dünya'ya olan uzaklığına göre değiştiğini, en uzak mesafede yaklaşık yirmi dokuz buçuk dakika olduğunu ve saatteki görünen hızının da buna bağlı olarak değiştiğini açıklıyor. {cite:zij-sabi-nallino-byblion s.87}."
  id: "Al-Battani menjelaskan bahwa diameter tampak bulan berubah sesuai dengan jaraknya dari Bumi, dan pada jarak terjauhnya sekitar dua puluh sembilan setengah menit, dan kecepatan tampak per jamnya berubah seiring dengan itu. {cite:zij-sabi-nallino-byblion p.87}."
