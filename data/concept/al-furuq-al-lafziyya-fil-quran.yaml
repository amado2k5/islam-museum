id: concept/al-furuq-al-lafziyya-fil-quran
class: concept
kind: term
label:
  ar: "الفروق اللفظية في القرآن"
  en: "Fine distinctions of Qur'anic vocabulary"
  ur: "قرآنی الفاظ کے باریک فرق"
summary:
  ar: "يعرض عمر عبد الكافي أمثلة على أن القرآن أضاف إلى العربية وفرّق بين ألفاظ يظنها الناس مترادفة: المطر والغيث، والعلم والمعرفة، والجسد والجسم، والأجداث، ويرى أن ذلك من إعجازه."
  en: "Omar Abdelkafy gives examples of how the Qur'an added to Arabic and distinguished words people take as synonyms: matar and ghayth (rain), 'ilm and ma'rifa (knowledge), jasad and jism (body), and ajdath (graves), and holds this to be part of its inimitability."
  ur: "عمر عبد الکافی مثالیں دیتے ہیں کہ قرآن نے عربی میں اضافہ کیا اور ان الفاظ میں فرق کیا جنہیں لوگ مترادف سمجھتے ہیں: مطر اور غیث، علم اور معرفت، جسد اور جسم، اور اجداث، اور اسے قرآن کے اعجاز کا حصہ سمجھتے ہیں۔"
