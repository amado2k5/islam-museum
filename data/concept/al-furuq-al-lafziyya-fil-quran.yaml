label:
  ar: "الفروق اللفظية في القرآن"
  en: "Fine distinctions of Qur'anic vocabulary"
  fr: "Les nuances du vocabulaire coranique"
  ur: "قرآنی الفاظ کے باریک فرق"
  es: "Sutiles distinciones del vocabulario coránico"
  tr: "Kur'an'daki Sözlü Farklılıklar"
  id: "Perbedaan Verbal dalam Al-Qur'an"
tags: ["nubuwat-browser", "nubuwat-asrar"]
summary:
  ar: "يعرض عمر عبد الكافي أمثلة على أن القرآن أضاف إلى العربية وفرّق بين ألفاظ يظنها الناس مترادفة: المطر والغيث، والعلم والمعرفة، والجسد والجسم، والأجداث، ويرى أن ذلك من إعجازه."
  en: "Omar Abdelkafy gives examples of how the Qur'an added to Arabic and distinguished words people take as synonyms: matar and ghayth (rain), 'ilm and ma'rifa (knowledge), jasad and jism (body), and ajdath (graves), and holds this to be part of its inimitability."
  fr: "Omar Abdelkafy donne des exemples de la manière dont le Coran a enrichi l’arabe et distingué des mots que l’on croit synonymes : matar et ghayth (pluie), ’ilm et ma’rifa (connaissance), jasad et jism (corps), ainsi qu’ajdath (tombes). Selon lui, cela participe de son inimitabilité."
  ur: "عمر عبد الکافی مثالیں دیتے ہیں کہ قرآن نے عربی میں اضافہ کیا اور ان الفاظ میں فرق کیا جنہیں لوگ مترادف سمجھتے ہیں: مطر اور غیث، علم اور معرفت، جسد اور جسم، اور اجداث، اور اسے قرآن کے اعجاز کا حصہ سمجھتے ہیں۔"
  es: "Omar Abdelkafy da ejemplos de cómo el Corán añadió al árabe y distinguió palabras que la gente toma como sinónimos: matar y ghayth (lluvia), 'ilm y ma'rifa (conocimiento), jasad y jism (cuerpo) y ajdath (tumbas), y sostiene que esto forma parte de su singularidad."
  tr: "Omar Abdul Kafi, Kur'an'ın Arapçaya eklendiğini ve insanların eşanlamlı sandığı kelimeleri ayırt ettiğini gösteren örnekler sunar: yağmur ve yağmur, bilgi ve bilgi, beden ve bedensel işlevler, atalar ve bunu mucizevi olarak görür."
  id: "Omar Abdul Kafi memberikan contoh yang menunjukkan bahwa Al-Qur'an ditambahkan ke dalam bahasa Arab dan kata-kata yang dihormati orang dianggap sinonim: hujan dan hujan, pengetahuan dan pengetahuan, fungsi tubuh dan tubuh, leluhur, dan ia menganggap ini sebagai mukjizat."
