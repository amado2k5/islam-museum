id: concept/ikhtiyar
class: concept
kind: legal
label:
  ar: اختيار
  en: Ikhtiyar (choice, free election by the responsible agent)
  es: "Ikhtiyar (elección, libre elección por parte del agente responsable)"
  fr: "Ikhtiyar (choix, libre élection par l'agent responsable)"
  ur: "اختیاار ⁦(انتخاب، ذمہ دار ایجنٹ کا آزادانہ انتخاب)⁩"
summary:
  ar: 'الاختيار لغةً تفضيل الشيء على غيره، واصطلاحاً القصد إلى أمر متردد بين الوجود والعدم داخل في قدرة الفاعل بترجيح أحد الجانبين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1964} ويفرّق الحنفية بين الاختيار والرضا، فالإكراه غير الملجئ يفسد الرضا دون الاختيار، والملجئ يُعدم الرضا ويفسد الاختيار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1965} ويشترط لصحة الاختيار التكليف والاستقلال في القصد، ويفسد إذا اختل شرط من شروط التكليف أو كان مبنياً على اختيار غيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1965} والتخيير يكون من الشارع كتخيير المستنجي، أو من غيره كتخيير الشريك، ولا يملكه إلا صاحب الحق أو نائبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1965} وحقوق الله لا خيرة فيها للمكلف، وفي حقوق العباد له فيها اختيار بجعل الشارع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1966} والاختيار شرط للثواب والعقاب، وقد شرع لتحقيق مصالح العباد الفردية والجماعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1966} ومواطن بحثه متفرقة في أبواب الفقه، كالطهارة والصلاة والحج والزكاة والطلاق والحضانة والشفعة والجهاد والتعزير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1966} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1967}'
  en: 'Ikhtiyar is, in the lexicon, preferring one thing to another; as a technical term, the intention toward a matter that lies between existence and non-existence and is within the agent''s power, by preferring one side. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1964} The Hanafis separate choice from consent: non-compelling coercion spoils consent but not choice, while compulsion that removes the will removes consent and spoils choice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1965} A valid choice needs responsibility and independence of intention; it is spoiled when a condition of responsibility is missing or when it rests on another''s choice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1965} Choice is given by the lawgiver, as in the choice of the one who cleans after relieving himself, or by another party, and only the right-holder or his lawful deputy may grant it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1965} Rights of God leave the responsible person no choice, while in rights of people he has choice by the lawgiver''s grant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1966} Choice is a condition of reward and punishment and was prescribed for the interests of people, individual and collective. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1966} Its places of discussion are scattered through the books of law, from purification and prayer to pilgrimage, zakat, divorce, custody, pre-emption, jihad and discretionary punishment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1966} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1967}'
  es: "Ikhtiyar es, en el léxico, preferir una cosa a otra; como término técnico, la intención hacia un asunto que se encuentra entre la existencia y la no existencia y está dentro del poder del agente, al preferir un lado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1964} Los hanafíes separan la elección del consentimiento: la coerción no obligatoria anula el consentimiento pero no la elección, mientras que la coacción que elimina la voluntad anula el consentimiento y anula la elección. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1965} Una elección válida necesita responsabilidad e independencia de intención; se anula cuando falta una condición de responsabilidad o cuando se basa en la elección de otro. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1965} La elección la da el legislador, como en la elección de quien limpia después de aliviarse, o por otra parte, y solo el titular del derecho o su representante legal puede otorgarla. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1965} Los derechos de Dios no dejan elección a la persona responsable, mientras que en los derechos de las personas tiene elección por concesión del legislador. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1966} La elección es una condición de recompensa y castigo y fue prescrita para los intereses de las personas, individual y colectiva. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1966} Sus temas de discusión se encuentran dispersos en los libros de derecho, desde la purificación y la oración hasta la peregrinación, el zakat, el divorcio, la custodia, el derecho de preferencia, la yihad y el castigo discrecional. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1966} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1967}"
  fr: "Dans le lexique, ikhtiyar signifie préférer une chose à une autre; techniquement, il s'agit de l'intention, envers une chose qui se situe entre l'existence et la non-existence et qui est du ressort de l'agent, de privilégier un aspect. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1964} Les hanafites distinguent le choix du consentement: la contrainte non contraignante invalide le consentement mais non le choix, tandis que la contrainte qui supprime la volonté supprime le consentement et invalide le choix. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1965} Un choix valable requiert responsabilité et indépendance d'intention; il est invalidé lorsqu'une condition de responsabilité fait défaut ou lorsqu'il repose sur le choix d'autrui. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1965} Le choix est donné par le législateur, comme dans le cas du choix de celui qui se purifie après avoir fait ses besoins, ou par une autre partie, et seul le titulaire du droit ou son représentant légitime peut l'accorder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1965} Les droits de Dieu ne laissent aucun choix à la personne responsable, tandis que les droits des hommes lui offrent un choix par l'intermédiaire du législateur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1966} Le choix est une condition de récompense et de châtiment et a été prescrit dans l'intérêt des hommes, tant individuel que collectif. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1966} Ses sujets de discussion sont disséminés dans les livres de loi, depuis la purification et la prière jusqu'au pèlerinage, la zakat, le divorce, la garde des enfants, le droit de préemption, le jihad et la peine discrétionnaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1966} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1967}"
  ur: "اختیاار لغت میں ایک چیز کو دوسری چیز پر ترجیح دینا ہے۔ ایک تکنیکی اصطلاح کے طور پر، کسی ایسے معاملے کی طرف ارادہ جو وجود اور عدم کے درمیان ہے اور ایک طرف کو ترجیح دے کر ایجنٹ کے اختیار میں ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 1964} احناف رضامندی سے الگ انتخاب: غیر زبردستی جبر رضامندی کو خراب کرتا ہے لیکن انتخاب کو نہیں، جب کہ جبر جو وصیت کو ہٹاتا ہے وہ رضامندی کو ختم کرتا ہے اور انتخاب کو خراب کرتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1965} ایک درست انتخاب کے لیے ذمہ داری اور نیت کی آزادی کی ضرورت ہوتی ہے۔ یہ خراب ہو جاتا ہے جب ذمہ داری کی شرط غائب ہو یا جب یہ کسی دوسرے کی پسند پر منحصر ہو۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 صفحہ 1965} انتخاب قانون دینے والے کی طرف سے دیا جاتا ہے، جیسا کہ حاجت کے بعد صفائی کرنے والے کے انتخاب میں، یا کسی دوسرے فریق کی طرف سے، اور صرف حق دار یا اس کا حلال نائب ہی اسے دے سکتا ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 1965} خدا کے حقوق ذمہ دار کے لیے کوئی چارہ نہیں چھوڑتے، جب کہ لوگوں کے حقوق میں اسے قانون دینے والے کی عطا سے اختیار حاصل ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1966} انتخاب جزا اور سزا کی شرط ہے اور اسے لوگوں کے انفرادی اور اجتماعی مفادات کے لیے مقرر کیا گیا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 1966} اس کی بحث کے مقامات طہارت اور نماز سے لے کر حج، زکوٰۃ، طلاق، تحویل، قبل از وقت، جہاد اور صوابدیدی سزا تک قانون کی کتابوں میں بکھرے ہوئے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1966}"
