label:
  ar: اختيار
  en: Ikhtiyar (choice, free election by the responsible agent)
summary:
  ar: 'الاختيار لغةً تفضيل الشيء على غيره، واصطلاحاً القصد إلى أمر متردد بين الوجود والعدم داخل في قدرة الفاعل بترجيح أحد الجانبين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1964} ويفرّق الحنفية بين الاختيار والرضا، فالإكراه غير الملجئ يفسد الرضا دون الاختيار، والملجئ يُعدم الرضا ويفسد الاختيار. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1965} ويشترط لصحة الاختيار التكليف والاستقلال في القصد، ويفسد إذا اختل شرط من شروط التكليف أو كان مبنياً على اختيار غيره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1965} والتخيير يكون من الشارع كتخيير المستنجي، أو من غيره كتخيير الشريك، ولا يملكه إلا صاحب الحق أو نائبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1965} وحقوق الله لا خيرة فيها للمكلف، وفي حقوق العباد له فيها اختيار بجعل الشارع. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1966} والاختيار شرط للثواب والعقاب، وقد شرع لتحقيق مصالح العباد الفردية والجماعية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1966} ومواطن بحثه متفرقة في أبواب الفقه، كالطهارة والصلاة والحج والزكاة والطلاق والحضانة والشفعة والجهاد والتعزير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1966} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1967}'
  en: 'Ikhtiyar is, in the lexicon, preferring one thing to another; as a technical term, the intention toward a matter that lies between existence and non-existence and is within the agent''s power, by preferring one side. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1964} The Hanafis separate choice from consent: non-compelling coercion spoils consent but not choice, while compulsion that removes the will removes consent and spoils choice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1965} A valid choice needs responsibility and independence of intention; it is spoiled when a condition of responsibility is missing or when it rests on another''s choice. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1965} Choice is given by the lawgiver, as in the choice of the one who cleans after relieving himself, or by another party, and only the right-holder or his lawful deputy may grant it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1965} Rights of God leave the responsible person no choice, while in rights of people he has choice by the lawgiver''s grant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1966} Choice is a condition of reward and punishment and was prescribed for the interests of people, individual and collective. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1966} Its places of discussion are scattered through the books of law, from purification and prayer to pilgrimage, zakat, divorce, custody, pre-emption, jihad and discretionary punishment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1966} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1967}'
