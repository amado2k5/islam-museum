tags: [arabiyya-browser, arabiyya-world]
label:
  ar: "العربية في الكاميرون"
  en: "Arabic in Cameroon"
  ur: "کیمرون میں عربی"
  fr: "l'arabe au Cameroun"
  es: "el árabe en Camerún"
  tr: "Kamerun'da Arapça"
  id: "Bahasa Arab di Kamerun"
summary:
  ar: "تعرض هذه الصفحة ما يقوله ملخص بحثي زُوّد به المتحف عن العربية في الكاميرون: مكانتها القانونية، والأصناف المحكية منها، والأرقام الرسمية كما وردت. وفي الكاميرون تكون الإنجليزية والفرنسية رسميتين، وتؤدي عربية الشوا وظيفة التواصل الأوسع في الشمال بلا تقنين بحسب الملخص. ولم يفتح المتحف الصفحات التي يسمّيها الملخص، وقد أجاز المؤسس استعماله كما ورد في 21 نوفمبر 2026. وحيث يقول الملخص إنه لم يجد مصدراً رسمياً أو رقماً فهذا ما تقوله الصفحة بلفظه، ولا يضع المتحف رقماً من عنده."
  en: "This page sets out what a research summary supplied to the museum says about Arabic in Cameroon: its legal status, the varieties spoken and the official figures, each as the summary gives it. In Cameroon English and French are official, and the summary says Shuwa Arabic serves wider communication in the north without standardisation. The museum did not open the pages the summary names, and the founder approved using it as supplied on 21 November 2026. Where the summary says that no official source or figure was found, this page says exactly that and supplies no number of its own."
  ur: "یہ صفحہ وہ پیش کرتا ہے جو متحف کو فراہم کردہ ایک تحقیقی خلاصہ کیمرون میں عربی کے بارے میں کہتا ہے: اس کی قانونی حیثیت، بولی جانے والی اقسام اور سرکاری اعداد و شمار، ہر ایک جیسا خلاصہ دیتا ہے۔ کیمرون میں انگریزی اور فرانسیسی سرکاری ہیں، اور خلاصے کے مطابق شووا عربی شمال میں بغیر معیاربندی کے وسیع تر رابطے کا کام دیتی ہے۔ متحف نے خلاصے کے بیان کردہ صفحات نہیں کھولے، اور بانی نے 21 نومبر 2026 کو خلاصے کو جیسا ملا اسی طرح استعمال کرنے کی منظوری دی۔ جہاں خلاصہ کہتا ہے کہ کوئی سرکاری ماخذ یا عدد نہیں ملا وہاں یہ صفحہ بالکل یہی کہتا ہے اور اپنی طرف سے کوئی عدد نہیں دیتا۔"
  fr: "Cette page expose ce que dit un résumé de recherche remis au musée sur l'arabe au Cameroun : son statut juridique, les variétés parlées et les chiffres officiels, chacun tel que le résumé le donne. Au Cameroun l'anglais et le français sont officiels, et le résumé dit que l'arabe shuwa sert à la communication plus large dans le nord sans normalisation. Le musée n'a pas ouvert les pages que nomme le résumé, et le fondateur a approuvé l'usage du résumé tel que fourni le 21 novembre 2026. Là où le résumé dit qu'aucune source officielle ni aucun chiffre n'a été trouvé, cette page dit exactement cela et ne fournit aucun nombre de son cru."
  es: "Esta página expone lo que dice un resumen de investigación entregado al museo sobre el árabe en Camerún: su estatus jurídico, las variedades habladas y las cifras oficiales, cada una como la da el resumen. En Camerún el inglés y el francés son oficiales, y el resumen dice que el árabe shuwa sirve a la comunicación más amplia en el norte sin normalización. El museo no abrió las páginas que nombra el resumen, y el fundador aprobó usarlo tal como se entregó el 21 de noviembre de 2026. Donde el resumen dice que no se halló ninguna fuente oficial ni cifra, esta página dice exactamente eso y no aporta ningún número propio."
  tr: "Bu sayfa, müzenin sağladığı bir araştırma özetinin Kamerun'daki Arapça hakkında söylediklerini sunmaktadır: yasal statüsü, konuşulan çeşitleri ve alınan resmi numaralar. Kamerun'da İngilizce ve Fransızca resmidir ve özete göre Shawa Arapçası, kuzeyde kodifikasyon gerektirmeyen en geniş iletişim işlevi olarak hizmet vermektedir. Müze, özet olarak adlandırdığı sayfaları açmamış ve kurucu 21 Kasım 2026'da belirtildiği üzere kullanımına izin vermiştir. Özet, resmi bir kaynak veya numara bulunmadığını belirttiği için, sayfada verbifi olarak yazılmış ve müze ondan bir numara vermemektedir."
  id: "Halaman ini menyajikan apa yang dikatakan ringkasan penelitian yang disediakan museum tentang bahasa Arab di Kamerun: status hukumnya, variasi yang digunakan, dan nomor resmi yang diperoleh. Di Kamerun, bahasa ini resmi dalam bahasa Inggris dan Prancis, dan menurut ringkasan tersebut, bahasa Arab Shawa berfungsi sebagai fungsi komunikasi terluas di utara yang tidak memerlukan kodifikasi. Museum belum membuka halaman yang disebut ringkasan, dan pendiri mengizinkan penggunaannya seperti yang dinyatakan pada 21 November 2026. Karena ringkasan menyatakan tidak ada sumber atau nomor resmi, maka ditulis secara verbal di halaman, dan museum tidak memberikan nomor dari sana."
