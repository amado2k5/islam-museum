id: concept/mukhtalif-al-hadith
class: concept
kind: term
label: { ar: "مختلف الحديث", en: "Reconciling conflicting hadiths (mukhtalif al-hadith)", ur: "مختلف الحدیث" }
term: { ar: "المحكم، مختلف الحديث، الناسخ والمنسوخ، الترجيح، التوقف", en: "muhkam, mukhtalif al-hadith, nasikh and mansukh, tarjih, tawaqquf" }
summary:
  ar: "يقسم ابن حجر المقبول إلى معمول به وغير معمول به: فالسالم من المعارضة هو المحكم، وما عارضه مقبول مثله فإن أمكن الجمع بلا تعسف فهو مختلف الحديث، وإلا فإن عُرف المتأخر فهو الناسخ، وإلا فالترجيح، ثم التوقف؛ ويمثل للجمع بحديثي «لا عدوى» و«فرّ من المجذوم» {cite:nuzhat-al-nazar-itr-bushra-2011 p. 71-75}."
  en: "Ibn Hajar divides accepted reports into those acted upon and those not: one free of any conflicting report is the definitive (muhkam); one conflicting with an equally accepted report is, if the two can be reconciled without strain, the subject of mukhtalif al-hadith; failing that, if the later one is known it abrogates the earlier; failing that, one is preferred; and failing that, judgement is suspended. His example of reconciliation is 'there is no contagion' with 'flee from the leper' {cite:nuzhat-al-nazar-itr-bushra-2011 p. 71-75}."
  ur: "ابن حجر مقبول کو معمول بہ اور غیر معمول بہ میں تقسیم کرتے ہیں: جو معارضے سے محفوظ ہو وہ محکم ہے؛ جس کا معارض اسی جیسا مقبول ہو تو اگر بلا تکلف جمع ممکن ہو تو یہ مختلف الحدیث ہے، ورنہ متاخر معلوم ہو تو ناسخ، ورنہ ترجیح، پھر توقف؛ وہ جمع کی مثال 'لا عدوی' اور 'کوڑھی سے بھاگو' کی حدیثوں سے دیتے ہیں {cite:nuzhat-al-nazar-itr-bushra-2011 p. 71-75}۔"
