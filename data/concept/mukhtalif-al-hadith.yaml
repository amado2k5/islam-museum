label: { ar: "مختلف الحديث", en: "Reconciling conflicting hadiths (mukhtalif al-hadith)", ur: "مختلف الحدیث", es: "Conciliar hadices contradictorios (mukhtalif al-hadith)", fr: "Réconcilier des hadiths contradictoires (mukhtalif al-hadith)", tr: "Farklı Hadisler", id: "Hadis yang Berbeda" }
term: { ar: "المحكم، مختلف الحديث، الناسخ والمنسوخ، الترجيح، التوقف", en: "muhkam, mukhtalif al-hadith, nasikh and mansukh, tarjih, tawaqquf" }
summary:
  ar: "يقسم ابن حجر المقبول إلى معمول به وغير معمول به: فالسالم من المعارضة هو المحكم، وما عارضه مقبول مثله فإن أمكن الجمع بلا تعسف فهو مختلف الحديث، وإلا فإن عُرف المتأخر فهو الناسخ، وإلا فالترجيح، ثم التوقف؛ ويمثل للجمع بحديثي «لا عدوى» و«فرّ من المجذوم» {cite:nuzhat-al-nazar-itr-bushra-2011 p. 71-75}."
  en: "Ibn Hajar divides accepted reports into those acted upon and those not: one free of any conflicting report is the definitive (muhkam); one conflicting with an equally accepted report is, if the two can be reconciled without strain, the subject of mukhtalif al-hadith; failing that, if the later one is known it abrogates the earlier; failing that, one is preferred; and failing that, judgement is suspended. His example of reconciliation is 'there is no contagion' with 'flee from the leper' {cite:nuzhat-al-nazar-itr-bushra-2011 p. 71-75}."
  ur: "ابن حجر مقبول کو معمول بہ اور غیر معمول بہ میں تقسیم کرتے ہیں: جو معارضے سے محفوظ ہو وہ محکم ہے؛ جس کا معارض اسی جیسا مقبول ہو تو اگر بلا تکلف جمع ممکن ہو تو یہ مختلف الحدیث ہے، ورنہ متاخر معلوم ہو تو ناسخ، ورنہ ترجیح، پھر توقف؛ وہ جمع کی مثال 'لا عدوی' اور 'کوڑھی سے بھاگو' کی حدیثوں سے دیتے ہیں {cite:nuzhat-al-nazar-itr-bushra-2011 p. 71-75}۔"
  es: "Ibn Hajar divide los relatos aceptados en aquellos sobre los que se actúa y aquellos que no: uno libre de cualquier relato contradictorio es el definitivo (muhkam); uno que entra en conflicto con un relato igualmente aceptado es, si ambos pueden conciliarse sin dificultad, objeto de mukhtalif al-hadith; de lo contrario, si se conoce el segundo, este abroga al primero; de lo contrario, se prefiere uno; y de lo contrario, se suspende el juicio. Su ejemplo de conciliación es \"no hay contagio\" con \"huye del leproso\" {cite:nuzhat-al-nazar-itr-bushra-2011 p. 71-75}."
  fr: "Ibn Hajar distingue deux types de hadiths acceptés: ceux qui sont suivis et ceux qui ne le sont pas. Le hadith exempt de toute contradiction est considéré comme définitif (muhkam). Un hadith en contradiction avec un autre hadith également accepté fait l’objet d’une appréciation (mukhtalif al-hadith) si les deux peuvent être conciliés sans difficulté. À défaut, si le hadith le plus récent est connu, il invalide le plus ancien. À défaut, l’un est préféré; et à défaut encore, le jugement est suspendu. Il cite comme exemple de conciliation l’injonction « il n’y a pas de contagion » et l’injonction « fuyez le lépreux » (voir: Nuzhat al-Nazar Itr Bushra, 2011, p. 71-75)."
  tr: "İbn Hajar, kabul edileni uygulanan ve kabul edilmemiş olarak ayırır: muhalefetin sesi belirleyicidir, karşı çıkan ise böyle kabul edilir. Eğer keyfi olmadan uzlaştırılabiliyorsa, bu farklı hadistir; aksi takdirde, ikincisi biliniyorsa, o feshettir; aksi takdirde tercih verilir ve sonra durdurulur; ve birleşim \"La Adwa\" ve \"Cüzzamlılardan kaç\" hadisleriyle temsil edilir {cite:nuzhat-al-nazar-itr-bushra-2011, s. 71-75}."
  id: "Ibn Hajar membagi yang diterima menjadi apa yang dipraktikkan dan apa yang tidak diterima: suara oposisi adalah yang menentukan, dan apa yang menentangnya diterima demikian. Jika mungkin untuk mendamaikan tanpa sewenang-wenang, maka hadits yang berbeda; jika yang terakhir diketahui, maka yang membatalkan; jika tidak, preferensi diberikan lalu dihentikan; dan kombinasi diwakili oleh hadits \"La Adwa\" dan \"Lari dari penderita kusta\" {cite:nuzhat-al-nazar-itr-bushra-2011, hlm. 71-75}."
