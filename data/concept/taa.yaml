label:
  ar: "الطاعة والطاعات"
  en: "Obedience and the acts of obedience (ta'a)"
  ur: "اطاعت اور طاعات"
  fr: "L'obéissance et les actes d'obéissance (ta'a)"
  es: "La obediencia y los actos de obediencia (ta'a)"
  tr: "İtaat ve itaat"
  id: "Ketaatan dan ketaatan"
summary:
  ar: "الطاعة امتثال أمر الله ورسوله، وجمعها الطاعات، ويقابلها في النصوص المعصية. يأمر بها القرآن في مواضع كثيرة منها [[passage/quran-4-59|النساء 59]]، ويجعل طاعة الرسول طاعة لله في [[passage/quran-4-80|النساء 80]]. وفي الحديث «من أطاعني فقد أطاع الله» {cite:hadith-api-fawazahmed0 Bukhari 2956}، وفي حدّها «لا طاعة في معصية، إنما الطاعة في المعروف» {cite:hadith-api-fawazahmed0 Bukhari 7257}. يضعها المتصفح فوق درجتي الفعل، الواجب والمندوب."
  en: "Obedience (taa) is compliance with the command of God and His Messenger, and its plural is acts of obedience (taat); its counterpart in the texts is disobedience. The Qur'an commands it in many places, among them [[passage/quran-4-59|al-Nisa' 59]], and makes obedience to the Messenger obedience to God in [[passage/quran-4-80|al-Nisa' 80]]. In the hadith, \"Whoever obeys me has obeyed God\" {cite:hadith-api-fawazahmed0 Bukhari 2956}, and as its limit, \"There is no obedience in disobedience; obedience is only in what is right\" {cite:hadith-api-fawazahmed0 Bukhari 7257}. The browser places it above the two degrees of the act, the obligatory and the recommended."
  ur: "طاعت اللہ اور اس کے رسول کے حکم کی تعمیل ہے، اور اس کی جمع طاعات ہے، اور نصوص میں اس کے مقابل معصیت ہے۔ قرآن بہت سے مقامات پر اس کا حکم دیتا ہے جن میں [[passage/quran-4-59|النساء 59]] بھی ہے، اور [[passage/quran-4-80|النساء 80]] میں رسول کی اطاعت کو اللہ کی اطاعت قرار دیتا ہے۔ حدیث میں ہے «جس نے میری اطاعت کی اس نے اللہ کی اطاعت کی» {cite:hadith-api-fawazahmed0 Bukhari 2956}، اور اس کی حد کے بارے میں «معصیت میں کوئی اطاعت نہیں، اطاعت تو صرف معروف میں ہے» {cite:hadith-api-fawazahmed0 Bukhari 7257}۔ براؤزر اسے فعل کے دو درجوں، واجب اور مندوب، کے اوپر رکھتا ہے۔"
  fr: "L'obéissance (taa) est la conformité à l'ordre de Dieu et de son Messager, et son pluriel est les actes d'obéissance (taat) ; son pendant dans les textes est la désobéissance. Le Coran l'ordonne en de nombreux endroits, dont [[passage/quran-4-59|al-Nisa' 59]], et fait de l'obéissance au Messager une obéissance à Dieu en [[passage/quran-4-80|al-Nisa' 80]]. Dans le hadith : « Qui m'obéit a obéi à Dieu » {cite:hadith-api-fawazahmed0 Bukhari 2956}, et pour sa limite : « Il n'y a pas d'obéissance dans la désobéissance ; l'obéissance n'est que dans ce qui est convenable » {cite:hadith-api-fawazahmed0 Bukhari 7257}. Le navigateur la place au-dessus des deux degrés de l'acte, l'obligatoire et le recommandé."
  es: "La obediencia (taa) es la conformidad con la orden de Dios y de su Mensajero, y su plural es los actos de obediencia (taat); su contrapartida en los textos es la desobediencia. El Corán la ordena en muchos lugares, entre ellos [[passage/quran-4-59|al-Nisa' 59]], y hace de la obediencia al Mensajero obediencia a Dios en [[passage/quran-4-80|al-Nisa' 80]]. En el hadiz: «Quien me obedece ha obedecido a Dios» {cite:hadith-api-fawazahmed0 Bukhari 2956}, y sobre su límite: «No hay obediencia en la desobediencia; la obediencia es solo en lo que es justo» {cite:hadith-api-fawazahmed0 Bukhari 7257}. El explorador la sitúa por encima de los dos grados del acto, lo obligatorio y lo recomendado."
  tr: "İtaat, Allah ve O'nun Resulünün emrine itaattir; çoğul olarak itaat olarak kullanılır ve metinlerde itaatsizlikle karşılık gelir. Kur'an birçok yerde bunu emreder; [[pasaj/kuran-4-59|An-Nisa 59]] dahil olmak üzere ve [[pasaj/kuran-4-80|An-Nisa 80]]'de Resul'a itaat etmeyi Allah'a itaat eder. Ve hadislerde: 'Bana itaat eden, Allah'a itaat etmiştir' {cite:hadis-api-fawazahmed0 Buhari 2956}} ve tanımında, 'Günahta itaat yoktur, sadece iyilikte itaat vardır' {cite:hadis-api-fawazahmed0 Buhari 7257} der. Tarayıcı bunu eylem, zorunluluk ve tavsiye derecelerinin üzerine koyar."
  id: "Ketaatan adalah ketaatan pada perintah Allah dan Rasul-Nya, yang dijamak sebagai ketaatan, dan dalam teks-teks tersebut sesuai dengan ketidaktaatan dalam teks. Al-Qur'an memerintahkannya di banyak tempat, termasuk [[ayat/al-Quran-4-59|An-Nisa 59]], dan menjadikan ketaatan kepada Rasul sebagai ketaatan kepada Allah dalam [[ayat/al-Quran-4-80|An-Nisa 80]]. Dan dalam hadits: 'Barangsiapa yang taat kepada-Ku telah taat kepada Allah' {cite:hadith-api-fawazahmed0 Bukhari 2956}, dan dalam definisinya, 'Tidak ada ketaatan dalam dosa, hanya ketaatan pada yang baik' {cite:hadith-api-fawazahmed0 Bukhari 7257}. Browser menempatkannya di atas dua derajat tindakan, kewajiban, dan rekomendasi."
