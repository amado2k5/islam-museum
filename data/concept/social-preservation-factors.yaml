label:
  ar: "العوامل الحافظة للمجتمع في القرآن"
  en: "Qur'anic factors that keep society whole"
summary:
  ar: "يعرض عرجون ثلاثة عوامل يحفظ بها الله المجتمع الإنساني من التفتت والذوبان: الإخاء الرحمي القائم على وحدة المنبع والنوع {cite:sunan-allah-fi-al-mujtama-azhar p. 33}، والمودة والرحمة اللتان جعلهما الله أساس الأسرة الأولى ثم أساس المجتمع {cite:sunan-allah-fi-al-mujtama-azhar p. 34}، والتعارف بين فصائل البشر الذي يقرّب ما باعدته النسب والبيئة {cite:sunan-allah-fi-al-mujtama-azhar p. 35}. وإذا انحرف المجتمع عن الإخاء والمودة تخطفته الأنانية والانفرادية، ثم بدأت فيه أطوار الانحدار {cite:sunan-allah-fi-al-mujtama-azhar p. 35}."
  en: "Arjun names three factors by which God keeps human society from breaking apart: kinship brotherhood rooted in one origin, the affection and mercy God set between spouses as the base of the first family, and mutual acquaintance (ta'aruf) among human groups. When society turns from brotherhood and affection, selfishness takes hold and the decline begins {cite:sunan-allah-fi-al-mujtama-azhar p. 33-35}."
