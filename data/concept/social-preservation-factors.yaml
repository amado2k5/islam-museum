id: concept/social-preservation-factors
class: concept
kind: social
label:
  ar: "العوامل الحافظة للمجتمع في القرآن"
  en: "Qur'anic factors that keep society whole"
  es: "Factores coránicos que mantienen unida a la sociedad"
  fr: "Les facteurs coraniques qui préservent l'unité de la société"
  ur: "قرآنی عوامل جو معاشرے کو مکمل رکھتے ہیں۔"
  tr: "Kur'an'da toplumu koruyan faktörler"
  id: "Faktor-faktor yang Menjaga Masyarakat dalam Al-Qur'an"
summary:
  ar: "يعرض عرجون ثلاثة عوامل يحفظ بها الله المجتمع الإنساني من التفتت والذوبان: الإخاء الرحمي القائم على وحدة المنبع والنوع {cite:sunan-allah-fi-al-mujtama-azhar p. 33}، والمودة والرحمة اللتان جعلهما الله أساس الأسرة الأولى ثم أساس المجتمع {cite:sunan-allah-fi-al-mujtama-azhar p. 34}، والتعارف بين فصائل البشر الذي يقرّب ما باعدته النسب والبيئة {cite:sunan-allah-fi-al-mujtama-azhar p. 35}. وإذا انحرف المجتمع عن الإخاء والمودة تخطفته الأنانية والانفرادية، ثم بدأت فيه أطوار الانحدار {cite:sunan-allah-fi-al-mujtama-azhar p. 35}."
  en: "Arjun names three factors by which God keeps human society from breaking apart: kinship brotherhood rooted in one origin, the affection and mercy God set between spouses as the base of the first family, and mutual acquaintance (ta'aruf) among human groups. When society turns from brotherhood and affection, selfishness takes hold and the decline begins {cite:sunan-allah-fi-al-mujtama-azhar p. 33-35}."
  es: "Arjun menciona tres factores mediante los cuales Dios impide que la sociedad humana se desintegre: la hermandad de parentesco arraigada en un origen común, el afecto y la misericordia que Dios estableció entre los cónyuges como base de la primera familia, y el conocimiento mutuo (ta'aruf) entre los grupos humanos. Cuando la sociedad se aparta de la hermandad y el afecto, el egoísmo se impone y comienza la decadencia {cite:sunan-allah-fi-al-mujtama-azhar p. 33-35}."
  fr: "Arjun mentionne trois facteurs par lesquels Dieu préserve la société humaine de son éclatement: la fraternité familiale, enracinée dans une origine commune; l’affection et la miséricorde que Dieu a instituées entre les époux, fondement de la famille première; et la connaissance mutuelle (ta’aruf) entre les groupes humains. Lorsque la société se détourne de la fraternité et de l’affection, l’égoïsme s’installe et le déclin commence (voir: Sunan Allah fi al-Mujtama Azhar, p. 33-35)."
  ur: "ارجن تین عوامل کا نام بتاتا ہے جن کے ذریعہ خدا انسانی معاشرے کو ٹوٹنے سے روکتا ہے: رشتہ داری بھائی چارہ جو ایک اصل میں جڑا ہوا ہے، پیار اور رحم جو خدا نے میاں بیوی کے درمیان پہلے خاندان کی بنیاد کے طور پر قائم کیا، اور انسانی گروہوں کے درمیان باہمی واقفیت ⁦(طعرف)⁩۔ جب معاشرہ اخوت اور الفت سے ہٹ جاتا ہے تو خود غرضی پکڑ لیتی ہے اور زوال شروع ہو جاتا ہے 33-35}۔"
  tr: "Arjun, Tanrı'nın insan toplumunu parçalanma ve çözülmeden koruduğu üç faktörü sunar: kaynak ve tür birliğine dayalı akrabalık kardeşliği {cite:sunan-allah-fi-al-mujtama-azhar s. 33}, Tanrı'nın ilk ailenin ve sonra toplumun temelini oluşturduğu sevgi ve merhamet {cite:sunan-allah-fi-al-mujtama-azhar s. 34} ve insan grupları arasında tanışma, bu da soy ve çevrenin hangi soyun ve çevreyi birbirine yaklaştırdığını {cite:sunan-allah-fi-al-mujtama-azhar s. 35}. Toplum kardeşlik ve sevgiden saptığında, bencillik ve bireyselcilik tarafından silinir ve ardından içinde çöküş aşamaları başlar {cite:sunan-allah-fi-al-mujtama-azhar s. 35}."
  id: "Arjun menyajikan tiga faktor yang menjadi dasar Tuhan bagi masyarakat manusia dari fragmentasi dan pembubaran: persaudaraan kekerabatan yang didasarkan pada kesatuan sumber dan spesies {cite:sunan-allah-fi-al-mujtama-azhar hlm. 33}, kasih sayang dan belas kasih, yang Tuhan buat sebagai dasar keluarga pertama dan kemudian fondasi masyarakat {cite:sunan-allah-fi-al-mujtama-azhar hlm. 34}, dan kenalan antar kelompok manusia yang mendekatkan garis keturunan dan lingkungan yang telah menjauh {cite:sunan-allah-fi-al-mujtama-azhar hlm. 35}. Ketika masyarakat menyimpang dari persaudaraan dan kasih sayang, ia tersapu oleh keegoisan dan individualisme, dan kemudian tahap kemunduran dimulai di dalamnya {cite:sunan-allah-fi-al-mujtama-azhar hlm. 35}."
