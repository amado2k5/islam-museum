label:
  ar: "القيادة السيئة وأنماطها السبعة"
  en: "Bad leadership and its seven types"
  ur: "بری قیادت اور اس کے سات انداز"
summary:
  ar: "القائد السيئ عند طارق السويدان نوعان: ضعيف الكفاءة وسيئ الأخلاق والأهداف؛ ودوافعه الخوف والطمع والشهوة؛ وأنماطه سبعة أخذ أسماءها من باربرا كيلرمن: العاجز والجامد والمسرف والقاسي والفاسد والمنعزل والشرير، مع نموذج لتقليل القيادات السيئة."
  en: "In Tareq al-Suwaidan's teaching the bad leader is either weak in competence or bad in ethics and aims; his drivers are fear, greed and desire; and he comes in seven types whose names al-Suwaidan takes from Barbara Kellerman, the incompetent, rigid, intemperate, callous, corrupt, insular and evil, with a model for reducing bad leadership."
  ur: "طارق السویدان کے نزدیک برا قائد یا اہلیت میں کمزور ہوتا ہے یا اخلاق و مقاصد میں برا؛ اس کے محرکات خوف، لالچ اور خواہش ہیں؛ اور اس کے سات انداز ہیں جن کے نام وہ باربرا کیلرمن سے لیتے ہیں: عاجز، جامد، مسرف، سنگدل، فاسد، الگ تھلگ اور شریر، نیز بری قیادت کم کرنے کا ایک نمونہ۔"
