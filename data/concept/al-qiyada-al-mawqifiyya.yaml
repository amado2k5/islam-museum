id: concept/al-qiyada-al-mawqifiyya
class: concept
kind: term
label:
  ar: "القيادة الموقفية"
  en: "Situational leadership"
  ur: "موقعی قیادت"
summary:
  ar: "القيادة الموقفية كما يدرّسها طارق السويدان: القائد يمارس توجيهاً أو تشجيعاً، فتنشأ أربعة أساليب (موجّه، مدرب، مشجع، مفوّض) تُقابل أربعة أنماط من المرؤوسين (مبتدئ، متوسط، متقدم، خبير)، والقائد الفعال يغيّر أسلوبه حسب المهمة والشخص."
  en: "Situational leadership as Tareq al-Suwaidan teaches it: the leader either directs or encourages, producing four styles (director, coach, encourager, delegator) matched to four subordinate types (beginner, intermediate, advanced, expert); the effective leader changes his style with the task and the person."
  ur: "موقعی قیادت جیسا کہ طارق السویدان سکھاتے ہیں: قائد یا تو ہدایت دیتا ہے یا حوصلہ دیتا ہے، جس سے چار انداز بنتے ہیں (ہدایتکار، کوچ، حوصلہ افزا، مفوض) جو ماتحتوں کی چار اقسام (نوآموز، متوسط، ماہر، خبیر) سے ملائے جاتے ہیں؛ مؤثر قائد اپنا انداز کام اور شخص کے مطابق بدلتا ہے۔"
