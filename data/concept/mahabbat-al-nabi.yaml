id: concept/mahabbat-al-nabi
class: concept
kind: belief
label:
  ar: "محبة النبي"
  en: "Love of the Prophet (mahabbat al-nabi)"
  ur: "نبی کی محبت"
summary:
  ar: "محبة المسلم للنبي وتقديمها على محبة النفس والأهل والمال، كما يعرضها أحمد عبد السلام في برنامج «أصلّي عليه»: يبدأ بحب الله لنبيه وحب النبي لربه، ثم حب الصحابة له في أقوال علي وعمر وفي قصص المرأة الأنصارية وخبيب وأبي قتادة وعروة بن مسعود وأبي بكر، ثم حب البهيمة والشجر وجذع النخلة والجبل له، ويجعل علامتها العملية الاتباع: الطاعة والاجتناب والتصديق وتقديم قوله، وألا يُعبد الله إلا بما شرع."
  en: "A Muslim's love for the Prophet, placed above love of self, family and wealth, as Ahmed Abdussalam presents it in the programme 'Osalli Alayh': he begins with God's love for His Prophet and the Prophet's love for his Lord, then the Companions' love for him in the sayings of Ali and Umar and the stories of the Ansari woman, Khubayb, Abu Qatada, Urwa ibn Mas'ud and Abu Bakr, then the love a camel, two trees, a palm trunk and a mountain had for him; its practical sign, for him, is following: obeying, avoiding what he forbade, believing what he reported, putting his word first, and worshipping God only as he laid down."
  ur: "مسلمان کی نبی سے محبت، جو اپنی جان، گھر والوں اور مال کی محبت سے مقدم ہو، جیسا کہ احمد عبد السلام پروگرام «اُصلّی علیہ» میں پیش کرتے ہیں: وہ اللہ کی اپنے نبی سے محبت اور نبی کی اپنے رب سے محبت سے شروع کرتے ہیں، پھر علی اور عمر کے اقوال اور انصاری خاتون، خبیب، ابو قتادہ، عروہ بن مسعود اور ابوبکر کے قصوں میں صحابہ کی محبت، پھر ایک اونٹ، دو درختوں، کھجور کے تنے اور ایک پہاڑ کی ان سے محبت؛ ان کے نزدیک اس کی عملی علامت اتباع ہے: اطاعت، ممانعت سے پرہیز، ان کی خبر کی تصدیق، ان کے قول کو مقدم رکھنا، اور اللہ کی عبادت صرف ان کے بتائے ہوئے طریقے سے کرنا۔"
