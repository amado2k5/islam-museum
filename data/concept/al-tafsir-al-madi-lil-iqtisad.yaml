label:
  ar: التفسير المادي للاقتصاد
  en: The material definition of economics
summary:
  ar: "يعرض المؤلف تعريفات الاقتصاد عند آدم سميث وجون ستيوارت ميل وألفريد مارشال وويكستيد وغيرهم، ويرى أنها تتفق على المبدأ المادي وتغفل نوع الوسائل وأخلاقها {cite:qadan-manhaj-iqtisad-quran p. 9}{cite:qadan-manhaj-iqtisad-quran p. 10}. وينقل عن رويتر نقده لتعريفات تركز على الجانب المادي، ثم يضيف نقده هو لتعريف رويتر نفسه لأنه لا يهتم بنوع الحاجات المشبعة: مشروعة أو غير مشروعة، طيبة أو سيئة {cite:qadan-manhaj-iqtisad-quran p. 11}."
