id: concept/al-tafsir-al-madi-lil-iqtisad
class: concept
kind: term
tags: [islamic-economy-browser, islamic-economy-money]
label:
  ar: التفسير المادي للاقتصاد
  en: The material definition of economics
  es: "La definición material de economía"
  fr: "La définition matérielle de l'économie"
  ur: "معاشیات کی مادی تعریف"
  tr: "Ekonominin Materyalist Yorumu"
  id: "Interpretasi Materialis Ekonomi"
summary:
  ar: "يعرض المؤلف تعريفات الاقتصاد عند آدم سميث وجون ستيوارت ميل وألفريد مارشال وويكستيد وغيرهم، ويرى أنها تتفق على المبدأ المادي وتغفل نوع الوسائل وأخلاقها {cite:qadan-manhaj-iqtisad-quran p. 9}{cite:qadan-manhaj-iqtisad-quran p. 10}. وينقل عن رويتر نقده لتعريفات تركز على الجانب المادي، ثم يضيف نقده هو لتعريف رويتر نفسه لأنه لا يهتم بنوع الحاجات المشبعة: مشروعة أو غير مشروعة، طيبة أو سيئة {cite:qadan-manhaj-iqtisad-quran p. 11}."
  tr: "Yazar, Adam Smith, John Stuart Mill, Alfred Marshall, Wickstead ve diğerlerinin ekonomi tanımlarını sunar ve materyalist ilke üzerinde hemfikir olduklarını düşünürken, araçların türü ve etiğini göz ardı ederler {cite:qadan-manhaj-iqtisad-kuran s. 9} {cite:qadan-manhaj-iqtisad-kuran s. 10}. Tanımların eleştirisi olarak Reuter'den alıntı yapar, maddi yöne odaklanır, ardından Reuter'in kendi tanımına kendi eleştirisini ekler çünkü doymuş ihtiyaç türlerini umursamamaktadır: meşru ya da meşru olmayan, iyi ya da kötü {cite:qadan-manhaj-iqtisad-quran s. 11}."
  id: "Penulis menyajikan definisi ekonomi oleh Adam Smith, John Stuart Mill, Alfred Marshall, Wickstead, dan lainnya, dan meskipun sepakat pada prinsip materialis, mereka mengabaikan jenis dan etika alat {cite:qadan-manhaj-iqtisad-quran hlm. 9} {cite:qadan-manhaj-iqtisad-quran hlm. 10}. Ia mengutip Reuter sebagai kritik terhadap definisi, fokus pada aspek material, lalu menambahkan kritiknya sendiri ke definisi Reuter sendiri karena ia tidak peduli dengan jenis kebutuhan yang jenuh: sah atau tidak sah, baik atau buruk {cite:qadan-manhaj-iqtisad-quran hlm. 11}."
