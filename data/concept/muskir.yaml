label:
  ar: المسكرات
  en: Intoxicants (muskirat)
  es: "Sustancias intoxicantes (muskirat)"
  fr: "Substances enivrantes (muskirat)"
summary:
  ar: "المسكرات في الحديث السادس والأربعين من زيادات ابن رجب جامعة لا خاصة بالخمر: «كل مسكر حرام» — سئل النبي عن البتع نبيذ العسل والمزر نبيذ الشعير من أشربة اليمن فعمم الحكم كل مسكر، وفي لفظ مسلم «كل ما أسكر عن الصلاة فهو حرام» — قال ابن رجب هذا الحديث أصل في تحريم تناول جميع المسكرات المغطية للعقل، وتدرج التحريم عنده: حرمت الخمر أولاً عند حضور الصلاة بالآية «لا تقربوا الصلاة وأنتم سكارى» بعد خلط أحد المهاجرين في القراءة ثم حرمت على الإطلاق ⁦(جامع العلوم والحكم ص 881)⁩."
  en: "Intoxicants in the forty-sixth hadith of Ibn Rajab's additions are a genus not confined to wine: 'every intoxicant is forbidden' — asked about Yemen's al-Bit', a honey-wine, and al-Mizr, a barley-wine, the Prophet generalised the ruling to every intoxicant, Muslim's wording adding 'everything that intoxicates away from the prayer is forbidden'; Ibn Rajab calls this hadith the foundation of the prohibition of all substances that veil the intellect, tracing its staging: wine was first forbidden at the approach of prayer through the verse 'do not approach the prayer while intoxicated' — after an Emigrant fumbled his recitation — and only later forbidden absolutely (Jami' al-Ulum wal-Hikam p. 881)."
  es: "En el hadiz número cuarenta y seis de las adiciones de Ibn Rajab, los intoxicantes son un género que no se limita al vino: \"todo intoxicante está prohibido\". Al preguntársele sobre el al-Bit' de Yemen, un vino de miel, y el al-Mizr, un vino de cebada, el Profeta generalizó la norma a todo intoxicante, y la redacción de Muslim añadió: \"todo lo que intoxica lejos de la oración está prohibido\". Ibn Rajab llama a este hadiz el fundamento de la prohibición de todas las sustancias que velan el intelecto, y rastrea su desarrollo: el vino fue prohibido por primera vez al acercarse a la oración mediante el versículo \"no te acerques a la oración estando intoxicado\" —después de que un emigrante se equivocara en su recitación— y solo más tarde fue prohibido absolutamente (Jami' al-Ulum wal-Hikam, pág. 881)."
  fr: "Dans le quarante-sixième hadith ajouté par Ibn Rajab, les substances enivrantes ne se limitent pas au vin: « toute substance enivrante est interdite ». Interrogé sur l'al-Bit', un vin de miel du Yémen, et l'al-Mizr, un vin d'orge, le Prophète a généralisé la règle à toute substance enivrante, Muslim ajoutant: « tout ce qui enivre et détourne de la prière est interdit ». Ibn Rajab considère ce hadith comme le fondement de l'interdiction de toutes les substances qui obscurcissent l'intellect, et en retrace l'évolution: le vin fut d'abord interdit à l'approche de la prière par le verset « n'approchez pas la prière en état d'ivresse » – après qu'un émigrant eut bafouillé sa récitation – et ne fut interdit absolument que plus tard (Jami' al-Ulum wal-Hikam, p. 881)."
