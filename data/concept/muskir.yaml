label:
  ar: المسكرات
  en: Intoxicants (muskirat)
summary:
  ar: "المسكرات في الحديث السادس والأربعين من زيادات ابن رجب جامعة لا خاصة بالخمر: «كل مسكر حرام» — سئل النبي عن البتع نبيذ العسل والمزر نبيذ الشعير من أشربة اليمن فعمم الحكم كل مسكر، وفي لفظ مسلم «كل ما أسكر عن الصلاة فهو حرام» — قال ابن رجب هذا الحديث أصل في تحريم تناول جميع المسكرات المغطية للعقل، وتدرج التحريم عنده: حرمت الخمر أولاً عند حضور الصلاة بالآية «لا تقربوا الصلاة وأنتم سكارى» بعد خلط أحد المهاجرين في القراءة ثم حرمت على الإطلاق (جامع العلوم والحكم ص 881)."
  en: "Intoxicants in the forty-sixth hadith of Ibn Rajab's additions are a genus not confined to wine: 'every intoxicant is forbidden' — asked about Yemen's al-Bit', a honey-wine, and al-Mizr, a barley-wine, the Prophet generalised the ruling to every intoxicant, Muslim's wording adding 'everything that intoxicates away from the prayer is forbidden'; Ibn Rajab calls this hadith the foundation of the prohibition of all substances that veil the intellect, tracing its staging: wine was first forbidden at the approach of prayer through the verse 'do not approach the prayer while intoxicated' — after an Emigrant fumbled his recitation — and only later forbidden absolutely (Jami' al-Ulum wal-Hikam p. 881)."
