label:
  ar: "الكوثر"
  en: "Al-Kawthar (the river of abundant good)"
  ur: "کوثر"
summary:
  ar: "الكوثر في اللغة الخير الكثير، وهو اسم سورة قصيرة في القرآن، وتصفه الأحاديث بأنه نهر في الجنة أعطاه الله للنبي. يشرحه برنامج «في رحاب الحديث القدسي» في حلقته الثالثة عشرة، ويرى فيه محمد متولي الشعراوي ردّاً على من وصفوا النبي بالأبتر بعد وفاة ابنه، ويتكلم على وصف أنهار الجنة بالمثل لا بالصورة."
  en: "Al-Kawthar means abundant good in the lexicon; it is the name of a short sura of the Qur'an, and the hadiths describe it as a river in the Garden that God gave the Prophet. The programme In the Courts of the Hadith Qudsi explains it in its thirteenth episode, where Muhammad Mutawalli al-Sha'rawi reads it as the answer to those who called the Prophet 'cut off' after his son died, and speaks of the Garden's rivers being described by likeness rather than by form."
  ur: "کوثر لغت میں خیرِ کثیر کو کہتے ہیں؛ یہ قرآن کی ایک مختصر سورت کا نام ہے، اور احادیث اسے جنت کی ایک نہر بتاتی ہیں جو اللہ نے نبی کو عطا کی۔ پروگرام «فی رحاب الحدیث القدسی» اپنی تیرہویں قسط میں اس کی شرح کرتا ہے، جہاں محمد متولی الشعراوی اسے ان لوگوں کا جواب سمجھتے ہیں جنہوں نے نبی کے بیٹے کی وفات کے بعد انہیں «ابتر» کہا، اور جنت کی نہروں کے صورت کے بجائے مثال سے بیان کیے جانے پر گفتگو کرتے ہیں۔"
