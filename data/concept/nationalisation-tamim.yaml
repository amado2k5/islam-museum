label:
  ar: التأميم
  en: Nationalisation (tamim)
summary:
  ar: 'التأميم هو تحويل ملكية مال معين من الملكية الخاصة إلى ملكية الأمة {cite:usul-iqtisad-islami-0660 p. 66}. ويعرض المؤلف خلاصة لرأي الدكتور العبادي في خمس صور: استرداد الأموال المحرّمة لصرفها على الفقراء أو المصالح العامة فيجوز بل يجب {cite:usul-iqtisad-islami-0660 p. 66}، واسترداد أموال الأمة من الشركات الأجنبية لاستبعاد السيطرة الحربية فمطلوب {cite:usul-iqtisad-islami-0660 p. 66} {cite:usul-iqtisad-islami-0660 p. 67}، وإعادة الأموال التي لا تملك ملكية خاصة أصلًا فمشروع {cite:usul-iqtisad-islami-0660 p. 67}، وتحويل ملكية فرد أو أفراد قليلين بتعويض عادل لضرورة يراها ولي الأمر فمعقول {cite:usul-iqtisad-islami-0660 p. 67}، وتحويل المنشآت الكبيرة كلها بتعويض أو بغيره فلا يراه المؤلف منسجمًا مع القواعد الشرعية {cite:usul-iqtisad-islami-0660 p. 67}. ويستشهد المؤلف بابن خلدون في أن تجارة السلطان تضر الرعية وتفسد الجباية {cite:usul-iqtisad-islami-0660 p. 67} {cite:usul-iqtisad-islami-0660 p. 68}.'
