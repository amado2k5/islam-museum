label:
  ar: التأميم
  en: Nationalisation (tamim)
  es: "Nacionalización (tamim)"
  fr: "Nationalisation (tamim)"
  ur: "نیشنلائزیشن ⁦(تمیم)⁩"
  tr: "Millileştirme"
  id: "Nasionalisasi"
summary:
  ar: 'التأميم هو تحويل ملكية مال معين من الملكية الخاصة إلى ملكية الأمة {cite:usul-iqtisad-islami-0660 p. 66}. ويعرض المؤلف خلاصة لرأي الدكتور العبادي في خمس صور: استرداد الأموال المحرّمة لصرفها على الفقراء أو المصالح العامة فيجوز بل يجب {cite:usul-iqtisad-islami-0660 p. 66}، واسترداد أموال الأمة من الشركات الأجنبية لاستبعاد السيطرة الحربية فمطلوب {cite:usul-iqtisad-islami-0660 p. 66} {cite:usul-iqtisad-islami-0660 p. 67}، وإعادة الأموال التي لا تملك ملكية خاصة أصلًا فمشروع {cite:usul-iqtisad-islami-0660 p. 67}، وتحويل ملكية فرد أو أفراد قليلين بتعويض عادل لضرورة يراها ولي الأمر فمعقول {cite:usul-iqtisad-islami-0660 p. 67}، وتحويل المنشآت الكبيرة كلها بتعويض أو بغيره فلا يراه المؤلف منسجمًا مع القواعد الشرعية {cite:usul-iqtisad-islami-0660 p. 67}. ويستشهد المؤلف بابن خلدون في أن تجارة السلطان تضر الرعية وتفسد الجباية {cite:usul-iqtisad-islami-0660 p. 67} {cite:usul-iqtisad-islami-0660 p. 68}.'
  tr: "Millileştirme, belirli bir mülkiyetin mülkiyetinin özel mülkiyetten ulusun mülkiyetine devredilmesidir {cite:usul-iqtisad-islami-0660 s. 66}. Yazar, Dr. Al-Abadi'nin görüşünü beş şekilde özetliyor: yoksullara veya kamu yararına harcanması yasak olan fonların geri alınması, ki bu kabul edilebilir ve hatta zorunludur, {cite:usul-iqtisad-islami-0660 s. 66}; askeri kontrolü dışlamak için yabancı şirketlerden ülke fonlarının geri alınması {cite:usul-iqtisad-islami-0660 s. 66}; projede orijinal olarak özel mülke sahip olmayan fonların iadesi {cite:usul-iqtisad-islami-0660 s. 67}; ve vasi tarafından makul görülen bir ihtiyaç karşılığında bir veya birkaç kişinin mülkiyetinin adil tazminatla devredilmesi {cite: usul-iqtisad-islami-0660 s. 67} ve tüm büyük yapıları tazminat karşılığında veya başka bir ücretle dönüştürmek, böylece yazar bunu İslami kurallarla uyumlu bulmamaktadır {cite:usul-iqtisad-islami-0660 s. 67}. Yazar, İbn Haldun'un sultanın ticaretinin tebaalara zarar verdiğini ve vergilendirmeyi yozlaştırdığını söylediğini aktarır {cite:usul-iqtisad-islami-0660 s. 67} {cite:usul-iqtisad-islami-0660 s. 68}."
  id: "Nasionalisasi adalah pemindahan kepemilikan suatu properti dari properti pribadi ke properti bangsa {cite:usul-iqtisad-islami-0660 hlm. 66}. Penulis menyajikan ringkasan pendapat Dr. Al-Abadi dalam lima bentuk: memulihkan dana yang dilarang digunakan untuk kepentingan miskin atau publik, yang diperbolehkan dan memang wajib, {cite:usul-iqtisad-islami-0660 hlm. 66}; memulihkan dana negara dari perusahaan asing untuk mengecualikan kontrol militer, yang diperlukan {cite:usul-iqtisad-islami-0660 hlm. 66}; mengembalikan dana yang awalnya tidak memiliki properti pribadi dalam proyek {cite:usul-iqtisad-islami-0660 hlm. 67}; dan memindahkan kepemilikan satu atau beberapa individu dengan kompensasi yang adil atas kebutuhan yang dianggap wajar oleh wali {cite: usul-iqtisad-islami-0660 hlm. 67}, dan mengubah semua struktur besar dengan kompensasi atau lainnya, sehingga penulis tidak menganggapnya konsisten dengan aturan Islam {cite:usul-iqtisad-islami-0660 hlm. 67}. Penulis mengutip Ibn Khaldun yang mengatakan bahwa perdagangan sultan merugikan rakyat dan merusak perpajakan {cite:usul-iqtisad-islami-0660 hlm. 67} {cite:usul-iqtisad-islami-0660 hlm. 68}."
