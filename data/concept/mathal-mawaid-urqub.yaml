summary:
  ar: "مثل يُضرب في الوعود الفارغة التي لا تُنجَز، وقصته أن عرقوباً وعد أخاه بثمر نخلته مرحلة بعد مرحلة ثم قطفه ليلاً خفية {cite:noonpost-16943}."
  en: "A proverb for empty promises never kept; its tale is of Urqub, who promised his brother his palm's fruit stage after stage, then cut it secretly by night {cite:noonpost-16943}."
  ur: "وہ مثل جو کھوکھلے وعدوں کے لیے کہی جاتی ہے جو پورے نہیں ہوتے؛ اس کا قصہ عرقوب کا ہے جس نے بھائی کو اپنی کھجور کا پھل مرحلہ وار دینے کا وعدہ کیا اور پھر رات کو چھپ کر توڑ لیا {cite:noonpost-16943}۔"
  fr: "Proverbe dit des promesses vaines jamais tenues ; son histoire est celle d'Urqub qui promit à son frère le fruit de son palmier étape après étape, puis le cueillit en secret de nuit {cite:noonpost-16943}."
  es: "Proverbio que se dice de las promesas vacías que no se cumplen; su relato es el de Urqub, que prometió a su hermano el fruto de su palmera etapa tras etapa y luego lo cosechó en secreto de noche {cite:noonpost-16943}."
