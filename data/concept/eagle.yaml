  es: "Malik la incluyó entre las aves adiestradas cuya captura es lícita cuando se pronuncia el nombre de Dios al liberarla: el rey del aire en las fuentes árabes y la más noble de las aves rapaces."
  fr: "Malik le comptait parmi les oiseaux dressés dont la capture est licite lorsque le nom de Dieu est prononcé au moment du lâcher — le roi des airs dans les sources arabes et le plus noble des rapaces."
