label:
  ar: "وَشْم"
  en: "Washm (tattooing)"
summary:
  ar: "الوَشْم في اللغة العلامة، ويُطلق أيضاً على ما يظهر من النبات أول نباته، وعلى تغيّر لون الجلد من ضربة أو سقطة. واصطلاحاً: غرز الجلد بإبرة حتى يخرج الدم، ثم يُذرّ عليه نحو نيلة أو كحل ليزرق الأثر أو يخضر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17206} والمستوشمة من يُفعل بها ذلك طلباً لذلك، والواشمة من تَشِم الوجه أو الذراع أو الشفاه أو الصدر أو غيرها من البدن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17206} والوَسْم علامة بالنار أو بالشرط، وهو يختلف عن الوشم في الآلة والحكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17207} ذهب جمهور الفقهاء إلى تحريم الوشم للأحاديث الصحيحة في لعن الواشمة والمستوشمة، وعدّه بعض المالكية والشافعية من الكبائر، وقال بعض متأخري المالكية بالكراهة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17207} واستثنى بعض الفقهاء حالتين: أن يتعيّن الوشم طريقاً للتداوي من مرض، وأن تتزين المرأة به لزوجها بإذنه، ونُسب في ذلك أثر إلى عائشة لم يقف الكتاب على مصدر حديثي له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17207}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17208} واتفق الفقهاء على أن الوشم نجس، لانحباس الدم في موضعه بما ذُرّ عليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17208} واختلفوا في إزالته: الحنفية يكتفون بالغسل ولا يلزم السلخ، لأنه أثر يشق زواله، وتصح الصلاة والإمامة معه؛ والمالكية لا يكلفون صاحبه إزالته بالنار إذا وقع على الوجه الممنوع، بل هو من النجس المعفوّ عنه؛ والشافعية توجب الإزالة ما لم يخف ضرراً يبيح التيمم، فإن خافه لم تجب ولا إثم عليه بعد التوبة، وإن فعله غير بالغ أو مُكرَه فلا تلزمه إزالته؛ والحنابلة يقيسونه على الجرح المخيط بخيط نجس، فلا تجب إزالة النجس مع خوف الضرر، وتجب الإزالة إذا لم يكن ضرر، ومن مات وهو ملزم بإزالته أُزيل عنه إلا إن كانت الإزالة مُثلة به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17208}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17209} وعند الحنفية ما تأخذه الواشمة أجرةً على الوشم المحرّم سحتٌ وحرام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17209}"
  en: "In the lexicon washm is a mark, and the word is also used for the first green growth of a plant and for a change of skin colour from a blow or fall. Technically it is piercing the skin with a needle until blood comes, then rubbing on indigo or kohl so that the mark turns blue or green. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17206} A woman who is tattooed at her own request is the mustawshima, and the tattooer is the washima, who marks the face, arm, lips, chest or any part of the body. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17206} The wasm (branding) is a mark made by fire or by a stipulated sign; it differs from tattooing in its tool and its ruling. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17207} Most jurists hold tattooing forbidden, on sound reports cursing the tattooer and the one tattooed; some later Malikis and Shafi'is count it among the grave sins, and some later Malikis call it disliked. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17207} Some jurists exempt two cases: when tattooing is the only treatment for an illness, and when a wife tattoos herself to adorn herself for her husband with his permission; a report from A'isha on the second point is cited, its hadith source not found by the book. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17207}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17208} The jurists agree that tattooing is impure, because blood is held in the place where the dye was rubbed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17208} They differ on removal: the Hanafis hold that washing suffices and skinning is not required, since the mark is hard to remove, and prayer and leading prayer are valid with it; the Malikis do not require removal by fire when it was done in the forbidden manner, treating it as a pardoned impurity; the Shafi'is require removal unless it risks harm that permits tayammum, and do not require it of a minor or a person forced; the Hanbalis compare it to a wound stitched with impure thread, so removal is not required where removal risks harm, and is required where it does not; a dead person who was bound to remove it is cleaned unless the cleaning would mutilate the body. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17208}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17209} For the Hanafis, the fee a tattooer takes for forbidden tattooing is unlawful gain and forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17209}"
