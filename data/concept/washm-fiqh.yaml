id: concept/washm-fiqh
class: concept
kind: legal
label:
  ar: "وَشْم"
  en: "Washm (tattooing)"
  es: "Lavado (tatuaje)"
  fr: "Washm (tatouage)"
  ur: "واشم ⁦(گودنا)⁩"
  tr: "dövme"
  id: "tato"
summary:
  ar: "الوَشْم في اللغة العلامة، ويُطلق أيضاً على ما يظهر من النبات أول نباته، وعلى تغيّر لون الجلد من ضربة أو سقطة. واصطلاحاً: غرز الجلد بإبرة حتى يخرج الدم، ثم يُذرّ عليه نحو نيلة أو كحل ليزرق الأثر أو يخضر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17206} والمستوشمة من يُفعل بها ذلك طلباً لذلك، والواشمة من تَشِم الوجه أو الذراع أو الشفاه أو الصدر أو غيرها من البدن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17206} والوَسْم علامة بالنار أو بالشرط، وهو يختلف عن الوشم في الآلة والحكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17207} ذهب جمهور الفقهاء إلى تحريم الوشم للأحاديث الصحيحة في لعن الواشمة والمستوشمة، وعدّه بعض المالكية والشافعية من الكبائر، وقال بعض متأخري المالكية بالكراهة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17207} واستثنى بعض الفقهاء حالتين: أن يتعيّن الوشم طريقاً للتداوي من مرض، وأن تتزين المرأة به لزوجها بإذنه، ونُسب في ذلك أثر إلى عائشة لم يقف الكتاب على مصدر حديثي له. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17207}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17208} واتفق الفقهاء على أن الوشم نجس، لانحباس الدم في موضعه بما ذُرّ عليه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17208} واختلفوا في إزالته: الحنفية يكتفون بالغسل ولا يلزم السلخ، لأنه أثر يشق زواله، وتصح الصلاة والإمامة معه؛ والمالكية لا يكلفون صاحبه إزالته بالنار إذا وقع على الوجه الممنوع، بل هو من النجس المعفوّ عنه؛ والشافعية توجب الإزالة ما لم يخف ضرراً يبيح التيمم، فإن خافه لم تجب ولا إثم عليه بعد التوبة، وإن فعله غير بالغ أو مُكرَه فلا تلزمه إزالته؛ والحنابلة يقيسونه على الجرح المخيط بخيط نجس، فلا تجب إزالة النجس مع خوف الضرر، وتجب الإزالة إذا لم يكن ضرر، ومن مات وهو ملزم بإزالته أُزيل عنه إلا إن كانت الإزالة مُثلة به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17208}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17209} وعند الحنفية ما تأخذه الواشمة أجرةً على الوشم المحرّم سحتٌ وحرام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17209}"
  en: "In the lexicon washm is a mark, and the word is also used for the first green growth of a plant and for a change of skin colour from a blow or fall. Technically it is piercing the skin with a needle until blood comes, then rubbing on indigo or kohl so that the mark turns blue or green. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17206} A woman who is tattooed at her own request is the mustawshima, and the tattooer is the washima, who marks the face, arm, lips, chest or any part of the body. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17206} The wasm (branding) is a mark made by fire or by a stipulated sign; it differs from tattooing in its tool and its ruling. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17207} Most jurists hold tattooing forbidden, on sound reports cursing the tattooer and the one tattooed; some later Malikis and Shafi'is count it among the grave sins, and some later Malikis call it disliked. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17207} Some jurists exempt two cases: when tattooing is the only treatment for an illness, and when a wife tattoos herself to adorn herself for her husband with his permission; a report from A'isha on the second point is cited, its hadith source not found by the book. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17207}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17208} The jurists agree that tattooing is impure, because blood is held in the place where the dye was rubbed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17208} They differ on removal: the Hanafis hold that washing suffices and skinning is not required, since the mark is hard to remove, and prayer and leading prayer are valid with it; the Malikis do not require removal by fire when it was done in the forbidden manner, treating it as a pardoned impurity; the Shafi'is require removal unless it risks harm that permits tayammum, and do not require it of a minor or a person forced; the Hanbalis compare it to a wound stitched with impure thread, so removal is not required where removal risks harm, and is required where it does not; a dead person who was bound to remove it is cleaned unless the cleaning would mutilate the body. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17208}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17209} For the Hanafis, the fee a tattooer takes for forbidden tattooing is unlawful gain and forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17209}"
  es: "En el léxico, washm es una marca, y la palabra también se usa para el primer crecimiento verde de una planta y para un cambio de color de la piel por un golpe o caída. Técnicamente es perforar la piel con una aguja hasta que sale sangre, luego frotar índigo o kohl para que la marca se vuelva azul o verde. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17206} Una mujer que se tatúa a petición propia es la mustawshima, y el tatuador es el washima, quien marca la cara, el brazo, los labios, el pecho o cualquier parte del cuerpo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17206} El wasm (marcaje) es una marca hecha con fuego o con un signo estipulado; se diferencia del tatuaje en su herramienta y su regla. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17207} La mayoría de los juristas consideran prohibido el tatuaje, basándose en relatos fidedignos que maldicen al tatuador y al tatuado; algunos malikíes y shafiíes posteriores lo consideran pecado grave, y algunos malikíes posteriores lo califican de desaconsejable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17207} Algunos juristas exceptúan dos casos: cuando el tatuaje es el único tratamiento para una enfermedad, y cuando una esposa se tatúa para adornarse para su marido con su permiso; se cita un relato de Aisha sobre el segundo punto, cuya fuente hadiz no se encuentra en el libro. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17207}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17208} Los juristas coinciden en que el tatuaje es impuro, porque se retiene sangre en el lugar donde se frotó el tinte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17208} Difieren en cuanto a la eliminación: los hanafíes sostienen que basta con lavar y no se requiere desollar, ya que la marca es difícil de eliminar, y la oración y dirigir la oración son válidas con ella; los malikíes no requieren la eliminación por fuego cuando se hizo de la manera prohibida, tratándolo como una impureza perdonada; los shafi'ís requieren la eliminación a menos que corra el riesgo de daño que permita el tayammum, y no la requieren de un menor o una persona forzada; Los hanbalíes lo comparan con una herida suturada con hilo impuro, por lo que no se requiere su eliminación cuando conlleva riesgo de daño, y sí cuando no lo conlleva; a una persona fallecida que estaba obligada a retirarlo se le limpia a menos que la limpieza mutile el cuerpo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17208}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17209} Para los hanafíes, la tarifa que cobra un tatuador por un tatuaje prohibido es ganancia ilícita y está prohibida. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17209}"
  fr: "Dans le lexique, « washm » désigne une marque. Ce terme est également employé pour désigner la première pousse verte d'une plante et un changement de couleur de la peau suite à un choc ou une chute. Techniquement, il s'agit de percer la peau avec une aiguille jusqu'au sang, puis d'appliquer de l'indigo ou du khôl pour que la marque devienne bleue ou verte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17206} Une femme qui se fait tatouer à sa demande est une mustawshima, et le tatoueur est un washima, qui marque le visage, le bras, les lèvres, la poitrine ou toute autre partie du corps. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17206} Le wasm (marquage au fer rouge) est une marque réalisée par le feu ou par un signe stipulé; il diffère du tatouage par son outil et sa réglementation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17207} La plupart des juristes interdisent le tatouage, se basant sur des hadiths authentiques maudissant le tatoueur et la personne tatouée; certains Malikites et Shafi'ites postérieurs le comptent parmi les péchés graves, et certains Malikites postérieurs le considèrent comme déconseillé. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17207} Certains juristes admettent deux exceptions: lorsque le tatouage est le seul traitement d'une maladie, et lorsqu'une femme se tatoue pour orner son mari avec sa permission; un hadith rapporté par Aïcha sur ce dernier point est cité, mais sa source n'est pas mentionnée dans l'ouvrage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17207}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17208} Les juristes s'accordent à dire que le tatouage est impur, car le sang reste présent à l'endroit où la teinture a été appliquée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17208} Leurs avis divergent quant à son effacement: les hanafites estiment que le lavage suffit et que l'ablation de la peau n'est pas nécessaire, car la marque est difficile à enlever et la prière, y compris la direction de la prière, est valide malgré la présence du tatouage; les malikites n'exigent pas l'effacement par le feu lorsque le tatouage a été réalisé de manière illicite, le considérant comme une impureté pardonnée; les chaféites exigent l'effacement sauf s'il présente un risque de préjudice justifiant le tayammum, et ne l'exigent pas pour un mineur ou une personne contrainte. Les Hanbalites comparent le tatouage à une plaie suturée avec un fil impur; son retrait n’est donc pas requis lorsqu’il risque de nuire, et l’est dans le cas contraire. Le corps d’une personne décédée qui était tenue de se faire tatouer est lavé, sauf si le nettoyage risque de le mutiler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17208}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17209} Pour les Hanafites, la rémunération perçue par un tatoueur pour un tatouage interdit constitue un gain illicite et est donc prohibée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17209}"
  ur: "لغت میں واشم ایک نشان ہے، اور یہ لفظ پودے کی پہلی سبز نشوونما اور دھچکے یا گرنے سے جلد کی رنگت کی تبدیلی کے لیے بھی استعمال ہوتا ہے۔ تکنیکی طور پر یہ خون آنے تک جلد کو سوئی سے چھیدتا ہے، پھر انڈگو یا کوہل پر رگڑتا ہے تاکہ نشان نیلے یا سبز ہو جائے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17206} وہ عورت جو اپنی مرضی سے گودوائے وہ مستوشیمہ ہے اور گودنے والی واشیمہ ہے جو چہرے، بازو، ہونٹ، سینے یا جسم کے کسی حصے پر نشان لگاتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17206} وسیم ⁦(برانڈنگ)⁩ ایک نشان ہے جو آگ سے یا مقررہ نشان سے بنایا جاتا ہے۔ یہ اپنے آلے اور اس کے حکم میں ٹیٹو بنانے سے مختلف ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17207} اکثر فقہاء ٹیٹو کو حرام قرار دیتے ہیں، صوتی رپورٹوں میں گودنے والے اور گودنے والے پر لعنت بھیجی جاتی ہے۔ بعد کے بعض مالکی اور شافعی اسے کبیرہ گناہوں میں شمار کرتے ہیں اور بعد کے بعض مالکی اسے ناپسندیدہ کہتے ہیں۔ بعض فقہاء نے دو صورتوں کو مستثنیٰ قرار دیا ہے: جب گودنا کسی بیماری کا واحد علاج ہے، اور جب بیوی اپنے شوہر کے لیے اس کی اجازت سے اپنے آپ کو سجانے کے لیے گودوائے؛ دوسری بات پر عائشہ ا کی ایک روایت نقل کی گئی ہے، اس کا حدیث کا ماخذ کتاب میں نہیں ملتا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17207}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17208} فقہاء کا اتفاق ہے کہ گودنا نجس ہے، کیونکہ خضاب لگانے کی جگہ خون لگا ہوا ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17208} ہٹانے میں ان کا اختلاف ہے: احناف کا خیال ہے کہ دھونے اور کھال اتارنے کی ضرورت نہیں ہے، کیونکہ نشان ہٹانا مشکل ہے، اور اس کے ساتھ نماز اور امامت صحیح ہے۔ مالکیوں کو آگ کے ذریعے ہٹانے کی ضرورت نہیں ہے جب یہ حرام طریقے سے کیا گیا تھا، اسے معافی کی نجاست سمجھ کر؛ شافعیوں کو ہٹانا ضروری ہے الا یہ کہ اس سے تیمم کی اجازت دینے والے نقصان کا خطرہ ہو، اور کسی نابالغ یا مجبور شخص سے اس کی ضرورت نہ ہو۔ حنبلی اس کا موازنہ ناپاک دھاگے سے ٹانکے ہوئے زخم سے کرتے ہیں، لہٰذا جہاں ہٹانے سے نقصان کا خطرہ ہو وہاں ہٹانے کی ضرورت نہیں ہے، اور جہاں ایسا نہ ہو وہاں ضروری ہے۔ ایک مردہ شخص جو اسے ہٹانے کا پابند تھا اسے صاف کیا جاتا ہے جب تک کہ صفائی جسم کو مسخ نہ کرے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17208}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17209} احناف کے نزدیک گودنے والا ٹیٹو کرانے کے لیے جو فیس لیتا ہے وہ ناجائز اور حرام ہے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 ص17209}"
  tr: "Arapçada \"dövme\" kelimesi kelimenin tam anlamıyla işaret veya sembol anlamına gelir. Ayrıca bir bitkinin ilk ortaya çıkışını ve bir darbe veya düşme sonucu cilt rengindeki değişimi de ifade eder. Teknik olarak, kan çıkana kadar deriyi iğneyle delmek ve ardından işareti mavi veya yeşil yapmak için çivit boyası veya sürme gibi bir şey sürmek anlamına gelir. \"Mustavme\", bunu kendi isteğiyle yaptıran kişidir; \"washimah\" ise yüzüne, kollarına, dudaklarına, göğsüne veya vücudunun diğer bölgelerine dövme yaptıran kişidir. İşaretleme ise ateşle veya keserek yapılan bir işarettir ve hem kullanılan yöntem hem de hukuki hüküm bakımından dövmeden farklıdır. Alimlerin çoğunluğu, hem dövme yapanı hem de dövme yaptıranı lanetleyen sahih hadislere dayanarak dövmenin haram olduğuna hükmetmiştir. Bazı Maliki ve Şafiîler bunu büyük bir günah olarak görürken, bazı sonraki Malikiler bunu sadece hoş karşılanmayan bir şey olarak değerlendirmiştir. Bazı âlimler iki durum için istisna getirmişlerdir: dövmenin bir hastalığın tedavisi için gerekli olması ve bir kadının kocasının izniyle onun için dövme yaptırması. Ayşe'ye atfedilen bir ifade bunu desteklemektedir, ancak kitap bunun için bir hadis kaynağı bulamamıştır. Âlimler, dövmenin necis olduğu konusunda hemfikirdir çünkü dövme maddesinin uygulandığı bölgede kan hapsolmaktadır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17208} Çıkarılması konusunda ise farklı görüşler mevcuttur: Hanefiler yıkamayı yeterli görür ve derinin yüzülmesini şart koşmazlar, çünkü çıkarılması zor bir işarettir ve onunla namaz kılmak ve namaz kılmak geçerlidir; Malikiler ise, haram bir şekilde yapılmışsa, sahibinin onu ateşle çıkarmasını şart koşmazlar, aksine bu, mazur görülen bir necisliktir; Şafiîler, kuru abdest almayı gerektiren bir zarar korkusu yoksa dövmenin çıkarılmasını şart koşarlar; dolayısıyla eğer zarar korkusu varsa, çıkarılması gerekmez ve tövbe ettikten sonra günahı kalmaz; ayrıca reşit olmadan veya zorlama altında yaptırmışsa, çıkarılması zorunlu değildir. Hanbeliler ise bunu necis bir iplikle dikilmiş bir yaraya benzetirler; dolayısıyla zarar korkusu varsa necisin çıkarılması gerekmez, zarar yoksa çıkarılması gerekir ve kim dövmeyi çıkarmakla yükümlü iken ölürse, çıkarılması onu sakat bırakmayacaksa dövmesi çıkarılır. Hanefi mezhebine göre, dövmecinin haram dövmeler için aldığı ücret hem helal hem de haramdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17209}"
  id: "Kata \"tato\" dalam bahasa Arab secara harfiah berarti tanda atau lambang. Kata ini juga merujuk pada kemunculan pertama suatu tumbuhan, dan perubahan warna kulit akibat benturan atau jatuh. Secara teknis, tato berarti menusuk kulit dengan jarum hingga berdarah, kemudian mengoleskan sesuatu seperti nila atau kohl untuk membuat tanda tersebut berwarna biru atau hijau. Seorang \"mustawma\" adalah seseorang yang melakukan tato atas permintaannya sendiri, sedangkan seorang \"washimah\" adalah seseorang yang menato wajah, lengan, bibir, dada, atau bagian tubuh lainnya. Penandaan, di sisi lain, adalah tanda yang dibuat dengan api atau dengan cara menggores, dan berbeda dari tato baik dalam metode yang digunakan maupun hukumnya. Mayoritas ulama telah memutuskan bahwa tato dilarang, berdasarkan hadits-hadits sahih yang mengutuk baik orang yang menato maupun orang yang ditato. Sebagian ulama Maliki dan Syafi'i menganggapnya sebagai dosa besar, sementara sebagian ulama Maliki lainnya menganggapnya hanya tidak disukai. Beberapa ulama membuat pengecualian untuk dua kasus: ketika tato diperlukan untuk mengobati penyakit, dan ketika seorang wanita menghiasi dirinya dengan tato untuk suaminya dengan izinnya. Sebuah pernyataan yang dinisbahkan kepada Aisyah mendukung hal ini, tetapi buku ini belum menemukan sumber hadits untuk itu. Para ulama sepakat bahwa tato itu najis karena darah terperangkap di area tempat bahan tato diaplikasikan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17208} Mereka berbeda pendapat mengenai penghapusannya: Mazhab Hanafi merasa cukup dengan mencuci dan tidak mengharuskan menguliti, karena itu adalah tanda yang sulit dihilangkan, dan salat serta memimpin salat tetap sah dengan tato tersebut; Mazhab Maliki tidak mengharuskan pemiliknya untuk menghapusnya dengan api jika terjadi dengan cara yang dilarang, melainkan termasuk najis yang dimaafkan; Mazhab Syafi'i mewajibkan penghapusan tato kecuali jika ia khawatir akan bahaya yang memperbolehkan wudhu kering. Jika ia khawatir, maka penghapusan tidak diwajibkan dan tidak ada dosa baginya setelah bertaubat. Jika ia melakukannya saat belum dewasa atau di bawah paksaan, maka ia tidak wajib menghapusnya. Mazhab Hanbali menyamakannya dengan luka yang dijahit dengan benang najis, sehingga penghapusan najis tidak diwajibkan jika ada kekhawatiran akan bahaya, dan penghapusan diwajibkan jika tidak ada bahaya. Barangsiapa meninggal dunia dalam keadaan wajib menghapusnya, maka najis tersebut dihapus darinya kecuali jika penghapusan tersebut akan menyebabkan kecacatan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17208}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17209} Menurut mazhab Hanafi, apa yang diambil oleh tukang tato sebagai pembayaran untuk tato terlarang adalah halal dan haram. {mengutip:fiqh-mawsua-kuwaitiyya-noor-v3 hal.17209}"
