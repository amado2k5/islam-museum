summary:
  ar: "اسم وضعته إستل ويلان واعتمدته شيلا بلير لقلم مصاحف العصر العباسي المتأخر ذي التباين بين الغليظ والرقيق، ترى أنه تطوير مستقل لخط الكتابة المدور لا فرع من الكوفي {cite:blair-islamic-calligraphy-2006 p. 184}."
  en: "Estelle Whelan's name, adopted by Sheila Blair, for the angular, high-contrast script of later Abbasid-period Qur'an manuscripts, seen as an independent stylisation of everyday round handwriting rather than an offshoot of kufic {cite:blair-islamic-calligraphy-2006 p. 184}."
  ur: "استیل ویلن کا وضع کردہ اور شیلا بلیئر کا اختیار کردہ نام، عباسی دور کے بعد کے مصاحف کے اس قلم کے لیے جس میں موٹے اور باریک کا تضاد ہے؛ اسے کوفی کی شاخ نہیں بلکہ روزمرہ گول تحریر کی مستقل تزئین سمجھا گیا ہے {cite:blair-islamic-calligraphy-2006 p. 184}۔"
