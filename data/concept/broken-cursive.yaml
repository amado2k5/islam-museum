summary:
  ar: "اسم وضعته إستل ويلان واعتمدته شيلا بلير لقلم مصاحف العصر العباسي المتأخر ذي التباين بين الغليظ والرقيق، ترى أنه تطوير مستقل لخط الكتابة المدور لا فرع من الكوفي {cite:blair-islamic-calligraphy-2006 p. 184}."
  en: "Estelle Whelan's name, adopted by Sheila Blair, for the angular, high-contrast script of later Abbasid-period Qur'an manuscripts, seen as an independent stylisation of everyday round handwriting rather than an offshoot of kufic {cite:blair-islamic-calligraphy-2006 p. 184}."
  fr: "Nom proposé par Estelle Whelan et adopté par Sheila Blair pour l’écriture anguleuse à forts contrastes des manuscrits coraniques abbassides tardifs, comprise comme une stylisation autonome de l’écriture ronde quotidienne, non comme une branche du coufique {cite:blair-islamic-calligraphy-2006 p. 184}."
  ur: "استیل ویلن کا وضع کردہ اور شیلا بلیئر کا اختیار کردہ نام، عباسی دور کے بعد کے مصاحف کے اس قلم کے لیے جس میں موٹے اور باریک کا تضاد ہے؛ اسے کوفی کی شاخ نہیں بلکہ روزمرہ گول تحریر کی مستقل تزئین سمجھا گیا ہے {cite:blair-islamic-calligraphy-2006 p. 184}۔"
  es: "Nombre de Estelle Whelan, adoptado por Sheila Blair, para la escritura angular y de alto contraste de los manuscritos coránicos del período abasí tardío, vista como una estilización independiente de la escritura redonda cotidiana en lugar de una ramificación de la escritura cúfica {cite:blair-islamic-calligraphy-2006 p. 184}."
  tr: "Estelle Whelan tarafından ortaya atılan ve Sheila Blair tarafından geç Abbasi dönemi Kur'an kalemi için benimsenen ve kaba ile ince arasında değişen bir isim, Kufic'in bir dalı olmaktan ziyade yuvarlak yazının bağımsız bir gelişimi olarak görülür {cite:Blair-Islamic-calligraphy-2006, s. 184}."
  id: "Nama yang diciptakan oleh Estelle Whelan dan diadopsi oleh Sheila Blair untuk pena Al-Qur'an era Abbasiyah akhir, yang bervariasi antara kasar dan halus, melihatnya sebagai pengembangan independen dari aksara bulat, bukan cabang dari Kufic {cite:Blair-Islamic-calligraphy-2006, hlm. 184}."
