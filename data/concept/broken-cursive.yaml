label:
  ar: "الخط المكسور ⁦(النمط الجديد)⁩"
  en: "Broken cursive (New Style)"
  fr: "Cursive brisée (Nouveau Style)"
  ur: "شکستہ رواں خط ⁦(نیا اسلوب)⁩"
  es: "Cursiva rota (estilo nuevo)"
