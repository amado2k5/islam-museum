class: concept
kind: legal
label:
  ar: "اللِّثام"
  en: "Veil over the mouth (litham), fiqh rulings"
  ur: "لثام (فقہی احکام)"
summary:
  ar: "اللِّثام في اللغة ما على الفم أو الشفة من النقاب، وجمعه لُثُم، والتلثّم شدّ اللثام، والملتَم موضعه وهو الأنف وما حوله؛ ولا يخرج استعمال الفقهاء عن ذلك {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13573}. والقناع ما تتقنع به المرأة من ثوب يغطي رأسها ومحاسنها، والخمار ما تغطي به المرأة رأسها {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13573}."
  en: "Litham, in lexicon, is the veil over the mouth or lip; its plural is lutham, tatallum is wearing it, and malatam is its place, the nose and what surrounds it {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13573}. Qinaʿ is a garment with which a woman covers her head and most of her face, and khimar is what a woman covers her head with {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13573}."
  ur: "لثام لغت میں منہ یا ہونٹ پر ڈالے جانے والے نقاب کو کہتے ہیں، جمع لُثُم ہے، تلثم اسے باندھنا ہے، اور ملتم اس کی جگہ ہے یعنی ناک اور اس کے گرد کا حصہ؛ فقہاء کا استعمال بھی لغوی معنی سے الگ نہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13573}۔ قناع وہ کپڑا ہے جس سے عورت سر اور چہرے کا بڑا حصہ ڈھانپتی ہے، اور خمار وہ ہے جس سے عورت سر ڈھانپتی ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13573}۔"
