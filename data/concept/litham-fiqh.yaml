label:
  ar: "اللِّثام"
  en: "Veil over the mouth (litham), fiqh rulings"
  ur: "لثام ⁦(فقہی احکام)⁩"
  es: "Velo sobre la boca (litham), normas de fiqh"
  fr: "Voile sur la bouche (litham), décisions juridiques (fiqh)"
  tr: "Örtü"
  id: "Veil"
summary:
  ar: "اللِّثام في اللغة ما على الفم أو الشفة من النقاب، وجمعه لُثُم، والتلثّم شدّ اللثام، والملتَم موضعه وهو الأنف وما حوله؛ ولا يخرج استعمال الفقهاء عن ذلك {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13573}. والقناع ما تتقنع به المرأة من ثوب يغطي رأسها ومحاسنها، والخمار ما تغطي به المرأة رأسها {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13573}."
  en: "Litham, in lexicon, is the veil over the mouth or lip; its plural is lutham, tatallum is wearing it, and malatam is its place, the nose and what surrounds it {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13573}. Qinaʿ is a garment with which a woman covers her head and most of her face, and khimar is what a woman covers her head with {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13573}."
  ur: "لثام لغت میں منہ یا ہونٹ پر ڈالے جانے والے نقاب کو کہتے ہیں، جمع لُثُم ہے، تلثم اسے باندھنا ہے، اور ملتم اس کی جگہ ہے یعنی ناک اور اس کے گرد کا حصہ؛ فقہاء کا استعمال بھی لغوی معنی سے الگ نہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13573}۔ قناع وہ کپڑا ہے جس سے عورت سر اور چہرے کا بڑا حصہ ڈھانپتی ہے، اور خمار وہ ہے جس سے عورت سر ڈھانپتی ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13573}۔"
  es: "Litham, en léxico, es el velo sobre la boca o el labio; su plural es lutham, tatallum es llevarlo puesto, y malatam es su lugar, la nariz y lo que la rodea {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13573}. Qinaʿ es una prenda con la que una mujer se cubre la cabeza y la mayor parte del rostro, y khimar es con lo que una mujer se cubre la cabeza {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13573}."
  fr: "Litham, dans le lexique, désigne le voile couvrant la bouche ou les lèvres; son pluriel est lutham, tatallum signifie le porter, et malatam désigne sa place, le nez et ce qui l’entoure {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13573}. Qinaʿ est un vêtement dont une femme se couvre la tête et la majeure partie du visage, et khimar est ce dont une femme se couvre la tête {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13573}."
  tr: "Dilbilimde 'al-litham' ağız veya dudak üzerindeki niqabı, çoğulu 'latham'ı ifade eder ve 'al-tilmam' örtüyü sıkılaştırmak anlamına gelir; 'mualtam' ise burnu ve çevresini ifade eden yeridir; hukukçuların kullanımı bundan sapmaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13573}. Maske, bir kadının başını ve güzelliğini örten giysi olarak giydiği şeydir; khimar ise kadının başını örtmek için kullandığı şeydir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.13573}."
  id: "Dalam linguistik, 'al-litham' merujuk pada niqab di atas mulut atau bibir, jamak 'latham', dan 'al-tilmam' berarti mengencangkan tabir, dan 'mualtam' adalah tempatnya, yaitu hidung dan sekitarnya; penggunaan para ahli hukum tidak menyimpang dari itu {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13573}. Topeng adalah apa yang dikenakan seorang wanita untuk menutupi kepalanya sebagai pakaian yang menutupi kepala dan kecantikannya, dan khimar adalah apa yang digunakan wanita untuk menutupi kepalanya {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.13573}."
