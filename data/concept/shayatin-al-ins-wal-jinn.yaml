id: concept/shayatin-al-ins-wal-jinn
class: concept
kind: term
label:
  ar: الشياطين من الإنس والجن
  en: Evil ones among humans and jinn
  ur: شياطين الإنس والجن
  es: "Seres malignos entre humanos y genios"
  fr: "Les êtres maléfiques parmi les humains et les djinns"
  tr: "Şeytanlar insanlardan ve cinlerden geliyor"
  id: "Iblis berasal dari manusia dan jin"
issue:
  ar: هل في الإنس شياطين كما في الجن، أم أن الشياطين كلهم من الجن وذريته؟
summary:
  ur: ہر نبی کے دشمن انسانوں اور جنوں میں سے جو بخرفہ باتیں الہام کرتے ہیں — بگاڑتا
    غیب وحی کے مقابل۔
  ar: 'الشياطين الذين جعلهم الله أعداء الأنبياء في تفسير الأنعام 112. يذكر رشيد رضا
    قولين: قول عكرمة والسدي بأنهم من الجن وذريته فقط، وقول مجاهد وقتادة والحسن بأن
    من الإنس شياطين كما من الجن، ويرجح ابن جرير الطبري القول الثاني بحديث أبي ذر،
    ويرده رضا قول الأول بآية البقرة 14. وينقل عن ابن عباس أن كل عات متمرد من الجن
    والإنس شيطان. ويرى رضا أن المفسدين من الشياطين هم المترفون والمستكبرون وزعماء
    الباطل، ويطبق ذلك على شياطين السياسة في زمنه.'
  en: 'The devils whom God made enemies of the prophets, as Rida reads them in his
    commentary on al-An''am 112. He reports two views: that of Ikrima and al-Suddi,
    that devils are only from the jinn and their offspring, with none among humans;
    and that of Mujahid, Qatada and al-Hasan, that there are devils among humans as
    well as among the jinn. Ibn Jarir al-Tabari prefers the second view on the basis
    of the hadith of Abu Dharr, and Rida answers the first view with the verse in
    al-Baqara 14. He also reports a saying from Ibn Abbas that every rebellious, defiant
    being among the jinn and humans is a devil. Rida holds that the corrupting devils
    are the wealthy, the arrogant and the leaders of falsehood, and he applies this
    to the devils of politics in his own time.'
  es: "Los demonios a quienes Dios hizo enemigos de los profetas, según la interpretación de Rida en su comentario sobre al-An'am 112. Recopila dos opiniones: la de Ikrima y al-Suddi, que sostiene que los demonios provienen únicamente de los genios y su descendencia, sin que existan entre los humanos; y la de Mujahid, Qatada y al-Hasan, que afirma que existen demonios tanto entre los humanos como entre los genios. Ibn Jarir al-Tabari prefiere la segunda opinión basándose en el hadiz de Abu Dharr, y Rida responde a la primera con el versículo de al-Baqara 14. También cita un dicho de Ibn Abbas según el cual todo ser rebelde y desafiante, tanto entre los genios como entre los humanos, es un demonio. Rida sostiene que los demonios corruptores son los ricos, los arrogantes y los líderes de la falsedad, y aplica este principio a los demonios de la política de su época."
  fr: "Les démons que Dieu a faits ennemis des prophètes, tels que les décrit Rida dans son commentaire d'al-An'am 112, font l'objet de deux avis: celui d'Ikrima et d'al-Suddi, selon lequel les démons proviennent exclusivement des djinns et de leur descendance, et non des humains; et celui de Mujahid, Qatada et al-Hasan, selon lequel il existe des démons aussi bien parmi les humains que parmi les djinns. Ibn Jarir al-Tabari privilégie le second avis, se fondant sur le hadith d'Abu Dharr, tandis que Rida réfute le premier avis par le verset 14 d'al-Baqara. Il rapporte également un hadith d'Ibn Abbas selon lequel tout être rebelle et insolent, parmi les djinns et les humains, est un démon. Rida considère que les démons corrupteurs sont les riches, les arrogants et les instigateurs du mensonge, et il applique cette conception aux démons de la politique de son époque."
  tr: "Tanrı'nın peygamberlere düşman yaptığı şeytanlar Tefsir-An'112'de. Rashid Ridha iki görüşten bahseder: İkrime ve el-Suddi'nin sadece cinler ve onların soyundan geldikleri görüşü ve Mücahid, Katadah ve el-Hasan'ın insanlar arasında cin gibi şeytanlar olduğu görüşü. İbn Cerir el-Taberi, Ebu Zerr'in hadisine dayanan ikinci görüşü desteklerken, Ridha ilk görüşü Bekarah'ın 14. ayetiyle çürütmektedir. İbn Abbas'tan rivayet edilir ki, cinler ve insanlar arasında her isyankar düşman şeytandır. Ridha, şeytanlar arasındaki yozlaştırıcıların zenginler, kibirli ve yalan liderleri olduğuna inanır ve bunu kendi zamanındaki siyaset şeytanlarına uygular."
  id: "Iblis-iblis yang dijadikan musuh Tuhan bagi para nabi dalam Tafsir al-An'am 112. Rashid Ridha menyebutkan dua pendapat: pandangan Ikrimah dan al-Suddi bahwa mereka hanya ada di antara jin dan keturunan mereka, dan pandangan Mujahid, Qatadah, dan al-Hasan bahwa di antara manusia ada iblis seperti jin. Ibn Jarir al-Tabari mendukung pandangan kedua berdasarkan hadis Abu Dharr, sementara Ridha membantah pandangan pertama dengan ayat 14 Al-Baqarah. Dilaporkan dari Ibn Abbas bahwa setiap musuh pemberontak di antara jin dan manusia adalah iblis. Ridha percaya bahwa para perosak di antara iblis adalah orang kaya, sombong, dan pemimpin kebohongan, dan ia menerapkan ini pada iblis politik pada zamannya."
