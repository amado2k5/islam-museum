    summary:
      ar: "ينقل رضا عن عكرمة والسدي أن الشياطين كلهم من ولد إبليس، وأنه ليس في الإنس شياطين، ثم يرد ذلك بآية في سورة البقرة تحكي أن الذين يخلون إلى شياطينهم يقولون إنهم معهم، ويرى أن ذلك دليل على أن للإنس شياطينهم. هذا رد رضا على القول، وليس حكماً من المؤلف لهذا المتن."
