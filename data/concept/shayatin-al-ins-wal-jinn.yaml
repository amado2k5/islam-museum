id: concept/shayatin-al-ins-wal-jinn
class: concept
kind: term
label: { ar: "الشياطين من الإنس والجن", en: "Evil ones among humans and jinn" }
issue:
  ar: "هل في الإنس شياطين كما في الجن، أم أن الشياطين كلهم من الجن وذريته؟"
summary:
  ar: "الشياطين الذين جعلهم الله أعداء الأنبياء في تفسير الأنعام 112. يذكر رشيد رضا قولين: قول عكرمة والسدي بأنهم من الجن وذريته فقط، وقول مجاهد وقتادة والحسن بأن من الإنس شياطين كما من الجن، ويرجح ابن جرير الطبري القول الثاني بحديث أبي ذر، ويرده رضا قول الأول بآية البقرة 14. وينقل عن ابن عباس أن كل عات متمرد من الجن والإنس شيطان. ويرى رضا أن المفسدين من الشياطين هم المترفون والمستكبرون وزعماء الباطل، ويطبق ذلك على شياطين السياسة في زمنه."
  en: "The devils whom God made enemies of the prophets, as Rida reads them in his commentary on al-An'am 112. He reports two views: that of Ikrima and al-Suddi, that devils are only from the jinn and their offspring, with none among humans; and that of Mujahid, Qatada and al-Hasan, that there are devils among humans as well as among the jinn. Ibn Jarir al-Tabari prefers the second view on the basis of the hadith of Abu Dharr, and Rida answers the first view with the verse in al-Baqara 14. He also reports a saying from Ibn Abbas that every rebellious, defiant being among the jinn and humans is a devil. Rida holds that the corrupting devils are the wealthy, the arrogant and the leaders of falsehood, and he applies this to the devils of politics in his own time."
