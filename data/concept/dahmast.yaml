label:
  ar: "دهمست"
  en: "Dahmast (laurel)"
  ur: "دہمست"
  es: "Dahmast (laurel)"
  fr: "Dahmast (laurier)"
  tr: "I on üçüncü"
  id: "I ketiga belas"
summary:
  ar: "شجر الغار، وحبّه يُستعمل، وورقه والحبّ أقوى ما فيه، ثم قشور الأصل. حار في الثالثة يابس في الثانية. جيد لاسترخاء العصب والفالج واللقوة، ومسحوقه معطّس، ينفع من أورام الكبد والطحال وأوجاع القولنج، ويُكمل بذكره في فصل الغين {cite:canon-ibn-sina-print-v1 p.438} {cite:canon-ibn-sina-print-v1 p.439}."
  en: "The laurel tree. Its berry is used; the leaves and berry are the strongest, then the root bark. Hot in the third degree and dry in the second. Good for relaxation of the nerve, paralysis and facial palsy; its powder causes sneezing; helps tumours of the liver and spleen and colic. The book says the rest is given under the letter ghayn {cite:canon-ibn-sina-print-v1 p.438} {cite:canon-ibn-sina-print-v1 p.439}."
  ur: "غار کا درخت، جس کا دانہ استعمال ہوتا ہے؛ پتا اور دانہ سب سے قوی ہیں، پھر جڑ کا چھلکا۔ تیسرے درجے میں گرم اور دوسرے میں خشک۔ عصب کی سستی، فالج اور لقوہ میں مفید؛ اس کا چورا چھینک لاتا ہے؛ جگر اور تلی کی سوجن اور قولنج میں مفید ہے؛ کتاب کہتی ہے کہ باقی بیان حرف غین میں ہے {cite:canon-ibn-sina-print-v1 p.438} {cite:canon-ibn-sina-print-v1 p.439}۔"
  es: "El laurel. Se utiliza su baya; las hojas y la baya son las más fuertes, seguidas de la corteza de la raíz. Caliente en tercer grado y seco en segundo. Bueno para la relajación del nervio, la parálisis y la parálisis facial; su polvo provoca estornudos; ayuda con los tumores de hígado y bazo y los cólicos. El libro dice que el resto se da bajo la letra ghayn {cite:canon-ibn-sina-print-v1 p.438} {cite:canon-ibn-sina-print-v1 p.439}."
  fr: "Le laurier. On utilise ses baies; ce sont les feuilles et les baies qui sont les plus efficaces, puis l’écorce de la racine. Chaud au troisième degré et sec au deuxième. Bon pour détendre les nerfs, en cas de paralysie et de paralysie faciale; sa poudre provoque des éternuements; elle est bénéfique pour les tumeurs du foie et de la rate ainsi que pour les coliques. Le livre indique que le reste est donné sous la lettre ghayn {cite:canon-ibn-sina-print-v1 p.438} {cite:canon-ibn-sina-print-v1 p.439}."
  tr: "Defne kullanılır, yaprakları ve taneleri en güçlü olur, sonra kök soyulur. Üçüncüsü sıcak, ikincisi kurudur. Sinir gevşemesi, felç ve güç için iyidir, tozu hapşırır, karaciğer ve dalak tümörleri ile kolik ağrılar için faydalıdır ve ghayn mevsiminde bahsedilerek tamamlanır {cite:canon-ibn-sina-print-v1 s.438} {cite:canon-ibn-sina-print-v1 s.439}."
  id: "Warna bay digunakan, daun dan biji-bijinya paling kuat, lalu akarnya mengelupas. Panas pada yang ketiga dan kering pada yang kedua. Baik untuk relaksasi saraf, kelumpuhan, dan kekuatan, dan bubuknya bersin, bermanfaat untuk tumor hati dan limpa, serta nyeri kolik, dan diselesaikan dengan menyebutkannya pada musim Ghayn {cite:canon-ibn-sina-print-v1 hlm.438} {cite:canon-ibn-sina-print-v1 hlm.439}."
