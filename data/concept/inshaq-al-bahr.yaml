label:
  ar: فلق البحر
  en: The splitting of the sea
  ur: سمندر کا پھٹنا
summary:
  ar: "ضرب موسى البحر بعصاه فانفلق فكان كل فرق كالطود العظيم، فنجّى الله بني إسرائيل وأغرق فرعون وجنوده — أعظم آية في نجاة قوم من عدوهم بإذن الله."
  en: "Musa struck the sea with his staff and it split, each part like a mighty mountain — God saved the Children of Israel and drowned Pharaoh and his host, the greatest sign of a people's deliverance."
  ur: "موسیٰ نے اپنی لاٹھی سے سمندر کو مارا تو وہ پھٹ گیا اور ہر حصہ بڑے پہاڑ جیسا ہو گیا — اللہ نے بنی اسرائیل کو بچایا اور فرعون اور اس کی فوجوں کو غرق کیا، قوم کی نجات کی سب سے بڑی آیت۔"
