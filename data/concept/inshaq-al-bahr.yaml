id: concept/inshaq-al-bahr
class: concept
kind: belief
label:
  ar: فلق البحر
  en: The splitting of the sea
  ur: سمندر کا پھٹنا
  es: "La división del mar"
  fr: "La séparation de la mer"
  tr: "Denizi ikiye bölmek"
  id: "Memecah laut"
summary:
  ar: "ضرب موسى البحر بعصاه فانفلق فكان كل فرق كالطود العظيم، فنجّى الله بني إسرائيل وأغرق فرعون وجنوده — أعظم آية في نجاة قوم من عدوهم بإذن الله."
  en: "Musa struck the sea with his staff and it split, each part like a mighty mountain — God saved the Children of Israel and drowned Pharaoh and his host, the greatest sign of a people's deliverance."
  ur: "موسیٰ نے اپنی لاٹھی سے سمندر کو مارا تو وہ پھٹ گیا اور ہر حصہ بڑے پہاڑ جیسا ہو گیا — اللہ نے بنی اسرائیل کو بچایا اور فرعون اور اس کی فوجوں کو غرق کیا، قوم کی نجات کی سب سے بڑی آیت۔"
  es: "Musa golpeó el mar con su vara y este se partió, cada parte como una imponente montaña: Dios salvó a los hijos de Israel y ahogó al faraón y a su ejército, la mayor señal de la liberación de un pueblo."
  fr: "Moïse frappa la mer de son bâton et elle se fendit, chaque partie ressemblant à une montagne puissante — Dieu sauva les Enfants d'Israël et noya Pharaon et son armée, signe suprême de la délivrance d'un peuple."
  tr: "Musa denize asasını vurdu, denizler yarıldı ve her parçası büyük bir dağ gibi oldu. Tanrı, İsrailoğullarını kurtardı ve Firavun ile askerlerini boğdu — bu, bir halkın Tanrı'nın izniyle düşmanından kurtuluşunun en büyük işaretidir."
  id: "Musa memukul laut dengan tongkatnya, dan lautnya terbelah, dan setiap bagian seperti gunung besar. Tuhan menyelamatkan anak-anak Israel dan menenggelamkan Firaun beserta tentaranya — tanda terbesar keselamatan suatu bangsa dari musuh mereka dengan izin Tuhan."
