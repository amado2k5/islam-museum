id: concept/canon-mothers-milk-and-first-nursing
class: concept
kind: scientific
label:
  ar: "لبن الأم وأول الإرضاع"
  en: "The mother's milk and the first nursing"
  fr: "Lait maternel et première tétée dans le Canon"
  ur: "ماں کا دودھ اور پہلی بار دودھ پلانا"
  es: "La leche materna y la primera lactancia"
  tr: "Anne sütü ve emzirmeye başlanma"
  id: "ASI dan awal menyusui"
summary:
  ar: "يبدأ ابن سينا الفصل الثاني في تدبير الإرضاع بأن الأولى أن يرضع الطفل بلبن أمه لأنه أشبه الأغذية بما غذي به في الرحم، مع استحباب أن ترضعه في أول الأمر غير أمه حتى يعتدل مزاجها، وأن يلعق عسلاً قبل الرضاع {cite:canon-ibn-sina-print-v1 pp.204-205}."
  en: "Ibn Sina begins chapter 2, on the management of suckling, by saying the baby should nurse from its mother's milk where possible, because it is most like what fed it in the womb, though it is preferred that another woman nurse it first so that the mother's temperament settles, and that it lick honey before nursing {cite:canon-ibn-sina-print-v1 pp.204-205}."
  fr: "Au chapitre 2 de l’allaitement, Ibn Sina préfère si possible le lait maternel, proche de l’aliment intra-utérin, mais une autre femme à la première tétée pour stabiliser le tempérament maternel, avec miel léché au préalable {cite:canon-ibn-sina-print-v1 pp.204-205}."
  es: "Ibn Sina comienza el capítulo 2, sobre el manejo de la lactancia, diciendo que el bebé debe mamar de la leche de su madre siempre que sea posible, porque es lo más parecido a lo que lo alimentó en el útero, aunque es preferible que otra mujer lo amamante primero para que el temperamento de la madre se calme, y que lama miel antes de mamar {cite:canon-ibn-sina-print-v1 pp.204-205}."
  ur: "ابن سینا دودھ پلانے کے انتظام کے بارے میں باب 2 کا آغاز یہ کہتے ہوئے کرتے ہیں کہ جہاں تک ممکن ہو بچے کو اپنی ماں کے دودھ سے دودھ پلایا جائے، کیونکہ یہ سب سے زیادہ ایسا ہی ہے جیسا کہ اسے رحم میں پلایا جاتا ہے، حالانکہ ترجیح یہ ہے کہ دوسری عورت اسے پہلے دودھ پلائے تاکہ ماں کا مزاج ٹھیک ہو جائے، اور یہ کہ دودھ پلانے سے پہلے شہد چاٹے۔ صفحہ 204-205}۔"
  tr: "İbn Sina, emzirme yönetimiyle ilgili ikinci bölüme, çocuğun annesinin sütünü emzirmesinin tercih edildiğini, çünkü annesinin anne rahiminde verilen sütün en benzer yiyeceği olduğunu belirterek başlar. Ayrıca, annesinin mizacını dengelene kadar değiştirmek için önce emzirmesini ve emzirmeden önce bal yalamasını önerir {cite:canon-ibn-sina-print-v1 s.204-205}."
  id: "Ibn Sina memulai bab kedua tentang manajemen menyusui dengan menyatakan bahwa lebih baik anak disusui dengan susu ibunya, karena itu adalah makanan yang paling mirip dengan yang diberikan sejak dalam kandungan. Ia juga menyarankan untuk menyusui terlebih dahulu agar temperamen ibunya berubah hingga temperamennya stabil, dan bahwa ia harus menjilat madu sebelum menyusui {cite:canon-ibn-sina-print-v1 hlm.204-205}."
