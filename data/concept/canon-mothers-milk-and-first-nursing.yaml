label: { ar: "لبن الأم وأول الإرضاع", en: "The mother's milk and the first nursing", ur: "ماں کا دودھ اور پہلی بار دودھ پلانا" }
summary:
  ar: "يبدأ ابن سينا الفصل الثاني في تدبير الإرضاع بأن الأولى أن يرضع الطفل بلبن أمه لأنه أشبه الأغذية بما غذي به في الرحم، مع استحباب أن ترضعه في أول الأمر غير أمه حتى يعتدل مزاجها، وأن يلعق عسلاً قبل الرضاع {cite:canon-ibn-sina-print-v1 pp.204-205}."
  en: "Ibn Sina begins chapter 2, on the management of suckling, by saying the baby should nurse from its mother's milk where possible, because it is most like what fed it in the womb, though it is preferred that another woman nurse it first so that the mother's temperament settles, and that it lick honey before nursing {cite:canon-ibn-sina-print-v1 pp.204-205}."
