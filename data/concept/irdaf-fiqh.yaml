summary:
  ar: "الإرداف مصدر أردف، وأردفه: أركبه خلفه، وهو المعنى نفسه في استعمال الفقهاء. ويجوز إرداف الرجل للرجل، والمرأة للمرأة، إذا لم يؤد إلى فساد أو إثارة شهوة؛ ويجوز إرداف الرجل امرأته والمرأة زوجها، وإرداف الرجل المرأة ذات الرحم المحرم مع أمن الشهوة، وأما إرداف المرأة الأجنبي والرجل الأجنبية فممنوع سدا للذريعة. وإذا أردف المستأجر للدابة غيره دون إذن صاحبها فهلكت بسبب الإرداف ضمن عند الحنفية نصف قيمتها، وعند المالكية والشافعية كلها، وهو الراجح عند الحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2172} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2173}"
  en: "Irdaf is the verbal noun of ardafa, to make someone ride behind oneself, and the jurists use it in the same sense. A man may carry a man, and a woman a woman, if it does not lead to harm or the stirring of desire; a man may carry his wife, and a wife her husband; a man may carry an unlawful female kinswoman when desire is safe. A man carrying a non-mahram woman, or a woman carrying a non-mahram man, is forbidden to block the means to what is unlawful. If a hirer of an animal makes another ride behind him without the owner's permission, and the animal perishes because of the pillion, he is liable for half its value according to the Hanafis, the whole value according to the Malikis and Shafi'is, and the whole value is the preferred view of the Hanbalis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2172} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2173}"
  ur: "ارداف مصدر ہے، اردفہ یعنی اسے اپنے پیچھے سوار کرنا، اور فقہاء کے ہاں یہی معنی ہے۔ مرد کا مرد کو اور عورت کا عورت کو پیچھے سوار کرنا جائز ہے، بشرطیکہ اس سے فساد یا شہوت نہ بھڑکے؛ مرد کا اپنی بیوی کو اور بیوی کا اپنے شوہر کو سوار کرنا جائز ہے؛ محرم رحم عورت کو سوار کرنا شہوت سے محفوظ ہونے کی صورت میں جائز ہے۔ اجنبی عورت کو مرد کا یا اجنبی مرد کو عورت کا سوار کرنا ذریعے کو روکنے کے لیے ممنوع ہے۔ اگر کرائے کی سواری لینے والا مالک کی اجازت کے بغیر کسی اور کو پیچھے بٹھائے اور جانور اسی سے ہلاک ہو جائے تو حنفیہ کے نزدیک آدھی قیمت کا ضامن ہوگا، مالکیہ اور شافعیہ کے نزدیک پوری قیمت کا، اور حنابلہ کے راجح قول میں بھی پوری قیمت کا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2172} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2173}"
