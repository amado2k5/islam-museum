summary:
  ar: "الإرداف مصدر أردف، وأردفه: أركبه خلفه، وهو المعنى نفسه في استعمال الفقهاء. ويجوز إرداف الرجل للرجل، والمرأة للمرأة، إذا لم يؤد إلى فساد أو إثارة شهوة؛ ويجوز إرداف الرجل امرأته والمرأة زوجها، وإرداف الرجل المرأة ذات الرحم المحرم مع أمن الشهوة، وأما إرداف المرأة الأجنبي والرجل الأجنبية فممنوع سدا للذريعة. وإذا أردف المستأجر للدابة غيره دون إذن صاحبها فهلكت بسبب الإرداف ضمن عند الحنفية نصف قيمتها، وعند المالكية والشافعية كلها، وهو الراجح عند الحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2172} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2173}"
  en: "Irdaf is the verbal noun of ardafa, to make someone ride behind oneself, and the jurists use it in the same sense. A man may carry a man, and a woman a woman, if it does not lead to harm or the stirring of desire; a man may carry his wife, and a wife her husband; a man may carry an unlawful female kinswoman when desire is safe. A man carrying a non-mahram woman, or a woman carrying a non-mahram man, is forbidden to block the means to what is unlawful. If a hirer of an animal makes another ride behind him without the owner's permission, and the animal perishes because of the pillion, he is liable for half its value according to the Hanafis, the whole value according to the Malikis and Shafi'is, and the whole value is the preferred view of the Hanbalis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2172} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2173}"
  ur: "ارداف مصدر ہے، اردفہ یعنی اسے اپنے پیچھے سوار کرنا، اور فقہاء کے ہاں یہی معنی ہے۔ مرد کا مرد کو اور عورت کا عورت کو پیچھے سوار کرنا جائز ہے، بشرطیکہ اس سے فساد یا شہوت نہ بھڑکے؛ مرد کا اپنی بیوی کو اور بیوی کا اپنے شوہر کو سوار کرنا جائز ہے؛ محرم رحم عورت کو سوار کرنا شہوت سے محفوظ ہونے کی صورت میں جائز ہے۔ اجنبی عورت کو مرد کا یا اجنبی مرد کو عورت کا سوار کرنا ذریعے کو روکنے کے لیے ممنوع ہے۔ اگر کرائے کی سواری لینے والا مالک کی اجازت کے بغیر کسی اور کو پیچھے بٹھائے اور جانور اسی سے ہلاک ہو جائے تو حنفیہ کے نزدیک آدھی قیمت کا ضامن ہوگا، مالکیہ اور شافعیہ کے نزدیک پوری قیمت کا، اور حنابلہ کے راجح قول میں بھی پوری قیمت کا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2172} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2173}"
  es: "Irdaf es el sustantivo verbal de ardafa, hacer que alguien monte detrás de uno mismo, y los juristas lo usan en el mismo sentido. Un hombre puede llevar a otro hombre, y una mujer a otra, si no causa daño ni despierta el deseo; un hombre puede llevar a su esposa, y una esposa a su marido; un hombre puede llevar a una pariente ilícita cuando el deseo es seguro. Un hombre que lleva a una mujer no mahram, o una mujer que lleva a un hombre no mahram, tiene prohibido bloquear los medios para lo ilícito. Si quien alquila un animal hace que otro monte detrás de él sin el permiso del dueño, y el animal muere a causa del pasajero, es responsable de la mitad de su valor según los Hanafi, del valor total según los Malikis y Shafi'is, y el valor total es la opinión preferida de los Hanbalis. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.2172} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.2173}"
  fr: "Irdaf est le nom verbal d'ardafa, qui signifie faire monter quelqu'un derrière soi, et les juristes l'emploient dans le même sens. Un homme peut transporter un homme, et une femme une femme, si cela ne cause aucun tort ni n'éveille le désir; un homme peut transporter sa femme, et une femme son mari; un homme peut transporter une parente avec laquelle il n'a pas de relation sexuelle illicite, si le désir est sans danger. Il est interdit à un homme de transporter une femme qui n'est pas un mahram, ou à une femme de transporter un homme qui n'est pas un mahram, d'entraver ainsi la réalisation d'un acte illicite. Si le locataire d'un animal fait monter quelqu'un derrière lui sans la permission du propriétaire, et que l'animal périt à cause de ce passager, il est redevable de la moitié de sa valeur selon l'école hanafite, de la totalité selon les écoles malikite et chaféite, et de la totalité selon l'école hanbalite. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2172} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2173}"
  tr: "İrdaf, 'ardaf' kelimesinin fiil isimidir ve 'radafhuhu' onu arkasında sürmek anlamına gelir; bu anlam hukukçuların kullandığı anlamla aynıdır. Bir erkeğin bir erkeği, bir kadının bir kadına gitmesi caizdir, ancak bu bozulmaya veya arzu uyandırılmasına yol açmaz; bir erkeğin karısını, bir kadının kocasına gitmesi, bir erkeğin ise mahram rahmi olan bir kadını takip etmesi caizdir. Mahram olmayan kadın ile mahram olmayan erkeğin reddi durumunda, bahaneyi engellemek yasaktır. Kiracı, sahibinin izni olmadan başka bir hayvana katılırsa, reddeden hayvan Hanefilere göre yarı değeri garanti edilir ve Maliki ile Şafi'lerin birleşimine göre bu görüş Hanbaliler arasında tercih edilen görüştür. {atıf:] fiqh-mawsua-kuwaitiyya-noor-v3 s.2172} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.2173}"
  id: "Irdaf adalah kata benda dari 'ardaf', dan 'radafhuhu' berarti menungganginya di belakangnya, yang merupakan makna yang sama digunakan oleh para ahli hukum. Diperbolehkan bagi seorang pria untuk mengikuti seorang pria, dan seorang wanita kepada seorang wanita, asalkan tidak menimbulkan korupsi atau hasrat; diperbolehkan bagi seorang pria untuk mengikuti istrinya dan seorang wanita kepada suaminya, dan seorang pria mengikuti wanita dengan rahim mahram selama keinginan masih aman. Adapun penolakan antara wanita non-mahram dan pria non-mahram, dilarang menghalangi alasan tersebut. Jika penyewa bergabung dengan hewan lain tanpa izin pemiliknya, hewan tersebut mati karena penolakan menurut Hanafi, setengah nilainya dijamin, dan menurut Malikis dan Shafi'i digabungkan, dan ini adalah pandangan yang lebih disukai oleh Hanbali. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2172} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2173}"
