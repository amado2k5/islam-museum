id: concept/dhurriyya
class: concept
kind: social
label:
  ar: "الذرية"
  en: "Offspring (dhurriyya)"
  ur: "ذریّہ اور اولاد"
  es: "Descendencia (descendencia)"
  fr: "Descendance (descendance)"
  tr: "atomik"
  id: "atomik"
summary:
  ar: "الذرية في القرآن اسم جامع للنسل والأبناء والأحفاد: يدعو بها العباد ربهم «رب هب لي من لدنك ذرية طيبة»، ويمتدح الله بها الأنبياء «ذرية بعضها من بعض»، ويجعلها امتحاناً «إنما أموالكم وأولادكم فتنة»، ويحفظ فيها حكم الوراثة والميراث بين الآباء والبنين والبنات."
  en: "Dhurriyya in the Qur'an is the collective name for descendants — children and children's children: the servants pray for it as 'a goodly offspring', God praises the prophets' line as 'offspring, one of another', and makes it a trial — 'your wealth and your children are but a trial' — while the rules of inheritance order what passes between parents, sons and daughters."
  ur: "قرآن میں ذریّہ اولاد اور اولادِ اولاد کا مجموعی نام ہے: بندے اسے «نیک اولاد» کے دعے میں مانگتے ہیں، اللہ انبیاء کی نسل کو «ایک دوسرے کی اولاد» کہہ کر سراہتا ہے، اسے آزمائش قرار دیتا ہے — «تمہارا مال اور تمہاری اولاد محض آزمائش ہے» — اور میراث کے احکام والدین، بیٹوں اور بیٹیوں کے درمیان وراثت کو ترتیب دیتے ہیں۔"
  es: "En el Corán, Dhurriyya es el nombre colectivo para los descendientes: hijos e hijos de hijos. Los siervos rezan por ello como \"una buena descendencia\", Dios alaba el linaje de los profetas como \"descendencia, unos de otros\", y lo convierte en una prueba: \"vuestra riqueza y vuestros hijos no son sino una prueba\", mientras que las reglas de herencia ordenan lo que pasa entre padres, hijos e hijas."
  fr: "Dans le Coran, le terme Dhurriyya désigne collectivement les descendants — enfants et petits-enfants: les serviteurs prient pour cela en disant « une descendance vertueuse », Dieu loue la lignée des prophètes comme « des descendants les uns des autres », et en fait une épreuve — « vos biens et vos enfants ne sont qu’une épreuve » — tandis que les règles d’héritage régissent ce qui se transmet entre parents, fils et filles."
  tr: "Kur'an'da 'soy', oğullar ve torunlar için toplu bir terimdir: hizmetkarlar Rablerine 'Rabbim, Kendinden iyi nesil ver' diye seslenir ve Allah peygamberleri övgüyle öder, 'birbirlerinden soy olanlar' ve bunu bir sınav haline getirir: 'Servetiniz ve çocuklarınız sadece bir sınavdır,' ve babalar, oğullar ve kızlar arasında miras ve kalıtlık kurallarını korur."
  id: "Dalam Al-Qur'an, 'keturunan' adalah istilah kolektif untuk keturunan, anak laki-laki, dan cucu: hamba memanggil Tuhan mereka, 'Tuhanku, berikanlah aku keturunan yang baik dari-Mu dari-Mu,' dan Allah memuji para nabi dengan istilah itu, 'keturunan satu sama lain,' dan menjadikannya sebuah ujian: 'Kekayaan dan anak-anakmu hanyalah ujian,' dan itu menjaga aturan warisan dan warisan di antara ayah, putra, dan putri."
