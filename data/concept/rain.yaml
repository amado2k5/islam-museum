summary:
  ar: "الغيث الذي يحيي الله به الأرض بعد موتها ويبث فيها من كل دابة، ومثل ما بعث به من الهدى والعلم الأرض الطيبة والأجادب والقيعان صور للناس مع الوحي."
  en: "The rain by which God revives the earth after its death and scatters in it every kind of creature — the likeness of the guidance and knowledge He sends: good soil, hard soil and hollow ground are pictures of people with the revelation."
  ur: "وہ بارش جس سے اللہ مردہ زمین کو زندہ کرتا اور ہر قسم کے جاندار بکھیر دیتا ہے — اس کی بھیجی ہوئی ہدایت اور علم کی مثال: اچھی زمین، بنجر اور نشیب لوگوں کی تصویریں ہیں۔"
