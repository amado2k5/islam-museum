id: concept/al-hikma
class: concept
kind: term
label:
  ar: "الحكمة"
  en: "Wisdom (al-hikma)"
  ur: "حکمت"
summary:
  ar: "يرى الشعراوي أن أصل الحكمة في اللغة لجام الفرس الذي يُضبط به الحصان، وأن وصف الله بالحكيم يعني أنه يضع لكل شيء إطاره وحدوده، وأن الحكمة أن يؤدي كل شيء ما هو مطلوب منه ببراعة {cite:tafsir-sharawi-khawatir-scan p.250}."
  en: "Sha'rawi holds that the root sense of hikma is the bit placed in a horse's mouth to control it, that calling God wise means He sets each thing within its frame and limits, and that wisdom is for each thing to do what is required of it skilfully {cite:tafsir-sharawi-khawatir-scan p.250}."
  ur: "شعراوی کے نزدیک حکمت کے اصل معنی لغت میں گھوڑے کے منہ میں ڈالے جانے والے لوہے کے لجام کے ہیں، اللہ کو حکیم کہنے کا مطلب ہے کہ وہ ہر چیز کو اس کی حد میں رکھتا ہے، اور حکمت یہ ہے کہ ہر چیز اپنا مطلوبہ کام مہارت سے کرے {cite:tafsir-sharawi-khawatir-scan p.250}۔"
