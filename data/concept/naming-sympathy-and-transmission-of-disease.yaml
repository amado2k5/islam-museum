id: concept/naming-sympathy-and-transmission-of-disease
class: concept
kind: scientific
label: { ar: "تسمية الأمراض ومشاركة الأعضاء وانتقال الأمراض عند ابن سينا", en: "The naming of diseases, sympathy between organs and the passing of disease in the Canon", ur: "قانون میں بیماریوں کے نام، اعضا کی شراکت اور بیماریوں کا منتقل ہونا", es: "La denominación de las enfermedades, la simpatía entre los órganos y la transmisión de la enfermedad en el Canon", fr: "La dénomination des maladies, la sympathie entre les organes et la transmission des maladies dans le Canon" }
summary:
  ar: "في الفصل الثامن يختم ابن سينا القول في الأمراض بوجوه التسمية، وبمشاركة الأعضاء، ومراتب الأبدان الست، وانتقال الأمراض بعضها إلى بعض، والأمراض المعدية والموروثة والجنسية {cite:canon-ibn-sina-print-v1 pp.110-111}."
  en: "In the eighth chapter Ibn Sina closes his treatment of diseases with the ways diseases are named, the sympathy of organs, the six ranks of bodies, the passing of diseases one into another, and contagious, inherited and regional diseases {cite:canon-ibn-sina-print-v1 pp.110-111}."
  es: "En el octavo capítulo, Ibn Sina concluye su tratamiento de las enfermedades con las formas en que se nombran las enfermedades, la simpatía de los órganos, los seis rangos del cuerpo, la transmisión de enfermedades de unas a otras y las enfermedades contagiosas, hereditarias y regionales {cite:canon-ibn-sina-print-v1 pp.110-111}."
  fr: "Dans le huitième chapitre, Ibn Sina conclut son traitement des maladies en abordant la manière dont les maladies sont nommées, la sympathie des organes, les six rangs des corps, la transmission des maladies les unes aux autres, et les maladies contagieuses, héréditaires et régionales {cite:canon-ibn-sina-print-v1 pp.110-111}."
  ur: "آٹھویں باب میں ابن سینا بیماریوں کے علاج کو بیماریوں کے نام کے طریقوں سے بند کرتا ہے، اعضاء کی ہمدردی، جسم کے چھ درجے، بیماریوں کا ایک دوسرے میں منتقل ہونا، اور متعدی، وراثتی اور علاقائی بیماریاں۔"
