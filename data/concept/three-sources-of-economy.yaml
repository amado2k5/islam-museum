label: { ar: "موارد الاقتصاد الثلاثة: الرفد والفرض والقرض", en: "Three sources of economic support: voluntary aid, obligatory zakat, and the good loan", ur: "معاشی سہارے کے تین ذرائع: رفد، فرض اور قرض حسن", es: "Tres fuentes de apoyo económico: la ayuda voluntaria, el zakat obligatorio y el buen préstamo.", fr: "Trois sources de soutien économique: l’aide volontaire, la zakat obligatoire et le prêt de bonne volonté", tr: "Ekonominin üç kaynağı: sübvansiyonlar, yükümlülükler ve krediler", id: "Tiga sumber daya ekonomi: subsidi, kewajiban, dan pinjaman" }
summary:
  ar: "يرى الشعراوي أن الإسلام بنى الحركة الاقتصادية على ثلاثة أمور: الرِّفد وهو العطاء التطوعي الخالص، والفرض وهو الزكاة، والقرض الحسن، وأن الإنسان المعدم إذا فقد الأولين فزع إلى القرض، وأن توثيق الدين يحمي حركة المتحرك في الحياة {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1193} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1220} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1221}."
  en: "Sha'rawi holds that Islam built economic life on three things: voluntary aid (rifd), obligatory zakat, and the good loan. A person in need who lacks the first two turns to the loan, and documenting debt protects the one who works and earns {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1193} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1220} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1221}."
  ur: "شعراوی کے نزدیک اسلام نے معاشی زندگی کو تین چیزوں پر قائم کیا: رِفد، یعنی خالص رضاکارانہ عطیہ، فرض یعنی زکوٰۃ، اور قرض حسن۔ محتاج شخص جب پہلے دو سے محروم ہو تو قرض کی طرف جاتا ہے، اور قرض کی دستاویز محنت کرنے والے کے کمائے ہوئے مال کی حفاظت کرتی ہے {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1193} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1220} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1221}۔"
  es: "Sha'rawi sostiene que el Islam construyó la vida económica sobre tres cosas: la ayuda voluntaria (rifd), el zakat obligatorio y el buen préstamo. Una persona necesitada que carece de los dos primeros recurre al préstamo, y documentar la deuda protege a quien trabaja y gana {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1193} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1220} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1221}."
  fr: "Sha'rawi soutient que l'Islam a fondé la vie économique sur trois piliers: l'aide volontaire (rifd), la zakat obligatoire et le prêt de bonne foi. Celui qui est dans le besoin et qui ne dispose pas des deux premiers se tourne vers le prêt, et la documentation des dettes protège celui qui travaille et gagne sa vie. {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1193} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1220} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1221}."
  tr: "El-Şaarawi, İslam'ın ekonomik hareketi üç temel üzerine inşa ettiğine inanır: saf gönüllü bağış olan el-rafd; ferzet görevi olan zekat; ve faizsiz krediler. İhtiyacı olan bir kişi, ilk iki vergiyi kaybederse, borçlarda sıkıntı yaşar. Ayrıca, dinin güçlendirilmesinin kişinin yaşamdaki hareketini koruduğunu düşünür {cite:tafsir-sharawi-khawatir-scan-vol-vol-2 s.1193} {cite:tafsir-sharawi-khawatir-scan-vol-vol-2 s.1220} {cite:tafsir-sharawi-khawatir-scan-vol-vol-2 s.1221}."
  id: "Al-Shaarawi percaya bahwa Islam membangun gerakan ekonomi di atas tiga pilar: al-rafd, yaitu pemberian sukarela murni; kewajiban wajib, yaitu zakat; dan pinjaman tanpa bunga. Seseorang yang membutuhkan, jika kehilangan dua pilar pertama, menjadi tertekan dalam pinjaman. Ia juga percaya bahwa memperkuat agama melindungi pergerakan orang dalam hidup {cite:tafsir-sharawi-khawatir-scan-vol-vol-2 hlm.1193} {cite:tafsir-sharawi-khawatir-scan-scan-vol-2 hlm.1220} {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1221}."
