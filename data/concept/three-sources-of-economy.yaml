id: concept/three-sources-of-economy
class: concept
kind: belief
label: { ar: "موارد الاقتصاد الثلاثة: الرفد والفرض والقرض", en: "Three sources of economic support: voluntary aid, obligatory zakat, and the good loan", ur: "معاشی سہارے کے تین ذرائع: رفد، فرض اور قرض حسن" }
summary:
  ar: "يرى الشعراوي أن الإسلام بنى الحركة الاقتصادية على ثلاثة أمور: الرِّفد وهو العطاء التطوعي الخالص، والفرض وهو الزكاة، والقرض الحسن، وأن الإنسان المعدم إذا فقد الأولين فزع إلى القرض، وأن توثيق الدين يحمي حركة المتحرك في الحياة {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1193} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1220} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1221}."
  en: "Sha'rawi holds that Islam built economic life on three things: voluntary aid (rifd), obligatory zakat, and the good loan. A person in need who lacks the first two turns to the loan, and documenting debt protects the one who works and earns {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1193} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1220} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1221}."
  ur: "شعراوی کے نزدیک اسلام نے معاشی زندگی کو تین چیزوں پر قائم کیا: رِفد، یعنی خالص رضاکارانہ عطیہ، فرض یعنی زکوٰۃ، اور قرض حسن۔ محتاج شخص جب پہلے دو سے محروم ہو تو قرض کی طرف جاتا ہے، اور قرض کی دستاویز محنت کرنے والے کے کمائے ہوئے مال کی حفاظت کرتی ہے {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1193} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1220} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1221}۔"
