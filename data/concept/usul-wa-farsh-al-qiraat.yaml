id: concept/usul-wa-farsh-al-qiraat
class: concept
kind: term
label:
  ar: الأصول والفرش في القراءات
  en: "Usul and farsh: the general rules and the single words of the readings"
  ur: قراءات میں اصول اور فرش
  es: "Usul y farsh: las reglas generales y las palabras individuales de las lecturas"
  fr: "Usul et farsh: les règles générales et les mots isolés des lectures"
summary:
  ar: "يقسم أهل القراءات اختلاف القراء إلى «أصول» تطّرد في أبواب، كالمدّ والإمالة والإدغام والنقل والإبدال والتفخيم والترقيق، و«فرش الحروف» وهو ما يخص كلمات بعينها في السور؛ وقد عدّ ابن الجزري الأصول وجوهاً في أداء اللفظ الواحد {cite:manahil-irfan-sabt p. 181} {cite:nashr-dahman-damascus-1345-v1 p. 713}."
  en: "The scholars of the readings divide the readers' differences into usul, general rules that run through whole chapters, such as lengthening, imala, assimilation, transfer and substitution of the hamza, thickening and thinning, and farsh al-huruf, the variants that belong to particular words in particular suras; Ibn al-Jazari counted the usul as modes of delivering one and the same wording {cite:manahil-irfan-sabt p. 181} {cite:nashr-dahman-damascus-1345-v1 p. 713}."
  ur: "اہلِ قراءات قراء کے اختلاف کو «اصول» میں بانٹتے ہیں، یعنی وہ عمومی قاعدے جو پورے ابواب میں چلتے ہیں جیسے مد، امالہ، ادغام، نقل و ابدال، تفخیم و ترقیق، اور «فرش الحروف» جو مخصوص سورتوں کے مخصوص الفاظ سے متعلق ہے؛ ابن الجزری نے اصول کو ایک ہی لفظ کی ادا کے طریقے گنا {cite:manahil-irfan-sabt p. 181} {cite:nashr-dahman-damascus-1345-v1 p. 713}۔"
  es: "Los estudiosos de las lecturas dividen las diferencias de los lectores en usul, reglas generales que recorren capítulos enteros, como el alargamiento, la imala, la asimilación, la transferencia y la sustitución de la hamza, el engrosamiento y el adelgazamiento, y farsh al-huruf, las variantes que pertenecen a palabras particulares en suras particulares; Ibn al-Jazari contaba los usul como modos de transmitir una misma formulación {cite:manahil-irfan-sabt p. 181} {cite:nashr-dahman-damascus-1345-v1 p. 713}."
  fr: "Les spécialistes des lectures divisent les différences entre les lecteurs en usul, règles générales qui s'appliquent à des chapitres entiers, telles que l'allongement, l'imala, l'assimilation, le transfert et la substitution de la hamza, l'épaississement et l'amincissement, et farsh al-huruf, les variantes qui appartiennent à des mots particuliers dans des sourates particulières; Ibn al-Jazari considérait les usul comme des modes de prononciation d'une même formulation {cite:manahil-irfan-sabt p. 181} {cite:nashr-dahman-damascus-1345-v1 p. 713}."
