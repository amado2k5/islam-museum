class: concept
kind: scientific
label: { ar: "طلوع الكواكب المتحيرة وغروبها بحسب الحاصة", en: "The rising and setting of the wandering planets by their anomaly", ur: "متحیر سیاروں کا طلوع اور غروب خاصہ کے مطابق", es: "El ascenso y la puesta de los planetas errantes según su anomalía.", fr: "Le lever et le coucher des planètes errantes en fonction de leur anomalie", tr: "Gezegenlerin özel bir sisteme göre doğuşu ve batışı.", id: "Terbit dan terbenamnya planet-planet yang bergerak menurut pola khusus." }
summary:
  ar: "إذا كانت حاصة الكوكب من صفر إلى قف فهو في طلوع الندوات، وإذا كانت من قف إلى ما يلي ذلك فهو في غروب المساءات. ويُسمى الطلوع بالندوات عند الصباح، والغروب بالمساءات عند المساء. وهذا باب ثامن وأربعون، يعرف به الطلوع والاختفاء للخمسة المتحيرة. {cite:zij-sabi-nallino-byblion p.180}"
  en: "When the planet's anomaly runs from zero to qaf, 180 degrees, it is in the morning rising, and when it runs from qaf onward it is in the evening setting. The rising is named for the morning and the setting for the evening. This is chapter 48 and gives the rising and the disappearance of the five wandering planets. {cite:zij-sabi-nallino-byblion p.180}"
  ur: "جب سیارے کی خاصہ صفر سے قف یعنی ایک سو اسی درجے تک ہو تو وہ صبحی طلوع ⁦(طلوعِ ندوات)⁩ میں ہوتا ہے، اور قف کے بعد غروبِ مساءات میں۔ طلوع کو صبح اور غروب کو شام کے نام سے موسوم کیا گیا ہے۔ یہ اڑتالیسواں باب ہے، جس سے پانچ متحیر سیاروں کا طلوع اور اختفا معلوم ہوتا ہے۔ {cite:zij-sabi-nallino-byblion p.180}"
  es: "Cuando la anomalía del planeta va de cero a qaf, 180 grados, se trata de la salida matutina, y cuando va de qaf en adelante, se trata de la puesta vespertina. La salida se denomina así por la mañana y la puesta por la tarde. Este es el capítulo 48 y describe la salida y la desaparición de los cinco planetas errantes. {cite:zij-sabi-nallino-byblion p.180}"
  fr: "Lorsque l'anomalie de la planète s'étend de zéro à qaf (180 degrés), elle se lève le matin; lorsqu'elle s'étend au-delà de qaf, elle se couche le soir. Le lever est ainsi nommé pour le matin et le coucher pour le soir. Ce chapitre 48 décrit le lever et la disparition des cinq planètes errantes. {cite:zij-sabi-nallino-byblion p.180}"
  tr: "Eğer gezegenin konumu sıfırdan ötesindeki bir noktaya kadar ise, sabah takımyıldızlarının doğuşundadır; eğer bunun ötesindeki bir noktadan ise, akşam takımyıldızlarının batışındadır. Sabah takımyıldızlarının doğuşuna sabah takımyıldızlarının doğuşu, akşam takımyıldızlarının batışına ise akşam takımyıldızlarının batışı denir. Bu, beş kafa karıştırıcı takımyıldızın doğuş ve batışlarının bilindiği kırk sekizinci bölümdür. {cite:zij-sabi-nallino-byblion s.180}"
  id: "Jika posisi planet berada dari titik nol hingga titik di luarnya, maka planet tersebut berada di gugusan bintang pagi; jika berada dari titik di luarnya, maka planet tersebut berada di gugusan bintang senja. Terbitnya gugusan bintang pagi disebut terbitnya gugusan bintang pagi, dan terbenamnya gugusan bintang senja disebut terbenamnya gugusan bintang senja. Ini adalah bab keempat puluh delapan, yang menjelaskan terbit dan terbenamnya lima gugusan bintang yang membingungkan. {cite:zij-sabi-nallino-byblion p.180}"
