id: concept/al-ahkam-al-taklifiyya
class: concept
kind: legal
label:
  ar: "الأحكام التكليفية الخمسة"
  en: "The five rulings of obligation (al-ahkam al-taklifiyya)"
  ur: "پانچ تکلیفی احکام"
  fr: "Les cinq statuts légaux (al-ahkam al-taklifiyya)"
  es: "Las cinco calificaciones legales (al-ahkam al-taklifiyya)"
summary:
  ar: "الأحكام التكليفية هي الأوصاف الخمسة التي يصف بها الأصوليون والفقهاء كل فعل من أفعال المكلف: الواجب والمندوب والمباح والمكروه والحرام. يبيّن الغزالي وجه القسمة: خطاب الشرع يرد باقتضاء الفعل أو باقتضاء الترك أو بالتخيير، فما اقتضى الفعل مع الإشعار بعقاب على الترك فواجب وإلا فندب، وما اقتضى الترك مع الإشعار بعقاب على الفعل فحظر وإلا فكراهة، وما خُيّر فيه فإباحة {cite:mustasfa-hafiz-v1 p.297}. ويعرّف الشوكاني الواجب بأنه ما يُمدح فاعله ويُذم تاركه، ويقسمه إلى ما على الأعيان وما على الكفاية {cite:irshad-al-fuhul-dar-al-fikr p.8}."
  en: "The taklifi rulings (al-ahkam al-taklifiyya) are the five descriptions that the scholars of legal theory and jurisprudence apply to every act of a person under religious responsibility: the obligatory, the recommended, the permitted, the disliked and the forbidden. Al-Ghazali explains the basis of the division: the address of the Lawgiver comes requiring an act, requiring an abstention, or giving a choice. What requires the act with a warning of punishment for leaving it is the obligatory, otherwise the recommended; what requires abstention with a warning of punishment for the act is prohibition, otherwise dislike; and what is left to choice is permission {cite:mustasfa-hafiz-v1 p.297}. Al-Shawkani defines the obligatory as that for which the doer is praised and the one who leaves it is blamed, and divides it into what is upon individuals and what is upon the community {cite:irshad-al-fuhul-dar-al-fikr p.8}."
  ur: "احکامِ تکلیفیہ وہ پانچ اوصاف ہیں جن سے اصولیین اور فقہاء مکلف کے ہر فعل کو متصف کرتے ہیں: واجب، مندوب، مباح، مکروہ اور حرام۔ غزالی تقسیم کی وجہ بیان کرتے ہیں: شارع کا خطاب فعل کے تقاضے کے ساتھ آتا ہے، یا ترک کے تقاضے کے ساتھ، یا اختیار کے ساتھ۔ جو فعل کا تقاضا کرے اور ترک پر سزا کی خبر دے وہ واجب ہے ورنہ ندب؛ جو ترک کا تقاضا کرے اور فعل پر سزا کی خبر دے وہ حظر ہے ورنہ کراہت؛ اور جس میں اختیار دیا جائے وہ اباحت ہے {cite:mustasfa-hafiz-v1 p.297}۔ شوکانی واجب کی تعریف یوں کرتے ہیں کہ جس کے کرنے والے کی تعریف ہو اور چھوڑنے والے کی مذمت، اور اسے اعیان پر اور کفایہ پر ہونے میں تقسیم کرتے ہیں {cite:irshad-al-fuhul-dar-al-fikr p.8}۔"
  fr: "Les statuts légaux d'obligation (al-ahkam al-taklifiyya) sont les cinq qualifications que les spécialistes des fondements du droit et les juristes appliquent à chaque acte d'une personne astreinte à la responsabilité religieuse : l'obligatoire, le recommandé, le permis, le détestable et l'interdit. Al-Ghazali explique le fondement de la division : le discours du Législateur vient en exigeant l'acte, en exigeant l'abstention, ou en laissant le choix. Ce qui exige l'acte avec l'annonce d'un châtiment pour son abandon est l'obligatoire, sinon le recommandé ; ce qui exige l'abstention avec l'annonce d'un châtiment pour l'acte est l'interdiction, sinon la réprobation ; et ce qui est laissé au choix est la permission {cite:mustasfa-hafiz-v1 p.297}. Al-Shawkani définit l'obligatoire comme ce dont l'auteur est loué et dont celui qui l'abandonne est blâmé, et le divise en ce qui pèse sur les individus et ce qui pèse sur la communauté {cite:irshad-al-fuhul-dar-al-fikr p.8}."
  es: "Las calificaciones legales de obligación (al-ahkam al-taklifiyya) son las cinco descripciones que los especialistas en teoría jurídica y los juristas aplican a cada acto de una persona sujeta a responsabilidad religiosa: lo obligatorio, lo recomendado, lo permitido, lo reprobable y lo prohibido. Al-Ghazali explica el fundamento de la división: el discurso del Legislador viene exigiendo el acto, exigiendo la abstención o dejando elegir. Lo que exige el acto con la advertencia de un castigo por dejarlo es lo obligatorio, y si no, lo recomendado; lo que exige la abstención con la advertencia de un castigo por el acto es la prohibición, y si no, la reprobación; y lo que se deja a elección es la permisión {cite:mustasfa-hafiz-v1 p.297}. Al-Shawkani define lo obligatorio como aquello por lo que se elogia a quien lo hace y se censura a quien lo deja, y lo divide en lo que recae sobre los individuos y lo que recae sobre la comunidad {cite:irshad-al-fuhul-dar-al-fikr p.8}."
