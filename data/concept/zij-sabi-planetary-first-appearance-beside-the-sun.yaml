label: { ar: "أول ظهور الكواكب المتحيرة بعد الشعاع", en: "The first appearance of the wandering planets after the sun's rays", ur: "شعاع کے بعد متحیر سیاروں کا پہلا ظہور" }
summary:
  ar: "أول ظهور زحل والمشتري والمريخ عند الندوات في المشرق هو أول خروجهم من تحت الشعاع بعد أن جاوزتهم الشمس. فيُحسب لأحدهم، فإن كانت حاصته المعدلة تحو قدراً معلوماً يكون قد ظهر صباحاً، وإن كانت تحو قدراً آخر فهو غروبه بالمساءات حين تدركه الشمس فتستره بشعاعها. وتُحسب الأحوال الأربعة للزهرة وعطارد بالمثل. {cite:zij-sabi-nallino-byblion p.181}"
  en: "The first morning appearance of Saturn, Jupiter and Mars in the east is the first time they emerge from the sun's rays after the sun has passed them. For each planet the corrected anomaly is checked: at a stated value the planet has appeared in the morning, and at another value it sets in the evening, when the Sun overtakes it and hides it with its rays. Venus and Mercury are reckoned in the same way for their four cases. {cite:zij-sabi-nallino-byblion p.181}"
  ur: "زحل، مشتری اور مریخ کا مشرق میں صبحی پہلا ظہور وہ پہلا لمحہ ہے جب سورج ان سے آگے نکلنے کے بعد وہ شعاع سے باہر آتے ہیں۔ ہر سیارے کی تصحیح شدہ خاصہ دیکھی جاتی ہے: ایک متعین قیمت پر سیارہ صبح ظاہر ہو چکا ہوتا ہے، اور دوسری قیمت پر وہ شعاع میں داخل ہوتے وقت مغرب میں شام کو غائب ہوتا ہے۔ زہرہ اور عطارد کے چار احوال بھی اسی طرح شمار ہوتے ہیں۔ {cite:zij-sabi-nallino-byblion p.181}"
