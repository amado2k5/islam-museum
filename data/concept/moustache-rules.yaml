label:
  ar: "الشَّارِب"
  en: "Shaarib (the moustache) and the rules on it"
summary:
  ar: "الشارب في اللغة اسم فاعل من شرب، ويطلق على الشعر الذي يسيل على الفم، والجمع شوارب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9889} ويجب غسل الشارب مع الوجه في الوضوء، ويعم بالماء في الغسل من الجنابة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9891} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9892} والأخذ من الشارب من الفطرة عند الحديث الصحيح، وهو سنة عند الفقهاء، والمذاهب تختلف بين القص والحلق والإحفاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9893} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9894} وفي الإحرام تحرم إزالته، وفي الميت خلاف، والجناية عليه فيها حكومة عدل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9896} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9897} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9898}"
  en: "The shaarib is, in language, the active participle of drink, and the term also names the hair that flows over the mouth; its plural is shawarib. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9889} The moustache is washed with the face in ablution and every hair and skin of it is covered with water in the bath of major impurity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9891} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9892} Trimming it is part of the fitra by sound report, and a sunna for the jurists; the schools differ between cutting, shaving and close trimming. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9893} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9894} Removing it is forbidden to a pilgrim in the state of consecration; for the dead the jurists differ, and injury to it carries a just assessment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9896} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9897} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9898}"
