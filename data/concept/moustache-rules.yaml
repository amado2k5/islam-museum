id: concept/moustache-rules
class: concept
kind: legal
label:
  ar: "الشَّارِب"
  en: "Shaarib (the moustache) and the rules on it"
  es: "Shaarib (el bigote) y las reglas al respecto"
  fr: "Shaarib (la moustache) et les règles qui s'y rapportent"
  ur: "شریب ⁦(مونچھیں)⁩ اور اس کے احکام"
summary:
  ar: "الشارب في اللغة اسم فاعل من شرب، ويطلق على الشعر الذي يسيل على الفم، والجمع شوارب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9889} ويجب غسل الشارب مع الوجه في الوضوء، ويعم بالماء في الغسل من الجنابة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9891} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9892} والأخذ من الشارب من الفطرة عند الحديث الصحيح، وهو سنة عند الفقهاء، والمذاهب تختلف بين القص والحلق والإحفاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9893} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9894} وفي الإحرام تحرم إزالته، وفي الميت خلاف، والجناية عليه فيها حكومة عدل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9896} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9897} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9898}"
  en: "The shaarib is, in language, the active participle of drink, and the term also names the hair that flows over the mouth; its plural is shawarib. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9889} The moustache is washed with the face in ablution and every hair and skin of it is covered with water in the bath of major impurity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9891} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9892} Trimming it is part of the fitra by sound report, and a sunna for the jurists; the schools differ between cutting, shaving and close trimming. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9893} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9894} Removing it is forbidden to a pilgrim in the state of consecration; for the dead the jurists differ, and injury to it carries a just assessment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9896} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9897} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9898}"
  es: "El shaarib es, en el lenguaje, el participio activo de beber, y el término también nombra el vello que cae sobre la boca; su plural es shawarib. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9889} El bigote se lava con la cara en la ablución y cada pelo y piel del mismo se cubre con agua en el baño de impureza mayor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9891} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9892} Recortarlo es parte de la fitra según informes fiables, y una sunna para los juristas; las escuelas difieren entre cortar, afeitar y recortar al ras. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9893} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9894} Está prohibido quitárselo a un peregrino en estado de consagración; En cuanto a los muertos, los juristas difieren, y su daño conlleva una evaluación justa. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.9896} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.9897} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.9898}"
  fr: "Le terme « shaarib » est, en langue kuwaitiyya, le participe actif du verbe « boire », et désigne également les poils qui recouvrent la bouche; son pluriel est « shawarib ». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9889} La moustache est lavée avec le visage lors des ablutions et chaque poil et chaque partie de la peau sont recouverts d'eau dans le bain de purification majeure. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9891} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9892} La tailler fait partie de la fitra, selon un hadith authentique, et est une sunna pour les juristes; les écoles divergent quant à la méthode de coupe: tailler, raser ou tailler court. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9893} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9894} L'enlever est interdit à un pèlerin en état de consécration; pour les morts, les juristes diffèrent, et le préjudice qui leur est causé entraîne une juste évaluation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9896} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9897} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9898}"
  ur: "شریعت، زبان میں، مشروب کا فعال حصہ ہے، اور یہ اصطلاح ان بالوں کو بھی کہتے ہیں جو منہ پر بہتے ہیں۔ اس کی جمع شباب ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 ص9889} وضو میں مونچھوں کو چہرے کے ساتھ دھویا جاتا ہے اور اس کے ہر بال اور جلد کو غسل کے پانی سے ڈھانپ دیا جاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.9891} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9892} اسے تراشنا صحیح رپورٹ کے لحاظ سے فطرہ کا حصہ ہے اور فقہاء کے لیے سنت ہے۔ اسکولوں میں کاٹنے، مونڈنے اور قریبی تراشنے کے درمیان فرق ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.9893} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9894} حرمت کی حالت میں حاجی کے لیے اسے ہٹانا حرام ہے۔ مردہ کے لیے فقہاء کا اختلاف ہے، اور اس کی چوٹ کا جائز اندازہ ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9896} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9897}"
