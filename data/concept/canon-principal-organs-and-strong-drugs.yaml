id: concept/canon-principal-organs-and-strong-drugs
class: concept
kind: scientific
label:
  ar: "الأعضاء الرئيسة والأدوية القوية عند ابن سينا"
  en: "The principal organs and strong drugs in the Canon"
  fr: "Organes principaux et remèdes puissants dans le Canon"
  ur: "رئیس اعضا اور قوی دوائیں قانون میں"
  es: "Los principales órganos y drogas fuertes en el Canon"
summary:
  ar: "يقرر ابن سينا أن قوة العضو تراعى من جهة الرياسة، فلا يخاطر على الأعضاء الرئيسة بالأدوية القوية ما أمكن لئلا يعم البدن الضرر، فلا يستفرغ من الدماغ والكبد ما يحتاج استفراغه دفعة واحدة ولا يبردان تبريداً شديداً، وأولى الأعضاء بهذه المراعاة القلب {cite:canon-ibn-sina-print-v1 pp.269-270}."
  en: "Ibn Sina holds that the strength of an organ is considered through its rank: strong drugs are not risked on the principal organs where it can be avoided, lest harm spread to the whole body, so the brain and liver are not emptied of all they need to lose at one stroke nor chilled hard, and the heart most deserves this care {cite:canon-ibn-sina-print-v1 pp.269-270}."
  fr: "Ibn Sina apprécie la force organique selon le rang : éviter si possible les remèdes forts aux principaux, le dommage pouvant gagner le corps ; cerveau et foie ne seraient ni vidés d’un coup ni fortement refroidis, le cœur méritant plus encore cette prudence {cite:canon-ibn-sina-print-v1 pp.269-270}."
  es: "Ibn Sina sostiene que la fortaleza de un órgano se considera a través de su rango: no se deben arriesgar los medicamentos fuertes en los órganos principales donde se puede evitar, para que el daño no se extienda a todo el cuerpo, por lo que el cerebro y el hígado no se vacían de todo lo que necesitan perder de un golpe ni se enfrían bruscamente, y el corazón es el que más merece este cuidado {cite:canon-ibn-sina-print-v1 pp.269-270}."
  ur: "ابن سینا کا خیال ہے کہ کسی عضو کی مضبوطی کو اس کے درجے سے سمجھا جاتا ہے: مضبوط دوائیوں کو بنیادی اعضاء پر خطرہ نہیں ہے جہاں اس سے بچا جا سکتا ہے، ایسا نہ ہو کہ نقصان پورے جسم میں پھیل جائے، اس لیے دماغ اور جگر ان تمام چیزوں سے خالی نہیں ہوتے جو انہیں ایک ہی جھٹکے سے کھونے کی ضرورت ہوتی ہے اور نہ ہی سخت ٹھنڈا ہوتا ہے، اور دل اس کی دیکھ بھال کا سب سے زیادہ مستحق ہے۔ صفحہ 269-270}۔"
