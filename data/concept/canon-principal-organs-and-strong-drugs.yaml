label: { ar: "الأعضاء الرئيسة والأدوية القوية عند ابن سينا", en: "The principal organs and strong drugs in the Canon", ur: "رئیس اعضا اور قوی دوائیں قانون میں" }
summary:
  ar: "يقرر ابن سينا أن قوة العضو تراعى من جهة الرياسة، فلا يخاطر على الأعضاء الرئيسة بالأدوية القوية ما أمكن لئلا يعم البدن الضرر، فلا يستفرغ من الدماغ والكبد ما يحتاج استفراغه دفعة واحدة ولا يبردان تبريداً شديداً، وأولى الأعضاء بهذه المراعاة القلب {cite:canon-ibn-sina-print-v1 pp.269-270}."
  en: "Ibn Sina holds that the strength of an organ is considered through its rank: strong drugs are not risked on the principal organs where it can be avoided, lest harm spread to the whole body, so the brain and liver are not emptied of all they need to lose at one stroke nor chilled hard, and the heart most deserves this care {cite:canon-ibn-sina-print-v1 pp.269-270}."
