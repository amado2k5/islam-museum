label:
  ar: "إيرسا"
  en: "Irsa (iris root)"
  ur: "ایرسا ⁦(زنبق کی جڑ)⁩"
summary:
  ar: "إيرسا أصل السوسن الأسمانجوني؛ مسخّن ملطّف منضج منقٍّ، ينفع من الأورام والقروح الوسخة والصداع المزمن والسعال والاستسقاء، ويذكر الكتاب فيه إدرار الطمث، وهذا ما ورد فيه لا توصية به {cite:canon-ibn-sina-print-v1 p.364} {cite:canon-ibn-sina-print-v1 p.365}."
  en: "Irsa is the root of the purple iris: warming, thinning, ripening and cleansing. It helps swellings, filthy ulcers, long headache, cough and dropsy. The book also says it brings on menses; this is the book's listing, not a recommendation {cite:canon-ibn-sina-print-v1 p.364} {cite:canon-ibn-sina-print-v1 p.365}."
  ur: "ایرسا بنفشی زنبق کی جڑ ہے؛ گرم کرنے، لطیف کرنے، پکانے اور صاف کرنے والی ہے۔ یہ سوجن، گندے زخم، پرانے سر درد، کھانسی اور استسقا میں مفید ہے۔ کتاب میں لکھا ہے کہ یہ حیض جاری کرتی ہے؛ یہ کتاب کی فہرست ہے، کوئی سفارش نہیں {cite:canon-ibn-sina-print-v1 p.364} {cite:canon-ibn-sina-print-v1 p.365}۔"
