summary:
  ar: "الرماد في الكتاب كله جلاء مجفف وإن اختلف، والغسل يقلل جلاءه، وأقواه ماء رماد التين، ورماد الخشب القابض كالبلوط يحبس الدم، وينفع ماء رماد التين من القروح الخبيئة والعميقة ويأكل اللحم الزائد، وماء رماد البلوط يشد اللثة، ويذكر الكتاب رماد العظاية للجرب والقوابي نقلا عن جزء حيواني {cite:canon-ibn-sina-print-v1 pp.665-666}"
  en: "Ramad is in the book all of it cleansing and drying though the kinds differ, and washing lessens its cleansing; the strongest is the ash-water of the fig; the ash of astringent wood such as the oak stops blood; the ash-water of the fig benefits hidden and deep ulcers and eats away excess flesh, and the ash-water of the oak firms the gums; and the book gives, as a report on an animal part, the ash of the lizard for scab and ringworm {cite:canon-ibn-sina-print-v1 pp.665-666}"
  ur: "رماد کتاب میں سارا جلاء اور خشک کرنے والا ہے اگرچہ قسمیں مختلف ہیں، اور دھونے سے اس کا جلاء کم ہوتا ہے؛ سب سے قوی انجیر کی راکھ کا پانی ہے؛ قابض لکڑی کی راکھ جیسے بلوط کی راکھ خون روکتی ہے؛ انجیر کی راکھ کا پانی پوشیدہ اور گہرے قرحوں میں نافع ہے اور زائد گوشت کو کھا جاتا ہے، اور بلوط کی راکھ کا پانی مسوڑھوں کو مضبوط کرتا ہے؛ اور کتاب حیوانی جزو کی ایک روایت کے طور پر چھپکلی کی راکھ کو خارش اور دانوں کے لیے ذکر کرتی ہے {cite:canon-ibn-sina-print-v1 pp.665-666}۔"
  es: "En el libro, Ramad se describe como un remedio para la limpieza y el secado, aunque los tipos varían y el lavado disminuye su eficacia; el agua de ceniza de higuera es la más potente; la ceniza de madera astringente como la del roble detiene el sangrado; el agua de ceniza de higuera beneficia las úlceras profundas y ocultas y elimina el exceso de carne, y el agua de ceniza de roble fortalece las encías; y el libro menciona, como parte de un animal, la ceniza de lagarto para la sarna y la tiña {cite:canon-ibn-sina-print-v1 pp.665-666}."
  fr: "Le livre mentionne toutes les préparations de Ramad, purifiantes et asséchantes, bien que leur nature diffère, et le lavage en diminue l'efficacité; la plus puissante est l'eau de cendre de figuier; la cendre de bois astringent comme le chêne arrête le sang; l'eau de cendre de figuier est bénéfique pour les ulcères profonds et cachés et élimine l'excès de chair, et l'eau de cendre de chêne fortifie les gencives; et le livre donne, à propos d'une partie animale, la cendre de lézard contre la gale et la teigne {cite:canon-ibn-sina-print-v1 pp.665-666}"
  tr: "Kitaptaki küller kurumuş giderlerdir, ancak aralarında farklılıklar vardır. Yıkama küllerin çıkarılmasını azaltır, en güçlüsü ise incir külü suyu ve meşe gibi büzücü odun külü kanı tutmaktadır. İncir külü suyu gizli ve derin yaralara yardımcı olur ve fazla eti yer. Meşe külü suyu diş etlerini sıkılaştırır. Kitapta uyuz ve kawabi küllerinden bahsedilir, hayvan bölümünden alıntı yapılır {cite:canon-ibn-sina-print-v1 s.665-666}"
  id: "Abu dalam seluruh buku adalah saluran kering, meskipun ada perbedaan. Mencuci mengurangi penghilangannya, sementara yang terkuat adalah air abu ara, dan abu kayu astringen seperti kayu ek mengunci darah. Air abu ara membantu dengan luka tersembunyi dan dalam serta memakan daging berlebih. Air abu ek mengencangkan gusi. Buku ini menyebutkan abu kudis dan qawabi, mengutip bagian hewan {cite:canon-ibn-sina-print-v1 hlm.665-666}"
