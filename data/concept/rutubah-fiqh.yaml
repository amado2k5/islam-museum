id: concept/rutubah-fiqh
class: concept
kind: legal
label:
  ar: "الرطوبة"
  en: "Rutuba (moisture): whether the moisture of a woman's private part, of a beast and of a contact with an impurity is pure, and its effects on cleaning with stones and on wet semen"
  ur: "رطوبت"
summary:
  ar: "الرطوبة في اللغة النداوة وهي خلاف اليابس، ويفرق الحنابلة بين الرطوبة والبلل في الحكم بالنجاسة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8784} وذهب أبو حنيفة والحنابلة إلى طهارة رطوبة فرج المرأة، وذهب المالكية وأبو يوسف ومحمد إلى نجاستها، وقسمها الشافعية إلى ثلاثة أقسام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8784} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8785} وذهب الجمهور إلى طهارة رطوبة فرج الحيوان الطاهر، وخص المالكية ذلك بالمباح الأكل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8785} وذهب الحنفية والمالكية إلى أن ملاقي رطوبة النجاسة لا ينجس في الأصح، وذهب الشافعية والحنابلة إلى النجاسة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8785} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8786} ويشترط في الاستجمار أن يكون المحل جافا، ويختلف حكم المني الرطب عن اليابس، فيغسل الرطب ويُفرك اليابس عند الحنفية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8786}"
  en: "Rutuba is dampness, the opposite of dryness; the Hanbalis distinguish moisture from wetness in ruling on impurity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8784} Abu Hanifa and the Hanbalis hold a woman's private moisture pure, while the Malikis, Abu Yusuf and Muhammad hold it impure; the Shafi'is divide it into three kinds. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8784} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8785} The majority hold the moisture of a pure animal's private part pure, and the Malikis limit this to animals that may be eaten. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8785} The Hanafis and Malikis hold that what touches a moist impurity does not become impure, in the sounder view, while the Shafi'is and Hanbalis hold it impure. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8785} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8786} Cleaning with stones requires a dry surface, and wet semen is washed while dry semen is rubbed off, according to the Hanafis and Hanbalis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8786}"
  ur: "رطوبت نمی ہے؛ عورت کی شرمگاہ کی رطوبت کی طہارت میں فقہاء کا اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8784} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8785}"
