id: concept/rutubah-fiqh
class: concept
kind: legal
label:
  ar: "الرطوبة"
  en: "Rutuba (moisture): whether the moisture of a woman's private part, of a beast and of a contact with an impurity is pure, and its effects on cleaning with stones and on wet semen"
  ur: "رطوبت"
  es: "Rutuba (humedad): si la humedad de la parte íntima de una mujer, de un animal y del contacto con una impureza es pura, y sus efectos en la limpieza con piedras y en el semen húmedo."
  fr: "Rutuba (humidité): la pureté de l'humidité des parties intimes d'une femme, d'une bête et du contact avec une impureté, et ses effets sur le nettoyage par les pierres et sur le sperme humide."
  tr: "Nem"
  id: "Kelembapan"
summary:
  ar: "الرطوبة في اللغة النداوة وهي خلاف اليابس، ويفرق الحنابلة بين الرطوبة والبلل في الحكم بالنجاسة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8784} وذهب أبو حنيفة والحنابلة إلى طهارة رطوبة فرج المرأة، وذهب المالكية وأبو يوسف ومحمد إلى نجاستها، وقسمها الشافعية إلى ثلاثة أقسام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8784} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8785} وذهب الجمهور إلى طهارة رطوبة فرج الحيوان الطاهر، وخص المالكية ذلك بالمباح الأكل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8785} وذهب الحنفية والمالكية إلى أن ملاقي رطوبة النجاسة لا ينجس في الأصح، وذهب الشافعية والحنابلة إلى النجاسة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8785} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8786} ويشترط في الاستجمار أن يكون المحل جافا، ويختلف حكم المني الرطب عن اليابس، فيغسل الرطب ويُفرك اليابس عند الحنفية والحنابلة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8786}"
  en: "Rutuba is dampness, the opposite of dryness; the Hanbalis distinguish moisture from wetness in ruling on impurity. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8784} Abu Hanifa and the Hanbalis hold a woman's private moisture pure, while the Malikis, Abu Yusuf and Muhammad hold it impure; the Shafi'is divide it into three kinds. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8784} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8785} The majority hold the moisture of a pure animal's private part pure, and the Malikis limit this to animals that may be eaten. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8785} The Hanafis and Malikis hold that what touches a moist impurity does not become impure, in the sounder view, while the Shafi'is and Hanbalis hold it impure. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8785} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8786} Cleaning with stones requires a dry surface, and wet semen is washed while dry semen is rubbed off, according to the Hanafis and Hanbalis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8786}"
  ur: "رطوبت نمی ہے؛ عورت کی شرمگاہ کی رطوبت کی طہارت میں فقہاء کا اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8784} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8785}"
  es: "Rutuba es humedad, lo opuesto a sequedad; los hanbalíes distinguen la humedad de la humedad al dictaminar sobre la impureza. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8784} Abu Hanifa y los hanbalíes consideran pura la humedad privada de una mujer, mientras que los malikíes, Abu Yusuf y Muhammad la consideran impura; los shafi'íes la dividen en tres tipos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8784} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8785} La mayoría considera pura la humedad de la parte privada de un animal puro, y los malikíes limitan esto a los animales que pueden ser comidos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8785} Los hanafíes y malikíes sostienen que lo que toca una impureza húmeda no se vuelve impuro, en la opinión más sólida, mientras que los shafiíes y hanbalíes lo consideran impuro. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8785} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8786} La limpieza con piedras requiere una superficie seca, y el semen húmedo se lava mientras que el semen seco se frota, según los hanafíes y hanbalíes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8786}"
  fr: "Rutuba désigne l'humidité, l'opposé de la sécheresse; les Hanbalites distinguent l'humidité de la salive pour statuer sur l'impureté. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8784} Abou Hanifa et les Hanbalites considèrent l'humidité intime d'une femme comme pure, tandis que les Malikites, Abou Yusuf et Muhammad la considèrent comme impure; les Chafi'ites la divisent en trois catégories. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8784} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8785} La majorité considère l'humidité intime d'un animal pur comme pure, et les Malikites limitent cette définition aux animaux destinés à la consommation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8785} Les hanafites et les malikites considèrent que ce qui touche une impureté humide ne devient pas impur, selon l'avis le plus juste, tandis que les chaféites et les hanbalites le considèrent comme impur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8785} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8786} Le nettoyage avec des pierres nécessite une surface sèche, et le sperme humide est lavé tandis que le sperme sec est frotté, selon les hanafites et les hanbalites. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8786}"
  tr: "Dilde nem 'nadawa' olarak adlandırılır, bu 'kuru'nun tam tersidir ve Hanbaliler kirlilik üzerinde hüküm verirken nem ile ıslaklığı ayırırlar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8784} Ebu Hanifa ve Hanbalılar, kadının özel bölgelerindeki nemin saf olduğunu savunurken, Malikiler, Ebu Yusuf ve Muhammed bunu kirli bulmuş, Şafiiler ise bunu üç kategoriye ayırmıştır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8784} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8785} Çoğunluk, saf bir hayvanın özel bölgelerinin ıslaklığının saf olduğunu savunurken, Malikiler bunu sadece izin verilen yeme ile sınırlardı. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8785} Hanafi ve Malikiler, kirlenmeden dolayı nemle karşılaşanların en doğru görüşe göre kirli olmadığını, Şafi'ler ve Hanbalilerin ise onu kirli saydığını savunur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8785} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8786} İstijmar için yerin kuru olması gerekir. Islak meni hakkındaki hüküm, kuru meniden farklıdır; taze meni Hanafi ve Hanbali'ye göre yıkanır ve kuru ovulur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8786}"
  id: "Dalam bahasa ini, kelembapan disebut 'nadawa', yang merupakan kebalikan dari 'kering', dan Hanbal membedakan antara kelembapan dan kelembapan dalam memerintah ketidakmurnian. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8784} Abu Hanifa dan Hanbalis berpendapat bahwa kelembapan bagian pribadi wanita adalah murni, sementara Maliki, Abu Yusuf, dan Muhammad menganggapnya tidak murni, dan para Shafi'i membaginya menjadi tiga kategori. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8784} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8785} Mayoritas berpendapat bahwa kelembapan bagian pribadi hewan murni adalah murni, dan Malikis membatasi ini hanya pada makan yang diperbolehkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8785} Hanafi dan Malik berpendapat bahwa mereka yang mengalami kelembapan akibat kotoran tidak menjadi tidak murni menurut pandangan paling benar, sementara Shafi'i dan Hanbal menganggapnya tidak murni. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8785} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8786} Bagi istijmar, tempat tersebut harus kering. Aturan tentang air mani basah berbeda dengan sperma kering; sperma segar dicuci dan sperma kering digosok sesuai Hanafi dan Hanbali. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8786}"
