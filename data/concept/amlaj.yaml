summary:
  ar: "الأملج في الكتاب معروف، ومرّباه أضعف من الهليلج المربّى، وإذا أُنقع في اللبن سُمّي شير أملج؛ حكى الكتاب فيه أقوالاً في طبعه ورأى أن الحق أنه يابس قليل البرد؛ يطفئ حرارة الدم، ويقوّي أصل الشعر ويسوّده، وينفع العصب والمفاصل جداً، ويقوّي العين والقلب والمعدة، ويسكّن العطش والقيء ويشهّي الطعام، وينفع من البواسير؛ ويذكر الكتاب فيه قولاً عن الباه في فقرة موسومة معلّقة لحكم المؤسس {cite:canon-ibn-sina-print-v1 pp.353-354}"
  en: "In the book amlaj is well known, its preserve weaker than preserved myrobalan, and steeped in milk it is called shir amlaj; the book gives several statements on its temperament and thinks the truth is that it is dry with a little cold; it quenches the heat of the blood, strengthens the root of the hair and darkens it, helps the nerve and joints greatly, strengthens the eye, heart and stomach, soothes thirst and vomiting, whets the appetite and helps piles; the book also gives a statement on desire in a labelled section held for the founder's ruling {cite:canon-ibn-sina-print-v1 pp.353-354}"
  fr: "Dans le livre, l’amlaj est bien connu, sa confiture plus faible que le myrobolan confit, et macéré dans du lait on l’appelle shir amlaj ; le livre donne plusieurs avis sur son tempérament et estime que la vérité est qu’il est sec avec un peu de froid ; il éteint la chaleur du sang, fortifie la racine des cheveux et les noircit, aide beaucoup le nerf et les articulations, fortifie l’œil, le cœur et l’estomac, apaise la soif et les vomissements, aiguise l’appétit et soulage les hémorroïdes ; le livre donne aussi un avis sur le désir dans une section signalée, en attente de la décision du fondateur {cite:canon-ibn-sina-print-v1 pp.353-354}"
  ur: "املج کتاب میں معروف ہے، اس کا مربہ ہلیلے کے مربے سے کمزور ہے، اور دودھ میں بھگویا جائے تو شیر املج کہلاتا ہے؛ کتاب اس کے مزاج کے بارے میں کئی اقوال دیتی ہے اور سمجھتی ہے کہ حق یہ ہے کہ یہ خشک اور تھوڑا سرد ہے؛ خون کی گرمی بجھاتا ہے، بالوں کی جڑ کو قوت دیتا اور کالا کرتا ہے، اعصاب اور جوڑوں میں بہت مفید ہے، آنکھ، دل اور معدے کو قوت دیتا ہے، پیاس اور قے کو تسکین دیتا اور بھوک بڑھاتا ہے اور بواسیر میں مفید ہے؛ کتاب باہ کے بارے میں ایک بات موسوم حصے میں دیتی ہے جو بانی کے فیصلے کے لیے موقوف ہے {cite:canon-ibn-sina-print-v1 pp.353-354}۔"
  es: "En el libro se menciona el amlaj, cuya conservación es más débil que la del mirobalán conservado, y que, macerado en leche, se denomina shir amlaj. El libro ofrece varias afirmaciones sobre su temperamento y considera que, en realidad, es seco con un ligero efecto frío. Calma el calor de la sangre, fortalece la raíz del cabello y lo oscurece, beneficia enormemente los nervios y las articulaciones, fortalece la vista, el corazón y el estómago, alivia la sed y los vómitos, estimula el apetito y ayuda con las hemorroides. El libro también incluye una declaración sobre el deseo en una sección específica reservada para la decisión del fundador {cite:canon-ibn-sina-print-v1 pp.353-354}."
  tr: "Kitaptaki mulaj iyi bilinir ve reçeli kurutulmuş alalajdan daha zayıftır. Sütte bekletildiğinde 'shir' mulaj olarak adlandırılır. Kitap, doğası hakkında görüşler anlatır ve kuru ve hafif soğuk olduğunu; kan ısısını söndürdüğünü, saç köklerini güçlendirdiğini ve koyulaştırdığını, sinirleri ve eklemleri büyük ölçüde iyileştirdiğini, gözleri, kalbi ve mideyi güçlendirdiğini, susuzluk ve kusmayı giderdiğini, yemeği iştah açıcı hale getirdiğini ve hemoroidlere yardımcı olduğunu düşünür. Kitapta 'Kurucu'nun Kuralını Asmak' başlıklı bölümde bah hakkında bir söz geçer {cite:canon-ibn-sina-print-v1 s.353-354}"
  id: "Kitaptaki mulaj iyi bilinir ve reçeli kurutulmuş alalajdan daha zayıftır. Sütte bekletildiğinde 'shir' mulaj olarak adlandırılır. Kitap, doğası hakkında görüşler anlatır ve kuru ve hafif soğuk olduğunu; kan ısısını söndürdüğünü, saç köklerini güçlendirdiğini ve koyulaştırdığını, sinirleri ve eklemleri büyük ölçüde iyileştirdiğini, gözleri, kalbi ve mideyi güçlendirdiğini, susuzluk ve kusmayı giderdiğini, yemeği iştah açıcı hale getirdiğini ve hemoroidlere yardımcı olduğunu düşünür. Kitapta 'Kurucu'nun Kuralını Asmak' başlıklı bölümde bah hakkında bir söz geçer {cite:canon-ibn-sina-print-v1 s.353-354}"
