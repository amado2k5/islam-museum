summary:
  ar: "الإرجاف في اللغة الاضطراب الشديد، ويطلق على الخوض في الأخبار السيئة وذكر الفتن لما ينشأ عنه من اضطراب بين الناس، وفي استعمال الفقهاء التماس الفتنة وإشاعة الكذب والباطل للاغتمام به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2161}"
  en: "Irjaf in the lexicon is violent agitation; it is also used for dwelling on bad news and mentioning strife, because it causes agitation among people. In the usage of the jurists it is seeking strife and spreading lies and falsehood to cause distress. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2161}"
  ur: "ارجاف لغت میں شدید اضطراب ہے، اور بری خبروں میں گھسنے اور فتنوں کا ذکر کرنے کو بھی کہتے ہیں، کیونکہ اس سے لوگوں میں اضطراب پیدا ہوتا ہے۔ فقہاء کے استعمال میں فتنہ ڈھونڈنا، اور جھوٹ اور باطل کو پھیلانا تاکہ لوگ غمزدہ ہوں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2161}"
