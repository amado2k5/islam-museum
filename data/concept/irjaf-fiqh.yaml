label:
  ar: "إرجاف"
  en: "Irjaf (spreading alarm)"
  ur: "ارجاف ⁦(خوف و اضطراب پھیلانا)⁩"
  es: "Irjaf (difundiendo la alarma)"
  fr: "Irjaf (semant l'alarme)"
  tr: "Titreşim"
  id: "Getaran"
summary:
  ar: "الإرجاف في اللغة الاضطراب الشديد، ويطلق على الخوض في الأخبار السيئة وذكر الفتن لما ينشأ عنه من اضطراب بين الناس، وفي استعمال الفقهاء التماس الفتنة وإشاعة الكذب والباطل للاغتمام به. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2161}"
  en: "Irjaf in the lexicon is violent agitation; it is also used for dwelling on bad news and mentioning strife, because it causes agitation among people. In the usage of the jurists it is seeking strife and spreading lies and falsehood to cause distress. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2161}"
  ur: "ارجاف لغت میں شدید اضطراب ہے، اور بری خبروں میں گھسنے اور فتنوں کا ذکر کرنے کو بھی کہتے ہیں، کیونکہ اس سے لوگوں میں اضطراب پیدا ہوتا ہے۔ فقہاء کے استعمال میں فتنہ ڈھونڈنا، اور جھوٹ اور باطل کو پھیلانا تاکہ لوگ غمزدہ ہوں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2161}"
  es: "Irjaf, en el léxico, significa agitación violenta; también se usa para referirse a insistir en malas noticias y mencionar conflictos, ya que provoca agitación entre la gente. En el uso de los juristas, significa buscar conflictos y difundir mentiras y falsedades para causar angustia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2161}"
  fr: "Dans le lexique, « irjaf » désigne une agitation violente; ce terme est également employé pour s’attarder sur les mauvaises nouvelles et évoquer les conflits, car cela provoque l’agitation parmi la population. Du point de vue des juristes, il signifie rechercher la discorde et répandre des mensonges et des contrevérités pour semer la détresse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2161}"
  tr: "Dilsel terimlerle 'irjaf', kötü haberlere dalmayı ve insanların arasında yarattığı kargaşa nedeniyle sınavlardan bahsetmeyi ifade eden şiddetli kargaşa anlamına gelir. Hukukçuların kullanımında, anlaşmazlık aramak ve yalanlar ile yalan yayarak avantaj elde etmek anlamına gelir. {kaynak:fiqh-mawsua-kuwaitiyya-noor-v3 s.2161}"
  id: "Dalam istilah linguistik, 'irjaf' berarti gejolak berat, merujuk pada menyelami berita buruk dan menyebutkan persidangan akibat kekacauan yang ditimbulkannya di antara masyarakat. Dalam penggunaan para ahli hukum, istilah ini merujuk pada mencari perselisihan dan menyebarkan kebohongan serta kebohongan untuk mendapatkan keuntungan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.2161}"
