label:
  ar: الأمر والنهي والاستطاعة
  en: Command, prohibition and capacity
  fr: "Ordre, interdiction et capacité"
  es: "Mando, prohibición y capacidad"
  ur: "حکم، ممانعت اور صلاحیت"
summary:
  ar: "وجوب امتثال النهي بالاجتناب، وامتثال الأمر بقدر الاستطاعة؛ في حديث أبي هريرة «ما نهيتكم عنه فاجتنبوه وما أمرتكم به فائتوا منه ما استطعتم»، وسببه عند ابن رجب سؤال السائل حين فرض الحج «أكل عام؟» حتى قالها ثلاثاً فقال «لو قلت نعم لوجبت ولما استطعتم»؛ ويستنبط ابن رجب من الحديث النهي عن السؤال عما لا يحتاج إليه، وعن السؤال تعنتاً وعبثاً واستهزاءً، وعن السؤال عما أخفاه الله عن عباده، وعن مسائل الحلال والحرام مما يخشى أن يجر السؤال إلى التشديد، ويذكر أن الرخصة في المسائل كانت للأعراب والوفود دون المقيمين بالمدينة؛ وفي حديث أبي سعيد الخدري — الرابع والثلاثون — مراتب تغيير المنكر الثلاث باليد ثم اللسان ثم القلب بحسب الاستطاعة وذلك أضعف الإيمان، ويؤيده حديث ابن مسعود أن من جاهد الخلوف الذين يقولون ما لا يفعلون بيده فمؤمن وبلسانه فمؤمن وبقلبه فمؤمن وليس وراء ذلك من الإيمان حبة خردل ⁦(ص 218–222، 698–699)⁩."
  en: "The duty of complying with prohibitions by avoidance, and with commands according to one's capacity; in Abu Hurayra's hadith 'what I forbid you, avoid, and what I command you, do of it what you can' — its occasion, per Ibn Rajab, being the questioner who asked when hajj was imposed 'every year?' until he said it three times and was told 'had I said yes it would have been obligatory and you could not have managed'; Ibn Rajab derives from it the prohibition of asking about what is not needed, of asking out of obstinacy, frivolity or mockery, of asking about what God has hidden from His servants, and of questions on the lawful and unlawful that might draw stricter rulings, noting that licence to ask was for bedouins and delegations, not the residents of Medina; and in Abu Sa'id al-Khudri's hadith — the thirty-fourth — the three grades of changing evil by hand, then tongue, then heart, according to capacity, that being the weakest of faith, corroborated by Ibn Masud's report that whoever struggles against the successors who say what they do not do with hand, tongue or heart is a believer, and beyond the heart there is not a mustard-seed of faith (pp. 218–222, 698–699)."
  fr: "Le devoir de se conformer aux interdictions en s’en écartant, et aux ordres selon sa capacité ; dans le hadith d’Abu Hurayra, « ce que je vous interdis, évitez-le, et ce que je vous ordonne, faites-en ce que vous pouvez » — son occasion, selon Ibn Rajab, étant le questionneur qui demanda, lorsque le hajj fut imposé, « chaque année ? » jusqu’à le dire trois fois et à qui il fut répondu « si j’avais dit oui, cela serait devenu obligatoire et vous n’auriez pas pu y parvenir » ; Ibn Rajab en tire l’interdiction de questionner sur ce dont on n’a pas besoin, de questionner par obstination, par frivolité ou par moquerie, de questionner sur ce que Dieu a caché à Ses serviteurs, et de poser sur le licite et l’illicite des questions susceptibles d’attirer des jugements plus sévères, notant que la licence de questionner était accordée aux Bédouins et aux délégations, non aux habitants de Médine ; et dans le hadith d’Abu Sa’id al-Khudri — le trente-quatrième — les trois degrés du changement du mal par la main, puis la langue, puis le cœur, selon la capacité, ce dernier étant le plus faible de la foi, corroboré par le récit d’Ibn Mas’ud selon lequel quiconque lutte contre les successeurs qui disent ce qu’ils ne font pas, par la main, la langue ou le cœur, est croyant, et au-delà du cœur il n’y a pas un grain de moutarde de foi (pp. 218–222, 698–699)."
  es: "El deber de cumplir con las prohibiciones mediante la evitación y con los mandamientos según la capacidad de cada uno; en el hadiz de Abu Hurayra: \"lo que os prohíbo, evitadlo, y lo que os mando, haced de ello lo que podáis\" —su ocasión, según Ibn Rajab, fue el interrogador que preguntó cuándo se impuso el hajj \"cada año?\" hasta que lo dijo tres veces y se le dijo: \"si hubiera dicho que sí, habría sido obligatorio y no habrías podido hacerlo\"; Ibn Rajab deriva de ello la prohibición de preguntar sobre lo que no es necesario, de preguntar por obstinación, frivolidad o burla, de preguntar sobre lo que Dios ha ocultado a Sus siervos, y de preguntas sobre lo lícito e ilícito que podrían generar normas más estrictas, señalando que la licencia para preguntar era para los beduinos y las delegaciones, no para los residentes de Medina; y en el hadiz de Abu Sa'id al-Khudri —el trigésimo cuarto— los tres grados de cambiar el mal por medio de la mano, luego la lengua y luego el corazón, según la capacidad, siendo esta la más débil de fe, corroborado por el informe de Ibn Masud de que quien lucha contra los sucesores que dicen lo que no hacen con la mano, la lengua o el corazón es un creyente, y más allá del corazón no hay ni una semilla de mostaza de fe (pp. 218-222, 698-699)."
  ur: "ممنوعات سے اجتناب اور اپنی استطاعت کے مطابق احکام کی تعمیل کا فرض؛ ابوہریرہ کی حدیث میں ہے کہ 'جس چیز سے میں تمہیں روکوں، اس سے بچو، اور جس چیز کا حکم دوں، اس پر عمل کرو جو تم کر سکتے ہو' - اس کا موقع ابن رجب کے مطابق، ایک سوال کرنے والے نے پوچھا کہ 'ہر سال حج کب فرض کیا گیا؟' یہاں تک کہ اس نے اسے تین بار کہا اور کہا گیا کہ اگر میں ہاں کہتا تو واجب ہو جاتا اور آپ اس کا انتظام نہیں کر سکتے تھے۔ ابن رجب نے اس سے یہ اخذ کیا ہے کہ جس چیز کی ضرورت نہیں ہے اس کے بارے میں پوچھنے کی، ہٹ دھرمی، لغزش یا استہزاء سے پوچھنا، اللہ تعالیٰ نے اپنے بندوں سے کیا چھپا رکھا ہے، اس کے بارے میں پوچھنا، اور ان حلال و حرام کے بارے میں سوال کرنا جن سے سخت احکام مل سکتے ہیں، یہ بتاتے ہیں کہ سوال کرنے کا جواز مدینہ کے باشندوں اور وفود کے لیے نہیں تھا۔ اور ابو سعید خدری کی حدیث میں ہے - ہاتھ سے بدی کو بدلنے کے تین درجے، پھر زبان، پھر دل، استطاعت کے مطابق، کہ ایمان کا کمزور ترین ہونا، ابن مسعود کی اس روایت سے ثابت ہے کہ جو شخص ان جانشینوں کے خلاف لڑے جو کہتے ہیں کہ ہاتھ، زبان اور دل سے ایمان نہیں ہے، دل کا ایمان نہیں ہونا چاہیے۔ ⁦(صفحہ 218-222، 698-699)⁩۔"
