label:
  ar: الأمر والنهي والاستطاعة
  en: Command, prohibition and capacity
summary:
  ar: "وجوب امتثال النهي بالاجتناب، وامتثال الأمر بقدر الاستطاعة؛ في حديث أبي هريرة «ما نهيتكم عنه فاجتنبوه وما أمرتكم به فائتوا منه ما استطعتم»، وسببه عند ابن رجب سؤال السائل حين فرض الحج «أكل عام؟» حتى قالها ثلاثاً فقال «لو قلت نعم لوجبت ولما استطعتم»؛ ويستنبط ابن رجب من الحديث النهي عن السؤال عما لا يحتاج إليه، وعن السؤال تعنتاً وعبثاً واستهزاءً، وعن السؤال عما أخفاه الله عن عباده، وعن مسائل الحلال والحرام مما يخشى أن يجر السؤال إلى التشديد، ويذكر أن الرخصة في المسائل كانت للأعراب والوفود دون المقيمين بالمدينة."
  en: "The duty of complying with prohibitions by avoidance, and with commands according to one's capacity; in Abu Hurayra's hadith 'what I forbid you, avoid, and what I command you, do of it what you can' — its occasion, per Ibn Rajab, being the questioner who asked when hajj was imposed 'every year?' until he said it three times and was told 'had I said yes it would have been obligatory and you could not have managed'; Ibn Rajab derives from it the prohibition of asking about what is not needed, of asking out of obstinacy, frivolity or mockery, of asking about what God has hidden from His servants, and of questions on the lawful and unlawful that might draw stricter rulings, noting that licence to ask was for bedouins and delegations, not the residents of Medina."
