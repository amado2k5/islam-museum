label:
  ar: الأمر والنهي والاستطاعة
  en: Command, prohibition and capacity
summary:
  ar: "وجوب امتثال النهي بالاجتناب، وامتثال الأمر بقدر الاستطاعة؛ في حديث أبي هريرة «ما نهيتكم عنه فاجتنبوه وما أمرتكم به فائتوا منه ما استطعتم»، وسببه عند ابن رجب سؤال السائل حين فرض الحج «أكل عام؟» حتى قالها ثلاثاً فقال «لو قلت نعم لوجبت ولما استطعتم»؛ ويستنبط ابن رجب من الحديث النهي عن السؤال عما لا يحتاج إليه، وعن السؤال تعنتاً وعبثاً واستهزاءً، وعن السؤال عما أخفاه الله عن عباده، وعن مسائل الحلال والحرام مما يخشى أن يجر السؤال إلى التشديد، ويذكر أن الرخصة في المسائل كانت للأعراب والوفود دون المقيمين بالمدينة؛ وفي حديث أبي سعيد الخدري — الرابع والثلاثون — مراتب تغيير المنكر الثلاث باليد ثم اللسان ثم القلب بحسب الاستطاعة وذلك أضعف الإيمان، ويؤيده حديث ابن مسعود أن من جاهد الخلوف الذين يقولون ما لا يفعلون بيده فمؤمن وبلسانه فمؤمن وبقلبه فمؤمن وليس وراء ذلك من الإيمان حبة خردل (ص 218–222، 698–699)."
  en: "The duty of complying with prohibitions by avoidance, and with commands according to one's capacity; in Abu Hurayra's hadith 'what I forbid you, avoid, and what I command you, do of it what you can' — its occasion, per Ibn Rajab, being the questioner who asked when hajj was imposed 'every year?' until he said it three times and was told 'had I said yes it would have been obligatory and you could not have managed'; Ibn Rajab derives from it the prohibition of asking about what is not needed, of asking out of obstinacy, frivolity or mockery, of asking about what God has hidden from His servants, and of questions on the lawful and unlawful that might draw stricter rulings, noting that licence to ask was for bedouins and delegations, not the residents of Medina; and in Abu Sa'id al-Khudri's hadith — the thirty-fourth — the three grades of changing evil by hand, then tongue, then heart, according to capacity, that being the weakest of faith, corroborated by Ibn Masud's report that whoever struggles against the successors who say what they do not do with hand, tongue or heart is a believer, and beyond the heart there is not a mustard-seed of faith (pp. 218–222, 698–699)."
