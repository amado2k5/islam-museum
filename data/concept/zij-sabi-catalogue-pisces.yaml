id: concept/zij-sabi-catalogue-pisces
class: concept
kind: natural
label:
  ar: "السمكتان"
  en: "Pisces (the Two Fishes)"
  ur: "دو مچھلیاں"
  es: "Piscis (los dos peces)"
  fr: "Poissons (les Deux Poissons)"
summary:
  ar: "تُسمّى الصورة السمكتان، وهما الحوتان اللذان يعبّر عنهما اللاتينية بعبارة duo pisces. تُعدّ كواكبها في فم السمكة الأمامية أو الجنوبية، ثم الرأس والظهر والبطن والذيل. لا تُنقل المواضع. {cite:nallino-albatenii-opus-astronomicum pp.166}"
  en: "The figure is as-Samakatan, the two fishes, in the Latin heading duo pisces. Its stars are listed at the mouth of the front fish, which the Latin also calls the southern one, and then the head, back, belly and tail. Positions are not transcribed here. {cite:nallino-albatenii-opus-astronomicum pp.166}"
  ur: "صورت کا نام السمکتان ہے، یعنی دو مچھلیاں، جنھیں لاطینی متن duo pisces کہتا ہے۔ اس کے ستارے اگلی مچھلی کے منہ سے شروع ہو کر سر، پشت، پیٹ اور دم تک گنے گئے ہیں۔ مواضع یہاں نقل نہیں ہوئے۔ {cite:nallino-albatenii-opus-astronomicum pp.166}"
  es: "La figura es as-Samakatan, los dos peces, en la denominación latina duo pisces. Sus estrellas se enumeran en la boca del pez delantero, al que el latín también llama el del sur, y luego en la cabeza, el dorso, el vientre y la cola. Las posiciones no se transcriben aquí. {cite:nallino-albatenii-opus-astronomicum pp.166}"
  fr: "La figure représente les deux poissons (as-Samakatan), selon le terme latin « duo pisces ». Les étoiles sont listées à la bouche du poisson de devant, également appelé « poisson du sud » en latin, puis à la tête, au dos, au ventre et à la queue. Les positions ne sont pas transcrites ici. {cite:nallino-albatenii-opus-astronomicum pp.166}"
