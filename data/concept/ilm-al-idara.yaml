label:
  ar: "علم الإدارة"
  en: "The science of management"
  ur: "علم انتظامیہ"
summary:
  ar: "علم الإدارة كما يعرضه طارق السويدان في دورة «الإدارة العملية»: علم بشري قديم قِدَم البشرية، يقسّمه إلى أربعة أجزاء: العمليات الإدارية (تخطيط وتنظيم وتوجيه ورقابة)، والوظائف الإدارية، والمهارات الإدارية، والاتجاهات الحديثة التي أضافها هو."
  en: "Management as a science, as presented in Tareq al-Suwaidan's Practical Administration course: a human discipline as old as humanity, which he divides into four parts — administrative operations (planning, organising, directing, controlling), administrative functions, administrative skills, and the modern trends he added."
  ur: "علم انتظامیہ، جیسا کہ طارق السویدان کے «عملی انتظامیہ» کورس میں آتا ہے: انسانیت جتنا قدیم علم، جسے وہ چار حصوں میں تقسیم کرتا ہے — انتظامی عملیات (منصوبہ بندی، تنظیم، ہدایت، نگرانی)، انتظامی افعال، انتظامی مہارتیں، اور وہ جدید رجحانات جو اس نے خود شامل کیے۔"
