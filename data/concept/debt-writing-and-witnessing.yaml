perspectives:
  - tradition: sunni
    id: sunni-sharawi-women-two-for-one-social-reason
    stance: { ar: "تُقام شهادة امرأتين مقام رجل لأن المرأة أقل احتكاكاً بالمعاملات، وهي علة اجتماعية يعللها الشعراوي", en: "Two women stand in for one man because women are less involved in dealings; Sha'rawi gives this as a social reason", ur: "ایک مرد کی جگہ دو عورتیں اس لیے کہ عورت معاملات سے کم واسطہ رکھتی ہے؛ شعراوی اسے سماجی علت کے طور پر بیان کرتے ہیں" }
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يرى الشعراوي أن الجمع بين امرأتين ورجل في الشهادة على الدين مبني على أن المرأة بعيدة غالباً عن الاحتكاك بالمعاملات، فتذكر إحداهما الأخرى إن ضلت، ويعرض ذلك دون أن ينسبه إلى أحد {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1216} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1217}."
      en: "Sha'rawi holds that pairing two women with a man in witnessing a debt rests on the fact that women are generally less involved in dealings, so one may remind the other if she errs. He gives this without naming any other scholar {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1216} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1217}."
      ur: "شعراوی کے نزدیک قرض پر گواہی میں ایک مرد کے ساتھ دو عورتوں کو ملانے کی بنیاد یہ ہے کہ عورت عموماً معاملات سے دور رہتی ہے، اس لیے اگر ایک بھول جائے تو دوسری یاد دلا سکے۔ وہ یہ بات کسی اور عالم کے نام کے بغیر بیان کرتے ہیں {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1216} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1217}۔"
