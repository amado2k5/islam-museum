id: concept/debt-writing-and-witnessing
class: concept
kind: belief
label: { ar: "كتابة الدين والإشهاد عليه", en: "Writing down debts and calling witnesses", ur: "قرض لکھنا اور گواہی" }
summary:
  ar: "يشرح الشعراوي آية الدين بأنها توثيق يحمي المدين من نفسه ومن الظروف، ويرى أن الكاتب طرف ثالث لا مصلحة له، وأن الشاهد يتحمل ويؤدي ولا يُضار، وأن التعدد في المرأتين لأن المرأة بعيدة عن الاحتكاك بالمعاملات غالباً، وهذا رأيه المعلن {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1211} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1213} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1216} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1217}."
  en: "Sha'rawi reads the debt verse as documentation that protects the debtor from himself and from circumstances. He holds that the scribe is a third party with no stake, and that the witness bears testimony and performs it without being harmed. He explains the pairing of two women by saying women are generally less involved in dealings. This is his own stated view {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1211} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1213} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1216} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1217}."
  ur: "شعراوی قرض کی آیت کو ایسی دستاویز سمجھتے ہیں جو مقروض کو خود اس سے اور حالات سے بچاتی ہے۔ ان کے نزدیک لکھنے والا ایک تیسرا فریق ہے جس کا کوئی ذاتی مفاد نہیں، اور گواہ گواہی دیتا ہے اور اسے ضرر نہیں پہنچنا چاہیے۔ دو عورتوں کے ساتھ ایک مرد کی گواہی کی توجیہ میں وہ کہتے ہیں کہ عورت عموماً معاملات سے کم واسطہ رکھتی ہے، اور یہ ان کی اپنی بیان کردہ رائے ہے {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1211} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1213} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1216} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1217}۔"
