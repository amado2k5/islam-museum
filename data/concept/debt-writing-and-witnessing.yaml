id: concept/debt-writing-and-witnessing
class: concept
kind: belief
label: { ar: "كتابة الدين والإشهاد عليه", en: "Writing down debts and calling witnesses", ur: "قرض لکھنا اور گواہی", es: "Anotar las deudas y llamar a los testigos", fr: "Consigner les dettes et appeler les témoins", tr: "Dini yazmak ve ona tanıklık etmek", id: "Menulis agama dan menjadi saksi tentangnya" }
summary:
  ar: "يشرح الشعراوي آية الدين بأنها توثيق يحمي المدين من نفسه ومن الظروف، ويرى أن الكاتب طرف ثالث لا مصلحة له، وأن الشاهد يتحمل ويؤدي ولا يُضار، وأن التعدد في المرأتين لأن المرأة بعيدة عن الاحتكاك بالمعاملات غالباً، وهذا رأيه المعلن {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1211} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1213} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1216} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1217}."
  en: "Sha'rawi reads the debt verse as documentation that protects the debtor from himself and from circumstances. He holds that the scribe is a third party with no stake, and that the witness bears testimony and performs it without being harmed. He explains the pairing of two women by saying women are generally less involved in dealings. This is his own stated view {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1211} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1213} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1216} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1217}."
  ur: "شعراوی قرض کی آیت کو ایسی دستاویز سمجھتے ہیں جو مقروض کو خود اس سے اور حالات سے بچاتی ہے۔ ان کے نزدیک لکھنے والا ایک تیسرا فریق ہے جس کا کوئی ذاتی مفاد نہیں، اور گواہ گواہی دیتا ہے اور اسے ضرر نہیں پہنچنا چاہیے۔ دو عورتوں کے ساتھ ایک مرد کی گواہی کی توجیہ میں وہ کہتے ہیں کہ عورت عموماً معاملات سے کم واسطہ رکھتی ہے، اور یہ ان کی اپنی بیان کردہ رائے ہے {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1211} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1213} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1216} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1217}۔"
  es: "Sha'rawi interpreta el versículo sobre la deuda como un documento que protege al deudor de sí mismo y de las circunstancias. Sostiene que el escriba es un tercero sin interés alguno, y que el testigo da testimonio y lo realiza sin sufrir daño alguno. Explica la presencia de dos mujeres en el versículo argumentando que, por lo general, las mujeres participan menos en los tratos. Esta es su propia opinión declarada {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1211} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1213} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1216} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1217}."
  fr: "Sha'rawi interprète le verset relatif à la dette comme un document protégeant le débiteur de lui-même et des circonstances. Il considère le scribe comme un tiers impartial et estime que le témoin atteste et accomplit son acte sans subir de préjudice. Il explique la présence de deux femmes en affirmant que, généralement, elles sont moins impliquées dans les transactions commerciales. Telle est son opinion exprimée. {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1211} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1213} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1216} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1217}."
  tr: "El-Şaarawi, Ayat al-Din'i borçlunun kendisinden ve koşullardan koruyan bir belge olarak açıklar. Yazarın menfaati olmayan üçüncü bir taraf olduğuna, tanığın zarar görmeden ödeme yaptığını ve çok eşliliğin iki kadının durumu olduğunu, çünkü kadınların genellikle işlemlerde etkileşimde bulunmadığını düşünür. Bu, onun belirttiği görüştür {cite:tafsir-sharawi-khawatir-scan-vol-2 s.1211} {cite:tafsir-sharawi-khawatir-scan-vol-2 s.1213} {cite:tafsir-sharawi-khawatir-scan-vol-2 s.1216} {cite:tafsir-sharawi-khawatir-scan-vol-2 s.1217}."
  id: "Al-Shaarawi menjelaskan Ayat al-Din sebagai dokumen yang melindungi debitur dari dirinya sendiri dan dari keadaan. Ia percaya bahwa penulis adalah pihak ketiga tanpa kepentingan, bahwa saksi menanggung dan membayar tanpa merugikan, dan bahwa poligami adalah kasus dua wanita karena perempuan sering kali jauh dari berinteraksi dalam transaksi. Ini adalah pendapat yang ia nyatakan {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1211} {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1213} {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1216} {cite:tafsir-sharawi-khawatir-scan-vol-2 hlm.1217}."
