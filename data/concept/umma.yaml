id: concept/umma
class: concept
kind: social
label:
  ar: الأمة
  en: Umma
summary:
  ar: الأمة، وجمعها أمم، تعني الجماعة أو الشعب، وتدل في تاريخ الاستعمال الإسلامي في الغالب على الجماعة المسلمة كلها. تتبع دائرة المعارف الإسلامية معناها في القرآن، حيث تتدرج من الإشارة العامة إلى الجماعات الدينية نحو الجماعة المسلمة، وفي الحديث، وفي ترتيب المدينة المنورة، وفي الفكر الإسلامي الحديث منذ القرن التاسع عشر.
  en: Umma, plural umam, means a people or community, and in the history of Muslim usage it almost always means the Muslim community as a whole. The Encyclopaedia of Islam traces it through the Qur'an, where it moves from a general reference to religious communities toward the Muslim community, through hadith, through the arrangement at Medina, and through modern Muslim thought since the nineteenth century.
  ur: امت، جس کی جمع امم ہے، کے معنی قوم یا جماعت ہیں، اور مسلمانوں کے استعمال کی تاریخ میں یہ عموماً پوری مسلم جماعت کے لیے آتا ہے۔ دائرہ معارف اسلامیہ اس کا سراغ قرآن میں لگاتا ہے، جہاں یہ مذہبی جماعتوں کے عمومی ذکر سے مسلم جماعت کی طرف بڑھتا ہے، پھر حدیث، مدینہ کے انتظام اور انیسویں صدی سے جدید مسلم فکر میں۔
