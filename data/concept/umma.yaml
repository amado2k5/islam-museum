summary:
  ar: الأمة، وجمعها أمم، تعني الجماعة أو الشعب، وتدل في تاريخ الاستعمال الإسلامي في الغالب على الجماعة المسلمة كلها. تتبع دائرة المعارف الإسلامية معناها في القرآن، حيث تتدرج من الإشارة العامة إلى الجماعات الدينية نحو الجماعة المسلمة، وفي الحديث، وفي ترتيب المدينة المنورة، وفي الفكر الإسلامي الحديث منذ القرن التاسع عشر.
  en: Umma, plural umam, means a people or community, and in the history of Muslim usage it almost always means the Muslim community as a whole. The Encyclopaedia of Islam traces it through the Qur'an, where it moves from a general reference to religious communities toward the Muslim community, through hadith, through the arrangement at Medina, and through modern Muslim thought since the nineteenth century.
  ur: امت، جس کی جمع امم ہے، کے معنی قوم یا جماعت ہیں، اور مسلمانوں کے استعمال کی تاریخ میں یہ عموماً پوری مسلم جماعت کے لیے آتا ہے۔ دائرہ معارف اسلامیہ اس کا سراغ قرآن میں لگاتا ہے، جہاں یہ مذہبی جماعتوں کے عمومی ذکر سے مسلم جماعت کی طرف بڑھتا ہے، پھر حدیث، مدینہ کے انتظام اور انیسویں صدی سے جدید مسلم فکر میں۔
  es: "Umma, plural umam, significa pueblo o comunidad, y en la historia del uso musulmán casi siempre se refiere a la comunidad musulmana en su conjunto. La Enciclopedia del Islam rastrea su origen a través del Corán, donde pasa de una referencia general a las comunidades religiosas a la comunidad musulmana, a través de los hadices, la organización en Medina y el pensamiento musulmán moderno desde el siglo XIX."
  fr: "Le terme « umma », au pluriel « umam », désigne un peuple ou une communauté. Dans l’histoire de l’usage musulman, il désigne presque toujours la communauté musulmane dans son ensemble. L’Encyclopédie de l’Islam en retrace l’évolution à travers le Coran, où il passe d’une référence générale aux communautés religieuses à la communauté musulmane, puis à travers les hadiths, l’organisation de Médine et la pensée musulmane moderne depuis le XIXe siècle."
  tr: "Al-ummah, çoğulu 'umam', bir grup veya halk anlamına gelir ve İslami kullanımda genellikle tüm Müslüman topluluğu ifade eder. İslami Ansiklopedi, anlamını Kur'an'da takip eder; burada genel dini gruplara yapılan atıflardan Müslüman topluluğuna, hadislerde, Medine'nin düzeninde ve on dokuzuncu yüzyıldan itibaren modern İslam düşüncesine ilerler."
  id: "Al-ummah, jamak 'umam,' berarti kelompok atau bangsa, dan dalam penggunaan Islam, biasanya merujuk pada seluruh komunitas Muslim. Ensiklopedia Islam mengikuti maknanya dalam Al-Qur'an, di mana ia berkembang dari referensi umum pada kelompok agama hingga komunitas Muslim, dalam hadis, dalam susunan Madinah, dan dalam pemikiran Islam modern sejak abad kesembilan belas."
