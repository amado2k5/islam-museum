id: concept/al-muthanna-wal-jam-wal-adad-min-thalatha-ila-ashara
class: concept
kind: term
tags: [arabiyya-browser, arabiyya-sciences]
label:
  ar: "المثنى والجمع والعدد من ثلاثة إلى عشرة"
  en: "The dual, the plural and the numbers three to ten"
  ur: "مثنیٰ، جمع اور تین سے دس تک کے اعداد"
  fr: "Le duel, le pluriel et les nombres de trois à dix"
  es: "El dual, el plural y los números del tres al diez"
  tr: "İkili ve çoğul ile üçten ona kadar sayı"
  id: "Biner dan jamak dengan angka dari tiga hingga sepuluh"
summary:
  ar: "جدول المثنى وجمع المذكر السالم وجمع المؤنث السالم وجمع التكسير بتكوينها ومجالها ومثالها من ك-ت-ب، وقاعدة العدد من ثلاثة إلى عشرة: مخالفة العدد للمعدود في التذكير والتأنيث، ومجيء المعدود جمعاً مجروراً نكرة، كما أوردها ملخص بحثي. أرقام الصفحات عند ريدنغ ورايت والغلاييني من الملخص ولم يتحقق منها المتحف."
  en: "The table of the dual, sound masculine plural, sound feminine plural and broken plural with their formation, scope and k-t-b examples, and the rule of the numbers three to ten, in which the numeral takes the opposite gender to the counted noun and the counted noun stands in the indefinite genitive plural, as given by a research summary. The page numbers in Ryding, Wright and al-Ghalayini are the summary's and the museum did not check them."
  ur: "مثنیٰ، جمع مذکر سالم، جمع مؤنث سالم اور جمع تکسیر کا جدول ان کی بناوٹ، دائرے اور ک-ت-ب کی مثالوں کے ساتھ، اور تین سے دس تک کے اعداد کا قاعدہ، جس میں عدد معدود کی جنس کے الٹ لیتا ہے اور معدود نکرہ مجرور جمع میں آتا ہے، جیسے ایک تحقیقی خلاصے نے دیا۔ رائڈنگ، رائٹ اور الغلاینی میں صفحات کے نمبر خلاصے کے ہیں اور عجائب گھر نے ان کی جانچ نہیں کی۔"
  fr: "Le tableau du duel, du pluriel masculin sain, du pluriel féminin sain et du pluriel brisé avec leur formation, leur portée et leurs exemples sur k-t-b, et la règle des nombres de trois à dix, où le numéral prend le genre opposé du nom compté et où le nom compté se met au génitif pluriel indéfini, tel que le donne un résumé de recherche. Les numéros de page chez Ryding, Wright et al-Ghalayini sont ceux du résumé et le musée ne les a pas vérifiés."
  es: "La tabla del dual, el plural masculino sano, el plural femenino sano y el plural fracto con su formación, alcance y ejemplos sobre k-t-b, y la regla de los números del tres al diez, en que el numeral toma el género opuesto al del nombre contado y el nombre contado va en genitivo plural indefinido, tal como la da un resumen de investigación. Los números de página en Ryding, Wright y al-Ghalayini son los del resumen y el museo no los comprobó."
  tr: "Çift tablo, ses eril çoğul, ses dişil çoğul ve kırık çoğul, oluşumu, kapsamı ve k-t-b örnekleriyle birlikte, sayının üçten ona kadar kuralı: sayı, eril ve dişil sayıdan farklıdır ve sayılanların çoğulu, araştırma özetinde belirtildiği gibi genitif ve belirsiz biçimdedir. Reading, Wright ve Al-Ghalayini'ye göre sayfa numaraları özetten alınmıştır ve müze tarafından doğrulanmamıştır."
  id: "Tabel ganda, jamak maskulin, jamak feminin, dan jamak pecah, beserta contoh formasi, cakupan, dan k-t-b, aturan bilangan dari tiga hingga sepuluh: angka berbeda dari angka maskulin dan feminin, dan jamak dari angka yang dihitung adalah genitif dan tak pasti seperti yang disebutkan dalam abstrak penelitian. Menurut Reading, Wright, dan Al-Ghalayini, nomor halaman diambil dari abstrak dan tidak diverifikasi oleh museum."
