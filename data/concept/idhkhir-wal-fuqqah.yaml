label:
  ar: "الإذخر والفقاح"
  en: "Idhkhir and fuqqah (idhkhir and its flower, as the book names them)"
  ur: "اذخر اور فقاح"
  es: "Idhkhir y fuqqah (idhkhir y su flor, como los nombra el libro)"
summary:
  ar: "الإذخر وفقّاحه في الكتاب نبات له أنواع: أعرابي طيّب الرائحة، وآجامي، ودقيق وهو أصلب، وغليظ وهو أرخى ولا رائحة له؛ في الآجامي قوة مبرّدة، والأعرابي يكاد يكون حاراً يابساً في الثانية، وفيه قبض وإنضاج وتليين؛ ينفع من الحكّة والأورام الحارة والباردة والتشنّج ونفث الدم ووجع الرئة وأوجاع المعدة وأورام الكبد وأوجاع الكلى والحصاة والاستسقاء وأورام المقعدة ولسع الهوام؛ ويذكر الكتاب فيه أقوالاً عن الرحم ونزف النساء في فقرة موسومة معلّقة لحكم المؤسس {cite:canon-ibn-sina-print-v1 pp.348-349}"
  en: "In the book idhkhir and its flower (fuqqah) is a plant of several kinds: the a'rabi, sweet-smelling, the ajami (of thickets), the fine, which is harder, and the coarse, which is softer and has no smell; the ajami has a cooling force and the a'rabi is almost hot and dry in the second degree, with astringency, ripening and softening; it is listed for itch, hot and cold swellings, spasm, spitting of blood, pain of the lung, pains of the stomach, swellings of the liver, pains of the kidneys, stone, dropsy, swellings of the anus and stings of vermin; the book also gives statements on the womb and women's bleeding in a labelled section held for the founder's ruling {cite:canon-ibn-sina-print-v1 pp.348-349}"
  ur: "اذخر اور اس کا فقاح کتاب میں کئی قسموں کا پودا ہے: اعرابی، خوشبو دار؛ آجامی؛ باریک جو زیادہ سخت ہے؛ اور موٹا جو زیادہ نرم ہے اور جس کی کوئی بو نہیں؛ آجامی میں ٹھنڈک پہنچانے والی قوت ہے اور اعرابی تقریباً دوسرے درجے میں گرم خشک ہے، اس میں قبض، پکانے اور نرم کرنے کی صفت ہے؛ خارش، گرم اور سرد ورم، تشنج، خون تھوکنے، پھیپھڑے کے درد، معدے کے دردوں، جگر کے ورم، گردوں کے دردوں، پتھری، استسقاء، مقعد کے ورم اور موذی جانوروں کے ڈنک میں مذکور ہے؛ کتاب رحم اور عورتوں کے خون بہنے کے بارے میں اقوال موسوم حصے میں دیتی ہے جو بانی کے فیصلے کے لیے موقوف ہے {cite:canon-ibn-sina-print-v1 pp.348-349}۔"
  es: "En el libro Idhkhir y su flor (fuqqah) se menciona una planta de varios tipos: la a'rabi, de aroma dulce; la ajami (de matorrales), fina, que es más dura; y la gruesa, que es más suave y no tiene olor. La ajami tiene un efecto refrescante, mientras que la a'rabi es casi caliente y seca en segundo grado, con astringencia, maduración y suavizado. Se la menciona para tratar el picor, las hinchazones calientes y frías, los espasmos, la hemorragia, el dolor de pulmón, los dolores de estómago, las hinchazones del hígado, los dolores de riñón, los cálculos renales, la hidropesía, las hinchazones anales y las picaduras de parásitos. El libro también incluye declaraciones sobre el útero y el sangrado femenino en una sección dedicada a la decisión del fundador {cite:canon-ibn-sina-print-v1 pp.348-349}."
