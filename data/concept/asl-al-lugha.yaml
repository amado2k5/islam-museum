tags: [arabiyya-browser, arabiyya-origins]
label:
  ar: "أصل اللغة: توقيف أم اصطلاح؟"
  en: "The origin of language: revelation or convention?"
  ur: "زبان کی اصل: توقیف یا اصطلاح؟"
  fr: "L'origine de la langue : révélation ou convention ?"
  es: "El origen de la lengua: revelación o convención?"
summary:
  ar: "هل اللغة توقيف من الله أم اصطلاح تواطأ عليه الناس؟ ينقل السيوطي في المزهر قول ابن فارس بالتوقيف محتجاً بآية البقرة، وقول ابن جني الذي يرى أكثر أهل النظر على الاصطلاح مع تردد شيخه أبي علي الفارسي، وتفصيل الإسفراييني، وتوقف الباقلاني، واختيار إمام الحرمين أن العقل يجيز الأمرين. وتُعرّف الصفحة اللغة بحد ابن جني."
  en: "Is language tawqif from God, or a convention the people agreed on? In al-Muzhir al-Suyuti reports Ibn Faris holding for tawqif and citing the verse of al-Baqara, Ibn Jinni saying most people of reflection hold for convention while his teacher Abu Ali al-Farisi wavered, al-Isfara'ini's distinction, al-Baqillani's suspension of judgement, and Imam al-Haramayn's choice that reason allows both. The page also gives Ibn Jinni's definition of language."
  ur: "کیا زبان اللہ کی طرف سے توقیف ہے یا ایک اصطلاح جس پر لوگوں نے اتفاق کیا؟ المزہر میں سیوطی ابن فارس کا قول نقل کرتے ہیں جو آیت بقرہ سے توقیف پر استدلال کرتے ہیں، ابن جنی کا قول کہ اکثر اہل نظر اصطلاح کے قائل ہیں جبکہ ان کے استاد ابو علی فارسی متردد تھے، اسفراینی کی تفصیل، باقلانی کا توقف، اور امام الحرمین کا اختیار کہ عقل دونوں کو جائز رکھتی ہے۔ صفحہ ابن جنی کی تعریف بھی دیتا ہے۔"
  fr: "La langue est-elle tawqif de Dieu, ou convention sur laquelle les gens se sont accordés ? Dans al-Muzhir, al-Suyuti rapporte Ibn Faris tenant pour le tawqif en citant le verset d'al-Baqara, Ibn Jinni disant que la plupart des gens de réflexion tiennent pour la convention tandis que son maître Abu Ali al-Farisi hésitait, la distinction d'al-Isfara'ini, la suspension d'al-Baqillani, et le choix de l'Imam al-Haramayn que la raison permet les deux. La page donne aussi la définition de la langue d'Ibn Jinni."
  es: "¿Es la lengua tawqif de Dios o una convención en que la gente se puso de acuerdo? En al-Muzhir al-Suyuti transmite que Ibn Faris sostiene el tawqif citando el versículo de al-Baqara, que Ibn Jinni dice que la mayoría de la gente de reflexión sostiene la convención mientras su maestro Abu Ali al-Farisi vacilaba, la distinción de al-Isfara'ini, la suspensión de al-Baqillani y la elección del Imam al-Haramayn de que la razón permite ambos. La página da también la definición de la lengua de Ibn Jinni."
