label:
  ar: "شَرْعُ مَنْ قَبْلَنا"
  en: "Shar' man qablana (the law of earlier prophets, and whether it binds us)"
summary:
  ar: "الشرع في اللغة الطريق الظاهر إلى الماء، واصطلاحا ما سنه الله لعباده من الدين، و«من قبلنا» الأنبياء المرسلون قبل نبينا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9989} الشرائع السماوية متحدة الأصول في العقيدة، واختلف الأصوليون في الاحتجاج بشرع من قبلنا، فالحنفية والمالكية والحنابلة يرونه شرعا لنا إذا قصه الله في القرآن بلا إنكار، والشافعية في الأصح يرونه ليس شرعا لنا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9989} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9990} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9991}"
  en: "The shar' in language is the clear road to water; in the technical sense it is the religion God established for His servants, and 'those before us' are the messengers before our Prophet. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9989} The revealed laws share one root in belief, and the usulis differ on whether the law of earlier prophets binds us: the Hanafis, Malikis and Hanbalis hold it binding on us when the Qur'an tells it without denial or endorsement, while the sounder Shafi'i view holds it not binding. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9989} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9990} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9991}"
