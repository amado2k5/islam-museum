id: concept/shar-man-qablana
class: concept
kind: legal
label:
  ar: "شَرْعُ مَنْ قَبْلَنا"
  en: "Shar' man qablana (the law of earlier prophets, and whether it binds us)"
  es: "Shar' man qablana (la ley de los profetas anteriores y si nos obliga)"
  fr: "Shar' man qablana (la loi des prophètes antérieurs, et si elle nous lie)"
  ur: "شرع من قبلانا ⁦(پہلے انبیاء کا قانون، اور آیا یہ ہمیں پابند کرتا ہے)⁩"
  tr: "Başlattık"
  id: "Dimulai oleh kami"
summary:
  ar: "الشرع في اللغة الطريق الظاهر إلى الماء، واصطلاحا ما سنه الله لعباده من الدين، و«من قبلنا» الأنبياء المرسلون قبل نبينا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9989} الشرائع السماوية متحدة الأصول في العقيدة، واختلف الأصوليون في الاحتجاج بشرع من قبلنا، فالحنفية والمالكية والحنابلة يرونه شرعا لنا إذا قصه الله في القرآن بلا إنكار، والشافعية في الأصح يرونه ليس شرعا لنا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9989} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9990} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9991}"
  en: "The shar' in language is the clear road to water; in the technical sense it is the religion God established for His servants, and 'those before us' are the messengers before our Prophet. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9989} The revealed laws share one root in belief, and the usulis differ on whether the law of earlier prophets binds us: the Hanafis, Malikis and Hanbalis hold it binding on us when the Qur'an tells it without denial or endorsement, while the sounder Shafi'i view holds it not binding. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9989} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9990} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9991}"
  es: "El shar' en el lenguaje es el camino claro hacia el agua; en el sentido técnico es la religión que Dios estableció para Sus siervos, y \"aquellos que nos precedieron\" son los mensajeros que precedieron a nuestro Profeta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9989} Las leyes reveladas comparten una raíz en la creencia, y los usulis difieren en si la ley de los profetas anteriores nos vincula: los hanafíes, malikíes y hanbalíes la consideran vinculante cuando el Corán la dice sin negación ni respaldo, mientras que la opinión shafi'í más sólida la considera no vinculante. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9989} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9990} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9991}"
  fr: "Le terme « shar » désigne, en langage, le chemin clair vers l'eau; au sens technique, il s'agit de la religion que Dieu a établie pour Ses serviteurs, et « ceux qui nous ont précédés » sont les messagers qui ont précédé notre Prophète. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9989} Les lois révélées partagent une même racine dans la croyance, et les usulis divergent quant à savoir si la loi des prophètes antérieurs nous est applicable: les hanafites, les malikites et les hanbalites la considèrent comme applicable lorsque le Coran l'énonce sans la réfuter ni l'approuver, tandis que l'avis shafi'ite, plus solide, la considère comme non applicable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9989} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9990} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9991}"
  ur: "زبان میں شر پانی کا صاف راستہ ہے۔ تکنیکی لحاظ سے یہ وہ دین ہے جو خدا نے اپنے بندوں کے لیے قائم کیا ہے، اور 'ہم سے پہلے والے' ہمارے نبی سے پہلے رسول ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ-نور-v3 صفحہ 9989} نازل شدہ قوانین عقیدہ میں ایک جڑ رکھتے ہیں، اور علماء کا اس بات پر اختلاف ہے کہ آیا پہلے انبیاء کا قانون ہمیں پابند کرتا ہے: احناف، مالکیہ اور حنبلی اسے ہم پر پابند سمجھتے ہیں جب کہ قرآن اسے بغیر انکار کے کہتا ہے، جب کہ شافعی کا قول اس کی تردید کے بغیر کہتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9989} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 9990}"
  tr: "Dil olarak Şeriat, suya giden görünür yoldur ve teknik olarak, Tanrı'nın din hizmetkârları için verdiği şeydir ve 'bizden' ifadesi, peygamberimizden önce gönderilen peygamberleri ifade eder. {alıntı:fiqh-mawsua-kuwaitiyya-noor-v3 s.9989} İlahi yasalar inançta birleşmiştir ve usul alimleri kendi yasamızı savunmakta farklılık gösterir. Hanefiler, Malikiler ve Hanbaliler, Tanrı'nın Kur'an'da inkâr etmeden belirtmesi halinde bunu bizim kanunumuz olarak görürken, Şafiiler daha doğru bir şekilde bunu bizim kanunumuz olarak görmezler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9989} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9990} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.9991}"
  id: "Dalam bahasa, Syariah adalah jalan yang tampak menuju air, dan secara teknis, apa yang telah ditetapkan Tuhan untuk hamba-Nya dalam agama, dan 'dari kita' merujuk pada nabi-nabi yang dikirim sebelum nabi kita. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9989} Hukum-hukum ilahi bersatu dalam kredo, dan para ulama usul berbeda pendapat dalam berargumen tentang hukum kita sendiri. Hanafi, Maliki, dan Hanbal menganggap itu hukum kita jika Allah telah menyatakannya dalam Al-Qur'an tanpa penyangkalan, sementara syafi'i, lebih tepatnya, melihatnya bukan hukum kita. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9989} {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.9990} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.9991}"
