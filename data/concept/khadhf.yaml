label: { ar: "الخذف", en: "Khadhf (throwing small pebbles; stoning the jamarat)", ur: "خذف" }
summary:
  ar: "الخذف لغة رميك بحصاة أو نواة تأخذها بين السبابتين، أو تجعل مخذفة من خشب ترمي بها بين الإبهام والسبابة؛ وهو الرمي بالحصى الصغار بأطراف الأصابع، ويطلق على المقلاع أيضا، ورمي الجمار يكون بمثل حصى الخذف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7571} والألفاظ ذات الصلة: الحذف والطرح والقذف والإلقاء، وكلها تلتقي معه في معنى الرمي، إلا أن الخذف رمي بكيفية خاصة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7571} الأصل فيه نهي النبي عن الخذف لأنه لا يقتل الصيد ولا ينكأ العدو، وإنه يفقأ العين ويكسر السن. واختلف الفقهاء: فمنهم من حرمه مطلقا كما قال القاضي عياض، ومنهم من نظر إلى المصلحة فأجاز ما فيه حاجة في القتال أو تحصيل الصيد إذا كان لا يقتل غالبا، وفصل ابن حجر بين الغالب من حال الرمي وعكسه، وكره تقي الدين الرمي بالبندق مطلقا، وأجاز الفقهاء الرمي بالأحجار في القتال والتدريب والمسابقة بغير عوض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7571} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7572} ومن أحكامه رمي الجمار بحصى الخذف، وهو من شعائر الحج، ودليله أمر النبي بحصى الخذف الذي يرمى به الجمرة، ونهيه عن الغلو في الدين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7572}"
  en: "Khadhf is lexically throwing a pebble or stone held between two fingers, or with a wooden catapult or sling; it means throwing small pebbles with the fingertips, and can also mean the sling itself. Related words (hadhf, qadhf, ilqa') share the sense of throwing, but khadhf is a particular manner of throwing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7571} The root ruling is the report that the Prophet forbade khadhf, because it neither kills game nor wounds an enemy, and it blinds the eye and breaks the tooth. Jurists differ: some forbid it absolutely (Qadi Iyad); others weigh benefit and permit it in war or hunting when it does not usually kill, Ibn Hajar distinguishing by the likely outcome; Taqi al-Din disliked pellet-throwing in all cases. Stone-throwing is allowed in war, training or unpaid contests. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7571} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7572} Among its rulings is stoning the jamarat with khadhf-size pebbles, a rite of the Hajj, on the basis of the instruction to take pebbles of that size and the warning against excess in religion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7572}"
  ur: "خذف لغت میں انگلیوں کے درمیان پتھر یا گٹھلی سے مارنا، یا لکڑی کی غلیل سے مارنا ہے؛ یہ انگلیوں کے سروں سے چھوٹے کنکر مارنے کو کہتے ہیں اور غلیل پر بھی بولا جاتا ہے۔ حذف، طرح، قذف اور القاء اس کے قریب المعنی الفاظ ہیں، مگر خذف رمی کی ایک خاص کیفیت ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7571} اصل میں نبی کا خذف سے منع فرمانا منقول ہے، کیونکہ وہ نہ شکار کو مارتا ہے نہ دشمن کو زخمی کرتا ہے، بلکہ آنکھ پھوڑتا اور دانت توڑتا ہے۔ فقہاء میں اختلاف ہے: بعض نے اسے مطلقاً حرام کہا جیسے قاضی عیاض، اور بعض نے مصلحت دیکھ کر جنگ یا شکار میں جائز کہا جب غالب طور پر قتل نہ ہو؛ ابن حجر نے غالب حال کے لحاظ سے تفصیل کی، اور تقی الدین نے بندق سے رمی کو مطلقاً مکروہ کہا؛ جنگ، تربیت اور بغیر عوض مقابلے میں پتھر مارنا جائز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7571} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7572} اس کا ایک حکم جمرات کو خذف جیسے کنکریوں سے رمی کرنا ہے، جو حج کے شعائر میں سے ہے، اور اس کی دلیل نبی کا وہی کنکریاں لینے کا حکم اور دین میں غلو سے ممانعت ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7572}"
