id: concept/khadhf
class: concept
kind: term
label:
  ar: الخذف
  en: Khadhf (throwing small pebbles; stoning the jamarat)
  ur: خذف
summary:
  ar: 'الخذف لغة رميك بحصاة أو نواة تأخذها بين السبابتين، أو تجعل مخذفة من خشب ترمي بها بين الإبهام والسبابة؛ وهو الرمي بالحصى الصغار بأطراف الأصابع، ويطلق على المقلاع أيضا، ورمي الجمار يكون بمثل حصى الخذف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7571} والألفاظ ذات الصلة: الحذف والطرح والقذف والإلقاء، وكلها تلتقي معه في معنى الرمي، إلا أن الخذف رمي بكيفية خاصة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7571} الأصل فيه نهي النبي عن الخذف لأنه لا يقتل الصيد ولا ينكأ العدو، وإنه يفقأ العين ويكسر السن. واختلف الفقهاء: فمنهم من حرمه مطلقا كما قال القاضي عياض، ومنهم من نظر إلى المصلحة فأجاز ما فيه حاجة في القتال أو تحصيل الصيد إذا كان لا يقتل غالبا، وفصل ابن حجر بين الغالب من حال الرمي وعكسه، وكره تقي الدين الرمي بالبندق مطلقا، وأجاز الفقهاء الرمي بالأحجار في القتال والتدريب والمسابقة بغير عوض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7571} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7572} واختلف الفقهاء في المقصود بالخذف في أحاديث رمي الجمار: هل هو بيان قدر الحصاة، أو بيان كيفية الرمي، أو هما معا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7573} الحنفية أوردوا ثلاث صور للرمي، وقالوا إن الأصل والأيسر أن يأخذ الحصاة بطرفي إبهامه وسبابته، ولم يروا في حديث «ارموا الجمرة بمثل حصى الخذف» دليلا على كيفية الخذف، بل على مقدار الحصاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7573} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7574} والمالكية يوافقون الحنفية في الكيفية، والشافعية ذكروا هيئة الخذف وقالوا إنها مكروهة، والأصح عندهم أن يرمي على غير هيئته، والحنابلة لم يذكروا كيفية خاصة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7574} وفي المقدار اتفقوا على أن تكون الحصاة صغيرة كحصى الخذف، واختلفوا في تقدير الصغر: فالمختار عند الحنفية قدر الباقلا، والمالكية قدر الفول أو النواة، والشافعية قدر حبة الباقلا، والحنابلة ما بين الحمص والبندق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7574} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7575} ومن أحكامه رمي الجمار بحصى الخذف، وهو من شعائر الحج، ودليله أمر النبي بحصى الخذف الذي يرمى به الجمرة، ونهيه عن الغلو في الدين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7572} ولا يحل الصيد بحصى الخذف لأنه وقيذ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7575}'
  en: 'Khadhf is lexically throwing a pebble or stone held between two fingers, or with a wooden catapult or sling; it means throwing small pebbles with the fingertips, and can also mean the sling itself. Related words (hadhf, qadhf, ilqa'') share the sense of throwing, but khadhf is a particular manner of throwing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7571} The root ruling is the report that the Prophet forbade khadhf, because it neither kills game nor wounds an enemy, and it blinds the eye and breaks the tooth. Jurists differ: some forbid it absolutely (Qadi Iyad); others weigh benefit and permit it in war or hunting when it does not usually kill, Ibn Hajar distinguishing by the likely outcome; Taqi al-Din disliked pellet-throwing in all cases. Stone-throwing is allowed in war, training or unpaid contests. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7571} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7572} Jurists also differ on what the reports on stoning the jamarat settle: the size of the pebble, the manner of throwing, or both. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7573} The Hanafis give three manners and prefer holding the pebble between thumb and forefinger; they read the report about khadhf-sized pebbles as fixing size, not manner. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7573} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7574} The Malikis agree on manner; the Shafiis call the khadhf grip disliked and prefer another; the Hanbalis name no particular manner. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7574} On size there is agreement that the pebble should be small like khadhf pebbles, with differing measures: a bean for the Hanafis, a broad bean or a date stone for the Malikis, a broad bean for the Shafiis, and between a chickpea and a hazelnut for the Hanbalis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7574} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7575} Among its rulings is stoning the jamarat with khadhf-size pebbles, a rite of the Hajj, on the basis of the instruction to take pebbles of that size and the warning against excess in religion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7572} Game killed by khadhf pebbles is not lawful, as the pebble counts as a blow that kills without a cut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7575}'
  ur: 'خذف لغت میں انگلیوں کے درمیان پتھر یا گٹھلی سے مارنا، یا لکڑی کی غلیل سے مارنا ہے؛ یہ انگلیوں کے سروں سے چھوٹے کنکر مارنے کو کہتے ہیں اور غلیل پر بھی بولا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7571} نبی کا خذف سے منع فرمانا منقول ہے، کیونکہ وہ نہ شکار کو مارتا ہے نہ دشمن کو زخمی کرتا ہے۔ فقہاء میں اختلاف ہے: قاضی عیاض نے اسے مطلقاً حرام کہا، ابن حجر نے غالب حال کے لحاظ سے تفصیل کی، اور تقی الدین نے بندق سے رمی کو مکروہ کہا؛ جنگ، تربیت اور بغیر عوض مقابلے میں پتھر مارنا جائز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7571}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7572} جمرات کی رمی کی احادیث سے مراد کنکری کا مقدار ہے یا کیفیت، یا دونوں؛ حنفیہ کے نزدیک اس سے مقدار مراد ہے، کیفیت نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7573}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7574} شافعیہ خذف کی کیفیت کو مکروہ کہتے ہیں، مالکیہ کیفیت میں حنفیہ کے ساتھ ہیں، اور حنابلہ کوئی خاص کیفیت نہیں بتاتے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7574} مقدار پر اتفاق ہے کہ کنکری خذف جیسی چھوٹی ہو، مگر تقدیر میں اختلاف ہے: حنفیہ کے نزدیک باقلا کے برابر، حنابلہ کے نزدیک چنے اور ہیزل کے درمیان۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7574}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7575} جمرات کو خذف جیسی کنکریوں سے رمی کرنا حج کا شعار ہے، اور خذف سے مارا ہوا شکار حلال نہیں کیونکہ وہ وقیذ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7572}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7575}'
