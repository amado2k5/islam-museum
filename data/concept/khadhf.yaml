id: concept/khadhf
class: concept
kind: term
label:
  ar: الخذف
  en: Khadhf (throwing small pebbles; stoning the jamarat)
  ur: خذف
  es: "Khadhf (lanzar pequeñas piedras; apedrear la jamarat)"
  fr: "Khadhf (jeter des petits cailloux; lapider la jamarat)"
  tr: "Kaldırma"
  id: "Penghapusan"
summary:
  ar: 'الخذف لغة رميك بحصاة أو نواة تأخذها بين السبابتين، أو تجعل مخذفة من خشب ترمي بها بين الإبهام والسبابة؛ وهو الرمي بالحصى الصغار بأطراف الأصابع، ويطلق على المقلاع أيضا، ورمي الجمار يكون بمثل حصى الخذف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7571} والألفاظ ذات الصلة: الحذف والطرح والقذف والإلقاء، وكلها تلتقي معه في معنى الرمي، إلا أن الخذف رمي بكيفية خاصة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7571} الأصل فيه نهي النبي عن الخذف لأنه لا يقتل الصيد ولا ينكأ العدو، وإنه يفقأ العين ويكسر السن. واختلف الفقهاء: فمنهم من حرمه مطلقا كما قال القاضي عياض، ومنهم من نظر إلى المصلحة فأجاز ما فيه حاجة في القتال أو تحصيل الصيد إذا كان لا يقتل غالبا، وفصل ابن حجر بين الغالب من حال الرمي وعكسه، وكره تقي الدين الرمي بالبندق مطلقا، وأجاز الفقهاء الرمي بالأحجار في القتال والتدريب والمسابقة بغير عوض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7571} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7572} واختلف الفقهاء في المقصود بالخذف في أحاديث رمي الجمار: هل هو بيان قدر الحصاة، أو بيان كيفية الرمي، أو هما معا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7573} الحنفية أوردوا ثلاث صور للرمي، وقالوا إن الأصل والأيسر أن يأخذ الحصاة بطرفي إبهامه وسبابته، ولم يروا في حديث «ارموا الجمرة بمثل حصى الخذف» دليلا على كيفية الخذف، بل على مقدار الحصاة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7573} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7574} والمالكية يوافقون الحنفية في الكيفية، والشافعية ذكروا هيئة الخذف وقالوا إنها مكروهة، والأصح عندهم أن يرمي على غير هيئته، والحنابلة لم يذكروا كيفية خاصة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7574} وفي المقدار اتفقوا على أن تكون الحصاة صغيرة كحصى الخذف، واختلفوا في تقدير الصغر: فالمختار عند الحنفية قدر الباقلا، والمالكية قدر الفول أو النواة، والشافعية قدر حبة الباقلا، والحنابلة ما بين الحمص والبندق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7574} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7575} ومن أحكامه رمي الجمار بحصى الخذف، وهو من شعائر الحج، ودليله أمر النبي بحصى الخذف الذي يرمى به الجمرة، ونهيه عن الغلو في الدين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7572} ولا يحل الصيد بحصى الخذف لأنه وقيذ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7575}'
  en: 'Khadhf is lexically throwing a pebble or stone held between two fingers, or with a wooden catapult or sling; it means throwing small pebbles with the fingertips, and can also mean the sling itself. Related words (hadhf, qadhf, ilqa'') share the sense of throwing, but khadhf is a particular manner of throwing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7571} The root ruling is the report that the Prophet forbade khadhf, because it neither kills game nor wounds an enemy, and it blinds the eye and breaks the tooth. Jurists differ: some forbid it absolutely (Qadi Iyad); others weigh benefit and permit it in war or hunting when it does not usually kill, Ibn Hajar distinguishing by the likely outcome; Taqi al-Din disliked pellet-throwing in all cases. Stone-throwing is allowed in war, training or unpaid contests. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7571} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7572} Jurists also differ on what the reports on stoning the jamarat settle: the size of the pebble, the manner of throwing, or both. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7573} The Hanafis give three manners and prefer holding the pebble between thumb and forefinger; they read the report about khadhf-sized pebbles as fixing size, not manner. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7573} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7574} The Malikis agree on manner; the Shafiis call the khadhf grip disliked and prefer another; the Hanbalis name no particular manner. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7574} On size there is agreement that the pebble should be small like khadhf pebbles, with differing measures: a bean for the Hanafis, a broad bean or a date stone for the Malikis, a broad bean for the Shafiis, and between a chickpea and a hazelnut for the Hanbalis. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7574} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7575} Among its rulings is stoning the jamarat with khadhf-size pebbles, a rite of the Hajj, on the basis of the instruction to take pebbles of that size and the warning against excess in religion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7572} Game killed by khadhf pebbles is not lawful, as the pebble counts as a blow that kills without a cut. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7575}'
  ur: 'خذف لغت میں انگلیوں کے درمیان پتھر یا گٹھلی سے مارنا، یا لکڑی کی غلیل سے مارنا ہے؛ یہ انگلیوں کے سروں سے چھوٹے کنکر مارنے کو کہتے ہیں اور غلیل پر بھی بولا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7571} نبی کا خذف سے منع فرمانا منقول ہے، کیونکہ وہ نہ شکار کو مارتا ہے نہ دشمن کو زخمی کرتا ہے۔ فقہاء میں اختلاف ہے: قاضی عیاض نے اسے مطلقاً حرام کہا، ابن حجر نے غالب حال کے لحاظ سے تفصیل کی، اور تقی الدین نے بندق سے رمی کو مکروہ کہا؛ جنگ، تربیت اور بغیر عوض مقابلے میں پتھر مارنا جائز ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7571}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7572} جمرات کی رمی کی احادیث سے مراد کنکری کا مقدار ہے یا کیفیت، یا دونوں؛ حنفیہ کے نزدیک اس سے مقدار مراد ہے، کیفیت نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7573}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7574} شافعیہ خذف کی کیفیت کو مکروہ کہتے ہیں، مالکیہ کیفیت میں حنفیہ کے ساتھ ہیں، اور حنابلہ کوئی خاص کیفیت نہیں بتاتے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7574} مقدار پر اتفاق ہے کہ کنکری خذف جیسی چھوٹی ہو، مگر تقدیر میں اختلاف ہے: حنفیہ کے نزدیک باقلا کے برابر، حنابلہ کے نزدیک چنے اور ہیزل کے درمیان۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7574}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7575} جمرات کو خذف جیسی کنکریوں سے رمی کرنا حج کا شعار ہے، اور خذف سے مارا ہوا شکار حلال نہیں کیونکہ وہ وقیذ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7572}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7575}'
  es: "Khadhf es léxicamente lanzar una piedrecita o piedra sostenida entre dos dedos, o con una catapulta o honda de madera; significa lanzar pequeñas piedrecitas con las yemas de los dedos, y también puede referirse a la honda misma. Palabras relacionadas (hadhf, qadhf, ilqa') comparten el sentido de lanzar, pero khadhf es una forma particular de lanzar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7571} La norma fundamental es el relato de que el Profeta prohibió el khadhf, porque no mata la presa ni hiere al enemigo, y ciega el ojo y rompe los dientes. Los juristas difieren: algunos lo prohíben absolutamente (Qadi Iyad); otros sopesan el beneficio y lo permiten en la guerra o la caza cuando no suele matar, Ibn Hajar distingue por el resultado probable; Taqi al-Din desaprobaba el lanzamiento de proyectiles en todos los casos. El lanzamiento de piedras está permitido en la guerra, el entrenamiento o las competiciones no remuneradas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7571} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7572} Los juristas también difieren en lo que establecen los informes sobre la lapidación de las jamarat: el tamaño del guijarro, la manera de lanzarlo o ambos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7573} Los hanafíes dan tres maneras y prefieren sostener el guijarro entre el pulgar y el índice; interpretan el informe sobre guijarros del tamaño de khadhf como una fijación del tamaño, no de la manera. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7573} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7574} Los malikíes están de acuerdo en la manera; Los shafiíes consideran que el agarre khadhf es desagradable y prefieren otro; los hanbalíes no mencionan ninguna manera en particular. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7574} En cuanto al tamaño, hay acuerdo en que el guijarro debe ser pequeño como los guijarros khadhf, con medidas diferentes: un frijol para los hanafíes, una haba o un hueso de dátil para los malikíes, una haba para los shafiíes, y entre un garbanzo y una avellana para los hanbalíes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7574} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7575} Entre sus preceptos se encuentra la lapidación de la jamarat con guijarros del tamaño de khadhf, un rito del Hajj, basado en la instrucción de tomar guijarros de ese tamaño y la advertencia contra el exceso en la religión. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7572} La caza abatida por guijarros khadhf no es lícita, ya que el guijarro cuenta como un golpe que mata sin causar corte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7575}"
  fr: "Le terme « khadhf » désigne le jet d'un caillou ou d'une pierre tenu entre deux doigts, ou à l'aide d'une fronde ou d'une catapulte en bois; il signifie lancer de petits cailloux du bout des doigts et peut également désigner la fronde elle-même. Des mots apparentés (hadhf, qadhf, ilqa') partagent le sens de lancer, mais « khadhf » désigne une manière particulière de lancer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7571} La règle fondamentale repose sur le hadith selon lequel le Prophète a interdit le khadhf, car il ne tue ni le gibier ni ne blesse l'ennemi, et il peut rendre aveugle et casser une dent. Les juristes divergent: certains l'interdisent formellement (Qadi Iyad); d'autres évaluent les avantages et l'autorisent à la guerre ou à la chasse lorsqu'il n'entraîne généralement pas la mort, Ibn Hajar faisant la distinction selon le résultat probable; Taqi al-Din désapprouvait le jet de cailloux en toutes circonstances. Le jet de pierres est autorisé à la guerre, à l'entraînement ou lors de compétitions non rémunérées. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7571} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7572} Les juristes divergent également sur ce que les récits relatifs à la lapidation des jamarat permettent de trancher: la taille du caillou, la manière de le jeter, ou les deux. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7573} Les hanafites mentionnent trois manières et privilégient celle de tenir le caillou entre le pouce et l’index; ils interprètent le récit concernant les cailloux de la taille d’un khadhf comme fixant la taille, et non la manière. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7573} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7574} Les malikites s’accordent sur la manière; Les chaféites désapprouvent la prise du khadhf et en préfèrent une autre; les hanbalites ne mentionnent aucune méthode particulière. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7574} Concernant la taille, il est admis que le caillou doit être petit, comme ceux utilisés pour le khadhf, avec toutefois des variations: un haricot pour les hanafites, une fève ou un noyau de datte pour les malikites, une fève pour les chaféites, et une taille comprise entre un pois chiche et une noisette pour les hanbalites. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7574} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7575} Parmi ses règles figure la lapidation des jamarat avec des cailloux de la taille du khadhf, un rite du Hajj, fondée sur l’instruction d’emporter des cailloux de cette taille et sur la mise en garde contre les excès en matière de religion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7572} Le gibier tué par des cailloux khadhf n'est pas licite, car le caillou compte comme un coup mortel sans incision. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7575}"
  tr: "Khadhaf, işaret parmakları arasında taş veya çukur atan ya da başparmak ile işaret parmağı arasında atılacak tahta mukhaddaf yapan bir dildir; parmak uçlarıyla küçük çakıl taşları atmak, sapanla da adlandırılır. Cemaratın taşlanması, khaddaf çakılları ile aynı şekilde yapılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7571} İlgili terimler: atlama, atma, fırlatma ve fırlatma, bunların hepsi fırlatma anlamıyla örtüşür, ancak khaddaf özel bir şekilde atmaktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7571} Bunun asıl anlamı, Peygamber'in haddhaf'ı yasaklamasıdır çünkü ne avı öldürür ne de düşmanı hareket ettirir, gözü kırar ve dişi kırar. Hukukçular farklı görüşteydi: bazıları Kadi İyad'ın belirttiği gibi tamamen yasakladı, bazıları ise faydalı buldu ve genellikle öldürülmeyen dövüşte veya av avında gerekli olanı kabul etti. İbn Hacer, en yaygın atış vakaları ile tam tersi arasındaki farkı ayırırken, Taki al-Din tüfekle ateş etmeyi kesinlikle sevmezdi. Hukukçular, kavga, eğitim ve yarışmada taş atmaya karşılık verilmeden izin verdiler. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7571} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7572} Fıhiller, cemaratın taşlanmasıyla ilgili hadislerde 'kahdf' anlamı konusunda farklı görüşteydi: taşın ölçüsü, taşlanma yöntemi mi yoksa her ikisi mi belirtildiği konusunda. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7573} Hanefiler üç tür taşlama bildirmiştir ve doğru ve tercih edilen yöntemin çakıl taşını başparmak ve işaret parmağının uçlarıyla almak olduğunu söylemişlerdir. Hadis'te \"Kobrayı taş taşları gibi çakıllarla at\" ifadesini nasıl çıkaracaklarına dair kanıt olarak değil, taşın boyutuna göre bulmuşlardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7573} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7574} Malikiler, kaffenin şekli konusunda Hanafilerle hemfikirken, Şafiiler 'khaddaf' formundan bahsetmiş ve sevilmediğini söyler; doğru görüş ise farklı bir biçimde atmaktır, Hanbaliler ise belirli bir yöntem belirtmemiştir. {Cite:Fiqh-Mawsua-Kuwaitiyya-Noor-V3 s. 7574} Miktar açısından, çakıl taşının küçük bir çakıl taşı gibi olması gerektiği konusunda hemfikir oldular ve en küçük tahminde de fikir ayrılığı yaşadılar: Hanafilere göre tercih edilen bakla boyutu, Malikiler fasulye veya çekirdek büyüklüğü, Şafi'ler fasulye büyüklüğünde, Hanbaliler ise nohut ile fındık arasında ortaktır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.7574} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7575} Kararları arasında, hac ritüellerinden biri olan kobra çakıllarıyla Cemarat'ı taşlamak vardır. Bunun kanıtı, Peygamber'in kobranın atıldığı kobra çakıl taşlarını kullanması ve aşırı dini abartıların yasaklanmasıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7572} ve çakıl taşlarıyla balık tutmak yasaktır çünkü bu yasaktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7575}"
  id: "Khadhaf adalah bahasa yang melempar batu atau lubang di antara jari telunjuk, atau membuat mukhaddaf kayu untuk dilempar di antara ibu jari dan jari telunjuk; yaitu melempar kerikil kecil dengan ujung jari, juga disebut ketapel. Lempari batu Jamarat dilakukan dengan kerikil khaddaf. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.7571} Istilah terkait: penghilangan, melempar, melempar, dan melempar, yang semuanya sesuai dengan makna melempar, tetapi khaddaf adalah melempar dengan cara khusus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7571} Makna asli dari ini adalah bahwa Nabi melarang khaddhaf karena tidak membunuh mangsa atau membuat musuh digerakkan, dan mematahkan mata serta mematahkan gigi. Para ahli hukum berbeda: beberapa melarangnya secara langsung, seperti yang dinyatakan Qadi Iyad, sementara yang lain menganggapnya bermanfaat dan mengizinkan apa yang diperlukan dalam pertarungan atau menangkap hewan jika biasanya tidak dibunuh. Ibn Hajar membedakan antara kasus menembak yang paling umum dan yang berlawanan, sementara Taqi al-Din sangat tidak suka menembak dengan senapan sama sekali. Para ahli hukum mengizinkan melempar batu dalam pertarungan, latihan, dan kompetisi tanpa kompensasi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7571} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7572} Para ahli hukum berbeda pendapat mengenai makna 'kahdf' dalam hadits tentang merajam Jamarat: apakah itu menunjukkan ukuran batu, metode rajam, atau keduanya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7573} Kaum Hanafi melaporkan tiga bentuk rajam, dan mereka mengatakan bahwa pendekatan yang benar dan disukai adalah mengambil kerikil dengan ujung ibu jari dan jari telunjuk. Mereka tidak menemukan dalam hadits \"Melemparkan kobra dengan kerikil seperti batu di atas batu,\" sebagai bukti cara menghilangkannya, melainkan karena ukuran batu. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7573} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7574} Kaum Malik setuju dengan Hanabi mengenai cara kaffa, sementara Shafi'i menyebut bentuk 'khaddaf' dan mengatakan hal itu tidak disukai, dan pandangan yang benar adalah melemparkannya dalam bentuk berbeda, sementara Hanbalis tidak menentukan metode spesifik. {cite:fiqh-mawsua-Kuwaitiyya-noor-v3 hlm.. 7574} Dalam hal jumlah, mereka sepakat bahwa kerikil harus kecil, seperti kerikil kecil, dan berbeda pada perkiraan terkecil: yang disukai menurut Hanafi adalah ukuran kacang besar, Malikis sebesar kacang atau biji, Shafi'i sebesar kacang panjang, dan Hanbalis antara kacang arab dan kacang hazel. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7574} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7575} Di antara keputusannya adalah melempari Jamarat dengan kerikil kobra, yang merupakan salah satu ritual Haji. Buktinya adalah perintah Nabi untuk menggunakan kerikil kobra yang digunakan untuk melempar kobra dan melarang berlebihan keagamaan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7572} dan memancing dengan kerikil tidak diperbolehkan karena itu adalah larangan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7575}"
