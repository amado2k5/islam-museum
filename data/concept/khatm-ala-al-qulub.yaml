id: concept/khatm-ala-al-qulub
class: concept
kind: doctrine
label:
  ar: "الختم على القلوب"
  en: "The sealing of hearts (khatm ala al-qulub)"
  ur: "دلوں پر مہر لگانا"
summary:
  ar: "يرى الشعراوي أن الختم على القلب حكم بألا يخرج الكفر منه ولا يدخله الإيمان، وأن هذا الختم يأتي بعد اختيار الكافر الكفر وإصراره عليه، وأن الله عالم بذلك قبل الختم، ويذكر أن القلب قُدّم في الآية على السمع والبصر لأنه موضع الإدراك الباطن {cite:tafsir-sharawi-khawatir-scan p.142} {cite:tafsir-sharawi-khawatir-scan p.143}. هذا تفسيره ويُنسب إليه."
  en: "Sha'rawi holds that sealing the heart is a judgement that the disbelief inside it does not leave and that faith does not enter. It comes after the disbeliever has chosen disbelief and persisted in it, which God knew beforehand. He notes that the heart is mentioned before hearing and sight because it is the seat of inner perception {cite:tafsir-sharawi-khawatir-scan p.142} {cite:tafsir-sharawi-khawatir-scan p.143}. This is Sha'rawi's reading and is attributed to him."
  ur: "شعراوی کے مطابق دل پر مہر لگانے کا مطلب ہے کہ اس میں موجود کفر نہیں نکلتا اور ایمان داخل نہیں ہوتا۔ یہ مہر اس وقت لگتی ہے جب کافر کفر کو اختیار کر کے اس پر اصرار کرتا ہے، اور اللہ اسے پہلے سے جانتا ہے۔ وہ کہتے ہیں کہ دل کا ذکر کان اور آنکھ سے پہلے اس لیے ہے کہ دل باطنی ادراک کا مقام ہے {cite:tafsir-sharawi-khawatir-scan p.142} {cite:tafsir-sharawi-khawatir-scan p.143}۔ یہ شعراوی کی تفسیر ہے اور ان کی طرف منسوب ہے۔"
