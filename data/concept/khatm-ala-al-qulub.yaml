id: concept/khatm-ala-al-qulub
class: concept
kind: doctrine
label:
  ar: "الختم على القلوب"
  en: "The sealing of hearts (khatm ala al-qulub)"
  ur: "دلوں پر مہر لگانا"
  es: "El sellado de los corazones (khatm ala al-qulub)"
  fr: "Le scellement des cœurs (khatm ala al-qulub)"
  tr: "Kalplerin üzerindeki mühür"
  id: "Segel di hati"
summary:
  ar: "يرى الشعراوي أن الختم على القلب حكم بألا يخرج الكفر منه ولا يدخله الإيمان، وأن هذا الختم يأتي بعد اختيار الكافر الكفر وإصراره عليه، وأن الله عالم بذلك قبل الختم، ويذكر أن القلب قُدّم في الآية على السمع والبصر لأنه موضع الإدراك الباطن {cite:tafsir-sharawi-khawatir-scan p.142} {cite:tafsir-sharawi-khawatir-scan p.143}. هذا تفسيره ويُنسب إليه."
  en: "Sha'rawi holds that sealing the heart is a judgement that the disbelief inside it does not leave and that faith does not enter. It comes after the disbeliever has chosen disbelief and persisted in it, which God knew beforehand. He notes that the heart is mentioned before hearing and sight because it is the seat of inner perception {cite:tafsir-sharawi-khawatir-scan p.142} {cite:tafsir-sharawi-khawatir-scan p.143}. This is Sha'rawi's reading and is attributed to him."
  ur: "شعراوی کے مطابق دل پر مہر لگانے کا مطلب ہے کہ اس میں موجود کفر نہیں نکلتا اور ایمان داخل نہیں ہوتا۔ یہ مہر اس وقت لگتی ہے جب کافر کفر کو اختیار کر کے اس پر اصرار کرتا ہے، اور اللہ اسے پہلے سے جانتا ہے۔ وہ کہتے ہیں کہ دل کا ذکر کان اور آنکھ سے پہلے اس لیے ہے کہ دل باطنی ادراک کا مقام ہے {cite:tafsir-sharawi-khawatir-scan p.142} {cite:tafsir-sharawi-khawatir-scan p.143}۔ یہ شعراوی کی تفسیر ہے اور ان کی طرف منسوب ہے۔"
  es: "Sha'rawi sostiene que sellar el corazón es un juicio que impide que la incredulidad en su interior se vaya y que impide que la fe entre. Esto ocurre después de que el incrédulo haya elegido la incredulidad y persistido en ella, algo que Dios conocía de antemano. Señala que el corazón se menciona antes que el oído y la vista porque es la sede de la percepción interior {cite:tafsir-sharawi-khawatir-scan p.142} {cite:tafsir-sharawi-khawatir-scan p.143}. Esta es la interpretación de Sha'rawi y se le atribuye."
  fr: "Sha'rawi soutient que sceller le cœur est un jugement signifiant que l'incroyance qui y réside ne le quitte pas et que la foi ne peut y entrer. Ce jugement intervient après que l'incroyant a choisi l'incroyance et s'y est obstinément accroché, ce que Dieu savait d'avance. Il note que le cœur est mentionné avant l'ouïe et la vue car il est le siège de la perception intérieure (voir Tafsir Sha'rawi Khawatir, p. 142 et p. 143). Telle est l'interprétation de Sha'rawi, qui lui est attribuée."
  tr: "Al-Shaarawi, kalpteki mühürün, inançsızlığın onu bırakmadığına ve inancın içine girmediğine dair bir hükmü olduğuna, bu mühürlemenin inançsızın inanmazlığı seçip ısrar ettikten sonra geldiğine ve Allah'ın bunu mühürlenmeden önce bildiğine inanır. Ayette kalbin işitme ve görmeden önce geldiğini, çünkü içsel algının yer olduğunu belirtir {atıf:tafsir-sharawi-khawatir-scan s.142} {cite:tafsir-sharawi-khawatir-scan s.143}. Bu onun yorumudur ve ona atfedilmiştir."
  id: "Al-Shaarawi percaya bahwa segel pada hati adalah aturan bahwa ketidakpercayaan tidak meninggalkannya dan iman tidak masuk ke dalamnya, dan bahwa penyegelan ini terjadi setelah orang kafir memilih ketidakpercayaan dan menegaskannya, dan bahwa Tuhan mengetahui hal ini sebelum penyegelan. Ia menyebutkan bahwa hati dalam ayat itu mendahului pendengaran dan penglihatan karena merupakan tempat persepsi batin {cite:tafsir-sharawi-khawatir-scan hlm.142} {cite:tafsir-sharawi-khawatir-scan hlm.143}. Ini adalah tafsir-sharawi-khawatir-scan hlm.143}. Ini adalah tafsirnya dan dikaitkan dengannya."
