id: concept/zij-sabi-the-ascendant-from-the-elapsed-arc
class: concept
kind: scientific
label: { ar: "الطالع ووسط السماء من القوس المنقضية في الزيج الصابي", en: "The ascendant and midheaven from the arc that has turned", ur: "گزری ہوئی قوس سے طالع اور وسط السماء", es: "El ascendente y el medio cielo del arco que se ha girado", fr: "L'ascendant et le milieu du ciel de l'arc qui s'est tourné" }
summary:
  ar: "بعد معرفة ما دار من الفلك يضيف البتاني إلى أزمان مطالع جزء الشمس في الإقليم ما دار، فيعرف الطالع على الجهة المبينة في صدر الكتاب. وله طريقة ثانية بالقوس الراجعة التي هي بعد الشمس عن خط وسط السماء، يقسمها على أزمان ساعات النهار وينقصها من ست ساعات أو يزيدها عليها، ثم ينقص القوس من المطالع المستقيمة أو يزيدها عليها فيعرف الطالع ووسط السماء. {cite:zij-sabi-nallino-byblion p.49}."
  en: "Once he knows what has turned of the sphere, al-Battani adds it to the rising times of the Sun's degree in the clime and so finds the ascendant in the way set out at the beginning of the book. A second way uses the returned arc, which is the Sun's distance from the midheaven line: he divides it by the times of the hours of the day and subtracts it from six hours or adds it to them, then subtracts the arc from the right-sphere risings or adds it to them and so finds the ascendant and midheaven. {cite:zij-sabi-nallino-byblion p.49}."
  ur: "فلک کا گزرا ہوا حصہ معلوم ہو جانے پر البتانی اسے اقلیم میں سورج کے جز کے مطالع کے اوقات پر بڑھاتے ہیں تو کتاب کے آغاز میں بیان کردہ طریقے سے طالع معلوم ہو جاتا ہے۔ دوسرا طریقہ قوس راجعہ سے ہے جو سورج کا خط وسط السماء سے بعد ہے: اسے دن کے گھنٹوں کے اوقات پر تقسیم کرتے ہیں اور چھ گھنٹوں سے گھٹاتے یا ان پر بڑھاتے ہیں، پھر قوس کو مستقیم مطالع سے گھٹاتے یا بڑھاتے ہیں تو طالع اور وسط السماء معلوم ہوتے ہیں۔ {cite:zij-sabi-nallino-byblion p.49}۔"
  es: "Una vez que conoce el giro de la esfera, al-Battani lo suma a las horas de salida del Sol en el grado del clima y así halla el ascendente según el método expuesto al principio del libro. Un segundo método utiliza el arco de retorno, que es la distancia del Sol a la línea del medio cielo: lo divide entre las horas del día y lo resta de seis horas o se lo suma, luego resta el arco a las salidas de la esfera derecha o se lo suma, y así halla el ascendente y el medio cielo. {cite:zij-sabi-nallino-byblion p.49}."
  fr: "Une fois qu'il connaît la position de la sphère, al-Battani l'ajoute aux heures de lever du Soleil dans le climat et trouve ainsi l'ascendant selon la méthode décrite au début de l'ouvrage. Une seconde méthode utilise l'arc de retour, qui correspond à la distance du Soleil à la ligne du milieu du ciel: il le divise par les heures du jour et soustrait le résultat de six heures ou l'y ajoute, puis soustrait cet arc des levers de la sphère droite ou l'y ajoute, et trouve ainsi l'ascendant et le milieu du ciel. {cite:zij-sabi-nallino-byblion p.49}."
