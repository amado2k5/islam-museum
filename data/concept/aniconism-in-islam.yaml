summary:
  ar: "اجتناب تصوير ذوات الأرواح في الفن الإسلامي الرسمي خاصة في العبادة؛ قاعدة رسمت مسار الفن الإسلامي نحو الخط والزخرفة."
  en: "The avoidance of depicting sentient beings in formal Islamic art, especially in worship; a rule that channelled Islamic art toward calligraphy and ornament."
  fr: "Le fait d’éviter de représenter les êtres doués de sensibilité dans l’art islamique officiel, notamment dans le culte. Ce principe a orienté l’art islamique vers la calligraphie et l’ornement."
  es: "La prohibición de representar seres sintientes en el arte islámico formal, especialmente en el culto; una regla que orientó el arte islámico hacia la caligrafía y la ornamentación."
