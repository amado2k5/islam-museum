id: concept/futur-al-nafs
class: concept
kind: ethical
label:
  ar: "فتور النفس عن الطاعة"
  en: "Slackening of the soul in obedience (futur)"
  ur: "طاعت میں نفس کی سستی"
summary:
  ar: "يرى عمر عبد الكافي أن النفس قد تفتر عن الطاعة لأن الإيمان يزيد وينقص، ويعدّد علامات الفتور: التكاسل عن الطاعات، وقسوة القلب، وإضاعة الوقت، والفوضى في العمل، وعدم التأثر بالقرآن، ونقد أعمال الخير، وكثرة الأماني، واستصغار المعاصي."
  en: "Omar Abdelkafy holds that the soul may slacken in obedience because faith rises and falls, and lists the signs of slackening: laziness in acts of obedience, hardness of heart, wasted time, disorder in work, being unmoved by the Qur'an, disparaging good deeds, many idle wishes, and belittling sins."
  ur: "عمر عبد الکافی کے نزدیک نفس طاعت میں سست پڑ سکتا ہے کیونکہ ایمان بڑھتا اور گھٹتا ہے، اور وہ سستی کی علامات گنواتے ہیں: طاعات میں کاہلی، دل کی سختی، وقت کا ضیاع، کام میں بے ترتیبی، قرآن سے متاثر نہ ہونا، نیک کاموں پر تنقید، بہت سی خواہشیں، اور گناہوں کو چھوٹا سمجھنا۔"
