label:
  ar: "الكالئ"
  en: "Deferred debt (kali)"
  ur: "کالی (ادھار)"
summary:
  ar: "الكالئ في اللغة النسيئة والسلف، وفي اصطلاح الفقهاء الدين. ومن البيوع الممنوعة بيع الكالئ بالكالئ، أي بيع الدين بالدين، ويستند إلى حديث ابن عمر في النهي، وقد ضعف ابن حجر بعض طرقه، ونقل ابن المنذر الإجماع على منعه. وحكمة المنع عند القرافي أن العقد إذا شغل الذمتين توجهت المطالبة من الجهتين فكثرت الخصومات. أما بيع الكالئ بالعين ففيه تفصيل واختلاف بين الفقهاء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13163} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13164}"
  en: "In the lexicon kali is deferral and loan; the jurists use it for debt. Among the forbidden sales is selling debt for debt (bay' al-kali bil-kali), based on a report of Ibn Umar; Ibn Hajar weakened one route of the report, and Ibn al-Mundhir reports agreement that debt for debt is not permitted. Al-Qarafi's reason is that when a contract burdens both sides' obligations, claims come from both directions and disputes multiply. The sale of debt for a present specific item is a matter of detail and disagreement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13163} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13164}"
  ur: "لغت میں کالی ادھار اور قرض کو کہتے ہیں، اور فقہاء اصطلاح میں اس سے مراد دین ہے۔ ممنوع بیوع میں سے ایک کالی بالکالی، یعنی دین کو دین کے بدلے بیچنا ہے، جس کی دلیل ابن عمر کی روایت ہے؛ ابن حجر نے اس کی ایک سند کو ضعیف کہا، اور ابن المنذر کے مطابق دین بالدین کے عدم جواز پر اجماع نقل ہوا ہے۔ قرافی کے نزدیک علت یہ ہے کہ جب عقد دونوں ذمہ داریوں کو باندھے تو مطالبہ دونوں طرف سے آتا ہے اور جھگڑے بڑھتے ہیں۔ دین کو کسی موجود معین چیز کے بدلے بیچنے کی تفصیل اور فقہاء کا اختلاف الگ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13163} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13164}"
