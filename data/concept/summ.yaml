id: concept/summ
class: concept
kind: legal
label:
  ar: "السُّمّ"
  en: "Summ (poison) and its rulings"
summary:
  ar: "السم في اللغة المادة القاتلة، وجمعه سموم وسمام، ولا يخرج الاصطلاح عن المعنى اللغوي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9828} تحرم مباشرة تناول ما يقتل من السم بلا حاجة، ويختلف الفقهاء في نجاسته وفي جواز بيعه، ويجوز التداوي به إن غلبت السلامة من ضرره. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9828} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9830} وفي القتل به أقوال للفقهاء تتعلق بالقصاص والدية والتعزير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9830} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9831}"
  en: "In the lexicon summ is a deadly substance, plural sumum or sammam, and the technical sense does not depart from it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9828} Taking a poison that kills without need is forbidden by agreement; the jurists differ on its purity and on the sale of it, and treatment with it is allowed where its harm is likely to be avoided. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9828} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9830} On killing by poison the jurists give several views concerning retaliation, blood-money and discretionary punishment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9830} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.9831}"
