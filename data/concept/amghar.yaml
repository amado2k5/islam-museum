id: concept/amghar
class: concept
kind: term
label:
  ar: "أمغار"
  en: "Amghar (Berber elder and chief)"
  fr: "Amghar (ancien et chef berbère)"
  es: "Amghar (anciano y jefe bereber)"
  ur: "امغر ⁦(بربر بزرگ اور سردار)⁩"
summary:
  ar: "أمغار، كلمة بربرية تقابل العربية «شيخ»، ومعناها «الكبير بالسن أو بالسلطة»؛ وعند الطوارق هو زعيم مجموعة قبلية يتوسط بين الأمنوكال وقبيلته، وفي القبائل وعند أمازيغ المغرب هو الرئيس المنتخب من الجماعة وممثلها التنفيذي {cite:encyclopaedia-of-islam-2 vol. 1 p. 455}."
  en: "Amghar, a Berber word corresponding to the Arabic shaykh, meaning 'an elder, by virtue of age or authority'. Among the Tuareg it is the chief of a tribal group who acts as intermediary between the amenokal and his tribe. Among the Kabyles and the Imazighen of Morocco it is the president elected by the jama'a and its executive agent {cite:encyclopaedia-of-islam-2 vol. 1 p. 455}."
  fr: "Amghar, mot berbère correspondant à l’arabe shaykh, signifie « un ancien, par l’âge ou par l’autorité ». Chez les Touaregs, c’est le chef d’un groupe tribal qui sert d’intermédiaire entre l’amenokal et sa tribu. Chez les Kabyles et les Imazighen du Maroc, c’est le président élu par la jama‘a et celui qui exécute ses décisions {cite:encyclopaedia-of-islam-2 vol. 1 p. 455}."
  es: "Amghar, palabra bereber que corresponde al árabe shaykh, significa «anciano, por edad o autoridad». Entre los tuareg, es el jefe de un grupo tribal que actúa como intermediario entre el amenokal y su tribu. Entre los cabilios y los imazighen de Marruecos, es el presidente elegido por la jama'a y su agente ejecutivo {cite:encyclopaedia-of-islam-2 vol. 1 p. 455}."
  ur: "امغر، ایک بربر لفظ جو عربی شیخ سے مشابہت رکھتا ہے، جس کا مطلب ہے 'عمر یا اختیار کے لحاظ سے بزرگ'۔ تواریگ کے درمیان یہ ایک قبائلی گروہ کا سردار ہے جو امینوکل اور اس کے قبیلے کے درمیان ثالث کا کام کرتا ہے۔ مراکش کے کابلیوں اور امازیجن میں سے یہ جماعت اور اس کے ایگزیکٹو ایجنٹ کے ذریعہ منتخب ہونے والا صدر ہے۔ 1 ص۔ 455}"
