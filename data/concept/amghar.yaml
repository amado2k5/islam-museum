label:
  ar: "أمغار"
  en: "Amghar (Berber elder and chief)"
summary:
  ar: "أمغار، كلمة بربرية تقابل العربية «شيخ»، ومعناها «الكبير بالسن أو بالسلطة»؛ وعند الطوارق هو زعيم مجموعة قبلية يتوسط بين الأمنوكال وقبيلته، وفي القبائل وعند أمازيغ المغرب هو الرئيس المنتخب من الجماعة وممثلها التنفيذي {cite:encyclopaedia-of-islam-2 vol. 1 p. 455}."
  en: "Amghar, a Berber word corresponding to the Arabic shaykh, meaning 'an elder, by virtue of age or authority'. Among the Tuareg it is the chief of a tribal group who acts as intermediary between the amenokal and his tribe. Among the Kabyles and the Imazighen of Morocco it is the president elected by the jama'a and its executive agent {cite:encyclopaedia-of-islam-2 vol. 1 p. 455}."
