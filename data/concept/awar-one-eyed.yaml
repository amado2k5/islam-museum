label:
  ar: "العَوَر"
  en: "One-eyed defect ('awar) and its effect on sacrifice, marriage, manumission and injury"
  ur: "عور (کانا پن)"
summary:
  ar: "العور في اللغة ذهاب حس إحدى العينين، والفقهاء يستعملونه بمعناه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11908}. ويفرق عن العشا وهو سوء البصر بالليل، وعن العمش وهو ضعف الرؤية مع سيلان الدمع، وعن الحول، وعن العمى الذي يشمل العينين {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11909}. ولا تجزئ العوراء في الأضحية عند الجمهور إذا ذهبت عينها، وأجزأها الحنفية إذا كان بياض في العين لم يذهب الحس {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11909} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11910}. ولا يثبت العور حق فسخ النكاح إلا إذا اشترط أحد الزوجين السلامة منه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11910}. ويجزئ إعتاق الأعور في الكفارات عند جمهور الفقهاء {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11911}. وفي جناية الأعور والصحيح، لا يؤخذ الصحيح بالعوراء، وفيها حكومة أو دية كاملة عند المالكية، وعند الحنابلة يأخذ نصف الدية، وعند الحنفية والشافعية تجب دية كاملة على الجاني {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11911} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11912}. ويقتص من فاقئ عين الصحيح للأعور عند الحنفية والشافعية، ويخير المالكية بين القصاص والدية {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11912}."
  en: "'Awar is the loss of sight in one eye; the jurists use the word in its plain sense {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11908}. It is distinguished from 'asha, night blindness, from 'amash, weak sight with a watering eye, from hawal, squint, and from 'ama, blindness of both eyes {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11909}. A one-eyed animal is not valid for sacrifice where the eye is gone, though the Hanafis allow it where the eye is only white and still sees {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11909} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11910}. Defect of one eye gives no option to annul the marriage unless one spouse stipulated soundness {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11910}. A one-eyed slave may be freed in expiation, by the majority {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11911}. For injury to a sound-eyed person by a one-eyed man, the rulings differ: the Hanafis and Shafi'is require a full blood-money, the Hanbalis require half, and the Malikis give the victim a choice {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11911} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11912}. The Hanafis and Shafi'is allow retaliation on the sound eye of a person who blinds a one-eyed man's only sound eye, while the Malikis give the choice between retaliation and blood-money {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11912}."
