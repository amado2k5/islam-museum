id: concept/awar-one-eyed
class: concept
kind: legal
label:
  ar: "العَوَر"
  en: "One-eyed defect ('awar) and its effect on sacrifice, marriage, manumission and injury"
  fr: "Le défaut d’un œil ('awar) et son effet sur le sacrifice, le mariage, l’affranchissement et les blessures"
  ur: "عور ⁦(کانا پن)⁩"
  es: "Defecto de un solo ojo ('awar) y su efecto en el sacrificio, el matrimonio, la manumisión y las lesiones."
  tr: "tek gözlü"
  id: "bermata satu"
summary:
  ar: "العور في اللغة ذهاب حس إحدى العينين، والفقهاء يستعملونه بمعناه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11908}. ويفرق عن العشا وهو سوء البصر بالليل، وعن العمش وهو ضعف الرؤية مع سيلان الدمع، وعن الحول، وعن العمى الذي يشمل العينين {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11909}. ولا تجزئ العوراء في الأضحية عند الجمهور إذا ذهبت عينها، وأجزأها الحنفية إذا كان بياض في العين لم يذهب الحس {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11909} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11910}. ولا يثبت العور حق فسخ النكاح إلا إذا اشترط أحد الزوجين السلامة منه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11910}. ويجزئ إعتاق الأعور في الكفارات عند جمهور الفقهاء {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11911}. وفي جناية الأعور والصحيح، لا يؤخذ الصحيح بالعوراء، وفيها حكومة أو دية كاملة عند المالكية، وعند الحنابلة يأخذ نصف الدية، وعند الحنفية والشافعية تجب دية كاملة على الجاني {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11911} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11912}. ويقتص من فاقئ عين الصحيح للأعور عند الحنفية والشافعية، ويخير المالكية بين القصاص والدية {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11912}."
  en: "'Awar is the loss of sight in one eye; the jurists use the word in its plain sense {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11908}. It is distinguished from 'asha, night blindness, from 'amash, weak sight with a watering eye, from hawal, squint, and from 'ama, blindness of both eyes {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11909}. A one-eyed animal is not valid for sacrifice where the eye is gone, though the Hanafis allow it where the eye is only white and still sees {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11909} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11910}. Defect of one eye gives no option to annul the marriage unless one spouse stipulated soundness {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11910}. A one-eyed slave may be freed in expiation, by the majority {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11911}. For injury to a sound-eyed person by a one-eyed man, the rulings differ: the Hanafis and Shafi'is require a full blood-money, the Hanbalis require half, and the Malikis give the victim a choice {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11911} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11912}. The Hanafis and Shafi'is allow retaliation on the sound eye of a person who blinds a one-eyed man's only sound eye, while the Malikis give the choice between retaliation and blood-money {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11912}."
  fr: "'Awar est la perte de la vue d’un œil ; les juristes emploient le mot dans son sens courant {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11908}. On le distingue de 'asha, la cécité nocturne, de 'amash, la vue faible avec larmoiement, de hawal, le strabisme, et de 'ama, la cécité des deux yeux {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11909}. Un animal borgne n’est pas valable pour le sacrifice si l’œil a disparu, bien que les hanafites l’admettent lorsque l’œil est seulement blanc et voit encore {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11909} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11910}. Le défaut d’un œil ne donne pas d’option d’annulation du mariage, sauf si l’un des époux a stipulé l’intégrité physique {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11910}. Selon la majorité, un esclave borgne peut être affranchi en expiation {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11911}. Pour une blessure infligée à une personne ayant ses deux yeux valides par un homme borgne, les règles diffèrent : les hanafites et les shafi’ites exigent le prix du sang entier, les hanbalites la moitié, et les malikites donnent le choix à la victime {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11911} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11912}. Les hanafites et les shafi’ites autorisent le talion sur l’œil valide d’une personne qui rend aveugle l’unique œil valide d’un borgne, tandis que les malikites donnent le choix entre talion et prix du sang {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11912}."
  es: "'Awar es la pérdida de la vista en un ojo; los juristas usan la palabra en su sentido literal {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11908}. Se distingue de 'asha, ceguera nocturna, de 'amash, visión débil con ojo lloroso, de hawal, estrabismo, y de 'ama, ceguera de ambos ojos {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11909}. Un animal tuerto no es válido para el sacrificio cuando el ojo ha desaparecido, aunque los Hanafi lo permiten cuando el ojo es solo blanco y aún ve {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11909} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11910}. El defecto de un ojo no da opción a anular el matrimonio a menos que uno de los cónyuges estipule su buena salud {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11910}. Un esclavo tuerto puede ser liberado como expiación, por mayoría {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11911}. Por lesiones a una persona con un ojo sano por parte de un hombre tuerto, las normas difieren: los hanafíes y los shafiíes exigen una indemnización completa por la sangre, los hanbalíes exigen la mitad, y los malikíes dan a la víctima la opción de elegir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11911} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11912}. Los hanafíes y los shafiíes permiten la represalia sobre el ojo sano de una persona que ciega el único ojo sano de un hombre tuerto, mientras que los malikíes dan la opción entre la represalia y el dinero de sangre {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11912}."
  ur: "'آوار ایک آنکھ کی بینائی کا کھو جانا ہے۔ فقہاء اس لفظ کو اس کے سادہ معنوں میں استعمال کرتے ہیں {حوالہ: فقہ معاویہ کویتیہ نور v3 صفحہ 11908}۔ یہ اشعار، رات کا نابینا پن، اماش سے، پانی بھرنے والی آنکھ کے ساتھ کمزور بینائی سے، حول، بھیانک، اور اما، دونوں آنکھوں کے اندھے پن سے ممتاز ہے۔ ایک آنکھ والے جانور کی قربانی جائز نہیں جہاں آنکھ چلی گئی ہو حالانکہ احناف اس کی اجازت دیتے ہیں جہاں آنکھ صرف سفید ہو اور پھر بھی دیکھتا ہو ایک آنکھ کی خرابی شادی کو فسخ کرنے کا کوئی اختیار نہیں دیتی جب تک کہ ایک شریک حیات درستگی کی شرط نہ لگائے۔ کفارہ میں ایک آنکھ والا غلام آزاد کیا جا سکتا ہے، جمہور {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 11911}۔ ایک آنکھ والے آدمی کی طرف سے بے آواز شخص کو چوٹ لگنے کے لیے احکام میں اختلاف ہے: حنفیہ اور شافعیہ کو پوری خون کی رقم درکار ہے، حنبلی کو نصف اور مالکی شکار کو اختیار دیتے ہیں صفحہ 11912}۔ حنفیہ اور شافعی ایک آنکھ والے آدمی کی واحد آنکھ کو اندھا کرنے والے کی صحیح آنکھ پر انتقام لینے کی اجازت دیتے ہیں، جب کہ مالکی انتقام اور خونریزی میں سے ایک کا انتخاب کرتے ہیں۔"
  tr: "Dilbilimde 'awr', bir gözün duyusunun kaybı anlamına gelir ve hukukçular bunu anlamıyla kullanırlar {cite:) fiqh-mawsua-kuveytiyya-noor-v3 s.11908}. Gece zayıf görme olan 'işa'dan, gözyaşlarıyla zayıf görme olan 'amash'dan ve gözleri içeren 'aṣlāw'dan {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11909} ile ayrılır. 'Awrah, çoğunluğun gözü kaybedilirse kurban için yeterli değildir; Hanefi ise gözde beyazlık varsa ve his kaybolmazsa yeterlidir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11909} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11910}. Evliliğin iptal hakkı, eşlerden biri ondan güvenlik şartı koşmadıkça tesis edilmez {alıntı:fiqh-mawsua-kuveytiyya-noor-v3 s.11910}. Çoğu hukukçuya göre tek 'Awr'ın serbest bırakılması, kefaret için yeterlidir {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.11911}. Tek bir adam ve sağ kişi durumunda, doğru kişi tek gözlü olarak kabul edilmez; Maliki okuluna göre tam yargı veya kan parası vardır, Hanbalilere göre ise kan parasının yarısı alınır ve Hanafi ile Şafiilere göre suçluya tam kan parası ödenir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11911} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11912}. Ayrıca, Hanafi ve Şafi'lere göre doğru gözün üstünde olanları cezalandırır ve Malikiler kısa ile kan parası arasında seçim yapar {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11912}."
  id: "Dalam linguistik, 'awr' berarti hilangnya sensasi satu mata, dan para ahli hukum menggunakannya dengan maknanya {cite:Fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11908}. Ini dibedakan dari 'isha,' yang berarti penglihatan buruk di malam hari, dari 'amash,' yang merupakan penglihatan lemah dengan air mata, dan dari 'aṣlāw,' yang mencakup mata {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11909}. 'awrah' tidak cukup dalam pengorbanan oleh mayoritas jika matanya hilang, dan Hanafi cukup jika ada putih di mata dan sensasi tidak hilang {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11909} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11910}. Hak untuk membatalkan pernikahan tidak terbukti kecuali salah satu pasangan memberikan syarat perlindungan darinya {cite:Fiqh-Mawsua-Kuwaitiyya-Noor-V3 hlm.11910}. Pembebasan satu-'Awr sudah cukup sebagai penebusan menurut mayoritas ahli hukum {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11911}. Dalam kasus satu-satu-orang dan hak, orang yang benar tidak dianggap bermata satu, dan ada penghakiman penuh atau uang darah menurut mazhab Maliki, dan menurut Hanbali, setengah uang darah diambil, dan menurut Hanafi dan Shafi'i, uang darah penuh harus dibayar kepada pelaku {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11911} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11912}. Ia juga menghukum mereka yang berada di atas mata yang benar, menurut Hanafi dan Shafi'i, dan Malik memberikan pilihan antara qisa dan uang darah {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.11912}."
