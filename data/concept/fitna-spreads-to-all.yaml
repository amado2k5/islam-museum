id: concept/fitna-spreads-to-all
class: concept
kind: ethical
label:
  ar: "الفتنة تعم المذنب وغيره"
  en: "Corruption spreads beyond the guilty"
  es: "La corrupción se extiende más allá de los culpables."
  fr: "La corruption s'étend au-delà des coupables."
  ur: "بدعنوانی مجرموں سے آگے پھیلتی ہے۔"
summary:
  ar: "يقرر عرجون أن عذاب الله للمفسدين قد يعم من لم يذنب إذا تفشى الفساد، وأن الناس يُميزون يوم الحشر على حسب نياتهم {cite:sunan-allah-fi-al-mujtama-azhar p. 50}. والراضي بالشر شريك فاعله، وترك النهي عن المنكر يجعل الساكتين شركاء في اللعنة {cite:sunan-allah-fi-al-mujtama-azhar p. 51}. ويقيّد الكتاب ذلك بأن النجاة لمن ينهون عن السوء {cite:sunan-allah-fi-al-mujtama-azhar p. 50}."
  en: "Arjun holds that when corruption spreads, God's punishment can reach people who did not commit the wrong. Distinction is made at the gathering according to intention, and those who accept evil share in its guilt; those who forbid wrong are saved {cite:sunan-allah-fi-al-mujtama-azhar p. 50-51}."
  es: "Arjun sostiene que cuando la corrupción se extiende, el castigo de Dios puede alcanzar a quienes no cometieron la falta. En la asamblea se distingue según la intención, y quienes aceptan el mal comparten su culpa; quienes lo prohíben se salvan {cite:sunan-allah-fi-al-mujtama-azhar p. 50-51}."
  fr: "Arjun soutient que lorsque la corruption se propage, le châtiment divin peut atteindre des innocents. Lors de l'assemblée, une distinction est faite selon l'intention: ceux qui acceptent le mal en deviennent complices, tandis que ceux qui l'interdisent sont sauvés (Sunan Allah fi al-Mujtama Azhar, p. 50-51)."
  ur: "ارجن کا خیال ہے کہ جب بدعنوانی پھیلتی ہے تو خدا کی سزا ان لوگوں تک پہنچ سکتی ہے جنہوں نے غلط کام نہیں کیا۔ اجتماع میں نیت کے مطابق فرق کیا جاتا ہے، اور جو لوگ برائی کو قبول کرتے ہیں وہ اس کے گناہ میں شریک ہوتے ہیں۔ برائی سے منع کرنے والے نجات پا گئے 50-51}۔"
