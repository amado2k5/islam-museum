label:
  ar: "الفتنة تعم المذنب وغيره"
  en: "Corruption spreads beyond the guilty"
summary:
  ar: "يقرر عرجون أن عذاب الله للمفسدين قد يعم من لم يذنب إذا تفشى الفساد، وأن الناس يُميزون يوم الحشر على حسب نياتهم {cite:sunan-allah-fi-al-mujtama-azhar p. 50}. والراضي بالشر شريك فاعله، وترك النهي عن المنكر يجعل الساكتين شركاء في اللعنة {cite:sunan-allah-fi-al-mujtama-azhar p. 51}. ويقيّد الكتاب ذلك بأن النجاة لمن ينهون عن السوء {cite:sunan-allah-fi-al-mujtama-azhar p. 50}."
  en: "Arjun holds that when corruption spreads, God's punishment can reach people who did not commit the wrong. Distinction is made at the gathering according to intention, and those who accept evil share in its guilt; those who forbid wrong are saved {cite:sunan-allah-fi-al-mujtama-azhar p. 50-51}."
