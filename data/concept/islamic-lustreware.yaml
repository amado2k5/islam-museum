summary:
  ar: "فخار ذو بريق معدني طُوّر في العراق ومصر الفاطمية ثم انتقل إلى فارس وإسبانيا الإسلامية؛ من أثمن صنائع الفخار الإسلامي."
  en: "Metallic-sheened pottery developed in Iraq and Fatimid Egypt, then travelling to Persia and Islamic Spain; among the most prized Islamic ceramics."
  es: "La cerámica con brillo metálico se desarrolló en Irak y el Egipto fatimí, para luego extenderse a Persia y la España islámica; se encuentra entre las cerámicas islámicas más apreciadas."
  fr: "La poterie à reflets métalliques s'est développée en Irak et en Égypte fatimide, puis s'est répandue en Perse et en Espagne islamique; elle compte parmi les céramiques islamiques les plus prisées."
  ur: "دھاتی چمکدار مٹی کے برتن عراق اور فاطمی مصر میں تیار ہوئے، پھر فارس اور اسلامی اسپین کا سفر کیا۔ سب سے قیمتی اسلامی سیرامکس میں سے۔"
  tr: "Metalik parlak çömlek Fatımi Irak ve Mısır'da geliştirilmiş, ardından İran ve İslami İspanya'ya taşınmıştır; en değerli İslami çömlek el sanatlarından biridir."
  id: "Keramik berkilau logam berkembang di Irak dan Mesir Fatimiyah, kemudian pindah ke Persia dan Spanyol Islam; ini adalah salah satu kerajinan keramik Islam yang paling berharga."
