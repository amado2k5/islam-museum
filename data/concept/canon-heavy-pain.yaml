summary:
  ar: "سبب الوجع الثقيل ورم في عضو غير حساس كالرئة والكلية والطحال ينجذب إلى أسفل بثقله فيجذب العضو باللفافة والغلافة، أو ورم في عضو حساس أبطل ألمه حسّه كالسرطان في فم المعدة {cite:canon-ibn-sina-print-v1 p.150}."
  en: "Heavy pain is caused by a swelling in an insensitive organ such as the lung, kidney or spleen, which sinks by its weight and drags the organ by its wrappings, or by a swelling in a sensitive organ whose own pain has abolished its sense, such as a cancer at the mouth of the stomach {cite:canon-ibn-sina-print-v1 p.150}."
