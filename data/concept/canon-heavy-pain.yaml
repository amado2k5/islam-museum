id: concept/canon-heavy-pain
class: concept
kind: scientific
label:
  ar: "الوجع الثقيل عند ابن سينا"
  en: "Heavy pain in the Canon"
  fr: "Douleur pesante dans le Canon"
  ur: "بھاری درد، قانون کے مطابق"
  es: "Dolor intenso en el Canon"
  tr: "İbn Sina'daki ağır acı"
  id: "Rasa sakit yang berat di Ibn Sina"
summary:
  ar: "سبب الوجع الثقيل ورم في عضو غير حساس كالرئة والكلية والطحال ينجذب إلى أسفل بثقله فيجذب العضو باللفافة والغلافة، أو ورم في عضو حساس أبطل ألمه حسّه كالسرطان في فم المعدة {cite:canon-ibn-sina-print-v1 p.150}."
  en: "Heavy pain is caused by a swelling in an insensitive organ such as the lung, kidney or spleen, which sinks by its weight and drags the organ by its wrappings, or by a swelling in a sensitive organ whose own pain has abolished its sense, such as a cancer at the mouth of the stomach {cite:canon-ibn-sina-print-v1 p.150}."
  fr: "Le livre l’attribue à un gonflement d’organe insensible, poumon, rein ou rate, descendant par son poids et tirant l’organe par ses enveloppes ; ou d’organe sensible dont la douleur abolit la sensation, tel un cancer de l’orifice gastrique {cite:canon-ibn-sina-print-v1 p.150}."
  es: "El dolor intenso es causado por una inflamación en un órgano insensible como el pulmón, el riñón o el bazo, que se hunde por su peso y arrastra el órgano por sus envolturas, o por una inflamación en un órgano sensible cuyo propio dolor ha anulado su sensibilidad, como un cáncer en la boca del estómago {cite:canon-ibn-sina-print-v1 p.150}."
  ur: "شدید درد کسی غیر حساس عضو جیسے پھیپھڑوں، گردے یا تلی میں سوجن کی وجہ سے ہوتا ہے، جو اپنے وزن سے ڈوب جاتا ہے اور عضو کو لپیٹ کر کھینچتا ہے، یا کسی ایسے حساس عضو میں سوجن سے ہوتا ہے جس کے درد نے اپنی حس ختم کر دی ہو، جیسے کہ معدہ کے منہ کا کینسر۔"
  tr: "Yoğun ağrının nedeni, ağırlığıyla aşağı çekilen akciğer, böbrek veya dalak gibi duyarsız bir organda bulunan ve fasiya ile kılıflı organı çeken tümördür veya hassas bir organda ağrı hissi ortadan kaldıran bir tümördür, örneğin mide ağız kanseri {cite:canon-ibn-sina-print-v1 s.150}."
  id: "Penyebab nyeri berat adalah tumor pada organ yang tidak sensitif seperti paru-paru, ginjal, atau limpa, yang ditarik ke bawah oleh beratnya, menarik organ dengan fasia dan selubung, atau tumor pada organ sensitif yang rasa sakitnya telah menghilangkan sensasi, seperti kanker di mulut lambung {cite:canon-ibn-sina-print-v1 hlm.150}."
