label:
  ar: الحديث القدسي
  en: Sacred hadith (hadith qudsi)
summary:
  ar: "الحديث القدسي ما رواه النبي عن ربه عز وجل، ويُعرف في الأسانيد بصيغة «فيما يروي عن ربه» كما في حديث أبي ذر «يا عبادي إني حرمت الظلم على نفسي» أخرجه مسلم {cite:sahih-muslim 2577} — وهو أول حديث قدسي في الأربعين النووية — وفي لفظ الترمذي تصريح «يقول الله تعالى»؛ وقال الإمام أحمد إنه أشرف حديث لأهل الشام، وكان أبو إدريس الخولاني إذا حدث به جثا على ركبتيه كما نقل ذلك عنه سعيد بن عبد العزيز راويه عن ربيعة بن يزيد عنه."
  en: "A hadith qudsi is what the Prophet related from his Lord, marked in the chains by the formula 'among what he relates from his Lord' — as in Abu Dharr's 'O My servants, I have forbidden injustice to Myself', transmitted by Muslim (2577), the first sacred hadith in al-Nawawi's Forty — while al-Tirmidhi's wording states 'God Almighty says' explicitly; the Imam Ahmad called it the noblest hadith of the people of Syria, and its narrator Abu Idris al-Khawlani would kneel on his knees whenever he transmitted it, as Sa'id ibn Abd al-Aziz related of him from Rabi'a ibn Yazid."
