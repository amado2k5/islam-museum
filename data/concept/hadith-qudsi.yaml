label:
  ar: الحديث القدسي
  en: Sacred hadith (hadith qudsi)
summary:
  ar: "الحديث القدسي ما رواه النبي عن ربه، ويُعرف في الأسانيد بصيغة «فيما يروي عن ربه»، ويسميه بعضهم الحديث الإلهي أو الرباني تمييزاً له من الحديث النبوي. وتذكر دائرة المعارف الإسلامية أنه يفترق عن القرآن في أنه لا يُتلى في الصلاة ولا يشترط له الطهارة لمسّه، وأنه قد يأتي بالإلهام أو في المنام لا بجبريل بالضرورة. ولا يشكل قسماً مستقلاً في كتب الحديث، وقد جُمعت فيه مجموعات منها «الإتحافات السنية» للمدني و«مشكاة الأنوار» لابن العربي."
  en: "A hadith qudsi is what the Prophet related from his Lord, marked in the chains by the formula 'among what he relates from his Lord', and also called divine or lordly tradition to set it apart from the prophetic hadith. The Encyclopaedia of Islam notes that, unlike the Qur'an, it is not recited in the prayer and may be touched without ritual purity, and that it may come by inspiration or in a dream rather than necessarily through Gabriel. It forms no separate group in the books of tradition, but collections exist, among them al-Madani's al-Ithafat al-saniyya and Ibn al-Arabi's Mishkat al-anwar."
  ur: "حدیث قدسی وہ ہے جو نبی نے اپنے رب سے روایت کی، اور اسناد میں «فیما یروی عن ربہ» کے الفاظ سے پہچانی جاتی ہے؛ اسے حدیثِ نبوی سے ممتاز کرنے کے لیے الٰہی یا ربانی حدیث بھی کہا جاتا ہے۔ اسلامی دائرۃ المعارف بتاتی ہے کہ قرآن کے برخلاف یہ نماز میں نہیں پڑھی جاتی اور بے طہارت چھونے میں حرج نہیں، اور یہ ضروری نہیں کہ جبریل کے ذریعے آئے، الہام یا خواب سے بھی آ سکتی ہے۔ کتبِ حدیث میں اس کا الگ گروہ نہیں، البتہ اس کے مجموعے ہیں، جن میں المدنی کی «الاتحافات السنیہ» اور ابن العربی کی «مشکاۃ الانوار» شامل ہیں۔"
