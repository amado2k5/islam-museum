summary:
  ar: "يذكر ابن سينا أن الوداج الغائر يلزم المريء ويصعد حتى الدرز اللامي، ثم يدخل جوف القحف ويتفرق في غشائي الدماغ، وينزل إلى الدماغ ويجتمع في الوضع الواسع المعروف بالمعصرة، ثم تمتد عروق إلى البطنين المقدمين وتنسج الشبكة المشيمية {cite:canon-ibn-sina-print-v1 pp.90-91}."
  en: "Ibn Sina says the deep jugular vein follows the gullet and rises to the lambdoid suture, enters the cranial cavity and spreads in the two brain membranes, descends into the brain and gathers in the wide place called the press, from which vessels extend to the front ventricles and weave the choroid net {cite:canon-ibn-sina-print-v1 pp.90-91}."
