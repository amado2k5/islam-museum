summary:
  ar: "يعرض شكيب أرسلان في فصل الجامعة الإسلامية أن الطريقة النقشبندية امتدت من أواسط آسيا شرقاً حتى بلغت الصين، وأن مسلمي تركستان الصينية ويُنان ثاروا ثورات كبرى في القرن التاسع عشر، وأن الثورات في جزر الهند الشرقية الهولندية اشتعلت في هذه المدة كذلك. يرى أن هذه الثورات كانت تشترك في العداء للغرب وتطلب غاية واحدة، لكنها افتقرت إلى التنظيم وإلى ربط حلقاتها المتفرقة. يعرض هذا كوصف لحركات متفرقة، ولا يبحث في أسباب كل ثورة على حدة، وهو يتضمن رأي المؤلف في نقص التنظيم."
  en: "In the Pan-Islamic chapter Arslan says the Naqshbandi order spread east from Central Asia as far as China, where Muslims in Chinese Turkestan and Yunnan rose in major revolts, and that the Dutch East Indies had a sequence of revolts in the same period. He argues that these movements shared hostility to the West and a common aim but lacked organisation and coordination. He describes scattered uprisings and does not examine the causes of each. The judgement that they lacked organisation is his."
