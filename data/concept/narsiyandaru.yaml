  ur: "نرسیاندارو ایک اندراج ہے جس میں مصنف کا خیال ہے کہ عربوں نے نام بگاڑ دیا ہے: صحیح برسیان دارو ہے، با کے ساتھ نہ کہ نون کے، یعنی چرواہے کی لاٹھی، اور وہ اس پر بعد میں گفتگو کا وعدہ کرتا ہے {cite:canon-ibn-sina-print-v1 p.580}۔"
