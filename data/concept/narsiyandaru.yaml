summary:
  ar: "نرسياندارو مدخل في الكتاب يظن مؤلفه أن فيه تصحيفاً من العرب، وأن صوابه برسيان دارو بالباء لا بالنون، وهو عصا الراعي، ويعد بالكلام فيه فيما بعد {cite:canon-ibn-sina-print-v1 p.580}."
