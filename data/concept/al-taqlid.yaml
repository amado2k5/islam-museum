id: concept/al-taqlid
class: concept
kind: doctrine
tags: [madhahib-browser, mh-mafahim]
label:
  ar: التقليد وذم الجمود على الموروث
  en: Taqlid (blind imitation of inherited views)
  fr: "Taqlid (imitation aveugle des opinions héritées)"
summary:
  ar: "ينكر الشيخ شلتوت التقليد، أي توارث العقائد والآراء عن الآباء والأجداد دون نظر واستدلال، ويذكر أن القرآن ذمه في آيات كثيرة {cite:azhar-quran-building-society-shaltut p. 57}. ويرى أن الجمود على آراء المتقدمين لمجرد أنهم متقدمون يصادم قانون النمو الفكري كما يصادم نمو الكائنات، ويسلب الإنسان مزية التمييز بين الحق والباطل {cite:azhar-quran-building-society-shaltut p. 58}{cite:azhar-quran-building-society-shaltut p. 59}. ويعد هذا الجمود جناية على الفطرة البشرية وإهداراً لحجة الله على عباده {cite:azhar-quran-building-society-shaltut p. 59}. ويعزو المؤلف ما أصاب المسلمين من تفرق وخرافة إلى أن حمى التقليد تولدت في أدمغتهم بعد أن كانوا ينظرون ويبحثون ويطلبون البرهان {cite:azhar-quran-building-society-shaltut p. 60}."
  fr: "Le cheikh Shaltout rejette le taqlid, c’est-à-dire la transmission des croyances et des opinions de père en fils sans examen ni raisonnement, et rappelle que le Coran le blâme dans de nombreux versets {cite:azhar-quran-building-society-shaltut p. 57}. À ses yeux, se figer dans les opinions des anciens au seul motif qu’ils nous ont précédés heurte la loi du développement de la pensée comme celle du développement des êtres vivants, et prive l’être humain de la faculté de distinguer le vrai du faux {cite:azhar-quran-building-society-shaltut p. 58}{cite:azhar-quran-building-society-shaltut p. 59}. Il considère cette rigidité comme une atteinte à la nature humaine et une mise à néant de la preuve que Dieu fait valoir auprès de ses serviteurs {cite:azhar-quran-building-society-shaltut p. 59}. L’auteur attribue les divisions et les superstitions qui ont atteint les musulmans à la fièvre de l’imitation qui s’est emparée de leurs esprits, alors qu’ils avaient auparavant coutume d’examiner, de rechercher et de demander des preuves {cite:azhar-quran-building-society-shaltut p. 60}."
