label:
  ar: التقليد وذم الجمود على الموروث
  en: Taqlid (blind imitation of inherited views)
summary:
  ar: "ينكر الشيخ شلتوت التقليد، أي توارث العقائد والآراء عن الآباء والأجداد دون نظر واستدلال، ويذكر أن القرآن ذمه في آيات كثيرة {cite:azhar-quran-building-society-shaltut p. 57}. ويرى أن الجمود على آراء المتقدمين لمجرد أنهم متقدمون يصادم قانون النمو الفكري كما يصادم نمو الكائنات، ويسلب الإنسان مزية التمييز بين الحق والباطل {cite:azhar-quran-building-society-shaltut p. 58}{cite:azhar-quran-building-society-shaltut p. 59}. ويعد هذا الجمود جناية على الفطرة البشرية وإهداراً لحجة الله على عباده {cite:azhar-quran-building-society-shaltut p. 59}. ويعزو المؤلف ما أصاب المسلمين من تفرق وخرافة إلى أن حمى التقليد تولدت في أدمغتهم بعد أن كانوا ينظرون ويبحثون ويطلبون البرهان {cite:azhar-quran-building-society-shaltut p. 60}."
