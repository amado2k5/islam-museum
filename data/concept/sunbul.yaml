label:
  ar: "سنبل"
  en: "Sunbul (spikenard)"
  ur: "سنبل"
summary:
  ar: "السنبل في الكتاب سنبلان: سنبل الطيب ويقال له سنبل العصافير، والناردين وهو السنبل الرومي، وينقل الكتاب عن ديسقوريدوس أن منه هندياً وسورياً، أجوده ما وفر شعره وكان إلى الشقرة طيب الرائحة صغير السنبل، حار في الأولى يابس في الثانية، مفتح محلل، يمنع النوازل ويقوي الدماغ وينبت الأشفار وينفع من الخفقان واليرقان وسدد الكبد والمعدة ويدر البول، وفي الكتاب نقل موسوم في الرحم {cite:canon-ibn-sina-print-v1 p.603}."
  en: "Sunbul is in the book two sunbuls: sunbul al-tib, called the sparrows' sunbul, and the nardin, which is the Roman sunbul, and the book reports from Dioscorides an Indian and a Syrian kind; the best has plentiful hair, tends to yellowish, is of good scent and small in spike; hot in the first degree and dry in the second, opening and dissolving, it checks flux to the head, strengthens the brain, grows the lashes and helps palpitation, jaundice, blockages of the liver and stomach and the flow of urine, with a labelled listing on the womb {cite:canon-ibn-sina-print-v1 p.603}."
  ur: "سنبل کتاب میں دو سنبل ہیں: سنبل الطیب جسے سنبل العصافیر بھی کہتے ہیں، اور ناردین جو رومی سنبل ہے؛ اور کتاب دیسقوریدوس سے ہندی اور سوری قسمیں نقل کرتی ہے؛ بہترین وہ ہے جس کے بال بہت ہوں، زردی مائل ہو، خوشبو اچھی ہو اور سنبل چھوٹا ہو؛ پہلے درجے میں گرم اور دوسرے میں خشک، کھولنے اور گھلانے والا، نزلات کو روکتا ہے، دماغ کو قوت دیتا ہے، پلکیں اگاتا ہے اور دھڑکن، یرقان، جگر اور معدے کی رکاوٹوں اور پیشاب کے اخراج میں مفید ہے، اور رحم کے بارے میں ایک موسوم نقل دیتی ہے {cite:canon-ibn-sina-print-v1 p.603}۔"
