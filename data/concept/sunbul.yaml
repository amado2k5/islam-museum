summary:
  ar: "السنبل في الكتاب سنبلان: سنبل الطيب ويقال له سنبل العصافير، والناردين وهو السنبل الرومي، وينقل الكتاب عن ديسقوريدوس أن منه هندياً وسورياً، أجوده ما وفر شعره وكان إلى الشقرة طيب الرائحة صغير السنبل، حار في الأولى يابس في الثانية، مفتح محلل، يمنع النوازل ويقوي الدماغ وينبت الأشفار وينفع من الخفقان واليرقان وسدد الكبد والمعدة ويدر البول، وفي الكتاب نقل موسوم في الرحم {cite:canon-ibn-sina-print-v1 p.603}."
  en: "Sunbul is in the book two sunbuls: sunbul al-tib, called the sparrows' sunbul, and the nardin, which is the Roman sunbul, and the book reports from Dioscorides an Indian and a Syrian kind; the best has plentiful hair, tends to yellowish, is of good scent and small in spike; hot in the first degree and dry in the second, opening and dissolving, it checks flux to the head, strengthens the brain, grows the lashes and helps palpitation, jaundice, blockages of the liver and stomach and the flow of urine, with a labelled listing on the womb {cite:canon-ibn-sina-print-v1 p.603}."
  ur: "سنبل کتاب میں دو سنبل ہیں: سنبل الطیب جسے سنبل العصافیر بھی کہتے ہیں، اور ناردین جو رومی سنبل ہے؛ اور کتاب دیسقوریدوس سے ہندی اور سوری قسمیں نقل کرتی ہے؛ بہترین وہ ہے جس کے بال بہت ہوں، زردی مائل ہو، خوشبو اچھی ہو اور سنبل چھوٹا ہو؛ پہلے درجے میں گرم اور دوسرے میں خشک، کھولنے اور گھلانے والا، نزلات کو روکتا ہے، دماغ کو قوت دیتا ہے، پلکیں اگاتا ہے اور دھڑکن، یرقان، جگر اور معدے کی رکاوٹوں اور پیشاب کے اخراج میں مفید ہے، اور رحم کے بارے میں ایک موسوم نقل دیتی ہے {cite:canon-ibn-sina-print-v1 p.603}۔"
  es: "Sunbul es en el libro dos sunbuls: sunbul al-tib, llamado el sunbul de los gorriones, y el nardin, que es el sunbul romano, y el libro informa de Dioscórides un tipo indio y uno sirio; el mejor tiene abundante pelo, tiende a amarillento, es de buen aroma y pequeño en espiga; caliente en el primer grado y seco en el segundo, se abre y se disuelve, controla el flujo a la cabeza, fortalece el cerebro, hace crecer las pestañas y ayuda con las palpitaciones, la ictericia, las obstrucciones del hígado y el estómago y el flujo de orina, con una lista etiquetada en el útero {cite:canon-ibn-sina-print-v1 p.603}."
  fr: "Le livre mentionne deux espèces de sunbul: le sunbul al-tib, appelé sunbul des moineaux, et le nardin, qui est le sunbul romain. Le livre rapporte également, d'après Dioscoride, une espèce indienne et une espèce syrienne. La meilleure espèce a une abondante chevelure, tend à jaunir, est bien parfumée et a une petite épine. Chaude au premier degré et sèche au second, elle s'ouvre et se dissout. Elle arrête les maux de tête, fortifie le cerveau, fait pousser les cils et soulage les palpitations, la jaunisse, les blocages du foie et de l'estomac, ainsi que les troubles urinaires. Elle est mentionnée dans une liste étiquetée sur l'utérus {cite:canon-ibn-sina-print-v1 p.603}."
  tr: "Kitaptaki sivri uç, iyi olanın sivri uçu olarak da adlandırılır, aynı zamanda kuşların sivri uçu olarak da adlandırılır; valerian ise Roma diken olarak adlandırılır. Kitapta Dioscorides'in Hintli ve Suriyeli olduğunu, en iyisi saç ve altın kokusunu sağladığı için alıntılar; küçük sivri ucu kokulu, ilkinde sıcak, ikincisinde kuru, hafifleten ve eriyen, felaketleri önler, beyni güçlendirir, dudakları teşvik eder, çarpıntı ve sarılığı etkiler, karaciğer ve mideyi tıkar, idrar söktürücü etkiler. Kitapta ayrıca 'Rahimde' başlıklı bir anlatım da yer alır {cite:canon-ibn-sina-print-v1 s.603}."
  id: "Duri dalam buku ini disebut duri kebaikan, juga disebut duri burung, dan valerian yang merupakan duri Romawi. Buku ini mengutip Dioscorides sebagai orang India dan Suriah, yang terbaik karena memberikan rambut dan aroma emas, duri kecil ini harum, panas pada yang pertama dan kering pada yang kedua, menirutkan dan larut, mencegah bencana, memperkuat otak, mendorong labia, memberikan manfaat bagi jantung dan penyakit kuning, menyumbat hati dan lambung, serta mendorong diuretik. Buku ini juga memuat narasi berjudul 'Di Rahim' {cite:canon-ibn-sina-print-v1 hlm.603}."
