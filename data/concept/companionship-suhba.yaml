id: concept/companionship-suhba
class: concept
kind: doctrine
label:
  ar: "الصُّحْبة"
  en: "Suhba (companionship with the Prophet: who is a Companion, how companionship is proved, the uprightness of all Companions, and the ruling on insulting them)"
summary:
  ar: "الصحبة في الاصطلاح عند إطلاقها صحبة النبي، والصحابي من لقي النبي مؤمنا به ومات على الإسلام، عند ابن حجر. وتثبت بالتواتر أو الاستفاضة أو الرواية عن صحابي أو تابعي، أو بقول العدل المعاصر. واتفق أهل السنة على عدالة جميع الصحابة، وعلى تكفير من أنكر صحبة أبي بكر، واختلفوا في تكفير من أنكر صحبة غيره، وفي تكفير من سب الصحابة، فيكفر من قذف عائشة أو كفر الصحابة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10284} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10285} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10286} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10287} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10288}"
  en: "When the word is used alone in law it means companionship with the Prophet. A Companion is, in Ibn Hajar's view, one who met the Prophet as a believer and died in Islam. Companionship is proved by reports that reach the level of widespread transmission, by general reputation, by a report from a Companion or a Successor that someone was a Companion, or by the word of a just man who lived in the same time. Sunni scholars agree that all the Companions are upright, and that whoever denies the companionship of Abu Bakr is an unbeliever; they differ on denying the companionship of others. Those who revile a Companion are not unbelievers unless they charge him with what impugns his religion or his uprightness; the majority hold that the reviling of one Companion does not make one an unbeliever, while accusing 'A'isha of what God cleared her of does. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10284} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10285} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10286} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10287} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10288}"
