id: concept/companionship-suhba
class: concept
kind: doctrine
label:
  ar: "الصُّحْبة"
  en: "Suhba (companionship with the Prophet: who is a Companion, how companionship is proved, the uprightness of all Companions, and the ruling on insulting them)"
  es: "Suhba (la compañía del Profeta: quién es un Compañero, cómo se prueba la compañía, la rectitud de todos los Compañeros y la norma sobre insultarlos)"
  fr: "Suhba (la compagnie du Prophète: qui est un Compagnon, comment prouver la compagnie, la droiture de tous les Compagnons et la règle concernant l’insulte à leur égard)"
summary:
  ar: "الصحبة في الاصطلاح عند إطلاقها صحبة النبي، والصحابي من لقي النبي مؤمنا به ومات على الإسلام، عند ابن حجر. وتثبت بالتواتر أو الاستفاضة أو الرواية عن صحابي أو تابعي، أو بقول العدل المعاصر. واتفق أهل السنة على عدالة جميع الصحابة، وعلى تكفير من أنكر صحبة أبي بكر، واختلفوا في تكفير من أنكر صحبة غيره، وفي تكفير من سب الصحابة، فيكفر من قذف عائشة أو كفر الصحابة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10284} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10285} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10286} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10287} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10288}"
  en: "When the word is used alone in law it means companionship with the Prophet. A Companion is, in Ibn Hajar's view, one who met the Prophet as a believer and died in Islam. Companionship is proved by reports that reach the level of widespread transmission, by general reputation, by a report from a Companion or a Successor that someone was a Companion, or by the word of a just man who lived in the same time. Sunni scholars agree that all the Companions are upright, and that whoever denies the companionship of Abu Bakr is an unbeliever; they differ on denying the companionship of others. Those who revile a Companion are not unbelievers unless they charge him with what impugns his religion or his uprightness; the majority hold that the reviling of one Companion does not make one an unbeliever, while accusing 'A'isha of what God cleared her of does. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10284} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10285} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10286} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10287} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10288}"
  es: "Cuando la palabra se usa sola en el ámbito legal, significa compañía del Profeta. Un Compañero es, según Ibn Hajar, aquel que conoció al Profeta siendo creyente y murió en el Islam. La compañía se prueba mediante relatos que alcanzan un nivel de transmisión generalizada, por la reputación general, por el testimonio de un Compañero o un Sucesor que afirma que alguien fue Compañero, o por la palabra de un hombre justo que vivió en la misma época. Los eruditos sunitas coinciden en que todos los Compañeros son rectos y que quien niega la compañía de Abu Bakr es un incrédulo; difieren en cuanto a negar la compañía de los demás. Quienes insultan a un Compañero no son incrédulos a menos que lo acusen de algo que impugne su religión o su rectitud; la mayoría sostiene que insultar a un Compañero no convierte a uno en incrédulo, mientras que acusar a Aisha de algo de lo que Dios la absolvió sí lo hace. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10284} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10285} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10286} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10287} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10288}"
  fr: "En droit, le terme « Compagnon », employé seul, désigne la communion avec le Prophète. Selon Ibn Hajar, un Compagnon est celui qui a rencontré le Prophète en tant que croyant et qui est mort en musulman. La communion est attestée par des hadiths largement transmis, par la réputation générale, par le témoignage d'un Compagnon ou d'un Successeur, ou encore par la parole d'un homme juste contemporain. Les savants sunnites s'accordent à dire que tous les Compagnons sont intègres et que quiconque nie la communion d'Abou Bakr est mécréant; leurs avis divergent quant à la négation de la communion d'autres Compagnons. Ceux qui injurient un Compagnon ne sont pas mécréants, à moins de l'accuser de ce qui ternit sa religion ou sa droiture. La majorité considère que l'injure d'un Compagnon ne rend pas mécréant, contrairement au fait d'accuser Aïcha de ce dont Dieu l'a innocentée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10284} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10285} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10286} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10287} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10288}"
