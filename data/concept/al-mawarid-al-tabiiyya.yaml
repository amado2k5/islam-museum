summary:
  ar: "يرى قعدات أن الأرض تزخر بالمواد الخام التي تشكل البنية الأساسية للإنتاج، وأن الاستعمار الغربي سعى إليها فنقلها إلى بلاده ثم باع للأمم النامية السلع المصنعة {cite:qadan-manhaj-iqtisad-quran p. 49}. ويعدّد الموارد الزراعية والصناعية والحيوانية في البلاد العربية والإسلامية، ويذكر أن الأنهار والتربة الخصبة تكفي لزراعة واسعة إن أحسن استغلالها {cite:qadan-manhaj-iqtisad-quran p. 50}{cite:qadan-manhaj-iqtisad-quran p. 51}. ويستشهد بحديث «الناس شركاء في ثلاث: الماء والكلأ والنار» أصلاً في حق الناس في الحاجات الأساسية، دون أن يذكر مخرجه أو درجته {cite:qadan-manhaj-iqtisad-quran p. 67}."
  tr: "Kaadat, toprağın üretimin temel yapısını oluşturan ham maddeler açısından zengin olduğuna inanır ve Batı sömürgeciliğinin bunları kendi ülkelerine aktararak ve ardından gelişmekte olan ülkelere imal malları satarak aradığını belirtir {cite:qadan-manhaj-iqtisad-kur'an s. 49}. Arap ve İslam ülkelerindeki tarımsal, endüstriyel ve hayvansal kaynakları sayar; nehirlerin ve verimli toprakların iyi kullanılırsa yaygın tarım için yeterli olduğunu belirtir {cite:qadan-manhaj-iqtisad-kuran s. 50}{cite:qadan-manhaj-iqtisad-kur'an s. 51}}. \"İnsanlar üç işin ortağıdır: su, otlak ve ateş\" hadisini, insanların temel ihtiyaçlardaki haklarıyla ilgili olarak kaynak veya derecesini belirtmeden aktarır {cite:qadan-manhaj-iqtisad-kur'an s. 67}."
  id: "Kaadat percaya bahwa tanah kaya akan bahan baku yang membentuk struktur dasar produksi dan menyatakan bahwa kolonialisme Barat mencarinya dengan memindahkannya ke negara mereka sendiri lalu menjual barang manufaktur ke negara berkembang {cite:qadan-manhaj-iqtisad-qur'an hlm. 49}. Ia menghitung sumber daya pertanian, industri, dan hewan di negara-negara Arab dan Islam; ia menyatakan bahwa sungai dan lahan subur cukup untuk pertanian luas jika digunakan dengan baik {cite:qadan-manhaj-iqtisad-qur'an hlm. 50}{cite:qadan-manhaj-iqtisad-qur'an hlm. 51}}. Ia menyampaikan hadits \"Manusia adalah mitra dalam tiga hal: air, padang rumput, dan api\" tanpa menyebutkan sumber atau derajat hak masyarakat atas kebutuhan dasar {cite:qadan-manhaj-iqtisad-qur'an hlm. 67}."
