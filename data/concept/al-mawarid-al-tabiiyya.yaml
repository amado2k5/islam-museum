summary:
  ar: "يرى قعدات أن الأرض تزخر بالمواد الخام التي تشكل البنية الأساسية للإنتاج، وأن الاستعمار الغربي سعى إليها فنقلها إلى بلاده ثم باع للأمم النامية السلع المصنعة {cite:qadan-manhaj-iqtisad-quran p. 49}. ويعدّد الموارد الزراعية والصناعية والحيوانية في البلاد العربية والإسلامية، ويذكر أن الأنهار والتربة الخصبة تكفي لزراعة واسعة إن أحسن استغلالها {cite:qadan-manhaj-iqtisad-quran p. 50}{cite:qadan-manhaj-iqtisad-quran p. 51}. ويستشهد بحديث «الناس شركاء في ثلاث: الماء والكلأ والنار» أصلاً في حق الناس في الحاجات الأساسية، دون أن يذكر مخرجه أو درجته {cite:qadan-manhaj-iqtisad-quran p. 67}."
