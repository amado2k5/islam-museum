label:
  ar: "الإسلاموفوبيا ⁦(الرهاب من الإسلام)⁩"
  en: "Islamophobia (the phobia of Islam)"
  es: "Islamofobia (fobia al Islam)"
  fr: "L'islamophobie (la phobie de l'islam)"
  ur: "اسلامو فوبیا ⁦(اسلام کا فوبیا)⁩"
  tr: "İslamofobi (İslamofobi)"
  id: "Islamofobia (Islamofobia)"
issue:
  ar: "هل الخوف الغربي من الإسلام ظاهرة حقيقية منتشرة أم محدودة ومضخَّمة إعلامياً، وما أسبابها؟"
summary:
  ar: "نقاش برنامج «الوسطية» لطارق السويدان حول ظاهرة الخوف أو التوجس الغربي من الإسلام. انقسم جمهور الحلقة بين 51% يرونها حقيقية منتشرة و49% يرونها محدودة مضخَّمة إعلامياً. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep01 00:05:30} وفي سببها الأكبر اختار 55% «الأصابع اليهودية» و25% تصرفات بعض المسلمين و20% الميراث التاريخي — نتيجة فاجأت المقدم نفسه. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep01 00:32:00} وفرّق الضيوف بين فوبيا كمصطلح طبي نفسي لا وجود له في المعاجم الطبية، وبين الظاهرة السياسية الإعلامية. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep01 00:08:00}"
  en: "Tareq al-Suwaidan's 'Al-Wasatiyya' programme's discussion of the Western fear or wariness of Islam. The episode's audience split 51% seeing a real widespread phenomenon and 49% a limited media-inflated one. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep01 00:05:30} On its greatest cause, 55% chose 'Jewish fingers', 25% the conduct of some Muslims, 20% historical inheritance — a result that surprised the host himself. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep01 00:32:00} Panelists distinguished between phobia as a clinical term absent from medical dictionaries and the political-media phenomenon. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep01 00:08:00}"
  es: "El programa 'Al-Wasatiyya' de Tareq al-Suwaidan analizó el temor o la desconfianza de Occidente hacia el Islam. La audiencia del episodio se dividió: el 51% lo consideró un fenómeno generalizado y el 49% uno limitado, inflado por los medios. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep01 00:05:30} En cuanto a su principal causa, el 55% eligió los \"dedos judíos\", el 25% la conducta de algunos musulmanes y el 20% la herencia histórica, un resultado que sorprendió al propio presentador. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep01 00:32:00} Los panelistas distinguieron entre la fobia como término clínico ausente en los diccionarios médicos y el fenómeno político-mediático. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep01 00:08:00}"
  fr: "L'émission « Al-Wasatiyya » de Tareq al-Suwaidan a abordé la question de la peur ou de la méfiance de l'Occident envers l'islam. L'audience de cet épisode était partagée: 51 % y voyaient un phénomène réellement répandu, tandis que 49 % le considéraient comme un phénomène limité et amplifié par les médias. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep01 00:05:30} Quant à la principale cause, 55 % ont cité « la trahison des Juifs », 25 % le comportement de certains musulmans et 20 % l'héritage historique – un résultat qui a surpris l'animateur lui-même. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep01 00:32:00} Les intervenants ont fait la distinction entre la phobie, terme clinique absent des dictionnaires médicaux, et le phénomène politico-médiatique. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep01 00:08:00}"
  ur: "طارق السویدان کے 'الوصطیہ' پروگرام میں اسلام کے مغربی خوف یا ہوشیاری کے بارے میں بحث۔ ایپی سوڈ کے سامعین 51% ایک حقیقی وسیع رجحان کو دیکھتے ہوئے اور 49% محدود میڈیا کے ذریعے تقسیم ہوئے۔ اس کے سب سے بڑے مقصد پر، 55% نے 'یہودی انگلیوں' کا انتخاب کیا، 25% نے کچھ مسلمانوں کا طرز عمل، 20% نے تاریخی وراثت — جس کا نتیجہ خود میزبان کو حیران کر دیا۔ {حوالہ: assabile-tareq-al-suwaidan al-wasitiya/ep01 00:32:00} پینلسٹس نے فوبیا کے درمیان طبی لغات اور سیاسی-میڈیا رجحان سے غیر حاضر طبی اصطلاح کے طور پر فرق کیا۔ {حوالہ:اسابیل-طارق-السویدان الوصیتیہ/ep01 00:08:00}"
  tr: "Tariq Al-Suwaidan tarafından Batı'nın İslam'dan korku veya korkusu olgusu hakkında \"Al-Wastatiyya\" programının tartışılması. Bölümün izleyici kitlesi, %51'i bunu doğru ve yaygın buluyor, %49'u ise medyada sınırlı ve abartılı buluyor. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep01 00:05:30} Ve asıl sebep, %55'inin \"Yahudi parmaklarını\", %25'inin bazı Müslümanların eylemlerini ve %20'sinin tarihi mirası seçmesiydi — bu sonuç sunucuyu şaşırttı. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep01 00:32:00} Konuklar, tıbbi sözlüklerde bulunmayan psikomedikal bir terim olan fobi ile politik medya fenomeni arasında ayrım yaptılar. {Cite:assabile-tareq-al-Suwaidan al-Wassitiya/ep01 00:08:00}"
  id: "Diskusi tentang program \"Al-Wastatiyya\" oleh Tariq Al-Suwaidan tentang fenomena ketakutan atau ketakutan Barat terhadap Islam. Penonton episode ini terbagi antara 51% yang melihatnya benar dan luas, dan 49% melihatnya terbatas dan dilebih-lebihkan di media. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep01 00:05:30} Alasan utamanya adalah 55% memilih \"jari Yahudi,\" 25% tindakan beberapa Muslim, dan 20% warisan sejarah — hasil yang mengejutkan pembawa acara sendiri. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep01 00:32:00} Para tamu membedakan antara fobia, istilah psikomedis yang tidak ada dalam kamus medis, dan fenomena politik-media. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep01 00:08:00}"
