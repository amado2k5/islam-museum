  responses:
  - tradition: other
    summary: "محدودة ومضخَّمة إعلامياً: رأى عادل درويش أن الظاهرة ليست منتشرة بين الشعوب بل ردّة فعل على تصرفات بعض المسلمين، وأن الحكومات والمفكرين الغربيين أعدل — بل وقّع مثقفون بينهم يهود بيانات ضدها. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep01 00:10:30}{cite:assabile-tareq-al-suwaidan al-wassitiya/ep01 00:13:00} ورأى عريب الرنتاوي أنها «صناعة» تقوم بها مراكز قوى ونخب سياسية لأجندات صراع، تصاعدت بعد الحرب الباردة. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep01 00:21:30}{cite:assabile-tareq-al-suwaidan al-wassitiya/ep01 00:23:30}"
    sources: [source/assabile-tareq-al-suwaidan]
  - tradition: other
    summary: "حقيقية متنامية: رأى الباحث أنها مرض فكري وثقافي وتاريخي متنامٍ، يشيطن المسلم ويجرّده من إنسانيته كما فعلت لجنة ما بعد الحملة الصليبية الأولى؛ وشهد بتجربته اليومية في مستشفى بريطاني. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep01 00:25:30}{cite:assabile-tareq-al-suwaidan al-wassitiya/ep01 00:28:00}"
    sources: [source/assabile-tareq-al-suwaidan]
  - tradition: other
    summary: "الرفض أصلاً: رفض عزام التميمي المصطلح كلياً: «أسوأ ما حصل للمسلمين في الغرب ظهور هذا المصطلح» — لم يفسر الظاهرة بل زاد نقمة المخاصمين؛ الخوف من الآخر المجهول طبيعي لكنه ليس «رهاباً». {cite:assabile-tareq-al-suwaidan al-wassitiya/ep01 00:15:30}{cite:assabile-tareq-al-suwaidan al-wassitiya/ep01 00:16:00}"
