label:
  ar: "الإسلاموفوبيا (الرهاب من الإسلام)"
  en: "Islamophobia (the phobia of Islam)"
issue:
  ar: "هل الخوف الغربي من الإسلام ظاهرة حقيقية منتشرة أم محدودة ومضخَّمة إعلامياً، وما أسبابها؟"
summary:
  ar: "نقاش برنامج «الوسطية» لطارق السويدان حول ظاهرة الخوف أو التوجس الغربي من الإسلام. انقسم جمهور الحلقة بين 51% يرونها حقيقية منتشرة و49% يرونها محدودة مضخَّمة إعلامياً. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep01 00:05:30} وفي سببها الأكبر اختار 55% «الأصابع اليهودية» و25% تصرفات بعض المسلمين و20% الميراث التاريخي — نتيجة فاجأت المقدم نفسه. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep01 00:32:00} وفرّق الضيوف بين فوبيا كمصطلح طبي نفسي لا وجود له في المعاجم الطبية، وبين الظاهرة السياسية الإعلامية. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep01 00:08:00}"
  en: "Tareq al-Suwaidan's 'Al-Wasatiyya' programme's discussion of the Western fear or wariness of Islam. The episode's audience split 51% seeing a real widespread phenomenon and 49% a limited media-inflated one. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep01 00:05:30} On its greatest cause, 55% chose 'Jewish fingers', 25% the conduct of some Muslims, 20% historical inheritance — a result that surprised the host himself. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep01 00:32:00} Panelists distinguished between phobia as a clinical term absent from medical dictionaries and the political-media phenomenon. {cite:assabile-tareq-al-suwaidan al-wassitiya/ep01 00:08:00}"
tensions:
