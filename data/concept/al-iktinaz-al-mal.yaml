id: concept/al-iktinaz-al-mal
class: concept
kind: ethical
tags: [islamic-economy-browser, islamic-economy-money]
label:
  ar: اكتناز المال
  en: Hoarding money (iktinaz)
  es: "Acumulación de dinero (iktinaz)"
  fr: "Amasser de l'argent (iktinaz)"
  ur: "جمع رقم ⁦(اکتیناز)⁩"
  tr: "para biriktirme"
  id: "menghemat uang"
summary:
  ar: "يعدّ قعدات اكتناز الأموال وعدم تشغيلها في الإنتاج والتطوير السلعي سبباً من أسباب المشكلة الاقتصادية، لأنه يفقد الدولة القدرة على الاستثمار الإنتاجي النافع فتضطر إلى الاستيراد {cite:qadan-manhaj-iqtisad-quran p. 58}. ويقرن الاكتناز بالاحتكار: أخذ حاجات الناس وتخزينها حتى ترتفع أسعارها، فتندر السلع في بلد وتكثر في بلد آخر {cite:qadan-manhaj-iqtisad-quran p. 58}. ويذكر أن دولاً أوروبية ألقت الفائض من الحبوب في البحر للحفاظ على أسعار مرتفعة، دون أن يسمّيها {cite:qadan-manhaj-iqtisad-quran p. 58}. يعرض المؤلف سبعة أقوال ابن العربي في معنى الكنز، ويرى أن الاكتناز حبس النقود عن الإنفاق الاستهلاكي والاستثماري والخيري، وأن الكنز درجتان: جمع ومنع، وأن عقوبة المكنوز الذي لم تؤد زكاته أكبر."
  tr: "Paranın biriktirilmesi ve üretim ile emtia geliştirmede kullanılmaması, ekonomik sorunun nedenlerinden biridir; çünkü devletin üretken ve kârlı yatırım yapma yeteneğini elinden alır ve ithalata zorlamaktadır {atıf:qadan-manhaj-iqtisad-kuran s. 58}. Stokçuluk, insanların ihtiyaçlarını alıp fiyatlar yükselene kadar depolamak, bir ülkede malların kıt hale gelmesine ve başka bir ülkede bol hale gelmesine neden olur. Avrupa ülkelerinin fazla tahılı yüksek fiyatları korumak için denize attığını, adını vermeden belirtmekte fayda var {cite:qadan-manhaj-iqtisad-qur'an s. 58}. Yazar, hazine anlamıyla ilgili olarak İbn el-Arabi'nin yedi görüşünü sunar; istiflemenin tüketim, yatırım ve hayır harcamalarından para alıkoymak olduğunu ve biriktirmenin iki derecesi olduğunu kabul eder: toplama ve tutma, ayrıca zekat ödemeyen istiflemenin cezasının daha ağır olduğunu belirtir."
  id: "Pengumpulan uang dan kegagalannya menggunakannya dalam produksi serta pengembangan komoditas adalah salah satu penyebab masalah ekonomi; karena hal ini merampas kemampuan negara untuk berinvestasi secara produktif dan menguntungkan serta memaksanya mengimpor {kutipan: qadan-manhaj-iqtisad-quran hlm. 58}. Menimbun adalah mengambil kebutuhan masyarakat dan menyimpannya sampai harga naik, menyebabkan barang menjadi langka di satu negara dan melimpah di negara lain. Perlu dicatat tanpa menyebutkan nama bahwa negara-negara Eropa membuang kelebihan gandum ke laut untuk mempertahankan harga tinggi {cite:qadan-manhaj-iqtisad-qur'an hlm. 58}. Penulis menyajikan tujuh pandangan Ibn al-Arabi mengenai makna perbendaharaan; ia menerima bahwa penimbunan berarti menahan uang dari konsumsi, investasi, dan pengeluaran amal, dan bahwa penimbunan memiliki dua tingkat: mengumpulkan dan menyimpan, serta mencatat bahwa menimbun tanpa membayar zakat dihukum lebih berat."
