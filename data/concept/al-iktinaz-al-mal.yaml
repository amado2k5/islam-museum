summary:
  ar: "يعدّ قعدات اكتناز الأموال وعدم تشغيلها في الإنتاج والتطوير السلعي سبباً من أسباب المشكلة الاقتصادية، لأنه يفقد الدولة القدرة على الاستثمار الإنتاجي النافع فتضطر إلى الاستيراد {cite:qadan-manhaj-iqtisad-quran p. 58}. ويقرن الاكتناز بالاحتكار: أخذ حاجات الناس وتخزينها حتى ترتفع أسعارها، فتندر السلع في بلد وتكثر في بلد آخر {cite:qadan-manhaj-iqtisad-quran p. 58}. ويذكر أن دولاً أوروبية ألقت الفائض من الحبوب في البحر للحفاظ على أسعار مرتفعة، دون أن يسمّيها {cite:qadan-manhaj-iqtisad-quran p. 58}."
