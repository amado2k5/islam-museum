id: "concept/ilaj-quruh-al-ayn"
class: "concept"
kind: "scientific"
label:
  ar: "علاج قروح العين"
  en: "Treating the eye's ulcers"
  ur: "آنکھ کے قرحوں کا علاج"
summary:
  ar: "متى كانت القرحة في العين اليمنى نام على اليسرى أو بالعكس ويلطف تدبيره أولاً فإذا انفجرت قل التدبير إلى الأطراف ولم يمتلئ ولم يعطس ولم يدخل الحمام قبل نضج العلة، والعمدة تنقية الرأس بالاستفراغات الجاذبة إلى أسفل وإدامة لين الطبيعة، وقانون اختيار الأدوية فيه كل ما يجفف بلا لذع ⁦(مواضع الفصد والحجامة وأسماء الشيافات والنسخ لا تحمل)⁩ {cite:canon-ibn-sina-print-v2 p.178}"
  en: "When the ulcer is in the right eye he sleeps on the left, and the reverse; his regimen is first gentle, and once the ulcer bursts the treatment turns to the extremities — no repletion, no sneezing, no bath before the disease ripens; the mainstay is cleansing the head by evacuations drawing downward and keeping the bowels loose; the canon of drug choice here is all that dries without biting ⁦(venesection and cupping sites, collyrium names and recipes are not carried)⁩ {cite:canon-ibn-sina-print-v2 p.178}"
  ur: "جب قرحہ دائیں آنکھ میں ہو تو بائیں آنکھ پر سوئے اور اس کے برعکس؛ پہلے اس کی تدبیر نرم ہو اور جب قرحہ پھٹ جائے تو علاج اطراف کی طرف ہو — نہ امتلاء، نہ چھینک، نہ علت پخت ہونے سے پہلے حمام؛ بنیاد سر کی تنقیہ نیچے کھینچنے والے استفراغات اور قیام طبیعت کے برقرار رکھنے سے ہے؛ اور یہاں دوا چننے کا قانون ہر وہ چیز ہے جو بغیر چبھن کے خشک کرے ⁦(فصد و حجامت کے مقامات، شیافوں کے نام اور نسخے منقول نہیں)⁩ {cite:canon-ibn-sina-print-v2 p.178}"
