summary:
  ar: "النقود التي ضربت في صدر الإسلام على الطراز البيزنطي والساساني مع عبارات عربية، من عهد عمر بن الخطاب إلى تعريب عبد الملك بن مروان سنة 77–78هـ، كما يصفها فرج الله أحمد يوسف {cite:yusuf-ayat-quraniyya-maskukat-2003 p. 19} {cite:yusuf-ayat-quraniyya-maskukat-2003 p. 20}."
  en: "The coins struck in early Islam on Byzantine and Sasanian models with added Arabic phrases, from Umar ibn al-Khattab to Abd al-Malik's Arabisation of 77–78 AH, as Farajallah Ahmad Yusuf describes them {cite:yusuf-ayat-quraniyya-maskukat-2003 p. 19} {cite:yusuf-ayat-quraniyya-maskukat-2003 p. 20}."
  fr: "Les monnaies frappées aux premiers temps de l’islam sur des modèles byzantins et sassanides avec l’ajout de formules arabes, depuis Umar ibn al-Khattab jusqu’à l’arabisation d’Abd al-Malik en 77–78 H, telles que les décrit Farajallah Ahmad Yusuf {cite:yusuf-ayat-quraniyya-maskukat-2003 p. 19} {cite:yusuf-ayat-quraniyya-maskukat-2003 p. 20}."
  ur: "ابتدائی اسلام میں بازنطینی اور ساسانی طرز پر عربی عبارات کے اضافے کے ساتھ ضرب ہونے والے سکے، عمر بن خطاب سے عبد الملک کی 77–78ھ کی تعریب تک {cite:yusuf-ayat-quraniyya-maskukat-2003 p. 19}."
  es: "Las monedas acuñadas en el Islam temprano seguían modelos bizantinos y sasánidas con frases árabes añadidas, desde Umar ibn al-Khattab hasta la arabización de Abd al-Malik del 77-78 d. H., como las describe Farajallah Ahmad Yusuf {citar:yusuf-ayat-quraniyya-maskukat-2003 p. 19} {citar:yusuf-ayat-quraniyya-maskukat-2003 p. 20}."
  tr: "Erken İslam'da Bizans ve Sasani tarzlarında, Arapça ifadelerle basılan paralar, Ömer ibn el-Hattab döneminden 77–78 H. yıllarında Abdülmelik ibn Mervan'ın Araplaştırılmasına kadar, Farajallah Ahmed Yusuf tarafından tanımlanmıştır {cite:yusuf-ayat-quraniyya-maskukat-2003 s. 19} {cite:yusuf-ayat-quraniyya-maskukat-2003 s. 20}."
  id: "Koin yang dicetak pada masa Islam awal dengan gaya Bizantium dan Sassanid dengan frasa Arab, dari era Umar ibn al-Khattab hingga Arabisasi Abd al-Malik ibn Marwan pada tahun 77–78 H, sebagaimana dijelaskan oleh Farajallah Ahmad Yusuf {cite:yusuf-ayat-quraniyya-maskukat-2003 hlm. 19} {cite:yusuf-ayat-quraniyya-maskukat-2003 hlm. 20}."
