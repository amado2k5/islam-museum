id: concept/ashik
class: concept
kind: term
label:
  ar: "عاشق ⁦(شاعر جوال)⁩"
  en: "'Ashik (wandering minstrel-poets)"
  fr: "'Ashik (poètes-ménestrels itinérants)"
  es: "'Ashik (poetas-trovadores errantes)"
  ur: "عاشق ⁦(آوارہ منسٹر شاعر)⁩"
  tr: "Sevgili (Gezici Şair)"
  id: "Lover (Penyair Keliling)"
summary:
  ar: "لفظ عربي معناه المحب، ويُستعمل عند الأتراك الأناضوليين والأذربيجانيين منذ أواخر القرن التاسع أو العاشر الهجري ⁦(الخامس عشر أو السادس عشر الميلادي)⁩ لطائفة من الشعراء المنشدين الجوالين، ينشدون في المجالس العامة قصائد دينية وغزلية ومراثي وقصص بطولية {cite:encyclopaedia-of-islam-2 vol. 1 p. 746}."
  en: "An Arabic word meaning lover, often in the mystical sense. Among the Anatolian and Adharbayjani Turks, from the late ninth/fifteenth or tenth/sixteenth century, it names a class of wandering poet-minstrels who sang and recited religious and erotic songs, elegies and heroic narratives at public gatherings {cite:encyclopaedia-of-islam-2 vol. 1 p. 746}."
  fr: "Mot arabe signifiant amoureux, souvent au sens mystique. Chez les Turcs d’Anatolie et d’Azerbaïdjan, depuis la fin du IXe/XVe ou le Xe/XVIe siècle, il désigne une catégorie de poètes-ménestrels itinérants qui chantaient et récitaient des chants religieux et érotiques, des élégies et des récits héroïques lors de rassemblements publics {cite:encyclopaedia-of-islam-2 vol. 1 p. 746}."
  es: "Palabra árabe que significa amante, a menudo en sentido místico. Entre los turcos de Anatolia y Adharbayjan, desde finales del siglo IX/XV o del siglo X/XVI, designa a una clase de poetas-trovadores errantes que cantaban y recitaban canciones religiosas y eróticas, elegías y narraciones heroicas en reuniones públicas {cite:encyclopaedia-of-islam-2 vol. 1 p. 746}."
  ur: "ایک عربی لفظ جس کا مطلب ہے عاشق، اکثر صوفیانہ معنی میں۔ اناطولیہ اور ادھر بائیجانی ترکوں میں، نویں/پندرھویں یا دسویں/سولہویں صدی کے اواخر سے، اس میں آوارہ شاعروں کے ایک طبقے کا نام آتا ہے جنہوں نے عوامی اجتماعات میں مذہبی اور شہوانی، شہوت انگیز گیت اور بہادری کی داستانیں گائیں اور سنائیں۔ 1 ص۔ 746}۔"
  tr: "Arapçada 'aşık' anlamına gelen bu terim, Anadolu ve Azerbaycan Türkleri tarafından, 9. veya 10. yüzyıl sonları (M.S. on beşinci veya on altıncı yüzyıl) itibaren, halka açık toplantılarda dini ve romantik şiirler, ağıtlar ve kahramanlık hikayeleri okuyan gezici şairler ve ilahiler için kullanılmıştır {cite:Encyclopaedia-of-Islam-2 cilt 1, s. 746}."
  id: "Istilah Arab yang berarti 'kekasih' ini telah digunakan oleh orang Turki Anatolia dan Azerbaijan sejak akhir abad ke-9 atau ke-10 H (abad kelima belas atau keenam belas M) untuk sekelompok penyair dan penyanyi keliling, yang membacakan puisi religius dan romantis, elegi, dan kisah heroik dalam pertemuan umum {cite:Encyclopaedia-of-Islam-2 vol. 1, hlm. 746}."
