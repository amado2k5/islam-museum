label:
  ar: "عاشق (شاعر جوال)"
  en: "'Ashik (wandering minstrel-poets)"
summary:
  ar: "لفظ عربي معناه المحب، ويُستعمل عند الأتراك الأناضوليين والأذربيجانيين منذ أواخر القرن التاسع أو العاشر الهجري (الخامس عشر أو السادس عشر الميلادي) لطائفة من الشعراء المنشدين الجوالين، ينشدون في المجالس العامة قصائد دينية وغزلية ومراثي وقصص بطولية {cite:encyclopaedia-of-islam-2 vol. 1 p. 746}."
  en: "An Arabic word meaning lover, often in the mystical sense. Among the Anatolian and Adharbayjani Turks, from the late ninth/fifteenth or tenth/sixteenth century, it names a class of wandering poet-minstrels who sang and recited religious and erotic songs, elegies and heroic narratives at public gatherings {cite:encyclopaedia-of-islam-2 vol. 1 p. 746}."
