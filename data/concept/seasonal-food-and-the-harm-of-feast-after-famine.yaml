summary:
  ar: "يوصي ابن سينا بالطعام الحار في الشتاء والبارد أو القليل السخونة في الصيف دون بلوغ ما لا يطاق، ويحذر من الشبع في الخصب يتبعه جوع في الجدب وبالعكس، ويذكر أنه رأى قوماً ضاق عليهم الطعام في القحط فلما اتسع امتلأوا وماتوا {cite:canon-ibn-sina-print-v1 p.228}."
  en: "Ibn Sina advises hot food in winter and cold or only slightly warm food in summer, never so hot or cold as to be unbearable; he warns against a feast in plenty followed by hunger in scarcity, and the reverse, and says he saw people die who filled themselves when food widened after a famine {cite:canon-ibn-sina-print-v1 p.228}."
