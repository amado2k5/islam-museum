id: concept/seasonal-food-and-the-harm-of-feast-after-famine
class: concept
kind: scientific
label: { ar: "الطعام بحسب الفصل وضرر الشبع بعد الجوع", en: "Seasonal food and the harm of feast after famine", ur: "موسم کے مطابق غذا اور قحط کے بعد ضیافت کا نقصان", es: "Alimentos de temporada y el daño de los festines tras las hambrunas.", fr: "L'alimentation de saison et les méfaits des festins après la famine" }
summary:
  ar: "يوصي ابن سينا بالطعام الحار في الشتاء والبارد أو القليل السخونة في الصيف دون بلوغ ما لا يطاق، ويحذر من الشبع في الخصب يتبعه جوع في الجدب وبالعكس، ويذكر أنه رأى قوماً ضاق عليهم الطعام في القحط فلما اتسع امتلأوا وماتوا {cite:canon-ibn-sina-print-v1 p.228}."
  en: "Ibn Sina advises hot food in winter and cold or only slightly warm food in summer, never so hot or cold as to be unbearable; he warns against a feast in plenty followed by hunger in scarcity, and the reverse, and says he saw people die who filled themselves when food widened after a famine {cite:canon-ibn-sina-print-v1 p.228}."
  es: "Ibn Sina aconseja comer alimentos calientes en invierno y fríos o solo ligeramente tibios en verano, nunca tan calientes o fríos como para resultar insoportables; advierte contra un festín en abundancia seguido de hambre en escasez, y viceversa, y dice que vio morir a personas que se atiborraron cuando la comida se extendió después de una hambruna {cite:canon-ibn-sina-print-v1 p.228}."
  fr: "Ibn Sina conseille de manger chaud en hiver et froid ou légèrement chaud en été, jamais au point d'être insupportable; il met en garde contre un festin en période d'abondance suivi d'une faim en période de pénurie, et inversement, et dit avoir vu des gens mourir après s'être gavés lorsque la nourriture s'est répandue après une famine {cite:canon-ibn-sina-print-v1 p.228}."
