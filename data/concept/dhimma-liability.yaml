id: concept/dhimma-liability
class: concept
kind: legal
label:
  ar: "الذمة ⁦(في الفقه)⁩"
  en: "Dhimma (the liability that bears rights and duties, in the rulings)"
  ur: "ذمہ ⁦(فقہی اصطلاح: حقوق و واجبات کا محل)⁩"
  es: "Objeto (la responsabilidad que conlleva derechos y obligaciones, en las resoluciones)"
  fr: "Objet (la responsabilité qui engendre des droits et des obligations, dans les décisions)"
  tr: "Dhimma (Hukuk Alanında)"
  id: "Dhimma (dalam Yurisprudensi)"
summary:
  ar: "الذمة في الفقه وصف في الشخص أو نفس له عهد، يصير به أهلا لثبوت الحقوق له وعليه، وهي لازمة للإنسان من الحمل حتى الموت، واحدة لكل شخص، لا حد لسعتها، متعلقة بالشخص لا بأمواله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8482} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8484} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8485} وتنتهي الذمة بالموت، فيرى الجمهور أنها تبقى حتى تصفى الحقوق المتعلقة بالتركة، ويرى بعض الحنفية أنها تضعف، ويرى الحنابلة في رواية أنها تنتهي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8485} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8486} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8487}"
  en: "In the rulings the dhimma is a quality in a person, or a self with an obligation, by which he is fit to bear rights for and against him. It lasts from conception until death; each person has one; it has no limit of capacity; and it attaches to the person, not to his property. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8482} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8484} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8485} At death the majority hold that it stays until the estate's rights are settled, some Hanafis that it weakens, and a Hanbali narration that it ends. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8485} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8486} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8487}"
  ur: "فقہ میں ذمہ وہ وصف ہے جس کی بنا پر آدمی پر اور اس کے لیے حقوق ثابت ہوتے ہیں۔ یہ حمل سے موت تک رہتا ہے اور ہر شخص کا ایک ہی ذمہ ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8482} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8485}"
  es: "En las resoluciones, la cuestión es si existe en una persona una cualidad, o un yo con una obligación, por la cual es apto para tener derechos a favor y en contra de sí mismo. Dura desde la concepción hasta la muerte; cada persona tiene uno; no tiene límite de capacidad; y se adjunta a la persona, no a su propiedad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8482} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8485} Al morir, la mayoría sostiene que permanece hasta que se liquidan los derechos de la herencia, algunos hanafíes que se debilita, y una narración hanbalí que termina. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8485} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8486} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8487}"
  fr: "Dans les décisions relatives à la succession, la question est de savoir s'il existe chez une personne une qualité, ou un soi avec une obligation, qui la rend apte à avoir des droits pour et contre elle. Cette succession dure de la conception à la mort; chaque personne en possède une; elle n'a pas de limite de capacité; et elle s'attache à la personne, non à ses biens. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8482} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8485} À la mort, la majorité considère qu'elle demeure jusqu'à ce que les droits successoraux soient réglés, certains hanafites qu'elle s'affaiblit, et une tradition hanbalite qu'elle prend fin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8485} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8486} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8487}"
  tr: "Fıkıhta, zimma, hem kendisi hem de hakları için hak kazanmaya hak kazandıran bir sözleşmesi olan kişi veya kişinin tanımıdır. Hamilelikten ölümüne kadar kişiye bağlayıcıdır, her kişiye özgüdür, sınırsızdır ve kişiyle ilgilidir, servetiyle değil. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.8482} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8484} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8485} ve sorumluluk ölümle sona erer. Çoğunluk, mirasla ilgili haklar kesinleşene kadar sorumluluğun devam ettiğine, bazı Hanafiler zayıfladığına inanır, Hanbaliler ise bir anlatımda sona erdiğine inanır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8485} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8486} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8487}"
  id: "Dalam yurisprudensi, dhimma adalah deskripsi tentang seseorang atau orang yang memiliki perjanjian, sehingga mereka memenuhi syarat untuk menetapkan hak bagi dirinya dan hak-hak mereka. Dhimma mengikat seseorang dari kehamilan hingga kematian, unik untuk setiap orang, tanpa batas, dan berkaitan dengan orang tersebut, bukan kekayaannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8482} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8484} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8485} dan tanggung jawab berakhir dengan kematian. Mayoritas percaya tanggung jawab itu tetap sampai hak-hak terkait harta diselesaikan, beberapa Hanafi percaya hak itu melemah, dan Hanbal dalam salah satu narasi percaya itu berakhir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8485} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8486} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8487}"
