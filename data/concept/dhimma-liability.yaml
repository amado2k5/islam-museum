id: concept/dhimma-liability
class: concept
kind: legal
label:
  ar: "الذمة (في الفقه)"
  en: "Dhimma (the liability that bears rights and duties, in the rulings)"
  ur: "ذمہ (فقہی اصطلاح: حقوق و واجبات کا محل)"
summary:
  ar: "الذمة في الفقه وصف في الشخص أو نفس له عهد، يصير به أهلا لثبوت الحقوق له وعليه، وهي لازمة للإنسان من الحمل حتى الموت، واحدة لكل شخص، لا حد لسعتها، متعلقة بالشخص لا بأمواله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8482} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8484} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8485} وتنتهي الذمة بالموت، فيرى الجمهور أنها تبقى حتى تصفى الحقوق المتعلقة بالتركة، ويرى بعض الحنفية أنها تضعف، ويرى الحنابلة في رواية أنها تنتهي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8485} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8486} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8487}"
  en: "In the rulings the dhimma is a quality in a person, or a self with an obligation, by which he is fit to bear rights for and against him. It lasts from conception until death; each person has one; it has no limit of capacity; and it attaches to the person, not to his property. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8482} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8484} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8485} At death the majority hold that it stays until the estate's rights are settled, some Hanafis that it weakens, and a Hanbali narration that it ends. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8485} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8486} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8487}"
  ur: "فقہ میں ذمہ وہ وصف ہے جس کی بنا پر آدمی پر اور اس کے لیے حقوق ثابت ہوتے ہیں۔ یہ حمل سے موت تک رہتا ہے اور ہر شخص کا ایک ہی ذمہ ہوتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8482} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8485}"
