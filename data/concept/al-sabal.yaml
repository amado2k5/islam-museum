label:
  ar: "السبل"
  en: "Sabal (the woven veil of the eye)"
  fr: "Sabal (le voile tissé de l’œil)"
  ur: "سبل"
  es: "Sabal (el velo tejido del ojo)"
summary:
  ar: "السبل غشاوة تعرض للعين من انتفاخ عروقها الظاهرة في سطح الملتحمة والقرنية وانتساج شيء فيما بينها كالدخان، وسببه امتلاء تلك العروق إما عن مواد تسيل إليها من طريق الغشاء الظاهر أو من طريق الغشاء الباطن لامتلاء الرأس وضعف العين، وقد يعرض معه حكة ودمعة وغشاوة وتأذ من ضوء الشمس وضوء السراج فيضعف البصر فيهما، والقوي منه لا يستغنى عن اللقط ⁦(صفة اللقط منقولة كوصف الكتاب لا كعمل)⁩ {cite:canon-ibn-sina-print-v2 p.185} {cite:canon-ibn-sina-print-v2 p.186}"
  en: "Sabal is a veil occurring to the eye from swelling of its vessels visible on the surface of the conjunctiva and cornea, something weaving between them like smoke; its cause is the filling of those vessels, either from materials flowing to them by way of the outer membrane or by way of the inner membrane from the head's repletion and the eye's weakness; it may come with itch, tearing, veiling and hurt from sunlight and lamplight weakening sight in both; the strong one cannot do without excision ⁦(the excision carried as the book's description, not as procedure)⁩ {cite:canon-ibn-sina-print-v2 p.185} {cite:canon-ibn-sina-print-v2 p.186}"
  fr: "Le sabal est un voile qui survient à l’œil du fait du gonflement de ses vaisseaux, visibles à la surface de la conjonctive et de la cornée, quelque chose qui se tisse entre eux comme une fumée ; sa cause est la réplétion de ces vaisseaux, soit par des matières qui y affluent par la voie de la membrane extérieure, soit par la voie de la membrane intérieure, du fait de la réplétion de la tête et de la faiblesse de l’œil ; il peut s’accompagner de prurit, de larmoiement, de voile et de gêne à la lumière du soleil et des lampes, qui affaiblit la vue sous l’une comme sous l’autre ; le sabal fort ne peut se passer d’excision ⁦(l’excision est rapportée comme description du livre, non comme procédure)⁩ {cite:canon-ibn-sina-print-v2 p.185} {cite:canon-ibn-sina-print-v2 p.186}"
  ur: "سبل ایک غشاوت ہے جو آنکھ کو عرض ہوتی ہے اس کی رگوں کے ورم سے جو ملتحمہ اور قرنیہ کی سطح پر ظاہر ہوتی ہیں اور ان کے درمیان دھوئیں کی طرح کچھ بنا ہوا ہو؛ اس کا سبب ان رگوں کا بھر جانا ہے یا تو ایسی مادوں سے جو ظاہر غشاء کی راہ سے بہہ کر آئیں یا باطن غشاء کی راہ سے سر کے امتلاء اور آنکھ کے ضعف سے؛ اور ساتھ خارش، آنسو، غشاوت اور آفتاب اور چراغ کی روشنی سے تکلیف ہو سکتی ہے جس سے دونوں میں نظر کمزور پڑے؛ اور سخت کو لقط کے بغیر چارہ نہیں ⁦(لقط کی صفت کتاب کی روایت کے طور پر آئی، عمل کے طور پر نہیں)⁩ {cite:canon-ibn-sina-print-v2 p.185} {cite:canon-ibn-sina-print-v2 p.186}"
  es: "El sabal es un velo que aparece en el ojo debido a la inflamación de sus vasos, visible en la superficie de la conjuntiva y la córnea, como si algo se moviera entre ellas como humo. Su causa es el llenado de esos vasos, ya sea por sustancias que fluyen hacia ellos a través de la membrana externa o a través de la membrana interna debido a la saciedad de la cabeza y la debilidad del ojo. Puede ir acompañado de picazón, lagrimeo, velo y dolor causados por la luz solar y la luz de las lámparas, lo que debilita la visión en ambos casos. El más fuerte no puede prescindir de la extirpación (la extirpación se describe en el libro, no se describe como procedimiento). {cite:canon-ibn-sina-print-v2 p.185} {cite:canon-ibn-sina-print-v2 p.186}"
