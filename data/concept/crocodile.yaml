summary:
  ar: "التمساح عند الدميري: دابة عظيمة في النيل والأنهار الكبار، منها ما يجاوز عشرة أذرع، وعدّه الفقهاء في دواب الماء واختلفوا في أكل لحمه، وحكى القزويني في بحار الدنيا ما يقاربه من دواب الأنهار."
  en: "The crocodile in al-Damiri: a great beast of the Nile and the big rivers, some passing ten cubits; the jurists counted it among water creatures and differed on eating its flesh, and al-Qazwini tells of river-beasts like it in the seas of the world."
  ur: "دمیری کے نزدیک تمساح: نیل اور بڑے نہروں کا بڑا جانور، کچھ دس ہاتھ سے بڑے؛ فقہاء نے اسے آبی جاندروں میں گنا اور اس کا گوشت کھانے میں اختلاف کیا؛ قزوینی نے دنیا کے سمندروں میں ایسے ہی نہری جانوروں کے قصے لکھے۔"
  es: "El cocodrilo en al-Damiri: una gran bestia del Nilo y de los grandes ríos, algunos de más de diez codos; los juristas lo contaban entre las criaturas acuáticas y discrepaban sobre si comer su carne, y al-Qazwini habla de bestias fluviales como él en los mares del mundo."
  fr: "Le crocodile, selon al-Damiri, est une grande bête du Nil et des grands fleuves, dont certains dépassent dix coudées; les juristes le comptaient parmi les créatures aquatiques et divergeaient sur la question de savoir si l'on pouvait manger sa chair, et al-Qazwini parle de bêtes fluviales semblables dans les mers du monde."
  tr: "al-Damiri'ye göre, timsah Nil ve büyük nehirlerde büyük bir hayvandır, bazıları on arşını aşmaktadır. Hukukçular onu su hayvanı olarak kabul ederler, ancak eti konusunda farklı görüşürler. Al-Qazwini 'Bihar al-Dunya'da yakınındaki nehir hayvanlarından bahsetmiştir."
  id: "Menurut al-Damiri, buaya adalah hewan besar di Sungai Nil dan sungai-sungai besar, beberapa di antaranya melebihi sepuluh hasta. Para ahli hukum menganggapnya sebagai binatang air, tetapi mereka berbeda dalam dagingnya. Al-Qazwini menceritakan dalam 'Bihar al-Dunya' tentang binatang sungai yang dekat dengannya."
