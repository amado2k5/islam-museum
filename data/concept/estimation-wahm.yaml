id: concept/estimation-wahm
class: concept
kind: scientific
label: { ar: "القوة الوهمية عند ابن سينا", en: "The estimative power (wahm) in the Canon", ur: "قانون میں وہم کی قوت", es: "El poder estimativo (wahm) en el Canon", fr: "Le pouvoir estimatif (wahm) dans le Canon", tr: "İbn Sina'nın Hayali Gücü", id: "Kekuatan Imajinasi Ibn Sina" }
summary:
  ar: "الوهم عند ابن سينا قوة تحكم في المحسوسات بمعان غير محسوسة، كحكم الحيوان بأن الذئب عدو، وتفارق الخيال والمتخيلة بأن أفعالها أحكام، ولا يتعرض الطبيب لتعرفها لأن مضارها تتبع مضار قوى قبلها {cite:canon-ibn-sina-print-v1 pp.100-101}."
  en: "Estimation in Ibn Sina is the power that judges about sensibles by meanings that are not sensible, as an animal judges that the wolf is an enemy; it differs from imagination and the imaginative power in that its acts are judgments, and the physician does not study it because its harms follow harms to the powers before it {cite:canon-ibn-sina-print-v1 pp.100-101}."
  es: "La estimación en Ibn Sina es el poder que juzga sobre lo sensible mediante significados que no son sensibles, como un animal juzga que el lobo es un enemigo; se diferencia de la imaginación y del poder imaginativo en que sus actos son juicios, y el médico no la estudia porque sus daños siguen a los daños a los poderes que la preceden {cite:canon-ibn-sina-print-v1 pp.100-101}."
  fr: "L'estimation chez Ibn Sina est le pouvoir qui juge les sensibles par des significations qui ne sont pas sensibles, comme un animal juge que le loup est un ennemi; elle diffère de l'imagination et du pouvoir imaginatif en ce que ses actes sont des jugements, et le médecin ne l'étudie pas parce que ses dommages suivent les dommages des pouvoirs qui la précèdent {cite:canon-ibn-sina-print-v1 pp.100-101}."
  ur: "ابن سینا میں تخمینہ وہ طاقت ہے جو سمجھداروں کے بارے میں ایسے معانی سے فیصلہ کرتی ہے جو سمجھدار نہیں ہیں، جیسا کہ ایک جانور فیصلہ کرتا ہے کہ بھیڑیا دشمن ہے۔ یہ تخیل اور تخیلاتی قوت سے اس لحاظ سے مختلف ہے کہ اس کے اعمال فیصلے ہیں، اور طبیب اس کا مطالعہ نہیں کرتا کیونکہ اس کے نقصانات اس سے پہلے کی طاقتوں کو نقصان پہنچاتے ہیں۔"
  tr: "İbn Sina için illüzyon, hayvanın kurdun düşman olduğuna dair yargısı ve hayal gücünden ve hayal gücünden ayrılması gibi, soyut anlamlara sahip somut şeyleri kontrol eden bir güçtür. Doktor onlara değinmez çünkü zararları, önlerindeki güçlerin zararlarını takip eder {cite:canon-ibn-sina-print-v1 s.100-101}."
  id: "Bagi Ibn Sina, ilusi adalah kekuatan yang mengendalikan hal-hal nyata dengan makna tak berwujud, seperti penilaian hewan bahwa serigala adalah musuh, dan pemisahan dari imajinasi dan tindakan yang dibayangkan sebagai penilaian. Dokter tidak membahas mereka karena kerugian mereka mengikuti dampak kekuatan di hadapan mereka {cite:canon-ibn-sina-print-v1 hlm.100-101}."
