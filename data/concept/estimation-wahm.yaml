id: concept/estimation-wahm
class: concept
kind: scientific
label: { ar: "القوة الوهمية عند ابن سينا", en: "The estimative power (wahm) in the Canon", ur: "قانون میں وہم کی قوت" }
summary:
  ar: "الوهم عند ابن سينا قوة تحكم في المحسوسات بمعان غير محسوسة، كحكم الحيوان بأن الذئب عدو، وتفارق الخيال والمتخيلة بأن أفعالها أحكام، ولا يتعرض الطبيب لتعرفها لأن مضارها تتبع مضار قوى قبلها {cite:canon-ibn-sina-print-v1 pp.100-101}."
  en: "Estimation in Ibn Sina is the power that judges about sensibles by meanings that are not sensible, as an animal judges that the wolf is an enemy; it differs from imagination and the imaginative power in that its acts are judgments, and the physician does not study it because its harms follow harms to the powers before it {cite:canon-ibn-sina-print-v1 pp.100-101}."
