label: { ar: "رد البتاني ما قيل في السنة بالعودة إلى كوكب ثابت", en: "Al-Battani on the year counted by the return to a fixed star", ur: "ثابت ستارے کی طرف واپسی سے سال گننے پر البتانی کا ردّ", es: "Al-Battani en el año contado por el regreso a una estrella fija" }
summary:
  ar: "في الباب السابع والعشرين يذكر البتاني أن الأوائل اختلفوا في مقدار السنة، وأن بعض قدماء أهل مصر وبابل جعلوها ثلاثمائة وخمسة وستين يوماً وربعاً وجزءاً من مائة وعشرين من اليوم، وأنهم عدّوها من مفارقة الشمس بعض الكواكب الثابتة إلى عودتها إليه، وينقل عن بطليموس أن هذا الرأي في غاية الضعف {cite:zij-sabi-nallino-byblion p.65}."
  en: "In chapter 27 al-Battani reports that earlier astronomers disagreed on the length of the year; some ancient Egyptians and Babylonians gave it as three hundred and sixty-five days, a quarter, and a part of a hundred and twenty of a day, counting it from the Sun's leaving a fixed star until it returns to it, and he reports Ptolemy's judgement that this view is extremely weak {cite:zij-sabi-nallino-byblion p.65}."
  ur: "ستائیسویں باب میں البتانی بتاتے ہیں کہ پہلے ماہرین فلکیات سال کی مقدار میں مختلف تھے؛ مصر اور بابل کے بعض قدماء نے اسے تین سو پینسٹھ دن، ایک چوتھائی اور دن کے ایک سو بیسویں حصے کے برابر بتایا، اور اسے سورج کے کسی ثابت ستارے سے جدا ہونے سے اس کی طرف لوٹنے تک شمار کیا؛ وہ بطلیموس کا قول نقل کرتے ہیں کہ یہ رائے نہایت کمزور ہے {cite:zij-sabi-nallino-byblion p.65}۔"
  es: "En el capítulo 27, al-Battani informa que los astrónomos anteriores no estaban de acuerdo sobre la duración del año; algunos antiguos egipcios y babilonios la consideraban de trescientos sesenta y cinco días, un cuarto y una fracción de ciento veinte días, contándolo desde que el Sol abandona una estrella fija hasta que regresa a ella, y menciona el juicio de Ptolomeo de que esta visión es extremadamente débil {cite:zij-sabi-nallino-byblion p.65}."
