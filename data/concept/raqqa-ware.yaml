label: { ar: "خزف الرقة", en: "Raqqa ware", ur: "رقہ کے ظروف", es: "Artículos de Raqqa", fr: "Articles de Raqqa", tr: "Raqqa Seramiği", id: "Keramik Raqqa" }
summary:
  ar: "خزف صُنع في الرقة على الفرات الأعلى بين نحو 1171م وتخريب المغول للمدينة سنة 1259م: محفور بطلاء واحد، وذو بريق بني شوكولاتي مع الأزرق، ومرسوم تحت الطلاء بالأسود والأزرق والأحمر {cite:lane-early-islamic-pottery-1947 p. 57} {cite:lane-early-islamic-pottery-1947 p. 58} {cite:lane-early-islamic-pottery-1947 p. 65}."
  en: "Pottery made at Raqqa on the upper Euphrates between about 1171 and the Mongol sack of the city in 1259: monochrome carved wares, chocolate-brown lustre with blue, and underglaze painting in black, blue and red {cite:lane-early-islamic-pottery-1947 p. 57} {cite:lane-early-islamic-pottery-1947 p. 58} {cite:lane-early-islamic-pottery-1947 p. 65}."
  ur: "وہ ظروف جو بالائی فرات پر رقہ میں تقریباً 1171ء سے 1259ء میں منگولوں کے ہاتھوں شہر کی تباہی تک بنے: یک رنگ کندہ ظروف، نیلے کے ساتھ چاکلیٹی بھوری چمک، اور سیاہ، نیلے اور سرخ میں زیرِ لعاب نقاشی {cite:lane-early-islamic-pottery-1947 p. 57} {cite:lane-early-islamic-pottery-1947 p. 58} {cite:lane-early-islamic-pottery-1947 p. 65}۔"
  es: "Cerámica hecha en Raqqa en el alto Éufrates entre aproximadamente 1171 y el saqueo mongol de la ciudad en 1259: piezas talladas monocromáticas, lustre marrón chocolate con azul y pintura bajo vidriado en negro, azul y rojo {cite:lane-early-islamic-pottery-1947 p. 57} {cite:lane-early-islamic-pottery-1947 p. 58} {cite:lane-early-islamic-pottery-1947 p. 65}."
  fr: "Poterie fabriquée à Raqqa sur le Haut-Euphrate entre environ 1171 et le sac de la ville par les Mongols en 1259: céramiques monochromes sculptées, lustre brun chocolat avec du bleu et peinture sous glaçure en noir, bleu et rouge {cite:lane-early-islamic-pottery-1947 p. 57} {cite:lane-early-islamic-pottery-1947 p. 58} {cite:lane-early-islamic-pottery-1947 p. 65}."
  tr: "M.S. 1171 civarından 1259'da Moğolların şehrin yıkımına kadar Üst Fırat kıyısında Rakka'da yapılmış çömlekler: tek boya ile oyulmuş, mavi ve çikolata-kahverengi parlaklıkla boyanmış, siyah, mavi ve kırmızı boyaların altında boyanmıştır {cite:lane-early-islamic-pottery-1947 s. 57} {cite:lane-early-islamic-pottery-1947 s. 65}."
  id: "Keramik yang dibuat di Raqqa di Sungai Efrat Hulu antara sekitar tahun 1171 M dan kehancuran kota oleh Mongol pada tahun 1259 M: diukir dengan satu cat, berkilau coklat cokelat dan biru, dan dicat di bawah cat hitam, biru, dan merah {cite:lane-early-islamic-pottery-1947 hlm. 57} {cite:lane-early-islamic-pottery-1947 hlm. 65}."
