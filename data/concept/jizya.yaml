label:
  ar: الجزية
  en: Jizya (capitation on treaty peoples)
  es: "Jizya (impuesto per cápita sobre los pueblos signatarios de tratados)"
  fr: "Jizya (capitation imposée aux peuples ayant conclu un traité)"
  ur: "جزیہ ⁦(معاہدہ افراد پر کیپٹیشن)⁩"
  tr: "Jizya"
  id: "Jizya"
summary:
  ar: "الجزية عند البلاذري ما يؤديه أهل الكتاب رؤوساً بموجب الصلح مقابل الإقرار على دينهم وأرضهم: روى عن الزهري «أن أول من أعطى الجزية من أهل الكتاب أهل نجران فيما علمنا وكانوا نصارى، ثم أعطى أهل أيلة وأذرح وأهل أذرعات الجزية في غزوة تبوك»؛ ومن صورها عنده دينار على كل حالم في السنة — هكذا صالح أهل أيلة فبلغ ثلاثمائة دينار، وصالح أهل جرش ديناراً على كل حالم مع ضيافة المسلمين، وصالح أهل أذرح على مائة دينار في كل رجب، وصالح يهود مقنى على ربع صيد العروك وربع غزل النساء وربع الثمار — ولم يكن على أهل مقنى بعده «جزية ولا سخرة»؛ ولما ولي عمر بن عبد العزيز أمر بإحصاء أهل نجران فوجدهم على العشر من عدتهم الأولى فقال «أرى هذا الصلح جزيةً على رؤوسهم وليس هو بصلح على أراضيهم، وجزية الميت والمسلم ساقطة» فألزمهم مائتي حلة؛ وكانت الجزية بالشام في بدو الأمر جريباً وديناراً على كل جمجمة ⁦(عن الأوزاعي)⁩، وقيل إن خالد بن الوليد صالح أهل دمشق على إلزام كل رجل ديناراً وجريب حنطة وخلّاً وزيتاً لقوت المسلمين، ثم وضعها عمر بن الخطاب على أهل الذهب أربعة دنانير وعلى أهل الورق أربعين درهماً وجعلهم طبقات لغنى الغني وإقلال المقل وتوسط المتوسط، وأمر أمراء الأجناد أن يضربوها على كل من جرت عليه الموسى ويجعلوا عليهم من أرزاق المسلمين مدّين حنطة حجازية وثلاثة أقساط زيتاً كل شهر لكل إنسان بالشام والجزيرة مع ودك وعسل لا يُدرى كم هو، ولكل إنسان بمصر في كل شهر أردب وكسوة وضيافة ثلاثة أيام ⁦(عن أسلم مولى عمر في طرق إلى نافع ومالك)⁩؛ وذكر مشايخ حمص أن اليهود كانوا كالذمة للنصارى يؤدون إليهم الخراج فدخلوا معهم في الصلح. وتعرّفها الطبعة الثانية من دائرة المعارف الإسلامية بأنها ضريبة الرأس المفروضة على غير المسلمين في الدول الإسلامية، وتصف تاريخ نشأتها بأنه شديد التعقيد، مع جدل علمي في أن العرب فرضوا في البدء إتاوة جماعية أو ميزوا بين ضريبة الأشخاص وضريبة الأرض. وتذكر أنها صارت في العصر العباسي لا تعني إلا ضريبة الرأس على أهل الذمة، وتقع على الرجال البالغين الأحرار القادرين، وأن العثمانيين جبوها بسلّم من ثلاث درجات هي ثمانية وأربعون وأربعة وعشرون واثنا عشر درهماً من الفضة حتى زالت من الدول الإسلامية الحديثة."
  en: "Jizya in al-Baladhuri is what the People of the Book pay per head under treaty in return for confirmation in their religion and lands: he reports from al-Zuhri 'the first of the People of the Book to pay the jizya, so far as we know, were the people of Najran, who were Christians; then the people of Ayla, Adhruh and the people of Adhri'at paid jizya in the Tabuk campaign'; its forms with him include a dinar per hālim per year — the treaty of Ayla totalling three hundred dinars, Jurash a dinar per hālim plus hospitality for Muslims, Adhruh a hundred dinars every Rajab, and the Jews of Maqna a quarter of the 'uruk catch, a quarter of the women's spinning and a quarter of the fruits — beyond which the people of Maqna owed 'no jizya and no corvée'; when Umar ibn Abd al-Aziz took office he had the people of Najran counted, found them at a tithe of their former number and said 'I see this treaty is a jizya on their heads, not a treaty on their lands — and the jizya of the dead and of the Muslim lapses', so he set them at two hundred hullas. The Encyclopaedia of Islam, second edition, defines it as the poll-tax levied on non-Muslims in Muslim states and calls the history of its origins extremely complex, with a scholarly dispute over whether the Arabs at first levied a collective tribute or distinguished a tax on persons from a tax on land. It reports that under the Abbasids the word came to mean only the poll-tax on dhimmis, charged on adult, free, able-bodied men, and that the Ottomans collected it by a three-grade scale of 48, 24 and 12 silver dirhams until its disappearance from modern Muslim states."
  ur: "بلاذری کے نزدیک جزیہ وہ ہے جو اہل کتاب صلح کے تحت اپنے سروں کے عوض ادا کرتے ہیں، اس کے بدلے کہ انہیں ان کے دین اور زمین پر برقرار رکھا جائے؛ وہ نجران، ایلہ، اذرح اور جرش کے معاہدوں اور عمر بن عبدالعزیز کے نجران کے فیصلے کی مثالیں دیتے ہیں۔ انسائیکلوپیڈیا آف اسلام کا دوسرا ایڈیشن اسے مسلم ریاستوں میں غیر مسلموں پر لگایا جانے والا سر کا محصول بتاتا ہے اور اس کی ابتدا کی تاریخ کو نہایت پیچیدہ کہتا ہے، جس میں اس پر علمی اختلاف ہے کہ عربوں نے پہلے اجتماعی خراج لیا یا شخص اور زمین کے محصول میں فرق کیا۔ وہ بتاتا ہے کہ عباسی دور میں لفظ صرف اہلِ ذمہ کے سر کے محصول کے لیے رہ گیا، جو بالغ، آزاد، قابل مردوں پر لگتا تھا، اور عثمانیوں نے اسے چاندی کے اڑتالیس، چوبیس اور بارہ درہم کے تین درجوں سے وصول کیا۔"
  es: "La jizya en al-Baladhuri es lo que la Gente del Libro paga por cabeza bajo tratado a cambio de la confirmación en su religión y tierras: informa de al-Zuhri 'los primeros de la Gente del Libro en pagar la jizya, hasta donde sabemos, fueron la gente de Najran, que eran cristianos; luego la gente de Ayla, Adhruh y la gente de Adhri'at pagaron jizya en la campaña de Tabuk'; sus formas con él incluyen un dinar por hālim por año: el tratado de Ayla totalizaba trescientos dinares, Jurash un dinar por hālim más hospitalidad para los musulmanes, Adhruh cien dinares cada Rajab, y los judíos de Maqna una cuarta parte de la pesca de 'uruk, una cuarta parte del hilado de las mujeres y una cuarta parte de las frutas, más allá de lo cual la gente de Maqna no debía 'ni jizya ni trabajo forzado'; Cuando Umar ibn Abd al-Aziz asumió el cargo, mandó censar a la población de Najrán, la encontró reducida a la décima parte de su número anterior y dijo: «Veo que este tratado es una jizya sobre sus cabezas, no sobre sus tierras, y la jizya de los muertos y de los musulmanes caduca». Así, la fijó en doscientas hullas. La Enciclopedia del Islam, segunda edición, la define como el impuesto per cápita aplicado a los no musulmanes en los estados musulmanes y califica la historia de sus orígenes como extremadamente compleja, con una disputa académica sobre si los árabes inicialmente aplicaban un tributo colectivo o distinguían entre un impuesto sobre las personas y un impuesto sobre la tierra. Informa que bajo los abasíes la palabra pasó a significar únicamente el impuesto per cápita sobre los dhimmis, aplicado a hombres adultos, libres y aptos para el trabajo, y que los otomanos lo recaudaron mediante una escala de tres grados de 48, 24 y 12 dirhams de plata hasta su desaparición de los estados musulmanes modernos."
  fr: "La jizya, selon al-Baladhuri, est ce que les Gens du Livre paient par tête en vertu d'un traité en échange de la confirmation de leur religion et de leurs terres: il rapporte d'al-Zuhri que « les premiers parmi les Gens du Livre à payer la jizya, à notre connaissance, furent les habitants de Najran, qui étaient chrétiens; puis les habitants d'Ayla, d'Adhruh et d'Adhri'at payèrent la jizya lors de la campagne de Tabuk »; ses formes, selon lui, incluent un dinar par halim et par an — le traité d'Ayla totalisant trois cents dinars, Jurash un dinar par halim plus l'hospitalité pour les musulmans, Adhruh cent dinars chaque Rajab, et les Juifs de Maqna un quart de la prise d'uruk, un quart du filage des femmes et un quart des fruits — au-delà desquels les habitants de Maqna ne devaient « ni jizya ni corvée »; À son entrée en fonction, Umar ibn Abd al-Aziz fit recenser les habitants de Najran. Constatant que leur population n'était plus que la dîme de ce qu'elle était auparavant, il déclara: « Je vois que ce traité est une jizya sur leurs têtes, et non sur leurs terres – or, la jizya des morts et des musulmans est caduque. » Il fixa donc leur nombre à deux cents hullas. L'Encyclopédie de l'Islam, deuxième édition, la définit comme la capitation prélevée sur les non-musulmans dans les États musulmans et qualifie l'histoire de ses origines d'extrêmement complexe, faisant l'objet d'un débat parmi les érudits quant à savoir si les Arabes prélevaient initialement un tribut collectif ou s'ils distinguaient un impôt sur les personnes d'un impôt foncier. L'ouvrage rapporte que sous les Abbassides, le terme en vint à désigner uniquement la capitation des dhimmis, prélevée sur les hommes adultes, libres et valides, et que les Ottomans la percevaient selon un barème à trois niveaux: 48, 24 et 12 dirhams d'argent, jusqu'à sa disparition des États musulmans modernes."
  tr: "Al-Baladhuri'ye göre, cizye, Kitap Ahli'nin ateşkes uyarınca dinlerini ve topraklarını kabul etmeleri karşılığında baş olarak ödedikleri şeydir: El-Zuhri'den şöyle rivayet eder: \"Kitap ahli arasında cizye ödeyen ilk kişiler Necran halkıydı, bildiğimiz kadarıyla onlar Hristiyandı, sonra Tabuk Savaşı'nda Ailah, Adhrah ve Adhra'at halkına cizye verdi.\" Bunu örnekleyenler arasında yıl boyunca her rüya gören için bir dinar vardı — Ayla halkı böyle doğru oldu, üç yüz dinara ulaştı, Jerash'ın doğruları her rüya gören için Müslüman misafirperverliğiyle bir dinar, Adhrah'ın doğruluğu ise yüz dinar aldı Her Rajab'da bir dinar, Muqna Yahudileri avın dörtte birini Uruk için, kadınların eğirmesinin dörtte birini ve meyvelerin dörtte birini ödediler—ondan sonra Muqna halkı cizye veya zorla çalıştırılmadı.' Ömer bin Abdülaziz vali olduğunda, Necran halkının nüfus sayımı yapılmasını emretti ve onların ilk sayısının onda biri olduğunu tespit etti; şöyle dedi: 'Bunu başlarına bir vergi olarak görüyorum, topraklarına değil, ölüler ve Müslümanlar için cizye muaf tutulur.' İki yüz giysi koydu; ve Umre'nin şafağında Levant'ta cizye bir döküm ve her kafatası için bir dinar idi (El-Avza'i'ye göre). Şam halkından Halid bin el-Velid Saleh'in, her erkeğe Müslümanların geçimini sağlamak için bir dinar ve bir çuval buğday, arpa ve yağ vermesini zorunlu kıldığı söylenir. Sonra Ömer bin el-Hattab, halka altın, kağıt insanına kırk dirhem koydu; bunları zenginler, kıtlık ve orta sıralar olarak yerleştirdi. Asker komutanlarına, Musa'nın geldiği herkese bu dinarı vurmalarını ve Müslümanların geçim kaynağına bir parça olarak vermesini emretti; bu, Levant ve Cazire'deki her kişi için her ay üç taksit yağ, ayrıca bilinmeyen sevgi ve bal ile birlikte Ne kadar? Mısır'da her kişi ayda üç gün ardap, giysi ve misafirperverlik yapar (Aslam, Ömer'in özgür kölesi, Nafi ve Malik yollarında); Hums şeyhleri Yahudilerin Hristiyanlar gibi olduklarını, onlara vergi ödediklerini ve bu yüzden onlarla barış yaptıklarını belirtirlerdi. İslam Ansiklopedisi'nin ikinci baskısı, bunu İslam ülkelerinde gayrimüslimlere uygulanan baş vergisi olarak tanımlar ve kökenini oldukça karmaşık olarak tanımlar; akademik tartışmalar ise Arapların başlangıçta toplu haraç uyguladığı veya kişi vergisi ile toprak vergisi arasında ayrım yaptıklarını belirtir. Abbasi döneminde bunun sadece zimmilere uygulanan baş vergisi anlamına geldiği ve yetenekli, özgür, yetişkin erkeklere uygulandığı belirtilir. Osmanlılar bunu üç derecelik bir ölçekte topladılar: kırk sekiz, yirmi dört ve on iki dirhem gümüş, ta ki modern İslam devletlerinden kaybolana kadar."
  id: "Menurut Al-Baladhuri, jizya adalah apa yang dibayar oleh Umat Kitab sebagai kepala sesuai gencatan senjata sebagai imbalan atas pengakuan agama dan tanah mereka: Ia menceritakan dari al-Zuhri, \"Yang pertama di antara Umat Kitab yang membayar jizya adalah orang-orang Najran, sejauh yang kita tahu, dan mereka adalah Kristen, lalu ia memberikan jizya kepada umat Ailah, Adhrah, dan Adhra'at dalam Pertempuran Tabuk.\" Di antara mereka yang menggambarkannya adalah satu dinar untuk setiap pemimpi dalam setahun — begitulah orang-orang Ayla benar, mencapai tiga ratus dinar, orang benar Jerash satu dinar untuk setiap pemimpi dengan keramahan Muslim, dan kebenaran Adhrah untuk seratus Satu dinar di setiap Rajab, dan orang Yahudi Muqna membayar seperempat perburuan untuk 'Uruk, seperempat pemintalan wanita, dan seperempat buah—setelah dia, rakyat Muqna tidak dikenakan jizya atau kerja paksa.' Ketika Umar ibn Abd al-Aziz menjadi gubernur, ia memerintahkan sensus rakyat Najran dan menemukan mereka sepersepuluh dari jumlah pertama mereka, dengan mengatakan, 'Saya melihat ini sebagai upeti atas kepala mereka, bukan upeti atas tanah mereka, dan jizya untuk yang mati dan Muslim dibebaskan.' Ia mengenakan dua ratus pakaian; dan di Levant pada awal Umrah, jizya adalah satu tuang dan satu dinar untuk setiap tengkorak (menurut Al-Awza'i). Dikatakan bahwa Khalid ibn al-Walid Saleh dari rakyat Damaskus mewajibkan setiap orang untuk memberikan satu dinar dan satu karung gandum, jelai, dan minyak untuk kelangsungan hidup umat Muslim. Kemudian Umar ibn al-Khattab mengenakan empat dinar kepada orang emas dan empat puluh dirham kepada orang kertas, menjadikannya tingkatan untuk orang kaya, kekurangan, dan tengah tengah. Ia memerintahkan para komandan tentara untuk menembakkan dinar itu kepada setiap orang yang didatangi Musa dan menjadikan mereka bagian dari mata pencaharian umat Muslim sebagai hutang gandum Hijazi dan tiga angsuran minyak setiap bulan untuk setiap orang di Levant dan Jazira, bersama dengan cinta dan madu yang tidak diketahui Berapa harganya? Setiap orang di Mesir memiliki tiga hari ardab, pakaian, dan keramahan setiap bulan (dari Aslam, budak yang dibebaskan dari Umar, di jalur menuju Nafi' dan Malik); para syekh Homs menyebutkan bahwa orang Yahudi seperti orang Kristen, membayar pajak kepada mereka, sehingga mereka berdamai dengan mereka. Edisi kedua Ensiklopedia Islam mendefinisikannya sebagai pajak kepala yang dikenakan pada non-Muslim di negara-negara Islam, menggambarkan asal-usulnya sangat kompleks, dengan perdebatan ilmiah bahwa orang Arab awalnya mengenakan upeti kolektif atau membedakan antara pajak orang dan pajak tanah. Disebutkan bahwa selama era Abbasiyah, pajak ini hanya berarti pajak kepala pada dhimmi, dan dikenakan pada pria dewasa yang mampu dan bebas. Ottoman mengumpulkannya dengan skala tiga derajat: empat puluh delapan, dua puluh empat, dan dua belas dirham perak, hingga akhirnya menghilang dari negara-negara Islam modern."
