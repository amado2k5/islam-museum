id: concept/jizya
class: concept
kind: legal
label:
  ar: الجزية
  en: Jizya (capitation on treaty peoples)
summary:
  ar: "الجزية عند البلاذري ما يؤديه أهل الكتاب رؤوساً بموجب الصلح مقابل الإقرار على دينهم وأرضهم: روى عن الزهري «أن أول من أعطى الجزية من أهل الكتاب أهل نجران فيما علمنا وكانوا نصارى، ثم أعطى أهل أيلة وأذرح وأهل أذرعات الجزية في غزوة تبوك»؛ ومن صورها عنده دينار على كل حالم في السنة — هكذا صالح أهل أيلة فبلغ ثلاثمائة دينار، وصالح أهل جرش ديناراً على كل حالم مع ضيافة المسلمين، وصالح أهل أذرح على مائة دينار في كل رجب، وصالح يهود مقنى على ربع صيد العروك وربع غزل النساء وربع الثمار — ولم يكن على أهل مقنى بعده «جزية ولا سخرة»؛ ولما ولي عمر بن عبد العزيز أمر بإحصاء أهل نجران فوجدهم على العشر من عدتهم الأولى فقال «أرى هذا الصلح جزيةً على رؤوسهم وليس هو بصلح على أراضيهم، وجزية الميت والمسلم ساقطة» فألزمهم مائتي حلة؛ وكانت الجزية بالشام في بدو الأمر جريباً وديناراً على كل جمجمة ⁦(عن الأوزاعي)⁩، وقيل إن خالد بن الوليد صالح أهل دمشق على إلزام كل رجل ديناراً وجريب حنطة وخلّاً وزيتاً لقوت المسلمين، ثم وضعها عمر بن الخطاب على أهل الذهب أربعة دنانير وعلى أهل الورق أربعين درهماً وجعلهم طبقات لغنى الغني وإقلال المقل وتوسط المتوسط، وأمر أمراء الأجناد أن يضربوها على كل من جرت عليه الموسى ويجعلوا عليهم من أرزاق المسلمين مدّين حنطة حجازية وثلاثة أقساط زيتاً كل شهر لكل إنسان بالشام والجزيرة مع ودك وعسل لا يُدرى كم هو، ولكل إنسان بمصر في كل شهر أردب وكسوة وضيافة ثلاثة أيام ⁦(عن أسلم مولى عمر في طرق إلى نافع ومالك)⁩؛ وذكر مشايخ حمص أن اليهود كانوا كالذمة للنصارى يؤدون إليهم الخراج فدخلوا معهم في الصلح. وتعرّفها الطبعة الثانية من دائرة المعارف الإسلامية بأنها ضريبة الرأس المفروضة على غير المسلمين في الدول الإسلامية، وتصف تاريخ نشأتها بأنه شديد التعقيد، مع جدل علمي في أن العرب فرضوا في البدء إتاوة جماعية أو ميزوا بين ضريبة الأشخاص وضريبة الأرض. وتذكر أنها صارت في العصر العباسي لا تعني إلا ضريبة الرأس على أهل الذمة، وتقع على الرجال البالغين الأحرار القادرين، وأن العثمانيين جبوها بسلّم من ثلاث درجات هي ثمانية وأربعون وأربعة وعشرون واثنا عشر درهماً من الفضة حتى زالت من الدول الإسلامية الحديثة."
  en: "Jizya in al-Baladhuri is what the People of the Book pay per head under treaty in return for confirmation in their religion and lands: he reports from al-Zuhri 'the first of the People of the Book to pay the jizya, so far as we know, were the people of Najran, who were Christians; then the people of Ayla, Adhruh and the people of Adhri'at paid jizya in the Tabuk campaign'; its forms with him include a dinar per hālim per year — the treaty of Ayla totalling three hundred dinars, Jurash a dinar per hālim plus hospitality for Muslims, Adhruh a hundred dinars every Rajab, and the Jews of Maqna a quarter of the 'uruk catch, a quarter of the women's spinning and a quarter of the fruits — beyond which the people of Maqna owed 'no jizya and no corvée'; when Umar ibn Abd al-Aziz took office he had the people of Najran counted, found them at a tithe of their former number and said 'I see this treaty is a jizya on their heads, not a treaty on their lands — and the jizya of the dead and of the Muslim lapses', so he set them at two hundred hullas. The Encyclopaedia of Islam, second edition, defines it as the poll-tax levied on non-Muslims in Muslim states and calls the history of its origins extremely complex, with a scholarly dispute over whether the Arabs at first levied a collective tribute or distinguished a tax on persons from a tax on land. It reports that under the Abbasids the word came to mean only the poll-tax on dhimmis, charged on adult, free, able-bodied men, and that the Ottomans collected it by a three-grade scale of 48, 24 and 12 silver dirhams until its disappearance from modern Muslim states."
  ur: "بلاذری کے نزدیک جزیہ وہ ہے جو اہل کتاب صلح کے تحت اپنے سروں کے عوض ادا کرتے ہیں، اس کے بدلے کہ انہیں ان کے دین اور زمین پر برقرار رکھا جائے؛ وہ نجران، ایلہ، اذرح اور جرش کے معاہدوں اور عمر بن عبدالعزیز کے نجران کے فیصلے کی مثالیں دیتے ہیں۔ انسائیکلوپیڈیا آف اسلام کا دوسرا ایڈیشن اسے مسلم ریاستوں میں غیر مسلموں پر لگایا جانے والا سر کا محصول بتاتا ہے اور اس کی ابتدا کی تاریخ کو نہایت پیچیدہ کہتا ہے، جس میں اس پر علمی اختلاف ہے کہ عربوں نے پہلے اجتماعی خراج لیا یا شخص اور زمین کے محصول میں فرق کیا۔ وہ بتاتا ہے کہ عباسی دور میں لفظ صرف اہلِ ذمہ کے سر کے محصول کے لیے رہ گیا، جو بالغ، آزاد، قابل مردوں پر لگتا تھا، اور عثمانیوں نے اسے چاندی کے اڑتالیس، چوبیس اور بارہ درہم کے تین درجوں سے وصول کیا۔"
