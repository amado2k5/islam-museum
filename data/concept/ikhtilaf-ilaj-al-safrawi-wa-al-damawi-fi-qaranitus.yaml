id: concept/ikhtilaf-ilaj-al-safrawi-wa-al-damawi-fi-qaranitus
class: concept
kind: scientific
label:
  ar: "اختلاف علاج الصفراوي والدموي في قرانيطس"
  en: "How the treatment of the bilious and the sanguine differ in qaranitus"
  ur: "قرانیطس میں صفراوی اور خونی کے علاج کا فرق"
  es: "En qué se diferencia el tratamiento de los casos biliares y sanguíneos en qaranitus"
  fr: "En quoi le traitement des bilieux et des sanguins diffère-t-il dans le qaranitus ?"
  tr: "Kur'an'larda safra ve hematolojik tedavideki farklılıklar"
  id: "Perbedaan dalam Pengobatan Empedu dan Hematologis dalam Quranites"
summary:
  ar: "يبيّن ابن سينا ما يختلف فيه علاج قرانيطس الصفراوي والدموي: أن الصفراوي يحتاج إسهال صفراء أكثر وفصداً أقل وتطفئة وتنويماً وترطيباً أكثر، والدموي إلى تحليل أكثر {cite:canon-ibn-sina-print-v2 p.82}"
  en: "Ibn Sina shows where the treatment of the bilious and the sanguine qaranitus differs: the bilious needs more purging of bile and less bleeding and more quenching, sleep and moistening, and the sanguine needs more dissolving {cite:canon-ibn-sina-print-v2 p.82}"
  ur: "ابن سینا بتاتا ہے کہ صفراوی اور خونی قرانیطس کے علاج میں کیا فرق ہے: صفراوی کو صفراء کا زیادہ اسہال اور کم فصد اور زیادہ بجھانے، سلانے اور تر کرنے کی حاجت ہے، اور خونی کو زیادہ تحلیل کی {cite:canon-ibn-sina-print-v2 p.82}۔"
  es: "Ibn Sina muestra dónde difiere el tratamiento de los qaranitus biliares y sanguíneos: el biliar necesita más purga de bilis y menos sangrado y más apaciguamiento, descanso y humectación, y el sanguíneo necesita más disolución {cite:canon-ibn-sina-print-v2 p.82}"
  fr: "Ibn Sina montre en quoi le traitement des qaranitus bilieux et sanguins diffère: les qaranitus bilieux nécessitent une purge biliaire plus importante, des saignements moins abondants, et davantage d’hydratation, de sommeil et d’humidification, tandis que les qaranitus sanguins nécessitent une dissolution plus importante {cite:canon-ibn-sina-print-v2 p.82}"
  tr: "İbn Sina, safra ve hematolojik koronit tedavisindeki farklılıkları açıklar: safra için daha fazla safra ishali, daha az fıtık, daha fazla yatıştırıcı, hipnotizasyon ve hidrasyon gerekirken, hematolojik daha fazla analiz gerektirir {cite:canon-ibn-sina-print-v2 s.82}"
  id: "Ibn Sina menjelaskan perbedaan dalam pengobatan koronitis empedu dan hematologis: empedu membutuhkan lebih banyak diare empedu, lebih sedikit hernia, lebih menenangkan, hipnotisasi, dan hidrasi, sementara hematologi membutuhkan analisis lebih lanjut {cite:canon-ibn-sina-print-v2 hlm.82}"
