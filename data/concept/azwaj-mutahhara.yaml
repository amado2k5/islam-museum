label:
  ar: "الأزواج المطهرة"
  en: "The Purified Spouses"
  ur: "پاکیزہ جوڑے"
summary:
  ar: "الأزواج المطهرة قرينة الجنة في كتاب الله: «ولهم فيها أزواج مطهرة وهم فيها خالدون»، وردت في ثلاث سور: البقرة وآل عمران والنساء، في سياق البشرى لمن آمن وعمل الصالحات. وفسّر المطهرة بأنهن طُهرن من كل أذى ودنس."
  en: "The purified spouses are Paradise's company in God's book: «and for them therein are purified spouses, and they abide therein forever», repeated in three suras — al-Baqara, Al Imran and al-Nisa — in the glad-tidings for whoever believes and does righteousness. The purified are read as cleansed of all hurt and defilement."
  ur: "پاکیزہ جوڑے اللہ کی کتاب میں جنت کی رفاقت ہیں: «ان کے لیے وہاں پاکیزہ جوڑے ہیں اور وہ اس میں ہمیشہ رہیں گے» — تین سورتوں بقرہ، آل عمران اور نساء میں ہر اس شخص کے لیے بشارت جو ایمان لائے اور نیک عمل کیے۔ پاکیزہ سے مراد ہر تکلیف اور ناپاکی سے پاک۔"
