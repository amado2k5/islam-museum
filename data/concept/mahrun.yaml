summary:
  ar: "محرون هو أصل الأنجدان، دون الحلتيت في القوة والمنافع، مليّن منضج، وفيه عسر انهضام ومضرة للمعدة إلا أن يكون بارداً فتتقوى به {cite:canon-ibn-sina-print-v1 p.568}."
  en: "Mahrun is the root of anjudan, below hiltit in strength and benefits, softening and ripening, hard to digest and harmful to the stomach unless the stomach is cold, in which case it is strengthened by it {cite:canon-ibn-sina-print-v1 p.568}."
  ur: "محرون انجدان کی جڑ ہے، قوت اور فائدوں میں حلتیت سے کم، نرم کرنے اور پکانے والی، ہضم میں دشوار اور معدے کے لیے نقصان دہ، مگر جب معدہ ٹھنڈا ہو تو اس سے مضبوط ہوتا ہے {cite:canon-ibn-sina-print-v1 p.568}۔"
