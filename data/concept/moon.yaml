summary:
  ar: "القمر نوراً وجعله الله منازل لتعلموا عدد السنين والحساب، وشق القمر على عهد النبي آية للناس، وأطواراً حتى عاد كالعرجون القديم."
  en: "The moon a light set in stations so you may know the count of years and reckoning; it was split in the Prophet's day as a sign for the people; and it wanes through phases until it returns like an old palm-stalk."
  ur: "چاند ایک روشنی جسے منزلوں میں رکھا گیا کہ تم برسوں کا شمار اور حساب جانو؛ نبی کے زمانے میں وہ لوگوں کے لیے نشانی بنا کر دو ٹکڑے ہوا؛ اور وہ دائرے میں گھٹ کر پرانے کھجور کے تنے کی طرح رہ جاتا ہے۔"
