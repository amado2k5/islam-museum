id: concept/ahl-al-qibla
education:
  did_you_know:
    ar: "قاعدة الطحاوي: أهل القبلة مسلمون مؤمنون ما صدّقوا بما جاء به النبي، ولا يُكفَّر أحد منهم بذنب ما لم يستحله."
    en: "Tahawi's rule: the people of the qibla are Muslim believers as long as they affirm what the Prophet brought; none is declared unbeliever for a sin he did not deem lawful."
    ur: "طحاوی کا اصول: اہلِ قبلہ مسلمان مومن ہیں جب تک وہ نبی کی لائی بات مانیں؛ کسی گناہ سے کفر نہیں کیا جاتا جب تک اسے حلال نہ سمجھا جائے۔"
    sources: [source/aqida-tahawiyya, source/lumat-al-itiqad]
class: concept
kind: doctrine
label:
  ar: أهل القبلة وعدم التكفير بالذنب
  en: The people of the qibla and not declaring takfir for sin
summary:
  ar: مبدأ الطحاوي في تسمية أهل القبلة مسلمين مؤمنين ما داموا مصدقين بما جاء به النبي، وألا يُكفَّر أحد منهم بذنب ما لم يستحله.
  en: al-Tahawi's principle of calling the people of the qibla Muslims and believers so long as they accept what the Prophet brought, and of not declaring any of them an unbeliever for a sin unless he declares it lawful.
