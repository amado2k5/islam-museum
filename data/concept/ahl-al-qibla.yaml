issue:
  ar: هل يُكفَّر مسلم بذنب، وهل يُشهد لأحد بجنة أو نار؟
  en: Is a Muslim declared an unbeliever for a sin, and may one testify that anyone is in Paradise or Hell?
perspectives:
- tradition: sunni-hanafi
  id: aqida-tahawiyya
  stance:
    ar: لا تكفير لأهل القبلة بذنب ما لم يستحله، ولا شهادة لأحد بجنة أو نار
    en: No takfir of the people of the qibla for sin unless he declares it lawful, and no testimony of Paradise or Hell for anyone
  summary:
    ar: يقول الطحاوي إنه لا يكفّر أحداً من أهل القبلة بذنب ما لم يستحله، ولا يخرج العبد من الإيمان إلا بجحود ما أدخله فيه، ولا يُنزل أحد جنة ولا ناراً.
  holders:
  - person/al-tahawi
  - work/aqida-tahawiyya
  evidence:
  - ref: source/aqida-tahawiyya
    note:
      ar: البنود 73 و78 إلى 82 و93، ص 20 و21 و23 و24
      en: articles 73, 78 to 82 and 93, pp. 20, 21, 23 and 24
  sources:
  - source/aqida-tahawiyya
- tradition: sunni-hanbali
  id: lumat-al-itiqad
  stance:
    ar: لا تكفير بذنب ولا إخراج من الإسلام بعمل، ولا جزم بجنة أو نار إلا لمن جزم له الرسول
    en: No takfir for a sin and no exclusion from Islam by an act, and no certainty of Paradise or Hell except for those the Messenger named
  summary:
    ar: 'يقول ابن قدامة: «ولا نكفر أحداً من أهل القبلة بذنب، ولا نخرجه عن الإسلام بعمل»، و«لا نجزم لأحد من أهل القبلة بجنة ولا نار، إلا من جزم له الرسول، لكنا نرجو للمحسن، ونخاف على المسيء».'
    en: Ibn Qudama says we do not declare any of the people of the qibla an unbeliever for a sin and do not exclude him from Islam by an act, and we are not certain of Paradise or Hell for any of them except those the Messenger was certain of, but we hope for the doer of good and fear for the doer of wrong.
  holders:
  - person/ibn-qudama-al-maqdisi
  - work/lumat-al-itiqad
  evidence:
  - ref: source/lumat-al-itiqad
    note:
      ar: ص 39
      en: p. 39
  sources:
  - source/lumat-al-itiqad
- tradition: sunni-hanbali
  id: aqida-wasitiyya
  stance:
    ar: الفاسق من أهل الملة لا يُسلب الإيمان بالكلية ولا يخلَّد في النار، بل هو مؤمن ناقص الإيمان
    en: The sinner of the community is not stripped of iman entirely nor kept in the Fire forever, but is a believer deficient in iman
  summary:
    ar: يقول ابن تيمية إن أهل السنة لا يسلبون الفاسق الملّي الإيمان بالكلية ولا يخلدونه في النار، بل يقولون هو «مؤمن ناقص الإيمان، أو مؤمن بإيمانه فاسق بكبيرته».
    en: Ibn Taymiyya says Ahl al-Sunna do not strip the sinner of the community of iman entirely nor keep him in the Fire forever, but say he is a believer deficient in iman, or a believer by his iman and a sinner by his grave sin.
  holders:
  - person/ibn-taymiyya
