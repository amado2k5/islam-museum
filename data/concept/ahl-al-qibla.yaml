- tradition: sunni-ashari
  id: maqalat-ashari
  stance:
    ar: لا تكفير لأحد من أهل القبلة بذنب، ولا شهادة لأحد من أهل الكبائر بالنار
    en: No takfir of anyone of the people of the qibla for a sin, and no testimony of Hell for any committer of grave sins
  summary:
    ar: يذكر الأشعري أنهم لا يكفرون أحداً من أهل القبلة بذنب يرتكبه كالزنا والسرقة، وأن أهل الكبائر مؤمنون بما معهم من الإيمان، ولا يشهدون على أحد منهم بالنار، ولا يحكمون بالجنة لأحد من الموحدين، وأمرهم إلى الله.
    en: Al-Ash'ari reports they do not declare any of the people of the qibla an unbeliever for a sin such as adultery or theft, that those of grave sins are believers by the iman they have, that they do not testify to Hell against any of them nor judge Paradise for any monotheist, and their matter is with God.
