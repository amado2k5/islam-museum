label: { ar: "الأنقاض", en: "Anqad (the rubble of demolished buildings, and its disposal, in endowments and in buildings on another's land)" }
summary:
  ar: "الأنقاض جمع نقض، وهي المنقوض أي المهدوم من البناء، ويستعمل الفقهاء اللفظ بهذا المعنى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3538} فما انهدم من بناء الوقف ينتفع بأنقاضه في عمارته، فإن تعذر إعادة عينه بيع وصرف ثمنه في عمارته، وكذلك المسجد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3538} وأما ما يقيمه الإنسان في ملك غيره فإن كان بإذن صاحبه فللمالك الخيار في الغالب بين أخذ البناء بقيمته أو نقضه، وإن كان بغير إذنه أُجبر الغاصب على نقض البناء وتسوية الأرض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3539}"
  en: "Anqad is the plural of naqd, the rubble of a demolished building, and the jurists use it in that sense. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3538} Where an endowed building falls, its rubble is used to rebuild it; if it cannot be restored, the rubble is sold and the price spent on its repair. The same holds for a mosque. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3538} For a building set on another's land, with the owner's leave the owner generally may take the building at its value or have it removed, while without leave the usurper must demolish it and restore the land. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3539}"
