label: { ar: "الأنقاض", en: "Anqad (the rubble of demolished buildings, and its disposal, in endowments and in buildings on another's land)", fr: "Anqad (décombres des bâtiments démolis et leur devenir dans les biens de mainmorte ou sur le terrain d’autrui)", es: "Anqad (los escombros de los edificios demolidos y su disposición, en donaciones y en edificios en terrenos ajenos)", ur: "عنقد ⁦(مسمار شدہ عمارتوں کا ملبہ، اور اس کا تصرف، اوقاف میں اور دوسرے کی زمین پر عمارتوں میں)⁩" }
summary:
  ar: "الأنقاض جمع نقض، وهي المنقوض أي المهدوم من البناء، ويستعمل الفقهاء اللفظ بهذا المعنى. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3538} فما انهدم من بناء الوقف ينتفع بأنقاضه في عمارته، فإن تعذر إعادة عينه بيع وصرف ثمنه في عمارته، وكذلك المسجد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3538} وأما ما يقيمه الإنسان في ملك غيره فإن كان بإذن صاحبه فللمالك الخيار في الغالب بين أخذ البناء بقيمته أو نقضه، وإن كان بغير إذنه أُجبر الغاصب على نقض البناء وتسوية الأرض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3539}"
  en: "Anqad is the plural of naqd, the rubble of a demolished building, and the jurists use it in that sense. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3538} Where an endowed building falls, its rubble is used to rebuild it; if it cannot be restored, the rubble is sold and the price spent on its repair. The same holds for a mosque. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3538} For a building set on another's land, with the owner's leave the owner generally may take the building at its value or have it removed, while without leave the usurper must demolish it and restore the land. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3539}"
  fr: "Anqad est le pluriel de naqd, les décombres d’un bâtiment démoli ; les juristes l’emploient dans ce sens. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3538} Lorsqu’un bâtiment constitué en bien de mainmorte s’effondre, ses décombres servent à le reconstruire. S’il ne peut être rétabli dans son état d’origine, les décombres sont vendus et le produit de la vente est affecté à sa remise en état. Il en va de même pour une mosquée. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3538} Pour un bâtiment édifié sur le terrain d’autrui avec son accord, le propriétaire peut généralement reprendre le bâtiment à sa valeur ou le faire enlever. En l’absence d’autorisation, celui qui a occupé le terrain sans droit doit démolir le bâtiment et remettre le terrain en état. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3539}"
  es: "Anqad es el plural de naqd, los escombros de un edificio demolido, y los juristas lo usan en ese sentido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3538} Cuando un edificio dotado se derrumba, sus escombros se utilizan para reconstruirlo; si no se puede restaurar, los escombros se venden y el precio se gasta en su reparación. Lo mismo ocurre con una mezquita. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3538} En el caso de un edificio situado en terreno ajeno, con el permiso del propietario, este generalmente puede tomar el edificio por su valor o mandarlo demoler, mientras que sin permiso el usurpador debe demolerlo y restaurar el terreno. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3539}"
  ur: "عنقد نقد کی جمع ہے، منہدم عمارت کا ملبہ، اور فقہاء اسے اسی معنی میں استعمال کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3538} جہاں کوئی مختص عمارت گرتی ہے، اس کا ملبہ اسے دوبارہ تعمیر کرنے کے لیے استعمال کیا جاتا ہے۔ اگر اسے بحال نہیں کیا جا سکتا تو ملبہ فروخت کر دیا جاتا ہے اور اس کی مرمت پر خرچ ہونے والی قیمت۔ مسجد کا بھی یہی حال ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 3538} کسی دوسرے کی زمین پر قائم عمارت کے لیے، مالک کی اجازت سے مالک عموماً عمارت کو اس کی قیمت پر لے سکتا ہے یا اسے ہٹا سکتا ہے، جبکہ غاصب کو بغیر اجازت کے اسے گرا کر زمین کو بحال کرنا چاہیے۔ {حوالہ: فقہ الموسوع کویتیہ نور v3 صفحہ 3539}"
