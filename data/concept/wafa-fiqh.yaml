id: concept/wafa-fiqh
class: concept
kind: legal
label:
  ar: "وَفاء"
  en: "Wafa' (fulfilment, fiqh)"
summary:
  ar: "الوفاء في اللغة ضد الغدر، وهو التمام والأداء وبلوغ الشيء تامّاً، وأوفى الكيل أتمّه؛ والوفاء في الاصطلاح ملازمة طريق المواساة ومحافظة العهود وحفظ مراسم المحبة سراً وعلانية. وقد فسّر العلماء قوله تعالى في سورة المائدة بحفظ ما يقتضيه العقد والقيام بموجبه، ويستعمل الفقهاء اللفظ بمعنى تسليم المعقود عليه، أو القضاء، أو الأداء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17564}\n\nالألفاظ ذات الصلة: الاستيفاء (أخذ الحق وافياً)، والإسقاط (إزالة الملك أو الحق لا إلى مالك ولا إلى مستحق)، والإبراء (إسقاط الحق في ذمة الغير)، وكلها تترتب عليها براءة الذمة، والفرق أن الوفاء يكون ممن عليه الحق والاستيفاء ممن له الحق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17564}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17565}\n\nالحكم التكليفي: يتنوع الوفاء بحسب المحل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17565} أولاً، ما يجب الوفاء به: العقود إذا تمت مستوفية لشرائطها كتسليم المبيع والثمن والأجرة، والشروط المشروعة، لحديث «المسلمون على شروطهم»، وما خالف كتاب الله فهو باطل، والنذر الطاعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17565} ثانياً، ما يُستحب الوفاء به: المعروف كالوصية والهبة، لأنها تبرع لا يجبر عليه؛ والوعد المجرد عن حاجة أو سبب مستحب، وإذا دعت الحاجة إليه وجب، كما نقل ابن عابدين عن جامع الفصولين، والمشهور عند المالكية أن الوعد ملزم ويُقضى به إذا دخل الموعود بسبب الوعد في شيء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17566}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17567}\n\nثالثاً، ما يُباح الوفاء به: نذر المباح كالأكل والشرب والنوم، وخلاف الفقهاء في انعقاد نذر المباح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17567} رابعاً، ما يحرم الوفاء به: نذر المعصية باتفاق، لحديث عائشة «من نذر أن يعصيه فلا يعصه»؛ والحلف على فعل محرم أو ترك واجب يُحنث فيه ويُكفَّر ولا يُوفى به؛ والشروط غير المشروعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17567}\n\nمن يصح منه الوفاء: التكليف، أي البلوغ والعقل، لأن الوفاء يجب نتيجة التصرفات التي يباشرها الإنسان باختياره، سواء بإرادتين كالبيع أو بإرادة واحدة كاليمين والنذر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17568} ومن أسباب الوفاء ما يتحقق به: التسليم في العقود، والرد عند انقضاء مدة العقد أو فسخه أو استحقاقه، والقيام بالعمل المطلوب كالأجير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17568}\n\nالتحقق من الوفاء: يتحقق بتسليم المعقود عليه، ومنه في البيع تسليم المبيع والثمن، وبرد المعقود عليه عند انقضاء العقد أو فسخه، وبقيام الأجير بالعمل المطلوب، وبالحوالة إذا استوفت شرائطها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17568}\n\nوفاء دين الغير: يصح بإذن المدين أو بغير إذنه باتفاق، وقيّد المالكية ذلك بالرفق بالمدين، فإن أراد الدائن الإضرار منع من ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17569} وفاء دين الميت وضمانه: يصح إذا ترك الميت ما يُوفى منه؛ وإذا كان مفلساً فجمهور الفقهاء يصححون ضمانه ووفاءه، لحديث أبي قتادة في ضمان دين الميت الذي لم يُخلف وفاءً، وعند أبي حنيفة لا تصح الكفالة بدين المفلس الميت، لكن يصح الوفاء تبرعاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17569}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17570}\n\nأسباب عدم الوفاء: (أ) المماطلة، وهي ظلم من الغني القادر، لحديث «مطل الغني ظلم»، ويستحق العقوبة، لحديث «لَيُّ الواجد يحلّ عرضه وعقوبته»، وقد اتفق الفقهاء على وجوب اتخاذ وسائل تحمل المدين الموسر على الوفاء، واختلفوا في بعضها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17570} (ب) الإعسار، وإذا ثبت بالبينة خُلّي سبيل المدين ولم يُحبس، لقوله تعالى في سورة البقرة بالإشارة لا بالنص. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17570} (ج) الإفلاس، وهو أن يكون الدين أكثر من المال، فيجب على الحاكم عند جمهور الفقهاء تفليسه إذا طلب الغرماء ذلك، وجاز له بيع ماله جبراً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17570}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17571}\n\nالأولوية في الوفاء: (أ) حقوق الله، ومنها الزكاة ومصارفها الثمانية، وقد اختلف الفقهاء في الترتيب بينها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17571} (ب) الحقوق المتعلقة بالتركة: تقديم تجهيز الميت وتكفينه، ثم أداء الدين، من ديون الله وديون العباد، ثم تنفيذ الوصايا، والباقي للورثة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17571} (ج) الصدقة والوصايا: والأفضل أن يتصدق الإنسان بما فاض عن حاجته ومؤونته ومؤونة من يمونه، لحديث «خير الصدقة ما كان عن ظهر غنى»، وأفضل الصدقة على ذي الرحم، ولهذا قال السرخسي إن ذلك فيه صلة الرحم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17571}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17572}"
  en: "Wafa', lexically, is the opposite of betrayal: completion, discharge, and bringing a thing to full measure; 'awfa al-kayl' is to complete the measure. Technically it is keeping to the way of mutual help, keeping covenants and maintaining the forms of affection in private and in public. The scholars explain the verse of sura al-Ma'ida on fulfilling contracts as keeping what the contract requires and acting on its consequences. The jurists use the word for handing over the thing contracted, for judgement and for payment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17564}\n\nRelated words: istifa' (taking one's right in full), isqat (releasing a right without a holder or a claimant), and ibra' (releasing a debt owed to oneself). All lead to the discharge of the obligation; the difference is that wafa' is done by the one who owes and istifa' by the one who is owed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17564}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17565}\n\nThe ruling varies by the act. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17565} First, what must be fulfilled: contracts, once complete with their conditions, such as delivering the goods and paying the price or wage; lawful conditions, on the saying that Muslims are bound by their conditions, while a condition contrary to the book of God is void; and vows of obedience. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17565} Second, what is recommended: good deeds such as bequests and gifts, which are donations that cannot be compelled; a bare promise, not tied to a need or a cause, is recommended to keep, but becomes obligatory when a need requires it, as Ibn 'Abidin reports from Jami' al-Fusulayn; the well-known Maliki view is that a promise is binding and may be enforced once the promisee has entered upon something because of it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17566}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17567} Third, what is permitted: a vow to do a permitted act, such as eating, drinking or sleeping, whose validity the jurists debate. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17567} Fourth, what is forbidden: a vow of disobedience, forbidden by agreement, on the saying of 'A'isha that whoever vows to disobey God must not disobey Him; an oath to do a forbidden act or omit a duty is to be broken with expiation, not kept; and unlawful conditions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17567}\n\nWho may fulfil: the one who is accountable, that is adult and sane, since the duty arises from acts he undertakes by his choice, whether they need two wills, as sale does, or one, as an oath or vow. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17568} How fulfilment is achieved: in contracts by handing over the thing; by returning the thing when the term ends, the contract is dissolved or the thing is shown to be another's; and by doing the work required, as a hired worker does. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17568}\n\nWays of fulfilment: it is achieved by handing over the thing contracted, such as the goods and the price in a sale; by returning the thing when the contract ends or is dissolved; by the worker doing the work required; and by a transfer of debt (hawala) when its conditions are met. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17568}\n\nPaying another's debt: this is valid with or without the debtor's permission by agreement; the Malikis add that it must be done kindly to the debtor, and forbidden if the creditor means to harm him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17569} Paying or guaranteeing a dead man's debt: valid where the dead man left something to pay from; where he was insolvent, the majority of jurists hold that guaranteeing and paying it is valid, citing the report of Abu Qatada, who guaranteed the debt of a dead man who left no means; Abu Hanifa does not allow the guarantee of an insolvent dead man's debt, but a gift of payment is valid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17569}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17570}\n\nThe causes of non-payment: (a) procrastination, which is injustice by a wealthy debtor, on the saying 'the procrastination of the rich is injustice', and such a debtor deserves punishment, on the saying that his reputation and punishment are lawful for the one who can pay; the jurists agree that means should be used to make a solvent debtor pay, and differ on some of them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17570} (b) Insolvency: if proved by evidence the debtor is released and not imprisoned, on the verse of sura al-Baqara (cited by sura only). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17570} (c) Bankruptcy, when debts exceed assets: the majority hold that the judge must declare him bankrupt when the creditors ask, and may sell his property by compulsion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17570}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17571}\n\nPriority in fulfilment: (a) God's rights, such as zakat and its eight categories, whose order the jurists dispute. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17571} (b) rights attached to an estate: the burial and shroud first, then debts, whether owed to God or to men, then bequests, and the rest to the heirs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17571} (c) charity and bequests: the best charity is what exceeds one's need and that of one's dependants, on the saying 'the best charity is from surplus wealth, and begin with those you support'; and the best charity is to kin, as al-Sarakhsi notes for keeping ties of kinship. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17571}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17572}"
