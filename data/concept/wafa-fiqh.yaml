label:
  ar: "وَفاء"
  en: "Wafa' (fulfilment, fiqh)"
  es: "Wafa' (cumplimiento, fiqh)"
summary:
  ar: "الوفاء في اللغة ضد الغدر، وهو التمام والأداء وبلوغ الشيء تامّاً، وأوفى الكيل أتمّه؛ والوفاء في الاصطلاح ملازمة طريق المواساة ومحافظة العهود وحفظ مراسم المحبة سراً وعلانية. وقد فسّر العلماء قوله تعالى في سورة المائدة بحفظ ما يقتضيه العقد والقيام بموجبه، ويستعمل الفقهاء اللفظ بمعنى تسليم المعقود عليه، أو القضاء، أو الأداء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17564}\n\nالألفاظ ذات الصلة: الاستيفاء ⁦(أخذ الحق وافياً)⁩، والإسقاط ⁦(إزالة الملك أو الحق لا إلى مالك ولا إلى مستحق)⁩، والإبراء ⁦(إسقاط الحق في ذمة الغير)⁩، وكلها تترتب عليها براءة الذمة، والفرق أن الوفاء يكون ممن عليه الحق والاستيفاء ممن له الحق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17564}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17565}\n\nالحكم التكليفي: يتنوع الوفاء بحسب المحل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17565} أولاً، ما يجب الوفاء به: العقود إذا تمت مستوفية لشرائطها كتسليم المبيع والثمن والأجرة، والشروط المشروعة، لحديث «المسلمون على شروطهم»، وما خالف كتاب الله فهو باطل، والنذر الطاعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17565} ثانياً، ما يُستحب الوفاء به: المعروف كالوصية والهبة، لأنها تبرع لا يجبر عليه؛ والوعد المجرد عن حاجة أو سبب مستحب، وإذا دعت الحاجة إليه وجب، كما نقل ابن عابدين عن جامع الفصولين، والمشهور عند المالكية أن الوعد ملزم ويُقضى به إذا دخل الموعود بسبب الوعد في شيء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17566}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17567}\n\nثالثاً، ما يُباح الوفاء به: نذر المباح كالأكل والشرب والنوم، وخلاف الفقهاء في انعقاد نذر المباح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17567} رابعاً، ما يحرم الوفاء به: نذر المعصية باتفاق، لحديث عائشة «من نذر أن يعصيه فلا يعصه»؛ والحلف على فعل محرم أو ترك واجب يُحنث فيه ويُكفَّر ولا يُوفى به؛ والشروط غير المشروعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17567}\n\nمن يصح منه الوفاء: التكليف، أي البلوغ والعقل، لأن الوفاء يجب نتيجة التصرفات التي يباشرها الإنسان باختياره، سواء بإرادتين كالبيع أو بإرادة واحدة كاليمين والنذر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17568} ومن أسباب الوفاء ما يتحقق به: التسليم في العقود، والرد عند انقضاء مدة العقد أو فسخه أو استحقاقه، والقيام بالعمل المطلوب كالأجير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17568}\n\nالتحقق من الوفاء: يتحقق بتسليم المعقود عليه، ومنه في البيع تسليم المبيع والثمن، وبرد المعقود عليه عند انقضاء العقد أو فسخه، وبقيام الأجير بالعمل المطلوب، وبالحوالة إذا استوفت شرائطها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17568}\n\nوفاء دين الغير: يصح بإذن المدين أو بغير إذنه باتفاق، وقيّد المالكية ذلك بالرفق بالمدين، فإن أراد الدائن الإضرار منع من ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17569} وفاء دين الميت وضمانه: يصح إذا ترك الميت ما يُوفى منه؛ وإذا كان مفلساً فجمهور الفقهاء يصححون ضمانه ووفاءه، لحديث أبي قتادة في ضمان دين الميت الذي لم يُخلف وفاءً، وعند أبي حنيفة لا تصح الكفالة بدين المفلس الميت، لكن يصح الوفاء تبرعاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17569}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17570}\n\nأسباب عدم الوفاء: ⁦(أ)⁩ المماطلة، وهي ظلم من الغني القادر، لحديث «مطل الغني ظلم»، ويستحق العقوبة، لحديث «لَيُّ الواجد يحلّ عرضه وعقوبته»، وقد اتفق الفقهاء على وجوب اتخاذ وسائل تحمل المدين الموسر على الوفاء، واختلفوا في بعضها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17570} ⁦(ب)⁩ الإعسار، وإذا ثبت بالبينة خُلّي سبيل المدين ولم يُحبس، لقوله تعالى في سورة البقرة بالإشارة لا بالنص. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17570} ⁦(ج)⁩ الإفلاس، وهو أن يكون الدين أكثر من المال، فيجب على الحاكم عند جمهور الفقهاء تفليسه إذا طلب الغرماء ذلك، وجاز له بيع ماله جبراً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17570}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17571}\n\nالأولوية في الوفاء: ⁦(أ)⁩ حقوق الله، ومنها الزكاة ومصارفها الثمانية، وقد اختلف الفقهاء في الترتيب بينها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17571} ⁦(ب)⁩ الحقوق المتعلقة بالتركة: تقديم تجهيز الميت وتكفينه، ثم أداء الدين، من ديون الله وديون العباد، ثم تنفيذ الوصايا، والباقي للورثة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17571} ⁦(ج)⁩ الصدقة والوصايا: والأفضل أن يتصدق الإنسان بما فاض عن حاجته ومؤونته ومؤونة من يمونه، لحديث «خير الصدقة ما كان عن ظهر غنى»، وأفضل الصدقة على ذي الرحم، ولهذا قال السرخسي إن ذلك فيه صلة الرحم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17571}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17572}\n\nالصدقة على الأقارب أفضل من الأجانب، لأنها صدقة وصلة، لحديث «أفضل الصدقة على ذي الرحم الكاشح». والشافعية يرون الأولى تقديم الأقرب فالأقرب، وأن الأشد عداوة أفضل ليتألف قلبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17572} وفي الوصايا: الشافعية والحنابلة يرون تقديم الأقرب غير الوارث، فإن لم يوجد فقراء غير وارثين فإلى ذي رضاع، ثم صهر، ثم ذي ولاء، ثم ذي جوار، وعند الحنابلة الجيران الأقرب فالأقرب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17572} والحنفية يرون أن من أوصى لأقربائه فيُفهم منه اثنان فصاعداً من كل ذي رحم محرم غير الوالدين والمولودين، ويُعتبر الأقرب فالأقرب، وقال أبو يوسف ومحمد يكون بينهم أثلاثاً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17572} والمالكية يؤثرون المحتاج الأبعد في القرابة لشدة فقره أو كثرة عياله، بالزيادة على غيره لا بالجميع، ما لم يبيّن الموصي خلاف ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17572}"
  en: "Wafa', lexically, is the opposite of betrayal: completion, discharge, and bringing a thing to full measure; 'awfa al-kayl' is to complete the measure. Technically it is keeping to the way of mutual help, keeping covenants and maintaining the forms of affection in private and in public. The scholars explain the verse of sura al-Ma'ida on fulfilling contracts as keeping what the contract requires and acting on its consequences. The jurists use the word for handing over the thing contracted, for judgement and for payment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17564}\n\nRelated words: istifa' (taking one's right in full), isqat (releasing a right without a holder or a claimant), and ibra' (releasing a debt owed to oneself). All lead to the discharge of the obligation; the difference is that wafa' is done by the one who owes and istifa' by the one who is owed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17564}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17565}\n\nThe ruling varies by the act. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17565} First, what must be fulfilled: contracts, once complete with their conditions, such as delivering the goods and paying the price or wage; lawful conditions, on the saying that Muslims are bound by their conditions, while a condition contrary to the book of God is void; and vows of obedience. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17565} Second, what is recommended: good deeds such as bequests and gifts, which are donations that cannot be compelled; a bare promise, not tied to a need or a cause, is recommended to keep, but becomes obligatory when a need requires it, as Ibn 'Abidin reports from Jami' al-Fusulayn; the well-known Maliki view is that a promise is binding and may be enforced once the promisee has entered upon something because of it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17566}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17567} Third, what is permitted: a vow to do a permitted act, such as eating, drinking or sleeping, whose validity the jurists debate. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17567} Fourth, what is forbidden: a vow of disobedience, forbidden by agreement, on the saying of 'A'isha that whoever vows to disobey God must not disobey Him; an oath to do a forbidden act or omit a duty is to be broken with expiation, not kept; and unlawful conditions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17567}\n\nWho may fulfil: the one who is accountable, that is adult and sane, since the duty arises from acts he undertakes by his choice, whether they need two wills, as sale does, or one, as an oath or vow. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17568} How fulfilment is achieved: in contracts by handing over the thing; by returning the thing when the term ends, the contract is dissolved or the thing is shown to be another's; and by doing the work required, as a hired worker does. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17568}\n\nWays of fulfilment: it is achieved by handing over the thing contracted, such as the goods and the price in a sale; by returning the thing when the contract ends or is dissolved; by the worker doing the work required; and by a transfer of debt (hawala) when its conditions are met. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17568}\n\nPaying another's debt: this is valid with or without the debtor's permission by agreement; the Malikis add that it must be done kindly to the debtor, and forbidden if the creditor means to harm him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17569} Paying or guaranteeing a dead man's debt: valid where the dead man left something to pay from; where he was insolvent, the majority of jurists hold that guaranteeing and paying it is valid, citing the report of Abu Qatada, who guaranteed the debt of a dead man who left no means; Abu Hanifa does not allow the guarantee of an insolvent dead man's debt, but a gift of payment is valid. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17569}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17570}\n\nThe causes of non-payment: (a) procrastination, which is injustice by a wealthy debtor, on the saying 'the procrastination of the rich is injustice', and such a debtor deserves punishment, on the saying that his reputation and punishment are lawful for the one who can pay; the jurists agree that means should be used to make a solvent debtor pay, and differ on some of them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17570} (b) Insolvency: if proved by evidence the debtor is released and not imprisoned, on the verse of sura al-Baqara (cited by sura only). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17570} (c) Bankruptcy, when debts exceed assets: the majority hold that the judge must declare him bankrupt when the creditors ask, and may sell his property by compulsion. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17570}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17571}\n\nPriority in fulfilment: (a) God's rights, such as zakat and its eight categories, whose order the jurists dispute. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17571} (b) rights attached to an estate: the burial and shroud first, then debts, whether owed to God or to men, then bequests, and the rest to the heirs. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17571} (c) charity and bequests: the best charity is what exceeds one's need and that of one's dependants, on the saying 'the best charity is from surplus wealth, and begin with those you support'; and the best charity is to kin, as al-Sarakhsi notes for keeping ties of kinship. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17571}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17572}\n\nCharity to kin is better than to strangers, since it is both charity and the keeping of ties, on the saying 'the best charity is to a near kinsman who is hostile'. The Shafi'is hold the better course is to give to the nearest first, and that the most hostile are better to win over. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17572} On bequests, the Shafi'is and Hanbalis prefer the nearest non-heir, then a foster relation, then in-laws, then a client, then a neighbour, the Hanbalis taking neighbours nearest first. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17572} The Hanafis hold that a bequest to one's relatives is understood to go to two or more of each kin whose marriage is forbidden, excluding parents and children, nearest first; Abu Yusuf and Muhammad divide it in thirds. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17572} The Malikis favour the needier and more distant relative, by a larger share but not the whole, unless the testator says otherwise. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17572}"
  es: "Wafa', léxicamente, es lo opuesto a traición: culminación, cumplimiento y llevar algo a su medida completa; 'awfa al-kayl' es completar la medida. Técnicamente, es mantener el camino de la ayuda mutua, cumplir los pactos y mantener las formas de afecto en privado y en público. Los eruditos explican el versículo de la sura al-Ma'ida sobre el cumplimiento de los contratos como el cumplimiento de lo que el contrato requiere y la actuación en sus consecuencias. Los juristas usan la palabra para la entrega de la cosa contratada, para el juicio y para el pago. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17564} Palabras relacionadas: istifa' (tomar un derecho en su totalidad), isqat (liberar un derecho sin poseedor ni reclamante) e ibra' (liberar una deuda que se debe a uno mismo). Todas conducen al cumplimiento de la obligación; la diferencia es que wafa' lo hace quien debe y istifa' quien es a quien se le debe. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17564}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17565} La decisión varía según el acto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17565} Primero, lo que debe cumplirse: contratos, una vez completos con sus condiciones, como entregar los bienes y pagar el precio o salario; condiciones lícitas, sobre el dicho de que los musulmanes están obligados por sus condiciones, mientras que una condición contraria al libro de Dios es nula; y votos de obediencia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17565} Segundo, lo que se recomienda: buenas obras como legados y regalos, que son donaciones que no pueden ser obligadas; Una promesa simple, no ligada a una necesidad o causa, se recomienda cumplir, pero se vuelve obligatoria cuando una necesidad la requiere, como informa Ibn 'Abidin de Jami' al-Fusulayn; la conocida opinión malikí es que una promesa es vinculante y puede hacerse cumplir una vez que el prometido ha entrado en algo debido a ella. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17566}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17567} Tercero, lo que está permitido: un voto de hacer un acto permitido, como comer, beber o dormir, cuya validez debaten los juristas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17567} Cuarto, lo que está prohibido: un voto de desobediencia, prohibido por acuerdo, en el dicho de 'Aisha de que quien jura desobedecer a Dios no debe desobedecerle; Un juramento para hacer un acto prohibido u omitir un deber debe romperse con expiación, no cumplirse; y condiciones ilícitas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17567} Quién puede cumplir: aquel que es responsable, es decir, adulto y cuerdo, puesto que el deber surge de actos que emprende por su elección, ya sea que necesiten dos voluntades, como la venta, o una, como un juramento o voto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17568} Cómo se logra el cumplimiento: en los contratos mediante la entrega de la cosa; mediante la devolución de la cosa cuando termina el plazo, el contrato se disuelve o se demuestra que la cosa es de otro; y mediante la realización del trabajo requerido, como lo hace un trabajador contratado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17568} Formas de cumplimiento: se logra mediante la entrega de la cosa contratada, como los bienes y el precio en una venta; mediante la devolución de la cosa cuando el contrato termina o se disuelve; mediante el trabajador haciendo el trabajo requerido; y mediante una transferencia de deuda (hawala) cuando se cumplen sus condiciones. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17568} Pagar la deuda de otro: esto es válido con o sin el permiso del deudor por acuerdo; los malikíes agregan que debe hacerse amablemente al deudor, y prohibido si el acreedor tiene la intención de dañarlo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17569} Pagar o garantizar la deuda de un hombre muerto: válido cuando el hombre muerto dejó algo para pagar; donde era insolvente, la mayoría de los juristas sostienen que garantizar y pagar es válido, citando el informe de Abu Qatada, quien garantizó la deuda de un hombre muerto que no dejó medios; Abu Hanifa no permite la garantía de la deuda de un hombre muerto insolvente, pero un regalo de pago es válido. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17569}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17570} Las causas de la falta de pago: (a) la dilación, que es una injusticia por parte de un deudor rico, sobre el dicho 'la dilación del rico es una injusticia', y tal deudor merece castigo, sobre el dicho de que su reputación y castigo son lícitos para quien puede pagar; los juristas están de acuerdo en que se deben usar medios para hacer que un deudor solvente pague, y difieren en algunos de ellos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17570} (b) Insolvencia: si se prueba con evidencia, el deudor es liberado y no encarcelado, en el versículo de la sura al-Baqara (citado solo por la sura). {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17570} (c) Quiebra, cuando las deudas superan los activos: la mayoría sostiene que el juez debe declararlo en quiebra cuando los acreedores lo solicitan, y puede vender su propiedad por coacción. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17570}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17571} Prioridad en el cumplimiento: (a) Derechos de Dios, como el zakat y sus ocho categorías, cuyo orden disputan los juristas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17571} (b) derechos asociados a una herencia: primero el entierro y la mortaja, luego las deudas, ya sean contraídas con Dios o con los hombres, luego los legados, y el resto a los herederos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17571} (c) caridad y legados: la mejor caridad es la que excede la necesidad de uno y la de sus dependientes, según el dicho «la mejor caridad es de la riqueza sobrante, y comienza con aquellos a quienes mantienes»; y la mejor caridad es para los parientes, como señala al-Sarakhsi para mantener los lazos de parentesco. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17571}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17572} La caridad hacia los parientes es mejor que hacia los extraños, ya que es tanto caridad como mantenimiento de lazos, según el dicho 'la mejor caridad es hacia un pariente cercano que es hostil'. Los shafi'ís sostienen que el mejor curso es dar primero al más cercano, y que es mejor ganarse a los más hostiles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17572} En cuanto a los legados, los shafi'ís y los hanbalíes prefieren al no heredero más cercano, luego a un pariente adoptivo, luego a los suegros, luego a un cliente, luego a un vecino, los hanbalíes tomando primero a los vecinos más cercanos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17572} Los hanafíes sostienen que un legado a los parientes se entiende que se reparte entre dos o más miembros de cada familia cuyo matrimonio esté prohibido, excluyendo a padres e hijos, dando prioridad a los más cercanos; Abu Yusuf y Muhammad lo dividen en tercios. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17572} Los malikíes favorecen al pariente más necesitado y lejano, otorgándole una mayor parte, pero no la totalidad, a menos que el testador disponga lo contrario. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17572}"
