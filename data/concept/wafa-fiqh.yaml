label:
  ar: "وَفاء"
  en: "Wafa' (fulfilment, fiqh)"
summary:
  ar: "الوفاء في اللغة ضد الغدر، وهو التمام والأداء وبلوغ الشيء تامّاً، وأوفى الكيل أتمّه؛ والوفاء في الاصطلاح ملازمة طريق المواساة ومحافظة العهود وحفظ مراسم المحبة سراً وعلانية. وقد فسّر العلماء قوله تعالى في سورة المائدة بحفظ ما يقتضيه العقد والقيام بموجبه، ويستعمل الفقهاء اللفظ بمعنى تسليم المعقود عليه، أو القضاء، أو الأداء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17564}\n\nالألفاظ ذات الصلة: الاستيفاء (أخذ الحق وافياً)، والإسقاط (إزالة الملك أو الحق لا إلى مالك ولا إلى مستحق)، والإبراء (إسقاط الحق في ذمة الغير)، وكلها تترتب عليها براءة الذمة، والفرق أن الوفاء يكون ممن عليه الحق والاستيفاء ممن له الحق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17564}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17565}\n\nالحكم التكليفي: يتنوع الوفاء بحسب المحل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17565} أولاً، ما يجب الوفاء به: العقود إذا تمت مستوفية لشرائطها كتسليم المبيع والثمن والأجرة، والشروط المشروعة، لحديث «المسلمون على شروطهم»، وما خالف كتاب الله فهو باطل، والنذر الطاعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17565} ثانياً، ما يُستحب الوفاء به: المعروف كالوصية والهبة، لأنها تبرع لا يجبر عليه؛ والوعد المجرد عن حاجة أو سبب مستحب، وإذا دعت الحاجة إليه وجب، كما نقل ابن عابدين عن جامع الفصولين، والمشهور عند المالكية أن الوعد ملزم ويُقضى به إذا دخل الموعود بسبب الوعد في شيء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17566}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17567}\n\nثالثاً، ما يُباح الوفاء به: نذر المباح كالأكل والشرب والنوم، وخلاف الفقهاء في انعقاد نذر المباح. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17567} رابعاً، ما يحرم الوفاء به: نذر المعصية باتفاق، لحديث عائشة «من نذر أن يعصيه فلا يعصه»؛ والحلف على فعل محرم أو ترك واجب يُحنث فيه ويُكفَّر ولا يُوفى به؛ والشروط غير المشروعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17567}\n\nمن يصح منه الوفاء: التكليف، أي البلوغ والعقل، لأن الوفاء يجب نتيجة التصرفات التي يباشرها الإنسان باختياره، سواء بإرادتين كالبيع أو بإرادة واحدة كاليمين والنذر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17568} ومن أسباب الوفاء ما يتحقق به: التسليم في العقود، والرد عند انقضاء مدة العقد أو فسخه أو استحقاقه، والقيام بالعمل المطلوب كالأجير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17568}"
  en: "Wafa', lexically, is the opposite of betrayal: completion, discharge, and bringing a thing to full measure; 'awfa al-kayl' is to complete the measure. Technically it is keeping to the way of mutual help, keeping covenants and maintaining the forms of affection in private and in public. The scholars explain the verse of sura al-Ma'ida on fulfilling contracts as keeping what the contract requires and acting on its consequences. The jurists use the word for handing over the thing contracted, for judgement and for payment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17564}\n\nRelated words: istifa' (taking one's right in full), isqat (releasing a right without a holder or a claimant), and ibra' (releasing a debt owed to oneself). All lead to the discharge of the obligation; the difference is that wafa' is done by the one who owes and istifa' by the one who is owed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17564}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17565}\n\nThe ruling varies by the act. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17565} First, what must be fulfilled: contracts, once complete with their conditions, such as delivering the goods and paying the price or wage; lawful conditions, on the saying that Muslims are bound by their conditions, while a condition contrary to the book of God is void; and vows of obedience. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17565} Second, what is recommended: good deeds such as bequests and gifts, which are donations that cannot be compelled; a bare promise, not tied to a need or a cause, is recommended to keep, but becomes obligatory when a need requires it, as Ibn 'Abidin reports from Jami' al-Fusulayn; the well-known Maliki view is that a promise is binding and may be enforced once the promisee has entered upon something because of it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17566}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17567} Third, what is permitted: a vow to do a permitted act, such as eating, drinking or sleeping, whose validity the jurists debate. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17567} Fourth, what is forbidden: a vow of disobedience, forbidden by agreement, on the saying of 'A'isha that whoever vows to disobey God must not disobey Him; an oath to do a forbidden act or omit a duty is to be broken with expiation, not kept; and unlawful conditions. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17567}\n\nWho may fulfil: the one who is accountable, that is adult and sane, since the duty arises from acts he undertakes by his choice, whether they need two wills, as sale does, or one, as an oath or vow. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17568} How fulfilment is achieved: in contracts by handing over the thing; by returning the thing when the term ends, the contract is dissolved or the thing is shown to be another's; and by doing the work required, as a hired worker does. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17568}"
