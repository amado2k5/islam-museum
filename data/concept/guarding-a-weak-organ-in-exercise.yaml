id: concept/guarding-a-weak-organ-in-exercise
class: concept
kind: scientific
label: { ar: "حماية العضو الضعيف في الرياضة عند ابن سينا", en: "Guarding a weak organ in exercise in the Canon", ur: "قانون میں ورزش کے دوران کمزور عضو کی حفاظت", es: "Proteger un órgano débil durante el ejercicio en el Canon", fr: "Garder un organe faible à l'exercice dans le Canon", tr: "İbn Sina'ya göre sporda zayıf uzuvların korunması", id: "Perlindungan anggota tubuh yang lemah dalam olahraga menurut Ibn Sina" }
summary:
  ar: "ينبه ابن سينا إلى أن المرتاض يحذر وصول حمية الرياضة إلى العضو الضعيف إلا تبعاً، ويضرب مثلاً بمن يعتريه الدوالي فلا يكثر تحريك رجليه بل يحمل رياضته على أعالي بدنه، ويقرر أن رياضة البدن الضعيف ضعيفة والقوي قوية {cite:canon-ibn-sina-print-v1 p.224}."
  en: "Ibn Sina warns the exerciser to keep the heat of exercise from reaching a weak organ except as a by-effect, giving the example of someone with varicose veins who should not move the legs much but carry the exercise to the upper body, and rules that a weak body's exercise is weak and a strong body's strong {cite:canon-ibn-sina-print-v1 p.224}."
  es: "Ibn Sina advierte al que se ejercita que evite que el calor del ejercicio llegue a un órgano débil, excepto como efecto secundario, dando el ejemplo de alguien con venas varicosas que no debe mover mucho las piernas sino llevar el ejercicio a la parte superior del cuerpo, y dictamina que el ejercicio de un cuerpo débil es débil y el de un cuerpo fuerte es fuerte {cite:canon-ibn-sina-print-v1 p.224}."
  fr: "Ibn Sina avertit celui qui fait de l'exercice de veiller à ce que la chaleur de l'exercice n'atteigne pas un organe faible, sauf comme effet secondaire, donnant l'exemple d'une personne souffrant de varices qui ne devrait pas beaucoup bouger les jambes mais concentrer l'exercice sur le haut du corps, et statue que l'exercice d'un corps faible est faible et celui d'un corps fort est fort {cite:canon-ibn-sina-print-v1 p.224}."
  ur: "ابن سینا ورزش کرنے والے کو تنبیہ کرتا ہے کہ ورزش کی گرمی کو کمزور عضو تک پہنچنے سے روکے سوائے ایک ضمنی اثر کے، کسی ایسے شخص کی مثال دیتے ہوئے جو varicose رگوں والے شخص کی ٹانگوں کو زیادہ حرکت نہ کرے بلکہ ورزش کو جسم کے اوپری حصے تک لے جائے، اور یہ قاعدہ ہے کہ کمزور جسم کی ورزش کمزور اور مضبوط جسم کی مضبوط ہے۔"
  tr: "İbn Sina, zihinsel kişinin egzersiz diyetinin zayıf üyeye ancak süreklilik yoluyla ulaşmasına izin vermesi gerektiği konusunda uyarır. Varis damarları olan birinin örneğini verir; bu yüzden bacaklarını çok hareket ettirmemeli, egzersizi vücudunun üst kısımlarında taşımalıdır ve zayıf bedenin egzersizinin zayıf, güçlü olanın güçlü olduğunu belirtir {cite:canon-ibn-sina-print-v1 s.224}."
  id: "Ibn Sina memperingatkan bahwa pertapa tidak boleh membiarkan diet olahraga mencapai anggota tubuh lemah kecuali melalui kontinuitas. Ia memberikan contoh seseorang yang menderita varises, sehingga ia tidak boleh banyak menggerakkan kakinya tetapi melakukan latihan di bagian atas tubuhnya, dan ia menyatakan bahwa latihan tubuh lemah itu lemah dan yang kuat kuat {cite:canon-ibn-sina-print-v1 hlm.224}."
