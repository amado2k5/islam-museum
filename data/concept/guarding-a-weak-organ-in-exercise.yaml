label: { ar: "حماية العضو الضعيف في الرياضة عند ابن سينا", en: "Guarding a weak organ in exercise in the Canon", ur: "قانون میں ورزش کے دوران کمزور عضو کی حفاظت" }
summary:
  ar: "ينبه ابن سينا إلى أن المرتاض يحذر وصول حمية الرياضة إلى العضو الضعيف إلا تبعاً، ويضرب مثلاً بمن يعتريه الدوالي فلا يكثر تحريك رجليه بل يحمل رياضته على أعالي بدنه، ويقرر أن رياضة البدن الضعيف ضعيفة والقوي قوية {cite:canon-ibn-sina-print-v1 p.224}."
  en: "Ibn Sina warns the exerciser to keep the heat of exercise from reaching a weak organ except as a by-effect, giving the example of someone with varicose veins who should not move the legs much but carry the exercise to the upper body, and rules that a weak body's exercise is weak and a strong body's strong {cite:canon-ibn-sina-print-v1 p.224}."
