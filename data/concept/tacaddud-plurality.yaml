label:
  ar: "التعدد"
  en: "Ta'addud (plurality in worship, expiation, marriage, divorce and the rest)"
  ur: "تعدد (کثرت: عبادت، کفارہ، نکاح، طلاق اور دیگر امور میں)"
summary:
  ar: "التعدد الكثرة، ويتعلق بأمور: فتعدد المؤذنين جائز ومستحب، وتعدد الجماعة في المسجد الواحد بعد إمام الحي مكروه عند الحنفية والمالكية والشافعية، وجائز عند الحنابلة. وتعدد الجمعة في البلد لا يجوز عند الجمهور إلا لضرورة، وعند الحنفية جائز. وتعدد كفارة الصوم بتكرار الإفساد مختلف فيه. وتعدد الزوجات إلى أربع مشروع. وتعدد القضاة جائز، ولا يجوز تعدد الأئمة عند الجمهور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5393} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5394} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5395} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5396}"
  en: "Ta'addud is plurality. Its applications: several muezzins are lawful and recommended; repeating the congregation in a mosque after the quarter's imam is disliked by the Hanafis, Malikis and Shafiis, and lawful for the Hanbalis. More than one Friday prayer in a town is forbidden by the majority except by necessity, and lawful for the Hanafis. Repeating the fast's expiation by repeated intercourse is disputed. Marriage up to four is established by the Qur'an. Several judges in a town are lawful, but more than one imam is forbidden by the majority. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5393} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5394} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5395} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5396}"
