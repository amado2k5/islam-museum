id: concept/tasir-price-fixing
class: concept
kind: legal
label:
  ar: "التسعير"
  en: "Tasir (fixing prices in the market by authority)"
  ur: "تسعیر ⁦(حاکم کا بازار میں قیمت مقرر کرنا)⁩"
  es: "Tasir (fijación de precios en el mercado por parte de la autoridad)"
  fr: "Tasir (fixation des prix sur le marché par l'autorité)"
summary:
  ar: "التسعير تقدير السلطان أو نائبه سعرا للناس وإجبارهم على التبايع به. والأصل فيه الحرمة عند الفقهاء الأربعة، ويجوز بشروط عند التعدي الفاحش، وعند حاجة الناس، وعند الاحتكار والتواطؤ، ويختلف الفقهاء في ما يدخله وفي الجالب والمحتكر. وقد يخالف البيع المسعر فيصح عند الجمهور مع العقوبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5072} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5073} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5074} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5077} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5079} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5081}"
  en: "Tasir is the ruler's or his deputy's fixing of a price for people, and compelling them to trade at it. The four schools take its basic rule to be prohibition; it is allowed on conditions: when sellers overcharge grossly, when people need the goods, when goods are hoarded, or when traders collude. The schools differ on what it covers, on the importer and the hoarder, and a sale against a fixed price is valid for most with discipline. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5072} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5073} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5074} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5077} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5079} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5081}"
  es: "El tasir consiste en que el gobernante o su representante fije un precio para el comercio y obligue a la gente a comerciar a ese precio. Las cuatro escuelas consideran que su regla básica es la prohibición; se permite bajo ciertas condiciones: cuando los vendedores cobran precios excesivos, cuando la gente necesita los bienes, cuando se acaparan o cuando los comerciantes se confabulan. Las escuelas difieren en cuanto a su alcance, al importador y al acaparador, y una venta a precio fijo es válida para la mayoría si se aplican las normas. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5072} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5073} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5074} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5077} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5079} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.5081}"
  fr: "Le tasir est la fixation d'un prix par le souverain ou son représentant, obligeant les commerçants à s'y conformer. Les quatre écoles de pensée considèrent que son principe fondamental est l'interdiction; il est toutefois autorisé sous certaines conditions: en cas de surfacturation excessive, de besoin urgent de biens, d'accaparement ou de collusion entre commerçants. Les écoles divergent quant à son champ d'application, notamment concernant l'importateur et l'accapareur, mais une vente à prix fixe est généralement valable sous réserve de discipline. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5072} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5073} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5074} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5077} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5079} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5081}"
