id: concept/tasir-price-fixing
class: concept
kind: legal
label:
  ar: "التسعير"
  en: "Tasir (fixing prices in the market by authority)"
  ur: "تسعیر (حاکم کا بازار میں قیمت مقرر کرنا)"
summary:
  ar: "التسعير تقدير السلطان أو نائبه سعرا للناس وإجبارهم على التبايع به. والأصل فيه الحرمة عند الفقهاء الأربعة، ويجوز بشروط عند التعدي الفاحش، وعند حاجة الناس، وعند الاحتكار والتواطؤ، ويختلف الفقهاء في ما يدخله وفي الجالب والمحتكر. وقد يخالف البيع المسعر فيصح عند الجمهور مع العقوبة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5072} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5073} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5074} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5077} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5079} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5081}"
  en: "Tasir is the ruler's or his deputy's fixing of a price for people, and compelling them to trade at it. The four schools take its basic rule to be prohibition; it is allowed on conditions: when sellers overcharge grossly, when people need the goods, when goods are hoarded, or when traders collude. The schools differ on what it covers, on the importer and the hoarder, and a sale against a fixed price is valid for most with discipline. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5072} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5073} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5074} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5077} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5079} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.5081}"
