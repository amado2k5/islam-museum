id: concept/mawla-al-muwala
class: concept
kind: legal
label: { ar: "مَوْلَى المُوَالاة", en: "The client by contract of alliance (mawla al-muwala)", ur: "مولیٰ الموالاۃ (عہدِ موالات کا مولیٰ)" }
summary:
  ar: "مولى الموالاة هو الشخص المجهول النسب الذي يؤاخي شخصاً معروف النسب ويوالي معه بعقد يذكر فيه الإرث والعقل، ويسمى هذا العقد موالاة. وقد اختلف الفقهاء في ميراثه: فجمهور المالكية والشافعية والحنابلة على أن العقد ليس سبباً للإرث، والحنفية يجعلونه سبباً للإرث بعد مولى العتاقة. ومن أحكامه شروط صحة العقد عند الحنفية، وانتقال الولاء من مولى إلى غيره قبل العقل عنه، وتبعية ولد المرأة لها في الموالاة، وتأخر إرثه عن العصبة ومولى العتاقة وذوي الأرحام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15312} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15313} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15315}"
  en: "The client by contract of alliance is a person of unknown descent who forms a bond of alliance with a person of known descent. The contract states that the one inherits from the other and that the one pays the blood-money of the other. The jurists differ on his inheritance: the majority of Maliki, Shafi'i and Hanbali scholars hold that the contract is not a cause of inheritance, while the Hanafis make it one, ranked after the freed client's patronage. Their rules cover the conditions of the contract, the right to transfer to another ally before the blood-money is paid, the child of a woman who makes the contract, and the order of inheritance after the agnates, the patron and the kin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15312} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15313} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15315}"
  ur: "مولیٰ الموالاۃ وہ شخص ہے جس کا نسب معلوم نہ ہو اور وہ کسی معروف النسب شخص سے عہدِ موالات باندھے، جس میں وراثت اور دیت (عقل) کا ذکر ہو۔ جمہور کے نزدیک یہ وراثت کا سبب نہیں، جبکہ حنفیہ کے نزدیک یہ مولیٰ العتاقہ کے بعد وراثت کا سبب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15312} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15313}"
