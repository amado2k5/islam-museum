label: { ar: "مَوْلَى المُوَالاة", en: "The client by contract of alliance (mawla al-muwala)", ur: "مولیٰ الموالاۃ ⁦(عہدِ موالات کا مولیٰ)⁩", es: "El cliente por contrato de alianza (mawla al-muwala)", fr: "Le client par contrat d'alliance (mawla al-muwala)", tr: "Sadık Sahip", id: "Pemilik Setia" }
summary:
  ar: "مولى الموالاة هو الشخص المجهول النسب الذي يؤاخي شخصاً معروف النسب ويوالي معه بعقد يذكر فيه الإرث والعقل، ويسمى هذا العقد موالاة. وقد اختلف الفقهاء في ميراثه: فجمهور المالكية والشافعية والحنابلة على أن العقد ليس سبباً للإرث، والحنفية يجعلونه سبباً للإرث بعد مولى العتاقة. ومن أحكامه شروط صحة العقد عند الحنفية، وانتقال الولاء من مولى إلى غيره قبل العقل عنه، وتبعية ولد المرأة لها في الموالاة، وتأخر إرثه عن العصبة ومولى العتاقة وذوي الأرحام. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15312} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15313} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15315}"
  en: "The client by contract of alliance is a person of unknown descent who forms a bond of alliance with a person of known descent. The contract states that the one inherits from the other and that the one pays the blood-money of the other. The jurists differ on his inheritance: the majority of Maliki, Shafi'i and Hanbali scholars hold that the contract is not a cause of inheritance, while the Hanafis make it one, ranked after the freed client's patronage. Their rules cover the conditions of the contract, the right to transfer to another ally before the blood-money is paid, the child of a woman who makes the contract, and the order of inheritance after the agnates, the patron and the kin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15312} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15313} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15315}"
  ur: "مولیٰ الموالاۃ وہ شخص ہے جس کا نسب معلوم نہ ہو اور وہ کسی معروف النسب شخص سے عہدِ موالات باندھے، جس میں وراثت اور دیت ⁦(عقل)⁩ کا ذکر ہو۔ جمہور کے نزدیک یہ وراثت کا سبب نہیں، جبکہ حنفیہ کے نزدیک یہ مولیٰ العتاقہ کے بعد وراثت کا سبب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15312} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15313}"
  es: "El cliente por contrato de alianza es una persona de ascendencia desconocida que forma un vínculo de alianza con una persona de ascendencia conocida. El contrato estipula que uno hereda del otro y que uno paga la compensación por la muerte del otro. Los juristas difieren en cuanto a la herencia: la mayoría de los eruditos malikíes, shafi'íes y hanbalíes sostienen que el contrato no constituye una causa de herencia, mientras que los hanafíes sí la consideran como tal, con un rango posterior al del mecenazgo del cliente liberado. Sus normas abarcan las condiciones del contrato, el derecho a transferir la herencia a otro aliado antes del pago de la compensación, el hijo de la mujer que realiza el contrato y el orden de sucesión después de los agnados, el mecenas y los parientes. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15312} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15313} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15315}"
  fr: "Le client par contrat d'alliance est une personne d'origine inconnue qui conclut un pacte d'alliance avec une personne d'origine connue. Le contrat stipule que l'un hérite de l'autre et que l'un verse le prix du sang à l'autre. Les juristes divergent quant à l'héritage: la majorité des écoles malikite, chaféite et hanbalite considèrent que le contrat n'est pas une cause d'héritage, tandis que les hanafites l'intègrent, le plaçant après le patronage du client affranchi. Leurs règles portent sur les conditions du contrat, le droit de céder ses biens à un autre allié avant le paiement du prix du sang, l'enfant de la femme contractante et l'ordre de succession après les agnats, le patron et les parents. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15312} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15313} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15315}"
  tr: "Sadakat mawwalası, soyu bilinmeyen bir kişidir; bilinen bir kişiye kardeş olur ve miras ile akıl sağlığını belirten bir sözleşmeyle ona bağlılık yemini eder; bu sözleşmeye mawlaat denir. Hukukçular miras konusunda farklı görüşlere sahiptir: Malikiler, Şafiiler ve Hanbalilerin çoğu sözleşmenin miras nedeni olmadığını, Hanafiler ise bunu özgür bırakılan mawla'dan sonra miras nedeni olarak kabul eder. Hanefilere göre bir sözleşmenin geçerliliği koşulları arasında yer alır: bir özgür köleden diğerine sadakatin aklından önce devredilmesi, kadının çocuğunun mevlaahda ona bağımlı olması ve mirasının asba, özgür bırakılan mawla ve akrabalardan geciktirilmesi. {alıntı:) fiqh-mawsua-kuwaitiyya-noor-v3 s.15312} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15313} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15315}"
  id: "Mawwala kesetiaan adalah seseorang dengan garis keturunan yang tidak diketahui yang menjadi saudara bagi seseorang yang dikenal dan bersumpah setia kepadanya melalui kontrak yang menyebutkan warisan dan kewarasan, dan kontrak ini disebut mawlaat. Para ahli hukum berbeda pendapat mengenai warisan: mayoritas Maliki, Shafi'i, dan Hanbalis berpendapat bahwa kontrak tersebut bukan alasan untuk warisan, sementara Hanafi menganggapnya sebagai alasan warisan setelah mawla yang dibebaskan. Di antara keputusannya adalah syarat keabsahan kontrak menurut Hanafi: pemindahan kesetiaan dari satu budak yang dibebaskan ke budak lain sebelum pikiran berasal darinya, anak wanita bergantung padanya dalam mawlaah, dan warisannya tertunda dari asba, mawla yang dibebaskan, dan kerabatnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15312} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15313} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15315}"
