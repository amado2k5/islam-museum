label: { ar: "طاسات الشفاء وباطل السحر (چهل كليد)", en: "Magic-medicinal bowls (chihil kilid, batil al-sihr)", ur: "شفا اور ابطالِ سحر کے پیالے (چہل کلید)" }
summary:
  ar: "أوانٍ معدنية منقوشة بالآيات والأدعية والأبراج، عُرفت في القرون الإسلامية المتأخرة باسم «طاس چهل كليد» و«باطل السحر»، كان الناس يشربون منها أو يصبون ماءها رجاء الشفاء ودفع الأذى، بحسب دراسة جودكي عزيزي {cite:joudaki-azizi-batil-al-sihr-bowl p. 3} {cite:joudaki-azizi-batil-al-sihr-bowl p. 4}."
  en: "Metal bowls inscribed with Qur'anic verses, prayers and zodiac signs, known in later Islamic centuries as tas-i chihil kilid ('bowl of forty keys') and batil al-sihr ('annuller of magic'), from which people drank or poured water hoping for healing and protection, according to Joudaki Azizi's study {cite:joudaki-azizi-batil-al-sihr-bowl p. 3} {cite:joudaki-azizi-batil-al-sihr-bowl p. 4}."
  ur: "دھات کے پیالے جن پر آیات، دعائیں اور بروج کندہ ہوتے، اور جو بعد کی اسلامی صدیوں میں «طاسِ چہل کلید» اور «باطل السحر» کہلاتے؛ جودکی عزیزی کی تحقیق کے مطابق لوگ شفا اور حفاظت کی امید میں ان سے پیتے یا ان کا پانی بہاتے {cite:joudaki-azizi-batil-al-sihr-bowl p. 3} {cite:joudaki-azizi-batil-al-sihr-bowl p. 4}۔"
