id: concept/quruh-al-litha-wa-taakkuluha
class: concept
kind: scientific
label:
  ar: قروح اللثة وتأكلها ونواصيرها
  en: The gum's ulcers, corrosion and fistulas
  ur: مسوڑھے کے قروح، کتراؤ اور ناسور
  es: "Las úlceras, la corrosión y las fístulas de las encías."
  fr: "ulcères, corrosion et fistules des gencives"
  tr: "Diş eti ülserleri, yiyecekleri ve yumrukları"
  id: "Tukak gusi, makanan mereka, dan tinju mereka"
summary:
  ar: قروح اللثة بعضها ساذجة وبعضها مبتدئة في التعفن وبعضها آخذة في التأكل، فأما الساذجة فعلاجها علاج القلاع وأما الآخذة في التعفن فتعالج بما وصف من هذا الجنس فإن نفع وإلا جمع ما وصف بدهن الورد واستعمل ومن أصناف المضمضات النافعة المضمضة بخل العنصل والمضمضة بألبان الأتن ⁦(حيواني الجنس محمول كما سماه الكتاب)⁩ والمضمضة بسلاقات من هذا الجنس {cite:canon-ibn-sina-print-v2 p.281}
  en: Of the gum's ulcers some are simple, some beginning to putrefy, some taking to corrode. The simple are treated as thrush is; the putrefying are treated by what he described of this kind, else what he described joined with rose oil is used; among the beneficial mouthwashes are the squill-vinegar rinse, the she-asses'-milk rinse (an animal item carried as the book names it) and decoction-rinses of this kind {cite:canon-ibn-sina-print-v2 p.281}
  ur: مسوڑھے کے قروح بعض سادہ ہوتے ہیں، بعض سڑنے پر، بعض کاٹنے پر؛ سادہ قروح کا علاج قلاع کا علاج ہے؛ سڑنے والے اسی جنس کی بیان کردہ چیزوں سے علاج ہوتے ہیں اور اگر نہ کارگر ہوں تو بیان کردہ چیز گلاب کے تیل سے ملا کر استعمال ہوتی ہے؛ سودمند کلانوں میں عنصل کا سرکہ، مادہ گدھوں کا دودھ ⁦(حیوانی جنس، کتاب کے نام پر محمول)⁩ اور اسی جنس کے جوشاندوں کے کلانے ہیں {cite:canon-ibn-sina-print-v2 p.281}
  es: "De las úlceras de las encías, algunas son simples, otras comienzan a pudrirse y otras se corroen. Las simples se tratan como la candidiasis oral; las que se pudren se tratan con lo que describió de este tipo, o bien se usa lo que describió mezclado con aceite de rosa; entre los enjuagues bucales beneficiosos se encuentran el enjuague de vinagre de escila, el enjuague de leche de asna (un producto animal que se lleva como lo llama el libro) y los enjuagues de decocción de este tipo {cite:canon-ibn-sina-print-v2 p.281}"
  fr: "Parmi les ulcères gingivaux, certains sont simples, d'autres commencent à se putréfier, d'autres encore se corrodent. Les simples sont traités comme le muguet; les putréfiants sont traités par les remèdes qu'il a décrits à ce sujet, ou bien on utilise ceux qu'il a décrits, mélangés à de l'huile de rose; parmi les bains de bouche bénéfiques figurent le bain de bouche à la scille et au vinaigre, le bain de bouche au lait d'ânesse (un produit d'origine animale, comme l'indique le livre) et les décoctions de ce type {cite:canon-ibn-sina-print-v2 p.281}"
  tr: "Bazı diş eti ülserleri naiftir, bazıları çürümeye başlar ve bazıları aşınmaya başlar. Saf olanlar ise pamukçuk tedavisidir ve çürümeye başlayanlar ise yardımcı olursa bu tip tarif edilen türle tedavi edilir; aksi takdirde, ansal sirke ile durulama, eşek sütü ile durulama (bu cinsin hayvanları kitapta olduğu gibi tanımlanır) ve bu cinsin pistleriyle durulama {cite:canon-ibn-sina-print-v2 s.281}"
  id: "Beberapa luka gusi masih naif, beberapa mulai membusuk, dan beberapa mulai terkikis. Adapun yang naif, pengobatannya adalah pengobatan sariwan, dan yang mulai membusuk diobati dengan jenis yang dijelaskan, jika itu membantu; jika tidak, gabungkan dengan minyak mawar dan gunakan jenis bilasan yang berguna: membilas dengan cuka ansal, membilas dengan susu keledai (hewan dari genus ini disebut seperti yang disebut buku), dan membilas dengan rink dari genus ini {cite:canon-ibn-sina-print-v2 hlm.281}"
