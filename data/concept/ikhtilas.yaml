label:
  ar: اختلاس
  en: Ikhtilas (taking by snatching, not subject to amputation)
summary:
  ar: الاختلاس أخذ الشيء بحضرة صاحبه جهراً مع الهرب به، وهو لا قطع فيه بالاتفاق لأنه يمكن استرداده بالاستغاثة بالناس والسلطان؛ ويفصل أحكامه في السرقة والغصب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1937} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1938}.
  en: Ikhtilas is taking a thing in the owner's presence openly and running off with it; by agreement there is no amputation for it, since the thing can be recovered by calling for help from people and the authority; its rules are treated under theft and usurpation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1937} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1938}.
