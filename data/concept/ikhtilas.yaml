id: concept/ikhtilas
class: concept
kind: legal
label:
  ar: اختلاس
  en: Ikhtilas (taking by snatching, not subject to amputation)
  es: "Ikhtilas (toma por arrebato, no sujeta a amputación)"
  fr: "Ikhtilas (prise par arrachage, sans amputation)"
  ur: "اخلاص ⁦(چھین کر لینا، کٹوتی کے تابع نہیں)⁩"
summary:
  ar: الاختلاس أخذ الشيء بحضرة صاحبه جهراً مع الهرب به، وهو لا قطع فيه بالاتفاق لأنه يمكن استرداده بالاستغاثة بالناس والسلطان؛ ويفصل أحكامه في السرقة والغصب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1937} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1938}.
  en: Ikhtilas is taking a thing in the owner's presence openly and running off with it; by agreement there is no amputation for it, since the thing can be recovered by calling for help from people and the authority; its rules are treated under theft and usurpation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1937} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1938}.
  es: "Ikhtilas es tomar algo abiertamente en presencia del dueño y huir con ello; por acuerdo, no hay amputación, ya que el objeto puede recuperarse pidiendo ayuda a la gente y a la autoridad; sus reglas se tratan como robo y usurpación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1937} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1938}."
  fr: "L'ikhtilas consiste à s'emparer d'un bien en présence de son propriétaire, ouvertement, et à s'enfuir avec; par convention, le bien n'est pas amputé, car il peut être récupéré en faisant appel à la population et aux autorités; ses règles relèvent du vol et de l'usurpation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1937} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1938}."
  ur: "اخلاص مالک کے سامنے کھلے عام کسی چیز کو لے کر بھاگ رہا ہے۔ معاہدے کے مطابق اس کے لیے کوئی کٹوتی نہیں ہے، کیونکہ لوگوں اور اتھارٹی سے مدد طلب کرکے چیز کو بازیافت کیا جا سکتا ہے۔ اس کے قواعد چوری اور غاصبانہ کے تحت علاج کیے جاتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1937} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1938}۔"
