label:
  ar: "فاوانيا"
  en: "Fawaniya (the peony)"
  ur: "فاوانیا"
  es: "Fawaniya (la peonía)"
  fr: "Fawaniya (la pivoine)"
  tr: "Şakayık"
  id: "Peony"
summary:
  ar: "فاوانيا في الكتاب هو عود الصليب، منه ذكر وأنثى، حار ليس بشديد، فيه تجفيف وقبض مع تحليل وتفتيح وتلطيف وجلاء، وذكر الكتاب نفعه في النقرس والصرع والكابوس واليرقان وسدد الكبد والكلى والمثانة وعلاقته بالرحم والنفاس {cite:canon-ibn-sina-print-v1 632}"
  en: "Fawaniya is in the book ud al-salib, of which there is a male and a female; hot but not intensely, with drying and astringency together with dissolving, opening, attenuating and cleansing; the book records its benefit in gout, epilepsy, nightmare, jaundice, obstructions of the liver and the kidneys and bladder, and its relation to the womb and childbed {cite:canon-ibn-sina-print-v1 632}"
  ur: "فاوانیا کتاب میں عود الصلیب ہے، اس کا نر اور مادہ ہے؛ گرم مگر شدید نہیں، خشکی اور قبض کے ساتھ تحلیل، کھولنے، لطافت اور جلاء کی قوت؛ کتاب نقرس، صرع، کابوس، یرقان، جگر اور گردے اور مثانے کی رکاوٹوں میں اس کا فائدہ اور رحم اور نفاس سے اس کا تعلق بتاتی ہے {cite:canon-ibn-sina-print-v1 632}۔"
  es: "Fawaniya se encuentra en el libro ud al-salib, del cual hay una versión masculina y otra femenina; caliente pero no intensamente, con propiedades secantes y astringentes junto con propiedades disolventes, abredoras, atenuantes y purificadoras; el libro registra sus beneficios en casos de gota, epilepsia, pesadillas, ictericia, obstrucciones del hígado, los riñones y la vejiga, y su relación con el útero y el parto {cite:canon-ibn-sina-print-v1 632}"
  fr: "La fawaniya est mentionnée dans le livre d'Ud al-Salib, qui décrit une plante médicinale masculine et féminine. Elle est chaude, mais non intense, et possède des propriétés asséchantes et astringentes, dissolvantes, ouvrantes, atténuantes et purifiantes. Le livre mentionne ses bienfaits contre la goutte, l'épilepsie, les cauchemars, la jaunisse, les obstructions du foie, des reins et de la vessie, ainsi que son rôle dans la grossesse et l'accouchement. {cite:canon-ibn-sina-print-v1 632}"
  tr: "Kitapta 'Peonyania', hem erkek hem kadın organlarından oluşan, sıcak ama yoğun olmayan, kuruyan ve kasılarak çözünen, hafifletici, yatıştırıcı ve temizleyici bir çapraz çubuktur. Kitap, gut, epilepsi, kabuslar, sarılık, karaciğer, böbrek ve mesane tıkanması ile rahim ve doğum sonrası kanama ile ilişkisi gibi faydalarından bahseder {cite:canon-ibn-sina-print-v1 632}"
  id: "Dalam buku ini, 'Peonyania' adalah tongkat silang, dengan bagian laki-laki dan perempuan, panas namun tidak intens, dengan pengeringan dan kontraksi saat larut, menenangkan, menenangkan, dan membersihkan. Buku ini menyebutkan manfaatnya untuk asam urat, epilepsi, mimpi buruk, penyakit kuning, penyumbatan hati, ginjal, dan kandung kemih, serta hubungannya dengan rahim dan pendarahan pasca persalinan {cite:canon-ibn-sina-print-v1 632}"
