label:
  ar: "قَيْح"
  en: "Pus (qayh)"
  ur: "پیپ (قیح)"
summary:
  ar: "القيح في اللغة المدة الخالصة التي لا يخالطها دم، والصديد ماء الجرح الرقيق المختلط بالدم قبل أن تغلظ المدة. والقيح نجس عند الفقهاء إذا خرج من البدن. واختلفوا في نقض الوضوء به: فالمالكية والشافعية لا ينقضونه، والحنفية ينقضونه إذا خرج إلى موضع يلحقه حكم التطهير، وزفر ينقضه سال أو لم يسل، والحنابلة ينقضون الكثير منه دون اليسير. ولا تصح الصلاة مع القيح الكثير على البدن أو الثوب، ويُعفى عن اليسير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13144} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13145} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13146}"
  en: "In the lexicon qayh is pure matter that has no blood mixed in; sadid is thin wound fluid mixed with blood before the matter thickens. The jurists hold pus impure once it leaves the body. They differ on whether it breaks ablution: the Malikis and Shafi'is say no, the Hanafis say yes once it reaches a place that falls under purification, Zufar says yes whether or not it flows, and the Hanbalis say only a large amount breaks it. A prayer is not valid with a large amount of pus on the body or clothes, but a small amount is excused. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13144} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13145} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13146}"
  ur: "لغت میں قیح خالص پیپ ہے جس میں خون شامل نہ ہو، اور صدید زخم کا پتلا پانی ہے جو پیپ گاڑھی ہونے سے پہلے خون سے ملا ہوتا ہے۔ فقہاء کے نزدیک بدن سے نکلنے پر قیح نجس ہے۔ وضو ٹوٹنے میں اختلاف ہے: مالکیہ اور شافعیہ کے نزدیک نہیں ٹوٹتا، حنفیہ کے نزدیک طہارت کے حکم میں آنے والی جگہ تک پہنچے تو ٹوٹتا ہے، زفر کے نزدیک بہے یا نہ بہے ٹوٹتا ہے، اور حنابلہ کے نزدیک صرف زیادہ مقدار ٹوٹاتی ہے۔ بدن یا کپڑے پر زیادہ قیح ہو تو نماز درست نہیں، کم معاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13144} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13145} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13146}"
