label:
  ar: "أشهر ما قيل في الرثاء والنعي"
  en: "The most famous words of elegy and death announcement"
  ur: "مرثیے اور وفات کی خبر کے مشہور اقوال"
  fr: "Les paroles les plus célèbres de l'élégie et de l'annonce du décès"
  es: "Las palabras más célebres de la elegía y del anuncio de fallecimiento"
  tr: "Ağıt ve ölüm ilanı hakkında söylenen en ünlü şeyler"
  id: "Hal-hal paling terkenal tentang elegi dan obituari"
summary:
  ar: "جمع لما قيل عند الموت في القرآن والسنة والسيرة وأخبار الصحابة والتابعين والكتب: الاسترجاع عند المصيبة، وقول النبي «إن لله ما أخذ وله ما أعطى»، ونعي النبي لجعفر وزيد وابن رواحة وللنجاشي، ورثاء حسان وكعب بن مالك للنبي ولشهداء مؤتة وأحد، وتعزية الصحابة بعضهم بعضا، وحدود البكاء والنياحة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8622}"
  en: "A gathering of what was said at a death in the Qur'an, the Sunnah, the seerah, the reports of the Companions and the Successors, and the books: the istirja' at a loss, the Prophet's words «to God belongs what He took and what He gave», his announcement of Ja'far, Zayd, Ibn Rawaha and the Negus, the elegies of Hassan and Ka'b ibn Malik for the Prophet and the martyrs of Mu'ta and Uhud, the Companions' condolences to one another, and the limits of weeping and wailing. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8622}"
  ur: "قرآن، سنت، سیرت، صحابہ و تابعین کے آثار اور کتابوں میں موت کے وقت کہے گئے اقوال کا مجموعہ: مصیبت پر استرجاع، نبی کا قول «جو اللہ نے لیا اور جو دیا وہ اسی کا ہے»، جعفر، زید، ابن رواحہ اور نجاشی کی وفات کی خبر، حسان اور کعب بن مالک کے مرثیے، صحابہ کی باہمی تعزیت اور رونے و نوحے کی حدود۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8622}"
  fr: "Un recueil de ce qui fut dit à la mort d'un proche dans le Coran, la Sunna, la sîra, les récits des Compagnons et des Successeurs et les livres : l'istirja' devant la perte, la parole du Prophète « à Dieu appartient ce qu'Il a pris et ce qu'Il a donné », l'annonce de la mort de Ja'far, Zayd, Ibn Rawaha et du Négus, les élégies de Hassan et de Ka'b ibn Malik, les condoléances des Compagnons et les limites des pleurs et des lamentations. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8622}"
  es: "Una colección de lo que se dijo ante la muerte en el Corán, la Sunna, la sira, los relatos de los Compañeros y los Sucesores y los libros: el istirŷa' ante la pérdida, las palabras del Profeta «a Dios pertenece lo que tomó y lo que dio», el anuncio de la muerte de Ŷa'far, Zayd, Ibn Rawaha y el Negus, las elegías de Hassan y de Ka'b ibn Malik, las condolencias entre los Compañeros y los límites del llanto y del lamento. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8622}"
  tr: "Ölüm anında Kur'an, Sünnet, biyografi, Sahabeler, Takipçiler ve kitaplarda söylenenler: felaket anında intikam aramak, Peygamber'in \"Gerçekten Allah'a ait olan her şey ona aittir, verdiği O'dur,\" Peygamber'in Cefer, Zeyd, İbn Rawaha ve Negus için ölüm ilanı, Hasan ve Ka'b bin Malik'in Peygamber ve Mu'tah ile Uhud şehitleri için yazdığı övgüler, sahabelerin birbirine taziyeleri ve ağlama ile ağıt sınırları yer alır. {Kaynak:Fiqh-Mawsua-Kuwaitiyya-Noor-v3 s.8622}"
  id: "Mengumpulkan apa yang dikatakan pada saat kematian dalam Al-Qur'an, Sunnah, biografi, laporan para Sahabat, Para Pengikut, dan kitab: mencari pembalasan di masa malapetaka, Nabi berkata, \"Sesungguhnya, kepada Allah apa yang Dia ambil, dan milik-Nya apa yang diberikan,\" obituari Nabi untuk Ja'far, Zayd, Ibn Rawaha, dan Negus, pujian Hassan dan Ka'b ibn Malik untuk Nabi dan para syahid Mu'tah dan Uhud, belasungkawa para sahabat satu sama lain, serta batas tangisan dan ratapan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8622}"
