id: concept/zij-sabi-equinox-observations-trusted-over-solstice
class: concept
kind: scientific
label: { ar: "لماذا تُقدَّم أرصاد الاعتدال على أرصاد الانقلاب", en: "Why equinox observations are preferred to solstice observations", ur: "اعتدال کی رصد کو انقلاب کی رصد پر ترجیح کیوں", es: "¿Por qué se prefieren las observaciones de los equinoccios a las de los solsticios?", fr: "Pourquoi les observations des équinoxes sont-elles préférées aux observations des solstices ?" }
summary:
  ar: "يذكر البتاني أن الأولين أخذوا أكثر ذلك من الأرصاد الصيفية على نقطة الانقلاب الصيفي، وأنها ليست في الدقة مثل أرصاد إحدى نقطتي الاعتدالين، ولا سيما الاعتدال الخريفي لصفاء الجو، وعلة ذلك أن الشمس عند الانقلاب بطيئة الحركة في الميل وعند الاعتدالين سريعة جداً {cite:zij-sabi-nallino-byblion pp.65-66}."
  en: "Al-Battani says the ancients took most of this from summer observations at the summer solstice point, and that these are not as exact as observations at one of the two equinox points, especially the autumn equinox, for the clarity of the air then; the reason is that at the solstice the Sun is slow in its declination and at the equinoxes very quick {cite:zij-sabi-nallino-byblion pp.65-66}."
  ur: "البتانی کہتے ہیں کہ پہلوں نے اکثر یہ باتیں گرمیوں کی رصدوں سے لیں جو انقلابِ صیفی کے نقطے پر ہوتی ہیں، اور یہ اعتدالین میں سے کسی ایک نقطے کی رصدوں جتنی درست نہیں، خصوصاً خریفی اعتدال کی، کیونکہ اس وقت ہوا صاف ہوتی ہے؛ وجہ یہ ہے کہ انقلاب کے وقت سورج میل میں سست رفتار ہوتا ہے اور اعتدالین پر بہت تیز {cite:zij-sabi-nallino-byblion pp.65-66}۔"
  es: "Al-Battani dice que los antiguos tomaron la mayor parte de esto de observaciones de verano en el punto del solsticio de verano, y que estas no son tan exactas como las observaciones en uno de los dos puntos equinocciales, especialmente el equinoccio de otoño, debido a la claridad del aire en ese momento; la razón es que en el solsticio el Sol es lento en su declinación y en los equinoccios muy rápido {cite:zij-sabi-nallino-byblion pp.65-66}."
  fr: "Al-Battani dit que les anciens ont tiré la plupart de ces observations d'été au point du solstice d'été, et que celles-ci ne sont pas aussi exactes que les observations à l'un des deux points d'équinoxe, en particulier l'équinoxe d'automne, en raison de la clarté de l'air à ce moment-là; la raison est qu'au solstice, le Soleil décline lentement et aux équinoxes très rapidement {cite:zij-sabi-nallino-byblion pp.65-66}."
