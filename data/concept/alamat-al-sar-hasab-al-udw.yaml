id: "concept/alamat-al-sar-hasab-al-udw"
class: "concept"
kind: "scientific"
label:
  ar: "علامات الصرع بحسب العضو المبدئ"
  en: "Signs of epilepsy by the source organ"
  fr: "Signes de l’épilepsie selon l’organe d’origine"
  ur: "ماخذ عضو کے لحاظ سے صرع کی علامات"
  es: "Signos de epilepsia según el órgano de origen"
summary:
  ar: "علامات الصرع بحسب عضو مبدئه: من المعدة اختلاج فم المعدة ورعدة وخفقان وصداع وخفة باستعمال القيء؛ ومن المراق جشاء حامض وقراقر موجعة ووجع بين الكتفين؛ ومن الطحال وجع جانبه؛ ومن الديدان سيلان اللعاب {cite:canon-ibn-sina-print-v2 p.124} {cite:canon-ibn-sina-print-v2 p.125}"
  en: "The signs of epilepsy by its source organ: from the stomach — twitching of the stomach's mouth, trembling, palpitation, severe headache, relief by vomiting; from the hypochondrium — sour belching, painful borborygmi, pain between the shoulders; from the spleen — pain on its side; from worms — running saliva {cite:canon-ibn-sina-print-v2 p.124} {cite:canon-ibn-sina-print-v2 p.125}"
  fr: "Les signes de l’épilepsie selon son organe d’origine : pour l’estomac, secousses au cardia, tremblements, palpitations, violent mal de tête et soulagement après vomissement ; pour l’hypocondre, éructations acides, borborygmes douloureux et douleur entre les épaules ; pour la rate, douleur de son côté ; pour les vers, écoulement de salive {cite:canon-ibn-sina-print-v2 p.124} {cite:canon-ibn-sina-print-v2 p.125}."
  ur: "ماخذ عضو کے لحاظ سے صرع کی علامات: معدے سے — فم المعدہ کا اختلاج، رعدہ، خفقان، سخت سر درد اور قے سے خفا؛ مراق سے — حامض ڈکار، تکلیف دہ قراقر اور دونوں کندھوں کے درمیان درد؛ طحال سے — اس کے پہلو میں درد؛ کیڑوں سے — رال کا بہنا {cite:canon-ibn-sina-print-v2 p.124} {cite:canon-ibn-sina-print-v2 p.125}۔"
  es: "Signos de epilepsia según su órgano de origen: del estómago: espasmos en la boca del estómago, temblores, palpitaciones, dolor de cabeza intenso, alivio con el vómito; del hipocondrio: eructos ácidos, borborigmos dolorosos, dolor entre los hombros; del bazo: dolor en el costado; de lombrices: salivación excesiva. {cite:canon-ibn-sina-print-v2 p.124} {cite:canon-ibn-sina-print-v2 p.125}"
