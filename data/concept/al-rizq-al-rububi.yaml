id: concept/al-rizq-al-rububi
class: concept
kind: doctrine
label: { ar: "الرزق عطاء الربوبية والإمامة عطاء الألوهية", en: "Provision as Lordship's gift and the imamate as the gift of divinity" }
summary:
  ar: "يفرّق الشعراوي بين عطاءين: الرزق عطاء ربوبية يناله المؤمن والكافر لأن الله استدعى الخلق إلى الحياة وكفل رزقهم، والإمامة وقيم المنهج عطاء ألوهية لا ينالها إلا المؤمن. ويرى أن دعاء إبراهيم للبلد بالأمن والرزق قُصد به دوام النعمة، وأن التمتع في الدنيا قليل مهما تعدد. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.581}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.582}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.583}"
  en: "Sha'rawi separates two gifts: provision is a gift of Lordship that believer and disbeliever both receive, because God called all creatures into life and secured their sustenance, while the imamate and the values of the way are a gift of divinity that only the believer receives. He reads Abraham's prayer for the land's safety and provision as a request that the blessing last, and holds that the enjoyment of this world is small however varied {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.581}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.582}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.583}."
wings: [ideas]
themes: [creed, worship-and-the-pillars]
periods: [period/prophetic-era]
regions: [arabia]
issue:
  ar: "هل يعطي الله الرزق لكل خلقه، ويقتصر عطاء الإمامة على المؤمنين؟"
  en: "Does God give provision to all His creatures, while the gift of leadership goes only to believers?"
perspectives:
  - tradition: sunni
    id: sunni-sharawi-two-gifts
    stance:
      ar: "الرزق عام لكل من استدعاه الله للحياة، والإمامة في الدين خاصة بالمؤمنين"
      en: "Provision is general to all whom God called to life; leadership in religion is for believers alone"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقرر الشعراوي أن إبراهيم لما سأل الرزق للمؤمنين وحدهم، ردّه الله ليعلم أن عطاء الربوبية يعم، وعطاء الألوهية يخص. ويستدل بالشمس والهواء اللذين لا يخصّان مؤمناً دون كافر، ويقول إن الكافر يتمتع متعة قليلة ثم يُضطر إلى العذاب. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.582}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.583}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.584}"
      en: "Sha'rawi holds that when Abraham asked provision for believers only, God corrected him so that he would know that Lordship's gift is general and divinity's gift is particular. He cites the sun and the air, which are given to believer and disbeliever alike, and says the disbeliever enjoys a little for a time and is then driven to the Fire {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.582}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.583}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.584}."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
  - tradition: sunni
    id: sunni-scope-note
    stance:
      ar: "أقوال المفسرين في دعاء إبراهيم بالأمن والرزق دون مصدر في هذه الدفعة"
      en: "The exegetes' readings of Abraham's prayer for safety and provision are not yet entered from a source"
    holders: []
    summary:
      ar: "لم تُدخل بعد أقوال المفسرين في تفسير الرزق للكافرين وحدود التمتع، ولا الرأي الأكاديمي أو الآراء الأخرى. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.583}"
      en: "The exegetes' accounts of provision for disbelievers and the limits of enjoyment, the academic view and other views are not yet entered."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
