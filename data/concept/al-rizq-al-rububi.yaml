id: concept/al-rizq-al-rububi
class: concept
kind: doctrine
label: { ar: "الرزق عطاء الربوبية والإمامة عطاء الألوهية", en: "Provision as Lordship's gift and the imamate as the gift of divinity", fr: "La subsistance, don de la Seigneurie, et l’imamat, don de la divinité", es: "La provisión como don del Señorío y el imamato como don de la divinidad.", ur: "رزق خداوندی کا تحفہ اور امامت بطور تحفہ الوہیت" }
summary:
  ar: "يفرّق الشعراوي بين عطاءين: الرزق عطاء ربوبية يناله المؤمن والكافر لأن الله استدعى الخلق إلى الحياة وكفل رزقهم، والإمامة وقيم المنهج عطاء ألوهية لا ينالها إلا المؤمن. ويرى أن دعاء إبراهيم للبلد بالأمن والرزق قُصد به دوام النعمة، وأن التمتع في الدنيا قليل مهما تعدد. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.581}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.582}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.583}"
  en: "Sha'rawi separates two gifts: provision is a gift of Lordship that believer and disbeliever both receive, because God called all creatures into life and secured their sustenance, while the imamate and the values of the way are a gift of divinity that only the believer receives. He reads Abraham's prayer for the land's safety and provision as a request that the blessing last, and holds that the enjoyment of this world is small however varied {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.581}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.582}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.583}."
  fr: "Sha’rawi distingue deux dons : la subsistance est un don de la Seigneurie que reçoivent à la fois le croyant et l’incroyant, parce que Dieu a appelé toutes les créatures à la vie et a garanti leur subsistance, tandis que l’imamat et les valeurs de la voie sont un don de la divinité que seul le croyant reçoit. Il lit la prière d’Abraham pour la sécurité et la subsistance de la contrée comme une demande que le bienfait dure, et tient que la jouissance de ce monde est infime, si variée soit-elle {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.581}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.582}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.583}."
  es: "Sha'rawi distingue dos dones: la provisión es un don de Señorío que reciben tanto creyentes como incrédulos, porque Dios creó a todas las criaturas y aseguró su sustento, mientras que el imamato y los valores del camino son un don de divinidad que solo recibe el creyente. Interpreta la oración de Abraham por la seguridad y la provisión de la tierra como una petición de que la bendición perdure, y sostiene que el disfrute de este mundo es pequeño, por muy variado que sea {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.581}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.582}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.583}."
  ur: "شعراوی دو تحفوں کو الگ کرتا ہے: رزق رب کا تحفہ ہے جو مومن اور کافر دونوں کو ملتا ہے، کیونکہ خدا نے تمام مخلوقات کو زندگی میں بلایا اور ان کا رزق محفوظ کیا، جب کہ امامت اور راہ کی اقدار الوہیت کا تحفہ ہے جو صرف مومن کو ملتا ہے۔ اس نے زمین کی حفاظت اور رزق کے لیے ابراہیم کی دعا کو اس درخواست کے طور پر پڑھا کہ برکت باقی رہے، اور اس کا خیال ہے کہ اس دنیا کا مزہ بہت کم ہے لیکن مختلف ہے صفحہ 582}{حوالہ:تفسیر-شراوی-خواطر-سکین-pp-501-1000 p.583}۔"
