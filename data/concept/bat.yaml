summary:
  ar: "الخفاش عند الدميري طائر الليل الذي لا ريش له يولد ولا يبيض، وسماه بعضهم الوطواط، وذكره أهل الحيوان فيما يقع بين الطير والدواب."
  en: "The bat in al-Damiri: the night-flyer with no feathers, that bears live young and does not lay eggs — some call it the watwat — placed by the animal writers among what falls between bird and beast."
  ur: "دمیری میں چمگادڑ: بغیر پروں کی رات کی اڑنے والی مخلوق جو بچے جیتی ہے اور انڈے نہیں دیتی — بعض اسے وطواط کہتے ہیں — حیوان نگاروں نے اسے پرندے اور جانور کے درمیان رکھا۔"
  es: "El murciélago en al-Damiri: el ave nocturna sin plumas, que da a luz crías vivas y no pone huevos —algunos lo llaman watwat—, situado por los escritores sobre animales entre lo que cae a medio camino entre ave y bestia."
  fr: "La chauve-souris chez al-Damiri: cet oiseau nocturne sans plumes, qui donne naissance à des petits vivants et ne pond pas d'œufs — certains l'appellent le watwat — placé par les auteurs animaliers parmi ce qui se situe entre l'oiseau et la bête."
  tr: "Al-Damiri'ye göre, yarasa tüyleri olmayan, doğan ve yumurtlamayan, gece aktif bir kuştur. Bazıları ona yarasa der, hayvanseverler ise kuşlar ile hayvanlar arasında yaşananlar bağlamında bunu anar."
  id: "Menurut Al-Damiri, kelelawar adalah burung nokturnal yang tidak memiliki bulu, lahir dan tidak bertelur. Beberapa menyebutnya kelelawar, dan para pecinta hewan menyebutnya dalam konteks apa yang terjadi antara burung dan hewan."
