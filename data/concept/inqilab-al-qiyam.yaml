  en: "Inversion of values (inqilab al-qiyam)"
  ur: "اقدار کا الٹ جانا"
summary:
  ar: "ينقل الشيخ عمر عبد الكافي عبارة في انقلاب القيم، تجعل فيها النفس مكان العقل، والظلم مكان العدل، والجهل مكان العلم. ويقول إن أهل هذه الصفات المقلوبة يصبحون المشار إليهم في زمن كهذا."
  en: "Sheikh Omar Abdelkafy paraphrases a passage on the reversal of values, in which the self takes the place of the intellect, injustice of justice and ignorance of knowledge. He says that in such times those with the reversed qualities are the ones pointed to."
  ur: "شیخ عمر عبدالکافی اقدار کے الٹ جانے کے بارے میں ایک عبارت کی تشریح کرتے ہیں، جس میں نفس عقل کی جگہ، ظلم عدل کی جگہ اور جہالت علم کی جگہ لے لیتی ہے۔ ان کے بقول ایسے زمانے میں انہی الٹی صفات والے لوگوں کی طرف اشارہ کیا جاتا ہے۔"
