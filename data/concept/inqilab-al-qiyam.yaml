label:
  ar: "انقلاب القيم"
  en: "Inversion of values (inqilab al-qiyam)"
  ur: "اقدار کا الٹ جانا"
  es: "Inversión de valores (inqilab al-qiyam)"
  fr: "Inversion des valeurs (inqilab al-qiyam)"
  tr: "Değerlerin Devrimi"
  id: "Revolusi Nilai-Nilai"
summary:
  ar: "ينقل الشيخ عمر عبد الكافي عبارة في انقلاب القيم، تجعل فيها النفس مكان العقل، والظلم مكان العدل، والجهل مكان العلم. ويقول إن أهل هذه الصفات المقلوبة يصبحون المشار إليهم في زمن كهذا."
  en: "Sheikh Omar Abdelkafy paraphrases a passage on the reversal of values, in which the self takes the place of the intellect, injustice of justice and ignorance of knowledge. He says that in such times those with the reversed qualities are the ones pointed to."
  ur: "شیخ عمر عبدالکافی اقدار کے الٹ جانے کے بارے میں ایک عبارت کی تشریح کرتے ہیں، جس میں نفس عقل کی جگہ، ظلم عدل کی جگہ اور جہالت علم کی جگہ لے لیتی ہے۔ ان کے بقول ایسے زمانے میں انہی الٹی صفات والے لوگوں کی طرف اشارہ کیا جاتا ہے۔"
  es: "El jeque Omar Abdelkafy parafrasea un pasaje sobre la inversión de valores, en el que el ego sustituye al intelecto, la injusticia a la justicia y la ignorancia al conocimiento. Afirma que, en tales tiempos, aquellos con estas cualidades invertidas son los señalados."
  fr: "Le cheikh Omar Abdelkafy paraphrase un passage sur l'inversion des valeurs, où le moi se substitue à l'intellect, l'injustice à la justice et l'ignorance au savoir. Il affirme qu'en de tels temps, ce sont ceux dont les qualités sont inversées qui sont pointés du doigt."
  tr: "Şeyh Ömer Abdul Kafi, değerlerin tersine çevrilmesiyle ilgili bir ifadeyi aktarır; burada benlik aklın yerini, baskının adaletin yerini aldığını, cehaletin bilginin yerini aldığı bir ifade vardır. Bu ters özelliklere sahip insanların böyle bir zamanda bahsedilenler haline geldiğini söyler."
  id: "Sheikh Omar Abdul Kafi mengutip sebuah frasa tentang pembalikan nilai, di mana diri menggantikan akal, penindasan menggantikan keadilan, dan ketidaktahuan menggantikan pengetahuan. Ia mengatakan bahwa orang-orang dengan sifat terbalik ini menjadi yang dimaksud pada masa seperti itu."
