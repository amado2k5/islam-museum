id: concept/anus-spinster
class: concept
kind: legal
label:
  ar: "العَنُوس"
  en: "The woman left unmarried (anus) and the rules on her consent and maintenance"
  ur: "عنوس (کنواری بیٹھی عورت)"
summary:
  ar: "العنوس في اللغة المرأة التي تأخر زواجها بعد إدراكها ومكثها في بيت أهلها، وتطلق على الرجل أيضاً إذا تأخر زواجه، والجمع عنّس {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11900}. والعضل قد يكون سبباً لعنوسة المرأة، وهو منع الرجل حريمه من التزويج {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11901}. واختلف الفقهاء في معاملة العانس معاملة البكر في الإجبار والإذن، فذهب الجمهور إلى أنها كالبكر في دوام الإجبار عليها، وذهب بعض المالكية والشافعية إلى معاملتها معاملة الثيب إذا زالت بكارتها {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11901}. ولم يحدد الفقهاء سناً واحدة للعنوسة، فقيل ما بين العشرين والأربعين، وقيل يرجع فيها إلى العرف {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11901}. وتجب نفقة العانس على أبيها حتى تتزوج {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11901}."
  en: "In the lexicon, 'anus is a woman whose marriage is delayed after she reaches the age and stays in her family's house; the word is also used of a man whose marriage is late, and its plural is 'unnas {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11900}. The obstruction of a marriage by a guardian can be a cause of a woman remaining unmarried {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11901}. The jurists differ on treating the spinster as a virgin in matters of compulsion and consent: the majority hold she remains like a virgin in the guardian's power to compel her, while some Malikis and Shafi'is treat her like a previously married woman once her virginity is lost {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11901}. The jurists do not fix a single age for spinsterhood; some give a range from twenty to forty, and others refer it to custom {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11901}. The father must maintain an unmarried daughter until she marries {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11901}."
