id: concept/anus-spinster
class: concept
kind: legal
label:
  ar: "العَنُوس"
  en: "The woman left unmarried (anus) and the rules on her consent and maintenance"
  fr: "La femme restée célibataire ('anus) : consentement et entretien"
  ur: "عنوس ⁦(کنواری بیٹھی عورت)⁩"
  es: "La mujer quedó soltera (ano) y las normas sobre su consentimiento y manutención."
summary:
  ar: "العنوس في اللغة المرأة التي تأخر زواجها بعد إدراكها ومكثها في بيت أهلها، وتطلق على الرجل أيضاً إذا تأخر زواجه، والجمع عنّس {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11900}. والعضل قد يكون سبباً لعنوسة المرأة، وهو منع الرجل حريمه من التزويج {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11901}. واختلف الفقهاء في معاملة العانس معاملة البكر في الإجبار والإذن، فذهب الجمهور إلى أنها كالبكر في دوام الإجبار عليها، وذهب بعض المالكية والشافعية إلى معاملتها معاملة الثيب إذا زالت بكارتها {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11901}. ولم يحدد الفقهاء سناً واحدة للعنوسة، فقيل ما بين العشرين والأربعين، وقيل يرجع فيها إلى العرف {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11901}. وتجب نفقة العانس على أبيها حتى تتزوج {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11901}."
  en: "In the lexicon, 'anus is a woman whose marriage is delayed after she reaches the age and stays in her family's house; the word is also used of a man whose marriage is late, and its plural is 'unnas {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11900}. The obstruction of a marriage by a guardian can be a cause of a woman remaining unmarried {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11901}. The jurists differ on treating the spinster as a virgin in matters of compulsion and consent: the majority hold she remains like a virgin in the guardian's power to compel her, while some Malikis and Shafi'is treat her like a previously married woman once her virginity is lost {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11901}. The jurists do not fix a single age for spinsterhood; some give a range from twenty to forty, and others refer it to custom {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11901}. The father must maintain an unmarried daughter until she marries {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11901}."
  fr: "Dans le lexique, 'anus désigne une femme dont le mariage tarde après qu’elle a atteint l’âge de se marier et qui reste dans la maison de sa famille. Le terme s’emploie aussi pour un homme qui se marie tard ; son pluriel est 'unnas {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11900}. L’opposition d’un tuteur à un mariage peut être une raison pour laquelle une femme reste célibataire {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11901}. Les juristes divergent sur la question de savoir si, en matière de contrainte et de consentement, la femme restée célibataire doit être traitée comme une vierge. La majorité estime que le tuteur conserve le même pouvoir de contrainte sur elle que sur une vierge, tandis que certains malékites et chaféites l’assimilent à une femme déjà mariée dès lors qu’elle a perdu sa virginité {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11901}. Les juristes ne fixent pas d’âge unique à partir duquel on la dit 'anus : certains indiquent une fourchette de vingt à quarante ans, d’autres s’en remettent à la coutume {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11901}. Le père doit pourvoir à l’entretien de sa fille célibataire jusqu’à son mariage {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11901}."
  es: "En el léxico, 'anus es una mujer cuyo matrimonio se retrasa después de que alcanza la edad y permanece en la casa de su familia; la palabra también se usa para un hombre cuyo matrimonio es tardío, y su plural es 'unnas {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11900}. La obstrucción de un matrimonio por parte de un tutor puede ser una causa de que una mujer permanezca soltera {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11901}. Los juristas difieren en tratar a la soltera como virgen en cuestiones de coacción y consentimiento: la mayoría sostiene que permanece como virgen bajo el poder del tutor para obligarla, mientras que algunos malikíes y shafi'ís la tratan como una mujer previamente casada una vez que pierde su virginidad {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11901}. Los juristas no fijan una sola edad para la soltería; Algunos dan un rango de veinte a cuarenta, y otros lo remiten a la costumbre {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11901}. El padre debe mantener a una hija soltera hasta que se case {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11901}."
