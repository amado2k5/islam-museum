class: concept
kind: legal
label:
  ar: "الرعي"
  en: "Ra'y (grazing): the freedom of pasture, the Haram's grass, the herdsman's liability and wage, and taking the milk of another's flock"
  ur: "چرائی"
summary:
  ar: "الرعي في اللغة رعي الكلأ، والأصل فيه الإباحة لقول النبي: المسلمون شركاء في ثلاث: الكلأ والماء والنار، فأبطل ما كان في الجاهلية من حمى المراعي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8792} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8793} وذهب جمهور الفقهاء إلى أنه لا يجوز لأهل القرية منع غيرهم من رعي مراعيها، وأجاز المالكية الاختصاص بحريم العمران. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8793} واختلف الفقهاء في رعي حشيش الحرم، فأجازه المالكية والشافعية وأبو يوسف، ومنعه أبو حنيفة ومحمد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8793} ولا يجوز للحاكم أن يأخذ عوضا عن الرعي في الحمى، لأن الحمى لا يحل إلا لله ولرسوله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8793} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8794} والراعي المستأجر أمين لا يضمن إلا بالتعدي أو التقصير. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8794} ولا يحل لبن الماشية إلا بإذن صاحبها عند الجمهور، وأجاز الحنابلة الشرب من ماشية الغير مع الاستئذان عند عدم الحضور. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8794} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8795}"
  en: "Ra'y (grazing) is free by default, as the Prophet said that the Muslims share three things: pasture, water and fire; he abolished the grazing preserves of the pre-Islamic period. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8792} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8793} The majority hold that a village may not exclude others from its pasture; the Malikis allow an inhabited town its own reserve. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8793} The jurists differ on grazing in the Haram: the Malikis, Shafi'is and Abu Yusuf allow it, while Abu Hanifa and Muhammad forbid it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8793} A ruler may take no fee for grazing in a protected preserve, because only God and His Messenger may protect land. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8793} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8794} A hired herdsman is trusted and is liable only for negligence or misconduct. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8794} Most jurists forbid taking the milk of another's flock without leave, while the Hanbalis allow it after asking. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8794} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8795}"
  ur: "چرائی مباح ہے کیونکہ مسلمان تین چیزوں میں شریک ہیں: چارہ، پانی اور آگ۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8792} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8793} حرم کی گھاس کا رعی جائز یا ناجائز ہونے میں اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8793}"
