perspectives:
  - tradition: sunni
    id: sunni-book
    summary:
      ar: "يعرض الصلابي المقطوعات التي أثبتها الرواة لعلي، ويقرر أن الاختلاف في نسبة بعض القصائد لا يقلل من شاعريته المتمثلة فيما رجحت نسبته إليه، ولا يقدح في إمامته اللغوية والأدبية {cite:sallabi-ali-vol1 p. 251}."
      en: "Al-Sallabi presents the verses that narrators assign to Ali and holds that disputed attributions do not diminish what is firmly attributed to him or his standing in language and letters {cite:sallabi-ali-vol1 p. 251}."
    sources: [source/sallabi-ali-vol1]
  - tradition: academic
    id: academic
    summary:
      ar: "ينقل الكتاب عن ابن هشام أنه سأل غير واحد من أهل العلم بالشعر عن الرجز فلم يدر أقاله علي أم غيره، وأنه يرجح أن الرجز الذي ذكره قيل في المعارك الإسلامية ونُسب إليه لمعانيه الدينية {cite:sallabi-ali-vol1 p. 251}. وينقل عن نايف معروف أن الديوان المنسوب خليط {cite:sallabi-ali-vol1 p. 251}. (رأي الكتاب ينقل عن هذين المرجعين كما هو، ولم يُراجع الأصل هنا.)"
      en: "As the book reports it: Ibn Hisham questioned the rajaz and suspected it came from a fighter in the Islamic battles; Nayif Ma'ruf judged the diwan a mixed collection. Both are cited second-hand in the book; the originals are not checked here (needs_source)."
    sources: [source/sallabi-ali-vol1]
  - tradition: other
    id: other
    summary:
      ar: "نقل ياقوت الحموي عن أبي عثمان المازني قولاً بأنه لم يصح عن علي أنه تكلم من الشعر بشيء غير بيتين، وهو قول يرده الصلابي بروايات أخرى {cite:sallabi-ali-vol1 p. 251}."
      en: "Yaqut al-Hamawi reports from Abu Uthman al-Mazini that nothing firmly attributed to Ali exceeds two verses; the book answers this with other narrations {cite:sallabi-ali-vol1 p. 251}."
    sources: [source/sallabi-ali-vol1]
