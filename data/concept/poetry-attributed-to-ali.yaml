id: concept/poetry-attributed-to-ali
class: concept
kind: art_form
label: { ar: "الشعر المنسوب إلى علي بن أبي طالب", en: "Poetry attributed to Ali ibn Abi Talib" }
summary:
  ar: "ينقل الصلابي أن لعلي آراء نقدية في الشعر ومقطوعات عديدة نُسبت إليه، منها أبيات في الفرج والشدة، والصبر، والصداقة، والتواضع والقناعة {cite:sallabi-ali-vol1 p. 251}. وشكّك ابن هشام في نسبة رجز بناء مسجد الرسول إليه {cite:sallabi-ali-vol1 p. 251}، وقال الدكتور نايف معروف إن الديوان المنسوب خليط من شعراء متفاوتين جمعه محبوه {cite:sallabi-ali-vol1 p. 251}، ويرد الكتاب بأن الرواة أثبتوا له مقطوعات صحت نسبتها عندهم {cite:sallabi-ali-vol1 p. 252}."
  en: "Al-Sallabi reports that Ali's critical remarks on poetry and several verses are attributed to him. Ibn Hisham doubted the attribution of the rajaz on building the Prophet's mosque, and Nayif Ma'ruf held that the diwan is a mixed collection by admirers; the book answers that narrators gave him verses whose attribution they held to be sound."
