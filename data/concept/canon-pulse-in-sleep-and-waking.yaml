id: concept/canon-pulse-in-sleep-and-waking
class: concept
kind: scientific
label:
  ar: "النبض في النوم واليقظة عند ابن سينا"
  en: "The pulse in sleep and waking in the Canon"
  fr: "Pouls dans sommeil et veille dans le Canon"
  ur: "نیند اور بیداری میں نبض قانون میں"
  es: "El pulso durante el sueño y la vigilia en el Canon"
summary:
  ar: "في الفصل الثاني عشر يبين ابن سينا أن النبض في النوم تختلف أحكامه بحسب الوقت من النوم وبحسب حال الهضم، ثم يذكر نبض اليقظة التدريجية والمفاجئة {cite:canon-ibn-sina-print-v1 pp.179-180}."
  en: "In the twelfth chapter Ibn Sina shows that the pulse in sleep differs with the point reached in sleep and with the state of digestion, then describes the pulse of gradual and of sudden waking {cite:canon-ibn-sina-print-v1 pp.179-180}."
  fr: "Au chapitre 12, Ibn Sina différencie étapes du sommeil et digestion, puis réveil progressif ou soudain {cite:canon-ibn-sina-print-v1 pp.179-180}."
  es: "En el capítulo doce, Ibn Sina muestra que el pulso durante el sueño difiere según el punto alcanzado en el sueño y según el estado de la digestión, y luego describe el pulso del despertar gradual y del despertar repentino {cite:canon-ibn-sina-print-v1 pp.179-180}."
  ur: "بارہویں باب میں ابن سینا یہ بتاتا ہے کہ نیند میں نبض نیند میں پہنچنے والے نقطہ اور ہضم کی حالت کے ساتھ مختلف ہوتی ہے، پھر بتدریج اور اچانک بیدار ہونے کی نبض کو بیان کرتا ہے۔"
