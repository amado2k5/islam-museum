summary:
  ar: "مثل يُضرب في مقابلة الإحسان بالإساءة، وقصته أن ملك الحيرة رمى معمار الخورنق الرومي من سطحه بعد أن أتمّ بناءه {cite:ketabonline-majma-al-amthal-p845}."
  en: "A proverb for repaying kindness with cruelty; its tale is that the king of al-Hira threw the Byzantine builder of al-Khawarnaq from its roof once the work was done {cite:ketabonline-majma-al-amthal-p845}."
  ur: "وہ مثل جو احسان کے بدلے برائی کے لیے کہی جاتی ہے؛ اس کا قصہ یہ ہے کہ حیرہ کے بادشاہ نے خورنق کے رومی معمار کو عمارت مکمل ہونے پر اس کی چھت سے گرا دیا {cite:ketabonline-majma-al-amthal-p845}۔"
  fr: "Proverbe dit pour rendre le mal en échange du bien ; son histoire est que le roi d'al-Hira jeta du toit l'architecte byzantin d'al-Khawarnaq une fois l'œuvre achevée {cite:ketabonline-majma-al-amthal-p845}."
  es: "Proverbio que se dice por pagar el bien con crueldad; su relato es que el rey de al-Hira arrojó desde el tejado al arquitecto bizantino de al-Khawarnaq una vez terminada la obra {cite:ketabonline-majma-al-amthal-p845}."
