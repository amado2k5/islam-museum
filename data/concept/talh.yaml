summary:
  ar: "في سدر مخضود وطلح منضود وظل ممدود: قرأ المفسرون الطلح شجر الموز وأهل الحجاز شجرة أكلاها الإبل، والقرآن أبقى الاسم عريضاً على شجر الجنة."
  en: "'Among thornless lote-trees and talh clustered, and shade extended': most commentators read the talh as the banana tree, the Hijazis a tree whose fruit the camels eat — the Quran keeps the name wide over the trees of Paradise."
  ur: "'بے کانٹے بیر اور گچھے دار طلح اور پھیلی چھاؤں': اکثر مفسرین طلح کو کیلے کا درخت کہتے ہیں، حجازیوں کے نزدیک اونٹوں کا چارہ درخت — قرآن نے نام کو جنت کے درختوں پر کھلا رکھا۔"
  es: "«Entre árboles de loto sin espinas y agrupados talh, y con sombra extendida»: la mayoría de los comentaristas interpretan talh como el banano, los hijazis como un árbol cuyo fruto comen los camellos; el Corán mantiene el nombre extendido sobre los árboles del Paraíso."
  fr: "« Parmi les lotus sans épines et les talh groupés, et l'ombre s'étend »: la plupart des commentateurs interprètent le talh comme désignant le bananier, les Hijazis comme un arbre dont les chameaux mangent les fruits — le Coran conserve ce nom pour désigner les arbres du Paradis."
