label:
  ar: "سوء التنفس"
  en: "Faulty breathing"
  ur: "خراب تنفس"
summary:
  ar: "سوء التنفس يعم الأحوال الخارجة عن الطبيعة في التنفس التي لا تتبع أعراضاً صحية بل أعراضاً مرضية آلية وذلك مثل عسر النفس وضيق النفس وتضاعف النفس وانقطاع النفس ونفس الانتصاب، وقد يعرض لأنواع سوء المزاج والامتلاء والسدد ومجاورة ضواغط وأورام وأوجاع ولموانع للحركة ولقروح في الحجاب ونواحي الصدر وسقوط القوة من أمراض ناهكة وحميات حادة وبائية وسموم مشروبة، وكل سوء تنفس وضيقه وعسره لمادة فإنه يزداد عند الاستلقاء ويكون وسطاً عند الاضطجاع على جنب ويخف مع الانتصاب وفي الخوانيق يشتد {cite:canon-ibn-sina-print-v2 p.312}"
  en: "Faulty breathing covers all the states departing from the natural in breathing that follow no healthy signs but sick instrumental ones — such as the hard breath, the narrow breath, the doubled breath, the cut breath and the upright breath. It may arise for the kinds of bad temperament, fullness and blockages; for the neighbourhood of pressing things, tumours and pains; for hindrances to motion; for ulcers in the diaphragm and the chest's quarters; and for the power's falling from wasting diseases, acute and epidemic fevers, and drunk poisons. Every faulty breathing — its narrowness and its hardness that is from matter — worsens on lying flat, is middling lying on a side, and lightens with sitting upright; and in the quinsies it is at its strongest {cite:canon-ibn-sina-print-v2 p.312}"
  ur: "خراب تنفس تنفس کی ان تمام حالتوں کا نام ہے جو فطرت سے خارج ہیں اور صحیح اعراض کی نہیں بلکہ آلی مرضی اعراض کی پیروی کرتی ہیں جیسے عسر النفس تنگ نفس دہری نفس منقطع نفس اور کھڑی نفس؛ یہ بد مزاج کی اقسام امتلاء اور سدد سے ہو سکتا ہے دبانے والی چیزوں سوجنوں اور دردوں کے قرب سے حرکت کے موانع سے حجاب اور سینے کے اطراف میں قروح سے اور قوت کے گرنے سے خشک کرنے والی بیماریوں شدید اور وبائی بخاروں اور پئے ہوئے زہروں سے؛ اور ہر خراب تنفس اس کی تنگی اور دشواری جو مادہ سے ہو لیٹنے پر بڑھتی ہے پہلو پر لیٹنے پر درمیانی رہتی ہے اور کھڑے ہونے پر ہلکی ہوتی ہے اور خوانق میں وہ سب سے سخت ہوتی ہے {cite:canon-ibn-sina-print-v2 p.312}"
