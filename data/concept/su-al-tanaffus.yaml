label:
  ar: "سوء التنفس"
  en: "Faulty breathing"
  ur: "خراب تنفس"
  es: "Respiración defectuosa"
  fr: "Respiration défectueuse"
  tr: "Solunum Yetmezliği"
  id: "gagal napas"
summary:
  ar: "سوء التنفس يعم الأحوال الخارجة عن الطبيعة في التنفس التي لا تتبع أعراضاً صحية بل أعراضاً مرضية آلية وذلك مثل عسر النفس وضيق النفس وتضاعف النفس وانقطاع النفس ونفس الانتصاب، وقد يعرض لأنواع سوء المزاج والامتلاء والسدد ومجاورة ضواغط وأورام وأوجاع ولموانع للحركة ولقروح في الحجاب ونواحي الصدر وسقوط القوة من أمراض ناهكة وحميات حادة وبائية وسموم مشروبة، وكل سوء تنفس وضيقه وعسره لمادة فإنه يزداد عند الاستلقاء ويكون وسطاً عند الاضطجاع على جنب ويخف مع الانتصاب وفي الخوانيق يشتد {cite:canon-ibn-sina-print-v2 p.312}"
  en: "Faulty breathing covers all the states departing from the natural in breathing that follow no healthy signs but sick instrumental ones — such as the hard breath, the narrow breath, the doubled breath, the cut breath and the upright breath. It may arise for the kinds of bad temperament, fullness and blockages; for the neighbourhood of pressing things, tumours and pains; for hindrances to motion; for ulcers in the diaphragm and the chest's quarters; and for the power's falling from wasting diseases, acute and epidemic fevers, and drunk poisons. Every faulty breathing — its narrowness and its hardness that is from matter — worsens on lying flat, is middling lying on a side, and lightens with sitting upright; and in the quinsies it is at its strongest {cite:canon-ibn-sina-print-v2 p.312}"
  ur: "خراب تنفس تنفس کی ان تمام حالتوں کا نام ہے جو فطرت سے خارج ہیں اور صحیح اعراض کی نہیں بلکہ آلی مرضی اعراض کی پیروی کرتی ہیں جیسے عسر النفس تنگ نفس دہری نفس منقطع نفس اور کھڑی نفس؛ یہ بد مزاج کی اقسام امتلاء اور سدد سے ہو سکتا ہے دبانے والی چیزوں سوجنوں اور دردوں کے قرب سے حرکت کے موانع سے حجاب اور سینے کے اطراف میں قروح سے اور قوت کے گرنے سے خشک کرنے والی بیماریوں شدید اور وبائی بخاروں اور پئے ہوئے زہروں سے؛ اور ہر خراب تنفس اس کی تنگی اور دشواری جو مادہ سے ہو لیٹنے پر بڑھتی ہے پہلو پر لیٹنے پر درمیانی رہتی ہے اور کھڑے ہونے پر ہلکی ہوتی ہے اور خوانق میں وہ سب سے سخت ہوتی ہے {cite:canon-ibn-sina-print-v2 p.312}"
  es: "La respiración defectuosa abarca todos los estados respiratorios que se desvían de lo natural y que no presentan signos saludables, sino signos instrumentales patológicos, como la respiración dificultosa, la respiración estrecha, la respiración doble, la respiración cortada y la respiración erguida. Puede deberse a distintos tipos de mal temperamento, congestión y obstrucciones; a la proximidad de objetos que presionan, tumores y dolores; a limitaciones de movimiento; a úlceras en el diafragma y el tórax; y a la disminución de la fuerza causada por enfermedades debilitantes, fiebres agudas y epidémicas, y intoxicaciones por alcohol. Toda respiración defectuosa —su estrechez y su dificultad respiratoria debida a la materia— empeora al acostarse boca arriba, es moderada al acostarse de lado y mejora al sentarse erguido; y en los amigdalitis agudas es más intensa. {cite:canon-ibn-sina-print-v2 p.312}"
  fr: "La respiration défectueuse englobe tous les états respiratoires anormaux, non accompagnés de signes de bonne santé mais de signes instrumentaux de maladie: respiration difficile, respiration étroite, respiration double, respiration coupée et respiration verticale. Elle peut être due à un mauvais tempérament, à une sensation de plénitude ou à des blocages; à la proximité de substances compressives, de tumeurs ou de douleurs; à une gêne motrice; à des ulcères du diaphragme et de la cage thoracique; et à une baisse d’énergie consécutive à des maladies débilitantes, des fièvres aiguës ou épidémiques, ou à l’intoxication par des poisons. Toute respiration défectueuse – son étranglement et sa difficulté respiratoire d’origine physique – s’aggrave en position couchée, est modérée en position latérale et s’atténue en position assise; elle est maximale dans les angines. {cite:canon-ibn-sina-print-v2 p.312}"
  tr: "Solunum bozukluğu, sağlık belirtilerini takip etmeyen, nefes darlığı, nefes darlığı, çift nefes alma, apne ve erektil disfonksiyon gibi mekanik patolojik belirtileri takip eden normal nefes alımın ötesindeki durumları içerir. Çeşitli kötü ruh hali, dolgunluk ve tıkanıklık, kompresörlere yakınlık, tümörler, ağrılar, hareket bozukluğu, diyafram ve göğüs bölgelerinde yaralar, sakatlayıcı hastalıklardan güç kaybı, akut salgın ateşler ve alkol toksinleri gibi durumlara maruz kalabilir. Nefes darlığı, nefes darlığı ve bir maddeyle ilgili zorluk, yatarken artar, bir yan yatarken orta derecede olur ve ereksiyonla azalır; kafeslerde ise şiddetlenir {cite:canon-ibn-sina-print-v2 s.312}"
  id: "Gangguan pernapasan mencakup kondisi di luar pernapasan normal yang tidak mengikuti gejala kesehatan tetapi gejala patologis mekanis, seperti sesak napas, sesak napas, pernapasan ganda, apnea, dan disfungsi ereksi. Gangguan ini dapat disebabkan oleh berbagai jenis suasana hati buruk, penuh dan penyumbatan, kedekatan dengan kompresor, tumor, nyeri, gangguan gerakan, luka di area diafragma dan dada, hilangnya kekuatan akibat penyakit melemahkan, demam epidemi akut, dan racun alkohol. Setiap sesak napas, sesak napas, dan kesulitan dengan suatu zat meningkat saat berbaring, sedang saat berbaring di satu sisi, dan berkurang saat ereksi, dan di dalam kandang semakin intens {cite:canon-ibn-sina-print-v2 hlm.312}"
