label:
  ar: "العربية في تشاد"
  en: "Arabic in Chad"
  ur: "چاڈ میں عربی"
  fr: "l'arabe au Tchad"
  es: "el árabe en Chad"
summary:
  ar: "تعرض هذه الصفحة ما يقوله ملخص بحثي زُوّد به المتحف عن العربية في تشاد: مكانتها القانونية، والأصناف المحكية منها، والأرقام الرسمية كما وردت. والصورة هنا قانونية في المقام الأول: العربية والفرنسية لغتان رسميتان، ولا يوجد عدد رسمي للمتكلمين. ولم يفتح المتحف الصفحات التي يسمّيها الملخص، وقد أجاز المؤسس استعماله كما ورد في 21 نوفمبر 2026. وحيث يقول الملخص إنه لم يجد مصدراً رسمياً أو رقماً فهذا ما تقوله الصفحة بلفظه، ولا يضع المتحف رقماً من عنده."
  en: "This page sets out what a research summary supplied to the museum says about Arabic in Chad: its legal status, the varieties spoken and the official figures, each as the summary gives it. The picture is mainly legal: Arabic and French are the two official languages, and no official count of speakers was found. The museum did not open the pages the summary names, and the founder approved using it as supplied on 21 November 2026. Where the summary says that no official source or figure was found, this page says exactly that and supplies no number of its own."
  ur: "یہ صفحہ وہ پیش کرتا ہے جو متحف کو فراہم کردہ ایک تحقیقی خلاصہ چاڈ میں عربی کے بارے میں کہتا ہے: اس کی قانونی حیثیت، بولی جانے والی اقسام اور سرکاری اعداد و شمار، ہر ایک جیسا خلاصہ دیتا ہے۔ تصویر یہاں بنیادی طور پر قانونی ہے: عربی اور فرانسیسی دو سرکاری زبانیں ہیں، اور بولنے والوں کی کوئی سرکاری گنتی نہیں ملی۔ متحف نے خلاصے کے بیان کردہ صفحات نہیں کھولے، اور بانی نے 21 نومبر 2026 کو خلاصے کو جیسا ملا اسی طرح استعمال کرنے کی منظوری دی۔ جہاں خلاصہ کہتا ہے کہ کوئی سرکاری ماخذ یا عدد نہیں ملا وہاں یہ صفحہ بالکل یہی کہتا ہے اور اپنی طرف سے کوئی عدد نہیں دیتا۔"
  fr: "Cette page expose ce que dit un résumé de recherche remis au musée sur l'arabe au Tchad : son statut juridique, les variétés parlées et les chiffres officiels, chacun tel que le résumé le donne. Le tableau est surtout juridique : l'arabe et le français sont les deux langues officielles, et aucun décompte officiel de locuteurs n'a été trouvé. Le musée n'a pas ouvert les pages que nomme le résumé, et le fondateur a approuvé l'usage du résumé tel que fourni le 21 novembre 2026. Là où le résumé dit qu'aucune source officielle ni aucun chiffre n'a été trouvé, cette page dit exactement cela et ne fournit aucun nombre de son cru."
  es: "Esta página expone lo que dice un resumen de investigación entregado al museo sobre el árabe en Chad: su estatus jurídico, las variedades habladas y las cifras oficiales, cada una como la da el resumen. El cuadro es sobre todo jurídico: el árabe y el francés son las dos lenguas oficiales, y no se encontró ningún recuento oficial de hablantes. El museo no abrió las páginas que nombra el resumen, y el fundador aprobó usarlo tal como se entregó el 21 de noviembre de 2026. Donde el resumen dice que no se halló ninguna fuente oficial ni cifra, esta página dice exactamente eso y no aporta ningún número propio."
