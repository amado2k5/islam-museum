label:
  ar: "ماهي زهرة"
  en: "Mahizahra (a spurge-like tree)"
  ur: "ماہی زہرہ"
  es: "Mahizahra (un árbol parecido a un tártago)"
  fr: "Mahizahra (un arbre ressemblant à une euphorbe)"
summary:
  ar: "ماهي زهرة شجرة كشجرة الشبرم أطول منها، غبرة إلى صفرة، وقد يعدها بعضهم من اليتوعات، حارة يابسة في الثالثة، تسكر السمك، وتنفع النقرس وعرق النسا وتسهل الأخلاط الغليظة {cite:canon-ibn-sina-print-v1 p.570}."
  en: "Mahizahra is a tree like the shubram but taller, grey toward yellow, which some count among the spurges; hot and dry in the third degree, it stuns fish, helps gout and sciatica and purges thick humours {cite:canon-ibn-sina-print-v1 p.570}."
  ur: "ماہی زہرہ ایک درخت ہے شبرم جیسا مگر اس سے لمبا، خاکستری سے زرد، جسے بعض یتوعات میں شمار کرتے ہیں؛ تیسرے درجے میں گرم خشک، مچھلیوں کو بے ہوش کرتا ہے، نقرس اور عرق النسا میں مفید ہے اور موٹے اخلاط کو خارج کرتا ہے {cite:canon-ibn-sina-print-v1 p.570}۔"
  es: "Mahizahra es un árbol parecido al shubram pero más alto, gris tirando a amarillo, que algunos cuentan entre las euforbias; caliente y seco en tercer grado, aturde a los peces, ayuda con la gota y la ciática y purga los humores espesos {cite:canon-ibn-sina-print-v1 p.570}."
  fr: "Le mahizahra est un arbre semblable au shubram mais plus grand, gris à jaune, que certains comptent parmi les euphorbes; chaud et sec au troisième degré, il étourdit les poissons, aide contre la goutte et la sciatique et purge les humeurs épaisses {cite:canon-ibn-sina-print-v1 p.570}."
