summary:
  ar: "يبين ابن سينا أن من الضوارب ما يوافق الأوردة، وأن الشريان إذا رافق الوريد على الصلب امتطاه، وفي الأعضاء الظاهرة غار تحته، وأن في مصاحبتهما منفعتين {cite:canon-ibn-sina-print-v1 p.87}."
  en: "Ibn Sina shows that some arteries go along with veins; where the artery accompanies the vein on the spine it rides it, in the outer organs it dives beneath it, and there are two benefits in their going together {cite:canon-ibn-sina-print-v1 p.87}."
