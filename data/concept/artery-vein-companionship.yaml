id: concept/artery-vein-companionship
class: concept
kind: scientific
label: { ar: "مرافقة الشرايين للأوردة عند ابن سينا", en: "The companionship of arteries and veins in the Canon", fr: "Le compagnonnage des artères et des veines dans le Canon", ur: "قانون میں شریانوں اور رگوں کی رفاقت", es: "La relación entre arterias y venas en el Canon" }
summary:
  ar: "يبين ابن سينا أن من الضوارب ما يوافق الأوردة، وأن الشريان إذا رافق الوريد على الصلب امتطاه، وفي الأعضاء الظاهرة غار تحته، وأن في مصاحبتهما منفعتين {cite:canon-ibn-sina-print-v1 p.87}."
  en: "Ibn Sina shows that some arteries go along with veins; where the artery accompanies the vein on the spine it rides it, in the outer organs it dives beneath it, and there are two benefits in their going together {cite:canon-ibn-sina-print-v1 p.87}."
  fr: "Ibn Sina montre que certaines artères vont de pair avec les veines ; là où l’artère accompagne la veine sur la colonne vertébrale, elle la chevauche ; dans les organes extérieurs, elle plonge sous elle ; et leur cheminement commun présente deux avantages {cite:canon-ibn-sina-print-v1 p.87}."
  es: "Ibn Sina muestra que algunas arterias van junto con las venas; donde la arteria acompaña a la vena en la columna vertebral, la monta, en los órganos externos se sumerge debajo de ella, y hay dos beneficios en que vayan juntas {cite:canon-ibn-sina-print-v1 p.87}."
