label: { ar: "التحويل بين الساعات المعتدلة والزمانية وقوس النهار من أزمان الساعات في الزيج الصابي", en: "Converting between equal and seasonal hours, and the day arc from hour times", ur: "معتدل اور زمانی ساعات کی تبدیلی اور گھنٹوں کے اوقات سے قوس النہار", es: "Conversión entre horas iguales y estacionales, y el arco del día a partir de horas horarias.", fr: "Conversion entre heures égales et saisonnières, et arc de jour à partir des heures" }
summary:
  ar: "يختم البتاني الباب الثالث عشر بأعمال التحويل: قوس النهار أو الليل من أزمان الساعات بضرب زمن الساعة في ستة لنصف القوس ثم تضعيفه، أو في اثني عشر مباشرة، وتحويل الساعات المعتدلة إلى زمانية بضربها في خمسة عشر وقسمتها على زمن الساعة الزمانية، وتحويل الزمانية إلى معتدلة بضربها في زمن الساعة وقسمتها على خمسة عشر. {cite:zij-sabi-nallino-byblion p.47}."
  en: "Al-Battani ends chapter 13 with the conversions: the day or night arc from the hour times by multiplying one hour's time by six for half the arc and doubling it, or by twelve directly; turning equal hours into seasonal ones by multiplying by fifteen and dividing by the time of the seasonal hour; and turning seasonal hours into equal ones by multiplying by the hour's time and dividing by fifteen. {cite:zij-sabi-nallino-byblion p.47}."
  ur: "البتانی تیرہویں باب کو تبدیلی کے اعمال پر ختم کرتے ہیں: گھنٹوں کے اوقات سے قوس النہار یا قوس اللیل، ایک گھنٹے کے زمانے کو چھ سے ضرب دے کر نصف قوس اور اسے دگنا کر کے، یا براہ راست بارہ سے ضرب دے کر؛ معتدل گھنٹوں کو زمانی میں بدلنا انھیں پندرہ سے ضرب دے کر زمانی گھنٹے کے زمانے پر تقسیم کر کے؛ اور زمانی کو معتدل میں بدلنا گھنٹے کے زمانے سے ضرب دے کر پندرہ پر تقسیم کر کے۔ {cite:zij-sabi-nallino-byblion p.47}۔"
  es: "Al-Battani finaliza el capítulo 13 con las conversiones: el arco del día o de la noche a partir de las horas multiplicando la hora por seis para obtener la mitad del arco y duplicándola, o directamente por doce; convirtiendo horas iguales en estacionales multiplicando por quince y dividiendo por la hora estacional; y convirtiendo horas estacionales en iguales multiplicando por la hora y dividiendo por quince. {cite:zij-sabi-nallino-byblion p.47}."
  fr: "Al-Battani conclut le chapitre 13 par les conversions suivantes: pour obtenir l’arc du jour ou de la nuit à partir des heures, on multiplie la durée d’une heure par six pour obtenir la moitié de l’arc et on double le résultat, ou directement par douze; pour convertir des heures égales en heures saisonnières, on multiplie par quinze et on divise par la durée de l’heure saisonnière; et pour convertir des heures saisonnières en heures égales, on multiplie par la durée de l’heure et on divise par quinze. {cite:zij-sabi-nallino-byblion p.47}."
