id: concept/canon-gravelly-and-ashen-sediment
class: concept
kind: scientific
label:
  ar: "الرسوب الرملي والرمادي عند ابن سينا"
  en: "Gravelly and ashen sediment in the Canon"
  fr: "Sédiments graveleux et cendreux dans le Canon"
  ur: "ریتلی اور راکھ جیسی تلچھٹ قانون میں"
  es: "Sedimentos gravosos y cenicientos en el Cañón"
summary:
  ar: "يذكر ابن سينا أن الرملي يدل دائماً على حصاة منعقدة أو في الانعقاد أو الانحلال، وأن الرمادي يدل في الأكثر على بلغم أو مدة طال لبثها فتغير لونها وتقطعت أجزاؤها. {cite:canon-ibn-sina-print-v1 p.195}."
  en: "Ibn Sina says gravelly sediment always shows a stone formed, forming or breaking up, and ashen sediment mostly shows phlegm or pus that lingered, changing colour and breaking into pieces. {cite:canon-ibn-sina-print-v1 p.195}."
  fr: "Ibn Sina attribue toujours le graveleux à un calcul formé, en formation ou désagrégation ; le cendreux surtout au phlegme ou pus longtemps retenus, décolorés et fragmentés. {cite:canon-ibn-sina-print-v1 p.195}."
  es: "Ibn Sina afirma que los sedimentos gravosos siempre muestran una piedra formada, en formación o en descomposición, y los sedimentos cenicientos generalmente muestran flema o pus que permaneció en el lugar, cambiando de color y rompiéndose en pedazos. {cite:canon-ibn-sina-print-v1 p.195}."
