label: { ar: "أم الكتاب", en: "Umm al-kitab (the basis of the book; the opening surah)", es: "Umm al-kitab (la base del libro; la sura inicial)", fr: "Umm al-kitab (le fondement du livre; la sourate d'ouverture)", ur: "ام الکتاب ⁦(کتاب کی بنیاد؛ ابتدائی سورہ)⁩" }
summary:
  ar: "أم الكتاب أصل الشيء، ووردت في القرآن بمعنى الآيات المحكمات التي يرجع إليها عند الاشتباه، وبمعنى اللوح المحفوظ الذي فيه علم الله، وأطلقت في الحديث على سورة الفاتحة، ومنه قوله: «من قرأ بأم الكتاب فقد أجزأت عنه». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3403}"
  en: "Umm al-kitab means the basis of a thing. The Qur'an uses it for the firm verses to which one returns in doubt, and for the Preserved Tablet which holds God's knowledge; the hadith uses it for the opening surah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3403}"
  es: "Umm al-kitab significa el fundamento de algo. El Corán lo utiliza para los versículos firmes a los que se regresa en caso de duda, y para la Tabla Preservada que contiene el conocimiento de Dios; el hadiz lo utiliza para la sura inicial. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3403}"
  fr: "Umm al-kitab signifie le fondement d'une chose. Le Coran l'emploie pour les versets sûrs auxquels on se réfère en cas de doute, et pour la Table préservée qui renferme la science divine; le hadith l'utilise pour la première sourate. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3403}"
  ur: "ام الکتاب سے مراد کسی چیز کی بنیاد ہے۔ قرآن اسے ان مضبوط آیات کے لیے استعمال کرتا ہے جن کی طرف کوئی شک میں واپس آجاتا ہے، اور محفوظ شدہ تختی کے لیے جو خدا کا علم رکھتا ہے۔ حدیث اسے ابتدائی سورت کے لیے استعمال کرتی ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 3403}"
