summary:
  ar: "أم الكتاب أصل الشيء، ووردت في القرآن بمعنى الآيات المحكمات التي يرجع إليها عند الاشتباه، وبمعنى اللوح المحفوظ الذي فيه علم الله، وأطلقت في الحديث على سورة الفاتحة، ومنه قوله: «من قرأ بأم الكتاب فقد أجزأت عنه». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3403}"
  en: "Umm al-kitab means the basis of a thing. The Qur'an uses it for the firm verses to which one returns in doubt, and for the Preserved Tablet which holds God's knowledge; the hadith uses it for the opening surah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3403}"
