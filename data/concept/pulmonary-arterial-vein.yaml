id: concept/pulmonary-arterial-vein
class: concept
kind: scientific
label: { ar: "الوريد الشرياني عند ابن سينا", en: "The arterial vein in the Canon", ur: "قانون میں شریانی وریدی رگ", es: "La vena arterial en el Canon", fr: "La veine artérielle dans le Canon" }
summary:
  ar: "الوريد الشرياني عند ابن سينا عرق ينفصل من الأجوف عند القلب ثلاثة عروق إلى الرئة، خلق ذا غشاءين كالشرايين، ولذلك سمي بهذا الاسم {cite:canon-ibn-sina-print-v1 p.89}."
  en: "The arterial vein in Ibn Sina is the vessel that parts from the hollow vein at the heart as three vessels to the lung, made with two coats like the arteries, which is why it has this name {cite:canon-ibn-sina-print-v1 p.89}."
  es: "La vena arterial en Ibn Sina es el vaso que se separa de la vena hueca en el corazón como tres vasos hacia el pulmón, hecha con dos capas como las arterias, razón por la cual tiene este nombre {cite:canon-ibn-sina-print-v1 p.89}."
  fr: "La veine artérielle chez Ibn Sina est le vaisseau qui se sépare de la veine creuse du cœur en trois vaisseaux vers le poumon, constitués de deux couches comme les artères, c'est pourquoi elle porte ce nom {cite:canon-ibn-sina-print-v1 p.89}."
  ur: "ابن سینا میں شریان کی رگ وہ برتن ہے جو دل کی کھوکھلی رگ سے پھیپھڑوں تک تین رگوں کی طرح تقسیم ہوتی ہے اور شریانوں کی طرح دو پرتوں سے بنی ہوتی ہے، اسی لیے اس کا یہ نام ہے {حوالہ: کینون ابن سینا پرنٹ-v1 p.89}۔"
