id: concept/miqyas-al-nil
class: concept
kind: term
label: { ar: "مقياس النيل", en: "The Nilometer", es: "El nilómetro", fr: "Le nilomètre", ur: "نیلومیٹر", tr: "Nil ölçüsü", id: "Ukuran Nil" }
summary:
  ar: "عند المسعودي يبتدئ النيل بالتنفس والزيادة بقية بؤونة وأبيب ومسرى فإذا انتهت الزيادة إلى ست عشرة ذراعاً كان فيه تمام الخراج وخصب الأرض، وأتم الزيادات سبع عشرة ذراعاً، فإذا بلغت ثماني عشرة استبحر من أرض مصر الربع وكان ضرراً، وإن زادت حدث وباء بمصر، وأكثر الزيادات ثماني عشرة وقد بلغ تسع عشرة سنة تسع وتسعين في خلافة عمر بن عبد العزيز، ومساحة الذراع إلى اثنتي عشرة ثمان وعشرون أصبعاً ثم يصير الذراع أربعاً وعشرين أصبعاً، وأقل ما يبقى في قاع المقياس ثلاثة أذرع، والذراعان اللتان يستسقى عليهما الناس هما الثالث عشر والرابع عشر وتسميان منكراً ونكيراً، فإذا دخل في ست عشرة كان صلاحاً لبعض الناس ولا استسقاء فيه، والترع بغيضة مصر أربع تفتح في عيد الصليب لأربع عشرة تخلو من توت {cite:muruj-al-dhahab p. 301-302}."
  en: "The Nile gauge in al-Mas'udi's account: sixteen cubits means full kharaj, seventeen the perfect flood, eighteen floods a quarter of Egypt and augurs plague — the record nineteen came in 99 under Umar II; the gauge's thirteenth and fourteenth cubits are named Munkar and Nakir and below them Egypt prays for rain; the four great canals open at the Feast of the Cross on 14 Tut {cite:muruj-al-dhahab p. 301-302}."
  es: "El medidor del Nilo en el relato de al-Mas'udi: dieciséis codos significan el kharaj completo, diecisiete la inundación perfecta, dieciocho inundaciones una cuarta parte de Egipto y presagian la peste; el récord de diecinueve se dio en el año 99 bajo el reinado de Umar II; los codos trece y catorce del medidor se llaman Munkar y Nakir, y debajo de ellos Egipto reza por la lluvia; los cuatro grandes canales se abren en la Fiesta de la Cruz el 14 de Tut {cite:muruj-al-dhahab p. 301-302}."
  fr: "Le niveau du Nil selon al-Mas'udi: seize coudées signifient le kharaj complet, dix-sept la crue parfaite, dix-huit inondent un quart de l'Égypte et présagent la peste — le record de dix-neuf coudées a été atteint en 99 sous Umar II; les treizième et quatorzième coudées du niveau sont nommées Munkar et Nakir et en dessous, l'Égypte prie pour la pluie; les quatre grands canaux s'ouvrent à la fête de la Croix le 14 Toutankhamon {cite: muruj-al-dhahab p. 301-302}."
  ur: "المسعودی کے بیان میں دریائے نیل کی پیمائش: سولہ ہاتھ کا مطلب مکمل خراج، سترہ کامل سیلاب، اٹھارہ سیلاب مصر کا چوتھائی حصہ اور طاعون کی علامت ہے۔ ریکارڈ انیس عمر ثانی کے دور میں 99 میں آیا؛ گیج کے تیرھویں اور چودھویں ہاتھ کے نام منکر اور نقیر ہیں اور ان کے نیچے مصر بارش کی دعا کرتا ہے۔ چار عظیم نہریں 14 توت کو صلیب کی دعوت کے موقع پر کھلتی ہیں۔ 301-302}۔"
  tr: "El-Mes'udi'ye göre, Nil, Bu'una, Abib ve Masra'nın kalan kısmını solumak ve artırmakla başlar. Artış on altı arşına ulaştığında kharaj ve verimli toprakları tamamlar, tam artış on yedi arşına ulaşır. On sekize ulaştığında Mısır topraklarının dörtte birini çıkarır ve bu da zarara yol açar. Artış artarsa, Mısır'da bir salgın çıkar. Maksimum artış on sekizdir ve Ömer bin Abdülaziz halifeliği sırasında on dokuz yıl doksan dokuza ulaşmıştır. Arşının alanı yirmi sekiz parmak, sonra arşın yirmi dört parmak olur. Terazinin en altında kalan en az üç arşındır ve insanların su aldığı iki arşın on üçüncü ve on dördüncüdür; her ikisi de Munkar ve Nakir olarak adlandırılır. Eğer on altıya ulaşırsa, bazıları için iyi kabul edilir ve yağmur gerektirmez. Mısır vadisindeki dört kanal, Haç Bayramı'nda on dört gün boyunca meyvesiz açılır {cite:muruj-al-dhahab s. 301-302}."
  id: "Menurut Al-Mas'udi, Sungai Nil dimulai dengan bernapas dan bertambah sisa Bu'una, Abib, dan Masra. Ketika peningkatan mencapai enam belas hasta, ia melengkapi kharaj dan tanah subur, dan pertambahan penuh adalah tujuh belas hasta. Ketika mencapai delapan belas hasta, ia mengambil seperempat tanah Mesir, yang menyebabkan kerugian. Jika meningkat, terjadi wabah di Mesir. Peningkatan maksimum adalah delapan belas, dan mencapai sembilan belas tahun sembilan puluh sembilan saat kekhalifahan Umar ibn Abd al-Aziz. Luas hasta adalah dua puluh delapan jari, kemudian hasta menjadi dua puluh empat jari. Minimum yang tersisa di bagian bawah skala adalah tiga hasta, dan dua hasta tempat orang menerima air adalah yang ketiga belas dan keempat belas, keduanya disebut Munkar dan Nakir. Jika mencapai enam belas, dianggap baik untuk sebagian orang dan tidak memerlukan hujan. Kanal di lembah Mesir adalah empat yang terbuka pada Pesta Salib selama empat belas hari tanpa beri {cite:muruj-al-dhahab hlm. 301-302}."
