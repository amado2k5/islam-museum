id: concept/miqyas-al-nil
class: concept
kind: term
label: { ar: "مقياس النيل", en: "The Nilometer" }
summary:
  ar: "عند المسعودي يبتدئ النيل بالتنفس والزيادة بقية بؤونة وأبيب ومسرى فإذا انتهت الزيادة إلى ست عشرة ذراعاً كان فيه تمام الخراج وخصب الأرض، وأتم الزيادات سبع عشرة ذراعاً، فإذا بلغت ثماني عشرة استبحر من أرض مصر الربع وكان ضرراً، وإن زادت حدث وباء بمصر، وأكثر الزيادات ثماني عشرة وقد بلغ تسع عشرة سنة تسع وتسعين في خلافة عمر بن عبد العزيز، ومساحة الذراع إلى اثنتي عشرة ثمان وعشرون أصبعاً ثم يصير الذراع أربعاً وعشرين أصبعاً، وأقل ما يبقى في قاع المقياس ثلاثة أذرع، والذراعان اللتان يستسقى عليهما الناس هما الثالث عشر والرابع عشر وتسميان منكراً ونكيراً، فإذا دخل في ست عشرة كان صلاحاً لبعض الناس ولا استسقاء فيه، والترع بغيضة مصر أربع تفتح في عيد الصليب لأربع عشرة تخلو من توت {cite:muruj-al-dhahab p. 301-302}."
  en: "The Nile gauge in al-Mas'udi's account: sixteen cubits means full kharaj, seventeen the perfect flood, eighteen floods a quarter of Egypt and augurs plague — the record nineteen came in 99 under Umar II; the gauge's thirteenth and fourteenth cubits are named Munkar and Nakir and below them Egypt prays for rain; the four great canals open at the Feast of the Cross on 14 Tut {cite:muruj-al-dhahab p. 301-302}."
