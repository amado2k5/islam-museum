id: concept/ithbat
class: concept
kind: legal
label: { ar: "إثبات", en: "Proof in litigation (ithbat)", es: "Prueba en litigio (ithbat)", fr: "Preuve en litige (ithbat)", ur: "قانونی چارہ جوئی میں ثبوت (ithbat)", tr: "Kanıt", id: "Bukti" }
summary:
  ar: "الإثبات في اللغة مصدر أثبت بمعنى اعتبار الشيء دائماً مستقراً أو صحيحاً، وفي كلام الفقهاء إقامة الدليل الشرعي أمام القاضي في مجلس قضائه على حق أو واقعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1505} ويطلب الإثبات من المدعي باتفاق المذاهب، لقوله: البينة على المدعي واليمين على من أنكر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1505} والإقرار أقوى الأدلة لانتفاء التهمة فيه غالباً، والحنفية والمالكية يقدمونه على الشهادة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1508} وفي القضاء بالشاهد واليمين خلاف: يجيزه مالك والشافعي وأحمد في الأموال وما يؤول إليها، ويمنعه الحنفية وجمهور أهل العراق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1507} وحلف المنكر يقطع الخصومة في الحال عند الحنفية والشافعية والحنابلة، ويقطعها مطلقاً عند المالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1512} وللقاضي أن يقضي بعلمه عند الحنفية في زمن القضاء ومكانه في حقوق الآدميين، وبالقرينة القاطعة، وبكتاب القاضي إلى القاضي، وبالخط والختم بعد الاستيثاق، وبقول القافة في النسب عند الأئمة الثلاثة، وبقول أهل الخبرة، وبالاستصحاب، وبالقسامة والعرف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1517} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1519} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1520} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1521}"
  en: "Ithbat in the lexicon is the verb athbata, to treat a thing as lasting, settled or sound. In the jurists' usage it is the establishment before the judge, in his session, of a lawful proof of a right or a fact. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1505} Its aim is that the claimant obtains his right or is protected from interference. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1505} The burden of proof lies on the claimant by agreement of the four schools, on the saying: the proof is for the claimant, and the oath is for the one who denies. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1505} Confession is the strongest proof because a sane person is unlikely to confess falsely; the Hanafis and Malikis rank it above testimony. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1508} Judging on one witness with an oath is disputed: Malik, al-Shafi'i and Ahmad allow it in property and what leads to property, while the Hanafis and most Iraqi jurists refuse it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1507} The denying party's oath ends the dispute at once according to the Hanafis, Shafi'is and Hanbalis, but the Malikis treat it as ending the dispute outright. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1512} The judge may rule on his own knowledge, which the Hanafis permit only within the time and place of his judgeship for the rights of people; he may also rule on decisive circumstantial evidence, on a letter from one judge to another, on writing and seal once their authenticity is secure, on the opinion of trackers (qafa) about lineage according to the three imams, on lots and physiognomy, on the opinion of experts, on continuity of an earlier state, on the oath of homicide (qasama), and on custom. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1517} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1519} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1520} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1521}"
  es: "Ithbat en el léxico es el verbo athbata, tratar algo como duradero, establecido o sólido. En el uso de los juristas es el establecimiento ante el juez, en su sesión, de una prueba legal de un derecho o un hecho. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1505} Su objetivo es que el reclamante obtenga su derecho o sea protegido de interferencias. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1505} La carga de la prueba recae sobre el reclamante por acuerdo de las cuatro escuelas, según el dicho: la prueba es para el reclamante, y el juramento para el que niega. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1505} La confesión es la prueba más sólida porque es improbable que una persona cuerda confiese falsamente; los hanafíes y los malikíes la consideran superior al testimonio. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1508} Juzgar con un testigo bajo juramento es controvertido: Malik, al-Shafi'i y Ahmad lo permiten en materia de propiedad y lo que conduce a la propiedad, mientras que los Hanafis y la mayoría de los juristas iraquíes lo rechazan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1507} El juramento de la parte que niega termina la disputa de inmediato según los Hanafis, Shafi'is y Hanbalis, pero los Malikis lo consideran como si terminara la disputa por completo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1512} El juez puede dictaminar sobre su propio conocimiento, lo que los Hanafis permiten solo dentro del tiempo y lugar de su cargo judicial para los derechos de las personas; También puede dictaminar sobre pruebas circunstanciales decisivas, sobre una carta de un juez a otro, sobre la escritura y el sello una vez asegurada su autenticidad, sobre la opinión de los rastreadores (qafa) sobre el linaje según los tres imanes, sobre suertes y fisonomía, sobre la opinión de expertos, sobre la continuidad de un estado anterior, sobre el juramento de homicidio (qasama) y sobre la costumbre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1517} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1519} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1520} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1521}"
  fr: "Dans le lexique, « ithbat » correspond au verbe « athbata », qui signifie considérer une chose comme durable, établie ou solide. En droit, il s'agit de l'établissement, devant le juge, lors de son audience, d'une preuve licite d'un droit ou d'un fait. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1505} Son but est que le demandeur obtienne ce qu'il mérite ou soit protégé contre toute ingérence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1505} La charge de la preuve incombe au demandeur, selon l'avis unanime des quatre écoles juridiques: la preuve est pour le demandeur, et le serment pour celui qui nie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1505} L'aveu est la preuve la plus solide, car il est peu probable qu'une personne saine d'esprit fasse un faux aveu; les écoles hanafite et malikite le placent au-dessus du témoignage. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1508} Le jugement sur la base d'un seul témoin sous serment est controversé: Malik, al-Shafi'i et Ahmad l'autorisent en matière de propriété et de ce qui y conduit, tandis que les Hanafites et la plupart des juristes irakiens le refusent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1507} Selon les Hanafites, les Shafi'ites et les Hanbalites, le serment de la partie qui conteste met fin immédiatement au litige, tandis que les Malikites le considèrent comme une résolution définitive. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1512} Le juge peut statuer de sa propre initiative, ce que les Hanafites n'autorisent que dans le cadre et le lieu de son mandat, et uniquement pour défendre les droits des personnes. Il peut également statuer sur des preuves circonstancielles décisives, sur une lettre entre juges, sur un écrit et un sceau une fois leur authenticité établie, sur l'avis des traçateurs (qafa) concernant la lignée selon les trois imams, sur le tirage au sort et la physionomie, sur l'avis d'experts, sur la continuité d'un État antérieur, sur le serment d'homicide (qasama) et sur la coutume. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1517} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1519} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1520} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1521}"
  ur: "لغت میں اثبات فعل اثبتہ ہے، کسی چیز کو دیرپا، آباد یا درست ماننا۔ فقہاء کے استعمال میں یہ جج کے سامنے، اس کے اجلاس میں، کسی حق یا حقیقت کے جائز ثبوت کا قیام ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1505} اس کا مقصد یہ ہے کہ دعوی کرنے والا اپنا حق حاصل کرے یا مداخلت سے محفوظ رہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 1505} چاروں مکاتب کے اتفاق سے دلیل کا بوجھ دعویٰ کرنے والے پر ہے، اس قول پر: دلیل دعویٰ کرنے والے کے لیے ہے اور قسم انکار کرنے والے کے لیے ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1505} اقرار سب سے مضبوط ثبوت ہے کیونکہ ایک سمجھدار شخص جھوٹا اقرار کرنے کا امکان نہیں رکھتا۔ احناف اور مالکی اسے گواہی سے اوپر رکھتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1508} ایک گواہ پر قسم کے ساتھ فیصلہ کرنا اختلافی ہے: مالک، شافعی اور احمد اس کی اجازت جائیداد اور جو چیز جائیداد میں لے جاتے ہیں، جبکہ احناف اور اکثر عراقی فقہاء اس کا انکار کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1507} احناف، شافعیہ اور حنبلیوں کے نزدیک جھٹلانے والے فریق کی قسم ایک ہی وقت میں تنازعہ کو ختم کر دیتی ہے، لیکن مالکیہ اسے جھگڑا ختم کرنے کے مترادف سمجھتے ہیں۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 1512} قاضی اپنے علم سے فیصلہ کر سکتا ہے، جس کی اجازت حنفیہ صرف لوگوں کے حقوق کے لیے اپنے فیصلے کے وقت اور جگہ کے اندر دیتے ہیں۔ وہ فیصلہ کن حالاتی شواہد پر، ایک جج کے دوسرے کو لکھے گئے خط پر، تحریر اور مہر پر، جب ان کی صداقت محفوظ ہو جائے، تینوں ائمہ کے مطابق نسب کے بارے میں معلوم کرنے والوں کی رائے پر، قرعہ اور فزیوگنومی پر، ماہرین کی رائے پر، سابقہ حالت کے تسلسل پر، حلفِ اقامہ پر، اور رسم و رواج پر۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1517} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1519} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1520} صفحہ 1521}"
  tr: "Dilbilimsel terimlerle, 'onaylama', her zaman sağlam veya geçerli bir şeyi kabul etmek anlamına gelen fiil isimidir. Hukukçuların konuşmasında, yargıcın yargı odasındaki bir hak veya olgu hakkında hukuki delil sunulur. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.1505} Okulların uzlaşmasıyla davacından kanıt istenir; şöyle der: 'Kanıt davacının üzerindedir, yemin ise reddedenin üzerindedir.' {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.1505} Ve itiraf, içinde suçlama olmadığı için en güçlü delildir; Hanafiler ve Malikiler ise tanıklıktan çok bunu önceliklendirir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1508} Tanıklık ve yemin konusunda bir anlaşmazlık vardır: Malik, Al-Shafi'i ve Ahmed mülk ve ona ait olanlar konusunda buna izin verir, ancak Hanafiler ve Irak halkının çoğunluğu bunu yasaklar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1507} Kötülük yemini, Hanefi, Şafii ve Haneli'ye göre anlaşmazlıkları hemen koparır ve Malikilere göre kesin olarak koparılır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.1512} Hakim, yargı dönemindeki Hanafi üyeleri arasındaki bilgisine ve insan hakları hakkındaki yerine, kesin delillerle, hakimin hakime yazdığı mektupla, doğrulama sonrası el yazısı ve mühürlemeyle, üç imamın soy hakkındaki Kafe görüşüyle, uzmanların görüşleriyle, süreklilik varsayımıyla, yemin ve gelenek yoluyla karar verebilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1517} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1519} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.1520} {Cite:Fiqh-Mawsua-Kuwaitiyya-Noor-V3 s.1521}"
  id: "Dalam istilah linguistik, 'afirmasi' adalah kata benda verbal yang berarti selalu menganggap sesuatu yang stabil atau sah. Dalam ucapan ahli hukum, bukti hukum dibuktikan di hadapan hakim di kamar yudisialnya mengenai suatu hak atau fakta. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1505} Bukti diperlukan dari penggugat berdasarkan konsensus dari aliran-aliran tersebut, seperti yang ia katakan: 'Bukti ada pada penggugat, dan sumpah ada pada orang yang menyangkal.' {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1505} Dan pengakuan adalah bukti terkuat karena tidak adanya tuduhan di dalamnya, dan Hanafi serta Maliki mengutamakannya daripada kesaksian. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1508} Dalam putusan mengenai saksi dan sumpah, terdapat perselisihan: Malik, Al-Shafi'i, dan Ahmad mengizinkan mengenai properti dan apa yang menjadi haknya, tetapi Hanafi dan mayoritas rakyat Irak melarangnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1507} Sumpah jahat segera memutus perselisihan menurut Hanafi, Shafi'i, dan Hanbali, dan diputus sepenuhnya menurut Maliki. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1512} Hakim dapat memutuskan berdasarkan pengetahuannya di antara para Hanahi pada masa peradilan dan posisinya mengenai hak asasi manusia, melalui bukti yang meyakinkan, surat hakim kepada hakim, dengan tulisan tangan dan segel setelah verifikasi, berdasarkan pendapat Qafah mengenai garis keturunan menurut tiga Imam, berdasarkan pendapat para ahli, dengan anggapan kesinambungan, sumpah, dan adat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1517} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1519} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.1520} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1521}"
