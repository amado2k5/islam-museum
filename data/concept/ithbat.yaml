label: { ar: "إثبات", en: "Proof in litigation (ithbat)" }
summary:
  ar: "الإثبات في اللغة مصدر أثبت بمعنى اعتبار الشيء دائماً مستقراً أو صحيحاً، وفي كلام الفقهاء إقامة الدليل الشرعي أمام القاضي في مجلس قضائه على حق أو واقعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1505} ويطلب الإثبات من المدعي باتفاق المذاهب، لقوله: البينة على المدعي واليمين على من أنكر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1505} والإقرار أقوى الأدلة لانتفاء التهمة فيه غالباً، والحنفية والمالكية يقدمونه على الشهادة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1508} وفي القضاء بالشاهد واليمين خلاف: يجيزه مالك والشافعي وأحمد في الأموال وما يؤول إليها، ويمنعه الحنفية وجمهور أهل العراق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1507} وحلف المنكر يقطع الخصومة في الحال عند الحنفية والشافعية والحنابلة، ويقطعها مطلقاً عند المالكية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1512} وللقاضي أن يقضي بعلمه عند الحنفية في زمن القضاء ومكانه في حقوق الآدميين، وبالقرينة القاطعة، وبكتاب القاضي إلى القاضي، وبالخط والختم بعد الاستيثاق، وبقول القافة في النسب عند الأئمة الثلاثة، وبقول أهل الخبرة، وبالاستصحاب، وبالقسامة والعرف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1517} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1519} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1520} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1521}"
  en: "Ithbat in the lexicon is the verb athbata, to treat a thing as lasting, settled or sound. In the jurists' usage it is the establishment before the judge, in his session, of a lawful proof of a right or a fact. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1505} Its aim is that the claimant obtains his right or is protected from interference. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1505} The burden of proof lies on the claimant by agreement of the four schools, on the saying: the proof is for the claimant, and the oath is for the one who denies. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1505} Confession is the strongest proof because a sane person is unlikely to confess falsely; the Hanafis and Malikis rank it above testimony. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1508} Judging on one witness with an oath is disputed: Malik, al-Shafi'i and Ahmad allow it in property and what leads to property, while the Hanafis and most Iraqi jurists refuse it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1507} The denying party's oath ends the dispute at once according to the Hanafis, Shafi'is and Hanbalis, but the Malikis treat it as ending the dispute outright. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1512} The judge may rule on his own knowledge, which the Hanafis permit only within the time and place of his judgeship for the rights of people; he may also rule on decisive circumstantial evidence, on a letter from one judge to another, on writing and seal once their authenticity is secure, on the opinion of trackers (qafa) about lineage according to the three imams, on lots and physiognomy, on the opinion of experts, on continuity of an earlier state, on the oath of homicide (qasama), and on custom. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1517} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1519} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1520} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1521}"
