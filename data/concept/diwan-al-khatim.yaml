label: { ar: "ديوان الخاتم" }
summary:
  ar: "أول من اتخذ ديوان الخاتم معاوية وولاه عبيد الله بن أوس الغساني وسلم إليه الخاتم وعلى فصه لكل عمل ثواب، وسبب اتخاذه أنه أمر لرجل بمئة ألف ففك الكتاب وجعله مئتي ألف فلما رفع الحساب أنكر فاتخذ ديوان الخاتم من يومئذ يختم به الكتب حتى لا تفك ولا تزاد، واستمر ذلك في الخلفاء العباسيين إلى آخر وقتهم {cite:tarikh-khulafa-minhaj-1434 p. 332}."
  en: "The seal registry: Mu'awiya was the first to institute it, appointing Ubayd Allah ibn Aws al-Ghassani and handing him the seal, whose bezel read 'for every deed a recompense'. Its occasion was a warrant for one hundred thousand which a man unsealed and raised to two hundred thousand; when the account came up and Mu'awiya disavowed it he established the diwan al-khatim thenceforth, sealing letters so they could neither be opened nor padded — a practice that lasted among the Abbasid caliphs to their last days {cite:tarikh-khulafa-minhaj-1434 p. 332}."
