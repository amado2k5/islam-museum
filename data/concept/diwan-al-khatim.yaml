label: { ar: "ديوان الخاتم", en: "Diwan al-Khatim (the seal registry)", ur: "دیوان الخاتم، مہر کا دفتر", es: "Diwan al-Khatim (el registro de sellos)", fr: "Diwan al-Khatim (le registre des sceaux)" }
summary:
  ur: "سیوطی عسکری سے معاویہ کے مہر کے دفتر، عبیداللہ بن اوس الغسانی کی تقرری اور نامعلوم شخص کے100000کو200000کرنے کا قصہ نقل کرتے ہیں؛ یہ ضبط کی غرض کا ادبی بیان ہے، ہر تحریف ناممکن ہونے کا ثبوت نہیں {cite:tarikh-khulafa-minhaj-1434 p.332}۔"
  ar: "أول من اتخذ ديوان الخاتم معاوية وولاه عبيد الله بن أوس الغساني وسلم إليه الخاتم وعلى فصه لكل عمل ثواب، وسبب اتخاذه أنه أمر لرجل بمئة ألف ففك الكتاب وجعله مئتي ألف فلما رفع الحساب أنكر فاتخذ ديوان الخاتم من يومئذ يختم به الكتب حتى لا تفك ولا تزاد، واستمر ذلك في الخلفاء العباسيين إلى آخر وقتهم {cite:tarikh-khulafa-minhaj-1434 p. 332}."
  en: "The seal registry: Mu'awiya was the first to institute it, appointing Ubayd Allah ibn Aws al-Ghassani and handing him the seal, whose bezel read 'for every deed a recompense'. Its occasion was a warrant for one hundred thousand which a man unsealed and raised to two hundred thousand; when the account came up and Mu'awiya disavowed it he established the diwan al-khatim thenceforth, sealing letters so they could neither be opened nor padded — a practice that lasted among the Abbasid caliphs to their last days {cite:tarikh-khulafa-minhaj-1434 p. 332}."
  es: "El registro de sellos: Mu'awiya fue el primero en instituirlo, nombrando a Ubayd Allah ibn Aws al-Ghassani y entregándole el sello, cuyo bisel decía \"por cada acción, una recompensa\". Su origen fue una orden de pago de cien mil que un hombre abrió y elevó a doscientos mil; cuando se presentó la cuenta y Mu'awiya la desautorizó, estableció a partir de entonces el diwan al-khatim, sellando las cartas para que no pudieran ser abiertas ni manipuladas, una práctica que perduró entre los califas abasíes hasta sus últimos días {cite:tarikh-khulafa-minhaj-1434 p. 332}."
  fr: "Le registre des sceaux: Mu'awiya fut le premier à l'instituer, nommant Ubayd Allah ibn Aws al-Ghassani et lui remettant le sceau, dont le sceau portait l'inscription « pour chaque acte une récompense ». Son origine fut un mandat de cent mille qu'un homme descella et porta à deux cent mille; lorsque les comptes furent rendus et que Mu'awiya le désavoua, il établit dès lors le diwan al-khatim, scellant les lettres afin qu'elles ne puissent être ni ouvertes ni masquées – une pratique qui perdura parmi les califes abbassides jusqu'à leur mort {cite:tarikh-khulafa-minhaj-1434 p. 332}."
