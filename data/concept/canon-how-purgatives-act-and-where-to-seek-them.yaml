id: concept/canon-how-purgatives-act-and-where-to-seek-them
class: concept
kind: scientific
label:
  ar: "كيف تسهل الأدوية وأين تطلب عند ابن سينا"
  en: "How purgatives act and where to seek them in the Canon"
  fr: "Modes d’action et recherche des purgatifs dans le Canon"
  ur: "مسہل دوائیں کیسے عمل کرتی ہیں اور کہاں ملیں گی، قانون میں"
  es: "Cómo actúan los purgantes y dónde buscarlos en el Canon"
summary:
  ar: "يقسم ابن سينا طرق الإسهال بالتحليل كالتربد والعصر كالهليلج والتليين كالشير خشك والإزلاق كلعاب بزرقطونا والإجاص، ويذكر أن المرارة والحرافة تعينان على التحليل والعفوصة على العصر والحموضة على التقطيع، ويحيل أنواع المسهلات الشرابية والممروخة إلى القراباذين وإصلاح المفردات إلى كتاب المفردات {cite:canon-ibn-sina-print-v1 p.285}."
  en: "Ibn Sina divides the ways a drug purges into dissolving, as turbith does, squeezing, as myrobalan does, softening, as shir khusk does, and slipping, as psyllium mucilage and the plum do, notes that bitterness, pungency and astringency help each, and refers the many purgative and softening preparations to the pharmacopoeia and the correction of single drugs to the book on single drugs {cite:canon-ibn-sina-print-v1 p.285}."
  fr: "Ibn Sina distingue résolution, comme le turbit, pression, comme le myrobolan, ramollissement, comme le shir khusk, et glissement, comme mucilage de psyllium et prune ; amertume, piquant et astringence les aideraient. Préparations renvoyées à la pharmacopée, correction des simples à leur livre {cite:canon-ibn-sina-print-v1 p.285}."
  es: "Ibn Sina divide las formas en que un medicamento purga en disolución, como lo hace el turbith, compresión, como lo hace el mirobalán, ablandamiento, como lo hace el shir khusk, y deslizamiento, como lo hacen el mucílago de psyllium y la ciruela, señala que el amargor, el picor y la astringencia ayudan a cada uno, y remite las numerosas preparaciones purgantes y suavizantes a la farmacopea y la corrección de medicamentos individuales al libro sobre medicamentos individuales {cite:canon-ibn-sina-print-v1 p.285}."
