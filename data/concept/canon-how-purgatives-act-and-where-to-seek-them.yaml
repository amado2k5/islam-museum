summary:
  ar: "يقسم ابن سينا طرق الإسهال بالتحليل كالتربد والعصر كالهليلج والتليين كالشير خشك والإزلاق كلعاب بزرقطونا والإجاص، ويذكر أن المرارة والحرافة تعينان على التحليل والعفوصة على العصر والحموضة على التقطيع، ويحيل أنواع المسهلات الشرابية والممروخة إلى القراباذين وإصلاح المفردات إلى كتاب المفردات {cite:canon-ibn-sina-print-v1 p.285}."
  en: "Ibn Sina divides the ways a drug purges into dissolving, as turbith does, squeezing, as myrobalan does, softening, as shir khusk does, and slipping, as psyllium mucilage and the plum do, notes that bitterness, pungency and astringency help each, and refers the many purgative and softening preparations to the pharmacopoeia and the correction of single drugs to the book on single drugs {cite:canon-ibn-sina-print-v1 p.285}."
