id: concept/al-muallafa-qulubuhum
class: concept
kind: legal
label: { ar: "المؤلفة قلوبهم", en: "Reconciliation of hearts (al-mu'allafa qulubuhum)", fr: "La réconciliation des cœurs (al-mu'allafa qulubuhum)", es: "Reconciliación de corazones (al-mu'allafa qulubuhum)" }
summary:
  ar: "صنف من مستحقي الزكاة والفيء في الشريعة الإسلامية شُرع لتأليف القلوب ودفع الشقاق عن الجماعة المسلمة؛ برز تطبيقه النبوي الواسع بالجعرانة حين خص النبي سادات قريش ورؤساء قبائل نجد بعطايا جزيلة لتثبيت إسلامهم."
  en: "A legal category of recipients of zakat and spoils established in Islamic law to reconcile hearts to the faith and cement communal stability; widely applied by the Prophet at al-Ji'rana through major grants of camels and silver to Meccan and Najdi tribal chiefs."
  fr: "Catégorie juridique de bénéficiaires de la zakat et du butin, instituée par le droit islamique pour rallier les cœurs à la foi et consolider la stabilité de la communauté. Le Prophète en a fait une large application à al-Ji'rana, en accordant d'importants dons de chameaux et d'argent aux chefs de tribus de La Mecque et du Najd."
  es: "Una categoría legal de receptores de zakat y botín establecida en la ley islámica para reconciliar los corazones con la fe y consolidar la estabilidad comunitaria; ampliamente aplicada por el Profeta en al-Ji'rana a través de importantes donaciones de camellos y plata a los jefes tribales de La Meca y Najd."
