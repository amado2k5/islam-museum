summary:
  ar: "صنف من مستحقي الزكاة والفيء في الشريعة الإسلامية شُرع لتأليف القلوب ودفع الشقاق عن الجماعة المسلمة؛ برز تطبيقه النبوي الواسع بالجعرانة حين خص النبي سادات قريش ورؤساء قبائل نجد بعطايا جزيلة لتثبيت إسلامهم."
  en: "A legal category of recipients of zakat and spoils established in Islamic law to reconcile hearts to the faith and cement communal stability; widely applied by the Prophet at al-Ji'rana through major grants of camels and silver to Meccan and Najdi tribal chiefs."
