id: concept/nasab-al-iman
class: concept
kind: doctrine
label:
  ar: "نسب الإيمان لا نسب الدم"
  en: "Lineage of faith, not of blood"
summary:
  ar: "يرى الشعراوي أن نسب الأنبياء نسب منهج واتباع لا نسب دم أو جنس أو مكان، وأن كل نفس بما كسبت، فلا يشفع نسب اليهود إلى إبراهيم وإسحاق ويعقوب، وأن ذرية المؤمنين تُلحق بآبائهم بفضل الله دون نقص من عملهم. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.621}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.622}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.602}"
  en: "Sha'rawi holds that the lineage of prophets is a lineage of method and following, not of blood, race or place, that each soul answers for what it earned, so a claim of descent from Abraham, Isaac or Jacob does not intercede for the People of the Book, and that the descendants of believers are joined to their fathers by God's grace without any loss to the fathers' deeds {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.621}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.622}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.602}."
wings: [ideas]
themes: [creed, prophets]
periods: [period/prophetic-era]
regions: [arabia]
issue:
  ar: "هل ينفع النسب إلى الأنبياء من لم يتبع منهجهم، وهل تنال الذرية درجة الآباء بغير عمل؟"
  en: "Does descent from the prophets benefit someone who does not follow their way, and can descendants reach their fathers' rank without deeds of their own?"
perspectives:
  - tradition: sunni
    id: sharawi-lineage-of-faith
    stance:
      ar: "النسب إلى الأنبياء نسب إيمان ومنهج، وكل نفس بما كسبت، وإلحاق الذرية بفضل الله"
      en: "Descent from the prophets is a lineage of faith and method; each soul answers for what it earned; the descendants are joined by God's grace"
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يذكر الشعراوي أن اليهود إن نسبوا أنفسهم إلى إبراهيم وإسحاق ويعقوب فلن ينفعهم النسب، لأن نسب النبوة إيماني يقوم على الاتباع والعقيدة، ويرى أن الإلحاق بالذرية المؤمنة تكريم لعمل الآباء لا زيادة في عمل الأبناء، ويفرّق بين العدل في الآية [[passage/quran-53-39|39 من النجم]] والفضل الذي يعطيه الله لمن يشاء. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.621}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.622}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.602}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.603}"
      en: "Sha'rawi says that if the Jews claim descent from Abraham, Isaac and Jacob, the claim will not help them, because prophetic lineage is a lineage of faith resting on following and creed. He holds that joining believing descendants to the fathers honours the fathers' deeds rather than adding to the children's deeds, and distinguishes the justice of [[passage/quran-53-39|53:39]] from the grace God gives whom He wills {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.621}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.622}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.602}{cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.603}."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
  - tradition: sunni
    id: scope-note-other-readings
    stance:
      ar: "أقوال المفسرين في نسب الذرية والرأي الأكاديمي لم تُدخل في هذه الدفعة"
      en: "Other exegetes' readings of the lineage of descendants and the academic view are not entered in this batch"
    holders: []
    summary:
      ar: "لم تُدخل هنا أحكام النسب في الفقه، ولا أقوال غير الشعراوي في معنى الإلحاق بالذرية، ولا الرأي الأكاديمي، ولا الآراء الأخرى. {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.603}"
      en: "Legal rulings on lineage, other exegetes' readings of the joining of descendants, the academic view and other views are not entered here {cite:tafsir-sharawi-khawatir-scan-pp-501-1000 p.603}."
    sources: [source/tafsir-sharawi-khawatir-scan-pp-501-1000]
