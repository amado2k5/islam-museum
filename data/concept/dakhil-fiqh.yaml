id: concept/dakhil-fiqh
class: concept
kind: legal
label:
  ar: الداخل في الفقه
  en: Al-Dakhil in fiqh (possessor in dispute)
  ur: الداخل فقہ میں
summary:
  ar: 'الداخل في اصطلاح الفقهاء واضع اليد على العين المتنازع فيها بالفعل أو من ثبت تصرفه تصرف الملاك، ويقابله الخارج وهو من لا شيء في يده وينازع الداخل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8040} والأصل في الدعوى أن الخارج هو المدعي والداخل هو المدعى عليه لأن الداخل لا يحتاج إلى الدعوى لوجود العين في يده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8040} وفي دعوى الملك المطلق عند إقامة البينة من الطرفين يقضى ببينة الخارج عند الحنفية والمشهور عند الحنابلة وابن الماجشون من المالكية لأن بينة المدعي تفيد سببا لم يكن، بينما رجح الشافعية والمشهور عند المالكية ورواية عند الحنابلة بينة الداخل لترجحها باليد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8041}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8042} وفي الملك المضاف إلى سبب تقدم بينة الداخل إن كان السبب غير قابل للتكرار كالنتاج باتفاق، فإن كان متكررا كالشراء رجح الحنفية الخارج إلا إن ادعيا الشراء من شخص واحد فرجح الداخل، وعند المالكية والشافعية يقدم الداخل في الأصح إلا إن ادعى الخارج الشراء من الداخل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8042}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8043} وفي الملك المؤرخ يقدم الأسبق تاريخا عند الحنفية والمالكية ورواية للحنابلة، بينما يقدم الشافعية الداخل ولو تأخر تاريخه في المذهب ترجيحا لليد الحالية، وللحنابلة رواية بتقديم الخارج مطلقا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8043}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8044}'
  en: 'Al-dakhil in the terminology of the jurists is the possessor who actually holds the disputed object or whose exercise of owners'' disposal is established, contrasted with al-kharij (the outsider) who holds nothing and disputes the possessor. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8040} The default principle in litigation is that the outsider is the plaintiff and the possessor is the defendant, since the possessor has no need to sue while holding the object. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8040} When both parties produce evidence for an absolute claim of ownership, the outsider''s evidence is preferred by the Hanafis, the prevalent Hanbali view, and Ibn al-Majishun of the Malikis because the plaintiff''s evidence proves a new cause, whereas the Shafi''is, the prevalent Maliki view, and a Hanbali narration give precedence to the possessor''s evidence because it is strengthened by possession. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8041}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8042} In ownership attributed to a specific cause, the possessor''s evidence is preferred if the cause is non-repeatable such as birth or breeding; if repeatable such as purchase, Hanafis prefer the outsider unless both claim purchase from the same person where the possessor prevails, while Malikis and Shafi''is prefer the possessor on the soundest view unless the outsider claims purchase from the possessor himself. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8042}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8043} In dated ownership evidence, the earlier date takes precedence according to Hanafis, Malikis, and a Hanbali narration, whereas Shafi''is prefer the possessor even if his date is later on the relied-upon position to uphold present possession, and a Hanbali narration gives precedence to the outsider without regard to date. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8043}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8044}'
  ur: 'فقہاء کی اصطلاح میں الداخل سے مراد متنازع شے پر بالفعل قابض یا جس کا مالکانہ تصرف ثابت ہو، اور اس کے مقابلے میں الخارج ہے جو کسی چیز پر قابض نہیں اور الداخل سے تنازع کرتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8040} دعویٰ میں اصل یہ ہے کہ خارج مدعی ہوتا ہے اور داخل مدعی علیہ کیونکہ شے ہاتھ میں ہونے کے باعث داخل کو دعویٰ کی ضرورت نہیں ہوتی۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8040} دعویٰ ملک مطلق میں دونوں جانب سے بینہ قائم ہونے پر حنفیہ، مشہور حنبلی مذہب اور ابن الماجشون کے نزدیک خارج کی بینہ کو ترجیح دی جاتی ہے کیونکہ مدعی کا بینہ ایک نیا سبب ثابت کرتا ہے، جبکہ شافعیہ، مشہور مالکی اور ایک حنبلی روایت کے مطابق داخل کی بینہ کو قبضہ کی قوت کی بنا پر ترجیح ملتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8041}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8042} کسی سبب کی طرف منسوب ملکیت میں اگر سبب ناقابل تکرار ہو جیسے جانور کی پیدائش تو بالاتفاق داخل کی بینہ مقدم ہے؛ اور اگر قابل تکرار ہو جیسے خریداری تو حنفیہ خارج کو ترجیح دیتے ہیں مگر جب دونوں ایک ہی شخص سے خریداری کا دعویٰ کریں تو داخل مقدم ہے، اور مالکیہ و شافعیہ کے اصح قول میں داخل مقدم ہے سوائے اس کے کہ خارج داخل ہی سے خریداری کا مدعی ہو۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8042}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8043} تاریخ کے ساتھ ملکیت کے بینہ میں حنفیہ، مالکیہ اور ایک حنبلی روایت کے نزدیک سابقہ تاریخ مقدم ہوتی ہے، جبکہ شافعیہ کے نزدیک مذہب میں موجودہ قبضہ کو قائم رکھنے کے لیے داخل کو ترجیح حاصل ہے اگرچہ اس کی تاریخ متاخر ہو، اور حنابلہ کی ایک روایت میں تاریخ کا لحاظ کیے بغیر خارج کو ترجیح دی جاتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8043}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8044}'
