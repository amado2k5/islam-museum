id: concept/adhan-fiqh
class: concept
kind: legal
label:
  ar: "أذان"
  en: "Adhan (the call to prayer: its ruling, wording, conditions, recommended features and the muezzin)"
  ur: "اذان (نماز کی اطلاع: حکم، الفاظ، شرائط، سنتیں اور مؤذن کی صفات)"
summary:
  ar: "الأذان في الشرع الإعلام بوقت الصلاة المفروضة بألفاظ معلومة مأثورة. اختلف الفقهاء في حكمه بين فرض كفاية وسنة مؤكدة، واختلفوا في ألفاظه وترجيعه وتثويبه وفي شروطه كالترتيب والموالاة ورفع الصوت، وفي صفات المؤذن كالإسلام والذكورة والعقل والتمييز. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2006} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2007} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2009} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2013} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2016}"
  en: "In law, the adhan is announcing the time of an obligatory prayer in set, transmitted words. The jurists differ on its ruling, between a communal obligation and a strongly recommended practice, and on its wording, tarjia, tathwib, the conditions of order, continuity and raised voice, and the qualities of the muezzin: Islam, manhood, sanity and discernment. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2006} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2007} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2009} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2013} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2016}"
  ur: "شریعت میں اذان سے مراد مقررہ اور منقول الفاظ کے ساتھ فرض نماز کے وقت کی اطلاع دینا ہے۔ فقہاء کا اس کے حکم میں اختلاف ہے (فرضِ کفایہ یا سنتِ مؤکدہ)، اور الفاظ، ترجیع، تثویب، ترتیب، موالات، بلند آواز اور مؤذن کی صفات (اسلام، مرد ہونا، عقل اور تمیز) میں بھی اختلاف ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2006} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2007} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2009} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2013} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2016}"
