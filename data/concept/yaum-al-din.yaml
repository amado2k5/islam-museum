summary:
  ar: "يوم الدين في القرآن والسنة: اليوم الذي يُدين فيه الله العباد بأعمالهم، يذكر أنه من أشراط الساعة، وأن فيه من الفزع ما لا يوصف، وأن الله يحكم بالعدل."
  en: "The Day of Religion in Qur'an and Sunnah: the day God judges His servants by their deeds — a sign of the Hour, a day of indescribable terror, when God rules with justice."
  ur: "یوم الدین قرآن و سنت میں: وہ دن جب اللہ بندوں کو ان کے اعمال پر فیصلہ کرتا ہے — ساعت کی نشانیوں میں سے، ایک ایسا دن جس کا خوف بیان نہیں کیا جا سکتا، جب اللہ عدل سے فیصلہ کرتا ہے۔"
