id: concept/riwayat-al-hadith-bil-maana
class: concept
kind: term
label:
  ar: رواية الحديث بالمعنى
  en: Transmitting a hadith by its meaning (riwaya bil-maana)
  es: "Transmitir un hadiz por su significado (riwaya bil-maana)"
  fr: "Transmettre un hadith par son sens (riwaya bil-maana)"
  ur: "حدیث کو اس کے معنی سے منتقل کرنا"
  tr: "Hadisin anlamıyla anlatılması"
  id: "Menceritakan hadis dalam makna"
summary:
  ar: "اختلف الصحابة والتابعون في رواية الحديث بالمعنى، فمنعها بعضهم وأبى أن يروي إلا بلفظ ما سمع، وأجازها آخرون {cite:makanat-al-sunna-azhar p. 80}. ومن حجة المجيزين أن النبي كان يشرّع في كل الأحوال والأمكنة، ولم يكن ممكنًا أن يحضره في كل وقت من يحفظ لفظه، وأن الناس يحتاجون إلى إبلاغ ما شُرع، وأن النبي أرسل رسله وسفراءه فيترجمون رسائله بالمعنى مع المحافظة عليه، وأن ابن سيرين كان يسمع الحديث عن عشرة مختلفين في اللفظ والمعنى واحد {cite:makanat-al-sunna-azhar p. 81}{cite:makanat-al-sunna-azhar p. 82}. ومن شروط الجواز عندهم أن يكون الراوي ثقة في دينه، عاقلًا بما يحدّث به، عالمًا بمعاني الألفاظ ولغات العرب وأساليبها، فإن لم تتوافر فيه هذه الشروط تعيّن أداء اللفظ {cite:makanat-al-sunna-azhar p. 83}. ويرى المؤلف أن احتمال الخطأ في المعنى مع توافر الشروط أمر موهوم لا يُعتد به، وأن تعدد طرق الحديث يؤمن من الخطأ في المعنى، فيبقى الظن بصحة الرواية راجحًا ويجب العمل به {cite:makanat-al-sunna-azhar p. 83}{cite:makanat-al-sunna-azhar p. 79}."
  tr: "Sahabeler ve Müripler hadisin anlamı konusunda farklı görüşler yaşamıştır; bazıları hadisi yasaklamış ve sadece duydukları ifadeyle rivayet etmeyi reddetmiş, bazıları ise izin vermiştir {atıf:makanat-al-sunna-azhar s. 80}. İzin veren rivayetçilerin argümanları arasında, Peygamber'in her durumda ve yerde kanun çıkardığı ve birinin onun sözlerini ezberleyip her zaman orada bulunamayacağı belirtilmiştir. İnsanların onun verdiğini iletmesi gerekiyordu; Peygamber'in mesajlarını anlamlı şekilde çevirmek için elçilerini ve elçilerini gönderdiği, İbn Sirin'in ise aynı ifade ve anlamda on farklı kişinin hadislerini duyduğu {atı:makanat-al-sunna-azhar s. 81} {cite:makanat-al-sunna-azhar s. 82}. Bunlara göre kabul edilebilirlik koşullarından biri, anlatıcının dininde güvenilir, söylediklerinde mantıklı olması ve kelimelerin, Arapça dillerinin ve üsluplarının anlamları hakkında bilgi sahibi olmasıdır. Bu koşullar sağlanmazsa, kelimenin telaffuzu {cite:makanat-al-sunna-azhar, s. 83} şeklinde telaffuz edilmelidir. Yazar, koşullar altında anlam hatası olasılığının makul olmadığını ve güvenilir olmadığını ve hadis zincirlerinin çeşitliliğinin anlam hatalarına karşı koruma sağladığını düşünür; bu nedenle rivayetin özgünlüğü varsayımı daha güçlü kalır ve buna göre hareket edilmelidir {cite:makanat-al-sunna-azhar s. 83}{cite:makanat-al-sunna-azhar s. 79}}."
  id: "Para Sahabat dan Pengikut berbeda pendapat mengenai makna narasi hadis; beberapa melarangnya dan menolak menceritakan kecuali dengan kata-kata yang mereka dengar, sementara yang lain mengizinkannya {cite:makanat-al-sunna-azhar hlm. 80}. Salah satu argumen para narator permisif adalah bahwa Nabi biasa membuat undang-undang dalam segala keadaan dan tempat, dan tidak mungkin seseorang menghafal kata-katanya untuk hadir setiap saat. Orang-orang perlu menyampaikan apa yang dia undang-undangkan, dan bahwa Nabi mengirim utusan dan utusannya untuk menerjemahkan pesannya dalam makna sambil mempertahankannya, dan bahwa Ibn Sirin mendengar hadits dari sepuluh orang berbeda dalam kata-kata dan makna yang sama {cite:makanat-al-sunna-azhar hlm. 81} {cite:makanat-al-sunna-azhar hlm. 82}. Di antara syarat kelayakan menurut mereka adalah narator harus dapat dipercaya dalam agamanya, rasional dalam apa yang dikatakan, dan memahami makna kata-kata, bahasa Arab, dan gayanya. Jika syarat-syarat ini tidak terpenuhi, pengucapan kata harus diucapkan {cite:makanat-al-sunna-azhar, hlm. 83}. Penulis percaya bahwa kemungkinan kesalahan dalam makna, dengan syarat-syaratnya, adalah tidak masuk akal dan tidak dapat diandalkan, dan bahwa beragam rantai hadits melindungi dari kesalahan makna, sehingga asumsi keaslian narasi tetap lebih kuat dan harus ditindaklanjuti {cite:makanat-al-sunna-azhar hlm. 83}{cite:makanat-al-sunna-azhar hlm. 79}."
