id: concept/riwayat-al-hadith-bil-maana
class: concept
kind: term
label:
  ar: رواية الحديث بالمعنى
  en: Transmitting a hadith by its meaning (riwaya bil-maana)
summary:
  ar: "اختلف الصحابة والتابعون في رواية الحديث بالمعنى، فمنعها بعضهم وأبى أن يروي إلا بلفظ ما سمع، وأجازها آخرون {cite:makanat-al-sunna-azhar p. 80}. ومن حجة المجيزين أن النبي كان يشرّع في كل الأحوال والأمكنة، ولم يكن ممكنًا أن يحضره في كل وقت من يحفظ لفظه، وأن الناس يحتاجون إلى إبلاغ ما شُرع، وأن النبي أرسل رسله وسفراءه فيترجمون رسائله بالمعنى مع المحافظة عليه، وأن ابن سيرين كان يسمع الحديث عن عشرة مختلفين في اللفظ والمعنى واحد {cite:makanat-al-sunna-azhar p. 81}{cite:makanat-al-sunna-azhar p. 82}. ومن شروط الجواز عندهم أن يكون الراوي ثقة في دينه، عاقلًا بما يحدّث به، عالمًا بمعاني الألفاظ ولغات العرب وأساليبها، فإن لم تتوافر فيه هذه الشروط تعيّن أداء اللفظ {cite:makanat-al-sunna-azhar p. 83}. ويرى المؤلف أن احتمال الخطأ في المعنى مع توافر الشروط أمر موهوم لا يُعتد به، وأن تعدد طرق الحديث يؤمن من الخطأ في المعنى، فيبقى الظن بصحة الرواية راجحًا ويجب العمل به {cite:makanat-al-sunna-azhar p. 83}{cite:makanat-al-sunna-azhar p. 79}."
