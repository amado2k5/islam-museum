label:
  ar: "قروح العين"
  en: "Ulcers of the eye"
  ur: "آنکھ کے قرحے"
  es: "Úlceras oculares"
  fr: "Ulcères de l'œil"
  tr: "Göz yaraları"
  id: "Luka mata"
summary:
  ar: "قروح العين تتولد في الأكثر عن أخلاط حادة محرقة وهي سبعة أنواع: أربعة في سطح القرنية يسميها جالينوس قروحاً — الخفي أو القتام ثم السحاب ثم الإكليلي على إكليل السواد ثم الاحتراقي الصوفي — وثلاثة غائرة: لوبويون العميق الضيق النقي ولوبوما الأوسع الأقل عمقاً وأوقوما الوسخة ذات الخشكريشة التي في تنقيتها مخاطرة، وتحدث عقيب الرمد داخل فينفجر إلى خارج أو بالعكس {cite:canon-ibn-sina-print-v2 p.177}"
  en: "The eye's ulcers are mostly bred by sharp burning humours and are seven kinds: four in the cornea's surface which Galen calls ulcers — the dim or smoke-like, then the cloud, then the coronal on the circle of the black, then the burning wool-like one; and three deep ones: lopoyon, deep narrow and clean; lopoma, wider and less deep; and uquma, dirty and rough, whose cleansing is risky; they arise after ramad, bursting outward or the reverse {cite:canon-ibn-sina-print-v2 p.177}"
  ur: "آنکھ کے قرحے اکثر تیز جلانے والے اخلاط سے پیدا ہوتے ہیں اور سات قسم کے ہیں: قرنیہ کی سطح پر چار جنھیں جالینوس قرحے کہتا ہے — دھندلا یا دھواں جیسا، پھر بادل، پھر سیاہی کے دائرے پر ایکلیلی، پھر جلتا اونی؛ اور تین گہرے: لوپویون گہرا تنگ صاف، لوپوما چوڑا کم گہرا، اور اوقوما میلا کھردرا جس کی صفائی میں خطرہ ہے؛ یہ رمد کے بعد پیدا ہوتے ہیں، باہر پھٹ کر یا اس کے برعکس {cite:canon-ibn-sina-print-v2 p.177}"
  es: "Las úlceras oculares se originan principalmente por humores ardientes y son de siete tipos: cuatro en la superficie de la córnea que Galeno llama úlceras: la tenue o humeante, la nubosa, la coronal en el círculo negro y la ardiente y lanosa; y tres profundas: lopoyon, profunda, estrecha y limpia; lopoma, más ancha y menos profunda; y uquma, sucia y áspera, cuya limpieza es arriesgada; aparecen después del ramad, estallando hacia afuera o viceversa {cite:canon-ibn-sina-print-v2 p.177}"
  fr: "Les ulcères de l'œil sont principalement causés par des humeurs brûlantes et aiguës et se présentent sous sept formes: quatre à la surface de la cornée, que Galien appelle ulcères — l'ulcère opaque ou fumé, puis l'ulcère nuageux, puis l'ulcère coronaire sur le cercle noir, puis l'ulcère brûlant et laineux; et trois ulcères profonds: lopyon, profond, étroit et propre; lopoma, plus large et moins profond; et uquma, sale et rugueux, dont le nettoyage est risqué; ils apparaissent après ramad, éclatant vers l'extérieur ou inversement {cite:canon-ibn-sina-print-v2 p.177}"
  tr: "Göz ülserleri çoğunlukla keskin, yanıcı humorlardan kaynaklanır ve yedi tiptir: kornea yüzeyinde dördü yara adı verilen yaralar — gizli veya koyu, sonra bulutlu, ardından siyah tepede koroner, ardından yanıcı yünlü — ve üçü derin: derin, dar, saf loboinler, daha geniş, sığ lobomalar ve içeride konjonktivit sonrası ortaya çıkıp dışa doğru patlayan veya tam tersi tehlikeli temizlenmesi tehlikeli kirli hücreler {cite:canon-ibn-sina-print-v2 s.177}"
  id: "Luka mata sebagian besar berasal dari humor tajam yang terbakar dan terdiri dari tujuh jenis: empat di permukaan kornea yang disebut luka — tersembunyi atau gelap, lalu keruh, kemudian koroner di mahkota hitam, kemudian wol yang mudah terbakar — dan tiga yang dalam: loboin dalam, sempit, murni, loboma yang lebih lebar dan dangkal, serta sel kotor dengan bahaya yang berbahaya untuk dibersihkan, yang terjadi setelah konjungtivitis di dalam dan kemudian meletus keluar atau sebaliknya {cite:canon-ibn-sina-print-v2 hlm.177}"
