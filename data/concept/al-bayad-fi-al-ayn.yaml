id: "concept/al-bayad-fi-al-ayn"
class: "concept"
kind: "scientific"
label:
  ar: "البياض في العين"
  en: "Whiteness in the eye (ghamam and leucoma)"
  ur: "آنکھ میں سفیدی"
summary:
  ar: "البياض في العين منه رقيق حادث في السطح الخارج يسمى الغمام ومنه غليظ يسمى البياض مطلقاً، وكلاهما يحدثان عن اندمال القرحة أو البثرة إذا انفجرت واندملت؛ فالرقيق الحادث في الأبدان الناعمة يدام تبخيره بالمياه الحارة والاستحمام بالماء الحار ثم يستعمل اللحس دائماً، والمزمن الغليظ يستعمل تليينه بالتبخيرات والاستحمامات والشيافات المدوفة في ماء الورد أو ماء الملح الأندراني مكتحلاً بها في الحمام، وقد تستعمل أصباغ بصبغ البياض ⁦(أسماء الأدوية والأصباغ ونسخها لا تحمل)⁩ {cite:canon-ibn-sina-print-v2 p.184} {cite:canon-ibn-sina-print-v2 p.185}"
  en: "Of the whiteness in the eye, the thin occurring on the outer surface is called ghamam and the thick is called whiteness absolutely; both arise upon the healing of an ulcer or pustule that burst and healed. The thin recent one in soft bodies is kept steamed with hot waters and hot bathing, then licking remedies are always used; the chronic thick one is softened with the said steamings and baths and the collyria triturated in rose-water or dissolved Andarani salt-water, applied as kohl in the bath; dyes of the whiteness are also used ⁦(drug and dye names and recipes are not carried)⁩ {cite:canon-ibn-sina-print-v2 p.184} {cite:canon-ibn-sina-print-v2 p.185}"
  ur: "آنکھ کی سفیدی میں سے پتلی جو بیرونی سطح پر ہو اسے غمام کہتے ہیں اور موٹی کو مطلق سفیدی؛ اور دونوں کسی قرحہ یا بثر کے پھٹ کر بھر جانے سے ہوتی ہیں۔ پتلی نئی جو نرم بدنوں میں ہو اس پر گرم پانیوں کی بخاری اور گرم پانی سے غسل جاری رہتا ہے پھر چاٹنے والی ادویہ ہمیشہ استعمال ہوتی ہیں؛ مزمن موٹی کی نرمی انہی بخاریوں اور غسلوں سے اور گلاب کے پانی یا انجرانی نمک کے گھلے پانی میں مدوف شیافوں سے ہوتی ہے جن سے حمام میں سرمہ لگایا جاتا ہے؛ اور سفیدی پر رنگنے کی صبغیں بھی استعمال ہوتی ہیں ⁦(ادویہ اور صبغوں کے نام اور نسخے منقول نہیں)⁩ {cite:canon-ibn-sina-print-v2 p.184} {cite:canon-ibn-sina-print-v2 p.185}"
