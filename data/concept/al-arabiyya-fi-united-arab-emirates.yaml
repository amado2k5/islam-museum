id: concept/al-arabiyya-fi-united-arab-emirates
class: concept
kind: term
tags: [arabiyya-browser, arabiyya-world]
label:
  ar: "العربية في الإمارات"
  en: "Arabic in the United Arab Emirates"
  ur: "متحدہ عرب امارات میں عربی"
  fr: "L'arabe aux Émirats arabes unis"
  es: "El árabe en los Emiratos Árabes Unidos"
  tr: "BAE'de Arapça"
  id: "Bahasa Arab di UEA"
summary:
  ar: "ما وُجد عن العربية في الإمارات العربية المتحدة: نص المادة 7 من الدستور كما يعرضه Constitute، وعبارة دراسة مكتبة الكونغرس عن نسبة العرب عرقاً، وما تضعه الشجرة والتصنيفات الجغرافية، مع بيان أنه لم يُعثر على وصف للهجة إماراتية ولا على نسب لغات. وأُضيف نص الحكم الدستوري بلغته الأصلية كما ورد في ملخص بحثي لم يتحقق المتحف منه على الصفحة."
  en: "What was found on Arabic in the United Arab Emirates: the text of Article 7 of the Constitution as the Constitute Project shows it, the Library of Congress study's figure for ethnic Arabs, and what the classification tree and geographical groupings give, with a statement that no description of an Emirati dialect and no language shares were found. The constitutional text is added in its original wording, as supplied in a research summary that the museum did not check against the page."
  ur: "متحدہ عرب امارات میں عربی کے بارے میں جو ملا: دستور کی دفعہ 7 کا متن جیسا Constitute دکھاتا ہے، لائبریری آف کانگریس کی تحقیق کا نسلی عربوں کا تناسب، اور شجرہ اور جغرافیائی گروہ بندیاں کیا دیتی ہیں، اور یہ بیان کہ اماراتی بولی کا کوئی بیان اور زبانوں کے تناسب نہیں ملے۔ آئینی حکم کی عبارت اصل زبان میں شامل کی گئی ہے، جیسی ایک تحقیقی خلاصے میں ملی جسے متحف نے صفحے سے نہیں جانچا۔"
  fr: "Ce qui a été trouvé sur l'arabe aux Émirats arabes unis : le texte de l'article 7 de la Constitution tel que le montre le Constitute Project, le chiffre de l'étude de la Bibliothèque du Congrès pour les Arabes ethniques, et ce que donnent l'arbre de classification et les groupements géographiques, avec l'énoncé qu'aucune description d'un dialecte émirati ni aucune part de langues n'a été trouvée. Le texte constitutionnel est ajouté dans sa langue d'origine, tel que fourni par un résumé de recherche que le musée n'a pas vérifié sur la page."
  es: "Lo que se encontró sobre el árabe en los Emiratos Árabes Unidos: el texto del artículo 7 de la Constitución tal como lo muestra el Constitute Project, la cifra del estudio de la Biblioteca del Congreso sobre los árabes étnicos, y lo que dan el árbol de clasificación y las agrupaciones geográficas, con el enunciado de que no se halló descripción de un dialecto emiratí ni proporciones de lenguas. Se añade el texto constitucional en su lengua original, tal como lo entrega un resumen de investigación que el museo no verificó en la página."
  tr: "Birleşik Arap Emirlikleri'nde Arapça hakkında bulunanlar: Anayasa'nın 7. maddesinin Yapı tarafından sunulduğu şekliyle, Kongre Kütüphanesi çalışmasının Arap etnik kökeni, soyağacı ve coğrafi sınıflandırmalar üzerine açıklaması; Emirlik lehçesi veya dilsel soyunun hiçbir açıklaması bulunmadığı belirtilmiştir. Anayasa kararının metni, müzenin sayfada doğrulamadığı bir araştırma özetinde yer aldığı şekliyle orijinal dilinde eklenmiştir."
  id: "Mengenai bahasa Arab di Uni Emirat Arab: Pasal 7 Konstitusi sebagaimana disajikan oleh Yapı, penjelasan studi Perpustakaan Kongres tentang etnisitas, genealogi, dan klasifikasi geografis Arab; Disebutkan bahwa tidak ada penjelasan mengenai dialek Emirat atau garis keturunan linguistik. Teks keputusan konstitusional ditambahkan dalam bahasa aslinya seperti yang tercantum dalam ringkasan penelitian yang tidak diverifikasi oleh museum di halaman tersebut."
