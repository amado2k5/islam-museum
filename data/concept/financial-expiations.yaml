id: concept/financial-expiations
class: concept
kind: legal
label:
  ar: "الكفارات المالية"
  en: "Financial expiations (kaffarat)"
  es: "Expiaciones financieras (kaffarat)"
  fr: "expiations financières (kaffarat)"
  ur: "مالی کفارہ ⁦(کفارات)⁩"
  tr: "Mali telafi"
  id: "Penebusan keuangan"
summary:
  ar: "الكفارة عند المؤلف ما يجب على المسلم من تحرير رقبة أو صيام أو إطعام إذا ارتكب ذنباً يستوجبها، ومنها كفارات مالية كالصدقة وإطعام المساكين وكسوتهم وتحرير الرقاب {cite:usul-iqtisad-islami-0660 p. 329}. وبعض الكفارات مرتبة لا يُنتقل فيها إلى التي تليها إلا عند العجز عن سابقتها {cite:usul-iqtisad-islami-0660 p. 329}."
  tr: "Yazara göre, kefaret, bir Müslümanın köleyi özgür bırakmak, oruç tutmak veya bunu gerektiren bir günah işlediğinde beslenmek zorunda olduğu şeydir. Bunlar arasında sadaka yapmak, yoksulları beslemek ve boynları rahatlatmak gibi maddi kefaretler bulunur {cite:usul-iqtisad-islami-0660 s. 329}. Bazı kefaretler ayarlanır ve ancak bunu yapamayınca bir sonrakine aktarılır {cite:usul-iqtisad-islami-0660 s. 329}."
  id: "Menurut penulis, penebusan adalah apa yang harus dilakukan Muslim dengan membebaskan budak, berpuasa, atau memberi makan jika ia melakukan dosa yang menuntutnya. Di antaranya adalah penebusan finansial seperti amal, memberi makan dan memanjakan orang miskin, serta membebaskan leher {cite:usul-iqtisad-islami-0660 hlm. 329}. Beberapa penebusan diatur dan hanya dialihkan ke yang berikutnya ketika mereka tidak mampu melakukannya {cite:usul-iqtisad-islami-0660 hlm. 329}."
