  en: "Financial expiations (kaffarat)"
summary:
  ar: "الكفارة عند المؤلف ما يجب على المسلم من تحرير رقبة أو صيام أو إطعام إذا ارتكب ذنباً يستوجبها، ومنها كفارات مالية كالصدقة وإطعام المساكين وكسوتهم وتحرير الرقاب {cite:usul-iqtisad-islami-0660 p. 329}. وبعض الكفارات مرتبة لا يُنتقل فيها إلى التي تليها إلا عند العجز عن سابقتها {cite:usul-iqtisad-islami-0660 p. 329}."
