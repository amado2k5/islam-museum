label: { ar: "سنة الأصل وحركة أبعاد الكواكب المتحيرة", en: "The epoch year and the drift of the apogees of the wandering planets", ur: "اصل سال اور متحیر سیاروں کے ابعاد کی حرکت", es: "El año épico y la deriva de los apogeos de los planetas errantes", fr: "L'année de l'époque et la dérive des apogées des planètes errantes", tr: "Gezegenlerin oluşum yılı ve boyutlarının hareketi", id: "Tahun asal dan pergerakan dimensi planet-planet yang berkelana" }
summary:
  ar: "يذكر النص أن أبعاد الكواكب المتحيرة، أي أبعاد زحل والمشتري والمريخ والزهرة والشمس وعطارد، مرسومة في أول جداول تعديلها لسنة الأصل وهي سنة ألف ومائة وإحدى وتسعين من سني ذي القرنين. وتتحرك هذه الأبعاد أيضاً بحركة فلك الكواكب الثابتة، بدرجة واحدة في كل ست وستين سنة شمسية، وبدرجة واحدة في كل ثماني وستين سنة قمرية. فيُؤخذ مقدار الحركة للسنين بين سنة الأصل والسنة المطلوبة، فيزاد على الأبعاد إن كانت بعدها، وينقص منها إن كانت قبلها. {cite:zij-sabi-nallino-byblion pp.176-177}"
  en: "The text says the apogees of the wandering planets, those of Saturn, Jupiter, Mars, Venus, the Sun and Mercury, are written at the head of their equation tables for the epoch year, which is the year 1191 of the era of Dhu al-Qarnayn. These apogees also move with the sphere of the fixed stars, one degree in every sixty-six solar years and one degree in every sixty-eight lunar years. The drift for the years between the epoch and the wanted year is taken, added to the apogee when the year is after the epoch and subtracted when it is before. The text does not give the conversion of this era to the Common Era. {cite:zij-sabi-nallino-byblion pp.176-177}"
  ur: "متن کہتا ہے کہ متحیر سیاروں کے ابعاد، یعنی زحل، مشتری، مریخ، زہرہ، سورج اور عطارد کے، ان کے تعدیلی جدولوں کے آغاز میں اصل سال کے لیے درج ہیں، جو ذوالقرنین کے سنین میں ایک ہزار ایک سو اکانوے ہے۔ یہ ابعاد ثوابت کے فلک کی حرکت کے ساتھ بھی چلتے ہیں: ہر چھیاسٹھ شمسی سال میں ایک درجہ، اور ہر اڑسٹھ قمری سال میں ایک درجہ۔ اصل سال اور مطلوبہ سال کے درمیان سالوں کی حرکت لی جاتی ہے، اگر مطلوبہ سال بعد کا ہو تو ابعاد میں جمع کی جاتی ہے اور پہلے کا ہو تو منہا۔ متن اس سنِ ذوالقرنین کو عیسوی سال میں تبدیل نہیں کرتا۔ {cite:zij-sabi-nallino-byblion pp.176-177}"
  es: "El texto indica que los apogeos de los planetas errantes (Saturno, Júpiter, Marte, Venus, el Sol y Mercurio) se encuentran escritos al inicio de sus tablas de ecuaciones para el año de la época, que corresponde al año 1191 de la era de Dhu al-Qarnayn. Estos apogeos también se desplazan con la esfera de las estrellas fijas, un grado cada sesenta y seis años solares y un grado cada sesenta y ocho años lunares. Se toma la desviación de los años entre la época y el año deseado, sumándola al apogeo cuando el año es posterior a la época y restándola cuando es anterior. El texto no proporciona la conversión de esta era a la Era Común. {cite:zij-sabi-nallino-byblion pp.176-177}"
  fr: "Le texte indique que les apogées des planètes errantes, celles de Saturne, Jupiter, Mars, Vénus, du Soleil et de Mercure, sont inscrites en tête de leurs tables d'équations pour l'année de l'époque, qui est l'an 1191 de l'ère de Dhu al-Qarnayn. Ces apogées se déplacent également avec la sphère des étoiles fixes, d'un degré tous les soixante-six ans solaires et d'un degré tous les soixante-huit ans lunaires. La dérive due à l'intervalle de temps entre l'époque et l'année recherchée est prise en compte, ajoutée à l'apogée si l'année est postérieure à l'époque et soustraite si elle est antérieure. Le texte ne donne pas la conversion de cette ère à l'ère commune. {cite:zij-sabi-nallino-byblion pp.176-177}"
  tr: "Metinde, gezinen gezegenlerin boyutlarının—yani Satürn, Jüpiter, Mars, Venüs, Güneş ve Merkür'ün boyutlarının—ilk yıl olan Zilhicce-Karnayn 1191 yılına göre ayarlanmış tabloların ilkinde çizildiği belirtiliyor. Bu boyutlar ayrıca sabit gezegenlerin yörüngeleriyle birlikte, her altmış altı güneş yılında bir derece ve her altmış sekiz ay yılında bir derece hareket eder. İlk yıl ile istenen yıl arasındaki yıllar için hareket miktarı alınır ve boyutlar istenen yıldan sonra ise eklenir, önce ise çıkarılır. {cite:zij-sabi-nallino-byblion pp.176-177}"
  id: "Teks tersebut menyatakan bahwa dimensi planet-planet yang bergerak—yaitu, dimensi Saturnus, Jupiter, Mars, Venus, Matahari, dan Merkurius—digambarkan dalam tabel pertama dengan menyesuaikannya dengan tahun asalnya, yaitu tahun 1191 Dzul-Qarnayn. Dimensi-dimensi ini juga bergerak mengikuti orbit planet-planet tetap, sebesar satu derajat setiap enam puluh enam tahun matahari dan sebesar satu derajat setiap enam puluh delapan tahun bulan. Jumlah pergerakan untuk tahun-tahun antara tahun asal dan tahun yang diinginkan diambil dan ditambahkan ke dimensi jika tahun tersebut setelah tahun asal, dan dikurangi jika tahun tersebut sebelum tahun asal. {cite:zij-sabi-nallino-byblion pp.176-177}"
