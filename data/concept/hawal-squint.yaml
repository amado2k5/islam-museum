id: concept/hawal-squint
class: concept
kind: legal
label: { ar: "الحَوَل", en: "Hawal (squint of the eye)", ur: "حَوَل (آنکھ کا ترچھاپن)" }
summary:
  ar: "الحَوَل في اللغة أن يظهر البياض في مؤخر العين ويكون السواد من قبل المآقي، ويطلق الفقهاء على الأحول من كان كذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7424} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7425} والعور ذهاب بصر إحدى العينين، والعشى سوء البصر بالليل أو النهار، والظفر بياض يبدو في إنسان العين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7424} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7425} ومن حيث النكاح: يرى الجمهور أن الحول لا يثبت به حق الفسخ ما لم يشترط السلامة منه، فإن شرطت السلامة ثم بان خلافها ثبت الخيار عند المالكية والحنابلة في أحد القولين، وعند الحنفية لا يثبت الخيار بفوات صفة مشروطة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7425} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7426} والتضحية بالشاة الحولاء جائزة ما لم يمنع الحول النظر، والجناية على العين إذا أدت إلى الحول فيها حكومة عدل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7426} "
  en: "Hawal (squint) is lexically a whiteness at the far corner of the eye with the black at the near side; the jurists apply the word to one who has it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7424} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7425} Awar is loss of sight in one eye, ashan is poor sight by night or day, and zufr is a whiteness appearing in the pupil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7424} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7425} In marriage, the majority hold that squint gives no right to annul unless safety was stipulated; if safety was stipulated and found absent, the Malikis and one Hanbali view give the right to annul, while the Hanafis do not give it for a missing stipulated quality. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7425} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7426} A squint-eyed sheep may be sacrificed unless the squint prevents sight, and an injury to the eye that causes squint carries assessed compensation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7426} "
  ur: "حول (بفتحتین) سے مراد آنکھ کے پچھلے حصے میں سفیدی ہے جبکہ سیاہی کنارے کی طرف ہو؛ اس شخص کو احول کہا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7424} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7425} عَور ایک آنکھ کی بینائی جانا، عشی رات یا دن میں کمزور نظر، اور ظفر آنکھ کی پتلی پر سفیدی کو کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7424} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7425} نکاح میں جمہور کے نزدیک حول سے فسخ کا حق نہیں جب تک سلامت کی شرط نہ ہو؛ شرط کے بعد خلاف ثابت ہو تو مالکیہ اور حنابلہ کے ایک قول کے مطابق خیار ہے، جبکہ حنفیہ کے نزدیک شرطی وصف کے فوت ہونے پر خیار نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7425} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7426} حولاء بکری کی قربانی جائز ہے جب تک حول نظر کو نہ روکے، اور آنکھ پر جنایت سے حول پیدا ہو تو حکومت عدل واجب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7426} "
