label: { ar: "الحَوَل", en: "Hawal (squint of the eye)", ur: "حَوَل ⁦(آنکھ کا ترچھاپن)⁩", es: "Hawal (escotar los ojos)", fr: "Hawal (strabisme de l'œil)", tr: "şaşılık", id: "strabismus" }
summary:
  ar: "الحَوَل في اللغة أن يظهر البياض في مؤخر العين ويكون السواد من قبل المآقي، ويطلق الفقهاء على الأحول من كان كذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7424} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7425} والعور ذهاب بصر إحدى العينين، والعشى سوء البصر بالليل أو النهار، والظفر بياض يبدو في إنسان العين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7424} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7425} ومن حيث النكاح: يرى الجمهور أن الحول لا يثبت به حق الفسخ ما لم يشترط السلامة منه، فإن شرطت السلامة ثم بان خلافها ثبت الخيار عند المالكية والحنابلة في أحد القولين، وعند الحنفية لا يثبت الخيار بفوات صفة مشروطة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7425} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7426} والتضحية بالشاة الحولاء جائزة ما لم يمنع الحول النظر، والجناية على العين إذا أدت إلى الحول فيها حكومة عدل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7426} "
  en: "Hawal (squint) is lexically a whiteness at the far corner of the eye with the black at the near side; the jurists apply the word to one who has it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7424} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7425} Awar is loss of sight in one eye, ashan is poor sight by night or day, and zufr is a whiteness appearing in the pupil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7424} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7425} In marriage, the majority hold that squint gives no right to annul unless safety was stipulated; if safety was stipulated and found absent, the Malikis and one Hanbali view give the right to annul, while the Hanafis do not give it for a missing stipulated quality. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7425} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7426} A squint-eyed sheep may be sacrificed unless the squint prevents sight, and an injury to the eye that causes squint carries assessed compensation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7426} "
  ur: "حول ⁦(بفتحتین)⁩ سے مراد آنکھ کے پچھلے حصے میں سفیدی ہے جبکہ سیاہی کنارے کی طرف ہو؛ اس شخص کو احول کہا جاتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7424} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7425} عَور ایک آنکھ کی بینائی جانا، عشی رات یا دن میں کمزور نظر، اور ظفر آنکھ کی پتلی پر سفیدی کو کہتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7424} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7425} نکاح میں جمہور کے نزدیک حول سے فسخ کا حق نہیں جب تک سلامت کی شرط نہ ہو؛ شرط کے بعد خلاف ثابت ہو تو مالکیہ اور حنابلہ کے ایک قول کے مطابق خیار ہے، جبکہ حنفیہ کے نزدیک شرطی وصف کے فوت ہونے پر خیار نہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7425} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7426} حولاء بکری کی قربانی جائز ہے جب تک حول نظر کو نہ روکے، اور آنکھ پر جنایت سے حول پیدا ہو تو حکومت عدل واجب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7426} "
  es: "Hawal (bizquear) es léxicamente una blancura en la esquina lejana del ojo con el negro en el lado cercano; los juristas aplican la palabra a quien la tiene. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7424} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7425} Awar es pérdida de la vista en un ojo, ashan es mala vista de noche o de día, y zufr es una blancura que aparece en la pupila. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7424} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7425} En el matrimonio, la mayoría sostiene que el bizquear no da derecho a anularlo a menos que se haya estipulado seguridad; Si se estipuló la seguridad y se constató su ausencia, los malikíes y una opinión hanbalí otorgan el derecho a anular el sacrificio, mientras que los hanafíes no lo otorgan por la falta de una cualidad estipulada. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7425} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7426} Una oveja bizca puede ser sacrificada a menos que el estrabismo impida la visión, y una lesión ocular que cause estrabismo conlleva una compensación. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7426}"
  fr: "Hawal (strabisme) désigne lexicalement une zone blanche au coin externe de l'œil, contrastant avec le noir du coin interne; les juristes appliquent ce terme à toute personne qui en est atteinte. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7424} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7425} Awar désigne la perte de la vue d'un œil, ashan une mauvaise vision de jour comme de nuit, et zufr une zone blanche apparaissant dans la pupille. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7424} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7425} En matière de mariage, la majorité considère que le strabisme ne constitue pas un motif d'annulation, sauf si la sécurité a été expressément prévue. Si la sécurité était stipulée et qu'elle faisait défaut, les Malikites et une opinion hanbalite autorisent l'annulation, tandis que les Hanafites ne l'autorisent pas pour une qualité stipulée manquante. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7425} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7426} Un mouton louche peut être sacrifié à moins que le strabisme n'empêche la vue, et une blessure à l'œil qui cause le strabisme donne lieu à une compensation. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.7426}"
  tr: "Dilbilimde, 'aḥul' gözün arkasında beyazlık ve lekelerde siyahlığın belirmesidir. Hukukçular, 'ḥāḥāḥāḥā' ifasını böyle olanlar olarak adlandırır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7424} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7425} 'awr' bir gözde görme kaybı, 'isha' gece veya gündüz zayıf görme anlamına gelir ve kişinin gözünde beyaz bir tırnak belirir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7424} {Cite:Fiqh-Mawsua-Kuwaitiyya-Noor-v3 s.. 7425} Evlilik hakkında: çoğunluk, iptal hakkının ancak güvenlik sağlanmadığı konusunda karar verilir. Eğer güvenlik şart koşuluyor ve aksi kanıtlanırsa, seçenek Maliki ve Haneli'ye göre iki görüşten birine göre belirlenir; Hanefilere göre ise seçenek koşullu bir özelliğin kaybıyla belirlenmez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7425} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7426} Kısık koyunları kurban etmek, gözlerini kısmak görme engelledikçe kabul edilir ve nazar gözü kurban etmek adil bir hükümet biçiminde gözlerini kısmasıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.7426}"
  id: "Dalam linguistik, 'aḥul' adalah ketika kulit putih muncul di bagian belakang mata dan kegelapan muncul di bintik-bintiknya. Para ahli hukum menyebut 'ḥāḥāḥā' sebagai orang yang demikian. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7424} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7425} 'awr' berarti kehilangan penglihatan pada satu mata, 'isha' berarti penglihatan buruk di siang atau malam, dan kuku putih muncul di mata seseorang. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7424} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm. 7425} Mengenai pernikahan: mayoritas berpendapat bahwa hak pembatalan tidak ditetapkan kecuali ada jaminan dari pernikahan. Jika keamanan ditetapkan dan sebaliknya terbukti, opsi ditetapkan menurut Malikis dan Hanbalis dalam salah satu dari dua pendapat, sedangkan menurut Hanafi, opsi tidak ditentukan oleh hilangnya karakteristik bersyarat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7425} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7426} Mengorbankan domba yang menyipitkan mata diperbolehkan kecuali juling menghalangi penglihatan, dan kejahatan terhadap mata jahat adalah jika menyebabkan juling dalam bentuk pemerintahan yang adil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.7426}"
