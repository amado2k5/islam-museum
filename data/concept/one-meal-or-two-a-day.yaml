id: concept/one-meal-or-two-a-day
class: concept
kind: scientific
label: { ar: "وجبة أو وجبتان في اليوم", en: "One meal or two a day", ur: "دن میں ایک یا دو وقت کا کھانا" }
summary:
  ar: "يقول ابن سينا إن أوفق المرات للأكل المشبع أن يأكل يوماً وجبة ويوماً مرتين، بكرة وعشية، ويجب أن تراعى العادة مراعاة شديدة، فمن اعتاد مرتين فوجب ضعف وتوهنت قوته، ومن به ضعف هضم يتناول مرتين ويقلل الأكل في كل مرة {cite:canon-ibn-sina-print-v1 pp.230-231}."
  en: "Ibn Sina says the most suitable rhythm for a satisfying meal is one meal on one day and two, morning and evening, on the next; habit must be watched closely, for one used to two meals is weakened by being restricted to one, and one with weak digestion should take two meals and eat less at each {cite:canon-ibn-sina-print-v1 pp.230-231}."
