id: concept/portal-vein
class: concept
kind: scientific
label: { ar: "الوريد الباب عند ابن سينا", en: "The portal vein in the Canon", ur: "قانون میں باب کی رگ", es: "La vena porta en el Canon", fr: "La veine porte dans le canon" }
summary:
  ar: "في الفصل الثاني من جملة الأوردة يصف ابن سينا الباب، فينقسم طرفه الغائر في الكبد خمسة أقسام، وينقسم طرفه عند التقعير ثمانية أقسام، اثنان صغيران وستة أعظم تغذو المعدة والطحال والثرب والأمعاء {cite:canon-ibn-sina-print-v1 pp.87-88}."
  en: "In the second chapter on the veins Ibn Sina describes the gate vein: its end sunk in the liver divides in five, its end at the concavity divides in eight, two small and six larger, which feed the stomach, spleen, omentum and intestines {cite:canon-ibn-sina-print-v1 pp.87-88}."
  es: "En el segundo capítulo sobre las venas, Ibn Sina describe la vena porta: su extremo hundido en el hígado se divide en cinco, su extremo en la concavidad se divide en ocho, dos pequeños y seis más grandes, que alimentan el estómago, el bazo, el epiplón y los intestinos {cite:canon-ibn-sina-print-v1 pp.87-88}."
  fr: "Dans le deuxième chapitre sur les veines, Ibn Sina décrit la veine porte: son extrémité enfoncée dans le foie se divise en cinq, son extrémité à la concavité se divise en huit, deux petites et six plus grandes, qui alimentent l'estomac, la rate, l'épiploon et les intestins {cite:canon-ibn-sina-print-v1 pp.87-88}."
  ur: "رگوں کے دوسرے باب میں ابن سینا دروازے کی رگ کی وضاحت کرتا ہے: جگر میں اس کا دھنسا ہوا اختتام پانچ حصوں میں تقسیم ہوتا ہے، اس کا اختتام آٹھ، دو چھوٹے اور چھ بڑے حصوں میں تقسیم ہوتا ہے، جو معدہ، تلی، اونٹم اور آنتوں کو کھانا کھلاتا ہے۔"
