summary:
  ar: "في الفصل الثاني من جملة الأوردة يصف ابن سينا الباب، فينقسم طرفه الغائر في الكبد خمسة أقسام، وينقسم طرفه عند التقعير ثمانية أقسام، اثنان صغيران وستة أعظم تغذو المعدة والطحال والثرب والأمعاء {cite:canon-ibn-sina-print-v1 pp.87-88}."
  en: "In the second chapter on the veins Ibn Sina describes the gate vein: its end sunk in the liver divides in five, its end at the concavity divides in eight, two small and six larger, which feed the stomach, spleen, omentum and intestines {cite:canon-ibn-sina-print-v1 pp.87-88}."
