    id: sunni-sharawi-provision-and-half-dower
    stance: { ar: "المتعة إن لم يُفرض مهر، ونصف المهر إن فُرض", en: "A provision if no dower was fixed, half the dower if one was fixed", ur: "مہر مقرر نہ ہو تو متعہ، مقرر ہو تو آدھا مہر" }
    holders: [person/muhammad-mutawalli-al-shaarawi]
    summary:
      ar: "يقرر الشعراوي أن المتعة تُقدّر على قدر حال الزوج، وينقل عن العلماء أنها تُقدّر بما يوازي نصف مهر مثيلاتها من النساء عند عدم التسمية، ويقرر أن للمطلقة نصف المهر المسمّى {cite:tafsir-sharawi-khawatir-scan p.1018}."
      en: "Sha'rawi holds that the provision is set by the husband's means and reports that scholars valued it at half the dower of comparable women when none was named; where a dower was named, she takes half of it {cite:tafsir-sharawi-khawatir-scan p.1018}."
