id: concept/divorce-before-consummation
class: concept
kind: legal
label:
  ar: "الطلاق قبل الدخول"
  en: "Divorce before consummation"
  ur: "رخصتی سے پہلے طلاق"
summary:
  ar: "يعرض الشعراوي حكم المطلقة قبل الدخول: إن لم يُفرض لها مهر فلها متعة على قدر حال الزوج، وإن فُرض لها مهر فلها نصفه إلا أن تعفو هي أو يعفو من بيده عقدة النكاح، ويرى أن الفضل يكمّل العدل في هذا الباب {cite:tafsir-sharawi-khawatir-scan p.1018} {cite:tafsir-sharawi-khawatir-scan p.1019}."
  en: "Sha'rawi sets out what a woman divorced before consummation is owed. If no dower was fixed, she receives a provision (mut'a) according to the husband's means; if a dower was fixed, she receives half of it unless she waives it or the one in whose hand the marriage knot lies waives it. He reads grace (fadl) as completing justice ('adl) here {cite:tafsir-sharawi-khawatir-scan p.1018} {cite:tafsir-sharawi-khawatir-scan p.1019}."
  ur: "شعراوی بیان کرتے ہیں کہ رخصتی سے پہلے طلاق پانے والی عورت کا کیا حق ہے۔ اگر مہر مقرر نہ ہوا ہو تو شوہر کی استطاعت کے مطابق متعہ ہے، اور اگر مہر مقرر ہو تو آدھا مہر، جب تک عورت یا وہ شخص جس کے ہاتھ میں نکاح کی گرہ ہے معاف نہ کرے۔ وہ یہاں فضل کو عدل کی تکمیل سمجھتے ہیں {cite:tafsir-sharawi-khawatir-scan p.1018} {cite:tafsir-sharawi-khawatir-scan p.1019}."
issue:
  ar: "ماذا يجب للمطلقة قبل الدخول: متعة أم نصف المهر، ومن يملك العفو عنه؟"
  en: "What is owed to a woman divorced before consummation: a provision or half the dower, and who may waive it?"
  ur: "رخصتی سے پہلے طلاق پانے والی عورت کا حق: متعہ یا آدھا مہر، اور اسے معاف کون کر سکتا ہے؟"
