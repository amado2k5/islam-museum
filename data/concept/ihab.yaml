label: { ar: "الإهاب", en: "Ihab (the hide of an animal, its purity and tanning, and the rules on killing or selling animals for their hides)", es: "Ihab (la piel de un animal, su pureza y curtido, y las normas sobre la matanza o venta de animales por sus pieles)", fr: "Ihab (la peau d'un animal, sa pureté et son tannage, et les règles relatives à l'abattage ou à la vente d'animaux pour leur peau)", ur: "احاب ⁦(جانور کی کھال، اس کی پاکیزگی اور رنگت، اور جانوروں کو ان کی کھالوں کے لیے مارنے یا بیچنے کے احکام)⁩", tr: "Terörizm", id: "Terorisme" }
summary:
  ar: "الإهاب لغة الجلد من البقر والغنم والوحش ما لم يدبغ، وأطلقه الفقهاء بمعنى أعم يشمل جلد الإنسان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3591}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3592} جلد المذكى ذكاة شرعية طاهر إن كان الحيوان مأكول اللحم بالاتفاق، وفي غير المأكول خلاف، فالشافعية والحنابلة لا تطهره الذكاة، والحنفية والمالكية يطهرونه بها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3592} وإهاب الميتة نجس، ولا ينتفع به قبل الدباغ، وفي طهارته بالدباغ سبعة اتجاهات تختلف في الخنزير والكلب وباطن الجلد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3592}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3593} ويختلف الفقهاء في ذبح غير المأكول أو بيعه لأجل جلده، فالشافعية يحرمون ذلك، والحنفية والمالكية يجيزونه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3593}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3594} ويكره عند الجميع سلخ الذبيحة قبل زهوق روحها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3594}"
  en: "Ihab is lexically the hide of cattle, sheep or wild animals before it is tanned, and the jurists use it more widely to include human skin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3591}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3592} The hide of an animal lawfully slaughtered is pure by agreement if the animal is edible; for animals not eaten the views differ: the Shafi'is and Hanbalis hold that slaughter does not purify their hide, while the Hanafis and Malikis hold that it does. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3592} The hide of a carcass is impure and may not be used before tanning; after tanning there are seven views, differing over the pig, the dog and the inner side of the hide. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3592}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3593} The jurists differ on killing or selling a non-edible animal for its hide: the Shafi'is forbid it, and the Hanafis and Malikis allow it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3593}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3594} All agree that flaying a slaughtered animal before its soul has left is disliked. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3594}"
  es: "Ihab es léxicamente la piel de ganado vacuno, ovino o animales salvajes antes de ser curtida, y los juristas la usan más ampliamente para incluir la piel humana. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3591}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3592} La piel de un animal sacrificado legalmente es pura por acuerdo si el animal es comestible; para los animales no comidos las opiniones difieren: los shafi'is y hanbalis sostienen que el sacrificio no purifica su piel, mientras que los hanafis y malikíes sostienen que sí. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3592} La piel de una canal es impura y no puede usarse antes del curtido; después del curtido hay siete opiniones, que difieren sobre el cerdo, el perro y el lado interno de la piel. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3592}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3593} Los juristas difieren sobre matar o vender un animal no comestible por su piel: los shafi'íes lo prohíben, y los hanafíes y malikíes lo permiten. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3593}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3594} Todos coinciden en que desollar un animal sacrificado antes de que su alma lo abandone es desaconsejable. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3594}"
  fr: "Le terme « ihab » désigne le cuir des bovins, des ovins ou des animaux sauvages avant tannage, mais les juristes l'emploient plus largement pour inclure la peau humaine. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3591}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3592} La peau d'un animal licitement abattu est considérée comme pure si l'animal est comestible; pour les animaux non consommés, les avis divergent: les écoles chaféite et hanbalite estiment que l'abattage ne purifie pas la peau, tandis que les écoles hanafite et malikite estiment le contraire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3592} La peau d'une carcasse est impure et ne peut être utilisée avant tannage; après tannage, sept avis divergent quant à son utilisation, notamment pour le porc, le chien et la face interne de la peau. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3592}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3593} Les juristes divergent quant à la mise à mort ou à la vente d'un animal non comestible pour sa peau: les chaféites l'interdisent, tandis que les hanafites et les malikites l'autorisent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3593}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3594} Tous s'accordent à dire qu'il est déconseillé d'écorcher vif un animal abattu avant que son âme ne l'ait quitté. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3594}"
  ur: "احاب لغوی طور پر مویشیوں، بھیڑوں یا جنگلی جانوروں کی کھال کو ٹینڈ کرنے سے پہلے کہتے ہیں، اور فقہاء اسے انسانی جلد کو شامل کرنے کے لیے زیادہ وسیع پیمانے پر استعمال کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3591}{cite:fiqh-Mawsua-kuwaitiyya-noor-v3 p.3592} حلال طور پر ذبح کیے گئے جانور کی کھال اگر جانور کھانے کے قابل ہو تو معاہدہ سے پاک ہے۔ اس لیے کہ جانور نہیں کھاتے، اس کے بارے میں اقوال مختلف ہیں: شافعیہ اور حنبلی کا خیال ہے کہ ذبح کرنے سے ان کی کھال صاف نہیں ہوتی، جب کہ حنفیہ اور مالکیہ کا خیال ہے کہ اس سے ذبح ہوتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3592} میت کی کھال نجس ہے اور اسے رنگت سے پہلے استعمال نہیں کیا جا سکتا۔ ٹیننگ کے بعد سات آراء ہیں، سور، کتے اور کھال کے اندرونی حصے میں فرق ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3592}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3593} غیر خوردنی جانور کو اس کی کھال کے لیے مارنے یا بیچنے میں فقہاء کا اختلاف ہے: شافعی اس کی اجازت دیتے ہیں اور مالک احناف اس کی اجازت دیتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3593}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3594} سب اس بات پر متفق ہیں کہ ذبح شدہ جانور کو اس کی روح نکلنے سے پہلے اس کو مارنا ناپسندیدہ ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 ص3594}"
  tr: "Cehalet, ineklerin, koyunların ve yabani hayvanların derisi, tabaklanmadıkça veya tabaklanmadıkça kullanılır ve hukukçular insan derisini de kapsayan daha geniş bir terim olarak kullanmıştır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3591} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3592} Dişi hayvanın derisi, hayvan oybirliğiyle yenirsek meşru bir zekattır (İslami zekat). Gıda dışı maddeler konusunda fark vardır. Şafiiler ve Hanbaliler zekatla arındırmaz, Hanafi ve Malikiler ise zekatla arındırır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3592} Ölüleri ihmal etmek kirlidir ve bronzlaşmadan önce faydalı değildir. Tabaklama ile saflığında domuzlarda, köpeklerde ve iç deride yedi farklı yön vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3592} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3593} Hukukçular, yenmemiş yiyeceklerin kırbaçlanması için kesilmesi veya satılması konusunda farklı görüşlere sahiptir; Şafiiler bunu yasaklarken, Hanafi ve Malikiler izin verir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3593} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3594} ve herkes ruhu ölmeden kurbanın derisini yüzmekten hoşlanmaz. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3594}"
  id: "Kebodohan merujuk pada kulit sapi, domba, dan hewan liar kecuali telah disamak atau disamak, dan para ahli hukum telah menggunakannya untuk istilah yang lebih luas yang mencakup kulit manusia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3591} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3592} Kulit hewan betina adalah zakat yang sah (zakat) Islam jika hewan tersebut dimakan secara konsensus. Ada perbedaan mengenai barang non-makanan. Syafi'i dan Hanbal tidak memurnikannya dengan zakat, sedangkan Hanafi dan Malik memurnikannya dengan zakat. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3592} Mengabaikan orang mati adalah sesuatu yang tidak murni dan tidak bermanfaat sebelum penyamakan kulit. Dalam kemurniannya dengan penyamakan, ada tujuh arah berbeda pada babi, anjing, dan kulit dalam. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3592} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3593} Para ahli hukum berbeda pendapat tentang penyembelihan atau penjualan makanan yang tidak dimakan untuk dicambuk; syafi'i melarangnya, sementara Hanafi dan Malik mengizinkannya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3593} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3594} dan semua orang tidak suka menguliti korban sebelum jiwanya musnah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3594}"
