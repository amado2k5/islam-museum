label: { ar: "الإهاب", en: "Ihab (the hide of an animal, its purity and tanning, and the rules on killing or selling animals for their hides)" }
summary:
  ar: "الإهاب لغة الجلد من البقر والغنم والوحش ما لم يدبغ، وأطلقه الفقهاء بمعنى أعم يشمل جلد الإنسان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3591}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3592} جلد المذكى ذكاة شرعية طاهر إن كان الحيوان مأكول اللحم بالاتفاق، وفي غير المأكول خلاف، فالشافعية والحنابلة لا تطهره الذكاة، والحنفية والمالكية يطهرونه بها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3592} وإهاب الميتة نجس، ولا ينتفع به قبل الدباغ، وفي طهارته بالدباغ سبعة اتجاهات تختلف في الخنزير والكلب وباطن الجلد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3592}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3593} ويختلف الفقهاء في ذبح غير المأكول أو بيعه لأجل جلده، فالشافعية يحرمون ذلك، والحنفية والمالكية يجيزونه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3593}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3594} ويكره عند الجميع سلخ الذبيحة قبل زهوق روحها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3594}"
  en: "Ihab is lexically the hide of cattle, sheep or wild animals before it is tanned, and the jurists use it more widely to include human skin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3591}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3592} The hide of an animal lawfully slaughtered is pure by agreement if the animal is edible; for animals not eaten the views differ: the Shafi'is and Hanbalis hold that slaughter does not purify their hide, while the Hanafis and Malikis hold that it does. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3592} The hide of a carcass is impure and may not be used before tanning; after tanning there are seven views, differing over the pig, the dog and the inner side of the hide. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3592}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3593} The jurists differ on killing or selling a non-edible animal for its hide: the Shafi'is forbid it, and the Hanafis and Malikis allow it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3593}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3594} All agree that flaying a slaughtered animal before its soul has left is disliked. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3594}"
