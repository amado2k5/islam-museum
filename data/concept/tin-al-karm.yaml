label:
  ar: "طين الكرم"
  en: "Tin al-karm (the vineyard earth)"
  ur: "طین الکرم ⁦(انگور کے باغ کی مٹی)⁩"
  es: "Tin al-karm (la tierra de la viña)"
  fr: "Tin al-karm (la terre du vignoble)"
  tr: "bağ kili"
  id: "tanah liat kebun anggur"
summary:
  ar: "طين أسود من أرض الشام، مجفف مبرد، يقع في الأكحال وصبغ الشعر، ويُلطخ به الكرم لقتل الدود."
  en: "A black earth from the land of Syria, drying and cooling, used in eye salves and hair dye, and smeared on vines against worms."
  ur: "شام کی ایک سیاہ مٹی جو خشک کرتی اور ٹھنڈک دیتی ہے؛ آنکھ کے سرمہ اور بالوں کے رنگ میں استعمال ہوتی ہے اور کیڑوں کو مارنے کے لیے انگور کی بیلوں پر لگائی جاتی ہے۔"
  es: "Una tierra negra procedente de Siria, que se seca y enfría, utilizada en ungüentos para los ojos y tintes para el cabello, y que se unta en las vides contra los gusanos."
  fr: "Une terre noire originaire de Syrie, qui sèche et refroidit, est utilisée dans les onguents pour les yeux et les teintures capillaires, et appliquée sur les vignes contre les vers."
  tr: "Levant'tan siyah kil, sürme ve saç boyasında bulunan, solucanları öldürmek için bağlarla boyanmış soğutulmuş kurutulmuş kil."
  id: "Tanah liat hitam dari Levant, tanah liat kering dingin yang ditemukan dalam kohl dan pewarna rambut, diwarnai kebun anggur untuk membunuh cacing."
