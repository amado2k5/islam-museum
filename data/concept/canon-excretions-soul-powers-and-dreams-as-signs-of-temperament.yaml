id: concept/canon-excretions-soul-powers-and-dreams-as-signs-of-temperament
class: concept
kind: scientific
label:
  ar: "الفضول وقوى النفس والأحلام دلائل على المزاج عند ابن سينا"
  en: "Excretions, soul powers and dreams as signs of temperament in the Canon"
  fr: "Excrétions, facultés de l’âme et rêves comme signes du tempérament dans le Canon"
  ur: "فضلات، نفس کی قوتیں اور خواب بطور علامتِ مزاج، قانون کے مطابق"
  es: "Las excreciones, los poderes del alma y los sueños como signos del temperamento en el Canon"
summary:
  ar: "الجنس التاسع دفع البدن للفضول وكيفية ما يدفع، والعاشر أحوال قوى النفس في أفعالها وانفعالاتها، ويلحق به الأحلام، وينبه ابن سينا إلى أن ما ذكر كله أو أكثره من علامات الأمزجة الواقعة في أصل البنية {cite:canon-ibn-sina-print-v1 pp.162-163}."
  en: "The ninth genus is the body's expulsion of waste and the quality of what it expels, the tenth the state of the soul's powers in their acts and passions, to which dreams are added; Ibn Sina notes that all or most of this concerns temperaments belonging to the original constitution {cite:canon-ibn-sina-print-v1 pp.162-163}."
  fr: "Le neuvième genre concerne expulsion des déchets et leur qualité ; le dixième, actes et passions des facultés de l’âme, auxquels s’ajoutent les rêves. Ibn Sina les rapporte tous ou presque aux tempéraments de constitution initiale {cite:canon-ibn-sina-print-v1 pp.162-163}."
  es: "El noveno género es la expulsión de desechos del cuerpo y la calidad de lo que expulsa, el décimo el estado de las facultades del alma en sus actos y pasiones, a lo que se añaden los sueños; Ibn Sina señala que todo o la mayor parte de esto concierne a los temperamentos pertenecientes a la constitución original {cite:canon-ibn-sina-print-v1 pp.162-163}."
  ur: "نویں جینس جسم کا فضلہ کا اخراج اور جو چیز اسے نکالتی ہے اس کا معیار، دسواں ان کے اعمال اور جذبات میں روح کی طاقتوں کی حالت، جس میں خواب شامل کیے جاتے ہیں۔ ابن سینا نوٹ کرتا ہے کہ اس میں سے تمام یا زیادہ تر اصل آئین سے تعلق رکھنے والے مزاج سے متعلق ہیں"
