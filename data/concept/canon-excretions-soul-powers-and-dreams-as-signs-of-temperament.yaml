summary:
  ar: "الجنس التاسع دفع البدن للفضول وكيفية ما يدفع، والعاشر أحوال قوى النفس في أفعالها وانفعالاتها، ويلحق به الأحلام، وينبه ابن سينا إلى أن ما ذكر كله أو أكثره من علامات الأمزجة الواقعة في أصل البنية {cite:canon-ibn-sina-print-v1 pp.162-163}."
  en: "The ninth genus is the body's expulsion of waste and the quality of what it expels, the tenth the state of the soul's powers in their acts and passions, to which dreams are added; Ibn Sina notes that all or most of this concerns temperaments belonging to the original constitution {cite:canon-ibn-sina-print-v1 pp.162-163}."
