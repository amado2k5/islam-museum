label: { ar: "الحدود الشرعية", en: "Fixed penalties (hudud)", ur: "حدود (شرعی سزائیں)" }
summary:
  ar: "الحدود جمع حد، وهو في اللغة المنع، وفي الاصطلاح عقوبة مقدرة وجبت حقا لله تعالى، وعرفها الشافعية والحنابلة بأنها عقوبة مقدرة على ذنب وجبت حقا لله أو اجتمع فيها حق الله وحق العبد كالقذف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6942} وتختلف عن القصاص لأنه حق للعبد، وعن التعزير لأن التعزير غير مقدر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6943} وإقامة الحدود فرض على ولي الأمر بالكتاب والسنة والإجماع، وفي المعقول أن الشهوة البشرية تميل إلى المحرمات، فشرعت الحدود زجرا وحسما للفساد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6943} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6944} وتفترق الحدود عن القصاص في أنها لا تورث ولا يصح العفو فيها ولا تتوقف على الدعوى، ويجوز الرجوع عن الإقرار فيها، ولا تجوز الشفاعة فيها بعد وصولها إلى الحاكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6945} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6946} وإذا اجتمع حدان من جنس واحد دخل أحدهما في الآخر غالبا، وإن تعدد الجاني بالجناية فيحد لكل جناية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6946} وتسقط الحدود بالشبهة، وتدرأ بها، وبالرجوع عن الإقرار إلا حد القذف، وبموت الشهود في الرجم عند من يشترط البداءة بالشهود. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6947} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6948} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6949} ولا يشترط في الزنى إلا أربعة شهود عند جمهور الفقهاء، ولا يقام الحد إلا بمكلف عاقل بالغ، ولا يُقام إلا بالإمام أو نائبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6949} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6950} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6957} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6958} والحد لا يسقط بالتوبة إلا في قطع الطريق والردة قبل القدرة، وفي غيرها خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6947}"
  en: "Hudud (sing. hadd) means a barrier in the lexicon, and in law a fixed penalty owed as God's right; the Shafi'is and Hanbalis define it as a fixed penalty for an offence that is a right of God, or in which the right of God and of the person are joined, as in slander. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6942} It differs from retaliation (qisas), which is the person's right, and from discretionary punishment (ta'zir), which is not fixed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6943} Enforcing the fixed penalties is a duty of the ruler on the authority of the Qur'an, the Sunna and consensus, and the reason given is that human appetite leans toward forbidden acts, so these penalties deter and cut off corruption. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6943} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6944} Fixed penalties differ from retaliation in that they are not inherited, cannot be pardoned, do not depend on a claim, may be recanted, and may not be interceded for once they reach the judge. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6945} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6946} Two penalties of one kind merge, but a new offence is punished anew. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6946} Penalties are averted by doubt; a confession is withdrawn except in slander; and the stoning is not carried out if the witnesses are dead, for those who require the witnesses to begin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6947} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6948} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6949} Four witnesses are required for fornication by the majority, the penalty is applied only to a sane adult, and only by the ruler or his deputy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6949} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6950} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6957} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6958} Repentance removes the penalty for highway robbery and apostasy before capture; for others the views differ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6947}"
