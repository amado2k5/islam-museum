id: concept/hudud-penalties
class: concept
kind: legal
sensitivity: contested
label: { ar: "الحدود الشرعية", en: "Fixed penalties (hudud)", ur: "حدود ⁦(شرعی سزائیں)⁩", es: "Penalizaciones fijas (hudud)", fr: "amendes fixes (hudud)", tr: "Yasal Sınırlar", id: "Batas Hukum" }
summary:
  ar: "الحدود جمع حد، وهو في اللغة المنع، وفي الاصطلاح عقوبة مقدرة وجبت حقا لله تعالى، وعرفها الشافعية والحنابلة بأنها عقوبة مقدرة على ذنب وجبت حقا لله أو اجتمع فيها حق الله وحق العبد كالقذف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6942} وتختلف عن القصاص لأنه حق للعبد، وعن التعزير لأن التعزير غير مقدر. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6943} وإقامة الحدود فرض على ولي الأمر بالكتاب والسنة والإجماع، وفي المعقول أن الشهوة البشرية تميل إلى المحرمات، فشرعت الحدود زجرا وحسما للفساد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6943} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6944} وتفترق الحدود عن القصاص في أنها لا تورث ولا يصح العفو فيها ولا تتوقف على الدعوى، ويجوز الرجوع عن الإقرار فيها، ولا تجوز الشفاعة فيها بعد وصولها إلى الحاكم. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6945} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6946} وإذا اجتمع حدان من جنس واحد دخل أحدهما في الآخر غالبا، وإن تعدد الجاني بالجناية فيحد لكل جناية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6946} وتسقط الحدود بالشبهة، وتدرأ بها، وبالرجوع عن الإقرار إلا حد القذف، وبموت الشهود في الرجم عند من يشترط البداءة بالشهود. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6947} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6948} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6949} ولا يشترط في الزنى إلا أربعة شهود عند جمهور الفقهاء، ولا يقام الحد إلا بمكلف عاقل بالغ، ولا يُقام إلا بالإمام أو نائبه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6949} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6950} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6957} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6958} والحد لا يسقط بالتوبة إلا في قطع الطريق والردة قبل القدرة، وفي غيرها خلاف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6947}"
  en: "Hudud (sing. hadd) means a barrier in the lexicon, and in law a fixed penalty owed as God's right; the Shafi'is and Hanbalis define it as a fixed penalty for an offence that is a right of God, or in which the right of God and of the person are joined, as in slander. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6942} It differs from retaliation (qisas), which is the person's right, and from discretionary punishment (ta'zir), which is not fixed. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6943} Enforcing the fixed penalties is a duty of the ruler on the authority of the Qur'an, the Sunna and consensus, and the reason given is that human appetite leans toward forbidden acts, so these penalties deter and cut off corruption. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6943} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6944} Fixed penalties differ from retaliation in that they are not inherited, cannot be pardoned, do not depend on a claim, may be recanted, and may not be interceded for once they reach the judge. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6945} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6946} Two penalties of one kind merge, but a new offence is punished anew. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6946} Penalties are averted by doubt; a confession is withdrawn except in slander; and the stoning is not carried out if the witnesses are dead, for those who require the witnesses to begin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6947} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6948} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6949} Four witnesses are required for fornication by the majority, the penalty is applied only to a sane adult, and only by the ruler or his deputy. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6949} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6950} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6957} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6958} Repentance removes the penalty for highway robbery and apostasy before capture; for others the views differ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6947}"
  es: "Hudud (sing. hadd) significa barrera en el léxico, y en la ley una pena fija debida como derecho de Dios; los shafi'ís y hanbalíes la definen como una pena fija para un delito que es un derecho de Dios, o en el que se unen el derecho de Dios y el de la persona, como en la calumnia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6942} Se diferencia de la represalia (qisas), que es un derecho de la persona, y del castigo discrecional (ta'zir), que no es fijo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6943} Hacer cumplir las penas fijas es un deber del gobernante en virtud del Corán, la Sunna y el consenso, y la razón aducida es que el apetito humano se inclina hacia los actos prohibidos, por lo que estas penas disuaden y cortan la corrupción. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6943} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6944} Las penas fijas se diferencian de la represalia en que no son heredadas, no pueden ser perdonadas, no dependen de una reclamación, pueden ser retractadas y no pueden ser intercedidas una vez que llegan al juez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6945} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6946} Dos penas de un tipo se fusionan, pero un nuevo delito se castiga de nuevo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6946} Las penas se evitan por duda; una confesión se retira excepto en caso de calumnia; y la lapidación no se lleva a cabo si los testigos están muertos, para aquellos que requieren testigos para comenzar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6947} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6948} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6949} Se requieren cuatro testigos para la fornicación por mayoría, la pena se aplica solo a un adulto cuerdo, y solo por el gobernante o su representante. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6949} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6950} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6957} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6958} El arrepentimiento elimina la pena por robo en caminos y apostasía antes de la captura; para otros, las opiniones difieren. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.6947}"
  fr: "Hudud (sing. hadd) signifie barrière dans le lexique, et en droit une amende fixe due en vertu d'un droit divin. Les écoles chaféite et hanbalite la définissent comme une amende fixe pour une infraction relevant du droit divin, ou lorsque le droit divin et le droit de la personne sont liés, comme dans le cas de la calomnie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6942} Elle diffère de la vengeance (qisas), qui est un droit personnel, et de la peine discrétionnaire (ta'zir), qui n'est pas fixe. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6943} L'application des amendes fixes est un devoir du gouvernant, fondé sur le Coran, la Sunna et le consensus, car l'instinct humain le porte vers les actes interdits; ces peines dissuadent et préviennent la corruption. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6943} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6944} Les peines fixes diffèrent des représailles en ce qu'elles ne sont pas héréditaires, ne peuvent faire l'objet d'un pardon, ne dépendent pas d'une réclamation, peuvent être rétractées et ne peuvent faire l'objet d'une intercession une fois qu'elles sont parvenues au juge. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6945} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6946} Deux peines de même nature se confondent, mais une nouvelle infraction est punie séparément. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6946} Le doute permet d'éviter les peines; un aveu est rétracté sauf en cas de calomnie; La lapidation n'est pas pratiquée si les témoins sont décédés, car elle est requise pour commencer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6947} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6948} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6949} Quatre témoins sont requis pour la fornication; la peine est appliquée uniquement à un adulte sain d'esprit et seulement par le souverain ou son représentant. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6949} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6950} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6957} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6958} La repentance supprime la pénalité pour vol de grand chemin et apostasie avant la capture; pour d’autres, les points de vue diffèrent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6947}"
  ur: "ہُدّد کا مطلب لغت میں ایک رکاوٹ ہے، اور قانون میں ایک مقررہ جرمانہ جو خدا کا حق ہے۔ شافعی اور حنبلی اس کی تعریف کسی ایسے جرم کے لیے ایک مقررہ سزا کے طور پر کرتے ہیں جو خدا کا حق ہے، یا جس میں خدا اور انسان کا حق شامل ہے، جیسا کہ بہتان ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 6942} یہ انتقام ⁦(قصاص)⁩ سے مختلف ہے جو کہ انسان کا حق ہے اور صوابدیدی سزا ⁦(تذیر)⁩ سے جو مقرر نہیں ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 6943} مقررہ تعزیرات کا نفاذ قرآن، سنت اور اجماع کے مطابق حاکم کا فرض ہے اور اس کی وجہ یہ ہے کہ انسان کی بھوک حرام کاموں کی طرف مائل ہوتی ہے، لہٰذا یہ سزائیں فساد کو روکتی ہیں اور اسے ختم کرتی ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.6943} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 6944} مقررہ سزائیں انتقامی کارروائیوں سے مختلف ہیں کہ وہ وراثت میں نہیں ہیں، انہیں معاف نہیں کیا جا سکتا، معاف نہیں کیا جا سکتا، ایک بار ان پر انحصار نہیں کیا جا سکتا، اور ان پر دوبارہ دعویٰ نہیں کیا جا سکتا۔ جج {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 6945} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 6946} ایک قسم کی دو سزائیں مل جاتی ہیں، لیکن ایک نئے جرم کی دوبارہ سزا دی جاتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 6946} شک سے سزائیں ٹال جاتی ہیں۔ ایک اعتراف واپس لے لیا جاتا ہے سوائے غیبت کے۔ اور اگر گواہ مر چکے ہوں تو سنگسار نہیں کیا جائے گا، ان لوگوں کے لیے جو گواہوں کو شروع کرنے کی ضرورت ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.6947} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 6948} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ6949} جرم کے لیے صرف چار گواہوں کی درخواست ضروری ہے۔ سمجھدار بالغ، اور صرف حاکم یا اس کے نائب کی طرف سے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 6949} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ6950} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ6957} p.6958} توبہ گرفتاری سے پہلے ہائی وے ڈکیتی اور ارتداد کی سزا کو ہٹا دیتی ہے۔ دوسروں کے لئے خیالات مختلف ہیں. {حوالہ: فقہ الموسوع کویتیہ نور v3 ص6947}"
  tr: "Hudud, hududun çoğuludur ve dilde yasak anlamına gelir. Terminolojide, Allah'ın hakkı olan sabit bir cezadır. Şafi'ler ve Hanbaliler, Allah'ın hakkı olan ya da Allah'ın hakkı ile hizmetçinin hakkının birleştiği bir günah için sabit bir ceza olarak tanımlamıştır; örneğin iftira. {cite:cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6942} Kısalardan farklıdır çünkü hizmetkâr için bir haktır, ta'zir ise önceden belirlenmediği için ta'zir'den farklıdır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6943} Hududun uygulanması, Kur'an, Sünnet ve uzlaşma ile hükümdar üzerinde zorunludur. Akıl gereği, insan arzusu yasak eylemlere eğilimlidir, bu yüzden hudud caydırıcı ve yolsuzluğa karşı belirleyici bir önlem olarak yasalaştırılmıştır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6943} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.69444} Hudud (yasal cezalar), qisalardan kalıtsal olmamaları, afın geçerli olmaması ve davaya bağlı olmaması; itirafın geri alınması caizdir ve günah hakime ulaştıktan sonra aracılık yasaktır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6945} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6946} Aynı türden iki hudud cezası bir araya gelirse, genellikle biri diğerine katılır ve fail suçta birden fazla suçluysa hadd her iki suç için geçerlidir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6946} Hudud cezası şüphe nedeniyle kaldırılır ve itirafın geri alınması, iftira cezası dışında ve tanıklarla başlatılanlara göre taşlanma yoluyla tanıkların ölümüyle önlenir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6947} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6948} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6949} Çoğu hukukçuya göre zina için sadece dört tanık gereklidir ve hudud yalnızca aklı başında bir yetişkin muhasebeci tarafından, sadece imam veya yardımcısı tarafından yapılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6949} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6950} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6957} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6958} Ceza ancak yolun kesilmesi ve dinden çıkma durumlarında tövbe ile kaldırılır, diğer durumlarda ise anlaşmazlık vardır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.6947}"
  id: "Hudud adalah bentuk jamak dari hudud, yang dalam bahasa berarti larangan. Dalam terminologi, ini adalah hukuman tetap yang merupakan hak Allah Yang Maha Kuasa. Syafi'i dan Hanbal mendefinisikannya sebagai hukuman tetap untuk dosa yang merupakan hak Allah, atau di mana hak Allah dan hak hamba digabungkan, seperti fitnah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6942} Ini berbeda dari qisas karena merupakan hak bagi pelayan, dan dari ta'zir karena ta'zir tidak ditentukan sebelumnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6943} Penegakan hudud wajib dilakukan oleh penguasa melalui Al-Qur'an, Sunnah, dan konsensus. Secara akal, keinginan manusia cenderung melakukan tindakan terlarang, sehingga hudud diundang-undang sebagai pencegah dan langkah tegas melawan korupsi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6943} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.69444} Hudud (hukuman hukum) berbeda dari qisa karena tidak diwariskan, pengampunan tidak sah, dan tidak bergantung pada kasus; pengakuan diizinkan untuk ditarik, dan perantaraan tidak diperbolehkan setelah sampai ke hakim. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6945} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6946} Jika dua hukuman hudud sejenis digabungkan, biasanya salah satu akan bergabung dengan yang lain, dan jika pelaku berkelompok dalam kejahatan, hadd berlaku untuk setiap kejahatan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6946} Hukuman hudud dicabut karena keraguan, dan dihindari dengan menarik pengakuan kecuali hukuman fitnah, dan dengan kematian saksi dalam rajam sesuai dengan mereka yang membutuhkan inisiasi bersama saksi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6947} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6948} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6949} Menurut mayoritas ahli hukum, hanya diperlukan empat saksi dalam perselingkuhan, dan hudud hanya dilakukan oleh akuntan dewasa yang waras, dan hanya dilakukan oleh imam atau wakilnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6949} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6950} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6957} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6958} Hukuman hanya dicabut dengan pertobatan dalam kasus memutus jalan dan murtad sebelum kemampuan, dan ada perbedaan pendapat dalam kasus lain. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.6947}"
