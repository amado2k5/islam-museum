perspectives:
  - tradition: sunni
    id: omar-abdelkafy-aadau-al-islam
    summary:
      ar: "الشيخ عمر عبد الكافي، في درس «آداب الإسلام»: من أنكر حدا واحدا من حدود الله فقد أنكر الحدود كلها، ويرى أن الحدود قائمة في الشريعة، وأن النظر فيها يحتاج إلى فهم أحوال الناس اليوم. هذا عرض لرأيه، والمتحف لا يحكم فيه."
      en: "Sheikh Omar Abdelkafy, in the Aadau al-Islam lessons: whoever rejects one of God's hudud has rejected them all; he holds the hudud are binding in the law and that the question must be read in light of how people live today. This sets out his view; the museum gives no verdict on it."
      ur: "شیخ عمر عبدالکافی، درس «آداب الإسلام» میں: جو اللہ کی ایک حد کا انکار کرے وہ گویا ساری حدوں کا انکار کرتا ہے؛ ان کے نزدیک حدود شریعت میں قائم ہیں، اور اس مسئلے کو آج کے لوگوں کے حالات کی روشنی میں دیکھنا ضروری ہے۔ یہ ان کی رائے کا بیان ہے؛ میوزیم اس پر فیصلہ نہیں دیتا۔"
