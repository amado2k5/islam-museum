label: { ar: "الحاكم", en: "Hakim (the judge, in fiqh usage)", ur: "حاکم" }
summary:
  ar: "الحاكم في الاصطلاح الفقهي اسم يتناول الخليفة والوالي والقاضي والمحكّم، وعند الإطلاق ينصرف إلى القاضي. وتنصيب الحاكم بمعنى القاضي فرض كفاية، وتنصيب الحاكم بمعنى الإمام فرض على الإمام، ولا تثبت ولاية القاضي إلا بتولية الإمام أو نائبه بإذنه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6727} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6728}"
  en: "In fiqh usage hakim is a general term covering the caliph, the governor, the judge and the arbitrator, but when used alone it refers to the judge. Appointing a judge is a communal duty (fard kifaya), and the appointment of the ruler is an obligation on the imam. A judge's authority is valid only when appointed by the imam or his deputy with permission. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6727} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6728}"
  ur: "فقہ میں حاکم کا لفظ خلیفہ، والی، قاضی اور حکم سب کو شامل ہے، مگر مطلق بولا جائے تو مراد قاضی ہوتا ہے۔ قاضی کا تقرر فرض کفایہ ہے، اور اس کی ولایت امام یا اس کے نائب کے تقرر سے ثابت ہوتی ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6727} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6728}"
