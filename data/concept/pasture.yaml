summary:
  ar: "أخرج الله من الأرض مرعاها وفاكهة وأبّاً متاعاً لكم ولأنعامكم، ويخرج المرعى فيجعله غثاء أحوى."
  en: "God brings forth from the earth its pasture — fruit and fodder as provision for you and your herds; He brings forth the pasture then turns it to dusky stubble."
  ur: "اللہ زمین سے اس کی چراگاہ نکالتا ہے پھل اور چارہ تمہارے اور تمہارے مویشیوں کی روزی؛ وہ چراگاہ نکالتا ہے پھر اسے کالا بھوسا بنا دیتا ہے۔"
  es: "Dios hace brotar de la tierra su pasto: fruto y forraje como sustento para ti y tus rebaños; Él hace brotar el pasto y luego lo convierte en rastrojo oscuro."
  fr: "Dieu fait pousser de la terre ses pâturages — fruits et fourrage pour vous nourrir, vous et vos troupeaux; Il fait pousser les pâturages puis les transforme en chaume sombre."
  tr: "Tanrı, yeryüzünden otlaklarını, meyvelerini ve sizin ve hayvanlarınız için erzak getirdi, otlak üretti ve orayı daha bol bir çorak arazi haline getirdi."
  id: "Allah mengeluarkan padang rumput, buah-buahan, dan perbekalan untuk Anda dan ternak Anda, dan Dia menghadirkan padang rumput dan menjadikannya tanah tandus yang lebih melimpah."
