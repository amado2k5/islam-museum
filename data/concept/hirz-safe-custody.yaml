id: concept/hirz-safe-custody
class: concept
kind: legal
label: { ar: "الحرز", en: "Safe custody (hirz) in theft", ur: "حِرز (محفوظ جگہ)" }
summary:
  ar: "الحرز في اللغة الموضع الذي يحفظ فيه الشيء، وفي الاصطلاح ما نُصب عادة لحفظ أموال الناس، كالدار والحانوت والخيمة والشخص، ومرجعه إلى العرف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6985} والأخذ من الحرز شرط من شروط القطع في السرقة عند جمهور الفقهاء، فلا يجب القطع حتى ينفصل المال عن جميع الحرز، وأصل ذلك حديث «لا قطع في ثمر معلق ولا في حريسة جبل»، وما بلغ ثمن المجن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6986} والحرز نوعان: حرز بالمكان كالدور والخزائن، ويكون حرزا بنفسه، وحرز بالحافظ كالطرق والمساجد، ويكون الحرز بالحافظ القريب، ويفترقان في أن القطع في الأول لا يجب إلا بإخراج المال، وفي الثاني يجب بمجرد الأخذ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6986} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6987} وفصل الفقهاء الكلام عن الحرز في باب السرقة، وفي العقود التي لها ضمان كالوديعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6987}"
  en: "Hirz (safe custody) is the place set up customarily to keep people's property, such as a house, a shop, a tent or a guarded person; its limits are fixed by custom. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6985} Taking from safe custody is a condition of the hand's amputation for theft of ownable property, by the majority: the cut is not owed until the goods leave the whole of the custody, on the hadith that there is no cut for fruit still on the tree or for grazing animals in the mountain, and that the cut applies to what reaches the value of a shield. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6986} There are two kinds: custody by place, such as houses and strongboxes, which is custody in itself; and custody by a guard, such as roads and mosques, where a nearby guard makes the place custody. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6986} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6987} The jurists treat it under theft, and also under deposits and other contracts that carry liability. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6987}"
