label: { ar: "الحرز", en: "Safe custody (hirz) in theft", ur: "حِرز ⁦(محفوظ جگہ)⁩", es: "Custodia segura (hirz) en caso de robo", fr: "garde sécurisée (hirz) en cas de vol" }
summary:
  ar: "الحرز في اللغة الموضع الذي يحفظ فيه الشيء، وفي الاصطلاح ما نُصب عادة لحفظ أموال الناس، كالدار والحانوت والخيمة والشخص، ومرجعه إلى العرف. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6985} والأخذ من الحرز شرط من شروط القطع في السرقة عند جمهور الفقهاء، فلا يجب القطع حتى ينفصل المال عن جميع الحرز، وأصل ذلك حديث «لا قطع في ثمر معلق ولا في حريسة جبل»، وما بلغ ثمن المجن. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6986} والحرز نوعان: حرز بالمكان كالدور والخزائن، ويكون حرزا بنفسه، وحرز بالحافظ كالطرق والمساجد، ويكون الحرز بالحافظ القريب، ويفترقان في أن القطع في الأول لا يجب إلا بإخراج المال، وفي الثاني يجب بمجرد الأخذ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6986} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6987} وفصل الفقهاء الكلام عن الحرز في باب السرقة، وفي العقود التي لها ضمان كالوديعة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6987}"
  en: "Hirz (safe custody) is the place set up customarily to keep people's property, such as a house, a shop, a tent or a guarded person; its limits are fixed by custom. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6985} Taking from safe custody is a condition of the hand's amputation for theft of ownable property, by the majority: the cut is not owed until the goods leave the whole of the custody, on the hadith that there is no cut for fruit still on the tree or for grazing animals in the mountain, and that the cut applies to what reaches the value of a shield. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6986} There are two kinds: custody by place, such as houses and strongboxes, which is custody in itself; and custody by a guard, such as roads and mosques, where a nearby guard makes the place custody. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6986} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6987} The jurists treat it under theft, and also under deposits and other contracts that carry liability. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6987}"
  es: "Hirz (custodia segura) es el lugar establecido por costumbre para guardar la propiedad de las personas, como una casa, una tienda, una tienda de campaña o una persona custodiada; sus límites están fijados por la costumbre. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6985} Tomar de una custodia segura es una condición de la amputación de la mano por robo de propiedad propia, por la mayoría: el corte no se debe hasta que los bienes salen de toda la custodia, según el hadiz que no hay corte para la fruta que aún está en el árbol o para los animales que pastan en la montaña, y que el corte se aplica a lo que alcanza el valor de un escudo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6986} Hay dos tipos: custodia por lugar, como casas y cajas fuertes, que es custodia en sí misma; y custodia por un guardia, como caminos y mezquitas, donde un guardia cercano hace que el lugar sea custodia. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6986} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6987} Los juristas lo tratan como un robo, y también como un depósito y otros contratos que conllevan responsabilidad. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6987}"
  fr: "Le hirz (caution) est le lieu coutumier où sont conservés les biens d'autrui, comme une maison, une boutique, une tente ou une personne gardée; ses limites sont fixées par la coutume. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6985} La prise de biens en garde est, selon la majorité, une condition de l'amputation de la main pour vol de biens appartenant à autrui: la part n'est due que lorsque les biens ont quitté l'intégralité de la garde, conformément au hadith selon lequel il n'y a pas de part pour les fruits encore sur l'arbre ni pour les animaux en pâture en montagne, et que la part s'applique à ce qui atteint la valeur d'un bouclier. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6986} Il existe deux types de garde: la garde par lieu, comme les maisons et les coffres-forts, qui constitue une garde en soi; et la garde par un gardien, comme les routes et les mosquées, où un gardien à proximité confère au lieu son statut de garde. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6986} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6987} Les juristes traitent de cette question sous l'angle du vol, ainsi que sous celui des dépôts et autres contrats engageant la responsabilité. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6987}"
