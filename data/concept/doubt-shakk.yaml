id: concept/doubt-shakk
class: concept
kind: legal
label:
  ar: "الشَّكّ"
  en: "Shakk (doubt in law: its kinds, the rule that certainty is not removed by doubt, and its effect on worship, contracts, penalties and evidence)"
summary:
  ar: "الشك التردد بين شيئين سواء استوى طرفاه أو رجح أحدهما. وقاعدة الفقهاء أن اليقين لا يزول بالشك، وأن الشك في النقصان كتحققه، والشك في الزيادة كتحققها. ويتفاوت حكم الشك بحسب أصله وما يتعلق به: فيحرم الشيء المشكوك في تذكيته، ويبنى على اليقين في الصلاة والطواف والصيام، ولا يقع الطلاق بالشك في أصله، وتدرأ الحدود بالشبهات، ولا تناط الرخص بالشك. وتختلف المذاهب في بعض الصور، كالشك في الحدث بعد تيقن الطهارة، والشك في عدد الركعات، والشك في الطلاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10156} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10157} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10158} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10159} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10160} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10176} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10177}"
  en: "Shakk is hesitation between two possibilities, whether they are equal or one prevails. The rule of the jurists is that certainty is not removed by doubt, that doubt about a shortfall is treated as a shortfall, and that doubt about an addition is treated as an addition. Doubt has different effects according to its origin: a slaughtered animal whose slaughter is in doubt is forbidden; the worshipper builds on certainty in prayer, circumambulation and fasting; divorce is not effective on mere doubt about whether it was pronounced; penalties are averted by doubt; and concessions do not rest on doubt. The schools differ on some cases, such as doubt about a breach of ablution after certainty of purity, the number of rak'as, and the number of divorces. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10156} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10157} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10158} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10159} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10160} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10176} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10177}"
