id: concept/doubt-shakk
class: concept
kind: legal
label:
  ar: "الشَّكّ"
  en: "Shakk (doubt in law: its kinds, the rule that certainty is not removed by doubt, and its effect on worship, contracts, penalties and evidence)"
  es: "Shakk (la duda en la ley: sus tipos, la regla de que la certeza no se elimina por la duda y su efecto en el culto, los contratos, las penas y las pruebas)"
  fr: "Shakk (le doute en droit: ses différentes formes, la règle selon laquelle le doute ne supprime pas la certitude, et son effet sur le culte, les contrats, les peines et la preuve)"
  ur: "شک ⁦(قانون میں شک: اس کی قسمیں، وہ قاعدہ کہ یقین کو شک سے دور نہیں کیا جاتا، اور اس کا اثر عبادت، عقد، تعزیرات اور ثبوت پر)⁩"
  tr: "Şüphe"
  id: "Keraguan"
summary:
  ar: "الشك التردد بين شيئين سواء استوى طرفاه أو رجح أحدهما. وقاعدة الفقهاء أن اليقين لا يزول بالشك، وأن الشك في النقصان كتحققه، والشك في الزيادة كتحققها. ويتفاوت حكم الشك بحسب أصله وما يتعلق به: فيحرم الشيء المشكوك في تذكيته، ويبنى على اليقين في الصلاة والطواف والصيام، ولا يقع الطلاق بالشك في أصله، وتدرأ الحدود بالشبهات، ولا تناط الرخص بالشك. وتختلف المذاهب في بعض الصور، كالشك في الحدث بعد تيقن الطهارة، والشك في عدد الركعات، والشك في الطلاق. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10156} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10157} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10158} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10159} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10160} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10176} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10177}"
  en: "Shakk is hesitation between two possibilities, whether they are equal or one prevails. The rule of the jurists is that certainty is not removed by doubt, that doubt about a shortfall is treated as a shortfall, and that doubt about an addition is treated as an addition. Doubt has different effects according to its origin: a slaughtered animal whose slaughter is in doubt is forbidden; the worshipper builds on certainty in prayer, circumambulation and fasting; divorce is not effective on mere doubt about whether it was pronounced; penalties are averted by doubt; and concessions do not rest on doubt. The schools differ on some cases, such as doubt about a breach of ablution after certainty of purity, the number of rak'as, and the number of divorces. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10156} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10157} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10158} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10159} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10160} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10176} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10177}"
  es: "Shakk es la vacilación entre dos posibilidades, ya sea que sean iguales o que una prevalezca. La regla de los juristas es que la certeza no se elimina con la duda, que la duda sobre una deficiencia se trata como una deficiencia, y que la duda sobre una adición se trata como una adición. La duda tiene diferentes efectos según su origen: un animal sacrificado cuya matanza es dudosa está prohibida; el devoto se fundamenta en la certeza en la oración, la circunvalación y el ayuno; el divorcio no es efectivo por la mera duda sobre si fue pronunciado; las penas se evitan mediante la duda; y las concesiones no se basan en la duda. Las escuelas difieren en algunos casos, como la duda sobre una falta de ablución después de la certeza de pureza, el número de rak'as y el número de divorcios. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10156} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10157} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10158} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10159} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10160} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10176} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.10177}"
  fr: "Le shakka désigne l'hésitation entre deux possibilités, qu'elles soient égales ou que l'une prévale. La règle des juristes est que le doute ne remet pas en cause la certitude, que le doute concernant un manque est traité comme un manque, et que le doute concernant un excès est traité comme un excès. Le doute a des effets différents selon son origine: l'abattage d'un animal dont la légitimité est mise en doute est interdit; le fidèle fonde sa prière, sa circumambulation et son jeûne sur la certitude; le divorce n'est pas effectif sur la simple question de sa prononciation; les peines sont évitées par le doute; et les concessions ne reposent pas sur le doute. Les écoles divergent sur certains points, comme le doute concernant une violation des ablutions après avoir constaté la pureté, le nombre de rak'as et le nombre de divorces. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10156} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10157} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10158} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10159} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10160} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10176} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10177}"
  ur: "شک دو امکانات کے درمیان ہچکچاہٹ ہے، چاہے وہ برابر ہوں یا ایک غالب۔ فقہاء کا قاعدہ یہ ہے کہ یقین کو شک سے دور نہیں کیا جاتا، کسی کمی کے بارے میں شک کو نقص سمجھا جاتا ہے اور اضافے کے بارے میں شک کو اضافہ سمجھا جاتا ہے۔ شک کے اپنے اصل کے اعتبار سے مختلف اثرات ہوتے ہیں: ذبح شدہ جانور جس کا ذبح کرنا شک میں ہے؛ نمازی نماز، طواف اور روزے میں یقین پیدا کرتا ہے۔ محض شک کی بنا پر طلاق مؤثر نہیں ہوتی۔ جرمانے شک سے ٹل جاتے ہیں۔ اور مراعات شک پر نہیں رہتیں۔ بعض صورتوں میں مکاتب کا اختلاف ہے، جیسے طہارت کے یقین کے بعد وضو کی خلاف ورزی کا شک، رکعات کی تعداد اور طلاق کی تعداد۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10156} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10157} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 10158} p.10159} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.10160} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.10176} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 1016}"
  tr: "Şüphe, iki taraf arasında tereddüttür; her iki tarafın eşit olup olmadığı ya da birinin üstün gelip gelmediğine bakılmaksızın. Hukukçuların kuralı, kesinliğin şüpheyle ortadan kalkmadığı, bir eksiklikten şüphe onun ortaya çıkışı gibi, artış hakkındaki şüphenin ise gerçekleşmesi gibidir. Şüphe hakkındaki hükmü, kaynağına ve ona bağlı olana göre değişir: şüpheli bir şeyin arındırılması yasaktır ve dua, çevre dolaşması ve oruçta kesinliğe dayanır. Boşanma, kaynağından şüphe nedeniyle gerçekleşmez, hudud cezaları şüpheyle önlenir ve şüphe nedeniyle taviz verilmez. Bazı durumlarda düşünce okulları farklılık gösterir; örneğin saflığın kesinliğinden sonra kirlilik şüphesi, raket sayısı ve boşanma hakkındaki şüphe gibi. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.10156} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.10157} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.10158} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.10159} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.10160} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.10176} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.10177}"
  id: "Keraguan adalah keraguan antara dua hal, apakah kedua pihak setara atau salah satunya yang menang. Aturan para ahli hukum adalah bahwa kepastian tidak hilang dengan keraguan, keraguan tentang kekurangan seperti terjadinya, dan keraguan tentang peningkatan adalah seperti realisasinya. Keputusan tentang keraguan bervariasi sesuai dengan asal-usulnya dan apa yang berkaitan dengannya: sesuatu yang diragukan dilarang dalam pemurniannya, dan didasarkan pada kepastian dalam doa, berkeliling lingkaran, dan puasa. Perceraian tidak terjadi karena keraguan asal-usulnya, dan hukuman hudud dapat dihindari oleh keraguan, dan konsesi tidak diberikan karena keraguan. Aliran pemikiran berbeda dalam beberapa kasus, seperti keraguan tentang kemurnian setelah kepastian kemurnian, keraguan tentang jumlah rak'ah, dan keraguan tentang perceraian. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.10156} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10157} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10158} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10159} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10160} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10176} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.10177}"
