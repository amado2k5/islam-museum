id: concept/madrasat-al-nahw-al-basriyya-kufiyya
class: concept
kind: discipline
label:
  ar: مدرستا البصرة والكوفة في النحو
  en: The Basran and Kufan schools of grammar
  es: "Las escuelas de gramática de Basran y Kufan"
  fr: "Les écoles de grammaire Basran et Kufan"
  ur: "گرامر کے بصران اور کوفان اسکول"
summary:
  ar: "بدأ الخلاف هادئاً بين الرؤاسي في الكوفة والخليل في البصرة ثم اشتد بين الكسائي في الكوفة وسيبويه في البصرة وصار لكل مدرسة علم تنحاز إليه كل فرقة، ويظهر أن هذه العصبية العلمية كانت مؤسسة على العصبية السياسية بين البلدين؛ وأهم الفروق أن مدرسة البصرة رأت وضع قواعد عامة للغة تُلتزم بدقة وحزم، فإذا ثبت شاذ محته قالت «يحفظ ولا يقاس عليه»، بل جرأت على تخطئة العرب في أقوالهم إذا لم تجر على القواعد كتخطئة ابن أبي إسحاق الحضرمي للفرزدق في بعض شعره، وفضّلت القياس وآمنت بسلطانه، بينما رأى الكوفيون احترام كل ما جاء عن العرب وإجازته للناس ولو خالف القواعد العامة، بل جعلوا الشاذ أساساً لوضع قاعدة عامة — حتى قال السيوطي إن الكسائي كان يسمع الشاذ فيجعله أصلاً ويقيس عليه فأفسد النحو بذلك، وقال الأندلسي: الكوفيون لو سمعوا بيتاً واحداً فيه جواز شيء مخالف للأصول جعلوه أصلاً وبوّبوا عليه."
  en: "The quarrel began quietly between al-Ru'asi at Kufa and al-Khalil at Basra, then flared between al-Kisa'i at Kufa and Sibawayh at Basra, each school gaining a standard the partisans rallied to — scholarly asabiyya founded, it seems, on the two towns' political rivalry. The core difference: the Basrans held that general rules must be laid for the language and kept with rigour — an attested anomaly was 'kept, not analogised', and they dared fault even al-Farazdaq's speech when it broke the rule — prizing qiyas and its sovereignty; the Kufans honoured everything transmitted from the Arabs and licensed its use even against the rules, making the anomaly itself the basis of new rules — whence al-Suyuti's charge that al-Kisa'i 'heard what is only permissible from necessity and made it a principle and analogised on it, corrupting grammar', and the Andalusi's jibe that a Kufan who heard one verse licensing what breaks the norms would make it a principle and build a chapter on it."
  es: "La disputa comenzó silenciosamente entre al-Ru'asi en Kufa y al-Khalil en Basora, luego se intensificó entre al-Kisa'i en Kufa y Sibawayh en Basora, cada escuela adquiriendo un estándar al que se unieron los partidarios: una asabiyya erudita fundada, al parecer, en la rivalidad política de las dos ciudades. La diferencia fundamental: los basranos sostenían que debían establecerse reglas generales para el idioma y mantenerse con rigor; una anomalía documentada se \"mantenía, no se emulaba\", y se atrevían a criticar incluso el discurso de al-Farazdaq cuando rompía la regla, valorando el qiyas y su soberanía; Los kufanos honraban todo lo transmitido por los árabes y autorizaban su uso incluso en contra de las normas, convirtiendo la anomalía misma en la base de nuevas reglas; de ahí la acusación de al-Suyuti de que al-Kisa'i \"escuchó lo que solo es permisible por necesidad y lo convirtió en un principio y lo emparejó, corrompiendo la gramática\", y la burla de los andalusíes de que un kufano que escuchara un versículo que autorizara lo que rompe las normas lo convertiría en un principio y construiría un capítulo sobre él."
  fr: "La querelle commença discrètement entre al-Ru'asi à Koufa et al-Khalil à Bassora, puis s'enflamma entre al-Kisa'i à Koufa et Sibawayh à Bassora, chaque école se forgeant une norme à laquelle les partisans se rallièrent – une asabiyya savante fondée, semble-t-il, sur la rivalité politique des deux villes. La principale différence: les Bassorais estimaient que des règles générales devaient être établies pour la langue et appliquées avec rigueur – une anomalie attestée était « conservée, non assimilée », et ils osaient même critiquer le discours d'al-Farazdaq lorsqu'il enfreignait la règle – valorisant le qiyas et sa souveraineté; Les habitants de Koufa honoraient tout ce qui leur avait été transmis par les Arabes et en autorisaient l'usage même au mépris des règles, faisant de l'anomalie elle-même la base de nouvelles règles — d'où l'accusation d'al-Suyuti selon laquelle al-Kisa'i « n'a entendu que ce qui n'est permis que par nécessité, en a fait un principe et a établi des analogies à partir de là, corrompant ainsi la grammaire », et la raillerie des Andalous selon laquelle un Koufa qui entendrait un verset autorisant ce qui enfreint les normes en ferait un principe et construirait un chapitre entier à partir de là."
  ur: "یہ جھگڑا کوفہ میں الرعاسی اور بصرہ میں الخلیل کے درمیان خاموشی سے شروع ہوا، پھر کوفہ میں الکسائی اور بصرہ میں سباویہ کے درمیان بھڑک اٹھی، ہر ایک اسکول نے ایک ایسا معیار حاصل کیا جس کے لیے متعصبین نے ریلیاں کیں — ایسا لگتا ہے کہ دونوں شہروں کی سیاسی دشمنی پر علمی اصابیہ کی بنیاد رکھی گئی۔ بنیادی فرق: بصریوں کا خیال تھا کہ زبان کے لیے عام اصول وضع کیے جانے چاہئیں اور اسے سختی کے ساتھ رکھنا چاہیے - ایک تصدیق شدہ بے ضابطگی کو 'رکھا گیا، تشبیہہ نہیں'، اور انھوں نے الفرازدق کی تقریر میں بھی غلطی کی جب اس نے قاعدہ توڑا - قیمتی قیاس اور اس کی خودمختاری؛ کوفوں نے عربوں سے منتقل ہونے والی ہر چیز کا احترام کیا اور اس کے استعمال کا لائسنس دیا حتیٰ کہ قاعدے کے خلاف بھی، اس بے ضابطگی کو ہی نئے اصولوں کی بنیاد بنا دیا - اسی وجہ سے السوطی کا الزام ہے کہ السوطی نے 'صرف ضرورت سے جائز چیز کو سنا اور اسے اصول بنایا اور اس پر تشبیہ دی، گرامر کو بگاڑ دیا'، اور کوفان نے جو ایک آیت کو سنا ہے، اس کو اندلس نے سنا ہے۔ اصولوں کو توڑنا اسے ایک اصول بنا دے گا اور اس پر ایک باب قائم کرے گا۔"
