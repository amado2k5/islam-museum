id: concept/rent-of-land-in-islam
class: concept
kind: legal
label:
  ar: "ريع الأرض وأجرتها"
  en: "Rent of land in Islam"
issue:
  ar: "هل يجوز تأجير الأرض بأجر مقطوع أو بحصة من الناتج؟"
summary:
  ar: "الريع في اللغة النماء والزيادة، وفي الاصطلاح الاقتصادي عائد الأرض، وقد يكون ريع تفاضل أو ربع منتج {cite:usul-iqtisad-islami-0660 p. 237} {cite:usul-iqtisad-islami-0660 p. 238}. واختلف الفقهاء في أجر الأرض: فأجازه بعضهم مقطوعاً، وأجازه آخرون بحصة من الناتج (مزارعة)، ومنعه بعضهم كليهما {cite:usul-iqtisad-islami-0660 p. 238} {cite:usul-iqtisad-islami-0660 p. 239}. والمؤلف يحرم أجر الشجر دون أرضه، ويجيز أجر الأرض المتصلة بالشجر عند بعض الفقهاء {cite:usul-iqtisad-islami-0660 p. 241} {cite:usul-iqtisad-islami-0660 p. 242}."
wings: [objects]
themes:
- trade-and-finance
- zakat-and-sadaqa
regions:
- arabia
- levant-iraq
- egypt-nile
perspectives:
  - tradition: sunni-hanbali
    id: ahmad-allow
    summary:
      ar: "أجاز أحمد ومالك والأوزاعي وإسحاق والليث والثوري وأبو يوسف ومحمد وبعض الشافعية أجرة الأرض مقطوعة أو شركة، وهو القديم من مذهب الشافعي {cite:usul-iqtisad-islami-0660 p. 239}."
    sources: [source/usul-iqtisad-islami-0660]
  - tradition: sunni
    id: sharecropping-preferred
    summary:
      ar: "ذهب بعض الفقهاء إلى أن المزارعة أحل من المؤاجرة، وذهب آخرون إلى حلية المؤاجرة أو كراهيتها {cite:usul-iqtisad-islami-0660 p. 238}."
    sources: [source/usul-iqtisad-islami-0660]
  - tradition: sunni
    id: forbid-both
    summary:
      ar: "لم يجز طاووس وأبو بكر بن عبد الرحمن والحسن البصري وابن حزم الظاهري وبعض المعاصرين للأرض أجراً ولا حصة، واستدلوا بحديث «من كانت له أرض فليزرعها أو ليمنحها أخاه» {cite:usul-iqtisad-islami-0660 p. 238} {cite:usul-iqtisad-islami-0660 p. 239}."
    sources: [source/usul-iqtisad-islami-0660]
