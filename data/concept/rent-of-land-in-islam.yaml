id: concept/rent-of-land-in-islam
class: concept
kind: legal
tags: [islamic-economy-browser, islamic-economy-money]
label:
  ar: "ريع الأرض وأجرتها"
  en: "Rent of land in Islam"
  es: "Renta de la tierra en el Islam"
  fr: "Le loyer des terres en Islam"
  ur: "اسلام میں زمین کا کرایہ"
  tr: "Arazi kirası ve kira"
  id: "Sewa dan sewa tanah"
issue:
  ar: "هل يجوز تأجير الأرض بأجر مقطوع أو بحصة من الناتج؟"
summary:
  ar: "الريع في اللغة النماء والزيادة، وفي الاصطلاح الاقتصادي عائد الأرض، وقد يكون ريع تفاضل أو ربع منتج {cite:usul-iqtisad-islami-0660 p. 237} {cite:usul-iqtisad-islami-0660 p. 238}. واختلف الفقهاء في أجر الأرض: فأجازه بعضهم مقطوعاً، وأجازه آخرون بحصة من الناتج ⁦(مزارعة)⁩، ومنعه بعضهم كليهما {cite:usul-iqtisad-islami-0660 p. 238} {cite:usul-iqtisad-islami-0660 p. 239}. والمؤلف يحرم أجر الشجر دون أرضه، ويجيز أجر الأرض المتصلة بالشجر عند بعض الفقهاء {cite:usul-iqtisad-islami-0660 p. 241} {cite:usul-iqtisad-islami-0660 p. 242}."
  tr: "Dilde rant, büyüme ve artış anlamına gelirken, ekonomik terminolojide toprağın geri dönüşüdür ve ürünün katı veya dörtte biri olabilir. {cite:usul-iqtisad-islami-0660 s. 237} {cite:usul-iqtisad-islami-0660 s. 238}. Hukukçular arazi ücreti konusunda farklı görüşlere sahipti: bazıları sabit bir miktar olarak izin verdi, bazıları ürünün bir payıyla (tarım) izin verdi ve bazıları hem {cite:usul-iqtisad-islami-0660 s. 238} {cite:usul-iqtisad-islami-0660 s. 239} yasakladı. Yazar, bazı hukukçulara göre ağaçların arazisi olmadan kiralanması yasaklanmış ve ağaçlarla bağlantılı arazi için kira alınmasına izin vermektedir {cite:usul-iqtisad-islami-0660 s. 241} {cite:usul-iqtisad-islami-0660 s. 242}."
  id: "Dalam bahasa, sewa berarti pertumbuhan dan peningkatan, dan dalam istilah ekonomi, itu adalah pengembalian tanah, dan bisa berupa penggandaan atau seperempat dari produk. {cite:usul-iqtisad-islami-0660 hlm. 237} {cite:usul-iqtisad-islami-0660 hlm. 238}. Para ahli hukum berbeda pendapat mengenai upah tanah: beberapa mengizinkannya sebagai jumlah tetap, yang lain mengizinkannya dengan bagian hasil panen (pertanian), dan beberapa melarangnya baik {cite:usul-iqtisad-islami-0660 hlm. 238} {cite:usul-iqtisad-islami-0660 hlm. 239}. Penulis melarang menyewa pohon tanpa tanahnya, dan mengizinkan sewa tanah yang terhubung dengan pohon menurut beberapa ahli hukum {cite:usul-iqtisad-islami-0660 hlm. 241} {cite:usul-iqtisad-islami-0660 hlm. 242}."
