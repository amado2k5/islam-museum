term: { ar: "زيج", en: "zij", la: "tabulae" }
summary:
  ar: "الزيج عند العرب كتاب يعرض الهيئة الكروية العليا وطرق حساب حركات الأجرام ويضم كل الجداول اللازمة، ويترك غالبًا مبادئ علم الهيئة؛ وترجمته بـ«الجداول» عند الأوروبيين غير دقيقة، والجدول عندهم اسم للجدول الواحد لشبه أعمدته بالجداول المائية {cite:nallino-albatenii-opus-astronomicum p. 40}."
  en: "Among the Arabs a zij is a book setting out higher spherical astronomy and the methods of celestial computation, with all the tables needed and usually without cosmographical rudiments; Europeans' rendering 'Tables' is inexact, a single table being a jadwal, named for the likeness of its columns to water channels {cite:nallino-albatenii-opus-astronomicum p. 40}."
  ur: "عربوں کے ہاں زیج وہ کتاب ہے جو اعلیٰ کروی ہیئت اور اجرامِ فلکی کے حساب کے طریقے، تمام ضروری جدولوں سمیت، بیان کرے اور عموماً ہیئت کے مبادی چھوڑ دے؛ یورپیوں کا اسے «جدولیں» ترجمہ کرنا غیر دقیق ہے، ایک جدول کو «جدول» کہتے ہیں کیونکہ اس کے کالم پانی کی نالیوں سے مشابہ ہیں {cite:nallino-albatenii-opus-astronomicum p. 40}."
