summary:
  ar: "الجنس في اللغة الضرب من كل شيء، وعند الفقهاء اسم يدل على كثيرين مختلفين بالأنواع. وتعتمد عليه أحكام الزكاة، فتُضم أنواع الجنس الواحد في النصاب ولا تُضم أجناس مختلفة، وأحكام الربا، وشروط المسلم فيه في السلم، والاختلاف في جنس المغصوب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6545} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6546} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6547}"
  en: "Jins in the language means a kind of anything. Among the jurists it names a set of different sorts. The concept governs several rulings: in zakat, animals or crops of one kind are combined toward the threshold while different kinds are not; in ribawi sales, the sameness of kind decides the rule; in salam (advance sale) the kind of the item promised must be stated; and in disputes over a usurped item, the kind of the thing is one of the points on which the parties may disagree. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6545} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6546} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6547}"
