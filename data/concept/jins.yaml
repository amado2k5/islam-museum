id: concept/jins
class: concept
kind: legal
label: { ar: "الجنس", en: "Jins (kind or genus in fiqh)", es: "Jins (tipo o género en fiqh)", fr: "Jins (espèce ou genre en fiqh)" }
summary:
  ar: "الجنس في اللغة الضرب من كل شيء، وعند الفقهاء اسم يدل على كثيرين مختلفين بالأنواع. وتعتمد عليه أحكام الزكاة، فتُضم أنواع الجنس الواحد في النصاب ولا تُضم أجناس مختلفة، وأحكام الربا، وشروط المسلم فيه في السلم، والاختلاف في جنس المغصوب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6545} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6546} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6547}"
  en: "Jins in the language means a kind of anything. Among the jurists it names a set of different sorts. The concept governs several rulings: in zakat, animals or crops of one kind are combined toward the threshold while different kinds are not; in ribawi sales, the sameness of kind decides the rule; in salam (advance sale) the kind of the item promised must be stated; and in disputes over a usurped item, the kind of the thing is one of the points on which the parties may disagree. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6545} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6546} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6547}"
  es: "En el idioma kuwaití, \"jins\" significa \"un tipo de cualquier cosa\". Entre los juristas, designa un conjunto de diferentes clases. El concepto rige varias normas: en el zakat, los animales o cultivos de una misma clase se combinan para alcanzar el umbral, mientras que los de diferentes clases no; en las ventas ribawi, la igualdad de la clase determina la regla; en el salam (venta anticipada), debe especificarse la clase del artículo prometido; y en las disputas sobre un artículo usurpado, la clase de la cosa es uno de los puntos en los que las partes pueden discrepar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6545} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6546} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.6547}"
  fr: "En kuwa, le terme « jins » désigne une catégorie quelconque. Chez les juristes, il englobe un ensemble de catégories différentes. Ce concept régit plusieurs règles: en matière de zakat, les animaux ou les récoltes d’une même catégorie sont cumulés pour le calcul du seuil, contrairement aux catégories différentes; dans les ventes ribawi, l’identité de la catégorie détermine la règle; dans le salam (vente à terme), la catégorie du bien promis doit être précisée; et dans les litiges relatifs à un bien usurpé, la catégorie du bien constitue un point de désaccord possible entre les parties."
