  es: "Kamadrius (roble terrestre)"
  fr: "Kamadrius (chêne rampant)"
summary:
  ar: "كمادريوس نبات ذو قضبان وورق متهشم في غلظ الريحان، وعشبه يسمى عند اليونانيين بلوط الأرض لورقه الصغير الشبيه بورق البلوط. وهو عند جالينوس حار يابس في الثالثة، مفتح مقطع ملطف."
  en: "Kamadrius is a plant with stems and crumbled leaves about as thick as basil. The Greeks called it ground oak because of its small bitter leaves like oak leaves. Galen classes it as hot and dry in the third degree; the book describes it as opening, cutting, thinning and warming."
  ur: "کمادریوس ایک پودا ہے جس کی ٹہنیاں اور ٹوٹے ہوئے پتے تلسی جتنے موٹے ہوتے ہیں۔ یونانی اسے زمینی بلوط کہتے تھے کیونکہ اس کے چھوٹے کڑوے پتے بلوط کے پتوں جیسے ہوتے ہیں۔ جالینوس اسے تیسرے درجے میں گرم اور خشک بتاتے ہیں؛ کتاب اسے کھولنے، کاٹنے، پتلا کرنے اور گرم کرنے والا بیان کرتی ہے۔"
  es: "Kamadrius es una planta con tallos y hojas desmenuzadas, de un grosor similar al de la albahaca. Los griegos la llamaban roble molido por sus pequeñas hojas amargas, parecidas a las del roble. Galeno la clasifica como cálida y seca en tercer grado; el libro la describe como una planta que abre, corta, adelgaza y calienta."
  fr: "Le kamadrius est une plante aux tiges et aux feuilles flétries, d'une épaisseur comparable à celle du basilic. Les Grecs l'appelaient chêne de terre en raison de ses petites feuilles amères, semblables à celles du chêne. Galien le classe parmi les plantes chaudes et sèches du troisième degré; son ouvrage le décrit comme ouvrant, coupant, éclaircissant et réchauffant."
