id: concept/infisakh
class: concept
kind: legal
label: { ar: "الانفساخ", en: "Infisakh (the dissolution of a contract by itself, by the parties, or by a supervening cause)", es: "Infisakh (la disolución de un contrato por sí mismo, por las partes o por una causa sobrevenida)", fr: "Infisakh (la dissolution d'un contrat de lui-même, par les parties ou par une cause survenante)", ur: "انفسخ ⁦(کسی معاہدے کو خود، فریقین، یا کسی نگرانی کی وجہ سے تحلیل کرنا)⁩", tr: "çöküş", id: "Runtuh" }
summary:
  ar: "الانفساخ لغة مطاوعة الفسخ بمعنى النقض والزوال، وعند الفقهاء انحلال العقد إما بنفسه، وإما بإرادة المتعاقدين أو أحدهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3520} والفسخ حل ارتباط العقد بإرادة أحد العاقدين أو كليهما أو بحكم القاضي، والانفساخ قد يكون أثرا للفسخ أو نتيجة لعوامل خارجة عن إرادة العاقدين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3522}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3523} وينفسخ العقد بتلف المعقود عليه في العقود المستمرة كالإجارة، لا في العقود الفورية بعد القبض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3524}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3525} وينفسخ عقد الإجارة بموت أحد العاقدين عند الحنفية إن عقدها لنفسه، وعند الجمهور لا ينفسخ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3526}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3527} وتنفسخ العقود غير اللازمة كالعارية والوكالة والشركة بموت أحد العاقدين أو بجنونه في الجملة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3527}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3528}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3529} وينفسخ البيع بالاستحقاق أو الغصب في بعض المذاهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3531}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3532} والعقد قبل الانفساخ موجود ذو أثر، أما الباطل فلا وجود له عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3521} وانفساخ العقد المستمر يرفعه من حينه، والعقد الفوري يرفع من أصله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3534}"
  en: "Infisakh is lexically the reflexive of fasakh, meaning undoing and passing away. For the jurists it is the dissolution of a contract either of itself or by the will of the parties or one of them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3520} Fasakh is undoing the tie by the will of one or both parties or by a judge; infisakh may be its result or the result of a cause beyond the parties' will. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3522}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3523} A continuing contract such as a hire dissolves when its object perishes, but an immediate contract does not dissolve after receipt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3524}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3525} The Hanafis hold a hire dissolved by the death of a party who made it for himself; the majority hold it not dissolved. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3526}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3527} Non-binding contracts such as loan, agency and partnership are generally dissolved by the death or madness of a party. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3527}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3528}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3529} A sale is dissolved by the claim of a third party or by usurpation in some schools. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3531}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3532} A contract before dissolution exists and has effect, whereas for the Hanafis a void contract has no existence at all. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3521} A continuing contract is dissolved from that moment, an immediate one is undone from its origin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3534}"
  es: "Infisakh es léxicamente el reflexivo de fasakh, que significa deshacer y desaparecer. Para los juristas es la disolución de un contrato ya sea por sí mismo o por la voluntad de las partes o de una de ellas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3520} Fasakh es deshacer el vínculo por la voluntad de una o ambas partes o por un juez; infisakh puede ser su resultado o el resultado de una causa más allá de la voluntad de las partes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3522}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3523} Un contrato continuo como un alquiler se disuelve cuando su objeto perece, pero un contrato inmediato no se disuelve después de la recepción. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3524}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3525} Los hanafíes sostienen que un contrato de arrendamiento se disuelve con la muerte de la parte que lo realizó para sí misma; la mayoría sostiene que no se disuelve. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3526}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3527} Los contratos no vinculantes, como los de préstamo, agencia y sociedad, generalmente se disuelven con la muerte o la locura de una de las partes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3527}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3528}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3529} Una venta se disuelve por la reclamación de un tercero o por usurpación en algunas escuelas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3531}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3532} Un contrato antes de la disolución existe y tiene efecto, mientras que para los Hanafis un contrato nulo no existe en absoluto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3521} Un contrato continuo se disuelve desde ese momento, uno inmediato se deshace desde su origen. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.3534}"
  fr: "Infisakh est le pronom réfléchi de fasakh, signifiant défaire et disparaître. Pour les juristes, il s'agit de la dissolution d'un contrat, soit spontanément, soit par la volonté des parties ou de l'une d'entre elles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3520} Fasakh désigne la rupture du lien par la volonté d'une ou des deux parties, ou par un juge; infisakh peut en être la conséquence ou résulter d'une cause indépendante de la volonté des parties. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3522}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3523} Un contrat à durée indéterminée, tel qu'un contrat de location, se dissout lorsque son objet disparaît, tandis qu'un contrat à terme immédiat ne se dissout pas après sa réception. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3524}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3525} Les hanafites considèrent qu'un contrat de location est dissous par le décès de l'un des parties qui l'a conclu; la majorité considère qu'il n'est pas dissous. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3526}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3527} Les contrats non contraignants tels que les prêts, les mandats et les partenariats sont généralement dissous par le décès ou l'incapacité mentale d'une partie. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3527}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3528}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3529} Une vente est dissoute par la revendication d'un tiers ou par usurpation, selon certaines écoles. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3531}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3532} Un contrat avant sa dissolution existe et produit ses effets, tandis que pour les Hanafites, un contrat nul n'a aucune existence. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3521} Un contrat continu est dissous à compter de son exécution, un contrat immédiat est annulé dès son origine. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3534}"
  ur: "انفسخ لغوی طور پر فاسخ کا اضطراری ہے، جس کا مطلب ہے ختم کرنا اور مر جانا۔ فقہاء کے نزدیک یہ خود یا فریقین یا ان میں سے کسی ایک کی مرضی سے کسی معاہدے کو تحلیل کرنا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3520} فاسخ ایک یا دونوں فریقوں یا جج کی مرضی سے ٹائی کو ختم کرنا ہے۔ infisakh اس کا نتیجہ ہو سکتا ہے یا فریقین کی مرضی سے باہر کسی وجہ کا نتیجہ ہو سکتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.3522}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3523} ایک جاری معاہدہ جیسے کہ کرایہ اس کی چیز کے ختم ہونے پر تحلیل ہوجاتا ہے، لیکن فوری معاہدہ وصولی کے بعد تحلیل نہیں ہوتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.3524}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3525} احناف ایک ایسی جماعت کی موت سے تحلیل شدہ کرایہ رکھتے ہیں جس نے اسے اپنے لیے بنایا تھا۔ اکثریت اسے تحلیل نہیں کرتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.3526}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3527} قرض، ایجنسی اور شراکت داری جیسے غیر پابند معاہدے عام طور پر کسی فریق کی موت یا پاگل پن سے تحلیل ہو جاتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 p.3527}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3528}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3529} فروخت کو کسی تیسرے فریق کے ذریعہ ہمارے اسکولوں میں یا کسی تیسرے فریق کے ذریعہ تحلیل کیا جاتا ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3531}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3532} تحلیل سے پہلے ایک معاہدہ موجود ہے اور اس کا اثر بھی ہے، جبکہ احناف کے نزدیک باطل عقد کا کوئی وجود نہیں ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 3521} ایک جاری معاہدہ اسی لمحے سے تحلیل ہو جاتا ہے، فوری طور پر اس کی اصل سے منسوخ ہو جاتا ہے۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 3534}"
  tr: "Dilsel olarak fesh, iptal anlamına gelir ve feshet anlamına gelir. Hukukçulara göre, sözleşme ya kendi başına, ya tarafların iradesiyle ya da bir veya her iki tarafın iradesiyle feshedilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3520} Fesh, sözleşmenin bir veya her iki tarafın iradesiyle ya da hakimin kararıyla feshedilmesidir. Fesh, feshi sonucu veya tarafların iradesinin ötesinde nedenlerle gerçekleşebilir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3522} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3523} ve sözleşme, sözleşmenin devam eden sözleşmelerde, örneğin kira sözleşmelerinde meydana gelen zararla feshedilir, mülkiyetten sonraki hemen sözleşmelerde değil. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3524} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3525} Kira sözleşmesi, Hanefi okuluna göre sözleşme kendisi için ise, sözleşme taraflardan birinin ölümü halinde iptal edilir, ancak çoğunluğa göre iptal edilmez. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3526} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3527} ve genel davada taraflardan birinin ölümü veya akıl hastalığı durumunda kira sözleşmesi, vekaletname ve ortaklık gibi gereksiz sözleşmelerin iptali. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3527} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3528} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3529} ve bazı okullarda hak veya gasp yoluyla satışı iptal eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3531} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3532} Fesiminden önceki sözleşme geçerli olurken, Hanefilere göre yalan yoktur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3521} Sürekli sözleşmenin iptali, o zamandan itibaren sözleşmeyi kaldırır ve hemen sözleşme kökeninden kaldırılır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.3534}"
  id: "Penghentian secara linguistik mengikuti pembatalan berarti pembatalan dan pembubaran. Menurut ahli hukum, kontrak dibubarkan baik dengan sendirinya, atas kehendak para pihak yang berkontrak, atau oleh kehendak salah satu atau kedua pihak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3520} Pembatalan adalah pembubaran kontrak atas kehendak salah satu atau kedua pihak yang berkontrak atau oleh putusan hakim. Penghentian dapat merupakan akibat dari pengakhiran atau akibat dari faktor-faktor di luar kehendak para pihak yang berkontrak. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3522} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3523} dan kontrak diakhiri karena kerugian yang dikontrak dalam kontrak yang sedang berjalan seperti sewa, bukan dalam kontrak segera setelah kepemilikan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3524} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3525} Kontrak sewa dibatalkan setelah kematian salah satu pihak yang berkontrak, menurut mazhab Hanafi jika kontrak itu untuk dirinya sendiri, tetapi menurut mayoritas, kontrak tersebut tidak dibatalkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3526} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3527} dan pembatalan kontrak yang tidak perlu seperti sewa, agen pengacara, dan kemitraan setelah kematian atau gangguan jiwa salah satu pihak kontrak dalam kasus umum. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3527} dan pembatalan kontrak yang tidak perlu seperti sewa, agen pengacara, dan kemitraan setelah kematian atau gangguan jiwa salah satu pihak yang berkontrak dalam kasus umum. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3527} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3528} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3529} dan membatalkan penjualan berdasarkan hak atau pengambilalihan di beberapa sekolah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3531} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3532} Kontrak sebelum pengakhiran berlaku secara efektif, sedangkan kebohongan tidak ada menurut Hanafi. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.3521} Pembatalan kontrak berkelanjutan mengangkatnya dari waktu itu, dan kontrak langsung dicabut dari asalnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3534}"
