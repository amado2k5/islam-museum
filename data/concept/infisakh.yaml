id: concept/infisakh
class: concept
kind: legal
label: { ar: "الانفساخ", en: "Infisakh (the dissolution of a contract by itself, by the parties, or by a supervening cause)" }
summary:
  ar: "الانفساخ لغة مطاوعة الفسخ بمعنى النقض والزوال، وعند الفقهاء انحلال العقد إما بنفسه، وإما بإرادة المتعاقدين أو أحدهما. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3520} والفسخ حل ارتباط العقد بإرادة أحد العاقدين أو كليهما أو بحكم القاضي، والانفساخ قد يكون أثرا للفسخ أو نتيجة لعوامل خارجة عن إرادة العاقدين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3522}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3523} وينفسخ العقد بتلف المعقود عليه في العقود المستمرة كالإجارة، لا في العقود الفورية بعد القبض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3524}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3525} وينفسخ عقد الإجارة بموت أحد العاقدين عند الحنفية إن عقدها لنفسه، وعند الجمهور لا ينفسخ. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3526}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3527} وتنفسخ العقود غير اللازمة كالعارية والوكالة والشركة بموت أحد العاقدين أو بجنونه في الجملة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3527}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3528}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3529} وينفسخ البيع بالاستحقاق أو الغصب في بعض المذاهب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3531}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3532} والعقد قبل الانفساخ موجود ذو أثر، أما الباطل فلا وجود له عند الحنفية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3521} وانفساخ العقد المستمر يرفعه من حينه، والعقد الفوري يرفع من أصله. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3534}"
  en: "Infisakh is lexically the reflexive of fasakh, meaning undoing and passing away. For the jurists it is the dissolution of a contract either of itself or by the will of the parties or one of them. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3520} Fasakh is undoing the tie by the will of one or both parties or by a judge; infisakh may be its result or the result of a cause beyond the parties' will. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3522}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3523} A continuing contract such as a hire dissolves when its object perishes, but an immediate contract does not dissolve after receipt. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3524}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3525} The Hanafis hold a hire dissolved by the death of a party who made it for himself; the majority hold it not dissolved. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3526}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3527} Non-binding contracts such as loan, agency and partnership are generally dissolved by the death or madness of a party. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3527}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3528}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3529} A sale is dissolved by the claim of a third party or by usurpation in some schools. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3531}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3532} A contract before dissolution exists and has effect, whereas for the Hanafis a void contract has no existence at all. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3521} A continuing contract is dissolved from that moment, an immediate one is undone from its origin. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.3534}"
