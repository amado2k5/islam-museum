label: { ar: "قوة الأجرام في الاتصالات", en: "The strength of the bodies in the aspects", ur: "اتصالات میں اجرام کی قوت" }
summary:
  ar: "يذكر النص أن قوة الشمس في الاتصالات تقع على خمس عشرة درجة أمامها ومثلها خلفها، وقوة القمر والمشتري على اثنتي عشرة درجة أمامهما وخلفهما، وقوة الزهرة ثمانية أجزاء، وقوة المريخ وعطارد وزحل سبعة أجزاء من أمامها وخلفها. والأقدار القوية هي التي ذكرت في باب عظم الأجرام وأقطارها. {cite:zij-sabi-nallino-byblion p.199}"
  en: "The text gives the strength of the Sun in aspects as fifteen degrees ahead and behind, that of the Moon and Jupiter as twelve degrees ahead and behind, that of Venus as eight parts, and those of Mars, Mercury and Saturn as seven parts each ahead and behind. The strong measures are those given in the chapter on the sizes of the bodies and their diameters. {cite:zij-sabi-nallino-byblion p.199}"
  ur: "متن سورج کی اتصالات میں قوت آگے اور پیچھے پندرہ درجے، چاند اور مشتری کی بارہ درجے آگے اور پیچھے، زہرہ کی آٹھ اجزا، اور مریخ، عطارد اور زحل کی سات سات اجزا آگے اور پیچھے بتاتا ہے۔ قوی پیمانے وہی ہیں جو اجرام کی جسامت اور قطروں کے باب میں بیان ہوئے۔ {cite:zij-sabi-nallino-byblion p.199}"
