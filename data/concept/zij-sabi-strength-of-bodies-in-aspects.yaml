id: concept/zij-sabi-strength-of-bodies-in-aspects
class: concept
kind: scientific
label: { ar: "قوة الأجرام في الاتصالات", en: "The strength of the bodies in the aspects", ur: "اتصالات میں اجرام کی قوت", es: "La fuerza de los cuerpos en los aspectos", fr: "La force des corps dans les aspects", tr: "İletişimde gök cisimlerinin gücü", id: "Kekuatan benda-benda langit dalam komunikasi" }
summary:
  ar: "يذكر النص أن قوة الشمس في الاتصالات تقع على خمس عشرة درجة أمامها ومثلها خلفها، وقوة القمر والمشتري على اثنتي عشرة درجة أمامهما وخلفهما، وقوة الزهرة ثمانية أجزاء، وقوة المريخ وعطارد وزحل سبعة أجزاء من أمامها وخلفها. والأقدار القوية هي التي ذكرت في باب عظم الأجرام وأقطارها. {cite:zij-sabi-nallino-byblion p.199}"
  en: "The text gives the strength of the Sun in aspects as fifteen degrees ahead and behind, that of the Moon and Jupiter as twelve degrees ahead and behind, that of Venus as eight parts, and those of Mars, Mercury and Saturn as seven parts each ahead and behind. The strong measures are those given in the chapter on the sizes of the bodies and their diameters. {cite:zij-sabi-nallino-byblion p.199}"
  ur: "متن سورج کی اتصالات میں قوت آگے اور پیچھے پندرہ درجے، چاند اور مشتری کی بارہ درجے آگے اور پیچھے، زہرہ کی آٹھ اجزا، اور مریخ، عطارد اور زحل کی سات سات اجزا آگے اور پیچھے بتاتا ہے۔ قوی پیمانے وہی ہیں جو اجرام کی جسامت اور قطروں کے باب میں بیان ہوئے۔ {cite:zij-sabi-nallino-byblion p.199}"
  es: "El texto indica que la fuerza del Sol en sus aspectos es de quince grados hacia adelante y hacia atrás, la de la Luna y Júpiter de doce grados hacia adelante y hacia atrás, la de Venus de ocho partes, y las de Marte, Mercurio y Saturno de siete partes cada una hacia adelante y hacia atrás. Las medidas de fuerza son las que se dan en el capítulo sobre los tamaños de los cuerpos y sus diámetros. {cite:zij-sabi-nallino-byblion p.199}"
  fr: "Le texte indique la force du Soleil en aspect à quinze degrés en avant et en arrière, celle de la Lune et de Jupiter à douze degrés en avant et en arrière, celle de Vénus à huit parties, et celles de Mars, Mercure et Saturne à sept parties chacune en avant et en arrière. Les mesures de force sont celles données dans le chapitre sur les dimensions des corps et leurs diamètres. {cite:zij-sabi-nallino-byblion p.199}"
  tr: "Metinde, Güneş'in kavuşum halindeki enerjisinin önünde on beş derece ve arkasında on beş derece, Ay ve Jüpiter'in enerjisinin önünde ve arkasında on iki derece, Venüs'ün enerjisinin sekiz kısım, Mars, Merkür ve Satürn'ün enerjisinin ise önünde ve arkasında yedi kısım olduğu belirtilmektedir. En güçlü enerjiler, gök cisimlerinin büyüklüğü ve çapları hakkındaki bölümde bahsedilenlerdir. {cite:zij-sabi-nallino-byblion s.199}"
  id: "Teks tersebut menyatakan bahwa energi Matahari dalam konjungsi terletak lima belas derajat di depannya dan lima belas derajat di belakangnya, energi Bulan dan Jupiter terletak dua belas derajat di depannya dan di belakangnya, energi Venus adalah delapan bagian, dan energi Mars, Merkurius, dan Saturnus adalah tujuh bagian di depannya dan di belakangnya. Energi terkuat adalah yang disebutkan dalam bab tentang ukuran dan diameter benda-benda langit. {cite:zij-sabi-nallino-byblion p.199}"
