id: "concept/al-laqua"
class: "concept"
kind: "scientific"
label:
  ar: "اللقوة"
  en: "Facial palsy (laqua)"
  fr: "La paralysie faciale (laqua)"
  ur: "لقوہ"
  es: "parálisis facial (laqua)"
  tr: "Güç"
  id: "Güç"
summary:
  ar: "اللقوة علة آلية في الوجه ينجذب لها شقّ من الوجه إلى جهة غير طبيعية فتتغير هيئته الطبيعية وتزول جودة التقاء الشفتين والجفنين من شقّ؛ وسببه إما استرخاء وإما تشنج لعضل الأجفان والوجه، والكائن عن التشنج هو الأكثري {cite:canon-ibn-sina-print-v2 p.154}"
  en: "Laqua is an instrumental disorder in the face by which a side of the face is drawn toward an unnatural direction, so its natural shape changes and the good meeting of the lips and eyelids of one side is lost; its cause is either a relaxation or a convulsion of the muscles of the eyelids and face, and that arising from convulsion is the majority {cite:canon-ibn-sina-print-v2 p.154}"
  fr: "La laqua est un trouble instrumental du visage par lequel un côté du visage est tiré dans une direction non naturelle, si bien que sa forme naturelle change et que la bonne jonction des lèvres et des paupières d’un côté se perd ; sa cause est soit un relâchement, soit une convulsion des muscles des paupières et du visage, et celle qui naît de la convulsion est la plus fréquente {cite:canon-ibn-sina-print-v2 p.154}"
  ur: "لقوہ چہرے کی ایک آلی علت ہے جس سے چہرے کا ایک شق غیر فطری جهت کی طرف کھنچ جاتا ہے تو اس کی فطری ہیئت بدل جاتی ہے اور ایک شق کے ہونٹوں اور پلکوں کا اچھا ملنا جاتا رہتا ہے؛ اور اس کا سبب یا تو استرخاء ہے یا پلکوں اور چہرے کی عضلوں کا تشنج، اور تشنج سے ہونے والا اکثری ہے {cite:canon-ibn-sina-print-v2 p.154}۔"
  es: "La laqua es un trastorno instrumental del rostro por el cual un lado de la cara se desvía hacia una dirección antinatural, alterando así su forma natural y perdiéndose la correcta unión de los labios y los párpados de ese lado; su causa es una relajación o una convulsión de los músculos de los párpados y la cara, siendo la convulsión la más frecuente {cite:canon-ibn-sina-print-v2 p.154}."
  tr: "Güç, yüzün bir yarığının anormal bir tarafa çekilmesine neden olan mekanik bir yüz rahatsızlığıdır; bu da çatlaktan dolayı doğal şeklini değiştirir ve dudak ile göz kapaklarının buluşma kalitesini kaybeder; bunun nedeni göz kapağı ve yüz kaslarının gevşemesi veya spazmıdır ve en yaygın kramp nedeni {cite:canon-ibn-sina-print-v2 s.154}"
  id: "Gaya adalah gangguan mekanis di wajah yang menyebabkan celah wajah tertarik ke sisi yang tidak normal; ini mengubah bentuk alaminya akibat retakan dan kehilangan kualitas bertemu bibir dan kelopak mata; ini disebabkan oleh relaksasi atau kejang pada kelopak mata dan otot wajah, dan penyebab kram yang paling umum adalah {cite:canon-ibn-sina-print-v2 hlm.154}"
