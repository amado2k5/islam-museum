id: concept/profit-maximisation-in-islam
class: concept
kind: ethical
tags: [islamic-economy-browser, islamic-economy-money]
label:
  ar: "تعظيم الربح وتقليل الخسارة"
  en: "Maximisation of profit and minimisation of loss"
  es: "Maximización de beneficios y minimización de pérdidas."
  fr: "Maximisation des profits et minimisation des pertes"
  ur: "نفع کو زیادہ سے زیادہ اور نقصان کو کم سے کم کرنا"
  tr: "Kârı maksimize etmek ve zararları en aza indirmek"
  id: "Memaksimalkan keuntungan dan meminimalkan kerugian"
summary:
  ar: "يضع المؤلف مبدأين في اختيار الاستثمار: تعظيم الربح، أي اختيار الأعلى ربحاً حين تتساوى الأمور، وتقليل الخسائر، أي اختيار الأقل خسارة حين لا يُجتنب الوضعان معاً {cite:usul-iqtisad-islami-0660 p. 208}. ويرى أن تعظيم الربح جائز في الإسلام إذا كان من حلال، وأن الفقهاء عظّموا الأرباح قبل أن يعرف الغرب علم الاقتصاد {cite:usul-iqtisad-islami-0660 p. 287} {cite:usul-iqtisad-islami-0660 p. 295}."
  tr: "Yazar, yatırım seçerken iki ilke belirler: kârı maksimize etmek, yani eşit olduğunda en yüksek karı seçmek ve zararı en aza indirmek, yani her iki durum birlikte önlenmediğinde en az kaybı seçmek {cite:usul-iqtisad-islami-0660 s. 208}. Kârı maksimize etmenin İslam'da yasal ise izin verilebilir olduğuna ve hukukçuların Batı ekonomiyi bilmeden önce kârı maksimize ettiğine inanır {cite:usul-iqtisad-islami-0660 s. 287} {cite:usul-iqtisad-islami-0660 s. 295}."
  id: "Penulis menetapkan dua prinsip dalam memilih investasi: memaksimalkan keuntungan, artinya memilih keuntungan tertinggi ketika keadaan setara, dan meminimalkan kerugian, artinya memilih kerugian paling sedikit ketika kedua situasi tidak dihindari bersamaan {cite:usul-iqtisad-islami-0660 hlm. 208}. Ia percaya bahwa memaksimalkan keuntungan diperbolehkan dalam Islam jika itu sah, dan bahwa para ahli hukum memaksimalkan keuntungan sebelum Barat mengetahui ekonomi {cite:usul-iqtisad-islami-0660 hlm. 287} {cite:usul-iqtisad-islami-0660 hlm. 295}."
