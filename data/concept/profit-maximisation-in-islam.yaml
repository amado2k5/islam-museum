summary:
  ar: "يضع المؤلف مبدأين في اختيار الاستثمار: تعظيم الربح، أي اختيار الأعلى ربحاً حين تتساوى الأمور، وتقليل الخسائر، أي اختيار الأقل خسارة حين لا يُجتنب الوضعان معاً {cite:usul-iqtisad-islami-0660 p. 208}. ويرى أن تعظيم الربح جائز في الإسلام إذا كان من حلال، وأن الفقهاء عظّموا الأرباح قبل أن يعرف الغرب علم الاقتصاد {cite:usul-iqtisad-islami-0660 p. 287} {cite:usul-iqtisad-islami-0660 p. 295}."
