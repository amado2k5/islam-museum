label:
  ar: "التخلية"
  en: "Takhliya (making a thing available to the taker)"
  ur: "تخلیہ (قبضے کے لیے چیز کو خالی کر کے حوالے کرنا)"
summary:
  ar: "التخلية تمكين الشخص من التصرف في الشيء دون مانع، وهي نوع من التسليم وأثره القبض. وهي قبض في العقار باتفاق، أما المنقول ففيه خلاف بين المذاهب، والضمان ينتقل بالقبض من ذمة المخلي إلى ذمة القابض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4827} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4828} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4829}"
  en: "Takhliya is enabling a person to deal with a thing without any obstacle. It is a form of delivery whose effect is taking possession (qabd). For real property it is possession by agreement; for movables the schools differ; and with possession, liability passes from the giver to the taker. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4827} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4828} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4829}"
