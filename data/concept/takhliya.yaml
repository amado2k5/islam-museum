id: concept/takhliya
class: concept
kind: legal
label:
  ar: "التخلية"
  en: "Takhliya (making a thing available to the taker)"
  ur: "تخلیہ ⁦(قبضے کے لیے چیز کو خالی کر کے حوالے کرنا)⁩"
  es: "Takhliya (poner algo a disposición del que lo toma)"
  fr: "Takhliya (mettre quelque chose à la disposition de celui qui le prend)"
  tr: "tahliye"
  id: "evakuasi"
summary:
  ar: "التخلية تمكين الشخص من التصرف في الشيء دون مانع، وهي نوع من التسليم وأثره القبض. وهي قبض في العقار باتفاق، أما المنقول ففيه خلاف بين المذاهب، والضمان ينتقل بالقبض من ذمة المخلي إلى ذمة القابض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4827} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4828} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4829}"
  en: "Takhliya is enabling a person to deal with a thing without any obstacle. It is a form of delivery whose effect is taking possession (qabd). For real property it is possession by agreement; for movables the schools differ; and with possession, liability passes from the giver to the taker. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4827} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4828} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4829}"
  es: "Takhliya es capacitar a una persona para disponer de algo sin ningún obstáculo. Es una forma de entrega cuyo efecto es la toma de posesión (qabd). Para los bienes inmuebles, se trata de posesión por acuerdo; para los bienes muebles, las escuelas difieren; y con la posesión, la responsabilidad pasa del que da al que recibe. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4827} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4828} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4829}"
  fr: "La takhliya consiste à permettre à une personne de disposer d'un bien sans obstacle. C'est une forme de transfert dont l'effet est la prise de possession (qabd). Pour les biens immobiliers, il s'agit d'une possession par accord; pour les biens mobiliers, les écoles divergent; et avec la possession, la responsabilité est transférée du donateur au bénéficiaire. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4827} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4828} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.4829}"
  ur: "تقلیہ کسی شخص کو بغیر کسی رکاوٹ کے کسی چیز سے نمٹنے کے قابل بناتا ہے۔ یہ ترسیل کی ایک شکل ہے جس کا اثر قبضہ ⁦(قابد)⁩ ہے۔ حقیقی املاک کے لیے یہ معاہدہ کے ذریعے ملکیت ہے۔ منقولہ کے لیے اسکول مختلف ہیں؛ اور قبضے کے ساتھ، ذمہ داری دینے والے سے لینے والے تک پہنچ جاتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 ص4827} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ4828}"
  tr: "Çıkarma, bir kişinin bir şeyi engellenmeden elden çıkarabilme yeteneğidir. Etkisi mülkiyet olan bir teslim türüdür. Mülkiyete anlaşma yoluyla sahip olma vardır, ancak düşünce okulları arasında anlaşmazlıklar vardır ve mülkiyet yoluyla sorumluluk sahipten sahipe geçer. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4827} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4828} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.4829}"
  id: "Penggusuran adalah kemampuan seseorang untuk melepaskan sesuatu tanpa hambatan. Ini adalah jenis penyerahan yang efeknya adalah kepemilikan. Ini adalah kepemilikan properti berdasarkan kesepakatan, tetapi ada perbedaan pendapat di antara aliran pemikiran, dan peralihan tanggung jawab melalui kepemilikan dari pemilik ke pemilik. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4827} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4828} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.4829}"
