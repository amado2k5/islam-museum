summary:
  ar: "يفتتح ابن سينا الفصل الخامس والعشرين في معالجات الأورام بأنواعها وأسبابها، ويقرر أنه لا تقرب المحللات في الابتداء بل تصلح الأعضاء وتستعمل القابضات الرادعة، ثم يرتب مزجها بالمحللات بحسب المراحل {cite:canon-ibn-sina-print-v1 p.304}."
  en: "Ibn Sina opens chapter 25, on the treatment of swellings, with their kinds and causes, and sets the rule that dissolvers are not brought near at the beginning, but the organs are set right and repelling astringents used, then orders how to mix them with dissolvers by the stages {cite:canon-ibn-sina-print-v1 p.304}."
  es: "Ibn Sina abre el capítulo 25, sobre el tratamiento de las hinchazones, con sus tipos y causas, y establece la regla de que los disolventes no se acercan al principio, sino que se colocan los órganos en su sitio y se utilizan astringentes repelentes, luego ordena cómo mezclarlos con los disolventes por etapas {cite:canon-ibn-sina-print-v1 p.304}."
