id: concept/bish
class: concept
kind: natural
label:
  ar: "بيش"
  en: "Bish (aconite, a deadly poison)"
  fr: "Bish (aconit, poison mortel)"
  ur: "بیش ⁦(زہرِ قاتل)⁩"
  es: "Bish (acónito, un veneno mortal)"
  tr: "Ne kadar"
  id: "Berapa banyak"
summary:
  ar: "سمّ قاتل، في غاية الحرارة واليبوسة، وفيه ما يذكره الكتاب من إذهاب البرص بطلاء أو شرب، لكنه يفسخ شاربه، وترياقه فأر البيش ومعجون المسك على ما ذكر الكتاب {cite:canon-ibn-sina-print-v1 p.408}."
  en: "A deadly poison, extremely hot and dry. The book lists its use for leprosy by application or drink, but it destroys the drinker, and its antidotes are the bish-mouse and a musk-based electuary {cite:canon-ibn-sina-print-v1 p.408}."
  fr: "Poison mortel, extrêmement chaud et sec. Le livre mentionne son usage contre la lèpre, appliqué ou bu, mais il tue celui qui le boit. Ses antidotes seraient la souris du bish et un électuaire à base de musc {cite:canon-ibn-sina-print-v1 p.408}."
  ur: "ایک جان لیوا زہر، انتہائی گرم اور خشک۔ کتاب اس کا برص میں لیپ یا پینے سے استعمال درج کرتی ہے، مگر یہ پینے والے کو ہلاک کر دیتا ہے؛ اس کے تریاق فأرِ البیش اور مشک کا معجون ہیں {cite:canon-ibn-sina-print-v1 p.408}۔"
  es: "Un veneno mortal, extremadamente caliente y seco. El libro menciona su uso para la lepra por aplicación o ingestión, pero destruye a quien lo bebe, y sus antídotos son el ratón bish y un electuario a base de almizcle {cite:canon-ibn-sina-print-v1 p.408}."
  tr: "Ölümcül bir zehir, son derece sıcak ve kuru, kitapta cüzzamlıyı boya veya içecekle çıkarmaktan bahsediyor, ancak bıyığını mahvediyor ve panzehiri kitapta bahsedilen bish fare ve misk macunu, {cite:canon-ibn-sina-print-v1 s.408} gibi bir ilaç kullanıyor."
  id: "Racun mematikan, sangat panas dan kering, dan mengandung apa yang disebutkan dalam buku tentang menghilangkan penderita kusta dengan cat atau minuman, tetapi merusak kumisnya, dan penawarnya adalah bish mouse dan pasta musk seperti yang disebutkan dalam buku {cite:canon-ibn-sina-print-v1 hlm.408}."
