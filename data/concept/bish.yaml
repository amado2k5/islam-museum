summary:
  ar: "سمّ قاتل، في غاية الحرارة واليبوسة، وفيه ما يذكره الكتاب من إذهاب البرص بطلاء أو شرب، لكنه يفسخ شاربه، وترياقه فأر البيش ومعجون المسك على ما ذكر الكتاب {cite:canon-ibn-sina-print-v1 p.408}."
  en: "A deadly poison, extremely hot and dry. The book lists its use for leprosy by application or drink, but it destroys the drinker, and its antidotes are the bish-mouse and a musk-based electuary {cite:canon-ibn-sina-print-v1 p.408}."
  ur: "ایک جان لیوا زہر، انتہائی گرم اور خشک۔ کتاب اس کا برص میں لیپ یا پینے سے استعمال درج کرتی ہے، مگر یہ پینے والے کو ہلاک کر دیتا ہے؛ اس کے تریاق فأرِ البیش اور مشک کا معجون ہیں {cite:canon-ibn-sina-print-v1 p.408}۔"
