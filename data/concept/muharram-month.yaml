id: concept/muharram-month
class: concept
kind: legal
label:
  ar: "شهر محرم"
  en: "Muharram (the first month, one of the sacred months, and the fast of 'Ashura)"
  es: "Muharram (el primer mes, uno de los meses sagrados, y el ayuno de Ashura)"
  fr: "Muharram (le premier mois, l'un des mois sacrés, et le jeûne d'Achoura)"
  ur: "محرم ⁦(پہلا مہینہ، حرمت والے مہینوں میں سے ایک اور عاشورہ کا روزہ)⁩"
  tr: "Muharrem ayı"
  id: "Bulan Muharram"
summary:
  ar: "محرم أول شهور السنة القمرية وأحد الأشهر الحرم الأربعة. وسماه النبي شهر الله المحرم، وجاء أن أفضل الصيام بعد رمضان شهر الله المحرم. وفيه يوم عاشوراء يصام في العاشر ويستحب التاسع معه، وكفّر صيامه سنة ماضية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3} {cite:athar-baqiya-thaqafa-2008}"
  en: "Muharram is the first month of the lunar year and one of the four sacred months. The Prophet called it the month of God, and the best fasting after Ramadan is in God's month of Muharram. In it falls 'Ashura, the tenth day, which is fasted, with the ninth recommended beside it, and its fast expiates the past year. {cite:fiqh-mawsua-kuwaitiyya-noor-v3} {cite:athar-baqiya-thaqafa-2008}"
  ur: "محرم قمری سال کا پہلا مہینہ اور چار حرمت والے مہینوں میں سے ایک ہے۔ نبی کریم نے اسے اللہ کا مہینہ کہا اور فرمایا کہ رمضان کے بعد بہترین روزہ اللہ کے مہینے محرم کا ہے۔ اس میں عاشورہ یعنی دسواں دن آتا ہے جس کا روزہ رکھا جاتا ہے اور نواں دن بھی اس کے ساتھ مستحب ہے، اور اس کا روزہ گزشتہ سال کا کفارہ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3} {cite:athar-baqiya-thaqafa-2008}"
  es: "Muharram es el primer mes del año lunar y uno de los cuatro meses sagrados. El Profeta lo llamó el mes de Dios, y el mejor ayuno después del Ramadán es en el mes de Muharram. En él cae Ashura, el décimo día, que se ayuna, con el noveno día recomendado junto a él, y su ayuno expía el año anterior. {cite:fiqh-mawsua-kuwaitiyya-noor-v3} {cite:athar-baqiya-thaqafa-2008}"
  fr: "Muharram est le premier mois du calendrier lunaire et l'un des quatre mois sacrés. Le Prophète l'a appelé le mois de Dieu, et le meilleur jeûne après Ramadan est celui observé durant ce mois béni. C'est durant ce mois qu'apparaît 'Achoura, le dixième jour, qui est consacré au jeûne, le neuvième jour étant également recommandé. Ce jeûne expie les péchés de l'année écoulée."
  tr: "Muharrem, ay yılının ilk ayıdır ve dört kutsal aydan biridir. Peygamber ona Allah Muharrem ayı adını vermiş ve Ramazan'dan sonra en iyi orucun Allah'ın ayı olan Muharrem olduğu bildirilmiştir. Bu gün, Aşura onuncusunda oruç tutulur, dokuzuncusunda da oruç tutulması tavsiye edilir ve önceki yıl oruç kurtulur. {alıntı:fiqh-mawsua-kuveytiyya-noor-v3} {kaynak:athar-baqiya-thaqafa-2008}"
  id: "Muharram adalah bulan pertama tahun lunar dan salah satu dari empat bulan suci. Nabi menamainya bulan Allah Muharram, dan dilaporkan bahwa puasa terbaik setelah Ramadan adalah bulan Allah, Muharram. Pada hari ini, Ashura berpuasa pada tanggal sepuluh dan disarankan berpuasa pada tanggal sembilan bersamaan, dan puasa ditebus pada tahun sebelumnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3} {cite:athar-baqiya-thaqafa-2008}"
