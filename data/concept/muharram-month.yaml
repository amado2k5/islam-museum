id: concept/muharram-month
class: concept
kind: legal
label:
  ar: "شهر محرم"
  en: "Muharram (the first month, one of the sacred months, and the fast of 'Ashura)"
summary:
  ar: "محرم أول شهور السنة القمرية وأحد الأشهر الحرم الأربعة. وسماه النبي شهر الله المحرم، وجاء أن أفضل الصيام بعد رمضان شهر الله المحرم. وفيه يوم عاشوراء يصام في العاشر ويستحب التاسع معه، وكفّر صيامه سنة ماضية. {cite:fiqh-mawsua-kuwaitiyya-noor-v3} {cite:athar-baqiya-thaqafa-2008}"
  en: "Muharram is the first month of the lunar year and one of the four sacred months. The Prophet called it the month of God, and the best fasting after Ramadan is in God's month of Muharram. In it falls 'Ashura, the tenth day, which is fasted, with the ninth recommended beside it, and its fast expiates the past year. {cite:fiqh-mawsua-kuwaitiyya-noor-v3} {cite:athar-baqiya-thaqafa-2008}"
  ur: "محرم قمری سال کا پہلا مہینہ اور چار حرمت والے مہینوں میں سے ایک ہے۔ نبی کریم نے اسے اللہ کا مہینہ کہا اور فرمایا کہ رمضان کے بعد بہترین روزہ اللہ کے مہینے محرم کا ہے۔ اس میں عاشورہ یعنی دسواں دن آتا ہے جس کا روزہ رکھا جاتا ہے اور نواں دن بھی اس کے ساتھ مستحب ہے، اور اس کا روزہ گزشتہ سال کا کفارہ ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3} {cite:athar-baqiya-thaqafa-2008}"
