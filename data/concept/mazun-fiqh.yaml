id: concept/mazun-fiqh
class: concept
kind: legal
label:
  ar: "المَأْذُون"
  en: "Permitted person (mazun): permission to trade and its limits"
  ur: "ماذون (تجارت کی اجازت یافتہ شخص)"
summary:
  ar: "المأذون لغة اسم مفعول من أذن، أي أباحه، والفقهاء يحذفون الصلة فيقولون العبد المأذون {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13776}. واصطلاحاً هو من فُكّ عنه الحجر وأذن له في التجارة والتصرف، من مولاه إن كان عبداً، ومن وليه إن كان صغيراً {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13776}. وجمهور الفقهاء يجيزون الإذن للمأذون إذا قام مبرر، والأصح عند الشافعية أنه لا يُؤذن للصغير في التجارة وإنما يتولى وليه العقد {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13776}. ويتقيد الإذن بالزمان والمكان ونوع التصرف، والحنفية يعممون الإذن الخاص، والمالكية يرون الإذن موقوفاً على إجازة الولي، والحنابلة يعتبرون الإذن بحسب ما حدده الولي {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13776-13778}. وتصرفات الصغير المأذون تتوزع بين النافع المحض، والضار المحض، والمتردد بينهما، فالهبة المطلقة يقبلها الصغير عند الجمهور، والتصرف الضار لا يصح ولو بالإذن، والمعاوضة قبل الإذن موقوفة عند الحنفية والمالكية، وبعد الإذن خلاف عند الشافعية والحنابلة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13778-13780}. وعند الحنفية والمالكية والحنابلة يصح تصرف السفيه المأذون له، والشافعية في الأصح لا يصح {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13780}. وإذا مات الآذن، فإن كان أباً انتهت الولاية وبطل الإذن، وإن كان وصياً انتهت الوصاية وبطل الإذن {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13780}."
  en: "Mazun, the past participle of adhina, means one to whom permission is given; the jurists drop the complement and say the permitted slave. In technical use it is a person whose restriction is lifted and who is permitted to trade and deal, by his master if a slave or by his guardian if a minor {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13776}. Most jurists allow permission to such a person when a reason exists; the preferred Shafi'i view is that a minor may not be permitted to trade, his guardian making the contract instead {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13776}. Permission is limited by time, place and kind of transaction; the Hanafis widen a narrow permission, the Malikis make it subject to the guardian's approval, and the Hanbalis hold the permission to what the guardian set {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13776-13778}. A permitted minor's dealings are of three kinds: pure benefit, pure harm, and in between. Accepting an unconditional gift is valid by most jurists; a harmful dealing is not valid even with permission; an exchange made before permission is suspended on the guardian's approval for the Hanafis and Malikis, and after permission the schools differ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13778-13780}. The Hanafis and Malikis validate a permitted fool's sales; the Shafi'is, in the preferred view, do not {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13780}. If the permitting person dies, a father's guardianship ends and the permission lapses, and a guardian's trusteeship ends with his death {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13780}."
  ur: "مأذون لغت میں اذن کا اسم مفعول ہے، یعنی جسے اجازت دی گئی، اور فقہاء صلہ حذف کر کے عبدِ مأذون کہتے ہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13776}۔ اصطلاح میں یہ وہ شخص ہے جس سے حجر اٹھا لیا گیا ہو اور اسے تجارت اور تصرف کی اجازت دی گئی ہو، غلام ہو تو اس کے آقا کی طرف سے، اور نابالغ ہو تو اس کے ولی کی طرف سے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13776}۔ جمہور کے نزدیک کسی مناسب سبب کی صورت میں اجازت دی جا سکتی ہے؛ شافعیہ کا اصح قول یہ ہے کہ نابالغ کو تجارت کی اجازت نہیں، بلکہ ولی عقد کرے گا {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13776}۔ اجازت وقت، جگہ اور تصرف کی نوع سے مقید ہوتی ہے؛ حنفیہ خاص اجازت کو عام کر دیتے ہیں، مالکیہ اجازت کو ولی کی منظوری پر موقوف رکھتے ہیں، اور حنابلہ اس حد تک اجازت مانتے ہیں جو ولی نے مقرر کی ہو {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13776-13778}۔ نابالغ مأذون کے تصرفات خالص نفع، خالص نقصان اور درمیانی صورت میں بٹتے ہیں؛ خالص نقصان والا تصرف اجازت کے باوجود درست نہیں؛ اجازت سے پہلے معاوضہ حنفیہ اور مالکیہ کے نزدیک ولی کی اجازت پر موقوف رہتا ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13778-13780}۔ سفیہ مأذون کی بیع حنفیہ اور مالکیہ کے نزدیک نافذ ہے، جبکہ شافعیہ کے اصح قول کے مطابق درست نہیں {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13780}۔ اجازت دینے والا باپ فوت ہو تو ولایت ختم ہو کر اجازت باطل ہو جاتی ہے، اور وصی ہو تو وصایت ختم ہو کر اجازت باطل ہو جاتی ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13780}۔"
