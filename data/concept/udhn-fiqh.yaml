  en: "Udhn (the ear: newborn's call, injury and blood-money, the woman's nakedness, sacrifice and ablution)"
  ur: "اذن (کان: نومولود کی اذان، جنایت اور دیت، عورت کا ستر، قربانی اور وضو)"
summary:
  ar: "الأذن عضو السمع، وهي غير السمع. وتتعلق بها أحكام: الأذان في أذن المولود اليمنى، والمنع من سماع المنكر، ودية الجناية عليها، وأنها من عورة المرأة لا من عورة الرجل، وأنها لا يعبر بها عن الجملة، وأحكامها في الأضحية والوسم.  p.2023}  p.2024}  p.2025}"
  en: "The ear (udhn) is the organ of hearing, distinct from hearing itself. Rulings attach to it: the call to prayer in a newborn's right ear, the duty to shut out what is forbidden, the blood-money for injury to it, its place in a woman's nakedness, the fact that it does not stand for the whole person, and its status in sacrifice and marking.  p.2023}  p.2024}  p.2025}"
  ur: "کان قوتِ سماعت کا عضو ہے، اور سماعت خود اس سے الگ ہے۔ اس سے متعلق احکام یہ ہیں: نومولود کے داہنے کان میں اذان، ممنوع آواز سننے سے بچنا، کان پر جنایت کی دیت، عورت کے ستر میں اس کا شمار، اس سے پورے انسان کی تعبیر نہ ہونا، اور قربانی و نشان میں اس کا حکم۔  p.2023}  p.2024}  p.2025}"
