label:
  ar: "أذن"
  en: "Udhn (the ear: newborn's call, injury and blood-money, the woman's nakedness, sacrifice and ablution)"
  ur: "اذن ⁦(کان: نومولود کی اذان، جنایت اور دیت، عورت کا ستر، قربانی اور وضو)⁩"
  es: "Udhn (el oído: el llanto del recién nacido, la herida y el dinero de sangre, la desnudez de la mujer, el sacrificio y la ablución)"
  fr: "Udhn (l'oreille: appel du nouveau-né, blessure et prix du sang, nudité de la femme, sacrifice et ablution)"
  tr: "Kulak"
  id: "Telinga"
summary:
  ar: "الأذن عضو السمع، وهي غير السمع. وتتعلق بها أحكام: الأذان في أذن المولود اليمنى، والمنع من سماع المنكر، ودية الجناية عليها، وأنها من عورة المرأة لا من عورة الرجل، وأنها لا يعبر بها عن الجملة، وأحكامها في الأضحية والوسم.  p.2023}  p.2024}  p.2025}"
  en: "The ear (udhn) is the organ of hearing, distinct from hearing itself. Rulings attach to it: the call to prayer in a newborn's right ear, the duty to shut out what is forbidden, the blood-money for injury to it, its place in a woman's nakedness, the fact that it does not stand for the whole person, and its status in sacrifice and marking.  p.2023}  p.2024}  p.2025}"
  ur: "کان قوتِ سماعت کا عضو ہے، اور سماعت خود اس سے الگ ہے۔ اس سے متعلق احکام یہ ہیں: نومولود کے داہنے کان میں اذان، ممنوع آواز سننے سے بچنا، کان پر جنایت کی دیت، عورت کے ستر میں اس کا شمار، اس سے پورے انسان کی تعبیر نہ ہونا، اور قربانی و نشان میں اس کا حکم۔  p.2023}  p.2024}  p.2025}"
  es: "El oído (udhn) es el órgano de la audición, distinto de la audición misma. Se le asocian normas: la llamada a la oración en el oído derecho del recién nacido, el deber de ignorar lo prohibido, la indemnización por daños causados a este órgano, su lugar en la desnudez femenina, el hecho de que no representa a la persona en su totalidad y su estatus en el sacrificio y la marcación."
  fr: "L'oreille (udhn) est l'organe de l'ouïe, distinct de l'ouïe elle-même. Des règles s'y rattachent: l'appel à la prière dans l'oreille droite d'un nouveau-né, le devoir de rejeter ce qui est interdit, le prix du sang pour toute atteinte à l'oreille, sa place dans la nudité de la femme, le fait qu'elle ne représente pas la personne entière, et son statut dans le sacrifice et le marquage. (p. 2023) (p. 2024) (p. 2025)"
  tr: "Kulak, işitme organıdır ve işitmekten farklıdır. Onunla ilgili kararlar şunlardır: yenidoğanın sağ kulağında ezan çağrısı, yanlış davranışların işitilmesinin yasaklanması, suç için verilen kan parası, kadının evresinin yasaklanması, erkeğin değil, ve bunun bütünü temsil etmek için kullanılmaması. Kararları kurban ve işaretleme için geçerlidir. s.2023} s.2024} s.2025}"
  id: "Telinga adalah organ pendengaran, yang berbeda dengan pendengaran. Putusan terkait telinga tersebut adalah: panggilan salat di telinga kanan bayi baru lahir, larangan mendengar kesalahan, uang darah untuk kejahatan di telinga itu, larangan awrah wanita, bukan laki-laki, dan tidak digunakan untuk mewakili keseluruhan. Putusannya berlaku untuk pengorbanan dan penandaan. hlm.2023} hlm.2024} hlm.2025}"
