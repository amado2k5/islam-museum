id: concept/sacred-relics-and-sakina
class: concept
kind: belief
label: { ar: "التابوت والسكينة", en: "The ark and sakina (sacred relics)", ur: "تابوت اور سکینہ (مقدس آثار)" }
summary:
  ar: "يرى الشعراوي أن الآثار المرتبطة بأحداث العقيدة والنبوة يجب أن تُصان ولا تُعد شركاً، وأن التابوت حمل سكينة من الله وبقية مما ترك آل موسى وآل هارون، وأن ولاة الأمر يحفظونها ليطمئن الناس إليها {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1048} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1049} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1050}."
  en: "Sha'rawi holds that relics tied to events of faith and prophethood should be preserved and not treated as idolatry. He reads the ark as carrying sakina from God and the remains left by the house of Musa and Harun, and holds that rulers should guard such things so that people find peace in them {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1048} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1049} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1050}."
  ur: "شعراوی کے نزدیک عقیدے اور نبوت کے واقعات سے جڑے آثار کی حفاظت کرنی چاہیے اور انہیں شرک نہیں سمجھنا چاہیے۔ ان کے مطابق تابوت میں اللہ کی طرف سے سکینہ اور آل موسیٰ و آل ہارون کی چھوڑی ہوئی بقیہ چیزیں تھیں، اور حکمرانوں کو انہیں محفوظ رکھنا چاہیے تاکہ لوگوں کو اطمینان ملے {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1048} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1049} {cite:tafsir-sharawi-khawatir-scan-vol-2 p.1050}۔"
