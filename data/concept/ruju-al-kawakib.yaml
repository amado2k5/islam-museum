label: { ar: "رجوع الكواكب", en: "Retrograde motion of the planets" }
summary:
  ar: "يبيّن الفرغاني أن الكواكب الخمسة السيارة ترجع في فلك البروج إذا كانت في الجزء الداخلي من فلك التدوير، لأن حركتها على فلك التدوير إلى المغرب تغلب حركة مركز التدوير إلى المشرق، وأن رجوعها يكون أعظم عند الحضيض، وأن الزهرة وعطارد لا يبعدان عن الشمس أكثر من حدّ معلوم {cite:farghani-elements-astronomy p. 193}{cite:farghani-elements-astronomy p. 194}{cite:farghani-elements-astronomy p. 195}."
  en: "al-Farghani explains that the five planets appear to move backward along the zodiac when they are in the inner part of their epicycle, because their motion on the epicycle toward the west outweighs the motion of the epicycle's centre eastward; the retrogression is greatest at perigee {cite:farghani-elements-astronomy p. 193}{cite:farghani-elements-astronomy p. 194}{cite:farghani-elements-astronomy p. 195}."
