id: concept/ruju-al-kawakib
class: concept
kind: scientific
label: { ar: "رجوع الكواكب", en: "Retrograde motion of the planets", es: "Movimiento retrógrado de los planetas", fr: "Mouvement rétrograde des planètes", ur: "سیاروں کی ریٹروگریڈ حرکت" }
summary:
  ar: "يبيّن الفرغاني أن الكواكب الخمسة السيارة ترجع في فلك البروج إذا كانت في الجزء الداخلي من فلك التدوير، لأن حركتها على فلك التدوير إلى المغرب تغلب حركة مركز التدوير إلى المشرق، وأن رجوعها يكون أعظم عند الحضيض، وأن الزهرة وعطارد لا يبعدان عن الشمس أكثر من حدّ معلوم {cite:farghani-elements-astronomy p. 193}{cite:farghani-elements-astronomy p. 194}{cite:farghani-elements-astronomy p. 195}."
  en: "al-Farghani explains that the five planets appear to move backward along the zodiac when they are in the inner part of their epicycle, because their motion on the epicycle toward the west outweighs the motion of the epicycle's centre eastward; the retrogression is greatest at perigee {cite:farghani-elements-astronomy p. 193}{cite:farghani-elements-astronomy p. 194}{cite:farghani-elements-astronomy p. 195}."
  es: "Al-Farghani explica que los cinco planetas parecen moverse hacia atrás a lo largo del zodíaco cuando están en la parte interior de su epiciclo, porque su movimiento en el epiciclo hacia el oeste supera el movimiento del centro del epiciclo hacia el este; la retrogradación es mayor en el perigeo {cite:farghani-elements-astronomy p. 193}{cite:farghani-elements-astronomy p. 194}{cite:farghani-elements-astronomy p. 195}."
  fr: "al-Farghani explique que les cinq planètes semblent reculer le long du zodiaque lorsqu'elles se trouvent dans la partie intérieure de leur épicycle, car leur mouvement sur l'épicycle vers l'ouest l'emporte sur le mouvement du centre de l'épicycle vers l'est; la rétrogradation est la plus importante au périgée {cite:farghani-elements-astronomy p. 193}{cite:farghani-elements-astronomy p. 194}{cite:farghani-elements-astronomy p. 195}."
  ur: "الفرغانی بتاتے ہیں کہ پانچ سیارے جب اپنے ایپیسائیکل کے اندرونی حصے میں ہوتے ہیں تو رقم کے ساتھ پیچھے کی طرف جاتے دکھائی دیتے ہیں، کیونکہ ان کی مغرب کی طرف ایپیسائیکل کی حرکت مشرق کی طرف ایپیسائیکل کے مرکز کی حرکت سے زیادہ ہوتی ہے۔ ریٹروگریشن پیریجی میں سب سے زیادہ ہے 193}{حوالہ:فرغانی-عناصر-فلکیات صفحہ۔ 194}{حوالہ:فرغانی-عناصر-فلکیات صفحہ۔ 195}"
