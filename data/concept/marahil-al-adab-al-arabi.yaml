id: concept/marahil-al-adab-al-arabi
class: concept
kind: term
tags: [arabiyya-browser, arabiyya-scholars]
label:
  ar: "مراحل الأدب العربي الثماني"
  en: "The eight periods of Arabic literature"
  ur: "عربی ادب کے آٹھ ادوار"
  fr: "Les huit périodes de la littérature arabe"
  es: "Los ocho periodos de la literatura árabe"
  tr: "Arap Edebiyatının Sekiz Evresi"
  id: "Delapan Tahap Sastra Arab"
summary:
  ar: "ثمانية أطوار للأدب العربي من الجاهلي إلى الحديث، لكل منها تاريخه التقريبي وأعلامه وعمله الممثِّل كما يرتبها ملخص بحثي قُدّم إلى المتحف {cite:britannica-arabic-literary-renaissance} {cite:britannica-islamic-arts-the-modern-period}."
  en: "Eight periods of Arabic literature from the Jahili to the modern, each with its approximate dates, authors and a representative work, as a research summary supplied to the museum arranges them {cite:britannica-arabic-literary-renaissance} {cite:britannica-islamic-arts-the-modern-period}."
  ur: "عربی ادب کے آٹھ ادوار، جاہلی سے جدید تک، ہر ایک کی تخمینی تاریخوں، ادیبوں اور نمائندہ تصنیف کے ساتھ جیسا میوزیم کو دیا گیا تحقیقی خلاصہ ترتیب دیتا ہے {cite:britannica-arabic-literary-renaissance} {cite:britannica-islamic-arts-the-modern-period}۔"
  fr: "Huit périodes de la littérature arabe, du jahili au moderne, chacune avec ses dates approximatives, ses auteurs et une œuvre représentative, telles que les range une synthèse de recherche remise au musée {cite:britannica-arabic-literary-renaissance} {cite:britannica-islamic-arts-the-modern-period}."
  es: "Ocho periodos de la literatura árabe, del yahilí al moderno, cada uno con sus fechas aproximadas, sus autores y una obra representativa, tal como los ordena un resumen de investigación entregado al museo {cite:britannica-arabic-literary-renaissance} {cite:britannica-islamic-arts-the-modern-period}."
  tr: "İslam öncesinden modern zamana kadar Arap edebiyatının sekiz aşaması, her biri kendi yaklaşık tarihi, önemli şahsiyetleri ve oyunculuk eserleri ile müzeye sunulan bir araştırma özetiyle düzenlenmiştir {cite:britannica-arabic-literary-renaissance} {cite:britannica-islamic-arts-the-modern-period}."
  id: "Delapan fase sastra Arab dari pra-Islam hingga masa modern, masing-masing dengan sejarah perkiraan, tokoh terkenal, dan karya akting, yang disusun melalui ringkasan penelitian yang diajukan ke museum {cite:britannica-arabic-literary-renaissance} {cite:britannica-islamic-arts-the-modern-period}."
