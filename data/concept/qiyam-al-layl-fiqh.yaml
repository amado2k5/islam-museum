id: concept/qiyam-al-layl-fiqh
class: concept
kind: legal
label:
  ar: "قيام الليل ⁦(الأحكام الفقهية)⁩"
  en: "Night vigil, qiyam al-layl (legal rulings)"
  ur: "قیام اللیل ⁦(فقہی احکام)⁩"
  es: "Vigilia nocturna, qiyam al-layl (dictámenes legales)"
  fr: "veille nocturne, qiyam al-layl (décisions légales)"
summary:
  ar: "قيام الليل في الفقه إحياء جزء منه بالصلاة أو غيرها، وهو مستحب باتفاق بمسميات متفاوتة عند المذاهب، ويفرق عنه التهجد بأنه الصلاة بعد النوم. وتتناول المادة الأفضل من أوقاته، وعدد ركعاته وكيفيته، واستحباب الافتتاح بركعتين خفيفتين، وإيقاظ الأهل، وإطالة القيام أو كثرة الركوع والسجود، والجماعة فيه، وقيام ليالٍ مخصوصة كليلتي العيد وليالي رمضان والعشر من ذي الحجة وليلة النصف من شعبان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13135} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13136} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13137} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13141}"
  en: "In the jurists' usage, the night vigil is spending part of the night in prayer or other worship. All schools count it recommended, under different names. Tahajjud is the prayer after sleep and is narrower. The subject covers the best time of night, the number of rak'at, the two light rak'at that open the vigil, waking one's family, whether to lengthen standing or multiply bowing and prostration, performing it in congregation, and the nights singled out for it: the two Eids, Ramadan, the first ten of Dhu al-Hijja and the middle of Sha'ban. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13135} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13136} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13137} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13141}"
  es: "En el uso de los juristas, la vigilia nocturna consiste en dedicar parte de la noche a la oración u otro acto de culto. Todas las escuelas la consideran recomendable, aunque con diferentes nombres. El Tahajjud es la oración después de dormir y es más específica. El tema abarca el mejor momento de la noche, el número de rak'at, las dos rak'at ligeras con las que comienza la vigilia, despertar a la familia, si se debe prolongar la posición de pie o aumentar las inclinaciones y postraciones, realizarla en congregación y las noches designadas para ella: los dos Eids, el Ramadán, los primeros diez días de Dhu al-Hijja y la mitad de Sha'ban. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13135} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13136} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13137} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.13141}"
  fr: "Dans l'usage des juristes, la veillée nocturne consiste à passer une partie de la nuit en prière ou en adoration. Toutes les écoles la recommandent, sous différentes appellations. Le tahajjud, prière après le sommeil, a une portée plus restreinte. Le sujet aborde le moment le plus propice de la nuit, le nombre de rak'at, les deux rak'at légères qui ouvrent la veillée, le fait de réveiller sa famille, la question de savoir s'il faut prolonger la station debout ou multiplier les inclinaisons et les prosternations, la pratique en congrégation, et les nuits privilégiées: les deux Aïds, le Ramadan, les dix premières nuits de Dhu al-Hijja et le milieu du mois de Sha'ban. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13135} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13136} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13137} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13141}"
  ur: "فقہاء کے استعمال میں رات کی نگرانی رات کا کچھ حصہ نماز یا دیگر عبادتوں میں گزارنا ہے۔ تمام اسکول اسے مختلف ناموں سے تجویز کردہ شمار کرتے ہیں۔ تہجد نیند کے بعد کی نماز ہے اور تنگ ہے۔ اس مضمون میں رات کے بہترین وقت، رکعتوں کی تعداد، دو ہلکی رکعتیں جو جاگتی ہیں، گھر والوں کو بیدار کرتی ہیں، قیام لمبا کرنا ہے یا رکوع و سجود کو بڑھانا، جماعت کے ساتھ ادا کرنا، اور اس کے لیے مخصوص کردہ راتیں: دو عیدیں، رمضان، ذی الحجہ کی پہلی عشرہ اور نصف شعبان۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 13135} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 13136} {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 13137} صفحہ 13141}"
