label:
  ar: "قيام الليل (الأحكام الفقهية)"
  en: "Night vigil, qiyam al-layl (legal rulings)"
  ur: "قیام اللیل (فقہی احکام)"
summary:
  ar: "قيام الليل في الفقه إحياء جزء منه بالصلاة أو غيرها، وهو مستحب باتفاق بمسميات متفاوتة عند المذاهب، ويفرق عنه التهجد بأنه الصلاة بعد النوم. وتتناول المادة الأفضل من أوقاته، وعدد ركعاته وكيفيته، واستحباب الافتتاح بركعتين خفيفتين، وإيقاظ الأهل، وإطالة القيام أو كثرة الركوع والسجود، والجماعة فيه، وقيام ليالٍ مخصوصة كليلتي العيد وليالي رمضان والعشر من ذي الحجة وليلة النصف من شعبان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13135} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13136} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13137} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13141}"
  en: "In the jurists' usage, the night vigil is spending part of the night in prayer or other worship. All schools count it recommended, under different names. Tahajjud is the prayer after sleep and is narrower. The subject covers the best time of night, the number of rak'at, the two light rak'at that open the vigil, waking one's family, whether to lengthen standing or multiply bowing and prostration, performing it in congregation, and the nights singled out for it: the two Eids, Ramadan, the first ten of Dhu al-Hijja and the middle of Sha'ban. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13135} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13136} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13137} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13141}"
