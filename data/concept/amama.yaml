class: concept
kind: legal
label:
  ar: "العِمَامَة"
  en: "The turban (amama): its forms, wiping over it, and its rules in prayer and ihram"
  ur: "عمامہ (پگڑی)"
summary:
  ar: "العمامة في اللغة اللباس الذي يُلاث على الرأس تكويراً، وتجمع على عمائم، وتتصل بها العذبة والذؤابة والعصابة والمعجر والقناع والقلنسوة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11807}. ولها أشكال منها أن تُلف على الرأس وتُسدل طرفها على الظهر، ومنها الاعتجار بلفها دون إدارتها تحت الحنك، وتسمى الزوقلة إذا أرخي طرفاها من جانبي الرأس {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11808}. وصفت عمائم النبي بالسواد، وإرخاء طرفها بين الكتفين، وكان يتعمم بعمامة قطرية {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11809}. وقد ميّز أهل الذمة عن المسلمين بألوان وهيئات من العمائم {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11810}. والسجود على كور العمامة مكروه عند جمهور الفقهاء إلا لعذر، ويشترط عند الشافعية كشف الجبهة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11811} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11812}. والمسح على العمامة في الوضوء: منعه الحنفية، وجوّزه المالكية عند الضرر، وأجازه الشافعية والحنابلة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11812} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11813}. وفي كفن الميت قميص وعمامة مستحب عند أبي حنيفة ومالك، ولا يكون عند الشافعي وأحمد {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11813}. وتحرم العمامة على المحرم بحج أو عمرة، وفي التعزير قد تُنزع العمامة عقوبة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11813} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11814}."
  en: "In the lexicon, 'amama is a cloth wound round the head, and its plural is 'amai'im; it is related to the tail, the headband, the bandage, the veil and the cap {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11807}. Its styles include wrapping the head with the end let fall on the back, and i'tijar, wrapping without tucking the end under the chin, and the end let fall from both sides of the head {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11808}. The turbans of the Prophet are described as black, with the end let fall between the shoulders, and he is reported to have worn a Qatari cloth {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11809}. Protected non-Muslims were distinguished by colours and by wearing the turban without tucking it under the chin {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11810}. Prostration on the fold of the turban is disliked by most jurists unless there is an excuse, and the Shafi'is require the forehead to be bare {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11811} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11812}. Wiping over the turban in ablution is refused by the Hanafis, allowed by the Malikis where removal would harm, and allowed by the Shafi'is and Hanbalis {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11812} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11813}. A shirt and a turban in a shroud are recommended by Abu Hanifa and Malik and not by al-Shafi'i and Ahmad {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11813}. A turban is forbidden to one in the state of ihram, and a restraint may be imposed by removing the turban as a discretionary penalty {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11813} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11814}."
