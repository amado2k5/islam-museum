label:
  ar: "العِمَامَة"
  en: "The turban (amama): its forms, wiping over it, and its rules in prayer and ihram"
  fr: "Le turban (amama) : formes, passage de la main mouillée, règles dans la prière et l’ihram"
  ur: "عمامہ ⁦(پگڑی)⁩"
  es: "El turbante (amama): sus formas, cómo pasarlo por encima y sus reglas en la oración y el ihram."
  tr: "sarık"
  id: "sarık"
summary:
  ar: "العمامة في اللغة اللباس الذي يُلاث على الرأس تكويراً، وتجمع على عمائم، وتتصل بها العذبة والذؤابة والعصابة والمعجر والقناع والقلنسوة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11807}. ولها أشكال منها أن تُلف على الرأس وتُسدل طرفها على الظهر، ومنها الاعتجار بلفها دون إدارتها تحت الحنك، وتسمى الزوقلة إذا أرخي طرفاها من جانبي الرأس {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11808}. وصفت عمائم النبي بالسواد، وإرخاء طرفها بين الكتفين، وكان يتعمم بعمامة قطرية {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11809}. وقد ميّز أهل الذمة عن المسلمين بألوان وهيئات من العمائم {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11810}. والسجود على كور العمامة مكروه عند جمهور الفقهاء إلا لعذر، ويشترط عند الشافعية كشف الجبهة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11811} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11812}. والمسح على العمامة في الوضوء: منعه الحنفية، وجوّزه المالكية عند الضرر، وأجازه الشافعية والحنابلة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11812} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11813}. وفي كفن الميت قميص وعمامة مستحب عند أبي حنيفة ومالك، ولا يكون عند الشافعي وأحمد {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11813}. وتحرم العمامة على المحرم بحج أو عمرة، وفي التعزير قد تُنزع العمامة عقوبة {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11813} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11814}."
  en: "In the lexicon, 'amama is a cloth wound round the head, and its plural is 'amai'im; it is related to the tail, the headband, the bandage, the veil and the cap {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11807}. Its styles include wrapping the head with the end let fall on the back, and i'tijar, wrapping without tucking the end under the chin, and the end let fall from both sides of the head {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11808}. The turbans of the Prophet are described as black, with the end let fall between the shoulders, and he is reported to have worn a Qatari cloth {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11809}. Protected non-Muslims were distinguished by colours and by wearing the turban without tucking it under the chin {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11810}. Prostration on the fold of the turban is disliked by most jurists unless there is an excuse, and the Shafi'is require the forehead to be bare {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11811} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11812}. Wiping over the turban in ablution is refused by the Hanafis, allowed by the Malikis where removal would harm, and allowed by the Shafi'is and Hanbalis {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11812} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11813}. A shirt and a turban in a shroud are recommended by Abu Hanifa and Malik and not by al-Shafi'i and Ahmad {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11813}. A turban is forbidden to one in the state of ihram, and a restraint may be imposed by removing the turban as a discretionary penalty {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11813} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11814}."
  fr: "Dans le lexique, ‘amama désigne une étoffe enroulée autour de la tête ; son pluriel est ‘amai’im. Le mot est apparenté à ceux qui désignent le pan, le bandeau, le bandage, le voile et le bonnet {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11807}. On peut l’enrouler autour de la tête en laissant retomber le pan dans le dos, pratiquer l’i‘tijar en l’enroulant sans passer le pan sous le menton, ou laisser le pan retomber des deux côtés de la tête {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11808}. Les turbans du Prophète sont décrits comme noirs, avec un pan retombant entre les épaules ; on rapporte qu’il portait une étoffe qatarie {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11809}. Les non-musulmans protégés se distinguaient par les couleurs et par le port du turban sans en passer le pan sous le menton {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11810}. La plupart des juristes déconseillent de se prosterner sur un pli de son turban, sauf empêchement, et les chaféites exigent que le front soit découvert {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11811} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11812}. Lors des ablutions, les hanafites n’admettent pas que l’on passe la main mouillée sur le turban ; les malikites l’admettent si le retirer serait préjudiciable, et les chaféites et les hanbalites le permettent {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11812} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11813}. Abu Hanifa et Malik recommandent d’inclure une chemise et un turban dans le linceul, contrairement à al-Shafi‘i et Ahmad {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11813}. Le turban est interdit à quiconque est en état d’ihram, et le retrait du turban peut être infligé comme peine discrétionnaire {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11813} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11814}."
  es: "En el léxico, 'amama es una tela que se enrolla alrededor de la cabeza, y su plural es 'amai'im; está relacionada con la cola, la diadema, el vendaje, el velo y la gorra {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11807}. Sus estilos incluyen envolver la cabeza dejando caer el extremo sobre la espalda, e i'tijar, envolver sin meter el extremo debajo de la barbilla, y dejando caer el extremo a ambos lados de la cabeza {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11808}. Los turbantes del Profeta se describen como negros, con el extremo cayendo entre los hombros, y se dice que usó una tela qatarí {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11809}. Los no musulmanes protegidos se distinguían por los colores y por llevar el turbante sin meterlo debajo de la barbilla {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11810}. La postración sobre el pliegue del turbante es desaconsejada por la mayoría de los juristas a menos que haya una excusa, y los shafi'ís requieren que la frente esté descubierta {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11811} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11812}. Los hanafíes rechazan pasar el turbante durante la ablución, los malikíes lo permiten cuando quitarlo sería perjudicial, y los shafiíes y hanbalíes lo permiten {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11812} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11813}. Abu Hanifa y Malik recomiendan una camisa y un turbante envueltos en una mortaja, pero al-Shafi'i y Ahmad no {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11813}. El turbante está prohibido para quien se encuentra en estado de ihram, y se puede imponer una restricción quitándole el turbante como castigo discrecional {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11813} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.11814}."
  ur: "لغت میں، 'اماما ایک کپڑا ہے جو سر کے گرد زخم ہے، اور اس کی جمع 'امائم' ہے؛ اس کا تعلق دم، سر پر پٹی، پٹی، پردہ اور ٹوپی سے ہے اس کے اسلوب میں سر کو سر کو پیٹھ پر لپیٹنا اور احتشام، ٹھوڑی کے نیچے سرے کو ٹکائے بغیر لپیٹنا، اور سر کے دونوں اطراف سے سر کو گرنا شامل ہے۔ نبی کی پگڑیوں کو سیاہ قرار دیا گیا ہے، جس کا سرہ کندھوں کے درمیان پڑا ہے، اور بتایا جاتا ہے کہ آپ نے قطری کپڑا پہنا ہوا تھا۔ تحفظ یافتہ غیر مسلموں کو رنگوں اور پگڑی کو ٹھوڑی کے نیچے ٹکائے بغیر پہننے سے پہچانا جاتا تھا پگڑی کی تہہ پر سجدہ کرنا اکثر فقہاء کے نزدیک ناپسندیدہ ہے الا یہ کہ کوئی عذر ہو، اور شافعیوں کے نزدیک پیشانی کا ننگا ہونا ضروری ہے۔ وضو میں پگڑی پر مسح کرنے سے احناف نے انکار کیا ہے، مالکیوں نے اس کی اجازت دی ہے جہاں اتارنے سے نقصان پہنچے گا، اور شافعیہ اور حنبلی نے اس کی اجازت دی ہے {حوالہ: فقہ الموسوعۃ کویتیہ نور ص 3 ص 11812} کفن میں قمیص اور پگڑی کی سفارش ابو حنیفہ اور مالک نے کی ہے نہ کہ شافعی اور احمد نے۔ احرام کی حالت میں کسی کے لیے پگڑی حرام ہے، اور صوابدیدی سزا کے طور پر پگڑی اتار کر پابندی لگائی جا سکتی ہے۔"
  tr: "Dilde sarık, başın etrafında daire şeklinde giyilen ve sarıklarla birleştirilmiş, 'aṣābāh, al-wāʿābā, al-ma'ār, al-ma'ār, qana'ā ve şapka {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11807} ile bağlantılıdır. Başın etrafına sarılır ve ucunu sırtın üzerine düşürür, bazen damak altına çevirmeden damak etrafına sarılır. Uçları başın her iki tarafından gevşetilmişse 'al-zuqla' denir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11808}. Zimmiler, çeşitli türban türleri ve biçimleriyle Müslümanları Müslümanlardan ayırır {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11810}. Sarık örtülerine secde etmek, çoğu hukukçu tarafından bahaneler dışında hoşlanmaz; Şafiilere göre alnın açılması gerekir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11811} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11812}. Sarığın üzerine abdest alma ile silmek: Hanefiler bunu yasaklar, Malikiler zarar durumunda izin verir, Şafi'ler ve Hanbaliler {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11812} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11813} tarafından da izin verilmiştir. Ölen kişinin kefeni için Ebu Hanifa ve Malik'e göre gömlek ve sarık önerilmiştir, ancak Al-Shafi'i ve Ahmad'a göre (cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11813} tarafından önerilmemiştir. Hac veya Umre sırasında ihramda olan kişi için sarık yasaktır ve isteğe bağlı ceza olarak sarık çıkarılabilir {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11813} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.11814}."
