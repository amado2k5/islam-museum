id: concept/lafz-fiqh
class: concept
kind: legal
label:
  ar: "اللَّفْظ"
  en: "Utterance (lafz), fiqh rulings"
  ur: "لفظ (فقہی احکام)"
summary:
  ar: "اللفظ في اللغة أن ترمي بشيء كان في فيك، واللفظ بالشيء التكلم به؛ وفي الاصطلاح ما يتلفظ به الإنسان أو من في حكمه مهملاً كان أو مستعملاً {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13654}. والإشارة تفيد ما يفيده اللفظ وتقوم مقامه أحياناً، والسكوت ضد النطق مع القدرة عليه {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13655}."
  en: "Lafz, in lexicon, is to throw out something in one's mouth, and to utter a word is to speak it; in law it is what a person, or one in his place, utters, whether meaningless or meaningful {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13654}. A sign conveys what an utterance conveys and sometimes stands for it, and silence is the opposite of speech when one is able to speak {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13655}."
  ur: "لفظ لغت میں یہ ہے کہ منہ میں جو چیز ہو اسے پھینکا جائے، اور کسی بات کو لفظ کرنا اسے بولنا ہے؛ اصطلاح میں وہ جو انسان یا اس کے حکم والا شخص بولے، خواہ مہمل ہو یا معنی دار {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13654}۔ اشارہ وہی فائدہ دیتا ہے جو لفظ دیتا ہے اور کبھی اس کے قائم مقام ہوتا ہے، اور خاموشی بولنے کی قدرت کے ساتھ نطق کی ضد ہے {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.13655}۔"
