summary:
  ar: "خطاف في الكتاب طير معروف، وكل ما يذكر فيه نقل منسوب إلى الكتاب أو إلى ديسقوريدوس لا توصية؛ يحكي الكتاب عن ديسقوريدوس خبرا في حصاتين من جوف فرخه تربطان على من اختلط عقله أو به صرع وأنه جرب ذلك، ويذكر أن أكل الخطاف يحد البصر وأن دماغه بعسل نافع من ابتداء الماء، وأن رماده ينفع من الخناق وأنه إذا ملح وجفف نفع من السعال وورم اللهاة واللوزتين، وتركت الشروط والمقادير {cite:canon-ibn-sina-print-v1 p.714}"
  en: "Khattaf is in the book a known bird, and everything given in it is a report attributed to the book or to Dioscorides, not a recommendation; the book relates from Dioscorides an account of two stones from the inside of its young, tied on one whose mind is confused or who has epilepsy, and that he said he had tried it, and it states that eating the khattaf sharpens sight, that its brain with honey benefits the beginning of cataract, that its ash benefits quinsy, and that, salted and dried, it benefits cough and swelling of the uvula and tonsils; the conditions and amounts are left out {cite:canon-ibn-sina-print-v1 p.714}"
  ur: "خطاف کتاب میں ایک معروف پرندہ ہے، اور اس میں جو کچھ آیا وہ کتاب یا دیسقوریدوس سے منسوب نقل ہے سفارش نہیں؛ کتاب دیسقوریدوس سے اس کے بچے کے پیٹ کی دو کنکریوں کے بارے میں ایک بیان نقل کرتی ہے جو عقل میں خلل والے یا مرگی والے پر باندھی جاتی ہیں اور یہ کہ اس نے اسے آزمایا بتایا ہے، اور ذکر کرتی ہے کہ خطاف کھانا نظر کو تیز کرتا ہے، اس کا دماغ شہد کے ساتھ پانی اترنے کے آغاز میں نافع ہے، اس کی راکھ خناق میں نافع ہے، اور نمک لگا کر خشک کیا جائے تو کھانسی اور کوے اور لوزتین کے ورم میں نافع ہے؛ شرائط اور مقداریں چھوڑ دی گئیں {cite:canon-ibn-sina-print-v1 p.714}۔"
  es: "En el libro, el khattaf es un ave conocida, y todo lo que se menciona en él es un informe atribuido al libro o a Dioscórides, no una recomendación. El libro relata, según Dioscórides, el relato de dos piedras extraídas del interior de sus crías, atadas a una persona con confusión mental o epilepsia, quien afirmó haberlo probado. También afirma que comer el khattaf agudiza la vista, que su cerebro con miel beneficia el inicio de las cataratas, que su ceniza beneficia la amigdalitis y que, salado y seco, beneficia la tos y la inflamación de la úvula y las amígdalas. Las condiciones y las cantidades se omiten. {cite:canon-ibn-sina-print-v1 p.714}"
  fr: "Le khattaf est mentionné dans le livre comme un oiseau connu, et tout ce qui y est rapporté est un témoignage attribué au livre ou à Dioscoride, et non une recommandation. Le livre rapporte, d'après Dioscoride, le récit de deux pierres provenant de l'intérieur de ses petits, attachées sur une personne souffrant de troubles mentaux ou d'épilepsie. Dioscoride aurait fait l'expérience de ce traitement. Le livre affirme que manger du khattaf améliore la vue, que son cerveau, mélangé à du miel, est bénéfique en cas de cataracte débutante, que ses cendres soulagent l'angine, et que, salé et séché, il est bénéfique pour la toux et l'inflammation de la luette et des amygdales. Les conditions et les quantités ne sont pas précisées. {cite:canon-ibn-sina-print-v1 p.714}"
