summary:
  ar: "ما نقله المؤرخون واستحضره المقري في تتابع الأمم على الأندلس: الأندلش بهم سمي المكان وعرب بالسين، هلكوا بقحط حبس المطر فأقفرت الأندلس نحو مائة سنة، ثم أجلى ملك إفريقية من الأفارقة خلقاً في السفن مع قائد يدعى أبطريقس فأرسوا بريف الأندلس الغربي واحتلوا بجزيرة قادس وكانت دار مملكتهم طالقة مائة وسبعة وخمسين عاماً، ثم نسخهم عجم رومة وملكهم إشبان بن طيطش باسمه سميت الأندلس إشبانية وهو الذي بنى إشبيلية ونقل إليها رخام طالقة، وفي مغازم الأخباريين أن مائدة سليمان وقليلة الدر كانت من سهم ملك أندلسي اسمه بريان أدرك فتح بيت المقدس مع بختنصر {cite:nafh-tib-maqqari p. 169-171}."
  en: "The akhbaris' legendary succession of al-Andalus's settlers retold by al-Maqqari: the Andalush who named the land and perished in a drought, the Africans landed at Cadiz under Abtariqus whose kingdom at Talica lasted 157 years, then Ishban b. Titish of the Rum whose name gave Hispania/Ishbiliya and who razed Talica — plus the tradition that the Table of Solomon and Musa's pearl flask came from an Andalusi king's share in Jerusalem's spoils {cite:nafh-tib-maqqari p. 169-171}."
  es: "La legendaria sucesión de colonos de al-Ándalus relatada por al-Maqqari, según los akhbaris: los andalusíes que dieron nombre a la tierra y perecieron en una sequía, los africanos que desembarcaron en Cádiz bajo el mando de Abtariqus, cuyo reino en Talica duró 157 años, luego Ishban b. Titish de Rum, cuyo nombre dio nombre a Hispania/Ishbiliya y que arrasó Talica, además de la tradición de que la Mesa de Salomón y el frasco de perlas de Musa procedían de la parte que le correspondió a un rey andalusí del botín de Jerusalén {cite:nafh-tib-maqqari p. 169-171}."
  fr: "La succession légendaire des colons d'al-Andalus, racontée par les Akhbaris et relatée par al-Maqqari: les Andalous qui nommèrent la terre et périrent lors d'une sécheresse, les Africains débarquèrent à Cadix sous Abtariqus dont le royaume à Talica dura 157 ans, puis Ishban ben Titish du Roum, dont le nom donna Hispanie/Ishbiliya et qui rasa Talica — plus la tradition selon laquelle la Table de Salomon et la fiole de perles de Moïse provenaient de la part d'un roi andalou dans le butin de Jérusalem {cite:nafh-tib-maqqari p. 169-171}."
  ur: "الاندلس کے آباد کاروں کے افسانوی جانشینی کو المقری نے نقل کیا: اندلس جس نے زمین کا نام رکھا اور خشک سالی میں ہلاک ہو گئے، افریقی ابتاریقس کے ماتحت کادز میں اترے جس کی سلطنت تالیکا میں 157 سال تک چلی، پھر اشبان بن۔ روم کے تیتش نے جس کا نام ہسپانیہ/ایشبیلیہ دیا اور جس نے تالکا کو مسمار کر دیا — اس کے علاوہ یہ روایت کہ سلیمان کی میز اور موسیٰ کا موتی فلاسک یروشلم کے مال غنیمت میں اندلس کے بادشاہ کے حصہ سے آیا تھا۔ 169-171}۔"
  tr: "Tarihçilerin Endülüs'e gelen ulusların ardı ardına geçtiklerinde aktardıkları ve hatırladıkları şey: Endülüslüler burayı ve Arapları 'günah' olarak adlandırdılar. Kuraklık ve yağmur nedeniyle Endülüs yaklaşık yüz yıl boyunca çorak kaldı ve öldüler. Sonra İfrikiye kralı, Abtariqs adlı bir komutanla birlikte Afrikalıları gemilerden kovdu; Abtariqs onları Endülüs'ün batı kırsalında demirledi ve Kadiz adasını işgal etti. Krallıkları yüz elli yedi yıl boyunca boşandı. Sonra Roma'nın Ajamları ve kralı Titish'in oğlu İsban, onun adını taşıyan El-Endülüs İsbaniyah adını verdiler; Sevilla'yı inşa etti ve Talqa'nın mermerini taşıdı. Akhbari savaşlarında, Süleyman'ın sofrası ve az sayıda inci, Bakhtaneser ile birlikte Kudüs'ü ele geçiren Endülüs kralı Brian'ın okundan alındı {alıntı:nafh-tib-maqqari, s. 169-171}."
  id: "Apa yang dilaporkan dan diingat oleh para sejarawan dalam suksesi bangsa-bangsa ke al-Andalus: Orang Andalusia menamai tempat itu dan orang Arab dengan 'dosa'. Mereka meninggal karena kekeringan dan hujan yang membuat al-Andalus tandus selama sekitar seratus tahun. Kemudian raja Ifriqiya mengusir orang Afrika dari kapal bersama seorang komandan bernama Abtariqs, yang menambatkan mereka di pedesaan barat al-Andalus dan menduduki pulau Cádiz. Kerajaan mereka bercerai selama seratus lima puluh tujuh tahun. Kemudian Ajams dari Roma dan raja mereka, Isban putra Titish, dinamai menurut namanya, bernama Al-Andalus Ishbaniyah, yang membangun Sevilla dan memindahkan marmer Talqa. Dalam pertempuran Akhbaris, meja Suleiman dan sejumlah kecil mutiara berasal dari panah seorang raja Andalusia bernama Brian, yang merebut Yerusalem bersama Bakhtaneser {cite:nafh-tib-maqqari, hlm. 169-171}."
