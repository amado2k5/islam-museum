label: { ar: "أخبار الأخباريين في استيطان الأندلس", en: "Akhbari reports on the settlement of al-Andalus", es: "Akhbari informa sobre el asentamiento de al-Ándalus.", fr: "Akhbari rend compte du règlement d'al-Andalus", ur: "اخباری نے اندلس کی آباد کاری کی خبر دی ہے۔", tr: "Endülüs Yerleşimindeki Katılımcıların Haberleri", id: "Berita tentang Peserta Berita dalam Pemukiman Andalusia" }
