summary:
  ar: "ما نقله المؤرخون واستحضره المقري في تتابع الأمم على الأندلس: الأندلش بهم سمي المكان وعرب بالسين، هلكوا بقحط حبس المطر فأقفرت الأندلس نحو مائة سنة، ثم أجلى ملك إفريقية من الأفارقة خلقاً في السفن مع قائد يدعى أبطريقس فأرسوا بريف الأندلس الغربي واحتلوا بجزيرة قادس وكانت دار مملكتهم طالقة مائة وسبعة وخمسين عاماً، ثم نسخهم عجم رومة وملكهم إشبان بن طيطش باسمه سميت الأندلس إشبانية وهو الذي بنى إشبيلية ونقل إليها رخام طالقة، وفي مغازم الأخباريين أن مائدة سليمان وقليلة الدر كانت من سهم ملك أندلسي اسمه بريان أدرك فتح بيت المقدس مع بختنصر {cite:nafh-tib-maqqari p. 169-171}."
  en: "The akhbaris' legendary succession of al-Andalus's settlers retold by al-Maqqari: the Andalush who named the land and perished in a drought, the Africans landed at Cadiz under Abtariqus whose kingdom at Talica lasted 157 years, then Ishban b. Titish of the Rum whose name gave Hispania/Ishbiliya and who razed Talica — plus the tradition that the Table of Solomon and Musa's pearl flask came from an Andalusi king's share in Jerusalem's spoils {cite:nafh-tib-maqqari p. 169-171}."
