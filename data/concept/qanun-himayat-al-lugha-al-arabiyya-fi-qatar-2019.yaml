class: concept
kind: legal
tags: [arabiyya-browser, arabiyya-world]
label:
  ar: "قانون حماية اللغة العربية في قطر (2019)"
  en: "Qatar's law protecting the Arabic language (2019)"
  ur: "قطر کا قانونِ تحفظِ عربی زبان (2019)"
  fr: "La loi du Qatar sur la protection de la langue arabe (2019)"
  es: "La ley de Catar sobre la protección de la lengua árabe (2019)"
  tr: "Katar'da Arapça Dil Koruma Yasası (2019)"
  id: "Undang-Undang Perlindungan Bahasa Arab di Qatar (2019)"
summary:
  ar: "القانون رقم 7 لسنة 2019 بشأن حماية اللغة العربية، الذي يلزم الجهات الحكومية وغير الحكومية بحماية العربية ودعمها، ويوجبها في اجتماعات الوزارات والقرارات واللوائح والمستندات والعقود والمراسلات والمنشورات والإعلان والتعليم، وأن تكون للشركات أسماء عربية ومنتجات قطرية بملصقات عربية، وبغرامة حتى 50 ألف ريال قطري على المخالفة، كما يلخصه ملف بحثي قُدّم إلى المتحف {cite:al-arab-qatar-home} {cite:al-jazeera-home} {cite:axl-cefan-ulaval-language-legislation}."
  en: "Law No. 7 of 2019 on the protection of the Arabic language, which obliges governmental and non-governmental bodies to protect and support Arabic, requires it in ministry meetings, decisions, regulations, documents, contracts, correspondence, publications, advertising and education, Arabic names for many companies and Arabic labelling on Qatari products, with fines up to 50,000 Qatari riyals, as a research file supplied to the museum summarises it {cite:al-arab-qatar-home} {cite:al-jazeera-home} {cite:axl-cefan-ulaval-language-legislation}."
  ur: "قانون نمبر 7 سال 2019 برائے تحفظِ عربی زبان، جو سرکاری اور غیر سرکاری اداروں کو عربی کے تحفظ اور اس کی معاونت کا پابند کرتا ہے، وزارتوں کے اجلاسوں، فیصلوں، ضوابط، دستاویزات، معاہدوں، خط و کتابت، مطبوعات، اشتہارات اور تعلیم میں اسے لازم قرار دیتا ہے، بہت سی کمپنیوں کے لیے عربی نام اور قطری مصنوعات پر عربی لیبل مقرر کرتا ہے، اور خلاف ورزی پر 50 ہزار قطری ریال تک جرمانہ رکھتا ہے، جیسا کہ میوزیم کو پیش کی گئی ایک تحقیقی فائل اس کا خلاصہ کرتی ہے {cite:al-arab-qatar-home} {cite:al-jazeera-home} {cite:axl-cefan-ulaval-language-legislation}."
  fr: "La loi n° 7 de 2019 sur la protection de la langue arabe, qui oblige les entités gouvernementales et non gouvernementales à protéger et à soutenir l'arabe, l'exige dans les réunions des ministères, les décisions, les règlements, les documents, les contrats, la correspondance, les publications, la publicité et l'enseignement, impose des noms arabes à de nombreuses sociétés et un étiquetage arabe sur les produits qataris, avec des amendes pouvant atteindre 50 000 riyals qataris, telle qu'un dossier de recherche remis au musée la résume {cite:al-arab-qatar-home} {cite:al-jazeera-home} {cite:axl-cefan-ulaval-language-legislation}."
  es: "La Ley n.º 7 de 2019 sobre la protección de la lengua árabe, que obliga a las entidades gubernamentales y no gubernamentales a proteger y apoyar el árabe, lo exige en las reuniones de los ministerios, decisiones, reglamentos, documentos, contratos, correspondencia, publicaciones, publicidad y educación, impone nombres árabes a muchas empresas y etiquetado en árabe en los productos cataríes, con multas de hasta 50 000 riales cataríes, tal como la resume un expediente de investigación entregado al museo {cite:al-arab-qatar-home} {cite:al-jazeera-home} {cite:axl-cefan-ulaval-language-legislation}."
  tr: "2019 tarihli 7 sayılı Yasa, Arapça dilinin korunmasına ilişkin olarak, devlet ve sivil toplum kuruluşlarını Arapçayı korumaya ve desteklemeye yükümlü kılar ve bakanlık toplantılarında, kararlarda, yönetmeliklerde, belgelerde, sözleşmelerde, yazışmalarda, yayınlarda, reklamlarda ve eğitimde bunu zorunlu kılar. Şirketlerin Arapça isimlere ve Arapça etiketli Katar ürünlerine sahip olması ve ihlaller için 50.000 Katar riyaline kadar para cezası uygulanmalıdır. Bu, müzeye sunulan bir araştırma dosyasında özetlenmiştir {cite:al-jazeera-home} {cite:axl-cefan-ulaval-language-legislation}."
  id: "Undang-Undang No. 7 tahun 2019 tentang perlindungan bahasa Arab, yang mewajibkan entitas pemerintah dan non-pemerintah untuk melindungi dan mendukung bahasa Arab, serta mewajibkannya dalam pertemuan kementerian, keputusan, peraturan, dokumen, kontrak, korespondensi, publikasi, iklan, dan pendidikan. Perusahaan harus memiliki nama Arab dan produk Qatar dengan label Arab, serta denda hingga 50.000 riyal Qatar untuk pelanggaran. Hal ini dirangkum dalam berkas penelitian yang diserahkan ke museum {cite:al-jazeera-home} {cite:axl-cefan-ulaval-language-legislation}."
