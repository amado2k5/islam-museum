id: concept/diwan-fiqh
class: concept
kind: legal
label:
  ar: "الديوان (في الفقه والسياسة الشرعية)"
  en: "Diwan (the state register: the office books of troops, taxes, judges and governors)"
  ur: "دیوان (ریاستی رجسٹر اور دفتر)"
summary:
  ar: "الديوان دفتر تثبت فيه الأسماء أو الوثائق، وما وضع لحفظ ما يتعلق بحقوق الدولة من أعمال وأموال وعمال، ويختلف الفقهاء في اتخاذه، فيجيزه المالكية، ويستحبه الشافعية، وينبغيه الحنابلة، وأول من وضعه عمر بن الخطاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8364} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8365} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8366} وينقسم ديوان الدولة إلى ما يختص بالجيش من إثبات وعطاء، وما يختص بالأعمال من رسوم وحقوق، وما يختص بالعمال من تقليد وعزل وجاري، ويكتب فيه القاضي ديوانه من محاضر وسجلات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8366} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8367} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8368} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8371}"
  en: "A diwan is a register in which names or documents are entered, and which keeps what concerns the state's business, funds and officials. The jurists differ over keeping one: the Malikis allow it, the Shafi'is recommend it, the Hanbalis say it is fitting; Umar ibn al-Khattab is the first to have set one up. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8364} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8365} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8366} The state's diwan has three parts: the army (enrolment and pay), the business of revenue (tithe, land-tax, the non-Muslims' poll tax and the frontier duties), and the officials (appointment, dismissal and their stipends); a judge's diwan holds his records and minutes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8366} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8367} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8368} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8371}"
  ur: "دیوان وہ رجسٹر ہے جس میں نام یا دستاویزات درج کی جائیں، اور ریاست کے کاموں، اموال اور عاملوں کا حساب رکھا جائے۔ عمر بن الخطاب نے پہلا دیوان قائم کیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8364} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8365}"
