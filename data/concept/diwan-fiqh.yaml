label:
  ar: "الديوان ⁦(في الفقه والسياسة الشرعية)⁩"
  en: "Diwan (the state register: the office books of troops, taxes, judges and governors)"
  ur: "دیوان ⁦(ریاستی رجسٹر اور دفتر)⁩"
  es: "Diwan (el registro estatal: los libros de oficina de tropas, impuestos, jueces y gobernadores)"
  fr: "Diwan (le registre d'État: les livres de comptes des troupes, des impôts, des juges et des gouverneurs)"
  tr: "Diwan (Fıkıh ve Şeriat Siyaseti alanında)"
  id: "Diwan (dalam Politik Yurisprudensi dan Syariah)"
summary:
  ar: "الديوان دفتر تثبت فيه الأسماء أو الوثائق، وما وضع لحفظ ما يتعلق بحقوق الدولة من أعمال وأموال وعمال، ويختلف الفقهاء في اتخاذه، فيجيزه المالكية، ويستحبه الشافعية، وينبغيه الحنابلة، وأول من وضعه عمر بن الخطاب. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8364} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8365} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8366} وينقسم ديوان الدولة إلى ما يختص بالجيش من إثبات وعطاء، وما يختص بالأعمال من رسوم وحقوق، وما يختص بالعمال من تقليد وعزل وجاري، ويكتب فيه القاضي ديوانه من محاضر وسجلات. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8366} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8367} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8368} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8371}"
  en: "A diwan is a register in which names or documents are entered, and which keeps what concerns the state's business, funds and officials. The jurists differ over keeping one: the Malikis allow it, the Shafi'is recommend it, the Hanbalis say it is fitting; Umar ibn al-Khattab is the first to have set one up. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8364} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8365} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8366} The state's diwan has three parts: the army (enrolment and pay), the business of revenue (tithe, land-tax, the non-Muslims' poll tax and the frontier duties), and the officials (appointment, dismissal and their stipends); a judge's diwan holds his records and minutes. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8366} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8367} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8368} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8371}"
  ur: "دیوان وہ رجسٹر ہے جس میں نام یا دستاویزات درج کی جائیں، اور ریاست کے کاموں، اموال اور عاملوں کا حساب رکھا جائے۔ عمر بن الخطاب نے پہلا دیوان قائم کیا۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8364} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8365}"
  es: "Un diwan es un registro en el que se inscriben nombres o documentos y que guarda lo que concierne a los asuntos, fondos y funcionarios del estado. Los juristas difieren sobre su mantenimiento: los malikíes lo permiten, los shafi'ís lo recomiendan, los hanbalíes dicen que es apropiado; Umar ibn al-Khattab fue el primero en establecer uno. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8364} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8365} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8366} El diwan del estado tiene tres partes: el ejército (inscripción y pago), los asuntos de ingresos (diezmo, impuesto sobre la tierra, impuesto de capitación de los no musulmanes y derechos fronterizos) y los funcionarios (nombramiento, destitución y sus estipendios); el diwan de un juez guarda sus registros y actas. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8366} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8367} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8368} {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.8371}"
  fr: "Un diwan est un registre dans lequel sont inscrits les noms et les documents, et qui conserve les informations relatives aux affaires, aux fonds et aux fonctionnaires de l'État. Les juristes divergent quant à son utilisation: les Malikites l'autorisent, les Chafi'ites le recommandent, les Hanbalites le jugent approprié; Umar ibn al-Khattab est le premier à en avoir établi un. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8364} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8365} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8366} Le diwan de l'État comprend trois parties: l'armée (enrôlement et solde), les finances (dîme, impôt foncier, capitation des non-musulmans et droits de passage frontaliers) et les fonctionnaires (nomination, révocation et traitement). le diwan d'un juge contient ses dossiers et ses procès-verbaux. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8366} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8367} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8368} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.8371}"
  tr: "Diwan, isimlerin veya belgelerin kaydedildiği ve devlet haklarını korumak için kurulan belgeler, örneğin tapular, para ve işçiler gibi şeylerin kaydedildiği bir sicildir. Hukukçular kullanımında farklılık gösterir; Maliki mezhebi izin verir, Şafiiler tavsiye eder ve Hanbalılar bunu arzu eder. İlk kuran Ömer bin el-Hattab'tır. {atı:fiqh-mawsua-kuveytiyya-noor-v3 s.8364} {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.8365} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8366} Devlet Ofisi, askeri belgeler ve hibeler, işçi ücretleri ve işçi hakları ile işçilerle ilgili taklit, işten çıkarma ve işlemler gibi konulara ayrılmıştır. Yargıç, diwanını kayıtlara ve kayıtlara kaydeder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8366} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8367} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8368} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.8371}"
  id: "Diwan adalah sebuah register di mana nama atau dokumen dicatat, dan apa yang didirikan untuk menjaga hak-hak negara, seperti akta, uang, dan pekerja. Para ahli hukum berbeda dalam penggunaannya; mazhab Maliki mengizinkannya, Shafi'i merekomendasikannya, dan Hanbal menganggapnya diinginkan. Yang pertama menetapkannya adalah Umar ibn al-Khattab. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8364} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8365} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8366} Kantor Negara dibagi menjadi hal-hal yang berkaitan dengan dokumen militer dan hibah, biaya dan hak terkait kerja, serta yang berkaitan dengan pekerja, seperti peniruan, pemecatan, dan transaksi. Hakim mencatat diwannya dalam catatan dan catatan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8366} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8367} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8368} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.8371}"
