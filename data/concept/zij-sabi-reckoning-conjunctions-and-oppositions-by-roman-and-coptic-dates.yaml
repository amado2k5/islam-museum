label: { ar: "حساب الاجتماعات والمقابلات بتاريخ الروم والقبط", en: "Reckoning conjunctions and oppositions by Roman and Coptic dates", ur: "رومی اور قبطی تاریخ سے اجتماع اور مقابلے کا حساب", es: "Cálculo de conjunciones y oposiciones mediante fechas romanas y coptas", fr: "Calcul des conjonctions et des oppositions selon les dates romaines et coptes", tr: "Roma ve Kıpti takvimlerine göre toplantı ve görüşmelerin kaydı", id: "Catatan pertemuan dan wawancara menurut kalender Romawi dan Koptik" }
summary:
  ar: "يبيّن البتاني طريقة حساب الاجتماعات والمقابلات بين الشمس والقمر في أي شهر من شهور الروم، بأن تُؤخذ سنو ذي القرنين ولا تُدخل السنة التي أنت فيها في العدد حتى ينقضي شباط، ثم يُطلب مثل عدد السنين في جداول الاجتماع أو الاستقبال المجموعة. {cite:zij-sabi-nallino-byblion p.138}."
  en: "Al-Battani explains how to reckon the conjunctions and oppositions of the Sun and the Moon in any month of the Roman calendar: one takes the years of Dhu al-Qarnayn, without counting the current year until February is over, and then looks up the same number of years in the combined tables of conjunction or opposition. {cite:zij-sabi-nallino-byblion p.138}."
  ur: "البتانی بتاتے ہیں کہ رومی مہینے میں سورج اور چاند کے اجتماع اور مقابلے کا حساب کیسے ہو: ذو القرنین کے سال لیے جاتے ہیں، اور موجودہ سال اس وقت تک شمار نہیں کیا جاتا جب تک شباط ختم نہ ہو، پھر اجتماع یا مقابلے کے مجموعی جدولوں میں اتنے ہی سال دیکھے جاتے ہیں۔ {cite:zij-sabi-nallino-byblion p.138}۔"
  es: "Al-Battani explica cómo calcular las conjunciones y oposiciones del Sol y la Luna en cualquier mes del calendario romano: se toman los años de Dhu al-Qarnayn, sin contar el año actual hasta que termine febrero, y luego se consulta el mismo número de años en las tablas combinadas de conjunción u oposición. {cite:zij-sabi-nallino-byblion p.138}."
  fr: "Al-Battani explique comment calculer les conjonctions et les oppositions du Soleil et de la Lune pour chaque mois du calendrier romain: on prend les années de Dhu al-Qarnayn, sans compter l’année en cours jusqu’à la fin février, puis on consulte les tables combinées de conjonction ou d’opposition pour le même nombre d’années. {cite:zij-sabi-nallino-byblion p.138}."
  tr: "Al-Battani, Roma takviminin herhangi bir ayında güneş ve ay arasındaki kavuşum ve karşıtlıkların hesaplanma yöntemini, Zülkarneyn yıllarını alıp, Şubat ayı geçene kadar mevcut yılı sayıma dahil etmeyerek, daha sonra toplanan kavuşum veya karşıtlık tablolarında aynı sayıda yılı isteyerek açıklıyor. {cite:zij-sabi-nallino-byblion s.138}."
  id: "Al-Battani menjelaskan metode menghitung konjungsi dan oposisi antara matahari dan bulan di bulan mana pun dalam kalender Romawi, dengan mengambil tahun Dzul-Qarnayn dan tidak memasukkan tahun berjalan dalam perhitungan sampai bulan Februari berlalu, kemudian meminta jumlah tahun yang sama dalam tabel konjungsi atau oposisi yang telah dikumpulkan. {cite:zij-sabi-nallino-byblion p.138}."
