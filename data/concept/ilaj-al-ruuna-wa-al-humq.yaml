id: concept/ilaj-al-ruuna-wa-al-humq
class: concept
kind: scientific
label:
  ar: "علاج الرعونة والحمق"
  en: "Treatment of ru'una and humq"
  ur: "رعونت اور حمق کا علاج"
  es: "Tratamiento de ru'una y humq"
  fr: "Traitement du ru'una et du humq"
  tr: "Dikkatsizlik ve aptallığın tedavisi"
  id: "Perlakuan terhadap kecerobohan dan kebodohan"
summary:
  ar: "يذكر ابن سينا مبادئ علاج الرعونة والحمق: تسخين الدماغ وترطيبه إن كان مع يبوسة، أو التحليل والاستفراغ إن كان عن مادة، وتنبيه القلب، وبيت مضيء، واليقظة وتلطيف الغذاء، وأن أعدى الأشياء للذهن الامتلاء؛ ولا تُنقل الوصفات ولا طرق الاستعمال {cite:canon-ibn-sina-print-v2 p.98} {cite:canon-ibn-sina-print-v2 p.99}"
  en: "Ibn Sina gives the principles of treating ru'una and humq: warming the brain and moistening it if with dryness, or dissolving and evacuation if from matter, rousing the heart, a bright house, wakefulness and lightening of the food, and that nothing is worse for the mind than fullness; recipes and methods of application are not reproduced {cite:canon-ibn-sina-print-v2 p.98} {cite:canon-ibn-sina-print-v2 p.99}"
  ur: "ابن سینا رعونت اور حمق کے علاج کے اصول بتاتا ہے: دماغ کو گرم کرنا اور خشکی ہو تو تر کرنا، یا مادے سے ہو تو تحلیل اور استفراغ، دل کو جگانا، روشن گھر، بیداری اور غذا ہلکی کرنا، اور یہ کہ ذہن کا سب سے بڑا دشمن بھراؤ ہے؛ نسخے اور استعمال کے طریقے نقل نہیں کیے گئے {cite:canon-ibn-sina-print-v2 p.98} {cite:canon-ibn-sina-print-v2 p.99}۔"
  es: "Ibn Sina expone los principios para tratar la ru'una y el humq: calentar el cerebro y humedecerlo si está seco, o disolverlo y evacuarlo si está libre de materia, estimular el corazón, mantener una casa luminosa, estar despierto y comer ligero, y que nada es peor para la mente que la saciedad; no se reproducen recetas ni métodos de aplicación {cite:canon-ibn-sina-print-v2 p.98} {cite:canon-ibn-sina-print-v2 p.99}"
  fr: "Ibn Sina expose les principes du traitement de la ru'una et du humq: réchauffer le cerveau et l'hydrater en cas de sécheresse, ou dissoudre et évacuer les toxines si elles sont d'origine environnementale, éveiller le cœur, veiller à la luminosité de la maison, favoriser la vigilance et alléger l'alimentation, et affirmer que rien n'est pire pour l'esprit que la satiété; les recettes et les méthodes d'application ne sont pas reproduites. {cite:canon-ibn-sina-print-v2 p.98} {cite:canon-ibn-sina-print-v2 p.99}"
  tr: "İbn Sina, dikkatsizlik ve aptallığın tedavi ilkelerinden bahseder: beyin kuruysa ısıtmak ve nemlendirmek, bir maddeyle ilgiliyse analiz edip kusmak, kalbi uyarmak, parlak bir ev, uyanıklık ve yatıştırıcı yiyecekler sağlamak ve zihin için en önemli şeyin tokluk olduğunu belirtir; ne tarifler ne de kullanım yöntemleri aktarılmaz; {cite:canon-ibn-sina-print-v2 s.98} {cite:canon-ibn-sina-print-v2 s.99}"
  id: "Ibn Sina menyebutkan prinsip penanganan terhadap kecerobohan dan kebodohan: menghangatkan dan melembapkan otak jika kering, atau menganalisis dan muntah jika otak berkaitan dengan suatu zat, merangsang jantung, rumah yang cerah, kewaspadaan dan makanan yang menenangkan, serta bahwa hal terpenting bagi pikiran adalah kepenuhan; baik resep maupun metode penggunaan tidak diteruskan {cite:canon-ibn-sina-print-v2 hlm.98} {cite:canon-ibn-sina-print-v2 hlm.99}"
