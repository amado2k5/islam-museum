label:
  ar: خبر الآحاد
  en: The single report (khabar al-ahad)
summary:
  ar: "يرى الشيخ علي الخفيف أن العمل بخبر الآحاد واجب إذا غلب على الظن أن النبي قاله أو فعله أو أقره، لأن وجوب العمل شرعًا منوط بالظن لا بالقطع {cite:makanat-al-sunna-azhar p. 41}. ويذكر أن القول بعدم وجوب العمل بخبر الآحاد قال به فريق من أهل الأهواء، كالرافضة والفلاسفة وبعض المعتزلة، وأنه يقضي على السنة كلها، لأنه ليس بعد المتواتر من السنة العملية في الصلاة والزكاة والصيام والحج إلا أخبار الآحاد {cite:makanat-al-sunna-azhar p. 84}. ويستدل بأن النبي اعتمد الآحاد في تبليغ دعوته وأحكامه، وبأن المسلمين ركنوا إلى أخبار الآحاد في معاملاتهم وقضائهم وفتاواهم وعباداتهم بعد وفاته {cite:makanat-al-sunna-azhar p. 84}. وأول من تصدى لرد هذا الرأي وبسطه، كما يذكر، هو الشافعي في الرسالة، وهي ما يحيل إليه القارئ {cite:makanat-al-sunna-azhar p. 85}."
