id: concept/khabar-al-ahad
class: concept
kind: term
label:
  ar: خبر الآحاد
  en: The single report (khabar al-ahad)
  es: "El informe único (khabar al-ahad)"
  fr: "Le rapport unique (khabar al-ahad)"
  ur: "واحد رپورٹ ⁦(خبر الاحد)⁩"
  tr: "Pazar Haberleri"
  id: "Berita Minggu"
summary:
  ar: "يرى الشيخ علي الخفيف أن العمل بخبر الآحاد واجب إذا غلب على الظن أن النبي قاله أو فعله أو أقره، لأن وجوب العمل شرعًا منوط بالظن لا بالقطع {cite:makanat-al-sunna-azhar p. 41}. ويذكر أن القول بعدم وجوب العمل بخبر الآحاد قال به فريق من أهل الأهواء، كالرافضة والفلاسفة وبعض المعتزلة، وأنه يقضي على السنة كلها، لأنه ليس بعد المتواتر من السنة العملية في الصلاة والزكاة والصيام والحج إلا أخبار الآحاد {cite:makanat-al-sunna-azhar p. 84}. ويستدل بأن النبي اعتمد الآحاد في تبليغ دعوته وأحكامه، وبأن المسلمين ركنوا إلى أخبار الآحاد في معاملاتهم وقضائهم وفتاواهم وعباداتهم بعد وفاته {cite:makanat-al-sunna-azhar p. 84}. وأول من تصدى لرد هذا الرأي وبسطه، كما يذكر، هو الشافعي في الرسالة، وهي ما يحيل إليه القارئ {cite:makanat-al-sunna-azhar p. 85}."
  tr: "Şeyh Ali Al-Kizik, yalnız raporların raporuna göre hareket etmenin, Peygamber'in bunu söylediğine, hareket ettiğine veya kabul ettiğine güçlü bir şekilde inanılırsa zorunlu olduğuna inanır; çünkü bu rapora göre hareket etme zorunluluğu dini olarak varsayıma bağlıdır, kesinliğe değil. {atıf:Makanat-al-Sunna-Ezhar s. 41}. Yalnız raporların raporuna göre hareket etmenin zorunlu olmadığı görüşünün, Rafidah, filozoflar ve bazı Mu'tezililer gibi bir grup arzu tarafından benimsendiğini ve bunun tüm Sünnet'i geçersiz kıldığını, çünkü namaz namaz kılma, zekat, oruç ve hacda ayin yoluyla aktarılan sünnetten sonra yalnız niamların rivayetleri kalır. {atıf:makanat-al-sunna-azhar s. 84}. Peygamber'in çağrı ve hükümlerini iletmek için yalnız rivayetçilere (yalnız rivayetlere) dayandığı, Müslümanların ise ölümünden sonra eylemlerinde, yargılarında, fetvalarında ve ibadet eylemlerinde yalnız rivayetlere dayandığı kanıtlanmıştır {atıf:makanat-al-sunna-azhar, s. 84}. Bu görüşe ilk yanıt veren ve detaylandıran kişi, okuyucuya atıfta bulunan eserde bulunan el-Şafi'dir {cite:makanat-al-sunna-azhar s. 85}."
  id: "Sheikh Ali Al-Khafif percaya bahwa bertindak berdasarkan laporan tunggal adalah wajib jika sangat diyakini bahwa Nabi telah mengatakan, bertindak, atau mengakuinya, karena kewajiban bertindak berdasarkan itu secara agama bergantung pada dugaan, bukan kepastian. {cite:makanat-al-sunna-azhar hlm. 41}. Beliau menyebutkan bahwa pendapat bahwa bertindak atas laporan laporan tunggal tidak wajib dipegang oleh sekelompok keinginan, seperti Rafidah, filsuf, dan beberapa Mu'tazilite, dan bahwa hal itu membatalkan seluruh Sunnah, karena setelah Sunnah yang disampaikan massal dalam doa, zakat, puasa, dan ziarah, tidak ada apa-apa selain laporan doa tunggal {cite:makanat-al-sunna-azhar hlm. 84}. Terbukti bahwa Nabi mengandalkan narator tunggal (narasi tunggal) dalam menyampaikan seruan dan keputusannya, dan bahwa umat Muslim mengandalkan laporan tunggal dalam perlakuan, penilaian, fatwa, dan ibadah setelah kematiannya {cite:makanat-al-sunna-azhar, hlm. 84}. Orang pertama yang menanggapi dan mengembangkan pandangan ini, seperti yang disebutkan, adalah al-Shafi'i dalam risalah tersebut, yang merujuk pada pembaca {cite:makanat-al-sunna-azhar hlm. 85}."
