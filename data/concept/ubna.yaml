label: { ar: "الأُبْنَة", en: "Ubna (a desire for a forbidden act)" }
summary:
  ar: "الأُبْنَة في اصطلاح الفقهاء داءٌ في باطن الدُّبُر يشتهي معه صاحبه الفعل المحرّم الذي فعله قوم لوط. يُطلب من المبتلى مجاهدة نفسه والامتناع عن دواعيه، فإن وقع في المحرّم أُجريت عليه أحكام اللواط، ومن رماه غيره بذلك طُبّقت عليه أحكام القذف حدّاً أو تعزيراً. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1466} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1467}"
  en: "In the jurists' usage, ubna is a condition in the inner rectum that makes a person desire the forbidden act of the people of Lot. The afflicted person is asked to struggle against the desire and to refrain from its causes. If he commits the forbidden act, the rules of sodomy apply to him; if another accuses him of it, the rules of slander apply to the accuser, as a fixed punishment or a discretionary one. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1466} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.1467}"
