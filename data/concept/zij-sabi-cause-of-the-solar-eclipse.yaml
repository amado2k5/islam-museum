id: concept/zij-sabi-cause-of-the-solar-eclipse
class: concept
kind: scientific
label: { ar: "علة الكسوف الشمسي", en: "The cause of the solar eclipse", ur: "شمسی کسوف کی علت", es: "La causa del eclipse solar", fr: "La cause de l'éclipse solaire" }
summary:
  ar: "الكسوف الشمسي يقع حين يحول القمر بين البصر والشمس في وقت الاجتماع، إذ يكون مركزه على نطاق البروج ويكون أقرب إلى الأرض من الشمس، والصغير القريب يستر الكبير البعيد. {cite:zij-sabi-nallino-byblion p.84}."
  en: "A solar eclipse happens when, at conjunction, the Moon comes between the eye and the Sun. Its centre lies on the zodiac belt and it is nearer to the Earth than the Sun is, so the small nearby body hides the large distant one. {cite:zij-sabi-nallino-byblion p.84}."
  ur: "شمسی کسوف اس وقت ہوتا ہے جب اجتماع کے وقت چاند آنکھ اور سورج کے درمیان آ جائے۔ اس کا مرکز بروجی پٹی پر ہوتا ہے اور وہ سورج سے زمین کے زیادہ قریب ہے، تو قریب کی چھوٹی جسامت دور کی بڑی جسامت کو ڈھانپ لیتی ہے۔ {cite:zij-sabi-nallino-byblion p.84}۔"
  es: "Un eclipse solar ocurre cuando, en conjunción, la Luna se interpone entre el ojo y el Sol. Su centro se encuentra en el cinturón zodiacal y está más cerca de la Tierra que el Sol, por lo que el pequeño cuerpo cercano oculta al grande y distante. {cite:zij-sabi-nallino-byblion p.84}."
  fr: "Une éclipse solaire se produit lorsque, lors de la conjonction, la Lune se place entre l'œil et le Soleil. Son centre se situe sur la ceinture zodiacale et, étant plus proche de la Terre que le Soleil, le petit astre proche masque le grand astre lointain. {cite:zij-sabi-nallino-byblion p.84}."
