label:
  ar: المسيح عيسى
  en: The Messiah Jesus
  ur: مسیح عیسیٰ
summary:
  ar: "المسيح عيسى بن مريم في القرآن والسنة: نبي الله ورسوله، ينزل في آخر الزمان فيكسر الصليب ويقتل الخنزير ويقتل الدجال ويحكم بين الناس بالعدل، ويصلي خلف المهدي أو يأتم به."
  en: "The Messiah Jesus son of Mary in Qur'an and Sunnah: the prophet and messenger of God, who descends in the last days to break the cross, kill the pig, kill the Dajjal, judge the people justly, and lead or follow the Mahdi in prayer."
  ur: "مسیح عیسیٰ ابن مریم قرآن و سنت میں: اللہ کے نبی اور رسول، جو آخری زمانے میں نازل ہوتے ہیں اور صلیب توڑتے ہیں، سور مار دیتے ہیں، دجال کو قتل کرتے ہیں، لوگوں کو عدل سے فیصلہ کرتے ہیں، اور مہدی کی پیچھے یا امامتے میں نماز پڑھتے ہیں۔"
