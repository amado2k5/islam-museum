id: concept/al-masih
class: concept
kind: belief
label:
  ar: المسيح عيسى
  en: The Messiah Jesus
  fr: "Le Messie Jésus"
  ur: مسیح عیسیٰ
  es: "El Mesías Jesús"
  tr: "Aman Tanrım"
  id: "Ya ampun"
summary:
  ar: "المسيح عيسى بن مريم في القرآن والسنة: نبي الله ورسوله، ينزل في آخر الزمان فيكسر الصليب ويقتل الخنزير ويقتل الدجال ويحكم بين الناس بالعدل، ويصلي خلف المهدي أو يأتم به."
  en: "The Messiah Jesus son of Mary in Qur'an and Sunnah: the prophet and messenger of God, who descends in the last days to break the cross, kill the pig, kill the Dajjal, judge the people justly, and lead or follow the Mahdi in prayer."
  fr: "Le Messie Jésus, fils de Marie, dans le Coran et la Sunna : prophète et messager de Dieu, il descend à la fin des temps pour briser la croix, tuer le porc et le Dajjal, juger les gens avec justice et diriger la prière du Mahdi ou prier derrière lui."
  ur: "مسیح عیسیٰ ابن مریم قرآن و سنت میں: اللہ کے نبی اور رسول، جو آخری زمانے میں نازل ہوتے ہیں اور صلیب توڑتے ہیں، سور مار دیتے ہیں، دجال کو قتل کرتے ہیں، لوگوں کو عدل سے فیصلہ کرتے ہیں، اور مہدی کی پیچھے یا امامتے میں نماز پڑھتے ہیں۔"
  es: "El Mesías Jesús, hijo de María, en el Corán y la Sunnah: el profeta y mensajero de Dios, que desciende en los últimos días para romper la cruz, matar al cerdo, matar al Dajjal, juzgar a la gente con justicia y guiar o seguir al Mahdi en la oración."
  tr: "Kur'an ve Sünnet'te Meryem'in oğlu İsa: Allah'ın Peygamberi ve Elçisi, zamanın kıymetinde inip çarmıhı kıracak, domuzu öldürecek, Deccal'i öldürecek, insanlar arasında adil yargı yapacak ve Mehdi'nin arkasında namaz kılacak ya da onu takip edecek."
  id: "Dalam Al-Qur'an dan Sunnah, Yesus, putra Maria, digambarkan sebagai Rasul dan Rasulullah, yang akan turun sesuai waktu, mematahkan salib, membunuh babi, membunuh Antikristus, menghakimi dengan adil di antara manusia, dan berdoa di belakang Mahdi atau mengikuti-Nya."
