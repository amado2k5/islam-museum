summary:
  ar: "كيف أُصلحت الفصحى في القرن التاسع عشر على يد أحمد فارس الشدياق وناصيف اليازجي وابنه إبراهيم وبطرس البستاني، من الصحافة والمعجم والطباعة إلى المقامة، كما يعرض ملخص بحثي قُدّم إلى المتحف {cite:britannica-arabic-literary-renaissance} {cite:cambridge-arabic-thought-beyond-the-liberal-age-intro}."
  en: "How classical Arabic was reformed in the nineteenth century by Ahmad Faris al-Shidyaq, Nasif al-Yaziji and his son Ibrahim, and Butrus al-Bustani, through newspapers, the dictionary, type and the maqama, as a research summary supplied to the museum presents it {cite:britannica-arabic-literary-renaissance} {cite:cambridge-arabic-thought-beyond-the-liberal-age-intro}."
  ur: "انیسویں صدی میں فصحیٰ کی اصلاح احمد فارس شدیاق، ناصیف یازجی اور ان کے بیٹے ابراہیم اور بطرس بستانی کے ہاتھوں کیسے ہوئی، صحافت، لغت، طباعت اور مقامے کے ذریعے، جیسا میوزیم کو دیا گیا تحقیقی خلاصہ پیش کرتا ہے {cite:britannica-arabic-literary-renaissance} {cite:cambridge-arabic-thought-beyond-the-liberal-age-intro}۔"
  fr: "Comment l'arabe classique fut réformé au XIXe siècle par Ahmad Faris al-Shidyaq, Nasif al-Yaziji et son fils Ibrahim, et Butrus al-Bustani, par la presse, le dictionnaire, la typographie et la maqama, tel que le présente une synthèse de recherche remise au musée {cite:britannica-arabic-literary-renaissance} {cite:cambridge-arabic-thought-beyond-the-liberal-age-intro}."
  es: "Cómo se reformó el árabe clásico en el siglo XIX por obra de Ahmad Faris al-Shidyaq, Nasif al-Yaziji y su hijo Ibrahim, y Butrus al-Bustani, mediante la prensa, el diccionario, la tipografía y la maqama, tal como lo presenta un resumen de investigación entregado al museo {cite:britannica-arabic-literary-renaissance} {cite:cambridge-arabic-thought-beyond-the-liberal-age-intro}."
