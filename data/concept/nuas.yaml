label: { ar: "النُّعَاس", en: "Nu'as (drowsiness)", ur: "نعاس ⁦(اونگھ)⁩", es: "Nu'as (somnolencia)", fr: "Nu'as (somnolence)", tr: "uyku hali", id: "kantuk" }
summary:
  ar: "النعاس في اللغة أول النوم أو النوم القليل، وهو فتور الحواس يقارب النوم، ويفارق النوم بأن الحواس لا تسقط فيه، فيسمع صاحبه ما يقال عنده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15795} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15796} ولا ينقض الوضوء عند جمهور الفقهاء، والمستحب التوضؤ منه، والحنفية يفرقون بين الخفيف الذي لا ينقض والثقيل الذي ينقض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15796} وفي المسجد يوم الجمعة يستحب لمن نعس أن يتحول عن موضعه، وهو قول الشافعي وابن قدامة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15796}"
  en: "Nu'as, in the lexicon, is the start of sleep or light sleep; the senses weaken but do not drop as in sleep, so the drowsy person still hears what is said near him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15795} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15796} Most jurists hold that drowsiness does not break ablution, and recommend renewing it. The Hanafis distinguish light drowsiness, which does not break it, from heavy drowsiness, which does. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15796} Someone who dozes in the mosque on Friday is recommended by Ibn Qudama and al-Shafi'i to move from his place. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15796}"
  ur: "نعاس لغت میں نیند کا آغاز یا ہلکی نیند ہے، جس میں حواس کمزور ہوتے ہیں مگر سلب نہیں ہوتے، چنانچہ سونے والا اپنے قریب کی بات سن لیتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15795} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15796} جمہور فقہاء کے نزدیک نعاس سے وضو نہیں ٹوٹتا اور بہتر یہ ہے کہ دوبارہ وضو کیا جائے۔ حنفیہ ہلکی اونگھ ⁦(جو ناقض نہیں)⁩ اور گہری اونگھ ⁦(جو ناقض ہے)⁩ میں فرق کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15796} جمعہ کے دن مسجد میں اونگھ آئے تو جگہ بدلنا مستحب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15796}"
  es: "Nu'as, en el léxico, es el comienzo del sueño o sueño ligero; los sentidos se debilitan pero no caen como en el sueño, por lo que la persona somnolienta aún escucha lo que se dice cerca de ella. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15795} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15796} La mayoría de los juristas sostienen que la somnolencia no invalida la ablución y recomiendan renovarla. Los hanafíes distinguen la somnolencia ligera, que no la invalida, de la somnolencia profunda, que sí la invalida. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15796} A quien cabecea en la mezquita el viernes se le recomienda, según Ibn Qudama y al-Shafi'i, que se mueva de su lugar. {cita:fiqh-mawsua-kuwaitiyya-noor-v3 p.15796}"
  fr: "Dans le lexique, le terme « nu'as » désigne le début du sommeil ou un sommeil léger; les sens s'affaiblissent sans toutefois s'éteindre complètement comme pendant le sommeil, de sorte que la personne somnolente entend encore ce qui se dit près d'elle. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15795} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15796} La plupart des juristes estiment que la somnolence n'invalide pas les ablutions et recommandent de les renouveler. Les hanafites distinguent la somnolence légère, qui ne les invalide pas, de la somnolence profonde, qui les invalide. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15796} Ibn Qudama et al-Shafi'i recommandent à celui qui s'assoupit à la mosquée le vendredi de quitter sa place. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15796}"
  tr: "Dilbilimde, uyku hali uykunun ya da az uykunun başlangıcıdır ve uykuya yaklaşan şey, duyuların serinliğidir ve uykuya düşmediği için uykudan çıkar, bu yüzden kişi kendisine söylenenleri dinler. {alıntı:fiqh-mawsua-kuveytiyya-noor-v3 s.15795} {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.15796} Çoğu hukukçuya göre, abdest alozu geçersiz sayılmaz, abdest alma yapılması tavsiye edilir. Hanafiler, onu geçersiz kılmayan hafif su ile geçersiz kılmayan ağır suyu ayırt eder. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15796} Cuma günü camide, uykulu birinin yerinden kayması önerilir; bu, Al-Shafi'i ve İbn Qudamah'ın görüşüdür. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.15796}"
  id: "Dalam linguistik, kantuk adalah awal dari tidur atau sedikit tidur, dan dinginnya indra yang mendekati tidur, dan itu meninggalkan tidur karena indera tidak jatuh ke dalamnya, sehingga orang tersebut mendengarkan apa yang dikatakan kepada mereka. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15795} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15796} Menurut mayoritas ahli hukum, wudhu tidak dibatalkan, dan disarankan untuk melakukan wudhu dari air tersebut. Hanafi membedakan antara air ringan yang tidak membatalkannya dan air berat yang tidak membatalkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.15796} Di masjid pada hari Jumat, disarankan bagi seseorang yang mengantuk untuk berpindah dari tempatnya, yang menurut pandangan Al-Shafi'i dan Ibn Qudamah. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15796}"
