id: concept/nuas
class: concept
kind: legal
label: { ar: "النُّعَاس", en: "Nu'as (drowsiness)", ur: "نعاس (اونگھ)" }
summary:
  ar: "النعاس في اللغة أول النوم أو النوم القليل، وهو فتور الحواس يقارب النوم، ويفارق النوم بأن الحواس لا تسقط فيه، فيسمع صاحبه ما يقال عنده. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15795} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15796} ولا ينقض الوضوء عند جمهور الفقهاء، والمستحب التوضؤ منه، والحنفية يفرقون بين الخفيف الذي لا ينقض والثقيل الذي ينقض. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15796} وفي المسجد يوم الجمعة يستحب لمن نعس أن يتحول عن موضعه، وهو قول الشافعي وابن قدامة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15796}"
  en: "Nu'as, in the lexicon, is the start of sleep or light sleep; the senses weaken but do not drop as in sleep, so the drowsy person still hears what is said near him. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15795} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15796} Most jurists hold that drowsiness does not break ablution, and recommend renewing it. The Hanafis distinguish light drowsiness, which does not break it, from heavy drowsiness, which does. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15796} Someone who dozes in the mosque on Friday is recommended by Ibn Qudama and al-Shafi'i to move from his place. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15796}"
  ur: "نعاس لغت میں نیند کا آغاز یا ہلکی نیند ہے، جس میں حواس کمزور ہوتے ہیں مگر سلب نہیں ہوتے، چنانچہ سونے والا اپنے قریب کی بات سن لیتا ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15795} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15796} جمہور فقہاء کے نزدیک نعاس سے وضو نہیں ٹوٹتا اور بہتر یہ ہے کہ دوبارہ وضو کیا جائے۔ حنفیہ ہلکی اونگھ (جو ناقض نہیں) اور گہری اونگھ (جو ناقض ہے) میں فرق کرتے ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15796} جمعہ کے دن مسجد میں اونگھ آئے تو جگہ بدلنا مستحب ہے۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.15796}"
