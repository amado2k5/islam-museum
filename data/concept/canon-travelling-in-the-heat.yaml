id: concept/canon-travelling-in-the-heat
class: concept
kind: scientific
label: { ar: "السفر في الحر عند ابن سينا", en: "Travelling in the heat in the Canon", ur: "گرمی میں سفر قانون میں", es: "Viajar bajo el calor en el Canon", fr: "Voyager sous la chaleur dans le Canon", tr: "İbn Sina'ya göre sıcakta seyahat", id: "Bepergian di panas menurut Ibn Sina" }
summary:
  ar: "يفرد ابن سينا فصلاً لتوقي الحر في السفر: إذا لم يدبر المسافرون أنفسهم ضعفوا وتحللت قواهم وغلبهم العطش وأضرت الشمس بأدمغتهم، فيحرصون على ستر الرأس، ويحفظون الصدر بطلاء من لعاب بزر قطونا وعصارة البقلة الحمقاء، ويتناولون قبل السير سويق الشعير أو شراب الفواكه {cite:canon-ibn-sina-print-v1 pp.262}."
  en: "Ibn Sina gives a chapter to guarding against heat on a journey: if travellers do not order themselves, they weaken, their powers dissolve, thirst overcomes them and the sun harms their brains; so they take care to cover the head, protect the chest with a coating of psyllium mucilage and purslane juice, and take barley meal or fruit drink before setting out {cite:canon-ibn-sina-print-v1 pp.262}."
  es: "Ibn Sina dedica un capítulo a la protección contra el calor durante un viaje: si los viajeros no se cuidan, se debilitan, sus fuerzas se agobian, la sed los vence y el sol daña sus cerebros; por lo tanto, se aseguran de cubrirse la cabeza, proteger el pecho con una capa de mucílago de psyllium y jugo de verdolaga, y tomar harina de cebada o bebida de frutas antes de partir {cite:canon-ibn-sina-print-v1 pp.262}."
  fr: "Ibn Sina consacre un chapitre à la protection contre la chaleur lors d'un voyage: si les voyageurs ne s'ordonnent pas, ils s'affaiblissent, leurs forces se dissolvent, la soif les submerge et le soleil nuit à leur cerveau; ils prennent donc soin de se couvrir la tête, de protéger leur poitrine avec une couche de mucilage de psyllium et de jus de pourpier, et de prendre de la farine d'orge ou une boisson aux fruits avant de partir {cite:canon-ibn-sina-print-v1 pp.262}."
  ur: "ابن سینا سفر میں گرمی سے بچاؤ کا ایک باب دیتا ہے: اگر مسافر اپنے آپ کو حکم نہ دیں تو وہ کمزور ہو جاتے ہیں، ان کی طاقتیں تحلیل ہو جاتی ہیں، پیاس ان پر قابو پاتی ہے اور سورج ان کے دماغ کو نقصان پہنچاتا ہے۔ اس لیے وہ سر کو ڈھانپنے کا خیال رکھتے ہیں، سینے کو سائیلیم میوکیلیج اور پرسلین جوس کی کوٹنگ سے بچاتے ہیں، اور باہر نکلنے سے پہلے جو کا کھانا یا پھلوں کا مشروب لیتے ہیں۔"
  tr: "İbn Sina, seyahat sırasında ısıya karşı korumaya bir bölüm ayırır: Yolcular kendilerini idare edemezlerse, güçleri zayıflar, susuzluk onları boğar ve güneş beyinlerine zarar verir. Başlarını örtmeli, göğüslerini pamuk tohumu tükürüğü ve aptal bir seziotun suyu ile korumalı ve yolculuktan önce arpa, arpa veya meyve içeceği tüketmelidirler {cite:canon-ibn-sina-print-v1 s.262}."
  id: "Ibn Sina mendedikasikan sebuah bab untuk melindungi dari panas selama perjalanan: Jika para pelancong tidak bisa mengatur diri, kekuatan mereka melemah, haus menguasai, dan matahari merusak otak mereka. Mereka harus menutupi kepala, melindungi dada dengan lapisan air liur biji kapas dan jus purslane yang bodoh, serta mengonsumsi jelai jelai atau minuman buah sebelum bepergian {cite:canon-ibn-sina-print-v1 hlm.262}."
