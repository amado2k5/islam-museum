id: concept/canon-travelling-in-the-heat
class: concept
kind: scientific
label: { ar: "السفر في الحر عند ابن سينا", en: "Travelling in the heat in the Canon", ur: "گرمی میں سفر قانون میں" }
summary:
  ar: "يفرد ابن سينا فصلاً لتوقي الحر في السفر: إذا لم يدبر المسافرون أنفسهم ضعفوا وتحللت قواهم وغلبهم العطش وأضرت الشمس بأدمغتهم، فيحرصون على ستر الرأس، ويحفظون الصدر بطلاء من لعاب بزر قطونا وعصارة البقلة الحمقاء، ويتناولون قبل السير سويق الشعير أو شراب الفواكه {cite:canon-ibn-sina-print-v1 pp.262}."
  en: "Ibn Sina gives a chapter to guarding against heat on a journey: if travellers do not order themselves, they weaken, their powers dissolve, thirst overcomes them and the sun harms their brains; so they take care to cover the head, protect the chest with a coating of psyllium mucilage and purslane juice, and take barley meal or fruit drink before setting out {cite:canon-ibn-sina-print-v1 pp.262}."
