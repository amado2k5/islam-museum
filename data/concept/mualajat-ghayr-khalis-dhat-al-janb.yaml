"label":
  "ar": "معالجات غير خالص ذات الجنب"
  "en": "The treatments of the non-true pleurisy kinds"
  "ur": "غیر خالص ذات الجنب کے علاج"
"summary":
  "ar": "هذا هو قولنا إن كانت ذات الجنب حارة خالصة وأما إن لم تكن كذلك بل كانت غير\
    \ خالصة غير شديدة الحرارة فعليك بالدلك والضماد بمثل ما يجري مجرى هذا الجنس والمحاجم،\
    \ والبلغمي يبدأ في علاجه بالحقن الحارة والإسهال ولا يفصد وتستعمل المحللات من الأضمدة\
    \ والكمادات المذكورة التي فيها قوة ويطعم من أغذية هذا الجنس ويسقي مطبوخاً من هذا\
    \ الجنس على وصف من نسب إليه، وأما السوداوي فيغذي بالأحساء المتخذة من الحنطة المهروسة\
    \ مع العسل وبدهن من هذا الجنس وباللعوقات اللينة الحارة ويتجرع الأدهان الملينة\
    \ من هذا الجنس وبالأحساء اللينة المتخذة من هذا الجنس وقليل حلبة، وأما الماء المجتمع\
    \ في الرئة فعلاجه أخف ما نذكره من علاج المتقيحين وربما احتيج إلى بط وفيه خطر {cite:canon-ibn-sina-print-v2\
    \ p.363}"
  "en": "This is our saying where the pleurisy is purely hot. If it is not so — not\
    \ purely hot, nor of intense heat — then upon you are the rubbing and the poultice\
    \ with the like of this kind, and the cupping glasses. The phlegmatic one begins\
    \ his treatment with hot clysters and purging, and is not bled; the resolvents\
    \ among the said poultices and compresses that carry strength are used, and he\
    \ is fed from foods of this kind and given a decoction of this kind on the description\
    \ of him to whom it is ascribed. As for the melancholic one, he is fed the gruels\
    \ made of crushed wheat with honey and an oil of this kind and the soft hot lohochs,\
    \ and he swallows the loosening oils of this kind and the soft gruels made of\
    \ this kind with a little fenugreek. As for the water gathered in the lung, its\
    \ treatment is the lightest of what we shall state for the suppurated, and incision\
    \ may be needed — and there is danger in it {cite:canon-ibn-sina-print-v2 p.363}"
  "ur": "یہ ہماری بات ہے جب ذات الجنب خالص گرم ہو اور اگر ایسی نہ ہو بلکہ غیر خالص\
    \ اور زیادہ گرم نہ ہو تو تم پر اسی جنس کے ہم جنس کی چیز سے مالش اور ضماد اور پچھنے\
    \ ہیں اور بلغمی کے علاج کا آغاز گرم حقنوں اور دست سے ہے اور اس کا فصد نہیں ہوتا\
    \ اور مذکورہ ضمادوں اور کمادوں میں سے محلل جو قوت رکھتے ہیں استعمال ہوتے ہیں اور\
    \ اسے اسی جنس کی غذائیں کھلائی جاتی ہیں اور جس کی طرف منسوب ہے اس کے وصف پر اسی\
    \ جنس کا جوشاندہ پلایا جاتا ہے اور سوداوی کو کٹی گندم کی احساء شہد اور اسی جنس\
    \ کے تیل کے ساتھ کھلائی جاتی ہیں اور نرم گرم لعوقات اور وہ نرم کرنے والے تیل اسی\
    \ جنس کے نوش کرتا ہے اور اسی جنس کی نرم احساء تھوڑی میتھی کے ساتھ اور پھیپھڑے\
    \ میں جمع پانی کا علاج متقيحوں کے لیے جو ہم کہیں گے اس میں ہلکا ترین ہے اور کبھی\
    \ چیرنے کی ضرورت پڑتی ہے اور اس میں خطرہ ہے {cite:canon-ibn-sina-print-v2 p.363}"
