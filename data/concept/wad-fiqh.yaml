label:
  ar: "وَعْد"
  en: "Wa'd (promise, fiqh)"
summary:
  ar: "الوعد في اللغة يُستعمل في الخير والشر، والعِدة الوعد. وفي الاصطلاح الإخبار بإيصال الخير في المستقبل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17543}\n\nالألفاظ ذات الصلة: العهد، وهو الوعد المقرون بشرط، ويقتضي الوفاء، أما الوعد فيقتضي الإنجاز؛ والوأي، وهو الوعد الموثَّق الذي يعزم الواعد على الوفاء به، وقال أبو هلال العسكري إن الوعد يكون مؤقتاً وغير مؤقت، والوأي غير مؤقت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17543}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17544}\n\nالوفاء بالوعد: إن كان الوعد بشيء منهيّ عنه فلا يجوز إنجازه بل يجب إخلافه؛ وإن كان بشيء واجب وجب إنجازه؛ وإن كان بمباح أو مندوب فينبغي إنجازه، لأن الوفاء من مكارم الأخلاق، ومدح الكتاب إسماعيل بأنه كان صادق الوعد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17544}\n\nاختلف الفقهاء في حكم الوفاء بالوعد المباح على سبعة أقوال: {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17544}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17545} الأول: أن إنجاز الوعد واجب، وإليه ذهب عمر بن عبد العزيز وابن شبرمة، ووجه في مذهب أحمد اختاره ابن تيمية، وقول في المالكية؛ واستدلوا بقوله تعالى في سورة الصف، وبحديث «آية المنافق ثلاث». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17545} الثاني: أن إنجاز الوعد واجب إلا لعذر، وهو رأي ابن العربي، واستدل بحديث زيد بن أرقم في أن من وعد ونوى أن يفي فلم يفِ فلا جناح عليه؛ وقد ضعّفه الترمذي لأن فيه راويين مجهولين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17545} الثالث: يجب الوفاء ديانةً لا قضاءً، وهو رأي تقي الدين السبكي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17546} الرابع: أن الوفاء مستحب، فلو تركه فاته الفضل وارتكب مكروهاً كراهة تنزيه شديدة ولم يأثم، وهو رأي جمهور المالكية والشافعية والحنابلة، وقال النووي إن الوفاء مستحب استحباباً متأكداً وتُكره شديداً إخلافه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17546} وقال ابن مفلح لا يلزم الوفاء بالوعد نصّ عليه أحمد، وقاله أكثر العلماء لأنه في معنى الهبة قبل القبض؛ والجصاص يرى الأولى الوفاء مع الإمكان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17546} الخامس: أن إنجاز الوعد المجرد غير واجب، أما الوعد المعلّق على شرط فلازم، وهو مذهب الحنفية، ونقل ابن نجيم عن القنية أن الوعد لا يلزم إلا إذا كان معلقاً، ونصت المادة 84 من مجلة الأحكام العدلية على أن المواعيد بصور التعاليق تكون لازمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17546}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17547} ومثّل الكتاب بأن من قال: ادفع ديني من مالك فوعده ثم امتنع لا يلزمه، ومن قال: بع لفلان وإن لم يعطك ثمنه فأنا أعطيه، فيلزمه أداء الثمن، لأن التعليق يكسب الوعد قوة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17546}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17547} والنافون لوجوب الوفاء حملوا الذم في آية الصف على من وعد وهو يضمر الإخلاف، وحملوا حديث آية المنافق على من عزم على الإخلاف حال الوعد لا من طرأ له عذر، وقال الغزالي ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17547}"
  en: "Wa'd, lexically, is used for good and for evil; 'idda is the promise. Technically it is the statement that a good thing will reach someone in the future. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17543}\n\nRelated words: 'ahd, a promise tied to a condition, which calls for fulfilment, while wa'd calls for carrying it out; wa'y, a promise firmly bound by the one who promises, which Abu Hilal al-Askari says is not limited to a time, while the promise may be. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17543}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17544}\n\nFulfilling a promise: a promise of a forbidden thing must not be fulfilled and must be broken; a promise of an obligatory thing must be fulfilled; a promise of a permitted or recommended thing ought to be fulfilled, since fulfilment is part of good conduct, and the book cites the praise of Isma'il in sura Maryam for keeping his promise. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17544}\n\nOn the fulfilment of a promise of a permitted act, there are seven views. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17544}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17545} The first: fulfilment is obligatory, held by Umar ibn Abd al-Aziz, Ibn Shubruma, a Hanbali view chosen by Ibn Taymiyya and a Maliki view, citing sura al-Saff (cited by sura only) and the hadith that the sign of the hypocrite is three, including breaking a promise. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17545} The second: obligatory unless there is an excuse, the view of Ibn al-'Arabi, who relies on the report of Zayd ibn Arqam that one who promises meaning to keep it and does not is not sinful; al-Tirmidhi weakens that report because two of its transmitters are unknown. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17545} The third: obligatory before God but not in court, the view of Taqi al-Din al-Subki. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17546} The fourth: recommended; omitting it loses the merit and is a strongly disliked act, but not a sin. This is the view of most Malikis, Shafi'is and Hanbalis; al-Nawawi calls fulfilment strongly recommended and breaking it strongly disliked. Ibn Muflih says it is not obligatory, since a promise is like a gift before possession; al-Jassas says it is better to fulfil it when possible. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17546} The fifth: a bare promise is not obligatory, but a conditional one is binding; this is the Hanafi view, and the Majalla of Ottoman law, article 84, states that promises in the form of conditions are binding. The book gives the example: a man who says pay my debt from your money, and is not held if he does not; a man who says sell this to so-and-so and if he does not pay I will, is held to pay, since the condition gives the promise force. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17546}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17547} Those who deny the duty read the blame in sura al-Saff as directed at one who promises while intending to break it, and read the hadith on the hypocrite as directed at one who intends to break the promise at the time of promising, not one who is prevented by something later; al-Ghazali says this. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17547}"
