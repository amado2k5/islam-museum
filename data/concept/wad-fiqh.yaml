id: concept/wad-fiqh
class: concept
kind: legal
label:
  ar: "وَعْد"
  en: "Wa'd (promise, fiqh)"
  es: "Wa'd (promesa, fiqh)"
  fr: "Wa'd (promesse, fiqh)"
  ur: "وَد ⁦(وعدہ، فقہ)⁩"
  tr: "Söz"
  id: "Janji"
summary:
  ar: "الوعد في اللغة يُستعمل في الخير والشر، والعِدة الوعد. وفي الاصطلاح الإخبار بإيصال الخير في المستقبل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17543}\n\nالألفاظ ذات الصلة: العهد، وهو الوعد المقرون بشرط، ويقتضي الوفاء، أما الوعد فيقتضي الإنجاز؛ والوأي، وهو الوعد الموثَّق الذي يعزم الواعد على الوفاء به، وقال أبو هلال العسكري إن الوعد يكون مؤقتاً وغير مؤقت، والوأي غير مؤقت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17543}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17544}\n\nالوفاء بالوعد: إن كان الوعد بشيء منهيّ عنه فلا يجوز إنجازه بل يجب إخلافه؛ وإن كان بشيء واجب وجب إنجازه؛ وإن كان بمباح أو مندوب فينبغي إنجازه، لأن الوفاء من مكارم الأخلاق، ومدح الكتاب إسماعيل بأنه كان صادق الوعد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17544}\n\nاختلف الفقهاء في حكم الوفاء بالوعد المباح على سبعة أقوال: {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17544}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17545} الأول: أن إنجاز الوعد واجب، وإليه ذهب عمر بن عبد العزيز وابن شبرمة، ووجه في مذهب أحمد اختاره ابن تيمية، وقول في المالكية؛ واستدلوا بقوله تعالى في سورة الصف، وبحديث «آية المنافق ثلاث». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17545} الثاني: أن إنجاز الوعد واجب إلا لعذر، وهو رأي ابن العربي، واستدل بحديث زيد بن أرقم في أن من وعد ونوى أن يفي فلم يفِ فلا جناح عليه؛ وقد ضعّفه الترمذي لأن فيه راويين مجهولين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17545} الثالث: يجب الوفاء ديانةً لا قضاءً، وهو رأي تقي الدين السبكي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17546} الرابع: أن الوفاء مستحب، فلو تركه فاته الفضل وارتكب مكروهاً كراهة تنزيه شديدة ولم يأثم، وهو رأي جمهور المالكية والشافعية والحنابلة، وقال النووي إن الوفاء مستحب استحباباً متأكداً وتُكره شديداً إخلافه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17546} وقال ابن مفلح لا يلزم الوفاء بالوعد نصّ عليه أحمد، وقاله أكثر العلماء لأنه في معنى الهبة قبل القبض؛ والجصاص يرى الأولى الوفاء مع الإمكان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17546} الخامس: أن إنجاز الوعد المجرد غير واجب، أما الوعد المعلّق على شرط فلازم، وهو مذهب الحنفية، ونقل ابن نجيم عن القنية أن الوعد لا يلزم إلا إذا كان معلقاً، ونصت المادة 84 من مجلة الأحكام العدلية على أن المواعيد بصور التعاليق تكون لازمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17546}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17547} ومثّل الكتاب بأن من قال: ادفع ديني من مالك فوعده ثم امتنع لا يلزمه، ومن قال: بع لفلان وإن لم يعطك ثمنه فأنا أعطيه، فيلزمه أداء الثمن، لأن التعليق يكسب الوعد قوة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17546}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17547} والنافون لوجوب الوفاء حملوا الذم في آية الصف على من وعد وهو يضمر الإخلاف، وحملوا حديث آية المنافق على من عزم على الإخلاف حال الوعد لا من طرأ له عذر، وقال الغزالي ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17547}\n\nالقول السادس: إن كان الوعد مرتبطاً بسبب فدخل الموعود فيه وجب الوفاء به كما يجب الوفاء بالعقد، وإن لم يباشر الموعود السبب فلا شيء على الواعد، كمن وعد بسلف ثمن دار فاشتراها الموعود، أو بسلف مهر فتزوج اعتماداً على الوعد؛ وهذا القول المشهور في مذهب مالك، وعزاه القرافي إلى مالك وابن القاسم وسحنون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17548}\n\nالقول السابع: إن كان الوعد مرتبطاً بسبب وجب الوفاء به قضاءً، دخل الموعود في السبب أو لم يدخل، وإن لم يكن مرتبطاً بسبب فلا يجب الوفاء به؛ وفي ذلك قول أصبغ الذي حكاه الباجي: إن كانت العدة مفسرة كأن يقول أعيرك دابتي إلى موضع كذا فيقول أعيرك غداً يُحكم بإنجازها، وإن كانت مبهمة كأن يقول أسلفني مائة ولا يذكر حاجته فلا يُحكم بها؛ والمالكية في ظاهر المذهب على خلاف هذا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17548}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17549}\n\nالاستثناء في الوعد: نص أكثر الفقهاء على أن ينبغي للواعد أن يستثني بقوله «إن شاء الله» لقوله تعالى في سورة الكهف، ولأن الواعد لا يدري هل يقع منه الوفاء؛ واختلفوا في حكمه: الغزالي يراه الأولى، والجصاص يرى ترك الاستثناء مكروهاً، والحنابلة يحرمون الوعد بغير استثناء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17549}\n\nالمواعدة: مفاعلة يعِد فيها كل واحد صاحبه، فإن وعد أحدهما دون الآخر فهذه عِدة. وعند المالكية أصل منع المواعدة على ما لا يصح وقوعه في الحال سداً للذريعة، كالمواعدة على النكاح في العدة، وعلى بيع الطعام قبل قبضه، وعلى البيع وقت نداء الجمعة، وعلى بيع ما ليس عندك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17549}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17550} وأما المواعدة على الصرف ففيها ثلاثة أقوال عند المالكية: الجواز، والمنع وهو المشهور، والكراهة؛ وفرّق الونشريسي بين المنع فيما يحرم إبرامه وبين الصرف الذي لا يُحرم إبرام عقده، وقال الشافعي إنه لا بأس أن يتواعد الرجلان على الصرف ثم يتبايعا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17550}"
  en: "Wa'd, lexically, is used for good and for evil; 'idda is the promise. Technically it is the statement that a good thing will reach someone in the future. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17543}\n\nRelated words: 'ahd, a promise tied to a condition, which calls for fulfilment, while wa'd calls for carrying it out; wa'y, a promise firmly bound by the one who promises, which Abu Hilal al-Askari says is not limited to a time, while the promise may be. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17543}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17544}\n\nFulfilling a promise: a promise of a forbidden thing must not be fulfilled and must be broken; a promise of an obligatory thing must be fulfilled; a promise of a permitted or recommended thing ought to be fulfilled, since fulfilment is part of good conduct, and the book cites the praise of Isma'il in sura Maryam for keeping his promise. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17544}\n\nOn the fulfilment of a promise of a permitted act, there are seven views. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17544}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17545} The first: fulfilment is obligatory, held by Umar ibn Abd al-Aziz, Ibn Shubruma, a Hanbali view chosen by Ibn Taymiyya and a Maliki view, citing sura al-Saff (cited by sura only) and the hadith that the sign of the hypocrite is three, including breaking a promise. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17545} The second: obligatory unless there is an excuse, the view of Ibn al-'Arabi, who relies on the report of Zayd ibn Arqam that one who promises meaning to keep it and does not is not sinful; al-Tirmidhi weakens that report because two of its transmitters are unknown. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17545} The third: obligatory before God but not in court, the view of Taqi al-Din al-Subki. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17546} The fourth: recommended; omitting it loses the merit and is a strongly disliked act, but not a sin. This is the view of most Malikis, Shafi'is and Hanbalis; al-Nawawi calls fulfilment strongly recommended and breaking it strongly disliked. Ibn Muflih says it is not obligatory, since a promise is like a gift before possession; al-Jassas says it is better to fulfil it when possible. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17546} The fifth: a bare promise is not obligatory, but a conditional one is binding; this is the Hanafi view, and the Majalla of Ottoman law, article 84, states that promises in the form of conditions are binding. The book gives the example: a man who says pay my debt from your money, and is not held if he does not; a man who says sell this to so-and-so and if he does not pay I will, is held to pay, since the condition gives the promise force. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17546}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17547} Those who deny the duty read the blame in sura al-Saff as directed at one who promises while intending to break it, and read the hadith on the hypocrite as directed at one who intends to break the promise at the time of promising, not one who is prevented by something later; al-Ghazali says this. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17547}\n\nThe sixth view: a promise tied to a cause that the promisee has entered must be kept, as a contract must be; if the promisee has not begun the cause, the promiser owes nothing. An example: a man promises to lend the price of a house which the promisee then buys, or to lend a dower on which the promisee marries relying on the promise. This is the well-known and preferred Maliki view, which al-Qarafi attributes to Malik, Ibn al-Qasim and Sahnun. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17548}\n\nThe seventh view: a promise tied to a cause must be kept by judgement, whether or not the promisee has entered the cause; a promise not tied to a cause need not be kept. Asbagh, as al-Baji reports, distinguishes: if the promise is explicit, as when one says 'I will lend you my mount to a place' and the other says 'I will lend it tomorrow', he judges it binding; if it is vague, as when one asks for a loan of a hundred without giving a need, he does not. The ordinary Maliki view runs against this. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17548}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17549}\n\nPromising with a reservation: most jurists hold it is best to add 'if God wills', following the verse of sura al-Kahf, since the promiser does not know whether he will fulfil it. Al-Ghazali holds the reservation better; al-Jassas holds that a promise without it is disliked; the Hanbalis hold a promise without it forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17549}\n\nMutual promising (mu'ada): a promise made by both sides, where a promise made by one alone is an 'idda. The Malikis, on the principle of blocking means, forbid promises about what cannot be done at the moment: for example, promising marriage during the waiting period, promising to sell food before receiving it, promising a sale at the time of the Friday call, or selling what one does not possess. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17549}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17550} On promising currency exchange, the Malikis have three views: permitted, forbidden (the better-known view), and disliked. Al-Wansharisi explains the difference: the prohibition applies where the contract itself is forbidden, while the exchange contract is not forbidden in itself. Al-Shafi'i says two men may promise to exchange silver and later trade it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17550}"
  es: "Wa'd, léxicamente, se usa para el bien y para el mal; 'idda es la promesa. Técnicamente es la declaración de que algo bueno llegará a alguien en el futuro. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17543} Palabras relacionadas: 'ahd, una promesa ligada a una condición, que requiere cumplimiento, mientras que wa'd requiere llevarlo a cabo; wa'y, una promesa firmemente ligada por quien promete, que Abu Hilal al-Askari dice que no está limitada a un tiempo, mientras que la promesa sí puede estarlo. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17543}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17544} Cumplir una promesa: una promesa de algo prohibido no debe cumplirse y debe romperse; una promesa de algo obligatorio debe cumplirse; Una promesa de algo permitido o recomendado debe cumplirse, ya que el cumplimiento es parte de la buena conducta, y el libro cita el elogio de Isma'il en la sura Maryam por cumplir su promesa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17544} Sobre el cumplimiento de una promesa de un acto permitido, hay siete puntos de vista. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17544}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17545} El primero: el cumplimiento es obligatorio, sostenido por Umar ibn Abd al-Aziz, Ibn Shubruma, un punto de vista hanbalí elegido por Ibn Taymiyya y un punto de vista malikí, citando la sura al-Saff (citado solo por la sura) y el hadiz de que la señal del hipócrita es tres, incluyendo romper una promesa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17545} El segundo: obligatorio a menos que haya una excusa, la opinión de Ibn al-'Arabi, quien se basa en el informe de Zayd ibn Arqam de que quien promete con la intención de cumplirlo y no lo hace no es pecado; al-Tirmidhi debilita ese informe porque dos de sus transmisores son desconocidos. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17545} El tercero: obligatorio ante Dios pero no en la corte, la opinión de Taqi al-Din al-Subki. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17546} El cuarto: recomendado; omitirlo hace perder el mérito y es un acto muy desaconsejable, pero no un pecado. Esta es la opinión de la mayoría de los malikíes, shafi'ís y hanbalíes; Al-Nawawi considera que el cumplimiento es altamente recomendable y que romperlo es altamente desaconsejable. Ibn Muflih afirma que no es obligatorio, puesto que una promesa es como un regalo antes de la posesión; Al-Jassas sostiene que es mejor cumplirla cuando sea posible. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17546} El quinto punto: una promesa simple no es obligatoria, pero una condicional sí lo es; esta es la visión Hanafi, y el artículo 84 de la Majalla de Derecho Otomano establece que las promesas en forma de condiciones son vinculantes. El libro da el ejemplo: un hombre que dice paga mi deuda con tu dinero, y no está obligado si no lo hace; un hombre que dice vende esto a fulano y si no paga lo haré yo, está obligado a pagar, puesto que la condición otorga fuerza a la promesa. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17546}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17547} Quienes niegan el deber interpretan la culpa en la sura al-Saff como dirigida a quien promete con la intención de romperla, e interpretan el hadiz sobre el hipócrita como dirigido a quien pretende romper la promesa en el momento de prometerla, no a quien se ve impedido por algo posterior; al-Ghazali dice esto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17547} La sexta opinión: una promesa ligada a una causa en la que el beneficiario de la promesa ha entrado debe cumplirse, como debe ser un contrato; si el beneficiario de la promesa no ha comenzado la causa, el promitente no debe nada. Un ejemplo: un hombre promete prestar el precio de una casa que el beneficiario compra, o prestar una dote con la que el beneficiario se casa confiando en la promesa. Esta es la opinión malikí bien conocida y preferida, que al-Qarafi atribuye a Malik, Ibn al-Qasim y Sahnun. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17548} La séptima opinión: una promesa ligada a una causa debe cumplirse por juicio, independientemente de si el beneficiario ha entrado o no en la causa; una promesa no ligada a una causa no necesita cumplirse. Asbagh, como informa al-Baji, distingue: si la promesa es explícita, como cuando uno dice \"Te prestaré mi montura a un lugar\" y el otro dice \"Te la prestaré mañana\", la considera vinculante; si es vaga, como cuando uno pide un préstamo de cien sin dar una necesidad, no lo considera vinculante. La opinión malikí común se opone a esto. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17548}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17549} Promesa con reserva: la mayoría de los juristas sostienen que es mejor agregar 'si Dios quiere', después del versículo de la sura al-Kahf, ya que el que promete no sabe si lo cumplirá. Al-Ghazali sostiene que la reserva es mejor; al-Jassas sostiene que una promesa sin ella es desaconsejable; los hanbalíes sostienen que una promesa sin ella está prohibida. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17549} Promesa mutua (mu'ada): una promesa hecha por ambas partes, donde una promesa hecha por uno solo es un 'idda. Los malikíes, basándose en el principio de bloqueo de medios, prohíben las promesas sobre lo que no se puede hacer en el momento: por ejemplo, prometer matrimonio durante el período de espera, prometer vender alimentos antes de recibirlos, prometer una venta en el momento de la llamada del viernes o vender lo que uno no posee. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17549}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17550} Sobre la promesa de intercambio de divisas, los malikíes tienen tres posturas: permitida, prohibida (la más conocida) y desaconsejada. Al-Wansharisi explica la diferencia: la prohibición se aplica cuando el contrato en sí está prohibido, mientras que el contrato de intercambio no lo está en sí mismo. Al-Shafi'i afirma que dos hombres pueden prometer intercambiar plata y luego comerciar con ella. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17550}"
  fr: "Le terme « wa'd » est employé, au sens littéral, pour le bien comme pour le mal; « 'idda » désigne la promesse. Techniquement, il s'agit de l'affirmation qu'une bonne chose parviendra à quelqu'un dans le futur. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17543} Mots apparentés: « 'ahd », une promesse assortie d'une condition, qui exige son accomplissement, tandis que « wa'd » exige sa réalisation; « wa'y », une promesse fermement engagée par celui qui promet, qui, selon Abu Hilal al-Askari, n'est pas limitée dans le temps, contrairement à la promesse elle-même. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17543}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17544} Respect d'une promesse: une promesse portant sur une chose interdite ne doit pas être tenue et doit être rompue; une promesse portant sur une chose obligatoire doit être tenue. Il convient de tenir la promesse d'une chose permise ou recommandée, car cela relève de la bonne conduite. Le livre cite d'ailleurs l'éloge d'Ismaïl dans la sourate Maryam pour avoir respecté sa promesse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17544} Concernant l'accomplissement d'une promesse relative à un acte permis, sept avis existent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17544}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17545} Le premier avis, défendu par Umar ibn Abd al-Aziz, Ibn Shubruma, une opinion hanbalite reprise par Ibn Taymiyya et une opinion malikite, considère l'accomplissement comme obligatoire. Cette opinion s'appuie sur la sourate al-Saff (citée par la seule sourate) et sur le hadith selon lequel le signe de l'hypocrite est au nombre de trois, dont le non-respect d'une promesse. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17545} La deuxième: obligatoire sauf excuse, selon l’avis d’Ibn al-'Arabi, qui s’appuie sur le hadith de Zayd ibn Arqam selon lequel celui qui promet en ayant l’intention de tenir sa promesse et ne le fait pas ne commet pas de péché; al-Tirmidhi nuance ce hadith car deux de ses transmetteurs sont inconnus. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17545} La troisième: obligatoire devant Dieu mais non devant les tribunaux, selon l’avis de Taqi al-Din al-Subki. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17546} La quatrième: recommandée; l’omettre en fait perdre le mérite et est fortement déconseillé, mais ne constitue pas un péché. C’est l’avis de la plupart des écoles malikite, chaféite et hanbalite. Al-Nawawi recommande fortement de tenir sa promesse et déconseille fortement de la rompre. Ibn Muflih affirme qu'elle n'est pas obligatoire, car une promesse est comparable à un don avant possession; al-Jassas, quant à lui, recommande de la tenir lorsque cela est possible. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17546} Cinquièmement, une promesse sans condition n'est pas obligatoire, mais une promesse conditionnelle l'est; c'est l'avis de l'école hanafite, et la Majalla de droit ottoman, article 84, stipule que les promesses assorties de conditions sont contraignantes. L'ouvrage donne l'exemple suivant: un homme qui dit « payez ma dette avec votre argent » n'est pas tenu de payer s'il ne le fait pas; un homme qui dit « vendez ceci à untel et si celui-ci ne paie pas, je paierai », est tenu de payer, car la condition donne force de proposition. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17546}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17547} Ceux qui nient cette obligation interprètent le blâme de la sourate al-Saff comme s'adressant à celui qui promet avec l'intention de rompre sa promesse, et lisent le hadith sur l'hypocrite comme s'adressant à celui qui a l'intention de rompre sa promesse au moment de la faire, et non à celui qui en est empêché ultérieurement; c'est ce qu'affirme al-Ghazali. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17547} Sixième avis: une promesse liée à une cause dans laquelle le bénéficiaire s'est engagé doit être tenue, comme un contrat; si le bénéficiaire n'a pas entrepris la cause, le promettant n'est pas tenu. Par exemple, un homme promet de prêter le prix d'une maison que le bénéficiaire achète ensuite, ou de fournir une dot sur laquelle le bénéficiaire se marie en se fiant à la promesse. C'est l'avis malikite le plus connu et le plus répandu, qu'al-Qarafi attribue à Malik, Ibn al-Qasim et Sahnun. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17548} Le septième avis stipule qu'une promesse liée à une cause doit être tenue, que le bénéficiaire ait ou non participé à cette cause; une promesse non liée à une cause n'a pas à être tenue. Asbagh, comme le rapporte al-Baji, établit une distinction: si la promesse est explicite, comme lorsque l'un dit « Je te prêterai ma monture pour un endroit » et l'autre « Je te la prêterai demain », il la juge contraignante; si elle est vague, comme lorsqu'on demande un prêt de cent sans préciser le besoin, elle ne l'est pas. L'avis malikite courant s'y oppose. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17548}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17549} Promesse assortie d'une réserve: la plupart des juristes estiment qu'il est préférable d'ajouter « si Dieu le veut », conformément au verset de la sourate Al-Kahf, puisque celui qui promet ne sait pas s'il tiendra sa promesse. Al-Ghazali est favorable à cette réserve; Al-Jassas considère qu'une promesse sans réserve est déconseillée; les Hanbalites, quant à eux, l'interdisent. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17549} Promesse mutuelle (mu'ada): promesse faite par les deux parties, tandis qu'une promesse faite par une seule personne est une 'idda. Les Malikites, se fondant sur le principe de l'impossibilité d'accomplir ce qui est impossible à l'instant présent, interdisent les promesses concernant l'impossibilité de se réaliser immédiatement: par exemple, promettre un mariage pendant la période d'attente, promettre de vendre de la nourriture avant de l'avoir reçue, promettre une vente au moment de l'appel du vendredi, ou vendre ce que l'on ne possède pas. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17549}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17550} Concernant les promesses d'échange de devises, les Malikites ont trois avis: permis, interdit (l'avis le plus répandu) et déconseillé. Al-Wansharisi explique la différence: l'interdiction s'applique lorsque le contrat lui-même est interdit, alors que le contrat d'échange n'est pas interdit en soi. Al-Shafi'i indique que deux hommes peuvent promettre d'échanger de l'argent et le vendre ultérieurement. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17550}"
  ur: "وَد، لغوی طور پر، اچھائی اور برائی کے لیے استعمال ہوتا ہے۔ عدّہ وعدہ ہے۔ تکنیکی طور پر یہ بیان ہے کہ مستقبل میں کوئی اچھی چیز کسی تک پہنچے گی۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17543} متعلقہ الفاظ: 'احد، ایک شرط سے بندھا ہوا وعدہ، جو پورا کرنے کا مطالبہ کرتا ہے، جبکہ وَعد اسے پورا کرنے کا مطالبہ کرتا ہے۔ wa'y، وعدہ کرنے والے کی طرف سے مضبوطی سے پابند وعدہ، جسے ابو ہلال عسکری کہتے ہیں کہ ایک وقت تک محدود نہیں ہے، جبکہ وعدہ ہوسکتا ہے. {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17543}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17544} وعدہ پورا کرنا: حرام چیز کا وعدہ پورا نہیں ہونا چاہیے اور اسے توڑنا چاہیے۔ واجب چیز کا وعدہ پورا کرنا ضروری ہے۔ جائز یا مستحب چیز کا وعدہ پورا ہونا چاہیے، کیونکہ پورا کرنا حسن سلوک کا حصہ ہے، اور کتاب نے اپنے وعدے کو نبھانے کے لیے سورہ مریم میں اسماعیل کی تعریف کی ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17544} جائز عمل کے وعدے کی تکمیل پر سات آراء ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17544}{cite:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17545} پہلا: تکمیل واجب ہے، جسے عمر بن عبدالعزیز، ابن شبرومہ، مالکیہ اور تابعین کا مسلک منتخب کرتے ہیں۔ سورۃ الصف کا حوالہ دیتے ہوئے ⁦(صرف سورہ سے نقل کیا گیا ہے)⁩ اور حدیث ہے کہ منافق کی نشانی تین ہیں جن میں وعدہ خلافی بھی شامل ہے۔ دوسرا: واجب جب تک عذر نہ ہو، ابن العربی کا قول ہے، جو زید بن ارقم کی روایت پر اعتبار کرتے ہیں کہ جس نے وعدہ کیا اور نہ کیا وہ گناہ گار نہیں ہے۔ الترمذی اس رپورٹ کو کمزور کرتا ہے کیونکہ اس کے دو ٹرانسمیٹر نامعلوم ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور-v3 صفحہ 17545} تیسرا: خدا کے سامنے واجب ہے لیکن عدالت میں نہیں، تقی الدین السبکی کا قول۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17546} چوتھا: مستحب؛ اس کو چھوڑنا فضیلت کو کھو دیتا ہے اور سخت ناپسندیدہ عمل ہے، لیکن گناہ نہیں۔ اکثر مالکیوں، شافعیوں اور حنبلیوں کا یہی قول ہے۔ النووی نے تکمیل کو سختی سے مستحب اور توڑنے کو سخت ناپسندیدہ کہا ہے۔ ابن مفلح کہتے ہیں کہ یہ واجب نہیں ہے کیونکہ وعدہ ملکیت سے پہلے تحفہ کی طرح ہے۔ الجصاس کا کہنا ہے کہ جب ممکن ہو اسے پورا کرنا بہتر ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17546} پانچواں: ننگا وعدہ واجب نہیں ہے، لیکن ایک مشروط پابند ہے۔ یہ حنفی کا نظریہ ہے، اور قانون عثمانیہ کا مجلہ، آرٹیکل 84 کہتا ہے کہ شرائط کی صورت میں وعدے لازم ہیں۔ کتاب مثال دیتی ہے: ایک آدمی جو کہتا ہے کہ اپنے پیسوں سے میرا قرض ادا کرو، اور اگر وہ نہیں کرتا ہے تو اسے روکا نہیں جاتا۔ ایک آدمی جو کہتا ہے کہ اسے فلاں کو بیچ دو اور اگر وہ ادا نہیں کرتا تو میں ادا کروں گا، اس کو ادا کرنے پر روکا جاتا ہے، کیونکہ شرط وعدہ کی طاقت دیتی ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17546}{cite:fiqh-mawsua-kuwaityya-noor-v3 p.17547} فرض سے انکار کرنے والے سورۃ الصف میں ملامت پڑھتے ہیں جیسا کہ وعدہ کرنے والے کی طرف اشارہ کیا گیا ہے جبکہ اس نے منافق پر پڑھا ہے اور اس نے اس کو توڑنے کا ارادہ کیا ہے۔ وعدہ کرتے وقت وعدہ خلافی کرنا، نہ کہ جو بعد میں کسی چیز سے روکا جائے۔ الغزالی یہ کہتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17547} چھٹا قول: ایک وعدہ جو کسی وجہ سے منسلک ہو جو وعدہ کرنے والے نے کیا ہو، جیسا کہ معاہدہ ہونا ضروری ہے۔ اگر وعدہ کرنے والے نے وجہ شروع نہیں کی ہے، تو وعدہ کرنے والے پر کچھ واجب نہیں ہے۔ ایک مثال: ایک آدمی وعدہ کرتا ہے کہ وہ مکان کی قیمت ادھار دے گا جسے وعدہ کرنے والا پھر خریدتا ہے، یا مہر دینے کا وعدہ کرتا ہے جس پر وعدہ کرنے والا وعدہ پر بھروسہ کرتے ہوئے شادی کرتا ہے۔ یہ مالکی کا معروف اور پسندیدہ قول ہے جسے القرافی نے مالک، ابن القاسم اور سہنون کی طرف منسوب کیا ہے۔ {حوالہ: فقہ الموسوعۃ النور-v3 صفحہ 17548} ساتواں قول: کسی وجہ سے جڑے ہوئے وعدے کو فیصلہ کے ذریعے پورا کرنا چاہیے، خواہ وعدہ کرنے والے نے وجہ داخل کی ہو یا نہ ہو۔ ایک وعدہ جو کسی وجہ سے منسلک نہیں ہے اسے برقرار رکھنے کی ضرورت نہیں ہے۔ اصبغ، جیسا کہ الباجی نے بیان کیا ہے، فرق کرتا ہے: اگر وعدہ واضح ہو، جیسا کہ جب ایک کہتا ہے کہ 'میں تمہیں اپنی سواری ایک جگہ ادھار دوں گا' اور دوسرا کہے 'میں اسے کل قرض دوں گا'، تو وہ اسے پابند قرار دیتا ہے۔ اگر یہ مبہم ہو، جیسا کہ جب کوئی ضرورت کے بغیر سو کا قرض مانگتا ہے تو وہ نہیں دیتا۔ عام مالکی نظریہ اس کے خلاف ہے۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17548}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17549} ریزرویشن کے ساتھ وعدہ کرنا: اکثر فقہاء سورہ الکہ کی آیت کی پیروی کرتے ہوئے 'اگر اللہ نے چاہا' کا اضافہ کرنا بہتر سمجھا ہے، اس لیے کہ وہ وعدہ پورا کرے گا یا نہیں۔ الغزالی نے ریزرویشن کو بہتر رکھا ہے۔ الجصاص کا خیال ہے کہ اس کے بغیر کوئی وعدہ ناپسندیدہ ہے۔ حنبلی اس کی ممانعت کے بغیر وعدہ کرتے ہیں۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17549} باہمی وعدہ ⁦(معادہ)⁩: دونوں فریقوں کی طرف سے کیا گیا وعدہ، جہاں اکیلے سے کیا گیا وعدہ عدت ہے۔ مالکیہ، مسدودیت کے اصول پر، ایسے وعدوں سے منع کرتے ہیں جو اس وقت نہیں کیے جا سکتے: مثلاً عدت کے دوران نکاح کا وعدہ کرنا، کھانے کو ملنے سے پہلے فروخت کرنے کا وعدہ کرنا، جمعہ کی اذان کے وقت فروخت کا وعدہ کرنا، یا جو چیز کسی کے پاس نہیں ہے اسے بیچنا۔ {حوالہ:فقہ-موسوع-کویتیہ-نور-v3 صفحہ 17549}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17550} کرنسی کے تبادلے کے بارے میں مالکیوں کے تین نظریات ہیں: جائز، حرام ⁦(بہتر معروف قول)⁩، اور ناپسندیدگی۔ الونشرسی اس فرق کی وضاحت کرتے ہیں: ممانعت کا اطلاق ہوتا ہے جہاں معاہدہ خود ممنوع ہے، جب کہ تبادلے کا معاہدہ اپنے آپ میں حرام نہیں ہے۔ الشافعی کہتے ہیں کہ دو آدمی چاندی کے تبادلے اور بعد میں اس کی تجارت کا وعدہ کر سکتے ہیں۔ {حوالہ: فقہ الموسوعۃ کویتیہ نور v3 صفحہ 17550}"
  tr: "Dilde 'söz' iyi ve kötü anlamında, 'iddah' ise vaat anlamına gelir. Teknik terminolojide, gelecekte iyilik teslim edileceği hakkında bilgilendirme anlamına gelir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17543} İlgili terimler: 'Ahd' (antlaşma), bir şartla birlikte verilen ve yerine getirilmesini gerektiren bir sözdür; 'waad' (söz) ise yerine getirmeyi gerektirir; 'wa', kişinin yerine getirmeyi amaçladığı belgelenmiş bir sözdür. Abu Hilal al-Askari, bir sözün geçici ve geçici olmadığını, 'wa''nın ise geçici olmadığını söylemiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17543} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17544} Bir sözü yerine getirmek: Bir söz yasak bir şeyse, yerine getirilmesi caiz değildir ama yerine getirilmesi gerekir; zorunluysa yerine getirilmelidir; ve eğer caiz veya tavsiye edilirse, yerine getirilmelidir, çünkü yerine getirmek yüce ahlaktır. Kur'an, İsmail'i sözlerinde dürüst olduğu için övmüştür. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.175444} Hukukçular, izin verilen bir vaadin yerine getirilmesine ilişkin yedi görüşe göre verilen hükmette farklı görüşler sergiler: {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17544}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17545} İlki: Sözü yerine getirmenin zorunlu olduğu, ki bu Ömer bin Abdülaziz ve İbn Şubrumah'ın görüşü, İbn Teymiye tarafından seçilen Ahmed okulunda ve Malikilerde bir görüş vardır; Allah'ın Es-Saf Suresi ve hadis 'Münayık ayeti üç'tür.' {atı:fiqh-mawsua-kuwaitiyya-noor-v3 s.17545} İkinci: Bir sözü yerine getirmek, bahane dışında zorunludur; bu da İbn al-Arabi'nin görüşüdür. Zaýd bin Arqam'ın hadisini, kim söz verip yerine getirmeyi niyetli olup yerine getirmezse ona suç yoktur; el-Tirmidi ise bilinmeyen rivayetçiler olduğu için bunu zayıflatmıştır. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17545} Üçüncüsü: Gerçekleşme, bir yargı olarak değil, din olarak yapılmalıdır; bu, Taqi al-Din al-Subki'nin görüşüdür. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17546} Dördüncü: Yerine getirmek tavsiye edilir. Eğer ihmal ederse, lütfu kaçırır, sevmediği ve ağır bir hoşnutsuzluk eylemi yapar, günah işlemez. Bu, Maliki, Şafii ve Hanbalilerin çoğunluğunun görüşüdür. Al-Nawawi, gerçekleşmenin kesin olarak tavsiye edildiğini ve onu bozmaktan kesinlikle hoşlanmadığını söylemiştir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17546} İbn Muflih, Ahmad'ın belirttiği gibi, bir sözü yerine getirmenin zorunlu olmadığını ve çoğu âlimin bunu, alınmadan önceki hediyeye atıfta bulunduğu için söylemiştir; ve Al-Jassas, mümkünse gerçekleşmenin en uygun yol olduğunu düşünür. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17546} Beşinci: Sadece bir sözü yerine getirmek zorunlu değildir, oysa koşullu bir söz ayrılmazdır, bu da Hanefi okuludur. İbn Najim, El-Kunniye'den alıntı yapmıştır: Bir söz ancak askıya alındığında bağlayıcı olur. Majalla el-Ahkam el-Adliyya'nın 84. maddesi, askıya alma şeklindeki atamaların bağlayıcı olduğunu belirtir. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17546} {Cite:Fiqh-Mawsua-Kuwaitiyya-Noor-V3 s. 17547} Kur'an, şöyle derse ki: Sahibinden borcumu öde, söz verip sonra reddederse, ona bağlı değildir; ve kim derse: Şu kişiye sat, eğer sana bedelini vermezse, ben veririm, bedelini ödemekle yükümlüdür, çünkü askıya alma söze güç verir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17546} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17547} Yerine getirme yükümlülüğünü reddedenler, sözü gizleyen ve sözü gizleyen kişiyi suçladılar ve münafık ayetinin hadisini, sözü verdiği anda bozmaya karar verene atfettiler, mazereti olan kişiye değil. El-Gazali bunu söyledi. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17547} Altıncı görüş: Eğer söz bir sebeple bağlantılıysa ve vaat edilen kişi ona giriyorsa, sözleşme gibi yerine getirilmelidir. Söz verilen taraf sebebini yerine getirmezse, söz verenin üzerinde hiçbir şey yoktur; örneğin bir evin fiyatını önceden vermeyi vaat eden ve vaat edilen kişi onu satın almış ya da vaat edilen bir çeyiz verip evlenmiştir; bu, Malik'in okulunda bilinen görüştür ve El-Karafi bunu Malik, İbn el-Qasim ve Sahnun'a atfeder. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17548} Yedinci görüş: Eğer söz bir sebeple bağlantılıysa, vaat edilen kişi davaya düşse de düşmese de bir kararla yerine getirilmelidir; eğer bir sebeple bağlantılı değilse, yerine getirme gerekmez. Bu, Al-Baji'nin anlattığı Asbagh sözünü de kapsar: Bekleme süresi, örneğin 'Sana şu ya da şu ana bineğimi ödünç veririm' derse ve o 'Yarın sana ödünç veririm' derse, yerine getirilmesini o belirler; ama eğer belirsizse, mesela 'Sana yüz ödünç verdim ama ihtiyacını belirtmez' dediği gibi, buna karar vermez; Maliki görüşü ise görünürde buna karşıdır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17548} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17549} Sözde istisna: Çoğu hukukçu, söz veren kişinin Allah'ın Kahf Suresi'nde dediği gibi \"İnşallah\" diyerek istisna yapması gerektiğini belirtmiştir. Söz veren kişinin yerine gelip gelmeyeceğini bilmediği için hüküm konusunda farklı düşünmüşlerdir: El-Gazali bunu tercih eder, El-Casas istisnayı terk etmeyi sevmez ve Hanbaliler sözü istisnasız yasaklar. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17549} Söz: her kişinin yoldaşını saydığı bir eylem; biri diğerine söz verirse, bu bir 'idde'dir (bekleme süresi). Malikilere göre, flörtün yasaklanmasının temeli, bekleme süresi boyunca evlilikle ilgili yeminler, yemeği almadan önce satmak, cuma günü aranan zamanda satmak ve sahip olmadıklarını satmak gibi bahaneyi hemen engellemektir. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.17549} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.17550} Çekim (çekim) anlaşması konusunda Malikilere göre üç görüş vardır: caiz, yaygın görüş olan yasaklama ve hoşlanmama. El-Wansharisi, sözleşme yapmanın yasak olduğu durumlarda yasaklama ile yasak olmayan bir sözleşmeyi öne sürme arasında ayrım yaptı. El-Şafii, iki adamın çekimde anlaşıp sonra yemin etmesinin zarar görmediğini söyledi. {Cite:Fiqh-Mawsua-Kuwaitiyya-Noor-v3 s.17550}"
  id: "Dalam bahasa, 'janji' digunakan untuk kebaikan dan kejahatan, dan 'iddah' berarti janji. Dalam terminologi teknis, berarti memberi informasi tentang pemberitahuan kebaikan di masa depan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17543} Istilah terkait: 'Ahd' (perjanjian), yang merupakan janji yang disertai dengan suatu syarat dan memerlukan pemenuhan; sedangkan untuk 'waad' (janji), ia membutuhkan pemenuhan; 'wa', yang merupakan janji terdokumentasi yang ingin dipenuhi oleh orang tersebut. Abu Hilal al-Askari mengatakan bahwa janji bersifat sementara dan bukan sementara, dan 'wa'' bukanlah sementara. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17543} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17544} Menepati janji: Jika janji adalah sesuatu yang dilarang, maka tidak boleh dipenuhi tetapi harus diganti; jika wajib, harus dipenuhi; dan jika diperbolehkan atau direkomendasikan, harus dipenuhi, karena memenuhi adalah salah satu moral mulia. Al-Qur'an memuji Ismail karena jujur dalam janjinya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.175444} Para ahli hukum berbeda pendapat mengenai putusan pemenuhan janji yang diperbolehkan menurut tujuh pendapat: {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17544}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17545} Yang pertama: bahwa memenuhi janji adalah kewajiban, yang merupakan pandangan Umar ibn Abd al-Aziz dan Ibn Shubrumah, pandangan dalam mazhab Ahmad yang dipilih oleh Ibn Taymiyyah, dan pandangan dalam Maliki; mereka mengutip firman Allah dalam Surah As-Saff dan hadis 'Ayat munafik adalah tiga.' {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17545} Kedua: Menepati janji adalah wajib kecuali untuk alasan, yang merupakan pandangan Ibn al-Arabi. Ia mengutip hadits Zayd ibn Arqam sebagai bukti bahwa siapa pun yang berjanji dan berniat menepatinya tetapi tidak menepatinya, tidak ada kesalahan padanya; al-Tirmidhi melemahkannya karena ada narator yang tidak diketahui. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17545} Ketiga: Pemenuhan harus dilakukan sebagai agama, bukan sebagai penilaian, yang merupakan pandangan Taqi al-Din al-Subki. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17546} Keempat: Memenuhi adalah rekomendasi. Jika ia mengabaikannya, ia akan kehilangan kebaikan dan melakukan tindakan yang tidak disukai berupa ketidaksukaan yang berat dan tidak berbuat dosa. Ini adalah pandangan mayoritas Maliki, Shafi'i, dan Hanbali. Al-Nawawi mengatakan bahwa pemenuhan direkomendasikan dengan pasti dan sangat tidak suka melanggarnya. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17546} Ibn Muflih berkata bahwa memenuhi janji bukanlah kewajiban, seperti yang dinyatakan oleh Ahmad, dan sebagian besar ulama mengatakannya karena merujuk pada hadiah sebelum diterima; dan Al-Jassas menganggap pemenuhan adalah yang paling tepat jika memungkinkan. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17546} Kelima: Menepati janji semata bukanlah kewajiban, sedangkan janji bersyarat tidak dapat dipisahkan, yang merupakan mazhab Hanafi. Ibn Najim mengutip dari Al-Qunniyah bahwa janji hanya mengikat jika ditangguhkan. Pasal 84 Majalla al-Ahkam al-Adliyya menyatakan bahwa pengangkatan dalam bentuk penangguhan adalah mengikat. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.17546} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17547} Al-Qur'an seperti itu siapa pun berkata: Bayar hutangku dari tuanmu, berjanji lalu menolak, dia tidak terikat olehnya; dan siapa pun berkata: Jual kepada si anu, dan jika dia tidak memberikan harganya, aku akan memberikannya, dia wajib membayar harga itu, karena penangguhan itu memberi kekuatan pada janji. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17546} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17547} Mereka yang menyangkal kewajiban pemenuhan menyalahkan orang yang berjanji sambil menyembunyikan janji, dan mereka mengaitkan hadits ayat munafik kepada orang yang memutuskan untuk melanggar janji saat janji, bukan pada orang yang punya alasan. Al-Ghazali berkata demikian. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17547} Pendapat keenam: Jika janji terkait dengan suatu alasan dan orang yang dijanjikan masuk ke dalamnya, maka janji itu harus dipenuhi sesuai dengan kontrak yang harus dilakukan. Jika pihak yang dijanjikan tidak memenuhi tujuan, maka tidak ada yang menjadi tanggung jawab penjanji, seperti seseorang yang berjanji akan memajukan harga rumah dan orang yang dijanjikan membelinya, atau memberikan mas kawin dan menikah berdasarkan janji tersebut; ini adalah pendapat yang terkenal di sekolah Malik dan Al-Qarafi mengaitkannya dengan Malik, Ibn al-Qasim, dan Sahnun. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17548} Pendapat ketujuh: Jika janji terkait dengan suatu sebab, maka harus dipenuhi dengan sebuah keputusan, apakah janji itu termasuk dalam sebab atau tidak, dan jika tidak terkait dengan suatu sebab, maka pemenuhan tidak diperlukan. Ini termasuk perkataan Asbagh yang diceritakan oleh Al-Baji: Jika masa tunggu dijelaskan, seperti mengatakan, 'Aku meminjamkan tungganganku kepadamu untuk si dan itu,' dan dia berkata, 'Aku akan meminjamkan besok,' dia memutuskan pemenuhannya; tetapi jika itu ambigu, seperti mengatakan 'Aku meminjamkan seratus tapi tidak menyebutkan kebutuhannya,' dia tidak memutuskan hal itu; pandangan Maliki dalam pandangan yang tampak bertentangan dengan ini. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17548} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17549} Pengecualian dalam janji: Sebagian besar ahli hukum menyatakan bahwa orang yang membuat janji harus membuat pengecualian dengan mengatakan \"Insya Allah,\" seperti yang dikatakan Allah dalam Surah Al-Kahf. Karena orang yang berjanji tidak tahu apakah dia akan dipenuhi, mereka berbeda pendapat dalam putusannya: Al-Ghazali menganggapnya lebih baik, Al-Jassas menganggap meninggalkan pengecualian tidak disukai, dan Hanbalis melarang janji tanpa pengecualian. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17549} Janji: tindakan di mana setiap orang menghitung temannya; jika salah satu berjanji kepada yang lain, maka ini adalah 'iddah' (masa tunggu). Menurut Maliki, dasar larangan kencan adalah karena hal yang tidak bisa langsung terjadi untuk menghalangi alasan, seperti janji pernikahan selama masa tunggu, menjual makanan sebelum menerimanya, menjual pada saat panggilan Jumat, dan menjual apa yang tidak dimiliki. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17549} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.17550} Mengenai kesepakatan untuk konjugasi (infleksi), ada tiga pendapat menurut Maliki: permissibility, prohibition, yang merupakan pandangan umum, dan ketidaksukaan. Al-Wansharisi membedakan antara larangan dalam kasus di mana membuat kontrak dilarang dan menggunakan kontrak yang tidak dilarang. Al-Shafi'i mengatakan tidak ada salahnya jika kedua pria sepakat untuk konjugasi lalu berjanji. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17550}"
