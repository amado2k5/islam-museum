label:
  ar: "وَعْد"
  en: "Wa'd (promise, fiqh)"
summary:
  ar: "الوعد في اللغة يُستعمل في الخير والشر، والعِدة الوعد. وفي الاصطلاح الإخبار بإيصال الخير في المستقبل. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17543}\n\nالألفاظ ذات الصلة: العهد، وهو الوعد المقرون بشرط، ويقتضي الوفاء، أما الوعد فيقتضي الإنجاز؛ والوأي، وهو الوعد الموثَّق الذي يعزم الواعد على الوفاء به، وقال أبو هلال العسكري إن الوعد يكون مؤقتاً وغير مؤقت، والوأي غير مؤقت. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17543}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17544}\n\nالوفاء بالوعد: إن كان الوعد بشيء منهيّ عنه فلا يجوز إنجازه بل يجب إخلافه؛ وإن كان بشيء واجب وجب إنجازه؛ وإن كان بمباح أو مندوب فينبغي إنجازه، لأن الوفاء من مكارم الأخلاق، ومدح الكتاب إسماعيل بأنه كان صادق الوعد. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17544}\n\nاختلف الفقهاء في حكم الوفاء بالوعد المباح على سبعة أقوال: {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17544}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17545} الأول: أن إنجاز الوعد واجب، وإليه ذهب عمر بن عبد العزيز وابن شبرمة، ووجه في مذهب أحمد اختاره ابن تيمية، وقول في المالكية؛ واستدلوا بقوله تعالى في سورة الصف، وبحديث «آية المنافق ثلاث». {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17545} الثاني: أن إنجاز الوعد واجب إلا لعذر، وهو رأي ابن العربي، واستدل بحديث زيد بن أرقم في أن من وعد ونوى أن يفي فلم يفِ فلا جناح عليه؛ وقد ضعّفه الترمذي لأن فيه راويين مجهولين. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17545} الثالث: يجب الوفاء ديانةً لا قضاءً، وهو رأي تقي الدين السبكي. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17546} الرابع: أن الوفاء مستحب، فلو تركه فاته الفضل وارتكب مكروهاً كراهة تنزيه شديدة ولم يأثم، وهو رأي جمهور المالكية والشافعية والحنابلة، وقال النووي إن الوفاء مستحب استحباباً متأكداً وتُكره شديداً إخلافه. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17546} وقال ابن مفلح لا يلزم الوفاء بالوعد نصّ عليه أحمد، وقاله أكثر العلماء لأنه في معنى الهبة قبل القبض؛ والجصاص يرى الأولى الوفاء مع الإمكان. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17546} الخامس: أن إنجاز الوعد المجرد غير واجب، أما الوعد المعلّق على شرط فلازم، وهو مذهب الحنفية، ونقل ابن نجيم عن القنية أن الوعد لا يلزم إلا إذا كان معلقاً، ونصت المادة 84 من مجلة الأحكام العدلية على أن المواعيد بصور التعاليق تكون لازمة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17546}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17547} ومثّل الكتاب بأن من قال: ادفع ديني من مالك فوعده ثم امتنع لا يلزمه، ومن قال: بع لفلان وإن لم يعطك ثمنه فأنا أعطيه، فيلزمه أداء الثمن، لأن التعليق يكسب الوعد قوة. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17546}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17547} والنافون لوجوب الوفاء حملوا الذم في آية الصف على من وعد وهو يضمر الإخلاف، وحملوا حديث آية المنافق على من عزم على الإخلاف حال الوعد لا من طرأ له عذر، وقال الغزالي ذلك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17547}\n\nالقول السادس: إن كان الوعد مرتبطاً بسبب فدخل الموعود فيه وجب الوفاء به كما يجب الوفاء بالعقد، وإن لم يباشر الموعود السبب فلا شيء على الواعد، كمن وعد بسلف ثمن دار فاشتراها الموعود، أو بسلف مهر فتزوج اعتماداً على الوعد؛ وهذا القول المشهور في مذهب مالك، وعزاه القرافي إلى مالك وابن القاسم وسحنون. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17548}\n\nالقول السابع: إن كان الوعد مرتبطاً بسبب وجب الوفاء به قضاءً، دخل الموعود في السبب أو لم يدخل، وإن لم يكن مرتبطاً بسبب فلا يجب الوفاء به؛ وفي ذلك قول أصبغ الذي حكاه الباجي: إن كانت العدة مفسرة كأن يقول أعيرك دابتي إلى موضع كذا فيقول أعيرك غداً يُحكم بإنجازها، وإن كانت مبهمة كأن يقول أسلفني مائة ولا يذكر حاجته فلا يُحكم بها؛ والمالكية في ظاهر المذهب على خلاف هذا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17548}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17549}\n\nالاستثناء في الوعد: نص أكثر الفقهاء على أن ينبغي للواعد أن يستثني بقوله «إن شاء الله» لقوله تعالى في سورة الكهف، ولأن الواعد لا يدري هل يقع منه الوفاء؛ واختلفوا في حكمه: الغزالي يراه الأولى، والجصاص يرى ترك الاستثناء مكروهاً، والحنابلة يحرمون الوعد بغير استثناء. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17549}\n\nالمواعدة: مفاعلة يعِد فيها كل واحد صاحبه، فإن وعد أحدهما دون الآخر فهذه عِدة. وعند المالكية أصل منع المواعدة على ما لا يصح وقوعه في الحال سداً للذريعة، كالمواعدة على النكاح في العدة، وعلى بيع الطعام قبل قبضه، وعلى البيع وقت نداء الجمعة، وعلى بيع ما ليس عندك. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17549}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17550} وأما المواعدة على الصرف ففيها ثلاثة أقوال عند المالكية: الجواز، والمنع وهو المشهور، والكراهة؛ وفرّق الونشريسي بين المنع فيما يحرم إبرامه وبين الصرف الذي لا يُحرم إبرام عقده، وقال الشافعي إنه لا بأس أن يتواعد الرجلان على الصرف ثم يتبايعا. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17550}"
  en: "Wa'd, lexically, is used for good and for evil; 'idda is the promise. Technically it is the statement that a good thing will reach someone in the future. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17543}\n\nRelated words: 'ahd, a promise tied to a condition, which calls for fulfilment, while wa'd calls for carrying it out; wa'y, a promise firmly bound by the one who promises, which Abu Hilal al-Askari says is not limited to a time, while the promise may be. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17543}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17544}\n\nFulfilling a promise: a promise of a forbidden thing must not be fulfilled and must be broken; a promise of an obligatory thing must be fulfilled; a promise of a permitted or recommended thing ought to be fulfilled, since fulfilment is part of good conduct, and the book cites the praise of Isma'il in sura Maryam for keeping his promise. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17544}\n\nOn the fulfilment of a promise of a permitted act, there are seven views. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17544}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17545} The first: fulfilment is obligatory, held by Umar ibn Abd al-Aziz, Ibn Shubruma, a Hanbali view chosen by Ibn Taymiyya and a Maliki view, citing sura al-Saff (cited by sura only) and the hadith that the sign of the hypocrite is three, including breaking a promise. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17545} The second: obligatory unless there is an excuse, the view of Ibn al-'Arabi, who relies on the report of Zayd ibn Arqam that one who promises meaning to keep it and does not is not sinful; al-Tirmidhi weakens that report because two of its transmitters are unknown. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17545} The third: obligatory before God but not in court, the view of Taqi al-Din al-Subki. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17546} The fourth: recommended; omitting it loses the merit and is a strongly disliked act, but not a sin. This is the view of most Malikis, Shafi'is and Hanbalis; al-Nawawi calls fulfilment strongly recommended and breaking it strongly disliked. Ibn Muflih says it is not obligatory, since a promise is like a gift before possession; al-Jassas says it is better to fulfil it when possible. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17546} The fifth: a bare promise is not obligatory, but a conditional one is binding; this is the Hanafi view, and the Majalla of Ottoman law, article 84, states that promises in the form of conditions are binding. The book gives the example: a man who says pay my debt from your money, and is not held if he does not; a man who says sell this to so-and-so and if he does not pay I will, is held to pay, since the condition gives the promise force. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17546}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17547} Those who deny the duty read the blame in sura al-Saff as directed at one who promises while intending to break it, and read the hadith on the hypocrite as directed at one who intends to break the promise at the time of promising, not one who is prevented by something later; al-Ghazali says this. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17547}\n\nThe sixth view: a promise tied to a cause that the promisee has entered must be kept, as a contract must be; if the promisee has not begun the cause, the promiser owes nothing. An example: a man promises to lend the price of a house which the promisee then buys, or to lend a dower on which the promisee marries relying on the promise. This is the well-known and preferred Maliki view, which al-Qarafi attributes to Malik, Ibn al-Qasim and Sahnun. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17548}\n\nThe seventh view: a promise tied to a cause must be kept by judgement, whether or not the promisee has entered the cause; a promise not tied to a cause need not be kept. Asbagh, as al-Baji reports, distinguishes: if the promise is explicit, as when one says 'I will lend you my mount to a place' and the other says 'I will lend it tomorrow', he judges it binding; if it is vague, as when one asks for a loan of a hundred without giving a need, he does not. The ordinary Maliki view runs against this. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17548}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17549}\n\nPromising with a reservation: most jurists hold it is best to add 'if God wills', following the verse of sura al-Kahf, since the promiser does not know whether he will fulfil it. Al-Ghazali holds the reservation better; al-Jassas holds that a promise without it is disliked; the Hanbalis hold a promise without it forbidden. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17549}\n\nMutual promising (mu'ada): a promise made by both sides, where a promise made by one alone is an 'idda. The Malikis, on the principle of blocking means, forbid promises about what cannot be done at the moment: for example, promising marriage during the waiting period, promising to sell food before receiving it, promising a sale at the time of the Friday call, or selling what one does not possess. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17549}{cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17550} On promising currency exchange, the Malikis have three views: permitted, forbidden (the better-known view), and disliked. Al-Wansharisi explains the difference: the prohibition applies where the contract itself is forbidden, while the exchange contract is not forbidden in itself. Al-Shafi'i says two men may promise to exchange silver and later trade it. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.17550}"
