label:
  ar: "أرض"
  en: "Ard (land: purity, places and rulings)"
  fr: "Ard (terre : pureté, lieux et règles juridiques)"
  ur: "ارض ⁦(زمین کے احکام)⁩"
  es: "Ard (tierra: pureza, lugares y normas)"
  tr: "Arazi"
  id: "Tanah"
summary:
  ar: "الأرض الأصل فيها الطهارة، وتطهر من النجاسة المائعة بالغمر بالماء، وتطهر من النجاسة الجامدة بالإزالة. وتفصيل الصلاة عليها، وأحكام أرض العذاب من النهي عن الدخول بغير خشوع ومن الانتفاع بمائها، وأحكام الصلاة فيها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2193} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2196}"
  en: "Land is pure by default. An impurity that is liquid is cleansed by flooding the ground with water; a solid impurity is cleansed by removing it. The entry also covers prayer on land, the land of torment with its prohibition of entering it without awe and its water, and the sacred precinct. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2193} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2196}"
  fr: "La terre est pure par défaut. Une impureté liquide se nettoie en submergeant le sol d’eau ; une impureté solide se nettoie en l’enlevant. L’entrée traite aussi de la prière sur la terre, de la terre du châtiment avec l’interdiction d’y entrer sans crainte révérencielle et la question de son eau, ainsi que du territoire sacré. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2193} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2196}"
  ur: "زمین بنیادی طور پر پاک ہے۔ مائع نجاست کو پانی بہا کر اور جامد نجاست کو ہٹا کر پاک کیا جاتا ہے۔ اس مدخل میں زمین پر نماز، عذاب کی زمین ⁦(بغیر خشوع کے داخلے کی ممانعت اور اس کے پانی کا حکم)⁩ اور حرم کی زمین کے احکام بھی ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2193} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2196}"
  es: "La tierra es pura por naturaleza. Una impureza líquida se purifica inundando el suelo con agua; una impureza sólida se purifica retirándola. La entrada también abarca la oración en la tierra, la tierra del tormento con su prohibición de entrar en ella sin reverencia y su agua, y el recinto sagrado. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2193} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2196}"
  tr: "Toprak başlangıçta arındırılır, suya daldırarak sıvı kirlerden arındırılır ve katı kirlerden çıkarılarak arındırılır. Üzerine yapılan dua, ceza diyarının alçakgönüllülükle girip suyundan faydalanma kararları ve orada dua etme kuralları ayrıntılı açıklamadır. {atıf:fiqh-mawsua-kuwaitiyya-noor-v3 s.2193} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 s.2196}"
  id: "Bumi awalnya dimurnikan, dimurnikan dari kotoran cair dengan mencelupkan air, dan dimurnikan dari kotoran padat dengan cara dihilangkan. Penjelasan rinci tentang doa di atasnya, aturan tanah hukuman agar tidak masuk tanpa kerendahan hati dan mendapat manfaat dari airnya, serta aturan berdoa di dalamnya. {cite:fiqh-mawsua-kuwaityya-noor-v3 hlm.2193} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 hlm.2196}"
