  en: "Ard (land: purity, places and rulings)"
  ur: "ارض (زمین کے احکام)"
summary:
  ar: "الأرض الأصل فيها الطهارة، وتطهر من النجاسة المائعة بالغمر بالماء، وتطهر من النجاسة الجامدة بالإزالة. وتفصيل الصلاة عليها، وأحكام أرض العذاب من النهي عن الدخول بغير خشوع ومن الانتفاع بمائها، وأحكام الصلاة فيها. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2193} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2196}"
  en: "Land is pure by default. An impurity that is liquid is cleansed by flooding the ground with water; a solid impurity is cleansed by removing it. The entry also covers prayer on land, the land of torment with its prohibition of entering it without awe and its water, and the sacred precinct. {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2193} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2196}"
  ur: "زمین بنیادی طور پر پاک ہے۔ مائع نجاست کو پانی بہا کر اور جامد نجاست کو ہٹا کر پاک کیا جاتا ہے۔ اس مدخل میں زمین پر نماز، عذاب کی زمین (بغیر خشوع کے داخلے کی ممانعت اور اس کے پانی کا حکم) اور حرم کی زمین کے احکام بھی ہیں۔ {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2193} {cite:fiqh-mawsua-kuwaitiyya-noor-v3 p.2196}"
