id: concept/canon-the-veins-of-the-head-in-venesection
class: concept
kind: scientific
label: { ar: "عروق الرأس المفصودة عند ابن سينا", en: "The veins of the head in venesection in the Canon", ur: "قانون میں سر کی کھولی جانے والی رگیں", es: "Las venas de la cabeza en la venesección en el Canon", fr: "Les veines de la tête lors de la saignée dans le Canon" }
summary:
  ar: "يذكر ابن سينا أوردة الرأس المفصودة، عرق الجبهة وعرقي الصدغين وعرقي المأقين والعروق الصغار خلف الأذن، ومنافعها، وأن العروق التي في ناحية الرأس إلا الوداج تفصد مورباً، ويورد إنكار جالينوس لقول في عرقين خلف الأذنين {cite:canon-ibn-sina-print-v1 p.297}."
  en: "Ibn Sina names the veins of the head that are opened, the vein of the forehead, the two veins of the temples, the two of the corners of the eyes and the small veins behind the ear, with their uses, says that the vessels about the head, except the jugular, are opened obliquely, and cites Galen's denial of a claim about two veins behind the ears {cite:canon-ibn-sina-print-v1 p.297}."
  es: "Ibn Sina nombra las venas de la cabeza que están abiertas, la vena de la frente, las dos venas de las sienes, las dos de las comisuras de los ojos y las pequeñas venas detrás de la oreja, con sus usos, dice que los vasos alrededor de la cabeza, excepto la yugular, están abiertos oblicuamente, y cita la negación de Galeno de una afirmación sobre dos venas detrás de las orejas {cite:canon-ibn-sina-print-v1 p.297}."
  fr: "Ibn Sina nomme les veines de la tête qui sont ouvertes, la veine du front, les deux veines des tempes, les deux des coins des yeux et les petites veines derrière l'oreille, avec leurs usages, dit que les vaisseaux autour de la tête, à l'exception de la veine jugulaire, sont ouverts obliquement, et cite le refus de Galien d'une affirmation concernant deux veines derrière les oreilles {cite:canon-ibn-sina-print-v1 p.297}."
