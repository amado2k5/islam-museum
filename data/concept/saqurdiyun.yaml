  en: "Saqurdiyun (the wild garlic)"
  ur: "سقوردیون"
  es: "Saqurdiyun (el ajo silvestre)"
  fr: "Saqurdiyun (l'ail sauvage)"
  tr: "Skordeon"
  id: "Scordion"
summary:
  ar: "سقورديون في الكتاب هو الثوم البري، أصغر بكثير من البستاني، له ورق وساق متطاول عليه زهر أبيض، حار يابس إلى الثالثة بل إلى الرابعة عند قوم، لطيف مفتح جلاء، يدمل الجراحات العظيمة والخبيثة ويصلح لفسخ العضل {cite:canon-ibn-sina-print-v1 p.587}."
  en: "Saqurdiyun is in the book the wild garlic, much smaller than the garden kind, with leaves and a long stem bearing a white flower, hot and dry to the third degree, or to the fourth according to others, subtle, opening and cleansing; it heals great and malignant wounds and is good for strain of the muscle {cite:canon-ibn-sina-print-v1 p.587}."
  ur: "سقوردیون کتاب میں جنگلی لہسن ہے، باغ کی قسم سے بہت چھوٹا، پتوں اور لمبے تنے والا جس پر سفید پھول ہے، تیسرے درجے تک گرم خشک بلکہ بعض کے نزدیک چوتھے تک، لطیف، کھولنے اور جلا دینے والا؛ بڑے اور خبیث زخموں کو بھرتا ہے اور پٹھے کی موچ کے لیے اچھا ہے {cite:canon-ibn-sina-print-v1 p.587}۔"
  es: "Saqurdiyun es en el libro el ajo silvestre, mucho más pequeño que el de jardín, con hojas y un tallo largo que lleva una flor blanca, caliente y seco hasta el tercer grado, o hasta el cuarto según otros, sutil, abre y limpia; cura heridas grandes y malignas y es bueno para la distensión muscular {cite:canon-ibn-sina-print-v1 p.587}."
  fr: "Saqurdiyun est décrit dans le livre comme l'ail sauvage, beaucoup plus petit que l'ail des jardins, avec des feuilles et une longue tige portant une fleur blanche, chaud et sec au troisième degré, ou au quatrième selon d'autres, subtil, ouvrant et purifiant; il guérit les grandes et les malignes plaies et est bon pour les tensions musculaires {cite:canon-ibn-sina-print-v1 p.587}."
  tr: "Kitapta Scordion, bahçıvandan çok daha küçük, uzun yaprakları ve sapları beyaz çiçeklerle kaplı, bazı kişilerde üçte biri hatta dördüncü çiçeklere kadar sıcak ve kuru, nazik ve açık, büyük ve kötü niyetli yaraları iyileştiren, kas atrofisi için uygun {cite:canon-ibn-sina-print-v1 s.587}."
  id: "Dalam buku, Scordion adalah bawang putih liar, jauh lebih kecil dari tukang kebun, dengan daun dan batang yang memanjang yang ditutupi bunga putih, panas dan kering hingga ketiga atau bahkan keempat pada beberapa orang, lembut dan terbuka, menyembuhkan luka besar dan ganas, dan cocok untuk atrofi otot {cite:canon-ibn-sina-print-v1 hlm.587}."
