label: { ar: "الشتاء وأمراضه عند ابن سينا", en: "Winter and its diseases in the Canon", ur: "سردی کا موسم اور اس کی بیماریاں قانون میں", es: "El invierno y sus enfermedades en el canon", fr: "L'hiver et ses maladies dans le Canon", tr: "İbn Sina'ya göre kış ve kış hastalıkları", id: "Musim dingin dan penyakit-penyakitnya menurut Ibnu Sina" }
summary:
  ar: "يبين ابن سينا أن الشتاء أجود الفصول للهضم وأن أمراضه بلغمية في الأكثر، وما يصيب فيه الشيوخ والمتوسطين {cite:canon-ibn-sina-print-v1 pp.119-120}."
  en: "Ibn Sina shows winter as the best season for digestion and one whose diseases are mostly phlegmatic, and says who is harmed and who gains {cite:canon-ibn-sina-print-v1 pp.119-120}."
  es: "Ibn Sina muestra el invierno como la mejor estación para la digestión y una cuyas enfermedades son mayoritariamente flemáticas, y dice quién sale perjudicado y quién gana {cite:canon-ibn-sina-print-v1 pp.119-120}."
  fr: "Ibn Sina montre que l'hiver est la meilleure saison pour la digestion et celle dont les maladies sont principalement flegmatiques, et dit qui est lésé et qui gagne {cite:canon-ibn-sina-print-v1 pp.119-120}."
  ur: "ابن سینا سردیوں کو ہاضمے کے لیے بہترین موسم اور جس کی بیماریاں زیادہ تر بلغمی ہوتی ہیں کے طور پر بتاتے ہیں اور کہتے ہیں کہ کس کو نقصان ہوتا ہے اور کس کو فائدہ ہوتا ہے۔"
  tr: "İbn Sina, kışın sindirim için en iyi mevsim olduğunu, kış hastalıklarının çoğunlukla balgamla ilgili olduğunu ve yaşlı ve orta yaşlı insanları etkilediğini belirtmektedir. {cite:canon-ibn-sina-print-v1 pp.119-120}"
  id: "Ibn Sina menunjukkan bahwa musim dingin adalah musim terbaik untuk pencernaan dan bahwa penyakit-penyakitnya sebagian besar bersifat flegmatik, dan bahwa penyakit tersebut menyerang orang lanjut usia dan orang-orang setengah baya {cite:canon-ibn-sina-print-v1 pp.119-120}."
